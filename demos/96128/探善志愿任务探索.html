<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>探善 · 志愿任务探索地图</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans SC", "PingFang SC", sans-serif;
    background: #faf7f2;
    color: #3e3a35;
    min-height: 100vh;
  }
  .nav-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 32px;
    border-bottom: 1px solid #e0d8cc;
    background: #fff;
  }
  .nav-brand { display: flex; align-items: center; gap: 12px; }
  .nav-brand .compass {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #b8860b, #d4a854);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 1.4rem;
  }
  .nav-brand h1 { font-family: "Playfair Display", serif; font-size: 1.6rem; font-weight: 700; color: #3e3a35; }
  .nav-brand h1 small { display: block; font-size: 0.65rem; color: #b8860b; font-weight: normal; letter-spacing: 3px; }
  .user-bar { display: flex; align-items: center; gap: 18px; }
  .user-bar .level {
    background: #f5efe0;
    border: 1px solid #d4a854;
    color: #b8860b;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    letter-spacing: 1px;
  }
  .user-bar .avatar {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, #8e6e3e, #b8860b);
    border-radius: 50%;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold;
  }
  .hero-banner {
    padding: 40px 32px;
    text-align: center;
    position: relative;
    background: linear-gradient(180deg, #f5efe0 0%, #faf7f2 100%);
    border-bottom: 1px solid #e0d8cc;
  }
  .hero-banner .giant-quote {
    font-family: "Playfair Display", serif;
    font-style: italic;
    font-size: 2.4rem;
    color: #b8860b;
    line-height: 1.3;
  }
  .hero-banner .sub { color: #8e7e6e; margin-top: 8px; font-size: 0.95rem; }
  .hero-banner .deco {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    background: #faf7f2;
    padding: 6px 18px;
    font-size: 0.7rem;
    color: #b8860b;
    letter-spacing: 3px;
    border: 1px solid #d4a854;
    border-radius: 12px;
  }
  .filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    padding: 24px 32px;
    border-bottom: 1px solid #e0d8cc;
  }
  .filters select, .filters input {
    padding: 10px 16px;
    border: 1px solid #d4c8b0;
    border-radius: 8px;
    font-size: 0.9rem;
    outline: none;
    font-family: inherit;
    background: #fff;
  }
  .filters button {
    padding: 10px 24px;
    background: linear-gradient(135deg, #b8860b, #d4a854);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
    letter-spacing: 1px;
  }
  .quest-grid {
    padding: 28px 32px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
  }
  .quest-card {
    background: #fff;
    border: 1px solid #e0d8cc;
    border-radius: 14px;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative;
  }
  .quest-card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(0,0,0,0.08); }
  .quest-card .cover {
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.2rem;
    position: relative;
  }
  .quest-card .cover .pin {
    position: absolute;
    top: 12px;
    right: 12px;
    font-size: 1.4rem;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
  }
  .cover.teach { background: linear-gradient(135deg, #e3f2fd, #90caf9); }
  .cover.care { background: linear-gradient(135deg, #fce4ec, #f48fb1); }
  .cover.env { background: linear-gradient(135deg, #e8f5e9, #a5d6a7); }
  .cover.tech { background: linear-gradient(135deg, #ede7f6, #b39ddb); }
  .quest-card .body {
    padding: 18px 20px;
  }
  .quest-card h3 { font-size: 1.1rem; color: #3e3a35; margin-bottom: 6px; }
  .quest-card .desc { font-size: 0.85rem; color: #8e7e6e; line-height: 1.6; margin-bottom: 12px; }
  .quest-card .meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .quest-card .meta span {
    padding: 3px 10px;
    border-radius: 14px;
    font-size: 0.75rem;
    background: #f5efe0;
    color: #8e6e3e;
  }
  .quest-card .action-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .quest-card .score {
    background: #f5efe0;
    color: #b8860b;
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .quest-card .join-btn {
    padding: 8px 20px;
    background: linear-gradient(135deg, #8e6e3e, #b8860b);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 1px;
  }
  .quest-card .join-btn:disabled { background: #d0c8b8; }
  .footer-slogan {
    text-align: center;
    padding: 30px;
    color: #b8860b;
    font-family: "Playfair Display", serif;
    font-style: italic;
    font-size: 1.1rem;
    border-top: 1px solid #e0d8cc;
  }
</style>
</head>
<body>
<div class="nav-top">
  <div class="nav-brand">
    <div class="compass">🧭</div>
    <h1>探善 <small>EXPLORE · GIVE BACK</small></h1>
  </div>
  <div class="user-bar">
    <span class="level">⭐ 探索者 · Lv.3</span>
    <div class="avatar">YL</div>
  </div>
</div>

<div class="hero-banner">
  <div class="giant-quote">"The best way to find yourself<br>is to lose yourself in the service of others."</div>
  <div class="sub">今天有 4 个任务等待你的加入</div>
  <div class="deco">MISSION BOARD</div>
</div>

<div class="filters">
  <select id="skillFilter">
    <option value="all">全部领域</option>
    <option value="teach">教育探索</option>
    <option value="care">关怀之路</option>
    <option value="env">自然守护</option>
    <option value="tech">技术支援</option>
  </select>
  <input type="text" id="locInput" placeholder="城市" value="北京" />
  <button onclick="filterQuests()">🔍 探索任务</button>
</div>

<div class="quest-grid" id="questGrid"></div>

<div class="footer-slogan">✦ Every small act creates ripples ✦</div>

<script>
  const quests = [
    { title: '乡村儿童编程启蒙课', location: '北京', skill: 'teach', cover: 'teach', tags: ['周末', '线上/线下'], desc: '为乡村小学提供1小时编程启蒙，打开数字世界大门。', score: '+120 善积分' },
    { title: '敬老院智能伴行计划', location: '北京', skill: 'care', cover: 'care', tags: ['周六下午', '线下'], desc: '教老人使用视频通话，跨越数字鸿沟。', score: '+80 善积分' },
    { title: '城市绿洲守护行动', location: '北京', skill: 'env', cover: 'env', tags: ['周日', '户外'], desc: '公园垃圾分类引导与环保宣导，守护城市绿意。', score: '+60 善积分' },
    { title: '公益数字工具搭建', location: '北京', skill: 'tech', cover: 'tech', tags: ['弹性', '远程'], desc: '协助 NGO 搭建线上工具，让善意触达更多人。', score: '+150 善积分' }
  ];
  function render(list) {
    const container = document.getElementById('questGrid');
    container.innerHTML = list.map((q, i) => `
      <div class="quest-card" style="animation: rise 0.4s ${i*0.1}s both;">
        <div class="cover ${q.cover}">
          <span class="pin">📍</span>
          ${q.skill === 'teach' ? '📚' : q.skill === 'care' ? '🤲' : q.skill === 'env' ? '🌳' : '💻'}
        </div>
        <div class="body">
          <h3>${q.title}</h3>
          <p class="desc">${q.desc}</p>
          <div class="meta">${q.tags.map(t => `<span>${t}</span>`).join('')}<span>📍${q.location}</span></div>
          <div class="action-row">
            <span class="score">${q.score}</span>
            <button class="join-btn" onclick="joinQuest(this)">接受任务</button>
          </div>
        </div>
      </div>
    `).join('');
  }
  function filterQuests() {
    const skill = document.getElementById('skillFilter').value;
    const loc = document.getElementById('locInput').value.trim();
    const filtered = quests.filter(q => (skill === 'all' || q.skill === skill) && q.location.includes(loc));
    render(filtered.length ? filtered : quests);
  }
  function joinQuest(btn) {
    btn.textContent = '已接受 ✓';
    btn.disabled = true;
    btn.style.background = '#66bb6a';
    alert('任务已接受！详细指引将以消息方式发送给你。');
  }
  const style = document.createElement('style');
  style.innerHTML = '@keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }';
  document.head.appendChild(style);
  render(quests);
</script>
</body>
</html>
