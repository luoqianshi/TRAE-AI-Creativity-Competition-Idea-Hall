<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>好日子还是坏日子？</title>
    <style>
        :root {
            --good-gradient: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            --bad-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --neutral-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --border-radius: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            min-height: 100vh;
            background: var(--neutral-gradient);
            transition: background 1s ease;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .modules {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .card-title {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title span {
            font-size: 1.8rem;
        }

        .weather-display {
            text-align: center;
        }

        .weather-icon {
            font-size: 5rem;
            margin-bottom: 15px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .weather-temp {
            font-size: 2.5rem;
            color: #FF6B6B;
            margin-bottom: 10px;
        }

        .weather-info {
            font-size: 1rem;
            color: #666;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .weather-select {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 1rem;
            margin-bottom: 10px;
            font-family: inherit;
            background: white;
            cursor: pointer;
        }

        .weather-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .weather-input {
            flex: 1;
            padding: 10px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            width: 100%;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        .btn-danger {
            background: #FF6B6B;
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 5px;
        }

        .traffic-status {
            text-align: center;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .traffic-smooth {
            background: #D4EDDA;
            color: #155724;
        }

        .traffic-light {
            background: #FFF3CD;
            color: #856404;
        }

        .traffic-heavy {
            background: #F8D7DA;
            color: #721C24;
        }

        .traffic-severe {
            background: #DC3545;
            color: white;
        }

        .traffic-progress {
            height: 20px;
            background: #eee;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .traffic-bar {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease, background 0.5s ease;
        }

        .traffic-bar.smooth { background: #28A745; }
        .traffic-bar.light { background: #FFC107; }
        .traffic-bar.heavy { background: #FD7E14; }
        .traffic-bar.severe { background: #DC3545; }

        .traffic-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            margin-bottom: 10px;
        }

        .traffic-suggestion {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .schedule-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .schedule-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .schedule-item:hover {
            background: #e9ecef;
        }

        .schedule-time {
            font-weight: bold;
            color: #FF6B6B;
            margin-right: 15px;
        }

        .schedule-title {
            flex: 1;
            color: #333;
        }

        .schedule-type {
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.7rem;
            color: white;
            margin-right: 10px;
        }

        .schedule-type.work { background: #4E79A7; }
        .schedule-type.life { background: #F28E2B; }
        .schedule-type.rest { background: #59A14F; }

        .schedule-input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .schedule-input-group input,
        .schedule-input-group select {
            padding: 10px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: inherit;
            background: white;
        }

        .schedule-input-group input:first-child {
            grid-column: span 2;
        }

        .evaluation-card {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .evaluation-emoji {
            font-size: 6rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-10px) rotate(-5deg); }
            75% { transform: translateY(-10px) rotate(5deg); }
        }

        .evaluation-title {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #333;
        }

        .evaluation-score {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .evaluation-score.good { color: #FFA500; }
        .evaluation-score.bad { color: #667eea; }

        .evaluation-comment {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .evaluation-details {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 1rem;
            color: #666;
        }

        .detail-item {
            text-align: center;
        }

        .detail-label {
            display: block;
            font-size: 0.8rem;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .detail-value {
            font-weight: bold;
            color: #333;
        }

        .btn-reset {
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin-top: 20px;
        }

        .btn-reset:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            .evaluation-emoji {
                font-size: 4rem;
            }

            .evaluation-title {
                font-size: 1.8rem;
            }

            .evaluation-score {
                font-size: 2rem;
            }

            .evaluation-details {
                flex-direction: column;
                gap: 15px;
            }

            .schedule-input-group {
                grid-template-columns: 1fr;
            }

            .schedule-input-group input:first-child {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌞 好日子还是坏日子？ 🥺</h1>
            <p>综合天气、交通和日程，看看今天是什么日子</p>
        </header>

        <div class="modules">
            <div class="card">
                <h2 class="card-title"><span>🌤️</span> 天气状况</h2>
                <div class="weather-display" id="weatherDisplay">
                    <div class="weather-icon">❓</div>
                    <div class="weather-temp">--°C</div>
                    <div class="weather-info">
                        <span>天气: --</span>
                        <span>湿度: --%</span>
                    </div>
                </div>
                <select class="weather-select" id="weatherType">
                    <option value="sunny">☀️ 晴朗</option>
                    <option value="cloudy">⛅ 多云</option>
                    <option value="overcast">☁️ 阴天</option>
                    <option value="light_rain">🌧️ 小雨</option>
                    <option value="heavy_rain">⛈️ 大雨</option>
                    <option value="snow">❄️ 雪</option>
                </select>
                <div class="weather-input-group">
                    <input type="number" class="weather-input" id="temperature" placeholder="温度 (°C)" min="-30" max="50">
                    <input type="number" class="weather-input" id="humidity" placeholder="湿度 (%)" min="0" max="100">
                </div>
                <button class="btn btn-primary" onclick="updateWeather()">更新天气</button>
            </div>

            <div class="card">
                <h2 class="card-title"><span>🚗</span> 交通状况</h2>
                <div class="traffic-status" id="trafficStatus">--</div>
                <div class="traffic-progress">
                    <div class="traffic-bar" id="trafficBar"></div>
                </div>
                <div style="text-align: center; margin-bottom: 15px; color: #666;">
                    拥堵指数: <span id="trafficValue">--</span>/100
                </div>
                <input type="range" class="traffic-input" id="trafficSlider" min="0" max="100" value="30">
                <div class="traffic-suggestion" id="trafficSuggestion">请设置交通状况</div>
                <button class="btn btn-primary" onclick="updateTraffic()">更新交通</button>
            </div>

            <div class="card">
                <h2 class="card-title"><span>📅</span> 日程安排</h2>
                <div class="schedule-list" id="scheduleList">
                    <div style="text-align: center; color: #999; padding: 30px;">暂无日程</div>
                </div>
                <div class="schedule-input-group">
                    <input type="text" id="scheduleTitle" placeholder="日程内容">
                    <input type="time" id="scheduleTime">
                    <select id="scheduleType">
                        <option value="work">💼 工作</option>
                        <option value="life">🎯 生活</option>
                        <option value="rest">😴 休息</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="addSchedule()">添加日程</button>
            </div>
        </div>

        <div class="evaluation-card">
            <div class="evaluation-emoji" id="evaluationEmoji">🤔</div>
            <div class="evaluation-title" id="evaluationTitle">等待评价...</div>
            <div class="evaluation-score" id="evaluationScore">--</div>
            <div class="evaluation-comment" id="evaluationComment">请先设置天气、交通和日程信息</div>
            <div class="evaluation-details">
                <div class="detail-item">
                    <span class="detail-label">天气得分</span>
                    <span class="detail-value" id="weatherScore">--</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">交通得分</span>
                    <span class="detail-value" id="trafficScore">--</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">日程得分</span>
                    <span class="detail-value" id="scheduleScore">--</span>
                </div>
            </div>
            <button class="btn btn-reset" onclick="resetAll()">重新开始</button>
        </div>
    </div>

    <script>
        var weatherIcons = {
            sunny: '☀️',
            cloudy: '⛅',
            overcast: '☁️',
            light_rain: '🌧️',
            heavy_rain: '⛈️',
            snow: '❄️'
        };

        var weatherNames = {
            sunny: '晴朗',
            cloudy: '多云',
            overcast: '阴天',
            light_rain: '小雨',
            heavy_rain: '大雨',
            snow: '下雪'
        };

        var weatherScores = {
            sunny: 100,
            cloudy: 80,
            overcast: 60,
            light_rain: 40,
            heavy_rain: 20,
            snow: 20
        };

        var goodComments = [
            "今天是个好日子！阳光明媚，心情愉悦！🎉",
            "太棒了！今天运气爆棚，万事顺意！✨",
            "好日子来啦！今天适合出门游玩！🌞",
            "心情美美哒！今天一切都会很顺利！🌈",
            "大吉大利！今天是你的幸运日！🍀"
        ];

        var badComments = [
            "今天有点小糟糕，不过别灰心！💪",
            "坏日子总会过去的，明天会更好！🌙",
            "今天可能有点挑战，加油挺过去！🔥",
            "虽然今天不太顺，但也要保持微笑！😊",
            "这只是暂时的，好运马上就来！⭐"
        ];

        var weatherData = { type: '', temperature: '', humidity: '' };
        var trafficData = { congestion: 30 };
        var scheduleData = [];

        function updateWeather() {
            var type = document.getElementById('weatherType').value;
            var temperature = document.getElementById('temperature').value;
            var humidity = document.getElementById('humidity').value;

            weatherData = { type: type, temperature: temperature, humidity: humidity };

            var icon = weatherIcons[type] || '❓';
            var name = weatherNames[type] || '--';

            document.getElementById('weatherDisplay').innerHTML =
                '<div class="weather-icon">' + icon + '</div>' +
                '<div class="weather-temp">' + (temperature || '--') + '°C</div>' +
                '<div class="weather-info">' +
                '<span>天气: ' + name + '</span>' +
                '<span>湿度: ' + (humidity || '--') + '%</span>' +
                '</div>';

            calculateEvaluation();
        }

        document.getElementById('trafficSlider').addEventListener('input', function(e) {
            var value = parseInt(e.target.value);
            updateTrafficDisplay(value);
        });

        function updateTraffic() {
            var value = parseInt(document.getElementById('trafficSlider').value);
            trafficData.congestion = value;
            calculateEvaluation();
        }

        function updateTrafficDisplay(value) {
            var status, colorClass, suggestion;

            if (value < 30) {
                status = '🚀 畅通';
                colorClass = 'smooth';
                suggestion = '路况很好，可以放心出行！';
            } else if (value < 60) {
                status = '🐢 缓行';
                colorClass = 'light';
                suggestion = '路况一般，建议提前出发！';
            } else if (value < 85) {
                status = '🚦 拥堵';
                colorClass = 'heavy';
                suggestion = '路况拥堵，建议选择公共交通！';
            } else {
                status = '😱 严重拥堵';
                colorClass = 'severe';
                suggestion = '严重拥堵，尽量避免出行！';
            }

            var statusEl = document.getElementById('trafficStatus');
            statusEl.textContent = status;
            statusEl.className = 'traffic-status traffic-' + colorClass;

            var bar = document.getElementById('trafficBar');
            bar.style.width = value + '%';
            bar.className = 'traffic-bar ' + colorClass;

            document.getElementById('trafficValue').textContent = value;
            document.getElementById('trafficSuggestion').textContent = suggestion;
        }

        function addSchedule() {
            var title = document.getElementById('scheduleTitle').value;
            var time = document.getElementById('scheduleTime').value;
            var type = document.getElementById('scheduleType').value;

            if (!title || !time) {
                alert('请填写完整的日程信息！');
                return;
            }

            var item = {
                id: Date.now(),
                title: title,
                time: time,
                type: type
            };

            scheduleData.push(item);
            renderScheduleList();
            calculateEvaluation();

            document.getElementById('scheduleTitle').value = '';
            document.getElementById('scheduleTime').value = '';
        }

        function deleteSchedule(id) {
            scheduleData = scheduleData.filter(function(item) {
                return item.id !== id;
            });
            renderScheduleList();
            calculateEvaluation();
        }

        function renderScheduleList() {
            var list = document.getElementById('scheduleList');
            
            if (scheduleData.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: #999; padding: 30px;">暂无日程</div>';
                return;
            }

            scheduleData.sort(function(a, b) {
                return a.time.localeCompare(b.time);
            });

            list.innerHTML = scheduleData.map(function(item) {
                return '<div class="schedule-item">' +
                    '<span class="schedule-time">' + item.time + '</span>' +
                    '<span class="schedule-title">' + item.title + '</span>' +
                    '<span class="schedule-type ' + item.type + '">' + getTypeLabel(item.type) + '</span>' +
                    '<button class="btn btn-danger" onclick="deleteSchedule(' + item.id + ')">删除</button>' +
                    '</div>';
            }).join('');
        }

        function getTypeLabel(type) {
            var labels = {
                work: '工作',
                life: '生活',
                rest: '休息'
            };
            return labels[type] || type;
        }

        function calculateEvaluation() {
            var weatherScore = 0;
            var trafficScore = 0;
            var scheduleScore = 0;

            if (weatherData.type) {
                weatherScore = weatherScores[weatherData.type];
                if (weatherData.temperature) {
                    var temp = parseInt(weatherData.temperature);
                    if (temp >= 18 && temp <= 28) {
                        weatherScore += 10;
                    } else if (temp < 0 || temp > 35) {
                        weatherScore -= 10;
                    }
                }
                weatherScore = Math.min(100, Math.max(0, weatherScore));
            }

            trafficScore = 100 - trafficData.congestion;

            if (scheduleData.length === 0) {
                scheduleScore = 100;
            } else if (scheduleData.length <= 3) {
                scheduleScore = 70;
            } else if (scheduleData.length <= 5) {
                scheduleScore = 40;
            } else {
                scheduleScore = 20;
            }

            var workCount = scheduleData.filter(function(item) {
                return item.type === 'work';
            }).length;
            var restCount = scheduleData.filter(function(item) {
                return item.type === 'rest';
            }).length;
            
            if (workCount > scheduleData.length * 0.7) {
                scheduleScore -= 10;
            }
            if (restCount > 0) {
                scheduleScore += 15;
            }
            
            scheduleScore = Math.min(100, Math.max(0, scheduleScore));

            var totalScore = Math.round(weatherScore * 0.4 + trafficScore * 0.3 + scheduleScore * 0.3);

            updateEvaluationDisplay(totalScore, weatherScore, trafficScore, scheduleScore);
        }

        function updateEvaluationDisplay(totalScore, weatherScore, trafficScore, scheduleScore) {
            var isGood = totalScore >= 60;
            
            document.getElementById('weatherScore').textContent = weatherScore;
            document.getElementById('trafficScore').textContent = trafficScore;
            document.getElementById('scheduleScore').textContent = scheduleScore;

            var emoji = isGood ? '🎉' : '🥺';
            var title = isGood ? '好日子！' : '坏日子...';
            var comment = isGood 
                ? goodComments[Math.floor(Math.random() * goodComments.length)]
                : badComments[Math.floor(Math.random() * badComments.length)];

            document.getElementById('evaluationEmoji').textContent = emoji;
            document.getElementById('evaluationTitle').textContent = title;
            document.getElementById('evaluationScore').textContent = totalScore;
            document.getElementById('evaluationScore').className = 'evaluation-score ' + (isGood ? 'good' : 'bad');
            document.getElementById('evaluationComment').textContent = comment;

            document.body.style.background = isGood ? 'var(--good-gradient)' : 'var(--bad-gradient)';
        }

        function resetAll() {
            weatherData = { type: '', temperature: '', humidity: '' };
            trafficData = { congestion: 30 };
            scheduleData = [];

            document.getElementById('weatherType').value = 'sunny';
            document.getElementById('temperature').value = '';
            document.getElementById('humidity').value = '';
            document.getElementById('weatherDisplay').innerHTML =
                '<div class="weather-icon">❓</div>' +
                '<div class="weather-temp">--°C</div>' +
                '<div class="weather-info">' +
                '<span>天气: --</span>' +
                '<span>湿度: --%</span>' +
                '</div>';

            document.getElementById('trafficSlider').value = 30;
            updateTrafficDisplay(30);

            renderScheduleList();

            document.getElementById('evaluationEmoji').textContent = '🤔';
            document.getElementById('evaluationTitle').textContent = '等待评价...';
            document.getElementById('evaluationScore').textContent = '--';
            document.getElementById('evaluationScore').className = 'evaluation-score';
            document.getElementById('evaluationComment').textContent = '请先设置天气、交通和日程信息';
            document.getElementById('weatherScore').textContent = '--';
            document.getElementById('trafficScore').textContent = '--';
            document.getElementById('scheduleScore').textContent = '--';

            document.body.style.background = 'var(--neutral-gradient)';
        }

        updateTrafficDisplay(30);
    </script>
</body>
</html>
