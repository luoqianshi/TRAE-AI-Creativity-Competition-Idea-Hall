<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>守界AI · 最小可用演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+SC:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A2520;
    --ink-soft:#26332D;
    --paper:#F2EDE1;
    --paper-deep:#E4DCC8;
    --paper-line:#CFC5AA;
    --steel:#4A5A56;
    --steel-soft:#7C8B86;
    --signal:#C9551E;
    --signal-soft:#E0A07C;
    --brass:#8C7A4E;
    --ok:#4F7A5A;
    --ok-soft:#BFD6C4;
    font-size:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans SC','IBM Plex Sans',sans-serif;
    line-height:1.55;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  ::selection{background:var(--signal); color:var(--paper);}
  :focus-visible{outline:2px solid var(--signal); outline-offset:2px;}

  /* ── header ── */
  header{
    border-bottom:1px solid var(--paper-line);
    padding:18px 24px;
  }
  .header-row{
    max-width:760px;
    margin:0 auto;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  header h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:1.3rem;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  header h1 .dot{ color:var(--signal); }
  .header-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
    color:var(--steel-soft);
    letter-spacing:0.04em;
  }
  .disclaimer{
    max-width:760px;
    margin:8px auto 0;
    font-size:0.78rem;
    color:var(--steel-soft);
  }

  /* ── main layout ── */
  main{
    flex:1;
    max-width:760px;
    width:100%;
    margin:0 auto;
    padding:22px 24px 28px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  /* ── example launcher ── */
  .examples{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  @media (max-width:560px){
    .examples{grid-template-columns:1fr;}
  }
  .example-btn{
    text-align:left;
    background:var(--paper-deep);
    border:1px solid var(--paper-line);
    padding:13px 15px;
    cursor:pointer;
    transition:border-color 0.15s ease, transform 0.1s ease;
    font-family:inherit;
    color:var(--ink);
  }
  .example-btn:hover{ border-color:var(--steel); }
  .example-btn:active{ transform:translateY(1px); }
  .example-btn .ex-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--brass);
    display:block;
    margin-bottom:6px;
  }
  .example-btn.risk .ex-label{ color:var(--signal); }
  .example-btn .ex-text{
    font-size:0.88rem;
    font-weight:500;
  }

  /* ── chat panel ── */
  .panel{
    border:1px solid var(--paper-line);
    background:var(--paper);
    display:flex;
    flex-direction:column;
    min-height:420px;
  }
  .panel-head{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.7rem;
    color:var(--steel-soft);
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:10px 16px;
    border-bottom:1px solid var(--paper-line);
    background:var(--paper-deep);
  }

  .transcript{
    flex:1;
    overflow-y:auto;
    padding:18px 16px;
    display:flex;
    flex-direction:column;
    gap:16px;
    max-height:440px;
  }
  .empty-state{
    margin:auto;
    text-align:center;
    color:var(--steel-soft);
    font-size:0.86rem;
    max-width:280px;
  }

  .msg{ max-width:84%; }
  .msg.user{ align-self:flex-end; }
  .msg.assistant{ align-self:flex-start; }

  .bubble{
    padding:11px 14px;
    font-size:0.9rem;
  }
  .msg.user .bubble{
    background:var(--ink);
    color:var(--paper);
    border-radius:3px 3px 0 3px;
  }
  .msg.assistant .bubble{
    background:var(--paper-deep);
    border-left:3px solid var(--ok);
    border-radius:0 3px 3px 3px;
  }
  .msg.assistant.handoff .bubble{
    border-left:3px solid var(--signal);
  }

  .meta-strip{
    margin-top:7px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    align-items:center;
  }
  .chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.66rem;
    padding:3px 8px;
    border:1px solid var(--paper-line);
    color:var(--steel);
    background:var(--paper);
    white-space:nowrap;
  }
  .chip.module{ color:var(--ink); border-color:var(--steel); }
  .chip.ok{ color:var(--ok); border-color:var(--ok-soft); }
  .chip.warn{ color:var(--signal); border-color:var(--signal-soft); font-weight:600; }
  .chip.src{ color:var(--brass); }

  /* ── pipeline indicator ── */
  .pipeline{
    align-self:flex-start;
    max-width:84%;
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    padding:9px 11px;
    background:var(--paper-deep);
    border:1px dashed var(--paper-line);
  }
  .pl-step{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;
    padding:4px 8px;
    color:var(--steel-soft);
    background:var(--paper);
    border:1px solid var(--paper-line);
    opacity:0.45;
    transition:opacity 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .pl-step.active{
    opacity:1;
    color:var(--ink);
    border-color:var(--steel);
  }
  .pl-step.gate.active{
    color:var(--signal);
    border-color:var(--signal);
  }

  /* ── input row ── */
  .input-row{
    display:flex;
    gap:8px;
    padding:12px 14px;
    border-top:1px solid var(--paper-line);
    background:var(--paper-deep);
  }
  .input-row input{
    flex:1;
    border:1px solid var(--paper-line);
    background:var(--paper);
    padding:10px 12px;
    font-size:0.9rem;
    font-family:inherit;
    color:var(--ink);
  }
  .input-row input:focus{
    border-color:var(--steel);
    outline:none;
  }
  .input-row button{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    letter-spacing:0.03em;
    padding:0 18px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .input-row button:hover{ background:var(--ink-soft); }
  .input-row button:disabled{ opacity:0.4; cursor:default; }

  .hint{
    font-size:0.76rem;
    color:var(--steel-soft);
    padding:0 2px;
  }

  footer{
    text-align:center;
    padding:18px 24px 26px;
    font-size:0.74rem;
    color:var(--steel-soft);
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <h1>守界<span class="dot">·</span>AI</h1>
    <span class="header-tag mono">最小可用演示 · 本地规则模拟运行</span>
  </div>
  <p class="disclaimer">本页面为前端独立模拟，使用简化规则引擎还原意图识别→路由→检索→安全门禁的完整决策链路，不连接真实后端与大模型。</p>
</header>

<main>

  <div class="examples">
    <button class="example-btn" id="ex1" type="button">
      <span class="ex-label mono">示例一 · 标准问题自动应答</span>
      <span class="ex-text">SKU001今天下单多久发货</span>
    </button>
    <button class="example-btn risk" id="ex2" type="button">
      <span class="ex-label mono">示例二 · 风险问题安全拦截</span>
      <span class="ex-text">SKU001能不能便宜点，最低多少钱</span>
    </button>
  </div>

  <div class="panel">
    <div class="panel-head mono">CONVERSATION · 模拟会话</div>
    <div class="transcript" id="transcript">
      <div class="empty-state" id="emptyState">
        点击上方示例，或直接输入规格 / 物流 / 价格 / 质量相关问题，<br>
        观察系统如何路由与决策。
      </div>
    </div>
    <div class="input-row">
      <input id="queryInput" type="text" placeholder="例如：SKU001螺纹是多少 / 能发顺丰吗 / 是原厂件吗" aria-label="输入问题">
      <button id="sendBtn" type="button">发送</button>
    </div>
  </div>

  <p class="hint mono">TIP / 尝试输入"投诉""定制 Logo"等词，观察升级处理路径如何触发。</p>
</main>

<footer>示例数据为模拟演示，不代表真实库存、价格与物流时效。</footer>

<script>
(function(){
  const transcript = document.getElementById('transcript');
  const emptyState = document.getElementById('emptyState');
  const input = document.getElementById('queryInput');
  const sendBtn = document.getElementById('sendBtn');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const PIPELINE_STEPS = [
    {key:'intent', label:'意图识别'},
    {key:'route',  label:'模块路由'},
    {key:'retrieve', label:'结构化查询 + RAG'},
    {key:'gate',   label:'安全门禁', gate:true},
    {key:'render', label:'回答输出'}
  ];

  const SKU001 = {
    name:'铝合金竞技换挡球头',
    thread:'M8×1.25',
    stud:'45mm',
    ball:'50mm',
    material:'铝合金6061，阳极氧化黑色',
    stock:'现货'
  };

  function classify(text){
    const t = text.toLowerCase();
    const has = (arr)=> arr.some(k=>text.includes(k));

    if (has(['投诉','骗子','差评','定制','logo','赔','退款'])){
      return {
        module:'升级处理', moduleKey:'escalation', confidence:0.91, handoff:true,
        answer:'您反馈的问题涉及投诉、定制或赔付等场景，系统已自动升级为人工优先处理，客服会尽快与您联系核实并跟进。',
        sources:['business_rules.escalation'],
        risk:'complaint_or_custom_request'
      };
    }
    if (has(['多少钱','价格','便宜','优惠','批发','报价','最低','折扣'])){
      return {
        module:'价格', moduleKey:'price', confidence:0.88, handoff:true,
        answer:'该问题涉及具体报价，系统暂未接入正式价格表，无法直接给出金额。已为您转接人工客服核算批发价格，建议补充采购数量与收货地区。',
        sources:['business_rules.price_policy'],
        risk:'unauthorized_price_commitment'
      };
    }
    if (has(['质量','原厂','材质','耐用','生锈','开裂','质保','认证','质检'])){
      return {
        module:'质量', moduleKey:'quality', confidence:0.85, handoff:true,
        answer:'关于产品质量与材质，我们目前按改装/售后配件定位处理，无法直接承诺使用年限或出具验收标准。已为您转接人工客服，如需质检资料可在转人工后提供。',
        sources:['business_rules.quality_policy'],
        risk:'quality_commitment_risk'
      };
    }
    if (has(['发货','物流','快递','几天','顺丰','到货','发顺丰','多久'])){
      return {
        module:'物流', moduleKey:'logistics', confidence:0.93, handoff:false,
        answer:`SKU001 当前为${SKU001.stock}状态，工作日16:00前付款当天发出，默认承运中通或圆通。江浙沪地区预计隔天送达，其他地区2-4天，具体以实际揽收为准。如需顺丰加急，需补运费（江浙沪+8元，其他地区+12元）。`,
        sources:['business_rules.shipping','products.SKU001'],
        risk:null
      };
    }
    if (has(['螺纹','杆长','球径','规格','型号','m8','m10','m12','锥度','参数'])){
      return {
        module:'规格', moduleKey:'spec', confidence:0.96, handoff:false,
        answer:`已查到 SKU001 ${SKU001.name}：螺纹规格 ${SKU001.thread}，杆长 ${SKU001.stud}，球径 ${SKU001.ball}，${SKU001.material}。该参数来自产品结构化数据库，如需其他型号可继续提问。`,
        sources:['products.SKU001'],
        risk:null
      };
    }
    return {
      module:'未识别', moduleKey:'unknown', confidence:0.42, handoff:true,
      answer:'暂未能从您的问题中识别出明确意图（规格 / 物流 / 价格 / 质量），已转交人工客服为您解答，建议补充更具体的产品型号或问题描述。',
      sources:[],
      risk:'low_confidence_unknown_intent'
    };
  }

  function appendUserMessage(text){
    emptyState.remove();
    const wrap = document.createElement('div');
    wrap.className = 'msg user';
    wrap.innerHTML = `<div class="bubble"></div>`;
    wrap.querySelector('.bubble').textContent = text;
    transcript.appendChild(wrap);
    transcript.scrollTop = transcript.scrollHeight;
  }

  function renderPipeline(){
    const wrap = document.createElement('div');
    wrap.className = 'pipeline';
    wrap.id = 'pipeline-active';
    PIPELINE_STEPS.forEach(s=>{
      const chip = document.createElement('span');
      chip.className = 'pl-step' + (s.gate ? ' gate' : '');
      chip.dataset.key = s.key;
      chip.textContent = s.label;
      wrap.appendChild(chip);
    });
    transcript.appendChild(wrap);
    transcript.scrollTop = transcript.scrollHeight;
    return wrap;
  }

  function runPipelineThenRespond(text, result){
    sendBtn.disabled = true;
    input.disabled = true;
    const pipeline = renderPipeline();
    const chips = pipeline.querySelectorAll('.pl-step');
    const stepDelay = reduceMotion ? 0 : 190;
    const startTime = performance.now();

    chips.forEach((chip, i)=>{
      setTimeout(()=>{ chip.classList.add('active'); }, i * stepDelay);
    });

    const totalDelay = reduceMotion ? 40 : (chips.length * stepDelay + 260);

    setTimeout(()=>{
      pipeline.remove();
      const latency = Math.round(performance.now() - startTime);
      appendAssistantMessage(result, latency);
      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
    }, totalDelay);
  }

  function appendAssistantMessage(result, latency){
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant' + (result.handoff ? ' handoff' : '');

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = result.answer;
    wrap.appendChild(bubble);

    const meta = document.createElement('div');
    meta.className = 'meta-strip';

    const moduleChip = document.createElement('span');
    moduleChip.className = 'chip module mono';
    moduleChip.textContent = '模块: ' + result.module;
    meta.appendChild(moduleChip);

    const confChip = document.createElement('span');
    confChip.className = 'chip mono';
    confChip.textContent = '置信度: ' + result.confidence.toFixed(2);
    meta.appendChild(confChip);

    const handoffChip = document.createElement('span');
    handoffChip.className = 'chip mono ' + (result.handoff ? 'warn' : 'ok');
    handoffChip.textContent = result.handoff ? '转人工: 是 ⚠' : '转人工: 否';
    meta.appendChild(handoffChip);

    const latChip = document.createElement('span');
    latChip.className = 'chip mono';
    latChip.textContent = '延迟: ' + latency + 'ms';
    meta.appendChild(latChip);

    if (result.sources && result.sources.length){
      const srcChip = document.createElement('span');
      srcChip.className = 'chip src mono';
      srcChip.textContent = '来源: ' + result.sources.join(' · ');
      meta.appendChild(srcChip);
    }

    if (result.risk){
      const riskChip = document.createElement('span');
      riskChip.className = 'chip mono warn';
      riskChip.textContent = '风险标记: ' + result.risk;
      meta.appendChild(riskChip);
    }

    wrap.appendChild(meta);
    transcript.appendChild(wrap);
    transcript.scrollTop = transcript.scrollHeight;
  }

  function send(text){
    const trimmed = text.trim();
    if (!trimmed) return;
    appendUserMessage(trimmed);
    const result = classify(trimmed);
    runPipelineThenRespond(trimmed, result);
    input.value = '';
  }

  sendBtn.addEventListener('click', ()=> send(input.value));
  input.addEventListener('keydown', (e)=>{
    if (e.key === 'Enter') send(input.value);
  });

  document.getElementById('ex1').addEventListener('click', ()=>{
    send('SKU001今天下单多久发货');
  });
  document.getElementById('ex2').addEventListener('click', ()=>{
    send('SKU001能不能便宜点，最低多少钱');
  });
})();
</script>

</body>
</html>
