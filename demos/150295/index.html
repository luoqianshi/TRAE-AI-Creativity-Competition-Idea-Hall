<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>微习惯花园</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FFF8F0',
            beige: '#F5F0E8',
            'light-green': '#E8F5E9',
            'soft-green': '#A5D6A7',
            garden: '#66BB6A',
            'garden-dark': '#2E7D32',
            'warm-orange': '#FF8A65',
            'soft-orange': '#FFAB91',
          },
          animation: {
            'bounce-soft': 'bounceSoft 0.6s ease-out',
            'pop': 'pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
            'float': 'float 3s ease-in-out infinite',
            'pulse-soft': 'pulseSoft 2s ease-in-out infinite',
            'slide-up': 'slideUp 0.5s ease-out',
            'wiggle': 'wiggle 0.5s ease-in-out',
          },
          keyframes: {
            bounceSoft: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-12px)' },
            },
            pop: {
              '0%': { transform: 'scale(0.8)', opacity: '0' },
              '100%': { transform: 'scale(1)', opacity: '1' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-6px)' },
            },
            pulseSoft: {
              '0%, 100%': { boxShadow: '0 0 0 0 rgba(102,187,106,0.4)' },
              '50%': { boxShadow: '0 0 0 12px rgba(102,187,106,0)' },
            },
            slideUp: {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            wiggle: {
              '0%, 100%': { transform: 'rotate(-3deg)' },
              '50%': { transform: 'rotate(3deg)' },
            },
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(180deg, #FFF8F0 0%, #F5F0E8 100%);
      min-height: 100vh;
      overscroll-behavior-y: none;
    }
    .glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .habit-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .habit-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -8px rgba(102, 187, 106, 0.2);
    }
    .progress-ring circle {
      transition: stroke-dashoffset 0.5s ease-out;
    }
    .btn-press:active {
      transform: scale(0.95);
    }
    .confetti {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      animation: confetti-fall 1.2s ease-out forwards;
    }
    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    .garden-item {
      cursor: grab;
      transition: filter 0.2s;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.08));
    }
    .garden-item:hover {
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.12));
    }
    .garden-item.dragging {
      cursor: grabbing;
      filter: drop-shadow(0 12px 20px rgba(0,0,0,0.18));
    }
    .heat-0 { background-color: #E8F5E9; }
    .heat-1 { background-color: #C8E6C9; }
    .heat-2 { background-color: #A5D6A7; }
    .heat-3 { background-color: #66BB6A; }
    .heat-4 { background-color: #2E7D32; }
    .onboarding-highlight {
      position: relative;
      z-index: 60;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.4), 0 0 0 4px #66BB6A;
      border-radius: 1rem;
      animation: pulseSoft 2s ease-in-out infinite;
    }
    .onboarding-overlay {
      position: fixed;
      inset: 0;
      z-index: 55;
      pointer-events: none;
    }
    input:focus, select:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(102,187,106,0.2);
    }
    .nav-tab {
      transition: all 0.2s;
    }
    .nav-tab.active {
      color: #2E7D32;
    }
    .nav-tab.active svg {
      stroke: #2E7D32;
    }
  </style>
</head>
<body class="text-stone-700">
  <div id="app"></div>

  <!-- Confetti Container -->
  <div id="confetti-container"></div>

  <script>
    // ============== Data & State ==============
    const ICONS = {
      water: `<svg viewBox="0 0 24 24" class="w-full h-full" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>`,
      breathe: `<svg viewBox="0 0 24 24" class="w-full h-full" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10H12V2z"/><path d="M12 12L4.2 4.2"/><path d="M12 12V2"/></svg>`,
      stretch: `<svg viewBox="0 0 24 24" class="w-full h-full" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="2"/><path d="M10 8l-2 6 3 6 3-6-2-6"/><path d="M8 14H6l-2-2"/><path d="M16 14h2l2-2"/></svg>`,
      book: `<svg viewBox="0 0 24 24" class="w-full h-full" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
      walk: `<svg viewBox="0 0 24 24" class="w-full h-full" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M13 8v3"/><path d="M10 21l2-6 2 6"/><path d="M8 15l-2 3"/><path d="M18 15l2 3"/></svg>`,
      sleep: `<svg viewBox="0 0 24 24" class="w-full h-full" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`,
    };

    const DECORATIONS = [
      { id: 'plant', name: '小盆栽', cost: 50, w: 64, h: 70, 
        svg: `<svg viewBox="0 0 64 70" class="w-full h-full"><rect x="20" y="45" width="24" height="20" rx="3" fill="#D7CCC8"/><path d="M32 45 Q22 25 32 10 Q42 25 32 45" fill="#66BB6A"/><path d="M32 40 Q18 30 14 18 Q28 28 32 40" fill="#A5D6A7"/><path d="M32 40 Q46 30 50 18 Q36 28 32 40" fill="#A5D6A7"/></svg>` },
      { id: 'lamp', name: '台灯', cost: 80, w: 60, h: 78,
        svg: `<svg viewBox="0 0 60 78" class="w-full h-full"><ellipse cx="30" cy="72" rx="22" ry="5" fill="#BCAAA4"/><rect x="27" y="50" width="6" height="22" fill="#8D6E63"/><path d="M10 50 L30 12 L50 50 Z" fill="#FFAB91" opacity="0.9"/><ellipse cx="30" cy="50" rx="20" ry="6" fill="#FFCCBC"/></svg>` },
      { id: 'bookshelf', name: '书架', cost: 100, w: 80, h: 90,
        svg: `<svg viewBox="0 0 80 90" class="w-full h-full"><rect x="8" y="5" width="64" height="80" rx="3" fill="#8D6E63"/><rect x="14" y="12" width="18" height="28" rx="1" fill="#FFAB91"/><rect x="36" y="12" width="14" height="28" rx="1" fill="#A5D6A7"/><rect x="54" y="12" width="12" height="28" rx="1" fill="#81D4FA"/><rect x="16" y="48" width="20" height="26" rx="1" fill="#FFF59D"/><rect x="40" y="48" width="16" height="26" rx="1" fill="#CE93D8"/><rect x="60" y="48" width="8" height="26" rx="1" fill="#EF9A9A"/></svg>` },
      { id: 'cat', name: '猫咪', cost: 150, w: 70, h: 60,
        svg: `<svg viewBox="0 0 70 60" class="w-full h-full"><ellipse cx="35" cy="38" rx="24" ry="18" fill="#FFCC80"/><circle cx="35" cy="24" r="16" fill="#FFCC80"/><path d="M22 14 L18 4 L30 12 Z" fill="#FFCC80"/><path d="M48 14 L52 4 L40 12 Z" fill="#FFCC80"/><circle cx="28" cy="22" r="2" fill="#3E2723"/><circle cx="42" cy="22" r="2" fill="#3E2723"/><path d="M33 26 Q35 28 37 26" stroke="#3E2723" stroke-width="1.5" fill="none"/><ellipse cx="20" cy="42" rx="6" ry="16" fill="#FFCC80" transform="rotate(-20 20 42)"/><ellipse cx="50" cy="42" rx="6" ry="16" fill="#FFCC80" transform="rotate(20 50 42)"/></svg>` },
      { id: 'rug', name: '地毯', cost: 120, w: 120, h: 50,
        svg: `<svg viewBox="0 0 120 50" class="w-full h-full"><rect x="5" y="5" width="110" height="40" rx="8" fill="#FFAB91" opacity="0.7"/><rect x="15" y="12" width="90" height="26" rx="4" fill="none" stroke="#FF8A65" stroke-width="2" stroke-dasharray="6 4"/></svg>` },
    ];

    const DEFAULT_DATA = {
      habits: [],
      points: 0,
      streak: 0,
      lastCheckIn: null,
      garden: { unlocked: [], placed: [] },
      onboarding: false,
    };

    let data = loadData();
    let currentTab = 'today';

    function loadData() {
      try {
        const saved = localStorage.getItem('habitGardenData');
        if (saved) return { ...DEFAULT_DATA, ...JSON.parse(saved) };
      } catch (e) { console.error(e); }
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }

    function saveData() {
      localStorage.setItem('habitGardenData', JSON.stringify(data));
    }

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function getDateStr(offsetDays) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function isConsecutive(date1, date2) {
      const d1 = new Date(date1 + 'T00:00:00');
      const d2 = new Date(date2 + 'T00:00:00');
      const diff = Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
      return diff === 1;
    }

    function daysBetween(date1, date2) {
      const d1 = new Date(date1 + 'T00:00:00');
      const d2 = new Date(date2 + 'T00:00:00');
      return Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
    }

    function updateStreak() {
      const today = getTodayStr();
      if (!data.lastCheckIn) {
        data.streak = 1;
      } else if (data.lastCheckIn === today) {
        // no change
      } else if (isConsecutive(data.lastCheckIn, today)) {
        data.streak += 1;
      } else {
        data.streak = 1;
      }
      data.lastCheckIn = today;
    }

    function getHabitCompletionDate(habit) {
      if (!habit.history) habit.history = {};
      return habit.history;
    }

    function isHabitCompletedToday(habit) {
      const h = getHabitCompletionDate(habit);
      return h[getTodayStr()] === true;
    }

    function completeHabit(habitId) {
      const habit = data.habits.find(h => h.id === habitId);
      if (!habit) return;
      if (habit.progress >= habit.target) return;

      habit.progress += 1;
      let justCompleted = false;
      if (habit.progress >= habit.target) {
        habit.progress = habit.target;
        const h = getHabitCompletionDate(habit);
        if (!h[getTodayStr()]) {
          h[getTodayStr()] = true;
          justCompleted = true;
          data.points += 10;
          updateStreak();

          // streak milestone bonus
          const s = data.streak;
          if (s === 3) data.points += 20;
          else if (s === 7) data.points += 50;
          else if (s === 30) data.points += 200;
        }
      }
      saveData();
      render();
      if (justCompleted) {
        celebrate();
      }
    }

    function deleteHabit(id) {
      data.habits = data.habits.filter(h => h.id !== id);
      saveData();
      render();
    }

    function addHabit(name, target, iconKey) {
      if (data.habits.length >= 3) return;
      data.habits.push({
        id: 'h_' + Date.now(),
        name,
        target: parseInt(target) || 1,
        progress: 0,
        icon: iconKey,
        history: {},
      });
      if (!data.onboarding) {
        data.onboarding = true;
      }
      saveData();
      render();
    }

    function getDailyCompletion(dateStr) {
      if (data.habits.length === 0) return 0;
      let completed = 0;
      data.habits.forEach(h => {
        if (h.history && h.history[dateStr]) completed += 1;
      });
      return completed / data.habits.length;
    }

    // ============== Views ==============
    function render() {
      const app = document.getElementById('app');
      app.innerHTML = '';

      if (currentTab === 'today') app.appendChild(renderToday());
      else if (currentTab === 'garden') app.appendChild(renderGarden());
      else if (currentTab === 'stats') app.appendChild(renderStats());

      renderNav();
    }

    function renderNav() {
      let nav = document.getElementById('bottom-nav');
      if (!nav) {
        nav = document.createElement('nav');
        nav.id = 'bottom-nav';
        nav.className = 'fixed bottom-0 left-0 right-0 glass border-t border-orange-100 px-2 py-2 pb-4 flex justify-around items-center z-40';
        document.body.appendChild(nav);
      }
      nav.innerHTML = `
        <button onclick="switchTab('today')" class="nav-tab flex flex-col items-center gap-1 px-4 py-2 rounded-xl ${currentTab==='today'?'active':'text-stone-400'} btn-press">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 4v6c0 5.55-3.84 10.74-9 12-5.16-1.26-9-6.45-9-12V6l9-4z"/><path d="M9 12l2 2 4-4"/></svg>
          <span class="text-xs font-medium">今日打卡</span>
        </button>
        <button onclick="switchTab('garden')" class="nav-tab flex flex-col items-center gap-1 px-4 py-2 rounded-xl ${currentTab==='garden'?'active':'text-stone-400'} btn-press">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4 8 4v14"/><path d="M9 21v-6h6v6"/></svg>
          <span class="text-xs font-medium">我的花园</span>
        </button>
        <button onclick="switchTab('stats')" class="nav-tab flex flex-col items-center gap-1 px-4 py-2 rounded-xl ${currentTab==='stats'?'active':'text-stone-400'} btn-press">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
          <span class="text-xs font-medium">统计</span>
        </button>
      `;
    }

    // ============== Today View ==============
    function renderToday() {
      const container = document.createElement('div');
      container.className = 'px-5 pt-6 pb-28 max-w-md mx-auto animate-slide-up';

      // Header
      const header = document.createElement('div');
      header.className = 'flex justify-between items-start mb-6';
      header.innerHTML = `
        <div>
          <h1 class="text-2xl font-bold text-stone-800">今日打卡</h1>
          <p class="text-sm text-stone-500 mt-1">${new Date().toLocaleDateString('zh-CN', {month:'long', day:'numeric', weekday:'long'})}</p>
        </div>
        <div class="flex gap-3">
          <div class="bg-orange-50 px-3 py-2 rounded-2xl text-center min-w-[64px]">
            <div class="text-xs text-warm-orange font-medium">积分</div>
            <div class="text-lg font-bold text-stone-800">${data.points}</div>
          </div>
          <div class="bg-green-50 px-3 py-2 rounded-2xl text-center min-w-[64px]">
            <div class="text-xs text-garden font-medium">连击</div>
            <div class="text-lg font-bold text-stone-800">${data.streak}<span class="text-sm">天</span></div>
          </div>
        </div>
      `;
      container.appendChild(header);

      // Streak rewards indicator
      const rewards = document.createElement('div');
      rewards.className = 'flex gap-2 mb-6 overflow-x-auto pb-1';
      [3,7,30].forEach((d, i) => {
        const active = data.streak >= d;
        rewards.innerHTML += `
          <div class="flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-medium ${active?'bg-garden text-white':'bg-stone-100 text-stone-400'}">
            ${d}天 +${[20,50,200][i]}分
          </div>
        `;
      });
      container.appendChild(rewards);

      // Habits
      if (data.habits.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'text-center py-16';
        empty.innerHTML = `
          <div class="w-24 h-24 mx-auto mb-4 text-soft-green animate-float">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 22h20L12 2zm0 4l6 12H6l6-12z"/></svg>
          </div>
          <p class="text-stone-500 mb-6">还没有微习惯，添加第一个吧~</p>
          <button id="first-add-btn" onclick="closeOnboarding(); showAddModal();" class="bg-garden hover:bg-garden-dark text-white px-6 py-3 rounded-2xl font-medium shadow-lg shadow-green-200 btn-press transition-colors">
            + 添加第一个习惯
          </button>
        `;
        container.appendChild(empty);
      } else {
        const list = document.createElement('div');
        list.className = 'space-y-4';
        data.habits.forEach(habit => {
          const completed = habit.progress >= habit.target;
          const percent = Math.round((habit.progress / habit.target) * 100);
          const card = document.createElement('div');
          card.className = `habit-card relative bg-white rounded-3xl p-5 shadow-sm border ${completed?'border-green-200 bg-green-50/50':'border-stone-100'}`;
          card.innerHTML = `
            <div class="flex items-center gap-4">
              <div class="w-14 h-14 rounded-2xl ${completed?'bg-garden text-white':'bg-light-green text-garden'} flex items-center justify-center p-3 ${completed?'animate-pop':''}">
                ${ICONS[habit.icon] || ICONS.water}
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex justify-between items-center mb-1">
                  <h3 class="font-bold text-stone-800 truncate">${escapeHtml(habit.name)}</h3>
                  <span class="text-sm font-bold ${completed?'text-garden':'text-stone-400'}">${habit.progress}/${habit.target}</span>
                </div>
                <div class="h-2.5 bg-stone-100 rounded-full overflow-hidden">
                  <div class="h-full rounded-full ${completed?'bg-garden':'bg-gradient-to-r from-soft-green to-garden'} transition-all duration-500" style="width:${percent}%"></div>
                </div>
              </div>
            </div>
            <div class="flex gap-3 mt-4">
              <button onclick="completeHabit('${habit.id}')" ${completed?'disabled':''} class="flex-1 ${completed?'bg-stone-100 text-stone-400':'bg-warm-orange hover:bg-orange-600 text-white'} py-2.5 rounded-xl font-medium btn-press transition-colors">
                ${completed?'已完成':'+1'}
              </button>
              <button onclick="deleteHabit('${habit.id}')" class="px-4 py-2.5 rounded-xl bg-stone-100 text-stone-400 hover:bg-red-50 hover:text-red-400 btn-press transition-colors">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              </button>
            </div>
          `;
          list.appendChild(card);
        });
        container.appendChild(list);

        if (data.habits.length < 3) {
          const addMore = document.createElement('button');
          addMore.className = 'w-full mt-4 py-4 rounded-3xl border-2 border-dashed border-green-200 text-garden font-medium hover:bg-green-50 btn-press transition-colors';
          addMore.innerHTML = '+ 再添加一个微习惯';
          addMore.onclick = showAddModal;
          container.appendChild(addMore);
        }
      }

      // Onboarding overlay if needed
      if (!data.onboarding && data.habits.length === 0) {
        setTimeout(() => {
          const btn = document.getElementById('first-add-btn');
          if (btn) btn.classList.add('onboarding-highlight');
          const overlay = document.createElement('div');
          overlay.className = 'onboarding-overlay';
          overlay.innerHTML = `
            <div class="fixed bottom-32 left-1/2 -translate-x-1/2 bg-white px-5 py-4 rounded-2xl shadow-2xl max-w-[280px] text-center animate-slide-up pointer-events-auto" style="z-index:60">
              <div class="text-3xl mb-2">🌱</div>
              <p class="text-sm text-stone-700 font-medium">欢迎来到微习惯花园！</p>
              <p class="text-xs text-stone-500 mt-1">点击这里种下你的第一个习惯，坚持打卡让花园慢慢丰盛起来~</p>
              <button onclick="closeOnboarding()" class="mt-3 bg-garden text-white text-xs px-4 py-2 rounded-full">知道啦</button>
            </div>
          `;
          document.body.appendChild(overlay);
        }, 300);
      }

      return container;
    }

    function showAddModal() {
      const modal = document.createElement('div');
      modal.id = 'add-modal';
      modal.className = 'fixed inset-0 z-50 flex items-end sm:items-center justify-center';
      modal.innerHTML = `
        <div class="absolute inset-0 bg-black/30 backdrop-blur-sm" onclick="closeAddModal()"></div>
        <div class="relative bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 animate-slide-up">
          <h2 class="text-xl font-bold text-stone-800 mb-5">添加微习惯</h2>
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-stone-600 mb-1.5">习惯名称</label>
              <input type="text" id="habit-name" placeholder="例如：喝水、深呼吸、拉伸" maxlength="12" class="w-full px-4 py-3 rounded-xl bg-stone-50 border border-stone-200 text-stone-800 placeholder-stone-400">
            </div>
            <div>
              <label class="block text-sm font-medium text-stone-600 mb-1.5">目标次数</label>
              <input type="number" id="habit-target" value="8" min="1" max="50" class="w-full px-4 py-3 rounded-xl bg-stone-50 border border-stone-200 text-stone-800">
            </div>
            <div>
              <label class="block text-sm font-medium text-stone-600 mb-2">选择图标</label>
              <div class="grid grid-cols-6 gap-2" id="icon-selector">
                ${Object.keys(ICONS).map(key => `
                  <button type="button" data-icon="${key}" class="icon-option w-10 h-10 rounded-xl bg-stone-50 text-stone-400 flex items-center justify-center p-2 hover:bg-light-green hover:text-garden transition-colors ${key==='water'?'ring-2 ring-garden bg-light-green text-garden':''}" onclick="selectIcon(this)">
                    ${ICONS[key]}
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
          <div class="flex gap-3 mt-6">
            <button onclick="closeAddModal()" class="flex-1 py-3 rounded-xl bg-stone-100 text-stone-600 font-medium btn-press">取消</button>
            <button onclick="submitAddHabit()" class="flex-1 py-3 rounded-xl bg-garden hover:bg-garden-dark text-white font-medium btn-press shadow-lg shadow-green-200">添加</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      window.selectedIcon = 'water';
    }

    function closeAddModal() {
      const m = document.getElementById('add-modal');
      if (m) m.remove();
    }

    function selectIcon(btn) {
      document.querySelectorAll('.icon-option').forEach(b => {
        b.classList.remove('ring-2', 'ring-garden', 'bg-light-green', 'text-garden');
        b.classList.add('bg-stone-50', 'text-stone-400');
      });
      btn.classList.remove('bg-stone-50', 'text-stone-400');
      btn.classList.add('ring-2', 'ring-garden', 'bg-light-green', 'text-garden');
      window.selectedIcon = btn.dataset.icon;
    }

    function submitAddHabit() {
      const name = document.getElementById('habit-name').value.trim();
      const target = document.getElementById('habit-target').value;
      if (!name) {
        document.getElementById('habit-name').focus();
        return;
      }
      addHabit(name, target, window.selectedIcon || 'water');
      closeAddModal();
    }

    // ============== Garden View ==============
    function renderGarden() {
      const container = document.createElement('div');
      container.className = 'px-5 pt-6 pb-32 max-w-md mx-auto animate-slide-up';

      container.innerHTML = `
        <div class="flex justify-between items-center mb-4">
          <h1 class="text-2xl font-bold text-stone-800">我的花园</h1>
          <div class="bg-orange-50 px-3 py-2 rounded-2xl flex items-center gap-1">
            <span class="text-warm-orange">✦</span>
            <span class="font-bold text-stone-800">${data.points}</span>
            <span class="text-xs text-stone-500">积分</span>
          </div>
        </div>
        <p class="text-sm text-stone-500 mb-4">用积分解锁装饰，拖拽到书桌上摆放</p>
      `;

      // Desk SVG area
      const deskWrap = document.createElement('div');
      deskWrap.className = 'relative w-full aspect-[4/3] rounded-3xl overflow-hidden shadow-lg mb-5 select-none';
      deskWrap.id = 'desk-area';
      deskWrap.innerHTML = `
        <svg viewBox="0 0 400 300" class="w-full h-full" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#FFF8F0"/>
              <stop offset="100%" stop-color="#F5F0E8"/>
            </linearGradient>
            <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#D7CCC8"/>
              <stop offset="100%" stop-color="#A1887F"/>
            </linearGradient>
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
            </filter>
          </defs>
          <rect width="400" height="300" fill="url(#wallGrad)"/>
          <!-- Window -->
          <rect x="40" y="30" width="120" height="100" rx="8" fill="#E1F5FE" stroke="#FFF" stroke-width="4"/>
          <line x1="100" y1="30" x2="100" y2="130" stroke="#FFF" stroke-width="4"/>
          <line x1="40" y1="80" x2="160" y2="80" stroke="#FFF" stroke-width="4"/>
          <circle cx="80" cy="60" r="12" fill="#FFF9C4" opacity="0.9"/>
          <!-- Desk -->
          <rect x="30" y="150" width="340" height="16" rx="4" fill="url(#deskGrad)" filter="url(#softShadow)"/>
          <rect x="50" y="166" width="24" height="120" rx="3" fill="#8D6E63"/>
          <rect x="326" y="166" width="24" height="120" rx="3" fill="#8D6E63"/>
          <rect x="30" y="280" width="340" height="12" rx="3" fill="#8D6E63"/>
          <!-- Plant holder -->
          <ellipse cx="350" cy="270" rx="30" ry="8" fill="#C8E6C9" opacity="0.6"/>
        </svg>
        <div id="placed-items" class="absolute inset-0"></div>
      `;
      container.appendChild(deskWrap);

      // Render placed items
      setTimeout(() => renderPlacedItems(deskWrap), 0);

      // Shop
      const shopTitle = document.createElement('h2');
      shopTitle.className = 'font-bold text-stone-800 mb-3';
      shopTitle.textContent = '装饰商店';
      container.appendChild(shopTitle);

      const shop = document.createElement('div');
      shop.className = 'grid grid-cols-3 gap-3';
      DECORATIONS.forEach(item => {
        const unlocked = data.garden.unlocked.includes(item.id);
        const placed = data.garden.placed.find(p => p.id === item.id);
        const card = document.createElement('button');
        card.className = `relative bg-white rounded-2xl p-3 shadow-sm border text-left btn-press transition-all ${unlocked?'border-green-200 hover:shadow-md':'border-stone-100'}`;
        card.innerHTML = `
          <div class="w-12 h-12 mx-auto mb-2">${item.svg}</div>
          <div class="text-xs font-bold text-stone-700 text-center truncate">${item.name}</div>
          <div class="text-xs text-center mt-1 ${unlocked?(placed?'text-garden':'text-stone-400'):'text-warm-orange font-medium'}">
            ${unlocked ? (placed ? '已摆放' : '已解锁') : `${item.cost} 积分`}
          </div>
        `;
        card.onclick = () => handleDecorationClick(item);
        shop.appendChild(card);
      });
      container.appendChild(shop);

      return container;
    }

    function renderPlacedItems(deskWrap) {
      const area = deskWrap.querySelector('#placed-items');
      if (!area) return;
      area.innerHTML = '';

      data.garden.placed.forEach(p => {
        const item = DECORATIONS.find(d => d.id === p.id);
        if (!item) return;
        const el = document.createElement('div');
        el.className = 'garden-item absolute hover:scale-110 transition-transform';
        el.style.width = item.w + 'px';
        el.style.height = item.h + 'px';
        el.style.left = p.x + '%';
        el.style.top = p.y + '%';
        el.innerHTML = item.svg;
        el.dataset.id = item.id;

        // Drag logic (listeners attached on demand to avoid accumulation)
        let dragging = false;
        let startX, startY, startLeft, startTop;

        const onMove = (e) => {
          if (!dragging) return;
          e.preventDefault();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          const rect = deskWrap.getBoundingClientRect();
          let nx = startLeft + (clientX - startX) / rect.width * 100;
          let ny = startTop + (clientY - startY) / rect.height * 100;
          nx = Math.max(0, Math.min(100 - item.w/rect.width*100, nx));
          ny = Math.max(0, Math.min(100 - item.h/rect.height*100, ny));
          el.style.left = nx + '%';
          el.style.top = ny + '%';
        };

        const onEnd = () => {
          if (!dragging) return;
          dragging = false;
          el.classList.remove('dragging');
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('touchmove', onMove);
          window.removeEventListener('mouseup', onEnd);
          window.removeEventListener('touchend', onEnd);
          const placed = data.garden.placed.find(x => x.id === item.id);
          if (placed) {
            placed.x = parseFloat(el.style.left);
            placed.y = parseFloat(el.style.top);
            saveData();
          }
        };

        const onStart = (e) => {
          e.preventDefault();
          dragging = true;
          el.classList.add('dragging');
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          const rect = deskWrap.getBoundingClientRect();
          startX = clientX;
          startY = clientY;
          startLeft = (clientX - rect.left) / rect.width * 100;
          startTop = (clientY - rect.top) / rect.height * 100;
          window.addEventListener('mousemove', onMove, {passive:false});
          window.addEventListener('touchmove', onMove, {passive:false});
          window.addEventListener('mouseup', onEnd);
          window.addEventListener('touchend', onEnd);
        };

        el.addEventListener('mousedown', onStart);
        el.addEventListener('touchstart', onStart, {passive:false});

        area.appendChild(el);
      });
    }

    function handleDecorationClick(item) {
      const unlocked = data.garden.unlocked.includes(item.id);
      if (!unlocked) {
        if (data.points >= item.cost) {
          data.points -= item.cost;
          data.garden.unlocked.push(item.id);
          // Place in center initially
          data.garden.placed.push({ id: item.id, x: 45, y: 45 });
          saveData();
          render();
        } else {
          toast(`积分不足，还需要 ${item.cost - data.points} 分`);
        }
      } else {
        const idx = data.garden.placed.findIndex(p => p.id === item.id);
        if (idx >= 0) {
          data.garden.placed.splice(idx, 1);
        } else {
          data.garden.placed.push({ id: item.id, x: 45, y: 45 });
        }
        saveData();
        render();
      }
    }

    // ============== Stats View ==============
    function renderStats() {
      const container = document.createElement('div');
      container.className = 'px-5 pt-6 pb-32 max-w-md mx-auto animate-slide-up';

      container.innerHTML = `<h1 class="text-2xl font-bold text-stone-800 mb-5">打卡统计</h1>`;

      // Summary cards
      const totalCompleted = data.habits.reduce((sum, h) => sum + Object.keys(h.history || {}).length, 0);
      const summary = document.createElement('div');
      summary.className = 'grid grid-cols-2 gap-3 mb-6';
      summary.innerHTML = `
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-stone-100">
          <div class="text-xs text-stone-500 mb-1">累计完成</div>
          <div class="text-2xl font-bold text-garden">${totalCompleted}<span class="text-sm text-stone-400 font-normal"> 次</span></div>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-stone-100">
          <div class="text-xs text-stone-500 mb-1">当前连击</div>
          <div class="text-2xl font-bold text-warm-orange">${data.streak}<span class="text-sm text-stone-400 font-normal"> 天</span></div>
        </div>
      `;
      container.appendChild(summary);

      // Heatmap
      const heatmapCard = document.createElement('div');
      heatmapCard.className = 'bg-white rounded-3xl p-5 shadow-sm border border-stone-100';
      heatmapCard.innerHTML = `<h2 class="font-bold text-stone-800 mb-4">近7天热力图</h2>`;

      const grid = document.createElement('div');
      grid.className = 'flex justify-between gap-2';
      for (let i = -6; i <= 0; i++) {
        const dateStr = getDateStr(i);
        const rate = getDailyCompletion(dateStr);
        let level = 0;
        if (data.habits.length > 0) {
          if (rate === 0) level = 0;
          else if (rate <= 0.33) level = 1;
          else if (rate <= 0.66) level = 2;
          else if (rate < 1) level = 3;
          else level = 4;
        }
        const d = new Date();
        d.setDate(d.getDate() + i);
        const label = i === 0 ? '今天' : ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
        grid.innerHTML += `
          <div class="flex-1 flex flex-col items-center gap-2">
            <div class="w-full aspect-square rounded-xl heat-${level} transition-colors" title="${dateStr} 完成度 ${Math.round(rate*100)}%"></div>
            <span class="text-[10px] text-stone-400">${label}</span>
          </div>
        `;
      }
      heatmapCard.appendChild(grid);

      // Legend
      const legend = document.createElement('div');
      legend.className = 'flex items-center justify-end gap-2 mt-4 text-xs text-stone-400';
      legend.innerHTML = `
        <span>少</span>
        <div class="flex gap-1">
          <div class="w-4 h-4 rounded heat-0"></div>
          <div class="w-4 h-4 rounded heat-1"></div>
          <div class="w-4 h-4 rounded heat-2"></div>
          <div class="w-4 h-4 rounded heat-3"></div>
          <div class="w-4 h-4 rounded heat-4"></div>
        </div>
        <span>多</span>
      `;
      heatmapCard.appendChild(legend);
      container.appendChild(heatmapCard);

      // Habits detail
      if (data.habits.length > 0) {
        const detailCard = document.createElement('div');
        detailCard.className = 'bg-white rounded-3xl p-5 shadow-sm border border-stone-100 mt-4';
        detailCard.innerHTML = `<h2 class="font-bold text-stone-800 mb-3">习惯明细</h2>`;
        data.habits.forEach(h => {
          const completedDays = Object.keys(h.history || {}).length;
          detailCard.innerHTML += `
            <div class="flex justify-between items-center py-2 border-b border-stone-50 last:border-0">
              <div class="flex items-center gap-2">
                <div class="w-6 h-6 text-garden">${ICONS[h.icon] || ICONS.water}</div>
                <span class="text-sm text-stone-700">${escapeHtml(h.name)}</span>
              </div>
              <span class="text-sm text-stone-500">完成 ${completedDays} 天</span>
            </div>
          `;
        });
        container.appendChild(detailCard);
      }

      return container;
    }

    // ============== Utilities ==============
    function closeOnboarding() {
      const overlay = document.querySelector('.onboarding-overlay');
      if (overlay) overlay.remove();
      const btn = document.getElementById('first-add-btn');
      if (btn) btn.classList.remove('onboarding-highlight');
      data.onboarding = true;
      saveData();
    }

    function switchTab(tab) {
      currentTab = tab;
      render();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function toast(msg) {
      const t = document.createElement('div');
      t.className = 'fixed top-6 left-1/2 -translate-x-1/2 bg-stone-800 text-white text-sm px-5 py-2.5 rounded-full shadow-xl z-[70] animate-slide-up';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => {
        t.style.opacity = '0';
        t.style.transition = 'opacity 0.3s';
        setTimeout(() => t.remove(), 300);
      }, 2000);
    }

    function celebrate() {
      const colors = ['#66BB6A', '#FFAB91', '#FFD54F', '#81D4FA', '#CE93D8'];
      const container = document.getElementById('confetti-container');
      for (let i = 0; i < 40; i++) {
        const conf = document.createElement('div');
        conf.className = 'confetti';
        conf.style.left = Math.random() * 100 + 'vw';
        conf.style.top = '-10px';
        conf.style.width = (6 + Math.random() * 8) + 'px';
        conf.style.height = (6 + Math.random() * 8) + 'px';
        conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        conf.style.animationDuration = (0.8 + Math.random() * 0.6) + 's';
        conf.style.animationDelay = (Math.random() * 0.2) + 's';
        container.appendChild(conf);
        setTimeout(() => conf.remove(), 1600);
      }
      // Also show a quick toast
      const messages = ['太棒了！', '继续保持！', '又完成一个！', '习惯+1'];
      toast(messages[Math.floor(Math.random() * messages.length)]);
    }

    // ============== Init ==============
    render();
  </script>
</body>
</html>
