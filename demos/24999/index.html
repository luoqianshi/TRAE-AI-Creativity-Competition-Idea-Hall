<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 助手</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #e0e0e0; height: 100vh; overflow: hidden; }
#root { height: 100vh; display: flex; flex-direction: column; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #1a1a1a; }
::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #666; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.msg-enter { animation: fadeIn 0.3s ease-out; }
.typing-dot { animation: pulse 1.4s infinite; }
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
.loader { border: 3px solid #333; border-top: 3px solid #6366f1; border-radius: 50%; width: 24px; height: 24px; animation: spin 0.8s linear infinite; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const API = '/api';

// API 请求工具
async function api(path, options = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...options
  });
  return res.json();
}

// ====== 主应用 ======
function App() {
  const [page, setPage] = useState('login');
  const [user, setUser] = useState(null);
  const [theme, setTheme] = useState('dark');
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [conversations, setConversations] = useState([]);
  const [currentConvId, setCurrentConvId] = useState(null);
  const [messages, setMessages] = useState([]);

  useEffect(() => {
    checkAuth();
  }, []);

  async function checkAuth() {
    const res = await api('/auth/user');
    if (res.code === 0 && res.data) {
      setUser(res.data);
      setPage('chat');
      loadConversations();
    }
  }

  async function loadConversations() {
    const res = await api('/conversations');
    if (res.code === 0) setConversations(res.data || []);
  }

  async function loadMessages(convId) {
    const res = await api(`/conversations/${convId}/messages`);
    if (res.code === 0) setMessages(res.data || []);
  }

  if (page === 'login') {
    return <LoginPage onLogin={(u) => { setUser(u); setPage('chat'); loadConversations(); }} />;
  }

  return (
    <div className="flex h-screen bg-[#0f0f0f]">
      {/* 侧边栏 */}
      {sidebarOpen && (
        <div className="w-64 bg-[#1a1a1a] border-r border-[#2a2a2a] flex flex-col shrink-0">
          <div className="p-4 border-b border-[#2a2a2a]">
            <button
              onClick={async () => {
                const res = await api('/conversations', { method: 'POST', body: JSON.stringify({ title: '新对话' }) });
                if (res.code === 0) {
                  setConversations(prev => [res.data, ...prev]);
                  setCurrentConvId(res.data.id);
                  setMessages([]);
                }
              }}
              className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition-colors"
            >
              + 新对话
            </button>
          </div>
          <div className="flex-1 overflow-y-auto">
            {conversations.map(c => (
              <div
                key={c.id}
                onClick={() => { setCurrentConvId(c.id); loadMessages(c.id); }}
                className={`px-4 py-3 cursor-pointer hover:bg-[#252525] transition-colors ${currentConvId === c.id ? 'bg-[#252525] border-l-2 border-indigo-500' : ''}`}
              >
                <div className="text-sm truncate">{c.title}</div>
                <div className="text-xs text-gray-500 mt-1">{c.messageCount} 条消息</div>
              </div>
            ))}
          </div>
          <div className="p-3 border-t border-[#2a2a2a] flex gap-2">
            <button onClick={() => setPage('knowledge')} className="flex-1 py-2 text-xs bg-[#252525] hover:bg-[#333] rounded-lg transition-colors" title="知识库">📚</button>
            <button onClick={() => setPage('search')} className="flex-1 py-2 text-xs bg-[#252525] hover:bg-[#333] rounded-lg transition-colors" title="搜索">🔍</button>
            <button onClick={() => setPage('skills')} className="flex-1 py-2 text-xs bg-[#252525] hover:bg-[#333] rounded-lg transition-colors" title="技能">🧩</button>
            <button onClick={() => setPage('settings')} className="flex-1 py-2 text-xs bg-[#252525] hover:bg-[#333] rounded-lg transition-colors" title="设置">⚙️</button>
          </div>
        </div>
      )}

      {/* 主内容 */}
      <div className="flex-1 flex flex-col min-w-0">
        {/* 顶部栏 */}
        <div className="h-14 bg-[#1a1a1a] border-b border-[#2a2a2a] flex items-center px-4 gap-3 shrink-0">
          <button onClick={() => setSidebarOpen(!sidebarOpen)} className="text-gray-400 hover:text-white p-1">☰</button>
          <div className="flex-1 font-medium text-sm truncate">
            {page === 'chat' && (currentConvId ? conversations.find(c => c.id === currentConvId)?.title || '对话' : 'AI 助手')}
            {page === 'knowledge' && '知识库管理'}
            {page === 'search' && '搜索消息'}
            {page === 'skills' && '技能市场'}
            {page === 'settings' && '设置'}
          </div>
          {user && <span className="text-xs text-gray-400">{user.nickname}</span>}
        </div>

        {/* 内容区 */}
        <div className="flex-1 overflow-hidden">
          {page === 'chat' && <ChatView messages={messages} setMessages={setMessages} currentConvId={currentConvId} setCurrentConvId={setCurrentConvId} loadConversations={loadConversations} />}
          {page === 'knowledge' && <KnowledgePage onBack={() => setPage('chat')} />}
          {page === 'search' && <SearchPage onBack={() => setPage('chat')} />}
          {page === 'skills' && <SkillsPage onBack={() => setPage('chat')} />}
          {page === 'settings' && <SettingsPage user={user} setUser={setUser} onLogout={() => { setUser(null); setPage('login'); }} onBack={() => setPage('chat')} />}
        </div>
      </div>
    </div>
  );
}

// ====== 登录页面 ======
function LoginPage({ onLogin }) {
  const [mode, setMode] = useState('login');
  const [phone, setPhone] = useState('');
  const [password, setPassword] = useState('');
  const [nickname, setNickname] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    setLoading(true);
    const path = mode === 'login' ? '/auth/login' : '/auth/register';
    const body = mode === 'login' ? { phone, password } : { phone, password, nickname: nickname || '用户' };
    const res = await api(path, { method: 'POST', body: JSON.stringify(body) });
    setLoading(false);
    if (res.code === 0) {
      onLogin(res.data.user);
    } else {
      setError(res.msg || '操作失败');
    }
  }

  return (
    <div className="h-screen flex items-center justify-center bg-gradient-to-br from-[#0f0f0f] via-[#1a1033] to-[#0f0f0f]">
      <div className="w-full max-w-md p-8 bg-[#1a1a1a] rounded-2xl border border-[#2a2a2a] shadow-2xl">
        <div className="text-center mb-8">
          <div className="text-4xl mb-3">🤖</div>
          <h1 className="text-2xl font-bold text-white">AI 助手</h1>
          <p className="text-gray-400 mt-2 text-sm">智能对话，触手可及</p>
        </div>

        <div className="flex mb-6 bg-[#0f0f0f] rounded-lg p-1">
          <button onClick={() => setMode('login')} className={`flex-1 py-2 rounded-md text-sm font-medium transition-colors ${mode === 'login' ? 'bg-indigo-600 text-white' : 'text-gray-400'}`}>登录</button>
          <button onClick={() => setMode('register')} className={`flex-1 py-2 rounded-md text-sm font-medium transition-colors ${mode === 'register' ? 'bg-indigo-600 text-white' : 'text-gray-400'}`}>注册</button>
        </div>

        <form onSubmit={handleSubmit} className="space-y-4">
          <div>
            <input type="text" value={phone} onChange={e => setPhone(e.target.value)} placeholder="手机号" className="w-full px-4 py-3 bg-[#0f0f0f] border border-[#2a2a2a] rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 text-sm" />
          </div>
          <div>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="密码" className="w-full px-4 py-3 bg-[#0f0f0f] border border-[#2a2a2a] rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 text-sm" />
          </div>
          {mode === 'register' && (
            <div>
              <input type="text" value={nickname} onChange={e => setNickname(e.target.value)} placeholder="昵称（选填）" className="w-full px-4 py-3 bg-[#0f0f0f] border border-[#2a2a2a] rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 text-sm" />
            </div>
          )}
          {error && <div className="text-red-400 text-sm bg-red-400/10 px-4 py-2 rounded-lg">{error}</div>}
          <button type="submit" disabled={loading} className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white rounded-lg font-medium transition-colors text-sm">
            {loading ? '处理中...' : (mode === 'login' ? '登录' : '注册')}
          </button>
        </form>

        <div className="mt-6 text-center text-xs text-gray-500">
          登录即表示同意服务条款和隐私政策
        </div>
      </div>
    </div>
  );
}

// ====== 聊天视图 ======
function ChatView({ messages, setMessages, currentConvId, setCurrentConvId, loadConversations }) {
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const messagesEndRef = useRef(null);

  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  async function sendMessage() {
    if (!input.trim() || loading) return;
    const content = input.trim();
    setInput('');
    setLoading(true);

    // 添加用户消息到界面
    const userMsg = { id: Date.now().toString(), content, isUser: true };
    setMessages(prev => [...prev, userMsg]);

    const res = await api('/chat', {
      method: 'POST',
      body: JSON.stringify({ content, conversationId: currentConvId || '' })
    });

    if (res.code === 0) {
      if (res.data.conversationId && !currentConvId) {
        setCurrentConvId(res.data.conversationId);
        loadConversations();
      }
      setMessages(prev => [...prev, { id: (Date.now()+1).toString(), content: res.data.reply, isUser: false }]);
    } else {
      setMessages(prev => [...prev, { id: (Date.now()+1).toString(), content: '抱歉，服务暂时不可用。', isUser: false }]);
    }
    setLoading(false);
    loadConversations();
  }

  function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  return (
    <div className="flex flex-col h-full">
      <div className="flex-1 overflow-y-auto px-4 py-4 space-y-4">
        {messages.length === 0 && !loading && (
          <div className="flex items-center justify-center h-full">
            <div className="text-center">
              <div className="text-6xl mb-4">🤖</div>
              <h2 className="text-xl font-semibold text-white mb-2">AI 助手</h2>
              <p className="text-gray-400 text-sm">发送消息开始对话</p>
              <div className="mt-6 grid grid-cols-2 gap-2 max-w-md mx-auto">
                {['介绍一下你自己', '写一首诗', '解释相对论', '推荐一本书'].map(q => (
                  <button key={q} onClick={() => { setInput(q); }} className="text-left px-3 py-2 bg-[#1a1a1a] border border-[#2a2a2a] rounded-lg text-xs text-gray-300 hover:border-indigo-500 transition-colors">{q}</button>
                ))}
              </div>
            </div>
          </div>
        )}

        {messages.map(msg => (
          <div key={msg.id} className={`msg-enter flex ${msg.isUser ? 'justify-end' : 'justify-start'}`}>
            <div className={`max-w-[75%] px-4 py-3 rounded-2xl text-sm leading-relaxed ${
              msg.isUser ? 'bg-indigo-600 text-white rounded-br-md' : 'bg-[#1a1a1a] border border-[#2a2a2a] text-gray-200 rounded-bl-md'
            }`}>
              <div style={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>{msg.content}</div>
            </div>
          </div>
        ))}

        {loading && (
          <div className="msg-enter flex justify-start">
            <div className="bg-[#1a1a1a] border border-[#2a2a2a] rounded-2xl rounded-bl-md px-4 py-3">
              <div className="flex gap-1.5">
                <div className="typing-dot w-2 h-2 bg-gray-400 rounded-full"></div>
                <div className="typing-dot w-2 h-2 bg-gray-400 rounded-full"></div>
                <div className="typing-dot w-2 h-2 bg-gray-400 rounded-full"></div>
              </div>
            </div>
          </div>
        )}
        <div ref={messagesEndRef} />
      </div>

      <div className="p-4 border-t border-[#2a2a2a] bg-[#0f0f0f]">
        <div className="flex gap-2 max-w-3xl mx-auto">
          <input
            type="text"
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={handleKeyDown}
            placeholder="输入消息..."
            className="flex-1 px-4 py-3 bg-[#1a1a1a] border border-[#2a2a2a] rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 text-sm"
          />
          <button
            onClick={sendMessage}
            disabled={!input.trim() || loading}
            className="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 text-white rounded-xl font-medium transition-colors text-sm"
          >
            发送
          </button>
        </div>
      </div>
    </div>
  );
}

// ====== 知识库页面 ======
function KnowledgePage({ onBack }) {
  const [kbs, setKbs] = useState([]);
  const [showCreate, setShowCreate] = useState(false);
  const [name, setName] = useState('');
  const [desc, setDesc] = useState('');
  const [selectedKb, setSelectedKb] = useState(null);
  const [documents, setDocuments] = useState([]);

  useEffect(() => { loadKbs(); }, []);

  async function loadKbs() {
    const res = await api('/knowledge');
    if (res.code === 0) setKbs(res.data || []);
  }

  async function createKb() {
    if (!name.trim()) return;
    await api('/knowledge', { method: 'POST', body: JSON.stringify({ name, description: desc }) });
    setName(''); setDesc(''); setShowCreate(false);
    loadKbs();
  }

  async function deleteKb(id) {
    await api(`/knowledge/${id}`, { method: 'DELETE' });
    loadKbs();
    if (selectedKb?.id === id) setSelectedKb(null);
  }

  async function loadDocuments(kbId) {
    const res = await api(`/knowledge/${kbId}/documents`);
    if (res.code === 0) setDocuments(res.data || []);
  }

  async function deleteDocument(kbId, docId) {
    await api(`/knowledge/${kbId}/documents/${docId}`, { method: 'DELETE' });
    loadDocuments(kbId);
  }

  return (
    <div className="h-full flex flex-col">
      <div className="p-4 border-b border-[#2a2a2a] flex items-center justify-between">
        <div className="flex items-center gap-3">
          <button onClick={onBack} className="text-gray-400 hover:text-white">← 返回</button>
          <h2 className="font-semibold">知识库管理</h2>
        </div>
        <button onClick={() => setShowCreate(true)} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm transition-colors">+ 新建知识库</button>
      </div>

      <div className="flex-1 flex overflow-hidden">
        <div className="w-64 border-r border-[#2a2a2a] overflow-y-auto">
          {kbs.map(kb => (
            <div key={kb.id} onClick={() => { setSelectedKb(kb); loadDocuments(kb.id); }} className={`px-4 py-3 cursor-pointer hover:bg-[#1a1a1a] transition-colors border-b border-[#2a2a2a] ${selectedKb?.id === kb.id ? 'bg-[#1a1a1a] border-l-2 border-indigo-500' : ''}`}>
              <div className="text-sm font-medium">{kb.name}</div>
              <div className="text-xs text-gray-500 mt-1">{kb.documentCount} 个文档</div>
              <button onClick={(e) => { e.stopPropagation(); deleteKb(kb.id); }} className="text-xs text-red-400 hover:text-red-300 mt-1">删除</button>
            </div>
          ))}
        </div>

        <div className="flex-1 overflow-y-auto p-4">
          {selectedKb ? (
            <div>
              <h3 className="font-medium mb-2">{selectedKb.name}</h3>
              <p className="text-sm text-gray-400 mb-4">{selectedKb.description}</p>
              <div className="space-y-2">
                {documents.map(doc => (
                  <div key={doc.id} className="flex items-center justify-between p-3 bg-[#1a1a1a] rounded-lg border border-[#2a2a2a]">
                    <div>
                      <div className="text-sm">{doc.title}</div>
                      <div className="text-xs text-gray-500">{doc.fileName}</div>
                    </div>
                    <button onClick={() => deleteDocument(selectedKb.id, doc.id)} className="text-xs text-red-400 hover:text-red-300">删除</button>
                  </div>
                ))}
                {documents.length === 0 && <div className="text-sm text-gray-500 text-center py-8">暂无文档</div>}
              </div>
            </div>
          ) : (
            <div className="flex items-center justify-center h-full text-gray-500 text-sm">选择一个知识库查看详情</div>
          )}
        </div>
      </div>

      {showCreate && (
        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50" onClick={() => setShowCreate(false)}>
          <div className="bg-[#1a1a1a] border border-[#2a2a2a] rounded-2xl p-6 w-96" onClick={e => e.stopPropagation()}>
            <h3 className="font-semibold mb-4">新建知识库</h3>
            <input value={name} onChange={e => setName(e.target.value)} placeholder="名称" className="w-full px-4 py-2.5 bg-[#0f0f0f] border border-[#2a2a2a] rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 text-sm mb-3" />
            <input value={desc} onChange={e => setDesc(e.target.value)} placeholder="描述（选填）" className="w-full px-4 py-2.5 bg-[#0f0f0f] border border-[#2a2a2a] rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 text-sm mb-4" />
            <div className="flex gap-2">
              <button onClick={() => setShowCreate(false)} className="flex-1 py-2.5 bg-[#252525] hover:bg-[#333] rounded-lg text-sm transition-colors">取消</button>
              <button onClick={createKb} className="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 rounded-lg text-sm transition-colors">创建</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ====== 搜索页面 ======
function SearchPage({ onBack }) {
  const [query, setQuery] = useState('');
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);

  async function search() {
    if (!query.trim()) return;
    setLoading(true);
    const res = await api('/search', { method: 'POST', body: JSON.stringify({ query: query.trim() }) });
    if (res.code === 0) setResults(res.data || []);
    setLoading(false);
  }

  return (
    <div className="h-full flex flex-col">
      <div className="p-4 border-b border-[#2a2a2a] flex items-center gap-3">
        <button onClick={onBack} className="text-gray-400 hover:text-white">← 返回</button>
        <h2 className="font-semibold">搜索消息</h2>
      </div>
      <div className="p-4">
        <div className="flex gap-2">
          <input value={query} onChange={e => setQuery(e.target.value)} onKeyDown={e => e.key === 'Enter' && search()} placeholder="输入关键词搜索历史消息..." className="flex-1 px-4 py-2.5 bg-[#1a1a1a] border border-[#2a2a2a] rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 text-sm" />
          <button onClick={search} disabled={loading} className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white rounded-lg text-sm transition-colors">搜索</button>
        </div>
      </div>
      <div className="flex-1 overflow-y-auto px-4 pb-4">
        {loading && <div className="flex justify-center py-8"><div className="loader"></div></div>}
        <div className="space-y-3">
          {results.map((r, i) => (
            <div key={i} className="p-3 bg-[#1a1a1a] border border-[#2a2a2a] rounded-lg">
              <div className="flex items-center justify-between mb-1">
                <span className="text-xs text-indigo-400">{r.conversationTitle}</span>
                <span className="text-xs text-gray-500">{r.isUser ? '用户' : 'AI'} · 匹配度: {Math.round(r.matchScore)}%</span>
              </div>
              <div className="text-sm text-gray-300" style={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>{r.content}</div>
            </div>
          ))}
          {!loading && results.length === 0 && query && <div className="text-center py-8 text-gray-500 text-sm">未找到相关结果</div>}
        </div>
      </div>
    </div>
  );
}

// ====== 技能市场页面 ======
function SkillsPage({ onBack }) {
  const [skills, setSkills] = useState([]);

  useEffect(() => { loadSkills(); }, []);

  async function loadSkills() {
    const res = await api('/skills');
    if (res.code === 0) setSkills(res.data || []);
  }

  async function toggleSkill(id, install) {
    const path = install ? `/skills/${id}/install` : `/skills/${id}/uninstall`;
    await api(path, { method: 'POST' });
    loadSkills();
  }

  return (
    <div className="h-full flex flex-col">
      <div className="p-4 border-b border-[#2a2a2a] flex items-center gap-3">
        <button onClick={onBack} className="text-gray-400 hover:text-white">← 返回</button>
        <h2 className="font-semibold">技能市场</h2>
      </div>
      <div className="flex-1 overflow-y-auto p-4">
        <div className="grid gap-3">
          {skills.map(s => (
            <div key={s.id} className="p-4 bg-[#1a1a1a] border border-[#2a2a2a] rounded-xl flex items-center justify-between">
              <div>
                <div className="font-medium text-sm">{s.name}</div>
                <div className="text-xs text-gray-500 mt-1">{s.description}</div>
                <div className="text-xs text-gray-600 mt-1">v{s.version}</div>
              </div>
              <button onClick={() => toggleSkill(s.id, !s.enabled)} className={`px-4 py-2 rounded-lg text-xs font-medium transition-colors ${s.enabled ? 'bg-red-600/20 text-red-400 hover:bg-red-600/30' : 'bg-indigo-600/20 text-indigo-400 hover:bg-indigo-600/30'}`}>
                {s.enabled ? '卸载' : '安装'}
              </button>
            </div>
          ))}
          {skills.length === 0 && <div className="text-center py-8 text-gray-500 text-sm">暂无可用技能</div>}
        </div>
      </div>
    </div>
  );
}

// ====== 设置页面 ======
function SettingsPage({ user, setUser, onLogout, onBack }) {
  const [config, setConfig] = useState({ deepSeekApiKey: '', apiBaseUrl: '', theme: 'dark', language: 'zh-CN', fontSize: 14 });
  const [saved, setSaved] = useState(false);

  useEffect(() => { loadConfig(); }, []);

  async function loadConfig() {
    const res = await api('/config');
    if (res.code === 0) setConfig(res.data);
  }

  async function saveConfig() {
    await api('/config', { method: 'POST', body: JSON.stringify(config) });
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  }

  async function handleLogout() {
    await api('/auth/logout', { method: 'POST' });
    setUser(null);
    onLogout();
  }

  return (
    <div className="h-full flex flex-col">
      <div className="p-4 border-b border-[#2a2a2a] flex items-center gap-3">
        <button onClick={onBack} className="text-gray-400 hover:text-white">← 返回</button>
        <h2 className="font-semibold">设置</h2>
      </div>
      <div className="flex-1 overflow-y-auto p-4 space-y-6">
        {/* API 设置 */}
        <div className="bg-[#1a1a1a] border border-[#2a2a2a] rounded-xl p-4">
          <h3 className="font-medium text-sm mb-4">API 设置</h3>
          <div className="space-y-3">
            <div>
              <label className="text-xs text-gray-400 mb-1 block">DeepSeek API Key</label>
              <input type="password" value={config.deepSeekApiKey} onChange={e => setConfig({...config, deepSeekApiKey: e.target.value})} placeholder="sk-..." className="w-full px-4 py-2.5 bg-[#0f0f0f] border border-[#2a2a2a] rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 text-sm" />
            </div>
            <div>
              <label className="text-xs text-gray-400 mb-1 block">API 服务器地址</label>
              <input value={config.apiBaseUrl} onChange={e => setConfig({...config, apiBaseUrl: e.target.value})} className="w-full px-4 py-2.5 bg-[#0f0f0f] border border-[#2a2a2a] rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 text-sm" />
            </div>
          </div>
        </div>

        {/* 外观设置 */}
        <div className="bg-[#1a1a1a] border border-[#2a2a2a] rounded-xl p-4">
          <h3 className="font-medium text-sm mb-4">外观设置</h3>
          <div className="space-y-3">
            <div>
              <label className="text-xs text-gray-400 mb-1 block">主题</label>
              <select value={config.theme} onChange={e => setConfig({...config, theme: e.target.value})} className="w-full px-4 py-2.5 bg-[#0f0f0f] border border-[#2a2a2a] rounded-lg text-white focus:outline-none focus:border-indigo-500 text-sm">
                <option value="dark">深色</option>
                <option value="light">浅色</option>
              </select>
            </div>
            <div>
              <label className="text-xs text-gray-400 mb-1 block">语言</label>
              <select value={config.language} onChange={e => setConfig({...config, language: e.target.value})} className="w-full px-4 py-2.5 bg-[#0f0f0f] border border-[#2a2a2a] rounded-lg text-white focus:outline-none focus:border-indigo-500 text-sm">
                <option value="zh-CN">中文</option>
                <option value="en-US">English</option>
              </select>
            </div>
          </div>
        </div>

        {/* 账号设置 */}
        <div className="bg-[#1a1a1a] border border-[#2a2a2a] rounded-xl p-4">
          <h3 className="font-medium text-sm mb-4">账号设置</h3>
          {user && <div className="text-sm text-gray-400 mb-3">当前用户: {user.nickname} ({user.phone})</div>}
          <button onClick={handleLogout} className="px-4 py-2 bg-red-600/20 text-red-400 hover:bg-red-600/30 rounded-lg text-sm transition-colors">退出登录</button>
        </div>

        {/* 关于 */}
        <div className="bg-[#1a1a1a] border border-[#2a2a2a] rounded-xl p-4">
          <h3 className="font-medium text-sm mb-4">关于</h3>
          <div className="text-sm text-gray-400 space-y-1">
            <div>AI 助手 v1.0.0</div>
            <div>基于 Cangjie 1.1.0 + React</div>
            <div>前端: React 18 + Tailwind CSS</div>
            <div>后端: Cangjie HTTP Server</div>
          </div>
        </div>

        <button onClick={saveConfig} className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium transition-colors text-sm">
          {saved ? '已保存 ✓' : '保存设置'}
        </button>
      </div>
    </div>
  );
}

// 挂载
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
