<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>肉鸽冒险</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background: #0a0a0a;
    overflow: hidden;
    cursor: crosshair;
    font-family: 'Courier New', monospace;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #hud {
    position: fixed;
    top: 10px;
    left: 8px;
    color: #e0d8c8;
    font-size: 12px;
    line-height: 1.6;
    pointer-events: none;
    text-shadow: 1px 1px 0 #000;
    background: rgba(0,0,0,0.5);
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.1);
    z-index: 10;
  }
  #hud .label { color: #a09070; }
  #hud .val { color: #f0d890; font-weight: bold; }
  #minimap {
    position: fixed;
    bottom: 12px;
    right: 12px;
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 4px;
    background: rgba(0,0,0,0.6);
    pointer-events: none;
    z-index: 10;
    width: 90px;
    height: 90px;
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #overlay.hidden {
    display: none;
  }
  .modal.hidden {
    display: none;
  }
  .modal {
    background: linear-gradient(135deg, #1e1c18, #2a2620);
    border: 2px solid #ffd700;
    border-radius: 12px;
    padding: 30px 24px;
    text-align: center;
    box-shadow: 0 0 40px rgba(255,215,0,0.15), inset 0 0 60px rgba(0,0,0,0.4);
    width: 88vw;
    max-width: 380px;
  }
  .modal h1 {
    color: #ffd700;
    font-size: 26px;
    margin-bottom: 8px;
    letter-spacing: 3px;
    text-shadow: 0 0 20px rgba(255,215,0,0.4);
  }
  .modal h2 {
    color: #e04040;
    font-size: 24px;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  .modal .subtitle {
    color: #a09070;
    font-size: 12px;
    margin-bottom: 20px;
    line-height: 1.6;
  }
  .modal .result {
    color: #e0d8c8;
    font-size: 15px;
    margin-bottom: 20px;
    line-height: 2;
  }
  .modal .result span {
    color: #ffd700;
  }
  .modal button {
    background: linear-gradient(180deg, #ffd700, #b8960f);
    border: none;
    border-radius: 8px;
    color: #1a1810;
    font-family: 'Courier New', monospace;
    font-size: 18px;
    font-weight: bold;
    padding: 14px 40px;
    cursor: pointer;
    letter-spacing: 3px;
    transition: transform 0.1s, box-shadow 0.1s;
    box-shadow: 0 4px 0 #7a6208, 0 0 20px rgba(255,215,0,0.2);
    width: 100%;
    display: block;
    -webkit-tap-highlight-color: transparent;
  }
  .modal button + button {
    margin-top: 12px;
  }
  .modal button:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #7a6208, 0 0 10px rgba(255,215,0,0.1);
  }
  .modal button.debug-btn {
    background: linear-gradient(180deg, #ff4040, #8b1a1a);
    box-shadow: 0 4px 0 #5a0e0e, 0 0 20px rgba(255,64,64,0.2);
    color: #ffe0e0;
    font-size: 16px;
    padding: 12px 32px;
  }
  .modal button.debug-btn:active {
    box-shadow: 0 2px 0 #5a0e0e, 0 0 10px rgba(255,64,64,0.15);
  }
  .modal .tip {
    color: #706860;
    font-size: 11px;
    margin-top: 14px;
  }
  #monster-info {
    position: fixed;
    top: 10px;
    right: 8px;
    z-index: 10;
    pointer-events: none;
    font-family: monospace;
    font-size: 9px;
    color: #c0b090;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 4px 8px;
    line-height: 1.5;
  }
  #monster-info .mi-title {
    color: #e0d090;
    font-weight: bold;
    font-size: 10px;
    margin-bottom: 2px;
  }
  #monster-info .mi-row {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  #monster-info .mi-shape {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 2px;
  }
  #touch-joystick {
    position: fixed;
    bottom: 20px;
    left: 20px;
    width: 140px;
    height: 140px;
    z-index: 50;
    pointer-events: auto;
    touch-action: none;
  }
  #touch-joystick .base {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06);
  }
  #touch-joystick .thumb {
    position: absolute;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    border: 2px solid rgba(255,255,255,0.4);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: none;
  }
</style>
</head>
<body>
<div id="hud">
  <div><span class="label">生命</span> <span class="val" id="hp">❤️❤️❤️❤️❤️</span></div>
  <div><span class="label">金币</span> <span class="val" id="coins">0</span></div>
  <div><span class="label">坐标</span> <span class="val" id="pos">500, 500</span></div>
  <div><span class="label">方向</span> <span class="val" id="dir">↓</span></div>
</div>
<div id="debug-hud" style="display:none; position:fixed; top:80px; left:10px; z-index:30; background:rgba(255,0,0,0.15); border:1px solid rgba(255,80,80,0.5); border-radius:4px; padding:2px 8px; color:#ff6060; font-size:12px; font-family:monospace; pointer-events:none;">调试中</div>
<div id="monster-info">
  <div class="mi-title">怪物图鉴</div>
  <div class="mi-row"><span class="mi-shape" style="background:#ff8844;"></span> A ▲ 血1~3 币88% 影1% 散1%</div>
  <div class="mi-row"><span class="mi-shape" style="background:#44ccff;"></span> B ◆ 血3~5 ♥10% 币78% 大10% 影1% 散1%</div>
  <div class="mi-row"><span class="mi-shape" style="background:#ff2222;"></span> C ⬡ 血10 弹98% 影1% 散1%</div>
</div>
<canvas id="minimap" width="90" height="90"></canvas>
<canvas id="game"></canvas>
<div id="touch-joystick">
  <div class="base"></div>
  <div class="thumb"></div>
</div>
<div id="overlay">
  <div class="modal" id="modal-start">
    <h1>⚔️ 肉鸽冒险</h1>
    <div class="subtitle">
      1000×1000 暗黑地牢<br>
      摇杆移动 · 点击地图行走
    </div>
    <button id="btn-start">开 始 游 戏</button>
    <button id="btn-debug-start" class="debug-btn">调 试 开 始</button>
  </div>
  <div class="modal hidden" id="modal-gameover">
    <h2>☠️ 你死了</h2>
    <div class="result">
      金 币 <span id="result-coins">0</span><br>
      时 间 <span id="result-time">0:00</span>
    </div>
    <button id="btn-restart">重 新 开 始</button>
  </div>
</div>

<script>
const MAP_W = 1000;
const MAP_H = 1000;
const PLAYER_SIZE = 50;
const PLAYER_SPEED = 220;
const TILE_SIZE = 40;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const minimap = document.getElementById('minimap');
const mctx = minimap.getContext('2d');

let canvasW, canvasH, halfW, halfH;

const playerImage = new Image();
playerImage.src = 'role.png';

const boomImage = new Image();
boomImage.src = 'boom.png';

const BOOM_FRAMES = [
  { sx: 0, sy: 0, sw: 268, sh: 309 },
  { sx: 288, sy: 0, sw: 268, sh: 309 },
  { sx: 597, sy: 0, sw: 268, sh: 309 },
  { sx: 910, sy: 0, sw: 290, sh: 309 }
];

const BOSS_ANIM_DURATION = 0.2;
const BOSS_FADE_DURATION = 0.1;

const DIRECTION_NAMES = ['→', '↘', '↓', '↙', '←', '↖', '↑', '↗'];
const DIR_TO_ANIM = [0, 0, 1, 2, 2, 2, 3, 0];

const SPRITE_FRAMES = [
  [
    { sx: 18, sy: 207, sw: 56, sh: 72 },
    { sx: 115, sy: 207, sw: 56, sh: 72 },
    { sx: 210, sy: 207, sw: 56, sh: 72 },
    { sx: 306, sy: 207, sw: 56, sh: 72 },
  ],
  [
    { sx: 18, sy: 14, sw: 56, sh: 72 },
    { sx: 115, sy: 14, sw: 56, sh: 72 },
    { sx: 210, sy: 14, sw: 56, sh: 72 },
    { sx: 306, sy: 14, sw: 56, sh: 72 },
  ],
  [
    { sx: 18, sy: 108, sw: 56, sh: 72 },
    { sx: 115, sy: 108, sw: 56, sh: 72 },
    { sx: 210, sy: 108, sw: 56, sh: 72 },
    { sx: 306, sy: 108, sw: 56, sh: 72 },
  ],
  [
    { sx: 18, sy: 301, sw: 56, sh: 72 },
    { sx: 115, sy: 301, sw: 56, sh: 72 },
    { sx: 211, sy: 301, sw: 56, sh: 72 },
    { sx: 306, sy: 301, sw: 56, sh: 72 },
  ]
];

const FRAME_DURATION = 0.12;
let animFrame = 0;
let animTimer = 0;

const SPRITE_W = 56;
const SPRITE_H = 72;
const SPRITE_OX = -Math.round(SPRITE_W / 2);
const SPRITE_OY = -Math.round(SPRITE_H / 2);

let player = {
  x: 500,
  y: 500,
  targetX: 500,
  targetY: 500,
  direction: 2,
  moving: false,
  size: PLAYER_SIZE,
  hp: 5,
  maxHp: 5,
  attackPower: 1,
  zidan_gongjili: 1,
  coins: 0,
  invincibleUntil: 0,
  hasPhantom: false,
  hasScatter: false
};

let items = [];
let obstacles = [];
let particles = [];
let enemies = [];
let bullets = [];
let afterimages = [];

let cameraX = 0;
let cameraY = 0;

let mouseWorldX = 0;
let mouseWorldY = 0;
let mouseOnMap = false;
let clickIndicator = null;

let lastTime = 0;
let gameTime = 0;
let gameRunning = false;
let coinSpawnTimer = 0;
let enemySpawnTimer = 0;
let bulletTimer = 0;
let screenShakeUntil = 0;
let debugMode = false;
let debugItemSpawnTimer = 0;
let scatterTimer = 0;

const keys = { w: false, a: false, s: false, d: false, arrowup: false, arrowdown: false, arrowleft: false, arrowright: false };

const overlay = document.getElementById('overlay');
const modalStart = document.getElementById('modal-start');
const modalGameover = document.getElementById('modal-gameover');

function resize() {
  canvasW = window.innerWidth;
  canvasH = window.innerHeight;
  canvas.width = canvasW;
  canvas.height = canvasH;
  halfW = canvasW / 2;
  halfH = canvasH / 2;
  updateCamera();
}

function updateCamera() {
  cameraX = Math.round(player.x - halfW);
  cameraY = Math.round(player.y - halfH);
}

function clamp(val, min, max) {
  return Math.max(min, Math.min(max, val));
}

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function worldToScreen(wx, wy) {
  return { x: Math.round(wx - cameraX), y: Math.round(wy - cameraY) };
}

function screenToWorld(sx, sy) {
  return { x: sx + cameraX, y: sy + cameraY };
}

function angleToDirection(angle) {
  let deg = (angle * 180 / Math.PI + 360) % 360;
  let index = Math.round(deg / 45) % 8;
  return index;
}

const ENEMY_TYPES = [
  { name: 'A', color: '#ff8844', hpMin: 1, hpMax: 3, baseSize: 18, speed: 55,
    drops: { coin: 0.88, phantom: 0.01, scatter_book: 0.01 }, isBoss: false },
  { name: 'B', color: '#44ccff', hpMin: 3, hpMax: 5, baseSize: 22, speed: 50,
    drops: { heart: 0.1, coin: 0.78, big_coin: 0.1, phantom: 0.01, scatter_book: 0.01 }, isBoss: false },
  { name: 'C', color: '#ff2222', hpMin: 10, hpMax: 10, baseSize: 28, speed: 40,
    drops: { bomb: 0.98, phantom: 0.01, scatter_book: 0.01 }, isBoss: true }
];

function killEnemy(enemy) {
  enemy.dying = true;

  if (enemy.type.isBoss) {
    enemy.deathTimer = BOSS_ANIM_DURATION + BOSS_FADE_DURATION;
    enemy.boomFrame = 0;
    enemy.boomPhase = 'anim';
  } else {
    enemy.deathTimer = 0.5;
  }

  spawnParticle(enemy.x, enemy.y, enemy.type.color, 15);

  let drops = enemy.type.drops;
  let roll = Math.random();
  let cumulative = 0;
  for (let dropName in drops) {
    cumulative += drops[dropName];
    if (roll < cumulative) {
      items.push(spawnItem(enemy.x, enemy.y, dropName));
      break;
    }
  }

  for (let i = 0; i < 2; i++) {
    enemies.push(spawnEnemy());
  }
}

function spawnEnemy() {
  let margin = 100;
  let x, y, valid;
  for (let attempt = 0; attempt < 50; attempt++) {
    x = margin + Math.random() * (MAP_W - margin * 2);
    y = margin + Math.random() * (MAP_H - margin * 2);
    valid = dist({x, y}, player) > 200;
    for (let o of obstacles) {
      if (dist({x, y}, o) < 40) valid = false;
    }
    for (let e of enemies) {
      if (dist({x, y}, e) < 30) valid = false;
    }
    if (valid) break;
  }
  if (!valid) { x = 100; y = 100; }

  let bossCount = enemies.filter(e => !e.dying && e.type.name === 'C').length;
  let availableTypes = ENEMY_TYPES;
  if (bossCount >= 3) {
    availableTypes = ENEMY_TYPES.filter(t => t.name !== 'C');
  }

  let typeDef = availableTypes[Math.floor(Math.random() * availableTypes.length)];
  let hp = typeDef.hpMin + Math.floor(Math.random() * (typeDef.hpMax - typeDef.hpMin + 1));
  let size = typeDef.baseSize + hp * 4;

  return {
    x, y,
    type: typeDef,
    hp: hp,
    maxHp: hp,
    size: size,
    dying: false,
    deathTimer: 0
  };
}

function spawnItem(x, y, forceType) {
  let types = [
    { name: 'coin', color: '#ffd700', size: 12, value: 1 },
    { name: 'gem', color: '#ff6040', size: 14, value: 5 },
    { name: 'heart', color: '#ff4060', size: 14, heal: 1 },
    { name: 'bomb', color: '#222222', size: 14, value: 0, bomb: true },
    { name: 'big_coin', color: '#ffcc00', size: 18, value: 10 },
    { name: 'phantom', color: '#cc44ff', size: 14, value: 0, phantom: true },
    { name: 'scatter_book', color: '#ffffff', size: 14, value: 0, scatter: true }
  ];
  let type;
  if (forceType === 'heart') {
    type = types[2];
  } else if (forceType === 'coin') {
    type = types[0];
  } else if (forceType === 'bomb') {
    type = types[3];
  } else if (forceType === 'big_coin') {
    type = types[4];
  } else if (forceType === 'phantom') {
    type = types[5];
  } else if (forceType === 'scatter_book') {
    type = types[6];
  } else {
    let roll = Math.random();
    if (roll < 0.6) type = types[0];
    else if (roll < 0.85) type = types[1];
    else type = types[2];
  }

  return {
    x: x || (40 + Math.random() * (MAP_W - 80)),
    y: y || (40 + Math.random() * (MAP_H - 80)),
    type: type,
    collected: false,
    bobOffset: Math.random() * Math.PI * 2
  };
}

function spawnObstacle() {
  let margin = 60;
  let x, y, valid;
  do {
    x = margin + Math.random() * (MAP_W - margin * 2);
    y = margin + Math.random() * (MAP_H - margin * 2);
    valid = dist({x, y}, player) > 120;
    for (let o of obstacles) {
      if (dist({x, y}, o) < 60) valid = false;
    }
  } while (!valid);

  let w = 20 + Math.random() * 40;
  let h = 20 + Math.random() * 40;
  return { x: x - w/2, y: y - h/2, w, h };
}

function spawnParticle(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    let angle = Math.random() * Math.PI * 2;
    let speed = 40 + Math.random() * 120;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.3 + Math.random() * 0.5,
      maxLife: 0.3 + Math.random() * 0.5,
      color: color,
      size: 2 + Math.random() * 4
    });
  }
}

function showStartModal() {
  overlay.classList.remove('hidden');
  modalStart.classList.remove('hidden');
  modalGameover.classList.add('hidden');
}

function showGameOverModal() {
  document.getElementById('result-coins').textContent = player.coins;
  let minutes = Math.floor(gameTime / 60);
  let seconds = Math.floor(gameTime % 60);
  document.getElementById('result-time').textContent = minutes + ':' + String(seconds).padStart(2, '0');
  overlay.classList.remove('hidden');
  modalStart.classList.add('hidden');
  modalGameover.classList.remove('hidden');
}

function startGame() {
  overlay.classList.add('hidden');
  debugMode = false;
  document.getElementById('debug-hud').style.display = 'none';
  initWorld();
  gameTime = 0;
  lastTime = 0;
  gameRunning = true;
}

function debugStartGame() {
  overlay.classList.add('hidden');
  debugMode = true;
  document.getElementById('debug-hud').style.display = 'block';
  initWorld();
  gameTime = 0;
  lastTime = 0;
  gameRunning = true;
}

function restartGame() {
  overlay.classList.add('hidden');
  debugMode = false;
  document.getElementById('debug-hud').style.display = 'none';
  initWorld();
  gameTime = 0;
  lastTime = 0;
  gameRunning = true;
}

function initWorld() {
  enemies = [];
  bullets = [];
  items = [];
  obstacles = [];
  particles = [];

  for (let i = 0; i < 18; i++) {
    obstacles.push(spawnObstacle());
  }

  let heartCount = 1 + Math.floor(Math.random() * 3);
  for (let i = 0; i < heartCount; i++) {
    items.push(spawnItem(null, null, 'heart'));
  }

  coinSpawnTimer = 10 + Math.random() * 50;

  for (let i = 0; i < 3 + Math.floor(Math.random() * 4); i++) {
    enemies.push(spawnEnemy());
  }
  enemySpawnTimer = 8 + Math.random() * 22;

  player.x = 500;
  player.y = 500;
  player.targetX = 500;
  player.targetY = 500;
  player.hp = player.maxHp;
  player.attackPower = 1;
  player.zidan_gongjili = 1;
  player.coins = 0;
  player.invincibleUntil = 0;
  player.hasPhantom = false;
  player.hasScatter = false;

  bulletTimer = 0;
  screenShakeUntil = 0;
  afterimages = [];
  debugItemSpawnTimer = 0;
  scatterTimer = 0;

  updateCamera();
  updateHUD();
}

function updateHUD() {
  let hpStr = '';
  for (let i = 0; i < player.maxHp; i++) {
    hpStr += i < player.hp ? '❤️' : '🖤';
  }
  document.getElementById('hp').textContent = hpStr;
  document.getElementById('coins').textContent = player.coins;
  document.getElementById('pos').textContent = Math.round(player.x) + ', ' + Math.round(player.y);
  document.getElementById('dir').textContent = DIRECTION_NAMES[player.direction];
}

function drawFloor(ctx, camX, camY) {
  let startCol = Math.floor(camX / TILE_SIZE);
  let startRow = Math.floor(camY / TILE_SIZE);
  let endCol = Math.ceil((camX + canvasW) / TILE_SIZE);
  let endRow = Math.ceil((camY + canvasH) / TILE_SIZE);

  for (let row = startRow; row <= endRow; row++) {
    for (let col = startCol; col <= endCol; col++) {
      let wx = col * TILE_SIZE;
      let wy = row * TILE_SIZE;
      if (wx >= MAP_W || wy >= MAP_H || wx + TILE_SIZE <= 0 || wy + TILE_SIZE <= 0) continue;

      let sx = wx - camX;
      let sy = wy - camY;

      let pattern = (row + col) % 2 === 0;
      ctx.fillStyle = pattern ? '#3d3a30' : '#38352c';
      ctx.fillRect(sx, sy, TILE_SIZE + 1, TILE_SIZE + 1);

      if (pattern) {
        ctx.fillStyle = 'rgba(0,0,0,0.06)';
        ctx.fillRect(sx + 1, sy + 1, 8, 8);
        ctx.fillRect(sx + TILE_SIZE - 9, sy + TILE_SIZE - 9, 8, 8);
      }
    }
  }
}

function drawGridLines(ctx, camX, camY) {
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;

  let startCol = Math.floor(camX / TILE_SIZE);
  let startRow = Math.floor(camY / TILE_SIZE);
  let endCol = Math.ceil((camX + canvasW) / TILE_SIZE);
  let endRow = Math.ceil((camY + canvasH) / TILE_SIZE);

  for (let row = startRow; row <= endRow; row++) {
    let sy = row * TILE_SIZE - camY;
    if (sy < -1 || sy > canvasH + 1) continue;
    ctx.beginPath();
    ctx.moveTo(0, sy);
    ctx.lineTo(canvasW, sy);
    ctx.stroke();
  }
  for (let col = startCol; col <= endCol; col++) {
    let sx = col * TILE_SIZE - camX;
    if (sx < -1 || sx > canvasW + 1) continue;
    ctx.beginPath();
    ctx.moveTo(sx, 0);
    ctx.lineTo(sx, canvasH);
    ctx.stroke();
  }
}

function drawMapBorder(ctx, camX, camY) {
  ctx.strokeStyle = '#ff6040';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#ff4020';
  ctx.shadowBlur = 8;
  ctx.strokeRect(-camX, -camY, MAP_W, MAP_H);
  ctx.shadowBlur = 0;
}

function drawObstacles(ctx, camX, camY) {
  for (let o of obstacles) {
    let s = worldToScreen(o.x, o.y);
    if (s.x > canvasW + 100 || s.y > canvasH + 100 || s.x < -100 || s.y < -100) continue;

    let grad = ctx.createLinearGradient(s.x, s.y, s.x, s.y + o.h);
    grad.addColorStop(0, '#6e6a60');
    grad.addColorStop(0.4, '#4a4640');
    grad.addColorStop(1, '#2e2c28');
    ctx.fillStyle = grad;
    ctx.fillRect(s.x, s.y, o.w, o.h);

    ctx.strokeStyle = '#5a5650';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(s.x, s.y, o.w, o.h);

    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(s.x + 2, s.y + 2, o.w - 4, o.h / 3);
  }
}

function drawItems(ctx, camX, camY) {
  for (let item of items) {
    if (item.collected) continue;
    let s = worldToScreen(item.x, item.y);
    if (s.x > canvasW + 50 || s.y > canvasH + 50 || s.x < -50 || s.y < -50) continue;

    let bob = Math.sin(gameTime * 3 + item.bobOffset) * 3;
    let sy = s.y + bob;

    ctx.save();
    ctx.shadowColor = item.type.color;
    ctx.shadowBlur = 10;

    if (item.type.name === 'coin') {
      ctx.fillStyle = item.type.color;
      ctx.beginPath();
      ctx.arc(s.x, sy, item.type.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffe860';
      ctx.beginPath();
      ctx.arc(s.x - 2, sy - 2, item.type.size * 0.3, 0, Math.PI * 2);
      ctx.fill();
    } else if (item.type.name === 'gem') {
      ctx.fillStyle = item.type.color;
      ctx.beginPath();
      ctx.moveTo(s.x, sy - item.type.size);
      ctx.lineTo(s.x + item.type.size, sy);
      ctx.lineTo(s.x, sy + item.type.size);
      ctx.lineTo(s.x - item.type.size, sy);
      ctx.closePath();
      ctx.fill();
    } else if (item.type.name === 'heart') {
      ctx.fillStyle = item.type.color;
      let siz = item.type.size;
      ctx.beginPath();
      ctx.moveTo(s.x, sy + siz * 0.3);
      ctx.bezierCurveTo(s.x, sy - siz * 0.5, s.x - siz, sy - siz * 0.2, s.x - siz, sy + siz * 0.2);
      ctx.bezierCurveTo(s.x - siz, sy + siz * 0.8, s.x, sy + siz, s.x, sy + siz);
      ctx.bezierCurveTo(s.x, sy + siz, s.x + siz, sy + siz * 0.8, s.x + siz, sy + siz * 0.2);
      ctx.bezierCurveTo(s.x + siz, sy - siz * 0.2, s.x, sy - siz * 0.5, s.x, sy + siz * 0.3);
      ctx.fill();
    } else if (item.type.name === 'bomb') {
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.arc(s.x, sy, item.type.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff6040';
      ctx.beginPath();
      ctx.arc(s.x - 2, sy - 2, item.type.size * 0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(s.x, sy, item.type.size + 2, 0, Math.PI * 2);
      ctx.stroke();
    } else if (item.type.name === 'big_coin') {
      ctx.fillStyle = item.type.color;
      ctx.beginPath();
      ctx.arc(s.x, sy, item.type.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffe860';
      ctx.beginPath();
      ctx.arc(s.x - 3, sy - 3, item.type.size * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fff8cc';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(s.x, sy, item.type.size + 1, 0, Math.PI * 2);
      ctx.stroke();
    } else if (item.type.name === 'phantom') {
      let flash = 0.5 + Math.abs(Math.sin(gameTime * 6)) * 0.5;
      ctx.shadowColor = '#cc44ff';
      ctx.shadowBlur = 10 + flash * 12;
      ctx.fillStyle = '#9966cc';
      ctx.beginPath();
      ctx.arc(s.x, sy, item.type.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#dd88ff';
      ctx.beginPath();
      ctx.arc(s.x - 2, sy - 2, item.type.size * 0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 6 + flash * 8;
      ctx.strokeStyle = '#eeaaff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(s.x, sy, item.type.size + 3, 0, Math.PI * 2);
      ctx.stroke();
    } else if (item.type.name === 'scatter_book') {
      let flash = Math.abs(Math.sin(gameTime * 12));
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 8 + flash * 20;
      ctx.globalAlpha = 0.6 + flash * 0.4;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(s.x, sy, item.type.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffcc';
      ctx.beginPath();
      ctx.arc(s.x - 1, sy - 1, item.type.size * 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 4 + flash * 10;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(s.x, sy, item.type.size + 4, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawEnemies(ctx, camX, camY) {
  for (let enemy of enemies) {
    let s = worldToScreen(enemy.x, enemy.y);
    if (s.x > canvasW + 200 || s.y > canvasH + 200 || s.x < -200 || s.y < -200) continue;

    if (enemy.dying && enemy.type.isBoss && enemy.boomFrame !== undefined && boomImage.complete && boomImage.naturalWidth > 0) {
      let frame = BOOM_FRAMES[Math.min(enemy.boomFrame, BOOM_FRAMES.length - 1)];

      let drawW = 80;
      let drawH = 80;

      let alpha = 1;
      if (enemy.boomPhase === 'fade') {
        alpha = Math.max(0, enemy.deathTimer / BOSS_FADE_DURATION);
      }

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(s.x, s.y);
      ctx.drawImage(boomImage, frame.sx, frame.sy, frame.sw, frame.sh, -drawW / 2, -drawH / 2, drawW, drawH);
      ctx.restore();
      continue;
    }

    let alpha = 1;
    if (enemy.dying) {
      alpha = Math.max(0, enemy.deathTimer / 0.5);
    }

    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.globalAlpha *= alpha;

    let scale = enemy.dying ? 1 - (1 - alpha) * 0.5 : 1;
    ctx.scale(scale, scale);

    let t = enemy.type;
    ctx.shadowColor = t.color;
    ctx.shadowBlur = enemy.dying ? 0 : 3;

    ctx.fillStyle = t.color;
    ctx.beginPath();

    if (t.name === 'A') {
      let hs = enemy.size * 0.7;
      ctx.moveTo(0, -hs);
      ctx.lineTo(hs, hs * 0.7);
      ctx.lineTo(-hs, hs * 0.7);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.beginPath();
      ctx.arc(0, 0, hs * 0.3, 0, Math.PI * 2);
      ctx.fill();
    } else if (t.name === 'B') {
      let w = enemy.size * 0.7;
      let h = enemy.size * 0.55;
      ctx.ellipse(0, 0, w, h, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.beginPath();
      ctx.ellipse(-3, -3, 4, 3.5, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (t.name === 'C') {
      let hs = enemy.size * 0.65;
      ctx.moveTo(0, -hs);
      ctx.lineTo(hs * 0.4, -hs * 0.35);
      ctx.lineTo(hs, 0);
      ctx.lineTo(hs * 0.4, hs * 0.35);
      ctx.lineTo(0, hs);
      ctx.lineTo(-hs * 0.4, hs * 0.35);
      ctx.lineTo(-hs, 0);
      ctx.lineTo(-hs * 0.4, -hs * 0.35);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(0, 0, hs * 0.25, 0, Math.PI * 2);
      ctx.fill();
    }

    if (!enemy.dying && enemy.hp < enemy.maxHp) {
      let barW = enemy.size * 1.2;
      let barH = 4;
      let barY = -enemy.size - 8;
      ctx.fillStyle = '#300000';
      ctx.fillRect(-barW/2, barY, barW, barH);
      ctx.fillStyle = '#ff4040';
      ctx.fillRect(-barW/2, barY, barW * (enemy.hp / enemy.maxHp), barH);
    }

    ctx.restore();
  }
}

function drawBullets(ctx, camX, camY) {
  for (let b of bullets) {
    let s = worldToScreen(b.x, b.y);
    if (s.x > canvasW + 50 || s.y > canvasH + 50 || s.x < -50 || s.y < -50) continue;

    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.shadowColor = '#ffff88';
    ctx.shadowBlur = 8;

    ctx.fillStyle = '#ffffaa';
    ctx.beginPath();
    ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(0, 0, b.radius * 0.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

function drawAfterimages(ctx, camX, camY) {
  for (let ai of afterimages) {
    let s = worldToScreen(ai.x, ai.y);
    if (s.x > canvasW + 50 || s.y > canvasH + 50 || s.x < -50 || s.y < -50) continue;

    ctx.save();
    ctx.translate(s.x, s.y);
    let alpha = ai.life / 0.3 * 0.35;
    ctx.globalAlpha = alpha;

    if (playerImage.complete && playerImage.naturalWidth > 0) {
      let animSet = DIR_TO_ANIM[ai.direction];
      let frame = SPRITE_FRAMES[animSet][0];
      let srcW = Math.min(frame.sw, playerImage.naturalWidth - frame.sx);
      let srcH = Math.min(frame.sh, playerImage.naturalHeight - frame.sy);
      let dstW = Math.round(SPRITE_W * srcW / frame.sw);
      let dstH = Math.round(SPRITE_H * srcH / frame.sh);
      let dstX = SPRITE_OX + Math.round((SPRITE_W - dstW) / 2);
      let dstY = SPRITE_OY + Math.round((SPRITE_H - dstH) / 2);
      ctx.drawImage(
        playerImage,
        frame.sx, frame.sy, srcW, srcH,
        dstX, dstY, dstW, dstH
      );
    } else {
      ctx.fillStyle = '#4a90d9';
      ctx.beginPath();
      ctx.moveTo(0, -player.size / 2);
      ctx.lineTo(player.size / 2, player.size / 2);
      ctx.lineTo(-player.size / 2, player.size / 2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawPlayer(ctx) {
  let sx = Math.round(halfW);
  let sy = Math.round(halfH);

  ctx.save();
  ctx.translate(sx, sy);

  if (player.invincibleUntil > gameTime && Math.floor(gameTime * 10) % 2 === 0) {
    ctx.globalAlpha = 0.4;
  }

  if (playerImage.complete && playerImage.naturalWidth > 0) {
    let animSet = DIR_TO_ANIM[player.direction];
    let frame = SPRITE_FRAMES[animSet][animFrame];
    let srcW = Math.min(frame.sw, playerImage.naturalWidth - frame.sx);
    let srcH = Math.min(frame.sh, playerImage.naturalHeight - frame.sy);
    let dstW = Math.round(SPRITE_W * srcW / frame.sw);
    let dstH = Math.round(SPRITE_H * srcH / frame.sh);
    let dstX = SPRITE_OX + Math.round((SPRITE_W - dstW) / 2);
    let dstY = SPRITE_OY + Math.round((SPRITE_H - dstH) / 2);
    ctx.drawImage(
      playerImage,
      frame.sx, frame.sy, srcW, srcH,
      dstX, dstY, dstW, dstH
    );

  } else {
    ctx.fillStyle = '#4a90d9';
    ctx.beginPath();
    ctx.moveTo(0, -player.size / 2);
    ctx.lineTo(player.size / 2, player.size / 2);
    ctx.lineTo(-player.size / 2, player.size / 2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#2a6099';
    ctx.beginPath();
    ctx.arc(0, -player.size / 6, player.size / 4, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function drawParticles(ctx, camX, camY) {
  for (let p of particles) {
    let s = worldToScreen(p.x, p.y);
    let alpha = p.life / p.maxLife;
    ctx.fillStyle = p.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
    if (p.color.startsWith('#')) {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
    }
    ctx.beginPath();
    ctx.arc(s.x, s.y, p.size * alpha, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawClickIndicator(ctx) {
  if (!clickIndicator || clickIndicator.time < gameTime) return;

  let s = worldToScreen(clickIndicator.x, clickIndicator.y);
  let progress = 1 - (clickIndicator.time - gameTime) / clickIndicator.duration;
  let alpha = 1 - progress;

  ctx.save();
  ctx.translate(s.x, s.y);

  let scaleIn = 1 + progress * 0.3;
  ctx.scale(scaleIn, scaleIn);
  ctx.globalAlpha = alpha * 0.7;

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    let a = (i / 4) * Math.PI * 2 + progress * 2;
    let r = 8 + Math.sin(progress * Math.PI) * 12;
    let ax = Math.cos(a) * r;
    let ay = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(ax, ay);
    else ctx.lineTo(ax, ay);
  }
  ctx.closePath();
  ctx.stroke();

  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 1;
  let r2 = 6 + Math.sin(progress * Math.PI) * 8;
  ctx.beginPath();
  ctx.arc(0, 0, r2, 0, Math.PI * 2);
  ctx.stroke();

  ctx.restore();
}

function drawMinimap() {
  let mw = minimap.width;
  let mh = minimap.height;
  let scale = mw / MAP_W;
  mctx.clearRect(0, 0, mw, mh);

  mctx.fillStyle = 'rgba(20,20,18,0.85)';
  mctx.fillRect(0, 0, mw, mh);

  mctx.strokeStyle = 'rgba(255,255,255,0.2)';
  mctx.lineWidth = 1;
  mctx.strokeRect(0, 0, mw, mh);

  for (let o of obstacles) {
    mctx.fillStyle = 'rgba(150,150,140,0.4)';
    mctx.fillRect(o.x * scale, o.y * scale, o.w * scale, o.h * scale);
  }

  for (let item of items) {
    if (item.collected) continue;
    mctx.fillStyle = item.type.color;
    mctx.fillRect(item.x * scale - 1, item.y * scale - 1, 2, 2);
  }

  for (let enemy of enemies) {
    if (enemy.dying) continue;
    mctx.fillStyle = enemy.type.color;
    mctx.fillRect(enemy.x * scale - 1, enemy.y * scale - 1, 2, 2);
  }

  mctx.fillStyle = '#ffffff';
  mctx.fillRect(player.x * scale - 2, player.y * scale - 2, 4, 4);
  mctx.strokeStyle = '#ffffff';
  mctx.lineWidth = 1;
  mctx.strokeRect(player.x * scale - 2, player.y * scale - 2, 4, 4);

  let viewW = canvasW * scale;
  let viewH = canvasH * scale;
  let viewX = (player.x * scale) - viewW / 2;
  let viewY = (player.y * scale) - viewH / 2;
  mctx.strokeStyle = 'rgba(255,255,255,0.4)';
  mctx.lineWidth = 1;
  mctx.strokeRect(viewX, viewY, viewW, viewH);
}

function checkPlayerObstacleCollision(newX, newY) {
  let half = player.size / 2 - 2;
  for (let o of obstacles) {
    if (newX + half > o.x && newX - half < o.x + o.w &&
        newY + half > o.y && newY - half < o.y + o.h) {
      let overlapX = Math.min(newX + half - o.x, o.x + o.w - (newX - half));
      let overlapY = Math.min(newY + half - o.y, o.y + o.h - (newY - half));
      if (overlapX < overlapY) {
        newX = newX < o.x + o.w / 2 ? o.x - half : o.x + o.w + half;
      } else {
        newY = newY < o.y + o.h / 2 ? o.y - half : o.y + o.h + half;
      }
    }
  }
  return { x: clamp(newX, half, MAP_W - half), y: clamp(newY, half, MAP_H - half) };
}

function update(dt) {
  gameTime += dt;
  dt = Math.min(dt, 0.1);

  let isKeyMoving = keys.w || keys.a || keys.s || keys.d || keys.arrowup || keys.arrowdown || keys.arrowleft || keys.arrowright || touchJoystickActive;

  if (isKeyMoving || player.moving) {
    animTimer += dt;
    if (animTimer >= FRAME_DURATION) {
      animTimer -= FRAME_DURATION;
      animFrame = (animFrame + 1) % 4;
    }
  } else {
    animFrame = 0;
    animTimer = 0;
    player.direction = 2;
  }

  if (isKeyMoving) {
    let kdx = 0;
    let kdy = 0;
    if (keys.a) kdx -= 1;
    if (keys.d) kdx += 1;
    if (keys.w) kdy -= 1;
    if (keys.s) kdy += 1;
    if (keys.arrowleft) kdx -= 1;
    if (keys.arrowright) kdx += 1;
    if (keys.arrowup) kdy -= 1;
    if (keys.arrowdown) kdy += 1;
    if (touchJoystickActive) {
      kdx += touchJoystickDX;
      kdy += touchJoystickDY;
    }

    let angle = Math.atan2(kdy, kdx);
    player.direction = angleToDirection(angle);

    let speedMult = (player.hasPhantom || debugMode) ? 2 : 1;
    if (debugMode) { player.hasPhantom = true; player.hasScatter = true; }
    let moveDist = PLAYER_SPEED * dt * speedMult;
    if (kdx !== 0 && kdy !== 0) {
      moveDist *= 0.707;
    }

    let newX = player.x + Math.cos(angle) * moveDist;
    let newY = player.y + Math.sin(angle) * moveDist;

    let result = checkPlayerObstacleCollision(newX, newY);
    let actualDx = result.x - player.x;
    let actualDy = result.y - player.y;

    player.x = result.x;
    player.y = result.y;

  } else if (player.moving) {
    let dx = player.targetX - player.x;
    let dy = player.targetY - player.y;
    let distToTarget = Math.hypot(dx, dy);

    if (distToTarget < 2) {
      player.x = player.targetX;
      player.y = player.targetY;
      player.moving = false;
    } else {
      let angle = Math.atan2(dy, dx);
      player.direction = angleToDirection(angle);

      let speedMult = (player.hasPhantom || debugMode) ? 2 : 1;
      if (debugMode) { player.hasPhantom = true; player.hasScatter = true; }
      let moveDist = PLAYER_SPEED * dt * speedMult;
      moveDist = Math.min(moveDist, distToTarget);

      let newX = player.x + Math.cos(angle) * moveDist;
      let newY = player.y + Math.sin(angle) * moveDist;

      let result = checkPlayerObstacleCollision(newX, newY);
      let actualDx = result.x - player.x;
      let actualDy = result.y - player.y;

      player.x = result.x;
      player.y = result.y;

      if (Math.abs(actualDx) > 0.5 || Math.abs(actualDy) > 0.5) {

        let arrivedDx = player.targetX - player.x;
        let arrivedDy = player.targetY - player.y;
        if (Math.hypot(arrivedDx, arrivedDy) < 3) {
          player.x = player.targetX;
          player.y = player.targetY;
          player.moving = false;
        }
      } else if (distToTarget > 5) {
        player.moving = false;
      }
    }
  }

  if (player.hasPhantom && (isKeyMoving || player.moving)) {
    afterimages.push({
      x: player.x,
      y: player.y,
      direction: player.direction,
      life: 0.3
    });
  }

  for (let item of items) {
    if (item.collected) continue;
    if (dist(player, item) < player.size / 2 + item.type.size + 5) {
      item.collected = true;
      if (item.type.value) {
        player.coins += item.type.value;
        spawnParticle(item.x, item.y, item.type.color, 8);
      }
      if (item.type.heal && player.hp < player.maxHp) {
        player.hp = Math.min(player.maxHp, player.hp + item.type.heal);
        spawnParticle(item.x, item.y, '#ff6080', 12);
      }
      if (item.type.bomb) {
        screenShakeUntil = gameTime + 2;
        let targets = enemies.filter(e => !e.dying);
        for (let enemy of targets) {
          enemy.hp -= 1;
          spawnParticle(enemy.x, enemy.y, '#ff8040', 8);
          if (enemy.hp <= 0) {
            killEnemy(enemy);
          }
        }
      }
      if (item.type.phantom) {
        player.hasPhantom = true;
        spawnParticle(item.x, item.y, '#4488ff', 15);
      }
      if (item.type.scatter) {
        player.hasScatter = true;
        spawnParticle(item.x, item.y, '#ffffff', 20);
      }
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  for (let i = afterimages.length - 1; i >= 0; i--) {
    afterimages[i].life -= dt;
    if (afterimages[i].life <= 0) afterimages.splice(i, 1);
  }

  if (clickIndicator && clickIndicator.time < gameTime) {
    clickIndicator = null;
  }

  coinSpawnTimer -= dt;
  if (coinSpawnTimer <= 0) {
    items.push(spawnItem(null, null, 'coin'));
    coinSpawnTimer = 10 + Math.random() * 50;
  }

  if (debugMode) {
    debugItemSpawnTimer -= dt;
    if (debugItemSpawnTimer <= 0) {
      let allNames = ['coin', 'gem', 'heart', 'bomb', 'big_coin', 'phantom', 'scatter_book'];
      items.push(spawnItem(null, null, allNames[Math.floor(Math.random() * allNames.length)]));
      debugItemSpawnTimer = 0.5 + Math.random() * 1.5;
    }
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    let enemy = enemies[i];
    if (enemy.dying) {
      enemy.deathTimer -= dt;
      if (enemy.type.isBoss && enemy.boomFrame !== undefined) {
        let elapsed = (BOSS_ANIM_DURATION + BOSS_FADE_DURATION) - enemy.deathTimer;
        if (elapsed < BOSS_ANIM_DURATION) {
          enemy.boomPhase = 'anim';
          enemy.boomFrame = Math.min(BOOM_FRAMES.length - 1, Math.floor(elapsed / (BOSS_ANIM_DURATION / BOOM_FRAMES.length)));
        } else {
          enemy.boomPhase = 'fade';
          enemy.boomFrame = BOOM_FRAMES.length - 1;
        }
        if (enemy.deathTimer <= 0) {
          enemies.splice(i, 1);
        }
      } else if (enemy.deathTimer <= 0) {
        enemies.splice(i, 1);
      }
      continue;
    }

    let d = dist(player, enemy);
    if (d < enemy.size / 2 + player.size / 2 + 5) {
      if (player.invincibleUntil <= gameTime) {
        player.hp--;
        player.invincibleUntil = gameTime + 1.5;
        spawnParticle(player.x, player.y, '#ff4040', 15);
        if (player.hp <= 0) {
          gameRunning = false;
          showGameOverModal();
          return;
        }
      }
    }

    let angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
    let moveX = Math.cos(angle) * enemy.type.speed * dt;
    let moveY = Math.sin(angle) * enemy.type.speed * dt;

    let hw = enemy.size / 2;

    enemy.x += moveX;
    for (let o of obstacles) {
      if (enemy.x + hw > o.x && enemy.x - hw < o.x + o.w &&
          enemy.y + hw > o.y && enemy.y - hw < o.y + o.h) {
        if (moveX > 0) enemy.x = o.x - hw;
        else enemy.x = o.x + o.w + hw;
      }
    }
    enemy.x = clamp(enemy.x, enemy.size, MAP_W - enemy.size);

    enemy.y += moveY;
    for (let o of obstacles) {
      if (enemy.x + hw > o.x && enemy.x - hw < o.x + o.w &&
          enemy.y + hw > o.y && enemy.y - hw < o.y + o.h) {
        if (moveY > 0) enemy.y = o.y - hw;
        else enemy.y = o.y + o.h + hw;
      }
    }
    enemy.y = clamp(enemy.y, enemy.size, MAP_H - enemy.size);
  }

  enemySpawnTimer -= dt;
  if (enemySpawnTimer <= 0 && enemies.length < 10) {
    enemies.push(spawnEnemy());
    enemySpawnTimer = 8 + Math.random() * 22;
  }

  bulletTimer -= dt;
  if (bulletTimer <= 0) {
    let nearest = null;
    let nearestDist = Infinity;
    for (let enemy of enemies) {
      if (enemy.dying) continue;
      let d = dist(player, enemy);
      if (d < nearestDist) {
        nearestDist = d;
        nearest = enemy;
      }
    }
    if (nearest) {
      let angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
      let bulletRadius = Math.min(10, 5 + player.coins * 0.05);
      bullets.push({
        x: player.x,
        y: player.y,
        vx: Math.cos(angle) * 300,
        vy: Math.sin(angle) * 300,
        radius: bulletRadius,
        targetEnemy: nearest,
        damage: player.zidan_gongjili
      });
    }
    bulletTimer = Math.max(0.1, 1 - player.coins * 0.009);
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    if (b.x < 0 || b.y < 0 || b.x > MAP_W || b.y > MAP_H) {
      bullets.splice(i, 1);
      continue;
    }

    let hitEnemy = null;
    for (let enemy of enemies) {
      if (enemy.dying) continue;
      if (dist(b, enemy) < b.radius + enemy.size / 2) {
        hitEnemy = enemy;
        break;
      }
    }
    if (hitEnemy) {
      hitEnemy.hp -= b.damage;
      spawnParticle(b.x, b.y, '#ffff88', 4);
      bullets.splice(i, 1);
      if (hitEnemy.hp <= 0) {
        killEnemy(hitEnemy);
      }
    }
  }

  if (player.hasScatter) {
    scatterTimer -= dt;
    if (scatterTimer <= 0) {
      let bulletRadius = Math.min(10, 5 + player.coins * 0.05);
      let count = 10;
      for (let i = 0; i < count; i++) {
        let angle = (Math.PI * 2 / count) * i;
        bullets.push({
          x: player.x,
          y: player.y,
          vx: Math.cos(angle) * 250,
          vy: Math.sin(angle) * 250,
          radius: bulletRadius,
          targetEnemy: null,
          damage: player.zidan_gongjili
        });
      }
      scatterTimer = 3;
    }
  }

  updateCamera();
  updateHUD();
}

function render() {
  ctx.clearRect(0, 0, canvasW, canvasH);

  let shakeX = 0;
  if (gameTime < screenShakeUntil) {
    shakeX = Math.sin(gameTime * 40) * 10;
  }

  ctx.save();
  ctx.translate(shakeX, 0);
  ctx.fillStyle = '#2a2820';
  ctx.fillRect(-cameraX, -cameraY, MAP_W, MAP_H);

  drawFloor(ctx, cameraX, cameraY);
  drawGridLines(ctx, cameraX, cameraY);
  drawObstacles(ctx, cameraX, cameraY);
  drawItems(ctx, cameraX, cameraY);
  drawEnemies(ctx, cameraX, cameraY);
  drawBullets(ctx, cameraX, cameraY);
  drawClickIndicator(ctx);
  drawAfterimages(ctx, cameraX, cameraY);
  drawPlayer(ctx);
  drawParticles(ctx, cameraX, cameraY);
  drawMapBorder(ctx, cameraX, cameraY);

  ctx.restore();

  drawMinimap();
}

function gameLoop(time) {
  requestAnimationFrame(gameLoop);
  if (!gameRunning) return;
  if (lastTime === 0) lastTime = time;
  let dt = (time - lastTime) / 1000;
  lastTime = time;

  update(dt);
  render();
}

canvas.addEventListener('click', (e) => {
  if (!gameRunning) return;
  let world = screenToWorld(e.clientX, e.clientY);
  world.x = clamp(world.x, player.size / 2, MAP_W - player.size / 2);
  world.y = clamp(world.y, player.size / 2, MAP_H - player.size / 2);

  player.targetX = world.x;
  player.targetY = world.y;
  player.moving = true;

  let angle = Math.atan2(world.y - player.y, world.x - player.x);
  player.direction = angleToDirection(angle);

  clickIndicator = {
    x: world.x,
    y: world.y,
    time: gameTime + 0.6,
    duration: 0.6
  };
});

canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (!gameRunning) return;
  let world = screenToWorld(e.clientX, e.clientY);
  let nearest = null;
  let nearestDist = 60;
  for (let enemy of enemies) {
    if (enemy.dying) continue;
    let d = dist(world, enemy);
    if (d < nearestDist) {
      nearestDist = d;
      nearest = enemy;
    }
  }
  if (nearest) {
    nearest.hp -= player.attackPower;
    spawnParticle(nearest.x, nearest.y, '#ffffff', 5);
    if (nearest.hp <= 0) {
      killEnemy(nearest);
    }
  }
});

canvas.addEventListener('mousemove', (e) => {
  let world = screenToWorld(e.clientX, e.clientY);
  mouseWorldX = world.x;
  mouseWorldY = world.y;
  mouseOnMap = world.x >= 0 && world.y >= 0 && world.x <= MAP_W && world.y <= MAP_H;
});

window.addEventListener('resize', resize);

window.addEventListener('keydown', (e) => {
  if (e.key === 'F1') {
    e.preventDefault();
    debugMode = !debugMode;
    document.getElementById('debug-hud').style.display = debugMode ? 'block' : 'none';
    if (!debugMode) {
      player.hasPhantom = false;
      player.hasScatter = false;
    }
    return;
  }
  if (!gameRunning) return;
  let key = e.key.toLowerCase();
  if (key === 'w' || key === 'a' || key === 's' || key === 'd' ||
      key === 'arrowup' || key === 'arrowdown' || key === 'arrowleft' || key === 'arrowright') {
    e.preventDefault();
    keys[key] = true;
    if (player.moving) {
      player.moving = false;
    }
  }
});

window.addEventListener('keyup', (e) => {
  let key = e.key.toLowerCase();
  if (key === 'w' || key === 'a' || key === 's' || key === 'd' ||
      key === 'arrowup' || key === 'arrowdown' || key === 'arrowleft' || key === 'arrowright') {
    e.preventDefault();
    keys[key] = false;
  }
});

document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-debug-start').addEventListener('click', debugStartGame);
document.getElementById('btn-restart').addEventListener('click', restartGame);

let touchJoystickActive = false;
let touchJoystickDX = 0;
let touchJoystickDY = 0;
let touchJoystickId = null;

const joystickEl = document.getElementById('touch-joystick');
const thumbEl = joystickEl.querySelector('.thumb');

joystickEl.addEventListener('touchstart', (e) => {
  e.preventDefault();
  let touch = e.changedTouches[0];
  touchJoystickId = touch.identifier;
  touchJoystickActive = true;
  player.moving = false;
  updateThumbPos(touch.clientX, touch.clientY);
});

joystickEl.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (let touch of e.changedTouches) {
    if (touch.identifier === touchJoystickId) {
      updateThumbPos(touch.clientX, touch.clientY);
    }
  }
});

joystickEl.addEventListener('touchend', (e) => {
  e.preventDefault();
  for (let touch of e.changedTouches) {
    if (touch.identifier === touchJoystickId) {
      touchJoystickActive = false;
      touchJoystickId = null;
      touchJoystickDX = 0;
      touchJoystickDY = 0;
      thumbEl.style.transform = 'translate(-50%, -50%)';
    }
  }
});

joystickEl.addEventListener('touchcancel', (e) => {
  touchJoystickActive = false;
  touchJoystickId = null;
  touchJoystickDX = 0;
  touchJoystickDY = 0;
  thumbEl.style.transform = 'translate(-50%, -50%)';
});

function updateThumbPos(clientX, clientY) {
  let rect = joystickEl.getBoundingClientRect();
  let cx = rect.left + rect.width / 2;
  let cy = rect.top + rect.height / 2;
  let dx = clientX - cx;
  let dy = clientY - cy;
  let maxDist = rect.width / 2 - 5;
  let dist = Math.hypot(dx, dy);
  if (dist > maxDist) {
    dx = dx / dist * maxDist;
    dy = dy / dist * maxDist;
    dist = maxDist;
  }
  thumbEl.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
  touchJoystickDX = dist > 8 ? dx / maxDist : 0;
  touchJoystickDY = dist > 8 ? dy / maxDist : 0;
}

canvas.addEventListener('touchstart', (e) => {
  if (!gameRunning) return;
  e.preventDefault();
  let touch = e.changedTouches[0];
  let world = screenToWorld(touch.clientX, touch.clientY);
  world.x = clamp(world.x, player.size / 2, MAP_W - player.size / 2);
  world.y = clamp(world.y, player.size / 2, MAP_H - player.size / 2);
  player.targetX = world.x;
  player.targetY = world.y;
  player.moving = true;
  let angle = Math.atan2(world.y - player.y, world.x - player.x);
  player.direction = angleToDirection(angle);
  clickIndicator = {
    x: world.x,
    y: world.y,
    time: gameTime + 0.6,
    duration: 0.6
  };
});

document.addEventListener('touchmove', (e) => {
  if (e.target === canvas || e.target === joystickEl || e.target === thumbEl || joystickEl.contains(e.target)) {
    e.preventDefault();
  }
}, { passive: false });

document.addEventListener('touchstart', (e) => {
  if (e.target === canvas || e.target === joystickEl || e.target === thumbEl || joystickEl.contains(e.target)) {
    e.preventDefault();
  }
}, { passive: false });

playerImage.onload = () => {
  resize();
  initWorld();
  showStartModal();
  requestAnimationFrame(gameLoop);
};

playerImage.onerror = () => {
  resize();
  initWorld();
  showStartModal();
  requestAnimationFrame(gameLoop);
};

if (playerImage.complete) {
  resize();
  initWorld();
  showStartModal();
  requestAnimationFrame(gameLoop);
}
</script>
