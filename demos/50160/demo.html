// ==================== 评估算法 ====================
function calcResult() {
  const dimScores = {economic:0,time:0,environment:0,cognition:0,risk:0,responsibility:0};
  const dimCounts = {economic:0,time:0,environment:0,cognition:0,risk:0,responsibility:0};
  let hasVeto = false;
  const riskItems = [];
  const prepList = [];

  QUESTIONS.forEach(q => {
    const ans = STATE.answers[q.id];
    if (ans === undefined) return;
    let score = 0;
    if (Array.isArray(ans)) {
      if (ans.length === 0) return;
      const hasFull = ans.some(i => q.options[i]?.value === 100);
      if (hasFull) score = 100;
      else score = ans.reduce((a,i)=>a+(q.options[i]?.value||0),0)/ans.length;
    } else {
      score = q.options[ans]?.value || 0;
    }
    dimScores[q.dim] += score;
    dimCounts[q.dim]++;
    const checkVeto = (i) => {
      const opt = q.options[i];
      if (opt?.isVeto) { hasVeto = true; riskItems.push(`${q.dimLabel}：${opt.label}`); }
    };
    if (Array.isArray(ans)) ans.forEach(checkVeto); else checkVeto(ans);
    if (score < 60 && score > 0) {
      if (q.id===8) prepList.push('完成住所封窗施工（高层养猫硬性要求）');
      if (q.id===2) prepList.push('预留至少 3000 元宠物医疗备用金');
      if (q.id===10) prepList.push('系统学习目标物种的基础养护知识');
      if (q.id===5) prepList.push('确定可靠的寄养或上门喂养渠道');
    }
  });
  Object.keys(dimScores).forEach(d => { if (dimCounts[d]>0) dimScores[d] = Math.round(dimScores[d]/dimCounts[d]); });
  const total = Math.round(Object.values(dimScores).reduce((a,b)=>a+b,0)/6);
  let level;
  if (hasVeto || total < 50) level = 'high';
  else if (total < 75) level = 'medium';
  else level = 'low';
  if (level === 'high' && prepList.length === 0) prepList.push('建议先以低门槛方式参与公益（云养/志愿），积累经验后再评估');
  STATE.result = { total, level, dimScores, riskItems, prepList };
  return STATE.result;
}

function matchPets() {
  if (!STATE.result || STATE.result.level === 'high') return [];
  return STATE.pets.filter(p => p.status === 'available').map(pet => {
    let score = 60; const reasons = []; const warnings = [];
    if (pet.hardRequirements.some(r=>r.includes('封窗')) && STATE.result.dimScores.environment < 80) {
      warnings.push('你的封窗条件尚未达标，该动物要求必须封窗'); score -= 25;
    } else if (pet.hardRequirements.some(r=>r.includes('封窗'))) {
      reasons.push('已具备封窗条件，符合硬性要求'); score += 10;
    }
    if (pet.hardRequirements.some(r=>r.includes('遛狗')) && STATE.result.dimScores.time < 70) {
      warnings.push('该动物需要每日遛狗，你的时间投入可能不足'); score -= 15;
    }
    if (STATE.prefs.species && pet.species === STATE.prefs.species) { reasons.push('符合你偏好的物种'); score += 8; }
    if (STATE.prefs.city && pet.city === STATE.prefs.city) { reasons.push(`同在${pet.city}，便于线下对接`); score += 12; }
    else if (STATE.prefs.city) score -= 5;
    if (pet.difficulty === 'easy' && STATE.result.dimScores.cognition >= 60) { reasons.push('饲养难度低，适配你的养宠认知水平'); score += 8; }
    if (pet.difficulty === 'hard' && STATE.result.dimScores.cognition < 80) { warnings.push('该动物饲养难度较高，建议有经验者领养'); score -= 12; }
    if (STATE.result.dimScores.economic >= 80 && pet.difficulty !== 'easy') { reasons.push('经济承受力良好，可承担较高养护成本'); score += 6; }
    if (STATE.prefs.personality.length > 0) {
      const matched = pet.personality.filter(p => STATE.prefs.personality.includes(p));
      if (matched.length > 0) { reasons.push(`性格${matched.join('、')}符合你的偏好`); score += matched.length * 5; }
    }
    if (STATE.result.dimScores.responsibility >= 80) { reasons.push('责任意识强，救助方更放心交付'); score += 6; }
    score = Math.max(0, Math.min(100, score));
    return { pet, score, reasons, warnings };
  }).sort((a,b)=>b.score-a.score);
}

// ==================== 评估页 ====================
function AssessmentView() {
  const q = QUESTIONS[STATE.step];
  const total = QUESTIONS.length;
  const progress = ((STATE.step+1)/total)*100;
  const ans = STATE.answers[q.id];
  const answered = q.type==='multiple' ? (Array.isArray(ans)&&ans.length>0) : (ans!==undefined);
  const dims = DIMENSIONS;
  const curDimIdx = dims.findIndex(d=>d.key===q.dim);

  const handleSelect = (idx) => {
    if (q.type === 'multiple') {
      const arr = Array.isArray(ans) ? [...ans] : [];
      const pos = arr.indexOf(idx);
      if (pos>=0) arr.splice(pos,1); else arr.push(idx);
      STATE.answers[q.id] = arr;
    } else {
      STATE.answers[q.id] = idx;
    }
    render();
  };

  const handleNext = () => {
    if (STATE.step < total-1) { STATE.step++; render(); window.scrollTo(0,0); }
    else { calcResult(); navigate('result'); }
  };

  return `
    <div class="max-w-3xl mx-auto py-10 px-4 fade-in">
      <div class="text-center">
        <span class="font-hand text-2xl text-terracotta-500">养宠准入与责任评估</span>
        <h1 class="mt-1 font-serif text-3xl md:text-4xl font-bold text-coffee-800">5 分钟，理性判断你是否适合养宠</h1>
        <p class="mt-3 text-sm text-coffee-700/70">6 大维度共 18 道题，关键约束项设置「一票否决」</p>
      </div>

      <div class="mt-10 flex items-center justify-between gap-1">
        ${dims.map((d,i)=>{const isCur=i===curDimIdx;const isPast=i<curDimIdx;return `<div class="flex flex-1 items-center"><div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border-2 text-xs ${isCur?'border-terracotta-500 bg-terracotta-500 text-cream-50':isPast?'border-sage-400 bg-sage-400 text-cream-50':'border-cream-300 bg-cream-50 text-cream-400'}">${isPast?'✓':i+1}</div>${i<dims.length-1?`<div class="h-0.5 flex-1 rounded-full ${isPast?'bg-sage-400':'bg-cream-300'}"></div>`:''}</div>`}).join('')}
      </div>

      <div class="mt-8">
        <div class="mb-4 flex items-center justify-between">
          <span class="text-sm text-coffee-700/60">第 <span class="font-display text-2xl text-terracotta-500">${STATE.step+1}</span> / ${total} 题</span>
          <button onclick="STATE.answers={};STATE.step=0;render()" class="text-xs text-coffee-700/60 hover:text-terracotta-500">↺ 重新开始</button>
        </div>
        <div class="mb-6 h-1.5 rounded-full bg-cream-200 overflow-hidden"><div class="h-full rounded-full bg-gradient-to-r from-terracotta-400 to-terracotta-500 transition-all" style="width:${progress}%"></div></div>

        <div class="rounded-3xl border border-cream-300/60 bg-cream-50 p-6 md:p-8 card-shadow fade-in">
          <div class="flex items-center gap-2">
            <span class="chip bg-sage-100 text-sage-600">${q.dimLabel}</span>
            ${q.isCritical?`<span class="chip bg-red-100 text-red-700">⚠ 关键约束</span>`:''}
          </div>
          <h2 class="mt-4 font-serif text-xl md:text-2xl font-semibold leading-relaxed text-coffee-800">${q.title}</h2>
          <div class="mt-6 space-y-3">
            ${q.options.map((opt,idx)=>{const sel=q.type==='multiple'?(Array.isArray(ans)&&ans.includes(idx)):(ans===idx);return `<button onclick="handleSelect(${idx})" class="flex w-full items-center justify-between rounded-2xl border-2 px-5 py-4 text-left transition-all ${sel?'border-terracotta-500 bg-terracotta-50':'border-cream-300 bg-cream-50 hover:border-terracotta-300'} ${opt.isVeto?'border-red-300':''}"><span class="font-medium ${sel?'text-terracotta-700':'text-coffee-800'}">${opt.label}</span><span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full border-2 ${sel?'border-terracotta-500 bg-terracotta-500 text-cream-50':'border-cream-300 text-transparent'}">${sel?'✓':''}</span></button>`}).join('')}
          </div>
          ${q.type==='multiple'?`<p class="mt-3 text-xs text-coffee-700/50">可多选，选择最符合你的情况</p>`:''}
        </div>

        <div class="mt-6 flex items-center justify-between">
          <button onclick="STATE.step=Math.max(0,STATE.step-1);render();window.scrollTo(0,0)" class="btn-ghost" ${STATE.step===0?'disabled style="opacity:0.4"':''}>← 上一题</button>
          <button onclick="handleNext()" class="btn-primary" ${!answered?'disabled style="opacity:0.4"':''}>${STATE.step===total-1?'提交评估':'下一题 →'}</button>
        </div>
      </div>
    </div>`;
}

function exportReport() {
  const r = STATE.result;
  const report = {标题:'宠遇 · 养宠准入评估报告',完成时间:new Date().toLocaleString('zh-CN'),总分:r.total,风险等级:{high:'高风险',medium:'中风险',low:'低风险'}[r.level],维度得分:r.dimScores,风险项:r.riskItems,准备清单:r.prepList};
  const blob = new Blob([JSON.stringify(report,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`宠遇评估报告_${Date.now()}.json`; a.click(); URL.revokeObjectURL(url);
}

function doAnalyze() {
  const scenarios = [
    {level:'healthy',ageEstimate:'约 1-2 岁 · 成体',label:'健康',color:'text-green-600',bg:'bg-green-50',border:'border-green-200',icon:'❤️',
     advice:['状态健康，不建议盲目捕捉带离，避免应激','若小区有固定投喂点，可继续观察其活动规律','建议联系本地救助组织评估是否需要 TNR','提供清洁饮水与适量猫粮/狗粮'],
     resources:[{type:'投喂点',name:'浦东社区流浪猫投喂点',contact:'志愿者微信 cat-sh-001'},{type:'TNR 咨询',name:'上海喵星救助站 TNR 项目',contact:'微信 meow-sh-001'}]},
    {level:'injured',ageEstimate:'约 3 岁 · 成体',label:'受伤',color:'text-red-600',bg:'bg-red-50',border:'border-red-200',icon:'⚠️',
     advice:['疑似后腿受伤，行动迟缓，需尽快就医','接近时请缓慢移动，用毛巾或衣物轻柔包裹','准备航空箱或带盖纸箱作为临时安置容器','不要擅自喂食喂水，以免后续手术需要空腹'],
     resources:[{type:'合作医院',name:'瑞鹏宠物医院（浦东店）',contact:'021-XXXX-XXXX'},{type:'救助站',name:'上海喵星救助站',contact:'微信 meow-sh-001'}]},
    {level:'sick',ageEstimate:'约 0.5 岁 · 幼体',label:'患病',color:'text-orange-600',bg:'bg-orange-50',border:'border-orange-200',icon:'🩺',
     advice:['疑似上呼吸道感染（眼鼻有分泌物），需专业诊治','幼体免疫力低，建议尽快送医而非自行处理','与其他宠物隔离，避免交叉感染','注意保暖，可用温水袋包裹毛巾置于安置箱内'],
     resources:[{type:'合作医院',name:'芭比堂动物医院',contact:'021-XXXX-XXXX'},{type:'救助站',name:'上海喵星救助站',contact:'微信 meow-sh-001'}]},
  ];
  const s = scenarios[Math.floor(Math.random()*scenarios.length)];
  document.getElementById('rescue-result').innerHTML = `
    <div class="mt-6 rounded-3xl border-2 ${s.border} ${s.bg} p-6 md:p-8 fade-in">
      <div class="flex items-center gap-3">
        <span class="flex h-12 w-12 items-center justify-center rounded-2xl bg-cream-50 ${s.color} text-2xl">${s.icon}</span>
        <div><div class="font-serif text-2xl font-bold ${s.color}">${s.label}</div><div class="text-xs text-coffee-700/60">${s.ageEstimate}</div></div>
      </div>
      <h4 class="mt-6 font-serif font-semibold text-coffee-800">分级救助建议</h4>
      <ul class="mt-3 space-y-2">${s.advice.map(a=>`<li class="flex items-start gap-2 text-sm text-coffee-800"><span class="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full ${s.color.replace('text-','bg-')}"></span>${a}</li>`).join('')}</ul>
      <h4 class="mt-6 font-serif font-semibold text-coffee-800">附近合作资源</h4>
      <div class="mt-3 grid gap-3 sm:grid-cols-2">${s.resources.map(r=>`<div class="rounded-xl border border-cream-300/60 bg-cream-50 p-4"><span class="chip bg-terracotta-100 text-terracotta-700">${r.type}</span><p class="mt-2 font-medium text-coffee-800">${r.name}</p><p class="mt-1 flex items-center gap-1 text-xs text-coffee-700/70">📞 ${r.contact}</p></div>`).join('')}</div>
    </div>`;
}

function openPetModal(id) {
  const pet = id ? STATE.pets.find(p=>p.id===id) : null;
  STATE.modal = { type:'pet', id, pet: pet ? {...pet} : {id:'p_'+Date.now(),name:'',species:'cat',age:1,ageStage:'成年',gender:'male',breed:'',city:'',rescueOrg:'上海喵星救助站',orgContact:'',health:{vaccinated:false,neutered:false,dewormed:false,desc:''},personality:[],difficulty:'easy',suitableFor:[],specialNotes:[],hardRequirements:[],story:'',photo:'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=a%20cute%20rescued%20pet%20in%20a%20shelter%2C%20warm%20soft%20light&image_size=landscape_4_3',status:'available',intakeDate:new Date().toISOString().slice(0,10)} };
  render();
}

function savePet() {
  const m = STATE.modal.pet;
  if (STATE.modal.id) {
    const i = STATE.pets.findIndex(p=>p.id===STATE.modal.id);
    STATE.pets[i] = m;
  } else {
    STATE.pets.unshift(m);
  }
  STATE.modal = null;
  render();
}

function deletePet(id) {
  if (confirm('确定要删除该动物档案吗？')) {
    STATE.pets = STATE.pets.filter(p=>p.id!==id);
    render();
  }
}

function updateAppStatus(id, status) {
  const a = STATE.applications.find(x=>x.id===id);

}
function deleteApp(id) {
  if (confirm('确定要删除该领养申请吗？')) {
    STATE.applications = STATE.applications.filter(a=>a.id!==id);

}

function openFollowupModal(id) {
  const f = id ? STATE.followups.find(x=>x.id===id) : null;
  STATE.modal = { type:'followup', id, followup: f ? {...f} : {id:'f_'+Date.now(),petId:STATE.pets[0]?.id||'',petName:STATE.pets[0]?.name||'',node:7,result:'pending',note:'',date:new Date().toISOString().slice(0,10)} };
  render();
}
function saveFollowup() {
  const m = STATE.modal.followup;
  const pet = STATE.pets.find(p=>p.id===m.petId);
  m.petName = pet?.name || m.petName;
  if (STATE.modal.id) {
    const i = STATE.followups.findIndex(x=>x.id===STATE.modal.id);
    STATE.followups[i] = m;
  } else {
    STATE.followups.unshift(m);
  }
  STATE.modal = null;
  render();
}
function deleteFollowup(id) {
  if (confirm('确定要删除该回访记录吗？')) {
    STATE.followups = STATE.followups.filter(f=>f.id!==id);
    render();
  }
}

function WelfarePanel() {

function welfareCard(type, item) {
  let body = '';
  if (type==='cloud') body = `<h4 class="font-serif font-semibold text-coffee-800">${item.petName}</h4><p class="mt-0.5 text-xs text-coffee-700/60">${item.org} · ${item.city}</p><div class="mt-2 flex gap-3 text-xs text-coffee-700/70"><span>¥${item.monthlyCost}/月</span><span>${item.supporters} 支持者</span><span>${item.progress}%</span></div>`;
  if (type==='volunteer') body = `<h4 class="font-serif font-semibold text-coffee-800">${item.title}</h4><p class="mt-0.5 text-xs text-coffee-700/60">${item.org} · ${item.city}</p><div class="mt-2 flex flex-wrap gap-3 text-xs text-coffee-700/70"><span class="chip bg-sage-100 text-sage-600">${item.type}</span><span>${item.date}</span><span>${item.signed}/${item.spots} 人</span></div>`;
  if (type==='donation') body = `<div class="flex items-center gap-2"><h4 class="font-serif font-semibold text-coffee-800">${item.material}</h4><span class="chip ${urgencyConfig[item.urgency].color}">${urgencyConfig[item.urgency].label}</span></div><p class="mt-0.5 text-xs text-coffee-700/60">${item.org} · ${item.city}</p><div class="mt-2 flex gap-3 text-xs text-coffee-700/70"><span>${item.quantity}</span><span class="text-green-600">已核验</span></div>`;
  if (type==='article') body = `<span class="chip bg-terracotta-100 text-terracotta-700">${item.category}</span><h4 class="mt-2 font-serif font-semibold text-coffee-800">${item.title}</h4><p class="mt-1 text-xs text-coffee-700/60 line-clamp-2">${item.excerpt}</p><div class="mt-2 flex gap-2">${item.tags.map(t=>`<span class="chip bg-cream-200 text-coffee-700/70">#${t}</span>`).join('')}</div>`;
  return `<div class="rounded-2xl border border-cream-300/60 bg-cream-50 p-4 card-shadow fade-in"><div class="flex items-start justify-between gap-3"><div class="flex-1">${body}</div><div class="flex shrink-0 flex-col gap-1"><button onclick="openWelfareModal('${type}','${item.id}')" class="rounded-lg p-1.5 hover:bg-terracotta-50">✏️</button><button onclick="deleteWelfare('${type}','${item.id}')" class="rounded-lg p-1.5 hover:bg-red-50">🗑️</button></div></div></div>`;
}

function openWelfareModal(type, id) {
  const arr = type==='cloud'?STATE.cloudProjects:type==='volunteer'?STATE.volunteerJobs:type==='donation'?STATE.donationItems:STATE.articles;
  const item = id ? JSON.parse(JSON.stringify(arr.find(x=>x.id===id))) : null;
  const blank = type==='cloud'?{id:'c_'+Date.now(),petName:'',org:'上海喵星救助站',city:'上海',monthlyCost:80,progress:0,supporters:0,cover:'',update:''}
    : type==='volunteer'?{id:'v_'+Date.now(),org:'上海喵星救助站',city:'上海',title:'',type:'日常照料',date:'',spots:5,signed:0,desc:''}
    : type==='donation'?{id:'d_'+Date.now(),org:'上海喵星救助站',city:'上海',material:'',urgency:'medium',quantity:'',address:'',verified:true}
    : {id:'a_'+Date.now(),title:'',category:'科学养宠',excerpt:'',readTime:5,cover:'',tags:[]};
  STATE.modal = { type:'welfare', wType:type, id, item: item || blank };
  render();
}

function saveWelfare() {
  const { wType, id, item } = STATE.modal;
  const arr = wType==='cloud'?STATE.cloudProjects:wType==='volunteer'?STATE.volunteerJobs:wType==='donation'?STATE.donationItems:STATE.articles;
  if (id) {
    const i = arr.findIndex(x=>x.id===id);
    arr[i] = item;
  } else {
    arr.unshift(item);
  }
  STATE.modal = null;
  render();
}

function deleteWelfare(type, id) {
  if (!confirm('确定要删除该记录吗？')) return;
  if (type==='cloud') STATE.cloudProjects = STATE.cloudProjects.filter(x=>x.id!==id);
  if (type==='volunteer') STATE.volunteerJobs = STATE.volunteerJobs.filter(x=>x.id!==id);
  if (type==='donation') STATE.donationItems = STATE.donationItems.filter(x=>x.id!==id);
  if (type==='article') STATE.articles = STATE.articles.filter(x=>x.id!==id);
  render();
}

      <div class="modal-overlay" onclick="if(event.target===this)STATE.modal=null,render()">
        <div class="modal-box p-6 fade-in">
          <div class="flex items-center justify-between mb-4"><h3 class="font-serif text-lg font-semibold text-coffee-800">${m.id?'编辑':'新增'} · ${({cloud:'云养',volunteer:'志愿',donation:'捐赠',article:'科普'})[t]}</h3><button onclick="STATE.modal=null;render()" class="text-2xl text-coffee-700/60">×</button></div>
          <div class="space-y-3">${fields}<div class="flex gap-2 pt-2"><button onclick="saveWelfare()" class="flex-1 btn-primary">${m.id?'保存修改':'创建'}</button><button onclick="STATE.modal=null;render()" class="btn-ghost">取消</button></div></div>
        </div>
      </div>`;
  }

  return '';
}

// ==================== 主渲染 ====================
function render() {
  const viewMap = {
    home: HomeView, assessment: AssessmentView, result: ResultView,
    match: MatchView, pet: PetDetailView, rescue: RescueView,
    welfare: WelfareView, admin: AdminView,
  };
  const content = viewMap[STATE.view] ? viewMap[STATE.view]() : HomeView();
  document.getElementById('app').innerHTML = Navbar() + `<main>${content}</main>` + Footer() + Modal();
}

// 暴露函数到全局
window.navigate = navigate;
window.handleSelect = (idx) => {
  const q = QUESTIONS[STATE.step];
  if (q.type === 'multiple') {
    const ans = Array.isArray(STATE.answers[q.id]) ? [...STATE.answers[q.id]] : [];
    const pos = ans.indexOf(idx);
    if (pos>=0) ans.splice(pos,1); else ans.push(idx);
    STATE.answers[q.id] = ans;
  } else {
    STATE.answers[q.id] = idx;
  }
  render();
};
window.handleNext = () => {
  if (STATE.step < QUESTIONS.length-1) { STATE.step++; render(); window.scrollTo(0,0); }
  else { calcResult(); navigate('result'); }
};
window.exportReport = exportReport;
window.toggleP = (p) => { const arr = STATE.prefs.personality; const i = arr.indexOf(p); if (i>=0) arr.splice(i,1); else arr.push(p); render(); };
window.openApplyModal = openApplyModal;
window.submitApplication = submitApplication;
window.doAnalyze = doAnalyze;
window.openPetModal = openPetModal;
window.savePet = savePet;
window.deletePet = deletePet;
window.updateAppStatus = updateAppStatus;
window.deleteApp = deleteApp;
window.openFollowupModal = openFollowupModal;
window.saveFollowup = saveFollowup;
window.deleteFollowup = deleteFollowup;
window.openWelfareModal = openWelfareModal;
window.saveWelfare = saveWelfare;
window.deleteWelfare = deleteWelfare;
window.STATE = STATE;

// 初始渲染
render();
</script>
</body>
</html>
