<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Studio · AI 穿搭助手 Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#E85A4F;
  --bg:#FAFAF7;
  --card:#FFFFFF;
  --text:#1A1A1A;
  --soft:#6B6B6B;
  --line:#EEE;
  --radius:14px;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  min-height:100vh;
}
.app{max-width:420px;margin:0 auto;min-height:100vh;background:var(--card);box-shadow:0 0 40px rgba(0,0,0,.04);position:relative}

/* 顶部 */
.topbar{
  position:sticky;top:0;z-index:10;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
  padding:14px 20px;display:flex;justify-content:space-between;align-items:center;
}
.brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.brand::before{content:'';width:22px;height:22px;border-radius:6px;background:var(--primary)}
.date{font-size:12px;color:var(--soft)}

/* Tab 切换 */
.tabs{
  display:flex;border-bottom:1px solid var(--line);
  background:#fff;position:sticky;top:54px;z-index:9;
}
.tab{
  flex:1;padding:12px;text-align:center;font-size:14px;
  color:var(--soft);cursor:pointer;border-bottom:2px solid transparent;
  transition:all .2s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit;
}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab-content{display:none;padding:20px;animation:fadeIn .3s}
.tab-content.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* 今日推荐 */
.weather-strip{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;background:#FFF9F5;border-radius:var(--radius);
  margin-bottom:16px;font-size:13px;
}
.weather-strip .left{display:flex;align-items:center;gap:8px}
.weather-strip .right{color:var(--soft);font-size:12px}

.scene-picker{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.scene-chip{
  padding:6px 14px;border-radius:100px;font-size:12px;
  background:#F5F5F2;color:var(--soft);cursor:pointer;border:1px solid transparent;
}
.scene-chip.active{background:#FFF1ED;color:var(--primary);border-color:var(--primary);font-weight:500}

.recommend-card{
  background:linear-gradient(135deg,#E85A4F 0%,#F47B5C 100%);
  color:#fff;border-radius:var(--radius);padding:20px;margin-bottom:20px;
  position:relative;overflow:hidden;
}
.recommend-card::after{
  content:'';position:absolute;top:-40px;right:-40px;
  width:120px;height:120px;background:rgba(255,255,255,.15);border-radius:50%;
}
.recommend-card .label{font-size:11px;opacity:.9;letter-spacing:.1em;text-transform:uppercase}
.recommend-card h3{font-size:1.4rem;margin:6px 0 16px;font-weight:700}
.outfit-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:relative;z-index:1}
.outfit-slot{
  aspect-ratio:1;background:rgba(255,255,255,.95);border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:24px;color:#333;
}
.outfit-slot small{font-size:9px;color:var(--soft);margin-top:2px}

.action-row{display:flex;gap:8px;margin-top:16px}
.btn{
  flex:1;padding:10px;border-radius:8px;font-size:13px;font-weight:500;
  cursor:pointer;border:none;font-family:inherit;transition:all .2s;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-secondary{background:#F5F5F2;color:var(--text)}
.btn-secondary:hover{background:#EAEAE5}

/* 衣柜 */
.closet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.closet-header h2{font-size:1.05rem;font-weight:600}
.add-btn{
  background:var(--primary);color:#fff;width:32px;height:32px;
  border-radius:50%;border:none;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.closet-categories{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.cat-chip{
  padding:5px 12px;border-radius:100px;font-size:12px;background:#F5F5F2;
  color:var(--soft);cursor:pointer;border:none;white-space:nowrap;font-family:inherit;
}
.cat-chip.active{background:#FFF1ED;color:var(--primary);font-weight:500}
.closet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cloth-item{
  aspect-ratio:1;background:#F8F8F5;border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:32px;cursor:pointer;position:relative;transition:all .2s;
  border:2px solid transparent;
}
.cloth-item:hover{background:#F0F0EC}
.cloth-item.selected{border-color:var(--primary);background:#FFF9F5}
.cloth-item .del{
  position:absolute;top:4px;right:4px;width:18px;height:18px;
  background:rgba(0,0,0,.6);color:#fff;border-radius:50%;
  font-size:11px;display:none;align-items:center;justify-content:center;
}
.cloth-item:hover .del{display:flex}
.cloth-item .tag{
  position:absolute;bottom:4px;left:4px;font-size:9px;
  background:rgba(0,0,0,.6);color:#fff;padding:1px 5px;border-radius:4px;
}

/* 周规划 */
.week-list{display:flex;flex-direction:column;gap:10px}
.day-row{
  display:flex;align-items:center;gap:12px;padding:12px;
  background:#F8F8F5;border-radius:10px;
}
.day-info{flex:1}
.day-info .name{font-size:14px;font-weight:600}
.day-info .scene{font-size:11px;color:var(--soft);margin-top:2px}
.day-outfit{
  display:flex;gap:4px;
}
.day-outfit .mini{
  width:32px;height:32px;background:#fff;border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:16px;
  border:1px solid var(--line);
}
.day-outfit .empty{color:#CCC;font-size:11px;align-self:center}
.plan-btn{
  background:transparent;color:var(--primary);border:1px solid var(--primary);
  padding:5px 10px;border-radius:100px;font-size:11px;cursor:pointer;font-family:inherit;
}
.plan-btn:hover{background:#FFF1ED}

/* Modal */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal.show{display:flex;animation:fadeIn .2s}
.modal-content{
  background:#fff;border-radius:16px;padding:20px;width:100%;max-width:360px;
  max-height:80vh;overflow-y:auto;
}
.modal h3{font-size:1.1rem;margin-bottom:14px;font-weight:600}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
.emoji-opt{
  aspect-ratio:1;font-size:28px;background:#F8F8F5;border-radius:8px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  border:2px solid transparent;
}
.emoji-opt:hover{background:#F0F0EC}
.emoji-opt.selected{border-color:var(--primary);background:#FFF9F5}
.cat-select{
  display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;
}
.cat-opt{
  padding:5px 12px;border-radius:100px;font-size:12px;background:#F5F5F2;
  cursor:pointer;border:1px solid transparent;
}
.cat-opt.active{background:#FFF1ED;color:var(--primary);border-color:var(--primary)}
.modal-actions{display:flex;gap:8px;margin-top:8px}

/* Toast */
.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);
  background:rgba(0,0,0,.85);color:#fff;padding:10px 20px;border-radius:100px;
  font-size:13px;z-index:200;opacity:0;transition:all .3s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <!-- 顶部 -->
  <div class="topbar">
    <div class="brand">Style Studio</div>
    <div class="date" id="todayDate"></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="today">今日</button>
    <button class="tab" data-tab="closet">衣柜</button>
    <button class="tab" data-tab="week">周规划</button>
  </div>

  <!-- Tab 1: 今日 -->
  <div class="tab-content active" id="today">
    <div class="weather-strip">
      <div class="left">⛅ <span id="weatherText">22°C 微风</span></div>
      <div class="right" id="locationText">北京 · 适合浅色</div>
    </div>

    <div class="scene-picker" id="scenePicker">
      <button class="scene-chip active" data-scene="通勤">通勤</button>
      <button class="scene-chip" data-scene="约会">约会</button>
      <button class="scene-chip" data-scene="面试">面试</button>
      <button class="scene-chip" data-scene="运动">运动</button>
      <button class="scene-chip" data-scene="休闲">休闲</button>
    </div>

    <div class="recommend-card">
      <div class="label" id="sceneLabel">今日推荐 · 通勤</div>
      <h3 id="outfitName">清爽学院风</h3>
      <div class="outfit-grid" id="outfitGrid">
        <div class="outfit-slot">👕<small>上衣</small></div>
        <div class="outfit-slot">🧥<small>外套</small></div>
        <div class="outfit-slot">👖<small>下装</small></div>
        <div class="outfit-slot">👟<small>鞋</small></div>
      </div>
      <div class="action-row">
        <button class="btn btn-secondary" onclick="dislike()">🔄 换一套</button>
        <button class="btn btn-primary" onclick="like()">♡ 喜欢</button>
      </div>
    </div>

    <h2 style="font-size:1.05rem;font-weight:600;margin-bottom:12px">推荐理由</h2>
    <div style="background:#F8F8F5;padding:14px;border-radius:10px;font-size:13px;color:var(--soft);line-height:1.7">
      <div>• 天气 22°C 微风，适合薄外套</div>
      <div>• 通勤场景，避免过于鲜艳</div>
      <div>• 符合你标记"喜欢"：白 + 牛仔组合</div>
    </div>
  </div>

  <!-- Tab 2: 衣柜 -->
  <div class="tab-content" id="closet">
    <div class="closet-header">
      <h2>我的衣柜 <span style="color:var(--soft);font-weight:400" id="clothCount">(0 件)</span></h2>
      <button class="add-btn" onclick="openAddModal()">+</button>
    </div>

    <div class="closet-categories" id="closetCats">
      <button class="cat-chip active" data-cat="all">全部</button>
      <button class="cat-chip" data-cat="top">上衣</button>
      <button class="cat-chip" data-cat="bottom">下装</button>
      <button class="cat-chip" data-cat="outer">外套</button>
      <button class="cat-chip" data-cat="shoe">鞋</button>
      <button class="cat-chip" data-cat="dress">裙装</button>
    </div>

    <div class="closet-grid" id="closetGrid"></div>

    <div style="margin-top:20px;padding:14px;background:#FFF9F5;border-radius:10px;font-size:12px;color:var(--soft);line-height:1.7">
      💡 提示：点击衣物可"喜欢"，在 AI 搭配时会优先选你喜欢的单品
    </div>
  </div>

  <!-- Tab 3: 周规划 -->
  <div class="tab-content" id="week">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="font-size:1.05rem;font-weight:600">本周穿搭</h2>
      <button class="btn btn-primary" style="flex:none;padding:6px 14px" onclick="autoPlanWeek()">✨ 一键规划</button>
    </div>

    <div class="week-list" id="weekList"></div>

    <div style="margin-top:20px;padding:14px;background:#F8F8F5;border-radius:10px;font-size:13px;color:var(--soft);text-align:center">
      周日晚上花 5 分钟规划下周，每天起床不再纠结
    </div>
  </div>
</div>

<!-- 添加衣物 Modal -->
<div class="modal" id="addModal">
  <div class="modal-content">
    <h3>添加衣物</h3>

    <div style="font-size:13px;color:var(--soft);margin-bottom:8px">选择图标</div>
    <div class="emoji-grid" id="emojiGrid"></div>

    <div style="font-size:13px;color:var(--soft);margin-bottom:8px">选择类别</div>
    <div class="cat-select" id="catSelect">
      <button class="cat-opt" data-cat="top">上衣</button>
      <button class="cat-opt" data-cat="bottom">下装</button>
      <button class="cat-opt" data-cat="outer">外套</button>
      <button class="cat-opt" data-cat="shoe">鞋子</button>
      <button class="cat-opt" data-cat="dress">裙装</button>
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeAddModal()">取消</button>
      <button class="btn btn-primary" onclick="saveCloth()">添加</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ========== 数据 ==========
const EMOJI_POOL = ['👕','👔','👚','🥼','🦺','👖','👗','👘','🥻','🧥','🥋','👙','🩱','🩳','👠','👟','👞','👢','🥾','🥿','🩰','🎒','👜','🎩','🧢','⛑️','🧣','🧤'];
const OUTFIT_NAMES = ['清爽学院风','简约都市风','慵懒周末风','清新文艺风','活力运动风','优雅约会风','干练通勤风','温柔知性风','街头休闲风','森系治愈风'];
const SCENE_LABELS = {
  '通勤':'干练通勤风','约会':'优雅约会风','面试':'干练通勤风','运动':'活力运动风','休闲':'慵懒周末风'
};

let clothes = JSON.parse(localStorage.getItem('ss_clothes') || '[]');
let likes = JSON.parse(localStorage.getItem('ss_likes') || '[]');
let weekPlan = JSON.parse(localStorage.getItem('ss_week') || 'null');
let currentScene = '通勤';
let selectedEmoji = '';
let selectedCategory = 'top';
let currentClothTab = 'all';

const DEFAULT_CLOTHES = [
  {emoji:'👕',cat:'top'},{emoji:'👕',cat:'top'},{emoji:'👚',cat:'top'},
  {emoji:'🧥',cat:'outer'},{emoji:'🧥',cat:'outer'},
  {emoji:'👖',cat:'bottom'},{emoji:'👖',cat:'bottom'},{emoji:'👗',cat:'dress'},
  {emoji:'👟',cat:'shoe'},{emoji:'👠',cat:'shoe'},{emoji:'👞',cat:'shoe'}
];

// ========== 初始化 ==========
function init() {
  if (clothes.length === 0) {
    clothes = DEFAULT_CLOTHES.map(c => ({...c, id: Date.now() + Math.random()}));
    saveClothes();
  }
  if (!weekPlan) {
    weekPlan = ['周一','周二','周三','周四','周五','周六','周日'].map(day => ({
      day, scene:'通勤', outfit:[]
    }));
    saveWeek();
  }
  renderToday();
  renderCloset();
  renderWeek();
  document.getElementById('todayDate').textContent = formatDate(new Date());
}

function formatDate(d) {
  const days = ['日','一','二','三','四','五','六'];
  return `${d.getMonth()+1}月${d.getDate()}日 · 周${days[d.getDay()]}`;
}

// ========== Tab 切换 ==========
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab).classList.add('active');
  });
});

// ========== 今日 ==========
document.querySelectorAll('.scene-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.scene-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentScene = chip.dataset.scene;
    renderToday();
  });
});

function renderToday() {
  document.getElementById('sceneLabel').textContent = `今日推荐 · ${currentScene}`;
  const outfit = generateOutfit(currentScene);
  const name = SCENE_LABELS[currentScene] || OUTFIT_NAMES[Math.floor(Math.random()*OUTFIT_NAMES.length)];
  document.getElementById('outfitName').textContent = name;
  document.getElementById('outfitGrid').innerHTML = outfit.map(o => `
    <div class="outfit-slot">${o.emoji}<small>${catLabel(o.cat)}</small></div>
  `).join('');
}

function generateOutfit(scene) {
  const result = [];
  // 优先选用户喜欢的
  const likedItems = clothes.filter(c => likes.includes(c.id));
  const pool = likedItems.length >= 4 ? likedItems : clothes;

  const slots = scene === '运动' ? ['top','bottom','shoe']
              : scene === '约会' && pool.some(c=>c.cat==='dress') ? ['dress','shoe']
              : ['top','bottom','outer','shoe'];

  for (const cat of slots) {
    const candidates = pool.filter(c => c.cat === cat);
    if (candidates.length > 0) {
      result.push(candidates[Math.floor(Math.random()*candidates.length)]);
    }
  }
  return result;
}

function catLabel(cat) {
  return {top:'上衣',bottom:'下装',outer:'外套',shoe:'鞋',dress:'裙装'}[cat] || cat;
}

function like() {
  showToast('✓ 已收藏这套搭配');
}

function dislike() {
  renderToday();
  showToast('已为你换一套');
}

// ========== 衣柜 ==========
document.querySelectorAll('#closetCats .cat-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#closetCats .cat-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentClothTab = chip.dataset.cat;
    renderCloset();
  });
});

function renderCloset() {
  const filtered = currentClothTab === 'all'
    ? clothes
    : clothes.filter(c => c.cat === currentClothTab);
  document.getElementById('clothCount').textContent = `(${clothes.length} 件)`;
  const grid = document.getElementById('closetGrid');
  if (filtered.length === 0) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px 0;color:var(--soft);font-size:13px">还没有衣物，点击 + 添加</div>`;
    return;
  }
  grid.innerHTML = filtered.map(c => `
    <div class="cloth-item ${likes.includes(c.id)?'selected':''}" data-id="${c.id}">
      <div class="del" onclick="event.stopPropagation();removeCloth('${c.id}')">×</div>
      ${c.emoji}
      <div class="tag">${catLabel(c.cat)}</div>
    </div>
  `).join('');
  // 绑定喜欢
  document.querySelectorAll('.cloth-item').forEach(el => {
    el.addEventListener('click', () => toggleLike(el.dataset.id));
  });
}

function toggleLike(id) {
  const idx = likes.indexOf(id);
  if (idx >= 0) likes.splice(idx, 1);
  else likes.push(id);
  localStorage.setItem('ss_likes', JSON.stringify(likes));
  renderCloset();
  showToast(idx >= 0 ? '已取消喜欢' : '♡ 已标记为喜欢');
}

function removeCloth(id) {
  clothes = clothes.filter(c => c.id != id);
  likes = likes.filter(i => i != id);
  saveClothes();
  renderCloset();
  showToast('已删除');
}

function saveClothes() {
  localStorage.setItem('ss_clothes', JSON.stringify(clothes));
}

// ========== 添加衣物 Modal ==========
function openAddModal() {
  document.getElementById('addModal').classList.add('show');
  const grid = document.getElementById('emojiGrid');
  grid.innerHTML = EMOJI_POOL.map(e => `
    <div class="emoji-opt" data-emoji="${e}">${e}</div>
  `).join('');
  document.querySelectorAll('.emoji-opt').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.emoji-opt').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      selectedEmoji = el.dataset.emoji;
    });
  });
  document.querySelectorAll('.cat-opt').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.cat-opt').forEach(o => o.classList.remove('active'));
      el.classList.add('active');
      selectedCategory = el.dataset.cat;
    });
  });
  // 默认选第一个
  document.querySelector('.cat-opt').classList.add('active');
}

function closeAddModal() {
  document.getElementById('addModal').classList.remove('show');
  selectedEmoji = '';
  document.querySelectorAll('.emoji-opt').forEach(o => o.classList.remove('selected'));
  document.querySelectorAll('.cat-opt').forEach(o => o.classList.remove('active'));
}

function saveCloth() {
  if (!selectedEmoji) { showToast('请选择图标'); return; }
  clothes.push({id: Date.now()+'', emoji: selectedEmoji, cat: selectedCategory});
  saveClothes();
  closeAddModal();
  renderCloset();
  showToast('✓ 添加成功');
}

// ========== 周规划 ==========
function renderWeek() {
  const list = document.getElementById('weekList');
  list.innerHTML = weekPlan.map((d,i) => {
    const icons = d.outfit.length > 0
      ? d.outfit.map(o => `<div class="mini">${o.emoji}</div>`).join('')
      : `<div class="empty">未规划</div>`;
    return `
      <div class="day-row">
        <div class="day-info">
          <div class="name">${d.day}</div>
          <div class="scene">${d.scene}</div>
        </div>
        <div class="day-outfit">${icons}</div>
        <button class="plan-btn" onclick="planDay(${i})">${d.outfit.length>0?'换':'规划'}</button>
      </div>
    `;
  }).join('');
}

function planDay(i) {
  const scenes = ['通勤','约会','面试','运动','休闲'];
  const scene = scenes[Math.floor(Math.random()*scenes.length)];
  const outfit = generateOutfit(scene);
  weekPlan[i] = {day: weekPlan[i].day, scene, outfit};
  saveWeek();
  renderWeek();
  showToast(`${weekPlan[i].day} 已规划`);
}

function autoPlanWeek() {
  weekPlan.forEach((d, i) => {
    const scene = i >= 5 ? '休闲' : (i === 4 ? '约会' : '通勤');
    weekPlan[i] = {day: d.day, scene, outfit: generateOutfit(scene)};
  });
  saveWeek();
  renderWeek();
  showToast('✨ 一周穿搭已生成');
}

function saveWeek() {
  localStorage.setItem('ss_week', JSON.stringify(weekPlan));
}

// ========== Toast ==========
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

init();
</script>
</body>
</html>
