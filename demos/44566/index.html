<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>心情便利贴 - 情绪管理</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-content">
                <h1 class="app-title">心情便利贴</h1>
                <p class="app-subtitle">记录每一天的心情</p>
            </div>
        </header>

        <nav class="tab-bar">
            <button class="tab-item active" data-tab="checkin">
                <span class="tab-icon">📝</span>
                <span class="tab-text">打卡</span>
            </button>
            <button class="tab-item" data-tab="heatmap">
                <span class="tab-icon">📊</span>
                <span class="tab-text">热力图</span>
            </button>
            <button class="tab-item" data-tab="treehole">
                <span class="tab-icon">🌳</span>
                <span class="tab-text">树洞</span>
            </button>
        </nav>

        <main class="main-content">
            <section id="checkin" class="tab-panel active">
                <div class="checkin-card">
                    <div class="checkin-header">
                        <h2>今日心情</h2>
                        <span class="current-date"></span>
                    </div>
                    
                    <div class="emotion-selector">
                        <div class="emotion-grid">
                            <button class="emotion-btn" data-emotion="happy" title="开心">
                                <span class="emoji">😊</span>
                                <span class="emotion-label">开心</span>
                            </button>
                            <button class="emotion-btn" data-emotion="excited" title="兴奋">
                                <span class="emoji">🤩</span>
                                <span class="emotion-label">兴奋</span>
                            </button>
                            <button class="emotion-btn" data-emotion="calm" title="平静">
                                <span class="emoji">😌</span>
                                <span class="emotion-label">平静</span>
                            </button>
                            <button class="emotion-btn" data-emotion="sad" title="难过">
                                <span class="emoji">😢</span>
                                <span class="emotion-label">难过</span>
                            </button>
                            <button class="emotion-btn" data-emotion="angry" title="生气">
                                <span class="emoji">😠</span>
                                <span class="emotion-label">生气</span>
                            </button>
                            <button class="emotion-btn" data-emotion="anxious" title="焦虑">
                                <span class="emoji">😰</span>
                                <span class="emotion-label">焦虑</span>
                            </button>
                            <button class="emotion-btn" data-emotion="tired" title="疲惫">
                                <span class="emoji">😴</span>
                                <span class="emotion-label">疲惫</span>
                            </button>
                            <button class="emotion-btn" data-emotion="confused" title="迷茫">
                                <span class="emoji">😕</span>
                                <span class="emotion-label">迷茫</span>
                            </button>
                        </div>
                    </div>

                    <div class="note-input">
                        <textarea id="noteText" placeholder="写下今天的心情（限20字）" maxlength="20"></textarea>
                        <span class="char-count">0/20</span>
                    </div>

                    <button class="submit-btn" id="submitCheckin">
                        完成打卡
                    </button>
                </div>

                <div class="timeline-section">
                    <h3>心情时间轴</h3>
                    <div class="filter-tabs">
                        <button class="filter-tab active" data-period="week">本周</button>
                        <button class="filter-tab" data-period="month">本月</button>
                        <button class="filter-tab" data-period="year">本年</button>
                    </div>
                    <div class="timeline-list" id="timelineList"></div>
                </div>
            </section>

            <section id="heatmap" class="tab-panel">
                <div class="heatmap-card">
                    <div class="heatmap-header">
                        <h2>心情热力图</h2>
                        <div class="heatmap-controls">
                            <select id="heatmapYear">
                                <option value="2026">2026</option>
                                <option value="2025">2025</option>
                                <option value="2024">2024</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="heatmap-container">
                        <div class="month-labels">
                            <span>1月</span><span>2月</span><span>3月</span><span>4月</span><span>5月</span><span>6月</span>
                            <span>7月</span><span>8月</span><span>9月</span><span>10月</span><span>11月</span><span>12月</span>
                        </div>
                        <div class="heatmap-grid" id="heatmapGrid"></div>
                        <div class="legend">
                            <span>低</span>
                            <div class="legend-item" style="background-color: #ebedf0;"></div>
                            <div class="legend-item" style="background-color: #c6e48b;"></div>
                            <div class="legend-item" style="background-color: #7bc96f;"></div>
                            <div class="legend-item" style="background-color: #239a3b;"></div>
                            <div class="legend-item" style="background-color: #196127;"></div>
                            <span>高</span>
                        </div>
                    </div>

                    <div class="stats-card">
                        <div class="stat-item">
                            <span class="stat-value" id="totalDays">0</span>
                            <span class="stat-label">打卡天数</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="avgMood">0</span>
                            <span class="stat-label">平均心情</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="streak">0</span>
                            <span class="stat-label">连续天数</span>
                        </div>
                    </div>
                </div>
            </section>

            <section id="treehole" class="tab-panel">
                <div class="treehole-card">
                    <div class="treehole-header">
                        <h2>匿名树洞</h2>
                        <p class="treehole-desc">倾诉你的心声，温暖他人的心灵</p>
                    </div>

                    <div class="compose-section">
                        <textarea id="treeholeText" placeholder="在这里倾诉你的心情，完全匿名..." maxlength="200"></textarea>
                        <div class="compose-footer">
                            <span class="char-count">0/200</span>
                            <button class="submit-btn" id="submitTreehole">
                                投递树洞
                            </button>
                        </div>
                    </div>
                </div>

                <div class="comfort-section">
                    <h3>收到的温暖</h3>
                    <div class="comfort-card" id="comfortCard">
                        <div class="comfort-placeholder">
                            <span class="comfort-icon">✨</span>
                            <p>正在为您寻找一份温暖...</p>
                            <button class="refresh-btn" id="getComfort">
                                接收安慰
                            </button>
                        </div>
                        <div class="comfort-content" style="display: none;">
                            <div class="comfort-emoji"></div>
                            <p class="comfort-message"></p>
                            <p class="comfort-time"></p>
                        </div>
                    </div>
                </div>

                <div class="sent-section">
                    <h3>我投递的</h3>
                    <div class="sent-list" id="sentList"></div>
                </div>
            </section>
        </main>

        <div class="toast" id="toast"></div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
