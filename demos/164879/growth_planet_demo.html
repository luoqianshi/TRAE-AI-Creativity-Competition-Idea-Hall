<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成长星球 · 交互演示</title>
<style>
  :root{
    --primary:#5B7CFA;
    --primary-d:#3D5BD0;
    --accent:#FF9F43;
    --mint:#2ED9B5;
    --bg1:#EEF2FF;
    --bg2:#FEF4EC;
    --card:#FFFFFF;
    --ink:#2B2D42;
    --mute:#8A8FA3;
    --line:#ECEEF5;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
    padding:24px 12px;color:var(--ink);
  }
  .phone{
    width:100%;max-width:420px;background:#fff;border-radius:34px;
    box-shadow:0 24px 60px rgba(60,70,120,.18);overflow:hidden;position:relative;
    border:8px solid #1f2233;
  }
  .statusbar{display:flex;justify-content:space-between;align-items:center;
    padding:12px 20px 6px;font-size:13px;color:#fff;
    background:linear-gradient(120deg,var(--primary),var(--mint));font-weight:600}
  header.app{
    background:linear-gradient(120deg,var(--primary),var(--mint));
    color:#fff;padding:8px 20px 20px;position:relative}
  .app-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .app-title{font-size:22px;font-weight:800;letter-spacing:1px}
  .app-sub{font-size:12px;opacity:.85}
  .coin{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);
    padding:8px 14px;border-radius:30px;font-weight:800;font-size:16px}
  .coin .star{font-size:18px}
  .hero{background:rgba(255,255,255,.16);border-radius:18px;padding:14px 16px;
    display:flex;justify-content:space-between;align-items:center}
  .hero .big{font-size:30px;font-weight:900}
  .hero .lbl{font-size:12px;opacity:.85}
  .hero .ring{font-size:34px}

  nav.tabs{display:flex;background:#fff;border-top:1px solid var(--line)}
  nav.tabs button{flex:1;border:0;background:none;padding:12px 0 14px;
    font-size:12px;color:var(--mute);display:flex;flex-direction:column;
    align-items:center;gap:3px;cursor:pointer;font-family:inherit}
  nav.tabs button .ic{font-size:20px}
  nav.tabs button.active{color:var(--primary);font-weight:700;
    box-shadow:inset 0 3px 0 var(--primary)}

  main{padding:16px;min-height:430px;background:#F7F8FC}
  .tab{display:none;animation:fade .25s ease}
  .tab.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .sec-h{font-size:15px;font-weight:800;margin:4px 2px 12px;display:flex;
    justify-content:space-between;align-items:center}
  .sec-h .add{font-size:12px;color:var(--primary);background:#EEF2FF;
    padding:5px 12px;border-radius:20px;cursor:pointer;font-weight:700}

  .tl{position:relative;padding-left:18px}
  .tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .tl-item{position:relative;margin-bottom:14px;background:#fff;border-radius:14px;
    padding:12px 14px;box-shadow:0 3px 10px rgba(60,70,120,.06)}
  .tl-item::before{content:"";position:absolute;left:-16px;top:16px;width:12px;height:12px;
    border-radius:50%;background:var(--primary);border:3px solid #fff;box-shadow:0 0 0 2px var(--primary)}
  .tl-date{font-size:11px;color:var(--mute)}
  .tl-txt{font-size:14px;margin-top:3px;line-height:1.5}
  .tl-emoji{font-size:18px;margin-right:4px}

  .task{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;
    display:flex;align-items:center;gap:12px;box-shadow:0 3px 10px rgba(60,70,120,.06)}
  .task .emo{font-size:26px;width:46px;height:46px;flex:none;display:flex;
    align-items:center;justify-content:center;background:#EEF2FF;border-radius:12px}
  .task .info{flex:1}
  .task .t{font-size:14px;font-weight:700}
  .task .r{font-size:12px;color:var(--accent);font-weight:700;margin-top:2px}
  .task .btn{border:0;background:var(--primary);color:#fff;font-weight:700;
    padding:9px 14px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:13px}
  .task .btn.done{background:#E6F9F1;color:var(--mint)}

  .mall-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mall{background:#fff;border-radius:16px;padding:14px;box-shadow:0 3px 10px rgba(60,70,120,.06);
    display:flex;flex-direction:column}
  .mall .pic{font-size:34px;text-align:center;margin:6px 0 10px}
  .mall .nm{font-size:13px;font-weight:700;line-height:1.4;min-height:36px}
  .mall .tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;
    margin-bottom:8px;width:fit-content}
  .mall .tag.gift{background:#FFF1E3;color:var(--accent)}
  .mall .tag.right{background:#E6F9F1;color:var(--mint)}
  .mall .cost{font-size:13px;font-weight:800;color:var(--primary);margin-bottom:8px}
  .mall .cost b{font-size:16px}
  .mall .btn{border:0;background:var(--accent);color:#fff;font-weight:700;
    padding:9px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:13px}
  .mall .btn.rt{background:#E6F9F1;color:var(--mint)}
  .mall .btn.no{background:#EEF0F6;color:var(--mute)}

  .stat-row{display:flex;gap:10px;margin-bottom:14px}
  .stat{flex:1;background:#fff;border-radius:16px;padding:14px;text-align:center;
    box-shadow:0 3px 10px rgba(60,70,120,.06)}
  .stat .n{font-size:24px;font-weight:900;color:var(--primary)}
  .stat .l{font-size:11px;color:var(--mute);margin-top:2px}
  .chart{background:#fff;border-radius:16px;padding:16px;box-shadow:0 3px 10px rgba(60,70,120,.06)}
  .chart .ch-h{font-size:13px;font-weight:700;margin-bottom:12px}
  .fam{display:flex;gap:10px;margin-top:14px}
  .fam .m{flex:1;background:#fff;border-radius:16px;padding:14px;text-align:center;
    box-shadow:0 3px 10px rgba(60,70,120,.06)}
  .fam .av{font-size:30px}
  .fam .nm{font-size:12px;font-weight:700;margin-top:4px}
  .fam .rl{font-size:10px;color:var(--mute)}

  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
    background:#2B2D42;color:#fff;padding:11px 20px;border-radius:30px;font-size:13px;
    opacity:0;transition:.3s;pointer-events:none;z-index:50;font-weight:600}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .float{position:fixed;font-size:20px;font-weight:900;color:var(--accent);
    pointer-events:none;z-index:40;animation:floatUp 1s ease forwards}
  @keyframes floatUp{to{transform:translateY(-60px);opacity:0}}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>成长星球 🌟</span></div>

  <header class="app">
    <div class="app-top">
      <div>
        <div class="app-title">成长星球</div>
        <div class="app-sub">每一步成长，都值得被看见</div>
      </div>
      <div class="coin"><span class="star">⭐</span><span id="coin">320</span></div>
    </div>
    <div class="hero">
      <div>
        <div class="big" id="heroDays">186 天</div>
        <div class="lbl">宝贝成长已记录</div>
      </div>
      <div class="ring">🌍</div>
    </div>
  </header>

  <nav class="tabs">
    <button class="active" data-t="grow"><span class="ic">🌱</span>成长</button>
    <button data-t="task"><span class="ic">✅</span>任务</button>
    <button data-t="mall"><span class="ic">🎁</span>商城</button>
    <button data-t="me"><span class="ic">👤</span>我的</button>
  </nav>

  <main>
    <!-- 成长 -->
    <section class="tab active" id="grow">
      <div class="sec-h">成长时间线 <span class="add" onclick="addRecord()">+ 添加记录</span></div>
      <div class="tl" id="timeline"></div>
    </section>

    <!-- 任务 -->
    <section class="tab" id="task">
      <div class="sec-h">今日星球任务 <span class="add" onclick="toast('坚持完成，宝贝最棒！')">每日打卡</span></div>
      <div id="taskList"></div>
    </section>

    <!-- 商城 -->
    <section class="tab" id="mall">
      <div class="sec-h">积分商城 <span class="add" onclick="toast('用⭐兑换爱与惊喜')">礼物 / 权益</span></div>
      <div class="mall-grid" id="mallGrid"></div>
    </section>

    <!-- 我的 -->
    <section class="tab" id="me">
      <div class="stat-row">
        <div class="stat"><div class="n" id="sTotal">1260</div><div class="l">累计获得⭐</div></div>
        <div class="stat"><div class="n" id="sTask">48</div><div class="l">完成任务</div></div>
        <div class="stat"><div class="n" id="sRedeem">12</div><div class="l">已兑换</div></div>
      </div>
      <div class="chart">
        <div class="ch-h">近 7 天获得 ⭐ 趋势</div>
        <svg id="chart" width="100%" height="150" viewBox="0 0 340 150"></svg>
      </div>
      <div class="fam">
        <div class="m"><div class="av">👩</div><div class="nm">妈妈</div><div class="rl">管理员</div></div>
        <div class="m"><div class="av">👨</div><div class="nm">爸爸</div><div class="rl">管理员</div></div>
        <div class="m"><div class="av">🧒</div><div class="nm">宝贝</div><div class="rl">小宇航员</div></div>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  const state = {
    points: 320,
    total: 1260,
    tasks: [
      {t:"自己刷牙 2 分钟", r:10, e:"🪥", done:false},
      {t:"收拾玩具放回箱子", r:15, e:"🧸", done:false},
      {t:"读绘本 15 分钟", r:20, e:"📚", done:false},
      {t:"帮忙摆碗筷", r:10, e:"🍽️", done:false},
    ],
    mall: [
      {nm:"乐高小套装", e:"🧱", cost:200, type:"gift", got:false},
      {nm:"周末去动物园", e:"🦁", cost:500, type:"gift", got:false},
      {nm:"决定今晚吃什么", e:"🍕", cost:80, type:"right", got:false},
      {nm:"多讲一个睡前故事", e:"📖", cost:60, type:"right", got:false},
      {nm:"周末多玩 30 分钟", e:"🎮", cost:120, type:"right", got:false},
      {nm:"一本新绘本", e:"📕", cost:150, type:"gift", got:false},
    ],
    timeline: [
      {d:"2026-07-14", e:"🦷", t:"宝贝自己刷完牙，没让妈妈帮忙！"},
      {d:"2026-07-10", e:"📏", t:"身高 112cm，比上月长了 1.5cm"},
      {d:"2026-07-01", e:"🎨", t:"在幼儿园画了一幅全家福，贴在冰箱上"},
      {d:"2026-06-20", e:"🚲", t:"学会骑不带辅助轮的自行车啦"},
    ],
    weekly: [40, 90, 60, 130, 80, 110, 70],
  };

  const $ = s => document.querySelector(s);
  const coin = $("#coin");

  function setPoints(v){ state.points = v; coin.textContent = v; }

  function toast(msg){
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"),1600);
  }
  function flyStar(x,y){
    const s=document.createElement("div"); s.className="float"; s.textContent="⭐+";
    s.style.left=x+"px"; s.style.top=y+"px"; document.body.appendChild(s);
    setTimeout(()=>s.remove(),1000);
  }

  // tabs
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll("nav.tabs button").forEach(x=>x.classList.remove("active"));
      document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      $("#"+b.dataset.t).classList.add("active");
    };
  });

  // render timeline
  function renderTimeline(){
    $("#timeline").innerHTML = state.timeline.map(i=>`
      <div class="tl-item">
        <div class="tl-date">${i.d}</div>
        <div class="tl-txt"><span class="tl-emoji">${i.e}</span>${i.t}</div>
      </div>`).join("");
  }
  function addRecord(){
    const txt = prompt("记录宝贝今天的小成长：");
    if(!txt) return;
    const emo = ["🌟","🎉","💡","❤️","🌈","🚀"][Math.floor(Math.random()*6)];
    const d = new Date().toISOString().slice(0,10);
    state.timeline.unshift({d, e:emo, t:txt});
    renderTimeline(); toast("已记录到成长星球 ❤️");
  }

  // render tasks
  function renderTasks(){
    $("#taskList").innerHTML = state.tasks.map((k,i)=>`
      <div class="task">
        <div class="emo">${k.e}</div>
        <div class="info"><div class="t">${k.t}</div><div class="r">+${k.r} ⭐</div></div>
        <button class="btn ${k.done?'done':''}" onclick="doTask(${i},event)">
          ${k.done?'已完成 ✓':'完成'}</button>
      </div>`).join("");
  }
  function doTask(i,e){
    const k = state.tasks[i];
    if(k.done) return;
    k.done = true;
    setPoints(state.points + k.r);
    state.total += k.r; $("#sTotal").textContent = state.total;
    $("#sTask").textContent = +$("#sTask").textContent + 1;
    flyStar(e.clientX, e.clientY);
    renderTasks(); toast(`+${k.r} ⭐ 太棒了！`);
  }

  // render mall
  function renderMall(){
    $("#mallGrid").innerHTML = state.mall.map((m,i)=>{
      const can = state.points >= m.cost && !m.got;
      const cls = m.got ? "rt" : (can ? "" : "no");
      const label = m.got ? "已兑换 ✓" : (can ? "兑换" : "⭐不足");
      return `<div class="mall">
        <span class="tag ${m.type}">${m.type==='gift'?'礼物':'权益'}</span>
        <div class="pic">${m.e}</div>
        <div class="nm">${m.nm}</div>
        <div class="cost"><b>${m.cost}</b> ⭐</div>
        <button class="btn ${cls}" onclick="redeem(${i})" ${can?'':'disabled'}>${label}</button>
      </div>`;
    }).join("");
  }
  function redeem(i){
    const m = state.mall[i];
    if(m.got || state.points < m.cost) return;
    state.points -= m.cost; coin.textContent = state.points;
    m.got = true;
    $("#sRedeem").textContent = +$("#sRedeem").textContent + 1;
    renderMall(); toast(`已兑换：${m.nm} 🎉`);
  }

  // chart
  function renderChart(){
    const w=340,h=150,pad=20,max=Math.max(...state.weekly);
    const bw=(w-pad*2)/state.weekly.length-10;
    const svg=$("#chart"); let s="";
    state.weekly.forEach((v,i)=>{
      const bh=(v/max)*(h-40);
      const x=pad+i*((w-pad*2)/state.weekly.length)+5;
      const y=h-20-bh;
      s+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="6" fill="url(#g)"/>`;
      s+=`<text x="${x+bw/2}" y="${y-6}" font-size="11" fill="#8A8FA3" text-anchor="middle">${v}</text>`;
      s+=`<text x="${x+bw/2}" y="${h-4}" font-size="10" fill="#B8BCC8" text-anchor="middle">${['一','二','三','四','五','六','日'][i]}</text>`;
    });
    svg.innerHTML=`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B7CFA"/><stop offset="1" stop-color="#2ED9B5"/></linearGradient></defs>`+s;
  }

  renderTimeline(); renderTasks(); renderMall(); renderChart();
</script>
</body>
</html>
