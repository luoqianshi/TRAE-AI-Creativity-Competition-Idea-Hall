    standard:'ISO/IEC 7816', version:'2022版', views:12580,

    summary:'ISO/IEC 7816是智能卡领域最核心的基础标准，定义了接触式集成电路卡的物理特性、电气接口、传输协议和命令集。',
    content:`## ISO/IEC 7816 标准概述

ISO/IEC 7816 是国际标准化组织制定的接触式集成电路卡（智能卡）系列标准，是整个智能卡行业的基础性规范。

### 标准组成部分

| 部分 | 标题 | 说明 |
|------|------|------|
| Part 1 | 物理特性 | 卡片尺寸、弯曲强度、紫外线、静电等物理要求 |
| Part 2 | 触点尺寸和位置 | 8个触点(C1-C8)的尺寸和布局定义 |
| Part 3 | 电信号和传输协议 | T=0和T=1协议、复位应答(ATR) |
| Part 4 | 命令 interchange | APDU命令和响应结构 |
| Part 5 | 应用标识符(AID) | 国家/行业/应用提供者标识 |
| Part 6 | 行业间数据元 | 数据对象编码规则 |
| Part 8 | 安全操作 | 安全报文、密钥管理 |
| Part 9 | 卡片管理命令 | 卡片生命周期管理 |
| Part 10 | 电子签名 | 数字签名相关命令 |
| Part 11 | 生物特征识别 | 生物特征模板存储与比对 |
| Part 12 | USB接口 | USB ICC电气接口 |

### ATR (Answer To Reset)

复位应答是卡片上电后返回的初始字节序列，用于标识卡片的基本通信参数。

**ATR结构：**
\`\`\`
TS | T0 | TA1 TB1 TC1 TD1 [TA2 TB2 TC2 TD2 ...] TCK | Historical bytes
\`\`\`

**示例ATR：**
\`\`\`
3B 00 94 80 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 01 00
\`\`\`

### 传输协议

#### T=0 协议（字节协议）
- 面向字节的半双工传输协议
- 命令由终端逐字节发送
- 响应通过GET RESPONSE命令获取
- 适用于简单、低带宽场景

#### T=1 协议（块协议）
- 面向块的传输协议
- 支持更高效的数据传输
- 内置错误检测和重传机制
- 适用于高带宽、复杂交互场景

### APDU 命令结构

\`\`\`
CLA INS P1 P2 [Lc] [Data] [Le]
\`\`\`

| 字段 | 长度 | 说明 |
|------|------|------|
| CLA | 1字节 | 指令类别 |
| INS | 1字节 | 指令编码 |
| P1 | 1字节 | 参数1 |
| P2 | 1字节 | 参数2 |
| Lc | 1字节 | 数据长度（可选） |
| Data | Lc字节 | 命令数据（可选） |
| Le | 1字节 | 期望响应长度（可选） |

> **注意**：扩展APDU格式支持Lc和Le使用3字节编码，最大数据长度可达65535字节。

### 响应报文

\`\`\`
[Data] SW1 SW2
\`\`\`

**常见状态码：**
- \`90 00\` - 成功
- \`61 XX\` - 需要GET RESPONSE获取XX字节
- \`6C XX\` - Le错误，正确的Le为XX
- \`69 82\` - 安全状态不满足
- \`69 83\` - 认证方法被锁定
- \`6A 82\` - 文件未找到
- \`6A 86\` - P1/P2参数错误`
  },

    content:`## ISO/IEC 14443 非接触式标准

ISO/IEC 14443 是非接触式智能卡最重要的国际标准，广泛应用于银行卡闪付、交通卡、门禁卡等领域。

### 标准组成

| 部分 | 标题 | 说明 |
|------|------|------|
| Part 1 | 物理特性 | 卡片尺寸、机械强度 |
| Part 2 | 射频功率和信号接口 | 13.56MHz射频场、调制方式 |
| Part 3 | 初始化和防冲突 | PICC和PCD的通信初始化 |
| Part 4 | 传输协议 | 高层协议规范 |

### Type A vs Type B

| 特性 | Type A | Type B |
|------|--------|--------|
| 调制方式 | ASK 100% | ASK 10% |
| 编码 | Miller | NRZ |
| 波特率 | 106/212/424/848 kbps | 106/212/424/848 kbps |
| 防冲突 | 位碰撞检测 | 时隙ALOHA |
| 典型应用 | MIFARE、PBOC | 健保卡、护照 |

### 防冲突机制

#### Type A 防冲突
1. PCD 发送 REQA (0x26) 或 WUPA (0x52)
2. PICC 返回 ATQA (2字节)
3. PCD 发送 ANTICOLLISION 和 SELECT 命令
4. PICC 返回 UID 和 SAK

#### Type B 防冲突
1. PCD 发送 WUPB
2. PICC 返回 ATQB
3. PCD 发送 ATTRIB 选择特定PICC
4. PICC 返回 Answer

### 通信距离
- 标准读取距离：0-10cm
- 操作频率：13.56 MHz
- 典型应用读取距离：2-5cm`

    content:`## PBOC 3.0 规范概述

PBOC 3.0（中国金融集成电路卡规范）是中国人民银行发布的金融IC卡标准，是PBOC 2.0的升级版本。

### 主要升级内容

1. **国密算法支持**：新增SM2（非对称）、SM3（哈希）、SM4（对称）算法
2. **电子现金升级**：支持小额免签免密
3. **借记贷记兼容**：与EMV Contact/Contactless兼容
4. **多应用支持**：支持一卡多应用

### 交易流程

#### 借记贷记交易
\`\`\`
1. 应用选择 (SELECT)
2. 读取应用数据 (GPO / READ RECORD)
3. 脱机数据认证 (内部认证 / 外部认证)
4. 处理限制检查
5. 持卡人验证 (PIN)
6. 终端风险管理
7. 在线处理 (联机交易)
8. 交易完成 (生成TC/ARQC)
\`\`\`

#### 电子现金交易
\`\`\`
1. 应用选择
2. 读取余额
3. 脱机数据认证
4. 扣款处理
5. 生成交易凭证 (TC)
\`\`\`

### 关键数据对象

| 数据对象 | 标签 | 说明 |
|----------|------|------|

// localStorage 操作
function lsGet(key, def) { try { const v=localStorage.getItem('sch_'+key); return v?JSON.parse(v):def; } catch(e){return def;} }
function lsSet(key, val) { try { localStorage.setItem('sch_'+key, JSON.stringify(val)); } catch(e){} }

// Toast 通知
function showToast(msg, type='success') {
  const c = document.getElementById('toastContainer');
  const colors = { success:'bg-green-500', error:'bg-red-500', info:'bg-primary-600' };
  const icons = { success:'fa-check-circle', error:'fa-exclamation-circle', info:'fa-info-circle' };
  const el = document.createElement('div');
  el.className = `toast flex items-center gap-2 px-4 py-3 rounded-lg text-white text-sm shadow-lg ${colors[type]}`;
  el.innerHTML = `<i class="fas ${icons[type]}"></i><span>${msg}</span>`;
  c.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(()=>el.remove(),300); }, 2000);
}

function initTheme() {
  const dark = lsGet('theme', false);
  if (dark) document.documentElement.classList.add('dark');
  updateThemeIcon();
}
function toggleTheme() {
  document.documentElement.classList.toggle('dark');
  const isDark = document.documentElement.classList.contains('dark');
  lsSet('theme', isDark);
  updateThemeIcon();
}
function updateThemeIcon() {
  const dark = document.documentElement.classList.contains('dark');
  document.getElementById('themeIcon').className = dark ? 'fas fa-sun text-sm' : 'fas fa-moon text-sm';
}

function setBreadcrumb(items) {
  const bc = document.getElementById('breadcrumb');
  const content = document.getElementById('breadcrumbContent');
  if (!items || items.length === 0) { bc.classList.add('hidden'); return; }
  bc.classList.remove('hidden');
  content.innerHTML = items.map((item,i) => {
    const isLast = i === items.length - 1;
    const icon = item.icon ? `<i class="fas ${item.icon} text-xs"></i> ` : '';
    if (isLast) return `<span class="text-gray-700 dark:text-gray-200 font-medium">${icon}${item.label}</span>`;
    return `<a href="${item.href||'#!/'}" class="hover:text-primary-600 transition-colors">${icon}${item.label}</a><i class="fas fa-chevron-right text-xs text-gray-300 dark:text-gray-600"></i>`;
  }).join('');
}

// ============================================================
// 搜索功能
// ============================================================
function openSearch() {
  document.getElementById('searchModal').classList.remove('hidden');
  const input = document.getElementById('searchInput');
  input.value = '';
  input.focus();
  renderSearchSuggestions();
}
function closeSearch() { document.getElementById('searchModal').classList.add('hidden'); }

function handleSearchKeydown(e) {
  if (e.key === 'Escape') closeSearch();
  if (e.key === 'Enter') { const v = e.target.value.trim(); if(v) { addSearchHistory(v); window.location.hash='#!/search?q='+encodeURIComponent(v); closeSearch(); } }
}

function handleSearch(query) {
  const sug = document.getElementById('searchSuggestions');
  const list = document.getElementById('searchResultList');
  if (!query.trim()) { sug.classList.remove('hidden'); list.classList.add('hidden'); return; }
  sug.classList.add('hidden'); list.classList.remove('hidden');
  const q = query.toLowerCase();
  let results = [];
  // 搜索文档
  Object.values(knowledgeDocs).forEach(doc => {
    if (doc.title.toLowerCase().includes(q) || doc.summary.toLowerCase().includes(q) || doc.tags.some(t=>t.toLowerCase().includes(q)) || doc.standard.toLowerCase().includes(q)) {
      results.push({ type:'doc', title:doc.title, desc:doc.summary, href:'#!/knowledge/'+doc.id, tags:doc.tags });
    }
  });
  // 搜索问答
  communityQuestions.forEach(qa => {
    if (qa.title.toLowerCase().includes(q) || qa.content.toLowerCase().includes(q) || qa.tags.some(t=>t.toLowerCase().includes(q))) {
      results.push({ type:'qa', title:qa.title, desc:qa.content.substring(0,80)+'...', href:'#!/community/'+qa.id, tags:qa.tags });
    }
  });
  // 搜索APDU模板
  apduTemplates.forEach(t => {
    if (t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q)) {
      results.push({ type:'tool', title:t.name, desc:t.desc, href:'#!/tools/apdu', tags:[t.group] });
    }
  });
  if (results.length === 0) {
    list.innerHTML = '<div class="p-8 text-center text-gray-400"><i class="fas fa-search text-3xl mb-3 block"></i><p>未找到相关结果</p></div>';
  } else {
    list.innerHTML = results.map(r => {
      const typeIcon = r.type==='doc'?'fa-file-alt text-blue-500':r.type==='qa'?'fa-question-circle text-green-500':'fa-terminal text-purple-500';
      const typeLabel = r.type==='doc'?'文档':r.type==='qa'?'问答':'工具';
      const hl = (text) => text.replace(new RegExp('('+query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'), '<mark class="search-hl">$1</mark>');
      return `<a href="${r.href}" onclick="closeSearch()" class="block px-4 py-3 hover:bg-gray-50 dark:hover:bg-gray-700/50 border-b border-gray-100 dark:border-gray-700 last:border-0 transition-colors">
        <div class="flex items-start gap-3">
          <i class="fas ${typeIcon} mt-0.5"></i>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-1"><span class="text-xs px-1.5 py-0.5 rounded bg-gray-100 dark:bg-gray-600 text-gray-500 dark:text-gray-300">${typeLabel}</span><span class="text-sm font-medium truncate">${hl(r.title)}</span></div>
            <p class="text-xs text-gray-500 dark:text-gray-400 truncate">${hl(r.desc)}</p>
          </div>
        </div>
      </a>`;
    }).join('');
  }
}

function renderSearchSuggestions() {
  const hotTags = ['PBOC 3.0','APDU','ISO 7816','SELECT','EMV','非接触式','PIN验证','文件系统'];
  document.getElementById('hotSearchTags').innerHTML = hotTags.map(t =>
    `<button onclick="document.getElementById('searchInput').value='${t}';handleSearch('${t}')" class="px-2.5 py-1 rounded-full bg-gray-100 dark:bg-gray-700 text-xs text-gray-600 dark:text-gray-300 hover:bg-primary-100 dark:hover:bg-primary-900/30 hover:text-primary-600 transition-colors">${t}</button>`
  ).join('');
  const history = lsGet('searchHistory', []);
  const rl = document.getElementById('recentSearchList');
  if (history.length === 0) { rl.innerHTML = '<p class="text-xs text-gray-400">暂无搜索记录</p>'; }
  else { rl.innerHTML = history.slice(0,5).map(h => `<button onclick="document.getElementById('searchInput').value='${h}';handleSearch('${h}')" class="flex items-center gap-2 w-full px-2 py-1.5 rounded text-sm text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"><i class="fas fa-clock text-xs"></i>${h}</button>`).join(''); }
}

function addSearchHistory(q) {
  let h = lsGet('searchHistory', []);
  h = h.filter(x=>x!==q); h.unshift(q); if(h.length>10) h=h.slice(0,10);
  lsSet('searchHistory', h);
}

// Ctrl+K 快捷键
document.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key==='k') { e.preventDefault(); openSearch(); }
  if (e.key==='Escape') closeSearch();
});

function route() {
  const hash = location.hash || '#!/';
  const app = document.getElementById('app');
  // 解析路由
  if (hash.startsWith('#!/search')) {
    const params = new URLSearchParams(hash.replace('#!/search?',''));
    renderSearchPage(params.get('q')||'');
  } else if (hash.startsWith('#!/knowledge/') && hash.split('/').length >= 4) {
    const cat = hash.split('/')[2];
    const sub = hash.split('/')[3];
    renderDocDetail(sub);
  } else if (hash === '#!/knowledge') {
    renderKnowledge();
  } else if (hash === '#!/tools/apdu') {
    renderAPDUBuilder();
  } else if (hash === '#!/tools/config') {
    renderCardConfig();
  } else if (hash === '#!/learning') {
    renderLearning();
  } else if (hash.startsWith('#!/community/') && hash.split('/').length >= 3) {
    renderQuestionDetail(hash.split('/')[2]);
  } else if (hash === '#!/community') {
    renderCommunity();
  } else {
    renderDashboard();
  }
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', route);

  // 相关文档
  const related = Object.values(knowledgeDocs).filter(d=>d.category===doc.category && d.id!==doc.id).slice(0,3);

            <div class="flex flex-wrap gap-1.5 mt-3">${doc.tags.map(t=>`<span class="text-xs px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">${t}</span>`).join('')}</div>

function formatHexField(el) {
  el.value = el.value.replace(/[^0-9a-fA-F]/g,'').toUpperCase().substring(0,2);
}
function formatHexData(el) {
  el.value = el.value.replace(/[^0-9a-fA-F]/g,'').toUpperCase();
}

function updateAPDUPreview() {
  const cla = document.getElementById('apdu_CLA').value;
  const ins = document.getElementById('apdu_INS').value;
  const p1 = document.getElementById('apdu_P1').value;
  const p2 = document.getElementById('apdu_P2').value;
  const data = document.getElementById('apdu_Data').value;
  const le = document.getElementById('apdu_Le').value;
  // 计算Lc
  const dataLen = data.length / 2;
  const lcHex = dataLen > 0 ? dataLen.toString(16).toUpperCase().padStart(2,'0') : '';
  document.getElementById('apdu_Lc').value = lcHex;
  // 构建命令
  let cmd = cla + ins + p1 + p2;
  if (dataLen > 0) cmd += ' ' + lcHex + ' ' + formatHexSpaces(data);
  if (le) cmd += ' ' + le;
  const preview = document.getElementById('apduPreview');
  if (cla && ins) {
    preview.innerHTML = `<span class="text-yellow-400">${cla}</span> <span class="text-cyan-400">${ins}</span> <span class="text-purple-400">${p1||'00'}</span> <span class="text-purple-400">${p2||'00'}</span>${dataLen>0?' <span class="text-gray-400">'+lcHex+'</span> <span class="text-green-300">'+formatHexSpaces(data)+'</span>':''}${le?' <span class="text-orange-400">'+le+'</span>':''}`;
  } else {
    preview.innerHTML = '<span class="text-gray-500">等待输入...</span>';
  }
}

function formatHexSpaces(hex) {
  return hex.match(/.{1,2}/g)?.join(' ') || '';
}

function getAPDUCommand() {
  const cla = document.getElementById('apdu_CLA').value;
  const ins = document.getElementById('apdu_INS').value;
  const p1 = document.getElementById('apdu_P1').value;
  const p2 = document.getElementById('apdu_P2').value;
  const data = document.getElementById('apdu_Data').value;
  const le = document.getElementById('apdu_Le').value;
  const dataLen = data.length / 2;
  const lcHex = dataLen > 0 ? dataLen.toString(16).toUpperCase().padStart(2,'0') : '';
  let cmd = cla + ins + p1 + p2;
  if (dataLen > 0) cmd += lcHex + data;
  if (le) cmd += le;
  return cmd.toUpperCase();
}

function copyAPDU() {
  const cmd = getAPDUCommand();
  if (!cmd || cmd.length < 4) { showToast('请先输入APDU命令','error'); return; }
  navigator.clipboard.writeText(cmd).then(()=>{
    const btn = document.getElementById('copyBtn');
    btn.innerHTML = '<i class="fas fa-check mr-1.5"></i>已复制';
    setTimeout(()=>{ btn.innerHTML='<i class="fas fa-copy mr-1.5"></i>复制命令'; },1500);
    showToast('APDU命令已复制到剪贴板');
  }).catch(()=>showToast('复制失败','error'));
}

function loadAPDUTemplate(id) {
  const t = apduTemplates.find(x=>x.id===id);
  if(!t) return;
  document.getElementById('apdu_CLA').value = t.cla;
  document.getElementById('apdu_INS').value = t.ins;
  document.getElementById('apdu_P1').value = t.p1;
  document.getElementById('apdu_P2').value = t.p2;
  document.getElementById('apdu_Data').value = t.data;
  document.getElementById('apdu_Le').value = t.le;
  updateAPDUPreview();
  // 高亮模板按钮
  document.querySelectorAll('.apdu-tpl-btn').forEach(b => b.classList.remove('bg-primary-50','dark:bg-primary-900/20','text-primary-600'));
  const btn = document.querySelector(`.apdu-tpl-btn[data-id="${id}"]`);
  if(btn) btn.classList.add('bg-primary-50','dark:bg-primary-900/20','text-primary-600');
}

function saveAPDUToHistory() {
  const cmd = getAPDUCommand();
  if (!cmd || cmd.length < 4) { showToast('请先输入APDU命令','error'); return; }
  apduHistory.unshift({ cmd, time: new Date().toLocaleString('zh-CN') });
  if(apduHistory.length > 50) apduHistory = apduHistory.slice(0,50);
  lsSet('apduHistory', apduHistory);
  document.getElementById('apduHistoryList').innerHTML = renderAPDUHistory();
  showToast('命令已保存到历史记录');
}

function renderAPDUHistory() {
  if (apduHistory.length === 0) return '<p class="text-sm text-gray-400 p-3">暂无历史记录</p>';
  return apduHistory.map((h,i)=>`
    <div class="flex items-center justify-between px-3 py-2 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors group">
      <button onclick="loadAPDUFromHistory(${i})" class="flex-1 text-left">
        <p class="text-xs font-mono text-primary-600 dark:text-primary-400 truncate">${formatHexSpaces(h.cmd)}</p>
        <p class="text-xs text-gray-400 mt-0.5">${h.time}</p>
      </button>
      <button onclick="apduHistory.splice(${i},1);lsSet('apduHistory',apduHistory);document.getElementById('apduHistoryList').innerHTML=renderAPDUHistory()" class="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-500 transition-all ml-2"><i class="fas fa-times text-xs"></i></button>
    </div>
  `).join('');
}

function loadAPDUFromHistory(idx) {
  const h = apduHistory[idx];
  if(!h) return;
  const cmd = h.cmd;
  document.getElementById('apdu_CLA').value = cmd.substring(0,2);
  document.getElementById('apdu_INS').value = cmd.substring(2,4);
  document.getElementById('apdu_P1').value = cmd.substring(4,6);
  document.getElementById('apdu_P2').value = cmd.substring(6,8);
  // 解析剩余部分
  let rest = cmd.substring(8);
  const data = document.getElementById('apdu_Data');
  const le = document.getElementById('apdu_Le');
  // 简单解析：如果有Lc则Data=rest[:-2], Le=rest[-2:]
  if (rest.length > 2) {
    const lcVal = parseInt(rest.substring(0,2),16);
    const expectedLen = lcVal * 2;
    if (expectedLen > 0 && rest.length >= 2 + expectedLen) {
      data.value = rest.substring(2, 2+expectedLen);
      le.value = rest.substring(2+expectedLen);
    } else {
      data.value = rest;
      le.value = '';
    }
  } else {
    data.value = '';
    le.value = rest;
  }
  updateAPDUPreview();
}

function clearAPDU() {
  ['CLA','INS','P1','P2','Data','Le'].forEach(f=>{ document.getElementById('apdu_'+f).value=''; });
  updateAPDUPreview();
  document.querySelectorAll('.apdu-tpl-btn').forEach(b=>b.classList.remove('bg-primary-50','dark:bg-primary-900/20','text-primary-600'));
}

function clearAPDUHistory() {
  apduHistory = [];
  lsSet('apduHistory', []);
  document.getElementById('apduHistoryList').innerHTML = renderAPDUHistory();
  showToast('历史记录已清空','info');
}

function addFileEntry() {
  const container = document.getElementById('fileSystemConfig');
  const div = document.createElement('div');
  div.className = 'flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-700/50 rounded-lg animate-fadeIn';
  div.innerHTML = `<div class="flex items-center gap-2"><input type="text" placeholder="文件ID (Hex)" class="hex-input w-24 px-2 py-1 rounded border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm font-mono"><input type="text" placeholder="文件描述" class="w-32 px-2 py-1 rounded border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm"><select class="px-2 py-1 rounded border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm"><option>EF (透明)</option><option>EF (记录)</option><option>EF (循环)</option><option>DF</option></select></div><button onclick="this.closest('div').remove()" class="text-gray-400 hover:text-red-500"><i class="fas fa-times"></i></button>`;
  container.appendChild(div);
}

function exportCardConfig() {
  const config = {
    cos: { type: document.getElementById('cfg_cosType')?.value, protocol: document.getElementById('cfg_protocol')?.value, ram: document.getElementById('cfg_ram')?.value, eeprom: document.getElementById('cfg_eeprom')?.value },
    exportTime: new Date().toISOString(),
    version: '1.0'
  };
  const json = JSON.stringify(config, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'card-config.json'; a.click();
  URL.revokeObjectURL(url);
  showToast('配置已导出');
}

function getLearningProgress() { return lsGet('learningProgress', {}); }
function setLearningProgress(p) { lsSet('learningProgress', p); }

function renderLearning() {
  setBreadcrumb([{label:'首页',href:'#!/'},{label:'学习路径',icon:'fa-graduation-cap'}]);
  const progress = getLearningProgress();

  document.getElementById('app').innerHTML = `
  <div class="max-w-4xl mx-auto px-4 sm:px-6 py-6 animate-fadeIn">
    <h2 class="text-lg font-bold mb-2">学习路径</h2>
    <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">系统化的智能卡技术学习路线，从入门到精通</p>
    ${Object.entries(learningPaths).map(([key,path])=>{
      const completed = path.nodes.filter(n=>progress[n.id]==='completed').length;
      const total = path.nodes.length;
      const pct = Math.round(completed/total*100);
      const colorMap = {green:'green',blue:'blue',purple:'purple'};
      const c = colorMap[path.color]||'gray';
      return `<div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 mb-6">
        <div class="px-5 py-4 border-b border-gray-100 dark:border-gray-700">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg bg-${c}-100 dark:bg-${c}-900/30 flex items-center justify-center"><i class="fas ${path.icon} text-${c}-600 dark:text-${c}-400"></i></div>
              <div><h3 class="font-semibold">${path.name}</h3><p class="text-xs text-gray-400">${completed}/${total} 已完成</p></div>
            </div>
            <span class="text-sm font-bold text-${c}-600">${pct}%</span>
          </div>
          <div class="w-full bg-gray-100 dark:bg-gray-700 rounded-full h-2"><div class="progress-bar bg-${c}-500 h-2 rounded-full" style="width:${pct}%"></div></div>
        </div>
        <div class="p-5">
          <div class="relative">
            ${path.nodes.map((node,i)=>{
              const status = progress[node.id] || (i===0?'not-started':(key!=='beginner'&&i===0?'locked':(progress[path.nodes[i-1]?.id]==='completed'?'not-started':'locked')));
              const statusIcon = status==='completed'?'fa-check-circle text-green-500':status==='in-progress'?'fa-spinner fa-spin text-blue-500':status==='locked'?'fa-lock text-gray-300 dark:text-gray-600':'fa-circle text-gray-300 dark:text-gray-600';
              const isLast = i===path.nodes.length-1;
              return `<div class="flex gap-4 ${!isLast?'pb-6':''}">
                <div class="flex flex-col items-center">
                  <i class="fas ${statusIcon} text-lg"></i>
                  ${!isLast?'<div class="w-0.5 flex-1 mt-1 '+(status==='completed'?'bg-green-200 dark:bg-green-800':'bg-gray-200 dark:bg-gray-700')+'"></div>':''}
                </div>
                <div class="flex-1 pb-1">
                  <button onclick="toggleLearningNode('${key}','${node.id}')" class="w-full text-left group">
                    <div class="flex items-center justify-between">
                      <div>
                        <h4 class="text-sm font-medium group-hover:text-primary-600 transition-colors">${node.title}</h4>
                        <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">${node.desc}</p>
                      </div>
                      <div class="flex items-center gap-2 flex-shrink-0">
                        <span class="text-xs text-gray-400"><i class="fas fa-clock mr-1"></i>${node.duration}</span>
                        ${status!=='locked'?`<button onclick="event.stopPropagation();markNodeComplete('${node.id}')" class="text-xs px-2 py-1 rounded ${status==='completed'?'bg-green-100 dark:bg-green-900/30 text-green-600':'bg-gray-100 dark:bg-gray-700 text-gray-500 hover:bg-primary-100 hover:text-primary-600'} transition-colors">${status==='completed'?'已完成':'标记完成'}</button>`:''}
                      </div>
                    </div>
                  </button>
                  <div id="node-${node.id}" class="hidden mt-3 p-4 bg-gray-50 dark:bg-gray-700/50 rounded-lg animate-fadeIn">
                    <p class="text-sm text-gray-600 dark:text-gray-300">本节课程内容将在此展示。包含理论讲解、代码示例和练习题。</p>
                    <div class="mt-3 flex gap-2">
                      <button class="px-3 py-1.5 rounded-lg bg-primary-600 text-white text-xs font-medium hover:bg-primary-700 transition-colors">开始学习</button>
                      <button onclick="markNodeComplete('${node.id}')" class="px-3 py-1.5 rounded-lg border border-gray-200 dark:border-gray-600 text-xs hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">标记完成</button>
                    </div>
                  </div>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function toggleLearningNode(pathKey, nodeId) {
  const el = document.getElementById('node-'+nodeId);
  if(el) el.classList.toggle('hidden');
}

function markNodeComplete(nodeId) {
  const progress = getLearningProgress();
  progress[nodeId] = 'completed';
  setLearningProgress(progress);
  renderLearning();
  showToast('已标记为完成');
}

// 社区问答
// ============================================================
let communitySort = 'latest';
let communityLikes = lsGet('communityLikes', {});

function renderCommunity() {
  setBreadcrumb([{label:'首页',href:'#!/'},{label:'社区',icon:'fa-comments'}]);
  const sorted = [...communityQuestions].sort((a,b)=>{
    if(communitySort==='hot') return b.views-a.views;
    if(communitySort==='unanswered') return a.answerList.length-b.answerList.length;
    return 0;
  });

  document.getElementById('app').innerHTML = `
  <div class="max-w-4xl mx-auto px-4 sm:px-6 py-6 animate-fadeIn">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-lg font-bold">社区问答</h2>
      <button onclick="document.getElementById('askForm').classList.toggle('hidden')" class="px-4 py-2 rounded-lg bg-primary-600 text-white text-sm font-medium hover:bg-primary-700 transition-colors"><i class="fas fa-plus mr-1.5"></i>提问</button>
    </div>
    <!-- 提问表单 -->
    <div id="askForm" class="hidden bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5 mb-6 animate-fadeIn">
      <h3 class="font-semibold text-sm mb-4">提出问题</h3>
      <div class="space-y-3">
        <input id="askTitle" type="text" placeholder="问题标题" class="w-full px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm">
        <textarea id="askContent" rows="3" placeholder="详细描述你的问题..." class="w-full px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm resize-none"></textarea>
        <div class="flex items-center justify-between">
          <div class="flex flex-wrap gap-2">
            ${['APDU','PBOC','EMV','ISO 7816','安全认证','非接触式','文件系统'].map(t=>`<label class="flex items-center gap-1 text-xs"><input type="checkbox" value="${t}" class="ask-tag rounded border-gray-300 text-primary-600 focus:ring-primary-500">${t}</label>`).join('')}
          </div>
          <button onclick="submitQuestion()" class="px-4 py-2 rounded-lg bg-primary-600 text-white text-sm font-medium hover:bg-primary-700 transition-colors">发布问题</button>
        </div>
      </div>
    </div>
    <!-- 排序 -->
    <div class="flex gap-2 mb-4">
      ${['latest','hot','unanswered'].map(s=>`<button onclick="communitySort='${s}';renderCommunity()" class="px-3 py-1.5 rounded-lg text-sm ${communitySort===s?'bg-primary-600 text-white':'bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'} transition-colors">${s==='latest'?'最新':s==='hot'?'最热':'未回答'}</button>`).join('')}
    </div>
    <!-- 问题列表 -->
    <div class="space-y-3">
      ${sorted.map(q=>`
        <a href="#!/community/${q.id}" class="block bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5 hover:shadow-lg transition-all group">
          <div class="flex items-start gap-3">
            <div class="flex flex-col items-center gap-1 flex-shrink-0">
              <button onclick="event.preventDefault();likeQuestion('${q.id}')" class="text-gray-400 hover:text-primary-600 transition-colors"><i class="fas fa-thumbs-up text-sm"></i></button>
              <span class="text-xs font-medium">${q.likes + (communityLikes[q.id]||0)}</span>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="text-sm font-semibold mb-1 group-hover:text-primary-600 transition-colors">${q.title}</h3>
              <p class="text-xs text-gray-500 dark:text-gray-400 mb-2 line-clamp-2">${q.content}</p>
              <div class="flex flex-wrap items-center gap-3 text-xs text-gray-400">
                <span><i class="fas fa-user mr-1"></i>${q.author}</span>
                <span><i class="fas fa-clock mr-1"></i>${q.time}</span>
                <span><i class="fas fa-eye mr-1"></i>${q.views}</span>
                <span><i class="fas fa-comment mr-1"></i>${q.answerList.length}回答</span>
                ${q.tags.map(t=>`<span class="px-1.5 py-0.5 rounded bg-gray-100 dark:bg-gray-700">${t}</span>`).join('')}
              </div>
            </div>
          </div>
        </a>
      `).join('')}
    </div>
  </div>`;
}

function likeQuestion(id) {
  communityLikes[id] = (communityLikes[id]||0) + 1;
  lsSet('communityLikes', communityLikes);
  renderCommunity();
}

function submitQuestion() {
  const title = document.getElementById('askTitle').value.trim();
  const content = document.getElementById('askContent').value.trim();
  if(!title || !content) { showToast('请填写标题和内容','error'); return; }
  const tags = [...document.querySelectorAll('.ask-tag:checked')].map(c=>c.value);
  communityQuestions.unshift({
    id:'q_'+Date.now(), title, content, author:'我', time:new Date().toLocaleDateString('zh-CN'),
    views:0, likes:0, answers:0, tags: tags.length?tags:['其他'], answerList:[]
  });
  document.getElementById('askForm').classList.add('hidden');
  document.getElementById('askTitle').value='';
  document.getElementById('askContent').value='';
  renderCommunity();
  showToast('问题已发布');
}

function renderQuestionDetail(qId) {
  const q = communityQuestions.find(x=>x.id===qId);
  if(!q) { document.getElementById('app').innerHTML='<div class="p-8 text-center text-gray-400">问题未找到</div>'; return; }
  setBreadcrumb([{label:'首页',href:'#!/'},{label:'社区',href:'#!/community',icon:'fa-comments'},{label:q.title.substring(0,20)+'...'}]);

  document.getElementById('app').innerHTML = `
  <div class="max-w-4xl mx-auto px-4 sm:px-6 py-6 animate-fadeIn">
    <a href="#!/community" class="inline-flex items-center gap-1 text-sm text-gray-500 hover:text-primary-600 mb-4 transition-colors"><i class="fas fa-arrow-left"></i>返回列表</a>
    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6 mb-6">
      <h1 class="text-lg font-bold mb-2">${q.title}</h1>
      <div class="flex flex-wrap items-center gap-3 text-xs text-gray-400 mb-4">
        <span><i class="fas fa-user mr-1"></i>${q.author}</span>
        <span><i class="fas fa-clock mr-1"></i>${q.time}</span>
        <span><i class="fas fa-eye mr-1"></i>${q.views}</span>
        ${q.tags.map(t=>`<span class="px-1.5 py-0.5 rounded bg-gray-100 dark:bg-gray-700">${t}</span>`).join('')}
      </div>
      <div class="text-sm text-gray-700 dark:text-gray-300 leading-relaxed whitespace-pre-wrap">${q.content}</div>
      <div class="flex items-center gap-3 mt-4 pt-4 border-t border-gray-100 dark:border-gray-700">
        <button onclick="likeQuestion('${q.id}')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm ${communityLikes[q.id]?'bg-primary-100 dark:bg-primary-900/30 text-primary-600':'bg-gray-100 dark:bg-gray-700 text-gray-500'} hover:bg-primary-100 hover:text-primary-600 transition-colors"><i class="fas fa-thumbs-up"></i>有帮助 (${q.likes + (communityLikes[q.id]||0)})</button>
      </div>
    </div>
    <!-- 回答列表 -->
    <h3 class="font-semibold text-sm mb-3">${q.answerList.length} 个回答</h3>
    <div class="space-y-4 mb-6">
      ${q.answerList.map(a=>`
        <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5">
          <div class="flex items-center gap-3 text-xs text-gray-400 mb-3">
            <span class="font-medium text-gray-600 dark:text-gray-300"><i class="fas fa-user-circle mr-1"></i>${a.author}</span>
            <span>${a.time}</span>
            <button onclick="likeAnswer('${a.id}')" class="ml-auto flex items-center gap-1 text-gray-400 hover:text-primary-600 transition-colors"><i class="fas fa-thumbs-up"></i>${a.likes + (communityLikes[a.id]||0)}</button>
          </div>
          <div class="text-sm text-gray-700 dark:text-gray-300 leading-relaxed whitespace-pre-wrap">${a.content}</div>
        </div>
      `).join('')}
    </div>
    <!-- 回答表单 -->
    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5">
      <h3 class="font-semibold text-sm mb-3">写下你的回答</h3>
      <textarea id="answerContent" rows="4" placeholder="分享你的知识和经验..." class="w-full px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm resize-none mb-3"></textarea>
      <button onclick="submitAnswer('${q.id}')" class="px-4 py-2 rounded-lg bg-primary-600 text-white text-sm font-medium hover:bg-primary-700 transition-colors">提交回答</button>
    </div>
  </div>`;
}

function likeAnswer(id) {
  communityLikes[id] = (communityLikes[id]||0) + 1;
  lsSet('communityLikes', communityLikes);
  // 重新渲染当前问题
  const hash = location.hash;
  const qId = hash.split('/')[2];
  renderQuestionDetail(qId);
}

function submitAnswer(qId) {
  const content = document.getElementById('answerContent').value.trim();
  if(!content) { showToast('请填写回答内容','error'); return; }
  const q = communityQuestions.find(x=>x.id===qId);
  if(q) {
    q.answerList.push({ id:'a_'+Date.now(), author:'我', content, time:new Date().toLocaleDateString('zh-CN'), likes:0 });
    renderQuestionDetail(qId);
    showToast('回答已提交');
  }
}

// ============================================================
// 搜索结果页
// ============================================================
function renderSearchPage(query) {
  setBreadcrumb([{label:'首页',href:'#!/'},{label:'搜索结果',icon:'fa-search'}]);
  addSearchHistory(query);
  const q = query.toLowerCase();
  let results = [];
  Object.values(knowledgeDocs).forEach(doc => {
    if (doc.title.toLowerCase().includes(q) || doc.summary.toLowerCase().includes(q) || doc.tags.some(t=>t.toLowerCase().includes(q)) || doc.standard.toLowerCase().includes(q)) {
      results.push({ type:'doc', title:doc.title, desc:doc.summary, href:'#!/knowledge/'+doc.id, tags:doc.tags });
    }
  });
  communityQuestions.forEach(qa => {
    if (qa.title.toLowerCase().includes(q) || qa.content.toLowerCase().includes(q) || qa.tags.some(t=>t.toLowerCase().includes(q))) {
      results.push({ type:'qa', title:qa.title, desc:qa.content.substring(0,100)+'...', href:'#!/community/'+qa.id, tags:qa.tags });
    }
  });
  apduTemplates.forEach(t => {
    if (t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q)) {
      results.push({ type:'tool', title:t.name, desc:t.desc, href:'#!/tools/apdu', tags:[t.group] });
    }
  });

  const hl = (text) => text.replace(new RegExp('('+query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'), '<mark class="search-hl">$1</mark>');

  document.getElementById('app').innerHTML = `
  <div class="max-w-4xl mx-auto px-4 sm:px-6 py-6 animate-fadeIn">
    <div class="flex items-center gap-3 mb-6">
      <h2 class="text-lg font-bold">搜索结果</h2>
      <span class="text-sm text-gray-400">"${query}" 找到 ${results.length} 条结果</span>
    </div>
    ${results.length===0?'<div class="text-center py-12 text-gray-400"><i class="fas fa-search text-4xl mb-3 block"></i><p>未找到相关结果</p><p class="text-sm mt-1">试试其他关键词</p></div>':''}
    <div class="space-y-3">
      ${results.map(r=>{
        const typeIcon = r.type==='doc'?'fa-file-alt text-blue-500':r.type==='qa'?'fa-question-circle text-green-500':'fa-terminal text-purple-500';
        const typeLabel = r.type==='doc'?'文档':r.type==='qa'?'问答':'工具';
        return `<a href="${r.href}" class="block bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5 hover:shadow-lg transition-all group">
          <div class="flex items-start gap-3">
            <i class="fas ${typeIcon} mt-0.5"></i>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-1"><span class="text-xs px-1.5 py-0.5 rounded bg-gray-100 dark:bg-gray-600 text-gray-500 dark:text-gray-300">${typeLabel}</span><h3 class="text-sm font-semibold group-hover:text-primary-600 transition-colors">${hl(r.title)}</h3></div>
              <p class="text-xs text-gray-500 dark:text-gray-400 line-clamp-2">${hl(r.desc)}</p>
              <div class="flex gap-1 mt-2">${r.tags.map(t=>`<span class="text-xs px-1.5 py-0.5 rounded bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-400">${t}</span>`).join('')}</div>
            </div>
          </div>
        </a>`;
      }).join('')}
    </div>
  </div>`;
}
