<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>足球战术板 Tactics Board</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">⚽</span>
      <h1>足球战术板</h1>
    </div>
    <div class="topbar-actions">
      <button id="btn-screenshot" class="btn btn-ghost" title="导出图片">📷 导出</button>
      <button id="btn-fullscreen" class="btn btn-ghost" title="全屏">⛶ 全屏</button>
    </div>
  </header>

  <div class="layout">
    <!-- 左侧工具栏 -->
    <aside class="sidebar">
      <section class="panel">
        <h3>工具</h3>
        <div class="tool-grid">
          <button class="tool active" data-tool="select" title="选择/移动">
            <span class="ico">🖱️</span><span>选择</span>
          </button>
          <button class="tool" data-tool="line" title="直线">
            <span class="ico">／</span><span>直线</span>
          </button>
          <button class="tool" data-tool="arrow" title="箭头(传球/跑动)">
            <span class="ico">➤</span><span>箭头</span>
          </button>
          <button class="tool" data-tool="dash" title="虚线箭头(跑动)">
            <span class="ico">⤳</span><span>虚线</span>
          </button>
          <button class="tool" data-tool="curve" title="弧线">
            <span class="ico">⤴</span><span>弧线</span>
          </button>
          <button class="tool" data-tool="free" title="自由绘制">
            <span class="ico">✏️</span><span>画笔</span>
          </button>
          <button class="tool" data-tool="zone" title="区域">
            <span class="ico">▭</span><span>区域</span>
          </button>
          <button class="tool" data-tool="erase" title="擦除元素">
            <span class="ico">🧽</span><span>擦除</span>
          </button>
        </div>
      </section>

      <section class="panel">
        <h3>颜色</h3>
        <div class="color-row">
          <button class="swatch active" data-color="#ffd60a" style="background:#ffd60a"></button>
          <button class="swatch" data-color="#ef4444" style="background:#ef4444"></button>
          <button class="swatch" data-color="#3b82f6" style="background:#3b82f6"></button>
          <button class="swatch" data-color="#22c55e" style="background:#22c55e"></button>
          <button class="swatch" data-color="#ffffff" style="background:#ffffff"></button>
          <button class="swatch" data-color="#000000" style="background:#000000"></button>
        </div>
        <div class="slider-row">
          <label>线宽 <span id="stroke-val">3</span>px</label>
          <input id="stroke-width" type="range" min="1" max="10" value="3">
        </div>
      </section>

      <section class="panel">
        <h3>阵型 (主队)</h3>
        <div class="formation-grid">
          <button class="form-btn" data-formation="4-4-2">4-4-2</button>
          <button class="form-btn" data-formation="4-3-3">4-3-3</button>
          <button class="form-btn" data-formation="4-2-3-1">4-2-3-1</button>
          <button class="form-btn" data-formation="3-5-2">3-5-2</button>
          <button class="form-btn" data-formation="3-4-3">3-4-3</button>
          <button class="form-btn" data-formation="5-3-2">5-3-2</button>
          <button class="form-btn" data-formation="4-5-1">4-5-1</button>
          <button class="form-btn" data-formation="4-1-4-1">4-1-4-1</button>
        </div>
      </section>

      <section class="panel">
        <h3>球队设置</h3>
        <div class="team-row">
          <label>主队</label>
          <input type="color" id="home-color" value="#e11d48">
          <button class="mini" data-add="home">+1</button>
        </div>
        <div class="team-row">
          <label>客队</label>
          <input type="color" id="away-color" value="#1d4ed8">
          <button class="mini" data-add="away">+1</button>
        </div>
        <div class="team-row">
          <label>裁判</label>
          <button class="mini" data-add="ref">+1</button>
          <label>足球</label>
          <button class="mini" id="add-ball">⚽</button>
        </div>
        <label class="checkbox">
          <input type="checkbox" id="toggle-numbers" checked>
          显示号码
        </label>
        <label class="checkbox">
          <input type="checkbox" id="toggle-names">
          显示名字
        </label>
      </section>

      <section class="panel">
        <h3>操作</h3>
        <div class="actions">
          <button class="btn" id="btn-undo">↶ 撤销</button>
          <button class="btn" id="btn-redo">↷ 重做</button>
          <button class="btn btn-warn" id="btn-clear-draw">清除绘图</button>
          <button class="btn btn-danger" id="btn-reset">重置全部</button>
        </div>
      </section>
    </aside>

    <!-- 主战术板 -->
    <main class="board-wrap">
      <div class="board" id="board">
        <svg id="pitch" viewBox="0 0 1050 680" preserveAspectRatio="xMidYMid meet">
          <!-- 草坪条纹 -->
          <defs>
            <pattern id="grass" width="60" height="680" patternUnits="userSpaceOnUse">
              <rect width="30" height="680" fill="#2e8b3d"/>
              <rect x="30" width="30" height="680" fill="#2a7e37"/>
            </pattern>
            <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
              <stop offset="60%" stop-color="rgba(0,0,0,0)"/>
              <stop offset="100%" stop-color="rgba(0,0,0,0.35)"/>
            </radialGradient>
            <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
              <polygon points="0 0, 10 3, 0 6" fill="currentColor"/>
            </marker>
          </defs>

          <!-- 球场背景 -->
          <rect x="0" y="0" width="1050" height="680" fill="url(#grass)"/>
          <rect x="0" y="0" width="1050" height="680" fill="url(#vignette)"/>

          <!-- 球场线条 -->
          <g class="lines" stroke="#ffffff" stroke-width="2.5" fill="none">
            <rect x="25" y="25" width="1000" height="630"/>
            <line x1="525" y1="25" x2="525" y2="655"/>
            <circle cx="525" cy="340" r="73"/>
            <circle cx="525" cy="340" r="2" fill="#fff"/>

            <!-- 左大禁区 -->
            <rect x="25" y="155" width="165" height="370"/>
            <!-- 左小禁区 -->
            <rect x="25" y="245" width="55" height="190"/>
            <!-- 左点球点 -->
            <circle cx="135" cy="340" r="2" fill="#fff"/>
            <!-- 左弧线 -->
            <path d="M 190 280 A 73 73 0 0 1 190 400"/>
            <!-- 左球门 -->
            <rect x="15" y="305" width="10" height="70" stroke="#fff" stroke-width="2" fill="rgba(255,255,255,0.1)"/>

            <!-- 右大禁区 -->
            <rect x="860" y="155" width="165" height="370"/>
            <rect x="970" y="245" width="55" height="190"/>
            <circle cx="915" cy="340" r="2" fill="#fff"/>
            <path d="M 860 280 A 73 73 0 0 0 860 400"/>
            <rect x="1025" y="305" width="10" height="70" stroke="#fff" stroke-width="2" fill="rgba(255,255,255,0.1)"/>

            <!-- 角球弧 -->
            <path d="M 25 35 A 10 10 0 0 1 35 25"/>
            <path d="M 1015 25 A 10 10 0 0 1 1025 35"/>
            <path d="M 25 645 A 10 10 0 0 0 35 655"/>
            <path d="M 1015 655 A 10 10 0 0 0 1025 645"/>
          </g>

          <!-- 绘图层 (用户的线/箭头/区域) -->
          <g id="draw-layer"></g>
          <!-- 元素层 (球员/球) -->
          <g id="entity-layer"></g>
          <!-- 临时绘制预览 -->
          <g id="preview-layer"></g>
        </svg>

        <div class="hint" id="hint">点击工具开始 · 双击球员重命名 · 拖动移动球员</div>
      </div>
    </main>
  </div>
</div>

<!-- 球员重命名弹窗 -->
<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <h3>编辑球员</h3>
    <label>号码</label>
    <input type="text" id="m-number" maxlength="3">
    <label>姓名</label>
    <input type="text" id="m-name" maxlength="12">
    <div class="modal-actions">
      <button class="btn" id="m-cancel">取消</button>
      <button class="btn btn-primary" id="m-ok">确定</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
