<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猪头煮不烂的爱好配件库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
        :root { --primary-color: #3498db; --secondary-color: #2ecc71; --danger-color: #e74c3c; --warning-color: #f39c12; --dark-color: #2c3e50; --light-color: #ecf0f1; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1800px; margin: 0 auto; }
        header { text-align: center; color: white; margin-bottom: 30px; padding: 20px; }
        header h1 { font-size: 2.8em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: rgba(255, 255, 255, 0.95); border-radius: 12px; padding: 25px; display: flex; align-items: center; box-shadow: 0 8px 25px rgba(0,0,0,0.1); transition: transform 0.3s ease; cursor: pointer; }
        .stat-card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 1); }
        .stat-icon { width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 20px; font-size: 1.8em; }
        .stat-info h3 { color: #7f8c8d; font-size: 0.9em; margin-bottom: 5px; }
        .stat-number { font-size: 2.2em; font-weight: bold; color: var(--dark-color); }
        .main-content { display: grid; grid-template-columns: 1fr 400px; gap: 20px; }
        @media (max-width: 1400px) { .main-content { grid-template-columns: 1fr; } }
        .card { background: rgba(255, 255, 255, 0.95); border-radius: 12px; padding: 25px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .card-title { color: var(--dark-color); margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--primary-color); display: flex; justify-content: space-between; align-items: center; }
        .table-container { overflow-x: auto; max-height: 600px; border: 1px solid #eee; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; min-width: 1400px; }
        th { background: var(--light-color); color: var(--dark-color); padding: 12px 8px; text-align: left; font-weight: 600; font-size: 0.9em; }
        td { padding: 8px; border-bottom: 1px solid #eee; font-size: 0.85em; }
        tr:hover { background: #f8f9fa; }
        .chip { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8em; font-weight: 500; }
        .chip-stock-good { background: #d5f4e6; color: #27ae60; }
        .chip-stock-warning { background: #fef9e7; color: #f39c12; }
        .chip-stock-danger { background: #fdebd0; color: #e74c3c; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.3s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-primary:hover { background: #2980b9; }
        .btn-success { background: var(--secondary-color); color: white; }
        .btn-success:hover { background: #27ae60; }
        .btn-warning { background: var(--warning-color); color: white; }
        .btn-warning:hover { background: #e67e22; }
        .btn-danger { background: var(--danger-color); color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-sm { padding: 6px 12px; font-size: 0.85em; }
        .btn-group { display: flex; gap: 5px; }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; margin-bottom: 8px; color: var(--dark-color); font-weight: 600; font-size: 0.9em; }
        .form-control { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 6px; font-size: 0.9em; transition: border-color 0.3s; }
        .form-control:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2); }
        .search-box { position: relative; margin-bottom: 15px; }
        .search-input { width: 100%; padding: 12px 12px 12px 40px; border: 2px solid #ddd; border-radius: 6px; font-size: 0.9em; }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #95a5a6; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; border-radius: 12px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
        .modal-header { padding: 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 20px; border-top: 1px solid #eee; display: flex; justify-content: flex-end; gap: 10px; }
        .close-btn { background: none; border: none; font-size: 1.5em; cursor: pointer; color: #95a5a6; }
        .filter-tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
        .filter-tag { padding: 6px 12px; background: #e3f2fd; border-radius: 20px; font-size: 0.85em; cursor: pointer; transition: all 0.3s; }
        .filter-tag:hover { background: #bbdefb; }
        .filter-tag.active { background: var(--primary-color); color: white; }
        .filter-section { margin-bottom: 15px; padding: 15px; background: #f8f9fa; border-radius: 8px; }
        .filter-section-title { font-weight: 600; margin-bottom: 8px; color: var(--dark-color); display: flex; align-items: center; gap: 8px; }
        .stock-bar { height: 6px; background: #eee; border-radius: 3px; overflow: hidden; margin-top: 4px; }
        .stock-fill { height: 100%; transition: width 0.3s; }
        .no-data { text-align: center; padding: 40px; color: #95a5a6; }
        .export-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        footer { text-align: center; color: white; margin-top: 40px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.2); opacity: 0.8; }
        .batch-actions { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .select-all { display: flex; align-items: center; gap: 8px; margin-right: 15px; }
        .checkbox { width: 16px; height: 16px; cursor: pointer; }
        .import-export-section { background: #f8f9fa; border-radius: 8px; padding: 15px; margin-top: 15px; }
        .file-input { width: 100%; padding: 8px; border: 2px dashed #ddd; border-radius: 6px; margin-bottom: 10px; }
        .template-download { text-align: center; margin-top: 10px; }
        .template-link { color: var(--primary-color); text-decoration: none; font-size: 0.9em; cursor: pointer; }
        .template-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div style="display: flex; align-items: center; justify-content: center; gap: 15px;">
                <img src="image/logo.jpg" alt="Logo" style="width: 80px; height: 80px; border-radius: 50%;">
                <h1>猪头煮不烂的爱好配件库</h1>
            </div>
        </header>
        
        <div class="dashboard">
            <div class="stat-card" onclick="filterByAll()">
                <div class="stat-icon" style="background: #e3f2fd; color: #2196f3;">📊</div>
                <div class="stat-info">
                    <h3>总器件种类</h3>
                    <div class="stat-number" id="totalTypes">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #e8f5e9; color: #4caf50;">📦</div>
                <div class="stat-info">
                    <h3>总库存数量</h3>
                    <div class="stat-number" id="totalStock">0</div>
                </div>
            </div>
            <div class="stat-card" onclick="filterByLowStock()">
                <div class="stat-icon" style="background: #fff3e0; color: #ff9800;">⚠️</div>
                <div class="stat-info">
                    <h3>库存不足</h3>
                    <div class="stat-number" id="lowStock">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #ffebee; color: #f44336;">🏷️</div>
                <div class="stat-info">
                    <h3>分类数量</h3>
                    <div class="stat-number" id="categoryCount">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #f3e5f5; color: #9c27b0;">📍</div>
                <div class="stat-info">
                    <h3>位置数量</h3>
                    <div class="stat-number" id="locationCount">0</div>
                </div>
            </div>
        </div>
        
        <div class="main-content">
            <div>
                <div class="card">
                    <div class="card-title"><span>批量操作</span></div>
                    <div class="batch-actions">
                        <div class="select-all"><input type="checkbox" id="selectAll" class="checkbox" onchange="toggleSelectAll()"><label for="selectAll">全选</label></div>
                        <button class="btn btn-danger btn-sm" onclick="batchDelete()"><span>🗑️</span> 批量删除</button>
                        <button class="btn btn-warning btn-sm" onclick="batchExport()"><span>📤</span> 批量导出选中</button>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-title">
                        <span>筛选器</span>
                        <button class="btn btn-sm" onclick="clearAllFilters()" style="background: #95a5a6; color: white;"><span>🗑️</span> 清除筛选</button>
                    </div>
                    <div class="filter-section">
                        <div class="filter-section-title">🏷️ 分类</div>
                        <div class="filter-tags" id="categoryFilter"></div>
                    </div>
                    <div class="filter-section">
                        <div class="filter-section-title">📦 封装</div>
                        <div class="filter-tags" id="packageFilter"></div>
                    </div>
                    <div class="filter-section">
                        <div class="filter-section-title">📍 位置</div>
                        <div class="filter-tags" id="locationFilter"></div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-title">
                        <span>器件列表</span>
                        <div class="btn-group">
                            <button class="btn btn-primary btn-sm" onclick="showAddModal()"><span>➕</span> 新增器件</button>
                            <button class="btn btn-warning btn-sm" onclick="showManageModal()"><span>⚙️</span> 管理属性</button>
                            <button class="btn btn-info btn-sm" onclick="startInventory()"><span>📋</span> 盘库</button>
                            <button class="btn btn-secondary btn-sm" onclick="changePassword()"><span>🔐</span> 更改密码</button>
                        </div>
                    </div>
                    
                    <div class="search-box">
                        <input type="text" class="search-input" placeholder="搜索型号、名称、封装、丝印..." oninput="searchComponents()" id="searchInput">
                        <span class="search-icon">🔍</span>
                    </div>
                    
                    <div class="table-container">
                        <table id="componentsTable">
                            <thead>
                                <tr>
                                    <th style="width: 30px;"><input type="checkbox" id="tableSelectAll" class="checkbox" onchange="toggleTableSelectAll()"></th>
                                    <th>型号</th><th>名称</th><th>分类</th><th>功能</th><th>封装</th><th>丝印</th>
                                    <th>规格参数</th><th>数量</th><th>供应商</th><th>位置</th><th>备注</th><th>状态</th>
                                    <th style="width: 200px;">操作</th>
                                </tr>
                            </thead>
                            <tbody id="componentsBody"></tbody>
                        </table>
                    </div>
                    
                    <div class="no-data" id="noData" style="display: none;">
                        <div style="font-size: 3em; margin-bottom: 10px;">📭</div>
                        <h3>暂无数据</h3><p>点击"新增器件"按钮添加第一个器件</p>
                    </div>
                </div>
            </div>
            
            <div>
                <div class="card">
                    <div class="card-title">数据导入导出</div>
                    <div class="import-export-section">
                        <div class="form-group">
                            <label class="form-label">导入Excel文件</label>
                            <input type="file" id="excelFile" class="file-input" accept=".xlsx, .xls, .csv">
                            <button class="btn btn-success" onclick="importExcel()" style="width: 100%; margin-top: 8px;"><span>📥</span> 导入Excel</button>
                        </div>
                        <div class="form-group">
                            <label class="form-label">导出数据</label>
                            <div class="export-buttons">
                                <button class="btn btn-success" onclick="exportToExcel()"><span>📊</span> Excel</button>
                                <button class="btn btn-primary" onclick="exportToCSV()"><span>📄</span> CSV</button>
                                <button class="btn" onclick="printReport()" style="background: #95a5a6; color: white;"><span>🖨️</span> 打印</button>
                            </div>
                        </div>
                        <div class="template-download">
                            <a href="#" class="template-link" onclick="downloadTemplate()">📋 下载导入模板</a>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-title">库存概览</div>
                    <div id="stockOverview"></div>
                </div>
                
                <div class="card">
                    <div class="card-title">最近操作</div>
                    <div id="recentActivity"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal" id="componentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">新增器件</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <form id="componentForm">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="form-group"><label class="form-label">型号 *</label><input type="text" class="form-control" id="model" required></div>
                        <div class="form-group"><label class="form-label">名称 *</label><input type="text" class="form-control" id="name" required></div>
                        <div class="form-group"><label class="form-label">分类 *</label><select class="form-control" id="category" required><option value="">请选择分类</option></select></div>
                        <div class="form-group"><label class="form-label">功能</label><input type="text" class="form-control" id="function" placeholder="请输入功能"></div>
                        <div class="form-group"><label class="form-label">封装</label><select class="form-control" id="package"><option value="">请选择封装</option></select></div>
                        <div class="form-group"><label class="form-label">丝印</label><input type="text" class="form-control" id="marking"></div>
                    </div>
                    <div class="form-group"><label class="form-label">规格参数</label><input type="text" class="form-control" id="spec"></div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="form-group"><label class="form-label">数量 *</label><input type="number" class="form-control" id="stock" required min="0" value="0"></div>
                        <div class="form-group"><label class="form-label">供应商</label><input type="text" class="form-control" id="supplier"></div>
                        <div class="form-group"><label class="form-label">位置</label><select class="form-control" id="location"><option value="">请选择位置</option></select></div>
                    </div>
                    <div class="form-group"><label class="form-label">备注</label><textarea class="form-control" id="notes" rows="2"></textarea></div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveComponent()">保存</button>
            </div>
        </div>
    </div>
    
    <div class="modal" id="manageModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>管理属性</h2>
                <button class="close-btn" onclick="closeManageModal()">×</button>
            </div>
            <div class="modal-body">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label class="form-label">管理分类</label>
                        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                            <input type="text" class="form-control" id="newCategory" placeholder="输入新分类">
                            <button class="btn btn-primary" onclick="addCategory()">添加</button>
                        </div>
                        <div id="categoriesList" style="max-height: 200px; overflow-y: auto;"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">管理封装</label>
                        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                            <input type="text" class="form-control" id="newPackage" placeholder="输入新封装">
                            <button class="btn btn-primary" onclick="addPackage()">添加</button>
                        </div>
                        <div id="packagesList" style="max-height: 200px; overflow-y: auto;"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">管理位置</label>
                        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                            <input type="text" class="form-control" id="newLocation" placeholder="输入新位置">
                            <button class="btn btn-primary" onclick="addLocation()">添加</button>
                        </div>
                        <div id="locationsList" style="max-height: 200px; overflow-y: auto;"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeManageModal()">关闭</button>
            </div>
        </div>
    </div>
    
    <footer>
        <p>© 2024 电子元器件库存管理系统 | 版本 2.0 | 支持多维度筛选</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <script>
        // 初始化数据
        let components = [
            { id: 1, model: "BPC-817S", name: "光耦", category: "芯片", function: "光耦", package: "SMD-4", marking: "817C", spec: "", stock: 4, minStock: 2, supplier: "", location: "A-1-1", notes: "", createdAt: "2024-01-20", updatedAt: "2024-01-20" },
            { id: 2, model: "FST3253", name: "解码芯片", category: "芯片", function: "解码芯片", package: "TSSOP-16", marking: "", spec: "", stock: 3, minStock: 1, supplier: "", location: "A-1-2", notes: "", createdAt: "2024-01-20", updatedAt: "2024-01-20" },
            { id: 3, model: "LM4562MA", name: "双运放", category: "芯片", function: "运放", package: "SOP-8", marking: "", spec: "", stock: 3, minStock: 1, supplier: "", location: "A-1-3", notes: "", createdAt: "2024-01-20", updatedAt: "2024-01-20" }
        ];

        // 属性列表
        let categories = ["芯片", "阻容感", "连接件", "二三极管", "电源芯片", "声光", "功能模块", "开发板"];
        let packages = ["SMD-4", "TSSOP-16", "SOP-8", "SOT23-5L", "SOT23", "SOT-363", "SOT-232-3", "TO-252", "SOD-123", "LL-34"];
        let locations = ["A-1-1", "A-1-2", "A-1-3", "B-2-1", "C-3-1"];
        
        let recentActivities = [];
        let editingId = null;
        let currentCategory = "all";
        let currentPackage = "all";
        let currentLocation = "all";
        let searchQuery = "";
        let selectedComponents = new Set();
        let inventoryMode = false;
        let isAuthenticated = false;

        // 从本地存储加载数据
        function loadData() {
            const saved = localStorage.getItem('electronicComponents');
            if (saved) components = JSON.parse(saved);
            const savedCategories = localStorage.getItem('categories');
            if (savedCategories) categories = JSON.parse(savedCategories);
            const savedPackages = localStorage.getItem('packages');
            if (savedPackages) packages = JSON.parse(savedPackages);
            const savedLocations = localStorage.getItem('locations');
            if (savedLocations) locations = JSON.parse(savedLocations);
            const savedActivities = localStorage.getItem('recentActivities');
            if (savedActivities) recentActivities = JSON.parse(savedActivities);
        }

        // 保存数据到本地存储
        function saveData() {
            localStorage.setItem('electronicComponents', JSON.stringify(components));
            localStorage.setItem('categories', JSON.stringify(categories));
            localStorage.setItem('packages', JSON.stringify(packages));
            localStorage.setItem('locations', JSON.stringify(locations));
            localStorage.setItem('recentActivities', JSON.stringify(recentActivities));
        }

        // 盘库功能
        function startInventory() {
            inventoryMode = !inventoryMode;
            if (inventoryMode) {
                alert('进入盘库模式，所有字段将变为可编辑状态。完成后请刷新页面退出盘库模式。');
            }
            updateComponentsList();
        }

        // 保存盘库数据
        function saveInventoryData(id, field, value) {
            const component = components.find(comp => comp.id === id);
            if (!component) return;
            
            switch(field) {
                case 'model': component.model = value;
                    break;
                case 'name': component.name = value;
                    break;
                case 'category': component.category = value;
                    break;
                case 'function': component.function = value;
                    break;
                case 'package': component.package = value;
                    break;
                case 'marking': component.marking = value;
                    break;
                case 'spec': component.spec = value;
                    break;
                case 'stock': component.stock = parseInt(value) || 0;
                    break;
                case 'minStock': component.minStock = parseInt(value) || 0;
                    break;
                case 'supplier': component.supplier = value;
                    break;
                case 'location': component.location = value;
                    break;
                case 'notes': component.notes = value;
                    break;
            }
            
            component.updatedAt = new Date().toISOString().split('T')[0];
            saveData();
        }

        // 密码验证功能
        function authenticate() {
            const storedPassword = localStorage.getItem('inventoryPassword');
            
            // 如果没有设置密码，提示设置初始密码
            if (!storedPassword) {
                const newPassword = prompt('首次使用，请设置密码：');
                if (newPassword) {
                    localStorage.setItem('inventoryPassword', newPassword);
                    isAuthenticated = true;
                    return true;
                } else {
                    return false;
                }
            }
            
            // 验证密码
            const password = prompt('请输入密码：');
            if (password === storedPassword) {
                isAuthenticated = true;
                return true;
            } else {
                alert('密码错误！');
                return false;
            }
        }

        // 更改密码
        function changePassword() {
            const storedPassword = localStorage.getItem('inventoryPassword');
            const currentPassword = prompt('请输入当前密码：');
            
            if (currentPassword !== storedPassword) {
                alert('当前密码错误！');
                return;
            }
            
            const newPassword = prompt('请输入新密码：');
            if (!newPassword) {
                alert('密码不能为空！');
                return;
            }
            
            const confirmPassword = prompt('请确认新密码：');
            if (newPassword !== confirmPassword) {

            });

        function updatePackageFilter() {
            const container = document.getElementById('packageFilter');
            let html = `<div class="filter-tag ${currentPackage === 'all' ? 'active' : ''}" onclick="setFilter('package', 'all')">全部</div>`;

                if (count > 0) html += `<div class="filter-tag ${currentPackage === pkg ? 'active' : ''}" onclick="setFilter('package', '${pkg}')">${pkg} (${count})</div>`;

        // 设置筛选
        function setFilter(type, value) {
            switch(type) {
                case 'category': currentCategory = value; break;
                case 'package': currentPackage = value; break;
                case 'location': currentLocation = value; break;
            }
            updateComponentsList();
            updateFilters();
        }

            currentCategory = "all";

        // 批量设置预警值
        function setBatchMinStock() {
            const category = document.getElementById('batchCategory').value;
            const minStock = parseInt(document.getElementById('batchMinStock').value);
            
            if (!category) {
                alert('请选择分类！');
                return;
            }
            
            if (isNaN(minStock) || minStock < 0) {
                alert('请输入有效的预警值！');
                return;
            }
            
            const categoryComponents = components.filter(comp => comp.category === category);
            if (categoryComponents.length === 0) {
                alert('该分类下没有器件！');
                return;
            }
            
            if (confirm(`确定要为分类 "${category}" 下的 ${categoryComponents.length} 个器件设置预警值为 ${minStock} 吗？`)) {
                categoryComponents.forEach(comp => {
                    comp.minStock = minStock;
                });
                
                saveData();
                updateAll();
                alert(`已成功为 ${categoryComponents.length} 个器件设置预警值！`);
                addActivity('批量操作', `为分类 "${category}" 设置预警值为 ${minStock}`);
            }
        }

        // 编辑器件
        function editComponent(id) {
            const component = components.find(comp => comp.id === id);
            if (!component) return;
            editingId = id;
            document.getElementById('modalTitle').textContent = '编辑器件';
            document.getElementById('model').value = component.model;
            document.getElementById('name').value = component.name;
            document.getElementById('function').value = component.function || '';
            document.getElementById('package').value = component.package || '';
            document.getElementById('marking').value = component.marking || '';
            document.getElementById('spec').value = component.spec || '';
            document.getElementById('stock').value = component.stock;
            document.getElementById('supplier').value = component.supplier || '';
            document.getElementById('location').value = component.location || '';
            document.getElementById('notes').value = component.notes || '';
            updateSelects();
            document.getElementById('category').value = component.category;
            document.getElementById('function').value = component.function || '';
            document.getElementById('package').value = component.package || '';
            document.getElementById('location').value = component.location || '';
            document.getElementById('componentModal').style.display = 'flex';
        }

        // 保存器件
        function saveComponent() {
            const form = document.getElementById('componentForm');
            if (!form.checkValidity()) { form.reportValidity(); return; }
            const component = {
                id: editingId || Date.now(),
                model: document.getElementById('model').value,
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                function: document.getElementById('function').value,
                package: document.getElementById('package').value,
                marking: document.getElementById('marking').value,
                spec: document.getElementById('spec').value,
                stock: parseInt(document.getElementById('stock').value),
                supplier: document.getElementById('supplier').value,
                location: document.getElementById('location').value,
                notes: document.getElementById('notes').value,
                updatedAt: new Date().toISOString().split('T')[0]
            };
            if (editingId) {
                const index = components.findIndex(comp => comp.id === editingId);
                if (index !== -1) {
                    component.createdAt = components[index].createdAt;
                    components[index] = component;
                    addActivity('更新器件', `${component.model} (${component.name})`);
                }
            } else {
                component.createdAt = component.updatedAt;
                components.push(component);
                addActivity('新增器件', `${component.model} (${component.name})`);
            }
            saveData();
            updateAll();
            closeModal();
        }

        // 确认删除
        function confirmDelete(id) {
            const component = components.find(comp => comp.id === id);
            if (!component) return;
            if (confirm(`确定要删除器件 ${component.model} (${component.name}) 吗？此操作不可恢复！`)) deleteComponent(id);
        }

        // 删除器件
        function deleteComponent(id) {
            const component = components.find(comp => comp.id === id);
            if (component) {
                components = components.filter(comp => comp.id !== id);
                selectedComponents.delete(id);
                addActivity('删除器件', `${component.model} (${component.name})`);
                saveData();
                updateAll();
            }
        }

        // 调整库存
        // 入库操作
        function inStock(id) {
            const component = components.find(comp => comp.id === id);
            if (!component) return;
            
            const amount = prompt('请输入入库数量:', '1');
            const quantity = parseInt(amount);
            
            if (isNaN(quantity) || quantity <= 0) {
                alert('请输入有效的入库数量！');
                return;
            }
            
            if (confirm(`确定要为 ${component.model} 入库 ${quantity} 个吗？`)) {
                const newStock = component.stock + quantity;
                component.stock = newStock;
                component.updatedAt = new Date().toISOString().split('T')[0];
                addActivity('入库', `${component.model} ${quantity}个，当前库存: ${newStock}`);
                saveData();
                updateAll();
            }
        }

        // 出库操作
        function outStock(id) {
            const component = components.find(comp => comp.id === id);
            if (!component) return;
            
            const amount = prompt('请输入出库数量:', '1');
            const quantity = parseInt(amount);
            
            if (isNaN(quantity) || quantity <= 0) {
                alert('请输入有效的出库数量！');
                return;
            }
            
            if (component.stock < quantity) {
                alert('库存不足，无法出库！');
                return;
            }
            
            if (confirm(`确定要为 ${component.model} 出库 ${quantity} 个吗？`)) {
                const newStock = component.stock - quantity;
                component.stock = newStock;
                component.updatedAt = new Date().toISOString().split('T')[0];
                addActivity('出库', `${component.model} ${quantity}个，当前库存: ${newStock}`);
                saveData();
                updateAll();
            }
        }

                        <button class="btn btn-sm btn-danger" onclick="deleteCategory(${index})" style="padding: 2px 6px;" ${count > 0 ? 'disabled' : ''}>删除</button>

                </div>`;
            });
            container.innerHTML = html;
        }

        // 按分类批量设置预警值
        function setCategoryMinStock(index) {
            const category = categories[index];
            const minStockInput = document.getElementById(`minStock_${index}`);
            const minStock = parseInt(minStockInput.value);
            
            if (isNaN(minStock) || minStock < 0) {
                alert('请输入有效的预警值！');
                return;
            }
            
            let updatedCount = 0;
            components.forEach(comp => {
                if (comp.category === category) {
                    comp.minStock = minStock;
                    comp.updatedAt = new Date().toISOString().split('T')[0];
                    updatedCount++;
                }
            });
            
            saveData();
            updateComponentsList();
            updateCategoriesList();
            addActivity('批量设置预警值', `为分类 "${category}" 设置预警值为 ${minStock}，共更新 ${updatedCount} 个器件`);
            alert(`成功为分类 "${category}" 设置预警值为 ${minStock}，共更新 ${updatedCount} 个器件`);
        }

        function updatePackagesList() {
            const container = document.getElementById('packagesList');
            let html = '';
            if (packages.length === 0) html = '<div style="color: #95a5a6; padding: 20px; text-align: center;">暂无封装</div>';
            else packages.forEach((pkg, index) => {
                const count = components.filter(comp => comp.package === pkg).length;
                html += `<div style="display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee;">
                    <div>${pkg}</div><div><span style="font-size: 0.8em; color: #7f8c8d;">${count}个</span>
                    <button class="btn btn-sm btn-danger" onclick="deletePackage(${index})" style="margin-left: 8px; padding: 2px 6px;" ${count > 0 ? 'disabled' : ''}>删除</button></div></div>`;
            });
            container.innerHTML = html;
        }

        function updateLocationsList() {
            const container = document.getElementById('locationsList');
            let html = '';
            if (locations.length === 0) html = '<div style="color: #95a5a6; padding: 20px; text-align: center;">暂无位置</div>';
            else locations.forEach((loc, index) => {
                const count = components.filter(comp => comp.location === loc).length;
                html += `<div style="display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee;">
                    <div>${loc}</div><div><span style="font-size: 0.8em; color: #7f8c8d;">${count}个</span>
                    <button class="btn btn-sm btn-danger" onclick="deleteLocation(${index})" style="margin-left: 8px; padding: 2px 6px;" ${count > 0 ? 'disabled' : ''}>删除</button></div></div>`;
            });
            container.innerHTML = html;
        }

        // 删除属性
        function deleteCategory(index) {
            const category = categories[index];
            const usedCount = components.filter(comp => comp.category === category).length;
            if (usedCount > 0) { alert(`该分类下有 ${usedCount} 个器件，无法删除！\n请先修改或删除相关器件。`); return; }
            if (confirm(`确定要删除分类 "${category}" 吗？`)) {
                categories.splice(index, 1);
                saveData();
                updateAll();
                updateCategoriesList();
                addActivity('删除分类', category);
            }
        }

        function deletePackage(index) {
            const pkg = packages[index];
            const usedCount = components.filter(comp => comp.package === pkg).length;
            if (usedCount > 0) { alert(`该封装下有 ${usedCount} 个器件，无法删除！\n请先修改或删除相关器件。`); return; }
            if (confirm(`确定要删除封装 "${pkg}" 吗？`)) {
                packages.splice(index, 1);
                saveData();
                updateAll();
                updatePackagesList();
                addActivity('删除封装', pkg);
            }
        }

        function deleteLocation(index) {
            const loc = locations[index];
            const usedCount = components.filter(comp => comp.location === loc).length;
            if (usedCount > 0) { alert(`该位置下有 ${usedCount} 个器件，无法删除！\n请先修改或删除相关器件。`); return; }
            if (confirm(`确定要删除位置 "${loc}" 吗？`)) {
                locations.splice(index, 1);
                saveData();
                updateAll();
                updateLocationsList();
                addActivity('删除位置', loc);
            }
        }

        // 批量操作函数
        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll').checked;
            selectedComponents.clear();
            if (selectAll) components.forEach(comp => selectedComponents.add(comp.id));
            document.getElementById('tableSelectAll').checked = selectAll;
            updateComponentsList();
        }

        function toggleTableSelectAll() {
            const selectAll = document.getElementById('tableSelectAll').checked;
            document.getElementById('selectAll').checked = selectAll;
            toggleSelectAll();
        }

        function toggleComponent(id, checked) {
            if (checked) selectedComponents.add(id);
            else selectedComponents.delete(id);
            const allChecked = components.length > 0 && components.every(comp => selectedComponents.has(comp.id));
            document.getElementById('selectAll').checked = allChecked;
            document.getElementById('tableSelectAll').checked = allChecked;
        }

        function batchDelete() {
            if (selectedComponents.size === 0) { alert('请先选择要删除的器件'); return; }
            if (!confirm(`确定要删除选中的 ${selectedComponents.size} 个器件吗？此操作不可恢复！`)) return;
            const deletedCount = selectedComponents.size;
            components = components.filter(comp => !selectedComponents.has(comp.id));
            selectedComponents.clear();
            document.getElementById('selectAll').checked = false;
            document.getElementById('tableSelectAll').checked = false;
            saveData();
            updateAll();
            addActivity('批量删除', `删除 ${deletedCount} 个器件`);
        }

        function batchExport() {
            if (selectedComponents.size === 0) { alert('请先选择要导出的器件'); return; }
            const selectedData = components.filter(comp => selectedComponents.has(comp.id));
            exportSelectedToExcel(selectedData);
        }

        // 导入Excel文件 - 修正版：C列是分类，标签页是位置
        function importExcel() {
            const fileInput = document.getElementById('excelFile');
            const file = fileInput.files[0];
            if (!file) { alert('请选择要导入的Excel文件'); return; }
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    let totalImported = 0, totalUpdated = 0;
                    
                    workbook.SheetNames.forEach(sheetName => {
                        const worksheet = workbook.Sheets[sheetName];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                        if (jsonData.length < 2) return;
                        
                        for (let i = 1; i < jsonData.length; i++) {
                            const row = jsonData[i];
                            if (!row) continue;
                            const model = row[0]?.toString().trim();
                            if (!model) continue;
                            
                            // 列映射规则：A型号 B名称 C分类 D功能 E封装 F丝印 G规格参数 H数量 I预警值 J供应商 K备注
                            const category = row[2]?.toString().trim() || '未分类'; // 分类来自C列
                            const location = sheetName; // 位置来自标签页
                            const notes = row[10]?.toString().trim() || ''; // 备注来自K列
                            
                            const existingIndex = components.findIndex(comp => comp.model === model);
                            const componentData = {
                                id: existingIndex >= 0 ? components[existingIndex].id : Date.now() + i + totalImported,
                                model: model, 
                                name: row[1]?.toString().trim() || '', 
                                category: category, 
                                function: row[3]?.toString().trim() || '', 
                                package: row[4]?.toString().trim() || '', 
                                marking: row[5]?.toString().trim() || '', 
                                spec: row[6]?.toString().trim() || '', 
                                stock: parseInt(row[7]) || 0, 
                                minStock: parseInt(row[8]) || 10,
                                supplier: row[9]?.toString().trim() || '', 
                                location: location, 
                                notes: notes, 
                                updatedAt: new Date().toISOString().split('T')[0]
                            };
                            
                            if (existingIndex >= 0) {
                                componentData.createdAt = components[existingIndex].createdAt;
                                components[existingIndex] = componentData;
                                totalUpdated++;
                            } else {
                                componentData.createdAt = componentData.updatedAt;
                                components.push(componentData);
                                totalImported++;
                            }
                            
                            if (category && !categories.includes(category)) categories.push(category);
                            if (componentData.package && !packages.includes(componentData.package)) packages.push(componentData.package);
                            if (location && !locations.includes(location)) locations.push(location);
                        }
                    });
                    
                    saveData();
                    updateAll();
                    alert(`导入完成！新增: ${totalImported} 个，更新: ${totalUpdated} 个，共处理 ${workbook.SheetNames.length} 个标签页`);
                    fileInput.value = '';
                    addActivity('导入Excel', `新增 ${totalImported} 个，更新 ${totalUpdated} 个，${workbook.SheetNames.length} 个标签页`);
                } catch (error) {
                    console.error('导入错误:', error);
                    alert('导入失败，请检查文件格式');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // 导出为Excel - 按分类分标签页
        function exportToExcel() {
            const workbook = XLSX.utils.book_new();
            const componentsByCategory = {};
            components.forEach(comp => {
                const category = comp.category || '未分类';
                if (!componentsByCategory[category]) componentsByCategory[category] = [];
                componentsByCategory[category].push(comp);
            });
            Object.entries(componentsByCategory).forEach(([category, comps]) => {
                const data = comps.map(comp => [
                    comp.model, comp.name, comp.category, comp.function, comp.package, 
                    comp.marking, comp.spec, comp.stock, comp.minStock, comp.supplier, 
                    comp.notes
                ]);
                const headers = ['型号', '名称', '分类', '功能', '封装', '丝印', '规格参数', '数量', '预警值', '供应商', '备注'];
                data.unshift(headers);
                const worksheet = XLSX.utils.aoa_to_sheet(data);
                const colWidths = [{ wch: 20 },{ wch: 25 },{ wch: 12 },{ wch: 15 },{ wch: 12 },{ wch: 12 },{ wch: 20 },{ wch: 8 },{ wch: 8 },{ wch: 15 },{ wch: 25 }];
                worksheet['!cols'] = colWidths;
                XLSX.utils.book_append_sheet(workbook, worksheet, category);
            });
            XLSX.writeFile(workbook, `元器件库存_${new Date().toLocaleDateString()}.xlsx`);
            addActivity('导出Excel', `导出 ${Object.keys(componentsByCategory).length} 个分类标签页`);
        }

        // 导出选中器件
        function exportSelectedToExcel(selectedData) {
            const workbook = XLSX.utils.book_new();
            const componentsByCategory = {};
            selectedData.forEach(comp => {
                const category = comp.category || '未分类';
                if (!componentsByCategory[category]) componentsByCategory[category] = [];
                componentsByCategory[category].push(comp);
            });
            Object.entries(componentsByCategory).forEach(([category, comps]) => {
                const data = comps.map(comp => [comp.model, comp.name, comp.category, comp.function, comp.package, comp.marking, comp.spec, comp.stock, comp.minStock, comp.supplier, comp.notes]);
                const headers = ['型号', '名称', '分类', '功能', '封装', '丝印', '规格参数', '数量', '预警值', '供应商', '备注'];
                data.unshift(headers);
                const worksheet = XLSX.utils.aoa_to_sheet(data);
                XLSX.utils.book_append_sheet(workbook, worksheet, category);
            });
            XLSX.writeFile(workbook, `选中器件_${new Date().toLocaleDateString()}.xlsx`);
            addActivity('批量导出', `导出 ${selectedData.length} 个选中器件`);
        }

        // 导出为CSV
        function exportToCSV() {
            const headers = ['型号', '名称', '分类', '功能', '封装', '丝印', '规格参数', '数量', '预警值', '供应商', '备注', '位置'];
            const data = components.map(comp => [comp.model, comp.name, comp.category, comp.function, comp.package, comp.marking, comp.spec, comp.stock, comp.minStock, comp.supplier, comp.notes, comp.location]);
            const csvContent = [headers.join(','), ...data.map(row => row.map(cell => `"${cell}"`).join(','))].join('\n');
            const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `元器件库存_${new Date().toLocaleDateString()}.csv`;
            link.click();
            addActivity('导出CSV', '导出库存数据');
        }

        // 打印报告

                body { font-family: Arial, sans-serif; padding: 20px; } h1 { text-align: center; }

        function generateReport() {
            let html = `<h1>电子器件库存报告</h1><p>生成日期: ${new Date().toLocaleString('zh-CN')}</p>
                <p>总器件种类: ${components.length}</p><p>总库存数量: ${components.reduce((sum, comp) => sum + comp.stock, 0)}</p>
                <table><thead><tr><th>型号</th><th>名称</th><th>分类</th><th>封装</th><th>库存</th><th>位置</th><th>状态</th></tr></thead><tbody>`;
            components.forEach(comp => {
                const status = getStockStatus(comp);
                html += `<tr><td>${comp.model}</td><td>${comp.name}</td><td>${comp.category}</td><td>${comp.package || '-'}</td>
                    <td>${comp.stock}</td><td>${comp.location || '-'}</td><td>${status.text}</td></tr>`;
            });
            html += `</tbody></table>`;
            return html;
        }

        // 搜索器件
        function searchComponents() {
            searchQuery = document.getElementById('searchInput').value;
            updateComponentsList();
        }

        // 关闭模态框
        function closeModal() { document.getElementById('componentModal').style.display = 'none'; }

        // 更新库存概览
        function updateStockOverview() {
            const container = document.getElementById('stockOverview');
            const categoryCounts = {};
            categories.forEach(cat => categoryCounts[cat] = 0);
            components.forEach(comp => { if (categoryCounts[comp.category] !== undefined) categoryCounts[comp.category] += comp.stock; });
            let html = '';
            Object.entries(categoryCounts).forEach(([cat, count]) => {
                if (count > 0) {
                    const totalStock = components.reduce((sum, c) => sum + c.stock, 0);
                    const percentage = totalStock > 0 ? (count / totalStock) * 100 : 0;
                    html += `<div style="margin-bottom: 12px;"><div style="display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.9em;">
                        <span>${cat}</span><span style="font-weight: bold;">${count} 个</span></div>
                        <div class="stock-bar"><div class="stock-fill" style="width: ${percentage}%; background: #3498db;"></div></div></div>`;
                }
            });
            if (!html) html = '<div class="no-data" style="padding: 20px;">暂无数据</div>';
            container.innerHTML = html;
        }

        // 更新最近操作
        function updateRecentActivity() {
            const container = document.getElementById('recentActivity');
            const recent = recentActivities.slice(0, 5);
            if (recent.length === 0) { container.innerHTML = '<div class="no-data">暂无操作记录</div>'; return; }
            let html = '';
            recent.forEach(activity => {
                let icon = '📝';
                if (activity.action.includes('入库')) icon = '📥';
                else if (activity.action.includes('出库')) icon = '📤';
                else if (activity.action.includes('删除')) icon = '🗑️';
                else if (activity.action.includes('导入')) icon = '📥';
                else if (activity.action.includes('导出')) icon = '📤';
                html += `<div style="padding: 8px 0; border-bottom: 1px solid #eee; display: flex; align-items: start; font-size: 0.85em;">
                    <div style="margin-right: 8px; font-size: 1em;">${icon}</div>
                    <div style="flex: 1;"><div style="font-weight: 500;">${activity.action}</div>
                    <div style="color: #95a5a6; font-size: 0.9em;">${activity.details}</div></div>
                    <div style="color: #7f8c8d; white-space: nowrap; font-size: 0.8em;">${activity.timestamp.split(' ')[1]}</div></div>`;
            });
            container.innerHTML = html;
        }
