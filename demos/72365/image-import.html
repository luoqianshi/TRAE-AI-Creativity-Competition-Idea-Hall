<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled</title>
    <style id="theme-vars">
/* PDF Stamp Tool — Professional Tool Style (Dark + Light) */
/* Brand prefix: pst */

:root {
  /* === Semantic Tokens (Tailwind bridge) === */
  --pst-background: var(--pst-bg-primary);
  --pst-foreground: var(--pst-text-primary);
  --pst-primary: var(--pst-brand);
  --pst-primary-foreground: #FFFFFF;
  --pst-card: var(--pst-bg-card);
  --pst-card-foreground: var(--pst-text-primary);
  --pst-muted: var(--pst-bg-secondary);
  --pst-muted-foreground: var(--pst-text-secondary);
  --pst-accent: var(--pst-bg-tertiary);
  --pst-accent-foreground: var(--pst-text-primary);
  --pst-destructive: var(--pst-state-error);
  --pst-destructive-foreground: #FFFFFF;
  --pst-border: var(--pst-border-primary);
  --pst-input: var(--pst-bg-input);
  --pst-ring: var(--pst-brand);
  --pst-sidebar: var(--pst-bg-sidebar);
  --pst-sidebar-foreground: var(--pst-text-primary);
  --pst-sidebar-primary: var(--pst-brand);
  --pst-sidebar-primary-foreground: #FFFFFF;

  /* === Brand Primary === */
  --pst-brand: #4F8EF7;
  --pst-brand-hover: #3A7BE8;
  --pst-brand-muted: rgba(79, 142, 247, 0.15);
  --pst-brand-text: #4F8EF7;

  /* === Role Colors (stamp candidate highlighting) === */
  --pst-role-bidder: #4F8EF7;
  --pst-role-legal: #F25C54;
  --pst-role-agent: #2ECC71;
  --pst-role-global: #9B59B6;

  /* === Status Colors === */
  --pst-state-success: #2ECC71;
  --pst-state-warning: #F1C40F;
  --pst-state-error: #F25C54;
  --pst-state-info: #4F8EF7;

  /* === Typography === */
  --pst-font-sans: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --pst-font-mono: "JetBrains Mono", "Fira Code", "Consolas", monospace;
  --pst-font-size-xs: 11px;
  --pst-font-size-sm: 12px;
  --pst-font-size-base: 13px;
  --pst-font-size-md: 14px;
  --pst-font-size-lg: 16px;
  --pst-font-size-xl: 20px;
  --pst-font-size-2xl: 24px;
  --pst-line-height-tight: 1.25;
  --pst-line-height-normal: 1.5;

  /* === Spacing === */
  --pst-space-1: 4px;
  --pst-space-2: 8px;
  --pst-space-3: 12px;
  --pst-space-4: 16px;
  --pst-space-5: 20px;
  --pst-space-6: 24px;
  --pst-space-8: 32px;

  /* === Radius === */
  --pst-radius-sm: 2px;
  --pst-radius-md: 6px;
  --pst-radius-lg: 8px;
  --pst-radius-full: 9999px;

  /* === Shadows === */
  --pst-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  --pst-shadow-md: 0 2px 8px rgba(0, 0, 0, 0.04);
  --pst-shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.05);
  --pst-shadow-float: 0 8px 32px rgba(0, 0, 0, 0.25);

  /* === Transitions === */
  --pst-transition-fast: 150ms ease;
  --pst-transition-normal: 250ms ease;

  /* === Layout === */
  --pst-toolbar-height: 40px;
  --pst-sidebar-width: 220px;
  --pst-right-panel-width: 300px;
  --pst-statusbar-height: 26px;
}

/* === LIGHT MODE === */
html, html.light {
  --pst-bg-primary: #FFFFFF;
  --pst-bg-secondary: #F5F6F8;
  --pst-bg-tertiary: #EBEDF0;
  --pst-bg-hover: #E8EAF0;
  --pst-bg-active: #DCE0E8;
  --pst-bg-toolbar: #FAFBFC;
  --pst-bg-sidebar: #F7F8FA;
  --pst-bg-panel: #FFFFFF;
  --pst-bg-input: #FFFFFF;
  --pst-bg-overlay: rgba(0, 0, 0, 0.4);
  --pst-bg-tooltip: #1E1E2E;
  --pst-bg-badge: rgba(79, 142, 247, 0.12);
  --pst-bg-card: #FFFFFF;
  --pst-bg-viewport: #E0E2E8;
  --pst-bg-checkbox-bg: rgba(79, 142, 247, 0.1);

  --pst-border-primary: #D0D3DA;
  --pst-border-secondary: #E2E4EA;
  --pst-border-focus: #4F8EF7;
  --pst-border-divider: #E8EAF0;

  --pst-text-primary: #1E1E2E;
  --pst-text-secondary: #5A5E6B;
  --pst-text-tertiary: #8B8F99;
  --pst-text-inverse: #FFFFFF;
  --pst-text-brand: #4F8EF7;
  --pst-text-link: #4F8EF7;
  --pst-text-tooltip: #FFFFFF;

  --pst-scrollbar-track: #F0F1F3;
  --pst-scrollbar-thumb: #C4C7CF;
  --pst-scrollbar-thumb-hover: #A8ABB5;
}

/* === DARK MODE === */
html.dark {
  --pst-bg-primary: #1E1E2E;
  --pst-bg-secondary: #252536;
  --pst-bg-tertiary: #2D2D40;
  --pst-bg-hover: #32324A;
  --pst-bg-active: #3A3A52;
  --pst-bg-toolbar: #1A1A28;
  --pst-bg-sidebar: #1A1A28;
  --pst-bg-panel: #222236;
  --pst-bg-input: #2A2A3C;
  --pst-bg-overlay: rgba(0, 0, 0, 0.6);
  --pst-bg-tooltip: #2D2D40;
  --pst-bg-badge: rgba(79, 142, 247, 0.18);
  --pst-bg-card: #262638;
  --pst-bg-viewport: #181825;
  --pst-bg-checkbox-bg: rgba(79, 142, 247, 0.15);

  --pst-border-primary: #3A3A52;
  --pst-border-secondary: #32324A;
  --pst-border-focus: #4F8EF7;
  --pst-border-divider: #2E2E44;

  --pst-text-primary: #E0E0EC;
  --pst-text-secondary: #9B9FB0;
  --pst-text-tertiary: #6B6F80;
  --pst-text-inverse: #1E1E2E;
  --pst-text-brand: #6FA3F9;
  --pst-text-link: #6FA3F9;
  --pst-text-tooltip: #E0E0EC;

  --pst-scrollbar-track: #1E1E2E;
  --pst-scrollbar-thumb: #3A3A52;
  --pst-scrollbar-thumb-hover: #4A4A62;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--pst-background);
    --color-foreground: var(--pst-foreground);
    --color-card: var(--pst-card);
    --color-card-foreground: var(--pst-card-foreground);
    --color-primary: var(--pst-primary);
    --color-primary-foreground: var(--pst-primary-foreground);
    --color-muted: var(--pst-muted);
    --color-muted-foreground: var(--pst-muted-foreground);
    --color-accent: var(--pst-accent);
    --color-accent-foreground: var(--pst-accent-foreground);
    --color-destructive: var(--pst-destructive);
    --color-destructive-foreground: var(--pst-destructive-foreground);
    --color-border: var(--pst-border);
    --color-input: var(--pst-input);
    --color-ring: var(--pst-ring);
    --color-sidebar: var(--pst-sidebar);
    --color-sidebar-foreground: var(--pst-sidebar-foreground);
    --color-sidebar-primary: var(--pst-sidebar-primary);
    --color-sidebar-primary-foreground: var(--pst-sidebar-primary-foreground);
  }
  @layer base {
    body { background: var(--pst-background); color: var(--pst-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="flex items-center justify-center min-h-screen" style="background: var(--pst-bg-overlay);">
        <!-- Modal Container -->
        <div class="flex flex-col w-[480px] max-w-[calc(100vw-32px)] rounded-lg overflow-hidden" style="background: var(--pst-bg-panel); box-shadow: var(--pst-shadow-float); border: 1px solid var(--pst-border-primary);">

            <!-- Dialog Header -->
            <div class="flex items-start justify-between px-5 pt-4 pb-3" style="border-bottom: 1px solid var(--pst-border-divider);">
                <div class="flex-1 min-w-0">
                    <h1 class="truncate" style="font-size: var(--pst-font-size-lg); font-weight: 600; color: var(--pst-text-primary); line-height: var(--pst-line-height-tight);">导入图片</h1>
                    <p class="truncate" style="font-size: var(--pst-font-size-sm); color: var(--pst-text-tertiary); margin-top: var(--pst-space-1);">支持 PNG / JPG / BMP / GIF / TIFF / WEBP 格式</p>
                </div>
                <button class="flex items-center justify-center shrink-0 rounded" style="width: 28px; height: 28px; margin-left: var(--pst-space-3); color: var(--pst-text-tertiary); background: transparent; border: none; cursor: pointer; transition: color var(--pst-transition-fast), background var(--pst-transition-fast);" onmouseover="this.style.background='var(--pst-bg-hover)'" onmouseout="this.style.background='transparent'" aria-label="Close">
                    <i data-lucide="x" style="width: 16px; height: 16px;"></i>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="px-5 pt-4 pb-5 flex flex-col" style="gap: var(--pst-space-3);">

                <!-- Image Preview Area with Checkerboard -->
                <div class="flex items-center justify-center self-center rounded" style="width: 200px; height: 200px; border: 1px dashed var(--pst-border-primary); overflow: hidden; position: relative; background-color: #ffffff; background-image: linear-gradient(45deg, var(--pst-bg-secondary) 25%, transparent 25%), linear-gradient(-45deg, var(--pst-bg-secondary) 25%, transparent 25%), linear-gradient(45deg, transparent 75%, var(--pst-bg-secondary) 75%), linear-gradient(-45deg, transparent 75%, var(--pst-bg-secondary) 75%); background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0px;">
                    <!-- Simulated Red Seal -->
                    <div class="flex items-center justify-center rounded-full" style="width: 120px; height: 120px; border: 3px solid #C0392B; background: transparent; position: relative;">
                        <span class="truncate" style="font-size: 18px; font-weight: 700; color: #C0392B; text-align: center; line-height: 1.3; max-width: 100px; word-break: keep-all;">青岛仁拓</span>
                        <div style="position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 40px; height: 10px; border-top: 2px solid #C0392B; border-left: 1px solid #C0392B; border-right: 1px solid #C0392B; border-radius: 0 0 4px 4px;"></div>
                        <div style="position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 40px; height: 10px; border-bottom: 2px solid #C0392B; border-left: 1px solid #C0392B; border-right: 1px solid #C0392B; border-radius: 4px 4px 0 0;"></div>
                    </div>
                </div>

                <!-- File Path Input -->
                <div class="flex flex-col" style="gap: var(--pst-space-1);">
                    <label class="truncate" style="font-size: var(--pst-font-size-sm); color: var(--pst-text-secondary); font-weight: 500;">文件路径</label>
                    <div class="flex items-center" style="gap: var(--pst-space-2);">
                        <input type="text" readonly value="D:\印章\投标人公章.png" class="flex-1 min-w-0 rounded truncate" style="height: 32px; padding: 0 var(--pst-space-3); font-size: var(--pst-font-size-base); font-family: var(--pst-font-sans); color: var(--pst-text-primary); background: var(--pst-bg-input); border: 1px solid var(--pst-border-primary); outline: none; cursor: default;">
                        <button class="flex items-center justify-center shrink-0 rounded" style="height: 32px; padding: 0 var(--pst-space-3); font-size: var(--pst-font-size-sm); font-family: var(--pst-font-sans); font-weight: 500; color: var(--pst-text-primary); background: var(--pst-bg-tertiary); border: 1px solid var(--pst-border-primary); cursor: pointer; white-space: nowrap; transition: background var(--pst-transition-fast);" onmouseover="this.style.background='var(--pst-bg-hover)'" onmouseout="this.style.background='var(--pst-bg-tertiary)'">浏览...</button>
                    </div>
                </div>

                <!-- Image Name Input -->
                <div class="flex flex-col" style="gap: var(--pst-space-1);">
                    <label class="truncate" style="font-size: var(--pst-font-size-sm); color: var(--pst-text-secondary); font-weight: 500;">图片名称</label>
                    <input type="text" value="投标人公章" class="rounded" style="width: 100%; height: 32px; padding: 0 var(--pst-space-3); font-size: var(--pst-font-size-base); font-family: var(--pst-font-sans); color: var(--pst-text-primary); background: var(--pst-bg-input); border: 1px solid var(--pst-border-primary); outline: none; transition: border-color var(--pst-transition-fast);" onfocus="this.style.borderColor='var(--pst-border-focus)'" onblur="this.style.borderColor='var(--pst-border-primary)'">
                </div>

                <!-- Slot Assignment Dropdown -->
                <div class="flex flex-col" style="gap: var(--pst-space-1);">
                    <label class="truncate" style="font-size: var(--pst-font-size-sm); color: var(--pst-text-secondary); font-weight: 500;">槽位分配</label>
                    <div class="relative">
                        <select class="w-full rounded appearance-none" style="height: 32px; padding: 0 var(--pst-space-8) 0 var(--pst-space-3); font-size: var(--pst-font-size-base); font-family: var(--pst-font-sans); color: var(--pst-text-primary); background: var(--pst-bg-input); border: 1px solid var(--pst-border-primary); outline: none; cursor: pointer; transition: border-color var(--pst-transition-fast);" onfocus="this.style.borderColor='var(--pst-border-focus)'" onblur="this.style.borderColor='var(--pst-border-primary)'">
                            <option selected>投标人公章</option>
                            <option>法人公章</option>
                            <option>法人签名</option>
                            <option>授权代理人公章</option>
                            <option>授权代理人签名</option>
                        </select>
                        <i data-lucide="chevron-down" class="absolute" style="right: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--pst-text-tertiary); pointer-events: none;"></i>
                    </div>
                </div>

                <!-- Image Info Bar -->
                <div class="flex items-center flex-wrap rounded" style="padding: var(--pst-space-2) var(--pst-space-3); background: var(--pst-bg-secondary); gap: var(--pst-space-3); font-size: var(--pst-font-size-sm);">
                    <span style="color: var(--pst-text-secondary);">尺寸: <span style="color: var(--pst-text-primary); font-weight: 500;">256 × 256px</span></span>
                    <span style="color: var(--pst-border-primary);">|</span>
                    <span style="color: var(--pst-text-secondary);">DPI: <span style="color: var(--pst-text-primary); font-weight: 500;">300</span></span>
                    <span style="color: var(--pst-border-primary);">|</span>
                    <span style="color: var(--pst-text-secondary);">透明通道: <span style="color: var(--pst-state-success); font-weight: 500;">&#10003;</span></span>
                </div>

                <!-- Alpha Warning -->
                <div class="flex items-start rounded" style="padding: var(--pst-space-3); background: rgba(241, 196, 15, 0.12); border: 1px solid rgba(241, 196, 15, 0.3); gap: var(--pst-space-2);">
                    <i data-lucide="alert-triangle" class="shrink-0" style="width: 16px; height: 16px; color: #D4AC0D; margin-top: 1px;"></i>
                    <p class="truncate" style="font-size: var(--pst-font-size-sm); color: var(--pst-text-secondary); line-height: 1.5;">提示：该图片不包含透明通道（Alpha），盖章时可能遮挡文字内容。建议使用透明背景的 PNG 格式。</p>
                </div>
            </div>

            <!-- Dialog Footer -->
            <div class="flex items-center justify-end px-5 py-3" style="border-top: 1px solid var(--pst-border-divider); gap: var(--pst-space-3);">
                <button class="flex items-center justify-center rounded" style="height: 32px; padding: 0 var(--pst-space-4); font-size: var(--pst-font-size-md); font-family: var(--pst-font-sans); font-weight: 500; color: var(--pst-text-secondary); background: transparent; border: 1px solid var(--pst-border-primary); cursor: pointer; white-space: nowrap; transition: background var(--pst-transition-fast), border-color var(--pst-transition-fast), color var(--pst-transition-fast);" onmouseover="this.style.background='var(--pst-bg-hover)';this.style.borderColor='var(--pst-border-primary)'" onmouseout="this.style.background='transparent';this.style.borderColor='var(--pst-border-primary)'">取消</button>
                <button class="flex items-center justify-center rounded" style="height: 32px; padding: 0 var(--pst-space-4); font-size: var(--pst-font-size-md); font-family: var(--pst-font-sans); font-weight: 500; color: var(--pst-text-inverse); background: var(--pst-brand); border: 1px solid var(--pst-brand); cursor: pointer; white-space: nowrap; transition: background var(--pst-transition-fast);" onmouseover="this.style.background='var(--pst-brand-hover)'" onmouseout="this.style.background='var(--pst-brand)'">确认导入</button>
            </div>
        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
