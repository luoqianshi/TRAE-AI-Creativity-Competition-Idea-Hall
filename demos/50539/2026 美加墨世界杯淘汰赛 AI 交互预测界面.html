<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026美加墨世界杯淘汰赛赛程图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(160deg, #0b1a30 0%, #142952 40%, #0e2040 70%, #0a1628 100%);
            overflow: auto;
            min-height: 100vh;
            user-select: none;
        }
        #bracket-wrapper {
            position: relative;
            width: 100%;
            min-width: 1600px;
            height: 960px;
            margin: 0 auto;
        }
        /* 标题 */
        .title-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: none;
        }
        .title-bar h1 {
            color: rgba(255,255,255,0.35);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
        }
        /* 卡片 */
        .team-card {
            position: absolute;
            width: 132px;
            height: 36px;
            background: linear-gradient(135deg, #1a3560, #243f70);
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            z-index: 10;
            display: flex;
            align-items: center;
            padding: 3px 8px;
            transition: box-shadow 0.2s, border-color 0.2s;
        }
        .team-card.original {
            border: 2px solid #ffd700;
            cursor: copy;
        }
        .team-card.original .pinned-indicator { display: block; }
        .team-card.clone { cursor: grab; border: 2px solid #4caf50; }
        .team-card.clone.locked { border-color: #2196f3; cursor: default; }
        .team-card.clone.locked .pinned-indicator { display: block; background-color: #2196f3; }
        .team-card.clone:hover { border-color: #81c784; box-shadow: 0 2px 12px rgba(76,175,80,0.3); }
        .team-card.clone .clone-badge { display: flex; }
        .team-card.dragging { cursor: grabbing; z-index: 1000; opacity: 0.85; box-shadow: 0 8px 25px rgba(0,0,0,0.6); transform: scale(1.06); }
        .flag { width: 28px; height: 20px; margin-right: 6px; border-radius: 2px; overflow: hidden; flex-shrink: 0; }
        .flag img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .team-name { color: white; font-size: 13px; font-weight: 500; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* SVG连接线 */
        .connector-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        /* 控制按钮 */
        .controls { position: fixed; top: 12px; right: 12px; z-index: 10000; display: flex; flex-direction: column; gap: 6px; }
        .btn { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
        .btn-save { background: #2196f3; color: white; }
        .btn-undo { background: #ff9800; color: white; }
        .btn-reset { background: #ff5722; color: white; }
        .btn-clear { background: #9c27b0; color: white; }
        /* 提示面板 */
        .info-panel { position: absolute; background: rgba(0,0,0,0.7); color: white; padding: 10px 18px; border-radius: 7px; font-size: 12px; z-index: 10000; max-width: 400px; line-height: 1.8; backdrop-filter: blur(4px); text-align: center; }
        .info-panel .tip { color: #ffd700; font-weight: 600; }
        .info-panel .tip-red { color: #ff5722; font-weight: 600; }
        /* 标记 */
        .pinned-indicator { position: absolute; top: 2px; right: 2px; width: 4px; height: 4px; background: #ffd700; border-radius: 50%; display: none; }
        .clone-badge { display: none; position: absolute; top: 0; left: 1px; background: #4caf50; color: white; font-size: 7px; padding: 0 2px; border-radius: 1px; font-weight: 700; line-height: 14px; }
        .delete-hint { display: none; position: absolute; bottom: 0; right: 2px; color: rgba(255,255,255,0.25); font-size: 6px; }
        .team-card.clone:hover .delete-hint { display: block; }
        /* 轮次标签 */
        .round-label { position: absolute; color: rgba(255,255,255,0.22); font-size: 14px; font-weight: 700; pointer-events: none; z-index: 2; text-align: center; width: 132px; letter-spacing: 3px; }
        .final-label { position: absolute; color: rgba(255,215,0,0.4); font-size: 16px; font-weight: 900; pointer-events: none; z-index: 2; text-align: center; letter-spacing: 4px; }
        /* 空位框 */
        .empty-slot { position: absolute; width: 132px; height: 36px; border: 1.5px dashed rgba(255,255,255,0.2); border-radius: 5px; background: rgba(255,255,255,0.03); pointer-events: none; z-index: 5; }
        .match-box { position: absolute; width: 132px; border: 1px solid rgba(255,255,255,0.1); border-radius: 7px; background: rgba(255,255,255,0.02); pointer-events: none; z-index: 4; }
        .final-slot { position: absolute; width: 132px; height: 36px; border: 1.5px dashed rgba(255,215,0,0.2); border-radius: 5px; background: rgba(255,215,0,0.02); pointer-events: none; z-index: 5; }
    </style>
</head>
<body>
    <div id="bracket-wrapper">
        <div class="title-bar"><h1>⚽ 2026 FIFA World Cup · 淘汰赛</h1></div>
        <svg class="connector-svg" id="connectors"></svg>
        <div class="info-panel" id="info-panel">
            <strong>操作：</strong><br>
            <span class="tip">拖动金色卡片</span> → 复制晋级<br>
            <span class="tip">绿色副本</span> → 也可拖动复制<br>
            <span class="tip-red">右键副本</span> → 删除<br>
            <span class="tip-red">双击空白</span> → 撤销<br>
            <span class="tip">💾 保存</span> → 下次自动恢复
        </div>
    </div>
    <div class="controls">
        <button class="btn btn-save" onclick="saveState()">💾 保存</button>
        <button class="btn btn-undo" onclick="undoLast()">↩ 撤销</button>
        <button class="btn btn-clear" onclick="clearAllClones()">🗑 清除</button>
        <button class="btn btn-reset" onclick="resetAll()">↺ 重置</button>
    </div>
    <script>
        const wrapper = document.getElementById('bracket-wrapper');
        const svg = document.getElementById('connectors');
        let isDragging = false, dragTarget = null, dragOffsetX = 0, dragOffsetY = 0, cloneCounter = 0;
        const historyStack = [];
        const SAVE_KEY = 'wc2026_bracket_v2';

        // ===== 布局参数（重新设计） =====
        const CW = 132, CH = 36, GAP = 4;
        const CANVAS_W = 1600, CANVAS_H = 960;
        const TITLE_H = 36;
        const TOP_MARGIN = TITLE_H + 12;
        const CENTER_X = CANVAS_W / 2; // 800
        const SIDE_PAD = 16;
        // 对称布局：每半区4列(32/16/8/4强)，中央决赛
        // 每半区可用空间 = CENTER_X - SIDE_PAD = 784
        // 4个卡片宽 = 4*124 = 496
        // 3个间距 = 784 - 496 - 决赛半边距 = 784 - 496 - 100 = 188
        // 决赛半边距 = 决赛卡片宽度/2 + 间距 = 62+38 = 100
        const FINAL_HALF_PAD = 100; // 决赛位到最近列的距离
        const TOTAL_SEMI_GAP = CENTER_X - SIDE_PAD - 4 * CW - FINAL_HALF_PAD; // 188
        // 间距递减（外宽内窄）: [3.8, 2.8, 1.4] = 8.0
        const GAP_W = [3.8, 2.8, 1.4];
        const GW_T = GAP_W.reduce((a, b) => a + b, 0); // 8.0
        const GAP_U = TOTAL_SEMI_GAP / GW_T; // ~27.25

        const LEFT_X = [], RIGHT_X = [];
        for (let i = 0; i < 4; i++) {
            let x = SIDE_PAD + i * CW;
            for (let j = 0; j < i; j++) x += GAP_U * GAP_W[j];
            LEFT_X[i] = Math.round(x);
            RIGHT_X[i] = CANVAS_W - CW - LEFT_X[i]; // 完美镜像
        }
        LEFT_X.push(Math.round(CENTER_X - CW / 2));
        RIGHT_X.push(Math.round(CENTER_X - CW / 2));

        // Y轴布局
        const AREA_H = CANVAS_H - TOP_MARGIN - 20; // 960 - 48 - 20 = 892
        const NUM_MATCHES_R0 = 8; // 32强有8场对决
        const MATCH_H = AREA_H / NUM_MATCHES_R0; // 每场对决的垂直空间 = ~111.5

        function getSlotY(round, matchIdx, pos) {
            // round: 0=32强(8场), 1=16强(4场), 2=8强(2场), 3=4强(1场), 4=决赛(不需要pos)
            const blockH = MATCH_H * Math.pow(2, round);
            const blockY = TOP_MARGIN + matchIdx * blockH;
            const midY = blockY + blockH / 2;
            return midY + (pos === 0 ? -1 : 1) * (CH / 2 + GAP / 2);
        }

        // ===== 32支球队 =====
        const leftTeams = [
            { id: 'la1', name: '巴西', flag: 'br', mi: 0, pos: 0 },
            { id: 'la2', name: '日本', flag: 'jp', mi: 0, pos: 1 },
            { id: 'lb1', name: '科特迪瓦', flag: 'ci', mi: 1, pos: 0 },
            { id: 'lb2', name: '挪威', flag: 'no', mi: 1, pos: 1 },
            { id: 'lc1', name: '墨西哥', flag: 'mx', mi: 2, pos: 0 },
            { id: 'lc2', name: '厄瓜多尔', flag: 'ec', mi: 2, pos: 1 },
            { id: 'ld1', name: '英格兰', flag: 'gb-eng', mi: 3, pos: 0 },
            { id: 'ld2', name: '刚果(金)', flag: 'cd', mi: 3, pos: 1 },
            { id: 'le1', name: '阿根廷', flag: 'ar', mi: 4, pos: 0 },
            { id: 'le2', name: '佛得角', flag: 'cv', mi: 4, pos: 1 },
            { id: 'lf1', name: '澳大利亚', flag: 'au', mi: 5, pos: 0 },
            { id: 'lf2', name: '埃及', flag: 'eg', mi: 5, pos: 1 },
            { id: 'lg1', name: '瑞士', flag: 'ch', mi: 6, pos: 0 },
            { id: 'lg2', name: '阿尔及利亚', flag: 'dz', mi: 6, pos: 1 },
            { id: 'lh1', name: '哥伦比亚', flag: 'co', mi: 7, pos: 0 },
            { id: 'lh2', name: '加纳', flag: 'gh', mi: 7, pos: 1 },
        ];
        const rightTeams = [
            { id: 'ra1', name: '德国', flag: 'de', mi: 0, pos: 0 },
            { id: 'ra2', name: '巴拉圭', flag: 'py', mi: 0, pos: 1 },
            { id: 'rb1', name: '法国', flag: 'fr', mi: 1, pos: 0 },
            { id: 'rb2', name: '瑞典', flag: 'se', mi: 1, pos: 1 },
            { id: 'rc1', name: '南非', flag: 'za', mi: 2, pos: 0 },
            { id: 'rc2', name: '加拿大', flag: 'ca', mi: 2, pos: 1 },
            { id: 'rd1', name: '荷兰', flag: 'nl', mi: 3, pos: 0 },
            { id: 'rd2', name: '摩洛哥', flag: 'ma', mi: 3, pos: 1 },
            { id: 're1', name: '葡萄牙', flag: 'pt', mi: 4, pos: 0 },
            { id: 're2', name: '克罗地亚', flag: 'hr', mi: 4, pos: 1 },
            { id: 'rf1', name: '西班牙', flag: 'es', mi: 5, pos: 0 },
            { id: 'rf2', name: '奥地利', flag: 'at', mi: 5, pos: 1 },
            { id: 'rg1', name: '美国', flag: 'us', mi: 6, pos: 0 },
            { id: 'rg2', name: '波黑', flag: 'ba', mi: 6, pos: 1 },
            { id: 'rh1', name: '比利时', flag: 'be', mi: 7, pos: 0 },
            { id: 'rh2', name: '塞内加尔', flag: 'sn', mi: 7, pos: 1 },
        ];

        // ===== 保存/加载 =====
        function saveState() {
            const clones = [];
            document.querySelectorAll('.team-card.clone').forEach(c => {
                clones.push({ id: c.id, name: c.dataset.teamName, flag: c.dataset.teamFlag, x: parseFloat(c.style.left), y: parseFloat(c.style.top), locked: c.classList.contains('locked') });
            });
            localStorage.setItem(SAVE_KEY, JSON.stringify({ clones, cloneCounter }));
            showToast('已保存！');
        }
        function loadState() {
            const raw = localStorage.getItem(SAVE_KEY);
            if (!raw) return false;
            try {
                const state = JSON.parse(raw);
                if (!state.clones || !state.clones.length) return false;
                state.clones.forEach(d => {
                    const c = document.createElement('div');
                    c.className = 'team-card clone' + (d.locked ? ' locked' : '');
                    c.id = d.id; c.style.left = d.x + 'px'; c.style.top = d.y + 'px';
                    c.dataset.teamName = d.name; c.dataset.teamFlag = d.flag;
                    c.innerHTML = cardHTML(d.flag, d.name);
                    c.addEventListener('mousedown', startDragClone);
                    c.addEventListener('touchstart', startDragClone, {passive:false});
                    c.addEventListener('contextmenu', delClone);
                    wrapper.appendChild(c);
                });
                cloneCounter = state.cloneCounter || state.clones.length;
                return true;
            } catch(e) { return false; }
        }

        // ===== 撤销 =====
        function pushHistory(action, data) { historyStack.push({ action, data }); }
        function undoLast() {
            if (!historyStack.length) { showToast('无可撤销'); return; }
            const last = historyStack.pop();
            if (last.action === 'add') {
                const el = document.getElementById(last.data.id);
                if (el) { el.style.transition='all 0.2s'; el.style.transform='scale(0.5)'; el.style.opacity='0'; setTimeout(()=>el.remove(),200); }
            } else if (last.action === 'move') {
                const el = document.getElementById(last.data.id);
                if (el) { el.style.left = last.data.oldX+'px'; el.style.top = last.data.oldY+'px'; }
            } else if (last.action === 'delete') {
                const c = document.createElement('div');
                c.className = 'team-card clone'; c.id = last.data.id;
                c.style.left = last.data.x+'px'; c.style.top = last.data.y+'px';
                c.dataset.teamName = last.data.name; c.dataset.teamFlag = last.data.flag;
                c.innerHTML = cardHTML(last.data.flag, last.data.name);
                c.addEventListener('mousedown', startDragClone);
                c.addEventListener('touchstart', startDragClone, {passive:false});
                c.addEventListener('contextmenu', delClone);
                wrapper.appendChild(c);
            }
            showToast('已撤销');
        }
        function showToast(msg) {
            let t = document.getElementById('toast');
            if (!t) { t = document.createElement('div'); t.id = 'toast'; t.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:white;padding:12px 28px;border-radius:8px;font-size:14px;font-weight:600;z-index:99999;pointer-events:none;transition:all 0.3s;opacity:0;'; document.body.appendChild(t); }
            t.textContent = msg; t.style.opacity = '1'; clearTimeout(t._timer); t._timer = setTimeout(() => t.style.opacity = '0', 1200);
        }

        // ===== 辅助 =====
        function cardHTML(flag, name) {
            return `<div class="pinned-indicator"></div><div class="clone-badge">晋级</div><div class="flag"><img src="https://flagcdn.com/w80/${flag}.png" alt="${name}"></div><div class="team-name">${name}</div><div class="delete-hint">右键删除</div>`;
        }

        // ===== 布局初始化 =====
        function initLayout() {
            const hasCards = document.querySelectorAll('.team-card.original').length > 0;
            if (!hasCards) {
                [...leftTeams, ...rightTeams].forEach(t => {
                    const isLeft = t.id.startsWith('l');
                    wrapper.appendChild(makeCard(t, isLeft ? LEFT_X[0] : RIGHT_X[0], getSlotY(0, t.mi, t.pos)));
                });
                loadState();
            } else {
                [...leftTeams, ...rightTeams].forEach(t => {
                    const card = document.getElementById(t.id);
                    if (!card) return;
                    const isLeft = t.id.startsWith('l');
                    card.style.left = (isLeft ? LEFT_X[0] : RIGHT_X[0]) + 'px';
                    card.style.top = getSlotY(0, t.mi, t.pos) + 'px';
                });
            }
            drawLabels();
            drawConnectors();
            drawEmptySlots();
        }

        function drawEmptySlots() {
            document.querySelectorAll('.empty-slot,.match-box,.final-slot').forEach(e => e.remove());
            // 16强(8对)、8强(4对)、4强(2对) 的空位框
            for (let round = 1; round <= 3; round++) {
                const matches = Math.pow(2, 3 - round);
                for (let m = 0; m < matches; m++) {
                    const y1 = getSlotY(round, m, 0);
                    const y2 = getSlotY(round, m, 1);
                    addEmptySlot(LEFT_X[round], y1);
                    addEmptySlot(LEFT_X[round], y2);
                    addEmptySlot(RIGHT_X[round], y1);
                    addEmptySlot(RIGHT_X[round], y2);
                    addMatchBox(LEFT_X[round], y1, y2 + CH - y1);
                    addMatchBox(RIGHT_X[round], y1, y2 + CH - y1);
                }
            }
            // 中央区域：冠军、亚军、季军 空位（各一个）
            const centerY = CANVAS_H / 2;
            const slotGap = CH + 36;
            const startY = centerY - (2 * slotGap) / 2; // 3个槽位居中
            for (let i = 0; i < 3; i++) {
                const slotY = Math.round(startY + i * slotGap);
                addFinalSlot(LEFT_X[4], slotY);
            }
        }
        function addEmptySlot(x, y) {
            const el = document.createElement('div'); el.className = 'empty-slot';
            el.style.left = x + 'px'; el.style.top = y + 'px'; wrapper.appendChild(el);
        }
        function addFinalSlot(x, y) {
            const el = document.createElement('div'); el.className = 'final-slot';
            el.style.left = x + 'px'; el.style.top = y + 'px'; wrapper.appendChild(el);
        }
        function addMatchBox(x, y, h) {
            const el = document.createElement('div'); el.className = 'match-box';
            el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.height = h + 'px'; wrapper.appendChild(el);
        }

        function drawLabels() {
            document.querySelectorAll('.round-label,.final-label').forEach(e => e.remove());
            const labels = ['32强', '16强', '8强', '4强'];
            labels.forEach((lbl, i) => {
                addLabel(lbl, LEFT_X[i], TOP_MARGIN - 2);
                addLabel(lbl, RIGHT_X[i], TOP_MARGIN - 2);
            });
            // 中央标签：冠军、亚军、季军（放在各自槽位上方）
            const centerY = CANVAS_H / 2;
            const slotGap = CH + 36;
            const startY = centerY - (2 * slotGap) / 2;
            const finalLabels = ['🏆 冠军', '🥈 亚军', '🥉 季军'];
            finalLabels.forEach((lbl, i) => {
                const slotY = Math.round(startY + i * slotGap);
                const labelY = slotY - 20;
                const labelX = LEFT_X[4] + CW/2 - 38;
                addFinalLabel(lbl, labelX, labelY);
            });
            // 操作说明放在季军槽位正下方，与决赛列对齐
            const panel = document.getElementById('info-panel');
            if (panel) {
                const thirdSlotY = Math.round(startY + 2 * slotGap) + CH;
                panel.style.top = (thirdSlotY + 16) + 'px';
                panel.style.left = (LEFT_X[4] + CW/2) + 'px';
                panel.style.transform = 'translateX(-50%)';
            }
        }
        function addLabel(text, x, y) {
            const el = document.createElement('div'); el.className = 'round-label';
            el.textContent = text; el.style.left = x + 'px'; el.style.top = y + 'px';
            wrapper.appendChild(el);
        }
        function addFinalLabel(text, x, y) {
            const el = document.createElement('div'); el.className = 'final-label';
            el.textContent = text; el.style.left = x + 'px'; el.style.top = y + 'px';
            wrapper.appendChild(el);
        }

        // ===== 连接线绘制 =====
        function drawConnectors() {
            svg.innerHTML = '';
            svg.setAttribute('width', CANVAS_W);
            svg.setAttribute('height', CANVAS_H);
            const c = 'rgba(255,255,255,0.3)', lw = 1.5;
            const cFinal = 'rgba(255,215,0,0.5)';

            // 左半区 + 右半区各4轮连接线 (round 0→1, 1→2, 2→3)
            for (let round = 0; round < 3; round++) {
                const n = Math.pow(2, 3 - round); // 8,4,2
                for (let m = 0; m < n; m++) {
                    drawBracketBranch(round, m, 'left', c, lw);
                    drawBracketBranch(round, m, 'right', c, lw);
                }
            }
            // 4强→决赛
            drawSemiToFinal('left', cFinal, lw);
            drawSemiToFinal('right', cFinal, lw);
            // 4强→季军（两场半决赛的负者）
            drawSemiToThird('left', cFinal, lw);
            drawSemiToThird('right', cFinal, lw);
        }

        function drawBracketBranch(round, m, side, color, lw) {
            const X = side === 'left' ? LEFT_X : RIGHT_X;
            // 当前轮次右侧边缘X
            const cardRight = side === 'left' ? X[round] + CW : X[round];
            // 下一轮次卡片靠近当前侧的边缘X
            const nextEdge = side === 'left' ? X[round + 1] : X[round + 1] + CW;

            const t1Y = getSlotY(round, m, 0) + CH / 2;
            const t2Y = getSlotY(round, m, 1) + CH / 2;
            const midY = Math.round((t1Y + t2Y) / 2);

            // 汇合点X：两列之间的中点
            const jX = Math.round((cardRight + nextEdge) / 2);

            // 下一轮目标Y
            const nm = Math.floor(m / 2);
            const nPos = m % 2;
            const nY = getSlotY(round + 1, nm, nPos) + CH / 2;

            // 队伍1 → 水平到汇合点
            path(`M${cardRight} ${t1Y} H${jX}`, color, lw);
            // 队伍2 → 水平到汇合点
            path(`M${cardRight} ${t2Y} H${jX}`, color, lw);
            // 垂直汇合线
            path(`M${jX} ${t1Y} V${t2Y}`, color, lw);
            // 汇合点中心 → 水平到下一轮 → 垂直到目标Y（折线）
            path(`M${jX} ${midY} H${nextEdge} V${nY}`, color, lw);
        }

        function drawSemiToFinal(side, color, lw) {
            const X = side === 'left' ? LEFT_X : RIGHT_X;
            const t1Y = getSlotY(3, 0, 0) + CH / 2;
            const t2Y = getSlotY(3, 0, 1) + CH / 2;
            const midY = Math.round((t1Y + t2Y) / 2);

            const cardRight = side === 'left' ? X[3] + CW : X[3];
            const finalSlotX = LEFT_X[4];
            const toX = side === 'left' ? finalSlotX : finalSlotX + CW;

            const jX = Math.round((cardRight + toX) / 2);

            // 冠军位Y（中央第1个槽位）
            const centerY = CANVAS_H / 2;
            const slotGap = CH + 36;
            const championY = Math.round(centerY - (2 * slotGap) / 2) + CH / 2;

            // 水平线
            path(`M${cardRight} ${t1Y} H${jX}`, color, lw);
            path(`M${cardRight} ${t2Y} H${jX}`, color, lw);
            // 垂直汇合
            path(`M${jX} ${t1Y} V${t2Y}`, color, lw);
            // 到冠军位（折线）
            path(`M${jX} ${midY} H${toX} V${championY}`, color, lw);
        }

        function drawSemiToThird(side, color, lw) {
            const X = side === 'left' ? LEFT_X : RIGHT_X;
            const t1Y = getSlotY(3, 0, 0) + CH / 2;
            const t2Y = getSlotY(3, 0, 1) + CH / 2;
            const midY = Math.round((t1Y + t2Y) / 2);

            const cardRight = side === 'left' ? X[3] + CW : X[3];
            const thirdSlotX = LEFT_X[4];
            const toX = side === 'left' ? thirdSlotX : thirdSlotX + CW;

            const jX = Math.round((cardRight + toX) / 2);

            // 季军位Y（中央第3个槽位）
            const centerY = CANVAS_H / 2;
            const slotGap = CH + 36;
            const thirdSlotY = Math.round(centerY - (2 * slotGap) / 2 + 2 * slotGap) + CH / 2;

            // 水平线
            path(`M${cardRight} ${t1Y} H${jX}`, color, lw);
            path(`M${cardRight} ${t2Y} H${jX}`, color, lw);
            // 垂直汇合
            path(`M${jX} ${t1Y} V${t2Y}`, color, lw);
            // 到季军位（折线）
            path(`M${jX} ${midY} H${toX} V${thirdSlotY}`, color, lw);
        }

        function path(d, c, w) {
            const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            p.setAttribute('d', d); p.setAttribute('stroke', c); p.setAttribute('stroke-width', w);
            p.setAttribute('fill', 'none'); p.setAttribute('stroke-linecap', 'round'); svg.appendChild(p);
        }

        // ===== 卡片创建 =====
        function makeCard(team, x, y) {
            const card = document.createElement('div'); card.className = 'team-card original'; card.id = team.id;
            card.style.left = x + 'px'; card.style.top = y + 'px';
            card.dataset.originalX = x; card.dataset.originalY = y;
            card.dataset.teamName = team.name; card.dataset.teamFlag = team.flag;
            card.innerHTML = cardHTML(team.flag, team.name);
            card.addEventListener('mousedown', startDragOrig);
            card.addEventListener('touchstart', startDragOrig, {passive:false});
            return card;
        }
        function makeClone(src, x, y) {
            cloneCounter++;
            const c = document.createElement('div'); c.className = 'team-card clone'; c.id = 'clone_' + cloneCounter;
            c.style.left = x + 'px'; c.style.top = y + 'px';
            c.dataset.teamName = src.dataset.teamName || src.name;
            c.dataset.teamFlag = src.dataset.teamFlag || src.flag;
            c.innerHTML = cardHTML(c.dataset.teamFlag, c.dataset.teamName);
            c.addEventListener('mousedown', startDragClone);
            c.addEventListener('touchstart', startDragClone, {passive:false});
            c.addEventListener('contextmenu', delClone);
            wrapper.appendChild(c);
            return c;
        }
        function makeCloneFromCard(src, x, y) { return makeClone(src, x, y); }

        // ===== 拖拽系统 =====
        let dragStartX, dragStartY;
        function startDragOrig(e) {
            if (e.button === 2) return; e.preventDefault();
            const src = e.currentTarget;
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            const wr = wrapper.getBoundingClientRect();
            const sx = cx + window.scrollX - wr.left - CW/2, sy = cy + window.scrollY - wr.top - CH/2;
            const cl = makeClone(src, sx, sy);
            isDragging = true; dragTarget = cl; dragStartX = sx; dragStartY = sy;
            cl.classList.add('dragging'); dragOffsetX = CW/2; dragOffsetY = CH/2;
        }
        function startDragClone(e) {
            if (e.button === 2) return; e.preventDefault();
            const src = e.currentTarget;
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            const wr = wrapper.getBoundingClientRect();
            const sx = cx + window.scrollX - wr.left - CW/2, sy = cy + window.scrollY - wr.top - CH/2;
            const cl = makeCloneFromCard(src, sx, sy);
            isDragging = true; dragTarget = cl; dragStartX = sx; dragStartY = sy;
            cl.classList.add('dragging'); dragOffsetX = CW/2; dragOffsetY = CH/2;
        }
        function delClone(e) {
            e.preventDefault(); e.stopPropagation();
            const c = e.currentTarget;
            pushHistory('delete', { id: c.id, name: c.dataset.teamName, flag: c.dataset.teamFlag, x: parseFloat(c.style.left), y: parseFloat(c.style.top) });
            c.style.transition = 'transform 0.2s,opacity 0.2s'; c.style.transform = 'scale(0.5)'; c.style.opacity = '0';
            setTimeout(() => c.remove(), 200);
        }
        document.addEventListener('mousemove', onDrag);
        document.addEventListener('touchmove', onDrag, {passive:false});
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);
        function onDrag(e) {
            if (!isDragging || !dragTarget) return; e.preventDefault();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            const wr = wrapper.getBoundingClientRect();
            dragTarget.style.left = (cx + window.scrollX - wr.left - dragOffsetX) + 'px';
            dragTarget.style.top = (cy + window.scrollY - wr.top - dragOffsetY) + 'px';
        }
        function endDrag() {
            if (!dragTarget) { isDragging = false; return; }
            dragTarget.classList.remove('dragging');
            snapToSlot(dragTarget);
            if (!historyStack.some(h => h.data && h.data.id === dragTarget.id)) pushHistory('add', { id: dragTarget.id });
            isDragging = false; dragTarget = null;
        }
        function snapToSlot(card) {
            if (!card.classList.contains('clone')) return;
            const cx = parseFloat(card.style.left) + CW/2, cy = parseFloat(card.style.top) + CH/2;
            const slots = document.querySelectorAll('.empty-slot, .final-slot');
            let bestSlot = null, bestDist = 60;
            slots.forEach(slot => {
                const sx = parseFloat(slot.style.left) + CW/2, sy = parseFloat(slot.style.top) + CH/2;
                const dist = Math.sqrt((cx-sx)**2 + (cy-sy)**2);
                if (dist < bestDist) { bestDist = dist; bestSlot = slot; }
            });
            if (bestSlot) {
                card.style.transition = 'left 0.15s, top 0.15s';
                card.style.left = bestSlot.style.left; card.style.top = bestSlot.style.top;
                setTimeout(() => card.style.transition = '', 150);
            }
        }
        wrapper.addEventListener('dblclick', function(e) {
            if (!e.target.closest('.team-card.clone')) { undoLast(); }
        });
        function clearAllClones() {
            document.querySelectorAll('.team-card.clone').forEach((c, i) => {
                pushHistory('delete', { id: c.id, name: c.dataset.teamName, flag: c.dataset.teamFlag, x: parseFloat(c.style.left), y: parseFloat(c.style.top) });
                c.style.transition = 'transform 0.3s,opacity 0.3s'; c.style.transitionDelay = (i*20)+'ms';
                c.style.transform = 'scale(0.3)'; c.style.opacity = '0';
                setTimeout(() => c.remove(), 300+i*20);
            });
            localStorage.removeItem(SAVE_KEY);
        }
        function resetAll() { clearAllClones(); historyStack.length = 0; setTimeout(initLayout, 400); }
        initLayout();
        if (document.querySelectorAll('.team-card.clone').length > 0) showToast('已恢复上次保存');
    </script>
</body>
</html>
