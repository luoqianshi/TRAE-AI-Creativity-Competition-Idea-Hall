<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闽超进校园・厦门大学足球友谊赛 - 现场抽奖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255, 100, 50, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 180, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 0, 0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .header {
            text-align: center;
            padding: 30px 20px;
            position: relative;
            z-index: 10;
        }

        .title {
            font-size: 48px;
            font-weight: bold;
            background: linear-gradient(90deg, #ff6b35, #f7c59f, #ffd23f, #ff6b35);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientText 3s linear infinite;
            text-shadow: 0 0 30px rgba(255, 107, 53, 0.5);
            letter-spacing: 8px;
            font-family: 'STKaiti', 'KaiTi', serif;
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 10px;
            letter-spacing: 4px;
        }

        .main-content {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            gap: 40px;
            position: relative;
            z-index: 10;
            flex-wrap: wrap;
        }

        .prize-section {
            width: 280px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .prize-section:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-5px);
        }

        .prize-image-container {
            width: 100%;
            height: 200px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .prize-icon {
            font-size: 80px;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
        }

        .prize-title {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 5px;
        }

        .prize-name {
            font-size: 16px;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 15px;
        }

        .prize-count {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
        }

        .lottery-section {
            flex: 1;
            min-width: 400px;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .round-info {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .round-btn {
            padding: 8px 24px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            border: none;
            cursor: not-allowed;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .round-btn.active {
            background: linear-gradient(135deg, #ff6b35, #ffd23f);
            color: #1a1a2e;
            font-weight: bold;
            cursor: default;
        }

        .round-btn.passed {
            background: rgba(0, 255, 100, 0.2);
            color: rgba(0, 255, 100, 0.8);
            cursor: default;
        }

        .ticket-display {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            min-height: 200px;
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
        }

        .ticket-item {
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.2);
            animation: ticketAppear 0.5s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        @keyframes ticketAppear {
            0% {
                transform: scale(0) rotate(-180deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }

        .ticket-item.rolling {
            animation: ticketRoll 0.1s linear infinite;
            background: linear-gradient(145deg, #ff6b35, #ffd23f);
            color: #1a1a2e;
            border-color: #fff;
        }

        @keyframes ticketRoll {
            0% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0); }
        }

        .ticket-number {
            font-size: 28px;
        }

        .ticket-label {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 2px;
        }

        .control-section {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .lottery-btn {
            padding: 18px 60px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .lottery-btn.start {
            background: linear-gradient(135deg, #00e5ff, #00b894);
            color: #fff;
        }

        .lottery-btn.start:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 229, 255, 0.4);
        }

        .lottery-btn.start:active {
            transform: translateY(0);
        }

        .lottery-btn.rolling {
            background: linear-gradient(135deg, #ff6b35, #ffd23f);
            color: #1a1a2e;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .lottery-btn.disabled {
            background: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.5);
            cursor: not-allowed;
        }

        .next-round-btn {
            padding: 14px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .next-round-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .winners-panel {
            width: 100%;
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .winners-title {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 2px;
        }

        .winners-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .winner-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .winner-group:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .winner-group-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            width: 100%;
            margin-bottom: 10px;
        }

        .winner-ticket {
            padding: 5px 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .winner-ticket:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .winner-ticket.selected {
            background: rgba(255, 100, 100, 0.3);
            border-color: #ff4444;
            color: #ff6666;
            text-decoration: line-through;
        }

        .winner-ticket.voided {
            background: rgba(255, 50, 50, 0.15);
            color: rgba(255, 100, 100, 0.6);
            text-decoration: line-through;
            cursor: not-allowed;
        }

        .winner-ticket.replaced {
            background: rgba(0, 200, 100, 0.2);
            border-color: #00c864;
            color: #00ff88;
            position: relative;
        }

        .winner-ticket.replaced::after {
            content: '重抽';
            position: absolute;
            top: -8px;
            right: -8px;
            font-size: 10px;
            padding: 2px 6px;
            background: #00c864;
            color: #1a1a2e;
            border-radius: 10px;
        }

        .void-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .void-btn {
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 25px;
            border: 2px solid #ff4444;
            background: transparent;
            color: #ff4444;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .void-btn:hover:not(.disabled) {
            background: rgba(255, 68, 68, 0.2);
            transform: translateY(-2px);
        }

        .void-btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .void-btn.active {
            background: linear-gradient(135deg, #ff4444, #ff6666);
            color: #fff;
        }

        .void-count {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .footer {
            text-align: center;
            padding: 30px 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            position: relative;
            z-index: 10;
        }

        .fireworks {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 100;
        }

        .firework {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: explode 1s ease-out forwards;
        }

        @keyframes explode {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(30);
                opacity: 0;
            }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff6b35;
            animation: fall 3s linear forwards;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        @media (max-width: 900px) {
            .main-content {
                flex-direction: column;
                align-items: center;
            }
            
            .prize-section {
                width: 100%;
                max-width: 400px;
            }
            
            .lottery-section {
                min-width: 100%;
                padding: 20px;
            }
            
            .title {
                font-size: 32px;
                letter-spacing: 4px;
            }

            .ticket-item {
                width: 70px;
                height: 70px;
            }

            .ticket-number {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="header">
        <h1 class="title">闽超进厦大友谊赛</h1>
        <p class="subtitle">现场抽奖互动</p>
    </div>

    <div class="main-content">
        <div class="prize-section" id="prize-section">
            <div class="prize-image-container">
                <div class="prize-icon" id="prize-icon">🥤</div>
            </div>
            <h2 class="prize-title" id="prize-title" style="color: #ffd23f;">三等奖</h2>
            <p class="prize-name" id="prize-name">厦大文创水杯</p>
            <p class="prize-count" id="prize-count">本轮名额：12名</p>
        </div>

        <div class="lottery-section">
            <div class="round-info">
                <button class="round-btn active" id="round1-btn">第一轮</button>
                <button class="round-btn" id="round2-btn">第二轮</button>
                <button class="round-btn" id="round3-btn">第三轮</button>
            </div>

            <div class="ticket-display" id="ticket-display">
                <div style="color: rgba(255,255,255,0.5); font-size: 18px; margin-top: 60px;">点击下方按钮开始抽奖</div>
            </div>

            <div class="control-section">
                <button class="lottery-btn start" id="lottery-btn">开始抽奖</button>
                <button class="next-round-btn" id="next-round-btn" style="display: none;">下一轮</button>
            </div>
        </div>
    </div>

    <div class="winners-panel" id="winners-panel">
        <div class="void-panel">
            <h3 class="winners-title">🎉 中奖名单汇总</h3>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span class="void-count" id="void-count">已选择 0 个号码</span>
                <button class="void-btn disabled" id="void-btn">作废重抽</button>
            </div>
        </div>
        <div class="winners-container" id="winners-container">
            <div class="winner-group">
                <div class="winner-group-label">第一轮 · 三等奖（厦大文创水杯）</div>
                <div id="round1-winners">等待抽取...</div>
            </div>
            <div class="winner-group">
                <div class="winner-group-label">第二轮 · 二等奖（厦大文创集合包）</div>
                <div id="round2-winners">等待抽取...</div>
            </div>
            <div class="winner-group">
                <div class="winner-group-label">第三轮 · 一等奖（荣耀智能手表）</div>
                <div id="round3-winners">等待抽取...</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>闽超进校园・厦门大学足球友谊赛 现场抽奖</p>
    </div>

    <div class="fireworks" id="fireworks"></div>

    <script>
        const PRIZES = [
            {
                name: '厦大文创水杯',
                title: '三等奖',
                count: 12,
                color: '#ffd23f',
                icon: '🥤'
            },
            {
                name: '厦大文创集合包',
                title: '二等奖',
                count: 6,
                color: '#00e5ff',
                icon: '🎁'
            },
            {
                name: '荣耀智能手表',
                title: '一等奖',
                count: 1,
                color: '#ff6b35',
                icon: '⌚'
            }
        ];

        const roundWinners = [[], [], []];
        const voidedTickets = new Set();
        const replacedTickets = new Set();
        const selectedTickets = new Set();

        let currentRound = 0;
        let isRolling = false;
        let blacklist = new Set();
        let rollInterval = null;

        const prizeIcon = document.getElementById('prize-icon');
        const prizeTitle = document.getElementById('prize-title');
        const prizeName = document.getElementById('prize-name');
        const prizeCount = document.getElementById('prize-count');
        const ticketDisplay = document.getElementById('ticket-display');
        const lotteryBtn = document.getElementById('lottery-btn');
        const nextRoundBtn = document.getElementById('next-round-btn');
        const voidBtn = document.getElementById('void-btn');
        const voidCount = document.getElementById('void-count');
        const roundBtns = [
            document.getElementById('round1-btn'),
            document.getElementById('round2-btn'),
            document.getElementById('round3-btn')
        ];
        const winnersContainers = [
            document.getElementById('round1-winners'),
            document.getElementById('round2-winners'),
            document.getElementById('round3-winners')
        ];

        function initStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        function updatePrizeDisplay() {
            const prize = PRIZES[currentRound];
            prizeIcon.textContent = prize.icon;
            prizeTitle.textContent = prize.title;
            prizeTitle.style.color = prize.color;
            prizeName.textContent = prize.name;
            prizeCount.textContent = `本轮名额：${prize.count}名`;
        }

        function updateRoundButtons() {
            roundBtns.forEach((btn, index) => {
                btn.className = 'round-btn';
                if (index < currentRound) {
                    btn.classList.add('passed');
                } else if (index === currentRound) {
                    btn.classList.add('active');
                }
            });
        }

        function generateRandomTicket() {
            let ticket;
            do {
                ticket = Math.floor(Math.random() * 1000) + 1;
            } while (blacklist.has(ticket));
            return ticket;
        }

        function formatTicketNumber(num) {
            return num.toString().padStart(3, '0');
        }

        function createTicketElement(number, isRolling = false) {
            const ticket = document.createElement('div');
            ticket.className = 'ticket-item' + (isRolling ? ' rolling' : '');
            ticket.innerHTML = `
                <span class="ticket-number">${formatTicketNumber(number)}</span>
                <span class="ticket-label">票号</span>
            `;
            return ticket;
        }

        function clearTicketDisplay() {
            ticketDisplay.innerHTML = '';
        }

        function showRollingTickets() {
            clearTicketDisplay();
            const count = PRIZES[currentRound].count;
            
            for (let i = 0; i < count; i++) {
                const ticket = createTicketElement(generateRandomTicket(), true);
                ticketDisplay.appendChild(ticket);
            }
        }

        function playFireworks() {
            const fireworksContainer = document.getElementById('fireworks');
            const colors = ['#ff6b35', '#ffd23f', '#00e5ff', '#00b894', '#ffffff'];
            
            for (let i = 0; i < 30; i++) {
                const firework = document.createElement('div');
                firework.className = 'firework';
                firework.style.left = Math.random() * 100 + '%';
                firework.style.top = Math.random() * 60 + '%';
                firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                fireworksContainer.appendChild(firework);
                
                setTimeout(() => {
                    firework.remove();
                }, 1000);
            }
        }

        function playConfetti() {
            const colors = ['#ff6b35', '#ffd23f', '#00e5ff', '#00b894'];
            
            for (let i = 0; i < 80; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = Math.random() * 10 + 5 + 'px';
                document.body.appendChild(confetti);
                
                setTimeout(() => {
                    confetti.remove();
                }, 3000);
            }
        }

        function updateWinnersPanel() {
            roundWinners.forEach((winners, roundIndex) => {
                const container = winnersContainers[roundIndex];
                if (winners.length === 0) {
                    container.textContent = '等待抽取...';
                } else {
                    container.innerHTML = winners
                        .sort((a, b) => a - b)
                        .map(num => {
                            let className = 'winner-ticket';
                            if (voidedTickets.has(num)) {
                                className += ' voided';
                            } else if (replacedTickets.has(num)) {
                                className += ' replaced';
                            } else if (selectedTickets.has(num)) {
                                className += ' selected';
                            }
                            return `<span class="${className}" data-number="${num}" data-round="${roundIndex}">${formatTicketNumber(num)}</span>`;
                        })
                        .join('');
                }
            });
            bindTicketClick();
        }

        function bindTicketClick() {
            const tickets = document.querySelectorAll('.winner-ticket');
            tickets.forEach(ticket => {
                ticket.removeEventListener('click', handleTicketClick);
                if (!ticket.classList.contains('voided')) {
                    ticket.addEventListener('click', handleTicketClick);
                }
            });
        }

        function handleTicketClick(e) {
            const ticket = e.target;
            const num = parseInt(ticket.dataset.number);
            
            if (voidedTickets.has(num)) return;
            
            if (selectedTickets.has(num)) {
                selectedTickets.delete(num);
                ticket.classList.remove('selected');
            } else {
                selectedTickets.add(num);
                ticket.classList.add('selected');
            }
            
            updateVoidBtn();
        }

        function updateVoidBtn() {
            const count = selectedTickets.size;
            voidCount.textContent = `已选择 ${count} 个号码`;
            
            if (count > 0) {
                voidBtn.classList.remove('disabled');
                voidBtn.classList.add('active');
            } else {
                voidBtn.classList.remove('active');
                voidBtn.classList.add('disabled');
            }
        }

        function voidAndRedraw() {
            if (selectedTickets.size === 0) return;

            const availableCount = 1000 - blacklist.size;
            if (availableCount < selectedTickets.size) {
                alert(`剩余可用号码不足！当前可用 ${availableCount} 个，需要 ${selectedTickets.size} 个`);
                return;
            }

            const voidedList = Array.from(selectedTickets);
            
            voidedList.forEach(num => {
                voidedTickets.add(num);
                blacklist.add(num);
                
                roundWinners.forEach((winners, roundIndex) => {
                    const index = winners.indexOf(num);
                    if (index !== -1) {
                        winners.splice(index, 1);
                    }
                });
            });

            const newTickets = [];
            for (let i = 0; i < voidedList.length; i++) {
                const newTicket = generateRandomTicket();
                newTickets.push(newTicket);
                blacklist.add(newTicket);
                replacedTickets.add(newTicket);
            }

            roundWinners[currentRound].push(...newTickets);

            selectedTickets.clear();
            updateVoidBtn();
            updateWinnersPanel();
            
            playFireworks();
            playConfetti();
        }

        function startRolling() {
            if (isRolling) return;
            if (roundWinners[currentRound].length > 0) return;

            isRolling = true;
            lotteryBtn.classList.remove('start');
            lotteryBtn.classList.add('rolling');
            lotteryBtn.textContent = '抽奖中...';

            let rollingCount = 0;
            const totalRolls = 25 + Math.random() * 15;
            
            rollInterval = setInterval(() => {
                showRollingTickets();
                rollingCount++;
                
                if (rollingCount >= totalRolls) {
                    stopRolling();
                }
            }, 80);
        }

        function stopRolling() {
            clearInterval(rollInterval);
            isRolling = false;
            
            const count = PRIZES[currentRound].count;
            const winners = [];
            
            for (let i = 0; i < count; i++) {
                const ticket = generateRandomTicket();
                winners.push(ticket);
                blacklist.add(ticket);
            }
            
            roundWinners[currentRound] = winners;
            
            clearTicketDisplay();
            winners.forEach((ticket, index) => {
                setTimeout(() => {
                    const ticketEl = createTicketElement(ticket);
                    ticketDisplay.appendChild(ticketEl);
                }, index * 100);
            });
            
            lotteryBtn.classList.remove('rolling');
            lotteryBtn.classList.add('start');
            lotteryBtn.textContent = '开始抽奖';

            setTimeout(() => {
                playFireworks();
                updateWinnersPanel();
            }, count * 100);

            setTimeout(() => {
                playConfetti();
                
                lotteryBtn.classList.add('disabled');
                lotteryBtn.textContent = '本轮已结束';
                
                if (currentRound < PRIZES.length - 1) {
                    nextRoundBtn.style.display = 'block';
                } else {
                    lotteryBtn.textContent = '抽奖结束';
                }
            }, count * 100 + 500);
        }

        function nextRound() {
            if (currentRound >= PRIZES.length - 1) return;

            currentRound++;
            
            clearTicketDisplay();
            updatePrizeDisplay();
            updateRoundButtons();
            
            lotteryBtn.classList.remove('disabled');
            lotteryBtn.classList.add('start');
            lotteryBtn.textContent = '开始抽奖';
            nextRoundBtn.style.display = 'none';
        }

        function init() {
            initStars();
            updatePrizeDisplay();
            updateRoundButtons();
            
            lotteryBtn.addEventListener('click', startRolling);
            nextRoundBtn.addEventListener('click', nextRound);
            voidBtn.addEventListener('click', voidAndRedraw);
        }

        init();
    </script>
</body>
</html>
