<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>交叉引用转换</title>
<style>
:root{--bg:#f7f7f4;--card:#fffffb;--line:#dedbd0;--text:#22211d;--muted:#6d685f;--accent:#2563eb;--ok:#2f7d46;--danger:#b42318;--radius:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:40px 16px}
main{width:560px;max-width:100%;display:flex;flex-direction:column;gap:14px}
h1{font-size:18px;font-weight:760}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 1px 0 rgba(255,255,255,.7)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-title{font-size:13px;font-weight:720}.card-note{font-size:11px;color:var(--muted)}
.upload-zone{border:1px dashed #c5c0b5;border-radius:var(--radius);background:#faf9f6;padding:32px 16px;text-align:center;color:#b6b0a6;font-size:14px;font-weight:650;cursor:pointer;transition:all .16s;user-select:none}
.upload-zone:hover,.upload-zone.dragover{background:#f3f7ff;border-color:#7aa2f7;color:#7b8798}
.upload-zone strong{color:#8c98aa;text-decoration:underline}
input[type=file]{display:none}
.btn{min-height:34px;border:1px solid var(--line);border-radius:var(--radius);padding:7px 14px;cursor:pointer;font-size:12px;font-weight:720;background:#fffef9;color:var(--text);transition:all .16s;white-space:nowrap}
.btn:hover:not(:disabled){background:#f2f0e8;border-color:#9c978a}
.btn:disabled{opacity:.46;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;display:block;width:100%}
.btn.primary:hover:not(:disabled){background:#1d4ed8}
.btn.danger{background:#fff1ee;color:var(--danger);border-color:#f9d4ce}
.status{padding:8px 12px;border-radius:var(--radius);font-size:12px;font-weight:650;border:1px solid transparent;margin-top:10px}
.status.info{background:#f5f4ee;color:var(--muted);border-color:var(--line)}
.status.ok{background:#eef8f0;color:var(--ok);border-color:#c9e8cf}
.status.err{background:#fff1ee;color:var(--danger);border-color:#f9d4ce}
.progress{display:none;padding:8px 12px;background:#edf4ff;border:1px solid #c9dcff;border-radius:var(--radius);margin-top:10px}
.progress-text{font-size:12px;font-weight:650;color:#1d4ed8;text-align:center;margin-bottom:4px}
.progress-bar{height:5px;border-radius:99px;background:#c9dcff;overflow:hidden}
.progress-fill{height:100%;border-radius:99px;background:#1d4ed8;transition:width .3s}
.selected-row{display:none;align-items:center;gap:10px;padding:8px 12px;background:#f5f4ee;border-radius:var(--radius);font-size:12px;margin-top:10px}
.selected-row .name{font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selected-row .btn{height:26px;line-height:1;padding:0 8px}
.info-box{padding:10px 12px;background:#f5f4ee;border-radius:var(--radius);font-size:12px;color:var(--muted);line-height:1.7}
footer{text-align:center;font-size:11px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<main>
<h1>交叉引用转换</h1>
<div class="info-box">
将论文中的 <b>[1]</b> <b>[5,6]</b> <b>[11-13]</b> 等引用标记<br>转换为 Word 自动编号 + 上标交叉引用字段
</div>

<div class="card">
<div class="card-head"><div class="card-title">上传论文 DOCX</div></div>
<div class="upload-zone" id="docx-zone">拖拽 DOCX 到此 / <strong>点击选择文件</strong></div>
<input type="file" id="docx-file" accept=".docx">
<div class="selected-row" id="docx-selected"><span class="name" id="docx-name"></span><button class="btn danger" id="docx-clear-btn">清除</button></div>
<button class="btn primary" id="convert-btn" disabled>转换交叉引用</button>
<div class="progress" id="progress"><div class="progress-text" id="progress-msg"></div><div class="progress-bar"><div class="progress-fill" id="progress-bar"></div></div></div>
<div class="status info" id="status">上传 DOCX 后点击转换，自动下载结果</div>
</div>

<footer>本地处理，文件不上传服务器</footer>
</main>

<script>
var docxFile = null;

var zone = document.getElementById('docx-zone');
var fileInput = document.getElementById('docx-file');

zone.addEventListener('click', function(){ fileInput.click(); });
zone.addEventListener('dragover', function(e){ e.preventDefault(); zone.classList.add('dragover'); });
zone.addEventListener('dragleave', function(){ zone.classList.remove('dragover'); });
zone.addEventListener('drop', function(e){
  e.preventDefault(); zone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', function(){
  if (this.files.length) handleFile(this.files[0]);
  this.value = '';
});

function handleFile(file) {
  if (!file.name.toLowerCase().endsWith('.docx')) { alert('请选择 .docx 文件'); return; }
  docxFile = file;
  document.getElementById('convert-btn').disabled = false;
  zone.style.display = 'none';
  document.getElementById('docx-selected').style.display = 'flex';
  document.getElementById('docx-name').textContent = file.name;
}

document.getElementById('docx-clear-btn').addEventListener('click', function(){
  docxFile = null;
  document.getElementById('convert-btn').disabled = true;
  zone.style.display = '';
  document.getElementById('docx-selected').style.display = 'none';
});

document.getElementById('convert-btn').addEventListener('click', function(){
  if (!docxFile) return;
  var p = document.getElementById('progress');
  p.style.display = 'block';
  document.getElementById('progress-bar').style.width = '10%';
  document.getElementById('progress-msg').textContent = '上传中...';
  document.getElementById('status').className = 'status info';
  document.getElementById('status').textContent = '处理中...';

  var fd = new FormData(); fd.append('docx', docxFile);
  fetch('/api/convert', { method: 'POST', body: fd }).then(function(r){
    document.getElementById('progress-bar').style.width = '90%';
    document.getElementById('progress-msg').textContent = '处理完成';
    if (!r.ok) return r.text().then(function(t){ throw new Error(t); });
    var d = r.headers.get('Content-Disposition') || '';
    var fn = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/.exec(d);
    fn = fn ? fn[1].replace(/['"]/g,'') : 'crossref.docx';
    return r.blob().then(function(b){ return {blob:b,name:decodeURIComponent(fn)}; });
  }).then(function(res){
    var a = document.createElement('a'); a.href = URL.createObjectURL(res.blob); a.download = res.name;
    document.body.appendChild(a); a.click(); a.remove();
    p.style.display = 'none';
    document.getElementById('status').className = 'status ok';
    document.getElementById('status').textContent = '转换完成，DOCX 已下载';
  }).catch(function(e){
    p.style.display = 'none';
    document.getElementById('status').className = 'status err';
    document.getElementById('status').textContent = '转换失败: ' + e.message;
  });
});
</script>
</body>
</html>
