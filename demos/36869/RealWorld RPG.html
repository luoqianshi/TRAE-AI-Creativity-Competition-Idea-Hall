<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RealWorld RPG 城市新手村</title>
<style>
  :root{
    --bg:#fff7ed;
    --bg-2:#fef3e2;
    --ink:#2b2b2b;
    --ink-2:#57534e;
    --primary:#f97316;
    --primary-2:#ea580c;
    --accent:#2563eb;
    --good:#16a34a;
    --warn:#eab308;
    --bad:#dc2626;
    --card:#ffffff;
    --line:#fde3c7;
    --line-2:#f5d5a8;
    --shadow:0 6px 18px rgba(120, 60, 10, 0.08);
    --radius:14px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 90% -10%, #ffd8a8 0%, transparent 60%),
      radial-gradient(1000px 600px at -10% 110%, #ffe7d0 0%, transparent 55%),
      var(--bg);
    min-height:100vh;
    line-height:1.55;
  }
  a{color:var(--primary)}
  button{font-family:inherit;cursor:pointer}

  /* ===== Top Nav ===== */
  .topbar{
    position:sticky;top:0;z-index:30;
    background:rgba(255,255,255,0.9);
    backdrop-filter:saturate(1.1) blur(8px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1200px;margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand-logo{
    width:44px;height:44px;border-radius:12px;
    background:linear-gradient(135deg,#fdba74,#f97316);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;
    box-shadow:0 6px 12px rgba(249,115,22,.3);
  }
  .brand-text h1{margin:0;font-size:18px}
  .brand-text p{margin:2px 0 0;font-size:12px;color:var(--ink-2)}
  .top-actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{
    border:1px solid var(--line-2);background:#fff;color:var(--ink);
    padding:9px 14px;border-radius:10px;font-size:14px;
    display:inline-flex;align-items:center;gap:6px;
    transition:transform .06s ease, box-shadow .2s ease, background .2s ease;
  }
  .btn:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
  .btn-primary{
    background:linear-gradient(180deg,#f97316,#ea580c);color:#fff;border-color:transparent;
    box-shadow:0 6px 14px rgba(234,88,12,.25);
  }
  .btn-primary:hover{box-shadow:0 8px 18px rgba(234,88,12,.35)}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
  .btn-ghost:hover{background:#fff4e6}

  /* ===== Layout ===== */
  .wrap{
    max-width:1200px;margin:22px auto;padding:0 20px 60px;
    display:grid;grid-template-columns:280px 1fr;gap:20px;
  }

  /* ===== Sidebar ===== */
  .side{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow);position:sticky;top:86px;height:fit-content;
  }
  .char{
    display:flex;align-items:center;gap:12px;margin-bottom:12px;
  }
  .avatar{
    width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,#fde68a,#f97316);
    display:grid;place-items:center;color:#fff;font-size:24px;font-weight:700;
    box-shadow:inset 0 0 0 3px #fff, 0 6px 14px rgba(249,115,22,.25);
  }
  .char h3{margin:0;font-size:15px}
  .char small{color:var(--ink-2);font-size:12px}
  .stat{margin-top:12px}
  .stat .label{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-bottom:6px}
  .bar{height:8px;background:#fdecc8;border-radius:999px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:999px;transition:width .5s ease}
  .bar.exp>i{background:linear-gradient(90deg,#fbbf24,#f97316)}
  .bar.ready>i{background:linear-gradient(90deg,#60a5fa,#2563eb)}
  .bar.anx>i{background:linear-gradient(90deg,#fca5a5,#dc2626)}

  .bag-title{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
  .bag-title h4{margin:0;font-size:14px}
  .bag-title span{font-size:12px;color:var(--ink-2)}
  .bag{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .item{
    display:flex;align-items:center;gap:8px;
    padding:8px 10px;border:1px dashed var(--line-2);border-radius:10px;
    background:#fffaf1;font-size:12px;color:var(--ink-2);
  }
  .item .ico{width:22px;height:22px;border-radius:6px;background:#fde3c7;display:grid;place-items:center;font-size:13px}
  .item.on{background:#fff;border-color:#fdba74;color:var(--ink)}
  .item.on .ico{background:linear-gradient(135deg,#fdba74,#f97316);color:#fff}

  /* ===== Main ===== */
  .hero{
    background:
      radial-gradient(600px 300px at 100% 0%, rgba(251,146,60,.25), transparent 60%),
      linear-gradient(180deg,#fffaf0,#fff);
    border:1px solid var(--line);border-radius:18px;
    padding:26px 26px 22px;box-shadow:var(--shadow);
    position:relative;overflow:hidden;
  }
  .hero .skyline{
    position:absolute;inset:auto 0 -2px 0;height:80px;
    background:linear-gradient(180deg,transparent,#fde3c7);
    pointer-events:none;opacity:.6;
  }
  .hero .skyline svg{position:absolute;bottom:0;left:0;width:100%;height:100%}
  .hero h2{margin:0 0 8px;font-size:28px;letter-spacing:.5px}
  .hero p{margin:0 0 16px;color:var(--ink-2);max-width:780px}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .kpi{
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .kpi .txt small{color:var(--ink-2);font-size:12px;display:block}
  .kpi .txt b{font-size:20px}
  .kpi .pill{
    font-size:22px;width:44px;height:44px;border-radius:12px;
    background:#fff4e6;display:grid;place-items:center;
  }

  .section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px}
  .section-title h3{margin:0;font-size:16px}
  .section-title span{font-size:12px;color:var(--ink-2)}

  .dungeons{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .dcard{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
    position:relative;cursor:pointer;transition:transform .15s ease, box-shadow .2s ease, border-color .2s ease;
    overflow:hidden;
  }
  .dcard:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(120,60,10,.12);border-color:#fdba74}
  .dcard .top{display:flex;align-items:flex-start;gap:12px}
  .dcard .icon{
    width:48px;height:48px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;
    color:#fff;font-size:22px;font-weight:700;
    box-shadow:0 6px 12px rgba(0,0,0,.08);
  }
  .dcard h4{margin:0;font-size:16px}
  .dcard p{margin:6px 0 0;font-size:13px;color:var(--ink-2)}
  .dcard .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{
    font-size:12px;padding:4px 8px;border-radius:999px;background:#fff4e6;color:#b45309;border:1px solid #fed7aa;
  }
  .dcard .foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
  .dcard .foot small{color:var(--ink-2)}
  .badge-done{
    font-size:11px;padding:4px 8px;border-radius:999px;background:#dcfce7;color:#166534;border:1px solid #bbf7d0;
  }
  .badge-new{
    font-size:11px;padding:4px 8px;border-radius:999px;background:#e0e7ff;color:#3730a3;border:1px solid #c7d2fe;
  }
  .remove-btn{
    position:absolute;top:10px;right:10px;background:#fff;color:#a8a29e;border:1px solid #fdecc8;
    width:26px;height:26px;border-radius:8px;font-size:14px;line-height:1;display:none;
  }
  .dcard.user .remove-btn{display:grid;place-items:center}

  /* ===== Dungeon Page ===== */
  .dpage{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;box-shadow:var(--shadow);
  }
  .crumb{font-size:13px;color:var(--ink-2);margin-bottom:10px}
  .crumb a{color:var(--primary);text-decoration:none}
  .step-head{display:flex;align-items:center;gap:10px;margin:10px 0 14px;flex-wrap:wrap}
  .step-head h3{margin:0;font-size:18px}
  .steps{display:flex;gap:6px;margin-left:auto}
  .dot{width:10px;height:10px;border-radius:50%;background:#fdecc8}
  .dot.cur{background:var(--primary)}
  .dot.done{background:var(--good)}

  .scene{
    background:
      linear-gradient(180deg,#fffaf0,#fff);
    border:1px solid var(--line);border-radius:14px;padding:16px;
    position:relative;
  }
  .npc{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .npc .avatar-sm{
    width:40px;height:40px;border-radius:10px;
    background:linear-gradient(135deg,#a7f3d0,#16a34a);
    color:#fff;display:grid;place-items:center;font-size:18px;font-weight:700;
  }
  .npc b{font-size:14px}
  .npc small{color:var(--ink-2);font-size:12px}
  .scene p{margin:6px 0 12px}
  .tip{
    display:flex;gap:10px;padding:10px 12px;border-left:4px solid var(--accent);
    background:#eff6ff;border-radius:8px;font-size:13px;color:#1e3a8a;
  }
  .tip b{color:#1e40af}

  .choices{display:grid;gap:10px;margin-top:14px}
  .choice{
    text-align:left;background:#fff;border:1px solid var(--line-2);border-radius:12px;
    padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;
    transition:border-color .2s ease, background .2s ease, transform .08s ease;
  }
  .choice:hover{border-color:#fdba74;background:#fffaf0}
  .choice .k{
    width:26px;height:26px;border-radius:8px;background:#fff4e6;color:#c2410c;
    display:grid;place-items:center;font-weight:700;flex-shrink:0;font-size:13px;
  }
  .choice.selected{border-color:var(--primary);background:#fff7ed}
  .choice.correct{border-color:var(--good);background:#f0fdf4}
  .choice.wrong{border-color:var(--bad);background:#fef2f2}

  .feedback{
    margin-top:14px;padding:14px;border-radius:12px;display:none;
    border:1px solid transparent;animation:fade .3s ease;
  }
  .feedback.show{display:block}
  .feedback.good{background:#f0fdf4;border-color:#bbf7d0;color:#14532d}
  .feedback.bad{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
  .feedback b{display:block;margin-bottom:4px}
  .reward{
    margin-top:10px;font-size:13px;color:var(--ink-2);
    display:flex;gap:8px;flex-wrap:wrap;
  }
  .reward span{background:#fff;padding:4px 8px;border-radius:999px;border:1px solid var(--line-2)}
  .btn-row{display:flex;justify-content:flex-end;margin-top:14px}

  /* ===== Complete page ===== */
  .complete{
    background:linear-gradient(180deg,#fff7ed,#fff);
    border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);
    position:relative;overflow:hidden;
  }
  .complete h2{margin:6px 0 4px}
  .complete .sub{color:var(--ink-2);margin:0 0 14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .panel{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;
  }
  .panel h4{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
  .checklist,.lines,.pitfalls{margin:0;padding-left:20px;font-size:13px;color:var(--ink-2)}
  .checklist li,.lines li,.pitfalls li{margin-bottom:6px}
  .skill-card{
    background:linear-gradient(135deg,#fef3c7,#fdba74);
    border:1px solid #fdba74;border-radius:14px;padding:16px;
    color:#7c2d12;margin-top:10px;
  }
  .skill-card h4{margin:0 0 4px}
  .skill-card p{margin:0;font-size:13px}
  .complete .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

  /* ===== Modal ===== */
  .modal-bg{
    position:fixed;inset:0;background:rgba(30,20,10,.45);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .modal-bg.show{display:flex;animation:fade .2s ease}
  .modal{
    background:#fff;border-radius:16px;max-width:520px;width:100%;
    padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  .modal h3{margin:0 0 4px}
  .modal .sub{color:var(--ink-2);font-size:13px;margin:0 0 14px}
  .field{margin-bottom:12px}
  .field label{font-size:13px;color:var(--ink-2);display:block;margin-bottom:6px}
  .field input,.field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;font-size:14px;
    background:#fffaf0;font-family:inherit;
  }
  .field textarea{min-height:70px;resize:vertical}
  .field input:focus,.field textarea:focus{outline:2px solid #fdba74;border-color:#fb923c;background:#fff}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}

  /* ===== Toast ===== */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:#1c1917;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .3s ease, transform .3s ease;
    z-index:60;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

  .social{
    margin-top:20px;padding:14px 16px;border-left:4px solid var(--primary);
    background:#fff7ed;border-radius:10px;font-size:13px;color:#9a3412;
  }
  .foot-note{text-align:center;color:var(--ink-2);font-size:12px;margin-top:24px}

  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* Mobile */
  @media (max-width: 900px){
    .wrap{grid-template-columns:1fr}
    .side{position:static}
    .dungeons{grid-template-columns:1fr}
    .kpis{grid-template-columns:1fr}
    .grid2{grid-template-columns:1fr}
    .hero h2{font-size:22px}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-logo">村</div>
      <div class="brand-text">
        <h1>RealWorld RPG 城市新手村</h1>
        <p>把第一次独自办事，变成可以安全练习的真实生活副本</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn btn-primary" id="btn-new">✨ 生成新副本</button>
      <button class="btn" id="btn-reset">↺ 重置进度</button>
    </div>
  </div>
</div>

<div class="wrap" id="app">
  <!-- ===== Sidebar ===== -->
  <aside class="side">
    <div class="char">
      <div class="avatar">你</div>
      <div>
        <h3 id="char-name">第一次进城的你</h3>
        <small id="char-desc">技能还不多，但背包里有勇气和一张写满问题的小纸条</small>
      </div>
    </div>

    <div class="stat">
      <div class="label"><span>等级</span><b id="level-text">Lv. 1</b></div>
      <div class="bar exp"><i id="bar-exp" style="width:0%"></i></div>
      <div class="label" style="margin-top:8px"><span>经验值</span><span id="exp-text">0 / 100</span></div>
    </div>

    <div class="stat">
      <div class="label"><span>准备度</span><span id="ready-text">10%</span></div>
      <div class="bar ready"><i id="bar-ready" style="width:10%"></i></div>
    </div>

    <div class="stat">
      <div class="label"><span>焦虑值</span><span id="anx-text">80%</span></div>
      <div class="bar anx"><i id="bar-anx" style="width:80%"></i></div>
    </div>

    <div class="bag-title">
      <h4>🎒 出门背包</h4>
      <span id="bag-count">0 / 8</span>
    </div>
    <div class="bag" id="bag"></div>
  </aside>

  <!-- ===== Main (dynamic) ===== -->
  <main id="main"></main>
</div>

<!-- ===== New Dungeon Modal ===== -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>生成新副本</h3>
    <p class="sub">告诉我你想练习的真实任务，我来帮你搭一个 3 步的模拟副本。</p>
    <div class="field">
      <label>副本名称</label>
      <input id="in-name" placeholder="例如：第一次去银行开户">
    </div>
    <div class="field">
      <label>目标人群</label>
      <input id="in-aud" placeholder="例如：第一次独自去银行的学生">
    </div>
    <div class="field">
      <label>想练习的真实任务</label>
      <textarea id="in-task" placeholder="例如：进银行、取号、填写开户表格、与柜员沟通"></textarea>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" id="btn-modal-cancel">取消</button>
      <button class="btn btn-primary" id="btn-modal-create">生成副本</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   数据层：4 个内置副本 + 动态用户副本
   ========================================================= */
const BUILTIN_DUNGEONS = [
  {
    id: "d1-train",
    title: "高铁站新手副本",
    desc: "从进站到检票，练习第一次独自坐高铁的关键流程。",
    tags: ["出行", "问路台词", "误车补救"],
    icon: "🚄",
    color: "linear-gradient(135deg,#60a5fa,#2563eb)",
    steps: [
      {
        title: "到达车站入口",
        npc: "安检口工作人员",
        scene: "你到了高铁站门口，屏幕上写着很多入口。人流很快，你有点慌。",
        tip: "先确认车次、出发站、身份证，再跟着「进站/安检」标识走。不要先找站台，站台通常检票后才显示。",
        options: [
          { k: "A", text: "直接问工作人员：『我第一次坐高铁，请问 G1286 从哪里进站？』", correct: true, explain: "清晰表达「第一次+车次」，工作人员会直接指引入口，是效率最高的做法。", rewards: { exp: 15, ready: 8, item: "身份证" } },
          { k: "B", text: "跟着人最多的队伍排", correct: false, explain: "人多不一定方向对，你可能排到出发/到达的另一条队，反而耽误时间。", rewards: { ready: 2 } },
          { k: "C", text: "先打开短视频搜车站攻略", correct: false, explain: "现场再查容易越看越焦虑。出发前可做功课，现场以标识+问人为准。", rewards: { ready: 2 } }
        ]
      },
      {
        title: "安检与检票",
        npc: "检票口广播",
        scene: "你通过安检后，大屏幕显示检票口还没开放。旁边有人开始跑。",
        tip: "看大屏幕的检票状态，未开始时不要挤在闸机口。保留 10 分钟缓冲，听广播即可。",
        options: [
          { k: "A", text: "找座位等大屏幕变成「正在检票」", correct: true, explain: "检票口通常提前 15 分钟左右开放，提前到也只是等。你在正确的时间做正确的事。", rewards: { exp: 15, ready: 8, anx: -10, item: "官方入口" } },
          { k: "B", text: "马上冲到站台，越早越好", correct: false, explain: "未开放时站台通道是锁的，冲过去只是白跑一趟，还容易慌。", rewards: { ready: 2 } },
          { k: "C", text: "把身份证放进行李箱，反正已经安检了", correct: false, explain: "检票、出站都可能用到身份证，要保持随手可取。", rewards: { ready: 1 } }
        ]
      },
      {
        title: "突发：差点误车",
        npc: "服务台",
        scene: "你买水回来发现只剩 5 分钟停止检票，检票口在另一边。",

/* =========================================================
   状态管理
   ========================================================= */
const STORAGE_KEY = "rw-rpg-city-village-v1";
const defaultState = {
  exp: 0,
  level: 1,
  ready: 10,
  anx: 80,
  items: [],
  dungeonsDone: [],
  skills: [],
  userDungeons: []
};
let state = load();

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return JSON.parse(JSON.stringify(defaultState));
    const s = JSON.parse(raw);
    // 合并字段，防止旧版本缺字段
    return Object.assign({}, defaultState, s);
  }catch(e){
    return JSON.parse(JSON.stringify(defaultState));
  }
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

/* =========================================================
   路由 / 视图切换
   ========================================================= */
let view = { name: "hall" }; // or { name:"dungeon", id:"x", step:0, chosen:null, shown:false } or { name:"complete", id:"x" }

function render(){
  renderSide();
  if(view.name === "hall") renderHall();
  else if(view.name === "dungeon") renderDungeon();
  else if(view.name === "complete") renderComplete();
}

/* =========================================================
   侧边栏
   ========================================================= */
function renderSide(){
  const expMax = state.level * 100;
  const expPercent = Math.min(100, Math.round(state.exp / expMax * 100));
  document.getElementById("level-text").textContent = "Lv. " + state.level;
  document.getElementById("exp-text").textContent = state.exp + " / " + expMax;
  document.getElementById("bar-exp").style.width = expPercent + "%";
  document.getElementById("ready-text").textContent = Math.round(state.ready) + "%";
  document.getElementById("bar-ready").style.width = clamp(state.ready) + "%";
  document.getElementById("anx-text").textContent = Math.round(state.anx) + "%";
  document.getElementById("bar-anx").style.width = clamp(state.anx) + "%";

  const bag = document.getElementById("bag");
  bag.innerHTML = "";
  ALL_ITEMS.forEach(it=>{
    const on = state.items.includes(it.key);
    const div = document.createElement("div");
    div.className = "item" + (on ? " on" : "");
    div.innerHTML = `<div class="ico">${it.icon}</div><span>${it.name}</span>`;
    bag.appendChild(div);
  });
  document.getElementById("bag-count").textContent = state.items.length + " / " + ALL_ITEMS.length;
}
function clamp(v){ return Math.max(0, Math.min(100, v)); }

      <p>选择一个生活副本，和 NPC 对话、处理突发状况、收集行动清单。每一次选错，都会变成下次出门前的保护经验。</p>
      <div class="kpis">
        <div class="kpi"><div class="txt"><small>已通关副本</small><b id="kpi-done">${done}</b></div><div class="pill">🏆</div></div>
        <div class="kpi"><div class="txt"><small>生活技能卡</small><b id="kpi-skill">${skills}</b></div><div class="pill">🃏</div></div>
        <div class="kpi"><div class="txt"><small>NPC 实时台词</small><b style="font-size:14px">${line}</b></div><div class="pill">💬</div></div>
      </div>
    </section>

    <div class="section-title">
      <h3>🗺️ 副本大厅</h3>
      <span>${allDungeons.length} 个副本 · 点击进入闯关</span>
    </div>
    <div class="dungeons" id="dungeons"></div>

    <div class="social">
      <b>🌱 关于这个产品：</b>很多人不是不努力，而是没人教他们第一次怎么做。RealWorld RPG 把城市生活里的<b>隐性规则</b>变成可练习、可犯错、可复盘的游戏副本，让普通人在真正出门前，先在 AI 模拟世界里安全通关一次。
    </div>
    <div class="foot-note">© RealWorld RPG · 城市新手村 · 所有数据仅保存在本地浏览器</div>
  `;

  const host = document.getElementById("dungeons");
  allDungeons.forEach(d=>{
    const isUser = !!d.user;
    const done = state.dungeonsDone.includes(d.id);
    const card = document.createElement("div");
    card.className = "dcard" + (isUser ? " user" : "");
    card.innerHTML = `
      ${isUser ? `<button class="remove-btn" data-id="${d.id}" title="删除">✕</button>` : ""}
      <div class="top">
        <div class="icon" style="background:${d.color}">${d.icon}</div>
        <div>
          <h4>${d.title}</h4>
          <p>${d.desc}</p>
          <div class="tags" style="margin-top:8px">${d.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
        </div>
      </div>
      <div class="foot">
        <small>${d.steps.length} 步 · 约 5 分钟</small>
        ${done ? `<span class="badge-done">已通关 ✓</span>` : `<span class="badge-new">可挑战</span>`}
      </div>
    `;
    card.addEventListener("click", (e)=>{
      if(e.target.classList.contains("remove-btn")) return;
      enterDungeon(d.id);
    });
    const rm = card.querySelector(".remove-btn");
    if(rm){
      rm.addEventListener("click", (e)=>{
        e.stopPropagation();
        if(confirm("确定删除这个自定义副本？")){
          state.userDungeons = state.userDungeons.filter(x=>x.id !== d.id);
          state.dungeonsDone = state.dungeonsDone.filter(x=>x !== d.id);
          save(); render();
        }
      });
    }
    host.appendChild(card);
  });
}

/* =========================================================
   副本闯关
   ========================================================= */
function enterDungeon(id){
  view = { name: "dungeon", id, step: 0, chosen: null, shown: false };
  render();
}
function findDungeon(id){
  return BUILTIN_DUNGEONS.find(d=>d.id===id) || state.userDungeons.find(d=>d.id===id);
}

function renderDungeon(){
  const d = findDungeon(view.id);
  if(!d){ view = { name: "hall" }; render(); return; }
  const step = d.steps[view.step];
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="dpage">
      <div class="crumb"><a id="back" href="#">← 返回大厅</a> · ${d.title}</div>
      <div class="step-head">
        <h3>步骤 ${view.step+1}：${step.title}</h3>
        <div class="steps" id="dots"></div>
      </div>

      <div class="scene">
        <div class="npc">
          <div class="avatar-sm">${npcEmoji(view.id, view.step)}</div>
          <div><b>${step.npc}</b> <small>· 当前场景</small></div>
        </div>
        <p>${step.scene}</p>
        <div class="tip"><b>💡 新手保护：</b><span>${step.tip}</span></div>

        <div class="choices" id="choices"></div>

        <div class="feedback" id="feedback">
          <b id="fb-title"></b>
          <div id="fb-text"></div>
          <div class="reward" id="fb-reward"></div>
        </div>

        <div class="btn-row">
          <button class="btn btn-primary" id="btn-continue" style="display:none">继续 →</button>
        </div>
      </div>
    </div>
  `;

  // 步骤指示点
  const dots = document.getElementById("dots");
  d.steps.forEach((_, i)=>{
    const s = document.createElement("div");
    s.className = "dot" + (i < view.step ? " done" : (i === view.step ? " cur" : ""));
    dots.appendChild(s);
  });

  // 选项
  const host = document.getElementById("choices");
  step.options.forEach((opt, idx)=>{
    const b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = `<div class="k">${opt.k}</div><div>${opt.text}</div>`;
    b.addEventListener("click", ()=> choose(idx));
    host.appendChild(b);
  });

  document.getElementById("back").addEventListener("click", (e)=>{
    e.preventDefault(); view = { name: "hall" }; render();
  });

  document.getElementById("btn-continue").addEventListener("click", ()=>{
    if(view.step + 1 >= d.steps.length){
      // 进入通关页
      if(!state.dungeonsDone.includes(d.id)) state.dungeonsDone.push(d.id);
      save();
      view = { name: "complete", id: d.id };
      render();
    }else{
      view.step += 1; view.chosen = null; view.shown = false;
      render();
    }
  });
}
function npcEmoji(id, step){
  const map = {
    "d1-train": ["🧑‍💼","📢","🛎️"],
    "d2-hospital": ["👩‍⚕️","👨‍⚕️","💊"],
    "d3-rent": ["🧑‍💼","🏡","📇"],
    "d4-social": ["🏛️","🧑‍💻","💻"]
  };
  return (map[id] && map[id][step]) || "🧑";
}

function choose(idx){
  if(view.shown) return;
  const d = findDungeon(view.id);
  const step = d.steps[view.step];
  const opt = step.options[idx];
  view.chosen = idx; view.shown = true;

  // 给每个选项加样式
  const all = document.querySelectorAll(".choice");
  all.forEach((el, i)=>{
    el.classList.add("selected");
    if(i === idx){
      el.classList.add(opt.correct ? "correct" : "wrong");
    }
  });

  // 应用奖励
  const r = opt.rewards || {};
  if(r.exp) state.exp += r.exp;
  if(r.ready) state.ready = clamp(state.ready + r.ready);
  if(r.anx) state.anx = clamp(state.anx + r.anx);
  // 升级（每次重新计算当前等级的经验上限）
  while(state.exp >= state.level * 100){
    state.exp -= state.level * 100;
    state.level += 1;
  }
  // 道具
  let gotItem = null;
  if(r.item){
    const key = itemKeyByName(r.item);
    if(key && !state.items.includes(key)){
      state.items.push(key); gotItem = r.item;
    }
  }
  save();

  // 显示反馈
  const fb = document.getElementById("feedback");
  fb.classList.add("show", opt.correct ? "good" : "bad");
  document.getElementById("fb-title").textContent = opt.correct ? "✓ 很棒，这是更稳妥的做法" : "⚠ 没关系，下次你就会这样做";
  document.getElementById("fb-text").textContent = opt.explain;

  const reward = document.getElementById("fb-reward");
  const chips = [];
  if(r.exp) chips.push(`经验值 +${r.exp}`);
  if(r.ready) chips.push(`准备度 +${r.ready}`);
  if(r.anx) chips.push(`焦虑值 ${r.anx>0?"+":""}${r.anx}`);
  if(gotItem) chips.push(`🎒 获得：${gotItem}`);
  if(!chips.length) chips.push("（这一次没有直接奖励，但你避免了潜在风险）");
  reward.innerHTML = chips.map(c=>`<span>${c}</span>`).join("");

  document.getElementById("btn-continue").style.display = "inline-flex";
  renderSide();
}
function itemKeyByName(name){
  const m = ALL_ITEMS.find(x=>x.name === name);
  return m ? m.key : null;
}

/* =========================================================
   通关页
   ========================================================= */
function renderComplete(){
  const d = findDungeon(view.id);
  if(!d){ view = { name: "hall" }; render(); return; }
  const main = document.getElementById("main");

  // 技能卡
  const skillTitle = d.skill?.title || `${d.title}·综合技能卡`;
  const skillText = d.skill?.text || "把「先确认目标 → 现场沟通 → 留证据」这三步，变成你下一次出门前的肌肉记忆。";
  const hasSkill = state.skills.includes(d.id);

  const actionList = (d.checklist || []).map(x=>`<li>${x}</li>`).join("");
  const lineList = (d.lines || []).map(x=>`<li>${x}</li>`).join("");
  const pitList = (d.pitfalls || []).map(x=>`<li>${x}</li>`).join("");

  main.innerHTML = `
    <div class="complete">
      <div class="crumb"><a id="back" href="#">← 返回大厅</a> · ${d.title}</div>
      <h2>🎉 恭喜通关：${d.title}</h2>
      <p class="sub">你在 AI 模拟世界里安全地走了一遍完整流程。下面是你出门前可以直接使用的行动清单。</p>

      <div class="grid2">
        <div class="panel">
          <h4>📋 出门前行动清单</h4>
          <ol class="checklist">${actionList}</ol>
        </div>
        <div class="panel">
          <h4>💬 沟通台词包（照念都行）</h4>
          <ul class="lines">${lineList}</ul>
        </div>
        <div class="panel" style="grid-column: span 2">
          <h4>🚧 防坑提醒</h4>
          <ul class="pitfalls">${pitList}</ul>
        </div>
      </div>

      <div class="panel" style="margin-top:14px">
        <h4>🃏 技能卡：<span>${skillTitle}</span></h4>
        <div class="skill-card">
          <h4>${skillTitle}</h4>
          <p>${skillText}</p>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="btn-copy">📋 复制行动清单</button>
        ${hasSkill
          ? `<button class="btn btn-ghost" disabled>✓ 技能卡已领取</button>`
          : `<button class="btn btn-primary" id="btn-skill">🃏 领取技能卡</button>`}
        <button class="btn btn-ghost" id="btn-back2">回到大厅</button>
      </div>
    </div>
  `;

  document.getElementById("back").addEventListener("click", e=>{e.preventDefault(); view={name:"hall"}; render();});
  document.getElementById("btn-back2").addEventListener("click", ()=>{ view={name:"hall"}; render(); });

  document.getElementById("btn-copy").addEventListener("click", ()=>{
    const text = [
      `【${d.title} · 行动清单】`,
      ...(d.checklist||[]).map((x,i)=>`${i+1}. ${x}`),
      ``,
      `【沟通台词】`,
      ...(d.lines||[]).map(x=>`- ${x}`),
      ``,
      `【防坑提醒】`,
      ...(d.pitfalls||[]).map(x=>`· ${x}`)
    ].join("\n");
    copyText(text);
  });

  const sb = document.getElementById("btn-skill");
  if(sb){
    sb.addEventListener("click", ()=>{
      if(!state.skills.includes(d.id)) state.skills.push(d.id);
      save();
      toast("已领取：" + skillTitle);
      render();
    });
  }
}

/* =========================================================
   生成新副本
   ========================================================= */
function openModal(){ document.getElementById("modal").classList.add("show"); }
function closeModal(){ document.getElementById("modal").classList.remove("show"); }

  const aud = (document.getElementById("in-aud").value || "").trim();
  const task = (document.getElementById("in-task").value || "").trim();
  if(!name){ toast("请填写副本名称"); return; }
  if(!task){ toast("请简单写下你想练习的任务"); return; }

  const id = "u-" + Date.now();
  // 基于任务关键词简单构建 3 个场景
  const ud = {
    id,
    user: true,
    title: name,
    desc: `为「${aud || "你自己"}」定制：${task.slice(0, 60)}${task.length>60?"…":""}`,
    tags: ["定制", "第一次", "可练习"],
    icon: "🌟",
    color: "linear-gradient(135deg,#fcd34d,#f59e0b)",
    steps: [
      {
        title: "确认目标与入口",
        npc: "场景中的关键工作人员",
        scene: `你想完成「${task}」，但不确定从哪里开始、该找谁。`,
        tip: "先确认你的目标、官方入口或权威工作人员；不要上来就埋头操作。",
        options: [
          { k: "A", text: "先写下：我今天最想搞定的 1 件事是什么，以及我可以问谁", correct: true, explain: "明确目标+找到合适的人，能把后面所有步骤一起变简单。", rewards: { exp: 15, ready: 10, anx: -10, item: "官方入口" } },
          { k: "B", text: "先随便点一个页面/找人，边做边看", correct: false, explain: "没有目标时，容易被广告和复杂流程带偏。", rewards: { ready: 1 } },
          { k: "C", text: "打算等朋友来带我做", correct: false, explain: "依赖他人会让你永远卡在「第一次」。", rewards: { ready: 1 } }

        tip: "按「我是谁、我想办什么、我已准备了什么」三句话说清楚。",
        options: [

          { k: "B", text: "一上来就讲一堆细节", correct: false, explain: "对方需要先抓到重点，再去听细节。", rewards: { ready: 1 } },
          { k: "C", text: "不好意思多问，对方说什么就点头", correct: false, explain: "关键信息（流程、材料、时间、费用）不确认，后续会返工。", rewards: { ready: 1 } }
        ]

      {

          { k: "B", text: "办完就行，不用记", correct: false, explain: "不做记录的「第一次」很难转化为可复用的经验。", rewards: { ready: 1 } },
          { k: "C", text: "只记在脑子里", correct: false, explain: "一段时间后细节会模糊，尤其在紧张时。", rewards: { ready: 1 } }

  };

  state.userDungeons.push(ud);
  save();
  closeModal();
  toast("新副本已生成：" + name);
  render();
}

/* =========================================================
   小工具：复制 / Toast / 随机 NPC 台词
   ========================================================= */
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast("✓ 已复制到剪贴板"), ()=>fallbackCopy(text));
  }else{
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.top="-1000px";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("✓ 已复制到剪贴板"); }catch(e){ toast("复制失败，请手动选取"); }
  document.body.removeChild(ta);
}
let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2000);
}

  "『您好，请问有什么可以帮您？』",

  "『请带好您的身份证和相关材料。』",
  "『不确定的话，先问一句比自己猜更省时间。』",
  "『请先到取号机取号，再到等候区就坐。』",
  "『我们这边不收现金以外的任何费用，小心第三方。』",
  "『办理完请保留好凭证，方便下次查询。』"
];
function pickLine(){ return NPC_LINES[Math.floor(Math.random()*NPC_LINES.length)]; }

/* =========================================================
   事件绑定
   ========================================================= */
document.getElementById("btn-new").addEventListener("click", openModal);
document.getElementById("btn-reset").addEventListener("click", ()=>{
  if(confirm("确定重置所有进度？（等级、经验、副本通关、背包、技能卡都会清空）")){
    state = JSON.parse(JSON.stringify(defaultState));
    save(); view = { name: "hall" }; render();
    toast("进度已重置");
  }
});
document.getElementById("btn-modal-cancel").addEventListener("click", closeModal);
document.getElementById("btn-modal-create").addEventListener("click", createUserDungeon);
document.getElementById("modal").addEventListener("click", (e)=>{
  if(e.target.id === "modal") closeModal();
});

/* 初始渲染 */
render();
</script>
