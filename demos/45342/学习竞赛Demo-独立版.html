    function renderAchievements() {
      const unlockedIds = currentUser?.achievements || [];

      const checkUnlocked = (achievement) => {
        if (unlockedIds.includes(achievement.id)) return true;
        if (!currentUser) return false;
        switch (achievement.criteria.type) {
          case 'totalWins': return (currentUser.stats?.totalWins || 0) >= achievement.criteria.value;
          case 'vocabularyCount': return (currentUser.stats?.vocabularyCount || 0) >= achievement.criteria.value;
          case 'booksRead': return (currentUser.stats?.booksRead || 0) >= achievement.criteria.value;
          case 'studyHours': return (currentUser.stats?.studyHours || 0) >= achievement.criteria.value;
          case 'points': return (currentUser?.points || 0) >= achievement.criteria.value;
          default: return false;
        }
      };

      const getProgress = (achievement) => {
        if (!currentUser) return 0;
        let currentValue = 0;
        switch (achievement.criteria.type) {
          case 'totalWins': currentValue = currentUser.stats?.totalWins || 0; break;
          case 'vocabularyCount': currentValue = currentUser.stats?.vocabularyCount || 0; break;
          case 'booksRead': currentValue = currentUser.stats?.booksRead || 0; break;
          case 'studyHours': currentValue = currentUser.stats?.studyHours || 0; break;
          case 'points': currentValue = currentUser?.points || 0; break;
        }
        return Math.min((currentValue / achievement.criteria.value) * 100, 100);
      };

      const unlockedCount = achievements.filter(checkUnlocked).length;

      return `
        <div class="min-h-screen bg-gray-50 pt-20 pb-8">
          <div class="max-w-4xl mx-auto px-4">
            <div class="mb-8">
              <h1 class="text-3xl font-bold text-gray-800">成就系统</h1>
              <p class="text-gray-500 mt-2">追踪你的学习成长，解锁专属成就</p>
            </div>
            <div class="bg-white rounded-xl p-6 shadow-sm mb-8">
              <div class="flex items-center justify-between">
                <div>
                  <p class="text-gray-500">成就完成度</p>
                  <p class="text-2xl font-bold text-gray-800">${unlockedCount} / ${achievements.length}</p>
                </div>
                <div class="w-24 h-24 rounded-full bg-gradient-to-br from-yellow-400 to-orange-500 flex items-center justify-center">
                  <span class="text-4xl">⭐</span>
                </div>
              </div>
              <div class="mt-4 w-full bg-gray-200 rounded-full h-3">
                <div class="bg-gradient-to-r from-yellow-400 to-orange-500 h-3 rounded-full" style="width: ${(unlockedCount / achievements.length) * 100}%"></div>
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${achievements.map(achievement => {
                const unlocked = checkUnlocked(achievement);
                const progress = getProgress(achievement);
                return `
                  <div class="rounded-xl p-6 shadow-sm transition-all ${unlocked ? 'bg-gradient-to-br from-yellow-50 to-orange-50 border-2 border-yellow-200' : 'bg-white'}">
                    <div class="flex items-center space-x-4 mb-4">
                      <div class="w-14 h-14 rounded-xl flex items-center justify-center ${unlocked ? 'bg-gradient-to-br from-yellow-400 to-orange-500' : 'bg-gray-200'}">
                        <span class="text-2xl">${achievement.icon}</span>
                      </div>
                      <div class="flex-1">
                        <h3 class="text-lg font-semibold ${unlocked ? 'text-gray-800' : 'text-gray-500'}">${achievement.title}${unlocked ? '<span class="ml-2">✅</span>' : ''}</h3>
                        <p class="text-sm text-gray-500">${achievement.description}</p>
                      </div>
                    </div>
                    ${!unlocked ? `
                      <div class="mb-3">
                        <div class="flex justify-between text-sm mb-1">
                          <span class="text-gray-500">进度</span>
                          <span class="font-medium">${achievement.criteria.type === 'points' ? (currentUser?.points || 0) : achievement.criteria.type === 'totalWins' ? (currentUser?.stats?.totalWins || 0) : achievement.criteria.type === 'vocabularyCount' ? (currentUser?.stats?.vocabularyCount || 0) : achievement.criteria.type === 'booksRead' ? (currentUser?.stats?.booksRead || 0) : (currentUser?.stats?.studyHours || 0)} / ${achievement.criteria.value}</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2">
                          <div class="bg-primary-500 h-2 rounded-full" style="width: ${progress}%"></div>
                        </div>
                      </div>
                    ` : ''}
                    <div class="flex items-center justify-between">
                      <span class="text-sm text-gray-500">奖励: ${achievement.rewardType === 'premium' ? '🎁 高级会员' : '💰 ' + achievement.rewardPoints + ' 积分'}</span>
                      ${unlocked ? '<span class="text-xs px-2 py-1 bg-green-100 text-green-700 rounded-full">已解锁</span>' : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

      const user = demoUsers.find(u => u.username === username);
      if (user && password) {
        currentUser = user;
        currentPage = 'home';
        render();
      } else {
        alert('用户名或密码错误');
      }
    }

    function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('register-username').value;
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;
      const confirm = document.getElementById('register-confirm').value;
      if (password !== confirm) {
        alert('两次密码不一致');
        return;
      }
      currentUser = {
        id: 'new',
        username,
        email,
        gender: 'other',
        age: 0,
        bio: '',
        points: 0,
        level: 1,
        stats: { totalWins: 0, totalLosses: 0, vocabularyCount: 0, booksRead: 0, studyHours: 0, stepsCount: 0 },
        achievements: [],
        privacySettings: { showPhoto: true, showOnlineStatus: true, allowMessages: true },
      };
      currentPage = 'home';
      render();
    }

    function handleDemoLogin() {
      const randomIndex = Math.floor(Math.random() * demoUsers.length);
      currentUser = demoUsers[randomIndex];
      currentPage = 'home';
      render();
    }

    function handleLogout() {
      currentUser = null;
      currentPage = 'login';
      matchedUser = null;
      selectedStream = null;
      render();
    }

    function handleMatch() {
      const randomIndex = Math.floor(Math.random() * socialUsers.length);
      matchedUser = socialUsers[randomIndex];
      render();
    }

    function setSocialTab(tab) {
      activeSocialTab = tab;
      render();
    }

    function setRankingTab(tab) {
      activeRankingTab = tab;
      render();
    }

    function setMarketCategory(category) {
      selectedMarketCategory = category;
      render();
    }

    function selectStream(id) {
      selectedStream = liveStreams.find(s => s.id === id);
      chatMessages = [
        { username: '小明', message: '老师讲得真好！', timestamp: '10:00' },
        { username: '小红', message: '这个单词记住了', timestamp: '10:01' },
        { username: '主持人', message: '感谢大家的支持', timestamp: '10:02' },
      ];
      render();
    }

    function handleSendMessage(e) {
      if (e && e.key !== 'Enter') return;
      const input = document.getElementById('live-message');
      if (input && input.value.trim()) {
        chatMessages.push({ username: currentUser?.username || '匿名', message: input.value, timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
        input.value = '';
        render();
      }
    }

    function togglePrivacy(key) {
      if (currentUser?.privacySettings) {
        currentUser.privacySettings[key] = !currentUser.privacySettings[key];
        render();
      }
    }

    render();
  </script>
</body>
</html>
