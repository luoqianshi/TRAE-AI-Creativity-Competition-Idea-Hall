<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乐器学习助手 - 创意演示</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  background: #0f1626;
  color: #fff;
  min-height: 100vh;
  overflow-x: hidden;
}

/* 开屏 */
#splash {
  position: fixed; inset: 0;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  transition: opacity 0.5s, transform 0.5s;
}
#splash.hide { opacity: 0; transform: scale(1.05); pointer-events: none; }
.splash-content { text-align: center; padding: 40px 20px; max-width: 900px; }
.splash-logo { font-size: 64px; margin-bottom: 16px; }
.splash-content h1 {
  font-size: 36px; margin-bottom: 8px; letter-spacing: 4px;
  background: linear-gradient(90deg, #fff, #4ecca3);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.splash-content p { color: #a8b8d8; margin-bottom: 40px; font-size: 16px; }
.cards { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; }
.card {
  width: 200px; padding: 28px 20px;
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,255,255,0.15);
  border-radius: 16px; cursor: pointer;
  transition: all 0.25s; position: relative;
  backdrop-filter: blur(10px);
}
.card:hover { transform: translateY(-6px); border-color: rgba(255,255,255,0.4); }
.card.selected { border-color: #4ecca3; background: rgba(78,204,163,0.15); transform: translateY(-4px) scale(1.02); }
.card.selected::after {
  content: '✓'; position: absolute; top: 10px; right: 12px;
  width: 22px; height: 22px; background: #4ecca3; color: #1a1a2e;
  border-radius: 50%; font-size: 14px; font-weight: bold;
  display: flex; align-items: center; justify-content: center;
}
.card-icon { font-size: 48px; margin-bottom: 14px; }
.card-name { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
.card-desc { font-size: 13px; color: #b8c6db; margin-bottom: 10px; }
.card-range { font-size: 11px; color: #8a9ab8; letter-spacing: 1px; }
.enter-btn {
  padding: 12px 40px; font-size: 15px; font-weight: 600; letter-spacing: 2px;
  border: none; border-radius: 24px; cursor: pointer;
  background: linear-gradient(135deg, #4ecca3, #38a583); color: #fff;
  box-shadow: 0 4px 16px rgba(78,204,163,0.4); transition: all 0.2s;
}
.enter-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(78,204,163,0.6); }
.enter-btn:disabled { opacity: 0.4; cursor: not-allowed; background: #555; box-shadow: none; }

/* 主界面 */
#app { display: none; min-height: 100vh; flex-direction: column; }
#app.show { display: flex; }

header {
  height: 56px; padding: 0 24px;
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(255,255,255,0.05); backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.logo { display: flex; align-items: center; gap: 12px; }
.logo-icon { font-size: 24px; }
.logo-text { font-size: 18px; font-weight: 600; letter-spacing: 1px; }
.inst-badge {
  padding: 6px 14px; border: 1px solid #4ecca3; border-radius: 16px;
  font-size: 13px; cursor: pointer; background: rgba(78,204,163,0.1);
  transition: all 0.18s; margin-left: 8px;
}
.inst-badge:hover { background: rgba(78,204,163,0.2); transform: translateY(-1px); }

main { flex: 1; display: flex; gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; width: 100%; }

/* 左侧曲谱 */
.sidebar { width: 260px; display: flex; flex-direction: column; gap: 12px; }
.panel-title {
  font-size: 12px; font-weight: 600; letter-spacing: 1px;
  color: #8a9ab8; text-transform: uppercase; margin-bottom: 4px;
}
.score-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.score-item {
  padding: 12px 14px; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
  cursor: pointer; transition: all 0.15s; font-size: 14px;
}
.score-item:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
.score-item.active { background: rgba(78,204,163,0.2); border-color: #4ecca3; }
.score-tempo { font-size: 11px; color: #8a9ab8; margin-top: 2px; }

/* 中央曲谱显示 */
.center { flex: 1; display: flex; flex-direction: column; gap: 16px; }
.staff-area {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px; padding: 24px; min-height: 200px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.staff-canvas { width: 100%; height: 200px; }
.staff-empty { color: #8a9ab8; font-size: 15px; text-align: center; }

/* 控制按钮 */
.controls { display: flex; gap: 12px; justify-content: center; }
.btn {
  padding: 10px 24px; border: none; border-radius: 8px;
  font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
}
.btn-primary { background: #4ecca3; color: #0f1626; }
.btn-primary:hover { background: #38a583; transform: translateY(-1px); }
.btn-primary.playing { background: #e74c3c; color: #fff; }
.btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
.btn-secondary:hover { background: rgba(255,255,255,0.2); }

/* 指导面板 */
.coach {
  display: flex; gap: 1px; background: rgba(255,255,255,0.1);
  border-radius: 10px; overflow: hidden;
}
.coach-section {
  flex: 1; background: rgba(255,255,255,0.08); padding: 14px 18px;
  display: flex; flex-direction: column; gap: 4px;
}
.coach-label { font-size: 10px; color: #8a9ab8; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
.coach-target, .coach-next { font-size: 20px; font-weight: 700; color: #fff; }
.coach-feedback { font-size: 12px; color: #b8c6db; }
.coach-feedback.good { color: #4ecca3; }
.coach-feedback.sharp { color: #f39c12; }
.coach-feedback.wrong { color: #e74c3c; }
.coach-hint { font-size: 12px; color: #b8c6db; }
.coach-tip { font-size: 12px; color: #9b8cd8; font-style: italic; }

/* 右侧指法图 */
.fingering {
  width: 220px; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
  padding: 16px; display: flex; flex-direction: column; gap: 12px;
}
.fingering-title { font-size: 13px; font-weight: 600; text-align: center; color: #b8c6db; }
.fingering-canvas-wrap {
  width: 100%; height: 320px;
  background: rgba(0,0,0,0.2); border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}

/* 底部状态 */
footer {
  padding: 12px 24px; background: rgba(255,255,255,0.05);
  border-top: 1px solid rgba(255,255,255,0.1);
  display: flex; justify-content: space-between; align-items: center;
  font-size: 13px; color: #8a9ab8;
}
.demo-note { color: #4ecca3; font-size: 12px; }

@media (max-width: 900px) {
  main { flex-direction: column; }
  .sidebar, .fingering { width: 100%; }
  .coach { flex-direction: column; }
}
</style>
</head>
<body>

<!-- 开屏 -->
<div id="splash">
  <div class="splash-content">
    <div class="splash-logo">🎵</div>
    <h1>乐器学习助手</h1>
    <p>让初学者零门槛上手多种乐器</p>
    <div class="cards" id="cards"></div>
    <button class="enter-btn" id="enterBtn" disabled>进入体验 →</button>
  </div>
</div>

<!-- 主界面 -->
<div id="app">
  <header>
    <div class="logo">
      <span class="logo-icon">🎵</span>
      <span class="logo-text">乐器学习助手</span>
      <span class="inst-badge" id="instBadge" onclick="backToSplash()">· 🎸 吉他 ▾</span>
    </div>
    <div style="font-size:12px;color:#8a9ab8;">创意演示版</div>
  </header>

  <main>
    <!-- 左侧曲谱 -->
    <div class="sidebar">
      <div class="panel-title">曲谱列表</div>
      <ul class="score-list" id="scoreList"></ul>
      <div class="panel-title" style="margin-top:16px;">功能演示</div>
      <div style="font-size:12px;color:#b8c6db;line-height:1.8;">
        • 开屏选择乐器<br>
        • 实时指法图切换<br>
        • 三段式演奏指导<br>
        • 曲谱音域过滤<br>
        • 点击指法图试听
      </div>
    </div>

    <!-- 中央 -->
    <div class="center">
      <div class="staff-area">
        <canvas id="staffCanvas" class="staff-canvas"></canvas>
        <div class="staff-empty" id="staffEmpty">请从左侧选择一首曲谱开始练习</div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="playBtn" onclick="togglePlay()">开始演奏</button>
        <button class="btn btn-secondary" onclick="autoPlay()">自动演示</button>
      </div>

      <!-- 指导面板 -->
      <div class="coach" id="coach" style="display:none;">
        <div class="coach-section">
          <div class="coach-label">♪ 当前音</div>
          <div class="coach-target" id="curNote">--</div>
          <div class="coach-feedback" id="curFeedback">等待演奏</div>
        </div>
        <div class="coach-section">
          <div class="coach-label">▶ 下一个音</div>
          <div class="coach-next" id="nextNote">--</div>
          <div class="coach-hint" id="nextHint">--</div>
        </div>
        <div class="coach-section">
          <div class="coach-label">💡 智能提示</div>
          <div class="coach-tip" id="tipText">保持节奏稳定</div>
        </div>
      </div>
    </div>

    <!-- 右侧指法图 -->
    <div class="fingering">
      <div class="fingering-title" id="fingeringTitle">吉他指板</div>
      <div class="fingering-canvas-wrap">
        <canvas id="fingeringCanvas" width="180" height="300" style="width:180px;height:300px;"></canvas>
      </div>
      <div style="font-size:11px;color:#8a9ab8;text-align:center;line-height:1.5;">
        点击指法图上的位置<br>可试听对应音符
      </div>
    </div>
  </main>

  <footer>
    <span>当前乐器：<span id="footerInst">吉他</span></span>
    <span class="demo-note">★ 此为创意演示，完整版支持麦克风实时识别</span>
  </footer>
</div>

<script>
// ===== 乐器配置 =====
const INSTRUMENTS = {
  guitar: {
    id:'guitar', name:'吉他', icon:'🎸', desc:'6弦拨弦乐器',
    range:'E2 - E6', clef:'treble',
    strings:[{n:'E',o:2,f:82.41},{n:'A',o:2,f:110},{n:'D',o:3,f:146.83},{n:'G',o:3,f:196},{n:'B',o:3,f:246.94},{n:'E',o:4,f:329.63}],
  },
  piano: {
    id:'piano', name:'钢琴', icon:'🎹', desc:'88键键盘乐器',
    range:'A0 - C8', clef:'grand',
    keys:[{n:'C',o:4,f:261.63},{n:'D',o:4,f:293.66},{n:'E',o:4,f:329.63},{n:'F',o:4,f:349.23},{n:'G',o:4,f:392},{n:'A',o:4,f:440},{n:'B',o:4,f:493.88},{n:'C',o:5,f:523.25}],
  },
  flute: {
    id:'flute', name:'笛子', icon:'🎶', desc:'六孔竹笛',
    range:'C4 - D6', clef:'treble',
    holes:{
      'C4':[1,1,1,1,1,1],'D4':[1,1,1,1,1,0],'E4':[1,1,1,1,0,0],
      'F4':[1,1,1,0,0,0],'G4':[1,1,0,0,0,0],'A4':[1,0,0,0,0,0],
      'B4':[0,0,0,0,0,0],'C5':[1,1,1,1,1,1],'D5':[1,1,1,1,1,0],
    }
  }
};

// ===== 曲谱 =====
const SCORES = [
  { id:'twinkle', title:'小星星', tempo:100, notes:[
    {n:'C',o:4},{n:'C',o:4},{n:'G',o:4},{n:'G',o:4},{n:'A',o:4},{n:'A',o:4},{n:'G',o:4,d:2},
    {n:'F',o:4},{n:'F',o:4},{n:'E',o:4},{n:'E',o:4},{n:'D',o:4},{n:'D',o:4},{n:'C',o:4,d:2},
  ]},
  { id:'ode', title:'欢乐颂', tempo:120, notes:[
    {n:'E',o:4},{n:'E',o:4},{n:'F',o:4},{n:'G',o:4},{n:'G',o:4},{n:'F',o:4},{n:'E',o:4},{n:'D',o:4},
    {n:'C',o:4},{n:'C',o:4},{n:'D',o:4},{n:'E',o:4},{n:'E',o:4,d:1.5},{n:'D',o:4,d:0.5},{n:'D',o:4,d:2},
  ]},
  { id:'birthday', title:'生日快乐', tempo:110, notes:[
    {n:'C',o:4},{n:'C',o:4},{n:'D',o:4},{n:'C',o:4},{n:'F',o:4},{n:'E',o:4,d:2},
    {n:'C',o:4},{n:'C',o:4},{n:'D',o:4},{n:'C',o:4},{n:'G',o:4},{n:'F',o:4,d:2},
  ]},
  { id:'mary', title:'玛丽有只小羊羔', tempo:100, notes:[
    {n:'E',o:4},{n:'D',o:4},{n:'C',o:4},{n:'D',o:4},{n:'E',o:4},{n:'E',o:4},{n:'E',o:4,d:2},
    {n:'D',o:4},{n:'D',o:4},{n:'D',o:4,d:2},{n:'E',o:4},{n:'G',o:4},{n:'G',o:4,d:2},
  ]},
];

// ===== 状态 =====
let currentInst = INSTRUMENTS.guitar;
let currentScore = null;
let noteIndex = 0;
let isPlaying = false;
let autoTimer = null;

// ===== 开屏 =====
function initSplash() {
  const container = document.getElementById('cards');
  Object.values(INSTRUMENTS).forEach(inst => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = inst.id;
    card.innerHTML = `
      <div class="card-icon">${inst.icon}</div>
      <div class="card-name">${inst.name}</div>
      <div class="card-desc">${inst.desc}</div>
      <div class="card-range">${inst.range}</div>
    `;
    card.onclick = () => selectInstrument(inst.id);
    container.appendChild(card);
  });
}

function selectInstrument(id) {
  document.querySelectorAll('.card').forEach(c => {
    c.classList.toggle('selected', c.dataset.id === id);
  });
  document.getElementById('enterBtn').disabled = false;
  currentInst = INSTRUMENTS[id];
}

document.getElementById('enterBtn').onclick = () => {
  if (!currentInst) return;
  document.getElementById('splash').classList.add('hide');
  document.getElementById('app').classList.add('show');
  updateInstrumentUI();
  renderScoreList();
  drawFingering();
  setTimeout(() => { document.getElementById('splash').style.display = 'none'; }, 500);
};

function backToSplash() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  if (isPlaying) togglePlay();
  document.getElementById('splash').style.display = 'flex';
  document.getElementById('splash').classList.remove('hide');
  document.getElementById('app').classList.remove('show');
}

function updateInstrumentUI() {
  const badge = document.getElementById('instBadge');
  badge.textContent = '· ' + currentInst.icon + ' ' + currentInst.name + ' ▾';
  document.getElementById('fingeringTitle').textContent = currentInst.name + '指法';
  document.getElementById('footerInst').textContent = currentInst.name;
  renderScoreList();
  drawFingering();
}

// ===== 曲谱列表（按音域过滤） =====
function inRange(note, octave) {
  // 简化：所有内置曲谱音域 C4-C5，三个乐器都支持
  return octave >= 4 && octave <= 5;
}

function renderScoreList() {
  const list = document.getElementById('scoreList');
  list.innerHTML = '';
  SCORES.forEach(s => {
    const playable = s.notes.every(n => inRange(n.n, n.o));
    if (!playable) return;
    const li = document.createElement('li');
    li.className = 'score-item' + (currentScore && currentScore.id === s.id ? ' active' : '');
    li.innerHTML = `<div>${s.title}</div><div class="score-tempo">${s.tempo} BPM · ${s.notes.length}音符</div>`;
    li.onclick = () => loadScore(s);
    list.appendChild(li);
  });
}

function loadScore(score) {
  if (isPlaying) togglePlay();
  currentScore = score;
  noteIndex = 0;
  renderScoreList();
  document.getElementById('staffEmpty').style.display = 'none';
  drawStaff();
  if (currentInst) drawFingering(currentScore.notes[0]);
}

// ===== 五线谱绘制（简化） =====
function drawStaff() {
  const canvas = document.getElementById('staffCanvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, rect.width, rect.height);

  if (!currentScore) return;

  // 五线
  const staffTop = 60, lineGap = 12;
  ctx.strokeStyle = '#b8c6db'; ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    const y = staffTop + i * lineGap;
    ctx.beginPath(); ctx.moveTo(40, y); ctx.lineTo(rect.width - 40, y); ctx.stroke();
  }
  // 高音谱号
  ctx.fillStyle = '#b8c6db'; ctx.font = '40px serif'; ctx.textAlign = 'left';
  ctx.fillText('𝄞', 45, staffTop + 35);

  // 音符
  const notePositions = { 'C4':85, 'D4':79, 'E4':73, 'F4':67, 'G4':61, 'A4':55, 'B4':49, 'C5':43 };
  const total = currentScore.notes.length;
  const startX = 90, endX = rect.width - 60;
  const step = (endX - startX) / Math.max(total - 1, 1);

  currentScore.notes.forEach((n, i) => {
    const x = startX + i * step;
    const key = n.n + n.o;
    const y = notePositions[key] || 70;
    const isCurrent = i === noteIndex && isPlaying;
    const isPassed = i < noteIndex && isPlaying;

    // 音符头
    ctx.fillStyle = isCurrent ? '#4ecca3' : (isPassed ? '#5a8a6a' : '#fff');
    ctx.beginPath(); ctx.ellipse(x, y, 6, 4.5, -0.3, 0, Math.PI * 2); ctx.fill();

    // 符干
    ctx.strokeStyle = isCurrent ? '#4ecca3' : (isPassed ? '#5a8a6a' : '#fff');
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x + 5, y); ctx.lineTo(x + 5, y - 30); ctx.stroke();

    // 音名标签（当前音）
    if (isCurrent) {
      ctx.fillStyle = '#4ecca3'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(n.n + n.o, x, y + 20);
    }
  });
}

// ===== 指法图绘制 =====
function drawFingering(targetNote) {
  const canvas = document.getElementById('fingeringCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 180, 300);

  ctx.fillStyle = '#b8c6db'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';

  if (currentInst.id === 'guitar') drawGuitar(ctx, targetNote);
  else if (currentInst.id === 'piano') drawPiano(ctx, targetNote);
  else if (currentInst.id === 'flute') drawFlute(ctx, targetNote);
}

function drawGuitar(ctx, target) {
  const cx = 90;
  // 指板
  ctx.fillStyle = '#3a2818';
  ctx.fillRect(cx - 35, 50, 70, 220);
  ctx.strokeStyle = '#8a6a30'; ctx.lineWidth = 1;
  ctx.strokeRect(cx - 35, 50, 70, 220);

  // 品丝
  for (let i = 1; i <= 5; i++) {
    const y = 50 + i * 40;
    ctx.strokeStyle = '#a88840'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx - 35, y); ctx.lineTo(cx + 35, y); ctx.stroke();
  }
  // 弦
  const stringX = [cx-25, cx-15, cx-5, cx+5, cx+15, cx+25];
  for (let s = 0; s < 6; s++) {
    ctx.strokeStyle = '#c0c0c0'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(stringX[s], 50); ctx.lineTo(stringX[s], 270); ctx.stroke();
  }
  // 弦名
  ctx.fillStyle = '#8a9ab8'; ctx.font = '9px sans-serif';
  ['6E','5A','4D','3G','2B','1e'].forEach((l, i) => {
    ctx.fillText(l, stringX[i], 285);
  });

  // 目标音位置
  if (target) {
    const STRING_NOTES = ['E','A','D','G','B','E'];
    const STRING_OCT = [2,2,3,3,3,4];
    const SEMI = {'C':0,'D':2,'E':4,'F':5,'G':7,'A':9,'B':11};
    const targetSemi = (SEMI[target.n] || 0) + target.o * 12;
    for (let s = 0; s < 6; s++) {
      const openSemi = (SEMI[STRING_NOTES[s]] || 0) + STRING_OCT[s] * 12;
      for (let f = 0; f <= 5; f++) {
        if (openSemi + f === targetSemi) {
          const x = stringX[s];
          const y = f === 0 ? 40 : 50 + f * 40 - 20;
          ctx.fillStyle = '#4ecca3';
          ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
          ctx.fillStyle = '#4ecca3'; ctx.font = 'bold 10px sans-serif';
          ctx.fillText(target.n + target.o, cx, 20);
          return;
        }
      }
    }
  }
}

function drawPiano(ctx, target) {
  const whiteNotes = ['C','D','E','F','G','A','B'];
  const whiteW = 22;
  const startX = 12;
  // 白键
  whiteNotes.forEach((n, i) => {
    const x = startX + i * whiteW;
    const isTarget = target && target.n === n;
    ctx.fillStyle = isTarget ? '#4ecca3' : '#fff';
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
    ctx.fillRect(x, 80, whiteW - 1, 180);
    ctx.strokeRect(x, 80, whiteW - 1, 180);
    ctx.fillStyle = '#666'; ctx.font = '9px sans-serif';
    ctx.fillText(n, x + whiteW/2 - 0.5, 255);
  });
  // 黑键
  const blackOffsets = [1,2,4,5,6];
  const blackNotes = ['C#','D#','F#','G#','A#'];
  blackOffsets.forEach((o, i) => {
    const x = startX + o * whiteW - 7;
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(x, 80, 14, 110);
  });
  // 中央C标记
  ctx.fillStyle = '#8a9ab8'; ctx.font = '9px sans-serif';
  ctx.fillText('C4', startX + whiteW/2 - 0.5, 270);

  if (target) {
    ctx.fillStyle = '#4ecca3'; ctx.font = 'bold 10px sans-serif';
    ctx.fillText(target.n + target.o, 90, 70);
  }
}

function drawFlute(ctx, target) {
  const cx = 90;
  // 笛身
  ctx.fillStyle = '#e8d8a8'; ctx.strokeStyle = '#8a6a30'; ctx.lineWidth = 1;
  ctx.fillRect(15, 140, 150, 24);
  ctx.strokeRect(15, 140, 150, 24);

  // 吹孔、膜孔
  ctx.fillStyle = '#5a3a18';
  ctx.beginPath(); ctx.arc(30, 152, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(48, 152, 3, 0, Math.PI * 2); ctx.fill();

  // 6个指孔
  const holesX = [80, 100, 120, 140, 155, 165];
  const targetFingering = target && currentInst.holes[target.n + target.o];

  for (let i = 0; i < 6; i++) {
    const x = holesX[i];
    const closed = targetFingering ? targetFingering[i] : null;
    if (closed === 1) {
      ctx.fillStyle = '#4ecca3';
      ctx.beginPath(); ctx.arc(x, 152, 6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
    } else if (closed === 0) {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x, 152, 6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#4ecca3'; ctx.lineWidth = 2; ctx.stroke();
    } else {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x, 152, 6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#5a3a18'; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.fillStyle = '#8a9ab8'; ctx.font = '8px sans-serif';
    ctx.fillText(i+1, x, 175);
  }

  ctx.fillStyle = '#8a9ab8'; ctx.font = '8px sans-serif';
  ctx.fillText('吹', 30, 130); ctx.fillText('膜', 48, 130);

  if (target) {
    ctx.fillStyle = '#4ecca3'; ctx.font = 'bold 11px sans-serif';
    ctx.fillText(target.n + target.o, cx, 125);
  }
  ctx.fillStyle = '#8a9ab8'; ctx.font = '9px sans-serif';
  ctx.fillText('● 按住  ○ 打开', cx, 200);
}

// ===== 指法图点击试听 =====
document.getElementById('fingeringCanvas').onclick = (e) => {
  const canvas = document.getElementById('fingeringCanvas');
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (180 / rect.width);
  const y = (e.clientY - rect.top) * (300 / rect.height);
  let note = null;

  if (currentInst.id === 'guitar' && y >= 50 && y <= 270) {
    const cx = 90;
    const stringX = [cx-25, cx-15, cx-5, cx+5, cx+15, cx+25];
    let minDist = Infinity, sel = -1;
    stringX.forEach((sx, i) => { const d = Math.abs(x - sx); if (d < minDist) { minDist = d; sel = i; } });
    if (minDist < 15) {
      const fret = Math.max(0, Math.round((y - 50) / 40 - 0.5));
      const STRING_NOTES = ['E','A','D','G','B','E'];
      const STRING_OCT = [2,2,3,3,3,4];
      const SEMI = {'C':0,'D':2,'E':4,'F':5,'G':7,'A':9,'B':11};
      const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
      const openSemi = SEMI[STRING_NOTES[sel]] + STRING_OCT[sel] * 12;
      const newSemi = (openSemi + fret) % 12;
      const oct = STRING_OCT[sel] + Math.floor((openSemi + fret) / 12);
      note = { n: NAMES[newSemi], o: oct };
    }
  } else if (currentInst.id === 'piano' && y >= 80 && y <= 260) {
    const whiteW = 22, startX = 12;
    const idx = Math.floor((x - startX) / whiteW);
    const whiteNotes = ['C','D','E','F','G','A','B'];
    if (idx >= 0 && idx < 7) note = { n: whiteNotes[idx], o: 4 };
  }

  if (note) {
    playNote(note);
    drawFingering(note);
    document.getElementById('curNote').textContent = note.n + note.o;
    document.getElementById('curFeedback').textContent = '试听中';
    document.getElementById('curFeedback').className = 'coach-feedback good';
  }
};

// ===== 播放音符 =====
function playNote(note) {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const SEMI = {'C':0,'C#':1,'D':2,'D#':3,'E':4,'F':5,'F#':6,'G':7,'G#':8,'A':9,'A#':10,'B':11};
    const semi = (SEMI[note.n] !== undefined ? SEMI[note.n] : 0) + (note.o - 4) * 12;
    const freq = 440 * Math.pow(2, (semi - 9) / 12);
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.6);
  } catch(e) { console.error(e); }
}

// ===== 演奏控制 =====
function togglePlay() {
  if (!currentScore) { alert('请先选择一首曲谱'); return; }
  if (isPlaying) {
    isPlaying = false;
    document.getElementById('playBtn').textContent = '开始演奏';
    document.getElementById('playBtn').classList.remove('playing');
    document.getElementById('coach').style.display = 'none';
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    noteIndex = 0;
    drawStaff();
  } else {
    isPlaying = true;
    noteIndex = 0;
    document.getElementById('playBtn').textContent = '停止演奏';
    document.getElementById('playBtn').classList.add('playing');
    document.getElementById('coach').style.display = 'flex';
    updateCoach();
    drawStaff();
  }
}

function autoPlay() {
  if (!currentScore) { alert('请先选择一首曲谱'); return; }
  if (!isPlaying) togglePlay();
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; return; }
  autoTimer = setInterval(() => {
    if (noteIndex >= currentScore.notes.length) {
      clearInterval(autoTimer); autoTimer = null;
      setTimeout(() => { if (isPlaying) togglePlay(); }, 500);
      return;
    }
    const note = currentScore.notes[noteIndex];
    playNote(note);
    drawFingering(note);
    // 模拟反馈
    const feedback = document.getElementById('curFeedback');
    feedback.textContent = '✓ 准确';
    feedback.className = 'coach-feedback good';
    noteIndex++;
    updateCoach();
    drawStaff();
    if (noteIndex >= currentScore.notes.length) {
      document.getElementById('curNote').textContent = '完成';
      document.getElementById('curFeedback').textContent = '🎉 演奏完成';
    }
  }, 700);
}

function updateCoach() {
  if (!currentScore || !isPlaying) return;
  const notes = currentScore.notes;
  if (noteIndex >= notes.length) return;

  const cur = notes[noteIndex];
  const next = notes[noteIndex + 1];

  document.getElementById('curNote').textContent = cur.n + cur.o;
  const fb = document.getElementById('curFeedback');
  fb.textContent = '演奏中...';
  fb.className = 'coach-feedback';

  if (next) {
    document.getElementById('nextNote').textContent = next.n + next.o;
    document.getElementById('nextHint').textContent = getHint(next);
  } else {
    document.getElementById('nextNote').textContent = '曲终';
    document.getElementById('nextHint').textContent = '即将完成';
  }

  const tips = ['保持节奏稳定', '注意指法准确', '放松手腕', '气息平稳', '注意音准'];
  document.getElementById('tipText').textContent = tips[noteIndex % tips.length];
}

function getHint(note) {
  if (currentInst.id === 'guitar') {
    const STRING_NOTES = ['E','A','D','G','B','E'];
    const STRING_OCT = [2,2,3,3,3,4];
    const SEMI = {'C':0,'D':2,'E':4,'F':5,'G':7,'A':9,'B':11};
    const targetSemi = (SEMI[note.n] || 0) + note.o * 12;
    for (let s = 0; s < 6; s++) {
      const openSemi = (SEMI[STRING_NOTES[s]] || 0) + STRING_OCT[s] * 12;
      for (let f = 0; f <= 5; f++) {
        if (openSemi + f === targetSemi) {
          return (6-s) + '弦 ' + (f === 0 ? '空弦' : f + '品');
        }
      }
    }
    return note.n + note.o;
  } else if (currentInst.id === 'piano') {
    const isBlack = note.n.includes('#');
    return isBlack ? '黑键' : '白键';
  } else if (currentInst.id === 'flute') {
    const f = currentInst.holes[note.n + note.o];
    if (f) {
      const closed = f.filter(x => x).length;
      return closed + '按 ' + (6 - closed) + '开';
    }
    return note.n + note.o;
  }
  return '';
}

// ===== 初始化 =====
initSplash();
window.addEventListener('resize', () => { if (currentScore) drawStaff(); });
