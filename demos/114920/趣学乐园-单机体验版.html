<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>趣学乐园 — 单机体验版</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
:root { --primary: #667eea; --accent: #f093fb; --green: #28a745; --orange: #ff9800; }
.container { max-width: 520px; margin: 0 auto; padding: 16px; }
.title { text-align: center; color: #fff; font-size: 22px; margin: 8px 0 14px; font-weight: 600; letter-spacing: 1px; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
.game-btn { padding: 10px 16px; border: none; border-radius: 20px; background: rgba(255,255,255,0.95); color: #333; font-size: 14px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.15); transition: all .2s; }
.game-btn.active { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102,126,234,.4); }
.diff-btn { padding: 6px 14px; border: 2px solid rgba(255,255,255,.5); border-radius: 16px; background: transparent; color: #fff; font-size: 13px; cursor: pointer; }
.diff-btn.active { background: rgba(255,255,255,.2); border-color: #fff; }
.hud-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: rgba(255,255,255,.95); border-radius: 10px; margin-bottom: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
.hud-item { font-size: 14px; font-weight: 600; color: #333; }
.hud-item.score { color: var(--primary); }
.hud-item.combo { color: var(--orange); }
.sound-toggle { font-size: 20px; cursor: pointer; user-select: none; }
.canvas-wrap { position: relative; background: #f5f7fa; border-radius: 14px; padding: 8px; box-shadow: inset 0 0 0 1px #e3e8ee, 0 4px 12px rgba(0,0,0,.1); display: flex; justify-content: center; overflow: hidden; }
#gameCanvas { display: block; max-width: 100%; height: auto; border-radius: 8px; touch-action: none; background: #f5f7fa; }
.result-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.75); display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; border-radius: 14px; z-index: 5; }
.result-overlay.show { display: flex; }
.result-overlay .big { font-size: 26px; font-weight: bold; margin-bottom: 8px; }
.result-overlay .stat { font-size: 15px; opacity: .95; margin: 3px 0; }
.result-overlay .stars { font-size: 26px; color: #ffd700; margin: 8px 0; letter-spacing: 4px; }
.result-btn { margin-top: 14px; padding: 10px 24px; border: none; border-radius: 22px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; font-size: 14px; cursor: pointer; }
.breath-overlay { position: absolute; inset: 0; background: rgba(20,30,60,.85); display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; border-radius: 14px; z-index: 6; }
.breath-overlay.show { display: flex; }
.breath-circle { width: 100px; height: 100px; border-radius: 50%; background: rgba(255,255,255,.15); border: 2px solid rgba(255,255,255,.4); display: flex; align-items: center; justify-content: center; margin-bottom: 14px; animation: breath 4s ease-in-out infinite; }
@keyframes breath { 0%,100% { transform: scale(.75); } 50% { transform: scale(1.1); } }
.hint { text-align: center; font-size: 12px; color: rgba(255,255,255,.8); margin-top: 10px; }
</style>
</head>
<body>
<div class="container">
  <div class="title">趣学乐园 — 单机体验版</div>

  <div class="controls">

      <div class="big" id="resultTitle">完成啦！</div>
      <div class="stars" id="resultStars">★ ★ ★</div>

      <div class="stat" id="resultAccuracy"></div>

      <button class="result-btn" id="resultBtn">再来一局</button>
    </div>
  </div>
  <div class="hint">拼音炮台：点击声母+韵母发射 | 记忆翻牌：翻开配对 | 连连看：点击两个节点连线</div>
</div>

<script>
/* ============================================================
 *  趣学乐园 单机体验版 — 拼音炮台 / 记忆翻牌 / 连连看
 *  忠实还原项目核心机制，难度分级（简单/普通/困难）
 * ============================================================ */

// ===== 难度配置 =====
const DIFF_CONFIG = {
  easy: { pairs: 4, previewSec: 4, difficultyBase: 0.8, maxOnScreen: 3, hint: true },
  normal: { pairs: 6, previewSec: 3, difficultyBase: 1.0, maxOnScreen: 4, hint: false },
  hard: { pairs: 8, previewSec: 2, difficultyBase: 1.3, maxOnScreen: 5, hint: false },
};

// ===== 汉字拼音数据 =====
const PINYIN_DATA = [
  { char: '人', py: 'rén', initial: 'r', final: 'en' },
  { char: '山', py: 'shān', initial: 'sh', final: 'an' },
  { char: '水', py: 'shuǐ', initial: 'sh', final: 'ui' },
  { char: '火', py: 'huǒ', initial: 'h', final: 'uo' },
  { char: '天', py: 'tiān', initial: 't', final: 'ian' },
  { char: '地', py: 'dì', initial: 'd', final: 'i' },
  { char: '上', py: 'shàng', initial: 'sh', final: 'ang' },
  { char: '下', py: 'xià', initial: 'x', final: 'ia' },
  { char: '中', py: 'zhōng', initial: 'zh', final: 'ong' },
  { char: '大', py: 'dà', initial: 'd', final: 'a' },
  { char: '小', py: 'xiǎo', initial: 'x', final: 'iao' },
  { char: '月', py: 'yuè', initial: 'y', final: 'ue' },
  { char: '日', py: 'rì', initial: 'r', final: 'i' },
  { char: '口', py: 'kǒu', initial: 'k', final: 'ou' },
  { char: '目', py: 'mù', initial: 'm', final: 'u' },
  { char: '耳', py: 'ěr', initial: '', final: 'er' },
  { char: '手', py: 'shǒu', initial: 'sh', final: 'ou' },
  { char: '足', py: 'zú', initial: 'z', final: 'u' },
  { char: '风', py: 'fēng', initial: 'f', final: 'eng' },
  { char: '雨', py: 'yǔ', initial: 'y', final: 'u' },
];

// ===== 工具函数 =====
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pickN(arr, n) { return shuffle(arr).slice(0, n); }
function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function generateEvenPositions(cols, rows, count) {
  const positions = [];
  const base = Math.floor(count / cols);
  const extra = count % cols;
  const colCounts = new Array(cols).fill(base);
  for (let i = 0; i < extra; i++) colCounts[i]++;
  for (let x = 0; x < cols; x++) {
    const rowIndices = [];
    for (let y = 0; y < rows; y++) rowIndices.push(y);
    const shuffledRows = shuffle(rowIndices);
    for (let i = 0; i < colCounts[x]; i++) {
      positions.push({ x, y: shuffledRows[i] });
    }
  }
  return shuffle(positions);
}

// ===== 游戏引擎基类 =====
class GameEngine {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.isRunning = false;
    this.rafId = 0;
    this.lastTime = 0;
    this.score = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.correctCount = 0;
    this.totalCount = 0;
    this.consecutiveWrong = 0;
    this.particles = [];
    this.floatTexts = [];
    this.focusMode = true;
    this.difficulty = 1.0;
    this.difficultyBaseline = 1.0;
    this.breathBreakTriggered = false;
    this.onEnd = null;
  }
  getScore() { return this.score; }
  isFinished() { return !this.isRunning || this.gameFinished === true; }

  static audioCtx = null;
  static soundEnabled = true;
  playSound(type) {
    if (!GameEngine.soundEnabled) return;
    try {
      if (!GameEngine.audioCtx) GameEngine.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = GameEngine.audioCtx;
      if (ctx.state === 'suspended') ctx.resume();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      const now = ctx.currentTime;
      if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523, now);
        osc.frequency.setValueAtTime(659, now + 0.08);
        osc.frequency.setValueAtTime(784, now + 0.16);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        const freq = this.consecutiveWrong >= 2 ? 150 : 200;
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.5, now + 0.15);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
      } else if (type === 'combo') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(880 + this.combo * 50, now);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
      } else if (type === 'complete') {
        osc.type = 'sine';
        [523, 659, 784, 1047].forEach((f, i) => osc.frequency.setValueAtTime(f, now + i * 0.12));
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc.start(now); osc.stop(now + 0.5);
      } else if (type === 'click') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(660, now);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
      } else if (type === 'pop') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      }
    } catch (e) {}
  }

  get effectiveMaxParticles() { return this.focusMode ? 80 : 200; }
  spawnParticles(x, y, count, colors) {
    colors = colors || ['#4caf50', '#66bb6a', '#81c784'];
    if (this.particles.length >= this.effectiveMaxParticles) return;
    const adj = this.focusMode ? Math.ceil(count / 2) : count;
    const n = Math.min(adj, this.effectiveMaxParticles - this.particles.length);
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 * i) / n + Math.random() * 0.5;
      const speed = 80 + Math.random() * 120;
      this.particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 30, life: 0, maxLife: 0.4 + Math.random() * 0.3, size: 3 + Math.random() * 4, color: colors[Math.floor(Math.random() * colors.length)], gravity: 300 });
    }
  }
  updateParticles(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.life += dt;
      if (p.life >= p.maxLife) { this.particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += p.gravity * dt; p.vx *= 0.96;
    }
  }
  renderParticles() {
    const ctx = this.ctx;
    for (const p of this.particles) {
      const alpha = 1 - (p.life / p.maxLife);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(0.1, p.size * alpha), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  spawnFloatText(x, y, text, color) {
    color = color || '#4caf50';
    if (this.floatTexts.length >= 20) return;
    this.floatTexts.push({ x, y, text, color, life: 0, maxLife: 1.0, vy: -60 });
  }
  updateFloatTexts(dt) {
    for (let i = this.floatTexts.length - 1; i >= 0; i--) {
      const ft = this.floatTexts[i];
      ft.life += dt;
      if (ft.life >= ft.maxLife) { this.floatTexts.splice(i, 1); continue; }
      ft.y += ft.vy * dt;
    }
  }
  renderFloatTexts() {
    const ctx = this.ctx;
    for (const ft of this.floatTexts) {
      const alpha = 1 - (ft.life / ft.maxLife);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = ft.color;
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha = 1;
  }

  updateDifficulty() {
    if (this.consecutiveWrong === 0) {
      const ramp = Math.floor(this.correctCount / 3);
      this.difficulty = Math.min(2.0, this.difficultyBaseline + ramp * 0.1);
    } else if (this.consecutiveWrong === 1) {
      this.difficulty = Math.max(0.7, this.difficulty - 0.2);
    } else {
      this.difficulty = Math.max(0.7, this.difficulty - 0.3);
    }
  }
  shouldTriggerBreathBreak() {
    if (this.consecutiveWrong >= 3 && !this.breathBreakTriggered) {
      this.breathBreakTriggered = true;
      return true;
    }
    return false;
  }
  onBreathBreakComplete() {
    this.consecutiveWrong = 0;
    this.breathBreakTriggered = false;
    this.difficulty = Math.max(0.7, this.difficulty - 0.3);
  }

  recordAnswer(kpId, isCorrect, responseTime, answer) {
    if (isCorrect) {
      this.correctCount++;
      this.combo++;
      this.maxCombo = Math.max(this.maxCombo, this.combo);
      this.consecutiveWrong = 0;
      this.spawnFloatText(this.canvas.width / 2, this.canvas.height * 0.25, '✓', '#4caf50');
      if (this.combo >= 3) this.playSound('combo'); else this.playSound('correct');
    } else {
      this.combo = 0;
      this.consecutiveWrong++;
      this.playSound('wrong');
      if (this.consecutiveWrong >= 2) {
        const words = ['没关系~', '差一点点', '下次一定行'];
        this.spawnFloatText(this.canvas.width / 2, this.canvas.height * 0.25, words[Math.min(this.consecutiveWrong - 2, 2)], '#ff9800');
      }
    }
    this.totalCount++;
    this.updateDifficulty();
    if (this.shouldTriggerBreathBreak() && typeof onBreathTrigger === 'function') onBreathTrigger(this);
  }

  start(data) {
    this.gameData = data;
    this.onInit(data);
    this.isRunning = true;
    this.lastTime = performance.now();
    this.loop = (ts) => {
      if (!this.isRunning) return;
      if (this.paused) { this.rafId = requestAnimationFrame(this.loop); return; }
      const dt = Math.min((ts - this.lastTime) / 1000, 0.1);
      this.lastTime = ts;
      this.onUpdate(dt);
      this.updateFloatTexts(dt);
      this.onRender();
      this.renderFloatTexts();
      this.rafId = requestAnimationFrame(this.loop);
    };
    this.rafId = requestAnimationFrame(this.loop);
  }
  stop() {
    this.isRunning = false;
    cancelAnimationFrame(this.rafId);
    if (this.onEnd) this.onEnd();
  }
  pause() { this.paused = true; }
  resume() { this.paused = false; this.lastTime = performance.now(); }
  onInit(data) {}
  onUpdate(dt) {}
  onRender() {}
  onPointerDown(x, y) {}
  roundRect(ctx, x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }
}

// ===== 拼音炮台引擎 =====
class PinyinCannonEngine extends GameEngine {
  onInit(data) {
    this.CW = 480; this.CH = 640;
    this.canvas.width = this.CW; this.canvas.height = this.CH;
    this.canvas.style.aspectRatio = `${this.CW} / ${this.CH}`;
    this.hudH = 40;
    this.skyH = 300;
    this.cannonY = this.CH - 180;
    this.keyboardY = this.CH - 150;
    
    this.targets = data.targets || [];
    this.pyMap = new Map();
    for (const t of this.targets) {
      const key = (t.initial || '') + '|' + t.final;
      this.pyMap.set(key, t.py);
    }
    this.bubbles = [];
    this.bullets = [];
    this.assembly = [{ type: 'initial', value: null }, { type: 'final', value: null }];
    this.collected = new Set();
    this.keys = [];
    this.elapsedTime = 0;
    this.wrongHintTimer = 0;
    this.answerStartTime = performance.now() / 1000;
    this.gameFinished = false;
    this.batchIndex = 0;
    this.batchTargets = [];
    
    // 批次启动
    this.startBatch(0);
    
    if (this.targets.length === 0) this.gameFinished = true;
    
    const handler = (e) => {
      const rect = this.canvas.getBoundingClientRect();
      const sx = this.canvas.width / rect.width, sy = this.canvas.height / rect.height;
      this.onPointerDown((e.clientX - rect.left) * sx, (e.clientY - rect.top) * sy);
    };
    this.pointerDownHandler = handler;
    this.canvas.addEventListener('pointerdown', handler);
  }
  
  startBatch(index) {
    this.batchIndex = index;
    const remaining = this.targets.filter(t => !this.collected.has(t.id));
    const batchSize = Math.min(Math.max(3, 3 + index), 5, remaining.length);
    this.batchTargets = remaining.slice(0, batchSize);
    
    this.bubbles = [];
    for (let i = 0; i < this.batchTargets.length; i++) {
      const t = this.batchTargets[i];
      const slot = i;
      const spacing = this.CW / (this.batchTargets.length + 1);
      this.bubbles.push({
        ...t,
        state: 'floating',
        x: spacing * (slot + 1),
        y: 80 + (slot % 3) * 40,
        baseX: spacing * (slot + 1),
        baseY: 80 + (slot % 3) * 40,
        phase: i * 0.7,
      });
    }
    this.layoutKeys();
  }
  
  layoutKeys() {
    this.keys = [];
    const batchInitials = new Set(), batchFinals = new Set();
    const finalToneMap = new Map();
    for (const t of this.batchTargets) {
      if (t.initial) batchInitials.add(t.initial);
      if (t.final) {
        batchFinals.add(t.final);
        const toneFinal = t.initial ? t.py.slice(t.initial.length) : t.py;
        finalToneMap.set(t.final, toneFinal);
      }
    }
    // 声母行
    const initials = Array.from(batchInitials).sort();
    if (initials.length > 0) this.layoutRow(initials, 0, 'initial', null);
    // 韵母行（带声调）
    const finals = Array.from(batchFinals).sort();
    if (finals.length > 0) this.layoutRow(finals, initials.length > 0 ? 1 : 0, 'final', finalToneMap);
  }
  
  layoutRow(keys, rowIdx, type, toneMap) {
    const y = this.keyboardY + rowIdx * 50;
    const widths = keys.map(k => {
      const display = toneMap ? (toneMap.get(k) || k) : k;
      return display.length === 1 ? 56 : display.length === 2 ? 72 : 88;
    });
    const totalW = widths.reduce((a, b) => a + b, 0) + (keys.length - 1) * 4;
    let x = (this.CW - totalW) / 2;
    for (let i = 0; i < keys.length; i++) {
      const label = toneMap ? (toneMap.get(keys[i]) || keys[i]) : keys[i];
      this.keys.push({ label, value: keys[i], type, x, y, w: widths[i], h: 44 });
      x += widths[i] + 4;
    }
  }
  
  onUpdate(dt) {
    if (this.gameFinished) return;
    this.elapsedTime += dt;
    
    // 泡泡摇摆
    for (const b of this.bubbles) {
      if (b.state === 'floating') {
        b.x = b.baseX + Math.sin(this.elapsedTime * 1.2 + b.phase) * 16;
        b.y = b.baseY + Math.sin(this.elapsedTime * 0.8 + b.phase * 1.3) * 12;
      }
    }
    
    // 炮弹飞行
    for (const bl of this.bullets) {
      if (bl.state === 'flying') {
        bl.progress += dt * 2.5 * this.difficulty;
        if (bl.progress >= 1) {
          bl.progress = 1;
          if (bl.matched) {
            this.handleHit(bl);
          } else {
            this.handleMiss(bl);
          }
          bl.state = 'done';
        } else {
          const t = 1 - Math.pow(1 - bl.progress, 3);
          bl.x = bl.startX + (bl.targetX - bl.startX) * t;
          bl.y = bl.startY + (bl.targetY - bl.startY) * t - 25 * Math.sin(bl.progress * Math.PI);
        }
      }
    }
    this.bullets = this.bullets.filter(b => b.state === 'flying');
    
    if (this.wrongHintTimer > 0) this.wrongHintTimer = Math.max(0, this.wrongHintTimer - dt);
    
    this.updateParticles(dt);
    
    // 批次推进
    const hasActive = this.bubbles.some(b => b.state === 'floating' && !this.collected.has(b.id));
    if (!hasActive && this.bullets.length === 0) {
      const remaining = this.targets.filter(t => !this.collected.has(t.id));
      if (remaining.length > 0) this.startBatch(this.batchIndex + 1);
    }
    
    // 结束判定
    if (this.collected.size >= this.targets.length) {
      this.gameFinished = true;
      this.playSound('complete');
      this.stop();
    }
  }
  
  onRender() {
    const ctx = this.ctx;
    // 天空背景
    const skyGrad = ctx.createLinearGradient(0, 0, 0, this.skyH);
    skyGrad.addColorStop(0, '#87ceeb');
    skyGrad.addColorStop(1, '#e6f4ff');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, this.CW, this.skyH);
    // 炮台区
    ctx.fillStyle = '#f5f7fa';
    ctx.fillRect(0, this.skyH, this.CW, this.CH - this.skyH);
    
    // 泡泡
    for (const b of this.bubbles) {
      if (b.state !== 'floating') continue;
      if (this.collected.has(b.id)) continue;
      ctx.save();
      ctx.translate(b.x, b.y);
      // 泡泡
      const grad = ctx.createRadialGradient(-8, -8, 5, 0, 0, 26);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(1, '#d4ecff');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, 26, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#4a90e2';
      ctx.lineWidth = 2;
      ctx.stroke();
      // 汉字
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(b.char, 0, 0);
      ctx.restore();
    }
    
    // 炮弹
    for (const bl of this.bullets) {
      if (bl.state !== 'flying') continue;
      ctx.save();
      ctx.translate(bl.x, bl.y);
      ctx.fillStyle = '#27ae60';
      this.roundRect(ctx, -24, -10, 48, 20, 10);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(bl.py, 0, 0);
      ctx.restore();
    }
    
    // 槽位
    this.drawSlots(ctx);
    // 键盘
    this.drawKeys(ctx);
    // HUD
    this.drawHud(ctx);
    // 错误提示
    if (this.wrongHintTimer > 0) {
      ctx.save();
      ctx.fillStyle = 'rgba(231,126,34,0.92)';
      const text = '再试试~';
      ctx.font = 'bold 16px sans-serif';
      const m = ctx.measureText(text);
      this.roundRect(ctx, (this.CW - m.width - 28) / 2, 50, m.width + 28, 32, 10);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, this.CW / 2, 66);
      ctx.restore();
    }
    // 结束
    if (this.gameFinished) {
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,.6)';
      ctx.fillRect(0, 0, this.CW, this.CH);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('全部收集啦！', this.CW / 2, this.CH / 2 - 20);
      ctx.font = '16px sans-serif';
      ctx.fillText('点击"再来一局"继续', this.CW / 2, this.CH / 2 + 20);
      ctx.restore();
    }
    this.renderParticles();
  }
  
  drawSlots(ctx) {
    const y = this.skyH + 8;
    const slotW = 90, slotH = 36, gap = 10;
    const totalW = slotW * 2 + gap;
    const startX = (this.CW - totalW) / 2;
    const colors = ['#3498db', '#27ae60'];
    const labels = ['声母', '韵母'];
    for (let i = 0; i < 2; i++) {
      const x = startX + i * (slotW + gap);
      const filled = this.assembly[i].value !== null;
      ctx.fillStyle = filled ? colors[i] : '#fff';
      this.roundRect(ctx, x, y, slotW, slotH, 8);
      ctx.fill();
      ctx.strokeStyle = filled ? colors[i] : '#adb5bd';
      ctx.lineWidth = 2;
      this.roundRect(ctx, x, y, slotW, slotH, 8);
      ctx.stroke();
      ctx.fillStyle = filled ? '#fff' : '#6c757d';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(labels[i], x + 4, y + 2);
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(filled ? this.assembly[i].value : '＿', x + slotW / 2, y + slotH / 2 + 4);
    }
    // 预览（带声调）
    const initial = this.assembly[0].value || '';
    const final = this.assembly[1].value;
    if (initial || final) {
      const raw = initial + (final || '');
      const tonePy = this.pyMap.get(initial + '|' + (final || ''));
      const display = tonePy || raw;
      ctx.fillStyle = tonePy ? '#27ae60' : '#2c3e50';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`预览：${display}`, this.CW / 2, y + slotH + 12);
    }
  }
  
  drawKeys(ctx) {
    for (const k of this.keys) {
      const isSelected = this.assembly.some(s => s.value === k.value);
      const fillColor = isSelected ? (k.type === 'initial' ? '#3498db' : '#27ae60') : '#fff';
      ctx.fillStyle = fillColor;
      this.roundRect(ctx, k.x, k.y, k.w, k.h, 6);
      ctx.fill();
      ctx.strokeStyle = isSelected ? fillColor : '#bdc3c7';
      ctx.lineWidth = isSelected ? 2 : 1;
      this.roundRect(ctx, k.x, k.y, k.w, k.h, 6);
      ctx.stroke();
      ctx.fillStyle = isSelected ? '#fff' : '#2c3e50';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(k.label, k.x + k.w / 2, k.y + k.h / 2);
    }
  }
  
  drawHud(ctx) {
    ctx.fillStyle = '#2c3e50';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(`分数：${this.score}`, 8, 10);
    if (this.combo > 0) {
      ctx.fillStyle = '#e67e22';
      ctx.fillText(`${this.combo}连击`, 8, 28);
    }
    ctx.fillStyle = '#2c3e50';
    ctx.textAlign = 'right';
    ctx.fillText(`收集：${this.collected.size}/${this.targets.length}`, this.CW - 8, 10);
  }
  
  onPointerDown(x, y) {
    if (this.gameFinished) return;
    // 点击键盘
    for (const k of this.keys) {
      if (x >= k.x && x <= k.x + k.w && y >= k.y && y <= k.y + k.h) {
        this.playSound('click');
        const slotIdx = k.type === 'initial' ? 0 : 1;
        if (this.assembly[slotIdx].value === k.value) {
          this.assembly[slotIdx].value = null;
        } else {
          this.assembly[slotIdx].value = k.value;
          // 韵母选完自动发射
          if (this.assembly[1].value) this.tryFire();
        }
        return;
      }
    }
  }
  
  tryFire() {
    const initial = this.assembly[0].value || '';
    const final = this.assembly[1].value;
    if (!final) { this.wrongHintTimer = 0.8; return; }
    
    // 查找匹配泡泡
    let matched = null;
    for (const b of this.bubbles) {
      if (b.state !== 'floating' || this.collected.has(b.id)) continue;
      if (b.initial === initial && b.final === final) { matched = b; break; }
    }
    
    const bullet = {
      py: initial + final,
      state: 'flying',
      startX: this.CW / 2,
      startY: this.cannonY,
      targetX: matched ? matched.x : this.CW / 2,
      targetY: matched ? matched.y : -20,
      x: this.CW / 2,
      y: this.cannonY,
      progress: 0,
      matched,
    };
    this.bullets.push(bullet);
    this.playSound('pop');
    this.assembly[0].value = null;
    this.assembly[1].value = null;
  }
  
  handleHit(bl) {
    const b = bl.matched;
    if (!b || b.state !== 'floating') { this.handleMiss(bl); return; }
    const rt = performance.now() / 1000 - this.answerStartTime;
    b.state = 'popping';
    this.collected.add(b.id);
    this.recordAnswer(b.kpId || b.id, true, rt, b.char);
    this.score += 10;
    this.spawnParticles(b.x, b.y, 14, ['#4fc3f7', '#29b6f6', '#81d4fa']);
    this.answerStartTime = performance.now() / 1000;
  }
  
  handleMiss(bl) {
    const rt = performance.now() / 1000 - this.answerStartTime;
    const expected = this.targets.find(t => !this.collected.has(t.id));
    if (expected) this.recordAnswer(expected.kpId || expected.id, false, rt, '');
    this.score += 1;
    this.wrongHintTimer = 0.8;
    this.answerStartTime = performance.now() / 1000;
  }
}

// ===== 记忆翻牌引擎 =====
class MemoryMatchEngine extends GameEngine {
  onInit(data) {
    this.CW = 480; this.CH = 560;
    this.canvas.width = this.CW; this.canvas.height = this.CH;
    this.canvas.style.aspectRatio = `${this.CW} / ${this.CH}`;
    
    this.hudH = 40;
    this.gridCols = 4;
    this.gridRows = 4;
    this.cellSize = Math.floor(this.CW / this.gridCols);
    
    this.cards = [];
    this.firstCard = null;
    this.secondCard = null;
    this.isChecking = false;
    this.checkTimer = 0;
    this.firstFlipTime = 0;
    this.gameFinished = false;
    this.previewTimer = data.previewSec || 3;
    this.flipSpeed = 4;
    this.cardPadding = 6;
    
    const pairs = data.pairs || [];
    const cards = [];
    pairs.forEach((p, i) => {
      const pid = `pair_${i}`;
      cards.push({ card_id: `c_${i}_q`, kp_id: p.kp_id, content: p.char, pair_id: pid });
      cards.push({ card_id: `c_${i}_a`, kp_id: p.kp_id, content: p.py, pair_id: pid });
    });
    const shuffled = shuffle(cards);
    this.cards = shuffled.map((c, i) => ({
      ...c,
      col: i % this.gridCols,
      row: Math.floor(i / this.gridCols),
      flipProgress: 1,
      targetFlip: 1,
      matched: false,
    }));
    this.totalPairs = pairs.length;
    
    if (this.cards.length === 0) this.gameFinished = true;
    
    const handler = (e) => {
      const rect = this.canvas.getBoundingClientRect();
      const sx = this.canvas.width / rect.width, sy = this.canvas.height / rect.height;
      this.onPointerDown((e.clientX - rect.left) * sx, (e.clientY - rect.top) * sy);
    };
    this.pointerDownHandler = handler;
    this.canvas.addEventListener('pointerdown', handler);
  }
  
  onUpdate(dt) {
    if (this.gameFinished) return;
    if (this.previewTimer > 0) {
      this.previewTimer -= dt;
      if (this.previewTimer <= 0) {
        for (const c of this.cards) if (!c.matched) c.targetFlip = 0;
      }
    }
    for (const c of this.cards) {
      if (c.flipProgress < c.targetFlip) c.flipProgress = Math.min(c.targetFlip, c.flipProgress + this.flipSpeed * dt);
      else if (c.flipProgress > c.targetFlip) c.flipProgress = Math.max(c.targetFlip, c.flipProgress - this.flipSpeed * dt);
    }
    if (this.isChecking && this.checkTimer > 0) {
      this.checkTimer -= dt;
      if (this.checkTimer <= 0) {
        if (this.firstCard) this.firstCard.targetFlip = 0;
        if (this.secondCard) this.secondCard.targetFlip = 0;
        this.firstCard = null;
        this.secondCard = null;
        this.isChecking = false;
      }
    }
    this.updateParticles(dt);
    if (this.cards.length > 0 && this.cards.every(c => c.matched)) {
      const allFlipped = this.cards.every(c => Math.abs(c.flipProgress - c.targetFlip) < 0.01);
      if (allFlipped) { this.gameFinished = true; this.playSound('complete'); this.stop(); }
    }
  }
  
  onRender() {
    const ctx = this.ctx;
    ctx.fillStyle = '#f5f7fa';
    ctx.fillRect(0, 0, this.CW, this.CH);
    for (const c of this.cards) this.drawCard(ctx, c);
    // HUD
    ctx.fillStyle = '#2c3e50';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`分数：${this.score}`, 8, 8);
    if (this.combo > 0) { ctx.fillStyle = '#e67e22'; ctx.fillText(`${this.combo}连击`, 8, 26); }
    const matched = this.cards.filter(c => c.matched).length / 2;
    ctx.fillStyle = '#2c3e50';
    ctx.textAlign = 'right';
    ctx.fillText(`进度：${matched}/${this.totalPairs}`, this.CW - 8, 8);
    // 不匹配提示
    if (this.isChecking && this.checkTimer > 0) {
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.fillRect(0, 0, this.CW, this.CH);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('再看看~', this.CW / 2, this.CH / 2);
      ctx.restore();
    }
    // 预览
    if (this.previewTimer > 0) {
      ctx.save();
      ctx.fillStyle = 'rgba(102,126,234,.85)';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      this.roundRect(ctx, this.CW / 2 - 80, this.CH - 34, 160, 26, 12);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillText(`记住位置：${Math.ceil(this.previewTimer)}秒`, this.CW / 2, this.CH - 21);
      ctx.restore();
    }
    // 结束
    if (this.gameFinished) {
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,.6)';
      ctx.fillRect(0, 0, this.CW, this.CH);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('全部配对啦！', this.CW / 2, this.CH / 2 - 20);
      ctx.font = '16px sans-serif';
      ctx.fillText('点击"再来一局"继续', this.CW / 2, this.CH / 2 + 20);
      ctx.restore();
    }
    this.renderParticles();
  }
  
  drawCard(ctx, card) {
    const cs = this.cellSize;
    const cx = (card.col + 0.5) * cs;
    const cy = this.hudH + (card.row + 0.5) * cs;
    const sz = cs - this.cardPadding * 2;
    const x = cx - sz / 2, y = cy - sz / 2;
    const p = card.flipProgress;
    const showFront = p >= 0.5;
    const scaleX = showFront ? Math.max(0.001, (p - 0.5) * 2) : Math.max(0.001, 1 - p * 2);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scaleX, 1);
    ctx.translate(-cx, -cy);
    if (showFront) {
      ctx.fillStyle = card.matched ? '#d4edda' : '#fff';
      this.roundRect(ctx, x, y, sz, sz, 10);
      ctx.fill();
      ctx.strokeStyle = card.matched ? '#28a745' : '#adb5bd';
      ctx.lineWidth = 2;
      this.roundRect(ctx, x, y, sz, sz, 10);
      ctx.stroke();
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(card.content, cx, cy);
    } else {
      const grad = ctx.createLinearGradient(x, y, x, y + sz);
      grad.addColorStop(0, '#6a11cb');
      grad.addColorStop(1, '#2575fc');
      ctx.fillStyle = grad;
      this.roundRect(ctx, x, y, sz, sz, 10);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      this.roundRect(ctx, x, y, sz, sz, 10);
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 32px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('?', cx, cy);
    }
    ctx.restore();
  }
  
  onPointerDown(x, y) {
    if (this.gameFinished || this.isChecking) return;
    if (this.previewTimer > 0) return;
    const col = Math.floor(x / this.cellSize);
    const row = Math.floor((y - this.hudH) / this.cellSize);
    if (col < 0 || col >= this.gridCols || row < 0 || row >= this.gridRows) return;
    const card = this.cards.find(c => c.col === col && c.row === row);
    if (!card || card.targetFlip === 1 || card.matched) return;
    card.targetFlip = 1;
    this.playSound('click');
    if (!this.firstCard) {
      this.firstCard = card;
      this.firstFlipTime = performance.now() / 1000;
      return;
    }
    this.secondCard = card;
    this.checkMatch();
  }
  
  checkMatch() {
    const rt = performance.now() / 1000 - this.firstFlipTime;
    const f = this.firstCard, s = this.secondCard;
    if (f.pair_id === s.pair_id) {
      f.matched = true; s.matched = true;
      this.recordAnswer(f.kp_id, true, rt, f.content);
      this.score += 10;
      const cs = this.cellSize;
      this.spawnParticles((f.col + 0.5) * cs, this.hudH + (f.row + 0.5) * cs, 10, ['#28a745', '#52c41a']);
      this.spawnParticles((s.col + 0.5) * cs, this.hudH + (s.row + 0.5) * cs, 10, ['#28a745', '#52c41a']);
      this.firstCard = null; this.secondCard = null;
    } else {
      this.recordAnswer(f.kp_id, false, rt, f.content);
      this.score += 1;
      this.isChecking = true; this.checkTimer = 1.0;
    }
  }
}

// ===== 连连看引擎 =====
class LinkMatchEngine extends GameEngine {
  onInit(data) {
    this.CW = 480; this.CH = 520;
    this.canvas.width = this.CW; this.canvas.height = this.CH;
    this.canvas.style.aspectRatio = `${this.CW} / ${this.CH}`;
    
    this.hudH = 40;
    this.gridCols = data.grid_cols || 5;
    this.gridRows = data.grid_rows || 5;
    this.cellSize = Math.floor(this.CW / this.gridCols);
    this.totalPairs = 0;
    
    this.nodes = [];
    this.selectedNode = null;
    this.pathAnimations = [];
    this.fadingLines = [];
    this.shuffleHintTimer = 0;
    this.gameFinished = false;
    this.answerStartTime = 0;
    this.maxTurns = 2;
    this.shuffleMaxRetry = 20;
    this.nodeHitRatio = 0.45;
    this.pathAnimSpeed = 3.0;
    this.fadeDuration = 0.5;
    
    const rawPairs = data.pairs || [];
    const rawNodes = [];
    rawPairs.forEach((p, i) => {
      const pid = `pair_${i}`;
      rawNodes.push({ node_id: `n_${i}_1`, kp_id: p.kp_id, content: p.char, pair_id: pid });
      rawNodes.push({ node_id: `n_${i}_2`, kp_id: p.kp_id, content: p.py, pair_id: pid });
    });
    const pairCounts = new Map();
    rawNodes.forEach(n => { pairCounts.set(n.pair_id, (pairCounts.get(n.pair_id) || 0) + 1); });
    const filteredNodes = rawNodes.filter(n => (pairCounts.get(n.pair_id) || 0) >= 2);
    this.totalPairs = pairCounts.size;
    
    const shuffledNodes = shuffle(filteredNodes);
    const positions = generateEvenPositions(this.gridCols, this.gridRows, shuffledNodes.length);
    this.nodes = shuffledNodes.map((n, i) => ({
      ...n,
      x: positions[i].x,
      y: positions[i].y,
      matched: false,
    }));
    if (this.nodes.length === 0) this.gameFinished = true;
    this.ensureSolvable();
    
    const handler = (e) => {
      const rect = this.canvas.getBoundingClientRect();
      const sx = this.canvas.width / rect.width, sy = this.canvas.height / rect.height;
      this.onPointerDown((e.clientX - rect.left) * sx, (e.clientY - rect.top) * sy);
    };
    this.pointerDownHandler = handler;
    this.canvas.addEventListener('pointerdown', handler);
  }
  
  onUpdate(dt) {
    if (this.gameFinished) return;
    if (this.shuffleHintTimer > 0) this.shuffleHintTimer = Math.max(0, this.shuffleHintTimer - dt);
    
    for (const anim of this.pathAnimations) {
      anim.progress += anim.speed * this.difficulty * dt;
      if (anim.progress >= 1) {
        anim.progress = 1;
        this.onPathComplete(anim);
      }
    }
    this.pathAnimations = this.pathAnimations.filter(a => a.progress < 1);
    
    for (const line of this.fadingLines) line.alpha -= dt / this.fadeDuration;
    this.fadingLines = this.fadingLines.filter(l => l.alpha > 0);
    
    this.updateParticles(dt);
    
    if (this.hasAllMatched()) {
      this.gameFinished = true;
      this.playSound('complete');
      this.stop();
    }
  }
  
  onRender() {
    const ctx = this.ctx;
    ctx.fillStyle = '#f5f7fa';
    ctx.fillRect(0, 0, this.CW, this.CH);
    // 网格
    ctx.strokeStyle = '#d5dbe5';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let c = 0; c <= this.gridCols; c++) {
      ctx.moveTo(c * this.cellSize, this.hudH);
      ctx.lineTo(c * this.cellSize, this.hudH + this.gridRows * this.cellSize);
    }
    for (let r = 0; r <= this.gridRows; r++) {
      ctx.moveTo(0, this.hudH + r * this.cellSize);
      ctx.lineTo(this.gridCols * this.cellSize, this.hudH + r * this.cellSize);
    }
    ctx.stroke();
    // 路径动画
    for (const anim of this.pathAnimations) this.drawPathAnim(ctx, anim);
    // 消散线
    for (const line of this.fadingLines) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, line.alpha);
      ctx.strokeStyle = '#e67e22';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(line.startX, line.startY);
      ctx.lineTo(line.endX, line.endY);
      ctx.stroke();
      ctx.restore();
    }
    // 节点
    for (const node of this.nodes) {
      if (node.matched) continue;
      this.drawNode(ctx, node);
    }
    // HUD
    ctx.fillStyle = '#2c3e50';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(`分数：${this.score}`, 8, 8);
    const matched = this.nodes.filter(n => n.matched).length / 2;
    ctx.textAlign = 'right';
    ctx.fillText(`进度：${matched} / ${this.totalPairs}`, this.CW - 8, 8);
    if (this.combo > 1) {
      ctx.textAlign = 'left';
      ctx.fillStyle = '#e67e22';
      ctx.fillText(`Combo：${this.combo}`, 8, 28);
    }
    // 重排提示
    if (this.shuffleHintTimer > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, this.shuffleHintTimer);
      ctx.fillStyle = 'rgba(52,152,219,.9)';
      this.roundRect(ctx, this.CW / 2 - 80, this.CH / 2 - 16, 160, 32, 10);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '15px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('重新整理一下~', this.CW / 2, this.CH / 2);
      ctx.restore();
    }
    // 结束
    if (this.gameFinished) {
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,.6)';
      ctx.fillRect(0, 0, this.CW, this.CH);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 32px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('全部连完啦！', this.CW / 2, this.CH / 2 - 20);
      ctx.font = '18px sans-serif';
      ctx.fillText('点击"再来一局"继续', this.CW / 2, this.CH / 2 + 24);
      ctx.restore();
    }
    this.renderParticles();
  }
  
  drawPathAnim(ctx, anim) {
    if (anim.path.length < 2) return;
    const color = anim.isCorrect ? '#2ecc71' : '#e67e22';
    const totalLen = anim.path.length - 1;
    const currentIdx = anim.progress * totalLen;
    const baseIdx = Math.floor(currentIdx);
    const frac = currentIdx - baseIdx;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(anim.path[0].x, anim.path[0].y);
    for (let i = 1; i <= baseIdx && i < anim.path.length; i++) ctx.lineTo(anim.path[i].x, anim.path[i].y);
    if (baseIdx < anim.path.length - 1) {
      const p1 = anim.path[baseIdx], p2 = anim.path[baseIdx + 1];
      ctx.lineTo(p1.x + (p2.x - p1.x) * frac, p1.y + (p2.y - p1.y) * frac);
    }
    ctx.stroke();
    // 光点
    if (baseIdx < anim.path.length - 1) {
      const p1 = anim.path[baseIdx], p2 = anim.path[baseIdx + 1];
      const x = p1.x + (p2.x - p1.x) * frac, y = p1.y + (p2.y - p1.y) * frac;
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  
  drawNode(ctx, node) {
    const cs = this.cellSize;
    const cx = (node.x + 0.5) * cs;
    const cy = this.hudH + (node.y + 0.5) * cs;
    const half = cs * 0.4;
    const isSelected = this.selectedNode?.node_id === node.node_id;
    const x = cx - half, y = cy - half, w = half * 2, h = half * 2, r = 8;
    ctx.fillStyle = isSelected ? '#dbeafe' : '#f0f4f8';
    ctx.strokeStyle = isSelected ? '#2563eb' : '#cbd5e1';
    ctx.lineWidth = isSelected ? 3 : 2;
    this.roundRect(ctx, x, y, w, h, r);
    ctx.fill();
    ctx.stroke();
    if (isSelected) {
      const pulse = Math.sin(performance.now() / 200) * 2;
      const pad = 4 + pulse;
      ctx.strokeStyle = 'rgba(37,99,235,.4)';
      ctx.lineWidth = 2;
      this.roundRect(ctx, x - pad, y - pad, w + pad * 2, h + pad * 2, 10);
      ctx.stroke();
    }
    ctx.fillStyle = '#1e293b';
    const content = node.content;
    let fontSize = 22;
    if (content.length > 4) fontSize = 18;
    if (content.length > 6) fontSize = 16;
    ctx.font = `bold ${fontSize}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const display = content.length > 8 ? content.slice(0, 7) + '…' : content;
    ctx.fillText(display, cx, cy);
  }
  
  onPointerDown(x, y) {
    if (this.gameFinished) return;
    if (this.pathAnimations.length > 0) return;
    
    const node = this.findNodeAt(x, y);
    if (!node) {
      if (this.selectedNode) this.selectedNode = null;
      return;
    }
    if (!this.selectedNode) {
      this.selectedNode = node;
      this.answerStartTime = performance.now() / 1000;
      this.playSound('click');
      return;
    }
    if (node.node_id === this.selectedNode.node_id) {
      this.selectedNode = null;
      return;
    }
    
    const start = this.selectedNode, end = node;
    const rt = performance.now() / 1000 - this.answerStartTime;
    const path = this.findPath(start, end);
    
    if (path && path.length > 0) {
      const isCorrect = start.pair_id === end.pair_id;
      this.pathAnimations.push({ path, progress: 0, speed: this.pathAnimSpeed, pairId: start.pair_id, startNodeId: start.node_id, endNodeId: end.node_id, isCorrect });
      this.recordAnswer(start.kp_id, isCorrect, rt, start.content);
      this.score += isCorrect ? 10 : 1;
    } else {
      const cs = this.cellSize;
      this.fadingLines.push({
        startX: (start.x + 0.5) * cs,
        startY: this.hudH + (start.y + 0.5) * cs,
        endX: (end.x + 0.5) * cs,
        endY: this.hudH + (end.y + 0.5) * cs,
        alpha: 1,
      });
      if (!this.hasAllMatched() && !this.hasAnyPairable()) {
        this.shuffleRemaining();
      }
    }
    this.selectedNode = null;
  }
  
  findNodeAt(px, py) {
    const cs = this.cellSize;
    const r = cs * this.nodeHitRatio;
    for (const n of this.nodes) {
      if (n.matched) continue;
      const cx = (n.x + 0.5) * cs, cy = this.hudH + (n.y + 0.5) * cs;
      if ((px - cx) ** 2 + (py - cy) ** 2 <= r ** 2) return n;
    }
    return null;
  }
  
  findPath(start, end) {
    const cols = this.gridCols, rows = this.gridRows;
    const extCols = cols + 2, extRows = rows + 2;
    const offX = 1, offY = 1;
    const blocked = [];
    for (let y = 0; y < extRows; y++) blocked.push(new Array(extCols).fill(false));
    for (const n of this.nodes) {
      if (n.matched) continue;
      if (n.node_id === start.node_id || n.node_id === end.node_id) continue;
      blocked[n.y + offY][n.x + offX] = true;
    }
    const sx = start.x + offX, sy = start.y + offY;
    const ex = end.x + offX, ey = end.y + offY;
    
    // A* with 2 turns max
    const dx = [1, 0, -1, 0], dy = [0, 1, 0, -1];
    const open = [{ x: sx, y: sy, g: 0, f: Math.abs(sx - ex) + Math.abs(sy - ey), turns: 0, dir: -1, parent: null }];
    const visited = new Map();
    
    while (open.length > 0) {
      open.sort((a, b) => a.f - b.f);
      const cur = open.shift();
      if (cur.x === ex && cur.y === ey) {
        const path = [];
        let n = cur;
        while (n) { path.unshift({ x: n.x, y: n.y }); n = n.parent; }
        return path.map(p => ({
          x: (p.x - offX + 0.5) * this.cellSize,
          y: this.hudH + (p.y - offY + 0.5) * this.cellSize,
        }));
      }
      const key = `${cur.x},${cur.y},${cur.dir}`;
      if (visited.has(key) && visited.get(key) <= cur.turns) continue;
      visited.set(key, cur.turns);
      for (let i = 0; i < 4; i++) {
        const nx = cur.x + dx[i], ny = cur.y + dy[i];
        if (nx < 0 || nx >= extCols || ny < 0 || ny >= extRows) continue;
        if (blocked[ny][nx] && !(nx === ex && ny === ey)) continue;
        let newTurns = cur.turns;
        if (cur.dir !== -1 && cur.dir !== i) newTurns++;
        if (newTurns > this.maxTurns) continue;
        open.push({ x: nx, y: ny, g: cur.g + 1, f: cur.g + 1 + Math.abs(nx - ex) + Math.abs(ny - ey), turns: newTurns, dir: i, parent: cur });
      }
    }
    return null;
  }
  
  onPathComplete(anim) {
    const start = this.nodes.find(n => n.node_id === anim.startNodeId);
    const end = this.nodes.find(n => n.node_id === anim.endNodeId);
    if (!start || !end) return;
    const cs = this.cellSize;
    const sx = (start.x + 0.5) * cs, sy = this.hudH + (start.y + 0.5) * cs;
    const ex = (end.x + 0.5) * cs, ey = this.hudH + (end.y + 0.5) * cs;
    const midX = (sx + ex) / 2, midY = (sy + ey) / 2;
    if (anim.isCorrect) {
      start.matched = true; end.matched = true;
      this.spawnParticles(midX, midY, 12, ['#4caf50', '#66bb6a', '#81c784']);
    } else {
      this.fadingLines.push({ startX: sx, startY: sy, endX: ex, endY: ey, alpha: 1 });
      this.spawnParticles(midX, midY, 8, ['#ff9800', '#ffb74d', '#ffe0b2']);
    }
    if (!this.hasAllMatched() && !this.hasAnyPairable()) this.shuffleRemaining();
  }
  
  hasAllMatched() { return this.nodes.length > 0 && this.nodes.every(n => n.matched); }
  hasAnyPairable() {
    const unmatched = this.nodes.filter(n => !n.matched);
    if (unmatched.length < 2) return false;
    const groups = new Map();
    for (const n of unmatched) {
      if (!groups.has(n.pair_id)) groups.set(n.pair_id, []);
      groups.get(n.pair_id).push(n);
    }
    for (const [, arr] of groups) {
      if (arr.length < 2) continue;
      for (let i = 0; i < arr.length; i++) {
        for (let j = i + 1; j < arr.length; j++) {
          if (this.findPath(arr[i], arr[j])) return true;
        }
      }
    }
    return false;
  }
  shuffleRemaining() {
    const unmatched = this.nodes.filter(n => !n.matched);
    if (unmatched.length === 0) return;
    const used = new Set();
    for (const n of this.nodes) { if (n.matched) used.add(`${n.x},${n.y}`); }
    for (let attempt = 0; attempt < this.shuffleMaxRetry; attempt++) {
      const allPositions = generateEvenPositions(this.gridCols, this.gridRows, this.gridCols * this.gridRows);
      const available = allPositions.filter(p => !used.has(`${p.x},${p.y}`));
      for (let i = 0; i < unmatched.length; i++) {
        unmatched[i].x = available[i].x;
        unmatched[i].y = available[i].y;
      }
      if (this.hasAnyPairable()) break;
    }
    this.shuffleHintTimer = 1.5;
  }
  
  ensureSolvable() {
    if (this.nodes.length === 0) return;
    for (let attempt = 0; attempt < this.shuffleMaxRetry; attempt++) {
      if (this.hasAnyPairable()) break;
      const positions = generateEvenPositions(this.gridCols, this.gridRows, this.nodes.length);
      for (let i = 0; i < this.nodes.length; i++) {
        this.nodes[i].x = positions[i].x;
        this.nodes[i].y = positions[i].y;
      }
    }
  }
}

// ===== 主控制器 =====
let currentEngine = null;
let currentGame = 'pinyin';
let currentDiff = 'easy';
const canvas = document.getElementById('gameCanvas');
const breathOverlay = document.getElementById('breathOverlay');
const resultOverlay = document.getElementById('resultOverlay');

let breathEngine = null;
function onBreathTrigger(engine) {
  breathEngine = engine;
  engine.pause();
  breathOverlay.classList.add('show');
  setTimeout(() => {
    breathOverlay.classList.remove('show');
    engine.onBreathBreakComplete();
    engine.resume();
    breathEngine = null;
  }, 4000);
}

function buildData(game, diff) {
  const cfg = DIFF_CONFIG[diff];
  const pairs = pickN(PINYIN_DATA, cfg.pairs);
  if (game === 'pinyin') {
    return {
      targets: pairs.map((p, i) => ({
        id: `t_${i}`, char: p.char, py: p.py, initial: p.initial, final: p.final, kp_id: `kp_${i}`,
      })),
      previewSec: cfg.previewSec,
    };
  }
  if (game === 'memory') {
    return { pairs: pairs.map((p, i) => ({ kp_id: `kp_${i}`, char: p.char, py: p.py })), previewSec: cfg.previewSec };
  }
  if (game === 'link') {
    return { pairs: pairs.map((p, i) => ({ kp_id: `kp_${i}`, char: p.char, py: p.py })) };
  }
  return {};
}

function startGame() {
  if (currentEngine) { currentEngine.isRunning = false; currentEngine = null; }
  resultOverlay.classList.remove('show');
  breathOverlay.classList.remove('show');
  
  const cfg = DIFF_CONFIG[currentDiff];
  const data = buildData(currentGame, currentDiff);
  data.difficultyBaseline = cfg.difficultyBase;
  
  if (currentGame === 'pinyin') currentEngine = new PinyinCannonEngine(canvas);
  else if (currentGame === 'memory') currentEngine = new MemoryMatchEngine(canvas);
  else currentEngine = new LinkMatchEngine(canvas);
  
  currentEngine.difficultyBaseline = cfg.difficultyBase;
  currentEngine.difficulty = cfg.difficultyBase;
  currentEngine.onEnd = showResult;
  currentEngine.start(data);
  updateHUD();
  if (window._hudTimer) clearInterval(window._hudTimer);
  window._hudTimer = setInterval(updateHUD, 200);
}

function updateHUD() {
  if (!currentEngine) return;
  document.getElementById('hudScore').textContent = `分数 ${currentEngine.score}`;
  const comboEl = document.getElementById('hudCombo');
  comboEl.textContent = currentEngine.combo >= 2 ? `${currentEngine.combo}连击` : '';
  
  let progress = '';
  if (currentGame === 'pinyin' && currentEngine.collected) {
    progress = `${currentEngine.collected.size}/${currentEngine.targets?.length || 0}`;
  } else if (currentGame === 'memory' && currentEngine.cards) {
    const matched = currentEngine.cards.filter(c => c.matched).length / 2;
    progress = `${matched}/${currentEngine.totalPairs || 0}`;
  } else if (currentGame === 'link' && currentEngine.nodes) {
    const matched = currentEngine.nodes.filter(n => n.matched).length / 2;
    progress = `${matched}/${currentEngine.totalPairs || 0}`;
  }
  document.getElementById('hudProgress').textContent = `进度 ${progress}`;
  
  if (currentEngine.isFinished()) {
    if (window._hudTimer) { clearInterval(window._hudTimer); window._hudTimer = null; }
  }
}

function showResult() {
  if (!currentEngine) return;
  const e = currentEngine;
  const acc = e.totalCount > 0 ? Math.round(e.correctCount / e.totalCount * 100) : 0;
  let stars = 1;
  if (acc >= 80) stars = 3;
  else if (acc >= 50) stars = 2;
  document.getElementById('resultStars').textContent = '★ '.repeat(stars).trim() + ' ☆'.repeat(3 - stars);
  document.getElementById('resultScore').textContent = `最终分数：${e.score}`;
  document.getElementById('resultAccuracy').textContent = `正确率：${e.correctCount}/${e.totalCount} (${acc}%)`;
  document.getElementById('resultCombo').textContent = `最高连击：${e.maxCombo}`;
  document.getElementById('resultTitle').textContent = e.totalCount === 0 ? '本局结束' : (acc >= 80 ? '太棒了！' : acc >= 50 ? '不错哦~' : '继续加油~');
  resultOverlay.classList.add('show');
}

// 事件绑定
document.querySelectorAll('.game-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.game-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentGame = btn.dataset.game;
    startGame();
  });
});
document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentDiff = btn.dataset.diff;
    startGame();
  });
});
document.getElementById('resultBtn').addEventListener('click', startGame);
document.getElementById('soundToggle').addEventListener('click', (e) => {
  GameEngine.soundEnabled = !GameEngine.soundEnabled;
  e.target.textContent = GameEngine.soundEnabled ? '🔊' : '🔇';
});

document.body.addEventListener('pointerdown', () => {
  if (!GameEngine.audioCtx) { try { GameEngine.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
}, { once: true });

startGame();
</script>
