<body>
    <div class="container">
        <div class="header">
            <h1>☁️ 飞书云盘自动上传工具</h1>
            <p>网页版 - 轻松上传文件到飞书云盘</p>
        </div>

        <div class="content">
            <!-- 配置区域 -->
            <div class="section">
                <div class="section-title">
                    飞书应用配置
                    <span id="connectionStatus" class="status-badge connected">已连接</span>
                </div>
                
                <div class="form-group">
                    <label class="form-label">App ID</label>
                    <input type="text" id="appId" class="form-input" placeholder="请输入飞书应用的 App ID">
                </div>

                <div class="form-group">
                    <label class="form-label">App Secret</label>
                    <input type="password" id="appSecret" class="form-input" placeholder="请输入飞书应用的 App Secret">
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" onclick="saveConfig()">
                        💾 保存配置
                    </button>
                    <button class="btn btn-success" onclick="testConnection()">
                        🔗 测试连接
                    </button>
                </div>
            </div>

            <!-- 文件夹设置区域 -->
            <div class="section">
                <div class="section-title">上传文件夹设置</div>
                
                <div id="folderInfo" class="folder-info hidden">
                    <div class="folder-info-icon">📁</div>
                    <div class="folder-info-text">
                        <div class="folder-info-label">当前目标文件夹</div>
                        <div class="folder-info-token" id="currentFolderToken">-</div>
                    </div>
                    <button class="btn btn-secondary btn-small" onclick="clearFolder()">✕ 清除</button>
                </div>

                <div class="flex-row">
                    <div class="form-group">
                        <label class="form-label">创建新文件夹（可选）</label>
                        <input type="text" id="newFolderName" class="form-input" placeholder="输入文件夹名称">
                    </div>
                    <button class="btn btn-primary" onclick="createFolder()">
                        ➕ 创建文件夹
                    </button>
                </div>
            </div>

            <!-- 文件上传区域 -->
            <div class="section">
                <div class="section-title">选择文件上传</div>
                
                <div class="drop-zone" id="dropZone" onclick="document.getElementById(&#39;fileInput&#39;).click()">
                    <div class="drop-zone-icon">📤</div>
                    <div class="drop-zone-text">点击选择文件或拖拽文件到此处</div>
                    <div class="drop-zone-hint">支持单次上传多个文件，单个文件不超过20MB</div>
                </div>

                <input type="file" id="fileInput" class="file-input" multiple="" onchange="handleFileSelect(event)">

                <div class="file-list" id="fileList"></div>

                <div id="uploadProgress" class="hidden">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text" id="progressText">准备上传...</div>
                </div>

                <div class="button-group" style="margin-top: 20px;">
                    <button class="btn btn-primary" id="uploadBtn" onclick="startUpload()" disabled="">
                        🚀 开始上传
                    </button>
                    <button class="btn btn-secondary" onclick="clearFiles()">
                        🗑️ 清空文件列表
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let selectedFiles = [];
        let currentFolderToken = '';
        let isUploading = false;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadConfig();
            setupDragAndDrop();
        });

        // 设置拖拽上传
        function setupDragAndDrop() {
            const dropZone = document.getElementById('dropZone');
            
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });

            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                
                const files = Array.from(e.dataTransfer.files);
                addFiles(files);
            });
        }

        // 处理文件选择
        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            addFiles(files);
            event.target.value = '';
        }

        // 添加文件到列表
        function addFiles(files) {
            files.forEach(file => {
                if (file.size > 20 * 1024 * 1024) {
                    showToast(`文件 ${file.name} 超过20MB限制，已跳过`, 'error');
                    return;
                }
                
                const fileInfo = {
                    file: file,
                    name: file.name,
                    size: formatFileSize(file.size),
                    status: 'pending'
                };
                selectedFiles.push(fileInfo);
            });
            
            renderFileList();
        }

        // 渲染文件列表
        function renderFileList() {
            const fileList = document.getElementById('fileList');
            const uploadBtn = document.getElementById('uploadBtn');
            
            if (selectedFiles.length === 0) {
                fileList.innerHTML = '';
                uploadBtn.disabled = true;
                return;
            }

            fileList.innerHTML = selectedFiles.map((file, index) => `
                <div class="file-item">
                    <div class="file-item-icon">${getFileIcon(file.name)}</div>
                    <div class="file-item-info">
                        <div class="file-item-name">${file.name}</div>
                        <div class="file-item-size">${file.size}</div>
                    </div>
                    <div class="file-item-status status-${file.status}">
                        ${getStatusText(file.status)}
                    </div>
                </div>
            `).join('');

            uploadBtn.disabled = isUploading;
        }

        // 获取文件图标
        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const iconMap = {
                'pdf': '📄',
                'doc': '📝', 'docx': '📝',
                'xls': '📊', 'xlsx': '📊',
                'ppt': '📽️', 'pptx': '📽️',
                'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️',
                'mp3': '🎵', 'wav': '🎵',
                'mp4': '🎬', 'avi': '🎬',
                'zip': '📦', 'rar': '📦', '7z': '📦',
                'txt': '📃'
            };
            return iconMap[ext] || '📎';
        }

        // 获取状态文本
        function getStatusText(status) {
            const statusMap = {
                'pending': '待上传',
                'success': '成功',
                'failed': '失败'
            };
            return statusMap[status] || status;
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // 加载配置
        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('appId').value = data.app_id || '';
                    if (data.app_secret_configured) {
                        updateConnectionStatus(true);
                    }
                }
            } catch (error) {
                console.error('加载配置失败:', error);
            }
        }

        // 保存配置
        async function saveConfig() {
            const appId = document.getElementById('appId').value.trim();
            const appSecret = document.getElementById('appSecret').value.trim();

            if (!appId || !appSecret) {
                showToast('请填写 App ID 和 App Secret', 'error');
                return;
            }

            try {
                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ app_id: appId, app_secret: appSecret })
                });

                const data = await response.json();
                
                if (data.success) {
                    showToast('配置已保存', 'success');
                    document.getElementById('appSecret').value = '';
                    updateConnectionStatus(true);
                } else {
                    showToast(data.message || '保存失败', 'error');
                }
            } catch (error) {
                showToast('保存配置失败: ' + error.message, 'error');
            }
        }

        // 测试连接
        async function testConnection() {
            const appId = document.getElementById('appId').value.trim();
            const appSecret = document.getElementById('appSecret').value.trim();

            if (appId && appSecret) {
                await saveConfig();
            }

            try {
                showToast('正在测试连接...', 'info');
                
                const response = await fetch('/api/test-connection', { method: 'POST' });
                const data = await response.json();

                if (data.success) {
                    showToast('连接成功！', 'success');
                    updateConnectionStatus(true);
                } else {
                    showToast(data.message || '连接失败', 'error');
                    updateConnectionStatus(false);
                }
            } catch (error) {
                showToast('连接失败: ' + error.message, 'error');
                updateConnectionStatus(false);
            }
        }

        // 更新连接状态
        function updateConnectionStatus(connected) {
            const statusEl = document.getElementById('connectionStatus');
            if (connected) {
                statusEl.textContent = '已连接';
                statusEl.className = 'status-badge connected';
            } else {
                statusEl.textContent = '未连接';
                statusEl.className = 'status-badge disconnected';
            }
        }

        // 创建文件夹
        async function createFolder() {
            const folderName = document.getElementById('newFolderName').value.trim();
            
            if (!folderName) {
                showToast('请输入文件夹名称', 'error');
                return;
            }

            try {
                const response = await fetch('/api/create-folder', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        folder_name: folderName,
                        parent_token: currentFolderToken
                    })
                });

                const data = await response.json();

                if (data.success) {
                    currentFolderToken = data.folder_token;
                    updateFolderInfo();
                    document.getElementById('newFolderName').value = '';
                    showToast('文件夹创建成功！', 'success');
                } else {
                    showToast(data.message || '创建文件夹失败', 'error');
                }
            } catch (error) {
                showToast('创建文件夹失败: ' + error.message, 'error');
            }
        }

        // 更新文件夹信息显示
        function updateFolderInfo() {
            const folderInfo = document.getElementById('folderInfo');
            const folderTokenEl = document.getElementById('currentFolderToken');

            if (currentFolderToken) {
                folderInfo.classList.remove('hidden');
                folderTokenEl.textContent = currentFolderToken;
            } else {
                folderInfo.classList.add('hidden');
            }
        }

        // 清除文件夹设置
        function clearFolder() {
            currentFolderToken = '';
            updateFolderInfo();
            showToast('已清除文件夹设置', 'info');
        }

        // 清空文件列表
        function clearFiles() {
            if (isUploading) return;
            selectedFiles = [];
            renderFileList();
        }

        // 开始上传
        async function startUpload() {
            if (selectedFiles.length === 0) {
                showToast('请先选择要上传的文件', 'error');
                return;
            }

            isUploading = true;
            document.getElementById('uploadBtn').disabled = true;
            document.getElementById('uploadProgress').classList.remove('hidden');

            const formData = new FormData();
            selectedFiles.forEach(fileInfo => {
                formData.append('files[]', fileInfo.file);
                fileInfo.status = 'pending';
            });
            
            if (currentFolderToken) {
                formData.append('parent_token', currentFolderToken);
            }

            renderFileList();

            try {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/api/upload-folder', true);

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = (e.loaded / e.total) * 100;
                        document.getElementById('progressFill').style.width = percent + '%';
                        document.getElementById('progressText').textContent = 
                            `上传中... ${Math.round(percent)}%`;
                    }
                };

                xhr.onload = () => {
                    isUploading = false;
                    
                    try {
                        const data = JSON.parse(xhr.responseText);
                        
                        if (data.success) {
                            if (data.folder_token) {
                                currentFolderToken = data.folder_token;
                                updateFolderInfo();
                            }

                            data.results.forEach(result => {
                                const fileInfo = selectedFiles.find(f => f.name === result.filename);
                                if (fileInfo) {
                                    fileInfo.status = result.status;
                                }
                            });

                            document.getElementById('progressFill').style.width = '100%';
                            document.getElementById('progressText').textContent = data.message;
                            renderFileList();
                            showToast(data.message, 'success');
                        } else {
                            showToast(data.message || '上传失败', 'error');
                            selectedFiles.forEach(f => f.status = 'failed');
                            renderFileList();
                        }
                    } catch (e) {
                        showToast('上传响应解析失败', 'error');
                    }
                };

                xhr.onerror = () => {
                    isUploading = false;
                    showToast('上传失败，请检查网络连接', 'error');
                    selectedFiles.forEach(f => f.status = 'failed');
                    renderFileList();
                    document.getElementById('uploadBtn').disabled = false;
                };

                xhr.send(formData);

            } catch (error) {
                isUploading = false;
                showToast('上传失败: ' + error.message, 'error');
                document.getElementById('uploadBtn').disabled = false;
            }
        }

        // 显示提示消息
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast toast-${type} show`;

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>

</body></html>
