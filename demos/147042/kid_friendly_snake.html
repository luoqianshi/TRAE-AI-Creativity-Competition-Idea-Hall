<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>彩虹小蛇吃水果</title>
  <style>
    :root {
      --bg: #fff6d8;
      --ink: #31415f;
      --green: #76d672;
      --green-dark: #3ea95b;
      --apple: #ff6b75;
      --blue: #78c8ff;
      --purple: #b892ff;
      --shadow: rgba(49, 65, 95, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, rgba(120, 200, 255, 0.45) 0 70px, transparent 72px),
        radial-gradient(circle at 86% 12%, rgba(255, 214, 92, 0.55) 0 90px, transparent 92px),
        radial-gradient(circle at 88% 82%, rgba(184, 146, 255, 0.35) 0 110px, transparent 112px),
        linear-gradient(135deg, #fff9e8, var(--bg));
      padding: 18px;
    }

    .home-screen,
    .game-card {
      background: rgba(255, 255, 255, 0.92);
      border: 5px solid #fff;
      border-radius: 34px;
      box-shadow: 0 18px 50px var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .home-screen {
      width: min(94vw, 720px);
      min-height: 440px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 34px 24px;
    }

    .home-screen::before {
      content: "🍎";
      position: absolute;
      left: 34px;
      top: 28px;
      font-size: 3rem;
      transform: rotate(-12deg);
    }

    .home-screen::after {
      content: "🐍";
      position: absolute;
      right: 32px;
      bottom: 28px;
      font-size: 3.3rem;
      transform: rotate(10deg);
    }

    .home-content {
      position: relative;
      z-index: 1;
      display: grid;
      justify-items: center;
      gap: 16px;
      width: 100%;
    }

    .home-title {
      margin: 0;
      color: var(--green-dark);
      font-size: clamp(2rem, 7vw, 4rem);
    }

    .home-desc {
      max-width: 520px;
      margin: 0;
      color: #66738e;
      font-size: 1.04rem;
      line-height: 1.7;
    }

    .wallet {
      padding: 10px 16px;
      border-radius: 18px;
      background: #fff8dd;
      color: #6b5b20;
      font-weight: 900;
    }

    .mode-buttons {
      display: grid;
      grid-template-columns: repeat(4, minmax(110px, 1fr));
      gap: 12px;
      width: min(100%, 620px);
    }

    .button-board {
      width: min(100%, 620px);
      display: grid;
      gap: 14px;
      padding: 14px;
      border-radius: 26px;
      background: #f3f8ff;
      box-shadow: inset 0 -4px rgba(120, 200, 255, 0.16);
    }

    .button-board .mode-buttons {
      width: 100%;
    }

    .mode-buttons.two {
      grid-template-columns: repeat(2, minmax(150px, 1fr));
      width: min(100%, 430px);
    }

    button {
      border: 0;
      border-radius: 18px;
      padding: 13px 14px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 0 #d8e6f6, 0 12px 20px var(--shadow);
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.2s ease;
      touch-action: manipulation;
    }

    button:hover { background: #f7fbff; }

    button:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #d8e6f6, 0 8px 14px var(--shadow);
    }

    .primary {
      background: linear-gradient(180deg, #9df08d, #64d56f);
      box-shadow: 0 8px 0 #40a95a, 0 12px 20px var(--shadow);
    }

    .shop-toggle {
      min-width: 200px;
      background: linear-gradient(180deg, #ffd65c, #ffb13b);
      box-shadow: 0 8px 0 #d88a19, 0 12px 20px var(--shadow);
    }

    .shop-panel {
      width: min(100%, 620px);
      display: grid;
      justify-items: center;
      gap: 10px;
    }

    .skin-shop {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(140px, 1fr));
      gap: 10px;
      padding: 12px;
      border-radius: 24px;
      background: #f7f0ff;
      max-height: 320px;
      overflow: auto;
    }

    .shop-title {
      margin: 8px 0 0;
      color: #6f5aa8;
      font-size: 1.05rem;
      font-weight: 900;
    }

    .vip-shop {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
      gap: 10px;
      padding: 12px;
      border-radius: 24px;
      background: #fff8dd;
    }

    .skin-shop button {
      min-height: 72px;
      padding: 10px;
      background: #fff;
      box-shadow: 0 6px 0 #d9cff8, 0 10px 16px var(--shadow);
      font-size: 0.92rem;
    }

    .vip-shop button {
      min-height: 92px;
      padding: 12px;
      background: #fff;
      box-shadow: 0 6px 0 #e8c960, 0 10px 16px var(--shadow);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .skin-shop button.equipped {
      background: linear-gradient(180deg, #b5f6a9, #6ee379);
      box-shadow: 0 6px 0 #40a95a, 0 10px 16px var(--shadow);
    }

    .vip-shop button.owned {
      background: linear-gradient(180deg, #ffe58a, #ffd65c);
      box-shadow: 0 6px 0 #d88a19, 0 10px 16px var(--shadow);
    }

    .checkin-panel {
      width: min(100%, 620px);
      display: grid;
      gap: 10px;
      padding: 14px;
      border-radius: 26px;
      background: #fff8dd;
      box-shadow: inset 0 -4px rgba(255, 177, 59, 0.18);
    }

    .checkin-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .checkin-title {
      margin: 0;
      color: #8a5a00;
      font-size: 1.05rem;
      font-weight: 900;
    }

    .checkin-status {
      color: #68758d;
      font-size: 0.9rem;
      font-weight: 800;
    }

    .checkin-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
    }

    .checkin-day {
      min-height: 66px;
      display: grid;
      place-items: center;
      gap: 3px;
      padding: 7px 4px;
      border-radius: 16px;
      background: #ffffff;
      color: #6b5b20;
      box-shadow: 0 4px 0 #f0d26f;
      font-weight: 900;
      text-align: center;
      font-size: 0.8rem;
    }

    .checkin-day.claimed {
      background: linear-gradient(180deg, #b5f6a9, #6ee379);
      box-shadow: 0 4px 0 #40a95a;
      color: #245b32;
    }

    .checkin-day.current {
      outline: 3px solid #ffb13b;
      background: #fff4bd;
    }

    .checkin-reward {
      color: #8a5a00;
      font-size: 0.75rem;
    }

    #checkinBtn {
      justify-self: center;
      min-width: 190px;
      background: linear-gradient(180deg, #ffd65c, #ffb13b);
      box-shadow: 0 8px 0 #d88a19, 0 12px 20px var(--shadow);
    }

    .skin-name,
    .skin-state { display: block; }

    .vip-name,
    .vip-effect,
    .vip-state {
      display: block;
    }

    .vip-effect {
      color: #68758d;
      font-size: 0.82rem;
      margin: 5px 0;
    }

    .vip-state {
      color: #8a5a00;
      font-size: 0.86rem;
      font-weight: 900;
    }

    .skin-preview {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin: 6px 0;
    }

    .skin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.95);
      box-shadow: 0 2px 5px rgba(49,65,95,0.18);
    }

    .skin-state {
      color: #68758d;
      font-size: 0.82rem;
    }

    .game-card {
      width: min(98vw, 960px);
      padding: 18px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 4vw, 2.3rem);
    }

    .subtitle {
      margin: 6px 0 0;
      color: #66738e;
      font-size: 0.96rem;
    }

    .scoreboard {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .score-pill {
      min-width: 82px;
      padding: 9px 12px;
      border-radius: 18px;
      background: #f3f8ff;
      text-align: center;
      box-shadow: inset 0 -3px rgba(120, 200, 255, 0.18);
    }

    .score-pill span {
      display: block;
      color: #71809a;
      font-size: 0.72rem;
    }

    .score-pill strong {
      display: block;
      font-size: 1.25rem;
      line-height: 1.1;
    }

    .play-area {
      display: grid;
      grid-template-columns: 1fr 190px;
      gap: 18px;
      margin-top: 18px;
    }

    .canvas-wrap {
      position: relative;
      display: grid;
      place-items: center;
      background: #eaffea;
      border-radius: 28px;
      border: 6px solid #fff;
      box-shadow: inset 0 0 0 3px rgba(62, 169, 91, 0.12), 0 12px 24px var(--shadow);
      overflow: hidden;
      min-height: 420px;
    }

    canvas {
      width: min(100%, 660px);
      aspect-ratio: 1 / 1;
      display: block;
    }

    .message {
      position: absolute;
      inset: auto 24px 24px;
      border-radius: 22px;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 10px 22px var(--shadow);
      text-align: center;
      font-weight: 700;
      line-height: 1.5;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .message.hidden {
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hint {
      background: #fff8dd;
      border-radius: 22px;
      padding: 14px;
      color: #68758d;
      line-height: 1.55;
      font-size: 0.93rem;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-top: auto;
    }

    .controls button {
      min-height: 54px;
      padding: 8px;
      background: #eef7ff;
      font-size: 1.3rem;
    }

    .controls .empty { visibility: hidden; }

    footer {
      margin-top: 14px;
      color: #77839a;
      font-size: 0.9rem;
      text-align: center;
    }

    .screen-hidden { display: none; }

    @media (max-width: 760px) {
      .mode-buttons,
      .mode-buttons.two,
      .checkin-grid,
      .skin-shop,
      .vip-shop,
      .play-area {
        grid-template-columns: 1fr;
      }

      .side-panel {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .hint,
      .controls {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
  <section id="homeScreen" class="home-screen" aria-label="游戏主页">
    <div class="home-content">
      <h1 class="home-title">彩虹小蛇吃水果</h1>
      <p class="home-desc">选择模式和难度开始游戏。不同水果有不同积分，积分可以在商城兑换小蛇皮肤和 VIP。</p>
      <div class="wallet">累计积分：<span id="totalPoints">0</span></div>
      <div class="checkin-panel" aria-label="七日签到">
        <div class="checkin-head">
          <p class="checkin-title">七日签到</p>
          <span id="checkinStatus" class="checkin-status">每天签到领取积分</span>
        </div>
        <div id="checkinGrid" class="checkin-grid" aria-label="七日签到奖励"></div>
        <button id="checkinBtn" type="button">今日签到</button>
      </div>
      <div class="button-board" aria-label="模式按键">
        <div class="mode-buttons two" aria-label="挑战模式">
          <button id="endlessModeBtn" class="primary">对战无尽<br>有对手蛇</button>
          <button id="teamModeBtn">队友限时<br>60 秒协作</button>
        </div>
        <div class="mode-buttons two" aria-label="自由模式">
          <button id="soloEndlessModeBtn">无对手无尽<br>自由挑战</button>
          <button id="timedModeBtn">限时模式<br>60 秒挑战</button>
        </div>
        <div class="mode-buttons" aria-label="难度模式">
          <button id="childModeBtn" class="primary">儿童模式<br>慢速</button>
          <button id="teenModeBtn">青少年模式<br>中速</button>
          <button id="adultModeBtn">成人模式<br>快速</button>
        </div>
      </div>
      <button id="shopToggleBtn" class="shop-toggle">商城</button>
      <div id="shopPanel" class="shop-panel screen-hidden" aria-label="商城">
        <p class="shop-title">皮肤商店</p>
        <div id="skinShop" class="skin-shop" aria-label="皮肤商店"></div>
        <p id="skinStatus" class="home-desc">先攒积分，再给小蛇换漂亮皮肤。</p>
        <p class="shop-title">VIP专区</p>
        <div id="vipShop" class="vip-shop" aria-label="VIP专区"></div>
        <p id="vipStatus" class="home-desc">VIP 兑换后永久生效，不同 VIP 有不同用途。</p>
      </div>
    </div>
  </section>

  <main id="gameCard" class="game-card screen-hidden" aria-label="彩虹小蛇吃水果小游戏">
    <header>
      <div>
        <h1>彩虹小蛇吃水果</h1>
        <p class="subtitle">对战无尽有黑色对手蛇；无对手无尽没有对手蛇。磁铁可以吸走 4 格内的水果。</p>
      </div>
      <div class="scoreboard" aria-live="polite">
        <div class="score-pill"><span>积分</span><strong id="score">0</strong></div>
        <div class="score-pill"><span>最好</span><strong id="best">0</strong></div>
        <div class="score-pill"><span>模式</span><strong id="modeLabel">无尽</strong></div>
        <div class="score-pill"><span>时间</span><strong id="timerValue">∞</strong></div>
        <div class="score-pill"><span>难度</span><strong id="difficultyLabel">儿童</strong></div>
      </div>
    </header>

    <section class="play-area">
      <div class="canvas-wrap">
        <canvas id="game" width="480" height="480" aria-label="贪吃蛇游戏画布"></canvas>
        <div id="message" class="message">游戏开始啦，小蛇正在出发！</div>
      </div>

      <aside class="side-panel">
        <button id="startBtn" class="primary">开始游戏</button>
        <button id="pauseBtn">暂停</button>
        <button id="resetBtn">重新开始</button>
        <div class="hint">场上有 ×2、盾牌、磁铁和药水。药水只在无尽类模式出现，吃到后可以复活一次。</div>
        <div class="controls" aria-label="屏幕方向按钮">
          <span class="empty"></span>
          <button data-dir="up" aria-label="向上">▲</button>
          <span class="empty"></span>
          <button data-dir="left" aria-label="向左">◀</button>
          <button data-dir="down" aria-label="向下">▼</button>
          <button data-dir="right" aria-label="向右">▶</button>
        </div>
      </aside>
    </section>

    <footer>小提示：护盾能穿墙、穿尾巴；对战无尽里还能穿过对手蛇。</footer>
  </main>

  <script>

    function grantFreePointsOnce() {
      const bonusKey = "kidSnakeFree100000PointsGranted";
      if (localStorage.getItem(bonusKey) === "yes") return;
      totalPoints += 100000;
      localStorage.setItem("kidSnakeTotalPoints", totalPoints);
      localStorage.setItem(bonusKey, "yes");

    function prepareSkins() {
      if (!unlockedSkins.includes("green")) unlockedSkins.push("green");
      if (!skinOptions.some(skin => skin.id === currentSkin) || !unlockedSkins.includes(currentSkin)) currentSkin = "green";
      snakeColors = (skinOptions.find(skin => skin.id === currentSkin) || skinOptions[0]).colors;
      saveSkinData();
    }

    function saveSkinData() {
      localStorage.setItem("kidSnakeUnlockedSkins", JSON.stringify(unlockedSkins));
      localStorage.setItem("kidSnakeCurrentSkin", currentSkin);
    }

    function renderSkinShop() {
      totalPointsEl.textContent = totalPoints;
      skinShop.innerHTML = "";
      skinOptions.forEach(skin => {
        const owned = unlockedSkins.includes(skin.id);
        const equipped = currentSkin === skin.id;
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.skinId = skin.id;
        button.classList.toggle("equipped", equipped);
        const preview = skin.colors.map(color => `<span class="skin-dot" style="background:${color}"></span>`).join("");
        const state = equipped ? "使用中" : owned ? "点击换上" : `${skin.cost} 积分`;
        button.innerHTML = `<span class="skin-name">${skin.name}</span><span class="skin-preview">${preview}</span><span class="skin-state">${state}</span>`;
        skinShop.appendChild(button);
      });
    }

    function chooseSkin(skinId) {
      const skin = skinOptions.find(item => item.id === skinId);
      if (!skin) return;
      if (unlockedSkins.includes(skin.id)) {
        currentSkin = skin.id;
        snakeColors = skin.colors;
        saveSkinData();
        renderSkinShop();
        skinStatus.textContent = `已换上 ${skin.name} 皮肤。`;
        if (snake.length) draw();
        return;
      }
      if (totalPoints < skin.cost) {
        skinStatus.textContent = `积分还不够，${skin.name} 需要 ${skin.cost} 积分。`;
        return;
      }
      totalPoints -= skin.cost;
      unlockedSkins.push(skin.id);
      currentSkin = skin.id;
      snakeColors = skin.colors;
      localStorage.setItem("kidSnakeTotalPoints", totalPoints);
      saveSkinData();
      renderSkinShop();
      skinStatus.textContent = `兑换成功，已换上 ${skin.name} 皮肤！`;
      if (snake.length) draw();
    }

        button.type = "button";
        button.dataset.vipId = vip.id;
        button.classList.toggle("owned", owned);
        button.innerHTML = `

          <span class="vip-effect">${vip.effect}</span>

        vipShop.appendChild(button);

    function chooseVip(vipId) {

      if (hasVip(vip.id)) {
        vipStatus.textContent = `${vip.name} 已拥有：${vip.effect}`;
        return;

      totalPoints -= vip.cost;
      ownedVips.push(vip.id);
      localStorage.setItem("kidSnakeTotalPoints", totalPoints);
      localStorage.setItem("kidSnakeOwnedVips", JSON.stringify(ownedVips));
      renderSkinShop();
      renderVipShop();
      vipStatus.textContent = `兑换成功：${vip.name} 已永久生效。`;
    }

    function hasVip(vipId) {
      return ownedVips.includes(vipId);

    function renderCheckinPanel() {
      const today = todayKey();
      const alreadyChecked = lastCheckinDate === today;
      const currentIndex = Math.min(checkinDay, checkinRewards.length - 1);
      checkinGrid.innerHTML = "";

      checkinRewards.forEach((reward, index) => {
        const item = document.createElement("div");
        item.className = "checkin-day";
        if (index < checkinDay) item.classList.add("claimed");
        if (!alreadyChecked && index === currentIndex) item.classList.add("current");
        item.innerHTML = `
          <span>第 ${index + 1} 天</span>
          <span class="checkin-reward">+${reward}</span>
        `;
        checkinGrid.appendChild(item);
      });

      checkinBtn.disabled = alreadyChecked;
      checkinBtn.textContent = alreadyChecked ? "今日已签到" : `签到领取 ${checkinRewards[currentIndex]} 积分`;
      checkinStatus.textContent = alreadyChecked
        ? "今天已经领取，明天再来。"
        : `当前可领第 ${currentIndex + 1} 天奖励。`;
    }

    function claimDailyCheckin() {
      const today = todayKey();
      if (lastCheckinDate === today) {
        renderCheckinPanel();
        return;
      }

      const rewardIndex = Math.min(checkinDay, checkinRewards.length - 1);
      const reward = checkinRewards[rewardIndex];
      totalPoints += reward;
      lastCheckinDate = today;
      checkinDay = rewardIndex + 1 >= checkinRewards.length ? 0 : rewardIndex + 1;

      localStorage.setItem("kidSnakeTotalPoints", totalPoints);
      localStorage.setItem("kidSnakeLastCheckinDate", lastCheckinDate);
      localStorage.setItem("kidSnakeCheckinDay", checkinDay);

      totalPointsEl.textContent = totalPoints;
      renderSkinShop();
      renderVipShop();
      renderCheckinPanel();
      checkinStatus.textContent = `签到成功，获得 ${reward} 积分！`;
    }

    function todayKey() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

      canvas.width = size;
      canvas.height = size;
      canvas.style.width = `min(100%, ${size}px)`;
      cell = canvas.width / grid;

      configureBoard();
      clearTimeout(enemyRespawnTimer);
      snake = [
        { x: Math.floor(grid / 2), y: Math.floor(grid / 2) },

      if (gameMode === "team") {
        enemySnakes = [makeEnemySnakeAt(3, 3), makeEnemySnakeAt(grid - 6, grid - 6)];
      } else if (hasEnemySnakeMode()) {
        enemySnakes = [makeEnemySnake()];
      }
      enemyFood = [];
      enemyDirection = { x: -1, y: 0 };
      buddySnake = gameMode === "team" ? makeBuddySnake() : [];
      buddyDirection = { x: 1, y: 0 };

      doublePowerUp = makePowerUp();

      magnetPowerUp = makePowerUp();

    function enterGame(selectedMode = "endless") {
      if (gameEntered) return;

    function startGame() {
      clearTimeout(returnHomeTimer);
      if (running && !paused) return;
      running = true;
      paused = false;
      startBtn.textContent = "继续加油";
      pauseBtn.textContent = "暂停";
      hideMessage();
      clearInterval(timer);
      clearInterval(countdownTimer);
      timer = setInterval(tick, stepMs);
      if (gameMode === "timed") countdownTimer = setInterval(countdownTick, 1000);
      if (gameMode === "soloEndless") countdownTimer = setInterval(soloEndlessTick, 1000);
      if (gameMode === "team") countdownTimer = setInterval(countdownTick, 1000);

    function pauseGame() {
      if (!running) return;
      if (gameMode === "timed" || gameMode === "team") {
        returnToHome();
        return;
      }

      paused = !paused;
      pauseBtn.textContent = paused ? "继续" : "暂停";
      if (paused) {
        clearInterval(timer);
        showMessage("游戏已暂停，点击“继续”接着玩。");
      } else {
        hideMessage();
        timer = setInterval(tick, stepMs);

    function countdownTick() {
      if (gameMode !== "timed" && gameMode !== "team") return;
      timeLeft -= 1;
      updateModeDisplay();
      if (timeLeft <= 0) {
        endRoundAndReturnHome(`时间到！本局获得 ${score} 积分，马上返回主页。`, 1800);
      }

    function soloEndlessTick() {
      if (gameMode !== "soloEndless") return;
      soloEndlessPlayedSeconds += 1;
      if (!soloEndlessBonusActive && soloEndlessPlayedSeconds === soloEndlessBonusStart) {
        soloEndlessBonusActive = true;
        showMessage("奖励时间开始！持续 2 分 30 秒，积分翻倍！");
      }
      if (soloEndlessBonusActive && soloEndlessPlayedSeconds >= soloEndlessBonusStart + soloEndlessBonusDuration) {
        soloEndlessBonusActive = false;
        showMessage("奖励时间结束，继续加油！");
      }
      updateModeDisplay();

    function updateModeDisplay() {
      modeLabel.textContent = modeDisplayName();
      if (gameMode === "soloEndless" && soloEndlessBonusActive) {
        const bonusLeft = soloEndlessBonusStart + soloEndlessBonusDuration - soloEndlessPlayedSeconds;
        const min = Math.floor(bonusLeft / 60);
        const sec = bonusLeft % 60;
        timerValue.textContent = `奖励 ${min}:${sec.toString().padStart(2, "0")}`;
        timerValue.style.color = "#f97316";
      } else if (gameMode === "timed" || gameMode === "team") {
        timerValue.textContent = `${timeLeft}s`;
        timerValue.style.color = gameMode === "team" ? "#34d399" : "";
      } else {
        timerValue.textContent = "∞";
        timerValue.style.color = "";
      }
      difficultyLabel.textContent = difficultySettings[difficultyMode].label;

    function isEndlessMode() {
      return gameMode === "endless" || gameMode === "soloEndless" || gameMode === "team";
    }

    function hasEnemySnakeMode() {
      return gameMode === "endless" || gameMode === "team";
    }

    function isTeamMode() {
      return gameMode === "team";
    }

    function modeDisplayName() {
      if (gameMode === "timed") return "限时";
      if (gameMode === "soloEndless") return "无对手";
      if (gameMode === "team") return "队友限时";
      return "对战";
    }

    function returnToHome() {
      clearInterval(timer);
      clearInterval(countdownTimer);
      clearTimeout(returnHomeTimer);
      clearTimeout(enemyRespawnTimer);
      stopShield();
      stopDoublePoints();
      stopMagnet();
      reviveReady = false;
      running = false;
      paused = false;

      homeScreen.classList.remove("screen-hidden");
      gameCard.classList.add("screen-hidden");

    function endRoundAndReturnHome(text, delay = 1400) {
      clearInterval(timer);
      clearInterval(countdownTimer);
      clearTimeout(returnHomeTimer);
      clearTimeout(enemyRespawnTimer);
      stopShield();
      stopDoublePoints();
      stopMagnet();
      reviveReady = false;
      running = false;
      paused = false;
      startBtn.textContent = "开始游戏";
      pauseBtn.textContent = "暂停";
      showMessage(text);
      returnHomeTimer = setTimeout(returnToHome, delay);
    }

    function tick() {
      direction = nextDirection;
      const head = snake[0];
      const rawHead = { x: head.x + direction.x, y: head.y + direction.y };
      if (isEndlessMode() && !shieldActive && isOutOfBounds(rawHead)) {
        if (tryRevive()) return;
        endRoundAndReturnHome(`碰到墙壁啦！本局获得 ${score} 积分，马上返回主页。`);
        return;
      }

      const newHead = { x: wrap(rawHead.x), y: wrap(rawHead.y) };
      if (isEndlessMode() && !shieldActive && snake.some(part => sameCell(part, newHead))) {
        if (tryRevive()) return;
        endRoundAndReturnHome(`碰到自己啦！本局获得 ${score} 积分，马上返回主页。`);
        return;
      }

      if (hasEnemySnakeMode() && !shieldActive) {
        for (const es of enemySnakes) {
          if (es.some(part => sameCell(part, newHead))) {
            if (tryRevive()) return;
            endRoundAndReturnHome(`撞到对手蛇啦！本局获得 ${score} 积分，马上返回主页。`);
            return;
          }
        }
      }

      snake.unshift(newHead);
      let grew = false;
      if (sameCell(newHead, apple)) {
        collectApple();
        grew = true;
      } else if (eatEnemyFood(newHead)) {
        addScore(enemyFoodPoints() * scoreMultiplier());
        grew = true;
      }

      if (doublePowerUp && sameCell(newHead, doublePowerUp)) activateDoublePoints();
      if (shieldPowerUp && sameCell(newHead, shieldPowerUp)) activateShield();
      if (magnetPowerUp && sameCell(newHead, magnetPowerUp)) activateMagnet();
      if (potionPowerUp && sameCell(newHead, potionPowerUp)) activateRevivePotion();

      if (!grew) snake.pop();
      if (magnetActive) {
        if (appleInMagnetRange()) {
          collectApple();
          duplicateTail();
        }
        if (enemyFood.length > 0) {
          const magnetFoods = enemyFood.filter(food => gridDistance(snake[0], food) <= magnetRange());
          magnetFoods.forEach(food => {
            const idx = enemyFood.indexOf(food);
            if (idx !== -1) {
              enemyFood.splice(idx, 1);
              addScore(enemyFoodPoints());
              duplicateTail();
            }
          });
        }
      }
      while (snake.length > maxSnakeLength) snake.pop();
      moveEnemySnake();
      moveBuddySnake();
      draw();
    }

    function collectApple() {
      addScore(fruitPoints(apple) * scoreMultiplier());
      apple = makeApple();
    }

    function fruitPoints(fruit) {
      return (fruit?.points || fruitOptions[0].points) + (hasVip("score") ? 5 : 0);
    }

    function enemyFoodPoints() {
      return fruitOptions[0].points * 2 * (hasVip("battle") ? 2 : 1);
    }

    function scoreMultiplier() {
      let mult = doublePointsActive ? 2 : 1;
      if (gameMode === "soloEndless" && soloEndlessBonusActive) mult *= 2;
      return mult;
    }

    function addScore(points) {
      score += points;
      totalPoints += points;
      scoreEl.textContent = score;
      totalPointsEl.textContent = totalPoints;
      localStorage.setItem("kidSnakeTotalPoints", totalPoints);
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem("kidSnakeBest", best);
      }
      renderSkinShop();
      renderVipShop();
    }

    function duplicateTail() {
      const tail = snake[snake.length - 1];
      if (tail && snake.length < maxSnakeLength) snake.push({ x: tail.x, y: tail.y });
    }

    function appleInMagnetRange() {
      const head = snake[0];
      return gridDistance(head, apple) <= magnetRange();
    }

    function magnetRange() {
      return hasVip("magnet") ? 6 : 4;
    }

    function gridDistance(a, b) {
      return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
    }

    function eatEnemyFood(head) {
      const index = enemyFood.findIndex(food => sameCell(food, head));
      if (index === -1) return false;
      enemyFood.splice(index, 1);
      return true;
    }

    function moveEnemySnake() {
      if (!hasEnemySnakeMode() || enemySnakes.length === 0) return;
      for (let ei = 0; ei < enemySnakes.length; ei++) {
        const es = enemySnakes[ei];
        if (es.length === 0) continue;
        const head = es[0];
        const dir = chooseEnemyDirectionFor(es, head);
        const newHead = { x: wrap(head.x + dir.x), y: wrap(head.y + dir.y) };
        const allSnakeParts = snake.concat(buddySnake);
        if (allSnakeParts.some(part => sameCell(part, newHead))) {
          enemyFood = enemyFood.concat(es.map(part => ({ ...part })));
          enemySnakes[ei] = [];
          setTimeout(() => {
            if (hasEnemySnakeMode() && gameEntered && enemySnakes[ei] && enemySnakes[ei].length === 0) {
              enemySnakes[ei] = makeEnemySnake();
              draw();
            }
          }, 1500);
          continue;
        }
        if (es.some((part, i) => i > 0 && sameCell(part, newHead))) {
          enemyFood = enemyFood.concat(es.map(part => ({ ...part })));
          enemySnakes[ei] = [];
          setTimeout(() => {
            if (hasEnemySnakeMode() && gameEntered && enemySnakes[ei] && enemySnakes[ei].length === 0) {
              enemySnakes[ei] = makeEnemySnake();
              draw();
            }
          }, 1500);
          continue;
        }
        const ateApple = sameCell(newHead, apple);
        es.unshift(newHead);
        if (ateApple) {
          apple = makeApple();
        } else {
          es.pop();
        }
        while (es.length > maxEnemyLength) es.pop();
      }
    }

    function moveBuddySnake() {
      if (!isTeamMode() || buddySnake.length === 0) return;
      const head = buddySnake[0];
      buddyDirection = chooseBuddyDirection();
      const newHead = { x: wrap(head.x + buddyDirection.x), y: wrap(head.y + buddyDirection.y) };
      const allEnemyParts = enemySnakes.flatMap(es => es);
      if (allEnemyParts.some(part => sameCell(part, newHead))) {
        buddySnake = [];
        setTimeout(() => {
          if (isTeamMode() && gameEntered && buddySnake.length === 0) {
            buddySnake = makeBuddySnake();
            draw();
          }
        }, 1500);
        return;
      }
      if (buddySnake.some((part, i) => i > 0 && sameCell(part, newHead))) {
        buddySnake = [];
        setTimeout(() => {
          if (isTeamMode() && gameEntered && buddySnake.length === 0) {
            buddySnake = makeBuddySnake();
            draw();
          }
        }, 1500);
        return;
      }
      const ateApple = sameCell(newHead, apple);
      buddySnake.unshift(newHead);
      let grew = false;
      if (ateApple) {
        apple = makeApple();
        grew = true;
      } else {
        const foodIdx = enemyFood.findIndex(food => sameCell(food, newHead));
        if (foodIdx !== -1) {
          enemyFood.splice(foodIdx, 1);
          grew = true;
        }
      }
      if (!grew) buddySnake.pop();
      while (buddySnake.length > 15) buddySnake.pop();
    }

    function chooseBuddyDirection() {
      const head = buddySnake[0];
      const choices = [
        { x: 0, y: -1 }, { x: 0, y: 1 },
        { x: -1, y: 0 }, { x: 1, y: 0 }
      ].filter(c => !(c.x + buddyDirection.x === 0 && c.y + buddyDirection.y === 0));
      const safe = choices.filter(c => {
        const next = { x: wrap(head.x + c.x), y: wrap(head.y + c.y) };
        return !buddySnake.some(part => sameCell(part, next));
      });
      const usable = safe.length ? safe : choices;
      let target = apple;
      if (!target && enemyFood.length > 0) target = enemyFood[0];
      if (!target) return usable[Math.floor(Math.random() * usable.length)] || buddyDirection;
      return usable
        .map(c => {
          const next = { x: wrap(head.x + c.x), y: wrap(head.y + c.y) };
          return { direction: c, distance: wrappedDistance(next, target) };
        })
        .sort((a, b) => a.distance - b.distance)[0].direction || buddyDirection;
    }

    function chooseEnemyDirectionFor(es, head) {
      const choices = [
        { x: 0, y: -1 }, { x: 0, y: 1 },
        { x: -1, y: 0 }, { x: 1, y: 0 }
      ].filter(c => !(c.x + enemyDirection.x === 0 && c.y + enemyDirection.y === 0));
      const safe = choices.filter(c => {
        const next = { x: wrap(head.x + c.x), y: wrap(head.y + c.y) };
        return !es.some(part => sameCell(part, next));
      });
      const usable = safe.length ? safe : choices;
      if (!apple) return usable[Math.floor(Math.random() * usable.length)] || enemyDirection;
      return usable
        .map(c => {
          const next = { x: wrap(head.x + c.x), y: wrap(head.y + c.y) };
          return { direction: c, distance: wrappedDistance(next, apple) };
        })
        .sort((a, b) => a.distance - b.distance)[0].direction || enemyDirection;
    }

    function wrappedDistance(from, to) {
      const dx = Math.abs(from.x - to.x);
      const dy = Math.abs(from.y - to.y);
      return Math.min(dx, grid - dx) + Math.min(dy, grid - dy);
    }

    function makeEnemySnake() {
      const y = Math.max(3, Math.floor(grid / 3));
      return [
        { x: grid - 5, y },
        { x: grid - 4, y },
        { x: grid - 3, y },
        { x: grid - 2, y }
      ];
    }

    function makeEnemySnakeAt(sx, sy) {
      return [
        { x: sx + 3, y: sy },
        { x: sx + 2, y: sy },
        { x: sx + 1, y: sy },
        { x: sx, y: sy }
      ];
    }

    function makeBuddySnake() {
      const cx = Math.floor(grid / 2);
      const cy = Math.max(3, Math.floor(grid / 2) + 3);
      return [
        { x: cx, y: cy },
        { x: cx - 1, y: cy },
        { x: cx - 2, y: cy },
        { x: cx - 3, y: cy }
      ];
    }

    function makeApple() {
      let spot;
      do {
        spot = randomSpot();
      } while (isOccupied(spot, true));
      const fruit = fruitOptions[Math.floor(Math.random() * fruitOptions.length)];
      return { ...spot, ...fruit };
    }

    function makePowerUp() {
      let spot;
      do {
        spot = randomSpot();
      } while (isOccupied(spot, true));
      return spot;
    }

    function randomSpot() {
      return { x: Math.floor(Math.random() * grid), y: Math.floor(Math.random() * grid) };
    }

    function isOccupied(spot, includePowerUps) {
      const allEnemyParts = enemySnakes.flatMap(es => es);
      return snake.some(part => sameCell(part, spot))
        || allEnemyParts.some(part => sameCell(part, spot))
        || buddySnake.some(part => sameCell(part, spot))
        || enemyFood.some(food => sameCell(food, spot))
        || (apple && sameCell(apple, spot))
        || (includePowerUps && doublePowerUp && sameCell(doublePowerUp, spot))
        || (includePowerUps && shieldPowerUp && sameCell(shieldPowerUp, spot))
        || (includePowerUps && magnetPowerUp && sameCell(magnetPowerUp, spot))
        || (includePowerUps && potionPowerUp && sameCell(potionPowerUp, spot));
    }

    function activateShield() {
      shieldActive = true;
      shieldTimeLeft = shieldDuration();
      shieldPowerUp = null;
      clearInterval(shieldTimer);
      shieldTimer = setInterval(() => {
        shieldTimeLeft -= 1;
        if (shieldTimeLeft <= 0) {
          stopShield();
          if (isEndlessMode() && gameEntered) {
            shieldPowerUp = makePowerUp();
            draw();
          }
        }
      }, 1000);
    }

    function stopShield() {
      clearInterval(shieldTimer);
      shieldTimer = null;
      shieldActive = false;
      shieldTimeLeft = 0;
    }

    function shieldDuration() {
      return hasVip("shield") ? 45 : 30;
    }

    function activateDoublePoints() {
      doublePointsActive = true;
      doublePointsTimeLeft = doublePointsDuration();
      doublePowerUp = null;
      clearInterval(doublePointsTimer);
      doublePointsTimer = setInterval(() => {
        doublePointsTimeLeft -= 1;
        if (doublePointsTimeLeft <= 0) {
          stopDoublePoints();
          doublePowerUp = makePowerUp();
          draw();
        }
      }, 1000);
    }

    function stopDoublePoints() {
      clearInterval(doublePointsTimer);
      doublePointsTimer = null;
      doublePointsActive = false;
      doublePointsTimeLeft = 0;
    }

    function doublePointsDuration() {
      return hasVip("power") ? 45 : 30;
    }

    function activateMagnet() {
      magnetActive = true;
      magnetTimeLeft = 30;
      magnetPowerUp = null;
      clearInterval(magnetTimer);
      magnetTimer = setInterval(() => {
        magnetTimeLeft -= 1;
        if (magnetTimeLeft <= 0) {
          stopMagnet();
          magnetPowerUp = makePowerUp();
          draw();
        }
      }, 1000);
    }

    function stopMagnet() {
      clearInterval(magnetTimer);
      magnetTimer = null;
      magnetActive = false;
      magnetTimeLeft = 0;
    }

    function activateRevivePotion() {
      reviveReady = true;
      potionPowerUp = null;
    }

    function tryRevive() {
      if (!reviveReady) return false;

      reviveReady = false;
      const safe = findSafeReviveSpot();
      snake = [
        { x: safe.x, y: safe.y },
        { x: Math.max(0, safe.x - 1), y: safe.y },
        { x: Math.max(0, safe.x - 2), y: safe.y }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      potionPowerUp = isEndlessMode() ? makePowerUp() : null;
      showMessage("药水生效，小蛇复活了一次！");
      draw();
      return true;
    }

    function findSafeReviveSpot() {
      for (let y = 2; y < grid - 2; y++) {
        for (let x = 2; x < grid - 2; x++) {
          const spot = { x, y };
          const allEnemyParts = enemySnakes.flatMap(es => es);
          if (!allEnemyParts.some(part => sameCell(part, spot)) && !enemyFood.some(food => sameCell(food, spot)) && !buddySnake.some(part => sameCell(part, spot))) {
            return spot;
          }
        }
      }
      return { x: Math.floor(grid / 2), y: Math.floor(grid / 2) };
    }

    function changeDirection(dir) {
      if (!gameEntered) enterGame("soloEndless");
      const map = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };
      const next = map[dir];
      if (!next) return;
      if (direction.x + next.x === 0 && direction.y + next.y === 0) return;
      nextDirection = next;
      if (!running) startGame();
    }

    function selectDifficulty(mode) {
      difficultyMode = mode;
      stepMs = difficultySettings[difficultyMode].speed;
      childModeBtn.classList.toggle("primary", mode === "child");
      teenModeBtn.classList.toggle("primary", mode === "teen");
      adultModeBtn.classList.toggle("primary", mode === "adult");
      updateModeDisplay();
      if (running) {
        clearInterval(timer);
        timer = setInterval(tick, stepMs);
      }
    }

    function selectGameMode(mode) {
      endlessModeBtn.classList.toggle("primary", mode === "endless");
      soloEndlessModeBtn.classList.toggle("primary", mode === "soloEndless");
      teamModeBtn.classList.toggle("primary", mode === "team");
      timedModeBtn.classList.toggle("primary", mode === "timed");
      enterGame(mode);
    }

    function showMessage(text) {
      messageEl.textContent = text;
      messageEl.classList.remove("hidden");
    }

    function hideMessage() {
      messageEl.classList.add("hidden");
    }

    function sameCell(a, b) {
      return a && b && a.x === b.x && a.y === b.y;
    }

    function isOutOfBounds(spot) {
      return spot.x < 0 || spot.x >= grid || spot.y < 0 || spot.y >= grid;
    }

    function wrap(value) {
      if (value < 0) return grid - 1;
      if (value >= grid) return 0;
      return value;
    }

    function draw() {
      drawBoard();
      drawApple();
      drawEnemyFood();
      drawDoublePowerUp();
      drawShieldPowerUp();
      drawMagnetPowerUp();
      drawPotionPowerUp();
      drawEnemySnake();
      drawBuddySnake();
      drawSnake();
    }

    function drawBoard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let y = 0; y < grid; y++) {
        for (let x = 0; x < grid; x++) {
          ctx.fillStyle = (x + y) % 2 === 0 ? "#e9ffe7" : "#ddf8dc";
          roundRect(x * cell + 2, y * cell + 2, cell - 4, cell - 4, 8, true);
        }
      }
    }

    function drawApple() {
      if (!apple) return;
      const { cx, cy } = centerOf(apple);
      ctx.save();

      if (apple.id === "banana") {
        ctx.strokeStyle = apple.colors[0];
        ctx.lineWidth = 8;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(cx - 1, cy - 4, 13, 0.15 * Math.PI, 0.78 * Math.PI);
        ctx.stroke();
      } else if (apple.id === "grape") {
        ctx.fillStyle = apple.colors[0];
        [[-5, -5], [5, -5], [0, 3], [-8, 4], [8, 4]].forEach(([dx, dy]) => {
          ctx.beginPath();
          ctx.arc(cx + dx, cy + dy, 5, 0, Math.PI * 2);
          ctx.fill();
        });
      } else if (apple.id === "watermelon") {
        ctx.fillStyle = apple.colors[0];
        ctx.beginPath();
        ctx.arc(cx, cy, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = apple.colors[1];
        ctx.beginPath();
        ctx.arc(cx, cy, 8, 0, Math.PI * 2);
        ctx.fill();
      } else if (apple.id === "pineapple") {
        ctx.fillStyle = apple.colors[1];
        ctx.beginPath();
        ctx.moveTo(cx, cy - 16);
        ctx.lineTo(cx - 8, cy - 8);
        ctx.lineTo(cx + 8, cy - 8);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = apple.colors[0];
        roundRect(cx - 9, cy - 7, 18, 18, 7, true);
      } else if (apple.id === "goldfruit") {
        ctx.fillStyle = apple.colors[0];
        ctx.strokeStyle = "#fff4bd";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else if (apple.id === "tenfruit") {
        ctx.fillStyle = "rgba(250, 204, 21, 0.35)";
        ctx.beginPath();
        ctx.arc(cx, cy, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = apple.colors[0];
        ctx.strokeStyle = apple.colors[1];
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(cx, cy, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 10px Microsoft YaHei, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("10×", cx, cy);
      } else {
        ctx.fillStyle = apple.colors[1] || "#55ad62";
        ctx.beginPath();
        ctx.ellipse(cx + 5, cy - 13, 6, 3.5, -0.65, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = apple.colors[0];
        ctx.beginPath();
        ctx.arc(cx - 4, cy, 9, 0, Math.PI * 2);
        ctx.arc(cx + 4, cy, 9, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "#31415f";
      ctx.font = "bold 10px Microsoft YaHei, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(apple.points, cx, cy + 16);
      ctx.restore();
    }

    function drawDoublePowerUp() {
      if (!doublePowerUp) return;
      const { cx, cy } = centerOf(doublePowerUp);
      ctx.save();
      ctx.fillStyle = "#fff4bd";
      ctx.strokeStyle = "#e0a018";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(cx, cy, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#8a5a00";
      ctx.font = "bold 12px Microsoft YaHei, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("×2", cx, cy + 0.5);
      ctx.restore();
    }

    function drawShieldPowerUp() {
      if (!shieldPowerUp || !isEndlessMode()) return;
      const { cx, cy } = centerOf(shieldPowerUp);
      ctx.save();
      ctx.fillStyle = "#79e6ff";
      ctx.strokeStyle = "#247edb";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx, cy - 14);
      ctx.lineTo(cx + 12, cy - 8);
      ctx.lineTo(cx + 10, cy + 6);
      ctx.quadraticCurveTo(cx, cy + 16, cx - 10, cy + 6);
      ctx.lineTo(cx - 12, cy - 8);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawMagnetPowerUp() {
      if (!magnetPowerUp) return;
      const { cx, cy } = centerOf(magnetPowerUp);
      ctx.save();
      ctx.strokeStyle = "#e11d48";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(cx, cy, 11, 0.15 * Math.PI, 0.85 * Math.PI, true);
      ctx.stroke();
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(cx - 13, cy + 1, 7, 6);
      ctx.fillRect(cx + 6, cy + 1, 7, 6);
      ctx.restore();
    }

    function drawPotionPowerUp() {
      if (!potionPowerUp || !isEndlessMode()) return;
      const { cx, cy } = centerOf(potionPowerUp);
      ctx.save();

      ctx.fillStyle = "#c4b5fd";
      ctx.strokeStyle = "#6d28d9";
      ctx.lineWidth = 2.5;
      roundRect(cx - 7, cy - 14, 14, 7, 3, true);
      ctx.strokeRect(cx - 7, cy - 14, 14, 7);

      ctx.fillStyle = "#a855f7";
      ctx.strokeStyle = "#6d28d9";
      ctx.beginPath();
      ctx.moveTo(cx - 9, cy - 7);
      ctx.lineTo(cx + 9, cy - 7);
      ctx.lineTo(cx + 12, cy + 10);
      ctx.quadraticCurveTo(cx, cy + 17, cx - 12, cy + 10);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "rgba(255, 255, 255, 0.72)";
      ctx.beginPath();
      ctx.arc(cx - 4, cy + 1, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 12px Microsoft YaHei, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("↺", cx, cy + 6);
      ctx.restore();
    }

    function drawEnemyFood() {
      if (!hasEnemySnakeMode()) return;
      enemyFood.forEach(food => {
        const { cx, cy } = centerOf(food);
        ctx.save();
        ctx.fillStyle = "#b892ff";
        ctx.strokeStyle = "#7251d4";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, Math.max(6, cell * 0.24), 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      });
    }

    function drawEnemySnake() {
      if (!hasEnemySnakeMode()) return;
      enemySnakes.forEach(es => {
        es.forEach((part, index) => {
          ctx.fillStyle = index === 0 ? "#4b5563" : "#6b7280";
          roundRect(part.x * cell + 4, part.y * cell + 4, cell - 8, cell - 8, 12, true);
          if (index === 0) drawFace(part, "#ffffff");
        });
      });
    }

    function drawBuddySnake() {
      if (!isTeamMode() || buddySnake.length === 0) return;
      buddySnake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#34d399" : "#6ee7b7";
        roundRect(part.x * cell + 4, part.y * cell + 4, cell - 8, cell - 8, 12, true);
        if (index === 0) drawFace(part, "#065f46");
      });
    }

    function drawSnake() {
      snake.forEach((part, index) => {
        ctx.fillStyle = snakeColors[index % snakeColors.length];
        roundRect(part.x * cell + 4, part.y * cell + 4, cell - 8, cell - 8, 12, true);
        if (index === 0) drawFace(part, "#24324f");
      });
    }

    function drawFace(head, color) {
      const { cx, cy } = centerOf(head);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(cx - 5, cy - 3, 2.2, 0, Math.PI * 2);
      ctx.arc(cx + 5, cy - 3, 2.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy + 3, 5, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    }

    function centerOf(spot) {
      return { cx: spot.x * cell + cell / 2, cy: spot.y * cell + cell / 2 };
    }

    function roundRect(x, y, width, height, radius, fill) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
      if (fill) ctx.fill();
    }

    startBtn.addEventListener("click", () => {
      if (running && gameMode === "endless") {
        returnToHome();
        return;
      }
      if (!running && startBtn.textContent === "再玩一次") resetGame();
      startGame();
    });

    pauseBtn.addEventListener("click", pauseGame);

    resetBtn.addEventListener("click", () => {
      clearInterval(timer);
      clearInterval(countdownTimer);
      resetGame();
      startGame();
    });

    endlessModeBtn.addEventListener("click", () => selectGameMode("endless"));
    soloEndlessModeBtn.addEventListener("click", () => selectGameMode("soloEndless"));
    teamModeBtn.addEventListener("click", () => selectGameMode("team"));
    timedModeBtn.addEventListener("click", () => selectGameMode("timed"));
    childModeBtn.addEventListener("click", () => selectDifficulty("child"));
    teenModeBtn.addEventListener("click", () => selectDifficulty("teen"));
    adultModeBtn.addEventListener("click", () => selectDifficulty("adult"));

    shopToggleBtn.addEventListener("click", () => {
      const isHidden = shopPanel.classList.toggle("screen-hidden");
      shopToggleBtn.textContent = isHidden ? "商城" : "收起商城";
    });

    skinShop.addEventListener("click", event => {
      const button = event.target.closest("button[data-skin-id]");
      if (button) chooseSkin(button.dataset.skinId);
    });

    vipShop.addEventListener("click", event => {
      const button = event.target.closest("button[data-vip-id]");
      if (button) chooseVip(button.dataset.vipId);
    });

    checkinBtn.addEventListener("click", claimDailyCheckin);

    document.querySelectorAll("[data-dir]").forEach(button => {
      button.addEventListener("click", () => changeDirection(button.dataset.dir));
    });

    window.addEventListener("keydown", event => {
      const keyMap = {
        ArrowUp: "up", w: "up", W: "up",
        ArrowDown: "down", s: "down", S: "down",
        ArrowLeft: "left", a: "left", A: "left",
        ArrowRight: "right", d: "right", D: "right"
      };
      if (keyMap[event.key]) {
        event.preventDefault();
        changeDirection(keyMap[event.key]);
      }
      if (event.key === " ") {
        event.preventDefault();
        pauseGame();
      }
    });
  </script>
</body>
</html>
