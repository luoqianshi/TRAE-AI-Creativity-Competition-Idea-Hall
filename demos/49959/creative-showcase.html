<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冲鸭 ChongYa · 个人旅行博物馆 · Demo</title>
<style>
  :root {
    --color-primary: #ffffff;
    --color-on-primary: #000000;
    --color-accent-blue: #0099ff;
    --color-ink: #ffffff;
    --color-ink-muted: #999999;
    --color-canvas: #090909;
    --color-surface-1: #141414;
    --color-surface-2: #1c1c1c;
    --color-hairline: #262626;
    --color-hairline-soft: #1a1a1a;
    --color-rarity-special: #ff5577;
    --color-rarity-legendary: #ff7a3d;
    --color-rarity-epic: #b14cf5;
    --color-rarity-rare: #0099ff;
    --color-rarity-common: #22c55e;
    --color-status-visited: #ffb020;
    --color-status-wishlist: #0099ff;
    --color-status-unvisited: #999999;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--color-canvas);
    color: var(--color-ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-feature-settings: 'cv01', 'cv05', 'cv09', 'cv11';
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.3;
    height: 100vh;
    overflow: hidden;
  }

  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  .app { display: flex; flex-direction: column; height: 100vh; }

  /* ============ NAV ============ */
  .nav-bar {
    display: flex; align-items: center;
    height: 56px; padding: 0 30px;
    background: var(--color-canvas);
    border-bottom: 1px solid var(--color-hairline);
    z-index: 1000;
    flex-shrink: 0;
  }
  .nav-brand {
    font-size: 22px; font-weight: 700; letter-spacing: -0.8px;
    display: flex; align-items: center; gap: 8px;
    margin-right: 40px;
  }
  .nav-brand-badge {
    width: 28px; height: 28px; border-radius: 9999px;
    background: linear-gradient(135deg, #ff7a3d, #ff5577);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .nav-tabs { display: flex; gap: 4px; }
  .nav-tab {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 15px;
    border-radius: 9999px;
    color: var(--color-ink-muted);
    font-size: 14px; font-weight: 500;
    transition: all 0.2s ease;
    background: transparent;
  }
  .nav-tab:hover { color: var(--color-ink); background: var(--color-surface-1); }
  .nav-tab.active { color: var(--color-ink); background: var(--color-surface-2); }
  .nav-tab-icon { font-size: 15px; }

  .nav-spacer { flex: 1; }
  .nav-hint {
    font-size: 12px; color: var(--color-ink-muted);
    padding: 6px 12px; border-radius: 9999px;
    background: var(--color-surface-1);
    border: 1px solid var(--color-hairline-soft);
  }

  .main-content { flex: 1; overflow: hidden; position: relative; }

  /* ============ VIEW COMMON ============ */
  .view { display: none; height: 100%; }
  .view.active { display: block; }

  .page-title {
    font-size: 28px; font-weight: 700; letter-spacing: -1px;
    margin-bottom: 20px;
  }

  /* ============ MAP VIEW ============ */
  .map-view { display: flex; height: 100%; }
  .map-canvas {
    flex: 1; position: relative;
    background: radial-gradient(ellipse at 60% 40%, #1a1f2e 0%, #0a0d14 70%);
    overflow: hidden;
  }
  .map-svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }
  .map-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,153,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,153,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .map-marker {
    position: absolute;
    transform: translate(-50%, -50%);
    padding: 3px 9px;
    border-radius: 9999px;
    font-size: 11px; font-weight: 500;
    background: rgba(9,9,9,0.85);
    backdrop-filter: blur(6px);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    white-space: nowrap;
    user-select: none;
  }
  .map-marker:hover { transform: translate(-50%, -50%) scale(1.1); z-index: 10; }
  .map-marker.visited {
    color: var(--color-status-visited);
    border: 1px solid var(--color-status-visited);
    box-shadow: 0 0 12px rgba(255,176,32,0.4);
  }
  .map-marker.wishlist {
    color: var(--color-status-wishlist);
    border: 1px solid var(--color-status-wishlist);
  }
  .map-marker.unvisited {
    color: var(--color-status-unvisited);
    border: 1px solid var(--color-hairline);
  }

  .map-side-panel {
    position: absolute;
    top: 20px; right: 20px;
    width: 280px;
    max-height: calc(100% - 40px);
    background: rgba(9,9,9,0.92);
    backdrop-filter: blur(16px);
    border-radius: 20px;
    border: 1px solid var(--color-hairline);
    display: flex; flex-direction: column;
    overflow: hidden;
    z-index: 50;
  }
  .panel-stats { padding: 16px 16px 10px; }
  .panel-stats-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 8px;
  }
  .stats-label { font-size: 13px; color: var(--color-ink-muted); }
  .stats-value { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .panel-progress { display: flex; align-items: center; gap: 12px; }
  .progress-track {
    flex: 1; height: 3px;
    background: var(--color-surface-2);
    border-radius: 9999px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--color-accent-blue);
    border-radius: 9999px;
    transition: width 0.4s ease;
  }
  .progress-percent { font-size: 13px; color: var(--color-ink-muted); min-width: 32px; text-align: right; }

  .panel-divider { height: 1px; background: var(--color-hairline-soft); margin: 0 16px; }

  .panel-section-title {
    padding: 12px 16px 8px;
    font-size: 12px; color: var(--color-ink-muted);
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  .panel-city-list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .panel-city-list::-webkit-scrollbar { display: none; }

  .city-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .city-item:hover { background: var(--color-surface-2); }
  .city-item.active { background: var(--color-surface-2); }
  .city-item-name { font-size: 14px; flex: 1; }
  .city-item-count { font-size: 12px; color: var(--color-ink-muted); }
  .city-item-bar {
    width: 40px; height: 3px;
    background: var(--color-surface-2);
    border-radius: 9999px; overflow: hidden;
  }
  .city-item-bar-fill { height: 100%; background: var(--color-accent-blue); }

  .city-detail-list { padding: 0 8px 12px; max-height: 320px; overflow-y: auto; }
  .city-detail-list::-webkit-scrollbar { display: none; }
  .cp-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s;
    gap: 8px;
  }
  .cp-item:hover { background: var(--color-surface-2); }
  .cp-item-name { font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cp-item.visited .cp-item-name { color: var(--color-status-visited); }
  .cp-item.wishlist .cp-item-name { color: var(--color-status-wishlist); }
  .cp-item.unvisited .cp-item-name { color: var(--color-ink-muted); }
  .cp-rarity-badge {
    padding: 1px 7px;
    border-radius: 9999px;
    font-size: 10px; color: #fff;
    flex-shrink: 0;
  }

  /* ============ POPUP ============ */
  .popup-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center; justify-content: center;
    z-index: 2000;
  }
  .popup-overlay.show { display: flex; }
  .popup-card {
    background: var(--color-surface-1);
    border: 1px solid var(--color-hairline);
    border-radius: 20px;
    padding: 28px;
    width: 380px;
    max-width: 90vw;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .popup-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
  .popup-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .popup-rarity {
    padding: 3px 10px;
    border-radius: 9999px;
    font-size: 11px; color: #fff;
  }
  .popup-meta {
    display: flex; gap: 12px;
    font-size: 13px; color: var(--color-ink-muted);
    margin-bottom: 14px;
  }
  .popup-desc {
    font-size: 14px; color: var(--color-ink-muted);
    line-height: 1.5;
    padding: 14px;
    background: var(--color-surface-2);
    border-radius: 12px;
    margin-bottom: 18px;
  }
  .popup-status {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border-radius: 9999px;
    font-size: 12px;
    margin-bottom: 18px;
  }
  .popup-status.visited { background: rgba(255,176,32,0.15); color: var(--color-status-visited); }
  .popup-status.wishlist { background: rgba(0,153,255,0.15); color: var(--color-status-wishlist); }
  .popup-status.unvisited { background: var(--color-surface-2); color: var(--color-ink-muted); }

  .popup-actions { display: flex; flex-direction: column; gap: 10px; }
  .btn {
    padding: 11px 16px;
    border-radius: 9999px;
    font-size: 14px; font-weight: 500;
    transition: transform 0.15s ease, opacity 0.15s ease;
    text-align: center;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--color-primary); color: var(--color-on-primary); }
  .btn-secondary { background: var(--color-surface-2); color: var(--color-ink); border: 1px solid var(--color-hairline); }
  .btn-danger { background: transparent; color: #ff5577; border: 1px solid rgba(255,85,119,0.3); }
  .btn-close {
    width: 30px; height: 30px;
    border-radius: 9999px;
    background: var(--color-surface-2);
    color: var(--color-ink-muted);
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-close:hover { color: var(--color-ink); }

  /* ============ UPLOAD POPUP ============ */
  .upload-area {
    border: 2px dashed var(--color-hairline);
    border-radius: 14px;
    padding: 36px 20px;
    text-align: center;
    margin-bottom: 16px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .upload-area:hover { border-color: var(--color-accent-blue); background: rgba(0,153,255,0.04); }
  .upload-icon { font-size: 36px; margin-bottom: 10px; }
  .upload-text { font-size: 14px; color: var(--color-ink-muted); }
  .upload-sub { font-size: 12px; color: var(--color-ink-muted); margin-top: 4px; opacity: 0.7; }

  .month-picker {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 16px;
  }
  .month-chip {
    padding: 6px 10px;
    border-radius: 9999px;
    background: var(--color-surface-2);
    font-size: 12px;
    color: var(--color-ink-muted);
    border: 1px solid var(--color-hairline-soft);
    transition: all 0.15s;
  }
  .month-chip:hover { color: var(--color-ink); }
  .month-chip.active { background: var(--color-accent-blue); color: #fff; border-color: var(--color-accent-blue); }

  /* ============ COLLECTIBLES VIEW ============ */
  .collectibles-view { padding: 30px; overflow-y: auto; height: 100%; }
  .collectibles-view::-webkit-scrollbar { width: 6px; }
  .collectibles-view::-webkit-scrollbar-thumb { background: var(--color-hairline); border-radius: 3px; }

  .filters {
    display: flex; gap: 8px;
    margin-bottom: 24px;
    align-items: center;
    flex-wrap: wrap;
  }
  .filter-label { font-size: 13px; color: var(--color-ink-muted); margin-right: 4px; }
  .filter-tag {
    padding: 5px 12px;
    border: 1px solid var(--color-hairline);
    border-radius: 9999px;
    background: var(--color-canvas);
    color: var(--color-ink-muted);
    font-size: 13px;
    transition: all 0.2s;
  }
  .filter-tag:hover { color: var(--color-ink); border-color: var(--color-ink-muted); }
  .filter-tag.active { color: #fff; border-color: transparent; }

  .rarity-section { margin-bottom: 36px; }
  .rarity-section-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px;
  }
  .rarity-dot { width: 8px; height: 8px; border-radius: 9999px; }
  .rarity-section-title { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .rarity-section-count { font-size: 13px; color: var(--color-ink-muted); }
  .rarity-section-divider {
    flex: 1; height: 1px;
    margin-left: 8px;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .collectible-card {
    background: var(--color-surface-1);
    border-radius: 16px;
    border: 2px solid var(--color-hairline);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .collectible-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.4); }
  .collectible-card.rarity-special { border-color: var(--color-rarity-special); }
  .collectible-card.rarity-legendary { border-color: var(--color-rarity-legendary); }
  .collectible-card.rarity-epic { border-color: var(--color-rarity-epic); }
  .collectible-card.rarity-rare { border-color: var(--color-rarity-rare); }
  .collectible-card.rarity-common { border-color: var(--color-rarity-common); }
  .collectible-card.unvisited { border-color: #444; }
  .collectible-card.unvisited .card-image-inner { filter: grayscale(0.7) brightness(0.5); }

  .card-image {
    width: 100%; aspect-ratio: 4/3;
    position: relative; overflow: hidden;
    background: var(--color-surface-2);
  }
  .card-image-inner {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 56px;
    background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
  }
  .card-info {
    padding: 10px 12px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px;
  }
  .card-name {
    font-size: 13px; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1;
  }
  .card-month { font-size: 11px; color: var(--color-ink-muted); flex-shrink: 0; }

  /* Special rarity shimmer effect */
  .collectible-card.rarity-special.visited-card .card-image::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(115deg,
      transparent 20%,
      rgba(212,77,240,0.3) 35%,
      rgba(106,76,245,0.4) 45%,
      rgba(255,85,119,0.4) 55%,
      rgba(255,122,61,0.3) 65%,
      transparent 80%);
    filter: blur(20px);
    animation: shimmer 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shimmer {
    0%, 100% { transform: translateX(-30%); opacity: 0.3; }
    50% { transform: translateX(30%); opacity: 0.8; }
  }

  /* ============ WISHLIST VIEW ============ */
  .wishlist-view { padding: 30px; overflow-y: auto; height: 100%; }
  .wishlist-view::-webkit-scrollbar { width: 6px; }
  .wishlist-view::-webkit-scrollbar-thumb { background: var(--color-hairline); border-radius: 3px; }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--color-ink-muted);
  }
  .empty-state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
  .empty-state-text { font-size: 16px; margin-bottom: 20px; }
  .empty-state-hint { font-size: 13px; opacity: 0.6; }

  .wishlist-group { margin-bottom: 28px; }
  .wishlist-group-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--color-hairline-soft);
  }
  .wishlist-group-name { font-size: 16px; font-weight: 700; }
  .wishlist-group-count {
    font-size: 12px; color: var(--color-ink-muted);
    padding: 2px 8px; border-radius: 9999px;
    background: var(--color-surface-1);
  }
  .wishlist-items { display: flex; flex-direction: column; gap: 8px; }
  .wishlist-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    background: var(--color-surface-1);
    border-radius: 12px;
    border: 1px solid var(--color-hairline-soft);
    cursor: pointer;
    transition: background 0.15s, transform 0.15s;
  }
  .wishlist-item:hover { background: var(--color-surface-2); transform: translateX(4px); }
  .wishlist-item-emoji { font-size: 22px; flex-shrink: 0; }
  .wishlist-item-info { flex: 1; min-width: 0; }
  .wishlist-item-name { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
  .wishlist-item-desc { font-size: 12px; color: var(--color-ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wishlist-item-rarity {
    padding: 2px 8px;
    border-radius: 9999px;
    font-size: 11px;
    color: #fff;
    flex-shrink: 0;
  }

  /* ============ STATISTICS VIEW ============ */
  .statistics-view { padding: 30px; overflow-y: auto; height: 100%; }
  .statistics-view::-webkit-scrollbar { width: 6px; }
  .statistics-view::-webkit-scrollbar-thumb { background: var(--color-hairline); border-radius: 3px; }

  .stats-hero {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: var(--color-surface-1);
    border: 1px solid var(--color-hairline-soft);
    border-radius: 20px;
    padding: 24px;
  }
  .stat-card-label { font-size: 13px; color: var(--color-ink-muted); margin-bottom: 8px; }
  .stat-card-value { font-size: 36px; font-weight: 700; letter-spacing: -1.5px; }
  .stat-card-sub { font-size: 12px; color: var(--color-ink-muted); margin-top: 6px; }

  .stat-section { margin-bottom: 32px; }
  .stat-section-title {
    font-size: 18px; font-weight: 700; letter-spacing: -0.4px;
    margin-bottom: 16px;
  }

  .city-completion-list { display: flex; flex-direction: column; gap: 10px; }
  .city-completion-item {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 14px;
    background: var(--color-surface-1);
    border-radius: 12px;
    border: 1px solid var(--color-hairline-soft);
  }
  .city-completion-name { font-size: 14px; font-weight: 500; min-width: 70px; }
  .city-completion-bar {
    flex: 1; height: 6px;
    background: var(--color-surface-2);
    border-radius: 9999px; overflow: hidden;
  }
  .city-completion-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--color-accent-blue), #6a4cf5);
    border-radius: 9999px;
    transition: width 0.6s ease;
  }
  .city-completion-pct { font-size: 13px; color: var(--color-ink-muted); min-width: 40px; text-align: right; }

  .rarity-dist-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }
  .rarity-dist-card {
    background: var(--color-surface-1);
    border: 1px solid var(--color-hairline-soft);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .rarity-dist-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 3px;
  }
  .rarity-dist-card.special::before { background: var(--color-rarity-special); }
  .rarity-dist-card.legendary::before { background: var(--color-rarity-legendary); }
  .rarity-dist-card.epic::before { background: var(--color-rarity-epic); }
  .rarity-dist-card.rare::before { background: var(--color-rarity-rare); }
  .rarity-dist-card.common::before { background: var(--color-rarity-common); }
  .rarity-dist-name { font-size: 13px; color: var(--color-ink-muted); margin-bottom: 6px; margin-top: 6px; }
  .rarity-dist-value { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
  .rarity-dist-total { font-size: 11px; color: var(--color-ink-muted); }

  /* ============ TIMELINE ============ */
  .timeline {
    position: relative;
    padding-left: 8px;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 5px; top: 4px; bottom: 4px;
    width: 1px;
    background: var(--color-hairline);
  }
  .timeline-item {
    position: relative;
    display: flex;
    gap: 14px;
    padding: 12px 0 18px 18px;
  }
  .timeline-dot {
    position: absolute;
    left: 0; top: 14px;
    width: 11px; height: 11px;
    border-radius: 50%;
    border: 2px solid var(--color-canvas);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.04);
  }
  .timeline-content { flex: 1; }
  .timeline-month {
    font-size: 11px;
    color: var(--color-ink-muted);
    margin-bottom: 4px;
    letter-spacing: 0.3px;
  }
  .timeline-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--color-ink);
    margin-bottom: 3px;
  }

function getCity(cityId) { return CITIES.find(function(c) { return c.id === cityId; }); }
function getCheckpoint(id) { return CHECKPOINTS.find(function(c) { return c.id === id; }); }
function getStatus(cp) {
  if (cp.visited) return 'visited';
  if (cp.in_wishlist) return 'wishlist';
  return 'unvisited';
}

function renderMarkers() {
  const layer = document.getElementById('markersLayer');
  layer.innerHTML = '';
  CHECKPOINTS.forEach(function(cp) {
    const x = lngToX(cp.lng);
    const y = latToY(cp.lat);
    const leftPct = (x / 1000) * 100;
    const topPct = (y / 700) * 100;

    const marker = document.createElement('div');
    marker.className = 'map-marker ' + getStatus(cp);
    marker.textContent = cp.name;
    marker.style.left = leftPct + '%';
    marker.style.top = topPct + '%';
    marker.onclick = function() { openActionPopup(cp.id); };
    layer.appendChild(marker);
  });
}

function renderSidePanel() {
  const content = document.getElementById('panelContent');
  const title = document.getElementById('panelTitle');

  if (selectedCityId) {
    const city = getCity(selectedCityId);
    const cps = CHECKPOINTS.filter(function(c) { return c.city_id === selectedCityId; });
    title.textContent = city.name + ' · ' + cps.filter(function(c) { return c.visited; }).length + '/' + cps.length;
    title.style.cursor = 'pointer';
    title.onclick = function() { selectedCityId = null; renderSidePanel(); };

    content.className = 'city-detail-list';
    content.innerHTML = cps.map(function(cp) {
      return '<div class="cp-item ' + getStatus(cp) + '" onclick="openActionPopup(\'' + cp.id + '\')">' +

        '</div>';
    }).join('');
  } else {
    title.textContent = '城市概览';
    title.style.cursor = 'default';
    title.onclick = null;
    content.className = 'panel-city-list';

    const cityStats = CITIES.map(function(city) {
      const cps = CHECKPOINTS.filter(function(c) { return c.city_id === city.id; });
      const visited = cps.filter(function(c) { return c.visited; }).length;
      const completion = cps.length > 0 ? Math.round((visited / cps.length) * 100) : 0;
      return Object.assign({}, city, { total: cps.length, visited: visited, completion: completion });
    }).sort(function(a, b) { return b.completion - a.completion || a.name.localeCompare(b.name); });

    content.innerHTML = cityStats.map(function(c) {
      return '<div class="city-item" onclick="selectCity(\'' + c.id + '\')">' +
        '<span class="city-item-name">' + c.name + '</span>' +
        '<span class="city-item-count">' + c.visited + '/' + c.total + '</span>' +
        '<div class="city-item-bar"><div class="city-item-bar-fill" style="width:' + c.completion + '%"></div></div>' +
        '</div>';
    }).join('');
  }
}

function updateCompletion() {

  const total = CHECKPOINTS.length;
  const pct = total > 0 ? Math.round((visited / total) * 100) : 0;
  document.getElementById('completionValue').textContent = visited + '/' + total;
  document.getElementById('completionBar').style.width = pct + '%';
  document.getElementById('completionPercent').textContent = pct + '%';
}

  let statusBadge = '';
  if (status === 'visited') {
    statusBadge = '<div class="popup-status visited">✓ 已去过' + (cp.visit_month ? ' · ' + cp.visit_month : '') + '</div>';
  } else if (status === 'wishlist') {
    statusBadge = '<div class="popup-status wishlist">🔖 已加入计划</div>';
  } else {
    statusBadge = '<div class="popup-status unvisited">○ 未到访</div>';
  }

  let actions = '';
  if (status === 'unvisited') {
    actions = '<button class="btn btn-primary" onclick="startVisit(\'' + cp.id + '\')">📷 标记去过（上传照片）</button>' +
      '<button class="btn btn-secondary" onclick="addWishlist(\'' + cp.id + '\')">🔖 加入计划</button>';
  } else if (status === 'wishlist') {
    actions = '<button class="btn btn-primary" onclick="startVisit(\'' + cp.id + '\')">📷 标记去过（上传照片）</button>' +
      '<button class="btn btn-danger" onclick="removeWishlist(\'' + cp.id + '\')">从计划中移除</button>';
  } else if (status === 'visited') {
    actions = '<button class="btn btn-secondary" onclick="viewCollectible(\'' + cp.id + '\')">👁️ 查看藏品卡片</button>' +
      '<button class="btn btn-danger" onclick="cancelVisit(\'' + cp.id + '\')">取消去过标记</button>';
  }

  card.innerHTML =
    '<div class="popup-header">' +
      '<div>' +
        '<div class="popup-title">' + cp.emoji + ' ' + cp.name + '</div>' +
        '<div class="popup-meta"><span>📍 ' + city.name + ' · ' + city.province + '</span></div>' +
      '</div>' +
      '<button class="btn-close" onclick="closePopup(\'actionPopup\')">×</button>' +
    '</div>' +
    '<div style="margin-bottom:14px;">' +
      '<span class="popup-rarity" style="background:' + RARITY_CONFIG[cp.rarity].color + '">' + RARITY_CONFIG[cp.rarity].label + '</span>' +
    '</div>' +
    statusBadge +
    '<div class="popup-desc">' + cp.description + '</div>' +
    '<div class="popup-actions">' + actions + '</div>';
  document.getElementById('actionPopup').classList.add('show');
}

function closePopup(id) {
  document.getElementById(id).classList.remove('show');
}

function startVisit(cpId) {
  closePopup('actionPopup');
  openUploadPopup(cpId);
}

function openUploadPopup(cpId) {
  const cp = getCheckpoint(cpId);
  const card = document.getElementById('uploadPopupCard');
  const displayMonths = ['2026·06','2026·05','2026·04','2026·03','2026·02','2026·01','2025·12','2025·11','2025·10','2024·10','2024·07','2024·05','2023·10','2023·05'];

  card.innerHTML =
    '<div class="popup-header">' +
      '<div>' +
        '<div class="popup-title">上传打卡照片</div>' +
        '<div class="popup-meta"><span>' + cp.emoji + ' ' + cp.name + '</span></div>' +
      '</div>' +
      '<button class="btn-close" onclick="closePopup(\'uploadPopup\')">×</button>' +
    '</div>' +
    '<div class="upload-area" id="uploadArea">' +
      '<div class="upload-icon">📷</div>' +
      '<div class="upload-text">点击模拟上传照片</div>' +
      '<div class="upload-sub">将自动生成 ' + RARITY_CONFIG[cp.rarity].label + ' 级藏品闪卡</div>' +
    '</div>' +
    '<div style="font-size:13px;color:var(--color-ink-muted);margin-bottom:8px;">到访月份（可选）</div>' +
    '<div class="month-picker" id="monthPicker">' +
      displayMonths.map(function(m) { return '<button class="month-chip" data-month="' + m + '" onclick="selectMonth(\'' + m + '\')">' + m + '</button>'; }).join('') +
    '</div>' +
    '<button class="btn btn-primary" id="confirmUpload" onclick="confirmUpload(\'' + cpId + '\')" style="opacity:0.5;pointer-events:none;">完成打卡</button>';

  document.getElementById('uploadArea').onclick = simulateUpload;
  document.getElementById('uploadPopup').classList.add('show');
}

function selectMonth(m) {
  selectedMonth = m;
  document.querySelectorAll('.month-chip').forEach(function(el) {
    el.classList.toggle('active', el.dataset.month === m);
  });
  checkUploadReady();
}

function simulateUpload() {
  const photos = ['📸','🌅','🌄','🪟','🖼️','🎥','🌺','🌸','🍃','☀️','🌙','⭐'];
  uploadedEmoji = photos[Math.floor(Math.random() * photos.length)];
  const area = document.getElementById('uploadArea');
  area.innerHTML =
    '<div class="upload-icon" style="font-size:60px;">' + uploadedEmoji + '</div>' +
    '<div class="upload-text" style="color:var(--color-ink);">照片已上传</div>' +
    '<div class="upload-sub">点击可重新选择</div>';
  area.onclick = simulateUpload;
  checkUploadReady();
}

function checkUploadReady() {
  const btn = document.getElementById('confirmUpload');
  if (uploadedEmoji) {
    btn.style.opacity = '1';
    btn.style.pointerEvents = 'auto';
  }
}

function confirmUpload(cpId) {
  const cp = getCheckpoint(cpId);
  cp.visited = 1;
  cp.in_wishlist = 0;
  cp.visit_month = selectedMonth;
  cp.photo_emoji = uploadedEmoji;
  cardCounter += 1;
  cp.card_number = String(cardCounter).padStart(3, '0');

  closePopup('uploadPopup');
  selectedMonth = null;
  uploadedEmoji = null;

  renderMarkers();
  renderSidePanel();
  updateCompletion();
  if (currentView === 'collectibles') renderCollectibles();
  if (currentView === 'wishlist') renderWishlist();
  if (currentView === 'statistics') renderStatistics();

  showToast('打卡成功！' + RARITY_CONFIG[cp.rarity].label + '级藏品已生成 🎉', 'success');
}

function addWishlist(cpId) {
  const cp = getCheckpoint(cpId);
  cp.in_wishlist = 1;
  closePopup('actionPopup');
  renderMarkers();
  renderSidePanel();
  if (currentView === 'wishlist') renderWishlist();
  showToast('已加入计划 🔖', 'success');
}

function removeWishlist(cpId) {
  const cp = getCheckpoint(cpId);
  cp.in_wishlist = 0;
  closePopup('actionPopup');
  renderMarkers();
  renderSidePanel();
  if (currentView === 'wishlist') renderWishlist();
  showToast('已从计划移除', 'info');
}

function cancelVisit(cpId) {
  const cp = getCheckpoint(cpId);
  cp.visited = 0;
  cp.visit_month = null;
  cp.photo_emoji = null;
  cp.card_number = null;
  closePopup('actionPopup');
  renderMarkers();
  renderSidePanel();
  updateCompletion();
  if (currentView === 'collectibles') renderCollectibles();
  if (currentView === 'statistics') renderStatistics();
  showToast('已取消去过标记', 'info');
}

function viewCollectible(cpId) {
  closePopup('actionPopup');
  switchView('collectibles');
  setTimeout(function() {
    const card = document.querySelector('[data-cp-id="' + cpId + '"]');
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.style.transform = 'scale(1.05)';
      setTimeout(function() { card.style.transform = ''; }, 600);
    }
  }, 100);
}

function renderCollectibles() {
  const content = document.getElementById('collectiblesContent');
  const filtered = CHECKPOINTS.filter(function(cp) { return collectibleFilters.has(cp.rarity); });

  if (filtered.length === 0) {
    content.innerHTML = '<div class="empty-state"><div class="empty-state-icon">💎</div><div class="empty-state-text">暂无符合条件的藏品</div></div>';
    return;
  }

  let html = '';
  RARITY_ORDER.forEach(function(rarity) {
    const items = filtered.filter(function(cp) { return cp.rarity === rarity; });
    if (items.length === 0) return;
    const visitedCount = items.filter(function(c) { return c.visited; }).length;
    const cfg = RARITY_CONFIG[rarity];
    html +=
      '<div class="rarity-section">' +
        '<div class="rarity-section-header">' +
          '<span class="rarity-dot" style="background:' + cfg.color + '"></span>' +
          '<span class="rarity-section-title" style="color:' + cfg.color + '">' + cfg.label + '</span>' +
          '<span class="rarity-section-count">' + visitedCount + '/' + items.length + '</span>' +
          '<div class="rarity-section-divider" style="background:linear-gradient(to right, ' + cfg.color + ', transparent)"></div>' +
        '</div>' +
        '<div class="card-grid">' +
          items.map(function(cp) {
            const city = getCity(cp.city_id);
            const visitedClass = cp.visited ? 'visited-card' : 'unvisited';
            const imageContent = (cp.visited && cp.photo_emoji)
              ? '<div class="card-image-inner" style="background:linear-gradient(135deg, ' + cfg.color + '33, ' + cfg.color + '11);">' + cp.photo_emoji + '</div>'
              : '<div class="card-image-inner">' + cp.emoji + '</div>';
            return '<div class="collectible-card rarity-' + rarity + ' ' + visitedClass + '" data-cp-id="' + cp.id + '" onclick="openActionPopup(\'' + cp.id + '\')">' +
              '<div class="card-image">' + imageContent + '</div>' +
              '<div class="card-info" style="background:' + (cp.visited ? cfg.bgColor : 'rgba(153,153,153,0.1)') + '">' +
                '<span class="card-name">' + cp.name + (city ? '·' + city.name : '') + '</span>' +
                '<span class="card-month">' + (cp.visited ? (cp.card_number ? '#' + cp.card_number : '') : '未解锁') + '</span>' +
              '</div>' +
            '</div>';
          }).join('') +
        '</div>' +
      '</div>';
  });
  content.innerHTML = html;
}

function renderWishlist() {
  const content = document.getElementById('wishlistContent');
  const wishlisted = CHECKPOINTS.filter(function(cp) { return cp.in_wishlist; });

  if (wishlisted.length === 0) {
    content.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">🔖</div>' +
        '<div class="empty-state-text">还没有旅行计划</div>' +
        '<div class="empty-state-hint">前往地图，将想去的景点加入计划</div>' +
      '</div>';
    return;
  }

  const groups = {};
  wishlisted.forEach(function(cp) {
    if (!groups[cp.city_id]) groups[cp.city_id] = [];
    groups[cp.city_id].push(cp);
  });

  let html = '';
  Object.keys(groups).forEach(function(cityId) {
    const city = getCity(cityId);
    const cps = groups[cityId];
    html +=
      '<div class="wishlist-group">' +
        '<div class="wishlist-group-header">' +
          '<span class="wishlist-group-name">📍 ' + city.name + '</span>' +
          '<span class="wishlist-group-count">' + cps.length + '</span>' +
        '</div>' +
        '<div class="wishlist-items">' +
          cps.map(function(cp) {
            return '<div class="wishlist-item" onclick="openActionPopup(\'' + cp.id + '\')">' +
              '<span class="wishlist-item-emoji">' + cp.emoji + '</span>' +
              '<div class="wishlist-item-info">' +
                '<div class="wishlist-item-name">' + cp.name + '</div>' +
                '<div class="wishlist-item-desc">' + cp.description + '</div>' +
              '</div>' +
              '<span class="wishlist-item-rarity" style="background:' + RARITY_CONFIG[cp.rarity].color + '">' + RARITY_CONFIG[cp.rarity].label + '</span>' +
            '</div>';
          }).join('') +
        '</div>' +
      '</div>';
  });
  content.innerHTML = html;
}

function renderStatistics() {
  const content = document.getElementById('statisticsContent');
  const total = CHECKPOINTS.length;
  const visited = CHECKPOINTS.filter(function(c) { return c.visited; }).length;
  const wishlist = CHECKPOINTS.filter(function(c) { return c.in_wishlist; }).length;
  const unvisited = total - visited;
  const completion = total > 0 ? Math.round((visited / total) * 100) : 0;

  const cityStats = CITIES.map(function(city) {
    const cps = CHECKPOINTS.filter(function(c) { return c.city_id === city.id; });
    const v = cps.filter(function(c) { return c.visited; }).length;
    return { name: city.name, total: cps.length, visited: v, completion: cps.length > 0 ? Math.round((v / cps.length) * 100) : 0 };
  }).filter(function(c) { return c.total > 0; }).sort(function(a, b) { return b.completion - a.completion || a.name.localeCompare(b.name); });

  const rarityDist = RARITY_ORDER.map(function(r) {
    const all = CHECKPOINTS.filter(function(c) { return c.rarity === r; });
    const v = all.filter(function(c) { return c.visited; }).length;
    return { rarity: r, total: all.length, visited: v };
  });

  content.innerHTML =
    '<div class="stats-hero">' +
      '<div class="stat-card">' +
        '<div class="stat-card-label">已去打卡点</div>' +
        '<div class="stat-card-value" style="color:var(--color-status-visited)">' + visited + '</div>' +
        '<div class="stat-card-sub">共 ' + total + ' 个，完成度 ' + completion + '%</div>' +
      '</div>' +
      '<div class="stat-card">' +
        '<div class="stat-card-label">计划中</div>' +
        '<div class="stat-card-value" style="color:var(--color-status-wishlist)">' + wishlist + '</div>' +
        '<div class="stat-card-sub">待解锁的旅行目的地</div>' +
      '</div>' +
      '<div class="stat-card">' +
        '<div class="stat-card-label">未到访</div>' +
        '<div class="stat-card-value" style="color:var(--color-ink-muted)">' + unvisited + '</div>' +
        '<div class="stat-card-sub">还有 ' + unvisited + ' 个景点等你探索</div>' +
      '</div>' +
    '</div>' +
    '<div class="stat-section">' +
      '<div class="stat-section-title">城市完成度</div>' +
      '<div class="city-completion-list">' +
        cityStats.map(function(c) {
          return '<div class="city-completion-item">' +
            '<span class="city-completion-name">' + c.name + '</span>' +
            '<div class="city-completion-bar"><div class="city-completion-fill" style="width:' + c.completion + '%"></div></div>' +
            '<span class="city-completion-pct">' + c.visited + '/' + c.total + '</span>' +
          '</div>';
        }).join('') +
      '</div>' +
    '</div>' +
    '<div class="stat-section">' +
      '<div class="stat-section-title">稀有度分布</div>' +
      '<div class="rarity-dist-grid">' +
        rarityDist.map(function(d) {
          const cfg = RARITY_CONFIG[d.rarity];
          return '<div class="rarity-dist-card ' + d.rarity + '" style="border-color:' + cfg.color + '">' +
            '<div class="rarity-dist-value" style="color:' + cfg.color + '">' + d.visited + '<span class="rarity-dist-total">/' + d.total + '</span></div>' +
            '<div class="rarity-dist-name">' + cfg.label + '</div>' +
          '</div>';
        }).join('') +
      '</div>' +
    '</div>' +
    '<div class="stat-section">' +
      '<div class="stat-section-title">旅行时间线</div>' +
      '<div class="timeline">' +
        (function() {
          const visitedCps = CHECKPOINTS.filter(function(c) { return c.visited && c.visit_month; })
            .sort(function(a, b) { return (b.visit_month || '').localeCompare(a.visit_month || ''); });
          if (visitedCps.length === 0) {
            return '<div class="empty-state-mini">打卡后这里会展示你的旅行时间线</div>';
          }
          return visitedCps.map(function(cp) {
            const city = getCity(cp.city_id);
            return '<div class="timeline-item">' +
              '<div class="timeline-dot" style="background:' + RARITY_CONFIG[cp.rarity].color + '"></div>' +
              '<div class="timeline-content">' +
                '<div class="timeline-month">' + cp.visit_month + '</div>' +
                '<div class="timeline-title">' + cp.emoji + ' ' + cp.name + '</div>' +
                '<div class="timeline-meta">📍 ' + city.name + ' · ' + RARITY_CONFIG[cp.rarity].label + '级 · #' + cp.card_number + '</div>' +
              '</div>' +
            '</div>';
          }).join('');
        })() +
      '</div>' +
    '</div>';
}

function switchView(view) {
  currentView = view;
  document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
  document.getElementById('view-' + view).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.view === view);
  });
  if (view === 'collectibles') renderCollectibles();
  if (view === 'wishlist') renderWishlist();
  if (view === 'statistics') renderStatistics();
}

function setupFilters() {
  document.querySelectorAll('#collectiblesFilters .filter-tag').forEach(function(btn) {
    btn.onclick = function() {
      const rarity = btn.dataset.rarity;
      if (collectibleFilters.has(rarity)) {
        collectibleFilters.delete(rarity);
        btn.style.opacity = '0.35';
      } else {
        collectibleFilters.add(rarity);
        btn.style.opacity = '1';
      }
      renderCollectibles();
    };
  });
}

function seedDemoData() {
  // 预置部分演示数据，让 Demo 一打开就有内容可看
  const presets = [
    { id: 'cp1',  month: '2025·10' },  // 大熊猫繁育研究基地
    { id: 'cp3',  month: '2025·10' },  // 锦里古街
    { id: 'cp5',  month: '2024·07' },  // 故宫博物院
    { id: 'cp6',  month: '2024·07' },  // 长城·八达岭
    { id: 'cp15', month: '2024·05' },  // 西湖
    { id: 'cp12', month: '2023·10' },  // 兵马俑
    { id: 'cp17', month: '2023·05' },  // 洪崖洞
  ];
  const photos = ['📸','🌅','🌄','🪟','🖼️','🌺','🌸','🍃','☀️','⭐'];
  presets.forEach(function(p, i) {
    const cp = getCheckpoint(p.id);
    if (!cp) return;
    cp.visited = 1;
    cp.visit_month = p.month;
    cp.photo_emoji = photos[i % photos.length];
    cardCounter += 1;
    cp.card_number = String(cardCounter).padStart(3, '0');
  });
  // 预置一个愿望单
  const wishes = ['cp26', 'cp28', 'cp34', 'cp9'];
  wishes.forEach(function(id) {
    const cp = getCheckpoint(id);
    if (cp && !cp.visited) cp.in_wishlist = 1;
  });
}

function init() {
  seedDemoData();
  renderMarkers();
  renderSidePanel();
  updateCompletion();
  setupFilters();
}

init();
</script>
</body>
</html>
