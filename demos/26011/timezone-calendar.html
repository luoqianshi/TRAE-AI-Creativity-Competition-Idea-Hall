<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跨时区好友日历 - Timezone Buddy</title>
  <style>
    @font-face {
      font-family: 'WorkSans';
      src: url('./_shared/fonts/WorkSans-Regular.ttf') format('truetype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'WorkSans';
      src: url('./_shared/fonts/WorkSans-Bold.ttf') format('truetype');
      font-weight: 700;
    }
    @font-face {
      font-family: 'GeistMono';
      src: url('./_shared/fonts/GeistMono-Regular.ttf') format('truetype');
      font-weight: 400;
    }

    :root {
      --bg: #0f1117;
      --bg2: #1a1d27;
      --bg3: #242836;
      --ink: #e8eaed;
      --muted: #8b8fa3;
      --rule: #2d3148;
      --accent: #6c5ce7;
      --accent-light: #a29bfe;
      --green: #00cec9;
      --red: #ff6b6b;
      --orange: #fdcb6e;
      --blue: #74b9ff;
      --pink: #fd79a8;
      --purple: #a29bfe;
      --busy: #ff6b6b;
      --free: #00cec9;
      --sleep: #2d3148;
      --font: 'WorkSans', sans-serif;
      --mono: 'GeistMono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      background: var(--bg2);
      border-bottom: 1px solid var(--rule);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-subtitle {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .current-time {
      font-family: var(--mono);
      font-size: 0.9rem;
      color: var(--accent-light);
      background: var(--bg);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      border: 1px solid var(--rule);
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0;
      background: var(--bg2);
      border-bottom: 1px solid var(--rule);
      padding: 0 2rem;
    }
    .tab {
      padding: 0.75rem 1.5rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      user-select: none;
    }
    .tab:hover { color: var(--ink); }
    .tab.active {
      color: var(--accent-light);
      border-bottom-color: var(--accent);
    }

    /* Main Content */
    .main {
      padding: 1.5rem 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Tab Panels */
    .panel { display: none; }
    .panel.active { display: block; }

    /* Buttons */
    .btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-light); }
    .btn-secondary {
      background: var(--bg3);
      color: var(--ink);
      border: 1px solid var(--rule);
    }
    .btn-secondary:hover { background: var(--rule); }
    .btn-danger {
      background: var(--red);
      color: #fff;
    }
    .btn-danger:hover { opacity: 0.85; }
    .btn-sm {
      padding: 0.3rem 0.6rem;
      font-size: 0.78rem;
    }

    /* Cards */
    .card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
    }

    /* Friend List */
    .friend-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }
    .friend-card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 1.25rem;
      position: relative;
      transition: border-color 0.2s;
    }
    .friend-card:hover { border-color: var(--accent); }
    .friend-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    .friend-name {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .friend-color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .friend-tz {
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--muted);
      background: var(--bg);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }
    .friend-time {
      font-family: var(--mono);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent-light);
      margin-bottom: 0.5rem;
    }
    .friend-status {
      font-size: 0.82rem;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      display: inline-block;
    }
    .status-free { background: rgba(0,206,201,0.15); color: var(--green); }
    .status-busy { background: rgba(255,107,107,0.15); color: var(--red); }
    .status-sleep { background: rgba(45,49,72,0.6); color: var(--muted); }
    .friend-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 16px;
      padding: 1.5rem;
      width: 90%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .form-input, .form-select {
      width: 100%;
      padding: 0.55rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--rule);
      border-radius: 8px;
      color: var(--ink);
      font-family: var(--font);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus, .form-select:focus {
      border-color: var(--accent);
    }
    .form-select option {
      background: var(--bg2);
      color: var(--ink);
    }
    .form-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 1.25rem;
    }
    .color-picker-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .color-option {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.2s, transform 0.15s;
    }
    .color-option:hover { transform: scale(1.15); }
    .color-option.selected { border-color: #fff; }

    /* Timeline */
    .timeline-container {
      overflow-x: auto;
      overflow-y: auto;
      max-height: 70vh;
      border: 1px solid var(--rule);
      border-radius: 12px;
      background: var(--bg2);
    }
    .timeline-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }
    .timeline-table th,
    .timeline-table td {
      border: 1px solid var(--rule);
      text-align: center;
      vertical-align: top;
    }
    .timeline-table thead th {
      position: sticky;
      top: 0;
      background: var(--bg3);
      z-index: 10;
      padding: 0.5rem 0.3rem;
      font-size: 0.78rem;
      font-family: var(--mono);
      color: var(--muted);
    }
    .timeline-table thead th:first-child {
      position: sticky;
      left: 0;
      z-index: 20;
      background: var(--bg3);
      min-width: 140px;
      text-align: left;
      padding-left: 0.75rem;
    }
    .timeline-table tbody td:first-child {
      position: sticky;
      left: 0;
      z-index: 5;
      background: var(--bg2);
      text-align: left;
      padding: 0.5rem 0.75rem;
      font-weight: 600;
      font-size: 0.85rem;
      white-space: nowrap;
      min-width: 140px;
    }
    .timeline-table tbody td {
      padding: 0;
      height: 48px;
      position: relative;
      cursor: pointer;
      transition: background 0.15s;
    }
    .timeline-table tbody td:hover {
      filter: brightness(1.2);
    }
    .timeline-table tbody td.sleep-cell {
      background: var(--sleep) !important;
    }
    .timeline-table tbody td.free-cell {
      background: rgba(0,206,201,0.08);
    }
    .timeline-table tbody td.busy-cell {
      background: rgba(255,107,107,0.25);
    }
    .timeline-table tbody td.busy-cell .event-label {
      font-size: 0.7rem;
      color: #fff;
      padding: 2px 4px;
      border-radius: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      line-height: 1.3;
    }
    .timeline-table tbody td.now-marker {
      box-shadow: inset 0 0 0 2px var(--accent);
    }
    .timeline-row-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .timeline-row-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Summary View */
    .summary-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .summary-legend {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-left: auto;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .summary-slot-card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 1rem;
      transition: border-color 0.2s;
    }
    .summary-slot-card:hover { border-color: var(--accent); }
    .summary-slot-card.good-slot { border-color: var(--green); }
    .summary-slot-time {
      font-family: var(--mono);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-light);
      margin-bottom: 0.5rem;
    }
    .summary-slot-friends {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .summary-friend-tag {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 12px;
      font-weight: 600;
    }
    .tag-free { background: rgba(0,206,201,0.15); color: var(--green); }
    .tag-busy { background: rgba(255,107,107,0.15); color: var(--red); }
    .tag-sleep { background: rgba(45,49,72,0.6); color: var(--muted); }

    /* Summary Timeline (compact) */
    .summary-timeline-wrap {
      overflow-x: auto;
      border: 1px solid var(--rule);
      border-radius: 12px;
      background: var(--bg2);
    }
    .summary-timeline {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }
    .summary-timeline th,
    .summary-timeline td {
      border: 1px solid var(--rule);
      text-align: center;
      vertical-align: middle;
    }
    .summary-timeline thead th {
      position: sticky;
      top: 0;
      background: var(--bg3);
      z-index: 10;
      padding: 0.5rem 0.2rem;
      font-size: 0.75rem;
      font-family: var(--mono);
      color: var(--muted);
    }
    .summary-timeline thead th:first-child {
      position: sticky;
      left: 0;
      z-index: 20;
      background: var(--bg3);
      min-width: 120px;
      text-align: left;
      padding-left: 0.75rem;
    }
    .summary-timeline td:first-child {
      position: sticky;
      left: 0;
      z-index: 5;
      background: var(--bg2);
      text-align: left;
      padding: 0.4rem 0.75rem;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      min-width: 120px;
    }
    .summary-timeline td {
      height: 40px;
      padding: 0;
      position: relative;
    }
    .summary-cell {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .summary-cell.all-free { background: rgba(0,206,201,0.2); color: var(--green); }
    .summary-cell.some-busy { background: rgba(253,203,110,0.15); color: var(--orange); }
    .summary-cell.most-busy { background: rgba(255,107,107,0.15); color: var(--red); }
    .summary-cell.all-sleep { background: var(--sleep); color: var(--muted); }

    /* Event list in friend detail */
    .event-list { margin-top: 0.75rem; }
    .event-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--rule);
      font-size: 0.82rem;
    }
    .event-item:last-child { border-bottom: none; }
    .event-time-range {
      font-family: var(--mono);
      color: var(--accent-light);
      min-width: 90px;
    }
    .event-name { flex: 1; }
    .event-delete {
      cursor: pointer;
      color: var(--muted);
      font-size: 0.75rem;
      transition: color 0.2s;
    }
    .event-delete:hover { color: var(--red); }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }
    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }
    .empty-state-text {
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
    }
    .empty-state-sub {
      font-size: 0.82rem;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .toast {
      background: var(--bg3);
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      color: var(--ink);
      animation: toastIn 0.3s ease-out;
      max-width: 320px;
    }
    .toast.success { border-left: 3px solid var(--green); }
    .toast.error { border-left: 3px solid var(--red); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header { padding: 0.75rem 1rem; }
      .main { padding: 1rem; }
      .tabs { padding: 0 1rem; overflow-x: auto; }
      .friend-grid { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo">Timezone Buddy</div>
      <div class="header-subtitle">跨时区好友日历</div>
    </div>
    <div class="header-right">
      <div class="current-time" id="currentTime"></div>
    </div>
  </header>

  <!-- Tabs -->
  <nav class="tabs">
    <div class="tab active" data-tab="friends">好友管理</div>
    <div class="tab" data-tab="timeline">个人时间线</div>
    <div class="tab" data-tab="summary">汇总视图</div>
  </nav>

  <!-- Main Content -->
  <main class="main">

    <!-- Friends Panel -->
    <div class="panel active" id="panel-friends">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
        <h2 style="font-size:1.15rem;">我的好友</h2>
        <button class="btn btn-primary" onclick="openAddFriend()">+ 添加好友</button>
      </div>
      <div id="friendList"></div>
    </div>

    <!-- Timeline Panel -->
    <div class="panel" id="panel-timeline">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:0.75rem;">
        <h2 style="font-size:1.15rem;">个人时间线</h2>
        <div style="display:flex;gap:0.75rem;align-items:center;">
          <label class="form-label" style="margin:0;">选择好友：</label>
          <select class="form-select" id="timelineFriendSelect" style="width:200px;" onchange="renderTimeline()">
            <option value="">-- 请选择 --</option>
          </select>
          <button class="btn btn-primary btn-sm" onclick="openAddEvent()">+ 添加日程</button>
        </div>
      </div>
      <div id="timelineContent"></div>
    </div>

    <!-- Summary Panel -->
    <div class="panel" id="panel-summary">
      <div class="summary-controls">
        <h2 style="font-size:1.15rem;">汇总视图</h2>
        <div class="summary-legend">
          <div class="legend-item"><div class="legend-dot" style="background:var(--green);"></div> 全部空闲</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--orange);"></div> 部分忙碌</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--red);"></div> 大多忙碌</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--sleep);"></div> 全部休息</div>
        </div>
      </div>
      <div id="summaryContent"></div>
    </div>
  </main>

  <!-- Add Friend Modal -->
  <div class="modal-overlay" id="modalAddFriend">
    <div class="modal">
      <div class="modal-title">添加好友</div>
      <div class="form-group">
        <label class="form-label">好友名称</label>
        <input class="form-input" id="friendNameInput" placeholder="例如：小明" maxlength="20">
      </div>
      <div class="form-group">
        <label class="form-label">所在时区</label>
        <select class="form-select" id="friendTzInput"></select>
      </div>
      <div class="form-group">
        <label class="form-label">代表颜色</label>
        <div class="color-picker-row" id="colorPicker"></div>
      </div>
      <div class="form-group">
        <label class="form-label">睡眠时段（当地时间）</label>
        <div style="display:flex;gap:0.5rem;align-items:center;">
          <input class="form-input" type="time" id="sleepStart" value="23:00" style="width:auto;">
          <span style="color:var(--muted);">至</span>
          <input class="form-input" type="time" id="sleepEnd" value="07:00" style="width:auto;">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-secondary" onclick="closeModal('modalAddFriend')">取消</button>
        <button class="btn btn-primary" onclick="addFriend()">添加</button>
      </div>
    </div>
  </div>

  <!-- Add Event Modal -->
  <div class="modal-overlay" id="modalAddEvent">
    <div class="modal">
      <div class="modal-title">添加日程</div>
      <div class="form-group">
        <label class="form-label">日程名称</label>
        <input class="form-input" id="eventNameInput" placeholder="例如：开会、健身" maxlength="30">
      </div>
      <div class="form-group">
        <label class="form-label">开始时间（好友当地时间）</label>
        <input class="form-input" type="time" id="eventStartInput">
      </div>
      <div class="form-group">
        <label class="form-label">结束时间（好友当地时间）</label>
        <input class="form-input" type="time" id="eventEndInput">
      </div>
      <div class="form-actions">
        <button class="btn btn-secondary" onclick="closeModal('modalAddEvent')">取消</button>
        <button class="btn btn-primary" onclick="addEvent()">添加</button>
      </div>
    </div>
  </div>

  <!-- Edit Friend Modal -->
  <div class="modal-overlay" id="modalEditFriend">
    <div class="modal">
      <div class="modal-title">编辑好友</div>
      <div class="form-group">
        <label class="form-label">好友名称</label>
        <input class="form-input" id="editFriendName" maxlength="20">
      </div>
      <div class="form-group">
        <label class="form-label">所在时区</label>
        <select class="form-select" id="editFriendTz"></select>
      </div>
      <div class="form-group">
        <label class="form-label">代表颜色</label>
        <div class="color-picker-row" id="editColorPicker"></div>
      </div>
      <div class="form-group">
        <label class="form-label">睡眠时段（当地时间）</label>
        <div style="display:flex;gap:0.5rem;align-items:center;">
          <input class="form-input" type="time" id="editSleepStart" style="width:auto;">
          <span style="color:var(--muted);">至</span>
          <input class="form-input" type="time" id="editSleepEnd" style="width:auto;">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-secondary" onclick="closeModal('modalEditFriend')">取消</button>
        <button class="btn btn-primary" onclick="saveEditFriend()">保存</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    // ========== Data Store ==========
    const STORAGE_KEY = 'timezone-buddy-data';
    const COLORS = ['#6c5ce7','#00cec9','#ff6b6b','#fdcb6e','#74b9ff','#fd79a8','#a29bfe','#55efc4','#e17055','#81ecec'];

    let appData = loadData();

    function getDefaultData() {
      return {
        friends: []
      };
    }

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch(e) {}
      return getDefaultData();
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    // ========== Timezone List ==========
    const TIMEZONES = [
      { label: '北京 / 上海 (UTC+8)', value: 'Asia/Shanghai' },
      { label: '香港 (UTC+8)', value: 'Asia/Hong_Kong' },
      { label: '台北 (UTC+8)', value: 'Asia/Taipei' },
      { label: '东京 (UTC+9)', value: 'Asia/Tokyo' },
      { label: '首尔 (UTC+9)', value: 'Asia/Seoul' },
      { label: '新加坡 (UTC+8)', value: 'Asia/Singapore' },
      { label: '曼谷 (UTC+7)', value: 'Asia/Bangkok' },
      { label: '雅加达 (UTC+7)', value: 'Asia/Jakarta' },
      { label: '胡志明市 (UTC+7)', value: 'Asia/Ho_Chi_Minh' },
      { label: '马尼拉 (UTC+8)', value: 'Asia/Manila' },
      { label: '悉尼 (UTC+10/11)', value: 'Australia/Sydney' },
      { label: '奥克兰 (UTC+12/13)', value: 'Pacific/Auckland' },
      { label: '迪拜 (UTC+4)', value: 'Asia/Dubai' },
      { label: '孟买 (UTC+5:30)', value: 'Asia/Kolkata' },
      { label: '莫斯科 (UTC+3)', value: 'Europe/Moscow' },
      { label: '伊斯坦布尔 (UTC+3)', value: 'Europe/Istanbul' },
      { label: '开罗 (UTC+2)', value: 'Africa/Cairo' },
      { label: '约翰内斯堡 (UTC+2)', value: 'Africa/Johannesburg' },
      { label: '柏林 (UTC+1/2)', value: 'Europe/Berlin' },
      { label: '巴黎 (UTC+1/2)', value: 'Europe/Paris' },
      { label: '伦敦 (UTC+0/1)', value: 'Europe/London' },
      { label: '纽约 (UTC-5/-4)', value: 'America/New_York' },
      { label: '芝加哥 (UTC-6/-5)', value: 'America/Chicago' },
      { label: '丹佛 (UTC-7/-6)', value: 'America/Denver' },
      { label: '洛杉矶 (UTC-8/-7)', value: 'America/Los_Angeles' },
      { label: '温哥华 (UTC-8/-7)', value: 'America/Vancouver' },
      { label: '圣保罗 (UTC-3)', value: 'America/Sao_Paulo' },
      { label: '墨西哥城 (UTC-6/-5)', value: 'America/Mexico_City' },
      { label: '檀香山 (UTC-10)', value: 'Pacific/Honolulu' },
      { label: '安克雷奇 (UTC-9/-8)', value: 'America/Anchorage' },
    ];

    // ========== Utility Functions ==========
    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
    }

    function getFriendTimeInTz(tz) {
      try {
        return new Date().toLocaleTimeString('zh-CN', { timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      } catch(e) {
        return '--:--:--';
      }
    }

    function getFriendHourInTz(tz) {
      try {
        const str = new Date().toLocaleString('en-US', { timeZone: tz, hour: 'numeric', hour12: false });
        return parseInt(str, 10);
      } catch(e) {
        return 12;
      }
    }

    function isSleepHour(hour, sleepStart, sleepEnd) {
      // sleepStart and sleepEnd are in hours (0-23)
      if (sleepStart <= sleepEnd) {
        // e.g. 23:00 to 07:00 -> sleepStart=23, sleepEnd=7
        // This wraps around midnight
        return hour >= sleepStart || hour < sleepEnd;
      }
      // Normal range: e.g. 22:00 to 06:00
      return hour >= sleepStart || hour < sleepEnd;
    }

    function getStatusInfo(friend) {
      const hour = getFriendHourInTz(friend.timezone);
      const ss = parseInt(friend.sleepStart.split(':')[0], 10);
      const se = parseInt(friend.sleepEnd.split(':')[0], 10);

      if (isSleepHour(hour, ss, se)) {
        return { status: 'sleep', label: '休息中', className: 'status-sleep' };
      }

      // Check if current hour has any events
      const now = new Date();
      for (const evt of friend.events) {
        const startMin = timeToMinutes(evt.start);
        const endMin = timeToMinutes(evt.end);
        if (hour * 60 >= startMin && hour * 60 < endMin) {
          return { status: 'busy', label: '忙碌中', className: 'status-busy' };
        }
      }

      return { status: 'free', label: '空闲', className: 'status-free' };
    }

    function timeToMinutes(t) {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }

    function minutesToTime(m) {
      const h = Math.floor(m / 60) % 24;
      const min = m % 60;
      return String(h).padStart(2, '0') + ':' + String(min).padStart(2, '0');
    }

    // ========== Toast ==========
    function showToast(msg, type) {
      type = type || 'success';
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast ' + type;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 2500);
    }

    // ========== Modal ==========
    function openModal(id) {
      document.getElementById(id).classList.add('show');
    }
    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
    }

    // ========== Tabs ==========
    document.querySelectorAll('.tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
        if (tab.dataset.tab === 'timeline') renderTimeline();
        if (tab.dataset.tab === 'summary') renderSummary();
      });
    });

    // ========== Color Picker ==========
    let selectedColor = COLORS[0];
    let editSelectedColor = COLORS[0];

    function renderColorPicker(containerId, currentColor, onSelect) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      COLORS.forEach(function(c) {
        const el = document.createElement('div');
        el.className = 'color-option' + (c === currentColor ? ' selected' : '');
        el.style.background = c;
        el.addEventListener('click', function() {
          onSelect(c);
          container.querySelectorAll('.color-option').forEach(function(o) { o.classList.remove('selected'); });
          el.classList.add('selected');
        });
        container.appendChild(el);
      });
    }

    // ========== Populate TZ selects ==========
    function populateTzSelect(selectId) {
      const sel = document.getElementById(selectId);
      sel.innerHTML = '';
      TIMEZONES.forEach(function(tz) {
        const opt = document.createElement('option');
        opt.value = tz.value;
        opt.textContent = tz.label;
        sel.appendChild(opt);
      });
    }

    // ========== Friend Management ==========
    function openAddFriend() {
      document.getElementById('friendNameInput').value = '';
      populateTzSelect('friendTzInput');
      document.getElementById('sleepStart').value = '23:00';
      document.getElementById('sleepEnd').value = '07:00';
      selectedColor = COLORS[appData.friends.length % COLORS.length];
      renderColorPicker('colorPicker', selectedColor, function(c) { selectedColor = c; });
      openModal('modalAddFriend');
    }

    function addFriend() {
      const name = document.getElementById('friendNameInput').value.trim();
      const tz = document.getElementById('friendTzInput').value;
      const sleepStart = document.getElementById('sleepStart').value;
      const sleepEnd = document.getElementById('sleepEnd').value;

      if (!name) { showToast('请输入好友名称', 'error'); return; }

      const friend = {
        id: generateId(),
        name: name,
        timezone: tz,
        color: selectedColor,
        sleepStart: sleepStart,
        sleepEnd: sleepEnd,
        events: []
      };

      appData.friends.push(friend);
      saveData();
      closeModal('modalAddFriend');
      renderFriendList();
      updateTimelineSelect();
      showToast('已添加好友：' + name);
    }

    function deleteFriend(id) {
      if (!confirm('确定要删除这个好友吗？')) return;
      appData.friends = appData.friends.filter(function(f) { return f.id !== id; });
      saveData();
      renderFriendList();
      updateTimelineSelect();
      showToast('好友已删除');
    }

    function openEditFriend(id) {
      const friend = appData.friends.find(function(f) { return f.id === id; });
      if (!friend) return;

      populateTzSelect('editFriendTz');
      document.getElementById('editFriendName').value = friend.name;
      document.getElementById('editFriendTz').value = friend.timezone;
      document.getElementById('editSleepStart').value = friend.sleepStart;
      document.getElementById('editSleepEnd').value = friend.sleepEnd;
      editSelectedColor = friend.color;
      renderColorPicker('editColorPicker', friend.color, function(c) { editSelectedColor = c; });

      document.getElementById('modalEditFriend').dataset.friendId = id;
      openModal('modalEditFriend');
    }

    function saveEditFriend() {
      const id = document.getElementById('modalEditFriend').dataset.friendId;
      const friend = appData.friends.find(function(f) { return f.id === id; });
      if (!friend) return;

      const name = document.getElementById('editFriendName').value.trim();
      if (!name) { showToast('请输入好友名称', 'error'); return; }

      friend.name = name;
      friend.timezone = document.getElementById('editFriendTz').value;
      friend.color = editSelectedColor;
      friend.sleepStart = document.getElementById('editSleepStart').value;
      friend.sleepEnd = document.getElementById('editSleepEnd').value;

      saveData();
      closeModal('modalEditFriend');
      renderFriendList();
      updateTimelineSelect();
      showToast('好友信息已更新');
    }

    function renderFriendList() {
      const container = document.getElementById('friendList');
      if (appData.friends.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#x1F5D3;</div><div class="empty-state-text">还没有添加好友</div><div class="empty-state-sub">点击"添加好友"开始管理跨时区日程</div></div>';
        return;
      }

      let html = '<div class="friend-grid">';
      appData.friends.forEach(function(f) {
        const statusInfo = getStatusInfo(f);
        const tzLabel = TIMEZONES.find(function(t) { return t.value === f.timezone; });
        html += '<div class="friend-card">';
        html += '<div class="friend-card-header">';
        html += '<div class="friend-name"><span class="friend-color-dot" style="background:' + f.color + ';"></span>' + escHtml(f.name) + '</div>';
        html += '<span class="friend-tz">' + (tzLabel ? tzLabel.label.split('(')[0].trim() : f.timezone) + '</span>';
        html += '</div>';
        html += '<div class="friend-time">' + getFriendTimeInTz(f.timezone) + '</div>';
        html += '<span class="friend-status ' + statusInfo.className + '">' + statusInfo.label + '</span>';

        // Show events
        if (f.events.length > 0) {
          html += '<div class="event-list">';
          f.events.forEach(function(evt, idx) {
            html += '<div class="event-item">';
            html += '<span class="event-time-range">' + escHtml(evt.start) + ' - ' + escHtml(evt.end) + '</span>';
            html += '<span class="event-name">' + escHtml(evt.name) + '</span>';
            html += '<span class="event-delete" onclick="deleteEvent(\'' + f.id + '\',' + idx + ')">&#x2715;</span>';
            html += '</div>';
          });
          html += '</div>';
        }

        html += '<div class="friend-actions">';
        html += '<button class="btn btn-secondary btn-sm" onclick="openEditFriend(\'' + f.id + '\')">编辑</button>';
        html += '<button class="btn btn-danger btn-sm" onclick="deleteFriend(\'' + f.id + '\')">删除</button>';
        html += '</div>';
        html += '</div>';
      });
      html += '</div>';
      container.innerHTML = html;
    }

    function escHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ========== Event Management ==========
    function openAddEvent() {
      const sel = document.getElementById('timelineFriendSelect');
      if (!sel.value) { showToast('请先选择一个好友', 'error'); return; }
      document.getElementById('eventNameInput').value = '';
      document.getElementById('eventStartInput').value = '';
      document.getElementById('eventEndInput').value = '';
      openModal('modalAddEvent');
    }

    function addEvent() {
      const friendId = document.getElementById('timelineFriendSelect').value;
      const name = document.getElementById('eventNameInput').value.trim();
      const start = document.getElementById('eventStartInput').value;
      const end = document.getElementById('eventEndInput').value;

      if (!name) { showToast('请输入日程名称', 'error'); return; }
      if (!start || !end) { showToast('请设置开始和结束时间', 'error'); return; }
      if (timeToMinutes(end) <= timeToMinutes(start)) { showToast('结束时间必须晚于开始时间', 'error'); return; }

      const friend = appData.friends.find(function(f) { return f.id === friendId; });
      if (!friend) return;

      friend.events.push({ id: generateId(), name: name, start: start, end: end });
      saveData();
      closeModal('modalAddEvent');
      renderTimeline();
      renderFriendList();
      showToast('日程已添加：' + name);
    }

    function deleteEvent(friendId, eventIdx) {
      const friend = appData.friends.find(function(f) { return f.id === friendId; });
      if (!friend) return;
      friend.events.splice(eventIdx, 1);
      saveData();
      renderFriendList();
      renderTimeline();
      showToast('日程已删除');
    }

    // ========== Timeline Select ==========
    function updateTimelineSelect() {
      const sel = document.getElementById('timelineFriendSelect');
      const currentVal = sel.value;
      sel.innerHTML = '<option value="">-- 请选择 --</option>';
      appData.friends.forEach(function(f) {
        const opt = document.createElement('option');
        opt.value = f.id;
        opt.textContent = f.name;
        sel.appendChild(opt);
      });
      if (currentVal && appData.friends.find(function(f) { return f.id === currentVal; })) {
        sel.value = currentVal;
      }
    }

    // ========== Timeline Rendering ==========
    function renderTimeline() {
      const container = document.getElementById('timelineContent');
      const friendId = document.getElementById('timelineFriendSelect').value;

      if (!friendId) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#x1F552;</div><div class="empty-state-text">请选择一个好友查看时间线</div><div class="empty-state-sub">在上方下拉框中选择好友</div></div>';
        return;
      }

      const friend = appData.friends.find(function(f) { return f.id === friendId; });
      if (!friend) return;

      // Build 24-hour timeline (0-23)
      const currentHourUtc = new Date().getUTCHours();
      let html = '<div class="timeline-container">';
      html += '<table class="timeline-table">';
      html += '<thead><tr><th>好友</th>';
      for (let h = 0; h < 24; h++) {
        html += '<th>' + String(h).padStart(2, '0') + ':00</th>';
      }
      html += '</tr></thead>';
      html += '<tbody>';

      // Row for the selected friend (in their local time)
      html += '<tr>';
      html += '<td><div class="timeline-row-label"><span class="timeline-row-dot" style="background:' + friend.color + ';"></span>' + escHtml(friend.name) + ' (本地)</div></td>';
      for (let h = 0; h < 24; h++) {
        let cellClass = '';
        let eventLabel = '';

        // Check sleep
        const ss = parseInt(friend.sleepStart.split(':')[0], 10);
        const se = parseInt(friend.sleepEnd.split(':')[0], 10);
        if (isSleepHour(h, ss, se)) {
          cellClass = 'sleep-cell';
        }

        // Check events
        for (const evt of friend.events) {
          const startMin = timeToMinutes(evt.start);
          const endMin = timeToMinutes(evt.end);
          if (h * 60 >= startMin && h * 60 < endMin) {
            cellClass = 'busy-cell';
            eventLabel = evt.name;
            break;
          }
        }

        if (!cellClass) cellClass = 'free-cell';

        // Mark current hour
        const friendHour = getFriendHourInTz(friend.timezone);
        if (h === friendHour) cellClass += ' now-marker';

        html += '<td class="' + cellClass + '">';
        if (eventLabel) html += '<span class="event-label">' + escHtml(eventLabel) + '</span>';
        html += '</td>';
      }
      html += '</tr>';

      // Row for UTC reference
      html += '<tr>';
      html += '<td><div class="timeline-row-label"><span class="timeline-row-dot" style="background:var(--muted);"></span>UTC 参考</div></td>';
      for (let h = 0; h < 24; h++) {
        let cls = h === currentHourUtc ? 'now-marker' : '';
        html += '<td class="' + cls + '"><span style="font-size:0.7rem;color:var(--muted);">' + String(h).padStart(2, '0') + '</span></td>';
      }
      html += '</tr>';

      // Row for local time (user's timezone)
      const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const localHour = new Date().getHours();
      html += '<tr>';
      html += '<td><div class="timeline-row-label"><span class="timeline-row-dot" style="background:var(--accent);"></span>我的时间</div></td>';
      for (let h = 0; h < 24; h++) {
        let cls = h === localHour ? 'now-marker' : '';
        html += '<td class="' + cls + '"><span style="font-size:0.7rem;color:var(--accent-light);">' + String(h).padStart(2, '0') + '</span></td>';
      }
      html += '</tr>';

      html += '</tbody></table></div>';

      // Event list below
      if (friend.events.length > 0) {
        html += '<div class="card" style="margin-top:1rem;"><div class="card-header"><div class="card-title">日程列表</div></div>';
        friend.events.forEach(function(evt, idx) {
          html += '<div class="event-item">';
          html += '<span class="event-time-range">' + escHtml(evt.start) + ' - ' + escHtml(evt.end) + '</span>';
          html += '<span class="event-name">' + escHtml(evt.name) + '</span>';
          html += '<span class="event-delete" onclick="deleteEvent(\'' + friend.id + '\',' + idx + ')">&#x2715; 删除</span>';
          html += '</div>';
        });
        html += '</div>';
      }

      container.innerHTML = html;
    }

    // ========== Summary Rendering ==========
    function renderSummary() {
      const container = document.getElementById('summaryContent');

      if (appData.friends.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#x1F4CA;</div><div class="empty-state-text">还没有好友数据</div><div class="empty-state-sub">请先在"好友管理"中添加好友</div></div>';
        return;
      }

      // Use user's local timezone as reference
      const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const localHour = new Date().getHours();

      // Build summary timeline: rows = friends, columns = hours (in user's local time)
      let html = '<h3 style="font-size:0.95rem;margin-bottom:0.75rem;color:var(--muted);">时间线对比（以你的本地时间为基准）</h3>';
      html += '<div class="summary-timeline-wrap">';
      html += '<table class="summary-timeline">';
      html += '<thead><tr><th>好友</th>';
      for (let h = 0; h < 24; h++) {
        html += '<th>' + String(h).padStart(2, '0') + '</th>';
      }
      html += '</tr></thead>';
      html += '<tbody>';

      appData.friends.forEach(function(f) {
        html += '<tr>';
        html += '<td><div class="timeline-row-label"><span class="timeline-row-dot" style="background:' + f.color + ';"></span>' + escHtml(f.name) + '</div></td>';

        for (let localH = 0; localH < 24; localH++) {
          // Convert local hour to friend's hour
          const friendHour = getFriendHourForLocalHour(f.timezone, localTz, localH);
          const ss = parseInt(f.sleepStart.split(':')[0], 10);
          const se = parseInt(f.sleepEnd.split(':')[0], 10);

          let cellClass = '';
          let label = '';

          if (isSleepHour(friendHour, ss, se)) {
            cellClass = 'all-sleep';
            label = 'S';
          } else {
            // Check events at this friend hour
            let hasEvent = false;
            for (const evt of f.events) {
              const startMin = timeToMinutes(evt.start);
              const endMin = timeToMinutes(evt.end);
              if (friendHour * 60 >= startMin && friendHour * 60 < endMin) {
                hasEvent = true;
                break;
              }
            }
            if (hasEvent) {
              cellClass = 'most-busy';
              label = 'B';
            } else {
              cellClass = 'all-free';
              label = 'F';
            }
          }

          // Highlight current local hour
          const isNow = localH === localHour;
          html += '<td style="' + (isNow ? 'box-shadow:inset 0 0 0 2px var(--accent);' : '') + '">';
          html += '<div class="summary-cell ' + cellClass + '">' + label + '</div>';
          html += '</td>';
        }
        html += '</tr>';
      });

      // Summary row: overall availability
      html += '<tr style="background:var(--bg3);">';
      html += '<td style="font-weight:700;color:var(--accent-light);">汇总</td>';
      for (let localH = 0; localH < 24; localH++) {
        let freeCount = 0;
        let totalCount = 0;

        appData.friends.forEach(function(f) {
          const friendHour = getFriendHourForLocalHour(f.timezone, localTz, localH);
          const ss = parseInt(f.sleepStart.split(':')[0], 10);
          const se = parseInt(f.sleepEnd.split(':')[0], 10);

          if (isSleepHour(friendHour, ss, se)) return; // sleeping, don't count

          let hasEvent = false;
          for (const evt of f.events) {
            const startMin = timeToMinutes(evt.start);
            const endMin = timeToMinutes(evt.end);
            if (friendHour * 60 >= startMin && friendHour * 60 < endMin) {
              hasEvent = true;
              break;
            }
          }
          totalCount++;
          if (!hasEvent) freeCount++;
        });

        let cellClass = 'all-sleep';
        let label = '--';
        if (totalCount === 0) {
          cellClass = 'all-sleep';
          label = 'Zzz';
        } else if (freeCount === totalCount) {
          cellClass = 'all-free';
          label = 'ALL';
        } else if (freeCount >= totalCount * 0.5) {
          cellClass = 'some-busy';
          label = freeCount + '/' + totalCount;
        } else {
          cellClass = 'most-busy';
          label = freeCount + '/' + totalCount;
        }

        const isNow = localH === localHour;
        html += '<td style="' + (isNow ? 'box-shadow:inset 0 0 0 2px var(--accent);' : '') + '">';
        html += '<div class="summary-cell ' + cellClass + '">' + label + '</div>';
        html += '</td>';
      }
      html += '</tr>';

      html += '</tbody></table></div>';

      // Best time slots
      html += '<h3 style="font-size:0.95rem;margin:1.5rem 0 0.75rem;color:var(--muted);">推荐游戏时段（全部好友空闲）</h3>';
      const slots = findBestSlots();
      if (slots.length === 0) {
        html += '<div class="card"><div style="color:var(--muted);text-align:center;padding:1rem;">暂无所有好友都空闲的时段，试试部分空闲时段吧</div></div>';
      } else {
        html += '<div class="summary-grid">';
        slots.forEach(function(slot) {
          html += '<div class="summary-slot-card good-slot">';
          html += '<div class="summary-slot-time">' + slot.start + ' - ' + slot.end + '</div>';
          html += '<div class="summary-slot-friends">';
          slot.friends.forEach(function(f) {
            html += '<span class="summary-friend-tag tag-free" style="background:' + f.color + '22;color:' + f.color + ';">' + escHtml(f.name) + '</span>';
          });
          html += '</div>';
          html += '</div>';
        });
        html += '</div>';
      }

      container.innerHTML = html;
    }

    function getFriendHourForLocalHour(friendTz, localTz, localHour) {
      // Create a reference date at localHour in local timezone
      const now = new Date();
      const refDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), localHour, 0, 0);

      // Get the friend's hour at this UTC moment
      try {
        const options = { timeZone: friendTz, hour: 'numeric', hour12: false };
        const friendHourStr = refDate.toLocaleString('en-US', options);
        return parseInt(friendHourStr, 10) % 24;
      } catch(e) {
        return localHour;
      }
    }

    function findBestSlots() {
      const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const slots = [];
      let currentSlot = null;

      for (let h = 0; h < 24; h++) {
        let allFree = true;
        const activeFriends = [];

        appData.friends.forEach(function(f) {
          const friendHour = getFriendHourForLocalHour(f.timezone, localTz, h);
          const ss = parseInt(f.sleepStart.split(':')[0], 10);
          const se = parseInt(f.sleepEnd.split(':')[0], 10);

          if (isSleepHour(friendHour, ss, se)) {
            allFree = false;
            return;
          }

          let hasEvent = false;
          for (const evt of f.events) {
            const startMin = timeToMinutes(evt.start);
            const endMin = timeToMinutes(evt.end);
            if (friendHour * 60 >= startMin && friendHour * 60 < endMin) {
              hasEvent = true;
              break;
            }
          }
          if (hasEvent) {
            allFree = false;
          } else {
            activeFriends.push(f);
          }
        });

        if (allFree && appData.friends.length > 0 && activeFriends.length === appData.friends.length) {
          if (!currentSlot) {
            currentSlot = { start: String(h).padStart(2, '0') + ':00', end: String(h + 1).padStart(2, '0') + ':00', friends: activeFriends };
          } else {
            currentSlot.end = String(h + 1).padStart(2, '0') + ':00';
          }
        } else {
          if (currentSlot) {
            slots.push(currentSlot);
            currentSlot = null;
          }
        }
      }
      if (currentSlot) slots.push(currentSlot);

      return slots;
    }

    // ========== Clock Update ==========
    function updateClock() {
      const now = new Date();
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      const dateStr = now.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', weekday: 'short' });
      document.getElementById('currentTime').textContent = dateStr + ' ' + timeStr;
    }

    // ========== Init ==========
    function init() {
      renderFriendList();
      updateTimelineSelect();
      updateClock();
      setInterval(updateClock, 1000);
      // Auto-refresh friend list every 30s
      setInterval(function() {
        renderFriendList();
      }, 30000);
    }

    init();
  </script>
</body>
