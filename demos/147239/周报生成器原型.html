<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能工作周报生成器 - 创意产物</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --background-color: #f3f4f6;
            --card-color: #ffffff;
            --text-color: #1f2937;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-color);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 30px;
        }
        .section {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            resize: vertical;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2563eb;
        }
        .output-box {
            margin-top: 30px;
            padding: 20px;
            background-color: #f9fafb;
            border-left: 4px solid var(--primary-color);
            border-radius: 4px;
        }
        .footer {
            text-align: center;
            margin-top: 4px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 AI 智能工作周报生成器 (创意展示)</h1>
    
    <div class="section">
        <label for="inputData">💡 输入本周琐碎工作（支持大白话、碎碎念）：</label>
        <textarea id="inputData" placeholder="例如：本周修复了登录界面的2个闪退bug；跟产品经理对了一下下周新活动页面的需求；帮运营导出了上个月的数据报表，导了3次才对..."></textarea>
    </div>

    <div class="section">
        <label>🎯 选择输出风格：</label>
        <select style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #d1d5db;">
            <option>互联网大厂风（高情商/结构化）</option>
            <option>严谨科研汇报风</option>
            <option>极简务实风</option>
        </select>
    </div>

    <div class="btn-group">
        <button onclick="generateReport()">✨ 一键生成专业周报</button>
    </div>

    <div class="output-box" id="outputBox">
        <strong>🤖 AI 润色后的结构化周报预览：</strong>
        <p id="outputText" style="color: #6b7280; font-style: italic;">在上方输入内容并点击按钮生成...</p>
    </div>
</div>

<p class="footer">TRAE AI创造力大赛报名材料 - 由 TRAE 驱动生成</p>

<script>
    function generateReport() {
        const input = document.getElementById('inputData').value;
        const outputText = document.getElementById('outputText');
        
        if(!input.trim()) {
            alert('请先输入一点点工作内容哦！');
            return;
        }

        outputText.style.color = '#1f2937';
        outputText.style.fontStyle = 'normal';
        outputText.innerHTML = `
            <strong>【本周工作进展与成果总结】</strong><br>
            1. <strong>系统稳定性优化</strong>：精准定位并修复了登录模块的2个关键性异常闪退Bug，显著提升了核心链路的用户留存与使用体验。<br>
            2. <strong>跨部门协同推进</strong>：高效对接产品侧，深度对齐了下一阶段核心活动页面的业务需求，明确了技术可行性，为下周迭代奠定了坚实基础。<br>
            3. <strong>数据赋能业务</strong>：响应运营团队数据诉求，克服多次口径对齐的复杂性，成功交付了上月高精度运营数据报表，有力支撑了后续策略分析。<br><br>
            <strong>【下周工作计划】</strong><br>
            1. 全力推进新活动页面的代码编写与联调；<br>
            2. 持续跟进登录模块修复后的线上线上监控数据。
        `;
    }
</script>

</body>
</html>
