<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量产品标签生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            padding: 24px;
        }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #666;
            border: 2px solid #e0e0e0;
        }

        .btn-secondary:hover {
            background: #eee;
            border-color: #d0d0d0;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .upload-area {
            border: 2px dashed #e0e0e0;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .upload-area i {
            font-size: 48px;
            color: #ccc;
            margin-bottom: 12px;
            display: block;
        }

        .upload-area span {
            display: block;
            font-size: 14px;
            color: #666;
        }

        .upload-area small {
            display: block;
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }

        #fileInput {
            display: none;
        }

        .preview-section {
            margin-top: 20px;
        }

        .canvas-wrapper {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            position: relative;
            margin-bottom: 20px;
        }

        .canvas-wrapper canvas {
            display: block;
        }

        .field-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: grab;
            transition: all 0.3s ease;
        }

        .field-item:hover {
            background: #e9ecef;
            transform: translateX(4px);
        }

        .field-item.dragging {
            opacity: 0.5;
            transform: scale(1.02);
        }

        .field-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .field-item .field-name {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }

        .field-item .field-type {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .field-type.text {
            background: #e3f2fd;
            color: #1976d2;
        }

        .field-type.qr {
            background: #e8f5e9;
            color: #388e3c;
        }

        .field-item .field-position {
            font-size: 12px;
            color: #999;
        }

        .position-inputs {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .position-inputs input {
            width: 60px;
            padding: 6px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            text-align: center;
        }

        .size-inputs {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .size-inputs input {
            width: 80px;
        }

        .size-inputs span {
            font-size: 16px;
            color: #999;
        }

        .generated-images {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .image-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            padding-bottom: 12px;
        }

        .image-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .image-card .download-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 16px;
            background: #667eea;
            color: white;
            border-radius: 4px;
            font-size: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .image-card .download-btn:hover {
            background: #5568d3;
        }

        .tip {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 10px 14px;
            margin-top: 16px;
            border-radius: 0 4px 4px 0;
            font-size: 13px;
            color: #856404;
        }

        .template-preview {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
        }

        .template-preview h4 {
            font-size: 14px;
            color: #333;
            margin-bottom: 12px;
        }

        .template-fields {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .template-field-tag {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .template-field-tag .qr-icon {
            width: 14px;
            height: 14px;
            background: #4caf50;
            color: white;
            border-radius: 2px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>批量产品标签生成器</h1>
            <p>导入表格数据，自定义标签尺寸和布局，批量生成产品信息标签图片</p>
        </div>

        <div class="main-content">
            <div class="panel">
                <div class="panel-title">设置</div>
                
                <div class="form-group">
                    <label>标签尺寸（宽×高）</label>
                    <div class="size-inputs">
                        <input type="number" id="width" value="60" min="10" max="500" placeholder="宽度">
                        <span>×</span>
                        <input type="number" id="height" value="40" min="10" max="500" placeholder="高度">
                        <span>mm</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>DPI（分辨率）</label>
                    <select id="dpi">
                        <option value="72">72（屏幕显示）</option>
                        <option value="150">150（标准打印）</option>
                        <option value="300" selected>300（高清打印）</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>边距</label>
                    <div class="form-row">
                        <input type="number" id="paddingTop" value="2" min="0" placeholder="上边距">
                        <input type="number" id="paddingRight" value="2" min="0" placeholder="右边距">
                        <input type="number" id="paddingBottom" value="2" min="0" placeholder="下边距">
                        <input type="number" id="paddingLeft" value="2" min="0" placeholder="左边距">
                    </div>
                </div>

                <div class="form-group">
                    <label>字体大小</label>
                    <input type="number" id="fontSize" value="12" min="4" max="32" placeholder="字体大小">
                </div>

                <div class="form-group">
                    <label>标签背景色</label>
                    <div class="size-inputs">
                        <input type="color" id="bgColor" value="#ffffff">
                        <input type="text" id="bgColorHex" value="#ffffff" placeholder="#ffffff">
                    </div>
                </div>

                <div class="form-group">
                    <label>文字颜色</label>
                    <div class="size-inputs">
                        <input type="color" id="textColor" value="#333333">
                        <input type="text" id="textColorHex" value="#333333" placeholder="#333333">
                    </div>
                </div>

                <button class="btn btn-primary" onclick="updatePreview()">
                    更新预览
                </button>
            </div>

            <div class="panel">
                <div class="panel-title">导入数据</div>
                
                <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                    <i>📁</i>
                    <span>点击或拖拽上传 Excel 文件 (.xlsx, .xls) 或 CSV 文件</span>
                    <small>支持字段：序号、产品名称、规格、备注、链接等</small>
                </div>
                <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" onchange="handleFileUpload(event)">

                <div id="dataPreview" style="display: none; margin-top: 20px;">
                    <h4 style="font-size: 14px; color: #333; margin-bottom: 12px;">数据预览</h4>
                    <div style="max-height: 200px; overflow-y: auto;">
                        <table id="dataTable" style="width: 100%; border-collapse: collapse; font-size: 13px;">
                            <thead>
                                <tr style="background: #f0f0f0;">
                                    <th style="border: 1px solid #ddd; padding: 8px; text-align: left;"></th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>

                <div id="fieldsConfig" style="display: none; margin-top: 20px;">
                    <h4 style="font-size: 14px; color: #333; margin-bottom: 12px;">字段配置</h4>
                    <div id="fieldsList"></div>
                    <div class="tip">
                        💡 提示：勾选"二维码"将该字段内容转换为二维码显示；拖拽字段可调整显示顺序和位置
                    </div>
                </div>
            </div>

            <div class="panel" style="grid-column: span 2;">
                <div class="panel-title">预览与生成</div>
                
                <div class="canvas-wrapper" id="canvasWrapper">
                    <canvas id="previewCanvas"></canvas>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" onclick="generateAllTags()">
                        批量生成所有标签
                    </button>
                    <button class="btn btn-secondary" onclick="downloadAllTags()">
                        下载全部图片
                    </button>
                </div>

                <div id="generatedImages" class="generated-images" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        let excelData = [];
        let fields = [];
        let currentFieldIndex = 0;
        let generatedImages = [];

        document.getElementById('bgColor').addEventListener('input', function(e) {
            document.getElementById('bgColorHex').value = e.target.value;
        });

        document.getElementById('bgColorHex').addEventListener('input', function(e) {
            document.getElementById('bgColor').value = e.target.value;
        });

        document.getElementById('textColor').addEventListener('input', function(e) {
            document.getElementById('textColorHex').value = e.target.value;
        });

        document.getElementById('textColorHex').addEventListener('input', function(e) {
            document.getElementById('textColor').value = e.target.value;
        });

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    excelData = XLSX.utils.sheet_to_json(firstSheet);
                    
                    if (excelData.length > 0) {
                        initFields(excelData[0]);
                        showDataPreview();
                        updatePreview();
                    }
                } catch (error) {
                    alert('文件读取失败，请确保上传的是有效的Excel或CSV文件');
                    console.error(error);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function initFields(firstRow) {
            fields = Object.keys(firstRow).map((key, index) => ({
                name: key,
                visible: true,
                isQR: false,
                x: 10 + (index % 2) * 150,
                y: 10 + Math.floor(index / 2) * 30,
                width: 140,
                height: 20
            }));
            renderFieldsList();
        }

        function showDataPreview() {
            const table = document.getElementById('dataTable');
            const thead = table.querySelector('thead tr');
            const tbody = table.querySelector('tbody');
            
            thead.innerHTML = '<th style="border: 1px solid #ddd; padding: 8px; text-align: left;">序号</th>' +
                Object.keys(excelData[0]).map(key => 
                    `<th style="border: 1px solid #ddd; padding: 8px; text-align: left;">${key}</th>`
                ).join('');
            
            tbody.innerHTML = excelData.slice(0, 5).map((row, index) => {
                const cells = Object.values(row).map(value => 
                    `<td style="border: 1px solid #ddd; padding: 8px;">${value || ''}</td>`
                ).join('');
                return `<tr><td style="border: 1px solid #ddd; padding: 8px; font-weight: 600;">${index + 1}</td>${cells}</tr>`;
            }).join('');

            document.getElementById('dataPreview').style.display = 'block';
            document.getElementById('fieldsConfig').style.display = 'block';
        }

        function renderFieldsList() {
            const container = document.getElementById('fieldsList');
            container.innerHTML = fields.map((field, index) => `
                <div class="field-item" draggable="true" ondragstart="dragStart(event, ${index})" 
                     ondragover="dragOver(event)" ondrop="drop(event, ${index})"
                     style="position: relative;">
                    <input type="checkbox" ${field.visible ? 'checked' : ''} 
                           onchange="toggleFieldVisibility(${index}, this)">
                    <span class="field-name">${field.name}</span>
                    <span class="field-type ${field.isQR ? 'qr' : 'text'}">
                        ${field.isQR ? '二维码' : '文本'}
                    </span>
                    <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 12px;"
                            onclick="toggleQR(${index})">
                        ${field.isQR ? '转文本' : '转二维码'}
                    </button>
                    <div class="position-inputs">
                        <input type="number" value="${field.x}" 
                               onchange="updateFieldPos(${index}, 'x', this.value)" placeholder="X">
                        <input type="number" value="${field.y}" 
                               onchange="updateFieldPos(${index}, 'y', this.value)" placeholder="Y">
                    </div>
                </div>
            `).join('');
        }

        let draggedIndex = -1;

        function dragStart(event, index) {
            draggedIndex = index;
            event.dataTransfer.effectAllowed = 'move';
            event.target.classList.add('dragging');
        }

        function dragOver(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
        }

        function drop(event, targetIndex) {
            event.preventDefault();
            if (draggedIndex !== -1 && draggedIndex !== targetIndex) {
                const draggedField = fields.splice(draggedIndex, 1)[0];
                fields.splice(targetIndex, 0, draggedField);
                renderFieldsList();
                updatePreview();
            }
            document.querySelectorAll('.field-item').forEach(el => el.classList.remove('dragging'));
            draggedIndex = -1;
        }

        function toggleFieldVisibility(index, checkbox) {
            fields[index].visible = checkbox.checked;
            updatePreview();
        }

        function toggleQR(index) {
            fields[index].isQR = !fields[index].isQR;
            renderFieldsList();
            updatePreview();
        }

        function updateFieldPos(index, axis, value) {
            fields[index][axis] = parseInt(value) || 0;
            updatePreview();
        }

        function updatePreview() {
            if (excelData.length === 0) return;
            
            const widthMM = parseFloat(document.getElementById('width').value) || 60;
            const heightMM = parseFloat(document.getElementById('height').value) || 40;
            const dpi = parseInt(document.getElementById('dpi').value) || 300;
            
            const widthPx = Math.round((widthMM / 25.4) * dpi);
            const heightPx = Math.round((heightMM / 25.4) * dpi);
            
            const canvas = document.getElementById('previewCanvas');
            canvas.width = widthPx;
            canvas.height = heightPx;
            
            const ctx = canvas.getContext('2d');
            
            const bgColor = document.getElementById('bgColor').value;
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, widthPx, heightPx);
            
            drawTagContent(ctx, widthPx, heightPx, excelData[0]);
            
            const wrapper = document.getElementById('canvasWrapper');
            wrapper.style.maxWidth = '100%';
            wrapper.style.maxHeight = '400px';
        }

        function drawTagContent(ctx, width, height, data) {
            const fontSize = parseInt(document.getElementById('fontSize').value) || 12;
            const textColor = document.getElementById('textColor').value;
            const dpi = parseInt(document.getElementById('dpi').value) || 300;
            const pxFontSize = Math.round((fontSize / 25.4) * dpi);
            
            ctx.fillStyle = textColor;
            ctx.font = `${pxFontSize}px Arial`;
            ctx.textBaseline = 'top';
            
            const visibleFields = fields.filter(f => f.visible);
            let yPos = Math.round((parseFloat(document.getElementById('paddingTop').value) || 2) / 25.4 * dpi);
            
            visibleFields.forEach(field => {
                const fieldData = data[field.name] || '';
                
                if (field.isQR) {
                    const qrSize = Math.min(width * 0.35, height * 0.4);
                    const qrCanvas = document.createElement('canvas');
                    qrCanvas.width = qrSize;
                    qrCanvas.height = qrSize;
                    
                    try {
                        new QRCode(qrCanvas, {
                            text: String(fieldData),
                            width: qrSize,
                            height: qrSize,
                            colorDark: textColor,
                            colorLight: '#ffffff',
                            correctLevel: QRCode.CorrectLevel.M
                        });
                        
                        const x = Math.round((parseFloat(document.getElementById('paddingLeft').value) || 2) / 25.4 * dpi);
                        ctx.drawImage(qrCanvas, x, yPos, qrSize, qrSize);
                        
                        const textX = x + qrSize + Math.round(5 / 25.4 * dpi);
                        const textWidth = width - textX - Math.round((parseFloat(document.getElementById('paddingRight').value) || 2) / 25.4 * dpi);
                        
                        ctx.font = `${Math.round(pxFontSize * 0.9)}px Arial`;
                        drawMultilineText(ctx, `${field.name}:`, textX, yPos, textWidth);
                        ctx.font = `${pxFontSize}px Arial`;
                        drawMultilineText(ctx, String(fieldData), textX, yPos + Math.round(pxFontSize * 1.2), textWidth);
                        
                        yPos += qrSize + Math.round(8 / 25.4 * dpi);
                    } catch (e) {
                        console.error('QR code generation failed:', e);
                    }
                } else {
                    const x = Math.round((parseFloat(document.getElementById('paddingLeft').value) || 2) / 25.4 * dpi);
                    const textWidth = width - x - Math.round((parseFloat(document.getElementById('paddingRight').value) || 2) / 25.4 * dpi);
                    
                    ctx.font = `${Math.round(pxFontSize * 0.9)}px Arial`;
                    drawMultilineText(ctx, `${field.name}:`, x, yPos, textWidth);
                    ctx.font = `${pxFontSize}px Arial`;
                    drawMultilineText(ctx, String(fieldData), x, yPos + Math.round(pxFontSize * 1.1), textWidth);
                    
                    yPos += Math.round(pxFontSize * 2.5);
                }
            });
        }

        function drawMultilineText(ctx, text, x, y, maxWidth) {
            const words = text.split('');
            let line = '';
            let lineY = y;
            const fontSize = parseInt(ctx.font);
            
            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n];
                const metrics = ctx.measureText(testLine);
                const testWidth = metrics.width;
                
                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line, x, lineY);
                    line = words[n];
                    lineY += fontSize;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, lineY);
        }

        function generateAllTags() {
            if (excelData.length === 0) {
                alert('请先导入数据');
                return;
            }
            
            generatedImages = [];
            
            const widthMM = parseFloat(document.getElementById('width').value) || 60;
            const heightMM = parseFloat(document.getElementById('height').value) || 40;
            const dpi = parseInt(document.getElementById('dpi').value) || 300;
            
            const widthPx = Math.round((widthMM / 25.4) * dpi);
            const heightPx = Math.round((heightMM / 25.4) * dpi);
            
            excelData.forEach((row, index) => {
                const canvas = document.createElement('canvas');
                canvas.width = widthPx;
                canvas.height = heightPx;
                
                const ctx = canvas.getContext('2d');
                const bgColor = document.getElementById('bgColor').value;
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, widthPx, heightPx);
                
                drawTagContent(ctx, widthPx, heightPx, row);
                
                const imageData = canvas.toDataURL('image/png');
                generatedImages.push({
                    data: imageData,
                    name: row['产品名称'] || row['序号'] || `标签_${index + 1}`
                });
            });
            
            showGeneratedImages();
        }

        function showGeneratedImages() {
            const container = document.getElementById('generatedImages');
            container.innerHTML = generatedImages.map((img, index) => `
                <div class="image-card">
                    <img src="${img.data}" alt="${img.name}">
                    <div style="padding: 8px;">
                        <div style="font-size: 12px; color: #666; margin-bottom: 8px;">${img.name}</div>
                        <a href="${img.data}" download="${img.name}_${index + 1}.png" class="download-btn">
                            下载
                        </a>
                    </div>
                </div>
            `).join('');
            container.style.display = 'grid';
            
            container.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function downloadAllTags() {
            if (generatedImages.length === 0) {
                alert('请先生成标签');
                return;
            }
            
            generatedImages.forEach((img, index) => {
                const link = document.createElement('a');
                link.href = img.data;
                link.download = `${img.name}_${index + 1}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
            
            alert(`已下载 ${generatedImages.length} 张标签图片`);
        }

        window.addEventListener('DOMContentLoaded', function() {
            const widthInput = document.getElementById('width');
            const heightInput = document.getElementById('height');
            
            widthInput.addEventListener('change', updatePreview);
            heightInput.addEventListener('change', updatePreview);
            document.getElementById('dpi').addEventListener('change', updatePreview);
            document.getElementById('fontSize').addEventListener('change', updatePreview);
            document.getElementById('bgColor').addEventListener('change', updatePreview);
            document.getElementById('textColor').addEventListener('change', updatePreview);
            document.getElementById('paddingTop').addEventListener('change', updatePreview);
            document.getElementById('paddingRight').addEventListener('change', updatePreview);
            document.getElementById('paddingBottom').addEventListener('change', updatePreview);
            document.getElementById('paddingLeft').addEventListener('change', updatePreview);
        });
    </script>
</body>
</html>
