<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园智答 AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/lucide@0.446.0/dist/umd/lucide.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.446.0/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#165DFF',
            'primary-light': '#4080FF',
            'primary-dark': '#0E42C9',
          },
        },
      },
    }
  </script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }
    .dark ::-webkit-scrollbar-thumb { background: #4B5563; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #6B7280; }
    .typing-cursor { animation: blink 1s infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    .markdown-body { line-height: 1.6; }
    .markdown-body pre { background: #F3F4F6; border-radius: 6px; padding: 12px; overflow-x: auto; margin: 8px 0; }
    .dark .markdown-body pre { background: #1F2937; }
    .markdown-body code { font-family: 'Monaco', 'Menlo', monospace; font-size: 0.9em; }
    .markdown-body blockquote { border-left: 3px solid #165DFF; padding: 8px 12px; margin: 8px 0; color: #6B7280; background: #F9FAFB; border-radius: 0 6px 6px 0; }
    .dark .markdown-body blockquote { background: #2D3748; color: #9CA3AF; }
    .markdown-body table { border-collapse: collapse; width: 100%; margin: 8px 0; }
    .markdown-body th, .markdown-body td { border: 1px solid #E5E7EB; padding: 8px 12px; text-align: left; }
    .dark .markdown-body th, .dark .markdown-body td { border-color: #374151; }
    .markdown-body th { background: #F3F4F6; font-weight: 600; }
    .dark .markdown-body th { background: #1F2937; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 h-screen overflow-hidden">
  <div class="h-screen flex">

            </div>

          <p class="text-sm text-gray-500 dark:text-gray-400">控制 AI 回答时检索的数据源。校内数据源优先展示，关闭外部渠道可仅保留校内官方内容。</p>
          <div id="data-source-list" class="space-y-4"></div>
        </div>
        <div class="px-6 py-4 border-t border-gray-200 dark:border-gray-700">

              <span class="font-medium text-primary">提示：</span>关闭「自媒体校园内容」后，将不再检索抖音、小红书等外部平台的校园相关内容。

  <script>
    const STORAGE_KEY = 'campus_ai_conversations';
    const THEME_KEY = 'campus_ai_theme';
    const DATA_SOURCE_KEY = 'campus_ai_data_sources';

    let conversations = [];
    let currentConversationId = null;
    let isDark = false;
    let dataSources = [
      { type: 'school_official', name: '学校官方平台', enabled: true, description: '教务处官网、学工处通知、校园官网公告、图书馆资源', icon: 'file-text' },
      { type: 'school_social', name: '校内社群数据', enabled: true, description: '班级QQ群、院系QQ频道、校园社群聊天归档', icon: 'users' },
      { type: 'social_media', name: '自媒体校园内容', enabled: true, description: '本校官方抖音、校园小红书、学生分享图文', icon: 'video' },
      { type: 'general_ai', name: '通用大模型补充', enabled: true, description: '豆包公开知识库、全网通用科普资料', icon: 'globe' },
    ];
    let isLoading = false;

    function init() {
      loadData();
      lucide.createIcons();
      setupEventListeners();
      renderConversationList();
      updateThemeUI();
      renderDataSourceList();
    }

    function loadData() {
      const savedConversations = localStorage.getItem(STORAGE_KEY);
      if (savedConversations) {
        conversations = JSON.parse(savedConversations);
        if (conversations.length > 0) {
          currentConversationId = conversations[0].id;
        }
      }
      const savedTheme = localStorage.getItem(THEME_KEY);
      if (savedTheme) {
        isDark = JSON.parse(savedTheme).isDark;
        if (isDark) document.documentElement.classList.add('dark');
      }
      const savedDataSources = localStorage.getItem(DATA_SOURCE_KEY);
      if (savedDataSources) {
        dataSources = JSON.parse(savedDataSources);
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
      localStorage.setItem(THEME_KEY, JSON.stringify({ isDark }));
      localStorage.setItem(DATA_SOURCE_KEY, JSON.stringify(dataSources));
    }

    function setupEventListeners() {
      document.getElementById('new-chat-btn').addEventListener('click', createNewConversation);
      document.getElementById('toggle-sidebar-btn').addEventListener('click', toggleSidebar);
      document.getElementById('close-sidebar').addEventListener('click', closeSidebar);
      document.getElementById('toggle-theme').addEventListener('click', toggleTheme);
      document.getElementById('modal-toggle-theme').addEventListener('click', toggleTheme);
      document.getElementById('open-settings').addEventListener('click', () => openModal('settings-modal'));
      document.getElementById('open-data-source').addEventListener('click', () => openModal('data-source-modal'));

    function createNewConversation() {
      const now = Date.now();
      const newConv = {
        id: `conv_${now}`,
        title: '新会话',
        messages: [],
        createdAt: now,
        updatedAt: now,
      };
      conversations.unshift(newConv);
      currentConversationId = newConv.id;
      saveData();
      renderConversationList();
      renderChat();
      closeSidebar();
    }

    function switchConversation(id) {
      currentConversationId = id;
      saveData();
      renderConversationList();
      renderChat();
      closeSidebar();
    }

    function deleteConversation(id) {
      conversations = conversations.filter(c => c.id !== id);
      if (currentConversationId === id) {
        currentConversationId = conversations.length > 0 ? conversations[0].id : null;
      }
      saveData();
      renderConversationList();
      renderChat();
    }

    function renameConversation(id, newTitle) {
      const conv = conversations.find(c => c.id === id);
      if (conv) {
        conv.title = newTitle;
        saveData();
        renderConversationList();
        if (currentConversationId === id) {
          document.getElementById('chat-title').textContent = newTitle;
        }
      }
    }

    function renderConversationList() {
      const list = document.getElementById('conversation-list');
      if (conversations.length === 0) {
        list.innerHTML = '<li class="text-center py-8 text-gray-400"><i data-lucide="message-square" class="w-12 h-12 mx-auto mb-3 opacity-30"></i><p class="text-sm">暂无会话</p><p class="text-xs">点击上方按钮开始新对话</p></li>';
        lucide.createIcons();
        return;
      }
      list.innerHTML = conversations.map(conv => `
        <li>
          <div class="relative flex items-center gap-3 p-3 rounded-lg cursor-pointer transition-colors ${currentConversationId === conv.id ? 'bg-primary/10 border border-primary/20' : 'hover:bg-gray-100 dark:hover:bg-gray-700'}" data-id="${conv.id}">
            <i data-lucide="message-square" class="w-5 h-5 flex-shrink-0 ${currentConversationId === conv.id ? 'text-primary' : 'text-gray-400 dark:text-gray-500'}"></i>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium text-gray-900 dark:text-white truncate">${conv.title}</p>
              <p class="text-xs text-gray-400">${formatDate(conv.updatedAt)}</p>
            </div>
            <div class="conversation-actions flex items-center gap-1 opacity-0 transition-opacity">
              <button class="edit-btn p-1.5 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-lg text-gray-400 hover:text-gray-600 dark:hover:text-gray-300" data-id="${conv.id}">
                <i data-lucide="edit-2" class="w-4 h-4"></i>
              </button>
              <button class="delete-btn p-1.5 hover:bg-red-100 dark:hover:bg-red-900/30 rounded-lg text-gray-400 hover:text-red-500" data-id="${conv.id}">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </li>
      `).join('');
      lucide.createIcons();
      list.querySelectorAll('[data-id]').forEach(item => {
        item.addEventListener('click', () => switchConversation(item.dataset.id));
        item.addEventListener('mouseenter', () => item.querySelector('.conversation-actions').classList.remove('opacity-0'));
        item.addEventListener('mouseleave', () => item.querySelector('.conversation-actions').classList.add('opacity-0'));
      });
      list.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        const conv = conversations.find(c => c.id === id);
        const newTitle = prompt('请输入新标题', conv.title);
        if (newTitle && newTitle.trim()) renameConversation(id, newTitle.trim());
      }));
      list.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (confirm('确定要删除这个会话吗？')) deleteConversation(btn.dataset.id);
      }));

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const content = input.value.trim();
      if (!content || isLoading) return;

      if (!currentConversationId) createNewConversation();
      const conv = getCurrentConversation();

      const userMsg = { id: `${Date.now()}_user`, role: 'user', content, timestamp: Date.now() };
      conv.messages.push(userMsg);
      if (conv.messages.length === 1) {
        conv.title = content.length > 30 ? content.substring(0, 30) + '...' : content;
      }
      conv.updatedAt = Date.now();
      saveData();
      renderConversationList();
      renderChat();

      isLoading = true;
      updateSendButton();
      input.value = '';
      document.getElementById('char-count').textContent = '0/4000';
      document.getElementById('clear-input-btn').classList.add('hidden');

      const aiMsg = { id: `${Date.now()}_ai`, role: 'assistant', content: '', timestamp: Date.now(), sources: [] };
      conv.messages.push(aiMsg);
      saveData();
      renderChat();

      try {
        const result = await generateAIResponse(content, conv.messages.slice(0, -1));
        aiMsg.content = result.content;
        aiMsg.sources = result.sources;
      } catch {
        aiMsg.content = '抱歉，我遇到了一些问题，无法回答你的问题。';
      } finally {
        isLoading = false;
        conv.updatedAt = Date.now();
        saveData();
        renderConversationList();
        renderChat();
        updateSendButton();
      }
    }

    async function generateAIResponse(query, messages) {
      const enabledTypes = dataSources.filter(d => d.enabled).map(d => d.type);
      const sources = await fetchAllSources(query, enabledTypes);
      
      const hasSchoolSource = sources.some(s => s.priority <= 2);
      let response = '';

      if (query.includes('选课')) {
        response = `根据校内信息，${hasSchoolSource ? '为你整理选课相关内容：' : '暂无校内对应信息，以下为全网参考内容：'}\n\n**选课时间**：2024年秋季学期选课时间为9月1日至9月15日\n\n**选课流程**：\n1. 登录教务管理系统（jwc.school.edu.cn）\n2. 进入选课中心，查看可选课程\n3. 根据培养方案选择必修和选修课程\n4. 确认提交，查看选课结果\n\n**注意事项**：\n- 每学期选课学分不得少于15学分，不得超过25学分\n- 热门课程建议尽早选课，避免名额已满`;
      } else if (query.includes('补考')) {
        response = `${hasSchoolSource ? '根据教务处通知：' : '暂无校内对应信息，以下为全网参考内容：'}\n\n**补考时间**：2024-2025学年第一学期补考安排在9月10日至9月15日\n\n**补考流程**：\n1. 登录教务系统查看补考科目和时间\n2. 打印准考证\n3. 按时参加补考\n\n**注意**：补考成绩最高按60分计`;
      } else if (query.includes('奖学金')) {
        response = `${hasSchoolSource ? '根据学工处通知：' : '暂无校内对应信息，以下为全网参考内容：'}\n\n**申请时间**：每年10月1日至10月31日\n\n**申请条件**：\n- 在校期间表现优秀\n- 学习成绩优异，无挂科\n- 积极参与社会实践\n\n**奖项设置**：国家奖学金8000元/年，国家励志奖学金5000元/年`;
      } else if (query.includes('宿舍') || query.includes('报修')) {
        response = `${hasSchoolSource ? '根据宿舍管理群通知：' : '暂无校内对应信息，以下为全网参考内容：'}\n\n**宿舍报修流程**：\n1. 通过校园APP或微信公众号进入报修系统\n2. 选择报修类型（水电、家具、网络等）\n3. 填写详细信息和联系方式\n4. 等待维修人员联系\n\n**维修时间**：工作日 8:00-18:00`;
      } else if (query.includes('社团') || query.includes('活动')) {
        response = `根据校园自媒体信息，${hasSchoolSource ? '整理社团招新相关内容：' : '暂无校内对应信息，以下为全网参考内容：'}\n\n**招新时间**：9月开学第一周\n\n**主要社团**：\n- 学生会：负责校园各类活动组织\n- 艺术团：包含舞蹈、声乐、器乐等部门\n- 科技协会：组织编程竞赛、科技讲座\n- 志愿者协会：参与各类志愿服务\n\n**招新地点**：大学生活动中心广场`;
      } else if (query.includes('考研') || query.includes('考证')) {
        response = `${hasSchoolSource ? '根据校内考研交流群分享：' : '暂无校内对应信息，以下为全网参考内容：'}\n\n**备考建议**：\n1. 尽早确定目标院校和专业\n2. 制定合理的复习计划\n3. 充分利用图书馆资源\n\n**校内资源**：\n- 图书馆三楼设有考研专区\n- 学校定期举办考研经验分享会\n- 可申请考研专用自习室`;
      } else {
        response = `${hasSchoolSource ? '根据校内信息和全网资料，' : '暂无校内对应信息，根据全网资料，'}为你解答：\n\n你问的是关于「${query}」的问题。\n\n这是一个综合性的问题，涉及多个方面：\n\n1. **基础知识**：相关的基本概念和原理\n2. **实践应用**：在实际场景中的应用方法\n3. **注意事项**：需要特别留意的关键点\n\n如果你有更具体的问题，可以继续问我哦！`;
      }

      return new Promise(resolve => {
        let currentContent = '';
        const chars = response.split('');
        let i = 0;
        const interval = setInterval(() => {
          if (i < chars.length) {
            currentContent += chars[i];
            aiMsg.content = currentContent;
            saveData();
            renderChat();
            i++;
          } else {
            clearInterval(interval);
            resolve({ content: response, sources });
          }
        }, 15 + Math.random() * 25);
      });
    }

    async function fetchAllSources(query, enabledTypes) {
      const sources = [];
      if (enabledTypes.includes('school_official')) {
        if (query.includes('选课') || query.includes('课程') || query.includes('补考') || query.includes('奖学金')) {
          sources.push({
            id: `school_${Date.now()}`,
            title: query.includes('选课') ? '关于2024年秋季学期选课工作的通知' : query.includes('补考') ? '关于2024-2025学年第一学期补考安排的通知' : '2024年度国家奖学金申请通知',
            channel: 'school_official',
            snippet: query.includes('选课') ? '2024年秋季学期选课时间为9月1日至9月15日，请各位同学登录教务系统进行选课...' : query.includes('补考') ? '补考时间安排在9月10日至9月15日，具体时间以教务系统通知为准...' : '国家奖学金申请时间为每年10月1日至10月31日，申请条件包括...',
            priority: 1,
          });
        }
      }
      if (enabledTypes.includes('school_social')) {
        if (query.includes('宿舍') || query.includes('考研')) {
          sources.push({
            id: `qq_${Date.now()}`,
            title: query.includes('宿舍') ? '宿舍管理群公告' : '考研交流群分享',
            channel: 'school_social',
            snippet: query.includes('宿舍') ? '【重要通知】近期宿舍报修系统升级，请同学们通过新系统提交报修申请...' : '图书馆三楼考研专区座位预约开放时间为每天早上6:30...',
            priority: 2,
          });
        }
      }
      if (enabledTypes.includes('social_media')) {
        if (query.includes('社团') || query.includes('活动') || query.includes('食堂')) {
          sources.push({
            id: `social_${Date.now()}`,
            title: query.includes('社团') ? '校园社团招新季来啦！' : '校园美食攻略｜食堂三楼隐藏菜单',
            channel: 'social_media',
            snippet: query.includes('社团') ? '九月开学季，各大社团火热招新中！学生会、艺术团、科技协会...' : '今天给大家分享食堂三楼那些好吃又实惠的隐藏美食...',
            priority: 3,
          });
        }
      }
      if (enabledTypes.includes('general_ai')) {
        sources.push({
          id: `ai_${Date.now()}`,
          title: '豆包知识库 - 校园问答指南',
          channel: 'general_ai',
          snippet: '大学校园生活涉及多个方面，合理规划可以帮助你更好地适应校园生活...',
          priority: 4,
        });
      }
      return sources.sort((a, b) => a.priority - b.priority);
    }

    function regenerateMessage(msgId) {
      const conv = getCurrentConversation();
      if (!conv) return;
      const msgIndex = conv.messages.findIndex(m => m.id === msgId);
      if (msgIndex <= 0) return;
      const userMsg = conv.messages[msgIndex - 1];
      conv.messages = conv.messages.slice(0, msgIndex);
      saveData();
      renderChat();
      sendMessageWithContent(userMsg.content);
    }

    function sendMessageWithContent(content) {
      document.getElementById('chat-input').value = content;
      sendMessage();
    }

    function toggleTheme() {
      isDark = !isDark;
      if (isDark) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      updateThemeUI();
      saveData();
    }

    function updateThemeUI() {
      const icon = document.getElementById('theme-icon');
      const text = document.getElementById('theme-text');
      const modalIcon = document.getElementById('modal-theme-icon');
      const modalText = document.getElementById('modal-theme-text');
      const toggleBtn = document.getElementById('modal-toggle-theme');
      const toggleSpan = toggleBtn.querySelector('span');

      if (isDark) {
        icon.setAttribute('data-lucide', 'sun');
        text.textContent = '浅色';
        modalIcon.setAttribute('data-lucide', 'sun');
        modalText.textContent = '浅色模式';
        toggleBtn.classList.add('bg-primary');
        toggleBtn.classList.remove('bg-gray-300');
        toggleSpan.classList.add('translate-x-7');
        toggleSpan.classList.remove('translate-x-1');
      } else {
        icon.setAttribute('data-lucide', 'moon');
        text.textContent = '深色';
        modalIcon.setAttribute('data-lucide', 'moon');
        modalText.textContent = '深色模式';
        toggleBtn.classList.remove('bg-primary');
        toggleBtn.classList.add('bg-gray-300');
        toggleSpan.classList.remove('translate-x-7');
        toggleSpan.classList.add('translate-x-1');
      }
      lucide.createIcons();
    }

    function renderDataSourceList() {
      const list = document.getElementById('data-source-list');
      list.innerHTML = dataSources.map(ds => `
        <div class="flex items-center gap-4 p-4 rounded-xl bg-gray-50 dark:bg-gray-700">
          <div class="w-10 h-10 rounded-lg flex items-center justify-center ${ds.type === 'school_official' ? 'bg-red-50 text-red-500' : ds.type === 'school_social' ? 'bg-orange-50 text-orange-500' : ds.type === 'social_media' ? 'bg-blue-50 text-blue-500' : 'bg-gray-200 dark:bg-gray-600 text-gray-500'}">
            <i data-lucide="${ds.icon}" class="w-5 h-5"></i>
          </div>
          <div class="flex-1">
            <div class="flex items-center gap-2">
              <h4 class="font-medium text-gray-900 dark:text-white">${ds.name}</h4>
              <span class="text-xs ${ds.type === 'school_official' ? 'text-red-500' : ds.type === 'school_social' ? 'text-orange-500' : ds.type === 'social_media' ? 'text-blue-500' : 'text-gray-400'}">${getPriorityLabel(ds.type)}</span>
            </div>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">${ds.description}</p>
          </div>
          <button class="toggle-data-source relative w-12 h-6 rounded-full transition-colors ${ds.enabled ? 'bg-primary' : 'bg-gray-300'}" data-type="${ds.type}">
            <span class="absolute top-1 w-4 h-4 rounded-full bg-white transition-transform ${ds.enabled ? 'translate-x-7' : 'translate-x-1'}"></span>
          </button>
        </div>
      `).join('');
      lucide.createIcons();
      list.querySelectorAll('.toggle-data-source').forEach(btn => btn.addEventListener('click', () => {
        const type = btn.dataset.type;
        const ds = dataSources.find(d => d.type === type);
        if (ds) {
          ds.enabled = !ds.enabled;
          saveData();
          renderDataSourceList();
        }
      }));
    }

    function exportConversation() {
      const conv = getCurrentConversation();
      if (!conv || conv.messages.length === 0) {
        alert('当前对话为空，无法导出');
        return;
      }
      let markdown = `# 校园智答 AI 对话记录\n\n**导出时间**: ${new Date().toLocaleString('zh-CN')}\n\n---\n\n`;
      conv.messages.forEach(msg => {
        const date = new Date(msg.timestamp);
        const timeStr = date.toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        markdown += `## ${msg.role === 'user' ? '用户' : 'AI 助手'} [${timeStr}]\n\n${msg.content}\n\n---\n\n`;
      });
      const blob = new Blob([markdown], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${conv.title}.md`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function clearCurrentConversation() {
      if (confirm('确定要清空当前对话吗？')) {
        const conv = getCurrentConversation();
        if (conv) {
          conv.messages = [];
          conv.title = '新会话';
          saveData();
          renderConversationList();
          renderChat();
        }
      }
    }

    function clearCache() {
      if (confirm('确定要清除全部缓存吗？这将删除所有对话历史。')) {
        localStorage.clear();
        conversations = [];
        currentConversationId = null;
        renderConversationList();
        renderChat();
      }
    }

    function handleInput() {
      const input = document.getElementById('chat-input');
      const count = document.getElementById('char-count');
      const clearBtn = document.getElementById('clear-input-btn');
      count.textContent = `${input.value.length}/4000`;
      clearBtn.classList.toggle('hidden', !input.value.trim());
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 200) + 'px';
      updateSendButton();
    }

    function updateSendButton() {
      const input = document.getElementById('chat-input');
      const btn = document.getElementById('send-btn');
      const isValid = input.value.trim().length > 0 && !isLoading;
      if (isValid) {
        btn.classList.remove('bg-gray-200', 'dark:bg-gray-700', 'text-gray-400', 'cursor-not-allowed');
        btn.classList.add('bg-primary', 'hover:bg-primary-dark', 'text-white', 'shadow-md', 'hover:shadow-lg');
      } else {
        btn.classList.add('bg-gray-200', 'dark:bg-gray-700', 'text-gray-400', 'cursor-not-allowed');
        btn.classList.remove('bg-primary', 'hover:bg-primary-dark', 'text-white', 'shadow-md', 'hover:shadow-lg');
      }
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function clearInput() {
      const input = document.getElementById('chat-input');
      input.value = '';
      input.style.height = 'auto';
      handleInput();
    }

    function handlePresetClick(e) {
      const content = e.target.closest('.preset-btn').dataset.content;
      createNewConversation();
      setTimeout(() => {
        document.getElementById('chat-input').value = content;
        handleInput();
        sendMessage();
      }, 100);
    }

    function handleQuickQuestion(e) {
      const content = e.target.closest('.quick-question').dataset.content;
      document.getElementById('chat-input').value = content;
      handleInput();
      sendMessage();
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.add('-translate-x-full');
    }

    function openModal(id) {
      document.getElementById(id).classList.remove('hidden');
    }

    function closeModal() {
      document.querySelectorAll('.fixed.inset-0').forEach(modal => modal.classList.add('hidden'));
    }

    function handleScroll() {
    }

    function scrollToBottom() {
      setTimeout(() => {
        const end = document.getElementById('messages-end');
        if (end) end.scrollIntoView({ behavior: 'smooth' });
      }, 100);
    }

    function getCurrentConversation() {
      return conversations.find(c => c.id === currentConversationId);
    }

    function formatDate(timestamp) {
      const date = new Date(timestamp);
      const now = new Date();
      const diff = now.getTime() - timestamp;
      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return `${Math.floor(diff / 60000)}分钟前`;
      if (diff < 86400000 && date.getDate() === now.getDate()) return `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
      return `${date.getMonth() + 1}/${date.getDate()}`;
    }

    function getChannelName(channel) {
      switch (channel) {
        case 'school_official': return '学校官方';
        case 'school_social': return '校内社群';
        case 'social_media': return '自媒体';
        case 'general_ai': return '通用AI';
        default: return channel;
      }
    }

    function getPriorityLabel(type) {
      switch (type) {
        case 'school_official': return '优先级最高';
        case 'school_social': return '优先级高';
        case 'social_media': return '优先级中';
        case 'general_ai': return '优先级低';
        default: return '';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderMarkdown(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/^\d+\.\s/gm, '<span class="ml-2">$&</span>')
        .replace(/^-\s/gm, '<span class="ml-2">• </span>')
        .replace(/\n/g, '<br>');
    }

    init();
  </script>
</body>
</html>
