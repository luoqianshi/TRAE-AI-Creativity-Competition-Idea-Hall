<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEURA · 脑域矩阵</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ========== 全局重置与基础样式 ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #06070d;
  --bg-card: rgba(15, 18, 30, 0.7);
  --cyan: #00e5ff;
  --purple: #a855f7;
  --green: #00ffa3;
  --pink: #ff2e7e;
  --amber: #ffb800;
  --text: #e0e6f0;
  --text-dim: #6b7280;
  --glass-border: rgba(255,255,255,0.08);
  --radius: 16px;
}
html { font-size: 16px; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ========== 背景效果 ========== */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
}
.bg-glow {
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.15;
  pointer-events: none;
  z-index: 0;
  animation: floatGlow 12s ease-in-out infinite alternate;
}
.bg-glow-1 { width: 500px; height: 500px; background: var(--cyan); top: -10%; left: -5%; }
.bg-glow-2 { width: 400px; height: 400px; background: var(--purple); bottom: -10%; right: -5%; animation-delay: -4s; }
.bg-glow-3 { width: 300px; height: 300px; background: var(--pink); top: 40%; left: 60%; animation-delay: -8s; }
@keyframes floatGlow {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(40px, -30px) scale(1.15); }
}

/* ========== 页面容器 ========== */
.page { display: none; position: relative; z-index: 1; min-height: 100vh; padding: 20px; }
.page.active { display: flex; flex-direction: column; align-items: center; }
.page-inner { width: 100%; max-width: 900px; }

/* ========== 字体工具类 ========== */
.font-orbitron { font-family: 'Orbitron', monospace; }
.text-cyan { color: var(--cyan); }
.text-purple { color: var(--purple); }
.text-green { color: var(--green); }
.text-pink { color: var(--pink); }
.text-amber { color: var(--amber); }

/* ========== 按钮基础样式 ========== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 28px; border: 1px solid var(--glass-border); border-radius: 12px;
  background: var(--bg-card); backdrop-filter: blur(12px);
  color: var(--text); font-family: 'Noto Sans SC', sans-serif; font-size: 0.95rem;
  cursor: pointer; transition: all 0.25s ease; user-select: none;
}
.btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-1px); }
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  border: none; color: #fff; font-weight: 700;
}
.btn-primary:hover { opacity: 0.9; }
.btn-sm { padding: 8px 18px; font-size: 0.85rem; }
.btn-back {
  position: fixed; top: 20px; left: 20px; z-index: 100;
  padding: 10px 16px; border-radius: 10px;
  background: var(--bg-card); backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border); color: var(--text);
  cursor: pointer; font-size: 1.2rem; transition: all 0.2s;
}
.btn-back:hover { background: rgba(255,255,255,0.1); }

/* ========== 主页头部 ========== */
.home-header {
  text-align: center; padding: 60px 0 20px; width: 100%;
}
.brand-name {
  font-family: 'Orbitron', monospace; font-size: 3rem; font-weight: 900;
  background: linear-gradient(135deg, var(--cyan), var(--purple), var(--pink));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; letter-spacing: 6px;
}
.brand-sub {
  font-size: 1rem; color: var(--text-dim); margin-top: 8px;
  letter-spacing: 8px; font-weight: 300;
}
.brain-power {
  margin-top: 24px; display: flex; align-items: center; justify-content: center; gap: 12px;
}
.brain-power .label { font-size: 0.85rem; color: var(--text-dim); }
.brain-power .value {
  font-family: 'Orbitron', monospace; font-size: 1.5rem; font-weight: 700;
  color: var(--cyan);
}
.brain-power-bar {
  width: 200px; height: 6px; background: rgba(255,255,255,0.08);
  border-radius: 3px; overflow: hidden; margin-top: 8px; margin-inline: auto;
}
.brain-power-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--cyan), var(--purple));
  transition: width 0.6s ease;
}

/* ========== 模块卡片网格 ========== */
.module-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px; padding: 30px 0 60px; width: 100%;
}
.module-card {
  position: relative; padding: 28px 24px; border-radius: var(--radius);
  background: var(--bg-card); backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border); cursor: pointer;
  transition: all 0.3s ease; overflow: hidden;
}
.module-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.15); }
.module-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
}
.module-card.locked { opacity: 0.45; cursor: not-allowed; }
.module-card.locked:hover { transform: none; }
.mc-number {
  font-family: 'Orbitron', monospace; font-size: 0.75rem; font-weight: 700;
  letter-spacing: 3px; opacity: 0.5; margin-bottom: 12px;
}
.mc-name {
  font-family: 'Orbitron', monospace; font-size: 1.1rem; font-weight: 700;
  margin-bottom: 4px;
}
.mc-name-cn { font-size: 0.95rem; font-weight: 500; margin-bottom: 10px; opacity: 0.8; }
.mc-desc { font-size: 0.82rem; color: var(--text-dim); line-height: 1.5; margin-bottom: 16px; }
.mc-score { font-size: 0.8rem; color: var(--text-dim); }
.mc-score span { font-family: 'Orbitron', monospace; font-weight: 700; }
.mc-lock {
  position: absolute; top: 16px; right: 16px; font-size: 1.2rem; opacity: 0.4;
}

/* ========== 游戏选择页 ========== */
.game-select-header {
  text-align: center; padding: 70px 0 20px;
}
.game-select-header h2 {
  font-family: 'Orbitron', monospace; font-size: 1.8rem; font-weight: 700;
}
.game-list { padding: 20px 0 60px; width: 100%; }
.game-item {
  padding: 24px; border-radius: var(--radius);
  background: var(--bg-card); backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border); margin-bottom: 16px;
}
.game-item-header {
  display: flex; align-items: center; gap: 14px; margin-bottom: 16px;
}
.game-item-icon {
  width: 44px; height: 44px; border-radius: 12px; display: flex;
  align-items: center; justify-content: center; font-size: 1.3rem;
  font-family: 'Orbitron', monospace; font-weight: 700;
}
.game-item-title { font-weight: 700; font-size: 1.05rem; }
.game-item-desc { font-size: 0.82rem; color: var(--text-dim); }
.difficulty-row { display: flex; gap: 12px; flex-wrap: wrap; }
.diff-btn {
  flex: 1; min-width: 120px; padding: 14px 16px; border-radius: 12px;
  border: 1px solid var(--glass-border); background: rgba(255,255,255,0.03);
  cursor: pointer; transition: all 0.25s; text-align: center;
}
.diff-btn:hover:not(.diff-locked) { background: rgba(255,255,255,0.07); transform: translateY(-2px); }
.diff-btn.diff-locked { opacity: 0.3; cursor: not-allowed; }
.diff-btn.diff-locked:hover { transform: none; }
.diff-label { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
.diff-info { font-size: 0.75rem; color: var(--text-dim); }
.diff-score { font-size: 0.75rem; margin-top: 4px; font-family: 'Orbitron', monospace; }

/* ========== 游戏通用样式 ========== */
.game-header {
  text-align: center; padding: 70px 0 10px; width: 100%;
}
.game-header h2 {
  font-family: 'Orbitron', monospace; font-size: 1.6rem; font-weight: 700;
}
.game-header .game-subtitle { font-size: 0.9rem; color: var(--text-dim); margin-top: 6px; }
.game-stats {
  display: flex; justify-content: center; gap: 30px; padding: 16px 0;
  font-size: 0.9rem;
}
.game-stats .stat { display: flex; align-items: center; gap: 6px; }
.game-stats .stat-value { font-family: 'Orbitron', monospace; font-weight: 700; }
.game-area {
  width: 100%; display: flex; justify-content: center; align-items: center;
  padding: 20px 0; flex: 1;
}
.game-controls {
  display: flex; justify-content: center; gap: 12px; padding: 20px 0 40px;
}

/* ========== 翻牌记忆 ========== */
.memory-grid {
  display: grid; gap: 10px; width: fit-content; margin: 0 auto;
}
.memory-card {
  width: 80px; height: 90px; perspective: 600px; cursor: pointer;
}
.memory-card-inner {
  position: relative; width: 100%; height: 100%;
  transition: transform 0.4s ease; transform-style: preserve-3d;
}
.memory-card.flipped .memory-card-inner { transform: rotateY(180deg); }
.memory-card-front, .memory-card-back {
  position: absolute; width: 100%; height: 100%; border-radius: 12px;
  backface-visibility: hidden; display: flex; align-items: center;
  justify-content: center; font-size: 1.8rem;
}
.memory-card-front {
  background: var(--bg-card); border: 1px solid var(--glass-border);
  backdrop-filter: blur(8px);
}
.memory-card-front::after {
  content: '?'; font-family: 'Orbitron', monospace; font-size: 1.4rem;
  color: var(--text-dim); opacity: 0.3;
}
.memory-card-back {
  transform: rotateY(180deg); border: 2px solid;
}
.memory-card.matched .memory-card-back {
  border-color: var(--green) !important;
  box-shadow: 0 0 16px rgba(0,255,163,0.3);
}
.memory-card.matched { pointer-events: none; }

/* ========== 快速心算 ========== */
.calc-container {
  text-align: center; width: 100%; max-width: 500px;
}
.calc-question {
  font-family: 'Orbitron', monospace; font-size: 3rem; font-weight: 900;
  padding: 40px 0; min-height: 120px;
  display: flex; align-items: center; justify-content: center;
}
.calc-input-wrap {
  display: flex; gap: 12px; justify-content: center; align-items: center;
}
.calc-input {
  width: 160px; padding: 14px 20px; border-radius: 12px;
  border: 2px solid var(--glass-border); background: var(--bg-card);
  color: var(--text); font-family: 'Orbitron', monospace;
  font-size: 1.5rem; text-align: center; outline: none;
  transition: border-color 0.2s;
}
.calc-input:focus { border-color: var(--amber); }
.calc-feedback {
  margin-top: 20px; font-size: 1.2rem; font-weight: 700;
  min-height: 36px;
}
.calc-progress {
  width: 100%; height: 6px; background: rgba(255,255,255,0.08);
  border-radius: 3px; margin-top: 20px; overflow: hidden;
}
.calc-progress-fill {
  height: 100%; background: var(--amber); border-radius: 3px;
  transition: width 0.3s linear;
}

/* ========== 变色彩 ========== */
.color-game-container {
  text-align: center; width: 100%; max-width: 500px;
}
.color-target {
  font-size: 1.2rem; font-weight: 700; margin-bottom: 30px;
  padding: 12px 24px; border-radius: 12px;
  background: var(--bg-card); border: 1px solid var(--glass-border);
  display: inline-block;
}
.color-block-wrap {
  display: flex; justify-content: center; margin-bottom: 20px;
}
.color-block {
  width: 200px; height: 200px; border-radius: 24px;
  transition: background 0.1s; cursor: pointer;
  border: 3px solid transparent;
}
.color-block:active { transform: scale(0.95); }
.color-score-flash {
  position: absolute; font-family: 'Orbitron', monospace; font-size: 1.5rem;
  font-weight: 900; pointer-events: none; animation: flashUp 0.8s ease-out forwards;
}
@keyframes flashUp {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-60px); }
}
.color-timer-bar {
  width: 100%; height: 8px; background: rgba(255,255,255,0.08);
  border-radius: 4px; overflow: hidden; margin-top: 20px;
}
.color-timer-fill {
  height: 100%; background: var(--pink); border-radius: 4px;
  transition: width 0.1s linear;
}

/* ========== 苏尔特方格 ========== */
.schulte-grid {
  display: grid; gap: 8px; width: fit-content; margin: 0 auto;
}
.schulte-cell {
  width: 70px; height: 70px; border-radius: 12px; border: 1px solid var(--glass-border);
  background: var(--bg-card); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Orbitron', monospace; font-size: 1.3rem; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
  user-select: none;
}
.schulte-cell:hover { background: rgba(255,255,255,0.08); }
.schulte-cell.correct {
  background: rgba(0,255,163,0.15); border-color: var(--green);
  color: var(--green); pointer-events: none;
}
.schulte-cell.wrong {
  animation: shake 0.4s ease;
  background: rgba(255,46,126,0.15); border-color: var(--pink);
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
.schulte-next {
  text-align: center; font-size: 0.95rem; margin-bottom: 16px;
}
.schulte-next span {
  font-family: 'Orbitron', monospace; font-weight: 700;
  color: var(--green);
}

/* ========== 4x4数独 ========== */
.sudoku-container { text-align: center; }
.sudoku-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 4px; width: fit-content; margin: 0 auto;
  padding: 3px; border: 2px solid rgba(255,255,255,0.15);
  border-radius: 12px; background: rgba(255,255,255,0.05);
}
.sudoku-cell {
  width: 70px; height: 70px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Orbitron', monospace; font-size: 1.4rem; font-weight: 700;
  cursor: pointer; transition: all 0.2s; position: relative;
}
.sudoku-cell.given {
  background: rgba(255,255,255,0.05); color: var(--text);
  cursor: default;
}
.sudoku-cell.empty {
  background: var(--bg-card); border: 1px solid var(--glass-border);
  cursor: pointer;
}
.sudoku-cell.empty:hover { background: rgba(255,255,255,0.06); }
.sudoku-cell.selected {
  border-color: var(--purple) !important;
  box-shadow: 0 0 12px rgba(168,85,247,0.3);
}
.sudoku-cell.conflict {
  background: rgba(255,46,126,0.15) !important;
  border-color: var(--pink) !important;
  animation: pulse 0.8s ease infinite alternate;
}
@keyframes pulse {
  0% { box-shadow: 0 0 8px rgba(255,46,126,0.2); }
  100% { box-shadow: 0 0 16px rgba(255,46,126,0.4); }
}
.sudoku-numpad {
  display: flex; gap: 10px; justify-content: center; margin-top: 24px; flex-wrap: wrap;
}
.sudoku-num {
  width: 50px; height: 50px; border-radius: 10px; border: 1px solid var(--glass-border);
  background: var(--bg-card); color: var(--text); font-family: 'Orbitron', monospace;
  font-size: 1.2rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.sudoku-num:hover { background: rgba(168,85,247,0.15); border-color: var(--purple); }
.sudoku-num.erase { font-size: 0.75rem; color: var(--text-dim); }

/* ========== 结算弹窗 ========== */
.result-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(6,7,13,0.85); backdrop-filter: blur(8px);
  z-index: 200; align-items: center; justify-content: center;
}
.result-overlay.active { display: flex; }
.result-card {
  background: var(--bg-card); backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border); border-radius: 20px;
  padding: 40px 48px; text-align: center; max-width: 400px; width: 90%;
  animation: slideUp 0.4s ease;
}
@keyframes slideUp {
  0% { opacity: 0; transform: translateY(40px); }
  100% { opacity: 1; transform: translateY(0); }
}
.result-grade {
  font-family: 'Orbitron', monospace; font-size: 4rem; font-weight: 900;
  margin-bottom: 8px;
}
.result-score-label { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 4px; }
.result-score-value {
  font-family: 'Orbitron', monospace; font-size: 2rem; font-weight: 700;
  margin-bottom: 20px;
}
.result-details { text-align: left; font-size: 0.85rem; margin-bottom: 24px; line-height: 1.8; }
.result-details span { float: right; font-family: 'Orbitron', monospace; font-weight: 700; }
.result-best { font-size: 0.8rem; color: var(--amber); margin-bottom: 20px; }
.result-actions { display: flex; gap: 12px; justify-content: center; }

/* ========== 响应式 ========== */
@media (max-width: 600px) {
  .brand-name { font-size: 2rem; letter-spacing: 3px; }
  .module-grid { grid-template-columns: 1fr; }
  .memory-card { width: 65px; height: 75px; }
  .memory-card-back { font-size: 1.4rem; }
  .calc-question { font-size: 2.2rem; }
  .schulte-cell { width: 56px; height: 56px; font-size: 1.1rem; }
  .sudoku-cell { width: 60px; height: 60px; font-size: 1.2rem; }
  .color-block { width: 160px; height: 160px; }
  .game-stats { gap: 16px; font-size: 0.8rem; }
  .result-card { padding: 28px 24px; }
}

/* ========== 倒计时覆盖样式 ========== */
.countdown-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(6,7,13,0.9); z-index: 300;
  align-items: center; justify-content: center; flex-direction: column;
}
.countdown-overlay.active { display: flex; }
.countdown-num {
  font-family: 'Orbitron', monospace; font-size: 6rem; font-weight: 900;
  color: var(--cyan); animation: countPulse 1s ease-in-out;
}
@keyframes countPulse {
  0% { transform: scale(1.5); opacity: 0; }
  50% { transform: scale(1); opacity: 1; }
  100% { transform: scale(0.9); opacity: 0.6; }
}

/* ========== 页面过渡 ========== */
.page { animation: fadeIn 0.3s ease; }
@keyframes fadeIn {
  0% { opacity: 0; }
  100% { opacity: 1; }
}
</style>
</head>
<body>

<!-- 背景光晕 -->
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>
<div class="bg-glow bg-glow-3"></div>

<!-- 倒计时覆盖 -->
<div class="countdown-overlay" id="countdownOverlay">
  <div class="countdown-num" id="countdownNum">3</div>
</div>

<!-- ==================== 主页 ==================== -->
<div class="page active" id="pageHome">
  <div class="page-inner">
    <div class="home-header">
      <div class="brand-name">NEURA</div>
      <div class="brand-sub">脑 域 矩 阵</div>
      <div class="brain-power">
        <span class="label">脑力值</span>
        <span class="value" id="totalBrainPower">0</span>
      </div>
      <div class="brain-power-bar">
        <div class="brain-power-fill" id="brainPowerBar" style="width: 0%"></div>
      </div>
    </div>
    <div class="module-grid" id="moduleGrid">
      <!-- JS 动态生成 -->
    </div>
  </div>
</div>

<!-- ==================== 游戏选择页 ==================== -->
<div class="page" id="pageGameSelect">
  <button class="btn-back" onclick="showPage('pageHome')">&larr;</button>
  <div class="page-inner">
    <div class="game-select-header">
      <h2 id="gameSelectTitle" class="font-orbitron"></h2>
      <p id="gameSelectSub" style="color: var(--text-dim); margin-top: 8px;"></p>
    </div>
    <div class="game-list" id="gameList">
      <!-- JS 动态生成 -->
    </div>
  </div>
</div>

<!-- ==================== 游戏页（通用） ==================== -->
<div class="page" id="pageGame">
  <button class="btn-back" id="gameBackBtn">&larr;</button>
  <div class="page-inner">
    <div class="game-header">
      <h2 class="font-orbitron" id="gameTitle"></h2>
      <div class="game-subtitle" id="gameSubtitle"></div>
    </div>
    <div class="game-stats" id="gameStats"></div>
    <div class="game-area" id="gameArea"></div>
    <div class="game-controls" id="gameControls"></div>
  </div>
</div>

<!-- ==================== 结算弹窗 ==================== -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-card">
    <div class="result-grade" id="resultGrade"></div>
    <div class="result-score-label">最终得分</div>
    <div class="result-score-value" id="resultScore"></div>
    <div class="result-details" id="resultDetails"></div>
    <div class="result-best" id="resultBest"></div>
    <div class="result-actions">
      <button class="btn" onclick="closeResult(); restartCurrentGame();">再来一局</button>
      <button class="btn btn-primary" onclick="closeResult(); showPage('pageGameSelect');">返回</button>
    </div>
  </div>
</div>

<script>
// ==================== 数据与配置 ====================

// 模块配置
const MODULES = [

// ==================== 存储管理 ====================

function getStorage() {
  try {
    const data = JSON.parse(localStorage.getItem('neura_data'));
    return data || {};
  } catch(e) { return {}; }
}

function saveStorage(data) {
  localStorage.setItem('neura_data', JSON.stringify(data));
}

// 获取某个游戏某难度的最高分
function getHighScore(gameId, difficulty) {
  const data = getStorage();
  return (data.scores && data.scores[gameId] && data.scores[gameId][difficulty]) || 0;
}

// 设置最高分
function setHighScore(gameId, difficulty, score) {
  const data = getStorage();
  if (!data.scores) data.scores = {};
  if (!data.scores[gameId]) data.scores[gameId] = {};
  if (score > (data.scores[gameId][difficulty] || 0)) {
    data.scores[gameId][difficulty] = score;
    saveStorage(data);
    return true; // 返回是否是新纪录
  }
  saveStorage(data);
  return false;
}

// 计算总脑力值
function calcTotalBrainPower() {
  const data = getStorage();
  if (!data.scores) return 0;
  let total = 0;
  for (const gid in data.scores) {
    for (const diff in data.scores[gid]) {
      total += data.scores[gid][diff];
    }
  }
  return total;
}

// 检查难度是否解锁
function isDifficultyUnlocked(gameId, difficulty) {
  if (difficulty === 'easy') return true;
  const data = getStorage();
  if (difficulty === 'medium') {
    return getHighScore(gameId, 'easy') >= 60;
  }
  if (difficulty === 'hard') {
    return getHighScore(gameId, 'medium') >= 80;
  }
  return false;
}

// ==================== 页面导航 ====================

let currentModule = null;
let currentGame = null;
let currentDifficulty = null;
let currentGameCleanup = null;

function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  if (pageId === 'pageHome') renderHome();
  if (pageId === 'pageGameSelect') renderGameSelect();
}

function renderHome() {
  // 更新脑力值
  const bp = calcTotalBrainPower();
  document.getElementById('totalBrainPower').textContent = bp;
  const maxBp = 1500; // 假设满分
  document.getElementById('brainPowerBar').style.width = Math.min(bp / maxBp * 100, 100) + '%';

  // 生成模块卡片
  const grid = document.getElementById('moduleGrid');
  grid.innerHTML = '';
  MODULES.forEach(mod => {
    const bestScore = getModuleBestScore(mod);
    const card = document.createElement('div');
    card.className = 'module-card';
    card.style.cssText = `--card-color: ${mod.color}`;
    card.innerHTML = `
      <div style="position:absolute;top:0;left:0;right:0;height:3px;background:${mod.color};"></div>
      <div class="mc-number" style="color:${mod.color}">${mod.num}</div>
      <div class="mc-name" style="color:${mod.color}">${mod.name}</div>
      <div class="mc-name-cn">${mod.nameCn}</div>
      <div class="mc-desc">${mod.desc}</div>
      <div class="mc-score">最高分 <span style="color:${mod.color}">${bestScore}</span></div>
    `;
    card.addEventListener('click', () => {
      currentModule = mod;
      showPage('pageGameSelect');
    });
    grid.appendChild(card);
  });
}

function getModuleBestScore(mod) {
  let best = 0;
  mod.games.forEach(g => {
    ['easy','medium','hard'].forEach(d => {
      const s = getHighScore(g.id, d);
      if (s > best) best = s;
    });
  });
  return best;
}

function renderGameSelect() {
  if (!currentModule) return;
  const mod = currentModule;
  document.getElementById('gameSelectTitle').textContent = mod.name;
  document.getElementById('gameSelectTitle').style.color = mod.color;
  document.getElementById('gameSelectSub').textContent = mod.desc;

  const list = document.getElementById('gameList');
  list.innerHTML = '';
  mod.games.forEach(game => {
    const item = document.createElement('div');
    item.className = 'game-item';
    let diffHtml = '<div class="difficulty-row">';
    ['easy','medium','hard'].forEach(d => {
      const dConf = game.diff[d];
      const unlocked = isDifficultyUnlocked(game.id, d);
      const hs = getHighScore(game.id, d);
      const lockedClass = unlocked ? '' : ' diff-locked';
      diffHtml += `
        <div class="diff-btn${lockedClass}" data-game="${game.id}" data-diff="${d}">
          <div class="diff-label" style="color:${unlocked ? mod.color : 'var(--text-dim)'}">${dConf.label}</div>
          <div class="diff-info">${unlocked ? '最高分 ' + hs : '🔒 ' + dConf.unlockDesc}</div>
        </div>
      `;
    });
    diffHtml += '</div>';

    item.innerHTML = `
      <div class="game-item-header">
        <div class="game-item-icon" style="background:${mod.color}22;color:${mod.color};">${mod.num}</div>
        <div>
          <div class="game-item-title">${game.name}</div>
          <div class="game-item-desc">${game.desc}</div>
        </div>
      </div>
      ${diffHtml}
    `;

    // 绑定难度点击
    item.querySelectorAll('.diff-btn:not(.diff-locked)').forEach(btn => {
      btn.addEventListener('click', () => {
        const gameId = btn.dataset.game;
        const diff = btn.dataset.diff;
        startGame(gameId, diff);
      });
    });

    list.appendChild(item);
  });
}

// ==================== 游戏启动 ====================

function startGame(gameId, difficulty) {
  currentGame = gameId;
  currentDifficulty = difficulty;
  // 清理上一个游戏
  if (currentGameCleanup) { currentGameCleanup(); currentGameCleanup = null; }
  // 找到游戏配置
  let mod = null, game = null;
  for (const m of MODULES) {
    for (const g of m.games) {
      if (g.id === gameId) { mod = m; game = g; break; }
    }
    if (mod) break;
  }
  if (!mod || !game) return;

  const dConf = game.diff[difficulty];
  document.getElementById('gameTitle').textContent = game.name;
  document.getElementById('gameTitle').style.color = mod.color;
  document.getElementById('gameSubtitle').textContent = dConf.label + ' 难度';
  document.getElementById('gameStats').innerHTML = '';
  document.getElementById('gameArea').innerHTML = '';
  document.getElementById('gameControls').innerHTML = '';

  // 返回按钮
  document.getElementById('gameBackBtn').onclick = () => {
    if (currentGameCleanup) { currentGameCleanup(); currentGameCleanup = null; }
    showPage('pageGameSelect');
  };

  showPage('pageGame');

  // 启动对应游戏
  switch(gameId) {
    case 'memory_card': startMemoryGame(mod, game, dConf); break;
    case 'calc_speed':  startCalcGame(mod, game, dConf); break;
    case 'color_match': startColorGame(mod, game, dConf); break;
    case 'schulte':     startSchulteGame(mod, game, dConf); break;
    case 'sudoku':      startSudokuGame(mod, game, dConf); break;
  }
}

function restartCurrentGame() {
  startGame(currentGame, currentDifficulty);
}

// ==================== 评分与结算 ====================

function getGrade(score) {
  if (score >= 90) return { grade: 'S', color: '#ffb800' };
  if (score >= 80) return { grade: 'A', color: '#00ffa3' };
  if (score >= 60) return { grade: 'B', color: '#00e5ff' };
  if (score >= 40) return { grade: 'C', color: '#a855f7' };
  return { grade: 'D', color: '#ff2e7e' };
}

function showResult(score, details) {
  const g = getGrade(score);
  document.getElementById('resultGrade').textContent = g.grade;
  document.getElementById('resultGrade').style.color = g.color;
  document.getElementById('resultScore').textContent = score;
  document.getElementById('resultScore').style.color = g.color;

  let detailHtml = '';
  details.forEach(d => {
    detailHtml += `<div>${d.label}<span>${d.value}</span></div>`;
  });
  document.getElementById('resultDetails').innerHTML = detailHtml;

  // 保存最高分
  const isNewBest = setHighScore(currentGame, currentDifficulty, score);
  const hs = getHighScore(currentGame, currentDifficulty);
  document.getElementById('resultBest').textContent = isNewBest ? '🎉 新纪录！' : '历史最高: ' + hs;

  document.getElementById('resultOverlay').classList.add('active');
}

function closeResult() {
  document.getElementById('resultOverlay').classList.remove('active');
}

// ==================== 游戏倒计时 ====================

function doCountdown(callback) {
  const overlay = document.getElementById('countdownOverlay');
  const numEl = document.getElementById('countdownNum');
  overlay.classList.add('active');
  let count = 3;
  numEl.textContent = count;
  numEl.style.animation = 'none';
  void numEl.offsetWidth;
  numEl.style.animation = '';

  const timer = setInterval(() => {
    count--;
    if (count > 0) {
      numEl.textContent = count;
      numEl.style.animation = 'none';
      void numEl.offsetWidth;
      numEl.style.animation = '';
    } else {
      numEl.textContent = 'GO!';
      numEl.style.color = '#00ffa3';
      numEl.style.animation = 'none';
      void numEl.offsetWidth;
      numEl.style.animation = '';
      setTimeout(() => {
        overlay.classList.remove('active');
        numEl.style.color = 'var(--cyan)';
        callback();
      }, 500);
      clearInterval(timer);
    }
  }, 800);
}

function startMemoryGame(mod, game, dConf) {
  const { cols, rows, pairs } = dConf;
  // 生成配对
  const symbols = [];
  for (let i = 0; i < pairs; i++) symbols.push(i, i);

  // 洗牌
  for (let i = symbols.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [symbols[i], symbols[j]] = [symbols[j], symbols[i]];
  }

  // 分配颜色
  const cardColors = [
    '#00e5ff','#a855f7','#00ffa3','#ff2e7e','#ffb800',
    '#4488ff','#ff8844','#44ff88','#ff44aa','#44ffff'
  ];

  let flipped = [];
  let matched = 0;
  let flips = 0;
  let startTime = 0;
  let gameActive = false;
  let lockBoard = false;

  // 渲染统计
  const statsEl = document.getElementById('gameStats');
  statsEl.innerHTML = `
    <div class="stat"><span>翻转</span> <span class="stat-value" id="memFlips">0</span></div>
    <div class="stat"><span>配对</span> <span class="stat-value" id="memMatched">0/${pairs}</span></div>
    <div class="stat"><span>时间</span> <span class="stat-value" id="memTime">0s</span></div>
  `;

  // 渲染网格
  const area = document.getElementById('gameArea');
  const grid = document.createElement('div');
  grid.className = 'memory-grid';
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.style.gap = '10px';

  symbols.forEach((sym, idx) => {
    const card = document.createElement('div');
    card.className = 'memory-card';
    card.dataset.index = idx;
    card.dataset.symbol = sym;
    const color = cardColors[sym % cardColors.length];
    card.innerHTML = `
      <div class="memory-card-inner">
        <div class="memory-card-front"></div>
        <div class="memory-card-back" style="border-color:${color};color:${color};background:${color}15">${MEMORY_SYMBOLS[sym]}</div>
      </div>
    `;
    card.addEventListener('click', () => onCardClick(card));
    grid.appendChild(card);
  });
  area.appendChild(grid);

  function onCardClick(card) {
    if (!gameActive || lockBoard) return;
    if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

    card.classList.add('flipped');
    flipped.push(card);
    flips++;
    document.getElementById('memFlips').textContent = flips;

    if (flipped.length === 2) {
      lockBoard = true;
      const [a, b] = flipped;
      if (a.dataset.symbol === b.dataset.symbol) {
        a.classList.add('matched');
        b.classList.add('matched');
        matched++;
        document.getElementById('memMatched').textContent = matched + '/' + pairs;
        flipped = [];
        lockBoard = false;
        if (matched === pairs) {
          gameActive = false;
          clearInterval(timerInterval);
          endMemoryGame();
        }
      } else {
        setTimeout(() => {
          a.classList.remove('flipped');
          b.classList.remove('flipped');
          flipped = [];
          lockBoard = false;
        }, 700);
      }
    }
  }

  // 计时器
  let timerInterval;
  startTime = Date.now();
  gameActive = true;
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById('memTime').textContent = elapsed + 's';
  }, 200);

  function endMemoryGame() {
    const elapsed = (Date.now() - startTime) / 1000;
    // 评分：基于翻转次数和时间
    const perfectFlips = pairs; // 最优翻转次数
    const flipRatio = perfectFlips / flips; // 越接近1越好
    const timeScore = Math.max(0, 100 - elapsed * 0.8); // 时间惩罚
    const score = Math.round(Math.min(100, (flipRatio * 60 + timeScore * 0.4)));

    showResult(score, [
      { label: '翻转次数', value: flips },
      { label: '用时', value: elapsed.toFixed(1) + 's' },
      { label: '配对数', value: pairs }
    ]);
  }

  // 清理
  currentGameCleanup = () => {
    gameActive = false;
    clearInterval(timerInterval);
  };
}

//                        游戏2：快速心算
// ======================================================================

function startCalcGame(mod, game, dConf) {
  const difficulty = currentDifficulty;
  let correct = 0, wrong = 0, total = 0;
  let timeLeft = 60;
  let gameActive = false;
  let currentAnswer = 0;
  let questionStartTime = 0;

  // 统计
  const statsEl = document.getElementById('gameStats');
  statsEl.innerHTML = `
    <div class="stat"><span>正确</span> <span class="stat-value" id="calcCorrect" style="color:#00ffa3">0</span></div>
    <div class="stat"><span>错误</span> <span class="stat-value" id="calcWrong" style="color:#ff2e7e">0</span></div>
    <div class="stat"><span>剩余</span> <span class="stat-value" id="calcTime" style="color:#ffb800">60s</span></div>
  `;

  // 区域
  const area = document.getElementById('gameArea');
  area.innerHTML = `
    <div class="calc-container">
      <div class="calc-question" id="calcQuestion"></div>
      <div class="calc-input-wrap">
        <input type="number" class="calc-input" id="calcInput" placeholder="?" autocomplete="off">
        <button class="btn btn-primary" id="calcSubmit">确认</button>
      </div>
      <div class="calc-feedback" id="calcFeedback"></div>
      <div class="calc-progress"><div class="calc-progress-fill" id="calcProgressFill" style="width:100%"></div></div>
    </div>
  `;

  const qEl = document.getElementById('calcQuestion');
  const inputEl = document.getElementById('calcInput');
  const submitBtn = document.getElementById('calcSubmit');
  const feedbackEl = document.getElementById('calcFeedback');
  const progressFill = document.getElementById('calcProgressFill');

  // 生成题目
  function generateQuestion() {
    let a, b, op, answer;
    if (difficulty === 'easy') {
      // 个位数加减
      a = Math.floor(Math.random() * 9) + 1;
      b = Math.floor(Math.random() * 9) + 1;
      if (Math.random() < 0.5) {
        op = '+'; answer = a + b;
      } else {
        if (a < b) [a, b] = [b, a]; // 保证非负
        op = '-'; answer = a - b;
      }
    } else if (difficulty === 'medium') {
      const type = Math.random();
      if (type < 0.4) {
        // 两位数加减
        a = Math.floor(Math.random() * 90) + 10;
        b = Math.floor(Math.random() * 90) + 10;
        if (Math.random() < 0.5) {
          op = '+'; answer = a + b;
        } else {
          if (a < b) [a, b] = [b, a];
          op = '-'; answer = a - b;
        }
      } else {
        // 个位乘法
        a = Math.floor(Math.random() * 9) + 2;
        b = Math.floor(Math.random() * 9) + 2;
        op = '×'; answer = a * b;
      }
    } else {
      // 困难：两位数乘除+混合
      const type = Math.random();
      if (type < 0.3) {
        a = Math.floor(Math.random() * 12) + 2;
        b = Math.floor(Math.random() * 12) + 2;
        op = '×'; answer = a * b;
      } else if (type < 0.6) {
        // 除法（保证整除）
        b = Math.floor(Math.random() * 12) + 2;
        answer = Math.floor(Math.random() * 12) + 2;
        a = b * answer;
        op = '÷';
      } else {
        // 两位数加减
        a = Math.floor(Math.random() * 90) + 10;
        b = Math.floor(Math.random() * 90) + 10;
        if (Math.random() < 0.5) {
          op = '+'; answer = a + b;
        } else {
          if (a < b) [a, b] = [b, a];
          op = '-'; answer = a - b;
        }
      }
    }
    currentAnswer = answer;
    qEl.textContent = `${a} ${op} ${b} = ?`;
    questionStartTime = Date.now();
  }

  function submitAnswer() {
    if (!gameActive) return;
    const val = parseInt(inputEl.value);
    if (isNaN(val)) return;

    total++;
    if (val === currentAnswer) {
      correct++;
      feedbackEl.textContent = '✓ 正确！';
      feedbackEl.style.color = '#00ffa3';
    } else {
      wrong++;
      feedbackEl.textContent = '✗ 错误！答案: ' + currentAnswer;
      feedbackEl.style.color = '#ff2e7e';
    }
    document.getElementById('calcCorrect').textContent = correct;
    document.getElementById('calcWrong').textContent = wrong;
    inputEl.value = '';
    inputEl.focus();
    generateQuestion();
  }

  submitBtn.addEventListener('click', submitAnswer);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') submitAnswer();
  });

  // 倒计时
  let timerInterval;
  function startTimer() {
    gameActive = true;
    generateQuestion();
    inputEl.focus();
    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('calcTime').textContent = timeLeft + 's';
      progressFill.style.width = (timeLeft / 60 * 100) + '%';
      if (timeLeft <= 10) {
        progressFill.style.background = '#ff2e7e';
      }
      if (timeLeft <= 0) {
        endCalcGame();
      }
    }, 1000);
  }

  function endCalcGame() {
    gameActive = false;
    clearInterval(timerInterval);
    // 评分：正确率60% + 速度40%
    const accuracy = total > 0 ? correct / total : 0;
    const score = Math.round(Math.min(100, accuracy * 60 + (correct * 3)));
    showResult(score, [
      { label: '正确数', value: correct },
      { label: '错误数', value: wrong },
      { label: '正确率', value: (accuracy * 100).toFixed(1) + '%' }
    ]);
  }

  doCountdown(startTimer);

  currentGameCleanup = () => {
    gameActive = false;
    clearInterval(timerInterval);
  };
}

//                        游戏3：变色彩
// ======================================================================

function startColorGame(mod, game, dConf) {
  const { colors: numColors, interval: changeInterval } = dConf;
  let score = 0;
  let timeLeft = 30;
  let gameActive = false;
  let targetColorIdx = 0;
  let currentColorIdx = 0;
  let missCount = 0;
  let colorTimer = null;
  let countdownTimer = null;
  let cycleTimer = null;
  let cycleCount = 0;

  const activeColors = COLOR_PALETTE.slice(0, numColors);

  // 统计
  const statsEl = document.getElementById('gameStats');
  statsEl.innerHTML = `
    <div class="stat"><span>得分</span> <span class="stat-value" id="colorScore" style="color:#ff2e7e">0</span></div>
    <div class="stat"><span>剩余</span> <span class="stat-value" id="colorTime" style="color:#ff2e7e">30s</span></div>
  `;

  // 区域
  const area = document.getElementById('gameArea');
  area.innerHTML = `
    <div class="color-game-container" style="position:relative;">
      <div class="color-target" id="colorTarget"></div>
      <div class="color-block-wrap">
        <div class="color-block" id="colorBlock"></div>
      </div>
      <div class="color-timer-bar"><div class="color-timer-fill" id="colorTimerFill" style="width:100%"></div></div>
    </div>
  `;

  const targetEl = document.getElementById('colorTarget');
  const blockEl = document.getElementById('colorBlock');
  const timerFill = document.getElementById('colorTimerFill');

  function pickNewTarget() {
    let newIdx;
    do {
      newIdx = Math.floor(Math.random() * numColors);
    } while (newIdx === targetColorIdx && numColors > 1);
    targetColorIdx = newIdx;
    targetEl.innerHTML = `点击 <span style="color:${activeColors[targetColorIdx].hex};font-weight:900">${activeColors[targetColorIdx].name}</span>`;
  }

  function changeBlockColor() {
    let newIdx;
    do {
      newIdx = Math.floor(Math.random() * numColors);
    } while (newIdx === currentColorIdx && numColors > 1);
    currentColorIdx = newIdx;
    blockEl.style.background = activeColors[currentColorIdx].hex;

    cycleCount++;
    // 如果显示的不是目标色，一定次数后算漏掉
    if (currentColorIdx === targetColorIdx) {
      // 正确颜色出现了
    } else {
      // 每几次非目标色变化算一次miss
      if (cycleCount % Math.max(2, Math.floor(numColors / 2)) === 0) {
        missCount++;
      }
    }
  }

  function onBlockClick() {
    if (!gameActive) return;
    if (currentColorIdx === targetColorIdx) {
      // 正确
      score += 10;
      document.getElementById('colorScore').textContent = score;
      showFlash('+10', '#00ffa3');
      pickNewTarget();
      // 立即换颜色
      changeBlockColor();
    } else {
      // 错误
      score = Math.max(0, score - 5);
      document.getElementById('colorScore').textContent = score;
      showFlash('-5', '#ff2e7e');
    }
  }

  function showFlash(text, color) {
    const flash = document.createElement('div');
    flash.className = 'color-score-flash';
    flash.textContent = text;
    flash.style.color = color;
    flash.style.top = '50%';
    flash.style.left = '50%';
    flash.style.transform = 'translate(-50%, -50%)';
    area.querySelector('.color-game-container').appendChild(flash);
    setTimeout(() => flash.remove(), 800);
  }

  blockEl.addEventListener('click', onBlockClick);

  function startColorGameLogic() {
    gameActive = true;
    pickNewTarget();
    changeBlockColor();
    colorTimer = setInterval(changeBlockColor, changeInterval);

    countdownTimer = setInterval(() => {
      timeLeft--;
      document.getElementById('colorTime').textContent = timeLeft + 's';
      timerFill.style.width = (timeLeft / 30 * 100) + '%';
      if (timeLeft <= 0) endColorGame();
    }, 1000);
  }

  function endColorGame() {
    gameActive = false;
    clearInterval(colorTimer);
    clearInterval(countdownTimer);
    // 评分
    const maxScore = 30 / (changeInterval / 1000) * 10; // 理论最高分（粗略）
    const scoreRatio = Math.min(score / 100, 1);
    const finalScore = Math.round(Math.min(100, score * 1.2));
    showResult(finalScore, [
      { label: '得分', value: score },
      { label: '漏掉次数', value: missCount },
      { label: '颜色数', value: numColors }
    ]);
  }

  doCountdown(startColorGameLogic);

  currentGameCleanup = () => {
    gameActive = false;
    clearInterval(colorTimer);
    clearInterval(countdownTimer);
  };
}

// ======================================================================
//                        游戏4：苏尔特方格
// ======================================================================

function startSchulteGame(mod, game, dConf) {
  const size = dConf.size;
  const total = size * size;
  let nextNum = 1;
  let errors = 0;
  let startTime = 0;
  let gameActive = false;
  let timerInterval = null;

  // 生成数字并洗牌
  const numbers = [];
  for (let i = 1; i <= total; i++) numbers.push(i);
  for (let i = numbers.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
  }

  // 统计
  const statsEl = document.getElementById('gameStats');
  statsEl.innerHTML = `
    <div class="stat"><span>下一个</span> <span class="stat-value" id="schulteNext" style="color:#00ffa3">1</span></div>
    <div class="stat"><span>错误</span> <span class="stat-value" id="schulteErrors" style="color:#ff2e7e">0</span></div>
    <div class="stat"><span>用时</span> <span class="stat-value" id="schulteTime" style="color:#00e5ff">0s</span></div>
  `;

  // 区域
  const area = document.getElementById('gameArea');
  const grid = document.createElement('div');
  grid.className = 'schulte-grid';
  grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;

  numbers.forEach(num => {
    const cell = document.createElement('div');
    cell.className = 'schulte-cell';
    cell.textContent = num;
    cell.dataset.num = num;
    cell.addEventListener('click', () => onCellClick(cell));
    grid.appendChild(cell);
  });
  area.appendChild(grid);

  function onCellClick(cell) {
    if (!gameActive) return;
    if (cell.classList.contains('correct')) return;
    const num = parseInt(cell.dataset.num);
    if (num === nextNum) {
      cell.classList.add('correct');
      nextNum++;
      document.getElementById('schulteNext').textContent = nextNum <= total ? nextNum : '-';
      if (nextNum > total) {
        endSchulteGame();
      }
    } else {
      errors++;
      document.getElementById('schulteErrors').textContent = errors;
      cell.classList.add('wrong');
      setTimeout(() => cell.classList.remove('wrong'), 400);
    }
  }

  function startSchulte() {
    gameActive = true;
    startTime = Date.now();
    timerInterval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      document.getElementById('schulteTime').textContent = elapsed + 's';
    }, 200);
  }

  function endSchulteGame() {
    gameActive = false;
    clearInterval(timerInterval);
    const elapsed = (Date.now() - startTime) / 1000;
    // 评分：基于时间和错误
    const perfectTime = total * 1.2; // 理想时间
    const timeRatio = Math.max(0, 1 - elapsed / (perfectTime * 3));
    const errorPenalty = errors * 5;
    const score = Math.round(Math.min(100, Math.max(0, timeRatio * 100 - errorPenalty)));
    showResult(score, [
      { label: '用时', value: elapsed.toFixed(1) + 's' },
      { label: '错误次数', value: errors },
      { label: '网格大小', value: size + '×' + size }
    ]);
  }

  doCountdown(startSchulte);

  currentGameCleanup = () => {
    gameActive = false;
    clearInterval(timerInterval);
  };
}

// ======================================================================
//                        游戏5：4x4数独
// ======================================================================

function startSudokuGame(mod, game, dConf) {
  const givensCount = dConf.givens;
  const size = 4;
  let solution = [];
  let puzzle = [];
  let userGrid = [];
  let selectedCell = null;
  let errors = 0;
  let startTime = 0;
  let gameActive = false;
  let timerInterval = null;
  let hintsUsed = 0;

  // 统计
  const statsEl = document.getElementById('gameStats');
  statsEl.innerHTML = `
    <div class="stat"><span>错误</span> <span class="stat-value" id="sudokuErrors" style="color:#ff2e7e">0</span></div>
    <div class="stat"><span>用时</span> <span class="stat-value" id="sudokuTime" style="color:#a855f7">0s</span></div>
  `;

  // 生成数独解
  function generateSolution() {
    // 使用回溯法生成4x4数独
    const grid = Array.from({length: 4}, () => Array(4).fill(0));
    solveSudoku(grid);
    return grid;
  }

  function isValid(grid, row, col, num) {
    // 检查行
    for (let c = 0; c < 4; c++) {
      if (grid[row][c] === num) return false;
    }
    // 检查列
    for (let r = 0; r < 4; r++) {
      if (grid[r][col] === num) return false;
    }
    // 检查2x2宫
    const boxR = Math.floor(row / 2) * 2;
    const boxC = Math.floor(col / 2) * 2;
    for (let r = boxR; r < boxR + 2; r++) {
      for (let c = boxC; c < boxC + 2; c++) {
        if (grid[r][c] === num) return false;
      }
    }
    return true;
  }

  function solveSudoku(grid) {
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        if (grid[r][c] === 0) {
          const nums = shuffle([1, 2, 3, 4]);
          for (const num of nums) {
            if (isValid(grid, r, c, num)) {
              grid[r][c] = num;
              if (solveSudoku(grid)) return true;
              grid[r][c] = 0;
            }
          }
          return false;
        }
      }
    }
    return true;
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // 生成谜题（从解中挖洞）
  function generatePuzzle(sol, givens) {
    const puzzle = sol.map(r => [...r]);
    const positions = [];
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        positions.push([r, c]);
      }
    }
    const shuffled = shuffle(positions);
    const toRemove = 16 - givens;
    for (let i = 0; i < toRemove; i++) {
      const [r, c] = shuffled[i];
      puzzle[r][c] = 0;
    }
    return puzzle;
  }

  // 初始化
  solution = generateSolution();
  puzzle = generatePuzzle(solution, givensCount);
  userGrid = puzzle.map(r => [...r]);

  // 渲染
  const area = document.getElementById('gameArea');
  const container = document.createElement('div');
  container.className = 'sudoku-container';

  const grid = document.createElement('div');
  grid.className = 'sudoku-grid';

  const cells = [];
  for (let r = 0; r < 4; r++) {
    cells[r] = [];
    for (let c = 0; c < 4; c++) {
      const cell = document.createElement('div');
      cell.className = 'sudoku-cell';
      cell.dataset.row = r;
      cell.dataset.col = c;
      if (puzzle[r][c] !== 0) {
        cell.classList.add('given');
        cell.textContent = puzzle[r][c];
      } else {
        cell.classList.add('empty');
      }
      cell.addEventListener('click', () => onCellClick(r, c));
      grid.appendChild(cell);
      cells[r][c] = cell;
    }
  }

  container.appendChild(grid);

  // 数字键盘
  const numpad = document.createElement('div');
  numpad.className = 'sudoku-numpad';
  for (let n = 1; n <= 4; n++) {
    const btn = document.createElement('div');
    btn.className = 'sudoku-num';
    btn.textContent = n;
    btn.addEventListener('click', () => onNumClick(n));
    numpad.appendChild(btn);
  }
  // 擦除按钮
  const eraseBtn = document.createElement('div');
  eraseBtn.className = 'sudoku-num erase';
  eraseBtn.textContent = '擦除';
  eraseBtn.addEventListener('click', () => onNumClick(0));
  numpad.appendChild(eraseBtn);

  container.appendChild(numpad);
  area.appendChild(container);

  // 选中单元格
  function onCellClick(r, c) {
    if (!gameActive) return;
    if (puzzle[r][c] !== 0) return; // 不能修改预设数字
    // 取消之前的选中
    if (selectedCell) {
      const [pr, pc] = selectedCell;
      cells[pr][pc].classList.remove('selected');
    }
    selectedCell = [r, c];
    cells[r][c].classList.add('selected');
  }

  // 填入数字
  function onNumClick(num) {
    if (!gameActive || !selectedCell) return;
    const [r, c] = selectedCell;
    if (puzzle[r][c] !== 0) return;

    if (num === 0) {
      // 擦除
      userGrid[r][c] = 0;
      cells[r][c].textContent = '';
      cells[r][c].classList.remove('conflict');
    } else {
      userGrid[r][c] = num;
      cells[r][c].textContent = num;
      // 检查冲突
      if (num !== solution[r][c]) {
        errors++;
        document.getElementById('sudokuErrors').textContent = errors;
        cells[r][c].classList.add('conflict');
        setTimeout(() => cells[r][c].classList.remove('conflict'), 800);
      } else {
        cells[r][c].classList.remove('conflict');
      }
    }

    // 检查所有冲突并高亮
    highlightConflicts();

    // 检查是否完成
    if (checkComplete()) {
      endSudokuGame();
    }
  }

  // 高亮冲突单元格
  function highlightConflicts() {
    // 先清除所有冲突
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        if (puzzle[r][c] === 0) {
          cells[r][c].classList.remove('conflict');
        }
      }
    }
    // 检查用户填入的数字
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        if (userGrid[r][c] === 0) continue;
        const val = userGrid[r][c];
        // 检查行
        for (let cc = 0; cc < 4; cc++) {
          if (cc !== c && userGrid[r][cc] === val) {
            if (puzzle[r][cc] === 0) cells[r][cc].classList.add('conflict');
            if (puzzle[r][c] === 0) cells[r][c].classList.add('conflict');
          }
        }
        // 检查列
        for (let rr = 0; rr < 4; rr++) {
          if (rr !== r && userGrid[rr][c] === val) {
            if (puzzle[rr][c] === 0) cells[rr][c].classList.add('conflict');
            if (puzzle[r][c] === 0) cells[r][c].classList.add('conflict');
          }
        }
        // 检查2x2宫
        const boxR = Math.floor(r / 2) * 2;
        const boxC = Math.floor(c / 2) * 2;
        for (let rr = boxR; rr < boxR + 2; rr++) {
          for (let cc = boxC; cc < boxC + 2; cc++) {
            if (rr !== r || cc !== c) {
              if (userGrid[rr][cc] === val) {
                if (puzzle[rr][cc] === 0) cells[rr][cc].classList.add('conflict');
                if (puzzle[r][c] === 0) cells[r][c].classList.add('conflict');
              }
            }
          }
        }
      }
    }
  }

  // 检查是否完成
  function checkComplete() {
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        if (userGrid[r][c] !== solution[r][c]) return false;
      }
    }
    return true;
  }

  function endSudokuGame() {
    gameActive = false;
    clearInterval(timerInterval);
    const elapsed = (Date.now() - startTime) / 1000;
    // 评分：基于时间、错误和难度
    const givensRatio = givensCount / 16;
    const timeScore = Math.max(0, 100 - elapsed * 0.5);
    const errorPenalty = errors * 8;
    const diffBonus = (1 - givensRatio) * 20; // 挖洞越多越难，奖励越高
    const score = Math.round(Math.min(100, Math.max(0, timeScore - errorPenalty + diffBonus)));
    showResult(score, [
      { label: '用时', value: elapsed.toFixed(1) + 's' },
      { label: '错误次数', value: errors },
      { label: '预填数字', value: givensCount }
    ]);
  }

  // 启动
  gameActive = true;
  startTime = Date.now();
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById('sudokuTime').textContent = elapsed + 's';
  }, 200);

  currentGameCleanup = () => {
    gameActive = false;
    clearInterval(timerInterval);
    selectedCell = null;
  };
}
