<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记忆药盒 - 子女端看板</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; background: #eef2f5; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #2c3e50; margin: 0; }
        .status-card { background: white; width: 100%; max-width: 450px; border-radius: 16px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .parent-info { display: flex; align-items: center; margin-bottom: 20px; }
        .avatar { width: 50px; height: 50px; background: #bdc3c7; border-radius: 50%; margin-right: 15px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .parent-name { font-weight: bold; font-size: 18px; }
        .parent-status { font-size: 13px; color: #27ae60; }
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 15px; }
        .pill-box { border: 2px solid #eee; border-radius: 10px; padding: 15px; text-align: center; transition: all 0.3s; }
        .taken { border-color: #2ecc71; background: #e8f8f5; }
        .waiting { border-color: #f39c12; background: #fef5e7; animation: pulse-border 1.5s infinite; }
        .missed { border-color: #e74c3c; background: #fdedec; }
        @keyframes pulse-border { 0% { box-shadow: 0 0 0 0 rgba(243, 156, 18, 0.4); } 100% { box-shadow: 0 0 0 8px rgba(243, 156, 18, 0); } }
        .time { font-size: 14px; font-weight: bold; color: #555; margin-bottom: 5px; }
        .icon { font-size: 24px; margin: 5px 0; }
        .label { font-size: 12px; color: #999; }
        .alert-box { width: 100%; max-width: 450px; background: #fdedec; border-left: 4px solid #e74c3c; padding: 15px; border-radius: 8px; color: #c0392b; font-size: 14px; display: flex; align-items: center; }
    </style>
</head>
<body>
    <div class="header">
        <h1>💊 记忆药盒 - 远程看护</h1>
    </div>

    <div class="status-card">
        <div class="parent-info">
            <div class="avatar">👴</div>
            <div>
                <div class="parent-name">王大爷 (父亲)</div>
                <div class="parent-status">🟢 药盒在线 · 电量 85%</div>
            </div>
        </div>

        <div class="grid-container">
            <div class="pill-box taken">
                <div class="time">08:00</div>
                <div class="icon">✅</div>
                <div class="label">已服用 (08:05)</div>
            </div>
            <div class="pill-box waiting">
                <div class="time">12:30</div>
                <div class="icon">⏳</div>
                <div class="label">等待服用</div>
            </div>
            <div class="pill-box">
                <div class="time">19:00</div>
                <div class="icon">💊</div>
                <div class="label">未到时间</div>
            </div>
        </div>
    </div>

    <div class="alert-box">
        ⚠️ <strong>异常提醒：</strong>昨日 19:00 时段的降压药似乎漏服了（重量未变化），建议电话确认。
    </div>
</body>
</html>
