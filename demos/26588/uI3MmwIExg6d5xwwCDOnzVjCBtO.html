<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小白搭站</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            background: #1a1a2e;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ===== 顶栏 ===== */
        .toolbar {
            background: #16213e;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            border-bottom: 2px solid #0f3460;
            flex-wrap: wrap;
        }
        .toolbar h1 {
            color: #e94560;
            font-size: 18px;
            font-weight: 700;
            margin-right: 12px;
        }
        .toolbar .hint {
            color: #aaa;
            font-size: 12px;
            flex: 1;
            min-width: 120px;
        }
        .toolbar button {
            background: #e94560;
            border: none;
            color: #fff;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
            white-space: nowrap;
        }
        .toolbar button:hover {
            background: #c73652;
            transform: scale(1.03);
        }
        .toolbar button.secondary {
            background: #0f3460;
        }
        .toolbar button.secondary:hover {
            background: #1a4a7a;
        }
        .toolbar button.success {
            background: #2ecc71;
        }
        .toolbar button.success:hover {
            background: #27ae60;
        }
        .toolbar button.warning {
            background: #f39c12;
        }
        .toolbar button.warning:hover {
            background: #e67e22;
        }

        /* ===== 主体三栏布局 ===== */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ===== 左侧组件库 ===== */
        .sidebar {
            width: 160px;
            background: #16213e;
            padding: 12px 10px;
            flex-shrink: 0;
            border-right: 2px solid #0f3460;
            overflow-y: auto;
        }
        .sidebar h3 {
            color: #eee;
            font-size: 12px;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 2px;
            opacity: 0.7;
        }
        .component-item {
            background: #0f3460;
            color: #eee;
            padding: 10px 8px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: grab;
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            transition: 0.2s;
            border: 2px solid transparent;
        }
        .component-item:hover {
            background: #1a4a7a;
            border-color: #e94560;
            transform: translateX(4px);
        }
        .component-item:active {
            cursor: grabbing;
            opacity: 0.6;
        }
        .component-item .icon {
            font-size: 20px;
            display: block;
            margin-bottom: 2px;
        }

        /* ===== 中间画布 ===== */
        .canvas-wrap {
            flex: 1;
            position: relative;
            background: #0d0d1a;
            overflow: auto;
            padding: 15px;
        }
        #canvas {
            position: relative;
            width: 100%;
            min-height: 100%;
            background: #1a1a2e;
            border-radius: 12px;
            border: 2px dashed #2a2a4a;
            min-height: 600px;
            transition: 0.1s;
        }
        #canvas.drag-over {
            border-color: #e94560;
            background: #1f1f3a;
        }

        /* ===== 画布上的节点 ===== */
        .node {
            position: absolute;
            padding: 14px 16px;
            background: linear-gradient(145deg, #2a2a4a, #1a1a2e);
            border: 2px solid #3a3a5a;
            border-radius: 10px;
            color: #eee;
            cursor: move;
            min-width: 100px;
            text-align: center;
            font-size: 13px;
            transition: box-shadow 0.2s, border-color 0.2s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            z-index: 2;
        }
        .node:hover {
            border-color: #e94560;
            box-shadow: 0 4px 30px rgba(233, 69, 96, 0.2);
        }
        .node.selected {
            border-color: #f1c40f;
            box-shadow: 0 0 0 3px rgba(241, 196, 15, 0.3);
        }
        .node .node-label {
            font-weight: 600;
            font-size: 12px;
        }
        .node .node-preview {
            font-size: 24px;
            display: block;
            margin-bottom: 2px;
        }
        .node .node-type-badge {
            font-size: 9px;
            opacity: 0.5;
            margin-top: 4px;
            background: #0d0d1a;
            padding: 2px 8px;
            border-radius: 10px;
            display: inline-block;
        }
        .node .delete-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #e94560;
            border: none;
            color: #fff;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 11px;
            line-height: 20px;
            text-align: center;
            display: none;
            z-index: 10;
        }
        .node:hover .delete-btn {
            display: block;
        }

        /* ===== SVG 连线层 ===== */
        #lines-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        #lines-svg .line-group {
            pointer-events: all;
            cursor: pointer;
        }
        #lines-svg .line-group:hover line {
            stroke-width: 5;
            opacity: 0.8;
        }
        #lines-svg .line-group:hover .line-label {
            opacity: 1;
            font-size: 11px;
        }
        #lines-svg .line-label {
            pointer-events: none;
            fill: #aaa;
            font-size: 9px;
            font-weight: 300;
            opacity: 0.7;
            transition: 0.2s;
        }
        #lines-svg .line-delete {
            pointer-events: all;
            cursor: pointer;
            fill: #e94560;
            font-size: 14px;
            opacity: 0;
            transition: 0.2s;
        }
        #lines-svg .line-group:hover .line-delete {
            opacity: 1;
        }
        /* ===== 箭头样式 ===== */
        #lines-svg .arrow-head {
            fill: #e94560;
        }

        /* ===== 右侧面板 ===== */
        .panel {
            width: 280px;
            background: #16213e;
            padding: 14px;
            flex-shrink: 0;
            border-left: 2px solid #0f3460;
            overflow-y: auto;
        }
        .panel h3 {
            color: #eee;
            font-size: 13px;
            margin-bottom: 14px;
            border-bottom: 1px solid #0f3460;
            padding-bottom: 8px;
            text-align: center;
        }
        .panel .empty {
            color: #666;
            text-align: center;
            font-size: 12px;
            padding: 30px 0;
            line-height: 1.8;
        }
        .panel .prop-group {
            margin-bottom: 12px;
        }
        .panel label {
            display: block;
            color: #aaa;
            font-size: 11px;
            margin-bottom: 3px;
            font-weight: 500;
        }
        .panel input,
        .panel select,
        .panel textarea {
            width: 100%;
            padding: 6px 10px;
            background: #0d0d1a;
            border: 1px solid #2a2a4a;
            border-radius: 6px;
            color: #eee;
            font-size: 12px;
            transition: 0.2s;
            font-family: inherit;
        }
        .panel input:focus,
        .panel select:focus,
        .panel textarea:focus {
            outline: none;
            border-color: #e94560;
        }
        .panel input[type="color"] {
            height: 36px;
            padding: 2px;
            cursor: pointer;
        }
        .panel textarea {
            resize: vertical;
            min-height: 40px;
        }
        .panel .prop-row {
            display: flex;
            gap: 6px;
        }
        .panel .prop-row>* {
            flex: 1;
        }
        .panel .delete-node-btn {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            background: #e94560;
            border: none;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            font-size: 12px;
        }
        .panel .delete-node-btn:hover {
            background: #c73652;
        }
        .panel .section-title {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 16px 0 8px;
            border-top: 1px solid #0f3460;
            padding-top: 12px;
        }

        /* ===== 连线类型选择器 ===== */
        .line-type-selector {
            display: flex;
            gap: 6px;
            margin: 8px 0;
        }
        .line-type-selector button {
            flex: 1;
            padding: 5px 8px;
            border: 2px solid #2a2a4a;
            background: transparent;
            color: #aaa;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: 0.2s;
        }
        .line-type-selector button.active {
            border-color: #e94560;
            color: #fff;
            background: #0f3460;
        }
        .line-type-selector button:hover {
            border-color: #e94560;
        }

        /* ===== 预览弹窗 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: #1a1a2e;
            border-radius: 16px;
            width: 92%;
            max-width: 1200px;
            height: 88vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid #2a2a4a;
        }
        .modal-header {
            padding: 14px 22px;
            background: #16213e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0f3460;
            flex-shrink: 0;
        }
        .modal-header h2 {
            color: #eee;
            font-size: 16px;
        }
        .modal-header .modal-actions {
            display: flex;
            gap: 10px;
        }
        .modal-header button {
            background: #e94560;
            border: none;
            color: #fff;
            padding: 5px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .modal-header button.secondary {
            background: #0f3460;
        }
        .modal-body {
            flex: 1;
            overflow: auto;
            padding: 16px;
            background: #fff;
        }
        .modal-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
            border-radius: 4px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 900px) {
            .sidebar {
                width: 110px;
                padding: 8px 6px;
            }
            .component-item {
                padding: 6px 4px;
                font-size: 10px;
            }
            .component-item .icon {
                font-size: 16px;
            }
            .panel {
                width: 220px;
                padding: 10px;
            }
        }
        @media (max-width: 700px) {
            .main {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: 65px;
                flex-direction: row;
                display: flex;
                gap: 4px;
                padding: 6px 10px;
                overflow-x: auto;
                border-right: none;
                border-bottom: 2px solid #0f3460;
            }
            .sidebar h3 {
                display: none;
            }
            .component-item {
                flex-shrink: 0;
                margin-bottom: 0;
                padding: 4px 10px;
                font-size: 10px;
            }
            .component-item .icon {
                font-size: 14px;
                display: inline;
                margin-right: 4px;
            }
            .panel {
                width: 100%;
                height: 180px;
                border-left: none;
                border-top: 2px solid #0f3460;
            }
            .canvas-wrap {
                padding: 8px;
            }
            .toolbar h1 {
                font-size: 14px;
                margin-right: 6px;
            }
            .toolbar .hint {
                font-size: 10px;
                min-width: auto;
            }
            .toolbar button {
                padding: 4px 10px;
                font-size: 11px;
            }
        }

        /* ===== 滚动条美化 ===== */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0d0d1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a4a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a5a;
        }

        /* ===== Toast ===== */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #16213e;
            color: #eee;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 13px;
            z-index: 9999;
            border: 1px solid #2a2a4a;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        #toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- ===== 顶部工具栏 ===== -->
    <div class="toolbar">
        <h1>🚀 网页设计器 Pro</h1>
        <span class="hint">💡 拖拽组件 | Shift+点击连线 | 右键删除</span>
        <button class="warning" onclick="autoLayout()">📐 自动布局</button>
        <button class="success" onclick="preview()">👁 预览</button>
        <button onclick="exportHTML()">📦 导出代码</button>
        <button class="secondary" onclick="clearAll()">🗑 清空</button>
    </div>

    <!-- ===== 主体 ===== -->
    <div class="main">
        <!-- 左侧组件库 -->
        <div class="sidebar">
            <h3>📦 组件</h3>
            <div class="component-item" draggable="true" data-type="navbar"><span class="icon">📋</span>导航栏</div>
            <div class="component-item" draggable="true" data-type="hero"><span class="icon">🖼</span>Hero区</div>
            <div class="component-item" draggable="true" data-type="card"><span class="icon">📇</span>卡片</div>
            <div class="component-item" draggable="true" data-type="card-group"><span class="icon">📚</span>卡片组</div>
            <div class="component-item" draggable="true" data-type="button"><span class="icon">🔘</span>按钮</div>
            <div class="component-item" draggable="true" data-type="text"><span class="icon">📝</span>文本</div>
            <div class="component-item" draggable="true" data-type="footer"><span class="icon">📌</span>页脚</div>
            <div class="component-item" draggable="true" data-type="form"><span class="icon">📮</span>表单</div>
            <div class="component-item" draggable="true" data-type="image"><span class="icon">🖼️</span>图片</div>
        </div>

        <!-- 中间画布 -->
        <div class="canvas-wrap">
            <div id="canvas">
                <svg id="lines-svg"></svg>
                <!-- 节点由 JS 动态渲染 -->
            </div>
        </div>

        <!-- 右侧属性面板 -->
        <div class="panel" id="panel">
            <h3>⚙️ 属性编辑</h3>
            <div class="empty" id="panel-empty">
                🎯 点击节点编辑属性<br>
                🔗 Shift+点击连线<br>
                🗑 右键删除连线
            </div>
            <div id="panel-content" style="display:none;"></div>
        </div>
    </div>

    <!-- ===== 预览弹窗 ===== -->
    <div class="modal-overlay" id="preview-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🌐 网页预览</h2>
                <div class="modal-actions">
                    <button class="secondary" onclick="exportHTML()">📦 导出</button>
                    <button onclick="closePreview()">✕ 关闭</button>
                </div>
            </div>
            <div class="modal-body">
                <iframe id="preview-iframe"></iframe>
            </div>
        </div>
    </div>

    <!-- ===== Toast ===== -->
    <div id="toast"></div>

    <script>
        // ============================================================
        //  数据层
        // ============================================================

        let nodes = [];
        let connections = [];
        let selectedId = null;
        let pendingConnectId = null;
        let idCounter = 0;
        let lineType = 'layout';
        let nextLineId = 1;

        // ============================================================
        //  组件默认属性
        // ============================================================

        const DEFAULT_PROPS = {
            navbar: {
                label: '导航栏',
                icon: '📋',
                text: '我的品牌',
                bgColor: '#1a1a2e',
                textColor: '#ffffff',
                links: '首页 | 产品 | 关于 | 联系'
            },
            hero: {
                label: 'Hero区',
                icon: '🖼',
                title: '欢迎来到我的品牌',
                subtitle: '让世界更美好',
                bgColor: '#0f3460',
                textColor: '#ffffff',
                btnText: '了解更多',
                btnLink: '#'
            },
            card: {
                label: '卡片',
                icon: '📇',
                title: '卡片标题',
                content: '这里是卡片内容，可以写一些描述文字。',
                bgColor: '#2a2a4a',
                textColor: '#eeeeee',
                image: ''
            },
            'card-group': {
                label: '卡片组',
                icon: '📚',
                title: '产品展示',
                columns: 3,
                bgColor: 'transparent',
                gap: 20
            },
            button: {
                label: '按钮',
                icon: '🔘',
                text: '点击我',
                bgColor: '#e94560',
                textColor: '#ffffff',
                size: 'medium',
                link: '#'
            },
            text: {
                label: '文本',
                icon: '📝',
                content: '这是一段文本内容，可以随意编辑。',
                fontSize: '16',
                color: '#eeeeee',
                align: 'left'
            },
            footer: {
                label: '页脚',
                icon: '📌',
                text: '© 2026 我的品牌. All rights reserved.',
                bgColor: '#0d0d1a',
                textColor: '#888888',
                links: ''
            },
            form: {
                label: '表单',
                icon: '📮',
                title: '联系我们',
                fields: '姓名, 邮箱, 留言',
                btnText: '提交',
                bgColor: '#2a2a4a',
                textColor: '#eeeeee'
            },
            image: {
                label: '图片',
                icon: '🖼️',
                src: 'https://via.placeholder.com/800x400/2a2a4a/eeeeee?text=图片',
                alt: '图片描述',
                width: '100%',
                height: 'auto',
                rounded: true
            }
        };

        // ============================================================
        //  渲染引擎
        // ============================================================

        const canvas = document.getElementById('canvas');
        const svg = document.getElementById('lines-svg');
        const panelEmpty = document.getElementById('panel-empty');
        const panelContent = document.getElementById('panel-content');

        function render() {
            renderNodes();
            renderLines();
            renderPanel();
        }

        // ----- 渲染节点 -----
        function renderNodes() {
            const oldNodes = canvas.querySelectorAll('.node');
            oldNodes.forEach(el => el.remove());

            nodes.forEach(node => {
                const div = document.createElement('div');
                div.className = 'node';
                if (selectedId === node.id) div.classList.add('selected');
                div.dataset.id = node.id;
                div.style.left = node.x + 'px';
                div.style.top = node.y + 'px';

                const props = node.props || DEFAULT_PROPS[node.type] || { label: node.type, icon: '📦' };

                div.innerHTML = `
                    <span class="node-preview">${props.icon || '📦'}</span>
                    <div class="node-label">${props.label || node.type}</div>
                    <div class="node-type-badge">${node.type}</div>
                    <button class="delete-btn" data-id="${node.id}">✕</button>
                `;

                div.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(div.dataset.id);
                    handleNodeClick(id, e);
                });

                div.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    deleteNode(parseInt(div.dataset.id));
                    showToast('🗑 已删除节点');
                });

                div.addEventListener('mousedown', (e) => {
                    if (e.target.classList.contains('delete-btn')) return;
                    startDrag(node.id, e);
                });

                div.querySelector('.delete-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteNode(parseInt(div.dataset.id));
                });

                canvas.appendChild(div);
            });
        }

        // ============================================================
        //  🔧 核心修复：渲染带箭头的连线
        // ============================================================

        function renderLines() {
            while (svg.firstChild) svg.removeChild(svg.firstChild);

            connections.forEach((conn, idx) => {
                const fromNode = nodes.find(n => n.id === conn.from);
                const toNode = nodes.find(n => n.id === conn.to);
                if (!fromNode || !toNode) return;

                const fromEl = getNodeElement(conn.from);
                const toEl = getNodeElement(conn.to);
                if (!fromEl || !toEl) return;

                const rect1 = fromEl.getBoundingClientRect();
                const rect2 = toEl.getBoundingClientRect();
                const canvasRect = canvas.getBoundingClientRect();

                // 计算起点和终点（从节点中心到节点边缘）
                const fromCenterX = rect1.left + rect1.width / 2 - canvasRect.left + canvas.scrollLeft;
                const fromCenterY = rect1.top + rect1.height / 2 - canvasRect.top + canvas.scrollTop;
                const toCenterX = rect2.left + rect2.width / 2 - canvasRect.left + canvas.scrollLeft;
                const toCenterY = rect2.top + rect2.height / 2 - canvasRect.top + canvas.scrollTop;

                // 计算方向角
                const angle = Math.atan2(toCenterY - fromCenterY, toCenterX - fromCenterX);

                // 计算节点边缘的起点和终点（让线条从节点边缘开始，到节点边缘结束）
                const fromRadiusX = rect1.width / 2 + 4;
                const fromRadiusY = rect1.height / 2 + 4;
                const toRadiusX = rect2.width / 2 + 4;
                const toRadiusY = rect2.height / 2 + 4;

                // 从节点边缘出发
                const startX = fromCenterX + Math.cos(angle) * fromRadiusX;
                const startY = fromCenterY + Math.sin(angle) * fromRadiusY;

                // 到节点边缘结束（留出箭头空间）
                const arrowOffset = 16;
                const endX = toCenterX - Math.cos(angle) * (toRadiusX + arrowOffset);
                const endY = toCenterY - Math.sin(angle) * (toRadiusY + arrowOffset);

                // 如果距离太近，直接使用中心点
                const dist = Math.sqrt(Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2));
                const finalStartX = dist < 30 ? fromCenterX : startX;
                const finalStartY = dist < 30 ? fromCenterY : startY;
                const finalEndX = dist < 30 ? toCenterX - Math.cos(angle) * 20 : endX;
                const finalEndY = dist < 30 ? toCenterY - Math.sin(angle) * 20 : endY;

                const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                group.className = 'line-group';
                group.dataset.idx = idx;

                // 根据连线类型设置样式
                let color = '#e94560';
                let dash = '8,4';
                let label = '布局';
                let arrowColor = '#e94560';
                if (conn.type === 'jump') { color = '#f39c12';
                    dash = '4,4';
                    label = '跳转';
                    arrowColor = '#f39c12'; }
                if (conn.type === 'contain') { color = '#2ecc71';
                    dash = '2,6';
                    label = '包含';
                    arrowColor = '#2ecc71'; }

                // ----- 1. 画主线 -----
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', finalStartX);
                line.setAttribute('y1', finalStartY);
                line.setAttribute('x2', finalEndX);
                line.setAttribute('y2', finalEndY);
                line.setAttribute('stroke', color);
                line.setAttribute('stroke-width', '3');
                line.setAttribute('stroke-dasharray', dash);
                line.setAttribute('stroke-linecap', 'round');
                group.appendChild(line);

                // ----- 2. 画箭头（三角形）-----
                const arrowSize = 12;
                const arrowAngle = 0.5; // 箭头张开角度

                // 箭头位置（在终点处）
                const arrowX = finalEndX;
                const arrowY = finalEndY;

                // 计算箭头三个顶点
                const tipX = arrowX;
                const tipY = arrowY;
                const baseX = arrowX - Math.cos(angle) * arrowSize;
                const baseY = arrowY - Math.sin(angle) * arrowSize;
                const wingX1 = baseX - Math.sin(angle) * arrowSize * 0.5;
                const wingY1 = baseY + Math.cos(angle) * arrowSize * 0.5;
                const wingX2 = baseX + Math.sin(angle) * arrowSize * 0.5;
                const wingY2 = baseY - Math.cos(angle) * arrowSize * 0.5;

                const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                arrow.setAttribute('points', `${tipX},${tipY} ${wingX1},${wingY1} ${wingX2},${wingY2}`);
                arrow.setAttribute('fill', arrowColor);
                arrow.setAttribute('stroke', arrowColor);
                arrow.setAttribute('stroke-width', '1');
                arrow.setAttribute('class', 'arrow-head');
                group.appendChild(arrow);

                // ----- 3. 连线标签（中线位置）-----
                const midX = (finalStartX + finalEndX) / 2;
                const midY = (finalStartY + finalEndY) / 2 - 16;
                const labelEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                labelEl.setAttribute('x', midX);
                labelEl.setAttribute('y', midY);
                labelEl.setAttribute('text-anchor', 'middle');
                labelEl.setAttribute('class', 'line-label');
                labelEl.textContent = `${label} #${conn.id || idx + 1}`;
                group.appendChild(labelEl);

                // ----- 4. 删除按钮（悬停显示）-----
                const delBtn = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                delBtn.setAttribute('x', midX);
                delBtn.setAttribute('y', midY + 18);
                delBtn.setAttribute('text-anchor', 'middle');
                delBtn.setAttribute('class', 'line-delete');
                delBtn.textContent = '✕';
                delBtn.style.cssText = 'cursor:pointer;font-size:14px;';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteConnection(idx);
                });
                group.appendChild(delBtn);

                // ----- 5. 交互事件 -----
                group.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    deleteConnection(idx);
                });

                group.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const fromLabel = fromNode.props?.label || fromNode.type;
                    const toLabel = toNode.props?.label || toNode.type;
                    showToast(`🔗 ${label}连线 #${conn.id || idx + 1} (${fromLabel} → ${toLabel})`);
                });

                svg.appendChild(group);
            });
        }

                    { id: 'edit-fields', label: '字段 (逗号分隔)', key: 'fields' },
                    { id: 'edit-btntext', label: '按钮文字', key: 'btnText' }
                ],
                image: [

                    { id: 'edit-width', label: '宽度', key: 'width' },

                ]
            };

            const fields = typeFields[type] || [];
            fields.forEach(field => {
                let inputHtml = '';
                const value = props[field.key] !== undefined ? props[field.key] : defaultProps[field.key] || '';

                if (field.type === 'textarea') {
                    inputHtml = `<textarea id="${field.id}" rows="3">${value}</textarea>`;
                } else if (field.type === 'select') {
                    const opts = field.options.map(opt =>
                        `<option value="${opt}" ${value === opt ? 'selected' : ''}>${opt}</option>`
                    ).join('');
                    inputHtml = `<select id="${field.id}">${opts}</select>`;
                } else if (field.type === 'number') {
                    inputHtml = `<input id="${field.id}" type="number" value="${value}" />`;
                } else if (field.type === 'checkbox') {
                    const checked = value ? 'checked' : '';
                    inputHtml = `<input id="${field.id}" type="checkbox" ${checked} />`;
                } else {
                    inputHtml = `<input id="${field.id}" value="${value}" />`;
                }

                html += `
                    <div class="prop-group">
                        <label>${field.label}</label>
                        ${inputHtml}
                    </div>

            });

            // 连线统计
            const inConnections = connections.filter(c => c.to === node.id);
            const outConnections = connections.filter(c => c.from === node.id);
            html += `
                <div class="section-title">📊 连线统计</div>
                <div class="prop-group" style="color:#aaa;font-size:12px;">
                    入线: ${inConnections.length} | 出线: ${outConnections.length}
                </div>
            `;

            html += `
                <button class="delete-node-btn" onclick="deleteNode(${node.id})">🗑 删除此组件</button>
            `;

            panelContent.innerHTML = html;

            // 绑定属性变更
            const bindChange = (id, key, type = 'input') => {
                const el = document.getElementById(id);
                if (el) {
                    const event = type === 'checkbox' ? 'change' : 'input';
                    el.addEventListener(event, () => {
                        const node2 = nodes.find(n => n.id === selectedId);
                        if (node2) {
                            if (!node2.props) node2.props = { ...DEFAULT_PROPS[node2.type] };
                            if (type === 'checkbox') {
                                node2.props[key] = el.checked;
                            } else {
                                node2.props[key] = el.value;
                            }
                            render();
                        }
                    });
                }
            };

            bindChange('edit-label', 'label');
            bindChange('edit-bg', 'bgColor');
            bindChange('edit-textcolor', 'textColor');

            fields.forEach(field => {
                bindChange(field.id, field.key, field.type);
            });

        // ============================================================
        //  交互逻辑
        // ============================================================

        // ----- 拖拽添加 -----
        document.querySelectorAll('.component-item').forEach(item => {
            item.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('type', item.dataset.type);
                e.dataTransfer.effectAllowed = 'copy';
            });
        });

        canvas.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
            canvas.classList.add('drag-over');
        });

        canvas.addEventListener('dragleave', () => {
            canvas.classList.remove('drag-over');
        });

        canvas.addEventListener('drop', (e) => {
            e.preventDefault();
            canvas.classList.remove('drag-over');
            const type = e.dataTransfer.getData('type');
            if (!type) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left + canvas.scrollLeft - 60;
            const y = e.clientY - rect.top + canvas.scrollTop - 30;

            const newNode = {
                id: ++idCounter,
                type: type,
                x: Math.max(10, x),
                y: Math.max(10, y),
                props: { ...DEFAULT_PROPS[type] }
            };
            nodes.push(newNode);
            selectedId = newNode.id;
            render();
            showToast(`✅ 添加了 ${DEFAULT_PROPS[type].label}`);
        });

        // ----- 点击节点 -----
        function handleNodeClick(id, event) {
            if (event.shiftKey) {
                if (pendingConnectId === null) {
                    pendingConnectId = id;
                    document.querySelector(`.node[data-id="${id}"]`)?.classList.add('selected');
                    showToast('🔗 请点击另一个节点完成连线 (当前类型: ' + lineType + ')');
                } else if (pendingConnectId !== id) {
                    const exists = connections.some(c =>
                        (c.from === pendingConnectId && c.to === id) ||
                        (c.from === id && c.to === pendingConnectId)
                    );
                    if (!exists) {
                        connections.push({
                            id: nextLineId++,
                            from: pendingConnectId,
                            to: id,
                            type: lineType
                        });
                        showToast(`✅ 连线成功！类型: ${lineType}`);
                    } else {
                        showToast('⚠️ 这两个节点已经连过了');
                    }
                    document.querySelectorAll('.node').forEach(el => el.classList.remove('selected'));
                    pendingConnectId = null;
                    selectedId = id;
                    render();
                } else {
                    showToast('不能连到自己哦');
                    pendingConnectId = null;
                    document.querySelectorAll('.node').forEach(el => el.classList.remove('selected'));
                }
            } else {
                selectedId = id;
                pendingConnectId = null;
                document.querySelectorAll('.node').forEach(el => el.classList.remove('selected'));
                render();
            }
        }

        // ----- 拖拽移动 -----
        let dragData = null;

        function startDrag(id, e) {
            const node = nodes.find(n => n.id === id);
            if (!node) return;
            const el = getNodeElement(id);
            if (!el) return;

            const rect = el.getBoundingClientRect();
            dragData = {
                id: id,
                offsetX: e.clientX - rect.left,
                offsetY: e.clientY - rect.top
            };

            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', endDrag);
            e.preventDefault();
        }

        function onDrag(e) {
            if (!dragData) return;
            const canvasRect = canvas.getBoundingClientRect();
            const x = e.clientX - canvasRect.left - dragData.offsetX + canvas.scrollLeft;
            const y = e.clientY - canvasRect.top - dragData.offsetY + canvas.scrollTop;

            const node = nodes.find(n => n.id === dragData.id);
            if (node) {
                node.x = Math.max(0, x);
                node.y = Math.max(0, y);
                const el = getNodeElement(dragData.id);
                if (el) {
                    el.style.left = node.x + 'px';
                    el.style.top = node.y + 'px';
                }
                renderLines();
            }
        }

        function endDrag() {
            dragData = null;
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', endDrag);
        }

        // ----- 删除 -----
        function deleteNode(id) {
            nodes = nodes.filter(n => n.id !== id);
            connections = connections.filter(c => c.from !== id && c.to !== id);
            if (selectedId === id) selectedId = null;
            if (pendingConnectId === id) pendingConnectId = null;
            render();
            showToast('🗑 已删除节点');
        }

        function deleteConnection(idx) {
            connections.splice(idx, 1);
            render();
            showToast('🗑 已删除连线');
        }

        function clearAll() {
            if (!confirm('确定要清空所有内容吗？')) return;
            nodes = [];
            connections = [];
            selectedId = null;
            pendingConnectId = null;
            render();
            showToast('已清空');
        }

        // ============================================================
        //  自动布局
        // ============================================================

        function autoLayout() {
            if (nodes.length === 0) {
                showToast('⚠️ 没有节点可布局');
                return;
            }

            const ordered = [];
            const visited = new Set();
            const inDegree = new Map();

            nodes.forEach(n => inDegree.set(n.id, 0));
            connections.forEach(c => {
                if (c.type !== 'contain') {
                    inDegree.set(c.to, (inDegree.get(c.to) || 0) + 1);
                }
            });

            const queue = [];
            nodes.forEach(n => {
                if (inDegree.get(n.id) === 0) queue.push(n.id);
            });
            if (queue.length === 0 && nodes.length > 0) queue.push(nodes[0].id);

            while (queue.length > 0) {
                const id = queue.shift();
                if (visited.has(id)) continue;
                visited.add(id);
                const node = nodes.find(n => n.id === id);
                if (node) ordered.push(node);

                const outEdges = connections.filter(c => c.from === id && c.type !== 'contain');
                outEdges.forEach(edge => {
                    if (!visited.has(edge.to)) {
                        const newDegree = (inDegree.get(edge.to) || 1) - 1;
                        inDegree.set(edge.to, newDegree);
                        if (newDegree === 0) queue.push(edge.to);
                    }
                });
            }

            nodes.forEach(n => {
                if (!visited.has(n.id)) ordered.push(n);
            });

            const spacingX = 220;
            const spacingY = 160;
            const cols = Math.ceil(Math.sqrt(ordered.length));

            ordered.forEach((node, index) => {
                const col = index % cols;
                const row = Math.floor(index / cols);
                node.x = 50 + col * spacingX;
                node.y = 50 + row * spacingY;
            });

            render();
            showToast(`📐 自动布局完成！(${ordered.length} 个节点)`);
        }

                            html = `
                                <div style="text-align:center;padding:10px;">
                                    <a href="${p.link || '#'}" style="background:${p.bgColor || '#e94560'};color:${p.textColor || '#fff'};border:none;padding:${p.size === 'large' ? '12px 36px' : p.size === 'small' ? '6px 16px' : '8px 24px'};border-radius:8px;font-size:${p.size === 'large' ? '17px' : p.size === 'small' ? '12px' : '14px'};cursor:pointer;text-decoration:none;display:inline-block;">${p.text || '点击我'}</a>
                                </div>
                            `;
                            break;
                        case 'text':
                            html = `
                                <div style="padding:12px 20px;color:${p.color || '#eee'};font-size:${p.fontSize || 16}px;line-height:1.8;text-align:${p.align || 'left'};">
                                    ${p.content || '这是一段文本内容'}
                                </div>
                            `;
                            break;
                        case 'footer':
                            html = `
                                <footer style="background:${p.bgColor || '#0d0d1a'};padding:20px;text-align:center;color:${p.textColor || '#888'};font-size:13px;">
                                    <div>${p.text || '© 2026 我的品牌'}</div>
                                    ${p.links ? `<div style="margin-top:8px;display:flex;gap:16px;justify-content:center;font-size:12px;">${p.links.split('|').map(l => `<a href="#" style="color:${p.textColor || '#888'};text-decoration:none;">${l.trim()}</a>`).join('')}</div>` : ''}
                                </footer>
                            `;
                            break;
                        case 'form':
                            const fields = (p.fields || '姓名, 邮箱, 留言').split(',').map(f => f.trim());
                            let formFields = fields.map(f =>
                                `<div style="margin-bottom:10px;"><label style="display:block;font-size:12px;margin-bottom:3px;color:${p.textColor || '#eee'};">${f}</label><input style="width:100%;padding:6px 10px;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:6px;color:#eee;font-size:13px;" placeholder="${f}" /></div>`
                            ).join('');
                            html = `
                                <div style="background:${p.bgColor || '#2a2a4a'};padding:20px;border-radius:10px;margin:10px 16px;color:${p.textColor || '#eee'};">
                                    <h3 style="margin-bottom:12px;">${p.title || '联系我们'}</h3>
                                    ${formFields}
                                    <button style="background:#e94560;color:#fff;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:14px;">${p.btnText || '提交'}</button>
                                </div>
                            `;
                            break;
                        case 'image':
                            html = `
                                <div style="padding:10px 16px;text-align:center;">
                                    <img src="${p.src || 'https://via.placeholder.com/800x400/2a2a4a/eeeeee?text=图片'}" 
                                         alt="${p.alt || '图片'}" 
                                         style="width:${p.width || '100%'};height:${p.height || 'auto'};border-radius:${p.rounded ? '12px' : '0'};max-width:100%;" />
                                </div>
                            `;
                            break;
                        default:
                            html = `<div style="padding:12px;background:#2a2a4a;margin:6px;border-radius:8px;color:#eee;">未知组件</div>`;
                    }
                }

                bodyHtml += html;
            });

            return `<!DOCTYPE html>
        <html>
        <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>我的品牌官网</title>
        <style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','PingFang SC',sans-serif;}body{background:#0d0d1a;color:#eee;}</style>
        </head>
        <body>${bodyHtml}</body>
        </html>`;
        }

        // ============================================================
        //  预览 & 导出
        // ============================================================

        function preview() {
            const html = generateHTML();
            document.getElementById('preview-iframe').srcdoc = html;
            document.getElementById('preview-modal').classList.add('active');
        }

        function closePreview() {
            document.getElementById('preview-modal').classList.remove('active');
        }

        function exportHTML() {
            const html = generateHTML();
            const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'my-website.html';
            a.click();
            URL.revokeObjectURL(url);
            showToast('✅ 导出成功！');
        }

        // ============================================================
        //  Toast
        // ============================================================

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => { toast.classList.remove('show'); }, 2500);
        }

        // ============================================================
        //  初始化
        // ============================================================

        function initDemo() {
            const demoNodes = [
                { id: ++idCounter, type: 'navbar', x: 50, y: 20, props: { ...DEFAULT_PROPS.navbar } },
                { id: ++idCounter, type: 'hero', x: 50, y: 130, props: { ...DEFAULT_PROPS.hero } },
                { id: ++idCounter, type: 'card-group', x: 50, y: 300, props: { ...DEFAULT_PROPS['card-group'], title: '产品展示',
                        columns: 3 } },
                { id: ++idCounter, type: 'card', x: 80, y: 380, props: { ...DEFAULT_PROPS.card, title: '产品1',
                        content: '这是第一个产品' } },
                { id: ++idCounter, type: 'card', x: 320, y: 380, props: { ...DEFAULT_PROPS.card, title: '产品2',
                        content: '这是第二个产品' } },
                { id: ++idCounter, type: 'card', x: 560, y: 380, props: { ...DEFAULT_PROPS.card, title: '产品3',
                        content: '这是第三个产品' } },
                { id: ++idCounter, type: 'footer', x: 50, y: 520, props: { ...DEFAULT_PROPS.footer } },
            ];
            nodes = demoNodes;
            connections = [
                { id: nextLineId++, from: 1, to: 2, type: 'layout' },
                { id: nextLineId++, from: 2, to: 3, type: 'layout' },
                { id: nextLineId++, from: 3, to: 4, type: 'contain' },
                { id: nextLineId++, from: 3, to: 5, type: 'contain' },
                { id: nextLineId++, from: 3, to: 6, type: 'contain' },
                { id: nextLineId++, from: 3, to: 7, type: 'layout' },
            ];
            render();
            showToast('🎉 欢迎！试试 Shift+点击连线，箭头已显示！');
        }

        // 点击空白取消选择
        canvas.addEventListener('click', (e) => {
            if (e.target === canvas || e.target === svg) {
                selectedId = null;
                pendingConnectId = null;
                document.querySelectorAll('.node').forEach(el => el.classList.remove('selected'));
                render();
            }
        });

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Delete' || e.key === 'Backspace') {
                if (selectedId) {
                    deleteNode(selectedId);
                }
            }
            if (e.key === 'l' || e.key === 'L') {
                const types = ['layout', 'jump', 'contain'];
                const currentIdx = types.indexOf(lineType);
                lineType = types[(currentIdx + 1) % types.length];
                showToast(`🔗 连线类型切换为: ${lineType}`);
            }
        });

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => { renderLines(); }, 200);
        });

        console.log('💡 快捷键: L = 切换连线类型 | Delete = 删除选中节点');
        console.log('💡 所有连线现在都显示箭头了！');

        initDemo();
    </script>

</body>
</html>
