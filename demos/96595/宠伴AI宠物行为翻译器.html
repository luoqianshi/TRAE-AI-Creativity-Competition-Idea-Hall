<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宠伴 · AI宠物行为翻译器</title>
<style>
  :root {--pink:#FF6B9D;--teal:#4ECDC4;--yellow:#FFE66D;--bg:#FFF8F0;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:#333;min-height:100vh;}
  .header{background:linear-gradient(135deg,var(--pink),#FF8E53);color:#fff;text-align:center;padding:32px 16px;border-radius:0 0 32px 32px;}
  .header h1{font-size:2em;margin-bottom:4px;letter-spacing:2px;} .header .paw{font-size:1.4em;}
  .header p{opacity:.9;margin-top:6px;}
  .container{max-width:800px;margin:0 auto;padding:20px;}
  .card{background:#fff;border-radius:20px;padding:24px;margin-bottom:20px;box-shadow:0 4px 16px rgba(0,0,0,.06);}
  .card h2{font-size:1.25em;color:var(--pink);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .recorder{text-align:center;padding:32px 0;}
  .btn-record{width:120px;height:120px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--pink),#FF8E53);color:#fff;font-size:1.1em;cursor:pointer;transition:all .3s;box-shadow:0 6px 24px rgba(255,107,157,.4);position:relative;}
  .btn-record:hover{transform:scale(1.05);box-shadow:0 8px 32px rgba(255,107,157,.5);}
  .btn-record.recording{animation:pulse 1s infinite;background:linear-gradient(135deg,#FF4444,#FF6B6B);}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,68,68,.6);}50%{box-shadow:0 0 0 24px rgba(255,68,68,0);}}
  .status-bar{display:flex;justify-content:center;gap:12px;margin-top:12px;flex-wrap:wrap;}
  .status-dot{width:10px;height:10px;border-radius:50%;background:#ddd;display:inline-block;}
  .status-dot.active{background:var(--pink);animation:blink .6s infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
  .waveform{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:60px;margin-top:12px;}
  .waveform .bar{width:6px;background:var(--pink);border-radius:3px;transition:height .15s;}
  .pet-select{display:flex;gap:12px;flex-wrap:wrap;}
  .pet-card{cursor:pointer;border:3px solid #eee;border-radius:16px;padding:16px;text-align:center;flex:1;min-width:100px;transition:all .3s;}
  .pet-card:hover,.pet-card.selected{border-color:var(--pink);background:#FFF0F5;}
  .pet-card .icon{font-size:2.5em;display:block;}
  .pet-card .name{font-weight:600;margin-top:4px;}
  .result-box{background:#F8F8F8;border-radius:12px;padding:20px;margin-top:12px;}
  .emotion-tag{display:inline-block;padding:6px 16px;border-radius:20px;font-weight:600;font-size:.9em;margin:4px;}
  .emotion-happy{background:#E8F8E8;color:#2D8B2D;}
  .emotion-anxious{background:#FFF3E0;color:#E67E22;}
  .emotion-curious{background:#E3F2FD;color:#1565C0;}
  .emotion-sleepy{background:#F3E5F5;color:#7B1FA2;}
  .advice-list{list-style:none;padding:0;}
  .advice-list li{padding:10px 0;border-bottom:1px solid #eee;display:flex;align-items:center;gap:8px;}
  .advice-list li:last-child{border:none;}
  .history-item{display:flex;align-items:center;justify-content:space-between;padding:12px;background:#FAFAFA;border-radius:10px;margin:8px 0;}
  .history-item .time{color:#999;font-size:.85em;}
  .footer{text-align:center;padding:24px;color:#999;font-size:.85em;}
</style>
</head>
<body>
<div class="header">
  <span class="paw">🐾</span>
  <h1>宠伴 · AI宠物行为翻译器</h1>
  <p>听懂毛孩子的每一句"心里话"</p>
</div>

<div class="container">
  <div class="card">
    <h2>🐕 选择你的毛孩子</h2>
    <div class="pet-select" id="petSelect">
      <div class="pet-card selected" data-pet="dog">
        <span class="icon">🐕</span><div class="name">狗狗</div>
      </div>
      <div class="pet-card" data-pet="cat">
        <span class="icon">🐱</span><div class="name">猫咪</div>
      </div>
      <div class="pet-card" data-pet="rabbit">
        <span class="icon">🐰</span><div class="name">兔兔</div>
      </div>
      <div class="pet-card" data-pet="bird">
        <span class="icon">🐦</span><div class="name">小鸟</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>🎙️ 录制宠物声音/行为</h2>
    <div class="recorder">
      <button class="btn-record" id="recordBtn" onclick="toggleRecord()">
        <div style="font-size:2em;">🎤</div>
        <div id="btnLabel">点击录制</div>
      </button>
      <div class="waveform" id="waveform"></div>
      <div class="status-bar">
        <span>🔊 音量</span>
        <span class="status-dot" id="dot1"></span>
        <span class="status-dot" id="dot2"></span>
        <span class="status-dot" id="dot3"></span>
      </div>
      <p style="margin-top:8px;color:#888;font-size:.85em;" id="recordTip">点击按钮开始录制宠物叫声或行为描述</p>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <h2>🤖 AI 翻译结果</h2>
    <div class="result-box">
      <div style="margin-bottom:12px;"><strong>📋 检测到的行为：</strong><span id="detectedBehavior">—</span></div>
      <div style="margin-bottom:12px;"><strong>😺 情绪分析：</strong><span id="emotionTag"></span></div>
      <div><strong>💬 翻译：</strong><em id="translation" style="color:var(--pink);">—</em></div>
    </div>
  </div>

  <div class="card" id="adviceCard" style="display:none;">
    <h2>💡 AI 养护建议</h2>
    <ul class="advice-list" id="adviceList"></ul>
  </div>

  <div class="card">
    <h2>📅 行为记录历史</h2>
    <div id="historyList">
      <div class="history-item"><span>🐕 汪汪叫 · 兴奋摇尾巴</span><span class="time">刚刚</span><span>😊 开心</span></div>
      <div class="history-item"><span>🐱 喵喵低吟 · 蹭腿</span><span class="time">2小时前</span><span>🥰 撒娇</span></div>
      <div class="history-item"><span>🐰 跺后脚</span><span class="time">昨天 18:30</span><span>⚠️ 警觉</span></div>
    </div>
  </div>
</div>

<div class="footer">
  <p>🐾 宠伴 · 让每一次互动都被理解</p>
</div>

<script>
let isRecording = false;
let recordTimer = null;
const petBehaviors = {
  dog:[
    {behavior:'汪汪叫 + 摇尾巴',emotion:'happy',tag:'开心兴奋',translation:'"好开心！快陪我玩！"',advice:['带它出去散步或玩飞盘','可以奖励一个小零食','这是社交需求旺盛的表现']},
    {behavior:'低声呜咽 + 耳朵后贴',emotion:'anxious',tag:'焦虑不安',translation:'"我有点害怕…陪陪我好吗？"',advice:['检查周围是否有令它紧张的事物','轻声安抚并抚摸它的背部','可能是分离焦虑，考虑逐步脱敏训练']},
    {behavior:'刨地板 + 转圈',emotion:'sleepy',tag:'困倦想睡',translation:'"我想找个舒服的地方睡觉"',advice:['给它准备一个舒适的窝','确保睡眠区域安静温暖','这是本能行为，无需担心']},
    {behavior:'盯着门口 + 竖起耳朵',emotion:'curious',tag:'好奇警觉',translation:'"外面有动静！我去看看"',advice:['让它确认环境安全','如果是访客可以正面介绍','守护行为值得表扬']}
  ],
  cat:[
    {behavior:'呼噜声 + 踩奶',emotion:'happy',tag:'极度舒适',translation:'"好幸福～你是我的全世界"',advice:['这是猫咪极度信任你的表现','让它继续享受，不要打扰','可以轻轻抚摸它的头部']},
    {behavior:'飞机耳 + 尾巴快速甩动',emotion:'anxious',tag:'烦躁不安',translation:'"别碰我！我现在很不爽"',advice:['给猫咪独处的空间','检查是否身体不适','等它冷静后再尝试互动']},
    {behavior:'喵喵叫 + 望向食盆',emotion:'curious',tag:'饿了/渴了',translation:'"饭呢？水呢？铲屎的快干活"',advice:['检查食物和水是否充足','定时定量喂食很关键','可以搭配一些湿粮补充水分']},
    {behavior:'蜷成一团 + 闭眼',emotion:'sleepy',tag:'放松休息',translation:'"ZZzzz…别吵我睡觉"',advice:['保持环境安静舒适','注意保暖','睡眠是猫咪健康的重要指标']}
  ],
  rabbit:[
    {behavior:'跳跃 + 空中转身',emotion:'happy',tag:'超级开心',translation:'"太开心啦！这就是幸福兔生"',advice:['这是兔子最开心的表现(Binky)','确保活动空间足够安全','可以陪它多玩一会儿']},
    {behavior:'跺后脚',emotion:'anxious',tag:'警觉/愤怒',translation:'"有危险！我很生气！"',advice:['先安静观察，找出让它警觉的原因','检查是否有陌生气味或声音','给它时间平静下来']}
  ],
  bird:[
    {behavior:'鸣唱 + 蓬松羽毛',emotion:'happy',tag:'愉快歌唱',translation:'"今天心情好～来一首"',advice:['可以放一些轻柔的音乐陪伴它','这是鸟类健康的标志','注意保持笼内卫生']},
    {behavior:'尖叫 + 扑腾翅膀',emotion:'anxious',tag:'受惊/不满',translation:'"吓到我了！我要出去！"',advice:['检查是否有突然的噪音或光影变化','确认笼子没有不安全因素','温柔地安抚并用柔和声音说话']}
  ]
};

let currentPet = 'dog';

document.querySelectorAll('.pet-card').forEach(card=>{
  card.addEventListener('click',function(){
    document.querySelectorAll('.pet-card').forEach(c=>c.classList.remove('selected'));
    this.classList.add('selected');
    currentPet = this.dataset.pet;
    document.getElementById('resultCard').style.display='none';
    document.getElementById('adviceCard').style.display='none';
  });
});

function toggleRecord(){
  isRecording = !isRecording;
  const btn = document.getElementById('recordBtn');
  const label = document.getElementById('btnLabel');
  const tip = document.getElementById('recordTip');
  const waveform = document.getElementById('waveform');

  if(isRecording){
    btn.classList.add('recording');
    label.textContent = '录制中…';
    tip.textContent = '🔴 正在录制，请让宠物发出声音…';
    document.querySelectorAll('.status-dot').forEach((d,i)=>{
      d.classList.add('active');
      d.style.animationDelay = (i*0.15)+'s';
    });
    startWaveform();
    recordTimer = setTimeout(()=>{
      stopRecord();
    },5000);
  }else{
    stopRecord();
  }
}

function stopRecord(){
  isRecording = false;
  clearTimeout(recordTimer);
  const btn = document.getElementById('recordBtn');
  btn.classList.remove('recording');
  document.getElementById('btnLabel').textContent = '分析中…';
  document.getElementById('recordTip').textContent = '🤖 AI正在分析宠物行为…';
  document.querySelectorAll('.status-dot').forEach(d=>d.classList.remove('active'));
  clearWaveform();

  setTimeout(()=>{
    const behaviors = petBehaviors[currentPet];
    const random = behaviors[Math.floor(Math.random()*behaviors.length)];
    showResult(random);
    document.getElementById('btnLabel').textContent = '再次录制';
    document.getElementById('recordTip').textContent = '点击按钮再次录制宠物行为';
  },1500);
}

function showResult(data){
  document.getElementById('resultCard').style.display='block';
  document.getElementById('adviceCard').style.display='block';
  document.getElementById('detectedBehavior').textContent = data.behavior;
  const tagEl = document.getElementById('emotionTag');
  tagEl.innerHTML = `<span class="emotion-tag emotion-${data.emotion}">${data.tag}</span>`;
  document.getElementById('translation').textContent = data.translation;
  const adviceList = document.getElementById('adviceList');
  adviceList.innerHTML = data.advice.map(a=>`<li>✅ ${a}</li>`).join('');

  // Add to history
  const history = document.getElementById('historyList');
  const now = new Date();
  const timeStr = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  const petEmoji = {dog:'🐕',cat:'🐱',rabbit:'🐰',bird:'🐦'};
  const newItem = document.createElement('div');
  newItem.className = 'history-item';
  newItem.innerHTML = `<span>${petEmoji[currentPet]} ${data.behavior.substring(0,10)}…</span><span class="time">${timeStr}</span><span>${data.tag}</span>`;
  history.insertBefore(newItem,history.firstChild);

  document.getElementById('resultCard').scrollIntoView({behavior:'smooth'});
}

let waveformInterval;
function startWaveform(){
  const waveform = document.getElementById('waveform');
  waveform.innerHTML = '';
  for(let i=0;i<24;i++){
    const bar = document.createElement('div');bar.className='bar';
    bar.style.height = (8+Math.random()*48)+'px';
    waveform.appendChild(bar);
  }
  waveformInterval = setInterval(()=>{
    waveform.querySelectorAll('.bar').forEach(b=>{
      b.style.height = (8+Math.random()*48)+'px';
    });
  },120);
}
function clearWaveform(){
  clearInterval(waveformInterval);
  document.getElementById('waveform').innerHTML = '';
}
</script>
</body>
</html>
