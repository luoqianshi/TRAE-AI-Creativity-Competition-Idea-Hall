<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古籍药膳食谱可视化生成器 · 创意演示</title>
<style>
  :root{
    --ink-deep:#3a2a1a; --ink-body:#5a4632; --ink-muted:#9b8a72;
    --ink-border:rgba(140,110,80,.25); --paper:#fbf4e4; --paper-2:#f5ead0;
    --accent:#a8311e; --accent-2:#2e5f5a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    font-family:'Noto Serif SC','Songti SC','STSong','Source Han Serif SC','SimSun','宋体',serif;
    color:var(--ink-body); background:var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}

  /* Hero */
  .hero{
    position:relative; padding:80px 24px 60px; overflow:hidden;
    background:
      radial-gradient(ellipse at top right, rgba(168,49,30,.12), transparent 60%),
      radial-gradient(ellipse at bottom left, rgba(46,95,90,.1), transparent 55%),
      linear-gradient(180deg,#fbf4e4 0%,#f5ead0 100%);
    border-bottom:1px solid var(--ink-border);
  }
  .hero-content{position:relative;max-width:960px;margin:0 auto;text-align:center}
  .hero-tag{
    display:inline-block; padding:5px 14px; font-size:12px; letter-spacing:3px;
    color:var(--accent); background:rgba(168,49,30,.08);
    border:1px solid rgba(168,49,30,.25); border-radius:999px; margin-bottom:22px;
  }
  .hero-title{
    margin:0 0 18px; font-size:44px; font-weight:800; letter-spacing:8px;
    color:var(--ink-deep); display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .title-sub{font-size:20px;font-weight:400;letter-spacing:10px;color:var(--accent)}
  .hero-desc{max-width:680px;margin:0 auto 32px;font-size:15px;line-height:2;color:var(--ink-body)}
  .hero-stats{
    display:inline-flex; align-items:center; gap:28px; padding:14px 28px;
    background:rgba(255,255,255,.6); border:1px solid var(--ink-border);
    border-radius:12px; backdrop-filter:blur(6px);
  }
  .stat-num{font-size:26px;font-weight:700;color:var(--accent);line-height:1}
  .stat-label{font-size:12px;color:var(--ink-muted);margin-top:4px;letter-spacing:1px}
  .stat-divider{width:1px;height:30px;background:var(--ink-border)}

  /* Main */
  .main{
    max-width:1240px;margin:0 auto;padding:48px 24px;
    display:grid;grid-template-columns:340px 1fr;gap:28px;align-items:start;
  }
  .side{position:sticky;top:24px;display:flex;flex-direction:column;gap:18px}

  /* Panel */
  .panel{
    display:flex;flex-direction:column;gap:22px;padding:28px;
    background:
      linear-gradient(180deg, rgba(255,252,245,.85), rgba(248,240,224,.7)),
      repeating-linear-gradient(45deg, rgba(140,90,50,.04) 0 2px, transparent 2px 8px);
    border:1px solid var(--ink-border); border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 8px 24px rgba(80,50,20,.08);
  }
  .label{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .label-cn{font-size:16px;font-weight:600;color:var(--ink-deep);letter-spacing:2px}
  .label-en{font-size:11px;color:var(--ink-muted);letter-spacing:1px;text-transform:uppercase}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    padding:6px 14px;font-size:14px;color:var(--ink-body);
    background:rgba(255,252,245,.6);border:1px solid var(--ink-border);
    border-radius:999px;cursor:pointer;transition:all .18s;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 3px 8px rgba(168,49,30,.25)}
  .chip.season.active{background:var(--accent-2);border-color:var(--accent-2);box-shadow:0 3px 8px rgba(46,95,90,.25)}
  .chip.ingredient.active{background:var(--ink-deep);border-color:var(--ink-deep);box-shadow:0 3px 8px rgba(60,40,20,.25)}
  .keyword-input{
    width:100%;padding:10px 14px;font-size:14px;color:var(--ink-deep);
    background:rgba(255,255,255,.7);border:1px solid var(--ink-border);
    border-radius:8px;outline:none;transition:border .18s;
  }
  .keyword-input::placeholder{color:var(--ink-muted)}
  .keyword-input:focus{border-color:var(--accent);background:#fff}
  .actions{display:flex;gap:12px;margin-top:4px}
  .btn{
    flex:1;padding:11px 18px;font-size:15px;letter-spacing:2px;
    border-radius:8px;cursor:pointer;transition:all .2s;border:1px solid transparent;
  }
  .btn.primary{
    background:linear-gradient(135deg,var(--accent),#8a2a1c);color:#fff;
    border-color:var(--accent);box-shadow:0 4px 12px rgba(168,49,30,.25);
  }
  .btn.primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(168,49,30,.35)}
  .btn.ghost{background:transparent;color:var(--ink-body);border-color:var(--ink-border)}
  .btn.ghost:hover{border-color:var(--ink-deep);color:var(--ink-deep)}

  .tip{
    padding:18px;background:rgba(46,95,90,.06);
    border:1px dashed rgba(46,95,90,.3);border-radius:10px;
  }
  .tip-title{font-size:13px;font-weight:600;color:var(--accent-2);margin-bottom:8px;letter-spacing:1px}
  .tip p{margin:0;font-size:13px;line-height:1.8;color:var(--ink-body)}

  /* Content */
  .content-head{
    display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;
    gap:12px;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid var(--ink-deep);
  }
  .content-title{margin:0;font-size:24px;font-weight:700;color:var(--ink-deep);letter-spacing:3px}
  .content-count{font-size:13px;font-weight:400;color:var(--ink-muted);margin-left:8px}
  .result-tags{display:flex;flex-wrap:wrap;gap:6px}
  .result-tag{padding:3px 10px;font-size:12px;color:var(--accent);background:rgba(168,49,30,.08);border-radius:4px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px}

  .loading{padding:80px 20px;text-align:center;color:var(--ink-muted)}
  .loader{
    width:36px;height:36px;margin:0 auto 14px;
    border:3px solid rgba(168,49,30,.15);border-top-color:var(--accent);
    border-radius:50%;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Card */
  .card{
    display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(180deg,#fdfaf3 0%,#f7efde 100%);
    border:1px solid var(--ink-border);border-radius:14px;
    box-shadow:0 6px 20px rgba(80,50,20,.08);transition:transform .25s,box-shadow .25s;
  }
  .card:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(80,50,20,.16)}
  .cover{position:relative;aspect-ratio:4/3;overflow:hidden}
  .cover img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
  .card:hover .cover img{transform:scale(1.04)}
  .cover-mask{position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,20,10,0) 40%,rgba(40,20,10,.55) 80%,rgba(40,20,10,.78) 100%)}
  .cover-meta{position:absolute;top:12px;right:12px;display:flex;gap:6px}
  .badge{padding:3px 9px;font-size:12px;border-radius:4px;background:rgba(255,255,255,.85);color:var(--ink-deep);backdrop-filter:blur(4px)}
  .badge.diff{background:rgba(168,49,30,.85);color:#fff}
  .name{position:absolute;bottom:16px;left:18px;margin:0;font-size:22px;font-weight:700;letter-spacing:3px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
  .body{padding:18px 20px 22px}
  .intro{margin:0 0 14px;font-size:14px;line-height:1.75;color:var(--ink-body)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
  .tag{padding:3px 10px;font-size:12px;border-radius:4px}
  .tag.efficacy{color:var(--accent);background:rgba(168,49,30,.08);border:1px solid rgba(168,49,30,.2)}
  .tag.ok{color:var(--ink-deep);background:rgba(60,40,20,.06);border:1px solid var(--ink-border)}
  .tag.season{color:var(--accent-2);background:rgba(46,95,90,.08);border:1px solid rgba(46,95,90,.2)}
  .tag.warn{color:#b35a00;background:rgba(179,90,0,.08);border:1px solid rgba(179,90,0,.25)}

  .section{border-top:1px dashed var(--ink-border);padding:12px 0}
  .sec-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
  .sec-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink-deep);letter-spacing:1px}
  .seal{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;font-size:12px;font-weight:700;color:#fff;background:var(--ink-deep);border-radius:4px}
  .seal.accent{background:var(--accent)}
  .seal.green{background:var(--accent-2)}
  .toggle{font-size:12px;color:var(--ink-muted)}
  .sec-body{margin-top:10px}
  .source{margin-bottom:12px;padding:10px 12px;background:rgba(255,252,240,.6);border-left:3px solid var(--accent);border-radius:4px}
  .source:last-child{margin-bottom:0}
  .src-head{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;margin-bottom:6px;font-size:12px}
  .book{font-size:14px;font-weight:600;color:var(--ink-deep)}
  .dynasty,.author,.page{color:var(--ink-muted)}
  .original{margin:0;font-size:14px;line-height:1.8;color:var(--ink-body);font-family:'KaiTi','STKaiti','楷体',serif}
  .quote-mark{color:var(--accent);font-weight:700}
  .interpretation{margin:0;font-size:14px;line-height:1.85;color:var(--ink-body);padding:10px 12px;background:rgba(168,49,30,.04);border-radius:4px}
  .ingredients{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
  .ingredients li{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;padding:6px 10px;background:rgba(46,95,90,.05);border-radius:6px;font-size:13px}
  .ing-name{font-weight:600;color:var(--ink-deep)}
  .ing-amount{color:var(--ink-muted)}
  .ing-nature{width:100%;font-size:11px;color:var(--accent-2)}
  .steps{margin:0;padding:0;list-style:none}
  .steps li{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed rgba(140,110,80,.18)}
  .steps li:last-child{border-bottom:none}
  .step-no{flex:0 0 24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--accent);background:rgba(168,49,30,.08);border-radius:50%}
  .step-text{font-size:14px;line-height:1.7;color:var(--ink-body)}
  .meta-grid{border-top:1px dashed var(--ink-border);padding-top:14px;margin-top:6px;display:flex;flex-direction:column;gap:10px}
  .meta-row{display:flex;align-items:flex-start;gap:10px}
  .meta-label{flex:0 0 56px;font-size:12px;color:var(--ink-muted);letter-spacing:1px;padding-top:3px}
  .meta-tags{display:flex;flex-wrap:wrap;gap:6px}

  /* footer */
  .footer{padding:30px 24px;text-align:center;border-top:1px solid var(--ink-border);background:#f7efde}
  .footer p{margin:0;font-size:12px;color:var(--ink-muted);line-height:1.8}
  .footer-sub{margin-top:4px!important;opacity:.6}

  @media(max-width:960px){
    .main{grid-template-columns:1fr}
    .side{position:static}
    .hero-title{font-size:32px;letter-spacing:4px}
    .title-sub{font-size:16px;letter-spacing:6px}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
// 古籍药膳数据
const recipes = [
  {
    id:1, name:'当归生姜羊肉汤',
    image:'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Chinese%20herbal%20soup%20lamb%20with%20angelica%20and%20ginger%20in%20ceramic%20bowl%2C%20traditional%20medicine%20food%2C%20warm%20tones%2C%20top%20down%20view&image_size=landscape_4_3',
    intro:'张仲景《金匮要略》经典名方，温中补血、祛寒止痛，为阳虚、血虚体质及冬令进补之佳品。',

      {book:'《本草纲目》',author:'李时珍',dynasty:'明',page:'兽部·第五十卷',originalText:'羊肉：甘，热，无毒。补中益气，安心止惊。当归：甘、辛，温。补血和血，调经止痛，润燥滑肠。'}

    modernInterpretation:'此方以羊肉甘温补虚为君，当归养血和血为臣，生姜温中散寒为佐。三味相合，共奏温中补血、散寒止痛之效。现代研究显示，当归含挥发油与阿魏酸，可促进造血循环；羊肉富含优质蛋白与铁元素，配合生姜辛辣成分促进血液循环，适合手脚冰凉、面色苍白、气血两虚之亚健康人群。',
    ingredients:[
      {name:'羊肉',amount:'500 克',nature:'甘，热'},
      {name:'当归',amount:'15 克',nature:'甘、辛，温'},
      {name:'生姜',amount:'30 克',nature:'辛，温'},
      {name:'盐',amount:'适量'}
    ],
    steps:['羊肉洗净切块，冷水下锅焯水，撇去浮沫后捞出。','当归用清水浸泡 10 分钟，生姜切片。','砂锅中放入羊肉、当归、生姜，加清水约 1500 毫升。','大火煮沸后转文火慢炖 1.5 至 2 小时，至羊肉酥烂。','出锅前加盐与少许料酒调味即可。'],
    suitableConstitutions:['阳虚质','血虚质','气虚质'],
    suitableSeasons:['冬','秋'],
    efficacies:['温中补血','散寒止痛','温经通络'],
    taboos:['阴虚火旺者慎用','感冒发热期间不宜','湿热体质者忌食'],
    difficulty:'中等', cookingTime:'约 2 小时'
  },
  {
    id:2, name:'枸杞菊花明目茶',
    image:'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Goji%20berry%20and%20chrysanthemum%20tea%20in%20glass%2C%20clear%20golden%20liquid%2C%20refreshing%20Chinese%20herbal%20drink%2C%20soft%20light&image_size=landscape_4_3',

      {book:'《本草纲目》',author:'李时珍',dynasty:'明',page:'木部·第三十六卷',originalText:'枸杞：苦，寒，无毒。坚筋骨，耐老，除风，补益筋骨，能去虚劳。菊花：苦、辛，平，无毒。主治诸风头眩肿痛，目欲脱，泪出，皮肤死肌。'},
      {book:'《神农本草经》',author:'佚名',dynasty:'汉',page:'上品',originalText:'菊花：味苦平。主诸风头眩肿痛，目欲脱，泪出，久服利血气，轻身耐老延年。枸杞：味苦寒。主五内邪气，热中消渴，久服坚筋骨。'}
    ],
    modernInterpretation:'枸杞子滋补肝肾、益精明目，菊花清肝泻火、平抑肝阳。二者相须为用，养中有清、补中有泻，正合春季肝气升发之时令，亦宜久视屏幕之现代人群护眼保健。现代研究表明，枸杞富含玉米黄素，菊花含黄酮类化合物，对缓解视疲劳、保护视网膜有辅助作用。',
    ingredients:[
      {name:'枸杞',amount:'15 粒',nature:'甘，平'},
      {name:'杭白菊',amount:'5 朵',nature:'辛、甘、苦，微寒'},
      {name:'冰糖',amount:'少许（可选）'}

    steps:['枸杞、菊花分别以清水快速冲洗。','将菊花置于杯中，用 90℃ 热水冲泡，加盖闷 5 分钟。','待水温降至约 60℃ 时加入枸杞，避免高温破坏枸杞营养。','闷泡 3 分钟后即可饮用，可续水 2–3 次。'],

    intro:'健脾益气、化湿消滞之平和粥品，适合痰湿、气虚体质日常调养。',
    sources:[
      {book:'《本草纲目》',author:'李时珍',dynasty:'明',page:'菜部·第二十七卷',originalText:'薯蓣（山药）：甘，温，平，无毒。益肾气，健脾胃，止泻痢，化痰涎，润皮毛。薏苡仁：甘，微寒。主筋急拘挛不可屈伸，风湿痹，下气。'},

    ingredients:[
      {name:'粳米',amount:'100 克',nature:'甘，平'},

      {name:'薏苡仁',amount:'50 克',nature:'甘、淡，微寒'},
      {name:'红枣',amount:'5 枚',nature:'甘，温'}
    ],
    steps:['薏苡仁提前浸泡 2 小时，粳米淘洗备用。','山药去皮切块，浸入清水防止氧化。','锅中加清水约 1200 毫升，下粳米、薏苡仁，大火煮沸。','转文火煮 30 分钟后加入山药、红枣，继续煮 20 分钟。','粥稠米烂时即可关火，温服尤佳。'],

  },
  {
    id:4, name:'银耳莲子百合羹',
    image:'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Snow%20fungus%20soup%20with%20lotus%20seed%20and%20lily%20bulb%2C%20sweet%20dessert%20in%20bowl%2C%20Chinese%20nourishing%20food%2C%20warm%20tones&image_size=landscape_4_3',

    difficulty:'简易', cookingTime:'约 40 分钟'
  }

const constitutions=['平和质','气虚质','阳虚质','阴虚质','血虚质','痰湿质','湿热质','气郁质','血瘀质','特禀质'];
const seasons=['春','夏','长夏','秋','冬'];
const commonIngredients=['当归','黄芪','枸杞','山药','茯苓','莲子','银耳','红枣','生姜','羊肉','鸡肉','粳米','薏苡仁','陈皮','菊花','百合'];

const state={constitution:'',season:'',ingredient:'',keyword:'',hasSearched:false,loading:false,results:recipes};
const expanded={};

function filterRecipes(){
  return recipes.filter(r=>{
    if(state.constitution && !r.suitableConstitutions.includes(state.constitution)) return false;
    if(state.season && !r.suitableSeasons.includes(state.season)) return false;
    if(state.ingredient){
      if(!r.ingredients.some(i=>i.name.includes(state.ingredient))) return false;
    }
    if(state.keyword){
      const k=state.keyword.trim();
      if(k && !(r.name.includes(k)||r.intro.includes(k)||r.efficacies.some(e=>e.includes(k))||r.modernInterpretation.includes(k))) return false;
    }
    return true;
  });
}

function selectConstitution(c){state.constitution=state.constitution===c?'':c;render();}
function selectSeason(s){state.season=state.season===s?'':s;render();}
function selectIngredient(i){state.ingredient=state.ingredient===i?'':i;render();}
function onSearch(){
  state.loading=true; state.hasSearched=true; render();
  setTimeout(()=>{state.results=filterRecipes();state.loading=false;render();},500);
}
function onReset(){state.constitution='';state.season='';state.ingredient='';state.keyword='';state.hasSearched=false;state.results=recipes;render();}
function toggle(key){expanded[key]=!expanded[key];render();}

function render(){
  const app=document.getElementById('app');
  let chipsC=constitutions.map(c=>`<button class="chip ${state.constitution===c?'active':''}" onclick="selectConstitution('${c}')">${c}</button>`).join('');
  let chipsS=seasons.map(s=>`<button class="chip season ${state.season===s?'active':''}" onclick="selectSeason('${s}')">${s}</button>`).join('');
  let chipsI=commonIngredients.map(i=>`<button class="chip ingredient ${state.ingredient===i?'active':''}" onclick="selectIngredient('${i}')">${i}</button>`).join('');

  let cards='';
  if(state.loading){
    cards=`<div class="loading"><div class="loader"></div><p>正在检索古籍 · AI 解读中…</p></div>`;
  }else if(state.results.length===0){
    cards=`<div class="loading"><p>未检索到对应的古籍药膳，请尝试放宽条件</p></div>`;
  }else{
    cards=state.results.map(r=>{
      const srcId=`src-${r.id}`, modId=`mod-${r.id}`;
      const sourcesHtml=r.sources.map(s=>`
        <div class="source">
          <div class="src-head">
            <span class="book">${s.book}</span>
            <span class="dynasty">${s.dynasty||''}</span>
            <span class="author">${s.author?'· '+s.author:''}</span>
            <span class="page">〔${s.page||''}〕</span>
          </div>
          <blockquote class="original"><span class="quote-mark">「</span>${s.originalText}<span class="quote-mark">」</span></blockquote>
        </div>
      `).join('');
      const effTags=r.efficacies.map(e=>`<span class="tag efficacy">${e}</span>`).join('');
      const ings=r.ingredients.map(i=>`<li><span class="ing-name">${i.name}</span><span class="ing-amount">${i.amount}</span>${i.nature?`<span class="ing-nature">${i.nature}</span>`:''}</li>`).join('');
      const steps=r.steps.map((s,idx)=>`<li><span class="step-no">${idx+1}</span><span class="step-text">${s}</span></li>`).join('');
      const okTags=r.suitableConstitutions.map(c=>`<span class="tag ok">${c}</span>`).join('');
      const seaTags=r.suitableSeasons.map(s=>`<span class="tag season">${s}</span>`).join('');
      const tabTags=r.taboos.map(t=>`<span class="tag warn">⚠ ${t}</span>`).join('');
      return `
      <article class="card">
        <div class="cover">
          <img src="${r.image}" alt="${r.name}" loading="lazy"/>
          <div class="cover-mask"></div>
          <div class="cover-meta">
            <span class="badge diff">${r.difficulty}</span>
            <span class="badge">⏱ ${r.cookingTime}</span>
          </div>
          <h3 class="name">${r.name}</h3>
        </div>
        <div class="body">
          <p class="intro">${r.intro}</p>
          <div class="tags">${effTags}</div>
          <section class="section">
            <header class="sec-head" onclick="toggle('${srcId}')">
              <span class="sec-title"><span class="seal">典</span> 古籍出处 <small style="color:var(--ink-muted);font-weight:400">${r.sources.length}</small></span>
              <span class="toggle">${expanded[srcId]?'收起':'展开'}</span>
            </header>
            ${expanded[srcId]?`<div class="sec-body">${sourcesHtml}</div>`:''}
          </section>
          <section class="section">
            <header class="sec-head" onclick="toggle('${modId}')">
              <span class="sec-title"><span class="seal accent">今</span> 白话解读 · 古为今用</span>
              <span class="toggle">${expanded[modId]?'收起':'展开'}</span>
            </header>
            ${expanded[modId]?`<p class="sec-body interpretation">${r.modernInterpretation}</p>`:''}
          </section>
          <section class="section">
            <header class="sec-head" style="cursor:default"><span class="sec-title"><span class="seal green">材</span> 食材配伍</span></header>
            <ul class="ingredients">${ings}</ul>
          </section>
          <section class="section">
            <header class="sec-head" style="cursor:default"><span class="sec-title"><span class="seal">法</span> 烹制步骤</span></header>
            <ol class="steps">${steps}</ol>
          </section>
          <section class="meta-grid">
            <div class="meta-row"><span class="meta-label">宜体质</span><div class="meta-tags">${okTags}</div></div>
            <div class="meta-row"><span class="meta-label">宜时令</span><div class="meta-tags">${seaTags}</div></div>
            <div class="meta-row"><span class="meta-label">慎&nbsp;&nbsp;忌</span><div class="meta-tags">${tabTags}</div></div>
          </section>
        </div>
      </article>`;
    }).join('');
  }

  const resultTags=[];
  if(state.constitution) resultTags.push(`<span class="result-tag">${state.constitution} ×</span>`);
  if(state.season) resultTags.push(`<span class="result-tag">${state.season}季 ×</span>`);
  if(state.ingredient) resultTags.push(`<span class="result-tag">${state.ingredient} ×</span>`);
  if(state.keyword) resultTags.push(`<span class="result-tag">「${state.keyword}」 ×</span>`);

  app.innerHTML=`
    <header class="hero">
      <div class="hero-content">
        <div class="hero-tag">社会公益 · 古籍活化</div>
        <h1 class="hero-title">
          <span>古籍药膳食谱</span>
          <span class="title-sub">可视化生成器</span>
        </h1>
        <p class="hero-desc">
          输入体质 · 时令 · 食材，从《本草纲目》《饮膳正要》等古籍中检索对应条目，AI 解读古文并生成「古为今用」的药膳食谱卡。<br/>
          为亚健康人群，寻一味适合自己的养生餐。
        </p>
        <div class="hero-stats">
          <div class="stat"><div class="stat-num">${recipes.length}</div><div class="stat-label">古籍药膳</div></div>
          <div class="stat-divider"></div>
          <div class="stat"><div class="stat-num">4</div><div class="stat-label">经典医籍</div></div>
          <div class="stat-divider"></div>
          <div class="stat"><div class="stat-num">9</div><div class="stat-label">体质辨识</div></div>
        </div>
      </div>
    </header>
    <main class="main">
      <aside class="side">
        <section class="panel">
          <div>
            <div class="label"><span class="label-cn">体质辨识</span><span class="label-en">Constitution</span></div>
            <div class="chips">${chipsC}</div>
          </div>
          <div>
            <div class="label"><span class="label-cn">时令季节</span><span class="label-en">Season</span></div>
            <div class="chips">${chipsS}</div>
          </div>
          <div>
            <div class="label"><span class="label-cn">常用食材</span><span class="label-en">Ingredient</span></div>
            <div class="chips">${chipsI}</div>
          </div>
          <div>
            <div class="label"><span class="label-cn">关键字</span><span class="label-en">Keyword</span></div>
            <input type="text" class="keyword-input" placeholder="搜索药膳名 / 功效 / 症状..." value="${state.keyword}" oninput="state.keyword=this.value" onkeyup="if(event.key==='Enter')onSearch()"/>
          </div>
          <div class="actions">
            <button class="btn primary" onclick="onSearch()">⟡ 检索古方</button>
            <button class="btn ghost" onclick="onReset()">重置</button>
          </div>
        </section>
        <div class="tip">
          <div class="tip-title">⟡ 古籍小贴士</div>
          <p>《饮膳正要》为元代忽思慧所撰，是中国第一部营养学专著，太医忽思慧专为皇室调配「食药同源」之膳食，强调「饮食有节，起居有常」。</p>
        </div>
      </aside>
      <section class="content">
        <div class="content-head">
          <h2 class="content-title">${state.hasSearched?'检索结果':'推荐药膳'}<small class="content-count">共 ${state.results.length} 方</small></h2>
          ${state.hasSearched?`<div class="result-tags">${resultTags.join('')}</div>`:''}
        </div>
        <div class="grid">${cards}</div>
      </section>
    </main>
    <footer class="footer">
      <p>本站药膳方剂整理自《本草纲目》《饮膳正要》《神农本草经》《金匮要略》等古籍，仅供养生参考，不替代专业医疗建议。</p>
      <p class="footer-sub">© 古籍药膳食谱可视化生成器 · 创意演示</p>
    </footer>
  `;
}

render();
</script>
</body>
</html>
