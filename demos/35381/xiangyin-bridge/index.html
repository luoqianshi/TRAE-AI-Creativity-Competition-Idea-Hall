<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>乡音桥 - 方言翻译助手</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- 顶部标题 -->
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">🌉</span>
                <h1>乡音桥</h1>
            </div>
            <p class="subtitle">让方言不再成为沟通的墙</p>
        </header>

        <!-- 场景选择 -->
        <section class="scene-selector">
            <h2>选择使用场景</h2>
            <div class="scene-grid">
                <button class="scene-btn active" data-scene="medical">
                    <span class="scene-icon">🏥</span>
                    <span class="scene-label">去医院</span>
                </button>
                <button class="scene-btn" data-scene="shopping">
                    <span class="scene-icon">🛒</span>
                    <span class="scene-label">去购物</span>
                </button>
                <button class="scene-btn" data-scene="family">
                    <span class="scene-icon">👨‍👩‍👧</span>
                    <span class="scene-label">和家人通话</span>
                </button>
                <button class="scene-btn" data-scene="daily">
                    <span class="scene-icon">🗣️</span>
                    <span class="scene-label">日常交流</span>
                </button>
            </div>
        </section>

        <!-- 翻译方向 -->
        <section class="direction-selector">
            <h2>翻译方向</h2>
            <div class="direction-toggle">
                <button class="dir-btn active" data-dir="dialect-to-mandarin">
                    <span class="dir-from">方言</span>
                    <span class="dir-arrow">→</span>
                    <span class="dir-to">普通话</span>
                </button>
                <button class="dir-btn" data-dir="mandarin-to-dialect">
                    <span class="dir-from">普通话</span>
                    <span class="dir-arrow">→</span>
                    <span class="dir-to">方言</span>
                </button>
            </div>
        </section>

        <!-- 方言选择 -->
        <section class="dialect-selector">
            <h2>选择您的方言</h2>
            <select id="dialectSelect" class="dialect-select">
                <option value="cantonese">粤语</option>
                <option value="sichuan">四川话</option>
                <option value="hunan">湖南话</option>
                <option value="hubei">湖北话</option>
                <option value="henan">河南话</option>
                <option value="shandong">山东话</option>
                <option value="northeast">东北话</option>
                <option value="shanghainese">上海话</option>
                <option value="fujian">福建话</option>
                <option value="jiangxi">江西话</option>
            </select>
        </section>

        <!-- 语音录制区域 -->
        <section class="voice-section">
            <div class="voice-hint">
                <p id="voiceHint">按住下方按钮，说出您想说的话</p>
            </div>
            
            <div class="voice-controls">
                <button id="recordBtn" class="record-btn">
                    <span class="record-icon">🎤</span>
                    <span class="record-label">按住说话</span>
                </button>
            </div>

            <!-- 录音状态指示器 -->
            <div id="recordingIndicator" class="recording-indicator hidden">
                <div class="wave-animation">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <p>正在录音...</p>
            </div>
        </section>

        <!-- 翻译结果区域 -->
        <section id="resultSection" class="result-section hidden">
            <div class="result-card">
                <div class="result-original">
                    <h3>原话</h3>
                    <p id="originalText"></p>
                    <button class="play-btn" data-type="original">
                        <span>🔊</span> 播放
                    </button>
                </div>
                
                <div class="result-divider">
                    <span>↓</span>
                </div>
                
                <div class="result-translated">
                    <h3>翻译结果</h3>
                    <p id="translatedText"></p>
                    <button class="play-btn" data-type="translated">
                        <span>🔊</span> 播放
                    </button>
                </div>
            </div>
        </section>

        <!-- 快捷短语 -->
        <section class="quick-phrases">
            <h2>常用短语</h2>
            <div class="phrase-grid" id="phraseGrid">
                <!-- 动态生成 -->
            </div>
        </section>

        <!-- 历史记录 -->
        <section class="history-section">
            <h2>最近翻译</h2>
            <div id="historyList" class="history-list">
                <p class="empty-hint">暂无翻译记录</p>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
