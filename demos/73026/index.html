<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>慢慢 · 大世界</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;700&family=Nunito:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --warm:#FF9F43;
    --deep:#E17055;
    --ink:#5A3320;
    --soft:#9A6A45;
    --gold:#FFD66B;
    --cream:#FFF6E9;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;font-family:'Nunito',sans-serif;color:var(--ink)}
  #world{position:fixed;inset:0;z-index:1;display:block;cursor:pointer}

  .ui{position:fixed;inset:0;z-index:5;pointer-events:none}
  .ui>*{pointer-events:auto}

  .header{
    position:absolute;top:34px;left:0;right:0;text-align:center;
    text-shadow:0 2px 10px rgba(255,255,255,.7);
  }
  .title{
    font-family:'Comfortaa',sans-serif;font-weight:700;font-size:30px;
    letter-spacing:.2em;color:var(--ink);
  }
  .subtitle{margin-top:6px;font-size:12px;letter-spacing:.28em;color:var(--soft);font-weight:300}

  .progress-box{
    position:absolute;bottom:64px;left:50%;transform:translateX(-50%);
    width:340px;
  }
  .progress-glass{
    padding:13px 18px;
    background:rgba(255,250,240,.55);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.7);
    border-radius:16px;
    box-shadow:0 8px 24px rgba(180,90,40,.18);
  }
  .progress-label{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:7px;font-size:12px;letter-spacing:.15em;
    color:var(--soft);font-weight:600;
  }
  .progress-label .pct{color:var(--deep);font-weight:800;font-size:13px}
  .progress-track{height:7px;border-radius:6px;background:rgba(180,90,40,.16);overflow:hidden;position:relative}
  .progress-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,var(--gold),var(--warm),var(--deep));
    border-radius:6px;transition:width .3s ease;
    box-shadow:0 0 12px rgba(255,159,67,.6);position:relative;
  }
  .progress-fill::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
    animation:shine 2s linear infinite;
  }
  @keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

  .hint{
    position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
    font-size:12px;letter-spacing:.2em;color:var(--soft);font-weight:300;
    text-shadow:0 1px 4px rgba(255,255,255,.6);
  }
  .hint .dot{
    display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--warm);margin:0 8px;vertical-align:middle;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}

  .mood{
    position:fixed;left:50%;top:34%;
    transform:translate(-50%,-50%) translateY(10px) scale(.9);
    background:rgba(255,250,240,.94);
    backdrop-filter:blur(8px);
    padding:10px 20px;border-radius:22px;
    font-size:14px;font-weight:700;color:var(--deep);
    white-space:nowrap;
    box-shadow:0 8px 24px rgba(180,90,40,.25);
    border:1px solid rgba(255,255,255,.8);
    opacity:0;pointer-events:none;z-index:6;
    transition:all .4s cubic-bezier(.2,.8,.2,1);
  }
  .mood.show{opacity:1;transform:translate(-50%,-50%) translateY(0) scale(1)}
  .mood::after{
    content:"";position:absolute;bottom:-7px;left:50%;
    transform:translateX(-50%) rotate(45deg);
    width:12px;height:12px;background:rgba(255,250,240,.94);
    border-right:1px solid rgba(255,255,255,.8);
    border-bottom:1px solid rgba(255,255,255,.8);
  }

  .reset-btn{
    position:absolute;top:30px;left:30px;z-index:6;
    width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(255,255,255,.7);
    background:rgba(255,250,240,.55);backdrop-filter:blur(10px);
    color:var(--soft);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .3s;opacity:0;pointer-events:none;
  }
  .reset-btn.show{opacity:1;pointer-events:auto}
  .reset-btn:hover{background:rgba(255,159,67,.3);color:var(--deep);transform:rotate(180deg)}
</style>
</head>
<body>

<canvas id="world"></canvas>

<div class="ui">
  <div class="header">
    <div class="title">慢慢</div>
    <div class="subtitle">大世界 · 你的伙伴</div>
  </div>

  <button class="reset-btn" id="resetBtn" title="重新孵化">↻</button>

  <div class="progress-box">
    <div class="progress-glass">
      <div class="progress-label">
        <span id="progressText">孵化中</span>
        <span class="pct" id="progressPct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <div class="hint" id="hint">
    <span class="dot"></span>点击蛋壳，它会回应你<span class="dot"></span>
  </div>
</div>

<div class="mood" id="mood">我在呢～</div>

<script>
/* ============================================================
   慢慢 · 大世界  ——  全 2D Canvas 手绘风格
   场景：天空 → 远山 → 草地 → 树/花 → 中央孵化台 → 蛋 → 猫
   ============================================================ */

const canvas=document.getElementById('world');
const ctx=canvas.getContext('2d');
let W,H,DPR=Math.min(window.devicePixelRatio||1,2);

function resize(){
  W=window.innerWidth;
  H=window.innerHeight;
  canvas.width=W*DPR;
  canvas.height=H*DPR;
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildWorld();
}
window.addEventListener('resize',resize);

/* ============== 配色 ============== */
const COL={
  skyTop:'#FFD9A8',
  skyMid:'#FFE8C2',
  skyBot:'#FFF4DC',
  cloud:'#FFFFFF',
  mountFar:'#C8B49A',
  mountMid:'#A89A82',
  mountNear:'#8FA074',
  grassLight:'#C8E088',
  grassMid:'#A8CC68',
  grassDark:'#88B04C',
  grassShadow:'#6E9038',
  treeTrunk:'#8B5A3C',
  treeLeaf:'#7CB342',
  treeLeafDark:'#5E9028',
  flower:['#FF6B9D','#FFD66B','#FFFFFF','#FF8A65','#BA68C8','#FFA64D'],
  stone:'#E8D5B8',
  stoneDark:'#C9B89A',
  // 蛋
  eggLight:'#FFF8E8',
  eggMid:'#FFE4B8',
  eggDark:'#F0BD7A',
  eggShadow:'#C99255',
  crack:'#5A3320',
  // 狸花猫
  furLight:'#C4BAA8',
  furMid:'#A89E8C',
  furDark:'#8A8070',
  furShadow:'#6A6052',
  belly:'#F2EBDA',
  bellyDark:'#E0D8C2',
  stripe:'#221E18',
  eyeGreen:'#A8C870',
  eyeGreenDark:'#6B8A3A',
  pupil:'#0F0A06',
  nose:'#D77A6A',
  noseDark:'#A8584C',
  innerEar:'#D4B0AA',
  earEdge:'#5A5048',
  pinkCheek:'rgba(255,170,150,0.5)',
  whisker:'rgba(80,70,60,0.55)'
};

/* ============== 世界元素（一次性生成）============== */
let mountains=[],trees=[],flowers=[],clouds=[],grassBlades=[],groundPatches=[];

function rand(a,b){return a+Math.random()*(b-a)}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}

function buildWorld(){
  mountains=[];trees=[];flowers=[];clouds=[];grassBlades=[];groundPatches=[];
  const groundY=H*0.62;

  // 远山（3 层）
  for(let layer=0;layer<3;layer++){
    const layerData={layer,y:groundY-(2-layer)*15,peaks:[]};
    const count=5+layer*2;
    for(let i=0;i<count;i++){
      layerData.peaks.push({
        x:(i/(count-1))*W+rand(-30,30),
        h:rand(80-layer*15,160-layer*25),
        w:rand(150,250)
      });
    }
    mountains.push(layerData);
  }

  // 树
  for(let i=0;i<14;i++){
    const x=rand(0,W);
    const y=rand(groundY+20,H-40);
    trees.push({
      x,y,
      scale:rand(0.6,1.2),
      flip:Math.random()>0.5,
      leafShade:rand(-0.15,0.15)
    });
  }

  // 花朵
  for(let i=0;i<80;i++){
    flowers.push({
      x:rand(0,W),
      y:rand(groundY+15,H-15),
      color:pick(COL.flower),
      size:rand(3,6),
      rot:rand(0,Math.PI*2)
    });
  }

  // 草丛
  for(let i=0;i<120;i++){
    grassBlades.push({
      x:rand(0,W),
      y:rand(groundY+10,H-10),
      h:rand(6,14),
      lean:rand(-0.2,0.2),
      shade:rand(0.7,1)
    });
  }

  // 草地深色斑块（一次性生成，避免每帧随机闪烁）
  for(let i=0;i<25;i++){
    groundPatches.push({
      x:(i/25)*W+rand(-20,20),
      y:rand(groundY+30,H-20),
      w:rand(20,40),
      h:rand(6,10)
    });
  }

  // 云
  for(let i=0;i<5;i++){
    clouds.push({
      x:rand(0,W),
      y:rand(40,H*0.3),
      scale:rand(0.7,1.4),
      speed:rand(0.08,0.2)
    });
  }
}

/* ============== 绘制各层 ============== */
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H*0.7);
  g.addColorStop(0,COL.skyTop);
  g.addColorStop(0.6,COL.skyMid);
  g.addColorStop(1,COL.skyBot);
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  // 太阳光晕
  const sunX=W*0.78,sunY=H*0.22;
  const sg=ctx.createRadialGradient(sunX,sunY,10,sunX,sunY,180);
  sg.addColorStop(0,'rgba(255,240,200,0.9)');
  sg.addColorStop(0.4,'rgba(255,220,160,0.4)');
  sg.addColorStop(1,'rgba(255,220,160,0)');
  ctx.fillStyle=sg;
  ctx.beginPath();ctx.arc(sunX,sunY,180,0,Math.PI*2);ctx.fill();
  // 太阳本体
  ctx.fillStyle='rgba(255,250,230,0.95)';
  ctx.beginPath();ctx.arc(sunX,sunY,32,0,Math.PI*2);ctx.fill();
}

function drawClouds(t){
  for(const c of clouds){
    c.x+=c.speed;
    if(c.x>W+100)c.x=-100;
    drawCloud(c.x,c.y,c.scale);
  }
}
function drawCloud(x,y,s){
  ctx.fillStyle='rgba(255,255,255,0.9)';
  const parts=[[0,0,28],[24,-6,22],[-22,-4,20],[10,-16,18],[-10,-14,16]];
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(s,s);
  for(const[px,py,r] of parts){
    ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawMountains(){
  const colors=[COL.mountFar,COL.mountMid,COL.mountNear];
  for(let i=0;i<mountains.length;i++){
    const m=mountains[i];
    ctx.fillStyle=colors[i];
    ctx.globalAlpha=0.85-i*0.1;
    for(const p of m.peaks){
      ctx.beginPath();
      ctx.moveTo(p.x-p.w/2,m.y);
      ctx.quadraticCurveTo(p.x,m.y-p.h,p.x+p.w/2,m.y);
      ctx.closePath();
      ctx.fill();
      // 山顶高光
      ctx.fillStyle='rgba(255,255,255,0.25)';
      ctx.beginPath();
      ctx.moveTo(p.x-p.w*0.15,m.y-p.h*0.6);
      ctx.quadraticCurveTo(p.x,m.y-p.h,p.x+p.w*0.05,m.y-p.h*0.5);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle=colors[i];
    }
  }
  ctx.globalAlpha=1;
}

function drawGround(){
  const groundY=H*0.62;
  // 草地渐变
  const g=ctx.createLinearGradient(0,groundY,0,H);
  g.addColorStop(0,COL.grassLight);
  g.addColorStop(0.4,COL.grassMid);
  g.addColorStop(1,COL.grassDark);
  ctx.fillStyle=g;
  ctx.fillRect(0,groundY,W,H-groundY);

  // 草地纹理斑块（用预生成数据，不再每帧随机）
  ctx.fillStyle='rgba(110,144,56,0.25)';
  for(const p of groundPatches){
    ctx.beginPath();
    ctx.ellipse(p.x,p.y,p.w,p.h,0,0,Math.PI*2);
    ctx.fill();
  }
}

function drawGrass(t){
  for(const g of grassBlades){
    const sway=Math.sin(t*1.5+g.x*0.05)*2;
    ctx.strokeStyle=`rgba(80,120,40,${g.shade*0.7})`;
    ctx.lineWidth=1.5;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(g.x,g.y);
    ctx.quadraticCurveTo(g.x+g.lean*5+sway,g.y-g.h*0.6,g.x+g.lean*8+sway*1.5,g.y-g.h);
    ctx.stroke();
  }
}

function drawTree(tree){
  const{s,x,y,scale,flip,leafShade}=tree;
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(flip?-scale:scale,scale);
  // 树干
  ctx.fillStyle=COL.treeTrunk;
  ctx.beginPath();
  ctx.moveTo(-6,0);
  ctx.quadraticCurveTo(-4,-30,-3,-60);
  ctx.lineTo(3,-60);
  ctx.quadraticCurveTo(4,-30,6,0);
  ctx.closePath();
  ctx.fill();
  // 树冠（3 层球）
  const leafCol=leafShade<0?shadeColor(COL.treeLeaf,leafShade):COL.treeLeaf;
  const leafDark=shadeColor(leafCol,-0.15);
  ctx.fillStyle=leafCol;
  ctx.beginPath();ctx.arc(0,-70,30,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(-22,-58,24,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(22,-58,24,0,Math.PI*2);ctx.fill();
  // 暗部
  ctx.fillStyle=leafDark;
  ctx.beginPath();ctx.arc(15,-65,18,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(-18,-50,14,0,Math.PI*2);ctx.fill();
  // 高光
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.beginPath();ctx.arc(-12,-78,10,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawFlower(f){
  ctx.save();
  ctx.translate(f.x,f.y);
  ctx.rotate(f.rot);
  // 茎
  ctx.strokeStyle='#6B9B3C';
  ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,5);ctx.stroke();
  // 花瓣
  ctx.fillStyle=f.color;
  for(let i=0;i<5;i++){
    const a=(i/5)*Math.PI*2;
    ctx.beginPath();
    ctx.ellipse(Math.cos(a)*f.size*0.7,Math.sin(a)*f.size*0.7,f.size*0.6,f.size*0.4,a,0,Math.PI*2);
    ctx.fill();
  }
  // 花心
  ctx.fillStyle='#FFD66B';
  ctx.beginPath();ctx.arc(0,0,f.size*0.4,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function shadeColor(hex,percent){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  const f=(v)=>Math.max(0,Math.min(255,Math.round(v*(1+percent))));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

/* ============== 中央孵化台 ============== */
function drawPlatform(){
  const cx=W/2,cy=H*0.78;
  // 阴影
  ctx.fillStyle='rgba(0,0,0,0.12)';
  ctx.beginPath();
  ctx.ellipse(cx,cy+20,140,18,0,0,Math.PI*2);
  ctx.fill();
  // 石台侧面
  ctx.fillStyle=COL.stoneDark;
  ctx.beginPath();
  ctx.ellipse(cx,cy+12,130,20,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillRect(cx-130,cy-8,260,20);
  // 石台顶面
  const g=ctx.createRadialGradient(cx-30,cy-20,10,cx,cy,140);
  g.addColorStop(0,COL.stone);
  g.addColorStop(1,COL.stoneDark);
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.ellipse(cx,cy-8,130,22,0,0,Math.PI*2);
  ctx.fill();
  // 边缘草
  ctx.strokeStyle=COL.grassShadow;
  ctx.lineWidth=2;
  for(let i=0;i<24;i++){
    const a=(i/24)*Math.PI;
    const x=cx+Math.cos(a)*130;
    const y=cy-8+Math.sin(a)*22;
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x+rand(-3,3),y-rand(4,8));
    ctx.stroke();
  }
}

/* ============== 蛋 ============== */
const eggState={
  progress:0,
  wobble:0,
  shake:0,
  visible:true,
  x:0,y:0,
  vy:0,
  scale:1
};

// 蛋壳斑点预生成（避免每帧随机闪烁）
const eggSpots=[];
for(let i=0;i<30;i++){
  eggSpots.push({
    a:Math.random()*Math.PI*2,
    r:Math.random()*70+10
  });
}

function drawEgg(t){
  if(!eggState.visible)return;
  const cx=W/2;
  const cy=H*0.62;
  eggState.x=cx;
  eggState.y=cy;

  // 漂浮 + 摇晃（基于时间，频率温和）
  const float=Math.sin(t*1.5)*6;
  let rotZ=0,offX=0;
  if(eggState.wobble>0){
    eggState.wobble-=0.012;       // 衰减更慢
    rotZ=Math.sin(t*8)*0.18*eggState.wobble;   // 约 1.3Hz，温和
  }
  if(eggState.shake>0){
    eggState.shake-=0.010;
    // 用多频 sin 叠加代替 Math.random()，避免高频刺眼抖动
    const s=eggState.shake;
    offX=Math.sin(t*18)*7*s*Math.sin(t*5.7);
    rotZ=(Math.sin(t*15)*0.18+Math.cos(t*9)*0.08)*s;
  }

  // 蛋阴影
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.beginPath();
  ctx.ellipse(cx,cy+95,55+float*0.3,12,0,0,Math.PI*2);
  ctx.fill();

  ctx.save();
  ctx.translate(cx+offX,cy+float);
  ctx.rotate(rotZ);
  ctx.scale(eggState.scale,eggState.scale);

  // 蛋身
  const g=ctx.createRadialGradient(-25,-40,5,0,10,100);
  g.addColorStop(0,COL.eggLight);
  g.addColorStop(0.5,COL.eggMid);
  g.addColorStop(1,COL.eggDark);
  ctx.fillStyle=g;
  ctx.beginPath();
  // 蛋形（上尖下圆）
  ctx.moveTo(0,-90);
  ctx.bezierCurveTo(50,-80,60,-20,55,30);
  ctx.bezierCurveTo(50,75,30,95,0,95);
  ctx.bezierCurveTo(-30,95,-50,75,-55,30);
  ctx.bezierCurveTo(-60,-20,-50,-80,0,-90);
  ctx.closePath();
  ctx.fill();

  // 蛋壳纹理斑点（用预生成数据）
  ctx.fillStyle='rgba(200,130,60,0.15)';
  for(const sp of eggSpots){
    ctx.beginPath();
    ctx.ellipse(Math.cos(sp.a)*sp.r*0.7,Math.sin(sp.a)*sp.r*0.8,2,2,0,0,Math.PI*2);
    ctx.fill();
  }

  // 高光
  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.beginPath();
  ctx.ellipse(-20,-30,14,30,-0.3,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.ellipse(-12,-15,5,8,-0.3,0,Math.PI*2);
  ctx.fill();

  // 裂纹（进度 > 40 显示）
  if(eggState.progress>40){
    const alpha=Math.min(1,(eggState.progress-40)/40);
    ctx.strokeStyle=`rgba(90,50,30,${alpha*0.7})`;
    ctx.lineWidth=2.5;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(0,-40);
    ctx.lineTo(-5,-15);
    ctx.lineTo(8,5);
    ctx.lineTo(-3,30);
    ctx.lineTo(6,55);
    ctx.stroke();
    // 分叉
    ctx.lineWidth=1.8;
    ctx.beginPath();
    ctx.moveTo(8,5);ctx.lineTo(20,15);
    ctx.moveTo(-3,30);ctx.lineTo(-18,38);
    ctx.moveTo(6,55);ctx.lineTo(-8,70);
    ctx.stroke();
  }

  ctx.restore();
}

/* ============== 狸花猫 ============== */
const catState={
  visible:false,
  bounce:0,
  happy:0,
  blinkTimer:0,
  blinking:false,
  breathPhase:0
};

function drawCat(t){
  if(!catState.visible)return;
  const cx=W/2;
  const cy=H*0.62;
  const breath=Math.sin(t*1.5)*0.025;
  const bounce=catState.bounce>0?Math.sin(catState.bounce*8)*catState.bounce*30:0;
  catState.bounce=Math.max(0,catState.bounce-0.018);

  // 阴影
  ctx.fillStyle='rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(cx,cy+95,80-bounce*0.5,14,0,0,Math.PI*2);
  ctx.fill();

  ctx.save();
  ctx.translate(cx,cy-10+bounce);
  const s=1+breath;
  ctx.scale(s,s);

  // 开心时整体下压
  const happyScale=catState.happy>0?1-catState.happy*0.05:1;
  catState.happy=Math.max(0,catState.happy-0.02);

  // ===== 尾巴 =====
  ctx.save();
  ctx.translate(75,50);
  const tailSway=Math.sin(t*1.8)*0.15;
  const tailHappy=catState.happy>0?-0.3:0;
  ctx.rotate(0.3+tailSway+tailHappy);
  const tg=ctx.createLinearGradient(-10,0,30,-140);
  tg.addColorStop(0,COL.furDark);
  tg.addColorStop(0.5,COL.furMid);
  tg.addColorStop(1,COL.furLight);
  ctx.fillStyle=tg;
  ctx.beginPath();
  ctx.moveTo(-15,5);
  ctx.quadraticCurveTo(25,-15,40,-70);
  ctx.quadraticCurveTo(50,-120,20,-145);
  ctx.quadraticCurveTo(-8,-148,-12,-125);
  ctx.quadraticCurveTo(10,-105,14,-70);
  ctx.quadraticCurveTo(10,-30,-8,0);
  ctx.closePath();
  ctx.fill();
  // 尾巴环纹
  ctx.strokeStyle=COL.stripe;
  ctx.globalAlpha=0.75;
  ctx.lineWidth=5;
  ctx.lineCap='round';
  for(let i=0;i<4;i++){
    const p=i/4;
    const y=5-p*145;
    const x=Math.sin(p*2)*6+8;
    ctx.beginPath();
    ctx.moveTo(x-12,y);
    ctx.quadraticCurveTo(x+4,y-4,x+15,y+2);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  // 尾尖深黑
  ctx.fillStyle=COL.stripe;
  ctx.beginPath();
  ctx.ellipse(2,-140,12,10,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  // ===== 身体 =====
  ctx.save();
  ctx.translate(0,30);
  ctx.scale(1,happyScale);

  const bg=ctx.createRadialGradient(-25,-50,8,0,-15,120);
  bg.addColorStop(0,COL.furLight);
  bg.addColorStop(0.55,COL.furMid);
  bg.addColorStop(1,COL.furDark);
  ctx.fillStyle=bg;
  ctx.beginPath();
  ctx.moveTo(-80,35);
  ctx.quadraticCurveTo(-88,-25,-50,-60);
  ctx.quadraticCurveTo(-25,-80,0,-80);
  ctx.quadraticCurveTo(25,-80,50,-60);
  ctx.quadraticCurveTo(88,-25,80,35);
  ctx.quadraticCurveTo(65,52,0,52);
  ctx.quadraticCurveTo(-65,52,-80,35);
  ctx.closePath();
  ctx.fill();

  // 背部条纹
  ctx.strokeStyle=COL.stripe;
  ctx.globalAlpha=0.7;
  ctx.lineWidth=4.5;
  ctx.lineCap='round';
  for(let i=0;i<3;i++){
    const y=-50+i*18;
    ctx.beginPath();
    ctx.moveTo(-50,y);
    ctx.quadraticCurveTo(0,y-6,50,y);
    ctx.stroke();
  }
  // 侧条纹
  ctx.lineWidth=3.5;
  for(let side of[-1,1]){
    for(let i=0;i<2;i++){
      const x=side*(50+i*12);
      const y=-25+i*18;
      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.quadraticCurveTo(x+side*6,y+10,x+side*2,y+22);
      ctx.stroke();
    }
  }
  ctx.globalAlpha=1;

  // 肚子奶白
  const bellyG=ctx.createRadialGradient(0,-5,5,0,-5,60);
  bellyG.addColorStop(0,COL.belly);
  bellyG.addColorStop(1,COL.bellyDark);
  ctx.fillStyle=bellyG;
  ctx.beginPath();
  ctx.ellipse(0,-5,38,48,0,0,Math.PI*2);
  ctx.fill();

  // 前爪
  ctx.fillStyle=COL.furMid;
  ctx.beginPath();ctx.ellipse(-26,35,20,16,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(26,35,20,16,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=COL.belly;
  ctx.beginPath();ctx.ellipse(-26,37,13,10,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(26,37,13,10,0,0,Math.PI*2);ctx.fill();
  // 肉垫
  ctx.fillStyle=COL.noseDark;
  for(let s of[-1,1]){
    ctx.beginPath();ctx.ellipse(s*26,35,2.5,2,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(s*26-5,40,2,1.8,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(s*26+5,40,2,1.8,0,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();

  // ===== 头部 =====
  ctx.save();
  ctx.translate(0,-50);
  ctx.scale(1,happyScale);

  // 耳朵
  for(let side of[-1,1]){
    ctx.save();
    ctx.translate(side*60,-42);
    ctx.rotate(side*0.18);
    ctx.fillStyle=COL.furDark;
    ctx.beginPath();
    ctx.moveTo(-18*side,18);
    ctx.quadraticCurveTo(-26*side,-25,-4*side,-38);
    ctx.quadraticCurveTo(18*side,-34,22*side,-8);
    ctx.quadraticCurveTo(20*side,12,8*side,18);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle=COL.innerEar;
    ctx.beginPath();
    ctx.moveTo(-10*side,10);
    ctx.quadraticCurveTo(-12*side,-12,0,-24);
    ctx.quadraticCurveTo(10*side,-18,12*side,-4);
    ctx.quadraticCurveTo(10*side,7,4*side,10);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle=COL.earEdge;
    ctx.beginPath();
    ctx.ellipse(0,-32,6,4,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // 头主体
  const hg=ctx.createRadialGradient(-18,-25,8,0,5,95);
  hg.addColorStop(0,COL.furLight);
  hg.addColorStop(0.55,COL.furMid);
  hg.addColorStop(1,COL.furDark);
  ctx.fillStyle=hg;
  ctx.beginPath();
  ctx.ellipse(0,0,70,64,0,0,Math.PI*2);
  ctx.fill();

  // 头顶柔光
  ctx.fillStyle='rgba(255,250,235,0.25)';
  ctx.beginPath();
  ctx.ellipse(-15,-25,26,15,-0.3,0,Math.PI*2);
  ctx.fill();

  // M纹
  ctx.strokeStyle=COL.stripe;
  ctx.globalAlpha=0.8;
  ctx.lineWidth=4.5;
  ctx.lineCap='round';
  ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(-26,-35);
  ctx.quadraticCurveTo(-18,-46,-8,-36);
  ctx.quadraticCurveTo(-4,-32,0,-38);
  ctx.quadraticCurveTo(4,-32,8,-36);
  ctx.quadraticCurveTo(18,-46,26,-35);
  ctx.stroke();
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(-26,-35);ctx.quadraticCurveTo(-33,-22,-34,-8);ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(26,-35);ctx.quadraticCurveTo(33,-22,34,-8);ctx.stroke();
  ctx.globalAlpha=1;

  // 脸侧条纹
  ctx.strokeStyle=COL.stripe;
  ctx.globalAlpha=0.65;
  ctx.lineWidth=3.5;
  for(let side of[-1,1]){
    ctx.beginPath();
    ctx.moveTo(side*52,-2);
    ctx.quadraticCurveTo(side*62,8,side*54,20);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(side*47,16);
    ctx.quadraticCurveTo(side*57,26,side*50,36);
    ctx.stroke();
  }
  ctx.globalAlpha=1;

  // 脸颊奶白
  const cheekG=ctx.createRadialGradient(0,15,5,0,15,48);
  cheekG.addColorStop(0,COL.belly);
  cheekG.addColorStop(1,'rgba(242,235,218,0)');
  ctx.fillStyle=cheekG;
  ctx.beginPath();ctx.ellipse(-24,15,24,22,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(24,15,24,22,0,0,Math.PI*2);ctx.fill();

  // 腮红
  ctx.fillStyle=COL.pinkCheek;
  ctx.beginPath();ctx.ellipse(-32,25,12,7,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(32,25,12,7,0,0,Math.PI*2);ctx.fill();

  // 眼睛
  const isBlink=catState.blinking;
  const isHappy=catState.happy>0.1;
  if(isBlink){
    ctx.strokeStyle=COL.pupil;
    ctx.lineWidth=3;
    ctx.lineCap='round';
    ctx.beginPath();ctx.arc(-24,4,9,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
    ctx.beginPath();ctx.arc(24,4,9,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
  }else if(isHappy){
    ctx.strokeStyle=COL.pupil;
    ctx.lineWidth=3.5;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(-32,7);ctx.quadraticCurveTo(-24,-2,-16,7);ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(16,7);ctx.quadraticCurveTo(24,-2,32,7);ctx.stroke();
  }else{
    for(let side of[-1,1]){
      const ex=side*24;
      // 眼眶
      ctx.fillStyle=COL.pupil;
      ctx.beginPath();
      ctx.ellipse(ex,4,12,15,0,0,Math.PI*2);
      ctx.fill();
      // 虹膜
      const ig=ctx.createRadialGradient(ex-2,0,2,ex,5,13);
      ig.addColorStop(0,'#C8E088');
      ig.addColorStop(0.6,COL.eyeGreen);
      ig.addColorStop(1,COL.eyeGreenDark);
      ctx.fillStyle=ig;
      ctx.beginPath();
      ctx.ellipse(ex,4,9.5,12,0,0,Math.PI*2);
      ctx.fill();
      // 瞳孔
      ctx.fillStyle=COL.pupil;
      ctx.beginPath();
      ctx.ellipse(ex,4,3,10,0,0,Math.PI*2);
      ctx.fill();
      // 高光
      ctx.fillStyle='#FFFFFF';
      ctx.beginPath();
      ctx.ellipse(ex-3,0,3.5,4,0,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.7)';
      ctx.beginPath();
      ctx.ellipse(ex+3,7,1.8,2,0,0,Math.PI*2);
      ctx.fill();
    }
  }

  // 鼻子
  ctx.fillStyle=COL.nose;
  ctx.beginPath();
  ctx.moveTo(0,24);
  ctx.lineTo(-6,30);
  ctx.lineTo(6,30);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.beginPath();ctx.ellipse(-2,26,1.8,1,0,0,Math.PI*2);ctx.fill();

  // 嘴
  ctx.strokeStyle='#5A4838';
  ctx.lineWidth=1.8;
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(0,30);ctx.lineTo(0,36);ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0,36);
  ctx.quadraticCurveTo(-6,41,-10,38);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0,36);
  ctx.quadraticCurveTo(6,41,10,38);
  ctx.stroke();

  // 胡须
  ctx.strokeStyle=COL.whisker;
  ctx.lineWidth=1.2;
  ctx.lineCap='round';
  for(let i=0;i<2;i++){
    const y=28+i*4;
    ctx.beginPath();
    ctx.moveTo(-18,y);ctx.quadraticCurveTo(-36,y-2,-50,y-3);ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(18,y);ctx.quadraticCurveTo(36,y-2,50,y-3);ctx.stroke();
  }

  ctx.restore();
  ctx.restore();

  // 眨眼计时
  catState.blinkTimer+=0.016;
  if(catState.blinkTimer>3+Math.random()*2){
    catState.blinking=true;
    catState.blinkTimer=0;
    setTimeout(()=>catState.blinking=false,140);
  }
}

/* ============== 蛋壳碎片 ============== */
const shellPieces=[];
function spawnShellPieces(){
  const cx=W/2,cy=H*0.62;
  for(let i=0;i<14;i++){
    shellPieces.push({
      x:cx,
      y:cy,
      vx:(Math.random()-0.5)*8,
      vy:-Math.random()*8-3,
      r:rand(8,14),
      rot:Math.random()*Math.PI*2,
      spin:(Math.random()-0.5)*0.4
    });
  }
}
function drawShellPieces(){
  for(let i=shellPieces.length-1;i>=0;i--){
    const p=shellPieces[i];
    p.vy+=0.25;          // 重力温和一些
    p.x+=p.vx;
    p.y+=p.vy;
    p.rot+=p.spin;
    const groundY=H*0.78;
    if(p.y>groundY&&p.vy>0){
      p.vy*=-0.3;
      p.vx*=0.6;
      p.y=groundY;
      if(Math.abs(p.vy)<1){
        shellPieces.splice(i,1);
        continue;
      }
    }
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);
    const g=ctx.createLinearGradient(-p.r,0,p.r,0);
    g.addColorStop(0,COL.eggMid);
    g.addColorStop(1,COL.eggDark);
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.ellipse(0,0,p.r,p.r*0.7,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

/* ============== 浮动粒子 ============== */
const particles=[];
for(let i=0;i<40;i++){
  particles.push({
    x:Math.random()*W,
    y:Math.random()*H,
    r:Math.random()*2+0.5,
    vy:-Math.random()*0.4-0.1,
    vx:(Math.random()-0.5)*0.2,
    a:Math.random()*0.5+0.2,
    tw:Math.random()*Math.PI*2
  });
}
function drawParticles(t){
  for(const p of particles){
    p.y+=p.vy;
    p.x+=p.vx;
    p.tw+=0.03;
    if(p.y<-10){p.y=H+10;p.x=Math.random()*W}
    if(p.x<-10)p.x=W+10;
    if(p.x>W+10)p.x=-10;
    const tw=(Math.sin(p.tw)+1)/2;
    const a=p.a*(0.5+tw*0.5);
    ctx.fillStyle=`rgba(255,220,150,${a})`;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*2,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle=`rgba(255,240,200,${a*1.2})`;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  }
}

/* ============== 主循环 ============== */
function render(tMs){
  const t=tMs/1000;   // 时间戳是毫秒，转成秒，避免频率被放大 1000 倍
  ctx.clearRect(0,0,W,H);
  drawSky();
  drawClouds(t);
  drawMountains();
  drawGround();
  drawGrass(t);
  // 花
  for(const f of flowers)drawFlower(f);
  // 远树先
  const sortedTrees=[...trees].sort((a,b)=>a.y-b.y);
  for(const tr of sortedTrees){
    if(tr.y<H*0.78)drawTree(tr);
  }
  drawPlatform();
  // 近树
  for(const tr of sortedTrees){
    if(tr.y>=H*0.78)drawTree(tr);
  }
  drawEgg(t);
  drawCat(t);
  drawShellPieces();
  drawParticles(t);
  requestAnimationFrame(render);
}

/* ============== 初始化 ============== */
resize();
requestAnimationFrame(render);

/* ============== 孵化逻辑 ============== */
const progressFill=document.getElementById('progressFill');
const progressPct=document.getElementById('progressPct');
const progressText=document.getElementById('progressText');
const hint=document.getElementById('hint');
const mood=document.getElementById('mood');
const resetBtn=document.getElementById('resetBtn');

let progress=0;
let hatched=false;
let cracking=false;

function setProgress(v){
  progress=Math.min(100,Math.max(0,v));
  progressFill.style.width=progress+'%';
  progressPct.textContent=Math.floor(progress)+'%';
  eggState.progress=progress;
  if(progress>=100&&!hatched)hatch();
}

// 自动增长
setInterval(()=>{
  if(!hatched&&!cracking&&progress<92){
    setProgress(progress+0.2);
  }
},250);

function showMood(text){
  mood.textContent=text;
  mood.classList.add('show');
  clearTimeout(showMood._t);
  showMood._t=setTimeout(()=>mood.classList.remove('show'),1800);
}

// 点击检测
canvas.addEventListener('click',e=>{
  const x=e.clientX,y=e.clientY;
  if(!hatched&&!cracking){
    // 蛋的碰撞框
    const ex=W/2,ey=H*0.62;
    if(Math.abs(x-ex)<70&&Math.abs(y-ey)<100){
      eggState.wobble=1;
      setProgress(progress+3);
      showMood(['你在呀～','嗯嗯，我在','再摸摸我','好暖','我感觉到了'][Math.floor(Math.random()*5)]);
    }
  }else if(catState.visible){
    const ex=W/2,ey=H*0.55;
    if(Math.abs(x-ex)<90&&Math.abs(y-ey)<120){
      petCat();
    }
  }
});

function petCat(){
  catState.happy=1;
  showMood(['喵～','蹭蹭你','咕噜咕噜','再摸摸','最喜欢你了'][Math.floor(Math.random()*5)]);
}

function hatch(){
  hatched=true;cracking=true;
  progressText.textContent='破壳中';
  hint.style.opacity='0';
  eggState.shake=1;
  setTimeout(()=>{
    spawnShellPieces();
    eggState.scale=0;
    setTimeout(()=>{
      eggState.visible=false;
      catState.visible=true;
      catState.bounce=1;
      progressText.textContent='它来啦';
      progressPct.textContent='♡';
      setTimeout(()=>showMood('你回来啦～'),500);
      resetBtn.classList.add('show');
      cracking=false;
    },300);
  },800);
}

resetBtn.addEventListener('click',()=>{
  hatched=false;cracking=false;
  progress=0;
  setProgress(0);
  progressText.textContent='孵化中';
  hint.style.opacity='1';
  eggState.visible=true;
  eggState.scale=1;
  eggState.shake=0;
  eggState.wobble=0;
  catState.visible=false;
  catState.happy=0;
  catState.bounce=0;
  shellPieces.length=0;
  resetBtn.classList.remove('show');
  mood.classList.remove('show');
});
</script>
