<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>视频转码工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { -webkit-overflow-scrolling: touch; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.5rem 0.75rem;
  }
  .container { width: 100%; max-width: 720px; }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 0.4rem;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    text-align: center;
    color: #94a3b8;
    font-size: 0.85rem;
    margin-bottom: 1.5rem;
    line-height: 1.5;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 0.85rem;
  }
  .card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.85rem; }
  .upload-area {
    border: 2px dashed #334155;
    border-radius: 8px;
    padding: 2rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    -webkit-user-select: none;
    user-select: none;
  }
  .upload-area:hover { border-color: #38bdf8; background: rgba(56,189,248,0.05); }
  .upload-area.dragover { border-color: #38bdf8; background: rgba(56,189,248,0.1); }
  .upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-icon { font-size: 2.2rem; margin-bottom: 0.6rem; color: #38bdf8; }
  .upload-text { color: #94a3b8; font-size: 0.85rem; line-height: 1.5; }
  .upload-text strong { color: #38bdf8; }
  .file-info {
    display: none;
    align-items: center;
    gap: 0.7rem;
    padding: 0.7rem 0.9rem;
    background: rgba(56,189,248,0.08);
    border: 1px solid #334155;
    border-radius: 8px;
    margin-top: 0.85rem;
  }
  .file-info.show { display: flex; }
  .file-details { flex: 1; min-width: 0; }
  .file-name { font-weight: 500; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-meta { font-size: 0.75rem; color: #94a3b8; margin-top: 0.2rem; }
  .file-remove { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 1.2rem; padding: 0.25rem; line-height: 1; }
  .file-remove:hover { color: #ef4444; }
  .settings-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.85rem; }
  .setting-item { display: flex; flex-direction: column; gap: 0.3rem; }
  .setting-item.full-width { grid-column: 1 / -1; }
  .setting-label { font-size: 0.75rem; color: #94a3b8; font-weight: 500; }
  .setting-value { font-size: 0.9rem; font-weight: 600; }
  .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.4rem; }
  .tag { font-size: 0.7rem; padding: 0.22rem 0.55rem; border-radius: 4px; background: rgba(56,189,248,0.1); color: #38bdf8; border: 1px solid rgba(56,189,248,0.2); }
  .btn {
    width: 100%;
    padding: 0.85rem 1rem;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    color: #fff;
    transition: all 0.2s ease;
    -webkit-appearance: none;
    appearance: none;
    font-family: inherit;
  }
  .btn:hover:not(:disabled) { opacity: 0.9; }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-success { background: #22c55e; text-decoration: none; display: inline-block; }
  .alert {
    padding: 0.85rem 1rem;
    border-radius: 8px;
    margin-bottom: 0.85rem;
    display: none;
    align-items: flex-start;
    gap: 0.6rem;
  }
  .alert.show { display: flex; }
  .alert-danger { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
  .alert-success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
  .alert-warning { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); color: #fcd34d; }
  .alert-icon { font-size: 1.15rem; flex-shrink: 0; line-height: 1.3; }
  .alert-content { font-size: 0.85rem; line-height: 1.5; }
  .result-area { display: none; text-align: center; }
  .result-area.show { display: block; }
  .result-video { width: 100%; border-radius: 8px; margin-bottom: 0.85rem; background: #000; }
  .hidden-media {
    position: fixed;
    top: -9999px;
    left: -9999px;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
  }
  .hint-box {
    background: rgba(129, 140, 248, 0.08);
    border: 1px solid rgba(129, 140, 248, 0.25);
    color: #c7d2fe;
    padding: 0.7rem 0.9rem;
    border-radius: 8px;
    font-size: 0.78rem;
    line-height: 1.5;
    margin-top: 0.85rem;
  }
  @media (max-width: 480px) {
    .settings-grid { grid-template-columns: 1fr; }
    h1 { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>视频转码工具</h1>
  <p class="subtitle">将视频转换为 H.264 + AAC 编码的 MP4 格式<br>自动 16:9 裁剪 · 保留原画质和帧率</p>

  <div id="alertBox" class="alert"><span class="alert-icon">⚠</span><div class="alert-content" id="alertContent"></div></div>

  <div class="card">
    <div class="card-title">选择视频文件</div>
    <div class="upload-area" id="uploadArea">
      <input type="file" id="fileInput" accept="video/*">
      <div class="upload-icon">📁</div>
      <div class="upload-text"><strong>点击选择文件</strong><br>或拖拽视频到此处</div>
    </div>
    <div class="file-info" id="fileInfo">
      <span style="font-size:1.3rem;flex-shrink:0;">🎬</span>
      <div class="file-details">
        <div class="file-name" id="fileName">-</div>
        <div class="file-meta" id="fileMeta">-</div>
      </div>
      <button class="file-remove" id="fileRemove">&times;</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">输出设置</div>
    <div class="settings-grid">
      <div class="setting-item"><span class="setting-label">视频编码</span><span class="setting-value">H.264 (高画质)</span></div>
      <div class="setting-item"><span class="setting-label">音频编码</span><span class="setting-value">AAC</span></div>
      <div class="setting-item"><span class="setting-label">容器格式</span><span class="setting-value">MP4</span></div>
      <div class="setting-item"><span class="setting-label">画面比例</span><span class="setting-value">16:9 自动裁剪</span></div>
      <div class="setting-item full-width">
        <span class="setting-label">限制条件</span>
        <div class="tags"><span class="tag">时长 ≤ 1分30秒</span><span class="tag">大小 ≤ 50MB</span></div>
      </div>
    </div>
    <div class="hint-box" id="hintBox">💡 兼容 Chrome / Edge / Safari 及手机浏览器。iOS 用户首次使用需在弹窗允许播放。</div>
  </div>

  <div class="card result-area" id="resultArea">
    <div class="card-title">转换完成</div>
    <video class="result-video" id="resultVideo" controls playsinline></video>
    <a id="downloadLink" class="btn btn-success" download="converted_video.mp4" style="display:inline-block;width:auto;padding:0.75rem 1.5rem;">⬇ 下载转换后的视频</a>
  </div>

  <button class="btn" id="convertBtn" disabled>开始转换</button>
</div>

<!-- 隐藏的处理元素 -->
<video id="hiddenVideo" class="hidden-media" muted playsinline webkit-playsinline></video>
<canvas id="hiddenCanvas" class="hidden-media"></canvas>

<script>
(function() {
  'use strict';

  const MAX_DURATION = 90;
  const MAX_SIZE = 50 * 1024 * 1024;
  const MAX_WIDTH = 1920;   // 限制最大输出宽度（避免内存过大）
  const MAX_HEIGHT = 1080;

  const fileInput = document.getElementById('fileInput');
  const uploadArea = document.getElementById('uploadArea');
  const fileInfo = document.getElementById('fileInfo');
  const fileName = document.getElementById('fileName');
  const fileMeta = document.getElementById('fileMeta');
  const fileRemove = document.getElementById('fileRemove');
  const convertBtn = document.getElementById('convertBtn');
  const resultArea = document.getElementById('resultArea');
  const resultVideo = document.getElementById('resultVideo');
  const downloadLink = document.getElementById('downloadLink');
  const alertBox = document.getElementById('alertBox');
  const alertContent = document.getElementById('alertContent');
  const hiddenVideo = document.getElementById('hiddenVideo');
  const hiddenCanvas = document.getElementById('hiddenCanvas');
  const hintBox = document.getElementById('hintBox');

  let selectedFile = null;
  let outputExtension = 'mp4';
  let outputMimeType = 'video/mp4';

  // 检测浏览器环境
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isSafari = /^((?!chrome|android).)*safari/i.test(ua) || isIOS;

  if (isIOS) {
    hintBox.innerHTML = '📱 iOS 用户：由于系统限制，转换后请手动长按下载按钮并选择"下载链接"保存视频。';
  }

  function formatSize(bytes) {
    const units = ['B', 'KB', 'MB', 'GB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(2) + ' ' + units[i];
  }
  function formatDuration(s) {
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + '分' + String(sec).padStart(2, '0') + '秒';
  }
  function showAlert(type, msg) {
    alertBox.className = 'alert alert-' + type + ' show';
    alertContent.textContent = msg;
  }
  function hideAlert() { alertBox.className = 'alert'; }

  function updateFileInfo(file) {
    selectedFile = file;
    fileName.textContent = file.name;
    fileMeta.textContent = formatSize(file.size) + ' · ' + (file.type || '视频文件');
    fileInfo.classList.add('show');
    convertBtn.disabled = false;
    hideAlert();
    resultArea.classList.remove('show');
  }
  function clearFile() {
    selectedFile = null;
    fileInfo.classList.remove('show');
    fileInput.value = '';
    convertBtn.disabled = false;
    resultArea.classList.remove('show');
    hideAlert();
  }

  uploadArea.addEventListener('click', function() { fileInput.click(); });
  uploadArea.addEventListener('touchstart', function(e) {
    // iOS 触摸优先
  }, { passive: true });

  uploadArea.addEventListener('dragover', function(e) {
    e.preventDefault();
    uploadArea.classList.add('dragover');
  });
  uploadArea.addEventListener('dragleave', function() { uploadArea.classList.remove('dragover'); });
  uploadArea.addEventListener('drop', function(e) {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    const files = e.dataTransfer.files;
    if (files.length > 0 && files[0].type.startsWith('video/')) {
      updateFileInfo(files[0]);
    } else if (files.length > 0) {
      // 某些手机不识别 type，检查扩展名
      const name = files[0].name.toLowerCase();
      if (/\.(mp4|mov|m4v|webm|mkv|avi|flv|3gp|ogv|ogg)$/.test(name)) {
        updateFileInfo(files[0]);
      } else {
        showAlert('warning', '请上传有效的视频文件');
      }
    } else {
      showAlert('warning', '请上传有效的视频文件');
    }
  });

  fileInput.addEventListener('change', function(e) {
    if (e.target.files.length > 0) updateFileInfo(e.target.files[0]);
  });
  fileRemove.addEventListener('click', clearFile);

  // 获取支持的视频 MIME 类型
  function getSupportedMimeType() {
    const candidates = [
      // MP4 (Chrome/Edge/部分新版 Safari)
      { type: 'video/mp4; codecs="avc1.4D401E,mp4a.40.2"', ext: 'mp4', mime: 'video/mp4' },
      { type: 'video/mp4; codecs="avc1.42001E,mp4a.40.2"', ext: 'mp4', mime: 'video/mp4' },
      { type: 'video/mp4; codecs="h264,aac"', ext: 'mp4', mime: 'video/mp4' },
      { type: 'video/mp4', ext: 'mp4', mime: 'video/mp4' },
      // WebM 备选 (Firefox/部分 Safari)
      { type: 'video/webm; codecs="vp9,opus"', ext: 'webm', mime: 'video/webm' },
      { type: 'video/webm; codecs="vp8,opus"', ext: 'webm', mime: 'video/webm' },
      { type: 'video/webm; codecs="vp9"', ext: 'webm', mime: 'video/webm' },
      { type: 'video/webm', ext: 'webm', mime: 'video/webm' }
    ];
    for (const c of candidates) {
      try {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(c.type)) return c;
      } catch(e) {}
    }
    return null;
  }

  // 根据分辨率计算合适的高码率
  function calculateBitrate(width, height, fps) {
    // 基础：按像素数计算，使用较高的系数以保留画质
    // 720p30 ≈ 6000kbps, 1080p30 ≈ 12000kbps
    const pixelCount = width * height;
    const fpsFactor = (fps || 30) / 30;
    let bitrate = Math.round(pixelCount * 0.055 * fpsFactor);

    // 限制范围
    bitrate = Math.max(1500000, Math.min(bitrate, 20000000)); // 1.5M - 20M
    return bitrate;
  }

  // 估算原始帧率：通过短时间采样帧数
  async function detectFramerate(videoEl) {
    return new Promise(function(resolve) {
      if (typeof videoEl.getVideoPlaybackQuality === 'function') {
        try {
          const q = videoEl.getVideoPlaybackQuality();
          // totalVideoFrames 在开始播放后才会有值，无法立即使用
        } catch(e) {}
      }
      // 使用 requestVideoFrameCallback (现代浏览器)
      if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
        let start = 0;
        let frames = 0;
        let maxFrames = 30;
        const callback = function() {
          if (start === 0) start = performance.now();
          frames++;
          if (frames >= maxFrames || videoEl.ended || videoEl.paused) {
            const elapsed = (performance.now() - start) / 1000;
            const fps = elapsed > 0 ? Math.round(frames / elapsed) : 30;
            resolve(Math.max(15, Math.min(fps, 120)));
          } else {
            try { videoEl.requestVideoFrameCallback(callback); }
            catch(e) { resolve(30); }
          }
        };
        try { videoEl.requestVideoFrameCallback(callback); }
        catch(e) { resolve(30); }
        return;
      }
      // 后备：根据视频元数据估算
      resolve(30);
    });
  }

  let currentUrl = null;

  convertBtn.addEventListener('click', async function() {
    if (!selectedFile) return;

    hideAlert();
    resultArea.classList.remove('show');
    convertBtn.disabled = true;
    const originalText = convertBtn.textContent;
    convertBtn.textContent = '分析中...';

    // 清理旧的 blob URL
    if (currentUrl) { try { URL.revokeObjectURL(currentUrl); } catch(e) {} currentUrl = null; }

    try {
      const format = getSupportedMimeType();
      if (!format || !window.MediaRecorder) {
        showAlert('warning', '当前浏览器不支持视频录制。请使用 Chrome、Edge 或新版 Safari。');
        convertBtn.disabled = false;
        convertBtn.textContent = originalText;
        return;
      }
      outputExtension = format.ext;
      outputMimeType = format.mime;

      const url = URL.createObjectURL(selectedFile);
      currentUrl = url;

      // iOS/Safari: muted 属性必须保留以允许自动播放
      hiddenVideo.muted = true;
      hiddenVideo.src = url;
      hiddenVideo.setAttribute('playsinline', '');
      hiddenVideo.setAttribute('webkit-playsinline', '');

      await new Promise(function(resolve, reject) {
        const timeout = setTimeout(function() { reject(new Error('视频加载超时')); }, 15000);
        hiddenVideo.onloadedmetadata = function() { clearTimeout(timeout); resolve(); };
        hiddenVideo.onerror = function() { clearTimeout(timeout); reject(new Error('视频加载失败，请检查文件格式')); };
      });

      const duration = hiddenVideo.duration;
      const size = selectedFile.size;
      const vw = hiddenVideo.videoWidth;
      const vh = hiddenVideo.videoHeight;

      if (!duration || duration <= 0 || !vw || !vh) {
        showAlert('warning', '无法识别视频信息。请尝试其他文件。');
        convertBtn.disabled = false;
        convertBtn.textContent = originalText;
        return;
      }

      // 限制检查：时长
      if (duration > MAX_DURATION) {
        showAlert('danger', '视频时长超过限制（' + formatDuration(duration) + ' > 1分30秒），无法转换。请剪辑视频后再试。');
        convertBtn.disabled = false;
        convertBtn.textContent = originalText;
        return;
      }
      // 限制检查：大小
      if (size > MAX_SIZE) {
        showAlert('danger', '视频文件大小超过限制（' + formatSize(size) + ' > 50MB），无法转换。请压缩视频后再试。');
        convertBtn.disabled = false;
        convertBtn.textContent = originalText;
        return;
      }

      // 计算输出尺寸 (16:9, 保留原画宽但不超过 1920x1080)
      const targetRatio = 16 / 9;
      const videoRatio = vw / vh;

      // 输出尺寸：以原始宽度为基础，但限制最大值
      let outWidth = Math.min(vw, MAX_WIDTH);
      let outHeight = Math.round(outWidth / targetRatio);
      // 确保高度是偶数（编码要求）
      if (outHeight % 2 !== 0) outHeight--;
      outWidth = outHeight * targetRatio; // 修正为精确 16:9
      outWidth = Math.round(outWidth);

      // 计算裁剪参数（居中裁剪为 16:9）
      let sx, sy, sw, sh;
      if (Math.abs(videoRatio - targetRatio) < 0.01) {
        // 已经是 16:9
        sx = 0; sy = 0; sw = vw; sh = vh;
      } else if (videoRatio > targetRatio) {
        // 视频更宽，裁剪左右
        sh = vh;
        sw = Math.round(vh * targetRatio);
        sx = Math.round((vw - sw) / 2);
        sy = 0;
      } else {
        // 视频更高，裁剪上下
        sw = vw;
        sh = Math.round(vw / targetRatio);
        sx = 0;
        sy = Math.round((vh - sh) / 2);
      }

      // 设置 canvas
      const ctx = hiddenCanvas.getContext('2d');
      hiddenCanvas.width = outWidth;
      hiddenCanvas.height = outHeight;

      // 尝试播放以检测帧率（iOS 需要用户手势上下文，这里已在点击里）
      convertBtn.textContent = '准备中 0%';

      // 播放少量帧以检测帧率
      let detectedFps = 30;
      try {
        hiddenVideo.currentTime = 0;
        const playPromise = hiddenVideo.play();
        if (playPromise && playPromise.catch) playPromise.catch(function(){});

        // 等待 1 秒检测帧率
        let fpsDetected = false;
        if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
          let fcount = 0;
          let tstart = performance.now();
          const fp = function() {
            fcount++;
            if (performance.now() - tstart < 500 && !fpsDetected) {
              try { hiddenVideo.requestVideoFrameCallback(fp); } catch(e){}
            } else {
              const elapsed = (performance.now() - tstart) / 1000;
              if (elapsed > 0 && fcount > 1) {
                detectedFps = Math.max(15, Math.min(Math.round(fcount / elapsed), 120));
              }
              fpsDetected = true;
            }
          };
          try { hiddenVideo.requestVideoFrameCallback(fp); } catch(e){}
        }
        // 无论如何，给一小段时间让帧率检测完成
        await new Promise(function(r) {
          setTimeout(function() {
            fpsDetected = true;
            r();
          }, 800);
        });
        // 暂停重置
        try { hiddenVideo.pause(); } catch(e) {}
        hiddenVideo.currentTime = 0;
        await new Promise(function(r) { setTimeout(r, 200); });
      } catch(e) {
        console.warn('帧率检测失败，使用默认30fps', e);
      }

      // 计算码率（高清）
      const videoBitrate = calculateBitrate(outWidth, outHeight, detectedFps);
      const audioBitrate = 192000;

      convertBtn.textContent = '转换中 0%';

      // 构建视频流 (canvas 输出 16:9 画面)
      const canvasStream = hiddenCanvas.captureStream
        ? hiddenCanvas.captureStream(detectedFps)
        : (hiddenCanvas.mozCaptureStream ? hiddenCanvas.mozCaptureStream(detectedFps) : null);

      if (!canvasStream) {
        showAlert('danger', '浏览器不支持视频捕获功能，请更新浏览器版本。');
        convertBtn.disabled = false;
        convertBtn.textContent = originalText;
        return;
      }

      // 构建音频流（从 video 元素获取）
      // iOS 限制：captureStream 的音频在某些版本不可靠
      let audioTrack = null;
      try {
        // iOS/Safari 有时需要 unmuted 才能 capture 音频
        hiddenVideo.muted = false;
        const videoStream = hiddenVideo.captureStream
          ? hiddenVideo.captureStream()
          : (hiddenVideo.mozCaptureStream ? hiddenVideo.mozCaptureStream() : null);
        if (videoStream) {
          const at = videoStream.getAudioTracks();
          if (at.length > 0) audioTrack = at[0];
        }
        // 如果 captureStream 没拿到音频，重新 muted 以允许自动播放
        if (!audioTrack) hiddenVideo.muted = true;
      } catch(e) {
        console.warn('音频捕获失败:', e);
        hiddenVideo.muted = true;
      }

      // 合并流
      const outputStream = new MediaStream();
      const videoTracks = canvasStream.getVideoTracks();
      if (videoTracks.length > 0) outputStream.addTrack(videoTracks[0]);
      if (audioTrack) outputStream.addTrack(audioTrack);

      // 创建 MediaRecorder（高码率）
      const chunks = [];
      let recorder;
      try {
        recorder = new MediaRecorder(outputStream, {
          mimeType: format.type,
          videoBitsPerSecond: videoBitrate,
          audioBitsPerSecond: audioBitrate
        });
      } catch(e) {
        // 某些浏览器不支持参数配置，降级为最简配置
        recorder = new MediaRecorder(outputStream);
      }

      recorder.ondataavailable = function(e) {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      await new Promise(function(resolve, reject) {
        let stopped = false;
        recorder.onstop = function() {
          if (!stopped) { stopped = true; resolve(); }
        };
        recorder.onerror = function(e) {
          console.error('录制错误:', e);
          if (!stopped) { stopped = true; reject(e.error || new Error('录制过程出错')); }
        };

        // 初始化画布：黑色背景
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, outWidth, outHeight);

        // 播放并录制
        hiddenVideo.muted = audioTrack ? false : true; // 如果没捕获到音频，保持静音播放
        hiddenVideo.currentTime = 0;

        const playPromise = hiddenVideo.play();
        if (playPromise && playPromise.catch) {
          playPromise.catch(function(err) {
            console.warn('播放失败:', err);
          });
        }

        // 开始录制
        try {
          recorder.start(1000); // 每 1 秒 flush 一次数据
        } catch(e) {
          reject(e);
          return;
        }

        // 使用 requestAnimationFrame 绘制每一帧
        let rafId = null;
        let lastDrawTime = 0;
        const minInterval = 1000 / (detectedFps * 1.5); // 控制最大绘制频率

        function draw() {
          if (hiddenVideo.ended || hiddenVideo.paused) {
            // 视频播放结束，停止录制
            try { if (recorder.state !== 'inactive') recorder.stop(); } catch(e){}
            return;
          }

          const now = performance.now();
          if (now - lastDrawTime >= minInterval) {
            lastDrawTime = now;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, outWidth, outHeight);
            try {
              ctx.drawImage(hiddenVideo, sx, sy, sw, sh, 0, 0, outWidth, outHeight);
            } catch(e) {}
          }

          // 更新进度
          const pct = Math.min(99, (hiddenVideo.currentTime / duration) * 100);
          convertBtn.textContent = '转换中 ' + Math.round(pct) + '%';

          rafId = requestAnimationFrame(draw);
        }
        draw();

        // 超时保护（最多播放时长 + 10 秒）
        const maxTime = (duration + 10) * 1000;
        setTimeout(function() {
          if (!stopped) {
            try { if (recorder.state !== 'inactive') recorder.stop(); } catch(e){}
          }
        }, maxTime);

        hiddenVideo.onended = function() {
          setTimeout(function() {
            try { if (recorder.state !== 'inactive') recorder.stop(); } catch(e){}
          }, 500);
        };
        hiddenVideo.onerror = function() {
          try { if (recorder.state !== 'inactive') recorder.stop(); } catch(e){}
        };

        // 清理 RAF 引用
        const _oldOnStop = recorder.onstop;
        recorder.onstop = function() {
          if (rafId) cancelAnimationFrame(rafId);
          if (_oldOnStop) _oldOnStop();
        };
      });

      convertBtn.textContent = '处理中...';

      // 组装输出文件
      const blob = new Blob(chunks, { type: outputMimeType });

      if (blob.size > MAX_SIZE) {
        showAlert('danger', '转换后的视频大小超过 50MB（' + formatSize(blob.size) + '），无法提供下载。请降低原视频质量或缩短时长后重试。');
        convertBtn.disabled = false;
        convertBtn.textContent = originalText;
        return;
      }

      if (blob.size < 1024) {
        showAlert('danger', '转换后文件异常，请重新尝试。');
        convertBtn.disabled = false;
        convertBtn.textContent = originalText;
        return;
      }

      const outUrl = URL.createObjectURL(blob);
      resultVideo.src = outUrl;
      resultVideo.load();
      downloadLink.href = outUrl;
      const baseName = selectedFile.name.replace(/\.[^.]+$/, '');
      downloadLink.download = baseName + '_converted.' + outputExtension;
      resultArea.classList.add('show');

      const tagText = outputExtension === 'mp4'
        ? 'MP4 (H.264 + AAC)'
        : outputExtension.toUpperCase();

      showAlert('success', '转换成功！输出: ' + tagText + ' · ' + outWidth + 'x' + outHeight + ' @ ' + detectedFps + 'fps · ' + formatSize(blob.size));

      convertBtn.disabled = false;
      convertBtn.textContent = originalText;

      // iOS 下，尝试用隐藏的 a 标签触发下载提示
      if (isIOS) {
        setTimeout(function() {
          const tempLink = document.createElement('a');
          tempLink.href = outUrl;
          tempLink.download = downloadLink.download;
          document.body.appendChild(tempLink);
          tempLink.click();
          setTimeout(function() { if (tempLink.parentNode) tempLink.parentNode.removeChild(tempLink); }, 100);
        }, 500);
      }

    } catch (err) {
      console.error(err);
      showAlert('danger', '转换失败: ' + (err.message || err));
      convertBtn.disabled = false;
      convertBtn.textContent = '开始转换';
    }
  });
})();
</script>
</body>
</html>
