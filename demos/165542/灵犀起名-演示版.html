<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灵犀起名 — 智能宝宝起名助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Serif SC', serif;
      background: linear-gradient(180deg, #faf8f5 0%, #f5f0e8 100%);
      min-height: 100vh;
      color: #3d3d3d;
      line-height: 1.6;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 0;
      min-height: 100vh;
      background: #fff;
      position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #8b5a2b 0%, #a0522d 50%, #cd853f 100%);
      color: #fff;
      padding: 32px 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -20px;
      right: -20px;
      width: 120px;
      height: 120px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: -30px;
      left: -30px;
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }

    .logo {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 6px;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .tagline {
      font-size: 14px;
      opacity: 0.9;
      position: relative;
      z-index: 1;
    }

    /* Pages */
    .page {
      display: none;
      padding: 24px;
      animation: fadeIn 0.3s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Form Page */
    .form-section {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #6b4423;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e8dfd3;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      background: #faf8f5;
      transition: all 0.3s;
    }

    .form-input:focus {
      outline: none;
      border-color: #cd853f;
      background: #fff;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .gender-options {
      display: flex;
      gap: 12px;
    }

    .gender-option {
      flex: 1;
      padding: 14px;
      border: 2px solid #e8dfd3;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: #faf8f5;
    }

    .gender-option.selected {
      border-color: #cd853f;
      background: linear-gradient(135deg, #cd853f, #a0522d);
      color: #fff;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #8b5a2b, #cd853f);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(139, 90, 43, 0.3);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    /* Loading */
    .loading-page {
      text-align: center;
      padding: 80px 24px;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid #e8dfd3;
      border-top-color: #cd853f;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 24px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: #8b5a2b;
      font-size: 16px;
    }

    /* Results Page */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .results-title {
      font-size: 20px;
      font-weight: 600;
      color: #6b4423;
    }

    .name-card {
      background: linear-gradient(135deg, #faf8f5, #f5f0e8);
      border: 1px solid #e8dfd3;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .name-card:hover {
      transform: translateX(4px);
      box-shadow: 0 4px 16px rgba(139, 90, 43, 0.15);
      border-color: #cd853f;
    }

    .name-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .name-text {
      font-size: 28px;
      font-weight: 700;
      color: #3d3d3d;
    }

    .name-score {
      background: linear-gradient(135deg, #cd853f, #8b5a2b);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .name-pinyin {
      color: #999;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .name-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      background: #fff;
      border: 1px solid #d4c9b9;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 12px;
      color: #6b4423;
    }

    /* Detail Page */
    .detail-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border: 2px solid #e8dfd3;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.3s;
    }

    .back-btn:hover {
      background: #faf8f5;
      border-color: #cd853f;
    }

    .detail-name {
      font-size: 32px;
      font-weight: 700;
      color: #3d3d3d;
    }

    .detail-score {
      margin: 20px 0;
      text-align: center;
      padding: 24px;
      background: linear-gradient(135deg, #8b5a2b, #cd853f);
      border-radius: 16px;
      color: #fff;
    }

    .score-value {
      font-size: 48px;
      font-weight: 700;
    }

    .score-label {
      font-size: 14px;
      opacity: 0.9;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 20px 0;
    }

    .score-item {
      text-align: center;
      padding: 12px;
      background: #faf8f5;
      border-radius: 12px;
      border: 1px solid #e8dfd3;
    }

    .score-item-value {
      font-size: 24px;
      font-weight: 700;
      color: #cd853f;
    }

    .score-item-label {
      font-size: 12px;
      color: #999;
    }

    .detail-section {
      margin-bottom: 20px;
    }

    .detail-section-title {
      font-size: 16px;
      font-weight: 600;
      color: #6b4423;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e8dfd3;
    }

    .detail-section-content {
      color: #555;
      font-size: 14px;
      line-height: 1.8;
    }

    .character-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .character-card {
      background: #faf8f5;
      border: 1px solid #e8dfd3;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .character-char {
      font-size: 36px;
      font-weight: 700;
      color: #3d3d3d;
      margin-bottom: 8px;
    }

    .character-pinyin {
      font-size: 14px;
      color: #999;
      margin-bottom: 8px;
    }

    .character-info {
      font-size: 12px;
      color: #666;
      line-height: 1.6;
    }

    .trend-bars {
      margin-top: 12px;
    }

    .trend-bar {
      margin-bottom: 12px;
    }

    .trend-bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .trend-bar-track {
      height: 8px;
      background: #e8dfd3;
      border-radius: 4px;
      overflow: hidden;
    }

    .trend-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #8b5a2b, #cd853f);
      border-radius: 4px;
    }

    .share-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #cd853f, #8b5a2b);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 24px;
      transition: all 0.3s;
    }

    .share-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 90, 43, 0.3);
    }

    /* Demo Badge */
    .demo-badge {
      position: fixed;
      top: 12px;
      right: 12px;
      background: rgba(139, 90, 43, 0.95);
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    /* Tabs */
    .tabs {
      display: flex;
      border-bottom: 2px solid #e8dfd3;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-size: 14px;
      color: #999;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.3s;
    }

    .tab.active {
      color: #8b5a2b;
      border-bottom-color: #cd853f;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="demo-badge">演示版</div>

    <!-- Form Page -->
    <div class="page active" id="formPage">
      <div class="header">
        <div class="logo">灵犀起名</div>
        <div class="tagline">智能宝宝起名助手</div>
      </div>

      <div style="padding: 24px;">
        <div class="form-section">
          <label class="form-label">姓氏</label>
          <input type="text" class="form-input" id="surname" placeholder="请输入姓氏" maxlength="2" value="李">
        </div>

        <div class="form-section">
          <label class="form-label">性别</label>
          <div class="gender-options">
            <div class="gender-option selected" data-gender="男" onclick="selectGender(this)">男</div>
            <div class="gender-option" data-gender="女" onclick="selectGender(this)">女</div>
          </div>
        </div>

        <div class="form-section">
          <label class="form-label">出生日期</label>
          <input type="date" class="form-input" id="birthDate" value="2024-03-15">
        </div>

        <div class="form-section">
          <label class="form-label">出生时辰</label>
          <select class="form-input" id="birthTime">
            <option value="子时(23:00-01:00)">子时 (23:00-01:00)</option>
            <option value="丑时(01:00-03:00)">丑时 (01:00-03:00)</option>
            <option value="寅时(03:00-05:00)">寅时 (03:00-05:00)</option>
            <option value="卯时(05:00-07:00)" selected>卯时 (05:00-07:00)</option>
            <option value="辰时(07:00-09:00)">辰时 (07:00-09:00)</option>
            <option value="巳时(09:00-11:00)">巳时 (09:00-11:00)</option>
            <option value="午时(11:00-13:00)">午时 (11:00-13:00)</option>
            <option value="未时(13:00-15:00)">未时 (13:00-15:00)</option>
            <option value="申时(15:00-17:00)">申时 (15:00-17:00)</option>
            <option value="酉时(17:00-19:00)">酉时 (17:00-19:00)</option>
            <option value="戌时(19:00-21:00)">戌时 (19:00-21:00)</option>
            <option value="亥时(21:00-23:00)">亥时 (21:00-23:00)</option>
          </select>
        </div>

        <div class="form-section">
          <label class="form-label">指定用字/偏旁（选填）</label>
          <input type="text" class="form-input" id="designated" placeholder="如：木、水旁">
        </div>

        <div class="form-section">
          <label class="form-label">期望寓意（选填）</label>
          <input type="text" class="form-input" id="expectation" placeholder="如：聪明健康、儒雅有学识">
        </div>

        <button class="submit-btn" onclick="startNaming()">开始起名</button>
      </div>
    </div>

    <!-- Loading Page -->
    <div class="page" id="loadingPage">
      <div class="header">
        <div class="logo">灵犀起名</div>
        <div class="tagline">智能宝宝起名助手</div>
      </div>
      <div class="loading-page">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在为您精心推算名字...</div>
      </div>
    </div>

    <!-- Results Page -->
    <div class="page" id="resultsPage">
      <div class="header">
        <div class="logo">灵犀起名</div>
        <div class="tagline">智能宝宝起名助手</div>
      </div>

      <div style="padding: 24px;">
        <div class="results-header">
          <div class="results-title">为您推荐 10 个名字</div>
        </div>

        <div id="nameList"></div>
      </div>
    </div>

    <!-- Detail Page -->
    <div class="page" id="detailPage">
      <div style="padding: 24px;">
        <div class="detail-header">
          <button class="back-btn" onclick="goBack()">←</button>
          <div class="detail-name" id="detailName"></div>
        </div>

        <div class="detail-score">
          <div class="score-value" id="detailScoreValue">9.2</div>
          <div class="score-label">综合评分</div>
        </div>

        <div class="score-grid" id="scoreGrid"></div>

        <div class="tabs">
          <div class="tab active" onclick="switchTab(this, 'overview')">综合解读</div>
          <div class="tab" onclick="switchTab(this, 'characters')">汉字详解</div>
          <div class="tab" onclick="switchTab(this, 'trend')">趋势分析</div>
        </div>

        <div id="tabContent"></div>

        <button class="share-btn" onclick="shareName()">分享名字</button>
      </div>
    </div>
  </div>

      `;

      renderOverview(name);
      showPage('detailPage');
    }

    function renderOverview(name) {
      document.getElementById('tabContent').innerHTML = `
        <div class="detail-section">
          <div class="detail-section-title">五行分析</div>
          <div class="detail-section-content">${name.wuxing}</div>
        </div>
        <div class="detail-section">
          <div class="detail-section-title">生肖分析</div>
          <div class="detail-section-content">${name.zodiac}</div>
        </div>
        <div class="detail-section">
          <div class="detail-section-title">音韵字形</div>
          <div class="detail-section-content">${name.phonetic}</div>
        </div>
        <div class="detail-section">
          <div class="detail-section-title">寓意解读</div>
          <div class="detail-section-content">${name.meaning}</div>
        </div>
      `;
    }

    function renderCharacters(name) {
      document.getElementById('tabContent').innerHTML = `
        <div class="character-cards">
          ${name.characters.map(char => `
            <div class="character-card">
              <div class="character-char">${char.char}</div>
              <div class="character-pinyin">${char.pinyin}</div>
              <div class="character-info">
                <div><strong>繁体：</strong>${char.traditional}</div>
                <div><strong>部首：</strong>${char.radical}</div>
                <div><strong>笔画：</strong>${char.strokes}</div>
                <div><strong>五行：</strong>${char.wuxing}</div>
                <div style="margin-top: 8px;">${char.meaning}</div>
              </div>
            </div>
          `).join('')}
        </div>
        ${name.characters.map(char => `
          <div class="detail-section" style="margin-top: 16px;">
            <div class="detail-section-title">${char.char}字详解</div>
            <div class="detail-section-content">${char.nameology}</div>
          </div>
        `).join('')}
      `;
    }

    function renderTrend(name) {
      const trend = name.trend;
      document.getElementById('tabContent').innerHTML = `
        <div class="trend-bars">
          <div class="trend-bar">
            <div class="trend-bar-label"><span>流行度</span><span>${trend.fashion}%</span></div>
            <div class="trend-bar-track"><div class="trend-bar-fill" style="width: ${trend.fashion}%"></div></div>
          </div>
          <div class="trend-bar">
            <div class="trend-bar-label"><span>独特性</span><span>${trend.uniqueness}%</span></div>
            <div class="trend-bar-track"><div class="trend-bar-fill" style="width: ${trend.uniqueness}%"></div></div>
          </div>
          <div class="trend-bar">
            <div class="trend-bar-label"><span>好听度</span><span>${trend.pleasantness}%</span></div>
            <div class="trend-bar-track"><div class="trend-bar-fill" style="width: ${trend.pleasantness}%"></div></div>
          </div>
          <div class="trend-bar">
            <div class="trend-bar-label"><span>男性比例</span><span>${trend.maleRatio}%</span></div>
            <div class="trend-bar-track"><div class="trend-bar-fill" style="width: ${trend.maleRatio}%"></div></div>
          </div>
          <div class="trend-bar">
            <div class="trend-bar-label"><span>女性比例</span><span>${trend.femaleRatio}%</span></div>
            <div class="trend-bar-track"><div class="trend-bar-fill" style="width: ${trend.femaleRatio}%"></div></div>
          </div>
        </div>
        <div class="detail-section" style="margin-top: 20px;">
          <div class="detail-section-title">综合点评</div>
          <div class="detail-section-content">${trend.summary}</div>
        </div>
      `;
    }

    function switchTab(el, tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');

      const name = mockNames[currentNameIndex];
      if (tabName === 'overview') renderOverview(name);
      else if (tabName === 'characters') renderCharacters(name);
      else if (tabName === 'trend') renderTrend(name);
    }

    function goBack() {
      showPage('resultsPage');
    }

    function shareName() {
      const name = mockNames[currentNameIndex];
      const text = `${name.fullName}（${name.pinyin}）- 综合评分 ${name.score} 分\n\n${name.wuxing}\n\n来自「灵犀起名」智能宝宝起名助手`;

      if (navigator.share) {
        navigator.share({
          title: `${name.fullName} - 灵犀起名推荐`,
          text: text
        });
      } else {
        navigator.clipboard.writeText(text).then(() => {
          alert('名字信息已复制到剪贴板');
        });
      }
    }
  </script>
</body>
</html>
