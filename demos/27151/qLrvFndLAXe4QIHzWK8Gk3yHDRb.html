<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>长鹅点球大战 - 赣超宜春队</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #98FB98 100%);
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header {
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        .title {
            font-size: 2.5rem;
            font-weight: bold;
            color: #1a5f7a;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
            margin-bottom: 5px;
            animation: bounce 2s ease-in-out infinite;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #2d8f5f;
            font-weight: 500;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            padding: 0 20px;
            margin-bottom: 15px;
            z-index: 10;
        }

        .score-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            min-width: 120px;
        }

        .score-label {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #e74c3c;
        }

        .score-value.goalie {
            color: #3498db;
        }

        .round-info {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 40px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: #1a5f7a;
            font-weight: 600;
            z-index: 10;
        }

        .game-container {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        canvas {
            display: block;
            background: #2d8f5f;
            cursor: crosshair;
        }

        .start-screen, .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            backdrop-filter: blur(5px);
        }

        .start-screen.hidden, .game-over-screen.hidden {
            display: none;
        }

        .screen-title {
            font-size: 2.8rem;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5), 0 0 10px rgba(255, 215, 0, 0.5); }
            50% { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 215, 0, 0.8); }
        }

        .screen-subtitle {
            font-size: 1.3rem;
            color: #ffd700;
            margin-bottom: 30px;
        }

        .start-btn, .restart-btn {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .start-btn:hover, .restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.5);
        }

        .start-btn:active, .restart-btn:active {
            transform: translateY(-1px);
        }

        .game-rules {
            margin-top: 30px;
            color: #fff;
            font-size: 0.95rem;
            text-align: center;
            line-height: 1.8;
            max-width: 400px;
        }

        .result-text {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 10px;
        }

        .final-score {
            font-size: 1.2rem;
            color: #ffd700;
            margin-bottom: 30px;
        }

        .feedback-popup {
            position: absolute;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: floatUp 1.5s ease-out forwards;
            z-index: 30;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .cloud {
            position: fixed;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50px;
            z-index: 0;
            animation: cloudMove 30s linear infinite;
        }

        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
        }

        .cloud::before {
            width: 60px;
            height: 60px;
            top: -30px;
            left: 20px;
        }

        .cloud::after {
            width: 40px;
            height: 40px;
            top: -20px;
            left: 60px;
        }

        @keyframes cloudMove {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(100vw); }
        }

        .hint-text {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            font-style: italic;
            pointer-events: none;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @media (max-width: 600px) {
            .title {
                font-size: 1.8rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .score-box {
                padding: 10px 20px;
                min-width: 100px;
            }
            
            .score-value {
                font-size: 2rem;
            }
            
            .screen-title {
                font-size: 2rem;
            }
            
            .start-btn, .restart-btn {
                padding: 15px 35px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="cloud" style="top: 10%; width: 100px; height: 30px; animation-duration: 40s;"></div>
    <div class="cloud" style="top: 25%; width: 80px; height: 25px; animation-duration: 35s; animation-delay: -10s;"></div>
    <div class="cloud" style="top: 15%; width: 120px; height: 35px; animation-duration: 50s; animation-delay: -20s;"></div>

    <div class="header">
        <h1 class="title">🐧 长鹅点球大战 🐧</h1>
        <p class="subtitle">赣超宜春队 | 月亮之都 · 嫦娥守护</p>
    </div>

    <div class="scoreboard">
        <div class="score-box">
            <div class="score-label">⚽ 进球</div>
            <div class="score-value" id="player-score">0</div>
        </div>
        <div class="score-box">
            <div class="score-label">🐧 扑救</div>
            <div class="score-value goalie" id="goalie-score">0</div>
        </div>
    </div>

    <div class="round-info" id="round-info">准备开始</div>

    <div class="game-container">
        <canvas id="game-canvas" width="600" height="500"></canvas>
        <div class="hint-text" id="hint-text">点击球门区域射门！</div>
        
        <div class="start-screen" id="start-screen">
            <h2 class="screen-title">长鹅点球大战</h2>
            <p class="screen-subtitle">赣超宜春队吉祥物长鹅担任守门员</p>
            <button class="start-btn" id="start-btn">开始比赛</button>
            <div class="game-rules">
                <p>🎮 游戏规则</p>
                <p>点击球门区域选择射门位置</p>
                <p>一共5个点球，看看你能进几个！</p>
                <p>长鹅可是很厉害的守门员哦~</p>
            </div>
        </div>

        <div class="game-over-screen hidden" id="game-over-screen">
            <h2 class="screen-title">比赛结束</h2>
            <p class="result-text" id="result-text">恭喜你获胜！</p>
            <p class="final-score" id="final-score">进球: 3 - 扑救: 2</p>
            <button class="restart-btn" id="restart-btn">再来一局</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        const playerScoreEl = document.getElementById('player-score');
        const goalieScoreEl = document.getElementById('goalie-score');
        const roundInfoEl = document.getElementById('round-info');
        const hintTextEl = document.getElementById('hint-text');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const resultTextEl = document.getElementById('result-text');
        const finalScoreEl = document.getElementById('final-score');
        const starsContainer = document.getElementById('stars');

        const CANVAS_WIDTH = canvas.width;
        const CANVAS_HEIGHT = canvas.height;
        
        const GOAL_TOP = 50;
        const GOAL_BOTTOM = 350;
        const GOAL_LEFT = 100;
        const GOAL_RIGHT = 500;
        const GOAL_WIDTH = GOAL_RIGHT - GOAL_LEFT;
        const GOAL_HEIGHT = GOAL_BOTTOM - GOAL_TOP;
        
        const BALL_START_X = 300;
        const BALL_START_Y = 450;
        const BALL_RADIUS = 15;

        let gameState = 'idle';
        let playerScore = 0;
        let goalieScore = 0;
        let currentRound = 0;
        const maxRounds = 5;

        let ball = {
            x: BALL_START_X,
            y: BALL_START_Y,
            vx: 0,
            vy: 0,
            state: 'ready',
            targetX: 0,
            targetY: 0,
            startTime: 0,
            duration: 0
        };

        let goalie = {
            x: CANVAS_WIDTH / 2,
            y: GOAL_BOTTOM - 60,
            width: 60,
            height: 80,
            state: 'idle',
            diveDirection: 0,
            diveProgress: 0
        };

        let feedbacks = [];

        function initStars() {
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(star);
            }
        }

        function drawBackground() {
            ctx.fillStyle = '#2d8f5f';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            ctx.fillStyle = '#34a06f';
            for (let i = 0; i < CANVAS_WIDTH; i += 40) {
                ctx.fillRect(i, 0, 20, CANVAS_HEIGHT);
            }

            ctx.fillStyle = '#1a5f7a';
            ctx.fillRect(GOAL_LEFT - 5, GOAL_TOP - 5, 10, GOAL_HEIGHT + 10);
            ctx.fillRect(GOAL_RIGHT - 5, GOAL_TOP - 5, 10, GOAL_HEIGHT + 10);
            ctx.fillRect(GOAL_LEFT - 5, GOAL_TOP - 5, GOAL_WIDTH + 10, 10);

            ctx.fillStyle = '#fff';
            ctx.fillRect(GOAL_LEFT, GOAL_TOP, 5, GOAL_HEIGHT);
            ctx.fillRect(GOAL_RIGHT - 5, GOAL_TOP, 5, GOAL_HEIGHT);
            ctx.fillRect(GOAL_LEFT, GOAL_TOP, GOAL_WIDTH, 5);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.beginPath();
            ctx.arc(CANVAS_WIDTH / 2, CANVAS_HEIGHT - 80, 60, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('赣超 · 宜春队', CANVAS_WIDTH / 2, CANVAS_HEIGHT - 20);
        }

        function drawGoalie() {
            ctx.save();
            ctx.translate(goalie.x, goalie.y);

            if (goalie.state === 'diving_left') {
                ctx.rotate(-0.5 + goalie.diveProgress * 0.5);
            } else if (goalie.state === 'diving_right') {
                ctx.rotate(0.5 - goalie.diveProgress * 0.5);
            } else if (goalie.state === 'jumping') {
                ctx.translate(0, -30 * goalie.diveProgress);
            }

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.ellipse(0, -30, 25, 35, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(-10, -35, 8, 0, Math.PI * 2);
            ctx.arc(10, -35, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(-10, -35, 3, 0, Math.PI * 2);
            ctx.arc(10, -35, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff8c00';
            ctx.beginPath();
            ctx.moveTo(0, -25);
            ctx.lineTo(-8, -18);
            ctx.lineTo(8, -18);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.fillRect(-30, -20, 25, 12);
            ctx.fillRect(5, -20, 25, 12);

            ctx.fillStyle = '#fff';
            ctx.fillRect(-25, 10, 20, 8);
            ctx.fillRect(5, 10, 20, 8);

            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.moveTo(-25, -25);
            ctx.lineTo(-45, -40);
            ctx.lineTo(-35, -20);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(25, -25);
            ctx.lineTo(45, -40);
            ctx.lineTo(35, -20);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function drawBall() {
            ctx.save();
            ctx.translate(ball.x, ball.y);

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#000';
            const hexSize = BALL_RADIUS * 0.8;
            for (let i = 0; i < 6; i++) {
                ctx.save();
                ctx.rotate((i * Math.PI) / 3);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                for (let j = 0; j < 6; j++) {
                    const angle = (j * Math.PI) / 3;
                    const x = hexSize * Math.cos(angle);
                    const y = hexSize * Math.sin(angle);
                    if (j === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                if (i % 2 === 0) ctx.fill();
                ctx.restore();
            }

            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(0, 0, BALL_RADIUS, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }

        function drawTargetHint(x, y) {
            ctx.save();
            ctx.globalAlpha = 0.5;
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y, 30, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x - 20, y);
            ctx.lineTo(x + 20, y);
            ctx.moveTo(x, y - 20);
            ctx.lineTo(x, y + 20);
            ctx.stroke();
            ctx.restore();
        }

        function createFeedback(text, x, y, color) {
            feedbacks.push({
                text,
                x,
                y,
                color,
                opacity: 1,
                scale: 1
            });
        }

        function updateFeedbacks() {
            feedbacks = feedbacks.filter(fb => {
                fb.opacity -= 0.02;
                fb.scale += 0.01;
                fb.y -= 2;
                return fb.opacity > 0;
            });
        }

        function drawFeedbacks() {
            feedbacks.forEach(fb => {
                ctx.save();
                ctx.globalAlpha = fb.opacity;
                ctx.font = `bold ${30 * fb.scale}px Arial`;
                ctx.textAlign = 'center';
                ctx.fillStyle = fb.color;
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.strokeText(fb.text, fb.x, fb.y);
                ctx.fillText(fb.text, fb.x, fb.y);
                ctx.restore();
            });
        }

        function resetBall() {
            ball.x = BALL_START_X;
            ball.y = BALL_START_Y;
            ball.vx = 0;
            ball.vy = 0;
            ball.state = 'ready';
        }

        function resetGoalie() {
            goalie.x = CANVAS_WIDTH / 2;
            goalie.y = GOAL_BOTTOM - 60;
            goalie.state = 'idle';
            goalie.diveDirection = 0;
            goalie.diveProgress = 0;
        }

        function startGame() {
            gameState = 'playing';
            playerScore = 0;
            goalieScore = 0;
            currentRound = 0;
            updateScoreboard();
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            nextRound();
        }

        function nextRound() {
            currentRound++;
            if (currentRound > maxRounds) {
                endGame();
                return;
            }
            
            roundInfoEl.textContent = `第 ${currentRound} / ${maxRounds} 回合`;
            resetBall();
            resetGoalie();
            ball.state = 'ready';
            hintTextEl.style.display = 'block';
        }

        function endGame() {
            gameState = 'ended';
            gameOverScreen.classList.remove('hidden');
            
            if (playerScore > goalieScore) {
                resultTextEl.textContent = '🎉 恭喜你获胜！🎉';
                resultTextEl.style.color = '#ffd700';
            } else if (playerScore < goalieScore) {
                resultTextEl.textContent = '🐧 长鹅获胜！🐧';
                resultTextEl.style.color = '#3498db';
            } else {
                resultTextEl.textContent = '⚔️ 平局！⚔️';
                resultTextEl.style.color = '#fff';
            }
            
            finalScoreEl.textContent = `进球: ${playerScore} - 扑救: ${goalieScore}`;
        }

        function updateScoreboard() {
            playerScoreEl.textContent = playerScore;
            goalieScoreEl.textContent = goalieScore;
        }

        function shoot(targetX, targetY) {
            if (ball.state !== 'ready' || gameState !== 'playing') return;

            ball.state = 'flying';
            ball.targetX = targetX;
            ball.targetY = targetY;
            ball.startTime = Date.now();
            ball.duration = 800;
            hintTextEl.style.display = 'none';

            const dx = targetX - BALL_START_X;
            const dy = targetY - BALL_START_Y;
            
            const distance = Math.sqrt(dx * dx + dy * dy);
            const time = ball.duration / 1000;
            
            ball.vx = dx / time;
            ball.vy = (dy / time) - (9.8 * time) / 2;

            const goalieReaction = Math.random();
            if (goalieReaction < 0.6) {
                if (targetX < CANVAS_WIDTH / 2) {
                    goalie.state = 'diving_left';
                } else {
                    goalie.state = 'diving_right';
                }
            } else {
                goalie.state = 'jumping';
            }
        }

        function updateGame() {
            if (gameState !== 'playing') return;

            if (ball.state === 'flying') {
                const elapsed = Date.now() - ball.startTime;
                const progress = Math.min(elapsed / ball.duration, 1);
                
                ball.x = BALL_START_X + ball.vx * (elapsed / 1000);
                ball.y = BALL_START_Y + ball.vy * (elapsed / 1000) + 0.5 * 9.8 * Math.pow(elapsed / 1000, 2);

                if (goalie.state !== 'idle') {
                    goalie.diveProgress = Math.min(goalie.diveProgress + 0.05, 1);
                    if (goalie.state === 'diving_left') {
                        goalie.x -= 2;
                    } else if (goalie.state === 'diving_right') {
                        goalie.x += 2;
                    }
                }

                if (progress >= 1 || ball.y > GOAL_BOTTOM) {
                    const isGoal = checkGoal();
                    if (isGoal) {
                        playerScore++;
                        createFeedback('⚽ 进球！', ball.x, ball.y, '#e74c3c');
                    } else {
                        goalieScore++;
                        createFeedback('🐧 扑救！', ball.x, ball.y, '#3498db');
                    }
                    updateScoreboard();
                    
                    setTimeout(() => {
                        nextRound();
                    }, 1000);
                }
            }

            updateFeedbacks();
        }

        function checkGoal() {
            const ballCenterX = ball.x;
            const ballCenterY = ball.y;
            
            if (ballCenterY >= GOAL_TOP && ballCenterY <= GOAL_BOTTOM &&
                ballCenterX >= GOAL_LEFT && ballCenterX <= GOAL_RIGHT) {
                
                const goalieLeft = goalie.x - 30;
                const goalieRight = goalie.x + 30;
                const goalieTop = goalie.y - 40;
                const goalieBottom = goalie.y + 20;
                
                if (ballCenterX >= goalieLeft && ballCenterX <= goalieRight &&
                    ballCenterY >= goalieTop && ballCenterY <= goalieBottom) {
                    return false;
                }
                
                return true;
            }
            
            return false;
        }

        function render() {
            drawBackground();
            drawGoalie();
            drawBall();
            drawFeedbacks();
            
            if (ball.state === 'ready' && gameState === 'playing') {
                ctx.save();
                ctx.globalAlpha = 0.3;
                ctx.fillStyle = '#ffd700';
                ctx.fillRect(GOAL_LEFT, GOAL_TOP, GOAL_WIDTH, GOAL_HEIGHT);
                ctx.restore();
            }

            updateGame();
            requestAnimationFrame(render);
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (x >= GOAL_LEFT && x <= GOAL_RIGHT && y >= GOAL_TOP && y <= GOAL_BOTTOM) {
                shoot(x, y);
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (ball.state === 'ready' && gameState === 'playing' &&
                x >= GOAL_LEFT && x <= GOAL_RIGHT && y >= GOAL_TOP && y <= GOAL_BOTTOM) {
                canvas.style.cursor = 'crosshair';
            } else {
                canvas.style.cursor = 'default';
            }
        });

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        initStars();
        render();
    </script>
</body>
</html>
