        // 清理过期链接
        function cleanupExpiredLinks() {
            const now = Date.now();
            savedLinks = savedLinks.filter(link => {
                const created = new Date(link.createdAt).getTime();
                const oneDay = 24 * 60 * 60 * 1000;
                return (now - created) < oneDay;
            });

            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

            const ageMax = parseInt(document.getElementById('filter-age-max').value) || 999;
            const heightMin = parseInt(document.getElementById('filter-height-min').value) || 0;
            const heightMax = parseInt(document.getElementById('filter-height-max').value) || 999;
            const weightMin = parseInt(document.getElementById('filter-weight-min').value) || 0;
            const weightMax = parseInt(document.getElementById('filter-weight-max').value) || 999;
            const interests = document.getElementById('filter-interests').value.toLowerCase().split(/[,，\s]+/).filter(i => i);
            const job = document.getElementById('filter-job').value.toLowerCase();
            const incomeMin = parseInt(document.getElementById('filter-income-min').value) || 0;
            const incomeMax = parseInt(document.getElementById('filter-income-max').value) || 999999;
            const region = document.getElementById('filter-region').value.toLowerCase();

            const filtered = mockUsers.filter(user => {
                if (gender && user.gender !== gender) return false;
                if (user.age < ageMin || user.age > ageMax) return false;
                if (user.height < heightMin || user.height > heightMax) return false;
                if (user.weight < weightMin || user.weight > weightMax) return false;
                if (interests.length > 0 && !interests.some(i => user.interests.some(ui => ui.toLowerCase().includes(i)))) return false;
                if (job && !user.job.toLowerCase().includes(job)) return false;
                if (user.income < incomeMin || user.income > incomeMax) return false;
                if (region && !user.region.toLowerCase().includes(region)) return false;
                return true;
            });

            renderResults(filtered);
        }

        // 渲染结果
        function renderResults(users) {
            const container = document.getElementById('results-container');
            
            if (users.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">😔</div>
                        <p>未找到匹配的用户，请调整筛选条件</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="results-grid">
                    ${users.map(user => `
                        <div class="person-card">
                            <div class="person-header">
                                <div class="person-avatar">${user.avatar}</div>
                                <div class="person-info">
                                    <h3>${user.name}</h3>
                                    <div class="meta">${user.gender} · ${user.age}岁 · ${user.region}</div>
                                </div>
                            </div>
                            <div class="person-details">
                                <div class="detail-item">
                                    <span class="detail-label">身高</span>
                                    <span class="detail-value">${user.height}cm</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">体重</span>
                                    <span class="detail-value">${user.weight}kg</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">工作</span>
                                    <span class="detail-value">${user.job}</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">收入</span>
                                    <span class="detail-value">${user.income.toLocaleString()}元/月</span>
                                </div>
                            </div>
                            <div class="interests">
                                ${user.interests.map(i => `<span class="interest-tag">${i}</span>`).join('')}
                            </div>
                            <button class="btn btn-success" style="width: 100%;" onclick="startCall(${user.id})">
                                <span>📹</span> 发起视频对话
                            </button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // 开始通话
        async function startCall(userId) {
            const user = mockUsers.find(u => u.id === userId);
            if (!user) return;

            pendingCallId = userId;
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;
                document.getElementById('local-placeholder').classList.add('hidden');
            } catch (err) {
                console.log('无法访问摄像头:', err);
                // 模拟模式
            }

            document.getElementById('video-modal').classList.add('active');
            startTimer(600); // 10分钟 = 600秒
        }

        // 开始计时器
        function startTimer(seconds) {
            let remaining = seconds;
            const timerEl = document.getElementById('timer');
            
            timerInterval = setInterval(() => {
                remaining--;
                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;
                timerEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                
                if (remaining <= 60) {
                    timerEl.classList.add('danger');
                    timerEl.classList.remove('warning');
                } else if (remaining <= 180) {
                    timerEl.classList.add('warning');
                }
                
                if (remaining <= 0) {
                    endCall();
                }
            }, 1000);
        }

        // 结束通话
        function endCall() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            
            document.getElementById('video-modal').classList.remove('active');
            document.getElementById('local-placeholder').classList.remove('hidden');
            document.getElementById('timer').textContent = '10:00';
            document.getElementById('timer').classList.remove('warning', 'danger');
            
            // 生成链接
            if (pendingCallId) {
                generateLink(pendingCallId);
                pendingCallId = null;
            }
        }

        // 生成链接
        function generateLink(userId) {
            const user = mockUsers.find(u => u.id === userId);
            if (!user) return;

            const linkId = 'link_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            const linkData = {
                id: linkId,
                userId: userId,
                userName: user.name,
                createdAt: new Date().toISOString(),
                activated: false,
                usedToday: false
            };

            savedLinks.push(linkData);
            localStorage.setItem('videoMatchLinks', JSON.stringify(savedLinks));

            const linkUrl = `${window.location.origin}${window.location.pathname}?call=${linkId}`;
            document.getElementById('link-text').textContent = linkUrl;
            document.getElementById('link-modal').classList.add('active');
        }

        // 复制链接
        function copyLink() {
            const linkText = document.getElementById('link-text').textContent;
            navigator.clipboard.writeText(linkText).then(() => {
                alert('链接已复制到剪贴板');
            }).catch(() => {
                // 降级方案
                const input = document.createElement('input');
                input.value = linkText;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                alert('链接已复制到剪贴板');
            });
        }

        // 关闭链接模态框
        function closeLinkModal() {
            document.getElementById('link-modal').classList.remove('active');
        }

        // 渲染保存的链接
        function renderSavedLinks() {
            cleanupExpiredLinks();
            
            const container = document.getElementById('saved-links-container');
            
            if (savedLinks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🔗</div>
                        <p>暂无保存的链接</p>
                    </div>
                `;
                return;
            }

            const now = Date.now();
            const oneDay = 24 * 60 * 60 * 1000;

            container.innerHTML = `
                <div class="saved-links">
                    ${savedLinks.map(link => {
                        const created = new Date(link.createdAt).getTime();
                        const elapsed = now - created;
                        const remaining = oneDay - elapsed;
                        const hoursLeft = Math.floor(remaining / (60 * 60 * 1000));
                        const minsLeft = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
                        
                        let statusClass = '';
                        let statusText = '';
                        let badgeClass = '';
                        
                        if (remaining <= 0) {
                            statusClass = 'expired';
                            statusText = '已过期';
                            badgeClass = 'badge-danger';
                        } else if (hoursLeft < 2) {
                            statusClass = 'soon';
                            statusText = `${hoursLeft}小时${minsLeft}分钟后过期`;
                            badgeClass = 'badge-warning';
                        } else {
                            statusText = `${hoursLeft}小时${minsLeft}分钟后过期`;
                            badgeClass = 'badge-success';
                        }

                        const linkUrl = `${window.location.origin}${window.location.pathname}?call=${link.id}`;
                        
                        return `
                            <div class="link-item">
                                <div class="link-item-info">
                                    <div class="name">与 ${link.userName} 的对话链接</div>
                                    <div class="expiry ${statusClass}">
                                        ${link.activated ? '<span class="badge badge-success">已激活</span> ' : ''}
                                        <span class="badge ${badgeClass}">${statusText}</span>
                                    </div>
                                </div>
                                <div class="link-actions">
                                    <button class="btn btn-primary btn-small" onclick="useLink('${link.id}')">使用链接</button>
                                    <button class="btn btn-secondary btn-small" onclick="copySavedLink('${link.id}')">复制</button>
                                    <button class="btn btn-danger btn-small" onclick="deleteLink('${link.id}')">删除</button>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // 使用链接
        function useLink(linkId) {
            const link = savedLinks.find(l => l.id === linkId);
            if (!link) return;

            const now = Date.now();
            const created = new Date(link.createdAt).getTime();
            const oneDay = 24 * 60 * 60 * 1000;

            if (now - created > oneDay) {
                alert('链接已过期');
                return;
            }

            if (!link.activated) {
                // 首次使用，显示同意对话框
                document.getElementById('consent-text').textContent = `您正在发起与 ${link.userName} 的视频对话，对方需要同意后才能开始。`;
                document.getElementById('consent-modal').classList.add('active');
                pendingCallId = link.userId;
                
                // 标记为已激活
                link.activated = true;
                link.activatedAt = new Date().toISOString();
                localStorage.setItem('videoMatchLinks', JSON.stringify(savedLinks));
            } else {
                // 已激活，检查是否可以使用
                const activated = new Date(link.activatedAt).getTime();
                const nextDay = activated + oneDay;
                
                if (now < nextDay && link.usedToday) {
                    alert('今天已经使用过此链接，请明天再试');
                    return;
                }
                
                if (now >= nextDay) {
                    link.usedToday = false;
                }
                
                startCall(link.userId);
            }
        }

        // 接受通话
        function acceptCall() {
            document.getElementById('consent-modal').classList.remove('active');
            if (pendingCallId) {
                const link = savedLinks.find(l => l.userId === pendingCallId && l.activated);
                if (link) {
                    link.usedToday = true;
                    localStorage.setItem('videoMatchLinks', JSON.stringify(savedLinks));
                }
                startCall(pendingCallId);
            }
        }

        // 拒绝通话
        function rejectCall() {
            document.getElementById('consent-modal').classList.remove('active');
            pendingCallId = null;
        }

        // 复制保存的链接
        function copySavedLink(linkId) {
            const linkUrl = `${window.location.origin}${window.location.pathname}?call=${linkId}`;
            navigator.clipboard.writeText(linkUrl).then(() => {
                alert('链接已复制');
            }).catch(() => {
                const input = document.createElement('input');
                input.value = linkUrl;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                alert('链接已复制');
            });
        }

        // 删除链接
        function deleteLink(linkId) {
            if (confirm('确定要删除此链接吗？')) {
                savedLinks = savedLinks.filter(l => l.id !== linkId);
                localStorage.setItem('videoMatchLinks', JSON.stringify(savedLinks));
                renderSavedLinks();
            }
        }

        // 检查URL参数
        function checkUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const callId = params.get('call');
            
            if (callId) {
                const link = savedLinks.find(l => l.id === callId);
                if (link) {
                    const now = Date.now();
                    const created = new Date(link.createdAt).getTime();
                    const oneDay = 24 * 60 * 60 * 1000;
                    
                    if (now - created > oneDay) {
                        alert('链接已过期');
                        return;
                    }
                    
                    useLink(callId);
                }
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            cleanupExpiredLinks();
            checkUrlParams();
        });
    </script>
</body>
</html>
