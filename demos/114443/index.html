      to { opacity: 1; transform: none; }

      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: none; }
    }

      from { opacity: 0; }
      to { opacity: 1; }

      }

      }

            story: "一天快结束了，你要写日报。今天实际做了：写了1篇推文、回了30条评论、刷了2小时数据。",
            options: [
              { text: "老实写：'今日完成推文撰写1篇，回复评论30条，数据分析2小时。'", tag: "实在", feedback: "领导觉得你'工作量不够饱和'。" },
              { text: "包装一下：'今日完成XX渠道内容分发，通过数据监测与用户精细化运营，有效提升社群活跃度。'", tag: "职场话术", feedback: "领导回复'不错，继续保持'。" },
              { text: "随便写两句应付一下", tag: "佛系", feedback: "第二天晨会被点名'日报写详细点'。" }
            ]
          }
        ]
      },
      {
        id: "product",
        name: "产品经理",
        icon: "📋",
        color: "#4A90D9",
        desc: "夹在用户、开发、老板之间，把混乱变成方案。",
        summaryTags: ["担当", "逻辑力", "周全"],
        goodSummary: "你有担当和逻辑力，产品经理可能是你的菜！",
        normalSummary: "你做事效率高，但做产品需要更关注细节哦。",
        scenes: [
          {
            title: "上午 09:30｜晨会",
            story: "晨会上，开发说'这个功能实现不了'，运营说'用户想要这个功能'，老板看着你。",
            options: [
              { text: "拍板：'先做，有问题我扛。'", tag: "担当", feedback: "老板欣赏你的担当，但后来功能真出了问题，你背了锅。" },
              { text: "说：'我回去整理一下优先级，下午给方案。'", tag: "规划力", feedback: "大家散了，你多了一堆作业。" },
              { text: "反问开发：'具体哪里实现不了？我们聊聊解决方案。'", tag: "逻辑力", feedback: "开发被问住了，说'我再想想'，问题可能真的有解。" }
            ]
          },
          {
            title: "下午 13:30｜写PRD被打断",
            story: "你正在写PRD（产品需求文档），开发找上门：'上次那个功能做完了，你走查一下。'你刚看完，老板又喊你去开会。",
            options: [
              { text: "先走查，再去开会，PRD晚上加班写", tag: "责任感", feedback: "功能顺利上线，但你加班到11点。" },
              { text: "跟开发说'晚点再看'，先去开会", tag: "效率", feedback: "开发有点不爽，但PRD按时交了。" },
              { text: "快速走查10分钟，会上简单汇报PRD思路，晚上不加班", tag: "多线程", feedback: "两边都顾上了，但都很赶。" }
            ]
          },
          {
            title: "下午 16:30｜需求评审被挑战",
            story: "需求评审会上，开发把你写的PRD逐条拆开问：'这个逻辑有漏洞，那个场景没覆盖。'",
            options: [
              { text: "硬刚：'我写的就是对的。'", tag: "自信", feedback: "开发拿出反例，你被按在地上摩擦。" },
              { text: "承认：'确实没想全，我回去补一下。'", tag: "诚实", feedback: "评审暂停，你回去重写。" },
              { text: "说：'你说得对，这个场景我考虑了但没写进去，我补上。'", tag: "周全", feedback: "开发服气，评审通过。" }
            ]
          }
        ]
      },
      {
        id: "developer",
        name: "程序员",
        icon: "💻",
        color: "#27AE60",
        desc: "排查问题、写逻辑、做代码审查，在细节里交付。",
        summaryTags: ["问题解决", "严谨", "成长型思维"],
        goodSummary: "你有严谨的逻辑和学习力，做程序员很有潜力！",
        normalSummary: "你执行力强，但编程可能需要更多的耐心和细致哦。",
        scenes: [
          {
            title: "上午 10:00｜晨会汇报bug",
            story: "晨会上，你汇报昨天的工作：'接口调用时出现数据异常。'",
            options: [
              { text: "直接说：'接口有问题，后端修一下。'", tag: "甩锅", feedback: "后端同事翻了个白眼。" },
              { text: "说：'我排查了一下，可能是参数传递的问题，正在定位。'", tag: "问题解决", feedback: "组长说'不错，有排查思路'。" },
              { text: "说：'还没查出来，我再看看。'", tag: "谨慎", feedback: "组长说'抓紧时间'。" }
            ]
          },
          {
            title: "下午 14:00｜写代码遇难题",
            story: "你在写一个用户登录功能，需要处理密码错误、账号锁定、异地登录提醒等多种异常情况。",
            options: [
              { text: "先把正常流程写完，异常后面再说", tag: "行动力", feedback: "功能上线后，用户报bug，你连夜修。" },
              { text: "把所有异常情况都列出来，逐一处理", tag: "严谨", feedback: "代码质量高，代码审查一次过。" },
              { text: "去Stack Overflow搜一下有没有现成的方案", tag: "借力", feedback: "找到了一个开源方案，半小时搞定。" }
            ]
          },
          {
            title: "下午 17:30｜代码审查",
            story: "你提交了代码，同事在审查时指出：'这个变量的命名不够清晰，逻辑可以优化。'",
            options: [
              { text: "解释：'我觉得没问题，就这样吧。'", tag: "固执", feedback: "同事觉得你难合作。" },
              { text: "虚心接受：'你说得对，我改一下。'", tag: "配合", feedback: "改了，但没学到东西。" },
              { text: "追问：'具体哪里不清晰？怎么优化更好？'", tag: "成长型思维", feedback: "同事耐心讲解，你学到了新技巧。" }
            ]
          }
        ]
      },
      {
        id: "marketing",
        name: "快消市场部",
        icon: "📊",
        color: "#9B59B6",
        desc: "选代言、做活动、谈预算，把品牌种进用户心里。",
        summaryTags: ["创意", "洞察力", "谈判力"],
        goodSummary: "你有创意和洞察力，市场部很适合你！",
        normalSummary: "你执行力不错，但做市场需要更大胆的创意哦。",
        scenes: [
          {
            title: "上午 10:00｜选代言人",
            story: "公司要推一款新饮品，目标用户是18-25岁的年轻人。团队在讨论代言人人选。",
            options: [
              { text: "选当下最火的流量明星", tag: "流量敏感", feedback: "官宣当天热搜第一，但三个月后艺人翻车，品牌紧急撤代言。" },
              { text: "选一个气质契合的中腰部艺人", tag: "性价比", feedback: "反响不错，ROI很高。" },
              { text: "不做代言人，把钱砸在社交媒体内容上", tag: "创意", feedback: "内容出圈了，但缺少一个'记忆点'。" }
            ]
          },
          {
            title: "下午 14:00｜策划校园快闪",
            story: "你要策划一场校园快闪活动，预算5万，目标是让目标用户'记住这个品牌'。",
            options: [
              { text: "在学校广场搭一个酷炫的打卡装置", tag: "视觉力", feedback: "打卡的人很多，但没人记得品牌叫什么。" },
              { text: "做免费派样+扫码关注", tag: "执行力", feedback: "涨了2000粉，但掉粉也快。" },
              { text: "联合学生会做一个'熬夜续命水'的主题活动", tag: "洞察力", feedback: "活动在校园里传疯了，品牌被记住了。" }
            ]
          },
          {
            title: "下午 16:30｜跟供应商撕预算",
            story: "活动方案定了，但供应商报价超预算20%。你需要在今天内敲定。",
            options: [
              { text: "砍掉一部分物料，控制预算", tag: "预算意识", feedback: "活动效果不如预期，领导问'怎么这么寒酸'。" },
              { text: "跟供应商谈：'这次先做，下次长期合作给你更多单'", tag: "谈判力", feedback: "供应商答应了，活动顺利。" },
              { text: "找领导特批追加预算", tag: "资源争取", feedback: "领导批了，但说'下次提前规划'。" }
            ]
          }
        ]
      }
    ];

    const state = {
      view: "home",
      currentRoleId: null,
      sceneIndex: 0,
      selectedIndex: null,
      currentTags: [],
      currentFeedback: null,
      nextReady: false,
      completed: {}
    };

    const screen = document.querySelector("#screen");
    const modalRoot = document.querySelector("#modalRoot");
    const floatingRoot = document.querySelector("#floatingRoot");

    function getRole(id) {
      return roles.find(role => role.id === id);
    }

    function completedCount() {
      return Object.keys(state.completed).length;
    }

    function allTags() {
      return Object.values(state.completed).flat();
    }

    function setAccent(color) {
      document.documentElement.style.setProperty("--accent", color);
    }

    function render() {
      modalRoot.innerHTML = "";
      if (state.view === "home") renderHome();
      if (state.view === "scenario") renderScenario();
      if (state.view === "report") renderReport();
      renderBottomNav();
    }

    function renderHome() {
      setAccent("#FF6B35");
      screen.innerHTML = `
        <div class="hero">
          <div>
            <h1>一日职场<br>微缩实验室</h1>
            <p class="subtitle">用 5-8 分钟假装工作一天。你将体验运营、产品、程序员、市场部的真实日常决策，获得标签，并生成你的个人职业倾向报告。</p>
          </div>
          <div class="mini-panel">
            <strong>${completedCount()}/4 个岗位已体验</strong>
            <span>完成任意 3 个岗位后，即可查看你的职场画像报告。</span>
          </div>
        </div>
        <div class="role-grid">
          ${roles.map(role => `
            <button class="role-card" style="--role-color:${role.color}" onclick="startRole('${role.id}')">
              <div class="role-icon">${role.icon}</div>
              <h2>${role.name}</h2>
              <p>${role.desc}</p>
              <span class="role-status">${state.completed[role.id] ? "已体验 · 可重玩" : "点击开始体验"}</span>
            </button>
          `).join("")}
        </div>
      `;
    }

    function startRole(roleId) {
      const role = getRole(roleId);
      state.view = "scenario";
      state.currentRoleId = roleId;
      state.sceneIndex = 0;
      state.selectedIndex = null;
      state.currentTags = [];
      state.currentFeedback = null;
      state.nextReady = false;
      setAccent(role.color);
      render();
    }

    function renderScenario() {
      const role = getRole(state.currentRoleId);
      const scene = role.scenes[state.sceneIndex];
      setAccent(role.color);

      screen.innerHTML = `
        <div class="top-nav">
          <button class="back-btn" onclick="goHome()">← 岗位选择</button>
          <div class="nav-center">
            <div class="role-line">
              <span>${role.icon}</span>
              <span>${role.name}</span>
              <span style="color:var(--muted);font-weight:600">场景 ${state.sceneIndex + 1}/3</span>
            </div>
            <div class="progress-dots">
              ${role.scenes.map((_, index) => `<span class="progress-dot ${index <= state.sceneIndex ? "active" : ""}"></span>`).join("")}
            </div>
          </div>
          <div class="tag-strip">
            ${state.currentTags.length ? state.currentTags.map(tag => `<span class="tag-small">✨ ${tag}</span>`).join("") : `<span class="tag-small">暂无标签</span>`}
          </div>
        </div>

        <div class="scenario-wrap">
          <article class="work-card">
            <span class="time-chip">⏱ ${scene.title.split("｜")[0]}</span>
            <h2>${scene.title.split("｜")[1]}</h2>
            <div class="story-box">${scene.story}</div>
          </article>

          <aside>
            <div class="choice-list">
              ${scene.options.map((option, index) => {
                const chosen = state.selectedIndex === index;
                const faded = state.selectedIndex !== null && !chosen;
                return `
                  <button
                    class="choice-card ${chosen ? "selected" : ""} ${faded ? "faded" : ""}"
                    ${state.selectedIndex !== null ? "disabled" : ""}
                    onclick="chooseOption(${index})"
                  >
                    <span class="choice-letter">${String.fromCharCode(65 + index)}</span>
                    <span class="choice-text">${option.text}</span>
                  </button>
                `;
              }).join("")}
            </div>

            ${state.currentFeedback ? `
              <div class="feedback-card">
                <div class="feedback-title">💡 决策反馈</div>
                <p>${state.currentFeedback.feedback}</p>
                <span class="tag">✨ 获得标签：${state.currentFeedback.tag}</span>
              </div>
            ` : ""}

            ${state.nextReady ? `
              <div class="next-row">
                <button class="primary" onclick="nextScene()">${state.sceneIndex === 2 ? "查看岗位小结" : "下一场景"}</button>
              </div>
            ` : ""}
          </aside>
        </div>
      `;
    }

    function chooseOption(index) {
      if (state.selectedIndex !== null) return;

      const role = getRole(state.currentRoleId);
      const scene = role.scenes[state.sceneIndex];
      const option = scene.options[index];

      state.selectedIndex = index;
      state.currentFeedback = option;
      state.currentTags.push(option.tag);
      showFloatingTag(option.tag);
      renderScenario();

      setTimeout(() => {
        state.nextReady = true;
        renderScenario();
      }, 500);
    }

    function nextScene() {
      if (state.sceneIndex < 2) {
        state.sceneIndex++;
        state.selectedIndex = null;
        state.currentFeedback = null;
        state.nextReady = false;
        renderScenario();
      } else {
        finishRole();
      }
    }

    function finishRole() {
      const role = getRole(state.currentRoleId);
      state.completed[role.id] = [...state.currentTags];
      showSummary(role);
      renderBottomNav();
    }

    function showSummary(role) {
      const matched = state.currentTags.some(tag => role.summaryTags.includes(tag));
      const comment = matched ? role.goodSummary : role.normalSummary;
      const canReport = completedCount() >= 3;

      modalRoot.innerHTML = `
        <div class="modal-mask">
          <section class="summary-card">
            <div class="summary-icon">${role.icon}</div>
            <h2>${role.name}体验完成</h2>
            <div class="summary-tags">
              ${state.currentTags.map(tag => `<span class="tag">✨ ${tag}</span>`).join("")}
            </div>
            <div class="summary-comment">${comment}</div>
            <div class="summary-actions">
              <button class="secondary" onclick="closeSummaryAndHome()">再体验一个岗位</button>
              <button class="primary" ${canReport ? "" : "disabled"} onclick="showReport()">查看我的报告</button>
            </div>
            ${canReport ? "" : `<p style="margin:14px 0 0;color:var(--muted);font-size:13px">再体验 ${3 - completedCount()} 个岗位后解锁完整报告</p>`}
          </section>
        </div>
      `;
    }

    function closeSummaryAndHome() {
      modalRoot.innerHTML = "";
      goHome();
    }

    function showFloatingTag(tag) {
      const el = document.createElement("div");
      el.className = "float-tag";
      el.textContent = `✨ 获得标签：${tag}`;
      floatingRoot.appendChild(el);
      setTimeout(() => el.remove(), 1250);
    }

    function goHome() {
      state.view = "home";
      state.currentRoleId = null;
      state.sceneIndex = 0;
      state.selectedIndex = null;
      state.currentFeedback = null;
      state.nextReady = false;
      render();
    }

    function showReport() {
      if (completedCount() < 3) {
        showToast(`还需要再体验 ${3 - completedCount()} 个岗位才能查看报告`);
        return;
      }
      modalRoot.innerHTML = "";
      state.view = "report";
      render();
    }

    function renderBottomNav() {
      const old = document.querySelector(".bottom-nav");
      if (old) old.remove();

      if (completedCount() < 3 || state.view === "report") return;

      const nav = document.createElement("div");
      nav.className = "bottom-nav";
      nav.innerHTML = `
        <span>已完成 ${completedCount()} 个岗位，职业倾向报告已解锁</span>
        <button class="primary" onclick="showReport()">查看我的报告</button>
      `;
      document.body.appendChild(nav);
    }

    function renderReport() {
      setAccent("#FF6B35");
      const tags = allTags();

      if (tags.length === 0) {
        screen.innerHTML = `
          <div class="report-card">
            <button class="back-btn" onclick="goHome()">← 返回首页</button>
            <div class="empty-report">你还没有完成岗位体验。先去体验 3 个岗位，再生成你的职场画像。</div>
          </div>
        `;
        return;
      }

      const freq = tags.reduce((acc, tag) => {
        acc[tag] = (acc[tag] || 0) + 1;
        return acc;
      }, {});
      const maxFreq = Math.max(...Object.values(freq));

      const rankings = roles.map(role => {
        const userTags = state.completed[role.id] || [];
        const matchedCount = userTags.filter(tag => role.summaryTags.includes(tag)).length;

        return {
          ...role,
          count: matchedCount,
          pct: Math.round(matchedCount / role.summaryTags.length * 100)
        };
      }).sort((a, b) => b.pct - a.pct);

      const persona = tags.length >= 6
        ? "你是【全能型】职场人，适应力强、学习力高！"
        : tags.length >= 4
          ? "你是【探索型】职场人，正在快速成长！"
          : "你是【专注型】职场人，找到适合的方向最重要！";

      screen.innerHTML = `
        <div class="report-card">
          <button class="back-btn" onclick="goHome()">← 返回首页</button>

          <div class="report-head">
            <div class="avatar">你</div>
            <div>
              <h1>你的职场画像</h1>
              <p class="subtitle">基于 ${completedCount()} 个岗位、${tags.length} 次真实情境决策生成。</p>
            </div>
          </div>

          <div class="report-section full">
            <h2>一句话职场人格画像</h2>
            <div class="persona">${persona}</div>
          </div>

          <div class="report-grid">
            <section class="report-section">
              <h2>标签云</h2>
              <div class="tag-cloud">
                ${Object.entries(freq).map(([tag, count], index) => {
                  const size = 15 + count / maxFreq * 18;
                  const palette = ["#FF6B35", "#4A90D9", "#27AE60", "#9B59B6"];
                  return `<span class="cloud-tag" style="font-size:${size}px;--tag-color:${palette[index % palette.length]}">${tag} ×${count}</span>`;
                }).join("")}
              </div>
            </section>

            <section class="report-section">
              <h2>岗位匹配度排名</h2>
              <div class="rank-list">
                ${rankings.map(role => `
                  <div class="rank-item">
                    <strong>${role.icon} ${role.name}</strong>
                    <div class="bar" style="--color:${role.color};--pct:${role.pct}%"><span></span></div>
                    <b>${role.pct}%</b>
                  </div>
                `).join("")}
              </div>
            </section>

            <section class="report-section full">
              <h2>已获得标签</h2>
              <div class="summary-tags" style="justify-content:flex-start">
                ${roles.map(role => {
                  const roleTags = state.completed[role.id] || [];
                  if (!roleTags.length) return "";
                  return roleTags.map(tag => `<span class="tag" style="--accent:${role.color}">${role.icon} ${tag}</span>`).join("");
                }).join("")}
              </div>
            </section>

            <section class="report-section full">
              <button class="primary" onclick="resetAll()">重新测试</button>
            </section>
          </div>
        </div>
      `;
    }

    function resetAll() {
      state.view = "home";
      state.currentRoleId = null;
      state.sceneIndex = 0;
      state.selectedIndex = null;
      state.currentTags = [];
      state.currentFeedback = null;
      state.nextReady = false;
      state.completed = {};
      render();
      showToast("数据已重置，重新开始你的职场实验吧");
    }

    function showToast(text) {
      const old = document.querySelector(".toast");
      if (old) old.remove();

      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = text;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 1800);
    }

    render();
  </script>
</body>
</html>
