<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>瞬记 — 3秒语音转结构化笔记助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    color: #2c3e50;
    padding: 20px;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    text-align: center;
    color: #fff;
    margin-bottom: 30px;
  }
  .header h1 {
    font-size: 38px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .header .subtitle {
    font-size: 15px;
    opacity: 0.9;
    letter-spacing: 1px;
  }
  .header .badge {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    margin-top: 10px;
    backdrop-filter: blur(10px);
  }

  /* Main Grid */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: 24px;
  }

  /* Card */
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }

  .card-title {
    font-size: 18px;
    font-weight: 600;
    color: #2c3e50;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #667eea;
  }

  /* Recording Section */
  .recorder {
    text-align: center;
    padding: 20px 0;
  }
  .mic-btn {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 18px;
    font-weight: 600;
    box-shadow: 0 10px 30px rgba(238, 90, 111, 0.4);
    transition: all 0.3s;
    position: relative;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .mic-btn:hover { transform: scale(1.05); }
  .mic-btn.recording {
    background: linear-gradient(135deg, #ff4757, #ff3838);
    animation: pulse 1.5s infinite;
  }
  .mic-btn .icon { font-size: 40px; margin-bottom: 5px; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 10px 30px rgba(255,71,87,0.4); }
    50% { box-shadow: 0 10px 50px rgba(255,71,87,0.8), 0 0 0 20px rgba(255,71,87,0.1); }
  }

  .timer {
    font-size: 32px;
    font-weight: 300;
    color: #2c3e50;
    margin: 20px 0;
    font-family: "SF Mono", Consolas, monospace;
    letter-spacing: 2px;
  }
  .status {
    font-size: 14px;
    color: #7f8c8d;
    margin-bottom: 10px;
  }

  .scene-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #ecf0f1;
  }
  .scene-tag {
    padding: 8px 16px;
    background: #f8f9fa;
    border: 2px solid transparent;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    color: #7f8c8d;
    transition: all 0.2s;
  }
  .scene-tag:hover { background: #e8eaf6; color: #667eea; }
  .scene-tag.active {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border-color: #667eea;
  }

  /* Transcription Panel */
  .transcript-area {
    background: #f8f9fa;
    border-radius: 12px;
    padding: 20px;
    min-height: 200px;
    max-height: 300px;
    overflow-y: auto;
    font-size: 15px;
    line-height: 1.8;
  }
  .transcript-text { color: #2c3e50; }
  .transcript-text .new-word {
    color: #667eea;
    font-weight: 500;
  }
  .placeholder-text {
    color: #bdc3c7;
    text-align: center;
    padding: 40px 0;
    font-style: italic;
  }

  /* Extracted Fields */
  .fields-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 20px;
  }
  .field-box {
    background: #f8f9fa;
    border-radius: 12px;
    padding: 16px;
    border-left: 4px solid #667eea;
    transition: all 0.3s;
  }
  .field-box:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
  .field-box.todo { border-left-color: #ff6b6b; }
  .field-box.person { border-left-color: #4ecdc4; }
  .field-box.time { border-left-color: #f7b731; }
  .field-box.conclusion { border-left-color: #667eea; }

  .field-label {
    font-size: 12px;
    font-weight: 600;
    color: #7f8c8d;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .field-label .emoji { font-size: 14px; }

  .field-content {
    font-size: 14px;
    color: #2c3e50;
    min-height: 40px;
  }
  .field-chip {
    display: inline-block;
    background: #fff;
    padding: 6px 12px;
    border-radius: 16px;
    margin: 3px;
    font-size: 13px;
    border: 1px solid #ecf0f1;
    cursor: pointer;
    transition: all 0.2s;
  }
  .field-chip:hover { background: #667eea; color: #fff; border-color: #667eea; }

  /* Sample/Load button */
  .demo-section {
    margin-top: 20px;
    text-align: center;
  }
  .btn {
    padding: 12px 28px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    margin: 0 6px;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
  .btn-secondary {
    background: #ecf0f1;
    color: #7f8c8d;
    margin: 0 6px;
  }
  .btn-secondary:hover { background: #dfe6e9; }

  /* Right Panel - Note Cards */
  .notes-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .count-badge {
    background: #667eea;
    color: #fff;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
  }

  .note-card {
    background: linear-gradient(135deg, #fff 0%, #f8f9ff 100%);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid #ecf0f1;
    transition: all 0.3s;
    position: relative;
  }
  .note-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(102,126,234,0.15);
  }
  .note-card .note-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .note-card .note-time {
    font-size: 12px;
    color: #95a5a6;
  }
  .note-card .note-scene {
    background: #e8eaf6;
    color: #667eea;
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 11px;
  }
  .note-card .note-content {
    font-size: 14px;
    line-height: 1.7;
    color: #2c3e50;
    margin-bottom: 14px;
  }
  .note-card .note-fields {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .note-field {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 12px;
    font-weight: 500;
  }
  .nf-todo { background: #ffe0e0; color: #ee5a6f; }
  .nf-person { background: #d0f4f0; color: #1abc9c; }
  .nf-time { background: #fff3d6; color: #f39c12; }
  .nf-conclusion { background: #e0e0ff; color: #667eea; }

  .note-card .note-actions {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    padding-top: 12px;
    border-top: 1px dashed #ecf0f1;
  }
  .mini-btn {
    background: none;
    border: 1px solid #ecf0f1;
    padding: 6px 14px;
    border-radius: 15px;
    font-size: 12px;
    cursor: pointer;
    color: #7f8c8d;
    transition: all 0.2s;
  }
  .mini-btn:hover {
    background: #667eea;
    color: #fff;
    border-color: #667eea;
  }

  /* Stats */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-item {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 18px;
    color: #fff;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .stat-value {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .stat-label {
    font-size: 12px;
    opacity: 0.85;
    margin-top: 4px;
  }

  @media (max-width: 960px) {
    .main-grid { grid-template-columns: 1fr; }
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
    .fields-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📝 瞬 记</h1>
    <div class="subtitle">3 秒语音转结构化笔记助手 · 会议/听课/通勤灵感永不丢失</div>
    <div class="badge">✨ DEMO 原型 · 创造力大赛作品</div>
  </div>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-item"><div class="stat-value" id="stat-total">128</div><div class="stat-label">已生成笔记</div></div>
    <div class="stat-item"><div class="stat-value" id="stat-time">00:00</div><div class="stat-label">本次录音</div></div>
    <div class="stat-item"><div class="stat-value" id="stat-words">0</div><div class="stat-label">识别字数</div></div>
    <div class="stat-item"><div class="stat-value" id="stat-todo">7</div><div class="stat-label">待办事项</div></div>
  </div>

  <div class="main-grid">
    <!-- Left: Recorder -->
    <div>
      <div class="card">
        <div class="card-title"><span class="dot"></span>🎙️ 语音录入 & 实时转写</div>

        <div class="recorder">
          <div class="timer" id="timer">00:00</div>
          <button class="mic-btn" id="micBtn">
            <span class="icon">🎤</span>
            <span id="micText">开始录音</span>
          </button>
          <div class="status" id="status">点击按钮开始，自动识别语音并提取关键信息</div>
        </div>

        <div class="scene-tags">
          <div class="scene-tag active" data-scene="会议">💼 会议</div>
          <div class="scene-tag" data-scene="听课">🎓 听课</div>
          <div class="scene-tag" data-scene="通勤">🚇 通勤灵感</div>
          <div class="scene-tag" data-scene="沟通">🤝 客户沟通</div>
        </div>

        <div class="demo-section">
          <button class="btn btn-primary" id="demoBtn">▶ 播放示例录音</button>
          <button class="btn btn-secondary" id="clearBtn">🗑 清空内容</button>
        </div>

        <div style="margin-top:24px;">
          <div class="card-title" style="margin-bottom:12px;"><span class="dot"></span>📄 实时转写文本</div>
          <div class="transcript-area">
            <div id="transcript" class="placeholder-text">录音后，转写内容将在这里实时显示...</div>
          </div>
        </div>

        <div style="margin-top:24px;">
          <div class="card-title" style="margin-bottom:12px;"><span class="dot"></span>🔍 智能提取字段</div>
          <div class="fields-grid">
            <div class="field-box todo">
              <div class="field-label"><span class="emoji">✅</span> 待办事项</div>
              <div class="field-content" id="field-todo"><span style="color:#bdc3c7;font-size:13px;">等待识别...</span></div>
            </div>
            <div class="field-box person">
              <div class="field-label"><span class="emoji">👤</span> 人名</div>
              <div class="field-content" id="field-person"><span style="color:#bdc3c7;font-size:13px;">等待识别...</span></div>
            </div>
            <div class="field-box time">
              <div class="field-label"><span class="emoji">⏰</span> 时间节点</div>
              <div class="field-content" id="field-time"><span style="color:#bdc3c7;font-size:13px;">等待识别...</span></div>
            </div>
            <div class="field-box conclusion">
              <div class="field-label"><span class="emoji">💡</span> 结论</div>
              <div class="field-content" id="field-conclusion"><span style="color:#bdc3c7;font-size:13px;">等待识别...</span></div>
            </div>
          </div>

          <div style="margin-top:20px; text-align:center;">
            <button class="btn btn-primary" id="saveBtn">💾 生成笔记卡片</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Right: Notes -->
    <div class="card">
      <div class="notes-header">
        <div class="card-title" style="margin-bottom:0;"><span class="dot"></span>📂 我的笔记卡片</div>
        <span class="count-badge" id="note-count">3</span>
      </div>

      <div id="notesList">
        <!-- notes injected -->
      </div>
    </div>
  </div>
</div>

<script>
  // Sample demo scripts per scene
  const demoScripts = {
    "会议": {
      text: "张经理，关于下周的产品评审会议，我建议定在周三下午两点。李工负责前端对接，王芳准备原型文档，截止日期是本周五下班前。结论是采用方案 B，预算控制在八万以内。",
      todo: ["准备原型文档", "前端对接", "方案 B 评审"],
      person: ["张经理", "李工", "王芳"],
      time: ["周三下午 2 点", "本周五下班前"],
      conclusion: ["采用方案 B", "预算 ≤ 8 万"]
    },
    "听课": {
      text: "老师强调第三章函数求导是考试重点，小明同学下周一要交作业，期中考试时间定在十一月十五日。结论是多做练习题并整理错题本。",
      todo: ["交作业", "整理错题本", "多做练习题"],
      person: ["老师", "小明"],
      time: ["下周一", "十一月十五日"],
      conclusion: ["第三章为考试重点"]
    },
    "通勤": {
      text: "突然想到可以把笔记卡片做成可编辑模板，下次周报用。周末和朋友讨论这个 idea，顺便把产品命名也定一下。",
      todo: ["做可编辑笔记模板", "周报", "讨论产品命名"],
      person: ["朋友"],
      time: ["下次周报", "周末"],
      conclusion: ["idea 很有价值"]
    },
    "沟通": {
      text: "客户刘总承诺本月底之前签订合同，陈助理负责对接合同细节。结论是先打预付款三十万，项目八月一日启动。",
      todo: ["签订合同", "对接合同细节", "打预付款"],
      person: ["刘总", "陈助理"],
      time: ["本月底", "八月一日"],
      conclusion: ["预付款 30 万", "项目启动"]
    }
  };

  // Initial notes (demo)
  let notes = [
    {
      time: "今天 09:32",
      scene: "会议",
      content: "产品评审会议纪要：采用方案 B，周三下午 2 点复审，王芳准备原型。",
      fields: { todo: 2, person: 2, time: 1, conclusion: 1 }
    },
    {
      time: "昨天 18:15",
      scene: "通勤",
      content: "通勤灵感：把瞬记做成微信小程序，支持一键分享到企业微信。",
      fields: { todo: 1, person: 0, time: 0, conclusion: 1 }
    },
    {
      time: "昨天 14:08",
      scene: "听课",
      content: "第三章函数求导是重点，多做练习题并整理错题本，下周一交作业。",
      fields: { todo: 3, person: 1, time: 1, conclusion: 1 }
    }
  ];

  let currentScene = "会议";
  let recording = false;
  let timerInterval = null;
  let seconds = 0;
  let typingInterval = null;
  let currentDemo = null;

  // Scene selection
  document.querySelectorAll('.scene-tag').forEach(tag => {
    tag.addEventListener('click', () => {
      document.querySelectorAll('.scene-tag').forEach(t => t.classList.remove('active'));
      tag.classList.add('active');
      currentScene = tag.dataset.scene;
    });
  });

  // Format time
  function formatTime(s) {
    const m = String(Math.floor(s / 60)).padStart(2, '0');
    const sec = String(s % 60).padStart(2, '0');
    return `${m}:${sec}`;
  }

  // Mic button
  const micBtn = document.getElementById('micBtn');
  const micText = document.getElementById('micText');
  const timerEl = document.getElementById('timer');
  const statusEl = document.getElementById('status');

  micBtn.addEventListener('click', () => {
    if (!recording) startRecording();
    else stopRecording();
  });

  function startRecording() {
    recording = true;
    seconds = 0;
    micBtn.classList.add('recording');
    micText.textContent = '停止录音';
    statusEl.textContent = '🎵 正在录音并实时识别中...';
    timerInterval = setInterval(() => {
      seconds++;
      timerEl.textContent = formatTime(seconds);
      document.getElementById('stat-time').textContent = formatTime(seconds);
    }, 1000);

    // Start fake transcription
    playDemo();
  }

  function stopRecording() {
    recording = false;
    micBtn.classList.remove('recording');
    micText.textContent = '开始录音';
    statusEl.textContent = '✓ 录音结束，字段提取完成';
    clearInterval(timerInterval);
    clearInterval(typingInterval);
  }

  // Demo button
  document.getElementById('demoBtn').addEventListener('click', () => {
    if (recording) stopRecording();
    startRecording();
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    stopRecording();
    seconds = 0;
    timerEl.textContent = '00:00';
    document.getElementById('stat-time').textContent = '00:00';
    document.getElementById('stat-words').textContent = '0';
    document.getElementById('transcript').innerHTML = '<span class="placeholder-text">录音后，转写内容将在这里实时显示...</span>';
    ['todo', 'person', 'time', 'conclusion'].forEach(f => {
      document.getElementById('field-' + f).innerHTML = '<span style="color:#bdc3c7;font-size:13px;">等待识别...</span>';
    });
    statusEl.textContent = '点击按钮开始，自动识别语音并提取关键信息';
  });

  // Play demo transcription (typewriter)
  function playDemo() {
    currentDemo = demoScripts[currentScene];
    const text = currentDemo.text;
    const transcriptEl = document.getElementById('transcript');
    transcriptEl.innerHTML = '';
    let i = 0;
    let wordCount = 0;

    typingInterval = setInterval(() => {
      if (i >= text.length) {
        clearInterval(typingInterval);
        stopRecording();
        fillFields(currentDemo);
        return;
      }
      const char = text[i];
      const span = document.createElement('span');
      span.textContent = char;
      span.className = 'new-word';
      span.style.color = '#667eea';
      span.style.fontWeight = '500';
      transcriptEl.appendChild(span);

      setTimeout(() => { span.style.color = '#2c3e50'; span.style.fontWeight = 'normal'; }, 500);

      if (char !== ' ' && char !== '，' && char !== '。') {
        wordCount++;
        document.getElementById('stat-words').textContent = wordCount;
      }
      i++;

      // Incremental field filling
      if (i === Math.floor(text.length / 3)) partialFill(currentDemo, 1);
      if (i === Math.floor(text.length / 2)) partialFill(currentDemo, 2);
    }, 150);
  }

  function partialFill(demo, stage) {
    if (stage >= 1) {
      const personCount = Math.max(1, Math.floor(demo.person.length / 2));
      document.getElementById('field-person').innerHTML =
        demo.person.slice(0, personCount).map(p => `<span class="field-chip">${p}</span>`).join('');
    }
    if (stage >= 2) {
      const timeCount = Math.max(1, Math.floor(demo.time.length / 2));
      document.getElementById('field-time').innerHTML =
        demo.time.slice(0, timeCount).map(p => `<span class="field-chip">${p}</span>`).join('');
      document.getElementById('field-todo').innerHTML =
        demo.todo.slice(0, 1).map(p => `<span class="field-chip">${p}</span>`).join('');
    }
  }

  function fillFields(demo) {
    document.getElementById('field-todo').innerHTML =
      demo.todo.map(p => `<span class="field-chip">${p}</span>`).join('');
    document.getElementById('field-person').innerHTML =
      demo.person.map(p => `<span class="field-chip">${p}</span>`).join('');
    document.getElementById('field-time').innerHTML =
      demo.time.map(p => `<span class="field-chip">${p}</span>`).join('');
    document.getElementById('field-conclusion').innerHTML =
      demo.conclusion.map(p => `<span class="field-chip">${p}</span>`).join('');
  }

  // Save note
  document.getElementById('saveBtn').addEventListener('click', () => {
    if (!currentDemo) {
      alert('请先录一段语音或点击「播放示例录音」');
      return;
    }
    const now = new Date();
    const time = `刚刚 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    const newNote = {
      time,
      scene: currentScene,
      content: currentDemo.text,
      fields: {
        todo: currentDemo.todo.length,
        person: currentDemo.person.length,
        time: currentDemo.time.length,
        conclusion: currentDemo.conclusion.length
      }
    };
    notes.unshift(newNote);
    renderNotes();
    const stat = document.getElementById('stat-total');
    stat.textContent = parseInt(stat.textContent) + 1;
    statusEl.textContent = '🎉 笔记已生成，可在右侧查看';
  });

  // Render note cards
  function renderNotes() {
    const listEl = document.getElementById('notesList');
    document.getElementById('note-count').textContent = notes.length;
    listEl.innerHTML = notes.map(n => `
      <div class="note-card">
        <div class="note-top">
          <span class="note-time">🕐 ${n.time}</span>
          <span class="note-scene">${n.scene}</span>
        </div>
        <div class="note-content">${n.content}</div>
        <div class="note-fields">
          ${n.fields.todo > 0 ? `<span class="note-field nf-todo">✅ 待办 ${n.fields.todo}</span>` : ''}
          ${n.fields.person > 0 ? `<span class="note-field nf-person">👤 人名 ${n.fields.person}</span>` : ''}
          ${n.fields.time > 0 ? `<span class="note-field nf-time">⏰ 时间 ${n.fields.time}</span>` : ''}
          ${n.fields.conclusion > 0 ? `<span class="note-field nf-conclusion">💡 结论 ${n.fields.conclusion}</span>` : ''}
        </div>
        <div class="note-actions">
          <button class="mini-btn">✏️ 编辑</button>
          <button class="mini-btn">📤 分享</button>
          <button class="mini-btn">⭐ 收藏</button>
          <button class="mini-btn">📋 复制</button>
        </div>
      </div>
    `).join('');
  }

  renderNotes();
</script>

</body>
</html>
