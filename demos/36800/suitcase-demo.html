  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));

  if (page === 'wardrobe') renderWardrobe();

}

  document.querySelectorAll('.gender-option').forEach(g => g.classList.remove('active'));
  document.querySelector(`.gender-option[data-gender="${gender}"]`).classList.add('active');
  document.getElementById('modelImage').src = `assets/model_${gender}.jpg`;
}

// ===== 上传衣物 =====
function uploadClothing(type) {
  currentType = type;
  document.getElementById('fileInput').click();
}

document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file || !currentType) return;
  
  const reader = new FileReader();
  reader.onload = function(ev) {
    const imageData = ev.target.result;
    
    // 模拟AI处理
    const overlay = document.getElementById('overlay-' + currentType);
    const loading = document.getElementById('loadingOverlay');
    loading.classList.add('show');
    
    setTimeout(() => {
      overlay.src = imageData;
      overlay.style.display = 'block';
      loading.classList.remove('show');
      
      clothes[currentType] = imageData;
      updateClothingItem(currentType, imageData);
      showToast('已添加' + typeNames[currentType]);
    }, 800);
  };
  reader.readAsDataURL(file);
  this.value = '';
});

// ===== 更新衣物格子UI =====
function updateClothingItem(type, imageData) {
  const item = document.querySelector(`.clothing-item[data-type="${type}"]`);
  item.classList.add('has-image');
  
  // 移除占位符
  const placeholder = item.querySelector('.upload-placeholder');
  if (placeholder) placeholder.remove();
  
  // 添加图片
  const img = document.createElement('img');
  img.src = imageData;
  img.className = 'item-image';
  item.appendChild(img);
}

// ===== 保存搭配 =====
function saveOutfit() {
  const hasClothes = Object.values(clothes).some(v => v !== null);
  if (!hasClothes) {
    showToast('请先搭配衣物');
    return;
  }
  
  const outfit = {
    gender: currentGender,
    clothes: { ...clothes },
    createTime: formatDateTime(new Date())
  };
  outfits.push(outfit);
  localStorage.setItem('suitcase_outfits', JSON.stringify(outfits));
  
  // 保存后清空
  clearCurrentOutfit();
  showToast('保存成功');
}

// ===== 清空搭配 =====
function clearOutfit() {
  clearCurrentOutfit();
  showToast('已清空');
}

function clearCurrentOutfit() {
  clothes = { hat: null, top: null, outerwear: null, pants: null, socks: null, shoes: null };
  
  // 隐藏所有叠加层
  document.querySelectorAll('.overlay-item').forEach(el => el.style.display = 'none');
  
  // 重置所有衣物格子
  document.querySelectorAll('.clothing-item').forEach(item => {
    item.classList.remove('has-image');
    const img = item.querySelector('.item-image');
    if (img) img.remove();
    
    if (!item.querySelector('.upload-placeholder')) {
      const ph = document.createElement('div');
      ph.className = 'upload-placeholder';
      ph.innerHTML = '<div class="upload-icon">+</div><span class="upload-text">点击上传</span>';
      item.appendChild(ph);
    }
  });
}

// ===== 渲染衣橱 =====
function renderWardrobe() {
  const container = document.getElementById('wardrobeContent');
  
  if (outfits.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">👔</div>
        <div class="empty-text">还没有保存的搭配</div>
        <div class="empty-tip">去首页搭配一套吧~</div>
      </div>`;
    return;
  }
  
  let html = '<div class="outfit-list">';
  outfits.forEach((outfit, index) => {
    const genderText = outfit.gender === 'male' ? '👨 男' : '👩 女';
    const modelImg = outfit.gender === 'male' ? 'assets/model_male.jpg' : 'assets/model_female.jpg';
    
    let thumbsHtml = '';
    Object.keys(outfit.clothes).forEach(type => {
      if (outfit.clothes[type]) {
        thumbsHtml += `<div class="cloth-thumb"><img src="${outfit.clothes[type]}" alt="${typeNames[type]}"></div>`;
      }
    });
    
    html += `
      <div class="outfit-card">
        <div class="outfit-model"><img src="${modelImg}" alt="模特"></div>
        <div class="outfit-right">
          <div class="clothes-grid">${thumbsHtml}</div>
          <div class="save-time">${outfit.createTime}</div>
          <div class="outfit-actions">
            <button class="btn-view" onclick="loadOutfit(${index})">查看</button>
            <button class="btn-delete" onclick="deleteOutfit(${index})">删除</button>
          </div>
        </div>
      </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

// ===== 查看搭配 =====
function loadOutfit(index) {
  const outfit = outfits[index];
  currentGender = outfit.gender;
  clothes = { ...outfit.clothes };
  
  // 切换性别
  switchGender(currentGender);
  
  // 显示衣物
  Object.keys(clothes).forEach(type => {
    const overlay = document.getElementById('overlay-' + type);
    if (clothes[type]) {
      overlay.src = clothes[type];
      overlay.style.display = 'block';
      updateClothingItem(type, clothes[type]);
    }
  });
  
  switchPage('home');
  showToast('已加载搭配');
}

// ===== 删除搭配 =====
function deleteOutfit(index) {
  outfits.splice(index, 1);
  localStorage.setItem('suitcase_outfits', JSON.stringify(outfits));
  renderWardrobe();
  showToast('已删除');
}

// ===== Toast =====
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1500);
}

// ===== 格式化时间 =====
function formatDateTime(date) {
  const y = date.getFullYear();
  const m = date.getMonth() + 1;
  const d = date.getDate();
  const h = String(date.getHours()).padStart(2, '0');
  const min = String(date.getMinutes()).padStart(2, '0');
  const s = String(date.getSeconds()).padStart(2, '0');
  return `${y}/${m}/${d} ${h}:${min}:${s}`;
}
