<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>财智Mirror · AI财务镜像</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(145deg, #0b0f1c 0%, #1a1f2f 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .app-screen {
      max-width: 390px;
      width: 100%;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 48px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
      padding: 28px 20px 24px;
      color: #f0f2f5;
      position: relative;
      overflow: hidden;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      margin-bottom: 24px;
    }
    .greeting {
      margin-bottom: 20px;
    }
    .greeting h2 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #ffffff 0%, #d0d5e0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .greeting p {
      font-size: 15px;
      color: rgba(255,255,255,0.6);
      margin-top: 6px;
    }
    .ai-mirror-card {
      background: radial-gradient(circle at 30% 20%, rgba(90, 120, 250, 0.18), rgba(30, 35, 50, 0.7));
      border-radius: 32px;
      padding: 22px 20px;
      margin-bottom: 22px;
      border: 1px solid rgba(120, 150, 255, 0.25);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 30px -12px rgba(0,0,0,0.5);
    }
    .ai-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .ai-avatar {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #6c8cff, #3b5ef0);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .ai-title {
      font-weight: 600;
      font-size: 18px;
    }
    .ai-sub {
      font-size: 13px;
      color: #a0adc4;
    }
    .insight-box {
      background: rgba(0,0,0,0.35);
      border-radius: 20px;
      padding: 16px;
      margin-top: 8px;
    }
    .insight-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .label {
      font-size: 14px;
      color: #b4bed6;
    }
    .value {
      font-weight: 600;
    }
    .highlight-red {
      color: #ff7c7c;
    }
    .bar-wrapper {
      height: 8px;
      background: rgba(255,255,255,0.12);
      border-radius: 20px;
      margin: 12px 0 10px;
      overflow: hidden;
    }
    .bar-fill {
      width: 68%;
      height: 100%;
      background: linear-gradient(90deg, #ff7c7c, #ff5252);
      border-radius: 20px;
    }
    .suggestion {
      font-size: 14px;
      margin-top: 8px;
      color: #cfdeff;
      background: rgba(60, 100, 255, 0.2);
      padding: 8px 12px;
      border-radius: 14px;
      border-left: 4px solid #6c8cff;
    }
    .quick-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .action-btn {
      flex: 1;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 14px 0;
      text-align: center;
      font-weight: 500;
      font-size: 15px;
      border: 1px solid rgba(255,255,255,0.08);
      transition: 0.2s;
      cursor: pointer;
    }
    .action-btn.primary {
      background: rgba(90, 120, 250, 0.28);
      border-color: rgba(140, 160, 255, 0.5);
    }
    .transaction-list p {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 14px;
      color: #ccc;
    }
    .tx-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .tx-info {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .tx-icon {
      width: 38px;
      height: 38px;
      background: #2a3147;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tx-name {
      font-weight: 500;
    }
    .tx-cat {
      font-size: 12px;
      color: #8892aa;
    }
    .tx-amount {
      font-weight: 600;
    }
    .voice-fab {
      position: sticky;
      bottom: 8px;
      display: flex;
      justify-content: center;
      margin-top: 18px;
    }
    .fab {
      background: #3b5ef0;
      width: 60px;
      height: 60px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 12px 25px rgba(59,94,240,0.5);
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div class="app-screen">
    <div class="status-bar">
      <span>9:41</span>
      <span>📶 🔋 92%</span>
    </div>
    <div class="greeting">
      <h2>林小鱼, 上午好</h2>
      <p>你的10月财务镜像已生成 · AI洞察就绪</p>
    </div>

    <!-- AI财务镜像卡片 -->
    <div class="ai-mirror-card">
      <div class="ai-header">
        <div class="ai-avatar">🧠</div>
        <div>
          <div class="ai-title">财智Mirror · 月度报告</div>
          <div class="ai-sub">10月1日 - 10月25日</div>
        </div>
      </div>
      <div class="insight-box">
        <div class="insight-row">
          <span class="label">🍔 餐饮支出占比</span>
          <span class="value highlight-red">38%</span>
        </div>
        <div class="bar-wrapper">
          <div class="bar-fill" style="width: 38%; background: #ff7c7c;"></div>
        </div>
        <div class="insight-row">
          <span class="label">☕ “拿铁因子” (咖啡/奶茶)</span>
          <span class="value highlight-red">¥1,260</span>
        </div>
        <div class="suggestion">
          💡 相比上月，饮品支出增长22%。如果控制在800元以内，本月储蓄可额外增加460元。
        </div>
      </div>
    </div>

    <!-- 快捷操作 -->
    <div class="quick-actions">
      <div class="action-btn primary">🎤 语音记账</div>
      <div class="action-btn">💬 对话分析</div>
    </div>

    <!-- 近期流水 -->
    <div class="transaction-list">
      <p>📋 最近记录</p>
      <div class="tx-item">
        <div class="tx-info">
          <div class="tx-icon">🥗</div>
          <div>
            <div class="tx-name">轻食沙拉</div>
            <div class="tx-cat">午餐 · 今天 12:30</div>
          </div>
        </div>
        <div class="tx-amount">-48.00</div>
      </div>
      <div class="tx-item">
        <div class="tx-info">
          <div class="tx-icon">☕</div>
          <div>
            <div class="tx-name">燕麦拿铁</div>
            <div class="tx-cat">饮品 · 昨天 08:15</div>
          </div>
        </div>
        <div class="tx-amount">-28.00</div>
      </div>
      <div class="tx-item">
        <div class="tx-info">
          <div class="tx-icon">📱</div>
          <div>
            <div class="tx-name">自动识别: 滴滴出行</div>
            <div class="tx-cat">交通 · 10月24日</div>
          </div>
        </div>
        <div class="tx-amount">-24.50</div>
      </div>
    </div>

    <div class="voice-fab">
      <div class="fab">🎙️</div>
    </div>
    <div style="text-align: center; font-size: 12px; color: #5b647a; margin-top: 10px;">按住说话或输入“分析本月储蓄”</div>
  </div>
</body>
</html>
