<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI沙盘：校园职业规划养成（原型）</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-badge">AI</div>
          <div class="brand-text">
            <div class="brand-title">校园职业规划养成</div>
            <div class="brand-sub">用日常积累，换更满意的择业结果</div>
          </div>
        </div>
        <div class="top-actions">
          <button class="btn ghost" id="btnNew">新开档</button>
          <button class="btn ghost" id="btnSave">存档</button>
          <button class="btn ghost" id="btnLoad">读档</button>
        </div>
      </header>

      <main class="layout">
        <section class="map-panel">
          <div class="panel-title">
            <span>Q版校园</span>
            <span class="muted" id="timeLabel"></span>
          </div>
          <div class="campus" id="campus"></div>
          <div class="hint muted">提示：点击建筑 → 选择行动。每次行动消耗一个时间段（早/午/晚）。</div>
        </section>

        <aside class="side">
          <section class="card">
            <div class="card-title">角色状态</div>
            <div class="stats" id="stats"></div>
          </section>

          <section class="card">
            <div class="card-title">目标与进度</div>
            <div class="goal-row">
              <label class="muted" for="goalSelect">职业目标</label>
              <select id="goalSelect" class="select">
                <option value="software">软件/互联网</option>
                <option value="research">科研/读研</option>
                <option value="civil">体制/国企</option>
                <option value="business">市场/产品/运营</option>
              </select>
            </div>
            <div class="progress">
              <div class="progress-row"><span class="muted">毕业剩余</span><span id="remainLabel"></span></div>
              <div class="progress-row"><span class="muted">就业匹配度</span><span id="fitLabel"></span></div>
              <div class="bar"><div class="bar-inner" id="fitBar"></div></div>
              <div class="muted small">匹配度来自：成绩/技能/作品/人脉/健康等长期积累。</div>
            </div>
          </section>

          <section class="card">
            <div class="card-title">导师建议（离线AI）</div>
            <div class="mentor" id="mentor"></div>
            <div class="muted small">原型说明：当前为规则型“AI导师”。后续可接入大模型，让建议更个性化。</div>
          </section>

          <section class="card">
            <div class="card-title">行动日志</div>
            <div class="log" id="log"></div>
          </section>
        </aside>
      </main>

      <div class="modal-backdrop hidden" id="modalBackdrop">
        <div class="modal" role="dialog" aria-modal="true">
          <div class="modal-title" id="modalTitle"></div>
          <div class="modal-body" id="modalBody"></div>
          <div class="modal-actions" id="modalActions"></div>
        </div>
      </div>
    </div>

    <script src="./game.js"></script>
  </body>
</html>
