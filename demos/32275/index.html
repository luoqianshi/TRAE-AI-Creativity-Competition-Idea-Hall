    --footer-link: #27ae60;

/* ==================== 全局样式 ==================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-tertiary) 100%);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    transition: background var(--transition-speed) ease;
}

.container {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px;
}

/* 头部 */
.header {
    text-align: center;
    padding: 40px 0 30px;
}

.header h1 {
    font-size: 32px;
    background: var(--title-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
    transition: background var(--transition-speed) ease;
}

.header .subtitle {
    font-size: 14px;
    color: var(--text-muted);
    letter-spacing: 2px;
}

.header .stars {
    font-size: 20px;
    margin-top: 10px;
    opacity: 0.6;
}

/* 区域通用样式 */
.section {
    background: var(--section-bg);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    border: 1px solid var(--section-border);
    backdrop-filter: blur(10px);
}

.section-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.section-title .icon {
    font-size: 22px;
}

/* 体系选择 */
.system-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.system-card {
    background: var(--system-card-bg);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    border: 2px solid transparent;
}

.system-card:hover {
    background: var(--system-card-hover);
}

.system-card.active {
    border-color: var(--accent);
    background: var(--accent-soft);
}

.system-card .sys-icon {
    font-size: 32px;
    margin-bottom: 8px;
}

.system-card .sys-name {
    font-size: 15px;
    font-weight: 500;
}

.system-card .sys-desc {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
}

/* 表单 */
.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 8px;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    transition: border-color 0.3s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: var(--accent);
}

.form-group textarea {
    resize: vertical;
    min-height: 80px;
}

.form-group select option {
    background: var(--bg-primary);
}

.form-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

/* 按钮 */
.btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    background: var(--btn-gradient);
    color: white;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: var(--btn-hover-shadow);
}

.btn:active {
    transform: translateY(0);
}

.btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

/* 塔罗牌区域 */
.tarot-area {
    display: none;
}

.tarot-area.active {
    display: block;
}

.cards-container {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin: 20px 0;
    flex-wrap: wrap;
}

.tarot-card {
    width: 100px;
    height: 160px;
    perspective: 1000px;
    cursor: pointer;
}

.tarot-card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s;
}

.tarot-card.flipped .tarot-card-inner {
    transform: rotateY(180deg);
}

.tarot-card-front,
.tarot-card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.tarot-card-front {
    background: var(--card-front-bg);
    border: 2px solid var(--card-border);
    transition: border-color var(--transition-speed) ease, background var(--transition-speed) ease;
}

.tarot-card-front::after {
    content: '?';
    font-size: 48px;
    color: var(--card-front-icon);
}

.tarot-card-back {
    background: var(--card-back-bg);
    border: 2px solid var(--card-back-border);
    transform: rotateY(180deg);
    flex-direction: column;
    padding: 10px;
    text-align: center;
    transition: border-color var(--transition-speed) ease, background var(--transition-speed) ease;
}

.tarot-card-back .card-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--card-back-text);
    margin-bottom: 4px;
}

.tarot-card-back .card-icon {
    font-size: 28px;
}

.tarot-card-back .card-position {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
}

.card-hint {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 12px;
}

/* 结果区域 */
.result-area {
    display: none;
}

.result-area.active {
    display: block;
}

.result-content {
    background: var(--section-bg);
    border-radius: 12px;
    padding: 20px;
    margin-top: 16px;
    line-height: 1.8;
}

.result-content h3 {
    color: var(--result-h3);
    margin-bottom: 12px;
    font-size: 16px;
}

.result-content p {
    margin-bottom: 10px;
    font-size: 14px;
}

.result-content .highlight {
    color: var(--highlight);
    font-weight: 500;
}

.result-content .advice {
    background: var(--advice-bg);
    border-left: 3px solid var(--advice-border);
    padding: 12px;
    border-radius: 0 8px 8px 0;
    margin-top: 16px;
}

/* 加载动画 */
.loading {
    display: none;
    text-align: center;
    padding: 30px;
}

.loading.active {
    display: block;
}

.loading .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--spinner-border);
    border-top-color: var(--spinner-top);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 16px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.loading p {
    color: var(--text-muted);
    font-size: 14px;
}

/* 底部 */
.footer {
    text-align: center;
    padding: 30px 0;
    color: var(--text-footer);
    font-size: 12px;
}

.footer a {
    color: var(--footer-link);
    text-decoration: none;
}

.footer-powered {
    margin-top: 6px;
}

/* 状态标签 */
.status-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
}

.status-tag {
    padding: 6px 12px;
    background: var(--status-tag-bg);
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
}

.status-tag:hover,
.status-tag.active {
    background: var(--status-tag-active);
    color: var(--accent-light);
}

/* 响应式 */
@media (max-width: 360px) {
    .container {
        padding: 12px;
    }
    .header h1 {
        font-size: 28px;
    }
    .tarot-card {
        width: 80px;
        height: 128px;
    }
}

</style>
</head>

function initDateSelectors() {

    for (let y = currentYear - 18; y >= currentYear - 80; y--) {

function generateTarotCards() {
    const container = document.getElementById('cardsContainer');

    const shuffled = [...tarotCards].sort(() => Math.random() - 0.5);

function processBazi() {
    const year = parseInt(document.getElementById('birthYear').value);
    const month = parseInt(document.getElementById('birthMonth').value);
    const day = parseInt(document.getElementById('birthDay').value);

    if (!year || !month || !day) {
        alert('请填写完整的出生日期');
        return;
    }

    // 简化的八字计算（基于年份天干地支）
    const ganIndex = (year - 4) % 10;
    const zhiIndex = (year - 4) % 12;
    const yearGan = tianGan[ganIndex];
    const yearZhi = diZhi[zhiIndex];
    const sx = shengXiao[zhiIndex];
    const wx = wuXing[ganIndex];

    // 简化的月柱计算
    const monthGanIndex = ((ganIndex % 5) * 2 + month) % 10;
    const monthGan = tianGan[monthGanIndex];
    const monthZhi = diZhi[(month + 1) % 12];

    baziResult = {
        yearPillar: `${yearGan}${yearZhi}`,
        monthPillar: `${monthGan}${monthZhi}`,
        dayMaster: yearGan,
        zodiac: sx,
        element: wx,
        reading: baziReadings[yearGan]
    };

    showLoading();
}

        { name: '射手座', icon: '♐', end: [12, 21] },
