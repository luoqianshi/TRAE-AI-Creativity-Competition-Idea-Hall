<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
:root{--bg-deep:#03081a;--bg-panel:rgba(8,24,56,0.72);--border-glow:rgba(0,212,255,0.25);--cyan:#00d4ff;--blue:#0080ff;--accent:#00ffc8;--text-main:#e0f0ff;--text-dim:#7a9ab8;--warning:#ffaa00;--danger:#ff4d4d;--success:#00e676;--apt:#ff6b35;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg-deep);color:var(--text-main);width:100vw;height:100vh;overflow:hidden;position:relative;}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--duration) ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.8}}
.grid-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background-image:linear-gradient(rgba(0,212,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.03) 1px,transparent 1px);background-size:50px 50px;pointer-events:none;z-index:1;}
.dashboard{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;padding:6px 14px 8px;}
.header{height:52px;display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:5px;flex-shrink:0;}
.header-bg{position:absolute;top:0;left:50%;transform:translateX(-50%);width:800px;height:100%;background:radial-gradient(ellipse at center,rgba(0,100,200,.15) 0%,transparent 70%);pointer-events:none;}
.header-title{font-size:24px;font-weight:700;letter-spacing:4px;background:linear-gradient(180deg,#fff 0%,#7dd3fc 50%,#0ea5e9 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 30px rgba(14,165,233,.4);position:relative;}
.header-title::after{content:'SMART PARK DIGITAL COCKPIT BY TRAE';position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:2px;color:var(--cyan);opacity:.6;-webkit-text-fill-color:var(--cyan);white-space:nowrap;font-family:'Orbitron',sans-serif;}
.header-decoration{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:500px;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.6;}
.header-decoration::before,.header-decoration::after{content:'';position:absolute;top:-2px;width:6px;height:6px;background:var(--cyan);transform:rotate(45deg);}
.header-decoration::before{left:20%}.header-decoration::after{right:20%}
.header-time{position:absolute;right:0;top:50%;transform:translateY(-50%);text-align:right;font-family:'Orbitron',monospace;}
.time-clock{font-size:22px;color:var(--cyan);letter-spacing:2px;}
.time-date{font-size:11px;color:var(--text-dim);margin-top:4px;}
.park-switch-btn{position:absolute;left:16px;top:50%;transform:translateY(-50%);height:32px;display:flex;align-items:center;gap:6px;padding:0 14px;background:rgba(0,50,100,.4);border:1px solid rgba(0,212,255,.3);border-radius:6px;color:var(--cyan);cursor:pointer;transition:all .3s;font-size:13px;}
.park-switch-btn:hover{background:rgba(0,100,200,.5);border-color:rgba(0,212,255,.6);box-shadow:0 0 10px rgba(0,212,255,.3);}
.park-switch-btn .tag{font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(0,212,255,.15);border:1px solid rgba(0,212,255,.3);}
.park-switch-btn.apt .tag{background:rgba(255,107,53,.15);color:var(--apt);border-color:rgba(255,107,53,.3);}
.park-modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,5,15,.7);backdrop-filter:blur(4px);align-items:center;justify-content:center;}
.park-modal.show{display:flex;}
.park-modal-content{background:rgba(8,24,56,.95);border:1px solid rgba(0,212,255,.3);border-radius:10px;padding:20px 24px;min-width:280px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.park-modal-title{font-size:16px;font-weight:600;color:var(--text-main);margin-bottom:14px;text-align:center;}
.park-modal-list{display:flex;flex-direction:column;gap:8px;}
.park-modal-item{padding:10px 14px;border-radius:6px;border:1px solid rgba(0,150,255,.15);color:var(--text-dim);font-size:13px;cursor:pointer;transition:all .25s;background:rgba(0,50,100,.1);display:flex;align-items:center;justify-content:space-between;}
.park-modal-item:hover{background:rgba(0,100,200,.2);border-color:rgba(0,212,255,.4);color:var(--text-main);}
.park-modal-item.active{background:rgba(0,100,200,.25);border-color:rgba(0,212,255,.5);color:var(--cyan);}
.park-type-tag{font-size:10px;padding:2px 6px;border-radius:4px;margin-left:8px;flex-shrink:0;}
.park-type-tag.park{background:rgba(0,212,255,.15);color:var(--cyan);border:1px solid rgba(0,212,255,.3);}
.park-type-tag.apt{background:rgba(255,107,53,.15);color:var(--apt);border:1px solid rgba(255,107,53,.3);}
.main-content{flex:1;display:flex;gap:10px;min-height:0;}
.panel-side{width:25%;display:flex;flex-direction:column;gap:8px;min-width:0;}
.panel-center{width:50%;display:flex;flex-direction:column;gap:8px;min-width:0;}
.panel{background:var(--bg-panel);border:1px solid var(--border-glow);border-radius:8px;padding:8px;position:relative;backdrop-filter:blur(10px);display:flex;flex-direction:column;overflow:hidden;}
.panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.5;}
.panel::after{content:'';position:absolute;bottom:-1px;left:20px;right:20px;height:1px;background:linear-gradient(90deg,transparent,rgba(0,212,255,.2),transparent);}
.panel.apt-mode{border-color:rgba(255,107,53,.25);}
.panel.apt-mode::before{background:linear-gradient(90deg,transparent,var(--apt),transparent);}
.corner{position:absolute;width:8px;height:8px;border:2px solid var(--cyan);opacity:.6;}
.panel.apt-mode .corner{border-color:var(--apt);}
.corner-tl{top:-1px;left:-1px;border-right:none;border-bottom:none;}
.corner-tr{top:-1px;right:-1px;border-left:none;border-bottom:none;}
.corner-bl{bottom:-1px;left:-1px;border-right:none;border-top:none;}
.corner-br{bottom:-1px;right:-1px;border-left:none;border-top:none;}
.panel-title{font-size:13px;font-weight:600;color:var(--text-main);padding-left:8px;border-left:3px solid var(--cyan);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.panel.apt-mode .panel-title{border-left-color:var(--apt);}
.chart-container{flex:1;min-height:0;position:relative;}
.tenant-stats{display:flex;gap:10px;height:100%;align-items:center;justify-content:center;padding:6px;}
.tenant-stat-card{flex:1;background:linear-gradient(135deg,rgba(0,100,200,.15) 0%,rgba(0,50,120,.1) 100%);border:1px solid rgba(0,150,255,.15);border-radius:8px;padding:14px 8px;text-align:center;position:relative;overflow:hidden;transition:all .3s;}
.tenant-stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.5;}
.panel.apt-mode .tenant-stat-card::before{background:linear-gradient(90deg,transparent,var(--apt),transparent);}
.tenant-stat-card:hover{border-color:rgba(0,212,255,.4);box-shadow:0 0 15px rgba(0,150,255,.1);}
.tenant-stat-value{font-size:22px;font-weight:700;color:var(--cyan);font-family:'Orbitron',monospace;text-shadow:0 0 10px rgba(0,212,255,.3);line-height:1.2;}
.panel.apt-mode .tenant-stat-value{color:var(--apt);text-shadow:0 0 10px rgba(255,107,53,.3);}
.tenant-stat-label{font-size:11px;color:var(--text-dim);margin-top:6px;}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;align-content:center;}
.kpi-card{background:linear-gradient(135deg,rgba(0,100,200,.15) 0%,rgba(0,50,120,.1) 100%);border:1px solid rgba(0,150,255,.15);border-radius:5px;padding:8px 4px;text-align:center;position:relative;overflow:hidden;transition:all .3s;}
.kpi-card:hover{border-color:rgba(0,212,255,.4);box-shadow:0 0 15px rgba(0,150,255,.1);}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.5;}
.kpi-value{font-size:16px;font-weight:700;color:var(--cyan);font-family:'Orbitron',monospace;text-shadow:0 0 10px rgba(0,212,255,.3);line-height:1.2;}
.kpi-label{font-size:10px;color:var(--text-dim);margin-top:2px;}
.map-container{flex:1;position:relative;border-radius:8px;overflow:hidden;background:radial-gradient(ellipse at center,rgba(0,60,120,.3) 0%,transparent 70%),linear-gradient(180deg,rgba(0,20,50,.5) 0%,transparent 100%);display:flex;align-items:center;justify-content:center;}
.panel.apt-mode .map-container{background:radial-gradient(ellipse at center,rgba(120,40,0,.2) 0%,transparent 70%),linear-gradient(180deg,rgba(50,15,0,.4) 0%,transparent 100%);}
.park-map{width:90%;height:90%;position:relative;}
.building{position:absolute;background:linear-gradient(180deg,rgba(0,170,255,.3) 0%,rgba(0,60,150,.5) 50%,rgba(0,30,90,.6) 100%);border:1px solid rgba(0,212,255,.6);border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;font-size:11px;color:var(--text-main);box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15),0 0 20px rgba(0,150,255,.15);overflow:hidden;}
.building:hover{background:linear-gradient(180deg,rgba(0,200,255,.5) 0%,rgba(0,100,200,.6) 50%,rgba(0,50,130,.7) 100%);box-shadow:0 0 35px rgba(0,212,255,.35),inset 0 0 25px rgba(0,212,255,.15);transform:scale(1.07);z-index:20;border-color:rgba(0,212,255,.9);}
.building .b-name{font-weight:700;font-size:13px;text-shadow:0 0 10px rgba(0,0,0,.6);z-index:2;}
.building .b-rate{font-size:10px;color:var(--accent);margin-top:2px;font-family:'Orbitron',monospace;z-index:2;}
.center-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;height:72px;flex-shrink:0;}
.center-kpi{background:linear-gradient(135deg,rgba(0,80,160,.2) 0%,rgba(0,40,100,.15) 100%);border:1px solid rgba(0,150,255,.2);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.center-kpi .big-num{font-size:24px;font-weight:700;color:var(--cyan);font-family:'Orbitron',monospace;text-shadow:0 0 15px rgba(0,212,255,.4);}
.center-kpi .big-label{font-size:11px;color:var(--text-dim);margin-top:3px;}
.alarm-bar{height:32px;background:rgba(255,50,50,.08);border:1px solid rgba(255,70,70,.2);border-radius:6px;display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0;overflow:hidden;}
.alarm-icon{color:var(--danger);font-size:14px;animation:blink 1s step-end infinite;flex-shrink:0;font-weight:700;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.alarm-scroll{flex:1;overflow:hidden;white-space:nowrap;position:relative;}
.alarm-text{display:inline-block;animation:scroll-left 24s linear infinite;font-size:12px;color:#ffb3b3;}
@keyframes scroll-left{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
.energy-bar{height:64px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex-shrink:0;}
.energy-item{background:linear-gradient(135deg,rgba(0,60,120,.2) 0%,rgba(0,30,70,.15) 100%);border:1px solid rgba(0,150,255,.15);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.energy-num{font-size:18px;font-weight:700;color:var(--cyan);font-family:'Orbitron',monospace;}
.energy-num.water{color:#38bdf8;}.energy-num.alert{color:var(--danger);}.energy-num.parking{color:var(--accent);}
.energy-label{font-size:11px;color:var(--text-dim);}
.progress-list{display:flex;flex-direction:column;gap:8px;}
.progress-item{display:flex;align-items:center;gap:8px;font-size:11px;}
.progress-label{width:64px;color:var(--text-dim);text-align:right;flex-shrink:0;}
.progress-track{flex:1;height:7px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--accent));box-shadow:0 0 8px rgba(0,212,255,.3);transition:width 1s ease;}
.progress-value{width:36px;color:var(--text-main);font-family:'Orbitron',monospace;font-size:11px;}
.floor-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;height:100%;padding:4px;overflow:auto;}
.floor-card{background:rgba(255,107,53,.08);border:1px solid rgba(255,107,53,.2);border-radius:6px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .25s;cursor:pointer;}
.floor-card:hover{background:rgba(255,107,53,.15);border-color:rgba(255,107,53,.4);transform:translateY(-2px);}
.floor-name{font-size:11px;color:var(--text-dim);}
.floor-rate{font-size:14px;font-weight:700;color:var(--apt);font-family:'Orbitron',monospace;}
.floor-units{font-size:10px;color:var(--text-dim);}
</style>
</head>

function initStars(){const c=document.getElementById('stars');for(let i=0;i<80;i++){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.width=s.style.height=(Math.random()*2+1)+'px';s.style.setProperty('--duration',(Math.random()*3+2)+'s');s.style.animationDelay=Math.random()*5+'s';c.appendChild(s);}}
function updateClock(){const now=new Date();document.getElementById('clock').textContent=now.toLocaleTimeString('zh-CN',{hour12:false});const days=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];document.getElementById('date').textContent=now.toLocaleDateString('zh-CN')+' '+days[now.getDay()];}

function renderOverview(type){
  const data=parkData[currentProject.id].overview;
  document.getElementById('overviewGrid').innerHTML=data.map(item=>`
    <div class="kpi-card"><div class="kpi-value">${item.value}</div><div class="kpi-label">${item.label}</div></div>
  `).join('');
}
function renderTenant(type){
  const data=parkData[currentProject.id].tenant;
  document.getElementById('tenantStats').innerHTML=data.map(item=>`
    <div class="tenant-stat-card"><div class="tenant-stat-value">${item.value}</div><div class="tenant-stat-label">${item.label}</div></div>
  `).join('');
}
function renderCenterKpis(){
  const data=parkData[currentProject.id].center;
  document.getElementById('centerKpis').innerHTML=data.map(item=>`
    <div class="center-kpi"><div class="big-num">${item.value}</div><div class="big-label">${item.label}</div></div>
  `).join('');
}
function renderEnergyBar(){
  const data=parkData[currentProject.id].energy;
  document.getElementById('energyBar').innerHTML=data.map((item,i)=>{
    let cls='energy-num';if(i===1)cls+=' water';else if(i===2)cls+=' parking';else if(i===3)cls+=' alert';
    return `<div class="energy-item"><div class="${cls}">${item.value}<small style="font-size:10px">${item.unit}</small></div><div class="energy-label">${item.label}</div></div>`;
  }).join('');
}
function renderWorkOrders(){
  const orders=[{name:'维修工单',value:78},{name:'保洁工单',value:92},{name:'安防巡检',value:85},{name:'设备保养',value:64},{name:'投诉建议',value:95}];
  document.getElementById('workOrderList').innerHTML=orders.map(o=>`
    <div class="progress-item"><span class="progress-label">${o.name}</span><div class="progress-track"><div class="progress-fill" style="width:0%"></div></div><span class="progress-value">${o.value}%</span></div>
  `).join('');
  setTimeout(()=>{document.querySelectorAll('.progress-fill').forEach((el,i)=>el.style.width=orders[i].value+'%');},100);
}
function renderMap(){
  const c=document.getElementById('mapContainer');
  if(currentProject.type==='park'){
    c.innerHTML=`<div class="park-map">
      <div class="park-boundary" data-name="${currentProject.name}"></div>
      <div class="building" style="left:8%;top:12%;width:22%;height:28%;"><span class="b-name">A1 智造楼</span><span class="b-rate">入驻 96%</span></div>
      <div class="building" style="left:36%;top:10%;width:24%;height:32%;"><span class="b-name">A2 研发楼</span><span class="b-rate">入驻 91%</span></div>
      <div class="building" style="left:66%;top:15%;width:26%;height:26%;"><span class="b-name">A3 孵化楼</span><span class="b-rate">入驻 88%</span></div>
      <div class="building" style="left:10%;top:48%;width:28%;height:24%;"><span class="b-name">B1 生产楼</span><span class="b-rate">入驻 94%</span></div>
      <div class="building" style="left:44%;top:52%;width:22%;height:22%;"><span class="b-name">B2 仓储楼</span><span class="b-rate">入驻 97%</span></div>
      <div class="building" style="left:72%;top:50%;width:20%;height:28%;"><span class="b-name">C1 综合楼</span><span class="b-rate">入驻 89%</span></div>
    </div>`;
  }else{
    c.innerHTML=`<div class="floor-grid">${Array.from({length:20},(_,i)=>{
      const floor=20-i,rate=(80+Math.floor(Math.random()*18)).toFixed(1);
      return `<div class="floor-card"><span class="floor-name">${floor}F</span><span class="floor-rate">${rate}%</span><span class="floor-units">已租 ${Math.floor(rate*2.1)}/42</span></div>`;
    }).join('')}</div>`;
  }
}
function renderAlarm(){document.getElementById('alarmText').textContent=parkData[currentProject.id].alarm;}

function initEnergyChart(){
  const el=document.getElementById('energyChart');charts.energy=echarts.init(el);
  const option={grid:{left:10,right:10,bottom:20,top:30,containLabel:true},tooltip:{trigger:'axis'},legend:{data:['用电','用水'],textStyle:{color:'#7a9ab8',fontSize:10},top:0,right:0,itemWidth:12,itemHeight:8},xAxis:{type:'category',data:['00:00','04:00','08:00','12:00','16:00','20:00','24:00'],axisLine:{lineStyle:{color:'rgba(0,150,255,.2)'}},axisLabel:{color:'#7a9ab8',fontSize:10}},yAxis:[{type:'value',name:'kWh',nameTextStyle:{color:'#7a9ab8',fontSize:10},splitLine:{lineStyle:{color:'rgba(255,255,255,.05)'}},axisLabel:{color:'#7a9ab8',fontSize:10}},{type:'value',name:'m³',nameTextStyle:{color:'#7a9ab8',fontSize:10},splitLine:{show:false},axisLabel:{color:'#7a9ab8',fontSize:10}}],series:[{name:'用电',type:'line',smooth:true,symbol:'none',areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(0,212,255,.4)'},{offset:1,color:'rgba(0,212,255,.05)'}])},lineStyle:{color:'#00d4ff',width:2},data:[120,95,210,380,420,390,260]},{name:'用水',type:'bar',yAxisIndex:1,itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#38bdf8'},{offset:1,color:'rgba(56,189,248,.1)'}])},barWidth:8,data:[12,8,22,35,32,28,18]}]};
  charts.energy.setOption(option);
}
function initVisitorChart(){
  const el=document.getElementById('visitorChart');charts.visitor=echarts.init(el);
  const option={grid:{left:10,right:10,bottom:20,top:30,containLabel:true},tooltip:{trigger:'axis'},legend:{data:['访客','车辆'],textStyle:{color:'#7a9ab8',fontSize:10},top:0,right:0,itemWidth:12,itemHeight:8},xAxis:{type:'category',data:['周一','周二','周三','周四','周五','周六','周日'],axisLine:{lineStyle:{color:'rgba(0,150,255,.2)'}},axisLabel:{color:'#7a9ab8',fontSize:10}},yAxis:{type:'value',splitLine:{lineStyle:{color:'rgba(255,255,255,.05)'}},axisLabel:{color:'#7a9ab8',fontSize:10}},series:[{name:'访客',type:'bar',itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#00d4ff'},{offset:1,color:'rgba(0,212,255,.1)'}])},barWidth:10,data:[120,145,132,168,190,98,86]},{name:'车辆',type:'line',smooth:true,symbol:'none',lineStyle:{color:'#00ffc8',width:2},data:[86,102,95,124,138,72,64]}]};
  charts.visitor.setOption(option);
}
function initParkingChart(){
  const el=document.getElementById('parkingChart');charts.parking=echarts.init(el);
  const option={series:[{type:'gauge',startAngle:200,endAngle:-20,min:0,max:100,radius:'85%',center:['50%','55%'],splitNumber:5,axisLine:{lineStyle:{width:12,color:[[.6,'#00e676'],[.85,'#ffaa00'],[1,'#ff4d4d']]}},pointer:{itemStyle:{color:'#00d4ff'},width:4},axisTick:{show:false},splitLine:{length:8,lineStyle:{color:'rgba(255,255,255,.2)',width:1}},axisLabel:{color:'#7a9ab8',fontSize:10,distance:12},title:{offsetCenter:[0,'-30%'],fontSize:12,color:'#e0f0ff'},detail:{valueAnimation:true,formatter:'{value}%',color:'#00d4ff',fontSize:26,fontFamily:'Orbitron',offsetCenter:[0,'30%']},data:[{value:78,name:'车位占用率'}]}]};
  charts.parking.setOption(option);
}

function updateTheme(){
  const isApt=currentProject.type==='apt';
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('apt-mode',isApt));
  document.getElementById('parkSwitchBtn').classList.toggle('apt',isApt);
  document.getElementById('centerTitle').textContent=isApt?'楼层出租热力':'园区数字孪生';
}
function applyProject(){
  document.getElementById('currentProjectName').textContent=currentProject.name;
  document.getElementById('currentProjectType').textContent=currentProject.tag;
  updateTheme();
  renderOverview();
  renderTenant();
  renderCenterKpis();
  renderEnergyBar();
  renderWorkOrders();
  renderMap();
  renderAlarm();
  if(charts.parking)charts.parking.setOption({series:[{data:[{value:Math.floor(50+Math.random()*40),name:'车位占用率'}]}]});
}

function initModal(){
  const list=document.getElementById('parkModalList');
  list.innerHTML=projects.map(p=>`
    <div class="park-modal-item ${p.id===currentProject.id?'active':''}" data-id="${p.id}">
      <span>${p.name}</span><span class="park-type-tag ${p.type}">${p.tag}</span>
    </div>
  `).join('');
  list.querySelectorAll('.park-modal-item').forEach(item=>item.addEventListener('click',()=>{
    currentProject=projects.find(p=>p.id===item.dataset.id);
    document.querySelectorAll('.park-modal-item').forEach(i=>i.classList.remove('active'));
    item.classList.add('active');
    document.getElementById('parkModal').classList.remove('show');
    applyProject();
  }));
  document.getElementById('parkSwitchBtn').addEventListener('click',()=>document.getElementById('parkModal').classList.add('show'));
  document.getElementById('parkModal').addEventListener('click',e=>{if(e.target.id==='parkModal')document.getElementById('parkModal').classList.remove('show');});
}

window.addEventListener('resize',()=>{Object.values(charts).forEach(c=>c&&c.resize());});
initStars();initModal();initEnergyChart();initVisitorChart();initParkingChart();applyProject();setInterval(updateClock,1000);updateClock();
</script>
</body>
</html>
