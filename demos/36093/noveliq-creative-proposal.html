<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NovelIQ 创意方案</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #f3f6fb;
        --ink: #142033;
        --muted: #65738c;
        --line: #dbe3ef;
        --blue: #2563eb;
        --teal: #0f9f8f;
        --gold: #d9901a;
        --coral: #d85c5c;
        --dark: #111827;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 8%, rgba(37, 99, 235, 0.16), transparent 30%),
          radial-gradient(circle at 92% 18%, rgba(15, 159, 143, 0.15), transparent 28%),
          var(--bg);
        font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      }

      .page {
        width: min(1180px, calc(100% - 48px));
        margin: 28px auto;
      }

      .poster {
        display: grid;
        grid-template-columns: 0.78fr 1.22fr;
        gap: 22px;
      }

      .card {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 20px 52px rgba(20, 32, 51, 0.12);
      }

      .hero {
        min-height: 640px;
        padding: 34px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .logo-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .logo-row img {
        width: 68px;
        height: 68px;
        object-fit: contain;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
      }

      .track {
        display: inline-block;
        margin-top: 24px;
        padding: 7px 13px;
        border-radius: 999px;
        color: var(--blue);
        background: rgba(37, 99, 235, 0.1);
        font-size: 14px;
        font-weight: 800;
      }

      h1 {
        margin: 22px 0 6px;
        font-size: 76px;
        line-height: 0.94;
        letter-spacing: 0;
      }

      .tagline {
        margin: 0;
        color: var(--muted);
        font-size: 21px;
      }

      .mini-flow {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 28px;
      }

      .tile {
        min-height: 118px;
        padding: 16px;
        border-radius: 12px;
        color: #fff;
      }

      .tile b {
        display: block;
        margin-bottom: 8px;
        font-size: 27px;
      }

      .tile span {
        font-size: 14px;
        opacity: 0.92;
      }

      .t1 {
        background: var(--blue);
      }

      .t2 {
        background: var(--teal);
      }

      .t3 {
        background: var(--coral);
      }

      .quote {
        padding: 16px;
        border-left: 5px solid var(--gold);
        border-radius: 12px;
        color: #674916;
        background: #fff8e8;
        font-weight: 800;
      }

      .hero-graphic {
        position: relative;
        height: 220px;
        margin-top: 28px;
        border-radius: 16px;
        background:
          linear-gradient(135deg, rgba(37, 99, 235, 0.1), rgba(15, 159, 143, 0.08)),
          #fff;
        overflow: hidden;
      }

      .doc {
        position: absolute;
        width: 108px;
        height: 138px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 12px 28px rgba(20, 32, 51, 0.12);
      }

      .doc::before,
      .doc::after {
        content: "";
        position: absolute;
        left: 18px;
        right: 18px;
        height: 8px;
        border-radius: 999px;
        background: #dfe7f3;
      }

      .doc::before {
        top: 36px;
      }

      .doc::after {
        top: 58px;
        right: 34px;
      }

      .doc-a {
        left: 28px;
        top: 38px;
        transform: rotate(-8deg);
      }

      .doc-b {
        left: 74px;
        top: 50px;
        transform: rotate(5deg);
      }

      .core {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 96px;
        height: 96px;
        transform: translate(-50%, -50%);
        border-radius: 26px;
        display: grid;
        place-items: center;
        color: #fff;
        background: linear-gradient(135deg, var(--blue), var(--teal));
        font-size: 30px;
        font-weight: 900;
        box-shadow: 0 18px 34px rgba(37, 99, 235, 0.26);
      }

      .orbit {
        position: absolute;
        width: 62px;
        height: 62px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 900;
      }

      .orbit.one {
        right: 92px;
        top: 28px;
        background: var(--gold);
      }

      .orbit.two {
        right: 36px;
        top: 92px;
        background: var(--coral);
      }

      .orbit.three {
        right: 132px;
        bottom: 26px;
        background: var(--teal);
      }

      .flow-line {
        position: absolute;
        height: 3px;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(37, 99, 235, 0.1), rgba(37, 99, 235, 0.55), rgba(15, 159, 143, 0.1));
      }

      .flow-line.a {
        left: 148px;
        top: 108px;
        width: 120px;
      }

      .flow-line.b {
        right: 100px;
        top: 108px;
        width: 144px;
      }

      .visual {
        min-height: 640px;
        padding: 18px;
        background: var(--dark);
        color: #eef4ff;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }

      .dots {
        display: flex;
        gap: 7px;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--coral);
      }

      .dot:nth-child(2) {
        background: var(--gold);
      }

      .dot:nth-child(3) {
        background: var(--teal);
      }

      .chip {
        padding: 6px 10px;
        border-radius: 999px;
        color: #c9d8ff;
        background: rgba(37, 99, 235, 0.28);
        font-size: 13px;
        font-weight: 800;
      }

      .screen {
        display: grid;
        grid-template-columns: 210px 1fr;
        gap: 14px;
      }

      .side,
      .canvas,
      .result {
        border: 1px solid rgba(255, 255, 255, 0.11);
        border-radius: 13px;
        background: rgba(255, 255, 255, 0.08);
      }

      .side {
        min-height: 548px;
        padding: 16px;
      }

      .upload {
        height: 138px;
        display: grid;
        place-items: center;
        border: 1px dashed rgba(238, 244, 255, 0.36);
        border-radius: 12px;
        text-align: center;
      }

      .upload b {
        display: block;
        font-size: 19px;
      }

      .steps {
        display: grid;
        gap: 12px;
        margin-top: 18px;
      }

      .step {
        display: grid;
        grid-template-columns: 16px 1fr;
        gap: 10px;
        align-items: center;
        color: #d7e2f7;
        font-size: 13px;
      }

      .step i {
        width: 13px;
        height: 13px;
        border-radius: 4px;
        background: var(--teal);
      }

      .step:nth-child(2) i {
        background: var(--blue);
      }

      .step:nth-child(3) i {
        background: var(--gold);
      }

      .step:nth-child(4) i {
        background: var(--coral);
      }

      .main-grid {
        display: grid;
        gap: 14px;
      }

      .canvas {
        min-height: 410px;
        padding: 12px;
      }

      .viz-grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        grid-template-rows: 1fr 1fr;
        gap: 10px;
        min-height: 386px;
      }

      .viz {
        border-radius: 10px;
        padding: 10px;
        background: rgba(255, 255, 255, 0.07);
        overflow: hidden;
      }

      svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .axis {
        stroke: rgba(238, 244, 255, 0.18);
        stroke-width: 1;
      }

      .curve {
        fill: none;
        stroke: #f0b84b;
        stroke-width: 5;
        stroke-linecap: round;
      }

      .edge {
        stroke: rgba(238, 244, 255, 0.34);
        stroke-width: 2.5;
      }

      .n1 {
        fill: var(--blue);
      }

      .n2 {
        fill: var(--teal);
      }

      .n3 {
        fill: var(--coral);
      }

      .heat-cell {
        rx: 4;
      }

      .radar-fill {
        fill: rgba(37, 99, 235, 0.3);
        stroke: #7fa5ff;
        stroke-width: 2;
      }

      .radar-ring {
        fill: none;
        stroke: rgba(238, 244, 255, 0.2);
        stroke-width: 1;
      }

      .result {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        padding: 12px;
      }

      .out {
        min-height: 76px;
        padding: 13px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.08);
      }

      .out b {
        display: block;
        margin-bottom: 6px;
        font-size: 18px;
      }

      .out span {
        color: #b8c6df;
        font-size: 13px;
      }

      .spark {
        display: block;
        width: 100%;
        height: 18px;
        margin-top: 8px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--blue) 24%, var(--teal) 24% 62%, var(--gold) 62% 82%, var(--coral) 82%);
      }

      .bottom {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-top: 18px;
      }

      .mini {
        min-height: 108px;
        padding: 18px;
      }

      .mini b {
        display: block;
        margin-bottom: 8px;
        font-size: 22px;
      }

      .mini span {
        color: var(--muted);
        font-size: 15px;
      }

      @media (max-width: 960px) {
        .page {
          width: min(100% - 24px, 760px);
        }

        .poster,
        .screen,
        .result,
        .bottom,
        .mini-flow {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 50px;
        }

        .hero,
        .visual {
          min-height: auto;
        }

        .side {
          min-height: auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="poster">
        <div class="hero card">
          <div>
            <div class="logo-row">
              <img src="../frontend/public/novel%20qa%20icon.svg" alt="NovelIQ logo" />
              <strong>中文网络小说智能分析平台</strong>
            </div>
            <span class="track">02 学习工作 / 造个新解法</span>
            <h1>NovelIQ</h1>
            <p class="tagline">上传长文本，得到图谱、曲线、报告</p>

            <div class="mini-flow">
              <div class="tile t1"><b>TXT</b><span>长篇文本</span></div>
              <div class="tile t2"><b>AI</b><span>智能分析</span></div>
              <div class="tile t3"><b>IQ</b><span>结构洞察</span></div>
            </div>

            <div class="hero-graphic" aria-label="NovelIQ 输入分析输出示意">
              <div class="doc doc-a"></div>
              <div class="doc doc-b"></div>
              <div class="flow-line a"></div>
              <div class="core">AI</div>
              <div class="flow-line b"></div>
              <div class="orbit one">曲</div>
              <div class="orbit two">图</div>
              <div class="orbit three">报</div>
            </div>
          </div>

          <div class="quote">创意：把复杂叙事文本变成可视化洞察</div>
        </div>

        <div class="visual card">
          <div class="topbar">
            <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
            <span class="chip">NovelIQ Dashboard</span>
          </div>

          <div class="screen">
            <aside class="side">
              <div class="upload">
                <div><b>上传</b><span>txt</span></div>
              </div>
              <div class="steps">
                <div class="step"><i></i><span>清洗分块</span></div>
                <div class="step"><i></i><span>角色关系</span></div>
                <div class="step"><i></i><span>情绪节奏</span></div>
                <div class="step"><i></i><span>主题诊断</span></div>
              </div>
            </aside>

            <div class="main-grid">
              <div class="canvas">
                <div class="viz-grid">
                  <div class="viz">
                    <svg viewBox="0 0 390 176" aria-label="关系图谱">
                      <line class="edge" x1="80" y1="54" x2="174" y2="88" />
                      <line class="edge" x1="174" y1="88" x2="282" y2="48" />
                      <line class="edge" x1="174" y1="88" x2="292" y2="132" />
                      <line class="edge" x1="80" y1="54" x2="118" y2="130" />
                      <circle class="n3" cx="80" cy="54" r="20" />
                      <circle class="n1" cx="174" cy="88" r="28" />
                      <circle class="n2" cx="282" cy="48" r="19" />
                      <circle class="n2" cx="292" cy="132" r="17" />
                      <circle class="n1" cx="118" cy="130" r="16" />
                    </svg>
                  </div>

                  <div class="viz">
                    <svg viewBox="0 0 240 176" aria-label="诊断雷达">
                      <polygon class="radar-ring" points="120,24 184,70 160,144 80,144 56,70" />
                      <polygon class="radar-ring" points="120,48 160,78 146,124 94,124 80,78" />
                      <polygon class="radar-fill" points="120,34 170,78 148,132 88,138 70,74" />
                    </svg>
                  </div>

                  <div class="viz">
                    <svg viewBox="0 0 390 176" aria-label="情绪曲线">
                      <line class="axis" x1="24" y1="136" x2="360" y2="136" />
                      <path class="curve" d="M30 126 C62 76, 94 132, 132 86 S206 42, 238 88 S298 152, 358 68" />
                      <circle class="n3" cx="238" cy="88" r="8" />
                      <circle class="n2" cx="358" cy="68" r="8" />
                    </svg>
                  </div>

                  <div class="viz">
                    <svg viewBox="0 0 240 176" aria-label="主题热力">
                      <rect class="heat-cell" x="24" y="26" width="34" height="34" fill="#2563eb" />
                      <rect class="heat-cell" x="66" y="26" width="34" height="34" fill="#0f9f8f" />
                      <rect class="heat-cell" x="108" y="26" width="34" height="34" fill="#d9901a" />
                      <rect class="heat-cell" x="150" y="26" width="34" height="34" fill="#d85c5c" />
                      <rect class="heat-cell" x="24" y="68" width="34" height="34" fill="#0f9f8f" />
                      <rect class="heat-cell" x="66" y="68" width="34" height="34" fill="#d85c5c" />
                      <rect class="heat-cell" x="108" y="68" width="34" height="34" fill="#2563eb" />
                      <rect class="heat-cell" x="150" y="68" width="34" height="34" fill="#0f9f8f" />
                      <rect class="heat-cell" x="24" y="110" width="34" height="34" fill="#d9901a" />
                      <rect class="heat-cell" x="66" y="110" width="34" height="34" fill="#2563eb" />
                      <rect class="heat-cell" x="108" y="110" width="34" height="34" fill="#0f9f8f" />
                      <rect class="heat-cell" x="150" y="110" width="34" height="34" fill="#d9901a" />
                    </svg>
                  </div>
                </div>
              </div>

              <div class="result">
                <div class="out"><b>结构</b><span class="spark"></span></div>
                <div class="out"><b>关系</b><span class="spark"></span></div>
                <div class="out"><b>节奏</b><span class="spark"></span></div>
                <div class="out"><b>报告</b><span class="spark"></span></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="bottom">
        <div class="mini card"><b>用户</b><span>创作者 / 编辑 / 深度读者</span></div>
        <div class="mini card"><b>痛点</b><span>长文本难梳理，线索易遗漏</span></div>
        <div class="mini card"><b>价值</b><span>提升理解、复盘与评估效率</span></div>
      </section>
    </main>
  </body>
</html>
