      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      background: rgba(255,255,255,0.04);
    }
    .dim-item .dim-info {
      flex: 1;
      min-width: 0;
    }
    .dim-item .dim-name {
      font-size: 0.88rem;
      color: var(--ink);
      font-weight: 500;
      margin-bottom: 0.35rem;
    }
    .dim-bar {
      height: 5px;
      background: rgba(255,255,255,0.05);
      border-radius: 3px;
      overflow: hidden;
    }
    .dim-bar-fill {
      height: 100%;
      border-radius: 3px;
      width: 0%;
      transition: width 1.8s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .dim-bar-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 2s infinite;
    }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    .dim-item .dim-score {
      font-family: var(--font-heading);
      font-size: 1.3rem;
      font-weight: 700;
      width: 48px;
      text-align: right;
      flex-shrink: 0;
      line-height: 1;
    }
    .dim-item .dim-score .pct {
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 400;
    }

    .result-actions {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeUp 0.8s 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* === 底部 === */
    .footer-note {
      text-align: center;
      margin-top: 2.5rem;
      font-size: 0.72rem;
      color: var(--muted2);
      letter-spacing: 0.05em;
    }
    .footer-note .sep { margin: 0 0.5rem; opacity: 0.5; }

    /* === Toast === */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: var(--bg3);
      backdrop-filter: blur(20px);
      border: 1px solid var(--accent-soft);
      color: var(--ink);
      padding: 0.8rem 1.6rem;
      border-radius: 14px;
      font-size: 0.9rem;
      z-index: 100;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 480px) {
      .app { padding: 2rem 1rem 3rem; }
      .brand h1 { font-size: 2rem; }
      .brand .logo { font-size: 2.4rem; }
      .brand .logo-wrap { width: 72px; height: 72px; }
      .score-ring { width: 200px; height: 200px; }
      .score-number .num { font-size: 3rem; }
      .verdict { font-size: 1.6rem; }
      .calc-orb { width: 120px; height: 120px; }
      .calc-orb .core { font-size: 2.4rem; }
    }
  </style>
</head>
<body>

  <div class="bg-mesh"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="noise"></div>
  <canvas id="particles"></canvas>

  <div class="app">

    <!-- === 输入屏 === -->
    <div class="screen active" id="screen-input">
      <div class="brand">
        <div class="logo-wrap">
          <div class="logo">💞</div>
        </div>
        <h1>缘分天注定</h1>
        <p class="tagline">输入两个人的名字，让缘分为你揭晓答案</p>
        <p class="tagline-en">Destiny · Written in the Stars</p>
      </div>

      <div class="glass input-card">
        <div class="input-group">
          <label><span class="dot"></span>你的名字</label>
          <div class="input-wrap">
            <input type="text" id="name1" placeholder="请输入你的名字" maxlength="20" autocomplete="off">
          </div>
        </div>

        <div class="heart-divider"><span class="heart-icon">❤</span></div>

        <div class="input-group">
          <label><span class="dot"></span>Ta 的名字</label>
          <div class="input-wrap">
            <input type="text" id="name2" placeholder="请输入 Ta 的名字" maxlength="20" autocomplete="off">
          </div>
        </div>
      </div>

      <button class="btn-primary" id="btn-start" onclick="startTest()">开始测算缘分</button>

      <p class="footer-note">仅供娱乐<span class="sep">·</span>缘分掌握在自己手中<span class="sep">·</span>TRAE AI 创造力大赛参赛作品</p>
    </div>

    <!-- === 计算屏 === -->
    <div class="screen" id="screen-calc">
      <div class="calc-screen">
        <div class="calc-orb">
          <div class="glow-bg"></div>
          <div class="ring ring-1"></div>
          <div class="ring ring-2"></div>
          <div class="ring ring-3"></div>
          <div class="core">💞</div>
        </div>
        <div class="calc-text" id="calc-text">正在连接缘分星河...</div>
        <div class="calc-sub" id="calc-sub">Stellar Connection</div>
        <div class="calc-bar"><div class="calc-bar-fill" id="calc-bar"></div></div>
      </div>
    </div>

    <!-- === 结果屏 === -->
    <div class="screen" id="screen-result">
      <div class="result-names" id="result-names"></div>

      <div class="score-ring">
        <svg width="240" height="240" viewBox="0 0 240 240">
          <defs>
            <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff4d8d"/>
              <stop offset="50%" stop-color="#c77dff"/>
              <stop offset="100%" stop-color="#ffd166"/>
            </linearGradient>
          </defs>
          <circle class="ring-track" cx="120" cy="120" r="100"/>
          <circle class="ring-glow" id="ring-glow" cx="120" cy="120" r="100"/>
          <circle class="ring-fg" id="ring-fg" cx="120" cy="120" r="100"/>
        </svg>
        <div class="score-number">
          <div><span class="num" id="score-num">0</span><span class="suffix">分</span></div>
          <div class="label">缘分指数</div>
        </div>
      </div>

      <div class="verdict" id="verdict"></div>
      <div class="verdict-desc" id="verdict-desc"></div>

      <div class="glass chart-section">
        <div class="chart-header">
          <h3>缘分多维分析</h3>
          <span class="badge">6 Dimensions</span>
        </div>
        <div id="chart-radar"></div>
      </div>

      <div class="dim-list" id="dim-list"></div>

      <div class="glass fortune-stick">
        <div class="stick-header">
          <span class="stick-line"></span>
          <span class="stick-label">缘分签</span>
          <span class="stick-line right"></span>
        </div>
        <div class="poem" id="poem"></div>
      </div>

      <div class="result-actions">
        <button class="btn-primary" style="width:auto; padding: 0.9rem 2.2rem;" onclick="shareResult()">分享结果</button>
        <button class="btn-secondary" onclick="resetTest()">再测一次</button>
      </div>

      <p class="footer-note">TRAE AI 创造力大赛参赛作品<span class="sep">·</span>仅供娱乐</p>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script src="./_shared/js/echarts.min.js"></script>
  <script src="assets/charts.js"></script>
</body>
</html>
