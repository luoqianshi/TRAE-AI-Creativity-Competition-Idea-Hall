    const state = {
      current: 0,
      answers: Array(questions.length).fill(null)
    };

    const $ = (selector) => document.querySelector(selector);

    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(screen => screen.classList.remove("active"));
      $(id).classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderQuestion() {
      const q = questions[state.current];
      $("#questionCategory").textContent = q.category;
      $("#questionTitle").textContent = q.title;
      $("#progressText").textContent = `第 ${state.current + 1} / ${questions.length} 题`;
      $("#progressBar").style.width = `${((state.current + 1) / questions.length) * 100}%`;
      $("#prevBtn").style.visibility = state.current === 0 ? "hidden" : "visible";
      $("#nextBtn").textContent = state.current === questions.length - 1 ? "查看结果" : "下一题";

      const selected = state.answers[state.current];
      $("#nextBtn").disabled = selected === null;

      $("#options").innerHTML = q.options.map((option, index) => `
        <button class="option ${selected === index ? "selected" : ""}" data-index="${index}">
          <span class="option-letter">${String.fromCharCode(65 + index)}</span>
          <span>${option.text}</span>
        </button>
      `).join("");

      document.querySelectorAll(".option").forEach(button => {
        button.addEventListener("click", () => {
          state.answers[state.current] = Number(button.dataset.index);
          renderQuestion();
        });
      });
    }

    function calculateScores() {
      const totals = { cash: 0, skill: 0, content: 0, service: 0, emotion: 0, time: 0 };
      const counts = { cash: 0, skill: 0, content: 0, service: 0, emotion: 0, time: 0 };

      state.answers.forEach((answer, qIndex) => {
        const scores = questions[qIndex].options[answer].scores;
        Object.entries(scores).forEach(([key, value]) => {
          totals[key] += value;
          counts[key] += 1;
        });
      });

      const avg = {};
      Object.keys(totals).forEach(key => {
        avg[key] = counts[key] ? Number((totals[key] / counts[key]).toFixed(1)) : 0;
      });
      return avg;
    }

    function decideType(scores) {
      if (scores.emotion <= 2 && scores.cash >= 3) return "pause";
      if (scores.cash >= 3 && scores.skill <= 2.2) return "stable";
      if (scores.skill >= 3.1 && scores.service >= 3) return "skill";
      if (scores.content >= 3.1 && scores.cash <= 2.6) return "content";
      return "side";
    }

    function scorePercent(value) {
      return Math.max(0, Math.min(100, (value / 4) * 100));
    }

    function renderPixelAvatar(result) {
      const colors = {
        ".": "transparent",
        h: "#3a2a22",
        s: "#e7b58f",
        e: "#241a15",
        a: result.color,
        d: "#f3c86b",
        b: "#5a4032",
        p: "#b9aca1",
        P: "#8d827a",
        w: "#fff7dc",
        g: "#5f8f68"
      };
      const rows = pixelArt[result.pixel] || pixelArt.skill;
      const cells = rows.join("").split("").map(key => {
        const color = colors[key] || "transparent";
        return `<span class="pixel-cell" style="background:${color}"></span>`;
      }).join("");

      return `
        <div class="pixel-frame" style="--avatar-bg:${result.color}" aria-label="${result.persona}像素人物">
          <div class="pixel-character">${cells}</div>
        </div>
      `;
    }

    function renderScores(scores, result) {
      const items = [
        ["现金防线", scores.cash],
        ["技能清晰", scores.skill],
        ["表达能量", scores.content],
        ["服务边界", scores.service],
        ["状态稳定", scores.emotion]
      ];
      const posterTags = result.poster || result.tags;

      $("#scoreList").innerHTML = `
        <div class="persona-card">
          <div class="persona-visual" style="--avatar-bg:${result.color}">
            <div class="persona-poster-head">
              <div class="poster-label">
                <strong>你的赚钱路径人格</strong>
                <span>Career Path Persona</span>
              </div>
              <div class="poster-code">${result.code}</div>

            <div class="persona-stage">

              <div class="mbti-board">
                <div class="mbti-character">${renderPixelAvatar(result)}</div>
                <div class="mbti-bars">
                  ${items.slice(0, 4).map(([label, value], index) => `
                    <div class="trait-row">
                      <div class="trait-pair">
                        <span>${label}</span>
                        <strong>${posterTags[index]}</strong>
                      </div>
                      <div class="trait-track">
                        <div class="trait-fill" style="width:${scorePercent(value)}%"></div>
                      </div>
                    </div>
                  `).join("")}
                </div>
              </div>
            </div>
            <div class="persona-title">${result.persona}</div>
            <p class="persona-line">${result.summary}</p>
            <div class="persona-tags">
              ${result.tags.map(tag => `<span>${tag}</span>`).join("")}
            </div>
          </div>
          <div class="persona-share">${result.share}</div>
          <div class="persona-metrics">
            ${items.map(([label, value], index) => `
              <div class="metric-chip">
                <strong><span>${label}</span><em>${value || 0}/4</em></strong>
                <div class="mini-track"><div class="mini-fill ${index % 2 ? "green" : ""}" style="width:${scorePercent(value)}%"></div></div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function renderResult(forcedType) {
      const scores = forcedType ? { cash: 2.4, skill: 3.4, content: 2.8, service: 3.5, emotion: 3.1, time: 2.8 } : calculateScores();
      const typeKey = forcedType || decideType(scores);
      const result = resultMap[typeKey];
      renderScores(scores, result);

      const textSummary = `我的结果是：${result.type}。${result.summary} 推荐路径：${result.path} 暂不建议：${result.avoid} 第一步：${result.first}`;

      $("#resultContent").innerHTML = `
        <div class="result-type">${result.type}</div>
        <h2>你的低消耗收入路径建议</h2>
        <p class="lead">${result.summary}</p>

        <div class="advice-grid">
          <div class="advice">
            <small>推荐路径</small>
            <p>${result.path}</p>
          </div>
          <div class="advice">
            <small class="danger">暂不建议</small>
            <p>${result.avoid}</p>
          </div>
          <div class="advice">
            <small>第一步尝试</small>
            <p>${result.first}</p>
          </div>
          <div class="advice">
            <small>AI可以帮你什么</small>
            <p>${result.ai}</p>
          </div>
        </div>

        <div class="save-box">
          <strong>结果摘要</strong>
          <p style="margin-top:6px;">${textSummary}</p>
        </div>

        <div class="hero-actions">
          <button class="btn primary" id="copyBtn">复制结果摘要</button>
          <button class="btn ghost" id="homeBtn">回到首页</button>
        </div>
      `;

      $("#copyBtn").addEventListener("click", () => copyResult(textSummary));
      $("#homeBtn").addEventListener("click", () => showScreen("#screen-home"));
      showScreen("#screen-result");
    }

    function copyResult(text) {
      navigator.clipboard?.writeText(text).then(() => {
        $("#toast").classList.add("show");
        setTimeout(() => $("#toast").classList.remove("show"), 1800);
      }).catch(() => {
        alert(text);
      });
    }

    $("#startBtn").addEventListener("click", () => {
      state.current = 0;
      state.answers = Array(questions.length).fill(null);
      renderQuestion();
      showScreen("#screen-quiz");
    });

    $("#sampleBtn").addEventListener("click", () => renderResult("skill"));

    $("#prevBtn").addEventListener("click", () => {
      if (state.current > 0) {
        state.current -= 1;
        renderQuestion();
      }
    });

    $("#nextBtn").addEventListener("click", () => {
      if (state.answers[state.current] === null) return;
      if (state.current < questions.length - 1) {
        state.current += 1;
        renderQuestion();
      } else {
        renderResult();
      }
    });

    $("#restartBtn").addEventListener("click", () => {
      state.current = 0;
      state.answers = Array(questions.length).fill(null);
      renderQuestion();
      showScreen("#screen-quiz");
    });
