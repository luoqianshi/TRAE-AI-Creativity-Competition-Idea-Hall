<!DOCTYPE html><html lang="zh-CN"><head><script data-debug="1" crossorigin="anonymous" src="https://cdn-tos.bytedance.net/tiktok_pns_storage_control/1.0.0.65/index.js" desc="For any issues, please consult in the ROW OG Business Access Group!" data-storage-control="localStorage=reportOnly"></script>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>🕹️ 时光穿梭机 - 80/90年代复古文本转换器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');
        
        body {
            font-family: 'ZCOOL KuaiLe', cursive, system-ui;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .retro-border {
            border: 3px solid #000;
            box-shadow: 8px 8px 0px #000;
        }
        
        .glow-text {
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 30px #ff00ff;
        }
        
        .marquee {
            animation: marquee 10s linear infinite;
        }
        
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        
        .sparkle {
            animation: sparkle 1.5s infinite;
        }
        
        @keyframes sparkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- 标题区域 -->
        <div class="text-center mb-8">
            <h1 class="text-4xl md:text-6xl font-bold text-white glow-text mb-4">
                🕹️ 时光穿梭机 🕹️
            </h1>
            <div class="bg-yellow-300 retro-border p-3 inline-block">
                <p class="text-xl font-bold">✨ 一键回到80/90年代 ✨</p>
            </div>
            <p class="text-white mt-4 text-lg">火星文 | 非主流 | QQ签名 | 劲舞团风格</p>
        </div>
        
        <!-- 输入区域 -->
        <div class="bg-white retro-border p-6 mb-6">
            <h2 class="text-2xl font-bold mb-4">📝 输入你想要转换的文字：</h2>
            <textarea id="inputText" class="w-full h-32 p-4 border-3 border-black text-lg" placeholder="在这里输入普通文字，比如：今天天气真好，我们一起出去玩吧"></textarea>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
                <button onclick="convertToMars()" class="bg-pink-400 hover:bg-pink-500 text-white font-bold py-3 px-4 retro-border">
                    🔥 火星文
                </button>
                <button onclick="convertTo非主流()" class="bg-purple-400 hover:bg-purple-500 text-white font-bold py-3 px-4 retro-border">
                    💜 非主流
                </button>
                <button onclick="convertToQQ()" class="bg-blue-400 hover:bg-blue-500 text-white font-bold py-3 px-4 retro-border">
                    💬 QQ签名
                </button>
                <button onclick="convertTo劲舞团()" class="bg-orange-400 hover:bg-orange-500 text-white font-bold py-3 px-4 retro-border">
                    💃 劲舞团
                </button>
            </div>
        </div>
        
        <!-- 输出区域 -->
        <div class="bg-white retro-border p-6 mb-6">
            <h2 class="text-2xl font-bold mb-4">✨ 转换结果：</h2>
            <div id="outputText" class="w-full min-h-32 p-4 border-3 border-black bg-gray-100 text-xl">
                转换后的文字会显示在这里...
            </div>
            <button onclick="copyResult()" class="mt-4 bg-green-400 hover:bg-green-500 text-white font-bold py-2 px-6 retro-border">
                📋 一键复制
            </button>
        </div>
        
        <!-- 示例展示 -->
        <div class="bg-yellow-100 retro-border p-6">
            <h2 class="text-2xl font-bold mb-4">🎠 效果示例：</h2>
            <div class="space-y-4">
                <div class="p-3 bg-pink-100 border-2 border-black">
                    <p class="font-bold">火星文效果：</p>
                    <p class="text-lg">訡迗迗芞眞ぬ，涐扪①起诎魭紦 ✨</p>
                </div>
                <div class="p-3 bg-purple-100 border-2 border-black">
                    <p class="font-bold">非主流效果：</p>
                    <p class="text-lg">╰☆╮ 今迗迗芞眞ぬ 涐扪①起诎魭紦 ╭☆╯</p>
                </div>
                <div class="p-3 bg-blue-100 border-2 border-black">
                    <p class="font-bold">QQ签名效果：</p>
                    <p class="text-lg">._|{今迗迗芞眞ぬ,莪们①起诎魭紦!.﹖</p>
                </div>
            </div>
        </div>
        
        <!-- 底部跑马灯 -->
        <div class="mt-8 bg-black text-white p-2 overflow-hidden">
            <div class="marquee">
                <span class="sparkle">★☆★ 欢迎来到2008年 ★☆★ 还记得你的第一个QQ昵称吗？ ★☆★ 火星文转换器 2008经典重现 ★☆★</span>
            </div>
        </div>
    </div>

    <script>
        // 火星文字符映射
        const marsMap = {
            '今': '訡', '天': '迗', '气': '芞', '真': '眞', '好': 'ぬ',
            '我': '涐', '们': '扪', '一': '①', '起': '起', '出': '诎',
            '去': '魭', '玩': '紦', '吧': '紦', '的': 'の', '是': '媞',
            '你': '伱', '爱': '嗳', '情': '情', '快': '快', '乐': '楽'
        };
        
        function convertToMars() {
            let text = document.getElementById('inputText').value;
            for (let key in marsMap) {
                text = text.split(key).join(marsMap[key]);
            }
            document.getElementById('outputText').innerText = text + ' ✨';
        }
        
        function convertTo非主流() {
            let text = document.getElementById('inputText').value;
            for (let key in marsMap) {
                text = text.split(key).join(marsMap[key]);
            }
            document.getElementById('outputText').innerText = `╰☆╮ ${text} ╭☆╯`;
        }
        
        function convertToQQ() {
            let text = document.getElementById('inputText').value;
            document.getElementById('outputText').innerText = `._|{${text}!.﹖`;
        }
        
        function convertTo劲舞团() {
            let text = document.getElementById('inputText').value;
            document.getElementById('outputText').innerText = `●﹎мe | ${text} ノ`;
        }
        
        function copyResult() {
            const text = document.getElementById('outputText').innerText;
            navigator.clipboard.writeText(text);
            alert('✅ 已复制到剪贴板！快去粘贴吧~');
        }
    </script>
