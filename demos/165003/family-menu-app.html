<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭智能点菜系统</title>
    <style>
        :root {
            --bg: #faf9f7;
            --bg2: #ffffff;
            --ink: #2d2a26;
            --muted: #7a7570;
            --rule: #e8e5e0;
            --accent: #e07a5f;
            --accent2: #81b29a;
            --accent-light: #fef3f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            padding: 2rem 0 3rem;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 0.5rem;
        }

        header .subtitle {
            color: var(--muted);
            font-size: 1.1rem;
        }

        .date-display {
            background: linear-gradient(135deg, var(--accent), #f4a261);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            display: inline-block;
            margin-top: 1rem;
            font-weight: 500;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            background: var(--bg2);
            padding: 0.5rem;
            border-radius: 1rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .tab-btn {
            flex: 1;
            padding: 1rem 1.5rem;
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 0.75rem;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            background: var(--accent-light);
            color: var(--accent);
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--bg2);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--ink);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: #c96a50;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg);
            color: var(--ink);
            border: 1px solid var(--rule);
        }

        .btn-secondary:hover {
            background: var(--rule);
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }

        .btn-icon {
            padding: 0.5rem;
            background: transparent;
            border: none;
            cursor: pointer;
            border-radius: 0.5rem;
            color: var(--muted);
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background: var(--bg);
            color: var(--accent);
        }

        .member-list, .dish-list {
            display: grid;
            gap: 1rem;
        }

        .member-item, .dish-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.25rem;
            background: var(--bg);
            border-radius: 0.75rem;
            transition: all 0.2s;
        }

        .member-item:hover, .dish-item:hover {
            background: var(--accent-light);
        }

        .member-info, .dish-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .member-name, .dish-name {
            font-weight: 500;
            font-size: 1.05rem;
        }

        .dish-category {
            font-size: 0.8rem;
            color: var(--muted);
            background: var(--bg2);
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            margin-left: 0.5rem;
        }

        .item-actions {
            display: flex;
            gap: 0.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--muted);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg2);
            border-radius: 1.5rem;
            padding: 2rem;
            width: 90%;
            max-width: 450px;
            transform: translateY(20px);
            transition: transform 0.2s;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-header {
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.35rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--ink);
        }

        .form-input, .form-select {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--rule);
            border-radius: 0.75rem;
            font-size: 1rem;
            transition: all 0.2s;
            background: var(--bg);
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg2);
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .modal-actions .btn {
            flex: 1;
        }

        /* Selection Page */
        .selection-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .member-tabs {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .member-tab {
            padding: 0.75rem 1.25rem;
            border: 2px solid var(--rule);
            border-radius: 2rem;
            background: var(--bg2);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .member-tab:hover {
            border-color: var(--accent);
        }

        .member-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .member-tab .badge {
            display: inline-block;
            background: var(--accent2);
            color: white;
            font-size: 0.75rem;
            padding: 0.15rem 0.5rem;
            border-radius: 1rem;
            margin-left: 0.5rem;
        }

        .member-tab.active .badge {
            background: white;
            color: var(--accent);
        }

        .category-section {
            margin-bottom: 2rem;
        }

        .category-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--rule);
        }

        .dish-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        .dish-card {
            background: var(--bg);
            border-radius: 1rem;
            padding: 1.25rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 3px solid transparent;
            position: relative;
        }

        .dish-card:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
        }

        .dish-card.selected {
            border-color: var(--accent);
            background: var(--accent-light);
        }

        .dish-card .dish-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .dish-card .dish-desc {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .dish-card .check-mark {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            width: 24px;
            height: 24px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.75rem;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s;
        }

        .dish-card.selected .check-mark {
            opacity: 1;
            transform: scale(1);
        }

        /* Results Page */
        .result-card {
            background: var(--bg2);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--rule);
        }

        .result-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1.25rem;
        }

        .result-name {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .result-dishes {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .result-dish-tag {
            background: var(--accent-light);
            color: var(--accent);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-weight: 500;
        }

        .result-empty {
            text-align: center;
            padding: 2rem;
            color: var(--muted);
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg2);
            border-radius: 1rem;
            padding: 1.25rem;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 0.25rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            header h1 {
                font-size: 1.75rem;
            }

            .tabs {
                flex-wrap: wrap;
            }

            .tab-btn {
                font-size: 0.9rem;
                padding: 0.75rem 1rem;
            }

            .summary-stats {
                grid-template-columns: 1fr;
            }

            .dish-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍽️ 家庭智能点菜系统</h1>
            <p class="subtitle">让每餐都成为家人的期待</p>
            <div class="date-display" id="currentDate"></div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="members">👨‍👩‍👧 家庭成员</button>
            <button class="tab-btn" data-tab="dishes">🍜 菜品管理</button>
            <button class="tab-btn" data-tab="select">✋ 今日点菜</button>
            <button class="tab-btn" data-tab="results">📊 今日结果</button>
        </div>

        <!-- 家庭成员管理 -->
        <div class="tab-content active" id="members">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">家庭成员列表</h2>
                    <button class="btn btn-primary" onclick="openMemberModal()">+ 添加成员</button>
                </div>
                <div class="member-list" id="memberList"></div>
            </div>
        </div>

        <!-- 菜品管理 -->
        <div class="tab-content" id="dishes">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">菜品列表</h2>
                    <button class="btn btn-primary" onclick="openDishModal()">+ 添加菜品</button>
                </div>
                <div id="dishList"></div>
            </div>
        </div>

        <!-- 今日点菜 -->
        <div class="tab-content" id="select">
            <div class="card">
                <div class="selection-header">
                    <h2 class="card-title">选择今日菜品</h2>
                    <button class="btn btn-secondary" onclick="clearCurrentSelections()">清空选择</button>
                </div>
                <div class="member-tabs" id="memberTabs"></div>
            </div>
            <div id="dishSelection"></div>
        </div>

        <!-- 今日结果 -->
        <div class="tab-content" id="results">
            <div class="summary-stats" id="summaryStats"></div>
            <div id="resultsList"></div>
        </div>
    </div>

    <!-- 添加/编辑成员 Modal -->
    <div class="modal-overlay" id="memberModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="memberModalTitle">添加家庭成员</h3>
            </div>
            <form id="memberForm">
                <input type="hidden" id="memberId">
                <div class="form-group">
                    <label class="form-label">成员姓名</label>
                    <input type="text" class="form-input" id="memberName" placeholder="请输入成员姓名" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeMemberModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 添加/编辑菜品 Modal -->
    <div class="modal-overlay" id="dishModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="dishModalTitle">添加菜品</h3>
            </div>
            <form id="dishForm">
                <input type="hidden" id="dishId">
                <div class="form-group">
                    <label class="form-label">菜品名称</label>
                    <input type="text" class="form-input" id="dishName" placeholder="请输入菜品名称" required>
                </div>
                <div class="form-group">
                    <label class="form-label">菜品分类</label>
                    <select class="form-select" id="dishCategory" required>
                        <option value="">请选择分类</option>
                        <option value="主食">🍚 主食</option>
                        <option value="肉类">🥩 肉类</option>
                        <option value="蔬菜">🥬 蔬菜</option>
                        <option value="汤类">🍲 汤类</option>
                        <option value="凉菜">🥗 凉菜</option>
                        <option value="小食">🍟 小食</option>
                        <option value="水果">🍎 水果</option>
                        <option value="饮品">🧃 饮品</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">备注（可选）</label>
                    <input type="text" class="form-input" id="dishDesc" placeholder="如：少盐、微辣等">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeDishModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 数据管理
        const DATA_KEY = 'familyMenuData';
        
        function getData() {
            const data = localStorage.getItem(DATA_KEY);
            return data ? JSON.parse(data) : {
                members: [],
                dishes: [],
                selections: {}
            };
        }

        function saveData(data) {
            localStorage.setItem(DATA_KEY, JSON.stringify(data));
        }

        // 获取今日日期字符串
        function getToday() {
            const today = new Date();
            return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        }

        // 初始化
        function init() {
            updateDateDisplay();
            renderMembers();
            renderDishes();
            renderMemberTabs();
            renderDishSelection();
            renderResults();
            setupTabs();
            setupForms();
        }

        function updateDateDisplay() {
            const today = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('currentDate').textContent = today.toLocaleDateString('zh-CN', options);
        }

        // Tab 切换
        function setupTabs() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(btn.dataset.tab).classList.add('active');
                });
            });
        }

        // 家庭成员管理
        function renderMembers() {
            const data = getData();
            const container = document.getElementById('memberList');
            
            if (data.members.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <p>还没有添加家庭成员</p>
                        <p style="font-size: 0.9rem; margin-top: 0.5rem;">点击右上角按钮添加第一位成员</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = data.members.map(member => `
                <div class="member-item">
                    <div class="member-info">
                        <div class="avatar">${member.name.charAt(0)}</div>
                        <span class="member-name">${member.name}</span>
                    </div>
                    <div class="item-actions">
                        <button class="btn-icon" onclick="editMember('${member.id}')" title="编辑">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                        </button>
                        <button class="btn-icon" onclick="deleteMember('${member.id}')" title="删除">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function openMemberModal(id = null) {
            const modal = document.getElementById('memberModal');
            const title = document.getElementById('memberModalTitle');
            const nameInput = document.getElementById('memberId');
            
            if (id) {
                const data = getData();
                const member = data.members.find(m => m.id === id);
                title.textContent = '编辑成员';
                nameInput.value = id;
                document.getElementById('memberName').value = member.name;
            } else {
                title.textContent = '添加家庭成员';
                nameInput.value = '';
                document.getElementById('memberName').value = '';
            }
            
            modal.classList.add('active');
            document.getElementById('memberName').focus();
        }

        function closeMemberModal() {
            document.getElementById('memberModal').classList.remove('active');
        }

        function editMember(id) {
            openMemberModal(id);
        }

        function deleteMember(id) {
            if (confirm('确定要删除这位家庭成员吗？')) {
                const data = getData();
                data.members = data.members.filter(m => m.id !== id);
                delete data.selections[id];
                saveData(data);
                renderMembers();
                renderMemberTabs();
                renderDishSelection();
                renderResults();
            }
        }

        // 菜品管理
        function renderDishes() {
            const data = getData();
            const container = document.getElementById('dishList');
            
            if (data.dishes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                            <line x1="6" y1="1" x2="6" y2="4"></line>
                            <line x1="10" y1="1" x2="10" y2="4"></line>
                            <line x1="14" y1="1" x2="14" y2="4"></line>
                        </svg>
                        <p>还没有添加菜品</p>
                        <p style="font-size: 0.9rem; margin-top: 0.5rem;">点击右上角按钮添加第一道菜品</p>
                    </div>
                `;
                return;
            }

            // 按分类分组
            const categories = {};
            const categoryNames = {
                '主食': '🍚 主食',
                '肉类': '🥩 肉类',
                '蔬菜': '🥬 蔬菜',
                '汤类': '🍲 汤类',
                '凉菜': '🥗 凉菜',
                '小食': '🍟 小食',
                '水果': '🍎 水果',
                '饮品': '🧃 饮品'
            };
            
            data.dishes.forEach(dish => {
                if (!categories[dish.category]) {
                    categories[dish.category] = [];
                }
                categories[dish.category].push(dish);
            });

            let html = '';
            Object.keys(categories).forEach(category => {
                html += `
                    <div class="category-section">
                        <h3 class="category-title">${categoryNames[category] || category}</h3>
                        <div class="dish-list">
                            ${categories[category].map(dish => `
                                <div class="dish-item">
                                    <div class="dish-info">
                                        <span class="dish-name">${dish.name}</span>
                                        ${dish.desc ? `<span class="dish-category">${dish.desc}</span>` : ''}
                                    </div>
                                    <div class="item-actions">
                                        <button class="btn-icon" onclick="editDish('${dish.id}')" title="编辑">
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                            </svg>
                                        </button>
                                        <button class="btn-icon" onclick="deleteDish('${dish.id}')" title="删除">
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <polyline points="3 6 5 6 21 6"></polyline>
                                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function openDishModal(id = null) {
            const modal = document.getElementById('dishModal');
            const title = document.getElementById('dishModalTitle');
            
            if (id) {
                const data = getData();
                const dish = data.dishes.find(d => d.id === id);
                title.textContent = '编辑菜品';
                document.getElementById('dishId').value = id;
                document.getElementById('dishName').value = dish.name;
                document.getElementById('dishCategory').value = dish.category;
                document.getElementById('dishDesc').value = dish.desc || '';
            } else {
                title.textContent = '添加菜品';
                document.getElementById('dishId').value = '';
                document.getElementById('dishName').value = '';
                document.getElementById('dishCategory').value = '';
                document.getElementById('dishDesc').value = '';
            }
            
            modal.classList.add('active');
            document.getElementById('dishName').focus();
        }

        function closeDishModal() {
            document.getElementById('dishModal').classList.remove('active');
        }

        function editDish(id) {
            openDishModal(id);
        }

        function deleteDish(id) {
            if (confirm('确定要删除这道菜品吗？')) {
                const data = getData();
                data.dishes = data.dishes.filter(d => d.id !== id);
                // 同时从所有选择中移除
                Object.keys(data.selections).forEach(memberId => {
                    data.selections[memberId] = data.selections[memberId].filter(dishId => dishId !== id);
                });
                saveData(data);
                renderDishes();
                renderDishSelection();
                renderResults();
            }
        }

        // 今日点菜
        let currentMemberId = null;

        function renderMemberTabs() {
            const data = getData();
            const container = document.getElementById('memberTabs');
            
            if (data.members.length === 0) {
                container.innerHTML = '<p style="color: var(--muted);">请先添加家庭成员</p>';
                return;
            }

            currentMemberId = data.members[0].id;
            
            container.innerHTML = data.members.map(member => {
                const selection = data.selections[member.id] || [];
                return `
                    <div class="member-tab ${member.id === currentMemberId ? 'active' : ''}" 
                         onclick="selectMember('${member.id}')">
                        ${member.name}
                        ${selection.length > 0 ? `<span class="badge">${selection.length}</span>` : ''}
                    </div>
                `;
            }).join('');
        }

        function selectMember(memberId) {
            currentMemberId = memberId;
            document.querySelectorAll('.member-tab').forEach(tab => {
                tab.classList.toggle('active', tab.onclick.toString().includes(memberId));
            });
            document.querySelectorAll('.member-tab').forEach(tab => {
                const isActive = tab.getAttribute('onclick').includes(`'${memberId}'`);
                tab.classList.toggle('active', isActive);
            });
            renderDishSelection();
        }

        function renderDishSelection() {
            const data = getData();
            const container = document.getElementById('dishSelection');
            
            if (data.dishes.length === 0) {
                container.innerHTML = `
                    <div class="card">
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                                <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                            </svg>
                            <p>还没有菜品</p>
                            <p style="font-size: 0.9rem; margin-top: 0.5rem;">请先在"菜品管理"中添加菜品</p>
                        </div>
                    </div>
                `;
                return;
            }

            if (!currentMemberId) {
                container.innerHTML = `
                    <div class="card">
                        <div class="empty-state">
                            <p>请先选择家庭成员</p>
                        </div>
                    </div>
                `;
                return;
            }

            const currentSelections = data.selections[currentMemberId] || [];
            const categoryNames = {
                '主食': '🍚 主食',
                '肉类': '🥩 肉类',
                '蔬菜': '🥬 蔬菜',
                '汤类': '🍲 汤类',
                '凉菜': '🥗 凉菜',
                '小食': '🍟 小食',
                '水果': '🍎 水果',
                '饮品': '🧃 饮品'
            };

            // 按分类分组
            const categories = {};
            data.dishes.forEach(dish => {
                if (!categories[dish.category]) {
                    categories[dish.category] = [];
                }
                categories[dish.category].push(dish);
            });

            let html = '';
            Object.keys(categories).forEach(category => {
                html += `
                    <div class="card">
                        <div class="category-section" style="margin-bottom: 0;">
                            <h3 class="category-title">${categoryNames[category] || category}</h3>
                        </div>
                        <div class="dish-grid">
                            ${categories[category].map(dish => {
                                const isSelected = currentSelections.includes(dish.id);
                                return `
                                    <div class="dish-card ${isSelected ? 'selected' : ''}" 
                                         onclick="toggleDishSelection('${dish.id}')">
                                        <div class="check-mark">✓</div>
                                        <div class="dish-name">${dish.name}</div>
                                        ${dish.desc ? `<div class="dish-desc">${dish.desc}</div>` : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function toggleDishSelection(dishId) {
            const data = getData();
            if (!data.selections[currentMemberId]) {
                data.selections[currentMemberId] = [];
            }
            
            const index = data.selections[currentMemberId].indexOf(dishId);
            if (index > -1) {
                data.selections[currentMemberId].splice(index, 1);
            } else {
                data.selections[currentMemberId].push(dishId);
            }
            
            saveData(data);
            renderMemberTabs();
            renderDishSelection();
        }

        function clearCurrentSelections() {
            if (!currentMemberId) return;
            
            if (confirm('确定要清空当前成员的所有选择吗？')) {
                const data = getData();
                data.selections[currentMemberId] = [];
                saveData(data);
                renderMemberTabs();
                renderDishSelection();
            }
        }

        // 今日结果
        function renderResults() {
            const data = getData();
            const statsContainer = document.getElementById('summaryStats');
            const listContainer = document.getElementById('resultsList');
            
            const today = getToday();
            const todaySelections = data.selections || {};
            
            let totalSelections = 0;
            let membersWithSelections = 0;
            
            Object.values(todaySelections).forEach(arr => {
                if (Array.isArray(arr) && arr.length > 0) {
                    totalSelections += arr.length;
                    membersWithSelections++;
                }
            });

            statsContainer.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${data.members.length}</div>
                    <div class="stat-label">家庭成员</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${membersWithSelections}</div>
                    <div class="stat-label">已点菜人数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${totalSelections}</div>
                    <div class="stat-label">菜品总数</div>
                </div>
            `;

            if (data.members.length === 0) {
                listContainer.innerHTML = `
                    <div class="card">
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                            </svg>
                            <p>还没有添加家庭成员</p>
                        </div>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = data.members.map(member => {
                const selections = todaySelections[member.id] || [];
                const selectedDishes = selections.map(dishId => {
                    return data.dishes.find(d => d.id === dishId);
                }).filter(Boolean);

                return `
                    <div class="result-card">
                        <div class="result-header">
                            <div class="result-avatar">${member.name.charAt(0)}</div>
                            <div>
                                <div class="result-name">${member.name}</div>
                                <div style="color: var(--muted); font-size: 0.9rem;">
                                    ${selections.length > 0 ? `选择了 ${selections.length} 道菜` : '尚未选择'}
                                </div>
                            </div>
                        </div>
                        ${selectedDishes.length > 0 ? `
                            <div class="result-dishes">
                                ${selectedDishes.map(dish => `
                                    <span class="result-dish-tag">${dish.name}</span>
                                `).join('')}
                            </div>
                        ` : `
                            <div class="result-empty">点击"今日点菜"为 ${member.name} 选择菜品</div>
                        `}
                    </div>
                `;
            }).join('');
        }

        // 表单处理
        function setupForms() {
            document.getElementById('memberForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const id = document.getElementById('memberId').value;
                const name = document.getElementById('memberName').value.trim();
                
                if (!name) {
                    alert('请输入成员姓名');
                    return;
                }

                const data = getData();
                
                if (id) {
                    // 编辑
                    const member = data.members.find(m => m.id === id);
                    if (member) {
                        member.name = name;
                    }
                } else {
                    // 添加
                    data.members.push({
                        id: Date.now().toString(),
                        name: name
                    });
                }
                
                saveData(data);
                closeMemberModal();
                renderMembers();
                renderMemberTabs();
                renderDishSelection();
                renderResults();
            });

            document.getElementById('dishForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const id = document.getElementById('dishId').value;
                const name = document.getElementById('dishName').value.trim();
                const category = document.getElementById('dishCategory').value;
                const desc = document.getElementById('dishDesc').value.trim();
                
                if (!name || !category) {
                    alert('请填写完整的菜品信息');
                    return;
                }

                const data = getData();
                
                if (id) {
                    // 编辑
                    const dish = data.dishes.find(d => d.id === id);
                    if (dish) {
                        dish.name = name;
                        dish.category = category;
                        dish.desc = desc;
                    }
                } else {
                    // 添加
                    data.dishes.push({
                        id: Date.now().toString(),
                        name: name,
                        category: category,
                        desc: desc
                    });
                }
                
                saveData(data);
                closeDishModal();
                renderDishes();
                renderDishSelection();
            });
        }

        // 初始化演示数据
        function initDemoData() {
            const data = getData();
            if (data.members.length === 0 && data.dishes.length === 0) {
                data.members = [
                    { id: '1', name: '爸爸' },
                    { id: '2', name: '妈妈' },
                    { id: '3', name: '小明' }
                ];
                data.dishes = [
                    { id: 'd1', name: '红烧肉', category: '肉类', desc: '' },
                    { id: 'd2', name: '清炒西兰花', category: '蔬菜', desc: '少油' },
                    { id: 'd3', name: '番茄炒蛋', category: '蔬菜', desc: '' },
                    { id: 'd4', name: '紫菜蛋花汤', category: '汤类', desc: '' },
                    { id: 'd5', name: '蒜蓉蒸虾', category: '肉类', desc: '' },
                    { id: 'd6', name: '凉拌黄瓜', category: '凉菜', desc: '少醋' },
                    { id: 'd7', name: '白米饭', category: '主食', desc: '' },
                    { id: 'd8', name: '可乐鸡翅', category: '肉类', desc: '' }
                ];
                saveData(data);
            }
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', () => {
            initDemoData();
            init();
        });
    </script>
</body>
</html>
