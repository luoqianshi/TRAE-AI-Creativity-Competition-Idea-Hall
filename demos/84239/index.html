<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; script-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'">
  <title></title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-light.min.css">
</head>
<body>
  <!-- Custom Title Bar -->
  <div class="titlebar">
    <div class="titlebar-drag-region"></div>
    <div class="titlebar-content">
      <div class="titlebar-title">
        <img src="assets/rai.svg" alt="logo" class="titlebar-icon">
      </div>
      <div class="titlebar-buttons">
        <button class="titlebar-btn minimize" onclick="minimizeWindow()">─</button>
        <button class="titlebar-btn maximize" onclick="maximizeWindow()">□</button>
        <button class="titlebar-btn close" onclick="closeWindow()">✕</button>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h3>对话历史</h3>
        <button class="new-chat-btn" onclick="newChat()">+</button>
      </div>
      <div class="chat-list" id="chatList">
        <div class="chat-item active" data-chat="1">
          <span class="chat-icon">💬</span>
          <span class="chat-title">新对话</span>
        </div>
      </div>
      <div class="sidebar-footer">
      </div>
    </aside>

    <!-- Chat Area -->
    <main class="chat-area">
      <div class="chat-messages" id="chatMessages">
        <div class="welcome-message">
          <div class="welcome-content">
            <img src="assets/logo.svg" alt="logo" class="welcome-logo">
            <h1>你好，我是RAi</h1>
            <p>我可以帮你回答问题、完成任务、提供建议。有什么可以帮你的吗？</p>
          </div>
        </div>
      </div>

      <!-- Input Area -->
      <div class="input-area">
        <div class="input-container">
          <textarea 
            id="messageInput" 
            placeholder="输入你的消息..." 
            rows="1"
          ></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        <div class="input-hint">按 Enter 发送,Shift + Enter 换行</div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
