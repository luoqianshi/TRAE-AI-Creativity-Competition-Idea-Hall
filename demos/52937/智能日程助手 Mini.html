<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>智能日程助手 Mini</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 800px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
}

h1 {
    color: #2b5cff;
}

.input-box {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
}

button {
    margin-top: 10px;
    padding: 10px 15px;
    background: #2b5cff;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.task {
    background: #eef3ff;
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
}
</style>
</head>

<body>
<div class="container">
    <h1>智能日程助手 Mini</h1>
    <p>输入你的待办事项，自动生成简单日程分类（演示版）</p>

    <input class="input-box" id="taskInput" placeholder="例如：写作业 / 开会 / 健身" />
    <button onclick="addTask()">添加任务</button>

    <div id="taskList"></div>
</div>

<script>
function addTask() {
    const input = document.getElementById("taskInput");
    const value = input.value.trim();
    if (!value) return;

    const div = document.createElement("div");
    div.className = "task";

    let type = "生活";
    if (value.includes("会议") || value.includes("工作")) type = "工作";
    if (value.includes("学习") || value.includes("作业")) type = "学习";

    div.innerText = "分类：" + type + " ｜ 任务：" + value;

    document.getElementById("taskList").appendChild(div);
    input.value = "";
}
</script>
</body>
</html>
