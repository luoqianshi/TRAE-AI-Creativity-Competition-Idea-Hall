<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onlyIdols | 顶级 K-Pop 女团图鉴</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        /* --- 全局变量与重置 --- */
        :root {
            --bg-color: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent-color: #ff0055; /* 霓虹粉 */
            --accent-secondary: #7000ff; /* 霓虹紫 */
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* --- 导航栏 --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
            background: rgba(10, 10, 10, 0.8);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: -1px;
            background: linear-gradient(45deg, #fff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            margin-left: 2rem;
            font-weight: 500;
            transition: 0.3s;
            opacity: 0.7;
        }

        .nav-links a:hover { opacity: 1; color: var(--accent-color); }

        /* --- Hero 区域 --- */
        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* 背景光晕动画 */
        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--accent-color), transparent 60%);
            opacity: 0.2;
            filter: blur(80px);
            z-index: -1;
            animation: move 10s infinite alternate;
        }
        .glow:nth-child(2) {
            background: radial-gradient(circle, var(--accent-secondary), transparent 60%);
            right: -10%;
            top: -10%;
            animation-delay: -5s;
        }

        @keyframes move {
            0% { transform: translate(-50px, -50px); }
            100% { transform: translate(50px, 50px); }
        }

        h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            line-height: 1;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 3rem;
        }

        .btn-explore {
            padding: 1rem 2.5rem;
            background: white;
            color: black;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-explore:hover {
            background: var(--accent-color);
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255, 0, 85, 0.3);
        }

        /* --- 网格展示区 --- */
        .groups-section {
            padding: 5rem 5%;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 3rem;
            border-left: 4px solid var(--accent-color);
            padding-left: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            height: 400px;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--accent-color);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 这里使用渐变代替图片，实际使用请替换为 <img> */
            background: linear-gradient(to bottom, #222, #000); 
            transition: 0.5s;
        }
        
        /* 模拟不同团体的封面色调 */
        .card[data-group="newjeans"] .card-img { background: linear-gradient(135deg, #2b5876, #4e4376); }
        .card[data-group="aespa"] .card-img { background: linear-gradient(135deg, #432371, #faae7b); }
        .card[data-group="ive"] .card-img { background: linear-gradient(135deg, #cc2b5e, #753a88); }
        .card[data-group="lesserafim"] .card-img { background: linear-gradient(135deg, #141e30, #243b55); }

        .card-content {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 2rem;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }

        .card h3 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        .card p { color: var(--text-muted); font-size: 0.9rem; }

        /* --- 模态框 (Modal) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-content {
            background: #161616;
            width: 90%;
            max-width: 800px;
            border-radius: 20px;
            padding: 2rem;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            transform: translateY(50px);
            transition: 0.3s;
        }

        .modal-overlay.active .modal-content { transform: translateY(0); }

        .close-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .member-grid {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .member-tag {
            padding: 0.5rem 1rem;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .group-desc {
            margin-top: 1rem;
            line-height: 1.6;
            color: #ccc;
        }

        /* --- 底部 --- */
        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 5rem;
        }
        
        /* 移动端适配 */
        @media(max-width: 768px) {
            h1 { font-size: 3rem; }
            .modal-content { width: 95%; padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">onlyIdols.</div>
        <div class="nav-links">
            <a href="#hero">首页</a>
            <a href="#groups">女团</a>
        </div>
    </nav>

    <header id="hero">
        <div class="glow"></div>
        <div class="glow"></div>
        <h1>The New Wave<br>of K-Pop</h1>
        <p class="subtitle">探索定义现代流行文化的顶级女团。风格、音乐与视觉的极致盛宴。</p>
        <button class="btn-explore" onclick="document.getElementById('groups').scrollIntoView({behavior: 'smooth'})">开始探索</button>
    </header>

    <section class="groups-section" id="groups">
        <h2 class="section-title">Trending Now</h2>
        <div class="grid">
            <div class="card" data-group="newjeans" onclick="openModal('newjeans')">
                <div class="card-img"></div>
                <div class="card-content">
                    <h3>NewJeans</h3>
                    <p>Y2K 风格的现象级新人</p>
                </div>
            </div>
            
            <div class="card" data-group="ive" onclick="openModal('ive')">
                <div class="card-img"></div>
                <div class="card-content">
                    <h3>IVE</h3>
                    <p>优雅与自恋美学的极致</p>
                </div>
            </div>

            <div class="card" data-group="aespa" onclick="openModal('aespa')">
                <div class="card-img"></div>
                <div class="card-content">
                    <h3>aespa</h3>
                    <p>元宇宙概念与强劲节拍</p>
                </div>
            </div>

            <div class="card" data-group="lesserafim" onclick="openModal('lesserafim')">
                <div class="card-img"></div>
                <div class="card-content">
                    <h3>LE SSERAFIM</h3>
                    <p>无畏与自信的时尚先锋</p>
                </div>
            </div>
        </div>
    </section>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 id="modal-title" style="font-size: 2.5rem; margin-bottom: 0.5rem;">Group Name</h2>
            <p id="modal-concept" style="color: var(--accent-color); text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; font-weight: 700;">Concept Style</p>
            <p id="modal-desc" class="group-desc">Description goes here.</p>
            
            <div style="margin-top: 2rem;">
                <h4 style="color: var(--text-muted); margin-bottom: 1rem;">MEMBERS</h4>
                <div class="member-grid" id="modal-members">
                    </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 onlyIdols. Design by Gemini.</p>
    </footer>

    <script>
        // 数据源
        const kpopData = {
            newjeans: {
                name: "NewJeans (뉴진스)",
                concept: "Y2K / Nostalgic / Youth",
                desc: "NewJeans 凭借其复古的 Y2K 美学和轻松的 R&B 流行曲风迅速席卷全球。她们像新牛仔裤一样，怎么穿都不过时，代表了这一代最纯粹的青春活力。",
                members: ["Minji (玟池)", "Hanni (憨妮)", "Danielle (丹妮尔)", "Haerin (猫猫)", "Hyein (惠仁)"]
            },
            ive: {
                name: "IVE (아이브)",
                concept: "Elegant / High-Teen / Narcissism",
                desc: "以 'I HAVE' 为名，IVE 展示了她们拥有的一切。华丽的视觉效果、充满力量的流行舞曲以及独特的 '自恋' 概念，让她们成为第四代女团的领军人物。",
                members: ["Yujin (安俞真)", "Gaeul (秋天)", "Rei (直井怜)", "Wonyoung (张员瑛)", "Liz (丽兹)", "Leeseo (李瑞)"]
            },
            aespa: {
                name: "aespa (에스파)",
                concept: "Metaverse / Futurism / Hyperpop",
                desc: "连接现实与虚拟世界的旷野 (Kwangya) 行者。aespa 融合了强烈的电子音效、AI 虚拟形象和宏大的世界观，带来了 K-Pop 前所未有的视听体验。",
                members: ["Karina (柳智敏)", "Giselle (吉赛尔)", "Winter (金玟庭)", "Ningning (宁艺卓)"]
            },
            lesserafim: {
                name: "LE SSERAFIM (르세라핌)",
                concept: "Fearless / Chic / Runway",
                desc: "由 'IM FEARLESS' 变位而来。她们不仅是在舞台上表演的偶像，更是无论面对何种视线都毫不动摇、勇往直前的时尚偶像。",
                members: ["Chaewon (金采源)", "Sakura (宫脇咲良)", "Yunjin (许允真)", "Kazuha (中村一叶)", "Eunchae (洪恩採)"]
            }
        };

        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalConcept = document.getElementById('modal-concept');
        const modalDesc = document.getElementById('modal-desc');
        const modalMembers = document.getElementById('modal-members');

        // 打开弹窗
        function openModal(groupKey) {
            const data = kpopData[groupKey];
            
            modalTitle.innerText = data.name;
            modalConcept.innerText = data.concept;
            modalDesc.innerText = data.desc;
            
            // 清空并重新生成成员列表
            modalMembers.innerHTML = '';
            data.members.forEach(member => {
                const span = document.createElement('span');
                span.className = 'member-tag';
                span.innerText = member;
                modalMembers.appendChild(span);
            });

            modal.classList.add('active');
        }

        // 关闭弹窗
        function closeModal() {
            modal.classList.remove('active');
        }

        // 点击遮罩层关闭
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
    </script>
</body>
</html>
