        }
        .section-title .badge {

            font-weight: 500;
            background: #b11a1a;
            color: #fff;
            padding: 2px 14px;
            border-radius: 40px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px 20px;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;

            font-weight: 600;
            font-size: 15px;
            color: #3d3d4a;
            margin-right: 4px;
        }
        .filter-group {

            flex-wrap: wrap;
            gap: 8px;
        }
        .filter-btn {
            background: #f0ebe6;
            border: none;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            color: #3d3d4a;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover {
            background: #e2dad3;
        }

            background: #b11a1a;
            color: #fff;

        }

            background: #1e1e2a;
            color: #fff;

        }

            align-items: center;
            gap: 8px;
            margin-left: auto;
            background: #f5f0eb;
            border-radius: 40px;
            padding: 2px 6px 2px 18px;
            border: 1px solid #e8e0d8;
            transition: 0.2s;

            border-color: #b11a1a;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(177, 26, 26, 0.08);
        }
        .search-box input {
            border: none;
            background: transparent;
            padding: 8px 0;
            font-size: 15px;
            outline: none;
            width: 160px;
            color: #1e1e2a;
        }
        .search-box input::placeholder {
            color: #aaa;
        }
        .search-box button {
            background: #b11a1a;
            border: none;
            color: #fff;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .search-box button:hover {
            background: #8b0000;
        }

            font-size: 14px;
            color: #6b6b7a;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .stats strong {
            color: #b11a1a;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: #fff;
            border-radius: 18px;
            padding: 20px 22px 22px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);

        }

            }

            }
        }
    </style>
</head>

            name: "云南建水鸡脚王烧烤",
            category: "宜宾烧烤",
            features: "烤猪蹄 · 包浆豆腐 · 烤鸡脚",
            location: "宜宾市叙州区南岸商贸路",
            price: "50-70",
            note: ""
        }, {
            id: 103,
            name: "静静烧烤",
            category: "宜宾烧烤",
            features: "五花肉 · 烤鸡翅 · 郡肝",
            location: "宜宾市叙州区永兴街31号",
            price: "50-70",
            note: ""
        }];

        let currentCategory = 'all';
        let currentPrice = 'all';
        let searchQuery = '';

        const grid = document.getElementById('cardGrid');
        const totalSpan = document.getElementById('totalCount');
        const activeFiltersSpan = document.getElementById('activeFilters');

        function parsePriceRange(priceStr) {
            if (!priceStr) return [0, Infinity];
            const parts = priceStr.split('-').map(s => parseInt(s.trim()));
            if (parts.length === 1) {
                if (priceStr.endsWith('+')) return [parseInt(priceStr), Infinity];
                return [0, parts[0]];
            }
            return [parts[0] || 0, parts[1] || Infinity];
        }

        function priceInRange(priceStr, rangeStr) {
            if (rangeStr === 'all') return true;
            const [pMin, pMax] = parsePriceRange(priceStr);
            const [rMin, rMax] = parsePriceRange(rangeStr);
            return pMax >= rMin && pMin <= rMax;
        }

        function filterRestaurants() {
            return restaurants.filter(r => {
                if (currentCategory !== 'all' && r.category !== currentCategory) return false;
                if (currentPrice !== 'all' && !priceInRange(r.price, currentPrice)) return false;
                if (searchQuery.trim()) {
                    const q = searchQuery.trim().toLowerCase();
                    const nameMatch = r.name.toLowerCase().includes(q);
                    const featureMatch = r.features.toLowerCase().includes(q);
                    const locMatch = r.location.toLowerCase().includes(q);
                    if (!nameMatch && !featureMatch && !locMatch) return false;
                }
                return true;
            });
        }

        function render() {
            const filtered = filterRestaurants();
            totalSpan.textContent = filtered.length;

            let label = '';
            if (currentCategory !== 'all') label += `类别: ${currentCategory}  `;
            if (currentPrice !== 'all') label += `人均: ${currentPrice}  `;
            if (searchQuery.trim()) label += `搜索: "${searchQuery.trim()}"`;
            if (!label) label = '全部';
            activeFiltersSpan.textContent = label;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="no-result" style="grid-column:1/-1;">
                        <span>🍜</span>
                        没有找到匹配的餐厅，试试调整筛选条件吧~
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(r => `
                <div class="card">
                    <span class="card-category">${r.category}</span>
                    <div class="card-name">${r.name}</div>
                    <div class="card-features">
                        ${r.features.split('·').map(f => `<span>${f.trim()}</span>`).join('')}
                    </div>
                    <div class="card-location">📍 ${r.location}</div>
                    <div class="card-price">💰 人均 ¥${r.price}</div>
                    ${r.note ? `<div class="card-note">💡 ${r.note}</div>` : ''}
                </div>
            `).join('');
        }

        document.querySelectorAll('#categoryFilters .filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('#categoryFilters .filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentCategory = this.dataset.cat;
                render();
            });
        });

        document.querySelectorAll('#priceFilters .filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('#priceFilters .filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentPrice = this.dataset.price;
                render();
            });
        });

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');

        function doSearch() {
            searchQuery = searchInput.value;
            render();
        }

        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doSearch();
        });
        searchInput.addEventListener('input', function() {
            if (this.value === '') {
                searchQuery = '';
                render();
            }
        });

        render();
    </script>
</body>
</html>
