<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据转换器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
            background: #f5f5f5;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 24px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
        }
        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Monaco', monospace;
            font-size: 13px;
            resize: vertical;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 12px;
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn-secondary {
            background: #9e9e9e;
            margin-left: 8px;
        }
        .result-area {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 16px;
            min-height: 150px;
            font-family: 'Monaco', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .result-area.empty { color: #999; text-align: center; line-height: 150px; }
        .error-message {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
            padding: 12px;
            color: #e65100;
            margin-top: 12px;
            font-size: 14px;
        }
        .success-message {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 12px;
            color: #2e7d32;
            margin-top: 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-title">输入数据</div>
            <textarea id="dataInput" placeholder="输入JSON数据..."></textarea>
            <button class="btn" onclick="processData()">开始处理</button>
            <button class="btn btn-secondary" onclick="clearAll()">清空</button>
        </div>
        <div class="card">
            <div class="card-title">转换结果</div>
            <div class="result-area empty" id="transformOutput">点击"开始处理"查看转换结果</div>
        </div>
    </div>
    <script>
        function clearAll() {
            document.getElementById('dataInput').value = '';
            document.getElementById('transformOutput').className = 'result-area empty';
            document.getElementById('transformOutput').textContent = '点击"开始处理"查看转换结果';
            document.querySelectorAll('.error-message, .success-message').forEach(m => m.remove());
        }
        function transformData(data) {
            if (!data || typeof data !== 'object') return data;
            if (Array.isArray(data)) return data.map(item => transformData(item));
            const res = {};
            for (const key in data) {
                const value = data[key];
                if (key === 'salary' && typeof value === 'number') res[key] = '¥' + value.toLocaleString();
                else if (key === 'employees') res[key] = value.map(e => ({ name: e.name, role: e.role, salary: '¥' + e.salary.toLocaleString(), level: e.salary >= 20000 ? '高级' : e.salary >= 15000 ? '中级' : '初级' }));
                else if (typeof value === 'object') res[key] = transformData(value);
                else res[key] = value;
            }
            return res;
        }
        function processData() {
            document.querySelectorAll('.error-message, .success-message').forEach(m => m.remove());
            const input = document.getElementById('dataInput').value.trim();
            if (!input) {
                document.querySelector('.btn').insertAdjacentHTML('afterend', '<div class="error-message">❌ 请输入数据</div>');
                return;
            }
            let data;
            try { data = JSON.parse(input); }
            catch (e) {
                document.querySelector('.btn').insertAdjacentHTML('afterend', '<div class="error-message">❌ JSON格式错误: ' + e.message + '</div>');
                return;
            }
            const transformed = transformData(data);
            const output = document.getElementById('transformOutput');
            output.className = 'result-area';
            output.textContent = JSON.stringify(transformed, null, 2);
            document.querySelector('.btn').insertAdjacentHTML('afterend', '<div class="success-message">✅ 转换完成！</div>');
        }
    </script>
</body>
</html>
