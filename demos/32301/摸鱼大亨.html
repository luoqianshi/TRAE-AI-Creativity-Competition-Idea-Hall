<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博摸鱼大亨</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff88;
            --neon-blue: #00bfff;
            --neon-pink: #ff00ff;
            --neon-yellow: #ffff00;
            --neon-orange: #ff6600;
            --neon-purple: #aa00ff;
            --neon-cyan: #00ffff;
            --dark-bg: #0a0a0f;
            --card-bg: #12121a;
            --card-border: #1e1e2e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--dark-bg);
            color: #e1e1e6;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        /* 背景网格动画 */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* 浮动粒子 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--neon-green);
            border-radius: 50%;
            opacity: 0;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* 主容器 */
        .main-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* 标题 */
        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow:
                0 0 10px rgba(0, 255, 136, 0.5),
                0 0 20px rgba(0, 255, 136, 0.3),
                0 0 40px rgba(0, 255, 136, 0.1);
            margin-bottom: 0.5rem;
            text-align: center;
            letter-spacing: 2px;
        }

        .game-subtitle {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.6rem;
            color: var(--neon-blue);
            margin-bottom: 2rem;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.3);
            letter-spacing: 1px;
        }

        /* 分数面板 */
        .score-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem 2rem;
            width: 100%;
            text-align: center;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .score-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .money-label {
            font-size: 0.85rem;
            color: #6b7280;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .money-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
            transition: transform 0.1s;
        }

        .money-display.pulse {
            animation: moneyPulse 0.15s ease-out;
        }

        @keyframes moneyPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .cps-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--neon-blue);
            margin-top: 0.5rem;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.2);
        }

        /* 点击按钮区域 */
        .click-area {
            margin: 1.5rem 0;
            position: relative;
        }

        #clickBtn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 3px solid var(--neon-green);
            background: radial-gradient(circle at 30% 30%, #1a3a2a, #0d1f17);
            color: var(--neon-green);
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow:
                0 0 20px rgba(0, 255, 136, 0.3),
                0 0 40px rgba(0, 255, 136, 0.1),
                inset 0 0 20px rgba(0, 255, 136, 0.1);
            transition: all 0.1s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
        }

        #clickBtn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, var(--neon-green), transparent 30%);
            animation: rotate 4s linear infinite;
            opacity: 0.3;
        }

        #clickBtn::after {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #1a3a2a, #0d1f17);
            z-index: 1;
        }

        #clickBtn span {
            position: relative;
            z-index: 2;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        #clickBtn:hover {
            box-shadow:
                0 0 30px rgba(0, 255, 136, 0.5),
                0 0 60px rgba(0, 255, 136, 0.2),
                inset 0 0 30px rgba(0, 255, 136, 0.15);
            transform: scale(1.02);
        }

        #clickBtn:active {
            transform: scale(0.92);
            box-shadow:
                0 0 10px rgba(0, 255, 136, 0.2),
                inset 0 0 30px rgba(0, 255, 136, 0.2);
        }

        /* 浮动数字 */
        .floating-number {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            pointer-events: none;
            animation: floatUpNumber 1s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUpNumber {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-80px) scale(1.3);
            }
        }

        /* 点击粒子爆炸 */
        .click-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99;
        }

        /* 商店 */
        .shop {
            width: 100%;
            margin-top: 1rem;
        }

        .shop-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--card-border);
        }

        .shop-icon {
            font-size: 1.2rem;
        }

        .shop-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: var(--neon-blue);
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.2);
        }

        .shop-items {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1rem;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: transparent;
            transition: background 0.2s;
        }

        .item.available {
            border-color: rgba(0, 255, 136, 0.3);
        }

        .item.available::before {
            background: var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .item.available:hover {
            border-color: rgba(0, 255, 136, 0.5);
            transform: translateX(4px);
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.1);
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .item-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #e1e1e6;
        }

        .item-desc {
            font-size: 0.75rem;
            color: #6b7280;
        }

        .item-cost {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--neon-green);
        }

        .item-count {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: var(--neon-blue);
            background: rgba(0, 191, 255, 0.1);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }

        .buy-btn {
            background: #1e1e2e;
            color: #4b5563;
            border: 1px solid #2d2d3d;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: not-allowed;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.2s;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .item.available .buy-btn {
            background: rgba(0, 255, 136, 0.15);
            color: var(--neon-green);
            border-color: var(--neon-green);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.1);
        }

        .item.available .buy-btn:hover {
            background: rgba(0, 255, 136, 0.25);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
            transform: translateY(-1px);
        }

        .item.available .buy-btn:active {
            transform: scale(0.95);
        }

        /* 统计面板 */
        .stats-panel {
            width: 100%;
            margin-top: 1.5rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1rem;
        }

        .stats-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--neon-purple);
            margin-bottom: 0.8rem;
            text-shadow: 0 0 10px rgba(170, 0, 255, 0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem;
        }

        .stat-item {
            text-align: center;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
        }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--neon-yellow);
        }

        .stat-label {
            font-size: 0.7rem;
            color: #6b7280;
            margin-top: 0.2rem;
        }

        /* 成就提示 */
        .achievement-toast {
            position: fixed;
            top: 20px;
            right: -400px;
            background: var(--card-bg);
            border: 1px solid var(--neon-yellow);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            box-shadow: 0 0 30px rgba(255, 255, 0, 0.2);
            z-index: 1000;
            transition: right 0.5s ease;
            max-width: 300px;
        }

        .achievement-toast.show {
            right: 20px;
        }

        .achievement-toast .toast-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: var(--neon-yellow);
            margin-bottom: 0.3rem;
        }

        .achievement-toast .toast-msg {
            font-size: 0.85rem;
            color: #e1e1e6;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .game-title { font-size: 1.6rem; }
            .money-display { font-size: 2.2rem; }
            #clickBtn { width: 150px; height: 150px; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="particles" id="particles"></div>

    <div class="main-container">
        <h1 class="game-title">摸鱼大亨</h1>
        <div class="game-subtitle">CYBER MOYU TYCOON v1.0</div>

        <!-- 分数面板 -->
        <div class="score-panel">
            <div class="money-label">摸鱼币余额</div>
            <div class="money-display" id="moneyDisplay">¥ 0</div>
            <div class="cps-display">
                摸鱼速度: <span id="cpsDisplay">0.0</span> /秒 |
                总点击: <span id="totalClicks">0</span>
            </div>
        </div>

        <!-- 点击按钮 -->
        <div class="click-area" id="clickArea">
            <button id="clickBtn"><span>点我摸鱼</span></button>
        </div>

        <!-- 商店 -->
        <div class="shop">
            <div class="shop-header">
                <span class="shop-icon">🛒</span>
                <span class="shop-title">摸鱼装备店</span>
            </div>
            <div class="shop-items" id="shopItems"></div>
        </div>

        <!-- 统计面板 -->
        <div class="stats-panel">
            <div class="stats-title">📊 摸鱼数据</div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="statTotalMoney">0</div>
                    <div class="stat-label">累计摸鱼币</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statTotalClicks">0</div>
                    <div class="stat-label">手动点击次数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statPlayTime">0:00</div>
                    <div class="stat-label">摸鱼时长</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statItemsBought">0</div>
                    <div class="stat-label">装备数量</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 成就提示 -->
    <div class="achievement-toast" id="achievementToast">
        <div class="toast-title">🏆 成就解锁!</div>
        <div class="toast-msg" id="toastMsg"></div>
    </div>

<script>
    // ==================== 游戏配置 ====================
    const UPGRADES = [
        {
            id: 1,
            name: '自动饮水机',
            desc: '喝水也是摸鱼的一部分',
            baseCost: 15,
            cps: 0.5,
            icon: '🚰'
        },
        {
            id: 2,
            name: '人体工学椅',
            desc: '坐得舒服才能摸得长久',
            baseCost: 100,
            cps: 4,
            icon: '🪑'
        },
        {
            id: 3,
            name: '降噪耳机',
            desc: '隔绝外界，专注摸鱼',
            baseCost: 500,
            cps: 15,
            icon: '🎧'
        },
        {
            id: 4,
            name: '双屏显示器',
            desc: '一屏工作，一屏摸鱼',
            baseCost: 2000,
            cps: 50,
            icon: '🖥️'
        },
        {
            id: 5,
            name: '机械键盘',
            desc: '打字声掩盖摸鱼声',
            baseCost: 8000,
            cps: 150,
            icon: '⌨️'
        },
        {
            id: 6,
            name: '智能手环',
            desc: '监测摸鱼心率',
            baseCost: 30000,
            cps: 400,
            icon: '⌚'
        },
        {
            id: 7,
            name: 'VR眼镜',
            desc: '沉浸式摸鱼体验',
            baseCost: 100000,
            cps: 1200,
            icon: '🥽'
        },
        {
            id: 8,
            name: 'AI摸鱼助手',
            desc: '让AI替你工作',
            baseCost: 500000,
            cps: 5000,
            icon: '🤖'
        }
    ];

    const ACHIEVEMENTS = [
        { id: 'first_click', name: '初次摸鱼', condition: (s) => s.totalClicks >= 1 },
        { id: 'hundred_clicks', name: '摸鱼达人', condition: (s) => s.totalClicks >= 100 },
        { id: 'first_upgrade', name: '装备升级', condition: (s) => s.itemsBought >= 1 },
        { id: 'rich', name: '小有积蓄', condition: (s) => s.money >= 1000 },
        { id: 'tycoon', name: '摸鱼大亨', condition: (s) => s.money >= 100000 },
        { id: 'legend', name: '摸鱼传说', condition: (s) => s.money >= 1000000 }
    ];

    // ==================== 游戏状态 ====================
    let state = {
        money: 0,
        totalMoney: 0,
        cps: 0,
        totalClicks: 0,
        itemsBought: 0,
        startTime: Date.now(),
        upgrades: {},
        achievements: new Set()
    };

    // 初始化升级状态
    UPGRADES.forEach(u => {
        state.upgrades[u.id] = { count: 0, cost: u.baseCost };
    });

    // ==================== DOM 元素 ====================
    const moneyDisplay = document.getElementById('moneyDisplay');
    const cpsDisplay = document.getElementById('cpsDisplay');
    const totalClicksDisplay = document.getElementById('totalClicks');
    const clickBtn = document.getElementById('clickBtn');
    const clickArea = document.getElementById('clickArea');
    const shopItems = document.getElementById('shopItems');
    const achievementToast = document.getElementById('achievementToast');
    const toastMsg = document.getElementById('toastMsg');

    // ==================== 初始化商店 ====================
    function initShop() {
        shopItems.innerHTML = UPGRADES.map(u => `
            <div class="item" id="item${u.id}">
                <div class="item-info">
                    <div class="item-name">${u.icon} ${u.name}</div>
                    <div class="item-desc">${u.desc}</div>
                    <div class="item-cost">¥ <span id="cost${u.id}">${u.baseCost}</span> (+${u.cps}/秒)</div>
                </div>
                <div style="display:flex;align-items:center;gap:0.8rem;">
                    <span class="item-count">x<span id="count${u.id}">0</span></span>
                    <button class="buy-btn" onclick="buyItem(${u.id})">购买</button>
                </div>
            </div>
        `).join('');
    }

    // ==================== 点击逻辑 ====================
    clickBtn.addEventListener('click', (e) => {
        state.money += 1;
        state.totalMoney += 1;
        state.totalClicks += 1;

        // 浮动数字
        createFloatingNumber(e.clientX, e.clientY, '+1');

        // 粒子爆炸
        createClickParticles(e.clientX, e.clientY);

        // 按钮脉冲
        moneyDisplay.classList.remove('pulse');
        void moneyDisplay.offsetWidth;
        moneyDisplay.classList.add('pulse');

        updateUI();
        checkAchievements();
    });

    // ==================== 浮动数字 ====================
    function createFloatingNumber(x, y, text) {
        const el = document.createElement('div');
        el.className = 'floating-number';
        el.textContent = text;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1000);
    }

    // ==================== 点击粒子 ====================
    function createClickParticles(x, y) {
        const colors = ['#00ff88', '#00bfff', '#ffff00', '#ff00ff', '#00ffff'];
        for (let i = 0; i < 8; i++) {
            const p = document.createElement('div');
            p.className = 'click-particle';
            p.style.background = colors[Math.floor(Math.random() * colors.length)];
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            p.style.boxShadow = `0 0 6px ${p.style.background}`;
            document.body.appendChild(p);

            const angle = (Math.PI * 2 * i) / 8;
            const distance = 30 + Math.random() * 40;
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;

            p.animate([
                { transform: 'translate(0,0) scale(1)', opacity: 1 },
                { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
            ], {
                duration: 500 + Math.random() * 300,
                easing: 'ease-out'
            }).onfinish = () => p.remove();
        }
    }

    // ==================== 购买逻辑 ====================
    function buyItem(id) {
        const upgrade = state.upgrades[id];
        const config = UPGRADES.find(u => u.id === id);

        if (state.money >= upgrade.cost) {
            state.money -= upgrade.cost;
            upgrade.count++;
            state.itemsBought++;

            // 价格递增公式
            upgrade.cost = Math.floor(config.baseCost * Math.pow(1.15, upgrade.count));

            recalculateCPS();
            updateUI();
            checkAchievements();

            // 购买反馈
            const itemEl = document.getElementById(`item${id}`);
            itemEl.style.animation = 'none';
            void itemEl.offsetWidth;
            itemEl.style.animation = 'moneyPulse 0.3s ease';
        }
    }

    // ==================== 计算 CPS ====================
    function recalculateCPS() {
        let total = 0;
        for (let id in state.upgrades) {
            const config = UPGRADES.find(u => u.id == id);
            total += state.upgrades[id].count * config.cps;
        }
        state.cps = parseFloat(total.toFixed(1));
    }

    // ==================== 成就系统 ====================
    function checkAchievements() {
        ACHIEVEMENTS.forEach(ach => {
            if (!state.achievements.has(ach.id) && ach.condition(state)) {
                state.achievements.add(ach.id);
                showAchievement(ach.name);
            }
        });
    }

    function showAchievement(name) {
        toastMsg.textContent = name;
        achievementToast.classList.add('show');
        setTimeout(() => {
            achievementToast.classList.remove('show');
        }, 3000);
    }

    // ==================== 背景粒子 ====================
    function initBackgroundParticles() {
        const container = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (10 + Math.random() * 20) + 's';
            p.style.animationDelay = Math.random() * 20 + 's';
            p.style.background = ['#00ff88', '#00bfff', '#ff00ff'][Math.floor(Math.random() * 3)];
            container.appendChild(p);
        }
    }

    // ==================== 游戏主循环 ====================
    setInterval(() => {
        if (state.cps > 0) {
            const gain = state.cps / 10;
            state.money += gain;
            state.totalMoney += gain;
            updateUI();
        }
    }, 100);

    // ==================== UI 更新 ====================
    function updateUI() {
        moneyDisplay.innerText = `¥ ${formatNumber(Math.floor(state.money))}`;
        cpsDisplay.innerText = state.cps.toFixed(1);
        totalClicksDisplay.innerText = formatNumber(state.totalClicks);

        // 统计面板
        document.getElementById('statTotalMoney').innerText = formatNumber(Math.floor(state.totalMoney));
        document.getElementById('statTotalClicks').innerText = formatNumber(state.totalClicks);
        document.getElementById('statItemsBought').innerText = formatNumber(state.itemsBought);

        // 游戏时长
        const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
        const mins = Math.floor(elapsed / 60);
        const secs = elapsed % 60;
        document.getElementById('statPlayTime').innerText = `${mins}:${secs.toString().padStart(2, '0')}`;

        // 商店状态
        for (let id in state.upgrades) {
            const upgrade = state.upgrades[id];
            const itemDiv = document.getElementById(`item${id}`);
            const costSpan = document.getElementById(`cost${id}`);
            const countSpan = document.getElementById(`count${id}`);

            costSpan.innerText = formatNumber(upgrade.cost);
            countSpan.innerText = upgrade.count;

            if (state.money >= upgrade.cost) {
                itemDiv.classList.add('available');
            } else {
                itemDiv.classList.remove('available');
            }
        }
    }

    // ==================== 数字格式化 ====================
    function formatNumber(n) {
        if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
        if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
        if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
        return n.toString();
    }

    // ==================== 初始化 ====================
    initShop();
    initBackgroundParticles();
    updateUI();

    // 每秒更新时长
    setInterval(updateUI, 1000);
</script>

</body>
</html>
