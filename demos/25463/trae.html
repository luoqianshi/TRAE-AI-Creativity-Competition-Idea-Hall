<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家音</title>
    <style>
        :root {
            --bg: #F5F5F7;
            --card: #FFFFFF;
            --text: #1D1D1F;
            --sub: #86868B;
            --border: #E5E5EA;
            --accent: #E07A5F;
            --blue: #007AFF;
            --green: #34C759;
            --orange: #FF9500;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            padding: 12px;
        }
        .phone {
            width: 100%;
            max-width: 390px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--card);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 12px;
        }
        .logo { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
        .logo span { color: var(--sub); font-weight: 500; font-size: 14px; }
        .avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            background: linear-gradient(135deg, var(--accent), #FF6B6B);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 600; color: white;
        }
        .nav {
            display: flex;
            gap: 10px;
            padding: 0 16px;
            margin-bottom: 12px;
        }
        .nav-btn {
            flex: 1;
            padding: 10px 6px;
            border: none;
            background: var(--bg);
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .nav-btn .icon {
            width: 68px; height: 68px;
            border-radius: 50%;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            font-size: 22px;
            border: 2px solid rgba(255,255,255,0.8);
            flex-shrink: 0;
        }
        .nav-btn .icon img {
            width: 100%; height: 100%; object-fit: contain;
            padding: 8px;
        }
        /* 内联 SVG 头像填充圆形 */
        .nav-btn .icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .nav-btn .label {
            font-size: 11px;
            font-weight: 500;
            color: var(--sub);
        }
        .nav-btn.active .label { color: var(--text); font-weight: 600; }
        .nav-btn.active {
            background: var(--card);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .content { flex: 1; overflow: hidden; padding: 0 16px 16px; }
        .tab-content { display: none; height: 100%; flex-direction: column; gap: 10px; }
        .tab-content.active { display: flex; }
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border);
        }
        .card-row { display: flex; gap: 10px; }
        .card-row .card { flex: 1; text-align: center; padding: 12px 8px; }
        .card-icon {
            width: 44px; height: 44px;
            border-radius: 12px;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 8px;
            font-size: 22px;
        }
        .card-icon img {
            width: 70%; height: 70%; object-fit: contain;
        }
        .card-icon.orange { background: rgba(255, 149, 0, 0.15); }
        .card-icon.blue { background: rgba(0, 122, 255, 0.15); }
        .card-icon.green { background: rgba(52, 199, 89, 0.15); }
        .card-icon.red { background: rgba(255, 69, 58, 0.15); }
        .card-icon.purple { background: rgba(175, 82, 222, 0.15); }
        .card-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
        .card-desc { font-size: 11px; color: var(--sub); }
        .card-tag {
            display: inline-block;
            margin-top: 6px;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 500;
        }
        .card-tag.orange { background: rgba(255, 149, 0, 0.12); color: var(--orange); }
        .card-tag.blue { background: rgba(0, 122, 255, 0.12); color: var(--blue); }
        .card-tag.green { background: rgba(52, 199, 89, 0.12); color: var(--green); }
        .card-tag.red { background: rgba(255, 69, 58, 0.12); color: #FF3B30; }
        .card-tag.accent { background: var(--accent); color: white; }
        .stats {
            display: flex;
            justify-content: space-around;
            padding: 12px;
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--border);
        }
        .stat { text-align: center; }
        .stat-val { font-size: 18px; font-weight: 700; }
        .stat-label { font-size: 10px; color: var(--sub); margin-top: 2px; }
        .footer {
            padding: 12px 16px;
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary { 
            background: linear-gradient(135deg, rgba(52, 199, 89, 0.15), rgba(52, 199, 89, 0.12));
            color: var(--text);
            box-shadow: 0 2px 8px rgba(52, 199, 89, 0.15);
            border: 1px solid rgba(52, 199, 89, 0.2);
        }
        .btn-secondary { 
            background: var(--bg);
            color: var(--text);
        }
    </style>
</head>
