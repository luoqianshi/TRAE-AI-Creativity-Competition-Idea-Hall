// ==================== Icons ====================
const Icon = ({ name, size = 20, className = '' }) => {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current) {
      ref.current.innerHTML = '';
      const i = document.createElement('i');
      i.setAttribute('data-lucide', name);
      i.setAttribute('width', size);
      i.setAttribute('height', size);
      ref.current.appendChild(i);
      if (lucide.createIcons) {
        lucide.createIcons({ nodes: [i] });
      }
    }
  }, [name, size]);
  return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} />;
};

            <Card><p className="text-slate-500 text-sm">预测离职人数</p><p className="text-3xl font-bold text-dark mt-1">12</p><p className="text-xs text-rose-500 mt-1">较上月+3人</p></Card>
            <Card><p className="text-slate-500 text-sm">预测准确率</p><p className="text-3xl font-bold text-dark mt-1">89%</p><p className="text-xs text-emerald-600 mt-1">较上月+2%</p></Card>
            <Card><p className="text-slate-500 text-sm">已成功干预数</p><p className="text-3xl font-bold text-dark mt-1">8</p><p className="text-xs text-primary mt-1">干预成功率67%</p></Card>
          </div>
          <Card>
            <h3 className="font-bold text-dark mb-4 flex items-center gap-2"><Icon name="AlertTriangle" size={18} className="text-amber-500" />高风险员工列表</h3>
            <div className="space-y-3">
              {highRiskEmployees.map((emp, i) => {
                const rc = getRiskColor(emp.score);
                return (
                  <div key={i} className="rounded-lg border border-slate-100 bg-slate-50/50 p-4">
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-3">
                        <div className="w-9 h-9 rounded-full bg-slate-200 flex items-center justify-center text-sm font-bold text-slate-600">{emp.name.charAt(0)}</div>
                        <div><span className="font-semibold text-dark">{emp.name}</span><span className="text-xs text-slate-500 ml-2">{emp.dept} / {emp.position}</span></div>
                      </div>
                      <div className="flex items-center gap-2">
                        <div className="w-24 bg-slate-200 rounded-full h-2"><div className={`${rc.bar} h-2 rounded-full`} style={{ width: `${emp.score}%` }}></div></div>
                        <span className={`text-sm font-bold ${rc.text}`}>{emp.score}</span>
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      {emp.factors.map((f, fi) => (<span key={fi} className="text-xs px-2 py-1 rounded-md bg-white border border-slate-200 text-slate-700">{f}</span>))}
                      <button className="ml-auto text-xs px-3 py-1.5 bg-primary text-white rounded-lg hover:bg-sky-700">详情</button>
                    </div>
                  </div>
                );
              })}
            </div>
          </Card>
        </div>
      )}

      {activeTab === 'roi' && (
        <div className="space-y-5">
          <InsightBanner text="AI归因分析：门店扩张和排班优化是主要正向驱动力，新人占比高和离职波动是主要拖累因素，人效ROI净增2.6%。" />
          <Card>
            <h3 className="font-bold text-dark mb-4 flex items-center gap-2"><Icon name="BarChart3" size={18} className="text-primary" />人效ROI归因瀑布图</h3>
            <div className="flex items-end gap-3 h-40 px-4">
              <div className="flex-1 flex flex-col items-center gap-1">
                <span className="text-xs font-semibold text-slate-700">3.12</span>
                <div className="w-full bg-primary rounded-t" style={{height:'85%'}}></div>
                <span className="text-xs text-slate-500">基期</span>
              </div>
              {roiFactors.map((f, i) => (
                <div key={i} className="flex-1 flex flex-col items-center gap-1">
                  <span className={`text-xs font-semibold ${f.positive?'text-emerald-600':'text-rose-600'}`}>{f.positive?'+':''}{f.value}%</span>
                  <div className={`w-full rounded-t ${f.positive?'bg-emerald-500':'bg-rose-500'} opacity-85`} style={{height:`${Math.abs(f.value)*12}%`}}></div>
                  <span className="text-xs text-slate-500">{f.name}</span>
                </div>
              ))}
              <div className="flex-1 flex flex-col items-center gap-1">
                <span className="text-xs font-semibold text-slate-700">3.20</span>
                <div className="w-full bg-primary rounded-t" style={{height:'90%'}}></div>
                <span className="text-xs text-slate-500">期末</span>
              </div>
            </div>
          </Card>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            {regionRoi.map((r, i) => (
              <Card key={i}>
                <div className="flex items-center justify-between mb-2"><span className="font-semibold text-dark">{r.region}</span><Icon name="DollarSign" size={16} className="text-slate-400" /></div>
                <p className="text-2xl font-bold text-dark">{r.roi}</p>
                <p className={`text-xs mt-1 ${r.positive?'text-emerald-600':'text-rose-600'}`}>环比 {r.change}</p>
                <p className="text-xs text-slate-500 mt-1">{r.driver}</p>
              </Card>
            ))}
          </div>
        </div>
      )}

      {activeTab === 'network' && (
        <div className="space-y-5">
          <InsightBanner text="AI发现技术部张伟和产品部陈晨为桥梁人物，建议在跨部门项目中发挥其纽带作用。法务部协作密度偏低需关注。" />
          <Card>
            <h3 className="font-bold text-dark mb-4 flex items-center gap-2"><Icon name="Network" size={18} className="text-primary" />组织协作网络图</h3>
            <div className="relative flex items-center justify-center py-8" style={{minHeight:'200px'}}>
              <div className="absolute w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center"><div className="w-14 h-14 bg-primary rounded-full flex items-center justify-center text-white text-xs font-bold">组织中心</div></div>
              {['技术部','市场部','运营部','产品部','销售部'].map((dept,i)=>{
                const colors = ['border-sky-500','border-emerald-500','border-violet-500','border-amber-500','border-rose-500'];
                const bgs = ['bg-sky-50','bg-emerald-50','bg-violet-50','bg-amber-50','bg-rose-50'];
                const angles = [-60,-20,30,160,220];
                const rad = angles[i]*Math.PI/180;
                const x = 120*Math.cos(rad);
                const y = 80*Math.sin(rad);
                return <div key={i} className={`absolute w-16 h-16 ${bgs[i]} ${colors[i]} border-2 rounded-full flex items-center justify-center text-[10px] font-semibold text-dark`} style={{transform:`translate(${x}px, ${y}px)`}}>{dept}</div>;
              })}
            </div>
          </Card>
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            {networkHealth.map((item, i) => (
              <Card key={i}><p className="text-sm font-medium text-dark">{item.label}</p><p className="text-xl font-bold text-primary mt-1">{item.value}</p></Card>
            ))}
          </div>
        </div>
      )}

      {activeTab === 'trend' && (
        <div className="space-y-5">
          <InsightBanner text="AI预测未来3个月关键指标整体向好：人效指数持续攀升，流失率有望回落至7%以下，招聘周期将进一步缩短。" />
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            {predictionCards.map((item, i) => (
              <Card key={i}>
                <div className="flex items-center justify-between mb-2">
                  <p className="text-slate-500 text-sm">{item.label}</p>
                  <div className={`w-8 h-8 rounded-lg flex items-center justify-center ${item.trend === 'up' ? 'bg-emerald-50' : 'bg-sky-50'}`}>
                    <Icon name={item.trend === 'up' ? 'TrendingUp' : 'TrendingDown'} size={16} className={item.trend === 'up' ? 'text-emerald-500' : 'text-sky-500'} />
                  </div>
                </div>
                <div className="flex items-end gap-3">
                  <div><p className="text-xs text-slate-400">当前</p><p className="text-xl font-bold text-dark">{item.current}</p></div>
                  <div className="text-slate-300 mb-1"><Icon name="ArrowRight" size={16} /></div>
                  <div><p className="text-xs text-slate-400">3月后</p><p className="text-xl font-bold text-primary">{item.predicted}</p></div>
                </div>
                <p className="text-xs text-slate-400 mt-2">置信度：{item.confidence}</p>
              </Card>
            ))}
          </div>
          <Card>
            <h3 className="font-bold text-dark mb-4">未来3个月关键指标预测</h3>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead className="bg-slate-50 text-slate-500"><tr>
                  <th className="text-left py-3 px-4 font-medium">指标</th>
                  <th className="text-center py-3 px-4 font-medium">本月实际</th>
                  <th className="text-center py-3 px-4 font-medium">下月预测</th>
                  <th className="text-center py-3 px-4 font-medium">下下月</th>
                  <th className="text-center py-3 px-4 font-medium">3个月后</th>
                  <th className="text-center py-3 px-4 font-medium">置信度</th>
                </tr></thead>
                <tbody className="divide-y divide-slate-100">
                  {trendTable.map((row, i) => (
                    <tr key={i} className="hover:bg-slate-50">
                      <td className="py-3 px-4 font-medium text-dark">{row.metric}</td>
                      <td className="py-3 px-4 text-center text-slate-700 font-semibold">{row.current}</td>
                      <td className="py-3 px-4 text-center text-primary">{row.m1}</td>
                      <td className="py-3 px-4 text-center text-primary">{row.m2}</td>
                      <td className="py-3 px-4 text-center text-primary font-semibold">{row.m3}</td>
                      <td className="py-3 px-4 text-center"><Badge color="secondary">{row.confidence}</Badge></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Card>
        </div>
      )}
    </div>
  );
};



// ==================== AI Chat Widget ====================
const AIChatWidget = () => {
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState([
    { role: 'ai', text: '您好！我是HR智能体，覆盖人才甄选、组织发展、用工管理、知识资产、决策洞察全链路。试试下方的快捷指令，或直接描述您的需求。' }
  ]);
  const [input, setInput] = useState('');
  const [typing, setTyping] = useState(false);
  const bottomRef = useRef(null);

  const quickCommands = [
    { text: '分析西南区离职原因', icon: 'Brain' },
    { text: '生成督导岗JD', icon: 'FileText' },
    { text: '本周合规预警', icon: 'Shield' },
    { text: '人效ROI归因', icon: 'TrendingUp' },
    { text: '人才盘点概览', icon: 'Users' },
    { text: '下周排班建议', icon: 'CalendarClock' },
  ];

  const send = (text) => {
    if (!text.trim()) return;
    setMessages(prev => [...prev, { role: 'user', text }]);
    setInput('');
    setTyping(true);
    setTimeout(() => {
      setTyping(false);
      let reply = '已为您检索相关数据并生成分析。如需深入了解某个维度，请继续提问。';
      if (text.includes('排班')) reply = '已基于近4周客流数据和员工技能矩阵生成下周排班建议：\n\n• 周六（促销日）建议增配2人，覆盖高峰时段14:00-22:00\n• 周三客流量低谷，可减配1人\n• 注意：张伟连续出勤11天，建议强制安排休息\n\n预计用工效率提升8%，用工成本节省约¥3,200。是否确认应用？';
      else if (text.includes('人效') && text.includes('ROI')) reply = '本季度人效ROI为3.65，环比提升12%。核心驱动因素：\n\n1. 门店扩张贡献 +2.1%（新店爬坡完成）\n2. AI排班优化贡献 +1.5%（工时利用率提升）\n3. AI工具引入贡献 +0.8%（流程自动化）\n\n拖累因素：新人占比高 -1.2%、离职波动 -0.6%。建议加快新人培训和梯队建设。';
      else if (text.includes('离职') && text.includes('西南')) reply = '西南区月离职率6.3%（全公司最高），AI离职预测模型识别出3名高风险员工：\n\n1. 周杰（重庆店·店员）风险分92 —— 近30天考勤异常5次，绩效从B降至C\n2. 李萌（成都店·副店长）风险分78 —— 跳槽意向关键词出现在内部沟通中\n3. 陈浩（重庆店·技师）风险分71 —— 入职仅2月，融入度低\n\n建议：周杰启动1对1留任面谈，李萌评估晋升可能，陈浩安排导师加速融入。';
      else if (text.includes('JD') || text.includes('岗位')) reply = '已基于门店督导岗位画像和当前业务需求，生成督导岗JD：\n\n岗位：区域督导 | 所属部门：运营部\n汇报对象：区域经理 | 管理范围：5-8家门店\n\n核心职责：\n1. 门店运营标准化执行与巡检（月度全覆盖）\n2. 门店KPI跟踪与改善辅导\n3. 新店开业筹备与带店支持\n4. 门店团队能力评估与发展建议\n\n要求：3年以上连锁门店管理经验，熟悉电竞/餐饮行业优先。已自动同步至人才画像中心。';
      else if (text.includes('合规')) reply = '本周合规预警共12项，其中严重3项：\n\n🔴 张三（北京店）连续工作12天，超法定上限\n🔴 李四（上海店）月加班48h，超36h上限\n🔴 王五（广州店）未安排年假，已累计12天\n\n建议立即处理红色预警，系统已自动发送提醒至对应区域经理。点击"用工管理 > 合规预警"查看详情。';
      else if (text.includes('人才盘点') || text.includes('九宫格')) reply = '本期人才盘点覆盖186人，关键发现：\n\n⭐ 明星员工2人：张伟（技术）、马龙（销售）—— 建议启动接班人计划\n🎯 高潜人才1人：林晓薇（HRBP）—— 建议纳入跨部门轮岗\n⚡ 中坚力量3人：孙涛、郑欣、黄丽 —— 建议项目历练激活\n⚠️ 待提升1人：吴磊（销售）—— 连续2季度C，建议启动PIP\n\n人才梯队完善度65分（偏低），关键岗位继任者不足是最大风险。';
      else if (text.includes('待办')) reply = `您当前有 ${todoItems.length} 项待办：\n\n1. 🔴 审批刘芳的转正申请（今天截止）\n2. 🟡 安排何军的入职培训\n3. 🟡 为陈志强生成结构化面试表\n4. 🟢 更新员工手册2024版\n5. 🟢 处理吴磊的离职交接\n6. 🟡 林晓薇 offer 审批催办`;
      else if (text.includes('招聘') || text.includes('甄选')) reply = '人才甄选进展：\n\n• 简历猎取：8份公开简历待筛选\n• 人才画像：2个岗位JD待优化\n• 面试提纲：2份已生成，1份待生成\n• 简历入库：3人已入库，AI匹配度最高孙雅婷95分\n• 入职确认：5人待入职，2份Offer待审批\n\n建议优先处理林晓薇的Offer审批，候选人已等待3天。';
      else if (text.includes('制度') || text.includes('合规审查')) reply = '制度合规审查结果：\n\n• 合规制度 18 项\n• 待更新 4 项（加班管理制度、年假规定、竞业协议模板、社保缴纳细则）\n• 已过期 2 项（工伤处理流程、病假工资标准）\n\nAI已标注具体法规变更点，点击"知识资产 > 制度合规审查"查看详情并一键更新。';
      setMessages(prev => [...prev, { role: 'ai', text: reply }]);
    }, 1200);
  };

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages, typing]);

  return (
    <>
      <button
        onClick={() => setOpen(!open)}
        className="fixed bottom-6 right-6 w-14 h-14 bg-primary hover:bg-sky-700 text-white rounded-full shadow-lg flex items-center justify-center transition-all z-50"
      >
        <Icon name={open ? 'X' : 'MessageCircle'} size={24} />
      </button>

      {open && (
        <div className="fixed bottom-24 right-6 w-96 h-[28rem] bg-white rounded-2xl shadow-2xl border border-slate-100 flex flex-col z-50 overflow-hidden">
          <div className="bg-primary text-white px-5 py-4 flex items-center gap-3">
            <div className="w-9 h-9 bg-white/20 rounded-full flex items-center justify-center">
              <Icon name="Bot" size={20} className="text-white" />
            </div>
            <div>
              <h4 className="font-semibold text-sm">HR智能体</h4>
              <p className="text-xs text-sky-100">全链路AI · 跨模块联动</p>
            </div>
          </div>

          <div className="flex-1 overflow-y-auto p-4 space-y-3">
            {messages.map((m, i) => (
              <div key={i} className={`flex gap-2 ${m.role === 'user' ? 'flex-row-reverse' : ''}`}>
                <div className={`w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0 ${m.role === 'ai' ? 'bg-primary text-white' : 'bg-slate-200'}`}>
                  <Icon name={m.role === 'ai' ? 'Bot' : 'User'} size={14} />
                </div>
                <div className={`max-w-[80%] px-3 py-2 rounded-xl text-xs leading-relaxed ${m.role === 'ai' ? 'bg-slate-100 text-slate-800 rounded-tl-sm whitespace-pre-line' : 'bg-primary text-white rounded-tr-sm'}`}>
                  {m.text}
                </div>
              </div>
            ))}
            {typing && (
              <div className="flex gap-2">
                <div className="w-7 h-7 rounded-full bg-primary flex items-center justify-center">
                  <Icon name="Bot" size={14} className="text-white" />
                </div>
                <div className="bg-slate-100 px-3 py-2 rounded-xl rounded-tl-sm flex items-center gap-1">
                  <div className="w-1.5 h-1.5 bg-slate-400 rounded-full typing-dot"></div>
                  <div className="w-1.5 h-1.5 bg-slate-400 rounded-full typing-dot"></div>
                  <div className="w-1.5 h-1.5 bg-slate-400 rounded-full typing-dot"></div>
                </div>
              </div>
            )}
            <div ref={bottomRef}></div>
          </div>

          <div className="p-3 border-t border-slate-100">
            <div className="flex gap-2 mb-2 overflow-x-auto scrollbar-hide">
              {quickCommands.map((cmd, i) => (
                <button key={i} onClick={() => send(cmd.text)} className="flex items-center gap-1 px-3 py-1.5 bg-sky-50 text-primary text-xs rounded-full hover:bg-sky-100 whitespace-nowrap flex-shrink-0">
                  <Icon name={cmd.icon} size={12} />
                  {cmd.text}
                </button>
              ))}
            </div>
            <div className="flex gap-2">
              <input
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && send(input)}
                placeholder="输入指令..."
                className="flex-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-primary"
              />
              <button onClick={() => send(input)} className="px-3 py-2 bg-primary text-white rounded-lg hover:bg-sky-700">
                <Icon name="Send" size={14} />
              </button>
            </div>
          </div>
        </div>
      )}
    </>
  );
};

// ==================== Main App ====================
const App = () => {
  const [isLoggedIn, setIsLoggedIn] = useState(false);
  const [role, setRole] = useState('hr');
  const [currentPage, setCurrentPage] = useState('dashboard');
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

  const handleLogin = (r) => {
    setRole(r);
    setIsLoggedIn(true);
    setCurrentPage('dashboard');
  };

  const handleLogout = () => {
    setIsLoggedIn(false);
    setRole('hr');
    setCurrentPage('dashboard');
  };

  const renderPage = () => {
    if (currentPage === 'dashboard') return <HRDashboard />;
    if (currentPage === 'org') return <OrgPage />;
    if (currentPage === 'recruit') return <RecruitPage />;
    if (currentPage === 'schedule') return <SchedulePage />;
    if (currentPage === 'knowledge') return <KnowledgePage />;
    if (currentPage === 'analytics') return <AnalyticsPage />;
    return <HRDashboard />;
  };

  useEffect(() => {
    lucide.createIcons();
  }, [currentPage, isLoggedIn]);

  if (!isLoggedIn) {
    return <LoginPage onLogin={handleLogin} />;
  }

  return (
    <div className="flex h-screen bg-slate-50">
      <Sidebar
        currentPage={currentPage}
        setPage={setCurrentPage}
        collapsed={sidebarCollapsed}
        setCollapsed={setSidebarCollapsed}
      />
      <div className="flex-1 flex flex-col overflow-hidden">
        <TopBar onLogout={handleLogout} />
        <main className="flex-1 overflow-y-auto p-6">
          {renderPage()}
        </main>
      </div>
      <AIChatWidget />
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
