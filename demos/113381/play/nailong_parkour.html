<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豆豆龙跑酷 - DouDou Dragon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(180deg, #87CEEB 0%, #98FB98 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            overflow: hidden;
        }

        #gameCanvas {
            border: 4px solid #FF6B6B;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            background: linear-gradient(180deg, #87CEEB 0%, #98FB98 60%, #8BC34A 100%);
        }

        .game-info {
            display: flex;
            gap: 60px;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .score, .high-score {
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 25px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .controls {
            margin-top: 20px;
            text-align: center;
            color: #666;
            font-size: 16px;
        }

        .controls p {
            margin: 5px 0;
        }

        .start-screen, .game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 80px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            z-index: 100;
        }

        .start-screen h1, .game-over-screen h1 {
            font-size: 48px;
            color: #FF6B6B;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #FFE66D;
        }

        .start-screen p, .game-over-screen p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        .game-over-screen .final-score {
            font-size: 36px;
            color: #4CAF50;
            margin: 20px 0;
        }

        .btn {
            padding: 15px 45px;
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(255, 107, 107, 0.6);
        }

        .hidden {
            display: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .float-animation {
            animation: float 2s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="game-info">
        <div class="score">分数: <span id="score">0</span></div>
        <div class="high-score">最高分: <span id="highScore">0</span></div>
    </div>

    <canvas id="gameCanvas" width="1000" height="500"></canvas>

    <div class="controls">
        <p>⬆️ W键/空格键/上箭头：跳跃（支持二段跳）</p>
        <p>⬇️ S键/下箭头：空中加速下降 / 地面下蹲滑行</p>
    </div>

    <div class="start-screen" id="startScreen">
        <h1 class="float-animation">🐲 豆豆龙跑酷</h1>
        <p>帮助豆豆龙躲避障碍物，收集更多鸡腿！</p>
        <button class="btn" onclick="startGame()">开始游戏</button>
    </div>

    <div class="game-over-screen hidden" id="gameOverScreen">
        <h1>😢 游戏结束</h1>
        <p>豆豆龙撞到障碍物了！</p>
        <div class="final-score">最终分数: <span id="finalScore">0</span></div>
        <button class="btn" onclick="restartGame()">再来一次</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreElement = document.getElementById('finalScore');

        let gameRunning = false;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('nailong_highscore')) || 0;
        let gameSpeed = 2;
        let frameCount = 0;

        highScoreElement.textContent = highScore;

        const groundY = canvas.height - 100;
        const groundHeight = 100;

        const player = {
            x: 150,
            y: groundY - 80,
            width: 60,
            height: 80,
            velocityY: 0,
            jumpCount: 0,
            maxJumps: 2,
            isGrounded: true,
            isSliding: false,
            slideTimer: 0,
            direction: 1
        };

        let obstacles = [];
        let coins = [];
        let clouds = [];
        let particles = [];

        function drawNailong(x, y, width, height, isSliding) {
            const drawHeight = isSliding ? height * 0.6 : height;
            const drawY = isSliding ? y + (height - drawHeight) : y;

            ctx.save();
            
            ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 5;
            ctx.shadowOffsetY = 5;

            ctx.fillStyle = '#FFD93D';
            ctx.beginPath();
            ctx.ellipse(x + width * 0.5, drawY + drawHeight * 0.55, width * 0.38, drawHeight * 0.35, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#FFE66D';
            ctx.beginPath();
            const headRadius = width * 0.48;
            ctx.arc(x + width * 0.5, drawY + headRadius * 0.9, headRadius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#FFD93D';
            ctx.beginPath();
            ctx.ellipse(x + width * 0.33, drawY + headRadius * 0.15, 6, 10, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x + width * 0.67, drawY + headRadius * 0.15, 6, 10, 0.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.ellipse(x + width * 0.25, drawY + headRadius * 0.75, 12, 10, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x + width * 0.75, drawY + headRadius * 0.75, 12, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#222222';
            ctx.beginPath();
            ctx.arc(x + width * 0.26, drawY + headRadius * 0.75, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + width * 0.76, drawY + headRadius * 0.75, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(x + width * 0.24, drawY + headRadius * 0.72, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + width * 0.74, drawY + headRadius * 0.72, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.moveTo(x + width * 0.38, drawY + headRadius * 1.05);
            ctx.quadraticCurveTo(x + width * 0.5, drawY + headRadius * 1.15, x + width * 0.62, drawY + headRadius * 1.05);
            ctx.lineTo(x + width * 0.6, drawY + headRadius * 0.98);
            ctx.quadraticCurveTo(x + width * 0.5, drawY + headRadius * 1.08, x + width * 0.4, drawY + headRadius * 0.98);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#222222';
            ctx.beginPath();
            ctx.moveTo(x + width * 0.42, drawY + headRadius * 1.02);
            ctx.quadraticCurveTo(x + width * 0.5, drawY + headRadius * 1.08, x + width * 0.58, drawY + headRadius * 1.02);
            ctx.fill();

            ctx.fillStyle = '#FFE0B2';
            ctx.beginPath();
            ctx.ellipse(x + width * 0.5, drawY + drawHeight * 0.72, width * 0.22, drawHeight * 0.2, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#FFD93D';
            ctx.beginPath();
            ctx.ellipse(x + width * 0.18, drawY + drawHeight * 0.52, 8, 10, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x + width * 0.82, drawY + drawHeight * 0.52, 8, 10, 0.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#FF9F43';
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.arc(x + width * 0.15 + i * 3, drawY + drawHeight * 0.45, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + width * 0.85 - i * 3, drawY + drawHeight * 0.45, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = '#FFD93D';
            ctx.beginPath();
            ctx.ellipse(x + width * 0.28, drawY + drawHeight * 0.92, 10, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x + width * 0.72, drawY + drawHeight * 0.92, 10, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawGround() {
            const gradient = ctx.createLinearGradient(0, groundY, 0, canvas.height);
            gradient.addColorStop(0, '#8BC34A');
            gradient.addColorStop(1, '#689F38');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, groundY, canvas.width, groundHeight);

            ctx.fillStyle = '#558B2F';
            for (let i = 0; i < canvas.width; i += 30) {
                const x = (i - frameCount * gameSpeed * 0.5) % canvas.width;
                ctx.fillRect(x, groundY, 15, 5);
            }

            ctx.fillStyle = '#7CB342';
            for (let i = 0; i < canvas.width; i += 60) {
                const x = (i - frameCount * gameSpeed * 0.3) % canvas.width;
                ctx.beginPath();
                ctx.moveTo(x, groundY);
                ctx.lineTo(x + 5, groundY - 15);
                ctx.lineTo(x + 10, groundY);
                ctx.fill();
            }
        }

        function drawClouds() {
            if (clouds.length < 5) {
                clouds.push({
                    x: canvas.width + Math.random() * 200,
                    y: 50 + Math.random() * 100,
                    size: 30 + Math.random() * 20,
                    speed: 0.5 + Math.random() * 0.5
                });
            }

            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            clouds.forEach(cloud => {
                cloud.x -= cloud.speed;
                if (cloud.x < -100) {
                    cloud.x = canvas.width + 100;
                    cloud.y = 50 + Math.random() * 100;
                }
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.6, cloud.y - cloud.size * 0.2, cloud.size * 0.8, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 1.2, cloud.y, cloud.size * 0.7, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function spawnObstacle() {
            const type = Math.random();
            let obstacle = {
                x: canvas.width + 50,
                type: 'spike'
            };

            if (type < 0.33) {
                obstacle.type = 'spike';
                obstacle.width = 40;
                obstacle.height = 50;
                obstacle.y = groundY - obstacle.height;
            } else if (type < 0.66) {
                obstacle.type = 'wall';
                obstacle.width = 60;
                obstacle.height = 70;
                obstacle.y = groundY - obstacle.height;
            } else {
                obstacle.type = 'hanging';
                obstacle.width = 60;
                obstacle.height = 80;
                obstacle.y = groundY - obstacle.height - 120;
            }

            obstacles.push(obstacle);
        }

        function drawObstacle(obstacle) {
            ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetX = 3;
            ctx.shadowOffsetY = 3;

            ctx.save();
            ctx.translate(obstacle.x + obstacle.width / 2, obstacle.y + obstacle.height / 2);

            ctx.fillStyle = '#2E7D32';
            ctx.beginPath();
            if (obstacle.type === 'spike') {
                ctx.moveTo(0, -obstacle.height / 2);
                ctx.quadraticCurveTo(-obstacle.width / 2, -obstacle.height / 4, -obstacle.width / 3, obstacle.height / 2);
                ctx.quadraticCurveTo(0, obstacle.height / 3, obstacle.width / 3, obstacle.height / 2);
                ctx.quadraticCurveTo(obstacle.width / 2, -obstacle.height / 4, 0, -obstacle.height / 2);
            } else if (obstacle.type === 'wall') {
                ctx.moveTo(-obstacle.width / 2, -obstacle.height / 2);
                ctx.quadraticCurveTo(-obstacle.width / 2, 0, -obstacle.width / 3, obstacle.height / 2);
                ctx.quadraticCurveTo(0, obstacle.height / 2, obstacle.width / 3, obstacle.height / 2);
                ctx.quadraticCurveTo(obstacle.width / 2, 0, obstacle.width / 2, -obstacle.height / 2);
            } else if (obstacle.type === 'hanging') {
                ctx.moveTo(-obstacle.width / 2, -obstacle.height / 2);
                ctx.quadraticCurveTo(-obstacle.width / 2, 0, -obstacle.width / 3, obstacle.height / 2);
                ctx.quadraticCurveTo(0, obstacle.height / 3, obstacle.width / 3, obstacle.height / 2);
                ctx.quadraticCurveTo(obstacle.width / 2, 0, obstacle.width / 2, -obstacle.height / 2);
            }
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#1B5E20';
            ctx.beginPath();
            ctx.moveTo(-obstacle.width / 4, -obstacle.height / 2 + 5);
            ctx.quadraticCurveTo(0, -obstacle.height / 3, obstacle.width / 4, -obstacle.height / 2 + 5);
            ctx.strokeStyle = '#1B5E20';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#388E3C';
            for (let i = -2; i <= 2; i++) {
                ctx.beginPath();
                ctx.moveTo(i * (obstacle.width / 6), -obstacle.height / 3);
                ctx.quadraticCurveTo(i * (obstacle.width / 6) + 3, 0, i * (obstacle.width / 6), obstacle.height / 3);
                ctx.fill();
            }

            if (obstacle.type === 'hanging') {
                ctx.fillStyle = '#5D4037';
                ctx.fillRect(-3, -obstacle.height / 2 - 10, 6, 15);
            }

            ctx.restore();

            ctx.shadowColor = 'transparent';
        }

        function spawnCoin() {
            const lastObstacle = obstacles[obstacles.length - 1];
            const lastCoin = coins[coins.length - 1];
            
            let minX = canvas.width + 50;
            if (lastObstacle) {
                minX = Math.max(minX, lastObstacle.x + 300);
            }
            if (lastCoin) {
                minX = Math.max(minX, lastCoin.x + 200);
            }

            coins.push({
                x: minX,
                y: groundY - 100 - Math.random() * 100,
                width: 40,
                height: 40,
                rotation: 0
            });
        }

        function drawCoin(coin) {
            ctx.save();
            ctx.translate(coin.x + coin.width / 2, coin.y + coin.height / 2);
            ctx.rotate(coin.rotation);

            ctx.shadowColor = 'rgba(255, 165, 0, 0.5)';
            ctx.shadowBlur = 10;

            ctx.fillStyle = '#F4A460';
            ctx.beginPath();
            ctx.moveTo(-10, 0);
            ctx.quadraticCurveTo(-12, -15, -5, -20);
            ctx.quadraticCurveTo(0, -22, 5, -20);
            ctx.quadraticCurveTo(12, -15, 10, 0);
            ctx.quadraticCurveTo(8, 15, 0, 18);
            ctx.quadraticCurveTo(-8, 15, -10, 0);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.moveTo(-5, -18);
            ctx.lineTo(0, -28);
            ctx.lineTo(5, -18);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#DEB887';
            ctx.beginPath();
            ctx.ellipse(-3, -5, 6, 8, -0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(3, -5, 6, 8, 0.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1,
                    color: color
                });
            }
        }

        function updateParticles() {
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                p.vy += 0.2;
            });
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function checkCollision(obj1, obj2) {
            const padding = 5;
            return obj1.x + padding < obj2.x + obj2.width - padding &&
                   obj1.x + obj1.width - padding > obj2.x + padding &&
                   obj1.y + padding < obj2.y + obj2.height - padding &&
                   obj1.y + obj1.height - padding > obj2.y + padding;
        }

        function updatePlayer() {
            const gravity = 0.02;
            const jumpForce = -2.4;

            player.velocityY += gravity;
            player.y += player.velocityY;

            const groundLevel = groundY - player.height;
            if (player.y >= groundLevel) {
                player.y = groundLevel;
                player.velocityY = 0;
                player.jumpCount = 0;
                player.isGrounded = true;
            }

            if (player.isSliding) {
                player.slideTimer--;
                if (player.slideTimer <= 0) {
                    player.isSliding = false;
                }
            }
        }

        function updateObstacles() {
            obstacles = obstacles.filter(o => o.x > -100);
            obstacles.forEach(o => {
                o.x -= gameSpeed;
            });
        }

        function updateCoins() {
            coins = coins.filter(c => c.x > -100);
            coins.forEach(c => {
                c.x -= gameSpeed;
                c.rotation += 0.1;
            });
        }

        function checkCollisions() {
            const playerRect = {
                x: player.x,
                y: player.isSliding ? player.y + player.height * 0.4 : player.y,
                width: player.width,
                height: player.isSliding ? player.height * 0.6 : player.height
            };

            for (const obstacle of obstacles) {
                if (checkCollision(playerRect, obstacle)) {
                    gameOver();
                    return;
                }
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                if (checkCollision(playerRect, coin)) {
                    score += 10;
                    scoreElement.textContent = score;
                    createParticles(coin.x + coin.width / 2, coin.y + coin.height / 2, '#FFD700');
                    coins.splice(i, 1);
                }
            }
        }

        function gameLoop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawClouds();
            drawGround();
            drawNailong(player.x, player.y, player.width, player.height, player.isSliding);

            frameCount++;

            if (frameCount % Math.max(240 - Math.floor(score / 100), 80) === 0) {
                spawnObstacle();
            }

            if (frameCount % Math.max(160 - Math.floor(score / 150), 60) === 0) {
                spawnCoin();
            }

            updatePlayer();
            updateObstacles();
            updateCoins();
            checkCollisions();

            obstacles.forEach(drawObstacle);
            coins.forEach(drawCoin);

            updateParticles();
            drawParticles();

            gameSpeed = Math.min(2 + Math.floor(score / 500), 5);

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            gameRunning = true;
            score = 0;
            scoreElement.textContent = score;
            gameSpeed = 2;
            frameCount = 0;
            player.y = groundY - player.height;
            player.velocityY = 0;
            player.jumpCount = 0;
            player.isSliding = false;
            obstacles = [];
            coins = [];
            particles = [];
            clouds = [];
            gameLoop();
        }

        function gameOver() {
            gameRunning = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('nailong_highscore', highScore);
                highScoreElement.textContent = highScore;
            }
            finalScoreElement.textContent = score;
            gameOverScreen.classList.remove('hidden');
        }

        function restartGame() {
            startGame();
        }

        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;

            if ((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && player.jumpCount < player.maxJumps) {
                e.preventDefault();
                player.velocityY = -2.4;
                player.jumpCount++;
                player.isGrounded = false;
                player.isSliding = false;
            }

            if (e.code === 'ArrowDown' || e.code === 'KeyS') {
                if (player.isGrounded) {
                    player.isSliding = true;
                    player.slideTimer = 60;
                } else {
                    player.velocityY += 1.5;
                }
            }
        });

        document.addEventListener('touchstart', (e) => {
            if (!gameRunning) return;
            
            const touchY = e.touches[0].clientY;
            const screenHeight = window.innerHeight;
            
            if (touchY < screenHeight / 2) {
                if (player.jumpCount < player.maxJumps) {
                    player.velocityY = -2.4;
                    player.jumpCount++;
                    player.isGrounded = false;
                    player.isSliding = false;
                }
            } else {
                if (player.isGrounded) {
                    player.isSliding = true;
                    player.slideTimer = 60;
                }
            }
        });
    </script>
</body>
</html>
