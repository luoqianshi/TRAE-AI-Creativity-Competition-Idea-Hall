<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>体彩助手 - 投注追踪与盈亏分析</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
:root{
  --bg-primary:#fff;--bg-secondary:#f8f8fa;--bg-tertiary:#f0f0f3;--bg-card:#fff;--bg-hover:#eeeef2;
  --text-primary:#1a1a2e;--text-secondary:#525266;--text-tertiary:#9090a5;
  --accent:#c2410c;--accent-hover:#9a3412;--accent-dim:rgba(194,65,12,0.07);
  --win:#16a34a;--loss:#dc2626;--pending:#3b82f6;
  --border:#e8e8ed;--radius:12px;--radius-sm:8px;--radius-lg:16px;
  --shadow:0 1px 3px rgba(0,0,0,0.05);--font:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  --header-h:60px;--nav-w:220px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{font-family:var(--font);background:var(--bg-primary);color:var(--text-primary);min-height:100vh;display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}

/* Login */
.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,var(--bg-secondary),#f2f2f6);display:flex;align-items:center;justify-content:center;z-index:10000;animation:fadeIn .4s ease}
.login-screen.hidden{display:none}
.login-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:44px 40px;width:100%;max-width:420px;box-shadow:0 8px 32px rgba(0,0,0,0.06);text-align:center}
.login-card .logo-icon{width:48px;height:48px;background:linear-gradient(135deg,var(--accent),#ea580c);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:24px;color:#fff;margin-bottom:20px}
.login-card h1{font-size:1.4rem;font-weight:700;margin-bottom:4px;letter-spacing:-0.02em}
.login-card .subtitle{font-size:0.82rem;color:var(--text-tertiary);margin-bottom:28px}
.login-card .form-group{text-align:left;margin-bottom:16px}
.login-card .form-group label{font-size:0.78rem;font-weight:600;color:var(--text-secondary);margin-bottom:6px;display:block}
.login-card input{width:100%;padding:11px 14px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:0.9rem;font-family:var(--font);outline:none;transition:border-color .18s ease}
.login-card input:focus{border-color:var(--accent)}
.login-card .btn-login{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:0.92rem;font-weight:600;cursor:pointer;margin-top:8px;transition:all .18s ease;font-family:var(--font)}
.login-card .btn-login:hover{background:var(--accent-hover);transform:translateY(-1px)}
.login-card .demo-hint{margin-top:16px;font-size:0.72rem;color:var(--text-tertiary)}

/* Sidebar */
.sidebar{width:var(--nav-w);background:var(--bg-secondary);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;height:100vh;position:sticky;top:0;z-index:100}
.sidebar-header{padding:20px 20px 16px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:1.1rem;font-weight:700;letter-spacing:-0.02em;display:flex;align-items:center;gap:10px}
.sidebar-header h1 .logo-icon{width:28px;height:28px;background:linear-gradient(135deg,var(--accent),#ea580c);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0}
.sidebar-header .subtitle{font-size:0.72rem;color:var(--text-tertiary);margin-top:4px;margin-left:38px}
.nav-list{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-secondary);font-size:0.88rem;font-weight:500;transition:all .18s ease;user-select:none;position:relative}
.nav-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.nav-item.active{background:var(--accent-dim);color:var(--accent)}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--accent);border-radius:0 3px 3px 0}
.nav-item .icon{font-size:1.1rem;width:22px;text-align:center;flex-shrink:0}
.nav-item .badge{margin-left:auto;background:var(--accent-dim);color:var(--accent);font-size:0.7rem;padding:2px 8px;border-radius:10px;font-weight:600}
.sidebar-footer{padding:14px 16px;border-top:1px solid var(--border);font-size:0.72rem;color:var(--text-tertiary);text-align:center}

/* Main */
.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg-primary)}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-left h2{font-size:1.05rem;font-weight:600}
.topbar-left .view-desc{font-size:0.78rem;color:var(--text-tertiary)}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.btn{padding:7px 16px;border-radius:var(--radius-sm);border:none;font-size:0.8rem;font-weight:600;cursor:pointer;transition:all .18s ease;font-family:var(--font);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-secondary{background:var(--bg-tertiary);color:var(--text-secondary);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg-hover);color:var(--text-primary)}
.btn-ghost{background:transparent;color:var(--text-secondary)}
.btn-ghost:hover{background:var(--bg-hover);color:var(--text-primary)}
.btn-sm{padding:5px 12px;font-size:0.75rem}
.btn-success{background:var(--win);color:#fff}
.btn-success:hover{background:#15803d}
.btn-info{background:var(--pending);color:#fff}
.btn-info:hover{background:#2563eb}

.content{flex:1;overflow-y:auto;padding:24px 28px 32px}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.page{display:none;animation:fadeIn .25s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.stat-card .label{font-size:0.72rem;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px}
.stat-card .value{font-size:1.35rem;font-weight:700;letter-spacing:-0.02em}
.stat-card .value.win{color:var(--win)}
.stat-card .value.loss{color:var(--loss)}
.stat-card .value.accent{color:var(--accent)}
.stat-card .value.pending{color:var(--pending)}
.stat-card .sub{font-size:0.72rem;color:var(--text-tertiary);margin-top:4px}

.section-title{font-size:0.88rem;font-weight:600;margin-bottom:14px;color:var(--text-secondary)}
.recent-list{display:flex;flex-direction:column;gap:8px}
.recent-item{display:flex;align-items:center;justify-content:space-between;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;flex-wrap:wrap;gap:10px}
.recent-item .draw-info{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.recent-item .draw-type{font-size:0.72rem;color:var(--text-tertiary);background:var(--bg-tertiary);padding:2px 10px;border-radius:4px}
.recent-item .draw-date{font-size:0.78rem;color:var(--text-secondary)}
.recent-item .draw-numbers{display:flex;gap:4px}
.recent-item .bet-amount{font-size:0.78rem;color:var(--text-tertiary);white-space:nowrap}
.recent-item .win-amount{font-size:0.85rem;font-weight:700;white-space:nowrap}
.win-amount.pos{color:var(--win)}
.win-amount.neg{color:var(--loss)}

.ball{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;flex-shrink:0}
.ball.standard{background:var(--bg-tertiary);color:var(--text-primary);border:1px solid var(--border)}
.ball.special{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(194,65,12,0.2)}

.status-badge{font-size:0.7rem;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
.status-badge.won{background:rgba(22,163,74,0.1);color:var(--win)}
.status-badge.lost{background:rgba(220,38,38,0.1);color:var(--loss)}
.status-badge.pending{background:rgba(59,130,246,0.1);color:var(--pending)}

.form-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;max-width:560px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:0.78rem;font-weight:600;color:var(--text-secondary);margin-bottom:6px}
.form-group input,.form-group select{width:100%;padding:10px 14px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:0.88rem;font-family:var(--font);transition:border-color .18s ease;outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--accent)}
.form-group select option{background:var(--bg-secondary);color:var(--text-primary)}
.number-inputs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.number-inputs input{width:50px;text-align:center;padding:10px 6px}
.number-inputs .sep{color:var(--text-tertiary);font-size:0.8rem}
.form-actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.form-group .hint{font-size:0.7rem;color:var(--text-tertiary);margin-top:4px}

.history-controls{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.history-controls select{padding:7px 12px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:0.82rem;font-family:var(--font);outline:none}
.history-controls select:focus{border-color:var(--accent)}
.history-table{width:100%;border-collapse:collapse}
.history-table th{text-align:left;padding:10px 12px;font-size:0.72rem;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.04em;border-bottom:1px solid var(--border)}
.history-table td{padding:12px;font-size:0.82rem;border-bottom:1px solid rgba(200,200,215,0.4)}
.history-table tr:hover td{background:var(--bg-hover)}
.history-table .ball-sm{width:24px;height:24px;font-size:0.65rem}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-tertiary)}
.empty-state .empty-icon{font-size:3rem;margin-bottom:16px;opacity:0.5}
.empty-state h3{font-size:1rem;color:var(--text-secondary);margin-bottom:6px}
.empty-state p{font-size:0.82rem;margin-bottom:20px}

.stats-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.stats-panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.stats-panel.full{grid-column:1/-1}
.stats-panel h3{font-size:0.8rem;font-weight:600;color:var(--text-secondary);margin-bottom:14px}
.chart-container{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:20px}
.chart-container h3{font-size:0.8rem;font-weight:600;color:var(--text-secondary);margin-bottom:10px}
.chart-box{width:100%;height:320px}
.chart-box.sm{height:260px}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.freq-grid{display:flex;flex-wrap:wrap;gap:6px}
.freq-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px;border-radius:var(--radius-sm);background:var(--bg-tertiary);min-width:40px}
.freq-item .num{font-size:0.82rem;font-weight:700}
.freq-item .count{font-size:0.65rem;color:var(--text-tertiary)}
.freq-bar-wrap{width:100%;height:4px;background:var(--bg-primary);border-radius:2px;overflow:hidden;margin-top:2px}
.freq-bar{height:100%;background:var(--accent);border-radius:2px;transition:width .4s ease}

.check-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;max-width:600px}
.check-result{margin-top:20px;padding:16px 20px;border-radius:var(--radius-sm);display:none}
.check-result.show{display:block}
.check-result.match{background:rgba(22,163,74,0.08);border:1px solid rgba(22,163,74,0.2)}
.check-result.no-match{background:rgba(220,38,38,0.08);border:1px solid rgba(220,38,38,0.2)}
.check-result .result-title{font-size:1rem;font-weight:700;margin-bottom:8px}
.check-result.match .result-title{color:var(--win)}
.check-result.no-match .result-title{color:var(--loss)}
.check-result .result-detail{font-size:0.84rem;color:var(--text-secondary);line-height:1.6}
.match-draws{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.match-draw-item{display:flex;align-items:center;justify-content:space-between;background:var(--bg-tertiary);padding:10px 14px;border-radius:var(--radius-sm);flex-wrap:wrap;gap:8px}

.toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:var(--radius-sm);background:var(--bg-card);border:1px solid var(--border);box-shadow:var(--shadow);font-size:0.84rem;color:var(--text-primary);animation:slideIn .25s ease;display:flex;align-items:center;gap:8px;max-width:380px}
.toast.success{border-color:rgba(22,163,74,0.4)}
.toast.error{border-color:rgba(220,38,38,0.4)}
.toast.info{border-color:rgba(59,130,246,0.4)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

.btn-danger{background:rgba(220,38,38,0.12);color:var(--loss)}
.btn-danger:hover{background:rgba(220,38,38,0.22)}
.btn-warning{background:rgba(194,65,12,0.12);color:var(--accent)}

.api-panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:20px}
.api-panel h3{font-size:0.8rem;font-weight:600;color:var(--text-secondary);margin-bottom:10px}
.api-result-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 0}
.api-result-row .ball{width:26px;height:26px;font-size:0.68rem}

/* Voice Input */
.voice-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding:14px 16px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);flex-wrap:wrap}
.voice-bar .voice-btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease;flex-shrink:0}
.voice-bar .voice-btn:hover{background:var(--accent-hover);transform:scale(1.05)}
.voice-bar .voice-btn.recording{animation:voicePulse 1.2s infinite;background:var(--loss)}
@keyframes voicePulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.35)}70%{box-shadow:0 0 0 10px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
.voice-bar .voice-status{font-size:.84rem;color:var(--text-secondary);flex:1;min-width:200px}
.voice-bar .voice-hint{font-size:.72rem;color:var(--text-tertiary)}
.voice-result-box{margin-top:10px;padding:12px 14px;background:var(--bg-card);border:1px dashed var(--border);border-radius:var(--radius-sm);display:none}
.voice-result-box.show{display:block}
.voice-result-box .vr-title{font-size:.78rem;font-weight:600;color:var(--text-secondary);margin-bottom:6px}
.voice-result-box .vr-text{font-size:.82rem;color:var(--text-primary);line-height:1.5}
.voice-result-box .vr-parse{font-size:.78rem;color:var(--accent);margin-top:6px;font-weight:600}

.mobile-nav-toggle{display:none}
@media(max-width:768px){
  .sidebar{position:fixed;left:-100%;top:0;transition:left .3s ease;z-index:200}
  .sidebar.open{left:0}
  .mobile-nav-toggle{display:flex;align-items:center;justify-content:center;width:36px;height:36px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;color:var(--text-secondary);font-size:1.1rem}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.2);z-index:150;display:none}
  .overlay.show{display:block}
  .content{padding:16px}.topbar{padding:0 16px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .stats-layout{grid-template-columns:1fr}
  .chart-grid{grid-template-columns:1fr}
  .form-card,.check-card{padding:20px;max-width:100%}
  .history-table{font-size:0.78rem}
  .history-table th,.history-table td{padding:8px 10px}
  .login-card{padding:32px 24px;margin:0 16px}
  .topbar-right{gap:6px}
  .topbar-right .btn{padding:5px 10px;font-size:0.72rem}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr}
  .number-inputs input{width:42px}
}
</style>
</head>
<body>

<!-- Login -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="logo-icon">&#9733;</div>
    <h1>体彩助手</h1>
    <div class="subtitle">记录投注 · 追踪盈亏 · 自动核对</div>
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="loginUsername" placeholder="输入任意用户名" value="demo">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="loginPassword" placeholder="无需密码，直接登录">
    </div>
    <button class="btn-login" onclick="doLogin()">登录</button>
    <div class="demo-hint">登录后自动加载示例数据，便于体验完整功能</div>
  </div>
</div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1><span class="logo-icon">&#9733;</span>体彩助手</h1>
    <div class="subtitle">China Sports Lottery</div>
  </div>
  <nav class="nav-list">
    <div class="nav-item active" data-page="dashboard"><span class="icon">&#9632;</span>概览</div>
    <div class="nav-item" data-page="add"><span class="icon">+</span>录入投注</div>
    <div class="nav-item" data-page="history"><span class="icon">&#9776;</span>投注记录<span class="badge" id="drawCount">0</span></div>
    <div class="nav-item" data-page="stats"><span class="icon">&#9827;</span>统计分析</div>
    <div class="nav-item" data-page="check"><span class="icon">&#10003;</span>核对号码</div>
  </nav>
  <div class="sidebar-footer">数据存储于本地浏览器</div>
</div>

<div class="overlay" id="overlay"></div>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="mobile-nav-toggle" id="menuToggle">&#9776;</button>
      <h2 id="pageTitle">概览</h2>
      <span class="view-desc" id="pageDesc">投注数据概览</span>
    </div>
    <div class="topbar-right">
      <button class="btn btn-info btn-sm" onclick="fetchLatestDraw()">&#8595; 获取最新开奖</button>
      <button class="btn btn-success btn-sm" onclick="autoCheckAll()">&#10003; 自动核对</button>
      <button class="btn btn-secondary btn-sm" onclick="exportData()">导出</button>
      <button class="btn btn-secondary btn-sm" onclick="importData()">导入</button>
      <input type="file" id="importInput" accept=".json" style="display:none" onchange="handleImport(event)">
    </div>
  </div>

  <div class="content" id="mainContent">

    <!-- Dashboard -->
    <div class="page active" id="page-dashboard">
      <div class="stats-grid" id="dashboardStats"></div>
      <div class="section-title">最近投注</div>
      <div class="recent-list" id="recentDraws"></div>
    </div>

    <!-- Add Bet -->
    <div class="page" id="page-add">
      <div class="form-card">
        <div class="voice-bar">
          <button class="voice-btn" id="voiceBtn" onclick="toggleVoiceInput()" title="语音输入">&#127908;</button>
          <div>
            <div class="voice-status" id="voiceStatus">点击麦克风，语音录入投注信息</div>
            <div class="voice-hint">例如："双色球 2026079期 红球1 11 17 22 24 29 蓝球4 投注2元"</div>
          </div>
        </div>
        <div class="voice-result-box" id="voiceResultBox">
          <div class="vr-title">识别结果</div>
          <div class="vr-text" id="voiceText"></div>
          <div class="vr-parse" id="voiceParse"></div>
        </div>
        <div class="form-group">
          <label>彩票类型</label>
          <select id="drawType">
            <option value="双色球">双色球</option><option value="大乐透">大乐透</option>
            <option value="福彩3D">福彩3D</option><option value="排列三">排列三</option>
            <option value="排列五">排列五</option><option value="七星彩">七星彩</option>

<script>
"use strict";
const STORAGE_KEY='lottery_data_v2',LOGIN_KEY='lottery_login_v2';
function getData(){try{const r=localStorage.getItem(STORAGE_KEY);return r?JSON.parse(r):[]}catch{return[]}}
function saveData(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}
function isLoggedIn(){return localStorage.getItem(LOGIN_KEY)==='true'}
function setLoggedIn(v){localStorage.setItem(LOGIN_KEY,v?'true':'false')}
function formatDate(d){if(!d)return'';const dt=new Date(d);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
function showToast(msg,type='success'){const c=document.getElementById('toastContainer');const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;c.appendChild(t);setTimeout(()=>t.remove(),3000)}

// Sample data

// Login
function doLogin(){
  const u=document.getElementById('loginUsername').value.trim();
  if(!u){showToast('请输入用户名','error');return}
  setLoggedIn(true);
  if(getData().length===0){saveData([...DEMO]);showToast('已加载 '+DEMO.length+' 条示例数据','info')}
  document.getElementById('loginScreen').classList.add('hidden');
  initApp();
}

// Navigation
const PAGE_NAMES={
  dashboard:{title:'概览',desc:'投注数据概览'},
  add:{title:'录入投注',desc:'添加新的投注记录'},
  history:{title:'投注记录',desc:'查看所有投注记录'},
  stats:{title:'统计分析',desc:'号码频率与盈亏分析'},
  check:{title:'核对号码',desc:'核对号码是否中奖'}
};
document.querySelectorAll('.nav-item').forEach(item=>{
  item.addEventListener('click',()=>{
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    item.classList.add('active');
    const p=item.dataset.page;
    document.querySelectorAll('.page').forEach(pg=>pg.classList.remove('active'));
    document.getElementById('page-'+p).classList.add('active');
    document.getElementById('pageTitle').textContent=PAGE_NAMES[p].title;
    document.getElementById('pageDesc').textContent=PAGE_NAMES[p].desc;
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
    if(p==='dashboard')renderDashboard();
    else if(p==='history')renderHistory();
    else if(p==='stats'){renderStats();setTimeout(initCharts,60)}
  });
});
document.getElementById('menuToggle').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
});
document.getElementById('overlay').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
});

// Update number inputs
function updateNumInputs(type,stdId,spcId,spcGrpId,stdClass,spcClass,hintId){
  const cfg=getCfg(type);
  const stdC=document.getElementById(stdId);stdC.innerHTML='';
  for(let i=0;i<cfg.std;i++){
    if(i>0){const s=document.createElement('span');s.className='sep';s.textContent='-';stdC.appendChild(s)}
    const inp=document.createElement('input');inp.type='number';
    inp.min=type==='福彩3D'||type==='排列三'||type==='排列五'||type==='七星彩'?0:1;
    inp.max=cfg.sMax;inp.className=stdClass;inp.placeholder=String(i+1);stdC.appendChild(inp);
  }
  const spcC=document.getElementById(spcId);spcC.innerHTML='';
  for(let i=0;i<cfg.spc;i++){
    if(i>0){const s=document.createElement('span');s.className='sep';s.textContent='-';spcC.appendChild(s)}
    const inp=document.createElement('input');inp.type='number';inp.min=1;inp.max=cfg.pMax;
    inp.className=spcClass;inp.placeholder=String(i+1);spcC.appendChild(inp);
  }
  document.getElementById(spcGrpId).style.display=cfg.spc===0?'none':'block';
  const hintEl=document.getElementById(hintId);
  if(hintEl)hintEl.textContent=cfg.desc;
}
document.getElementById('drawType').addEventListener('change',function(){
  updateNumInputs(this.value,'standardInputs','specialInputs','specialNumbersGroup','std-num','spc-num','stdHint');
});
document.getElementById('checkType').addEventListener('change',function(){
  updateNumInputs(this.value,'checkStandardInputs','checkSpecialInputs','checkSpecialInputsParent','ck-std','ck-spc');
});

function getNums(cls){
  const inputs=document.querySelectorAll('.'+cls);
  const nums=[];inputs.forEach(inp=>{const v=parseInt(inp.value);if(!isNaN(v))nums.push(v)});
  return nums.sort((a,b)=>a-b);
}

// Add bet
function addDraw(){
  const type=document.getElementById('drawType').value;
  const period=document.getElementById('drawPeriod').value.trim();
  const date=document.getElementById('drawDate').value;
  const note=document.getElementById('drawNote').value.trim();
  const stdNums=getNums('std-num');
  const spcNums=getNums('spc-num');
  const betAmount=parseFloat(document.getElementById('betAmount').value)||0;
  const winAmount=parseFloat(document.getElementById('winAmount').value)||0;
  const cfg=getCfg(type);

  if(!period){showToast('请输入期号','error');return}
  if(!date){showToast('请选择投注日期','error');return}
  if(stdNums.length!==cfg.std){showToast('请填写 '+cfg.std+' 个号码','error');return}
  if(betAmount<=0){showToast('请输入投注金额','error');return}

  const data=getData();
  const draw={
    id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    type,period,date,standard:stdNums,special:spcNums,betAmount,winAmount,
    status:winAmount>0?'won':'pending',note:note||'',
    createdAt:new Date().toISOString()
  };
  data.push(draw);saveData(data);
  showToast('已保存 '+type+' '+period+' | 投注¥'+betAmount);
  clearForm();updateBadge();renderDashboard();
}
function clearForm(){
  document.getElementById('drawPeriod').value='';document.getElementById('drawDate').value='';
  document.getElementById('drawNote').value='';document.getElementById('betAmount').value='2';
  document.getElementById('winAmount').value='';
  document.querySelectorAll('.std-num,.spc-num').forEach(inp=>inp.value='');
}

// Delete
function deleteDraw(id){
  if(!confirm('确定删除这条记录吗？'))return;
  let data=getData();data=data.filter(d=>d.id!==id);
  saveData(data);showToast('已删除');updateBadge();renderHistory();renderDashboard();
}
function clearAllData(){
  if(!confirm('确定清空所有数据？不可恢复！'))return;
  if(!confirm('再次确认：清空所有数据？'))return;
  saveData([]);showToast('已清空');updateBadge();renderDashboard();renderHistory();renderStats();
}

// Dashboard
function renderDashboard(){
  const data=getData(),total=data.length;
  const typeCount={};data.forEach(d=>{typeCount[d.type]=(typeCount[d.type]||0)+1});
  const types=Object.keys(typeCount).sort();
  const totalBet=data.reduce((s,d)=>s+(d.betAmount||0),0);
  const totalWin=data.filter(d=>d.status==='won').reduce((s,d)=>s+(d.winAmount||0),0);
  const profit=totalWin-totalBet;
  const pendingCount=data.filter(d=>d.status==='pending').length;

  document.getElementById('dashboardStats').innerHTML=`
    <div class="stat-card">
      <div class="label">总投注次数</div>
      <div class="value accent">${total}</div>
      <div class="sub">${types.length} 种类型</div>
    </div>
    <div class="stat-card">
      <div class="label">总投入金额</div>
      <div class="value">¥${totalBet.toFixed(2)}</div>
      <div class="sub">累计投注</div>
    </div>
    <div class="stat-card">
      <div class="label">总中奖金额</div>
      <div class="value win">¥${totalWin.toFixed(2)}</div>
      <div class="sub">已中奖记录</div>
    </div>
    <div class="stat-card">
      <div class="label">盈亏总计</div>
      <div class="value ${profit>=0?'win':'loss'}">${profit>=0?'+':''}¥${profit.toFixed(2)}</div>
      <div class="sub">${profit>=0?'盈利':'亏损'}</div>
    </div>
    <div class="stat-card">
      <div class="label">待核对</div>
      <div class="value pending">${pendingCount}</div>
      <div class="sub">尚未核对中奖</div>
    </div>
  `;

  const recent=[...data].reverse().slice(0,10);
  const rc=document.getElementById('recentDraws');
  if(recent.length===0){
    rc.innerHTML=`<div class="empty-state"><div class="empty-icon">&#9733;</div><h3>还没有投注记录</h3><p>点击左侧"录入投注"开始记录</p></div>`;return;
  }
  rc.innerHTML=recent.map(d=>{
    const balls=d.standard.map(n=>`<span class="ball ball-sm standard">${n}</span>`).join('');
    const spcBalls=d.special.map(n=>`<span class="ball ball-sm special">${n}</span>`).join('');
    const statusClass=d.status==='won'?'won':d.status==='lost'?'lost':'pending';
    const statusText=d.status==='won'?'已中奖':d.status==='lost'?'未中奖':'待核对';
    const profit=(d.winAmount||0)-(d.betAmount||0);
    return `<div class="recent-item">
      <div class="draw-info">
        <span class="draw-type">${d.type}</span>
        <span class="draw-date">${d.period} · ${formatDate(d.date)}</span>
        <div class="draw-numbers">${balls}${spcBalls?'<span style="color:var(--text-tertiary);margin:0 2px;">|</span>'+spcBalls:''}</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span class="bet-amount">投¥${(d.betAmount||0).toFixed(2)}</span>
        ${d.status==='pending'?'':`<span class="win-amount ${profit>=0?'pos':'neg'}">${profit>=0?'+':''}¥${profit.toFixed(2)}</span>`}
        <span class="status-badge ${statusClass}">${statusText}</span>
      </div>
    </div>`;
  }).join('');
}

// History
function renderHistory(){
  let data=getData();
  const filter=document.getElementById('historyFilter').value;
  const sort=document.getElementById('historySort').value;
  const status=document.getElementById('historyStatus').value;
  if(filter!=='all')data=data.filter(d=>d.type===filter);
  if(status!=='all')data=data.filter(d=>d.status===status);
  if(sort==='desc')data.reverse();

  const container=document.getElementById('historyContent');
  if(data.length===0){
    container.innerHTML=`<div class="empty-state"><div class="empty-icon">&#9776;</div><h3>暂无记录</h3><p>${filter!=='all'?'该类型暂无投注数据':'还没有添加任何投注记录'}</p></div>`;return;
  }
  const table=document.createElement('table');table.className='history-table';
  table.innerHTML=`<thead><tr><th>类型</th><th>期号</th><th>日期</th><th>号码</th><th>投注</th><th>中奖</th><th>盈亏</th><th>状态</th><th>备注</th><th></th></tr></thead>
  <tbody>${data.map(d=>{
    const balls=d.standard.map(n=>`<span class="ball ball-sm standard">${n}</span>`).join(' ');
    const spcBalls=d.special.length>0?d.special.map(n=>`<span class="ball ball-sm special">${n}</span>`).join(' '):'';
    const p=(d.winAmount||0)-(d.betAmount||0);
    const sc=d.status==='won'?'won':d.status==='lost'?'lost':'pending';
    const st=d.status==='won'?'已中奖':d.status==='lost'?'未中奖':'待核对';
    return `<tr>
      <td><span class="draw-type">${d.type}</span></td>
      <td>${d.period}</td><td>${formatDate(d.date)}</td>
      <td><div class="draw-numbers" style="display:flex;gap:4px;flex-wrap:wrap;">${balls}${spcBalls?'<span style="color:var(--text-tertiary);margin:0 2px;">|</span>'+spcBalls:''}</div></td>
      <td>¥${(d.betAmount||0).toFixed(2)}</td>
      <td>¥${(d.winAmount||0).toFixed(2)}</td>
      <td style="color:${p>=0?'var(--win)':'var(--loss)'};font-weight:600;">${p>=0?'+':''}¥${p.toFixed(2)}</td>
      <td><span class="status-badge ${sc}">${st}</span></td>

// Stats
function renderStats(){
  let data=getData();const filter=document.getElementById('statsFilter').value;
  if(filter!=='all')data=data.filter(d=>d.type===filter);
  const container=document.getElementById('statsContent');
  if(data.length===0){
    container.innerHTML=`<div class="empty-state"><div class="empty-icon">&#9827;</div><h3>暂无统计数据</h3><p>添加投注记录后即可查看分析</p></div>`;return;
  }
  const freqMap={};data.forEach(d=>{d.standard.forEach(n=>{freqMap[n]=(freqMap[n]||0)+1});d.special.forEach(n=>{freqMap['spc_'+n]=(freqMap['spc_'+n]||0)+1})});
  const stdNums=Object.keys(freqMap).filter(k=>!k.startsWith('spc_')).map(Number).sort((a,b)=>a-b);
  const spcNums=Object.keys(freqMap).filter(k=>k.startsWith('spc_')).map(k=>parseInt(k.replace('spc_',''))).sort((a,b)=>a-b);
  const maxFreq=Math.max(...stdNums.map(n=>freqMap[n]),1);
  const hotStd=[...stdNums].sort((a,b)=>freqMap[b]-freqMap[a]).slice(0,10);
  const coldStd=[...stdNums].sort((a,b)=>freqMap[a]-freqMap[b]).slice(0,10);

  const typeStats={};data.forEach(d=>{typeStats[d.type]=(typeStats[d.type]||0)+1});
  const typeStatsHtml=Object.entries(typeStats).sort((a,b)=>b[1]-a[1]).map(([t,c])=>{
    const pct=(c/data.length*100).toFixed(1);
    return`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);"><span style="font-size:0.84rem;">${t}</span><div style="display:flex;align-items:center;gap:10px;"><div style="width:120px;height:6px;background:var(--bg-primary);border-radius:3px;overflow:hidden;"><div style="height:100%;background:var(--accent);border-radius:3px;width:${pct}%;"></div></div><span style="font-size:0.8rem;color:var(--text-secondary);min-width:50px;text-align:right;">${c}次</span></div></div>`;
  }).join('');

  const freqHtml=stdNums.map(n=>{
    const pct=(freqMap[n]/maxFreq*100).toFixed(0);
    const isHot=hotStd.includes(n)&&freqMap[n]>=freqMap[hotStd[hotStd.length-1]];
    const isCold=coldStd.includes(n)&&freqMap[n]<=freqMap[coldStd[coldStd.length-1]];
    return`<div class="freq-item" style="${isHot?'border:1px solid rgba(194,65,12,0.2);':''}${isCold?'opacity:0.55;':''}"><span class="num" style="${isHot?'color:var(--accent);':''}">${n}</span><span class="count">${freqMap[n]}x</span><div class="freq-bar-wrap"><div class="freq-bar" style="width:${pct}%;"></div></div></div>`;
  }).join('');

  container.innerHTML=`<div class="stats-layout">
    <div class="stats-panel full"><h3>号码频率分布 (${filter==='all'?'全部':filter} · ${data.length}期)</h3><div class="freq-grid">${freqHtml}</div></div>
    <div class="stats-panel"><h3>热门号码 Top 10</h3><div class="freq-grid">${hotStd.map(n=>`<div class="freq-item" style="border:1px solid rgba(194,65,12,0.2);"><span class="num" style="color:var(--accent);">${n}</span><span class="count">${freqMap[n]}x</span></div>`).join('')}</div></div>
    <div class="stats-panel"><h3>冷门号码 Top 10</h3><div class="freq-grid">${coldStd.map(n=>`<div class="freq-item" style="opacity:0.55;"><span class="num">${n}</span><span class="count">${freqMap[n]}x</span></div>`).join('')}</div></div>
    <div class="stats-panel"><h3>彩票类型分布</h3>${typeStatsHtml}</div>
    <div class="stats-panel"><h3>特别号码频率</h3><div class="freq-grid">${spcNums.length>0?spcNums.map(n=>`<div class="freq-item"><span class="num" style="color:var(--accent);">${n}</span><span class="count">${freqMap['spc_'+n]}x</span></div>`).join(''):'<span style="color:var(--text-tertiary);font-size:0.82rem;">无特别号码</span>'}</div></div>
  </div>`;
}

// Check numbers
function checkNumbers(){
  const type=document.getElementById('checkType').value;
  const stdNums=getNums('ck-std');
  const spcNums=getNums('ck-spc');
  const cfg=getCfg(type);
  const period=document.getElementById('checkPeriod').value.trim();

  if(stdNums.length<cfg.std){showToast('请填写 '+cfg.std+' 个号码','error');return}

  const data=getData().filter(d=>d.type===type);
  if(data.length===0){
    document.getElementById('checkResult').className='check-result show no-match';
    document.getElementById('checkResult').innerHTML=`<div class="result-title">暂无数据</div><div class="result-detail">该类型暂无投注记录</div>`;return;
  }

  const myStd=[...stdNums].sort((a,b)=>a-b);
  const mySpc=[...spcNums].sort((a,b)=>a-b);
  let matches=[];
  data.forEach(draw=>{
    const matchedStd=draw.standard.filter(n=>myStd.includes(n)).length;
    let matchedSpc=0;
    if(mySpc.length>0&&draw.special.length>0)matchedSpc=draw.special.filter(n=>mySpc.includes(n)).length;

    if(total>0)matches.push({...draw,matchedStd,matchedSpc,totalMatched:total});
  });
  matches.sort((a,b)=>b.totalMatched-a.totalMatched);

  const rc=document.getElementById('checkResult');
  if(matches.length===0){
    rc.className='check-result show no-match';
    rc.innerHTML=`<div class="result-title">未中奖</div><div class="result-detail">你的号码与 ${type} 的 ${data.length} 期记录均不匹配</div>`;
  }else{
    const best=matches[0];

    rc.innerHTML=`<div class="result-title">&#10003; 发现 ${matches.length} 期匹配</div>
      <div class="result-detail">最佳: ${best.type} ${best.period} — 标准号匹配 ${best.matchedStd}/${cfg.std} 个${cfg.spc>0?'，特别号匹配 '+best.matchedSpc+'/'+cfg.spc+' 个':''}</div>

        const balls=m.standard.map(n=>`<span class="ball ball-sm standard" style="${myStd.includes(n)?'background:rgba(194,65,12,0.15);border-color:var(--accent);':''}">${n}</span>`).join('');
        const spcBalls=m.special.map(n=>`<span class="ball ball-sm special" style="${mySpc.includes(n)?'background:rgba(194,65,12,0.2);':''}">${n}</span>`).join('');
        return`<div class="match-draw-item"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;"><span class="draw-type">${m.type}</span><span style="color:var(--text-secondary);font-size:0.8rem;">${m.period}</span><div class="draw-numbers" style="display:flex;gap:4px;flex-wrap:wrap;">${balls}${spcBalls?'<span style="color:var(--text-tertiary);margin:0 2px;">|</span>'+spcBalls:''}</div></div><span style="color:var(--accent);font-size:0.78rem;font-weight:600;">匹配 ${m.totalMatched} 个</span></div>`;
      }).join('')}</div>`;
  }
}

function autoCheckWithResults(results){
  const data=getData();
  let changed=0;
  results.forEach(r=>{
    const apiNums=r.nums.map(Number);
    const cfg=getCfg(r.type);
    if(!cfg)return;
    // Standard numbers: first cfg.std numbers, special: rest
    const apiStd=apiNums.slice(0,cfg.std).sort((a,b)=>a-b);
    const apiSpc=apiNums.slice(cfg.std).sort((a,b)=>a-b);

    data.forEach(d=>{
      if(d.type!==r.type||d.status!=='pending')return;
      if(d.period!==r.code)return; // Period match
      const matchedStd=d.standard.filter(n=>apiStd.includes(n)).length;
      let matchedSpc=0;
      if(d.special.length>0)matchedSpc=d.special.filter(n=>apiSpc.includes(n)).length;
      if(matchedStd+matchedSpc>0){
        d.status='won';
        if(!d.winAmount)d.winAmount=estimateWin(d.type,matchedStd,matchedSpc);
        d.note=(d.note||'')+' [自动核对:中奖]';
        changed++;
      }else{
        d.status='lost';
        d.note=(d.note||'')+' [自动核对:未中]';
        changed++;
      }
    });
  });
  if(changed>0){saveData(data);updateBadge();renderDashboard();renderHistory();showToast('已自动核对 '+changed+' 条记录','success')}
  else showToast('没有匹配的待核对记录','info');
}

function estimateWin(type,matchedStd,matchedSpc){
  const prizes={
    '双色球':[[6,1,5000000],[6,0,100000],[5,1,3000],[5,0,200],[4,1,200],[4,0,10],[3,1,10],[2,1,5],[1,1,5],[0,1,5]],
    '大乐透':[[5,2,5000000],[5,1,100000],[5,0,10000],[4,2,3000],[4,1,500],[3,2,200],[4,0,100],[3,1,15],[2,2,15],[3,0,5],[2,1,5],[1,2,5],[0,2,5]],
    '福彩3D':[[3,0,1040],[2,0,104],[1,0,0]],
    '排列三':[[3,0,1040],[2,0,104],[1,0,0]],
    '排列五':[[5,0,100000],[4,0,0],[3,0,0]],
    '七星彩':[[7,0,5000000],[6,0,50000],[5,0,1800],[4,0,300],[3,0,20],[2,0,5]],
    '七乐彩':[[7,0,500000],[6,1,10000],[6,0,2000],[5,1,500],[5,0,200],[4,1,50],[4,0,10],[3,1,5]]
  };
  const p=prizes[type]||[];
  for(const[ms,mp,prize]of p){if(matchedStd>=ms&&matchedSpc>=mp)return prize}
  return 0;
}

// Voice Input
let voiceRec=null,voiceListening=false;
function initVoice(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){showToast('当前浏览器不支持语音识别','error');return false}
  voiceRec=new SpeechRecognition();
  voiceRec.lang='zh-CN';voiceRec.continuous=false;voiceRec.interimResults=true;
  voiceRec.onstart=function(){voiceListening=true;document.getElementById('voiceBtn').classList.add('recording');document.getElementById('voiceStatus').textContent='正在聆听，请说出投注信息...'}
  voiceRec.onend=function(){voiceListening=false;document.getElementById('voiceBtn').classList.remove('recording');document.getElementById('voiceStatus').textContent='点击麦克风，语音录入投注信息'}
  voiceRec.onerror=function(e){voiceListening=false;document.getElementById('voiceBtn').classList.remove('recording');document.getElementById('voiceStatus').textContent='识别失败，请重试';console.error(e)}
  voiceRec.onresult=function(e){handleVoiceResult(e)}
  return true}
function toggleVoiceInput(){if(!voiceRec&&!initVoice())return;if(voiceListening){voiceRec.stop()}else{document.getElementById('voiceResultBox').classList.remove('show');voiceRec.start()}}
function handleVoiceResult(e){
  let transcript='';
  for(let i=e.resultIndex;i<e.results.length;i++){transcript+=e.results[i][0].transcript}
  document.getElementById('voiceText').textContent=transcript;
  document.getElementById('voiceResultBox').classList.add('show');
  if(e.results[e.results.length-1].isFinal){parseVoiceInput(transcript)}
}
function parseVoiceInput(text){
  const t=text.replace(/[\s,，]+/g,' ').trim();
  // Type
  const typeKeywords={'双色球':'双色球','大乐透':'大乐透','福彩3D':'福彩3D','排列三':'排列三','排列五':'排列五','七星彩':'七星彩','七乐彩':'七乐彩'};
  let detectedType='';
  for(const[k,v]of Object.entries(typeKeywords)){if(t.includes(k)){detectedType=v;break}}
  // Period: patterns like 2026079 or 第2026079期
  let period='';
  const pm=t.match(/(?:第\s*)?(\d{6,7})\s*期?/);
  if(pm){period=pm[1]}
  // Extract all numbers
  const nums=t.match(/\d+/g)||[];
  const cfg=detectedType?getCfg(detectedType):null;
  // Parse standard and special numbers
  let stdNums=[],spcNums=[],amount=0;
  if(cfg){
    // Find index hints
    const blueIdx=t.indexOf('蓝');const redIdx=t.indexOf('红');const frontIdx=t.indexOf('前区');const backIdx=t.indexOf('后区');
    const spcIdx=t.indexOf('特别');const stdHintIdx=Math.max(redIdx,frontIdx);
    const spcHintIdx=Math.max(blueIdx,backIdx,spcIdx);
    // If there are hint words, try to split
    if(stdHintIdx>=0||spcHintIdx>=0){
      const beforeSpc=text.slice(0,spcHintIdx>=0?spcHintIdx:text.length);
      const beforeStd=text.slice(0,stdHintIdx>=0?stdHintIdx:text.length);
      const spcPart=spcHintIdx>=0?text.slice(spcHintIdx):'';
      const stdPart=stdHintIdx>=0?text.slice(stdHintIdx,(spcHintIdx>stdHintIdx?spcHintIdx:text.length)):'';
      const stdCandidates=stdPart?stdPart.match(/\d+/g)||[]:[];
      const spcCandidates=spcPart?spcPart.match(/\d+/g)||[]:[];
      stdNums=stdCandidates.slice(0,cfg.std).map(Number);
      spcNums=spcCandidates.slice(0,cfg.spc).map(Number);
    }
    // Fallback: use all numbers minus period
    if(stdNums.length===0){
      const allNums=nums.filter(n=>n!==period).map(Number);
      stdNums=allNums.slice(0,cfg.std);
      if(cfg.spc>0){spcNums=allNums.slice(cfg.std,cfg.std+cfg.spc)}
    }
    // Amount: match X元, 投注X, 花了X
    const am=t.match(/(?:投注|花|买|金额|投)\s*(\d+(?:\.\d+)?)\s*元?/);
    if(am){amount=parseFloat(am[1])}
    else if(nums.length>0){const last=parseFloat(nums[nums.length-1]);if(last<1000)amount=last}
    // Fill form
    if(detectedType)document.getElementById('drawType').value=detectedType;
    if(period)document.getElementById('drawPeriod').value=period;
    if(amount>0)document.getElementById('betAmount').value=amount;
    // Update inputs and fill numbers
    updateNumInputs(detectedType||'双色球','standardInputs','specialInputs','specialNumbersGroup','std-num','spc-num','stdHint');
    const stdInputs=document.querySelectorAll('.std-num');
    stdInputs.forEach((inp,i)=>{if(i<stdNums.length)inp.value=stdNums[i]});
    if(cfg&&cfg.spc>0){const spcInputs=document.querySelectorAll('.spc-num');spcInputs.forEach((inp,i)=>{if(i<spcNums.length)inp.value=spcNums[i]})}
    const parseMsg=`已解析: ${detectedType||'未识别类型'} ${period||''} | 号码${stdNums.join(',')}${cfg&&cfg.spc>0&&spcNums.length>0?' + '+spcNums.join(','):''}${amount>0?' | 投注¥'+amount:''}`;
    document.getElementById('voiceParse').textContent=parseMsg;
    showToast('语音识别完成，请核对信息后保存','success');
  }else{
    document.getElementById('voiceParse').textContent='未能识别彩票类型，请手动选择';
    showToast('未能识别彩票类型','error');
  }
}

function initApp(){
  document.getElementById('drawDate').value=new Date().toISOString().slice(0,10);
  updateNumInputs('双色球','standardInputs','specialInputs','specialNumbersGroup','std-num','spc-num','stdHint');
  updateNumInputs('双色球','checkStandardInputs','checkSpecialInputs','checkSpecialInputsParent','ck-std','ck-spc');
  updateBadge();renderDashboard();
}

// Add parent for check special inputs
(function(){
  const spcGroup=document.getElementById('checkSpecialInputs');
  if(spcGroup&&!document.getElementById('checkSpecialInputsParent')){
    const wrapper=document.createElement('div');
    wrapper.id='checkSpecialInputsParent';
    spcGroup.parentNode.insertBefore(wrapper,spcGroup);
    wrapper.appendChild(spcGroup);
  }
})();

function init(){
  if(isLoggedIn()){document.getElementById('loginScreen').classList.add('hidden');initApp()}
}
init();
</script>
