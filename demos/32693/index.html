<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="暖邻帮 - AI驱动的社区互助养老平台，用技术重拾熟人社会的温度">
  <meta name="theme-color" content="#FF6B35">
  <title>暖邻帮 - 社区互助养老</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 头部导航 -->
  <header class="header">
    <div class="container">
      <div class="logo">
        <div class="logo-icon">🤝</div>
        <span>暖邻帮</span>
      </div>

      <nav>
        <ul class="nav-links">
          <li><a href="#" data-page="home" class="active">首页</a></li>
          <li><a href="#" data-page="tasks">任务</a></li>
          <li><a href="#" data-page="matching">AI匹配</a></li>
          <li><a href="#" data-page="volunteer">志愿者</a></li>
          <li><a href="#" data-page="admin">管理</a></li>
        </ul>
      </nav>

      <div class="user-menu">
        <div class="avatar" onclick="showPage('profile')">👵</div>
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
      </div>
    </div>
  </header>

  <!-- 主内容区域 -->
  <main class="main-content">
    <div class="container">
      <!-- 首页 -->
      <div id="page-home" class="page">
        <div id="home-content"></div>
      </div>

      <!-- 任务页面 -->
      <div id="page-tasks" class="page hidden">
        <div id="tasks-content"></div>
      </div>

      <!-- AI匹配页面 -->
      <div id="page-matching" class="page hidden">
        <div id="matching-content"></div>
      </div>

      <!-- 个人中心页面 -->
      <div id="page-profile" class="page hidden">
        <div id="profile-content"></div>
      </div>

      <!-- 消息页面 -->
      <div id="page-messages" class="page hidden">
        <div id="messages-content"></div>
      </div>

      <!-- 积分页面 -->
      <div id="page-points" class="page hidden">
        <div id="points-content"></div>
      </div>

      <!-- 公告页面 -->
      <div id="page-notice" class="page hidden">
        <div id="notice-content"></div>
      </div>

      <!-- 志愿者页面 -->
      <div id="page-volunteer" class="page hidden">
        <div id="volunteer-content"></div>
      </div>

      <!-- 管理页面 -->
      <div id="page-admin" class="page hidden">
        <div id="admin-content"></div>
      </div>
    </div>
  </main>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <a href="#" class="bottom-nav-item active" data-page="home">
      <span class="icon">🏠</span>
      <span>首页</span>
    </a>
    <a href="#" class="bottom-nav-item" data-page="tasks">
      <span class="icon">📋</span>
      <span>任务</span>
    </a>
    <a href="#" class="bottom-nav-item" data-page="matching">
      <span class="icon">🤖</span>
      <span>AI匹配</span>
    </a>
    <a href="#" class="bottom-nav-item" data-page="messages">
      <span class="icon">💬</span>
      <span>消息</span>
    </a>
    <a href="#" class="bottom-nav-item" data-page="profile">
      <span class="icon">👤</span>
      <span>我的</span>
    </a>
  </nav>

  <!-- 紧急呼叫按钮 -->
  <button class="emergency-btn" onclick="handleEmergencyCall()" title="紧急求助">
    <span>🆘</span>
  </button>

  <!-- 任务发布弹窗 -->
  <div class="modal-overlay" id="task-modal">
    <div class="modal" style="max-width: 520px;">
      <div class="modal-header">
        <div class="modal-title">发布互助需求</div>
        <button class="modal-close" onclick="closeModal('task-modal')">×</button>
      </div>

      <form id="task-form">
        <div class="form-group">
          <label class="form-label">需求类型 <span style="color: var(--danger-color);">*</span></label>
          <select class="form-select" name="type" id="task-type-select" required>
            <option value="medicine">💊 代买药</option>
            <option value="hospital">🏥 陪诊挂号</option>
            <option value="delivery">📦 代取快递</option>
            <option value="heavy">🏋️ 搬运重物</option>
            <option value="device">📱 智能设备教学</option>
            <option value="chat">💬 聊天陪伴</option>
            <option value="urgent">🆘 紧急求助</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">需求标题 <span style="color: var(--danger-color);">*</span></label>
          <input type="text" class="form-input" name="title" placeholder="简述您的需求，如：帮忙购买降压药" required>
        </div>

        <div class="form-group">
          <label class="form-label">详细描述 <span style="color: var(--danger-color);">*</span></label>
          <textarea class="form-input" name="description" placeholder="请详细描述您的需求，如药品名称规格、具体地址、注意事项等..." required></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">期望时间</label>
          <input type="text" class="form-input" name="preferredTime" placeholder="如：今天下午、明天上午等">
        </div>

        <div class="form-group">
          <label class="form-label">紧急程度</label>
          <select class="form-select" name="urgency">
            <option value="normal">普通</option>
            <option value="high">较急</option>
            <option value="urgent">紧急</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">积分奖励</label>
          <input type="number" class="form-input" name="reward" value="20" min="10" max="100">
          <small style="color: var(--text-secondary);">建议20-50积分，紧急任务可适当提高</small>
        </div>

        <div class="form-group">
          <label class="form-label">备注信息</label>
          <input type="text" class="form-input" name="remark" placeholder="其他补充说明">
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('task-modal')">取消</button>
          <button type="submit" class="btn btn-primary">发布需求</button>
        </div>
      </form>
    </div>
  </div>

  <!-- AI匹配弹窗 -->
  <div class="modal-overlay" id="ai-matching-modal">
    <div class="modal" style="max-width: 480px;">
      <div class="modal-content">
        <!-- 内容由JS动态填充 -->
      </div>
    </div>
  </div>

  <!-- 任务详情弹窗 -->
  <div class="modal-overlay" id="task-detail-modal">
    <div class="modal" style="max-width: 480px;">
      <div class="modal-content">
        <!-- 内容由JS动态填充 -->
      </div>
    </div>
  </div>

  <!-- 公告详情弹窗 -->
  <div class="modal-overlay" id="notice-detail-modal">
    <div class="modal" style="max-width: 480px;">
      <div class="modal-content">
        <!-- 内容由JS动态填充 -->
      </div>
    </div>
  </div>

  <!-- 志愿者申请弹窗 -->
  <div class="modal-overlay" id="volunteer-apply-modal">
    <div class="modal" style="max-width: 480px;">
      <div class="modal-header">
        <div class="modal-title">申请成为志愿者</div>
        <button class="modal-close" onclick="closeModal('volunteer-apply-modal')">×</button>
      </div>

      <form id="volunteer-form">
        <div class="form-group">
          <label class="form-label">姓名 <span style="color: var(--danger-color);">*</span></label>
          <input type="text" class="form-input" placeholder="请输入真实姓名" required>
        </div>

        <div class="form-group">
          <label class="form-label">手机号 <span style="color: var(--danger-color);">*</span></label>
          <input type="tel" class="form-input" placeholder="请输入手机号" required>
        </div>

        <div class="form-group">
          <label class="form-label">年龄</label>
          <input type="number" class="form-input" placeholder="请输入年龄" min="18" max="80">
        </div>

        <div class="form-group">
          <label class="form-label">擅长领域（可多选）</label>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
            <label style="display: flex; align-items: center; gap: 6px; padding: 8px 14px; background: var(--bg-color); border-radius: var(--radius-full); cursor: pointer;">
              <input type="checkbox" name="skills" value="medicine" style="accent-color: var(--primary-color);"> 💊 代买药
            </label>
            <label style="display: flex; align-items: center; gap: 6px; padding: 8px 14px; background: var(--bg-color); border-radius: var(--radius-full); cursor: pointer;">
              <input type="checkbox" name="skills" value="hospital" style="accent-color: var(--primary-color);"> 🏥 陪诊挂号
            </label>
            <label style="display: flex; align-items: center; gap: 6px; padding: 8px 14px; background: var(--bg-color); border-radius: var(--radius-full); cursor: pointer;">
              <input type="checkbox" name="skills" value="delivery" style="accent-color: var(--primary-color);"> 📦 代取快递
            </label>
            <label style="display: flex; align-items: center; gap: 6px; padding: 8px 14px; background: var(--bg-color); border-radius: var(--radius-full); cursor: pointer;">
              <input type="checkbox" name="skills" value="heavy" style="accent-color: var(--primary-color);"> 🏋️ 搬运重物
            </label>
            <label style="display: flex; align-items: center; gap: 6px; padding: 8px 14px; background: var(--bg-color); border-radius: var(--radius-full); cursor: pointer;">
              <input type="checkbox" name="skills" value="device" style="accent-color: var(--primary-color);"> 📱 设备教学
            </label>
            <label style="display: flex; align-items: center; gap: 6px; padding: 8px 14px; background: var(--bg-color); border-radius: var(--radius-full); cursor: pointer;">
              <input type="checkbox" name="skills" value="chat" style="accent-color: var(--primary-color);"> 💬 聊天陪伴
            </label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">个人简介</label>
          <textarea class="form-input" placeholder="简单介绍一下自己，如退休前职业、兴趣爱好等..."></textarea>
        </div>

        <div class="checkbox-wrapper" style="margin-bottom: 20px;">
          <input type="checkbox" id="agree-rules" required>
          <label for="agree-rules">我已阅读并同意<a href="#">《志愿者服务协议》</a>和<a href="#">《隐私政策》</a></label>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('volunteer-apply-modal')">取消</button>
          <button type="submit" class="btn btn-primary">提交申请</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast 通知 -->
  <div class="toast" id="toast">
    <div class="toast-icon">✓</div>
    <div class="toast-message">操作成功</div>
  </div>

  <!-- 引入脚本 -->
  <script src="js/data.js"></script>
  <script src="js/ai-matching.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
