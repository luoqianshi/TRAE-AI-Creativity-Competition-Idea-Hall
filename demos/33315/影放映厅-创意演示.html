<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>影放映厅 · 一个会"动"的人物相册</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ========== 全局基础 ========== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink-900: #0b0b0f;
    --ink-800: #101016;
    --amber: #f5a623;
    --ivory: #f4efe6;
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--ink-900);
    color: var(--ivory);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* 放映厅氛围背景 */
  .cinema-bg {
    background-color: var(--ink-900);
    background-image:
      radial-gradient(120% 80% at 50% 0%, rgba(245,166,35,0.10), transparent 55%),
      radial-gradient(80% 60% at 12% 100%, rgba(120,86,255,0.08), transparent 60%),
      radial-gradient(70% 60% at 88% 90%, rgba(245,166,35,0.05), transparent 60%);
  }
  .glass {
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .glow-amber { box-shadow: 0 0 0 1px rgba(245,166,35,0.35), 0 8px 30px rgba(245,166,35,0.28); }

  /* 动画 */
  @keyframes kenburnsA { 0%{transform:scale(1.02) translate3d(0,0,0)} 100%{transform:scale(1.16) translate3d(-2.5%,-2%,0)} }
  @keyframes kenburnsB { 0%{transform:scale(1.16) translate3d(2.5%,2%,0)} 100%{transform:scale(1.02) translate3d(0,0,0)} }
  @keyframes fadeIn { 0%{opacity:0} 100%{opacity:1} }
  @keyframes floatIn { 0%{opacity:0;transform:translateY(14px)} 100%{opacity:1;transform:translateY(0)} }
  @keyframes softPulse { 0%,100%{opacity:0.45} 50%{opacity:0.85} }

  /* 布局骨架 */
  #app { display:flex; flex-direction:column; height:100vh; width:100vw; }

  /* 顶部栏 */
  .topbar { position:relative; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:16px 20px; }
  @media(min-width:640px){ .topbar{ padding:16px 32px; } }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand .logo {
    width:36px;height:36px;display:flex;align-items:center;justify-content:center;
    border-radius:12px;background:rgba(245,166,35,0.15);color:var(--amber);
    ring:1px solid rgba(245,166,35,0.3);
    box-shadow: inset 0 0 0 1px rgba(245,166,35,0.3);
  }
  .brand h1 { font-family:"Fraunces",Georgia,serif; font-size:18px; font-weight:500; line-height:1.1; }
  .brand p { font-size:10px; letter-spacing:0.3em; text-transform:uppercase; color:rgba(244,239,230,0.4); }
  .top-right { display:flex; align-items:center; gap:12px; }
  .count-pill { font-family:ui-monospace,monospace; font-size:12px; color:rgba(244,239,230,0.6); padding:6px 12px; border-radius:9999px; }
  .count-pill b { color:var(--amber); font-weight:600; }
  .add-btn {
    display:inline-flex;align-items:center;gap:6px;border:none;cursor:pointer;
    padding:8px 16px;border-radius:9999px;font-size:14px;font-weight:500;color:var(--ivory);
  }
  .add-btn:hover{ background:rgba(255,255,255,0.1); color:var(--amber); }

  /* 主区域 */
  main { position:relative; flex:1; min-height:0; }

  /* 空状态 */
  .empty-wrap { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  .empty-title { font-family:"Fraunces",Georgia,serif; font-weight:300; font-size:30px; color:rgba(244,239,230,0.9); text-align:center; margin-bottom:32px; }
  @media(min-width:640px){ .empty-title{ font-size:38px; } }
  .empty-title em { font-style:normal; color:var(--amber); }
  .dropzone {
    position:relative; width:100%; max-width:520px; display:flex; flex-direction:column; align-items:center; gap:20px;
    padding:56px 32px; border-radius:24px; border:2px dashed rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.02); cursor:pointer; transition:all .3s; animation: floatIn .6s ease-out forwards;
  }
  .dropzone:hover{ border-color:rgba(245,166,35,0.5); background:rgba(255,255,255,0.04); }
  .dropzone.drag{ border-color:rgba(245,166,35,0.8); background:rgba(245,166,35,0.10); transform:scale(1.01); }
  .dz-icon { position:relative; width:80px;height:80px; display:flex;align-items:center;justify-content:center; border-radius:16px; background:rgba(245,166,35,0.15); color:var(--amber); }
  .dz-icon::after{ content:""; position:absolute; inset:0; border-radius:16px; background:rgba(245,166,35,0.10); animation:softPulse 3s ease-in-out infinite; }
  .dz-title { font-family:"Fraunces",Georgia,serif; font-size:22px; font-weight:500; text-align:center; }
  .dz-sub { font-size:13px; color:rgba(244,239,230,0.5); margin-top:4px; text-align:center; }
  .dz-tag { display:inline-flex;align-items:center;gap:6px; padding:6px 14px; border-radius:9999px; font-size:12px; font-weight:500; color:var(--amber); background:rgba(245,166,35,0.15); }
  .empty-tip { margin-top:24px; font-size:12px; color:rgba(244,239,230,0.4); text-align:center; }

  /* 舞台 */
  .stage { position:relative; height:100%; width:100%; overflow:hidden; }
  .stage .bg { position:absolute; inset:0; background:var(--ink-900); }
  .stage img { position:absolute; inset:0; height:100%; width:100%; object-fit:cover; }
  .stage img.cur { animation: fadeIn .7s ease-out forwards; }
  .vignette { pointer-events:none; position:absolute; inset:0; background:radial-gradient(120% 100% at 50% 50%, transparent 45%, rgba(0,0,0,0.55) 100%); }
  .bottom-fade { pointer-events:none; position:absolute; left:0; right:0; bottom:0; height:33%; background:linear-gradient(to top, var(--ink-900), rgba(11,11,15,0.4) 60%, transparent); }

  /* 导航箭头 */
  .nav-arrow {
    position:absolute; top:50%; transform:translateY(-50%); z-index:10;
    width:56px;height:56px; border:none; cursor:pointer; border-radius:9999px;
    background:transparent; color:rgba(244,239,230,0.55); display:none; align-items:center; justify-content:center;
    transition: all .3s;
  }
  .nav-arrow:hover{ background:rgba(255,255,255,0.1); color:var(--amber); }
  .nav-arrow.left{ left:20px; } .nav-arrow.right{ right:20px; }
  @media(min-width:768px){ .nav-arrow{ display:flex; } }

  /* 底部停靠区 */
  .dock { position:relative; z-index:20; display:flex; flex-direction:column; align-items:center; gap:12px; padding:0 12px 16px; }
  @media(min-width:640px){ .dock{ padding:0 16px 20px; } }
  .thumbs-wrap{ width:100%; max-width:768px; }

  /* 缩略图条 */
  .thumbs { display:flex; align-items:flex-end; gap:8px; overflow-x:auto; padding:8px; scrollbar-width:none; }
  .thumbs::-webkit-scrollbar{ display:none; }
  .thumb { position:relative; flex:0 0 auto; width:80px;height:56px; border:1px solid rgba(255,255,255,0.1); border-radius:8px; overflow:hidden; cursor:pointer; opacity:.6; transition: all .3s; background:none; padding:0; }
  @media(min-width:640px){ .thumb{ width:96px; height:64px; } }
  .thumb img{ width:100%;height:100%;object-fit:cover; display:block; }
  .thumb:hover{ opacity:1; border-color:rgba(255,255,255,0.4); }
  .thumb.active{ border-color:var(--amber); opacity:1; transform:translateY(-4px); box-shadow:0 8px 20px rgba(245,166,35,0.3), 0 0 0 2px rgba(245,166,35,0.4); }
  .thumb .num { position:absolute; right:2px; bottom:2px; font-size:10px; font-family:ui-monospace,monospace; padding:0 4px; border-radius:4px; line-height:1.4; }
  .thumb.active .num{ background:var(--amber); color:var(--ink-900); }
  .thumb:not(.active) .num{ background:rgba(0,0,0,0.6); color:rgba(244,239,230,0.7); }

  /* 控制台 */
  .console { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:9999px; box-shadow:0 20px 40px rgba(0,0,0,0.4); }
  @media(min-width:640px){ .console{ gap:12px; padding:8px 16px; } }
  .ibtn {
    flex:0 0 auto; width:40px;height:40px; border:none; cursor:pointer; border-radius:9999px;
    display:inline-flex;align-items:center;justify-content:center; background:transparent; color:rgba(244,239,230,0.7);
    transition: all .2s;
  }
  .ibtn:hover{ background:rgba(255,255,255,0.1); color:var(--ivory); }
  .ibtn:disabled{ cursor:not-allowed; opacity:.4; }
  .ibtn.danger:hover{ background:rgba(239,68,68,0.2); color:#fca5a5; }
  .divider{ width:1px; height:28px; background:rgba(255,255,255,0.1); flex:0 0 auto; margin:0 4px; }
  .speed { display:flex; align-items:center; gap:8px; padding:0 4px; }
  .speed input[type=range]{
    -webkit-appearance:none; appearance:none; height:4px; width:80px; border-radius:9999px; background:rgba(255,255,255,0.16); outline:none;
  }
  @media(min-width:640px){ .speed input[type=range]{ width:112px; } }
  .speed input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:14px;height:14px;border-radius:9999px; background:var(--amber); cursor:pointer; box-shadow:0 0 12px rgba(245,166,35,0.7); border:none; }
  .speed input[type=range]::-moz-range-thumb{ width:14px;height:14px;border-radius:9999px; background:var(--amber); cursor:pointer; border:none; }
  .speed-val{ width:36px; text-align:right; font-family:ui-monospace,monospace; font-size:12px; color:rgba(244,239,230,0.6); }

  /* 播放按钮 + 进度环 */
  .play-wrap{ position:relative; width:56px;height:56px; flex:0 0 auto; }
  .play-wrap svg{ position:absolute; inset:0; transform:rotate(-90deg); }
  .play-btn{
    position:absolute; inset:6px; border:none; cursor:pointer; border-radius:9999px;
    background:var(--amber); color:var(--ink-900); display:flex;align-items:center;justify-content:center;
    transition: all .2s;
  }
  .play-btn:hover{ filter:brightness(1.1); }
  .play-btn:active{ transform:scale(0.9); }
  .play-btn:disabled{ background:rgba(255,255,255,0.1); color:rgba(244,239,230,0.4); cursor:not-allowed; }

  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="app" class="cinema-bg">
  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="14.31" y1="8" x2="20.05" y2="17.94"/><line x1="9.69" y1="8" x2="21.17" y2="8"/><line x1="7.38" y1="12" x2="13.12" y2="2.06"/><line x1="9.69" y1="16" x2="3.95" y2="6.06"/><line x1="14.31" y1="16" x2="2.83" y2="16"/><line x1="16.62" y1="12" x2="10.88" y2="21.94"/></svg>
      </span>
      <div>
        <h1>影放映厅</h1>
        <p>放映厅 · Cinema</p>
      </div>
    </div>
    <div class="top-right">
      <span id="countPill" class="count-pill glass hidden"></span>
      <button id="addBtnTop" class="add-btn glass hidden">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        添加照片
      </button>
    </div>
  </header>

  <!-- 主区域 -->
  <main>
    <!-- 空状态 -->
    <div id="emptyState" class="empty-wrap">
      <p class="empty-title">把瞬间，放进一场<em>放映</em></p>
      <div id="dropzone" class="dropzone">
        <span class="dz-icon">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </span>
        <div>
          <div class="dz-title">拖拽人物照片到此处</div>
          <div class="dz-sub">或点击选择 · 支持多张同时上传</div>
        </div>
        <span class="dz-tag">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          JPG / PNG / WebP
        </span>
      </div>
      <p class="empty-tip">所有照片仅保存在你的浏览器内存中，不会上传到任何服务器</p>
    </div>

    <!-- 舞台 -->
    <div id="stage" class="stage hidden">
      <div class="bg"></div>
      <img id="prevLayer" alt="" />
      <img id="curLayer" alt="" />
      <div class="vignette"></div>
      <div class="bottom-fade"></div>
      <button class="nav-arrow left" id="navLeft" aria-label="上一张">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="nav-arrow right" id="navRight" aria-label="下一张">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </main>

  <!-- 底部停靠区 -->
  <div id="dock" class="dock hidden">
    <div class="thumbs-wrap">
      <div id="thumbs" class="thumbs"></div>
    </div>
    <div class="console glass">
      <!-- 上一张 -->
      <button class="ibtn" id="btnPrev" aria-label="上一张" title="上一张">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
      </button>
      <!-- 播放/暂停 + 进度环 -->
      <div class="play-wrap">
        <svg width="56" height="56" viewBox="0 0 60 60">
          <circle cx="30" cy="30" r="26" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"></circle>
          <circle id="progress" cx="30" cy="30" r="26" fill="none" stroke="#f5a623" stroke-width="2" stroke-linecap="round" stroke-dasharray="163.36" stroke-dashoffset="163.36"></circle>
        </svg>
        <button class="play-btn" id="btnPlay" aria-label="播放" title="播放/暂停">
          <svg id="iconPlay" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <svg id="iconPause" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
      </div>
      <!-- 下一张 -->
      <button class="ibtn" id="btnNext" aria-label="下一张" title="下一张">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
      <span class="divider"></span>
      <!-- 间隔 -->
      <div class="speed">
        <input type="range" id="rangeSpeed" min="1000" max="15000" step="500" value="4000" aria-label="切换间隔" />
        <span class="speed-val" id="speedVal">4.0s</span>
      </div>
      <span class="divider"></span>
      <!-- 删除 -->
      <button class="ibtn danger" id="btnDelete" aria-label="删除当前照片" title="删除当前照片">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
      </button>
      <!-- 清空 -->
      <button class="ibtn danger" id="btnClear" aria-label="清空相册" title="清空相册">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- 隐藏的文件输入 -->
<input id="fileInput" type="file" accept="image/*" multiple class="hidden" />

<script>
/* ============================================================
 * 影放映厅 —— 单文件创意演示版（原生 JS 实现，无任何依赖）
 * 功能：上传 / Ken Burns 动态展示 / 手动切换(按钮·键盘·缩略图·滑动) / 自动切换(播放·进度环·间隔调节) / 删除·清空
 * ============================================================ */
(function () {
  "use strict";

  // ---------- 状态 ----------
  var photos = [];          // 全部照片
  var currentIndex = 0;     // 当前展示索引
  var isPlaying = false;    // 是否自动播放
  var interval = 4000;      // 自动切换间隔(毫秒)
  var shownUrl = null;      // 当前已展示的 url(用于交叉淡出)
  var rafId = null;         // requestAnimationFrame 句柄
  var startTime = 0;        // 本轮切换起始时间

  // 进度环周长(半径 26)
  var CIRC = 2 * Math.PI * 26;

  // ---------- DOM ----------
  var $ = function (id) { return document.getElementById(id); };
  var emptyState = $("emptyState");
  var stage = $("stage");
  var dock = $("dock");
  var prevLayer = $("prevLayer");
  var curLayer = $("curLayer");
  var thumbs = $("thumbs");
  var countPill = $("countPill");
  var addBtnTop = $("addBtnTop");
  var dropzone = $("dropzone");
  var fileInput = $("fileInput");
  var navLeft = $("navLeft");
  var navRight = $("navRight");
  var btnPrev = $("btnPrev");
  var btnNext = $("btnNext");
  var btnPlay = $("btnPlay");
  var iconPlay = $("iconPlay");
  var iconPause = $("iconPause");
  var progress = $("progress");
  var rangeSpeed = $("rangeSpeed");
  var speedVal = $("speedVal");
  var btnDelete = $("btnDelete");
  var btnClear = $("btnClear");

  // ---------- 工具 ----------
  function genId() { return Date.now() + "-" + Math.random().toString(36).slice(2, 9); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  // ---------- 渲染 ----------
  function render() {
    var has = photos.length > 0;
    emptyState.classList.toggle("hidden", has);
    stage.classList.toggle("hidden", !has);
    dock.classList.toggle("hidden", !has);
    countPill.classList.toggle("hidden", !has);
    addBtnTop.classList.toggle("hidden", !has);

    if (has) {
      countPill.innerHTML = "<b>" + (currentIndex + 1) + "</b><span style='margin:0 4px;opacity:.4'>/</span>" + photos.length;
    }

    var canNav = photos.length >= 2;
    btnPrev.disabled = !canNav;
    btnNext.disabled = !canNav;
    btnPlay.disabled = !canNav;
    navLeft.style.display = canNav ? "" : "none";
    navRight.style.display = canNav ? "" : "none";

    renderThumbs();
    renderStage();
    updatePlayUI();
  }

  function renderStage() {
    var cur = photos[currentIndex];
    if (!cur) return;
    if (cur.url !== shownUrl) {
      // 把当前图挪到下层，新图淡入覆盖，实现交叉淡出
      prevLayer.src = shownUrl || "";
      prevLayer.style.opacity = shownUrl ? "1" : "0";
      curLayer.src = cur.url;
      curLayer.alt = cur.name || "照片";
      // 交替 Ken Burns 方向
      var anim = "fadeIn .7s ease-out forwards, " + (currentIndex % 2 === 0 ? "kenburnsA" : "kenburnsB") + " 9s ease-out forwards";
      curLayer.style.animation = anim;
      shownUrl = cur.url;
    }
  }

  function renderThumbs() {
    thumbs.innerHTML = "";
    photos.forEach(function (p, i) {
      var btn = document.createElement("button");
      btn.className = "thumb" + (i === currentIndex ? " active" : "");
      btn.setAttribute("aria-label", "查看第 " + (i + 1) + " 张");
      var img = document.createElement("img");
      img.src = p.url;
      img.alt = p.name;
      img.loading = "lazy";
      var num = document.createElement("span");
      num.className = "num";
      num.textContent = (i + 1);
      btn.appendChild(img);
      btn.appendChild(num);
      btn.addEventListener("click", function () { goTo(i); });
      thumbs.appendChild(btn);
    });
    // 将激活项滚动到可视区中心
    var active = thumbs.querySelector(".thumb.active");
    if (active) {
      var center = active.offsetLeft + active.offsetWidth / 2;
      thumbs.scrollTo({ left: center - thumbs.offsetWidth / 2, behavior: "smooth" });
    }
  }

  function updatePlayUI() {
    iconPlay.classList.toggle("hidden", isPlaying);
    iconPause.classList.toggle("hidden", !isPlaying);
    btnPlay.setAttribute("aria-label", isPlaying ? "暂停" : "播放");
  }

  // ---------- 动作 ----------
  function addFiles(files) {
    var arr = files ? Array.prototype.slice.call(files) : [];
    var imgs = arr.filter(function (f) { return f.type.indexOf("image/") === 0; });
    if (imgs.length === 0) return;
    var firstAdd = photos.length === 0;
    imgs.forEach(function (f) {
      photos.push({ id: genId(), url: URL.createObjectURL(f), name: f.name, size: f.size, createdAt: Date.now() });
    });
    if (firstAdd) currentIndex = 0;
    render();
  }

  function removeCurrent() {
    var cur = photos[currentIndex];
    if (!cur) return;
    if (cur.url.indexOf("blob:") === 0) URL.revokeObjectURL(cur.url);
    var targetIndex = currentIndex;
    photos.splice(targetIndex, 1);
    if (photos.length === 0) { currentIndex = 0; isPlaying = false; stopTicker(); }
    else if (targetIndex < currentIndex) { currentIndex -= 1; }
    else { currentIndex = clamp(currentIndex, 0, photos.length - 1); }
    shownUrl = null; // 强制重绘
    render();
    restartTickerIfNeeded();
  }

  function clearAll() {
    photos.forEach(function (p) { if (p.url.indexOf("blob:") === 0) URL.revokeObjectURL(p.url); });
    photos = [];
    currentIndex = 0;
    isPlaying = false;
    shownUrl = null;
    stopTicker();
    render();
  }

  function next() { if (photos.length) { currentIndex = (currentIndex + 1) % photos.length; render(); } }
  function prev() { if (photos.length) { currentIndex = (currentIndex - 1 + photos.length) % photos.length; render(); } }
  function goTo(i) {
    if (!photos.length) return;
    currentIndex = ((i % photos.length) + photos.length) % photos.length;
    render();
    restartTickerIfNeeded();
  }

  function togglePlay() {
    if (photos.length < 2) return;
    isPlaying = !isPlaying;
    updatePlayUI();
    if (isPlaying) startTicker(); else stopTicker();
  }

  // ---------- 自动播放进度环 ----------
  function startTicker() {
    stopTicker();
    startTime = performance.now();
    function tick(now) {
      var ratio = clamp((now - startTime) / interval, 0, 1);
      progress.style.strokeDashoffset = String(CIRC * (1 - ratio));
      if (ratio >= 1) { next(); startTime = performance.now(); }
      if (isPlaying) rafId = requestAnimationFrame(tick);
    }
    rafId = requestAnimationFrame(tick);
  }
  function stopTicker() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    progress.style.strokeDashoffset = String(CIRC);
  }
  // 切换/跳转后若正在播放，重置计时
  function restartTickerIfNeeded() {
    if (isPlaying) startTicker();
  }

  // ---------- 事件绑定 ----------
  function openPicker() { fileInput.click(); }

  dropzone.addEventListener("click", openPicker);
  addBtnTop.addEventListener("click", openPicker);
  fileInput.addEventListener("change", function (e) {
    addFiles(e.target.files);
    e.target.value = "";
  });

  // 拖拽上传
  ["dragenter", "dragover"].forEach(function (ev) {
    dropzone.addEventListener(ev, function (e) { e.preventDefault(); dropzone.classList.add("drag"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    dropzone.addEventListener(ev, function (e) { e.preventDefault(); dropzone.classList.remove("drag"); });
  });
  dropzone.addEventListener("drop", function (e) {
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
  });

  // 控制台按钮
  btnPrev.addEventListener("click", prev);
  btnNext.addEventListener("click", next);
  btnPlay.addEventListener("click", togglePlay);
  btnDelete.addEventListener("click", removeCurrent);
  btnClear.addEventListener("click", clearAll);
  navLeft.addEventListener("click", prev);
  navRight.addEventListener("click", next);

  // 间隔滑块
  rangeSpeed.addEventListener("input", function (e) {
    interval = Number(e.target.value);
    speedVal.textContent = (interval / 1000).toFixed(1) + "s";
    if (isPlaying) startTicker();
  });

  // 键盘：左右切换，空格播放/暂停
  window.addEventListener("keydown", function (e) {
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { next(); restartTickerIfNeeded(); }
    else if (e.key === "ArrowLeft") { prev(); restartTickerIfNeeded(); }
    else if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  });

  // 触摸滑动切换
  var sx = 0, sy = 0, tracking = false;
  stage.addEventListener("touchstart", function (e) {
    var t = e.touches[0]; sx = t.clientX; sy = t.clientY; tracking = true;
  }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (!tracking) return; tracking = false;
    var t = e.changedTouches[0]; var dx = t.clientX - sx; var dy = t.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) next(); else prev();
      restartTickerIfNeeded();
    }
  }, { passive: true });

  // 初始渲染
  render();
})();
</script>
</body>
</html>
