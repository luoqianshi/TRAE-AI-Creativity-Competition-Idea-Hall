<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公安警情智能研判系统 - 数据大屏</title>
    <link href="/static/bootstrap.min.css" rel="stylesheet">
    <script src="/static/echarts.min.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/permissions.js?v=20260615"></script>
</head>
<body class="dashboard-body">
    <script>
        if (!Permissions.isLoggedIn()) {
            window.location.href = '/login.html';
        }
    </script>
    <div class="dashboard-container">
        <!-- 顶部标题栏 -->
        <header class="dashboard-header">
            <div class="dashboard-header-left">
                <div class="dashboard-time" id="current-time">--:--:--</div>
                <div class="dashboard-date" id="current-date">----年--月--日</div>
            </div>
            <h1 class="dashboard-title">公安警情智能研判系统</h1>
            <div class="dashboard-header-right">
                <a href="/" class="dashboard-link">🔙 返回管理</a>
            </div>
        </header>
        
        <!-- 主要内容区域 -->
        <div class="dashboard-main">
            <!-- 左侧列 -->
            <div class="dashboard-left">
                <div class="dashboard-card">
                    <div class="dashboard-card-title">警情总数统计</div>
                    <div id="total-cases-chart" style="height: 300px;"></div>
                </div>
                
                <div class="dashboard-card">
                    <div class="dashboard-card-title">警情类型分布</div>
                    <div id="case-types-chart" style="height: 300px;"></div>
                </div>
                
                <div class="dashboard-card">
                    <div class="dashboard-card-title">新增警情趋势</div>
                    <div id="new-cases-trend-chart" style="height: 300px;"></div>
                </div>
            </div>
            
            <!-- 中间列 -->
            <div class="dashboard-center">
                <div class="dashboard-card">
                    <div class="dashboard-card-title">警情智能分析数据</div>
                    <div style="padding: 20px;">
                        <div class="summary-item">
                            <div class="summary-label">警情总数</div>
                            <div class="summary-value total" id="summary-total">0</div>
                        </div>
                        <div class="summary-grid">
                            <div class="summary-item">
                                <div class="summary-label">极高风险</div>
                                <div class="summary-value critical" id="summary-critical">0</div>
                            </div>
                            <div class="summary-item">
                                <div class="summary-label">高风险</div>
                                <div class="summary-value high" id="summary-high">0</div>
                            </div>
                            <div class="summary-item">
                                <div class="summary-label">中风险</div>
                                <div class="summary-value medium" id="summary-medium">0</div>
                            </div>
                            <div class="summary-item">
                                <div class="summary-label">低风险</div>
                                <div class="summary-value low" id="summary-low">0</div>
                            </div>
                            <div class="summary-item">
                                <div class="summary-label">极低风险</div>
                                <div class="summary-value minimal" id="summary-minimal">0</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="dashboard-card">
                    <div class="dashboard-card-title">警情风险等级分布</div>
                    <div id="risk-level-chart" style="height: 350px;"></div>
                </div>
                
                <div class="dashboard-card">
                    <div class="dashboard-card-title">重点人员统计</div>
                    <div style="padding: 20px;">
                        <div class="summary-grid">
                            <div class="summary-item">
                                <div class="summary-label">重点人员</div>
                                <div class="summary-value total" id="summary-key-persons">0</div>
                            </div>
                            <div class="summary-item">
                                <div class="summary-label">精神障碍患者</div>
                                <div class="summary-value warning" id="summary-mental-patients">0</div>
                            </div>
                            <div class="summary-item">
                                <div class="summary-label">刑满释放人员</div>
                                <div class="summary-value danger" id="summary-released-prisoners">0</div>
                            </div>
                            <div class="summary-item">
                                <div class="summary-label">不良未成年人</div>
                                <div class="summary-value high" id="summary-juvenile-delinquents">0</div>
                            </div>
                            <div class="summary-item">
                                <div class="summary-label">涉酒人员</div>
                                <div class="summary-value success" id="summary-drunk-persons">0</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 右侧列 -->
            <div class="dashboard-right">
                <div class="dashboard-card">
                    <div class="dashboard-card-title">地域分布</div>
                    <div id="region-distribution-chart" style="height: 300px;"></div>
                </div>
                
                <div class="dashboard-card">
                    <div class="dashboard-card-title">最新警情</div>
                    <div id="latest-cases" class="latest-cases">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>警情编号</th>
                                    <th>类型</th>
                                    <th>时间</th>
                                    <th>风险等级</th>
                                </tr>
                            </thead>
                            <tbody id="latest-cases-body"></tbody>
                        </table>
                    </div>
                </div>
                
                <div class="dashboard-card">
                    <div class="dashboard-card-title">最新分析结果</div>
                    <div id="latest-analysis" class="latest-cases">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>警情编号</th>
                                    <th>风险等级</th>
                                    <th>概率</th>
                                    <th>优先级</th>
                                </tr>
                            </thead>
                            <tbody id="latest-analysis-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api';
        
        function updateTime() {
            const now = new Date();
            const dateStr = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日';
            const timeStr = now.toLocaleTimeString('zh-CN');
            document.getElementById('current-date').textContent = dateStr;
            document.getElementById('current-time').textContent = timeStr;
        }
        
        setInterval(updateTime, 1000);
        updateTime();
        
        let totalCasesChart, caseTypesChart, newCasesTrendChart, riskLevelChart, regionDistributionChart;
        
        function initCharts() {
            totalCasesChart = echarts.init(document.getElementById('total-cases-chart'));
            caseTypesChart = echarts.init(document.getElementById('case-types-chart'));
            newCasesTrendChart = echarts.init(document.getElementById('new-cases-trend-chart'));
            riskLevelChart = echarts.init(document.getElementById('risk-level-chart'));
            regionDistributionChart = echarts.init(document.getElementById('region-distribution-chart'));
        }
        
        function getRiskLevelColor(level) {
            const colorMap = {
                '极高风险': '#dc3545',
                '高风险': '#fd7e14',
                '中风险': '#ffc107',
                '低风险': '#20c997',
                '极低风险': '#0dcaf0'
            };
            return colorMap[level] || '#6c757d';
        }
        
        function getRiskLevelBadge(level) {
            const classMap = {
                '极高风险': 'bg-danger',
                '高风险': 'bg-orange',
                '中风险': 'bg-warning',
                '低风险': 'bg-success',
                '极低风险': 'bg-info'
            };
            return classMap[level] || 'bg-secondary';
        }
        
        async function safeFetch(url) {
            try {
                // 携带 token 发起请求（无 token 时由 requireAuth 拦截跳登录）
                const token = localStorage.getItem('access_token');
                const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
                const r = await fetch(url, { headers });
                if (!r.ok) {
                    console.warn(`API 警告: ${url} 返回 ${r.status}`);
                    return null;
                }
                return await r.json();
            } catch (e) {
                console.error(`API 失败: ${url}`, e);
                return null;
            }
        }

        async function loadDashboardData() {
            try {
                const [summaryRes, typesRes, trendRes, regionRes, latestRes, analysisRes] = await Promise.all([
                    safeFetch(`${API_BASE}/cases/summary`),
                    safeFetch(`${API_BASE}/analysis/case-types`),
                    safeFetch(`${API_BASE}/cases/trend?days=7`),
                    safeFetch(`${API_BASE}/analysis/region-distribution`),
                    safeFetch(`${API_BASE}/cases/list?page=1&page_size=10`),
                    safeFetch(`${API_BASE}/analysis/list?page=1&page_size=10`)
                ]);
                
                const summary = summaryRes ? (summaryRes.data || summaryRes) : {total_cases: 0};
                const types = typesRes ? (typesRes.data || typesRes) : [];
                const trend = trendRes ? (trendRes.data || trendRes) : [];
                const region = regionRes ? (regionRes.data || regionRes) : [];
                const latest = latestRes ? (latestRes.items || latestRes.data?.items || []) : [];
                const analysis = analysisRes ? (analysisRes.items || analysisRes.data?.items || []) : [];
                
                document.getElementById('summary-total').textContent = summary.total_cases || 0;
                document.getElementById('summary-critical').textContent = summary.critical_risk || 0;
                document.getElementById('summary-high').textContent = summary.high_risk || 0;
                document.getElementById('summary-medium').textContent = summary.medium_risk || 0;
                document.getElementById('summary-low').textContent = summary.low_risk || 0;
                document.getElementById('summary-minimal').textContent = summary.minimal_risk || 0;
                
                // 仅管理员/超级管理员可查看敏感人员统计（业务人员无权限，避免 403）
                const userInfo = JSON.parse(localStorage.getItem('user_info') || '{}');
                const canViewSensitive = userInfo.role === 'super_admin' || userInfo.role === 'admin';
                
                if (canViewSensitive) {
                    try {
                        async function safePersonFetch(url) {
                            try {
                                const r = await Permissions.authFetch(url);
                                if (r.ok) {
                                    return await r.json();
                                }
                                return { total: 0 };
                            } catch (e) {
                                return { total: 0 };
                            }
                        }
                        const keyPersons = await safePersonFetch(`${API_BASE}/persons/key?page=1&page_size=1`);
                        const mentalPatients = await safePersonFetch(`${API_BASE}/persons/mental?page=1&page_size=1`);
                        const releasedPrisoners = await safePersonFetch(`${API_BASE}/persons/released?page=1&page_size=1`);
                        const juvenileDelinquents = await safePersonFetch(`${API_BASE}/persons/juvenile?page=1&page_size=1`);
                        const drunkPersons = await safePersonFetch(`${API_BASE}/persons/drunk?page=1&page_size=1`);

                        document.getElementById('summary-key-persons').textContent = keyPersons.total || 0;
                        document.getElementById('summary-mental-patients').textContent = mentalPatients.total || 0;
                        document.getElementById('summary-released-prisoners').textContent = releasedPrisoners.total || 0;
                        document.getElementById('summary-juvenile-delinquents').textContent = juvenileDelinquents.total || 0;
                        document.getElementById('summary-drunk-persons').textContent = drunkPersons.total || 0;
                    } catch (e) {
                        console.error('人员统计加载失败', e);
                    }
                } else {
                    // 业务人员：敏感人员统计显示为 --（无权访问）
                    document.getElementById('summary-key-persons').textContent = '--';
                    document.getElementById('summary-mental-patients').textContent = '--';
                    document.getElementById('summary-released-prisoners').textContent = '--';
                    document.getElementById('summary-juvenile-delinquents').textContent = '--';
                    document.getElementById('summary-drunk-persons').textContent = '--';
                }
                
                const totalCasesOption = {
                    series: [{
                        type: 'gauge',
                        progress: { show: true, width: 18 },
                        axisLine: { lineStyle: { width: 18 } },
                        axisTick: { show: false },
                        splitLine: { length: 15, lineStyle: { width: 2, color: '#999' } },
                        axisLabel: { distance: 25, color: '#999', fontSize: 14 },
                        anchor: { show: true, showAbove: true, size: 20, itemStyle: { borderWidth: 10 } },
                        title: { show: false },
                        detail: {
                            valueAnimation: true,
                            fontSize: 36,
                            offsetCenter: [0, '70%'],
                            color: '#1d4e89',
                            formatter: '{value} 起'
                        },
                        data: [{ value: summary.total_cases || 0, name: '警情总数' }],
                        max: Math.max(100, (summary.total_cases || 0) * 2)
                    }]
                };
                totalCasesChart.setOption(totalCasesOption);
                
                const caseTypesData = Array.isArray(types) ? types.map(t => ({
                    name: t.type || t.case_type || '其他',
                    value: t.count || 0
                })) : [];
                
                const caseTypesOption = {
                    tooltip: { trigger: 'item' },
                    legend: { orient: 'vertical', left: 'left', textStyle: { color: '#adb5bd' } },
                    series: [{
                        type: 'pie',
                        radius: '60%',
                        data: caseTypesData,
                        emphasis: { itemStyle: { shadowBlur: 10, shadowOffsetX: 0, shadowColor: 'rgba(0, 0, 0, 0.5)' } },
                        label: { color: '#adb5bd' }
                    }]
                };
                caseTypesChart.setOption(caseTypesOption);
                
                const trendLabels = Array.isArray(trend) ? trend.map(t => t.date || t.label || '') : [];
                const trendValues = Array.isArray(trend) ? trend.map(t => t.count || t.value || 0) : [];
                
                const newCasesTrendOption = {
                    tooltip: { trigger: 'axis' },
                    grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                    xAxis: { type: 'category', data: trendLabels, axisLabel: { color: '#adb5bd' } },
                    yAxis: { type: 'value', axisLabel: { color: '#adb5bd' } },
                    series: [{
                        type: 'line',
                        smooth: true,
                        data: trendValues,
                        areaStyle: { color: 'rgba(29, 78, 137, 0.3)' },
                        lineStyle: { color: '#1d4e89', width: 3 },
                        itemStyle: { color: '#1d4e89' }
                    }]
                };
                newCasesTrendChart.setOption(newCasesTrendOption);
                
                const riskLevelData = [
                    { name: '极高风险', value: summary.critical_risk || 0, itemStyle: { color: '#dc3545' } },
                    { name: '高风险', value: summary.high_risk || 0, itemStyle: { color: '#fd7e14' } },
                    { name: '中风险', value: summary.medium_risk || 0, itemStyle: { color: '#ffc107' } },
                    { name: '低风险', value: summary.low_risk || 0, itemStyle: { color: '#20c997' } },
                    { name: '极低风险', value: summary.minimal_risk || 0, itemStyle: { color: '#0dcaf0' } }
                ];
                
                const riskLevelOption = {
                    tooltip: { trigger: 'item' },
                    legend: { orient: 'vertical', left: 'left', textStyle: { color: '#adb5bd' } },
                    series: [{
                        type: 'pie',
                        radius: ['40%', '70%'],
                        avoidLabelOverlap: false,
                        itemStyle: { borderRadius: 10, borderColor: '#0a1628', borderWidth: 2 },
                        label: { show: false, position: 'center' },
                        emphasis: { label: { show: true, fontSize: 24, fontWeight: 'bold', color: '#fff' } },
                        labelLine: { show: false },
                        data: riskLevelData
                    }]
                };
                riskLevelChart.setOption(riskLevelOption);
                
                const regionData = Array.isArray(region) ? region.map(r => ({
                    name: r.region || r.police_station || '未知',
                    value: r.count || 0
                })) : [];
                
                const regionDistributionOption = {
                    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                    grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                    xAxis: { type: 'value', axisLabel: { color: '#adb5bd' } },
                    yAxis: { type: 'category', data: regionData.map(r => r.name), axisLabel: { color: '#adb5bd' } },
                    series: [{
                        type: 'bar',
                        data: regionData.map(r => r.value),
                        itemStyle: { color: '#1d4e89' }
                    }]
                };
                regionDistributionChart.setOption(regionDistributionOption);
                
                const latestTableBody = document.getElementById('latest-cases-body');
                latestTableBody.innerHTML = latest.slice(0, 10).map(c => `
                    <tr>
                        <td>${c.case_number || ''}</td>
                        <td>${c.case_type || ''}</td>
                        <td>${new Date(c.alarm_time || c.created_at).toLocaleString('zh-CN')}</td>
                        <td><span class="badge ${getRiskLevelBadge(c.risk_level)}">${c.risk_level || '未评估'}</span></td>
                    </tr>
                `).join('');
                
                const analysisTableBody = document.getElementById('latest-analysis-body');
                analysisTableBody.innerHTML = analysis.slice(0, 10).map(a => `
                    <tr>
                        <td>${a.case_number || ''}</td>
                        <td><span class="badge ${getRiskLevelBadge(a.risk_level)}">${a.risk_level || ''}</span></td>
                        <td>${((a.risk_probability || 0) * 100).toFixed(1)}%</td>
                        <td>${a.priority || ''}</td>
                    </tr>
                `).join('');
                
            } catch (error) {
                console.error('加载大屏数据失败:', error);
            }
        }
        
        window.addEventListener('load', () => {
            initCharts();
            loadDashboardData();
            window.addEventListener('resize', () => {
                totalCasesChart && totalCasesChart.resize();
                caseTypesChart && caseTypesChart.resize();
                newCasesTrendChart && newCasesTrendChart.resize();
                riskLevelChart && riskLevelChart.resize();
                regionDistributionChart && regionDistributionChart.resize();
            });
        });
        
        setInterval(loadDashboardData, 60000);
    </script>
</body>
</html>
