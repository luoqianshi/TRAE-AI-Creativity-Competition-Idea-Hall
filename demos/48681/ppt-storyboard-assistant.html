<script>
// ===== State Management =====
let state = {
  global: {
    color: '#6c5ce7',
    audience: '',
    emotion: ''
  },
  cards: [],
  nextId: 1
};

// ===== Initialize =====
function init() {
  loadFromStorage();
  renderCards();
  syncGlobalUI();
  updateStats();
  autoSave();
}

// ===== Storage =====
function loadFromStorage() {
  try {
    const saved = localStorage.getItem('ppt-storyboard-data');
    if (saved) {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
    }
  } catch (e) {
    console.error('Failed to load from storage:', e);
  }
}

function saveToStorage() {
  try {
    localStorage.setItem('ppt-storyboard-data', JSON.stringify(state));
  } catch (e) {
    console.error('Failed to save to storage:', e);
  }
}

let autoSaveTimer;
function autoSave() {
  document.addEventListener('input', () => {
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(() => {
      collectGlobalData();
      saveToStorage();
      updateStats();
    }, 500);
  });
}

// ===== Global Anchor Functions =====
function syncColorText() {
  const color = document.getElementById('globalColor').value;
  document.getElementById('globalColorText').value = color;
  state.global.color = color;
  updateColorPresetActive(color);
}

function syncColorPicker() {
  const text = document.getElementById('globalColorText').value;
  if (/^#[0-9A-Fa-f]{6}$/.test(text)) {
    document.getElementById('globalColor').value = text;
    state.global.color = text;
    updateColorPresetActive(text);
  }
}

function setColor(hex) {
  document.getElementById('globalColor').value = hex;
  document.getElementById('globalColorText').value = hex;
  state.global.color = hex;
  updateColorPresetActive(hex);
}

function updateColorPresetActive(hex) {
  document.querySelectorAll('.color-preset').forEach(el => {
    el.classList.toggle('active', el.style.backgroundColor === hexToRgb(hex));
  });
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgb(${r}, ${g}, ${b})`;
}

function syncGlobalUI() {
  document.getElementById('globalColor').value = state.global.color;
  document.getElementById('globalColorText').value = state.global.color;
  document.getElementById('globalAudience').value = state.global.audience || '';
  document.getElementById('globalEmotion').value = state.global.emotion || '';
  updateColorPresetActive(state.global.color);
}

function collectGlobalData() {
  state.global.color = document.getElementById('globalColor').value;
  state.global.audience = document.getElementById('globalAudience').value;
  state.global.emotion = document.getElementById('globalEmotion').value;
}

// ===== Card Functions =====
function addCard() {
  const card = {
    id: state.nextId++,
    title: '',
    requirement: '',
    layout: '',
    customLayout: '',
    images: [],
    notes: ''
  };
  state.cards.push(card);
  renderCards();
  saveToStorage();
  updateStats();
  showToast('已添加新的分镜卡片', 'success');
}

function removeCard(id) {
  state.cards = state.cards.filter(c => c.id !== id);
  renderCards();
  saveToStorage();
  updateStats();
  showToast('已删除分镜卡片', 'info');
}

function moveCard(id, direction) {
  const idx = state.cards.findIndex(c => c.id === id);
  if (idx < 0) return;
  const newIdx = idx + direction;
  if (newIdx < 0 || newIdx >= state.cards.length) return;
  [state.cards[idx], state.cards[newIdx]] = [state.cards[newIdx], state.cards[idx]];
  renderCards();
  saveToStorage();
}

function duplicateCard(id) {
  const idx = state.cards.findIndex(c => c.id === id);
  if (idx < 0) return;
  const orig = state.cards[idx];
  const clone = {
    ...JSON.parse(JSON.stringify(orig)),
    id: state.nextId++,
    title: orig.title + ' (副本)',
    images: []
  };
  state.cards.splice(idx + 1, 0, clone);
  renderCards();
  saveToStorage();
  updateStats();
  showToast('已复制分镜卡片', 'success');
}

function collectCardData(id) {
  const card = state.cards.find(c => c.id === id);
  if (!card) return;
  card.title = document.getElementById(`card-title-${id}`).value;
  card.requirement = document.getElementById(`card-req-${id}`).value;
  card.layout = document.getElementById(`card-layout-${id}`).value;
  card.customLayout = document.getElementById(`card-custom-layout-${id}`) ? document.getElementById(`card-custom-layout-${id}`).value : '';
  card.notes = document.getElementById(`card-notes-${id}`) ? document.getElementById(`card-notes-${id}`).value : '';
}

const LAYOUT_OPTIONS = [
  { value: 'full-screen', label: '全屏大图' },
  { value: 'center-focus', label: '居中聚焦' },
  { value: 'left-text-right-image', label: '左文右图' },
  { value: 'left-image-right-text', label: '左图右文' },
  { value: 'three-columns', label: '三栏并列' },
  { value: 'asymmetric-compare', label: '非对称对比' },
  { value: 'timeline', label: '时间轴' },
  { value: 'top-title-bottom-content', label: '上标题下内容' },
  { value: 'card-grid', label: '卡片网格' },
  { value: 'icon-text-list', label: '图标+文字列表' },
  { value: 'quote-highlight', label: '引言高亮' },
  { value: 'data-chart', label: '数据图表' },
  { value: 'split-half', label: '左右平分' },
  { value: 'custom', label: '自定义...' }
];

function renderCards() {
  const container = document.getElementById('cardsContainer');
  const empty = document.getElementById('emptyState');

  if (state.cards.length === 0) {
    container.innerHTML = '';
    container.appendChild(createEmptyState());
    document.getElementById('cardCount').textContent = '0 张卡片';
    return;
  }

  document.getElementById('cardCount').textContent = `${state.cards.length} 张卡片`;
  container.innerHTML = state.cards.map((card, idx) => renderSingleCard(card, idx)).join('');
}

function createEmptyState() {
  const div = document.createElement('div');
  div.className = 'empty-state';
  div.id = 'emptyState';
  div.innerHTML = `
    <div class="empty-icon">📝</div>
    <h3>还没有分镜卡片</h3>
    <p>点击下方按钮，开始创建你的第一张PPT分镜</p>
  `;
  return div;
}

function renderSingleCard(card, idx) {
  const layoutOptions = LAYOUT_OPTIONS.map(opt =>
    `<option value="${opt.value}" ${card.layout === opt.value ? 'selected' : ''}>${opt.label}</option>`
  ).join('');

  const imagePreviews = card.images.map((img, imgIdx) =>
    `<div class="uploaded-image">
      <img src="${img.data}" alt="上传图片">
      <button class="remove-img" onclick="removeImage(${card.id}, ${imgIdx})">✕</button>
    </div>`
  ).join('');

  const showCustomLayout = card.layout === 'custom' ? '' : 'display:none;';

  return `
    <div class="storyboard-card" data-id="${card.id}">
      <div class="card-header">
        <div class="card-header-left">
          <div class="card-number">${idx + 1}</div>
          <input type="text" class="card-title-input" id="card-title-${card.id}"
            placeholder="输入页面标题..." value="${escapeHtml(card.title)}"
            onchange="collectCardData(${card.id}); saveToStorage();">
        </div>
        <div class="card-header-actions">
          <button class="btn-icon" onclick="moveCard(${card.id}, -1)" title="上移" ${idx === 0 ? 'disabled style="opacity:0.3"' : ''}>↑</button>
          <button class="btn-icon" onclick="moveCard(${card.id}, 1)" title="下移" ${idx === state.cards.length - 1 ? 'disabled style="opacity:0.3"' : ''}>↓</button>
          <button class="btn-icon" onclick="duplicateCard(${card.id})" title="复制">📋</button>
          <button class="btn-icon" onclick="removeCard(${card.id})" title="删除" style="color:var(--danger)">🗑️</button>
        </div>
      </div>
      <div class="card-body">
        <div class="field-group">
          <label>📐 布局方式</label>
          <select id="card-layout-${card.id}" onchange="onLayoutChange(${card.id}); collectCardData(${card.id}); saveToStorage();">
            <option value="">-- 选择布局 --</option>
            ${layoutOptions}
          </select>
          <input type="text" id="card-custom-layout-${card.id}" placeholder="描述自定义布局..." value="${escapeHtml(card.customLayout)}" style="margin-top:8px; display:none; width:100%; padding:8px 12px; background:var(--bg); border:1px solid var(--rule); border-radius:var(--radius-sm); color:var(--ink); font-family:inherit; font-size:0.85rem;" onchange="collectCardData(${card.id}); saveToStorage();">
        </div>
        <div class="field-group">
          <label>📝 需求描述</label>
          <textarea id="card-req-${card.id}" placeholder="描述这一页PPT需要展示什么内容、传达什么信息...&#10;&#10;例如：&#10;- 标题：2024年Q3营收概览&#10;- 左侧展示关键数据指标卡片（营收、利润、增长率）&#10;- 右侧展示营收趋势折线图"
            onchange="collectCardData(${card.id}); saveToStorage();">${escapeHtml(card.requirement)}</textarea>
        </div>
        <div class="field-group full-width">
          <label>📎 补充说明</label>
          <textarea id="card-notes-${card.id}" placeholder="补充说明、设计偏好、参考链接等（选填）" rows="2" style="min-height:50px;"
            onchange="collectCardData(${card.id}); saveToStorage();">${escapeHtml(card.notes || '')}</textarea>
        </div>
        <div class="field-group full-width">
          <label>🖼️ 图片素材</label>
          <div class="upload-zone" id="upload-zone-${card.id}"
            onclick="document.getElementById('file-input-${card.id}').click()"
            ondragover="event.preventDefault(); this.classList.add('dragover')"
            ondragleave="this.classList.remove('dragover')"
            ondrop="handleDrop(event, ${card.id}); this.classList.remove('dragover')">
            <div class="upload-icon">📁</div>
            <div class="upload-text">点击上传或拖拽图片到此处</div>
            <div class="upload-hint">支持 JPG、PNG、SVG、GIF 格式（图片仅存储在本地浏览器中）</div>
            <input type="file" id="file-input-${card.id}" multiple accept="image/*" onchange="handleFileSelect(event, ${card.id})">
          </div>
          <div class="uploaded-images" id="images-${card.id}">
            ${imagePreviews}
          </div>
        </div>
      </div>
    </div>
  `;
}

function onLayoutChange(id) {
  const layout = document.getElementById(`card-layout-${id}`).value;
  const customInput = document.getElementById(`card-custom-layout-${id}`);
  if (customInput) {
    customInput.style.display = layout === 'custom' ? 'block' : 'none';
  }
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ===== Image Upload =====
function handleFileSelect(event, cardId) {
  const files = event.target.files;
  if (!files.length) return;
  processFiles(files, cardId);
}

function handleDrop(event, cardId) {
  event.preventDefault();
  const files = event.dataTransfer.files;
  if (!files.length) return;
  processFiles(files, cardId);
}

function processFiles(files, cardId) {
  const card = state.cards.find(c => c.id === cardId);
  if (!card) return;

  Array.from(files).forEach(file => {
    if (!file.type.startsWith('image/')) return;
    if (file.size > 10 * 1024 * 1024) {
      showToast('图片大小不能超过10MB', 'error');
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      card.images.push({
        name: file.name,
        data: e.target.result,
        size: file.size
      });
      updateImagePreview(cardId);
      saveToStorage();
      updateStats();
    };
    reader.readAsDataURL(file);
  });
}

function updateImagePreview(cardId) {
  const card = state.cards.find(c => c.id === cardId);
  if (!card) return;
  const container = document.getElementById(`images-${cardId}`);
  if (!container) return;
  container.innerHTML = card.images.map((img, idx) =>
    `<div class="uploaded-image">
      <img src="${img.data}" alt="${escapeHtml(img.name)}">
      <button class="remove-img" onclick="removeImage(${cardId}, ${idx})">✕</button>
    </div>`
  ).join('');
}

function removeImage(cardId, imgIdx) {
  const card = state.cards.find(c => c.id === cardId);
  if (!card) return;
  card.images.splice(imgIdx, 1);
  updateImagePreview(cardId);
  saveToStorage();
  updateStats();
}

// ===== Stats =====
function updateStats() {
  document.getElementById('statPages').textContent = state.cards.length;
  const totalImages = state.cards.reduce((sum, c) => sum + c.images.length, 0);
  document.getElementById('statImages').textContent = totalImages;
}

// ===== Preview Output =====
function previewOutput() {
  collectGlobalData();
  state.cards.forEach(c => collectCardData(c.id));

  const output = generatePromptText();
  if (!output.trim()) {
    showToast('请先添加分镜卡片并填写内容', 'error');
    return;
  }

  const overlay = document.createElement('div');
  overlay.className = 'preview-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="preview-panel">
      <button class="preview-close" onclick="this.closest('.preview-overlay').remove()">✕</button>
      <h3>👁️ 提示词预览</h3>
      <div class="preview-content">${escapeHtml(output)}</div>
      <div style="margin-top:1rem; text-align:right;">
        <button class="btn btn-primary btn-sm" onclick="copyPromptText()">📋 复制到剪贴板</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function copyPromptText() {
  const text = generatePromptText();
  navigator.clipboard.writeText(text).then(() => {
    showToast('已复制到剪贴板', 'success');
  }).catch(() => {
    showToast('复制失败，请手动选择复制', 'error');
  });
}

function generatePromptText() {
  let output = '';
  output += '═══════════════════════════════════════════════════\n';
  output += '  PPT 分镜脚本提示词文档\n';
  output += '═══════════════════════════════════════════════════\n\n';

  // Global settings
  output += '【全局视觉设定】\n';
  output += `  主色调：${state.global.color || '未设定'}\n`;
  output += `  受众画像：${state.global.audience || '未设定'}\n`;
  output += `  情感基调：${state.global.emotion || '未设定'}\n`;
  output += '\n───────────────────────────────────────────────────\n\n';

  // Cards
  state.cards.forEach((card, idx) => {
    output += `【第 ${idx + 1} 页 / Page ${idx + 1}】\n`;
    if (card.title) output += `  标题：${card.title}\n`;
    else output += `  标题：（未填写）\n`;

    if (card.layout) {
      const layoutLabel = LAYOUT_OPTIONS.find(o => o.value === card.layout);
      output += `  布局方式：${layoutLabel ? layoutLabel.label : card.layout}${card.layout === 'custom' && card.customLayout ? ' — ' + card.customLayout : ''}\n`;
    }

    if (card.requirement) {
      output += `\n  需求描述：\n`;
      card.requirement.split('\n').forEach(line => {
        output += `    ${line}\n`;
      });
    } else {
      output += `\n  需求描述：（未填写）\n`;
    }

    if (card.images.length > 0) {
      output += `\n  附件图片（${card.images.length}张）：\n`;
      card.images.forEach((img, i) => {
        output += `    [${i + 1}] ${img.name} (${formatFileSize(img.size)})\n`;
      });
    }

    if (card.notes) {
      output += `\n  补充说明：${card.notes}\n`;
    }

    output += '\n───────────────────────────────────────────────────\n\n';
  });

  output += `总计：${state.cards.length} 页 PPT 分镜\n`;

  return output;
}

function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

// ===== Export DOCX =====
async function exportDocx() {
  collectGlobalData();
  state.cards.forEach(c => collectCardData(c.id));

  if (state.cards.length === 0) {
    showToast('请先添加分镜卡片', 'error');
    return;
  }

  showToast('正在生成 .docx 文件...', 'info');

  try {
    // Build docx using docx library from CDN
    if (typeof docx === 'undefined') {
      await loadDocxLibrary();
    }
    const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType, BorderStyle, TabStopType, TabStopPosition } = docx;

    const children = [];

    // Title
    children.push(new Paragraph({
      children: [new TextRun({ text: 'PPT 分镜脚本提示词文档', bold: true, size: 48, color: '6c5ce7' })],
      alignment: AlignmentType.CENTER,
      spacing: { after: 400 }
    }));

    // Global Settings
    children.push(new Paragraph({
      children: [new TextRun({ text: '【全局视觉设定】', bold: true, size: 28 })],
      spacing: { before: 300, after: 200 }
    }));

    const globalItems = [
      `主色调：${state.global.color || '未设定'}`,
      `受众画像：${state.global.audience || '未设定'}`,
      `情感基调：${state.global.emotion || '未设定'}`
    ];
    globalItems.forEach(item => {
      children.push(new Paragraph({
        children: [new TextRun({ text: '    ' + item, size: 22 })],
        spacing: { after: 100 }
      }));
    });

    // Separator
    children.push(new Paragraph({
      children: [new TextRun({ text: '────────────────────────────────────────', color: 'CCCCCC', size: 18 })],
      spacing: { before: 200, after: 200 }
    }));

    // Cards
    state.cards.forEach((card, idx) => {
      children.push(new Paragraph({
        children: [new TextRun({ text: `【第 ${idx + 1} 页 / Page ${idx + 1}】`, bold: true, size: 26, color: '00cec9' })],
        heading: HeadingLevel.HEADING_2,
        spacing: { before: 300, after: 150 }
      }));

      children.push(new Paragraph({
        children: [new TextRun({ text: `标题：${card.title || '（未填写）'}`, size: 22 })],
        spacing: { after: 100 }
      }));

      if (card.layout) {
        const layoutLabel = LAYOUT_OPTIONS.find(o => o.value === card.layout);
        const layoutText = layoutLabel ? layoutLabel.label : card.layout;
        children.push(new Paragraph({
          children: [new TextRun({ text: `布局方式：${layoutText}${card.layout === 'custom' && card.customLayout ? ' — ' + card.customLayout : ''}`, size: 22 })],
          spacing: { after: 100 }
        }));
      }

      children.push(new Paragraph({
        children: [new TextRun({ text: '需求描述：', bold: true, size: 22 })],
        spacing: { before: 100, after: 50 }
      }));

      const reqLines = (card.requirement || '（未填写）').split('\n');
      reqLines.forEach(line => {
        children.push(new Paragraph({
          children: [new TextRun({ text: '    ' + line, size: 20 })],
          spacing: { after: 40 }
        }));
      });

      if (card.images.length > 0) {
        children.push(new Paragraph({
          children: [new TextRun({ text: `附件图片（${card.images.length}张）：`, bold: true, size: 22 })],
          spacing: { before: 100, after: 50 }
        }));
        card.images.forEach((img, i) => {
          children.push(new Paragraph({
            children: [new TextRun({ text: `    [${i + 1}] ${img.name} (${formatFileSize(img.size)})`, size: 20 })],
            spacing: { after: 40 }
          }));
        });
      }

      if (card.notes) {
        children.push(new Paragraph({
          children: [new TextRun({ text: `补充说明：${card.notes}`, size: 20, italics: true })],
          spacing: { before: 100, after: 50 }
        }));
      }

      children.push(new Paragraph({
        children: [new TextRun({ text: '────────────────────────────────────────', color: 'CCCCCC', size: 18 })],
        spacing: { before: 200, after: 200 }
      }));
    });

    // Footer
    children.push(new Paragraph({
      children: [new TextRun({ text: `总计：${state.cards.length} 页 PPT 分镜`, size: 22, bold: true })],
      spacing: { before: 200 }
    }));

    const doc = new Document({
      sections: [{ children }]
    });

    const blob = await Packer.toBlob(doc);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `PPT分镜脚本_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.docx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    showToast(' .docx 文件已生成并下载', 'success');
  } catch (err) {
    console.error('Export error:', err);
    showToast('导出失败: ' + err.message, 'error');
  }
}

async function loadDocxLibrary() {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/docx@8.5.0/build/index.umd.min.js';
    script.onload = resolve;
    script.onerror = () => reject(new Error('无法加载docx库，请检查网络连接'));
    document.head.appendChild(script);
  });
}

// ===== Project Save/Load =====
function saveProject() {
  collectGlobalData();
  state.cards.forEach(c => collectCardData(c.id));
  const json = JSON.stringify(state, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `PPT分镜项目_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('项目文件已导出', 'success');
}

function loadProject() {
  document.getElementById('projectFileInput').click();
}

function handleProjectLoad(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.cards && Array.isArray(data.cards)) {
        state = { ...state, ...data };
        syncGlobalUI();
        renderCards();
        saveToStorage();
        updateStats();
        showToast('项目导入成功', 'success');
      } else {
        showToast('无效的项目文件格式', 'error');
      }
    } catch (err) {
      showToast('文件解析失败', 'error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function clearAll() {
  if (state.cards.length === 0 && !state.global.audience && !state.global.emotion) {
    showToast('没有需要清空的内容', 'info');
    return;
  }
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>⚠️ 确认清空</h3>
      <p style="color:var(--muted); margin-bottom:1.5rem;">此操作将清空所有分镜卡片和全局设置，数据将无法恢复。确定要继续吗？</p>
      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button class="btn btn-secondary btn-sm" onclick="this.closest('.modal-overlay').remove()">取消</button>
        <button class="btn btn-danger btn-sm" onclick="confirmClear()">确认清空</button>
      </div>
    </div>
  `;
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);
}

function confirmClear() {
  state = { global: { color: '#6c5ce7', audience: '', emotion: '' }, cards: [], nextId: 1 };
  syncGlobalUI();
  renderCards();
  saveToStorage();
  updateStats();
  document.querySelector('.modal-overlay').remove();
  showToast('所有数据已清空', 'info');
}

// ===== Toast =====
function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ===== Init =====
init();
</script>
</body>
</html>
