<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提醒事项 · 数据看板</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 文字 */
            --ink: #1a1a2e;
            --ink-light: #5a5a72;
            --ink-mute: #9a9aae;

            /* 背景渐变（参考图：左冷 → 右暖） */
            --bg-grad-1: #e5e8ed;
            --bg-grad-2: #f3e8d4;
            --bg-grad-3: #f8f1de;

            /* 卡片（毛玻璃 + 倒角） */
            --card-bg: rgba(255, 255, 255, 0.55);
            --card-bg-solid: #ffffff;
            --card-border: rgba(255, 255, 255, 0.6);
            --card-shadow: 0 8px 32px rgba(80, 60, 40, 0.08), 0 2px 8px rgba(80, 60, 40, 0.04);
            --card-shadow-hover: 0 12px 40px rgba(80, 60, 40, 0.12), 0 4px 12px rgba(80, 60, 40, 0.06);

            /* 强调色（参考图的黄色） */
            --accent: #f4c430;
            --accent-deep: #e8a800;
            --accent-soft: #fef3c7;

            /* 数据色系（各列表主题色） */
            --c-habit: #c75b39;
            --c-study: #5a8f7b;
            --c-work: #4a6585;
            --c-daily: #a8855b;
            --c-idea: #8a7290;

            /* 暗色卡片（参考图右下方） */
            --dark-bg: #1a1a1a;
            --dark-card: #232323;
            --dark-text: #f5f0e8;
            --dark-mute: #888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', -apple-system, sans-serif;
            background:
                radial-gradient(at 20% 20%, var(--bg-grad-1) 0%, transparent 50%),
                radial-gradient(at 80% 80%, var(--bg-grad-2) 0%, transparent 50%),
                radial-gradient(at 50% 50%, var(--bg-grad-3) 0%, transparent 70%),
                linear-gradient(135deg, #eef0f3 0%, #f5e8c8 100%);
            background-attachment: fixed;
            color: var(--ink);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .site-header {
            background: transparent;
            color: var(--ink);
            padding: 48px 0 32px;
            position: relative;
            overflow: hidden;
        }

        .site-header::before {
            content: '';
            position: absolute;
            top: -50%; right: -10%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(244, 196, 48, 0.22) 0%, transparent 70%);
            pointer-events: none;
        }

        .site-header::after {
            content: '';
            position: absolute;
            bottom: -30%; left: -10%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(199, 91, 57, 0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .header-content { position: relative; z-index: 1; }

        .header-label {
            display: inline-block;
            font-size: 11px; letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent-deep);
            margin-bottom: 16px; font-weight: 600;
            padding: 6px 14px;
            background: var(--accent-soft);
            border: 1px solid rgba(244, 196, 48, 0.35);
            border-radius: 100px;
        }

        .header-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 42px; font-weight: 700;
            margin-bottom: 12px; letter-spacing: -0.5px;
            color: var(--ink);
        }

        .header-desc {
            font-size: 15px;
            color: var(--ink-light); font-weight: 400;
            max-width: 600px;
        }

        /* 通用卡片（毛玻璃 + 大倒角） */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            box-shadow: var(--card-shadow-hover);
            transform: translateY(-2px);
        }

        .upload-section { padding: 40px 0 32px; }

        .upload-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 2px dashed rgba(244, 196, 48, 0.4);
            border-radius: 24px;
            padding: 56px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .upload-card:hover {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.7);
            box-shadow: var(--card-shadow-hover);
        }

        .upload-icon {
            width: 56px; height: 56px;
            margin: 0 auto 20px;
            background: var(--accent-soft);
            border: 1px solid rgba(244, 196, 48, 0.3);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: var(--accent-deep);
            transition: all 0.3s;
        }

        .upload-card:hover .upload-icon {
            background: var(--accent);
            color: var(--ink);
            transform: scale(1.05);
        }

        .upload-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: var(--ink); }
        .upload-hint { font-size: 13px; color: var(--ink-light); }
        .upload-card input { display: none; }

        .stats-section {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px; margin-bottom: 32px;
        }

        .stat-item {
            background: var(--card-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 28px 24px;
            position: relative; overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
        }
        .stat-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--card-shadow-hover);
        }

        .stat-label {
            font-size: 12px; letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--ink-light); margin-bottom: 12px;
            font-weight: 500;
        }

        .stat-value {
            font-family: 'Noto Serif SC', serif;
            font-size: 38px; font-weight: 700;
            color: var(--ink); line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .stat-change { font-size: 13px; margin-top: 8px; color: var(--c-study); font-weight: 500; }

        .section-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 22px; font-weight: 600;
            margin-bottom: 24px; padding-bottom: 14px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            display: flex; align-items: center; gap: 10px;
        }

        .section-title::before {
            content: ''; width: 4px; height: 20px;
            background: var(--accent); border-radius: 2px;
        }

        .chart-section {
            background: var(--card-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px; margin-bottom: 32px;
            box-shadow: var(--card-shadow);
        }

        .range-filters {
            display: flex; gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .range-pill {
            padding: 6px 16px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.6);
            border-radius: 100px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.25s;
            color: var(--ink-light);
            font-family: inherit;
            font-weight: 500;
        }
        .range-pill:hover { border-color: var(--accent); color: var(--ink); transform: translateY(-1px); }
        .range-pill.active { background: var(--ink); color: var(--accent); border-color: var(--ink); }

        /* Weekly heatmap (everyday-style) */
        .month-nav {
            display: flex; align-items: center;
            justify-content: center; gap: 16px;
            margin-bottom: 20px;
        }
        .month-nav-btn {
            width: 32px; height: 32px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            color: var(--ink-light);
            font-family: inherit;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }
        .month-nav-btn:hover { border-color: var(--accent); color: var(--accent); background: white; }
        .month-nav-label {
            font-family: 'Noto Serif SC', serif;
            font-size: 17px; font-weight: 600;
            min-width: 100px; text-align: center;
        }

        .weekly-grid-wrap { padding: 0 4px; }

        .weekly-head {
            display: grid;
            grid-template-columns: 40px 1fr 60px 60px;
            gap: 8px;
            align-items: center;
            font-size: 10px;
            color: var(--ink-light);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .weekly-head .head-cells { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

        .weekly-grid { display: flex; flex-direction: column; gap: 6px; }
        .week-row {
            display: grid;
            grid-template-columns: 40px 1fr 60px 60px;
            gap: 8px;
            align-items: center;
        }
        .week-label {
            font-size: 11px;
            color: var(--ink-light);
            font-weight: 500;
        }
        .week-cells {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .week-cell {
            height: 28px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.5);
            display: flex; align-items: center;
            justify-content: center;
            font-size: 10px;
            color: var(--ink-light);
            cursor: default;
            transition: transform 0.15s;
        }
        .week-cell.empty { background: transparent; }
        .week-cell.has-data { cursor: pointer; color: white; font-weight: 600; }
        .week-cell.has-data:hover { transform: scale(1.1); }
        .week-cell.today { box-shadow: 0 0 0 1.5px var(--ink); }
        .week-stat {
            text-align: right;
            font-family: 'Noto Serif SC', serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink);
        }
        .week-count {
            text-align: right;
            font-size: 10px;
            color: var(--ink-light);
        }

        .monthly-legend {
            display: flex; align-items: center;
            justify-content: flex-end;
            gap: 8px; margin-top: 20px;
            font-size: 11px; color: var(--ink-light);
        }
        .legend-cells {
            display: flex; align-items: center; gap: 3px;
        }
        .legend-cell {
            width: 12px; height: 12px; border-radius: 3px;
        }

        .chart-canvas-wrap {
            width: 100%;
            position: relative;
            overflow: visible;
        }

        canvas { display: block; }

        /* Energy Distribution (Bar Chart) */
        .energy-chart-wrap {
            position: relative;
        }
        .energy-layout {
            display: flex;
            gap: 24px;
            align-items: stretch;
        }
        .energy-bar-area {
            flex: 1;
            position: relative;
            padding-left: 48px;
        }
        .energy-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            gap: 6px;
            height: 280px;
            padding: 56px 8px 8px;
            position: relative;
        }
        /* Y 轴刻度（柱图左侧） */
        .energy-y-axis {
            position: absolute;
            left: 0;
            top: 56px;
            bottom: 108px;
            width: 42px;
            display: flex;
            flex-direction: column-reverse;
            justify-content: space-between;
            pointer-events: none;
            font-size: 10px;
            color: var(--ink-light);
            font-variant-numeric: tabular-nums;
        }
        .energy-y-axis span {
            text-align: right;
            padding-right: 8px;
            border-top: 1px dashed transparent;
            position: relative;
        }
        .energy-y-axis span::after {
            content: '';
            position: absolute;
            right: 0; top: 0;
            width: 4px;
            border-top: 1px dashed #d8d2c4;
        }
        /* 基线点连线 */
        .energy-chart::after {
            content: '';
            position: absolute;
            bottom: 64px;
            left: 8px;
            border-bottom: 1px dashed #d8d2c4;
            /* 默认宽度，会在 JS 中根据 wrap 宽度设置 */
        }

        .energy-col {
            flex: 1;
            max-width: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            height: 100%;
        }

        .energy-pct-label {
            height: 20px;
            font-family: 'Noto Serif SC', serif;
            font-size: 12px;
            font-weight: 600;
            color: var(--ink);
            white-space: nowrap;
            display: flex; align-items: center;
            justify-content: center;
            margin-bottom: 6px;
        }

        .energy-bar-track {
            width: 6px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            position: relative;
            /* 高度由 JS 按任务量比例设置 */
        }

        .energy-bar-fill {
            width: 6px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            position: relative;
        }
        .energy-bar-done {
            background: var(--col-main);
            border-radius: 3px 3px 0 0;
            width: 100%;
        }
        .energy-bar-pending {
            width: 100%;
            background-image: repeating-linear-gradient(
                45deg,
                var(--col-light) 0,
                var(--col-light) 3px,
                transparent 3px,
                transparent 7px
            );
            border-radius: 3px;
            margin-bottom: 3px;
            border: 1px dashed var(--col-main);
            border-bottom: none;
        }

        .energy-col.empty .energy-bar-track {
            align-items: center;
        }
        .energy-col.empty .energy-bar-track::before {
            content: '';
            display: block;
            width: 6px;
            height: 30px;
            border-radius: 3px;
            background: repeating-linear-gradient(
                45deg,
                #e8e2d5 0, #e8e2d5 3px,
                #f0ebe3 3px, #f0ebe3 7px
            );
            opacity: 0.5;
        }

        .energy-base-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--col-main);
            margin-top: 8px;
        }
        .energy-col.empty .energy-base-dot { background: #c5bdaa; }

        .energy-name-label {
            margin-top: 10px;
            font-size: 12px;
            color: var(--ink);
            font-weight: 500;
        }
        .energy-count-label {
            margin-top: 2px;
            font-size: 10px;
            color: var(--ink-light);
            font-variant-numeric: tabular-nums;
        }

        /* 右侧饼图区 */
        .energy-pie-wrap {
            width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 8px;
            border-left: 1px dashed var(--border);
            padding-left: 24px;
        }
        .energy-pie-canvas-wrap {
            position: relative;
            width: 200px;
            height: 200px;
        }
        #energyPieCanvas {
            width: 200px;
            height: 200px;
        }
        .energy-pie-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }
        .energy-pie-center .num {
            font-family: 'Noto Serif SC', serif;
            font-size: 28px;
            font-weight: 600;
            color: var(--ink);
            line-height: 1;
        }
        .energy-pie-center .label {
            font-size: 11px;
            color: var(--ink-light);
            margin-top: 4px;
            letter-spacing: 1px;
        }
        .energy-pie-legend {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }
        .energy-pie-legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--ink);
        }
        .energy-pie-legend-swatch {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .energy-pie-legend-name {
            flex: 1;
        }
        .energy-pie-legend-pct {
            font-variant-numeric: tabular-nums;
            color: var(--ink-light);
            font-size: 11px;
        }

        .energy-insight {
            margin-top: 24px;
            padding: 18px 22px;
            background: rgba(244, 196, 48, 0.08);
            border: 1px solid rgba(244, 196, 48, 0.2);
            border-left: 3px solid var(--accent);
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.8;
            color: var(--ink-light);
            backdrop-filter: blur(10px);
        }
        .energy-insight strong { color: var(--ink); font-weight: 600; }

        .heatmap-wrap { padding: 10px 0; }
        .heatmap-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .heatmap-table th {
            text-align: left;
            padding: 10px 12px;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--ink-light);
            font-weight: 500;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }
        .heatmap-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            vertical-align: middle;
        }
        .heatmap-table tr:hover td { background: rgba(255, 255, 255, 0.4); }
        .heatmap-date {
            font-weight: 500;
            color: var(--ink);
            white-space: nowrap;
        }
        .heatmap-dayname {
            font-size: 11px;
            color: var(--ink-light);
            margin-left: 4px;
        }
        .heatmap-cell {
            display: flex; align-items: center; gap: 10px;
        }
        .heatmap-bar-wrap {
            flex: 1;
            height: 8px;
            background: #f0ebe3;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .heatmap-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #d4a574 0%, #c75b39 100%);
            border-radius: 4px;
            transition: width 0.4s;
        }
        .heatmap-rate {
            font-family: 'Noto Serif SC', serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--ink);
            min-width: 50px;
            text-align: right;
        }
        .heatmap-count {
            font-size: 11px;
            color: var(--ink-light);
            min-width: 50px;
            text-align: right;
            white-space: nowrap;
        }

        .heatmap-legend {
            display: flex; align-items: center; gap: 8px;
            font-size: 11px; color: var(--ink-light);
            margin-top: 16px; justify-content: flex-end;
        }
        .heatmap-legend-cell {
            width: 12px; height: 12px; border-radius: 2px;
        }

        .empty-hint {
            text-align: center; padding: 60px 20px;
            color: #999; font-size: 14px;
        }
        /* Task list */
        .task-section {
            background: var(--card-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--card-border);
            border-radius: 24px; padding: 32px;
            box-shadow: var(--card-shadow);
        }

        .task-filters {
            display: flex; gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap; align-items: center;
        }

        .filter-pill {
            padding: 8px 22px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.6);
            border-radius: 100px;
            font-size: 13px; cursor: pointer;
            transition: all 0.25s;
            color: var(--ink-light);
            font-family: inherit;
            font-weight: 500;
            backdrop-filter: blur(10px);
        }

        .filter-pill:hover { border-color: var(--accent); color: var(--ink); transform: translateY(-1px); }
        .filter-pill.active { background: var(--ink); color: var(--accent); border-color: var(--ink); }

        .month-select {
            padding: 8px 16px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 100px;
            font-size: 13px; font-family: inherit;
            background: rgba(255, 255, 255, 0.6);
            color: var(--ink);
            cursor: pointer; margin-left: auto;
            backdrop-filter: blur(10px);
        }

        .merge-toggle {
            display: flex; align-items: center;
            gap: 8px; font-size: 13px;
            color: var(--ink-light); cursor: pointer;
            margin-left: 12px;
        }

        .task-table { width: 100%; border-collapse: collapse; }

        .task-table th {
            text-align: left; padding: 14px 18px;
            font-size: 11px; letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--ink-light); font-weight: 500;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        .task-table td {
            padding: 16px 18px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            font-size: 14px;
        }

        .task-table tr:hover td { background: rgba(255, 255, 255, 0.4); }
        .task-table tr:last-child td { border-bottom: none; }

        .status-dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%; margin-right: 8px;
        }

        .status-dot.done { background: var(--c-study); box-shadow: 0 0 0 3px rgba(90, 143, 123, 0.18); }
        .status-dot.todo { background: var(--c-habit); box-shadow: 0 0 0 3px rgba(199, 91, 57, 0.18); }

        .task-title-cell {
            font-weight: 500;
            max-width: 300px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .date-cell { color: var(--ink-light); font-size: 13px; white-space: nowrap; }

        .list-badge {
            display: inline-block;
            padding: 3px 12px;
            background: rgba(0, 0, 0, 0.04);
            border-radius: 100px;
            font-size: 12px; color: var(--ink-light);
            font-weight: 500;
        }

        .count-badge {
            display: inline-block;
            padding: 3px 10px;
            background: var(--accent);
            color: var(--ink);
            border-radius: 100px;
            font-size: 12px; font-weight: 700;
            margin-left: 8px;
        }

        .site-footer {
            text-align: center; padding: 40px 0;
            font-size: 12px; color: var(--ink-light);
            margin-top: 40px;
        }

        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .stats-section { grid-template-columns: repeat(2, 1fr); }
            .header-title { font-size: 28px; }
            .task-filters { flex-direction: column; align-items: flex-start; }
            .month-select { margin-left: 0; margin-top: 8px; }
            .merge-toggle { margin-left: 0; margin-top: 8px; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <div class="header-label">Reminders Analytics</div>
                <h1 class="header-title">To do & Done</h1>
                <p class="header-desc">Let's have a look</p>
            </div>
        </div>
    </header>

    <main class="container" style="padding-bottom: 40px;">
        <section class="upload-section" id="uploadSection">
            <div class="upload-card" onclick="document.getElementById('fileInput').click()">
                <input type="file" id="fileInput" accept=".json" onchange="handleFile(event)">
                <div class="upload-icon">+</div>
                <div class="upload-title">上传 JSON 数据文件</div>
                <div class="upload-hint">支持从快捷指令导出的提醒事项数据</div>
            </div>
        </section>

        <div id="dashboard" class="hidden">
            <section class="stats-section">
                <div class="stat-item">
                    <div class="stat-label">总任务</div>
                    <div class="stat-value" id="totalTasks">0</div>
                    <div class="stat-change">全部记录</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">完成率</div>
                    <div class="stat-value" id="completionRateValue">0%</div>
                    <div class="stat-change" id="completionCount">0 / 0 已完成</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">待完成</div>
                    <div class="stat-value" id="pendingTasks">0</div>
                    <div class="stat-change">进行中</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">记录天数</div>
                    <div class="stat-value" id="datedTasks">0</div>
                    <div class="stat-change">天</div>
                </div>
            </section>

            <section class="chart-section">
                <h2 class="section-title">完成统计</h2>
                <div class="month-nav">
                    <button class="month-nav-btn" onclick="changeMonth(-1)">‹</button>
                    <div class="month-nav-label" id="currentMonthLabel">2026年6月</div>
                    <button class="month-nav-btn" onclick="changeMonth(1)">›</button>
                </div>
                <div class="weekly-grid-wrap">
                    <div class="weekly-grid" id="weeklyGrid"></div>
                    <div class="monthly-legend">
                        <span>完成度</span>
                        <div class="legend-cells">
                            <span>0%</span>
                            <div class="legend-cell" style="background:#eef3ee"></div>
                            <div class="legend-cell" style="background:#c5d8c8"></div>
                            <div class="legend-cell" style="background:#8fb8a5"></div>
                            <div class="legend-cell" style="background:#5a8f7b"></div>
                            <div class="legend-cell" style="background:#3d6b5c"></div>
                            <span>100%</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="chart-section">
                <h2 class="section-title">完成趋势</h2>
                <div class="range-filters" id="trendRange">
                    <button class="range-pill active" data-range="week" onclick="setTrendRange('week', this)">按周</button>
                    <button class="range-pill" data-range="month" onclick="setTrendRange('month', this)">按月</button>
                </div>
                <div class="chart-canvas-wrap">
                    <canvas id="trendCanvas" height="320"></canvas>
                </div>
            </section>

            <section class="chart-section">
                <h2 class="section-title">精力分布</h2>
                <div class="range-filters" id="energyRange">
                    <button class="range-pill active" data-range="week" onclick="setEnergyRange('week', this)">本周</button>
                    <button class="range-pill" data-range="month" onclick="setEnergyRange('month', this)">本月</button>
                    <button class="range-pill" data-range="all" onclick="setEnergyRange('all', this)">全部</button>
                </div>
                <div class="energy-chart-wrap">
                    <div class="energy-layout">
                        <div class="energy-bar-area">
                            <div class="energy-y-axis" id="energyYAxis"></div>
                            <div class="energy-list energy-chart" id="energyList"></div>
                        </div>
                        <div class="energy-pie-wrap">
                            <div class="energy-pie-canvas-wrap">
                                <canvas id="energyPieCanvas" width="400" height="400"></canvas>
                                <div class="energy-pie-center">
                                    <div class="num" id="energyPieTotal">0</div>
                                    <div class="label">总任务</div>
                                </div>
                            </div>
                            <div class="energy-pie-legend" id="energyPieLegend"></div>
                        </div>
                    </div>
                </div>
                <div class="energy-insight" id="energyInsight"></div>
            </section>

            <section class="task-section">
                <h2 class="section-title">任务明细</h2>
                <div class="task-filters">
                    <button class="filter-pill active" onclick="filterTasks('all', this)">全部</button>
                    <button class="filter-pill" onclick="filterTasks('completed', this)">已完成</button>
                    <button class="filter-pill" onclick="filterTasks('pending', this)">待完成</button>
                    <select class="month-select" id="monthSelect" onchange="applyFilters()">
                        <option value="all">全部时间</option>
                    </select>
                </div>
                <table class="task-table">
                    <thead>
                        <tr>
                            <th>状态</th>
                            <th>任务</th>
                            <th>列表</th>
                            <th>截止日期</th>
                        </tr>
                    </thead>
                    <tbody id="taskList"></tbody>
                </table>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">提醒事项可视化 · 数据来自 Apple Reminders</div>
    </footer>

    <script>
        let allTasks = [];
        let currentFilter = 'all';
        let currentViewMonth = null; // Date object
        let dateMap = {};

        function handleFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    processData(data);
                    document.getElementById('uploadSection').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                } catch (err) {
                    alert('文件解析失败: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function processData(data) {
            let reminders = data.reminders;
            console.log('[processData] reminders type:', typeof reminders, 'length:', reminders && reminders.length);

            // 规范化 reminders 为数组
            if (typeof reminders === 'string') {
                // 情况 1: 字符串里只有一个 {...}，可能成功 parse 成对象
                // 情况 2: 字符串里有多个 {...}{...} 拼接，parse 失败
                // 情况 3: 字符串是 [...] 数组的 JSON 字符串

                // 尝试 1: 整个字符串是合法 JSON
                try {
                    const parsed = JSON.parse(reminders);
                    if (Array.isArray(parsed)) {
                        reminders = parsed;
                    } else if (parsed && typeof parsed === 'object' && parsed.title && typeof parsed.title === 'string') {
                        // 单个对象，title 是 \n 分隔的字符串
                        reminders = parseNewlineFormat(parsed);
                    } else if (parsed && typeof parsed === 'object') {
                        reminders = parsed;
                    }
                } catch(e) {
                    // JSON.parse 失败：取第一个完整 {...} 对象（V2 策略）
                    console.log('[processData] 整体 JSON.parse 失败，取第一个完整对象');
                    let depth = 0, endPos = -1;
                    for (let i = 0; i < reminders.length; i++) {
                        if (reminders[i] === '{') depth++;
                        else if (reminders[i] === '}') {
                            depth--;
                            if (depth === 0) { endPos = i + 1; break; }
                        }
                    }
                    if (endPos > 0) {
                        try {
                            const firstObj = JSON.parse(reminders.substring(0, endPos));
                            if (firstObj && firstObj.title && typeof firstObj.title === 'string') {
                                // 单个对象，title 是 \n 分隔字符串，走 parseNewlineFormat
                                reminders = parseNewlineFormat(firstObj);
                            } else {
                                reminders = [];
                            }
                        } catch(e2) {
                            reminders = [];
                        }
                    } else {
                        reminders = [];
                    }
                }
            } else if (Array.isArray(reminders)) {
                // 已经是数组，OK
            } else if (reminders && typeof reminders === 'object' && reminders.title && typeof reminders.title === 'string') {
                // 单个对象，title 是字符串
                reminders = parseNewlineFormat(reminders);
            }

            if (!Array.isArray(reminders)) reminders = [];

            console.log('[processData] final reminders count:', reminders.length);
            if (reminders.length > 0) {
                const lists = [...new Set(reminders.map(r => r.listname || r.listName))];
                console.log('[processData] unique lists:', lists);
            }

            allTasks = reminders.map(r => ({
                title: r.title || '',
                dueDate: r.duedate || r.dueDate || null,
                listName: r.listname || r.listName || '',
                completed: r.completed === true || r.completed === '是' || r.completed === 'true',
                hasDueDate: !!(r.duedate || r.dueDate)
            }));

            populateMonthSelect();
            buildDateMap();
            // 默认定位到数据中最新的月份
            const allDates = Object.keys(dateMap).sort();
            if (allDates.length > 0) {
                const latest = new Date(allDates[allDates.length - 1] + 'T00:00:00');
                currentViewMonth = new Date(latest.getFullYear(), latest.getMonth(), 1);
            } else {
                const now = new Date();
                currentViewMonth = new Date(now.getFullYear(), now.getMonth(), 1);
            }
            updateStats();
            renderWeeklyGrid();
            renderTrendChart();
            renderEnergy();
            applyFilters();
        }

        function parseNewlineFormat(data) {
            const titles = (data.title || '').split('\n');
            const dueDates = (data.duedate || '').split('\n');
            const listNames = (data.listname || '').split('\n');
            const completeds = (data.completed || '').split('\n');
            const tasks = [];
            for (let i = 0; i < titles.length; i++) {
                const title = titles[i] ? titles[i].trim() : '';
                if (title) {
                    tasks.push({
                        title,
                        duedate: dueDates[i] ? dueDates[i].trim() : null,
                        listname: listNames[i] ? listNames[i].trim() : '默认',
                        completed: completeds[i] ? completeds[i].trim() : '否'
                    });
                }
            }
            return tasks;
        }

        function populateMonthSelect() {
            const select = document.getElementById('monthSelect');
            const months = new Set();
            allTasks.forEach(task => {
                if (task.dueDate) {
                    const m = task.dueDate.match(/(\d{4})年(\d{1,2})月/);
                    if (m) months.add(m[1] + '-' + m[2].padStart(2, '0'));
                }
            });
            const sorted = Array.from(months).sort();
            select.innerHTML = '<option value="all">全部时间</option>' +
                sorted.map(m => `<option value="${m}">${m}</option>`).join('');
        }

        function updateStats() {
            const total = allTasks.length;
            const completed = allTasks.filter(t => t.completed).length;
            const pending = total - completed;
            // 记录天数：有截止日期的不重复日期数量
            const dateSet = new Set();
            allTasks.forEach(t => {
                if (t.dueDate) {
                    const d = parseDate(t.dueDate);
                    if (d) dateSet.add(d.toISOString().slice(0, 10));
                }
            });
            const days = dateSet.size;
            const rate = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('totalTasks').textContent = total;
            document.getElementById('pendingTasks').textContent = pending;
            document.getElementById('datedTasks').textContent = days;
            document.getElementById('completionRateValue').textContent = rate + '%';
            document.getElementById('completionCount').textContent = `${completed} / ${total} 已完成`;
        }

        function buildDateMap() {
            dateMap = {};
            allTasks.forEach(task => {
                if (!task.dueDate) return;
                const date = parseDate(task.dueDate);
                if (!date) return;
                const key = date.toISOString().slice(0, 10);
                if (!dateMap[key]) dateMap[key] = { total: 0, completed: 0 };
                dateMap[key].total++;
                if (task.completed) dateMap[key].completed++;
            });
        }

        function getRateColor(rate) {
            // 0% → 浅米色（统一绿色系）
            if (rate === 0) return '#eef3ee';
            if (rate < 0.25) return '#c5d8c8';
            if (rate < 0.5) return '#8fb8a5';
            if (rate < 0.75) return '#5a8f7b';
            if (rate < 1) return '#3d6b5c';
            return '#2d5346';
        }

        function changeMonth(delta) {
            if (!currentViewMonth) return;
            currentViewMonth = new Date(
                currentViewMonth.getFullYear(),
                currentViewMonth.getMonth() + delta,
                1
            );
            renderWeeklyGrid();
        }

        function renderWeeklyGrid() {
            const grid = document.getElementById('weeklyGrid');
            const label = document.getElementById('currentMonthLabel');
            if (!grid || !label || !currentViewMonth) return;

            const y = currentViewMonth.getFullYear();
            const m = currentViewMonth.getMonth();
            label.textContent = y + '年' + (m + 1) + '月';

            const firstDay = new Date(y, m, 1);
            const lastDay = new Date(y, m + 1, 0);
            // 周一为起始
            let startWeekday = firstDay.getDay() - 1;
            if (startWeekday < 0) startWeekday = 6;
            const totalDays = lastDay.getDate();

            const today = new Date();
            const todayKey = today.toISOString().slice(0, 10);

            // 按周分组
            const weeks = [];
            let current = [];
            // 填充月初空格
            for (let i = 0; i < startWeekday; i++) current.push(null);
            for (let d = 1; d <= totalDays; d++) {
                const dt = new Date(y, m, d);
                current.push(dt);
                if (current.length === 7) {
                    weeks.push(current);
                    current = [];
                }
            }
            if (current.length > 0) {
                while (current.length < 7) current.push(null);
                weeks.push(current);
            }

            let html = '';
            weeks.forEach((week, wi) => {
                let weekTotal = 0, weekCompleted = 0;
                let weekHasAny = false;
                let cellsHtml = '';
                week.forEach((dt) => {
                    if (!dt) {
                        cellsHtml += '<div class="week-cell empty"></div>';
                        return;
                    }
                    const key = dt.toISOString().slice(0, 10);
                    const info = dateMap[key];
                    const isToday = key === todayKey;
                    if (info) {
                        weekHasAny = true;
                        weekTotal += info.total;
                        weekCompleted += info.completed;
                        const rate = info.completed / info.total;
                        const color = getRateColor(rate);
                        const textColor = rate >= 0.5 ? 'white' : 'var(--ink)';
                        cellsHtml += `<div class="week-cell has-data${isToday ? ' today' : ''}" ` +
                                `style="background:${color};color:${textColor}" ` +
                                `title="${m + 1}月${dt.getDate()}日 · 完成 ${info.completed}/${info.total} (${Math.round(rate*100)}%)">${dt.getDate()}</div>`;
                    } else {
                        cellsHtml += `<div class="week-cell${isToday ? ' today' : ''}" ` +
                                `title="${m + 1}月${dt.getDate()}日 · 无任务">${dt.getDate()}</div>`;
                    }
                });
                const weekRate = weekTotal > 0 ? Math.round((weekCompleted / weekTotal) * 100) : 0;
                const weekPct = weekHasAny ? weekRate + '%' : '—';
                const weekCountStr = weekHasAny ? (weekCompleted + '/' + weekTotal) : '';
                html += `<div class="week-row">`;
                html += `<div class="week-label">第${wi + 1}周</div>`;
                html += `<div class="week-cells">${cellsHtml}</div>`;
                html += `<div class="week-stat">${weekPct}</div>`;
                html += `<div class="week-count">${weekCountStr}</div>`;
                html += `</div>`;
            });

            grid.innerHTML = html;
        }

        // ====== Task List ======
        function filterTasks(type, btn) {
            document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = type;
            applyFilters();
        }

        function applyFilters() {
            const monthFilter = document.getElementById('monthSelect').value;
            // 始终合并同名任务（不再提供展开选项）
            const mergeEnabled = true;
            let tasks = [...allTasks];

            if (currentFilter === 'completed') tasks = tasks.filter(t => t.completed);
            else if (currentFilter === 'pending') tasks = tasks.filter(t => !t.completed);

            if (monthFilter !== 'all') {
                tasks = tasks.filter(t => {
                    if (!t.dueDate) return false;
                    const m = t.dueDate.match(/(\d{4})年(\d{1,2})月/);
                    if (m) return (m[1] + '-' + m[2].padStart(2, '0')) === monthFilter;
                    return false;
                });
            }

            if (mergeEnabled && currentFilter !== 'pending') {
                const merged = {};
                tasks.forEach(task => {
                    if (!merged[task.title]) {
                        merged[task.title] = { ...task, count: 1 };
                    } else {
                        merged[task.title].count++;
                        // 截止日期显示最后一次完成（最晚的日期）
                        if (task.dueDate && (!merged[task.title].dueDate || task.dueDate > merged[task.title].dueDate)) {
                            merged[task.title].dueDate = task.dueDate;
                        }
                    }
                });
                tasks = Object.values(merged);
            }

            tasks.sort((a, b) => {
                if (a.dueDate && b.dueDate) return new Date(b.dueDate) - new Date(a.dueDate);
                return 0;
            });

            renderTaskTable(tasks, mergeEnabled && currentFilter !== 'pending');
        }

        function renderTaskTable(tasks, showCount) {
            const tbody = document.getElementById('taskList');
            if (tasks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:40px;color:#999">暂无数据</td></tr>';
                return;
            }
            tbody.innerHTML = tasks.map(task => `
                <tr>
                    <td>
                        <span class="status-dot ${task.completed ? 'done' : 'todo'}"></span>
                        ${task.completed ? '已完成' : '待完成'}
                    </td>
                    <td class="task-title-cell" title="${task.title}">
                        ${task.title}
                        ${showCount && task.count > 1 ? `<span class="count-badge">${task.count}次</span>` : ''}
                    </td>
                    <td><span class="list-badge">${task.listName}</span></td>
                    <td class="date-cell">${task.dueDate || '-'}</td>
                </tr>
            `).join('');
        }

        function parseDate(str) {
            const m = str.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
            if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
            const m2 = str.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
            if (m2) return new Date(+m2[1], +m2[2] - 1, +m2[3]);
            return null;
        }

        // ====== Trend Chart (Canvas) ======
        let trendRange = 'week';

        function setTrendRange(range, btn) {
            trendRange = range;
            btn.parentElement.querySelectorAll('.range-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTrendChart();
        }

        // ====== Energy Distribution ======
        let energyRange = 'week';

        // 5 个列表的色系（与整体 UI 风格协调）
        const LIST_PALETTE = {
            '习惯建立':  { light: '#f5e3d8', main: '#c75b39', deep: '#8b3a23' },
            '学习':      { light: '#e8efea', main: '#5a8f7b', deep: '#3d6b5c' },
            '工作':      { light: '#e0e6ec', main: '#4a6585', deep: '#2d4259' },
            '日常琐事':  { light: '#f0e8db', main: '#a8855b', deep: '#735636' },
            '灵光一现':  { light: '#ebe4ec', main: '#8a7290', deep: '#5e4a64' }
        };
        // 兜底配色（未知列表自动分配）
        const FALLBACK_PALETTE = [
            { light: '#f0ebe3', main: '#b88762', deep: '#7d593f' },
            { light: '#e3eae8', main: '#6a9080', deep: '#3a5b50' }
        ];

        function getPalette(listName) {
            if (LIST_PALETTE[listName]) return LIST_PALETTE[listName];
            // 对未知列表用 hash 分配兜底色
            let hash = 0;
            for (let i = 0; i < listName.length; i++) {
                hash = (hash * 31 + listName.charCodeAt(i)) & 0xffff;
            }
            return FALLBACK_PALETTE[hash % FALLBACK_PALETTE.length];
        }

        function setEnergyRange(range, btn) {
            energyRange = range;
            btn.parentElement.querySelectorAll('.range-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderEnergy();
        }

        function filterTasksByRange() {
            if (energyRange === 'all') return [...allTasks];
            const now = new Date();
            let start;
            if (energyRange === 'week') {
                const day = now.getDay() || 7;
                start = new Date(now);
                start.setDate(now.getDate() - day + 1);
                start.setHours(0, 0, 0, 0);
            } else {
                start = new Date(now.getFullYear(), now.getMonth(), 1);
            }
            return allTasks.filter(t => {
                if (!t.dueDate) return false;
                const d = parseDate(t.dueDate);
                return d && d >= start;
            });
        }

        function renderEnergy() {
            const container = document.getElementById('energyList');
            const yAxis = document.getElementById('energyYAxis');
            const insightEl = document.getElementById('energyInsight');
            if (!container) return;
            container.innerHTML = '';
            container.className = 'energy-chart';
            if (yAxis) yAxis.innerHTML = '';

            const tasks = filterTasksByRange();
            const ALL_LISTS = ['习惯建立', '学习', '工作', '日常琐事', '灵光一现'];

            if (tasks.length === 0) {
                container.innerHTML = '<div class="empty-hint" style="margin:auto">该时间范围内暂无任务</div>';
                insightEl.innerHTML = '';
                return;
            }

            // 按 listName 统计
            const map = {};
            tasks.forEach(t => {
                const name = t.listName || '默认';
                if (!map[name]) map[name] = { total: 0, completed: 0, pending: 0 };
                map[name].total++;
                if (t.completed) map[name].completed++;
                else map[name].pending++;
            });

            // 柱体高度按最大任务量标准化（max=100%）
            const maxTotal = Math.max(...Object.values(map).map(s => s.total), 1);
            const totalAll = tasks.length;

            // Y 轴刻度
            if (yAxis) {
                const ticks = [0, Math.round(maxTotal / 3), Math.round(maxTotal * 2 / 3), maxTotal];
                yAxis.innerHTML = ticks.map(v => '<span>' + v + '</span>').join('');
            }

            let html = '';
            ALL_LISTS.forEach(name => {
                const stat = map[name] || { total: 0, completed: 0, pending: 0 };
                const palette = getPalette(name);
                const isEmpty = stat.total === 0;
                const donePct = isEmpty ? 0 : Math.round((stat.completed / stat.total) * 100);
                // 柱体总高度按任务量比例
                const barH = isEmpty ? 0 : (stat.total / maxTotal) * 100;
                // done 占柱体的比例
                const doneRatio = isEmpty ? 0 : stat.completed / stat.total;
                const doneH = barH * doneRatio;
                const pendingH = barH * (1 - doneRatio);
                const colEmpty = isEmpty ? ' empty' : '';

                html += '<div class="energy-col' + colEmpty + '" ' +
                        'style="--col-main:' + palette.main + ';--col-light:' + palette.light + '">';
                html += '<div class="energy-pct-label">' + (isEmpty ? '—' : donePct + '%') + '</div>';
                html += '<div class="energy-bar-track">';
                if (!isEmpty) {
                    // pending 在 done 上方（柱体顶部）
                    html += '<div class="energy-bar-fill" style="height:' + barH + '%">';
                    html += '<div class="energy-bar-pending" style="height:' + (pendingH / barH * 100) + '%"></div>';
                    html += '<div class="energy-bar-done" style="height:' + (doneH / barH * 100) + '%"></div>';
                    html += '</div>';
                }
                html += '</div>';
                html += '<div class="energy-base-dot"></div>';
                html += '<div class="energy-name-label">' + name + '</div>';
                html += '<div class="energy-count-label">' +
                        (isEmpty ? '无任务' : (stat.completed + '/' + stat.total)) +
                        '</div>';
                html += '</div>';
            });

            container.innerHTML = html;

            // 客观描述
            const rangeLabel = energyRange === 'week' ? '本周' : (energyRange === 'month' ? '本月' : '全部');
            const insights = [];
            const activeLists = ALL_LISTS.filter(n => map[n] && map[n].total > 0)
                .sort((a, b) => map[b].total - map[a].total);

            if (activeLists.length > 0) {
                const top = activeLists[0];
                const topPct = Math.round((map[top].total / totalAll) * 100);
                insights.push(`在【${top}】上的任务量安排最多（${map[top].total} 项 / 总 ${totalAll} 项，${topPct}%）`);
            }
            const byRate = activeLists.filter(k => map[k].total >= 2)
                .sort((a, b) => (map[b].completed / map[b].total) - (map[a].completed / map[a].total));
            if (byRate.length > 0) {
                const best = byRate[0];
                const rate = Math.round((map[best].completed / map[best].total) * 100);
                insights.push(`【${best}】完成比例最高（${rate}%）`);
            }
            const byBacklog = activeLists.filter(k => map[k].pending > 0)
                .sort((a, b) => (map[b].pending / map[b].total) - (map[a].pending / map[a].total));
            if (byBacklog.length > 0) {
                const top = byBacklog[0];
                const rate = Math.round((map[top].pending / map[top].total) * 100);
                insights.push(`【${top}】任务积压比例最高（待完成 ${map[top].pending} 项 / 总 ${map[top].total} 项，${rate}%）`);
            }

            insightEl.innerHTML = insights.map(t => '· ' + t).join('<br>');
            insightEl.innerHTML = '<strong>' + rangeLabel + '统计：</strong><br>' + insightEl.innerHTML;

            renderEnergyPie(map, ALL_LISTS, totalAll);
        }

        function renderEnergyPie(map, ALL_LISTS, totalAll) {
            const canvas = document.getElementById('energyPieCanvas');
            const legend = document.getElementById('energyPieLegend');
            const totalEl = document.getElementById('energyPieTotal');
            if (!canvas || !legend) return;
            if (totalEl) totalEl.textContent = totalAll;

            // 准备数据
            const segments = ALL_LISTS.map(name => {
                const stat = map[name] || { total: 0 };
                const palette = getPalette(name);
                return {
                    name: name,
                    value: stat.total,
                    color: palette.main,
                    light: palette.light
                };
            }).filter(s => s.value > 0);

            // 绘制圆环图
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const cssSize = 200;
            canvas.width = cssSize * dpr;
            canvas.height = cssSize * dpr;
            canvas.style.width = cssSize + 'px';
            canvas.style.height = cssSize + 'px';
            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, cssSize, cssSize);

            const cx = cssSize / 2;
            const cy = cssSize / 2;
            const radius = 80;
            const innerRadius = 50;
            const gap = 2; // 扇区间隔（度）

            if (segments.length === 0) {
                // 空状态
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                ctx.arc(cx, cy, innerRadius, Math.PI * 2, 0, true);
                ctx.fillStyle = '#f0ebe3';
                ctx.fill();
            } else {
                let startAngle = -Math.PI / 2; // 从 12 点钟方向开始
                const total = segments.reduce((s, x) => s + x.value, 0);
                const gapRad = (gap * Math.PI) / 180;

                segments.forEach(seg => {
                    const angle = (seg.value / total) * Math.PI * 2;
                    const endAngle = startAngle + angle;

                    ctx.beginPath();
                    ctx.moveTo(cx + Math.cos(startAngle + gapRad / 2) * innerRadius,
                               cy + Math.sin(startAngle + gapRad / 2) * innerRadius);
                    ctx.arc(cx, cy, radius, startAngle + gapRad / 2, endAngle - gapRad / 2);
                    ctx.arc(cx, cy, innerRadius, endAngle - gapRad / 2, startAngle + gapRad / 2, true);
                    ctx.closePath();
                    ctx.fillStyle = seg.color;
                    ctx.fill();

                    startAngle = endAngle;
                });
            }

            // 渲染图例
            let legendHtml = '';
            segments.sort((a, b) => b.value - a.value).forEach(seg => {
                const pct = Math.round((seg.value / totalAll) * 100);
                legendHtml += '<div class="energy-pie-legend-item">';
                legendHtml += '<span class="energy-pie-legend-swatch" style="background:' + seg.color + '"></span>';
                legendHtml += '<span class="energy-pie-legend-name">' + seg.name + '</span>';
                legendHtml += '<span class="energy-pie-legend-pct">' + seg.value + ' · ' + pct + '%</span>';
                legendHtml += '</div>';
            });
            legend.innerHTML = legendHtml;
        }

        function renderTrendChart() {
            const canvas = document.getElementById('trendCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            const buckets = trendRange === 'week' ? buildWeekBuckets() : buildMonthBuckets();
            drawLineChart(canvas, ctx, buckets);
        }

        function getISOWeek(d) {
            // ISO 周编号
            const date = new Date(d);
            date.setHours(0, 0, 0, 0);
            date.setDate(date.getDate() + 3 - ((date.getDay() + 6) % 7));
            const week1 = new Date(date.getFullYear(), 0, 4);
            return date.getFullYear() + '-W' + (1 + Math.round(((date - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7)).toString().padStart(2, '0');
        }

        function buildWeekBuckets() {
            const map = {};
            Object.keys(dateMap).forEach(d => {
                const key = getISOWeek(d);
                if (!map[key]) map[key] = { total: 0, completed: 0, start: d };
                map[key].total += dateMap[d].total;
                map[key].completed += dateMap[d].completed;
                if (d < map[key].start) map[key].start = d;
            });
            return Object.keys(map).sort().map(k => ({
                label: k.split('-W')[1] + '周',
                key: k,
                rate: map[k].total > 0 ? Math.round((map[k].completed / map[k].total) * 100) : 0,
                count: map[k].completed + '/' + map[k].total
            }));
        }

        function buildMonthBuckets() {
            const map = {};
            Object.keys(dateMap).forEach(d => {
                const dt = new Date(d);
                const key = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
                if (!map[key]) map[key] = { total: 0, completed: 0 };
                map[key].total += dateMap[d].total;
                map[key].completed += dateMap[d].completed;
            });
            return Object.keys(map).sort().map(k => {
                const [y, m] = k.split('-');
                return {
                    label: y + '/' + m,
                    key: k,
                    rate: map[k].total > 0 ? Math.round((map[k].completed / map[k].total) * 100) : 0,
                    count: map[k].completed + '/' + map[k].total
                };
            });
        }

        function drawLineChart(canvas, ctx, data) {
            const dpr = window.devicePixelRatio || 1;
            const parent = canvas.parentElement;
            const cssWidth = parent.clientWidth || 800;
            const cssHeight = 320;
            canvas.style.width = cssWidth + 'px';
            canvas.style.height = cssHeight + 'px';
            canvas.width = cssWidth * dpr;
            canvas.height = cssHeight * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, cssWidth, cssHeight);

            if (data.length === 0) {
                ctx.fillStyle = '#999';
                ctx.font = '13px -apple-system, "Noto Sans SC", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('暂无数据', cssWidth / 2, cssHeight / 2);
                return;
            }

            const padding = { top: 30, right: 30, bottom: 50, left: 60 };
            const chartW = cssWidth - padding.left - padding.right;
            const chartH = cssHeight - padding.top - padding.bottom;

            // 网格
            ctx.strokeStyle = '#f0ebe3';
            ctx.lineWidth = 1;
            ctx.font = '11px -apple-system, "Noto Sans SC", sans-serif';
            ctx.fillStyle = '#999';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';

            const ySteps = 5;
            for (let i = 0; i <= ySteps; i++) {
                const y = padding.top + chartH - (i / ySteps) * chartH;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(padding.left + chartW, y);
                ctx.stroke();
                ctx.fillText(Math.round(i * 100 / ySteps) + '%', padding.left - 8, y);
            }

            // 数据点
            const points = data.map((d, i) => ({
                x: data.length === 1 ? padding.left + chartW / 2 : padding.left + (i / (data.length - 1)) * chartW,
                y: padding.top + chartH - (d.rate / 100) * chartH,
                data: d
            }));

            // 区域填充
            if (points.length > 1) {
                ctx.fillStyle = 'rgba(90, 143, 123, 0.12)';
                ctx.beginPath();
                ctx.moveTo(points[0].x, padding.top + chartH);
                points.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.lineTo(points[points.length - 1].x, padding.top + chartH);
                ctx.closePath();
                ctx.fill();
            }

            // 折线
            ctx.strokeStyle = '#5a8f7b';
            ctx.lineWidth = 2;
            ctx.beginPath();
            points.forEach((p, i) => {
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();

            // 数据点 + tooltip
            points.forEach(p => {
                ctx.fillStyle = '#5a8f7b';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            });

            // X 轴标签
            ctx.fillStyle = '#999';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.font = '11px -apple-system, "Noto Sans SC", sans-serif';
            const step = Math.max(1, Math.ceil(data.length / 10));
            data.forEach((d, i) => {
                if (i % step !== 0 && i !== data.length - 1) return;
                const x = data.length === 1 ? padding.left + chartW / 2 : padding.left + (i / (data.length - 1)) * chartW;
                ctx.fillText(d.label, x, padding.top + chartH + 8);
            });
        }

        window.addEventListener('resize', () => {
            setTimeout(renderTrendChart, 100);
        });

        // Drag & drop
        const uploadCard = document.querySelector('.upload-card');
        uploadCard.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadCard.style.borderColor = 'var(--accent)';
        });
        uploadCard.addEventListener('dragleave', () => uploadCard.style.borderColor = 'var(--border)');
        uploadCard.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadCard.style.borderColor = 'var(--border)';
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                document.getElementById('fileInput').files = files;
                handleFile({ target: { files } });
            }
        });
    </script>
</body>
