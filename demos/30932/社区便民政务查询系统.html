<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XX市社区便民服务中心 — 政务办事指南</title>
<style>
/* ===== CSS Reset ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --gov-red:    #C41230;
  --gov-red-dark: #9B0D20;
  --gov-gold:   #C49B2A;
  --bg:         #f5f5f5;
  --bg-white:   #ffffff;
  --text:       #333333;
  --text-light: #666666;
  --border:     #e0e0e0;
  --radius:     6px;
  --shadow:     0 1px 4px rgba(0,0,0,0.08);
}
html { font-size: 16px; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", "SimSun", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.8;
  min-height: 100vh;
}

/* ===== 顶部政府红条 ===== */
.gov-topbar {
  background: #8B0000;
  color: #fff;
  font-size: 0.8rem;
  padding: 4px 20px;
  text-align: right;
  letter-spacing: 0.5px;
}
.gov-topbar a { color: #ffd; text-decoration: none; margin-left: 16px; }

/* ===== 头部大横幅 ===== */
.gov-header {
  background: linear-gradient(180deg, var(--gov-red) 0%, var(--gov-red-dark) 100%);
  color: #fff;
  padding: 22px 20px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.gov-header::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0; right: 0;
  height: 5px;
  background: repeating-linear-gradient(90deg,
    var(--gov-gold) 0px, var(--gov-gold) 15px,
    transparent 15px, transparent 30px);
}
.gov-header h1 {
  font-size: 1.8rem;
  font-weight: 700;
  letter-spacing: 3px;
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
}
.gov-header p {
  font-size: 0.9rem;
  opacity: 0.9;
  margin-top: 4px;
  letter-spacing: 1px;
}

/* ===== 导航栏（子页面显示） ===== */
.gov-nav {
  background: #fff;
  border-bottom: 2px solid var(--gov-red);
  padding: 0 20px;
  display: none; /* 首页隐藏 */
}
.gov-nav-inner {
  max-width: 1000px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 10px 0;
  font-size: 0.9rem;
  color: var(--text-light);
  flex-wrap: wrap;
}
.gov-nav-inner a {
  color: var(--gov-red);
  text-decoration: none;
  cursor: pointer;
  font-weight: 600;
}
.gov-nav-inner a:hover { text-decoration: underline; }
.gov-nav-inner .sep { color: #ccc; }

/* ===== 主容器 ===== */
.main-container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 20px;
  min-height: 50vh;
}

/* ===== 页面视图 ===== */
.page { display: none; }
.page.active {
  display: block;
  animation: fadeIn 0.35s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ===== 首页搜索区域 ===== */
.search-area {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.search-area h3 {
  font-size: 1.15rem;
  color: var(--gov-red);
  margin-bottom: 14px;
  padding-left: 10px;
  border-left: 4px solid var(--gov-red);
}
.search-row {
  display: flex;
  gap: 8px;
  max-width: 600px;
}
.search-row input {
  flex: 1;
  height: 46px;
  padding: 0 16px;
  border: 2px solid #ccc;
  border-radius: var(--radius);
  font-size: 1rem;
  outline: none;
  min-width: 0;
  transition: border-color 0.25s;
}
.search-row input:focus { border-color: var(--gov-red); }
.search-row button {
  height: 46px;
  padding: 0 24px;
  background: var(--gov-red);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 1rem;
  cursor: pointer;
  font-weight: 600;
  letter-spacing: 1px;
  white-space: nowrap;
  transition: background 0.2s;
}
.search-row button:hover { background: var(--gov-red-dark); }
.search-row button:active { opacity: 0.85; }
.search-tags {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.search-tags span {
  background: #fff5f5;
  color: var(--gov-red);
  border: 1px solid #fcc;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.2s;
}
.search-tags span:hover { background: #ffe8e8; }

/* ===== 分类板块 ===== */
.category-section {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.category-section h3 {
  font-size: 1.15rem;
  color: var(--gov-red);
  margin-bottom: 16px;
  padding-left: 10px;
  border-left: 4px solid var(--gov-red);
}
.cat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
.cat-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 14px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s;
  background: #fafbfc;
}
.cat-card:hover {
  border-color: var(--gov-red);
  background: #fff8f8;
  box-shadow: 0 2px 8px rgba(196,18,48,0.12);
  transform: translateY(-2px);
}
.cat-card:active { transform: scale(0.97); }
.cat-card .cat-icon {
  width: 56px;
  height: 56px;
  line-height: 56px;
  margin: 0 auto 10px;
  border-radius: 50%;
  font-size: 1.5rem;
  font-weight: 700;
  color: #fff;
}
.cat-card:nth-child(1) .cat-icon { background: var(--gov-red); }
.cat-card:nth-child(2) .cat-icon { background: #D4760A; }
.cat-card:nth-child(3) .cat-icon { background: #1B7B3A; }
.cat-card:nth-child(4) .cat-icon { background: #285E8E; }
.cat-card .cat-name {
  font-size: 1.05rem;
  font-weight: 700;
  color: #222;
  margin-bottom: 2px;
}
.cat-card .cat-sub {
  font-size: 0.78rem;
  color: #999;
}

/* ===== 事项列表页 ===== */
.list-title {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--gov-red);
  margin-bottom: 16px;
  padding: 12px 16px;
  background: #fff;
  border-left: 5px solid var(--gov-red);
  border-radius: 0 var(--radius) var(--radius) 0;
  box-shadow: var(--shadow);
}
.item-table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  box-shadow: var(--shadow);
  border-radius: var(--radius);
  overflow: hidden;
}
.item-table thead th {
  background: #f7f7f7;
  padding: 12px 16px;
  text-align: left;
  font-size: 0.9rem;
  font-weight: 600;
  color: #555;
  border-bottom: 2px solid var(--gov-red);
}
.item-table tbody td {
  padding: 14px 16px;
  border-bottom: 1px solid #eee;
  font-size: 0.95rem;
}
.item-table tbody tr {
  cursor: pointer;
  transition: background 0.2s;
}
.item-table tbody tr:hover { background: #fff8f8; }
.item-table tbody tr:active { background: #ffeeee; }
.item-table .td-num {
  width: 50px;
  text-align: center;
  color: var(--gov-red);
  font-weight: 700;
}
.item-table .td-arrow {
  width: 40px;
  text-align: center;
  color: #ccc;
  font-size: 1.1rem;
}

/* ===== 详情页 ===== */
.detail-top {
  background: #fff;
  border-left: 5px solid var(--gov-red);
  padding: 18px 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  border-radius: 0 var(--radius) var(--radius) 0;
}
.detail-top .tag {
  display: inline-block;
  background: var(--gov-red);
  color: #fff;
  padding: 2px 12px;
  border-radius: 3px;
  font-size: 0.78rem;
  margin-bottom: 8px;
}
.detail-top h3 {
  font-size: 1.25rem;
  color: #222;
  margin-bottom: 4px;
}
.detail-top .desc { color: #888; font-size: 0.9rem; }

.detail-section {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.detail-section h4 {
  font-size: 1.05rem;
  color: var(--gov-red);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px dashed #ddd;
}
/* 流程步骤 */
.step-list { list-style: none; }
.step-list li {
  position: relative;
  padding: 6px 0 6px 38px;
  font-size: 0.95rem;
  line-height: 1.8;
  border-left: 2px solid #f0d0d0;
  margin-left: 14px;
  padding-bottom: 14px;
}
.step-list li:last-child { border-left-color: transparent; padding-bottom: 0; }
.step-list li::before {
  content: "";
  position: absolute;
  left: -8px;
  top: 10px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--gov-red);
  border: 2px solid #fff;
  box-shadow: 0 0 0 2px var(--gov-red);
}
/* 材料表格 */
.material-table {
  width: 100%;
  border-collapse: collapse;
}
.material-table td {
  padding: 8px 12px;
  border: 1px solid #eee;
  font-size: 0.9rem;
}
.material-table tr:nth-child(odd) { background: #fafafa; }
.material-table .mat-num {
  width: 40px;
  text-align: center;
  color: var(--gov-red);
  font-weight: 700;
}
/* 信息卡片 */
.info-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.info-card {
  background: #fafbfc;
  border: 1px solid #eee;
  padding: 14px;
  border-radius: var(--radius);
}
.info-card .info-label {
  font-size: 0.8rem;
  color: #999;
  margin-bottom: 6px;
}
.info-card .info-val {
  font-size: 0.95rem;
  color: #333;
  font-weight: 600;
  line-height: 1.6;
}
.info-card .info-val.phone { color: var(--gov-red); font-size: 1.05rem; }

/* ===== FAQ ===== */
.faq-wrap {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
}
.faq-wrap h3 {
  font-size: 1.15rem;
  color: var(--gov-red);
  margin-bottom: 14px;
  padding-left: 10px;
  border-left: 4px solid var(--gov-red);
}
.faq-item {
  border: 1px solid #eee;
  border-radius: var(--radius);
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.2s;
}
.faq-item:hover { border-color: #fcc; }
.faq-q {
  padding: 14px 16px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.95rem;
  font-weight: 600;
  color: #444;
  user-select: none;
  background: #fafbfc;
  gap: 10px;
}
.faq-q .q-badge {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  line-height: 24px;
  text-align: center;
  background: var(--gov-red);
  color: #fff;
  border-radius: 3px;
  font-size: 0.75rem;
  font-weight: 700;
}
.faq-q .faq-arrow {
  flex-shrink: 0;
  font-size: 0.8rem;
  color: #999;
  transition: transform 0.3s;
}
.faq-item.open .faq-q { background: #fff8f8; color: var(--gov-red); }
.faq-item.open .faq-arrow { transform: rotate(180deg); }
.faq-a {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease, padding 0.4s ease;
  padding: 0 16px;
  font-size: 0.9rem;
  color: #666;
  line-height: 1.9;
  background: #fffcfc;
  border-top: 1px solid transparent;
}
.faq-item.open .faq-a {
  max-height: 350px;
  padding: 12px 16px 16px;
  border-top-color: #fee;
}
.faq-a .a-badge {
  display: inline-block;
  background: #C49B2A;
  color: #fff;
  border-radius: 3px;
  width: 24px;
  height: 24px;
  line-height: 24px;
  text-align: center;
  font-size: 0.75rem;
  font-weight: 700;
  margin-right: 8px;
  vertical-align: middle;
}

/* ===== 搜索结果 ===== */
.empty-msg {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 48px 20px;
  text-align: center;
  color: #999;
  box-shadow: var(--shadow);
}
.empty-msg .big-icon { font-size: 2.5rem; margin-bottom: 10px; }
mark { background: #fff3cd; padding: 1px 3px; border-radius: 2px; }

/* ===== 返回按钮(子页面右下角悬浮) ===== */
.float-home {
  position: fixed;
  bottom: 30px;
  right: 30px;
  z-index: 200;
  display: none; /* 首页隐藏 */
}
.float-home button {
  background: var(--gov-red);
  color: #fff;
  border: none;
  font-size: 1rem;
  padding: 12px 24px;
  border-radius: 30px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(196,18,48,0.35);
  font-weight: 600;
  letter-spacing: 1px;
  transition: all 0.25s;
}
.float-home button:hover {
  background: var(--gov-red-dark);
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(196,18,48,0.4);
}
.float-home button:active { transform: scale(0.95); }

/* ===== 页脚 ===== */
.gov-footer {
  background: #5a1a1a;
  color: #ccc;
  text-align: center;
  padding: 20px;
  font-size: 0.78rem;
  line-height: 2;
  margin-top: 20px;
}
.gov-footer .links { margin-bottom: 8px; }
.gov-footer .links a {
  color: #ddd;
  text-decoration: none;
  margin: 0 10px;
}
.gov-footer .links a:hover { color: #fff; text-decoration: underline; }

/* ===== 响应式 ===== */
@media (max-width: 768px) {
  .gov-header h1 { font-size: 1.3rem; letter-spacing: 1px; }
  .cat-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .info-cards { grid-template-columns: 1fr; }
  .item-table { font-size: 0.85rem; }
  .item-table thead { display: none; }
  .item-table tbody tr {
    display: block;
    padding: 12px;
    border-bottom: 2px solid #eee;
  }
  .item-table tbody td {
    display: block;
    padding: 4px 0;
    border: 0;
  }
  .item-table .td-num { text-align: left; }
  .item-table .td-num::before { content: "序号："; font-weight: 400; color: #999; }
  .item-table .td-arrow { display: none; }
  .search-row { flex-direction: column; }
  .search-row button { width: 100%; }
  .float-home button { padding: 10px 18px; font-size: 0.9rem; }
  .float-home { bottom: 20px; right: 16px; }
}
</style>
</head>

<!-- ===== 顶部红条 ===== -->
<div class="gov-topbar">

<!-- ===== 头部大横幅 ===== -->
<header class="gov-header" id="govHeader">

  <p>便民 · 高效 · 规范 · 廉洁</p>
</header>

<!-- ===== 面包屑导航（子页面显示） ===== -->
<nav class="gov-nav" id="govNav">

  <!-- ······· 分类列表页 ······· -->
  <div class="page" id="page-category">
    <div class="list-title" id="catTitle"></div>
    <table class="item-table">
      <thead>
        <tr><th style="width:50px">序号</th><th>事项名称</th><th>所属类别</th><th style="width:40px"></th></tr>

</main>

<!-- ===== FAQ（仅首页显示） ===== -->
<div class="main-container" id="faqContainer">

<!-- ===== 返回首页悬浮按钮（子页面显示） ===== -->
<div class="float-home" id="floatHome">

</div>

<!-- ===== 页脚 ===== -->
<footer class="gov-footer">
  <div class="links">
    <a href="javascript:;">关于我们</a> |
    <a href="javascript:;">联系我们</a> |
    <a href="javascript:;">网站地图</a> |

</footer>

  { q:'养老金资格认证可由家属代办吗？', a:'目前推荐使用"掌上12333"APP或"电子社保卡"微信小程序进行线上人脸识别认证，操作简单。老人如不便使用手机的，家属可协助操作。对行动不便又无法线上认证的特殊情况，可联系社区申请工作人员上门认证服务。每年至少认证一次，两次认证间隔不超过12个月。' },
  { q:'身份证换证可以异地办理吗？需要带哪些材料？', a:'本省户籍居民可在省内任一公安派出所异地换领身份证。需携带：户口本原件及原身份证。换证工本费20元，约15—20个工作日完成。拍照建议穿深色上衣，不化浓妆，露出双耳双眉。跨省异地办理目前需咨询当地派出所是否开通。' },
  { q:'高龄津贴从什么时候开始发放？每月多少钱？', a:'高龄津贴从老人年满80周岁的当月开始计发，申请审核通过后按月拨付。津贴标准由各市（区）自行确定，一般为每人每月50—300元不等，部分城市对90周岁以上或百岁老人有更高标准。具体金额请咨询户籍所在地社区。' },
  { q:'灵活就业人员申请社保补贴需要满足什么条件？', a:'一般要求申请人被认定为就业困难人员（如女性40周岁以上、男性50周岁以上等），并以灵活就业形式正常缴纳社会保险费。补贴通常按实际缴费金额的50%—70%标准发放，期限一般不超过3年，距法定退休年龄不足5年的可延长至退休。具体条件以当地人社部门规定为准。' },
];

/* ---------- 工具函数 ---------- */
function $(id) { return document.getElementById(id); }
function escapeHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
/* 高亮关键词 */
function markText(t, kw) {
  var e = escapeHtml(t);
  if (!kw) return e;
  return e.replace(new RegExp('('+escapeRe(kw)+')', 'gi'), '<mark>$1</mark>');
}

/* ---------- 页面状态 ---------- */
var curPage = 'home';
var curCatId = '';

/* 切换页面 */
function showPage(name) {
  var pages = document.querySelectorAll('.page');
  for (var i=0; i<pages.length; i++) pages[i].classList.remove('active');
  var p = $('page-'+name);
  if (p) p.classList.add('active');
  curPage = name;
  var home = (name==='home');
  $('govNav').style.display = home ? 'none' : '';
  $('faqContainer').style.display = home ? '' : 'none';
  $('floatHome').style.display = home ? 'none' : '';
  window.scrollTo({top:0, behavior:'smooth'});
}
/* 返回首页 */
function goHome() {
  showPage('home');
  $('searchInput').value = '';
}

/* ---------- 首页渲染 ---------- */
function renderCategories() {
  var h = '';
  for (var i=0; i<categoryList.length; i++) {
    var c=categoryList[i];
    h += '<div class="cat-card" onclick="openCat(\''+c.id+'\')">'
       + '<div class="cat-icon">'+c.icon+'</div>'
       + '<div class="cat-name">'+c.name+'</div>'
       + '<div class="cat-sub">'+c.sub+'</div>'
       + '</div>';
  }
  $('catGrid').innerHTML = h;
}

/* ---------- 分类列表 ---------- */
function openCat(catId) {
  curCatId = catId;
  var cat = null;
  for (var i=0; i<categoryList.length; i++) { if (categoryList[i].id===catId) { cat=categoryList[i]; break; } }
  $('catTitle').textContent = '■ ' + (cat ? cat.name : '');
  $('navCurrent').textContent = (cat ? cat.name : '') + '办事事项';
  var subset = [];
  for (var j=0; j<items.length; j++) { if (items[j].cat===catId) subset.push(items[j]); }
  var rows = '';
  for (var k=0; k<subset.length; k++) {
    rows += '<tr onclick="openDetail(\''+subset[k].id+'\')">'
          + '<td class="td-num">'+(k+1)+'</td>'
          + '<td><strong>'+escapeHtml(subset[k].title)+'</strong><br><small style="color:#999">'+escapeHtml(subset[k].summary)+'</small></td>'
          + '<td style="color:#888;font-size:0.85rem">'+(cat?cat.name:'')+'</td>'
          + '<td class="td-arrow">▶</td>'
          + '</tr>';
  }
  $('itemTbody').innerHTML = rows;
  showPage('category');
}

/* ---------- 事项详情 ---------- */
function openDetail(id) {
  var item = null;
  for (var i=0; i<items.length; i++) { if (items[i].id===id) { item=items[i]; break; } }
  if (!item) return;
  var cat = null;
  for (var j=0; j<categoryList.length; j++) { if (categoryList[j].id===item.cat) { cat=categoryList[j]; break; } }
  $('navCurrent').textContent = (cat?cat.name+' › ':'') + item.title;

  /* 流程 */
  var steps = '';
  for (var s=0; s<item.process.length; s++) {
    steps += '<li>' + escapeHtml(item.process[s]) + '</li>';
  }
  /* 材料 */
  var mats = '';
  for (var m=0; m<item.materials.length; m++) {
    mats += '<tr><td class="mat-num">'+(m+1)+'</td><td>'+escapeHtml(item.materials[m])+'</td></tr>';
  }

  $('detailBody').innerHTML =
    '<div class="detail-top">'
    + '<span class="tag">'+(cat?cat.name:'')+'</span>'
    + '<h3>'+escapeHtml(item.title)+'</h3>'
    + '<div class="desc">'+escapeHtml(item.summary)+'</div>'
    + '</div>'

    + '<div class="detail-section">'
    + '<h4>办理流程</h4>'
    + '<ul class="step-list">'+steps+'</ul>'
    + '</div>'

    + '<div class="detail-section">'
    + '<h4>所需材料清单</h4>'
    + '<table class="material-table"><tbody>'+mats+'</tbody></table>'
    + '</div>'

    + '<div class="detail-section">'
    + '<h4>办理信息</h4>'
    + '<div class="info-cards">'
    + '<div class="info-card"><div class="info-label">办理地点</div><div class="info-val">'+escapeHtml(item.location)+'</div></div>'
    + '<div class="info-card"><div class="info-label">工作时间</div><div class="info-val">'+escapeHtml(item.hours)+'</div></div>'
    + '<div class="info-card"><div class="info-label">咨询电话</div><div class="info-val phone">'+escapeHtml(item.phone)+'</div></div>'
    + '</div>'
    + '</div>';

  showPage('detail');
}

/* ---------- 搜索 ---------- */
function doSearch() {
  var kw = $('searchInput').value.trim();
  if (!kw) { showPage('home'); return; }
  var lkw = kw.toLowerCase();
  var results = [];
  for (var i=0; i<items.length; i++) {
    var it = items[i];
    var cat = null;
    for (var j=0; j<categoryList.length; j++) { if (categoryList[j].id===it.cat) { cat=categoryList[j]; break; } }
    var haystack = (it.title+' '+it.summary+' '+(cat?cat.name:'')+' '+it.materials.join(' ')+' '+it.process.join(' ')).toLowerCase();
    if (haystack.indexOf(lkw) >= 0) results.push({item:it, cat:cat});
  }
  var body = $('searchBody');
  if (results.length===0) {
    body.innerHTML = '<div class="empty-msg"><div class="big-icon">📭</div><p>未找到与"<strong>'+escapeHtml(kw)+'</strong>"匹配的办事事项</p><p style="font-size:0.85rem;margin-top:6px;">请尝试调整关键词，如"社保""居住证""身份证""补贴""异地就医"等</p></div>';
  } else {
    var rows = '';
    for (var k=0; k<results.length; k++) {
      var r = results[k];
      rows += '<tr onclick="openDetail(\''+r.item.id+'\')">'
            + '<td class="td-num">'+(k+1)+'</td>'
            + '<td><strong>'+markText(r.item.title,kw)+'</strong><br><small style="color:#999">'+markText(r.item.summary,kw)+'</small></td>'
            + '<td style="color:#888;font-size:0.85rem">'+(r.cat?r.cat.name:'')+'</td>'
            + '<td class="td-arrow">▶</td>'
            + '</tr>';
    }
    body.innerHTML = '<table class="item-table"><thead><tr><th style="width:50px">序号</th><th>事项名称</th><th>所属类别</th><th style="width:40px"></th></tr></thead><tbody>'+rows+'</tbody></table>';
  }
  $('navCurrent').textContent = '查询"'+kw+'"的结果';
  showPage('search');
}

function quickSearch(kw) {
  $('searchInput').value = kw;
  doSearch();
}

/* ---------- FAQ ---------- */
function renderFAQ() {
  var h = '';
  for (var i=0; i<faqList.length; i++) {
    h += '<div class="faq-item" id="faq-'+i+'">'
       + '<div class="faq-q" onclick="toggleFAQ('+i+')">'
       + '<span><span class="q-badge">Q</span> '+escapeHtml(faqList[i].q)+'</span>'
       + '<span class="faq-arrow">▼</span>'
       + '</div>'
       + '<div class="faq-a"><span class="a-badge">A</span>'+escapeHtml(faqList[i].a)+'</div>'
       + '</div>';
  }
  $('faqList').innerHTML = h;
}

function toggleFAQ(idx) {
  var el = $('faq-'+idx);
  var all = document.querySelectorAll('.faq-item.open');
  for (var i=0; i<all.length; i++) {
    if (all[i] !== el) all[i].classList.remove('open');
  }
  el.classList.toggle('open');
}

/* ---------- 初始化 ---------- */
document.addEventListener('DOMContentLoaded', function(){
  renderCategories();
  renderFAQ();
  showPage('home');
});

document.addEventListener('keydown', function(e){
  if (e.key==='Enter' && document.activeElement===$('searchInput')) {
    doSearch();
  }
});
</script>
</body>
</html>
