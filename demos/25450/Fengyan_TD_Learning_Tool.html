                uiPanel.style.width = panelWidth + 'px';
                uiPanel.style.minWidth = panelWidth + 'px';
                
                const mainWidth = mainGame.clientWidth || 800;
                const mainHeight = mainGame.clientHeight || 600;
                
                canvas.width = Math.max(500, mainWidth - panelWidth);
                canvas.height = Math.max(400, mainHeight);

                // 根据画布大小动态计算 TILE_SIZE，填充场景
                const mapW = canvas.width - MAP_OFFSET_X - 8;
                const mapH = canvas.height - 4;
                const tileFromW = Math.floor(mapW / MAP_WIDTH);
                const tileFromH = Math.floor(mapH / MAP_HEIGHT);
                // 小屏幕最小 32px，大屏幕最大 52px（适配台式显示器）
                TILE_SIZE = Math.max(32, Math.min(52, tileFromW, tileFromH));
                tileSizeSq = TILE_SIZE * TILE_SIZE;
                // 重新计算地图垂直居中偏移
                mapOffsetY = Math.max(0, Math.floor((canvas.height - MAP_HEIGHT * TILE_SIZE) / 2));
            }
        }

        function dealCards() {
            gameState.hand = [];
            let availableCards = [];
            
            if (selectedHero) {
                // 已选择武将时，只保留部队和火焰卡牌，不包含任何武将卡牌
                availableCards = [...troopCards, ...fireCards];
            } else {
                // 未选择武将时，包含所有卡牌
                availableCards = [...heroCards, ...troopCards, ...fireCards];
            }
            
            for (let i = 0; i < 10; i++) {
                // 检查是否已有相同卡牌，有则重新抽取
                let attempts = 0;
                let randomCard;
                do {
                    randomCard = availableCards[Math.floor(Math.random() * availableCards.length)];
                    attempts++;
                    // 防止无限循环（如果卡牌池太小）
                    if (attempts > 50) break;
                } while (gameState.hand.some(card => card.id === randomCard.id));
                
                gameState.hand.push({...randomCard, uid: Date.now() + i});
            }
            
            renderHand();
        }

        function renderHand() {
            const deck = cachedUIElements.cardDeck;
            if (!deck) return;
            deck.innerHTML = '';
            
            if (!gameState.hand || !Array.isArray(gameState.hand)) {
                gameState.hand = [];
            }
            
            if (typeof gameState.gold !== 'number' || isNaN(gameState.gold)) {
                gameState.gold = 150;
            }
            
            const currentGold = gameState.gold;
            
            for (let index = 0; index < gameState.hand.length; index++) {
                const card = gameState.hand[index];
                if (!card) continue;
                
                const safeIcon = card.icon || '?';
                const safeName = card.name || '未知';
                const safeCost = typeof card.cost === 'number' ? card.cost : 0;
                
                // 判断是否是武将卡牌
                const isHeroCard = card.isHero === true || heroCards.some(h => h.id === card.id);

                // 发兵模式下全部可点击（包子不足时由点击弹提示）
                const mode = gameState.placementMode;
                let isDisabled;
                if (mode === 'send') {
                    isDisabled = false; // 发兵模式永远可点击，由点击函数处理提示
                } else {
                    isDisabled = !isHeroCard && currentGold < safeCost;
                }

                // 波次进行中所有卡牌禁用
                if (gameState.waveInProgress) {
                    isDisabled = true;
                }
                
                const cardEl = document.createElement('div');
                let cardClass = 'card';
                if (gameState.selectedIndex === index) {
                    cardClass += ' selected';
                }
                if (isDisabled) {
                    cardClass += ' disabled';
                }
                
                cardEl.className = cardClass;
                cardEl.dataset.index = index;
                
                // 武将卡牌显示"免费"，不受军饷限制
                const costDisplay = isHeroCard ? '🎖️ 免费' : '💰 ' + safeCost;
                
                cardEl.innerHTML = `
                    <div class="card-icon">${safeIcon}</div>
                    <div class="card-name">${safeName}</div>
                    <div class="card-cost">${costDisplay}</div>
                `;
                
                // 只有非禁用状态才绑定点击事件
                if (!isDisabled) {
                    (function(idx) {
                        cardEl.onclick = function(e) {
                            e.stopPropagation();
                            selectCard(idx);
                        };
                    })(index);
                }
                
                deck.appendChild(cardEl);
            }
            
            const handCountEl = cachedUIElements.handCount;
            if (handCountEl) handCountEl.textContent = gameState.hand.length;
        }

        function selectCard(index) {
            // 超安全版本 - 只做最基本的事
            if (typeof index !== 'number') return;
            if (!gameState.hand || !Array.isArray(gameState.hand)) return;
            if (index < 0 || index >= gameState.hand.length) return;
            
            const card = gameState.hand[index];
            if (!card) return;
            
            // 清除塔选择
            selectedTowerForUpgrade = null;
            const upgradeSection = document.getElementById('towerUpgradeSection');
            if (upgradeSection) upgradeSection.style.display = 'none';

            // 退兵选卡时取消退兵模式
            if (gameState.retreatMode) {
                gameState.retreatMode = false;
                const retBtn = document.getElementById('retreatBtn');
                if (retBtn) {
                    retBtn.textContent = '🚪 退兵';
                    retBtn.style.background = '';
                }
                canvas.style.cursor = 'default';
            }

            // 波次进行中禁止建造/发兵/火焰（只允许查看信息）
            if (gameState.waveInProgress) {
                // 仅显示信息，不设置选中状态
                const section = document.getElementById('selectedCardSection');
                if (section) section.style.display = 'block';
                const textEl = document.getElementById('selectedCardText');
                if (textEl) {
                    const icon = card.icon || '?';
                    const name = card.name || '未知';
                    const safeCost = card.isHero === true ? '免费' : ('💰 ' + (typeof card.cost === 'number' ? card.cost : 0));
                    const desc = card.desc || '';
                    textEl.textContent = '⛔ 波次中 ' + icon + ' ' + name + ' (' + safeCost + ') - ' + desc;
                }
                return;
            }

            // 发兵模式下点击卡牌直接发兵，无需再点包子车
            const mode = gameState.placementMode;
            if (mode === 'send') {
                if (gameState.baozi < 10) {
                    addFloatingText(canvas.width / 2, canvas.height / 2 - 30, '🥟 包子不足！无法发兵！', '#ff4444', 60, -1.5);
                    return;
                }
                gameState.selectedCard = card;
                gameState.selectedIndex = index;
                sendTroopToEnemy();
                // 使用完后取消选择
                gameState.selectedCard = null;
                gameState.selectedIndex = null;
                renderHand();
                const sec = document.getElementById('selectedCardSection');
                if (sec) sec.style.display = 'none';
                return;
            }

            // 只设置状态，不做其他任何事
            gameState.selectedCard = card;
            gameState.selectedIndex = index;
            
            // 调用 renderHand 重新渲染，这样更安全
            renderHand();
            
            // 简单显示选择区
            const section = document.getElementById('selectedCardSection');
            if (section) {
                section.style.display = 'block';
            }
            
            const textEl = document.getElementById('selectedCardText');
            if (textEl) {
                const icon = card.icon || '?';
                const name = card.name || '未知';
                const safeCost = card.isHero === true ? '免费' : ('💰 ' + (typeof card.cost === 'number' ? card.cost : 0));
                const desc = card.desc || '';
                textEl.textContent = icon + ' ' + name + ' (' + safeCost + ') - ' + desc;
            }
        }

        function handleCanvasClick(e) {
            try {
                if (gameState.isPaused || gameState.gameOver) return;

                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                
                const rawX = (e.clientX - rect.left) * scaleX;
                const rawY = (e.clientY - rect.top) * scaleY;
                
                // 转换为地图坐标（减去左侧信息面板占位和垂直居中偏移）
                const x = rawX - MAP_OFFSET_X;
                const y = rawY - mapOffsetY;
                
                // 直接计算tile坐标
                const tileX = Math.floor(x / TILE_SIZE);
                const tileY = Math.floor(y / TILE_SIZE);
                
                // 检查是否点击了包子车区域（canvas绝对坐标）
                if (gameState.baoziCartArea) {
                    const cartArea = gameState.baoziCartArea;
                    if (rawX >= cartArea.x && rawX <= cartArea.x + cartArea.width &&
                        rawY >= cartArea.y && rawY <= cartArea.y + cartArea.height) {
                        sendTroopToEnemy();
                        return;
                    }
                }
                
                // 锤子模式（锤子作用于地图坐标的敌人）
                if (gameState.hammerMode) {
                    const hammerRange = 3 * TILE_SIZE;
                    const centerX = x;
                    const centerY = y;
                    
                    // 只眩晕敌人，不眩晕我方塔
                    enemies.forEach(target => {
                        const dx = target.x - centerX;
                        const dy = target.y - centerY;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < hammerRange) {
                            target.stunned = 120;
                            for (let i = 0; i < 10; i++) {
                                particles.push({
                                    x: target.x,
                                    y: target.y,
                                    vx: (Math.random() - 0.5) * 150,
                                    vy: (Math.random() - 0.5) * 150,
                                    life: 40,
                                    color: '#ffd700'
                                });
                            }
                        }
                    });
                    
                    for (let i = 0; i < 20; i++) {
                        particles.push({
                            x: centerX,
                            y: centerY,
                            vx: (Math.random() - 0.5) * 200,
                            vy: (Math.random() - 0.5) * 200,
                            life: 50,
                            color: '#ff9900'
                        });
                    }
                    
                    gameState.hammerCooldown = 300;
                    gameState.hammerMode = false;
                    playSound('hammer', 0.3);
                    triggerScreenShake(5, 12);
                    const el = cachedUIElements;
                    if (el.hammerBtn) {
                        el.hammerBtn.textContent = '🔨 锤子';
                        el.hammerBtn.style.background = '';
                    }
                    updateUI();
                    return;
                }
                
                // 退兵模式：点击塔拆除并退款
                if (gameState.retreatMode) {
                    const foundTower = findTowerAt(tileX, tileY);
                    if (foundTower) {
                        doRetreatTower(foundTower);
                    }
                    // 点击任意处退出退兵模式
                    gameState.retreatMode = false;
                    const retBtn = document.getElementById('retreatBtn');
                    if (retBtn) {
                        retBtn.textContent = '🚪 退兵';
                        retBtn.style.background = '';
                    }
                    canvas.style.cursor = 'default';
                    return;
                }

                // 检测是否点击了已有的塔（选择升级）
                if (!gameState.selectedCard || gameState.hammerMode) {
                    const foundTower = findTowerAt(tileX, tileY);
                    if (foundTower) {
                        // 取消卡牌选择
                        gameState.selectedCard = null;
                        gameState.selectedIndex = null;
                        document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
                        document.getElementById('selectedCardSection').style.display = 'none';
                        // 选中塔
                        selectedTowerForUpgrade = foundTower;
                        updateTowerUpgradeUI();
                        return;
                    }
                }
                
                if (!gameState.selectedCard) return;
                
                // 完全独立的检查 - 不依赖后续函数
                const card = gameState.selectedCard;
                if (!card) {
                    return;
                }
                
                // 检查卡牌花费（武将除外）
                const isHero = card.isHero === true;
                const cost = typeof card.cost === 'number' ? card.cost : 0;
                
                if (!isHero) {
                    if (isNaN(cost) || cost <= 0) {
                        alert('无效卡牌！');
                        return;
                    }
                    
                    // 检查金币
                    let currentGold = gameState.gold;
                    if (typeof currentGold !== 'number' || isNaN(currentGold)) {
                        currentGold = 150;
                        gameState.gold = 150;
                    }
                    
                    if (currentGold < cost) {
                        alert('军饷不足！');
                        return;
                    }
                }
                
                const mode = gameState.placementMode;
                
                console.log('=== 点击调试信息 ===');
                console.log('tileX:', tileX, 'tileY:', tileY);
                console.log('mode:', mode);
                console.log('selectedCard:', gameState.selectedCard ? gameState.selectedCard.name : 'none');
                console.log('isHero:', gameState.selectedCard ? gameState.selectedCard.isHero : 'N/A');
                
                // 波次进行中禁止建造/火焰/发兵（锤子已在上方处理）
                if (gameState.waveInProgress) return;

                if (mode === 'build' || mode === 'fire') {
                    console.log('地图数据:', tileY >= 0 && tileY < MAP_HEIGHT && mapData[tileY] ? mapData[tileY][tileX] : 'invalid');
                    
                    // 建造模式：只能在我方区域（tileX < 11）
                    if (mode === 'build') {
                        if (tileX >= 11) {
                            console.log('拦截：敌人出现区域或敌方区域！');
                            alert('⚠️ 只能在我方区域建造！敌人出现区域和敌方区域不能建造！');
                            return;
                        }
                    }
                    
                    if (tileX < 0 || tileX >= MAP_WIDTH || tileY < 0 || tileY >= MAP_HEIGHT) {
                        console.log('拦截：超出地图范围！');
                        alert('⚠️ 超出地图范围！');
                        return;
                    }
                    
                    if (!mapData[tileY] || mapData[tileY][tileX] !== 2) {
                        console.log('拦截：不可建造区域！');
                        alert('⚠️ 该位置不能建造！');
                        return;
                    }
                    
                    console.log('允许建造');
                    if (mode === 'build') {
                        placeBuilding(tileX, tileY);
                    } else if (mode === 'fire') {
                        placeFireZone(tileX, tileY);
                    }
                } else if (mode === 'send') {
                    sendTroopToEnemy();
                }
            } catch (error) {
                console.error('处理画布点击时出错:', error);
                alert('操作时发生错误，请重试！');
            }
        }

        function placeBuilding(tileX, tileY) {
            try {
                console.log('=== placeBuilding 调试 ===');
                console.log('tileX:', tileX, 'tileY:', tileY);
                console.log('当前金币:', gameState.gold, '选中卡牌:', gameState.selectedCard ? gameState.selectedCard.name : null);
                console.log('mapData tile value:', (mapData[tileY] && typeof mapData[tileY][tileX] !== 'undefined') ? mapData[tileY][tileX] : 'invalid');
                
                // 0. 超级安全检查 - 敌人出现区域和敌方区域绝对不能建造
                if (tileX >= 11) {
                    console.error('严重错误：尝试在敌人出现区域或敌方区域建造！tileX:', tileX);
                    alert('❌ 不能在敌人出现区域或敌方区域建造！');
                    return;
                }
                
                // 1. 基础验证
                if (!gameState.selectedCard) {
                    return;
                }
                
                const card = gameState.selectedCard;
                console.log('选中卡牌:', card.name, 'isHero:', card.isHero);
                
                // 判断是否是武将卡牌
                const isHeroCard = card.isHero === true || heroCards.some(h => h.id === card.id);
                console.log('判断为武将:', isHeroCard);
                
                // 2. 验证金币（武将除外）
                if (!isHeroCard) {
                    if (typeof gameState.gold !== 'number' || isNaN(gameState.gold)) {
                        gameState.gold = 150;
                    }
                    
                    if (typeof card.cost !== 'number' || isNaN(card.cost)) {
                        return;
                    }
                    
                    if (gameState.gold < card.cost) {
                        alert('军饷不足！');
                        return;
                    }
                }
                
                // 3. 验证位置 - 只能在我方区域（tileX < 11）
                if (tileX >= 11) {
                    alert('只能在我方区域建造！');
                    return;
                }
                
                // 4. 检查是否在地图范围内
                if (tileX < 0 || tileX >= MAP_WIDTH || tileY < 0 || tileY >= MAP_HEIGHT) {
                    alert('超出地图范围！');
                    return;
                }
                
                // 5. 检查地图数据是否允许建造
                if (!mapData[tileY] || mapData[tileY][tileX] !== 2) {
                    alert('该位置不能建造！');
                    return;
                }
                
                // 6. 检查该位置是否已有建筑
                const existing = towers.find(t => t.tileX === tileX && t.tileY === tileY);
                if (existing) {
                    alert('该位置已有建筑！');
                    return;
                }
                
                // 7. 扣除金币（武将不需要军饷）
                if (!isHeroCard) {
                    safeModifyGold(-card.cost);
                }
                
                // 8. 创建塔（初始等级1）
                const stats = getTowerStats({ type: card, level: 1 });
                const tower = {
                    x: tileX * TILE_SIZE + TILE_SIZE / 2,
                    y: tileY * TILE_SIZE + TILE_SIZE / 2,
                    tileX: tileX,
                    tileY: tileY,
                    type: card,
                    level: 1,
                    hp: stats.hp,
                    maxHp: stats.maxHp,
                    lastAttack: 0,
                    stunned: 0,
                    skillCooldown: 0
                };
                
                towers.push(tower);
                
                // 9. 增强粒子效果
                createExplosion(tower.x, tower.y, '#ffcc00', 15, 1);
                createStars(tower.x, tower.y, '#ffdd00', 8);
                playSound('build', 0.25);
                triggerScreenShake(2, 8);
                
                // 10. 清理选择
                // 武将卡牌一次性使用，放置后从手牌移除
                if (isHeroCard) {
                    gameState.hand.splice(gameState.selectedIndex, 1);
                    renderHand();
                }
                gameState.selectedCard = null;
                gameState.selectedIndex = null;
                
                // 11. 更新UI
                const cards = document.querySelectorAll('.card');
                if (cards && cards.forEach) {
                    cards.forEach(c => c.classList.remove('selected'));
                }
                
                const selectedCardSection = document.getElementById('selectedCardSection');
                if (selectedCardSection) {
                    selectedCardSection.style.display = 'none';
                }
                
                // 非武将卡牌保留在手牌中可重复建造
                updateUI();
            } catch (error) {
                console.error('建造建筑时出错:', error);
                alert('建造时出错，请重试！');
            }
        }

        function placeFireZone(tileX, tileY) {
            try {
                // 1. 基础验证
                if (!gameState.selectedCard) {
                    return;
                }
                
                const card = gameState.selectedCard;
                
                // 2. 验证金币（武将除外，虽然火焰模式没有武将，但保持一致）
                if (!card.isHero) {
                    if (typeof gameState.gold !== 'number' || isNaN(gameState.gold)) {
                        gameState.gold = 150;
                    }
                    
                    if (typeof card.cost !== 'number' || isNaN(card.cost)) {
                        return;
                    }
                    
                    if (gameState.gold < card.cost) {
                        alert('军饷不足！');
                        return;
                    }
                }
                
                // 3. 验证位置 - 只能在我方区域（tileX < 17）
                if (tileX >= 17) {
                    alert('只能在我方区域建造！');
                    return;
                }
                
                const existing = fireZones.find(z => z.tileX === tileX && z.tileY === tileY);
                if (existing) {
                    alert('该位置已有火焰！');
                    return;
                }
                
                // 4. 扣除军饷（武将除外）
                if (!card.isHero) {
                    safeModifyGold(-card.cost);
                }
                
                // 5. 创建火焰区域
                fireZones.push({
                    tileX: tileX,
                    tileY: tileY,
                    type: card.type,
                    damage: card.damage || 0,
                    slow: card.slow || 0,
                    range: card.range || 1,
                    duration: card.duration || 15,
                    maxDuration: card.duration || 15
                });
                
                // 6. 添加粒子效果
                const particleColor = card.type === 'ice' ? '#66ccff' : '#ff6600';
                for (let i = 0; i < 10; i++) {
                    particles.push({
                        x: tileX * TILE_SIZE + TILE_SIZE / 2,
                        y: tileY * TILE_SIZE + TILE_SIZE / 2,
                        vx: (Math.random() - 0.5) * 80,
                        vy: (Math.random() - 0.5) * 80,
                        life: 30,
                        color: particleColor
                    });
                }
                
                // 7. 清理选择
                gameState.hand.splice(gameState.selectedIndex, 1);
                gameState.selectedCard = null;
                gameState.selectedIndex = null;
                
                // 8. 更新UI
                const cards = document.querySelectorAll('.card');
                if (cards && cards.forEach) {
                    cards.forEach(c => c.classList.remove('selected'));
                }
                
                const selectedCardSection = document.getElementById('selectedCardSection');
                if (selectedCardSection) {
                    selectedCardSection.style.display = 'none';
                }
                
                renderHand();
                updateUI();
            } catch (error) {
                console.error('放置火焰区域时出错:', error);
                alert('放置时出错，请重试！');
            }
        }

        function sendTroopToEnemy() {
            try {
                // 检查包子数量
                const baoziCount = gameState.baozi || 0;
                console.log('sendTroopToEnemy 调试: 当前包子:', baoziCount, '发兵池大小:', pendingTroops.length, '选中卡牌:', gameState.selectedCard ? gameState.selectedCard.name : 'none');
                if (baoziCount < 10) {
                    alert('包子不足！需要至少10个包子才能发兵。');
                    return;
                }

                // 消耗10个包子
                gameState.baozi -= 10;

                // 优先使用当前选中的卡牌（如果是部队卡），否则随机一个troopCards
                let chosenTroop = null;
                if (gameState.selectedCard && gameState.selectedCard.troop) {
                    chosenTroop = gameState.selectedCard;
                } else if (gameState.selectedCard) {
                    // 选中了非部队卡（英雄/火焰），提示并随机选部队
                    addFloatingText(canvas.width / 2, canvas.height / 2, '非部队卡，已随机派兵', '#ffaa00', 40, -1.5);
                    chosenTroop = troopCards[Math.floor(Math.random() * troopCards.length)];
                } else {
                    chosenTroop = troopCards[Math.floor(Math.random() * troopCards.length)];
                }

                // 将部队添加到发兵池，随下一波敌人一起出现
                pendingTroops.push({
                    type: { ...chosenTroop, id: 'pending_' + Date.now() },
                    hp: chosenTroop.hp,
                    maxHp: chosenTroop.hp,
                    speed: chosenTroop.speed || 0.8,
                    damage: chosenTroop.damage
                });
                
                // 在包子车位置显示飘字效果
                const cartArea = gameState.baoziCartArea;
                if (cartArea) {

        // ============ 波次管理 ============
        /**
         * 开始新波次：

         * 4. 生成敌方波次敌人（AI的部队进攻我方君主）

        function startWave() {

        /**
         * 生成我方波次敌人：
         * 从waveConfigs读取配置，将敌人加入enemiesToSpawn待生成队列
         * 敌人在tileX 11-12区域按网格均匀分布，向左（我方君主）移动
         * 动态计算生成间隔，确保所有敌人在5秒（300帧）内生成完毕
         */
        function spawnMyWave() {
            const config = waveConfigs[gameState.wave - 1];
            
            // 收集所有要生成的敌人
            let allEnemies = [];
            config.myEnemies.forEach(group => {
                for (let i = 0; i < group.count; i++) {
                    allEnemies.push(group.type);
                }
            });
            
            // 将敌人添加到待生成队列
            gameState.enemiesToSpawn = [];
            allEnemies.forEach((typeId, index) => {
                const type = enemyTypes.find(e => e.id === typeId);
                if (!type) return;
                
                // 每波增加 5% 的敌人属性
                const waveBonus = 1 + (gameState.wave - 1) * 0.05;
                
                // 按网格排列生成位置，确保不重叠
                const cols = 2; // 两列
                const rows = Math.ceil(allEnemies.length / cols);
                const tileYStep = (12 - 2) / rows; // 12 行可用空间
                
                const col = index % cols; // 0 或 1（两列）
                const row = Math.floor(index / cols);
                
                // 在敌人出现区域（tileX 11-12，tileY 2-13）内均匀分布
                const spawnTileX = 11 + col; // 11 或 12 列
                const spawnTileY = 2 + row * tileYStep + tileYStep / 2; // 每行中间位置
                
                const spawnX = spawnTileX * TILE_SIZE + TILE_SIZE / 2;
                const spawnY = spawnTileY * TILE_SIZE + TILE_SIZE / 2;

                // 应用波次增益
                const bonusHp = Math.floor(type.hp * waveBonus);
                const bonusDamage = Math.floor(type.damage * waveBonus);

                const jitter = TILE_SIZE * 0.3;
                gameState.enemiesToSpawn.push({
                    type: { ...type, hp: bonusHp, maxHp: bonusHp, damage: bonusDamage },
                    hp: bonusHp,
                    maxHp: bonusHp,
                    speed: type.speed,
                    damage: bonusDamage,
                    x: spawnX + (Math.random() - 0.5) * jitter,
                    y: spawnY + (Math.random() - 0.5) * jitter,
                    slowFactor: 1,
                    stunned: 0,
                    targetX: 2 * TILE_SIZE + TILE_SIZE / 2 + (Math.random() - 0.5) * TILE_SIZE,
                    targetY: 7 * TILE_SIZE + TILE_SIZE / 2 + (Math.random() - 0.5) * TILE_SIZE * 0.5,
                    initialMove: true // 标记：初始移动阶段，不检测塔
                });
            });
            
            // 重置生成计时器
            gameState.enemySpawnTimer = 0;
            
            // 动态计算生成间隔，确保在 5 秒（300 帧）内生成完所有敌人
            const totalEnemies = gameState.enemiesToSpawn.length + gameState.opponentEnemiesToSpawn.length;
            if (totalEnemies > 0) {
                // 300 帧内生成完所有敌人，向下取整，最少 1 帧
                gameState.enemySpawnInterval = Math.max(1, Math.floor(300 / totalEnemies));
            }
        }

        // ============ AI模拟人类玩家 ============
        function aiDealHand() {
            // 确保至少有6张部队卡+2张火焰卡
            aiState.hand = [];
            // 先加6个部队卡
            const shuffledTroops = [...troopCards].sort(() => Math.random() - 0.5);
            for (let i = 0; i < Math.min(6, shuffledTroops.length); i++) {
                aiState.hand.push({ ...shuffledTroops[i], uid: 'ai_' + Date.now() + '_' + i });
            }
            // 再加2个火焰卡
            const shuffledFire = [...fireCards].sort(() => Math.random() - 0.5);
            for (let i = 0; i < Math.min(2, shuffledFire.length); i++) {
                aiState.hand.push({ ...shuffledFire[i], uid: 'ai_fire_' + Date.now() + '_' + i });
            }
            // 30%概率再加一张武将卡
            if (Math.random() < 0.3) {
                const hero = heroCards[Math.floor(Math.random() * heroCards.length)];
                aiState.hand.push({ ...hero, uid: 'ai_hero_' + Date.now(), isHero: true });
            }
        }

        function aiUpdate() {
            if (gameState.gameOver || gameState.isPaused) return;
            if (pvpPhase !== 'idle') return;
            if (gameState.waveInProgress) return;

            // AI累积金币（每秒1次，前期约6金币/秒，后期约15金币/秒）
            if (!aiState.goldTimer) aiState.goldTimer = 0;
            aiState.goldTimer++;
            if (aiState.goldTimer >= 60) {
                aiState.goldTimer = 0;
                // AI每秒收入 ≈ 玩家收入的60-70%（AI决策差但手牌免费）
                opponentGold += 0.8 + gameState.wave * 0.1;
            }

            // AI包子累积
            if (Math.random() < 0.003) {
                aiState.baozi += 1;
            }

            // 手牌不足时立即补牌（任何时候，不限波次）
            if (aiState.hand.length < 4) {
                aiDealHand();
            }

            // 快速决策：每30帧决策一次
            aiState.decisionTimer++;
            if (aiState.decisionTimer < 30) return;
            aiState.decisionTimer = 0;

            // 锤子冷却
            if (aiState.hammerCooldown > 0) aiState.hammerCooldown--;

            // ============ 决策 ============
            const isAggressive = aiState.personality === 1;
            const isDefensive = aiState.personality === 2;
            const towerCount = opponentTowers.length;
            const actions = [];

            // 1. 建造新塔（最高优先级）
            if (towerCount < 15) {
                const hasTroopCard = aiState.hand.some(c => c.troop || troopCards.some(t => t.id === c.id));
                if (hasTroopCard && opponentGold >= 10) {
                    actions.push({ type: 'build', priority: 95 });
                }
            }

            // 2. 升级已有塔
            if (towerCount > 0) {
                const upgradeable = opponentTowers.filter(t => {
                    if (t.hp <= 0 || t.defeated) return false;
                    const cost = getUpgradeCost(t);
                    return cost > 0 && cost <= opponentGold;
                });
                if (upgradeable.length > 0) {
                    actions.push({ type: 'upgrade', priority: isDefensive ? 90 : 75 });
                }
            }

            // 3. 发兵
            if (aiState.baozi >= 10 && towerCount >= 2) {
                actions.push({ type: 'send', priority: isAggressive ? 85 : 50 });
            }

            // 4. 锤子
            if (aiState.hammerCooldown <= 0 && enemies.length > 1) {
                actions.push({ type: 'hammer', priority: 70 });
            }

            // 5. 火焰陷阱
            const hasFire = aiState.hand.some(c => fireCards.some(f => f.id === c.id));
            if (hasFire && opponentGold >= 15 && towerCount >= 3) {
                actions.push({ type: 'fire', priority: 45 });
            }

            actions.sort((a, b) => b.priority - a.priority);
            if (actions.length === 0) return;

            const chosen = actions[0];

            switch (chosen.type) {
                case 'upgrade': aiDoUpgrade(); break;
                case 'build': aiDoBuild(); break;
                case 'fire': aiDoFire(); break;
                case 'send': aiDoSend(); break;
                case 'hammer': aiDoHammer(); break;
            }
        }

        // AI升级塔（不变，但升级后返还1/3金币避免AI破产）
        function aiDoUpgrade() {
            const upgradeable = opponentTowers.filter(t => {
                if (t.hp <= 0 || t.defeated) return false;
                const cost = getUpgradeCost(t);
                return cost > 0 && cost <= opponentGold;
            });
            if (upgradeable.length === 0) return;

            upgradeable.sort((a, b) => {
                const aScore = (a.level || 1) * 10 - Math.abs(a.tileX - 12) * 2;
                const bScore = (b.level || 1) * 10 - Math.abs(b.tileX - 12) * 2;
                return aScore - bScore;
            });
            const target = upgradeable[0];
            const cost = getUpgradeCost(target);
            if (cost > 0 && opponentGold >= cost) {
                opponentGold -= cost;
                target.level = (target.level || 1) + 1;
                const stats = getTowerStats(target);
                target.hp = stats.hp;
                target.maxHp = stats.maxHp;
                createExplosion(target.x, target.y, '#aa44ff', 12, 1);
                addFloatingText(target.x, target.y - 45, `⬆️ 敌方升级 Lv.${target.level}`, '#cc66ff', 50, -1.5);
            }
        }

        // AI建造塔（重写：只建部队卡和武将卡，不建火焰卡）
        function aiDoBuild() {
            // 只选部队卡和武将卡（去掉火焰卡）
            const affordable = aiState.hand.filter(c => {
                const isTroop = c.troop || troopCards.some(t => t.id === c.id);
                const isHero = c.isHero === true || heroCards.some(h => h.id === c.id);
                if (isHero) return true;
                return isTroop && c.cost && c.cost <= opponentGold;
            });
            if (affordable.length === 0) return;

            // 选卡策略
            let card;
            if (opponentTowers.length < 4) {
                // 前期优先最便宜的卡
                affordable.sort((a, b) => (a.cost || 999) - (b.cost || 999));
                card = affordable[0];
            } else if (opponentTowers.length >= 8 && Math.random() < 0.3) {
                // 后期有机会建英雄
                const heroes = affordable.filter(c => c.isHero || heroCards.some(h => h.id === c.id));
                card = heroes.length > 0 ? heroes[Math.floor(Math.random() * heroes.length)] : null;
            }
            if (!card) {
                // 默认按性价比选
                affordable.sort((a, b) => ((b.damage || 1) * 5 + (b.hp || 50)) / (b.cost || 1) - ((a.damage || 1) * 5 + (a.hp || 50)) / (a.cost || 1));
                card = affordable[0];
            }
            if (!card) return;

            // 选建造位置
            const buildable = [];
            for (let y = 2; y < MAP_HEIGHT - 2; y++) {
                for (let x = 13; x < MAP_WIDTH - 2; x++) {
                    if (!mapData[y] || mapData[y][x] !== 1) continue;
                    if (opponentTowers.find(t => t.tileX === x && t.tileY === y)) continue;
                    let score = 0;
                    const distToFront = Math.abs(x - 12);
                    score += Math.max(0, 8 - distToFront) * 4;
                    const centerY = Math.abs(y - 7);
                    score += Math.max(0, 5 - centerY) * 2;
                    const nearby = opponentTowers.filter(t =>
                        Math.abs(t.tileX - x) <= 2 && Math.abs(t.tileY - y) <= 2
                    ).length;
                    score -= nearby * 12;
                    buildable.push({ x, y, score });
                }
            }
            if (buildable.length === 0) return;
            buildable.sort((a, b) => b.score - a.score);
            const pickIdx = Math.random() < 0.7 ? 0 : Math.floor(Math.random() * Math.min(4, buildable.length));
            const pos = buildable[pickIdx];

            const isHeroCard = card.isHero === true || heroCards.some(h => h.id === card.id);
            const cost = isHeroCard ? 0 : (card.cost || 0);

            if (!isHeroCard) opponentGold -= cost;

            const stats = getTowerStats({ type: card, level: 1 });
            opponentTowers.push({
                x: pos.x * TILE_SIZE + TILE_SIZE / 2,
                y: pos.y * TILE_SIZE + TILE_SIZE / 2,
                tileX: pos.x, tileY: pos.y,
                type: card,
                level: 1,
                hp: stats.hp,
                maxHp: stats.maxHp,
                lastAttack: 0,
                stunned: 0,
                skillCooldown: 0
            });

            // 移除已使用的卡
            const idx = aiState.hand.findIndex(c => c.uid === card.uid);
            if (idx >= 0) aiState.hand.splice(idx, 1);

            createExplosion(pos.x * TILE_SIZE + TILE_SIZE / 2, pos.y * TILE_SIZE + TILE_SIZE / 2, '#aa44ff', 10, 1);
        }

        // AI放置火焰
        function aiDoFire() {
            const fireCard = aiState.hand.find(c => fireCards.some(f => f.id === c.id));
            if (!fireCard) return;
            const cost = fireCard.cost || 15;
            if (opponentGold < cost) return;

            const possible = [];
            for (let y = 2; y < MAP_HEIGHT - 2; y++) {
                for (let x = 2; x < 10; x++) {
                    if (opponentFireZones.find(z => z.tileX === x && z.tileY === y)) continue;
                    let score = Math.random() * 20;
                    enemies.forEach(e => {
                        const ex = Math.floor(e.x / TILE_SIZE);
                        const ey = Math.floor(e.y / TILE_SIZE);
                        const dist = Math.abs(ex - x) + Math.abs(ey - y);
                        if (dist < 5) score += (5 - dist) * 5;
                    });
                    possible.push({ x, y, score });
                }
            }
            if (possible.length === 0) return;
            possible.sort((a, b) => b.score - a.score);
            const pos = possible[0];

            opponentGold -= cost;
            opponentFireZones.push({
                tileX: pos.x, tileY: pos.y,
                type: fireCard.type,
                damage: fireCard.damage || 0,
                slow: fireCard.slow || 0,
                range: fireCard.range || 1,
                duration: fireCard.duration || 15,
                maxDuration: fireCard.duration || 15
            });

            const idx = aiState.hand.findIndex(c => c.uid === fireCard.uid);
            if (idx >= 0) aiState.hand.splice(idx, 1);
        }

        // AI发兵（加入发兵池，随下一波敌人一起出现）
        function aiDoSend() {
            if (aiState.baozi < 10) return;
            aiState.baozi -= 10;

            const troop = troopCards[Math.floor(Math.random() * troopCards.length)];
            aiPendingTroops.push({
                type: { ...troop, id: 'ai_pending_' + Date.now() },
                hp: troop.hp,
                maxHp: troop.hp,
                speed: 0.8,
                damage: troop.damage
            });

            createSparks(
                MAP_WIDTH * TILE_SIZE - TILE_SIZE,
                7 * TILE_SIZE + TILE_SIZE / 2,
                '#ff44aa', 8
            );
            addFloatingText(MAP_WIDTH * TILE_SIZE - TILE_SIZE, 7 * TILE_SIZE + TILE_SIZE / 2 - 20, `敌方发兵: ${troop.icon}${troop.name}`, '#ff44aa', 50, -1.5);
        }

        // AI锤子
        function aiDoHammer() {
            if (aiState.hammerCooldown > 0) return;

            const nearEnemies = myEnemies.filter(e =>
                 e.x > 13 * TILE_SIZE && e.hp > 0 && e.stunned <= 0
             );
            if (nearEnemies.length === 0) return;

            // 锤子落点：根据实际目标位置随机选择（AI锤子作用于靠近敌方区域的部队）
            const target = nearEnemies[Math.floor(Math.random() * nearEnemies.length)];
            const centerX = target.x + (Math.random() - 0.5) * 2 * TILE_SIZE;
            const centerY = target.y + (Math.random() - 0.5) * 2 * TILE_SIZE;
            const hammerRange = 3 * TILE_SIZE;

            nearEnemies.forEach(e => {
                const dx = e.x - centerX;
                const dy = e.y - centerY;
                if (Math.sqrt(dx * dx + dy * dy) < hammerRange) {
                    e.stunned = 90;
                }
            });

            aiState.hammerCooldown = 480;
            createExplosion(centerX, centerY, '#cc44ff', 15, 1);
            addFloatingText(centerX, centerY, '敌方使用了🔨锤子！', '#cc44ff', 60, -1.5);
        }

        function updateUI() {
            const el = cachedUIElements;
            if (typeof gameState.gold !== 'number' || isNaN(gameState.gold)) {
                gameState.gold = 150;
            }
            if (el.gold) el.gold.textContent = Math.floor(gameState.gold);
            if (el.baozi) el.baozi.textContent = gameState.baozi || 0;
            if (el.lordHp) el.lordHp.textContent = Math.ceil(gameState.lordHp);
            if (el.kills) el.kills.textContent = gameState.kills;
            
            if (gameState.hammerCooldown > 0) {
                if (el.hammerCd) el.hammerCd.textContent = `锤: ${Math.ceil(gameState.hammerCooldown / 60)}秒`;
                if (el.hammerBtn) el.hammerBtn.disabled = true;
            } else {
                if (el.hammerCd) el.hammerCd.textContent = '锤: 就绪';
                if (el.hammerBtn) el.hammerBtn.disabled = false;
            }
            
            // 技能冷却更新
            if (towers && towers.forEach) {
                towers.forEach(tower => {
                    if (tower.skillCooldown > 0) {
                        tower.skillCooldown--;
                    }
                });
            }
            // 如果金币发生变化，检查卡牌可用性
            if (prevGold !== gameState.gold) {
                prevGold = gameState.gold;
                checkCardAvailability();
            }
            updateTowerUpgradeUI();
        }

        // 每当金币发生变化时调用，保证手牌/选中卡牌的可用状态与金币保持一致
        function checkCardAvailability() {
            try {
                const currentGold = (typeof gameState.gold === 'number' && !isNaN(gameState.gold)) ? gameState.gold : 0;

                // 如果当前选中的卡不再可用，则取消选择
                if (gameState.selectedCard) {
                    const card = gameState.selectedCard;
                    const isHeroCard = card.isHero === true || heroCards.some(h => h.id === card.id);
                    const cost = (typeof card.cost === 'number') ? card.cost : 0;
                    if (!isHeroCard && currentGold < cost) {
                        gameState.selectedCard = null;
                        gameState.selectedIndex = null;
                        const section = document.getElementById('selectedCardSection');
                        if (section) section.style.display = 'none';
                    }
                }

                // 重新渲染手牌，renderHand 中会根据当前金币决定卡牌是否 disabled
                renderHand();
            } catch (e) {
                console.error('检查卡牌可用性出错:', e);
            }
        }

        function updateWavePreview() {
            const preview = cachedUIElements.wavePreview;
            if (!preview || gameState.wave > gameState.maxWaves) return;
            
            const config = waveConfigs[gameState.wave - 1];
            if (!config) return;
            let text = `第 ${gameState.wave} 波 (敌人总兵力: ${calculateWaveEnemyPower(gameState.wave)}):\n`;
            config.myEnemies.forEach(group => {
                const type = enemyTypes.find(e => e.id === group.type);
                if (type) text += `${type.icon} ${type.name} x${group.count}\n`;
            });
            text += `\n敌方发兵:\n`;
