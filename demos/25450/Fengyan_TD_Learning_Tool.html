        function drawBattleInfo() {
            try {
                const px = 8;
                let py = 8;
                const panelW = MAP_OFFSET_X;
                const contentW = panelW - 14;

                // 背景
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, panelW, canvas.height);

                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';

                // ──────── 波次 & 兵力 ────────
                ctx.fillStyle = '#ffcc00';
                ctx.font = 'bold 14px Arial';
                ctx.fillText(`🌊 波次 ${gameState.wave}/${gameState.maxWaves}`, px, py);
                py += 22;

                ctx.font = 'bold 12px Arial';
                ctx.fillStyle = '#88ff88';
                ctx.fillText('🟢 我方', px, py);
                ctx.fillStyle = '#aaffaa';
                ctx.fillText(`兵力 ${calculateOurTotalPower()}`, px + 52, py);
                py += 18;

                ctx.fillStyle = '#ff8888';
                ctx.fillText('🔴 敌方', px, py);
                ctx.fillStyle = '#ffaaaa';
                ctx.fillText(`兵力 ${calculateOpponentTotalPower()}`, px + 52, py);
                py += 22; // 到本波敌人的外边距

                // ──────── 本波敌人 ────────
                ctx.fillStyle = '#ffaa66';
                ctx.font = 'bold 12px Arial';
                ctx.fillText('⚔️ 本波', px, py);
                py += 18;

                const config = waveConfigs[gameState.wave - 1];
                if (config) {
                    const merged = {};
                    config.myEnemies.forEach(g => {
                        merged[g.type] = (merged[g.type] || 0) + g.count;
                    });
                    ctx.font = '11px Arial';
                    for (const [typeId, count] of Object.entries(merged)) {
                        const et = enemyTypes.find(t => t.id === typeId);
                        if (!et) continue;
                        const waveMult = 1 + (gameState.wave - 1) * 0.05;
                        const atk = Math.ceil(et.damage * waveMult);
                        const def = Math.ceil(et.hp * waveMult);
                        ctx.fillStyle = '#ddd';
                        ctx.fillText(`${et.icon}${et.name}x${count}`, px, py);
                        ctx.fillStyle = '#ffaa66';
                        ctx.fillText(`⚔${atk}❤${def}`, px + 80, py);
                        py += 16;
                        if (py > canvas.height - 140) break;
                    }
                }

                py += 6;

                // ──────── 分隔线 ────────
                ctx.strokeStyle = 'rgba(255, 180, 50, 0.25)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(px + contentW, py);
                ctx.stroke();
                py += 8;

                // ──────── 包子车区 ────────
                const cartPanelX = px;
                const cartPanelW = contentW;
                const cartY = py;
                const cartH = 50;

                ctx.fillStyle = '#8B4513';
                ctx.fillRect(cartPanelX, cartY, cartPanelW, cartH);
                ctx.fillStyle = '#4a3520';
                ctx.beginPath();
                ctx.arc(cartPanelX + 8, cartY + cartH + 3, 5, 0, Math.PI * 2);
                ctx.arc(cartPanelX + cartPanelW - 8, cartY + cartH + 3, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#D2691E';
                ctx.fillRect(cartPanelX + 3, cartY + 4, cartPanelW - 6, 10);
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🥟🥟', cartPanelX + cartPanelW / 2, cartY + cartH / 2 + 4);

                ctx.textAlign = 'left';
                py = cartY + cartH + 8;

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`🥟 ${gameState.baozi}个  |  点击发兵`, cartPanelX + cartPanelW / 2, py);
                py += 18;

                if (gameState.baoziTimer >= 295) {
                    ctx.save();
                    ctx.fillStyle = '#ffcc00';
                    ctx.font = 'bold 15px Arial';
                    ctx.shadowColor = '#ffcc00';
                    ctx.shadowBlur = 10;
                    ctx.fillText('+2 🥟', cartPanelX + cartPanelW / 2, py);
                    ctx.restore();
                }
                py += 10;

                // ──────── 玩家发兵池 ────────
                const poolIconSize = 24;
                const poolPerRow = 3;
                const poolH = 56;

                ctx.fillStyle = pendingTroops.length > 0 ? 'rgba(60, 40, 20, 0.85)' : 'rgba(60, 50, 40, 0.85)';
                ctx.fillRect(cartPanelX, py, cartPanelW, poolH);
                ctx.strokeStyle = pendingTroops.length > 0 ? '#ffcc00' : '#666';
                ctx.lineWidth = 1;
                ctx.strokeRect(cartPanelX, py, cartPanelW, poolH);

                ctx.fillStyle = '#ffcc00';
                ctx.font = 'bold 11px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`🟡 我方发兵池 (${pendingTroops.length})`, cartPanelX + cartPanelW / 2, py + 10);

                if (pendingTroops.length > 0) {
                    const showCount = Math.min(pendingTroops.length, 6);
                    for (let i = 0; i < showCount; i++) {
                        const col = i % poolPerRow;
                        const row = Math.floor(i / poolPerRow);
                        const cx = cartPanelX + 8 + col * 33;
                        const cy = py + 22 + row * 26;
                        ctx.fillStyle = 'rgba(255, 200, 50, 0.2)';
                        ctx.beginPath();
                        ctx.arc(cx + poolIconSize / 2, cy + poolIconSize / 2, poolIconSize / 2 - 2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.font = '16px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(pendingTroops[i].type.icon, cx + poolIconSize / 2 - 1, cy + poolIconSize / 2);
                    }
                    if (pendingTroops.length > 6) {
                        ctx.fillStyle = '#ffaa00';
                        ctx.font = '10px Arial';
                        ctx.textAlign = 'right';
                        ctx.textBaseline = 'top';
                        ctx.fillText(`+${pendingTroops.length - 6}`, cartPanelX + cartPanelW - 2, py + poolH - 4);
                    }
                } else {
                    ctx.fillStyle = 'rgba(150, 130, 100, 0.4)';
                    ctx.font = '11px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('空', cartPanelX + cartPanelW / 2, py + poolH / 2 + 4);
                }
                ctx.textBaseline = 'top';
                py += poolH + 6;

                // ──────── 敌方发兵池 ────────
                ctx.fillStyle = aiPendingTroops.length > 0 ? 'rgba(40, 20, 50, 0.85)' : 'rgba(50, 40, 50, 0.85)';
                ctx.fillRect(cartPanelX, py, cartPanelW, poolH);
                ctx.strokeStyle = aiPendingTroops.length > 0 ? '#cc66ff' : '#555';
                ctx.lineWidth = 1;
                ctx.strokeRect(cartPanelX, py, cartPanelW, poolH);

                ctx.fillStyle = '#cc88ff';
                ctx.font = 'bold 11px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`🟣 敌方发兵池 (${aiPendingTroops.length})`, cartPanelX + cartPanelW / 2, py + 10);

                if (aiPendingTroops.length > 0) {
                    const showCount = Math.min(aiPendingTroops.length, 6);
                    for (let i = 0; i < showCount; i++) {
                        const col = i % poolPerRow;
                        const row = Math.floor(i / poolPerRow);
                        const cx = cartPanelX + 8 + col * 33;
                        const cy = py + 22 + row * 26;
                        ctx.fillStyle = 'rgba(170, 68, 255, 0.2)';
                        ctx.beginPath();
                        ctx.arc(cx + poolIconSize / 2, cy + poolIconSize / 2, poolIconSize / 2 - 2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.font = '16px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(aiPendingTroops[i].type.icon, cx + poolIconSize / 2 - 1, cy + poolIconSize / 2);
                    }
                    if (aiPendingTroops.length > 6) {
                        ctx.fillStyle = '#cc88ff';
                        ctx.font = '10px Arial';
                        ctx.textAlign = 'right';
                        ctx.textBaseline = 'top';
                        ctx.fillText(`+${aiPendingTroops.length - 6}`, cartPanelX + cartPanelW - 2, py + poolH - 4);
                    }
                } else {
                    ctx.fillStyle = 'rgba(150, 130, 150, 0.4)';
                    ctx.font = '11px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('空', cartPanelX + cartPanelW / 2, py + poolH / 2 + 4);
                }

                py += poolH + 6;

                // ──────── AI手牌 ────────
                if (aiState.hand && aiState.hand.length > 0) {
                    py += 6;
                    const aiCardSize = 22;
                    const aiGap = 3;
                    const aiRowGap = 4;
                    const cols = Math.ceil(aiState.hand.length / 2);
                    const rows = Math.ceil(aiState.hand.length / cols);
                    const aiTotalW = cols * (aiCardSize + aiGap) + 6;
                    const aiStartX = Math.max(px, cartPanelX + Math.floor((cartPanelW - aiTotalW) / 2));
                    const aiStartY = py;
                    const aiBgX = Math.max(px, aiStartX - 3);
                    const aiBgW = Math.min(aiTotalW, cartPanelX + cartPanelW - aiBgX - 2);
                    const aiTitleH = 12;
                    const aiBgH = aiTitleH + rows * aiCardSize + (rows - 1) * aiRowGap + 6;

                    ctx.fillStyle = 'rgba(10, 5, 20, 0.85)';
                    ctx.beginPath();
                    ctx.roundRect(aiBgX, aiStartY, aiBgW, aiBgH, 6);
                    ctx.fill();

                    ctx.strokeStyle = '#aa44ff';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.roundRect(aiBgX, aiStartY, aiBgW, aiBgH, 6);
                    ctx.stroke();

                    ctx.fillStyle = '#cc88ff';
                    ctx.font = '9px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.fillText(`🤖 AI手牌 (${aiState.hand.length})`, aiBgX + aiBgW / 2, aiStartY + 2);

                    for (let i = 0; i < aiState.hand.length; i++) {
                        const card = aiState.hand[i];
                        const row = Math.floor(i / cols);
                        const col = i % cols;
                        const cx = aiStartX + col * (aiCardSize + aiGap);
                        const cy = aiStartY + aiTitleH + row * (aiCardSize + aiRowGap);
                        if (cx + aiCardSize > cartPanelX + cartPanelW) continue;

                        ctx.fillStyle = 'rgba(170, 68, 255, 0.5)';
                        ctx.beginPath();
                        ctx.roundRect(cx, cy, aiCardSize, aiCardSize, 3);
                        ctx.fill();

                        ctx.strokeStyle = '#cc77ff';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.roundRect(cx, cy, aiCardSize, aiCardSize, 3);
                        ctx.stroke();

                        ctx.font = 'bold 20px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(card.icon || '?', cx + aiCardSize / 2, cy + aiCardSize / 2);
                    }
                    py += aiBgH + 6;
                }

                // 存储点击区域（用于点击发兵）
                gameState.baoziCartArea = {
                    x: cartPanelX,
                    y: cartY,
                    width: cartPanelW,
                    height: (py + poolH) - cartY
                };
            } catch (error) {
                console.error('绘制战斗信息出错', error);
            }
        }

        // ============ 游戏流程控制（开始→选择武将→进入游戏）============
        /** 显示武将选择界面：生成武将卡片、皮肤切换按钮 */
        function showHeroSelect() {
            document.getElementById('startScreen').style.display = 'none';
            
            const heroGrid = document.getElementById('heroGrid');
            heroGrid.innerHTML = '';
            
            heroCards.forEach((hero, index) => {
                const card = document.createElement('div');
                card.className = 'hero-card';
                const skinIdx = selectedSkinIndex[hero.id] || 0;
                const skin = heroSkins[hero.id] ? heroSkins[hero.id][skinIdx] : null;
                const displayIcon = skin ? skin.icon : hero.icon;
                const displayName = skin ? skin.name : '经典';
                
                card.innerHTML = `
                    <div class="hero-icon">${displayIcon}</div>
                    <div class="hero-name">${hero.name}</div>
                    <div class="hero-desc">${hero.desc}</div>
                    <div class="hero-skill">⚡ ${hero.skillName}: ${hero.skillDesc}</div>
                    <div style="margin-top: 8px; font-size: 11px; color: #ffcc00;">
                        伤害: ${hero.damage} | 范围: ${hero.range} | 攻速: ${hero.attackSpeed}
                    </div>
                    <div style="margin-top: 6px; font-size: 10px; color: #ffaa66;">
                        皮肤: ${displayName} ${heroSkins[hero.id] && heroSkins[hero.id].length > 1 ? '(' + heroSkins[hero.id].length + '款)' : ''}
                    </div>
                    ${heroSkins[hero.id] && heroSkins[hero.id].length > 1 ? `
                        <button class="skin-btn" data-hero="${hero.id}" style="margin-top: 6px; padding: 4px 10px; background: linear-gradient(145deg, #3a3a3a, #2a2a2a); border: 1px solid #888; color: #fff; border-radius: 6px; cursor: pointer; font-size: 10px;">
                            🔄 切换皮肤
                        </button>
                    ` : ''}
                `;
                
                card.addEventListener('click', (e) => {
                    if (e.target && e.target.classList && e.target.classList.contains('skin-btn')) {
                        e.stopPropagation();
                        const hid = e.target.dataset.hero;
                        if (hid && heroSkins[hid]) {
                            selectedSkinIndex[hid] = ((selectedSkinIndex[hid] || 0) + 1) % heroSkins[hid].length;
                            showHeroSelect();
                            playSound('click', 0.15);
                        }
                        return;
                    }
                    try {
                        selectHero(index, card);
                    } catch (error) {
                        console.error('选择武将错误:', error);
                        alert('选择武将失败，请重试！');
                    }
                });
                heroGrid.appendChild(card);
            });
            
            document.getElementById('heroSelectScreen').style.display = 'flex';
        }

        function selectHero(index, cardElement) {
            document.querySelectorAll('.hero-card').forEach(c => c.classList.remove('selected'));
            cardElement.classList.add('selected');
            selectedHero = heroCards[index];
            
            const btn = document.getElementById('confirmHeroBtn');
            btn.disabled = false;
            btn.style.opacity = '1';
        }

        function confirmHeroSelection() {
            try {
                if (!selectedHero) {
                    alert('请先选择一个武将！');
                    return;
                }
                
                document.getElementById('heroSelectScreen').style.display = 'none';
                document.getElementById('loadingScreen').style.display = 'flex';
                document.getElementById('loadingText').textContent = '正在初始化游戏...';
                
                setTimeout(() => {
                    try {
                        // 先显示gameContainer
                        document.getElementById('gameContainer').style.display = 'flex';
                        document.getElementById('gameContainer').style.flexDirection = 'column';
                        document.getElementById('gameContainer').style.height = '100vh';
                        
                        // 确保uiPanel正确显示
                        const uiPanel = document.getElementById('uiPanel');
                        if (uiPanel) {
                            uiPanel.style.width = '280px';
                            uiPanel.style.minWidth = '280px';
                        }
                        
                        document.getElementById('loadingScreen').style.display = 'none';
                        gameState.gameStarted = true;
                        gameState.gameStartTime = Date.now(); // 设置游戏开始时间，用于AI延迟
                        
                        // 初始化游戏
                        initGame();
                        
                        // 将武将添加到手牌，让玩家可以自由选择放置位置
                        gameState.hand.push({...selectedHero, uid: 'hero_' + Date.now(), isHero: true});
                        renderHand();
                        
                        // 再次resize确保布局正确
                        setTimeout(() => {
                            resizeCanvas();
                        }, 100);
                        
                        setTimeout(() => {
                            resizeCanvas();
                        }, 300);
                        
                        playBGM();
                        aiInit();
                    } catch (error) {
                        console.error('初始化游戏错误:', error);
                        alert('初始化游戏失败，请刷新页面重试！');
                    }
                }, 1000);
            } catch (error) {
                console.error('确认武将选择错误:', error);
                alert('确认武将选择失败，请重试！');
            }
        }

        function startGame() {
            showHeroSelect();
        }

        function setSpeed(speed) {
            gameState.speed = speed;
            gameState.isPaused = (speed === 0);
            
            const el = cachedUIElements;
            if (el.pauseBtn) el.pauseBtn.textContent = speed === 0 ? '▶️ 继续' : '⏸️ 暂停';
            if (el.speed1Btn) el.speed1Btn.style.background = speed === 1 ? '#ff6b35' : '';
            if (el.speed2Btn) el.speed2Btn.style.background = speed === 2 ? '#ff6b35' : '';
        }

        // ============ 事件绑定与DOM初始化 ============
        /** 页面加载完成后初始化所有事件监听器 */
        document.addEventListener('DOMContentLoaded', () => {
            // 添加全局错误处理器
            window.onerror = function(msg, url, line, col, error) {
                console.error('全局错误:', msg, '行:', line, '列:', col);
                alert('游戏发生错误: ' + msg + '\n请刷新页面重试！');
                return true; // 阻止默认错误处理
            };
            
            // 捕获未处理的 Promise 拒绝
            window.addEventListener('unhandledrejection', function(event) {
                console.error('未处理的 Promise 拒绝:', event.reason);
                event.preventDefault(); // 阻止默认行为
            });
            
            // 为所有按钮添加错误处理
            const safeAddEvent = (id, eventType, handler) => {
                const element = document.getElementById(id);
                if (element) {
                    element.addEventListener(eventType, (e) => {
                        try {
                            handler(e);
                        } catch (error) {
                            console.error(id + ' 事件处理错误:', error);
                            alert('操作失败，请重试！');
                        }
                    });
                }
            };
            
            safeAddEvent('startBtn', 'click', startGame);
            safeAddEvent('confirmHeroBtn', 'click', confirmHeroSelection);
            safeAddEvent('restartBtn', 'click', () => location.reload());
            safeAddEvent('startWaveBtn', 'click', startWave);
            safeAddEvent('hammerBtn', 'click', useHammer);
            safeAddEvent('musicBtn', 'click', toggleBGM);
            safeAddEvent('retreatBtn', 'click', useRetreat);
            
            // 设置折叠/展开
            const settingsToggle = document.getElementById('settingsToggle');
            if (settingsToggle) {
                settingsToggle.addEventListener('click', () => {
                    const content = document.getElementById('settingsContent');
                    if (content) {
                        const isVisible = content.style.display !== 'none';
                        content.style.display = isVisible ? 'none' : 'block';
                        settingsToggle.innerHTML = isVisible ? 
                            '⚙️ 设置 <span style="float:right;font-size:10px;color:#888;">点击展开</span>' :
                            '⚙️ 设置 <span style="float:right;font-size:10px;color:#888;">点击收起</span>';
                    }
                });
            }

            // 塔升级按钮
            safeAddEvent('upgradeTowerBtn', 'click', () => {
                if (selectedTowerForUpgrade) {
                    doUpgradeTower(selectedTowerForUpgrade);
                }
            });
            
            document.getElementById('pauseBtn').addEventListener('click', () => {
                try {
                    if (gameState.isPaused) {
                        setSpeed(1); // 暂停时点击恢复到1倍速
                    } else {
                        setSpeed(0); // 非暂停时点击暂停
                    }
                } catch (error) {
                    console.error('暂停按钮错误:', error);
                    alert('操作失败，请重试！');
                }
            });
            
            document.getElementById('speed1Btn').addEventListener('click', () => {
                try {
                    setSpeed(1);
                } catch (error) {
                    console.error('速度按钮错误:', error);
                }
            });
            
            document.getElementById('speed2Btn').addEventListener('click', () => {
                try {
                    setSpeed(2);
                } catch (error) {
                    console.error('速度按钮错误:', error);
                }
            });
            
            document.getElementById('placementMode').addEventListener('change', (e) => {
                try {
                    gameState.placementMode = e.target.value;
                    renderHand(); // 切换模式后重新渲染手牌，刷新禁用状态
                } catch (error) {
                    console.error('放置模式切换错误:', error);
                }
            });

            // 主题切换
            const themeButtons = ['themeForest', 'themeDesert', 'themeVolcano', 'themeSnow'];
            const themeValues = { themeForest: 'forest', themeDesert: 'desert', themeVolcano: 'volcano', themeSnow: 'snow' };

            themeButtons.forEach(btnId => {
                safeAddEvent(btnId, 'click', () => {
                    const themeName = themeValues[btnId];
                    if (themeName) {
                        currentTheme = themeName;
                        themeButtons.forEach(id => {
                            const el = document.getElementById(id);
                            if (el) {
                                el.classList.toggle('active', id === btnId);
                            }
                        });
                        playSound('click', 0.2);
                    }
                });
            });

            // 粒子特效开关
            safeAddEvent('toggleParticles', 'click', () => {
                particlesEnabled = !particlesEnabled;
                const el = document.getElementById('particleStatus');
                if (el) {
                    el.textContent = particlesEnabled ? '开' : '关';
                    el.style.color = particlesEnabled ? '#4ade80' : '#ef4444';
                }
                playSound('click', 0.2);
            });

            // 屏幕震动开关
            safeAddEvent('toggleScreenShake', 'click', () => {
                screenShakeEnabled = !screenShakeEnabled;
                const el = document.getElementById('shakeStatus');
                if (el) {
                    el.textContent = screenShakeEnabled ? '开' : '关';
                    el.style.color = screenShakeEnabled ? '#4ade80' : '#ef4444';
                }
                playSound('click', 0.2);
            });

            // 弹道轨迹开关
            safeAddEvent('toggleTrails', 'click', () => {
                trailsEnabled = !trailsEnabled;
                const el = document.getElementById('trailStatus');
                if (el) {
                    el.textContent = trailsEnabled ? '开' : '关';
                    el.style.color = trailsEnabled ? '#4ade80' : '#ef4444';
                }
                playSound('click', 0.2);
            });

            // 音效开关
            safeAddEvent('toggleSfx', 'click', () => {
                sfxEnabled = !sfxEnabled;
                const el = document.getElementById('sfxStatus');
                if (el) {
                    el.textContent = sfxEnabled ? '开' : '关';
                    el.style.color = sfxEnabled ? '#4ade80' : '#ef4444';
                }
            });

            // 测试音效按钮
            safeAddEvent('testAttackSfx', 'click', () => playSound('attack', 0.3));
            safeAddEvent('testSkillSfx', 'click', () => playSound('skill', 0.3));
            safeAddEvent('testWaveSfx', 'click', () => playSound('wave', 0.3));

            // 武将皮肤循环切换 - 在英雄选择界面显示皮肤切换按钮
            heroCards.forEach(hero => {
                selectedSkinIndex[hero.id] = 0;
            });

            // 点击武将图标切换皮肤（在游戏中）
            document.addEventListener('click', (e) => {
                if (e.target && e.target.classList && e.target.classList.contains('skin-cycle-btn')) {
                    const heroId = e.target.dataset.heroId;
                    if (heroId && heroSkins[heroId]) {
                        const idx = ((selectedSkinIndex[heroId] || 0) + 1) % heroSkins[heroId].length;
                        selectedSkinIndex[heroId] = idx;
                        const skin = heroSkins[heroId][idx];
                        e.target.textContent = skin.icon + ' ' + skin.name;
                        playSound('click', 0.2);
                    }
                }
            });
        });
    </script>
</body>
</html>
