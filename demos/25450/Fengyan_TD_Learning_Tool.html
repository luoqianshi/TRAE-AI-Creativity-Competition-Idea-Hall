                const type = enemyTypes.find(e => e.id === group.type);
                if (type) text += `${type.icon} ${type.name} x${group.count}\n`;
            });
            preview.textContent = text;
        }

        // ============ 游戏主循环 ============
        /**
         * 游戏主循环：每帧调用 update() 和 render()
         * 使用 requestAnimationFrame 保持流畅渲染
         */
        function gameLoop() {
            try {
                // 确保金币始终是有效数字
                if (typeof gameState.gold !== 'number' || isNaN(gameState.gold)) {
                    gameState.gold = 150;
                }
                
                update();
                render();
            } catch (error) {
                console.error('游戏循环错误:', error);
            }
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        // 性能优化：缓存时间戳，避免每帧多次调用 Date.now()
        let cachedTime = 0;
        let lastUIUpdate = 0;
        /** UI更新间隔（毫秒），避免每帧更新DOM影响性能 */
        const UI_UPDATE_INTERVAL = 100; // 每100ms更新一次UI
        
        // ============ 游戏更新逻辑（每帧调用）============
        /**
         * 游戏状态更新函数，在 gameLoop 中被调用，负责：
         * 1. 更新波次警告计时器
         * 2. 交替生成双方敌人（从待生成队列按间隔生成）
         * 3. 累积包子（每5秒+2）
         * 4. 按游戏速度倍率执行：敌人移动、塔攻击、火焰伤害、弹道飞行、粒子更新、PVP更新
         * 5. 清理阵亡单位
         * 6. 调用AI更新（延迟600ms后激活）
         * 7. PVP计时器独立递增（不受speed影响，确保15秒倒计时准确）
         * 8. 限制UI更新频率（每100ms一次）
         */
        function update() {
            if (gameState.isPaused || gameState.gameOver || !gameState.gameStarted) return;
            
            // 性能优化：缓存时间戳，避免每帧多次调用 Date.now()
            cachedTime = Date.now();
            
            // 每帧减少波次开始冷却时间
            if (waveStartCooldown > 0) waveStartCooldown--;
            
            // 更新波次警告计时器
            if (waveWarningTimer > 0) {
                waveWarningTimer--;
                if (waveWarningTimer <= 0) {
                    waveWarning = null;
                }
            }
            
            // 敌人流动生成逻辑
            // PVP阶段不生成任何敌人，只体现双方移动和交战过程
            if (pvpPhase !== 'idle') {
                // 跳过波次敌人生成
            } else if (gameState.enemiesToSpawn.length > 0 || gameState.opponentEnemiesToSpawn.length > 0) {
                gameState.enemySpawnTimer++;
                
                // 每帧生成一个敌人，交替生成玩家和敌方的敌人
                if (gameState.enemySpawnTimer >= gameState.enemySpawnInterval) {
                    gameState.enemySpawnTimer = 0;
                    
                    // 根据标记决定生成哪一方的敌人
                    if (gameState.spawnPlayerEnemyFirst && gameState.enemiesToSpawn.length > 0) {
                        // 生成玩家的敌人
                        const enemyData = gameState.enemiesToSpawn.shift();
                        const enemy = {
                            x: enemyData.x,
                            y: enemyData.y,
                            type: enemyData.type,
                            hp: enemyData.hp,
                            maxHp: enemyData.maxHp,
                            speed: enemyData.speed,
                            damage: enemyData.damage,
                            slowFactor: enemyData.slowFactor,
                            stunned: enemyData.stunned,
                            targetX: enemyData.targetX,
                            targetY: enemyData.targetY,
                            initialMove: true
                        };
                        enemies.push(enemy);
                        enemiesSpawnedThisWave++;
                        
                        // 生成特效
                        for (let i = 0; i < 10; i++) {
                            particles.push({
                                x: enemy.x,
                                y: enemy.y,
                                vx: (Math.random() - 0.5) * 80,
                                vy: (Math.random() - 0.5) * 80,
                                life: 30,
                                color: '#ff4444'
                            });
                        }
                        
                        // 切换标记，下次生成敌方的敌人
                        gameState.spawnPlayerEnemyFirst = false;
                        
                    } else if (gameState.opponentEnemiesToSpawn.length > 0) {
                        // 生成敌方的敌人
                        const enemyData = gameState.opponentEnemiesToSpawn.shift();
                        const enemy = {
                            x: enemyData.x,
                            y: enemyData.y,
                            type: enemyData.type,
                            hp: enemyData.hp,
                            maxHp: enemyData.maxHp,
                            speed: enemyData.speed,
                            damage: enemyData.damage,
                            slowFactor: enemyData.slowFactor,
                            stunned: enemyData.stunned,
                            targetX: enemyData.targetX,
                            targetY: enemyData.targetY,
                            initialMove: true
                        };
                        myEnemies.push(enemy);
                        enemiesSpawnedThisWave++;
                        
                        // 生成特效
                        for (let i = 0; i < 10; i++) {
                            particles.push({
                                x: enemy.x,
                                y: enemy.y,
                                vx: (Math.random() - 0.5) * 80,
                                vy: (Math.random() - 0.5) * 80,
                                life: 30,
                                color: '#ffaa00'
                            });
                        }
                        
                        // 切换标记，下次生成玩家的敌人
                        gameState.spawnPlayerEnemyFirst = true;
                        
                    } else if (gameState.enemiesToSpawn.length > 0) {
                        // 如果敌方敌人已生成完，继续生成玩家的敌人
                        const enemyData = gameState.enemiesToSpawn.shift();
                        const enemy = {
                            x: enemyData.x,
                            y: enemyData.y,
                            type: enemyData.type,
                            hp: enemyData.hp,
                            maxHp: enemyData.maxHp,
                            speed: enemyData.speed,
                            damage: enemyData.damage,
                            slowFactor: enemyData.slowFactor,
                            stunned: enemyData.stunned,
                            targetX: enemyData.targetX,
                            targetY: enemyData.targetY,
                            initialMove: true
                        };
                        enemies.push(enemy);
                        enemiesSpawnedThisWave++;
                        
                        // 生成特效
                        for (let i = 0; i < 10; i++) {
                            particles.push({
                                x: enemy.x,
                                y: enemy.y,
                                vx: (Math.random() - 0.5) * 80,
                                vy: (Math.random() - 0.5) * 80,
                                life: 30,
                                color: '#ff4444'
                            });
                        }
                    }
                }
            }
            
            // 屯包子：每 5 秒增加 2 个包子（基于 60fps，约 300 帧）
            if (!gameState.baoziTimer) gameState.baoziTimer = 0;
            gameState.baoziTimer++;
            if (gameState.baoziTimer >= 300) { // 5 秒 = 300 帧（假设 60fps）
                gameState.baozi += 2;
                gameState.baoziTimer = 0;
                // 包子更新时才调用 updateUI
                updateUI();
            }
            
            for (let i = 0; i < gameState.speed; i++) {
                updateEnemies();
                updateMyEnemies();
                updateTowers();
                updateOpponentTowers();
                updateFireZones();
                updateOpponentFireZones();
                updateProjectiles();
                updateParticles();
                updateFloatingTexts();
                if (gameState.hammerCooldown > 0) gameState.hammerCooldown--;
                checkWaveComplete();
                updatePvp();
                
                // PVP伤害后（以及弹道伤害后）统一清理阵亡单位
                for (let ei = enemies.length - 1; ei >= 0; ei--) {
                    if (enemies[ei].hp <= 0) {
                        if (pvpPhase === 'idle') {
                            safeModifyGold(enemies[ei].type.reward);
                            gameState.kills++;
                            playSound('death', 0.2);
                        }
                        createExplosion(enemies[ei].x, enemies[ei].y, '#ff4400', 12, 1);
                        createSmoke(enemies[ei].x, enemies[ei].y, 3);
                        enemies.splice(ei, 1);
                    }
                }
                for (let mi = myEnemies.length - 1; mi >= 0; mi--) {
                    if (myEnemies[mi].hp <= 0) {
                        createExplosion(myEnemies[mi].x, myEnemies[mi].y, '#4488ff', 8, 0.8);
                        myEnemies.splice(mi, 1);
                    }
                }
                
                // AI（模拟人类玩家）
                const gameStartDelay = 600;
                if (gameState.gameStartTime && cachedTime - gameState.gameStartTime > gameStartDelay) {
                    aiUpdate();
                }
            }
            
            // PVP计时器每帧只进1步（不受speed加速，确保15秒倒计时准确）
            if (pvpPhase === 'countdown' || pvpPhase === 'battle') {
                pvpTimer++;
            }
            
            // 性能优化：限制UI更新频率，每100ms更新一次
            if (cachedTime - lastUIUpdate > UI_UPDATE_INTERVAL) {
                updateUI();
                lastUIUpdate = cachedTime;
            }
        }

        // ============ 敌人更新（敌方部队进攻我方）============
        /**
         * 更新敌方部队（enemies数组）的每帧行为：
         * 1. 处理眩晕状态
         * 2. 火焰区域伤害（每15帧造成一次伤害，离开区域重置计时器）
         * 3. 冰霜区域减速
         * 4. 塔自动发射弹道攻击范围内的敌人
         * 5. 死亡后立即处理奖励并跳过后续逻辑
         * 6. 有塔存活时：找最近的塔，进入范围后每30帧攻击一次
         * 7. 所有塔已摧毁时：移动到君主位置并造成伤害
         * 8. 移动、边界限制、碰撞分离、速度恢复
         */
        function updateEnemies() {
            // PVP阶段完全由updatePvp()处理，此处跳过
            if (pvpPhase !== 'idle') return;
            
            // 倒序循环，避免 splice 导致的索引问题
            for (let index = enemies.length - 1; index >= 0; index--) {
                const enemy = enemies[index];
                
                // 先检查是否已死亡
                if (enemy.hp <= 0) continue;

                // 检查眩晕状态
                if (enemy.stunned > 0) {
                    enemy.stunned--;
                    continue;
                }
                
                // ===== 先处理伤害 =====
                // 火焰区域伤害
                let inFireZone = false;
                fireZones.forEach(function(zone) {
                    const zoneCenterX = zone.tileX * TILE_SIZE + TILE_SIZE / 2;
                    const zoneCenterY = zone.tileY * TILE_SIZE + TILE_SIZE / 2;
                    const dx = enemy.x - zoneCenterX;
                    const dy = enemy.y - zoneCenterY;
                    const distSq = dx * dx + dy * dy;
                    const effectRangeSq = zone.range * zone.range * tileSizeSq;
                    
                    if (distSq < effectRangeSq) {
                        if (zone.type === 'fire_small' || zone.type === 'fire_large') {
                            inFireZone = true;
                            if (enemy._fireDamageTimer === undefined) enemy._fireDamageTimer = 0;
                            enemy._fireDamageTimer++;
                            if (enemy._fireDamageTimer >= 15) { // 每15帧（0.25秒）造成一次伤害
                                enemy._fireDamageTimer = 0;
                                enemy.hp -= zone.damage;
                                addFloatingText(enemy.x, enemy.y - 30, Math.ceil(zone.damage).toString(), '#ff6600', 40, -1.2);
                            }
                        } else if (zone.type === 'ice') {
                            enemy.slowFactor = Math.max(0.2, enemy.slowFactor - zone.slow);
                        }
                    }
                });
                // 离开火焰区域时重置计时器
                if (!inFireZone) {
                    enemy._fireDamageTimer = 0;
                }
                
                // 塔弹道发射
                towers.forEach(function(tower) {
                    if (tower.stunned > 0) return;
                    if (tower.defeated || tower.hp <= 0) return;
                    const dx = enemy.x - tower.x;
                    const dy = enemy.y - tower.y;
                    const distSq = dx * dx + dy * dy;
                    const rangeSq = tower.type.range * tower.type.range * tileSizeSq;
                    if (distSq < rangeSq && tower.lastAttack <= 0) {
                        const stats = getTowerStats(tower);
                        let damage = stats.damage || tower.type.damage;

                        if (tower.type.type === 'healer') return;

                        if (tower.type.id === 'weiyan') {
                            const hpPercent = tower.hp / tower.maxHp;
                            if (hpPercent < 0.5) {
                                damage *= 1.5;
                            }
                        }

                        tower.lastAttack = Math.floor(60 / (stats.attackSpeed || tower.type.attackSpeed));
                        projectiles.push({
                            x: tower.x,
                            y: tower.y,
                            target: enemy,
                            damage: damage,
                            speed: 300,
                            color: tower.type.id === 'lvbu' ? '#ff3300' : tower.type.id === 'huangzhong' ? '#ffaa00' : '#44aaff'
                        });
                        playSound('attack', 0.08);
                    }
                });

                // 伤害后检查死亡，如果死了就跳过后续逻辑
                if (enemy.hp <= 0) {
                    safeModifyGold(enemy.type.reward);
                    gameState.kills++;
                    createExplosion(enemy.x, enemy.y, '#ff4400', 12, 1);
                    createSmoke(enemy.x, enemy.y, 3);
                    playSound('death', 0.2);
                    enemies.splice(index, 1);
                    continue;
                }

                // ===== 伤害检查通过后，执行攻击和移动逻辑 =====
                const enemyX = enemy.x;
                const enemyY = enemy.y;
                let targetX = enemy.targetX;
                let targetY = enemy.targetY;
                
                const dxToLord = enemy.targetX - enemyX;
                const dyToLord = enemy.targetY - enemyY;
                const distToLordSq = dxToLord * dxToLord + dyToLord * dyToLord;
                
                // 检查场上是否有存活的防御塔
                const anyTowerAlive = towers && towers.some(t => t.hp > 0 && !t.defeated);

                if (anyTowerAlive) {
                    // 有塔存活 → 找最近的塔攻击
                    let nearestTower = null;
                    let nearestDistSq = Infinity;

                    towers.forEach(function(tower) {
                        if (tower.hp <= 0 || tower.defeated) return;
                        const dx = tower.x - enemyX;
                        const dy = tower.y - enemyY;
                        const distSq = dx * dx + dy * dy;
                        if (distSq < nearestDistSq) {
                            nearestDistSq = distSq;
                            nearestTower = tower;
                        }
                    });

                    if (nearestTower) {
                        targetX = nearestTower.x;
                        targetY = nearestTower.y;

                        // 进入攻击范围才攻击
                        if (nearestDistSq < (2.5 * TILE_SIZE) ** 2) {
                            if (enemy._attackTimer === undefined) enemy._attackTimer = 0;
                            enemy._attackTimer++;
                            if (enemy._attackTimer >= 30) { // 每30帧（0.5秒）攻击一次
                                enemy._attackTimer = 0;
                                nearestTower.hp -= enemy.damage * 0.5;
                                createSparks(nearestTower.x, nearestTower.y, '#ff4444', 6);
                                addFloatingText(nearestTower.x, nearestTower.y - 20, Math.ceil(enemy.damage * 0.5).toString(), '#ff4444', 40, -1.2);
                            }
                        } else {
                            // 离开攻击范围时重置计时器
                            enemy._attackTimer = 0;
                        }
                    }
                } else {
                    // 所有塔已摧毁 → 攻击君主
                    if (pvpPhase !== 'idle') continue;
                    if (distToLordSq < tileSizeSq) {
                        gameState.lordHp -= enemy.damage;
                        enemies.splice(index, 1);

                        if (gameState.lordHp <= 0) {
                            gameState.lordHp = 0;
                            endGame(false);
                        }
                        continue;
                    }
                }
                
                // 移动逻辑
                if (!Number.isFinite(targetX)) targetX = enemyX;
                if (!Number.isFinite(targetY)) targetY = enemyY;
                const dx = targetX - enemyX;
                const dy = targetY - enemyY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                let speed = enemy.speed * enemy.slowFactor * TILE_SIZE * 0.02;
                speed = Math.max(speed, 0.3);
                
                if (dist > 0) {
                    const moveDist = Math.min(dist, speed);
                    enemy.x += (dx / dist) * moveDist;
                    enemy.y += (dy / dist) * moveDist;
                }
                
                // 边界限制
                enemy.x = Math.max(TILE_SIZE, Math.min(enemy.x, MAP_WIDTH * TILE_SIZE - TILE_SIZE));
                enemy.y = Math.max(TILE_SIZE * 2, Math.min(enemy.y, (MAP_HEIGHT - 2) * TILE_SIZE));

                // 缓慢恢复速度
                enemy.slowFactor = Math.min(1, enemy.slowFactor + 0.005);
                
                // 基础碰撞分离
                for (let oi = index - 1; oi >= 0; oi--) {
                    const other = enemies[oi];
                    if (!other || other.hp <= 0) continue;
                    const dx = enemy.x - other.x;
                    const dy = enemy.y - other.y;
                    const distSq = dx * dx + dy * dy;
                    const minDist = TILE_SIZE * 0.6;
                    if (distSq < minDist * minDist && distSq > 0.1) {
                        const dist = Math.sqrt(distSq);
                        const push = (minDist - dist) * 0.3;
                        enemy.x += (dx / dist) * push;
                        enemy.y += (dy / dist) * push;
                        other.x -= (dx / dist) * push;
                        other.y -= (dy / dist) * push;
                    }
                }
            }
        }

        function updateMyEnemies() {
            // PVP阶段完全由updatePvp()处理，此处跳过
            if (pvpPhase !== 'idle') return;
            
            for (let index = myEnemies.length - 1; index >= 0; index--) {
                const enemy = myEnemies[index];
                
                if (enemy.hp <= 0) {
                    myEnemies.splice(index, 1);
                    continue;
                }
                
                if (enemy.stunned > 0) {
                    enemy.stunned--;
                    continue;
                }
                
                // 缓存敌人位置
                const enemyX = enemy.x;
                const enemyY = enemy.y;
                let targetX = enemy.targetX;
                let targetY = enemy.targetY;
                
                const dxToLord = enemy.targetX - enemyX;
                const dyToLord = enemy.targetY - enemyY;
                const distToLordSq = dxToLord * dxToLord + dyToLord * dyToLord;
                
                // 检查场上是否有存活的敌方防御塔
                const anyTowerAlive = opponentTowers && opponentTowers.some(t => t.hp > 0 && !t.defeated);

                if (anyTowerAlive) {
                    // 有敌方塔存活 → 找最近的塔攻击（全场搜索）
                    let nearestTower = null;
                    let nearestDistSq = Infinity;

                    opponentTowers.forEach(function(tower) {
                        if (tower.hp <= 0 || tower.defeated) return;
                        const dx = tower.x - enemyX;
                        const dy = tower.y - enemyY;
                        const distSq = dx * dx + dy * dy;
                        if (distSq < nearestDistSq) {
                            nearestDistSq = distSq;
                            nearestTower = tower;
                        }
                    });

                    if (nearestTower) {
                        targetX = nearestTower.x;
                        targetY = nearestTower.y;

                        if (nearestDistSq < (2.5 * TILE_SIZE) ** 2) {
                            if (enemy._attackTimer === undefined) enemy._attackTimer = 0;
                            enemy._attackTimer++;
                            if (enemy._attackTimer >= 30) { // 每30帧（0.5秒）攻击一次
                                enemy._attackTimer = 0;
                                nearestTower.hp -= enemy.damage * 0.5;
                                createSparks(nearestTower.x, nearestTower.y, '#4488ff', 4);
                                addFloatingText(nearestTower.x, nearestTower.y - 20, Math.ceil(enemy.damage * 0.5).toString(), '#4488ff', 40, -1.2);
                            }
                        } else {
                            // 离开攻击范围时重置计时器
                            enemy._attackTimer = 0;
                        }
                    }
                } else {
                    // 所有敌方塔已摧毁 → 攻击敌方君主（仅限正常波次，PVP不攻击君主）
                    if (pvpPhase !== 'idle') return;
                    if (distToLordSq < tileSizeSq) {
                        opponentLordHp -= enemy.damage;
                        myEnemies.splice(index, 1);

                        if (opponentLordHp <= 0) {
                            opponentLordHp = 0;
                            endGame(true);
                        }
                        continue;
                    }
                }
                
                // 简化的移动逻辑：确保敌人生成后立即移动
                if (!Number.isFinite(targetX)) targetX = enemyX;
                if (!Number.isFinite(targetY)) targetY = enemyY;
                const dx = targetX - enemyX;
                const dy = targetY - enemyY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                // 计算速度：基础速度 * 减速因子 * TILE_SIZE * 速度系数
                // 强制最小移动量，避免微小速度导致敌人看似定住
                let speed = enemy.speed * enemy.slowFactor * TILE_SIZE * 0.02;
                speed = Math.max(speed, 0.3);
                
                
                if (dist > 0) {
                    const moveDist = Math.min(dist, speed);
                    enemy.x += (dx / dist) * moveDist;
                    enemy.y += (dy / dist) * moveDist;
                }

                // 边界限制
                enemy.x = Math.max(TILE_SIZE, Math.min(enemy.x, MAP_WIDTH * TILE_SIZE - TILE_SIZE));
                enemy.y = Math.max(TILE_SIZE * 2, Math.min(enemy.y, (MAP_HEIGHT - 2) * TILE_SIZE));

                // 缓慢恢复速度
                enemy.slowFactor = Math.min(1, enemy.slowFactor + 0.005);
                
                // 基础碰撞分离
                for (let oi = index - 1; oi >= 0; oi--) {
                    const other = myEnemies[oi];
                    if (!other || other.hp <= 0) continue;
                    const dx = enemy.x - other.x;
                    const dy = enemy.y - other.y;
                    const distSq = dx * dx + dy * dy;
                    const minDist = TILE_SIZE * 0.6;
                    if (distSq < minDist * minDist && distSq > 0.1) {
                        const dist = Math.sqrt(distSq);
                        const push = (minDist - dist) * 0.3;
                        enemy.x += (dx / dist) * push;
                        enemy.y += (dy / dist) * push;
                        other.x -= (dx / dist) * push;
                        other.y -= (dy / dist) * push;
                    }
                }

                // 处理敌方火焰区域效果 - 对我方部队造成伤害或减速
                let inFireZone = false;
                opponentFireZones.forEach(function(zone) {
                    const zoneCenterX = zone.tileX * TILE_SIZE + TILE_SIZE / 2;
                    const zoneCenterY = zone.tileY * TILE_SIZE + TILE_SIZE / 2;
                    const dx = enemy.x - zoneCenterX;
                    const dy = enemy.y - zoneCenterY;
                    // 性能优化：使用平方比较
                    const distSq = dx * dx + dy * dy;
                    const effectRangeSq = zone.range * zone.range * tileSizeSq;
                    
                    if (distSq < effectRangeSq) {
                        if (zone.type === 'fire_small' || zone.type === 'fire_large') {
                            inFireZone = true;
                            if (enemy._fireDamageTimer === undefined) enemy._fireDamageTimer = 0;
                            enemy._fireDamageTimer++;
                            if (enemy._fireDamageTimer >= 15) { // 每15帧（0.25秒）造成一次伤害
                                enemy._fireDamageTimer = 0;
                                enemy.hp -= zone.damage;
                                addFloatingText(enemy.x, enemy.y - 30, Math.ceil(zone.damage).toString(), '#ff6600', 40, -1.2);
                            }
                        } else if (zone.type === 'ice') {
                            enemy.slowFactor = Math.max(0.2, enemy.slowFactor - zone.slow);
                        }
                    }
                });
                // 离开火焰区域时重置计时器
                if (!inFireZone) {
                    enemy._fireDamageTimer = 0;
                }
                
                // 火焰伤害后立即检查死亡（我方部队死亡不给金币/击杀奖励）
                if (enemy.hp <= 0) {
                    createExplosion(enemy.x, enemy.y, '#4488ff', 12, 1);
                    createSmoke(enemy.x, enemy.y, 3);
                    myEnemies.splice(index, 1);
                    continue;
                }
                
                // 性能优化：使用平方比较，2 * TILE_SIZE的平方
                if (enemy.attackTarget && enemy.attackTarget.hp > 0) {
                    const dx = enemy.x - enemy.attackTarget.x;
                    const dy = enemy.y - enemy.attackTarget.y;
                    const distSq = dx * dx + dy * dy;
                    if (distSq < 4 * tileSizeSq) {
                            if (enemy._targetAttackTimer === undefined) enemy._targetAttackTimer = 0;
                            enemy._targetAttackTimer++;
                            if (enemy._targetAttackTimer >= 30) { // 每30帧（0.5秒）攻击一次
                                enemy._targetAttackTimer = 0;
                                enemy.attackTarget.hp -= enemy.damage * 0.5;
                                createSparks(enemy.attackTarget.x, enemy.attackTarget.y, '#4488ff', 4);
                                addFloatingText(enemy.attackTarget.x, enemy.attackTarget.y - 20, Math.ceil(enemy.damage * 0.5).toString(), '#4488ff', 40, -1.2);
                            }
                        } else {
                            // 离开攻击范围时重置计时器
                            enemy._targetAttackTimer = 0;
                        }
                }
                
                opponentTowers.forEach(function(tower) {
                    if (tower.stunned > 0) return;
                    if (tower.defeated || tower.hp <= 0) return;
                    const dx = enemy.x - tower.x;
                    const dy = enemy.y - tower.y;
                    const distSq = dx * dx + dy * dy;
                    // 性能优化：使用平方比较
                    const rangeSq = tower.type.range * tower.type.range * tileSizeSq;
                    if (distSq < rangeSq && tower.lastAttack <= 0) {
                        const stats = getTowerStats(tower);
                        const dmg = stats.damage || tower.type.damage;
                        enemy.hp -= dmg;
                        tower.lastAttack = Math.floor(60 / stats.attackSpeed);
                        createSparks(enemy.x, enemy.y, '#cc66ff', 4);
                        addFloatingText(enemy.x, enemy.y - 20, Math.ceil(dmg).toString(), '#cc66ff', 40, -1.2);
                    }
                });
                
                if (enemy.hp <= 0) {
                    createExplosion(enemy.x, enemy.y, '#4488ff', 8, 0.8);
                    myEnemies.splice(index, 1);
                }
            }
        }

        // ============ 塔更新逻辑 ============
        /** 更新我方塔：处理眩晕、攻击冷却、死亡复活、牧师治疗 */
        function updateTowers() {
            // PVP阶段完全由updatePvp()处理，此处跳过
            if (pvpPhase !== 'idle') return;
            towers.forEach(function(tower) {
                if (tower.stunned > 0) {
                    tower.stunned--;
                    return;
                }
                
                tower.lastAttack = Math.max(0, tower.lastAttack - 1);
                
                if (tower.hp <= 0 && !tower.defeated) {
                    tower.defeated = true;
                    safeModifyGold(10);
                }
                
                if (tower.defeated) return;
                
                // 牧师治疗逻辑 - 治疗友军
                if (tower.type.id === 'priest' && tower.lastAttack <= 0) {
                    // 寻找范围内血量未满的友军
                    let nearestAlly = null;
                    let nearestDistSq = Infinity;
                    
                    // 性能优化：缓存tower位置和攻击范围
                    const towerX = tower.x;
                    const towerY = tower.y;
                    const rangeSq = tower.type.range * tower.type.range * tileSizeSq;
                    
                    towers.forEach(function(ally) {
                        if (ally === tower) return; // 跳过自己
                        const dx = ally.x - towerX;
                        const dy = ally.y - towerY;
                        const distSq = dx * dx + dy * dy;
                        if (distSq < rangeSq && ally.hp < ally.maxHp && distSq < nearestDistSq) {
                            nearestDistSq = distSq;
                            nearestAlly = ally;
                        }
                    });
                    
                    if (nearestAlly) {
                        const healAmount = Math.abs(tower.type.damage);
                        nearestAlly.hp = Math.min(nearestAlly.maxHp, nearestAlly.hp + healAmount);
                        tower.lastAttack = Math.floor(60 / tower.type.attackSpeed);
                        
                        // 显示治疗飘字
                        addFloatingText(nearestAlly.x, nearestAlly.y - 30, '+' + Math.ceil(healAmount).toString(), '#00ff00', 40, -1.5);
                    }
                }
            });
        }

        function updateOpponentTowers() {
            // PVP阶段完全由updatePvp()处理，此处跳过
            if (pvpPhase !== 'idle') return;
            opponentTowers.forEach(function(tower) {
                if (tower.stunned > 0) {
                    tower.stunned--;
                    return;
                }
                tower.lastAttack = Math.max(0, tower.lastAttack - 1);
                
                if (tower.hp <= 0 && !tower.defeated) {
                    tower.defeated = true;
                    opponentGold += 10;
                }
            });
        }

        function updateFireZones() {
            for (let index = fireZones.length - 1; index >= 0; index--) {
                const zone = fireZones[index];
                zone.duration--;
                if (zone.duration <= 0) fireZones.splice(index, 1);
            }
        }

        function updateOpponentFireZones() {
            for (let index = opponentFireZones.length - 1; index >= 0; index--) {
                const zone = opponentFireZones[index];
                zone.duration--;
                if (zone.duration <= 0) opponentFireZones.splice(index, 1);
            }
        }

        function updateProjectiles() {
            for (let index = projectiles.length - 1; index >= 0; index--) {
                const proj = projectiles[index];
                if (!proj.target || proj.target.hp <= 0) {
                    projectiles.splice(index, 1);
                    continue;
                }
                
                const dx = proj.target.x - proj.x;
                const dy = proj.target.y - proj.y;
                const distSq = dx * dx + dy * dy;

                if (distSq < 100) {
                    proj.target.hp -= proj.damage;
                    addFloatingText(proj.target.x, proj.target.y - 20, Math.ceil(proj.damage).toString(), '#ffffff', 40, -1.5);
                    createExplosion(proj.x, proj.y, proj.color || '#ff6b35', 8, 0.8);
                    playSound('hit', 0.15);
                    projectiles.splice(index, 1);
                } else {
                    const moveSpeed = 0.08 * proj.speed;
                    const dist = Math.sqrt(distSq);
                    proj.x += (dx / dist) * moveSpeed * 60 * 0.016;
                    proj.y += (dy / dist) * moveSpeed * 60 * 0.016;
                    addTrailPoint(proj.x, proj.y, proj.color || '#ffcc00');
                }
            }
        }

        function updateParticles() {
            if (!particlesEnabled) {
                particles = [];
                return;
            }
            // 粒子数量超限保护
            if (particles.length > MAX_PARTICLES) {
                particles.splice(0, particles.length - MAX_PARTICLES);
            }
            for (let index = particles.length - 1; index >= 0; index--) {
                const p = particles[index];
                p.x += p.vx * 0.12;
                p.y += p.vy * 0.12;
                if (p.gravity) {
                    p.vy += p.gravity;
                }
                if (p.rotationSpeed !== undefined) {
                    p.rotation = (p.rotation || 0) + p.rotationSpeed;
                }
                if (p.type === ParticleType.RING) {
                    p.size += p.expandSpeed;
                }
                p.life--;
                if (p.life <= 0) particles.splice(index, 1);
            }
            // 更新弹道轨迹
            for (let index = projectileTrails.length - 1; index >= 0; index--) {
                projectileTrails[index].life--;
                if (projectileTrails[index].life <= 0) {
                    projectileTrails.splice(index, 1);
                }
            }
            // 更新屏幕震动
            if (screenShake.duration > 0) {
                screenShake.duration--;
                if (screenShake.duration <= 0) {
                    screenShake.intensity = 0;
                }
            }
        }

        function updateFloatingTexts() {
            for (let index = floatingTexts.length - 1; index >= 0; index--) {
                const ft = floatingTexts[index];
                if (!ft) continue;
                ft.y += ft.vy;
                ft.life--;
                if (ft.life <= 0) floatingTexts.splice(index, 1);
            }
        }

        function drawFloatingTexts() {
            try {
                if (!floatingTexts || !Array.isArray(floatingTexts)) return;
                
                floatingTexts.forEach(ft => {
                    try {
                        if (!ft) return;
                        ctx.globalAlpha = Math.max(0, ft.life / 40);
                        ctx.fillStyle = ft.color;
                        ctx.font = 'bold 16px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText(ft.text, ft.x, ft.y);
                    } catch (ftError) {
                        console.error('绘制单个飘字出错', ftError);
                    }
                });
                ctx.globalAlpha = 1;
            } catch (error) {
                console.error('绘制飘字出错', error);
            }
        }

        // ============ 波次完成检测 ============
        /**
         * 检测波次是否完成：当双方场上无敌人生存且所有敌人生成完毕后
         * 如果是第10/20/30波，触发PVP对战
         * 否则：满血复活所有塔，增加军饷，进入下一波
         * 使用setTimeout延迟2秒，让玩家看到最后一波敌人全部消灭
         */
        function checkWaveComplete() {
            if (gameState.waveInProgress && enemies.length === 0 && myEnemies.length === 0 && waveStartCooldown <= 0 && enemiesSpawnedThisWave >= enemiesExpectedThisWave && pvpPhase === 'idle') {
                if (checkingWaveComplete) return;
                checkingWaveComplete = true;
                
                setTimeout(() => {
                    try {
                        if (enemies.length === 0 && myEnemies.length === 0) {
                            const isPvpWave = gameState.wave % 10 === 0 && gameState.wave <= gameState.maxWaves;
                            if (isPvpWave && pvpPhase === 'idle') {
                                // PVP波：所有单位消灭后触发PVP
                                const btn = document.getElementById('startWaveBtn');
                                if (!btn) return;
                                btn.disabled = true;
                                btn.textContent = '⚔️ PVP 15秒后开始...';
                                waveWarning = `⚔️ PVP 即将开始！双方塔和部队将自动交战，存活多的一方获胜！`;
                                waveWarningTimer = 180;
                                updateUI();
                                startPvp();
                                return;
                            }

                            gameState.waveInProgress = false;
                            renderHand();

                            towers.forEach(tower => {
                                tower.hp = tower.maxHp;
                                tower.defeated = false;
                            });
                            opponentTowers.forEach(tower => {
                                tower.hp = tower.maxHp;
                                tower.defeated = false;
                            });

                            gameState.wave++;
                            safeModifyGold(20 + gameState.wave * 2);

                            // 每7波：在点击下一波之前提示
                            if (gameState.wave % 7 === 0 && gameState.wave <= gameState.maxWaves) {
                                waveWarning = '⚠️ 下一波强大敌人即将到来，严阵以待！';
                                waveWarningTimer = 300;
                            }

                            if (gameState.wave > gameState.maxWaves) {
                                if (opponentLordHp < gameState.lordHp) {
                                    endGame(true);
                                } else if (opponentLordHp > gameState.lordHp) {
                                    endGame(false);
                                } else {
                                    endGame(true);
                                }
                            } else {
                                const btn = document.getElementById('startWaveBtn');
                                if (btn) {
                                    btn.disabled = false;
                                    btn.textContent = '开始下一波';
                                }
                                updateUI();
                                updateWavePreview();
                            }
                        }
                    } catch (error) {
                        console.error('波次完成回调错误:', error);
                    } finally {
                        checkingWaveComplete = false;
                    }
                }, 2000);
            }
        }

        // ============ 游戏结束 ============
        /** 游戏结束处理：显示胜利/失败界面，播放对应音效和特效 */
        function endGame(victory) {
            gameState.gameOver = true;
            // 恢复鼠标
            canvas.style.cursor = 'default';
            let subtitle = '';
            if (victory) {
                subtitle = `🎉 恭喜！你获得了胜利！\n最终血量：我方 ${Math.ceil(gameState.lordHp)} vs 敌方 ${Math.ceil(opponentLordHp)}`;
                playSound('victory', 0.4);
                // 胜利特效
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        createExplosion(
                            canvas.width / 2 + (Math.random() - 0.5) * 200,
                            canvas.height / 2 + (Math.random() - 0.5) * 150,
                            ['#ffcc00', '#ff66cc', '#66ccff', '#66ff66'][Math.floor(Math.random() * 4)],
                            25, 1.5
                        );
                        createStars(
                            canvas.width / 2 + (Math.random() - 0.5) * 200,
                            canvas.height / 2 + (Math.random() - 0.5) * 150,
                            '#ffdd00', 15
                        );
                    }, i * 150);
                }
                triggerScreenShake(6, 25);
            } else {
                subtitle = `💀 很遗憾，你失败了...\n最终血量：我方 ${Math.ceil(gameState.lordHp)} vs 敌方 ${Math.ceil(opponentLordHp)}`;
                playSound('defeat', 0.35);
                triggerScreenShake(8, 30);
            }
            // 震动效果在弹出结果页面前清零，避免结果页跟着抖
            screenShake.duration = 0;
            screenShake.intensity = 0;
            document.getElementById('gameOverTitle').textContent = victory ? '🎉 胜利！' : '💀 失败';
            document.getElementById('gameOverSubtitle').textContent = subtitle;
            document.getElementById('gameOverScreen').style.display = 'flex';
            stopBGM();
        }

        // ============ 渲染系统（Canvas绘制）============
        /**
         * 主渲染函数，每帧调用，按以下顺序绘制：
         * 1. 清除画布并填充当前主题背景色
         * 2. 应用地图偏移和屏幕震动
         * 3. drawMap()       - 地图格子（使用离屏canvas缓存提升性能）
         * 4. drawPath()      - 部队进攻路线虚线
         * 5. drawFireZones() - 火焰/冰霜区域
         * 6. drawTowers()    - 我方塔（含等级、血条、技能冷却）
         * 7. drawOpponentTowers() - 敌方塔
         * 8. drawEnemies()   - 敌方部队
         * 9. drawMyEnemies() - 我方部队
         * 10. drawTrails()    - 弹道轨迹
         * 11. drawProjectiles()- 弹道投射物
         * 12. drawParticles() - 粒子特效
         * 13. drawFloatingTexts() - 浮动文字
         * 14. drawLord()     - 双方君主
         * 15. drawWaveWarning() - 波次警告横幅
         * 16. drawPvpBanner()   - PVP横幅（倒计时/战斗/结果）
         */
        function render() {
            try {
                if (!ctx) return;
                
                const theme = mapThemes[currentTheme];
                ctx.fillStyle = theme.bg;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                drawBattleInfo();

                ctx.save();
                ctx.translate(MAP_OFFSET_X, mapOffsetY);
                applyScreenShake();
                
                drawMap();
                drawPath();
                drawFireZones();
                drawOpponentFireZones();
                drawTowers();
                drawOpponentTowers();
                drawEnemies();
                drawMyEnemies();
                drawTrails();
                drawProjectiles();
                drawParticles();
                drawFloatingTexts();
                drawLord();

                ctx.restore();
            } catch (error) {
                console.error('渲染错误:', error);
            }
            // 波次警告和PVP横幅使用独立渲染，不受主渲染错误影响
            try { drawWaveWarning(); } catch (e) { console.error('波次警告渲染错误:', e); }
            try { drawPvpBanner(); } catch (e) { console.error('PVP横幅渲染错误:', e); }
        }

        function drawWaveWarning() {
            if (waveWarning && waveWarningTimer > 0) {
                ctx.save();

                ctx.font = 'bold 22px Arial, sans-serif';
                const textWidth = ctx.measureText(waveWarning).width;
                const padding = 30;
                const bgWidth = Math.max(360, textWidth + padding * 2);
                const bgHeight = 50;
                const x = canvas.width / 2 - bgWidth / 2;
                const y = 60;

                // 绘制半透明背景
                ctx.fillStyle = 'rgba(200, 20, 0, 0.85)';
                ctx.fillRect(x, y, bgWidth, bgHeight);

                // 绘制边框
                ctx.strokeStyle = '#ffcc00';
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, bgWidth, bgHeight);

                // 绘制文字
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(waveWarning, canvas.width / 2, y + bgHeight / 2);

                ctx.restore();
            }
        }

        /**
         * 绘制地图格子：
         * 使用离屏canvas缓存策略——只在主题或画布尺寸变化时重建缓存
         * 大幅提升渲染性能，避免每帧重绘所有格子
         */
        function drawMap() {
            const theme = mapThemes[currentTheme];

            // 离屏canvas缓存（只在主题/画布尺寸变化时重建）
            const needRebuild = !mapCache ||
                mapCache.theme !== currentTheme ||
                mapCache.width !== canvas.width ||
                mapCache.height !== canvas.height;

            if (needRebuild) {
                if (!mapCache || mapCache.width !== canvas.width || mapCache.height !== canvas.height) {
                    mapCache = document.createElement('canvas');
                    mapCache.width = canvas.width;
                    mapCache.height = canvas.height;
                }
                const mc = mapCache.getContext('2d');
                mapCache.theme = currentTheme;

                // 填充整个画布为默认颜色
                mc.fillStyle = theme.bg;
                mc.fillRect(0, 0, canvas.width, canvas.height);

                const viewWidth = Math.min(MAP_WIDTH, Math.floor(canvas.width / TILE_SIZE) + 1);
                const viewHeight = Math.min(MAP_HEIGHT, Math.floor(canvas.height / TILE_SIZE) + 1);

                for (let y = 0; y < viewHeight && y < MAP_HEIGHT; y++) {
                    for (let x = 0; x < viewWidth && x < MAP_WIDTH; x++) {
                        if (!mapData[y]) continue;
                        const tile = mapData[y][x];
                        if (tile === 2) {
                            mc.fillStyle = theme.allyTile;
                        } else if (tile === 1) {
                            mc.fillStyle = (x >= 11 && x <= 12) ? theme.spawnTile : theme.enemyTile;
                        } else {
                            mc.fillStyle = theme.border;
                        }
                        mc.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        mc.strokeStyle = 'rgba(0,0,0,0.2)';
                        mc.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    }
                }

                // 我方区域边界线
                mc.strokeStyle = theme.allyBorder;
                mc.lineWidth = 3;
                mc.setLineDash([15, 10]);
                mc.beginPath();
                mc.moveTo(11 * TILE_SIZE, 0);
                mc.lineTo(11 * TILE_SIZE, canvas.height);
                mc.stroke();

                mc.strokeStyle = theme.enemyBorder;
                mc.beginPath();
                mc.moveTo(13 * TILE_SIZE, 0);
                mc.lineTo(13 * TILE_SIZE, canvas.height);
                mc.stroke();
                mc.setLineDash([]);

                mc.fillStyle = 'rgba(255, 0, 0, 0.1)';
                mc.fillRect(11 * TILE_SIZE, 0, 2 * TILE_SIZE, canvas.height);

                mc.strokeStyle = theme.enemyBorder;
                mc.lineWidth = 2;
                mc.setLineDash([5, 3]);
                mc.strokeRect(11 * TILE_SIZE, 0, 2 * TILE_SIZE, (MAP_HEIGHT - 4) * TILE_SIZE);
                mc.setLineDash([]);

                mc.strokeStyle = 'rgba(0, 0, 0, 0.8)';
                mc.lineWidth = 3;
                mc.fillStyle = '#ffffff';
                mc.font = 'bold 14px Arial';
                mc.textAlign = 'center';
                mc.textBaseline = 'top';
                mc.strokeText('← 敌方领地', (MAP_WIDTH - 4) * TILE_SIZE + TILE_SIZE / 2, 50);
                mc.fillText('← 敌方领地', (MAP_WIDTH - 4) * TILE_SIZE + TILE_SIZE / 2, 50);
                mc.strokeText('我方领地 →', 4 * TILE_SIZE, 50);
                mc.fillText('我方领地 →', 4 * TILE_SIZE, 50);
                mc.strokeText('⚔️ 敌人出现区 ⚔️', MAP_WIDTH / 2 * TILE_SIZE, 50);
                mc.fillText('⚔️ 敌人出现区 ⚔️', MAP_WIDTH / 2 * TILE_SIZE, 50);
            }

            ctx.drawImage(mapCache, 0, 0);
        }

        function drawPath() {
            ctx.strokeStyle = 'rgba(255, 100, 100, 0.3)';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 5]);
            ctx.beginPath();
            ctx.moveTo(14 * TILE_SIZE + TILE_SIZE / 2, 7 * TILE_SIZE + TILE_SIZE / 2);
            ctx.lineTo(2 * TILE_SIZE + TILE_SIZE / 2, 7 * TILE_SIZE + TILE_SIZE / 2);
            ctx.stroke();
            
            ctx.strokeStyle = 'rgba(100, 200, 100, 0.3)';
            ctx.beginPath();
            ctx.moveTo(10 * TILE_SIZE + TILE_SIZE / 2, 7 * TILE_SIZE + TILE_SIZE / 2);
            ctx.lineTo(22 * TILE_SIZE + TILE_SIZE / 2, 7 * TILE_SIZE + TILE_SIZE / 2);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawFireZones() {
            fireZones.forEach(zone => {
                const x = zone.tileX * TILE_SIZE;
                const y = zone.tileY * TILE_SIZE;
                const alpha = zone.duration / zone.maxDuration;
                const theme = mapThemes[currentTheme];
                
                const colors = zone.type === 'ice' ? [theme.iceZoneColor, 'rgba(100, 200, 255, 0.1)'] : theme.fireZoneColors;
                
                const gradient = ctx.createRadialGradient(
                    x + TILE_SIZE/2, y + TILE_SIZE/2, 0,
                    x + TILE_SIZE/2, y + TILE_SIZE/2, TILE_SIZE * zone.range
                );
                gradient.addColorStop(0, colors[0].replace(/[\d.]+\)/, (0.9 * alpha).toFixed(2) + ')'));
                gradient.addColorStop(1, colors[1].replace(/[\d.]+\)/, (0.3 * alpha).toFixed(2) + ')'));
                ctx.fillStyle = gradient;
                
                ctx.beginPath();
                ctx.arc(x + TILE_SIZE/2, y + TILE_SIZE/2, TILE_SIZE * zone.range, 0, Math.PI * 2);
                ctx.fill();

                // 火焰粒子
                if (particlesEnabled && zone.type !== 'ice') {
                    createFireParticles(x + TILE_SIZE/2, y + TILE_SIZE/2, 2);
                } else if (particlesEnabled && zone.type === 'ice') {
                    createIceParticles(x + TILE_SIZE/2, y + TILE_SIZE/2, 2);
                }
            });
        }

        function drawOpponentFireZones() {
            opponentFireZones.forEach(zone => {
                const x = zone.tileX * TILE_SIZE;
                const y = zone.tileY * TILE_SIZE;
                const alpha = zone.duration / zone.maxDuration;
                
                ctx.fillStyle = `rgba(100, 50, 255, ${0.6 * alpha})`;
                ctx.beginPath();
                ctx.arc(x + TILE_SIZE/2, y + TILE_SIZE/2, TILE_SIZE * 0.8, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawTowers() {
            try {
                if (!towers || !Array.isArray(towers)) return;
                
                towers.forEach(tower => {
                    try {
                        if (!tower || !tower.type) return;
                        
                        // 获取武将皮肤
                        const heroId = tower.type.id;
                        const skinIdx = selectedSkinIndex[heroId] || 0;
                        let skinIcon = tower.type.icon;
                        let skinColor = '#ffcc00';
                        
                        if (heroSkins[heroId]) {
                            const skin = heroSkins[heroId][skinIdx];
                            if (skin) {
                                skinIcon = skin.icon;
                                skinColor = skin.color;
                            }
                        }
                        
                        const range = typeof tower.type.range === 'number' ? tower.type.range : 1;
                        
                        // 范围圈（仅选中塔时显示，节省大量 gradient 预算）
                        if (!tower.defeated && selectedTowerForUpgrade === tower) {
                            const rangeGradient = ctx.createRadialGradient(
                                tower.x, tower.y, 0,
                                tower.x, tower.y, range * TILE_SIZE
                            );
                            rangeGradient.addColorStop(0, 'rgba(255, 204, 0, 0.05)');
                            rangeGradient.addColorStop(0.8, 'rgba(255, 204, 0, 0.02)');
                            rangeGradient.addColorStop(1, 'rgba(255, 204, 0, 0.1)');
                            ctx.fillStyle = rangeGradient;
                            ctx.beginPath();
                            ctx.arc(tower.x, tower.y, range * TILE_SIZE, 0, Math.PI * 2);
                            ctx.fill();
                            
                            ctx.strokeStyle = 'rgba(255, 204, 0, 0.2)';
                            ctx.lineWidth = 1;
                            ctx.setLineDash([5, 5]);
                            ctx.stroke();
                            ctx.setLineDash([]);
                        }
                        
                        // 绘制不透明的圆形背景（战败状态用灰色）
                        const bgColor = tower.defeated ? 'rgba(128, 128, 128, 0.6)' : skinColor;
                        ctx.fillStyle = bgColor;
                        ctx.beginPath();
                        ctx.arc(tower.x, tower.y, TILE_SIZE/2 - 2, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // 绘制更粗的边框（使用皮肤颜色）
                        ctx.strokeStyle = tower.defeated ? '#666' : skinColor;
                        ctx.lineWidth = 4;
                        ctx.setLineDash(tower.defeated ? [5, 5] : []);
                        ctx.beginPath();
                        ctx.arc(tower.x, tower.y, TILE_SIZE/2 - 4, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.setLineDash([]);
                        
                        // 发光效果
                        if (!tower.defeated) {
                            ctx.shadowColor = skinColor;
                            ctx.shadowBlur = 25;
                            ctx.shadowOffsetX = 0;
                            ctx.shadowOffsetY = 0;
                        }
                        
                        // 图标（使用皮肤图标）
                        ctx.globalAlpha = tower.defeated ? 0.5 : 1;
                        ctx.font = '36px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(skinIcon, tower.x, tower.y);
                        ctx.globalAlpha = 1;
                        
                        // 等级徽章（在塔图标上方）
                        if (!tower.defeated && tower.level) {
                            const lv = tower.level || 1;
                            const maxLv = getMaxLevel(tower);
                            const isMaxed = lv >= maxLv;
                            
                            // 等级背景
                            ctx.fillStyle = isMaxed ? 'rgba(255, 204, 0, 0.9)' : 'rgba(0, 0, 0, 0.7)';
                            const rx = tower.x - 18, ry = tower.y - 46, rw = 36, rh = 16, rr = 4;
                            ctx.beginPath();
                            ctx.moveTo(rx + rr, ry);
                            ctx.lineTo(rx + rw - rr, ry);
                            ctx.arcTo(rx + rw, ry, rx + rw, ry + rr, rr);
                            ctx.lineTo(rx + rw, ry + rh - rr);
                            ctx.arcTo(rx + rw, ry + rh, rx + rw - rr, ry + rh, rr);
                            ctx.lineTo(rx + rr, ry + rh);
                            ctx.arcTo(rx, ry + rh, rx, ry + rh - rr, rr);
                            ctx.lineTo(rx, ry + rr);
                            ctx.arcTo(rx, ry, rx + rr, ry, rr);
                            ctx.closePath();
                            ctx.fill();
                            
                            // 等级边框
                            ctx.strokeStyle = isMaxed ? '#ffdd00' : '#ffcc00';
                            ctx.lineWidth = 1;
                            ctx.strokeRect(tower.x - 18, tower.y - 46, 36, 16);
                            
                            // 等级文字
                            ctx.fillStyle = isMaxed ? '#000' : '#ffcc00';
                            ctx.font = 'bold 10px Arial';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(isMaxed ? `MAX${lv}` : `Lv${lv}`, tower.x, tower.y - 38);
                        }
                        
                        // 清除阴影效果
                        ctx.shadowColor = 'transparent';
                        ctx.shadowBlur = 0;
                        
                        // 血条（战败状态显示为空）
                        ctx.fillStyle = 'rgba(0,0,0,0.7)';
                        ctx.fillRect(tower.x - 18, tower.y - 30, 36, 8);
                        const hpPercent = Math.min(1, Math.max(0, tower.hp / tower.maxHp));
                        const hpColor = hpPercent > 0.5 ? '#4ade80' : hpPercent > 0.25 ? '#fbbf24' : '#ef4444';
                        
                        // 华丽血条（带渐变）
                        const hpGradient = ctx.createLinearGradient(tower.x - 18, 0, tower.x + 18, 0);
                        hpGradient.addColorStop(0, hpColor);
                        hpGradient.addColorStop(1, hpColor + 'aa');
                        ctx.fillStyle = hpGradient;
                        ctx.fillRect(tower.x - 18, tower.y - 30, 36 * hpPercent, 8);
                        
                        // 血条边框
                        ctx.strokeStyle = '#333';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(tower.x - 18, tower.y - 30, 36, 8);
                        
                        // 绘制技能冷却指示
                        if (tower.type.skillType === 'active' && tower.skillCooldown > 0) {
                            const cdPercent = tower.skillCooldown / tower.type.skillCooldown;
                            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                            ctx.fillRect(tower.x - 12, tower.y + 14, 24, 10);
                            ctx.fillStyle = skinColor;
                            ctx.fillRect(tower.x - 12, tower.y + 14, 24 * (1 - cdPercent), 10);
                            ctx.strokeStyle = '#333';
                            ctx.lineWidth = 1;
                            ctx.strokeRect(tower.x - 12, tower.y + 14, 24, 10);
                        }
                    } catch (towerError) {
                        // 忽略
                    }
                });
            } catch (error) {
                console.error('绘制塔出错', error);
            }
        }

        function drawOpponentTowers() {
            try {
                if (!opponentTowers || !Array.isArray(opponentTowers)) return;
                
                opponentTowers.forEach(tower => {
                    try {
                        if (!tower || !tower.type) return;
                        
                        const icon = tower.type.icon || '🏰';
                        const range = typeof tower.type.range === 'number' ? tower.type.range : 1;
                        
                        // 背景（战败状态用灰色）
                        ctx.fillStyle = tower.defeated ? '#444' : '#3a2555';
                        ctx.beginPath();
                        ctx.arc(tower.x, tower.y, TILE_SIZE/2 - 2, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // 边框（战败状态用虚线）
                        ctx.strokeStyle = tower.defeated ? '#666' : '#9966ff';
                        ctx.lineWidth = 5;
                        ctx.setLineDash(tower.defeated ? [5, 5] : []);
                        ctx.beginPath();
                        ctx.arc(tower.x, tower.y, TILE_SIZE/2 - 4, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.setLineDash([]);
                        
                        // 发光效果
                        if (!tower.defeated) {
                            ctx.shadowColor = 'rgba(153, 102, 255, 0.6)';
                            ctx.shadowBlur = 12;
                            ctx.shadowOffsetX = 0;
                            ctx.shadowOffsetY = 0;
                        }
                        
                        // 图标（战败状态半透明）
                        ctx.globalAlpha = tower.defeated ? 0.5 : 1;
                        ctx.font = '34px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(icon, tower.x, tower.y);
                        ctx.globalAlpha = 1;
                        
                        // 敌方等级徽章
                        if (!tower.defeated && tower.level) {
                            const lv = tower.level || 1;
                            const maxLv = getMaxLevel(tower);
                            const isMaxed = lv >= maxLv;
                            ctx.fillStyle = isMaxed ? 'rgba(204, 102, 255, 0.9)' : 'rgba(0, 0, 0, 0.7)';
                            const rx = tower.x - 18, ry = tower.y - 44, rw = 36, rh = 16, rr = 4;
                            ctx.beginPath();
                            ctx.moveTo(rx + rr, ry);
                            ctx.lineTo(rx + rw - rr, ry);
                            ctx.arcTo(rx + rw, ry, rx + rw, ry + rr, rr);
                            ctx.lineTo(rx + rw, ry + rh - rr);
                            ctx.arcTo(rx + rw, ry + rh, rx + rw - rr, ry + rh, rr);
                            ctx.lineTo(rx + rr, ry + rh);
                            ctx.arcTo(rx, ry + rh, rx, ry + rh - rr, rr);
                            ctx.lineTo(rx, ry + rr);
                            ctx.arcTo(rx, ry, rx + rr, ry, rr);
                            ctx.closePath();
                            ctx.fill();
                            ctx.strokeStyle = '#cc66ff';
                            ctx.lineWidth = 1;
                            ctx.strokeRect(rx, ry, rw, rh);
                            ctx.fillStyle = isMaxed ? '#000' : '#cc88ff';
                            ctx.font = 'bold 10px Arial';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(isMaxed ? `MAX${lv}` : `Lv${lv}`, tower.x, tower.y - 36);
                        }
                        
                        // 清除阴影效果
                        ctx.shadowColor = 'transparent';
                        ctx.shadowBlur = 0;
                        
                        // 血条
                        ctx.fillStyle = 'rgba(0,0,0,0.5)';
                        ctx.fillRect(tower.x - 18, tower.y - 28, 36, 6);
                        const hpPercent = Math.min(1, Math.max(0, tower.hp / tower.maxHp));
                        ctx.fillStyle = tower.defeated ? '#666' : (hpPercent > 0.5 ? '#4ade80' : hpPercent > 0.25 ? '#fbbf24' : '#ef4444');
                        ctx.fillRect(tower.x - 18, tower.y - 28, 36 * hpPercent, 6);
                    } catch (towerError) {
                        console.error('绘制单个敌方塔出错', towerError);
                    }
                });
            } catch (error) {
                console.error('绘制敌方塔出错', error);
            }
        }

        function drawEnemies() {
            try {
                if (!enemies || !Array.isArray(enemies)) return;
                
                enemies.forEach(enemy => {
                    try {
                        if (!enemy || !enemy.type) return;
                        
                        // 不绘制血量为0或负数的敌人
                        if (enemy.hp <= 0) return;
                        
                        const icon = enemy.type.icon || '👹';
                        
                        if (enemy.stunned > 0) {
                            ctx.globalAlpha = 0.5;
                        }
                        
                        ctx.fillStyle = '#1a0000';
                        ctx.fillRect(enemy.x - 15, enemy.y - 25, 30, 6);
                        ctx.strokeStyle = 'rgba(255,0,0,0.3)';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.rect(enemy.x - 15, enemy.y - 25, 30, 6);
                        ctx.stroke();
                        const hpPercent = Math.min(1, Math.max(0, enemy.hp / enemy.maxHp));
                        ctx.fillStyle = '#ff3333';
                        ctx.fillRect(enemy.x - 15, enemy.y - 25, Math.floor(30 * hpPercent), 6);
                        
                        ctx.font = '24px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(icon, enemy.x, enemy.y);
                        
                        ctx.globalAlpha = 1;
                    } catch (enemyError) {
                        console.error('绘制单个敌人出错', enemyError);
                    }
                });
            } catch (error) {
                console.error('绘制敌人出错', error);
            }
        }

        function drawMyEnemies() {
            try {
                if (!myEnemies || !Array.isArray(myEnemies)) return;
                
                myEnemies.forEach(enemy => {
                    try {
                        if (!enemy || !enemy.type) return;
                        
                        // 不绘制血量为0或负数的敌人
                        if (enemy.hp <= 0) return;
                        
                        const icon = enemy.type.icon || '⚔️';
                        
                        if (enemy.stunned > 0) {
                            ctx.globalAlpha = 0.5;
                        }
                        
                        ctx.fillStyle = '#330000';
                        ctx.fillRect(enemy.x - 15, enemy.y - 25, 30, 6);
                        ctx.strokeStyle = 'rgba(255,100,100,0.3)';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.rect(enemy.x - 15, enemy.y - 25, 30, 6);
                        ctx.stroke();
                        const hpPercent = Math.min(1, Math.max(0, enemy.hp / enemy.maxHp));
                        ctx.fillStyle = '#ff6666';
                        ctx.fillRect(enemy.x - 15, enemy.y - 25, Math.floor(30 * hpPercent), 6);
                        
                        ctx.font = '24px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(icon, enemy.x, enemy.y);
                        
                        ctx.globalAlpha = 1;
                    } catch (enemyError) {
                        console.error('绘制单个我方敌人出错', enemyError);
                    }
                });
            } catch (error) {
                console.error('绘制我方敌人出错', error);
            }
        }

        function drawProjectiles() {
            try {
                if (!projectiles || !Array.isArray(projectiles)) return;
                
                projectiles.forEach(proj => {
                    try {
                        if (!proj) return;
                        const color = proj.color || '#ffcc00';
                        
                        // 外发光
                        ctx.shadowColor = color;
                        ctx.shadowBlur = 15;
                        
                        // 外层光晕
                        ctx.fillStyle = color;
                        ctx.globalAlpha = 0.3;
                        ctx.beginPath();
                        ctx.arc(proj.x, proj.y, 8, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // 内层核心
                        ctx.globalAlpha = 1;
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(proj.x, proj.y, 4, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // 彩色核心
                        ctx.fillStyle = color;
                        ctx.globalAlpha = 0.8;
                        ctx.beginPath();
                        ctx.arc(proj.x, proj.y, 3, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.globalAlpha = 1;
                        ctx.shadowBlur = 0;
                    } catch (projError) {
                        // 忽略
                    }
                });
            } catch (error) {
                console.error('绘制子弹出错', error);
            }
        }

        function drawParticles() {
            try {
                if (!particles || !Array.isArray(particles)) return;
                
                particles.forEach(p => {
                    try {
                        if (!p) return;
                        const alpha = p.life / (p.maxLife || 50);
                        ctx.globalAlpha = Math.max(0, alpha);
                        ctx.fillStyle = p.color;
                        ctx.strokeStyle = p.color;
                        
                        const size = p.size || 3;
                        
                        switch (p.type) {
                            case ParticleType.RING:
                                // 冲击波环
                                ctx.globalAlpha = Math.max(0, alpha * 0.7);
                                ctx.lineWidth = 3;
                                ctx.beginPath();
                                ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                                ctx.stroke();
                                break;
                            case ParticleType.STAR:
                                // 星星
                                ctx.save();
                                ctx.translate(p.x, p.y);
                                ctx.rotate(p.rotation || 0);
                                drawStar(ctx, 0, 0, 5, size, size * 0.5);
                                ctx.fill();
                                ctx.restore();
                                break;
                            case ParticleType.SMOKE:
                                // 烟雾 - 半透明圆
                                ctx.globalAlpha = Math.max(0, alpha * 0.4);
                                ctx.beginPath();
                                ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                                ctx.fill();
                                break;
                            case ParticleType.ICE:
                                // 冰晶 - 菱形
                                ctx.save();
                                ctx.translate(p.x, p.y);
                                ctx.rotate(p.rotation || 0);
                                ctx.beginPath();
                                ctx.moveTo(0, -size);
                                ctx.lineTo(size * 0.7, 0);
                                ctx.lineTo(0, size);
                                ctx.lineTo(-size * 0.7, 0);
                                ctx.closePath();
                                ctx.fill();
                                ctx.restore();
                                break;
                            case ParticleType.FIRE:
                                // 火焰 - 带光晕
                                const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 2);
                                gradient.addColorStop(0, p.color);
                                gradient.addColorStop(1, 'transparent');
                                ctx.fillStyle = gradient;
                                ctx.beginPath();
                                ctx.arc(p.x, p.y, size * 2, 0, Math.PI * 2);
                                ctx.fill();
                                ctx.fillStyle = p.color;
                                ctx.beginPath();
                                ctx.arc(p.x, p.y, size * 0.5, 0, Math.PI * 2);
                                ctx.fill();
                                break;
                            case ParticleType.EXPLOSION:
                            case ParticleType.SPARK:
                            default:
                                // 默认圆形粒子带发光
                                ctx.shadowColor = p.color;
                                ctx.shadowBlur = 8;
                                ctx.beginPath();
                                ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                                ctx.fill();
                                ctx.shadowBlur = 0;
                        }
                    } catch (particleError) {
                        // 错误忽略
                    }
                });
                ctx.globalAlpha = 1;
            } catch (error) {
                console.error('绘制粒子出错', error);
            }
        }

        // 绘制五角星
        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;
                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
        }

        // 绘制弹道轨迹
        function drawTrails() {
            try {
                if (!projectileTrails || projectileTrails.length === 0) return;
                projectileTrails.forEach(t => {
                    const alpha = t.life / t.maxLife;
                    ctx.globalAlpha = alpha * 0.6;
                    const gradient = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, 8);
                    gradient.addColorStop(0, t.color);
                    gradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, 8, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;
            } catch (error) {
                // 忽略
            }
        }

        // ============ 左上角战斗信息面板绘制（含包子车、发兵池）============
        /**
         * 在Canvas左侧绘制战斗信息面板，包含：

         * - 我方发兵池 / 敌方发兵池预览
         * - AI手牌展示
