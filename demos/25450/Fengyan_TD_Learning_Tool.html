<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>封炎大战 - 梦塔防竞技塔防</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0a05 0%, #0a0505 100%);
            color: #fff;
            overflow: hidden;
            min-height: 100vh;
        }

        #startScreen, #heroSelectScreen, #gameOverScreen, #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(255, 80, 40, 0.15) 0%, rgba(10, 5, 0, 0.98) 70%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        #loadingScreen, #heroSelectScreen, #gameOverScreen {
            display: none;
        }

        .screen-title {
            font-size: clamp(36px, 8vw, 64px);
            font-weight: 900;
            background: linear-gradient(90deg, #ff6b35, #ff9500, #ffcc00, #ff9500, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            text-shadow: 0 0 30px rgba(255, 107, 53, 0.5);
        }

        .screen-subtitle {
            font-size: clamp(14px, 2.5vw, 18px);
            color: #ffaa66;
            margin-bottom: 30px;
        }

        .screen-btn {
            background: linear-gradient(145deg, #ff6b35, #d9441a);
            border: none;
            color: white;
            padding: clamp(12px, 2vw, 16px) clamp(40px, 8vw, 50px);
            border-radius: 12px;
            font-size: clamp(14px, 2.5vw, 18px);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .screen-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 40px rgba(255, 107, 53, 0.6);
        }

        .screen-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            max-width: min(900px, 95vw);
            padding: 15px;
        }

        .hero-card {
            background: linear-gradient(145deg, rgba(255, 107, 53, 0.2), rgba(180, 60, 30, 0.2));
            border: 2px solid rgba(255, 107, 53, 0.5);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero-card:hover {
            transform: scale(1.05);
            border-color: #ffcc00;
            box-shadow: 0 0 30px rgba(255, 107, 53, 0.5);
        }

        .hero-card.selected {
            border-color: #ffcc00;
            background: linear-gradient(145deg, rgba(255, 204, 0, 0.3), rgba(255, 107, 53, 0.3));
            box-shadow: 0 0 40px rgba(255, 204, 0, 0.6);
        }

        .hero-icon {
            font-size: clamp(28px, 5vw, 40px);
            margin-bottom: 6px;
        }

        .hero-name {
            font-size: clamp(12px, 2vw, 16px);
            font-weight: 700;
            color: #ffcc00;
            margin-bottom: 4px;
        }

        .hero-desc {
            font-size: clamp(9px, 1.5vw, 11px);
            color: #ffaa66;
            margin-bottom: 5px;
        }

        .hero-skill {
            font-size: clamp(8px, 1.3vw, 10px);
            color: #ffcc00;
            background: rgba(255, 204, 0, 0.2);
            padding: 4px;
            border-radius: 5px;
            margin-top: 5px;
            line-height: 1.3;
        }

        #gameContainer {
            display: none;
            flex-direction: column;
            height: 100vh;
        }

        #header {
            background: rgba(0, 0, 0, 0.85);
            padding: 6px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ff6b35;
            min-height: 38px;
        }

        .logo {
            font-size: 18px;
            font-weight: 900;
            background: linear-gradient(90deg, #ff6b35, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        .stats {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
        }

        .stat-icon {
            font-size: 14px;
        }

        #mainGame {
            flex: 1;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        #gameWrapper {
            display: flex;
        }

        #gameCanvas {
            flex: 1;
            background: #0a0505;
            min-width: 0;
        }

        #uiPanel {
            width: 260px;
            min-width: 260px;
            background: rgba(0, 0, 0, 0.92);
            padding: 10px;
            overflow-y: auto;
            overflow-x: hidden;
            border-left: 1px solid #ff6b35;
        }

        .panel-section {
            margin-bottom: 8px;
            padding: 8px 10px;
            background: rgba(255, 107, 53, 0.08);
            border-radius: 6px;
            border: 1px solid rgba(255, 107, 53, 0.2);
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: #ffcc00;
            margin-bottom: 6px;
        }

        #cardDeck {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }

        .card {
            background: linear-gradient(145deg, rgba(255, 107, 53, 0.3), rgba(180, 60, 30, 0.3));
            border: 1px solid rgba(255, 107, 53, 0.5);
            border-radius: 6px;
            padding: 4px 2px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .card:hover {
            transform: scale(1.08);
            border-color: #ffcc00;
        }

        .card.selected {
            border-color: #ffcc00;
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.6);
            background: linear-gradient(145deg, rgba(255, 204, 0, 0.3), rgba(255, 107, 53, 0.3));
        }

        .card.disabled {
            opacity: 0.4;
            border-color: #666;
            cursor: not-allowed;
            pointer-events: none;
        }

        .card-icon {
            font-size: 18px;
            text-align: center;
        }

        .card-name {
            font-size: 9px;
            font-weight: 700;
            text-align: center;
            color: #ffcc00;
            margin: 2px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-cost {
            font-size: 8px;
            text-align: center;
            color: #ffaa66;
        }

        .selected-card-display {
            background: rgba(255, 204, 0, 0.15);
            border: 1px solid #ffcc00;
            border-radius: 6px;
            padding: 6px 8px;
            text-align: center;
            color: #ffcc00;
            font-weight: 700;
            font-size: 12px;
        }

        .wave-info {
            font-size: 11px;
            color: #ffaa66;
            white-space: pre-line;
            line-height: 1.5;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(145deg, #ff6b35, #d9441a);
            border: none;
            color: white;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 6px;
        }

        .btn:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 16px rgba(255, 107, 53, 0.5);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: linear-gradient(145deg, #444, #333);
            font-size: 12px;
            padding: 6px 10px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .tip {
            font-size: 10px;
            color: #888;
            text-align: center;
            padding: 6px;
            background: rgba(255,255,255,0.03);
            border-radius: 4px;
        }

        .skill-btn {
            position: relative;
            background: linear-gradient(145deg, #ff6b35, #d9441a);
            border: 2px solid #ffcc00;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .skill-btn .cooldown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
        }

        .hammer-cooldown {
            font-size: 11px;
            color: #aaa;
        }

        .theme-btn {
            padding: 8px 10px;
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            border: 2px solid #666;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            transition: all 0.3s;
            text-align: center;
            white-space: nowrap;
        }

        .theme-btn:hover {
            transform: scale(1.05);
            border-color: #ffcc00;
        }

        .theme-btn.active {
            background: linear-gradient(145deg, #ff6b35, #d9441a);
            border-color: #ffcc00;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
        }

        .skin-btn {
            padding: 6px 8px;
            background: linear-gradient(145deg, #3a3a3a, #2a2a2a);
            border: 1px solid #888;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .skin-btn:hover {
            transform: scale(1.1);
            border-color: #ffcc00;
        }

        .skin-btn.active {
            background: linear-gradient(145deg, #ffcc00, #ff9900);
            border-color: #fff;
            color: #000;
        }

        .particle-toggle {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            user-select: none;
        }

        .particle-toggle:hover {
            background: rgba(255, 204, 0, 0.15);
        }

        .screen-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .damage-indicator {
            font-size: 20px !important;
            font-weight: 900 !important;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8) !important;
        }

        .icon-skin {
            filter: hue-rotate(0deg);
        }
    </style>
</head>
<body>
    <div id="startScreen">
        <div class="screen-title">🔥 封炎大战 🔥</div>
        <div class="screen-subtitle">梦塔防 竞技塔防</div>
        <button class="screen-btn" id="startBtn">开始对战</button>
    </div>

    <div id="heroSelectScreen">
        <div class="screen-title" style="font-size: 48px; margin-bottom: 10px;">选择你的武将</div>
        <div class="screen-subtitle" style="font-size: 14px; margin-bottom: 20px;">每位君主可以选择一位武将协助防守（最多选择1个）</div>
        <div class="hero-grid" id="heroGrid"></div>
        <button class="screen-btn" id="confirmHeroBtn" style="margin-top: 20px; opacity: 0.5; position: relative; z-index: 10;" disabled>确认选择</button>
    </div>

    <div id="loadingScreen">
        <div class="screen-title">加载中...</div>
        <div class="screen-subtitle" id="loadingText">正在初始化游戏...</div>
    </div>

    <div id="gameOverScreen">
        <div class="screen-title" id="gameOverTitle">游戏结束</div>
        <div class="screen-subtitle" id="gameOverSubtitle"></div>
        <button class="screen-btn" id="restartBtn">再来一局</button>
    </div>

    <div id="gameContainer">
        <div id="header">
            <div class="logo">🔥 封炎大战</div>
            <div class="stats">
                <div class="stat">
                    <span class="stat-icon">💰</span>
                    <span>军饷: <span id="gold">100</span></span>
                </div>
                <div class="stat">
                    <span class="stat-icon">🥟</span>
                    <span>包子: <span id="baozi">0</span></span>
                </div>
                <div class="stat">
                    <span class="stat-icon">👑</span>
                    <span>君主: <span id="lordHp">100</span> / <span id="maxLordHpSpan">200</span></span>
                </div>
                <div class="stat">
                    <span class="stat-icon">⚔️</span>
                    <span>击杀: <span id="kills">0</span></span>
                </div>
                <div class="stat">
                    <span class="stat-icon">🔨</span>
                    <span class="hammer-cooldown" id="hammerCd">锤: 就绪</span>
                </div>
                <div class="stat">
                    <button id="musicBtn" style="background: transparent; border: none; cursor: pointer; font-size: 20px;">🔇</button>
                </div>
            </div>
        </div>

        <div id="mainGame">
            <div id="gameWrapper">
                <canvas id="gameCanvas"></canvas>
                <div id="uiPanel">
                <div class="panel-section">
                    <div class="section-title">🎴 手牌 (<span id="handCount">0</span>/10)</div>
                    <div id="cardDeck"></div>
                </div>
                
                <div class="panel-section" id="selectedCardSection" style="display: none;">
                    <div class="selected-card-display" id="selectedCardText">已选择: -</div>
                </div>

                <div class="panel-section" id="towerUpgradeSection" style="display: none;">
                    <div class="section-title">⬆️ 塔升级</div>
                    <div id="towerUpgradeName" style="font-size: 14px; font-weight: 700; color: #ffcc00; margin-bottom: 4px;"></div>
                    <div id="towerUpgradeStars" style="font-size: 12px; margin-bottom: 6px; letter-spacing: 2px;"></div>
                    <div id="towerUpgradeStats" style="font-size: 10px; color: #ffaa66; margin-bottom: 8px; line-height: 1.6;"></div>
                    <button class="btn" id="upgradeTowerBtn" style="margin-top: 0; padding: 8px; font-size: 14px;">⬆️ 升级</button>
                    <div style="font-size: 9px; color: #888; margin-top: 4px; text-align: center;">
                        💡 点击战场上的塔可以选中升级
                    </div>
                </div>

                <div class="panel-section">
                    <div class="section-title">🔥 放置模式</div>
                    <select id="placementMode" style="width: 100%; padding: 6px; border-radius: 4px; background: #1a0a05; color: #fff; border: 1px solid #ff6b35; font-size: 12px;">
                        <option value="build">🏗️ 建造武将/部队</option>
                        <option value="send">🥟 发兵攻击</option>
                    </select>
                    <div style="font-size: 10px; color: #ffaa66; margin-top: 4px;">
                        💡 发兵消耗10个包子
                    </div>
                </div>

                <div class="panel-section">
                    <button class="btn" id="startWaveBtn">开始下一波</button>
                </div>

                <div class="panel-section">
                    <div class="section-title">🎮 控制</div>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;">
                        <button class="btn btn-secondary" id="pauseBtn" style="margin-top:0;">⏸️ 暂停</button>
                        <button class="btn btn-secondary" id="hammerBtn" style="margin-top:0;">🔨 锤子</button>
                        <button class="btn btn-secondary" id="speed1Btn" style="margin-top:0;">⏩ 1x</button>
                        <button class="btn btn-secondary" id="speed2Btn" style="margin-top:0;">⏩⏩ 2x</button>
                        <button class="btn btn-secondary" id="retreatBtn" style="margin-top:0; grid-column: span 2;">🚪 退兵</button>
                    </div>
                </div>

                <div class="panel-section" id="settingsSection">
                    <div class="section-title" id="settingsToggle" style="cursor:pointer;">⚙️ 设置 <span style="float:right;font-size:10px;color:#888;">点击展开</span></div>
                    <div id="settingsContent" style="display:none;">
                        <div class="section-title" style="font-size:11px;margin-top:6px;">🎨 地图主题</div>
                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px;">
                            <button class="theme-btn active" id="themeForest" data-theme="forest" style="font-size:11px;padding:4px 6px;">🌲 森林</button>
                            <button class="theme-btn" id="themeDesert" data-theme="desert" style="font-size:11px;padding:4px 6px;">🏜️ 沙漠</button>
                            <button class="theme-btn" id="themeVolcano" data-theme="volcano" style="font-size:11px;padding:4px 6px;">🌋 火山</button>
                            <button class="theme-btn" id="themeSnow" data-theme="snow" style="font-size:11px;padding:4px 6px;">❄️ 冰雪</button>
                        </div>

                        <div class="section-title" style="font-size:11px;margin-top:6px;">✨ 特效</div>
                        <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                            <div class="particle-toggle" id="toggleParticles" style="font-size:10px;padding:3px 6px;">
                                <span>💥 粒子</span>
                                <span id="particleStatus" style="color: #4ade80; margin-left: 4px;">开</span>
                            </div>
                            <div class="particle-toggle" id="toggleScreenShake" style="font-size:10px;padding:3px 6px;">
                                <span>📳 震动</span>
                                <span id="shakeStatus" style="color: #4ade80; margin-left: 4px;">开</span>
                            </div>
                            <div class="particle-toggle" id="toggleTrails" style="font-size:10px;padding:3px 6px;">
                                <span>🌟 轨迹</span>
                                <span id="trailStatus" style="color: #4ade80; margin-left: 4px;">开</span>
                            </div>
                            <div class="particle-toggle" id="toggleSfx" style="font-size:10px;padding:3px 6px;">
                                <span>🎵 音效</span>
                                <span id="sfxStatus" style="color: #4ade80; margin-left: 4px;">开</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="tip">
                    🎮 选卡建造/放置炎区/发兵攻击，击败敌方君主
                </div>
            </div>
            </div>
        </div>
    </div>

    <div class="screen-flash" id="screenFlash" style="display: none;"></div>

    <script>
        // ============ 游戏引擎与配置常量 ============
        /** 单个格子的像素大小（根据画布动态调整） */
        let TILE_SIZE = 40;
        const MAP_WIDTH = 24;    // 地图宽度（格子数）
        const MAP_HEIGHT = 16;   // 地图高度（格子数）
        const MAP_OFFSET_X = 160; // 左侧信息面板宽度，地图整体右移
        /**
         * 初始化地图二维数组：
         *   0 = 边界（不可建造）
         *   1 = 敌方区域 / 敌人出现区（不可建造）
         *   2 = 我方区域（可以建造）
         * x < 11 为我方，x >= 11 && x <= 12 为敌人出现区，x > 12 为敌方
         */
        const mapData = [];
        for (let y = 0; y < MAP_HEIGHT; y++) {
            const row = [];
            for (let x = 0; x < MAP_WIDTH; x++) {
                if (x === 0 || x === MAP_WIDTH - 1 || y === 0 || y === MAP_HEIGHT - 1) {
                    row.push(0); // 边界区域
                } else if (x < 11) {
                    row.push(2); // 我方区域可以建造（左半部分）
                } else if (x >= 11 && x <= 12) {
                    row.push(1); // 敌人出现区域（不可建造）
                } else {
                    row.push(1); // 敌方区域不能建造（右半部分）
                }
            }
            mapData.push(row);
        }

        // ============ 地图主题系统 ============
        const mapThemes = {
            forest: {
                name: '森林',
                bg: '#1a3d1a',
                allyTile: '#2a5a2a',
                enemyTile: '#5a2a2a',
                spawnTile: '#555555',
                border: '#1a3d1a',
                allyBorder: '#00ff00',
                enemyBorder: '#ff0000',
                fireZoneColors: ['rgba(255, 100, 0, 0.9)', 'rgba(255, 50, 0, 0.3)'],
                iceZoneColor: 'rgba(100, 200, 255, 0.6)',
                labelColor: '#ff6b35',
                decorations: ['🌲', '🌳', '🌿']
            },
            desert: {
                name: '沙漠',
                bg: '#c2956a',
                allyTile: '#d4a76a',
                enemyTile: '#8a5a3a',
                spawnTile: '#6a4a2a',
                border: '#a08050',
                allyBorder: '#ffdd00',
                enemyBorder: '#ff6600',
                fireZoneColors: ['rgba(255, 200, 100, 0.9)', 'rgba(255, 150, 50, 0.3)'],
                iceZoneColor: 'rgba(150, 220, 255, 0.6)',
                labelColor: '#8a5a3a',
                decorations: ['🌵', '🏜️', '🪨']
            },
            volcano: {
                name: '火山',
                bg: '#2a1010',
                allyTile: '#4a2020',
                enemyTile: '#6a1010',
                spawnTile: '#552020',
                border: '#3a1515',
                allyBorder: '#ffaa00',
                enemyBorder: '#ff3300',
                fireZoneColors: ['rgba(255, 80, 0, 1)', 'rgba(200, 40, 0, 0.3)'],
                iceZoneColor: 'rgba(200, 150, 255, 0.6)',
                labelColor: '#ff6600',
                decorations: ['🌋', '🔥', '💎']
            },
            snow: {
                name: '冰雪',
                bg: '#c8d8e8',
                allyTile: '#a8c8d8',
                enemyTile: '#88a8b8',
                spawnTile: '#7898a8',
                border: '#b0c8d8',
                allyBorder: '#00aaff',
                enemyBorder: '#4477aa',
                fireZoneColors: ['rgba(255, 150, 100, 0.8)', 'rgba(255, 200, 150, 0.3)'],
                iceZoneColor: 'rgba(150, 200, 255, 0.8)',
                labelColor: '#335577',
                decorations: ['❄️', '⛄', '🏔️']
            }

        // 创建爆炸粒子
        function createExplosion(x, y, color, count = 20, size = 1) {
            if (!particlesEnabled) return;

            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
                const speed = 2 + Math.random() * 4;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 30 + Math.random() * 20,
                    maxLife: 50,
                    color: color,
                    size: (2 + Math.random() * 3) * size,
                    type: ParticleType.EXPLOSION,
                    gravity: 0.05
                });

            // 添加冲击环
            particles.push({
                x: x,
                y: y,
                vx: 0,
                vy: 0,

        function initAudio() {
            if (!audioContext) {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.log('Audio not supported');
                }
            }
        }

        // 播放音效（通过WebAudio API合成声音）
        function playSound(type, volume = 0.3) {
            if (!sfxEnabled) return;
            initAudio();
            if (!audioContext) return;

            const now = audioContext.currentTime;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            gain.gain.value = volume;
            osc.connect(gain);
            gain.connect(audioContext.destination);

            switch (type) {
                case 'attack':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(220, now + 0.1);
                    gain.gain.setValueAtTime(volume, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
                case 'skill':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    osc.frequency.exponentialRampToValueAtTime(400, now + 0.2);
                    gain.gain.setValueAtTime(volume, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    // 添加次音效
                    setTimeout(() => playTone(600, 0.15, 'triangle', volume * 0.7), 50);
                    break;
                case 'hit':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                    gain.gain.setValueAtTime(volume * 1.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;
                case 'wave':
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(600, now + 0.1);
                    osc.frequency.linearRampToValueAtTime(400, now + 0.2);
                    gain.gain.setValueAtTime(volume, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                    break;
                case 'build':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.linearRampToValueAtTime(800, now + 0.08);
                    gain.gain.setValueAtTime(volume * 0.8, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
                case 'death':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
                    gain.gain.setValueAtTime(volume, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                    break;
                case 'click':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(volume * 0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                    break;
                case 'victory':
                    const notes = [523, 659, 784, 1047];
                    notes.forEach((freq, i) => {
                        setTimeout(() => playTone(freq, 0.2, 'triangle', volume), i * 100);
                    });
                    break;
                case 'defeat':
                    const lowNotes = [400, 350, 300, 200];
                    lowNotes.forEach((freq, i) => {
                        setTimeout(() => playTone(freq, 0.25, 'sawtooth', volume * 0.8), i * 150);
                    });
                    break;
                case 'hammer':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.15);
                    gain.gain.setValueAtTime(volume * 1.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                    break;
            }
        }

        function playTone(frequency, duration, type = 'sine', volume = 0.3) {
            if (!audioContext || !sfxEnabled) return;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const now = audioContext.currentTime;
            
            osc.type = type;
            osc.frequency.value = frequency;
            gain.gain.setValueAtTime(volume, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
            
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start(now);
            osc.stop(now + duration);
        }

        // ============ 升级系统 ============
        /** 升级配置常量：武将最高等级、部队最高等级、升级费用倍数、每级属性提升比例、技能提升比例 */
        const UPGRADE_CONFIG = {
            heroMaxLevel: 5,
            troopMaxLevel: 3,
            costMultiplier: 1.8,
            statPerLevel: 0.25,
            skillPerLevel: 0.2
        };

        function getMaxLevel(tower) {
            const isHero = tower && tower.type && heroCards.some(h => h.id === tower.type.id);
            return isHero ? UPGRADE_CONFIG.heroMaxLevel : UPGRADE_CONFIG.troopMaxLevel;
        }

        function getUpgradeCost(tower) {
            if (!tower || !tower.type) return 0;
            const baseCost = tower.type.cost || 20;
            const level = tower.level || 1;
            const maxLv = getMaxLevel(tower);
            if (level >= maxLv) return -1;
            return Math.ceil(baseCost * Math.pow(UPGRADE_CONFIG.costMultiplier, level - 1));
        }

        function canUpgrade(tower) {
            const cost = getUpgradeCost(tower);
            if (cost < 0) return false;
            return gameState.gold >= cost;
        }

        function getTowerStats(tower) {
            if (!tower || !tower.type) return { damage: 0, hp: 0, attackSpeed: 1, skillDamage: 0 };
            const level = tower.level || 1;
            const baseDamage = tower.type.damage || 0;
            const baseHp = tower.type.hp || 100;
            const baseSpeed = tower.type.attackSpeed || 1;
            const baseSkillDmg = tower.type.skillDamage || 0;
            
            const multiplier = 1 + (level - 1) * UPGRADE_CONFIG.statPerLevel;
            const skillMult = 1 + (level - 1) * UPGRADE_CONFIG.skillPerLevel;
            
            return {
                damage: Math.ceil(baseDamage * multiplier),
                hp: Math.ceil(baseHp * multiplier),
                maxHp: Math.ceil(baseHp * multiplier),
                attackSpeed: baseSpeed * (1 + (level - 1) * 0.05),
                skillDamage: baseDamage > 0 ? Math.ceil(baseDamage * multiplier) : Math.ceil(baseSkillDmg * skillMult)
            };
        }

        function getStarString(level, maxLevel) {
            const filled = Math.min(level, maxLevel);
            const empty = maxLevel - filled;
            return '⭐'.repeat(filled) + '☆'.repeat(empty);
        }

        function getLevelDisplay(level, maxLevel) {
            return `Lv.${level}/${maxLevel}`;
        }

        let selectedTowerForUpgrade = null;

        // 退兵：拆除塔并返还军饷
        function doRetreatTower(tower) {
            if (pvpPhase !== 'idle') {
                alert('PVP对战期间，无法退兵！');
                return false;
            }
            const level = tower.level || 1;
            const baseCost = tower.type.cost || 0;

            // 计算总退款 = 基础造价 + 所有升级花费
            let totalRefund = baseCost;
            for (let lv = 1; lv < level; lv++) {
                totalRefund += Math.ceil(baseCost * Math.pow(1.8, lv - 1));
            }
            totalRefund = Math.ceil(totalRefund * 0.8); // 80%返还，防止刷钱

            // 从数组中移除
            const idx = towers.indexOf(tower);
            if (idx >= 0) towers.splice(idx, 1);

            safeModifyGold(totalRefund);

            // 特效反馈
            createExplosion(tower.x, tower.y, '#ff4444', 20, 1.5);
            addFloatingText(tower.x, tower.y - 30, `🚪 退兵 +💰${totalRefund}`, '#ff6666', 80, -1.5);
            playSound('defeat', 0.2);

            // 取消选中
            selectedTowerForUpgrade = null;
            const upgradeSection = document.getElementById('towerUpgradeSection');
            if (upgradeSection) upgradeSection.style.display = 'none';
            updateUI();
            return true;
        }

        // ============ PVP 对战系统 ============
        /**
         * PVP状态机：
         *   idle     = 非PVP阶段，正常波次进行
         *   countdown = PVP倒计时15秒，所有单位静止
         *   battle    = 双方塔互相移动+攻击，直到一方全灭或超时
         *   result    = 显示胜负结果，结算后恢复波次状态
         */
        const PVP_COUNTDOWN_FRAMES = 900;   // 15秒倒计时（60fps × 15秒）
        const PVP_BATTLE_TIMEOUT = 3600;     // 60秒战斗超时（60fps × 60秒）
        /** 当前PVP阶段 */
        let pvpPhase = 'idle';               // idle/countdown/battle/result
        /** PVP计时器（帧数） */
        let pvpTimer = 0;
        /** PVP结果：win/lose/draw */
        let pvpResult = null;
        /** PVP结果公告持续时间 */
        let pvpAnnounceTimer = 0;

        function findTowerAt(tileX, tileY) {
            return towers.find(t => t.tileX === tileX && t.tileY === tileY && !t.defeated);
        }

        function doUpgradeTower(tower) {
            if (gameState.waveInProgress) {
                alert('波次进行中，无法升级！');
                return false;
            }
            const cost = getUpgradeCost(tower);
            if (cost < 0) {
                alert('已达最高等级！');
                return false;
            }
            if (gameState.gold < cost) {
                alert('军饷不足，无法升级！');
                return false;
            }
            
            safeModifyGold(-cost);
            tower.level = (tower.level || 1) + 1;
            const stats = getTowerStats(tower);
            const oldMaxHp = tower.maxHp || stats.maxHp;
            const hpRatio = Math.min(1, tower.hp / oldMaxHp); // 保持血量百分比
            tower.maxHp = stats.maxHp;
            tower.hp = Math.ceil(stats.maxHp * hpRatio);
            
            createExplosion(tower.x, tower.y, '#ffdd00', 20, 1.2);
            createStars(tower.x, tower.y, '#ffcc00', 12);
            playSound('build', 0.3);
            triggerScreenShake(3, 10);
            
            updateTowerUpgradeUI();
            updateUI();
            return true;
        }

        function updateTowerUpgradeUI() {
            const section = document.getElementById('towerUpgradeSection');
            if (!section) return;
            
            if (!selectedTowerForUpgrade || selectedTowerForUpgrade.defeated) {
                section.style.display = 'none';
                selectedTowerForUpgrade = null;
                return;
            }
            
            const tower = selectedTowerForUpgrade;
            const level = tower.level || 1;
            const maxLv = getMaxLevel(tower);
            const cost = getUpgradeCost(tower);
            const isMaxed = level >= maxLv;
            
            section.style.display = 'block';
            
            const icon = tower.type.icon || '🏰';
            const name = tower.type.name || '未知';
            const stats = getTowerStats(tower);
            
            const nameEl = document.getElementById('towerUpgradeName');
            if (nameEl) nameEl.innerHTML = `${icon} ${name} ${getLevelDisplay(level, maxLv)}`;
            
            const starEl = document.getElementById('towerUpgradeStars');
            if (starEl) starEl.textContent = getStarString(level, maxLv);
            
            const statsEl = document.getElementById('towerUpgradeStats');
            if (statsEl) {
                const nextStats = isMaxed ? stats : getTowerStats({ ...tower, level: level + 1, type: tower.type });
                statsEl.innerHTML = `
                    伤害: ${stats.damage} ${isMaxed ? '' : `<span style="color:#888">→</span> <span style="color:#4ade80">+${nextStats.damage - stats.damage}</span>`}
                    | 血量: ${stats.hp} ${isMaxed ? '' : `<span style="color:#888">→</span> <span style="color:#4ade80">+${nextStats.hp - stats.hp}</span>`}
                    | 攻速: ${stats.attackSpeed.toFixed(1)}
                `;
            }
            
            const btn = document.getElementById('upgradeTowerBtn');
            if (btn) {
                if (isMaxed) {
                    btn.disabled = true;
                    btn.textContent = '⭐ MAX 已达最高等级';
                    btn.style.background = '#666';
                } else if (gameState.gold < cost) {
                    btn.disabled = true;
                    btn.textContent = `💔 💰${cost} 军饷不足`;
                    btn.style.background = '#666';
                } else {
                    btn.disabled = false;
                    btn.textContent = `⬆️ 升级 💰${cost}`;
                    btn.style.background = '';
                }
            }
        }

        // ============ PVP 对战函数 ============
        function startPvp() {
            // 保存PVP前塔的原始位置
            towers.forEach(t => { t._originalX = t.x; t._originalY = t.y; });
            opponentTowers.forEach(t => { t._originalX = t.x; t._originalY = t.y; });

            // 复活双方所有在场塔，以满血状态参与PVP对战
            towers.forEach(t => {
                t.hp = t.maxHp;
                t.defeated = false;
            });
            opponentTowers.forEach(t => {
                t.hp = t.maxHp;
                t.defeated = false;
            });

            // PVP全阶段不生成任何敌人和部队
            // 清空待生成队列，PVP期间不再生成
            gameState.enemiesToSpawn = [];
            gameState.opponentEnemiesToSpawn = [];
            gameState.enemySpawnTimer = 0;
            // 清空弹道、火焰区域，避免干扰PVP交战
            projectiles = [];
            fireZones = [];
            opponentFireZones = [];

            pvpPhase = 'countdown';
            pvpTimer = 0;
            pvpResult = null;
            pvpAnnounceTimer = 0;

            // 倒计时期间静止（不改血量，只眩晕）
            towers.forEach(t => {
                if (!t.defeated) t.stunned = PVP_COUNTDOWN_FRAMES;
            });
            opponentTowers.forEach(t => {
                if (!t.defeated) t.stunned = PVP_COUNTDOWN_FRAMES;
            });
            enemies.forEach(e => {
                e.stunned = PVP_COUNTDOWN_FRAMES;
                e.slowFactor = 1;
            });
            myEnemies.forEach(e => {
                e.stunned = PVP_COUNTDOWN_FRAMES;
                e.slowFactor = 1;
            });

            playSound('wave', 0.4);
        }

        // 判断一方是否单位全灭
        function isSideEliminated(isPlayerSide) {
            if (isPlayerSide) {
                // 我方：塔 + 场上部队(myEnemies)
                const aliveTowers = towers.some(t => t.hp > 0 && !t.defeated);
                const aliveTroops = myEnemies.some(e => e.hp > 0);
                return !aliveTowers && !aliveTroops;
            } else {
                // 敌方：塔 + 场上部队(enemies)
                const aliveTowers = opponentTowers.some(t => t.hp > 0 && !t.defeated);
                const aliveTroops = enemies.some(e => e.hp > 0);
                return !aliveTowers && !aliveTroops;
            }
        }

        function getSideUnitCount(isPlayerSide) {
            if (isPlayerSide) {
                let count = 0;
                towers.forEach(t => { if (t.hp > 0 && !t.defeated) count++; });
                myEnemies.forEach(e => { if (e.hp > 0) count++; });
                return count;
            } else {
                let count = 0;
                opponentTowers.forEach(t => { if (t.hp > 0 && !t.defeated) count++; });
                enemies.forEach(e => { if (e.hp > 0) count++; });
                return count;
            }
        }

        function updatePvp() {
            if (pvpPhase === 'idle' || pvpPhase === 'result') return;
            if (gameState.isPaused || gameState.gameOver) return;

            if (pvpPhase === 'countdown') {
                const remaining = Math.ceil((PVP_COUNTDOWN_FRAMES - pvpTimer) / 60);
                if (pvpTimer >= PVP_COUNTDOWN_FRAMES) {
                     pvpPhase = 'battle';
                     pvpTimer = 0;
                     triggerScreenShake(8, 20);
                     createExplosion(canvas.width / 2, canvas.height / 2, '#ff3366', 40, 2.5);
                     playSound('skill', 0.4);

                     // 清除所有塔的眩晕
                     towers.forEach(t => { t.stunned = 0; });
                     opponentTowers.forEach(t => { t.stunned = 0; });

                     // 设置塔的攻击冷却
                     towers.forEach(t => { t.attackCooldown = 0; });
                     opponentTowers.forEach(t => { t.attackCooldown = 0; });
                }
                updateUI();
                return;
            }

            // ======== 战斗阶段：双方塔互相移动+攻击 ========
            const towerFightRange = 2.5 * TILE_SIZE;
            const towerFightRangeSq = towerFightRange * towerFightRange;

            // ---- 玩家的塔 → 找最近的敌方塔 → 移动 → 攻击 ----
            for (let i = towers.length - 1; i >= 0; i--) {
                const t = towers[i];
                if (t.hp <= 0 || t.defeated) continue;
                if (t.attackCooldown === undefined) t.attackCooldown = 0;
                if (t.attackCooldown > 0) { t.attackCooldown--; }

                // 找最近的敌方存活塔
                let nearestTarget = null;
                let nearestDistSq = Infinity;
                for (let j = 0; j < opponentTowers.length; j++) {
                    const ot = opponentTowers[j];
                    if (ot.hp <= 0 || ot.defeated) continue;
                    const dx = ot.x - t.x;
                    const dy = ot.y - t.y;
                    const dsq = dx * dx + dy * dy;
                    if (dsq < nearestDistSq) {
                        nearestDistSq = dsq;
                        nearestTarget = ot;
                    }
                }

                if (nearestTarget && nearestDistSq <= towerFightRangeSq) {
                    // 在攻击范围内 → 攻击
                    if (t.attackCooldown <= 0) {
                        nearestTarget.hp -= t.type.damage;
                        t.attackCooldown = Math.max(15, Math.floor(60 / t.type.attackSpeed));
                        createSparks(nearestTarget.x, nearestTarget.y, '#ff6666', 4);
                        addFloatingText(nearestTarget.x, nearestTarget.y - 20, Math.ceil(t.type.damage).toString(), '#ff6666', 30, -1.2);
                        if (nearestTarget.hp <= 0 && !nearestTarget.defeated) {
                            nearestTarget.defeated = true;
                            createExplosion(nearestTarget.x, nearestTarget.y, '#ff4400', 12, 1);
                        }
                    }
                } else if (nearestTarget) {
                    // 有目标但不在范围内 → 移动过去
                    const dx = nearestTarget.x - t.x;
                    const dy = nearestTarget.y - t.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 0) {
                        const moveSpeed = 1.5;
                        const moveDist = Math.min(dist, moveSpeed);
                        t.x += (dx / dist) * moveDist;
                        t.y += (dy / dist) * moveDist;
                    }
                }
            }

            // ---- 敌方的塔 → 找最近的玩家塔 → 移动 → 攻击 ----
            for (let i = opponentTowers.length - 1; i >= 0; i--) {
                const ot = opponentTowers[i];
                if (ot.hp <= 0 || ot.defeated) continue;
                if (ot.attackCooldown === undefined) ot.attackCooldown = 0;
                if (ot.attackCooldown > 0) { ot.attackCooldown--; }

                // 找最近的玩家存活塔
                let nearestTarget = null;
                let nearestDistSq = Infinity;
                for (let j = 0; j < towers.length; j++) {
                    const t = towers[j];
                    if (t.hp <= 0 || t.defeated) continue;
                    const dx = t.x - ot.x;
                    const dy = t.y - ot.y;
                    const dsq = dx * dx + dy * dy;
                    if (dsq < nearestDistSq) {
                        nearestDistSq = dsq;
                        nearestTarget = t;
                    }
                }

                if (nearestTarget && nearestDistSq <= towerFightRangeSq) {
                    // 在攻击范围内 → 攻击
                    if (ot.attackCooldown <= 0) {
                        nearestTarget.hp -= ot.type.damage;
                        ot.attackCooldown = Math.max(15, Math.floor(60 / ot.type.attackSpeed));
                        createSparks(nearestTarget.x, nearestTarget.y, '#6666ff', 4);
                        addFloatingText(nearestTarget.x, nearestTarget.y - 20, Math.ceil(ot.type.damage).toString(), '#6666ff', 30, -1.2);
                        if (nearestTarget.hp <= 0 && !nearestTarget.defeated) {
                            nearestTarget.defeated = true;
                            createExplosion(nearestTarget.x, nearestTarget.y, '#4400ff', 12, 1);
                        }
                    }
                } else if (nearestTarget) {
                    // 有目标但不在范围内 → 移动过去
                    const dx = nearestTarget.x - ot.x;
                    const dy = nearestTarget.y - ot.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 0) {
                        const moveSpeed = 1.5;
                        const moveDist = Math.min(dist, moveSpeed);
                        ot.x += (dx / dist) * moveDist;
                        ot.y += (dy / dist) * moveDist;
                    }
                }
            }

            // 防止塔重叠：简单的推开检测
            const minTowerDist = TILE_SIZE * 0.8;
            const minTowerDistSq = minTowerDist * minTowerDist;
            for (let i = 0; i < towers.length; i++) {
                const t = towers[i];
                if (t.hp <= 0 || t.defeated) continue;
                for (let j = i + 1; j < towers.length; j++) {
                    const t2 = towers[j];
                    if (t2.hp <= 0 || t2.defeated) continue;
                    const dx = t2.x - t.x;
                    const dy = t2.y - t.y;
                    const dsq = dx * dx + dy * dy;
                    if (dsq < minTowerDistSq && dsq > 0) {
                        const dist = Math.sqrt(dsq);
                        const push = (minTowerDist - dist) / 2;
                        const nx = dx / dist;
                        const ny = dy / dist;
                        t.x -= nx * push;
                        t.y -= ny * push;
                        t2.x += nx * push;
                        t2.y += ny * push;
                    }
                }
            }
            for (let i = 0; i < opponentTowers.length; i++) {
                const ot = opponentTowers[i];
                if (ot.hp <= 0 || ot.defeated) continue;
                for (let j = i + 1; j < opponentTowers.length; j++) {
                    const ot2 = opponentTowers[j];
                    if (ot2.hp <= 0 || ot2.defeated) continue;
                    const dx = ot2.x - ot.x;
                    const dy = ot2.y - ot.y;
                    const dsq = dx * dx + dy * dy;
                    if (dsq < minTowerDistSq && dsq > 0) {
                        const dist = Math.sqrt(dsq);
                        const push = (minTowerDist - dist) / 2;
                        const nx = dx / dist;
                        const ny = dy / dist;
                        ot.x -= nx * push;
                        ot.y -= ny * push;
                        ot2.x += nx * push;
                        ot2.y += ny * push;
                    }
                }
            }

            // PVP战场粒子
            if (pvpTimer % 5 === 0) {
                createSparks(
                    12 * TILE_SIZE + (Math.random() - 0.5) * TILE_SIZE * 4,
                    7 * TILE_SIZE + TILE_SIZE / 2 + (Math.random() - 0.5) * TILE_SIZE * 3,
                    '#ff3366', 2
                );
            }

            // 检查胜负：一方塔全部消灭即结束
            const playerTowersAlive = towers.filter(t => t.hp > 0 && !t.defeated).length;
            const enemyTowersAlive = opponentTowers.filter(t => t.hp > 0 && !t.defeated).length;

            if (playerTowersAlive === 0 || enemyTowersAlive === 0 || pvpTimer >= PVP_BATTLE_TIMEOUT) {
                pvpPhase = 'result';
                pvpAnnounceTimer = 180;

                if (playerTowersAlive > 0 && enemyTowersAlive === 0) {
                     pvpResult = 'win';
                     const reward = 100;
                     gameState.baozi += reward;
                    addFloatingText(canvas.width / 2, canvas.height / 2 - 50, `🥟 +${reward} 包子！`, '#ffcc00', 120, -0.5);
                    playSound('victory', 0.4);
                } else if (enemyTowersAlive > 0 && playerTowersAlive === 0) {
                    pvpResult = 'lose';
                    playSound('defeat', 0.3);
                } else {
                    pvpResult = 'draw';
                }

                const btn = document.getElementById('startWaveBtn');
                if (btn) {
                    btn.disabled = true;
                    btn.textContent = pvpResult === 'win' ? '🏆 PVP胜利！' :
                                      pvpResult === 'lose' ? '💀 PVP失败...' : '⚖️ PVP平局';
                }
                updateUI();
            }
        }

            if (pvpPhase === 'idle') return;
            ctx.save();

            if (pvpPhase === 'countdown') {
                // ======== 倒计时阶段 ========
                const remaining = Math.max(0, Math.ceil((PVP_COUNTDOWN_FRAMES - pvpTimer) / 60));
                const pulse = Math.sin(pvpTimer * 0.08) * 0.3 + 0.7;

                // 顶部横幅
                ctx.fillStyle = `rgba(180, 30, 50, ${0.9 * pulse})`;
                const bw = 520, bh = 65;

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 26px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`⚔️ PVP 倒计时 ${remaining}s ⚔️`, canvas.width / 2, by + bh / 2 - 8);
                ctx.font = '15px Arial';
                ctx.fillStyle = '#ffddaa';
                const pCount = towers.filter(t => t.hp > 0 && !t.defeated).length;
                const eCount = opponentTowers.filter(t => t.hp > 0 && !t.defeated).length;

                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(barX, barY, barW, barH);

                ctx.fillRect(barX, barY, barW * progress, barH);

                ctx.strokeRect(barX, barY, barW, barH);

            } else if (pvpPhase === 'battle') {

                // 顶部横幅
                ctx.fillStyle = `rgba(200, 20, 40, ${0.85})`;
                const bw = 550, bh = 55;
                const bx = canvas.width / 2 - bw / 2, by = 10;
                ctx.fillRect(bx, by, bw, bh);
                ctx.strokeStyle = '#ffcc00';
                ctx.lineWidth = 3;
                ctx.strokeRect(bx, by, bw, bh);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 22px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`⚔️ PVP 混战中 ⚔️`, canvas.width / 2, by + bh / 2 - 8);

                // 战场中心发光
                ctx.shadowColor = '#ff3366';
                ctx.shadowBlur = 20 * pulse;
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⚔️', 12 * TILE_SIZE, 7 * TILE_SIZE + TILE_SIZE / 2);
                ctx.shadowBlur = 0;

            } else if (pvpPhase === 'result' && pvpAnnounceTimer > 0) {
                // ======== 结果公告 ========
                pvpAnnounceTimer--;
                const isWin = pvpResult === 'win';
                const bgColor = isWin ? 'rgba(0, 150, 50, 0.92)' :
                                pvpResult === 'lose' ? 'rgba(150, 20, 20, 0.92)' : 'rgba(100, 100, 100, 0.92)';
                const text = isWin ? '🏆 PVP 胜利！+100 包子 🏆' :
                            pvpResult === 'lose' ? '💀 PVP 失败... -50 包子' : '⚖️ PVP 平局';

                ctx.fillStyle = bgColor;
                const bw = 500, bh = 85;
                ctx.fillRect(canvas.width / 2 - bw / 2, canvas.height / 2 - bh / 2, bw, bh);
                ctx.strokeStyle = '#ffcc00';
                ctx.lineWidth = 3;
                ctx.strokeRect(canvas.width / 2 - bw / 2, canvas.height / 2 - bh / 2, bw, bh);

                const eTroops = opponentTowers.filter(t => t.hp > 0 && !t.defeated).length;

                ctx.font = 'bold 26px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                if (pvpAnnounceTimer < 60) {
                    const btn = document.getElementById('startWaveBtn');

                        btn.disabled = false;
                        btn.textContent = '继续下一波';
                        updateWavePreview();
                    }
                }

                // 公告结束，PVP结束等同于波次结束，恢复状态
                if (pvpAnnounceTimer <= 0) {
                    pvpPhase = 'idle';
                    pvpResult = null;

                    // PVP结束后恢复状态（等同于普通波次结束）
                    // 塔满血复活，恢复原始位置
                    towers.forEach(t => {
                        t.hp = t.maxHp;
                        t.defeated = false;
                        // 恢复原始位置（我方塔左侧，敌方塔右侧）
                        if (t._originalX !== undefined) t.x = t._originalX;
                        if (t._originalY !== undefined) t.y = t._originalY;
                    });
                    opponentTowers.forEach(t => {
                        t.hp = t.maxHp;
                        t.defeated = false;
                        if (t._originalX !== undefined) t.x = t._originalX;
                        if (t._originalY !== undefined) t.y = t._originalY;
                    });

                    // 清理场上残余部队
                    enemies = [];
                    myEnemies = [];
                    gameState.waveInProgress = false;
                    renderHand();

                    gameState.wave++;
                    safeModifyGold(20 + gameState.wave * 2);

                    // 每7波：在点击下一波之前提示
                    if (gameState.wave % 7 === 0 && gameState.wave <= gameState.maxWaves) {
                        waveWarning = '⚠️ 下一波强大敌人即将到来，严阵以待！';
                        waveWarningTimer = 300;

                    if (gameState.wave > gameState.maxWaves) {
                        endGame(pvpResult === 'win');
                    } else {
                        const btn = document.getElementById('startWaveBtn');
                        btn.disabled = false;
                        btn.textContent = '开始下一波';
                        updateUI();
                        updateWavePreview();
                    }
                }

                // 胜利特效
                if (isWin && pvpAnnounceTimer % 20 === 0) {
                    createStars(
                        canvas.width / 2 + (Math.random() - 0.5) * 250,
                        canvas.height / 2 - 30 + (Math.random() - 0.5) * 60,
                        '#ffdd00', 5
                    );
                }
            }
            ctx.restore();
        }

        // 计算当前波敌人的总兵力
        function calculateWaveEnemyPower(waveNum) {
            if (waveNum > gameState.maxWaves) return 0;
            const config = waveConfigs[waveNum - 1];
            let totalPower = 0;
            
            // 每波增加10%的敌人属性
            const waveBonus = 1 + (waveNum - 1) * 0.1;
            
            config.opponentSend.forEach(group => {
                const type = enemyTypes.find(e => e.id === group.type);
                if (type) {
                    const bonusDamage = Math.floor(type.damage * waveBonus);
                    const bonusHp = Math.floor(type.hp * waveBonus);
                    totalPower += (bonusDamage * 5 + bonusHp) * group.count;
                }
            });
            
            return Math.floor(totalPower);
        }

            try {

                    console.error('无效的金币数量:', amount);
                    return false;

                const newGold = gameState.gold + amount;
                // 确保新的金币值不会小于 0

        // 背景音乐系统

        function initBGM() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                bgmGain = audioContext.createGain();
                bgmGain.gain.value = 0.15;
                bgmGain.connect(audioContext.destination);
            } catch (e) {
                console.log('音频不支持');
            }
        }

        function playBGM() {
            if (!audioContext) initBGM();
            if (bgmPlaying) return;
            
            bgmPlaying = true;
            document.getElementById('musicBtn').textContent = '🔊';
            
            const notes = [261.63, 329.63, 392.00];
            const noteDurations = [0.8, 0.6, 1.0];
            
            function playNote(time, freq, duration) {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                
                osc.type = 'sine';
                osc.frequency.value = freq;
                
                gain.gain.setValueAtTime(0, time);
                gain.gain.linearRampToValueAtTime(0.3, time + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, time + duration);
                
                osc.connect(gain);
                gain.connect(bgmGain);
                osc.start(time);
                osc.stop(time + duration);
                bgmOscillators.push(osc);
            }
            
            let startTime = audioContext.currentTime;
            let sequence = [0, 1, 2, 1, 0, 1, 2, 0];
            let sequenceIndex = 0;
            
            function schedule() {
                if (!bgmPlaying) return;
                
                const noteIndex = sequence[sequenceIndex % sequence.length];
                const freq = notes[noteIndex];
                const duration = noteDurations[noteIndex];
                
                playNote(startTime, freq, duration);
                startTime += duration;
                
                sequenceIndex++;
                setTimeout(schedule, duration * 900);
            }
            
            schedule();
        }

        function stopBGM() {
            bgmPlaying = false;
            document.getElementById('musicBtn').textContent = '🔇';
            bgmOscillators.forEach(osc => {
                try { osc.stop(); } catch (e) {}
            });
            bgmOscillators = [];
        }

        function toggleBGM() {
            if (bgmPlaying) {

            if (canvas && uiPanel && mainGame) {
