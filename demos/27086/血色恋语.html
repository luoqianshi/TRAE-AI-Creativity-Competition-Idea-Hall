<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>血色恋语 - 恋爱恐怖游戏</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Noto Serif SC', serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; overflow-x: hidden; }
@keyframes bloodDrop { 0% { transform: translateY(-100px); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(100vh); opacity: 0; } }
@keyframes textShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 50% { transform: translateX(2px); } 75% { transform: translateX(-1px); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.blood-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; opacity: 0; transition: opacity 1s ease; }
.blood-overlay.active { opacity: 1; }
.blood-drop { position: absolute; width: 3px; height: 15px; background: linear-gradient(to bottom, #8b0000, #ff0000); border-radius: 50%; animation: bloodDrop 3s linear infinite; }
.blood-border { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 3px solid transparent; border-image: linear-gradient(to bottom, #8b0000, #ff0000, #8b0000) 1; pointer-events: none; z-index: 999; opacity: 0; transition: opacity 1s ease; }
.blood-border.active { opacity: 1; }
.game-container { max-width: 900px; margin: 0 auto; padding: 20px; position: relative; z-index: 10; }
.title-screen { text-align: center; padding: 100px 20px; animation: fadeIn 2s ease; }
.game-title { font-size: 4em; font-weight: 700; color: #ff6b6b; text-shadow: 0 0 20px rgba(255,0,0,0.5); margin-bottom: 20px; letter-spacing: 10px; }
.game-subtitle { font-size: 1.2em; color: #888; margin-bottom: 60px; font-style: italic; }
.start-btn { background: linear-gradient(135deg, #8b0000, #ff0000); color: white; border: none; padding: 15px 60px; font-size: 1.3em; cursor: pointer; border-radius: 5px; font-family: 'Noto Serif SC', serif; transition: all 0.3s ease; letter-spacing: 5px; }
.start-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255,0,0,0.6); }
.stats-panel { background: rgba(20,20,20,0.9); border: 1px solid #333; border-radius: 10px; padding: 20px; margin-bottom: 30px; display: none; }
.stats-panel.active { display: block; animation: fadeIn 0.5s ease; }
.stats-title { font-size: 1.1em; color: #ff6b6b; margin-bottom: 15px; text-align: center; }
.stat-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 5px 0; border-bottom: 1px solid #222; }
.stat-name { color: #aaa; }
.stat-bar { width: 200px; height: 8px; background: #222; border-radius: 4px; overflow: hidden; }
.stat-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease, background-color 0.3s ease; }
.stat-value { color: #ddd; font-size: 0.9em; min-width: 40px; text-align: right; }
.story-panel { background: rgba(15,15,15,0.95); border: 1px solid #333; border-radius: 10px; padding: 30px; margin-bottom: 30px; min-height: 300px; display: none; }
.story-panel.active { display: block; animation: fadeIn 0.8s ease; }
.story-text { font-size: 1.1em; line-height: 2; color: #e0e0e0; margin-bottom: 20px; text-indent: 2em; }
.story-text.bloody { color: #ff6b6b; animation: textShake 0.5s ease-in-out; }
.speaker-name { font-size: 1.2em; color: #ff6b6b; font-weight: 600; margin-bottom: 10px; text-indent: 0; }
.choices-container { display: none; flex-direction: column; gap: 15px; margin-top: 30px; }
.choices-container.active { display: flex; animation: fadeIn 0.5s ease; }
.choice-btn { background: rgba(30,30,30,0.9); border: 1px solid #444; color: #ddd; padding: 15px 20px; font-size: 1em; cursor: pointer; border-radius: 5px; font-family: 'Noto Serif SC', serif; text-align: left; transition: all 0.3s ease; line-height: 1.6; }
.choice-btn:hover { background: rgba(139,0,0,0.3); border-color: #ff6b6b; transform: translateX(5px); }
.item-selection { display: none; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
.item-selection.active { display: grid; animation: fadeIn 0.5s ease; }
.item-card { background: rgba(25,25,25,0.9); border: 1px solid #444; border-radius: 10px; padding: 20px; cursor: pointer; transition: all 0.3s ease; }
.item-card:hover { border-color: #ff6b6b; transform: translateY(-5px); box-shadow: 0 5px 20px rgba(255,0,0,0.2); }
.item-name { font-size: 1.2em; color: #ff6b6b; margin-bottom: 10px; }
.item-desc { color: #aaa; font-size: 0.95em; line-height: 1.6; }
.item-effect { color: #66bb6a; margin-top: 10px; font-size: 0.9em; }
.chapter-title { font-size: 2em; color: #ff6b6b; text-align: center; margin: 40px 0; text-shadow: 0 0 10px rgba(255,0,0,0.3); display: none; }
.chapter-title.active { display: block; animation: fadeIn 1s ease; }
.ending-screen { text-align: center; padding: 80px 20px; display: none; }
.ending-screen.active { display: block; animation: fadeIn 2s ease; }
.ending-title { font-size: 3em; margin-bottom: 30px; }
.ending-desc { font-size: 1.2em; line-height: 2; color: #ccc; max-width: 600px; margin: 0 auto 40px; }
.restart-btn { background: linear-gradient(135deg, #333, #555); color: white; border: none; padding: 12px 40px; font-size: 1.1em; cursor: pointer; border-radius: 5px; font-family: 'Noto Serif SC', serif; transition: all 0.3s ease; }
.restart-btn:hover { background: linear-gradient(135deg, #555, #777); transform: scale(1.05); }
.notification { position: fixed; top: 20px; right: 20px; background: rgba(139,0,0,0.9); color: white; padding: 15px 25px; border-radius: 5px; z-index: 2000; display: none; animation: fadeIn 0.3s ease; }
.notification.show { display: block; }
</style>
</head>
<body>
<div class="blood-overlay" id="bloodOverlay"></div>
<div class="blood-border" id="bloodBorder"></div>
<div class="notification" id="notification"></div>
<div class="game-container">
<div class="title-screen" id="titleScreen">
<h1 class="game-title">血色恋语</h1>
<p class="game-subtitle">"在这座学园里，恋爱即是诅咒，甜蜜即是毒药"</p>
<button class="start-btn" onclick="startGame()">开始游戏</button>
</div>
<div class="stats-panel" id="statsPanel">
<div class="stats-title">【 当前状态 】</div>
<div class="stat-item"><span class="stat-name">理智值</span><div class="stat-bar"><div class="stat-fill" id="sanityBar" style="width:50%;background:#4fc3f7"></div></div><span class="stat-value" id="sanityValue">50</span></div>
<div class="stat-item"><span class="stat-name">好感度</span><div class="stat-bar"><div class="stat-fill" id="affectionBar" style="width:50%;background:#f06292"></div></div><span class="stat-value" id="affectionValue">50</span></div>
<div class="stat-item"><span class="stat-name">勇气值</span><div class="stat-bar"><div class="stat-fill" id="courageBar" style="width:50%;background:#ffb74d"></div></div><span class="stat-value" id="courageValue">50</span></div>
<div class="stat-item"><span class="stat-name">洞察力</span><div class="stat-bar"><div class="stat-fill" id="insightBar" style="width:50%;background:#ba68c8"></div></div><span class="stat-value" id="insightValue">50</span></div>
<div class="stat-item"><span class="stat-name">生命值</span><div class="stat-bar"><div class="stat-fill" id="healthBar" style="width:100%;background:#ef5350"></div></div><span class="stat-value" id="healthValue">100</span></div>
</div>
<div class="chapter-title" id="chapterTitle"></div>
<div class="story-panel" id="storyPanel"><div id="storyContent"></div></div>
<div class="choices-container" id="choicesContainer"></div>
<div class="item-selection" id="itemSelection"></div>
<div class="ending-screen" id="endingScreen">
<h2 class="ending-title" id="endingTitle"></h2>
<p class="ending-desc" id="endingDesc"></p>
<button class="restart-btn" onclick="location.reload()">重新开始</button>
</div>
</div>
<script>
// ===== 游戏状态 =====
let gameState = { sanity: 50, affection: 50, courage: 50, insight: 50, health: 100, currentItem: null, bloodSceneCount: 0 };

// ===== 道具定义 =====
const items = {
  diary: { name: "旧日记本", desc: "一本泛黄的日记本，封面上写着'1999年'。翻开第一页，字迹已经模糊，但隐约能辨认出'不要相信他'几个字。", effect: "洞察力+20，特定场景自动揭示隐藏线索", bonus: { insight: 20 } },
  amulet: { name: "破旧护身符", desc: "一个用红绳系着的护身符，布料已经褪色，上面绣着看不懂的符文。摸起来有种奇怪的温热感。", effect: "生命值+30，可抵挡一次致命伤害", bonus: { health: 30 } },
  knife: { name: "折叠刀", desc: "一把老旧的折叠刀，刀柄上刻着'保护自己'。刀刃已经有些钝了，但足以防身。", effect: "勇气值+20，解锁特殊对抗选项", bonus: { courage: 20 } }
};

// ===== 场景数据 =====
const scenes = {
  // --- 序章 ---
  "p1": {
    text: `九月的阳光透过教室的窗户洒进来，本该是温暖的，却让你感到一丝莫名的寒意。\n\n你站在讲台前，看着下面三十多张陌生的面孔。作为转学生，你已经习惯了这种被注视的感觉。但这一次，有些不同——那些目光中除了好奇，似乎还夹杂着别的什么。恐惧？怜悯？还是...期待？\n\n"大家好，我叫..."你的自我介绍被一阵微风打断。教室的门不知何时开了一条缝，走廊里的冷风灌了进来。\n\n就在这时，你注意到了她。\n\n坐在教室最后一排靠窗的位置，一个穿着白色连衣裙的女生正静静地看着你。她的长发如瀑布般垂落，遮住了半边脸颊。阳光照在她身上，却仿佛被吞噬了一般，没有在她周围形成任何光影。\n\n最让你在意的是她的眼睛——那是一双漆黑如墨的眼睛，深不见底，仿佛藏着无数秘密。当你与她对视的瞬间，她微微勾起嘴角，露出一个意味深长的微笑。\n\n那个笑容让你想起了小时候听过的鬼故事，想起了深夜里窗外摇曳的树影，想起了所有你不愿回忆的恐怖画面。\n\n"那是林晓雨，"班主任顺着你的目光看去，语气突然变得有些古怪，"她...不太爱说话。你就坐在她旁边吧，正好那个位置空着。"\n\n你注意到班主任说这话时，其他同学都低下了头，有人甚至打了个寒颤。\n\n那个位置，真的是"正好"空着的吗？`,
    choices: [
      { text: "走向林晓雨，在她旁边坐下。不知道为什么，你被她神秘的气质吸引了。", next: "p2", effects: { affection: 10 } },
      { text: "选择靠窗的另一个空位，与林晓雨保持距离。那种莫名的不安让你想要远离她。", next: "p2_alt", effects: { sanity: 5 } },
      { text: "看向窗外，试图缓解尴尬。这时你注意到对面旧校舍的楼顶似乎站着一个人影。", next: "p2_chen", effects: { insight: 10 } }
    ]
  },
  "p2": {
    text: `你走到林晓雨旁边，拉开椅子坐下。近距离看，她比远处更加苍白，皮肤几乎透明，能看到下面青色的血管。\n\n"你好，我是..."你刚要开口，她却突然转过头，那双漆黑的眼睛直直地盯着你。\n\n"我知道你是谁。"她的声音很轻，像是从很远的地方传来，"你终于来了。"\n\n你愣住了："我们...认识吗？"\n\n她没有回答，只是从抽屉里拿出一本笔记本，翻开其中一页推到你面前。那是一张手绘的画像——画中人有着和你一样的眼睛，一样的轮廓，但穿着不同的校服。\n\n"这是..."\n\n"五年前的你。"林晓雨的声音依然平静，仿佛在陈述一件再普通不过的事实，"或者说，和你很像的一个人。"\n\n你感到一阵眩晕。五年前的你？这怎么可能？你刚要追问，上课铃响了。林晓雨收回笔记本，重新看向窗外，仿佛刚才的对话从未发生。\n\n但你清楚地看到，她的手指在微微颤抖。`,
    choices: [
      { text: "压低声音问她：'你说的那个人，到底是谁？'", next: "p3", effects: { insight: 10 } },
      { text: "虽然满腹疑问，但决定先上课，等下课再找机会问她。", next: "p3_alt", effects: { sanity: 5 } },
      { text: "仔细观察她的侧脸，试图找出更多线索。", next: "p3_insight", effects: { insight: 15 } }
    ]
  },
  "p2_alt": {
    text: `你选择了远离林晓雨的位置。当你坐下时，似乎听到了一声极轻的叹息，像是从很远的地方传来，又像是你的幻觉。\n\n旁边的同学悄悄凑过来："明智的选择。"\n\n你转头看他，那是一个戴着眼镜的男生，看起来人畜无害，但眼神中透着一丝警惕。\n\n"什么意思？"\n\n"没什么，"他推了推眼镜，"只是...离林晓雨远点比较好。这是为你好。"\n\n你正想追问，他却已经转回头去，假装认真听课。但你注意到，他的手在桌子下面紧紧攥着，指节发白。\n\n这节课你听得心不在焉。每次你偷偷看向林晓雨，她都在看着窗外，仿佛整个世界都与她无关。但有一次，你们的目光在空气中相遇，她对你微微一笑——那个笑容让你想起了墓地里盛开的白色彼岸花，美丽而致命。\n\n下课铃响起时，你决定...`,
    choices: [
      { text: "去找那个戴眼镜的男生，问清楚他话中的含义。", next: "p3_chen", effects: { insight: 10 } },
      { text: "去图书馆查查这所学校的资料，转学生应该了解新环境。", next: "p3_library", effects: { insight: 15 } },
      { text: "去天台透透气，新环境让你感到压抑。", next: "p3_roof", effects: { courage: 5 } }
    ]
  },
  "p2_chen": {
    text: `那个人影站在旧校舍的楼顶，一动不动，像是在眺望远方，又像是在注视着你。\n\n你眯起眼睛想要看得更清楚，但阳光正好从那个方向射来，刺得你眼睛发疼。当你再次睁开眼时，人影已经不见了。\n\n"那是旧校舍，"班主任的声音从身后传来，吓了你一跳，"已经废弃五年了。不要靠近那里，危险。"\n\n你转过头，发现班主任的表情异常严肃，甚至可以说是...恐惧？\n\n"五年前发生了什么吗？"\n\n班主任的脸色瞬间变得惨白。他张了张嘴，似乎想说什么，但最终只是摇了摇头："不要问，不要靠近，不要...相信任何人。"\n\n说完，他快步离开了教室，背影看起来像是落荒而逃。\n\n你再次看向旧校舍的方向，这一次，你看到了林晓雨。她站在走廊的尽头，背对着你，长发在微风中飘动。她似乎在对谁说话，但你听不到声音。\n\n然后，她缓缓转过头，对你露出一个微笑。\n\n那个微笑让你确定了一件事——这所学校里，藏着某个可怕的秘密。`,
    choices: [
      { text: "走向林晓雨，直接问她知道些什么。", next: "p3", effects: { courage: 10 } },
      { text: "去旧校舍查看，你无法忍受这种被蒙在鼓里的感觉。", next: "p3_old", effects: { courage: 15 } },
      { text: "先去图书馆查资料，了解清楚再做决定。", next: "p3_library", effects: { insight: 10 } }
    ]
  },
  "p3": {
    text: `下课后的走廊熙熙攘攘，但你和林晓雨所在的角落仿佛被隔绝在另一个世界。\n\n"你为什么要告诉我这些？"你直视着她的眼睛，"你口中的'五年前'，到底发生了什么？"\n\n林晓雨沉默了很长时间。阳光透过窗户照在她脸上，你注意到她的皮肤苍白得近乎透明，连下面的血管都清晰可见。\n\n"因为..."她终于开口，声音轻得像是在自言自语，"你是第一个，让我想要相信的人。"\n\n她从口袋里掏出一样东西——是一张照片。照片上是一对年轻的男女，穿着这所学校的校服，站在樱花树下笑得灿烂。\n\n"这是..."\n\n"五年前的我。"林晓雨的手指轻轻抚过照片，"和...我最重要的人。"\n\n你注意到她说"最重要的人"时，声音微微颤抖，眼眶中有什么东西在闪烁。\n\n"然后呢？"\n\n"然后..."她抬起头，那双漆黑的眼睛里第一次出现了波澜，"他在满月之夜，从这栋楼的楼顶跳了下去。"\n\n走廊里的温度仿佛瞬间下降了几度。你感到一阵寒意从脊背升起。\n\n"而在此之前，"林晓雨的声音变得更加低沉，"他留下了一句话——'不要相信满月时的告白，那是诅咒的开始'。"\n\n她将照片翻过来，背面有一行已经褪色的字迹。你凑近看去，上面写着：\n\n"给晓雨：如果来世还能相遇，我一定会在满月之前，把心意告诉你。"\n\n字迹潦草，像是匆忙间写下的。而在最下方，有一个日期——正是五年前的今天。`,
    choices: [
      { text: "'所以...你一直在等他？'你感到心脏被什么东西揪紧了。", next: "p4", effects: { affection: 15 } },
      { text: "'诅咒？这是什么意思？'你注意到她话中的关键词。", next: "p4_curse", effects: { insight: 10 } },
      { text: "轻轻握住她的手，感受她指尖的冰凉。", next: "p4_touch", effects: { affection: 10, sanity: -5 } }
    ]
  },
  "p3_alt": {
    text: `你决定先不追问，但林晓雨的话一直在你脑海中回荡。\n\n整节课，你都在偷偷观察她。她始终看着窗外，仿佛在等待着什么。阳光照在她的侧脸上，勾勒出一个完美的轮廓，但也让她的苍白更加明显。\n\n下课铃终于响起。你收拾好书包，正准备离开，却发现林晓雨还坐在原地。她的目光依然停留在窗外，但这一次，你顺着她的视线看去——\n\n对面教学楼的楼顶，一个人影正站在那里。和早上看到的那个人影不同，这一次你看得更清楚——那是一个穿着校服的女生，长发及腰，背对着你们。\n\n"她...是谁？"你忍不住问道。\n\n林晓雨的身体微微一颤。她转过头看着你，眼神中闪过一丝惊讶，然后是一种复杂的情感——像是欣慰，又像是悲伤。\n\n"你也能看到她？"林晓雨的声音很轻，"其他人...都看不到。"\n\n"什么意思？"\n\n"那是晓月。"林晓雨低下头，"我的...妹妹。"\n\n你感到一阵寒意。如果那个人影是她的妹妹，那为什么会在楼顶？而且...为什么是"看不到"的？\n\n"五年前，"林晓雨继续说，"她从那里跳了下去。就在...他跳下去的三小时后。"\n\n她的声音开始颤抖："她说，她要去陪他。她说，她不能让他一个人走。"\n\n窗外的阳光突然暗了下来。一片乌云遮住了太阳，教室里瞬间变得昏暗。而在那片阴影中，你似乎看到楼顶的人影转过了头——\n\n那张脸，和林晓雨一模一样。`,
    choices: [
      { text: "'晓雨...你妹妹她...'你不知该说什么。", next: "p4", effects: { affection: 10 } },
      { text: "'为什么我能看到她？'你感到不安。", next: "p4_curse", effects: { insight: 15 } },
      { text: "握紧林晓雨的手，给她一些温暖。", next: "p4_touch", effects: { affection: 15 } }
    ]
  },
  "p3_insight": {
    text: `你仔细观察林晓雨的侧脸。她的五官精致得近乎完美，但那种完美中透着一种不真实感——就像是一幅精心绘制的画像，而不是活生生的人。\n\n你注意到几个细节：\n\n她的睫毛很长，但眨眼的频率比正常人慢很多，有时候甚至会十几秒钟不眨眼。\n\n她的皮肤苍白，但不是因为缺乏阳光——在阳光的照射下，她的皮肤几乎透明，你能看到下面青色的血管，但...看不到血液的流动。\n\n她的呼吸很轻，轻到几乎察觉不到。如果不是她偶尔会开口说话，你甚至会怀疑她是否在呼吸。\n\n最让你在意的是她的影子——在阳光的照射下，她的影子比正常人要淡很多，而且...影子的轮廓和她本人有些微妙的不同。那个影子的嘴角，似乎挂着一丝诡异的微笑。\n\n"你在看什么？"林晓雨突然转过头，把你吓了一跳。\n\n"没...没什么。"你慌忙移开视线。\n\n她盯着你看了几秒，然后轻轻叹了口气："你看到了，对不对？"\n\n"看到什么？"\n\n"我的...不同。"她的声音变得飘渺，"其他人看不到，或者说，他们看到了但选择遗忘。但你...你不一样。"\n\n她站起身，走到窗边，背对着你："今晚，旧校舍后面。如果你想知道真相，就来吧。但记住，一旦你知道了，就再也回不去了。"\n\n说完，她走出了教室，留下你一个人坐在原地，心跳如鼓。`,
    choices: [
      { text: "决定今晚一定要去，无论真相是什么。", next: "p4", effects: { courage: 15 } },
      { text: "虽然害怕，但你的好奇心战胜了恐惧。", next: "p4_curse", effects: { insight: 10 } },
      { text: "先去找那个戴眼镜的男生，他似乎也知情。", next: "p3_chen", effects: { insight: 10 } }
    ]
  },
  "p3_chen": {
    text: `你在走廊尽头拦住了那个戴眼镜的男生。\n\n"你刚才的话，是什么意思？"\n\n他左右看了看，压低声音："这里不方便说话。午休时，来旧校舍后面。"\n\n"旧校舍？不是禁止靠近吗？"\n\n"正因为禁止，才安全。"他的眼神闪烁，"而且...有些真相，只有在被遗弃的地方才能找到。"\n\n他匆匆离开，留下你一个人站在原地。你注意到他的手在颤抖，不是因为恐惧，而是因为...兴奋？\n\n午休时间，你准时来到旧校舍后面。这里杂草丛生，墙壁上爬满了藤蔓，窗户玻璃大多已经破碎，像是一只只空洞的眼睛注视着你。\n\n那个男生已经在等你了。他靠在墙上，手里夹着一支烟——虽然他还穿着校服，但那支烟让他看起来比实际年龄成熟许多。\n\n"我叫陈默，"他吐出一口烟圈，"算是这所学校里，少数还活着的知情者之一。"\n\n"还活着？"\n\n"五年前的那个班，现在还在上学的，只剩下我和林晓雨了。"陈默的眼神变得深邃，"其他人...有的转学了，有的...死了。"\n\n你感到一阵寒意："死了？"\n\n"意外坠楼、突发心脏病、溺水..."陈默一字一句地说，"表面上都是意外。但所有死者都有一个共同点——他们在死前一个月，都开始了恋爱。"\n\n他掐灭烟头，直视你的眼睛："欢迎来到'被诅咒的学园'，转学生。在这里，恋爱即是死亡的开始。`,
    choices: [
      { text: "'这不可能，一定是巧合。'你试图用理性解释这一切。", next: "p4_rational", effects: { sanity: 10 } },
      { text: "'林晓雨...她也恋爱过吗？'你想起她手中的照片。", next: "p4_lin_chen", effects: { insight: 15 } },
      { text: "'你为什么告诉我这些？'你警惕地看着他。", next: "p4_why", effects: { insight: 10 } }
    ]
  },
  "p3_library": {
    text: `学校图书馆比想象中要大，但人很少。午后的阳光透过高大的窗户洒进来，在地板上投下斑驳的光影。\n\n你在地方新闻的档案区找到了关于这所学校的报道。大多数是普通的校园活动报道，但在五年前的部分，你发现了几篇不同寻常的新闻。\n\n"樱花高中学生坠楼身亡，疑似情感纠纷"——标题下是一张模糊的照片，虽然打了马赛克，但你还是认出了那栋楼的轮廓。就是你现在所在的这栋教学楼。\n\n继续翻阅，更多令人不安的报道浮出水面：\n\n"樱花高中再发意外，高二女生溺亡于学校泳池"\n"樱花高中情侣双双失踪，一周后男生遗体在河边发现"\n"樱花高中又一名学生猝死，校方称与学业压力有关"\n\n所有的报道都集中在五年前的那个学期。然后，就像被切断了一样，再也没有类似的"意外"发生。\n\n你翻到最后一页，发现有人用铅笔在空白处写了一行小字：\n\n"诅咒不是传说，是人为。找到'她'，才能结束一切。"\n\n字迹很新，像是最近才写上去的。你正想仔细查看，突然感觉背后有人。\n\n"找到什么有趣的东西了吗？"\n\n你猛地回头，林晓雨正站在你身后，脸上带着那个意味深长的微笑。`,
    choices: [
      { text: "把报纸递给她，问她知道些什么。", next: "p4_library", effects: { courage: 10 } },
      { text: "合上报刊，假装什么都没看到。", next: "p4_hide", effects: { sanity: -5 } },
      { text: "问她：'你说的她，是谁？'", next: "p4_she", effects: { insight: 15 } }
    ]
  },
  "p3_roof": {
    text: `天台上空无一人，只有秋风卷起落叶，发出沙沙的声响。\n\n你走到栏杆边，俯瞰整个校园。从这个角度，你能看到旧校舍的全貌——那栋废弃的建筑像是一只蛰伏的巨兽，静静地卧在校园的角落。\n\n突然，你听到了脚步声。你转身，看到陈默正从楼梯口走来。\n\n"我就知道你会来这里。"他说，"每个转学生都会在天台上思考人生。"\n\n"你跟踪我？"\n\n"不是跟踪，是观察。"他走到你身边，同样看向旧校舍，"你知道那栋楼里有什么吗？"\n\n"什么？"\n\n"秘密。"他转过头，眼神中闪过一丝复杂，"关于这所学校的，关于林晓雨的，关于...我的。"\n\n他深吸一口气："五年前，我的哥哥死在那栋楼里。官方说法是意外坠楼，但我知道不是。"\n\n"你怎么知道？"\n\n"因为..."他的声音变得低沉，"因为我看到了。我看到林晓雨走进那栋楼，然后...然后我听到了尖叫声。"\n\n你感到一阵寒意："你是说...林晓雨杀了你哥哥？"\n\n"不，不是她。"陈默摇头，"但她知道真相。她知道是谁，知道为什么，知道...如何阻止下一次。"\n\n他看向你，眼神中带着一丝恳求："你是转学生，你和这一切都没有关系。但也许...也许你能做到我们做不到的事。"\n\n"什么事？"\n\n"接近她。"陈默说，"让她说出真相。让她...解脱。`,
    choices: [
      { text: "'为什么是我？'你感到疑惑。", next: "p4_why", effects: { insight: 10 } },
      { text: "'你说的解脱是什么意思？'", next: "p4_curse", effects: { insight: 15 } },
      { text: "'我答应你，我会找出真相。'", next: "p4", effects: { courage: 10 } }
    ]
  },
  "p3_old": {
    text: `旧校舍的大门上挂着锈迹斑斑的铁链，但铁链的一端已经断裂，像是谁强行闯入过。\n\n你推开大门，一股霉味扑面而来。走廊里光线昏暗，只有从破碎窗户透进来的几缕阳光。\n\n你小心翼翼地向前走，每一步都激起一阵灰尘。墙壁上的油漆已经剥落，露出下面发黄的墙面。偶尔能看到一些旧海报，但画面已经模糊，只能辨认出是校园活动的宣传。\n\n走到二楼时，你听到了声音——像是有人在低声哭泣。声音从走廊尽头传来，断断续续，让人毛骨悚然。\n\n你循着声音走去，最后停在一扇紧闭的门前。门上贴着一张褪色的封条，上面写着"禁止入内"。但封条已经被撕开了一半，门缝下透出微弱的光线。\n\n你深吸一口气，推开了门。\n\n房间里是一间教室，但所有的桌椅都被推到了墙边，中间空出一大片区域。在那片区域的正中央，画着一个巨大的红色图案——那是一个圆，圆内画着各种看不懂的符号，圆心处放着一张照片。\n\n你走近一看，血液几乎凝固。\n\n照片上的人...是你。\n\n不，不是你，是一个和你长得一模一样的人。但照片的背景是五年前的校园，照片下面写着一行字：\n\n"下一个。"\n\n"你看到了。"\n\n一个声音从身后传来。你猛地转身，林晓雨正站在门口，脸上没有任何表情。\n\n"这是...什么意思？"你的声音在颤抖。\n\n"意思是，"她走进房间，关上门，"你已经被选中了。"\n\n"选中？选中什么？"\n\n"诅咒的...下一个目标。`,
    bloody: true,
    choices: [
      { text: "'什么诅咒？你在说什么？'你后退一步。", next: "p4_curse", effects: { sanity: -10 } },
      { text: "'为什么是我？我什么都没做！'", next: "p4_why", effects: { sanity: -5 } },
      { text: "强迫自己冷静下来，问她：'你知道怎么阻止吗？'", next: "p4", effects: { courage: 15 } }
    ]
  },
  // --- 汇合场景 ---
  "p4": {
    text: `林晓雨低下头，长发遮住了她的表情。你看到她纤细的肩膀在微微颤抖。\n\n"等？"她轻声重复这个字，像是在品味其中的苦涩，"也许吧。但更多的是...愧疚。"\n\n她抬起头，眼眶微红："如果那天，我没有接受他的告白...如果我没有在满月那天约他去天台...如果我能早一点发现他的异常..."\n\n她的声音哽咽了。你第一次看到这个神秘女孩脆弱的一面。\n\n"那不是你的错。"你轻声说。\n\n"不，你不明白。"林晓雨突然抓住你的手，力道大得让你吃惊，"那天晚上，他本来不想去的。是我...是我逼他去的。我说，如果他不来，就永远不要再见面。"\n\n她的指甲陷入你的皮肤，但你没有挣脱。\n\n"然后他就...就从那里..."她的声音越来越小，最后变成了无声的啜泣。\n\n走廊里人来人往，但没有人看向这个角落。仿佛你们被隔离在另一个世界。\n\n过了很久，林晓雨才平静下来。她松开你的手，整理了一下情绪，重新变回了那个冷静神秘的女孩。\n\n"对不起，失态了。"她站起身，"忘了我说的这些话吧。对你没好处。"\n\n她转身要走，你...`,
    choices: [
      { text: "拉住她的手腕：'等等，我想帮你。'", next: "p5_help", effects: { affection: 15 } },
      { text: "'那个诅咒，到底是什么？请告诉我。'", next: "p5_curse", effects: { insight: 10 } },
      { text: "默默看着她离开，但暗暗下定决心要查清真相。", next: "p5_watch", effects: { insight: 10 } }
    ]
  },
  "p4_curse": {
    text: `林晓雨的表情变得复杂。她看了看四周，压低声音：\n\n"五年前的那个学期，这所学校里发生了七起'意外'。所有死者都是正在恋爱的学生，而且..."\n\n她停顿了一下，似乎在犹豫要不要继续说。\n\n"而且什么？"\n\n"而且他们的恋人，都活了下来。"她的声音变得冰冷，"就像是被精心挑选的幸存者。"\n\n你感到一阵寒意："你是说...有人在专门针对恋爱中的学生？"\n\n"不只是针对。"林晓雨的眼神变得深邃，"是在'收集'。每死一个人，学校旧校舍的某面墙上，就会出现一个新的名字。用血写的名字。"\n\n走廊里的灯光突然闪烁了一下。你注意到林晓雨说这话时，表情异常平静，仿佛在讲述一个与自己无关的故事。\n\n"你去过旧校舍？"\n\n"去过一次。"她抬起手，你注意到她的手腕上有一道淡淡的疤痕，"那是我这辈子最后悔的决定。"\n\n她放下手，重新看向你："所以，转学生，如果你珍惜自己的生命，就不要接近任何人。不要恋爱，不要在满月之夜外出，更不要..."\n\n她的话没有说完。因为就在这时，你们听到了一声尖叫——从旧校舍的方向传来。`,
    choices: [
      { text: "'我们去看看！'你朝旧校舍的方向跑去。", next: "p5_run", effects: { courage: 15 } },
      { text: "拉住林晓雨：'别去，太危险了。'", next: "p5_stop", effects: { affection: 10 } },
      { text: "仔细观察林晓雨听到尖叫时的反应。", next: "p5_observe", effects: { insight: 15 } }
    ]
  },
  "p4_touch": {
    text: `你轻轻握住她的手。她的手指冰凉，像是刚从冰箱里拿出来一样，但那种冰凉中透着一种奇怪的柔软——不像活人的手，更像是一尊精致的瓷偶。\n\n林晓雨明显愣了一下。她低头看着你们交握的手，眼神中闪过一丝惊讶，然后是一种复杂的情感。\n\n"你...不怕吗？"她轻声问。\n\n"怕什么？"\n\n"怕我啊。"她苦笑了一下，"我的手这么凉，正常人都会害怕的吧。"\n\n"你不是正常人，"你说，"但我也不是。至少...我不想是。"\n\n林晓雨盯着你看了一会儿，然后轻轻抽回了手。但她的表情柔和了许多，那种一直笼罩在她身上的冰冷气息似乎也消散了一些。\n\n"你真奇怪，"她说，"和其他人都不一样。"\n\n"其他人？"\n\n"以前也有转学生，"她转过身，看向窗外，"他们也试图接近我，试图了解我。但最后...他们都离开了。有的转学，有的..."\n\n她没有说完，但你明白了她的意思。\n\n"我不会离开，"你说，"至少...不会不辞而别。"\n\n林晓雨没有回答，但你知道她听到了。因为在那片阳光中，你似乎看到她的嘴角微微上扬——那是一个真正的微笑，不是之前那种意味深长的、让人不安的微笑。\n\n"今晚，"她突然说，"如果你真的有勇气，就来旧校舍后面。我会告诉你一切。但记住..."\n\n她转过头，那双漆黑的眼睛直视着你："一旦你知道了真相，就再也回不去了。`,
    choices: [
      { text: "'我会来的。'你坚定地说。", next: "p5_help", effects: { courage: 10 } },
      { text: "'无论真相是什么，我都能承受。'", next: "p5_curse", effects: { courage: 15 } },
      { text: "'为什么选我？'你忍不住问道。", next: "p5_why", effects: { insight: 10 } }
    ]
  },
  "p4_rational": {
    text: `陈默看着你，眼神中闪过一丝失望，但很快又恢复了平静。\n\n"我就知道你会这么说。"他苦笑了一下，"每个转学生一开始都不相信。直到...他们亲眼看到。"\n\n"看到什么？"\n\n陈默沉默了一会儿，然后从口袋里掏出手机，翻找了一会儿，递给你。\n\n屏幕上是一张照片——旧校舍的墙壁，上面密密麻麻地写满了名字。每个名字都用红色的颜料写成，在闪光灯的照射下像是真正的血液。\n\n"这是..."\n\n"过去十年里，所有因'意外'而死的学生名字。"陈默的声音变得低沉，"我花了五年时间收集这些资料。每一个名字背后，都是一个破碎的家庭，一段被斩断的人生。"\n\n你放大照片，仔细看那些名字。有些名字你很熟悉——在图书馆的报纸上看到过。有些名字你从未听过，但每个名字旁边都标注着日期，最早的可以追溯到十年前。\n\n"为什么...为什么没有人报警？"\n\n"报了。"陈默收回手机，"但每次调查都以'意外'结案。没有他杀证据，没有嫌疑人，没有动机。只有...一个接一个的死亡。"\n\n他深吸一口气："直到五年前，最后一个死者...我的哥哥。他的死让我明白了一件事——这不是普通的意外，这是诅咒。而诅咒的源头..."\n\n他看向旧校舍的方向："就在那栋楼里。`,
    choices: [
      { text: "'那你知道诅咒的源头是什么吗？'", next: "p5_curse", effects: { insight: 15 } },
      { text: "'你哥哥...是怎么死的？'", next: "p5_brother", effects: { sanity: -5 } },
      { text: "'我需要亲眼看看。'你说。", next: "p5_help", effects: { courage: 10 } }
    ]
  },
  "p4_lin_chen": {
    text: `陈默的表情变得复杂。他低下头，沉默了很久。\n\n"林晓雨..."他终于开口，声音有些沙哑，"她和我哥哥...曾经在一起过。"\n\n你感到一阵惊讶："什么？"\n\n"那是五年前的事。我哥哥...陈言，是林晓雨的男朋友。"陈默的眼神变得遥远，"他们是青梅竹马，从小一起长大。所有人都以为他们会一直在一起，直到..."\n\n"直到什么？"\n\n"直到那个满月之夜。"陈默的声音变得低沉，"我哥哥从楼顶跳了下去。而林晓雨...她就在现场。"\n\n你感到一阵寒意："你是说...她推他下去的？"\n\n"不，不是她。"陈默摇头，"但她看到了。她看到了我哥哥跳下去的全过程，却没有阻止。"\n\n他抬起头，看着你："你知道最可怕的是什么吗？是我哥哥跳下去之前，回头看了一眼。他看的不是林晓雨，而是...我。"\n\n陈默的眼睛里闪烁着泪光："他在对我说'对不起'。但我不知道他为什么要道歉。直到后来...我在他的遗物中发现了一封信。"\n\n"信？"\n\n"一封写给林晓雨的信。信里说...他知道诅咒的存在，他知道自己的死是注定的。但他希望林晓雨能活下去，即使...即使要付出某种代价。"\n\n陈默看向你："我想知道，那个代价是什么。我想知道，为什么我哥哥死了，林晓雨却活了下来。而且...活成了现在这个样子。`,
    choices: [
      { text: "'你想让我帮你查清楚？'", next: "p5_help", effects: { insight: 10 } },
      { text: "'林晓雨现在...到底是什么？'", next: "p5_curse", effects: { insight: 15 } },
      { text: "'这太危险了，我不想卷入其中。'", next: "p5_fear", effects: { sanity: -10, courage: -5 } }
    ]
  },
  "p4_why": {
    text: `陈默沉默了很长时间。他靠在墙上，仰头看着天空，阳光照在他的眼镜片上，反射出刺眼的光芒。\n\n"为什么告诉你？"他重复着你的问题，然后苦笑了一下，"因为我已经等了五年，等一个像你这样的人出现。"\n\n"像我这样的人？"\n\n"一个没有被诅咒标记的人。"陈默转过头，直视你的眼睛，"你知道吗？每一个在这所学校里恋爱的人，身上都会出现一个标记。一个小小的、红色的印记，像是被指甲掐出来的。"\n\n他拉起袖子，露出手腕内侧——那里确实有一个淡淡的红色印记，形状像是一个心形，但被一条线从中划开。\n\n"这是..."\n\n"我的标记。"陈默放下袖子，"因为我曾经...喜欢过一个人。但那个人死了，就在我们交往的第三十天。"\n\n他的声音变得平静，但那种平静下面是深深的悲伤："从那以后，我再也没有恋爱过。我不敢。因为我知道，一旦开始，就意味着死亡。"\n\n"但林晓雨..."\n\n"林晓雨不一样。"陈默打断你，"她身上的标记和我的不同。她的标记...更古老，更强大。我怀疑，她和诅咒的源头有某种联系。"\n\n他看向你，眼神中带着一丝希望："你是转学生，你还没有被标记。也许...也许你能接近她，了解她，找到诅咒的弱点。"\n\n"然后？"\n\n"然后..."陈默深吸一口气，"然后结束这一切。`,
    choices: [
      { text: "'我答应你，我会尽力。'", next: "p5_help", effects: { courage: 10 } },
      { text: "'但如果我也被标记了呢？'", next: "p5_curse", effects: { sanity: -5 } },
      { text: "'我需要更多证据。'", next: "p5_watch", effects: { insight: 10 } }
    ]
  },
  "p4_library": {
    text: `林晓雨接过报纸，扫了一眼，然后轻轻叹了口气。\n\n"你查得很快。"她说，"比我想象的快。"\n\n"所以这些都是真的？那些'意外'..."\n\n"都是真的。"林晓雨把报纸放回书架，"但不是你想的那样。"\n\n她转向你，眼神中带着一丝疲惫："那些死者...他们不是被谋杀的。至少，不是被'人'谋杀的。"\n\n"什么意思？"\n\n林晓雨看了看四周，确认没有其他人后，压低声音："这所学校里...有某种东西。它会在满月之夜出现，寻找...猎物。"\n\n"猎物？"\n\n"恋爱中的人。"她的声音变得更低，"它似乎以爱情为食。每当有人陷入热恋，它就会出现，带走其中一个人的生命。"\n\n你感到一阵毛骨悚然："你是说...有鬼？"\n\n"我不知道它是什么。"林晓雨摇头，"但我知道它存在。因为...因为我亲眼看到过。"\n\n她的身体微微颤抖："五年前，那个满月之夜。我和陈言...我的男朋友，在天台上。我们本来只是想一起看月亮，但然后...然后它出现了。"\n\n"它？"\n\n"一个...影子。"林晓雨的声音在颤抖，"一个巨大的人形影子，从月亮里走出来。它没有脸，但我能感觉到它在笑。然后...然后它伸出手，陈言就..."\n\n她说不下去了，眼泪无声地滑落。`,
    choices: [
      { text: "轻轻抱住她，让她在你的肩膀上哭泣。", next: "p5_help", effects: { affection: 20 } },
      { text: "'那个影子...后来怎么样了？'", next: "p5_curse", effects: { insight: 15 } },
      { text: "'为什么它只带走一个人？'", next: "p5_why", effects: { insight: 10 } }
    ]
  },
  "p4_hide": {
    text: `你迅速合上报刊，但已经太晚了。林晓雨已经看到了你手中的报纸。\n\n她静静地看着你，脸上没有任何表情。那种沉默比任何质问都让你感到压力。\n\n"你...看到了。"这不是疑问句，而是陈述句。\n\n你不知该说什么，只能沉默。\n\n林晓雨走到你身边，从你手中拿过报纸，翻了翻，然后叹了口气。\n\n"既然你已经知道了，"她说，"那我也没必要隐瞒了。"\n\n她拉过一把椅子，坐在你身边。阳光透过窗户照在她脸上，让她的苍白更加明显。\n\n"五年前的那些'意外'...都是真的。"她说，"但不是你想的那样。没有人谋杀他们，至少...不是活人。"\n\n"什么意思？"\n\n林晓雨沉默了一会儿，然后从口袋里掏出一张照片。照片上是一个年轻的男生，笑容灿烂，眼神清澈。\n\n"这是陈言，"她说，"我的...前男友。五年前，他在满月之夜死了。官方说法是自杀，但我知道不是。"\n\n"为什么？"\n\n"因为..."她的声音变得低沉，"因为我在现场。我看到了一切。"\n\n她抬起头，那双漆黑的眼睛里闪烁着恐惧："我看到了'它'。那个从月亮里走出来的...东西。",`,
    choices: [
      { text: "'它...是什么？'", next: "p5_curse", effects: { insight: 15 } },
      { text: "'你当时为什么不报警？'", next: "p5_why", effects: { insight: 10 } },
      { text: "握住她的手，给她一些安慰。", next: "p5_help", effects: { affection: 15 } }
    ]
  },
  "p4_she": {
    text: `林晓雨愣了一下，然后露出了一个意味深长的微笑。\n\n"你很聪明。"她说，"比我想象的聪明。"\n\n她走到窗边，背对着你，阳光把她的轮廓勾勒得像是一幅剪影画。\n\n"'她'...指的是诅咒的源头。"她说，"一个百年前的怨灵。"\n\n"怨灵？"\n\n"是的。"林晓雨转过身，"这所学校的创始人之一，陈婉清。她在百年前被恋人抛弃，于是在满月之夜自杀，并留下了一个诅咒——让所有在这所学校里相爱的人，都不得善终。"\n\n你感到一阵眩晕："所以...那些'意外'..."\n\n"都是诅咒的结果。"林晓雨点头，"每隔十年，诅咒就会'苏醒'一次，寻找新的牺牲品。五年前...是上一次苏醒。而这一次..."\n\n她看向你，眼神中带着一丝恐惧："这一次，它提前了。"\n\n"提前？"\n\n"本来应该还有三年才到下一个周期。但最近...旧校舍里开始出现异常。墙壁上的名字在增加，夜晚能听到哭声，而且..."\n\n她停顿了一下："而且，有人看到了陈婉清的鬼魂。在旧校舍里，在月光下，在...镜子里。"\n\n你感到一阵寒意从脊背升起。这一切太超现实了，但看着林晓雨认真的表情，你又无法完全否定。\n\n"为什么告诉我这些？"你问。\n\n林晓雨看着你，眼神中闪过一丝复杂的情感："因为...你可能是唯一能阻止这一切的人。`,
    choices: [
      { text: "'我？为什么是我？'", next: "p5_why", effects: { insight: 10 } },
      { text: "'我怎么阻止？'", next: "p5_curse", effects: { insight: 15 } },
      { text: "'不管为什么，我会帮忙的。'", next: "p5_help", effects: { courage: 15 } }
    ]
  },
  // --- p5 场景 ---
  "p5_help": {
    text: `林晓雨停下脚步，但没有回头。\n\n"帮我？"她的声音里带着一丝嘲讽，"你知道你在说什么吗？上一个说这种话的人，已经..."\n\n她没有说完，但你明白了她的意思。\n\n"我知道。"你握紧她的手，"但我不能眼睁睁看着你一个人承受这些。"\n\n她终于转过身，那双漆黑的眼睛里闪烁着复杂的光芒。有感动，有怀疑，还有...恐惧。\n\n"你会后悔的。"她轻声说，"所有接近我的人，最后都会后悔。"\n\n"那就让我成为例外。"\n\n林晓雨盯着你的眼睛看了很久，久到让你以为时间停止了。最后，她轻轻叹了口气。\n\n"今晚，满月。旧校舍后面。"她快速地说，"如果你真的有勇气，就来吧。但记住，一旦踏入那个世界，就再也回不来了。"\n\n她挣脱你的手，快步离开。你注意到她的脚步有些慌乱，像是在逃离什么。\n\n但你没有注意到的是，在走廊的拐角处，一个身影正默默注视着这一切。当林晓雨离开后，那个身影也悄然消失，只留下一片飘落的樱花花瓣——尽管现在明明是九月。`,
    choices: [
      { text: "决定今晚准时赴约，无论等待你的是什么。", next: "c1_start", effects: { courage: 10 } },
      { text: "先做些准备，去图书馆查查旧校舍的资料。", next: "p5_prepare", effects: { insight: 10 } },
      { text: "跟踪那个神秘的身影，看看到底是谁在监视。", next: "p5_follow", effects: { insight: 15, sanity: -5 } }
    ]
  },
  "p5_curse": {
    text: `林晓雨沉默了很长时间。就在你以为她不会回答时，她开口了：\n\n"诅咒...是我给他带来的。"\n\n你愣住了："什么意思？"\n\n"五年前，我在旧校舍发现了一本日记。"她的声音变得飘渺，"日记里记载了一个仪式——只要在满月之夜，在天台上向月亮许愿，就能得到永恒的爱情。"\n\n她苦笑了一下："年轻又愚蠢的我，真的去做了。我许愿...让他永远爱我，永远不会离开我。"\n\n走廊里的温度仿佛又下降了几度。\n\n"然后呢？"\n\n"然后第二天，他就死了。"林晓雨的声音平静得可怕，"从那天起，我开始明白——那个仪式不是祝福，是诅咒。凡是在这所学校里开始恋爱的人，都会遭遇不幸。因为..."\n\n她凑近你的耳边，声音轻得像是在说一个秘密：\n\n"因为月亮记住了我的愿望。它会让所有恋人分离，用最彻底的方式。"\n\n你感到一阵眩晕。这太荒谬了，简直像是恐怖故事里的情节。但看着林晓雨认真的表情，你又无法完全否定。\n\n"所以你不让我接近你，是怕我也会..."\n\n"我已经害死了一个人。"林晓雨后退一步，"我不想再害死第二个。"\n\n她转身离开，这一次你没有阻拦。但你注意到，她的脚步比来时更加沉重，仿佛背负着整个世界的重量。`,
    choices: [
      { text: "追上去告诉她，你不相信这种迷信，你会证明自己的安全。", next: "c1_start", effects: { courage: 15 } },
      { text: "默默记在心里，决定私下调查那个'仪式'的真相。", next: "p5_investigate", effects: { insight: 15 } },
      { text: "感到恐惧，决定暂时远离林晓雨，观察情况再说。", next: "p5_fear", effects: { sanity: -10, courage: -5 } }
    ]
  },
  "p5_watch": {
    text: `你默默看着林晓雨离开，她的背影在走廊的尽头渐渐消失。但你注意到一个细节——她的脚步很轻，轻到几乎听不到声音，就像是在飘浮而不是在行走。\n\n你决定暗中调查这一切。首先，你需要更多关于五年前事件的资料。\n\n放学后，你再次来到图书馆。这一次，你不只是看报纸，而是开始查找学校的档案。在管理员的帮助下，你找到了五年前的学生名册。\n\n你翻看着名册，找到了林晓雨和陈言的名字。但让你惊讶的是，名册上还有一个名字——林晓月，林晓雨的妹妹。\n\n根据记录，林晓月比林晓雨小一岁，是同年级的学生。但在五年前的名册上，她的名字被用红笔圈了起来，旁边写着两个字："已故"。\n\n你继续查找，发现了一件更奇怪的事——林晓月的死亡日期，正是陈言死后的第三天。官方记录是"意外坠楼"，但地点不是教学楼，而是...旧校舍。\n\n旧校舍。又是旧校舍。\n\n你合上名册，心中充满了疑问。林晓月为什么会死在旧校舍？她和陈言的死有什么关系？林晓雨说的"诅咒"，到底是真的还是她的幻觉？\n\n你决定...`,
    choices: [
      { text: "去旧校舍查看，寻找更多线索。", next: "p5_old", effects: { courage: 15 } },
      { text: "去找陈默，他应该知道更多。", next: "p5_chen", effects: { insight: 10 } },
      { text: "继续查资料，看看还有什么是你不知道的。", next: "p5_investigate", effects: { insight: 15 } }
    ]
  },
  "p5_run": {
    text: `你朝旧校舍的方向跑去，林晓雨在身后喊了什么，但你没有听清。\n\n旧校舍的大门敞开着，像是一张等待吞噬的大嘴。你冲进去，走廊里一片昏暗，只有从破碎窗户透进来的月光。\n\n"有人吗？"你喊道，声音在空旷的走廊里回荡。\n\n没有回应。但你听到了声音——从楼上传来的，像是有人在拖动什么重物。\n\n你跑上楼梯，每一步都激起一阵灰尘。二楼的走廊尽头，一扇门半开着，微弱的光线从门缝里透出来。\n\n你推开门，看到了...\n\n一个女生。她背对着你，长发及腰，穿着白色的连衣裙。她正蹲在地上，用红色的颜料在墙上写着什么。\n\n"你...你是谁？"你的声音在颤抖。\n\n女生停下了动作。她缓缓转过头——\n\n那张脸...和林晓雨一模一样。\n\n但不对。虽然长得很像，但有一些微妙的不同。这个女生的眼睛更圆一些，嘴角有一颗小痣，而且...她的眼神更加纯真，更加... alive。\n\n"你是...林晓月？"你脱口而出。\n\n女生歪着头，看着你，然后露出了一个微笑。那个微笑很温暖，和林晓雨那种意味深长的微笑完全不同。\n\n"你能看到我？"她问，声音清脆悦耳，"太好了...终于有人能看到我了。"`,
    bloody: true,
    choices: [
      { text: "'你...你不是死了吗？'你后退一步。", next: "p5_ghost", effects: { sanity: -15 } },
      { text: "'你在这里做什么？'你强迫自己冷静。", next: "p5_ghost_talk", effects: { courage: 10 } },
      { text: "'林晓雨...她知道你在这里吗？'", next: "p5_ghost_sister", effects: { insight: 15 } }
    ]
  },
  "p5_stop": {
    text: `你拉住林晓雨的手腕，她的皮肤冰凉而光滑，像是一块温润的玉石。\n\n"别去，"你说，"太危险了。"\n\n林晓雨看着你，眼神中闪过一丝惊讶，然后是一种复杂的情感。\n\n"你...在担心我？"\n\n"当然。"你说，"不管发生什么，我不想看到你受伤。"\n\n林晓雨沉默了很长时间。走廊里的灯光照在她脸上，让她的表情显得格外柔和。\n\n"你知道吗，"她终于开口，"你是第一个...不是为了好奇，不是为了利用，而是真心担心我的人。"\n\n她轻轻挣脱你的手，但没有离开。\n\n"那个尖叫声..."她说，"可能是又一个受害者。但如果我现在去...可能也来不及了。"\n\n"那怎么办？"\n\n"等。"林晓雨说，"等到满月之夜。那是诅咒最强大的时候，也是...唯一能看到真相的时候。"\n\n她看向你："你愿意等到那时吗？和我一起？"\n\n你看着她漆黑的眼睛，点了点头。\n\n"好。"林晓雨露出了一个淡淡的微笑，"那在那之前...让我告诉你更多关于诅咒的事。",`,
    choices: [
      { text: "'我听着。'你认真地说。", next: "p5_curse_detail", effects: { insight: 10 } },
      { text: "'但在此之前，我想知道更多关于你的事。'", next: "p5_lin_story", effects: { affection: 15 } },
      { text: "'陈默...他也知道这些吗？'", next: "p5_chen_know", effects: { insight: 10 } }
    ]
  },
  "p5_observe": {
    text: `你仔细观察林晓雨听到尖叫时的反应。\n\n她的第一反应不是恐惧，而是...悲伤。那种悲伤深入骨髓，像是听到了一个早已预料到的坏消息。\n\n然后，她的表情变成了决绝。她咬紧嘴唇，握紧了拳头，像是在做一个艰难的决定。\n\n最后，她看向你，眼神中带着一丝歉意。\n\n"对不起，"她说，"我本想保护你的。但看来...已经来不及了。"\n\n"什么意思？"\n\n"诅咒已经开始了。"林晓雨的声音变得低沉，"那个尖叫声...意味着新的牺牲品已经出现。"\n\n"谁？"\n\n"我不知道。"她摇头，"但很快就会知道了。诅咒不会隐藏太久，它喜欢...展示。"\n\n她深吸一口气："从现在起，你必须小心。不要单独行动，不要在夜晚外出，最重要的是..."\n\n她看着你，眼神异常认真："不要对任何人产生感情。一旦你开始喜欢某个人，诅咒就会找到你。"\n\n你感到一阵寒意："包括...你吗？"\n\n林晓雨愣了一下，然后露出了一个苦涩的微笑："尤其是我。",`,
    choices: [
      { text: "'但我已经...'你话到嘴边，又咽了回去。", next: "p5_confess", effects: { affection: 20 } },
      { text: "'我会小心的。'你说，但心里不以为然。", next: "p5_curse_detail", effects: { courage: 10 } },
      { text: "'那你自己呢？你不也有危险？'", next: "p5_lin_story", effects: { affection: 15 } }
    ]
  },

  "p5_prepare": {
    text: `你决定先做些准备。图书馆是最好的起点。\n\n你花了整个下午查阅关于旧校舍的资料。在学校的建筑档案中，你发现旧校舍原本是学校的第一栋建筑，建于1920年，比现在的教学楼早了整整八十年。\n\n更让你惊讶的是，旧校舍最初不是学校，而是一座...神社。\n\n"樱花神社"，档案里这样记载。供奉的是"姻缘之神"，据说能让恋人永结同心。但在百年前，神社发生了一场大火，住持和一位女学生在火中丧生。之后，神社被改建为学校。\n\n你继续翻阅，找到了更多细节。那位女学生的名字...是陈婉清。\n\n陈婉清。这个名字让你想起了什么。对了，陈默也姓陈。\n\n你继续查找，发现陈婉清是樱花高中创始人陈家的后代。而现在的陈默...也是陈家的后代。\n\n这一切似乎都不是巧合。\n\n你合上档案，心中充满了疑问。陈婉清的死和现在的诅咒有什么关系？为什么神社会变成学校？林晓雨说的"仪式"，和这座神社有什么关系？\n\n夜幕降临，满月升起。你看了看时间——23:30。距离和林晓雨约定的时间还有半小时。\n\n你决定...`,
    choices: [
      { text: "准时赴约，把查到的资料告诉她。", next: "c1_start", effects: { insight: 10 } },
      { text: "先去旧校舍探查一下，看看能不能找到更多线索。", next: "p5_old", effects: { courage: 15 } },
      { text: "去找陈默，告诉他你的发现。", next: "p5_chen", effects: { insight: 10 } }
    ]
  },
  "p5_follow": {
    text: `你悄悄跟在林晓雨身后，保持着安全的距离。\n\n她没有回教室，而是走向了旧校舍的方向。你心中一惊，但还是继续跟着。\n\n旧校舍的大门在她面前自动打开——你没有看错，那扇锈迹斑斑的铁门，在她靠近时无声地滑开，像是在迎接主人。\n\n你等了一会儿，然后跟了进去。走廊里一片昏暗，但你隐约能看到林晓雨的身影在前方飘动——是的，飘动。她的脚步没有着地，而是在离地面几厘米的地方滑行。\n\n你强忍着恐惧，继续跟随。她上了二楼，走进了一间教室。你躲在门外，透过门缝往里看。\n\n教室里点着红色的蜡烛，墙壁上贴满了照片。林晓雨站在房间中央，对着空气说话。\n\n"我知道你在。"她说，"出来吧。"\n\n你心中一惊，以为她发现了你。但然后，你看到了——\n\n从墙壁的阴影中，走出了一个人影。那是一个穿着旧式校服的女生，长发及腰，面容...和林晓雨一模一样。\n\n"姐姐，"那个女生说，"你带他来了吗？"\n\n"还没有。"林晓雨说，"但他...和传说中一样。他能看到我们。"\n\n"那就好。"那个女生微笑，"终于...终于可以结束了。"\n\n你捂住嘴，不敢发出任何声音。那个女生...是林晓月？她的鬼魂？\n\n而且，她们说的"他"...是你？`,
    bloody: true,
    choices: [
      { text: "继续偷听，看看她们还会说什么。", next: "p5_eavesdrop", effects: { insight: 20 } },
      { text: "推开门，直接质问她们。", next: "p5_confront", effects: { courage: 20 } },
      { text: "悄悄离开，这一切太危险了。", next: "p5_escape", effects: { sanity: -15 } }
    ]
  },
  "p5_investigate": {
    text: `你决定私下调查。首先，你需要找到那本日记——林晓雨提到的、记载着仪式的日记。\n\n你来到旧校舍，白天这里比夜晚稍微不那么阴森，但依然让人不安。你小心翼翼地搜索每一个房间，终于在地下室的角落里发现了一个上锁的木箱。\n\n箱子上积满了灰尘，但锁是新的。你试着用力一拉，锁竟然开了——像是有人 recently 打开过。\n\n箱子里放着一本皮革封面的日记本。翻开第一页，你看到了一行娟秀的字迹：\n\n"樱花神社仪式手册——愿天下有情人终成眷属。"\n\n你继续翻阅，发现这是一本记载着各种"姻缘仪式"的手册。大多数仪式看起来无害——比如在樱花树下许愿、在满月之夜写下恋人的名字等等。\n\n但翻到最后一页时，你的手停住了。\n\n那一页的标题是："永恒之爱的代价"。\n\n"以施术者之生命为祭，换取爱人之永生。愿以吾血，染红明月，愿以吾魂，守护挚爱。"\n\n下面还有一行小字："此仪式一旦启动，无法停止。施术者将化为'守门人'，永世不得超生。"\n\n守门人。这个词让你想起了林晓雨说的...她已经成为守门人。\n\n你继续翻阅，发现日记的最后几页被撕掉了。但在撕痕处，你发现了几个模糊的字迹：\n\n"破解之法...真爱之吻...愿..."\n\n后面的内容已经看不清了。`,
    choices: [
      { text: "把日记带走，继续研究。", next: "p5_diary", effects: { insight: 20 } },
      { text: "去找林晓雨，质问她这一切。", next: "p5_confront_lin", effects: { courage: 15 } },
      { text: "去找陈默，他应该知道更多关于陈家的事。", next: "p5_chen", effects: { insight: 10 } }
    ]
  },
  "p5_fear": {
    text: `你感到恐惧。这一切太超现实了，太危险了。你只是一个普通的转学生，为什么要卷入这种恐怖的事情？\n\n你决定远离林晓雨，远离旧校舍，远离这一切。\n\n但当你转身准备离开时，你听到了一个声音——从身后传来，轻得像是一声叹息。\n\n"你...也要离开我吗？"\n\n你猛地转身，林晓雨正站在你身后。但不对...这不是刚才的林晓雨。这个林晓雨更加苍白，眼睛更加漆黑，而且...她的脚没有着地。\n\n"你...你是谁？"你的声音在颤抖。\n\n"我是林晓雨。"她说，"但也不是。我是她留下的一部分...她的执念，她的悔恨，她的...孤独。"\n\n她向你飘来，你后退，但背后是一堵墙。\n\n"五年来，"她说，"我一直在等。等一个能看到我的人，等一个愿意听我说话的人，等一个...不会离开我的人。"\n\n她的手伸向你的脸，冰凉的手指触碰到你的皮肤。\n\n"但你也要走了。"她的声音变得悲伤，"就像其他人一样。"\n\n你感到一阵眩晕，意识开始模糊。在失去意识之前，你听到了她的最后一句话：\n\n"那么...你就永远留下来陪我吧。",`,
    bloody: true,
    choices: [
      { text: "挣扎着保持清醒：'不...我不会离开...'", next: "p5_stay", effects: { sanity: -20 } },
      { text: "用尽全力推开她，逃跑。", next: "p5_escape_ghost", effects: { courage: 20, health: -30 } },
      { text: "'告诉我真相，我会帮你的！'", next: "p5_truth", effects: { insight: 15 } }
    ]
  },
  "p5_brother": {
    text: `陈默的表情变得痛苦。他低下头，双手紧握成拳。\n\n"我哥哥...陈言..."他的声音在颤抖，"他是被诅咒杀死的。但不是因为恋爱...而是因为他发现了真相。"\n\n"什么真相？"\n\n"关于守门人的真相。"陈默抬起头，眼睛里闪烁着泪光，"他发现...守门人不是诅咒的受害者，而是诅咒的维持者。没有守门人，诅咒就会消失。"\n\n你感到一阵寒意："你是说...林晓雨在维持诅咒？"\n\n"不，不是她自愿的。"陈默摇头，"但她确实在维持诅咒。因为她进行了那个仪式，她成为了守门人。只要她存在，诅咒就会继续。"\n\n"那怎么办？"\n\n"只有一个办法。"陈默的声音变得低沉，"让守门人...解脱。"\n\n"解脱？"\n\n"就是..."陈默看着你，眼神中带着一丝痛苦，"让她彻底消失。不是死亡，而是...超度。让她放下执念，放下悔恨，放下...爱。"\n\n你沉默了。让林晓雨放下爱？这怎么可能？她的所有痛苦，所有执念，都源于她对陈言的爱。\n\n"还有其他办法吗？"你问。\n\n陈默沉默了一会儿，然后说："也许有。但那个办法...更难。"\n\n"什么办法？"\n\n"找到诅咒的源头。"陈默说，"找到陈婉清的怨灵，化解她的怨恨。只有这样，才能彻底结束诅咒。",`,
    choices: [
      { text: "'那我们去找到她的怨灵。'", next: "p5_ghost_hunt", effects: { courage: 15 } },
      { text: "'怎么化解她的怨恨？'", next: "p5_ghost_solution", effects: { insight: 15 } },
      { text: "'这太危险了，我需要考虑。'", next: "p5_think", effects: { sanity: -5 } }
    ]
  },
  "p5_old": {
    text: `你再次来到旧校舍，这一次是白天，但楼里依然阴森。\n\n你直接走向二楼的那间教室——上次看到红色图案的房间。门依然半开着，你推开门，发现里面的图案还在，但颜色更加鲜艳了，像是刚被重新画过。\n\n你走近图案，仔细观察。圆内的符号看起来像是某种古老的文字，你一个字也看不懂。但圆心处的照片...变了。\n\n上次是一张和你长得一样的人的照片，但这次...是两张照片。一张是你，另一张是...林晓雨。\n\n两张照片被一颗心形图案包围，但心形被一把刀从中刺穿。\n\n你感到一阵寒意。这是什么意思？你和林晓雨...会被诅咒？\n\n"你看到了。"\n\n一个声音从身后传来。你转身，看到陈默站在门口。\n\n"这是...什么意思？"你问。\n\n"意思是，"陈默走进房间，"诅咒已经选中你们了。"\n\n"我们？"\n\n"你和林晓雨。"陈默看着图案，"诅咒似乎...对你们很感兴趣。也许是因为你的特殊，也许是因为...你们之间的某种联系。"\n\n"什么联系？我才认识她几天。"\n\n陈默转过头，看着你，眼神中带着一丝复杂："你真的...只是才认识她吗？"\n\n"什么意思？"\n\n"没什么。"陈默摇头，"但请记住，诅咒不会无缘无故选中一个人。它选中你，一定有它的理由。",`,
    bloody: true,
    choices: [
      { text: "'什么理由？'", next: "p5_reason", effects: { insight: 15 } },
      { text: "'我不管它什么理由，我要阻止它。'", next: "p5_stop_curse", effects: { courage: 15 } },
      { text: "'陈默，你是不是知道什么？'", next: "p5_chen_secret", effects: { insight: 10 } }
    ]
  },
  "p5_chen": {
    text: `你找到陈默，把你在图书馆的发现告诉了他。\n\n陈默听完后，沉默了很长时间。\n\n"樱花神社..."他终于开口，"我知道这个地方。陈家...就是神社的后裔。"\n\n"什么？"\n\n"陈婉清...是我的曾祖母。"陈默说，"她是神社的最后一位巫女。据说，她爱上了一个不该爱的人，然后...发生了悲剧。"\n\n"什么悲剧？"\n\n"那个男子...已经有了婚约。"陈默的声音变得低沉，"陈婉清知道后，悲痛欲绝。在一个月圆之夜，她在神社里举行了禁忌的仪式，然后...放火焚烧了神社。"\n\n"她自杀了？"\n\n"不完全是。"陈默摇头，"仪式让她变成了...某种存在。不是活人，也不是普通的鬼魂。她成为了'诅咒本身'。"\n\n你感到一阵眩晕："所以...现在的诅咒，就是陈婉清？"\n\n"是她的怨念。"陈默纠正道，"她的怨念化为了诅咒，附着在这所学校里。每隔十年，怨念就会苏醒，寻找新的...牺牲品。"\n\n"那为什么是恋爱中的人？"\n\n陈默苦笑了一下："因为她恨爱情。她恨那个背叛她的男人，恨所有幸福的情侣。所以...她要让所有人都体验她的痛苦。"\n\n这一切开始有了一些逻辑。但你知道，要结束诅咒，还需要更多信息。`,
    choices: [
      { text: "'那怎么化解她的怨念？'", next: "p5_solution", effects: { insight: 15 } },
      { text: "'你哥哥...也是被她杀死的？'", next: "p5_brother_death", effects: { sanity: -10 } },
      { text: "'林晓雨和陈婉清有什么关系？'", next: "p5_lin_connection", effects: { insight: 15 } }
    ]
  },
  "p5_ghost": {
    text: `林晓月——如果那真的是她——歪着头，看着你的恐惧表情，然后笑了。\n\n"死了？"她重复着你的话，"嗯，算是吧。但也不算完全死了。"\n\n她站起身，拍了拍裙子上的灰尘。她的动作很自然，就像一个普通的女生。但你知道，她不是普通的女生——她的身体半透明，在月光下能看到身后的墙壁。\n\n"我变成了...守门人的助手。"她说，"姐姐是守门人，我是她的助手。我们一起...维持诅咒的运转。"\n\n"为什么？"你问，"为什么要维持诅咒？"\n\n林晓月的表情变得悲伤："因为如果不维持，姐姐就会消失。守门人的存在依赖于诅咒。诅咒消失，守门人也会消失。"\n\n她看向你："我不想让姐姐消失。即使...即使这意味着更多人会死。"\n\n你感到一阵寒意。这个看起来纯真的女生，竟然能如此平静地说出这种话。\n\n"但姐姐不一样。"林晓月继续说，"她一直在痛苦。她不想维持诅咒，但她没有选择。"\n\n"为什么？"\n\n"因为..."林晓月看着你，眼神中带着一丝期待，"因为她还在等。等一个能解开诅咒的人。等一个...愿意为她牺牲的人。"\n\n她向你走近一步："而你...可能就是那个人。`,
    bloody: true,
    choices: [
      { text: "'我？我能做什么？'", next: "p5_hero", effects: { courage: 15 } },
      { text: "'牺牲？什么意思？'", next: "p5_sacrifice", effects: { insight: 15 } },
      { text: "'为什么是我？'", next: "p5_chosen", effects: { insight: 10 } }
    ]
  },
  "p5_ghost_talk": {
    text: `你强迫自己冷静下来。不管她是什么，她看起来并没有恶意。\n\n"你在这里做什么？"你问。\n\n林晓月看了看墙上的红色颜料，然后笑了："画画啊。姐姐让我在这里画'邀请函'。"\n\n"邀请函？"\n\n"给诅咒的下一个目标的邀请函。"她说，语气轻松得像是谈论天气，"每次诅咒要选人时，都需要一个仪式。这个图案...就是仪式的一部分。"\n\n你看着那个巨大的红色圆环，感到一阵恶心："所以...这个图案是为了..."\n\n"为了标记下一个牺牲品。"林晓月点头，"但这一次，有点不同。"\n\n"不同？"\n\n林晓月走近你，仰起头看着你。她的眼睛和林晓雨一样漆黑，但更加清澈，更加... alive。\n\n"这一次，"她说，"图案里有两个人。你...和姐姐。"\n\n你心中一惊："什么意思？"\n\n"意思是，"林晓月微笑，"诅咒选中你们两个了。但不是为了杀死你们...而是为了考验你们。"\n\n"考验？"\n\n"诅咒想要知道..."林晓月的声音变得飘渺，"你们的爱，是否足够强大，能够打破百年的怨恨。",`,
    bloody: true,
    choices: [
      { text: "'爱？我和林晓雨才认识几天。'", next: "p5_love", effects: { insight: 10 } },
      { text: "'如果通过考验，诅咒会结束吗？'", next: "p5_test", effects: { insight: 15 } },
      { text: "'如果失败呢？'", next: "p5_fail", effects: { sanity: -10 } }
    ]
  },
  "p5_ghost_sister": {
    text: `林晓月的表情变得复杂。她低下头，沉默了一会儿。\n\n"姐姐...她知道我在这里。"她终于说，"但她假装不知道。"\n\n"为什么？"\n\n"因为愧疚。"林晓月抬起头，眼睛里闪烁着泪光，"姐姐觉得是她害死了我。她觉得...如果当初她没有进行那个仪式，我就不会死。"\n\n"你不是自杀的吗？"\n\n"是的。"林晓月点头，"但姐姐觉得，她给了我错误的希望。她告诉我，仪式可以保护我爱的人。但结果...仪式只保护了她，没有保护我。"\n\n她苦笑了一下："其实我并不怪她。我是自愿的。我知道仪式的风险，但我愿意承担。因为...我也爱过一个人。"\n\n"谁？"\n\n林晓月的脸微微泛红——即使作为鬼魂，她依然能脸红："陈言。"\n\n你感到一阵震惊："陈言？林晓雨的男朋友？"\n\n"是的。"林晓月低下头，"我知道我不该爱上姐姐的男朋友。但感情这种事...不是自己能控制的。"\n\n她抬起头，看着你："所以，当我知道诅咒选中了他时，我决定代替他。我用自己作为祭品，希望诅咒能放过他。但..."\n\n她的声音变得悲伤："但诅咒还是带走了他。因为...姐姐也进行了仪式。两个仪式冲突，结果...我们都失去了爱的人。"`,
    choices: [
      { text: "'所以你们姐妹...都爱着同一个人？'", next: "p5_sisters", effects: { insight: 15 } },
      { text: "'那陈默呢？他知道这些吗？'", next: "p5_chen_know", effects: { insight: 10 } },
      { text: "'这一切...太悲哀了。'", next: "p5_sad", effects: { affection: 15 } }
    ]
  },
  "p5_sisters": {
    text: `林晓月苦笑了一下："是的...我们都爱着陈言。"\n\n"但姐姐比我更早认识他。"她说，"他们是青梅竹马，从小一起长大。而我...只是偶尔会遇到他。"\n\n"他...知道你们姐妹都爱他吗？"\n\n"知道。"林晓月点头，"但他选择了姐姐。他说...他从小就喜欢姐姐。"\n\n她的声音变得飘渺："但我不怪他。感情这种事...本来就不能强求。"\n\n她看着你："所以，当你出现时，姐姐才会那么惊讶。因为你...和陈言长得很像。"\n\n"什么意思？"\n\n"不只是长相。"林晓月说，"你的眼神，你的气质...都和陈言很像。也许...这就是为什么姐姐会对你产生感情。"\n\n你沉默了。原来如此...林晓雨对你特别，是因为你让她想起了陈言？\n\n"但姐姐...已经不再是五年前的姐姐了。"林晓月继续说，"这五年的痛苦，让她改变了很多。她不再是从前那个温柔的姐姐了。"\n\n她看着你，眼神中带着一丝期待："但你...也许能让她重新找回自己。"\n\n"我？怎么做？"\n\n"用你的爱。"林晓月微笑，"就像陈言曾经对姐姐做的那样。"\n\n你感到一阵复杂的情感。原来...你只是一个替代品？\n\n"不。"林晓月似乎看穿了你的心思，"你不是替代品。你是...新的开始。"\n\n她的身影开始变得透明："时间...不多了。满月之夜，诅咒会苏醒。你必须...做出选择。"\n\n"什么选择？"\n\n"是拯救姐姐...还是放弃她。"林晓月的声音越来越远，"记住...真正的爱，不是占有，而是...祝福。"\n\n她的身影完全消失了，只留下你一个人站在月光下。`,
    choices: [
      { text: "去找林晓雨，告诉她你知道了真相。", next: "c1_start", effects: { courage: 15, affection: 10 } },
      { text: "去找陈默，问他更多关于陈言的事。", next: "p5_chen_help", effects: { insight: 15 } }
    ]
  },
  "p5_sad": {
    text: `你感到一阵心酸。这一切...太悲哀了。\n\n两姐妹，都爱上了同一个人。而那个人...最终选择了姐姐。妹妹为了成全他们，选择了牺牲。但诅咒...还是带走了所有人。\n\n"你知道吗？"林晓月轻声说，"其实陈言...也知道我的感情。"\n\n"什么？"\n\n"在姐姐向他告白之前，"林晓月的声音变得飘渺，"他曾经对我说过...他喜欢我。"\n\n你感到一阵震惊："什么？但他后来选择了你姐姐..."\n\n"因为...姐姐先告白了。"林晓月苦笑，"而且...姐姐说，如果我不退出，她就..."\n\n她的声音变得悲伤："姐姐说，如果我不退出，她就从楼顶跳下去。"\n\n你感到一阵寒意："所以...陈言是为了救姐姐，才选择和她在一起的？"\n\n"是的。"林晓月点头，"但他...从来没有忘记过我。五年来，他一直在痛苦中。他爱姐姐，但也爱我。他不知道该..."\n\n她的声音开始颤抖："所以，当诅咒选中他时，他...选择了接受。因为他...已经不知道该怎么活下去了。"\n\n你沉默了。原来...陈言的死，不是因为诅咒，而是因为他自己的选择？\n\n"姐姐...一直不知道这些。"林晓月说，"她以为...陈言是真心爱她的。她不知道...陈言的痛苦。"\n\n"所以...你能告诉她吗？"\n\n林晓月摇头："我...已经死了。我无法和她沟通。只有...活人才能做到。"\n\n她看着你："你...愿意告诉她吗？"\n\n你深吸一口气："我愿意。"\n\n林晓月露出了一个释然的微笑："谢谢你...也许...这样姐姐才能...真正解脱。"\n\n她的身影开始发光，那光芒温暖而柔和。\n\n"满月之夜..."她的声音越来越远，"记住...真正的爱...不是占有...而是...祝福..."\n\n她的身影完全消失了。`,
    choices: [
      { text: "去找林晓雨，告诉她真相。", next: "c1_start", effects: { courage: 20, affection: 15 } },
      { text: "先去找陈默，确认一下林晓月说的话。", next: "p5_chen_help", effects: { insight: 15 } }
    ]
  },
  "p5_victim": {
    text: `林晓雨的表情变得复杂。她沉默了很长时间，然后轻轻叹了口气。\n\n"不...不是让你成为牺牲品。"她说，"我是想...让你成为...打破诅咒的人。"\n\n"打破诅咒？"\n\n"是的。"林晓雨看着你，眼神中带着一丝希望，"百年前，陈婉清留下了一个预言。她说，百年后，会有一个'异乡人'来到这所学校。这个异乡人...将决定诅咒的命运。"\n\n"异乡人...是指我？"\n\n"你是转学生，来自外地。"林晓雨点头，"而且...你身上有一种特殊的气息。一种...不属于这个世界的气息。"\n\n你感到一阵困惑："我不明白。"\n\n"我也不完全明白。"林晓雨承认，"但我知道，你的出现...是诅咒的转折点。要么，诅咒会被你终结。要么...你会成为诅咒的一部分。"\n\n她看着你，眼神中带着一丝担忧："所以，你必须做出选择。是继续...还是离开。"\n\n"如果离开呢？"\n\n"你会安全。"林晓雨说，"但诅咒会继续，更多的人会死。"\n\n"如果继续呢？"\n\n"你可能会死。"她说，"但也可能...终结这一切。"\n\n你沉默了。这是一个艰难的选择...`,
    choices: [
      { text: "'我愿意试试。'你坚定地说。", next: "p5_solution", effects: { courage: 20 } },
      { text: "'我需要更多信息才能做决定。'", next: "p5_chen_help", effects: { insight: 15 } },
      { text: "'让我再想想。'", next: "p5_help_real", effects: { insight: 10 } }
    ]
  },
  "p5_sister_know": {
    text: `林晓雨的表情变得复杂。她沉默了很长时间，然后轻轻叹了口气。\n\n"晓月...知道一切。"她说，"她...一直在我身边。"\n\n"什么？"\n\n"是的。"林晓雨点头，"五年前，她死后，她的灵魂...一直没有离开。她...成为了守门人的助手。"\n\n你感到一阵寒意："所以...她一直在看着你？"\n\n"是的。"林晓雨的声音变得低沉，"她...一直在帮我维持诅咒。"\n\n"为什么？"\n\n"因为...如果诅咒消失，我也会消失。"林晓雨说，"守门人的存在依赖于诅咒。诅咒消失，守门人也会消失。"\n\n她看着你，眼神中带着一丝痛苦："晓月...不想让我消失。所以...她帮我维持诅咒。即使...这意味着更多人会死。"\n\n你沉默了。原来...林晓月也是这一切的一部分？\n\n"但...她最近开始改变了。"林晓雨继续说，"她...开始质疑这一切。她说...这样下去不是办法。"\n\n"她...想让你解脱？"\n\n"是的。"林晓雨点头，"她说...她不想再看到更多人死了。她说...她想让这一切结束。"\n\n她看着你，眼神中带着一丝希望："也许...你是她等的人。也许...你能让这一切结束。"\n\n"我？怎么做？"\n\n"在满月之夜..."林晓雨说，"诅咒的核心会出现在旧校舍。你需要...面对陈婉清的怨灵。然后...用你的爱，去感化她。"\n\n你深吸一口气："我明白了。"\n\n"但...这很危险。"林晓雨警告，"如果失败了...我们都会死。"\n\n你看着她，坚定地说："我愿意试试。"\n\n林晓雨的眼泪无声地滑落。她紧紧握住你的手："那...我们一起。不管结果如何。"`,
    choices: [

  "p5_try": {
    text: `你深吸一口气："那我们去试试。"\n\n林晓雨看着你，眼神中闪过一丝惊讶："你...愿意？"\n\n"是的。"你说，"不管多难，我都愿意试试。"\n\n林晓雨沉默了很长时间。然后，她轻轻叹了口气："你...真是个傻瓜。"\n\n"也许吧。"你微笑，"但傻瓜也有傻瓜的坚持。"\n\n林晓雨看着你，眼神中闪过一丝复杂的情感。然后，她轻轻握住了你的手。\n\n"好。"她说，"那我们就一起...面对这一切。"\n\n月光透过窗户洒在你们身上，像是祝福，又像是...某种预兆。\n\n"但首先..."林晓雨说，"我们需要找到陈婉清的怨灵。她...会在满月之夜出现。"\n\n"在哪里？"\n\n"旧校舍。"林晓雨说，"那是诅咒的核心所在。只有在那里，我们才能...面对她。"\n\n你点了点头："那今晚就去。"\n\n林晓雨看着你，眼神中带着一丝担忧："你...确定吗？一旦踏入那里，就再也回不来了。"\n\n你坚定地说："我确定。"\n\n林晓雨露出了一个淡淡的微笑："那...我们一起。"\n\n她握紧了你的手，你们一起走向旧校舍的方向。`,
    choices: [
      { text: "和林晓雨一起前往旧校舍。", next: "c1_start", effects: { courage: 20, affection: 15 } },
      { text: "再做一些准备。", next: "p5_chen_help", effects: { insight: 10 } }
    ]

  "p5_how": {
    text: `林晓雨沉默了很长时间。然后，她轻轻叹了口气。\n\n"怎么让她感受到爱..."她重复着你的问题，"这是一个很难回答的问题。"\n\n她看向远方，眼神变得飘渺："陈婉清...等了一百年。她等的是一个...能理解她痛苦的人。"\n\n"理解她的痛苦？"\n\n"是的。"林晓雨点头，"她被爱人抛弃，那种痛苦...深入骨髓。她...无法释怀。"\n\n"那怎么让她释怀？"\n\n"让她知道..."林晓雨说，"那个男人...其实也一直爱着她。"\n\n"什么？"\n\n"是的。"林晓雨从口袋里掏出一张旧照片，"这是我在旧校舍找到的。百年前的照片。"\n\n你接过照片，看到上面是一对年轻的男女。女生穿着旧式的和服，男生穿着学生服。他们站在樱花树下，笑得灿烂。\n\n"这是...陈婉清和那个男人？"\n\n"是的。"林晓雨点头，"他的名字叫...沈墨。"\n\n你看着照片，发现照片背面有一行字："婉清吾爱，身不由己，负你深情。若有来世，愿为草木，长伴你左右。"\n\n"这是..."\n\n"沈墨留给陈婉清的话。"林晓雨说，"他...是被迫离开她的。家族的压力，让他...无法选择自己的爱情。"\n\n你感到一阵心酸："所以...陈婉清一直不知道？"\n\n"是的。"林晓雨点头，"她以为...沈墨抛弃了她。但实际上...沈墨一直爱着她。"\n\n"那...怎么让她知道？"\n\n"在满月之夜..."林晓雨说，"诅咒的核心会出现在旧校舍。我们需要去那里，面对陈婉清的怨灵。然后...把这张照片给她看。"\n\n你看着照片，看着那行字。也许...这就是化解诅咒的关键？\n\n"但这...够吗？"你问。\n\n"不够。"林晓雨摇头，"还需要...我们的爱。需要让她看到，真正的爱是什么样的。"\n\n你沉默了。这意味着...你们需要在陈婉清面前...展示真爱？\n\n"但这...怎么做？"\n\n"用你的行动。"林晓雨看着你，"用你对我的爱，去证明给她看。"\n\n你感到一阵心跳加速。这...意味着什么？\n\n林晓雨的脸微微泛红："我...我不知道。但...也许...我们需要..."\n\n她没有说完，但你明白了她的意思。`,
    choices: [
      { text: "'我明白了。那我们今晚就去。'", next: "c1_start", effects: { courage: 20, affection: 20 } },
      { text: "'我们需要更多准备。'", next: "p5_chen_help", effects: { insight: 15 } }
    ]
  },
  "p5_concrete": {
    text: `林晓雨想了想，然后说："具体的办法...有一个。"\n\n"什么办法？"\n\n"在旧校舍的地下室..."林晓雨说，"有一个祭坛。那是百年前陈婉清举行仪式的地方。"\n\n"祭坛？"\n\n"是的。"林晓雨点头，"那里...还保留着仪式的痕迹。如果我们能在那里...重新举行一个仪式，也许...能化解诅咒。"\n\n"什么仪式？"\n\n"一个...关于爱的仪式。"林晓雨的脸微微泛红，"需要两个人...真心相爱的人。在满月之夜，在祭坛前...交换誓言。"\n\n你感到一阵心跳加速："交换...誓言？"\n\n"是的。"林晓雨低下头，"就像...婚礼一样。"\n\n你沉默了。这意味着...你们需要...在陈婉清面前...结婚？\n\n"但...这只是传说。"林晓雨说，"我不知道...是否真的有效。"\n\n"但...值得一试。"你说。\n\n林晓雨看着你，眼神中闪过一丝感动："你...真的愿意为我做到这个地步？"\n\n"是的。"你握住她的手，"因为我爱你。不是因为你要求我这样做，而是...因为我真心愿意。"\n\n林晓雨的眼泪无声地滑落。她紧紧握住你的手："那...我们一起。不管结果如何。"\n\n月光透过窗户洒在你们身上，像是祝福，又像是...某种预兆。`,

  "p5_eavesdrop": {
    text: `你继续躲在门外，屏住呼吸，仔细听着里面的对话。\n\n"姐姐，"林晓月的声音变得严肃，"你...真的决定了吗？"\n\n"什么？"\n\n"让他...成为下一个牺牲品。"\n\n你感到一阵寒意。她们在讨论...你？\n\n林晓雨沉默了很长时间。然后，她轻轻叹了口气："我...不想。但他...可能是唯一能结束这一切的人。"\n\n"结束...诅咒？"\n\n"是的。"林晓雨说，"百年前，陈婉清留下了一个预言。她说，百年后，会有一个'异乡人'来到这所学校。这个异乡人...将决定诅咒的命运。"\n\n"异乡人...是指他？"\n\n"是的。"林晓雨点头，"他是转学生，来自外地。而且...他身上有一种特殊的气息。一种...不属于这个世界的气息。"\n\n你感到一阵困惑。不属于这个世界？什么意思？\n\n"但...如果他失败了怎么办？"林晓月问。\n\n"那...他就会死。"林晓雨的声音变得低沉，"就像...陈言一样。"\n\n你感到一阵恐惧。原来...你可能是下一个牺牲品？\n\n"姐姐...你...你喜欢上他了吗？"林晓月突然问。\n\n林晓雨沉默了很长时间。然后，她轻声说："也许...是的。"\n\n"那...你忍心让他去死吗？"\n\n"我...不知道。"林晓雨的声音在颤抖，"我...不想让他死。但我...也不想让诅咒继续。"\n\n她叹了口气："也许...这就是命运吧。"\n\n你听到脚步声，知道她们要出来了。你赶紧悄悄离开，心中充满了复杂的情感。`,

  "p5_confront": {
    text: `你深吸一口气，推开门走了进去。\n\n"你们在说什么？"你直视着林晓雨和林晓月，"什么'他'？什么'终于要结束了'？"\n\n林晓雨和林晓月同时看向你，脸上露出了惊讶的表情。\n\n"你...听到了？"林晓雨的声音有些颤抖。\n\n"听到了。"你说，"你们在讨论我，对吗？"\n\n林晓月看了看姐姐，然后转向你："是的。我们在讨论你。"\n\n"讨论什么？"\n\n"讨论...你的命运。"林晓月说，"你是...被选中的人。"\n\n"被选中？选中什么？"\n\n"打破诅咒。"林晓雨说，"百年前，陈婉清留下了一个预言。她说，百年后，会有一个'异乡人'来到这所学校。这个异乡人...将决定诅咒的命运。"\n\n"异乡人...是指我？"\n\n"是的。"林晓雨点头，"你是转学生，来自外地。而且...你身上有一种特殊的气息。"\n\n你感到一阵困惑："什么气息？"\n\n"一种...不属于这个世界的气息。"林晓雨说，"也许...你是被命运选中的。"\n\n你沉默了。这一切...太突然了。\n\n"所以..."你说，"你们在决定...我的命运？"\n\n"不。"林晓雨摇头，"我们在决定...我们自己的命运。因为...你的选择，将决定我们的命运。"\n\n她看着你，眼神中带着一丝恳求："你...愿意帮我们吗？"\n\n你看着她，看着林晓月，然后深吸一口气："我需要...知道所有的真相。"\n\n林晓雨和林晓月对视一眼，然后点了点头。`,

  "p5_confront_lin": {
    text: `你找到林晓雨，把日记放在她面前。\n\n"这是什么？"你问。\n\n林晓雨看到日记，脸色瞬间变得惨白。"你...在哪里找到的？"\n\n"旧校舍的地下室。"你说，"告诉我真相。"\n\n林晓雨沉默了很长时间。然后，她轻轻叹了口气："好吧...我告诉你。"\n\n她讲述了五年前的故事：她发现了一本日记，里面记载着一个仪式。她以为...这个仪式可以保护陈言。但她错了...仪式让她成为了守门人，而陈言...还是死了。\n\n"我...害死了他。"林晓雨的声音在颤抖，"我以为...我可以保护他。但实际上...我害死了他。"\n\n你感到一阵心酸。原来...林晓雨也是受害者？\n\n"那...这个仪式..."你指着日记，"有破解之法吗？"\n\n林晓雨摇头："我不知道。日记的最后几页...被撕掉了。"\n\n"但这里写着...真爱...牺牲...祝福..."你说。\n\n林晓雨看着你，眼神中闪过一丝希望："也许...这就是破解的关键？"\n\n她看着你，眼神变得坚定："也许...你能帮我找到答案。"\n\n你看着她，点了点头："我愿意帮你。"\n\n林晓雨的眼泪无声地滑落。她紧紧握住你的手："谢谢你..."\n\n月光透过窗户洒在你们身上，像是祝福，又像是...某种预兆。`,

  "p5_stay": {
    text: `你挣扎着保持清醒："不...我不会离开..."\n\n林晓雨愣住了。她看着你，眼神中闪过一丝惊讶。\n\n"你...为什么不离开？"她问。\n\n"因为..."你的声音在颤抖，"因为...我在乎你。"\n\n林晓雨的眼泪无声地滑落。她轻轻放开你，后退一步。\n\n"你...真是个傻瓜。"她哽咽着说，"比陈言还傻。"\n\n"也许吧。"你微笑，"但傻瓜也有傻瓜的坚持。"\n\n林晓雨看着你，看了很久。然后，她轻轻靠在你的肩膀上，泪水浸湿了你的衣服。\n\n"谢谢你..."她轻声说，"谢谢你...没有离开我。"\n\n你紧紧抱住她，感受着她冰凉的身体。也许...这就是打破诅咒的关键？\n\n"晓雨..."你说，"我会帮你的。不管付出什么代价。"\n\n林晓雨抬起头，看着你，眼神中充满了感动："你...真的愿意？"\n\n"是的。"你坚定地说。\n\n林晓雨露出了一个释然的微笑："那...我们一起。不管结果如何。"\n\n月光透过窗户洒在你们身上，像是祝福，又像是...某种预兆。`,

  "p5_ghost_solution": {
    text: `陈默想了想，然后说："化解怨恨...也许...需要让她知道真相。"\n\n"真相？"\n\n"是的。"陈默说，"我曾祖母...以为那个男人抛弃了她。但实际上...那个男人也是一直爱着她的。"\n\n"什么？"\n\n"是的。"陈默从口袋里掏出一张旧照片，"这是我在家里找到的。百年前的照片。照片背面...有那个男人留下的话。"\n\n你接过照片，看到上面是一对年轻的男女。照片背面写着一行字："婉清吾爱，身不由己，负你深情。若有来世，愿为草木，长伴你左右。"\n\n"这是..."\n\n"那个男人...叫沈墨。"陈默说，"他...是被迫离开我曾祖母的。家族的压力，让他...无法选择自己的爱情。"\n\n你感到一阵心酸："所以...陈婉清一直不知道？"\n\n"是的。"陈默点头，"她以为...沈墨抛弃了她。但实际上...沈墨一直爱着她。"\n\n"那...怎么让她知道？"\n\n"在满月之夜..."陈默说，"诅咒的核心会出现在旧校舍。我们需要去那里，面对陈婉清的怨灵。然后...把这张照片给她看。"\n\n你看着照片，看着那行字。也许...这就是化解诅咒的关键？\n\n"但这...够吗？"你问。\n\n"不够。"陈默摇头，"还需要...我们的爱。需要让她看到，真正的爱是什么样的。"\n\n你沉默了。这意味着...你们需要在陈婉清面前...展示真爱？`,

    text: `你看着陈默，问道："你是不是知道什么？"\n\n陈默沉默了很长时间。然后，他轻轻叹了口气。\n\n"是的。"他说，"我知道...一些事情。"\n\n"什么事情？"\n\n陈默看了看四周，确认没有其他人后，压低声音说："我...也是诅咒的一部分。"\n\n"什么？"\n\n"是的。"陈默说，"我的曾祖母...是陈婉清。我是...她的后人。"\n\n你感到一阵震惊："什么？"\n\n"是的。"陈默说，"我的家族...背负着这个诅咒。我的哥哥...也是因为这个诅咒而死。"\n\n他看着你，眼神中充满了痛苦："我...一直在寻找破解诅咒的方法。但...我找不到。"\n\n"那...现在呢？"\n\n"现在..."陈默说，"也许...你能帮我。"\n\n他看着你，眼神中充满了希望："你...愿意帮我吗？"\n\n你看着他，点了点头："我愿意。"\n\n陈默露出了一个释然的微笑："谢谢你..."\n\n月光透过窗户洒在你们身上，像是祝福，又像是...某种预兆。`,

      { text: "再做一些准备。", next: "p5_solution", effects: { insight: 10 } }

  "p5_brother_death": {
    text: `陈默的表情变得痛苦。他低下头，双手紧握成拳。\n\n"我哥哥..."他的声音在颤抖，"他是被诅咒杀死的。"\n\n"怎么...死的？"\n\n"从楼顶跳了下去。"陈默的声音变得低沉，"在满月之夜...就像百年前的陈婉清一样。"\n\n你感到一阵寒意："所以...诅咒在重复自己？"\n\n"是的。"陈默点头，"每隔十年...诅咒就会苏醒，寻找新的牺牲品。五年前...是上一次苏醒。我哥哥...成为了牺牲品。"\n\n他看着你，眼神中充满了痛苦："我...一直在寻找破解诅咒的方法。但...我找不到。"\n\n"那...现在呢？"\n\n"现在..."陈默说，"也许...你能帮我。"\n\n他看着你，眼神中充满了希望："你...愿意帮我吗？"\n\n你看着他，点了点头："我愿意。"\n\n陈默露出了一个释然的微笑："谢谢你..."\n\n月光透过窗户洒在你们身上，像是祝福，又像是...某种预兆。`,

  "p5_lin_connection": {
    text: `你问："林晓雨和陈婉清有什么关系？"\n\n陈默想了想，然后说："也许...有一种联系。"\n\n"什么联系？"\n\n"林晓雨...也是守门人。"陈默说，"就像百年前的陈婉清一样。"\n\n"什么？"\n\n"是的。"陈默说，"五年前，林晓雨进行了一个仪式。她以为...这个仪式可以保护陈言。但实际上...仪式让她成为了新的守门人。"\n\n你感到一阵震惊："所以...林晓雨也是..."\n\n"是的。"陈默点头，"她...也是诅咒的一部分。但她...不想维持诅咒。她想...结束它。"\n\n"那...怎么结束？"\n\n"也许..."陈默说，"需要让陈婉清的怨灵...安息。"\n\n"怎么让她安息？"\n\n"让她知道...真相。"陈默说，"让她知道...那个男人其实也一直爱着她。"\n\n你沉默了。原来...这就是破解诅咒的关键？\n\n"但这...够吗？"你问。\n\n"不够。"陈默摇头，"还需要...我们的爱。需要让她看到，真正的爱是什么样的。"\n\n你沉默了。这意味着...你们需要在陈婉清面前...展示真爱？`,

  "p5_hero": {
    text: `你问："我？我能做什么？"\n\n林晓月看着你，眼神中充满了期待："你...可以拯救姐姐。"\n\n"拯救？"\n\n"是的。"林晓月说，"姐姐...一直在痛苦中。她...想解脱，但她做不到。"\n\n"为什么？"\n\n"因为...她是守门人。"林晓月说，"守门人的存在依赖于诅咒。诅咒消失，守门人也会消失。"\n\n你感到一阵寒意："所以...如果诅咒结束，林晓雨也会..."\n\n"是的。"林晓月点头，"姐姐...会消失。"\n\n你沉默了。这意味着...要结束诅咒，林晓雨就必须...死？\n\n"但...还有别的办法吗？"你问。\n\n林晓月想了想，然后说："也许...有。"\n\n"什么办法？"\n\n"如果...有人愿意代替姐姐...成为守门人。"林晓月说，"那...姐姐就可以解脱，而不用消失。"\n\n你感到一阵震惊："代替？什么意思？"\n\n"意思是..."林晓月看着你，"你...愿意成为新的守门人吗？"\n\n你沉默了。成为守门人...意味着永远被困在这里，维持诅咒的运转。这...比死还可怕。\n\n"我...需要考虑一下。"你说。\n\n林晓月点了点头："我理解。但...时间不多了。满月之夜...就快到了。"\n\n她的身影开始变得透明："你...会做出正确的选择的。"\n\n她的身影完全消失了，只留下你一个人站在月光下。`,

  "p5_sacrifice": {
    text: `你问："牺牲？什么意思？"\n\n林晓月看着你，眼神中充满了悲伤："牺牲...就是成为新的守门人。"\n\n"守门人？"\n\n"是的。"林晓月说，"守门人...是诅咒的维持者。没有守门人，诅咒就会消失。"\n\n你感到一阵寒意："所以...林晓雨是守门人？"\n\n"是的。"林晓月点头，"五年前，姐姐进行了一个仪式。她以为...这个仪式可以保护陈言。但实际上...仪式让她成为了新的守门人。"\n\n"那...怎么结束诅咒？"\n\n"只有一个办法。"林晓月说，"让守门人...解脱。"\n\n"解脱？"\n\n"就是..."林晓月的声音变得低沉，"让她彻底消失。不是死亡，而是...超度。让她放下执念，放下悔恨，放下...爱。"\n\n你沉默了。让林晓雨放下爱？这怎么可能？她的所有痛苦，所有执念，都源于她对陈言的爱。\n\n"还有其他办法吗？"你问。\n\n林晓月想了想，然后说："也许有。但...更难。"\n\n"什么办法？"\n\n"找到诅咒的源头。"林晓月说，"找到陈婉清的怨灵，化解她的怨恨。只有这样，才能彻底结束诅咒。"\n\n你深吸一口气："那...我去试试。"\n\n林晓月露出了一个释然的微笑："谢谢你..."\n\n她的身影开始变得透明："满月之夜...记住...真正的爱...不是占有...而是...祝福..."\n\n她的身影完全消失了，只留下你一个人站在月光下。`,

  "p5_love": {
    text: `你说："爱？我和林晓雨才认识几天。"\n\n林晓月微笑着说："爱...不需要时间。有时候...一瞬间就足够了。"\n\n你沉默了。也许...她说得对？\n\n"而且..."林晓月继续说，"姐姐...已经等了一百年。她...不想再等了。"\n\n"一百年？"\n\n"是的。"林晓月说，"百年前，陈婉清...也在等。等一个能理解她痛苦的人。但...她等了一百年，还是没有等到。"\n\n她看着你，眼神中充满了期待："但...你出现了。也许...你就是她等的人。"\n\n你感到一阵困惑："我？但...我只是个普通的转学生。"\n\n"不。"林晓月摇头，"你不是普通人。你...有特殊的气息。一种...不属于这个世界的气息。"\n\n你沉默了。原来...你并不普通？\n\n"也许..."林晓月说，"你是被命运选中的。"\n\n你深吸一口气："我...愿意试试。"\n\n林晓月露出了一个释然的微笑："谢谢你..."\n\n她的身影开始变得透明："满月之夜...记住...真正的爱...不是占有...而是...祝福..."\n\n她的身影完全消失了，只留下你一个人站在月光下。`,

  "p5_test": {
    text: `你问："如果通过考验，诅咒会结束吗？"\n\n林晓月点了点头："是的。如果...你们的爱足够强大，能够打破百年的怨恨。那...诅咒就会结束。"\n\n"那...考验是什么？"\n\n"考验..."林晓月想了想，"也许是...面对陈婉清的怨灵。也许是...做出牺牲。也许是...证明你们的爱是真实的。"\n\n她看着你，眼神中充满了期待："你...愿意接受考验吗？"\n\n你深吸一口气："我愿意。"\n\n林晓月露出了一个释然的微笑："那...满月之夜...我们在旧校舍等你。"\n\n她的身影开始变得透明："记住...真正的爱...不是占有...而是...祝福..."\n\n她的身影完全消失了，只留下你一个人站在月光下。`,

  "p5_fail": {
    text: `你问："如果失败呢？"\n\n林晓月的表情变得悲伤："如果失败...你们就会死。就像...陈言一样。"\n\n你感到一阵寒意："死？"\n\n"是的。"林晓月点头，"诅咒...不会手下留情。如果...你们的爱不够强大，如果...你们无法打动陈婉清的怨灵。那...你们就会成为诅咒的牺牲品。"\n\n你沉默了。这...是一个生死攸关的决定。\n\n"但..."林晓月说，"如果你们成功了...诅咒就会结束。所有人...都会得到解脱。"\n\n她看着你，眼神中充满了期待："你...愿意冒险吗？"\n\n你深吸一口气，思考着这个决定。这...关系到你的生命。\n\n"我...需要考虑一下。"你说。\n\n林晓月点了点头："我理解。但...时间不多了。满月之夜...就快到了。"\n\n她的身影开始变得透明："你...会做出正确的选择的。"\n\n她的身影完全消失了，只留下你一个人站在月光下。`,

  "p5_curse_detail": {
    text: `林晓雨带你来到学校后面的樱花树下。这里很安静，只有风吹过树叶的声音。\n\n"诅咒...始于百年前。"她开始讲述，"陈婉清，樱花神社的最后一位巫女，爱上了一个外来的书生。但那个书生...已经有了婚约。"\n\n"陈婉清知道后，悲痛欲绝。她在满月之夜举行了禁忌的仪式，用自己的生命作为代价，诅咒了所有在这所学校里相爱的人。"\n\n"但仪式出了差错。"林晓雨的声音变得低沉，"陈婉清的怨念太强了，强到她自己都无法控制。她变成了诅咒本身，永远徘徊在学校中。"\n\n"每隔十年，诅咒就会苏醒一次，寻找新的牺牲品。五年前...是上一次苏醒。陈言...我的男朋友...成为了牺牲品。"\n\n她的声音在颤抖："我试图阻止。我进行了另一个仪式，希望转移诅咒的目标。但...我失败了。诅咒带走了陈言，而我...成为了新的守门人。"\n\n"守门人的职责，"她继续说，"是维持诅咒的运转。我必须确保每隔十年，有新的牺牲品。否则...诅咒会反噬，杀死更多的人。"\n\n你感到一阵寒意："所以...你一直在..."\n\n"我一直在寻找替代品。"林晓雨低下头，"找到愿意牺牲的人，代替无辜的人。但这样的人...太少了。"\n\n她抬起头，看着你："直到你出现。",`,
    choices: [
      { text: "'我？你想让我成为牺牲品？'", next: "p5_victim", effects: { sanity: -15 } },
      { text: "'有办法解除诅咒吗？真正的办法。'", next: "p5_solution", effects: { insight: 15 } },
      { text: "'我愿意帮你，但不是以牺牲的方式。'", next: "p5_help_real", effects: { courage: 15 } }
    ]
  },
  "p5_lin_story": {
    text: `林晓雨沉默了很长时间。樱花花瓣飘落在她的头发上，让她看起来像是画中的人。\n\n"我的故事..."她终于开口，"很普通，又很悲哀。"\n\n"我和陈言是青梅竹马。从小一起长大，一起上学，一起...梦想未来。"\n\n她的声音变得柔和，像是在回忆美好的过去："他答应我，等我们毕业，就一起去东京上大学。然后...结婚，生子，白头偕老。"\n\n"但诅咒打破了这一切。"她的声音变得悲伤，"满月之夜，他在我面前...跳了下去。"\n\n"我试图抓住他，但我没有力气。我只能看着他的身体坠落，听着那声...可怕的声音。"\n\n她的眼泪无声地滑落："然后，我发现了晓月的尸体。她...她也跳了下去。就在陈言死后三天。"\n\n"我失去了爱人，失去了妹妹。在那一刻，我决定...我要阻止诅咒。不管付出什么代价。"\n\n"所以我进行了仪式。"她说，"成为守门人的仪式。我以为...我可以控制诅咒，保护其他人。但我错了。"\n\n"诅咒控制了我。"她的声音变得绝望，"我成为了它的奴隶，不得不为它寻找新的牺牲品。五年来...我一直活在地狱中。"\n\n她看向你，眼神中带着一丝希望："直到你出现。你让我想起了...陈言。不是长相，而是...你的眼神。那种愿意为别人牺牲的眼神。",`,
    choices: [
      { text: "'我不是陈言，但我愿意帮你。'", next: "p5_help_real", effects: { affection: 20 } },
      { text: "'告诉我怎么解除诅咒。'", next: "p5_solution", effects: { insight: 15 } },
      { text: "'你妹妹...她知道吗？'", next: "p5_sister_know", effects: { insight: 10 } }
    ]
  },
  "p5_chen_know": {
    text: `林晓雨苦笑了一下："陈默知道。他知道一切。"\n\n"为什么他不阻止？"\n\n"因为他不能。"林晓雨说，"陈家和诅咒有着千丝万缕的联系。陈默的曾祖母是陈婉清，他的哥哥是牺牲品。他...也是诅咒的一部分。"\n\n"什么意思？"\n\n"陈默身上也有标记。"林晓雨说，"但他选择不恋爱，所以诅咒无法对他下手。他一直在寻找解除诅咒的方法，但...他找不到。"\n\n"为什么找不到？"\n\n"因为解除诅咒的方法..."林晓雨看着你，眼神中带着一丝复杂，"需要一个人自愿牺牲。不是死亡，而是...永远成为诅咒的一部分。"\n\n"成为新的守门人？"\n\n"不，比那更糟。"林晓雨摇头，"需要一个人...用自己的爱，去化解陈婉清的怨念。"\n\n"怎么化解？"\n\n"让陈婉清...再次感受到爱。"林晓雨说，"真正的爱，不是占有，不是嫉妒，而是...放手。是祝福。是...愿意为了对方的幸福，牺牲自己的幸福。"\n\n她看着你："陈婉清之所以怨恨，是因为她被抛弃了。她从未体验过...真正的爱。如果有人能让她明白，爱不是占有，而是祝福...也许，她的怨念就会消散。"\n\n你沉默了。让一个百年怨灵明白爱的真谛？这听起来几乎不可能。`,
    choices: [
      { text: "'那我们去试试。'", next: "p5_try", effects: { courage: 20 } },
      { text: "'怎么让她感受到爱？'", next: "p5_how", effects: { insight: 15 } },

  "p5_confess": {
    text: `林晓雨看着你，眼神中闪过一丝惊讶，然后是一种复杂的情感。\n\n"你..."她的声音很轻，"你说什么？"\n\n你深吸一口气，决定坦白："我说...我已经喜欢上你了。"\n\n林晓雨愣住了。她的脸微微泛红——即使苍白如她，也能脸红。\n\n"你...你知道你在说什么吗？"她说，"喜欢上我...意味着诅咒会找上你。意味着...你可能会死。"\n\n"我知道。"你说，"但我不在乎。"\n\n你走近她，握住她的手："晓雨，这五年来，你一直在痛苦中。你一直在为别人牺牲，却从未有人为你牺牲过。"\n\n"现在，让我来。让我为你...做点什么。"\n\n林晓雨的眼泪无声地滑落。她试图挣脱你的手，但你握得更紧。\n\n"你...你真是傻瓜。"她哽咽着说，"比陈言还傻。"\n\n"也许吧。"你微笑，"但傻瓜也有傻瓜的坚持。"\n\n她看着你，看了很久。最后，她轻轻靠在你的肩膀上，泪水浸湿了你的衣服。\n\n"好。"她轻声说，"那我们就一起...面对诅咒。不管结果如何。"\n\n在樱花树下，你们相拥而立。月光透过树叶洒在你们身上，像是祝福，又像是...诅咒的注视。`,
    choices: [
      { text: "'我们一起，一定能找到办法的。'", next: "c1_start", effects: { affection: 25 } },
      { text: "'先告诉我，满月之夜会发生什么。'", next: "p5_fullmoon", effects: { insight: 15 } },
      { text: "'陈默...他会帮我们吗？'", next: "p5_chen_help", effects: { insight: 10 } }

  "p5_why": {
    text: `林晓雨沉默了很久，月光照在她的脸上，让她的表情显得格外悲伤。\n\n"为什么是你？"她重复着你的问题，"也许...是因为你是唯一一个没有被诅咒标记的人。"\n\n"标记？"\n\n"每个被诅咒选中的人，身上都会出现一个红色的印记。"林晓雨拉起袖子，露出手腕上一个心形被划开的印记，"像这样。"\n\n你检查了一下自己，确实没有任何印记。\n\n"但更重要的是..."林晓雨看着你，眼神中闪过一丝复杂，"你让我想起了他。"\n\n"陈言？"\n\n"不。"她摇头，"是更早之前的人。百年前的那个人。"\n\n你感到一阵困惑："什么意思？"\n\n"没什么。"林晓雨收回目光，"也许是我多想了。但...你确实很特别。"\n\n她转过身，背对着你："所以，也许你真的能改变什么。也许...你能帮我结束这一切。"\n\n"但代价是什么？"你问。\n\n林晓雨没有回答。她只是静静地看着远方的满月，月光在她的眼中闪烁，像是泪光，又像是...某种决意。`,
    choices: [
      { text: "'不管代价是什么，我愿意帮你。'", next: "p5_help_real", effects: { courage: 15 } },

      { text: "'也许...我们应该先去找陈默。'", next: "p5_chen_help", effects: { insight: 10 } }

  "p5_fullmoon": {
    text: `林晓雨的表情变得严肃："满月之夜...是诅咒最强大的时候。"\n\n"会发生什么？"\n\n"诅咒会苏醒。"她的声音变得低沉，"它会寻找新的牺牲品。而这一次...它可能会选中我们。"\n\n你感到一阵寒意："那我们怎么办？"\n\n"我们需要在旧校舍进行仪式。"林晓雨说，"那是诅咒的核心所在。只有在那里，我们才能...面对它。"\n\n"什么样的仪式？"\n\n"一个古老的仪式。"林晓雨从口袋里掏出一样东西——是一本泛黄的日记本，"这是我在旧校舍找到的。上面记载了仪式的方法。"\n\n你翻开日记本，看到上面用红色的墨水写着各种符号和咒语。大多数你看不懂，但有一页被特别标记了出来：\n\n"以血为媒，以心为祭，愿以吾爱，化解百年之怨。"\n\n"这是什么意思？"你问。\n\n"意思是..."林晓雨犹豫了一下，"需要用真爱来化解陈婉清的怨念。"\n\n"真爱？"\n\n"不是占有，不是嫉妒。"林晓雨看着你，"是...愿意为对方牺牲的爱。"\n\n你沉默了。这意味着什么？你们需要...相爱？\n\n"但不仅仅是相爱。"林晓雨继续说，"还需要面对诅咒的化身。在满月之夜，它会出现在旧校舍。我们需要...击败它。"\n\n"击败？怎么击败？"\n\n"用这个。"林晓雨从日记本的夹层中抽出一把古老的匕首，匕首的刀刃上刻着奇怪的符文，"这是唯一能伤害诅咒的东西。"\n\n你接过匕首，感受到一股奇怪的力量从刀刃传来。\n\n"但记住，"林晓雨严肃地说，"不到万不得已，不要用它。因为...使用它的代价，可能比我们想象的更大。"`,
    choices: [
      { text: "'我明白了。那我们今晚就去。'", next: "c1_start", effects: { courage: 20 } },

  "p5_chen_help": {
    text: `你找到陈默时，他正在天台上抽烟。看到你身边的林晓雨，他的表情变得复杂。\n\n"你们...在一起了？"他问，语气中带着一丝苦涩。\n\n"我们需要你的帮助。"你说，"关于诅咒，关于满月之夜。"\n\n陈默掐灭烟头，沉默了一会儿："我猜到了。晓雨，你告诉他了？"\n\n"全部。"林晓雨点头。\n\n陈默叹了口气："那你们应该知道，满月之夜会有多危险。"\n\n"我们知道。"你说，"但我们必须结束这一切。"\n\n"结束？"陈默苦笑，"你以为我没试过吗？五年前，我就试过。但...我失败了。"\n\n"发生了什么？"\n\n"我哥哥死了。"陈默的声音变得低沉，"我试图保护他，但我没能做到。诅咒...比我想象的更强大。"\n\n他看向林晓雨："而你，晓雨，你也有责任。如果不是你..."\n\n"我知道。"林晓雨低下头，"是我的错。"\n\n"现在不是追究责任的时候。"你打断他们，"我们需要合作。陈默，你知道什么？告诉我们。"\n\n陈默看着你，眼神中闪过一丝赞赏："你说得对。好吧..."\n\n他从口袋里掏出一张旧照片："这是我哥哥和陈婉清的合影。百年前，陈婉清爱上了一个不该爱的人。那个人...长得和你很像。"\n\n你感到一阵震惊："什么意思？"\n\n"意思是..."陈默看着你，"也许你不是偶然来到这里的。也许...你是被命运选中的。"\n\n"被命运选中？"\n\n"陈婉清一直在等待。"林晓雨轻声说，"等待一个能化解她怨念的人。而你...也许就是那个人。"\n\n你沉默了。这一切太突然了。但看着林晓雨和陈默的表情，你知道他们没有在开玩笑。\n\n"那...我该怎么做？"你问。\n\n"在满月之夜，"陈默说，"你需要面对陈婉清的怨灵。用你的爱，去化解她的怨恨。"\n\n"但记住，"林晓雨补充，"那不是普通的爱。是...愿意为对方牺牲的爱。"\n\n你深吸一口气："我明白了。"\n\n"那我们一起。"陈默伸出手，"这次，我不会再让任何人死去了。"\n\n你握住他的手，然后看向林晓雨。她也伸出手，你们三个人的手握在一起。\n\n"一起。"你说。`,
    choices: [
      { text: "今晚就去旧校舍，结束这一切。", next: "c1_start", effects: { courage: 20, affection: 10 } },
      { text: "再做一些准备，确保万无一失。", next: "p5_solution", effects: { insight: 15 } }
    ]
  },
  "p5_solution": {
    text: `林晓雨带你来到图书馆的档案室。这里堆满了旧文件和书籍，空气中弥漫着霉味。\n\n"我一直在研究诅咒的解法。"她从一个上锁的柜子里拿出一本古老的书籍，"这是百年前的记录。"\n\n你翻开书，看到上面记载着关于陈婉清的故事：\n\n"陈婉清，樱花神社的巫女，爱上了一个外来的书生。但书生已有婚约，婉清悲痛欲绝，在满月之夜举行禁忌仪式，以己身为祭，诅咒所有恋人。"\n\n"但仪式出了差错。"林晓雨继续说，"陈婉清的怨念太强，她变成了诅咒本身。每隔十年，诅咒就会苏醒，寻找新的牺牲品。"\n\n"那怎么化解？"\n\n"需要...真爱。"林晓雨的声音变得低沉，"不是占有，不是嫉妒。是愿意为对方牺牲的爱。只有这样的爱，才能化解她的怨恨。"\n\n"具体怎么做？"\n\n"在满月之夜，"林晓雨说，"诅咒的核心会出现在旧校舍。我们需要去那里，面对陈婉清的怨灵。然后...用你的爱，去感化她。"\n\n"但怎么做？"\n\n"用这个。"林晓雨拿出一把古老的匕首，"这是唯一能伤害诅咒的东西。但...使用它有代价。"\n\n"什么代价？"\n\n"使用者...可能会成为新的守门人。"林晓雨的眼神变得悲伤，"永远被困在这里，维持诅咒的运转。"\n\n你沉默了。这意味着，如果你使用匕首，可能会...永远留在这里？\n\n"还有别的办法吗？"你问。\n\n"有。"林晓雨点头，"但更难。需要...让陈婉清自己放下怨恨。需要让她明白，爱不是占有，而是祝福。"\n\n"怎么让她明白？"\n\n"用你的行动。"林晓雨看着你，"用你对我的爱，去证明给她看。让她看到，真正的爱是什么样的。"\n\n你明白了。这意味着，你们需要在陈婉清面前...展示真爱。\n\n"但这很危险。"林晓雨警告，"如果失败了，诅咒会反噬。我们...可能会死。"\n\n你深吸一口气："我愿意试试。"\n\n林晓雨看着你，眼中闪过一丝感动："你...真的愿意为我做到这个地步？"\n\n"是的。"你握住她的手，"因为我爱你。不是因为你要求我这样做，而是...因为我真心愿意。"\n\n林晓雨的眼泪无声地滑落。她紧紧握住你的手："那...我们一起。不管结果如何。"`,
    choices: [
      { text: "今晚就去旧校舍，面对诅咒。", next: "c1_start", effects: { courage: 25, affection: 15 } },
      { text: "再做一些准备，确保万无一失。", next: "p5_help_real", effects: { insight: 10 } }
    ]
  },
  "p5_help_real": {
    text: `林晓雨看着你，眼中闪过一丝希望："你真的...愿意帮我？"\n\n"是的。"你说，"但我需要知道所有的真相。"\n\n林晓雨深吸一口气："好吧。一切都始于百年前..."\n\n她讲述了陈婉清的故事：一个巫女爱上了不该爱的人，在绝望中举行了禁忌的仪式，最终变成了诅咒本身。\n\n"而我..."林晓雨的声音变得低沉，"五年前，我试图用另一个仪式来保护陈言。但...我失败了。我成为了新的守门人。"\n\n"守门人的职责是什么？"\n\n"维持诅咒的运转。"林晓雨苦笑，"每隔十年，我需要...寻找新的牺牲品。否则诅咒会反噬，杀死更多人。"\n\n你感到一阵寒意："所以这五年来，你一直在..."\n\n"在为诅咒服务。"林晓雨点头，"但我一直在寻找解脱的方法。直到...你出现。"\n\n"我？"\n\n"你让我想起了百年前的那个人。"林晓雨看着你，"陈婉清等待的人。也许...你是被命运选中的。"\n\n"被命运选中做什么？"\n\n"化解诅咒。"林晓雨说，"用你的爱，去感化陈婉清的怨灵。让她明白，爱不是占有，而是祝福。"\n\n"我该怎么做？"\n\n"在满月之夜，"林晓雨说，"诅咒的核心会出现在旧校舍。我们需要去那里，面对陈婉清。然后...用我们的爱，去证明给她看。"\n\n"我们的爱？"\n\n林晓雨的脸微微泛红："是的。我们的爱。只有...真正的爱，才能化解百年的怨恨。"\n\n你沉默了一会儿，然后伸出手："那...我们一起。"\n\n林晓雨看着你的手，看了很久。最后，她轻轻握住了它："好。一起。"\n\n月光透过窗户洒在你们身上，像是祝福，又像是...某种预兆。`,

  // --- 第一章：血色满月 ---
  "c1_start": {
    text: `夜幕降临，满月升起。\n\n你站在旧校舍后面，等待林晓雨的到来。月光将一切都染成了银白色，但不知为何，你总觉得那月光中带着一丝血色。\n\n旧校舍比白天更加阴森。破碎的窗户像是一张张张开的大嘴，随时准备吞噬什么。风穿过走廊，发出呜咽般的声音，像是有人在哭泣。\n\n你看了看手机——23:45。距离满月最盛的时刻还有十五分钟。\n\n"你来了。"\n\n林晓雨的声音从身后传来。你转身，看到她穿着那件白色连衣裙，在月光下几乎透明。她的手里提着一个灯笼，发出微弱的红光。\n\n"这是..."\n\n"引路灯。"她将灯笼递给你，"在旧校舍里，普通的光源无法使用。只有这种灯...能照亮真实。"\n\n你接过灯笼，发现那光芒确实有些奇怪——它不是普通的火焰，而是一团悬浮在空中的红色光球，散发着微弱的温度。\n\n"跟我来。"林晓雨转身走向旧校舍，"我带你去看看...诅咒的真相。`,
    bloody: true,
    choices: [
      { text: "握紧灯笼，跟随林晓雨进入旧校舍。", next: "c1_enter", effects: { courage: 10 } },
      { text: "'等等，你说的真相到底是什么？'你想先问清楚。", next: "c1_ask", effects: { insight: 10 } },
      { text: "感到不安，但不想在林晓雨面前表现出胆怯。", next: "c1_brave", effects: { courage: 5, sanity: -5 } }
    ]
  },
  "c1_enter": {
    text: `旧校舍的门在你身后缓缓关闭，发出令人牙酸的吱呀声。\n\n灯笼的红光只能照亮周围不到两米的范围，之外的一切都被黑暗吞噬。你紧跟在林晓雨身后，生怕一不留神就迷失在这片黑暗中。\n\n走廊两侧的墙壁上贴满了旧海报和学生作品，但在红光的映照下，那些画面都变得扭曲而诡异。一张原本普通的风景照片，现在看起来像是某个事故现场；一幅儿童画里的人物，眼睛似乎在跟着你移动。\n\n"不要看那些东西。"林晓雨头也不回地说，"它们会迷惑你。"\n\n你强迫自己移开视线，专注于前方的路。\n\n走到二楼时，林晓雨突然停下脚步。你差点撞上她的后背。\n\n"到了。"她轻声说。\n\n你抬头看去，走廊尽头是一扇紧闭的门。门上贴着无数张符咒，在红光中泛着诡异的光泽。但最让你震惊的是门旁边的墙壁——那上面密密麻麻地写满了名字，每一个名字都用红色的颜料写成，在灯笼的光芒下像是真正的血液。\n\n你凑近看去，发现那些名字旁边都标注着日期。最早的可以追溯到十年前，最近的...是上个月。\n\n"这些都是..."\n\n"诅咒的受害者。"林晓雨的声音在颤抖，"或者说，是他们恋人的名字。"\n\n你注意到，每个名字旁边都画着一颗心，然后被一把刀刺穿。`,
    bloody: true,
    choices: [
      { text: "'这...这是谁做的？'你感到一阵恶心。", next: "c1_wall", effects: { sanity: -10 } },
      { text: "仔细观察那些名字，看是否能找到规律。", next: "c1_pattern", effects: { insight: 15 } },
      { text: "握住林晓雨的手，发现她的手冰凉且颤抖。", next: "c1_hand", effects: { affection: 10 } }
    ]
  },
  "c1_ask": {
    text: `林晓雨停下脚步，转过身看着你。灯笼的红光照在她的脸上，让她的表情显得格外严肃。\n\n"真相..."她说，"是关于诅咒的本质。关于我...和林晓月的命运。关于...你为什么会在这里。"\n\n"我为什么会在这里？"\n\n林晓雨沉默了一会儿，然后说："因为你被选中 了。不是被诅咒选中...而是被命运选中。"\n\n"什么意思？"\n\n"百年前，陈婉清举行仪式时，留下了一个预言。"林晓雨说，"她说，百年后，会有一个'异乡人'来到这所学校。这个异乡人...将决定诅咒的命运。"\n\n"异乡人...是指我？"\n\n"你是转学生，来自外地。"林晓雨点头，"而且...你身上有一种特殊的气息。一种...不属于这个世界的气息。"\n\n你感到一阵困惑："我不明白。"\n\n"我也不完全明白。"林晓雨承认，"但我知道，你的出现...是诅咒的转折点。要么，诅咒会被你终结。要么...你会成为诅咒的一部分。"\n\n她看着你，眼神中带着一丝担忧："所以，在进入这扇门之前，你必须做出选择。是继续...还是离开。"\n\n"如果离开呢？"\n\n"你会安全。"林晓雨说，"但诅咒会继续，更多的人会死。"\n\n"如果继续呢？"\n\n"你可能会死。"她说，"但也可能...终结这一切。`,
    bloody: true,
    choices: [
      { text: "'我继续下去。'你坚定地说。", next: "c1_enter", effects: { courage: 15 } },
      { text: "'我需要知道更多，才能做决定。'", next: "c1_more", effects: { insight: 10 } },
      { text: "'如果我能终结诅咒，我愿意冒险。'", next: "c1_enter", effects: { courage: 20 } }
    ]
  },
  "c1_brave": {
    text: `你深吸一口气，强迫自己冷静下来。不管前面有什么，你都不能在林晓雨面前表现出胆怯。\n\n"我准备好了。"你说，声音比想象中更加坚定。\n\n林晓雨看了你一眼，眼神中闪过一丝赞赏。\n\n"很好。"她说，"记住，无论看到什么，都不要惊慌。不要跑，不要叫，不要...相信你的眼睛。"\n\n"什么意思？"\n\n"诅咒会制造幻觉。"林晓雨说，"它会展示你最恐惧的东西，最渴望的东西，最...痛苦的东西。只有保持清醒，才能看到真实。"\n\n她推开那扇贴满符咒的门。门后是一条向下延伸的楼梯，通向地下室。\n\n"跟紧我。"她说，"一步也不要走错。"\n\n你们沿着楼梯向下走。空气越来越冷，越来越潮湿。你闻到了一种奇怪的气味——像是腐烂的花朵，又像是...血腥味。\n\n终于，你们到达了地下室。灯笼的红光照亮了这个狭小的空间——\n\n然后，你看到了。\n\n地下室的墙壁上，挂满了照片。每一张照片都是一对情侣，笑容灿烂，幸福满满。但每张照片上，都有红色的痕迹——像是血迹，从照片的中心蔓延开来。\n\n"这些..."\n\n"诅咒的牺牲品。"林晓雨说，"每一对...都在满月之夜死去。",`,
    bloody: true,
    choices: [
      { text: "'为什么要把照片挂在这里？'", next: "c1_photos", effects: { insight: 10 } },
      { text: "'陈言和晓月...也在里面吗？'", next: "c1_chen_xiaoyue", effects: { sanity: -10 } },
      { text: "强迫自己继续观察，寻找线索。", next: "c1_clue", effects: { insight: 15 } }

  "c1_wall": {
    text: `林晓雨没有立即回答。她走到墙边，手指轻轻抚过那些红色的名字。\n\n"最开始，我以为这只是某个变态的恶作剧。"她的声音很轻，像是在自言自语，"但当我发现...当我发现这些名字的主人，都在标注日期前后死去时，我才明白这不是玩笑。"\n\n她转过身，灯笼的红光照在她的脸上，让她的表情显得格外狰狞。\n\n"而且，转学生，你注意到了吗？"她指向墙壁的某个角落，"这里...还缺一个名字。"\n\n你顺着她的手指看去，在密密麻麻的名字中间，确实有一块空白。那空白被画成了一个心形，心形中间写着两个字：\n\n"待定"\n\n"这是..."\n\n"下一个受害者的位置。"林晓雨直视你的眼睛，"每个月圆之夜，这个位置都会被填满。而上个月...这里还是空的。"\n\n你感到一阵寒意从脚底升起："你是说，这个月会有人..."\n\n"是的。"林晓雨打断你，"而且我有预感，这次的目标..."\n\n她的话没有说完。因为就在这时，你们听到了脚步声——从走廊的另一端传来，缓慢而沉重，每一步都像是踩在心跳上。\n\n"有人来了。"林晓雨的脸色变得惨白，"快，躲起来！"\n\n她拉着你的手，推开旁边的一扇门，将你推了进去。`,
    bloody: true,
    choices: [
      { text: "躲进房间，屏住呼吸，透过门缝观察外面的情况。", next: "c1_hide", effects: { courage: 5 } },

      { text: "'是谁？我们为什么要躲？'你压低声音问道。", next: "c1_who", effects: { insight: 10 } }

  "c1_pattern": {
    text: `你仔细观察那些名字，试图找出规律。\n\n首先，你发现所有名字都是学生——从校服照片可以看出。其次，所有名字旁边都标注了日期，而且日期之间似乎有某种规律。\n\n"这些日期..."你喃喃自语，"每隔大约三年，就会有一个新的名字。"\n\n"是的。"林晓雨说，"诅咒每隔三年苏醒一次。每次苏醒，会带走一对恋人中的一人。"\n\n"为什么是三年？"\n\n"因为..."林晓雨停顿了一下，"因为陈婉清等待她的恋人，等了三年。三年后，她得知他娶了别人，于是...选择了诅咒。"\n\n你继续观察，发现了另一个规律：所有名字的排列顺序，似乎是按照...字母顺序？不，不是字母顺序。是...死亡顺序？\n\n"不对。"你说，"这些名字...是按照某种仪式顺序排列的。"\n\n林晓雨惊讶地看着你："你怎么看出来的？"\n\n"你看，"你指着墙壁，"第一个名字在圆的最上方，然后顺时针排列。每个名字之间的间隔...是一样的。这不像随意的涂鸦，更像是有计划的...阵法。"\n\n林晓雨沉默了很长时间。最后，她轻轻叹了口气："你比我想象的还要聪明。"\n\n"这确实是阵法。"她说，"诅咒的核心。每个名字都是阵法的一部分，维持着诅咒的运转。"\n\n"那如果...破坏这个阵法呢？"\n\n林晓雨看着你，眼神中闪过一丝希望，但很快又消失了："不可能。阵法需要所有名字同时存在。少一个，诅咒就会崩溃。但...那些名字是用血写的，无法抹去。"\n\n"用血写的？"\n\n"是的。"林晓雨抬起手，露出手腕上的疤痕，"用我的血。",`,

    choices: [

      { text: "'那如果...用别的血代替呢？'", next: "c1_replace", effects: { insight: 20 } },
      { text: "握住她的手，看着那道疤痕，心中充满了心疼。", next: "c1_care", effects: { affection: 20 } }

  "c1_hand": {
    text: `你握住林晓雨的手。她的手冰凉且颤抖，像是握着一块即将融化的冰。\n\n"你...在害怕。"你说。这不是疑问句。\n\n林晓雨没有否认。她低下头，长发遮住了她的表情。\n\n"我当然害怕。"她说，"每次来到这里，我都害怕。害怕看到新的名字，害怕...发现自己无法阻止。"\n\n"但你还是来了。"你说，"五年了，你一直在这里。"\n\n"因为我没有选择。"她的声音在颤抖，"我是守门人。这是我的...职责。"\n\n"谁给你这个职责的？"你问，"谁有权让你承受这些？"\n\n林晓雨愣住了。她抬起头，看着你，眼神中带着一丝惊讶。\n\n"你..."她轻声说，"你和其他人真的不一样。"\n\n"哪里不一样？"\n\n"其他人...要么害怕我，要么利用我。"她说，"但你是第一个...问我'谁给我这个职责'的人。"\n\n她轻轻握紧你的手："也许...也许你真的能改变什么。"\n\n就在这时，你们听到了声音——从走廊的另一端传来。不是脚步声，而是...歌声。\n\n一首古老的童谣，在空旷的走廊里回荡，让人毛骨悚然。\n\n"它来了。"林晓雨的脸色变得惨白，"诅咒...它感觉到我们了。",`,

  "c1_hide": {
    text: `林晓雨拉着你的手，推开旁边的一扇门，将你推了进去。\n\n房间里一片漆黑，只有从门缝透进来的微弱红光。你们屏住呼吸，紧紧贴在一起。\n\n歌声越来越近，越来越清晰。那是一首你从未听过的童谣，但旋律却让你感到一种奇怪的熟悉感。\n\n"不要动。"林晓雨在你耳边轻声说，"不要发出任何声音。"\n\n你点了点头，感受着她冰凉的身体紧贴着你。她的心跳...等等，她有心跳吗？\n\n歌声在门外停了下来。然后，你听到了敲门声——轻柔的，有节奏的，像是有人在敲门。\n\n"咚...咚...咚..."\n\n三下。停顿。又是三下。\n\n"它在找我们。"林晓雨的声音几乎听不见，"它在...嗅我们的气息。"\n\n你感到一阵恐惧。如果被发现...会怎样？\n\n敲门声持续了一会儿，然后突然停止了。歌声也渐渐远去，消失在走廊的尽头。\n\n林晓雨松了一口气，但她的身体依然在颤抖。\n\n"走了。"她轻声说，"暂时...走了。"\n\n你们从门后出来，走廊里空无一人。但墙壁上的名字...似乎多了几个。`,

  "c1_together": {
    text: `"我们...安全了吗？"你问道。\n\n林晓雨摇了摇头："在这里...没有绝对的安全。但至少...暂时安全。"\n\n她看着你，眼神中带着一丝复杂的情感："你...为什么要保护我？"\n\n"什么？"\n\n"刚才...你想把我护在身后。"她说，"为什么？你应该知道...我比那些东西更危险。"\n\n你沉默了一会儿，然后说："也许吧。但...我不想看到你受伤。"\n\n林晓雨愣住了。她低下头，长发遮住了她的表情。\n\n"你...真是个傻瓜。"她轻声说，"比陈言还傻。"\n\n"也许吧。"你微笑，"但傻瓜也有傻瓜的坚持。"\n\n林晓雨抬起头，看着你，眼中闪烁着泪光："谢谢你..."\n\n她轻轻靠在你的肩膀上，感受着她冰凉的身体。也许...这就是打破诅咒的关键？\n\n"晓雨..."你说，"我会帮你的。不管付出什么代价。"\n\n林晓雨抬起头，看着你，眼神中充满了感动："你...真的愿意？"\n\n"是的。"你坚定地说。\n\n林晓雨露出了一个释然的微笑："那...我们一起。不管结果如何。"`,

  "c1_who": {
    text: `"那是什么？"你问道，声音还在颤抖。\n\n林晓雨沉默了一会儿，然后说："那是...诅咒的化身。"\n\n"化身？"\n\n"是的。"林晓雨点头，"陈婉清的怨念...已经形成了实体。它会在满月之夜...寻找猎物。"\n\n你感到一阵寒意："它...会杀死我们吗？"\n\n"如果它找到我们...是的。"林晓雨说，"但如果我们...足够小心，它就无法发现我们。"\n\n她看着你，眼神中带着一丝担忧："但...它已经感觉到我们了。从现在开始...它会一直追踪我们。"\n\n你深吸一口气："那...我们怎么办？"\n\n"继续我们的任务。"林晓雨说，"找到诅咒的核心...然后...终结它。"\n\n她握紧了你的手："但...要小心。不要单独行动。不要...离开我的视线。"\n\n你点了点头："我明白。"\n\n林晓雨露出了一个淡淡的微笑："那...我们继续。"`,

  "c1_target": {
    text: `"它是冲着我来的吗？"你问道。\n\n林晓雨摇了摇头："不...不是冲着你来的。它是...无差别的。"\n\n"无差别？"\n\n"是的。"林晓雨点头，"诅咒...不区分目标。它只是...在寻找生命。寻找...爱情。"\n\n她看着你，眼神中带着一丝悲伤："但...如果你和我在一起，它可能会...把我们当作目标。"\n\n你感到一阵寒意："为什么？"\n\n"因为...我们之间有...某种联系。"林晓雨的声音变得低沉，"诅咒...能感觉到。"\n\n你沉默了。原来...和你在一起，会让林晓雨更危险？\n\n"但...我不后悔。"你说，"我不想让你一个人面对这些。"\n\n林晓雨愣住了。她看着你，眼中闪烁着泪光："你...真是个傻瓜。"\n\n"也许吧。"你微笑，"但傻瓜也有傻瓜的坚持。"\n\n林晓雨轻轻靠在你的肩膀上："谢谢你..."\n\n月光透过窗户洒在你们身上，像是祝福，又像是...某种预兆。`,

  "c1_more": {
    text: `"告诉我更多关于诅咒的事。"你说。\n\n林晓雨点了点头，然后开始讲述。\n\n"百年前，陈婉清是樱花神社的巫女。她爱上了一个外来的书生，但那个书生...已经有了婚约。"\n\n她的声音变得低沉："陈婉清知道后，悲痛欲绝。她在满月之夜举行了禁忌的仪式，用自己的生命作为代价，诅咒了所有在这所学校里相爱的人。"\n\n"但仪式出了差错。"林晓雨继续说，"陈婉清的怨念太强了，强到她自己都无法控制。她变成了诅咒本身，永远徘徊在学校中。"\n\n你感到一阵寒意："所以...那些'意外'..."\n\n"都是诅咒的结果。"林晓雨点头，"每隔十年，诅咒就会'苏醒'一次，寻找新的牺牲品。五年前...是上一次苏醒。陈言...成为了牺牲品。"\n\n她的声音在颤抖："我试图阻止。我进行了另一个仪式，希望转移诅咒的目标。但...我失败了。诅咒带走了陈言，而我...成为了新的守门人。"\n\n"守门人的职责，"她继续说，"是维持诅咒的运转。我必须确保每隔十年，有新的牺牲品。否则...诅咒会反噬，杀死更多的人。"\n\n你沉默了。原来...林晓雨也是受害者？\n\n"那...怎么破解诅咒？"你问。\n\n林晓雨摇头："我不知道。但...也许...你能帮我找到答案。"\n\n她看着你，眼神中充满了希望："你...愿意吗？"\n\n你看着她，点了点头："我愿意。"\n\n林晓雨露出了一个释然的微笑："谢谢你..."`,

  "c1_photos": {
    text: `你仔细观察那些照片。每一张照片都是一对情侣，笑容灿烂，幸福满满。\n\n但每张照片上，都有红色的痕迹——像是血迹，从照片的中心蔓延开来。\n\n"这些...都是受害者？"你问道。\n\n林晓雨点了点头："是的。每一对...都在满月之夜死去。"\n\n你继续观察，发现照片的排列似乎有某种规律。最早的照片已经泛黄，最新的一张...看起来像是上个月拍的。\n\n"这张..."你指着最新的一张照片，"这是..."\n\n林晓雨看了一眼，然后叹了口气："那是...上周的情侣。他们...昨天死了。"\n\n你感到一阵寒意。诅咒...还在继续？\n\n"我们...必须阻止它。"你说。\n\n林晓雨看着你，眼神中带着一丝希望："你...愿意帮我？"\n\n你点了点头："我愿意。"\n\n林晓雨露出了一个淡淡的微笑："那...我们继续。"`,
    choices: [

  "c1_chen_xiaoyue": {
    text: `"陈言和晓月...也在里面吗？"你问道。\n\n林晓雨的身体微微一颤。她低下头，沉默了很长时间。\n\n"是的。"她终于说，"他们...也在里面。"\n\n她指向墙角的两张照片。你走过去，看到两张并排的照片——一张是陈言和林晓雨，另一张是林晓月独自一人的照片。\n\n两张照片上都有红色的血迹，但...林晓月的照片上的血迹似乎更少一些。\n\n"为什么...晓月的照片..."\n\n"因为...晓月不是被诅咒杀死的。"林晓雨的声音变得低沉，"她是...自杀。在陈言死后三天...她从楼顶跳了下去。"\n\n你感到一阵心酸："她...是为了陪陈言？"\n\n"也许吧。"林晓雨说，"但...我觉得...她是为了陪我。"\n\n她的声音在颤抖："她...一直在等我。等我...去找她。"\n\n你轻轻握住林晓雨的手："但...你没有。"\n\n"没有。"林晓雨摇头，"因为...我不能。我...还有责任。我是守门人...我必须...维持诅咒。"\n\n她看着你，眼中闪烁着泪光："但...有时候...我真的想..."\n\n她没有说完，但你明白了她的意思。\n\n你紧紧抱住她："不要...不要这样想。我会帮你的。我们一起...结束这一切。"\n\n林晓雨靠在你的肩膀上，泪水浸湿了你的衣服："谢谢你..."`,

  "c1_clue": {
    text: `你强迫自己继续观察，寻找线索。\n\n地下室的墙壁上挂满了照片，但你注意到...在照片的中间，有一块区域似乎被刻意遮挡了。\n\n你走过去，拨开那些照片，发现后面...有一扇门。\n\n一扇小小的，几乎看不见的门。\n\n"这是..."你转向林晓雨。\n\n林晓雨走过来，看到那扇门，脸色变得惨白："这...这里不应该有门的。"\n\n"什么意思？"\n\n"我...我来过这里很多次。"林晓雨说，"但...从未见过这扇门。"\n\n你感到一阵寒意。一扇...新出现的门？\n\n"要...打开吗？"你问。\n\n林晓雨犹豫了一下，然后点了点头："也许...这就是...诅咒想让我们看到的。"\n\n你深吸一口气，推开了那扇门。门后...是一条向下延伸的楼梯。\n\n"这...通向哪里？"你问。\n\n林晓雨摇了摇头："我不知道。但...我感觉...那里...有某种东西在等着我们。"\n\n你们对视一眼，然后一起走下了楼梯。`,

  "c1_blood": {
    text: `"你的血？为什么？"你问道。\n\n林晓雨沉默了一会儿，然后说："因为...守门人的血...是诅咒的媒介。"\n\n"媒介？"\n\n"是的。"林晓雨点头，"诅咒...需要守门人的血来维持。每次...诅咒苏醒...都需要...新的血。"\n\n她抬起手，露出手腕上的疤痕："这些...都是我自己割的。每次...诅咒需要...新的牺牲品...我就..."\n\n她的声音在颤抖："我...不想让别人死。所以...我用自己的血...来喂饱诅咒。"\n\n你感到一阵心酸。原来...林晓雨一直在...用自己的血来保护别人？\n\n"但...这样下去...你会..."\n\n"会死。"林晓雨平静地说，"我知道。但...至少...在我死之前...我能...保护一些人。"\n\n你紧紧握住她的手："不要...不要再这样了。我会帮你的。我们一起...找到...结束诅咒的方法。"\n\n林晓雨看着你，眼中闪烁着泪光："你...真的愿意？"\n\n"是的。"你坚定地说。\n\n林晓雨露出了一个释然的微笑："谢谢你..."`,

  "c1_replace": {
    text: `"那如果...用别的血代替呢？"你问道。\n\n林晓雨愣了一下："别的血？"\n\n"是的。"你说，"如果...用诅咒创造者的血...或者...用真爱之血..."\n\n林晓雨沉默了。她看着你，眼神中闪过一丝希望："你...是什么意思？"\n\n"我不知道。"你承认，"但...也许...破解诅咒的关键...不在于...牺牲别人...而在于...牺牲自己。"\n\n林晓雨的身体微微一颤："你...是说..."\n\n"我是说..."你深吸一口气，"如果...我的血...能代替你的血...能...结束诅咒..."\n\n"不！"林晓雨打断你，"我...不会让你..."\n\n"晓雨。"你轻轻握住她的手，"如果...这是唯一的方法...我愿意。"\n\n林晓雨的眼泪无声地滑落："你...真是个傻瓜..."\n\n"也许吧。"你微笑，"但傻瓜也有傻瓜的坚持。"\n\n林晓雨紧紧抱住你："不要...不要说这种话...我会...找到其他方法的...一定..."\n\n月光透过窗户洒在你们身上，像是祝福，又像是...某种预兆。`,

  "c1_care": {
    text: `你握住她的手，看着那道疤痕，心中充满了心疼。\n\n"疼吗？"你轻声问。\n\n林晓雨摇了摇头："已经...感觉不到疼了。"\n\n你轻轻抚摸着那道疤痕，感受着她冰凉的手指。\n\n"以后...不要再这样了。"你说，"我会帮你的。我们一起...找到...结束诅咒的方法。"\n\n林晓雨看着你，眼中闪烁着泪光："你...真的愿意？"\n\n"是的。"你坚定地说。\n\n林晓雨露出了一个释然的微笑："谢谢你..."\n\n她轻轻靠在你的肩膀上，感受着她冰凉的身体。也许...这就是打破诅咒的关键？\n\n"晓雨..."你说，"我会帮你的。不管付出什么代价。"\n\n林晓雨抬起头，看着你，眼神中充满了感动："你...真的愿意？"\n\n"是的。"你坚定地说。\n\n林晓雨露出了一个释然的微笑："那...我们一起。不管结果如何。"`,

  "c1_hide": {
    text: `房间里堆满了旧桌椅和破损的教学设备，空气中弥漫着霉味和某种说不清的腥甜气息。\n\n你和林晓雨躲在一排柜子后面，透过门缝观察走廊的情况。\n\n脚步声越来越近。在灯笼微弱的红光中，你看到了一个身影——那是一个穿着校服的女孩，长发及腰，背对着你们。她走得很慢，像是在寻找什么。\n\n"那是..."你刚要开口，林晓雨捂住了你的嘴。\n\n"别出声。"她在你的耳边用气声说，"那不是人。"\n\n你感到一阵毛骨悚然。仔细看去，那个"女孩"的脚步确实有些奇怪——她的脚似乎没有完全着地，而是在离地面几厘米的地方飘浮。\n\n而且，你注意到她的校服上有什么东西在滴落。是红色的，一滴一滴，落在地板上，然后消失不见。\n\n"她是...诅咒的化身？"你用气声问道。\n\n林晓雨摇摇头，眼神中充满了恐惧："不，她是第一个受害者。五年前从这里跳下去的女孩...她回来了。"\n\n那个身影在写满名字的墙壁前停下。她缓缓抬起手，似乎在抚摸那些名字。然后，她做出了一个让你们血液凝固的动作——\n\n她转过头，看向你们的方向。\n\n那张脸...\n\n那张脸和林晓雨一模一样。`,

  "c1_together": {
    text: `你拉住林晓雨的手，不让她独自面对。\n\n"我们一起。"你说，"不管外面是什么。"\n\n林晓雨看着你，眼神中闪过一丝感动，但更多的是担忧。\n\n"你...你不知道外面是什么。"她说，"它可能...会杀死你。"\n\n"那就让它来。"你说，"我不会让你一个人面对。"\n\n林晓雨盯着你的眼睛看了很久。最后，她轻轻叹了口气，点了点头。\n\n"好。"她说，"但记住...无论看到什么，都不要放开我的手。"\n\n你们一起走出房间。走廊里，那个身影已经停下了脚步。她背对着你们，长发在月光下飘动。\n\n"晓月..."林晓雨轻声说，声音中带着一丝颤抖。\n\n那个身影缓缓转过身。你终于看到了她的脸——确实和林晓雨一模一样，但更加年轻，更加...纯真。她的眼睛是闭着的，但嘴角挂着一丝微笑。\n\n"姐姐..."她开口了，声音像是从很远的地方传来，"你带他来啦。"\n\n"晓月，"林晓雨说，"他...他是来帮助我们的。"\n\n林晓月睁开眼睛。那双眼睛...是空洞的，没有瞳孔，只有一片白色。\n\n"帮助？"她歪着头，"还是...成为一部分？"\n\n她向你飘来，你感到一阵寒意。但林晓雨紧紧握着你的手，给你力量。\n\n"晓月，"林晓雨说，"预言中的那个人...就是他。"\n\n林晓月停下了。她看着你，空洞的眼睛里似乎闪过一丝光芒。\n\n"预言..."她重复道，"百年前的预言..."\n\n然后，她笑了。那个笑容很温暖，和林晓雨那种意味深长的微笑完全不同。\n\n"那么...也许真的有希望了。",`,

  "c1_discover": {
    text: `椅子倒地的声音在寂静的走廊里格外刺耳。\n\n那个身影——那个和林晓雨长得一模一样的"东西"——缓缓转向你们的方向。她的脸上没有表情，眼睛是两个漆黑的空洞，像是被挖去了眼球。\n\n"找到...你们了..."她的声音像是从很远的地方传来，又像是直接在你们的脑海中响起。\n\n林晓雨紧紧抓住你的手，力道大得让你感到疼痛。但她的身体在剧烈颤抖，显示出她内心的恐惧。\n\n"跑！"她大喊一声，拉着你的手冲出房间。\n\n你们沿着走廊狂奔，身后的脚步声不紧不慢地跟随。那个东西似乎并不着急，仿佛已经确定了你们逃不掉。\n\n"这边！"林晓雨推开一扇门，你们冲了进去。她迅速关上门，用身体抵住。\n\n"这是..."\n\n你环顾四周，发现这是一间音乐教室。角落里有一架老旧的钢琴，琴键上落满了灰尘。但最引人注目的是墙上的一幅照片——照片里是五个年轻人，站在樱花树下，笑得灿烂。\n\n你认出了其中两个——年轻的林晓雨，和一个看起来很像她的男生。\n\n"那是..."\n\n"我的双胞胎妹妹，林晓月。"林晓雨的声音在颤抖，"五年前，她从这里跳了下去。因为...她发现了我做的那个仪式。"\n\n她转过身，脸上满是泪水："她想要阻止我，但已经太晚了。诅咒已经开始，而她...成为了第一个牺牲品。"\n\n门外的脚步声停下了。然后，你们听到了钢琴声——从那架落满灰尘的钢琴上，传出了悠扬而悲伤的旋律。`,

  "c1_protect": {
    text: `你紧紧抱住林晓雨，感受她身体的颤抖。她的头发散发着淡淡的樱花香气，但在这阴森的环境中，那香气也变得诡异起来。\n\n"不管那是什么，"你在她耳边低声说，"我都不会让它伤害你。"\n\n林晓雨抬起头，那双漆黑的眼睛里闪烁着泪光。在红灯笼的映照下，她的脸显得格外苍白，但也格外美丽。\n\n"为什么？"她轻声问，"为什么你要对我这么好？你知道我是什么人，你知道我做过什么..."\n\n"我知道。"你打断她，"但我更知道，你一直在自责，一直在痛苦。这不是你的错，晓雨。诅咒不是你创造的，你只是一个受害者。"\n\n她的眼泪终于夺眶而出，浸湿了你胸前的衣服。\n\n就在这时，门外的身影似乎感受到了什么。她停下了脚步，歪着头，像是在思考。然后，她做出了一个出乎意料的动作——\n\n她开始哭泣。\n\n那哭声和钢琴声混在一起，形成了一首悲伤的安魂曲。那声音里没有仇恨，只有无尽的悲伤和孤独。\n\n"晓月..."林晓雨喃喃自语，"对不起...对不起..."\n\n哭声持续了很久，最后渐渐消失。当你们再次看向门外时，那个身影已经不见了，只留下一地的水渍——或者说，是泪水。`,
    bloody: true,

      { text: "'她走了...'你松了一口气，但心中的疑惑更重了。", next: "c1_leave", effects: { sanity: 5 } },

  "c1_calm": {
    text: `你强迫自己冷静下来。不管外面是什么，惊慌只会让情况更糟。\n\n你捂住自己的嘴，透过门缝继续观察。那个身影——林晓月的鬼魂——在走廊里徘徊了一会儿，然后停在了写满名字的墙壁前。\n\n她伸出手，轻轻抚摸那些名字。她的动作很温柔，像是在抚摸爱人的脸庞。\n\n然后，她开口了。声音很轻，但在这寂静的环境中，你能清楚地听到：\n\n"姐姐...对不起..."\n\n你感到一阵心酸。即使是鬼魂，她依然在为自己的姐姐道歉。\n\n"我不该怪你的..."她继续说，"我知道...你是为了救我..."\n\n她转过身，看向你们藏身的方向。你心中一惊，但她似乎并没有发现你们。她的目光穿透了门，看向更远的地方。\n\n"陈言..."她轻声说，"我来了...等我..."\n\n然后，她的身影开始变淡，像是一缕青烟，在月光中消散。\n\n走廊里再次恢复了寂静。\n\n你松了一口气，转头看向林晓雨。她的脸上满是泪水，但表情却比之前轻松了一些。\n\n"她...原谅我了。"林晓雨轻声说，"五年来，这是她第一次...叫我姐姐。",`,

  "c1_end": {
    text: `林晓雨擦干眼泪，看着你坚定的眼神，似乎下定了什么决心。\n\n"结束这一切..."她重复着你的话，"你知道这意味着什么吗？"\n\n"意味着我们要找出诅咒的真相，"你说，"意味着我们要让你妹妹安息，意味着..."\n\n"意味着我可能会死。"林晓雨平静地接上了你的话，"诅咒和我是一体的。如果我死了，诅咒就会结束。"\n\n你愣住了："什么？"\n\n"那个仪式...需要施术者用自己的生命作为代价。"林晓雨露出一个凄美的微笑，"我已经死过一次了，转学生。五年前的那个满月之夜，我从天台跳了下去，和晓月一起。"\n\n她拉起袖子，露出手腕上那道深深的疤痕。\n\n"但诅咒没有让我真正死去。它让我成为了'守门人'，永远徘徊在这个世界和那个世界之间。"\n\n你感到一阵天旋地转。这一切太超现实了，但你看着她的眼睛，知道她没有说谎。\n\n"所以，如果你真的要结束这一切，"林晓雨轻声说，"就必须...杀了我。"\n\n她拿出一把匕首，递到你的手中。匕首在红灯笼的光芒下泛着寒光。\n\n"在下一个满月之前，用这把匕首刺穿我的心脏。否则，会有更多人死去。"\n\n你看着手中的匕首，又看着她的眼睛。那双眼睛里充满了决绝，但也有一丝...期待？\n\n"我..."\n\n就在这时，你们听到了第三个人的声音——从钢琴后面传来。\n\n"真是感人的一幕。"一个熟悉的声音响起，"但你们似乎忘了一件事——诅咒的源头，可不是晓雨一个人。",`,

  "c1_chen_reveal": {
    text: `陈默从钢琴后面走出，脸上带着一个你从未见过的表情——那不是平时的冷静，而是一种疯狂的兴奋。\n\n"陈默？"林晓雨的声音里充满了惊讶和恐惧，"你怎么会在这里？"\n\n"我一直都在这里。"陈默笑着说，那笑容让你感到毛骨悚然，"从五年前开始，我就一直在这里。"\n\n他走到钢琴边，轻轻抚过琴键："你们知道吗？这首曲子，是我教晓月弹的。在她死之前，她每天都在练习，想要在满月之夜弹给我听。"\n\n你突然意识到了什么："你...你和林晓月..."\n\n"我们是恋人。"陈默转过头，眼睛里闪烁着疯狂的光芒，"至少，曾经是。直到晓雨发现了我们的关系，直到她进行了那个仪式..."\n\n他的声音变得尖锐："她不是为了什么永恒的爱情！她是因为嫉妒！因为她暗恋我，而我选择了她的妹妹！"\n\n林晓雨的脸色变得惨白："不...不是这样的..."\n\n"那是怎样？"陈默逼近一步，"你敢说你对我没有感情？你敢说你在进行仪式的时候，没有想到过我？"\n\n林晓雨后退一步，撞到了墙上。她的身体在剧烈颤抖，眼泪无声地滑落。\n\n"我..."她的声音小得像蚊子，"我承认...我曾经喜欢过你。但那不是我进行仪式的原因..."\n\n"那是为什么？"陈默的声音里充满了痛苦，"告诉我，为什么要杀死我最爱的人？"\n\n"因为..."林晓雨抬起头，眼睛里充满了绝望，"因为那个仪式，本来是为了保护你们。"\n\n房间里陷入了死一般的寂静。`,

  "c1_protect_truth": {
    text: `林晓雨深吸一口气，似乎下定了决心要说出一切。\n\n"五年前，我在旧校舍发现了一本古老的日记。日记里记载着这个学校的一个秘密——每隔十年，学校就会'选中'一对恋人，作为某种...祭品。"\n\n她的声音在颤抖："被选中的人，会在满月之夜死去。而他们的恋人，会继承诅咒，成为下一个十年的'守门人'。"\n\n"我发现这个秘密时，晓月和陈默已经在一起了。而且...他们已经被选中了。"\n\n陈默的表情从愤怒变成了震惊："什么？"\n\n"我进行那个仪式，不是为了诅咒他们，而是为了转移诅咒的目标。"林晓雨的眼泪夺眶而出，"我以为，如果我把诅咒引到自己身上，晓月就能活下来。但我错了...诅咒需要两个人的生命，一个作为祭品，一个作为守门人。"\n\n她跪倒在地："晓月还是死了...而我，成为了不人不鬼的存在。更可怕的是，诅咒并没有结束，它开始扩散，开始影响学校里所有恋爱的学生..."\n\n你感到一阵眩晕。这一切太过复杂，太过沉重。\n\n"所以，"你缓缓开口，"要结束诅咒，不仅需要晓雨的死，还需要..."\n\n"还需要找到最初的诅咒源头。"林晓雨抬起头，"那本日记里提到，诅咒是由一个'被背叛的女人'创造的。她在百年前被恋人抛弃，于是在这所学校下了诅咒，让所有恋人都不得不到幸福。"\n\n"而那个女人的名字..."陈默突然接话，他的声音变得异常平静，"叫陈婉清。"\n\n他露出一个苦涩的微笑："我的曾祖母。",`,

  "c1_descendant": {
    text: `"所以你是诅咒的后裔？"你感到事情变得更加复杂了。\n\n陈默点点头，脸上带着苦涩的微笑："是的。我的曾祖母陈婉清，就是那个被背叛的女人。她用鲜血写下了诅咒，让所有在这所学校里相爱的人都不得善终。"\n\n"而我..."他的声音变得低沉，"作为她的后裔，我从小就背负着这个诅咒。我的哥哥...也是因为这个诅咒而死。"\n\n林晓雨看着他，眼神中充满了同情："所以...你一直在寻找解除诅咒的方法？"\n\n"是的。"陈默说，"五年前，我发现了一本古老的日记，里面记载着诅咒的真相。我试图解除它，但...失败了。"\n\n他看向你："但现在，也许有机会了。因为你...是一个变数。"\n\n"变数？"\n\n"是的。"陈默说，"诅咒的运转是有规律的，但你的出现...打破了这个规律。也许...你就是解除诅咒的关键。"`,

  "c1_solution": {
    text: `"那你知道怎么解除诅咒吗？"你抓住了关键。\n\n陈默和林晓雨对视一眼，然后陈默说："根据那本日记的记载，解除诅咒需要两个条件。"\n\n"第一，找到诅咒的源头——陈婉清的怨灵，让她安息。"\n\n"第二..."他看向林晓雨，"让守门人解脱。"\n\n林晓雨低下头："也就是说...我需要死。"\n\n"不！"你抓住她的手，"一定有别的办法。"\n\n陈默叹了口气："也许有。日记里提到，如果能让陈婉清知道...那个男人其实也一直爱着她，也许她就能放下执念。"\n\n"但...那需要证据。"林晓雨说，"我们需要找到那个男人留下的...任何东西。"\n\n"我知道在哪里。"陈默突然说，"我父亲每年都会去一个地方扫墓。也许...那就是线索。"`,

    text: `你看着陈默，发现他的表情从疯狂变成了绝望。\n\n他跌坐在钢琴前，手指无意识地敲击着琴键，发出零散的音符。\n\n"五年了..."他喃喃自语，"我找了五年，还是没有找到解除诅咒的方法。"\n\n"我的哥哥...他死的时候，我就在这里。"他的声音变得沙哑，"他说...他说他看到了晓月。他说...她很美丽。"\n\n他抬起头，眼中满是泪水："但...我救不了他。我...什么都做不了。"\n\n林晓雨走过去，轻轻拍了拍他的肩膀："陈默...这不是你的错。"\n\n"我知道。"陈默擦去眼泪，"但...我恨自己。恨自己...无能为力。"\n\n你看着他们，心中充满了同情。这两个...`,

  "c1_prophecy": {
    text: `"什么预言？"你问道。\n\n林晓月看着你，空洞的眼睛里似乎闪过一丝光芒。\n\n"百年前..."她的声音像是从很远的地方传来，"陈婉清在临死前...留下了一个预言。"\n\n"她说...百年后，会有一个'异乡人'来到这所学校。这个异乡人...将决定诅咒的命运。"\n\n"异乡人...是指我？"你问。\n\n林晓月点点头："你是转学生...来自外地。而且...你身上有一种特殊的气息。"\n\n"什么气息？"\n\n"一种...不属于这个世界的气息。"林晓月说，"也许...你就是...打破诅咒的人。"`,

  "c1_help": {
    text: `"晓月，你能帮助我们吗？"你问。\n\n林晓月看着你，然后看向林晓雨。她的表情变得复杂。\n\n"我...想帮你们。"她说，"但...我有条件。"\n\n"什么条件？"\n\n"姐姐..."林晓月看向林晓雨，"你...能原谅我吗？"\n\n林晓雨愣住了："原谅你？为什么？"\n\n"因为..."林晓月的声音变得哽咽，"五年前...我不该...跳下去。我...让你...一个人...承受这些。"\n\n"不。"林晓雨摇头，泪水夺眶而出，"该说对不起的人...是我。是我...害死了你。"\n\n姐妹俩相拥而泣。你站在一旁，心中充满了感动。\n\n"也许..."林晓月终于说，"这就是...打破诅咒的第一步。"`,

  "c1_part": {
    text: `"成为一部分是什么意思？"你问。\n\n林晓月看着你，空洞的眼睛里似乎闪过一丝光芒。\n\n"诅咒..."她的声音变得低沉，"需要...祭品。每隔十年...就会选中一对恋人。"\n\n"而守门人..."她看向林晓雨，"就是...维持诅咒的人。"\n\n"但..."她转向你，"如果有...足够强大的力量...就能...打破诅咒。"\n\n"什么力量？"你问。\n\n"真爱。"林晓月说，"百年前...陈婉清因为...被背叛...所以...下了诅咒。但如果...有人能...证明...真爱存在...也许...就能...打破它。"`,

  "c1_soul": {
    text: `"所以你妹妹的灵魂一直在这里？"你感到既恐惧又悲伤。\n\n林晓雨点点头："是的。五年来...她的灵魂一直徘徊在这里。"\n\n"她...在等什么？"你问。\n\n"在等...我。"林晓雨说，"她...想带我走。"\n\n她看向你："但...我不能。我...还有责任。我是守门人...我必须...维持诅咒。"\n\n"但..."她的声音变得哽咽，"有时候...我真的想...和她一起走。"\n\n你紧紧握住她的手："不要...不要这样想。我会帮你的。我们一起...结束这一切。"`,

  "c1_piano": {
    text: `你走向钢琴，发现琴键在自己跳动。\n\n那是一首你从未听过的曲子，悲伤而美丽。每一个音符都像是在诉说着一个故事——一个关于爱、背叛和诅咒的故事。\n\n"这是..."林晓雨走过来，"晓月最喜欢的曲子。"\n\n"她...会弹钢琴？"你问。\n\n"是的。"林晓雨说，"她...弹得很好。但...五年前...她再也没有机会...弹完这首曲子。"\n\n琴声渐渐变弱，最后停了下来。你注意到...琴盖上刻着一行小字：\n\n"给晓月：愿你在另一个世界...找到幸福。——陈言"\n\n"陈言..."林晓雨喃喃自语，"他...也在这里。"`,

  "c1_comfort": {
    text: `你抱住林晓雨，让她在你的肩膀上哭泣。\n\n她的身体在剧烈颤抖，泪水浸湿了你的衣服。你轻轻拍着她的背，试图给她一些安慰。\n\n"对不起..."她哽咽着说，"我...不该...这样。"\n\n"不。"你说，"你有权利...悲伤。"\n\n她抬起头，看着你，眼中满是泪水："谢谢你...转学生。谢谢你...没有...抛弃我。"\n\n"我...不会抛弃你。"你坚定地说，"我会帮你的。我们一起...结束这一切。"\n\n林晓雨露出了一个释然的微笑："那...我们一起。不管结果如何。"`,

  "c1_leave": {
    text: `"她走了..."你松了一口气，但心中的疑惑更重了。\n\n林晓雨擦干眼泪，看着你："是的...她走了。但...她还会回来。"\n\n"什么时候？"你问。\n\n"满月之夜。"林晓雨说，"每当...诅咒苏醒...她就会...回来。"\n\n她看向窗外，月光洒在她的脸上，让她显得更加苍白："而且...下一个满月...就快到了。"\n\n你感到一阵寒意。也就是说...你们的时间...不多了。`,

  "c1_forgive": {
    text: `"她一直在等你原谅她。"你说。\n\n林晓雨愣住了："原谅...我？"\n\n"是的。"你说，"她...不怪你。她...理解你。"\n\n林晓雨的眼泪再次夺眶而出："但我...该怪自己。是我...害死了她。"\n\n"不。"你握住她的手，"不是你。是诅咒。"\n\n她看着你，眼中闪烁着泪光："你...真的这么认为？"\n\n"是的。"你坚定地说，"而且...我会帮你...结束这一切。"\n\n林晓雨露出了一个释然的微笑："谢谢你...转学生。"`,

  "c1_truth": {
    text: `"晓雨，你妹妹说你是为了救她...是什么意思？"你问。\n\n林晓雨沉默了很长时间。然后，她深吸一口气，开始讲述。\n\n"五年前...我在旧校舍发现了一本古老的日记。日记里记载着...这个学校的一个秘密。"\n\n"每隔十年...学校就会'选中'一对恋人...作为...祭品。"\n\n"我发现这个秘密时...晓月和陈言已经在一起了。而且...他们已经被选中了。"\n\n"我...试图救他们。我进行了那个仪式...想要...转移诅咒的目标。"\n\n"但...我错了。诅咒...需要两个人的生命。一个作为祭品...一个作为守门人。"\n\n"晓月...还是死了。而我...成为了...不人不鬼的存在。"`,
    bloody: true,
    choices: [

  "c2_start": {
    text: `陈默的故事比想象中更加复杂。\n\n他的曾祖母陈婉清，是这所学校的第一批学生之一。在那个动荡的年代，她与一个富家少爷相爱，但对方最终为了家族利益，娶了另一个女人。\n\n被抛弃的陈婉清在满月之夜，从这栋楼的楼顶跳了下去。但在临死前，她用鲜血在墙上写下了一个诅咒——让所有在这所学校里相爱的人，都不得善终。\n\n"我曾祖母死后，她的怨灵一直徘徊在学校中。"陈默坐在钢琴边，手指无意识地敲击着琴键，发出零散的音符，"每隔十年，她就会'选中'一对恋人，让他们重复自己的悲剧。"\n\n"而守门人的存在，"林晓雨接话，"就是为了维持诅咒的运转。没有守门人，诅咒就会消散。"\n\n你梳理着这些信息："所以，要结束诅咒，需要两个条件——一是让守门人解脱，也就是晓雨的死；二是化解陈婉清的怨念，让她安息。"\n\n"没错。"陈默点头，"但第二个条件，几乎不可能完成。曾祖母的怨念太深了，深到她自己都无法控制。"\n\n"一定有办法的。"你说，"每个怨灵都有执念，只要找到她的执念所在..."\n\n"她的执念，"林晓雨突然说，"是那个抛弃她的男人。"\n\n她看向陈默："如果我没记错，那个富家少爷的后裔..."\n\n"就是我们陈家。"陈默苦笑，"所以我从一出生，就背负着这个诅咒。我的哥哥...也是因为这个诅咒而死。"\n\n房间里再次陷入沉默。\n\n"等等，"你突然想到了什么，"如果陈婉清的执念是那个男人，那如果让她知道，那个男人其实也一直爱着她呢？"\n\n陈默和林晓雨同时看向你。\n\n"你说什么？"\n\n"我的意思是，"你快速整理着思路，"如果那个富家少爷当年不是自愿抛弃她的呢？如果他有不得已的苦衷呢？如果...他一直在后悔呢？"\n\n"你怎么知道..."\n\n"我不知道，"你承认，"但这是一个可能性。而且，如果这是真的，那化解怨念的关键，就不是复仇，而是...原谅。"\n\n林晓雨的眼睛亮了起来："你是说，让陈婉清知道真相，让她放下执念？"\n\n"没错。"你点头，"但这需要证据。我们需要找到那个富家少爷留下的...任何东西。信件、日记、或者..."\n\n"或者他的坟墓。"陈默突然说，"我知道在哪里。"\n\n他站起身，眼神中重新燃起了希望："每年的忌日，我父亲都会去一个地方扫墓。但他从不告诉我那是谁的墓。也许..."\n\n"也许那就是陈婉清恋人的墓。"你接上了他的话。\n\n三个人对视一眼，都看到了彼此眼中的决心。\n\n"明天是周末，"陈默说，"我们去看看。"\n\n但你们都没有注意到，在窗外的月光中，一个白色的身影正默默注视着这一切。她的脸上，露出了一丝复杂的表情——那既不是仇恨，也不是悲伤，而是...期待？`,
    choices: [
      { text: "同意陈默的计划，明天一起去扫墓。", next: "c2_grave", effects: { courage: 10 } },

      { text: "看向窗外，似乎感觉到了什么，但月光下什么都没有。", next: "c2_feel", effects: { insight: 15 } }

  "c2_prepare": {
    text: `"但在此之前，我们需要更多准备。"你提醒道。\n\n陈默点点头："你说得对。我们不能贸然行动。"\n\n他走到窗边，看着外面的月光："首先，我们需要了解陈婉清的弱点。"\n\n"弱点？"林晓雨问。\n\n"每个怨灵都有弱点。"陈默说，"陈婉清的弱点...应该是她对沈墨的感情。"\n\n他转向你："如果你能证明沈墨一直爱着她，也许...就能化解她的怨念。"\n\n"但...怎么证明？"你问。\n\n"需要...证据。"陈默说，"沈墨留下的...任何东西。信件、日记、或者...他的坟墓。"\n\n"我知道他的坟墓在哪里。"陈默突然说，"我父亲每年都会去扫墓。也许...那里有线索。"\n\n林晓雨看着你们，眼中闪过一丝担忧："但...如果失败了..."\n\n"不会失败的。"你握住她的手，"我们一起。"\n\n林晓雨看着你，终于露出了一个微笑："好。我们一起。"`,

  "c2_feel": {
    text: `你看向窗外，似乎感觉到了什么。\n\n月光下，校园显得格外宁静。但你...感到一种莫名的不安。\n\n"怎么了？"林晓雨走到你身边。\n\n"我...感觉...有什么东西在看着我们。"你说。\n\n林晓雨也看向窗外，她的表情变得凝重："是的...我也感觉到了。"\n\n她转向你："也许...是陈婉清。她在...试探我们。"\n\n"试探？"\n\n"是的。"林晓雨说，"她...想看看我们是否有能力...结束诅咒。"\n\n她握住你的手："不要怕。我们一起面对。"\n\n你感到一阵温暖。是的，无论前方有什么，你们都会一起面对。`,

  "c2_grave": {
    text: `第二天傍晚，你们三人来到了城郊的墓园。\n\n秋天的落叶铺满了小径，踩上去发出沙沙的声响。夕阳将一切都染成了金黄色，但墓园里的气氛依然阴森。\n\n陈默带着你们穿过一排排墓碑，最后停在最深处的一块墓前。\n\n墓碑上写着："沈墨之墓，生于1900年，卒于1925年。"\n\n"沈墨..."林晓雨轻声念出这个名字，"这就是那个富家少爷？"\n\n"应该是。"陈默蹲下身，清理墓碑周围的杂草，"我父亲每年都来，但从不进香，只是站一会儿就走。"\n\n你注意到墓碑前有一个石制的花瓶，里面插着干枯的白色花朵——那是百年前的花，竟然一直没有腐烂。\n\n"这些花..."\n\n"是曾祖母最喜欢的白色彼岸花。"陈默说，"传说这种花生长在阴阳交界之处，能连接生者和死者的世界。"\n\n你仔细观察墓碑，发现背面刻着一行小字。由于年代久远，字迹已经模糊，但你还是辨认出了大部分内容：\n\n"婉清吾爱：身不由己，负你深情。若有来世，愿为草木，长伴你左右。"\n\n"他...他是被迫的。"你感到一阵心酸。\n\n林晓雨也凑过来看，她的手指轻轻抚过那些字迹："家族的安排...在那个年代，很多人都无法反抗。"\n\n"但他还是后悔了。"陈默的声音有些沙哑，"他用一辈子来后悔。"\n\n就在这时，你们听到了一个声音——从墓碑后面传来，像是谁在叹息。\n\n你们同时转头看去。\n\n一个穿着旧式学生服的女子，正站在夕阳中。她的脸苍白而美丽，眼睛里充满了复杂的情感——悲伤、怀念、还有...解脱？\n\n"你们...找到了。"她的声音像是从很远的地方传来，"我等这句话...等了一百年。",`,
    bloody: true,
