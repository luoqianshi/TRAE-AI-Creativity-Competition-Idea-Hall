  "c2_ghost": {
    text: `陈婉清——如果那真的是她——缓缓走向你们。她的脚步没有踩碎任何一片落叶，仿佛她只是一个幻影。\n\n"一百年了..."她停在墓碑前，低头看着那个名字，"我以为，他从来没有爱过我。我以为，我只是他生命中的一个过客。"\n\n她的手指穿过墓碑，像是穿过了一层水波："但现在我知道了...原来他也一样痛苦。"\n\n"曾祖母..."陈默的声音在颤抖，"您...您能听到我们说话吗？"\n\n陈婉清转过头，看向陈默。她的眼神中闪过一丝温柔："你是...陈家的后人？"\n\n"是的。我是陈默，陈家的第四代。"\n\n"你长得...很像他。"陈婉清露出一个凄美的微笑，"特别是眼睛。"\n\n她转向林晓雨："而你...我感受到了熟悉的气息。你是守门人？"\n\n林晓雨点点头，不敢直视她的眼睛。\n\n"可怜的孩子。"陈婉清伸出手，想要触碰林晓雨的脸，但手指穿过了她的身体，"你和我一样，都是被命运捉弄的人。"\n\n她最后看向你："而你...你是一个变数。我看不到你的命运线，这让我感到...好奇。"\n\n你感到一阵寒意，但强忍着没有后退："前辈，我们来这里，是想要结束这一切。诅咒已经伤害了太多无辜的人，包括您的后人。"\n\n"我知道。"陈婉清的声音变得悲伤，"我能感受到每一个因诅咒而死去的灵魂。他们的痛苦...他们的不甘...我都感受得到。"\n\n"但我无法停止。"她继续说，"诅咒一旦开始，就会自我运转。即使是我，也无法控制它。"\n\n"那如果..."你快速思考着，"如果有人愿意替您承担这份怨念呢？"\n\n陈婉清愣住了："你说什么？"\n\n"您之所以无法安息，是因为心中有怨。但如果有人愿意理解您的痛苦，愿意替您承受这份怨恨..."\n\n你看向林晓雨和陈默："就像他们一样。陈默愿意承担家族的罪孽，林晓雨愿意承担诅咒的后果。如果他们能做到，为什么您不能放下？"\n\n陈婉清沉默了很长时间。夕阳渐渐落下，她的身影在暮色中变得越来越淡。\n\n"也许..."她终于开口，"也许你说得对。"\n\n她看向沈墨的墓碑，眼神中终于出现了释然："我等了一百年，不是为了怨恨，而是为了...一个答案。"\n\n"现在，我得到了。"\n\n她的身影开始发光，那光芒温暖而柔和，与之前的阴森截然不同。\n\n"诅咒...我会收回。但守门人..."她看向林晓雨，"你需要自己做出选择。是继续活下去，还是...解脱。"\n\n"这是你的自由意志，没有人可以替你做决定。",`,

  "c2_support": {
    text: `你走到林晓雨身边，看着她的眼睛，认真地说："晓雨，无论你做什么决定，我都支持你。"\n\n林晓雨的身体微微一颤。她抬起头看着你，那双漆黑的眼睛里闪烁着泪光。\n\n"你...真的这么认为？"她的声音在颤抖。\n\n"真的。"你握住她的手，"这五年来，你一个人承受了太多。你有权选择自己的未来。"\n\n林晓雨的眼泪终于夺眶而出。她紧紧握住你的手，像是抓住了最后一根救命稻草。\n\n"我..."她的声音哽咽，"我想...活下去。"\n\n"但是...我害怕。"她低下头，"我害怕...继续伤害别人。我害怕...自己不配得到幸福。"\n\n"你配。"你坚定地说，"你一直在保护别人，现在轮到别人保护你了。"\n\n林晓雨靠在你的肩膀上，泪水浸湿了你的衣服。陈婉清在一旁默默看着这一切，她的表情从悲伤变成了...欣慰。\n\n"也许..."陈婉清轻声说，"也许这就是...我一直等待的答案。"\n\n就在这时，墓园的入口处传来了一个声音——\n\n"姐姐！"\n\n你们同时转头。一个穿着白色连衣裙的女孩正站在那里，脸上带着纯真的微笑。\n\n"晓月..."林晓雨喃喃自语。`,

  "c2_choice": {
    text: `林晓雨站在暮色中，长发随风飘动。她的表情平静，但你知道，她的内心正在经历一场风暴。\n\n"一百年..."她轻声说，"陈婉清等了一百年，才等到一个答案。而我...只等了五年。"\n\n她转向你，那双漆黑的眼睛里闪烁着泪光："你知道吗？这五年里，我每一天都在想，如果当初我没有进行那个仪式，如果我没有嫉妒，如果我能祝福晓月和陈默...一切会不会不同。"\n\n"但我没有。"她的声音变得哽咽，"我选择了最自私的方式，结果害死了最爱的人，也害死了无数无辜的人。"\n\n"晓雨..."\n\n"让我说完。"她深吸一口气，"这五年里，我也遇到了很多人。有人想要帮助我，有人想要利用我，有人...只是想要逃离。"\n\n"但你不同。"她看着你，眼神中充满了复杂的情感，"你是第一个，让我想要为了他而活下去的人。"\n\n你感到心脏被什么东西揪紧了。\n\n"但是，"她继续说，"我不能这么自私。诅咒虽然被收回了，但我的存在本身就是错误的。我是守门人，是不该存在于这个世界的存在。"\n\n她露出一个凄美的微笑："所以，我的决定是..."\n\n她的话没有说完。因为就在这时，你们听到了第三个声音——从墓园的入口处传来。\n\n"姐姐！"\n\n你们同时转头。\n\n一个穿着白色连衣裙的女孩，正站在入口处。她的脸和林晓雨一模一样，但表情更加纯真，更加... alive。\n\n"晓月？"林晓雨的声音在颤抖，"不可能...你已经..."\n\n"我已经死了。"林晓月微笑着说，"但姐姐，你也一样啊。"\n\n她走向你们，脚步轻盈得像是在跳舞："五年来，我一直看着你。看着你痛苦，看着你自责，看着你想要解脱却又不敢。"\n\n"但现在，"她停在林晓雨面前，伸出手，"跟我走吧。不是去死，而是...去该去的地方。"\n\n"诅咒已经结束了，姐姐。你不需要再做守门人了。"\n\n林晓雨看着妹妹的手，眼泪夺眶而出。\n\n"可是...我害死了你..."\n\n"你没有。"林晓月摇头，"当年是我自己选择跳下去的。因为我知道，只有这样，才能阻止诅咒继续扩散。"\n\n"而且，"她露出一个调皮的微笑，"我在那边过得很好。有很多朋友，还有很多有趣的事情。"\n\n"所以，姐姐，"她再次伸出手，"跟我走吧。不是作为守门人，而是作为...我的姐姐。"\n\n林晓雨看着那只手，看了很久。最后，她做出了选择。`,

  "c2_goodbye": {
    text: `林晓雨握住了妹妹的手。在那一瞬间，她的身体开始发光，那光芒温暖而柔和，像是月光，又像是晨曦。\n\n"谢谢你。"她转向你，脸上带着释然的微笑，"谢谢你让我知道，即使是我这样的人，也值得被爱。"\n\n"晓雨..."你的声音在颤抖。\n\n"不要难过。"她轻轻说，"这不是结束，而是新的开始。"\n\n林晓月拉着她的手，姐妹俩的身影渐渐变得透明。\n\n"对了，"林晓雨突然说，"有件事我一直没告诉你。"\n\n"什么？"\n\n"五年前，那个和我长得很像的人..."她露出一个神秘的微笑，"不只是像，那就是你。"\n\n"什么？"\n\n"或者说，是你的前世。"她的声音越来越远，"我们之间的羁绊，从很久以前就开始了。所以这一世，你才会转学到这所学校，才会遇到我..."\n\n"这不是巧合，是命运。"\n\n她的身影完全消失了，只留下一片飘落的樱花花瓣，和空气中淡淡的香气。\n\n你站在原地，久久无法回神。\n\n陈默走到你身边，拍了拍你的肩膀："她走了。"\n\n"我知道。"你低声说。\n\n"但她说得对，这不是结束。"陈默看向天空，第一颗星星已经亮起，"诅咒结束了，学校会恢复正常。而我...也终于可以做回普通人了。"\n\n他转向你，露出一个真诚的微笑："谢谢你，转学生。没有你，这一切都不会结束。"\n\n你看着天空，感受着秋夜的凉风。心中虽然有着失落，但更多的是...释然。\n\n"对了，"陈默突然说，"还有一个人，你应该见见。"\n\n"谁？"\n\n"苏梦。"陈默的表情变得古怪，"那个一直暗恋你的学妹。她...似乎知道一些关于你前世的事情。",`,

  "c2_stop": {

// ===== 结局条件 =====
const endingConditions = {
  death: () => gameState.health <= 0,
  madness: () => gameState.sanity <= 0,
  escape: () => gameState.courage <= 10 && gameState.affection <= 20
};

// ===== 游戏函数 =====
function startGame() {
  document.getElementById('titleScreen').style.display = 'none';
  document.getElementById('statsPanel').classList.add('active');
  document.getElementById('storyPanel').classList.add('active');
  showScene('p1');
}

function showScene(sceneId) {
  const scene = scenes[sceneId];
  if (!scene) {
    console.error('场景不存在:', sceneId);
    return;
  }

  // 检查是否是结局场景
  if (scene.ending) {
    showEnding(scene.ending);
    return;
  }

  // 只在关键剧情节点检查状态触发的结局
  // 确保玩家至少完成了序章和部分第一章
  const isChapterMilestone = sceneId === 'c1_start' || 
                             sceneId === 'c1_enter' || 
                             sceneId === 'c2_start' ||
                             sceneId === 'c2_grave' ||
                             sceneId.startsWith('ending_');
  
  if (isChapterMilestone) {
    // 死亡结局：任何时候都可能触发
    if (endingConditions.death()) {
      showEnding(scenes['ending_death'].ending);
      return;
    }
    // 疯狂结局：任何时候都可能触发
    if (endingConditions.madness()) {
      showEnding(scenes['ending_madness'].ending);
      return;
    }
    // 逃离结局：只在第二章开始后检查，避免过早触发
    if ((sceneId === 'c2_start' || sceneId === 'c2_grave' || sceneId.startsWith('ending_')) 
        && endingConditions.escape()) {
      showEnding(scenes['ending_escape'].ending);
      return;
    }
  }

  const storyContent = document.getElementById('storyContent');
  const choicesContainer = document.getElementById('choicesContainer');

  // 清空内容
  storyContent.innerHTML = '';
  choicesContainer.innerHTML = '';
  choicesContainer.classList.remove('active');

  // 显示章节标题（如果是第一章或第二章的开始）
  const chapterTitle = document.getElementById('chapterTitle');
  if (sceneId === 'c1_start') {
    chapterTitle.textContent = '第一章：满月之夜';
    chapterTitle.classList.add('active');
    setTimeout(() => chapterTitle.classList.remove('active'), 3000);
  } else if (sceneId === 'c2_grave' || sceneId === 'c2_ghost' || sceneId === 'c2_choice') {
    chapterTitle.textContent = '第二章：真相大白';
    chapterTitle.classList.add('active');
    setTimeout(() => chapterTitle.classList.remove('active'), 3000);
  }

  // 显示文本
  const textDiv = document.createElement('div');
  textDiv.className = 'story-text' + (scene.bloody ? ' bloody' : '');
  textDiv.innerHTML = scene.text.replace(/\n/g, '<br>');
  storyContent.appendChild(textDiv);

  // 显示选项
  if (scene.choices && scene.choices.length > 0) {
    setTimeout(() => {
      scene.choices.forEach((choice, index) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = choice.text;
        btn.onclick = () => makeChoice(choice);
        choicesContainer.appendChild(btn);
      });
      choicesContainer.classList.add('active');
    }, 1000);
  }

  // 恐怖效果
  if (scene.bloody) {
    triggerBloodEffect();
  }

  // 滚动到故事面板
  document.getElementById('storyPanel').scrollIntoView({ behavior: 'smooth' });
}

function makeChoice(choice) {
  // 应用效果
  if (choice.effects) {
    applyEffects(choice.effects);
  }

  // 跳转到下一个场景
  if (choice.next) {
    showScene(choice.next);
  }
}

function applyEffects(effects) {
  for (const [key, value] of Object.entries(effects)) {
    if (gameState[key] !== undefined) {
      gameState[key] = Math.max(0, Math.min(100, gameState[key] + value));
      updateStat(key);
    }
  }

  // 显示通知
  const effectTexts = [];
  for (const [key, value] of Object.entries(effects)) {
    const names = { sanity: '理智', affection: '好感', courage: '勇气', insight: '洞察', health: '生命' };
    if (names[key]) {
      effectTexts.push(`${names[key]} ${value > 0 ? '+' : ''}${value}`);
    }
  }
  if (effectTexts.length > 0) {
    showNotification(effectTexts.join(' | '));
  }
}

function updateStat(stat) {
  const bar = document.getElementById(stat + 'Bar');
  const value = document.getElementById(stat + 'Value');
  if (bar && value) {
    bar.style.width = gameState[stat] + '%';
    value.textContent = gameState[stat];

    // 根据值改变颜色
    if (stat === 'health' || stat === 'sanity') {
      if (gameState[stat] <= 20) {
        bar.style.backgroundColor = '#ef5350';
      } else if (gameState[stat] <= 50) {
        bar.style.backgroundColor = '#ffb74d';
      } else {
        bar.style.backgroundColor = stat === 'health' ? '#ef5350' : '#4fc3f7';
      }
    }
  }
}

function showNotification(text) {
  const notification = document.getElementById('notification');
  notification.textContent = text;
  notification.classList.add('show');
  setTimeout(() => notification.classList.remove('show'), 2000);
}

function showEnding(ending) {
  document.getElementById('storyPanel').classList.remove('active');
  document.getElementById('choicesContainer').classList.remove('active');
  document.getElementById('statsPanel').classList.remove('active');

  const endingScreen = document.getElementById('endingScreen');
  const endingTitle = document.getElementById('endingTitle');
  const endingDesc = document.getElementById('endingDesc');

  endingTitle.textContent = ending.title;
  endingTitle.style.color = ending.color || '#ff6b6b';
  endingDesc.innerHTML = ending.desc.replace(/\n/g, '<br>');
  endingScreen.classList.add('active');
}

function triggerBloodEffect() {
  const overlay = document.getElementById('bloodOverlay');
  const border = document.getElementById('bloodBorder');

  // 添加血滴
  for (let i = 0; i < 10; i++) {
    const drop = document.createElement('div');
    drop.className = 'blood-drop';
    drop.style.left = Math.random() * 100 + '%';
    drop.style.animationDelay = Math.random() * 3 + 's';
    overlay.appendChild(drop);
  }

  overlay.classList.add('active');
  border.classList.add('active');

  setTimeout(() => {
    overlay.classList.remove('active');
    border.classList.remove('active');
    // 清除血滴
    while (overlay.firstChild) {
      overlay.removeChild(overlay.firstChild);
    }
  }, 5000);
}
</script>
