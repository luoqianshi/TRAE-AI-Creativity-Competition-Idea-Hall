<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神话伴生 - 中国古代神话 × 青少年心理陪伴互动小游戏</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap');

:root {
  --ink-black: #1a1a2e;
  --ink-dark: #16213e;
  --ink-medium: #0f3460;
  --paper-white: #f5f5dc;
  --vermilion: #e63946;
  --gold: #ffd700;
  --jade: #2a9d8f;
  --lavender: #9b5de5;
  --peach: #ff9f1c;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'ZCOOL KuaiLe', cursive;
  background: linear-gradient(135deg, var(--ink-black) 0%, var(--ink-dark) 50%, var(--ink-medium) 100%);
  color: var(--paper-white);
  position: relative;
}

body::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(230, 57, 70, 0.1) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(155, 93, 229, 0.1) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 70%);
  pointer-events: none;
}

.particles {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  z-index: 0;
}

.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: var(--gold);
  border-radius: 50%;
  opacity: 0.6;
  animation: float 10s infinite ease-in-out;
}

@keyframes float {
  0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
  50% { transform: translateY(-50px) translateX(20px); opacity: 0.8; }
}

.cloud {
  position: absolute;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 50%;
  filter: blur(20px);
  animation: drift 20s infinite ease-in-out;
}

@keyframes drift {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(30px); }
}

.screen {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  visibility: hidden;
  transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 10;
  overflow-y: auto;
}

.screen.active {
  opacity: 1;
  visibility: visible;
}

.screen.fade-out {
  opacity: 0;
  visibility: hidden;
}

.ink-transition {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--ink-black);
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}

.ink-transition.active {
  opacity: 1;
}

.title {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 3rem;
  color: var(--gold);
  text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
  margin-bottom: 1rem;
  animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 30px rgba(255, 215, 0, 0.5); }
  to { text-shadow: 0 0 50px rgba(255, 215, 0, 0.8); }
}

.subtitle {
  font-size: 1.2rem;
  color: var(--paper-white);
  opacity: 0.8;
  margin-bottom: 2rem;
}

.btn {
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 1.2rem;
  padding: 12px 36px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.btn::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: width 0.6s ease, height 0.6s ease;
}

.btn:hover::before {
  width: 300px;
  height: 300px;
}

.btn-primary {
  background: linear-gradient(135deg, var(--vermilion) 0%, #c41e3a 100%);
  color: white;
  box-shadow: 0 4px 15px rgba(230, 57, 70, 0.4);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(230, 57, 70, 0.6);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.1);
  color: var(--paper-white);
  border: 2px solid rgba(255, 255, 255, 0.3);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.2);
  transform: translateY(-2px);
}

.btn-outline {
  background: transparent;
  color: var(--gold);
  border: 2px solid var(--gold);
}

.btn-outline:hover {
  background: rgba(255, 215, 0, 0.1);
}

.card {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  padding: 24px;
  max-width: 400px;
  width: 100%;
}

.card-header {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 1.5rem;
  color: var(--gold);
  margin-bottom: 16px;
  text-align: center;
}

.card-body {
  color: var(--paper-white);
  line-height: 1.8;
}

.progress-bar {
  width: 100%;
  height: 6px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 3px;
  margin: 16px 0;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--vermilion) 0%, var(--gold) 100%);
  border-radius: 3px;
  transition: width 0.5s ease;
}

.question-text {
  font-size: 1.1rem;
  margin-bottom: 20px;
  text-align: center;
}

.option-btn {
  display: block;
  width: 100%;
  padding: 14px 20px;
  margin: 10px 0;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 12px;
  color: var(--paper-white);
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 1rem;
  text-align: left;
  cursor: pointer;
  transition: all 0.3s ease;
}

.option-btn:hover {
  background: rgba(255, 255, 255, 0.15);
  border-color: var(--gold);
  transform: translateX(5px);
}

.option-btn.selected {
  background: rgba(255, 215, 0, 0.2);
  border-color: var(--gold);
}

.character-card {
  background: linear-gradient(145deg, rgba(26, 26, 46, 0.9) 0%, rgba(22, 33, 62, 0.9) 100%);
  border: 2px solid var(--gold);
  border-radius: 24px;
  padding: 32px;
  max-width: 420px;
  width: 100%;
  text-align: center;
  box-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
  animation: cardAppear 1s ease-out;
}

@keyframes cardAppear {
  from { opacity: 0; transform: scale(0.8) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.character-icon {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4rem;
  background: linear-gradient(135deg, rgba(255, 215, 0, 0.2) 0%, rgba(230, 57, 70, 0.2) 100%);
  border: 3px solid var(--gold);
  box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
}

.character-name {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 2rem;
  color: var(--gold);
  margin-bottom: 8px;
}

.character-quality {
  display: inline-block;
  padding: 6px 20px;
  background: rgba(255, 215, 0, 0.15);
  border: 1px solid var(--gold);
  border-radius: 20px;
  color: var(--gold);
  font-size: 0.9rem;
  margin-bottom: 16px;
}

.character-desc {
  font-size: 1rem;
  line-height: 1.8;
  color: rgba(245, 245, 220, 0.9);
  margin-bottom: 20px;
}

.spiritual-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--vermilion), var(--peach));
  color: white;
  font-size: 1.5rem;
  font-weight: bold;
  box-shadow: 0 0 20px rgba(230, 57, 70, 0.5);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(230, 57, 70, 0.5); }
  50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(230, 57, 70, 0.8); }
}

.trial-story {
  font-size: 1rem;
  line-height: 1.8;
  margin-bottom: 24px;
  text-align: center;
}

.story-highlight {
  color: var(--gold);
  font-weight: bold;
}

.quality-graph {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 20px;
}

.quality-item {
  text-align: center;
}

.quality-circle {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  border: 2px solid rgba(255, 255, 255, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 8px;
  font-size: 1.2rem;
  transition: all 0.5s ease;
}

.quality-circle.unlocked {
  background: linear-gradient(135deg, var(--gold) 0%, var(--peach) 100%);
  border-color: var(--gold);
  box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
}

.quality-name {
  font-size: 0.75rem;
  color: rgba(245, 245, 220, 0.7);
}

.companion-hub {
  width: 100%;
  max-width: 500px;
}

.hub-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}

.hub-avatar {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 215, 0, 0.2) 0%, rgba(230, 57, 70, 0.2) 100%);
  border: 2px solid var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
}

.hub-info {
  flex: 1;
}

.hub-name {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 1.5rem;
  color: var(--gold);
}

.hub-date {
  font-size: 0.9rem;
  color: rgba(245, 245, 220, 0.6);
}

.daily-message {
  background: rgba(255, 215, 0, 0.05);
  border-left: 4px solid var(--gold);
  padding: 16px;
  margin-bottom: 20px;
  border-radius: 0 12px 12px 0;
}

.message-text {
  font-size: 1rem;
  line-height: 1.6;
  color: var(--paper-white);
}

.message-source {
  text-align: right;
  font-size: 0.85rem;
  color: var(--gold);
  margin-top: 8px;
}

.mood-diary {
  margin-bottom: 20px;
}

.diary-label {
  font-size: 0.9rem;
  color: rgba(245, 245, 220, 0.7);
  margin-bottom: 8px;
}

.diary-input {
  width: 100%;
  height: 80px;
  padding: 12px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 12px;
  color: var(--paper-white);
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 1rem;
  resize: none;
}

.diary-input:focus {
  outline: none;
  border-color: var(--gold);
}

.diary-history {
  max-height: 200px;
  overflow-y: auto;
}

.diary-entry {
  background: rgba(255, 255, 255, 0.03);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 10px;
  border-left: 3px solid var(--jade);
}

.diary-date {
  font-size: 0.75rem;
  color: rgba(245, 245, 220, 0.5);
  margin-bottom: 4px;
}

.diary-content {
  font-size: 0.9rem;
  color: var(--paper-white);
}

.section-title {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 1.3rem;
  color: var(--gold);
  margin-bottom: 16px;
}

.greeting-card {
  background: linear-gradient(135deg, rgba(155, 93, 229, 0.1) 0%, rgba(42, 157, 143, 0.1) 100%);
  border: 1px solid rgba(155, 93, 229, 0.3);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  text-align: center;
}

.greeting-emoji {
  font-size: 2rem;
  margin-bottom: 12px;
}

.greeting-text {
  font-size: 1.1rem;
  color: var(--paper-white);
  margin-bottom: 8px;
}

.greeting-author {
  font-size: 0.9rem;
  color: var(--gold);
}

.instruction {
  text-align: center;
  margin-top: 20px;
  font-size: 0.9rem;
  color: rgba(245, 245, 220, 0.5);
}

.fade-in {
  animation: fadeIn 0.5s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.slide-up {
  animation: slideUp 0.5s ease-out;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  .title {
    font-size: 2rem;
  }
  
  .subtitle {
    font-size: 1rem;
  }
  
  .card {
    padding: 16px;
  }
  
  .character-icon {
    width: 90px;
    height: 90px;
    font-size: 3rem;
  }
  
  .character-name {
    font-size: 1.5rem;
  }
}
</style>
</head>
<body>
<div class="particles" id="particles"></div>

<div class="ink-transition" id="inkTransition"></div>

<div class="screen active" id="splashScreen">
  <div class="title">神话伴生</div>
  <div class="subtitle">中国古代神话 × 青少年心理陪伴</div>
  <div class="character-icon" style="margin-bottom: 2rem;">⚡</div>
  <button class="btn btn-primary" onclick="goToScreen('introScreen')">开启灵契</button>
  <div class="instruction">单局体验约10分钟，轻量无负担</div>
</div>

<div class="screen" id="introScreen">
  <div class="card">
    <div class="card-header">关于神话伴生</div>
    <div class="card-body">
      <p>在古老的东方神话中，每一位神祇都承载着一种精神力量。</p>
      <p>他们历经千年，等待着与有缘人建立灵契，成为你的精神伙伴。</p>
      <p>通过情绪感应，你将匹配到与自己心灵相契的神话人物。完成他们的精神试炼，领悟品质的力量，在沉浸式体验中获得陪伴与成长。</p>
    </div>
    <button class="btn btn-primary" style="width: 100%; margin-top: 20px;" onclick="goToScreen('testScreen')">开始感应</button>
  </div>
</div>

<div class="screen" id="testScreen">
  <div class="card">
    <div class="card-header">心之感应</div>
    <div class="progress-bar">
      <div class="progress-fill" id="testProgress"></div>
    </div>
    <div class="question-text" id="questionText"></div>
    <div id="optionsContainer"></div>
    <div class="instruction" id="testInstruction"></div>
  </div>
</div>

<div class="screen" id="revealScreen">
  <div class="character-card">
    <div class="character-icon" id="revealIcon"></div>
    <div class="character-name" id="revealName"></div>
    <div class="character-quality" id="revealQuality"></div>
    <div class="character-desc" id="revealDesc"></div>
    <div style="margin-top: 20px;">
      <span style="color: rgba(245, 245, 220, 0.7);">你的精神印记：</span>
      <div class="spiritual-mark" id="revealMark"></div>
    </div>
    <button class="btn btn-primary" style="margin-top: 24px;" onclick="startTrial()">开始试炼</button>
  </div>
</div>

<div class="screen" id="trialScreen">
  <div class="card">
    <div class="card-header">精神试炼</div>
    <div class="trial-story" id="trialStory"></div>
    <div id="trialOptions"></div>
  </div>
</div>

<div class="screen" id="rewardScreen">
  <div class="card">
    <div class="card-header">试炼完成</div>
    <div class="spiritual-mark" id="rewardMark" style="margin: 20px auto;"></div>
    <div style="text-align: center; margin-bottom: 20px;">
      <p style="font-size: 1.2rem; color: var(--gold); margin-bottom: 8px;">品质领悟：</p>
      <p style="font-size: 1rem; color: var(--paper-white);" id="rewardText"></p>
    </div>
    <div class="quality-graph" id="qualityGraph"></div>
    <button class="btn btn-primary" style="width: 100%; margin-top: 24px;" onclick="goToScreen('hubScreen')">前往陪伴中心</button>
  </div>
</div>

<div class="screen" id="hubScreen">
  <div class="companion-hub">
    <div class="hub-header">
      <div class="hub-avatar" id="hubAvatar"></div>
      <div class="hub-info">
        <div class="hub-name" id="hubName"></div>
        <div class="hub-date" id="hubDate"></div>
      </div>
    </div>
    
    <div class="section-title">今日问候</div>
    <div class="greeting-card" id="greetingCard">
      <div class="greeting-emoji" id="greetingEmoji"></div>
      <div class="greeting-text" id="greetingText"></div>
      <div class="greeting-author" id="greetingAuthor"></div>
    </div>
    
    <div class="section-title">品质图谱</div>
    <div class="quality-graph" id="hubQualityGraph"></div>
    
    <div class="section-title">情绪日记</div>
    <div class="mood-diary">
      <div class="diary-label">记录今天的心情...</div>
      <textarea class="diary-input" id="diaryInput" placeholder="今天发生了什么？你的感受如何？"></textarea>
      <button class="btn btn-secondary" style="width: 100%; margin-top: 12px;" onclick="saveDiary()">保存日记</button>
    </div>
    
    <div class="section-title">日记回顾</div>
    <div class="diary-history" id="diaryHistory"></div>
    
    <button class="btn btn-outline" style="width: 100%; margin-top: 20px;" onclick="goToScreen('testScreen')">重新感应</button>
  </div>
</div>

<script>
const characters = {
  nezha: {
    name: '哪吒',
    icon: '⚡',
    quality: '勇气',
    mark: '勇',
    desc: '脚踏风火轮，手持乾坤圈，他是打破陈规的少年英雄。面对命运的束缚，他选择抗争到底，用勇气照亮前行的道路。',
    greeting: '今天也要像我一样，勇敢地面对挑战哦！',
    quotes: [
      '我命由我不由天！',
      '勇气不是无所畏惧，而是明知害怕依然前行。',
      '即使被误解，也要坚持做正确的事。'
    ]
  },
  change: {
    name: '嫦娥',
    icon: '🌙',
    quality: '坚守',
    mark: '守',
    desc: '独居于广寒宫，她用千年时光诠释着坚守的意义。孤独不是寂寞，而是在寂静中守护内心的纯净与美好。',
    greeting: '愿你如明月般宁静，守住心中的那份美好。',
    quotes: [
      '孤独是灵魂的修行，坚守是内心的力量。',
      '在寂静中，才能听见内心的声音。',
      '坚持自己的选择，即使这条路只有你一人。'
    ]
  },
  sunwukong: {
    name: '孙悟空',
    icon: '🐒',
    quality: '成长',
    mark: '悟',
    desc: '从花果山的美猴王到西天取经的斗战胜佛，他历经九九八十一难，终于明白真正的力量来自内心的成长与觉悟。',
    greeting: '取经路漫漫，成长无止境，今天你又进步了吗？',
    quotes: [
      '强者不是战胜他人，而是超越自己。',
      '每一次跌倒，都是为了更好地站起来。',
      '成长的路上没有捷径，但每一步都算数。'
    ]
  }
};

const questions = [
  {
    text: '当你被误解时，你会怎么做？',
    options: [
      { text: '据理力争，证明自己的清白', score: { nezha: 3, change: 1, sunwukong: 2 } },
      { text: '默默忍受，时间会证明一切', score: { nezha: 1, change: 3, sunwukong: 2 } },
      { text: '反思自己，看看是否有改进的地方', score: { nezha: 2, change: 2, sunwukong: 3 } }
    ]
  },
  {
    text: '面对困难和挑战，你的第一反应是？',
    options: [
      { text: '迎难而上，主动出击', score: { nezha: 3, change: 1, sunwukong: 2 } },
      { text: '冷静观察，等待时机', score: { nezha: 1, change: 3, sunwukong: 2 } },
      { text: '寻求帮助，共同解决', score: { nezha: 2, change: 2, sunwukong: 3 } }
    ]
  },
  {
    text: '如果可以拥有一种超能力，你希望是？',
    options: [
      { text: '瞬间移动，想去哪里就去哪里', score: { nezha: 3, change: 1, sunwukong: 2 } },
      { text: '读心术，了解他人的想法', score: { nezha: 2, change: 2, sunwukong: 3 } },
      { text: '时间停止，让一切都慢下来', score: { nezha: 1, change: 3, sunwukong: 1 } }
    ]
  },
  {
    text: '你最喜欢的一句话是？',
    options: [
      { text: '我命由我不由天', score: { nezha: 3, change: 1, sunwukong: 2 } },
      { text: '宁静致远', score: { nezha: 1, change: 3, sunwukong: 2 } },
      { text: '天生我材必有用', score: { nezha: 2, change: 2, sunwukong: 3 } }
    ]
  },
  {
    text: '当你感到孤独时，你会？',
    options: [
      { text: '找朋友倾诉', score: { nezha: 3, change: 1, sunwukong: 2 } },
      { text: '享受独处的时光', score: { nezha: 1, change: 3, sunwukong: 2 } },
      { text: '做一件喜欢的事转移注意力', score: { nezha: 2, change: 2, sunwukong: 3 } }
    ]
  }
];

const trials = {
  nezha: {
    story: '你来到了陈塘关，看到哪吒正在与天兵天将对峙。李靖举起玲珑宝塔，要收服自己的儿子。哪吒悲愤地说：「我剔骨还父，割肉还母，从此与李家一刀两断！」',
    question: '面对亲情的误解与束缚，你会选择？',
    options: [
      { text: '像哪吒一样，决裂反抗', result: '你选择了勇敢地反抗不公。哪吒赞许地说：「勇气不是冲动，而是在认清真相后依然选择坚持自我！」', quality: '勇气' },
      { text: '试图沟通，化解矛盾', result: '你选择了沟通。哪吒沉思片刻：「有时候对抗是必要的，但理解也同样重要。」', quality: '勇气' },
      { text: '暂时退让，等待时机', result: '你选择了隐忍。哪吒摇摇头：「退让不是懦弱，但有些事情必须勇敢面对！」', quality: '勇气' }
    ]
  },
  change: {
    story: '你来到了月宫，看到嫦娥独自坐在桂花树下。她望着人间，眼中流露出淡淡的忧伤。吴刚不停地砍着桂树，玉兔在一旁捣药，整个月宫寂静得可怕。',
    question: '面对千年的孤独，你会对嫦娥说？',
    options: [
      { text: '「离开这里吧，人间更温暖」', result: '嫦娥微微一笑：「人间虽好，但我有我的坚守。孤独也是一种美丽。」', quality: '坚守' },
      { text: '「你的等待终会有意义」', result: '嫦娥眼中闪过光芒：「谢谢你，坚守的意义不在于结果，而在于过程。」', quality: '坚守' },
      { text: '「享受当下的宁静」', result: '嫦娥深深点头：「你懂得了孤独的真谛。在寂静中，灵魂才能得到升华。」', quality: '坚守' }
    ]
  },
  sunwukong: {
    story: '你来到了五行山下，看到孙悟空被压在山下。五百年过去了，他不再是那个大闹天宫的美猴王，眼神中多了几分沧桑与沉思。',
    question: '面对漫长的囚禁，你会对孙悟空说？',
    options: [
      { text: '「振作起来，总会有机会的」', result: '孙悟空哈哈大笑：「好小子，有眼光！五百年算什么，这是我成长的必经之路！」', quality: '成长' },
      { text: '「反思过去，未来会更好」', result: '孙悟空若有所思：「是啊，大闹天宫不过是年少轻狂，真正的修行才刚刚开始。」', quality: '成长' },
      { text: '「我陪你一起等待」', result: '孙悟空感动地说：「好！有你这句话，这五百年就不算白过。成长的路上有同伴真好！」', quality: '成长' }
    ]
  }
};

const qualities = ['勇气', '坚守', '成长'];

let currentQuestionIndex = 0;
let scores = { nezha: 0, change: 0, sunwukong: 0 };
let matchedCharacter = null;
let unlockedQualities = [];
let diaryEntries = [];

function initParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 20; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.left = Math.random() * 100 + '%';
    particle.style.top = Math.random() * 100 + '%';
    particle.style.animationDelay = Math.random() * 5 + 's';
    particle.style.animationDuration = (8 + Math.random() * 7) + 's';
    container.appendChild(particle);
  }
  for (let i = 0; i < 3; i++) {
    const cloud = document.createElement('div');
    cloud.className = 'cloud';
    cloud.style.width = (150 + Math.random() * 100) + 'px';
    cloud.style.height = (80 + Math.random() * 50) + 'px';
    cloud.style.left = (Math.random() * 80 + 10) + '%';
    cloud.style.top = (Math.random() * 60 + 20) + '%';
    cloud.style.animationDelay = Math.random() * 10 + 's';
    container.appendChild(cloud);
  }
}

function goToScreen(screenId) {
  const ink = document.getElementById('inkTransition');
  ink.classList.add('active');
  setTimeout(() => {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
    ink.classList.remove('active');
  }, 300);
  
  if (screenId === 'testScreen') {
    startTest();
  } else if (screenId === 'hubScreen') {
    loadHub();
  }
}

function startTest() {
  currentQuestionIndex = 0;
  scores = { nezha: 0, change: 0, sunwukong: 0 };
  showQuestion();
}

function showQuestion() {
  const question = questions[currentQuestionIndex];
  document.getElementById('questionText').textContent = question.text;
  document.getElementById('testProgress').style.width = ((currentQuestionIndex + 1) / questions.length * 100) + '%';
  
  const optionsContainer = document.getElementById('optionsContainer');
  optionsContainer.innerHTML = '';
  
  question.options.forEach((option, index) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = option.text;
    btn.onclick = () => selectOption(index);
    optionsContainer.appendChild(btn);
  });
  
  document.getElementById('testInstruction').textContent = `第 ${currentQuestionIndex + 1} / ${questions.length} 题`;
}

function selectOption(index) {
  const buttons = document.querySelectorAll('.option-btn');
  buttons[index].classList.add('selected');
  
  const question = questions[currentQuestionIndex];
  const option = question.options[index];
  
  Object.keys(option.score).forEach(char => {
    scores[char] += option.score[char];
  });
  
  currentQuestionIndex++;
  
  setTimeout(() => {
    if (currentQuestionIndex < questions.length) {
      showQuestion();
    } else {
      matchCharacter();
    }
  }, 300);
}

function matchCharacter() {
  let maxScore = 0;
  let matched = 'nezha';
  
  Object.keys(scores).forEach(char => {
    if (scores[char] > maxScore) {
      maxScore = scores[char];
      matched = char;
    }
  });
  
  matchedCharacter = characters[matched];
  
  document.getElementById('revealIcon').textContent = matchedCharacter.icon;
  document.getElementById('revealName').textContent = matchedCharacter.name;
  document.getElementById('revealQuality').textContent = matchedCharacter.quality;
  document.getElementById('revealDesc').textContent = matchedCharacter.desc;
  document.getElementById('revealMark').textContent = matchedCharacter.mark;
  
  if (!unlockedQualities.includes(matchedCharacter.quality)) {
    unlockedQualities.push(matchedCharacter.quality);
    localStorage.setItem('unlockedQualities', JSON.stringify(unlockedQualities));
  }
  
  goToScreen('revealScreen');
}

function startTrial() {
  const trial = trials[Object.keys(characters).find(k => characters[k].name === matchedCharacter.name)];
  
  document.getElementById('trialStory').innerHTML = `${trial.story}<br><br><span class="story-highlight">${trial.question}</span>`;
  
  const optionsContainer = document.getElementById('trialOptions');
  optionsContainer.innerHTML = '';
  
  trial.options.forEach(option => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = option.text;
    btn.onclick = () => completeTrial(option);
    optionsContainer.appendChild(btn);
  });
  
  goToScreen('trialScreen');
}

function completeTrial(option) {
  document.getElementById('rewardMark').textContent = matchedCharacter.mark;
  document.getElementById('rewardText').textContent = option.result;
  
  const graph = document.getElementById('qualityGraph');
  graph.innerHTML = '';
  
  qualities.forEach(q => {
    const item = document.createElement('div');
    item.className = 'quality-item';
    const isUnlocked = unlockedQualities.includes(q);
    item.innerHTML = `
      <div class="quality-circle ${isUnlocked ? 'unlocked' : ''}">${isUnlocked ? getQualityEmoji(q) : '?'}</div>
      <div class="quality-name">${q}</div>
    `;
    graph.appendChild(item);
  });
  
  goToScreen('rewardScreen');
}

function getQualityEmoji(quality) {
  const map = { '勇气': '⚡', '坚守': '🌙', '成长': '🌱' };
  return map[quality] || '⭐';
}

function loadHub() {
  if (!matchedCharacter) {
    const saved = localStorage.getItem('matchedCharacter');
    if (saved) {
      matchedCharacter = JSON.parse(saved);
    } else {
      goToScreen('splashScreen');
      return;
    }
  }
  
  localStorage.setItem('matchedCharacter', JSON.stringify(matchedCharacter));
  
  document.getElementById('hubAvatar').textContent = matchedCharacter.icon;
  document.getElementById('hubName').textContent = matchedCharacter.name;
  
  const now = new Date();
  document.getElementById('hubDate').textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
  
  document.getElementById('greetingEmoji').textContent = matchedCharacter.icon;
  const dailyQuote = matchedCharacter.quotes[new Date().getDate() % matchedCharacter.quotes.length];
  document.getElementById('greetingText').textContent = dailyQuote;
  document.getElementById('greetingAuthor').textContent = `—— ${matchedCharacter.name}`;
  
  const savedQualities = localStorage.getItem('unlockedQualities');
  if (savedQualities) {
    unlockedQualities = JSON.parse(savedQualities);
  }
  
  const graph = document.getElementById('hubQualityGraph');
  graph.innerHTML = '';
  
  qualities.forEach(q => {
    const item = document.createElement('div');
    item.className = 'quality-item';
    const isUnlocked = unlockedQualities.includes(q);
    item.innerHTML = `
      <div class="quality-circle ${isUnlocked ? 'unlocked' : ''}">${isUnlocked ? getQualityEmoji(q) : '?'}</div>
      <div class="quality-name">${q}</div>
    `;
    graph.appendChild(item);
  });
  
  loadDiary();
}

function saveDiary() {
  const input = document.getElementById('diaryInput');
  const content = input.value.trim();
  
  if (!content) return;
  
  const entry = {
    date: new Date().toLocaleString(),
    content: content
  };
  
  diaryEntries.unshift(entry);
  localStorage.setItem('diaryEntries', JSON.stringify(diaryEntries));
  
  input.value = '';
  loadDiary();
}

function loadDiary() {
  const saved = localStorage.getItem('diaryEntries');
  if (saved) {
    diaryEntries = JSON.parse(saved);
  }
  
  const history = document.getElementById('diaryHistory');
  history.innerHTML = '';
  
  if (diaryEntries.length === 0) {
    history.innerHTML = '<div style="text-align: center; color: rgba(245, 245, 220, 0.5); padding: 20px;">还没有日记记录，写下你的心情吧~</div>';
    return;
  }
  
  diaryEntries.forEach(entry => {
    const item = document.createElement('div');
    item.className = 'diary-entry';
    item.innerHTML = `
      <div class="diary-date">${entry.date}</div>
      <div class="diary-content">${entry.content}</div>
    `;
    history.appendChild(item);
  });
}

initParticles();
if (localStorage.getItem('matchedCharacter')) {
  loadHub();
}
</script>

</html>
