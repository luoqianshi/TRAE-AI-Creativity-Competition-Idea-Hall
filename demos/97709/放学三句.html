<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>放学三句 · 家长安全话术生成器</title>
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --text-title: #1e293b;
      --text-body: #475569;
      --accent: #3b82f6;
      --accent-light: #dbeafe;
      --border: #e2e8f0;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 2px 8px rgba(0,0,0,0.05);
      --radius: 12px;
      --transition: all 0.3s ease;
      --font-title: 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .dark-mode {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --text-title: #f1f5f9;
      --text-body: #94a3b8;
      --accent: #60a5fa;
      --accent-light: #0c4a6e;
      --border: #334155;
      --shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-primary);
      color: var(--text-body);
      line-height: 1.6;
      transition: var(--transition);
      padding-bottom: 2rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      padding-top: 1rem;
    }

    h1 {
      font-family: var(--font-title);
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--text-title);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    h1::before {
      content: "🎒";
      font-size: 1.5rem;
    }

    .subtitle {
      font-size: 1.0625rem;
      opacity: 0.85;
      max-width: 600px;
      margin: 0 auto;
    }

    .theme-toggle {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent-light);
      color: var(--accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      box-shadow: var(--shadow);
      z-index: 100;
      transition: var(--transition);
      outline: none;
    }

    .theme-toggle:hover {
      transform: scale(1.05);
      background: var(--accent);
      color: white;
    }

    .input-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
      transition: var(--transition);
    }

    .input-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--text-title);
      font-size: 0.9375rem;
    }

    select {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text-title);
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
    }

    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .generate-btn {
      width: 100%;
      padding: 0.875rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.0625rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 0.5rem;
    }

    .generate-btn:hover:not(:disabled) {
      background: #2563eb;
      transform: translateY(-1px);
    }

    .generate-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .result-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      margin-top: 1.5rem;
      display: none;
      animation: fadeInUp 0.4s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-header {
      display: flex;
      align-items: center;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .result-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-title);
      margin-left: 0.5rem;
    }

    .sentence-list {
      list-style: none;
    }

    .sentence-item {
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
      background: rgba(59, 130, 246, 0.05);
      border-radius: 8px;
      border-left: 4px solid var(--accent);
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      font-size: 1.0625rem;
      line-height: 1.5;
      transition: var(--transition);
    }

    .sentence-item:hover {
      background: rgba(59, 130, 246, 0.1);
    }

    .sentence-number {
      font-weight: 700;
      color: var(--accent);
      min-width: 2rem;
      flex-shrink: 0;
      margin-top: 0.25rem;
    }

    .sentence-text {
      flex: 1;
      word-break: break-word;
    }

    .voice-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      background: var(--accent-light);
      color: var(--accent);
      border: none;
      padding: 0.375rem 0.75rem;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: var(--transition);
      font-weight: 600;
    }

    .voice-btn:hover:not(:disabled) {
      background: var(--accent);
      color: white;
    }

    .voice-wave {
      display: inline-block;
      width: 60px;
      height: 16px;
      margin-left: 0.5rem;
      vertical-align: middle;
      opacity: 0;
    }

    .wave-bar {
      display: inline-block;
      width: 4px;
      height: 100%;
      background: var(--accent);
      margin: 0 1px;
      border-radius: 2px;
      animation: wave 1.5s ease-in-out infinite;
    }

    .wave-bar:nth-child(1) { animation-delay: 0s; }
    .wave-bar:nth-child(2) { animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; }
    .wave-bar:nth-child(4) { animation-delay: 0.6s; }
    .wave-bar:nth-child(5) { animation-delay: 0.8s; }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.3); }
      50% { transform: scaleY(1); }
    }

    .tip-box {
      background: rgba(245, 158, 11, 0.1);
      border-left: 4px solid var(--warning);
      padding: 0.75rem 1rem;
      border-radius: 0 8px 8px 0;
      margin-top: 1.5rem;
      font-size: 0.9375rem;
      color: #d97706;
    }

    .tip-box strong {
      color: #b45309;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .container {
        padding: 1rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      .subtitle {
        font-size: 0.9375rem;
      }
      .input-section,
      .result-card {
        padding: 1.25rem;
      }
      .sentence-item {
        padding: 0.625rem 0.875rem;
        font-size: 0.9375rem;
      }
      .theme-toggle {
        width: 40px;
        height: 40px;
        font-size: 1.125rem;
      }
    }

    @media (max-width: 480px) {
      .result-header {
        flex-direction: column;
        text-align: center;
      }
      .result-title {
        margin-left: 0;
        margin-top: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="切换深色/浅色模式">☀️</button>

  <div class="container">
    <header>
      <h1>放学三句</h1>
      <p class="subtitle">输入孩子年级与场景，立刻生成3句孩子听得懂、记得住的安全口诀</p>
    </header>

    <section class="input-section">
      <div class="input-group">
        <label for="grade">孩子年级</label>
        <select id="grade">
          <option value="">请选择年级</option>
          <option value="1">一年级</option>
          <option value="2">二年级</option>
          <option value="3">三年级</option>
          <option value="4">四年级</option>
        </select>
      </div>

      <div class="input-group">
        <label for="scenario">常见场景</label>
        <select id="scenario">
          <option value="">请选择场景</option>
          <option value="gate">校门口接人</option>
          <option value="toilet">独自上厕所</option>
          <option value="woods">同学拉你去小树林</option>
          <option value="stranger">陌生人给糖/玩具</option>
          <option value="car">有人喊你名字让你上车</option>
          <option value="phone">接到陌生电话说“你爸妈出事了”</option>
        </select>
      </div>

      <button class="generate-btn" id="generateBtn">生成安全三句</button>
    </section>

    <section class="result-card" id="resultCard">
      <div class="result-header">
        <span>✅</span>
        <h2 class="result-title">为您的孩子生成的话术</h2>
      </div>
      <ol class="sentence-list" id="sentenceList">
        <!-- populated by JS -->
      </ol>
      <button class="voice-btn" id="voiceBtn">
        <span>听一句</span>
        <span class="voice-wave" id="voiceWave" style="display:none;">
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
        </span>
      </button>

      <div class="tip-box">
        💡 小贴士：每天放学路上和孩子一起念一遍，边说边做动作，3天就能记住！
      </div>
    </section>
  </div>

  <script>
    // 预设话术库（按年级+场景映射）
    const phraseBank = {
      '1-gate': [
        '看到不认识的人来接你，先停下！',
        '大声问：“我爸妈叫你来的吗？”',
        '如果对方答不上来，立刻往保安亭跑！'
      ],
      '1-toilet': [
        '上厕所前告诉老师或同学你要去哪',
        '门没锁好就不出去，听见奇怪声音马上敲门',
        '出来后马上回到教室，不跟任何人走'
      ],
      '1-woods': [
        '同学说“去小树林玩”，你摇摇头说“不行！”',
        '转身快步走回教室，边走边喊老师名字',
        '书包带子扯一扯，发出响声引起注意'
      ],
      '2-gate': [
        '陌生人递东西给你，手不动、头不低、脚后退',
        '立刻摸口袋里的家校联系卡，大声读出爸爸电话',
        '站在原地不动，等穿制服的保安叔叔来确认'
      ],
      '2-toilet': [
        '进厕所前数一数隔间有几个门开着',
        '关门后从底下缝隙看有没有脚影，有就马上开门喊人',
        '出来后对老师说：“我刚才检查过厕所安全啦！”'
      ],
      '2-woods': [
        '同学拉你手，你就说：“我要先问老师！”',
        '把书包挡在胸前，慢慢往后退三步',
        '边退边拍打书包侧边铃铛（如果没有，就用力拍三下）'
      ],
      '3-gate': [
        '陌生人说“你爸妈让我来接你”，别急着跟他走',
        '反问他：“我妈妈今天穿什么颜色衣服？”，答不出就报警',
        '掏出学生证翻到背面，上面有紧急联系人电话'
      ],
      '3-toilet': [
        '进门前看地面有没有水渍，有就换一间',
        '关门后检查门锁是否能反锁，不能就打开门缝留条缝',
        '出来后对同学说：“我们刚完成一次安全巡逻！”'
      ],
      '3-woods': [
        '同学说“秘密基地”，你回答：“我的秘密只告诉老师”',
        '拿出红领巾一角系在手腕当警报绳，拉紧就喊',
        '用铅笔在洗手池镜子上写“SOS”，擦掉前先拍照发给家长'
      ],
      '4-gate': [
        '陌生人说认识你爸妈，你回答：“请给我看他们的微信视频”',
        '打开手机录音功能，边走边说：“我现在和XX叔叔/阿姨在一起”',
        '走进附近小店买瓶水，让店员帮忙打电话给老师'
      ],
      '4-toilet': [
        '进门先扫一眼天花板角落有没有小黑点（摄像头）',
        '洗手时观察镜子里有没有人站在你身后超过3秒',
        '出来后对值日生说：“我发现厕所第3个隔间门锁坏了”'
      ],
      '4-woods': [
        '同学说“老师让我们去那边”，你回答：“请带我去找老师确认”',
        '掏出校园地图，指着医务室方向说：“我们要先去登记”',
        '用校牌边缘刮树皮留下划痕，同时默念家庭暗号'
      ]
    };

    // DOM elements
    const gradeSelect = document.getElementById('grade');
    const scenarioSelect = document.getElementById('scenario');
    const generateBtn = document.getElementById('generateBtn');
    const resultCard = document.getElementById('resultCard');
    const sentenceList = document.getElementById('sentenceList');
    const voiceBtn = document.getElementById('voiceBtn');
    const voiceWave = document.getElementById('voiceWave');
    const themeToggle = document.getElementById('themeToggle');

    // Theme toggle
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      themeToggle.innerHTML = isDark ? '🌙' : '☀️';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // Load saved theme
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.body.classList.add('dark-mode');
      themeToggle.innerHTML = '🌙';
    }

    // Generate phrases
    generateBtn.addEventListener('click', () => {
      const grade = gradeSelect.value;
      const scenario = scenarioSelect.value;

      if (!grade || !scenario) {
        alert('请先选择年级和场景');
        return;
      }

      const key = `${grade}-${scenario}`;
      const sentences = phraseBank[key] || phraseBank['1-gate']; // fallback

      sentenceList.innerHTML = '';
      sentences.forEach((sentence, i) => {
        const li = document.createElement('li');
        li.className = 'sentence-item';
        li.innerHTML = `
          <span class="sentence-number">${i + 1}.</span>
          <span class="sentence-text">${sentence}</span>
        `;
        sentenceList.appendChild(li);
      });

      resultCard.style.display = 'block';
      // Scroll to result
      resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    // Voice button simulation
    voiceBtn.addEventListener('click', () => {
      voiceWave.style.display = 'inline-block';
      voiceWave.style.opacity = '1';

      // Reset after animation
      setTimeout(() => {
        voiceWave.style.opacity = '0';
        setTimeout(() => {
          voiceWave.style.display = 'none';
        }, 300);
      }, 2000);
    });

    // Prevent default form submission
    document.querySelector('.input-section').addEventListener('submit', e => e.preventDefault());
  </script>
</body>
</html>
