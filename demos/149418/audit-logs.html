<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Hub — 操作日志</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-primary: #ffffff; --bg-secondary: #f8f9fb; --bg-tertiary: #f1f3f7;
      --bg-input: #ffffff; --border-default: #e2e5ed; --border-hover: #c8ccd6;
      --border-focus: #5E6AD2; --text-primary: #1a1d27; --text-secondary: #5f6577;
      --text-tertiary: #9498a8; --accent: #5E6AD2; --accent-hover: #4b57c0;
      --accent-subtle: rgba(94,106,210,0.08); --danger: #e5484d;
      --success: #30a46c; --warning: #f5a623; --info: #2684ff;
    }
    html, body {
      height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary); color: var(--text-primary);
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    .bg-grid {
      position: fixed; inset: 0;
      background-image: linear-gradient(rgba(94,106,210,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(94,106,210,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, black 20%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, black 20%, transparent 100%);
      z-index: 0; pointer-events: none;
    }
    .bg-gradient {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(94,106,210,0.05), transparent 60%);
      z-index: 0; pointer-events: none;
    }
    .app { position: relative; z-index: 1; display: flex; min-height: 100vh; }
    .sidebar {
      width: 240px; border-right: 1px solid var(--border-default);
      background: var(--bg-secondary); display: flex; flex-direction: column;
      flex-shrink: 0; position: fixed; top: 0; left: 0; bottom: 0; z-index: 50;
    }
    .sidebar-header {
      display: flex; align-items: center; gap: 12px; padding: 16px 20px;
      border-bottom: 1px solid var(--border-default);
    }
    .sidebar-logo {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .sidebar-logo svg { width: 18px; height: 18px; fill: white; }
    .sidebar-brand { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
    .sidebar-nav { flex: 1; padding: 12px; overflow-y: auto; }
    .nav-section { margin-bottom: 16px; }
    .nav-section-title {
      font-size: 11px; font-weight: 500; color: var(--text-tertiary);
      text-transform: uppercase; letter-spacing: 0.05em;
      padding: 0 8px; margin-bottom: 6px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px;
      border-radius: 8px; font-size: 13px; font-weight: 500;
      color: var(--text-secondary); text-decoration: none; cursor: pointer;
      transition: all 0.15s ease; border: none; background: none;
      width: 100%; text-align: left; font-family: inherit;
    }
    .nav-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .nav-item.active { background: var(--accent-subtle); color: var(--accent); }
    .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
    .nav-badge {
      margin-left: auto; font-size: 11px; padding: 1px 6px; border-radius: 10px;
      background: var(--accent-subtle); color: var(--accent); font-weight: 500;
    }
    .sidebar-footer { padding: 12px; border-top: 1px solid var(--border-default); }
    .sidebar-user {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px;
      border-radius: 8px; cursor: pointer; transition: background 0.15s ease;
    }
    .sidebar-user:hover { background: var(--bg-tertiary); }
    .sidebar-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; color: white; flex-shrink: 0;
    }
    .sidebar-user-info { flex: 1; min-width: 0; }
    .sidebar-user-name {
      font-size: 13px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sidebar-user-role { font-size: 11px; color: var(--text-tertiary); }
    .table-action-btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; border: none; background: transparent; color: var(--text-tertiary); cursor: pointer; transition: all 0.15s ease; }
    .table-action-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .table-action-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .table-action-btn svg { width: 14px; height: 14px; }
    .main { flex: 1; margin-left: 240px; display: flex; flex-direction: column; min-height: 100vh; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      height: 64px; padding: 0 24px; border-bottom: 1px solid var(--border-default);
      background: rgba(255,255,255,0.85); backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 40;
    }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .topbar-breadcrumb { font-size: 14px; font-weight: 500; color: var(--text-secondary); }
    .topbar-breadcrumb span { color: var(--text-primary); font-weight: 600; }
    .topbar-center { flex: 1; max-width: 400px; margin: 0 24px; }
    .search-box { position: relative; width: 100%; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-tertiary); pointer-events: none; }
    .search-input { width: 100%; height: 36px; padding: 0 14px 0 38px; font-family: inherit; font-size: 13px; color: var(--text-primary); background: var(--bg-input); border: 1px solid var(--border-default); border-radius: 8px; outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease; }
    .search-input::placeholder { color: var(--text-tertiary); }
    .search-input:hover { border-color: var(--border-hover); }
    .search-input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--accent-subtle); }
    .topbar-right { display: flex; align-items: center; gap: 8px; }
    .topbar-btn { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 8px; border: none; background: transparent; color: var(--text-secondary); cursor: pointer; transition: background 0.15s ease, color 0.15s ease; position: relative; }
    .topbar-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .topbar-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .topbar-btn svg { width: 18px; height: 18px; }
    .topbar-btn .dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); border: 2px solid var(--bg-primary); }
    .content { flex: 1; padding: 24px; }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card {
      padding: 20px; border-radius: 12px; border: 1px solid var(--border-default);
      background: var(--bg-secondary);
    }
    .stat-label { font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .stat-value.info { color: var(--info); }
    .stat-value.success { color: var(--success); }
    .stat-value.warning { color: var(--warning); }
    .stat-value.danger { color: var(--danger); }
    .stat-trend { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; }

    /* Filters */
    .filter-bar {
      display: flex; align-items: center; gap: 12px; padding: 16px;
      border-radius: 12px; border: 1px solid var(--border-default);
      background: var(--bg-secondary); margin-bottom: 24px; flex-wrap: wrap;
    }
    .filter-group { display: flex; align-items: center; gap: 6px; }
    .filter-label { font-size: 12px; color: var(--text-tertiary); font-weight: 500; white-space: nowrap; }
    .filter-select, .filter-input {
      height: 34px; padding: 0 12px; font-family: inherit; font-size: 13px;
      color: var(--text-primary); background: var(--bg-input);
      border: 1px solid var(--border-default); border-radius: 8px; outline: none;
      transition: border-color 0.15s ease;
    }
    .filter-select:hover, .filter-input:hover { border-color: var(--border-hover); }
    .filter-select:focus, .filter-input:focus {
      border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--accent-subtle);
    }
    .filter-input { width: 240px; }
    .filter-spacer { flex: 1; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 0 14px;
      height: 34px; font-family: inherit; font-size: 13px; font-weight: 500;
      border-radius: 8px; cursor: pointer; transition: all 0.15s ease;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: var(--accent); color: white; border-color: var(--accent);
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn:active { transform: scale(0.98); }
    .btn-ghost {
      background: transparent; color: var(--text-secondary);
      border-color: var(--border-default);
    }
    .btn-ghost:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .btn svg { width: 14px; height: 14px; }

    /* Table */
    .table-card {
      border-radius: 12px; border: 1px solid var(--border-default);
      background: var(--bg-secondary); overflow: hidden;
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: 12px 16px; font-size: 12px; font-weight: 500;
      color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.04em;
      background: var(--bg-tertiary); border-bottom: 1px solid var(--border-default);
      white-space: nowrap;
    }
    td {
      padding: 12px 16px; font-size: 13px; color: var(--text-primary);
      border-bottom: 1px solid var(--border-default);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(94,106,210,0.03); }
    .log-action { font-weight: 500; }
    .log-action.create { color: var(--success); }
    .log-action.update { color: var(--info); }
    .log-action.delete { color: var(--danger); }
    .log-action.login { color: var(--accent); }
    .log-action.export { color: var(--warning); }
    .log-module {
      display: inline-flex; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 500; background: var(--bg-tertiary);
      color: var(--text-tertiary); border: 1px solid var(--border-default);
    }
    .log-detail { color: var(--text-secondary); max-width: 320px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .log-ip { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-tertiary); }
    .log-time { font-size: 12px; color: var(--text-tertiary); white-space: nowrap; }
    .log-user { display: flex; align-items: center; gap: 8px; }
    .log-user-avatar {
      width: 24px; height: 24px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 600; color: white; flex-shrink: 0;
    }
    .log-user-name { font-size: 13px; font-weight: 500; }

    /* Pagination */
    .pagination {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-top: 1px solid var(--border-default);
    }
    .pagination-info { font-size: 12px; color: var(--text-tertiary); }
    .pagination-pages { display: flex; gap: 4px; }
    .page-btn {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      border-radius: 6px; font-size: 13px; font-weight: 500;
      border: 1px solid var(--border-default); background: var(--bg-input);
      color: var(--text-secondary); cursor: pointer; transition: all 0.15s ease;
      font-family: inherit;
    }
    .page-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }
    .page-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .page-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .page-btn svg { width: 14px; height: 14px; }

    /* Toast */
    .toast-container { position: fixed; top: 80px; right: 24px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      display: flex; align-items: center; gap: 10px; padding: 12px 16px;
      border-radius: 10px; background: var(--bg-primary); border: 1px solid var(--border-default);
      box-shadow: 0 4px 16px rgba(0,0,0,0.08); font-size: 13px; color: var(--text-primary);
      animation: toast-in 0.25s cubic-bezier(0.23,1,0.32,1);
      min-width: 280px;
    }
    .toast.removing { animation: toast-out 0.2s cubic-bezier(0.23,1,0.32,1) forwards; }
    .toast-icon { width: 18px; height: 18px; flex-shrink: 0; }
    .toast-icon.success { color: var(--success); }
    .toast-icon.error { color: var(--danger); }
    @keyframes toast-in { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes toast-out { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(40px); } }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 200;
      display: none; align-items: center; justify-content: center;
      animation: fade-in 0.2s ease;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--bg-primary); border: 1px solid var(--border-default);
      border-radius: 16px; width: 560px; max-height: 80vh; overflow-y: auto;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12); animation: modal-in 0.25s cubic-bezier(0.23,1,0.32,1);
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px; border-bottom: 1px solid var(--border-default);
    }
    .modal-title { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
    .modal-close {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      border-radius: 8px; border: none; background: transparent; color: var(--text-secondary);
      cursor: pointer; transition: all 0.15s ease;
    }
    .modal-close:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .modal-close svg { width: 18px; height: 18px; }
    .modal-body { padding: 24px; }
    .modal-footer {
      display: flex; justify-content: flex-end; gap: 8px;
      padding: 16px 24px; border-top: 1px solid var(--border-default);
    }
    .detail-grid { display: grid; gap: 16px; }
    .detail-row { display: flex; gap: 12px; }
    .detail-key { font-size: 12px; color: var(--text-tertiary); width: 80px; flex-shrink: 0; padding-top: 2px; }
    .detail-val { font-size: 13px; color: var(--text-primary); flex: 1; }
    .detail-val.code {
      font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px;
      background: var(--bg-tertiary); padding: 8px 12px; border-radius: 6px;
      white-space: pre-wrap; word-break: break-all;
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modal-in { from { opacity: 0; transform: scale(0.96) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-grid"></div>

  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"></polygon>
            <line x1="12" y1="22" x2="12" y2="15.5"></line>

      <nav class="sidebar-nav">

            工作台
          </a>
          <a href="skill-hub-light.html" class="nav-item">

        </div>
        <div class="nav-section">
          <div class="nav-section-title">管理</div>
          <a href="skills.html" class="nav-item">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11.5 2.5l2 2L5 13H3v-2z"></path><path d="M8 5l3 3"></path></svg>

          </a>
          <a href="users.html" class="nav-item">

        </div>
        <div class="nav-section">
          <div class="nav-section-title">设置</div>
          <a href="system-settings.html" class="nav-item">

            系统设置
          </a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-avatar">A</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name">Admin</div>
            <div class="sidebar-user-role">系统管理员</div>
          </div>
          <button class="table-action-btn" style="flex-shrink:0;margin-left:4px;" onclick="handleLogout()" title="退出登录" aria-label="退出登录">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h6"></path><path d="M11 8h4"></path><path d="M13 6l2 2-2 2"></path></svg>
          </button>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-breadcrumb">首页 / <span>操作日志</span></div>
        </div>

        <div class="topbar-center">
          
        </div>

        <div class="topbar-right">
          <button class="topbar-btn" title="通知">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

          </button>
          <button class="topbar-btn" title="帮助">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <circle cx="8" cy="8" r="6"></circle>
              <path d="M6.5 6.5a1.5 1.5 0 0 1 3 0c0 1-1.5 1.5-1.5 2.5"></path>

          </button>
        </div>
      </header>

      <div class="content">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
          <div>
            <h1 style="font-size:20px;font-weight:600;letter-spacing:-0.02em;">操作日志</h1>
            <p style="font-size:13px;color:var(--text-secondary);margin-top:4px;">查看系统操作记录和审计信息</p>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <button class="btn btn-ghost" onclick="showToast('日志已刷新', 'success')">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8a6 6 0 0 1 10.47-4"></path><path d="M14 8a6 6 0 0 1-10.47 4"></path><path d="M12 1v4h-4"></path><path d="M4 15v-4h4"></path></svg>
              刷新
            </button>
            <button class="btn btn-primary" onclick="showToast('导出成功，共 256 条记录', 'success')">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 10V3"></path><path d="M5 6l3 3 3-3"></path><path d="M2 10v3a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-3"></path></svg>
              导出日志
            </button>
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">今日操作</div>
            <div class="stat-value info">128</div>
            <div class="stat-trend">较昨日 +12%</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">成功操作</div>
            <div class="stat-value success">124</div>
            <div class="stat-trend">成功率 96.9%</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">失败操作</div>
            <div class="stat-value warning">4</div>
            <div class="stat-trend">需关注</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">敏感操作</div>
            <div class="stat-value danger">3</div>
            <div class="stat-trend">删除 / 权限变更</div>
          </div>
        </div>

        <div class="filter-bar">
          <div class="filter-group">
            <span class="filter-label">操作类型</span>
            <select class="filter-select" id="filterType">
              <option value="">全部</option>
              <option value="create">创建</option>
              <option value="update">更新</option>
              <option value="delete">删除</option>
              <option value="login">登录</option>
              <option value="export">导出</option>
            </select>
          </div>
          <div class="filter-group">
            <span class="filter-label">模块</span>
            <select class="filter-select" id="filterModule">
              <option value="">全部</option>
              <option>技能管理</option>
              <option>用户管理</option>
              <option>系统设置</option>
              <option>角色管理</option>
            </select>
          </div>
          <div class="filter-group">
            <span class="filter-label">操作人</span>
            <input class="filter-input" placeholder="搜索用户名" style="width:160px;" id="filterUser">
          </div>
          <div class="filter-group">
            <span class="filter-label">时间</span>
            <select class="filter-select" id="filterTime">
              <option value="today">今天</option>
              <option value="week">本周</option>
              <option value="month" selected="">本月</option>
              <option value="custom">自定义</option>
            </select>
          </div>
          <div class="filter-spacer"></div>
          <button class="btn btn-ghost" onclick="resetFilters()">重置</button>
          <button class="btn btn-primary" onclick="applyFilters()">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4"></circle><path d="M10 10l3 3"></path></svg>
            查询
          </button>
        </div>

        <div class="table-card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width:40px;"><input type="checkbox" id="checkAll" onchange="toggleAll(this)"></th>
                  <th>操作类型</th>
                  <th>模块</th>
                  <th>详情</th>
                  <th>操作人</th>
                  <th>IP 地址</th>
                  <th>时间</th>
                  <th style="width:80px;">操作</th>
                </tr>
              </thead>
              <tbody id="logTableBody">
              </tbody>
            </table>
          </div>
          <div class="pagination">
            <div class="pagination-info">显示 1-15 条，共 256 条记录</div>
            <div class="pagination-pages">
              <button class="page-btn" disabled="">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3l-5 5 5 5"></path></svg>
              </button>
              <button class="page-btn active">1</button>
              <button class="page-btn">2</button>
              <button class="page-btn">3</button>
              <button class="page-btn">...</button>
              <button class="page-btn">18</button>
              <button class="page-btn">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3l5 5-5 5"></path></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">日志详情</div>
        <button class="modal-close" onclick="closeDetail()">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4l8 8M12 4l-8 8"></path></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="detail-grid" id="detailContent"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeDetail()">关闭</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const logData = [
      { type:'create', cls:'create', module:'技能管理', detail:'创建技能 "AI 幻灯片生成器"', user:'张三', ip:'192.168.1.101', time:'2026-06-11 14:32:15', reqBody:'POST /api/skills\n{\n  "name": "AI 幻灯片生成器",\n  "mode": "deck",\n  "runtime": "claude"\n}' },
      { type:'update', cls:'update', module:'用户管理', detail:'修改用户 "李四" 角色为编辑者', user:'Admin', ip:'192.168.1.1', time:'2026-06-11 14:28:03', reqBody:'PUT /api/users/42\n{\n  "roleId": "editor"\n}' },
      { type:'login', cls:'login', module:'用户管理', detail:'用户 "王五" 登录系统', user:'王五', ip:'10.0.0.55', time:'2026-06-11 14:15:42', reqBody:'POST /api/auth/login\n{\n  "username": "wangwu"\n}' },
      { type:'delete', cls:'delete', module:'技能管理', detail:'删除技能 "旧版原型工具"', user:'Admin', ip:'192.168.1.1', time:'2026-06-11 13:58:11', reqBody:'DELETE /api/skills/15' },
      { type:'create', cls:'create', module:'角色管理', detail:'创建角色 "技能审核员"', user:'Admin', ip:'192.168.1.1', time:'2026-06-11 13:42:08', reqBody:'POST /api/roles\n{\n  "name": "技能审核员",\n  "permissions": ["skill:read","skill:review"]\n}' },
      { type:'update', cls:'update', module:'系统设置', detail:'更新系统配置：启用双因素认证', user:'Admin', ip:'192.168.1.1', time:'2026-06-11 13:30:55', reqBody:'PUT /api/settings/security\n{\n  "twoFactorAuth": true\n}' },
      { type:'export', cls:'export', module:'用户管理', detail:'导出用户列表（共 48 条）', user:'张三', ip:'192.168.1.101', time:'2026-06-11 12:55:20', reqBody:'GET /api/users/export?format=csv' },
      { type:'create', cls:'create', module:'技能管理', detail:'上传技能包 "video-creator v2.1"', user:'李四', ip:'192.168.1.88', time:'2026-06-11 12:40:33', reqBody:'POST /api/skills/upload\n{\n  "file": "video-creator-v2.1.zip",\n  "version": "2.1.0"\n}' },
      { type:'update', cls:'update', module:'技能管理', detail:'更新技能 "数据看板" 配置参数', user:'张三', ip:'192.168.1.101', time:'2026-06-11 11:22:17', reqBody:'PUT /api/skills/8/config\n{\n  "maxTokens": 4096,\n  "timeout": 120\n}' },
      { type:'login', cls:'login', module:'用户管理', detail:'用户 "Admin" 登录系统', user:'Admin', ip:'192.168.1.1', time:'2026-06-11 11:05:00', reqBody:'POST /api/auth/login\n{\n  "username": "admin"\n}' },
      { type:'delete', cls:'delete', module:'用户管理', detail:'禁用用户 "test001"', user:'Admin', ip:'192.168.1.1', time:'2026-06-11 10:48:32', reqBody:'PUT /api/users/99/status\n{\n  "enabled": false\n}' },
      { type:'update', cls:'update', module:'角色管理', detail:'修改角色 "访客" 权限：移除 skill:delete', user:'Admin', ip:'192.168.1.1', time:'2026-06-11 10:30:15', reqBody:'PUT /api/roles/guest\n{\n  "permissions": ["skill:read"]\n}' },
      { type:'create', cls:'create', module:'系统设置', detail:'新增 API 密钥 "prod-key-001"', user:'Admin', ip:'192.168.1.1', time:'2026-06-11 10:12:44', reqBody:'POST /api/settings/api-keys\n{\n  "name": "prod-key-001",\n  "scope": "read"\n}' },
      { type:'export', cls:'export', module:'操作日志', detail:'导出操作日志（本月）', user:'张三', ip:'192.168.1.101', time:'2026-06-11 09:55:28', reqBody:'GET /api/audit-logs/export?range=month' },
      { type:'update', cls:'update', module:'技能管理', detail:'发布技能 "AI 幻灯片生成器" v1.0.0', user:'张三', ip:'192.168.1.101', time:'2026-06-11 09:30:10', reqBody:'POST /api/skills/20/publish\n{\n  "version": "1.0.0"\n}' },
    ];

    function renderTable(data) {
      const tbody = document.getElementById('logTableBody');
      tbody.innerHTML = data.map((r, i) => `
        <tr>
          <td><input type="checkbox" data-idx="${i}" /></td>
          <td><span class="log-action ${r.cls}">${r.type}</span></td>
          <td><span class="log-module">${r.module}</span></td>
          <td class="log-detail">${r.detail}</td>
          <td>
            <div class="log-user">
              <div class="log-user-avatar">${r.user[0]}</div>
              <span class="log-user-name">${r.user}</span>
            </div>
          </td>
          <td class="log-ip">${r.ip}</td>
          <td class="log-time">${r.time}</td>
          <td><button class="btn btn-ghost" style="height:28px;padding:0 8px;font-size:12px;" onclick="showDetail(${i})">详情</button></td>
        </tr>
      `).join('');
    }

    function showDetail(idx) {
      const r = logData[idx];
      document.getElementById('detailContent').innerHTML = `
        <div class="detail-row"><div class="detail-key">操作类型</div><div class="detail-val"><span class="log-action ${r.cls}">${r.type}</span></div></div>
        <div class="detail-row"><div class="detail-key">模块</div><div class="detail-val"><span class="log-module">${r.module}</span></div></div>
        <div class="detail-row"><div class="detail-key">详情</div><div class="detail-val">${r.detail}</div></div>
        <div class="detail-row"><div class="detail-key">操作人</div><div class="detail-val">${r.user}</div></div>
        <div class="detail-row"><div class="detail-key">IP 地址</div><div class="detail-val log-ip">${r.ip}</div></div>
        <div class="detail-row"><div class="detail-key">时间</div><div class="detail-val">${r.time}</div></div>
        <div class="detail-row"><div class="detail-key">请求体</div><div class="detail-val code">${r.reqBody}</div></div>
      `;
      document.getElementById('detailModal').classList.add('open');
    }

    function closeDetail() { document.getElementById('detailModal').classList.remove('open'); }
    document.getElementById('detailModal').addEventListener('click', function(e) {
      if (e.target === this) closeDetail();
    });

    function toggleAll(el) {
      document.querySelectorAll('#logTableBody input[type=checkbox]').forEach(cb => cb.checked = el.checked);
    }

    function applyFilters() {
      const type = document.getElementById('filterType').value;
      const module = document.getElementById('filterModule').value;
      const user = document.getElementById('filterUser').value.toLowerCase();
      let filtered = logData;
      if (type) filtered = filtered.filter(r => r.type === type);
      if (module) filtered = filtered.filter(r => r.module === module);
      if (user) filtered = filtered.filter(r => r.user.toLowerCase().includes(user));
      renderTable(filtered);
      showToast(`查询完成，共 ${filtered.length} 条记录`, 'success');
    }

    function resetFilters() {
      document.getElementById('filterType').value = '';
      document.getElementById('filterModule').value = '';
      document.getElementById('filterUser').value = '';
      document.getElementById('filterTime').value = 'month';
      renderTable(logData);
      showToast('筛选条件已重置', 'success');
    }

    let toastId = 0;
    function showToast(msg, type) {
      const id = ++toastId;
      const iconSvg = type === 'success'
        ? '<svg class="toast-icon success" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="9" r="7"/><path d="M6 9l2 2 4-4"/></svg>'
        : '<svg class="toast-icon error" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="9" r="7"/><path d="M6 6l6 6M12 6l-6 6"/></svg>';
      const el = document.createElement('div');
      el.className = 'toast';
      el.id = 'toast-' + id;
      el.innerHTML = iconSvg + '<span>' + msg + '</span>';
      document.getElementById('toastContainer').appendChild(el);
      setTimeout(() => {
        el.classList.add('removing');
        setTimeout(() => el.remove(), 200);
      }, 3000);
    }

    function handleLogout() {
      showToast(20, '正在退出登录...', 'success');
      setTimeout(() => window.location.href = 'login.html', 1000);
    }

    renderTable(logData);
  </script>


</body></html>
