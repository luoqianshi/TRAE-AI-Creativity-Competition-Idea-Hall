<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Hub — 技能中心</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f8f9fb;
      --bg-tertiary: #f1f3f7;
      --bg-input: #ffffff;
      --border-default: #e2e5ed;
      --border-hover: #c8ccd6;
      --border-focus: #5E6AD2;
      --text-primary: #1a1d27;
      --text-secondary: #5f6577;
      --text-tertiary: #9498a8;
      --accent: #5E6AD2;
      --accent-hover: #4b57c0;
      --accent-subtle: rgba(94, 106, 210, 0.08);
      --accent-glow: rgba(94, 106, 210, 0.12);
      --danger: #e5484d;
      --success: #30a46c;
      --warning: #f5a623;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(94, 106, 210, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(94, 106, 210, 0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, black 20%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, black 20%, transparent 100%);
      z-index: 0;
      pointer-events: none;
    }

    .bg-gradient {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(94, 106, 210, 0.05), transparent 60%);
      z-index: 0;
      pointer-events: none;
    }

    .app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topnav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      padding: 0 24px;
      border-bottom: 1px solid var(--border-default);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topnav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .topnav-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
      box-shadow: 0 0 0 1px rgba(94, 106, 210, 0.2), 0 4px 16px rgba(94, 106, 210, 0.15);
    }

    .topnav-logo svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    .topnav-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .topnav-center {
      flex: 1;
      max-width: 480px;
      margin: 0 24px;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-tertiary);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 38px;
      padding: 0 14px 0 38px;
      font-family: inherit;
      font-size: 13px;
      color: var(--text-primary);
      background: var(--bg-input);
      border: 1px solid var(--border-default);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search-input::placeholder {
      color: var(--text-tertiary);
    }

    .search-input:hover {
      border-color: var(--border-hover);
    }

    .search-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-subtle), 0 0 0 1px var(--accent);
    }

    .search-shortcut {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 6px;
      font-size: 11px;
      font-family: inherit;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-default);
      border-radius: 4px;
      color: var(--text-tertiary);
      pointer-events: none;
    }

    .topnav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .nav-btn:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .nav-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .nav-btn svg {
      width: 18px;
      height: 18px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      border: 2px solid var(--border-default);
      transition: border-color 0.15s ease;
    }

    .avatar:hover {
      border-color: var(--accent);
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-default);
      background: rgba(248, 249, 251, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-right: 4px;
      white-space: nowrap;
    }

    .filter-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--bg-tertiary);
      border: 1px solid var(--border-default);
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .filter-pill:hover {
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    .filter-pill:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .filter-pill:active {
      transform: scale(0.97);
    }

    .filter-pill.active {
      background: var(--accent-subtle);
      border-color: var(--accent);
      color: var(--accent);
    }

    .filter-pill svg {
      width: 14px;
      height: 14px;
    }

    .filter-divider {
      width: 1px;
      height: 20px;
      background: var(--border-default);
      flex-shrink: 0;
    }

    .results-count {
      margin-left: auto;
      font-size: 12px;
      color: var(--text-tertiary);
      white-space: nowrap;
    }

    .main {
      flex: 1;
      padding: 24px;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .section-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .skill-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }

    .skill-card {
      display: flex;
      flex-direction: column;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-default);
      background: var(--bg-secondary);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
      cursor: pointer;
    }

    .skill-card:hover {
      border-color: var(--border-hover);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      transform: translateY(-2px);
    }

    .skill-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .skill-card:active {
      transform: translateY(0);
    }

    .skill-card-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 12px;
    }

    .skill-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .skill-icon svg {
      width: 20px;
      height: 20px;
    }

    .skill-icon.prototype {
      background: rgba(94, 106, 210, 0.12);
      color: #5E6AD2;
    }

    .skill-icon.deck {
      background: rgba(245, 166, 35, 0.12);
      color: #d48a1e;
    }

    .skill-icon.image {
      background: rgba(48, 164, 108, 0.12);
      color: #258a5c;
    }

    .skill-icon.video {
      background: rgba(229, 72, 77, 0.12);
      color: #c93a3f;
    }

    .skill-icon.audio {
      background: rgba(160, 100, 220, 0.12);
      color: #8b5fcf;
    }

    .skill-icon.design-system {
      background: rgba(94, 180, 210, 0.12);
      color: #4a95b3;
    }

    .skill-info {
      flex: 1;
      min-width: 0;
    }

    .skill-name {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .skill-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .skill-tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 500;
      border-radius: 4px;
      background: var(--bg-tertiary);
      color: var(--text-tertiary);
      border: 1px solid var(--border-default);
    }

    .skill-tag.mode {
      background: var(--accent-subtle);
      color: var(--accent);
      border-color: transparent;
    }

    .skill-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border-default);
    }

    .skill-stats {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .skill-stat {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .skill-stat svg {
      width: 12px;
      height: 12px;
    }

    .skill-action {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 500;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .skill-action:hover {
      background: var(--accent-subtle);
    }

    .skill-action:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .skill-action:active {
      transform: scale(0.97);
    }

    .skill-action svg {
      width: 12px;
      height: 12px;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      text-align: center;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: var(--bg-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      color: var(--text-tertiary);
    }

    .empty-icon svg {
      width: 28px;
      height: 28px;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .empty-desc {
      font-size: 13px;
      color: var(--text-secondary);
      max-width: 320px;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 768px) {
      .topnav-center {
        display: none;
      }
      .skill-grid {
        grid-template-columns: 1fr;
      }
      .main {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-grid"></div>

  <div class="app">
    <nav class="topnav">
      <div class="topnav-left">
        <div class="topnav-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"></polygon>
            <line x1="12" y1="22" x2="12" y2="15.5"></line>
            <polyline points="22 8.5 12 15.5 2 8.5"></polyline>
            <polyline points="2 15.5 12 8.5 22 15.5"></polyline>
            <line x1="12" y1="2" x2="12" y2="8.5"></line>
          </svg>
        </div>
        <span class="topnav-title">Skill Hub</span>
      </div>

      <div class="topnav-center">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <circle cx="7" cy="7" r="4.5"></circle>
            <line x1="10.5" y1="10.5" x2="14" y2="14"></line>
          </svg>
          <input type="text" class="search-input" id="searchInput" placeholder="搜索技能..." oninput="handleSearch()">
          <span class="search-shortcut">/</span>
        </div>
      </div>

      <div class="topnav-right">
        
        <div class="avatar" title="用户">A</div>
      </div>
    </nav>

    <div class="filter-bar">
      <span class="filter-label">模式</span>
      <button class="filter-pill active" data-mode="all" onclick="setMode('all', this)">
        <svg viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="2" width="5" height="5" rx="1"></rect><rect x="9" y="2" width="5" height="5" rx="1"></rect><rect x="2" y="9" width="5" height="5" rx="1"></rect><rect x="9" y="9" width="5" height="5" rx="1"></rect></svg>
        全部
      </button>
      <button class="filter-pill" data-mode="prototype" onclick="setMode('prototype', this)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="2"></rect><line x1="6" y1="6" x2="10" y2="10"></line><line x1="10" y1="6" x2="6" y2="10"></line></svg>
        原型
      </button>
      <button class="filter-pill" data-mode="deck" onclick="setMode('deck', this)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="2" width="10" height="12" rx="1.5"></rect><line x1="6" y1="5" x2="10" y2="5"></line><line x1="6" y1="8" x2="10" y2="8"></line><line x1="6" y1="11" x2="8" y2="11"></line></svg>
        幻灯片
      </button>
      <button class="filter-pill" data-mode="image" onclick="setMode('image', this)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="12" height="12" rx="2"></rect><circle cx="5.5" cy="5.5" r="1.5"></circle><path d="m14 10-3-3-5 5"></path></svg>
        图片
      </button>
      <button class="filter-pill" data-mode="video" onclick="setMode('video', this)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="2"></rect><polygon points="6.5 6 6.5 10 10.5 8"></polygon></svg>
        视频
      </button>
      <button class="filter-pill" data-mode="audio" onclick="setMode('audio', this)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13V5.5a1.5 1.5 0 0 1 3 0V13"></path><path d="M11 10.5V3.5a1.5 1.5 0 0 1 3 0v7"></path><path d="M4 14h5"></path><path d="M10 11.5h4"></path></svg>
        音频
      </button>

      <div class="filter-divider"></div>

      <span class="filter-label">场景</span>
      <button class="filter-pill" data-scenario="marketing" onclick="toggleScenario('marketing', this)">营销</button>
      <button class="filter-pill" data-scenario="product" onclick="toggleScenario('product', this)">产品</button>
      <button class="filter-pill" data-scenario="engineering" onclick="toggleScenario('engineering', this)">工程</button>

      <span class="results-count" id="resultsCount">12 个技能</span>
    </div>

    <main class="main">
      <div class="section-header">
        <div>
          <h2 class="section-title">推荐技能</h2>
          <p class="section-subtitle">精选热门技能，快速开始你的下一个项目</p>
        </div>
      </div>

      <div class="skill-grid" id="featuredGrid"></div>

      <div class="section-header">
        <div>
          <h2 class="section-title">全部技能</h2>
          <p class="section-subtitle">浏览完整的技能库</p>
        </div>
      </div>

      <div class="skill-grid" id="allGrid"></div>

      <div class="empty-state" id="emptyState" style="display: none;">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
        </div>
        <h3 class="empty-title">未找到匹配的技能</h3>
        <p class="empty-desc">尝试调整筛选条件或搜索关键词</p>
      </div>
    </main>
  </div>

  <script>
    const skills = [
      { id: 1, name: 'Landing Page Builder', desc: '快速构建高转化率的落地页，支持多种布局变体和响应式设计', mode: 'prototype', scenario: 'marketing', uses: 1243, rating: 4.8 },
      { id: 2, name: 'Pitch Deck Creator', desc: '专业路演幻灯片生成器，内置多种演示主题和动画效果', mode: 'deck', scenario: 'marketing', uses: 892, rating: 4.7 },
      { id: 3, name: 'Icon Generator', desc: '基于描述自动生成风格统一的图标集，支持 SVG 和 PNG 输出', mode: 'image', scenario: 'design', uses: 2156, rating: 4.9 },
      { id: 4, name: 'Product Demo Video', desc: '将产品特性转化为简短的演示视频脚本和分镜', mode: 'video', scenario: 'marketing', uses: 567, rating: 4.6 },
      { id: 5, name: 'Dashboard Builder', desc: '数据密集型后台仪表盘，支持表格、图表和筛选器组件', mode: 'prototype', scenario: 'engineering', uses: 1876, rating: 4.8 },
      { id: 6, name: 'Brand Identity Kit', desc: '完整的品牌识别系统生成器，包含色彩、字体和间距规范', mode: 'design-system', scenario: 'design', uses: 734, rating: 4.5 },
      { id: 7, name: 'Social Media Post', desc: '为各大社交平台优化尺寸和排版的帖子模板生成器', mode: 'image', scenario: 'marketing', uses: 3421, rating: 4.7 },
      { id: 8, name: 'Mobile App Prototype', desc: '高保真移动端原型，支持 iOS 和 Android 双平台适配', mode: 'prototype', scenario: 'product', uses: 1543, rating: 4.9 },
      { id: 9, name: 'Explainer Video', desc: '创建简洁有力的产品解释动画视频，适合官网和社交媒体', mode: 'video', scenario: 'marketing', uses: 445, rating: 4.4 },
      { id: 10, name: 'Audio Branding', desc: '品牌音效和声音标识设计，适用于应用通知和广告', mode: 'audio', scenario: 'design', uses: 234, rating: 4.3 },
      { id: 11, name: 'Design System Builder', desc: '从设计令牌到组件库的完整设计系统生成工具', mode: 'design-system', scenario: 'engineering', uses: 987, rating: 4.8 },
      { id: 12, name: 'Presentation Template', desc: '企业级演示模板库，覆盖融资、汇报、培训等场景', mode: 'deck', scenario: 'product', uses: 1123, rating: 4.6 },
    ];

    const modeLabels = {
      prototype: '原型',
      deck: '幻灯片',
      image: '图片',
      video: '视频',
      audio: '音频',
      'design-system': '设计系统'
    };

    const modeIcons = {
      prototype: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="2"/><line x1="6" y1="6" x2="10" y2="10"/><line x1="10" y1="6" x2="6" y2="10"/></svg>`,
      deck: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="2" width="10" height="12" rx="1.5"/><line x1="6" y1="5" x2="10" y2="5"/><line x1="6" y1="8" x2="10" y2="8"/><line x1="6" y1="11" x2="8" y2="11"/></svg>`,
      image: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="12" height="12" rx="2"/><circle cx="5.5" cy="5.5" r="1.5"/><path d="m14 10-3-3-5 5"/></svg>`,
      video: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="2"/><polygon points="6.5 6 6.5 10 10.5 8"/></svg>`,
      audio: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13V5.5a1.5 1.5 0 0 1 3 0V13"/><path d="M11 10.5V3.5a1.5 1.5 0 0 1 3 0v7"/><path d="M4 14h5"/><path d="M10 11.5h4"/></svg>`,
      'design-system': `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="5" r="2.5"/><circle cx="11" cy="5" r="2.5"/><circle cx="5" cy="11" r="2.5"/><circle cx="11" cy="11" r="2.5"/></svg>`
    };

    let currentMode = 'all';
    let currentScenarios = [];
    let searchQuery = '';

    function renderSkillCard(skill) {
      return `
        <div class="skill-card" data-mode="${skill.mode}" data-scenario="${skill.scenario}" data-name="${skill.name.toLowerCase()}" onclick="handleSkillClick(${skill.id})">
          <div class="skill-card-header">
            <div class="skill-icon ${skill.mode}">
              ${modeIcons[skill.mode] || modeIcons.prototype}
            </div>
            <div class="skill-info">
              <h3 class="skill-name">${skill.name}</h3>
              <p class="skill-desc">${skill.desc}</p>
            </div>
          </div>
          <div class="skill-tags">
            <span class="skill-tag mode">${modeLabels[skill.mode] || skill.mode}</span>
            <span class="skill-tag">${skill.scenario === 'marketing' ? '营销' : skill.scenario === 'product' ? '产品' : skill.scenario === 'engineering' ? '工程' : '设计'}</span>
          </div>
          <div class="skill-footer">
            <div class="skill-stats">
              <span class="skill-stat">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 1l1.5 3.5 3.5.5-2.5 2.5.5 3.5L6 9.5 2.5 11l.5-3.5L.5 5l3.5-.5z"/></svg>
                ${skill.rating}
              </span>
              <span class="skill-stat">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 10.5V3.5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v7"/><path d="M5 6h2"/><path d="M5 8h2"/></svg>
                ${skill.uses.toLocaleString()}
              </span>
            </div>
            <button class="skill-action" onclick="event.stopPropagation(); handleDownloadSkill(${skill.id})">
              下载
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 1v7"/><path d="M3 6l3 3 3-3"/><path d="M1 10h10"/></svg>
            </button>
          </div>
        </div>
      `;
    }

    function renderSkills() {
      let filtered = skills.filter(skill => {
        if (currentMode !== 'all' && skill.mode !== currentMode) return false;
        if (currentScenarios.length > 0 && !currentScenarios.includes(skill.scenario)) return false;
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          return skill.name.toLowerCase().includes(q) || skill.desc.toLowerCase().includes(q);
        }
        return true;
      });

      const featured = filtered.filter(s => s.rating >= 4.7 && s.uses >= 1000).slice(0, 4);
      const remaining = filtered.filter(s => !featured.includes(s));

      const featuredGrid = document.getElementById('featuredGrid');
      const allGrid = document.getElementById('allGrid');
      const emptyState = document.getElementById('emptyState');

      if (filtered.length === 0) {
        featuredGrid.innerHTML = '';
        allGrid.innerHTML = '';
        emptyState.style.display = 'flex';
      } else {
        emptyState.style.display = 'none';
        featuredGrid.innerHTML = featured.map(renderSkillCard).join('');
        allGrid.innerHTML = remaining.map(renderSkillCard).join('');
      }

      document.getElementById('resultsCount').textContent = `${filtered.length} 个技能`;
    }

    function setMode(mode, el) {
      currentMode = mode;
      document.querySelectorAll('[data-mode]').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      renderSkills();
    }

    function toggleScenario(scenario, el) {
      const idx = currentScenarios.indexOf(scenario);
      if (idx >= 0) {
        currentScenarios.splice(idx, 1);
        el.classList.remove('active');
      } else {
        currentScenarios.push(scenario);
        el.classList.add('active');
      }
      renderSkills();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.trim();
      renderSkills();
    }

    function handleSkillClick(id) {
      window.location.href = `market-skill-detail.html?id=${id}`;
    }

    function handleDownloadSkill(id) {
      const skill = skills.find(s => s.id === id);
      if (skill) showToast(`已开始下载 ${skill.name}`, 'success');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
      if (e.key === 'Escape') {
        document.getElementById('searchInput').blur();
      }
    });

    function showToast(message, type = 'success') {
      let container = document.getElementById('toastContainer');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toastContainer';
        container.style.cssText = 'position:fixed;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:8px;';
        document.body.appendChild(container);
      }

      const toast = document.createElement('div');
      toast.style.cssText = `display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;background:var(--bg-secondary);border:1px solid ${type === 'success' ? 'var(--success)' : 'var(--danger)'};box-shadow:0 8px 32px rgba(0,0,0,0.12);font-size:13px;color:var(--text-primary);max-width:340px;animation:toastIn 0.3s ease;`;
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.animation = 'toastOut 0.3s ease forwards';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    const style = document.createElement('style');
    style.textContent = `
      @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(20px); } }
    `;
    document.head.appendChild(style);

    renderSkills();
  </script>


</body></html>
