<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Hub — 登录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f8f9fb;
      --bg-tertiary: #f1f3f7;
      --bg-input: #ffffff;
      --border-default: #e2e5ed;
      --border-hover: #c8ccd6;
      --border-focus: #5E6AD2;
      --text-primary: #1a1d27;
      --text-secondary: #5f6577;
      --text-tertiary: #9498a8;
      --accent: #5E6AD2;
      --accent-hover: #4b57c0;
      --accent-subtle: rgba(94, 106, 210, 0.08);
      --accent-glow: rgba(94, 106, 210, 0.12);
      --danger: #e5484d;
      --success: #30a46c;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(94, 106, 210, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(94, 106, 210, 0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, black 20%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, black 20%, transparent 100%);
      z-index: 0;
    }

    .bg-gradient {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(94, 106, 210, 0.05), transparent 60%);
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .login-container {
      width: 100%;
      max-width: 384px;
    }

    .brand {
      text-align: center;
      margin-bottom: 40px;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
      margin-bottom: 20px;
      box-shadow: 0 0 0 1px rgba(94, 106, 210, 0.2), 0 8px 32px rgba(94, 106, 210, 0.15);
    }

    .brand-logo svg {
      width: 26px;
      height: 26px;
      fill: white;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .brand-tagline {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
    }

    .form-input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg-input);
      border: 1px solid var(--border-default);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-input::placeholder {
      color: var(--text-tertiary);
    }

    .form-input:hover {
      border-color: var(--border-hover);
    }

    .form-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-subtle), 0 0 0 1px var(--accent);
    }

    .form-input.error {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgba(229, 72, 77, 0.12);
    }

    .form-error {
      font-size: 12px;
      color: var(--danger);
      display: none;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    .form-error.visible {
      display: flex;
    }

    .form-error svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease;
    }

    .password-toggle:hover {
      color: var(--text-secondary);
    }

    .password-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .password-toggle svg {
      width: 16px;
      height: 16px;
    }

    .form-input[type="password"],
    .form-input.password-field {
      padding-right: 40px;
    }

    .btn-primary {
      width: 100%;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: white;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 100%);
      pointer-events: none;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 2px 12px rgba(94, 106, 210, 0.3);
    }

    .btn-primary:active {
      transform: scale(0.985);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }

    .btn-primary.loading .spinner {
      display: block;
    }

    .btn-primary.loading .btn-text {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .form-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid var(--border-default);
      background: var(--bg-input);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .checkbox.checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .checkbox svg {
      width: 10px;
      height: 10px;
      color: white;
      opacity: 0;
      transition: opacity 0.1s ease;
    }

    .checkbox.checked svg {
      opacity: 1;
    }

    .checkbox-label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .form-link {
      font-size: 13px;
      color: var(--text-secondary);
      text-decoration: none;
      cursor: pointer;
      transition: color 0.15s ease;
      border: none;
      background: none;
      font-family: inherit;
      padding: 0;
    }

    .form-link:hover {
      color: var(--accent);
    }

    .form-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .bottom-section {
      text-align: center;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border-default);
    }

    .bottom-text {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .bottom-link {
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
      transition: color 0.15s ease;
      border: none;
      background: none;
      font-family: inherit;
      padding: 0;
      font-weight: 500;
    }

    .bottom-link:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .bottom-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 10px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-default);
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      font-size: 13px;
      color: var(--text-primary);
      animation: toastIn 0.3s ease;
      max-width: 340px;
    }

    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }

    .toast-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .toast.success .toast-icon { color: var(--success); }
    .toast.error .toast-icon { color: var(--danger); }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes toastOut {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(20px); }
    }

    .kbd-hint {
      font-size: 11px;
      color: var(--text-tertiary);
      text-align: center;
      margin-top: 16px;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .form-input:focus-visible {
      outline: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 480px) {
      .login-container {
        max-width: 100%;
      }
      .brand-name {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-grid"></div>

  <div class="toast-container" id="toastContainer"></div>

  <div class="page">
    <div class="login-container">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: white;">
            <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"></polygon>
            <line x1="12" y1="22" x2="12" y2="15.5"></line>
            <polyline points="22 8.5 12 15.5 2 8.5"></polyline>
            <polyline points="2 15.5 12 8.5 22 15.5"></polyline>
            <line x1="12" y1="2" x2="12" y2="8.5"></line>
          </svg>
        </div>
        <h1 class="brand-name">Skill Hub</h1>
        <p class="brand-tagline">发现、管理和部署智能技能</p>
      </div>

      <form class="form" id="loginForm" onsubmit="return handleSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="username">账号</label>
          <div class="form-input-wrapper">
            <input class="form-input" type="text" id="username" name="username" placeholder="请输入账号或邮箱" autocomplete="username" required="">
          </div>
          <div class="form-error" id="usernameError">
            <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm-.75 4a.75.75 0 0 1 1.5 0v3a.75.75 0 0 1-1.5 0V5zM8 10.5a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5z"></path></svg>
            <span>请输入有效的账号</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">密码</label>
          <div class="form-input-wrapper">
            <input class="form-input password-field" type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" required="">
            <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="切换密码可见性">
              <svg id="eyeIcon" viewBox="0 0 16 16" fill="currentColor" style="display:none;"><path d="M8 3.5C3.58 3.5 1 8 1 8s2.58 4.5 7 4.5S15 8 15 8s-2.58-4.5-7-4.5zm0 7.5a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0-5a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"></path></svg>
              <svg id="eyeOffIcon" viewBox="0 0 16 16" fill="currentColor"><path d="M2.854 2.146a.5.5 0 1 0-.708.708L5.293 6C4.57 6.627 4 7.347 4 8c0 0 2.58 4.5 7 4.5.855 0 1.628-.2 2.315-.49l2.831 2.844a.5.5 0 0 0 .708-.708L2.854 2.146zM8 11.5a3 3 0 0 1-3-3c0-.466.16-.912.434-1.306l3.872 3.872A2.98 2.98 0 0 1 8 11.5zM8 3.5c-.855 0-1.628.2-2.315.49l1.282 1.282A3.04 3.04 0 0 1 8 5a3 3 0 0 1 3 3c0 .355-.07.693-.178 1.01l1.446 1.446C13.872 9.006 15 8 15 8s-2.58-4.5-7-4.5z"></path></svg>
            </button>
          </div>
          <div class="form-error" id="passwordError">
            <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm-.75 4a.75.75 0 0 1 1.5 0v3a.75.75 0 0 1-1.5 0V5zM8 10.5a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5z"></path></svg>
            <span>密码至少 8 个字符</span>
          </div>
        </div>

        <div class="form-footer">
          <div class="checkbox-wrapper" onclick="toggleCheckbox()">
            <div class="checkbox" id="rememberMe">
              <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="2 5 4 7 8 3"></polyline>
              </svg>
            </div>
            <span class="checkbox-label">记住我</span>
          </div>
          <button type="button" class="form-link" onclick="handleForgotPassword()">忘记密码？</button>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">
          <span class="btn-text">登录</span>
          <div class="spinner"></div>
        </button>
      </form>

      

      <div class="kbd-hint">
        按 <kbd style="display:inline-flex;align-items:center;justify-content:center;padding:2px 6px;font-size:11px;font-family:inherit;background:var(--bg-tertiary);border:1px solid var(--border-default);border-radius:4px;color:var(--text-secondary);">Enter</kbd> 登录
      </div>
    </div>
  </div>

  <script>
    let isPasswordVisible = false;
    let isChecked = false;
    let isSubmitting = false;

    function togglePassword() {
      const input = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      const eyeOffIcon = document.getElementById('eyeOffIcon');
      isPasswordVisible = !isPasswordVisible;
      input.type = isPasswordVisible ? 'text' : 'password';
      eyeIcon.style.display = isPasswordVisible ? 'block' : 'none';
      eyeOffIcon.style.display = isPasswordVisible ? 'none' : 'block';
    }

    function toggleCheckbox() {
      isChecked = !isChecked;
      document.getElementById('rememberMe').classList.toggle('checked', isChecked);
    }

    function showError(id) {
      document.getElementById(id).classList.add('visible');
      const input = document.getElementById(id).closest('.form-group')?.querySelector('.form-input');
      if (input) input.classList.add('error');
    }

    function hideError(id) {
      document.getElementById(id).classList.remove('visible');
      const input = document.getElementById(id).closest('.form-group')?.querySelector('.form-input');
      if (input) input.classList.remove('error');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const iconPath = type === 'success'
        ? '<path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm3.22 5.97l-4 4a.75.75 0 0 1-1.06 0l-1.5-1.5a.75.75 0 0 1 1.06-1.06L6.47 9.69l3.69-3.69a.75.75 0 1 1 1.06 1.06z"/>'
        : '<path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm-.75 4a.75.75 0 0 1 1.5 0v3a.75.75 0 0 1-1.5 0V5zM8 10.5a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5z"/>';
      toast.innerHTML = `<svg class="toast-icon" viewBox="0 0 16 16" fill="currentColor">${iconPath}</svg><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'toastOut 0.3s ease forwards';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function handleSubmit(event) {
      event.preventDefault();
      if (isSubmitting) return false;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      let hasError = false;

      hideError('usernameError');
      if (!username) {
        showError('usernameError');
        hasError = true;
      }

      hideError('passwordError');
      if (!password || password.length < 8) {
        showError('passwordError');
        hasError = true;
      }

      if (hasError) return false;

      isSubmitting = true;
      const btn = document.getElementById('submitBtn');
      btn.classList.add('loading');
      btn.disabled = true;

      setTimeout(() => {
        isSubmitting = false;
        btn.classList.remove('loading');
        btn.disabled = false;
        showToast('欢迎回来，即将跳转到工作台...', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 1500);
      }, 1500);

      return false;
    }

    function handleForgotPassword() {
      showToast('已发送密码重置邮件', 'success');
    }

    function handleSignUp() {
      showToast('正在跳转到注册页面...', 'success');
    }

    document.getElementById('username').addEventListener('input', () => hideError('usernameError'));
    document.getElementById('password').addEventListener('input', () => hideError('passwordError'));
  </script>


</body></html>
