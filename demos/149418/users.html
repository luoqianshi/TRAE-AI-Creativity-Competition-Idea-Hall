<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 — Skill Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f8f9fb;
      --bg-tertiary: #f1f3f7;
      --bg-input: #ffffff;
      --border-default: #e2e5ed;
      --border-hover: #c8ccd6;
      --border-focus: #5E6AD2;
      --text-primary: #1a1d27;
      --text-secondary: #5f6577;
      --text-tertiary: #9498a8;
      --accent: #5E6AD2;
      --accent-hover: #4b57c0;
      --accent-subtle: rgba(94, 106, 210, 0.08);
      --accent-glow: rgba(94, 106, 210, 0.12);
      --danger: #e5484d;
      --danger-subtle: rgba(229, 72, 77, 0.08);
      --success: #30a46c;
      --success-subtle: rgba(48, 164, 108, 0.08);
      --warning: #f5a623;
      --warning-subtle: rgba(245, 166, 35, 0.08);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(94, 106, 210, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(94, 106, 210, 0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, black 20%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, black 20%, transparent 100%);
      z-index: 0;
      pointer-events: none;
    }

    .bg-gradient {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(94, 106, 210, 0.05), transparent 60%);
      z-index: 0;
      pointer-events: none;
    }

    .app {
      position: relative;
      z-index: 1;
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      border-right: 1px solid var(--border-default);
      background: var(--bg-secondary);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 50;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-default);
    }

    .sidebar-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sidebar-logo svg {
      width: 18px;
      height: 18px;
      fill: white;
    }

    .sidebar-brand {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .sidebar-nav {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
    }

    .nav-section {
      margin-bottom: 20px;
    }

    .nav-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-tertiary);
      padding: 8px 12px 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }

    .nav-item:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--accent-subtle);
      color: var(--accent);
    }

    .nav-item svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .nav-badge {
      margin-left: auto;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 10px;
      background: var(--accent-subtle);
      color: var(--accent);
      font-weight: 500;
    }

    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid var(--border-default);
    }

    .sidebar-user {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .sidebar-user:hover {
      background: var(--bg-tertiary);
    }

    .sidebar-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: white;
      flex-shrink: 0;
    }

    .sidebar-user-info {
      flex: 1;
      min-width: 0;
    }

    .sidebar-user-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-user-role {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    /* Main content */
    .main {
      flex: 1;
      margin-left: 240px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      padding: 0 24px;
      border-bottom: 1px solid var(--border-default);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .topbar-breadcrumb {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .topbar-breadcrumb span {
      color: var(--text-primary);
      font-weight: 600;
    }

    .topbar-center {
      flex: 1;
      max-width: 400px;
      margin: 0 24px;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-tertiary);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 36px;
      padding: 0 14px 0 38px;
      font-family: inherit;
      font-size: 13px;
      color: var(--text-primary);
      background: var(--bg-input);
      border: 1px solid var(--border-default);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search-input::placeholder {
      color: var(--text-tertiary);
    }

    .search-input:hover {
      border-color: var(--border-hover);
    }

    .search-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-subtle);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .topbar-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      position: relative;
    }

    .topbar-btn:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .topbar-btn svg {
      width: 18px;
      height: 18px;
    }

    .topbar-btn .dot {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      border: 2px solid var(--bg-primary);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      border-radius: 8px;
      border: 1px solid var(--border-default);
      background: var(--bg-primary);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--bg-secondary);
      border-color: var(--border-hover);
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn svg {
      width: 14px;
      height: 14px;
    }

    /* Content area */
    .content {
      padding: 24px;
      flex: 1;
    }

    /* Stats cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-default);
      background: var(--bg-primary);
      transition: box-shadow 0.2s ease;
    }

    .stat-card:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    .stat-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-tertiary);
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
    }

    .stat-change {
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stat-change.up {
      color: var(--success);
    }

    .stat-change.down {
      color: var(--danger);
    }

    /* Filter bar */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border: 1px solid var(--border-default);
      border-radius: 10px;
      background: var(--bg-primary);
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--bg-tertiary);
      border: 1px solid var(--border-default);
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .filter-pill:hover {
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    .filter-pill:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .filter-pill:active {
      transform: scale(0.97);
    }

    .filter-pill.active {
      background: var(--accent-subtle);
      border-color: var(--accent);
      color: var(--accent);
    }

    .filter-divider {
      width: 1px;
      height: 20px;
      background: var(--border-default);
    }

    .filter-search {
      flex: 1;
      min-width: 180px;
      height: 32px;
      padding: 0 10px;
      font-family: inherit;
      font-size: 13px;
      color: var(--text-primary);
      background: var(--bg-input);
      border: 1px solid var(--border-default);
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .filter-search::placeholder {
      color: var(--text-tertiary);
    }

    .filter-search:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-subtle);
    }

    /* Table */
    .table-container {
      border: 1px solid var(--border-default);
      border-radius: 12px;
      background: var(--bg-primary);
      overflow: hidden;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
    }

    .table th {
      text-align: left;
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border-default);
      background: var(--bg-secondary);
    }

    .table th:first-child {
      width: 40px;
    }

    .table td {
      padding: 14px 16px;
      font-size: 13px;
      border-bottom: 1px solid var(--border-default);
      vertical-align: middle;
    }

    .table tr:last-child td {
      border-bottom: none;
    }

    .table tr:hover td {
      background: var(--bg-secondary);
    }

    .table-checkbox {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .user-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: white;
      flex-shrink: 0;
    }

    .user-avatar.blue { background: linear-gradient(135deg, #5E6AD2, #8b5cf6); }
    .user-avatar.green { background: linear-gradient(135deg, #30a46c, #2dd4a8); }
    .user-avatar.orange { background: linear-gradient(135deg, #f5a623, #f97316); }
    .user-avatar.red { background: linear-gradient(135deg, #e5484d, #dc2626); }

    .user-info {
      min-width: 0;
    }

    .user-name {
      font-weight: 600;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-email {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 500;
      border-radius: 4px;
    }

    .badge-admin {
      background: rgba(229, 72, 77, 0.1);
      color: #c93a3f;
    }

    .badge-editor {
      background: rgba(94, 106, 210, 0.1);
      color: #5E6AD2;
    }

    .badge-viewer {
      background: rgba(148, 152, 168, 0.15);
      color: #6b6f80;
    }

    .badge-active {
      background: var(--success-subtle);
      color: var(--success);
    }

    .badge-inactive {
      background: var(--bg-tertiary);
      color: var(--text-tertiary);
    }

    .badge-pending {
      background: var(--warning-subtle);
      color: var(--warning);
    }

    .table-actions {
      display: flex;
      gap: 4px;
    }

    .table-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-tertiary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .table-action-btn:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .table-action-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .table-action-btn.danger:hover {
      background: var(--danger-subtle);
      color: var(--danger);
    }

    .table-action-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Pagination */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-top: 1px solid var(--border-default);
      background: var(--bg-primary);
    }

    .pagination-info {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .pagination-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .page-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--border-default);
      background: var(--bg-primary);
      color: var(--text-secondary);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .page-btn:hover {
      background: var(--bg-secondary);
      border-color: var(--border-hover);
    }

    .page-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .page-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .page-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Bulk actions bar */
    .bulk-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--accent-subtle);
      border: 1px solid var(--accent);
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .bulk-actions-count {
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
    }

    .bulk-actions .btn {
      border-color: var(--accent);
      color: var(--accent);
    }

    .bulk-actions .btn:hover {
      background: var(--accent-subtle);
    }

    .bulk-actions .btn-danger {
      border-color: var(--danger);
      color: var(--danger);
    }

    .bulk-actions .btn-danger:hover {
      background: var(--danger-subtle);
    }

    /* Toast */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 10px;
      background: var(--bg-primary);
      border: 1px solid var(--border-default);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      font-size: 13px;
      animation: toast-in 0.3s ease forwards;
      max-width: 360px;
    }

    .toast.toast-out {
      animation: toast-out 0.3s ease forwards;
    }

    .toast.success {
      border-left: 3px solid var(--success);
    }

    .toast.error {
      border-left: 3px solid var(--danger);
    }

    .toast svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .toast.success svg { color: var(--success); }
    .toast.error svg { color: var(--danger); }

    @keyframes toast-in {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes toast-out {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(20px); }
    }

    @media (max-width: 1200px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; }
      .stats-grid { grid-template-columns: 1fr; }
      .filter-bar { flex-direction: column; align-items: stretch; }
      .filter-search { min-width: auto; }
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-grid"></div>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"></polygon>
            <line x1="12" y1="22" x2="12" y2="15.5"></line>
            <polyline points="22 8.5 12 15.5 2 8.5"></polyline>
            <polyline points="2 15.5 12 8.5 22 15.5"></polyline>
            <line x1="12" y1="2" x2="12" y2="8.5"></line>
          </svg>
        </div>
        <span class="sidebar-brand">Skill Hub</span>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">概览</div>
          <a href="dashboard.html" class="nav-item">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"></rect><rect x="9" y="2" width="5" height="5" rx="1"></rect><rect x="2" y="9" width="5" height="5" rx="1"></rect><rect x="9" y="9" width="5" height="5" rx="1"></rect></svg>
            工作台
          </a>
          <a href="skill-hub-light.html" class="nav-item">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"></circle><path d="M8 5v6"></path><path d="M5 8h6"></path></svg>
            技能市场
            <span class="nav-badge">12</span>
          </a>
        </div>

        <div class="nav-section">

        <div class="topbar-center">

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    const users = [
      { id: 1, name: '张三', email: 'zhangsan@example.com', dept: '产品部', role: 'admin', status: 'active', lastLogin: '2 分钟前', color: 'blue' },
      { id: 2, name: '李四', email: 'lisi@example.com', dept: '技术部', role: 'editor', status: 'active', lastLogin: '15 分钟前', color: 'green' },
      { id: 3, name: '王五', email: 'wangwu@example.com', dept: '设计部', role: 'editor', status: 'active', lastLogin: '1 小时前', color: 'orange' },
      { id: 4, name: '赵六', email: 'zhaoliu@example.com', dept: '市场部', role: 'viewer', status: 'inactive', lastLogin: '3 天前', color: 'red' },
      { id: 5, name: '孙七', email: 'sunqi@example.com', dept: '产品部', role: 'viewer', status: 'active', lastLogin: '5 小时前', color: 'blue' },
      { id: 6, name: '周八', email: 'zhouba@example.com', dept: '技术部', role: 'admin', status: 'active', lastLogin: '30 分钟前', color: 'green' },
      { id: 7, name: '吴九', email: 'wujiu@example.com', dept: '运营部', role: 'editor', status: 'pending', lastLogin: '从未登录', color: 'orange' },
      { id: 8, name: '郑十', email: 'zhengshi@example.com', dept: '设计部', role: 'viewer', status: 'active', lastLogin: '2 小时前', color: 'red' },
      { id: 9, name: '陈一一', email: 'chenyiyi@example.com', dept: '产品部', role: 'editor', status: 'active', lastLogin: '1 天前', color: 'blue' },
      { id: 10, name: '林十二', email: 'linshier@example.com', dept: '技术部', role: 'viewer', status: 'active', lastLogin: '4 小时前', color: 'green' },
    ];

    const roleLabels = { admin: '管理员', editor: '编辑者', viewer: '访客' };
    const roleClasses = { admin: 'badge-admin', editor: 'badge-editor', viewer: 'badge-viewer' };
    const statusLabels = { active: '已启用', inactive: '已禁用', pending: '待审核' };
    const statusClasses = { active: 'badge-active', inactive: 'badge-inactive', pending: 'badge-pending' };

    let selectedUsers = new Set();
    let currentRole = 'all';
    let currentStatus = 'all';

    function renderTable() {
      const tbody = document.getElementById('userTableBody');
      const filtered = users.filter(u => {
        if (currentRole !== 'all' && u.role !== currentRole) return false;
        if (currentStatus !== 'all' && u.status !== currentStatus) return false;
        return true;
      });

      tbody.innerHTML = filtered.map(u => `
        <tr data-id="${u.id}">
          <td><input type="checkbox" class="table-checkbox" data-id="${u.id}" ${selectedUsers.has(u.id) ? 'checked' : ''} /></td>
          <td>
            <div class="user-cell">
              <div class="user-avatar ${u.color}">${u.name.charAt(0)}</div>
              <div class="user-info">
                <div class="user-name">${u.name}</div>
                <div class="user-email">${u.email}</div>
              </div>
            </div>
          </td>
          <td>${u.dept}</td>
          <td><span class="badge ${roleClasses[u.role]}">${roleLabels[u.role]}</span></td>
          <td><span class="badge ${statusClasses[u.status]}">${statusLabels[u.status]}</span></td>
          <td style="color: var(--text-tertiary)">${u.lastLogin}</td>
          <td>
            <div class="table-actions">
              <a href="user-edit.html" class="table-action-btn" title="编辑">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11.5 2.5l2 2L5 13H3v-2z"/><path d="M8 5l3 3"/></svg>
              </a>
              <button class="table-action-btn" title="${u.status === 'active' ? '禁用' : '启用'}" onclick="toggleStatus(${u.id})">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                  ${u.status === 'active'
                    ? '<rect x="3" y="3" width="10" height="10" rx="1.5"/><line x1="6" y1="6" x2="10" y2="10"/><line x1="10" y1="6" x2="6" y2="10"/>'
                    : '<circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="2"/>'}
                </svg>
              </button>
              <button class="table-action-btn danger" title="删除" onclick="deleteUser(${u.id})">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="3 5 4 5 13 5"/><path d="M12 5l-1 9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1L4 5"/><path d="M7 8v4M9 8v4"/><path d="M8 3V2.5a.5.5 0 0 1 .5-.5h0a.5.5 0 0 1 .5.5V3"/></svg>
              </button>
            </div>
          </td>
        </tr>
      `).join('');

      document.getElementById('totalUsers').textContent = filtered.length;
      updateBulkActions();
    }

    function toggleStatus(id) {
      const user = users.find(u => u.id === id);
      if (user) {
        user.status = user.status === 'active' ? 'inactive' : 'active';
        renderTable();
        showToast('success', `用户 ${user.name} 已${user.status === 'active' ? '启用' : '禁用'}`);
      }
    }

    function deleteUser(id) {
      const user = users.find(u => u.id === id);
      if (user && confirm(`确定要删除用户 ${user.name} 吗？`)) {
        const idx = users.findIndex(u => u.id === id);
        if (idx !== -1) {
          users.splice(idx, 1);
          selectedUsers.delete(id);
          renderTable();
          showToast('success', `用户 ${user.name} 已删除`);
        }
      }
    }

    function updateBulkActions() {
      const bar = document.getElementById('bulkActions');
      const count = document.getElementById('bulkCount');
      if (selectedUsers.size > 0) {
        bar.style.display = 'flex';
        count.textContent = `已选择 ${selectedUsers.size} 项`;
      } else {
        bar.style.display = 'none';
      }
    }

    document.getElementById('selectAll').addEventListener('change', function() {
      const checkboxes = document.querySelectorAll('#userTableBody .table-checkbox');
      checkboxes.forEach(cb => {
        cb.checked = this.checked;
        const id = parseInt(cb.dataset.id);
        if (this.checked) selectedUsers.add(id);
        else selectedUsers.delete(id);
      });
      updateBulkActions();
    });

    document.getElementById('userTableBody').addEventListener('change', function(e) {
      if (e.target.classList.contains('table-checkbox')) {
        const id = parseInt(e.target.dataset.id);
        if (e.target.checked) selectedUsers.add(id);
        else selectedUsers.delete(id);
        updateBulkActions();
      }
    });

    document.querySelectorAll('.filter-pill[data-role]').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-pill[data-role]').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentRole = this.dataset.role;
        renderTable();
      });
    });

    document.querySelectorAll('.filter-pill[data-status]').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-pill[data-status]').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentStatus = this.dataset.status;
        renderTable();
      });
    });

    function showToast(type, message) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          ${type === 'success'
            ? '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>'
            : '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>'}
        </svg>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('toast-out');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function handleLogout() {
      showToast('success', '正在退出登录...');
      setTimeout(() => window.location.href = 'login.html', 1000);
    }

    renderTable();
  </script>
