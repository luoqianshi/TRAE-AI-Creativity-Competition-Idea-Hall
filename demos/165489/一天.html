  pointer-events: none;
  animation: breathe 2.5s ease-in-out infinite;

@keyframes breathe {
  0%, 100% { opacity: 0.6; }

.jelly-block:hover:not(.future):not(.current) {

<div class="page">

  <section class="phone-section">
    <div class="phone-mockup">
      <div class="phone-notch"></div>
      <div class="phone-screen">

          <span class="time" id="statusTime">--:--</span>

      </div>

    <!-- Category Picker -->

      <div class="card-label">用户痛点</div>
      <div class="card-value">时间总在不知不觉中溜走，<br>复盘时一片空白</div>
    </div>
    <div class="info-card">
      <div class="card-label">核心价值</div>
      <div class="card-value"><strong>不规划未来</strong>，只记录已经发生的生活</div>
    </div>

      <div class="card-label">产品边界</div>

  </footer>

<script>
(function() {
  'use strict';

  // ===== Configuration =====
  var CATEGORIES = [
    { id: 'sleep',   name: '睡眠',     color: '#6B7B8D' },
    { id: 'work',    name: '学习工作',   color: '#5B8FA8' },
    { id: 'daily',   name: '日常生活',   color: '#8EA68D' },
    { id: 'leisure', name: '休闲娱乐',   color: '#C4A882' },
    { id: 'sport',   name: '运动',     color: '#C88A8A' },
    { id: 'social',  name: '社交陪伴',   color: '#9A8DBF' }
  ];

  var TOTAL_HOURS = 24;
  var now = new Date();
  var currentHour = now.getHours();
  // For demo purposes on weekends, use a reasonable hour
  if (currentHour < 6) currentHour = 10; // simulate daytime for demo

  // ===== State =====
  var blocks = []; // { hour, category: null|string, color: null|string }
  var selectedIndex = null;

  // ===== DOM refs =====
  var grid = document.getElementById('jellyGrid');
  var picker = document.getElementById('categoryPicker');
  var catList = document.getElementById('categoryList');
  var statsGrid = document.getElementById('statsGrid');
  var statusTime = document.getElementById('statusTime');

  // ===== Init =====
  function init() {
    // Build blocks
    for (var i = 0; i < TOTAL_HOURS; i++) {
      blocks.push({ hour: i, category: null, color: null });
    }

    // Load saved state
    loadState();

    // Set status bar time
    updateStatusTime();

    // Build category buttons
    buildCategoryButtons();

    // Render
    renderGrid();
    renderStats();

    // Update status bar time every minute
    setInterval(updateStatusTime, 60000);
  }

  // ===== State persistence =====
  function saveState() {
    try {
      var data = blocks.map(function(b) { return { category: b.category, color: b.color }; });
      localStorage.setItem('yitian_blocks', JSON.stringify(data));
    } catch(e) { /* ignore */ }
  }

  function loadState() {
    try {
      var raw = localStorage.getItem('yitian_blocks');
      if (!raw) return;
      var data = JSON.parse(raw);
      if (!Array.isArray(data) || data.length !== TOTAL_HOURS) return;
      for (var i = 0; i < TOTAL_HOURS; i++) {
        if (data[i].category) {
          blocks[i].category = data[i].category;
          blocks[i].color = data[i].color;
        }
      }
    } catch(e) { /* ignore */ }
  }

  // ===== Status Bar =====
  function updateStatusTime() {
    var d = new Date();
    var h = String(d.getHours()).padStart(2, '0');
    var m = String(d.getMinutes()).padStart(2, '0');
    statusTime.textContent = h + ':' + m;
  }

  // ===== Build Category Buttons =====
  function buildCategoryButtons() {
    catList.innerHTML = '';
    CATEGORIES.forEach(function(cat) {
      var btn = document.createElement('button');
      btn.className = 'cat-btn';
      btn.dataset.cat = cat.id;
      btn.innerHTML = '<span class="dot" style="background:' + cat.color + '"></span>' + cat.name;
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        selectCategory(cat.id);
      });
      catList.appendChild(btn);
    });
  }

  // ===== Render Grid =====
  function renderGrid() {
    grid.innerHTML = '';
    for (var i = 0; i < TOTAL_HOURS; i++) {
      var block = blocks[i];
      var el = document.createElement('div');
      el.className = 'jelly-block';
      el.dataset.index = i;

      // Determine state
      var state = getBlockState(i);
      if (state === 'past') el.classList.add('past');
      else if (state === 'future') el.classList.add('future');
      else if (state === 'current') el.classList.add('current');

      // Filled?
      if (block.color) {
        el.classList.add('filled');
        el.style.background = block.color;
      }

      // Selected?
      if (selectedIndex === i) el.classList.add('selected');

      // Hour label
      var label = document.createElement('span');
      label.className = 'hour-label';
      label.textContent = String(block.hour).padStart(2, '0');
      el.appendChild(label);

      // Half mark (for visual)
      var half = document.createElement('span');
      half.className = 'half-mark';
      half.textContent = '◈';
      el.appendChild(half);

      // Click
      if (state === 'past') {
        el.addEventListener('click', function(e) {
          var idx = parseInt(this.dataset.index, 10);
          handleBlockClick(idx);
        });
      }

      grid.appendChild(el);
    }

    // Update picker visibility
    if (selectedIndex !== null) {
      picker.classList.add('visible');
      highlightActiveCategory();
    } else {
      picker.classList.remove('visible');
    }
  }

  function getBlockState(index) {
    var h = blocks[index].hour;
    if (h < currentHour) return 'past';
    if (h === currentHour) return 'current';
    return 'future';
  }

  // ===== Click Handler =====
  function handleBlockClick(index) {
    if (selectedIndex === index) {
      // Deselect
      selectedIndex = null;
      picker.classList.remove('visible');
      renderGrid();
      return;
    }
    selectedIndex = index;
    renderGrid();
    // Picker already shown via renderGrid
    highlightActiveCategory();
  }

  function highlightActiveCategory() {
    if (selectedIndex === null) return;
    var cat = blocks[selectedIndex].category;
    var buttons = catList.querySelectorAll('.cat-btn');
    buttons.forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.cat === cat);
      if (cat && btn.dataset.cat === cat) {
        var found = CATEGORIES.find(function(c) { return c.id === cat; });
        if (found) btn.style.background = found.color;
      } else {
        btn.style.background = '';
      }
    });
  }

  // ===== Select Category =====
  function selectCategory(catId) {
    if (selectedIndex === null) return;
    var block = blocks[selectedIndex];
    var cat = CATEGORIES.find(function(c) { return c.id === catId; });
    if (!cat) return;

    if (block.category === catId) {
      // Unassign
      block.category = null;
      block.color = null;
    } else {
      block.category = catId;
      block.color = cat.color;
    }

    saveState();
    renderGrid();
    renderStats();
    highlightActiveCategory();

    // Auto-advance to next past block if available
    if (block.category !== null) {
      autoAdvance();
    }
  }

  function autoAdvance() {
    // Find next unassigned past block
    for (var i = 0; i < TOTAL_HOURS; i++) {
      if (blocks[i].category === null && getBlockState(i) === 'past') {
        selectedIndex = i;
        renderGrid();
        highlightActiveCategory();
        return;
      }
    }
    // All past blocks filled, deselect
    selectedIndex = null;
    picker.classList.remove('visible');
    renderGrid();
  }

  // ===== Render Stats =====
  function renderStats() {
    // Count hours per category
    var counts = {};
    CATEGORIES.forEach(function(c) { counts[c.id] = 0; });
    blocks.forEach(function(b) {
      if (b.category) counts[b.category] = (counts[b.category] || 0) + 1;
    });

    statsGrid.innerHTML = '';
    CATEGORIES.forEach(function(cat) {
      var hours = counts[cat.id] || 0;
      var card = document.createElement('div');
      card.className = 'stats-card' + (hours > 0 ? ' has-time' : ' empty');
      card.innerHTML =
        '<div class="stat-dot" style="background:' + cat.color + '"></div>' +
        '<div class="stat-name">' + cat.name + '</div>' +
        '<div class="stat-hours">' + hours + '<span class="unit">h</span></div>';
      statsGrid.appendChild(card);
    });
  }

  // ===== Click outside to deselect =====
  document.addEventListener('click', function(e) {
    if (selectedIndex === null) return;
    var target = e.target;
    if (target.closest('.jelly-block') || target.closest('.category-picker')) return;
    selectedIndex = null;
    picker.classList.remove('visible');
    renderGrid();
  });

  // ===== Start =====
  init();

})();
</script>
</body>
</html>
