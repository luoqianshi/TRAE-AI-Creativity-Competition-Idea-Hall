<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeMaster — JavaScript 代码转换器</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
        color: #2c3e50;
    }

    .container {
        max-width: 1400px;
        margin: 0 auto;
    }

    .header {
        text-align: center;
        color: white;
        padding: 40px 20px 30px;
    }

    .header h1 {
        font-size: 42px;
        margin-bottom: 10px;
        text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
    }

    .header p {
        font-size: 18px;
        opacity: 0.9;
    }

    .converter-wrapper {
        background: white;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        margin-bottom: 30px 0;
    }

    .controls {
        display: flex;
        gap: 20px;
        margin-bottom: 25px 0;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
    }

    .lang-selector {
        display: flex;
        gap: 15px;
        background: #f0f4ff;
        padding: 8px;
        border-radius: 50px;
    }

    .lang-btn {
        padding: 12px 30px;
        border: none;
        background: transparent;
        color: #5a6c8a;
        border-radius: 50px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
        transition: all 0.3s;
    }

    .lang-btn.active {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .convert-btn {
        padding: 12px 35px;
        background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        color: white;
        border: none;
        border-radius: 50px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 8px 20px rgba(17, 153, 142, 0.3);
    }

    .convert-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 25px rgba(17, 153, 142, 0.4);
    }

    .clear-btn {
        padding: 12px 25px;
        background: #ecf0f1;
        color: #7f8c8d;
        border: none;
        border-radius: 50px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
    }

    .clear-btn:hover {
        background: #bdc3c7;
    }

    .code-areas {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .code-box {
        background: #1e1e2e;
        border-radius: 15px;
        overflow: hidden;
        border: 2px solid #2a2a3e;
    }

    .code-header {
        background: #2d2d44;
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .code-header span {
        color: #a0a0c0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 1px;
    }

    .copy-btn {
        padding: 6px 15px;
        background: #3d3d5c;
        color: #c0c0e0;
        border: none;
        border-radius: 20px;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s;
    }

    .copy-btn:hover {
        background: #4d4d6c;
    }

    .code-input, .code-output {
        width: 100%;
        min-height: 400px;
        padding: 20px;
        background: #1e1e2e;
        color: #e0e0f0;
        border: none;
        font-family: "Consolas", "Monaco", "Courier New", monospace;
        font-size: 14px;
        line-height: 1.6;
        resize: vertical;
        outline: none;
        white-space: pre;
    }

    .code-output {
        overflow: auto;
    }

    .examples {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 20px;
    }

    .example-btn {
        padding: 8px 18px;
        background: #fff4e6;
        color: #e67e22;
        border: 2px solid transparent;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
    }

    .example-btn:hover {
        border-color: #e67e22;
    }

    .status-bar {
        margin-top: 20px;
        padding: 15px 20px;
        background: #f0f4ff;
        border-left: 4px solid #667eea;
        border-radius: 8px;
        font-size: 14px;
        color: #5a6c8a;
    }

    .status-bar.success {
        background: #e8f8f1;
        border-left-color: #11998e;
        color: #11998e;
    }

    .status-bar.warning {
        background: #fff4e6;
        border-left-color: #e67e22;
        color: #e67e22;
    }

    .features {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        margin: 30px 0;
    }

    .feature-card {
        background: white;
        padding: 25px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s;
    }

    .feature-card:hover {
        transform: translateY(-5px);
    }

    .feature-icon {
        font-size: 40px;
        margin-bottom: 15px;
    }

    .feature-card h3 {
        color: #2c3e50;
        font-size: 18px;
        margin-bottom: 10px;
    }

    .feature-card p {
        color: #7f8c8d;
        font-size: 14px;
        line-height: 1.6;
    }

    .footer {
        text-align: center;
        color: white;
        padding: 30px 20px;
        font-size: 14px;
        opacity: 0.9;
    }

    @media (max-width: 900px) {
        .code-areas {
            grid-template-columns: 1fr;
        }
        .header h1 {
            font-size: 32px;
        }
    }

    .keyword { color: #ff79c6; }
    .string { color: #f1fa8c; }
    .comment { color: #6272a4; font-style: italic; }
    .function { color: #50fa7b; }
    .number { color: #bd93f9; }
    .type { color: #8be9fd; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>⚡ CodeMaster 代码转换器</h1>
        <p>一键将 JavaScript 代码智能转换为 C# 或 C++</p>
    </div>

    <div class="converter-wrapper">
        <div class="controls">
            <div class="lang-selector">
                <button class="lang-btn active" data-lang="csharp">→ C#</button>
                <button class="lang-btn" data-lang="cpp">→ C++</button>
            </div>
            <button class="convert-btn" onclick="convertCode()">🚀 开始转换</button>
            <button class="clear-btn" onclick="clearCode()">清空</button>
        </div>

        <div class="examples">
            <span style="color: #7f8c8d; font-size: 14px; font-weight: 600;">示例代码：</span>
            <button class="example-btn" onclick="loadExample('hello')">Hello World</button>
            <button class="example-btn" onclick="loadExample('function')">函数定义</button>
            <button class="example-btn" onclick="loadExample('class')">类与对象</button>
            <button class="example-btn" onclick="loadExample('array')">数组操作</button>
            <button class="example-btn" onclick="loadExample('loop')">循环结构</button>
        </div>

        <div class="code-areas">
            <div class="code-box">
                <div class="code-header">
                    <span>📝 JavaScript (输入)</span>
                </div>
                <textarea class="code-input" id="jsCode" placeholder="在此输入JavaScript代码..."></textarea>
            </div>

            <div class="code-box">
                <div class="code-header">
                    <span>✨ 转换结果 (输出)</span>
                    <button class="copy-btn" onclick="copyOutput()">📋 复制</button>
                </div>
                <pre class="code-output" id="outputCode">// 转换后的代码将显示在这里</pre>
            </div>
        </div>

        <div class="status-bar" id="statusBar">
            💡 提示：选择目标语言后点击"开始转换"按钮即可转换代码</div>
    </div>

    <div class="features">
        <div class="feature-card">
            <div class="feature-icon">🔄</div>
            <h3>智能语法转换</h3>
            <p>自动识别 JS 语法结构，转换为目标语言的等价语法</p>
        </div>
        <div class="feature-card">
            <div class="feature-icon">⚡</div>
            <h3>实时转换</h3>
            <p>即时转换毫秒级响应，无需等待编译过程</p>
        </div>
        <div class="feature-card">
            <div class="feature-icon">🎯</div>
            <h3>多语言支持</h3>
            <p>支持 C# 和 C++ 两种主流语言的互转</p>
        </div>
        <div class="feature-card">
            <div class="feature-icon">📚</div>
            <h3>代码高亮</h3>
            <p>语法高亮显示，让代码更易阅读</p>
        </div>
    </div>

    <div class="footer">
        <p>CodeMaster © 2026 — 让代码转换从未如此简单</p>
    </div>
</div>

<script>
let currentLang = 'csharp';

document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentLang = this.dataset.lang;
        updateStatus('已切换目标语言为 ' + (currentLang === 'csharp' ? 'C#' : 'C++'), 'info');
    });
});

const examples = {
    hello: `// Hello World 示例
function greet(name) {
    console.log("Hello, " + name + "!");
}

greet("World");`,
    function: `// 函数定义与调用
function add(a, b) {
    return a + b;
}

function multiply(x, y) {
    let result = x * y;
    console.log("Result: " + result);
    return result;
}

let sum = add(5, 3);
multiply(sum, 2);`,
    'class': `// 类与对象
class Animal {
    constructor(name, age) {
        this.name = name;
        this.age = age;
    }

    speak() {
        console.log(this.name + " makes a sound.");
    }
}

class Dog extends Animal {
    constructor(name, age) {
        super(name, age);
    }

    speak() {
        console.log(this.name + " barks.");
    }
}

let dog = new Dog("Buddy", 3);
dog.speak();`,
    array: `// 数组操作
let numbers = [1, 2, 3, 4, 5];

function sumArray(arr) {
    let sum = 0;
    for (let i = 0; i < arr.length; i++) {
        sum += arr[i];
    }
    return sum;
}

let total = sumArray(numbers);
console.log("Sum: " + total);`,
    loop: `// 循环结构
for (let i = 1; i <= 5; i++) {
    if (i % 2 === 0) {
        console.log(i + " is even");
    } else {
        console.log(i + " is odd");
    }
}

let count = 0;
while (count < 3) {
    console.log("Count: " + count);
    count++;
}`
};

function loadExample(type) {
    document.getElementById('jsCode').value = examples[type];
    updateStatus('已加载示例代码：' + type, 'info');
}

function convertCode() {
    const jsCode = document.getElementById('jsCode').value.trim();
    if (!jsCode) {
        updateStatus('⚠️ 请先输入JavaScript代码！', 'warning');
        return;
    }

    let result = '';
    if (currentLang === 'csharp') {
        result = convertToCSharp(jsCode);
    } else {
        result = convertToCpp(jsCode);
    }

    document.getElementById('outputCode').textContent = result;
    updateStatus('✅ 转换完成！共处理 ' + jsCode.split('\n').length + ' 行代码', 'success');
}

function convertToCSharp(code) {
    let lines = code.split('\n');
    let result = [];
    let inClass = false;
    let className = '';
    let indentLevel = 0;

    result.push('using System;');
    result.push('using System.Collections.Generic;');
    result.push('');
    result.push('class Program');
    result.push('{');

    let inMain = [];
    let methodLines = [];
    let funcBuffer = [];
    let classBuffer = [];
    let collectingFunc = false;
    let collectingClass = false;
    let braceCount = 0;
    let funcName = '';

    for (let i = 0; i < lines.length; i++) {
        let line = lines[i];
        let trimmed = line.trim();

        if (trimmed.startsWith('//')) {
            result.push('    ' + trimmed);
            continue;
        }

        if (trimmed.startsWith('class ')) {
            let match = trimmed.match(/class\s+(\w+)(?:\s+extends\s+(\w+))?/);
            if (match) {
                let cname = match[1];
                let parent = match[2] || '';
                className = cname;
                result.push('');
                if (parent) {
                    result.push('    class ' + cname + ' : ' + parent);
                } else {
                    result.push('    class ' + cname);
                }
                result.push('    {');
                inClass = true;
                continue;
            }
        }

        if (trimmed.startsWith('constructor(')) {
            let params = trimmed.match(/constructor\((.*?)\)/);
            if (params && className) {
                let paramStr = params[1];
                let csharpParams = convertParamsCSharp(paramStr);
                result.push('        public ' + className + '(' + csharpParams + ')');
                result.push('        {');
                continue;
            }
        }

        if (trimmed.startsWith('function ') || trimmed.match(/^function\s+\w+\s*\(/)) {
            let match = trimmed.match(/function\s+(\w+)\s*\((.*?)\)/);
            if (match) {
                let fname = match[1];
                let params = match[2];
                let csharpParams = convertParamsCSharp(params);
                let indent = inClass ? '            ' : '        ';
                result.push('');
                result.push(indent + 'public static void ' + fname + '(' + csharpParams + ')');
                result.push(indent + '{');
                collectingFunc = true;
                funcName = fname;
                braceCount = 1;
                continue;
            }
        }

        if (trimmed === 'super(' || trimmed.startsWith('super(')) {
            let args = trimmed.match(/super\((.*?)\)/);
            if (args) {
                let indent = inClass ? '            ' : '        ';
                result.push(indent + '// base(' + args[1] + ');');
                continue;
            }
        }

        if (trimmed.startsWith('let ') || trimmed.startsWith('var ') || trimmed.startsWith('const ')) {
            let match = trimmed.match(/(?:let|var|const)\s+(\w+)\s*=\s*(.+)/);
            if (match) {
                let varName = match[1];
                let value = match[2];
                let indent = inClass ? '            ' : '            ';
                if (inClass && varName === 'this') {
                    // skip
                } else {
                    let csharpValue = convertValueCSharp(value);
                    let type = inferTypeCSharp(value);
                    result.push(indent + type + ' ' + varName + ' = ' + csharpValue);
                    continue;
                }
            }
        }

        if (trimmed.startsWith('this.')) {
            let match = trimmed.match(/this\.(\w+)\s*=\s*(.+)/);
            if (match) {
                let indent = inClass ? '            ' : '        ';
                result.push(indent + 'this.' + match[1] + ' = ' + convertValueCSharp(match[2]) + ';');
                continue;
            }
        }

        if (trimmed.startsWith('console.log')) {
            let match = trimmed.match(/console\.log\((.+)\)/);
            if (match) {
                let indent = inClass ? '            ' : '            ';
                let content = match[1];
                let csharpContent = convertStringConcatenationCSharp(content);
                result.push(indent + 'Console.WriteLine(' + csharpContent + ');');
                continue;
            }
        }

        if (trimmed.startsWith('for ')) {
            let match = trimmed.match(/for\s*\(\s*(?:let|var)\s+(\w+)\s*=\s*(\d+)\s*;\s*\w+\s*(<|<=|>|>=)\s*([^;]+)\s*;\s*(\w+)(\+\+|--)\s*\)/);
            if (match) {
                let indent = inClass ? '            ' : '        ';
                result.push(indent + 'for (int ' + match[1] + ' = ' + match[2] + '; ' + match[1] + ' ' + match[3] + ' ' + match[4].replace(match[1], match[1]) + '; ' + match[5] + match[6] + ')');
                result.push(indent + '{');
                braceCount++;
                continue;
            }
        }

        if (trimmed.startsWith('if ')) {
            let match = trimmed.match(/if\s*\((.+)\)/);
            if (match) {
                let indent = inClass ? '                ' : '            ';
                result.push(indent + 'if (' + convertConditionCSharp(match[1]) + ')');
                result.push(indent + '{');
                braceCount++;
                continue;
            }
        }

        if (trimmed === 'else') {
            let indent = inClass ? '                ' : '            ';
            result.push(indent + '}');
            result.push(indent + 'else');
            result.push(indent + '{');
            continue;
        }

        if (trimmed.startsWith('while ')) {
            let match = trimmed.match(/while\s*\((.+)\)/);
            if (match) {
                let indent = inClass ? '            ' : '        ';
                result.push(indent + 'while (' + convertConditionCSharp(match[1]) + ')');
                result.push(indent + '{');
                braceCount++;
                continue;
            }
        }

        if (trimmed.startsWith('return ')) {
            let indent = inClass ? '            ' : '        ';
            result.push(indent + 'return ' + convertValueCSharp(trimmed.substring(7)) + ';');
            continue;
        }

        if (trimmed.match(/^(\w+)\s*\(/)) {
            let match = trimmed.match(/^(\w+)\s*\((.*)\)\s*;?$/);
            if (match && !trimmed.startsWith('function') && !trimmed.startsWith('class') && !trimmed.startsWith('for') && !trimmed.startsWith('if') && !trimmed.startsWith('while')) {
                let fname = match[1];
                let args = match[2];
                let indent = inClass ? '            ' : '            ';
                let varMatch = trimmed.match(/^(?:let|var|const)\s+(\w+)\s*=\s*(\w+)\s*\((.*)\)\s*;?$/);
                if (varMatch) {
                    let vname = varMatch[1];
                    let fcall = varMatch[2];
                    result.push(indent + 'var ' + vname + ' = ' + fcall + '(' + args + ');');
                    continue;
                } else {
                    result.push(indent + fname + '(' + args + ');');
                    continue;
                }
            }
        }

        if (trimmed === '}') {
            braceCount--;
            let indent = inClass ? '            ' : '        ';
            result.push(indent + '}');
            if (inClass && braceCount === 0 && collectingFunc) {
                collectingFunc = false;
            }
            continue;
        }

        if (trimmed === '') {
                result.push('');
            }
    }

    if (inClass) {
        result.push('    }');
    }

    result.push('}');

    return result.join('\n');
}

function convertToCpp(code) {
    let lines = code.split('\n');
    let result = [];
    let inClass = false;
    let className = '';

    result.push('#include <iostream>');
    result.push('#include <string>');
    result.push('#include <vector>');
    result.push('using namespace std;');
    result.push('');

    for (let i = 0; i < lines.length; i++) {
        let line = lines[i];
        let trimmed = line.trim();

        if (trimmed.startsWith('//')) {
            result.push(trimmed);
            continue;
        }

        if (trimmed.startsWith('class ')) {
            let match = trimmed.match(/class\s+(\w+)(?:\s+extends\s+(\w+))?/);
            if (match) {
                className = match[1];
                let parent = match[2] || '';
                result.push('');
                if (parent) {
                    result.push('class ' + className + ' : public ' + parent);
                } else {
                    result.push('class ' + className);
                }
                result.push('{');
                result.push('public:');
                inClass = true;
                continue;
            }
        }

        if (trimmed.startsWith('constructor(')) {
            let params = trimmed.match(/constructor\((.*?)\)/);
            if (params && className) {
                result.push('    ' + className + '(' + convertParamsCpp(params[1]) + ')');
                result.push('    {');
                continue;
            }
        }

        if (trimmed.startsWith('function ') || trimmed.match(/^function\s+\w+\s*\(/)) {
            let match = trimmed.match(/function\s+(\w+)\s*\((.*?)\)/);
            if (match) {
                result.push('');
                result.push('void ' + match[1] + '(' + convertParamsCpp(match[2]) + ')');
                result.push('{');
                continue;
            }
        }

        if (trimmed.startsWith('this.') && trimmed.includes('=')) {
            let match = trimmed.match(/this\.(\w+)\s*=\s*(.+)/);
            if (match) {
                let indent = inClass ? '        ' : '    ';
                result.push(indent + 'this->' + match[1] + ' = ' + convertValueCpp(match[2]) + ';');
                continue;
            }
        }

        if (trimmed.startsWith('let ') || trimmed.startsWith('var ') || trimmed.startsWith('const ')) {
            let match = trimmed.match(/(?:let|var|const)\s+(\w+)\s*=\s*(.+)/);
            if (match) {
                let indent = inClass ? '        ' : '    ';
                let value = match[2];
                let type = inferTypeCpp(value);
                result.push(indent + type + ' ' + match[1] + ' = ' + convertValueCpp(value) + ';');
                continue;
            }
        }

        if (trimmed.startsWith('console.log')) {
            let match = trimmed.match(/console\.log\((.+)\)/);
            if (match) {
                let indent = inClass ? '        ' : '    ';
                result.push(indent + 'cout << ' + convertStringConcatenationCpp(match[1]) + ' << endl;');
                continue;
            }
        }

        if (trimmed.startsWith('for ')) {
            let match = trimmed.match(/for\s*\(\s*(?:let|var)\s+(\w+)\s*=\s*(\d+)\s*;\s*(\w+)\s*(<|<=|>|>=)\s*([^;]+)\s*;\s*(\w+)(\+\+|--)\s*\)/);
            if (match) {
                let indent = inClass ? '        ' : '    ';
                result.push(indent + 'for (int ' + match[1] + ' = ' + match[2] + '; ' + match[3] + ' ' + match[4] + ' ' + match[5] + '; ' + match[6] + match[7] + ')');
                result.push(indent + '{');
                continue;
            }
        }

        if (trimmed.startsWith('if ')) {
            let match = trimmed.match(/if\s*\((.+)\)/);
            if (match) {
                let indent = inClass ? '            ' : '        ';
                result.push(indent + 'if (' + convertConditionCpp(match[1]) + ')');
                result.push(indent + '{');
                continue;
            }
        }

        if (trimmed === 'else') {
            let indent = inClass ? '            ' : '        ';
            result.push(indent + '}');
            result.push(indent + 'else');
            result.push(indent + '{');
            continue;
        }

        if (trimmed.startsWith('while ')) {
            let match = trimmed.match(/while\s*\((.+)\)/);
            if (match) {
                let indent = inClass ? '        ' : '    ';
                result.push(indent + 'while (' + convertConditionCpp(match[1]) + ')');
                result.push(indent + '{');
                continue;
            }
        }

        if (trimmed.startsWith('return ')) {
            let indent = inClass ? '        ' : '    ';
            result.push(indent + 'return ' + convertValueCpp(trimmed.substring(7).replace(/;$/, '')) + ';');
            continue;
        }

        if (trimmed.match(/^(\w+)\s*\(/)) {
            let match = trimmed.match(/^(\w+)\s*\((.*)\)\s*;?$/);
            if (match && !trimmed.startsWith('function') && !trimmed.startsWith('class') && !trimmed.startsWith('for') && !trimmed.startsWith('if') && !trimmed.startsWith('while')) {
                let indent = inClass ? '        ' : '    ';
                let varMatch = trimmed.match(/^(?:let|var|const)\s+(\w+)\s*=\s*(\w+)\s*\((.*)\)\s*;?$/);
                if (varMatch) {
                    result.push(indent + inferTypeCpp(varMatch[3]) + ' ' + varMatch[1] + ' = ' + varMatch[2] + '(' + varMatch[3] + ');');
                    continue;
                } else {
                    result.push(indent + match[1] + '(' + match[2] + ');');
                    continue;
                }
            }
        }

        if (trimmed === '}') {
            result.push('}');
            continue;
        }

        if (trimmed === '') {
            result.push('');
        }
    }

    return result.join('\n');
}

function convertParamsCSharp(params) {
    if (!params.trim()) return '';
    let parts = params.split(',').map(p => p.trim());
    return parts.map(p => 'object ' + p).join(', ');
}

function convertParamsCpp(params) {
    if (!params.trim()) return '';
    let parts = params.split(',').map(p => p.trim());
    return parts.map(p => 'auto ' + p).join(', ');
}

function convertValueCSharp(value) {
    value = value.trim().replace(/;$/, '');
    if (value.startsWith('[') && value.endsWith(']')) {
        let inner = value.slice(1, -1);
        return 'new List<object> { ' + inner + ' }';
    }
    if (value.startsWith('"') || value.startsWith("'")) {
        return value;
    }
    return value;
}

function convertValueCpp(value) {
    value = value.trim().replace(/;$/, '');
    if (value.startsWith('[') && value.endsWith(']')) {
        return '{ ' + value.slice(1, -1) + ' }';
    }
    return value;
}

function convertStringConcatenationCSharp(str) {
    return str.replace(/\s*\+\s*/g, ' + ');
}

function convertStringConcatenationCpp(str) {
    return str.replace(/\s*\+\s*/g, ' << ');
}

function convertConditionCSharp(cond) {
    return cond.replace(/===/g, '==').replace(/!==/g, '!=');
}

function convertConditionCpp(cond) {
    return cond.replace(/===/g, '==').replace(/!==/g, '!=');
}

function inferTypeCSharp(value) {
    value = value.trim().replace(/;$/, '');
    if (/^\d+$/.test(value)) return 'int';
    if (/^\d+\.\d+$/.test(value)) return 'double';
    if (value.startsWith('"') || value.startsWith("'")) return 'string';
    if (value.startsWith('[')) return 'List<object>';
    return 'var';
}

function inferTypeCpp(value) {
    value = value.trim().replace(/;$/, '');
    if (/^\d+$/.test(value)) return 'int';
    if (/^\d+\.\d+$/.test(value)) return 'double';
    if (value.startsWith('"') || value.startsWith("'")) return 'string';
    return 'auto';
}

function clearCode() {
    document.getElementById('jsCode').value = '';
    document.getElementById('outputCode').textContent = '// 转换后的代码将显示在这里';
    updateStatus('已清空代码', 'info');
}

function copyOutput() {
    const output = document.getElementById('outputCode').textContent;
    navigator.clipboard.writeText(output).then(() => {
        updateStatus('✅ 已复制到剪贴板！', 'success');
    });
}

function updateStatus(message, type) {
    const bar = document.getElementById('statusBar');
    bar.textContent = message;
    bar.className = 'status-bar ' + type;
}
