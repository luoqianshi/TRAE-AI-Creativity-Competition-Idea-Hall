<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            max-width: 480px;
            margin: 0 auto;
            background-color: #f5f5f5;
            min-height: 100vh;
            position: relative;
        }
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .page-container {
            display: none;
            padding-bottom: 60px;
        }
        .page-container.active {
            display: block;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease-out;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .nav-item.active {
            color: #8B5CF6;
        }
        .nav-item.active i {
            transform: scale(1.1);
        }
        .service-card.selected {
            border-color: #8B5CF6;
            background-color: #F5F3FF;
        }
        .stylist-card.selected {
            border-color: #8B5CF6;
            background-color: #F5F3FF;
        }
        .time-slot {
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            padding: 8px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .time-slot.selected {
            border-color: #8B5CF6;
            background-color: #8B5CF6;
            color: white;
        }
        .time-slot.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .tab-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #E5E7EB;
            background: white;
            margin-right: 8px;
            margin-bottom: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #8B5CF6;
            color: white;
            border-color: #8B5CF6;
        }
    </style>
</head>
<body>
    <div id="home-page" class="page-container active">

    <div id="services-page" class="page-container">

            <button onclick="showCoupons()" class="w-full flex items-center justify-between py-3 border-b border-gray-100">

        <div class="bg-white mx-4 mt-4 rounded-xl p-4">

        <div class="flex justify-around items-center h-16">
            <button class="nav-item active flex flex-col items-center justify-center w-full h-full text-gray-400" data-page="home">
                <i class="fas fa-home text-xl mb-1"></i>
                <span class="text-xs">首页</span>

            <button class="nav-item flex flex-col items-center justify-center w-full h-full text-gray-400" data-page="services">

            <button class="nav-item flex flex-col items-center justify-center w-full h-full text-gray-400" data-page="booking">
                <div class="relative">
                    <i class="fas fa-calendar-plus text-xl mb-1"></i>
                    <span class="absolute -top-2 -right-2 w-4 h-4 bg-purple-600 text-white text-xs rounded-full flex items-center justify-center">预约</span>

            <button onclick="closeSuccessModal()" class="w-full bg-purple-600 text-white py-3 rounded-xl font-medium">确定</button>
        </div>

    <script>
const SERVICES = [
    { id: 1, name: '精剪造型', category: 'haircut', price: 68, duration: '45分钟', desc: '专业发型师精心设计，打造专属造型' },
    { id: 2, name: '男士理发', category: 'haircut', price: 48, duration: '30分钟', desc: '经典男士发型，清爽利落' },
    { id: 3, name: '儿童剪发', category: 'haircut', price: 38, duration: '30分钟', desc: '温馨环境，专业呵护' },
    { id: 4, name: '时尚染发', category: 'color', price: 198, duration: '2小时', desc: '优质染膏，色彩持久亮丽' },
    { id: 5, name: '渐变染发', category: 'color', price: 268, duration: '3小时', desc: '潮流渐变效果，个性十足' },
    { id: 6, name: '冷烫', category: 'perm', price: 188, duration: '2.5小时', desc: '自然卷曲，轻松打理' },
    { id: 7, name: '热烫', category: 'perm', price: 288, duration: '3小时', desc: '持久定型，光泽度高' },
    { id: 8, name: '头发护理', category: 'care', price: 98, duration: '60分钟', desc: '深层滋养，修复受损发质' },
    { id: 9, name: '头皮护理', category: 'care', price: 128, duration: '60分钟', desc: '清洁头皮，促进健康生长' },
    { id: 10, name: '营养焗油', category: 'care', price: 68, duration: '45分钟', desc: '补充营养，柔顺亮泽' },
];

const STYLISTS = [
    { id: 1, name: '李明', title: '首席设计师', experience: '10年', avatar: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=professional%20male%20hairdresser%20portrait%20asian%20stylish%20smile&image_size=square' },
    { id: 2, name: '王芳', title: '高级设计师', experience: '8年', avatar: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=professional%20female%20hairdresser%20portrait%20asian%20elegant%20smile&image_size=square' },
    { id: 3, name: '张伟', title: '资深设计师', experience: '6年', avatar: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=professional%20young%20male%20hairstylist%20portrait%20asian%20modern&image_size=square' },
    { id: 4, name: '陈雪', title: '高级设计师', experience: '7年', avatar: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=professional%20young%20female%20hairstylist%20portrait%20asian%20fashionable&image_size=square' },
];

const TIME_SLOTS = [
    '10:00', '10:30', '11:00', '11:30',
    '13:00', '13:30', '14:00', '14:30',
    '15:00', '15:30', '16:00', '16:30',
    '17:00', '17:30', '18:00', '18:30',
];

const BookingService = {
    STORAGE_KEY: 'bs_bookings',
    
    getAll: function() {
        try {
            const data = localStorage.getItem(this.STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        } catch (e) {
            console.error('Failed to read bookings:', e);
            return [];
        }
    },
    
    add: function(booking) {
        try {
            const bookings = this.getAll();
            bookings.push({ ...booking, id: Date.now(), createdAt: new Date().toISOString() });
            localStorage.setItem(this.STORAGE_KEY, JSON.stringify(bookings));
            return true;
        } catch (e) {
            console.error('Failed to save booking:', e);
            return false;
        }
    },
    
    getCount: function() {
        return this.getAll().length;
    }
};

let bookingState = {
    service: null,
    stylist: null,
    date: null,
    time: null
};

function navigateTo(pageId) {
    document.querySelectorAll('.page-container').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    
    document.getElementById(`${pageId}-page`).classList.add('active');
    document.querySelector(`.nav-item[data-page="${pageId}"]`).classList.add('active');
    
    if (pageId === 'booking') {
        initBookingPage();
    } else if (pageId === 'profile') {
        updateProfileStats();
    }
}

function renderHomeServices() {
    const container = document.getElementById('home-services');
    const hotServices = SERVICES.slice(0, 4);
    container.innerHTML = hotServices.map(s => `
        <div class="bg-white rounded-xl p-4 shadow-sm" onclick="showServiceDetail(${s.id})">
            <div class="flex items-center justify-between mb-2">
                <h3 class="font-bold">${s.name}</h3>
                <span class="text-purple-600 font-bold">¥${s.price}</span>
            </div>
            <p class="text-sm text-gray-500">${s.duration}</p>
        </div>
    `).join('');
}

function getAvatarFallback(name) {
    const colors = ['#8B5CF6', '#EC4899', '#F59E0B', '#10B981'];
    const index = name.charCodeAt(0) % colors.length;
    return colors[index];
}

function renderHomeStylists() {
    const container = document.getElementById('home-stylists');
    container.innerHTML = STYLISTS.map(s => `
        <div class="flex-shrink-0 w-24 text-center">
            <div class="relative w-16 h-16 mx-auto mb-2">
                <img src="${s.avatar}" class="w-full h-full rounded-full object-cover border-2 border-purple-100" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="hidden absolute inset-0 rounded-full border-2 border-purple-100 flex items-center justify-center text-white font-bold text-lg" style="background-color: ${getAvatarFallback(s.name)};">
                    ${s.name.charAt(0)}
                </div>
            </div>
            <div class="font-medium text-sm">${s.name}</div>
            <div class="text-xs text-gray-500">${s.title}</div>
        </div>
    `).join('');
}

function renderServicesList(category = 'all') {
    const container = document.getElementById('services-list');
    const filtered = category === 'all' ? SERVICES : SERVICES.filter(s => s.category === category);
    container.innerHTML = filtered.map(s => `
        <div class="bg-white rounded-xl p-4 shadow-sm" onclick="showServiceDetail(${s.id})">
            <div class="flex justify-between items-start mb-2">
                <div>
                    <h3 class="font-bold text-lg">${s.name}</h3>
                    <span class="text-xs text-gray-400 bg-gray-100 px-2 py-1 rounded">${getCategoryName(s.category)}</span>
                </div>
                <span class="text-purple-600 font-bold text-xl">¥${s.price}</span>
            </div>
            <p class="text-sm text-gray-500 mb-2">${s.desc}</p>
            <div class="flex items-center text-sm text-gray-400">
                <i class="fas fa-clock mr-1"></i> ${s.duration}
            </div>
        </div>
    `).join('');
}

function getCategoryName(category) {
    const map = { haircut: '剪发', color: '染发', perm: '烫发', care: '护理' };
    return map[category] || category;
}

function showServiceDetail(serviceId) {
    const service = SERVICES.find(s => s.id === serviceId);
    if (!service) return;
    
    const modal = document.getElementById('modal-overlay');
    const content = document.getElementById('modal-content');
    content.innerHTML = `
        <div class="p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold">${service.name}</h3>
                <button onclick="closeModal()" class="text-gray-400"><i class="fas fa-times"></i></button>
            </div>
            <div class="flex items-center mb-4">
                <span class="text-purple-600 font-bold text-2xl">¥${service.price}</span>
                <span class="text-gray-400 ml-4"><i class="fas fa-clock mr-1"></i> ${service.duration}</span>
            </div>
            <div class="bg-gray-50 rounded-lg p-4 mb-4">
                <h4 class="font-bold mb-2">服务介绍</h4>
                <p class="text-gray-600 text-sm">${service.desc}</p>
            </div>
            <button onclick="selectServiceForBooking(${serviceId}); closeModal();" class="w-full bg-purple-600 text-white py-3 rounded-xl font-medium">立即预约</button>
        </div>
    `;
    modal.classList.add('active');
}

function closeModal() {
    document.getElementById('modal-overlay').classList.remove('active');
}

function initBookingPage() {
    renderBookingServices();
    renderBookingStylists();
    renderDateTabs();
    renderTimeSlots();
    updateSubmitButton();
}

function renderBookingServices() {
    const container = document.getElementById('booking-services');
    container.innerHTML = SERVICES.map(s => `

            <div class="text-purple-600 font-medium text-sm">¥${s.price}</div>
        </div>
    `).join('');
}

function selectService(serviceId) {
    const service = SERVICES.find(s => s.id === serviceId);
    bookingState.service = service;

}

function renderBookingStylists() {

}

function renderDateTabs() {
    const container = document.getElementById('date-tabs');
    const dates = [];
    const today = new Date();
    const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    
    for (let i = 0; i < 7; i++) {
        const date = new Date(today);
        date.setDate(today.getDate() + i);
        dates.push({
            full: date.toISOString().split('T')[0],
            day: date.getDate(),
            week: weekdays[date.getDay()],
            isToday: i === 0
        });
    }
    
    container.innerHTML = dates.map(d => `
        <button class="flex-shrink-0 px-3 py-2 rounded-lg border text-sm transition-all ${bookingState.date === d.full ? 'bg-purple-600 text-white border-purple-600' : 'bg-white text-gray-600'}" onclick="selectDate('${d.full}')">
            <div>${d.isToday ? '今天' : d.week}</div>
            <div class="font-bold">${d.day}</div>
        </button>
    `).join('');
    
    if (!bookingState.date) {
        selectDate(dates[0].full);
    }
}

function selectDate(date) {
    bookingState.date = date;
    renderDateTabs();
    renderTimeSlots();
    updateSubmitButton();
}

function renderTimeSlots() {
    const container = document.getElementById('time-slots');
    container.innerHTML = TIME_SLOTS.map(time => {
        const isPast = isTimePast(bookingState.date, time);
        const isSelected = bookingState.time === time;
        return `
            <div class="time-slot text-sm ${isPast ? 'disabled' : ''} ${isSelected && !isPast ? 'selected' : ''}" onclick="${isPast ? '' : `selectTime('${time}')`}">
                ${time}
            </div>
        `;
    }).join('');
}

function isTimePast(dateStr, timeStr) {
    if (!dateStr) return true;
    const today = new Date().toISOString().split('T')[0];
    if (dateStr < today) return true;
    if (dateStr === today) {
        const now = new Date();
        const [hours, minutes] = timeStr.split(':').map(Number);
        const slotTime = new Date();
        slotTime.setHours(hours, minutes, 0, 0);
        return now > slotTime;
    }
    return false;
}

function selectTime(time) {
    bookingState.time = time;
    renderTimeSlots();
    updateSubmitButton();
}

function updateSubmitButton() {
    const btn = document.getElementById('submit-booking');
    const hasService = !!bookingState.service;
    const hasStylist = !!bookingState.stylist;
    const hasTime = !!bookingState.time;
    const hasDate = !!bookingState.date;
    const hasName = document.getElementById('booking-name').value.trim().length > 0;
    const hasPhone = /^1[3-9]\d{9}$/.test(document.getElementById('booking-phone').value.trim());
    
    btn.disabled = !(hasService && hasStylist && hasTime && hasDate && hasName && hasPhone);
}

function submitBooking() {
    const name = document.getElementById('booking-name').value.trim();
    const phone = document.getElementById('booking-phone').value.trim();
    const note = document.getElementById('booking-note').value.trim();
    
    if (!name) {
        alert('请输入姓名');
        return;
    }
    if (!phone || !/^1[3-9]\d{9}$/.test(phone)) {
        alert('请输入正确的手机号');
        return;
    }
    
    const booking = {
        service: bookingState.service,
        stylist: bookingState.stylist,
        date: bookingState.date,
        time: bookingState.time,
        name,
        phone,
        note
    };
    
    const success = BookingService.add(booking);
    if (success) {
        showSuccessModal(booking);
        resetBooking();
    } else {
        alert('预约失败，请重试');
    }
}

function showSuccessModal(booking) {
    const modal = document.getElementById('success-modal');
    const message = document.getElementById('success-message');
    message.innerHTML = `
        ${booking.date} ${booking.time}<br>
        ${booking.service.name} · ${booking.stylist.name}
    `;
    modal.classList.add('active');
}

function closeSuccessModal() {
    document.getElementById('success-modal').classList.remove('active');

}

function resetBooking() {
    bookingState = { service: null, stylist: null, date: null, time: null };
    document.getElementById('booking-name').value = '';

}

document.addEventListener('DOMContentLoaded', function() {
    renderHomeServices();
    renderHomeStylists();
    renderServicesList();
    
    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', function() {
            navigateTo(this.dataset.page);
        });
    });
    
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            renderServicesList(this.dataset.category);
        });
    });
    
    document.getElementById('submit-booking').addEventListener('click', submitBooking);
    
    document.getElementById('modal-overlay').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });
    
    document.getElementById('success-modal').addEventListener('click', function(e) {
        if (e.target === this) closeSuccessModal();
    });
    
    document.getElementById('booking-name').addEventListener('input', updateSubmitButton);
    document.getElementById('booking-phone').addEventListener('input', updateSubmitButton);
});
</script>
