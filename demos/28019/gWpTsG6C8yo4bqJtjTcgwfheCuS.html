<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>植物大战僵尸 · 从夯到拉排行榜</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

body { background: #0d1f06; color: #fff; }

/* Animations */
@keyframes float {
  0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
  50% { transform: translateY(-20px) scale(1.2); opacity: 1; }
}
@keyframes fade-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes bounce-in {
  0% { opacity: 0; transform: scale(0.3); }
  50% { transform: scale(1.1); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes title-appear {
  from { opacity: 0; transform: translateY(30px) scale(0.9); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes card-in {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes modal-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes modal-content {
  from { opacity: 0; transform: scale(0.9) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

/* Hero */
.hero {
  position: relative; overflow: hidden; min-height: 520px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.hero-bg {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, #1a3a0a, #2d5a1a, #1a3a0a);
}
.hero-grid {
  position: absolute; inset: 0; opacity: 0.2;
  background-image: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(76,175,80,0.3) 40px, rgba(76,175,80,0.3) 42px),
    repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(76,175,80,0.2) 40px, rgba(76,175,80,0.2) 42px);
}
.hero-particles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.particle {
  position: absolute; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,215,0,0.8), rgba(255,165,0,0.3));
  animation: float 3s ease-in-out infinite;
}
.hero-content { position: relative; z-index: 10; text-align: center; padding: 0 16px; }

.tier-badges { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; animation: fade-in 0.8s ease-out both; }
.tier-badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px;
  border-radius: 9999px; font-size: 14px; font-weight: 700;
  animation: bounce-in 0.6s ease-out both;
}

.hero-title {
  font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 900; margin-bottom: 16px;
  background: linear-gradient(135deg, #FFD700, #FFA500, #FF6347);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
  animation: title-appear 0.8s ease-out both;
}
.hero-subtitle {
  font-size: clamp(1.5rem, 5vw, 3rem); font-weight: 800; margin-bottom: 24px;
  color: #4CAF50; text-shadow: 0 0 20px rgba(76,175,80,0.5), 0 4px 8px rgba(0,0,0,0.5);
  animation: title-appear 0.8s ease-out 0.2s both;
}
.hero-desc {
  font-size: clamp(1rem, 2.5vw, 1.25rem); color: rgba(200,230,200,0.8);
  max-width: 640px; margin: 0 auto; animation: fade-in 0.8s ease-out 0.4s both;
}
.scroll-hint { margin-top: 40px; animation: bounce 2s infinite; color: rgba(200,230,200,0.4); text-align: center; }
.scroll-hint span { font-size: 14px; display: block; margin-bottom: 4px; }
.hero-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 64px; background: linear-gradient(to top, #2d5a1a, transparent); }

/* Filter */
.filter-bar {
  position: sticky; top: 0; z-index: 30; padding: 16px;
  background: linear-gradient(to bottom, rgba(26,58,10,0.95), rgba(26,58,10,0.85));
  backdrop-filter: blur(12px);
}
.filter-inner { max-width: 1152px; margin: 0 auto; display: flex; align-items: center; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.filter-inner::-webkit-scrollbar { display: none; }
.filter-btn {
  flex-shrink: 0; padding: 10px 20px; border-radius: 12px; font-weight: 700;
  font-size: 14px; border: 2px solid; cursor: pointer; transition: all 0.3s;
  font-family: inherit;
}
.filter-btn.active { color: #fff !important; }

/* Main */
.main { max-width: 1152px; margin: 0 auto; padding: 32px 16px; }

.tier-section { margin-bottom: 40px; }
.tier-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
.tier-label {
  display: flex; align-items: center; gap: 8px; padding: 10px 20px;
  border-radius: 12px; font-size: 20px; font-weight: 900;
}
.tier-line { flex: 1; height: 1px; }
.tier-count { font-size: 14px; color: rgba(255,255,255,0.4); }

.cards-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
}
@media (max-width: 1024px) { .cards-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 768px) { .cards-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .cards-grid { grid-template-columns: 1fr; } }

/* Card */
.card {
  position: relative; cursor: pointer; border-radius: 16px; padding: 16px;
  background: rgba(255,255,255,0.05); backdrop-filter: blur(8px);
  transition: all 0.3s; animation: card-in 0.5s ease-out both;
}
.card:hover { transform: scale(1.05) translateY(-4px); }
.card-badge {
  position: absolute; top: -8px; right: -8px; width: 40px; height: 40px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 900;
}
.card-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.card-img-wrap {
  width: 56px; height: 56px; border-radius: 12px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.3s; flex-shrink: 0;
}
.card:hover .card-img-wrap { transform: scale(1.1) rotate(3deg); }
.card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.card-info { flex: 1; min-width: 0; }
.card-name { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-stars { display: flex; align-items: center; gap: 2px; margin-top: 4px; }
.card-stars .star { font-size: 12px; }
.card-stars .score { margin-left: 4px; font-size: 12px; font-weight: 700; }
.card-desc { font-size: 14px; color: rgba(255,255,255,0.6); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-bar { margin-top: 12px; height: 4px; border-radius: 9999px; overflow: hidden; }
.card-bar-fill { height: 100%; border-radius: 9999px; transition: width 0.7s; }
.card-glow {
  position: absolute; inset: 0; border-radius: 16px; opacity: 0;
  transition: opacity 0.3s; pointer-events: none;
}
.card:hover .card-glow { opacity: 1; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: center;
  justify-content: center; padding: 16px; animation: modal-in 0.2s ease-out;
}
.modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
.modal {
  position: relative; width: 100%; max-width: 512px; border-radius: 24px;
  overflow: hidden; animation: modal-content 0.3s ease-out;
  background: linear-gradient(145deg, rgba(30,60,15,0.95), rgba(20,40,10,0.98));
}
.modal-close {
  position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center; border-radius: 50%;
  background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); border: none;
  cursor: pointer; font-size: 18px; z-index: 10; transition: all 0.2s;
}
.modal-close:hover { background: rgba(255,255,255,0.2); color: #fff; }
.modal-header { padding: 24px 24px 16px; display: flex; align-items: center; gap: 16px; }
.modal-img-wrap {
  width: 80px; height: 80px; border-radius: 16px; overflow: hidden;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.modal-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.modal-tier-badge {
  display: inline-block; padding: 2px 12px; border-radius: 9999px;
  font-size: 12px; font-weight: 700; margin-bottom: 4px;
}
.modal-name { font-size: 24px; font-weight: 900; }
.modal-stars { display: flex; align-items: center; gap: 2px; margin-top: 4px; }
.modal-body { padding: 24px; }
.modal-desc { color: rgba(255,255,255,0.8); font-size: 16px; line-height: 1.6; font-style: italic; margin-bottom: 20px; }
.modal-score-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
.modal-score-bar { height: 12px; border-radius: 9999px; overflow: hidden; margin-bottom: 20px; }
.modal-score-fill { height: 100%; border-radius: 9999px; transition: width 1s; }
.modal-section-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
.modal-list { list-style: none; margin-bottom: 16px; }
.modal-list li { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 6px; }
.modal-list li .icon { flex-shrink: 0; margin-top: 2px; }

/* Footer */
.footer { text-align: center; padding: 32px; color: rgba(255,255,255,0.2); font-size: 14px; border-top: 1px solid rgba(255,255,255,0.05); }

.hidden { display: none !important; }
</style>
</head>
<body>

<div id="app"></div>

<script>

  { id:11, name:'豌豆射手', image:img('Peashooter from Plants vs Zombies, a green plant head with a tube mouth shooting peas, cartoon style, game asset, white background'), tier:'T2', score:7.5, description:'万金油输出，稳定可靠', pros:['稳定持续输出','造价便宜','适配各种阵容'], cons:['伤害偏低','无法攻击路障后僵尸'] },

  { id:16, name:'三线射手', image:img('Threepeater from Plants vs Zombies, three green peashooter heads on one stem shooting in three directions, cartoon style, game asset, white background'), tier:'T3', score:6.0, description:'三路输出，但单路偏弱', pros:['同时攻击三路','覆盖面广'], cons:['单路伤害低','不如集中一路输出','造价偏高'] },

  { id:23, name:'小喷菇', image:img('Puff-shroom from Plants vs Zombies, a tiny cute light purple mushroom shooting small puffs, cartoon style, game asset, white background'), tier:'T5', score:2.0, description:'伤害太低，射程太短', pros:['免费种植','夜间可用','可以铺满'], cons:['伤害极低','射程极短','白天需要咖啡豆'] },

let selectedTier = null;
let selectedPlant = null;

function getTier(tier) { return tierInfo.find(t => t.tier === tier); }

function stars(score, size) {
  const full = Math.round(score / 2);
  let html = '';
  for (let i = 0; i < 5; i++) {
    html += `<span class="star" style="font-size:${size};color:${i < full ? '#FFD700' : 'rgba(255,255,255,0.15)'}">★</span>`;
  }
  return html;
}

function renderHero() {
  let particles = '';
  for (let i = 0; i < 12; i++) {
    const s = 8 + Math.random() * 16;
    particles += `<div class="particle" style="width:${s}px;height:${s}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${i*0.5}s;animation-duration:${3+Math.random()*4}s"></div>`;
  }
  let badges = tierInfo.map((t, i) =>
    `<span class="tier-badge" style="color:${t.color};background:${t.bgColor};border:2px solid ${t.color};animation-delay:${i*0.1}s">${t.tier} ${t.label}</span>`
  ).join('');

  return `
  <section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-grid"></div>
    <div class="hero-particles">${particles}</div>
    <div class="hero-content">
      <div class="tier-badges">${badges}</div>
      <h1 class="hero-title">植物大战僵尸</h1>
      <h2 class="hero-subtitle">从夯到拉排行榜</h2>
      <p class="hero-desc">谁是草坪上的王者？谁是浪费阳光的废物？一榜定乾坤！</p>
      <div class="scroll-hint"><span>向下滚动查看排行</span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 13l5 5 5-5M7 6l5 5 5-5"/></svg></div>
    </div>
    <div class="hero-bottom"></div>
  </section>`;
}

function renderFilter() {
  let btns = `<button class="filter-btn" style="color:${selectedTier===null?'#fff':'rgba(255,255,255,0.6)'};background:${selectedTier===null?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.05)'};border-color:${selectedTier===null?'rgba(255,255,255,0.5)':'rgba(255,255,255,0.1)'}" data-tier="">全部</button>`;
  tierInfo.forEach(t => {
    const active = selectedTier === t.tier;
    btns += `<button class="filter-btn${active?' active':''}" style="color:${active?'#fff':t.color};background:${active?t.color:t.bgColor};border-color:${active?t.color:t.color+'40'};${active?'box-shadow:'+t.glow:''}" data-tier="${t.tier}">${t.tier} ${t.label}</button>`;
  });
  return `<div class="filter-bar"><div class="filter-inner">${btns}</div></div>`;
}

function renderCards() {
  const tiers = selectedTier ? tierInfo.filter(t => t.tier === selectedTier) : tierInfo;
  let html = '';
  tiers.forEach(t => {
    const tierPlants = plants.filter(p => p.tier === t.tier);
    if (!tierPlants.length) return;
    let cards = tierPlants.map((p, i) => `
      <div class="card" style="border:2px solid ${t.color}30;animation-delay:${i*0.05}s" data-plant-id="${p.id}">
        <div class="card-badge" style="background:${t.color};color:${t.tier==='T0'?'#1a1a1a':'#fff'};box-shadow:${t.glow}">${t.label}</div>
        <div class="card-top">
          <div class="card-img-wrap" style="background:${t.bgColor};border:2px solid ${t.color}30">
            <img src="${p.image}" alt="${p.name}" loading="lazy">
          </div>
          <div class="card-info">
            <div class="card-name">${p.name}</div>
            <div class="card-stars">${stars(p.score, '12px')}<span class="score" style="color:${t.color}">${p.score}</span></div>
          </div>
        </div>
        <div class="card-desc">${p.description}</div>
        <div class="card-bar" style="background:${t.color}20"><div class="card-bar-fill" style="width:${p.score*10}%;background:${t.color}"></div></div>
        <div class="card-glow" style="box-shadow:inset 0 0 30px ${t.color}15, 0 0 20px ${t.color}10"></div>
      </div>
    `).join('');
    html += `
    <section class="tier-section">
      <div class="tier-header">
        <div class="tier-label" style="color:${t.color};background:${t.bgColor};border:2px solid ${t.borderColor};box-shadow:${t.glow}">${t.tier} ${t.label}</div>
        <div class="tier-line" style="background:${t.color}30"></div>
        <div class="tier-count">${tierPlants.length} 个植物</div>
      </div>
      <div class="cards-grid">${cards}</div>
    </section>`;
  });
  return `<main class="main">${html}</main>`;
}

function renderModal() {
  if (!selectedPlant) return '';
  const t = getTier(selectedPlant.tier);
  return `
  <div class="modal-overlay" id="modal">
    <div class="modal-backdrop"></div>
    <div class="modal" style="border:2px solid ${t.color}50;box-shadow:0 0 40px ${t.color}20, 0 25px 50px rgba(0,0,0,0.5)">
      <button class="modal-close" id="modal-close">✕</button>
      <div class="modal-header" style="background:${t.bgColor}">
        <div class="modal-img-wrap" style="background:rgba(0,0,0,0.2);border:2px solid ${t.color}40">
          <img src="${selectedPlant.image}" alt="${selectedPlant.name}">
        </div>
        <div>
          <span class="modal-tier-badge" style="background:${t.color};color:${t.tier==='T0'?'#1a1a1a':'#fff'}">${t.tier} ${t.label}</span>
          <div class="modal-name">${selectedPlant.name}</div>
          <div class="modal-stars">${stars(selectedPlant.score, '14px')}<span style="margin-left:8px;font-size:18px;font-weight:900;color:${t.color}">${selectedPlant.score}</span></div>
        </div>
      </div>
      <div class="modal-body">
        <div class="modal-desc">"${selectedPlant.description}"</div>
        <div class="modal-score-row"><span style="color:rgba(255,255,255,0.5)">强度评分</span><span style="font-weight:700;color:${t.color}">${selectedPlant.score}/10</span></div>
        <div class="modal-score-bar" style="background:${t.color}20"><div class="modal-score-fill" style="width:${selectedPlant.score*10}%;background:${t.color};box-shadow:0 0 10px ${t.color}60"></div></div>
        <div class="modal-section-title" style="color:#4ade80">✦ 优点</div>
        <ul class="modal-list">${selectedPlant.pros.map(p => `<li><span class="icon" style="color:#4ade80">+</span><span>${p}</span></li>`).join('')}</ul>
        <div class="modal-section-title" style="color:#f87171">✦ 缺点</div>
        <ul class="modal-list">${selectedPlant.cons.map(c => `<li><span class="icon" style="color:#f87171">-</span><span>${c}</span></li>`).join('')}</ul>
      </div>
    </div>
  </div>`;
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = renderHero() + renderFilter() + renderCards() + renderModal() +
    `<footer class="footer">植物大战僵尸 · 从夯到拉排行榜 — 纯属娱乐，不服来辩</footer>`;

  // Filter events
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tier = btn.dataset.tier;
      selectedTier = tier || null;
      render();
    });
  });

  // Card click events
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      selectedPlant = plants.find(p => p.id === parseInt(card.dataset.plantId));
      render();
    });
  });

  // Modal close events
  const modal = document.getElementById('modal');
  const modalClose = document.getElementById('modal-close');
  if (modal) {
    modal.addEventListener('click', (e) => {
      if (e.target === modal || e.target.classList.contains('modal-backdrop')) {
        selectedPlant = null;
        render();
      }
    });
  }
  if (modalClose) {
    modalClose.addEventListener('click', () => { selectedPlant = null; render(); });
  }
}

render();
</script>
</body>
</html>
