<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古今对话堂 — 与历史名家跨时空对话</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">

    <!-- ECharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

    <!-- jsPDF CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- html2canvas CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- 自定义样式 -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body style="min-width: 1200px;">

    <!-- ==================== 粒子背景容器 ==================== -->
    <!-- 由 JS 动态创建粒子动画效果，营造沉浸式氛围 -->
    <div id="particleContainer"></div>

    <!-- ==================== 顶部导航栏 ==================== -->
    <!-- 固定在页面顶部，包含 logo、各页面导航链接、用户名显示 -->
    <nav class="top-nav">
        <!-- Logo 区域：展示「古今对话堂」品牌标识 -->
        <div class="nav-logo">
            <span class="logo-text">古今对话堂</span>
        </div>

        <!-- 导航链接区域：各页面的快速跳转入口 -->
        <div class="nav-links">
            <a href="#" data-page="home">首页</a>
            <a href="#" data-page="select">名家大厅</a>
            <a href="#" data-page="quiz">知识检测</a>
            <a href="#" data-page="report">学习报告</a>
            <a href="#" data-page="leaderboard">排行榜</a>
            <a href="#" data-page="notes">学习笔记</a>
        </div>

        <!-- 用户信息区域：显示当前用户名 -->
        <div class="nav-user">
            <span id="navUsername">未登录</span>
        </div>
    </nav>

    <!-- ==================== 用户名输入模态框 ==================== -->
    <!-- 首次进入时弹出，要求用户输入昵称以记录学习进度 -->
    <div id="usernameModal" class="modal">
        <div class="modal-content">
            <h2>欢迎来到古今对话堂</h2>
            <p>请输入您的昵称，开始跨越时空的对话之旅</p>
            <input type="text" id="usernameInput" placeholder="请输入您的昵称" maxlength="20">
            <button id="usernameConfirm">开始探索</button>
        </div>
    </div>

    <!-- ==================== 页面1：首页 ==================== -->
    <!-- 品牌展示页面，包含 logo、标语、氛围动画、进入按钮 -->
    <section id="page-home" class="page active">
        <!-- 品牌视觉区域：大 logo、主标语、副标语 -->
        <div class="home-hero" id="homeHero"></div>

        <!-- 功能入口区域：快速进入各模块的按钮组 -->
        <div class="home-features container" id="homeFeatures"></div>

        <!-- 进入按钮：引导用户进入名家选择大厅 -->
        <div class="home-action" id="homeAction"></div>
    </section>

    <!-- ==================== 页面2：名家选择大厅 ==================== -->
    <!-- 展示所有可对话的历史名家，支持按朝代、领域等条件筛选 -->
    <section id="page-select" class="page">
        <div class="select-header container">
            <h2>名家大厅</h2>
            <p>选择你想对话的历史名家，开启跨越时空的思想之旅</p>
        </div>
        <!-- 筛选栏：按朝代、领域、难度等维度筛选名家 -->
        <div class="select-filters container"></div>

        <!-- 名家卡片网格容器：展示所有名家信息卡片 -->
        <div id="masterGrid" class="master-grid container"></div>
    </section>

    <!-- ==================== 页面3：场景页面 ==================== -->
    <!-- 进入对话前的场景铺垫，展示历史背景和对话环境 -->
    <section id="page-scene" class="page">
        <div class="scene-container">
            <!-- 场景视觉区域：沉浸式场景背景图/动画 -->
            <div id="sceneVisual" class="scene-visual"></div>

            <!-- 场景信息区域：场景描述文字、对话准备信息 -->
            <div class="scene-info"></div>
        </div>
    </section>

    <!-- ==================== 页面4：对话页面 ==================== -->
    <!-- 与历史名家的核心对话交互界面 -->
    <section id="page-dialogue" class="page">
        <div class="dialogue-container">
            <!-- 对话头部：当前名家信息、返回按钮 -->
            <div class="dialogue-header"></div>

            <!-- 对话进度条：显示当前对话的完成进度 -->
            <div class="dialogue-progress"></div>

            <!-- 消息区域：展示对话历史记录 -->
            <div id="dialogueMessages" class="dialogue-messages"></div>

            <!-- 问题区域：当前话题的预设选项 -->
            <div id="dialogueQuestions" class="dialogue-questions"></div>

            <!-- 自由输入区域：用户可自由输入问题 -->
            <div class="dialogue-input"></div>
        </div>
    </section>

    <!-- ==================== 页面5：思想实验页面 ==================== -->
    <!-- 基于名家思想的核心实验场景，用户做出选择并获取反馈 -->
    <section id="page-thought-exp" class="page">
        <div class="thought-container">
            <!-- 思想实验头部：实验标题和说明 -->
            <div class="thought-header"></div>

            <!-- 场景描述区域：思想实验的情境设定 -->
            <div id="thoughtScenario" class="thought-scenario"></div>

            <!-- 选择区域：用户做出道德/哲学选择 -->
            <div id="thoughtChoices" class="thought-choices"></div>

            <!-- 反馈区域：展示选择后的名家回应和分析 -->
            <div id="thoughtFeedback" class="thought-feedback"></div>
        </div>
    </section>

    <!-- ==================== 页面6：知识检测页面 ==================== -->
    <section id="page-quiz" class="page">
        <div class="quiz-container">
            <!-- Quiz 头部信息：测评标题、分数、连击 -->
            <div class="quiz-header">
                <h2>知识检测</h2>
                <div class="stats">
                    <span>第 <strong id="quizCurrent">1</strong> / <span id="quizTotal">5</span> 题</span>
                    <span class="score">得分：<strong id="quizScore">0</strong></span>
                    <span class="streak">连击：<strong id="quizStreak">0</strong></span>
                </div>
            </div>

            <!-- 测评进度条 -->
            <div class="quiz-progress">
                <div class="quiz-progress-bar">
                    <div class="quiz-progress-fill" id="quizProgressFill" style="width:0%;"></div>
                </div>
            </div>

            <!-- 测评内容区域：题目和选项 -->
            <div id="quizContent" class="quiz-content"></div>
        </div>
    </section>

    <!-- ==================== 页面7：学习报告页面 ==================== -->
    <!-- 综合展示用户的学习数据、知识掌握情况、成长轨迹 -->
    <section id="page-report" class="page">
        <!-- 报告内容区域 -->
        <div id="reportContent" class="report-content">
            <!-- 由 JS 动态渲染：学习概览统计、知识雷达图（ECharts）、
                 对话历史摘要、各名家掌握度、学习时长统计、
                 导出 PDF 按钮 -->
        </div>
    </section>

    <!-- ==================== 页面8：排行榜页面 ==================== -->
    <section id="page-leaderboard" class="page">
        <div class="leaderboard-container">
            <!-- 排行榜筛选栏：按不同维度查看排名 -->
            <div class="leaderboard-filter">
                <button class="filter-btn active" data-sort="score">总积分</button>
                <button class="filter-btn" data-sort="clear">完成对话</button>
                <button class="filter-btn" data-sort="fragments">思想碎片</button>
            </div>

            <!-- 排行榜表格 -->
            <table id="leaderboardTable" class="leaderboard-table">
                <thead>
                    <tr>
                        <th>名次</th>
                        <th>用户</th>
                        <th>积分</th>
                        <th>完成对话</th>
                        <th>思想碎片</th>
                        <th>徽章</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody"></tbody>
            </table>
        </div>
    </section>

    <!-- ==================== 页面9：学习笔记页面 ==================== -->
    <!-- 用户可记录和回顾学习过程中的心得与笔记 -->
    <section id="page-notes" class="page">
        <!-- 笔记内容区域 -->
        <div id="notesContent" class="notes-content">
            <!-- 由 JS 动态渲染：笔记列表、新建笔记按钮、笔记编辑器、
                 按名家/时间分类筛选 -->
        </div>
    </section>

    <!-- ==================== 脚本引入 ==================== -->
    <!-- 数据层：名家数据、对话数据、测评题库等 -->
    <script src="js/data.js"></script>

    <!-- 主逻辑：页面路由、状态管理、核心交互 -->
    <script src="js/app.js"></script>

    <!-- 语音模块：语音合成（TTS）朗读名家对话 -->
    <script src="js/modules/speech.js"></script>

    <!-- 测评模块：知识检测的出题、判分、解析逻辑 -->
    <script src="js/modules/quiz.js"></script>

    <!-- 报告模块：学习报告的数据统计与图表渲染 -->
    <script src="js/modules/report.js"></script>

    <!-- 排行榜模块：排名计算与展示逻辑 -->
    <script src="js/modules/leaderboard.js"></script>

</body>
</html>
