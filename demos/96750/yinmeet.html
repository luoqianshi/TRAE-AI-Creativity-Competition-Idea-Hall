    ]

let currentSong = 'yuet';
let activeLyricIdx = -1;
let isRecording = false;

function selectSong(chip, songKey) {
  document.querySelectorAll('.song-chip').forEach(c => c.classList.remove('selected'));
  chip.classList.add('selected');
  currentSong = songKey;
  const song = songs[songKey];
  document.getElementById('coverArt').textContent = song.emoji;
  document.getElementById('songTitle').textContent = song.title;
  document.getElementById('songArtist').textContent = song.artist;
  renderLyrics();
  resetUI();
}

function renderLyrics() {
  const song = songs[currentSong];
  const container = document.getElementById('lyricsContainer');
  container.innerHTML = song.lyrics.map((l, i) => `
    <div class="lyric-line ${i === activeLyricIdx ? 'active' : ''}" onclick="selectLyric(${i})">
      <span class="lyric-char">${l.char}</span>
      <span class="lyric-pinyin">${l.pinyin}</span>
      <span class="lyric-tip">${l.tip}</span>
    </div>
  `).join('');
}

function selectLyric(idx) {
  activeLyricIdx = idx;
  const song = songs[currentSong];
  const l = song.lyrics[idx];
  document.getElementById('pronounceWord').textContent = l.char;
  document.getElementById('pronouncePinyin').textContent = l.pinyin;
  document.getElementById('pronounceDesc').textContent = l.tip;
  document.getElementById('pronouncePanel').classList.add('show');
  renderLyrics();
}

function resetUI() {
  activeLyricIdx = -1;
  isRecording = false;
  document.getElementById('pronouncePanel').classList.remove('show');
  document.getElementById('scoreDisplay').classList.remove('show');
  document.getElementById('recordBtn').classList.remove('recording');
  document.getElementById('recordBtn').textContent = '🎙️';
  document.getElementById('recordLabel').textContent = '点击录音，AI 评测发音';
  renderLyrics();
}

function toggleRecord() {
  const btn = document.getElementById('recordBtn');
  const label = document.getElementById('recordLabel');
  const scoreDisplay = document.getElementById('scoreDisplay');

  if (isRecording) {
    // Stop recording - show score
    isRecording = false;
    btn.classList.remove('recording');
    btn.textContent = '🎙️';
    label.textContent = '点击录音，AI 评测发音';

    // Simulate scoring
    const score = Math.floor(70 + Math.random() * 28);
    const tone = Math.floor(65 + Math.random() * 30);
    const phone = Math.floor(70 + Math.random() * 28);
    const rhythm = Math.floor(72 + Math.random() * 25);

    scoreDisplay.classList.add('show');
    document.getElementById('scoreValue').textContent = score;
    document.getElementById('toneScore').textContent = tone;
    document.getElementById('phoneScore').textContent = phone;
    document.getElementById('rhythmScore').textContent = rhythm;

    // Animate score
    const circle = document.querySelector('.score-circle');
    circle.style.animation = 'none';
    circle.offsetHeight;
    circle.style.animation = 'score-pop 0.5s ease';
  } else {
    // Start recording
    isRecording = true;
    btn.classList.add('recording');
    btn.textContent = '⏹️';
    label.textContent = '正在录音中...';

    // Auto stop after 2.5s
    setTimeout(() => {
      if (isRecording) toggleRecord();
    }, 2500);
  }
}

// Init
renderLyrics();
</script>

</body>
</html>
