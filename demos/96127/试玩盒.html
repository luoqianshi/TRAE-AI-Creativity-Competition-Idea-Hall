<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>宠物试玩盒</title>
  <style>
    :root {
      --bg-primary: #fdfaf6;
      --bg-card: #f8f4f0;
      --text-primary: #333;
      --text-secondary: #666;
      --accent-green: #8bbda5;
      --accent-brown: #c9a88b;
      --border: #e8e0d7;
      --shadow: 0 2px 12px rgba(0,0,0,0.04);
      --radius: 12px;
      --transition: all 0.25s ease;
      --font-title: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-body: 'Helvetica Neue', 'Arial', sans-serif;
    }

    .dark-theme {
      --bg-primary: #2d2d2d;
      --bg-card: #3a3a3a;
      --text-primary: #f0f0f0;
      --text-secondary: #aaa;
      --border: #4a4a4a;
      --accent-green: #7ac5a3;
      --accent-brown: #b89a7d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 20px;
      transition: var(--transition);
    }

    @media (max-width: 768px) {
      body {
        padding: 16px;
      }
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      padding-top: 16px;
    }

    h1 {
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 28px;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 16px;
      color: var(--text-secondary);
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 28px;
      transition: var(--transition);
    }

    .card-title {
      font-family: var(--font-title);
      font-weight: 600;
      font-size: 20px;
      margin-bottom: 16px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title svg {
      width: 20px;
      height: 20px;
      fill: var(--accent-green);
    }

    .upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      background: rgba(255,255,255,0.5);
    }

    .dark-theme .upload-area {
      background: rgba(0,0,0,0.1);
    }

    .upload-area:hover {
      border-color: var(--accent-green);
      background: rgba(139, 189, 165, 0.08);
    }

    .upload-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 12px;
      fill: var(--accent-green);
    }

    .upload-text {
      font-size: 15px;
      margin-bottom: 12px;
      color: var(--text-secondary);
    }

    .btn-upload {
      background: var(--accent-green);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-upload:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .photo-preview {
      margin-top: 16px;
      display: none;
      text-align: center;
    }

    .photo-preview img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin: 0 auto;
      display: block;
    }

    .preview-label {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 8px;
      font-style: italic;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    @media (max-width: 768px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }

    .option-group {
      margin-bottom: 16px;
    }

    .option-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .options-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .option-btn {
      background: white;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-primary);
    }

    .dark-theme .option-btn {
      background: #444;
      border-color: #555;
      color: #eee;
    }

    .option-btn.active {
      background: var(--accent-green);
      color: white;
      border-color: var(--accent-green);
    }

    .dark-theme .option-btn.active {
      background: #6aa38c;
    }

    .result-card {
      background: white;
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-top: 24px;
      display: none;
      border-left: 4px solid var(--accent-green);
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-title {
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 20px;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .result-text {
      font-size: 16px;
      line-height: 1.7;
      color: var(--text-primary);
      margin-bottom: 16px;
    }

    .hint-badge {
      display: inline-block;
      background: rgba(139, 189, 165, 0.15);
      color: var(--accent-green);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      margin-top: 8px;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: white;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 100;
      transition: var(--transition);
    }

    .dark-theme .theme-toggle {
      background: #3a3a3a;
      border-color: #4a4a4a;
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: var(--accent-green);
    }

    .dark-theme .theme-toggle svg {
      fill: #f0f0f0;
    }

    .theme-toggle:hover {
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    @media (max-width: 480px) {
      .card {
        padding: 20px 16px;
      }
      h1 {
        font-size: 24px;
      }
      .upload-area {
        padding: 24px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="theme-toggle" id="themeToggle">
    <svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h1.5zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H6a.75.75 0 01-.75-.75V12.75A.75.75 0 016 12h1.5zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM12 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5z"/></svg>
  </div>

  <div class="container">
    <header>
      <h1>宠物试玩盒</h1>
      <p class="subtitle">上传一张宠物照片，勾选3个特征，3秒看懂这个玩具它爱不爱玩</p>
    </header>

    <main>
      <section class="card">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path d="M12 9a3.75 3.75 0 100 7.5A3.75 3.75 0 0012 9z" /><path d="M21.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" /></svg>
          上传宠物照片
        </h2>
        <div class="upload-area" id="uploadArea">
          <svg class="upload-icon" viewBox="0 0 24 24"><path d="M12 16.5a4.5 4.5 0 01-4.5-4.5V5.5a1.5 1.5 0 011.5-1.5h9a1.5 1.5 0 011.5 1.5v6.5a4.5 4.5 0 01-4.5 4.5z" /><path d="M12 10.5a3 3 0 00-3 3 3 3 0 003 3 3 3 0 003-3 3 3 0 00-3-3z" /></svg>
          <p class="upload-text">点击上传或拖入宠物正面清晰照</p>
          <button class="btn-upload">选择照片</button>
          <input type="file" id="photoInput" accept="image/*" style="display:none;">
        </div>
        <div class="photo-preview" id="photoPreview">
          <img id="previewImage" alt="宠物预览">
          <p class="preview-label" id="previewLabel">已识别：橘猫 · 建议关注抓挠偏好</p>
        </div>
      </section>

      <section class="card">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path d="M12 12a.75.75 0 100-1.5.75.75 0 000 1.5zM12 12a.75.75 0 100-1.5.75.75 0 000 1.5zM12 12a.75.75 0 100-1.5.75.75 0 000 1.5z" /></svg>
          快速勾选3个特征
        </h2>
        <div class="options-grid">
          <div class="option-group">
            <div class="option-title">品种</div>
            <div class="options-list">
              <button class="option-btn" data-category="breed" data-value="英短">英短</button>
              <button class="option-btn" data-category="breed" data-value="金毛">金毛</button>
              <button class="option-btn" data-category="breed" data-value="柯基">柯基</button>
              <button class="option-btn" data-category="breed" data-value="橘猫">橘猫</button>
            </div>
          </div>

          <div class="option-group">
            <div class="option-title">年龄</div>
            <div class="options-list">
              <button class="option-btn" data-category="age" data-value="幼年">幼年</button>
              <button class="option-btn" data-category="age" data-value="成年">成年</button>
              <button class="option-btn" data-category="age" data-value="老年">老年</button>
            </div>
          </div>

          <div class="option-group">
            <div class="option-title">日常行为</div>
            <div class="options-list">
              <button class="option-btn" data-category="behavior" data-value="爱啃纸盒">爱啃纸盒</button>
              <button class="option-btn" data-category="behavior" data-value="追激光">追激光</button>
              <button class="option-btn" data-category="behavior" data-value="撕咬袜子">撕咬袜子</button>
              <button class="option-btn" data-category="behavior" data-value="躲沙发底">躲沙发底</button>
            </div>
          </div>
        </div>
      </section>

      <section class="result-card" id="resultCard">
        <h2 class="result-title">试玩小贴士</h2>
        <p class="result-text" id="resultText">
          适配度82%｜英短幼猫偏好软质晃动，建议先剪掉金属铃铛再给。
        </p>
        <span class="hint-badge">提示：此建议基于常见行为模式，实际请观察3分钟反应</span>
      </section>
    </main>

    <footer>
      <p>宠物试玩盒 · 3秒判断玩具适配性 | 不需安装，双击即用</p>
    </footer>
  </div>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;
    const isDark = localStorage.getItem('darkTheme') === 'true';
    if (isDark) {
      body.classList.add('dark-theme');
      themeToggle.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h1.5zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H6a.75.75 0 01-.75-.75V12.75A.75.75 0 016 12h1.5zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM12 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5z"/></svg>';
    } else {
      themeToggle.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h1.5zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H6a.75.75 0 01-.75-.75V12.75A.75.75 0 016 12h1.5zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM12 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5z"/></svg>';
    }

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-theme');
      const isNowDark = body.classList.contains('dark-theme');
      localStorage.setItem('darkTheme', isNowDark);
      themeToggle.innerHTML = isNowDark 
        ? '<svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h1.5zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H6a.75.75 0 01-.75-.75V12.75A.75.75 0 016 12h1.5zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM12 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5z"/></svg>'
        : '<svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h1.5zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H6a.75.75 0 01-.75-.75V12.75A.75.75 0 016 12h1.5zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM12 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5z"/></svg>';
    });

    // 上传照片
    const uploadArea = document.getElementById('uploadArea');
    const photoInput = document.getElementById('photoInput');
    const photoPreview = document.getElementById('photoPreview');
    const previewImage = document.getElementById('previewImage');
    const previewLabel = document.getElementById('previewLabel');

    uploadArea.addEventListener('click', () => photoInput.click());
    photoInput.addEventListener('change', function() {
      if (this.files && this.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          previewImage.src = e.target.result;
          photoPreview.style.display = 'block';
          previewLabel.textContent = '已识别：橘猫 · 建议关注抓挠偏好';
        };
        reader.readAsDataURL(this.files[0]);
      }
    });

    // 选项选择
    const optionBtns = document.querySelectorAll('.option-btn');
    const resultCard = document.getElementById('resultCard');
    const resultText = document.getElementById('resultText');

    const selections = {
      breed: '',
      age: '',
      behavior: ''
    };

    optionBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        const category = this.dataset.category;
        const value = this.dataset.value;

        // 取消同组其他选项
        document.querySelectorAll(`[data-category="${category}"]`).forEach(el => {
          el.classList.remove('active');
        });
        this.classList.add('active');

        selections[category] = value;

        // 生成提示语（简单映射）
        const breed = selections.breed || '英短';
        const age = selections.age || '成年';
        const behavior = selections.behavior || '爱啃纸盒';

        let tip = '';
        if (breed === '英短' && age === '幼年' && behavior === '爱啃纸盒') {
          tip = `适配度82%｜英短幼猫偏好软质晃动，建议先剪掉金属铃铛再给。`;
        } else if (breed === '金毛' && age === '成年' && behavior === '追激光') {
          tip = `适配度91%｜金毛成犬对移动光点敏感，建议搭配定时休眠避免过度兴奋。`;
        } else if (breed === '柯基' && age === '成年' && behavior === '撕咬袜子') {
          tip = `适配度76%｜柯基成犬需高强度咀嚼释放精力，推荐加厚橡胶材质防吞咽。`;
        } else if (breed === '橘猫' && age === '成年' && behavior === '躲沙发底') {
          tip = `适配度68%｜橘猫成年个体警惕心强，建议先将玩具放在沙发旁静置2小时再引入。`;
        } else {
          tip = `适配度75%｜${breed}${age}偏好${behavior}类刺激，建议首日限时5分钟观察反应。`;
        }

        resultText.textContent = tip;
        resultCard.style.display = 'block';
      });
    });

    // 初始化：默认选中一组
    document.querySelector('[data-category="breed"][data-value="英短"]').click();
    document.querySelector('[data-category="age"][data-value="成年"]').click();
    document.querySelector('[data-category="behavior"][data-value="爱啃纸盒"]').click();
  </script>
</body>
</html>
