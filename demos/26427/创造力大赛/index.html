<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>说不出来 - 情绪陪伴空间</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #1a1a2e;
            --bg-light: #16213e;
            --bg-card: rgba(22, 33, 62, 0.85);
            --accent-gold: #e8c98b;
            --accent-gold-light: rgba(232, 201, 139, 0.3);
            --accent-purple: #6c5ce7;
            --accent-pink: #e88c9a;
            --text-primary: #f0e6d3;
            --text-secondary: #c9bfa8;
            --text-muted: #8a8070;
            --border-color: rgba(232, 201, 139, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-light) 50%, #0f0f23 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text-primary);
            position: relative;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .page {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            display: none;
            min-height: 80vh;
            pointer-events: none;
            position: relative;
        }

        .page.active {
            opacity: 1;
            transform: translateY(0);
            display: block;
            pointer-events: auto;
        }

        .page-header {
            display: flex;
            justify-content: flex-end;
            padding: 10px 0;
            position: relative;
        }

        .page-header .emotion-calendar {
            position: static;
            width: 44px;
            height: 44px;
        }

        .title-section {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        .title {
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 0.6em;
            margin-bottom: 16px;
            text-shadow: 0 0 40px rgba(232, 201, 139, 0.2);
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            line-height: 1.8;
            max-width: 400px;
            margin: 0 auto;
        }

        .emotion-sphere-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 280px;
            margin-bottom: 40px;
            position: relative;
        }

        .emotion-sphere {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(108, 92, 231, 0.3) 0%, rgba(22, 33, 62, 0.6) 60%, rgba(15, 15, 35, 0.8) 100%);
            border: 1px solid rgba(232, 201, 139, 0.15);
            position: relative;
            animation: float 6s ease-in-out infinite;
            box-shadow: 
                0 0 60px rgba(108, 92, 231, 0.2),
                inset 0 0 80px rgba(108, 92, 231, 0.1);
            backdrop-filter: blur(20px);
        }

        .emotion-sphere::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 20%;
            width: 40%;
            height: 30%;
            background: radial-gradient(ellipse, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: shimmer 4s ease-in-out infinite;
        }

        .emotion-sphere::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(232, 201, 139, 0.1) 60deg, transparent 120deg, rgba(108, 92, 231, 0.1) 180deg, transparent 240deg, rgba(232, 140, 154, 0.1) 300deg, transparent 360deg);
            animation: rotateSlow 20s linear infinite;
        }

        .emotion-sphere.loading {
            animation: float 2s ease-in-out infinite, pulseGlow 1.5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0.3; transform: translateX(-10%); }
            50% { opacity: 0.6; transform: translateX(10%); }
        }

        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 60px rgba(108, 92, 231, 0.2), inset 0 0 80px rgba(108, 92, 231, 0.1); }
            50% { box-shadow: 0 0 100px rgba(232, 201, 139, 0.3), inset 0 0 120px rgba(232, 201, 139, 0.15); }
        }

        #explosionCanvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }

        .input-section {
            max-width: 480px;
            margin: 0 auto;
            text-align: center;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 16px;
            justify-content: center;
            margin-bottom: 32px;
        }

        .emotion-input-wrapper {
            flex: 1;
            position: relative;
        }

        .emotion-input {
            width: 100%;
            padding: 16px 20px;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(232, 201, 139, 0.25);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.4s ease;
            font-weight: 300;
        }

        .emotion-input::placeholder {
            color: var(--text-muted);
            font-style: italic;
        }

        .emotion-input:focus {
            border-color: var(--accent-gold);
        }

        .voice-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(22, 33, 62, 0.7);
            border: 1px solid rgba(232, 201, 139, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.4s ease;
            flex-shrink: 0;
        }

        .voice-btn:hover {
            background: rgba(232, 201, 139, 0.1);
            border-color: var(--accent-gold);
        }

        .voice-btn.recording {
            animation: pulse 1.5s ease-in-out infinite;
            border-color: var(--accent-gold);
        }

        .voice-btn svg {
            width: 24px;
            height: 24px;
            stroke: var(--text-secondary);
            fill: none;
            stroke-width: 2;
            transition: stroke 0.3s ease;
        }

        .voice-btn:hover svg,
        .voice-btn.recording svg {
            stroke: var(--accent-gold);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(232, 201, 139, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(232, 201, 139, 0); }
        }

        .translate-btn {
            padding: 14px 48px;
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-primary);
            background: rgba(232, 201, 139, 0.15);
            border: 1px solid var(--accent-gold);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            letter-spacing: 0.1em;
        }

        .translate-btn:hover {
            background: rgba(232, 201, 139, 0.25);
            box-shadow: 0 0 30px rgba(232, 201, 139, 0.2);
            transform: translateY(-2px);
        }

        .cards-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            margin-top: 60px;
            perspective: 1000px;
        }

        .metaphor-card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            border-radius: 24px;
            padding: 32px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            transform: translateY(50px) scale(0.9);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(15px);
        }

        .metaphor-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .metaphor-card:hover {
            transform: translateY(-8px);
            border-color: rgba(232, 201, 139, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .metaphor-card.selected {
            transform: scale(1.05);
            border-color: var(--accent-gold);
            box-shadow: 0 0 40px rgba(232, 201, 139, 0.25), 0 20px 40px rgba(0, 0, 0, 0.3);
            z-index: 5;
        }

        .metaphor-card.selected::before {
            opacity: 1;
        }

        .metaphor-card.faded {
            opacity: 0.2;
            transform: scale(0.9);
            pointer-events: none;
        }

        .card-svg {
            width: 100%;
            height: 100px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-svg svg {
            width: 80px;
            height: 80px;
            stroke-width: 1.5;
            stroke: var(--text-muted);
            fill: none;
            transition: all 0.4s ease;
        }

        .metaphor-card:hover .card-svg svg,
        .metaphor-card.selected .card-svg svg {
            stroke: var(--accent-gold);
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 400;
            color: var(--text-primary);
            margin-bottom: 12px;
            line-height: 1.5;
            letter-spacing: 0.05em;
        }

        .card-description {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.8;
            font-weight: 300;
            opacity: 0.9;
        }

        .feedback-text {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 300;
            color: var(--accent-gold);
            letter-spacing: 0.2em;
            margin-bottom: 30px;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .color-painting-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 30px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: rgba(22, 33, 62, 0.5);
        }

        #colorPaintingCanvas {
            width: 100%;
            height: 200px;
            display: block;
        }

        .plant-btn {
            display: block;
            margin: 0 auto;
            padding: 14px 48px;
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-primary);
            background: linear-gradient(135deg, rgba(232, 201, 139, 0.2) 0%, rgba(108, 92, 231, 0.2) 100%);
            border: 1px solid var(--accent-gold);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            letter-spacing: 0.1em;
        }

        .plant-btn:hover {
            background: linear-gradient(135deg, rgba(232, 201, 139, 0.3) 0%, rgba(108, 92, 231, 0.3) 100%);
            box-shadow: 0 0 30px rgba(232, 201, 139, 0.2);
        }

        .save-btn {
            display: block;
            margin: 30px auto 20px;
            padding: 12px 40px;
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-primary);
            background: rgba(232, 201, 139, 0.15);
            border: 1px solid var(--accent-gold);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            letter-spacing: 0.1em;
        }

        .save-btn:hover {
            background: rgba(232, 201, 139, 0.25);
            box-shadow: 0 0 25px rgba(232, 201, 139, 0.2);
        }

        .save-btn.saved {
            background: rgba(100, 200, 100, 0.2);
            border-color: rgba(100, 200, 100, 0.5);
            color: rgba(100, 200, 100, 0.8);
        }

        .garden-container {
            position: relative;
            height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            margin-top: 40px;
        }

        .soil {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(180deg, #2d1f1a 0%, #1a120f 100%);
            border-radius: 50% 50% 0 0 / 20px 20px 0 0;
        }

        .plant-wrapper {
            position: relative;
            z-index: 2;
            margin-bottom: 60px;
            transform-origin: bottom center;
        }

        .plant {
            opacity: 0;
            transform: scaleY(0);
            transform-origin: bottom center;
        }

        .plant.growing {
            animation: grow 2s ease-out forwards;
        }

        @keyframes grow {
            0% { opacity: 0; transform: scaleY(0); }
            60% { opacity: 1; transform: scaleY(1.1); }
            100% { opacity: 1; transform: scaleY(1); }
        }

        .plant.swaying {
            opacity: 1 !important;
            transform: scaleY(1);
            animation: sway 4s ease-in-out infinite;
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-2deg) scaleY(1); }
            50% { transform: rotate(2deg) scaleY(1); }
        }

        .plant svg {
            width: 120px;
            height: 180px;
            stroke: var(--accent-gold);
            stroke-width: 2;
            fill: none;
        }

        .name-input-container {
            text-align: center;
            margin-top: 30px;
            z-index: 3;
        }

        .name-input {
            width: 280px;
            padding: 12px 20px;
            background: rgba(22, 33, 62, 0.6);
            border: none;
            border-bottom: 1px solid rgba(232, 201, 139, 0.3);
            color: var(--text-primary);
            font-size: 0.95rem;
            text-align: center;
            outline: none;
            transition: border-color 0.3s ease;
            border-radius: 8px 8px 0 0;
        }

        .name-input:focus {
            border-color: var(--accent-gold);
        }

        .name-input::placeholder {
            color: var(--text-muted);
            font-style: italic;
        }

        .emotion-calendar {
            position: absolute;
            right: 20px;
            bottom: 100px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(22, 33, 62, 0.6);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .emotion-calendar:hover {
            background: rgba(232, 201, 139, 0.1);
            border-color: var(--accent-gold);
        }

        .emotion-calendar svg {
            width: 22px;
            height: 22px;
            stroke: var(--accent-gold);
            stroke-width: 2;
            fill: none;
        }

        .garden-list-header {
            text-align: center;
            margin: 30px 0 40px;
        }

        .garden-title {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            color: var(--accent-gold);
            margin-bottom: 12px;
        }

        .garden-subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-style: italic;
        }

        .garden-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            padding: 20px 0;
            max-width: 900px;
            margin: 0 auto;
        }

        .garden-item {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(15px);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .garden-item:hover {
            transform: translateY(-4px);
            border-color: rgba(232, 201, 139, 0.4);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .garden-item-plant {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
            height: 120px;
        }

        .garden-item-plant svg {
            width: 80px;
            height: 120px;
            stroke: var(--accent-gold);
            stroke-width: 2;
            fill: none;
        }

        .garden-item-name {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-primary);
            margin-bottom: 8px;
            text-align: center;
        }

        .garden-item-metaphor {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 12px;
            font-style: italic;
        }

        .garden-item-date {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
        }

        .empty-garden {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-garden svg {
            width: 80px;
            height: 80px;
            stroke: var(--text-muted);
            stroke-width: 2;
            fill: none;
            margin-bottom: 20px;
        }

        .empty-garden p {
            margin-bottom: 8px;
        }

        .empty-garden .hint {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .emotion-calendar:hover svg {
            stroke: var(--accent-gold);
        }

        .garden-footer {
            text-align: center;
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            line-height: 1.8;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(22, 33, 62, 0.5);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(232, 201, 139, 0.1);
            border-color: var(--accent-gold);
        }

        .close-btn svg {
            width: 16px;
            height: 16px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
        }

        .close-btn:hover svg {
            stroke: var(--accent-gold);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            font-size: 0.9rem;
            color: var(--text-muted);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: color 0.3s ease;
            margin-top: 20px;
        }

        .back-btn:hover {
            color: var(--text-secondary);
        }

        .back-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
        }

        .page-transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .page-transition-overlay.active {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 16px;
            }

            .title {
                font-size: 2rem;
                letter-spacing: 0.4em;
            }

            .subtitle {
                font-size: 0.85rem;
                padding: 0 20px;
            }

            .emotion-sphere {
                width: 150px;
                height: 150px;
            }

            .emotion-sphere-container {
                height: 220px;
            }

            .input-row {
                flex-direction: column;
                gap: 20px;
            }

            .emotion-input-wrapper {
                width: 100%;
            }

            .metaphor-card {
                padding: 24px;
                max-width: 100%;
            }

            .card-title {
                font-size: 1.25rem;
            }

            .plant svg {
                width: 100px;
                height: 150px;
            }

            .garden-container {
                height: 450px;
            }

            .emotion-calendar {
                right: 16px;
                bottom: 90px;
            }

            .name-input {
                width: 240px;
            }
        }

        @media (max-width: 480px) {
            .title {
                font-size: 1.6rem;
                letter-spacing: 0.3em;
            }

            .emotion-sphere {
                width: 120px;
                height: 120px;
            }

            .metaphor-card {
                padding: 20px;
            }

            .card-svg svg {
                width: 60px;
                height: 60px;
            }

            .card-title {
                font-size: 1.15rem;
            }

            .card-description {
                font-size: 0.9rem;
            }

            .plant svg {
                width: 80px;
                height: 120px;
            }
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    
    <div class="page-transition-overlay" id="transitionOverlay"></div>

    <div class="container">
        <div class="page active" id="page1">
            <div class="page-header">
                <div class="emotion-calendar" id="calendarBtn1">
                    <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM9 10H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z"/></svg>
                </div>
            </div>

            <div class="title-section">
                <h1 class="title">说不出来</h1>
                <p class="subtitle">我们不问你怎么了，我们只是试着帮你找到那种感觉</p>
            </div>

            <div class="emotion-sphere-container">
                <div class="emotion-sphere" id="emotionSphere"></div>
                <canvas id="explosionCanvas" width="300" height="300"></canvas>
            </div>

            <div class="input-section">
                <div class="input-row">
                    <div class="emotion-input-wrapper">
                        <input 
                            type="text" 
                            id="emotionInput"
                            class="emotion-input"
                            placeholder="试着随便打点什么吧，说不清楚也没关系..."
                            autocomplete="off"
                            spellcheck="false"
                        >
                    </div>
                    <button class="voice-btn" id="voiceBtn">

        // 智能分析用户输入，返回匹配的情绪类型
        function analyzeEmotion(input) {
            const lowerInput = input.toLowerCase();
            const scores = {};
            
            for (const [emotion, keywords] of Object.entries(emotionKeywords)) {
                scores[emotion] = 0;
                for (const keyword of keywords) {
                    if (lowerInput.includes(keyword)) {
                        scores[emotion] += 1;
                    }
                }
            }
            
            // 找到得分最高的情绪
            let maxScore = 0;
            let matchedEmotions = [];
            for (const [emotion, score] of Object.entries(scores)) {
                if (score > maxScore) {
                    maxScore = score;
                    matchedEmotions = [emotion];
                } else if (score === maxScore && score > 0) {
                    matchedEmotions.push(emotion);
                }
            }
            
            // 如果没有匹配到任何关键词，返回null（将随机选择）
            return maxScore > 0 ? matchedEmotions : null;
        }

        // 根据情绪类型获取隐喻
        function getMetaphorsByEmotion(emotion) {
            return metaphors.filter(m => m.emotion === emotion);
        }

        function renderGarden() {
            const gardenList = document.getElementById('gardenList');
            const savedGarden = JSON.parse(localStorage.getItem('emotionGarden') || '[]');
            
            if (savedGarden.length === 0) {
                gardenList.innerHTML = `
                    <div class="empty-garden">
                        <svg viewBox="0 0 100 100"><path d="M50 20 L50 80" stroke-linecap="round"/><path d="M50 40 Q35 35 30 50" stroke-linecap="round"/><path d="M50 35 Q65 30 70 45" stroke-linecap="round"/><circle cx="50" cy="25" r="5" stroke-linecap="round"/></svg>
                        <p>花园里还没有植物</p>
                        <p class="hint">从第一层开始，把心里话说出来吧</p>
                    </div>
                `;
                return;
            }
            
            const sorted = [...savedGarden].sort((a, b) => new Date(b.date) - new Date(a.date));
            gardenList.innerHTML = sorted.map(item => {
                const plantSvg = plantSvgs[item.emotion] || plantSvgs.confused;
                const date = new Date(item.date);
                const dateStr = `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
                return `
                    <div class="garden-item">
                        <div class="garden-item-plant">${plantSvg}</div>
                        <div class="garden-item-name">${item.name}</div>
                        <div class="garden-item-metaphor">${item.metaphor}</div>
                        <div class="garden-item-date">${dateStr}</div>
                    </div>
                `;
            }).join('');
        }

        function initBackgroundParticles() {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    speedX: (Math.random() - 0.5) * 0.3,
                    speedY: (Math.random() - 0.5) * 0.3,
                    opacity: Math.random() * 0.3 + 0.1
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                particles.forEach(p => {
                    p.x += p.speedX;
                    p.y += p.speedY;
                    
                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;
                    
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(232, 201, 139, ${p.opacity})`;
                    ctx.fill();
                });
                
                requestAnimationFrame(animate);
            }
            animate();
        }

        function createExplosion() {
            const canvas = document.getElementById('explosionCanvas');
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            const explosionParticles = [];
            for (let i = 0; i < 50; i++) {
                const angle = (Math.PI * 2 * i) / 50 + Math.random() * 0.3;
                explosionParticles.push({
                    x: centerX,
                    y: centerY,
                    vx: Math.cos(angle) * (Math.random() * 6 + 3),
                    vy: Math.sin(angle) * (Math.random() * 6 + 3),
                    size: Math.random() * 4 + 2,
                    opacity: 1,
                    color: ['#e8c98b', '#6c5ce7', '#e88c9a', '#a77bc8'][Math.floor(Math.random() * 4)]
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                
                explosionParticles.forEach(p => {
                    if (p.opacity > 0) {
                        active = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.1;
                        p.opacity -= 0.02;
                        p.size *= 0.98;
                        
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = p.opacity;
                        ctx.fill();
                        ctx.globalAlpha = 1;
                    }
                });
                
                if (active) {
                    requestAnimationFrame(animate);
                }
            }
            animate();
        }

        function drawColorPainting(metaphor) {
            const canvas = document.getElementById('colorPaintingCanvas');
            const ctx = canvas.getContext('2d');
            const colors = metaphor.colors;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let step = 0;
            const maxSteps = 50;
            
            function draw() {
                const progress = step / maxSteps;
                
                for (let i = 0; i < 5; i++) {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * canvas.height;
                    const radius = (Math.random() * 80 + 40) * progress;
                    const color = colors[i % colors.length];
                    
                    const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
                    gradient.addColorStop(0, color + '60');
                    gradient.addColorStop(1, 'transparent');
                    
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();
                }
                
                step++;
                if (step <= maxSteps) {
                    requestAnimationFrame(draw);
                }
            }
            draw();
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function createCard(metaphor, index) {
            const card = document.createElement('div');
            card.className = 'metaphor-card';
            card.dataset.id = metaphor.id;
            card.style.transitionDelay = `${index * 0.15}s`;
            
            card.innerHTML = `
                <div class="card-svg">${metaphor.svg}</div>
                <h3 class="card-title">${metaphor.title}</h3>
                <p class="card-description">${metaphor.description}</p>
            `;

            card.addEventListener('click', () => handleCardClick(card, metaphor));
            
            return card;
        }

        function handleCardClick(card, metaphor) {
            if (selectedMetaphor) return;
            
            selectedMetaphor = metaphor;
            card.classList.add('selected');
            
            const otherCards = Array.from(cardsContainer.children).filter(c => c !== card);
            otherCards.forEach(c => c.classList.add('faded'));
            
            setTimeout(() => {
                document.getElementById('selectedContent').style.display = 'block';
                drawColorPainting(metaphor);
            }, 600);
        }

        function goToPage(pageIndex) {
            const transitionOverlay = document.getElementById('transitionOverlay');
            transitionOverlay.classList.add('active');
            
            setTimeout(() => {
                document.getElementById(pages[currentPage]).classList.remove('active');
                currentPage = pageIndex;
                document.getElementById(pages[currentPage]).classList.add('active');
                transitionOverlay.classList.remove('active');
            }, 300);
        }

        function handleTranslate() {
            console.log('handleTranslate called');
            const inputValue = document.getElementById('emotionInput').value.trim();
            if (!inputValue) {
                document.getElementById('emotionInput').focus();
                return;
            }

            const sphere = document.getElementById('emotionSphere');
            sphere.classList.add('loading');
            
            setTimeout(() => {
                createExplosion();
                
                setTimeout(() => {
                    sphere.classList.remove('loading');
                    goToPage(1);
                    
                    cardsContainer.innerHTML = '';
                    document.getElementById('selectedContent').style.display = 'none';
                    selectedMetaphor = null;
                    
                    // 智能分析用户输入的情绪
                    const matchedEmotions = analyzeEmotion(inputValue);
                    let selectedMetaphors = [];
                    
                    if (matchedEmotions && matchedEmotions.length > 0) {
                        // 如果匹配到情绪，从匹配的情绪中抽取隐喻
                        const primaryEmotion = matchedEmotions[0];
                        const emotionMetaphors = getMetaphorsByEmotion(primaryEmotion);
                        
                        if (emotionMetaphors.length >= 3) {
                            // 该情绪有3个或以上隐喻，全部使用该情绪的
                            selectedMetaphors = shuffleArray(emotionMetaphors).slice(0, 3);
                        } else if (emotionMetaphors.length > 0) {
                            // 该情绪隐喻不足3个，用该情绪的全部 + 其他情绪的补充
                            selectedMetaphors = [...emotionMetaphors];
                            const otherMetaphors = metaphors.filter(m => m.emotion !== primaryEmotion);
                            const extras = shuffleArray(otherMetaphors).slice(0, 3 - emotionMetaphors.length);
                            selectedMetaphors = [...selectedMetaphors, ...extras];
                        }
                    }
                    
                    // 如果没有匹配到情绪或匹配后仍不足3个，随机抽取
                    if (selectedMetaphors.length < 3) {
                        const shuffledMetaphors = shuffleArray(metaphors);
                        selectedMetaphors = shuffledMetaphors.slice(0, 3);
                    }

                    selectedMetaphors.forEach((metaphor, index) => {
                        const card = createCard(metaphor, index);
                        cardsContainer.appendChild(card);
                        
                        setTimeout(() => {
                            card.style.opacity = '1';
                            card.style.transform = 'translateY(0) scale(1)';
                        }, 300 + index * 200);
                    });
                }, 800);
            }, 1000);
        }

        function handleVoiceClick() {
            const voiceBtn = document.getElementById('voiceBtn');
            const input = document.getElementById('emotionInput');
            
            if (voiceBtn.classList.contains('recording')) return;
            
            voiceBtn.classList.add('recording');
            
            setTimeout(() => {
                voiceBtn.classList.remove('recording');
                input.value = '我觉得心里很乱，好像有很多话想说，但又不知道从哪里开始...';
            }, 2000);
        }

        function handlePlantClick() {
            goToPage(2);
            
            setTimeout(() => {
                const plantContainer = document.getElementById('plant');
                const plantSvg = plantSvgs[selectedMetaphor.emotion] || plantSvgs.confused;
                plantContainer.innerHTML = plantSvg;
                plantContainer.classList.remove('swaying');
                plantContainer.classList.add('growing');
                
                setTimeout(() => {
                    plantContainer.classList.remove('growing');
                    plantContainer.classList.add('swaying');
                }, 2000);
            }, 500);
        }

        function handleSaveClick() {
            const saveBtn = document.getElementById('saveBtn');
            const nameInput = document.getElementById('plantNameInput');
            const plantName = nameInput.value.trim() || '未命名的心情';
            
            saveBtn.disabled = true;
            saveBtn.textContent = '保存中...';
            
            setTimeout(() => {
                const savedGarden = JSON.parse(localStorage.getItem('emotionGarden') || '[]');
                savedGarden.push({
                    id: Date.now(),
                    name: plantName,
                    emotion: selectedMetaphor.emotion,
                    metaphor: selectedMetaphor.title,
                    date: new Date().toISOString()
                });
                localStorage.setItem('emotionGarden', JSON.stringify(savedGarden));
                
                saveBtn.textContent = '已保存';
                saveBtn.classList.add('saved');
                
                setTimeout(() => {
                    saveBtn.disabled = false;
                    saveBtn.textContent = '保存到情绪花园';
                    saveBtn.classList.remove('saved');
                    nameInput.value = '';
                }, 2000);
            }, 500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            cardsContainer = document.getElementById('cardsContainer');
            document.getElementById('translateBtn').addEventListener('click', handleTranslate);
            
            document.getElementById('emotionInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleTranslate();
                }
            });

            document.getElementById('voiceBtn').addEventListener('click', handleVoiceClick);
            
            document.getElementById('backBtn1').addEventListener('click', () => {
                goToPage(0);
                document.getElementById('emotionInput').value = '';
            });
            
            document.getElementById('backBtn2').addEventListener('click', () => {
                goToPage(1);
            });
            
            document.getElementById('plantBtn').addEventListener('click', handlePlantClick);
            document.getElementById('saveBtn').addEventListener('click', handleSaveClick);

            document.getElementById('backBtn3').addEventListener('click', () => {
                goToPage(0);
                document.getElementById('emotionInput').value = '';
            });

            const calendarIcons = document.getElementsByClassName('emotion-calendar');
            for (let i = 0; i < calendarIcons.length; i++) {
                calendarIcons[i].addEventListener('click', () => {
                    renderGarden();
                    goToPage(3);
                });
            }

            initBackgroundParticles();
            
            setTimeout(() => {
                document.getElementById('page1').style.opacity = '1';
                document.getElementById('page1').style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
