<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界锻造师 - 小说文本分析</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="header-content">
      <h1 class="title">世界锻造师</h1>
      <p class="subtitle">小说世界观分析与续写工具</p>
    </div>
    <div class="header-actions">
      <button id="analyzeBtn" class="btn btn-primary">分析文本</button>
      <button id="rewriteBtn" class="btn btn-primary" disabled>续写剧情</button>
      <button id="resetBtn" class="btn btn-secondary">重置</button>
    </div>
  </header>

  <div class="main-container">
    <div class="panel panel-left">
      <div class="panel-header">
        <h2>原始文本</h2>
        <div class="status-indicator">
          <span id="textStatus" class="status status-idle">未修改</span>
        </div>
      </div>
      <div class="panel-content">
        <textarea 
          id="textEditor" 
          class="text-editor"
          placeholder="在此输入或粘贴小说文本...">
夜幕低垂，星辰初现。在艾尔德大陆的东部，坐落着一座古老的城邦——月影城。城墙由黑曜石砌成，在月光下散发着幽蓝的光芒。城门口，一位身披黑色斗篷的少女正静静地站立着，她的眼眸中闪烁着与年龄不符的深邃。

"莉雅，你确定要独自前往迷雾森林吗？"身后传来一个关切的声音。

莉雅转过身，露出一张清秀却带着坚毅的脸庞。"是的，导师。预言中说，只有找到失落的星晶，才能阻止暗影的蔓延。"她的声音平静却坚定，如同山涧的溪流，清澈而有力。

站在她身后的是一位白发苍苍的老者，他是月影城的首席法师，名叫艾瑞克。老人轻轻叹了口气，眼中充满了担忧："那片森林已经沉寂了数百年，传说里面栖息着古老的魔兽。"

"我已经准备好了。"莉雅从腰间抽出一柄闪烁着银色光芒的长剑，剑身上刻满了古老的符文，"这是先祖留下的星辰剑，它会指引我找到正确的道路。"

就在这时，天边突然划过一道诡异的紫色光芒，整个夜空仿佛被撕裂开来。艾瑞克脸色大变："不好！暗影之门正在开启！莉雅，你必须立刻出发！"

莉雅不再犹豫，她握紧长剑，转身跃上马背。夜风拂起她的斗篷，如同一只即将展翅的雄鹰。"导师，等我回来！"她的声音在夜空中回荡，随后便消失在了通往迷雾森林的道路上。

月影城的灯火渐渐远去，莉雅独自骑行在幽暗的林间小路上。月光透过稀疏的树叶洒落下来，在地面上形成斑驳的光影。她能感觉到空气中弥漫着一股神秘的气息，那是魔法与古老力量交织的气息。

突然，前方传来一阵低沉的咆哮声。莉雅勒住缰绳，警惕地望向黑暗深处。一双闪烁着幽绿光芒的眼睛正缓缓逼近，那是一只体型庞大的暗影狼。

"来得正好。"莉雅握紧长剑，体内的魔力开始涌动。她知道，真正的冒险，才刚刚开始。

在月影城的高塔上，艾瑞克望着莉雅消失的方向，缓缓展开了一张古老的地图。地图上标注着艾尔德大陆的各个角落，而迷雾森林的位置，正散发着微弱的红色光芒。"命运的齿轮已经开始转动了..."老人轻声低语，眼中闪烁着复杂的光芒。
        </textarea>
      </div>
      <div class="rewrite-input-section">
        <h3 class="rewrite-title">续写要求</h3>
        <textarea 
          id="rewriteInput" 
          class="rewrite-input"
          placeholder="输入你想要的续写方向或修改要求，例如：让莉雅成功击败暗影狼，然后发现神秘的遗迹..."></textarea>
      </div>
    </div>

    <div class="panel panel-right">
      <div class="panel-header">
        <h2>世界状态</h2>
        <div class="loading-indicator" id="loadingIndicator" style="display: none;">
          <div class="spinner"></div>
          <span>分析中...</span>
        </div>
      </div>
      <div class="panel-content world-panel">
        <div class="confidence-section" id="confidenceSection" style="display: none;">
          <div class="confidence-header">
            <span class="confidence-icon">🔮</span>
            <span class="confidence-label">世界模型置信度</span>
          </div>
          <div class="confidence-bar-container">
            <div class="confidence-bar" id="confidenceBar"></div>
            <div class="confidence-percentage" id="confidencePercentage">0%</div>
          </div>
          <div class="confidence-message" id="confidenceMessage"></div>
        </div>

        <div class="world-section" id="worldviewSection">
          <h3 class="section-title">
            <span class="section-icon">🌍</span>
            世界观设定
          </h3>
          <div class="worldview-content" id="worldviewContent">
            <div class="placeholder">点击"分析文本"按钮开始分析</div>
          </div>
        </div>

        <div class="world-section" id="charactersSection">
          <h3 class="section-title">
            <span class="section-icon">👥</span>
            主要人物
          </h3>
          <div class="characters-grid" id="charactersGrid">
            <div class="placeholder">等待分析结果...</div>
          </div>
        </div>

        <div class="world-section" id="styleSection">
          <h3 class="section-title">
            <span class="section-icon">✒️</span>
            文风标签
          </h3>
          <div class="style-tags" id="styleTags">
            <div class="placeholder">等待分析结果...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
