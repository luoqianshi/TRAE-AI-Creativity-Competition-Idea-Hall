<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爪爪缘 - AI流浪动物领养匹配</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --orange: #ff8a3d;
  --orange-deep: #e65100;
  --orange-light: #ffcc80;
  --cream: #fff8e1;
  --warm-bg: #fff3e0;
  --text: #5d4037;
  --text-light: #8d6e63;
  --card-bg: #ffffff;
  --shadow: rgba(230, 81, 0, 0.15);
  --pink: #ff8a9a;
}
body {
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: linear-gradient(135deg, #fff8e1 0%, #ffe0b2 50%, #ffccbc 100%);
  min-height: 100vh;
  color: var(--text);
  overflow-x: hidden;
  position: relative;
}
/* 背景光晕 */
body::before {
  content: '';
  position: fixed;
  width: 400px; height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,143,0,0.15), transparent 70%);
  top: -100px; right: -100px;
  pointer-events: none; z-index: 0;
  animation: orbFloat 10s ease-in-out infinite;
}
body::after {
  content: '';
  position: fixed;
  width: 350px; height: 350px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,138,154,0.12), transparent 70%);
  bottom: -80px; left: -80px;
  pointer-events: none; z-index: 0;
  animation: orbFloat 12s ease-in-out infinite reverse;
}
@keyframes orbFloat { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,20px); } }

.paw-bg {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
}
.falling-paw {
  position: absolute; opacity: 0.12;
  animation: fall linear infinite;
}
@keyframes fall {
  from { transform: translateY(-50px) rotate(0deg); }
  to { transform: translateY(110vh) rotate(360deg); }
}

.container {
  max-width: 1240px; margin: 0 auto; padding: 20px;
  position: relative; z-index: 1;
}

/* 头部 */
header {
  text-align: center; padding: 16px 0 24px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.header-logo {
  display: flex; align-items: center; gap: 12px;
}
.logo-icon {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--orange), var(--orange-deep));
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 18px rgba(230,81,0,0.3);
}
.logo-icon svg { width: 26px; height: 26px; color: #fff; }
header h1 {
  font-size: 30px; color: var(--orange-deep);
  letter-spacing: 6px; font-weight: 800;
}
header .sub { color: var(--text-light); font-size: 13px; letter-spacing: 2px; }
.header-badges {
  display: flex; gap: 10px; margin-top: 8px;
}
.h-badge {
  background: rgba(255,255,255,0.7);
  border: 1px solid rgba(230,81,0,0.15);
  border-radius: 20px;
  padding: 5px 14px;
  font-size: 12px; color: var(--text);
  display: flex; align-items: center; gap: 5px;
  backdrop-filter: blur(6px);
}
.h-badge svg { width: 14px; height: 14px; color: var(--orange); }
.h-badge strong { color: var(--orange-deep); }

/* 主区域 */
.main {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 28px;
  align-items: start;
}

/* 卡片区 */
.card-section {
  perspective: 1400px;
  display: flex; flex-direction: column; align-items: center;
}
.card-stage {
  width: 340px; height: 460px; position: relative;
}
.card {
  width: 100%; height: 100%; position: absolute;
  transform-style: preserve-3d;
  transition: transform 0.8s cubic-bezier(0.4,0,0.2,1);
  cursor: pointer;
}
.card.flipped { transform: rotateY(180deg); }
.card-face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  border-radius: 24px;
  background: var(--card-bg);
  box-shadow: 0 12px 40px var(--shadow);
  overflow: hidden;
  display: flex; flex-direction: column;
}
.card-front { border: 3px solid var(--orange-light); }
.card-front::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--orange-light), var(--orange), var(--pink));
}
.card-back {
  transform: rotateY(180deg);
  background: linear-gradient(135deg, var(--cream), var(--warm-bg));
  border: 3px solid var(--orange);
  padding: 28px;
  justify-content: center; align-items: center; text-align: center;
}
.card.glow {
  animation: cardGlow 1.5s ease-in-out infinite alternate;
}
@keyframes cardGlow {
  from { box-shadow: 0 12px 40px rgba(255,143,0,0.3); }
  to { box-shadow: 0 12px 60px rgba(255,143,0,0.8), 0 0 100px rgba(255,167,38,0.5); }
}

.animal-svg {
  width: 100%; height: 240px;
  background: linear-gradient(180deg, var(--cream), var(--warm-bg));
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.animal-svg::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 40px;
  background: linear-gradient(180deg, transparent, rgba(255,143,0,0.06));
}
.animal-svg svg { width: 160px; height: 160px; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.1)); z-index: 1; }

.gender-badge {
  position: absolute; top: 12px; right: 12px;
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.gender-badge.male { background: linear-gradient(135deg, #42a5f5, #1976d2); }
.gender-badge.female { background: linear-gradient(135deg, var(--pink), #e91e63); }

.card-info { padding: 16px 20px; flex: 1; }
.card-info .name-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.card-info .name { font-size: 24px; font-weight: 800; color: var(--orange-deep); }
.card-info .shelter { font-size: 11px; color: var(--text-light); }
.card-info .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.tag {
  background: linear-gradient(135deg, var(--warm-bg), var(--orange-light));
  color: var(--orange-deep);
  padding: 3px 12px; border-radius: 12px; font-size: 11px; font-weight: 600;
}
.card-info .meta { display: flex; gap: 12px; font-size: 12px; color: var(--text-light); margin-bottom: 6px; }
.card-info .meta span { display: flex; align-items: center; gap: 3px; }
.card-info .desc { font-size: 13px; color: var(--text); margin-top: 6px; line-height: 1.6; }
.flip-hint {
  text-align: center; font-size: 11px; color: var(--orange);
  padding: 6px; background: rgba(255,143,0,0.05);
  display: flex; align-items: center; justify-content: center; gap: 4px;
}

.card-back h3 { font-size: 20px; color: var(--orange-deep); margin-bottom: 14px; }
.health-list { text-align: left; width: 100%; }
.health-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; border-bottom: 1px solid rgba(230,81,0,0.1);
  font-size: 13px;
}
.health-item:last-child { border-bottom: none; }
.health-item .k { color: var(--text-light); }
.health-item .v { color: var(--orange-deep); font-weight: 600; display: flex; align-items: center; gap: 4px; }

/* 卡片导航 */
.card-nav {
  display: flex; gap: 18px; margin-top: 20px; align-items: center;
}
.nav-btn {
  width: 48px; height: 48px; border-radius: 50%; border: none;
  background: #fff; box-shadow: 0 4px 14px var(--shadow);
  cursor: pointer; font-size: 22px; color: var(--orange-deep);
  transition: all 0.25s; display: flex; align-items: center; justify-content: center;
}
.nav-btn:hover { background: var(--orange-light); transform: scale(1.12); box-shadow: 0 6px 20px rgba(230,81,0,0.25); }
.nav-btn:active { transform: scale(0.95); }
.dots { display: flex; gap: 7px; }
.dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--orange-light); transition: all 0.3s; cursor: pointer;
}
.dot:hover { background: var(--orange); }
.dot.active { background: var(--orange-deep); width: 28px; border-radius: 5px; }

/* 匹配面板 */
.match-panel {
  background: rgba(255,255,255,0.88);
  border-radius: 20px; padding: 24px;
  box-shadow: 0 8px 30px var(--shadow);
  border: 1px solid rgba(255,143,0,0.1);
  backdrop-filter: blur(10px);
  position: relative; overflow: hidden;
}
.match-panel::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--orange-light), var(--orange), var(--pink));
}
.panel-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 20px;
}
.panel-header svg { width: 22px; height: 22px; color: var(--orange); }
.panel-header h3 { color: var(--orange-deep); font-size: 17px; }

.slider-group { margin-bottom: 18px; }
.slider-group label {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 13px; margin-bottom: 8px; color: var(--text);
}
.slider-group label .label-left { display: flex; align-items: center; gap: 6px; }
.slider-group label .label-left svg { width: 16px; height: 16px; color: var(--orange); }
.slider-group label .val {
  background: linear-gradient(135deg, var(--orange-light), var(--orange));
  color: #fff; padding: 2px 10px; border-radius: 10px;
  font-size: 12px; font-weight: 700; min-width: 36px; text-align: center;
}
.slider-group input[type=range] {
  width: 100%; -webkit-appearance: none; appearance: none;
  height: 8px; border-radius: 4px;
  background: linear-gradient(90deg, var(--orange-light), var(--orange-light));
  outline: none;
}
.slider-group input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 22px; height: 22px; border-radius: 50%;
  background: linear-gradient(135deg, var(--orange), var(--orange-deep));
  cursor: pointer; box-shadow: 0 2px 8px rgba(230,81,0,0.4);
  border: 3px solid #fff;
}
.slider-group input[type=range]::-moz-range-thumb {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--orange-deep); cursor: pointer; border: 3px solid #fff;
}

/* 匹配度环形 */
.match-ring-wrap {
  display: flex; align-items: center; justify-content: center;
  margin: 16px 0; position: relative;
}
.match-ring {
  width: 130px; height: 130px; position: relative;
}
.match-ring svg { transform: rotate(-90deg); }
.match-ring-bg-circle { fill: none; stroke: var(--warm-bg); stroke-width: 10; }
.match-ring-fg-circle {
  fill: none; stroke: url(#ringGrad); stroke-width: 10; stroke-linecap: round;
  transition: stroke-dashoffset 0.6s ease;
}
.match-ring-text {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.match-ring-text .val { font-size: 32px; font-weight: 800; color: var(--orange-deep); line-height: 1; }
.match-ring-text .lbl { font-size: 11px; color: var(--text-light); margin-top: 4px; letter-spacing: 1px; }

.match-status {
  text-align: center; font-size: 13px; color: var(--text);
  padding: 8px; border-radius: 10px; margin-bottom: 14px;
  transition: all 0.3s;
}
.match-status.high { background: rgba(76,175,80,0.1); color: #2e7d32; font-weight: 600; }
.match-status.mid { background: rgba(255,193,7,0.1); color: #f57f17; }
.match-status.low { background: rgba(244,67,54,0.08); color: #c62828; }

.adopt-btn {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, var(--orange), var(--orange-deep));
  color: #fff; border: none; border-radius: 28px;
  font-size: 16px; font-weight: 700; cursor: pointer;
  letter-spacing: 3px; transition: all 0.3s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 6px 20px rgba(230,81,0,0.3);
}
.adopt-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 10px 28px rgba(230,81,0,0.4); }
.adopt-btn:active { transform: scale(0.98); }
.adopt-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.adopt-btn svg { width: 18px; height: 18px; }

/* 确认弹窗 */
.confirm-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  display: none; align-items: center; justify-content: center; z-index: 2000;
  backdrop-filter: blur(4px);
}
.confirm-modal.show { display: flex; }
.confirm-box {
  background: #fff; border-radius: 24px; padding: 36px;
  text-align: center; max-width: 360px;
  animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
@keyframes popIn { from{transform:scale(0.5);opacity:0;} to{transform:scale(1);opacity:1;} }
.confirm-box .heart-icon {
  width: 64px; height: 64px; margin: 0 auto 12px;
  background: linear-gradient(135deg, var(--pink), #e91e63);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px rgba(233,30,99,0.3);
  animation: heartBeat 1s ease-in-out infinite;
}
@keyframes heartBeat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
.confirm-box .heart-icon svg { width: 34px; height: 34px; color: #fff; }
.confirm-box h3 { color: var(--orange-deep); margin-bottom: 12px; font-size: 22px; }
.confirm-box p { color: var(--text); font-size: 14px; line-height: 1.8; margin-bottom: 20px; }
.confirm-box .btn-row { display: flex; gap: 10px; justify-content: center; }
.confirm-box button {
  padding: 10px 28px; border: none; border-radius: 22px;
  cursor: pointer; font-size: 14px; font-weight: 600;
  font-family: inherit;
}
.confirm-box .btn-ok { background: linear-gradient(135deg, var(--orange), var(--orange-deep)); color: #fff; }
.confirm-box .btn-cancel { background: var(--warm-bg); color: var(--text); }

.particle { position: fixed; pointer-events: none; z-index: 1500; }

/* 响应式 */
@media (max-width: 1000px) {
  .main { grid-template-columns: 1fr; }
  .card-stage { margin: 0 auto; }
  header h1 { font-size: 24px; letter-spacing: 4px; }
  .header-badges { flex-wrap: wrap; justify-content: center; }
}
@media (max-width: 400px) {
  .card-stage { width: 100%; max-width: 340px; }
}
</style>
</head>
<body>
<div class="paw-bg" id="pawBg"></div>
<div class="container">
  <header>
    <div class="header-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.5 9.5a2 2 0 100-4 2 2 0 000 4zm5-4a2 2 0 100-4 2 2 0 000 4zm5 0a2 2 0 100-4 2 2 0 000 4zm5 4a2 2 0 100-4 2 2 0 000 4zM12 11c-3 0-5 2.5-5 5.5 0 2 1.5 3.5 3.5 3.5h3c2 0 3.5-1.5 3.5-3.5 0-3-2-5.5-5-5.5z"/></svg>
      </div>
      <h1>爪爪缘</h1>
    </div>
    <div class="sub">AI流浪动物领养匹配 · 让缘分有据可依</div>
    <div class="header-badges">
      <div class="h-badge">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
        待领养 <strong>5</strong> 只
      </div>
      <div class="h-badge">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 11H7v6h2v-6zm4 0h-2v6h2v-6zm4 0h-2v6h2v-6zm2-9h-1V0h-2v2H8V0H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 16H5V9h14v10z"/></svg>
        本周成功 <strong>12</strong> 例
      </div>
      <div class="h-badge">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        以领养代替购买
      </div>
    </div>
  </header>

  <div class="main">
    <div class="card-section">
      <div class="card-stage">
        <div class="card" id="card">
          <div class="card-face card-front">
            <div class="animal-svg" id="animalSvg">
              <div class="gender-badge" id="genderBadge"></div>
            </div>
            <div class="card-info">
              <div class="name-row">
                <div class="name" id="cardName"></div>
                <div class="shelter" id="cardShelter"></div>
              </div>
              <div class="tags" id="cardTags"></div>
              <div class="meta" id="cardMeta"></div>
              <div class="desc" id="cardDesc"></div>
            </div>
            <div class="flip-hint">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
              点击卡片查看健康档案
            </div>
          </div>
          <div class="card-face card-back">
            <h3 id="backTitle">健康档案</h3>
            <div class="health-list" id="healthList"></div>
          </div>
        </div>
      </div>
      <div class="card-nav">
        <button class="nav-btn" id="prevBtn">‹</button>
        <div class="dots" id="dots"></div>
        <button class="nav-btn" id="nextBtn">›</button>
      </div>
    </div>

    <div class="match-panel">
      <div class="panel-header">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2zm12 4c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3 3 1.34 3 3zm-9 8c0-2 4-3.1 6-3.1s6 1.1 6 3.1v1H6v-1z"/></svg>
        <h3>领养人条件匹配</h3>
      </div>

      <div class="slider-group">
        <label>
          <span class="label-left">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            居住环境
          </span>
          <span class="val" id="valHome">70</span>
        </label>
        <input type="range" id="sliderHome" min="0" max="100" value="70">
      </div>
      <div class="slider-group">
        <label>
          <span class="label-left">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            空闲时间
          </span>
          <span class="val" id="valTime">60</span>
        </label>
        <input type="range" id="sliderTime" min="0" max="100" value="60">
      </div>
      <div class="slider-group">
        <label>
          <span class="label-left">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM13 16h-2v2h2v-2zm0-6h-2v4h2v-4z"/></svg>
            养宠经验
          </span>
          <span class="val" id="valExp">50</span>
        </label>
        <input type="range" id="sliderExp" min="0" max="100" value="50">
      </div>
      <div class="slider-group">
        <label>
          <span class="label-left">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.21c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
            月预算
          </span>
          <span class="val" id="valBudget">65</span>
        </label>
        <input type="range" id="sliderBudget" min="0" max="100" value="65">
      </div>

      <div class="match-ring-wrap">
        <div class="match-ring">
          <svg width="130" height="130">
            <defs>
              <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ff8a3d"/>
                <stop offset="100%" stop-color="#e65100"/>
              </linearGradient>
            </defs>
            <circle class="match-ring-bg-circle" cx="65" cy="65" r="55"/>
            <circle class="match-ring-fg-circle" id="ringFg" cx="65" cy="65" r="55"
              stroke-dasharray="345.6" stroke-dashoffset="138.2"/>
          </svg>
          <div class="match-ring-text">
            <div class="val" id="matchValue">60%</div>
            <div class="lbl">匹配度</div>
          </div>
        </div>
      </div>

      <div class="match-status mid" id="matchStatus">匹配度中等，可以考虑领养</div>

      <button class="adopt-btn" id="adoptBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        申请领养
      </button>
    </div>
  </div>
</div>

<div class="confirm-modal" id="confirmModal">
  <div class="confirm-box">
    <div class="heart-icon">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>
    <h3>领养申请已提交</h3>
    <p id="confirmText"></p>
    <div class="btn-row">
      <button class="btn-cancel" id="btnCancel">再看看</button>
      <button class="btn-ok" id="btnOk">确定</button>
    </div>
  </div>
</div>

<script>
const animals = [
  { name:'小橘', type:'cat', gender:'female', age:'8个月', weight:'3.2kg', shelter:'朝阳救助站',
    tags:['温顺','亲人','已绝育'],
    desc:'在小区流浪时被发现，性格亲人，喜欢被摸下巴，适合首次养猫的家庭。',
    health:{'疫苗':'已完成','驱虫':'已完成','绝育':'已做','体检':'健康','性格评估':'亲人温顺'},
    match:{home:60,time:50,exp:40,budget:50} },
  { name:'旺财', type:'dog', gender:'male', age:'1岁', weight:'15kg', shelter:'海淀动保中心',
    tags:['活泼','忠诚','需运动'],
    desc:'精力充沛的中型犬，需要每天运动，适合有院子或爱户外活动的家庭。',
    health:{'疫苗':'已完成','驱虫':'已完成','绝育':'已做','体检':'健康','性格评估':'活泼好动'},
    match:{home:90,time:80,exp:70,budget:70} },
  { name:'团子', type:'cat', gender:'female', age:'2岁', weight:'4.5kg', shelter:'朝阳救助站',
    tags:['安静','独立','已绝育'],
    desc:'性格安静独立，适合上班族，不需要太多陪伴，会自己打发时间。',
    health:{'疫苗':'已完成','驱虫':'已完成','绝育':'已做','体检':'轻微牙结石','性格评估':'安静独立'},
    match:{home:50,time:30,exp:30,budget:40} },
  { name:'豆豆', type:'rabbit', gender:'male', age:'6个月', weight:'1.8kg', shelter:'丰台小动物之家',
    tags:['可爱','胆小','易饲养'],
    desc:'荷兰垂耳兔，性格胆小但很可爱，饲养简单，适合空间有限的家庭。',
    health:{'疫苗':'已完成','驱虫':'已完成','绝育':'待定','体检':'健康','性格评估':'胆小温顺'},
    match:{home:40,time:40,exp:20,budget:30} },
  { name:'大黄', type:'dog', gender:'male', age:'3岁', weight:'28kg', shelter:'海淀动保中心',
    tags:['乖巧','懂事','已训练'],
    desc:'成年金毛犬，性格稳定，已完成基础训练，适合有经验的家庭。',
    health:{'疫苗':'已完成','驱虫':'已完成','绝育':'已做','体检':'髋关节需关注','性格评估':'稳定懂事'},
    match:{home:85,time:70,exp:60,budget:80} },
];

const svgs = {
  cat: `<svg viewBox="0 0 120 120"><defs><radialGradient id="catG" cx="0.4" cy="0.35"><stop offset="0%" stop-color="#ffd9a0"/><stop offset="100%" stop-color="#ffcc80"/></radialGradient></defs><ellipse cx="60" cy="95" rx="28" ry="8" fill="rgba(0,0,0,0.1)"/><path d="M30,42 L38,18 L48,38 Z" fill="url(#catG)" stroke="#e65100" stroke-width="1.5"/><path d="M72,38 L82,18 L90,42 Z" fill="url(#catG)" stroke="#e65100" stroke-width="1.5"/><path d="M34,36 L40,24 L44,34 Z" fill="#ff8a9a"/><path d="M76,34 L80,24 L86,36 Z" fill="#ff8a9a"/><circle cx="60" cy="60" r="30" fill="url(#catG)" stroke="#e65100" stroke-width="1.5"/><circle cx="48" cy="55" r="5" fill="#3e2723"/><circle cx="72" cy="55" r="5" fill="#3e2723"/><circle cx="49" cy="53" r="1.5" fill="#fff"/><circle cx="73" cy="53" r="1.5" fill="#fff"/><path d="M57,65 Q60,69 63,65" stroke="#3e2723" stroke-width="2" fill="#ff8a9a" stroke-linecap="round"/><path d="M50,72 Q60,78 70,72" stroke="#3e2723" stroke-width="1.5" fill="none" stroke-linecap="round"/><circle cx="53" cy="68" r="2" fill="rgba(255,138,154,0.4)"/><circle cx="67" cy="68" r="2" fill="rgba(255,138,154,0.4)"/><line x1="35" y1="62" x2="48" y2="60" stroke="#5d4037" stroke-width="0.8"/><line x1="35" y1="66" x2="48" y2="64" stroke="#5d4037" stroke-width="0.8"/><line x1="85" y1="62" x2="72" y2="60" stroke="#5d4037" stroke-width="0.8"/><line x1="85" y1="66" x2="72" y2="64" stroke="#5d4037" stroke-width="0.8"/></svg>`,
  dog: `<svg viewBox="0 0 120 120"><defs><radialGradient id="dogG" cx="0.4" cy="0.35"><stop offset="0%" stop-color="#bcaaa4"/><stop offset="100%" stop-color="#a1887f"/></radialGradient></defs><ellipse cx="60" cy="95" rx="28" ry="8" fill="rgba(0,0,0,0.1)"/><circle cx="60" cy="58" r="28" fill="url(#dogG)" stroke="#5d4037" stroke-width="1.5"/><ellipse cx="34" cy="52" rx="9" ry="16" fill="#8d6e63" stroke="#5d4037" stroke-width="1.5" transform="rotate(-15 34 52)"/><ellipse cx="86" cy="52" rx="9" ry="16" fill="#8d6e63" stroke="#5d4037" stroke-width="1.5" transform="rotate(15 86 52)"/><ellipse cx="37" cy="52" rx="4" ry="10" fill="#ff8a9a" transform="rotate(-15 37 52)"/><ellipse cx="83" cy="52" rx="4" ry="10" fill="#ff8a9a" transform="rotate(15 83 52)"/><circle cx="48" cy="55" r="5" fill="#3e2723"/><circle cx="72" cy="55" r="5" fill="#3e2723"/><circle cx="49" cy="53" r="1.5" fill="#fff"/><circle cx="73" cy="53" r="1.5" fill="#fff"/><ellipse cx="60" cy="68" rx="5" ry="4" fill="#3e2723"/><path d="M54,74 Q60,80 66,74" stroke="#3e2723" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M60,72 L60,78" stroke="#3e2723" stroke-width="1.5"/><circle cx="54" cy="68" r="2" fill="rgba(255,138,154,0.3)"/><circle cx="66" cy="68" r="2" fill="rgba(255,138,154,0.3)"/></svg>`,
  rabbit: `<svg viewBox="0 0 120 120"><defs><radialGradient id="rabG" cx="0.4" cy="0.35"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#f5f5f5"/></radialGradient></defs><ellipse cx="60" cy="95" rx="26" ry="8" fill="rgba(0,0,0,0.1)"/><ellipse cx="46" cy="32" rx="7" ry="22" fill="url(#rabG)" stroke="#bdbdbd" stroke-width="1.5"/><ellipse cx="74" cy="32" rx="7" ry="22" fill="url(#rabG)" stroke="#bdbdbd" stroke-width="1.5"/><ellipse cx="46" cy="34" rx="3.5" ry="15" fill="#ffcdd2"/><ellipse cx="74" cy="34" rx="3.5" ry="15" fill="#ffcdd2"/><ellipse cx="60" cy="64" rx="26" ry="24" fill="url(#rabG)" stroke="#bdbdbd" stroke-width="1.5"/><circle cx="50" cy="60" r="4" fill="#333"/><circle cx="70" cy="60" r="4" fill="#333"/><circle cx="51" cy="58" r="1.2" fill="#fff"/><circle cx="71" cy="58" r="1.2" fill="#fff"/><ellipse cx="60" cy="70" rx="3.5" ry="2.5" fill="#e91e63"/><path d="M60,72 L60,76" stroke="#333" stroke-width="1"/><path d="M56,78 Q60,82 64,78" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/><rect x="57" y="76" width="3" height="2.5" fill="#fff" stroke="#ccc" stroke-width="0.5"/><rect x="60" y="76" width="3" height="2.5" fill="#fff" stroke="#ccc" stroke-width="0.5"/><circle cx="54" cy="72" r="2" fill="rgba(255,138,154,0.3)"/><circle cx="66" cy="72" r="2" fill="rgba(255,138,154,0.3)"/></svg>`,
};

const genderIcons = {
  male: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 9c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/><path d="M9 5v2h2.5l2.5 2.5V12h2V8.5l2.5-2.5H21V4h-6v2.5L12.5 5H9z" transform="translate(0,-1)"/></svg>',
  female: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M11 12v8h2v-4h2v4h2v-8z" transform="translate(0,0)"/></svg>'
};

let curIdx = 0;
const card = document.getElementById('card');

function renderCard() {
  const a = animals[curIdx];
  document.getElementById('animalSvg').innerHTML = svgs[a.type] +
    '<div class="gender-badge ' + (a.gender === 'male' ? 'male' : 'female') + '">' +
    (a.gender === 'male' ? '♂' : '♀') + '</div>';
  document.getElementById('cardName').textContent = a.name;
  document.getElementById('cardShelter').textContent = a.shelter;
  document.getElementById('cardMeta').innerHTML =
    '<span>年龄：' + a.age + '</span><span>体重：' + a.weight + '</span>';
  document.getElementById('cardDesc').textContent = a.desc;
  document.getElementById('cardTags').innerHTML = a.tags.map(function(t){
    return '<span class="tag">' + t + '</span>';
  }).join('');
  document.getElementById('backTitle').textContent = a.name + '的健康档案';
  document.getElementById('healthList').innerHTML = Object.entries(a.health).map(function(kv){
    return '<div class="health-item"><span class="k">' + kv[0] + '</span><span class="v">' +
      (kv[1].indexOf('已') === 0 || kv[1] === '健康' ? '✓ ' : '') + kv[1] + '</span></div>';
  }).join('');
  card.classList.remove('flipped');
  document.querySelectorAll('.dot').forEach(function(d, i){
    d.classList.toggle('active', i === curIdx);
  });
  updateMatch();
}

card.addEventListener('click', function(e) {
  if (e.target.closest('.adopt-btn')) return;
  card.classList.toggle('flipped');
});

const dots = document.getElementById('dots');
animals.forEach(function(a, i) {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.addEventListener('click', function() { curIdx = i; renderCard(); });
  dots.appendChild(d);
});

document.getElementById('prevBtn').addEventListener('click', function() {
  curIdx = (curIdx - 1 + animals.length) % animals.length;
  renderCard();
});
document.getElementById('nextBtn').addEventListener('click', function() {
  curIdx = (curIdx + 1) % animals.length;
  renderCard();
});

const sliders = {
  home: document.getElementById('sliderHome'),
  time: document.getElementById('sliderTime'),
  exp: document.getElementById('sliderExp'),
  budget: document.getElementById('sliderBudget')
};

function updateMatch() {
  const a = animals[curIdx];
  const vals = {
    home: parseInt(sliders.home.value),
    time: parseInt(sliders.time.value),
    exp: parseInt(sliders.exp.value),
    budget: parseInt(sliders.budget.value)
  };
  document.getElementById('valHome').textContent = vals.home;
  document.getElementById('valTime').textContent = vals.time;
  document.getElementById('valExp').textContent = vals.exp;
  document.getElementById('valBudget').textContent = vals.budget;
  let score = 0;
  Object.keys(vals).forEach(function(k) {
    const need = a.match[k];
    const diff = Math.abs(vals[k] - need);
    score += Math.max(0, 100 - diff * 1.5);
  });
  score = Math.round(score / 4);
  document.getElementById('matchValue').textContent = score + '%';
  // 环形进度
  const circumference = 2 * Math.PI * 55;
  const offset = circumference * (1 - score / 100);
  document.getElementById('ringFg').style.strokeDasharray = circumference;
  document.getElementById('ringFg').style.strokeDashoffset = offset;
  // 状态文字
  const status = document.getElementById('matchStatus');
  status.classList.remove('high', 'mid', 'low');
  if (score >= 80) {
    status.classList.add('high');
    status.textContent = '高度匹配！它是你的命中注定 🎉';
    card.classList.add('glow');
    spawnPawParticles();
  } else if (score >= 50) {
    status.classList.add('mid');
    status.textContent = '匹配度中等，可以考虑领养';
    card.classList.remove('glow');
  } else {
    status.classList.add('low');
    status.textContent = '匹配度较低，建议调整条件或看看其他小伙伴';
    card.classList.remove('glow');
  }
}

Object.values(sliders).forEach(function(s) {
  s.addEventListener('input', updateMatch);
});

function spawnPawParticles() {
  if (spawnPawParticles.last && Date.now() - spawnPawParticles.last < 2000) return;
  spawnPawParticles.last = Date.now();
  for (let i = 0; i < 15; i++) {
    setTimeout(function() {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = (window.innerWidth / 2 - 170 + Math.random() * 340) + 'px';
      p.style.top = '320px';
      p.style.fontSize = (16 + Math.random() * 16) + 'px';
      p.textContent = '🐾';
      p.style.transition = 'all ' + (1.5 + Math.random()) + 's ease-out';
      document.body.appendChild(p);
      setTimeout(function() {
        p.style.top = (100 + Math.random() * 200) + 'px';
        p.style.left = (parseInt(p.style.left) + (Math.random() * 200 - 100)) + 'px';
        p.style.opacity = '0';
        p.style.transform = 'rotate(' + (Math.random() * 360) + 'deg) scale(1.5)';
      }, 10);
      setTimeout(function() { p.remove(); }, 2500);
    }, i * 60);
  }
}

document.getElementById('adoptBtn').addEventListener('click', function() {
  const a = animals[curIdx];
  document.getElementById('confirmText').textContent =
    '您已成功提交「' + a.name + '」的领养申请！工作人员将在24小时内与您联系，请保持电话畅通。';
  document.getElementById('confirmModal').classList.add('show');
  for (let i = 0; i < 30; i++) {
    setTimeout(function() {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = (window.innerWidth / 2) + 'px';
      p.style.top = (window.innerHeight / 2) + 'px';
      const icons = ['❤️', '🐾', '✨', '🌟'];
      p.textContent = icons[Math.floor(Math.random() * 4)];
      p.style.fontSize = (14 + Math.random() * 12) + 'px';
      p.style.transition = 'all ' + (1 + Math.random()) + 's ease-out';
      document.body.appendChild(p);
      setTimeout(function() {
        const angle = Math.random() * Math.PI * 2;
        const dist = 100 + Math.random() * 200;
        p.style.left = (parseInt(p.style.left) + Math.cos(angle) * dist) + 'px';
        p.style.top = (parseInt(p.style.top) + Math.sin(angle) * dist) + 'px';
        p.style.opacity = '0';
      }, 10);
      setTimeout(function() { p.remove(); }, 1500);
    }, i * 30);
  }
});

document.getElementById('btnOk').addEventListener('click', function() {
  document.getElementById('confirmModal').classList.remove('show');
});
document.getElementById('btnCancel').addEventListener('click', function() {
  document.getElementById('confirmModal').classList.remove('show');
});

const pawBg = document.getElementById('pawBg');
for (let i = 0; i < 14; i++) {
  const p = document.createElement('div');
  p.className = 'falling-paw';
  p.textContent = '🐾';
  p.style.left = Math.random() * 100 + 'vw';
  p.style.animationDuration = (8 + Math.random() * 8) + 's';
  p.style.animationDelay = (Math.random() * 8) + 's';
  p.style.fontSize = (14 + Math.random() * 18) + 'px';
  pawBg.appendChild(p);
}

renderCard();
</script>
</body>
</html>
