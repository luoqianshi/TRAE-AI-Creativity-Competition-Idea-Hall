<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AIoT Command Center</title>
<style>
:root {
  --bg: #0a0a1a;
  --card: rgba(16,16,40,0.9);
  --cyan: #00e5ff;
  --green: #00ff41;
  --red: #ff1744;
  --amber: #ffb300;
  --text: #e0e0ec;
  --text2: #9898b8;
  --text3: #606080;
  --border: rgba(0,229,255,0.1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  max-width: 430px; margin: 0 auto;
  height: 100vh; overflow: hidden;
  display: flex; flex-direction: column;
  -webkit-tap-highlight-color: transparent;
}
/* ========== Header ========== */
.header{
  padding: 12px 20px;
  background: rgba(10,10,26,0.95);
  backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.header-title{ font-size: 17px; font-weight: 600; color: var(--cyan); }
.header-right{ font-size: 13px; color: var(--text3); display: flex; align-items: center; gap: 6px; }
.header-dot{ width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }

/* ========== Page Content ========== */
.page-wrap{ flex:1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.page{ display: none; padding: 16px 16px 0; }
.page.active{ display: block; }

/* ========== Device List ========== */
.area-header{
  display: flex; align-items: center; gap: 8px;
  padding: 8px 4px 10px; margin-top: 4px;
}
.area-title{ font-size: 14px; font-weight: 600; color: var(--cyan); }
.area-count{ font-size: 12px; color: var(--text3); }

.device-list{
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden; margin-bottom: 16px;
}
.device-item{
  display: flex; align-items: center; padding: 14px 16px;
  border-bottom: 1px solid rgba(0,229,255,0.05); cursor: pointer;
  transition: background 0.2s;
}
.device-item:last-child{ border-bottom: none; }
.device-item:active{ background: rgba(0,229,255,0.05); }
.device-icon{
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0; margin-right: 12px;
}
.device-icon.wifi{ background: rgba(0,229,255,0.1); color: var(--cyan); }
.device-icon.bt{ background: rgba(0,255,65,0.1); color: var(--green); }
.device-info{ flex:1; min-width: 0; }
.device-name{ font-size: 15px; font-weight: 500; }
.device-sub{ font-size: 12px; color: var(--text2); margin-top: 2px; }
.device-status{ flex-shrink: 0; }
.tag{
  font-size: 10px; padding: 2px 10px; border-radius: 10px; font-weight: 600;
  display: flex; align-items: center; gap: 4px;
}
.tag-online{ background: rgba(0,255,65,0.1); color: var(--green); border: 1px solid rgba(0,255,65,0.2); }
.tag-offline{ background: rgba(255,23,68,0.1); color: var(--red); border: 1px solid rgba(255,23,68,0.2); }
.tag-dot{ width: 6px; height: 6px; border-radius: 50%; }
.tag-online .tag-dot{ background: var(--green); box-shadow: 0 0 6px var(--green); }
.tag-offline .tag-dot{ background: var(--red); box-shadow: 0 0 6px var(--red); }

.add-btn{
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px; margin-bottom: 16px; border-radius: 10px;
  border: 1px dashed rgba(0,229,255,0.25); color: var(--text2);
  font-size: 13px; cursor: pointer; transition: all 0.2s;
}
.add-btn:active{ background: rgba(0,229,255,0.05); border-color: var(--cyan); color: var(--cyan); }

/* ========== Device Detail Modal ========== */
.modal-overlay{
  position: fixed; top:0; left:0; right:0; bottom:0;
  background: rgba(0,0,0,0.7); z-index: 200;
  display: flex; align-items: flex-end; justify-content: center;
}
.modal-sheet{
  background: #111128; border-radius: 20px 20px 0 0;
  width: 100%; max-width: 430px; max-height: 80vh;
  overflow-y: auto; padding: 24px 20px 32px;
  animation: slideUp 0.3s ease;
}
.modal-handle{ width: 36px; height: 4px; background: #333; border-radius: 2px; margin: 0 auto 16px; }
.modal-device-header{ display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.modal-device-icon{ width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.modal-device-icon.wifi{ background: rgba(0,229,255,0.1); color: var(--cyan); }
.modal-device-icon.bt{ background: rgba(0,255,65,0.1); color: var(--green); }
.modal-device-name{ font-size: 18px; font-weight: 600; }
.modal-device-sub{ font-size: 12px; color: var(--text2); }
.modal-meta{
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  background: rgba(255,255,255,0.02); border-radius: 10px; padding: 14px; margin-bottom: 16px;
}
.meta-item{ font-size: 12px; }
.meta-label{ color: var(--text3); margin-bottom: 2px; }
.meta-value{ color: var(--text); font-weight: 500; }

.fun-list{ margin-bottom: 12px; }
.fun-item{
  display: flex; align-items: center; padding: 14px 0;
  border-bottom: 1px solid rgba(0,229,255,0.05);
}
.fun-icon{
  width: 36px; height: 36px; border-radius: 8px;
  background: rgba(0,229,255,0.1); color: var(--cyan);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; margin-right: 12px; flex-shrink: 0;
}
.fun-info{ flex:1; }
.fun-name{ font-size: 14px; font-weight: 500; }
.fun-desc{ font-size: 11px; color: var(--text2); }
.fun-play{
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(0,229,255,0.1); border: none; color: var(--cyan);
  font-size: 16px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.fun-play:active{ background: rgba(0,229,255,0.25); transform: scale(0.95); }
.fun-play.disabled{ background: rgba(255,255,255,0.03); color: var(--text3); }

.modal-close{
  width: 100%; padding: 14px; border-radius: 10px; background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06); color: var(--text2);
  font-size: 14px; cursor: pointer; margin-top: 8px; text-align: center;
}
.modal-close:active{ background: rgba(255,255,255,0.06); }

/* ========== Settings Page ========== */
.cyber-section{ display: flex; flex-direction: column; gap: 12px; }

.status-card{
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px;
}
.status-card.online{ border-color: rgba(0,255,65,0.2); }
.status-card.offline{ border-color: rgba(255,23,68,0.2); }
.card-row{ display: flex; align-items: center; gap: 12px; }
.card-icon{ font-size: 24px; flex-shrink: 0; }
.card-text{ flex:1; }
.card-title{ font-size: 15px; font-weight: 600; }
.card-desc{ font-size: 12px; color: var(--text2); margin-top: 2px; }
.card-chips{ display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.chip{
  font-size: 10px; padding: 3px 10px; border-radius: 10px; font-weight: 500;
}
.chip-green{ background: rgba(0,255,65,0.1); color: var(--green); border: 1px solid rgba(0,255,65,0.2); }
.chip-red{ background: rgba(255,23,68,0.1); color: var(--red); border: 1px solid rgba(255,23,68,0.2); }
.chip-blue{ background: rgba(0,229,255,0.1); color: var(--cyan); border: 1px solid rgba(0,229,255,0.2); }
.detail-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.detail-item{ font-size: 12px; }
.detail-label{ color: var(--text3); }
.detail-val{ color: var(--text); font-weight: 500; }
.card-btn{
  margin-top: 12px; padding: 8px 16px; border-radius: 20px;
  background: rgba(0,229,255,0.08); border: 1px solid rgba(0,229,255,0.2);
  color: var(--cyan); font-size: 12px; cursor: pointer; width: 100%; text-align: center;
  transition: all 0.2s;
}
.card-btn:active{ background: rgba(0,229,255,0.15); }
.card-btn-group{ display: flex; gap: 8px; margin-top: 12px; }
.card-btn-group .card-btn{ flex:1; }
.card-btn.warn{ border-color: rgba(255,179,0,0.3); color: var(--amber); background: rgba(255,179,0,0.08); }
.card-btn.danger{ border-color: rgba(255,23,68,0.3); color: var(--red); background: rgba(255,23,68,0.08); }

.menu-group{ margin-bottom: 12px; }
.menu-title{ font-size: 12px; color: var(--cyan); padding: 8px 4px; font-weight: 600; }
.menu-item{
  display: flex; align-items: center; padding: 14px 16px;
  background: var(--card); border: 1px solid var(--border); cursor: pointer;
  border-radius: 10px; margin-bottom: 4px; transition: all 0.15s;
}
.menu-item:active{ border-color: rgba(0,229,255,0.3); background: rgba(0,229,255,0.03); }
.menu-icon{ font-size: 18px; margin-right: 12px; width: 24px; text-align: center; }
.menu-info{ flex:1; }
.menu-name{ font-size: 14px; }
.menu-label{ font-size: 11px; color: var(--text2); }
.menu-arrow{ color: var(--text3); font-size: 16px; }

.danger-zone{ display: flex; gap: 10px; margin-top: 12px; padding-bottom: 20px; padding-top: 8px; }
.danger-btn{
  flex:1; padding: 10px; border-radius: 20px; font-size: 12px; text-align: center; cursor: pointer; transition: all 0.2s;
}
.danger-btn.warn-btn{ border: 1px solid rgba(255,179,0,0.3); color: var(--amber); background: rgba(255,179,0,0.06); }
.danger-btn.warn-btn:active{ background: rgba(255,179,0,0.12); }
.danger-btn.error-btn{ border: 1px solid rgba(255,23,68,0.3); color: var(--red); background: rgba(255,23,68,0.06); }
.danger-btn.error-btn:active{ background: rgba(255,23,68,0.12); }

/* ========== Toast ========== */
.toast{
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: rgba(0,0,0,0.85); color: #fff; padding: 12px 24px;
  border-radius: 8px; font-size: 14px; z-index: 999; pointer-events: none;
  animation: fadeInOut 2s ease forwards;
}

/* ========== Tab Bar ========== */
.tabbar{
  display: flex; border-top: 1px solid var(--border);
  background: rgba(10,10,26,0.95); backdrop-filter: blur(10px);
  flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom);
}
.tab-item{
  flex:1; padding: 10px 0 8px; display: flex; flex-direction: column;
  align-items: center; gap: 2px; cursor: pointer; transition: all 0.2s;
  color: var(--text3); font-size: 10px;
}
.tab-item .tab-icon{ font-size: 22px; }
.tab-item.active{ color: var(--cyan); }

/* ========== Animations ========== */
@keyframes pulse{ 0%,100%{ opacity:1 } 50%{ opacity:0.4 } }
@keyframes slideUp{ from{ transform: translateY(100%) } to{ transform: translateY(0) } }
@keyframes fadeInOut{ 0%{ opacity:0; transform: translate(-50%,-50%) scale(0.9) } 15%{ opacity:1; transform: translate(-50%,-50%) scale(1) } 70%{ opacity:1 } 100%{ opacity:0 } }

::-webkit-scrollbar{ width:0 }

/* ========== Confirm Dialog ========== */
.dialog-overlay{
  position: fixed; top:0; left:0; right:0; bottom:0;
  background: rgba(0,0,0,0.6); z-index: 300;
  display: flex; align-items: center; justify-content: center;
}
.dialog-box{
  background: #151530; border: 1px solid var(--border); border-radius: 16px;
  width: 300px; padding: 24px 20px 20px; text-align: center;
}
.dialog-title{ font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.dialog-msg{ font-size: 13px; color: var(--text2); margin-bottom: 20px; line-height: 1.6; }
.dialog-buttons{ display: flex; gap: 10px; }
.dialog-btn{
  flex:1; padding: 10px; border-radius: 8px; font-size: 14px; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03);
  color: var(--text); transition: all 0.15s;
}
.dialog-btn.confirm{ background: rgba(0,229,255,0.12); border-color: rgba(0,229,255,0.3); color: var(--cyan); }
.dialog-btn.confirm:active{ background: rgba(0,229,255,0.2); }
.dialog-btn:active{ background: rgba(255,255,255,0.06); }

/* ========== Command Confirm Modal ========== */
.cmd-overlay{
  position: fixed; top:0; left:0; right:0; bottom:0;
  background: rgba(0,0,0,0.6); z-index: 250;
  display: flex; align-items: center; justify-content: center;
}
.cmd-box{
  background: #151530; border: 1px solid var(--border); border-radius: 16px;
  width: 90%; max-width: 380px; padding: 24px 20px 20px;
}
.cmd-title{ font-size: 16px; color: var(--cyan); font-weight: 600; margin-bottom: 12px; }
.cmd-fun-name{ font-size: 14px; margin-bottom: 12px; padding: 10px; background: rgba(0,229,255,0.05); border-left: 3px solid var(--cyan); border-radius: 6px; }
.cmd-label{ font-size: 12px; color: var(--text3); margin-bottom: 6px; }
.cmd-input{
  width: 100%; padding: 10px; background: rgba(255,255,255,0.03);
  border: 1px solid var(--border); border-radius: 8px; color: var(--text);
  font-size: 13px; font-family: monospace; resize: none; margin-bottom: 16px;
}
.cmd-input:focus{ outline: none; border-color: var(--cyan); }
.cmd-buttons{ display: flex; gap: 10px; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <span class="header-title" id="headerTitle">设备列表</span>
  <span class="header-right"><span class="header-dot"></span>系统运行中</span>
</div>

<!-- Page Content -->
<div class="page-wrap">

  <!-- ======== Device List Page ======== -->
  <div class="page active" id="pageDevices">
    <div class="add-btn" onclick="showToast('打开添加设备菜单')">+ 添加网络设备</div>
    <div id="deviceList"></div>
  </div>

  <!-- ======== Settings Page ======== -->
  <div class="page" id="pageSettings">
    <div class="cyber-section" id="settingsContent"></div>
  </div>

</div>

<!-- Tab Bar -->
<div class="tabbar">
  <div class="tab-item active" data-page="devices" onclick="switchTab('devices')">
    <span class="tab-icon">🔌</span>
    <span>设备</span>
  </div>
  <div class="tab-item" data-page="settings" onclick="switchTab('settings')">
    <span class="tab-icon">⚙️</span>
    <span>设置</span>
  </div>
</div>

<!-- Device Detail Sheet -->
<div class="modal-overlay" id="deviceModal" style="display:none" onclick="if(event.target===this)closeDeviceModal()">
  <div class="modal-sheet" id="deviceModalContent"></div>
</div>

<!-- Toast -->
<div id="toastContainer"></div>

<!-- Confirm Dialog -->
<div class="dialog-overlay" id="dialogOverlay" style="display:none">
  <div class="dialog-box">
    <div class="dialog-title" id="dialogTitle"></div>
    <div class="dialog-msg" id="dialogMsg"></div>
    <div class="dialog-buttons">
      <button class="dialog-btn" id="dialogCancel">取消</button>
      <button class="dialog-btn confirm" id="dialogConfirm">确认</button>
    </div>
  </div>
</div>

<script>
// ==================== DATA ====================
const deviceData = [

    id: 'EQP-001', name: '会议室智能屏', area: '上海总部·3F办公区',
    desc: 'MAXHUB V6 86寸会议平板，支持无线投屏、白板书写、视频会议', ip: '192.168.10.101',
    type: 'wifi', clientId: 'maxhub-86inch-01', online: true,
    functions: [

      { key: 'temp_set', name: '设定温度', desc: '设置目标温度(16-30°C)', param: '{"temp":24}' },
      { key: 'mode_set', name: '工作模式', desc: '切换制冷/制热/送风/除湿', param: '{"mode":"cool"}' },

  {
    id: 'EQP-003', name: '智能照明控制器', area: '上海总部·3F办公区',
    desc: 'Aqara智能照明系统，可调节亮度和色温，支持场景联动', ip: '192.168.10.103',
    type: 'wifi', clientId: 'aqara-light-ctrl-01', online: true,

      { key: 'brightness', name: '亮度调节', desc: '设置灯光亮度(0-100)', param: '{"level":80}' },
      { key: 'scene_set', name: '场景模式', desc: '切换场景(会议/午休/下班)', param: '{"scene":"meeting"}' }
    ]
  },
  {
    id: 'EQP-004', name: '打印机 M507', area: '上海总部·5F行政部',
    desc: '惠普 LaserJet M507dn A4黑白激光打印机，支持双面打印与网络打印', ip: '192.168.20.11',
    type: 'wifi', clientId: 'hp-m507-admin-01', online: true,
    functions: [
      { key: 'wake_up', name: '唤醒打印机', desc: '从待机模式唤醒', param: '{}' },
      { key: 'cancel_job', name: '取消当前任务', desc: '取消正在进行的打印任务', param: '{}' },
      { key: 'status_check', name: '查询状态', desc: '获取墨粉余量与纸张状态', param: '{}' }
    ]
  },
  {

    desc: '海康威视 DS-K2604 门禁控制器，4门单向控制，支持IC卡/密码/人脸', ip: '192.168.30.1',

      { key: 'door_lock', name: '锁定大门', desc: '锁定大门禁止出入', param: '{"door":1}' },
      { key: 'door_unlock', name: '解除锁定', desc: '恢复大门正常通行', param: '{"door":1}' }

    desc: 'RS485工业级温湿度传感器，实时监测数据中心环境状态', ip: '192.168.40.21',
    type: 'bt', clientId: 'th-sensor-dc-a-01', online: true,
    functions: [
      { key: 'read_temp', name: '读取温度', desc: '获取当前环境温度', param: '{}' },
      { key: 'read_humidity', name: '读取湿度', desc: '获取当前环境湿度', param: '{}' },
      { key: 'alert_threshold', name: '告警阈值', desc: '设置告警阈值', param: '{"temp_high":35,"hum_low":20}' }
    ]
  },
  {
    id: 'EQP-007', name: 'UPS电源-Smart1500', area: '上海总部·B1机房',
    desc: 'APC Smart-UPS 1500VA，提供机架式不间断电源，电池状态监测', ip: '192.168.40.10',
    type: 'wifi', clientId: 'apc-smt1500-01', online: false,
    functions: [
      { key: 'status_check', name: '查询UPS状态', desc: '获取电池电量与负载', param: '{}' },
      { key: 'self_test', name: '自检', desc: '执行UPS电池自检程序', param: '{}' },
    ]
  },
];

// Group by area
function groupDevices() {
  const groups = {};
  deviceData.forEach(d => {
    if (!groups[d.area]) groups[d.area] = [];
    groups[d.area].push(d);
  });
  return groups;
}

// ==================== TOAST ====================
function showToast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 2100);
}

// ==================== CONFIRM DIALOG ====================
let dialogCallback = null;
function showConfirm(title, msg, onConfirm) {
  document.getElementById('dialogTitle').textContent = title;
  document.getElementById('dialogMsg').textContent = msg;
  document.getElementById('dialogOverlay').style.display = 'flex';
  dialogCallback = onConfirm;
}
document.getElementById('dialogCancel').onclick = () => {
  document.getElementById('dialogOverlay').style.display = 'none';
  dialogCallback = null;
};
document.getElementById('dialogConfirm').onclick = () => {
  document.getElementById('dialogOverlay').style.display = 'none';
  if (dialogCallback) dialogCallback();

};

// ==================== TAB SWITCH ====================
function switchTab(tab) {
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelector(`.tab-item[data-page="${tab}"]`).classList.add('active');
  document.getElementById('page' + (tab === 'devices' ? 'Devices' : 'Settings')).classList.add('active');
  document.getElementById('headerTitle').textContent = tab === 'devices' ? '设备列表' : '设置';
}
document.querySelectorAll('.tab-item').forEach(item => {
  item.addEventListener('click', () => switchTab(item.dataset.page));
});

// ==================== RENDER DEVICES ====================
function renderDeviceList() {
  const groups = groupDevices();
  let html = '';
  for (const [area, devices] of Object.entries(groups)) {
    html += `<div class="area-header"><span class="area-title">${area}</span><span class="area-count">(${devices.length})</span></div>`;
    html += '<div class="device-list">';
    devices.forEach(d => {
      const iconClass = d.type === 'wifi' ? 'wifi' : 'bt';
      const iconEmoji = d.type === 'wifi' ? '📡' : '📶';
      const tagClass = d.online ? 'tag-online' : 'tag-offline';
      const tagText = d.online ? 'ONLINE' : 'OFFLINE';
      html += `
        <div class="device-item" onclick="openDeviceDetail('${d.id}')">
          <div class="device-icon ${iconClass}">${iconEmoji}</div>
          <div class="device-info">
            <div class="device-name">${d.name}</div>
            <div class="device-sub">编号: ${d.clientId}</div>
          </div>
          <div class="device-status">
            <span class="tag ${tagClass}"><span class="tag-dot"></span>${tagText}</span>
          </div>
        </div>`;
    });
    html += '</div>';
  }
  document.getElementById('deviceList').innerHTML = html;
}

// ==================== DEVICE DETAIL MODAL ====================
function openDeviceDetail(id) {
  const d = deviceData.find(x => x.id === id);
  if (!d) return;

  const iconClass = d.type === 'wifi' ? 'wifi' : 'bt';
  const iconEmoji = d.type === 'wifi' ? '📡' : '📶';
  const tagClass = d.online ? 'tag-online' : 'tag-offline';
  const tagText = d.online ? 'ONLINE' : 'OFFLINE';

  let funHtml = '<div class="fun-list">';
  d.functions.forEach(f => {
    const playClass = d.online ? '' : 'disabled';
    const onclick = d.online ? `onclick="openCmdModal('${d.id}','${f.key}')"` : '';
    funHtml += `
      <div class="fun-item">
        <div class="fun-icon">${f.name.charAt(0)}</div>
        <div class="fun-info"><div class="fun-name">${f.name}</div><div class="fun-desc">${f.desc}</div></div>
        <button class="fun-play ${playClass}" ${onclick}>▶</button>
      </div>`;
  });
  funHtml += '</div>';

  document.getElementById('deviceModalContent').innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-device-header">
      <div class="modal-device-icon ${iconClass}">${iconEmoji}</div>
      <div>
        <div class="modal-device-name">${d.name}</div>
        <div class="modal-device-sub">Client ID: ${d.clientId} <span class="tag ${tagClass}" style="display:inline-flex;margin-left:8px"><span class="tag-dot"></span>${tagText}</span></div>
      </div>
    </div>
    <div class="modal-meta">
      <div class="meta-item"><div class="meta-label">当前状态</div><div class="meta-value">${d.online ? '运行中' : '已断开'}</div></div>
      <div class="meta-item"><div class="meta-label">IP地址</div><div class="meta-value">${d.ip}</div></div>
      <div class="meta-item" style="grid-column:span 2"><div class="meta-label">设备介绍</div><div class="meta-value">${d.desc}</div></div>
    </div>
    <div style="font-size:13px;font-weight:600;margin-bottom:8px;">功能清单</div>
    ${funHtml}
    <div class="modal-close" onclick="closeDeviceModal()">关闭</div>
  `;
  document.getElementById('deviceModal').style.display = 'flex';
}

function closeDeviceModal() {
  document.getElementById('deviceModal').style.display = 'none';
}

// ==================== COMMAND MODAL ====================
let cmdDeviceId = null;
let cmdFunKey = null;

function openCmdModal(deviceId, funKey) {
  const d = deviceData.find(x => x.id === deviceId);
  const f = d.functions.find(x => x.key === funKey);
  if (!d || !f) return;

  cmdDeviceId = deviceId;
  cmdFunKey = funKey;

  let paramStr = f.param;
  if (paramStr && paramStr.toLowerCase() === 'none') paramStr = '';

  const overlay = document.createElement('div');
  overlay.className = 'cmd-overlay';
  overlay.id = 'cmdOverlay';
  overlay.onclick = function(e) { if (e.target === this) this.remove(); };
  overlay.innerHTML = `
    <div class="cmd-box" onclick="event.stopPropagation()">
      <div class="cmd-title">功能指令确认</div>
      <div class="cmd-fun-name">即将执行：${f.name}</div>
      <div class="cmd-label">可在此修改执行参数</div>
      <textarea class="cmd-input" id="cmdParamInput" rows="4">${paramStr}</textarea>
      <div class="cmd-buttons">
        <button class="dialog-btn" onclick="document.getElementById('cmdOverlay').remove()">取消</button>
        <button class="dialog-btn confirm" onclick="executeCommand()">确认执行</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  setTimeout(() => document.getElementById('cmdParamInput').focus(), 300);
}

function executeCommand() {
  const paramText = document.getElementById('cmdParamInput').value;
  let params;
  try {
    params = paramText ? JSON.parse(paramText) : {};
  } catch(e) {
    showToast('参数格式错误，请输入有效JSON');
    return;
  }

  const d = deviceData.find(x => x.id === cmdDeviceId);
  const f = d.functions.find(x => x.key === cmdFunKey);

  document.getElementById('cmdOverlay').remove();

  // Simulate sending
  showToast(`指令已下发：${f.name}`);

  // Log
  addCmdLog(d, f, params);
}

// ==================== COMMAND LOG (in settings audit) ====================
const cmdLogs = [];
function addCmdLog(device, func, params) {
  const now = new Date();
  cmdLogs.unshift({
    time: now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
    device: device.name,
    func: func.name,
    params: JSON.stringify(params),
    result: '成功'
  });
}
