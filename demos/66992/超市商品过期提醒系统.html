<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超市商品过期提醒系统 - SmartCheck</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #2563eb;
            --success-color: #16a34a;
            --warning-color: #f59e0b;
            --danger-color: #dc2626;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            color: var(--text-primary);
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .tagline {
            display: inline-block;
            background: rgba(59, 130, 246, 0.1);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            margin-top: 15px;
            font-size: 0.95rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 2px solid transparent;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            border-color: rgba(147, 51, 234, 0.5);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
        }

        .tab-btn:hover:not(.active) {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .scan-section {
            display: flex;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .scan-box {
            flex: 1;
            min-width: 350px;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .scan-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .scan-box .icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .scan-box.in .icon {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(34, 197, 94, 0.1));
            color: #22c55e;
        }

        .scan-box.out .icon {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.1));
            color: #ef4444;
        }

        .scan-box h3 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .scan-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-primary);
            margin-bottom: 15px;
            transition: border-color 0.3s ease;
        }

        .scan-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .scan-input::placeholder {
            color: var(--text-secondary);
        }

        .expiry-input {
            width: 100%;
            padding: 12px 15px;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-primary);
            margin-bottom: 15px;
            transition: border-color 0.3s ease;
        }

        .expiry-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .scan-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .scan-btn.in-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
        }

        .scan-btn.in-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.3);
        }

        .scan-btn.out-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        .scan-btn.out-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.3);
        }

        .result-area {
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .result-area.success {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .result-area.warning {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .result-area.danger {
            background: rgba(220, 38, 38, 0.15);
            color: #dc2626;
            border: 1px solid rgba(220, 38, 38, 0.3);
        }

        .result-area.info {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .result-area.empty {
            background: transparent;
            color: var(--text-secondary);
        }

        .inventory-section {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--border-color);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-header h3 {
            font-size: 1.5rem;
            color: var(--text-primary);
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
        }

        .filter-tab {
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-tab.active {
            background: var(--primary-color);
            color: white;
        }

        .filter-tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .stat-card.total .value { color: #3b82f6; }
        .stat-card.expiring .value { color: #f59e0b; }
        .stat-card.expired .value { color: #dc2626; }
        .stat-card.normal .value { color: #22c55e; }

        .inventory-table {
            width: 100%;
            border-collapse: collapse;
        }

        .inventory-table th {
            text-align: left;
            padding: 15px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border-color);
        }

        .inventory-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.3s ease;
        }

        .inventory-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .expiry-status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .expiry-status.normal {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
        }

        .expiry-status.warning {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }

        .expiry-status.danger {
            background: rgba(220, 38, 38, 0.15);
            color: #dc2626;
        }

        .delete-btn {
            padding: 6px 12px;
            background: rgba(220, 38, 38, 0.15);
            color: #dc2626;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: rgba(220, 38, 38, 0.3);
            transform: translateY(-1px);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 1.1rem;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .animate-pulse {
            animation: pulse 2s infinite;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .scan-section {
                flex-direction: column;
            }

            .scan-box {
                min-width: 100%;
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .inventory-table th,
            .inventory-table td {
                padding: 10px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏪 SmartCheck</h1>
        <p>智能商品过期提醒系统</p>
        <span class="tagline">入库扫描 · 智能预警 · 卖出拦截</span>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('scan')">📱 扫描操作</button>
            <button class="tab-btn" onclick="switchTab('inventory')">📦 库存管理</button>
        </div>

        <div id="scan-tab">
            <div class="scan-section">
                <div class="scan-box in">
                    <div class="icon">📥</div>
                    <h3>入库扫描</h3>
                    <input type="text" class="scan-input" id="in-barcode" placeholder="请扫描商品条形码" onkeypress="handleEnter(event, 'in')">
                    <input type="date" class="expiry-input" id="in-expiry" placeholder="选择过期日期">
                    <button class="scan-btn in-btn" onclick="scanIn()">
                        ✅ 确认入库
                    </button>
                    <div class="result-area empty" id="in-result">等待扫描...</div>
                </div>

                <div class="scan-box out">
                    <div class="icon">📤</div>
                    <h3>卖出扫描</h3>
                    <input type="text" class="scan-input" id="out-barcode" placeholder="请扫描商品条形码" onkeypress="handleEnter(event, 'out')">
                    <button class="scan-btn out-btn" onclick="scanOut()">
                        🔍 检查过期
                    </button>
                    <div class="result-area empty" id="out-result">等待扫描...</div>
                </div>
            </div>
        </div>

        <div id="inventory-tab" style="display: none;">
            <div class="inventory-section">
                <div class="section-header">
                    <h3>📊 商品库存概览</h3>
                    <div class="filter-tabs">
                        <button class="filter-tab active" onclick="filterInventory('all')">全部</button>
                        <button class="filter-tab" onclick="filterInventory('normal')">正常</button>
                        <button class="filter-tab" onclick="filterInventory('warning')">即将过期</button>
                        <button class="filter-tab" onclick="filterInventory('danger')">已过期</button>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card total">
                        <div class="value" id="stat-total">0</div>
                        <div class="label">总库存</div>
                    </div>
                    <div class="stat-card normal">
                        <div class="value" id="stat-normal">0</div>
                        <div class="label">正常商品</div>
                    </div>
                    <div class="stat-card expiring">
                        <div class="value" id="stat-expiring">0</div>
                        <div class="label">即将过期</div>
                    </div>
                    <div class="stat-card expired">
                        <div class="value" id="stat-expired">0</div>
                        <div class="label">已过期</div>
                    </div>
                </div>

                <table class="inventory-table" id="inventory-table">
                    <thead>
                        <tr>
                            <th>商品名称</th>
                            <th>条形码</th>
                            <th>过期日期</th>
                            <th>剩余天数</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-body">
                        <tr>
                            <td colspan="6" class="empty-state">
                                <div class="icon">📦</div>
                                <p>暂无库存数据，请先进行入库扫描</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sampleProducts = {
            '6901234567890': { name: '蒙牛纯牛奶', expiry: '2026-08-15' },
            '6901234567891': { name: '可口可乐330ml', expiry: '2026-06-30' },
            '6901234567892': { name: '乐事薯片原味', expiry: '2026-07-10' },
            '6901234567893': { name: '康师傅方便面', expiry: '2026-09-20' },
            '6901234567894': { name: '奥利奥饼干', expiry: '2026-06-15' },
            '6901234567895': { name: '农夫山泉550ml', expiry: '2026-12-31' },
            '6901234567896': { name: '旺仔牛奶', expiry: '2026-07-20' },
            '6901234567897': { name: '好丽友派', expiry: '2026-06-01' },
        };

        let inventory = [];
        let currentFilter = 'all';

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('scan-tab').style.display = tab === 'scan' ? 'block' : 'none';
            document.getElementById('inventory-tab').style.display = tab === 'inventory' ? 'block' : 'none';
            
            if (tab === 'inventory') {
                updateInventory();
            }
        }

        function handleEnter(event, type) {
            if (event.key === 'Enter') {
                if (type === 'in') scanIn();
                else scanOut();
            }
        }

        function scanIn() {
            const barcode = document.getElementById('in-barcode').value.trim();
            const expiry = document.getElementById('in-expiry').value;
            const resultArea = document.getElementById('in-result');

            if (!barcode) {
                showResult(resultArea, 'danger', '❌ 请输入商品条形码');
                return;
            }

            if (!expiry) {
                showResult(resultArea, 'warning', '⚠️ 请选择过期日期');
                return;
            }

            const product = sampleProducts[barcode] || { name: `商品-${barcode}`, expiry };
            
            const existingItem = inventory.find(item => item.barcode === barcode);
            if (existingItem) {
                existingItem.expiry = expiry;
                existingItem.name = product.name;
                showResult(resultArea, 'success', `✅ 更新成功！${product.name} 过期日期已更新为 ${expiry}`);
            } else {
                inventory.push({
                    barcode,
                    name: product.name,
                    expiry,
                    addedAt: new Date().toLocaleString()
                });
                showResult(resultArea, 'success', `✅ 入库成功！${product.name} 已登记，过期日期：${expiry}`);
            }

            document.getElementById('in-barcode').value = '';
            document.getElementById('in-expiry').value = '';
            
            if (document.getElementById('inventory-tab').style.display !== 'none') {
                updateInventory();
            }
        }

        function scanOut() {
            const barcode = document.getElementById('out-barcode').value.trim();
            const resultArea = document.getElementById('out-result');

            if (!barcode) {
                showResult(resultArea, 'danger', '❌ 请输入商品条形码');
                return;
            }

            const item = inventory.find(i => i.barcode === barcode);
            
            if (!item) {
                if (sampleProducts[barcode]) {
                    showResult(resultArea, 'warning', `⚠️ ${sampleProducts[barcode].name} 未入库，请先入库登记`);
                } else {
                    showResult(resultArea, 'danger', '❌ 未找到该商品');
                }
                return;
            }

            const today = new Date();
            const expiryDate = new Date(item.expiry);
            const diffTime = expiryDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays < 0) {
                showResult(resultArea, 'danger', `🚨 禁止出售！${item.name} 已过期 ${Math.abs(diffDays)} 天`);
            } else if (diffDays <= 3) {
                showResult(resultArea, 'warning', `⚠️ 即将过期！${item.name} 剩余 ${diffDays} 天过期`);
            } else if (diffDays <= 7) {
                showResult(resultArea, 'warning', `⏰ 注意：${item.name} 剩余 ${diffDays} 天过期`);
            } else {
                showResult(resultArea, 'success', `✅ 正常出售！${item.name} 状态良好`);
            }

            document.getElementById('out-barcode').value = '';
        }

        function showResult(element, type, message) {
            element.className = `result-area ${type}`;
            element.textContent = message;
            
            setTimeout(() => {
                element.className = 'result-area empty';
                element.textContent = '等待扫描...';
            }, 4000);
        }

        function filterInventory(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            updateInventory();
        }

        function getExpiryStatus(diffDays) {
            if (diffDays < 0) return 'danger';
            if (diffDays <= 7) return 'warning';
            return 'normal';
        }

        function getExpiryStatusText(diffDays) {
            if (diffDays < 0) return `已过期 ${Math.abs(diffDays)} 天`;
            if (diffDays <= 3) return `即将过期 (${diffDays}天)`;
            if (diffDays <= 7) return `注意 (${diffDays}天)`;
            return `正常 (${diffDays}天)`;
        }

        function updateInventory() {
            const today = new Date();
            const tbody = document.getElementById('inventory-body');
            
            let filtered = inventory;
            if (currentFilter !== 'all') {
                filtered = inventory.filter(item => {
                    const expiryDate = new Date(item.expiry);
                    const diffDays = Math.ceil((expiryDate - today) / (1000 * 60 * 60 * 24));
                    return getExpiryStatus(diffDays) === currentFilter;
                });
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-state">
                            <div class="icon">📦</div>
                            <p>暂无${currentFilter === 'all' ? '' : getStatusLabel(currentFilter)}商品</p>
                        </td>
                    </tr>
                `;
            } else {
                tbody.innerHTML = filtered.map(item => {
                    const expiryDate = new Date(item.expiry);
                    const diffDays = Math.ceil((expiryDate - today) / (1000 * 60 * 60 * 24));
                    const status = getExpiryStatus(diffDays);
                    const statusText = getExpiryStatusText(diffDays);
                    
                    return `
                        <tr>
                            <td>${item.name}</td>
                            <td>${item.barcode}</td>
                            <td>${item.expiry}</td>
                            <td>${diffDays} 天</td>
                            <td><span class="expiry-status ${status}">${statusText}</span></td>
                            <td><button class="delete-btn" onclick="deleteItem('${item.barcode}')">删除</button></td>
                        </tr>
                    `;
                }).join('');
            }

            updateStats();
        }

        function getStatusLabel(filter) {
            const labels = { normal: '正常', warning: '即将过期', danger: '已过期' };
            return labels[filter] || '';
        }

        function updateStats() {
            const today = new Date();
            
            let total = inventory.length;
            let normal = 0;
            let expiring = 0;
            let expired = 0;

            inventory.forEach(item => {
                const expiryDate = new Date(item.expiry);
                const diffDays = Math.ceil((expiryDate - today) / (1000 * 60 * 60 * 24));
                
                if (diffDays < 0) expired++;
                else if (diffDays <= 7) expiring++;
                else normal++;
            });

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-normal').textContent = normal;
            document.getElementById('stat-expiring').textContent = expiring;
            document.getElementById('stat-expiring').textContent = expiring;
            document.getElementById('stat-expired').textContent = expired;
        }

        function deleteItem(barcode) {
            inventory = inventory.filter(item => item.barcode !== barcode);
            updateInventory();
        }

        function initDemoData() {
            inventory = [
