<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智护桌面 · 智能感应收纳盒</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface2: #243044;
      --accent: #4ecdc4;
      --accent-dim: #2a9d8f;
      --warm: #ffb347;
      --cool: #6ec6ff;
      --text: #e8edf4;
      --text-muted: #8899aa;
      --success: #52c41a;
      --border: rgba(255,255,255,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      text-align: center;
      padding: 2rem 1rem 1rem;
      background: linear-gradient(180deg, #162032 0%, var(--bg) 100%);
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0.4rem;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 1rem 1.5rem 3rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 720px) {
      .container { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem;
    }

    .panel-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .panel-title::before {
      content: "";
      width: 4px;
      height: 14px;
      background: var(--accent);
      border-radius: 2px;
    }

    /* 设备可视化 */
    .device-wrap {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .device {
      position: relative;
      width: 320px;
      background: linear-gradient(145deg, #2a3548, #1e2838);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
      border: 1px solid var(--border);
    }

    .device-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .sensor-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #555;
      transition: all 0.3s;
    }

    .sensor-dot.active {
      background: var(--success);
      box-shadow: 0 0 12px var(--success);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .led-bar {
      height: 6px;
      border-radius: 3px;
      background: #333;
      flex: 1;
      margin: 0 1rem;
      transition: all 0.5s;
      overflow: hidden;
    }

    .led-bar.on-read { background: linear-gradient(90deg, #ffd89b, #ffb347); box-shadow: 0 0 20px rgba(255,179,71,0.6); }
    .led-bar.on-play { background: linear-gradient(90deg, #6ec6ff, #4a90d9); box-shadow: 0 0 20px rgba(110,198,255,0.5); }

    .compartments {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
    }

    .compartment {
      background: var(--surface2);
      border-radius: 10px;
      padding: 0.75rem 0.5rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.35s ease, box-shadow 0.35s;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .compartment:hover { border-color: rgba(78,205,196,0.4); }

    .compartment.open {
      transform: translateY(-8px);
      box-shadow: 0 12px 24px rgba(78,205,196,0.2);
      border-color: var(--accent);
    }

    .compartment .icon { font-size: 1.5rem; margin-bottom: 0.25rem; }
    .compartment .label { font-size: 0.7rem; color: var(--text-muted); }
    .compartment .status { font-size: 0.65rem; color: var(--accent); margin-top: 0.2rem; }

    .lid {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(180deg, #3a4558, #2a3548);
      border-radius: 10px 10px 0 0;
      transition: transform 0.4s ease;
      transform-origin: top center;
      pointer-events: none;
    }

    .compartment.open .lid { transform: rotateX(-75deg); opacity: 0.3; }

    .sensor-zone {
      margin-top: 1rem;
      padding: 1rem;
      border: 2px dashed var(--border);
      border-radius: 12px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s;
      user-select: none;
    }

    .sensor-zone:hover, .sensor-zone.near {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(78,205,196,0.06);
    }

    /* 控制按钮 */
    .controls { display: flex; flex-direction: column; gap: 0.75rem; }

    .btn {
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface2);
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn:hover { border-color: var(--accent); background: rgba(78,205,196,0.08); }
    .btn.active { border-color: var(--accent); background: rgba(78,205,196,0.15); color: var(--accent); }

    .btn .tag {
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      background: rgba(255,255,255,0.06);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0;
    }

    .switch {
      width: 44px;
      height: 24px;
      background: #444;
      border-radius: 12px;
      position: relative;
      cursor: pointer;
      transition: background 0.3s;
    }

    .switch.on { background: var(--accent-dim); }

    .switch::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: transform 0.3s;
    }

    .switch.on::after { transform: translateX(20px); }

    /* 状态卡片 */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }

    .stat {
      background: var(--surface2);
      border-radius: 10px;
      padding: 0.75rem;
      text-align: center;
    }

    .stat .val { font-size: 1.4rem; font-weight: 600; color: var(--accent); }
    .stat .key { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.15rem; }

    /* 日志 */
    .log {
      max-height: 140px;
      overflow-y: auto;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-family: "Consolas", monospace;
    }

    .log div { padding: 0.25rem 0; border-bottom: 1px solid var(--border); }
    .log .time { color: var(--accent); margin-right: 0.5rem; }

    footer {
      text-align: center;
      padding: 1rem;
      color: var(--text-muted);
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

<header>
  <h1>智护桌面 · 智能感应收纳盒</h1>
  <p>红外感应 · 护眼柔光 · 分区收纳 · 配套控制面板</p>
</header>

<main class="container">

  <section class="device-wrap panel">
    <div class="panel-title">设备状态</div>
    <div class="device" id="device">
      <div class="device-top">
        <div class="sensor-dot" id="sensorDot" title="红外感应"></div>
        <div class="led-bar" id="ledBar" title="护眼灯"></div>
        <span style="font-size:0.7rem;color:var(--text-muted)" id="ledLabel">灯关</span>
      </div>
      <div class="compartments">
        <div class="compartment" data-id="0" data-name="数据线">
          <div class="lid"></div>
          <div class="icon">🔌</div>
          <div class="label">数据线区</div>
          <div class="status">关闭</div>
        </div>
        <div class="compartment" data-id="1" data-name="文具">
          <div class="lid"></div>
          <div class="icon">✏️</div>
          <div class="label">文具区</div>
          <div class="status">关闭</div>
        </div>
        <div class="compartment" data-id="2" data-name="耳机">
          <div class="lid"></div>
          <div class="icon">🎧</div>
          <div class="label">耳机区</div>
          <div class="status">关闭</div>
        </div>
      </div>
      <div class="sensor-zone" id="sensorZone">
        👋 将手靠近此处 · 模拟红外感应自动开盖
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title">灯光控制</div>
    <div class="controls">
      <button class="btn" id="btnRead" onclick="setLight('read')">
        <span>📖 读写模式</span>
        <span class="tag">暖光 4000K</span>
      </button>
      <button class="btn" id="btnPlay" onclick="setLight('play')">
        <span>🎮 娱乐模式</span>
        <span class="tag">冷光 5500K</span>
      </button>
      <button class="btn" id="btnOff" onclick="setLight('off')">
        <span>🌙 关闭灯光</span>
        <span class="tag">节能</span>
      </button>
      <div class="toggle-row">
        <span>感应开灯（手靠近自动亮）</span>
        <div class="switch on" id="autoLightSwitch" onclick="toggleAutoLight()"></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title">感应与收纳</div>
    <div class="controls">
      <div class="toggle-row">
        <span>红外感应自动开盖</span>
        <div class="switch on" id="autoOpenSwitch" onclick="toggleAutoOpen()"></div>
      </div>
      <button class="btn" onclick="openAll()">📂 全部打开</button>
      <button class="btn" onclick="closeAll()">📁 全部关闭</button>
    </div>
    <div class="stats" style="margin-top:1rem">
      <div class="stat">
        <div class="val" id="openCount">0</div>
        <div class="key">已开格数</div>
      </div>
      <div class="stat">
        <div class="val" id="useCount">0</div>
        <div class="key">今日取用次数</div>
      </div>
    </div>
  </section>

  <section class="panel" style="grid-column:1/-1">
    <div class="panel-title">交互日志</div>
    <div class="log" id="log"></div>
  </section>

</main>

<footer>智护桌面智能感应收纳盒 · 硬件交互 Demo · 仅供演示</footer>

<script>
  let lightMode = 'off';
  let autoOpen = true;
  let autoLight = true;
  let useCount = 0;
  let openCompartments = new Set();

  const sensorZone = document.getElementById('sensorZone');
  const sensorDot = document.getElementById('sensorDot');
  const ledBar = document.getElementById('ledBar');
  const ledLabel = document.getElementById('ledLabel');
  const logEl = document.getElementById('log');

  function now() {
    return new Date().toLocaleTimeString('zh-CN', { hour12: false });
  }

  function addLog(msg) {
    const div = document.createElement('div');
    div.innerHTML = `<span class="time">${now()}</span>${msg}`;
    logEl.prepend(div);
    if (logEl.children.length > 20) logEl.lastChild.remove();
  }

  function updateStats() {
    document.getElementById('openCount').textContent = openCompartments.size;
    document.getElementById('useCount').textContent = useCount;
  }

  function setCompartmentOpen(id, open, reason) {
    const el = document.querySelector(`.compartment[data-id="${id}"]`);
    const name = el.dataset.name;
    const statusEl = el.querySelector('.status');

    if (open) {
      el.classList.add('open');
      statusEl.textContent = '已打开';
      if (!openCompartments.has(id)) {
        openCompartments.add(id);
        useCount++;
        addLog(`[${name}区] ${reason || '手动打开'}`);
      }
    } else {
      el.classList.remove('open');
      statusEl.textContent = '关闭';
      openCompartments.delete(id);
      addLog(`[${name}区] 已关闭`);
    }
    updateStats();
  }

  function openNearest() {
    if (!autoOpen) return;
    const ids = [0, 1, 2];
    const target = ids[Math.floor(Math.random() * ids.length)];
    setCompartmentOpen(target, true, '红外感应 · 自动开盖');
    if (autoLight && lightMode === 'off') setLight('read');
    setTimeout(() => setCompartmentOpen(target, false), 4000);
  }

  sensorZone.addEventListener('mouseenter', () => {
    sensorZone.classList.add('near');
    sensorDot.classList.add('active');
    addLog('红外传感器：检测到手部靠近');
    openNearest();
  });

  sensorZone.addEventListener('mouseleave', () => {
    sensorZone.classList.remove('near');
    sensorDot.classList.remove('active');
  });

  document.querySelectorAll('.compartment').forEach(el => {
    el.addEventListener('click', () => {
      const id = +el.dataset.id;
      const isOpen = el.classList.contains('open');
      setCompartmentOpen(id, !isOpen, isOpen ? null : '手动点击');
    });
  });

  function setLight(mode) {
    lightMode = mode;
    ledBar.className = 'led-bar';
    document.querySelectorAll('.controls .btn').forEach(b => b.classList.remove('active'));

    if (mode === 'read') {
      ledBar.classList.add('on-read');
      ledLabel.textContent = '读写';
      document.getElementById('btnRead').classList.add('active');
      addLog('护眼灯：读写模式（暖光 4000K）');
    } else if (mode === 'play') {
      ledBar.classList.add('on-play');
      ledLabel.textContent = '娱乐';
      document.getElementById('btnPlay').classList.add('active');
      addLog('护眼灯：娱乐模式（冷光 5500K）');
    } else {
      ledLabel.textContent = '灯关';
      document.getElementById('btnOff').classList.add('active');
      addLog('护眼灯：已关闭');
    }
  }

  function toggleAutoOpen() {
    autoOpen = !autoOpen;
    document.getElementById('autoOpenSwitch').classList.toggle('on', autoOpen);
    addLog(`红外自动开盖：${autoOpen ? '已开启' : '已关闭'}`);
  }

  function toggleAutoLight() {
    autoLight = !autoLight;
    document.getElementById('autoLightSwitch').classList.toggle('on', autoLight);
    addLog(`感应开灯：${autoLight ? '已开启' : '已关闭'}`);
  }

  function openAll() {
    [0, 1, 2].forEach(id => setCompartmentOpen(id, true, '批量打开'));
  }

  function closeAll() {
    [0, 1, 2].forEach(id => setCompartmentOpen(id, false));
  }

  addLog('系统就绪 · 智护桌面收纳盒已连接');
  setLight('off');
</script>

</body>
</html>
