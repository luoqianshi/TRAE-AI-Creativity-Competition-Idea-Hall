<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>旧物快查</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #333333;
      --text-secondary: #6c757d;
      --accent: #4a7c59;
      --accent-light: #6a9c7d;
      --warn: #e67e22;
      --border: #e9ecef;
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
      --radius: 12px;
      --transition: all 0.2s ease;
    }

    .dark-theme {
      --bg: #1e293b;
      --card-bg: #334155;
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent: #60a5fa;
      --accent-light: #93c5fd;
      --warn: #fbbf24;
      --border: #475569;
      --shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 16px;
      transition: var(--transition);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
      padding-top: 12px;
    }

    h1 {
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 500px;
      margin: 0 auto;
    }

    .input-section {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    input {
      flex: 1;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--card-bg);
      color: var(--text);
      outline: none;
      transition: var(--transition);
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.15);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:hover:not(:disabled) {
      background: var(--accent-light);
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .quick-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .tag {
      background: rgba(74, 124, 89, 0.1);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid rgba(74, 124, 89, 0.2);
    }

    .tag:hover:not(.active) {
      background: rgba(74, 124, 89, 0.2);
    }

    .tag.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .results {
      margin-top: 24px;
    }

    .result-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      animation: fadeInUp 0.3s ease-out;
      border-left: 4px solid var(--accent);
      display: none;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .icon.yes { color: var(--accent); }
    .icon.no { color: #e53e3e; }
    .icon.warn { color: var(--warn); }

    .result-title {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .result-body {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .result-footer {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--text-secondary);
      padding-top: 12px;
      border-top: 1px dashed var(--border);
    }

    .theme-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 100;
      transition: var(--transition);
      font-size: 1.2rem;
    }

    .theme-toggle:hover {
      transform: scale(1.05);
      background: var(--accent-light);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
      font-size: 1rem;
    }

    .empty-state p {
      margin-top: 12px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .input-group {
        flex-direction: column;
      }
      h1 {
        font-size: 1.5rem;
      }
      .subtitle {
        font-size: 0.95rem;
      }
      .quick-tags {
        justify-content: center;
      }
      .result-footer {
        flex-direction: column;
        gap: 6px;
        text-align: center;
      }
      body {
        padding: 12px;
      }
    }

    /* Print & accessibility */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>旧物快查</h1>
      <p class="subtitle">输入旧物名称，秒查附近收不收、值多少、走多远</p>
    </header>

    <section class="input-section">
      <div class="input-group">
        <input type="text" id="queryInput" placeholder="例如：旧电饭锅、泡沫箱、废铜线..." autocomplete="off" />
        <button id="searchBtn">查一查</button>
      </div>
      <div class="quick-tags">
        <div class="tag" data-value="纸类">纸类</div>
        <div class="tag" data-value="塑料">塑料</div>
        <div class="tag" data-value="金属">金属</div>
        <div class="tag" data-value="家电">家电</div>
        <div class="tag" data-value="书籍">书籍</div>
      </div>
    </section>

    <section class="results" id="resultsContainer">
      <div class="empty-state" id="emptyState">
        <div>🔍</div>
        <p>输入旧物名称，马上获取回收信息</p>
      </div>

      <div class="result-card" id="result1">
        <div class="result-header">
          <div class="icon yes">✓</div>
          <div class="result-title">收！支持上门</div>
        </div>
        <div class="result-body">
          小区南门「惠民再生资源站」今日收旧电饭锅（需拆掉内胆），估价 ¥8–¥12。
        </div>
        <div class="result-footer">
          <span>距您约 320 米</span>
          <span>步行约 4 分钟</span>
        </div>
      </div>

      <div class="result-card" id="result2">
        <div class="result-header">
          <div class="icon warn">⚠</div>
          <div class="result-title">部分回收</div>
        </div>
        <div class="result-body">
          「朝阳路绿色小屋」收泡沫箱（需压扁、无油污），不收发泡胶或带金属配件的包装箱。
        </div>
        <div class="result-footer">
          <span>距您约 580 米</span>
          <span>步行约 7 分钟</span>
        </div>
      </div>

      <div class="result-card" id="result3">
        <div class="result-header">
          <div class="icon no">✗</div>
          <div class="result-title">暂不回收</div>
        </div>
        <div class="result-body">
          「光明街废品收购点」目前暂停回收旧教辅书（因纸张含胶率高，分拣成本高），建议联系社区图书漂流角。
        </div>
        <div class="result-footer">
          <span>距您约 1.2 公里</span>
          <span>步行约 15 分钟</span>
        </div>
      </div>
    </section>
  </div>

  <button class="theme-toggle" id="themeToggle">☀</button>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;
    const isDark = localStorage.getItem('theme') === 'dark';
    if (isDark) {
      body.classList.add('dark-theme');
      themeToggle.textContent = '🌙';
    }

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-theme');
      if (body.classList.contains('dark-theme')) {
        localStorage.setItem('theme', 'dark');
        themeToggle.textContent = '🌙';
      } else {
        localStorage.setItem('theme', 'light');
        themeToggle.textContent = '☀';
      }
    });

    // 快捷标签点击
    const tags = document.querySelectorAll('.tag');
    tags.forEach(tag => {
      tag.addEventListener('click', () => {
        tags.forEach(t => t.classList.remove('active'));
        tag.classList.add('active');
        const value = tag.getAttribute('data-value');
        document.getElementById('queryInput').value = `旧${value}`;
        document.getElementById('searchBtn').click();
      });
    });

    // 模拟查询逻辑
    const searchBtn = document.getElementById('searchBtn');
    const queryInput = document.getElementById('queryInput');
    const resultsContainer = document.getElementById('resultsContainer');
    const emptyState = document.getElementById('emptyState');
    const resultCards = [
      document.getElementById('result1'),
      document.getElementById('result2'),
      document.getElementById('result3')
    ];

    function showResults() {
      const query = queryInput.value.trim();
      if (!query) return;

      // 隐藏空状态，显示结果卡
      emptyState.style.display = 'none';
      resultCards.forEach(card => card.style.display = 'block');

      // 简单关键词匹配（模拟AI理解）
      const lowerQuery = query.toLowerCase();
      let hasMetal = /铜|铝|铁|金属/.test(lowerQuery);
      let hasAppliance = /空调|冰箱|洗衣机|电视|电脑|打印机|电饭锅/.test(lowerQuery);
      let hasBook = /书|教辅|课本|练习册/.test(lowerQuery);
      let hasFoam = /泡沫|泡沫箱|发泡胶/.test(lowerQuery);

      // 动态更新结果内容（简化版）
      if (hasMetal) {
        resultCards[0].querySelector('.result-title').textContent = '收！价格浮动';
        resultCards[0].querySelector('.result-body').textContent = 
          '「便民再生点」收废铜（≥95%纯度），今日参考价 ¥38–¥42/公斤，需称重结算。';
        resultCards[0].querySelector('.result-footer span:first-child').textContent = '距您约 210 米';
        resultCards[0].querySelector('.result-footer span:last-child').textContent = '步行约 3 分钟';
        resultCards[0].querySelector('.icon').className = 'icon yes';

        resultCards[1].querySelector('.result-title').textContent = '上门可选';
        resultCards[1].querySelector('.result-body').textContent = 
          '「老张回收」提供铜线/铜管上门收，满 ¥200 免费，低于则收 ¥10 交通费。';
        resultCards[1].querySelector('.result-footer span:first-child').textContent = '距您约 750 米';
        resultCards[1].querySelector('.result-footer span:last-child').textContent = '预约后 2 小时内上门';
        resultCards[1].querySelector('.icon').className = 'icon warn';

        resultCards[2].querySelector('.result-title').textContent = '暂不回收';
        resultCards[2].querySelector('.result-body').textContent = 
          '「东门废品站」本周暂停回收镀锡铜线（因熔炼炉检修），建议下周再询。';
        resultCards[2].querySelector('.result-footer span:first-child').textContent = '距您约 900 米';
        resultCards[2].querySelector('.result-footer span:last-child').textContent = '预计恢复：6月10日';
        resultCards[2].querySelector('.icon').className = 'icon no';
      } else if (hasAppliance) {
        resultCards[0].querySelector('.result-title').textContent = '收！需预约';
        resultCards[0].querySelector('.result-body').textContent = 
          '「慧回收」收旧家电（含空调/冰箱），免费上门拆机搬运，估价 ¥150–¥300（视品牌年限）。';
        resultCards[0].querySelector('.result-footer span:first-child').textContent = '距您约 400 米';
        resultCards[0].querySelector('.result-footer span:last-child').textContent = '最快明日上门';
        resultCards[0].querySelector('.icon').className = 'icon yes';

        resultCards[1].querySelector('.result-title').textContent = '仅收整机';
        resultCards[1].querySelector('.result-body').textContent = 
          '「社区旧物驿站」只收完整旧家电（不可缺配件），不收单独压缩机或电路板。';
        resultCards[1].querySelector('.result-footer span:first-child').textContent = '距您约 380 米';
        resultCards[1].querySelector('.result-footer span:last-child').textContent = '步行约 5 分钟';
        resultCards[1].querySelector('.icon').className = 'icon warn';

        resultCards[2].querySelector('.result-title').textContent = '不收二手';
        resultCards[2].querySelector('.result-body').textContent = 
          '「西街五金店」只收全新未拆封电器，旧家电请勿送至该点。';
        resultCards[2].querySelector('.result-footer span:first-child').textContent = '距您约 1.1 公里';
        resultCards[2].querySelector('.result-footer span:last-child').textContent = '步行约 14 分钟';
        resultCards[2].querySelector('.icon').className = 'icon no';
      } else if (hasFoam) {
        resultCards[0].querySelector('.result-title').textContent = '收！要求严';
        resultCards[0].querySelector('.result-body').textContent = 
          '「绿源打包站」收干净压扁泡沫箱（无胶带/油渍），按体积计价 ¥0.8–¥1.2/箱。';
        resultCards[0].querySelector('.result-footer span:first-child').textContent = '距您约 320 米';
        resultCards[0].querySelector('.result-footer span:last-child').textContent = '步行约 4 分钟';
        resultCards[0].querySelector('.icon').className = 'icon yes';

        resultCards[1].querySelector('.result-title').textContent = '不收发泡胶';
        resultCards[1].querySelector('.result-body').textContent = 
          '「朝阳路绿色小屋」仅收EPS泡沫（白色颗粒状），不收XPS（蓝/粉硬质板）及带金属支架的包装。';
        resultCards[1].querySelector('.result-footer span:first-child').textContent = '距您约 580 米';
        resultCards[1].querySelector('.result-footer span:last-child').textContent = '步行约 7 分钟';
        resultCards[1].querySelector('.icon').className = 'icon warn';

        resultCards[2].querySelector('.result-title').textContent = '临时停收';
        resultCards[2].querySelector('.result-body').textContent = 
          '「幸福里回收角」本月起暂停泡沫类回收（因分拣设备升级），预计7月1日恢复。';
        resultCards[2].querySelector('.result-footer span:first-child').textContent = '距您约 180 米';
        resultCards[2].querySelector('.result-footer span:last-child').textContent = '步行约 2 分钟';
        resultCards[2].querySelector('.icon').className = 'icon no';
      } else if (hasBook) {
        resultCards[0].querySelector('.result-title').textContent = '收！优先教辅';
        resultCards[0].querySelector('.result-body').textContent = 
          '「爱心书屋」专收中小学教辅、练习册（无涂画/撕页），按斤计价 ¥1.2–¥1.8，所得捐助学童。';
        resultCards[0].querySelector('.result-footer span:first-child').textContent = '距您约 150 米';
        resultCards[0].querySelector('.result-footer span:last-child').textContent = '步行约 2 分钟';
        resultCards[0].querySelector('.icon').className = 'icon yes';

        resultCards[1].querySelector('.result-title').textContent = '仅收成套';
        resultCards[1].querySelector('.result-body').textContent = 
          '「文汇旧书店」收成套教材（如小学语文1–12册），单本不收，需无破损。';
        resultCards[1].querySelector('.result-footer span:first-child').textContent = '距您约 620 米';
        resultCards[1].querySelector('.result-footer span:last-child').textContent = '步行约 8 分钟';
        resultCards[1].querySelector('.icon').className = 'icon warn';

        resultCards[2].querySelector('.result-title').textContent = '不收盗版';
        resultCards[2].querySelector('.result-body').textContent = 
          '「博雅二手书摊」拒收影印版、盗版教辅，发现将登记备案，请确保来源合法。';
        resultCards[2].querySelector('.result-footer span:first-child').textContent = '距您约 850 米';
        resultCards[2].querySelector('.result-footer span:last-child').textContent = '步行约 11 分钟';
        resultCards[2].querySelector('.icon').className = 'icon no';
      } else {
        // 默认示例
        resultCards.forEach((card, i) => {
          card.querySelector('.result-title').textContent = 
            i === 0 ? '收！支持上门' : i === 1 ? '部分回收' : '暂不回收';
          card.querySelector('.result-body').textContent = 
            i === 0 
              ? `「惠民再生资源站」今日收${query}（需清洁干燥），估价 ¥5–¥15。` 
              : i === 1 
                ? `「朝阳路绿色小屋」收${query}（需去除附件），不收污染/混杂款。` 
                : `「光明街废品收购点」目前暂停回收${query}，建议联系社区图书漂流角。`;
          card.querySelector('.icon').className = 
            i === 0 ? 'icon yes' : i === 1 ? 'icon warn' : 'icon no';
        });
      }
    }

    searchBtn.addEventListener('click', showResults);
    queryInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') showResults();
    });

    // 初始化：默认显示空状态
    emptyState.style.display = 'block';
    resultCards.forEach(card => card.style.display = 'none');
  </script>
</body>
</html>
