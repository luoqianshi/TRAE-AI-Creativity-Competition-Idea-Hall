<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回声 - AI家族口述史采访工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', 'Source Han Serif CN', 'Songti SC', serif;
            background: linear-gradient(135deg, #f5f0e6 0%, #e8dfd0 50%, #f5f0e6 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid rgba(139, 119, 101, 0.2);
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
        }

        header h1 {
            font-size: 2rem;
            color: #5c4a3d;
            font-weight: 600;
            letter-spacing: 0.3em;
        }

        header p {
            font-size: 0.9rem;
            color: #8b7765;
            margin-top: 8px;
            letter-spacing: 0.1em;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: row;
        }

        .chat-panel {
            flex: 0 0 60%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(139, 119, 101, 0.15);
            background: rgba(255, 255, 255, 0.3);
        }

        .memory-panel {
            flex: 0 0 40%;
            display: flex;
            flex-direction: column;
            background: rgba(245, 240, 230, 0.6);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(139, 119, 101, 0.1);
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(139, 119, 101, 0.3);
            border-radius: 3px;
        }

        .message {
            max-width: 80%;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-ai {
            align-self: flex-start;
        }

        .message-user {
            align-self: flex-end;
        }

        .message-bubble {
            padding: 16px 22px;
            border-radius: 20px;
            position: relative;
            line-height: 1.7;
            font-size: 1rem;
        }

        .message-ai .message-bubble {
            background: linear-gradient(145deg, #fff9f0 0%, #f5ede3 100%);
            border: 1px solid rgba(139, 119, 101, 0.15);
            color: #5c4a3d;
            border-radius: 20px 20px 20px 6px;
            box-shadow: 2px 2px 8px rgba(139, 119, 101, 0.08);
        }

        .message-user .message-bubble {
            background: linear-gradient(145deg, #8b7765 0%, #6b5a4a 100%);
            color: #fff9f0;
            border-radius: 20px 20px 6px 20px;
            box-shadow: 2px 2px 8px rgba(139, 119, 101, 0.15);
        }

        .message-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            margin-bottom: 8px;
            background: linear-gradient(145deg, #d4c4b0 0%, #b8a898 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #5c4a3d;
            box-shadow: 0 2px 8px rgba(139, 119, 101, 0.1);
        }

        .message-user .message-avatar {
            background: linear-gradient(145deg, #8b7765 0%, #6b5a4a 100%);
            color: #fff9f0;
            margin-left: auto;
        }

        .message-name {
            font-size: 0.8rem;
            color: #8b7765;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .message-user .message-name {
            text-align: right;
        }

        .chat-input-area {
            padding: 20px;
            background: rgba(255, 255, 255, 0.6);
            border-top: 1px solid rgba(139, 119, 101, 0.15);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
            padding: 14px 20px;
            border: 1px solid rgba(139, 119, 101, 0.25);
            border-radius: 30px;
            font-family: inherit;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.8);
            color: #5c4a3d;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            border-color: rgba(139, 119, 101, 0.5);
            box-shadow: 0 0 0 3px rgba(139, 119, 101, 0.1);
        }

        .chat-input::placeholder {
            color: #a89888;
        }

        .btn-send, .btn-end {
            padding: 14px 24px;
            border: none;
            border-radius: 30px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-send {
            background: linear-gradient(145deg, #8b7765 0%, #6b5a4a 100%);
            color: #fff9f0;
            box-shadow: 0 2px 8px rgba(139, 119, 101, 0.2);
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 119, 101, 0.3);
        }

        .btn-end {
            background: rgba(200, 100, 100, 0.15);
            color: #c86464;
            border: 1px solid rgba(200, 100, 100, 0.3);
            margin-left: auto;
        }

        .btn-end:hover {
            background: rgba(200, 100, 100, 0.25);
        }

        .memory-panel-header {
            padding: 20px;
            background: rgba(139, 119, 101, 0.08);
            border-bottom: 1px solid rgba(139, 119, 101, 0.15);
        }

        .memory-panel-title {
            font-size: 1.1rem;
            color: #5c4a3d;
            font-weight: 600;
            letter-spacing: 0.15em;
        }

        .memory-tabs {
            display: flex;
            margin-top: 16px;
            gap: 8px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 20px;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            background: transparent;
            color: #8b7765;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(145deg, #8b7765 0%, #6b5a4a 100%);
            color: #fff9f0;
        }

        .memory-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .memory-content::-webkit-scrollbar {
            width: 4px;
        }

        .memory-content::-webkit-scrollbar-track {
            background: rgba(139, 119, 101, 0.05);
        }

        .memory-content::-webkit-scrollbar-thumb {
            background: rgba(139, 119, 101, 0.2);
            border-radius: 2px;
        }

        .timeline {
            position: relative;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 19px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, rgba(139, 119, 101, 0.3) 0%, rgba(139, 119, 101, 0.1) 100%);
        }

        .timeline-item {
            position: relative;
            padding-left: 50px;
            margin-bottom: 24px;
            animation: fadeInLeft 0.4s ease-out;
        }

        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .timeline-dot {
            position: absolute;
            left: 0;
            top: 4px;
            width: 40px;
            height: 40px;
            background: linear-gradient(145deg, #fff9f0 0%, #f5ede3 100%);
            border: 2px solid #8b7765;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: #5c4a3d;
            box-shadow: 0 2px 6px rgba(139, 119, 101, 0.15);
        }

        .timeline-date {
            font-size: 0.9rem;
            font-weight: 600;
            color: #5c4a3d;
            margin-bottom: 6px;
        }

        .timeline-summary {
            font-size: 0.9rem;
            color: #7a6a5a;
            line-height: 1.6;
            background: rgba(255, 255, 255, 0.6);
            padding: 12px 16px;
            border-radius: 12px;
            border-left: 3px solid #8b7765;
        }

        .relationship-graph {
            position: relative;
            min-height: 300px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            padding: 20px;
        }

        .graph-node {
            position: absolute;
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, #fff9f0 0%, #f5ede3 100%);
            border: 2px solid #8b7765;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(139, 119, 101, 0.15);
        }

        .graph-node:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(139, 119, 101, 0.25);
        }

        .graph-node.primary {
            background: linear-gradient(145deg, #8b7765 0%, #6b5a4a 100%);
            border-color: #5c4a3d;
        }

        .graph-node.primary .node-label {
            color: #fff9f0;
        }

        .node-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: #5c4a3d;
            text-align: center;
            padding: 4px;
        }

        .node-relation {
            font-size: 0.65rem;
            color: #8b7765;
            background: rgba(255, 255, 255, 0.8);
            padding: 2px 6px;
            border-radius: 8px;
            margin-top: 2px;
        }

        .graph-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, #8b7765 0%, rgba(139, 119, 101, 0.3) 100%);
            transform-origin: left center;
        }

        .story-draft {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            padding: 20px;
            line-height: 1.8;
            color: #5c4a3d;
            font-size: 0.95rem;
            text-align: justify;
        }

        .story-draft::first-letter {
            font-size: 2.5rem;
            font-weight: 600;
            color: #8b7765;
            float: left;
            line-height: 1;
            margin-right: 8px;
            margin-top: 4px;
        }

        .story-paragraph {
            margin-bottom: 16px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: linear-gradient(145deg, #fff9f0 0%, #f5f0e6 100%);
            padding: 40px 50px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(139, 119, 101, 0.3);
            max-width: 450px;
            animation: scaleIn 0.3s ease;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, #8b7765 0%, #6b5a4a 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 2.5rem;
            color: #fff9f0;
        }

        .modal-title {
            font-size: 1.4rem;
            color: #5c4a3d;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .modal-text {
            font-size: 1rem;
            color: #7a6a5a;
            line-height: 1.7;
            margin-bottom: 24px;
        }

        .btn-confirm {
            padding: 12px 40px;
            background: linear-gradient(145deg, #8b7765 0%, #6b5a4a 100%);
            color: #fff9f0;
            border: none;
            border-radius: 30px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 119, 101, 0.3);
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }

            .chat-panel, .memory-panel {
                flex: none;
                width: 100%;
                border-right: none;
                border-bottom: 1px solid rgba(139, 119, 101, 0.15);
            }

            .chat-messages {
                padding: 20px;
                gap: 20px;
            }

            .message {
                max-width: 95%;
            }

            header h1 {
                font-size: 1.5rem;
            }

            .modal-content {
                margin: 20px;
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>回声</h1>
            <p>AI家族口述史采访工具</p>
        </header>

        <div class="main-content">
            <div class="chat-panel">
                <div class="chat-messages" id="chatMessages">
                    <div class="message message-ai">
                        <div class="message-avatar">AI</div>
                        <div class="message-name">记忆记者</div>
                        <div class="message-bubble">奶奶，听说您年轻时在东北待过，能和我讲讲那段日子吗？</div>
                    </div>
                </div>
                <div class="chat-input-area">
                    <div class="input-wrapper">
                        <input type="text" class="chat-input" id="chatInput" placeholder="请输入您的回忆...">
                        <button class="btn-send" id="sendBtn">发送</button>
                    </div>
                    <button class="btn-end" id="endBtn">结束本次回忆</button>
                </div>
            </div>

            <div class="memory-panel">
                <div class="memory-panel-header">
                    <div class="memory-panel-title">记忆织网</div>
                    <div class="memory-tabs">
                        <button class="tab-btn active" data-tab="timeline">时间线</button>
                        <button class="tab-btn" data-tab="relationship">人物关系</button>
                        <button class="tab-btn" data-tab="story">故事草稿</button>
                    </div>
                </div>
                <div class="memory-content">
                    <div id="tabContent">
                        <div id="timelineTab" class="timeline">
                            <div class="timeline-item">
                                <div class="timeline-dot">开始</div>
                                <div class="timeline-date">采访开始</div>
                                <div class="timeline-summary">准备开始记录家族记忆</div>
                            </div>
                        </div>
                        <div id="relationshipTab" class="relationship-graph" style="display: none;">
                            <div class="graph-node primary" style="top: 50%; left: 50%; transform: translate(-50%, -50%);">
                                <div class="node-label">我</div>
                            </div>
                        </div>
                        <div id="storyTab" class="story-draft" style="display: none;">
                            <div class="story-paragraph">故事即将开始...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="endModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-icon">📖</div>
            <div class="modal-title">回忆已收录</div>
            <div class="modal-text">这段回忆已被收录进《我们的家族之书》第 7 章。</div>
            <button class="btn-confirm" id="confirmBtn">确定</button>
        </div>
    </div>

    <script>
        const messages = [
            { keywords: ['1968', '冬天', '北大荒', '火车'], reply: '1968 年冬天……那年的雪是不是特别大？您当时穿得暖和吗？', timeline: { date: '1968年冬', summary: '抵达北大荒，极寒。' }, story: '1968 年深冬，我随着绿皮火车晃荡了数日，踏进北大荒那片白得发青的雪原，冷，冷得骨头都在发颤。' },
            { keywords: ['王建国', '战友'], reply: '王建国……能和我聊聊他是个怎样的人吗？', timeline: null, story: '在那片冰天雪地里，我认识了王建国——我最好的战友。我们一起在寒风中站岗，在炕头上分享仅有的干粮。', relation: { name: '王建国', relation: '战友' } },
            { keywords: ['上海', '几十年', '没见'], reply: '如果现在您能对他说一句话，您想说什么？', timeline: { date: '分别之后', summary: '王建国返回上海，从此失去联系。' }, story: '后来他回了上海，我们这一别就是几十年。岁月像雪地里的脚印，渐渐被时光覆盖，只留下心底那份沉甸甸的思念。' },
            { keywords: ['想家', '父母', '亲人'], reply: '想家的时候，您会做些什么来缓解这份思念呢？', timeline: null, story: '夜深人静时，思念就像潮水般涌来。我会望着窗外的雪花，想起远方的爹娘，想起家里那盏温暖的油灯。' },
            { keywords: ['苦', '累', '艰难'], reply: '那段日子一定很不容易吧？是什么支撑着您坚持下来的？', timeline: null, story: '日子确实苦，累得腰都直不起来。但心里总有个念想，想着总有一天能回到家乡，见到亲人。这份念想，就是支撑我走下去的力量。' }
        ];

        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const endBtn = document.getElementById('endBtn');
        const endModal = document.getElementById('endModal');
        const confirmBtn = document.getElementById('confirmBtn');
        const tabBtns = document.querySelectorAll('.tab-btn');

        let storyParagraphs = [];
        let relations = [];

        function addMessage(content, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'message-user' : 'message-ai'}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = isUser ? '👵' : 'AI';
            
            const name = document.createElement('div');
            name.className = 'message-name';
            name.textContent = isUser ? '奶奶' : '记忆记者';
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = content;
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(name);
            messageDiv.appendChild(bubble);
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function generateReply(userInput) {
            for (const msg of messages) {
                for (const keyword of msg.keywords) {
                    if (userInput.includes(keyword)) {
                        return msg;
                    }
                }
            }
            return { 
                reply: '听您这么说，那段时光一定很特别吧？能再和我多讲讲吗？',
                timeline: null,
                story: `那段日子，${userInput}，至今想来，依然历历在目。`,
                relation: null
            };
        }

        function updateTimeline(date, summary) {
            if (!date || !summary) return;
            
            const timeline = document.getElementById('timelineTab');
            const item = document.createElement('div');
            item.className = 'timeline-item';
            item.innerHTML = `
                <div class="timeline-dot">📅</div>
                <div class="timeline-date">${date}</div>
                <div class="timeline-summary">${summary}</div>
            `;
            timeline.appendChild(item);
        }

        function updateStory(text) {
            const storyTab = document.getElementById('storyTab');
            if (storyParagraphs.length === 0) {
                storyTab.innerHTML = '';
            }
            const paragraph = document.createElement('div');
            paragraph.className = 'story-paragraph';
            paragraph.textContent = text;
            storyTab.appendChild(paragraph);
            storyParagraphs.push(text);
        }

        function updateRelationship(name, relation) {
            if (!name || !relation) return;
            
            const existingRelation = relations.find(r => r.name === name);
            if (existingRelation) return;
            
            relations.push({ name, relation });
            
            const graph = document.getElementById('relationshipTab');
            const node = document.createElement('div');
            node.className = 'graph-node';
            
            const angle = (relations.length - 1) * (360 / Math.max(relations.length, 3)) * (Math.PI / 180);
            const radius = 100;
            const x = 50 + radius * Math.cos(angle) * 0.4;
            const y = 50 + radius * Math.sin(angle) * 0.4;
            
            node.style.left = `${x}%`;
            node.style.top = `${y}%`;
            node.style.transform = 'none';
            
            node.innerHTML = `
                <div class="node-label">${name}</div>
                <div class="node-relation">${relation}</div>
            `;
            graph.appendChild(node);
            
            const line = document.createElement('div');
            line.className = 'graph-line';
            
            const centerX = 50;
            const centerY = 50;
            const lineLength = Math.sqrt(Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2));
            const angleDeg = Math.atan2(y - centerY, x - centerX) * (180 / Math.PI);
            
            line.style.left = `${centerX}%`;
            line.style.top = `${centerY}%`;
            line.style.width = `${lineLength}%`;
            line.style.transform = `rotate(${angleDeg}deg)`;
            
            graph.appendChild(line);
        }

        sendBtn.addEventListener('click', () => {
            const input = chatInput.value.trim();
            if (!input) return;
            
            addMessage(input, true);
            chatInput.value = '';
            
            setTimeout(() => {
                const replyData = generateReply(input);
                addMessage(replyData.reply, false);
                
                if (replyData.timeline) {
                    updateTimeline(replyData.timeline.date, replyData.timeline.summary);
                }
                
                if (replyData.story) {
                    updateStory(replyData.story);
                }
                
                if (replyData.relation) {
                    updateRelationship(replyData.relation.name, replyData.relation.relation);
                }
            }, 1500);
        });

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });

        endBtn.addEventListener('click', () => {
            endModal.style.display = 'flex';
        });

        confirmBtn.addEventListener('click', () => {
            endModal.style.display = 'none';
        });

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const tabId = btn.dataset.tab;
                document.querySelectorAll('#tabContent > div').forEach(el => {
                    el.style.display = 'none';
                });
                
                if (tabId === 'timeline') {
                    document.getElementById('timelineTab').style.display = 'block';
                } else if (tabId === 'relationship') {
                    document.getElementById('relationshipTab').style.display = 'block';
                } else if (tabId === 'story') {
                    document.getElementById('storyTab').style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
