<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧座位表</title>
<style>
/* ============ Material Design Tokens ============ */
:root{
  --md-primary:#3F51B5;
  --md-primary-dark:#303F9F;
  --md-primary-light:#C5CAE9;
  --md-accent:#FF4081;
  --md-bg:#FAFAFA;
  --md-surface:#FFFFFF;
  --md-surface-2:#F1F3F4;
  --md-on-primary:#FFFFFF;
  --md-on-surface:#1F1F1F;
  --md-on-surface-variant:#5F6368;
  --md-outline:#DADCE0;
  --md-green:#2E7D32;
  --md-green-bg:#E8F5E9;
  --md-yellow:#FFF59D;
  --md-yellow-border:#FBC02D;
  --md-blue:#1A73E8;
  --md-blue-bg:#E8F0FE;
  --md-error:#D93025;
  --radius:8px;
  --radius-lg:16px;
  --elev-1:0 1px 2px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.08);
  --elev-2:0 2px 6px rgba(0,0,0,.15),0 1px 4px rgba(0,0,0,.10);
  --elev-3:0 8px 24px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.12);
  --font:'Roboto','Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--md-bg);
  color:var(--md-on-surface);
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

/* ============ App Bar ============ */
.appbar{
  height:64px;background:var(--md-primary);color:var(--md-on-primary);
  display:flex;align-items:center;padding:0 16px;gap:12px;
  box-shadow:var(--elev-2);position:relative;z-index:20;
}
.appbar .title{font-size:20px;font-weight:500;display:flex;align-items:center;gap:10px;flex:1;min-width:0;overflow:hidden}
.appbar .title span.txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .title svg{fill:currentColor;flex-shrink:0}
.appbar-actions{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;flex-shrink:0}

.md-btn{
  font-family:var(--font);font-size:14px;font-weight:500;
  border:none;background:transparent;color:var(--md-on-primary);
  height:40px;padding:0 14px;border-radius:var(--radius);cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;position:relative;overflow:hidden;
  transition:background .18s,box-shadow .18s,transform .08s;
  white-space:nowrap;
}
.md-btn svg{fill:currentColor;width:20px;height:20px;flex-shrink:0}
.md-btn:hover{background:rgba(255,255,255,.12)}
.md-btn:active{background:rgba(255,255,255,.20)}
.md-btn.btn-text{padding:0 10px}
.md-btn.btn-icon{padding:0;width:40px;justify-content:center}
.md-btn.btn-raised{background:var(--md-accent);box-shadow:var(--elev-1)}
.md-btn.btn-raised:hover{background:#F03578;box-shadow:var(--elev-2)}
.md-btn.btn-outlined{border:1px solid rgba(255,255,255,.5)}
.md-btn[disabled]{opacity:.38;cursor:not-allowed;pointer-events:none}
.md-btn.dark{color:var(--md-on-surface)}
.md-btn.dark:hover{background:rgba(60,64,67,.08)}
.md-btn.dark.btn-raised{background:var(--md-primary);color:#fff}
.md-btn.dark.btn-raised:hover{background:var(--md-primary-dark)}
.md-btn.accent-text{color:var(--md-accent)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rip .6s linear;pointer-events:none}
.md-btn.dark .ripple{background:rgba(60,64,67,.12)}
@keyframes rip{to{transform:scale(2.6);opacity:0}}

/* ============ Sub bar ============ */
.subbar{
  display:flex;align-items:center;gap:18px;padding:10px 20px;
  background:var(--md-surface);border-bottom:1px solid var(--md-outline);
  font-size:13px;color:var(--md-on-surface-variant);flex-wrap:wrap;
}
.subbar .chip{display:inline-flex;align-items:center;gap:6px;background:var(--md-surface-2);padding:5px 12px;border-radius:16px}
.subbar .chip b{color:var(--md-on-surface)}
.subbar .mode-tag{font-weight:600}
.subbar .mode-tag.preview{color:var(--md-blue)}
.subbar .mode-tag.edit{color:var(--md-accent)}
.subbar .spacer{flex:1}
.subbar .hint{color:var(--md-on-surface-variant);font-size:12px}

/* ============ Stage ============ */
.stage-wrap{flex:1;overflow:auto;padding:24px;display:flex;justify-content:center;align-items:flex-start}
.stage{position:relative;display:inline-block}
canvas{display:block;background:transparent;border-radius:6px}
#cellEditInput{
  position:absolute;display:none;
  border:2px solid var(--md-primary);border-radius:6px;
  text-align:center;font-family:var(--font);font-weight:600;
  background:#fff;color:var(--md-on-surface);outline:none;
  box-shadow:var(--elev-2);padding:4px;
}

/* ============ Legend ============ */
.legend{
  position:fixed;left:20px;bottom:20px;background:var(--md-surface);
  border-radius:var(--radius-lg);box-shadow:var(--elev-3);padding:14px 16px;
  z-index:15;max-width:260px;
}
.legend h4{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--md-on-surface);display:flex;align-items:center;gap:6px}
.legend h4 svg{width:16px;height:16px;fill:var(--md-primary)}
.legend .sample{
  position:relative;width:110px;height:62px;border:1.5px solid var(--md-outline);
  border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;
  margin-bottom:10px;
}
.legend .sample .cur{font-size:15px;font-weight:700;color:var(--md-on-surface)}
.legend .sample .prev{position:absolute;top:3px;right:6px;font-size:11px;color:var(--md-green);font-weight:600}
.legend .row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--md-on-surface-variant);margin-top:6px}
.legend .dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.legend .dot.y{background:var(--md-yellow);border:1px solid var(--md-yellow-border)}
.legend .dot.g{background:var(--md-green-bg);border:1px solid var(--md-green)}
.legend .dot.b{background:var(--md-on-surface)}
.legend .reset-link{margin-top:10px;font-size:11px;color:var(--md-blue);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.legend .reset-link:hover{text-decoration:underline}

/* ============ Modal ============ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{
  background:var(--md-surface);border-radius:var(--radius-lg);box-shadow:var(--elev-3);
  width:100%;max-width:560px;max-height:90vh;overflow:auto;position:relative;
  transform:translateY(20px) scale(.98);transition:transform .22s;
}
.modal-overlay.open .modal{transform:translateY(0) scale(1)}
.modal-head{padding:20px 48px 6px 24px;font-size:20px;font-weight:500;color:var(--md-on-surface);display:flex;align-items:center;gap:10px}
.modal-head svg{width:24px;height:24px;fill:var(--md-primary)}
.modal-close{position:absolute;top:12px;right:12px;width:36px;height:36px;border:none;background:transparent;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--md-on-surface-variant);transition:background .15s,color .15s}
.modal-close:hover{background:rgba(60,64,67,.10);color:var(--md-on-surface)}
.modal-close svg{width:20px;height:20px;fill:currentColor}
.modal-body{padding:8px 24px 20px}
.modal-foot{padding:12px 24px 20px;display:flex;justify-content:flex-end;gap:8px}
.modal-foot .md-btn.dark{color:var(--md-primary)}
.modal-foot .md-btn.dark.btn-raised{color:#fff}

/* ============ Form fields ============ */
.field{position:relative;margin-top:18px}
.field label{display:block;font-size:12px;color:var(--md-on-surface-variant);margin-bottom:6px;font-weight:500}
.field input[type=number],.field input[type=text]{
  width:100%;height:48px;padding:0 14px;border:1px solid var(--md-outline);border-radius:var(--radius);
  font-size:15px;font-family:var(--font);background:var(--md-surface-2);color:var(--md-on-surface);outline:none;
  transition:border-color .18s,background .18s;
}
.field input:focus{border-color:var(--md-primary);border-width:2px;padding:0 13px;background:#fff}
.field .err{color:var(--md-error);font-size:12px;margin-top:4px;min-height:14px}
.radios{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.radio-card{
  flex:1;min-width:140px;border:1.5px solid var(--md-outline);border-radius:var(--radius);
  padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;background:#fff;transition:all .15s;
}
.radio-card input{accent-color:var(--md-primary);width:18px;height:18px}
.radio-card .rt{font-size:14px;font-weight:500}
.radio-card .rd{font-size:11px;color:var(--md-on-surface-variant)}
.radio-card.checked{border-color:var(--md-primary);background:var(--md-blue-bg)}
.check-row{display:flex;align-items:center;gap:10px;margin-top:18px;padding:12px 14px;background:var(--md-surface-2);border-radius:var(--radius)}
.check-row input{accent-color:var(--md-primary);width:18px;height:18px}
.check-row label{font-size:14px;font-weight:500;cursor:pointer}
.cols-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:8px}
.col-field{position:relative}
.col-field input{width:100%;height:42px;padding:0 10px;border:1px solid var(--md-outline);border-radius:var(--radius);text-align:center;font-size:15px;font-family:var(--font);outline:none}
.col-field input:focus{border-color:var(--md-primary);border-width:2px;padding:0 9px}
.col-field .cl{font-size:11px;color:var(--md-on-surface-variant);text-align:center;margin-bottom:3px}
.section-title{font-size:13px;font-weight:600;color:var(--md-on-surface-variant);margin:18px 0 4px;text-transform:uppercase;letter-spacing:.4px}

/* ============ Snackbar ============ */
.snackbar{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);
  background:#323232;color:#fff;padding:12px 20px;border-radius:6px;font-size:14px;
  box-shadow:var(--elev-3);z-index:100;opacity:0;transition:transform .25s,opacity .25s;pointer-events:none;
}
.snackbar.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:980px){
  .md-btn .lbl{display:none}
  .md-btn{padding:0 10px}
  .md-btn.btn-icon{padding:0;width:40px}
}
@media(max-width:640px){
  .appbar .title span.txt{display:none}
  .legend{display:none}
  .appbar{padding:0 8px;gap:6px}
  .appbar-actions{gap:2px}
}
</style>
</head>
<body>

<div class="appbar">
  <div class="title">
    <span class="txt">智慧座位表</span>
  </div>
  <div class="appbar-actions" id="actionsPreview">
    <button class="md-btn btn-raised" id="btnArrange" title="编排座位"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg><span class="lbl">编排座位</span></button>
    <button class="md-btn btn-outlined" id="btnCount" title="学生数量"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg><span class="lbl">学生数量</span></button>
    <button class="md-btn btn-outlined" id="btnLayout" title="布局修改"><svg viewBox="0 0 24 24"><path d="M10 18h5v-6h-5v6zm-6 0h5V5H4v13zm12 0h5v-6h-5v6zM10 5v6h11V5H10z"/></svg><span class="lbl">布局修改</span></button>
    <button class="md-btn btn-outlined" id="btnExport" title="导出 PNG"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg><span class="lbl">导出</span></button>
  </div>
  <div class="appbar-actions" id="actionsEdit" style="display:none">
    <button class="md-btn btn-outlined" id="btnUndo" disabled title="撤回"><svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg><span class="lbl">撤回</span></button>
    <button class="md-btn btn-outlined" id="btnRedo" disabled title="重做"><svg viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg><span class="lbl">重做</span></button>
    <button class="md-btn btn-raised" id="btnSave" title="保存"><svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg><span class="lbl">保存</span></button>
    <button class="md-btn btn-outlined" id="btnCancel" title="取消"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg><span class="lbl">取消</span></button>
  </div>
</div>

<div class="subbar" id="subbar">
  <span class="chip">学生 <b id="infoStudents">0</b></span>
  <span class="chip">座位 <b id="infoSeats">0</b></span>
  <span class="chip">列数 <b id="infoCols">0</b></span>
  <span class="mode-tag preview" id="infoMode">预览模式</span>
  <div class="spacer"></div>
  <span class="hint" id="infoHint">点击学生姓名查看历史座位</span>
</div>

<div class="stage-wrap" id="stageWrap">
  <div class="stage" id="stage">
    <canvas id="canvas" width="800" height="500"></canvas>
    <input id="cellEditInput" type="text" maxlength="12" />
  </div>
</div>

<div class="legend" id="legend">
  <h4><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-6h2v6zm0-8h-2V7h2v4z"/></svg>图例说明</h4>
  <div class="sample">
    <span class="cur">现在学生</span>
    <span class="prev">以前学生</span>
  </div>
  <div class="row"><span class="dot b"></span>黑色大字 = 当前座位学生</div>
  <div class="row"><span class="dot g"></span>绿色小字 = 上次座位学生</div>
  <div class="row"><span class="dot y"></span>黄色 = 历史座位高亮</div>
  <span class="reset-link" id="resetLink"><svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>重置全部数据</span>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose" title="关闭" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
    <div class="modal-head" id="modalHead"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="snackbar" id="snackbar"></div>

<script>
(function(){
"use strict";
/* ================== State ================== */
const LS_KEY = 'smart-seat-chart-v1';
const state = {
  initialized:false,
  mode:'preview',          // 'preview' | 'edit'
  layout:{ podium:'top', columns:[], aisle:false },
  studentCount:0,
  roster:[],               // [{id,name}]
  currentSeating:{},       // cellKey -> studentId|null
  previousSeating:{},      // cellKey -> {id,name}|null
  highlight:null,          // {source, target}
  nextId:1,
  // edit session
  preEditSnapshot:null,
  history:{past:[],future:[]},
  editing:false, editCell:null, editStartName:null,
  // pointer
  hoverCell:null, dragging:null, dragOver:null
};

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const stageWrap = document.getElementById('stageWrap');
const editInput = document.getElementById('cellEditInput');
let metrics = null;
let dpr = window.devicePixelRatio||1;

/* ================== Helpers ================== */
const cellKey = (c,r)=>'c'+c+'_r'+r;
const getStudent = id => state.roster.find(s=>s.id===id);
const totalSeats = ()=>state.layout.columns.reduce((a,b)=>a+b,0);
const fillOrder = ()=>{
  const cols=state.layout.columns, n=cols.length;
  const maxR=Math.max(0,...cols);
  const rows=[];
  for(let r=0;r<maxR;r++) rows.push(r);
  if(state.layout.podium==='bottom') rows.reverse();
  const keys=[];
  for(const r of rows) for(let c=0;c<n;c++) if(r<cols[c]) keys.push(cellKey(c,r));
  return keys;
};
const assignedIds = ()=>{
  const s=new Set();
  for(const k in state.currentSeating){const v=state.currentSeating[k]; if(v) s.add(v);}
  return s;
};
function autoPlaceUnassigned(){
  const used=assignedIds();
  const unassigned=state.roster.filter(s=>!used.has(s.id)).sort((a,b)=>a.id-b.id);
  const empties=fillOrder().filter(k=>!state.currentSeating[k]);
  for(let i=0;i<unassigned.length && i<empties.length;i++) state.currentSeating[empties[i]]=unassigned[i].id;
}
// Evenly (re)distribute ALL students across the available seats, row by row.
// Wipes the current arrangement so every column is balanced automatically.
function evenDistribute(){
  state.currentSeating={};
  const order=fillOrder();
  const students=state.roster.slice().sort((a,b)=>a.id-b.id);
  for(let i=0;i<students.length && i<order.length;i++){
    state.currentSeating[order[i]]=students[i].id;
  }
}
function deepSnap(){return {roster:state.roster.map(s=>({...s})), seating:{...state.currentSeating}};}
function restoreSnap(s){state.roster=s.roster.map(s2=>({...s2})); state.currentSeating={...s.seating};}
function nameFromSnap(snap,id){const s=snap.roster.find(x=>x.id===id); return s?s.name:'';}

/* ================== Metrics ================== */
function computeMetrics(scale){
  const base={cellW:130,cellH:80,podiumH:46,colGap:10,aisleGap:46,pad:26};
  const cellW=base.cellW*scale, cellH=base.cellH*scale, podiumH=base.podiumH*scale;
  const colGap=base.colGap*scale, aisleGap=base.aisleGap*scale, pad=base.pad*scale;
  const cols=state.layout.columns, n=cols.length;
  const aisleSplit=Math.floor(n/2);
  const colX=[];
  let x=pad;
  for(let i=0;i<n;i++){
    if(i>0) x += (state.layout.aisle && i===aisleSplit? aisleGap : colGap);
    colX.push(x); x+=cellW;
  }
  const width = n? (colX[n-1]+cellW+pad) : (pad*2);
  const maxR = Math.max(0,...cols);
  const contentTop = pad + (state.layout.podium==='top'? podiumH+colGap : 0);
  const cellPos={};
  for(let c=0;c<n;c++) for(let r=0;r<cols[c];r++)
    cellPos[cellKey(c,r)]={x:colX[c], y:contentTop+r*cellH, w:cellW, h:cellH, col:c, row:r};
  const height = pad + maxR*cellH + colGap + podiumH + pad;
  const podium = state.layout.podium==='top'
    ? {x:pad,y:pad,w:width-2*pad,h:podiumH}
    : {x:pad,y:height-pad-podiumH,w:width-2*pad,h:podiumH};
  return {scale,cellW,cellH,podiumH,colGap,aisleGap,pad,colX,cellPos,width,height,podium,cols,n,aisleSplit,contentTop,maxR};
}
function getScale(){
  const m1=computeMetrics(1);
  const avail=Math.max(320, stageWrap.clientWidth-48);
  return Math.max(0.32, Math.min(1, avail/m1.width));
}

/* ================== Drawing ================== */
function fitCanvas(){
  metrics=computeMetrics(getScale());
  dpr=window.devicePixelRatio||1;
  canvas.style.width=metrics.width+'px';
  canvas.style.height=metrics.height+'px';
  canvas.width=Math.round(metrics.width*dpr);
  canvas.height=Math.round(metrics.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawName(text,x,y,maxW,fontSize,color,bold,align){
  ctx.fillStyle=color;
  ctx.font=(bold?'600 ':'')+fontSize+'px '+getComputedStyle(document.body).fontFamily;
  ctx.textAlign=align||'center';
  ctx.textBaseline='middle';
  let fs=fontSize, t=text;
  while(ctx.measureText(t).width>maxW && fs>9){fs-=1; ctx.font=(bold?'600 ':'')+fs+'px '+getComputedStyle(document.body).fontFamily;}
  if(ctx.measureText(t).width>maxW){ t=t.slice(0,Math.max(1,Math.floor(t.length*maxW/ctx.measureText(t).width)-1))+'…'; }
  ctx.fillText(t,x,y);
}
function drawCell(key,opts){
  const p=metrics.cellPos[key]; if(!p) return;
  const cur=state.currentSeating[key]||null;
  const prev=state.previousSeating[key]||null;
  const showPrev = prev && (!cur || prev.id!==cur);
  let fill='#ffffff', stroke='#DADCE0';
  // base
  if(opts.highlightTarget){ fill='#FFF59D'; stroke='#FBC02D'; }
  else if(opts.highlightSource){ fill='#E8F0FE'; stroke='#1A73E8'; }
  else if(opts.dragOver){ fill='#E3F2FD'; stroke='#1A73E8'; }
  else if(!cur){ fill='#F1F3F4'; stroke='#E0E0E0'; }
  roundRect(p.x,p.y,p.w,p.h,8);
  ctx.fillStyle=fill; ctx.fill();
  ctx.lineWidth=opts.highlightTarget||opts.highlightSource?2.4:1.2;
  ctx.strokeStyle=stroke;
  ctx.setLineDash(!cur && !opts.highlightTarget? [4,3]:[]);
  ctx.stroke(); ctx.setLineDash([]);
  // current name (skip if this cell is being edited & input shown)
  const hideCur = state.editing && state.editCell===key;
  if(cur && !hideCur){
    const s=getStudent(cur);
    drawName(s?s.name:'？', p.x+p.w/2, p.y+p.h/2+2, p.w-14, 16, '#1F1F1F', true);
  }
  // previous name top-right
  if(showPrev){
    drawName(prev.name, p.x+p.w-7, p.y+12, p.w*0.55, 11, '#2E7D32', true,'right');
  }
  // source outline marker
  if(opts.highlightSource){
    ctx.lineWidth=2.4; ctx.strokeStyle='#1A73E8'; roundRect(p.x,p.y,p.w,p.h,8); ctx.stroke();
  }
}
function drawPodium(){
  const p=metrics.podium;
  roundRect(p.x,p.y,p.w,p.h,8);
  ctx.fillStyle='#E8EAF6'; ctx.fill();
  ctx.lineWidth=1.4; ctx.strokeStyle='#C5CAE9'; ctx.stroke();
  ctx.fillStyle='#3F51B5'; ctx.font='600 15px '+getComputedStyle(document.body).fontFamily;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('讲 台', p.x+p.w/2, p.y+p.h/2);
}
function drawScene(opts){
  ctx.clearRect(0,0,metrics.width,metrics.height);
  drawPodium();
  for(const key in metrics.cellPos){
    drawCell(key,{
      highlightTarget: state.highlight && state.highlight.target===key,
      highlightSource: state.highlight && state.highlight.source===key,
      dragOver: state.dragging && state.dragOver===key && state.dragging!==key
    });
  }
  // drag ghost
  if(state.dragging && opts.showDragGhost){
    const id=state.currentSeating[state.dragging];
    const s=id?getStudent(id):null;
    if(s){
      ctx.fillStyle='rgba(26,115,232,.92)';
      roundRect(state._mouseX+8,state._mouseY+8,Math.max(70,ctx.measureText(s.name).width+24),28,6);
      ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='600 13px '+getComputedStyle(document.body).fontFamily;
      ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillText(s.name,state._mouseX+18,state._mouseY+22);
    }
  }
}
function redraw(){
  if(!metrics) return;
  drawScene({showDragGhost:true});
}

/* ================== Hit testing ================== */
function getCellAt(x,y){
  for(const key in metrics.cellPos){
    const p=metrics.cellPos[key];
    if(x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h){
      const prev=state.previousSeating[key];
      const cur=state.currentSeating[key];
      const showPrev = prev && (!cur || prev.id!==cur);
      let region=null;
      if(showPrev && x>=p.x+p.w*0.45 && y<=p.y+p.h*0.42) region='prev';
      else if(cur) region='curr';
      return {key,region,p};
    }
  }
  return null;
}
function canvasPos(e){
  const r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}

/* ================== Preview interactions ================== */
function handlePreviewClick(cell){
  if(!cell){ state.highlight=null; redraw(); return; }
  if(cell.region==='prev'){
    const prev=state.previousSeating[cell.key];
    let target=null;
    for(const k in state.currentSeating) if(state.currentSeating[k]===prev.id){ target=k; break; }
    if(target){ state.highlight={source:cell.key,target}; toast('已定位到「'+prev.name+'」的当前座位'); }
    else { state.highlight={source:cell.key,target:null}; toast('该学生当前未入座'); }
  } else if(cell.region==='curr'){
    const sid=state.currentSeating[cell.key];
    let target=null;
    for(const k in state.previousSeating) if(state.previousSeating[k] && state.previousSeating[k].id===sid){ target=k; break; }
    if(target){ state.highlight={source:cell.key,target}; toast('已定位到该学生的上次座位'); }
    else { state.highlight={source:cell.key,target:null}; toast('该学生暂无历史记录'); }
  } else {
    state.highlight=null;
  }
  redraw();
}

/* ================== Edit interactions ================== */
function pushHistory(){ state.history.past.push(deepSnap()); state.history.future=[]; updateEditButtons(); }
function updateEditButtons(){
  document.getElementById('btnUndo').disabled = state.history.past.length===0;
  document.getElementById('btnRedo').disabled = state.history.future.length===0;
}
function startEdit(key){
  const id=state.currentSeating[key];
  if(!id){
    // place an unassigned student if available
    const used=assignedIds();
    const un=state.roster.find(s=>!used.has(s.id));
    if(!un){ return; } // no student to place
    pushHistory();
    state.currentSeating[key]=un.id;
  }
  const sid=state.currentSeating[key];
  const s=getStudent(sid);
  state.editing=true; state.editCell=key; state.editStartName=s?s.name:'';
  const p=metrics.cellPos[key];
  editInput.style.display='block';
  editInput.style.left=p.x+'px';
  editInput.style.top=p.y+'px';
  editInput.style.width=p.w+'px';
  editInput.style.height=p.h+'px';
  editInput.style.fontSize='16px';
  editInput.value=s?s.name:'';
  editInput.dataset.sid=sid;
  editInput.focus(); editInput.select();
  redraw();
}
function commitEdit(){
  if(!state.editing) return;
  const sid=parseInt(editInput.dataset.sid,10);
  const s=getStudent(sid);
  const newName=editInput.value.trim();
  if(s && newName!==state.editStartName){
    pushHistory();
    s.name=newName||state.editStartName;
  } else if(s && !newName){
    // empty name -> keep previous (don't wipe)
    s.name=state.editStartName;
  }
  editInput.style.display='none';
  state.editing=false; state.editCell=null; state.editStartName=null;
  redraw(); persist();
}
function cancelEditCell(){
  if(!state.editing) return;
  const sid=parseInt(editInput.dataset.sid,10);
  const s=getStudent(sid);
  if(s) s.name=state.editStartName;
  editInput.style.display='none';
  state.editing=false; state.editCell=null; state.editStartName=null;
  redraw();
}
function moveOrSwap(a,b){
  const va=state.currentSeating[a], vb=state.currentSeating[b];
  state.currentSeating[a]=vb||null;
  state.currentSeating[b]=va||null;
}
function undo(){
  if(state.history.past.length===0) return;
  if(state.editing) cancelEditCell();
  state.history.future.push(deepSnap());
  restoreSnap(state.history.past.pop());
  updateEditButtons(); redraw(); persist();
}
function redo(){
  if(state.history.future.length===0) return;
  if(state.editing) cancelEditCell();
  state.history.past.push(deepSnap());
  restoreSnap(state.history.future.pop());
  updateEditButtons(); redraw(); persist();
}
function enterEditMode(){
  state.mode='edit';
  state.preEditSnapshot=deepSnap();
  state.history={past:[],future:[]};
  state.highlight=null;
  document.getElementById('actionsPreview').style.display='none';
  document.getElementById('actionsEdit').style.display='flex';
  document.getElementById('infoMode').textContent='编排模式';
  document.getElementById('infoMode').className='mode-tag edit';
  document.getElementById('infoHint').textContent='点击方格修改姓名 · 拖拽方格交换座位';
  updateEditButtons(); redraw();
}
function saveEdit(){
  if(state.editing) commitEdit();
  // previous = arrangement before this edit
  const prev={};
  for(const k in state.preEditSnapshot.seating){
    const id=state.preEditSnapshot.seating[k];
    if(id) prev[k]={id, name:nameFromSnap(state.preEditSnapshot,id)};
  }
  state.previousSeating=prev;
  state.mode='preview';
  state.preEditSnapshot=null;
  state.history={past:[],future:[]};
  document.getElementById('actionsPreview').style.display='flex';
  document.getElementById('actionsEdit').style.display='none';
  document.getElementById('infoMode').textContent='预览模式';
  document.getElementById('infoMode').className='mode-tag preview';
  document.getElementById('infoHint').textContent='点击学生姓名查看历史座位';
  redraw(); persist(); toast('座位已保存，已更新历史记录');
}
function cancelEdit(){
  if(state.editing) cancelEditCell();
  restoreSnap(state.preEditSnapshot);
  state.mode='preview';
  state.preEditSnapshot=null;
  state.history={past:[],future:[]};
  document.getElementById('actionsPreview').style.display='flex';
  document.getElementById('actionsEdit').style.display='none';
  document.getElementById('infoMode').textContent='预览模式';
  document.getElementById('infoMode').className='mode-tag preview';
  document.getElementById('infoHint').textContent='点击学生姓名查看历史座位';
  redraw(); toast('已取消编辑');
}

/* ================== Pointer handling ================== */
let ptr={down:false,x:0,y:0,cell:null,moved:false};
canvas.addEventListener('pointerdown',e=>{
  const p=canvasPos(e); ptr={down:true,x:p.x,y:p.y,cell:getCellAt(p.x,p.y),moved:false};
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
});
canvas.addEventListener('pointermove',e=>{
  const p=canvasPos(e);
  if(!ptr.down){
    const c=getCellAt(p.x,p.y);
    if(state.mode==='preview') canvas.style.cursor=(c&&(c.region==='curr'||c.region==='prev'))?'pointer':'default';
    else canvas.style.cursor=(c&&state.currentSeating[c.key])?'pointer':'cell';
    return;
  }
  if(Math.hypot(p.x-ptr.x,p.y-ptr.y)>6) ptr.moved=true;
  if(state.mode==='edit' && ptr.moved && ptr.cell && state.currentSeating[ptr.cell.key]){
    state.dragging=ptr.cell.key;
    state._mouseX=p.x; state._mouseY=p.y;
    const over=getCellAt(p.x,p.y);
    state.dragOver = (over && over.key!==ptr.cell.key)? over.key : null;
    if(state.editing) commitEdit();
    redraw();
  }
});
canvas.addEventListener('pointerup',e=>{
  if(!ptr.down) return;
  const p=canvasPos(e);
  if(state.mode==='edit'){
    if(ptr.moved && state.dragging){
      const target=getCellAt(p.x,p.y);
      if(target && target.key!==state.dragging){
        pushHistory();
        moveOrSwap(state.dragging, target.key);
      }
      state.dragging=null; state.dragOver=null; redraw();
    } else {
      if(state.editing) commitEdit();
      const cell=ptr.cell;
      if(cell){ startEdit(cell.key); }
      else { /* blank */ }
    }
  } else {
    if(!ptr.moved) handlePreviewClick(ptr.cell);
  }
  ptr.down=false;
  try{canvas.releasePointerCapture(e.pointerId);}catch(_){}
});
canvas.addEventListener('pointerleave',()=>{
  if(!ptr.down){ canvas.style.cursor='default'; }
});
editInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){ e.preventDefault(); commitEdit(); }
  else if(e.key==='Escape'){ e.preventDefault(); cancelEditCell(); }
  else if(e.key==='Tab'){
    e.preventDefault();
    commitEdit();
    // move to next cell in fill order
    const order=fillOrder();
    const idx=order.indexOf(state.editCell);
    const next=order[(idx+ (e.shiftKey?-1:1)+order.length)%order.length];
    if(next) startEdit(next);
  }
});
editInput.addEventListener('blur',()=>{ if(state.editing) commitEdit(); });

/* ================== Modals ================== */
const modalOverlay=document.getElementById('modalOverlay');
const modalHead=document.getElementById('modalHead');
const modalBody=document.getElementById('modalBody');
const modalFoot=document.getElementById('modalFoot');
function openModal(head,bodyHtml,footHtml){
  modalHead.innerHTML=head;
  modalBody.innerHTML=bodyHtml;
  modalFoot.innerHTML=footHtml;
  modalOverlay.classList.add('open');
}
function closeModal(){ modalOverlay.classList.remove('open'); }
// Close when clicking anywhere outside the modal box (the dark backdrop).
// Uses .closest('.modal') so it's robust regardless of which overlay child
// is the actual click target. Listen to both mousedown and click so it works
// whether the interaction is a real pointer press or a synthesized click.
function onBackdrop(e){
  if(!e.target.closest('.modal')){
    closeModal();
    // If the user dismissed the initial setup without configuring, the app has no data — re-prompt.
    if(!state.initialized){ setTimeout(openSetup, 260); }
  }
}
modalOverlay.addEventListener('mousedown', onBackdrop);
modalOverlay.addEventListener('click', onBackdrop);
document.getElementById('modalClose').addEventListener('click', ()=>{
  closeModal();
  if(!state.initialized){ setTimeout(openSetup, 260); }
});

function configFormHtml(showCount){
  const L=state.layout;
  const cols=L.columns.length||4;
  let colInputs='';
  for(let i=0;i<cols;i++){
    const v=L.columns[i]||6;
    colInputs+=`<div class="col-field"><div class="cl">第 ${i+1} 列</div><input type="number" min="1" max="20" class="col-rows" data-i="${i}" value="${v}"></div>`;
  }
  return `
    ${showCount?`<div class="field"><label>学生数量</label><input type="number" id="fCount" min="1" max="200" value="${state.studentCount||40}"><div class="err" id="errCount"></div></div>`:''}
    <div class="section-title">视角</div>
    <div class="radios" id="podiumRadios">
      <label class="radio-card ${L.podium==='top'?'checked':''}"><input type="radio" name="podium" value="top" ${L.podium==='top'?'checked':''}><div><div class="rt">讲台在上方</div><div class="rd">学生面朝上</div></div></label>
      <label class="radio-card ${L.podium==='bottom'?'checked':''}"><input type="radio" name="podium" value="bottom" ${L.podium==='bottom'?'checked':''}><div><div class="rt">讲台在下方</div><div class="rd">学生面朝下</div></div></label>
    </div>
    <div class="field"><label>列数</label><input type="number" id="fCols" min="1" max="12" value="${cols}"><div class="err" id="errCols"></div></div>
    <div class="section-title">每列座位数</div>
    <div class="cols-grid" id="colsGrid">${colInputs}</div>
    <div class="check-row"><input type="checkbox" id="fAisle" ${L.aisle?'checked':''}><label for="fAisle">中间留空列（过道）</label></div>
  `;
}
function wireConfigForm(){
  // podium radios
  document.querySelectorAll('#podiumRadios .radio-card').forEach(rc=>{
    rc.addEventListener('click',()=>{
      document.querySelectorAll('#podiumRadios .radio-card').forEach(x=>x.classList.remove('checked'));
      rc.classList.add('checked');
      rc.querySelector('input').checked=true;
    });
  });
  const fCols=document.getElementById('fCols');
  const grid=document.getElementById('colsGrid');
  fCols.addEventListener('input',()=>{
    let n=parseInt(fCols.value,10)||0; if(n<1)n=1; if(n>12)n=12;
    const cur={};
    grid.querySelectorAll('.col-rows').forEach(inp=>cur[inp.dataset.i]=inp.value);
    let html='';
    for(let i=0;i<n;i++){
      html+=`<div class="col-field"><div class="cl">第 ${i+1} 列</div><input type="number" min="1" max="20" class="col-rows" data-i="${i}" value="${cur[i]||6}"></div>`;
    }
    grid.innerHTML=html;
  });
}
function readConfigForm(){
  const podium=document.querySelector('input[name="podium"]:checked').value;
  const aisle=document.getElementById('fAisle').checked;
  const cols=[];
  document.querySelectorAll('.col-rows').forEach(inp=>{
    const v=parseInt(inp.value,10); if(v>0) cols.push(v); else cols.push(1);
  });
  return {podium,aisle,columns:cols};
}

function openSetup(){
  state.layout={podium:'top',columns:[6,6,6,6],aisle:true};
  state.studentCount=40;
  openModal(
    '<svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>初始设置',
    configFormHtml(true),
    '<button class="md-btn dark" id="mCancel">取消</button><button class="md-btn dark btn-raised" id="mConfirm">开始使用</button>'
  );
  wireConfigForm();
  document.getElementById('mCancel').onclick=()=>closeModal();
  document.getElementById('mConfirm').onclick=()=>{
    const count=parseInt(document.getElementById('fCount').value,10);
    const cfg=readConfigForm();
    const seats=cfg.columns.reduce((a,b)=>a+b,0);
    const errCount=document.getElementById('errCount');
    errCount.textContent='';
    if(!count||count<1){errCount.textContent='请输入有效的学生数量';return;}
    if(count>seats){errCount.textContent='学生数量('+count+')超过座位总数('+seats+')，请调整布局';return;}
    applyInitial(count,cfg);
    closeModal();
  };
}
function applyInitial(count,cfg){
  state.layout=cfg;
  state.studentCount=count;
  state.roster=[]; state.nextId=1;
  for(let i=1;i<=count;i++){ state.roster.push({id:state.nextId++, name:'学生'+i}); }
  state.currentSeating={};
  state.previousSeating={};
  state.highlight=null;
  autoPlaceUnassigned();
  state.initialized=true;
  fitCanvas(); updateInfo(); redraw(); persist();
}
function openStudentCount(){
  openModal(
    '<svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>修改学生数量',
    `<div class="field"><label>当前学生数量：${state.studentCount}　·　座位总数：${totalSeats()}</label><input type="number" id="newCount" min="1" max="200" value="${state.studentCount}"><div class="err" id="errN"></div><p style="font-size:12px;color:var(--md-on-surface-variant);margin-top:8px">修改后会自动将全部学生平均分配到各列座位，当前的手动排座将被重置。</p></div>`,
    '<button class="md-btn dark" id="mCancel">取消</button><button class="md-btn dark btn-raised" id="mConfirm">确定</button>'
  );
  document.getElementById('mCancel').onclick=()=>closeModal();
  document.getElementById('mConfirm').onclick=()=>{
    const n=parseInt(document.getElementById('newCount').value,10);
    const err=document.getElementById('errN'); err.textContent='';
    if(!n||n<1){err.textContent='请输入有效数量';return;}
    changeStudentCount(n); closeModal();
  };
}
function changeStudentCount(n){
  const cur=state.studentCount;
  if(n>cur){
    for(let i=cur+1;i<=n;i++) state.roster.push({id:state.nextId++, name:'学生'+i});
  } else if(n<cur){
    state.roster=state.roster.slice(0,n);
  }
  state.studentCount=n;
  // Auto-redistribute evenly across all columns so the layout stays balanced.
  evenDistribute();
  state.highlight=null;
  fitCanvas(); updateInfo(); redraw(); persist(); toast('学生数量已更新为 '+n+'，已自动平均分配到各列');
}
function openLayout(){
  openModal(
    '<svg viewBox="0 0 24 24"><path d="M10 18h5v-6h-5v6zm-6 0h5V5H4v13zm12 0h5v-6h-5v6zM10 5v6h11V5H10z"/></svg>修改布局',
    configFormHtml(false),
    '<button class="md-btn dark" id="mCancel">取消</button><button class="md-btn dark btn-raised" id="mConfirm">应用</button>'
  );
  wireConfigForm();
  document.getElementById('mCancel').onclick=()=>closeModal();
  document.getElementById('mConfirm').onclick=()=>{
    const cfg=readConfigForm();
    const seats=cfg.columns.reduce((a,b)=>a+b,0);
    if(seats<state.studentCount){ toast('座位总数('+seats+')少于学生数量('+state.studentCount+')，部分学生将无法入座'); }
    applyLayout(cfg); closeModal();
  };
}
function applyLayout(cfg){
  // preserve existing assignments where cell still exists
  const oldSeating={...state.currentSeating};
  state.layout=cfg;
  state.currentSeating={};
  for(const k in oldSeating){
    const [c,r]=k.slice(1).split('_').map(Number);
    if(c<cfg.columns.length && r<cfg.columns[c]) state.currentSeating[k]=oldSeating[k];
  }
  // prune previous to existing cells
  const newPrev={};
  for(const k in state.previousSeating){
    const [c,r]=k.slice(1).split('_').map(Number);
    if(c<cfg.columns.length && r<cfg.columns[c]) newPrev[k]=state.previousSeating[k];
  }
  state.previousSeating=newPrev;
  autoPlaceUnassigned();
  state.highlight=null;
  fitCanvas(); updateInfo(); redraw(); persist(); toast('布局已更新');
}

/* ================== Export PNG ================== */
function exportPNG(){
  if(!state.initialized) return;
  const m=computeMetrics(getScale());
  const titleH=70, legendH=0;
  const scale=2;
  const cv=document.createElement('canvas');
  cv.width=(m.width)*scale;
  cv.height=(m.height+titleH)*scale;
  const cx=cv.getContext('2d');
  cx.scale(scale,scale);
  // bg
  cx.fillStyle='#FFFFFF'; cx.fillRect(0,0,m.width,m.height+titleH);
  // title
  cx.fillStyle='#3F51B5'; cx.font='700 24px '+getComputedStyle(document.body).fontFamily;
  cx.textAlign='left'; cx.textBaseline='middle';
  cx.fillText('智慧座位表', 26, 30);
  cx.fillStyle='#5F6368'; cx.font='400 12px '+getComputedStyle(document.body).fontFamily;
  const d=new Date();
  const datestr=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  cx.fillText('讲台在'+(state.layout.podium==='top'?'上':'下')+'方 · 共 '+state.studentCount+' 名学生 · '+datestr, 26, 52);
  // draw scene (swap ctx temporarily)
  const realCtx=ctx; const realMetrics=metrics;
  // we need to draw using a temp context; re-implement minimal draw using cx
  drawSceneTo(cx,m);
  const url=cv.toDataURL('image/png');
  const a=document.createElement('a');
  a.href=url; a.download='智慧座位表_'+datestr+'.png'; a.click();
  toast('已导出 PNG 图片');
}
function drawSceneTo(cx,m){
  const savedCtx=window.__ctx; 
  // Temporarily redirect global ctx helpers: easiest is to re-draw with cx directly here.
  // podium
  const rr=(x,y,w,h,r)=>{r=Math.min(r,w/2,h/2);cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();};
  // shift down by titleH
  cx.save(); cx.translate(0,70);
  // podium
  const p=m.podium;
  rr(p.x,p.y,p.w,p.h,8); cx.fillStyle='#E8EAF6'; cx.fill(); cx.lineWidth=1.4; cx.strokeStyle='#C5CAE9'; cx.stroke();
  cx.fillStyle='#3F51B5'; cx.font='600 15px '+getComputedStyle(document.body).fontFamily; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText('讲 台',p.x+p.w/2,p.y+p.h/2);
  for(const key in m.cellPos){
    const pos=m.cellPos[key];
    const cur=state.currentSeating[key]||null;
    const prev=state.previousSeating[key]||null;
    const showPrev=prev && (!cur||prev.id!==cur);
    let fill='#fff',stroke='#DADCE0';
    if(!cur){fill='#F1F3F4';stroke='#E0E0E0';}
    rr(pos.x,pos.y,pos.w,pos.h,8); cx.fillStyle=fill; cx.fill();
    cx.lineWidth=1.2; cx.strokeStyle=stroke; cx.setLineDash(!cur?[4,3]:[]); cx.stroke(); cx.setLineDash([]);
    if(cur){const s=getStudent(cur); cx.fillStyle='#1F1F1F'; cx.font='600 16px '+getComputedStyle(document.body).fontFamily; cx.textAlign='center'; cx.textBaseline='middle'; let t=s?s.name:'？'; while(cx.measureText(t).width>pos.w-14 && t.length>1) t=t.slice(0,-1); if(t!==s?.name) t=t.slice(0,-1)+'…'; cx.fillText(t,pos.x+pos.w/2,pos.y+pos.h/2+2);}
    if(showPrev){cx.fillStyle='#2E7D32'; cx.font='600 11px '+getComputedStyle(document.body).fontFamily; cx.textAlign='right'; cx.textBaseline='middle'; let t=prev.name; while(cx.measureText(t).width>pos.w*0.55 && t.length>1) t=t.slice(0,-1); if(t!==prev.name) t=t.slice(0,-1)+'…'; cx.fillText(t,pos.x+pos.w-7,pos.y+12);}
  }
  cx.restore();
}

/* ================== UI wiring ================== */
function updateInfo(){
  document.getElementById('infoStudents').textContent=state.studentCount;
  document.getElementById('infoSeats').textContent=totalSeats();
  document.getElementById('infoCols').textContent=state.layout.columns.length;
}
function toast(msg){
  const s=document.getElementById('snackbar'); s.textContent=msg; s.classList.add('show');
  clearTimeout(window.__t); window.__t=setTimeout(()=>s.classList.remove('show'),2400);
}
function bindRipple(btn){
  btn.addEventListener('click',e=>{
    const r=document.createElement('span'); r.className='ripple';
    const rect=btn.getBoundingClientRect();
    const size=Math.max(rect.width,rect.height);
    r.style.width=r.style.height=size+'px';
    r.style.left=(e.clientX-rect.left-size/2)+'px';
    r.style.top=(e.clientY-rect.top-size/2)+'px';
    btn.appendChild(r); setTimeout(()=>r.remove(),600);
  });
}
document.querySelectorAll('.md-btn').forEach(bindRipple);
document.getElementById('btnArrange').onclick=enterEditMode;
document.getElementById('btnCount').onclick=()=>{ if(state.mode==='edit')return; openStudentCount(); };
document.getElementById('btnLayout').onclick=()=>{ if(state.mode==='edit')return; openLayout(); };
document.getElementById('btnExport').onclick=exportPNG;
document.getElementById('btnUndo').onclick=undo;
document.getElementById('btnRedo').onclick=redo;
document.getElementById('btnSave').onclick=saveEdit;
document.getElementById('btnCancel').onclick=cancelEdit;
document.getElementById('resetLink').onclick=()=>{
  if(confirm('确定要重置全部数据吗？此操作不可恢复。')){
    localStorage.removeItem(LS_KEY);
    location.reload();
  }
};
window.addEventListener('resize',()=>{ if(state.initialized){ fitCanvas(); if(state.editing){ const p=metrics.cellPos[state.editCell]; if(p){editInput.style.left=p.x+'px';editInput.style.top=p.y+'px';editInput.style.width=p.w+'px';editInput.style.height=p.h+'px';}} redraw(); } });

/* ================== Persistence ================== */
function persist(){
  if(!state.initialized) return;
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      layout:state.layout, studentCount:state.studentCount, roster:state.roster,
      currentSeating:state.currentSeating, previousSeating:state.previousSeating,
      nextId:state.nextId, initialized:true
    }));
  }catch(_){}
}
function load(){
  try{
    const raw=localStorage.getItem(LS_KEY); if(!raw) return false;
    const d=JSON.parse(raw);
    state.layout=d.layout; state.studentCount=d.studentCount; state.roster=d.roster||[];
    state.currentSeating=d.currentSeating||{}; state.previousSeating=d.previousSeating||{};
    state.nextId=d.nextId||1; state.initialized=!!d.initialized;
    return state.initialized;
  }catch(_){ return false; }
}

/* ================== Init ================== */
function init(){
  if(load()){
    fitCanvas(); updateInfo(); redraw();
    toast('已加载上次的座位表');
  } else {
    openSetup();
  }
}
init();
})();
