<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>童知世界 - 儿童三观启蒙AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #e6f7ff;
            padding: 10px;
            max-width: 750px;
            margin: 0 auto;
            background-image: url("https://img0.baidu.com/it/u=123245678,123456&fm=253&fmt=auto&app=138&f=JPEG?w=800&h=1200");
            background-size: cover;
            background-attachment: fixed;
        }
        .container-wrap {
            background: rgba(255,255,255,0.92);
            border-radius: 20px;
            padding:15px;
        }
        .header {
            background: linear-gradient(135deg,#69b1ff,#84d0ff);
            color: white;
            text-align: center;
            padding: 16px;
            border-radius: 18px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }
        .header-img {
            width:80px;
            position:absolute;
            right:10px;
            top:10px;
            opacity:0.8;
        }
        .header h1 {
            font-size: 20px;
        }
        .header p {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 4px;
        }
        .chat-box {
            background: #fff;
            border-radius: 18px;
            padding: 12px;
            min-height: 60vh;
            max-height: 65vh;
            overflow-y: auto;
            margin-bottom: 12px;
        }
        .msg-item {
            margin: 10px 0;
            display: flex;
            gap:8px;
            align-items:flex-start;
        }
        .user-msg {
            justify-content: flex-end;
            flex-direction: row-reverse;
        }
        .ai-msg {
            justify-content: flex-start;
        }
        .avatar {
            width:40px;
            height:40px;
            border-radius:50%;
            object-fit:cover;
            border:2px solid #cce7ff;
        }
        .msg-content {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 15px;
        }
        .user-msg .msg-content {
            background: #91caff;
            color: #002851;
            border-top-right-radius:4px;
        }
        .ai-msg .msg-content {
            background: #f0f8ff;
            color: #222;
            border-top-left-radius:4px;
        }
        .input-area {
            display: flex;
            gap: 8px;
        }
        #inputText {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #bcd8f5;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
        }
        #sendBtn {
            background: #409eff;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 24px;
            font-size: 15px;
        }
        .tip-text {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 8px;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:6px;
        }
        .tip-icon {
            width:18px;
        }
    </style>
</head>
<body>
<div class="container-wrap">
    <div class="header">
        <img class="header-img" alt="卡通小朋友" src="https://picsum.photos/id/237/100/100">
        <h1>童知世界 · 儿童三观启蒙AI</h1>
        <p>3-12岁孩子专属｜友善/诚信/爱国/平等趣味引导</p>
    </div>

    <div class="chat-box" id="chatContainer">
        <div class="msg-item ai-msg">
            <img class="avatar" alt="AI小助手" src="https://picsum.photos/id/142/60/60">
            <div class="msg-content">
                小朋友你好！我是童知世界AI～有什么疑问都可以问我，我会用小故事告诉你正确的道理哦！
            </div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="inputText" placeholder="输入你的问题，例如：和同学吵架了怎么办">
        <button id="sendBtn">发送</button>
    </div>
    <p class="tip-text">
        <img class="tip-icon" alt="小星星" src="https://picsum.photos/id/106/30/30">
        自动过滤偏激、负面内容，输出正向价值观小故事
    </p>
</div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const inputText = document.getElementById('inputText');
        const sendBtn = document.getElementById('sendBtn');

        // 负面关键词过滤库
        const badWords = ["讨厌所有人","大家都坏","报复","打他","欺负活该","有钱才厉害","看不起","外国都不好","作弊没事","撒谎无所谓"];

        // AI问答知识库：三观正向引导
        const aiKnowledge = {
            "和同学吵架": "森林里两只小兔子因为胡萝卜闹别扭，谁都不肯低头。兔妈妈说，每个人都有自己的想法，好好说话、体谅别人才是友善。主动说一句对不起，朋友会更加喜欢你哦。我们要平等尊重每一位同学。",
            "撒谎好不好": "小狐狸偷摘果园葡萄还说谎，最后没人愿意和它做朋友。诚信是最珍贵的宝物，做错事勇敢承认，大家都会原谅你，诚实的小朋友最受人喜欢。",
            "什么是爱国": "小熊猫守护自己的竹林家园，爱护花草、尊敬国旗、认真学习、礼貌对待身边的人，都是热爱我们祖国的表现。祖国守护我们长大，我们也要好好爱护祖国。",
            "有人欺负我怎么办": "小鹿遇到调皮的小野猪，没有和它打架，而是告诉鹿老师。遇到欺负不要以暴制暴，寻求老师家长帮助，友善沟通，人人都该被平等温柔对待。",
            "别人比我优秀": "花园里有玫瑰、雏菊、小草，每一种植物都有自己的闪光点。每个人擅长的事情不一样，不用攀比，尊重差异，努力做好自己就是最棒的。",
            "捡到东西怎么办": "小松鼠捡到小鸟丢失的羽毛背包，守在原地等待主人。不属于自己的物品要归还他人，坚守诚信，做拾金不昧的好孩子。",
            "为什么要尊重别人": "天上星星大小各不相同，却一起照亮黑夜。每一个小朋友都是独一无二的，不分高矮贫富，平等尊重他人，世界才会温暖美好。"
        };

        // 童话兜底回复
        function getDefaultReply(question) {
            return `从前有一个小小探险家，他遇到和你一样的疑惑「${question}」。老师告诉他：看待事情要客观温和，待人友善、诚实守信，尊重身边每一个人，热爱我们的家园，遇到难题多和爸爸妈妈、老师沟通，就能找到温柔又正确的答案啦。`;
        }

        // 检测不良内容
        function hasBadContent(text) {
            return badWords.some(word => text.includes(word));
        }

        // 渲染消息（带头像图片）
        function addMsg(text, isUser) {
            const div = document.createElement('div');
            div.className = `msg-item ${isUser ? 'user-msg' : 'ai-msg'}`;
            let avatarSrc = isUser
                ? "https://picsum.photos/id/91/60/60"
                : "https://picsum.photos/id/142/60/60";
            div.innerHTML = `
                <img class="avatar" alt="头像" src="${avatarSrc}">
                <div class="msg-content">${text}</div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // AI回复逻辑
        function getAIReply(question) {
            if (hasBadContent(question)) {
                return "这样的想法有点偏激哦，我们要友善、包容地看待所有人和事，换温柔的角度提问，我讲好听的小故事给你听～";
            }
            for(let key in aiKnowledge) {
                if(question.includes(key)) {
                    return aiKnowledge[key];
                }
            }
            return getDefaultReply(question);
        }

        // 发送消息
        function sendMessage() {
            const text = inputText.value.trim();
            if(!text) return;
            addMsg(text, true);
            inputText.value = "";
            setTimeout(()=>{
                const reply = getAIReply(text);
                addMsg(reply, false);
            }, 600);
        }

        sendBtn.addEventListener('click', sendMessage);
        inputText.addEventListener('keydown', e=>{
            if(e.key === 'Enter') sendMessage();
        })
    </script>
</body>
</html>
