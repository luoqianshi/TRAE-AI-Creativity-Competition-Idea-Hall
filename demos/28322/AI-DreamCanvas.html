<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI梦境画布 - 用文字绘制你的想象世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0e27;
            --bg2: #12183a;
            --ink: #e8eaf6;
            --muted: #8e94b8;
            --rule: #1e2746;
            --accent: #6366f1;
            --accent2: #ec4899;
            --accent3: #10b981;
        }

        @font-face {
            font-family: 'DreamFont';
            src: local('PingFang SC'), local('Microsoft YaHei'), sans-serif;
        }

        body {
            font-family: 'DreamFont', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 粒子背景画布 */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 头部 */
        header {
            text-align: center;
            padding: 3rem 0 2rem;
        }

        .logo {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .tagline {
            color: var(--muted);
            font-size: 1.1rem;
            font-weight: 300;
        }

        /* 输入区域 */
        .input-section {
            background: var(--bg2);
            border: 1px solid var(--rule);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem 0;
            backdrop-filter: blur(10px);
        }

        .input-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .dream-input {
            flex: 1;
            min-width: 250px;
            padding: 1rem 1.5rem;
            border: 2px solid var(--rule);
            border-radius: 12px;
            background: var(--bg);
            color: var(--ink);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .dream-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }

        .dream-input::placeholder {
            color: var(--muted);
        }

        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: var(--rule);
            color: var(--ink);
        }

        .btn-secondary:hover {
            background: var(--accent);
            color: white;
        }

        /* 快捷标签 */
        .quick-tags {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .tag {
            padding: 0.5rem 1rem;
            border: 1px solid var(--rule);
            border-radius: 20px;
            font-size: 0.875rem;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
        }

        .tag:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px);
        }

        /* 梦境画布展示 */
        .canvas-section {
            background: var(--bg2);
            border: 1px solid var(--rule);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem 0;
            min-height: 400px;
            position: relative;
            overflow: hidden;
        }

        .canvas-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .canvas-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .canvas-actions {
            display: flex;
            gap: 0.75rem;
        }

        #dream-display {
            width: 100%;
            height: 350px;
            border-radius: 12px;
            background: var(--bg);
            position: relative;
            overflow: hidden;
        }

        /* 粒子画布 */
        #dream-canvas {
            width: 100%;
            height: 100%;
        }

        /* 梦境画廊 */
        .gallery-section {
            margin: 3rem 0;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .dream-card {
            background: var(--bg2);
            border: 1px solid var(--rule);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .dream-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.15);
        }

        .dream-preview {
            width: 100%;
            height: 160px;
            background: var(--bg);
            position: relative;
            overflow: hidden;
        }

        .dream-preview canvas {
            width: 100%;
            height: 100%;
        }

        .dream-info {
            padding: 1.25rem;
        }

        .dream-text {
            font-size: 0.95rem;
            color: var(--ink);
            margin-bottom: 0.5rem;
            line-height: 1.5;
        }

        .dream-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--muted);
        }

        .dream-mood {
            padding: 0.25rem 0.75rem;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .mood-serene { background: rgba(16, 185, 129, 0.2); color: var(--accent3); }
        .mood-mysterious { background: rgba(99, 102, 241, 0.2); color: var(--accent); }
        .mood-passionate { background: rgba(236, 72, 153, 0.2); color: var(--accent2); }
        .mood-melancholy { background: rgba(142, 148, 184, 0.2); color: var(--muted); }

        /* 情绪选择器 */
        .mood-selector {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .mood-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border: 2px solid var(--rule);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mood-option:hover,
        .mood-option.active {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.1);
        }

        .mood-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 3rem 0;
            color: var(--muted);
            font-size: 0.875rem;
        }

        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.6s ease forwards;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .logo { font-size: 2rem; }
            .input-group { flex-direction: column; }
            .dream-input { width: 100%; }
            .gallery-grid { grid-template-columns: 1fr; }
            .canvas-header { flex-direction: column; align-items: flex-start; }
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 提示信息 */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--accent);
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>

    <div class="container">
        <header class="fade-in">
            <h1 class="logo">AI梦境画布</h1>
            <p class="tagline">用文字描绘想象，让AI为你绘制独一无二的梦境世界</p>
        </header>

        <section class="input-section fade-in">
            <div class="input-group">
                <input 
                    type="text" 
                    class="dream-input" 
                    id="dreamInput" 
                    placeholder="描述你的梦境... 例如：星空下的孤独城市"
                    maxlength="100"
                >
                <button class="btn btn-primary" onclick="generateDream()">
                    <span>✨</span> 绘制梦境
                </button>
            </div>

            <div class="mood-selector">
                <div class="mood-option active" data-mood="serene" onclick="selectMood(this)">
                    <div class="mood-dot" style="background: var(--accent3)"></div>
                    <span>宁静</span>
                </div>
                <div class="mood-option" data-mood="mysterious" onclick="selectMood(this)">
                    <div class="mood-dot" style="background: var(--accent)"></div>
                    <span>神秘</span>
                </div>
                <div class="mood-option" data-mood="passionate" onclick="selectMood(this)">
                    <div class="mood-dot" style="background: var(--accent2)"></div>
                    <span>热烈</span>
                </div>
                <div class="mood-option" data-mood="melancholy" onclick="selectMood(this)">
                    <div class="mood-dot" style="background: var(--muted)"></div>
                    <span>忧郁</span>
                </div>
            </div>

            <div style="margin-top: 1.5rem;">
                <p style="color: var(--muted); font-size: 0.875rem; margin-bottom: 0.75rem;">快速灵感：</p>
                <div class="quick-tags">
                    <button class="tag" onclick="setDream('深海中的发光水母森林')">🌊 深海中的发光水母森林</button>
                    <button class="tag" onclick="setDream('悬浮在云端的天空花园')">☁️ 悬浮在云端的天空花园</button>
                    <button class="tag" onclick="setDream('未来城市的霓虹雨夜')">🌃 未来城市的霓虹雨夜</button>
                    <button class="tag" onclick="setDream('古老森林中的精灵村落')">🌲 古老森林中的精灵村落</button>
                    <button class="tag" onclick="setDream('宇宙尽头的咖啡馆')">☕ 宇宙尽头的咖啡馆</button>
                    <button class="tag" onclick="setDream('时间倒流的樱花街道')">🌸 时间倒流的樱花街道</button>
                </div>
            </div>
        </section>

        <section class="canvas-section fade-in" id="canvasSection" style="display: none;">
            <div class="canvas-header">
                <h2 class="canvas-title" id="canvasTitle">你的梦境</h2>
                <div class="canvas-actions">
                    <button class="btn btn-secondary" onclick="saveDream()">
                        <span>💾</span> 保存梦境
                    </button>
                    <button class="btn btn-secondary" onclick="shareDream()">
                        <span>📤</span> 分享
                    </button>
                </div>
            </div>
            <div id="dream-display">
                <canvas id="dream-canvas"></canvas>
            </div>
        </section>

        <section class="gallery-section fade-in">
            <h2 class="section-title">
                <span>🎨</span> 梦境画廊
            </h2>
            <div class="gallery-grid" id="galleryGrid">
                <!-- 示例卡片 -->
                <div class="dream-card">
                    <div class="dream-preview">
                        <canvas id="preview1"></canvas>
                    </div>
                    <div class="dream-info">
                        <p class="dream-text">星空下的孤独城市</p>
                        <div class="dream-meta">
                            <span>刚刚</span>
                            <span class="dream-mood mood-mysterious">神秘</span>
                        </div>
                    </div>
                </div>
                <div class="dream-card">
                    <div class="dream-preview">
                        <canvas id="preview2"></canvas>
                    </div>
                    <div class="dream-info">
                        <p class="dream-text">深海中的发光水母森林</p>
                        <div class="dream-meta">
                            <span>5分钟前</span>
                            <span class="dream-mood mood-serene">宁静</span>
                        </div>
                    </div>
                </div>
                <div class="dream-card">
                    <div class="dream-preview">
                        <canvas id="preview3"></canvas>
                    </div>
                    <div class="dream-info">
                        <p class="dream-text">未来城市的霓虹雨夜</p>
                        <div class="dream-meta">
                            <span>10分钟前</span>
                            <span class="dream-mood mood-passionate">热烈</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <footer>
            <p>AI梦境画布 - TRAE AI创造力大赛参赛作品</p>
            <p style="margin-top: 0.5rem; opacity: 0.7;">世界很大，放手去造</p>
        </footer>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // 全局状态
        let currentMood = 'serene';
        let currentDream = '';
        let animationId = null;

        // 情绪配置
        const moodConfig = {
            serene: { 
                colors: ['#10b981', '#34d399', '#6ee7b7', '#059669'],
                particleCount: 80,
                speed: 0.5
            },
            mysterious: { 
                colors: ['#6366f1', '#818cf8', '#a5b4fc', '#4f46e5'],
                particleCount: 100,
                speed: 0.3
            },
            passionate: { 
                colors: ['#ec4899', '#f472b6', '#f9a8d4', '#db2777'],
                particleCount: 120,
                speed: 0.8
            },
            melancholy: { 
                colors: ['#8e94b8', '#a5aac2', '#c4c7d9', '#6b7280'],
                particleCount: 60,
                speed: 0.2
            }
        };

        // 背景粒子系统
        class ParticleSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.resize();
                this.init();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            init() {
                this.particles = [];
                for (let i = 0; i < 50; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        size: Math.random() * 2 + 0.5,
                        speedX: (Math.random() - 0.5) * 0.3,
                        speedY: (Math.random() - 0.5) * 0.3,
                        opacity: Math.random() * 0.5 + 0.1
                    });
                }
            }

            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.particles.forEach(p => {
                    p.x += p.speedX;
                    p.y += p.speedY;

                    if (p.x < 0) p.x = this.canvas.width;
                    if (p.x > this.canvas.width) p.x = 0;
                    if (p.y < 0) p.y = this.canvas.height;
                    if (p.y > this.canvas.height) p.y = 0;

                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(99, 102, 241, ${p.opacity})`;
                    this.ctx.fill();
                });

                // 连线
                this.particles.forEach((p1, i) => {
                    this.particles.slice(i + 1).forEach(p2 => {
                        const dx = p1.x - p2.x;
                        const dy = p1.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 150) {
                            this.ctx.beginPath();
                            this.ctx.moveTo(p1.x, p1.y);
                            this.ctx.lineTo(p2.x, p2.y);
                            this.ctx.strokeStyle = `rgba(99, 102, 241, ${0.1 * (1 - dist / 150)})`;
                            this.ctx.stroke();
                        }
                    });
                });

                requestAnimationFrame(() => this.animate());
            }
        }

        // 梦境粒子系统
        class DreamParticleSystem {
            constructor(canvas, mood) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.mood = mood;
                this.particles = [];
                this.time = 0;
                this.resize();
                this.init();
            }

            resize() {
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
            }

            init() {
                const config = moodConfig[this.mood];
                this.particles = [];
                for (let i = 0; i < config.particleCount; i++) {
                    this.particles.push(this.createParticle(config));
                }
            }

            createParticle(config) {
                return {
                    x: Math.random() * this.canvas.width,
                    y: Math.random() * this.canvas.height,
                    size: Math.random() * 4 + 1,
                    speedX: (Math.random() - 0.5) * config.speed,
                    speedY: (Math.random() - 0.5) * config.speed,
                    color: config.colors[Math.floor(Math.random() * config.colors.length)],
                    opacity: Math.random() * 0.8 + 0.2,
                    pulse: Math.random() * Math.PI * 2
                };
            }

            animate() {
                this.ctx.fillStyle = 'rgba(10, 14, 39, 0.1)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                const config = moodConfig[this.mood];
                this.time += 0.01;

                this.particles.forEach(p => {
                    p.x += p.speedX + Math.sin(this.time + p.pulse) * 0.5;
                    p.y += p.speedY + Math.cos(this.time + p.pulse) * 0.5;
                    p.pulse += 0.02;

                    if (p.x < -10) p.x = this.canvas.width + 10;
                    if (p.x > this.canvas.width + 10) p.x = -10;
                    if (p.y < -10) p.y = this.canvas.height + 10;
                    if (p.y > this.canvas.height + 10) p.y = -10;

                    const pulseSize = p.size + Math.sin(p.pulse) * 1;
                    
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, Math.max(0.5, pulseSize), 0, Math.PI * 2);
                    this.ctx.fillStyle = p.color;
                    this.ctx.globalAlpha = p.opacity;
                    this.ctx.fill();

                    // 光晕效果
                    const gradient = this.ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, pulseSize * 3);
                    gradient.addColorStop(0, p.color + '40');
                    gradient.addColorStop(1, 'transparent');
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, pulseSize * 3, 0, Math.PI * 2);
                    this.ctx.fillStyle = gradient;
                    this.ctx.fill();
                });

                this.ctx.globalAlpha = 1;

                // 绘制连线
                this.particles.forEach((p1, i) => {
                    this.particles.slice(i + 1).forEach(p2 => {
                        const dx = p1.x - p2.x;
                        const dy = p1.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 100) {
                            this.ctx.beginPath();
                            this.ctx.moveTo(p1.x, p1.y);
                            this.ctx.lineTo(p2.x, p2.y);
                            this.ctx.strokeStyle = p1.color + Math.floor((1 - dist / 100) * 30).toString(16).padStart(2, '0');
                            this.ctx.stroke();
                        }
                    });
                });

                animationId = requestAnimationFrame(() => this.animate());
            }

            stop() {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }
            }
        }

        // 初始化背景粒子
        const bgCanvas = document.getElementById('particle-canvas');
        const bgSystem = new ParticleSystem(bgCanvas);
        bgSystem.animate();

        // 选择情绪
        function selectMood(element) {
            document.querySelectorAll('.mood-option').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            currentMood = element.dataset.mood;
        }

        // 设置梦境文本
        function setDream(text) {
            document.getElementById('dreamInput').value = text;
        }

        // 生成梦境
        function generateDream() {
            const input = document.getElementById('dreamInput');
            const text = input.value.trim();
            
            if (!text) {
                showToast('请先描述你的梦境');
                return;
            }

            currentDream = text;
            document.getElementById('canvasTitle').textContent = text;
            document.getElementById('canvasSection').style.display = 'block';
            
            // 滚动到画布
            document.getElementById('canvasSection').scrollIntoView({ behavior: 'smooth' });

            // 停止之前的动画
            if (animationId) {
                cancelAnimationFrame(animationId);
            }

            // 启动新的梦境粒子系统
            const canvas = document.getElementById('dream-canvas');
            const dreamSystem = new DreamParticleSystem(canvas, currentMood);
            dreamSystem.animate();

            showToast('梦境绘制完成！');
        }

        // 保存梦境
        function saveDream() {
            showToast('梦境已保存到画廊');
            // 这里可以添加本地存储逻辑
        }

        // 分享梦境
        function shareDream() {
            if (navigator.share) {
                navigator.share({
                    title: '我的AI梦境',
                    text: currentDream,
                    url: window.location.href
                });
            } else {
                showToast('链接已复制到剪贴板');
            }
        }

        // 显示提示
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // 初始化示例预览
        function initPreviews() {
            const previews = [
                { id: 'preview1', mood: 'mysterious' },
                { id: 'preview2', mood: 'serene' },
                { id: 'preview3', mood: 'passionate' }
            ];

            previews.forEach(preview => {
                const canvas = document.getElementById(preview.id);
                if (canvas) {
                    const system = new DreamParticleSystem(canvas, preview.mood);
                    // 只渲染一帧作为静态预览
                    system.animate();
                    setTimeout(() => {
                        if (animationId) cancelAnimationFrame(animationId);
                    }, 100);
                }
            });
        }

        // 回车提交
        document.getElementById('dreamInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                generateDream();
            }
        });

        // 页面加载完成后初始化
        window.addEventListener('load', () => {
            initPreviews();
        });

        // 窗口大小改变时重新调整
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('dream-canvas');
            if (canvas && canvas.width > 0) {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
            }
        });
    </script>
</body>
</html>
