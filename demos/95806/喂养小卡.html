<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>喂养小卡</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #2d3748;
            --text-secondary: #6a7380;
            --accent: #4a9eff;
            --warning: #e53e3e;
            --border: #e2e8f0;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
            --radius: 12px;
            --transition: all 0.3s ease;
        }

        .dark-theme {
            --bg-primary: #1a202c;
            --bg-card: #2d3748;
            --text-primary: #e2e8f0;
            --text-secondary: #a0aec0;
            --accent: #63b3ff;
            --warning: #f56565;
            --border: #4a5568;
            --shadow: 0 2px 12px rgba(0,0,0,0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 16px;
            transition: var(--transition);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
            padding-top: 16px;
        }

        h1 {
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-section {
            max-width: 600px;
            margin: 0 auto 32px;
            text-align: center;
        }

        .search-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background-color: var(--bg-card);
            color: var(--text-primary);
            outline: none;
            transition: var(--transition);
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.1);
        }

        .search-hint {
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }

        @media (max-width: 768px) {
            .results {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 1px solid var(--border);
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .card-header {
            padding: 16px 20px;
            background-color: rgba(74, 158, 255, 0.05);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .card-toggle {
            width: 20px;
            height: 20px;
            background: var(--accent);
            border-radius: 4px;
            transition: transform 0.2s;
        }

        .card-toggle.open {
            transform: rotate(45deg);
        }

        .card-body {
            padding: 0 20px 20px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease-out;
        }

        .card-body.open {
            max-height: 500px;
            padding: 20px;
        }

        .card-summary {
            font-weight: 600;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px dashed var(--border);
        }

        .card-svg {
            width: 100%;
            height: 120px;
            margin: 16px 0;
        }

        .card-detail {
            margin-top: 16px;
            font-size: 0.95rem;
        }

        .card-warning {
            background-color: rgba(229, 62, 62, 0.08);
            border-left: 4px solid var(--warning);
            padding: 12px 16px;
            margin-top: 16px;
            border-radius: 0 4px 4px 0;
        }

        .theme-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background-color: var(--accent);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            z-index: 100;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        .theme-toggle i {
            font-size: 1.2rem;
        }

        footer {
            text-align: center;
            margin-top: 64px;
            padding: 24px 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            grid-column: 1 / -1;
        }

        .empty-state p {
            margin-top: 12px;
            color: var(--text-secondary);
        }

        /* SVG icons inline */
        .svg-icon {
            display: block;
            margin: 0 auto;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            h1 {
                font-size: 1.5rem;
            }
            .search-input {
                padding: 12px 14px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>喂养小卡</h1>
            <p class="subtitle">输入关键词，3秒获取儿科护士长审核的极简护理指南</p>
        </header>

        <section class="search-section">
            <input type="text" class="search-input" id="searchInput" placeholder="试试输入：吐奶、脐带、黄疸、打喷嚏、湿疹..." />
            <p class="search-hint">✅ 全部内容离线可用｜❌ 无需注册｜❌ 无广告</p>
        </section>

        <main class="results" id="resultsContainer">
            <!-- Cards will be injected here -->
        </main>

        <footer>
            <p>内容由三甲医院儿科护士长审核 · 所有插图均为手绘风格SVG</p>
        </footer>
    </div>

    <button class="theme-toggle" id="themeToggle" aria-label="切换深色/浅色模式">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>

    <script>
        // Predefined cards data — all offline, no external dependency
        const cards = [
            {
                keyword: ["吐奶", "喷奶", "呛奶"],
                title: "宝宝吐奶",
                summary: "先别慌！90%是生理性吐奶，不是生病。",
                svg: `<svg class="svg-icon" viewBox="0 0 240 120" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="240" height="120" fill="#f8fafc"/><path d="M40,80 Q60,50 80,80 Q100,50 120,80 Q140,50 160,80 Q180,50 200,80" stroke="#4a9eff" stroke-width="2" fill="none"/><circle cx="120" cy="40" r="8" fill="#ed8936"/><text x="120" y="30" text-anchor="middle" font-size="12" fill="#2d3748" font-family="sans-serif">宝宝</text><text x="120" y="110" text-anchor="middle" font-size="10" fill="#6a7380" font-family="sans-serif">竖抱15分钟 · 拍嗝3种姿势</text></svg>`,
                detail: "✅ 正确做法：喂完立刻竖抱，空心掌由下向上轻拍背部30秒；\n❌ 禁忌：平躺拍嗝、强行抠喉催吐、喂水冲淡胃酸。",
                warning: "⚠️ 若吐奶呈喷射状+体重不增+精神萎靡，请立即就医"
            },
            {
                keyword: ["脐带", "肚脐", "脱落"],
                title: "脐带护理",
                summary: "干爽是唯一原则，7–14天自然脱落。",
                svg: `<svg class="svg-icon" viewBox="0 0 240 120" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="240" height="120" fill="#f8fafc"/><circle cx="120" cy="60" r="20" fill="#ed8936"/><circle cx="120" cy="60" r="16" fill="#fff9f2"/><text x="120" y="45" text-anchor="middle" font-size="12" fill="#2d3748" font-family="sans-serif">脐带</text><text x="120" y="110" text-anchor="middle" font-size="10" fill="#6a7380" font-family="sans-serif">每天用酒精棉签擦1次 · 保持透气</text></svg>`,
                detail: "✅ 正确做法：洗澡后用75%酒精棉签螺旋消毒脐根，从内向外；\n❌ 禁忌：涂紫药水、包扎纱布、强行扯掉结痂。",
                warning: "⚠️ 若出现渗脓、红肿超1cm、发热，请24小时内就诊"
            },
            {
                keyword: ["黄疸", "皮肤黄", "眼白黄"],
                title: "新生儿黄疸",
                summary: "出生后2–3天出现，7天达峰，14天消退属正常。",
                svg: `<svg class="svg-icon" viewBox="0 0 240 120" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="240" height="120" fill="#f8fafc"/><circle cx="60" cy="50" r="12" fill="#ed8936"/><circle cx="120" cy="50" r="12" fill="#ed8936"/><circle cx="180" cy="50" r="12" fill="#ed8936"/><text x="120" y="30" text-anchor="middle" font-size="12" fill="#2d3748" font-family="sans-serif">测黄疸</text><text x="120" y="110" text-anchor="middle" font-size="10" fill="#6a7380" font-family="sans-serif">看眼白+按压额头 · 阳光下观察最准</text></svg>`,
                detail: "✅ 正确做法：每日晒太阳10分钟（避开直射眼）+ 勤喂奶促排便；\n❌ 禁忌：喝葡萄糖水、停母乳、用中药退黄。",
                warning: "⚠️ 若出生24小时内发黄、足底也黄、拒奶嗜睡，需立即查血"
            },
            {
                keyword: ["打喷嚏", "鼻塞", "呼吸声重"],
                title: "宝宝打喷嚏",
                summary: "不是感冒！是清理鼻腔的自我保护反射。",
                svg: `<svg class="svg-icon" viewBox="0 0 240 120" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="240" height="120" fill="#f8fafc"/><path d="M60,70 Q80,40 100,70 Q120,40 140,70 Q160,40 180,70" stroke="#4a9eff" stroke-width="2" fill="none"/><circle cx="120" cy="30" r="6" fill="#a0aec0"/><text x="120" y="25" text-anchor="middle" font-size="10" fill="#2d3748" font-family="sans-serif">鼻子</text><text x="120" y="110" text-anchor="middle" font-size="10" fill="#6a7380" font-family="sans-serif">用生理盐水滴鼻 + 吸鼻器轻吸</text></svg>`,
                detail: "✅ 正确做法：室温24℃+湿度50%，用婴儿专用吸鼻器；\n❌ 禁忌：用棉签捅鼻孔、捏鼻子止喷嚏、自行用滴鼻液。",
                warning: "⚠️ 若持续鼻塞伴吃奶困难、口唇发紫，需排查鼻腔畸形"
            },
            {
                keyword: ["湿疹", "脸红", "小红点"],
                title: "宝宝湿疹",
                summary: "保湿是核心！90%无需药膏，避免过度清洁。",
                svg: `<svg class="svg-icon" viewBox="0 0 240 120" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="240" height="120" fill="#f8fafc"/><circle cx="80" cy="60" r="10" fill="#ed8936"/><circle cx="120" cy="60" r="10" fill="#ed8936"/><circle cx="160" cy="60" r="10" fill="#ed8936"/><text x="120" y="45" text-anchor="middle" font-size="12" fill="#2d3748" font-family="sans-serif">湿疹区</text><text x="120" y="110" text-anchor="middle" font-size="10" fill="#6a7380" font-family="sans-serif">清水洗 · 无香乳液厚涂 · 剪短指甲</text></svg>`,
                detail: "✅ 正确做法：每日涂2次无香凡士林，洗澡水温≤37℃；\n❌ 禁忌：用热水烫洗、涂抹蜂蜜/母乳、擅自用激素药膏。",
                warning: "⚠️ 若破溃流水、发烧、皮疹蔓延躯干，需皮肤科面诊"
            },
            {
                keyword: ["疫苗", "打针", "红肿"],
                title: "接种后反应",
                summary: "局部红肿硬结是正常免疫反应，2–3天自行消退。",
                svg: `<svg class="svg-icon" viewBox="0 0 240 120" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="240" height="120" fill="#f8fafc"/><rect x="80" y="30" width="80" height="12" rx="6" fill="#4a9eff"/><circle cx="120" cy="70" r="12" fill="#ed8936"/><text x="120" y="55" text-anchor="middle" font-size="12" fill="#2d3748" font-family="sans-serif">针眼</text><text x="120" y="110" text-anchor="middle" font-size="10" fill="#6a7380" font-family="sans-serif">24h冷敷 · 48h热敷 · 忌揉搓</text></svg>`,
                detail: "✅ 正确做法：红肿处冷敷（毛巾裹冰袋）每次10分钟；\n❌ 禁忌：涂药膏、贴创可贴、口服退烧药预防发热。",
                warning: "⚠️ 若红肿＞5cm、持续发热＞48h、哭闹拒食，及时联系接种门诊"
            },
            {
                keyword: ["痱子", "脖子红", "褶皱处"],
                title: "新生儿痱子",
                summary: "汗腺未发育完全导致，保持干爽即愈，不传染。",
                svg: `<svg class="svg-icon" viewBox="0 0 240 120" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="240" height="120" fill="#f8fafc"/><circle cx="60" cy="60" r="4" fill="#ed8936"/><circle cx="90" cy="60" r="4" fill="#ed8936"/><circle cx="120" cy="60" r="4" fill="#ed8936"/><circle cx="150" cy="60" r="4" fill="#ed8936"/><circle cx="180" cy="60" r="4" fill="#ed8936"/><text x="120" y="45" text-anchor="middle" font-size="12" fill="#2d3748" font-family="sans-serif">痱子群</text><text x="120" y="110" text-anchor="middle" font-size="10" fill="#6a7380" font-family="sans-serif">勤擦脖子褶皱 · 穿纯棉连体衣 · 室温26℃</text></svg>`,
                detail: "✅ 正确做法：每次换尿布后用柔软棉布擦干颈部/腋下；\n❌ 禁忌：扑痱子粉、用酒精擦拭、穿化纤衣物。",
                warning: "⚠️ 若破溃渗液、伴随发烧，需排除细菌感染"
            }
        ];

        // DOM elements
        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');
        const themeToggle = document.getElementById('themeToggle');

        // Theme toggle
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Load saved theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-theme');
        }

        // Search logic
        function performSearch(query) {
            query = query.trim().toLowerCase();
            if (!query) return [];

            return cards.filter(card => {
                return card.keyword.some(k => k.toLowerCase().includes(query) || query.includes(k.toLowerCase()));
            });
        }

        // Render cards
        function renderCards(matchedCards) {
            if (matchedCards.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                        <h3 style="margin-top:16px;font-weight:600;">没找到相关卡片</h3>
                        <p>试试这些关键词：吐奶、脐带、黄疸、打喷嚏、湿疹、疫苗、痱子</p>
                    </div>
                `;
                return;
            }

            resultsContainer.innerHTML = matchedCards.map((card, idx) => `
                <div class="card" data-index="${idx}">
                    <div class="card-header">
                        <div class="card-title">${card.title}</div>
                        <div class="card-toggle"></div>
                    </div>
                    <div class="card-body">
                        <div class="card-summary">${card.summary}</div>
                        ${card.svg}
                        <div class="card-detail">${card.detail.replace(/\n/g, '<br>')}</div>
                        <div class="card-warning">${card.warning}</div>
                    </div>
                </div>
            `).join('');

            // Add toggle listeners
            document.querySelectorAll('.card-header').forEach(header => {
                header.addEventListener('click', () => {
                    const body = header.nextElementSibling;
                    const toggle = header.querySelector('.card-toggle');
                    body.classList.toggle('open');
                    toggle.classList.toggle('open');
                });
            });
        }

        // Initial render
        renderCards(cards);

        // Event listeners
        searchInput.addEventListener('input', () => {
            const query = searchInput.value;
            const matches = performSearch(query);
            renderCards(matches);
        });

        themeToggle.addEventListener('click', toggleTheme);
    </script>
</body>
</html>
