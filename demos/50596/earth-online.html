(function() {
  var canvas = document.getElementById('starsCanvas');
  var ctx = canvas.getContext('2d');
  var stars = [];
  var W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (var i = 0; i < 120; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.5 + 0.5,
      speed: Math.random() * 0.3 + 0.1,
      opacity: Math.random() * 0.6 + 0.4
    });
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);

      s.y += s.speed;
      if (s.y > H + 10) { s.y = -10; s.x = Math.random() * W; }
    }
    requestAnimationFrame(draw);
  }

})();

// Helper: clamp stat
function clamp(v) { return Math.max(0, Math.min(100, v)); }

// Helper: update stat with animation
function updateStat(key, delta) {
  stats[key] = clamp(stats[key] + delta);
  var el = document.getElementById('stat' + key.charAt(0).toUpperCase() + key.slice(1));
  var bar = document.getElementById('bar' + key.charAt(0).toUpperCase() + key.slice(1));
  if (el) el.textContent = stats[key];
  if (bar) bar.style.width = stats[key] + '%';
}

// Helper: show toast
function showToast(msg) {
  var toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(function() { toast.remove(); }, 2500);
}

// Helper: add log entry
function addLog(stage, msg, effects) {
  var entry = { stage: stage, msg: msg, effects: effects };
  logEntries.push(entry);
  var logDiv = document.getElementById('logEntries');
  var div = document.createElement('div');
  div.className = 'log-entry';
  var html = '<span class="log-stage">[' + stage + ']</span> ' + msg;
  for (var k in effects) {
    if (effects[k] > 0) html += ' <span class="log-up">+' + effects[k] + '</span>';
    else if (effects[k] < 0) html += ' <span class="log-down">' + effects[k] + '</span>';
  }
  div.innerHTML = html;
  logDiv.appendChild(div);
  logDiv.parentElement.scrollTop = logDiv.parentElement.scrollHeight;
}

// Render current stage
function renderStage() {
  if (currentStage >= stages.length) {
    showEnding();
    return;
  }

  var stage = stages[currentStage];
  document.getElementById('stageBadge').textContent = stage.name;
  document.getElementById('stageName').textContent = stage.chapter;
  document.getElementById('stageAge').textContent = '年龄: ' + stage.age;
  document.getElementById('narrativeText').innerHTML = stage.narrative;

  var choicesArea = document.getElementById('choicesArea');
  choicesArea.innerHTML = '';
  var letters = ['A', 'B', 'C'];
  for (var i = 0; i < stage.choices.length; i++) {
    (function(idx) {
      var choice = stage.choices[idx];
      var btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerHTML = '<span class="choice-letter">' + letters[idx] + '</span>' +
        '<span>' + choice.text + '</span>' +
        '<span class="choice-hint">[' + choice.hint + ']</span>';
      btn.addEventListener('click', function() {
        makeChoice(idx);
      });
      choicesArea.appendChild(btn);
    })(i);
  }

  // Scroll to top of game panel
  document.getElementById('gamePanel').scrollIntoView({ behavior: 'smooth' });
}

// Make a choice
function makeChoice(choiceIdx) {
  if (gameOver) return;
  var stage = stages[currentStage];
  var choice = stage.choices[choiceIdx];

  // Apply effects
  for (var k in choice.effects) {
    updateStat(k, choice.effects[k]);
  }

  // Add log
  addLog(stage.name, choice.log, choice.effects);

  // Show toast
  showToast('你的选择影响了命运轨迹…');

  // Advance stage
  currentStage++;
  setTimeout(function() {
    renderStage();
  }, 600);
}

// Show ending
function showEnding() {
  gameOver = true;
  document.getElementById('gamePanel').classList.add('hidden');
  var endingScreen = document.getElementById('endingScreen');
  endingScreen.classList.remove('hidden');

  var avg = (stats.health + stats.wealth + stats.happiness + stats.knowledge + stats.social) / 5;
  var title, rank, desc, quote;

  if (avg >= 80) {
    title = '🏆 人生赢家';
    rank = 'SSS 级人生';

    quote = '"人生不是要超越别人，而是要超越自己。"';

  } else {
    title = '💪 逆风前行';
    rank = 'C 级人生';
    desc = '你的人生充满挑战，命运似乎并不偏爱于你。但你从未放弃，在逆境中展现了非凡的勇气。';
    quote = '"真正的勇士，是在看清生活的真相后依然热爱生活。"';

  if (stats.knowledge >= 90) {

    rank = 'SS 级人生 · 学者';
    desc = '你以知识为剑，以智慧为盾，在学术或专业领域取得了卓越成就。你的思想将影响一代人。';
    quote = '"知识就是力量，智慧照亮人生。"';
  }
  if (stats.wealth >= 90) {
    title = '💎 财富传奇';
    rank = 'SS 级人生 · 富豪';
    desc = '你凭借敏锐的商业嗅觉和果断的决策，积累了惊人的财富。但财富只是工具，如何使用它才是关键。';
    quote = '"财富是通往价值的桥梁，而非终点。"';
  }
  if (stats.happiness >= 90) {
    title = '🌈 快乐至上';
    rank = 'SS 级人生 · 乐天派';
    desc = '你一生追求内心的快乐与满足，不为世俗所困。你的笑容感染了每一个遇见的人。';
    quote = '"快乐是一种选择，也是一种能力。"';
  }
  if (stats.social >= 90) {
    title = '🤝 人间天使';
    rank = 'SS 级人生 · 社交家';
    desc = '你以真诚和善良赢得了无数人的心。你的朋友圈遍天下，每一个与你相遇的人都感到温暖。';
    quote = '"真正的富足，是拥有爱与被爱的能力。"';
  }
  if (stats.health >= 90) {
    title = '🏃 生命长青';
    rank = 'SS 级人生 · 健康达人';
    desc = '你拥有令人羡慕的健康体魄，以充沛的精力享受了人生的每一个阶段。';
    quote = '"健康是1，其他都是后面的0。"';
  }

  document.getElementById('endingTitle').textContent = title;
  document.getElementById('endingRank').textContent = rank;
  document.getElementById('endingDesc').textContent = desc;
  document.getElementById('endingQuote').textContent = quote;

  // Stats summary
  var statNames = [
    { key: 'health', label: '健康', cls: 'stat-health', icon: '❤️' },
    { key: 'wealth', label: '财富', cls: 'stat-wealth', icon: '💰' },
    { key: 'happiness', label: '快乐', cls: 'stat-happiness', icon: '😊' },
    { key: 'knowledge', label: '知识', cls: 'stat-knowledge', icon: '📚' },
    { key: 'social', label: '社交', cls: 'stat-social', icon: '👥' }
  ];
  var statsHtml = '';
  for (var i = 0; i < statNames.length; i++) {
    var s = statNames[i];
    statsHtml += '<div class="ending-stat"><div>' + s.icon + '</div><div class="ending-stat-val" style="color:var(--' +
      (s.key === 'health' ? 'green' : s.key === 'wealth' ? 'gold' : s.key === 'happiness' ? 'accent2' : s.key === 'knowledge' ? 'blue' : 'purple') +
      ')">' + stats[s.key] + '</div><div class="ending-stat-lbl">' + s.label + '</div></div>';
  }
  document.getElementById('endingStats').innerHTML = statsHtml;

  endingScreen.scrollIntoView({ behavior: 'smooth' });
}

// Start game
function startGame() {
  var nameInput = document.getElementById('playerName');
  playerName = nameInput.value.trim() || '冒险者';
  if (playerName.length > 12) playerName = playerName.substring(0, 12);

  // Reset state
  stats = { health: 50, wealth: 50, happiness: 50, knowledge: 50, social: 50 };
  currentStage = 0;
  logEntries = [];
  gameOver = false;

  // Update all stats display
  for (var k in stats) {
    updateStat(k, 0);
  }

  // Clear log
  document.getElementById('logEntries').innerHTML = '';

  // Show game panel
  document.getElementById('titleScreen').classList.add('hidden');
  document.getElementById('gamePanel').classList.remove('hidden');
  document.getElementById('endingScreen').classList.add('hidden');

  showToast('欢迎，' + playerName + '！你的人生即将开始…');
  renderStage();
}

// Restart game
function restartGame() {
  document.getElementById('gamePanel').classList.add('hidden');
  document.getElementById('endingScreen').classList.add('hidden');
  document.getElementById('titleScreen').classList.remove('hidden');
  document.getElementById('playerName').value = '';
  document.getElementById('logEntries').innerHTML = '';
  stats = { health: 50, wealth: 50, happiness: 50, knowledge: 50, social: 50 };
  currentStage = 0;
  logEntries = [];
  gameOver = false;
  for (var k in stats) { updateStat(k, 0); }
  document.getElementById('titleScreen').scrollIntoView({ behavior: 'smooth' });
}
