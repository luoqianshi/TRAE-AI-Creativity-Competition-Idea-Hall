<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯方块</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">俄罗斯方块</h1>
        
        <div class="game-main">
            <div class="game-board-wrapper">
                <canvas id="gameBoard" width="300" height="600"></canvas>
                <div id="gameOverOverlay" class="overlay">
                    <div class="overlay-content">
                        <h2>游戏结束</h2>
                        <p>最终得分: <span id="finalScore">0</span></p>
                        <button onclick="game.restart()">重新开始</button>
                    </div>
                </div>
                <div id="pauseOverlay" class="overlay">
                    <div class="overlay-content">
                        <h2>游戏暂停</h2>
                        <button onclick="game.togglePause()">继续游戏</button>
                    </div>
                </div>
            </div>
            
            <div class="game-info">
                <div class="info-box">
                    <h3>分数</h3>
                    <p id="score">0</p>
                </div>
                
                <div class="info-box">
                    <h3>等级</h3>
                    <p id="level">1</p>
                </div>
                
                <div class="info-box">
                    <h3>消除行数</h3>
                    <p id="lines">0</p>
                </div>
                
                <div class="info-box">
                    <h3>最高分</h3>
                    <p id="highScore">0</p>
                </div>
                
                <div class="preview-box">
                    <h3>下一个</h3>
                    <canvas id="nextPiece" width="120" height="120"></canvas>
                </div>
                
                <div class="controls">
                    <button onclick="game.start()" id="startBtn">开始游戏</button>
                    <button onclick="game.togglePause()" id="pauseBtn" disabled>暂停</button>
                    <button onclick="game.restart()" id="restartBtn" disabled>重新开始</button>
                </div>
                
                <div class="instructions">
                    <h3>操作说明</h3>
                    <ul>
                        <li>← → 左右移动</li>
                        <li>↑ 旋转方块</li>
                        <li>↓ 加速下落</li>
                        <li>空格 快速下落</li>
                        <li>P 暂停/继续</li>
                    </ul>
                </div>
            </div>
        </div>
        
        <div class="mobile-controls">
            <div class="control-row">
                <button class="mobile-btn" onclick="game.rotate()">↑</button>
            </div>
            <div class="control-row">
                <button class="mobile-btn" onclick="game.moveLeft()">←</button>
                <button class="mobile-btn" onclick="game.moveDown()">↓</button>
                <button class="mobile-btn" onclick="game.moveRight()">→</button>
            </div>
            <div class="control-row">
                <button class="mobile-btn wide-btn" onclick="game.hardDrop()">快速下落</button>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
