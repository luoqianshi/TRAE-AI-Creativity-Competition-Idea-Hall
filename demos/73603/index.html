<body class="beautiful">

<div id="tb">
  <div class="brand">
    <div class="brand-icon">🎵</div>
    <div class="brand-text">
      <div class="brand-name" id="brandName">BlueDJ</div>
      <div class="brand-sub" id="brandSub"></div>
    </div>
  </div>
  <div class="tb-div"></div>
  <span id="folderBadge"></span>
  <button id="btnReauth" class="tb-btn" onclick="reauth()"></button>

  <div class="tb-center">
    <div class="mp-mini">
      <button class="mp-btn" onclick="mpPrev()" title="Prev">⏮</button>
      <button class="mp-btn" id="mpPlay" onclick="mpToggle()" title="Play">▶</button>
      <button class="mp-btn" onclick="mpNext()" title="Next">⏭</button>
      <span class="mp-now" id="mpNow" onclick="mpNext()"></span>
      <select class="mp-select" id="mpSelect" onchange="mpLoad(this.value,true)"></select>
      <input type="range" class="mp-progress" id="mpProgress" value="0" min="0" max="100" step="0.1" oninput="mpSeek(this.value)">
      <span class="mp-time" id="mpTime">0:00</span>
      <div class="mp-vol-wrap">
        <span class="mp-vol-ico">🔈</span>
        <input type="range" class="mp-vol" id="mpVol" value="60" min="0" max="100" oninput="mpSetVol(this.value)">
      </div>
    </div>
    <div class="timer-mini" id="timerMini">
      <span class="timer-mini-hint" id="timerHint"></span>
      <span class="timer-mini-count" id="timerCount">15:00</span>
      <button class="timer-mini-btn" id="timerToggleBtn" onclick="timerToggle()" title="Start / Pause">▶</button>
      <button class="timer-mini-btn" onclick="timerReset()" title="Reset">↺</button>
    </div>
  </div>

  <div class="tb-right">
    <button class="tb-btn ghost" id="btnMobileSb" onclick="toggleMobileSb()" title="Files" style="display:none">📁</button>
    <span id="tbDate"></span>
    <div class="tb-div"></div>
    <button class="tb-btn ghost" id="btnLayout" onclick="toggleTemplate()"></button>
    <button class="tb-btn ghost" id="btnLang" onclick="toggleLang()">EN</button>
    <button class="tb-btn ghost" onclick="toggleFS()">⛶</button>
    <button class="tb-btn ghost" id="btnMobilePv" onclick="toggleMobilePv()" title="Preview" style="display:none">👁</button>
    <button class="tb-btn primary" id="btnVault" onclick="selectFolder()"></button>
    <button class="tb-btn primary" id="btnExport" onclick="exportMD()"></button>
  </div>
</div>
<div class="mobile-overlay" id="mobileOverlay" onclick="closeMobileAll()"></div>
<div class="no-fs" id="noFsWarn"></div>

<div id="main">
  <aside id="sb">
    <div class="sb-hd">
      <span class="sb-lbl" id="sbLbl"></span>
      <div style="display:flex;gap:4px">
        <button class="btn-new" id="btnNewWeek" onclick="newWeeklyPlan()" title="Weekly Plan"></button>
        <button class="btn-new" id="btnNew" onclick="newToday()"></button>
      </div>
    </div>
    <div class="sb-folder-badge" id="sbFolderBadge"></div>
    <div id="fileList"></div>
    <div class="sb-ft">
      <button class="btn-save" id="btnSave" onclick="_editingSpecial?saveSpecialFile():_wkMode?saveWeeklyFile():saveFile()"></button>
      <div class="sb-sub" id="sbSub"></div>
    </div>
  </aside>

  <section id="fp">
   <div class="fi2" id="journalForm">
    <div class="fdb">
      <div class="fdb-top">
        <span class="fdb-title" id="fdbTitle"></span>
      </div>
      <div class="quote-inline" id="quoteCard">
        <span class="quote-qmark">"</span>
        <span class="quote-text-inline" id="quoteText"></span>
        <span class="quote-author-inline" id="quoteAuthor"></span>
      </div>
      <div class="fdb-date-row">
        <label for="jDate" id="lblDate"></label>
        <input type="date" id="jDate" oninput="onDateChange()">
      </div>
    </div>
    <div id="formSections"></div>
    <div class="author-footer">BlueDJ v1 · Alex Wang (wlei)</div>
   </div>
   <div class="fi2" id="weeklyForm" style="display:none">
    <div class="fdb">
      <div class="fdb-top">
        <span class="fdb-title" id="wkTitle"></span>
        <span id="wkBadge" style="font-size:11px;color:var(--muted);background:rgba(124,92,191,.1);padding:2px 8px;border-radius:10px"></span>
      </div>
    </div>
    <div id="weeklyFormSections"></div>
    <div class="author-footer">BlueDJ v1 · Weekly Plan</div>
   </div>
   <div class="md-editor" id="mdEditor">
    <div class="md-editor-hd">
      <span class="md-editor-icon" id="mdEditorIcon"></span>
      <span class="md-editor-title" id="mdEditorTitle"></span>
      <span class="md-editor-badge" id="mdEditorBadge">Markdown</span>
    </div>
    <textarea class="md-editor-ta" id="mdEditorTa" spellcheck="false"></textarea>
    <div class="md-editor-ft">
      <span class="md-char-count" id="mdCharCount"></span>
      <button class="md-copy-btn" id="mdCopyBtn" onclick="copyEditorContent()"></button>
      <button class="md-save-btn" id="mdSaveBtn" onclick="saveSpecialFile()"></button>
    </div>
   </div>
  </section>

  <aside id="pv">
    <div class="pvh">
      <span class="pvhl" id="pvLbl"></span>
      <div class="pvt">
        <button class="ptab on" id="ptR" onclick="setPv('r')"></button>
        <button class="ptab" id="ptRaw" onclick="setPv('raw')"></button>
        <button class="pv-fs-btn" id="btnPvFs" onclick="togglePvFs()" title="Fullscreen Preview">⛶</button>
        <button class="pv-close-mobile" id="btnPvClose" onclick="closeMobileAll()" title="Close">✕</button>
      </div>
    </div>
    <div id="pvR"></div>
    <div id="pvRaw"></div>
  </aside>
</div>
<div class="toast" id="toast"></div>
