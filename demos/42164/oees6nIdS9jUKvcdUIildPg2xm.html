<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f5f5;--cb:#fff;--ac:#E53E3E;--aclt:#FFF5F5;--tx:#2D3748;--txm:#718096;--bd:#E2E8F0;--rd:12px;--sh:0 2px 12px rgba(0,0,0,.08)}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;min-height:100dvh;padding-bottom:220px}
@keyframes sD{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
.header{background:var(--ac);padding:20px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(229,62,62,.25);animation:sD .5s ease-out}
.header-left{display:flex;align-items:center;gap:10px}
.header-icon{width:32px;height:32px;flex-shrink:0}
.header-icon svg,.header-timer .timer-icon svg{width:100%;height:100%}
.header-title{color:#fff;font-size:1.35rem;font-weight:700;letter-spacing:2px}
.header-timer{color:#fff;font-size:.9rem;font-weight:600;font-family:"SF Mono","Cascadia Code","Consolas","Menlo",monospace;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.2);padding:6px 14px;border-radius:20px;white-space:nowrap;display:flex;align-items:center;gap:6px;letter-spacing:.5px}
.header-timer .timer-icon{width:16px;height:16px;flex-shrink:0}
@keyframes bU{0%,100%{opacity:1}50%{opacity:.3}}
.header-timer.urgent{animation:bU 1s ease-in-out infinite;background:rgba(255,255,255,.35)}
.header-timer.empty{font-size:.8rem;font-weight:400;opacity:.85;font-family:inherit}
@keyframes fIU{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.main{max-width:600px;margin:0 auto;padding:16px;animation:fIU .5s .2s ease-out both}
.card{background:var(--cb);border-radius:var(--rd);box-shadow:var(--sh);padding:24px 20px;margin-bottom:16px}
.card-title{font-size:1.05rem;font-weight:700;color:var(--tx);margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid var(--ac);display:flex;align-items:center;gap:8px}
.card-title .dot{width:8px;height:8px;background:var(--ac);border-radius:50%;flex-shrink:0}
.form-row{display:flex;gap:12px;margin-bottom:16px}
.form-row:last-child{margin-bottom:0}
.form-group{flex:1;display:flex;flex-direction:column}
.form-group.half{flex:0 0 calc(50% - 6px)}
.form-label{font-size:.85rem;font-weight:600;color:var(--tx);margin-bottom:6px}
.form-label .required{color:var(--ac);margin-left:2px}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 14px;font-size:.95rem;font-family:inherit;border:1.5px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx);transition:border-color .2s,box-shadow .2s;outline:0;appearance:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(229,62,62,.1)}
.form-input::placeholder,.form-textarea::placeholder{color:#A0AEC0}
.form-select{padding:10px 14px;font-size:.95rem;font-family:inherit;border:1.5px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx);cursor:pointer;width:100%}
.form-textarea{resize:vertical;min-height:80px}
.form-hint{font-size:.75rem;color:var(--txm);margin-top:4px}
.photo-upload{display:flex;align-items:center;justify-content:center;flex-direction:column;width:100%;aspect-ratio:3/4;max-height:300px;border:2px dashed var(--bd);border-radius:10px;background:#FAFAFA;cursor:pointer;transition:border-color .2s,background .2s;overflow:hidden;position:relative}
.photo-upload:hover{border-color:var(--ac);background:var(--aclt)}
.photo-upload.has-photo{border-style:solid;border-color:var(--bd);cursor:default}
.photo-placeholder{display:flex;flex-direction:column;align-items:center;pointer-events:none}
.photo-upload.has-photo .photo-placeholder{display:none}
.photo-icon{color:var(--txm);margin-bottom:8px}
.photo-text{color:var(--txm);font-size:.9rem}
.photo-sub{color:#A0AEC0;font-size:.75rem;margin-top:4px}
.photo-preview{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.photo-delete{position:absolute;top:8px;right:8px;width:28px;height:28px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%;font-size:1rem;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:2;transition:background .2s}
.photo-delete:hover{background:rgba(229,62,62,.85)}
.photo-upload.has-photo .photo-delete{display:flex}
.key-preview{margin-top:10px;padding:10px 14px;background:var(--aclt);border:1px solid #FED7D7;border-radius:8px;font-size:.85rem;line-height:1.7;color:var(--tx);min-height:36px;word-break:break-all}
.key-preview:empty::before{content:'输入特征描述后，关键信息将在此高亮显示';color:#A0AEC0}
.key-preview .hl{color:#E53E3E;font-weight:700}
.location-row{display:flex;gap:8px}
.location-row .form-input{flex:1}
.btn-locate{flex-shrink:0;padding:10px 14px;font-size:.85rem;font-weight:600;font-family:inherit;background:#fff;color:var(--ac);border:1.5px solid var(--ac);border-radius:8px;cursor:pointer;white-space:nowrap;transition:background .2s}
.btn-locate:hover{background:var(--aclt)}
.btn-locate:active{transform:scale(.97)}
.btn-locate.loading{opacity:.7;pointer-events:none}
.locate-hint{font-size:.75rem;color:var(--txm);margin-top:4px}
.actions{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.06);display:flex;gap:12px;z-index:100}
.actions-inner{max-width:600px;margin:0 auto;display:flex;gap:12px;width:100%}
.btn{flex:1;padding:14px 20px;font-size:1rem;font-weight:600;font-family:inherit;border-radius:10px;border:0;cursor:pointer;transition:transform .15s,box-shadow .15s,opacity .2s;display:flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.5px}
.btn:active{transform:scale(.97)}
.btn.loading{opacity:.7;pointer-events:none}
.btn.loading::after{content:'';width:16px;height:16px;border:2px solid transparent;border-top-color:currentColor;border-radius:50%;animation:sp .6s linear infinite;margin-left:8px;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.btn-primary{background:var(--ac);color:#fff;box-shadow:0 4px 14px rgba(229,62,62,.35)}
.btn-primary:hover{box-shadow:0 6px 20px rgba(229,62,62,.45)}
.btn-secondary{background:#fff;color:var(--ac);border:2px solid var(--ac)}
.btn-secondary:hover{background:var(--aclt)}
.info-banner{display:flex;align-items:center;gap:8px;background:#FFFBEB;border:1px solid #FBD38D;border-radius:8px;padding:10px 14px;font-size:.8rem;color:#975A16;margin-bottom:16px;line-height:1.5}
.info-banner svg{flex-shrink:0}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:var(--rd);width:100%;max-width:500px;margin:16px auto;padding:20px;position:relative;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.modal-close{position:absolute;top:12px;right:14px;width:32px;height:32px;background:rgba(0,0,0,.06);border:0;border-radius:50%;font-size:1.2rem;color:var(--txm);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;transition:background .2s}
.modal-close:hover{background:rgba(0,0,0,.12)}
.modal-title{font-size:1.1rem;font-weight:700;color:var(--tx);margin-bottom:16px;text-align:center}
.modal-card-preview{width:100%;border-radius:8px;display:block;box-shadow:0 2px 12px rgba(0,0,0,.12);margin-bottom:16px}
.modal-actions{display:flex;gap:10px}
.modal-actions .btn{flex:1;padding:12px 16px;font-size:.9rem}
.modal-hint{text-align:center;font-size:.75rem;color:var(--txm);margin-top:10px}
.btn-copy{width:100%;padding:12px 16px;font-size:.9rem;font-weight:600;font-family:inherit;border-radius:10px;border:2px dashed var(--bd);background:#FAFAFA;color:var(--tx);cursor:pointer;margin-bottom:12px;transition:border-color .2s,background .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-copy:hover{border-color:var(--ac);background:var(--aclt);color:var(--ac)}
.btn-copy:active{transform:scale(.98)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:#2D3748;color:#fff;padding:12px 24px;border-radius:10px;font-size:.9rem;font-weight:600;z-index:300;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.privacy-section{max-width:600px;margin:0 auto 16px;padding:0 16px}
.privacy-toggle{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--txm);background:0;border:0;cursor:pointer;padding:8px 0;font-family:inherit;transition:color .2s}
.privacy-toggle:hover{color:var(--ac)}
.privacy-toggle .arrow{display:inline-block;transition:transform .2s;font-size:.7rem}
.privacy-toggle.open .arrow{transform:rotate(180deg)}
.privacy-content{display:none;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:14px 16px;font-size:.8rem;color:var(--txm);line-height:1.8;margin-bottom:12px}
.privacy-content.open{display:block}
.privacy-content p{margin-bottom:4px}
.privacy-content p:last-child{margin-top:8px;color:var(--tx);font-weight:500}
.btn-clear{display:block;width:100%;padding:8px;font-size:.75rem;color:#A0AEC0;background:0;border:1px dashed #E2E8F0;border-radius:6px;cursor:pointer;font-family:inherit;transition:color .2s,border-color .2s}
.btn-clear:hover{color:#E53E3E;border-color:#E53E3E}
@media(max-width:767px){.header{padding:16px 14px}.header-title{font-size:1.2rem}.main{padding:12px}.card{padding:18px 14px}.form-row{flex-direction:column;gap:0}.form-group{margin-bottom:14px}.form-group.half{flex:1}}
@media(min-width:768px){.main{padding:24px 16px}.card{padding:28px 28px}.photo-upload{max-height:340px}}
</style>
</head>
<body>
<header class="header">
<div class="header-left">
<div class="header-icon"><svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="14" fill="none" stroke="white" stroke-width="2.5"/><path d="M16 8v10M16 22v1" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg></div>

<span id="tT">--</span>

<main class="main">
<div class="info-banner"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#975A16" stroke-width="1.5"/><path d="M8 4v5M8 11v1" stroke="#975A16" stroke-width="1.5" stroke-linecap="round"/></svg><span>所有数据仅在您的浏览器中处理，照片不会上传到任何服务器</span></div>

</div>
</div>
<div class="card">

<div class="form-row"><div class="form-group half"><label class="form-label">姓名<span class="required">*</span></label><input type="text" class="form-input" id="nm" placeholder="走失者姓名"></div><div class="form-group half"><label class="form-label">年龄<span class="required">*</span></label><input type="number" class="form-input" id="ag" placeholder="岁" min="0" max="150"></div></div>
<div class="form-row"><div class="form-group half"><label class="form-label">性别<span class="required">*</span></label><select class="form-select" id="gd"><option value="" disabled selected>请选择</option><option value="男">男</option><option value="女">女</option></select></div><div class="form-group half"><label class="form-label">身高</label><input type="text" class="form-input" id="ht" placeholder="如168cm"></div></div>

<div class="form-group" style="margin-bottom:0"><label class="form-label">走失地点<span class="required">*</span></label><div class="location-row"><input type="text" class="form-input" id="mL" placeholder="如XX市XX区XX路XX小区附近"><button type="button" class="btn-locate" id="bL"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="vertical-align:-2px"><circle cx="7" cy="7" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M7 1v2M7 11v2M1 7h2M11 7h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>获取当前位置</button></div><div class="locate-hint" id="lH"></div></div>

<div class="form-hint" style="margin-top:6px;display:flex;align-items:center;gap:4px"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="5" stroke="#718096" stroke-width="1"/><path d="M6 3.5v3M6 8.5v.5" stroke="#718096" stroke-width="1" stroke-linecap="round"/></svg>建议留两个号码，以防占线</div>

</main>

</div></div>
<div class="privacy-section">

<button class="btn-clear" id="bClr">清除所有数据</button>
</div>
<div class="modal-overlay" id="mO">
<div class="modal">
<button class="modal-close" id="mC">&times;</button>

</div>
</div>

<script>
var $=function(id){return document.getElementById(id)};
var pU=$('pU'),pI=$('pI'),pP=$('pP'),pD=$('pD'),pb=null;
pU.onclick=function(e){if(e.target!==pD)pI.click()};
pI.onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){pb=e.target.result;pP.src=pb;pP.style.display='block';pU.classList.add('has-photo')};r.readAsDataURL(f)};
pD.onclick=function(e){e.stopPropagation();pb=null;pP.src='';pP.style.display='none';pU.classList.remove('has-photo');pI.value=''};

var cW=['红','蓝','黑','白','黄','绿','花','灰','紫','棕','橙','粉'];
var cL=['上衣','裤子','帽子','鞋','外套','羽绒服','衬衫','T恤','t恤','夹克','毛衣','卫衣','马甲','围巾','手套','袜子','裙子','短裤','长裤','棉袄','大衣','风衣','西服','中山装','运动服','校服'];
$('ft').oninput=function(){$('kP').innerHTML=hl(this.value)};
function hl(t){if(!t.trim())return '';var w=[...cW,...cL].sort(function(a,b){return b.length-a.length});var r=t,u=new Set(),d=document.createElement('div');d.textContent=r;r=d.innerHTML;w.forEach(function(wd){var e=wd.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');r=r.replace(new RegExp(e,'gi'),function(m){if(u.has(m))return m;u.add(m);return'<span class="hl">'+m+'</span>'})});return r}
