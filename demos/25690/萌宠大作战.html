<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萌宠大作战 - 趣味学习闯关</title>
    <style>
        /* ========== 全局样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --grass: #90EE90;
            --grass-dark: #4CAF50;
            --water: #87CEEB;
            --water-dark: #2196F3;
            --desert: #DEB887;
            --desert-dark: #D2691E;
            --mountain: #DDA0DD;
            --mountain-dark: #9932CC;
            --gold: #FFD700;
            --pink: #FFB6C1;
            --pet-color: #FF6B6B;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(180deg, #87CEEB 0%, #98D8C8 50%, #90EE90 100%);
        }

        /* ========== 页面容器 ========== */
        .page {
            display: none;
            min-height: 100vh;
            padding: 20px;
            animation: fadeIn 0.4s ease;
        }

        .page.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== 开始页面 ========== */
        #startPage {
            justify-content: center;
            background: linear-gradient(180deg, #87CEEB 0%, #90EE90 100%);
        }

        .game-title {
            font-size: 3rem;
            font-weight: bold;
            color: #FF6B6B;
            text-shadow: 3px 3px 0 #fff, 5px 5px 0 rgba(0,0,0,0.1);
            margin-bottom: 20px;
            animation: titleBounce 2s ease-in-out infinite;
        }

        @keyframes titleBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 40px;
        }

        /* ========== 萌宠CSS绘制 ========== */
        .pet-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 30px 0;
        }

        .pet {
            position: absolute;
            width: 120px;
            height: 120px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            animation: petFloat 3s ease-in-out infinite;
        }

        @keyframes petFloat {
            0%, 100% { transform: translate(-50%, -50%) translateY(0); }
            50% { transform: translate(-50%, -50%) translateY(-15px); }
        }

        /* 萌宠身体 */
        .pet-body {
            position: absolute;
            width: 100px;
            height: 90px;
            background: var(--pet-color);
            border-radius: 50px 50px 40px 40px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.1);
        }

        /* 萌宠脸部 */
        .pet-face {
            position: absolute;
            width: 80px;
            height: 60px;
            background: #fff;
            border-radius: 40px;
            left: 50%;
            top: 30%;
            transform: translateX(-50%);
        }

        /* 眼睛 */
        .pet-eyes {
            position: absolute;
            display: flex;
            gap: 20px;
            left: 50%;
            top: 35%;
            transform: translateX(-50%);
        }

        .pet-eye {
            width: 16px;
            height: 20px;
            background: #333;
            border-radius: 50%;
            animation: blink 3s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        /* 嘴巴 */
        .pet-mouth {
            position: absolute;
            width: 20px;
            height: 10px;
            border-bottom: 3px solid #333;
            border-radius: 0 0 10px 10px;
            left: 50%;
            top: 55%;
            transform: translateX(-50%);
        }

        /* 腮红 */
        .pet-cheek {
            position: absolute;
            width: 15px;
            height: 10px;
            background: rgba(255, 107, 107, 0.5);
            border-radius: 50%;
            top: 50%;
        }

        .pet-cheek.left { left: 5px; }
        .pet-cheek.right { right: 5px; }

        /* 耳朵 */
        .pet-ear {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 25px solid var(--pet-color);
            top: 5px;
        }

        .pet-ear.left { left: 15px; transform: rotate(-15deg); }
        .pet-ear.right { right: 15px; transform: rotate(15deg); }

        /* 爪子 */
        .pet-paws {
            position: absolute;
            display: flex;
            gap: 30px;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
        }

        .pet-paw {
            width: 20px;
            height: 15px;
            background: var(--pet-color);
            border-radius: 50%;
        }

        /* 尾巴 */
        .pet-tail {
            position: absolute;
            width: 15px;
            height: 40px;
            background: var(--pet-color);
            border-radius: 10px;
            right: 5px;
            bottom: 30px;
            transform-origin: bottom center;
            animation: tailWag 0.5s ease-in-out infinite alternate;
        }

        @keyframes tailWag {
            from { transform: rotate(-20deg); }
            to { transform: rotate(20deg); }
        }

        /* 萌宠带奖杯状态 */
        .pet.victory .pet-body {
            background: linear-gradient(135deg, #FFD700, #FFA500);
        }

        .pet.victory .trophy {
            display: block;
        }

        .trophy {
            display: none;
            position: absolute;
            width: 50px;
            height: 60px;
            top: -30px;
            right: -10px;
            animation: trophyBounce 0.6s ease infinite;
        }

        @keyframes trophyBounce {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        .trophy-cup {
            width: 40px;
            height: 35px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border-radius: 5px 5px 20px 20px;
            margin: 0 auto;
            position: relative;
        }

        .trophy-handle {
            position: absolute;
            width: 12px;
            height: 20px;
            border: 4px solid #FFD700;
            border-left: none;
            border-radius: 0 10px 10px 0;
            top: 5px;
        }

        .trophy-handle.left { left: -12px; }
        .trophy-handle.right { right: -12px; border-left: 4px solid #FFD700; border-right: none; border-radius: 10px 0 0 10px; }

        .trophy-base {
            width: 30px;
            height: 8px;
            background: #FFD700;
            margin: 0 auto;
            border-radius: 3px;
        }

        .trophy-stem {
            width: 10px;
            height: 12px;
            background: #FFD700;
            margin: 0 auto;
        }

        .trophy-star {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            color: #fff;
        }

        /* 努力奋斗状态 */
        .pet.studying .pet-body {
            animation: studyShake 0.5s ease-in-out infinite;
        }

        @keyframes studyShake {
            0%, 100% { transform: translate(-50%, -50%) rotate(0); }
            25% { transform: translate(-50%, -50%) rotate(-3deg); }
            75% { transform: translate(-50%, -50%) rotate(3deg); }
        }

        /* 开始按钮 */
        .btn {
            padding: 15px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #E55A5A, 0 8px 15px rgba(0,0,0,0.2);
            transition: all 0.1s ease;
            margin: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #E55A5A, 0 10px 20px rgba(0,0,0,0.25);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #E55A5A, 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #4CAF50, #8BC34A);
            box-shadow: 0 6px 0 #388E3C, 0 8px 15px rgba(0,0,0,0.2);
        }

        .btn-secondary:hover {
            box-shadow: 0 8px 0 #388E3C, 0 10px 20px rgba(0,0,0,0.25);
        }

        .btn-secondary:active {
            box-shadow: 0 2px 0 #388E3C, 0 4px 10px rgba(0,0,0,0.2);
        }

        /* ========== 地图页面 ========== */
        #mapPage {
            padding-top: 10px;
        }

        .map-header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(255,255,255,0.9);
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .total-stars {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #FF9800;
        }

        .star-icon {
            font-size: 1.5rem;
        }

        .back-btn {
            padding: 8px 20px;
            font-size: 1rem;
            background: #eee;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        .terrain-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        .terrain-card {
            width: 380px;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }

        .terrain-card:hover {
            transform: translateY(-5px);
        }

        .terrain-card.grass { background: linear-gradient(135deg, #90EE90, #98D8C8); }
        .terrain-card.water { background: linear-gradient(135deg, #87CEEB, #4FC3F7); }
        .terrain-card.desert { background: linear-gradient(135deg, #DEB887, #D2B48C); }
        .terrain-card.mountain { background: linear-gradient(135deg, #DDA0DD, #CE93D8); }

        .terrain-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .terrain-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .terrain-info h3 {
            font-size: 1.4rem;
            color: #333;
        }

        .terrain-info p {
            font-size: 0.9rem;
            color: #666;
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .level-btn {
            position: relative;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .level-btn:hover:not(.locked) {
            transform: scale(1.1);
        }

        .level-btn.locked {
            background: #ccc;
            cursor: not-allowed;
        }

        .level-btn .level-num {
            font-size: 1.2rem;
            color: #333;
        }

        .level-btn .level-icon {
            font-size: 1.5rem;
            margin-top: 2px;
        }

        /* 三星奖杯 */
        .stars-display {
            display: flex;
            gap: 2px;
            margin-top: 3px;
        }

        .stars-display .star {
            color: #ddd;
            font-size: 0.7rem;
        }

        .stars-display .star.earned {
            color: #FFD700;
        }

        /* 锁图标 */
        .lock-icon {
            font-size: 1.5rem;
        }

        /* 地形装饰 */
        .terrain-deco {
            position: absolute;
            font-size: 2rem;
            opacity: 0.3;
        }

        .grass .terrain-deco.tree1 { top: 10px; right: 20px; }
        .grass .terrain-deco.flower { bottom: 10px; left: 20px; }
        .water .terrain-deco.wave1 { top: 10px; right: 20px; }
        .water .terrain-deco.lotus { bottom: 10px; left: 20px; }
        .desert .terrain-deco.cactus { top: 10px; right: 20px; }
        .desert .terrain-deco.dune { bottom: 10px; left: 20px; }
        .mountain .terrain-deco.peak { top: 10px; right: 20px; }
        .mountain .terrain-deco.snow { bottom: 10px; left: 20px; }

        /* ========== 答题页面 ========== */
        #quizPage {
            justify-content: flex-start;
            padding-top: 20px;
        }

        .quiz-header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .quiz-level {
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
        }

        .quiz-progress {
            display: flex;
            gap: 8px;
        }

        .progress-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ddd;
        }

        .progress-dot.current {
            background: #4CAF50;
            animation: pulse 1s ease infinite;
        }

        .progress-dot.correct {
            background: #4CAF50;
        }

        .progress-dot.wrong {
            background: #f44336;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* 萌宠答题状态 */
        .quiz-pet-area {
            margin: 20px 0;
        }

        .quiz-pet-area .pet {
            width: 100px;
            height: 100px;
        }

        .quiz-pet-area .pet-body {
            width: 80px;
            height: 70px;
        }

        .quiz-pet-area .pet-face {
            width: 60px;
            height: 45px;
        }

        .quiz-pet-area .pet-eyes {
            top: 30%;
            gap: 15px;
        }

        .quiz-pet-area .pet-eye {
            width: 12px;
            height: 15px;
        }

        .quiz-pet-area .pet-ear {
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 20px solid var(--pet-color);
        }

        .pet-cheer {
            position: absolute;
            font-size: 2rem;
            animation: cheerBounce 0.5s ease infinite alternate;
        }

        .pet-cheer.left { top: 0; left: -20px; }
        .pet-cheer.right { top: 0; right: -20px; }

        @keyframes cheerBounce {
            from { transform: translateY(0) rotate(-10deg); }
            to { transform: translateY(-10px) rotate(10deg); }
        }

        /* 题目卡片 */
        .question-card {
            width: 100%;
            max-width: 550px;
            background: #fff;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            margin-bottom: 25px;
        }

        .question-text {
            font-size: 1.4rem;
            text-align: center;
            color: #333;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            padding: 18px 15px;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #f5f5f5, #fff);
            border: 3px solid #eee;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .option-btn:hover {
            border-color: #FF6B6B;
            background: #fff0f0;
        }

        .option-btn.selected {
            border-color: #FF6B6B;
            background: #FFEBEE;
        }

        .option-btn.correct {
            border-color: #4CAF50;
            background: #E8F5E9;
        }

        .option-btn.wrong {
            border-color: #f44336;
            background: #FFEBEE;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        /* ========== 结算页面 ========== */
        #resultPage {
            justify-content: center;
        }

        .result-card {
            background: #fff;
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
        }

        .result-title {
            font-size: 2rem;
            color: #333;
            margin-bottom: 10px;
        }

        .result-subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
        }

        .result-pet {
            width: 180px;
            height: 180px;
            margin: 0 auto 30px;
        }

        .result-pet .pet {
            width: 150px;
            height: 150px;
        }

        .result-pet .pet-body {
            width: 120px;
            height: 110px;
        }

        .result-pet .trophy {
            width: 60px;
            height: 70px;
            top: -35px;
            right: -5px;
        }

        .result-pet .trophy-cup {
            width: 50px;
            height: 45px;
        }

        .result-pet .trophy-star {
            font-size: 24px;
            top: -15px;
        }

        .result-stars {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .result-star {
            font-size: 3rem;
            opacity: 0;
            transform: scale(0);
            animation: starPop 0.5s ease forwards;
        }

        .result-star:nth-child(1) { animation-delay: 0.2s; }
        .result-star:nth-child(2) { animation-delay: 0.4s; }
        .result-star:nth-child(3) { animation-delay: 0.6s; }

        .result-star.empty { color: #ddd; }
        .result-star.earned { color: #FFD700; }

        @keyframes starPop {
            0% { opacity: 0; transform: scale(0) rotate(-180deg); }
            50% { transform: scale(1.3) rotate(10deg); }
            100% { opacity: 1; transform: scale(1) rotate(0); }
        }

        .result-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .game-title { font-size: 2rem; }
            .terrain-card { width: 100%; max-width: 400px; }
            .levels-grid { grid-template-columns: repeat(4, 1fr); gap: 10px; }
            .level-btn { width: 60px; height: 60px; }
            .options-grid { grid-template-columns: 1fr; }
            .question-text { font-size: 1.2rem; }
        }

        @media (max-width: 480px) {
            .page { padding: 15px; }
            .terrain-container { gap: 15px; }
            .terrain-card { padding: 15px; }
            .terrain-icon { width: 50px; height: 50px; font-size: 1.5rem; }
            .level-btn { width: 55px; height: 55px; font-size: 0.75rem; }
            .quiz-header { padding: 10px 15px; }
        }
    </style>
</head>
<body>
    <!-- ========== 开始页面 ========== -->
    <div id="startPage" class="page active">
        <h1 class="game-title">萌宠大作战</h1>
        <p class="subtitle">趣味学习 快乐闯关</p>

        <div class="pet-container">
            <div class="pet" id="startPet">
                <div class="pet-ear left"></div>
                <div class="pet-ear right"></div>
                <div class="pet-body">
                    <div class="pet-face">
                        <div class="pet-eyes">
                            <div class="pet-eye"></div>
                            <div class="pet-eye"></div>
                        </div>
                        <div class="pet-mouth"></div>
                        <div class="pet-cheek left"></div>
                        <div class="pet-cheek right"></div>
                    </div>
                </div>
                <div class="pet-paws">
                    <div class="pet-paw"></div>
                    <div class="pet-paw"></div>
                </div>
                <div class="pet-tail"></div>
            </div>
        </div>

        <button class="btn" onclick="startGame()">开始闯关</button>
    </div>

    <!-- ========== 地图页面 ========== -->
    <div id="mapPage" class="page">
        <div class="map-header">
            <div class="total-stars">
                <span class="star-icon">⭐</span>
                <span id="totalStars">0</span> / 48 星
            </div>
            <button class="back-btn" onclick="showPage('startPage')">返回</button>
        </div>

        <div class="terrain-container">
            <!-- 草地 -->
            <div class="terrain-card grass">
                <span class="terrain-deco tree1">🌳</span>
                <span class="terrain-deco flower">🌸</span>
                <div class="terrain-header">
                    <div class="terrain-icon">🌿</div>
                    <div class="terrain-info">
                        <h3>青青草地</h3>
                        <p>小学语文·数学</p>
                    </div>
                </div>
                <div class="levels-grid" id="grassLevels"></div>
            </div>

            <!-- 水泊 -->
            <div class="terrain-card water">
                <span class="terrain-deco wave1">🌊</span>
                <span class="terrain-deco lotus">🪷</span>
                <div class="terrain-header">
                    <div class="terrain-icon">💧</div>
                    <div class="terrain-info">
                        <h3>清凉水泊</h3>
                        <p>小学英语·自然</p>
                    </div>
                </div>
                <div class="levels-grid" id="waterLevels"></div>
            </div>

            <!-- 沙漠 -->
            <div class="terrain-card desert">
                <span class="terrain-deco cactus">🌵</span>
                <span class="terrain-deco dune">🏜️</span>
                <div class="terrain-header">
                    <div class="terrain-icon">☀️</div>
                    <div class="terrain-info">
                        <h3>金色沙漠</h3>
                        <p>初中数学·英语</p>
                    </div>
                </div>
                <div class="levels-grid" id="desertLevels"></div>
            </div>

            <!-- 高山 -->
            <div class="terrain-card mountain">
                <span class="terrain-deco peak">🏔️</span>
                <span class="terrain-deco snow">❄️</span>
                <div class="terrain-header">
                    <div class="terrain-icon">⭐</div>
                    <div class="terrain-info">
                        <h3>巍巍高山</h3>
                        <p>初中物理·化学</p>
                    </div>
                </div>
                <div class="levels-grid" id="mountainLevels"></div>
            </div>
        </div>
    </div>

    <!-- ========== 答题页面 ========== -->
    <div id="quizPage" class="page">
        <div class="quiz-header">
            <div class="quiz-level" id="quizLevelName">第1关</div>
            <div class="quiz-progress" id="quizProgress"></div>
        </div>

        <div class="quiz-pet-area">
            <div class="pet studying" id="quizPet">
                <div class="pet-cheer left">💪</div>
                <div class="pet-cheer right">✨</div>
                <div class="pet-ear left"></div>
                <div class="pet-ear right"></div>
                <div class="pet-body">
                    <div class="pet-face">
                        <div class="pet-eyes">
                            <div class="pet-eye"></div>
                            <div class="pet-eye"></div>
                        </div>
                        <div class="pet-mouth"></div>
                        <div class="pet-cheek left"></div>
                        <div class="pet-cheek right"></div>
                    </div>
                </div>
                <div class="pet-paws">
                    <div class="pet-paw"></div>
                    <div class="pet-paw"></div>
                </div>
                <div class="pet-tail"></div>
            </div>
        </div>

        <div class="question-card">
            <div class="question-text" id="questionText">题目加载中...</div>
            <div class="options-grid" id="optionsGrid"></div>
        </div>
    </div>

    <!-- ========== 结算页面 ========== -->
    <div id="resultPage" class="page">
        <div class="result-card">
            <h2 class="result-title" id="resultTitle">恭喜过关!</h2>
            <p class="result-subtitle" id="resultSubtitle">获得3颗星</p>

            <div class="result-pet">
                <div class="pet victory" id="resultPet">
                    <div class="trophy">
                        <div class="trophy-star">🏆</div>
                        <div class="trophy-cup">
                            <div class="trophy-handle left"></div>
                            <div class="trophy-handle right"></div>
                        </div>
                        <div class="trophy-stem"></div>
                        <div class="trophy-base"></div>
                    </div>
                    <div class="pet-ear left"></div>
                    <div class="pet-ear right"></div>
                    <div class="pet-body">
                        <div class="pet-face">
                            <div class="pet-eyes">
                                <div class="pet-eye"></div>
                                <div class="pet-eye"></div>
                            </div>
                            <div class="pet-mouth" style="width:30px;height:15px;border-radius:0 0 15px 15px;"></div>
                            <div class="pet-cheek left"></div>
                            <div class="pet-cheek right"></div>
                        </div>
                    </div>
                    <div class="pet-paws">
                        <div class="pet-paw"></div>
                        <div class="pet-paw"></div>
                    </div>
                    <div class="pet-tail"></div>
                </div>
            </div>

            <div class="result-stars" id="resultStars"></div>

            <div class="result-buttons">
                <button class="btn" id="nextLevelBtn" onclick="goToNextLevel()">下一关</button>
                <button class="btn btn-secondary" onclick="showPage('mapPage')">返回地图</button>
            </div>
        </div>
    </div>

    <script>
        // ========== 游戏数据 ==========
        const LEVELS_PER_TERRAIN = 4;
        const QUESTIONS_PER_LEVEL = 3;

        const QUESTIONS = {
            grass: [
                // 关卡1-4
                [
                    { q: "1 + 1 = ?", o: ["1", "2", "3", "4"], a: 1 },
                    { q: "3 + 5 = ?", o: ["6", "7", "8", "9"], a: 2 },
                    { q: "10 - 4 = ?", o: ["5", "6", "7", "8"], a: 1 }
                ],
                [
                    { q: "\"春\"字有几笔？", o: ["7笔", "8笔", "9笔", "10笔"], a: 2 },
                    { q: "\"日\"字是什么结构？", o: ["上下结构", "左右结构", "独体字", "半包围"], a: 2 },
                    { q: "2 × 6 = ?", o: ["10", "11", "12", "13"], a: 2 }
                ],
                [
                    { q: "25 + 37 = ?", o: ["61", "62", "63", "64"], a: 1 },
                    { q: "100 - 58 = ?", o: ["40", "41", "42", "43"], a: 2 },
                    { q: "15 × 4 = ?", o: ["50", "55", "60", "65"], a: 2 }
                ],
                [
                    { q: "\"学习\"的近义词是？", o: ["玩耍", "读书", "睡觉", "吃饭"], a: 1 },
                    { q: "72 ÷ 8 = ?", o: ["7", "8", "9", "10"], a: 2 },
                    { q: "我国首都在哪里？", o: ["上海", "广州", "北京", "深圳"], a: 2 }
                ]
            ],
            water: [
                // 关卡5-8
                [
                    { q: "Apple的中文意思是？", o: ["香蕉", "苹果", "橙子", "葡萄"], a: 1 },
                    { q: "One + One = ?", o: ["One", "Two", "Three", "Four"], a: 1 },
                    { q: "Dog是哪种动物？", o: ["猫", "狗", "鸟", "鱼"], a: 1 }
                ],
                [
                    { q: "水在多少度会结冰？", o: ["0℃", "10℃", "-10℃", "100℃"], a: 0 },
                    { q: "太阳从哪边升起？", o: ["西边", "南边", "东边", "北边"], a: 2 },
                    { q: "Book的中文意思是？", o: ["书本", "桌子", "椅子", "窗户"], a: 0 }
                ],
                [
                    { q: "Three × Two = ?", o: ["Four", "Five", "Six", "Seven"], a: 2 },
                    { q: "下列哪个是哺乳动物？", o: ["鱼", "鸟", "狗", "蛇"], a: 2 },
                    { q: "Flower的中文意思是？", o: ["树叶", "花朵", "树枝", "树根"], a: 1 }
                ],
                [
                    { q: "地球自转一周是多长时间？", o: ["24小时", "30天", "365天", "12小时"], a: 0 },
                    { q: "Moon的中文意思是？", o: ["星星", "太阳", "月亮", "云彩"], a: 2 },
                    { q: "植物需要什么才能生长？", o: ["泥土", "塑料", "石头", "铁"], a: 0 }
                ]
            ],
            desert: [
                // 关卡9-12
                [
                    { q: "解方程：x + 5 = 12", o: ["x=6", "x=7", "x=8", "x=9"], a: 1 },
                    { q: "2x = 10，x = ?", o: ["3", "4", "5", "6"], a: 2 },
                    { q: "What is your name? 意思是？", o: ["你几岁", "你叫什么", "你去哪", "你好吗"], a: 1 }
                ],
                [
                    { q: "I am a student. 中student的意思是？", o: ["老师", "学生", "医生", "警察"], a: 1 },
                    { q: "三角形内角和是？", o: ["180°", "270°", "360°", "90°"], a: 0 },
                    { q: "解方程：x - 3 = 7", o: ["x=8", "x=9", "x=10", "x=11"], a: 2 }
                ],
                [
                    { q: "圆的周长公式是？", o: ["πr²", "2πr", "πd", "2r"], a: 1 },
                    { q: "This is my book. 中book的意思是？", o: ["书包", "书本", "书桌", "书店"], a: 1 },
                    { q: "(-3) + 5 = ?", o: ["-8", "-2", "2", "8"], a: 2 }
                ],
                [
                    { q: "正方形有几条边？", o: ["3", "4", "5", "6"], a: 1 },
                    { q: "I like to read books. 正确翻译是？", o: ["我喜欢跑步", "我喜欢读书", "我喜欢唱歌", "我喜欢画画"], a: 1 },
                    { q: "x² = 16，x = ?", o: ["2", "4", "8", "±4"], a: 3 }
                ]
            ],
            mountain: [
                // 关卡13-16
                [
                    { q: "水的化学式是？", o: ["H2O", "CO2", "O2", "NaCl"], a: 0 },
                    { q: "速度公式 v = ?", o: ["s/t", "t/s", "st", "s+t"], a: 0 },
                    { q: "植物光合作用需要什么？", o: ["氧气", "二氧化碳", "氮气", "氦气"], a: 1 }
                ],
                [
                    { q: "铁生锈是哪种变化？", o: ["物理变化", "化学变化", "生物变化", "无变化"], a: 1 },
                    { q: "力的单位是？", o: ["千克", "米", "牛顿", "瓦特"], a: 2 },
                    { q: "H2O中H的化合价是？", o: ["-1", "0", "+1", "+2"], a: 2 }
                ],
                [
                    { q: "燃烧需要哪些条件？", o: ["只需氧气", "只需火", "温度达到着火点+氧气", "只需高温"], a: 2 },
                    { q: "质量相同的铁和棉花，哪个体积大？", o: ["铁", "棉花", "一样大", "无法比较"], a: 1 },
                    { q: "下列哪个是酸的？", o: ["NaOH", "HCl", "H2O", "NaCl"], a: 1 }
                ],
                [
                    { q: "电流的单位是？", o: ["电压", "电阻", "安培", "瓦特"], a: 2 },
                    { q: "PH值小于7表示什么？", o: ["中性", "碱性", "酸性", "无法确定"], a: 2 },
                    { q: "能量的单位是？", o: ["牛顿", "瓦特", "焦耳", "安培"], a: 2 }
                ]
            ]
        };

        const TERRAIN_NAMES = {
            grass: 'grassLevels',
            water: 'waterLevels',
            desert: 'desertLevels',
            mountain: 'mountainLevels'
        };

        const LEVEL_NAMES = ['grass', 'water', 'desert', 'mountain'];

        // ========== 游戏状态 ==========
        let gameState = {
            currentLevel: 1,
            currentQuestion: 0,
            correctCount: 0,
            progress: {}
        };

        // ========== 工具函数 ==========
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            if (pageId === 'mapPage') renderMap();
            if (pageId === 'startPage') updateStartPet();
        }

        function saveProgress() {
            localStorage.setItem('petBattleProgress', JSON.stringify(gameState.progress));
        }

        function loadProgress() {
            const saved = localStorage.getItem('petBattleProgress');
            if (saved) {
                gameState.progress = JSON.parse(saved);
            } else {
                gameState.progress = {};
            }
        }

        function getLevelData(levelNum) {
            const levelIndex = Math.ceil(levelNum / LEVELS_PER_TERRAIN) - 1;
            const levelInTerrain = (levelNum - 1) % LEVELS_PER_TERRAIN;
            const terrain = LEVEL_NAMES[levelIndex];
            return {
                terrain,
                levelInTerrain,
                questions: QUESTIONS[terrain][levelInTerrain],
                levelName: `${['一', '二', '三', '四'][levelInTerrain]}年级${terrain === 'grass' ? '语文·数学' : terrain === 'water' ? '英语·自然' : terrain === 'desert' ? '数学·英语' : '物理·化学'}`
            };
        }

        function isLevelUnlocked(levelNum) {
            if (levelNum === 1) return true;
            const prevLevel = levelNum - 1;
            return gameState.progress[prevLevel] && gameState.progress[prevLevel].passed;
        }

        function updateTotalStars() {
            let total = 0;
            for (let i = 1; i <= 16; i++) {
                if (gameState.progress[i]) {
                    total += gameState.progress[i].stars || 0;
                }
            }
            document.getElementById('totalStars').textContent = total;
        }

        // ========== 开始页面 ==========
        function startGame() {
            loadProgress();
            showPage('mapPage');
        }

        function updateStartPet() {
            const pet = document.getElementById('startPet');
            pet.className = 'pet';
        }

        // ========== 地图页面 ==========
        function renderMap() {
            loadProgress();
            updateTotalStars();

            Object.keys(TERRAIN_NAMES).forEach(terrain => {
                const container = document.getElementById(TERRAIN_NAMES[terrain]);
                container.innerHTML = '';

                for (let i = 0; i < LEVELS_PER_TERRAIN; i++) {
                    const levelNum = LEVEL_NAMES.indexOf(terrain) * LEVELS_PER_TERRAIN + i + 1;
                    const btn = document.createElement('button');
                    btn.className = 'level-btn';

                    const unlocked = isLevelUnlocked(levelNum);
                    const levelData = gameState.progress[levelNum];

                    if (!unlocked) {
                        btn.classList.add('locked');
                        btn.innerHTML = `
                            <span class="lock-icon">🔒</span>
                            <span style="font-size:0.7rem;margin-top:2px;">第${levelNum}关</span>
                        `;
                    } else {
                        const stars = levelData ? levelData.stars : 0;
                        const passed = levelData && levelData.passed;

                        let starsHtml = '';
                        if (passed) {
                            for (let s = 0; s < 3; s++) {
                                starsHtml += `<span class="star ${s < stars ? 'earned' : ''}">★</span>`;
                            }
                        }

                        btn.innerHTML = `
                            <span class="level-num">${levelNum}</span>
                            ${passed ? `<div class="stars-display">${starsHtml}</div>` : '<span class="level-icon">🎯</span>'}
                        `;

                        btn.onclick = () => startLevel(levelNum);
                    }

                    container.appendChild(btn);
                }
            });
        }

        // ========== 答题页面 ==========
        function startLevel(levelNum) {
            gameState.currentLevel = levelNum;
            gameState.currentQuestion = 0;
            gameState.correctCount = 0;

            const levelData = getLevelData(levelNum);
            document.getElementById('quizLevelName').textContent = `第${levelNum}关 · ${levelData.levelName}`;

            showPage('quizPage');
            renderQuestion();
        }

        function renderQuestion() {
            const levelData = getLevelData(gameState.currentLevel);
            const q = levelData.questions[gameState.currentQuestion];

            // 更新进度点
            const progressContainer = document.getElementById('quizProgress');
            progressContainer.innerHTML = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                const dot = document.createElement('div');
                dot.className = 'progress-dot';
                if (i < gameState.currentQuestion) {
                    dot.classList.add(gameState.progress[gameState.currentLevel]?.answers?.[i] ? 'correct' : 'wrong');
                } else if (i === gameState.currentQuestion) {
                    dot.classList.add('current');
                }
                progressContainer.appendChild(dot);
            }

            // 更新题目
            document.getElementById('questionText').textContent = q.q;

            // 更新选项
            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';
            q.o.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(idx);
                optionsGrid.appendChild(btn);
            });

            // 更新萌宠状态
            updateQuizPet(false);
        }

        function updateQuizPet(isCorrect) {
            const pet = document.getElementById('quizPet');
            if (isCorrect) {
                pet.className = 'pet victory';
                pet.innerHTML = pet.innerHTML.replace('💪', '🎉').replace('✨', '');
            } else {
                pet.className = 'pet studying';
                pet.innerHTML = pet.innerHTML.replace('🎉', '💪');
            }
        }

        function checkAnswer(selectedIdx) {
            const levelData = getLevelData(gameState.currentLevel);
            const q = levelData.questions[gameState.currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');

            // 禁用所有按钮
            buttons.forEach(btn => btn.style.pointerEvents = 'none');

            if (selectedIdx === q.a) {
                // 答对
                buttons[selectedIdx].classList.add('correct');
                gameState.correctCount++;
                updateQuizPet(true);

                // 记录答案
                if (!gameState.progress[gameState.currentLevel]) {
                    gameState.progress[gameState.currentLevel] = { answers: {} };
                }
                gameState.progress[gameState.currentLevel].answers[gameState.currentQuestion] = true;
            } else {
                // 答错
                buttons[selectedIdx].classList.add('wrong');
                buttons[q.a].classList.add('correct');

                if (!gameState.progress[gameState.currentLevel]) {
                    gameState.progress[gameState.currentLevel] = { answers: {} };
                }
                gameState.progress[gameState.currentLevel].answers[gameState.currentQuestion] = false;
            }

            // 下一题或结束
            setTimeout(() => {
                gameState.currentQuestion++;
                if (gameState.currentQuestion < levelData.questions.length) {
                    renderQuestion();
                } else {
                    finishLevel();
                }
            }, 1200);
        }

        function finishLevel() {
            const stars = Math.min(3, Math.ceil(gameState.correctCount / levelData.questions.length * 3));
            const levelData = getLevelData(gameState.currentLevel);

            // 计算星星（重新获取levelData因为作用域问题）
            const questions = levelData.questions;
            const starsCalc = Math.min(3, Math.ceil(gameState.correctCount / questions.length * 3));

            // 保存进度
            gameState.progress[gameState.currentLevel] = {
                ...gameState.progress[gameState.currentLevel],
                passed: true,
                stars: Math.max(gameState.progress[gameState.currentLevel]?.stars || 0, starsCalc)
            };
            saveProgress();

            // 显示结算
            showResult(starsCalc);
        }

        // ========== 结算页面 ==========
        function showResult(stars) {
            const isWin = stars > 0;

            document.getElementById('resultTitle').textContent = isWin ? '恭喜过关!' : '继续加油!';
            document.getElementById('resultSubtitle').textContent = `获得 ${stars} 颗星`;

            // 更新结算萌宠
            const pet = document.getElementById('resultPet');
            pet.className = isWin ? 'pet victory' : 'pet';

            // 更新星星显示
            const starsContainer = document.getElementById('resultStars');
            starsContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const star = document.createElement('span');
                star.className = `result-star ${i < stars ? 'earned' : 'empty'}`;
                star.textContent = '⭐';
                starsContainer.appendChild(star);
            }

            // 更新下一关按钮
            const nextBtn = document.getElementById('nextLevelBtn');
            if (gameState.currentLevel >= 16) {
                nextBtn.textContent = '已完成全部关卡!';
                nextBtn.onclick = () => showPage('mapPage');
                nextBtn.style.display = 'block';
            } else {
                nextBtn.textContent = '下一关';
                nextBtn.onclick = () => goToNextLevel();
            }

            showPage('resultPage');
        }

        function goToNextLevel() {
            if (gameState.currentLevel < 16) {
                startLevel(gameState.currentLevel + 1);
            } else {
                showPage('mapPage');
            }
        }

        // ========== 初始化 ==========
        document.addEventListener('DOMContentLoaded', () => {
            loadProgress();
        });
    </script>
</body>
</html>
