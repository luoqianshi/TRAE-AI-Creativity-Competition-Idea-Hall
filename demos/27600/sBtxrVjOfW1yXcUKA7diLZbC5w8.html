<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英制转公制计算器</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
      }

      h1 {
        text-align: center;
        color: white;
        margin-bottom: 30px;
        font-size: 28px;
      }

      .formula-box {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        padding: 15px 25px;
        margin-bottom: 25px;
        text-align: center;
        color: white;
        font-size: 14px;
      }

      .formula-box code {
        background: rgba(0, 0, 0, 0.2);
        padding: 4px 10px;
        border-radius: 6px;
        font-family: 'Consolas', monospace;
      }

      .main-card {
        background: white;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        margin-bottom: 20px;
      }

      .input-group {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
        flex-wrap: wrap;
        align-items: flex-end;
      }

      .input-field {
        flex: 1;
        min-width: 120px;
      }

      .input-field label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-size: 14px;
        font-weight: 500;
      }

      .input-field input {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 16px;
        transition: all 0.3s ease;
      }

      .input-field input:focus {
        outline: none;
        border-color: #667eea;
      }

      .operator-select {
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 18px;
        background: white;
        cursor: pointer;
        min-width: 60px;
      }

      .operator-select:focus {
        outline: none;
        border-color: #667eea;
      }

      .btn-group {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
        flex-wrap: wrap;
      }

      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 500;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
      }

      .btn-secondary {
        background: #f0f0f0;
        color: #555;
      }

      .btn-secondary:hover {
        background: #e0e0e0;
      }

      .btn-danger {
        background: #ff6b6b;
        color: white;
      }

      .btn-danger:hover {
        background: #ff5252;
      }

      .result-section {
        background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        border-radius: 12px;
        padding: 25px;
        text-align: center;
        color: white;
        margin-bottom: 20px;
      }

      .result-label {
        font-size: 14px;
        opacity: 0.9;
        margin-bottom: 10px;
      }

      .result-value {
        font-size: 36px;
        font-weight: bold;
        margin-bottom: 15px;
        font-family: 'Consolas', monospace;
      }

      .result-unit {
        font-size: 16px;
        opacity: 0.9;
      }

      .copy-btn {
        background: rgba(255, 255, 255, 0.2);
        border: 2px solid rgba(255, 255, 255, 0.5);
        color: white;
        padding: 10px 30px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.3s ease;
      }

      .copy-btn:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      .copy-btn.copied {
        background: rgba(255, 255, 255, 0.4);
      }

      .history-section {
        background: white;
        border-radius: 16px;
        padding: 25px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      }

      .history-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .history-title {
        font-size: 20px;
        color: #333;
      }

      .history-list {
        max-height: 300px;
        overflow-y: auto;
      }

      .history-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px;
        border-bottom: 1px solid #f0f0f0;
        transition: background 0.2s ease;
      }

      .history-item:hover {
        background: #f8f9fa;
      }

      .history-item:last-child {
        border-bottom: none;
      }

      .history-formula {
        color: #666;
        font-size: 14px;
        flex: 1;
      }

      .history-result {
        font-weight: bold;
        color: #11998e;
        font-size: 16px;
        margin: 0 15px;
        font-family: 'Consolas', monospace;
      }

      .history-actions {
        display: flex;
        gap: 8px;
      }

      .history-btn {
        padding: 6px 12px;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .history-btn-copy {
        background: #e3f2fd;
        color: #1976d2;
      }

      .history-btn-copy:hover {
        background: #bbdefb;
      }

      .history-btn-delete {
        background: #ffebee;
        color: #c62828;
      }

      .history-btn-delete:hover {
        background: #ffcdd2;
      }

      .empty-history {
        text-align: center;
        color: #999;
        padding: 40px;
        font-size: 14px;
      }

      .expression-display {
        background: #f8f9fa;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
        font-family: 'Consolas', monospace;
        color: #555;
        min-height: 50px;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 5px;
      }

      .expression-part {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .expression-operator {
        color: #667eea;
        font-weight: bold;
        padding: 0 5px;
      }

      .expression-number {
        background: #e3f2fd;
        padding: 4px 10px;
        border-radius: 6px;
        color: #1976d2;
      }

      .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: #333;
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        opacity: 0;
        transition: all 0.3s ease;
        z-index: 1000;
      }

      .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }

      @media (max-width: 600px) {
        .input-group {
          flex-direction: column;
        }

        .input-field {
          min-width: 100%;
        }

        .result-value {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>英制转公制计算器</h1>

      <div class="formula-box">计算公式：<code>公制数 = 英尺×304.8 + 英寸×25.4 + 分数×25.4</code></div>

      <div class="main-card">
        <div class="expression-display" id="expressionDisplay">
          <span style="color: #999">请输入数值开始计算...</span>
        </div>

        <div id="inputContainer">
          <div class="input-group" data-index="0">
            <div class="input-field">
              <label>英尺 (ft)</label>
              <input type="number" class="feet" placeholder="0" step="any" />
            </div>
            <div class="input-field">
              <label>英寸 (in)</label>
              <input type="number" class="inches" placeholder="0" step="any" min="0" max="11" />
            </div>
            <div class="input-field">
              <label>分数 (如: 7/32)</label>
              <input type="text" class="fraction" placeholder="0 或 7/32" />
            </div>
          </div>
        </div>

        <div class="btn-group">
          <button class="btn btn-primary" onclick="calculate()">计算结果（或回车Enter）</button>
          <button class="btn btn-secondary" onclick="addInputGroup()">+ 添加一组</button>
          <button class="btn btn-secondary" onclick="clearAll()">清空</button>
        </div>

        <div class="result-section" id="resultSection" style="display: none">
          <div class="result-label">计算结果</div>
          <div class="result-value" id="resultValue">0</div>
          <div class="result-unit">毫米 (mm)</div>
          <button class="copy-btn" id="copyBtn" onclick="copyResult()">复制结果</button>
        </div>
      </div>

      <div class="history-section">
        <div class="history-header">
          <h2 class="history-title">历史记录</h2>
          <button class="btn btn-danger" onclick="clearHistory()" id="clearHistoryBtn" style="display: none">清空历史</button>
        </div>
        <div class="history-list" id="historyList">
          <div class="empty-history">暂无历史记录</div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      let history = JSON.parse(localStorage.getItem('imperialCalculatorHistory') || '[]');
      let currentResult = null;

      // 解析分数
      function parseFraction(fractionStr) {
        if (!fractionStr || fractionStr.trim() === '' || fractionStr.trim() === '0') {
          return 0;
        }

        fractionStr = fractionStr.trim();

        // 处理带分数，如 "1 7/32"
        const mixedMatch = fractionStr.match(/^(\d+)\s+(\d+)\/(\d+)$/);
        if (mixedMatch) {
          const whole = parseInt(mixedMatch[1]);
          const num = parseInt(mixedMatch[2]);
          const den = parseInt(mixedMatch[3]);
          return whole + num / den;
        }

        // 处理普通分数，如 "7/32"
        const fractionMatch = fractionStr.match(/^(\d+)\/(\d+)$/);
        if (fractionMatch) {
          const num = parseInt(fractionMatch[1]);
          const den = parseInt(fractionMatch[2]);
          return num / den;
        }

        // 处理小数
        const decimal = parseFloat(fractionStr);
        if (!isNaN(decimal)) {
          return decimal;
        }

        return 0;
      }

      // 计算单个输入组的毫米值
      function calculateGroup(group) {
        const feet = parseFloat(group.querySelector('.feet').value) || 0;
        const inches = parseFloat(group.querySelector('.inches').value) || 0;
        const fraction = parseFraction(group.querySelector('.fraction').value);

        const totalInches = inches + fraction;
        return feet * 304.8 + totalInches * 25.4;
      }

      // 获取输入组的显示文本
      function getGroupDisplayText(group) {
        const feet = parseFloat(group.querySelector('.feet').value) || 0;
        const inches = parseFloat(group.querySelector('.inches').value) || 0;
        const fractionStr = group.querySelector('.fraction').value.trim();

        let parts = [];
        if (feet > 0) parts.push(`${feet}ft`);
        if (inches > 0) parts.push(`${inches}in`);
        if (fractionStr && fractionStr !== '0') parts.push(fractionStr);

        return parts.length > 0 ? parts.join(' ') : '0';
      }

      // 更新表达式显示
      function updateExpression() {
        const container = document.getElementById('inputContainer');
        const groups = container.querySelectorAll('.input-group');
        const display = document.getElementById('expressionDisplay');

        if (groups.length === 0) {
          display.innerHTML = '<span style="color: #999;">请输入数值开始计算...</span>';
          return;
        }

        let html = '';
        groups.forEach((group, index) => {
          const text = getGroupDisplayText(group);
          if (index > 0) {
            html += '<span class="expression-operator">+</span>';
          }
          html += `<span class="expression-number">${text}</span>`;
        });

        display.innerHTML = html;
      }

      // 添加输入组
      function addInputGroup() {
        const container = document.getElementById('inputContainer');
        const index = container.children.length;

        const group = document.createElement('div');
        group.className = 'input-group';
        group.dataset.index = index;
        group.innerHTML = `
                <select class="operator-select">
                    <option value="+">+</option>
                    <option value="-">−</option>
                </select>
                <div class="input-field">
                    <label>英尺 (ft)</label>
                    <input type="number" class="feet" placeholder="0" step="any">
                </div>
                <div class="input-field">
                    <label>英寸 (in)</label>
                    <input type="number" class="inches" placeholder="0" step="any" min="0" max="11">
                </div>
                <div class="input-field">
                    <label>分数 (如: 7/32)</label>
                    <input type="text" class="fraction" placeholder="0 或 7/32">
                </div>
                <button class="btn btn-danger" onclick="removeInputGroup(this)" style="padding: 12px 15px;">×</button>
            `;

        container.appendChild(group);
        attachListeners(group);
        updateExpression();
      }

      // 删除输入组
      function removeInputGroup(btn) {
        const group = btn.closest('.input-group');
        group.remove();
        updateExpression();
      }

      // 附加事件监听器
      function attachListeners(group) {
        const inputs = group.querySelectorAll('input, select');
        inputs.forEach((input) => {
          input.addEventListener('input', updateExpression);
        });
      }

      // 计算
      function calculate() {
        const container = document.getElementById('inputContainer');
        const groups = container.querySelectorAll('.input-group');

        if (groups.length === 0) {
          showToast('请至少输入一组数值');
          return;
        }

        let total = 0;
        let formula = '';

        groups.forEach((group, index) => {
          const value = calculateGroup(group);
          const operator = index === 0 ? '' : group.querySelector('.operator-select')?.value || '+';

          if (index === 0) {
            total = value;
            formula = getGroupDisplayText(group);
          } else {
            if (operator === '+') {
              total += value;
              formula += ' + ' + getGroupDisplayText(group);
            } else {
              total -= value;
              formula += ' - ' + getGroupDisplayText(group);
            }
          }
        });

        currentResult = total;

        // 显示结果
        const resultSection = document.getElementById('resultSection');
        const resultValue = document.getElementById('resultValue');
        resultSection.style.display = 'block';
        resultValue.textContent = total.toFixed(4).replace(/\.?0+$/, '');

        // 添加到历史记录
        addToHistory(formula, total);

        showToast('计算完成！');
      }

      // 添加到历史记录
      function addToHistory(formula, result) {
        const item = {
          formula: formula,
          result: result,
          timestamp: new Date().toISOString(),
        };

        history.unshift(item);
        if (history.length > 50) {
          history = history.slice(0, 50);
        }

        localStorage.setItem('imperialCalculatorHistory', JSON.stringify(history));
        renderHistory();
      }

      // 渲染历史记录
      function renderHistory() {
        const list = document.getElementById('historyList');
        const clearBtn = document.getElementById('clearHistoryBtn');

        if (history.length === 0) {
          list.innerHTML = '<div class="empty-history">暂无历史记录</div>';
          clearBtn.style.display = 'none';
          return;
        }

        clearBtn.style.display = 'block';

        list.innerHTML = history
          .map(
            (item, index) => `
                <div class="history-item">
                    <div class="history-formula">${item.formula}</div>
                    <div class="history-result">${item.result.toFixed(4).replace(/\.?0+$/, '')} mm</div>
                    <div class="history-actions">
                        <button class="history-btn history-btn-copy" onclick="copyHistoryResult(${index})">复制</button>
                        <button class="history-btn history-btn-delete" onclick="deleteHistoryItem(${index})">删除</button>
                    </div>
                </div>
            `,
          )
          .join('');
      }

      // 复制结果
      function copyResult() {
        if (currentResult === null) return;

        const text = currentResult.toFixed(4).replace(/\.?0+$/, '');
        navigator.clipboard.writeText(text).then(() => {
          const btn = document.getElementById('copyBtn');
          btn.textContent = '已复制！';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = '复制结果';
            btn.classList.remove('copied');
          }, 2000);
          showToast('结果已复制到剪贴板');
        });
      }

      // 复制历史记录结果
      function copyHistoryResult(index) {
        const text = history[index].result.toFixed(4).replace(/\.?0+$/, '');
        navigator.clipboard.writeText(text).then(() => {
          showToast('结果已复制到剪贴板');
        });
      }

      // 删除历史记录项
      function deleteHistoryItem(index) {
        history.splice(index, 1);
        localStorage.setItem('imperialCalculatorHistory', JSON.stringify(history));
        renderHistory();
      }

      // 清空历史记录
      function clearHistory() {
        if (confirm('确定要清空所有历史记录吗？')) {
          history = [];
          localStorage.setItem('imperialCalculatorHistory', '[]');
          renderHistory();
          showToast('历史记录已清空');
        }
      }

      // 清空所有输入
      function clearAll() {
        const container = document.getElementById('inputContainer');
        container.innerHTML = `
                <div class="input-group" data-index="0">
                    <div class="input-field">
                        <label>英尺 (ft)</label>
                        <input type="number" class="feet" placeholder="0" step="any">
                    </div>
                    <div class="input-field">
                        <label>英寸 (in)</label>
                        <input type="number" class="inches" placeholder="0" step="any" min="0" max="11">
                    </div>
                    <div class="input-field">
                        <label>分数 (如: 7/32)</label>
                        <input type="text" class="fraction" placeholder="0 或 7/32">
                    </div>
                </div>
            `;

        attachListeners(container.querySelector('.input-group'));
        document.getElementById('resultSection').style.display = 'none';
        currentResult = null;
        updateExpression();
        showToast('已清空');
      }

      // 显示提示
      function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 2000);
      }

      // 初始化
      document.addEventListener('DOMContentLoaded', () => {
        const firstGroup = document.querySelector('.input-group');
        attachListeners(firstGroup);
        renderHistory();

        // 添加回车键监听
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            calculate();
          }
        });
      });
    </script>
  </body>
</html>
