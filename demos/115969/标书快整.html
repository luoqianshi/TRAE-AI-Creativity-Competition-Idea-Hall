<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>标书快整</title>
    <style>
        :root {
            --bg-primary: #f9fbfd;
            --bg-card: #ffffff;
            --text-primary: #2a3b5c;
            --text-secondary: #6a7d9a;
            --border: #e1e8f0;
            --accent: #2a6cb4;
            --accent-hover: #1d5592;
            --success: #2d8c5a;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
        }

        .dark-mode {
            --bg-primary: #1a222e;
            --bg-card: #242d3e;
            --text-primary: #e2e8f0;
            --text-secondary: #a0aec0;
            --border: #3a475e;
            --accent: #4299e1;
            --accent-hover: #3182ce;
            --success: #38a169;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
            padding: 16px;
        }

        .container {
            max-width: 1024px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            padding: 24px 0;
        }

        h1 {
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Theme Toggle */
        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            z-index: 10;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
            fill: var(--text-primary);
        }

        /* Main Section */
        .main-section {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            margin: 24px 0;
        }

        @media (min-width: 768px) {
            .main-section {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        /* Drop Zone */
        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 32px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .drop-zone:hover, .drop-zone.drag-over {
            border-color: var(--accent);
            background-color: rgba(42, 108, 180, 0.04);
        }

        .drop-zone i {
            font-size: 48px;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .drop-zone p {
            margin: 8px 0;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .drop-zone .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.2s;
        }

        .drop-zone .btn:hover {
            background: var(--accent-hover);
        }

        .file-list {
            margin-top: 16px;
            max-height: 120px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border);
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-icon {
            width: 24px;
            height: 24px;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .pdf { color: #e2574c; }
        .docx { color: #3a7ebf; }
        .jpg, .png { color: #28a745; }

        /* Template Selector */
        .template-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .template-btn {
            flex: 1;
            min-width: 120px;
            padding: 10px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            text-align: center;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-primary);
        }

        .template-btn:hover:not(.active) {
            border-color: var(--accent);
        }

        .template-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .preview-panel {
            background: rgba(42, 108, 180, 0.05);
            border-left: 3px solid var(--accent);
            padding: 16px;
            border-radius: 0 4px 4px 0;
            margin-top: 16px;
        }

        .preview-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--accent);
        }

        .preview-content {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .preview-content strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Footer CTA */
        .cta-section {
            text-align: center;
            padding: 32px 0;
        }

        .cta-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 16px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .cta-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .steps {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 24px 0;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80px;
        }

        .step-num {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .step-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 767px) {
            .template-selector {
                flex-direction: column;
            }

            h1 {
                font-size: 1.5rem;
            }

            .drop-zone {
                min-height: 180px;
            }
        }

        /* Scrollbar */
        .file-list::-webkit-scrollbar {
            width: 6px;
        }
        .file-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .file-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="theme-toggle" id="themeToggle">
        <svg viewBox="0 0 24 24">
            <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h1.5zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H6a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H15a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM12 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5z"/>
        </svg>
    </div>

    <div class="container">
        <header>
            <h1>标书快整</h1>
            <p class="subtitle">三分钟把零散投标材料变成规范标书初稿 —— 拖入文件，选模板，一键生成可编辑Word</p>
        </header>

        <div class="steps">
            <div class="step">
                <div class="step-num">1</div>
                <div class="step-label">拖入材料</div>
            </div>
            <div class="step">
                <div class="step-num">2</div>
                <div class="step-label">选模板</div>
            </div>
            <div class="step">
                <div class="step-num">3</div>
                <div class="step-label">下载Word</div>
            </div>
        </div>

        <section class="main-section">
            <div class="card">
                <h2 class="card-title">上传投标材料</h2>
                <div class="drop-zone" id="dropZone">
                    <div>📁</div>
                    <p>点击或拖拽上传文件</p>
                    <p><small>支持 PDF / Word / JPG / PNG（最多3个）</small></p>
                    <button class="btn" id="browseBtn">选择文件</button>
                    <input type="file" id="fileInput" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" style="display:none;">
                </div>
                <div class="file-list" id="fileList">
                    <!-- 文件列表将由JS动态插入 -->
                </div>
            </div>

            <div class="card">
                <h2 class="card-title">选择标书模板</h2>
                <div class="template-selector">
                    <button class="template-btn active" data-id="general">通用技术标</button>
                    <button class="template-btn" data-id="water">智慧水务专项</button>
                    <button class="template-btn" data-id="elderly">社区养老信息化</button>
                </div>
                <div class="preview-panel">
                    <div class="preview-title">已选模板：通用技术标</div>
                    <div class="preview-content">
                        <strong>自动生成章节：</strong>投标函、法定代表人授权书、商务条款响应表、<br>
                        技术方案（含本地案例占位）、资质证明清单、服务承诺<br><br>
                        <strong>自动补全：</strong>页码、目录、章节编号、骑缝章提示、<br>
                        “本项目不接受联合体投标”等硬性条款
                    </div>
                </div>
            </div>
        </section>

        <div class="cta-section">
            <button class="cta-btn" id="generateBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M13.5 10.5V6.75L15.75 3H8.25L10.5 6.75V10.5M13.5 10.5L10.5 13.5M13.5 10.5L16.5 13.5M10.5 13.5V17.25L8.25 21H15.75L13.5 17.25V13.5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                生成标书初稿（Word）
            </button>
            <p style="margin-top:12px;color:var(--text-secondary);font-size:0.9rem;">生成后可直接在Word中编辑、替换公司名称、补充案例细节</p>
        </div>
    </div>

    <script>
        // 主题切换
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            html.classList.add('dark-mode');
        }

        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark-mode');
            const isDark = html.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // 模拟文件拖放
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const browseBtn = document.getElementById('browseBtn');
        const fileList = document.getElementById('fileList');
        const generateBtn = document.getElementById('generateBtn');

        let uploadedFiles = [];

        function updateFileList() {
            fileList.innerHTML = '';
            if (uploadedFiles.length === 0) {
                fileList.innerHTML = '<p style="color:var(--text-secondary);padding:12px 0;">暂无文件</p>';
                return;
            }
            uploadedFiles.forEach((file, i) => {
                const ext = file.name.split('.').pop().toLowerCase();
                let iconClass = '';
                if (['pdf'].includes(ext)) iconClass = 'pdf';
                else if (['doc', 'docx'].includes(ext)) iconClass = 'docx';
                else if (['jpg', 'jpeg', 'png'].includes(ext)) iconClass = 'jpg';
                else iconClass = 'pdf';

                const li = document.createElement('div');
                li.className = 'file-item';
                li.innerHTML = `
                    <span class="file-icon ${iconClass}">📄</span>
                    <span>${file.name}</span>
                `;
                fileList.appendChild(li);
            });
        }

        browseBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files).slice(0, 3);
            uploadedFiles = [...uploadedFiles, ...files];
            updateFileList();
        });

        // 拖放支持
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight() {
            dropZone.classList.add('drag-over');
        }

        function unhighlight() {
            dropZone.classList.remove('drag-over');
        }

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const files = Array.from(e.dataTransfer.files).slice(0, 3);
            uploadedFiles = [...uploadedFiles, ...files];
            updateFileList();
        }

        // 模板切换
        const templateBtns = document.querySelectorAll('.template-btn');
        const previewTitle = document.querySelector('.preview-title');
        const previewContent = document.querySelector('.preview-content');

        const templates = {
            general: {
                title: '通用技术标',
                content: '<strong>自动生成章节：</strong>投标函、法定代表人授权书、商务条款响应表、<br>技术方案（含本地案例占位）、资质证明清单、服务承诺<br><br><strong>自动补全：</strong>页码、目录、章节编号、骑缝章提示、<br>"本项目不接受联合体投标"等硬性条款'
            },
            water: {
                title: '智慧水务专项',
                content: '<strong>自动生成章节：</strong>投标函、本地化服务承诺、<br>三年智慧水务实施案例（含项目名称/时间/规模）、<br>水质监测设备兼容性说明、运维响应SLA<br><br><strong>自动补全：</strong>GB/T 19001认证声明、涉水产品卫生许可批件提示、<br>"本项目要求投标人具备市政公用工程施工总承包三级及以上资质"'
            },
            elderly: {
                title: '社区养老信息化',
                content: '<strong>自动生成章节：</strong>投标函、适老化改造承诺、<br>居家养老平台本地部署方案、<br>与区级民政系统对接协议模板、<br>护理人员培训计划表<br><br><strong>自动补全：</strong>《智慧健康养老产品及服务推广目录》符合性声明、<br>"本项目不接受进口产品投标"、数据安全等级保护三级承诺'
            }
        };

        templateBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                templateBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const id = btn.getAttribute('data-id');
                previewTitle.textContent = `已选模板：${templates[id].title}`;
                previewContent.innerHTML = templates[id].content;
            });
        });

        // 生成按钮反馈
        generateBtn.addEventListener('click', () => {
            if (uploadedFiles.length === 0) {
                alert('请先上传至少一个投标材料文件');
                return;
            }
            generateBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 12L11 14L15 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> 正在生成中…';
            generateBtn.disabled = true;

            // 模拟3秒生成
            setTimeout(() => {
                generateBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13.5 10.5V6.75L15.75 3H8.25L10.5 6.75V10.5M13.5 10.5L10.5 13.5M13.5 10.5L16.5 13.5M10.5 13.5V17.25L8.25 21H15.75L13.5 17.25V13.5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> 生成完成！下载Word';
                generateBtn.disabled = false;
                generateBtn.style.backgroundColor = '#2d8c5a';
                generateBtn.style.color = 'white';
                setTimeout(() => {
                    generateBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13.5 10.5V6.75L15.75 3H8.25L10.5 6.75V10.5M13.5 10.5L10.5 13.5M13.5 10.5L16.5 13.5M10.5 13.5V17.25L8.25 21H15.75L13.5 17.25V13.5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> 生成标书初稿（Word）';
                    generateBtn.style.backgroundColor = '';
                    generateBtn.style.color = '';
                }, 2000);
            }, 3000);
        });

        // 初始化
        updateFileList();
    </script>
</body>
</html>
