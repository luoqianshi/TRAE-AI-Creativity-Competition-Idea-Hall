<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>健身助手 · 原型</title>
<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#F7F7F5; --surface:#FFFFFF; --surface-2:#F2F2EF; --text:#1A1D24; --text-2:#6B7280;
  --text-3:#9CA3AF; --border:#E5E7EB; --primary:#FF5A3C; --primary-soft:#FFE7E0;
  --blue:#3B82F6; --purple:#8B5CF6; --green:#10B981; --amber:#F59E0B; --gray:#9CA3AF;
  --shadow:0 4px 16px rgba(20,23,30,.06); --shadow-lg:0 12px 32px rgba(20,23,30,.12);
  --radius:16px; --radius-sm:12px; --radius-xs:8px;
  --tab-h:62px; --safe-bottom:env(safe-area-inset-bottom,0px);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --bg:#0F1115; --surface:#1A1D24; --surface-2:#22262F; --text:#F7F7F5; --text-2:#9CA3AF;
  --text-3:#6B7280; --border:#2C313A; --primary:#FF6B4E; --primary-soft:#3A1F18;
  --shadow:0 4px 16px rgba(0,0,0,.3); --shadow-lg:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.5;
  overscroll-behavior-y:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ============ 桌面手机框 ============ */
.desktop-wrap{display:none}
@media(min-width:768px){
  body{background:radial-gradient(circle at 20% 10%,#2a2d36,#0f1115 60%);display:flex;align-items:center;justify-content:center;min-height:100vh}
  .desktop-wrap{display:block;position:relative}
  .desktop-wrap::before{content:"健身助手 PROTOTYPE";position:absolute;top:-44px;left:0;right:0;text-align:center;color:#666;font-size:13px;letter-spacing:2px}
  #app{width:390px;height:844px;border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 0 0 11px #1a1d24,inset 0 0 0 13px #333;overflow:hidden;position:relative;background:var(--bg)}
  .desktop-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:28px;background:#1a1d24;border-radius:0 0 18px 18px;z-index:9999}
}

/* ============ App 容器 ============ */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:480px;margin:0 auto;position:relative;overflow:hidden}
@media(min-width:768px){#app{height:844px}}

/* ============ 顶部栏 ============ */
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:20}
.topbar .title{font-weight:800;font-size:18px;flex:1;letter-spacing:-.3px}
.topbar .icon-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--surface-2);transition:.15s}
.topbar .icon-btn:active{transform:scale(.92)}
.search-input{flex:1;height:36px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);padding:0 12px;font-size:14px;color:var(--text);outline:none}
.search-input:focus{border-color:var(--primary)}

/* ============ 视图滚动区 ============ */
.view-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(var(--tab-h) + 24px + var(--safe-bottom))}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ 卡片 ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card.tight{padding:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-h h3{margin:0;font-size:15px;font-weight:700}
.card-h .more{font-size:12px;color:var(--text-2)}

/* ============ 按钮 ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;background:var(--surface-2);color:var(--text);transition:.15s}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--primary);color:#fff}
.btn-ghost{background:transparent}
.btn-block{display:flex;width:100%}
.btn-sm{padding:7px 12px;font-size:13px}
.btn-outline{border:1.5px solid var(--primary);color:var(--primary);background:transparent}

/* ============ 标签 ============ */
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--text-2);white-space:nowrap;transition:.15s}
.chip.active{background:var(--primary);color:#fff}
.chip.outline{background:transparent;border:1px solid var(--border)}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}

/* ============ Tab Bar ============ */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tab-h) + var(--safe-bottom));background:var(--surface);border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe-bottom);z-index:30}
.tabbar.hidden{display:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-3);font-size:11px;font-weight:600;transition:.15s}
.tab .ic{font-size:21px;line-height:1}
.tab.active{color:var(--primary)}

/* ============ 可编辑文本 ============ */
[contenteditable="true"]{outline:none;border-radius:4px;transition:.15s;padding:1px 3px;margin:-1px -3px}
[contenteditable="true"]:hover{background:var(--surface-2)}
[contenteditable="true"]:focus{background:var(--primary-soft);box-shadow:0 0 0 2px var(--primary)}
.flash{animation:flash 1s ease}
@keyframes flash{0%{background:var(--primary-soft);box-shadow:0 0 0 2px var(--primary)}100%{background:transparent;box-shadow:none}}

/* ============ 滑块 ============ */
.slider-row{display:flex;align-items:center;gap:12px}
input[type="range"]{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:3px;background:var(--border);outline:none}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--primary);cursor:pointer;box-shadow:0 2px 6px rgba(255,90,60,.4);border:3px solid var(--surface)}
input[type="range"]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--primary);cursor:pointer;border:3px solid var(--surface)}
.val-badge{min-width:54px;text-align:center;font-weight:700;font-family:var(--mono);font-size:14px;color:var(--primary)}

/* ============ 列表项 ============ */
.list-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;transition:.15s}
.list-item:active{transform:scale(.99)}
.list-item .thumb{width:52px;height:52px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.list-item .info{flex:1;min-width:0}
.list-item .info .name{font-weight:600;font-size:14px}
.list-item .info .sub{font-size:12px;color:var(--text-2);margin-top:2px}
.list-item .action{color:var(--text-3);font-size:20px}
.drag-handle{cursor:grab;color:var(--text-3);font-size:18px;padding:4px}
.drag-handle:active{cursor:grabbing}
.list-item.dragging{opacity:.4}
.list-item.drag-over{border-color:var(--primary);border-style:dashed}

/* ============ 输入 ============ */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:5px;font-weight:600}
.input{width:100%;height:42px;border-radius:var(--radius-xs);border:1px solid var(--border);background:var(--surface);padding:0 12px;font-size:14px;color:var(--text);outline:none}
.input:focus{border-color:var(--primary)}
textarea.input{height:auto;padding:10px 12px;resize:vertical}

/* ============ Toast ============ */
#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 30px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:9000;box-shadow:var(--shadow-lg)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}

/* ============ Modal / 全屏 ============ */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex;animation:fade .2s}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:24px 24px 0 0;max-height:88%;overflow-y:auto;animation:slideUp .3s cubic-bezier(.2,.8,.2,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-h{position:sticky;top:0;background:var(--surface);padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;z-index:5}
.sheet-h h3{margin:0;font-size:16px;font-weight:700}
.sheet-body{padding:16px}
.fullscreen{position:absolute;inset:0;background:var(--bg);z-index:200;display:none;flex-direction:column}
.fullscreen.show{display:flex}

/* ============ 训练执行 ============ */
.workout-top{padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.progress-bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin-top:8px}
.progress-bar>div{height:100%;background:var(--primary);transition:.3s}
.workout-main{flex:1;overflow-y:auto;padding:20px 16px}
.exercise-card-big{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.exercise-img{height:180px;background:linear-gradient(135deg,var(--primary-soft),var(--surface-2));display:flex;align-items:center;justify-content:center;font-size:72px}
.set-pill{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:10px;background:var(--surface-2);margin-bottom:8px}
.set-pill .set-no{font-weight:700;font-family:var(--mono)}
.set-pill.done{background:var(--primary-soft)}
.workout-bottom{padding:14px 16px;background:var(--surface);border-top:1px solid var(--border)}

/* ============ 休息计时器 ============ */
.rest-overlay{position:absolute;inset:0;background:rgba(26,29,36,.96);z-index:210;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.rest-overlay.show{display:flex}
.rest-ring{width:220px;height:220px;position:relative}
.rest-ring svg{transform:rotate(-90deg)}
.rest-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rest-num .n{font-size:64px;font-weight:800;font-family:var(--mono);line-height:1}
.rest-num .l{font-size:13px;color:var(--text-2);margin-top:4px}

/* ============ 日历 ============ */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--text-2);position:relative;cursor:pointer;transition:.15s}
.cal-cell:active{transform:scale(.9)}
.cal-cell.empty{background:transparent;cursor:default}
.cal-cell.today{outline:2px solid var(--primary)}
.cal-cell.s-done{background:var(--primary);color:#fff}
.cal-cell.s-planned{background:var(--blue);color:#fff}
.cal-cell.s-rest{background:var(--gray);color:#fff}
.cal-cell.s-failure{background:var(--purple);color:#fff}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--text-2)}
.cal-legend span{display:flex;align-items:center;gap:5px}
.cal-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ============ 图表 ============ */
.chart-box{width:100%;overflow:hidden}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface-2);border-radius:var(--radius-sm);padding:14px}
.stat .v{font-size:24px;font-weight:800;font-family:var(--mono);letter-spacing:-1px}
.stat .v small{font-size:13px;font-weight:600;color:var(--text-2)}
.stat .l{font-size:12px;color:var(--text-2);margin-top:2px}
.stat.accent .v{color:var(--primary)}

/* ============ 热量环 ============ */
.ring-wrap{display:flex;align-items:center;gap:16px}
.ring-wrap svg{flex-shrink:0}
.ring-legend{flex:1}
.ring-legend .row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border)}
.ring-legend .row:last-child{border:none}

/* ============ 雷达 ============ */
.radar-wrap{display:flex;justify-content:center}

/* ============ 引导 ============ */
.onboard{position:absolute;inset:0;background:var(--bg);z-index:500;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
.onboard.show{display:flex}
.onboard .emoji{font-size:80px;margin-bottom:20px}
.onboard h2{font-size:24px;margin:0 0 10px}
.onboard p{color:var(--text-2);margin:0 0 30px}
.onboard-dots{display:flex;gap:8px;margin-top:30px}
.onboard-dots i{width:8px;height:8px;border-radius:50%;background:var(--border)}
.onboard-dots i.active{background:var(--primary);width:24px;border-radius:4px}

/* ============ 杂项 ============ */
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--text-2)}
.tiny{font-size:12px}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb0{margin-bottom:0}
.divider{height:1px;background:var(--border);margin:12px 0}
.tag-muscle{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--primary-soft);color:var(--primary)}
.stars{color:var(--amber);font-size:12px;letter-spacing:1px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-2)}
.empty-state .emoji{font-size:48px;display:block;margin-bottom:10px}
.section-title{font-size:13px;font-weight:700;color:var(--text-2);margin:18px 0 10px;text-transform:uppercase;letter-spacing:1px}
.switch{width:44px;height:26px;border-radius:13px;background:var(--border);position:relative;transition:.2s;flex-shrink:0}
.switch.on{background:var(--primary)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch.on::after{transform:translateX(18px)}
.badge-lock{filter:grayscale(1);opacity:.4}
.kbd{font-family:var(--mono);font-size:11px;background:var(--surface-2);padding:2px 6px;border-radius:4px;border:1px solid var(--border)}
.injury-warn{display:inline-block;padding:1px 5px;border-radius:4px;font-size:10px;font-weight:700;background:#FEE2E2;color:#DC2626;margin-left:4px}

/* ============ 登录/注册 ============ */
.auth-screen{position:absolute;inset:0;background:var(--bg);z-index:600;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
.auth-screen.hide{display:none}
.auth-logo{font-size:64px;margin-bottom:16px}
.auth-title{font-size:26px;font-weight:800;margin:0 0 6px}
.auth-sub{color:var(--text-2);margin:0 0 30px;font-size:14px}
.auth-form{width:100%;max-width:320px;text-align:left}
.auth-form .field{margin-bottom:14px}
.auth-form .input{height:48px;font-size:15px}
.auth-tabs{display:flex;gap:0;margin-bottom:24px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border)}
.auth-tabs button{flex:1;padding:10px;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--text-2);transition:.15s}
.auth-tabs button.active{background:var(--primary);color:#fff}
.auth-error{color:var(--primary);font-size:13px;margin-bottom:10px;min-height:18px}
.photo-thumb{width:60px;height:60px;border-radius:8px;object-fit:cover;border:1px solid var(--border);cursor:pointer}
</style>
</head>
<body>
<div class="desktop-wrap">
<div class="desktop-notch"></div>
<div id="app">
  <!-- 顶部栏 -->
  <div class="topbar" id="topbar">
    <div class="title" id="topTitle">健身助手</div>
    <button class="icon-btn" onclick="openSearch()" title="搜索">🔍</button>
    <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="主题">🌙</button>
  </div>

  <!-- 视图区 -->
  <div class="view-scroll" id="viewScroll">
    <!-- ===== TAB1 首页 ===== -->
    <div class="view active" id="view-tab1"></div>
    <!-- ===== TAB2 训练 ===== -->
    <div class="view" id="view-tab2"></div>
    <!-- ===== TAB3 数据 ===== -->
    <div class="view" id="view-tab3"></div>
    <!-- ===== TAB4 我的 ===== -->
    <div class="view" id="view-tab4"></div>
  </div>

  <!-- Tab Bar -->
  <div class="tabbar" id="tabbar">
    <div class="tab active" data-tab="1" onclick="switchTab(1)"><span class="ic">🏠</span>首页</div>
    <div class="tab" data-tab="2" onclick="switchTab(2)"><span class="ic">💪</span>训练</div>
    <div class="tab" data-tab="3" onclick="switchTab(3)"><span class="ic">📊</span>数据</div>
    <div class="tab" data-tab="4" onclick="switchTab(4)"><span class="ic">⚙️</span>我的</div>
  </div>

  <!-- 弹层 -->
  <div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()"></div>
  <div class="fullscreen" id="fullscreen"></div>
  <div class="rest-overlay" id="restOverlay"></div>
  <div class="onboard" id="onboard"></div>
  <div class="auth-screen hide" id="authScreen"></div>
  <div id="toast"></div>
</div>
</div>

<script>
/* ============================================================
   健身助手 原型 - 单文件 JS
   ============================================================ */
"use strict";

/* ---------- 持久化层 ---------- */
const LS = {
  get(k, def){ try{ const v = localStorage.getItem(k); return v? JSON.parse(v): def; }catch(e){ return def; } },
  set(k, v){ localStorage.setItem(k, JSON.stringify(v)); },
  del(k){ localStorage.removeItem(k); }
};
function save(key){ return () => { toast("已保存"); }; }

/* ---------- 主题 ---------- */
function toggleTheme(){
  const cur = document.documentElement.getAttribute("data-theme") || "light";
  const next = cur === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", next);
  document.getElementById("themeBtn").textContent = next === "dark" ? "☀️" : "🌙";
  LS.set("fit_settings", Object.assign({}, LS.get("fit_settings",{}), {darkMode: next==="dark"}));
  toast(next==="dark"?"已切换深色模式":"已切换浅色模式");
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, duration){
  const t = document.getElementById("toast");
  t.innerHTML = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), duration || 1500);
}

/* ---------- contenteditable 保存 ---------- */
function bindEdit(el, key, field){
  el.addEventListener("blur", ()=>{
    let val = el.textContent.trim();
    const data = LS.get(key, {});
    data[field] = val;
    LS.set(key, data);
    el.classList.add("flash");
    setTimeout(()=>el.classList.remove("flash"), 1000);
    toast("已保存");
    if(el.dataset.rerender) renderAll();
  });
  el.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); el.blur(); } });
}

/* ---------- 算法 ---------- */
function oneRM(w, r){ r = +r||1; if(r>=37) return +w||0; return Math.round((+w||0)*36/(37-r)*10)/10; }
function calcCalories(met, kg, min){ return Math.round((met||5)*(kg||65)*(min||0)/60); }
function calcBMI(kg, cm){ const h=(cm||170)/100; return Math.round((kg||65)/(h*h)*10)/10; }
function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function dateKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ---------- 伤病史-肌群映射 (Issue 10) ---------- */
const INJURY_MUSCLE_MAP = {
  "膝盖":["股四头肌","腘绳肌"],
  "腰部":["竖脊肌"],
  "肩膀":["三角肌"],
  "手腕":["肱二头肌"],
  "肘部":["肱二头肌","三角肌"],
  "脚踝":["腘绳肌","股四头肌"],
  "颈部":["竖脊肌","三角肌"]
};

/* ---------- 种子数据 ---------- */
function seedData(){
  if(!LS.get("fit_seeded")){

let currentTab = 1;
let tab2Sub = "library"; // library | plans | (workout via fullscreen)
let tab3Sub = "body";    // body | insight

const TITLES = {1:"健身助手", 2:"训练", 3:"数据", 4:"我的"};

function switchTab(n, subState){
  currentTab = n;
  if(subState){
    if(n===2) trainSub = subState;
    if(n===3) tab3Sub = subState;
  }
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById("view-tab"+n).classList.add("active");
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", +t.dataset.tab===n));
  document.getElementById("topTitle").textContent = TITLES[n];
  document.getElementById("viewScroll").scrollTop = 0;
  renderTab(n);
}

function renderTab(n){
  if(n===1) renderHome();
  else if(n===2) renderTrain();
  else if(n===3) renderData();
  else if(n===4) renderProfile();
}
function renderAll(){ renderTab(currentTab); }

// Issue 1: 保存饮食数据
function saveDiet(){
  const d = {
    consumed: +document.getElementById("dietConsumed").value,
    burned: +document.getElementById("dietBurned").value,
    target: +document.getElementById("dietTarget").value,
    entries: LS.get("fit_diet",{entries:[]}).entries || []
  };
  d.entries.unshift({date:todayKey(), consumed:d.consumed, burned:d.burned, target:d.target});
  if(d.entries.length > 30) d.entries = d.entries.slice(0,30);
  LS.set("fit_diet", d);
  toast("饮食已保存");
  renderHome();
}

function checkin(){
  const s = LS.get("fit_streak",{streak:0,weekly:0,lastCheck:""});
  if(s.lastCheck===todayKey()){ toast("今天已打卡"); return; }
  const y=new Date(); y.setDate(y.getDate()-1);
  s.streak = s.lastCheck===dateKey(y) ? s.streak+1 : 1;
  s.weekly = Math.min(7, s.weekly+1);
  s.lastCheck = todayKey();
  LS.set("fit_streak", s);
  const cal = LS.get("fit_calendar",{});
  if(!cal[todayKey()]) cal[todayKey()]="planned";
  LS.set("fit_calendar", cal);
  toast(`打卡成功 · 连续 ${s.streak} 天`);
  renderHome();
}

function muscleEmoji(m){
  const map={"胸大肌":"💪","背阔肌":"🔙","股四头肌":"🦵","三角肌":"🏋️","肱二头肌":"💪","腘绳肌":"🦵","竖脊肌":"脊柱"};
  return map[m]||"🏋️";
}

function renderLibrary(){

  const muscles=[...new Set(exs.map(e=>e.muscle))];
  const equip=[...new Set(exs.map(e=>e.equipment))];
  let filtered = exs.filter(e=>{
    if(filterEx && !(e.name.includes(filterEx)||e.muscle.includes(filterEx)||e.equipment.includes(filterEx))) return false;

    ${filtered.length===0?`<div class="empty-state"><span class="emoji">🔍</span>未找到匹配动作</div>`:""}
  `;
  enableDragSort("#exList", ".list-item", (newOrder)=>{
    const all = LS.get("fit_exercises",[]);
    const reordered = newOrder.map(id=>all.find(e=>e.id===id)).filter(Boolean);
    const rest = all.filter(e=>!newOrder.includes(e.id));
    LS.set("fit_exercises", [...reordered, ...rest]);
  });
}

let curMuscle="", curEquip="";

function openExercise(id){
  const ex = LS.get("fit_exercises",[]).find(e=>e.id===id);
  if(!ex) return;
  const workouts = LS.get("fit_workouts",[]).filter(w=>w.focus===ex.muscle);
  const lastW = workouts[0];

  // Issue 6: 1RM 历史曲线数据
  const rmHistory = workouts.slice(0,10).reverse().map(w=>{
    const s = w.sets[0];
    return {date:w.date, rm:oneRM(s.weight,s.reps)};
  });

  let rmChartSvg = '';
  if(rmHistory.length >= 2){
    const W=280,H=100,pad=20;
    const vals=rmHistory.map(d=>d.rm);
    const mn=Math.min(...vals)-5, mx=Math.max(...vals)+5;
    const x=i=>pad+i*(W-pad*2)/(rmHistory.length-1);
    const y=v=>H-pad-(v-mn)/(mx-mn||1)*(H-pad*2);
    const path=rmHistory.map((d,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(d.rm).toFixed(1)}`).join(" ");
    rmChartSvg = `
      <div class="section-title">1RM 趋势</div>
      <svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}">
        <path d="${path}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/>
        ${rmHistory.map((d,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(d.rm).toFixed(1)}" r="3" fill="var(--blue)"/>`).join("")}
        <text x="${pad-4}" y="${y(mx)+4}" font-size="8" fill="var(--text-2)" text-anchor="end">${mx.toFixed(0)}</text>
        <text x="${pad-4}" y="${y(mn)+4}" font-size="8" fill="var(--text-2)" text-anchor="end">${mn.toFixed(0)}</text>
      </svg>`;
  }

  showSheet(`

/* ---- 训练执行 ---- */
let workoutState=null;
function startWorkout(planId){
  const plans=LS.get("fit_plans",[]);
  const active = planId?plans.find(p=>p.id===planId):plans.find(p=>p.active)||plans[0];
  if(!active){ toast("请先启用一个计划"); switchTab(2, "plans"); return; }
  const today=new Date(); const dl=["周日","周一","周二","周三","周四","周五","周六"][today.getDay()];
  const dayPlan=active.days.find(d=>d.label===dl)||active.days.find(d=>d.exercises.length)||active.days[0];
  const exs=LS.get("fit_exercises",[]);
  const items=(dayPlan?.exercises||[]).map(n=>exs.find(e=>e.name===n)).filter(Boolean);
  if(!items.length){ toast("今日无训练动作"); return; }
  workoutState={
    plan:active.name, focus:dayPlan?.focus||"训练", start:Date.now(),
    items:items.map(e=>({id:e.id, name:e.name, muscle:e.muscle, met:e.met, sets:Array.from({length:3},(_,i)=>({weight:e.difficulty*15, reps:10, rpe:7, done:false, failure:false}))})),
    idx:0, setIdx:0, paused:false, calories:0
  };
  document.getElementById("tabbar").classList.add("hidden");
  renderWorkout();
}
function renderWorkout(){
  const fs=document.getElementById("fullscreen");
  const st=workoutState;
  const cur=st.items[st.idx];
  const totalSets=st.items.reduce((a,it)=>a+it.sets.length,0);
  const doneSets=st.items.reduce((a,it)=>a+it.sets.filter(s=>s.done).length,0);
  const profile=LS.get("fit_profile",{});
  fs.innerHTML=`
    <div class="workout-top">
      <div class="row-between">
        <button class="icon-btn" onclick="pauseWorkout()">⏸</button>
        <div class="center" style="flex:1"><b>${st.plan}</b><div class="tiny muted">${st.focus} · ${st.idx+1}/${st.items.length}</div></div>
        <button class="icon-btn" onclick="endWorkout()" style="color:var(--primary)">结束</button>
      </div>
      <div class="progress-bar"><div style="width:${doneSets/totalSets*100}%"></div></div>
      <div class="row-between mt8"><span class="tiny muted">⏱ <span id="wkTime">00:00</span></span><span class="tiny muted">🔥 <span id="wkCal">${st.calories}</span> kcal</span></div>
    </div>
    <div class="workout-main">
      <div class="exercise-card-big">
        <div class="exercise-img">${muscleEmoji(cur.muscle)}</div>
        <div style="padding:16px">
          <div style="font-size:20px;font-weight:800">${cur.name}</div>
          <div class="tiny muted mt4">${cur.muscle} · ${cur.sets.length}组</div>
          <div class="mt12">
            ${cur.sets.map((s,i)=>`
              <div class="set-pill ${s.done?'done':''}">
                <span class="set-no">第${i+1}组</span>
                <span class="mono">${s.weight}kg × ${s.reps} · RPE${s.rpe}</span>
                ${s.done?'✓':`<button class="btn btn-sm btn-primary" onclick="completeSet(${i})">完成</button>`}
              </div>`).join("")}
          </div>
          <div class="row-between mt12">
            <button class="btn btn-sm" onclick="swapExercise()">🔄 换动作</button>
            <label class="tiny muted"><input type="checkbox" ${cur.sets[cur.sets.length-1].failure?'checked':''} onchange="toggleFailure()"> 末组力竭</label>
          </div>
        </div>
      </div>
      <div class="center mt12 tiny muted">滑动调整下一组数据 ↓</div>
      <div class="card tight mt8">
        <div class="slider-row"><span class="tiny muted">重量</span><input type="range" min="5" max="200" value="${cur.sets[st.setIdx]?.weight||60}" id="setW" oninput="updateSetPreview()"><span class="val-badge" id="setWv">60kg</span></div>
        <div class="slider-row mt8"><span class="tiny muted">次数</span><input type="range" min="1" max="30" value="${cur.sets[st.setIdx]?.reps||10}" id="setR" oninput="updateSetPreview()"><span class="val-badge" id="setRv">10</span></div>
        <div class="slider-row mt8"><span class="tiny muted">RPE</span><input type="range" min="1" max="10" value="${cur.sets[st.setIdx]?.rpe||7}" id="setE" oninput="updateSetPreview()"><span class="val-badge" id="setEv">7</span></div>
        <div class="center mt8 tiny muted">1RM ≈ <b class="mono" id="set1RM" style="color:var(--primary)">75.0</b> kg</div>
      </div>
    </div>
    <div class="workout-bottom">
      <button class="btn btn-primary btn-block" onclick="completeSet(${st.setIdx})">✓ 完成第 ${st.setIdx+1} 组</button>
    </div>
  `;
  fs.classList.add("show");
  updateSetPreview();
  startTimer();
}
let wkTimer;
function startTimer(){
  clearInterval(wkTimer);
  wkTimer=setInterval(()=>{
    if(!workoutState||workoutState.paused) return;
    const s=Math.floor((Date.now()-workoutState.start)/1000);
    const el=document.getElementById("wkTime");
    if(el) el.textContent=`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
    const profile=LS.get("fit_profile",{});
    const cur=workoutState.items[workoutState.idx];
    const cal=calcCalories(cur?.met||5, profile.weight||70, s/60);
    workoutState.calories=cal;
    const ce=document.getElementById("wkCal"); if(ce) ce.textContent=cal;
  },1000);
}
function updateSetPreview(){
  if(!workoutState) return;
  const w=+document.getElementById("setW").value, r=+document.getElementById("setR").value, e=+document.getElementById("setE").value;
  document.getElementById("setWv").textContent=w+"kg";
  document.getElementById("setRv").textContent=r;
  document.getElementById("setEv").textContent=e;
  document.getElementById("set1RM").textContent=oneRM(w,r).toFixed(1);
  const cur=workoutState.items[workoutState.idx];
  if(cur.sets[workoutState.setIdx]){ cur.sets[workoutState.setIdx].weight=w; cur.sets[workoutState.setIdx].reps=r; cur.sets[workoutState.setIdx].rpe=e; }
}
function toggleFailure(){
  const cur=workoutState.items[workoutState.idx];
  cur.sets[cur.sets.length-1].failure=!cur.sets[cur.sets.length-1].failure;
  toast(cur.sets[cur.sets.length-1].failure?"已标记力竭":"已取消力竭");
}

// Issue 5: 语音播报
function completeSet(i){
  const cur=workoutState.items[workoutState.idx];
  cur.sets[i].done=true;
  workoutState.setIdx=i+1;
  // Issue 5: 语音播报
  const settings = LS.get("fit_settings",{});
  if(settings.voiceNotify && window.speechSynthesis){
    const utter = new SpeechSynthesisUtterance(`第${i+1}组完成`);
    utter.lang = "zh-CN"; utter.rate = 1.1;
    speechSynthesis.speak(utter);
  }
  if(cur.sets.every(s=>s.done)){
    workoutState.idx++;
    workoutState.setIdx=0;
    if(workoutState.idx>=workoutState.items.length){ endWorkout(true); return; }
    startRest();
  }else{
    startRest();
  }
}

// Issue 4: restRemaining 全局变量
let restRemaining = 0;
let restTimerId = null;
let restTotal = 0;

function startRest(){
  const ro=document.getElementById("restOverlay");
  let rest=90;
  const lastRPE=workoutState.items[workoutState.idx]?.sets[workoutState.setIdx-1]?.rpe || 7;
  const adj=(lastRPE-7)*15; rest=Math.max(30,90+adj);
  restRemaining = rest;
  restTotal = rest;
  ro.innerHTML=`
    <div class="tiny" style="color:#fff;opacity:.7;margin-bottom:10px">组间休息 · 智能调整 ${adj>=0?"+":""}${adj}s</div>
    <div class="rest-ring">
      <svg width="220" height="220"><circle cx="110" cy="110" r="100" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="8"/><circle id="restArc" cx="110" cy="110" r="100" fill="none" stroke="var(--primary)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${2*Math.PI*100}" stroke-dashoffset="0"/></svg>
      <div class="rest-num"><div class="n" id="restN">${rest}</div><div class="l">秒后下一组</div></div>
    </div>
    <div class="mt20" style="color:#fff;opacity:.7;text-align:center">
      <div>下一个：${workoutState.items[workoutState.idx]?.name||"完成"}</div>
    </div>
    <div class="row-between mt20" style="gap:12px">
      <button class="btn" style="background:rgba(255,255,255,.15);color:#fff" onclick="skipRest()">跳过</button>
      <button class="btn" style="background:rgba(255,255,255,.15);color:#fff" onclick="addRest(15)">+15s</button>
      <button class="btn btn-primary" onclick="skipRest()">立即开始</button>
    </div>
  `;
  ro.classList.add("show");
  if(navigator.vibrate) navigator.vibrate(200);
  const C=2*Math.PI*100;
  clearInterval(restTimerId);
  restTimerId=setInterval(()=>{
    restRemaining--;
    const n=document.getElementById("restN");
    if(!n){ clearInterval(restTimerId); return; }
    n.textContent=restRemaining;
    document.getElementById("restArc").setAttribute("stroke-dashoffset", C*(1-restRemaining/restTotal));
    if(restRemaining<=0){ clearInterval(restTimerId); skipRest(); }
  },1000);
}
function skipRest(){
  clearInterval(restTimerId);
  document.getElementById("restOverlay").classList.remove("show");
  renderWorkout();
}

function addRest(s){
  restRemaining += s;
  restTotal += s;
  const n=document.getElementById("restN");
  if(n) n.textContent=restRemaining;
  toast(`+${s}s · 剩余 ${restRemaining}s`);
}

function doSwap(id){

function pauseWorkout(){

function endWorkout(completed){
  if(!workoutState) return;
  if(!completed && !confirm("提前结束训练？")) return;
  clearInterval(wkTimer);
  const st=workoutState;
  const duration=Math.round((Date.now()-st.start)/60000);
  const sets=st.items.flatMap(it=>it.sets.filter(s=>s.done).map(s=>({...s, name:it.name, muscle:it.muscle})));
  const volume=sets.reduce((a,s)=>a+s.weight*s.reps,0);
  const w={id:uid(), date:todayKey(), plan:st.plan, focus:st.focus, duration, sets:sets, volume, calories:st.calories};
  const ws=LS.get("fit_workouts",[]); ws.unshift(w); LS.set("fit_workouts",ws);
  const cal=LS.get("fit_calendar",{}); cal[todayKey()]="done"; LS.set("fit_calendar",cal);
  const sk=LS.get("fit_streak",{streak:0,weekly:0,lastCheck:""});
  if(sk.lastCheck!==todayKey()){ const y=new Date(); y.setDate(y.getDate()-1); sk.streak=sk.lastCheck===dateKey(y)?sk.streak+1:1; sk.weekly=Math.min(7,sk.weekly+1); sk.lastCheck=todayKey(); LS.set("fit_streak",sk); }

  workoutState=null;

}

function drawWeightChart(){
  let body=LS.get("fit_body",[]);
  if(chartRange>0) body=body.slice(-chartRange);
  if(!body.length) return;
  const box=document.getElementById("weightChart");
  if(!box) return;
  const W=box.clientWidth||320, H=180, pad=28;
  const ws=body.map(b=>b.weight);
  const min=Math.min(...ws)-1, max=Math.max(...ws)+1;
  const x=i=>pad+i*(W-pad*2)/(body.length-1||1);
  const y=w=>H-pad-(w-min)/(max-min||1)*(H-pad*2);
  const path=body.map((b,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(b.weight).toFixed(1)}`).join(" ");
  const area=path+`L${x(body.length-1).toFixed(1)},${H-pad}L${x(0).toFixed(1)},${H-pad}Z`;
  box.innerHTML=`
    <svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" style="touch-action:none">
      <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--primary)" stop-opacity=".25"/><stop offset="1" stop-color="var(--primary)" stop-opacity="0"/></linearGradient></defs>
      <path d="${area}" fill="url(#wg)"/>
      <path d="${path}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round"/>
      ${body.map((b,i)=>`<circle class="drag-pt" data-i="${i}" cx="${x(i).toFixed(1)}" cy="${y(b.weight).toFixed(1)}" r="6" fill="var(--surface)" stroke="var(--primary)" stroke-width="2.5" style="cursor:ns-resize"/>`).join("")}
      <text x="${pad-6}" y="${y(min)+4}" font-size="9" fill="var(--text-2)" text-anchor="end">${min.toFixed(1)}</text>
      <text x="${pad-6}" y="${y(max)+4}" font-size="9" fill="var(--text-2)" text-anchor="end">${max.toFixed(1)}</text>
    </svg>`;
  const svg=box.querySelector("svg");
  let dragPt=null;
  const onMove=e=>{
    if(!dragPt) return;
    const r=svg.getBoundingClientRect();
    const cy=e.touches?e.touches[0].clientY-r.top:e.clientY-r.top;
    let nw=max-(cy-pad)/(H-pad*2)*(max-min);
    nw=Math.max(min,Math.min(max,nw));
    const i=+dragPt.dataset.i;
    body[i].weight=Math.round(nw*10)/10;
    dragPt.setAttribute("cy", y(nw));
    box.querySelector("path").setAttribute("d", body.map((b,j)=>`${j?"L":"M"}${x(j).toFixed(1)},${y(b.weight).toFixed(1)}`).join(" "));
  };
  svg.addEventListener("pointerdown",e=>{ if(e.target.classList.contains("drag-pt")){ dragPt=e.target; svg.setPointerCapture(e.pointerId); } });
  svg.addEventListener("pointermove",onMove);
  svg.addEventListener("pointerup",e=>{ if(dragPt){ dragPt=null; const all=LS.get("fit_body",[]); body.forEach((nb,i)=>{ const idx=all.findIndex(a=>a.date===nb.date); if(idx>=0) all[idx]=nb; }); LS.set("fit_body",all); toast("已调整 · 已保存"); renderBody(); } });
}

    });

  }

  c.innerHTML=`

      <div class="field"><label>选择动作</label>
        <select class="input" id="strEx" onchange="drawStrength()">
          ${LS.get("fit_exercises",[]).map(e=>`<option value="${e.muscle}">${e.name}</option>`).join("")}
        </select>
      </div>
      <div class="chart-box" id="strChart"></div>
    </div>
    <div class="card">
      <div class="card-h"><h3>周/月负荷柱状图</h3></div>
      <div class="chart-box" id="loadChart"></div>
    </div>

    <!-- Issue 8: 超量恢复曲线 -->
    <div class="card">
      <div class="card-h"><h3>超量恢复曲线</h3></div>
      ${recoverySvg || '<div class="empty-state tiny">暂无恢复数据</div>'}
      <div class="tiny muted center mt8">恢复百分比基于 RPE×8h 模型</div>
    </div>

function drawRadar(){
  const box=document.getElementById("radarBox"); if(!box) return;
  const ws=LS.get("fit_workouts",[]).filter(w=>{ const d=new Date(w.date); const ago=new Date(); ago.setDate(ago.getDate()-30); return d>=ago; });
  const muscles=["胸大肌","背阔肌","股四头肌","三角肌","肱二头肌","腘绳肌"];
  const counts=muscles.map(m=>ws.filter(w=>w.focus===m).length);
  const max=Math.max(1,...counts);
  const cx=110,cy=110,R=80;
  const pt=(i,r)=>[cx+Math.sin(i*Math.PI/3)*r, cy-Math.cos(i*Math.PI/3)*r];
  const poly=counts.map((c,i)=>pt(i,R*c/max).join(",")).join(" ");
  let grid="";
  for(let g=1;g<=4;g++){ grid+=`<polygon points="${muscles.map((_,i)=>pt(i,R*g/4).join(",")).join(" ")}" fill="none" stroke="var(--border)" stroke-width="1"/>`; }
  const labels=muscles.map((m,i)=>{ const [x,y]=pt(i,R+14); return `<text x="${x}" y="${y+3}" font-size="10" fill="var(--text-2)" text-anchor="middle">${m.slice(0,2)}</text>`; }).join("");
  box.innerHTML=`<svg width="220" height="220" viewBox="0 0 220 220">${grid}<polygon points="${poly}" fill="var(--primary)" fill-opacity=".25" stroke="var(--primary)" stroke-width="2"/>${counts.map((c,i)=>`<circle cx="${pt(i,R*c/max)[0]}" cy="${pt(i,R*c/max)[1]}" r="3" fill="var(--primary)"/>`).join("")}${labels}</svg>`;
}
function drawStrength(){
  const box=document.getElementById("strChart"); if(!box) return;
  const sel=document.getElementById("strEx")?.value;
  const ws=LS.get("fit_workouts",[]).filter(w=>w.focus===sel).reverse();
  if(!ws.length){ box.innerHTML='<div class="empty-state tiny">暂无该肌群数据</div>'; return; }
  const W=box.clientWidth||320,H=140,pad=24;
  const data=ws.map(w=>{ const s=w.sets[0]; return oneRM(s.weight,s.reps); });
  const min=Math.min(...data)-5,max=Math.max(...data)+5;
  const x=i=>pad+i*(W-pad*2)/(data.length-1||1);
  const y=v=>H-pad-(v-min)/(max-min||1)*(H-pad*2);
  const path=data.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  box.innerHTML=`<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}"><path d="${path}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round"/>${data.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4" fill="var(--blue)"/>`).join("")}<text x="${pad-4}" y="${y(max)+4}" font-size="9" fill="var(--text-2)" text-anchor="end">${max.toFixed(0)}</text><text x="${pad-4}" y="${y(min)+4}" font-size="9" fill="var(--text-2)" text-anchor="end">${min.toFixed(0)}</text></svg>`;
}
function drawLoad(){
  const box=document.getElementById("loadChart"); if(!box) return;
  const ws=LS.get("fit_workouts",[]);
  const weeks={};
  ws.forEach(w=>{ const d=new Date(w.date); const y=new Date(d); y.setDate(d.getDate()-d.getDay()); const k=y.toISOString().slice(0,10); weeks[k]=(weeks[k]||0)+w.volume; });
  const arr=Object.entries(weeks).sort().slice(-6);
  const W=box.clientWidth||320,H=140,pad=24;
  const max=Math.max(1,...arr.map(a=>a[1]));
  const bw=(W-pad*2)/arr.length-8;
  box.innerHTML=`<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}">${arr.map((a,i)=>{ const h=(a[1]/max)*(H-pad*2); const x=pad+i*((W-pad*2)/arr.length); const y=H-pad-h; return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="var(--primary)"/><text x="${x+bw/2}" y="${H-pad+12}" font-size="9" fill="var(--text-2)" text-anchor="middle">${a[0].slice(5)}</text><text x="${x+bw/2}" y="${y-4}" font-size="9" fill="var(--text)" text-anchor="middle" font-family="var(--mono)">${a[1]}</text>`; }).join("")}</svg>`;
}

function backupData(){

  const blob=new Blob([JSON.stringify(all,null,2)],{type:"application/json"});

function restoreData(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json";
  inp.onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); Object.entries(d).forEach(([k,v])=>localStorage.setItem(k,v)); toast("恢复成功"); renderProfile(); }catch(err){ toast("文件无效"); } }; r.readAsText(f); };

}

let authMode = "login"; // login | register

function showAuthScreen(){
  const as = document.getElementById("authScreen");
  as.classList.remove("hide");
  renderAuth();
}

function hideAuthScreen(){
  document.getElementById("authScreen").classList.add("hide");
}

function renderAuth(){
  const as = document.getElementById("authScreen");
  as.innerHTML = `
    <div class="auth-logo">🏋️</div>
    <div class="auth-title">健身助手</div>
    <div class="auth-sub">科学训练 · 量化进步 · 长期坚持</div>
    <div class="auth-tabs">
      <button class="${authMode==='login'?'active':''}" onclick="authMode='login';renderAuth()">登录</button>
      <button class="${authMode==='register'?'active':''}" onclick="authMode='register';renderAuth()">注册</button>
    </div>
    <div class="auth-form">
      <div class="auth-error" id="authError"></div>
      ${authMode==='register'?`<div class="field"><label>昵称</label><input class="input" id="authNick" placeholder="你的昵称" autocomplete="off"></div>`:''}
      <div class="field"><label>账号</label><input class="input" id="authUser" placeholder="手机号 / 邮箱" autocomplete="off"></div>
      <div class="field"><label>密码</label><input class="input" id="authPass" type="password" placeholder="至少6位" autocomplete="off"></div>
      ${authMode==='register'?`<div class="field"><label>确认密码</label><input class="input" id="authPass2" type="password" placeholder="再次输入密码" autocomplete="off"></div>`:''}
      <button class="btn btn-primary btn-block" style="height:48px;font-size:16px" onclick="doAuth()">${authMode==='login'?'登 录':'注 册'}</button>
      ${authMode==='login'?`<div class="center mt12"><button class="btn btn-ghost tiny" onclick="authMode='register';renderAuth()">没有账号？立即注册</button></div>`:`<div class="center mt12"><button class="btn btn-ghost tiny" onclick="authMode='login';renderAuth()">已有账号？去登录</button></div>`}
    </div>
  `;
  as.querySelectorAll('.input').forEach(inp=>{
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') doAuth(); });
  });
}

function doAuth(){
  const user = document.getElementById("authUser")?.value.trim();
  const pass = document.getElementById("authPass")?.value;
  const errEl = document.getElementById("authError");
  errEl.textContent = "";

  if(!user){ errEl.textContent="请输入账号"; return; }
  if(!pass || pass.length < 6){ errEl.textContent="密码至少6位"; return; }

  const users = LS.get("fit_users", {});

  if(authMode === "register"){
    const nick = document.getElementById("authNick")?.value.trim() || user;
    const pass2 = document.getElementById("authPass2")?.value;
    if(pass !== pass2){ errEl.textContent="两次密码不一致"; return; }
    if(users[user]){ errEl.textContent="该账号已注册"; return; }
    users[user] = { password: pass, nickname: nick };
    LS.set("fit_users", users);
    LS.set("fit_auth", { user, nickname: nick, loginTime: Date.now() });
    const p = LS.get("fit_profile",{});
    if(!p.nickname || p.nickname==="阿健") p.nickname = nick;
    LS.set("fit_profile", p);
    toast("注册成功，欢迎 " + nick);
    hideAuthScreen();
    renderAll();
    showOnboard();
  } else {
    if(!users[user]){ errEl.textContent="账号不存在，请先注册"; return; }
    if(users[user].password !== pass){ errEl.textContent="密码错误"; return; }
    LS.set("fit_auth", { user, nickname: users[user].nickname, loginTime: Date.now() });
    toast("欢迎回来，" + users[user].nickname);
    hideAuthScreen();
    renderAll();
  }
}

function isLoggedIn(){
  const auth = LS.get("fit_auth", null);
  return auth && auth.user;
}

  return LS.get("fit_auth", {});
}

/* ============================================================
   contenteditable 绑定
   ============================================================ */
function bindEditable(root){
  root.querySelectorAll('[contenteditable="true"][data-edit]').forEach(el=>{
    el.addEventListener("blur",()=>{
      const key=el.dataset.edit, field=el.dataset.field, id=el.dataset.id;
      const data=LS.get(key,[]);
      let target;
      if(Array.isArray(data)){ target=data.find(x=>x.id===id); }
      else { target=data; }
      if(target){
        let val = el.textContent.trim();
        // Issue 11: 检查原始值类型，如果是数字则解析为数字
        const origType = el.dataset.origType;
        if(origType === "number" || (typeof target[field] === "number")){
          const num = Number(val);
          if(!isNaN(num)) val = num;
        }
        target[field]=val;
        LS.set(key,data);
      }
      el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"),1000);
      toast("已保存");
    });
    el.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); el.blur(); } });
  });
}

/* ============================================================
   Sheet / 全屏
   ============================================================ */
function showSheet(html){
  const ov=document.getElementById("overlay");
  ov.innerHTML=`<div class="sheet">${html}</div>`;
  ov.classList.add("show");
}
function closeSheet(){ document.getElementById("overlay").classList.remove("show"); }

/* ============================================================
   搜索 (Issue 14: 跳转后正确渲染)
   ============================================================ */
function openSearch(){
  showSheet(`
    <div class="sheet-h"><h3>全局搜索</h3><button class="icon-btn" onclick="closeSheet()">✕</button></div>
    <div class="sheet-body">
      <input class="search-input" placeholder="搜索动作 / 计划 / 记录" oninput="doSearch(this.value)" autofocus>
      <div id="searchResult" class="mt12"></div>
    </div>
  `);
}
function doSearch(q){
  const box=document.getElementById("searchResult");
  if(!q){ box.innerHTML=""; return; }
  const exs=LS.get("fit_exercises",[]).filter(e=>e.name.includes(q)||e.muscle.includes(q));
  const plans=LS.get("fit_plans",[]).filter(p=>p.name.includes(q));
  const ws=LS.get("fit_workouts",[]).filter(w=>w.focus.includes(q)||w.plan.includes(q));
  box.innerHTML=`
    ${exs.length?`<div class="section-title">动作</div>${exs.map(e=>`<div class="list-item" onclick="closeSheet();openExercise('${e.id}')"><div class="thumb">${muscleEmoji(e.muscle)}</div><div class="info"><div class="name">${e.name}</div><div class="sub">${e.muscle}</div></div></div>`).join("")}`:""}
    ${plans.length?`<div class="section-title">计划</div>${plans.map(p=>`<div class="list-item" onclick="closeSheet();switchTab(2,'plans')"><div class="thumb">📋</div><div class="info"><div class="name">${p.name}</div><div class="sub">${p.type}</div></div></div>`).join("")}`:""}
    ${ws.length?`<div class="section-title">训练记录</div>${ws.slice(0,5).map(w=>`<div class="list-item" onclick="closeSheet();switchTab(3,'insight');setTimeout(()=>viewWorkout('${w.id}'),100)"><div class="thumb">🏋️</div><div class="info"><div class="name">${w.plan} · ${w.focus}</div><div class="sub">${w.date}</div></div></div>`).join("")}`:""}
    ${!exs.length&&!plans.length&&!ws.length?'<div class="empty-state tiny">无结果</div>':''}
  `;
}

/* ============================================================
   拖拽排序
   ============================================================ */
function enableDragSort(listSel, itemSel, onOrder){
  const list=document.querySelector(listSel); if(!list) return;
  let dragEl=null;
  list.querySelectorAll(itemSel).forEach(item=>{
    item.addEventListener("dragstart",e=>{ dragEl=item; item.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; });
    item.addEventListener("dragend",()=>{ item.classList.remove("dragging"); list.querySelectorAll(itemSel).forEach(i=>i.classList.remove("drag-over")); });
    item.addEventListener("dragover",e=>{ e.preventDefault(); if(item!==dragEl) item.classList.add("drag-over"); });
    item.addEventListener("dragleave",()=>item.classList.remove("drag-over"));
    item.addEventListener("drop",e=>{ e.preventDefault(); if(item!==dragEl){ list.insertBefore(dragEl,item); const order=[...list.querySelectorAll(itemSel)].map(i=>i.dataset.id).filter(Boolean); onOrder(order); toast("顺序已保存"); } });
  });
}

/* ============================================================
   首次引导
   ============================================================ */
function showOnboard(){
  if(LS.get("fit_onboarded")) return;
  const steps=[
    {e:"🏋️",t:"欢迎使用健身助手",d:"科学训练 · 量化进步 · 长期坚持"},
    {e:"💪",t:"训练全流程",d:"动作库 → 计划 → 全屏执行 → 数据洞察"},
    {e:"📊",t:"数据驱动",d:"体重趋势、力量曲线、肌群雷达一目了然"},
    {e:"✏️",t:"即时编辑",d:"所有文本可点击编辑，滑块调节数值，自动保存"},
  ];
  let i=0;
  const ob=document.getElementById("onboard");
  function render(){
    const s=steps[i];
    ob.innerHTML=`<div class="emoji">${s.e}</div><h2>${s.t}</h2><p>${s.d}</p>
      <div style="display:flex;gap:10px"><button class="btn btn-ghost" onclick="skipOnboard()">跳过</button><button class="btn btn-primary" onclick="nextOnboard()">${i===steps.length-1?"开始使用":"下一步"}</button></div>
      <div class="onboard-dots">${steps.map((_,j)=>`<i class="${j===i?'active':''}"></i>`).join("")}</div>`;
  }
  window.nextOnboard=()=>{ i++; if(i>=steps.length) skipOnboard(); else render(); };
  window.skipOnboard=()=>{ LS.set("fit_onboarded",true); ob.classList.remove("show"); };
  render(); ob.classList.add("show");
}

/* ============================================================
   撤销 (Issue 12: 接入 deletePlan)
   ============================================================ */
let lastDeleted=null;
function rememberDelete(key, item){ lastDeleted={key,item,time:Date.now()}; }
function undoDelete(){
  if(!lastDeleted){ toast("无可撤销操作"); return; }
  const {key,item} = lastDeleted;
  const data = LS.get(key, []);
  if(Array.isArray(data)){
    item.active = data.length===0;
    data.push(item);
    LS.set(key, data);
  }
  lastDeleted = null;
  toast("已撤销删除");
  renderAll();
}

function init(){
  seedData();

  if(isLoggedIn()){
    renderHome();
    showOnboard();
  } else {
    showAuthScreen();
  }
}
init();
</script>
