<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PromptNest Demo｜提示词管理应用</title>
  <style>
    :root{
      --bg:#0b1220;
      --panel:#0f1a2d;
      --panel2:rgba(255,255,255,0.04);
      --ink:#e5e7eb;
      --muted:#9aa4b2;
      --rule:rgba(255,255,255,0.12);
      --accent:#60a5fa;
      --accent2:#a78bfa;
      --danger:#fb7185;
      --ok:#34d399;
      --shadow: 0 12px 28px rgba(0,0,0,0.35);
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --max: 1200px;
    }
    *{ box-sizing:border-box; }
    html{ scroll-behavior:smooth; }
    body{
      margin:0;
      font-family:var(--font);
      color:var(--ink);
      background:
        radial-gradient(1200px 520px at 18% -10%, rgba(96,165,250,0.25), transparent 55%),
        radial-gradient(900px 460px at 85% 12%, rgba(167,139,250,0.18), transparent 60%),
        var(--bg);
    }
    a{ color:var(--accent); text-decoration:none; }
    a:hover{ text-decoration:underline; }
    .wrap{ max-width:var(--max); margin:0 auto; padding:22px 16px 32px; }

    /* Topbar */
    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; padding:16px 16px;
      border:1px solid var(--rule);
      border-radius:16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      box-shadow: var(--shadow);
    }
    .brand{
      display:flex; align-items:center; gap:12px;

    }
    .logo{
      width:40px; height:40px; border-radius:12px;
      background: linear-gradient(135deg, rgba(96,165,250,0.95), rgba(167,139,250,0.95));
      box-shadow: 0 10px 22px rgba(0,0,0,0.25);
      display:grid; place-items:center;
      font-weight:900; letter-spacing:0.6px;
    }
    .brand h1{ margin:0; font-size:1.05rem; line-height:1.2; }
    .brand p{ margin:2px 0 0; color:var(--muted); font-size:0.86rem; }
    .top-actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }

    /* Layout */
    .grid{
      margin-top:14px;
      display:grid;
      grid-template-columns: 360px 1fr;
      gap:14px;
      align-items:start;
    }
    .card{
      border:1px solid var(--rule);
      border-radius:16px;
      background: rgba(255,255,255,0.03);
      box-shadow: 0 10px 24px rgba(0,0,0,0.20);
      overflow:hidden;
    }
    .card .hd{
      padding:12px 14px;
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      border-bottom:1px solid var(--rule);
      background: rgba(255,255,255,0.02);
    }
    .card .hd h2{ margin:0; font-size:0.95rem; }
    .card .bd{ padding:12px 14px; }

    /* Inputs */
    .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .row + .row{ margin-top:10px; }
    .field{ display:flex; flex-direction:column; gap:6px; width:100%; }
    label{ font-size:0.82rem; color:var(--muted); }
    input[type="text"], textarea, select{
      width:100%;
      border:1px solid var(--rule);
      border-radius:12px;
      padding:10px 12px;
      color:var(--ink);
      background: rgba(255,255,255,0.03);
      outline:none;
    }
    textarea{
      min-height: 160px;
      resize: vertical;
      font-family: var(--mono);
      line-height:1.55;
    }
    .hint{ font-size:0.82rem; color:var(--muted); }
    .mono{ font-family: var(--mono); }

    /* Buttons */
    .btn{
      border:1px solid var(--rule);
      background: rgba(255,255,255,0.03);
      color:var(--ink);
      padding:9px 12px;
      border-radius:12px;
      cursor:pointer;
      display:inline-flex;
      gap:8px;
      align-items:center;
      transition: transform .06s ease, background .15s ease, border-color .15s ease;
      user-select:none;
    }
    .btn:hover{ background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.18); }
    .btn:active{ transform: translateY(1px); }
    .btn.primary{
      border-color: rgba(96,165,250,0.45);
      background: rgba(96,165,250,0.14);
    }
    .btn.ghost{ background: transparent; }
    .btn.danger{
      border-color: rgba(251,113,133,0.45);
      background: rgba(251,113,133,0.12);
    }
    .btn.ok{
      border-color: rgba(52,211,153,0.45);
      background: rgba(52,211,153,0.10);
    }
    .btn.small{ padding:6px 10px; border-radius:10px; font-size:0.86rem; }
    .btn[disabled]{ opacity:0.55; cursor:not-allowed; }

    /* List */
    .filters{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .tags{
      display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;
    }
    .tag{
      font-size:0.78rem;
      padding:4px 10px;
      border-radius: 999px;
      border:1px solid var(--rule);
      background: rgba(255,255,255,0.03);
      cursor:pointer;
      user-select:none;
    }
    .tag.on{
      border-color: rgba(96,165,250,0.55);
      background: rgba(96,165,250,0.12);
    }
    .list{
      margin-top:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
      max-height: 56vh;
      overflow:auto;
      padding-right: 4px;
    }
    .item{
      border:1px solid var(--rule);
      border-radius:14px;
      background: rgba(255,255,255,0.02);
      padding:10px 10px;
      display:flex;
      gap:10px;
      align-items:flex-start;
    }
    .item:hover{ background: rgba(255,255,255,0.04); }
    .item.on{ border-color: rgba(167,139,250,0.55); background: rgba(167,139,250,0.10); }
    .item .meta{ flex:1; min-width:0; }
    .item .title{
      font-weight:800;
      font-size:0.95rem;
      margin:0;
      display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    }
    .pill{
      font-size:0.72rem;
      color: var(--muted);
      border:1px solid var(--rule);
      padding:2px 8px;
      border-radius:999px;
      background: rgba(255,255,255,0.02);
    }
    .item .desc{
      margin:6px 0 0;
      color: var(--muted);
      font-size:0.82rem;
      overflow:hidden;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient: vertical;
    }
    .item .ops{ display:flex; flex-direction:column; gap:6px; }

    /* Editor */
    .split{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
    }
    .preview{
      border:1px dashed rgba(255,255,255,0.20);
      border-radius:14px;
      background: rgba(255,255,255,0.02);
      padding:10px 12px;
      min-height: 160px;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: var(--mono);
      line-height:1.55;
    }
    .preview .muted{ color: var(--muted); }
    .kv{
      display:flex; gap:8px; flex-wrap:wrap;
    }
    .kv input{ flex:1; min-width: 160px; }
    .versions{
      margin-top:10px;
      display:flex; flex-direction:column; gap:8px;
      max-height: 210px; overflow:auto; padding-right:4px;
    }
    .v{
      border:1px solid var(--rule);
      border-radius:14px;
      background: rgba(255,255,255,0.02);
      padding:10px 10px;
    }
    .v .top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .v .top .t{ font-weight:800; font-size:0.9rem; }
    .v .top .s{ color:var(--muted); font-size:0.78rem; }
    .v pre{
      margin:8px 0 0;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid var(--rule);
      background: rgba(255,255,255,0.03);
      overflow:auto;
      font-family: var(--mono);
      font-size:0.82rem;
      white-space: pre;
    }
    .toast{
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(15,26,45,0.92);
      border: 1px solid var(--rule);
      color: var(--ink);
      padding: 10px 12px;
      border-radius: 999px;
      box-shadow: var(--shadow);
      font-size: 0.9rem;
      opacity: 0;
      pointer-events:none;
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.on{ opacity: 1; transform: translateX(-50%) translateY(-2px); }

    /* Modal */
    .modal-mask{
      position:fixed; inset:0;
      background: rgba(0,0,0,0.55);
      display:none;
      align-items:center; justify-content:center;
      padding:18px;
      z-index:50;
    }
    .modal-mask.on{ display:flex; }
    .modal{
      width:min(760px, 100%);
      border:1px solid var(--rule);
      border-radius:16px;
      background: rgba(15,26,45,0.98);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .modal .hd{ padding:12px 14px; border-bottom:1px solid var(--rule); display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .modal .bd{ padding:12px 14px; }
    .modal textarea{ min-height: 220px; }

    @media (max-width: 980px){
      .grid{ grid-template-columns: 1fr; }
      .brand{ min-width: 0; }
      .split{ grid-template-columns: 1fr; }
      .list{ max-height: 42vh; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo">PN</div>
        <div>
          <h1>PromptNest Demo</h1>
          <p>提示词管理 · 模板变量 · 版本记录 · 一键复制（数据保存在本机浏览器 localStorage）</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn primary" id="btnNew">新建提示词</button>
        <button class="btn" id="btnExport">导出 JSON</button>
        <button class="btn" id="btnImport">导入 JSON</button>
        <button class="btn danger" id="btnReset">恢复示例数据</button>
      </div>
    </div>

    <div class="grid">
      <!-- Left: Library -->
      <section class="card">
        <div class="hd">
          <h2>提示词库</h2>
          <span class="hint" id="libCount">0 条</span>
        </div>
        <div class="bd">
          <div class="filters">
            <div class="field">
              <label for="q">搜索</label>
              <input id="q" type="text" placeholder="按标题/描述/内容搜索…" />
            </div>
            <div class="field">
              <label for="scene">场景</label>
              <select id="scene">
                <option value="">全部</option>
                <option value="学习">学习</option>
                <option value="写作">写作</option>
                <option value="开发">开发</option>
                <option value="产品">产品</option>
                <option value="运营">运营</option>
              </select>
            </div>
          </div>

          <div class="tags" id="tags"></div>

          <div class="list" id="list" aria-label="prompt-list"></div>
          <p class="hint" style="margin-top:10px;">
            小技巧：模板变量使用 <span class="mono">{变量名}</span>（例如 <span class="mono">{主题}</span>、<span class="mono">{语气}</span>）。右侧可填写变量并预览。
          </p>
        </div>
      </section>

      <!-- Right: Editor -->
      <section class="card">
        <div class="hd">
          <h2>编辑与调用</h2>
          <div class="row">
            <button class="btn ok small" id="btnSave">保存（生成新版本）</button>
            <button class="btn small" id="btnCopy">复制已渲染提示词</button>
            <button class="btn danger small" id="btnDelete">删除</button>
          </div>
        </div>
        <div class="bd">
          <div class="row">
            <div class="field" style="flex:1; min-width: 220px;">
              <label for="title">标题</label>
              <input id="title" type="text" placeholder="例如：周报总结（结构化输出）" />
            </div>
            <div class="field" style="width: 220px;">
              <label for="scene2">场景</label>
              <select id="scene2">
                <option value="学习">学习</option>
                <option value="写作">写作</option>
                <option value="开发">开发</option>
                <option value="产品">产品</option>
                <option value="运营">运营</option>
              </select>
            </div>
          </div>

          <div class="row">
            <div class="field" style="flex:1;">
              <label for="desc">一句话描述</label>
              <input id="desc" type="text" placeholder="例如：把一周工作整理成可读的周报（含问题与下周计划）" />
            </div>
          </div>

          <div class="row">
            <div class="field" style="flex:1;">
              <label for="tagStr">标签（逗号分隔）</label>
              <input id="tagStr" type="text" placeholder="例如：周报,总结,结构化,效率" />
            </div>
          </div>

          <div class="split">
            <div class="field">
              <label for="content">提示词模板</label>
              <textarea id="content" spellcheck="false" placeholder="在这里写提示词模板…"></textarea>
              <div class="hint">支持变量：<span class="mono">{主题}</span>、<span class="mono">{受众}</span>、<span class="mono">{语气}</span> 等（自定义即可）。</div>
            </div>
            <div class="field">
              <label>变量填写与预览</label>
              <div class="kv">
                <input id="varKey" type="text" placeholder="变量名，如 主题" />
                <input id="varVal" type="text" placeholder="变量值，如 本周工作" />
                <button class="btn small" id="btnVarAdd">添加/更新</button>
                <button class="btn small ghost" id="btnVarClear">清空变量</button>
              </div>
              <div class="hint" id="varsHint" style="margin-top:8px;"></div>
              <div class="preview" id="preview">
                <span class="muted">选择左侧一个提示词，或点击“新建提示词”。</span>
              </div>
              <div class="hint" style="margin-top:8px;">
                复制会复制右侧「已渲染提示词」，用于直接粘贴到你的 AI 对话框里。
              </div>
            </div>
          </div>

          <div style="margin-top:12px;">
            <div class="row" style="justify-content:space-between;">
              <div class="hint">版本记录（保存会追加一个版本快照）</div>
              <button class="btn small" id="btnRollback" title="回滚到最新版本（其实就是把当前编辑内容替换为最新版本内容）">从最新版本重载</button>
            </div>
            <div class="versions" id="versions"></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- Modal: Import/Export -->
  <div class="modal-mask" id="modalMask" role="dialog" aria-modal="true" aria-label="JSON 导入导出">
    <div class="modal">
      <div class="hd">
        <strong id="modalTitle">JSON</strong>
        <button class="btn small" id="btnModalClose">关闭</button>
      </div>
      <div class="bd">
        <div class="field">
          <label id="modalLabel">内容</label>
          <textarea id="modalText" spellcheck="false"></textarea>
          <div class="row" style="justify-content:flex-end; margin-top:10px;">
            <button class="btn ok" id="btnModalOk">确定</button>
          </div>
          <p class="hint" style="margin-top:10px;">
            说明：导出可备份；导入会覆盖当前库。若粘贴后报错，说明 JSON 格式不正确。
          </p>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">已复制</div>

  <script>
    (function(){
      var STORAGE_KEY = 'promptnest_demo_v1';
      var state = {
        prompts: [],
        selectedId: null,
        activeTag: '',
        vars: {}
      };

      // ---------- Utils ----------
      function uid(){
        return 'p_' + Math.random().toString(16).slice(2) + '_' + Date.now().toString(16);
      }
      function nowISO(){
        var d = new Date();
        var pad = function(n){ return String(n).padStart(2,'0'); };
        return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
      }
      function escapeHtml(s){
        return String(s)
          .replaceAll('&','&amp;')
          .replaceAll('<','&lt;')
          .replaceAll('>','&gt;');
      }
      function normalizeTags(tagStr){
        return String(tagStr || '')
          .split(',')
          .map(function(t){ return t.trim(); })
          .filter(Boolean)
          .filter(function(t, idx, arr){ return arr.indexOf(t) === idx; });
      }
      function toast(msg){
        var el = $('#toast');
        el.textContent = msg;
        el.classList.add('on');
        window.clearTimeout(toast._t);
        toast._t = window.setTimeout(function(){ el.classList.remove('on'); }, 1400);
      }
      function $(sel){ return document.querySelector(sel); }
      function $all(sel){ return Array.prototype.slice.call(document.querySelectorAll(sel)); }
      function clampText(s, n){
        s = String(s || '');
        if(s.length <= n) return s;
        return s.slice(0, n) + '…';
      }

      // ---------- Seed data ----------
      function seed(){
        return [
          {
            id: uid(),
            title: '周报总结（结构化输出）',
            scene: '写作',
            desc: '把本周工作整理成可读的周报（含问题与下周计划）',
            tags: ['周报','总结','结构化','效率'],
            content:
              '你是一名资深项目经理，请把我提供的【本周工作要点】整理成一份周报，要求：\\n' +
              '1) 用三段结构：本周产出 / 风险与问题 / 下周计划\\n' +
              '2) 每段用 3-6 条要点，语气{语气}，面向{受众}\\n' +
              '3) 如果信息不足，用“待补充：xxx”标注\\n\\n' +
              '【本周工作要点】\\n{主题}',
            versions: []
          },
          {
            id: uid(),
            title: '学习笔记提炼（费曼法）',
            scene: '学习',
            desc: '把一段学习材料提炼成可复习的笔记与练习题',
            tags: ['学习','笔记','费曼','复习'],
            content:
              '你是我的学习教练，请用费曼学习法帮我处理以下材料：\\n' +
              'A) 用 5 句话解释核心概念（面向初学者）\\n' +
              'B) 列出 5 个关键术语并给出通俗解释\\n' +
              'C) 给出 3 道自测题（含答案与解析）\\n' +
              'D) 给出 1 个类比故事帮助记忆\\n\\n' +
              '材料：\\n{主题}',
            versions: []
          },
          {
            id: uid(),
            title: '代码审查（可执行建议）',
            scene: '开发',
            desc: '对代码改动做 review，输出风险点与可执行改进',
            tags: ['开发','Review','质量','安全'],
            content:
              '你是资深工程师，请对我粘贴的代码改动进行代码审查。要求：\\n' +
              '1) 先给出总体评价（可维护性/性能/安全）\\n' +
              '2) 列出至少 8 条具体问题与修改建议（每条包含：问题/原因/建议改法）\\n' +
              '3) 给出 1 个可选的重构方案（小步重构）\\n' +
              '4) 语气{语气}，面向{受众}\\n\\n' +
              '代码改动：\\n{主题}',
            versions: []
          }
        ].map(function(p){
          p.versions = [{
            ts: nowISO(),
            title: p.title,
            scene: p.scene,
            desc: p.desc,
            tags: p.tags.slice(),
            content: p.content
          }];
          return p;
        });
      }

      // ---------- Persistence ----------
      function load(){
        try{
          var raw = localStorage.getItem(STORAGE_KEY);
          if(!raw) return null;
          var data = JSON.parse(raw);
          if(!data || !Array.isArray(data.prompts)) return null;
          return data;
        }catch(e){
          return null;
        }
      }
      function save(){
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          prompts: state.prompts,
          selectedId: state.selectedId
        }));
      }

      // ---------- Render ----------
      function allTags(){
        var map = {};
        state.prompts.forEach(function(p){
          (p.tags || []).forEach(function(t){ map[t] = (map[t]||0) + 1; });
        });
        var arr = Object.keys(map).sort(function(a,b){
          return map[b] - map[a] || a.localeCompare(b);
        });
        return arr.map(function(t){ return { name: t, count: map[t] }; });
      }
      function matches(p, q, scene, tag){
        q = (q || '').trim().toLowerCase();
        if(scene && p.scene !== scene) return false;
        if(tag && !(p.tags||[]).includes(tag)) return false;
        if(!q) return true;
        var hay = [p.title, p.desc, p.content, (p.tags||[]).join(',')].join('\\n').toLowerCase();
        return hay.indexOf(q) >= 0;
      }
      function renderTags(){
        var box = $('#tags');
        var t = allTags();
        var html = '';
        html += '<span class="tag ' + (state.activeTag ? '' : 'on') + '" data-tag="">全部标签</span>';
        t.forEach(function(x){
          html += '<span class="tag ' + (state.activeTag === x.name ? 'on' : '') + '" data-tag="' + escapeHtml(x.name) + '">' +
            escapeHtml(x.name) + ' <span class="mono" style="opacity:.75">(' + x.count + ')</span></span>';
        });
        box.innerHTML = html;
      }
      function renderList(){
        var q = $('#q').value;
        var scene = $('#scene').value;
        var tag = state.activeTag;
        var list = $('#list');

        var shown = state.prompts
          .filter(function(p){ return matches(p, q, scene, tag); })
          .sort(function(a,b){
            // newest version first
            var at = (a.versions && a.versions[0] && a.versions[0].ts) || '';
            var bt = (b.versions && b.versions[0] && b.versions[0].ts) || '';
            return bt.localeCompare(at);
          });

        $('#libCount').textContent = shown.length + ' 条';

        if(shown.length === 0){
          list.innerHTML = '<div class="hint">没有匹配的提示词。你可以点击右上角“新建提示词”。</div>';
          return;
        }

        list.innerHTML = shown.map(function(p){
          var on = (p.id === state.selectedId);
          return '' +
            '<div class="item ' + (on ? 'on' : '') + '" data-id="' + escapeHtml(p.id) + '">' +
              '<div class="meta">' +
                '<div class="title">' +
                  '<span>' + escapeHtml(p.title || '未命名') + '</span>' +
                  '<span class="pill">' + escapeHtml(p.scene || '-') + '</span>' +
                  '<span class="pill">版本 ' + ((p.versions||[]).length) + '</span>' +
                '</div>' +
                '<div class="desc">' + escapeHtml(p.desc || clampText(p.content, 60) || '') + '</div>' +
              '</div>' +
              '<div class="ops">' +
                '<button class="btn small" data-act="select">打开</button>' +
                '<button class="btn small ghost" data-act="quickcopy">复制模板</button>' +
              '</div>' +
            '</div>';
        }).join('');
      }

      function selected(){
        return state.prompts.find(function(p){ return p.id === state.selectedId; }) || null;
      }

      function renderEditor(){
        var p = selected();
        var has = !!p;
        $('#btnSave').disabled = !has;
        $('#btnCopy').disabled = !has;
        $('#btnDelete').disabled = !has;
        $('#btnRollback').disabled = !has;

        if(!has){
          $('#title').value = '';
          $('#desc').value = '';
          $('#tagStr').value = '';
          $('#content').value = '';
          $('#scene2').value = '学习';
          $('#versions').innerHTML = '';
          $('#preview').innerHTML = '<span class="muted">选择左侧一个提示词，或点击“新建提示词”。</span>';
          renderVarsHint();
          return;
        }

        $('#title').value = p.title || '';
        $('#desc').value = p.desc || '';
        $('#tagStr').value = (p.tags || []).join(',');
        $('#content').value = p.content || '';
        $('#scene2').value = p.scene || '学习';
        renderPreview();
        renderVersions();
      }

      function renderVarsHint(){
        var keys = Object.keys(state.vars);
        if(keys.length === 0){
          $('#varsHint').innerHTML = '<span class="hint">当前变量：无</span>';
          return;
        }
        var chips = keys.sort().map(function(k){
          return '<span class="pill"><span class="mono">{' + escapeHtml(k) + '}</span>=' + escapeHtml(String(state.vars[k])) + '</span>';
        }).join(' ');
        $('#varsHint').innerHTML = '<span class="hint">当前变量：</span> ' + chips;
      }

      function extractVars(tpl){
        tpl = String(tpl || '');
        // {中文/英文/数字/下划线}
        var re = /\{([a-zA-Z0-9_\u4e00-\u9fa5]{1,24})\}/g;
        var set = {};
        var m;
        while((m = re.exec(tpl))){
          set[m[1]] = true;
        }
        return Object.keys(set);
      }

      function renderPreview(){
        var p = selected();
        if(!p) return;
        var tpl = $('#content').value || '';
        var out = tpl;
        var vars = extractVars(tpl);
        vars.forEach(function(k){
          var v = (state.vars[k] != null && state.vars[k] !== '') ? String(state.vars[k]) : ('＜请填写：' + k + '＞');
          out = out.split('{' + k + '}').join(v);
        });
        $('#preview').textContent = out;
        renderVarsHint();
      }

      function renderVersions(){
        var p = selected();
        if(!p) return;
        var box = $('#versions');
        var vs = (p.versions || []).slice().sort(function(a,b){ return b.ts.localeCompare(a.ts); });
        if(vs.length === 0){
          box.innerHTML = '<div class="hint">暂无版本记录。</div>';
          return;
        }
        box.innerHTML = vs.map(function(v, i){
          return '' +
            '<div class="v">' +
              '<div class="top">' +
                '<div class="t">版本 ' + (vs.length - i) + '</div>' +
                '<div class="s">' + escapeHtml(v.ts) + '</div>' +
              '</div>' +
              '<div class="hint" style="margin-top:6px;">' +
                escapeHtml(v.title || '未命名') + ' · ' + escapeHtml(v.scene || '-') + ' · ' +
                (v.tags && v.tags.length ? ('标签：' + escapeHtml(v.tags.join(','))) : '无标签') +
              '</div>' +
              '<pre>' + escapeHtml(String(v.content || '')) + '</pre>' +
              '<div class="row" style="justify-content:flex-end; margin-top:8px;">' +
                '<button class="btn small" data-act="applyVer" data-ts="' + escapeHtml(v.ts) + '">应用此版本到编辑器</button>' +
              '</div>' +
            '</div>';
        }).join('');
      }

      // ---------- Actions ----------
      function createNew(){
        var p = {
          id: uid(),
          title: '新提示词（未命名）',
          scene: '学习',
          desc: '',
          tags: [],
          content:
            '你是一名{角色}。\\n' +
            '请围绕主题「{主题}」完成以下任务：\\n' +
            '1) 输出结构：\\n- 要点 1\\n- 要点 2\\n- 要点 3\\n' +
            '2) 风格：{语气}\\n' +
            '3) 面向：{受众}\\n' +
            '4) 如信息不足，请列出需要我补充的问题。\\n',
          versions: []
        };
        p.versions = [{
          ts: nowISO(),
          title: p.title,
          scene: p.scene,
          desc: p.desc,
          tags: p.tags.slice(),
          content: p.content
        }];
        state.prompts.unshift(p);
        state.selectedId = p.id;
        save();
        refreshAll();
        toast('已创建');
      }

      function saveCurrent(){
        var p = selected();
        if(!p) return;

        p.title = $('#title').value.trim() || '未命名';
        p.scene = $('#scene2').value || '学习';
        p.desc = $('#desc').value.trim();
        p.tags = normalizeTags($('#tagStr').value);
        p.content = $('#content').value;

        p.versions = p.versions || [];
        p.versions.unshift({
          ts: nowISO(),
          title: p.title,
          scene: p.scene,
          desc: p.desc,
          tags: p.tags.slice(),
          content: p.content
        });
        // keep recent 20 versions
        if(p.versions.length > 20) p.versions = p.versions.slice(0, 20);
        save();
        refreshAll();
        toast('已保存（新版本）');
      }

      function deleteCurrent(){
        var p = selected();
        if(!p) return;
        if(!confirm('确定要删除“' + (p.title || '未命名') + '”吗？此操作不可恢复。')) return;
        state.prompts = state.prompts.filter(function(x){ return x.id !== p.id; });
        state.selectedId = state.prompts[0] ? state.prompts[0].id : null;
        save();
        refreshAll();
        toast('已删除');
      }

      function copyRendered(){
        var text = $('#preview').textContent || '';
        if(!text.trim()){
          toast('无可复制内容');
          return;
        }
        navigator.clipboard.writeText(text).then(function(){
          toast('已复制：已渲染提示词');
        }).catch(function(){
          // fallback
          try{
            var ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
            toast('已复制');
          }catch(e){
            toast('复制失败（请手动复制）');
          }
        });
      }

      function quickCopyTemplate(id){
        var p = state.prompts.find(function(x){ return x.id === id; });
        if(!p) return;
        navigator.clipboard.writeText(p.content || '').then(function(){
          toast('已复制：模板');
        }).catch(function(){
          toast('复制失败（请手动复制）');
        });
      }

      function setVar(){
        var k = $('#varKey').value.trim();
        var v = $('#varVal').value;
        if(!k){
          toast('请输入变量名');
          return;
        }
        state.vars[k] = v;
        $('#varKey').value = '';
        $('#varVal').value = '';
        renderPreview();
        toast('变量已更新');
      }

      function clearVars(){
        state.vars = {};
        renderPreview();
        toast('变量已清空');
      }

      function applyVersion(ts){
        var p = selected();
        if(!p) return;
        var v = (p.versions || []).find(function(x){ return x.ts === ts; });
        if(!v) return;
        $('#title').value = v.title || '';
        $('#scene2').value = v.scene || '学习';
        $('#desc').value = v.desc || '';
        $('#tagStr').value = (v.tags || []).join(',');
        $('#content').value = v.content || '';
        renderPreview();
        toast('已应用版本到编辑器（未保存）');
      }

      function rollbackFromLatest(){
        var p = selected();
        if(!p || !(p.versions && p.versions.length)) return;
        applyVersion(p.versions[0].ts);
      }

      function resetDemo(){
        if(!confirm('确定要恢复示例数据吗？将覆盖当前提示词库。')) return;
        state.prompts = seed();
        state.selectedId = state.prompts[0].id;
        state.activeTag = '';
        state.vars = { '语气': '专业、简洁', '受众': '团队成员', '主题': '（在这里粘贴你的内容）' };
        save();
        refreshAll();
        toast('已恢复示例数据');
      }

      // ---------- Import/Export ----------
      var modal = {
        mode: 'export'
      };
      function openModal(mode, text){
        modal.mode = mode;
        $('#modalMask').classList.add('on');
        $('#modalTitle').textContent = mode === 'export' ? '导出 JSON' : '导入 JSON';
        $('#modalLabel').textContent = mode === 'export' ? '复制下面的 JSON 保存' : '粘贴 JSON（将覆盖当前库）';
        $('#modalText').value = text || '';
        $('#modalText').focus();
        $('#btnModalOk').textContent = mode === 'export' ? '复制到剪贴板' : '导入并覆盖';
      }
      function closeModal(){
        $('#modalMask').classList.remove('on');
      }
      function exportJSON(){
        var data = {
          exportedAt: nowISO(),
          prompts: state.prompts
        };
        openModal('export', JSON.stringify(data, null, 2));
      }
      function importJSON(){
        openModal('import', '');
      }
      function doModalOk(){
        if(modal.mode === 'export'){
          var text = $('#modalText').value;
          navigator.clipboard.writeText(text).then(function(){
            toast('已复制 JSON');
          }).catch(function(){
            toast('复制失败（请手动复制）');
          });
          return;
        }
        // import
        var raw = $('#modalText').value.trim();
        if(!raw){
          toast('请粘贴 JSON');
          return;
        }
        try{
          var data = JSON.parse(raw);
          var prompts = (data && data.prompts) ? data.prompts : data;
          if(!Array.isArray(prompts)) throw new Error('JSON 中未找到 prompts 数组');
          // minimal normalization
          prompts = prompts.map(function(p){
            p.id = p.id || uid();
            p.title = p.title || '未命名';
            p.scene = p.scene || '学习';
            p.desc = p.desc || '';
            p.tags = Array.isArray(p.tags) ? p.tags : normalizeTags(p.tags);
            p.content = p.content || '';
            p.versions = Array.isArray(p.versions) ? p.versions : [];
            if(p.versions.length === 0){
              p.versions.unshift({
                ts: nowISO(),
                title: p.title,
                scene: p.scene,
                desc: p.desc,
                tags: (p.tags || []).slice(),
                content: p.content
              });
            }
            return p;
          });
          state.prompts = prompts;
          state.selectedId = state.prompts[0] ? state.prompts[0].id : null;
          save();
          refreshAll();
          toast('已导入并覆盖');
          closeModal();
        }catch(e){
          alert('导入失败：' + (e && e.message ? e.message : String(e)));
        }
      }

      // ---------- Refresh ----------
      function refreshAll(){
        renderTags();
        renderList();
        renderEditor();
      }

      // ---------- Event wiring ----------
      function bind(){
        $('#btnNew').addEventListener('click', createNew);
        $('#btnSave').addEventListener('click', saveCurrent);
        $('#btnDelete').addEventListener('click', deleteCurrent);
        $('#btnCopy').addEventListener('click', copyRendered);
        $('#btnVarAdd').addEventListener('click', setVar);
        $('#btnVarClear').addEventListener('click', clearVars);
        $('#btnRollback').addEventListener('click', rollbackFromLatest);
        $('#btnReset').addEventListener('click', resetDemo);
        $('#btnExport').addEventListener('click', exportJSON);
        $('#btnImport').addEventListener('click', importJSON);

        $('#q').addEventListener('input', renderList);
        $('#scene').addEventListener('change', renderList);

        $('#title').addEventListener('input', function(){ /* no-op */ });
        $('#desc').addEventListener('input', function(){ /* no-op */ });
        $('#tagStr').addEventListener('input', function(){ /* no-op */ });
        $('#scene2').addEventListener('change', function(){ /* no-op */ });
        $('#content').addEventListener('input', renderPreview);

        $('#list').addEventListener('click', function(e){
          var btn = e.target.closest('button');
          var item = e.target.closest('.item');
          if(!item) return;
          var id = item.getAttribute('data-id');
          if(btn && btn.getAttribute('data-act') === 'quickcopy'){
            quickCopyTemplate(id);
            return;
          }
          // select
          state.selectedId = id;
          save();
          refreshAll();
        });

        $('#tags').addEventListener('click', function(e){
          var t = e.target.closest('.tag');
          if(!t) return;
          state.activeTag = t.getAttribute('data-tag') || '';
          renderTags();
          renderList();
        });

        $('#versions').addEventListener('click', function(e){
          var b = e.target.closest('button[data-act="applyVer"]');
          if(!b) return;
          applyVersion(b.getAttribute('data-ts'));
        });

        // Modal
        $('#btnModalClose').addEventListener('click', closeModal);
        $('#modalMask').addEventListener('click', function(e){
          if(e.target === $('#modalMask')) closeModal();
        });
        $('#btnModalOk').addEventListener('click', doModalOk);
        document.addEventListener('keydown', function(e){
          if(e.key === 'Escape') closeModal();
        });
      }

      // ---------- Boot ----------
      function boot(){
        var data = load();
        if(data){
          state.prompts = Array.isArray(data.prompts) ? data.prompts : [];
          state.selectedId = data.selectedId || (state.prompts[0] ? state.prompts[0].id : null);
          if(state.prompts.length === 0){
            state.prompts = seed();
            state.selectedId = state.prompts[0].id;
          }
          // default vars
          state.vars = { '语气': '专业、简洁', '受众': '团队成员', '主题': '（在这里粘贴你的内容）' };
        }else{
          state.prompts = seed();
          state.selectedId = state.prompts[0].id;
          state.vars = { '语气': '专业、简洁', '受众': '团队成员', '主题': '（在这里粘贴你的内容）' };
          save();
        }
        bind();
        refreshAll();
      }

      boot();
    })();
  </script>
</body>
</html>
