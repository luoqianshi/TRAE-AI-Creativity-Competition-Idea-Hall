<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0f172a" />
<title>星夜树洞 · 让星星听你说话</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- FontAwesome 6 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" />

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet" />

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          deep:    '#0f172a',
          deeper:  '#070b1a',
          violet:  '#4c1d95',
          'violet-soft': '#6d28d9',
          gold:    '#fbbf24',
          'gold-soft': '#fde68a',
          mist:    '#a78bfa',
          starwhite: '#e0e7ff',
        },
        fontFamily: {
          serif: ['"Noto Serif SC"', 'serif'],
          sans:  ['"Noto Sans SC"', 'system-ui', 'sans-serif'],
          round: ['"Quicksand"', '"Noto Sans SC"', 'sans-serif'],
        },
      },
    },
  };
</script>

<style>
  :root {
    --deep: #0f172a;
    --deeper: #070b1a;
    --violet: #4c1d95;
    --gold: #fbbf24;
    --mist: #a78bfa;
    --starwhite: #e0e7ff;
  }

  * { -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--deeper);
    color: var(--starwhite);
    font-family: 'Noto Sans SC', system-ui, sans-serif;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  /* 星空 Canvas */
  #starfield {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* 极光层 */
  .aurora {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .aurora::before,
  .aurora::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    mix-blend-mode: screen;
    will-change: transform;
  }
  .aurora::before {
    width: 60vw; height: 60vw;
    left: -10vw; top: -20vw;
    background: radial-gradient(circle, rgba(76, 29, 149, 0.55), transparent 60%);
    animation: aurora-drift-1 28s ease-in-out infinite;
  }
  .aurora::after {
    width: 70vw; height: 70vw;
    right: -15vw; bottom: -25vw;
    background: radial-gradient(circle, rgba(45, 212, 191, 0.18), transparent 60%);
    animation: aurora-drift-2 36s ease-in-out infinite;
  }
  .aurora .aurora-3 {
    position: absolute;
    width: 50vw; height: 50vw;
    left: 30%; top: 40%;
    background: radial-gradient(circle, rgba(167, 139, 250, 0.22), transparent 60%);
    filter: blur(90px);
    border-radius: 50%;
    mix-blend-mode: screen;
    animation: aurora-drift-3 42s ease-in-out infinite;
  }
  @keyframes aurora-drift-1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(20vw, 15vh) scale(1.15); }
  }
  @keyframes aurora-drift-2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(-15vw, -20vh) scale(1.2); }
  }
  @keyframes aurora-drift-3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(-25vw, 20vh) scale(0.9); }
  }

  /* 月亮 */
  .moon {
    position: fixed;
    top: 8vh;
    right: 8vw;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fef3c7, #fbbf24 55%, #d97706 100%);
    box-shadow:
      0 0 40px rgba(251, 191, 36, 0.5),
      0 0 90px rgba(251, 191, 36, 0.25),
      inset -8px -8px 18px rgba(217, 119, 6, 0.5);
    z-index: 2;
    pointer-events: none;
    animation: moon-glow 5s ease-in-out infinite;
  }
  @keyframes moon-glow {
    0%, 100% { box-shadow: 0 0 40px rgba(251,191,36,.5), 0 0 90px rgba(251,191,36,.25), inset -8px -8px 18px rgba(217,119,6,.5); }
    50%      { box-shadow: 0 0 60px rgba(251,191,36,.7), 0 0 120px rgba(251,191,36,.35), inset -8px -8px 18px rgba(217,119,6,.5); }
  }

  /* 内容层 */
  .content-layer {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* 顶部 Slogan */
  .slogan {
    font-family: 'Noto Serif SC', serif;
    letter-spacing: 0.15em;
    opacity: 0;
    animation: fade-down 1.2s 0.3s ease-out forwards;
  }
  @keyframes fade-down {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 树洞入口 */
  .treehole {
    position: relative;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #1e293b 0%, #0f172a 55%, #020617 100%);
    border: 2px solid rgba(251, 191, 36, 0.55);
    cursor: pointer;
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    animation: treehole-breathe 3.2s ease-in-out infinite, fade-in 1.4s 0.6s ease-out backwards;
    box-shadow:
      0 0 30px rgba(251, 191, 36, 0.35),
      0 0 70px rgba(76, 29, 149, 0.45),
      inset 0 0 35px rgba(251, 191, 36, 0.18);
  }
  .treehole:hover { transform: scale(1.04); }
  .treehole:active { transform: scale(0.97); }
  .treehole::before {
    content: '';
    position: absolute;
    inset: -16px;
    border-radius: 50%;
    border: 1px dashed rgba(251, 191, 36, 0.3);
    animation: rotate-slow 24s linear infinite;
  }
  .treehole::after {
    content: '';
    position: absolute;
    inset: -32px;
    border-radius: 50%;
    border: 1px solid rgba(167, 139, 250, 0.15);
  }
  @keyframes treehole-breathe {
    0%, 100% {
      box-shadow:
        0 0 30px rgba(251, 191, 36, 0.35),
        0 0 70px rgba(76, 29, 149, 0.45),
        inset 0 0 35px rgba(251, 191, 36, 0.18);
    }
    50% {
      box-shadow:
        0 0 50px rgba(251, 191, 36, 0.7),
        0 0 110px rgba(76, 29, 149, 0.7),
        inset 0 0 50px rgba(251, 191, 36, 0.3);
    }
  }
  @keyframes rotate-slow {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes fade-in {
    from { opacity: 0; transform: scale(0.85); }
    to   { opacity: 1; transform: scale(1); }
  }
  .treehole-svg { width: 100%; height: 100%; }

  /* 引导文案 */
  .prompt-text {
    opacity: 0;
    animation: fade-up 1.2s 1s ease-out forwards;
  }
  .prompt-hint {
    opacity: 0;
    animation: fade-up 1.2s 1.4s ease-out forwards;
  }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 模态框 */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(7, 11, 26, 0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 60;
    background: linear-gradient(180deg, rgba(15, 23, 42, 0.92), rgba(7, 11, 26, 0.96));
    border-top: 1px solid rgba(167, 139, 250, 0.2);
    border-radius: 32px 32px 0 0;
    padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 -20px 60px rgba(76, 29, 149, 0.25);
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal-sheet.active { transform: translateY(0); }
  @media (min-width: 640px) {
    .modal-sheet {
      left: 50%;
      right: auto;
      bottom: 50%;
      transform: translate(-50%, 50%) translateY(100%);
      width: 480px;
      max-width: calc(100vw - 32px);
      border-radius: 32px;
      border: 1px solid rgba(167, 139, 250, 0.2);
    }
    .modal-sheet.active { transform: translate(-50%, 50%) translateY(0); }
  }
  .modal-handle {
    width: 40px;
    height: 4px;
    background: rgba(167, 139, 250, 0.3);
    border-radius: 999px;
    margin: 0 auto 18px;
  }

  /* 文本框 */
  .vent-textarea {
    width: 100%;
    min-height: 140px;
    background: rgba(15, 23, 42, 0.6);
    border: 1.5px solid rgba(167, 139, 250, 0.25);
    border-radius: 18px;
    color: var(--starwhite);
    padding: 16px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 16px;
    line-height: 1.7;
    resize: none;
    transition: border-color 0.4s ease, box-shadow 0.4s ease, background 0.4s ease;
  }
  .vent-textarea::placeholder { color: rgba(224, 231, 255, 0.35); }
  .vent-textarea:focus {
    outline: none;
    border-color: rgba(251, 191, 36, 0.6);
    box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.08);
    background: rgba(15, 23, 42, 0.85);
  }

  /* 按钮 */
  .btn-primary {
    background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
    color: #1f1300;
    font-weight: 600;
    border-radius: 999px;
    padding: 14px 24px;
    transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease;
    box-shadow: 0 6px 24px rgba(251, 191, 36, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    letter-spacing: 0.05em;
  }
  .btn-primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 8px 32px rgba(251, 191, 36, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }
  .btn-primary:active:not(:disabled) { transform: translateY(0); }
  .btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    box-shadow: none;
  }
  .btn-ghost {
    background: transparent;
    color: rgba(224, 231, 255, 0.7);
    border: 1px solid rgba(167, 139, 250, 0.25);
    border-radius: 999px;
    padding: 12px 20px;
    transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
  }
  .btn-ghost:hover {
    background: rgba(167, 139, 250, 0.08);
    color: var(--starwhite);
    border-color: rgba(167, 139, 250, 0.4);
  }

  /* 呼吸灯 */
  .breath-light {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(251, 191, 36, 0.9), rgba(251, 191, 36, 0.3) 50%, transparent 75%);
    animation: breath 1.6s ease-in-out infinite;
    position: relative;
  }
  .breath-light::before {
    content: '';
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    background: radial-gradient(circle, #fef3c7, #fbbf24 80%);
    box-shadow: 0 0 30px rgba(251, 191, 36, 0.6);
  }
  .breath-light::after {
    content: '';
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    border: 1px solid rgba(251, 191, 36, 0.4);
    animation: ripple 1.6s ease-out infinite;
  }
  @keyframes breath {
    0%, 100% { transform: scale(0.95); opacity: 0.7; }
    50%      { transform: scale(1.05); opacity: 1; }
  }
  @keyframes ripple {
    0%   { transform: scale(0.8); opacity: 1; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  /* 治愈卡片 */
  .healing-card {
    background: linear-gradient(160deg, rgba(76, 29, 149, 0.35) 0%, rgba(15, 23, 42, 0.7) 100%);
    border: 1px solid rgba(251, 191, 36, 0.3);
    border-radius: 24px;
    padding: 28px 22px;
    box-shadow: 0 10px 50px rgba(76, 29, 149, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    position: relative;
    overflow: hidden;
    animation: fade-up 0.8s ease-out;
  }
  .healing-card::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(251, 191, 36, 0.08), transparent 50%);
    animation: rotate-slow 30s linear infinite;
    pointer-events: none;
  }

  /* 模拟音频播放器 */
  .audio-player {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(167, 139, 250, 0.2);
    border-radius: 999px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .audio-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    color: #1f1300;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 14px rgba(251, 191, 36, 0.4);
    transition: transform 0.3s ease;
  }
  .audio-btn:active { transform: scale(0.92); }
  .progress-track {
    flex: 1;
    height: 6px;
    background: rgba(167, 139, 250, 0.2);
    border-radius: 999px;
    position: relative;
    overflow: hidden;
  }
  .progress-fill {
    position: absolute;
    inset: 0 auto 0 0;
    background: linear-gradient(90deg, #fbbf24, #f59e0b);
    border-radius: 999px;
    width: 0%;
    transition: width 0.2s linear;
  }
  .progress-fill.playing {
    transition: width 12s linear;
    width: 100%;
  }
  .audio-wave {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 24px;
  }
  .audio-wave .bar {
    width: 3px;
    background: linear-gradient(180deg, #fbbf24, #a78bfa);
    border-radius: 2px;
    opacity: 0.4;
    transition: height 0.3s ease, opacity 0.3s ease;
  }
  .audio-wave.playing .bar {
    animation: wave 1.2s ease-in-out infinite;
  }
  .audio-wave .bar:nth-child(1) { height: 30%; animation-delay: 0.0s; }
  .audio-wave .bar:nth-child(2) { height: 60%; animation-delay: 0.1s; }
  .audio-wave .bar:nth-child(3) { height: 80%; animation-delay: 0.2s; }
  .audio-wave .bar:nth-child(4) { height: 50%; animation-delay: 0.3s; }
  .audio-wave .bar:nth-child(5) { height: 90%; animation-delay: 0.4s; }
  .audio-wave .bar:nth-child(6) { height: 40%; animation-delay: 0.5s; }
  .audio-wave .bar:nth-child(7) { height: 70%; animation-delay: 0.6s; }
  @keyframes wave {
    0%, 100% { transform: scaleY(0.3); opacity: 0.4; }
    50%      { transform: scaleY(1.2); opacity: 1; }
  }

  /* 步骤过渡 */
  .view { display: none; }
  .view.active { display: block; animation: fade-up 0.5s ease-out; }

  /* 底部信息栏 */
  .footer {
    position: relative;
    z-index: 10;
    padding: 20px 24px calc(20px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(167, 139, 250, 0.12);
    background: linear-gradient(180deg, transparent, rgba(7, 11, 26, 0.5));
  }

  /* 公益标识 */
  .welfare-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.25);
    color: #6ee7b7;
    font-size: 11px;
    letter-spacing: 0.05em;
  }

  /* 隐藏滚动条但保留滚动 */
  .modal-sheet::-webkit-scrollbar { width: 0; }

  /* 减少动效 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body class="bg-deeper">

<!-- 星空背景 -->
<canvas id="starfield" aria-hidden="true"></canvas>

<!-- 极光层 -->
<div class="aurora" aria-hidden="true">
  <div class="aurora-3"></div>
</div>

<!-- 月亮 -->
<div class="moon" aria-hidden="true"></div>

<!-- 内容层 -->
<main class="content-layer">

  <!-- 顶部 Slogan -->
  <header class="pt-16 sm:pt-20 px-6 text-center">
    <p class="slogan text-starwhite/60 text-xs sm:text-sm font-round tracking-[0.4em] uppercase">
      <i class="fa-solid fa-moon text-gold/70 mr-2"></i>Starry Night Tree Hollow
    </p>
    <h1 class="slogan mt-3 font-serif text-2xl sm:text-3xl text-starwhite/90" style="animation-delay: 0.5s;">
      今晚，让星星听你说话
    </h1>
  </header>

  <!-- 中央树洞 -->
  <section class="flex-1 flex flex-col items-center justify-center px-6 -mt-6">
    <button
      id="treeHoleBtn"
      class="treehole group"
      aria-label="打开树洞倾诉入口"
      type="button"
    >
      <svg class="treehole-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- 树洞剪影 -->
        <defs>
          <radialGradient id="cave-glow" cx="50%" cy="55%" r="50%">
            <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
            <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="trunk-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1e1b4b"/>
            <stop offset="100%" stop-color="#0f172a"/>
          </linearGradient>
        </defs>

        <!-- 树洞内的光晕 -->
        <circle cx="100" cy="110" r="55" fill="url(#cave-glow)"/>

        <!-- 树干外形（树洞轮廓） -->
        <path
          d="M 50 200
             L 50 120
             C 50 95, 60 80, 75 78
             C 70 60, 90 50, 100 50
             C 110 50, 130 60, 125 78
             C 140 80, 150 95, 150 120
             L 150 200 Z"
          fill="url(#trunk-grad)"
          stroke="#fbbf24"
          stroke-width="0.6"
          stroke-opacity="0.3"
        />

        <!-- 树洞开口 -->
        <ellipse cx="100" cy="115" rx="22" ry="28" fill="#020617"/>
        <ellipse cx="100" cy="115" rx="22" ry="28" fill="none" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.5"/>

        <!-- 树洞内的星光点 -->
        <circle cx="95"  cy="105" r="1.2" fill="#fef3c7"/>
        <circle cx="105" cy="118" r="0.8" fill="#fef3c7"/>
        <circle cx="98"  cy="125" r="0.6" fill="#fef3c7"/>

        <!-- 树枝点缀 -->
        <path d="M 70 90 Q 60 80, 50 78" stroke="#1e1b4b" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M 130 90 Q 140 80, 150 78" stroke="#1e1b4b" stroke-width="2" fill="none" stroke-linecap="round"/>
        <circle cx="50"  cy="78" r="2" fill="#a78bfa" opacity="0.5"/>
        <circle cx="150" cy="78" r="2" fill="#a78bfa" opacity="0.5"/>

        <!-- 飘落的叶子 -->
        <circle cx="80"  cy="170" r="1.5" fill="#fbbf24" opacity="0.4"/>
        <circle cx="125" cy="180" r="1.2" fill="#fbbf24" opacity="0.3"/>
      </svg>
    </button>

    <!-- 引导文案 -->
    <p class="prompt-text mt-12 sm:mt-14 font-serif text-lg sm:text-xl text-starwhite/85 text-center max-w-xs leading-relaxed">
      今晚，有什么心事<br/>想告诉星星吗？
    </p>
    <p class="prompt-hint mt-4 text-starwhite/45 text-xs sm:text-sm font-round tracking-wider flex items-center gap-2">
      <i class="fa-regular fa-hand-pointer"></i>
      轻触树洞，悄悄话只说给星星听
    </p>
  </section>

  <!-- 底部信息栏 -->
  <footer class="footer">
    <div class="max-w-md mx-auto flex flex-col items-center gap-3">
      <div class="welfare-badge">
        <i class="fa-solid fa-heart-pulse text-[10px]"></i>
        <span>青少年心理健康公益项目</span>
      </div>
      <p class="text-starwhite/40 text-[11px] text-center leading-relaxed">
        © 2026 星夜树洞 · 愿每一颗心都被温柔以待
      </p>
      <p class="text-starwhite/25 text-[10px] text-center">
        <i class="fa-solid fa-shield-halved mr-1"></i>
        你说的每一句话，都不会被记录
      </p>
    </div>
  </footer>
</main>

<!-- 模态遮罩 -->
<div id="modalOverlay" class="modal-overlay" aria-hidden="true"></div>

<!-- 模态底部弹层 -->
<div id="modalSheet" class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-handle"></div>

  <!-- 视图 1：输入心事 -->
  <div id="viewInput" class="view active">
    <div class="text-center mb-5">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-violet/30 border border-gold/30 mb-3">
        <i class="fa-regular fa-moon text-gold text-lg"></i>
      </div>
      <h2 id="modalTitle" class="font-serif text-xl text-starwhite/90">悄悄说给星星听</h2>
      <p class="text-starwhite/50 text-xs mt-2 leading-relaxed">
        写下你的心事，写完就放下<br/>这里没有评判，只有星星的温柔
      </p>
    </div>

    <div class="relative">
      <textarea
        id="ventInput"
        class="vent-textarea"
        placeholder="今晚有点难过，因为……"
        maxlength="200"
        rows="6"
      ></textarea>
      <div class="flex justify-between items-center mt-2 px-1">
        <span class="text-starwhite/30 text-[11px]">
          <i class="fa-solid fa-lock text-[10px] mr-1"></i>不记录，不上传
        </span>
        <span id="charCount" class="text-starwhite/40 text-[11px] font-round">0 / 200</span>
      </div>
    </div>

    <div class="flex items-center gap-3 mt-6">
      <button id="cancelBtn" class="btn-ghost flex-1" type="button">
        再想想
      </button>
      <button id="sendBtn" class="btn-primary flex-1 flex items-center justify-center gap-2" type="button" disabled>
        <i class="fa-solid fa-paper-plane text-sm"></i>
        <span>寄给星星</span>
      </button>
    </div>
  </div>

  <!-- 视图 2：聆听中 -->
  <div id="viewLoading" class="view">
    <div class="flex flex-col items-center justify-center py-10">
      <div class="breath-light"></div>
      <p class="mt-10 font-serif text-lg text-starwhite/85">正在聆听…</p>
      <p class="mt-2 text-starwhite/45 text-xs">星星正在收集你的心事</p>

      <div class="mt-8 w-full max-w-[260px] space-y-2">
        <div class="flex items-center gap-2 text-starwhite/40 text-xs">
          <i class="fa-solid fa-circle text-[4px] text-gold/60"></i>
          <span>正在接收你的悄悄话</span>
        </div>
        <div class="flex items-center gap-2 text-starwhite/40 text-xs">
          <i class="fa-solid fa-circle text-[4px] text-gold/60"></i>
          <span>转化为星光频率</span>
        </div>
        <div class="flex items-center gap-2 text-starwhite/40 text-xs">
          <i class="fa-solid fa-circle text-[4px] text-gold/60"></i>
          <span>编织温柔的回应</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 视图 3：治愈反馈 -->
  <div id="viewHealing" class="view">
    <div class="healing-card relative">
      <div class="relative z-10">
        <div class="flex items-center justify-center mb-4">
          <i class="fa-solid fa-star text-gold text-xs"></i>
          <span class="mx-2 text-gold/60 text-[10px] tracking-[0.3em] uppercase font-round">Healing Echo</span>
          <i class="fa-solid fa-star text-gold text-xs"></i>
        </div>
        <p id="healingText" class="font-serif text-center text-starwhite/95 text-lg leading-loose min-h-[80px] flex items-center justify-center"></p>
        <div class="mt-5 flex items-center justify-center gap-2 text-starwhite/40 text-[11px]">
          <i class="fa-regular fa-paper-plane text-gold/70"></i>
          <span>你的心事已被星星妥帖收藏</span>
        </div>
      </div>
    </div>

    <!-- 模拟音频播放器 -->
    <div class="mt-6">
      <p class="text-starwhite/55 text-xs text-center mb-3 flex items-center justify-center gap-2">
        <i class="fa-solid fa-headphones-simple text-gold/70"></i>
        <span id="audioStatusText">正在为你编织梦境声音…</span>
      </p>
      <div class="audio-player">
        <button id="audioToggle" class="audio-btn" type="button" aria-label="播放/暂停">
          <i class="fa-solid fa-play text-xs" id="audioIcon"></i>
        </button>
        <div class="progress-track">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <div class="audio-wave" id="audioWave">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-3 mt-6">
      <button id="retryBtn" class="btn-ghost flex-1 flex items-center justify-center gap-2" type="button">
        <i class="fa-solid fa-rotate-left text-xs"></i>
        <span>再说一次</span>
      </button>
      <button id="closeBtn" class="btn-primary flex-1 flex items-center justify-center gap-2" type="button">
        <i class="fa-solid fa-bed text-sm"></i>
        <span>安心入睡</span>
      </button>
    </div>
  </div>
</div>

<script>
  // ==================== 治愈文案池 ====================
  const healingTexts = [
    '你的烦恼已被星星接收，今晚请安心入睡。',
    '月亮会替你收藏秘密，明天的你，会更轻盈。',
    '深呼吸三次，把心事交给风，留下的只有温柔。',
    '此刻的难过只是夜空的一阵风，吹过就散了。',
    '你已经做得很好了，允许自己慢慢来。',
    '星星在天上陪着你呢，你并不孤单。',
    '把今天的不安写在风里，让它飘向银河尽头。',
    '每一颗心都值得被温柔对待，包括你的。',
    '今夜，就让星空拥抱你所有的疲惫。',
    '你不必急着变好，慢慢来，星星不催你。',
  ];

  // ==================== 状态机 ====================
  const state = {
    view: 'home',
    userText: '',
    healingText: '',
    audioProgress: 0,
    audioPlaying: false,
    audioTimer: null,
    loadTimer: null,
  };

  // ==================== 星空 Canvas ====================
  (function initStarfield() {
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let meteors = [];
    let rafId = null;
    let reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width  = window.innerWidth  * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width  = window.innerWidth  + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      initStars();
    }

    function initStars() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const isMobile = w < 768;
      const count = isMobile ? 220 : 360;
      stars = [];
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.4 + 0.3,
          baseAlpha: Math.random() * 0.5 + 0.35,
          phase: Math.random() * Math.PI * 2,
          twinkleSpeed: Math.random() * 0.015 + 0.005,
          color: Math.random() > 0.85
            ? '251, 191, 36'   // gold
            : (Math.random() > 0.7 ? '167, 139, 250' : '224, 231, 255'),
        });
      }
    }

    function spawnMeteor() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      meteors.push({
        x: Math.random() * w,
        y: Math.random() * h * 0.4,
        len: Math.random() * 80 + 60,
        speed: Math.random() * 4 + 4,
        angle: Math.PI / 5,
        alpha: 1,
        life: 0,
        maxLife: 60,
      });
    }

    function draw(time) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      ctx.clearRect(0, 0, w, h);

      // 星点
      for (const s of stars) {
        const t = reducedMotion ? 1 : Math.sin(time * 0.001 * s.twinkleSpeed * 60 + s.phase);
        const alpha = s.baseAlpha * (0.6 + 0.4 * (t * 0.5 + 0.5));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${s.color}, ${alpha})`;
        ctx.fill();
        // 较大星点带光晕
        if (s.r > 1.1) {
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${s.color}, ${alpha * 0.15})`;
          ctx.fill();
        }
      }

      // 流星
      for (let i = meteors.length - 1; i >= 0; i--) {
        const m = meteors[i];
        m.x += Math.cos(m.angle) * m.speed;
        m.y += Math.sin(m.angle) * m.speed;
        m.life++;
        m.alpha = Math.max(0, 1 - m.life / m.maxLife);

        const tailX = m.x - Math.cos(m.angle) * m.len;
        const tailY = m.y - Math.sin(m.angle) * m.len;
        const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
        grad.addColorStop(0, `rgba(251, 191, 36, ${m.alpha})`);
        grad.addColorStop(1, 'rgba(251, 191, 36, 0)');
        ctx.beginPath();
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.5;
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();

        if (m.life >= m.maxLife) meteors.splice(i, 1);
      }

      // 随机生成流星
      if (!reducedMotion && Math.random() < 0.005) spawnMeteor();

      rafId = requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    rafId = requestAnimationFrame(draw);

    // 暂停以节省资源（标签页隐藏时）
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
      } else if (!rafId) {
        rafId = requestAnimationFrame(draw);
      }
    });
  })();

  // ==================== 模态框控制 ====================
  const $ = (id) => document.getElementById(id);
  const modalOverlay = $('modalOverlay');
  const modalSheet   = $('modalSheet');
  const viewInput    = $('viewInput');
  const viewLoading  = $('viewLoading');
  const viewHealing  = $('viewHealing');
  const ventInput    = $('ventInput');
  const charCount    = $('charCount');
  const sendBtn      = $('sendBtn');
  const cancelBtn    = $('cancelBtn');
  const retryBtn     = $('retryBtn');
  const closeBtn     = $('closeBtn');
  const healingText  = $('healingText');
  const audioToggle  = $('audioToggle');
  const audioIcon    = $('audioIcon');
  const audioWave    = $('audioWave');
  const progressFill = $('progressFill');
  const audioStatusText = $('audioStatusText');
  const treeHoleBtn  = $('treeHoleBtn');

  function showModal() {
    modalOverlay.classList.add('active');
    modalSheet.classList.add('active');
    modalOverlay.setAttribute('aria-hidden', 'false');
    switchView('viewInput');
    setTimeout(() => ventInput.focus(), 400);
  }

  function hideModal() {
    modalOverlay.classList.remove('active');
    modalSheet.classList.remove('active');
    modalOverlay.setAttribute('aria-hidden', 'true');
    stopAudio();
    clearAllTimers();
    ventInput.value = '';
    updateCharCount();
  }

  function switchView(name) {
    [viewInput, viewLoading, viewHealing].forEach(v => v.classList.remove('active'));
    if (name === 'viewInput')   viewInput.classList.add('active');
    if (name === 'viewLoading') viewLoading.classList.add('active');
    if (name === 'viewHealing') {
      viewHealing.classList.add('active');
      startAudio();
    }
    state.view = name;
  }

  function updateCharCount() {
    const len = ventInput.value.length;
    charCount.textContent = `${len} / 200`;
    sendBtn.disabled = len === 0;
  }

  function clearAllTimers() {
    if (state.loadTimer) { clearTimeout(state.loadTimer); state.loadTimer = null; }
    if (state.audioTimer) { clearInterval(state.audioTimer); state.audioTimer = null; }
  }

  // ==================== 治愈反馈 ====================
  function sendToStar() {
    state.userText = ventInput.value.trim();
    switchView('viewLoading');

    state.loadTimer = setTimeout(() => {
      const idx = Math.floor(Math.random() * healingTexts.length);
      state.healingText = healingTexts[idx];
      healingText.textContent = state.healingText;
      switchView('viewHealing');
    }, 3000);
  }

  // ==================== 模拟音频 ====================
  function startAudio() {
    state.audioProgress = 0;
    state.audioPlaying  = true;
    progressFill.style.width = '0%';
    progressFill.classList.remove('playing');
    // 强制重排
    void progressFill.offsetWidth;
    progressFill.classList.add('playing');
    audioWave.classList.add('playing');
    audioIcon.className = 'fa-solid fa-pause text-xs';
    audioStatusText.textContent = '正在为你编织梦境声音…';

    clearAllTimers();
    const totalMs = 12000;
    const startTime = Date.now();
    state.audioTimer = setInterval(() => {
      const elapsed = Date.now() - startTime;
      const pct = Math.min(100, (elapsed / totalMs) * 100);
      if (pct >= 100) {
        stopAudio(true);
      }
    }, 200);
  }

  function stopAudio(finished = false) {
    state.audioPlaying = false;
    audioWave.classList.remove('playing');
    if (state.audioTimer) { clearInterval(state.audioTimer); state.audioTimer = null; }

    if (finished) {
      progressFill.style.width = '100%';
      progressFill.classList.remove('playing');
      audioIcon.className = 'fa-solid fa-rotate-right text-xs';
      audioStatusText.textContent = '晚安，愿你做个好梦 ✨';
    } else {
      audioIcon.className = 'fa-solid fa-play text-xs';
      audioStatusText.textContent = '已暂停 · 轻触继续';
    }
  }

  function toggleAudio() {
    if (state.audioPlaying) {
      stopAudio(false);
    } else {
      if (state.audioProgress >= 100 || progressFill.style.width === '100%') {
        // 重播
        startAudio();
      } else {
        // 继续
        resumeAudio();
      }
    }
  }

  function resumeAudio() {
    state.audioPlaying = true;
    audioWave.classList.add('playing');
    audioIcon.className = 'fa-solid fa-pause text-xs';
    audioStatusText.textContent = '正在为你编织梦境声音…';
    const totalMs = 12000;
    const startTime = Date.now() - (state.audioProgress / 100) * totalMs;
    clearAllTimers();
    state.audioTimer = setInterval(() => {
      const elapsed = Date.now() - startTime;
      const pct = Math.min(100, (elapsed / totalMs) * 100);
      progressFill.style.width = pct + '%';
      state.audioProgress = pct;
      if (pct >= 100) stopAudio(true);
    }, 200);
  }

  // ==================== 事件绑定 ====================
  treeHoleBtn.addEventListener('click', showModal);
  modalOverlay.addEventListener('click', hideModal);
  cancelBtn.addEventListener('click', hideModal);
  sendBtn.addEventListener('click', sendToStar);
  retryBtn.addEventListener('click', () => {
    ventInput.value = '';
    updateCharCount();
    switchView('viewInput');
    stopAudio();
    progressFill.style.width = '0%';
    audioStatusText.textContent = '正在为你编织梦境声音…';
    setTimeout(() => ventInput.focus(), 300);
  });
  closeBtn.addEventListener('click', hideModal);
  ventInput.addEventListener('input', updateCharCount);
  audioToggle.addEventListener('click', toggleAudio);

  // ESC 关闭
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalSheet.classList.contains('active')) hideModal();
  });

  // 阻止移动端双指缩放带来的卡顿
  document.addEventListener('gesturestart', (e) => e.preventDefault());
</script>

</body>
</html>
