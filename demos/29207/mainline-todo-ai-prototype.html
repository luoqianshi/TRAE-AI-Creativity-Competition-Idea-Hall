<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>主线 Todo AI App Prototype</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      background: #eeeeee;
      color: #202124;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .design-stage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .phone-area {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .phone-frame {
      display: inline-block;
      padding: 12px;
      position: relative;
      background: #000000;
      border-radius: 60px;
      box-shadow: 0 0 0 2px #1f2937, 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .phone-screen {
      width: 393px;
      height: 852px;
      position: relative;
      overflow: hidden;
      background: #f1f2f1;
      border-radius: 48px;
    }

    .status-bar {
      height: 54px;
      position: absolute;
      inset: 0 0 auto;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      color: #000000;
      font-size: 16px;
      font-weight: 600;
      pointer-events: none;
    }

    .dynamic-island {
      width: 124px;
      height: 36px;
      position: absolute;
      top: 12px;
      left: 50%;
      z-index: 30;
      transform: translateX(-50%);
      background: #000000;
      border-radius: 999px;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .signal-icon {
      height: 12px;
      display: flex;
      align-items: flex-end;
      gap: 2px;
    }

    .signal-icon span {
      width: 3px;
      display: block;
      background: currentColor;
      border-radius: 1px;
    }

    .signal-icon span:nth-child(1) {
      height: 4px;
    }

    .signal-icon span:nth-child(2) {
      height: 6px;
    }

    .signal-icon span:nth-child(3) {
      height: 9px;
    }

    .signal-icon span:nth-child(4) {
      height: 11px;
    }

    .wifi-icon {
      width: 16px;
      height: 12px;
      display: block;
    }

    .battery-icon {
      width: 26px;
      height: 12px;
      position: relative;
      padding: 1px;
      border: 1.5px solid currentColor;
      border-radius: 3px;
      opacity: 0.8;
    }

    .battery-icon::before {
      width: 86%;
      height: 100%;
      display: block;
      content: "";
      background: currentColor;
      border-radius: 1px;
      opacity: 0.9;
    }

    .battery-icon::after {
      width: 2px;
      height: 6px;
      position: absolute;
      top: 3px;
      right: -3px;
      content: "";
      background: currentColor;
      border-radius: 0 1px 1px 0;
    }

    .phone-content {
      position: absolute;
      inset: 54px 0 34px;
      overflow: auto;
    }

    .home-indicator {
      width: 140px;
      height: 5px;
      position: absolute;
      bottom: 10px;
      left: 50%;
      z-index: 10;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.3);
      border-radius: 999px;
    }

    .app-screen {
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #f1f2f1;
      color: #202124;
    }

    .task-stack {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: auto;
      padding: 18px 14px 12px;
      scrollbar-width: thin;
      scrollbar-color: rgba(32, 33, 36, 0.18) transparent;
    }

    .task-card {
      min-height: 68px;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      align-items: start;
      gap: 12px;
      padding: 12px;
      border: 1px solid rgba(32, 33, 36, 0.08);
      border-radius: 16px;
      background: #fafafa;
      color: #202124;
      transition: opacity 180ms ease, background 180ms ease;
    }

    .task-card.ai-card {
      grid-template-columns: 28px minmax(0, 1fr) 54px;
    }

    .task-card.done {
      opacity: 0.46;
    }

    .task-card:has(.task-check:focus-visible) {
      outline: 2px solid rgba(32, 33, 36, 0.18);
      outline-offset: 2px;
    }

    .task-check {
      width: 28px;
      height: 28px;
      margin-top: 2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border-radius: 999px;
    }

    .task-check-ring {
      width: 16px;
      height: 16px;
      display: block;
      border: 1.6px solid #85878a;
      border-radius: 999px;
    }

    .task-check[aria-pressed="true"] .task-check-ring {
      background: #202124;
      border-color: #202124;
    }

    .task-copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 7px;
    }

    .task-title {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: #202124;
      font-size: 17px;
      font-weight: 480;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .task-tags {
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .task-tag {
      flex: 0 0 auto;
      padding: 4px 8px;
      border-radius: 999px;
      background: #e8e9e8;
      color: #62656a;
      font-size: 11px;
      line-height: 1.2;
    }

    .task-tag.main {
      background: #dfe8f7;
      color: #36506c;
    }

    .task-tag.required {
      background: #ece5d8;
      color: #6d5736;
    }

    .task-tag.study {
      background: #dfeadd;
      color: #3f6545;
    }

    .task-tag.side {
      background: #e7e4ee;
      color: #5c526f;
    }

    .task-tag.ai {
      background: #e9e1d3;
      color: #735335;
    }

    .undo-button {
      min-width: 50px;
      min-height: 34px;
      align-self: center;
      padding: 0 10px;
      border-radius: 999px;
      background: #e7e8e7;
      color: #4e5155;
      font-size: 13px;
      font-weight: 520;
    }

    .ai-dock {
      flex-shrink: 0;
      padding: 0 10px 12px;
    }

    .ai-form {
      width: 100%;
      min-height: 50px;
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      gap: 4px;
      padding: 5px;
      border: 1px solid rgba(32, 33, 36, 0.08);
      border-radius: 999px;
      background: #ffffff;
    }

    .ai-input {
      min-width: 0;
      height: 40px;
      padding: 0 6px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #202124;
      font-size: 16px;
    }

    .ai-input::placeholder {
      color: #8a8d91;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #5f6368;
      border-radius: 999px;
    }

    .icon-button.primary {
      background: #202124;
      color: #ffffff;
    }

    .icon-button.recording {
      background: #e8e9e8;
      color: #202124;
    }

    .icon-button svg {
      width: 20px;
      height: 20px;
    }

    @media (max-width: 900px) {
      .design-stage {
        padding: 16px 6px 28px;
      }
    }
  </style>
</head>
<body>
  <main class="design-stage">
    <section class="phone-area" aria-label="主线 App 原型">
      <div class="phone-frame">
        <div class="phone-screen">
          <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons">
              <div class="signal-icon" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
              </div>
              <svg class="wifi-icon" viewBox="0 0 16 12" fill="none" aria-hidden="true">
                <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor"></path>
                <path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"></path>
                <path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.7"></path>
              </svg>
              <div class="battery-icon" aria-hidden="true"></div>
            </div>
          </div>
          <div class="dynamic-island"></div>
          <div class="phone-content">
            <div class="app-screen">
              <section class="task-stack" aria-label="待办事项卡片">
                <article class="task-card" data-testid="task-main">
                  <button class="task-check" type="button" aria-label="完成：完成实验设计初稿" aria-pressed="false">
                    <span class="task-check-ring" aria-hidden="true"></span>
                  </button>
                  <div class="task-copy">
                    <h2 class="task-title">完成实验设计初稿</h2>
                    <div class="task-tags">
                      <span class="task-tag main">主线</span>
                    </div>
                  </div>
                </article>
                <article class="task-card" data-testid="task-report">
                  <button class="task-check" type="button" aria-label="完成：整理项目日报" aria-pressed="false">
                    <span class="task-check-ring" aria-hidden="true"></span>
                  </button>
                  <div class="task-copy">
                    <h2 class="task-title">整理项目日报</h2>
                    <div class="task-tags">
                      <span class="task-tag required">必要</span>
                    </div>
                  </div>
                </article>
                <article class="task-card" data-testid="task-course">
                  <button class="task-check" type="button" aria-label="完成：回看课程第 3 节" aria-pressed="false">
                    <span class="task-check-ring" aria-hidden="true"></span>
                  </button>
                  <div class="task-copy">
                    <h2 class="task-title">回看课程第 3 节</h2>
                    <div class="task-tags">
                      <span class="task-tag study">学习</span>
                    </div>
                  </div>
                </article>
                <article class="task-card" data-testid="task-template">
                  <button class="task-check" type="button" aria-label="完成：优化笔记模板" aria-pressed="false">
                    <span class="task-check-ring" aria-hidden="true"></span>
                  </button>
                  <div class="task-copy">
                    <h2 class="task-title">优化笔记模板</h2>
                    <div class="task-tags">
                      <span class="task-tag side">支线</span>
                    </div>
                  </div>
                </article>
                <article class="task-card ai-card" data-testid="task-ai-suggestion">
                  <button class="task-check" type="button" aria-label="完成：先写 6 行实验假设" aria-pressed="false">
                    <span class="task-check-ring" aria-hidden="true"></span>
                  </button>
                  <div class="task-copy">
                    <h2 class="task-title">先写 6 行实验假设</h2>
                    <div class="task-tags">
                      <span class="task-tag ai">AI建议</span>
                    </div>
                  </div>
                  <button class="undo-button" type="button" aria-label="撤销：先写 6 行实验假设">撤销</button>
                </article>
              </section>
              <section class="ai-dock" aria-label="AI 对话框">
                <form class="ai-form">
                  <button class="icon-button" data-testid="voice-button" type="button" aria-label="长按语音输入" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <path d="M12 4.5a3 3 0 00-3 3v4.2a3 3 0 006 0V7.5a3 3 0 00-3-3z" stroke="currentColor" stroke-width="2"></path>
                      <path d="M6.5 11.4a5.5 5.5 0 0011 0M12 17v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                    </svg>
                  </button>
                  <input class="ai-input" data-testid="ai-input" placeholder="和AI聊聊" aria-label="和AI聊聊" />
                  <button class="icon-button primary" data-testid="send-button" type="submit" aria-label="发送给 AI">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <path d="M5 12h13M13 7l5 5-5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                  </button>
                </form>
              </section>
            </div>
          </div>
          <div class="home-indicator"></div>
        </div>
      </div>
    </section>
  </main>
  <script>
    const voiceButton = document.querySelector('[data-testid="voice-button"]');
    const aiInput = document.querySelector('[data-testid="ai-input"]');
    let holdTimer = 0;
    let didRecord = false;

    document.querySelectorAll('.task-check').forEach((button) => {
      button.addEventListener('click', () => {
        const card = button.closest('.task-card');
        const isPressed = button.getAttribute('aria-pressed') === 'true';
        button.setAttribute('aria-pressed', String(!isPressed));
        const title = card.querySelector('.task-title').textContent;
        button.setAttribute('aria-label', `${isPressed ? '完成' : '恢复'}：${title}`);
        card.classList.toggle('done', !isPressed);
      });
    });

    document.querySelector('.undo-button').addEventListener('click', (event) => {
      event.currentTarget.closest('.task-card').remove();
    });

    document.querySelector('.ai-form').addEventListener('submit', (event) => {
      event.preventDefault();
      aiInput.value = '';
    });

    function startVoice() {
      window.clearTimeout(holdTimer);
      didRecord = false;
      holdTimer = window.setTimeout(() => {
        didRecord = true;
        voiceButton.classList.add('recording');
        voiceButton.setAttribute('aria-pressed', 'true');
      }, 220);
    }

    function endVoice() {
      window.clearTimeout(holdTimer);
      if (didRecord) {
        voiceButton.classList.remove('recording');
        voiceButton.setAttribute('aria-pressed', 'false');
        aiInput.value = '我刚刷了资料，还没写实验初稿';
      }
    }

    voiceButton.addEventListener('pointerdown', startVoice);
    voiceButton.addEventListener('pointerup', endVoice);
    voiceButton.addEventListener('pointercancel', endVoice);
    voiceButton.addEventListener('pointerleave', () => {
      if (voiceButton.getAttribute('aria-pressed') === 'true') {
        endVoice();
      }
    });

    window.__ready = true;
  </script>
</body>
</html>
