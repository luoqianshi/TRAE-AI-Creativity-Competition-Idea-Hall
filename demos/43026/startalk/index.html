<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星星的孩子 · StarTalk</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Stars background canvas -->
  <canvas id="stars-canvas"></canvas>

  <div id="app">
    <!-- API Key Setup Screen -->
    <div id="setup-screen" class="screen active">
      <div class="setup-card">
        <div class="logo-ring">🌟</div>
        <h1 class="app-title">星星的孩子</h1>
        <p class="app-sub">StarTalk · AI情绪表达与社交训练公益助手</p>
        <div class="setup-form">
          <label class="form-label">Anthropic API Key</label>
          <input type="password" id="api-key-input" placeholder="sk-ant-..." class="form-input" />
          <p class="form-hint">API Key 仅存储在本地浏览器，不会上传到任何服务器</p>
          <button class="btn-primary" onclick="startApp()">开始使用 ✨</button>
        </div>
      </div>
    </div>

    <!-- Main App -->
    <div id="main-screen" class="screen">
      <!-- Header -->
      <header class="app-header">
        <div class="header-avatar" id="header-avatar">🌟</div>
        <div class="header-info">
          <div class="header-title">星星的孩子</div>
          <div class="header-stars">⭐ <span id="total-stars">0</span> 颗星星</div>
        </div>
        <button class="icon-btn" onclick="showReport()" title="家长报告">📊</button>
      </header>

      <!-- Nav -->
      <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('mood', this)">
          <span class="nav-icon">😊</span><span class="nav-label">心情</span>
        </button>
        <button class="nav-item" onclick="switchTab('chat', this)">
          <span class="nav-icon">💬</span><span class="nav-label">星宝</span>
        </button>
        <button class="nav-item" onclick="switchTab('social', this)">
          <span class="nav-icon">🎭</span><span class="nav-label">社交</span>
        </button>
        <button class="nav-item" onclick="switchTab('game', this)">
          <span class="nav-icon">🎮</span><span class="nav-label">游戏</span>
        </button>
        <button class="nav-item" onclick="switchTab('story', this)">
          <span class="nav-icon">📖</span><span class="nav-label">绘本</span>
        </button>
        <button class="nav-item" onclick="switchTab('wall', this)">
          <span class="nav-icon">⭐</span><span class="nav-label">星星墙</span>
        </button>
      </nav>

      <!-- Tab Pages -->
      <main class="tab-content">
        <div id="tab-mood" class="tab-page active"></div>
        <div id="tab-chat" class="tab-page"></div>
        <div id="tab-social" class="tab-page"></div>
        <div id="tab-game" class="tab-page"></div>
        <div id="tab-story" class="tab-page"></div>
        <div id="tab-wall" class="tab-page"></div>
      </main>
    </div>

    <!-- Report Modal -->
    <div id="report-modal" class="modal-overlay" onclick="closeReport(event)">
      <div class="modal-card" id="report-card"></div>
    </div>
  </div>

  <script src="js/stars-bg.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/tabs/mood.js"></script>
  <script src="js/tabs/chat.js"></script>
  <script src="js/tabs/social.js"></script>
  <script src="js/tabs/game.js"></script>
  <script src="js/tabs/story.js"></script>
  <script src="js/tabs/wall.js"></script>
  <script src="js/report.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
