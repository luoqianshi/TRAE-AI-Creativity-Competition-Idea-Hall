<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SenseHome Hub - 智感家居中枢 Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #ffffff;
    }
    .container {
      padding: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .badge-demo {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
    }
    .status-indicator.online {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: default;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(79, 172, 254, 0.15);
    }
    .card-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }
    .card-value {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -1px;
    }
    .card-unit {
      font-size: 14px;
      color: #9ca3af;
      margin-left: 4px;
    }
    .card-label {
      font-size: 14px;
      color: #9ca3af;
      margin-top: 6px;
    }
    .card-status {
      margin-top: 14px;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
    }
    .status-good { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
    .status-warning { background: rgba(251, 191, 36, 0.15); color: #f59e0b; }
    .status-danger { background: rgba(239, 68, 68, 0.15); color: #ef4444; }

    .chart-section {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 24px;
    }
    .chart-section h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #e5e7eb;
    }
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 24px;
    }
    .chart-wrap {
      position: relative;
      height: 220px;
    }

    .control-section {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .control-section h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #e5e7eb;
    }
    .device-controls {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .device-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 20px;
      min-width: 200px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      flex: 1;
    }
    .device-card h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toggle-btn {
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      width: 100%;
      letter-spacing: 0.5px;
    }
    .toggle-btn.on {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
    }
    .toggle-btn.on:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
    }
    .toggle-btn.off {
      background: rgba(255, 255, 255, 0.08);
      color: #9ca3af;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .toggle-btn.off:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: scale(1.03);
    }
    .device-status {
      margin-top: 10px;
      font-size: 12px;
      color: #9ca3af;
    }

    .footer {
      text-align: center;
      padding: 40px 0 20px;
      color: #6b7280;
      font-size: 13px;
    }
    .footer a {
      color: #4facfe;
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .header { flex-direction: column; align-items: flex-start; }
      .grid { grid-template-columns: 1fr; }
      .chart-grid { grid-template-columns: 1fr; }
      .device-controls { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>SenseHome Hub</h1>
      <div style="display:flex;gap:10px;align-items:center;">
        <span class="badge badge-demo">Demo 演示版</span>
        <div class="status-indicator online">
          <div class="status-dot"></div>
          设备已连接
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-icon">🌡️</div>
        <div>
          <span class="card-value" id="val-temp">24.5</span>
          <span class="card-unit">°C</span>
        </div>
        <div class="card-label">室内温度</div>
        <div class="card-status status-good" id="status-temp">温度适宜</div>
      </div>
      <div class="card">
        <div class="card-icon">💧</div>
        <div>
          <span class="card-value" id="val-hum">58.2</span>
          <span class="card-unit">%</span>
        </div>
        <div class="card-label">相对湿度</div>
        <div class="card-status status-good" id="status-hum">湿度适宜</div>
      </div>
      <div class="card">
        <div class="card-icon">🌬️</div>
        <div>
          <span class="card-value" id="val-press">1013.2</span>
          <span class="card-unit">hPa</span>
        </div>
        <div class="card-label">大气压力</div>
        <div class="card-status status-good">正常</div>
      </div>
      <div class="card">
        <div class="card-icon">🌫️</div>
        <div>
          <span class="card-value" id="val-co2">420</span>
          <span class="card-unit">ppm</span>
        </div>
        <div class="card-label">CO₂浓度</div>
        <div class="card-status status-good" id="status-co2">空气质量优</div>
      </div>
    </div>

    <div class="chart-section">
      <h2>实时趋势</h2>
      <div class="chart-grid">
        <div class="chart-wrap">
          <canvas id="chart-temp"></canvas>
        </div>
        <div class="chart-wrap">
          <canvas id="chart-hum"></canvas>
        </div>
      </div>
    </div>

    <div class="control-section">
      <h2>设备控制</h2>
      <div class="device-controls">
        <div class="device-card">
          <h3><span style="font-size:20px;">🔌</span> 智能插座</h3>
          <button class="toggle-btn off" id="btn-relay" onclick="toggleRelay()">开启</button>
          <div class="device-status" id="txt-relay">当前状态: 已关闭</div>
        </div>
        <div class="device-card">
          <h3><span style="font-size:20px;">🌀</span> 空气净化器</h3>
          <button class="toggle-btn off" id="btn-purifier" onclick="togglePurifier()">开启</button>
          <div class="device-status" id="txt-purifier">当前状态: 已关闭 (自动模式)</div>
        </div>
        <div class="device-card">
          <h3><span style="font-size:20px;">💨</span> 加湿器</h3>
          <button class="toggle-btn off" id="btn-humidifier" onclick="toggleHumidifier()">开启</button>
          <div class="device-status" id="txt-humidifier">当前状态: 已关闭 (自动模式)</div>
        </div>
      </div>
    </div>

    <div class="footer">
      SenseHome Hub · TRAE AI创造力大赛 · 硬件交互赛道<br>
      <a href="#">GitHub</a> · 双击本文件即可在浏览器中运行
    </div>
  </div>

  <script>
    // ========== 模拟数据 ==========
    let temp = 24.5, hum = 58.2, press = 1013.2, co2 = 420;
    let relayOn = false, purifierOn = false, humidifierOn = false;

    const tempCtx = document.getElementById('chart-temp').getContext('2d');
    const humCtx = document.getElementById('chart-hum').getContext('2d');

    const commonOptions = {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: {
          grid: { color: 'rgba(255,255,255,0.04)' },
          ticks: { color: '#6b7280', font: { size: 10 }, maxTicksLimit: 6 }
        },
        y: {
          grid: { color: 'rgba(255,255,255,0.04)' },
          ticks: { color: '#6b7280', font: { size: 10 } }
        }
      },
      elements: { point: { radius: 0, hoverRadius: 5 }, line: { tension: 0.4 } },
      interaction: { intersect: false, mode: 'index' }
    };

    function createGradient(ctx, color) {
      const g = ctx.createLinearGradient(0, 0, 0, 220);
      g.addColorStop(0, color + '30');
      g.addColorStop(1, color + '05');
      return g;
    }

    const chartTemp = new Chart(tempCtx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: '温度 (°C)',
          data: [],
          borderColor: '#f59e0b',
          backgroundColor: createGradient(tempCtx, '#f59e0b'),
          fill: true,
          borderWidth: 2
        }]
      },
      options: commonOptions
    });

    const chartHum = new Chart(humCtx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: '湿度 (%)',
          data: [],
          borderColor: '#3b82f6',
          backgroundColor: createGradient(humCtx, '#3b82f6'),
          fill: true,
          borderWidth: 2
        }]
      },
      options: commonOptions
    });

    function updateStatus() {
      // 温度状态
      const st = document.getElementById('status-temp');
      if (temp >= 28) { st.className = 'card-status status-danger'; st.textContent = '温度偏高'; }
      else if (temp >= 25) { st.className = 'card-status status-warning'; st.textContent = '温度适中'; }
      else { st.className = 'card-status status-good'; st.textContent = '温度适宜'; }

      // 湿度状态
      const sh = document.getElementById('status-hum');
      if (hum >= 70) { sh.className = 'card-status status-danger'; sh.textContent = '湿度过高'; }
      else if (hum >= 60) { sh.className = 'card-status status-warning'; sh.textContent = '湿度适中'; }
      else if (hum >= 40) { sh.className = 'card-status status-good'; sh.textContent = '湿度适宜'; }
      else if (hum >= 30) { sh.className = 'card-status status-warning'; sh.textContent = '湿度偏低'; }
      else { sh.className = 'card-status status-danger'; sh.textContent = '湿度过低'; }

      // CO2状态
      const sc = document.getElementById('status-co2');
      if (co2 >= 1000) { sc.className = 'card-status status-danger'; sc.textContent = '需要通风'; }
      else if (co2 >= 600) { sc.className = 'card-status status-warning'; sc.textContent = '浓度偏高'; }
      else { sc.className = 'card-status status-good'; sc.textContent = '空气质量优'; }
    }

    function updateCharts(now, t, h) {
      const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0') + ':' + now.getSeconds().toString().padStart(2,'0');

      chartTemp.data.labels.push(timeStr);
      chartTemp.data.datasets[0].data.push(t);
      if (chartTemp.data.labels.length > 30) { chartTemp.data.labels.shift(); chartTemp.data.datasets[0].data.shift(); }
      chartTemp.update('none');

      chartHum.data.labels.push(timeStr);
      chartHum.data.datasets[0].data.push(h);
      if (chartHum.data.labels.length > 30) { chartHum.data.labels.shift(); chartHum.data.datasets[0].data.shift(); }
      chartHum.update('none');
    }

    // ========== 主循环 ==========
    function tick() {
      // 模拟数据波动
      temp += (Math.random() - 0.5) * 0.4;
      hum += (Math.random() - 0.5) * 1.2;
      press += (Math.random() - 0.5) * 0.5;
      co2 += (Math.random() - 0.5) * 8;

      // 边界限制
      temp = Math.max(18, Math.min(32, temp));
      hum = Math.max(20, Math.min(85, hum));
      press = Math.max(980, Math.min(1040, press));
      co2 = Math.max(380, Math.min(1500, co2));

      // 更新显示
      document.getElementById('val-temp').textContent = temp.toFixed(1);
      document.getElementById('val-hum').textContent = hum.toFixed(1);
      document.getElementById('val-press').textContent = press.toFixed(1);
      document.getElementById('val-co2').textContent = Math.round(co2).toString();

      updateStatus();

      const now = new Date();
      updateCharts(now, temp, hum);

      // 自动联动逻辑
      if (!purifierOn && co2 > 700) { togglePurifier(true); }
      if (purifierOn && co2 < 500) { togglePurifier(false); }
      if (!humidifierOn && hum < 35) { toggleHumidifier(true); }
      if (humidifierOn && hum > 55) { toggleHumidifier(false); }
    }

    // ========== 设备控制 ==========
    function setBtnState(id, on) {
      const btn = document.getElementById(id);
      btn.className = 'toggle-btn ' + (on ? 'on' : 'off');
      btn.textContent = on ? '关闭' : '开启';
    }

    function toggleRelay() {
      relayOn = !relayOn;
      setBtnState('btn-relay', relayOn);
      document.getElementById('txt-relay').textContent = '当前状态: ' + (relayOn ? '运行中' : '已关闭');
    }

    function togglePurifier(force) {
      if (typeof force === 'boolean') purifierOn = force; else purifierOn = !purifierOn;
      setBtnState('btn-purifier', purifierOn);
      document.getElementById('txt-purifier').textContent = '当前状态: ' + (purifierOn ? '运行中' : '已关闭') + ' (自动模式)';
    }

    function toggleHumidifier(force) {
      if (typeof force === 'boolean') humidifierOn = force; else humidifierOn = !humidifierOn;
      setBtnState('btn-humidifier', humidifierOn);
      document.getElementById('txt-humidifier').textContent = '当前状态: ' + (humidifierOn ? '运行中' : '已关闭') + ' (自动模式)';
    }

    // 初始化
    for (let i = 0; i < 20; i++) {
      temp += (Math.random() - 0.5) * 0.3;
      hum += (Math.random() - 0.5) * 1;
      const now = new Date(Date.now() - (20 - i) * 2000);
      updateCharts(now, temp, hum);
    }
    updateStatus();

    setInterval(tick, 2000);
  </script>
</body>
</html>
