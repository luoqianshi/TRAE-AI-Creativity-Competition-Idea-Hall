<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>算术防线：数域之战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .game-header {
            margin-bottom: 30px;
        }

        .game-title {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .game-subtitle {
            font-size: 14px;
            color: #666;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .question-area {
            margin-bottom: 30px;
        }

        .question-number {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .input-area {
            margin-bottom: 20px;
        }

        .answer-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s;
        }

        .answer-input:focus {
            border-color: #667eea;
        }

        .answer-input.error {
            border-color: #e74c3c;
            background: #ffebee;
        }

        .answer-input.success {
            border-color: #27ae60;
            background: #e8f5e9;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .feedback-area {
            min-height: 40px;
            margin-top: 20px;
        }

        .feedback {
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.3s, transform 0.3s;
        }

        .feedback.show {
            opacity: 1;
            transform: translateY(0);
        }

        .feedback.correct {
            background: #27ae60;
            color: white;
        }

        .feedback.wrong {
            background: #e74c3c;
            color: white;
        }

        .difficulty-selector {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .diff-btn {
            padding: 8px 20px;
            font-size: 14px;
            border: 2px solid #ddd;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .diff-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .game-over.show {
            opacity: 1;
            pointer-events: auto;
        }

        .game-over-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .game-over-title {
            font-size: 28px;
            color: #333;
            margin-bottom: 20px;
        }

        .final-score {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .final-stats {
            color: #666;
            margin-bottom: 30px;
        }

        .restart-btn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .pulse-animation {
            animation: pulse 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">算术防线</h1>
            <p class="game-subtitle">数域之战 · 挑战你的计算极限</p>
        </div>

        <div class="difficulty-selector">
            <button class="diff-btn active" data-level="easy">简单</button>
            <button class="diff-btn" data-level="medium">中等</button>
            <button class="diff-btn" data-level="hard">困难</button>
        </div>

        <div class="score-board">
            <div class="score-item">
                <div class="score-label">得分</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">正确</div>
                <div class="score-value" id="correct">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">错误</div>
                <div class="score-value" id="wrong">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">题目</div>
                <div class="score-value" id="question-count">1</div>
            </div>
        </div>

        <div class="question-area">
            <div class="question-number">第 <span id="current-question">1</span> 题</div>
            <div class="question-text" id="question">?</div>
        </div>

        <div class="input-area">
            <input type="number" class="answer-input" id="answer" placeholder="输入答案" autofocus>
        </div>

        <button class="submit-btn" id="submit-btn">提交答案</button>

        <div class="feedback-area">
            <div class="feedback" id="feedback"></div>
        </div>
    </div>

    <div class="game-over" id="game-over">
        <div class="game-over-content">
            <h2 class="game-over-title">游戏结束</h2>
            <div class="final-score" id="final-score">0</div>
            <div class="final-stats" id="final-stats"></div>
            <button class="restart-btn" id="restart-btn">再来一局</button>
        </div>
    </div>

    <script>
        class MathGame {
            constructor() {
                this.score = 0;
                this.correctCount = 0;
                this.wrongCount = 0;
                this.questionCount = 0;
                this.maxQuestions = 10;
                this.currentQuestion = null;
                this.difficulty = 'easy';
                
                this.difficultyConfig = {
                    easy: { min: 1, max: 10, ops: ['+', '-'] },
                    medium: { min: 1, max: 20, ops: ['+', '-', '*'] },
                    hard: { min: 1, max: 50, ops: ['+', '-', '*', '/'] }
                };

                this.initElements();
                this.bindEvents();
                this.generateQuestion();
            }

            initElements() {
                this.questionEl = document.getElementById('question');
                this.answerEl = document.getElementById('answer');
                this.submitBtn = document.getElementById('submit-btn');
                this.feedbackEl = document.getElementById('feedback');
                this.scoreEl = document.getElementById('score');
                this.correctEl = document.getElementById('correct');
                this.wrongEl = document.getElementById('wrong');
                this.questionCountEl = document.getElementById('question-count');
                this.currentQuestionEl = document.getElementById('current-question');
                this.gameOverEl = document.getElementById('game-over');
                this.finalScoreEl = document.getElementById('final-score');
                this.finalStatsEl = document.getElementById('final-stats');
                this.restartBtn = document.getElementById('restart-btn');
                this.diffBtns = document.querySelectorAll('.diff-btn');
            }

            bindEvents() {
                this.submitBtn.addEventListener('click', () => this.checkAnswer());
                this.answerEl.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.checkAnswer();
                });

                this.diffBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.diffBtns.forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.difficulty = e.target.dataset.level;
                        this.restartGame();
                    });
                });

                this.restartBtn.addEventListener('click', () => this.restartGame());
            }

            generateQuestion() {
                const config = this.difficultyConfig[this.difficulty];
                const ops = config.ops;
                const op = ops[Math.floor(Math.random() * ops.length)];
                
                let num1, num2, answer;

                switch (op) {
                    case '+':
                        num1 = Math.floor(Math.random() * (config.max - config.min + 1)) + config.min;
                        num2 = Math.floor(Math.random() * (config.max - config.min + 1)) + config.min;
                        answer = num1 + num2;
                        break;
                    case '-':
                        num1 = Math.floor(Math.random() * (config.max - config.min + 1)) + config.min;
                        num2 = Math.floor(Math.random() * num1) + config.min;
                        answer = num1 - num2;
                        break;
                    case '*':
                        num1 = Math.floor(Math.random() * 10) + 1;
                        num2 = Math.floor(Math.random() * 10) + 1;
                        answer = num1 * num2;
                        break;
                    case '/':
                        num2 = Math.floor(Math.random() * 10) + 1;
                        answer = Math.floor(Math.random() * 10) + 1;
                        num1 = num2 * answer;
                        break;
                }

                this.currentQuestion = {
                    num1,
                    num2,
                    op,
                    answer
                };

                this.questionEl.textContent = `${num1} ${op} ${num2} = ?`;
                this.questionCount++;
                this.updateScoreBoard();
            }

            checkAnswer() {
                const userAnswer = parseInt(this.answerEl.value);
                
                if (isNaN(userAnswer)) {
                    this.showFeedback('请输入有效数字', 'wrong');
                    return;
                }

                const isCorrect = userAnswer === this.currentQuestion.answer;

                if (isCorrect) {
                    this.correctCount++;
                    const points = this.getPoints();
                    this.score += points;
                    this.showFeedback(`✓ 正确！+${points}分`, 'correct');
                    this.answerEl.classList.add('success');
                } else {
                    this.wrongCount++;
                    this.showFeedback(`✗ 错误！正确答案是 ${this.currentQuestion.answer}`, 'wrong');
                    this.answerEl.classList.add('error');
                }

                setTimeout(() => {
                    this.answerEl.classList.remove('success', 'error');
                    this.answerEl.value = '';
                    this.answerEl.focus();

                    if (this.questionCount >= this.maxQuestions) {
                        this.endGame();
                    } else {
                        this.generateQuestion();
                    }
                }, 1000);
            }

            getPoints() {
                const points = {
                    easy: 10,
                    medium: 15,
                    hard: 20
                };
                return points[this.difficulty];
            }

            showFeedback(text, type) {
                this.feedbackEl.textContent = text;
                this.feedbackEl.className = `feedback show ${type}`;
                this.questionEl.classList.add('pulse-animation');
                
                setTimeout(() => {
                    this.feedbackEl.classList.remove('show');
                    this.questionEl.classList.remove('pulse-animation');
                }, 1000);
            }

            updateScoreBoard() {
                this.scoreEl.textContent = this.score;
                this.correctEl.textContent = this.correctCount;
                this.wrongEl.textContent = this.wrongCount;
                this.questionCountEl.textContent = this.maxQuestions;
                this.currentQuestionEl.textContent = this.questionCount;
            }

            endGame() {
                this.finalScoreEl.textContent = this.score;
                const accuracy = Math.round((this.correctCount / this.maxQuestions) * 100);
                this.finalStatsEl.textContent = `正确 ${this.correctCount} 题 · 错误 ${this.wrongCount} 题 · 正确率 ${accuracy}%`;
                this.gameOverEl.classList.add('show');
            }

            restartGame() {
                this.score = 0;
                this.correctCount = 0;
                this.wrongCount = 0;
                this.questionCount = 0;
                this.gameOverEl.classList.remove('show');
                this.answerEl.value = '';
                this.answerEl.focus();
                this.generateQuestion();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new MathGame();
        });
    </script>
</body>
</html>
