<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 赛博白板</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--border:#2a2a3a;
    --text:#e4e4ef;--text2:#8888a0;--accent:#6c5ce7;--accent2:#a29bfe;
    --danger:#ff6b6b;--highlight:#ffeaa7;
    --card1:#6c5ce7;--card2:#00cec9;--card3:#fd79a8;--card4:#fdcb6e;--card5:#55efc4;
    --radius:12px;--shadow:0 8px 32px rgba(0,0,0,.4);
  }
  html,body{height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
  .app{display:flex;height:100vh}

  /* ===== 左侧面板 ===== */
  .panel{width:340px;min-width:340px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 20px;gap:20px;overflow-y:auto}
  .panel-title{font-size:22px;font-weight:700;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
  .panel-title .icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--card2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
  .panel-subtitle{font-size:13px;color:var(--text2);line-height:1.6;margin-top:-8px}
  .input-group{display:flex;flex-direction:column;gap:8px}
  .input-group label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text2)}
  .topic-input{width:100%;min-height:100px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;color:var(--text);font-size:14px;line-height:1.6;resize:vertical;transition:border-color .2s}
  .topic-input:focus{outline:none;border-color:var(--accent)}
  .topic-input::placeholder{color:var(--text2)}
  .btn-decompose{width:100%;padding:14px;border:none;border-radius:var(--radius);background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
  .btn-decompose:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(108,92,231,.4)}
  .btn-decompose:active{transform:translateY(0)}
  .btn-decompose.loading{pointer-events:none;opacity:.7}
  .btn-decompose.loading::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);animation:shimmer 1.5s infinite}
  @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .divider{height:1px;background:var(--border);margin:4px 0}
  .stats{display:flex;gap:12px;flex-wrap:wrap}
  .stat{flex:1;min-width:80px;background:var(--surface2);border-radius:8px;padding:10px 12px;text-align:center}
  .stat-val{font-size:20px;font-weight:700;color:var(--accent2)}
  .stat-label{font-size:11px;color:var(--text2);margin-top:2px}
  .btn-clear{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text2);font-size:13px;cursor:pointer;transition:all .2s}
  .btn-clear:hover{border-color:var(--danger);color:var(--danger)}

  /* ===== 右侧画布 ===== */
  .canvas-area{flex:1;position:relative;overflow:hidden;background:var(--bg);
    background-image:radial-gradient(circle,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size:32px 32px}
  .canvas-area::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;
    background:radial-gradient(ellipse at 30% 20%,rgba(108,92,231,.06),transparent 60%),
               radial-gradient(ellipse at 70% 80%,rgba(0,206,201,.04),transparent 60%);pointer-events:none}
  .canvas-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--text2);pointer-events:none;transition:opacity .4s}
  .canvas-hint.hidden{opacity:0}
  .canvas-hint .hint-icon{font-size:48px;margin-bottom:12px;opacity:.3}
  .canvas-hint p{font-size:14px;line-height:1.8}

  /* ===== 卡片 ===== */
  .card{
    position:absolute;width:280px;min-height:160px;border-radius:var(--radius);
    background:var(--surface);border:1px solid var(--border);
    box-shadow:var(--shadow);cursor:grab;user-select:none;
    display:flex;flex-direction:column;overflow:hidden;
    animation:cardIn .5s cubic-bezier(.23,1,.32,1) forwards;
    opacity:0;transform:scale(.85) translateY(20px);
    transition:box-shadow .2s,border-color .2s}
  .card.dragging{cursor:grabbing;box-shadow:0 16px 48px rgba(0,0,0,.6);z-index:1000!important}
  .card.highlighted{border-color:var(--highlight);box-shadow:0 0 0 2px var(--highlight),0 8px 32px rgba(255,234,167,.2)}
  @keyframes cardIn{to{opacity:1;transform:scale(1) translateY(0)}}
  .card-stripe{height:4px;width:100%}
  .card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0}
  .card-tag{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:4px;opacity:.9}
  .card-actions{display:flex;gap:4px}
  .card-actions button{width:26px;height:26px;border:none;border-radius:6px;background:var(--surface2);color:var(--text2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .card-actions button:hover{background:var(--border);color:var(--text)}
  .card-actions .btn-del:hover{background:rgba(255,107,107,.15);color:var(--danger)}
  .card-body{padding:10px 16px 16px;flex:1}
  .card-title{font-size:15px;font-weight:700;margin-bottom:6px;line-height:1.4}
  .card-desc{font-size:13px;color:var(--text2);line-height:1.7}
  .card-title[contenteditable="true"],.card-desc[contenteditable="true"]{
    outline:none;background:rgba(108,92,231,.08);border-radius:4px;padding:2px 4px;margin:-2px -4px}
  .card.highlighted .card-title{color:var(--highlight)}
  .card.highlighted .card-desc{color:rgba(255,234,167,.7)}

  /* ===== Toast ===== */
  .toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
  .toast{padding:12px 20px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:13px;animation:toastIn .3s ease,toastOut .3s ease 2.2s forwards;box-shadow:var(--shadow)}
  @keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
  @keyframes toastOut{to{opacity:0;transform:translateX(40px)}}

  /* ===== 滚动条 ===== */
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:var(--text2)}
</style>
</head>
<body>
<div class="app">
  <!-- 左侧控制面板 -->
  <aside class="panel">
    <div class="panel-title"><span class="icon">⚡</span> AI 赛博白板</div>
    <p class="panel-subtitle">输入课题，AI 矩阵拆解为可视化卡片。支持拖拽、编辑、高亮，数据自动保存。</p>
    <div class="divider"></div>
    <div class="input-group">
      <label>课题输入</label>
      <textarea class="topic-input" id="topicInput" placeholder="例如：一份5万字论文的利益相关者分析&#10;例如：创业公司从0到1的冷启动策略&#10;例如：大模型落地的核心瓶颈与突破路径"></textarea>
    </div>
    <button class="btn-decompose" id="btnDecompose" onclick="decompose()">⚡ AI 矩阵拆解</button>
    <div class="divider"></div>
    <div class="stats">
      <div class="stat"><div class="stat-val" id="cardCount">0</div><div class="stat-label">卡片数</div></div>
      <div class="stat"><div class="stat-val" id="topicCount">0</div><div class="stat-label">已拆解</div></div>
    </div>
    <button class="btn-clear" onclick="clearAll()">🗑 清空白板</button>
  </aside>

  <!-- 右侧画布 -->
  <main class="canvas-area" id="canvas">
    <div class="canvas-hint" id="canvasHint">
      <div class="hint-icon">🧠</div>
      <p>在左侧输入课题<br>点击「AI 矩阵拆解」生成卡片</p>
    </div>
  </main>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
// ===== 状态管理 =====
const STORAGE_KEY = 'ai_cyber_whiteboard';
let cards = [];
let dragState = null;
let cardIdCounter = 0;

// ===== 卡片配色方案 =====
const CARD_THEMES = [
  { stripe: 'var(--card1)', tag: 'rgba(108,92,231,.15)', tagText: '#a29bfe', name: '紫晶' },
  { stripe: 'var(--card2)', tag: 'rgba(0,206,201,.15)', tagText: '#00cec9', name: '青碧' },
  { stripe: 'var(--card3)', tag: 'rgba(253,121,168,.15)', tagText: '#fd79a8', name: '绯霞' },
  { stripe: 'var(--card4)', tag: 'rgba(253,203,110,.15)', tagText: '#fdcb6e', name: '琥珀' },
  { stripe: 'var(--card5)', tag: 'rgba(85,239,196,.15)', tagText: '#55efc4', name: '翠微' },
];

// ===== AI 拆解模板 =====
const DECOMPOSITION_TEMPLATES = [
  { tag: '核心诉求', title: '核心诉求卡', desc: '识别课题中最关键的需求与目标，聚焦核心利益点与价值主张。' },
  { tag: '阻碍冲突', title: '阻碍冲突卡', desc: '梳理课题面临的核心矛盾、资源瓶颈与利益冲突，定位关键阻力。' },
  { tag: '策略路径', title: '策略路径卡', desc: '基于诉求与阻碍，推演可行的策略方向与执行路径，形成行动框架。' },
  { tag: '风险边界', title: '风险边界卡', desc: '识别潜在风险、不确定性因素与边界条件，划定安全与可行域。' },
  { tag: '价值闭环', title: '价值闭环卡', desc: '构建从输入到输出的价值链路，确保各环节协同形成正向循环。' },
];

// ===== 拆解逻辑 =====
function decompose() {
  const input = document.getElementById('topicInput').value.trim();
  if (!input) { showToast('请先输入课题内容'); return; }

  const btn = document.getElementById('btnDecompose');
  btn.classList.add('loading');
  btn.textContent = '拆解中...';

  // 模拟 AI 处理延迟
  setTimeout(() => {
    const count = 4 + Math.floor(Math.random() * 2); // 4~5 张卡片
    const canvas = document.getElementById('canvas');
    const rect = canvas.getBoundingClientRect();
    const cols = Math.min(count, 3);
    const cardW = 280, gap = 24;
    const totalW = cols * cardW + (cols - 1) * gap;
    const startX = (rect.width - totalW) / 2;
    const startY = 40;

    for (let i = 0; i < count; i++) {
      const theme = CARD_THEMES[i % CARD_THEMES.length];
      const tmpl = DECOMPOSITION_TEMPLATES[i % DECOMPOSITION_TEMPLATES.length];
      const col = i % cols;
      const row = Math.floor(i / cols);

      const cardData = {
        id: ++cardIdCounter,
        tag: tmpl.tag,
        title: tmpl.title,
        desc: tmpl.desc.replace('课题', `「${input.slice(0, 12)}${input.length > 12 ? '…' : ''}」`),
        theme: theme,
        x: startX + col * (cardW + gap),
        y: startY + row * 200,
        highlighted: false,
      };
      cards.push(cardData);
      createCardElement(cardData, i * 120);
    }

    btn.classList.remove('loading');
    btn.textContent = '⚡ AI 矩阵拆解';
    document.getElementById('canvasHint').classList.add('hidden');
    updateStats();
    saveToStorage();
    showToast(`已生成 ${count} 张拆解卡片`);
  }, 800);
}

// ===== 卡片 DOM 创建 =====
function createCardElement(data, delay) {
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.id = data.id;
  el.style.left = data.x + 'px';
  el.style.top = data.y + 'px';
  el.style.animationDelay = delay + 'ms';
  if (data.highlighted) el.classList.add('highlighted');

  el.innerHTML = `
    <div class="card-stripe" style="background:${data.theme.stripe}"></div>
    <div class="card-header">
      <span class="card-tag" style="background:${data.theme.tag};color:${data.theme.tagText}">${data.tag}</span>
      <div class="card-actions">
        <button class="btn-hl" title="高亮" onclick="toggleHighlight(${data.id})">💡</button>
        <button class="btn-del" title="删除" onclick="deleteCard(${data.id})">✕</button>
      </div>
    </div>
    <div class="card-body">
      <div class="card-title" ondblclick="makeEditable(this)">${data.title}</div>
      <div class="card-desc" ondblclick="makeEditable(this)">${data.desc}</div>
    </div>
  `;

  // 拖拽事件
  el.addEventListener('mousedown', onDragStart);
  el.addEventListener('touchstart', onTouchStart, { passive: false });

  document.getElementById('canvas').appendChild(el);
}

// ===== 拖拽逻辑 =====
function onDragStart(e) {
  if (e.target.closest('.card-actions') || e.target.closest('[contenteditable="true"]')) return;
  const el = e.currentTarget;
  const rect = el.getBoundingClientRect();
  const canvasRect = document.getElementById('canvas').getBoundingClientRect();
  dragState = {
    el, offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top,
    canvasRect, moved: false
  };
  el.classList.add('dragging');
  el.style.zIndex = nextZ();
  e.preventDefault();
}

function onTouchStart(e) {
  if (e.target.closest('.card-actions') || e.target.closest('[contenteditable="true"]')) return;
  const touch = e.touches[0];
  const el = e.currentTarget;
  const rect = el.getBoundingClientRect();
  const canvasRect = document.getElementById('canvas').getBoundingClientRect();
  dragState = {
    el, offsetX: touch.clientX - rect.left, offsetY: touch.clientY - rect.top,
    canvasRect, moved: false
  };
  el.classList.add('dragging');
  el.style.zIndex = nextZ();
  e.preventDefault();
}

document.addEventListener('mousemove', e => {
  if (!dragState) return;
  moveCard(e.clientX, e.clientY);
});
document.addEventListener('touchmove', e => {
  if (!dragState) return;
  moveCard(e.touches[0].clientX, e.touches[0].clientY);
  e.preventDefault();
}, { passive: false });

function moveCard(cx, cy) {
  const { el, offsetX, offsetY, canvasRect } = dragState;
  let x = cx - canvasRect.left - offsetX;
  let y = cy - canvasRect.top - offsetY;
  x = Math.max(0, Math.min(x, canvasRect.width - el.offsetWidth));
  y = Math.max(0, Math.min(y, canvasRect.height - el.offsetHeight));
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  dragState.moved = true;
  // 实时更新数据
  const card = cards.find(c => c.id === +el.dataset.id);
  if (card) { card.x = x; card.y = y; }
}

document.addEventListener('mouseup', endDrag);
document.addEventListener('touchend', endDrag);

function endDrag() {
  if (!dragState) return;
  dragState.el.classList.remove('dragging');
  if (dragState.moved) saveToStorage();
  dragState = null;
}

let zCounter = 10;
function nextZ() { return ++zCounter; }

// ===== 卡片交互 =====
function toggleHighlight(id) {
  const card = cards.find(c => c.id === id);
  if (!card) return;
  card.highlighted = !card.highlighted;
  const el = document.querySelector(`.card[data-id="${id}"]`);
  if (el) el.classList.toggle('highlighted', card.highlighted);
  saveToStorage();
}

function deleteCard(id) {
  const el = document.querySelector(`.card[data-id="${id}"]`);
  if (el) {
    el.style.transition = 'all .3s ease';
    el.style.opacity = '0';
    el.style.transform = 'scale(.85)';
    setTimeout(() => el.remove(), 300);
  }
  cards = cards.filter(c => c.id !== id);
  updateStats();
  saveToStorage();
  if (cards.length === 0) document.getElementById('canvasHint').classList.remove('hidden');
}

function makeEditable(el) {
  el.contentEditable = 'true';
  el.focus();
  // 选中全部文字
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  const finish = () => {
    el.contentEditable = 'false';
    const cardEl = el.closest('.card');
    const card = cards.find(c => c.id === +cardEl.dataset.id);
    if (card) {
      if (el.classList.contains('card-title')) card.title = el.textContent;
      else card.desc = el.textContent;
      saveToStorage();
    }
  };
  el.addEventListener('blur', finish, { once: true });
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); el.blur(); }
  });
}

// ===== 统计 =====
function updateStats() {
  document.getElementById('cardCount').textContent = cards.length;
  document.getElementById('topicCount').textContent = new Set(cards.map(c => c.tag)).size;
}

// ===== Toast =====
function showToast(msg) {
  const container = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  container.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

// ===== 清空 =====
function clearAll() {
  if (cards.length === 0) return;
  document.querySelectorAll('.card').forEach(el => el.remove());
  cards = [];
  cardIdCounter = 0;
  zCounter = 10;
  updateStats();
  saveToStorage();
  document.getElementById('canvasHint').classList.remove('hidden');
  showToast('白板已清空');
}

// ===== LocalStorage =====
function saveToStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ cards, cardIdCounter, zCounter }));
  } catch (e) { /* quota exceeded, ignore */ }
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    cards = data.cards || [];
    cardIdCounter = data.cardIdCounter || 0;
    zCounter = data.zCounter || 10;
    cards.forEach((c, i) => createCardElement(c, i * 60));
    if (cards.length > 0) document.getElementById('canvasHint').classList.add('hidden');
    updateStats();
  } catch (e) { /* corrupt data, ignore */ }
}

// ===== 初始化 =====
loadFromStorage();
</script>
</body>
</html>
