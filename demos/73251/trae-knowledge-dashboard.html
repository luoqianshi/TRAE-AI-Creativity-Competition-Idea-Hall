}

}

function renderBoard(data) {
  const categories = ['行业', '灵感', '实践'];
  for (const cat of categories) {
    const col = $('col-' + cat);
    const countEl = $('count-' + cat);
    const files = data[cat] || [];
    countEl.textContent = files.length;

    // Sort: pinned first, then by date desc
    files.sort(function (a, b) {
      if (a.pinned && !b.pinned) return -1;
      if (!a.pinned && b.pinned) return 1;
      return (b.date || '').localeCompare(a.date || '');
    });

    if (files.length === 0) {
      col.innerHTML = '<div class="card-empty">暂无笔记</div>';
      continue;
    }

    col.innerHTML = files.map(function (f) { return createCardHTML(f, cat); }).join('');
  }

  // Bind card events
  document.querySelectorAll('.card-item').forEach(function (el) {
    el.addEventListener('mousedown', startDrag);
    el.addEventListener('touchstart', startDragTouch, { passive: true });
  });
  document.querySelectorAll('.card-action-btn[data-action="pin"]').forEach(function (el) {
    el.addEventListener('click', togglePin);
  });
  document.querySelectorAll('.card-action-btn[data-action="delete"]').forEach(function (el) {
    el.addEventListener('click', deleteCard);
  });
  document.querySelectorAll('.card-action-btn[data-action="view"]').forEach(function (el) {
    el.addEventListener('click', viewCard);
  });
}

function createCardHTML(file, category) {
  var catClass = category === '行业' ? 'card-item-industry' : category === '灵感' ? 'card-item-idea' : 'card-item-practice';
  var date = file.date || '未知日期';
  var summary = file.summary || '无摘要';
  var pinned = file.pinned ? 'pinned' : '';
  var safeFilename = encodeURIComponent(file.filename);
  var safeCat = encodeURIComponent(category);

  return '<div class="card-item ' + catClass + ' ' + pinned + '" draggable="false"' +
    ' data-category="' + category + '" data-filename="' + file.filename + '"' +
    ' data-title="' + file.title + '">' +
    '<div class="card-title">' + escapeHtml(file.title) + '</div>' +
    '<div class="card-date">' + date + '</div>' +
    '<div class="card-summary">' + escapeHtml(summary) + '</div>' +
    '<div class="card-actions">' +
    '<button class="card-action-btn" data-action="view" data-cat="' + safeCat + '" data-file="' + safeFilename + '">查看</button>' +
    '<button class="card-action-btn" data-action="pin" data-cat="' + safeCat + '" data-file="' + safeFilename + '">' + (file.pinned ? '取消置顶' : '置顶') + '</button>' +
    '<button class="card-action-btn danger" data-action="delete" data-cat="' + safeCat + '" data-file="' + safeFilename + '">删除</button>' +
    '</div></div>';
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

// ========== Drag & Drop ==========
var dragState = null;

function startDrag(e) {
  var card = e.currentTarget;
  dragState = {
    card: card,
    category: card.dataset.category,
    filename: card.dataset.filename,
    startX: e.clientX,
    startY: e.clientY
  };
  card.classList.add('dragging');
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', endDrag);
}

function startDragTouch(e) {
  var touch = e.touches[0];
  var card = e.currentTarget;
  dragState = {
    card: card,
    category: card.dataset.category,
    filename: card.dataset.filename,
    startX: touch.clientX,
    startY: touch.clientY
  };
  document.addEventListener('touchmove', onDragTouch, { passive: true });
  document.addEventListener('touchend', endDragTouch);
}

function onDrag(e) {
  if (!dragState) return;
  var dx = e.clientX - dragState.startX;
  var dy = e.clientY - dragState.startY;
  if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;

  var cols = document.querySelectorAll('.col-body');
  cols.forEach(function (col) {
    var rect = col.getBoundingClientRect();
    if (e.clientX >= rect.left && e.clientX <= rect.right &&
        e.clientY >= rect.top && e.clientY <= rect.bottom) {
      col.classList.add('drag-over');
    } else {
      col.classList.remove('drag-over');
    }
  });
}

function onDragTouch(e) {
  if (!dragState) return;
  var touch = e.touches[0];
  var cols = document.querySelectorAll('.col-body');
  cols.forEach(function (col) {
    var rect = col.getBoundingClientRect();
    if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
        touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
      col.classList.add('drag-over');
    } else {
      col.classList.remove('drag-over');
    }
  });
}

function endDrag(e) {
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup', endDrag);
  if (!dragState) return;

  var cols = document.querySelectorAll('.col-body');
  var targetCategory = null;

  cols.forEach(function (col) {
    col.classList.remove('drag-over');
    var rect = col.getBoundingClientRect();
    if (e.clientX >= rect.left && e.clientX <= rect.right &&
        e.clientY >= rect.top && e.clientY <= rect.bottom) {
      targetCategory = col.closest('.card-col').dataset.category;
    }
  });

  if (targetCategory && targetCategory !== dragState.category) {
    // Move note to new category in localStorage
    var note = allNotes.find(function (n) {
      return n.filename === dragState.filename && n.category === dragState.category;
    });
    if (note) {
      note.category = targetCategory;
      persistNotes();
      showToast('已移动到「' + targetCategory + '」', 'success');
      refreshBoard();
      refreshTodaySummary();
      refreshMonthlyStats();
    }
  }

  dragState.card.classList.remove('dragging');
  dragState = null;
}

function endDragTouch(e) {
  document.removeEventListener('touchmove', onDragTouch);
  document.removeEventListener('touchend', endDragTouch);
  dragState = null;
  document.querySelectorAll('.col-body').forEach(function (c) { c.classList.remove('drag-over'); });
}

// ========== Pin Toggle ==========
function togglePin(e) {
  var btn = e.currentTarget;
  var cat = decodeURIComponent(btn.dataset.cat);
  var file = decodeURIComponent(btn.dataset.file);
  var note = allNotes.find(function (n) { return n.filename === file && n.category === cat; });
  if (note) {
    note.pinned = !note.pinned;
    persistNotes();
    showToast('置顶状态已更新', 'success');
    refreshBoard();
  }

// ========== Delete Card ==========
function deleteCard(e) {
  if (!confirm('确定删除这条笔记吗？')) return;
  var btn = e.currentTarget;
  var cat = decodeURIComponent(btn.dataset.cat);
  var file = decodeURIComponent(btn.dataset.file);
  var idx = allNotes.findIndex(function (n) { return n.filename === file && n.category === cat; });
  if (idx >= 0) {
    allNotes.splice(idx, 1);
    persistNotes();
    showToast('已删除', 'success');
    refreshBoard();
    refreshTodaySummary();
    refreshMonthlyStats();
  }
}

// ========== View Card ==========
function viewCard(e) {
  var btn = e.currentTarget;
  var cat = decodeURIComponent(btn.dataset.cat);
  var file = decodeURIComponent(btn.dataset.file);
  showCardModal(cat, file);
}

function showCardModal(cat, file) {
  var note = allNotes.find(function (n) { return n.filename === file && n.category === cat; });
  if (!note) return;

  var body = (note.rawContent || '').replace(/^---[\s\S]*?---\n?/, '').trim();

  // Parse structured sections
  var sections = [];
  var lines = body.split('\n');
  var currentSection = null;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (line.indexOf('## ') === 0) {
      if (currentSection) sections.push(currentSection);
      currentSection = { title: line.replace('## ', '').trim(), items: [] };
    } else if (currentSection && line.trim()) {
      currentSection.items.push(line.trim());
    }
  }
  if (currentSection) sections.push(currentSection);

  var sectionsHtml = '';
  var sectionOrder = ['一句话概述', '核心概念', '方法/步骤', '启发与应用', '核心观点', '原文结构', '摘要'];
  var ordered = [];
  for (var s = 0; s < sectionOrder.length; s++) {
    for (var si = 0; si < sections.length; si++) {
      if (sections[si].title.indexOf(sectionOrder[s]) >= 0) {
        ordered.push(sections[si]);
        break;
      }
    }
  }
  for (var si2 = 0; si2 < sections.length; si2++) {
    if (ordered.indexOf(sections[si2]) < 0) ordered.push(sections[si2]);
  }

  for (var oi = 0; oi < ordered.length; oi++) {
    var sec = ordered[oi];
    var icon = sec.title.indexOf('概述') >= 0 ? '&#127807;' :
               sec.title.indexOf('概念') >= 0 ? '&#128161;' :
               sec.title.indexOf('方法') >= 0 || sec.title.indexOf('步骤') >= 0 ? '&#128221;' :
               sec.title.indexOf('启发') >= 0 ? '&#127775;' : '&#128204;';
    sectionsHtml += '<div class="modal-section">' +
      '<div class="modal-section-title">' + icon + ' ' + escapeHtml(sec.title) + '</div>' +
      '<div class="modal-section-content">' +
      sec.items.map(function (item) {
        if (item.match(/^\d+\./)) return '<div class="modal-point">' + escapeHtml(item) + '</div>';
        if (item.indexOf('- ') === 0) return '<div class="modal-point">' + escapeHtml(item.substring(2)) + '</div>';
        return '<div>' + escapeHtml(item) + '</div>';
      }).join('') +
      '</div></div>';
  }
  if (!sectionsHtml) {
    sectionsHtml = '<div class="modal-section"><div class="modal-section-content"><div>' + escapeHtml(body).replace(/\n/g, '<br>') + '</div></div></div>';
  }

  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.addEventListener('click', function (e) { if (e.target === overlay) overlay.remove(); });

  var modal = document.createElement('div');
  modal.className = 'modal-box';
  modal.innerHTML = '<div class="modal-header">' +
    '<div class="modal-title">' + escapeHtml(note.title) + '</div>' +
    '<button class="modal-close">&#10005;</button>' +
    '</div>' +
    '<div class="modal-meta">&#128205; ' + cat + ' &nbsp;&#8226;&nbsp; &#128197; ' + (note.date || '未知') + '</div>' +
    '<div class="modal-body">' + sectionsHtml + '</div>';
  modal.querySelector('.modal-close').addEventListener('click', function () { overlay.remove(); });
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

  }
  if (k.steps && k.steps.length > 0) {
    content += '\n\n## 方法/步骤\n' + k.steps.map(function (s, i) { return (i + 1) + '. ' + s; }).join('\n');
  }
  if (k.insights && k.insights.length > 0) {
    content += '\n\n## 启发与应用\n' + k.insights.map(function (ins) { return '- ' + ins; }).join('\n');
  }

  var newNote = {
    id: genId(),
    filename: title.replace(/[^\w\u4e00-\u9fff]/g, '_').substring(0, 50) + '.md',
    title: title,
    summary: summary,
    category: category,
    date: formatDate(Date.now()),
    pinned: false,
    landed: false,
    rawContent: content
  };

  allNotes.push(newNote);
  persistNotes();
  showToast('已保存为笔记', 'success');
  $('urlPreview').classList.add('hidden');
  $('urlInput').value = '';
  window._urlFetchData = null;
  refreshBoard();
  refreshTodaySummary();
  refreshMonthlyStats();
});

// ========== Text Save ==========
$('textSaveBtn').addEventListener('click', function () {
  var title = $('textTitle').value.trim() || '未命名笔记';
  var content = $('textContent').value.trim();
  var category = $('textCategory').value;

  if (!content) { showToast('请输入笔记内容', 'error'); return; }

  var newNote = {
    id: genId(),
    filename: title.replace(/[^\w\u4e00-\u9fff]/g, '_').substring(0, 50) + '.md',
    title: title,
    summary: content.substring(0, 80),
    category: category,
    date: formatDate(Date.now()),
    pinned: false,
    landed: false,
    rawContent: '来源: 笔记\n\n## 一句话概述\n' + content
  };

  allNotes.push(newNote);
  persistNotes();
  showToast('笔记已保存', 'success');
  $('textTitle').value = '';
  $('textContent').value = '';
  refreshBoard();
  refreshTodaySummary();
  refreshMonthlyStats();
});

// ========== Audio Recording (Demo - simulated) ==========
var isRecording = false;
var recordTimerInterval = null;

$('recordBtn').addEventListener('click', function () {
  if (isRecording) {
    stopRecordingDemo();
  } else {
    startRecordingDemo();
  }
});

function startRecordingDemo() {
  isRecording = true;
  $('recordBtn').classList.add('recording');
  $('recordBtnText').textContent = '停止录音';
  $('recordTimer').classList.remove('hidden');
  var secs = 0;
  recordTimerInterval = setInterval(function () {
    secs++;
    $('recordTimer').textContent = String(Math.floor(secs / 60)).padStart(2, '0') + ':' + String(secs % 60).padStart(2, '0');
  }, 1000);
  showToast('Demo模式：录音功能需要麦克风权限，请使用文字笔记录入', 'success');
}

function stopRecordingDemo() {
  isRecording = false;
  $('recordBtn').classList.remove('recording');
  $('recordBtnText').textContent = '开始录音';
  clearInterval(recordTimerInterval);
  $('recordTimer').classList.add('hidden');
}

// Audio file upload (Demo)
$('audioFileInput').addEventListener('change', function () {
  var file = this.files[0];
  if (!file) return;
  $('audioFileName').textContent = file.name;
  showToast('Demo模式：语音转文字功能需要后端服务支持', 'success');
});

// ========== Month Navigation ==========
$('prevMonthBtn').addEventListener('click', function () {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  refreshMonthlyStats();
});

$('nextMonthBtn').addEventListener('click', function () {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  refreshMonthlyStats();
});

// ========== Refresh ==========
$('refreshBoardBtn').addEventListener('click', function () { refreshBoard(); });
$('refreshTodayBtn').addEventListener('click', function () { refreshTodaySummary(); });

// ========== Keyboard shortcut ==========
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    var modal = document.querySelector('.modal-overlay');
    if (modal) modal.remove();
  }
});

// ========== Start ==========
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
