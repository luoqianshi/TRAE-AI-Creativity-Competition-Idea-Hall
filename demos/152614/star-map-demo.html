<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星迹地图：周杰伦嘉年华巡演版</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<!-- ECharts 5 -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
/* ===== 全局重置与基础样式 ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0a0e27;
  color: #e0e0e0;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
body {
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  padding-bottom: 80px;
}

/* ===== 滚动条美化 ===== */
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.4); border-radius: 4px; }

/* ===== 粒子画布 ===== */
#particleCanvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 9999;
}

/* ===== 加载状态 ===== */
.map-loading {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: #8b5cf6;
  font-size: 14px;
  font-weight: 500;
  text-align: center;
  z-index: 5;
}
.map-loading .spinner {
  width: 36px; height: 36px;
  border: 3px solid rgba(139,92,246,0.2);
  border-top-color: #8b5cf6;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Toast 通知 ===== */
.toast-container {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 440px;
  width: 90%;
}
.toast {
  background: rgba(139,92,246,0.95);
  backdrop-filter: blur(12px);
  color: #fff;
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 500;
  box-shadow: 0 4px 20px rgba(139,92,246,0.4);
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
  text-align: center;
  line-height: 1.5;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }

/* ===== 页面切换动画 ===== */
.page { display: none; animation: fadeIn 0.35s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ===== 统计栏 ===== */
.stats-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10,14,39,0.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,215,0,0.15);
  padding: 12px 16px;
  display: flex;
  justify-content: space-around;
  gap: 4px;
}
.stat-item { text-align: center; flex: 1; }
.stat-value {
  font-size: 18px;
  font-weight: 900;
  background: linear-gradient(135deg, #ffd700, #f0c040);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.2;
}
.stat-label {
  font-size: 10px;
  color: #8888aa;
  margin-top: 2px;
}

/* ===== 地图页 ===== */
.map-container {
  position: relative;
  width: 100%;
  height: 520px;
  background: radial-gradient(ellipse at center, #111640 0%, #0a0e27 70%);
  overflow: hidden;
}
#mapChart { width: 100%; height: 100%; }

/* 海外城市卡片 */
.overseas-section { padding: 16px; }
.overseas-title {
  font-size: 14px;
  font-weight: 700;
  color: #ffd700;
  margin-bottom: 12px;
  padding-left: 4px;
}
.overseas-cards {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 8px;
  scroll-snap-type: x mandatory;
}
.overseas-card {
  flex: 0 0 auto;
  width: 145px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 16px 14px;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
  scroll-snap-align: start;
}
.overseas-card::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(255,215,0,0.06) 0%, transparent 60%);
  opacity: 0;
  transition: opacity 0.3s;
}
.overseas-card:hover::before { opacity: 1; }
.overseas-card.unlocked {
  border-color: rgba(255,215,0,0.3);
  background: rgba(255,215,0,0.08);
}
.overseas-card .oc-flag { font-size: 28px; margin-bottom: 8px; }
.overseas-card .oc-name {
  font-size: 14px;
  font-weight: 700;
  color: #e0e0e0;
  margin-bottom: 4px;
}
.overseas-card.unlocked .oc-name { color: #ffd700; }
.overseas-card .oc-venue {
  font-size: 10px;
  color: #8888aa;
  line-height: 1.4;
}
.overseas-card .oc-status {
  font-size: 10px;
  margin-top: 8px;
  color: #4a4a6a;
}
.overseas-card.unlocked .oc-status { color: #ffd700; }

/* ===== Modal 弹窗通用 ===== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  z-index: 5000;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.show { display: flex; animation: modalBgIn 0.3s ease; }
@keyframes modalBgIn { from { opacity: 0; } to { opacity: 1; } }
.modal-content {
  background: #151a3a;
  border-radius: 24px 24px 0 0;
  width: 100%;
  max-width: 480px;
  max-height: 88vh;
  overflow-y: auto;
  padding: 0;
  animation: modalSlideUp 0.35s ease;
  position: relative;
}
@keyframes modalSlideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-close {
  position: absolute;
  top: 16px; right: 16px;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  border: none;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  z-index: 10;
}
.modal-close:hover { background: rgba(255,255,255,0.3); }

/* ===== 城市详情 Modal ===== */
/* 区域1：城市专属海报头部 */
.city-poster {
  position: relative;
  padding: 40px 24px 28px;
  overflow: hidden;
  min-height: 180px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.city-poster .poster-bg {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 0;
}
/* 几何装饰元素 */
.city-poster .deco-circle1 {
  position: absolute;
  width: 200px; height: 200px;
  border-radius: 50%;
  top: -60px; right: -40px;
  background: rgba(255,255,255,0.06);
  z-index: 1;
}
.city-poster .deco-circle2 {
  position: absolute;
  width: 120px; height: 120px;
  border-radius: 50%;
  bottom: -30px; left: -20px;
  background: rgba(255,255,255,0.04);
  z-index: 1;
}
.city-poster .deco-line1 {
  position: absolute;
  top: 20%; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  z-index: 1;
}
.city-poster .deco-line2 {
  position: absolute;
  bottom: 15%; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
  z-index: 1;
}
.city-poster .deco-glow {
  position: absolute;
  top: -20px; left: 30%;
  width: 160px; height: 80px;
  background: radial-gradient(ellipse, rgba(255,255,255,0.12) 0%, transparent 70%);
  filter: blur(20px);
  z-index: 1;
}
.city-poster .poster-content {
  position: relative;
  z-index: 2;
}
.city-poster .poster-city-name {
  font-size: 38px;
  font-weight: 900;
  color: #fff;
  line-height: 1.1;
  margin-bottom: 6px;
  text-shadow: 0 2px 20px rgba(0,0,0,0.3);
}
.city-poster .poster-desc {
  font-size: 14px;
  color: rgba(255,255,255,0.85);
  font-weight: 300;
  margin-bottom: 12px;
  letter-spacing: 1px;
}
.city-poster .poster-info {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.city-poster .poster-date-range {
  font-size: 12px;
  color: rgba(255,255,255,0.7);
  background: rgba(255,255,255,0.1);
  padding: 4px 12px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.15);
}
.city-poster .poster-show-count {
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: rgba(255,255,255,0.15);
  padding: 4px 14px;
  border-radius: 20px;
}
.city-poster .poster-show-count span {
  font-size: 20px;
  font-weight: 900;
}

/* 区域2：城市专属歌单 */
.city-song-section {
  padding: 20px 20px 4px;
}
.city-song-section-title {
  font-size: 13px;
  font-weight: 700;
  color: #8888aa;
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.city-song-pills {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.city-song-pill {
  flex: 0 0 auto;
  padding: 8px 18px;
  border-radius: 24px;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.3s;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 4px;
}
.city-song-pill.unlocked-pill {
  background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(139,92,246,0.2));
  border: 1px solid rgba(255,215,0,0.3);
  color: #ffd700;
}
.city-song-pill.locked-pill {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  color: #4a4a6a;
}

/* 区域3：场次打卡列表 */
.city-shows-section {
  padding: 16px 20px 32px;
}
.city-shows-title {
  font-size: 13px;
  font-weight: 700;
  color: #8888aa;
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.city-venue-info {
  font-size: 12px;
  color: #666;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.show-list { display: flex; flex-direction: column; gap: 8px; }
.show-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: rgba(255,255,255,0.04);
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.06);
  transition: all 0.3s;
}
.show-item:hover { background: rgba(255,255,255,0.07); }
.show-item.checked {
  border-color: rgba(255,215,0,0.2);
  background: rgba(255,215,0,0.06);
}
.show-date { font-size: 14px; font-weight: 500; color: #e0e0e0; }
.show-date .show-year { color: #8888aa; font-size: 11px; margin-left: 6px; font-weight: 400; }
.show-weekday { color: #666; font-size: 11px; font-weight: 400; margin-left: 6px; }
.btn-check {
  padding: 8px 18px;
  border: none;
  border-radius: 24px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  font-family: inherit;
}
.btn-check.available {
  background: linear-gradient(135deg, #8b5cf6, #a78bfa);
  color: #fff;
  box-shadow: 0 2px 12px rgba(139,92,246,0.4);
}
.btn-check.available:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 20px rgba(139,92,246,0.6);
}
.btn-check.done {
  background: rgba(255,215,0,0.15);
  color: #ffd700;
  cursor: default;
}

/* ===== 成就页 ===== */
.achievements-page { padding: 24px 16px; }
.page-section-title {
  font-size: 20px;
  font-weight: 900;
  color: #fff;
  margin-bottom: 20px;
  text-align: center;
}
.achievements-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.achievement-card {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 16px;
  padding: 20px 14px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}
.achievement-card:hover { transform: translateY(-2px); }
.achievement-card.unlocked {
  border-color: rgba(255,215,0,0.3);
  background: linear-gradient(145deg, rgba(255,215,0,0.1), rgba(139,92,246,0.1));
  box-shadow: 0 4px 20px rgba(255,215,0,0.15);
}
.achievement-card.unlocked .ach-icon { animation: achPulse 2s ease-in-out infinite; }
@keyframes achPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}
.ach-icon { font-size: 36px; margin-bottom: 10px; display: block; }
.achievement-card.locked .ach-icon { filter: grayscale(1) opacity(0.35); }
.ach-name {
  font-size: 13px;
  font-weight: 700;
  color: #e0e0e0;
  margin-bottom: 6px;
  line-height: 1.3;
}
.achievement-card.locked .ach-name { color: #666; }
.ach-level {
  font-size: 11px;
  color: #ffd700;
  font-weight: 700;
}
.achievement-card.locked .ach-level { color: #4a4a6a; }
.ach-progress-bar {
  width: 100%;
  height: 4px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  margin-top: 10px;
  overflow: hidden;
}
.ach-progress-fill {
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, #8b5cf6, #ffd700);
  transition: width 0.5s ease;
}

/* 成就详情 Modal */
.ach-modal-inner { padding: 24px 20px 32px; }
.ach-detail-icon { font-size: 48px; margin-bottom: 12px; display: block; text-align: center; }
.ach-detail-title {
  font-size: 20px;
  font-weight: 900;
  color: #ffd700;
  margin-bottom: 6px;
  text-align: center;
}
.ach-detail-desc {
  font-size: 13px;
  color: #aaa;
  line-height: 1.6;
  margin-bottom: 20px;
  text-align: center;
}
.ach-detail-levels { margin-bottom: 16px; }
.ach-detail-level {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: rgba(255,255,255,0.04);
  border-radius: 12px;
  margin-bottom: 8px;
  font-size: 13px;
}
.ach-detail-level.reached {
  background: rgba(255,215,0,0.08);
  border: 1px solid rgba(255,215,0,0.2);
}
.ach-detail-level .lv-label {
  font-weight: 700;
  color: #ffd700;
  min-width: 60px;
}
.ach-detail-level .lv-cond { color: #aaa; flex: 1; }
.ach-detail-level .lv-status { font-weight: 700; font-size: 12px; }
.ach-detail-level.reached .lv-status { color: #4ade80; }
.ach-detail-level.reached::before {
  content: '\2713';
  color: #4ade80;
  font-weight: 900;
  margin-right: 2px;
}

/* ===== 歌单页 ===== */
.songlist-page { padding: 24px 16px; }
.song-progress-section {
  text-align: center;
  margin-bottom: 28px;
}
.song-progress-ring {
  width: 140px; height: 140px;
  margin: 0 auto 16px;
  position: relative;
}
.song-progress-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.song-progress-ring .ring-bg { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 8; }
.song-progress-ring .ring-fill {
  fill: none;
  stroke: url(#ringGrad);
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.8s ease;
}
.song-progress-text {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}
.song-progress-num {
  font-size: 32px;
  font-weight: 900;
  background: linear-gradient(135deg, #ffd700, #f0c040);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
}
.song-progress-label {
  font-size: 11px;
  color: #8888aa;
  margin-top: 4px;
}
.song-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.song-card {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 16px 10px;
  text-align: center;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.song-card:hover { transform: translateY(-1px); }
.song-card.collected {
  border-color: rgba(255,215,0,0.3);
  background: rgba(255,215,0,0.06);
}
.song-card .song-idx {
  font-size: 10px;
  color: #4a4a6a;
  margin-bottom: 6px;
}
.song-card.collected .song-idx { color: #ffd700; }
.song-card .song-name {
  font-size: 13px;
  font-weight: 700;
  color: #666;
  line-height: 1.4;
}
.song-card.collected .song-name { color: #e0e0e0; }
.song-card .song-check {
  position: absolute;
  top: 6px; right: 6px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: #ffd700;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: #0a0e27;
  font-weight: 900;
}
.song-card.collected .song-check { display: flex; }
.song-card .song-mystery {
  font-size: 20px;
  color: #3a3a5a;
  margin-bottom: 4px;
}
.song-card.collected .song-mystery { display: none; }
/* 手动选择模式：歌曲卡片上的勾选圆圈 */
.song-card .song-toggle {
  position: absolute;
  top: 6px; left: 6px;
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: transparent;
  transition: all 0.3s;
  background: transparent;
}
.song-card.collected .song-toggle {
  border-color: #ffd700;
  background: #ffd700;
  color: #0a0e27;
}
.songlist-note {
  text-align: center;
  font-size: 11px;
  color: #666;
  margin-top: 20px;
  line-height: 1.6;
}

/* ===== 数据看板页 ===== */
.dashboard-page { padding: 24px 16px; }
.dash-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 24px;
}
.dash-card {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 16px;
  padding: 20px 16px;
  text-align: center;
}
.dash-card-value {
  font-size: 36px;
  font-weight: 900;
  background: linear-gradient(135deg, #ffd700, #f0c040);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
}
.dash-card-label {
  font-size: 12px;
  color: #8888aa;
  margin-top: 6px;
}
.chart-section {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 16px;
  padding: 20px 16px;
  margin-bottom: 20px;
}
.chart-title {
  font-size: 14px;
  font-weight: 700;
  color: #e0e0e0;
  margin-bottom: 16px;
}
.chart-bars { display: flex; align-items: flex-end; gap: 12px; height: 160px; padding-top: 10px; }
.chart-bar-group {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100%;
  justify-content: flex-end;
}
.chart-bar {
  width: 100%;
  max-width: 50px;

/* ========================================
   数据持久化：localStorage
   ======================================== */

const STORAGE_KEY = 'starMapJayDemo_v2';

function getDefaultData() {
  return {
    checkedShows: [],
    unlockedSongs: [],
    songRequestCount: 0
  };
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      return { ...getDefaultData(), ...d };
    }
  } catch(e) {}
  return getDefaultData();
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let userData = loadData();

/* ========================================
   辅助函数
   ======================================== */

function isShowChecked(cityName, date) {
  return userData.checkedShows.includes(`${cityName}:${date}`);
}

function getUnlockedCities(data) {
  const checked = (data || userData).checkedShows;
  const cityNames = new Set();
  checked.forEach(key => { cityNames.add(key.split(':')[0]); });
  return cities.filter(c => cityNames.has(c.name));
}

function getVenueTypes(data) {
  const checked = (data || userData).checkedShows;
  const venues = new Set();
  checked.forEach(key => {
    const c = cities.find(ci => ci.name === key.split(':')[0]);
    if (c) venues.add(c.venue);
  });
  return [...venues];
}

function checkCrossCity(data) {
  const checked = (data || userData).checkedShows;
  const yearCityMap = {};
  checked.forEach(key => {
    const parts = key.split(':');
    const year = parts[1].split('-')[0];
    if (!yearCityMap[year]) yearCityMap[year] = new Set();
    yearCityMap[year].add(parts[0]);
  });
  let max = 0;
  for (const y in yearCityMap) { if (yearCityMap[y].size > max) max = yearCityMap[y].size; }
  return max;
}

function checkCarnivalWitness(data) {
  const checked = (data || userData).checkedShows;
  let h19 = false, h25 = false;
  checked.forEach(key => {
    const year = key.split(':')[1].split('-')[0];
    if (year === '2019') h19 = true;
    if (year === '2025') h25 = true;
  });
  return (h19 ? 1 : 0) + (h25 ? 1 : 0);
}

function pickRandomSongs(n) {
  const available = songs.filter(s => !userData.unlockedSongs.includes(s));
  const shuffled = available.sort(() => Math.random() - 0.5);
  return shuffled.slice(0, n);
}

// 获取星期几
function getWeekday(dateStr) {
  const days = ['周日','周一','周二','周三','周四','周五','周六'];
  return days[new Date(dateStr).getDay()];
}

// 解析颜色为 rgba（用于渐变生成）
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ========================================
   Toast 通知

function showToast(msg) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');

  document.getElementById(pageId).classList.add('active');

let mapChart = null;
let chinaGeoLoaded = false;

// 加载中国地图 GeoJSON 数据
async function loadChinaMap() {
  const loading = document.getElementById('mapLoading');
  try {
    const resp = await fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json');
    if (!resp.ok) throw new Error('GeoJSON 加载失败');
    const geoJson = await resp.json();
    echarts.registerMap('china', geoJson);
    chinaGeoLoaded = true;
    loading.style.display = 'none';
    renderMapPage();
  } catch(err) {
    loading.innerHTML = '<div style="color:#e74c3c;font-size:12px;">地图数据加载失败，请刷新重试</div>';
    console.error('中国地图加载失败:', err);
  }
}

/* ========================================
   打卡逻辑
   ======================================== */
function checkShow(cityName, date) {
  const key = `${cityName}:${date}`;
  if (userData.checkedShows.includes(key)) return;

  // 判断是否为新城市
  const prevCities = new Set();
  userData.checkedShows.forEach(k => prevCities.add(k.split(':')[0]));
  const isNewCity = !prevCities.has(cityName);

  // 添加打卡记录
  userData.checkedShows.push(key);

  // 随机解锁5首歌曲
  const newSongs = pickRandomSongs(5);
  newSongs.forEach(s => {
    if (!userData.unlockedSongs.includes(s)) {
      userData.unlockedSongs.push(s);
    }
  });

  // 保存
  saveData(userData);

  // 检查成就
  const newAch = checkAchievements();

  // Toast
  let toastMsg = `✅ 成功打卡 ${cityName} ${date}`;
  if (isNewCity) toastMsg += `<br>🌟 新城市解锁！`;
  if (newSongs.length > 0) {
    toastMsg += `<br>🎵 解锁歌曲：${newSongs.join('、')}`;
  }
  showToast(toastMsg);

  // 重新渲染当前 Modal
  const city = cities.find(c => c.name === cityName);
  if (city) openCityModal(city);

  // 更新地图和统计
  renderMapPage();
}

/* ========================================
   页面2：成就页
   ======================================== */
function renderAchievementsPage() {
  const grid = document.getElementById('achievementsGrid');
  grid.innerHTML = '';

  achievementDefs.forEach(ach => {
    const progress = ach.getProgress(userData);
    const maxThreshold = Math.max(...ach.levels.map(l => l.threshold));
    const reachedLevel = getReachedLevel(ach);
    const isUnlocked = reachedLevel > 0;
    const pct = Math.min(progress / maxThreshold * 100, 100);

    const card = document.createElement('div');
    card.className = `achievement-card ${isUnlocked ? 'unlocked' : 'locked'}`;
    card.innerHTML = `
      <span class="ach-icon">${ach.icon}</span>
      <div class="ach-name">${ach.name}</div>
      <div class="ach-level">${isUnlocked ? ach.levels[reachedLevel - 1].label + ' 已解锁' : '未解锁'}</div>
      <div class="ach-progress-bar">
        <div class="ach-progress-fill" style="width:${pct}%"></div>
      </div>
    `;
    card.onclick = () => openAchDetail(ach);
    grid.appendChild(card);
  });
}

function getReachedLevel(ach) {
  const progress = ach.getProgress(userData);
  let reached = 0;
  ach.levels.forEach(lv => {
    if (progress >= lv.threshold) reached = ach.levels.indexOf(lv) + 1;
  });
  return reached;
}

function openAchDetail(ach) {
  const body = document.getElementById('achModalBody');
  const progress = ach.getProgress(userData);
  const reachedLevel = getReachedLevel(ach);
  const isUnlocked = reachedLevel > 0;

  let html = `
    <div class="ach-modal-inner">
      <div class="ach-detail-icon">${ach.icon}</div>
      <div class="ach-detail-title">${ach.name}</div>
      <div class="ach-detail-desc">${ach.desc}</div>
      <div class="ach-detail-levels">
  `;
  ach.levels.forEach((lv, i) => {
    const reached = progress >= lv.threshold;
    html += `
      <div class="ach-detail-level ${reached ? 'reached' : ''}">
        <span class="lv-label">${lv.label}</span>
        <span class="lv-cond">${lv.cond}</span>
        <span class="lv-status">${reached ? '已达成' : `进度 ${Math.min(progress, lv.threshold)}/${lv.threshold}`}</span>
      </div>
    `;
  });
  html += '</div>';

  // "点歌幸运儿"手动标记按钮
  if (ach.id === 'songRequest') {
    html += `
      <button class="btn-check available" style="display:block;margin:16px auto;padding:12px 32px;font-size:14px;"
        onclick="markSongRequest()">
        ${userData.songRequestCount > 0 ? '✓ 已标记点歌经历' : '🎤 标记点歌经历'}
      </button>
    `;
  }

  html += '</div>';
  body.innerHTML = html;
  openModal('achModal');
}

function markSongRequest() {
  if (userData.songRequestCount === 0) {
    userData.songRequestCount = 1;
    saveData(userData);
    showToast('🎤 成功标记点歌经历！');
    checkAchievements();
    openAchDetail(achievementDefs.find(a => a.id === 'songRequest'));
  }
}

/* ========================================
   成就检测
   ======================================== */
function checkAchievements() {
  const newlyUnlocked = [];
  const prevState = {};
  achievementDefs.forEach(ach => { prevState[ach.id] = getReachedLevel(ach); });

  achievementDefs.forEach(ach => {
    const currentLevel = getReachedLevel(ach);
    if (currentLevel > prevState[ach.id]) {
      newlyUnlocked.push({
        name: ach.name,
        icon: ach.icon,
        level: ach.levels[currentLevel - 1].label
      });
    }
  });

  if (newlyUnlocked.length > 0) {
    newlyUnlocked.forEach(a => {
      showToast(`🏆 成就解锁：${a.icon} ${a.name} ${a.level}`);
    });
    triggerFireworks();
  }

  renderAchievementsPage();
  return newlyUnlocked;
}

/* ========================================

function toggleSong(songName) {
  const idx = userData.unlockedSongs.indexOf(songName);
  if (idx >= 0) {
    // 取消解锁
    userData.unlockedSongs.splice(idx, 1);
    showToast(`🔇 已取消收集「${songName}」`);
  } else {
    // 手动解锁
    userData.unlockedSongs.push(songName);
    showToast(`🎵 已收集「${songName}」现场版`);
    triggerFireworks();
  }
  saveData(userData);
  // 刷新歌单页和成就
  renderSonglistPage();
  renderStatsBar();
  checkAchievements();
}

function renderSonglistPage() {
  const count = userData.unlockedSongs.length;

  document.getElementById('songProgressNum').textContent = count;

  const grid = document.getElementById('songGrid');

      <div class="song-idx">#${String(i + 1).padStart(2, '0')}</div>
      <div class="song-name">${song}</div>

    grid.appendChild(card);
  });
}

  const barsContainer = document.getElementById('chartBars');
  barsContainer.innerHTML = '';
  years.forEach(year => {
    const count = yearCounts[year] || 0;
    const heightPct = (count / maxCount) * 100;
    const group = document.createElement('div');
    group.className = 'chart-bar-group';
    group.innerHTML = `
      <div class="chart-bar-value">${count}</div>
      <div class="chart-bar" style="height:${Math.max(heightPct, 3)}%"></div>
      <div class="chart-bar-label">${year}</div>
    `;
    barsContainer.appendChild(group);
  });
}

/* ========================================
   烟花粒子效果
   ======================================== */
const particleCanvas = document.getElementById('particleCanvas');
const pCtx = particleCanvas.getContext('2d');
let particles = [];
let animating = false;

function resizeParticleCanvas() {
  particleCanvas.width = window.innerWidth;
  particleCanvas.height = window.innerHeight;
}
resizeParticleCanvas();
window.addEventListener('resize', resizeParticleCanvas);

function triggerFireworks() {
  const colors = ['#ffd700', '#ff6b6b', '#8b5cf6', '#4ade80', '#60a5fa', '#f59e0b', '#ec4899'];
  for (let burst = 0; burst < 3; burst++) {
    const cx = Math.random() * particleCanvas.width;
    const cy = Math.random() * particleCanvas.height * 0.5 + 50;
    for (let i = 0; i < 40; i++) {
      const angle = (Math.PI * 2 / 40) * i + Math.random() * 0.3;
      const speed = 2 + Math.random() * 4;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.01 + Math.random() * 0.015,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: 2 + Math.random() * 3,
        delay: burst * 12
      });
    }
  }
  if (!animating) { animating = true; animateParticles(); }
}

function animateParticles() {
  pCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
  particles = particles.filter(p => {
    if (p.delay > 0) { p.delay--; return true; }
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life -= p.decay;
    if (p.life <= 0) return false;
    pCtx.globalAlpha = p.life;
    pCtx.fillStyle = p.color;
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    pCtx.fill();
    return true;
  });
  pCtx.globalAlpha = 1;
  if (particles.length > 0) {
    requestAnimationFrame(animateParticles);
  } else {
    animating = false;
    pCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
  }
}
