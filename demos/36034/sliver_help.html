<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>银龄帮 — 老年人简易助老服务小程序 | 创意方案演示</title>
  <style>
    :root {
      --primary: #FF6B35;
      --primary-dark: #E55A2B;
      --danger: #E74C3C;
      --success: #27AE60;
      --info: #3498DB;
      --bg: #FFF8F4;
      --card-bg: #FFFFFF;
      --text: #2C3E50;
      --text-light: #5D6D7E;
      --text-lighter: #95A5A6;
      --border: #F0E8E0;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      --radius: 24px;
      --radius-sm: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #FFF5EE 0%, #FFE8D9 30%, #FFF0E5 60%, #FFF5EE 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* ========== 手机外壳 ========== */
    .phone-frame {
      width: 420px;
      max-width: 100%;
      background: #1a1a2e;
      border-radius: 40px;
      padding: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 0 2px #333;
      position: relative;
    }

    .phone-screen {
      background: var(--bg);
      border-radius: 30px;
      overflow: hidden;
      min-height: 750px;
      position: relative;
    }

    /* ========== 状态栏 ========== */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .status-bar .time {
      font-size: 18px;
      font-weight: 700;
    }

    .status-icons {
      display: flex;
      gap: 6px;
      font-size: 14px;
    }

    /* ========== 头部 ========== */
    .app-header {
      text-align: center;
      padding: 16px 24px 8px;
    }

    .app-header .greeting {
      font-size: 20px;
      color: var(--text-light);
      margin-bottom: 2px;
    }

    .app-header .user-name {
      font-size: 36px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 2px;
    }

    /* ========== 语音按钮 ========== */
    .voice-bar {
      margin: 12px 20px;
      background: var(--card-bg);
      border-radius: 50px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
    }

    .voice-bar:active {
      border-color: var(--primary);
      background: #FFF5EE;
    }

    .voice-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #FF6B35, #FF8C5A);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #FFF;
      flex-shrink: 0;
      animation: pulse-voice 2s infinite;
    }

    @keyframes pulse-voice {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(255, 107, 53, 0.4);
      }

      50% {
        box-shadow: 0 0 0 12px rgba(255, 107, 53, 0);
      }
    }

    .voice-text {
      font-size: 22px;
      color: var(--text-light);
      font-weight: 500;
      flex: 1;
    }

    .voice-wave {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 28px;
    }

    .voice-wave span {
      width: 3px;
      background: var(--primary);
      border-radius: 2px;
      animation: wave 1.2s infinite ease-in-out;
    }

    .voice-wave span:nth-child(1) {
      height: 12px;
      animation-delay: 0s;
    }

    .voice-wave span:nth-child(2) {
      height: 20px;
      animation-delay: 0.1s;
    }

    .voice-wave span:nth-child(3) {
      height: 28px;
      animation-delay: 0.2s;
    }

    .voice-wave span:nth-child(4) {
      height: 16px;
      animation-delay: 0.3s;
    }

    .voice-wave span:nth-child(5) {
      height: 10px;
      animation-delay: 0.4s;
    }

    @keyframes wave {

      0%,
      100% {
        transform: scaleY(1);
      }

      50% {
        transform: scaleY(0.4);
      }
    }

    /* ========== SOS 按钮 ========== */
    .sos-section {
      margin: 16px 20px;
      text-align: center;
    }

    .sos-btn {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .sos-btn:active {
      transform: scale(0.92);
    }

    .sos-circle {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #E74C3C, #FF5252);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 30px rgba(231, 76, 60, 0.5);
      animation: sos-pulse 1.5s infinite;
      position: relative;
    }

    @keyframes sos-pulse {

      0%,
      100% {
        box-shadow: 0 6px 30px rgba(231, 76, 60, 0.5);
      }

      50% {
        box-shadow: 0 6px 50px rgba(231, 76, 60, 0.8), 0 0 0 12px rgba(231, 76, 60, 0.15);
      }
    }

    .sos-circle .sos-text {
      font-size: 28px;
      font-weight: 900;
      color: #FFF;
      letter-spacing: 4px;
      z-index: 1;
    }

    .sos-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.4);
      animation: ring-expand 1.5s infinite;
    }

    @keyframes ring-expand {
      0% {
        transform: scale(1);
        opacity: 0.6;
      }

      100% {
        transform: scale(1.3);
        opacity: 0;
      }
    }

    .sos-label {
      font-size: 20px;
      font-weight: 700;
      color: var(--danger);
    }

    .sos-sub {
      font-size: 16px;
      color: var(--text-lighter);
      margin-top: -4px;
    }

    /* ========== 功能卡片区 ========== */
    .section-title {
      padding: 0 24px;
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin: 8px 0 12px;
    }

    .service-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 0 20px;
      margin-bottom: 12px;
    }

    .service-card {
      background: var(--card-bg);
      border-radius: var(--radius-sm);
      padding: 20px 16px;
      text-align: center;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
    }

    .service-card:hover {
      border-color: var(--primary);
    }

    .service-card:active {
      transform: scale(0.95);
      background: #FFF5EE;
    }

    .service-icon {
      font-size: 48px;
      margin-bottom: 10px;
      display: block;
    }

    .service-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }

    .service-desc {
      font-size: 16px;
      color: var(--text-light);
      margin-top: 4px;
    }

    .service-card.sos-card {
      background: linear-gradient(135deg, #FFF5F5, #FFF0F0);
      border-color: #FFCDD2;
    }

    /* ========== 健康记录区 ========== */
    .health-section {
      margin: 0 20px 20px;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .health-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .health-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }

    .health-weekly {
      font-size: 18px;
      color: var(--info);
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .health-inputs {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .health-input-group {
      flex: 1;
      min-width: 130px;
    }

    .health-label {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .health-input {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #F8F5F2;
      border-radius: 12px;
      padding: 12px 16px;
      border: 2px solid var(--border);
    }

    .health-input input {
      border: none;
      background: transparent;
      font-size: 28px;
      font-weight: 700;
      width: 80px;
      color: var(--text);
      outline: none;
      font-family: inherit;
    }

    .health-input .unit {
      font-size: 20px;
      color: var(--text-light);
      font-weight: 500;
    }

    .health-save-btn {
      width: 100%;
      margin-top: 14px;
      padding: 16px;
      background: linear-gradient(135deg, #27AE60, #2ECC71);
      color: #FFF;
      border: none;
      border-radius: 16px;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
    }

    .health-save-btn:active {
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(39, 174, 96, 0.3);
    }

    /* ========== 底部导航 ========== */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 10px 20px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-lighter);
      transition: color 0.2s;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-item .nav-icon {
      font-size: 26px;
    }

    /* ========== 弹窗 ========== */
    .modal-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 10;
      border-radius: 30px;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-box {
      background: #FFF;
      border-radius: var(--radius);
      padding: 30px 24px;
      width: 85%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: modal-pop 0.3s ease-out;
    }

    @keyframes modal-pop {
      from {
        transform: scale(0.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .modal-icon {
      font-size: 72px;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }

    .modal-text {
      font-size: 20px;
      color: var(--text-light);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .modal-close {
      padding: 14px 40px;
      background: var(--primary);
      color: #FFF;
      border: none;
      border-radius: 50px;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 2px;
    }

    .modal-close:active {
      background: var(--primary-dark);
    }

    /* ========== 周报模态 ========== */
    .report-table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 18px;
    }

    .report-table th {
      background: #F8F5F2;
      padding: 10px 8px;
      font-weight: 700;
      color: var(--text);
      border-bottom: 2px solid var(--border);
    }

    .report-table td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
      color: var(--text-light);
    }

    .report-table .alert {
      color: var(--danger);
      font-weight: 700;
    }

    /* ========== Toast ========== */
    .toast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(0, 0, 0, 0.85);
      color: #FFF;
      padding: 24px 36px;
      border-radius: 16px;
      font-size: 24px;
      font-weight: 700;
      z-index: 20;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      letter-spacing: 2px;
    }

    .toast.show {
      transform: translate(-50%, -50%) scale(1);
    }

    /* ========== 响应式 ========== */
    @media (max-width: 460px) {
      .phone-frame {
        border-radius: 0;
        padding: 0;
        box-shadow: none;
        background: transparent;
      }

      .phone-screen {
        border-radius: 0;
        min-height: 100vh;
      }

      .modal-overlay {
        border-radius: 0;
      }
    }

    /* ========== 无障碍：偏好减少动画 ========== */
    @media (prefers-reduced-motion: reduce) {

      .sos-circle,
      .voice-icon,
      .voice-wave span,
      .sos-ring {
        animation: none !important;
      }
    }
  </style>
</head>

<body>

  <!-- ========== 手机外壳 ========== -->
  <div class="phone-frame">
    <div class="phone-screen" id="appRoot">

      <!-- 状态栏 -->
      <div class="status-bar">
        <span class="time">9:41</span>
        <span class="status-icons">🔋 100% 📶 WiFi</span>
      </div>

      <!-- 头部 -->
      <div class="app-header">
        <div class="greeting">👋 上午好</div>
        <div class="user-name">张爷爷</div>
      </div>

      <!-- 语音输入 -->
      <div class="voice-bar" onclick="showToast('🎤 正在聆听…')" title="点击语音输入">
        <div class="voice-icon">🎤</div>
        <div class="voice-text">按住说话，语音操作</div>
        <div class="voice-wave">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <!-- SOS 紧急呼叫 -->
      <div class="sos-section">
        <div class="sos-btn" onclick="showModal('sos')" title="一键呼叫紧急联系人">
          <div class="sos-circle">
            <span class="sos-text">SOS</span>
            <div class="sos-ring"></div>
          </div>
          <div class="sos-label">一键紧急呼叫</div>
          <div class="sos-sub">点击拨打子女或社区人员</div>
        </div>
      </div>

      <!-- 社区服务预约 -->
      <div class="section-title">🏠 社区上门服务</div>
      <div class="service-grid">
        <div class="service-card" onclick="showModal('haircut')">
          <span class="service-icon">💇</span>
          <div class="service-name">上门理发</div>
          <div class="service-desc">预约理发师上门</div>
        </div>
        <div class="service-card" onclick="showModal('medicine')">
          <span class="service-icon">💊</span>
          <div class="service-name">代买药品</div>
          <div class="service-desc">社区人员代购送药</div>
        </div>
        <div class="service-card" onclick="showModal('repair')">
          <span class="service-icon">🔧</span>
          <div class="service-name">家电维修</div>
          <div class="service-desc">专业师傅上门修</div>
        </div>
        <div class="service-card" onclick="showModal('more')">
          <span class="service-icon">📞</span>
          <div class="service-name">更多服务</div>
          <div class="service-desc">电话联系社区</div>
        </div>
      </div>

      <!-- 健康记录 -->
      <div class="health-section">
        <div class="health-header">
          <span class="health-title">❤️ 健康记录</span>
          <span class="health-weekly" onclick="showReportModal()">📊 查看周报</span>
        </div>
        <div class="health-inputs">
          <div class="health-input-group">
            <div class="health-label">💓 收缩压</div>
            <div class="health-input">
              <input type="number" id="systolic" value="128" placeholder="120" aria-label="收缩压">
              <span class="unit">mmHg</span>
            </div>
          </div>
          <div class="health-input-group">
            <div class="health-label">💓 舒张压</div>
            <div class="health-input">
              <input type="number" id="diastolic" value="82" placeholder="80" aria-label="舒张压">
              <span class="unit">mmHg</span>
            </div>
          </div>
          <div class="health-input-group">
            <div class="health-label">🩸 血糖</div>
            <div class="health-input">
              <input type="number" id="glucose" value="5.8" step="0.1" placeholder="5.5" aria-label="血糖">
              <span class="unit">mmol/L</span>
            </div>
          </div>
        </div>
        <button class="health-save-btn" onclick="saveHealth()">✅ 保存记录</button>
      </div>

      <!-- 底部导航 -->
      <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab(this)">
          <span class="nav-icon">🏠</span> 首页
        </div>
        <div class="nav-item" onclick="switchTab(this)">
          <span class="nav-icon">💬</span> 消息
        </div>
        <div class="nav-item" onclick="switchTab(this)">
          <span class="nav-icon">👤</span> 我的
        </div>
      </div>

      <!-- ========== 模态弹窗容器 ========== -->
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" id="modalBox">
          <div class="modal-icon" id="modalIcon"></div>
          <div class="modal-title" id="modalTitle"></div>
          <div class="modal-text" id="modalText"></div>
          <button class="modal-close" onclick="closeModal()">我知道了</button>
        </div>
      </div>

      <!-- Toast -->
      <div class="toast" id="toast"></div>

    </div>
  </div>

  <!-- ========== 创意方案说明卡片（手机下方） ========== -->
  <div style="max-width:420px;margin:20px auto;text-align:center;color:#5D6D7E;font-size:14px;line-height:1.8;">
    <p style="font-size:18px;font-weight:700;color:#2C3E50;">银龄帮 — 创意方案演示 v1.0</p>
    <p>赛道：社会服务 · 社会公益 | 适老化小程序创意方案</p>
    <p style="font-size:12px;color:#95A5A6;">💡 点击页面中的各个按钮体验交互原型</p>
  </div>

  <script>
    // ========== 服务弹窗内容配置 ==========
    const modalConfig = {
      sos: {
        icon: '🆘',
        title: '正在呼叫紧急联系人…',
        text: '已自动拨打 儿子 · 张建国<br>手机号 138****6789<br><br>同时已通知社区服务站<br>预计 5 分钟内响应<br><br>📞 请保持电话畅通'
      },
      haircut: {
        icon: '💇',
        title: '预约上门理发',
        text: '✅ 预约已提交！<br><br>服务类型：上门理发<br>预计上门时间：今天下午 2:00–4:00<br>服务人员：李师傅（社区认证）<br>费用：15 元 / 次<br><br>社区服务站电话：010-12345678'
      },
      medicine: {
        icon: '💊',
        title: '预约代买药品',
        text: '✅ 预约已提交！<br><br>服务类型：代买药品<br>社区工作人员将上门取处方<br>预计 1 小时内送药到家<br>服务费：免费（社区公益）<br><br>如有急需，请拨打社区电话'
      },
      repair: {
        icon: '🔧',
        title: '预约家电维修',
        text: '✅ 预约已提交！<br><br>服务类型：家电维修<br>请简要描述故障问题<br>维修师傅将电话联系确认<br>上门费：30 元（免收上门检测费）<br><br>预计 24 小时内上门'
      },
      more: {
        icon: '📞',
        title: '更多社区服务',
        text: '🏥 陪同就医<br>🧹 上门保洁<br>🍲 助餐送餐<br>🚗 代叫出行<br>📦 代取快递<br><br>请拨打社区服务热线：<br>☎️ 010-12345678<br><br>或语音说出您需要的服务'
      }
    };

    // ========== 显示弹窗 ==========
    function showModal(type) {
      const cfg = modalConfig[type];
      if (!cfg) return;
      document.getElementById('modalIcon').textContent = cfg.icon;
      document.getElementById('modalTitle').textContent = cfg.title;
      document.getElementById('modalText').innerHTML = cfg.text;
      document.getElementById('modalOverlay').classList.add('show');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('show');
    }

    // 点击遮罩关闭
    document.getElementById('modalOverlay').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });

    // ========== Toast ==========
    let toastTimer;
    function showToast(msg, duration = 1800) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
    }

    // 语音条点击也触发 Toast
    document.querySelector('.voice-bar').addEventListener('click', function () {
      showToast('🎤 正在聆听…');
    });

    // ========== 底部导航切换 ==========
    function switchTab(el) {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      el.classList.add('active');
      showToast('页面跳转中…（演示版仅展示首页）', 1500);
    }

    // ========== 健康记录保存 ==========
    function saveHealth() {
      const systolic = document.getElementById('systolic').value;
      const diastolic = document.getElementById('diastolic').value;
      const glucose = document.getElementById('glucose').value;
      showToast('✅ 健康数据已保存！');
      console.log('健康记录：', { systolic, diastolic, glucose, time: new Date().toISOString() });

      // 模拟数据存储
      const record = {
        date: new Date().toLocaleDateString('zh-CN'),
        systolic,
        diastolic,
        glucose,
      };
      const records = JSON.parse(localStorage.getItem('health_records') || '[]');
      records.push(record);
      localStorage.setItem('health_records', JSON.stringify(records.slice(-30)));
    }

    // ========== 健康周报弹窗（支持 Esc 关闭） ==========
    function showReportModal() {
      const records = JSON.parse(localStorage.getItem('health_records') || '[]');
      let tableRows = '';

      if (records.length === 0) {
        // 演示数据
        const demos = [
          { date: '周一', systolic: 130, diastolic: 85, glucose: 6.2 },
          { date: '周二', systolic: 126, diastolic: 80, glucose: 5.5 },
          { date: '周三', systolic: 128, diastolic: 82, glucose: 5.8 },
          { date: '周四', systolic: 135, diastolic: 88, glucose: 6.5 },
          { date: '周五', systolic: 124, diastolic: 78, glucose: 5.3 },
          { date: '周六', systolic: 132, diastolic: 84, glucose: 5.9 },
          { date: '周日', systolic: 127, diastolic: 81, glucose: 5.6 },
        ];
        demos.forEach(d => {
          const sysClass = d.systolic > 130 ? 'alert' : '';
          const gluClass = d.glucose > 6.0 ? 'alert' : '';
          tableRows += `<tr><td>${d.date}</td><td class="${sysClass}">${d.systolic}/${d.diastolic}</td><td class="${gluClass}">${d.glucose}</td></tr>`;
        });
      } else {
        records.forEach(r => {
          tableRows += `<tr><td>${r.date}</td><td>${r.systolic}/${r.diastolic}</td><td>${r.glucose}</td></tr>`;
        });
      }

      document.getElementById('modalIcon').textContent = '📊';
      document.getElementById('modalTitle').textContent = '本周健康周报';
      document.getElementById('modalText').innerHTML = `
      <table class="report-table">
        <thead><tr><th>日期</th><th>血压 (mmHg)</th><th>血糖 (mmol/L)</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
      <p style="text-align:left;font-size:16px;color:#27AE60;">
        💡 <strong>AI 健康小结：</strong>本周血压基本平稳，周四略偏高，建议注意休息。血糖整体正常范围。
      </p>
      <p style="text-align:left;font-size:14px;color:#95A5A6;">
        📨 本周报已自动发送给子女 张建国
      </p>
    `;
      document.getElementById('modalOverlay').classList.add('show');
    }

    // ========== 键盘快捷键 ==========
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeModal();
    });

    // ========== 首次加载提示 ==========
    console.log('👴 银龄帮 — 老年人简易助老服务小程序 创意方案');
    console.log('赛道：社会服务 + 社会公益');
    console.log('核心功能：语音输入 | SOS紧急呼叫 | 社区上门预约 | 健康记录周报');
    console.log('💡 点击手机屏幕上的按钮体验交互原型');
  </script>
</body>

</html>
