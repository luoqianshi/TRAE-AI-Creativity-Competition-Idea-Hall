<!DOCTYPE html>
<html lang="zh-CN" class="mini-program">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>对话分析 - 家教助手</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Page-specific styles */
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-page);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .page-container {
      width: 100%;
      max-width: 375px;
      min-height: 100vh;
      background-color: var(--bg-page);
      position: relative;
      padding-bottom: 80px;
      overflow-x: hidden;
    }

    /* Status bar spacer for mini-program feel */
    .status-bar-spacer {
      height: 44px;
      background-color: var(--color-primary);
    }

    /* Navigation bar */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--color-primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-4);
      height: 44px;
    }

    .nav-bar .nav-back {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: background-color var(--transition-fast);
    }

    .nav-bar .nav-back:hover {
      background-color: rgba(255, 255, 255, 0.15);
    }

    .nav-bar .nav-back svg {
      width: 20px;
      height: 20px;
      stroke: white;
      stroke-width: 2.5;
      fill: none;
    }

    .nav-bar .nav-title {
      font-size: var(--font-size-lg);
      font-weight: var(--weight-semibold);
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .nav-bar .nav-action {
      font-size: var(--font-size-sm);
      font-weight: var(--weight-regular);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      transition: background-color var(--transition-fast);
    }

    .nav-bar .nav-action:hover {
      background-color: rgba(255, 255, 255, 0.15);
    }

    /* Contact selector */
    .contact-card {
      background-color: var(--color-primary-lighter);
      border-left: 3px solid var(--color-primary);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      padding: var(--space-4);
      cursor: pointer;
      transition: background-color var(--transition-fast);
    }

    .contact-card:hover {
      background-color: var(--color-primary-100);
    }

    .contact-avatar {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-full);
      background-color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: var(--font-size-xl);
      font-weight: var(--weight-semibold);
      flex-shrink: 0;
    }

    .contact-info {
      flex: 1;
      margin-left: var(--space-3);
    }

    .contact-name {
      font-size: var(--font-size-base);
      font-weight: var(--weight-semibold);
      color: var(--text-primary);
    }

    .contact-subtitle {
      font-size: var(--font-size-xs);
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .contact-arrow {
      width: 20px;
      height: 20px;
      stroke: var(--text-tertiary);
      stroke-width: 2;
      fill: none;
      flex-shrink: 0;
      margin-left: var(--space-2);
    }

    /* Import button */
    .import-btn {
      width: 100%;
      background-color: var(--color-primary);
      color: white;
      border: none;
      border-radius: var(--radius-lg);
      padding: var(--space-4) var(--space-5);
      font-size: var(--font-size-base);
      font-weight: var(--weight-semibold);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      transition: background-color var(--transition-fast);
      box-shadow: var(--shadow-sm);
      font-family: var(--font-family);
    }

    .import-btn:hover {
      background-color: var(--color-primary-hover);
    }

    .import-btn:active {
      background-color: var(--color-primary-800);
      transform: scale(0.98);
    }

    .import-btn svg {
      width: 20px;
      height: 20px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    /* Section title */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-3);
    }

    .section-title {
      font-size: var(--font-size-lg);
      font-weight: var(--weight-semibold);
      color: var(--text-primary);
    }

    .status-badge-count {
      font-size: var(--font-size-xs);
      font-weight: var(--weight-medium);
      color: var(--color-primary);
      background-color: var(--color-primary-light);
      padding: 2px 10px;
      border-radius: var(--radius-full);
    }

    /* Analysis cards */
    .analysis-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-3);
      box-shadow: var(--shadow-xs);
    }

    .analysis-card-header {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
      padding-bottom: var(--space-3);
      border-bottom: 1px solid var(--border-default);
    }

    .analysis-card-header .dot {
      width: 10px;
      height: 10px;
      border-radius: var(--radius-full);
      flex-shrink: 0;
    }

    .dot-blue { background-color: var(--color-primary); }
    .dot-green { background-color: var(--state-success); }
    .dot-amber { background-color: var(--state-warning); }

    .analysis-card-header .card-title {
      font-size: var(--font-size-base);
      font-weight: var(--weight-semibold);
      color: var(--text-primary);
    }

    /* Item row */
    .item-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--neutral-100, #F3F4F6);
      gap: var(--space-2);
    }

    .item-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .item-row:first-of-type {
      padding-top: 0;
    }

    .item-content {
      flex: 1;
      font-size: var(--font-size-sm);
      color: var(--text-primary);
      line-height: var(--line-height-relaxed);
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-shrink: 0;
    }

    /* Badges */
    .badge {
      font-size: var(--font-size-xs);
      font-weight: var(--weight-medium);
      padding: 2px 10px;
      border-radius: var(--radius-full);
      white-space: nowrap;
    }

    .badge-success {
      color: var(--state-success);
      background-color: var(--state-success-light);
    }

    .badge-warning {
      color: var(--state-warning);
      background-color: var(--state-warning-light);
    }

    .badge-info {
      color: var(--state-info);
      background-color: var(--state-info-light);
    }

    /* Edit icon */
    .edit-icon {
      width: 16px;
      height: 16px;
      stroke: var(--text-tertiary);
      stroke-width: 2;
      fill: none;
      cursor: pointer;
      flex-shrink: 0;
    }

    .edit-icon:hover {
      stroke: var(--color-primary);
    }

    /* Bottom action bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 375px;
      background-color: var(--bg-card);
      border-top: 1px solid var(--border-default);
      padding: var(--space-3) var(--space-4);
      display: flex;
      gap: var(--space-3);
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.04);
      z-index: 100;
    }

    .btn-primary {
      flex: 1;
      background-color: var(--color-primary);
      color: white;
      border: none;
      border-radius: var(--radius-lg);
      padding: var(--space-3) var(--space-4);
      font-size: var(--font-size-sm);
      font-weight: var(--weight-semibold);
      cursor: pointer;
      transition: background-color var(--transition-fast);
      font-family: var(--font-family);
    }

    .btn-primary:hover {
      background-color: var(--color-primary-hover);
    }

    .btn-primary:active {
      background-color: var(--color-primary-800);
      transform: scale(0.98);
    }

    .btn-outline {
      flex: 1;
      background-color: var(--bg-card);
      color: var(--text-secondary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: var(--space-3) var(--space-4);
      font-size: var(--font-size-sm);
      font-weight: var(--weight-medium);
      cursor: pointer;
      transition: all var(--transition-fast);
      font-family: var(--font-family);
    }

    .btn-outline:hover {
      background-color: var(--bg-sunken);
      border-color: var(--border-strong);
    }

    .btn-outline:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="page-container">

    <!-- Navigation Bar -->
    <div class="status-bar-spacer"></div>
    <nav class="nav-bar">
      <div class="nav-back" data-dom-id="back-home" aria-label="返回">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </div>
      <span class="nav-title">对话分析</span>
      <span class="nav-action">帮助</span>
    </nav>

    <!-- Main Content -->
    <div style="padding: var(--space-4);">

      <!-- Contact Selector -->
      <div class="contact-card">
        <div class="contact-avatar">王</div>
        <div class="contact-info">
          <div class="contact-name">王妈妈</div>
          <div class="contact-subtitle">最近对话：今天 15:30</div>
        </div>
        <svg class="contact-arrow" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </div>

      <!-- Import Action -->
      <div style="margin-top: var(--space-4);">
        <button class="import-btn">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          导入对话记录
        </button>
        <p style="text-align: center; font-size: var(--font-size-xs); color: var(--text-tertiary); margin-top: var(--space-2); line-height: var(--line-height-relaxed);">
          支持微信、QQ等聊天记录导入，自动识别课时和薪资信息
        </p>
      </div>

      <!-- Analysis Results -->
      <div style="margin-top: var(--space-6);">
        <div class="section-header">
          <span class="section-title">分析结果</span>
          <span class="status-badge-count">已分析 23 条消息</span>
        </div>

        <!-- Card 1: 课时安排 -->
        <div class="analysis-card">
          <div class="analysis-card-header">
            <div class="dot dot-blue"></div>
            <span class="card-title">课时安排</span>
          </div>
          <div class="item-row">
            <span class="item-content">周六 14:00-16:00 数学课 (2小时)</span>
            <span class="badge badge-success">已确认</span>
          </div>
          <div class="item-row">
            <span class="item-content">周日 10:00-12:00 英语课 (2小时)</span>
            <span class="badge badge-warning">待确认</span>
          </div>
          <div class="item-row">
            <span class="item-content">下周三 15:00-17:00 数学课 (2小时)</span>
            <span class="badge badge-warning">待确认</span>
          </div>
        </div>

        <!-- Card 2: 休假信息 -->
        <div class="analysis-card">
          <div class="analysis-card-header">
            <div class="dot dot-green"></div>
            <span class="card-title">休假信息</span>
          </div>
          <div class="item-row">
            <span class="item-content">8月1日-8月7日 暑假休息</span>
            <span class="badge badge-info">已记录</span>
          </div>
          <div class="item-row">
            <span class="item-content">7月20日 因事请假一次</span>
            <span class="badge badge-info">已记录</span>
          </div>
        </div>

        <!-- Card 3: 薪资相关 -->
        <div class="analysis-card">
          <div class="analysis-card-header">
            <div class="dot dot-amber"></div>
            <span class="card-title">薪资相关</span>
          </div>
          <div class="item-row">
            <span class="item-content">课酬标准：200元/小时</span>
            <div class="item-right">
              <svg class="edit-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </div>
          </div>
          <div class="item-row">
            <span class="item-content">7月调整课酬为 220元/小时（8月1日起生效）</span>
            <span class="badge badge-warning">待生效</span>
          </div>
        </div>

      </div>

    </div>

    <!-- Bottom Action Bar -->
    <div class="bottom-bar">
      <button class="btn-outline">重新分析</button>
      <button class="btn-primary">保存所有记录</button>
    </div>

  </div>
</body>
</html>
