<!DOCTYPE html>
<html lang="zh-CN" class="mini-program">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>家教助手 - 课时管理</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Mini-program specific overrides */
    html.mini-program body {
      max-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Custom scrollbar hide for mini-program feel */
    html.mini-program ::-webkit-scrollbar { display: none; }
    html.mini-program body { -ms-overflow-style: none; scrollbar-width: none; }

    /* Progress bar */
    .progress-track {
      height: 4px;
      background: var(--bg-sunken);
      border-radius: 9999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 9999px;
      background: var(--color-primary);
      transition: width var(--transition-base);
    }

    /* Calendar day dot */
    .cal-dot {
      width: 5px;
      height: 5px;
      border-radius: 9999px;
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
    }
    .cal-dot-blue { background: var(--color-primary); }
    .cal-dot-green { background: var(--state-success); }
    .cal-dot-amber { background: var(--state-warning); }

    /* Lesson card */
    .lesson-card {
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      cursor: pointer;
      transition: background var(--transition-fast);
      position: relative;
    }
    .lesson-card:active {
      background: var(--bg-card-hover);
    }
    .lesson-card-highlight {
      border-left: 3px solid var(--color-primary);
      background: var(--color-primary-50);
    }

    /* Student tab */
    .student-tab {
      flex-shrink: 0;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: var(--font-size-sm);
      font-weight: var(--weight-medium);
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
      border: 1px solid var(--border-default);
      background: var(--bg-card);
      color: var(--text-secondary);
    }
    .student-tab:active {
      opacity: 0.8;
    }
    .student-tab-active {
      background: var(--color-primary);
      color: var(--text-on-primary);
      border-color: var(--color-primary);
    }

    /* Calendar day */
    .cal-day {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
      cursor: pointer;
      padding: 6px 0;
      position: relative;
    }
    .cal-day-number {
      width: 32px;
      height: 32px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-size-sm);
      font-weight: var(--weight-medium);
      color: var(--text-primary);
    }
    .cal-day-today .cal-day-number {
      background: var(--color-primary);
      color: var(--text-on-primary);
    }

    /* Summary row */
    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
    }

    /* Hide scrollbar on tab container */
    .tabs-scroll {
      overflow-x: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .tabs-scroll::-webkit-scrollbar { display: none; }

    /* Nav add button */
    .add-btn {
      width: 32px;
      height: 32px;
      border-radius: 9999px;
      background: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background var(--transition-fast);
      border: none;
    }
    .add-btn:active {
      background: var(--color-primary-hover);
    }

    /* Chevron buttons */
    .chevron-btn {
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      transition: background var(--transition-fast);
      flex-shrink: 0;
    }
    .chevron-btn:active {
      background: var(--bg-card-hover);
    }
  </style>
</head>
<body class="bg-[var(--bg-page)]">

  <!-- Top Navigation Bar -->
  <div class="sticky top-0 z-40 bg-white border-b border-[var(--border-default)]" style="padding-top: max(env(safe-area-inset-top, 12px), 12px);">
    <div class="flex items-center justify-between px-4" style="height: 48px;">
      <!-- Back button -->
      <button data-dom-id="back-home" class="w-8 h-8 flex items-center justify-center cursor-pointer rounded-full hover:bg-gray-100 transition-colors" aria-label="返回">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <!-- Title -->
      <span class="text-base font-semibold text-[var(--text-primary)]">课时管理</span>
      <!-- Add button -->
      <button class="add-btn" aria-label="添加课时">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="px-4 pt-4 pb-6 space-y-4">

    <!-- Month Selector -->
    <div class="surface-card px-4 py-3">
      <div class="flex items-center justify-center gap-4">
        <button class="chevron-btn" aria-label="上个月">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <span class="text-sm font-semibold text-[var(--text-primary)]">2026年7月</span>
        <button class="chevron-btn" aria-label="下个月">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
      <!-- Progress summary -->
      <div class="mt-3">
        <div class="flex justify-between items-center mb-1.5">
          <span class="text-xs text-[var(--text-secondary)]">本月已上 <span class="font-semibold text-[var(--text-primary)]">28</span> 小时 / 共 <span class="font-semibold text-[var(--text-primary)]">32</span> 小时</span>
          <span class="text-xs font-medium text-[var(--color-primary)]">87.5%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width: 87.5%;"></div>
        </div>
      </div>
    </div>

    <!-- Student Filter Tabs -->
    <div class="tabs-scroll">
      <div class="flex gap-2 px-0.5">
        <button class="student-tab student-tab-active">全部</button>
        <button class="student-tab">小明</button>
        <button class="student-tab">小红</button>
        <button class="student-tab">小刚</button>
        <button class="student-tab">小芳</button>
      </div>
    </div>

    <!-- Calendar Mini-View -->
    <div class="surface-card px-4 py-3">
      <div class="flex">
        <!-- Mon Jul 7 -->
        <div class="cal-day">
          <span class="text-xs text-[var(--text-tertiary)] font-medium">一</span>
          <div class="cal-day-number">7</div>
          <div class="cal-dot cal-dot-green"></div>
        </div>
        <!-- Tue Jul 8 -->
        <div class="cal-day">
          <span class="text-xs text-[var(--text-tertiary)] font-medium">二</span>
          <div class="cal-day-number">8</div>
          <div class="cal-dot cal-dot-green"></div>
        </div>
        <!-- Wed Jul 9 -->
        <div class="cal-day">
          <span class="text-xs text-[var(--text-tertiary)] font-medium">三</span>
          <div class="cal-day-number">9</div>
          <div class="cal-dot cal-dot-green"></div>
        </div>
        <!-- Thu Jul 10 (today) -->
        <div class="cal-day cal-day-today">
          <span class="text-xs text-[var(--color-primary)] font-semibold">四</span>
          <div class="cal-day-number">10</div>
          <div class="cal-dot cal-dot-blue" style="background: white;"></div>
        </div>
        <!-- Fri Jul 11 -->
        <div class="cal-day">
          <span class="text-xs text-[var(--text-tertiary)] font-medium">五</span>
          <div class="cal-day-number">11</div>
          <div class="cal-dot cal-dot-amber"></div>
        </div>
        <!-- Sat Jul 12 -->
        <div class="cal-day">
          <span class="text-xs text-[var(--text-tertiary)] font-medium">六</span>
          <div class="cal-day-number">12</div>
          <div class="cal-dot cal-dot-amber"></div>
        </div>
        <!-- Sun Jul 13 -->
        <div class="cal-day">
          <span class="text-xs text-[var(--text-tertiary)] font-medium">日</span>
          <div class="cal-day-number">13</div>
        </div>
      </div>
      <!-- Legend -->
      <div class="flex items-center justify-center gap-4 mt-2">
        <div class="flex items-center gap-1">
          <div class="w-1.5 h-1.5 rounded-full bg-[var(--color-primary)]"></div>
          <span class="text-xs text-[var(--text-tertiary)]">有课</span>
        </div>
        <div class="flex items-center gap-1">
          <div class="w-1.5 h-1.5 rounded-full bg-[var(--state-success)]"></div>
          <span class="text-xs text-[var(--text-tertiary)]">已完成</span>
        </div>
        <div class="flex items-center gap-1">
          <div class="w-1.5 h-1.5 rounded-full bg-[var(--state-warning)]"></div>
          <span class="text-xs text-[var(--text-tertiary)]">待上课</span>
        </div>
      </div>
    </div>

    <!-- Lesson List Section -->
    <div>
      <!-- Section header -->
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <span class="text-base font-semibold text-[var(--text-primary)]">课程列表</span>
          <span class="text-xs font-medium text-[var(--color-primary)] bg-[var(--color-primary-50)] px-2 py-0.5 rounded-full">本月 16 节</span>
        </div>
      </div>

      <!-- Lesson Cards -->
      <div class="space-y-3">

        <!-- Card 1: Completed -->
        <div class="lesson-card flex items-center gap-3">
          <div class="flex-1 min-w-0">
            <div class="text-sm font-semibold text-[var(--text-primary)] truncate">数学课 - 小明</div>
            <div class="text-xs text-[var(--text-secondary)] mt-1">7月8日 周二 14:00-16:00</div>
            <div class="flex items-center gap-2 mt-1.5">
              <span class="text-xs text-[var(--text-tertiary)]">2小时</span>
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-[var(--state-success-light)] text-[var(--state-success)]">已完成</span>
            </div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>

        <!-- Card 2: Completed -->
        <div class="lesson-card flex items-center gap-3">
          <div class="flex-1 min-w-0">
            <div class="text-sm font-semibold text-[var(--text-primary)] truncate">英语课 - 小红</div>
            <div class="text-xs text-[var(--text-secondary)] mt-1">7月9日 周三 10:00-12:00</div>
            <div class="flex items-center gap-2 mt-1.5">
              <span class="text-xs text-[var(--text-tertiary)]">2小时</span>
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-[var(--state-success-light)] text-[var(--state-success)]">已完成</span>
            </div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>

        <!-- Card 3: Today / In Progress (highlighted) -->
        <div class="lesson-card lesson-card-highlight flex items-center gap-3">
          <div class="flex-1 min-w-0">
            <div class="text-sm font-semibold text-[var(--text-primary)] truncate">数学课 - 小明</div>
            <div class="text-xs text-[var(--color-primary)] mt-1 font-medium">今天 14:00-16:00</div>
            <div class="flex items-center gap-2 mt-1.5">
              <span class="text-xs text-[var(--text-tertiary)]">2小时</span>
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-[var(--color-primary-100)] text-[var(--color-primary)]">进行中</span>
            </div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>

        <!-- Card 4: Pending -->
        <div class="lesson-card flex items-center gap-3">
          <div class="flex-1 min-w-0">
            <div class="text-sm font-semibold text-[var(--text-primary)] truncate">物理课 - 小刚</div>
            <div class="text-xs text-[var(--text-secondary)] mt-1">7月11日 周五 15:00-17:00</div>
            <div class="flex items-center gap-2 mt-1.5">
              <span class="text-xs text-[var(--text-tertiary)]">2小时</span>
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-[var(--state-warning-light)] text-[var(--state-warning)]">待上课</span>
            </div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>

      </div>
    </div>

    <!-- Summary Card -->
    <div class="surface-card px-4 py-3">
      <div class="text-sm font-semibold text-[var(--text-primary)] mb-1">本月汇总</div>
      <div class="summary-row">
        <span class="text-sm text-[var(--text-secondary)]">已完成课时</span>
        <span class="text-sm font-bold text-[var(--text-primary)]">28 小时</span>
      </div>
      <div class="summary-row">
        <span class="text-sm text-[var(--text-secondary)]">待上课时</span>
        <span class="text-sm font-bold text-[var(--state-warning)]">4 小时</span>
      </div>
      <div class="summary-row">
        <span class="text-sm text-[var(--text-secondary)]">取消课时</span>
        <span class="text-sm text-[var(--text-primary)]">0 小时</span>
      </div>
      <div class="border-t border-[var(--border-default)] my-1"></div>
      <div class="summary-row" style="padding-top: 10px;">
        <span class="text-sm text-[var(--text-secondary)]">本月课时费</span>
        <span class="text-base font-bold text-[var(--color-primary)]">¥6,160</span>
      </div>
    </div>

  </div>

</body>
</html>
