<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0f13" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Claude 指挥中心</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- 侧栏 / 会话列表 -->
    <aside id="sidebar">
      <header class="side-head">
        <div class="brand">
          <span class="brand-mark">🛰️</span>
          <div class="brand-txt">
            <h1>指挥中心</h1>
            <span class="brand-sub">Claude Code 远程监控</span>
          </div>
        </div>
        <div class="conn" id="conn" title="连接状态">
          <span class="conn-dot"></span><span class="conn-label">连接中</span>
        </div>
      </header>

      <div class="side-toolbar">
        <div class="search-wrap">
          <input id="search" type="text" placeholder="搜索会话 / 目录…" autocomplete="off" />
        </div>
        <button id="btn-refresh" class="icon-btn" title="刷新">⟳</button>
      </div>

      <div id="session-list" class="session-list">
        <div class="empty-hint">加载会话中…</div>
      </div>

      <button id="btn-new" class="fab-new">＋ 新建会话</button>
    </aside>

    <!-- 聊天 / 监控主区 -->
    <main id="chat">
      <div id="chat-empty" class="chat-empty">
        <div class="chat-empty-inner">
          <div class="ce-mark">🛰️</div>
          <h2>选择一个会话开始监控</h2>
          <p>实时查看 Claude Code 的思考、工具调用与回复，随时下达下一步指令。</p>
          <button id="btn-new-2" class="btn-primary">＋ 新建会话</button>
        </div>
      </div>

      <div id="chat-view" class="chat-view hidden">
        <header class="chat-head">
          <button id="btn-back" class="icon-btn back-btn" title="返回">‹</button>
          <div class="chat-title">
            <div class="ct-line">
              <span id="ct-status" class="status-dot idle"></span>
              <h2 id="ct-name">会话</h2>
            </div>
            <div id="ct-cwd" class="ct-cwd"></div>
          </div>
          <button id="btn-stop" class="icon-btn stop-btn hidden" title="停止当前任务">■</button>
        </header>

        <div id="messages" class="messages"></div>

        <div class="composer">
          <div class="composer-inner">
            <textarea id="input" rows="1" placeholder="给 Claude 下达指令…（Enter 发送，Shift+Enter 换行）"></textarea>
            <button id="btn-send" class="send-btn" title="发送">➤</button>
          </div>
          <div id="typing-hint" class="typing-hint hidden">
            <span class="dot-flash"></span><span class="dot-flash"></span><span class="dot-flash"></span>
            Claude 正在工作…
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 新建会话弹窗 -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h3>新建 Claude Code 会话</h3>
      <label class="fld">
        <span>工作目录</span>
        <input id="new-cwd" list="dir-list" placeholder="/Users/you/project" />
        <datalist id="dir-list"></datalist>
      </label>
      <label class="fld">
        <span>首条指令</span>
        <textarea id="new-text" rows="4" placeholder="例如：帮我把这个项目的 README 补全并加上使用示例"></textarea>
      </label>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn-ghost">取消</button>
        <button id="modal-create" class="btn-primary">创建并运行</button>
      </div>
    </div>
  </div>

  <!-- 访问密钥弹窗 -->
  <div id="key-modal" class="modal hidden">
    <div class="modal-card">
      <h3>🔒 需要访问密钥</h3>
      <p style="color:var(--text-dim);font-size:13px;margin:-6px 0 16px;line-height:1.6">
        此服务可操控本机的 Claude Code，需要密钥才能访问。请输入电脑终端启动时打印的「访问密钥」。
      </p>
      <label class="fld">
        <span>访问密钥</span>
        <input id="key-input" type="text" placeholder="例如 868ee485971d" autocomplete="off" />
      </label>
      <div class="modal-actions">
        <button id="key-submit" class="btn-primary">连接</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
