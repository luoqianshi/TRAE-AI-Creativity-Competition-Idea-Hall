<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小日常·健康List — 基于国家健康指南的微习惯打卡</title>
<style>
  :root {
    --bg: #F4F6F2;
    --card: #FFFFFF;
    --teal: #0D9488;
    --sky: #38BDF8;
    --violet: #7C3AED;
    --amber: #F59E0B;
    --text: #1A1D1C;
    --text-secondary: #6B7280;
    --border: #E5E7EB;
    --ring-size: 140px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: #E8ECF0;
    display: flex;
    justify-content: center;
    padding: 20px 0 60px;
    line-height: 1.6;
  }

  /* ──────── 手机模拟框 ──────── */
  .phone-frame {
    width: 375px;
    min-height: 812px;
    background: var(--bg);
    border-radius: 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.06);
    overflow: hidden;
    position: relative;
  }

  /* ──────── 状态栏 ──────── */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
  }

  /* ──────── 日期头部 ──────── */
  .date-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 8px 24px 4px;
  }
  .date-main { font-size: 26px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
  .date-sub { font-size: 13px; font-weight: 500; color: var(--text-secondary); }

  /* ──────── 环形进度 ──────── */
  .ring-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 0 16px;
    position: relative;
  }
  .ring-container {
    position: relative;
    width: var(--ring-size);
    height: var(--ring-size);
  }
  .ring-container svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--border); stroke-width: 7; }
  .ring-fg { fill: none; stroke: url(#ringGrad); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset .8s cubic-bezier(.4,0,.2,1); }
  .ring-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .ring-number { font-size: 38px; font-weight: 800; color: var(--text); letter-spacing: -1px; line-height: 1; }
  .ring-label { font-size: 13px; color: var(--text-secondary); margin-top: 2px; font-weight: 500; }

  /* ──────── 统计行 ──────── */
  .stats-row {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-bottom: 12px;
  }
  .stat { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
  .stat strong { color: var(--teal); font-weight: 700; }

  /* ──────── 时段分组 ──────── */
  .segments { padding: 0 16px; }
  .segment {
    margin-bottom: 10px;
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .seg-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px 4px;
  }
  .seg-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .seg-label { font-size: 14px; font-weight: 700; color: var(--text); }
  .seg-time { font-size: 12px; color: var(--text-secondary); margin-left: auto; }

  .seg-items { padding: 4px 16px 12px; }
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: background .2s;
  }
  .item:hover { background: #F0F9F8; }
  .item-icon { font-size: 22px; width: 30px; text-align: center; flex-shrink: 0; }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .item-basis { font-size: 11px; color: var(--text-secondary); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-time { font-size: 12px; color: var(--teal); font-weight: 600; flex-shrink: 0; }
  .item-check {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all .25s;
    font-size: 14px; color: transparent;
  }
  .item.done .item-check {
    background: var(--teal);
    border-color: var(--teal);
    color: #fff;
  }
  .item.done .item-name { opacity: .5; text-decoration: line-through; }

  /* ──────── 浮动按钮 ──────── */
  .float-btn {
    position: absolute;
    bottom: 36px; right: 16px;
    width: 48px; height: 48px;
    border-radius: 24px;
    background: var(--text);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,.18);
    cursor: pointer;
    font-size: 20px; color: #fff;
  }

  /* ──────── 底部浮层 ──────── */
  .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); z-index: 100; }
  .overlay.show { display: block; }
  .sheet {
    position: fixed;
    bottom: 0; left: 50%;
    transform: translateX(-50%) translateY(100%);
    width: 375px;
    max-width: 100vw;
    background: var(--card);
    border-radius: 20px 20px 0 0;
    padding: 20px 24px 36px;
    z-index: 101;
    transition: transform .3s cubic-bezier(.4,0,.2,1);
  }
  .sheet.show { transform: translateX(-50%) translateY(0); }
  .sheet-handle { width: 36px; height: 4px; background: #D1D5DB; border-radius: 2px; margin: -8px auto 16px; }
  .sheet h3 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .sheet p { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
  .q-label { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .pill {
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    border: 1.5px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    transition: all .2s;
  }
  .pill.selected { border-color: var(--teal); background: #F0FDFA; color: var(--teal); font-weight: 600; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 4px; }
  .btn { flex: 1; padding: 12px; border-radius: 12px; font-size: 15px; font-weight: 600; border: none; cursor: pointer; }
  .btn-primary { background: var(--text); color: #fff; }
  .btn-ghost { background: transparent; color: var(--text-secondary); }

  /* ──────── 底部导航 ──────── */
  .tab-bar {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 8px 0 20px;
    background: var(--card);
    border-top: 1px solid var(--border);
  }
  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 10px;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .tab.active { color: var(--teal); }
  .tab-icon { font-size: 20px; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .pulse { animation: pulse .4s ease; }
</style>
</head>
<body>

<div class="phone-frame">

  <!-- 状态栏 -->
  <div class="status-bar"><span>9:41</span><span>WiFi ▮▮▮▮  🔋</span></div>

  <!-- 日期 -->
  <div class="date-header">
    <span class="date-main">7月1日 周三</span>
    <span class="date-sub">坚持健康生活</span>
  </div>

  <!-- 环形进度 -->
  <div class="ring-section">
    <div class="ring-container">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0D9488"/>
            <stop offset="50%" stop-color="#38BDF8"/>
            <stop offset="100%" stop-color="#7C3AED"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="70" cy="70" r="60"/>
        <circle class="ring-fg" id="progressRing" cx="70" cy="70" r="60"
          stroke-dasharray="377"
          stroke-dashoffset="151"/>
      </svg>
      <div class="ring-center">
        <div class="ring-number" id="count">9</div>
        <div class="ring-label">/ 16 项</div>
      </div>
    </div>
  </div>

  <!-- 统计行 -->
  <div class="stats-row">
    <span class="stat">已完成 <strong id="doneCnt">9</strong></span>
    <span class="stat">待完成 <strong id="todoCnt">7</strong></span>
    <span class="stat">本周 <strong id="weekRate">62</strong>%</span>
  </div>

  <!-- 按时段分组的打卡列表 -->
  <div class="segments" id="segments"></div>

  <!-- 浮动按钮 -->
  <div class="float-btn" onclick="toggleSheet()" title="定制我的List">✨</div>

  <!-- 底部浮层 -->
  <div class="overlay" id="overlay" onclick="toggleSheet()"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <h3>定制我的健康 List</h3>
    <p>选择身份信息，自动调整打卡内容与提醒时间</p>
    <div class="q-label">你的职业类型</div>
    <div class="pills" id="occPills">
      <span class="pill selected" data-val="office">💻 办公室久坐族</span>
      <span class="pill" data-val="driver">🚗 驾驶/外勤</span>
      <span class="pill" data-val="remote">🏠 居家办公</span>
      <span class="pill" data-val="college">🎓 大学生/备考</span>
      <span class="pill" data-val="standing">🏥 站立工作者</span>
    </div>
    <div class="q-label">作息偏好</div>
    <div class="pills" id="schPills">
      <span class="pill" data-val="early">🌅 早鸟型 6:30起</span>
      <span class="pill selected" data-val="normal">☀️ 常规 7:30起</span>
      <span class="pill" data-val="night">🌙 夜猫型 8:30起</span>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="toggleSheet()">跳过</button>
      <button class="btn btn-primary" onclick="confirmCustom()">确认生成</button>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="tab-bar">
    <div class="tab active"><span class="tab-icon">📋</span>今日打卡</div>
    <div class="tab"><span class="tab-icon">📅</span>日历</div>
    <div class="tab"><span class="tab-icon">📝</span>我的List</div>
    <div class="tab"><span class="tab-icon">👤</span>我的</div>
  </div>

</div>

<script>
// 默认清单（16项，每项溯源到膳食指南/卫健委倡议）
const CHECKLIST = [
  { name:'晨起喝一杯温水 300ml', icon:'💧', time:'07:00', segment:'morning',
    basis:'《膳食指南》准则六：每天 1500-1700ml' },
  { name:'吃营养早餐', icon:'🥛', time:'07:30', segment:'morning',
    basis:'《膳食指南》准则六：规律进餐，每天吃早餐' },
  { name:'吃一份水果', icon:'🍎', time:'09:30', segment:'forenoon',
    basis:'《膳食指南》准则三：天天吃水果 200-350g' },
  { name:'远眺放松 20 秒', icon:'👁️', time:'10:00', segment:'forenoon',
    basis:'国家卫健委"科学用眼"倡议：20-20-20 法则' },
  { name:'起身活动 5 分钟', icon:'🧘', time:'10:45', segment:'forenoon',
    basis:'《膳食指南》准则二：每小时起来动一动' },
  { name:'喝水 200ml', icon:'💧', time:'11:30', segment:'forenoon',
    basis:'《膳食指南》准则六：足量饮水，少量多次' },
  { name:'午餐：蔬菜+蛋白+主食', icon:'🥬', time:'12:00', segment:'noon',
    basis:'准则三"餐餐有蔬菜" + 准则四"适量吃鱼禽蛋瘦肉"' },
  { name:'饭后散步 15 分钟', icon:'🚶', time:'13:00', segment:'noon',
    basis:'《膳食指南》准则二：每天主动活动 6000 步' },
  { name:'喝水 200ml', icon:'💧', time:'14:30', segment:'afternoon',
    basis:'《膳食指南》准则六：足量饮水' },
  { name:'吃一小把坚果', icon:'🥜', time:'15:00', segment:'afternoon',
    basis:'《膳食指南》准则三：适量吃坚果' },
  { name:'颈肩拉伸放松', icon:'🙆', time:'15:45', segment:'afternoon',
    basis:'国家卫健委"健康骨骼"倡议 + 准则二"减少久坐"' },
  { name:'喝水 200ml', icon:'💧', time:'16:30', segment:'afternoon',
    basis:'《膳食指南》准则六：足量饮水' },
  { name:'户外快走/运动 30 分钟', icon:'🏃', time:'18:00', segment:'evening',
    basis:'《膳食指南》准则二：每周≥150分钟中强度活动' },
  { name:'吃清淡晚餐', icon:'🥗', time:'19:00', segment:'evening',
    basis:'《膳食指南》准则五：盐<5g/天，油25-30g/天' },
  { name:'刷牙、用牙线', icon:'🪥', time:'21:30', segment:'evening',
    basis:'国家卫健委"三减三健·健康口腔"倡议' },
  { name:'准备入睡', icon:'🌙', time:'22:30', segment:'evening',
    basis:'国家卫健委倡议：保持 7-8 小时睡眠' }
];

const SEGMENTS = [
  { key:'morning',  label:'早晨',  range:'7:00 — 8:00',  color:'#F59E0B' },
  { key:'forenoon', label:'上午',  range:'9:00 — 12:00', color:'#38BDF8' },
  { key:'noon',     label:'中午',  range:'12:00 — 13:30',color:'#0D9488' },
  { key:'afternoon',label:'下午',  range:'14:00 — 18:00',color:'#8B5CF6' },
  { key:'evening',  label:'晚间',  range:'18:00 — 22:30',color:'#7C3AED' }
];

let doneSet = new Set();

function render() {
  const groups = {};
  SEGMENTS.forEach(s => { groups[s.key] = { ...s, items:[] }; });
  CHECKLIST.forEach((item, i) => {
    const seg = item.segment || 'afternoon';
    if (groups[seg]) groups[seg].items.push({ ...item, id: i, done: doneSet.has(i) });
  });

  let html = '';
  SEGMENTS.forEach(s => {
    const g = groups[s.key];
    if (g.items.length === 0) return;
    html += `<div class="segment">
      <div class="seg-header">
        <span class="seg-dot" style="background:${s.color}"></span>
        <span class="seg-label">${s.label}</span>
        <span class="seg-time">${s.range}</span>
      </div>
      <div class="seg-items">`;
    g.items.forEach(item => {
      html += `<div class="item${item.done?' done':''}" onclick="toggle(${item.id})">
        <span class="item-icon">${item.icon}</span>
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-basis" title="${item.basis}">${item.basis}</div>
        </div>
        <span class="item-time">${item.time}</span>
        <span class="item-check">✓</span>
      </div>`;
    });
    html += '</div></div>';
  });
  document.getElementById('segments').innerHTML = html;

  const done = doneSet.size;
  const total = CHECKLIST.length;
  const rate = total > 0 ? Math.round(done/total*100) : 0;

  document.getElementById('count').textContent = done;
  document.getElementById('doneCnt').textContent = done;
  document.getElementById('todoCnt').textContent = total - done;
  document.getElementById('weekRate').textContent = Math.round(rate * 0.85 + 10);

  const circumference = 2 * Math.PI * 60;
  const offset = circumference * (1 - done / total);
  document.getElementById('progressRing').setAttribute('stroke-dashoffset', offset);
}

function toggle(i) {
  if (doneSet.has(i)) doneSet.delete(i); else doneSet.add(i);
  render();
}

function toggleSheet() {
  const overlay = document.getElementById('overlay');
  const sheet = document.getElementById('sheet');
  const show = !overlay.classList.contains('show');
  overlay.classList.toggle('show', show);
  sheet.classList.toggle('show', show);
}

function confirmCustom() {
  toggleSheet();
}

// 浮层pill点击
document.querySelectorAll('.pills').forEach(g => {
  g.addEventListener('click', e => {
    if (!e.target.classList.contains('pill')) return;
    g.querySelectorAll('.pill').forEach(p => p.classList.remove('selected'));
    e.target.classList.add('selected');
  });
});

// 初始化
render();
</script>

</body>
</html>
