<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQ智商测试</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">🧠 IQ智商测试</h1>
            <p class="subtitle">发现你的智商潜能</p>
        </header>

        <section class="intro">
            <div class="feature-card">
                <div class="icon">⚡</div>
                <h3>科学准确</h3>
                <p>基于专业心理学原理设计</p>
            </div>
            <div class="feature-card">
                <div class="icon">⏱️</div>
                <h3>快速测试</h3>
                <p>仅需10分钟完成</p>
            </div>
            <div class="feature-card">
                <div class="icon">📊</div>
                <h3>详细报告</h3>
                <p>获取个性化分析结果</p>
            </div>
        </section>

        <section class="instructions">
            <h2>测试说明</h2>
            <ul>
                <li>测试包含20道题目，涵盖逻辑推理、空间想象、数学计算等多个维度</li>
                <li>建议在安静环境下完成，保持专注</li>
                <li>每道题作答时间不限，但建议尽快完成</li>
                <li>测试结果仅供参考，不代表正式智商评估</li>
            </ul>
        </section>

        <button class="start-btn" onclick="startTest()">开始测试</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
