<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 面试系统</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--text:#e4e4e7;--text2:#a1a1aa;--accent:#6366f1;--accent2:#818cf8;--green:#22c55e;--red:#ef4444;--orange:#f59e0b;--cyan:#06b6d4}
:root.light{--bg:#f8f9fa;--card:#fff;--border:#e2e8f0;--text:#1e293b;--text2:#64748b;--accent:#6366f1;--accent2:#4f46e5;--green:#16a34a;--red:#dc2626;--orange:#d97706;--cyan:#0891b2}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── Setup screen ── */
.setup-screen{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.setup-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:520px}
.setup-card h1{font-size:24px;font-weight:800;text-align:center;margin-bottom:4px;background:linear-gradient(135deg,var(--orange),var(--red));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.setup-card .sub{text-align:center;color:var(--text2);font-size:13px;margin-bottom:24px}
.field-label{font-size:13px;color:var(--text2);display:block;margin-bottom:6px}
.upload-zone{border:2px dashed var(--border);border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:all 0.2s;position:relative;margin-bottom:16px}
.upload-zone:hover{border-color:var(--orange);background:rgba(245,158,11,0.03)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-icon{font-size:28px;margin-bottom:6px}
.upload-text{font-size:13px;color:var(--text2)}
.upload-text strong{color:var(--accent2)}
.upload-hint{font-size:11px;color:var(--text2);opacity:0.7;margin-top:4px}
.upload-result{margin-top:8px;font-size:12px;color:var(--green);display:none}
.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.diff-btn{padding:12px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text2);font-size:13px;cursor:pointer;transition:all 0.2s;text-align:center}
.diff-btn:hover{border-color:var(--orange);color:var(--text)}
.diff-btn.active{border-color:var(--orange);background:rgba(245,158,11,0.12);color:var(--orange);font-weight:600}
.diff-btn .diff-title{font-size:14px;font-weight:600;margin-bottom:2px}
.diff-btn .diff-desc{font-size:11px;opacity:0.7}
.btn-start{width:100%;padding:14px;background:linear-gradient(135deg,var(--orange),#d97706);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.2s}
.btn-start:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(245,158,11,0.3)}
.btn-start:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn-home{display:block;text-align:center;margin-top:12px;font-size:13px;color:var(--text2);text-decoration:none}
.btn-home:hover{color:var(--text)}

/* ── Chat screen ── */
.chat-screen{display:none;flex-direction:column;height:100vh}
.chat-header{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--card)}
.chat-header .ch-back{font-size:18px;cursor:pointer;color:var(--text2);transition:color 0.2s}
.chat-header .ch-back:hover{color:var(--text)}
.chat-header .ch-title{font-size:15px;font-weight:600;flex:1}
.chat-header .ch-diff{font-size:11px;padding:3px 10px;border-radius:10px;background:rgba(245,158,11,0.12);color:var(--orange)}
.chat-header .ch-theme{font-size:16px;cursor:pointer;color:var(--text2)}

/* Outline panel */
.outline-panel{border-bottom:1px solid var(--border);padding:12px 20px;background:var(--card);display:none}
.outline-panel.show{display:block}
.outline-toggle{font-size:12px;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:4px}
.outline-toggle:hover{color:var(--text)}
.outline-content{display:none;margin-top:10px}
.outline-content.show{display:block}
.outline-item{display:flex;gap:8px;margin-bottom:6px;font-size:12px;color:var(--text2);line-height:1.5}
.outline-item .oi-num{color:var(--orange);font-weight:700;min-width:18px}

/* Messages */
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:80%;animation:fadeIn 0.3s ease}
.msg-ai{align-self:flex-start}
.msg-user{align-self:flex-end}
.msg-avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;margin-bottom:4px}
.msg-ai .msg-avatar{background:rgba(245,158,11,0.15)}
.msg-user .msg-avatar{background:rgba(99,102,241,0.15);align-self:flex-end}
.msg-bubble{padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.7;white-space:pre-wrap}
.msg-ai .msg-bubble{background:var(--card);border:1px solid var(--border);border-top-left-radius:4px}
.msg-user .msg-bubble{background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.2);border-top-right-radius:4px;color:var(--text)}
.msg-time{font-size:10px;color:var(--text2);margin-top:4px}
.msg-user .msg-time{text-align:right}
.typing-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--text2);margin:0 2px;animation:typing 1.2s infinite}
.typing-dot:nth-child(2){animation-delay:0.2s}
.typing-dot:nth-child(3){animation-delay:0.4s}
@keyframes typing{0%,60%,100%{opacity:0.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Input area */
.chat-input-area{padding:12px 20px;border-top:1px solid var(--border);background:var(--card)}
.chat-input-row{display:flex;gap:8px;align-items:flex-end}
.chat-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit;resize:none;max-height:120px;min-height:42px;line-height:1.5;transition:border-color 0.2s,font-family 0.2s}
.chat-input:focus{outline:none;border-color:var(--orange)}
.chat-input::placeholder{color:var(--text2);opacity:0.5}
.chat-input.code-mode{font-family:'Consolas','Fira Code','Courier New',monospace;font-size:13px;min-height:140px;max-height:300px;white-space:pre;tab-size:2}

/* ── Code editor enhanced ── */
.code-editor-wrap{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--bg);display:none;margin-bottom:6px}
.code-editor-wrap.show{display:block}
.code-editor-toolbar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--border);font-size:11px}
.code-lang{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:2px 8px;color:var(--text);font-size:11px;font-family:inherit}
.code-copy{background:transparent;border:1px solid var(--border);border-radius:4px;padding:2px 8px;color:var(--text2);font-size:11px;cursor:pointer}
.code-copy:hover{border-color:var(--cyan);color:var(--cyan)}
.code-editor-body{display:flex;min-height:140px;max-height:300px;overflow:auto}
.line-numbers{padding:10px 0;text-align:right;color:var(--text2);font-size:12px;line-height:1.6;min-width:36px;border-right:1px solid var(--border);user-select:none;font-family:'Consolas','Fira Code',monospace;background:var(--card)}
.line-numbers span{display:block;padding:0 6px}
.code-editor-body textarea{flex:1;background:transparent;border:none;color:var(--text);font-family:'Consolas','Fira Code',monospace;font-size:13px;line-height:1.6;padding:10px;resize:none;outline:none;tab-size:2;white-space:pre;overflow:auto}
.code-editor-body textarea::placeholder{color:var(--text2);opacity:0.5}

/* Code toggle */
.code-toggle{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.code-toggle-btn{padding:3px 10px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text2);font-size:11px;cursor:pointer;transition:all 0.2s}
.code-toggle-btn:hover{border-color:var(--cyan);color:var(--text)}
.code-toggle-btn.active{border-color:var(--cyan);background:rgba(6,182,212,0.12);color:var(--cyan)}
.code-toggle-label{font-size:11px;color:var(--text2)}

/* History panel */
.history-panel{margin-top:20px;border-top:1px solid var(--border);padding-top:16px}
.history-title{font-size:13px;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.history-title span{cursor:pointer;font-size:12px;color:var(--cyan)}
.history-title span:hover{text-decoration:underline}
.history-list{display:flex;flex-direction:column;gap:8px;max-height:200px;overflow-y:auto}
.history-item{padding:10px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all 0.2s;display:flex;justify-content:space-between;align-items:center}
.history-item:hover{border-color:var(--orange);background:rgba(245,158,11,0.03)}
.history-item .hi-left{flex:1;min-width:0}
.history-item .hi-date{font-size:11px;color:var(--text2)}
.history-item .hi-info{font-size:12px;color:var(--text);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-item .hi-diff{font-size:10px;padding:2px 8px;border-radius:8px;background:rgba(245,158,11,0.12);color:var(--orange);flex-shrink:0;margin-left:8px}
.history-item .hi-del{font-size:11px;color:var(--text2);cursor:pointer;margin-left:8px;flex-shrink:0}
.history-item .hi-del:hover{color:var(--red)}
.history-empty{text-align:center;font-size:12px;color:var(--text2);padding:16px}
.chat-send{width:42px;height:42px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--orange),#d97706);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0}
.chat-send:hover{transform:scale(1.05)}
.chat-send:disabled{opacity:0.5;cursor:not-allowed;transform:none}

/* Evaluation */
.eval-panel{display:none;padding:20px;animation:fadeIn 0.5s ease}
.eval-panel.show{display:block}
.eval-box{background:var(--card);border:2px solid var(--orange);border-radius:12px;padding:24px;font-size:14px;line-height:1.8;white-space:pre-wrap}
.eval-box h3{color:var(--orange);margin-bottom:12px;font-size:18px}
.eval-actions{display:flex;gap:8px;margin-top:16px;justify-content:center}
.eval-btn{padding:10px 24px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);transition:all 0.2s}
.eval-btn:hover{border-color:var(--orange);color:var(--text)}
.eval-btn.primary{background:linear-gradient(135deg,var(--orange),#d97706);color:#fff;border:none}
.eval-btn.primary:hover{transform:translateY(-1px)}

@media(max-width:640px){.setup-card{padding:20px}.msg{max-width:90%}.diff-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ═══════ Setup Screen ═══════ -->
<div class="setup-screen" id="setupScreen">
  <div class="setup-card">
    <h1>🔥 AI 面试系统</h1>
    <div class="sub">上传简历 → 选择难度 → 大厂面试官逐轮追问</div>

    <label class="field-label">📄 上传简历</label>
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept=".md,.txt,.pdf,.docx,.json,.py,.js" onchange="handleResume(this)">
      <div class="upload-icon">📎</div>
      <div class="upload-text">点击选择或拖拽简历文件</div>
      <div class="upload-hint">支持 .md .txt .pdf .docx 格式</div>
    </div>
    <div class="upload-result" id="uploadResult"></div>

    <label class="field-label" style="margin-top:8px">🎯 选择面试难度</label>
    <div class="diff-grid">
      <button class="diff-btn" data-diff="easy" onclick="selectDiff('easy')">
        <div class="diff-title">😊 简单</div>
        <div class="diff-desc">基础概念，适合初级</div>
      </button>
      <button class="diff-btn active" data-diff="medium" onclick="selectDiff('medium')">
        <div class="diff-title">🤔 中等</div>
        <div class="diff-desc">有追问，适合中级</div>
      </button>
      <button class="diff-btn" data-diff="hard" onclick="selectDiff('hard')">
        <div class="diff-title">🔥 困难</div>
        <div class="diff-desc">深挖原理，适合高级</div>
      </button>
      <button class="diff-btn" data-diff="insane" onclick="selectDiff('insane')">
        <div class="diff-title">💀 地狱</div>
        <div class="diff-desc">极限施压，架构师级</div>
      </button>
    </div>

    <button class="btn-start" id="btnStart" onclick="startInterview()">🎯 开始面试</button>
    <a href="/" class="btn-home">← 返回答题系统</a>

    <div class="history-panel">
      <div class="history-title">📋 面试记录 <span onclick="clearHistory()">清空</span></div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>
</div>

<!-- ═══════ Chat Screen ═══════ -->
<div class="chat-screen" id="chatScreen">
  <div class="chat-header">
    <span class="ch-back" onclick="backToSetup()">←</span>
    <span class="ch-title">🔥 AI 面试</span>
    <span class="ch-diff" id="chatDiff"></span>
    <span class="ch-theme" onclick="toggleTheme()">🌙</span>
  </div>

  <div class="outline-panel" id="outlinePanel">
    <div class="outline-toggle" onclick="toggleOutline()">
      <span id="outlineArrow">▶</span> 查看面试大纲
    </div>
    <div class="outline-content" id="outlineContent"></div>
  </div>

  <div class="chat-messages" id="chatMessages"></div>

  <div class="eval-panel" id="evalPanel">
    <div class="eval-box" id="evalBox"></div>
    <div class="eval-actions">
      <button class="eval-btn primary" onclick="location.reload()">🔄 再来一次</button>
      <button class="eval-btn" onclick="window.location='/'">← 返回答题系统</button>
    </div>
  </div>

  <div class="chat-input-area" id="inputArea">
    <div class="code-toggle">
      <button class="code-toggle-btn" id="codeToggle" onclick="toggleCodeMode()">📝 代码模式</button>
      <span class="code-toggle-label" id="codeLabel">文本输入</span>
    </div>
    <!-- Code editor (hidden by default) -->
    <div class="code-editor-wrap" id="codeEditorWrap">
      <div class="code-editor-toolbar">
        <select class="code-lang" id="codeLang" onchange="updateLineNumbers()">
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
          <option value="java">Java</option>
          <option value="go">Go</option>
          <option value="sql">SQL</option>
          <option value="bash">Shell</option>
          <option value="plaintext">纯文本</option>
        </select>
        <button class="code-copy" onclick="copyCode()">📋 复制</button>
        <span style="flex:1"></span>
        <span style="color:var(--text2)" id="codeCharCount">0 字符</span>
      </div>
      <div class="code-editor-body">
        <div class="line-numbers" id="lineNumbers"><span>1</span></div>
        <textarea id="codeInput" rows="6" placeholder="在这里写代码...&#10;支持 Tab 缩进" oninput="updateLineNumbers()" onkeydown="handleCodeKey(event)"></textarea>
      </div>
    </div>
    <!-- Normal text input -->
    <div class="chat-input-row" id="normalInputRow">
      <textarea class="chat-input" id="chatInput" rows="1" placeholder="输入你的回答..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="chat-send" id="btnSend" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

<script>
let sessionId = '';
let difficulty = 'medium';
let resumeContent = '';
let isStreaming = false;
let isCodeMode = false;

// ════════════════════════════════════════════════════════════
// CODE MODE
// ════════════════════════════════════════════════════════════

function toggleCodeMode() {
  isCodeMode = !isCodeMode;
  const btn = document.getElementById('codeToggle');
  const label = document.getElementById('codeLabel');
  const editorWrap = document.getElementById('codeEditorWrap');
  const normalRow = document.getElementById('normalInputRow');
  btn.classList.toggle('active', isCodeMode);
  label.textContent = isCodeMode ? '代码模式' : '文本输入';
  editorWrap.classList.toggle('show', isCodeMode);
  if (isCodeMode) {
    document.getElementById('codeInput').focus();
    updateLineNumbers();
  }
}

function updateLineNumbers() {
  const textarea = document.getElementById('codeInput');
  const lineNums = document.getElementById('lineNumbers');
  const lines = (textarea.value || '').split('\n');
  const count = Math.max(lines.length, 6);
  let html = '';
  for (let i = 1; i <= count; i++) html += `<span>${i}</span>`;
  lineNums.innerHTML = html;
  document.getElementById('codeCharCount').textContent = textarea.value.length + ' 字符';
}

function handleCodeKey(e) {
  const textarea = e.target;
  // Tab 缩进
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = textarea.selectionStart;
    textarea.value = textarea.value.substring(0, start) + '  ' + textarea.value.substring(textarea.selectionEnd);
    textarea.selectionStart = textarea.selectionEnd = start + 2;
    updateLineNumbers();
  }
  // Ctrl/Cmd + Enter 发送
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    sendMessage();
  }
}

function copyCode() {
  const code = document.getElementById('codeInput').value;
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.querySelector('.code-copy');
    btn.textContent = '✅ 已复制';
    setTimeout(() => btn.textContent = '📋 复制', 1500);
  });
}

function getCodeOrText() {
  if (isCodeMode) {
    const lang = document.getElementById('codeLang').value;
    const code = document.getElementById('codeInput').value.trim();
    if (!code) return '';
    return `[${lang} 代码]\n\`\`\`${lang}\n${code}\n\`\`\``;
  }
  return document.getElementById('chatInput').value.trim();
}

function clearInput() {
  if (isCodeMode) {
    document.getElementById('codeInput').value = '';
    updateLineNumbers();
  } else {
    document.getElementById('chatInput').value = '';
    autoResize(document.getElementById('chatInput'));
  }
}

function detectCodeQuestion(text) {
  const codeKeywords = ['算法', '代码', '编程', '实现', '手写', '写一个', '代码实现', '伪代码', '算法题', '编程题', '数据结构', '复杂度', '时间复杂度', '空间复杂度'];
  return codeKeywords.some(kw => text.includes(kw));
}

function autoDetectMode(aiText) {
  if (detectCodeQuestion(aiText) && !isCodeMode) {
    toggleCodeMode();
  }
}

// ════════════════════════════════════════════════════════════
// THEME
// ════════════════════════════════════════════════════════════

function initTheme() {
  if (localStorage.getItem('quiz-theme') === 'light') document.documentElement.classList.add('light');
}
function toggleTheme() {
  document.documentElement.classList.toggle('light');
  localStorage.setItem('quiz-theme', document.documentElement.classList.contains('light') ? 'light' : 'dark');
}
initTheme();
renderHistory();

// ════════════════════════════════════════════════════════════
// SETUP
// ════════════════════════════════════════════════════════════

function selectDiff(d) {
  difficulty = d;
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.toggle('active', b.dataset.diff === d));
}

function handleResume(input) {
  const file = input.files[0];
  if (!file) return;
  const resultDiv = document.getElementById('uploadResult');
  resultDiv.style.display = 'block';
  resultDiv.textContent = '⏳ 解析中...';
  resultDiv.style.color = 'var(--text2)';

  const formData = new FormData();
  formData.append('file', file);

  fetch('/api/upload', {method: 'POST', body: formData})
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        resultDiv.textContent = '❌ ' + data.error;
        resultDiv.style.color = 'var(--red)';
        resumeContent = '';
      } else {
        resultDiv.textContent = `✅ ${data.filename}（${data.chars} 字符）`;
        resultDiv.style.color = 'var(--green)';
        resumeContent = data.content;
      }
    })
    .catch(e => {
      resultDiv.textContent = '❌ 上传失败';
      resultDiv.style.color = 'var(--red)';
    });
}

// Drag & drop
const uz = document.getElementById('uploadZone');
uz.addEventListener('dragover', e => { e.preventDefault(); uz.style.borderColor = 'var(--orange)'; });
uz.addEventListener('dragleave', () => { uz.style.borderColor = ''; });
uz.addEventListener('drop', e => {
  e.preventDefault(); uz.style.borderColor = '';
  const fi = document.getElementById('fileInput');
  fi.files = e.dataTransfer.files;
  handleResume(fi);
});

// ════════════════════════════════════════════════════════════
// START INTERVIEW
// ════════════════════════════════════════════════════════════

async function startInterview() {
  if (!resumeContent) { alert('请先上传简历'); return; }

  const btnStart = document.getElementById('btnStart');
  if (btnStart) { btnStart.disabled = true; btnStart.textContent = '⏳ 正在准备面试...'; }

  try {
    const res = await fetch('/api/interview/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({resume: resumeContent, difficulty})
    });
    const data = await res.json();

    if (data.error) {
      alert(data.error);
      if (btnStart) { btnStart.disabled = false; btnStart.textContent = '🎯 开始面试'; }
      return;
    }

    sessionId = data.session_id;

    // 切换到聊天界面
    document.getElementById('setupScreen').style.display = 'none';
    document.getElementById('chatScreen').style.display = 'flex';
    document.getElementById('chatDiff').textContent = {easy:'简单',medium:'中等',hard:'困难',insane:'地狱'}[difficulty] + ' 难度';
    document.getElementById('inputArea').style.display = '';

    // 显示大纲
    if (data.outline && data.outline.length) {
      let outlineHtml = '';
      data.outline.forEach((item, i) => {
        outlineHtml += `<div class="outline-item"><span class="oi-num">${i+1}.</span><span><strong>${item.topic}</strong> — ${item.description}</span></div>`;
      });
      document.getElementById('outlineContent').innerHTML = outlineHtml;
      document.getElementById('outlinePanel').classList.add('show');
    }

    // AI 先发一条开场白
    addMessage('ai', '你好，我是今天的面试官。我已经看了你的简历，我们开始面试吧。');
    setTimeout(() => askFirstQuestion(), 800);

  } catch(e) {
    alert('启动失败：' + e.message);
    if (btnStart) { btnStart.disabled = false; btnStart.textContent = '🎯 开始面试'; }
  }
}

async function askFirstQuestion() {
  // 发送空消息触发 AI 问第一个问题
  await sendToAI('[面试开始]');
}

// ════════════════════════════════════════════════════════════
// CHAT
// ════════════════════════════════════════════════════════════

function addMessage(role, text) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `msg msg-${role === 'ai' ? 'ai' : 'user'}`;

  const avatar = role === 'ai' ? '🎤' : '👤';
  const time = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});

  div.innerHTML = `
    <div style="display:flex;gap:8px;${role==='user'?'flex-direction:row-reverse':''}">
      <div class="msg-avatar">${avatar}</div>
      <div>
        <div class="msg-bubble" id="bubble-${Date.now()}">${text}</div>
        <div class="msg-time">${time}</div>
      </div>
    </div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function addTypingIndicator() {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg msg-ai';
  div.id = 'typing-indicator';
  div.innerHTML = `
    <div style="display:flex;gap:8px">
      <div class="msg-avatar">🎤</div>
      <div class="msg-bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>
    </div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function removeTypingIndicator() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

async function sendMessage() {
  const text = getCodeOrText();
  if (!text || isStreaming) return;

  addMessage('user', text);
  clearInput();

  await sendToAI(text);
}

async function sendToAI(text) {
  isStreaming = true;
  document.getElementById('btnSend').disabled = true;
  addTypingIndicator();

  try {
    const res = await fetch('/api/interview/message', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: sessionId, message: text})
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let bubbleEl = null;
    let bubbleId = '';

    removeTypingIndicator();
    // 创建空的消息气泡
    const wrapper = document.createElement('div');
    wrapper.className = 'msg msg-ai';
    const time = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    bubbleId = 'bubble-stream-' + Date.now();
    wrapper.innerHTML = `
      <div style="display:flex;gap:8px">
        <div class="msg-avatar">🎤</div>
        <div>
          <div class="msg-bubble" id="${bubbleId}"></div>
          <div class="msg-time">${time}</div>
        </div>
      </div>`;
    document.getElementById('chatMessages').appendChild(wrapper);
    bubbleEl = document.getElementById(bubbleId);

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value, {stream: true});
      const lines = chunk.split('\n');
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const data = JSON.parse(line.slice(6));
          if (data.error) {
            bubbleEl.textContent = '❌ ' + data.error;
            break;
          }
          if (data.text) {
            fullText += data.text;
            bubbleEl.textContent = fullText;
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
          }
          if (data.done && data.interview_done) {
            // 面试结束，显示评价按钮
            isStreaming = false;
            document.getElementById('btnSend').disabled = false;
            showEndButton();
            return;
          }
        } catch(e) {}
      }
    }

    isStreaming = false;
    document.getElementById('btnSend').disabled = false;
    // 自动检测是否为代码题，切换输入模式
    if (fullText) autoDetectMode(fullText);

  } catch(e) {
    removeTypingIndicator();
    isStreaming = false;
    document.getElementById('btnSend').disabled = false;
    addMessage('ai', '❌ 连接出错：' + e.message);
  }
}

function showEndButton() {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.style.textAlign = 'center';
  div.style.padding = '16px';
  div.innerHTML = `<button onclick="endInterview()" style="padding:12px 32px;background:linear-gradient(135deg,var(--orange),#d97706);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer">📋 查看面试评价</button>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

async function endInterview() {
  addMessage('ai', '⏳ 正在生成面试评价...');
  document.getElementById('inputArea').style.display = 'none';

  try {
    const res = await fetch('/api/interview/evaluate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: sessionId})
    });
    const data = await res.json();

    // 移除"正在生成"消息
    const msgs = document.getElementById('chatMessages').children;
    if (msgs.length) msgs[msgs.length - 1].remove();

    if (data.error) {
      addMessage('ai', '❌ ' + data.error);
    } else {
      // 显示评价文字
      document.getElementById('evalBox').textContent = data.evaluation;
      document.getElementById('evalPanel').classList.add('show');

      // 渲染维度评分雷达图
      if (data.scores && Object.keys(data.scores).length > 0) {
        renderInterviewRadar(data.scores, data.overall, data.conclusion);
      }

      document.getElementById('evalPanel').scrollIntoView({behavior:'smooth'});

      // 保存面试记录
      const chatMsgs = [];
      document.querySelectorAll('#chatMessages .msg').forEach(el => {
        const isAI = el.classList.contains('msg-ai');
        const bubble = el.querySelector('.msg-bubble');
        if (bubble) {
          chatMsgs.push({role: isAI ? 'assistant' : 'user', content: bubble.textContent});
        }
      });
      saveHistory({
        date: new Date().toLocaleString('zh-CN'),
        difficulty: difficulty,
        messages: chatMsgs,
        evaluation: data.evaluation,
        scores: data.scores || {},
        overall: data.overall || 0,
        conclusion: data.conclusion || '',
        msgCount: chatMsgs.length,
      });

      // 显示"进入二面"按钮
      showSecondRoundBtn();
    }
  } catch(e) {
    addMessage('ai', '❌ 评价生成失败：' + e.message);
  }
}

function renderInterviewRadar(scores, overall, conclusion) {
  const evalPanel = document.getElementById('evalPanel');
  // 在 evalBox 前面插入雷达图
  const existing = document.getElementById('interviewRadarWrap');
  if (existing) existing.remove();

  const wrap = document.createElement('div');
  wrap.id = 'interviewRadarWrap';
  wrap.style.cssText = 'text-align:center;margin-bottom:16px';

  // 综合评分 + 结论
  const conclusionColor = conclusion === '通过' ? 'var(--green)' : conclusion === '不通过' ? 'var(--red)' : 'var(--orange)';
  wrap.innerHTML = `
    <div style="margin-bottom:12px">
      <span style="font-size:36px;font-weight:900;color:${conclusionColor}">${overall}/10</span>
      <span style="font-size:14px;color:var(--text2);margin-left:8px">综合评分</span>
      <span style="font-size:14px;font-weight:700;color:${conclusionColor};margin-left:12px">${conclusion}</span>
    </div>
    <div style="max-width:320px;margin:0 auto"><canvas id="interviewRadar"></canvas></div>
  `;
  evalPanel.insertBefore(wrap, document.getElementById('evalBox'));

  // 渲染雷达图
  if (!window.Chart) return;
  const labels = Object.keys(scores);
  const values = Object.values(scores);
  const isLight = document.documentElement.classList.contains('light');
  const gridColor = isLight ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.1)';
  const textColor = isLight ? '#1e293b' : '#e4e4e7';

  new Chart(document.getElementById('interviewRadar'), {
    type: 'radar',
    data: {
      labels: labels,
      datasets: [{
        label: '评分',
        data: values,
        backgroundColor: 'rgba(245,158,11,0.2)',
        borderColor: 'rgba(245,158,11,0.8)',
        borderWidth: 2,
        pointBackgroundColor: 'rgba(245,158,11,1)',
        pointBorderColor: '#fff',
        pointRadius: 4,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        r: {
          beginAtZero: true,
          max: 10,
          ticks: { stepSize: 2, color: textColor, backdropColor: 'transparent', font: { size: 10 } },
          grid: { color: gridColor },
          pointLabels: { color: textColor, font: { size: 11 } },
        }
      }
    }
  });
}

function showSecondRoundBtn() {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.style.cssText = 'text-align:center;padding:16px';
  div.innerHTML = `
    <div style="margin-bottom:10px;font-size:13px;color:var(--text2)">想要更深入的挑战？</div>
    <button onclick="startSecondRound()" style="padding:12px 32px;background:linear-gradient(135deg,var(--orange),#d97706);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer">🔥 进入二面</button>
    <div style="margin-top:6px;font-size:11px;color:var(--text2)">难度将提升，问题更深</div>
  `;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function startSecondRound() {
  // 提升难度
  const diffOrder = ['easy', 'medium', 'hard', 'insane'];
  const nextIdx = Math.min(diffOrder.indexOf(difficulty) + 1, diffOrder.length - 1);
  const newDiff = diffOrder[nextIdx];

  // 重置状态
  sessionId = null;
  interviewDone = false;
  document.getElementById('chatMessages').innerHTML = '';
  document.getElementById('evalPanel').classList.remove('show');
  const radarWrap = document.getElementById('interviewRadarWrap');
  if (radarWrap) radarWrap.remove();

  // 用新难度重新开始
  difficulty = newDiff;
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.toggle('active', b.dataset.diff === difficulty));

  // 直接开始面试（简历已在 setupData 中）
  startInterview();
}

// ════════════════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════════════════

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function toggleOutline() {
  document.getElementById('outlineContent').classList.toggle('show');
  document.getElementById('outlineArrow').classList.toggle('show');
}

// ════════════════════════════════════════════════════════════
// INTERVIEW HISTORY
// ════════════════════════════════════════════════════════════

function getHistory() {
  try { return JSON.parse(localStorage.getItem('interview-history') || '[]'); } catch { return []; }
}

function saveHistory(record) {
  const history = getHistory();
  history.unshift(record);
  if (history.length > 50) history.pop(); // 最多保留 50 条
  localStorage.setItem('interview-history', JSON.stringify(history));
}

function deleteHistory(idx) {
  const history = getHistory();
  history.splice(idx, 1);
  localStorage.setItem('interview-history', JSON.stringify(history));
  renderHistory();
}

function clearHistory() {
  if (confirm('确定清空所有面试记录？')) {
    localStorage.removeItem('interview-history');
    renderHistory();
  }
}

function renderHistory() {
  const history = getHistory();
  const list = document.getElementById('historyList');
  if (!list) return;

  if (history.length === 0) {
    list.innerHTML = '<div class="history-empty">暂无面试记录</div>';
    return;
  }

  let html = '';
  history.forEach((h, i) => {
    const diffLabel = {easy:'简单',medium:'中等',hard:'困难',insane:'地狱'}[h.difficulty] || h.difficulty;
    const evalPreview = (h.evaluation || '').substring(0, 60).replace(/\n/g, ' ');
    const scoreStr = h.overall ? `${h.overall}/10` : '';
    const conclusionStr = h.conclusion || '';
    const conclusionColor = conclusionStr === '通过' ? 'var(--green)' : conclusionStr === '不通过' ? 'var(--red)' : 'var(--orange)';
    html += `<div class="history-item" onclick="viewHistory(${i})">
      <div class="hi-left">
        <div class="hi-date">${h.date} · ${h.msgCount || 0} 轮对话</div>
        <div class="hi-info">${evalPreview || '面试进行中...'}</div>
      </div>
      ${scoreStr ? `<span style="font-size:16px;font-weight:700;color:${conclusionColor}">${scoreStr}</span>` : ''}
      <span class="hi-diff">${diffLabel}</span>
      <span class="hi-del" onclick="event.stopPropagation();deleteHistory(${i})">✕</span>
    </div>`;
  });
  list.innerHTML = html;
}

function viewHistory(idx) {
  const history = getHistory();
  const h = history[idx];
  if (!h) return;

  // 切换到聊天界面，回放对话
  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('chatScreen').style.display = 'flex';
  document.getElementById('chatDiff').textContent = {easy:'简单',medium:'中等',hard:'困难',insane:'地狱'}[h.difficulty] + ' 难度';
  document.getElementById('outlinePanel').style.display = 'none';
  document.getElementById('inputArea').style.display = 'none';

  // 回放消息
  const container = document.getElementById('chatMessages');
  container.innerHTML = '';
  (h.messages || []).forEach(msg => {
    if (msg.role === 'system') return;
    const div = document.createElement('div');
    div.className = `msg msg-${msg.role === 'assistant' ? 'ai' : 'user'}`;
    const avatar = msg.role === 'assistant' ? '🎤' : '👤';
    div.innerHTML = `
      <div style="display:flex;gap:8px;${msg.role==='user'?'flex-direction:row-reverse':''}">
        <div class="msg-avatar">${avatar}</div>
        <div>
          <div class="msg-bubble">${msg.content}</div>
        </div>
      </div>`;
    container.appendChild(div);
  });

  // 显示评价
  if (h.evaluation) {
    document.getElementById('evalBox').textContent = h.evaluation;
    document.getElementById('evalPanel').classList.add('show');

    // 渲染维度评分雷达图
    if (h.scores && Object.keys(h.scores).length > 0) {
      renderInterviewRadar(h.scores, h.overall || 0, h.conclusion || '');
    }
  }
}

function backToSetup() {
  if (confirm('确定离开面试？当前进度不会保存。')) {
    location.reload();
  }
}
