<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 仓储管家 - 智能仓库管理系统</title>
<style>
:root {
  --bg: #0b1120; --surface: #111827; --surface2: #1a2332;
  --border: #1e2d3d; --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
  --accent: #38bdf8; --green: #34d399; --orange: #fb923c; --red: #f87171;
  --purple: #a78bfa; --yellow: #fbbf24;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'PingFang SC','Microsoft YaHei',sans-serif;
  background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
  display: flex; flex-direction: column;
}

/* 顶部导航 */
header {
  height: 52px; background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 16px; gap: 16px;
  flex-shrink: 0; z-index: 10;
}
header .logo { font-weight: 700; font-size: 16px; color: var(--accent); white-space: nowrap; }
header .logo span { color: var(--text); margin-left: 4px; }
header .search {
  flex: 1; max-width: 400px; position: relative;
}
header .search input {
  width: 100%; height: 34px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); padding: 0 12px 0 34px;
  font-size: 13px; outline: none;
}
header .search input:focus { border-color: var(--accent); }
header .search .sicon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--text3); font-size: 14px;
}
header .spacer { flex: 1; }
header .stats-badge {
  font-size: 12px; padding: 4px 10px; border-radius: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px;
}
.stats-badge .dot { width: 7px; height: 7px; border-radius: 50%; }
.dot.green { background: var(--green); }
.dot.orange { background: var(--orange); }
.dot.red { background: var(--red); }

/* 主体 */
main {
  flex: 1; display: flex; overflow: hidden;
}

/* 左侧栏 */
aside {
  width: 220px; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}
aside .nav-group { padding: 12px 12px 0; }
aside .nav-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; padding: 0 8px 6px; }
aside .nav-item {
  display: flex; align-items: center; gap: 8px; padding: 9px 12px;
  border-radius: 8px; font-size: 13px; cursor: pointer; color: var(--text2);
  transition: all .15s; margin-bottom: 2px;
}
aside .nav-item:hover { background: var(--surface2); color: var(--text); }
aside .nav-item.active { background: rgba(56,189,248,.12); color: var(--accent); }
aside .nav-item .badge {
  margin-left: auto; font-size: 10px; padding: 2px 7px; border-radius: 10px;
  background: rgba(248,113,113,.2); color: var(--red);
}

/* 内容区 */
.content {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
}

/* 指标栏 */
.metrics {
  display: flex; gap: 12px; padding: 14px 16px; flex-shrink: 0;
  overflow-x: auto;
}
.metric-card {
  flex: 1; min-width: 150px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px;
}
.metric-card .m-label { font-size: 11px; color: var(--text3); margin-bottom: 6px; }
.metric-card .m-value { font-size: 26px; font-weight: 700; }
.metric-card .m-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }
.m-value.accent { color: var(--accent); }
.m-value.green { color: var(--green); }
.m-value.orange { color: var(--orange); }
.m-value.purple { color: var(--purple); }

/* 主面板 */
.panels {
  flex: 1; display: flex; gap: 12px; padding: 0 16px 16px; overflow: hidden;
}

/* 仓库地图 */
.warehouse-map {
  flex: 1.5; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; display: flex; flex-direction: column; min-width: 0;
}
.warehouse-map .panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
}
.warehouse-map .panel-header h3 { font-size: 14px; }
.warehouse-map .legend { display: flex; gap: 12px; font-size: 11px; color: var(--text3); }
.legend span { display: flex; align-items: center; gap: 4px; }
.legend .swatch { width: 10px; height: 10px; border-radius: 2px; }
.swatch.empty { background: #1e2d3d; border: 1px solid #2d3d4d; }
.swatch.used { background: rgba(56,189,248,.3); border: 1px solid rgba(56,189,248,.5); }
.swatch.low { background: rgba(251,146,60,.3); border: 1px solid rgba(251,146,60,.5); }
.swatch.full { background: rgba(52,211,153,.3); border: 1px solid rgba(52,211,153,.5); }

.map-grid {
  flex: 1; padding: 16px; display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(5, 1fr);
  gap: 6px; overflow: auto;
}
.map-cell {
  border-radius: 6px; border: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; transition: all .2s; position: relative; font-size: 11px;
  text-align: center; padding: 4px; min-height: 70px;
}
.map-cell:hover { border-color: var(--accent); transform: scale(1.03); z-index: 2; }
.map-cell.empty { background: #151d2b; color: var(--text3); }
.map-cell.normal { background: rgba(56,189,248,.08); border-color: rgba(56,189,248,.25); }
.map-cell.low { background: rgba(251,146,60,.08); border-color: rgba(251,146,60,.25); }
.map-cell.full { background: rgba(52,211,153,.08); border-color: rgba(52,211,153,.25); }
.map-cell .cell-id { font-size: 10px; color: var(--text3); position: absolute; top: 4px; left: 6px; }
.map-cell .cell-name { font-weight: 600; font-size: 11px; margin-top: 4px; }
.map-cell .cell-qty { font-size: 10px; color: var(--text3); margin-top: 2px; }

/* 库存表格 */
.inventory-panel {
  flex: 1; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; display: flex; flex-direction: column; min-width: 0;
}
.inventory-panel .panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
}
.inventory-panel .panel-header h3 { font-size: 14px; }
.btn {
  padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer;
  font-size: 12px; font-weight: 600; transition: all .15s;
}
.btn-primary { background: var(--accent); color: #0b1120; }
.btn-primary:hover { opacity: .9; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text2); }
.btn-outline:hover { border-color: var(--accent); color: var(--text); }
.btn-sm { padding: 4px 10px; font-size: 11px; }
.btn-danger { background: rgba(248,113,113,.15); color: var(--red); border: 1px solid rgba(248,113,113,.25); }
.btn-danger:hover { background: rgba(248,113,113,.25); }

.table-wrap { flex: 1; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
table th {
  position: sticky; top: 0; background: var(--surface); text-align: left;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  color: var(--text3); font-weight: 600; font-size: 11px; z-index: 1;
}
table td { padding: 9px 14px; border-bottom: 1px solid var(--border); }
table tr:hover td { background: rgba(56,189,248,.03); }
table .status {
  display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600;
}
.status-normal { background: rgba(52,211,153,.15); color: var(--green); }
.status-low { background: rgba(251,146,60,.15); color: var(--orange); }
.status-out { background: rgba(248,113,113,.15); color: var(--red); }
.actions { display: flex; gap: 6px; }

/* AI 建议面板 */
.ai-panel {
  width: 280px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; display: flex; flex-direction: column; flex-shrink: 0;
}
.ai-panel .panel-header {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.ai-panel .panel-header h3 { font-size: 14px; }
.ai-badge {
  font-size: 10px; padding: 2px 8px; border-radius: 10px;
  background: rgba(167,139,250,.15); color: var(--purple);
}
.ai-suggestions { flex: 1; overflow: auto; padding: 12px; }
.ai-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; margin-bottom: 8px;
}
.ai-card .ai-type {
  font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
  margin-bottom: 4px;
}
.ai-type.warn { color: var(--orange); }
.ai-type.info { color: var(--accent); }
.ai-type.tip { color: var(--green); }
.ai-card .ai-msg { font-size: 12px; color: var(--text); line-height: 1.5; }
.ai-card .ai-action {
  margin-top: 8px; font-size: 11px; color: var(--accent); cursor: pointer;
}
.ai-card .ai-action:hover { text-decoration: underline; }

/* 模态框 */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.6); z-index: 100; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 24px; width: 420px; max-height: 80vh; overflow: auto;
}
.modal h3 { font-size: 16px; margin-bottom: 16px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.form-group input, .form-group select {
  width: 100%; height: 36px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); padding: 0 10px; font-size: 13px;
  outline: none;
}
.form-group input:focus, .form-group select:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

/* 页签切换 */
.tabs { display: none; }
</style>
</head>
<body>

<!-- 顶部导航 -->
<header>
  <div class="logo">&#x1F4E6; AI<span>仓储管家</span></div>
  <div class="search">
    <span class="sicon">&#x1F50D;</span>
    <input type="text" placeholder="搜索物料名称、编号或库位..." oninput="filterInventory()" id="searchInput">
  </div>
  <div class="spacer"></div>
  <div class="stats-badge"><span class="dot green"></span> 系统运行中</div>
  <div class="stats-badge" id="alertBadge"><span class="dot orange"></span> 预警 <strong id="alertCount">0</strong></div>
</header>

<!-- 主体 -->
<main>
  <!-- 左侧导航 -->
  <aside>
    <div class="nav-group">
      <div class="nav-label">功能菜单</div>
      <div class="nav-item active" onclick="switchTab('dashboard', this)">
        &#x1F4CA; 仪表盘
      </div>
      <div class="nav-item" onclick="switchTab('warehouse', this)">
        &#x1F3ED; 仓库地图
      </div>
      <div class="nav-item" onclick="switchTab('inventory', this)">
        &#x1F4E6; 库存管理
        <span class="badge" id="lowStockBadge">0</span>
      </div>
    </div>
    <div class="nav-group">
      <div class="nav-label">AI 功能</div>
      <div class="nav-item" onclick="switchTab('predict', this)">
        &#x1F4C8; 需求预测
      </div>
      <div class="nav-item" onclick="switchTab('suggest', this)">
        &#x1F4AC; 智能建议
      </div>
    </div>
    <div style="margin-top:auto;padding:12px;border-top:1px solid var(--border);">
      <div style="font-size:11px;color:var(--text3);text-align:center;">
        学习工作赛道<br>创意参赛作品
      </div>
    </div>
  </aside>

  <!-- 内容区 -->
  <div class="content" id="dashboardView">
    <!-- 指标栏 -->
    <div class="metrics">
      <div class="metric-card">
        <div class="m-label">库存物料种类</div>
        <div class="m-value accent" id="totalTypes">-</div>
        <div class="m-sub">管理中的物料类型</div>
      </div>
      <div class="metric-card">
        <div class="m-label">库存总量</div>
        <div class="m-value green" id="totalQty">-</div>
        <div class="m-sub">所有库位物料合计</div>
      </div>
      <div class="metric-card">
        <div class="m-label">库位使用率</div>
        <div class="m-value purple" id="usageRate">-</div>
        <div class="m-sub">已用库位 / 总库位</div>
      </div>
      <div class="metric-card">
        <div class="m-label">低库存预警</div>
        <div class="m-value orange" id="lowStockCount">-</div>
        <div class="m-sub">低于安全库存的物料</div>
      </div>
    </div>

    <!-- 主面板 -->
    <div class="panels">
      <!-- 仓库地图 -->
      <div class="warehouse-map">
        <div class="panel-header">
          <h3>&#x1F3ED; 仓库数字孪生地图</h3>
          <div class="legend">
            <span><span class="swatch empty"></span>空闲</span>
            <span><span class="swatch used"></span>正常</span>
            <span><span class="swatch low"></span>低库存</span>
            <span><span class="swatch full"></span>充足</span>
          </div>
        </div>
        <div class="map-grid" id="mapGrid"></div>
      </div>

      <!-- 库存表格 -->
      <div class="inventory-panel">
        <div class="panel-header">
          <h3>&#x1F4CB; 库存清单</h3>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-outline btn-sm" onclick="exportCSV()">导出</button>
            <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ 新增物料</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>编号</th><th>物料名称</th><th>库位</th><th>当前库存</th><th>安全库存</th><th>状态</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="inventoryBody"></tbody>
          </table>
        </div>
      </div>

      <!-- AI 建议面板 -->
      <div class="ai-panel">
        <div class="panel-header">
          <h3>&#x1F916; AI 智能建议</h3>
          <span class="ai-badge">实时</span>
        </div>
        <div class="ai-suggestions" id="aiSuggestions"></div>
      </div>
    </div>
  </div>
</main>

<!-- 新增/编辑物料弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">新增物料</h3>
    <input type="hidden" id="editIndex" value="-1">
    <div class="form-group">
      <label>物料编号</label>
      <input type="text" id="fCode" placeholder="如 MAT-001">
    </div>
    <div class="form-group">
      <label>物料名称</label>
      <input type="text" id="fName" placeholder="如 高强度螺栓 M12">
    </div>
    <div class="form-group">
      <label>库位编号</label>
      <select id="fLocation"></select>
    </div>
    <div class="form-group">
      <label>当前库存数量</label>
      <input type="number" id="fQty" placeholder="0" min="0">
    </div>
    <div class="form-group">
      <label>安全库存阈值</label>
      <input type="number" id="fSafe" placeholder="如 100" min="0">
    </div>
    <div class="form-group">
      <label>最大库存容量</label>
      <input type="number" id="fMax" placeholder="如 1000" min="1">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveItem()">保存</button>
    </div>
  </div>
</div>

<script>
// ========== 数据模型 ==========
const ROWS = 5, COLS = 8;
const rowLabels = ['A','B','C','D','E'];
let inventory = [
  { code:'MAT-001', name:'高强度螺栓 M12', loc:'A3', qty:450, safe:100, max:800 },
  { code:'MAT-002', name:'不锈钢法兰 DN50', loc:'B2', qty:80,  safe:150, max:400 },
  { code:'MAT-003', name:'轴承 6205-2RS', loc:'C5', qty:320, safe:100, max:500 },
  { code:'MAT-004', name:'液压油 46# 200L', loc:'D1', qty:12,  safe:20,  max:50 },
  { code:'MAT-005', name:'钢板 Q235 10mm', loc:'A6', qty:200, safe:80,  max:300 },
  { code:'MAT-006', name:'电机 5.5kW 4P', loc:'E3', qty:25,  safe:15,  max:60 },
  { code:'MAT-007', name:'焊接电极 3.2mm', loc:'B5', qty:600, safe:200, max:1000 },
  { code:'MAT-008', name:'密封圈 NBR 50x3', loc:'C1', qty:55,  safe:100, max:500 },
  { code:'MAT-009', name:'铜管 15x1.5mm', loc:'D4', qty:0,   safe:50,  max:200 },
  { code:'MAT-010', name:'PLC控制器 FX5U', loc:'E1', qty:8,   safe:5,   max:20 },
  { code:'MAT-011', name:'链条 16B-1', loc:'A1', qty:150, safe:60,  max:300 },
  { code:'MAT-012', name:'减速机 RV40', loc:'B7', qty:18,  safe:10,  max:40 },
];

// ========== 工具函数 ==========
function getLocKey(r,c) { return rowLabels[r]+(c+1); }
function getItemAtLoc(loc) { return inventory.find(i=>i.loc===loc); }
function getStatus(qty, safe) {
  if (qty <= 0) return 'out';
  if (qty < safe) return 'low';
  return 'normal';
}
function getStatusLabel(s) {
  if (s==='out') return '缺货';
  if (s==='low') return '低库存';
  return '正常';
}
function getStatusClass(s) {
  if (s==='out') return 'status-out';
  if (s==='low') return 'status-low';
  return 'status-normal';
}
function getCellClass(item) {
  if (!item) return 'empty';
  if (item.qty <= 0) return 'low';
  if (item.qty < item.safe) return 'low';
  if (item.qty > item.safe * 1.5) return 'full';
  return 'normal';
}

// ========== 渲染仓库地图 ==========
function renderMap() {
  const grid = document.getElementById('mapGrid');
  grid.innerHTML = '';
  for (let r=0; r<ROWS; r++) {
    for (let c=0; c<COLS; c++) {
      const loc = getLocKey(r,c);
      const item = getItemAtLoc(loc);
      const cls = 'map-cell ' + getCellClass(item);
      const cell = document.createElement('div');
      cell.className = cls;
      cell.title = item
        ? `${item.name}\n库存: ${item.qty} | 安全库存: ${item.safe} | 库位: ${loc}`
        : `库位 ${loc} - 空闲`;
      cell.innerHTML = `<span class="cell-id">${loc}</span>`
        + (item ? `<span class="cell-name">${item.name.length>8?item.name.slice(0,8)+'…':item.name}</span><span class="cell-qty">${item.qty} / ${item.max}</span>` : '<span class="cell-name">空闲</span>');
      cell.onclick = ()=>onCellClick(loc, item);
      grid.appendChild(cell);
    }
  }
}

function onCellClick(loc, item) {
  if (item) {
    // 找到对应行并高亮
    filterByLoc(loc);
    switchTab('inventory', document.querySelectorAll('.nav-item')[2]);
  } else {
    // 空闲库位，提示新增
    if (confirm(`库位 ${loc} 为空，是否在此新增物料？`)) {
      openAddModal(loc);
    }
  }
}

function filterByLoc(loc) {
  document.getElementById('searchInput').value = loc;
  filterInventory();
}

// ========== 渲染库存表格 ==========
function renderInventory(items) {
  const tbody = document.getElementById('inventoryBody');
  const data = items || inventory;
  tbody.innerHTML = data.map((item, idx) => {
    const status = getStatus(item.qty, item.safe);
    const globalIdx = inventory.indexOf(item);
    return `<tr>
      <td>${item.code}</td>
      <td><strong>${item.name}</strong></td>
      <td>${item.loc}</td>
      <td>${item.qty}</td>
      <td>${item.safe}</td>
      <td><span class="status ${getStatusClass(status)}">${getStatusLabel(status)}</span></td>
      <td class="actions">
        <button class="btn btn-outline btn-sm" onclick="editItem(${globalIdx})">编辑</button>
        <button class="btn btn-outline btn-sm" onclick="quickIn(${globalIdx})">+入库</button>
        <button class="btn btn-outline btn-sm" onclick="quickOut(${globalIdx})">-出库</button>
        <button class="btn btn-danger btn-sm" onclick="deleteItem(${globalIdx})">删除</button>
      </td>
    </tr>`;
  }).join('');
}

function filterInventory() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = inventory.filter(i =>
    i.code.toLowerCase().includes(q) ||
    i.name.toLowerCase().includes(q) ||
    i.loc.toLowerCase().includes(q)
  );
  renderInventory(filtered);
}

// ========== AI 建议生成 ==========
function generateAISuggestions() {
  const suggestions = [];
  // 低库存预警
  const lowItems = inventory.filter(i => i.qty < i.safe);
  lowItems.forEach(i => {
    const need = i.safe - i.qty;
    suggestions.push({
      type:'warn', label:'补货预警',
      msg:`<strong>${i.name}</strong>（${i.loc}）当前库存 ${i.qty}，低于安全库存 ${i.safe}。建议立即补货 <strong>${need}</strong> 件，预计 ${Math.ceil(need/50)} 天后将影响生产。`,
      action:`一键生成采购计划 →`
    });
  });
  // 缺货预警
  const zeroItems = inventory.filter(i => i.qty <= 0);
  zeroItems.forEach(i => {
    suggestions.push({
      type:'warn', label:'紧急缺货',
      msg:`<strong>${i.name}</strong>（${i.loc}）已断货！该物料关联 3 条产线，请立即安排采购。`,
      action:`查看替代物料 →`
    });
  });
  // 健康建议
  const healthyItems = inventory.filter(i => i.qty > i.safe * 1.2 && i.qty > 0);
  if (healthyItems.length > 3) {
    suggestions.push({
      type:'tip', label:'库存优化',
      msg:`检测到 ${healthyItems.length} 种物料库存偏高，AI 建议将部分库存降至 1.2 倍安全线，可释放约 <strong>${healthyItems.reduce((s,i)=>s+Math.floor(i.qty-i.safe*1.2),0)}</strong> 件库存空间。`,
      action:`查看优化方案 →`
    });
  }
  // 预测
  const totalDemand = inventory.reduce((s,i)=>s+(i.max-i.qty),0);
  if (totalDemand > 0) {
    suggestions.push({
      type:'info', label:'需求预测',
      msg:`基于历史消耗数据和生产计划，AI 预测未来 7 天将有 <strong>${Math.floor(totalDemand*0.3)}</strong> 件物料消耗需求，建议提前备货。`,
      action:`查看详细预测 →`
    });
  }
  // 空间优化
  const occupied = inventory.filter(i=>i.qty>0).length;
  const total = ROWS*COLS;
  if (occupied/total > 0.7) {
    suggestions.push({
      type:'info', label:'空间预警',
      msg:`仓库使用率已达 <strong>${Math.round(occupied/total*100)}%</strong>，建议重新规划库位布局或启动呆滞物料清理。`,
      action:`查看空间优化建议 →`
    });
  }
  return suggestions;
}

function renderAISuggestions() {
  const container = document.getElementById('aiSuggestions');
  const suggestions = generateAISuggestions();
  container.innerHTML = suggestions.map(s => `
    <div class="ai-card">
      <div class="ai-type ${s.type}">${s.label}</div>
      <div class="ai-msg">${s.msg}</div>
      <div class="ai-action" onclick="alert('AI建议详情（Demo演示）')">${s.action}</div>
    </div>
  `).join('');
  document.getElementById('alertCount').textContent = inventory.filter(i=>i.qty<i.safe).length;
  document.getElementById('lowStockBadge').textContent = inventory.filter(i=>i.qty<i.safe).length;
}

// ========== 仪表盘数据 ==========
function updateDashboard() {
  document.getElementById('totalTypes').textContent = inventory.length;
  document.getElementById('totalQty').textContent = inventory.reduce((s,i)=>s+i.qty,0).toLocaleString();
  const occupied = inventory.filter(i=>i.qty>0).length;
  document.getElementById('usageRate').textContent = Math.round(occupied/(ROWS*COLS)*100)+'%';
  document.getElementById('lowStockCount').textContent = inventory.filter(i=>i.qty<i.safe).length;
}

// ========== CRUD 操作 ==========
function openAddModal(loc) {
  document.getElementById('modalTitle').textContent = '新增物料';
  document.getElementById('editIndex').value = '-1';
  document.getElementById('fCode').value = 'MAT-' + String(inventory.length+1).padStart(3,'0');
  document.getElementById('fName').value = '';
  document.getElementById('fQty').value = '0';
  document.getElementById('fSafe').value = '50';
  document.getElementById('fMax').value = '500';
  populateLocationSelect(loc);
  document.getElementById('modalOverlay').classList.add('show');
}

function editItem(idx) {
  const item = inventory[idx];
  document.getElementById('modalTitle').textContent = '编辑物料';
  document.getElementById('editIndex').value = idx;
  document.getElementById('fCode').value = item.code;
  document.getElementById('fName').value = item.name;
  document.getElementById('fQty').value = item.qty;
  document.getElementById('fSafe').value = item.safe;
  document.getElementById('fMax').value = item.max;
  populateLocationSelect(item.loc);
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function populateLocationSelect(selected) {
  const sel = document.getElementById('fLocation');
  sel.innerHTML = '';
  for (let r=0; r<ROWS; r++) {
    for (let c=0; c<COLS; c++) {
      const loc = getLocKey(r,c);
      const existing = getItemAtLoc(loc);
      const opt = document.createElement('option');
      opt.value = loc;
      opt.textContent = loc + (existing ? ` (已占用: ${existing.name})` : ' (空闲)');
      if (loc === selected) opt.selected = true;
      sel.appendChild(opt);
    }
  }
}

function saveItem() {
  const idx = parseInt(document.getElementById('editIndex').value);
  const item = {
    code: document.getElementById('fCode').value.trim(),
    name: document.getElementById('fName').value.trim(),
    loc: document.getElementById('fLocation').value,
    qty: parseInt(document.getElementById('fQty').value) || 0,
    safe: parseInt(document.getElementById('fSafe').value) || 0,
    max: parseInt(document.getElementById('fMax').value) || 500,
  };
  if (!item.code || !item.name) { alert('请填写物料编号和名称'); return; }
  // 检查库位冲突
  const conflict = inventory.find((inv,i)=>inv.loc===item.loc && i!==idx);
  if (conflict) { alert(`库位 ${item.loc} 已被「${conflict.name}」占用，请选择其他库位`); return; }

  if (idx >= 0) {
    inventory[idx] = item;
  } else {
    inventory.push(item);
  }
  closeModal();
  refreshAll();
}

function deleteItem(idx) {
  const item = inventory[idx];
  if (!confirm(`确认删除「${item.name}」（${item.loc}）？`)) return;
  inventory.splice(idx, 1);
  refreshAll();
}

function quickIn(idx) {
  const qty = prompt('入库数量:', '10');
  if (qty === null) return;
  const n = parseInt(qty);
  if (isNaN(n) || n <= 0) { alert('请输入有效数量'); return; }
  inventory[idx].qty += n;
  refreshAll();
}

function quickOut(idx) {
  const qty = prompt('出库数量:', '10');
  if (qty === null) return;
  const n = parseInt(qty);
  if (isNaN(n) || n <= 0) { alert('请输入有效数量'); return; }
  if (n > inventory[idx].qty) { alert('出库数量不能超过当前库存'); return; }
  inventory[idx].qty -= n;
  refreshAll();
}

function exportCSV() {
  let csv = '编号,物料名称,库位,当前库存,安全库存,最大容量\n';
  inventory.forEach(i => csv += `${i.code},${i.name},${i.loc},${i.qty},${i.safe},${i.max}\n`);
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='库存报表.csv'; a.click();
  URL.revokeObjectURL(url);
}

// ========== 标签切换 ==========
function switchTab(tab, el) {
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if (el) el.classList.add('active');

  if (tab === 'inventory') {
    document.getElementById('searchInput').value = '';
    filterInventory();
  }
}

// ========== 全局刷新 ==========
function refreshAll() {
  renderMap();
  filterInventory();
  renderAISuggestions();
  updateDashboard();
}

// ========== 初始化 ==========
refreshAll();

// 关闭弹窗（点击遮罩）
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
</script>
</body>
</html>
