<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泡泡心击 BubbleMind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:'Quicksand',sans-serif; user-select:none; }
  body { cursor:none; }

  /* ========== 通用背景 ========== */
  #bg-canvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; }

  /* ========== 开始页 ========== */
  #start-screen {
    position:fixed; top:0; left:0; width:100%; height:100%; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:32px; transition:opacity 0.5s ease;
  }
  #start-screen.hidden { opacity:0; pointer-events:none; }

  .game-title {
    font-family:'ZCOOL KuaiLe',cursive; font-size:72px; color:#5A3E5C;
    text-shadow:3px 3px 0 #FFB5C5, 6px 6px 20px rgba(0,0,0,0.1);
    animation:titleFloat 3s ease-in-out infinite;
  }
  .game-subtitle {
    font-size:18px; color:#7B6B7E; letter-spacing:4px; margin-top:-16px;
  }
  @keyframes titleFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

  .mode-buttons { display:flex; gap:24px; margin-top:12px; }
  .mode-btn {
    padding:18px 42px; font-size:22px; font-family:'Quicksand',sans-serif; font-weight:600;
    border:none; border-radius:24px; cursor:pointer; transition:all 0.3s ease;
    box-shadow:0 6px 0 rgba(0,0,0,0.12), 0 8px 20px rgba(0,0,0,0.08);
  }
  .mode-btn:hover { transform:translateY(-3px); box-shadow:0 9px 0 rgba(0,0,0,0.12), 0 12px 24px rgba(0,0,0,0.12); }
  .mode-btn:active { transform:translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,0.12), 0 4px 10px rgba(0,0,0,0.08); }
  .btn-timed { background:linear-gradient(135deg,#A8D8EA,#79C7D9); color:#fff; }
  .btn-endless { background:linear-gradient(135deg,#FFB5C5,#FF9AAC); color:#fff; }

  .high-score-display {
    display:flex; gap:32px; margin-top:8px;
    background:rgba(255,255,255,0.5); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    padding:16px 36px; border-radius:20px; border:1px solid rgba(255,255,255,0.6);
  }
  .hs-item { text-align:center; }
  .hs-label { font-size:13px; color:#998A9E; margin-bottom:4px; }
  .hs-value { font-size:28px; font-weight:700; color:#5A3E5C; }

  .level-badge {
    position:absolute; top:24px; right:24px;
    background:rgba(255,255,255,0.6); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    padding:12px 20px; border-radius:16px; border:1px solid rgba(255,255,255,0.6);
    text-align:center; transition:all 0.3s ease;
  }
  .level-badge .lv-name { font-size:16px; font-weight:700; color:#5A3E5C; }
  .level-badge .lv-progress { font-size:11px; color:#998A9E; margin-top:2px; }

  /* ========== 呼吸引导 ========== */
  #breath-screen {
    position:fixed; top:0; left:0; width:100%; height:100%; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; background:rgba(224,247,250,0.85); backdrop-filter:blur(8px);
    opacity:0; pointer-events:none; transition:opacity 0.6s ease;
  }
  #breath-screen.visible { opacity:1; pointer-events:auto; }
  .breath-circle {
    width:120px; height:120px; border-radius:50%;
    background:radial-gradient(circle,#A8D8EA,#79C7D9);
    box-shadow:0 0 40px rgba(168,216,234,0.6);
    transition:transform 2s ease-in-out;
  }
  .breath-text { font-size:24px; color:#5A3E5C; font-weight:500; }
  .breath-count { font-size:48px; font-weight:700; color:#79C7D9; }

  /* ========== 游戏HUD ========== */
  #game-screen { position:fixed; top:0; left:0; width:100%; height:100%; z-index:5; opacity:0; pointer-events:none; transition:opacity 0.4s ease; }
  #game-screen.visible { opacity:1; pointer-events:auto; }
  #game-canvas { position:absolute; top:0; left:0; width:100%; height:100%; }

  #hud {
    position:absolute; top:0; left:0; width:100%; padding:16px 24px;
    display:flex; justify-content:space-between; align-items:center;
    background:linear-gradient(180deg,rgba(255,255,255,0.7),rgba(255,255,255,0));
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    pointer-events:none; z-index:6;
  }
  .hud-item { display:flex; align-items:center; gap:8px; }
  .hud-label { font-size:13px; color:#998A9E; }
  .hud-value { font-size:28px; font-weight:700; color:#5A3E5C; min-width:40px; }
  #hud-score .hud-value { color:#E8915C; }
  #hud-combo .hud-value { color:#D65A8E; }
  #hud-time .hud-value { color:#5A9CC7; }
  #hud-lives .hud-value { color:#E87A7A; }

  .combo-flash { animation:comboFlash 0.4s ease; }
  @keyframes comboFlash { 0%{transform:scale(1)} 50%{transform:scale(1.4)} 100%{transform:scale(1)} }

  /* ========== 准星 ========== */
  #crosshair {
    position:fixed; width:40px; height:40px; z-index:100; pointer-events:none;
    transform:translate(-50%,-50%); transition:opacity 0.2s ease;
  }
  #crosshair::before, #crosshair::after {
    content:''; position:absolute; background:#5A3E5C; border-radius:2px;
  }
  #crosshair::before { width:2px; height:40px; left:19px; top:0; }
  #crosshair::after { width:40px; height:2px; left:0; top:19px; }
  #crosshair .ch-ring {
    position:absolute; width:28px; height:28px; border:2px solid #5A3E5C;
    border-radius:50%; left:6px; top:6px; transition:all 0.15s ease;
  }
  #crosshair.aiming .ch-ring { border-color:#E85A5A; width:34px; height:34px; left:3px; top:3px; }
  #crosshair.shooting .ch-ring { transform:scale(0.7); }

  /* ========== 鼓励语 ========== */
  #encouragement-layer { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:7; overflow:hidden; }
  .encouragement-text {
    position:absolute; font-family:'ZCOOL KuaiLe',cursive; font-size:32px;
    text-shadow:2px 2px 0 rgba(255,255,255,0.8);
    animation:encourageFloat 1.5s ease-out forwards; white-space:nowrap;
  }
  @keyframes encourageFloat {
    0% { opacity:0; transform:translateY(0) scale(0.5); }
    20% { opacity:1; transform:translateY(-20px) scale(1.1); }
    100% { opacity:0; transform:translateY(-80px) scale(1); }
  }

  /* ========== 结算页 ========== */
  #results-screen {
    position:fixed; top:0; left:0; width:100%; height:100%; z-index:15;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; opacity:0; pointer-events:none; transition:opacity 0.5s ease;
    background:rgba(224,247,250,0.8); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  #results-screen.visible { opacity:1; pointer-events:auto; }
  .results-title { font-family:'ZCOOL KuaiLe',cursive; font-size:48px; color:#5A3E5C; }
  .stats-grid { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; }
  .stat-card {
    background:rgba(255,255,255,0.7); padding:18px 28px; border-radius:18px;
    border:1px solid rgba(255,255,255,0.8); text-align:center; min-width:120px;
  }
  .stat-card .sc-label { font-size:13px; color:#998A9E; margin-bottom:6px; }
  .stat-card .sc-value { font-size:32px; font-weight:700; color:#5A3E5C; }
  #trend-canvas { border-radius:16px; background:rgba(255,255,255,0.5); }
  .achievement-popup {
    background:linear-gradient(135deg,#FFEAA7,#FFD970); padding:12px 24px; border-radius:16px;
    font-size:16px; color:#8B6914; font-weight:600; box-shadow:0 4px 12px rgba(255,217,112,0.4);
    animation:achPop 0.5s ease;
  }
  @keyframes achPop { 0%{transform:scale(0);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .results-buttons { display:flex; gap:16px; margin-top:8px; }
  .results-btn {
    padding:14px 32px; font-size:18px; font-weight:600; border:none; border-radius:18px;
    cursor:pointer; transition:all 0.3s ease; box-shadow:0 4px 0 rgba(0,0,0,0.12);
  }
  .results-btn:hover { transform:translateY(-2px); box-shadow:0 6px 0 rgba(0,0,0,0.12); }
  .results-btn:active { transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,0.12); }
  .btn-replay { background:linear-gradient(135deg,#B5EAD7,#8FD9B6); color:#fff; }
  .btn-menu { background:linear-gradient(135deg,#A8D8EA,#79C7D9); color:#fff; }

  /* ========== 升级动画 ========== */
  #levelup-screen {
    position:fixed; top:0; left:0; width:100%; height:100%; z-index:30;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.5s ease;
  }
  #levelup-screen.visible { opacity:1; }
  .levelup-content {
    text-align:center; animation:levelupPop 1s ease;
  }
  .levelup-content .lu-title { font-family:'ZCOOL KuaiLe',cursive; font-size:42px; color:#E8915C; }
  .levelup-content .lu-name { font-size:36px; font-weight:700; color:#5A3E5C; margin-top:8px; }
  @keyframes levelupPop { 0%{transform:scale(0)} 60%{transform:scale(1.2)} 100%{transform:scale(1)} }

  /* ========== 飘字 ========== */
  .score-popup {
    position:absolute; font-size:22px; font-weight:700; pointer-events:none;
    animation:scorePop 0.8s ease-out forwards; z-index:8;
  }
  @keyframes scorePop {
    0% { opacity:1; transform:translateY(0); }
    100% { opacity:0; transform:translateY(-50px); }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- ========== 开始页 ========== -->
<div id="start-screen">
  <div class="level-badge" id="level-badge">
    <div class="lv-name" id="lv-name">新手</div>
    <div class="lv-progress" id="lv-progress">0 / 500</div>
  </div>
  <div class="game-title">泡泡心击</div>
  <div class="game-subtitle">BUBBLE MIND · 反应力训练与压力释放</div>
  <div class="mode-buttons">
    <button class="mode-btn btn-timed" onclick="startGame('timed')">限时挑战 60s</button>
    <button class="mode-btn btn-endless" onclick="startGame('endless')">无尽模式</button>
  </div>
  <div class="high-score-display">
    <div class="hs-item">
      <div class="hs-label">限时最高分</div>
      <div class="hs-value" id="hs-timed">0</div>
    </div>
    <div class="hs-item">
      <div class="hs-label">无尽最高分</div>
      <div class="hs-value" id="hs-endless">0</div>
    </div>
    <div class="hs-item">
      <div class="hs-label">累计击落</div>
      <div class="hs-value" id="hs-total">0</div>
    </div>
  </div>
</div>

<!-- ========== 呼吸引导 ========== -->
<div id="breath-screen">
  <div class="breath-circle" id="breath-circle"></div>
  <div class="breath-text" id="breath-text">深呼吸，放松一下</div>
  <div class="breath-count" id="breath-count">3</div>
</div>

<!-- ========== 游戏画面 ========== -->
<div id="game-screen">
  <canvas id="game-canvas"></canvas>
  <div id="hud">
    <div class="hud-item" id="hud-score">
      <span class="hud-label">分数</span>
      <span class="hud-value" id="score-val">0</span>
    </div>
    <div class="hud-item" id="hud-combo">
      <span class="hud-label">连击</span>
      <span class="hud-value" id="combo-val">0</span>
    </div>
    <div class="hud-item" id="hud-time">
      <span class="hud-label" id="time-label">时间</span>
      <span class="hud-value" id="time-val">60</span>
    </div>
  </div>
  <div id="encouragement-layer"></div>
</div>

<!-- ========== 准星 ========== -->
<div id="crosshair"><div class="ch-ring"></div></div>

<!-- ========== 结算页 ========== -->
<div id="results-screen">
  <div class="results-title" id="results-title">本局结束</div>
  <div class="stats-grid" id="stats-grid"></div>
  <canvas id="trend-canvas" width="500" height="180"></canvas>
  <div id="achievement-area"></div>
  <div class="results-buttons">
    <button class="results-btn btn-replay" onclick="replayGame()">再来一局</button>
    <button class="results-btn btn-menu" onclick="backToMenu()">返回菜单</button>
  </div>
</div>

<!-- ========== 升级动画 ========== -->
<div id="levelup-screen">
  <div class="levelup-content">
    <div class="lu-title">等级提升</div>
    <div class="lu-name" id="lu-name"></div>
  </div>
</div>

<script>
// ============================================================
//  泡泡心击 BubbleMind - 游戏引擎
// ============================================================

// ---- 配色常量 ----
const COLORS = {
  pink:   '#FFB5C5',
  blue:   '#A8D8EA',
  yellow: '#FFEAA7',
  green:  '#B5EAD7',
  gold:   '#FFD700',
  bomb:   '#4A4A4A',
  bgTop:  '#E0F7FA',
  bgBot:  '#B2EBF2'
};
const BALLOON_COLORS = [COLORS.pink, COLORS.blue, COLORS.yellow, COLORS.green];

// ---- 等级配置 ----
const LEVELS = [
  { name:'新手',   min:0 },
  { name:'学徒',   min:500 },
  { name:'达人',   min:1500 },
  { name:'大师',   min:4000 },
  { name:'传奇',   min:10000 }
];

// ---- 成就配置 ----
const ACHIEVEMENTS = [
  { id:'first_game',   name:'初次登场',   desc:'完成第一局游戏',      check:(s)=>s.totalGames>=1 },
  { id:'combo_10',     name:'连击高手',   desc:'达成 10 连击',        check:(s)=>s.maxComboEver>=10 },
  { id:'combo_20',     name:'专注达人',   desc:'达成 20 连击',        check:(s)=>s.maxComboEver>=20 },
  { id:'score_500',    name:'飞碟猎手',   desc:'单局获得 500 分',     check:(s)=>s.maxScoreTimed>=500||s.maxScoreEndless>=500 },
  { id:'score_1000',   name:'神枪手',     desc:'单局获得 1000 分',    check:(s)=>s.maxScoreTimed>=1000||s.maxScoreEndless>=1000 },
  { id:'total_100',    name:'百发百中',   desc:'累计击落 100 架飞碟', check:(s)=>s.totalPopped>=100 },
  { id:'total_500',    name:'飞碟终结者', desc:'累计击落 500 架飞碟', check:(s)=>s.totalPopped>=500 },
  { id:'reaction_300', name:'闪电反应',   desc:'平均反应低于 300ms',  check:(s)=>s.bestReaction>0&&s.bestReaction<300 }
];

// ============================================================
//  StatsManager - 数据持久化
// ============================================================
const StatsManager = {
  KEY: 'bubblemind_data',

  defaults() {
    return {
      maxScoreTimed: 0,
      maxScoreEndless: 0,
      totalPopped: 0,
      totalGames: 0,
      maxComboEver: 0,
      bestReaction: 0,
      totalScore: 0,
      history: [],          // [{score, reaction, mode, date}, ...]  最近10局
      unlockedAchievements: []
    };
  },

  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (!raw) return this.defaults();
      return Object.assign(this.defaults(), JSON.parse(raw));
    } catch(e) { return this.defaults(); }
  },

  save(data) {
    localStorage.setItem(this.KEY, JSON.stringify(data));
  },

  getLevel(totalScore) {
    let lv = 0;
    for (let i=0; i<LEVELS.length; i++) {
      if (totalScore >= LEVELS[i].min) lv = i;
    }
    return { idx:lv, name:LEVELS[lv].name, next:LEVELS[lv+1]||null };
  },

  checkAchievements(data) {
    const newly = [];
    for (const ach of ACHIEVEMENTS) {
      if (!data.unlockedAchievements.includes(ach.id) && ach.check(data)) {
        data.unlockedAchievements.push(ach.id);
        newly.push(ach);
      }
    }
    return newly;
  }
};

// ============================================================
//  Particle - 爆破粒子
// ============================================================
class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 5;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed - 2;
    this.size = 3 + Math.random() * 5;
    this.color = color;
    this.life = 1.0;
    this.decay = 0.02 + Math.random() * 0.02;
    this.gravity = 0.15;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += this.gravity;
    this.vx *= 0.98;
    this.life -= this.decay;
  }

  draw(ctx) {
    if (this.life <= 0) return;
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, Math.max(0.1, this.size * this.life), 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  get dead() { return this.life <= 0; }
}

// ============================================================
//  Disc - 飞碟
// ============================================================
class Disc {
  constructor(canvasW, canvasH, difficulty) {
    this.radius = 32 + Math.random() * 12;
    this.fromLeft = Math.random() < 0.5;
    this.x = this.fromLeft ? -this.radius - 30 : canvasW + this.radius + 30;
    this.baseY = 90 + Math.random() * (canvasH * 0.6);
    this.y = this.baseY;
    this.baseSpeed = 1.5 + Math.random() * 1.2 + difficulty * 0.4;
    this.vx = this.fromLeft ? this.baseSpeed : -this.baseSpeed;
    this.bobAmp = 12 + Math.random() * 20;
    this.bobFreq = 0.003 + Math.random() * 0.003;
    this.bobPhase = Math.random() * Math.PI * 2;
    this.alive = true;
    this.spawnTime = performance.now();

    // 决定类型
    const roll = Math.random();
    if (roll < 0.06 + difficulty * 0.01) {
      this.type = 'gold';
      this.color = COLORS.gold;
      this.points = 30;
      this.vx = (this.fromLeft ? 1 : -1) * this.baseSpeed * 1.5;
      this.radius *= 0.85;
    } else if (roll < 0.16 + difficulty * 0.02) {
      this.type = 'bomb';
      this.color = '#4A4A4A';
      this.points = -20;
    } else {
      this.type = 'normal';
      this.color = BALLOON_COLORS[Math.floor(Math.random()*BALLOON_COLORS.length)];
      this.points = 10;
    }
    this.rotation = 0;
  }

  update(time) {
    this.x += this.vx;
    this.y = this.baseY + Math.sin(time * this.bobFreq + this.bobPhase) * this.bobAmp;
    this.rotation = Math.sin(time * 0.004 + this.bobPhase) * 0.12;
  }

  draw(ctx) {
    const r = this.radius;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);

    // 底部光束发光
    const glowGrad = ctx.createRadialGradient(0, r*0.3, 0, 0, r*0.3, r*1.4);
    glowGrad.addColorStop(0, this.color);
    glowGrad.addColorStop(1, this.color + '00');
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.ellipse(0, r*0.3, r*1.3, r*0.5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // 碟身（扁平椭圆）
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, r, r*0.4, 0, 0, Math.PI*2);
    ctx.fill();

    // 深色底部条带
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(0, r*0.12, r*0.92, r*0.14, 0, 0, Math.PI*2);
    ctx.fill();

    // 炸弹标记：红色警示灯
    if (this.type === 'bomb') {
      ctx.fillStyle = '#FF4444';
      const blink = (Math.sin(performance.now() * 0.01) + 1) * 0.5;
      ctx.globalAlpha = 0.5 + blink * 0.5;
      ctx.beginPath();
      ctx.arc(-r*0.45, 0, 3.5, 0, Math.PI*2);
      ctx.arc(0, 0, 3.5, 0, Math.PI*2);
      ctx.arc(r*0.45, 0, 3.5, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // 顶部圆顶（半透明半球）
    const domeGrad = ctx.createLinearGradient(0, -r*0.5, 0, 0);
    domeGrad.addColorStop(0, 'rgba(255,255,255,0.7)');
    domeGrad.addColorStop(1, 'rgba(255,255,255,0.15)');
    ctx.fillStyle = domeGrad;
    ctx.beginPath();
    ctx.ellipse(0, -r*0.05, r*0.5, r*0.35, 0, Math.PI, 0);
    ctx.fill();

    // 圆顶边缘
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(0, -r*0.05, r*0.5, r*0.35, 0, Math.PI, 0);
    ctx.stroke();

    // 高光
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.ellipse(-r*0.3, -r*0.2, r*0.18, r*0.06, 0, 0, Math.PI*2);
    ctx.fill();

    // 金色光环
    if (this.type === 'gold') {
      ctx.strokeStyle = 'rgba(255,215,0,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, 0, r*1.18, r*0.5, 0, 0, Math.PI*2);
      ctx.stroke();
    }

    ctx.restore();
  }

  hitTest(px, py) {
    const dx = px - this.x;
    const dy = py - this.y;
    // 椭圆碰撞检测（碟身扁平）
    const rx = this.radius * 1.15;
    const ry = this.radius * 0.65;
    return (dx*dx)/(rx*rx) + (dy*dy)/(ry*ry) <= 1;
  }

  get reactionTime() {
    return performance.now() - this.spawnTime;
  }
}

// ============================================================
//  Cloud - 背景云朵
// ============================================================
class Cloud {
  constructor(canvasW, canvasH) {
    this.x = Math.random() * canvasW;
    this.y = 40 + Math.random() * (canvasH * 0.5);
    this.speed = 0.1 + Math.random() * 0.2;
    this.size = 40 + Math.random() * 50;
    this.opacity = 0.4 + Math.random() * 0.3;
  }
  update(canvasW) {
    this.x += this.speed;
    if (this.x - this.size > canvasW) this.x = -this.size;
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = this.opacity;
    ctx.fillStyle = '#fff';
    const s = this.size;
    ctx.beginPath();
    ctx.arc(this.x, this.y, s*0.5, 0, Math.PI*2);
    ctx.arc(this.x + s*0.4, this.y - s*0.1, s*0.4, 0, Math.PI*2);
    ctx.arc(this.x + s*0.8, this.y, s*0.45, 0, Math.PI*2);
    ctx.arc(this.x + s*0.4, this.y + s*0.15, s*0.35, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

// ============================================================
//  GameEngine - 游戏主引擎
// ============================================================
const GameEngine = {
  canvas: null,
  ctx: null,
  bgCanvas: null,
  bgCtx: null,
  W: 0, H: 0,
  state: 'menu',        // menu / breathing / playing / results
  mode: 'timed',        // timed / endless

  balloons: [],
  particles: [],
  clouds: [],
  scorePopups: [],

  score: 0,
  combo: 0,
  maxCombo: 0,
  shots: 0,
  hits: 0,
  reactionTimes: [],
  lives: 5,
  timeLeft: 60,
  difficulty: 0,
  spawnTimer: 0,
  spawnInterval: 900,
  gameStartTime: 0,
  lastFrameTime: 0,
  rafId: null,
  mouseX: 0,
  mouseY: 0,

  init() {
    this.canvas = document.getElementById('game-canvas');
    this.ctx = this.canvas.getContext('2d');
    this.bgCanvas = document.getElementById('bg-canvas');
    this.bgCtx = this.bgCanvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());

    // 鼠标
    document.addEventListener('mousemove', (e) => {
      this.mouseX = e.clientX;
      this.mouseY = e.clientY;
      const ch = document.getElementById('crosshair');
      ch.style.left = e.clientX + 'px';
      ch.style.top = e.clientY + 'px';
    });

    // 射击（鼠标）
    document.addEventListener('mousedown', (e) => {
      if (e.button === 0 && this.state === 'playing') this.shoot(e.clientX, e.clientY);
    });

    // 触屏支持
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        const t = e.touches[0];
        this.mouseX = t.clientX;
        this.mouseY = t.clientY;
        const ch = document.getElementById('crosshair');
        ch.style.left = t.clientX + 'px';
        ch.style.top = t.clientY + 'px';
        e.preventDefault();
      }
    }, { passive: false });
    document.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0 && this.state === 'playing') {
        const t = e.touches[0];
        const ch = document.getElementById('crosshair');
        ch.style.left = t.clientX + 'px';
        ch.style.top = t.clientY + 'px';
        this.shoot(t.clientX, t.clientY);
        e.preventDefault();
      }
    }, { passive: false });

    // 背景云朵
    for (let i=0; i<6; i++) this.clouds.push(new Cloud(this.W, this.H));

    this.startBgLoop();
  },

  resize() {
    this.W = window.innerWidth;
    this.H = window.innerHeight;
    this.canvas.width = this.W;
    this.canvas.height = this.H;
    this.bgCanvas.width = this.W;
    this.bgCanvas.height = this.H;
  },

  // ---- 背景循环（始终运行） ----
  startBgLoop() {
    const loop = () => {
      this.drawBackground();
      this.rafId = requestAnimationFrame(loop);
    };
    loop();
  },

  drawBackground() {
    const ctx = this.bgCtx;
    // 渐变天空
    const grad = ctx.createLinearGradient(0, 0, 0, this.H);
    grad.addColorStop(0, COLORS.bgTop);
    grad.addColorStop(1, COLORS.bgBot);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, this.W, this.H);

    // 云朵
    for (const cloud of this.clouds) {
      cloud.update(this.W);
      cloud.draw(ctx);
    }
  },

  // ---- 开始游戏 ----
  start(mode) {
    this.mode = mode;
    this.startBreathing();
  },

  // ---- 呼吸引导 ----
  startBreathing() {
    this.state = 'breathing';
    const screen = document.getElementById('breath-screen');
    const circle = document.getElementById('breath-circle');
    const text = document.getElementById('breath-text');
    const count = document.getElementById('breath-count');

    screen.classList.add('visible');

    let phase = 0;
    let countdown = 3;

    // 吸气
    const inhale = () => {
      text.textContent = '吸气...';
      circle.style.transform = 'scale(1.8)';
    };
    // 呼气
    const exhale = () => {
      text.textContent = '呼气...';
      circle.style.transform = 'scale(1)';
    };

    inhale();
    count.textContent = countdown;

    const breathInterval = setInterval(() => {
      countdown--;
      count.textContent = countdown;
      if (countdown <= 0) {
        clearInterval(breathInterval);
        screen.classList.remove('visible');
        setTimeout(() => this.beginPlay(), 400);
        return;
      }
      phase = 1 - phase;
      if (phase === 1) exhale(); else inhale();
    }, 1000);
  },

  // ---- 开始游玩 ----
  beginPlay() {
    this.state = 'playing';
    this.balloons = [];
    this.particles = [];
    this.scorePopups = [];
    this.score = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.shots = 0;
    this.hits = 0;
    this.reactionTimes = [];
    this.difficulty = 0;
    this.spawnTimer = 0;
    this.spawnInterval = 900;
    this.gameStartTime = performance.now();
    this.lastFrameTime = performance.now();

    if (this.mode === 'timed') {
      this.timeLeft = 60;
      document.getElementById('time-label').textContent = '时间';
    } else {
      this.lives = 5;
      document.getElementById('time-label').textContent = '生命';
    }

    // 显示游戏画面
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('results-screen').classList.remove('visible');
    document.getElementById('game-screen').classList.add('visible');

    this.updateHUD();
    this.gameLoop();
  },

  // ---- 游戏主循环 ----
  gameLoop() {
    if (this.state !== 'playing') return;
    const now = performance.now();
    const dt = now - this.lastFrameTime;
    this.lastFrameTime = now;

    // 更新时间/难度
    if (this.mode === 'timed') {
      this.timeLeft -= dt / 1000;
      if (this.timeLeft <= 0) {
        this.timeLeft = 0;
        this.endGame();
        return;
      }
    } else {
      this.difficulty = (now - this.gameStartTime) / 10000; // 每10秒难度+1
      this.spawnInterval = Math.max(350, 900 - this.difficulty * 60);
    }

    // 生成飞碟
    this.spawnTimer += dt;
    if (this.spawnTimer >= this.spawnInterval) {
      this.spawnTimer = 0;
      this.balloons.push(new Disc(this.W, this.H, this.difficulty));
    }

    // 更新飞碟
    for (let i = this.balloons.length - 1; i >= 0; i--) {
      const b = this.balloons[i];
      b.update(now);

      // 检查是否飞出屏幕（水平方向）
      const flewOff = (b.fromLeft && b.x - b.radius > this.W + 30) || (!b.fromLeft && b.x + b.radius < -30);
      if (flewOff) {
        if (b.type !== 'bomb') {
          this.combo = 0;
          this.updateHUD();
          if (this.mode === 'endless') {
            this.lives--;
            this.flashHud('hud-time');
            if (this.lives <= 0) {
              this.balloons.splice(i, 1);
              this.endGame();
              return;
            }
          }
        }
        this.balloons.splice(i, 1);
      }
    }

    // 更新粒子
    for (let i = this.particles.length - 1; i >= 0; i--) {
      this.particles[i].update();
      if (this.particles[i].dead) this.particles.splice(i, 1);
    }

    // 更新飘字
    for (let i = this.scorePopups.length - 1; i >= 0; i--) {
      const p = this.scorePopups[i];
      p.life -= dt / 800;
      p.y -= dt * 0.05;
      if (p.life <= 0) this.scorePopups.splice(i, 1);
    }

    // 渲染
    this.render();

    // 更新HUD
    if (this.mode === 'timed') {
      document.getElementById('time-val').textContent = Math.ceil(this.timeLeft);
    } else {
      document.getElementById('time-val').textContent = this.lives;
    }

    requestAnimationFrame(() => this.gameLoop());
  },

  // ---- 渲染 ----
  render() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.W, this.H);

    // 飞碟
    for (const b of this.balloons) {
      b.draw(ctx);
    }

    // 粒子
    for (const p of this.particles) {
      p.draw(ctx);
    }

    // 飘字
    for (const p of this.scorePopups) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.font = 'bold 22px Quicksand, sans-serif';
      ctx.fillStyle = p.color;
      ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    }
  },

  // ---- 射击 ----
  shoot(x, y) {
    this.shots++;
    const ch = document.getElementById('crosshair');
    ch.classList.add('shooting');
    setTimeout(() => ch.classList.remove('shooting'), 100);

    // 从后往前检测（后绘制的在上层）
    let hit = false;
    for (let i = this.balloons.length - 1; i >= 0; i--) {
      const b = this.balloons[i];
      if (b.hitTest(x, y)) {
        hit = true;
        this.popBalloon(b, i);
        break;
      }
    }

    if (!hit) {
      this.combo = 0;
      this.updateHUD();
    }
  },

  // ---- 击落飞碟 ----
  popBalloon(b, index) {
    this.hits++;
    this.balloons.splice(index, 1);

    // 粒子效果
    const particleCount = b.type === 'gold' ? 20 : 12;
    for (let i = 0; i < particleCount; i++) {
      this.particles.push(new Particle(b.x, b.y, b.color));
    }

    if (b.type === 'bomb') {
      // 危险飞碟：扣分、清空连击
      this.score = Math.max(0, this.score + b.points);
      this.combo = 0;
      this.addScorePopup(b.x, b.y, '-20', '#E85A5A');
      // 额外爆炸粒子
      for (let i = 0; i < 8; i++) {
        this.particles.push(new Particle(b.x, b.y, '#FF6666'));
      }
    } else {
      // 普通/金色飞碟：加分、连击+1
      this.combo++;
      this.maxCombo = Math.max(this.maxCombo, this.combo);

      // 连击加成
      let bonus = 0;
      if (this.combo >= 5) bonus = Math.floor(b.points * 0.5);
      if (this.combo >= 10) bonus = b.points;
      const totalPoints = b.points + bonus;
      this.score += totalPoints;

      // 记录反应时间
      this.reactionTimes.push(b.reactionTime);

      // 飘字
      const popupText = bonus > 0 ? `+${totalPoints}` : `+${b.points}`;
      const popupColor = b.type === 'gold' ? '#E8B500' : '#5A9CC7';
      this.addScorePopup(b.x, b.y, popupText, popupColor);

      // 连击鼓励语
      if (this.combo === 5) this.showEncouragement('五连击！太棒了！');
      else if (this.combo === 10) this.showEncouragement('十连击！专注力满分！');
      else if (this.combo === 15) this.showEncouragement('十五连击！势不可挡！');
      else if (this.combo === 20) this.showEncouragement('二十连击！你就是大师！');
      else if (this.combo > 0 && this.combo % 25 === 0) this.showEncouragement(`${this.combo}连击！传奇时刻！`);

      // 无尽模式：每10连击回1血（上限5）
      if (this.mode === 'endless' && this.combo > 0 && this.combo % 10 === 0 && this.lives < 5) {
        this.lives++;
        document.getElementById('time-val').textContent = this.lives;
        this.flashHud('hud-time');
        this.addScorePopup(b.x, b.y - 30, '+1 ♥', '#8FD9B6');
        this.showEncouragement('回血了！继续加油！');
      }

      // 准星瞄准反馈
      if (this.combo > 0 && this.combo % 5 === 0) {
        this.flashHud('hud-combo');
      }
    }

    this.updateHUD();
  },

  addScorePopup(x, y, text, color) {
    this.scorePopups.push({ x, y, text, color, life: 1.0 });
  },

  // ---- HUD 更新 ----
  updateHUD() {
    document.getElementById('score-val').textContent = this.score;
    const comboEl = document.getElementById('combo-val');
    comboEl.textContent = this.combo;
  },

  flashHud(id) {
    const el = document.getElementById(id);
    el.classList.remove('combo-flash');
    void el.offsetWidth;
    el.classList.add('combo-flash');
  },

  // ---- 鼓励语 ----
  showEncouragement(text) {
    const layer = document.getElementById('encouragement-layer');
    const el = document.createElement('div');
    el.className = 'encouragement-text';
    el.textContent = text;
    el.style.left = (this.W/2 - 80 + Math.random()*160) + 'px';
    el.style.top = (this.H * 0.35 + Math.random()*60) + 'px';
    const colors = ['#E8915C', '#D65A8E', '#5A9CC7', '#8FD9B6', '#E8B500'];
    el.style.color = colors[Math.floor(Math.random()*colors.length)];
    layer.appendChild(el);
    setTimeout(() => el.remove(), 1500);
  },

  // ---- 结束游戏 ----
  endGame() {
    this.state = 'results';
    document.getElementById('game-screen').classList.remove('visible');

    // 计算本局数据
    const avgReaction = this.reactionTimes.length > 0
      ? Math.round(this.reactionTimes.reduce((a,b)=>a+b, 0) / this.reactionTimes.length)
      : 0;
    const accuracy = this.shots > 0 ? Math.round(this.hits / this.shots * 100) : 0;

    // 更新持久化数据
    const data = StatsManager.load();
    data.totalGames++;
    data.totalPopped += this.hits;
    data.totalScore += this.score;
    data.maxComboEver = Math.max(data.maxComboEver, this.maxCombo);
    if (avgReaction > 0) {
      if (data.bestReaction === 0 || avgReaction < data.bestReaction) {
        data.bestReaction = avgReaction;
      }
    }

    let newAchievements = [];
    let leveledUp = false;
    let oldLevel = StatsManager.getLevel(data.totalScore - this.score);

    if (this.mode === 'timed') {
      data.maxScoreTimed = Math.max(data.maxScoreTimed, this.score);
    } else {
      data.maxScoreEndless = Math.max(data.maxScoreEndless, this.score);
    }

    // 历史记录
    data.history.push({
      score: this.score,
      reaction: avgReaction,
      mode: this.mode,
      date: Date.now()
    });
    if (data.history.length > 10) data.history.shift();

    // 检查升级
    const newLevel = StatsManager.getLevel(data.totalScore);
    if (newLevel.idx > oldLevel.idx) {
      leveledUp = true;
    }

    // 检查成就
    newAchievements = StatsManager.checkAchievements(data);

    StatsManager.save(data);

    // 渲染结算页
    this.showResults(avgReaction, accuracy, newAchievements, data);

    // 升级动画
    if (leveledUp) {
      setTimeout(() => {
        const luScreen = document.getElementById('levelup-screen');
        document.getElementById('lu-name').textContent = newLevel.name;
        luScreen.classList.add('visible');
        setTimeout(() => luScreen.classList.remove('visible'), 2000);
      }, 800);
    }
  },

  // ---- 显示结算 ----
  showResults(avgReaction, accuracy, newAchievements, data) {
    const title = this.mode === 'timed' ? '限时挑战结束' : '无尽模式结束';
    document.getElementById('results-title').textContent = title;

    const grid = document.getElementById('stats-grid');
    grid.innerHTML = '';
    const stats = [
      { label:'总分', value:this.score, color:'#E8915C' },
      { label:'命中率', value:accuracy+'%', color:'#8FD9B6' },
      { label:'最高连击', value:this.maxCombo, color:'#D65A8E' },
      { label:'平均反应', value:avgReaction>0?avgReaction+'ms':'—', color:'#5A9CC7' },
      { label:'击落飞碟', value:this.hits, color:'#E8B500' }
    ];
    for (const s of stats) {
      const card = document.createElement('div');
      card.className = 'stat-card';
      card.innerHTML = `<div class="sc-label">${s.label}</div><div class="sc-value" style="color:${s.color}">${s.value}</div>`;
      grid.appendChild(card);
    }

    // 趋势图
    this.drawTrendChart(data.history);

    // 成就
    const achArea = document.getElementById('achievement-area');
    achArea.innerHTML = '';
    if (newAchievements.length > 0) {
      for (const ach of newAchievements) {
        const el = document.createElement('div');
        el.className = 'achievement-popup';
        el.textContent = '🏆 新成就：' + ach.name + ' — ' + ach.desc;
        achArea.appendChild(el);
      }
    }

    document.getElementById('results-screen').classList.add('visible');
  },

  // ---- 趋势图 ----
  drawTrendChart(history) {
    const canvas = document.getElementById('trend-canvas');
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // 背景
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(0, 0, w, h);

    if (history.length < 1) {
      ctx.fillStyle = '#998A9E';
      ctx.font = '14px Quicksand, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('暂无历史数据，多玩几局就能看到进步啦！', w/2, h/2);
      return;
    }

    const padding = 40;
    const chartW = w - padding * 2;
    const chartH = h - padding * 2;

    // 分数折线
    const maxScore = Math.max(...history.map(r=>r.score), 100);
    const minScore = 0;

    // 网格线
    ctx.strokeStyle = 'rgba(150,150,150,0.2)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = padding + (chartH / 4) * i;
      ctx.beginPath();
      ctx.moveTo(padding, y);
      ctx.lineTo(w - padding, y);
      ctx.stroke();
    }

    // Y轴标签
    ctx.fillStyle = '#998A9E';
    ctx.font = '11px Quicksand, sans-serif';
    ctx.textAlign = 'right';
    for (let i = 0; i <= 4; i++) {
      const y = padding + (chartH / 4) * i;
      const val = Math.round(maxScore - (maxScore / 4) * i);
      ctx.fillText(val, padding - 6, y + 4);
    }

    // 折线
    const stepX = history.length > 1 ? chartW / (history.length - 1) : 0;

    // 分数线（橙色）
    ctx.strokeStyle = '#E8915C';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let i = 0; i < history.length; i++) {
      const x = padding + stepX * i;
      const y = padding + chartH - (history[i].score / maxScore) * chartH;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // 数据点
    for (let i = 0; i < history.length; i++) {
      const x = padding + stepX * i;
      const y = padding + chartH - (history[i].score / maxScore) * chartH;
      ctx.fillStyle = '#E8915C';
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI*2);
      ctx.fill();
    }

    // 反应时间线（蓝色，如果有数据）
    const hasReaction = history.every(r => r.reaction > 0);
    if (hasReaction && history.length > 1) {
      const maxRt = Math.max(...history.map(r=>r.reaction), 500);
      ctx.strokeStyle = '#5A9CC7';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      for (let i = 0; i < history.length; i++) {
        const x = padding + stepX * i;
        const y = padding + chartH - (history[i].reaction / maxRt) * chartH;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // 图例
    ctx.font = '12px Quicksand, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#E8915C';
    ctx.fillText('● 分数', w - padding - 100, 20);
    if (hasReaction) {
      ctx.fillStyle = '#5A9CC7';
      ctx.fillText('● 反应时间', w - padding - 50, 20);
    }

    // 标题
    ctx.fillStyle = '#5A3E5C';
    ctx.font = 'bold 14px Quicksand, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('最近 ' + history.length + ' 局趋势', w/2, 14);
  },

  // ---- 返回菜单 ----
  backToMenu() {
    this.state = 'menu';
    document.getElementById('results-screen').classList.remove('visible');
    document.getElementById('game-screen').classList.remove('visible');
    document.getElementById('start-screen').classList.remove('hidden');
    this.updateMenuDisplay();
  },

  // ---- 更新菜单显示 ----
  updateMenuDisplay() {
    const data = StatsManager.load();
    document.getElementById('hs-timed').textContent = data.maxScoreTimed;
    document.getElementById('hs-endless').textContent = data.maxScoreEndless;
    document.getElementById('hs-total').textContent = data.totalPopped;

    const level = StatsManager.getLevel(data.totalScore);
    document.getElementById('lv-name').textContent = level.name;
    if (level.next) {
      const progress = data.totalScore - LEVELS[level.idx].min;
      const needed = level.next.min - LEVELS[level.idx].min;
      document.getElementById('lv-progress').textContent = `${progress} / ${needed}`;
    } else {
      document.getElementById('lv-progress').textContent = '已满级';
    }
  }
};

// ============================================================
//  全局函数
// ============================================================
function startGame(mode) {
  GameEngine.start(mode);
}

function replayGame() {
  GameEngine.start(GameEngine.mode);
}

function backToMenu() {
  GameEngine.backToMenu();
}

// ============================================================
//  初始化
// ============================================================
window.addEventListener('load', () => {
  GameEngine.init();
  GameEngine.updateMenuDisplay();
});
</script>
</body>
</html>
