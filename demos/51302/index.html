<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中级会计知识库 · Vibe Coding</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #3b82f6;
  --primary-dark: #1d4ed8;
  --accent: #06b6d4;
  --gold: #f59e0b;
  --green: #10b981;
  --purple: #8b5cf6;
  --pink: #ec4899;
  --bg-dark: #0f172a;
  --bg-card: #1e293b;
  --bg-hover: #334155;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --border: #334155;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg-dark);
  color: var(--text-primary);
  overflow-x: hidden;
  min-height: 100vh;
}

/* 背景粒子效果 */
#particles-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* 头部 */
header {
  position: relative;
  z-index: 10;
  padding: 60px 40px 40px;
  text-align: center;
  background: linear-gradient(180deg, rgba(59,130,246,0.15) 0%, transparent 100%);
  border-bottom: 1px solid var(--border);
}

.hero-title {
  font-size: 3rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary), var(--accent), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 12px;
  animation: fadeInUp 0.8s ease-out;
}

.hero-subtitle {
  font-size: 1.1rem;
  color: var(--text-secondary);
  margin-bottom: 30px;
  animation: fadeInUp 0.8s ease-out 0.1s both;
}

/* 搜索框 */
.search-container {
  max-width: 600px;
  margin: 0 auto 30px;
  position: relative;
  animation: fadeInUp 0.8s ease-out 0.2s both;
}

.search-input {
  width: 100%;
  padding: 16px 24px 16px 52px;
  font-size: 1rem;
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: 50px;
  color: var(--text-primary);
  outline: none;
  transition: all 0.3s ease;
}

.search-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(59,130,246,0.2);
}

.search-icon {
  position: absolute;
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-secondary);
  font-size: 1.2rem;
}

/* 统计数据 */
.stats-bar {
  display: flex;
  justify-content: center;
  gap: 40px;
  flex-wrap: wrap;
  animation: fadeInUp 0.8s ease-out 0.3s both;
}

.stat-item {
  text-align: center;
}

.stat-number {
  font-size: 2rem;
  font-weight: 700;
  color: var(--accent);
}

.stat-label {
  font-size: 0.9rem;
  color: var(--text-secondary);
  margin-top: 4px;
}

/* 分类导航 */
.nav-container {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(15,23,42,0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 16px 40px;
}

.nav-tabs {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  max-width: 1200px;
  margin: 0 auto;
}

.nav-tab {
  padding: 10px 20px;
  border-radius: 50px;
  cursor: pointer;
  font-size: 0.95rem;
  font-weight: 500;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  transition: all 0.3s ease;
  white-space: nowrap;
}

.nav-tab:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
  transform: translateY(-2px);
}

.nav-tab.active {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  border-color: transparent;
  box-shadow: 0 4px 15px rgba(59,130,246,0.4);
}

/* 主内容区 */
main {
  position: relative;
  z-index: 10;
  max-width: 1400px;
  margin: 0 auto;
  padding: 40px;
}

/* 章节标题 */
.section-title {
  font-size: 1.8rem;
  font-weight: 700;
  margin: 40px 0 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.section-icon {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  box-shadow: 0 4px 15px rgba(59,130,246,0.3);
}

.section-progress {
  margin-left: auto;
  font-size: 0.9rem;
  color: var(--text-secondary);
}

/* 知识点卡片网格 */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}

.knowledge-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}

.knowledge-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s ease;
}

.knowledge-card:hover {
  transform: translateY(-6px);
  border-color: var(--primary);
  box-shadow: 0 20px 40px rgba(0,0,0,0.3), 0 0 0 1px rgba(59,130,246,0.2);
}

.knowledge-card:hover::before {
  transform: scaleX(1);
}

.card-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.card-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  flex-shrink: 0;
}

.card-title {
  font-size: 1.1rem;
  font-weight: 600;
  line-height: 1.4;
}

.card-desc {
  font-size: 0.9rem;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: 16px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-tags {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.tag {
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 0.75rem;
  font-weight: 500;
  background: rgba(59,130,246,0.15);
  color: var(--primary);
}

.tag.highlight {
  background: rgba(245,158,11,0.15);
  color: var(--gold);
}

.tag.easy {
  background: rgba(16,185,129,0.15);
  color: var(--green);
}

/* 模态框 */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.modal-overlay.show {
  display: flex;
  opacity: 1;
}

.modal-content {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  max-width: 800px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  position: relative;
  transform: scale(0.9) translateY(20px);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.modal-overlay.show .modal-content {
  transform: scale(1) translateY(0);
}

.modal-header {
  padding: 30px 30px 20px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg-card);
  z-index: 1;
}

.modal-close {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--bg-hover);
  color: var(--text-primary);
  font-size: 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

.modal-close:hover {
  background: var(--primary);
  transform: rotate(90deg);
}

.modal-title {
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.modal-section {
  padding: 20px 30px;
}

.modal-section h3 {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.modal-section p {
  color: var(--text-secondary);
  line-height: 1.8;
  margin-bottom: 10px;
}

.modal-section ul {
  list-style: none;
  padding-left: 0;
}

.modal-section li {
  padding: 8px 0 8px 24px;
  position: relative;
  color: var(--text-secondary);
  line-height: 1.7;
}

.modal-section li::before {
  content: '▸';
  position: absolute;
  left: 0;
  color: var(--primary);
  font-weight: bold;
}

.formula-box {
  background: rgba(59,130,246,0.1);
  border: 1px solid rgba(59,130,246,0.3);
  border-radius: 10px;
  padding: 16px 20px;
  margin: 12px 0;
  font-family: 'Courier New', monospace;
  font-size: 1rem;
  color: var(--accent);
  text-align: center;
}

.example-box {
  background: rgba(16,185,129,0.1);
  border: 1px solid rgba(16,185,129,0.3);
  border-radius: 10px;
  padding: 16px 20px;
  margin: 12px 0;
}

.example-box strong {
  color: var(--green);
}

/* 底部 */
footer {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 40px;
  color: var(--text-secondary);
  border-top: 1px solid var(--border);
  margin-top: 60px;
}

/* 动画 */
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* 滚动条 */
::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-track {
  background: var(--bg-dark);
}

::-webkit-scrollbar-thumb {
  background: var(--bg-hover);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--primary);
}

/* 响应式 */
@media (max-width: 768px) {
  .hero-title { font-size: 2rem; }
  main { padding: 20px; }
  .nav-container { padding: 12px 20px; }
  header { padding: 40px 20px 30px; }
  .card-grid { grid-template-columns: 1fr; }
}

/* 高亮搜索结果 */
mark {
  background: rgba(245,158,11,0.4);
  color: var(--gold);
  padding: 0 2px;
  border-radius: 3px;
}

/* 回到顶部按钮 */
.back-to-top {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  border: none;
  cursor: pointer;
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 15px rgba(59,130,246,0.4);
  z-index: 30;
  opacity: 0;
  visibility: hidden;
  transform: translateY(20px);
  transition: all 0.3s ease;
}

.back-to-top.show {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.back-to-top:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 25px rgba(59,130,246,0.5);
}
</style>
</head>
<body>

<canvas id="particles-canvas"></canvas>

<!-- 头部 -->
<header>
  <h1 class="hero-title">📚 中级会计知识库</h1>
  <p class="hero-subtitle">沉浸式知识学习 · 系统掌握中级会计实务核心考点</p>
  
  <div class="search-container">
    <span class="search-icon">🔍</span>
    <input type="text" class="search-input" id="searchInput" placeholder="搜索知识点、公式、考点...">
  </div>
  
  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-number" id="totalCount">0</div>
      <div class="stat-label">知识点</div>
    </div>
    <div class="stat-item">
      <div class="stat-number" id="chapterCount">0</div>
      <div class="stat-label">章节</div>
    </div>
    <div class="stat-item">
      <div class="stat-number">⭐</div>
      <div class="stat-label">高频考点</div>
    </div>
  </div>
</header>

<!-- 分类导航 -->
<nav class="nav-container">
  <div class="nav-tabs" id="navTabs">
    <div class="nav-tab active" data-category="all">📖 全部</div>
    <div class="nav-tab" data-category="asset">📦 资产类</div>
    <div class="nav-tab" data-category="liability">💳 负债类</div>
    <div class="nav-tab" data-category="income">💰 收入费用</div>
    <div class="nav-tab" data-category="report">📊 财务报告</div>
    <div class="nav-tab" data-category="special">🔧 特殊业务</div>
    <div class="nav-tab" data-category="manage">📈 成本管理</div>
  </div>
</nav>

<!-- 主内容 -->
<main id="mainContent">
  <!-- 内容由JS动态生成 -->
</main>

<!-- 回到顶部 -->
<button class="back-to-top" id="backToTop">↑</button>

<!-- 模态框 -->
<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <button class="modal-close" id="modalClose">✕</button>
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="card-tags" id="modalTags"></div>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<footer>
  <p>🎯 中级会计知识库 · Vibe Coding 生成 · 持续更新中</p>
</footer>

<script>
// ===== 中级会计知识库数据 =====
const knowledgeData = [
  // ===== 第一章：存货 =====
  {
    id: 1,
    chapter: '第一章',
    category: 'asset',
    icon: '📦',
    title: '存货的确认与初始计量',
    desc: '存货的概念、确认条件，以及不同取得方式下的初始成本计量原则。',
    tags: ['基础考点', '初始计量'],
    color: 'var(--primary)',
    content: {
      overview: '存货是指企业在日常活动中持有以备出售的产成品或商品、处在生产过程中的在产品、在生产过程或提供劳务过程中耗用的材料和物料等。',
      keyPoints: [
        '存货的确认条件：与该存货有关的经济利益很可能流入企业；该存货的成本能够可靠地计量',
        '存货包括：原材料、在产品、半成品、产成品、商品、周转材料等',
        '受托代销商品不属于企业存货（代管）',
        '在途物资（已付款未入库）属于企业存货'
      ],
      formulas: [
        '外购存货成本 = 买价 + 相关税费 + 运输费 + 装卸费 + 保险费 + 其他可归属于存货采购成本的费用'
      ],
      examples: [
        '【例】甲公司为增值税一般纳税人，购入原材料100吨，增值税专用发票上注明的价款为50万元，增值税税额为6.5万元，另支付运输费2万元（不含税），运输途中发生合理损耗0.5吨。则原材料入账成本 = 50 + 2 = 52万元。'
      ]
    }
  },
  {
    id: 2,
    chapter: '第一章',
    category: 'asset',
    icon: '⚖️',
    title: '发出存货的计量方法',
    desc: '先进先出法、月末一次加权平均法、移动加权平均法、个别计价法的计算与比较。',
    tags: ['计算考点', '高频'],
    color: 'var(--accent)',
    content: {
      overview: '企业应当根据各类存货的实物流转方式、企业管理的要求、存货的性质等实际情况，合理地选择发出存货成本的计算方法，以合理确定当期发出存货的实际成本。',
      keyPoints: [
        '先进先出法：先购入的存货先发出，期末存货成本接近市价',
        '月末一次加权平均法：月末一次计算加权平均单价，简化工作量',
        '移动加权平均法：每次进货后重新计算平均单价，成本计算更准确',
        '个别计价法：逐一辨认各批发出存货所属的购进批别，适用于贵重物品',
        '性质和用途相同的存货，应当采用相同的成本计算方法确定发出存货的成本'
      ],
      formulas: [
        '月末一次加权平均单价 = (月初结存存货成本 + 本月购入存货成本) ÷ (月初结存存货数量 + 本月购入存货数量)',
        '移动加权平均单价 = (原有库存存货成本 + 本次进货成本) ÷ (原有库存存货数量 + 本次进货数量)'
      ],
      examples: [
        '【例】某企业月初A材料100公斤，单价10元；5日购入200公斤，单价11元；10日发出150公斤。先进先出法下发出成本 = 100×10 + 50×11 = 1,550元；移动加权平均法下平均单价 = (100×10+200×11)÷300 = 10.67元，发出成本 = 150×10.67 = 1,600.5元。'
      ]
    }
  },
  {
    id: 3,
    chapter: '第一章',
    category: 'asset',
    icon: '📉',
    title: '存货期末计量与跌价准备',
    desc: '成本与可变现净值孰低法，存货跌价准备的计提、转回和结转。',
    tags: ['重点考点', '可变现净值'],
    color: 'var(--gold)',
    content: {
      overview: '资产负债表日，存货应当按照成本与可变现净值孰低计量。存货成本高于其可变现净值的，应当计提存货跌价准备，计入当期损益。',
      keyPoints: [
        '可变现净值 = 估计售价 - 至完工时估计将要发生的成本 - 估计的销售费用 - 相关税费',
        '有合同部分：以合同价格为基础计算可变现净值',
        '无合同部分：以一般销售价格为基础计算可变现净值',
        '存货跌价准备转回的条件：以前减记存货价值的影响因素已经消失',
        '转回金额以原已计提的存货跌价准备金额为限',
        '已售存货计提了跌价准备的，应同时结转已计提的存货跌价准备'
      ],
      formulas: [
        '应计提的存货跌价准备 = 存货成本 - 可变现净值 - 已有贷方余额',
        '用于生产的材料可变现净值 = 产成品估计售价 - 至完工估计将发生的成本 - 估计销售费用 - 相关税费'
      ],
      examples: [
        '【例】2025年末，某原材料成本为100万元，可变现净值为90万元，跌价准备期初贷方余额为3万元。则年末应计提跌价准备 = (100-90) - 3 = 7万元。'
      ]
    }
  },
  
  // ===== 第二章：固定资产 =====
  {
    id: 4,
    chapter: '第二章',
    category: 'asset',
    icon: '🏭',
    title: '固定资产的确认与初始计量',
    desc: '固定资产的定义、确认条件，以及外购、自建等方式取得固定资产的成本构成。',
    tags: ['基础考点'],
    color: 'var(--primary)',
    content: {
      overview: '固定资产是指同时具有下列特征的有形资产：（1）为生产商品、提供劳务、出租或经营管理而持有的；（2）使用寿命超过一个会计年度。',

// ===== 页面逻辑 =====
let currentCategory = 'all';
let searchQuery = '';

// 初始化
function init() {
  renderStats();
  renderNavTabs();
  renderKnowledgeCards();
  initParticles();
  initEventListeners();
}

// 渲染统计数据
function renderStats() {
  document.getElementById('totalCount').textContent = knowledgeData.length;
  const chapters = [...new Set(knowledgeData.map(item => item.chapter))];
  document.getElementById('chapterCount').textContent = chapters.length;
}

// 渲染导航标签
function renderNavTabs() {
  const tabs = document.querySelectorAll('.nav-tab');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentCategory = tab.dataset.category;
      renderKnowledgeCards();
    });
  });
}

// 渲染知识点卡片
function renderKnowledgeCards() {
  const mainContent = document.getElementById('mainContent');
  let filteredData = knowledgeData;
  
  // 分类筛选
  if (currentCategory !== 'all') {
    filteredData = filteredData.filter(item => item.category === currentCategory);
  }
  
  // 搜索筛选
  if (searchQuery) {
    const query = searchQuery.toLowerCase();
    filteredData = filteredData.filter(item => 
      item.title.toLowerCase().includes(query) ||
      item.desc.toLowerCase().includes(query) ||
      item.tags.some(tag => tag.toLowerCase().includes(query)) ||
      item.content.overview.toLowerCase().includes(query) ||
      item.content.keyPoints.some(kp => kp.toLowerCase().includes(query))
    );
  }
  
  // 按章节分组
  const chapters = {};
  filteredData.forEach(item => {
    if (!chapters[item.chapter]) {
      chapters[item.chapter] = [];
    }
    chapters[item.chapter].push(item);
  });
  
  let html = '';
  for (const [chapter, items] of Object.entries(chapters)) {
    html += `
      <h2 class="section-title">
        <span class="section-icon">📖</span>
        ${chapter}
        <span class="section-progress">${items.length} 个知识点</span>
      </h2>
      <div class="card-grid">
        ${items.map(item => renderCard(item)).join('')}
      </div>
    `;
  }
  
  if (filteredData.length === 0) {
    html = `
      <div style="text-align: center; padding: 80px 20px; color: var(--text-secondary);">
        <div style="font-size: 4rem; margin-bottom: 20px;">🔍</div>
        <h3>没有找到相关知识点</h3>
        <p>试试其他关键词吧</p>
      </div>
    `;
  }
  
  mainContent.innerHTML = html;
  
  // 绑定卡片点击事件
  document.querySelectorAll('.knowledge-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = parseInt(card.dataset.id);
      openModal(id);
    });
  });
}

// 渲染单个卡片
function renderCard(item) {
  const highlightText = (text) => {
    if (!searchQuery) return text;
    const regex = new RegExp(`(${searchQuery})`, 'gi');
    return text.replace(regex, '<mark>$1</mark>');
  };
  
  return `
    <div class="knowledge-card" data-id="${item.id}">
      <div class="card-header">
        <div class="card-icon" style="background: ${item.color}22; color: ${item.color}">${item.icon}</div>
        <div class="card-title">${highlightText(item.title)}</div>
      </div>
      <div class="card-desc">${highlightText(item.desc)}</div>
      <div class="card-tags">
        ${item.tags.map(tag => `
          <span class="tag ${tag.includes('高频') || tag.includes('重点') ? 'highlight' : tag.includes('基础') ? 'easy' : ''}">${tag}</span>
        `).join('')}
      </div>
    </div>
  `;
}

// 打开模态框
function openModal(id) {
  const item = knowledgeData.find(k => k.id === id);
  if (!item) return;
  
  const modal = document.getElementById('modal');
  document.getElementById('modalTitle').innerHTML = `
    <span class="card-icon" style="background: ${item.color}22; color: ${item.color}">${item.icon}</span>
    ${item.title}
  `;
  document.getElementById('modalTags').innerHTML = item.tags.map(tag => `
    <span class="tag ${tag.includes('高频') || tag.includes('重点') ? 'highlight' : tag.includes('基础') ? 'easy' : ''}">${tag}</span>
  `).join('');
  
  const body = document.getElementById('modalBody');
  let content = `
    <div class="modal-section">
      <h3>📌 概述</h3>
      <p>${item.content.overview}</p>
    </div>
    
    <div class="modal-section">
      <h3>💡 核心要点</h3>
      <ul>
        ${item.content.keyPoints.map(kp => `<li>${kp}</li>`).join('')}
      </ul>
    </div>
  `;
  
  if (item.content.formulas && item.content.formulas.length > 0) {
    content += `
      <div class="modal-section">
        <h3>📐 重要公式</h3>
        ${item.content.formulas.map(f => `<div class="formula-box">${f}</div>`).join('')}
      </div>
    `;
  }
  
  if (item.content.examples && item.content.examples.length > 0) {
    content += `
      <div class="modal-section">
        <h3>📝 典型例题</h3>
        ${item.content.examples.map(e => `<div class="example-box">${e}</div>`).join('')}
      </div>
    `;
  }
  
  body.innerHTML = content;
  
  modal.classList.add('show');
  document.body.style.overflow = 'hidden';
}

// 关闭模态框
function closeModal() {
  const modal = document.getElementById('modal');
  modal.classList.remove('show');
  document.body.style.overflow = '';
}

// 粒子背景
function initParticles() {
  const canvas = document.getElementById('particles-canvas');
  const ctx = canvas.getContext('2d');
  
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  
  const particles = [];
  const particleCount = 50;
  
  for (let i = 0; i < particleCount; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2 + 1,
      speedX: (Math.random() - 0.5) * 0.5,
      speedY: (Math.random() - 0.5) * 0.5,
      opacity: Math.random() * 0.5 + 0.2
    });
  }
  
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    particles.forEach((p, i) => {
      p.x += p.speedX;
      p.y += p.speedY;
      
      if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
      if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
      
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(59, 130, 246, ${p.opacity})`;
      ctx.fill();
      
      // 连线
      particles.slice(i + 1).forEach(p2 => {
        const dx = p.x - p2.x;
        const dy = p.y - p2.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 150) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = `rgba(59, 130, 246, ${0.1 * (1 - dist / 150)})`;
          ctx.stroke();
        }
      });
    });
    
    requestAnimationFrame(animate);
  }
  animate();
}

// 事件监听
function initEventListeners() {
  // 搜索
  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', (e) => {
    searchQuery = e.target.value.trim();
    renderKnowledgeCards();
  });
  
  // 模态框关闭
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target.id === 'modal') closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });
  
  // 回到顶部
  const backToTop = document.getElementById('backToTop');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 300) {
      backToTop.classList.add('show');
    } else {
      backToTop.classList.remove('show');
    }
  });
  backToTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

// 启动
init();
</script>

</body>
</html>
