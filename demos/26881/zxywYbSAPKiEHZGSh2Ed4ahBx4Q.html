<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>用药小棉袄 - AI语音交互的适老化用药管理器</title>
<style>
/* ===== CSS Variables & Theme ===== */
:root {
  --primary: #FF8C42;
  --primary-light: #FFB07A;
  --primary-dark: #E07020;
  --bg: #FFF8F0;
  --bg-card: #FFFFFF;
  --text-primary: #2C3E50;
  --text-secondary: #5D6D7E;
  --success: #27AE60;
  --warning: #E74C3C;
  --info: #3498DB;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 4px 20px rgba(0,0,0,0.12);
  --radius: 16px;
  --radius-sm: 10px;
  --font-size-xl: 26px;
  --font-size-lg: 22px;
  --font-size-md: 18px;
  --font-size-sm: 16px;
  --spacing: 16px;
  --transition: all 0.3s ease;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text-primary);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.container{max-width:480px;margin:0 auto;padding:0 var(--spacing)}
.page{padding-bottom:100px;min-height:100vh}
.text-xl{font-size:var(--font-size-xl)}.text-lg{font-size:var(--font-size-lg)}.text-md{font-size:var(--font-size-md)}.text-sm{font-size:var(--font-size-sm)}.text-bold{font-weight:700}.text-muted{color:var(--text-secondary)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 28px;
  border:none;border-radius:var(--radius-sm);font-size:var(--font-size-md);font-weight:600;
  cursor:pointer;transition:var(--transition);text-decoration:none;-webkit-tap-highlight-color:transparent;user-select:none
}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(255,140,66,0.35)}
.btn-primary:hover{background:var(--primary-dark);box-shadow:0 6px 16px rgba(255,140,66,0.45)}
.btn-secondary{background:var(--bg-card);color:var(--text-primary);border:2px solid #E8E0D8}
.btn-danger{background:var(--warning);color:#fff}
.btn-sm{min-height:40px;padding:8px 20px;font-size:var(--font-size-sm)}
.btn-block{width:100%}
.card{background:var(--bg-card);border-radius:var(--radius);padding:var(--spacing);box-shadow:var(--shadow);margin-bottom:12px}
.header{
  background:linear-gradient(135deg,var(--primary)0%,var(--primary-dark)100%);color:#fff;padding:20px var(--spacing);position:relative;overflow:hidden
}
.header::after{content:'';position:absolute;top:-50%;right:-30%;width:200px;height:200px;background:rgba(255,255,255,0.08);border-radius:50%}
.header-title{font-size:24px;font-weight:700;display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.header-subtitle{font-size:var(--font-size-sm);opacity:.9;margin-top:4px;position:relative;z-index:1}
.header-date{font-size:var(--font-size-md);margin-top:8px;opacity:.85;position:relative;z-index:1}
.progress-section{display:flex;align-items:center;gap:20px;padding:20px 0}
.progress-ring-container{position:relative;width:80px;height:80px;flex-shrink:0}
.progress-ring{width:80px;height:80px;transform:rotate(-90deg)}
.progress-ring-bg{fill:none;stroke:#F0E8E0;stroke-width:6}
.progress-ring-fill{fill:none;stroke:var(--primary);stroke-width:6;stroke-linecap:round;stroke-dasharray:226.2;stroke-dashoffset:113.1;transition:stroke-dashoffset 1s ease}
.progress-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:var(--font-size-lg);font-weight:700;color:var(--primary)}
.progress-info{flex:1}.progress-info-text{font-size:var(--font-size-md);color:var(--text-primary);font-weight:600}
.progress-info-sub{font-size:var(--font-size-sm);color:var(--text-secondary);margin-top:2px}
.med-list{display:flex;flex-direction:column;gap:10px}
.med-card{
  background:var(--bg-card);border-radius:var(--radius);padding:var(--spacing);box-shadow:var(--shadow);
  display:flex;align-items:center;gap:14px;cursor:pointer;transition:var(--transition);
  text-decoration:none;color:inherit;position:relative;overflow:hidden
}
.med-card:active{transform:scale(0.98)}
.med-card-color{width:4px;position:absolute;left:0;top:0;bottom:0;border-radius:0 2px 2px 0}
.med-time{font-size:var(--font-size-lg);font-weight:700;color:var(--text-primary);min-width:55px;text-align:center}
.med-info{flex:1}
.med-name{font-size:var(--font-size-md);font-weight:600;color:var(--text-primary)}
.med-condition{font-size:var(--font-size-sm);color:var(--text-secondary);margin-top:2px}
.med-status{font-size:var(--font-size-sm);font-weight:600;padding:4px 12px;border-radius:20px;white-space:nowrap}
.med-status-pending{background:#FFF3E6;color:var(--primary)}
.med-status-completed{background:#E8F8F0;color:var(--success)}
.med-status-missed{background:#FDEDEC;color:var(--warning)}
.voice-fab{
  position:fixed;bottom:30px;right:20px;width:70px;height:70px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary)0%,var(--primary-dark)100%);color:#fff;
  border:none;font-size:32px;cursor:pointer;box-shadow:0 6px 24px rgba(255,140,66,0.4);
  display:flex;align-items:center;justify-content:center;transition:var(--transition);z-index:100;-webkit-tap-highlight-color:transparent
}
.voice-fab:active{transform:scale(0.92)}
.voice-fab-pulse{animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 6px 24px rgba(255,140,66,0.4)}50%{box-shadow:0 6px 36px rgba(255,140,66,0.6)}100%{box-shadow:0 6px 24px rgba(255,140,66,0.4)}}
.section-title{font-size:var(--font-size-md);font-weight:700;color:var(--text-primary);margin:20px 0 12px;display:flex;align-items:center;gap:8px}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:var(--font-size-md);margin-bottom:12px;opacity:.9;position:relative;z-index:1;cursor:pointer}
.back-btn:hover{opacity:1}
.detail-hero{background:linear-gradient(135deg,var(--primary)0%,var(--primary-dark)100%);color:#fff;padding:30px var(--spacing)}
.detail-name{font-size:28px;font-weight:700;margin-top:8px}
.detail-category{font-size:var(--font-size-sm);opacity:.85;display:inline-block;padding:2px 12px;background:rgba(255,255,255,0.2);border-radius:20px;margin-top:8px}
.detail-body{padding:20px var(--spacing)}
.detail-info-row{background:var(--bg-card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);display:flex;align-items:flex-start;gap:12px}
.detail-info-icon{font-size:24px;width:36px;text-align:center;flex-shrink:0}
.detail-info-content{flex:1}
.detail-info-label{font-size:var(--font-size-sm);color:var(--text-secondary);font-weight:500}
.detail-info-value{font-size:var(--font-size-md);font-weight:600;margin-top:2px}
.detail-notes{background:#FFF8F0;border:1px solid #FFE8D6;border-radius:var(--radius);padding:16px;margin-top:16px}
.detail-notes-title{font-size:var(--font-size-md);font-weight:600;color:var(--primary-dark);margin-bottom:8px}
.detail-notes-text{font-size:var(--font-size-sm);color:var(--text-secondary);line-height:1.8}
.voice-page{background:linear-gradient(180deg,var(--primary)0%,#FFF8F0 40%);min-height:100vh;display:flex;flex-direction:column}
.voice-header{padding:16px;display:flex;align-items:center;gap:12px}
.voice-header .back-btn{color:var(--text-primary)}
.voice-mascot{text-align:center;padding:20px}
.voice-mascot-icon{font-size:64px;display:block;margin-bottom:8px}
.voice-mascot-text{font-size:var(--font-size-md);color:var(--text-primary);font-weight:600}
.voice-chat{flex:1;padding:0 16px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 300px)}
.voice-msg{max-width:85%;padding:14px 18px;border-radius:16px;font-size:var(--font-size-md);line-height:1.6;animation:msgIn .3s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.voice-msg-user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.voice-msg-ai{align-self:flex-start;background:var(--bg-card);color:var(--text-primary);border-bottom-left-radius:4px;box-shadow:var(--shadow)}
.voice-msg-ai-suggestion{align-self:flex-start;background:#FFF3E6;color:var(--text-primary);border-bottom-left-radius:4px;box-shadow:var(--shadow);max-width:85%;padding:14px 18px;border-radius:16px;font-size:var(--font-size-md);line-height:1.6;animation:msgIn .3s ease;border-left:3px solid var(--primary)}
.voice-suggestion-btn{display:inline-block;background:var(--bg-card);border:1px solid var(--primary-light);color:var(--primary);padding:6px 14px;border-radius:20px;font-size:15px;margin:3px 4px;cursor:pointer}
.voice-suggestion-btn:active{background:var(--primary);color:#fff}
.voice-wave-container{display:flex;align-items:center;justify-content:center;gap:3px;padding:0 18px;height:30px}
.voice-wave-bar{width:4px;height:20px;background:var(--primary);border-radius:2px;animation:wave .8s ease-in-out infinite alternate}
.voice-wave-bar:nth-child(1){animation-delay:0s;height:12px}
.voice-wave-bar:nth-child(2){animation-delay:.1s;height:20px}
.voice-wave-bar:nth-child(3){animation-delay:.2s;height:8px}
.voice-wave-bar:nth-child(4){animation-delay:.3s;height:24px}
.voice-wave-bar:nth-child(5){animation-delay:.15s;height:14px}
.voice-wave-bar:nth-child(6){animation-delay:.25s;height:18px}
.voice-wave-bar:nth-child(7){animation-delay:.05s;height:10px}
@keyframes wave{0%{height:8px}100%{height:28px}}
.voice-input-bar{padding:16px;display:flex;gap:12px;background:var(--bg-card);border-top:1px solid #F0E8E0}
.voice-input-btn{
  flex:1;min-height:52px;border-radius:26px;border:2px solid var(--primary);background:var(--bg-card);
  color:var(--primary);font-size:var(--font-size-md);font-weight:600;cursor:pointer;transition:var(--transition);
  display:flex;align-items:center;justify-content:center;gap:8px
}
.voice-input-btn:active{transform:scale(0.97)}
.voice-input-btn.listening{background:var(--warning);border-color:var(--warning);color:#fff;animation:listeningPulse 1.2s ease-in-out infinite}
@keyframes listeningPulse{0%,100%{box-shadow:0 0 0 0 rgba(231,76,60,0.4)}50%{box-shadow:0 0 0 12px rgba(231,76,60,0)}}
.settings-section{margin-bottom:24px}
.settings-section-title{font-size:var(--font-size-md);font-weight:700;color:var(--text-primary);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.settings-item{background:var(--bg-card);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.settings-item-info{flex:1}
.settings-item-title{font-size:var(--font-size-md);font-weight:600}
.settings-item-sub{font-size:var(--font-size-sm);color:var(--text-secondary)}
.settings-item-actions{display:flex;gap:8px}
.settings-input-group{margin-bottom:12px}
.settings-label{font-size:var(--font-size-sm);font-weight:600;color:var(--text-primary);display:block;margin-bottom:6px}
.settings-input{
  width:100%;padding:12px 16px;border:2px solid #E8E0D8;border-radius:var(--radius-sm);
  font-size:var(--font-size-md);outline:none;transition:var(--transition);
  background:var(--bg-card);color:var(--text-primary)
}
.settings-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,140,66,0.15)}
.settings-add-btn{
  width:100%;min-height:48px;border:2px dashed #E8E0D8;border-radius:var(--radius-sm);
  background:transparent;font-size:var(--font-size-md);color:var(--text-secondary);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:var(--transition)
}
.settings-add-btn:hover{border-color:var(--primary-light);color:var(--primary)}
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);
  display:flex;align-items:flex-end;justify-content:center;z-index:200;animation:fadeIn .2s ease
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-content{
  background:var(--bg);border-radius:var(--radius)var(--radius)0 0;width:100%;max-width:480px;
  max-height:85vh;overflow-y:auto;padding:24px var(--spacing);animation:slideUp .3s ease
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-size:var(--font-size-lg);font-weight:700;margin-bottom:20px;text-align:center}
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:var(--bg-card);display:flex;padding:8px 0;box-shadow:0 -2px 12px rgba(0,0,0,0.08);z-index:99
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;
  color:var(--text-secondary);font-size:12px;padding:6px 0;transition:var(--transition);cursor:pointer
}
.nav-item.active{color:var(--primary)}
.nav-item-icon{font-size:22px}
@media(min-width:480px){.container{padding:0 24px}}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-secondary)}
.empty-state-icon{font-size:48px;margin-bottom:12px}
.empty-state-text{font-size:var(--font-size-md)}
.alert-banner{background:#FDEDEC;border:1px solid #F5C6CB;border-radius:var(--radius-sm);padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:12px;animation:alertPulse 2s ease-in-out infinite}
@keyframes alertPulse{0%,100%{opacity:1}50%{opacity:.85}}
.alert-icon{font-size:20px}
.alert-text{font-size:var(--font-size-sm);color:var(--warning);font-weight:600}
.spinner{width:24px;height:24px;border:3px solid #F0E8E0;border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite;margin:16px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.voice-input-modal-result{background:var(--bg-card);border-radius:var(--radius-sm);padding:16px;margin-bottom:16px;text-align:left;font-size:var(--font-size-sm);line-height:1.8}
.voice-input-modal-result strong{color:var(--primary)}
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  background:var(--text-primary);color:#fff;padding:12px 24px;border-radius:8px;
  font-size:18px;z-index:300;opacity:0;transition:opacity .3s ease;pointer-events:none
}
.page-view{display:none}
.page-view.active{display:block}
.voice-chat-scroll{flex:1;padding:0 16px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
</style>
</head>
<body>

<!-- ===== HOME PAGE ===== -->
<div class="page-view active" id="page-home">
  <div class="header">
    <div class="container">
      <div class="header-title">☁️ 小棉袄</div>
      <div class="header-subtitle">奶奶，今天也要按时吃药哦 💊</div>
      <div class="header-date">
        <span id="date-display"></span>
        <span style="margin-left:12px;font-size:28px;font-weight:700;" id="clock-display"></span>
      </div>
    </div>
  </div>
  <div class="container page">
    <div class="progress-section">
      <div class="progress-ring-container">
        <svg class="progress-ring" viewBox="0 0 80 80">
          <circle class="progress-ring-bg" cx="40" cy="40" r="36"/>
          <circle class="progress-ring-fill" id="progress-ring-fill" cx="40" cy="40" r="36"/>
        </svg>
        <div class="progress-text" id="progress-percent">0%</div>
      </div>
      <div class="progress-info">
        <div class="progress-info-text" id="progress-text">今日用药进度</div>
        <div class="progress-info-sub" id="progress-sub">已完成 0 / 0</div>
      </div>
    </div>
    <div class="alert-banner" id="alert-banner" style="display:none;">
      <span class="alert-icon">🔔</span>
      <span class="alert-text" id="alert-text">连续漏服提醒！</span>
    </div>
    <div class="section-title">📋 今日用药计划</div>
    <div class="med-list" id="med-list"></div>
  </div>
  <button class="voice-fab voice-fab-pulse" onclick="navigateTo('voice')" aria-label="语音问药">🎤</button>
  <nav class="bottom-nav">
    <div class="nav-item active" onclick="navigateTo('home')"><span class="nav-item-icon">🏠</span><span>首页</span></div>
    <div class="nav-item" onclick="navigateTo('settings')"><span class="nav-item-icon">⚙️</span><span>设置</span></div>
  </nav>
</div>

<!-- ===== DETAIL PAGE ===== -->
<div class="page-view" id="page-detail">
  <div class="detail-hero">
    <div class="container">
      <div class="back-btn" onclick="navigateTo('home')">← 返回首页</div>
      <div class="detail-name" id="detail-name">药品名称</div>
      <div class="detail-category" id="detail-category">分类</div>
    </div>
  </div>
  <div class="detail-body container page">
    <div class="detail-info-row"><div class="detail-info-icon">🕐</div><div class="detail-info-content"><div class="detail-info-label">服药时间</div><div class="detail-info-value" id="detail-time">--:--</div></div></div>
    <div class="detail-info-row"><div class="detail-info-icon">💊</div><div class="detail-info-content"><div class="detail-info-label">每次剂量</div><div class="detail-info-value" id="detail-dosage">--</div></div></div>
    <div class="detail-info-row"><div class="detail-info-icon">🍽️</div><div class="detail-info-content"><div class="detail-info-label">服用条件</div><div class="detail-info-value" id="detail-condition">--</div></div></div>
    <div class="detail-notes"><div class="detail-notes-title">📝 注意事项</div><div class="detail-notes-text" id="detail-notes">--</div></div>
    <div style="margin-top:24px;display:flex;flex-direction:column;gap:12px;">
      <button class="btn btn-primary btn-block" id="btn-confirm">✅ 确认已服药</button>
      <button class="btn btn-secondary btn-block" id="btn-speak">🔊 语音播报详情</button>
    </div>
  </div>
</div>

<!-- ===== VOICE PAGE ===== -->
<div class="page-view" id="page-voice">
  <div class="voice-page">
    <div class="voice-header">
      <div class="back-btn" onclick="navigateTo('home')">← 返回</div>
      <div style="font-size:20px;font-weight:700;color:var(--text-primary);flex:1;text-align:center;">🎤 语音问药</div>
      <div style="width:40px;"></div>
    </div>
    <div class="voice-mascot"><span class="voice-mascot-icon">☁️</span><div class="voice-mascot-text">小棉袄在这里，有什么想问的吗？</div></div>
    <div class="voice-chat" id="voice-chat"></div>
    <div class="voice-input-bar">
      <button class="voice-input-btn" id="voice-input-btn"><span id="voice-btn-icon">🎤</span><span id="voice-btn-text">按住说话</span></button>
    </div>
  </div>
</div>

<!-- ===== SETTINGS PAGE ===== -->
<div class="page-view" id="page-settings">
  <div class="header">
    <div class="container">
      <div class="header-title">⚙️ 用药设置</div>
      <div class="header-subtitle">子女端 · 管理老人的用药计划</div>
    </div>
  </div>
  <div class="container page">
    <div class="section-title">📊 今日完成概览</div>
    <div class="card" id="overview-card"></div>
    <div class="settings-section">
      <div class="settings-section-title">💊 用药计划管理</div>
      <div id="plan-list"></div>
      <button class="settings-add-btn" onclick="showAddModal()"><span style="font-size:24px;">+</span> 添加用药计划（支持语音输入）</button>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">📞 紧急联系人</div>
      <div class="card">
        <div class="settings-input-group"><label class="settings-label">联系人姓名</label><input class="settings-input" id="contact-name" type="text" placeholder="请输入联系人姓名"></div>
        <div class="settings-input-group"><label class="settings-label">联系电话</label><input class="settings-input" id="contact-phone" type="tel" placeholder="请输入手机号码"></div>
        <button class="btn btn-primary btn-block" onclick="saveContact()">保存联系人</button>
      </div>
    </div>
    <div style="display:flex;gap:12px;margin-top:16px;padding-bottom:20px;">
      <button class="btn btn-secondary btn-block btn-sm" onclick="resetData()">🔄 重置为默认数据</button>
      <button class="btn btn-secondary btn-block btn-sm" onclick="simulateMiss()">🔔 模拟漏服+1</button>
    </div>
  </div>
  <nav class="bottom-nav">
    <div class="nav-item" onclick="navigateTo('home')"><span class="nav-item-icon">🏠</span><span>首页</span></div>
    <div class="nav-item active" onclick="navigateTo('settings')"><span class="nav-item-icon">⚙️</span><span>设置</span></div>
  </nav>
</div>

<!-- ===== ADD PLAN MODAL ===== -->
<div class="modal-overlay" id="add-modal" style="display:none;">
  <div class="modal-content">
    <div class="modal-title">添加用药计划</div>
    <div id="voice-input-tab">
      <div style="text-align:center;padding:20px 0;">
        <div style="font-size:48px;margin-bottom:12px;">🎤</div>
        <div style="font-size:18px;color:var(--text-secondary);margin-bottom:16px;">
          点击下方按钮，语音输入用药计划<br>
          <small style="color:#999;">例如："每天早上七点，吃一片降压药，饭后服用"</small>
        </div>
        <button class="btn btn-primary" id="btn-voice-input" style="min-width:200px;">🎤 开始语音输入</button>
        <div class="spinner" id="voice-input-spinner" style="display:none;"></div>
        <div id="voice-input-result" style="display:none;margin-top:16px;text-align:left;">
          <div style="font-weight:600;margin-bottom:8px;">解析结果：</div>
          <div class="voice-input-modal-result" id="parsed-result"></div>
        </div>
      </div>
      <div style="text-align:center;margin-top:8px;">
        <button class="btn btn-secondary btn-sm" onclick="switchToManual()">✏️ 切换到手动输入</button>
      </div>
    </div>
    <div id="manual-input-tab" style="display:none;">
      <div class="settings-input-group"><label class="settings-label">药品名称</label><input class="settings-input" id="input-drug-name" type="text" placeholder="如：苯磺酸氨氯地平片"></div>
      <div class="settings-input-group"><label class="settings-label">服药时间</label><input class="settings-input" id="input-time" type="time" value="08:00"></div>
      <div class="settings-input-group"><label class="settings-label">剂量</label><input class="settings-input" id="input-dosage" type="text" placeholder="如：1片(5mg)"></div>
      <div class="settings-input-group"><label class="settings-label">服用条件</label>
        <select class="settings-input" id="input-condition">
          <option value="饭后服用">饭后服用</option><option value="饭前服用">饭前服用</option>
          <option value="空腹服用">空腹服用</option><option value="餐中服用">餐中服用</option>
          <option value="睡前服用">睡前服用</option>
        </select>
      </div>
      <div class="settings-input-group"><label class="settings-label">注意事项（选填）</label><input class="settings-input" id="input-notes" type="text" placeholder="服药注意事项"></div>
      <div style="display:flex;gap:12px;"><button class="btn btn-secondary btn-block" onclick="hideAddModal()">取消</button><button class="btn btn-primary btn-block" onclick="saveManualPlan()">保存</button></div>
      <div style="text-align:center;margin-top:12px;"><button class="btn btn-secondary btn-sm" onclick="switchToVoice()">🎤 切换到语音输入</button></div>
    </div>
    <div style="text-align:center;margin-top:16px;"><button class="btn btn-secondary btn-sm" onclick="hideAddModal()">关闭</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== DATA MODULE =====
const MedData = (function(){
  const defaultPlans=[
    {id:'p1',time:'07:00',drugName:'苯磺酸氨氯地平片',dosage:'1片 (5mg)',condition:'饭后服用',color:'#E74C3C',category:'降压药',notes:'用于治疗高血压。定期监测血压，不要自行停药。如果出现头晕、脚踝浮肿等症状请及时就医。'},
    {id:'p2',time:'12:00',drugName:'盐酸二甲双胍片',dosage:'1片 (0.5g)',condition:'餐中服用',color:'#27AE60',category:'降糖药',notes:'用于治疗2型糖尿病。随餐服用可减少胃肠道不适。注意监测血糖，避免低血糖发生。'},
    {id:'p3',time:'18:00',drugName:'阿托伐他汀钙片',dosage:'1片 (20mg)',condition:'晚饭后服用',color:'#3498DB',category:'降脂药',notes:'用于降低胆固醇。建议每天固定时间服用。服用期间避免大量食用葡萄柚。'},
    {id:'p4',time:'21:00',drugName:'艾司唑仑片',dosage:'0.5片 (0.5mg)',condition:'睡前服用',color:'#9B59B6',category:'安眠药',notes:'用于改善睡眠。服药后请立即上床休息，不要走动。可能引起头晕、嗜睡，白天活动时请注意安全。'}
  ];
  const KB=[
    {k:['饭前','饭后','空腹','什么时候吃'],a:'降压药建议饭后服用，可以减少对胃的刺激。降糖药二甲双胍建议餐中服用。降脂药建议晚饭后服用。安眠药请在睡前服用。'},
    {k:['几次','频率','一天'],a:'这些药都是一天服用一次。建议每天固定时间服用，这样药效最稳定。'},
    {k:['注意','禁忌','副作用'],a:'服用这些药有几个重要注意事项：1）降压药不要自行停药；2）降糖药注意监测血糖；3）降脂药避免吃葡萄柚；4）安眠药服后不要走动。'},
    {k:['治什么','作用','管什么'],a:'降压药用来控制血压，降糖药用来控制血糖，降脂药用来降低胆固醇，安眠药帮助改善睡眠。这些都是慢性病常用的药物。'},
    {k:['忘记','漏服','没吃'],a:'如果忘记服药：降压药想起后尽快补服，但如果接近下次服药时间就跳过；降糖药和降脂药同理。最重要的是不要一次吃双倍剂量。如果经常忘记，建议设置闹钟提醒，或让家人帮忙提醒。'}
  ];
  function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  return{
    getPlans(){const s=localStorage.getItem('med_plans');if(s)return JSON.parse(s);this.savePlans(defaultPlans);return[...defaultPlans]},
    savePlans(p){localStorage.setItem('med_plans',JSON.stringify(p))},
    getPlan(id){return this.getPlans().find(p=>p.id===id)},
    addPlan(p){const plans=this.getPlans();p.id='p'+Date.now();plans.push(p);this.savePlans(plans);return p},
    deletePlan(id){const plans=this.getPlans().filter(p=>p.id!==id);this.savePlans(plans);const r=this.getRecords();Object.keys(r).forEach(d=>{r[d]=r[d].filter(x=>x.planId!==id)});localStorage.setItem('med_records',JSON.stringify(r))},
    getRecords(){const s=localStorage.getItem('med_records');return s?JSON.parse(s):{}},
    confirmMedication(planId){const d=today(),r=this.getRecords();if(!r[d])r[d]=[];const e=r[d].find(x=>x.planId===planId);if(e){e.status='completed';e.confirmedAt=new Date().toTimeString().slice(0,5)}else{r[d].push({planId,status:'completed',confirmedAt:new Date().toTimeString().slice(0,5)})}localStorage.setItem('med_records',JSON.stringify(r));this.resetMissedCount(planId)},
    getTodayStatus(){const r=this.getRecords();return r[today()]||[]},
    getCompletionStats(){const p=this.getPlans(),s=this.getTodayStatus(),t=p.length,c=s.filter(x=>x.status==='completed').length;return{total:t,completed:c,percentage:t>0?Math.round(c/t*100):0}},
    isCompleted(planId){return this.getTodayStatus().some(s=>s.planId===planId&&s.status==='completed')},
    getMissedCount(planId){const s=localStorage.getItem('med_missed');const d=s?JSON.parse(s):{};return d[planId]||0},
    incrementMissedCount(planId){const s=localStorage.getItem('med_missed');const d=s?JSON.parse(s):{};d[planId]=(d[planId]||0)+1;localStorage.setItem('med_missed',JSON.stringify(d));return d[planId]},
    resetMissedCount(planId){const s=localStorage.getItem('med_missed');const d=s?JSON.parse(s):{};d[planId]=0;localStorage.setItem('med_missed',JSON.stringify(d))},
    getContact(){const s=localStorage.getItem('med_contact');return s?JSON.parse(s):{name:'李明',phone:'13812345678'}},
    saveContact(c){localStorage.setItem('med_contact',JSON.stringify(c))},
    queryKnowledge(q){
      if(!q)return'请说出您想了解的问题。';const ql=q.toLowerCase();
      for(const p of this.getPlans()){if(ql.includes(p.drugName)||ql.includes(p.category))return p.drugName+'（'+p.category+'）：每次'+p.dosage+'，'+p.condition+'。'+p.notes}
      for(const item of KB){for(const kw of item.k){if(ql.includes(kw))return item.a}}
      return'我理解您想了解用药知识。建议您按时服药，如有不适请及时咨询医生。您可以问我："这个药是饭前还是饭后吃"、"有什么注意事项"等问题。'
    },
    getDefaultPlans(){return[...defaultPlans]},
    sendAlert(planName){const c=this.getContact();return'⚠️ 已向 '+c.name+'（'+c.phone+'）发送漏服预警！'}
  }
})();

// ===== SPEECH MODULE =====
const SpeechModule = (function(){
  const hasTTS='speechSynthesis'in window,hasASR='SpeechRecognition'in window||'webkitSpeechRecognition'in window;
  let isListening=false,recognition=null;
  return{
    hasTTS(){return hasTTS},hasASR(){return hasASR},
    speak(text,opts={}){
      if(!hasTTS)return;window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=opts.rate||0.8;u.pitch=opts.pitch||1.1;u.volume=1;
      const v=window.speechSynthesis.getVoices().find(v=>v.lang.startsWith('zh'));if(v)u.voice=v;
      if(opts.onStart)u.onstart=opts.onStart;if(opts.onEnd)u.onend=opts.onEnd;
      window.speechSynthesis.speak(u);
    },
    stopSpeaking(){if(hasTTS)window.speechSynthesis.cancel()},
    startListening(opts={}){
      if(!hasASR||isListening)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
      recognition=new SR();recognition.lang='zh-CN';recognition.continuous=false;recognition.interimResults=true;recognition.maxAlternatives=1;
      isListening=true;let ft='';
      recognition.onresult=function(ev){let it='';for(let i=ev.resultIndex;i<ev.results.length;i++){const t=ev.results[i][0].transcript;if(ev.results[i].isFinal){ft+=t;if(opts.onFinalResult)opts.onFinalResult(ft)}else{it+=t;if(opts.onInterimResult)opts.onInterimResult(it)}}};
      recognition.onerror=function(){isListening=false;if(opts.onError)opts.onError()};
      recognition.onend=function(){isListening=false;if(opts.onEnd)opts.onEnd(ft)};
      recognition.start();
    },
    stopListening(){if(recognition&&isListening){recognition.stop();isListening=false}}
  }
})();

// ===== UTILITY FUNCTIONS =====
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';setTimeout(()=>t.style.opacity='0',2500)}
function navigateTo(page){
  document.querySelectorAll('.page-view').forEach(p=>p.classList.remove('active'));
  const map={home:'page-home',detail:'page-detail',voice:'page-voice',settings:'page-settings'};
  const el=document.getElementById(map[page]);if(el)el.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(page==='home'||page==='settings')document.querySelectorAll('.bottom-nav .nav-item').forEach((n,i)=>{if((page==='home'&&i===0)||(page==='settings'&&i===1))n.classList.add('active')});
  if(page==='home')renderHome();
  if(page==='detail')renderDetail();
  if(page==='settings')renderSettings();
  if(page==='voice')initVoice();
}
function renderMedCard(plan,completed){
  const sc=completed?'med-status-completed':'med-status-pending',st=completed?'✅ 已服':'⏰ 待服';
  return '<div class="med-card" onclick="showDetail(\''+plan.id+'\')"><div class="med-card-color" style="background:'+plan.color+'"></div><div class="med-time">'+plan.time+'</div><div class="med-info"><div class="med-name">'+plan.drugName+'</div><div class="med-condition">'+plan.condition+' · '+plan.dosage+'</div></div><span class="med-status '+sc+'">'+st+'</span></div>';
}

// ===== HOME RENDER =====
function renderHome(){
  const plans=MedData.getPlans(),stats=MedData.getCompletionStats();
  document.getElementById('progress-text').textContent='今日用药进度';
  document.getElementById('progress-sub').textContent='已完成 '+stats.completed+' / '+stats.total;
  document.getElementById('progress-percent').textContent=stats.percentage+'%';
  const cir=226.2;document.getElementById('progress-ring-fill').style.strokeDashoffset=cir-(stats.percentage/100)*cir;
  let hasAlert=false,alertText='';
  if(plans.length===0){document.getElementById('med-list').innerHTML='<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">还没有用药计划，请让家人在设置中添加</div></div>'}
  else{document.getElementById('med-list').innerHTML=plans.map(p=>renderMedCard(p,MedData.isCompleted(p.id))).join('');
    plans.forEach(p=>{const m=MedData.getMissedCount(p.id);if(m>=3){hasAlert=true;alertText='⚠️ '+p.drugName+' 已连续漏服 '+m+' 次，已通知紧急联系人！'}})}
  const b=document.getElementById('alert-banner');b.style.display=hasAlert?'flex':'none';if(hasAlert)document.getElementById('alert-text').textContent=alertText;
  const now=new Date(),ct=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  plans.forEach(p=>{if(p.time===ct&&!MedData.isCompleted(p.id)){const t='奶奶，'+p.time+'啦，该吃'+p.drugName+'了，'+p.condition+'，一次'+p.dosage+'。';if(SpeechModule.hasTTS())SpeechModule.speak(t,{rate:.75});if('Notification'in window&&Notification.permission==='granted')new Notification('用药小棉袄提醒',{body:t})}});
}

// ===== DETAIL =====
let currentDetailId=null;
function showDetail(id){currentDetailId=id;navigateTo('detail')}
function renderDetail(){
  const plan=MedData.getPlan(currentDetailId);if(!plan){document.getElementById('detail-name').textContent='未找到药品信息';return}
  document.getElementById('detail-name').textContent=plan.drugName;document.getElementById('detail-category').textContent=plan.category;
  document.getElementById('detail-time').textContent=plan.time;document.getElementById('detail-dosage').textContent=plan.dosage;
  document.getElementById('detail-condition').textContent=plan.condition;document.getElementById('detail-notes').textContent=plan.notes;
  const btn=document.getElementById('btn-confirm');
  if(MedData.isCompleted(currentDetailId)){btn.textContent='✅ 已确认服用';btn.disabled=true;btn.style.opacity='.6'}
  else{btn.textContent='✅ 确认已服药';btn.disabled=false;btn.style.opacity='1'}
  btn.onclick=function(){MedData.confirmMedication(currentDetailId);showToast('✅ 已记录：已服药！');this.textContent='✅ 已确认服用';this.disabled=true;this.style.opacity='.6'};
  document.getElementById('btn-speak').onclick=function(){SpeechModule.speak(plan.drugName+'，每次'+plan.dosage+'，'+plan.condition+'。注意事项：'+plan.notes,{rate:.75});showToast('🔊 正在语音播报...')};
}

// ===== VOICE =====
let voiceInited=false;
function initVoice(){
  if(voiceInited)return;voiceInited=true;
  const chat=document.getElementById('voice-chat');
  const suggestions=['这个药是饭前还是饭后吃？','有什么注意事项？','一天吃几次？'];
  function addMsg(text,type){const d=document.createElement('div');d.className='voice-msg voice-msg-'+type;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
  function addWave(){const d=document.createElement('div');d.className='voice-msg voice-msg-ai';d.innerHTML='<div class="voice-wave-container">'+Array(7).fill('<div class="voice-wave-bar"></div>').join('')+'</div>';chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
  function removeWave(){const w=chat.querySelector('.voice-wave-container');if(w)w.parentElement.remove()}
  function addSuggestions(){const d=document.createElement('div');d.className='voice-msg-ai-suggestion';d.innerHTML='<div style="margin-bottom:8px;">💡 试试问这些问题：</div>'+suggestions.map(q=>'<span class="voice-suggestion-btn" onclick="voiceAsk(\''+q+'\')">'+q+'</span>').join('');chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
  function addListeningAnim(){const d=document.createElement('div');d.className='voice-msg voice-msg-user';d.id='listening-wave';d.innerHTML='<div class="voice-wave-container">'+Array(7).fill('<div class="voice-wave-bar"></div>').join('')+'</div>';chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
  function removeListeningAnim(){const e=document.getElementById('listening-wave');if(e)e.remove()}
  window.voiceAsk=function(text){
    addMsg(text,'user');addWave();
    setTimeout(()=>{removeWave();const a=MedData.queryKnowledge(text);addMsg(a,'ai');if(SpeechModule.hasTTS())SpeechModule.speak(a,{rate:.8});addSuggestions()},1000+Math.random()*500)
  };
  function processVoiceInput(text){
    removeListeningAnim();if(!text.trim()){addMsg('我没有听清楚，您可以再说一遍吗？','ai');addSuggestions();return}
    addMsg(text,'user');addWave();
    setTimeout(()=>{
      removeWave();const cw=['知道了','好的','吃了','已服'];const isC=cw.some(w=>text.includes(w));
      if(isC){const a='好的奶奶，已经记录了！您真棒，按时吃药身体棒棒的 💪';addMsg(a,'ai');if(SpeechModule.hasTTS())SpeechModule.speak(a,{rate:.8});const plans=MedData.getPlans();for(const p of plans){if(!MedData.isCompleted(p.id)){MedData.confirmMedication(p.id);addMsg('已记录：'+p.drugName+' 已服用 ✅','ai');break}}}
      else{const a=MedData.queryKnowledge(text);addMsg(a,'ai');if(SpeechModule.hasTTS())SpeechModule.speak(a,{rate:.8})}
      addSuggestions()
    },800+Math.random()*500)
  }
  let isListening=false;
  const btn=document.getElementById('voice-input-btn'),icon=document.getElementById('voice-btn-icon'),txt=document.getElementById('voice-btn-text');
  function startL(){if(isListening)return;isListening=true;btn.classList.add('listening');icon.textContent='🔴';txt.textContent='正在聆听...';addListeningAnim();
    if(SpeechModule.hasASR()){SpeechModule.startListening({onFinalResult:function(t){processVoiceInput(t);stopL()},onError:function(){stopL()},onEnd:function(t){if(t)processVoiceInput(t);stopL()}})}
    else{setTimeout(()=>{const t=prompt('请输入您的问题：');if(t)processVoiceInput(t);else removeListeningAnim();stopL()},500)}
  }
  function stopL(){isListening=false;SpeechModule.stopListening();btn.classList.remove('listening');icon.textContent='🎤';txt.textContent='按住说话'}
  btn.onmousedown=function(e){e.preventDefault();startL()};btn.onmouseup=stopL;btn.onmouseleave=stopL;
  btn.ontouchstart=function(e){e.preventDefault();startL()};btn.ontouchend=stopL;btn.ontouchcancel=stopL;
  addMsg('奶奶您好！我是小棉袄。您有什么关于吃药的问题想问吗？按住下面的按钮就可以和我说话了。','ai');
  if(SpeechModule.hasTTS())SpeechModule.speak('奶奶您好！我是小棉袄。您有什么关于吃药的问题想问吗？按住下面的按钮就可以和我说话了。',{rate:.8});
  setTimeout(addSuggestions,1500);
}

// ===== SETTINGS =====
function renderSettings(){
  const stats=MedData.getCompletionStats();
  document.getElementById('overview-card').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;"><div><div style="font-size:22px;font-weight:700;">已完成 '+stats.completed+'/'+stats.total+'</div><div style="font-size:16px;color:var(--text-secondary);margin-top:4px;">'+(stats.percentage>=100?'🎉 全部完成！':stats.percentage>=50?'👍 进度良好':'📋 还有待完成')+'</div></div><div style="font-size:36px;font-weight:700;color:var(--primary);">'+stats.percentage+'%</div></div>';
  const plans=MedData.getPlans(),c=document.getElementById('plan-list');
  if(plans.length===0){c.innerHTML='<div class="empty-state"><div class="empty-state-icon">💊</div><div class="empty-state-text">暂无用药计划，点击下方按钮添加</div></div>';return}
  c.innerHTML=plans.map(p=>{
    const ic=MedData.isCompleted(p.id);
    return '<div class="settings-item"><div style="width:4px;background:'+p.color+';border-radius:2px;height:40px;flex-shrink:0;"></div><div class="settings-item-info"><div class="settings-item-title">'+p.drugName+'</div><div class="settings-item-sub">'+p.time+' · '+p.condition+' · '+p.dosage+' '+(ic?'✅ 已服':'⏰ 待服')+'</div></div><div class="settings-item-actions"><button class="btn btn-sm btn-danger" onclick="deletePlan(\''+p.id+'\')">删除</button></div></div>'
  }).join('');
  const ctc=MedData.getContact();document.getElementById('contact-name').value=ctc.name;document.getElementById('contact-phone').value=ctc.phone;
}
window.deletePlan=function(id){if(confirm('确定要删除这条用药计划吗？')){MedData.deletePlan(id);renderSettings()}};
function saveContact(){const n=document.getElementById('contact-name').value.trim(),p=document.getElementById('contact-phone').value.trim();if(!n||!p){alert('请填写完整的联系人信息');return}MedData.saveContact({name:n,phone:p});alert('✅ 紧急联系人已保存！')}
function resetData(){if(confirm('确定要重置为默认数据吗？')){localStorage.clear();renderSettings();alert('🔄 已重置为默认数据！')}}
function simulateMiss(){const plans=MedData.getPlans();if(plans.length===0){alert('暂无用药计划');return}
  for(const p of plans){if(!MedData.isCompleted(p.id)){const c=MedData.incrementMissedCount(p.id);alert('📊 '+p.drugName+' 漏服次数：'+c+'/3'+(c>=3?'\n⚠️ 已达3次，将触发预警！':'\n继续累计...'));if(c>=3)alert(MedData.sendAlert(p.drugName));renderSettings();return}}
  alert('今日所有药品已服用完毕！')
}

// ===== ADD MODAL =====
function showAddModal(){document.getElementById('add-modal').style.display='flex';document.getElementById('voice-input-tab').style.display='block';document.getElementById('manual-input-tab').style.display='none';document.getElementById('voice-input-result').style.display='none'}
function hideAddModal(){document.getElementById('add-modal').style.display='none'}
function switchToManual(){document.getElementById('voice-input-tab').style.display='none';document.getElementById('manual-input-tab').style.display='block'}
function switchToVoice(){document.getElementById('voice-input-tab').style.display='block';document.getElementById('manual-input-tab').style.display='none'}
document.getElementById('btn-voice-input').addEventListener('click',function(){
  const btn=this,spin=document.getElementById('voice-input-spinner'),res=document.getElementById('voice-input-result'),pr=document.getElementById('parsed-result');
  btn.disabled=true;btn.textContent='🎤 聆听中...';spin.style.display='block';res.style.display='none';
  function proc(text){spin.style.display='none';btn.disabled=false;btn.textContent='🎤 开始语音输入';if(!text.trim()){alert('未识别到有效内容，请重试或切换到手动输入。');return}
    const plan=parseVoiceToPlan(text);res.style.display='block';pr.innerHTML='<strong>药品名称：</strong>'+plan.drugName+'<br><strong>服药时间：</strong>'+plan.time+'<br><strong>剂量：</strong>'+plan.dosage+'<br><strong>服用条件：</strong>'+plan.condition+'<br><strong>原始语音：</strong><small style="color:#999;">'+text+'</small>';
    if(confirm('解析结果如下，是否保存该用药计划？\n\n药品：'+plan.drugName+'\n时间：'+plan.time+'\n剂量：'+plan.dosage+'\n条件：'+plan.condition)){MedData.addPlan(plan);renderSettings();hideAddModal();alert('✅ 用药计划已添加成功！')}
  }
  if(SpeechModule.hasASR()){SpeechModule.startListening({onFinalResult:function(t){proc(t)},onError:function(){spin.style.display='none';btn.disabled=false;btn.textContent='🎤 开始语音输入';alert('语音识别失败，请重试或切换到手动输入。')},onEnd:function(t){if(t)proc(t)}})}
  else{spin.style.display='none';const t=prompt('浏览器不支持语音识别，请输入用药计划描述：');if(t)proc(t)}
});
function saveManualPlan(){
  const name=document.getElementById('input-drug-name').value.trim(),time=document.getElementById('input-time').value,
        dosage=document.getElementById('input-dosage').value.trim(),cond=document.getElementById('input-condition').value,
        notes=document.getElementById('input-notes').value.trim();
  if(!name){alert('请输入药品名称');return}if(!dosage){alert('请输入剂量');return}
  const colors=['#FF8C42','#E74C3C','#27AE60','#3498DB','#9B59B6','#F39C12'];
  MedData.addPlan({time,drugName:name,dosage,condition:cond,color:colors[Math.floor(Math.random()*colors.length)],category:'其他',notes:notes||'请遵医嘱服用'});
  renderSettings();hideAddModal();alert('✅ 用药计划已添加成功！');
  document.getElementById('input-drug-name').value='';document.getElementById('input-dosage').value='';document.getElementById('input-notes').value='';
}
function parseVoiceToPlan(text){
  const plan={time:'08:00',drugName:'',dosage:'1片',condition:'饭后服用',color:'#FF8C42',category:'其他',notes:''};
  const tm=text.match(/([0-1]?[0-9]|2[0-3])[：:]?([0-5][0-9])/);if(tm)plan.time=tm[1].padStart(2,'0')+':'+tm[2];
  else{const hm=text.match(/(早上|早晨|上午|中午|下午|晚上|深夜)/);if(hm){const mp={'早上':'07:00','早晨':'07:00','上午':'09:00','中午':'12:00','下午':'15:00','晚上':'19:00','深夜':'22:00'};plan.time=mp[hm[1]]||'08:00'}}
  const dm=text.match(/([一二两三四半0-9.]+)\s*(片|粒|颗|袋|毫升|ml|mg|g)/);if(dm)plan.dosage=dm[0];
  if(text.includes('空腹'))plan.condition='空腹服用';else if(text.includes('饭前'))plan.condition='饭前服用';else if(text.includes('饭后')||text.includes('餐后'))plan.condition='饭后服用';else if(text.includes('餐中')||text.includes('随餐'))plan.condition='餐中服用';else if(text.includes('睡前'))plan.condition='睡前服用';
  let dt=text;dt=dt.replace(/[0-1]?[0-9][：:][0-5][0-9]/,'').replace(/(早上|早晨|上午|中午|下午|晚上|深夜)/,'').replace(/([一二两三四半0-9.]+)\s*(片|粒|颗|袋|毫升|ml|mg|g)/,'').replace(/(空腹|饭前|饭后|餐中|随餐|睡前)/,'').replace(/(服用|吃药|用药|吃)/,'').trim();
  plan.drugName=dt.length>0?dt:'未识别药品';return plan;
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded',function(){
  const days=['日','一','二','三','四','五','六'];
  function updateClock(){
    const n=new Date();document.getElementById('date-display').textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日 星期'+days[n.getDay()];
    document.getElementById('clock-display').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  }
  updateClock();setInterval(updateClock,1000);
  if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();
  renderHome();
  setInterval(function(){
    const now=new Date(),ct=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    MedData.getPlans().forEach(p=>{if(p.time===ct&&!MedData.isCompleted(p.id)){const t='奶奶，'+p.time+'啦，该吃'+p.drugName+'了，'+p.condition+'，一次'+p.dosage+'。';if(SpeechModule.hasTTS())SpeechModule.speak(t,{rate:.75})}})
  },30000);
});
</script>
