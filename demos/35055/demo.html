  <main class="app">
    <header class="app-head">
      <div class="brand"><span class="mark">时</span><span>时光相册</span></div>
      <div class="status" id="statusPill">等待上传照片</div>
    </header>

    <section class="workspace" aria-label="时光相册产品 Demo">
      <aside class="controls">
        <h1 class="panel-title">老照片智能处理</h1>
        <div class="group">
          <label class="upload" for="photoInput">
            <input id="photoInput" type="file" accept="image/*">
            <strong>上传或拍摄老照片</strong>
            <p class="help">手机可直接调用相机，电脑可选择本地图片。</p>
          </label>
        </div>

        <div class="group">
          <label for="repairRange">清晰化强度：<span id="repairValue">70</span>%</label>
          <input class="range" id="repairRange" type="range" min="0" max="100" value="70">
          <p class="help">模拟去噪、增强对比和细节锐化。</p>
        </div>

        <div class="group">
          <div class="toggle"><div><strong>黑白照片上色</strong><p class="help">为人物和背景添加柔和彩色。</p></div><label class="switch"><input id="colorToggle" type="checkbox" checked><span class="slider"></span></label></div>
          <div class="toggle"><div><strong>动态回忆预览</strong><p class="help">模拟眨眼、微笑、轻微转头。</p></div><label class="switch"><input id="motionToggle" type="checkbox"><span class="slider"></span></label></div>
        </div>

        <button class="btn primary" id="processBtn" type="button">开始智能处理</button>
        <button class="btn" id="sampleBtn" type="button">使用示例照片</button>
        <button class="btn blue" id="saveBtn" type="button">生成分享说明</button>
        <div class="share" id="shareText">处理完成后，可为家人生成一段照片故事说明。</div>
