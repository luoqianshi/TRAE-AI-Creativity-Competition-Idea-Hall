<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 梦境绘本站 DreamSketch</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(3deg); }
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pageFlip {
    0% { transform: perspective(800px) rotateY(0deg); }
    100% { transform: perspective(800px) rotateY(-180deg); }
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 20px rgba(168, 130, 255, 0.3); }
    50% { box-shadow: 0 0 40px rgba(168, 130, 255, 0.6); }
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-30px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  @keyframes starfall {
    0% { transform: translateY(-10px) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(100vh) translateX(100px) rotate(720deg); opacity: 0; }
  }

  body {
    font-family: 'Georgia', 'Noto Serif SC', serif;
    background: linear-gradient(135deg, #0a0015 0%, #1a0a3e 25%, #0d1b3e 50%, #1a0a3e 75%, #0a0015 100%);
    color: #e8e0f0;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Stars background */
  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    width: 3px; height: 3px;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--duration) ease-in-out infinite;
    animation-delay: var(--delay);
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 60px 0 40px;
    animation: fadeUp 1s ease-out;
  }
  .header h1 {
    font-size: 3em;
    background: linear-gradient(135deg, #c9a0ff, #7eb8ff, #ffa0d0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
    letter-spacing: 4px;
  }
  .header .subtitle {
    font-size: 1.1em;
    color: #a090c0;
    font-style: italic;
    letter-spacing: 2px;
  }
  .header .moon {
    font-size: 4em;
    display: block;
    margin-bottom: 20px;
    animation: float 6s ease-in-out infinite;
  }

  /* Input Section */
  .input-section {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(200, 180, 255, 0.2);
    border-radius: 24px;
    padding: 40px;
    margin: 30px 0;
    backdrop-filter: blur(10px);
    animation: fadeUp 1s ease-out 0.2s both, glow 4s ease-in-out infinite;
  }
  .input-section h2 {
    font-size: 1.4em;
    color: #c9a0ff;
    margin-bottom: 20px;
  }
  .dream-input {
    width: 100%;
    min-height: 100px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(200, 180, 255, 0.3);
    border-radius: 16px;
    padding: 20px;
    color: #e8e0f0;
    font-size: 1.1em;
    font-family: inherit;
    resize: vertical;
    outline: none;
    transition: all 0.3s;
    line-height: 1.8;
  }
  .dream-input:focus {
    border-color: #c9a0ff;
    box-shadow: 0 0 30px rgba(168, 130, 255, 0.2);
  }
  .dream-input::placeholder {
    color: #605080;
    font-style: italic;
  }
  .btn-generate {
    display: block;
    margin: 24px auto 0;
    padding: 16px 48px;
    background: linear-gradient(135deg, #8b5cf6, #6366f1, #a855f7);
    color: white;
    border: none;
    border-radius: 50px;
    font-size: 1.1em;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 2px;
    position: relative;
    overflow: hidden;
  }
  .btn-generate:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 40px rgba(139, 92, 246, 0.4);
  }
  .btn-generate:active { transform: translateY(0); }
  .btn-generate:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 60px 0;
    display: none;
  }
  .loading.active { display: block; }
  .loading-text {
    font-size: 1.2em;
    color: #a090c0;
    font-style: italic;
  }
  .loading-dots span {
    display: inline-block;
    width: 10px; height: 10px;
    background: #c9a0ff;
    border-radius: 50%;
    margin: 0 6px;
    animation: float 1.5s ease-in-out infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  /* Storybook */
  .storybook {
    display: none;
    margin: 40px 0;
  }
  .storybook.active { display: block; }

  .story-page {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(200, 180, 255, 0.15);
    border-radius: 20px;
    padding: 40px;
    margin: 24px 0;
    backdrop-filter: blur(10px);
    animation: fadeUp 0.8s ease-out both;
    position: relative;
    overflow: hidden;
  }
  .story-page::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at top left, rgba(168, 130, 255, 0.08), transparent 60%);
    pointer-events: none;
  }
  .story-page:nth-child(2) { animation-delay: 0.3s; }
  .story-page:nth-child(3) { animation-delay: 0.6s; }

  .page-number {
    position: absolute;
    top: 16px; right: 24px;
    font-size: 0.85em;
    color: #605080;
    font-style: italic;
  }
  .page-scene {
    width: 100%;
    height: 200px;
    border-radius: 16px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4em;
    position: relative;
    overflow: hidden;
  }
  .scene-1 {
    background: linear-gradient(135deg, #1a0533, #2d1b69, #0d1b3e);
  }
  .scene-2 {
    background: linear-gradient(135deg, #0d2b4a, #1a4a6e, #0a3d5c);
  }
  .scene-3 {
    background: linear-gradient(135deg, #2d1b4e, #4a1942, #1a0a3e);
  }
  .scene-element {
    animation: float 4s ease-in-out infinite;
    font-size: 1em;
  }
  .scene-element:nth-child(2) { animation-delay: 0.5s; font-size: 0.7em; position: absolute; top: 20%; left: 15%; }
  .scene-element:nth-child(3) { animation-delay: 1s; font-size: 0.5em; position: absolute; bottom: 20%; right: 15%; }

  .story-text {
    font-size: 1.15em;
    line-height: 2;
    color: #d0c8e0;
    text-indent: 2em;
    position: relative;
    z-index: 1;
  }
  .story-text p { margin-bottom: 16px; }

  /* Analysis Card */
  .analysis-card {
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(99, 102, 241, 0.1));
    border: 1px solid rgba(200, 180, 255, 0.25);
    border-radius: 24px;
    padding: 40px;
    margin: 30px 0;
    animation: fadeUp 0.8s ease-out 0.9s both;
  }
  .analysis-card h3 {
    font-size: 1.5em;
    color: #c9a0ff;
    margin-bottom: 24px;
    text-align: center;
  }
  .metric {
    display: flex;
    align-items: center;
    margin: 16px 0;
    animation: slideIn 0.6s ease-out both;
  }
  .metric:nth-child(2) { animation-delay: 1.1s; }
  .metric:nth-child(3) { animation-delay: 1.2s; }
  .metric:nth-child(4) { animation-delay: 1.3s; }
  .metric:nth-child(5) { animation-delay: 1.4s; }
  .metric:nth-child(6) { animation-delay: 1.5s; }
  .metric-label {
    width: 100px;
    font-size: 0.95em;
    color: #a090c0;
  }
  .metric-bar {
    flex: 1;
    height: 8px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 4px;
    overflow: hidden;
    margin: 0 16px;
  }
  .metric-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 1.5s ease-out;
    width: 0;
  }
  .fill-surreal { background: linear-gradient(90deg, #8b5cf6, #c084fc); }
  .fill-romance { background: linear-gradient(90deg, #ec4899, #f472b6); }
  .fill-adventure { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
  .fill-mystery { background: linear-gradient(90deg, #06b6d4, #22d3ee); }
  .fill-healing { background: linear-gradient(90deg, #10b981, #34d399); }
  .metric-value {
    width: 40px;
    text-align: right;
    font-size: 0.95em;
    color: #c9a0ff;
    font-weight: bold;
  }

  .dream-type {
    text-align: center;
    margin-top: 24px;
    padding: 20px;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 16px;
  }
  .dream-type-label {
    font-size: 0.9em;
    color: #8070a0;
    margin-bottom: 8px;
  }
  .dream-type-value {
    font-size: 1.3em;
    color: #e0d0ff;
    font-weight: bold;
  }

  /* Gallery section */
  .gallery {
    margin: 50px 0;
    animation: fadeUp 0.8s ease-out 1.2s both;
  }
  .gallery h3 {
    font-size: 1.4em;
    color: #c9a0ff;
    margin-bottom: 24px;
    text-align: center;
  }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }
  .gallery-item {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(200, 180, 255, 0.15);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
  }
  .gallery-item:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(139, 92, 246, 0.2);
    border-color: rgba(200, 180, 255, 0.4);
  }
  .gallery-emoji { font-size: 2.5em; margin-bottom: 12px; display: block; }
  .gallery-title {
    font-size: 0.95em;
    color: #c0b0e0;
    line-height: 1.5;
  }
  .gallery-date {
    font-size: 0.8em;
    color: #605080;
    margin-top: 8px;
  }

  /* Share card */
  .share-section {
    text-align: center;
    margin: 40px 0;
    animation: fadeUp 0.8s ease-out 1.5s both;
  }
  .btn-share {
    padding: 14px 40px;
    background: linear-gradient(135deg, #ec4899, #8b5cf6);
    color: white;
    border: none;
    border-radius: 50px;
    font-size: 1em;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 2px;
    margin: 0 8px;
  }
  .btn-share:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(236, 72, 153, 0.3);
  }
  .btn-retry {
    padding: 14px 40px;
    background: transparent;
    color: #a090c0;
    border: 1px solid rgba(200, 180, 255, 0.3);
    border-radius: 50px;
    font-size: 1em;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 2px;
    margin: 0 8px;
  }
  .btn-retry:hover {
    border-color: #c9a0ff;
    color: #c9a0ff;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 60px 0 40px;
    color: #4a3a6a;
    font-size: 0.9em;
    font-style: italic;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .header h1 { font-size: 2em; }
    .input-section, .story-page, .analysis-card { padding: 24px; }
    .page-scene { height: 150px; }
  }
</style>
</head>

<script>

(function() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';

    star.style.width = (1 + Math.random() * 3) + 'px';
    star.style.height = star.style.width;
    container.appendChild(star);
  }
})();

function generateDream() {
  const input = document.getElementById('dreamInput').value.trim();
  if (!input) {
    document.getElementById('dreamInput').focus();
    document.getElementById('dreamInput').style.borderColor = '#ec4899';
    setTimeout(() => document.getElementById('dreamInput').style.borderColor = 'rgba(200,180,255,0.3)', 1500);
    return;
  }

  document.getElementById('btnGenerate').disabled = true;
  document.getElementById('loading').classList.add('active');
  document.getElementById('storybook').classList.remove('active');

  // Pick a story based on keywords
  let key = 'ocean';
  if (/飞|天空|星|云|鸟/.test(input)) key = 'fly';
  else if (/森林|树|花|自然/.test(input)) key = 'forest';
  else if (/猫|狗|动物|宠物/.test(input)) key = 'cat';

  setTimeout(() => {
    showStory(key);
  }, 2500);
}

function showStory(key) {
  const story = dreamStories[key];
  document.getElementById('loading').classList.remove('active');
  document.getElementById('storybook').classList.add('active');

  // Pages
  document.getElementById('page1').innerHTML = story.pages[0];
  document.getElementById('page2').innerHTML = story.pages[1];
  document.getElementById('page3').innerHTML = story.pages[2];

  // Metrics
  const labels = ['val1','val2','val3','val4','val5'];
  const fills = ['fill1','fill2','fill3','fill4','fill5'];
  story.metrics.forEach((v, i) => {
    document.getElementById(labels[i]).textContent = v;
    setTimeout(() => {
      document.getElementById(fills[i]).style.width = v + '%';
    }, 200);
  });

  document.getElementById('dreamType').textContent = story.type;
  document.getElementById('btnGenerate').disabled = false;

  // Scroll to story
  document.getElementById('storybook').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function loadDream(key) {
  document.getElementById('loading').classList.add('active');
  document.getElementById('storybook').classList.remove('active');
  document.getElementById('btnGenerate').disabled = true;
  document.getElementById('btnGenerate').disabled = true;

  setTimeout(() => {
    showStory(key);
    document.getElementById('btnGenerate').disabled = false;
  }, 1500);
}

function shareDream() {
  const text = '我在 AI 梦境绘本站 生成了一个超美的梦境绘本！快来试试吧~';
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert('分享文案已复制到剪贴板！快去社交平台分享吧~');
    });
  } else {
    alert(text);
  }
}

function resetDemo() {
  document.getElementById('storybook').classList.remove('active');
  document.getElementById('dreamInput').value = '';
  document.getElementById('dreamInput').focus();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
