<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业安全培训完成质量评估平台</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
    --bg-deep: #0B0F14;
    --bg-panel: rgba(14, 20, 28, 0.95);
    --bg-panel-border: rgba(255,255,255,0.05);
    --bg-hover: rgba(255,255,255,0.04);
    --accent-green: #00C853;
    --accent-green-dim: #00C85340;
    --accent-teal: #00BFA5;
    --accent-orange: #FF9100;
    --accent-red: #FF5252;
    --accent-blue: #448AFF;
    --accent-purple: #AB47BC;
    --accent-gold: #FFD740;
    --text-primary: #E8ECF1;
    --text-secondary: #8A94A6;
    --text-dim: #4A5568;
    --success: #00C853;
    --warning: #FF9100;
    --danger: #FF5252;
    --info: #448AFF;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: 'Noto Sans SC', 'Space Grotesk', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
}

/* ===== 粒子背景 ===== */
#bgCanvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
}

/* ===== 主布局 ===== */
.main-grid {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: 240px 1fr 300px;
    grid-template-rows: 64px 1fr;
    height: 100vh; gap: 1px;
    background: rgba(0,0,0,0.3);
}

/* ===== 顶部栏 ===== */
.top-bar {
    grid-column: 1 / -1;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--bg-panel-border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
}

.logo-area { display: flex; align-items: center; gap: 12px; }
.logo-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent-green), var(--accent-teal));
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #000;
    box-shadow: 0 0 16px rgba(0,200,83,0.3);
}
.logo-text { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
.logo-sub { font-size: 10px; color: var(--text-secondary); letter-spacing: 2px; margin-top: 1px; }

.top-center {
    display: flex; gap: 32px;
}
.top-stat { text-align: center; }
.top-stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px; font-weight: 500;
}
.top-stat-value.green { color: var(--accent-green); }
.top-stat-value.orange { color: var(--accent-orange); }
.top-stat-value.red { color: var(--accent-red); }
.top-stat-value.blue { color: var(--accent-blue); }
.top-stat-label {
    font-size: 10px; color: var(--text-secondary);
    letter-spacing: 1px; text-transform: uppercase; margin-top: 2px;
}

.top-right { display: flex; align-items: center; gap: 12px; }
.search-box {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--bg-panel-border);
    border-radius: 8px; padding: 8px 14px;
    color: var(--text-primary); font-family: inherit; font-size: 13px;
    width: 200px; outline: none;
}
.search-box::placeholder { color: var(--text-dim); }
.search-box:focus { border-color: var(--accent-green); }

/* ===== 左侧面板 ===== */
.left-panel {
    background: var(--bg-panel);
    border-right: 1px solid var(--bg-panel-border);
    padding: 20px 14px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 20px;
}

.section-title {
    font-size: 10px; color: var(--text-dim);
    letter-spacing: 2px; text-transform: uppercase;
    font-weight: 600; margin-bottom: 10px;
}

.nav-item {
    padding: 10px 12px; border-radius: 8px;
    font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    transition: all 0.15s; color: var(--text-secondary);
    border: 1px solid transparent;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.nav-item.active {
    background: linear-gradient(90deg, rgba(0,200,83,0.12), transparent);
    color: var(--accent-green); border-color: rgba(0,200,83,0.2);
}
.nav-icon { width: 18px; text-align: center; }

.dept-tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 6px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--bg-panel-border);
    font-size: 12px; color: var(--text-secondary);
    cursor: pointer; margin: 3px; transition: all 0.15s;
}
.dept-tag:hover { background: var(--bg-hover); }
.dept-tag.active {
    background: rgba(0,200,83,0.12);
    color: var(--accent-green); border-color: rgba(0,200,83,0.25);
}
.dept-dot { width: 6px; height: 6px; border-radius: 50%; }

/* ===== 中央内容区 ===== */
.center-panel {
    background: var(--bg-deep);
    overflow-y: auto; padding: 20px 24px;
}

.content-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
}
.content-title { font-size: 18px; font-weight: 600; }
.content-sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

.filter-pills { display: flex; gap: 8px; }
.pill {
    padding: 6px 14px; border-radius: 16px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--bg-panel-border);
    font-size: 12px; color: var(--text-secondary); cursor: pointer;
    transition: all 0.15s;
}
.pill:hover { background: var(--bg-hover); }
.pill.active {
    background: rgba(0,200,83,0.15);
    color: var(--accent-green); border-color: rgba(0,200,83,0.3);
}

/* 卡片 */
.card {
    background: var(--bg-panel);
    border: 1px solid var(--bg-panel-border);
    border-radius: 12px; padding: 20px;
    margin-bottom: 16px;
}
.card-title {
    font-size: 13px; font-weight: 600;
    margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
}
.card-title-icon { font-size: 14px; }

/* 统计卡片行 */
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.stat-card {
    background: var(--bg-panel);
    border: 1px solid var(--bg-panel-border);
    border-radius: 12px; padding: 18px;
    position: relative; overflow: hidden;
}
.stat-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
}
.stat-card.green::before { background: linear-gradient(90deg, var(--accent-green), transparent); }
.stat-card.blue::before { background: linear-gradient(90deg, var(--accent-blue), transparent); }
.stat-card.orange::before { background: linear-gradient(90deg, var(--accent-orange), transparent); }
.stat-card.red::before { background: linear-gradient(90deg, var(--accent-red), transparent); }
.stat-card-label { font-size: 11px; color: var(--text-secondary); letter-spacing: 1px; }
.stat-card-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px; font-weight: 500; margin-top: 8px;
}
.stat-card-trend {
    font-size: 11px; margin-top: 6px;
    display: flex; align-items: center; gap: 4px;
}
.trend-up { color: var(--accent-green); }
.trend-down { color: var(--accent-red); }

/* 图表网格 */
.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.chart-grid.three { grid-template-columns: 1fr 1fr 1fr; }
.chart-box { background: var(--bg-panel); border: 1px solid var(--bg-panel-border); border-radius: 12px; padding: 16px; }
.chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.chart-title { font-size: 12px; font-weight: 600; }
.chart-sub { font-size: 11px; color: var(--text-dim); }

/* 表格 */
.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.data-table th {
    text-align: left; padding: 10px 12px;
    color: var(--text-dim); font-weight: 500;
    border-bottom: 1px solid var(--bg-panel-border);
    cursor: pointer; user-select: none;
}
.data-table td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.03); }
.data-table tr:hover td { background: var(--bg-hover); }
.data-table .name-cell { display: flex; align-items: center; gap: 10px; }
.avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: #000;
}
.score-badge {
    display: inline-flex; align-items: center;
    padding: 3px 10px; border-radius: 12px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500;
}
.score-high { background: rgba(0,200,83,0.15); color: var(--accent-green); }
.score-mid { background: rgba(255,145,0,0.15); color: var(--accent-orange); }
.score-low { background: rgba(255,82,82,0.15); color: var(--accent-red); }

/* 进度条 */
.progress-track { height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }

/* 雷达图容器 */
.radar-wrap { display: flex; align-items: center; justify-content: center; padding: 10px; }

/* 热力图 */
.heat-grid { display: grid; grid-template-columns: 100px repeat(5, 1fr); gap: 2px; }
.heat-cell {
    padding: 10px 6px; text-align: center; font-size: 11px;
    border-radius: 4px; transition: all 0.2s;
}
.heat-header { color: var(--text-dim); font-weight: 500; }
.heat-label { color: var(--text-secondary); text-align: left; padding-left: 10px; }

/* ===== 右侧面板 ===== */
.right-panel {
    background: var(--bg-panel);
    border-left: 1px solid var(--bg-panel-border);
    padding: 20px 16px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 20px;
}

.alert-item {
    padding: 12px; border-radius: 8px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--bg-panel-border);
    margin-bottom: 8px;
}
.alert-item.danger { border-color: rgba(255,82,82,0.25); background: rgba(255,82,82,0.04); }
.alert-item.warning { border-color: rgba(255,145,0,0.25); background: rgba(255,145,0,0.04); }
.alert-title { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.alert-text { font-size: 11px; color: var(--text-secondary); margin-top: 4px; line-height: 1.6; }
.alert-time { font-size: 10px; color: var(--text-dim); margin-top: 6px; }

.todo-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.03);
    font-size: 12px; color: var(--text-secondary);
}
.todo-check {
    width: 16px; height: 16px; border-radius: 4px;
    border: 1px solid var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; cursor: pointer; flex-shrink: 0;
}
.todo-check.done { background: var(--accent-green); border-color: var(--accent-green); color: #000; }

.tech-section {
    padding: 14px; border-radius: 10px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--bg-panel-border);
}
.tech-title { font-size: 10px; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
.tech-list { font-size: 11px; color: var(--text-secondary); line-height: 2; }
.tech-item::before { content: '›'; color: var(--accent-green); margin-right: 8px; }

/* ===== 滚动条 ===== */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

/* 隐藏类 */
.hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>

<div class="main-grid">
    <!-- 顶部栏 -->
    <div class="top-bar">
        <div class="logo-area">
            <div class="logo-icon">&#128737;</div>
            <div>
                <div class="logo-text">安培 · 安全培训质量评估平台</div>
                <div class="logo-sub">SAFETY TRAINING QUALITY ASSESSMENT</div>
            </div>
        </div>
        <div class="top-center">
            <div class="top-stat">
                <div class="top-stat-value blue" id="tTotal">0</div>
                <div class="top-stat-label">参训总人数</div>
            </div>
            <div class="top-stat">
                <div class="top-stat-value green" id="tComplete">0%</div>
                <div class="top-stat-label">培训完成率</div>
            </div>
            <div class="top-stat">
                <div class="top-stat-value orange" id="tPass">0%</div>
                <div class="top-stat-label">质量合格率</div>
            </div>
            <div class="top-stat">
                <div class="top-stat-value red" id="tRisk">0</div>
                <div class="top-stat-label">高风险人员</div>
            </div>
        </div>
        <div class="top-right">
            <input type="text" class="search-box" placeholder="搜索员工姓名 / 工号..." id="searchInput" oninput="doSearch(this.value)">
            <div style="font-size:12px;color:var(--text-secondary);">&#128100; 管理员</div>
        </div>
    </div>

    <!-- 左侧导航 -->
    <div class="left-panel">
        <div>
            <div class="section-title">功能视图</div>
            <div class="nav-item active" onclick="switchView('overview')" data-view="overview">
                <span class="nav-icon">&#127968;</span> 总览仪表盘
            </div>
            <div class="nav-item" onclick="switchView('personal')" data-view="personal">
                <span class="nav-icon">&#128100;</span> 个人评估详情
            </div>
            <div class="nav-item" onclick="switchView('weakness')" data-view="weakness">
                <span class="nav-icon">&#128295;</span> 薄弱环节分析
            </div>
            <div class="nav-item" onclick="switchView('matching')" data-view="matching">
                <span class="nav-icon">&#9889;</span> 岗位风险匹配
            </div>
        </div>

        <div>
            <div class="section-title">部门筛选</div>
            <div style="display:flex;flex-wrap:wrap;" id="deptFilters">
                <span class="dept-tag active" onclick="filterDept('all', this)">
                    <span class="dept-dot" style="background:var(--accent-green)"></span> 全部
                </span>
            </div>
        </div>

        <div>
            <div class="section-title">岗位筛选</div>
            <div style="display:flex;flex-wrap:wrap;" id="roleFilters">
                <span class="dept-tag active" onclick="filterRole('all', this)">
                    <span class="dept-dot" style="background:var(--accent-blue)"></span> 全部
                </span>
            </div>
        </div>
    </div>

    <!-- 中央内容 -->
    <div class="center-panel" id="centerPanel">
        <!-- 动态内容由JS生成 -->
    </div>

    <!-- 右侧面板 -->
    <div class="right-panel">
        <div>
            <div class="section-title">实时预警</div>
            <div id="alertPanel"></div>
        </div>

        <div>
            <div class="section-title">待办事项</div>
            <div id="todoPanel"></div>
        </div>

        <div class="tech-section">
            <div class="tech-title">技术原理与亮点</div>
            <div class="tech-list">
                <div class="tech-item">五维能力评估模型（知识/实操/应急/规范/风险识别）</div>
                <div class="tech-item">岗位-能力矩阵匹配算法</div>
                <div class="tech-item">培训质量趋势分析与预测</div>
                <div class="tech-item">薄弱项自动归因与课程推荐</div>
                <div class="tech-item">风险人员实时预警分级机制</div>
                <div class="tech-item">多部门/多岗位横向对比分析</div>
            </div>
        </div>
    </div>
</div>

<script>
// ==================== 粒子背景 ====================
const bCanvas = document.getElementById('bgCanvas');
const bCtx = bCanvas.getContext('2d');
let bParticles = [];
function resizeB() { bCanvas.width = window.innerWidth; bCanvas.height = window.innerHeight; }
resizeB(); window.addEventListener('resize', resizeB);
for (let i = 0; i < 60; i++) {
    bParticles.push({
        x: Math.random() * bCanvas.width, y: Math.random() * bCanvas.height,
        vx: (Math.random() - 0.5) * 0.2, vy: (Math.random() - 0.5) * 0.2,
        size: Math.random() * 1.5 + 0.3,
        alpha: Math.random() * 0.3 + 0.05,
        color: ['#00C853','#00BFA5','#448AFF'][Math.floor(Math.random()*3)]
    });
}
function drawBg() {
    bCtx.clearRect(0, 0, bCanvas.width, bCanvas.height);
    for (const p of bParticles) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > bCanvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > bCanvas.height) p.vy *= -1;
        bCtx.beginPath(); bCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        bCtx.fillStyle = p.color; bCtx.globalAlpha = p.alpha; bCtx.fill();
    }
    bCtx.globalAlpha = 1;
    requestAnimationFrame(drawBg);
}
drawBg();

// ==================== 模拟数据 ====================
const DEPTS = ['生产制造部', '设备维护部', '仓储物流部', '质量检测部', '行政办公部'];
const ROLES = ['一线操作工', '电工', '焊工', '叉车司机', '班组长', '仓储管理员', '质检员', '行政人员'];
const ROLE_RISK = { '一线操作工': 4, '电工': 5, '焊工': 5, '叉车司机': 4, '班组长': 3, '仓储管理员': 3, '质检员': 2, '行政人员': 1 };
const DEPT_COLORS = { '生产制造部': '#00C853', '设备维护部': '#448AFF', '仓储物流部': '#FF9100', '质量检测部': '#AB47BC', '行政办公部': '#00BFA5' };

const SKILL_NAMES = ['安全知识', '实操技能', '应急处置', '规范遵守', '风险识别'];

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randF(min, max) { return Math.random() * (max - min) + min; }

let employees = [];
for (let i = 0; i < 86; i++) {
    const dept = DEPTS[rand(0, DEPTS.length - 1)];
    const role = ROLES[rand(0, ROLES.length - 1)];
    const riskLevel = ROLE_RISK[role];
    const complete = Math.random() > 0.08;
    // 基础分 + 岗位风险影响（高风险岗位要求更高）
    const base = randF(55, 95);
    const skills = SKILL_NAMES.map(() => Math.min(100, Math.max(30, base + randF(-20, 15))));
    // 调整：如果未完成培训，所有分降低
    if (!complete) skills.forEach((s, idx) => { skills[idx] = s * 0.6; });
    const avg = skills.reduce((a, b) => a + b, 0) / skills.length;
    employees.push({
        id: `E${1000 + i}`, name: `员工${1000 + i}`, dept, role, riskLevel,
        complete, completeDate: complete ? `2025-0${rand(1,6)}-${rand(10,28)}` : '-',
        skills, avg,
        status: avg >= 85 ? '优秀' : avg >= 70 ? '合格' : avg >= 60 ? '待改进' : '不合格',
        trend: Math.random() > 0.5 ? 'up' : 'down'
    });
}

// ==================== 全局统计 ====================
function updateTopStats() {
    const filtered = getFiltered();
    const total = filtered.length;
    const complete = filtered.filter(e => e.complete).length;
    const pass = filtered.filter(e => e.avg >= 70).length;
    const risk = filtered.filter(e => e.avg < 60 && e.riskLevel >= 4).length;
    document.getElementById('tTotal').textContent = total;
    document.getElementById('tComplete').textContent = total > 0 ? Math.round(complete / total * 100) + '%' : '0%';
    document.getElementById('tPass').textContent = total > 0 ? Math.round(pass / total * 100) + '%' : '0%';
    document.getElementById('tRisk').textContent = risk;
}

let currentDept = 'all', currentRole = 'all', currentView = 'overview', searchQuery = '';

function getFiltered() {
    return employees.filter(e => {
        if (currentDept !== 'all' && e.dept !== currentDept) return false;
        if (currentRole !== 'all' && e.role !== currentRole) return false;
        if (searchQuery && !e.name.includes(searchQuery) && !e.id.includes(searchQuery)) return false;
        return true;
    });
}

// ==================== 部门/岗位筛选按钮 ====================
function renderFilters() {
    const deptEl = document.getElementById('deptFilters');
    const roleEl = document.getElementById('roleFilters');
    deptEl.innerHTML = `<span class="dept-tag ${currentDept === 'all' ? 'active' : ''}" onclick="filterDept('all', this)"><span class="dept-dot" style="background:var(--accent-green)"></span> 全部</span>`;
    DEPTS.forEach(d => {
        deptEl.innerHTML += `<span class="dept-tag ${currentDept === d ? 'active' : ''}" onclick="filterDept('${d}', this)"><span class="dept-dot" style="background:${DEPT_COLORS[d]}"></span> ${d}</span>`;
    });
    roleEl.innerHTML = `<span class="dept-tag ${currentRole === 'all' ? 'active' : ''}" onclick="filterRole('all', this)"><span class="dept-dot" style="background:var(--accent-blue)"></span> 全部</span>`;
    [...new Set(employees.map(e => e.role))].forEach(r => {

// ==================== 图表绘制工具 ====================
function createCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.style.width = '100%';
    return c;
}

function drawPie(canvas, data, colors, centerText = '') {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const total = data.reduce((a, b) => a + b, 0);
    let start = -Math.PI / 2;
    const cx = w / 2, cy = h / 2, r = Math.min(w, h) * 0.35;
    data.forEach((v, i) => {
        const angle = (v / total) * Math.PI * 2;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, start, start + angle); ctx.closePath();
        ctx.fillStyle = colors[i]; ctx.fill();
        start += angle;
    });
    // 内圆
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.65, 0, Math.PI * 2);
    ctx.fillStyle = '#0e141c'; ctx.fill();
    // 文字
    if (centerText) {
        ctx.fillStyle = '#E8ECF1'; ctx.font = 'bold 20px JetBrains Mono';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(centerText, cx, cy);
    }
}

function drawBar(canvas, labels, values, color) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const max = Math.max(...values) * 1.1 || 1;
    const barW = (w - 40) / values.length * 0.6;
    const gap = (w - 40) / values.length;
    values.forEach((v, i) => {
        const x = 20 + gap * i + (gap - barW) / 2;
        const barH = (v / max) * (h - 40);
        const y = h - 20 - barH;
        // 渐变
        const grad = ctx.createLinearGradient(0, y, 0, h - 20);
        grad.addColorStop(0, color); grad.addColorStop(1, color + '40');
        ctx.fillStyle = grad;
        ctx.fillRect(x, y, barW, barH);
        // 标签
        ctx.fillStyle = '#8A94A6'; ctx.font = '10px Noto Sans SC';
        ctx.textAlign = 'center';
        ctx.fillText(labels[i], x + barW / 2, h - 6);
        // 数值
        ctx.fillStyle = '#E8ECF1'; ctx.font = '11px JetBrains Mono';
        ctx.fillText(Math.round(v), x + barW / 2, y - 6);
    });
}

function drawLine(canvas, datasets, colors) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    let max = 0;
    datasets.forEach(ds => { max = Math.max(max, ...ds); });
    max = max * 1.1 || 100;
    datasets.forEach((ds, idx) => {
        if (ds.length < 2) return;
        ctx.strokeStyle = colors[idx]; ctx.lineWidth = 2;
        ctx.beginPath();
        ds.forEach((v, i) => {
            const x = (i / (ds.length - 1)) * (w - 30) + 10;
            const y = h - 20 - (v / max) * (h - 35);
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
        // 点
        ds.forEach((v, i) => {
            const x = (i / (ds.length - 1)) * (w - 30) + 10;
            const y = h - 20 - (v / max) * (h - 35);
            ctx.fillStyle = colors[idx]; ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
        });
    });
    // 横线
    ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();
}

function drawRadar(canvas, values, labels) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2, r = Math.min(w, h) * 0.38;
    const n = values.length;
    // 网格
    for (let ring = 1; ring <= 4; ring++) {
        ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
            const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
            const x = cx + Math.cos(angle) * r * (ring / 4);
            const y = cy + Math.sin(angle) * r * (ring / 4);
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath(); ctx.stroke();
    }
    // 轴线
    for (let i = 0; i < n; i++) {
        const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.06)';
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r); ctx.stroke();
        // 标签
        ctx.fillStyle = '#8A94A6'; ctx.font = '11px Noto Sans SC';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const lx = cx + Math.cos(angle) * (r + 18);
        const ly = cy + Math.sin(angle) * (r + 18);
        ctx.fillText(labels[i], lx, ly);
    }
    // 数据面
    ctx.fillStyle = 'rgba(0,200,83,0.2)'; ctx.strokeStyle = '#00C853'; ctx.lineWidth = 2;
    ctx.beginPath();
    values.forEach((v, i) => {
        const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
        const x = cx + Math.cos(angle) * r * (v / 100);
        const y = cy + Math.sin(angle) * r * (v / 100);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // 数据点
    values.forEach((v, i) => {
        const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
        const x = cx + Math.cos(angle) * r * (v / 100);
        const y = cy + Math.sin(angle) * r * (v / 100);
        ctx.fillStyle = '#00C853'; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill();
    });
}

function drawHeatmap(canvas, data, rowLabels, colLabels) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const cellW = (w - 80) / colLabels.length;
    const cellH = (h - 30) / rowLabels.length;

    colLabels.forEach((label, i) => {
        ctx.fillStyle = '#8A94A6'; ctx.font = '10px Noto Sans SC';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(label, 80 + i * cellW + cellW / 2, 14);
    });

    rowLabels.forEach((label, row) => {
        ctx.fillStyle = '#8A94A6'; ctx.font = '10px Noto Sans SC';
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(label, 6, 30 + row * cellH + cellH / 2);
        colLabels.forEach((_, col) => {
            const val = data[row][col];
            const intensity = val / 100;
            const r = Math.floor(255 * (1 - intensity) + 0 * intensity);
            const g = Math.floor(100 * (1 - intensity) + 200 * intensity);
            const b = Math.floor(100 * (1 - intensity) + 83 * intensity);
            ctx.fillStyle = `rgba(${r},${g},${b},${0.15 + intensity * 0.5})`;
            ctx.fillRect(80 + col * cellW + 1, 30 + row * cellH + 1, cellW - 2, cellH - 2);
            ctx.fillStyle = intensity > 0.5 ? '#000' : '#E8ECF1';
            ctx.font = '10px JetBrains Mono'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(Math.round(val), 80 + col * cellW + cellW / 2, 30 + row * cellH + cellH / 2);
        });
    });
}

        return SKILL_NAMES.map((_, i) => deptEmps.length > 0 ? deptEmps.reduce((a, e) => a + e.skills[i], 0) / deptEmps.length : 0);
    });

    const html = `
    <div class="content-header">
        <div>
            <div class="content-title">薄弱环节分析</div>
            <div class="content-sub">精准定位组织培训短板，数据驱动改进决策</div>
        </div>
    </div>
    <div class="chart-grid">
        <div class="chart-box">
            <div class="chart-header">
                <span class="chart-title">&#128293; 部门 × 能力 热力矩阵</span>
                <span class="chart-sub">颜色越深代表该维度得分越高</span>
            </div>
            <div id="heatContainer"></div>
        </div>
        <div class="chart-box">
            <div class="chart-header">
                <span class="chart-title">&#128200; 全员能力短板排行</span>
                <span class="chart-sub">五维能力中得分最低的维度统计</span>
            </div>
            <div id="weakBarContainer"></div>
        </div>
    </div>
    <div class="card">
        <div class="card-title">
            <span class="card-title-icon">&#128221;</span>
            薄弱项归因分析与改进方案
        </div>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;">
            <div style="background:rgba(255,255,255,0.02);border-radius:10px;padding:16px;border-left:3px solid var(--accent-red);">
                <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--accent-red)">&#128308; 高风险薄弱项</div>
                <div style="font-size:12px;color:var(--text-secondary);line-height:1.8;">
                    <p>应急处置能力在设备维护部平均分仅 <strong style="color:var(--text-primary)">${(deptSkillAvgs[1] ? deptSkillAvgs[1][2] : 0).toFixed(1)}</strong> 分</p>
                    <p>电工/焊工岗位风险高但应急演练参与率不足 60%</p>
                    <p style="margin-top:8px;color:var(--text-dim);">建议：增加实景应急演练频次，引入VR事故模拟训练。</p>
                </div>
            </div>
            <div style="background:rgba(255,255,255,0.02);border-radius:10px;padding:16px;border-left:3px solid var(--accent-orange);">
                <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--accent-orange)">&#128992; 中风险薄弱项</div>
                <div style="font-size:12px;color:var(--text-secondary);line-height:1.8;">
                    <p>风险识别能力在仓储物流部偏低</p>
                    <p>叉车司机对货物堆垛风险评估不准确</p>
                    <p style="margin-top:8px;color:var(--text-dim);">建议：开展岗位风险辨识工作坊，制作可视化风险地图。</p>
                </div>
            </div>
            <div style="background:rgba(255,255,255,0.02);border-radius:10px;padding:16px;border-left:3px solid var(--accent-blue);">
                <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--accent-blue)">&#128309; 可优化项</div>
                <div style="font-size:12px;color:var(--text-secondary);line-height:1.8;">
                    <p>规范遵守得分整体良好，但细节执行有波动</p>
                    <p>安全知识考核中劳保用品类题目错误率 18%</p>
                    <p style="margin-top:8px;color:var(--text-dim);">建议：更新题库，增加实操判断题型占比。</p>
                </div>
            </div>
            <div style="background:rgba(255,255,255,0.02);border-radius:10px;padding:16px;border-left:3px solid var(--accent-green);">
                <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--accent-green)">&#128994; 优势保持项</div>
                <div style="font-size:12px;color:var(--text-secondary);line-height:1.8;">
                    <p>生产制造部实操技能平均分达 82.3 分</p>
                    <p>班组长层级规范遵守得分最高</p>
                    <p style="margin-top:8px;color:var(--text-dim);">建议：提炼优秀经验，形成标准化培训课件推广。</p>
                </div>
            </div>
        </div>
    </div>
    `;
    document.getElementById('centerPanel').innerHTML = html;

    const heatC = createCanvas(500, 220);
    document.getElementById('heatContainer').appendChild(heatC);
    drawHeatmap(heatC, deptSkillAvgs, DEPTS, SKILL_NAMES);

    // 短板排行：统计每维度的最低分部门
    const weakData = SKILL_NAMES.map((name, i) => {
        const vals = deptSkillAvgs.map(d => d[i]);
        const min = Math.min(...vals);
        return { name, min };
    }).sort((a, b) => a.min - b.min);

    const weakC = createCanvas(400, 200);
    document.getElementById('weakBarContainer').appendChild(weakC);
    drawBar(weakC, weakData.map(d => d.name), weakData.map(d => d.min), '#FF5252');
}

function renderMatching() {
    const filtered = getFiltered();
    // 岗位-能力匹配度：岗位要求 vs 实际能力
    const matchData = filtered.map(e => {
        const required = e.riskLevel * 18 + 12; // 风险等级决定最低要求
        const gap = e.avg - required;
        return { ...e, required, gap, matchScore: Math.max(0, Math.min(100, (e.avg / required) * 100)) };
    }).sort((a, b) => a.gap - b.gap);

    const highRisk = matchData.filter(m => m.gap < -10);
    const ok = matchData.filter(m => m.gap >= 0);

    const html = `
    <div class="content-header">
        <div>
            <div class="content-title">岗位风险匹配</div>
            <div class="content-sub">评估员工能力与岗位安全要求的匹配程度</div>
        </div>
    </div>
    <div class="stat-row">
        <div class="stat-card green">
            <div class="stat-card-label">完全匹配人数</div>
            <div class="stat-card-value" style="color:var(--accent-green)">${ok.length}</div>
            <div class="stat-card-trend trend-up">能力满足岗位要求</div>
        </div>
        <div class="stat-card red">
            <div class="stat-card-label">不匹配预警</div>
            <div class="stat-card-value" style="color:var(--accent-red)">${highRisk.length}</div>
            <div class="stat-card-trend trend-down">需立即强化培训或调岗</div>
        </div>
        <div class="stat-card blue">
            <div class="stat-card-label">平均匹配度</div>
            <div class="stat-card-value" style="color:var(--accent-blue)">${matchData.length > 0 ? (matchData.reduce((a, m) => a + m.matchScore, 0) / matchData.length).toFixed(1) : 0}%</div>
            <div class="stat-card-trend">目标：≥90%</div>
        </div>
        <div class="stat-card orange">
            <div class="stat-card-label">最大能力缺口</div>
            <div class="stat-card-value" style="color:var(--accent-orange)">${matchData.length > 0 ? Math.abs(Math.min(...matchData.map(m => m.gap))).toFixed(1) : 0}</div>
            <div class="stat-card-trend trend-down">综合评分缺口</div>
        </div>
    </div>
    <div class="chart-grid">
        <div class="chart-box">
            <div class="chart-header">
                <span class="chart-title">&#9889; 不匹配人员预警清单</span>
                <span class="chart-sub">岗位风险等级高但培训得分不足的人员</span>
            </div>
            <table class="data-table">
                <thead>
                    <tr><th>员工</th><th>岗位</th><th>风险等级</th><th>要求分数</th><th>实际分数</th><th>缺口</th><th>匹配度</th><th>建议措施</th></tr>
                </thead>
                <tbody>
                    ${highRisk.slice(0, 8).map(m => `
                    <tr>
                        <td><div class="name-cell"><div class="avatar" style="background:${DEPT_COLORS[m.dept]}">${m.name.slice(-2)}</div>${m.name}</div></td>
                        <td>${m.role}</td>
                        <td>${'&#9733;'.repeat(m.riskLevel)}</td>
                        <td style="font-family:JetBrains Mono">${m.required.toFixed(0)}</td>
                        <td style="font-family:JetBrains Mono;color:${m.avg >= m.required ? 'var(--accent-green)' : 'var(--accent-red)'}">${m.avg.toFixed(0)}</td>
                        <td style="font-family:JetBrains Mono;color:var(--accent-red)">${m.gap > 0 ? '+' : ''}${m.gap.toFixed(1)}</td>
                        <td><div class="progress-track" style="width:60px;"><div class="progress-fill" style="width:${m.matchScore}%;background:${m.matchScore >= 90 ? 'var(--accent-green)' : m.matchScore >= 70 ? 'var(--accent-orange)' : 'var(--accent-red)'}"></div></div></td>
                        <td><span style="font-size:11px;color:var(--accent-orange)">${m.matchScore < 60 ? '强制停岗培训' : '限期强化培训'}</span></td>
                    </tr>
                    `).join('')}
                </tbody>
            </table>
        </div>
        <div class="chart-box">
            <div class="chart-header">
                <span class="chart-title">&#128200; 岗位匹配度分布</span>
                <span class="chart-sub">各岗位类型平均匹配度</span>
            </div>
            <div id="matchBarContainer"></div>
        </div>
    </div>
    <div class="card">
        <div class="card-title">
            <span class="card-title-icon">&#127919;</span>
            岗位-能力匹配评估模型原理
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;font-size:12px;color:var(--text-secondary);line-height:1.8;">
            <div style="background:rgba(255,255,255,0.02);border-radius:10px;padding:16px;">
                <div style="font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:8px;">1. 岗位风险定级</div>
                <p>根据岗位危险源辨识结果，将岗位按风险等级分为1-5级。风险等级越高，对员工安全能力的要求越高。</p>
                <p style="margin-top:6px;color:var(--text-dim);">如：焊工/电工 = 5级，行政人员 = 1级</p>
            </div>
            <div style="background:rgba(255,255,255,0.02);border-radius:10px;padding:16px;">
                <div style="font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:8px;">2. 能力基线计算</div>
                <p>公式：岗位最低要求分 = 风险等级 × 18 + 12</p>
                <p style="margin-top:6px;color:var(--text-dim);">5级岗位要求 ≥ 102分（即综合接近满分），1级岗位 ≥ 30分</p>
            </div>
            <div style="background:rgba(255,255,255,0.02);border-radius:10px;padding:16px;">
                <div style="font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:8px;">3. 匹配度判定</div>
                <p>匹配度 = 实际得分 / 岗位要求分 × 100%</p>
                <p style="margin-top:6px;color:var(--text-dim);">≥90% 合格 | 70%-90% 预警 | ＜70% 强制干预</p>
            </div>
        </div>
    </div>
    `;
    document.getElementById('centerPanel').innerHTML = html;

    // 岗位匹配度柱状图
    const roleMatch = {};
    matchData.forEach(m => {
        if (!roleMatch[m.role]) roleMatch[m.role] = { sum: 0, count: 0 };
        roleMatch[m.role].sum += m.matchScore;
        roleMatch[m.role].count++;
    });
    const rLabels = Object.keys(roleMatch);
    const rValues = rLabels.map(r => roleMatch[r].sum / roleMatch[r].count);
    const matchC = createCanvas(400, 200);
    document.getElementById('matchBarContainer').appendChild(matchC);
    drawBar(matchC, rLabels, rValues, '#AB47BC');
}

}
