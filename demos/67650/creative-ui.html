<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>字灵绘本冒险 - 创意UI方案</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #FF6B6B;
            --secondary-color: #4ECDC4;
            --accent-color: #FFE66D;
            --warm-brown: #8B5A2B;
            --soft-blue: #A8E6CF;
            --dark-text: #2D3436;
            --light-text: #636E72;
            --safe-margin: 5%;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #FFEAA7 0%, #FD79A8 50%, #A29BFE 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .safe-zone {
            padding: var(--safe-margin);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            width: 100%;
            max-width: 480px;
            height: 850px;
            background: #FFFFFF;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15), 0 0 100px rgba(255, 107, 107, 0.2);
            overflow: hidden;
            position: relative;
        }

        .game-screen {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            flex-direction: column;
        }

        .game-screen.active {
            display: flex;
        }

        .start-screen {
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #FF9A9E 0%, #FECFEF 50%, #FECFEF 100%);
        }

        .start-content {
            text-align: center;
            padding: 40px;
        }

        .start-logo {
            width: 200px;
            height: 200px;
            margin: 0 auto 32px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float 3s ease-in-out infinite;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .start-logo span {
            font-size: 80px;
            font-family: 'KaiTi', serif;
            color: white;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.2);
        }

        .start-title {
            font-size: 42px;
            color: white;
            margin-bottom: 12px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
            font-weight: bold;
        }

        .start-subtitle {
            font-size: 18px;
            color: rgba(255,255,255,0.9);
            margin-bottom: 60px;
        }

        .start-button {
            background: linear-gradient(145deg, #4ECDC4 0%, #44A08D 100%);
            border: none;
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 20px 60px;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.4);
            transition: all 0.3s ease;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .start-button:hover {
            transform: translateY(-6px) scale(1.05);
            box-shadow: 0 15px 40px rgba(78, 205, 196, 0.5);
        }

        .start-button:active {
            transform: translateY(0);
        }

        .tap-indicator {
            position: absolute;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            animation: tapHint 2s ease-in-out infinite;
        }

        @keyframes tapHint {
            0%, 100% { opacity: 0.5; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-10px); }
        }

        .tap-circle {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255,255,255,0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tap-circle svg {
            width: 24px;
            height: 24px;
            fill: rgba(255,255,255,0.8);
        }

        .tap-text {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: rgba(0,0,0,0.1);
            z-index: 100;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            width: 0%;
            transition: width 0.5s ease;
        }

        .star-collection {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 8px;
            z-index: 40;
        }

        .star {
            width: 32px;
            height: 32px;
            fill: #FFEAA7;
            stroke: #FDCB6E;
            stroke-width: 2px;
            transition: all 0.3s ease;
        }

        .star.active {
            fill: #FFE66D;
            filter: drop-shadow(0 0 8px rgba(255, 230, 109, 0.8));
            animation: starPop 0.5s ease-out;
        }

        @keyframes starPop {
            0% { transform: scale(0); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .interaction-hint {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            z-index: 40;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
            50% { transform: scale(1.1); box-shadow: 0 8px 25px rgba(78, 205, 196, 0.4); }
        }

        .interaction-hint svg {
            width: 28px;
            height: 28px;
            fill: var(--secondary-color);
        }

        .story-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, #87CEEB 0%, #7EC8E3 30%, #98D8C8 60%, #FFEAA7 100%);
        }

        .background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .sun {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #FFE66D 0%, #FFD93D 60%, #FDCB6E 100%);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 230, 109, 0.6);
            animation: sunPulse 4s ease-in-out infinite;
        }

        @keyframes sunPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(255, 230, 109, 0.6); }
            50% { box-shadow: 0 0 60px rgba(255, 230, 109, 0.8); }
        }

        .cloud {
            position: absolute;
            background: rgba(255,255,255,0.9);
            border-radius: 50px;
            animation: cloudFloat 20s linear infinite;
        }

        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
        }

        .cloud-1 {
            top: 80px;
            left: -150px;
            width: 100px;
            height: 40px;
            animation-duration: 25s;
        }

        .cloud-1::before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 15px;
        }

        .cloud-1::after {
            width: 40px;
            height: 40px;
            top: -20px;
            left: 50px;
        }

        .cloud-2 {
            top: 150px;
            left: -200px;
            width: 120px;
            height: 45px;
            animation-duration: 30s;
            animation-delay: -10s;
        }

        .cloud-2::before {
            width: 60px;
            height: 60px;
            top: -30px;
            left: 20px;
        }

        .cloud-2::after {
            width: 45px;
            height: 45px;
            top: -22px;
            left: 65px;
        }

        @keyframes cloudFloat {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 200px)); }
        }

        .mountain {
            position: absolute;
            bottom: 35%;
            width: 0;
            height: 0;
            border-style: solid;
        }

        .mountain-1 {
            left: -50px;
            border-width: 0 150px 180px 150px;
            border-color: transparent transparent #6C7B8B transparent;
        }

        .mountain-2 {
            left: 50px;
            border-width: 0 120px 150px 120px;
            border-color: transparent transparent #7A8C9E transparent;
        }

        .mountain-3 {
            right: -30px;
            border-width: 0 180px 200px 180px;
            border-color: transparent transparent #5D6D7E transparent;
        }

        .mountain-snow {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-style: solid;
        }

        .mountain-1 .mountain-snow {
            border-width: 0 40px 50px 40px;
            border-color: transparent transparent rgba(255,255,255,0.8) transparent;
        }

        .mountain-2 .mountain-snow {
            border-width: 0 35px 45px 35px;
            border-color: transparent transparent rgba(255,255,255,0.8) transparent;
        }

        .mountain-3 .mountain-snow {
            border-width: 0 50px 60px 50px;
            border-color: transparent transparent rgba(255,255,255,0.8) transparent;
        }

        .forest {
            position: absolute;
            bottom: 30%;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
        }

        .tree {
            position: relative;
        }

        .tree-trunk {
            width: 20px;
            height: 40px;
            background: linear-gradient(90deg, #8B5A2B 0%, #A0522D 50%, #8B5A2B 100%);
            margin: 0 auto;
        }

        .tree-foliage {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-style: solid;
        }

        .tree-1 .tree-foliage {
            border-width: 0 35px 60px 35px;
            border-color: transparent transparent #228B22 transparent;
        }

        .tree-1 .tree-foliage::after {
            content: '';
            position: absolute;
            bottom: -45px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 25px 45px 25px;
            border-color: transparent transparent #2E8B57 transparent;
        }

        .tree-2 .tree-foliage {
            border-width: 0 40px 70px 40px;
            border-color: transparent transparent #32CD32 transparent;
        }

        .tree-2 .tree-foliage::after {
            content: '';
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 30px 50px 30px;
            border-color: transparent transparent #3CB371 transparent;
        }

        .tree-3 .tree-foliage {
            border-width: 0 30px 55px 30px;
            border-color: transparent transparent #228B22 transparent;
        }

        .tree-3 .tree-foliage::after {
            content: '';
            position: absolute;
            bottom: -42px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 22px 40px 22px;
            border-color: transparent transparent #2E8B57 transparent;
        }

        .river {
            position: absolute;
            bottom: 20%;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(180deg, #4682B4 0%, #5BA3D4 50%, #4682B4 100%);
            border-radius: 0 0 50% 50%;
            overflow: hidden;
        }

        .river-wave {
            position: absolute;
            width: 200%;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                transparent 0px,
                transparent 20px,
                rgba(255,255,255,0.1) 20px,
                rgba(255,255,255,0.1) 40px
            );
            animation: waveMove 3s linear infinite;
        }

        @keyframes waveMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .river-ripple {
            position: absolute;
            width: 40px;
            height: 15px;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            animation: rippleExpand 2s ease-out infinite;
        }

        .river-ripple-1 {
            top: 30%;
            left: 20%;
        }

        .river-ripple-2 {
            top: 50%;
            left: 60%;
            animation-delay: 0.5s;
        }

        .river-ripple-3 {
            top: 70%;
            left: 40%;
            animation-delay: 1s;
        }

        @keyframes rippleExpand {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        .foreground-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25%;
            background: linear-gradient(0deg, #8B4513 0%, #A0522D 40%, rgba(139, 69, 19, 0) 100%);
        }

        .grass {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
        }

        .grass-blade {
            width: 6px;
            background: linear-gradient(to top, #228B22 0%, #32CD32 100%);
            border-radius: 3px 3px 0 0;
            animation: grassSway 3s ease-in-out infinite;
        }

        .grass-blade:nth-child(odd) { height: 40px; animation-delay: 0s; }
        .grass-blade:nth-child(even) { height: 55px; animation-delay: 0.5s; }
        .grass-blade:nth-child(3n) { height: 35px; animation-delay: 1s; }
        .grass-blade:nth-child(4n) { height: 50px; animation-delay: 1.5s; }

        @keyframes grassSway {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        .character-sprite {
            position: absolute;
            bottom: 20%;
            left: 20%;
            width: 80px;
            height: 120px;
            transition: all 0.5s ease;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .character-head {
            width: 40px;
            height: 40px;
            background: #FFE4C4;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .character-eye {
            position: absolute;
            top: 12px;
            width: 6px;
            height: 6px;
            background: #2D3436;
            border-radius: 50%;
        }

        .character-eye.left { left: 10px; }
        .character-eye.right { right: 10px; }

        .character-mouth {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 6px;
            border-bottom: 2px solid #2D3436;
            border-radius: 0 0 6px 6px;
        }

        .character-body {
            width: 35px;
            height: 50px;
            background: linear-gradient(180deg, #FF6B6B 0%, #EE5A5A 100%);
            border-radius: 10px 10px 5px 5px;
            margin-top: -5px;
            position: relative;
        }

        .character-body::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 25px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
        }

        .character-leg {
            width: 12px;
            height: 25px;
            background: #4A4A4A;
            border-radius: 0 0 6px 6px;
            position: absolute;
            bottom: -25px;
        }

        .character-leg.left { left: 6px; }
        .character-leg.right { right: 6px; }

        .character-arm {
            width: 10px;
            height: 35px;
            background: #FF6B6B;
            border-radius: 5px;
            position: absolute;
            top: 5px;
        }

        .character-arm.left {
            left: -10px;
            transform: rotate(-20deg);
        }

        .character-arm.right {
            right: -10px;
            transform: rotate(20deg);
        }

        .character-sprite.move-right {
            animation: walkRight 1s ease-out forwards;
        }

        @keyframes walkRight {
            0% { left: 20%; }
            100% { left: 60%; }
        }

        .character-sprite.jump {
            animation: jump 0.6s ease-in-out;
        }

        @keyframes jump {
            0%, 100% { bottom: 20%; }
            50% { bottom: 35%; }
        }

        .boat-sprite {
            position: absolute;
            bottom: 18%;
            right: -200px;
            width: 100px;
            height: 50px;
            transition: all 1s ease;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .boat-sprite.appear {
            right: 30%;
        }

        .boat-body {
            width: 100px;
            height: 35px;
            background: linear-gradient(180deg, #8B5A2B 0%, #654321 100%);
            border-radius: 50px 50px 10px 10px;
            position: relative;
        }

        .boat-body::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 10%;
            width: 80%;
            height: 15px;
            background: linear-gradient(180deg, #A0522D 0%, #8B4513 100%);
            border-radius: 5px 5px 0 0;
        }

        .boat-mast {
            width: 6px;
            height: 30px;
            background: #8B5A2B;
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
        }

        .boat-sail {
            width: 40px;
            height: 25px;
            background: rgba(255,255,255,0.9);
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            clip-path: polygon(0 100%, 50% 0%, 100% 100%);
        }

        .guide-sprite {
            position: absolute;
            top: 120px;
            right: -100px;
            width: 60px;
            height: 60px;
            z-index: 25;
            transition: right 0.5s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .guide-sprite.appear {
            right: 20px;
        }

        .guide-body {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #FFE66D 0%, #FFD93D 60%, #FDCB6E 100%);
            border-radius: 50%;
            position: relative;
            animation: bounce 1s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(255, 230, 109, 0.6);
        }

        .guide-wing {
            width: 15px;
            height: 8px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            position: absolute;
            top: 12px;
            animation: wingFlap 0.3s ease-in-out infinite;
        }

        .guide-wing.left {
            left: -12px;
            transform-origin: right center;
        }

        .guide-wing.right {
            right: -12px;
            transform-origin: left center;
        }

        @keyframes wingFlap {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(30deg); }
        }

        .guide-crown {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 10px 15px 10px;
            border-color: transparent transparent #FF6B6B transparent;
        }

        .guide-crown::before, .guide-crown::after {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
        }

        .guide-crown::before {
            top: 5px;
            left: -15px;
            border-width: 0 5px 8px 5px;
            border-color: transparent transparent #FF6B6B transparent;
        }

        .guide-crown::after {
            top: 5px;
            right: -15px;
            border-width: 0 5px 8px 5px;
            border-color: transparent transparent #FF6B6B transparent;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .guide-bubble {
            position: absolute;
            top: 110px;
            right: 100px;
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 12px 16px;
            font-size: 14px;
            color: var(--dark-text);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            opacity: 0;
            transition: opacity 0.3s;
            max-width: 150px;
        }

        .guide-bubble.appear {
            opacity: 1;
        }

        .guide-bubble::after {
            content: '';
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-left: 8px solid rgba(255,255,255,0.95);
        }

        .dialogue-box {
            position: absolute;
            bottom: 180px;
            left: 16px;
            right: 16px;
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 20;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .dialogue-box::before {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 12px solid rgba(255,255,255,0.95);
        }

        .dialogue-text {
            font-size: 18px;
            color: var(--dark-text);
            line-height: 1.5;
            text-align: center;
        }

        .word-choice-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.95) 20%);
            padding: 24px 16px 32px;
            display: flex;
            justify-content: center;
            gap: 16px;
            z-index: 30;
        }

        .word-card {
            width: 100px;
            height: 130px;
            background: linear-gradient(145deg, #FFFFFF 0%, #F8F9FA 100%);
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08), inset 0 2px 4px rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .word-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .word-card:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15), inset 0 2px 4px rgba(255,255,255,0.5);
        }

        .word-card:hover::before {
            opacity: 1;
        }

        .word-card.selected {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 15px 35px rgba(255,107,107,0.3), inset 0 0 20px rgba(255,107,107,0.1);
            border: 3px solid var(--primary-color);
        }

        .word-card.selected::before {
            opacity: 1;
            background: var(--primary-color);
        }

        .word-card.incorrect {
            animation: shake 0.5s ease-in-out;
            background: linear-gradient(145deg, #FFEAA7 0%, #FD79A8 100%);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .word-card.correct {
            animation: glow 0.5s ease-in-out;
            background: linear-gradient(145deg, #A8E6CF 0%, #4ECDC4 100%);
            border: 3px solid #26D0CE;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(78, 205, 196, 0.3); }
            50% { box-shadow: 0 0 60px rgba(78, 205, 196, 0.8); }
        }

        .word-character {
            font-size: 48px;
            font-weight: bold;
            color: var(--dark-text);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
            margin-bottom: 8px;
            font-family: 'KaiTi', serif;
        }

        .word-pinyin {
            font-size: 14px;
            color: var(--light-text);
            letter-spacing: 2px;
        }

        .word-icon {
            font-size: 36px;
            margin-bottom: 8px;
            opacity: 0.8;
        }

        .magic-effect {
            position: absolute;
            pointer-events: none;
            z-index: 50;
        }

        .magic-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: floatUp 1s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(0); opacity: 0; }
        }

        .word-glow {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,230,109,0.8) 0%, rgba(255,107,107,0) 70%);
            animation: expandGlow 0.6s ease-out forwards;
            pointer-events: none;
        }

        @keyframes expandGlow {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

        .result-screen {
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #667EEA 0%, #764BA2 100%);
        }

        .result-content {
            text-align: center;
            color: white;
            padding: 40px;
        }

        .result-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 32px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: resultPop 0.6s ease-out;
        }

        @keyframes resultPop {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .result-icon svg {
            width: 60px;
            height: 60px;
            fill: white;
        }

        .result-title {
            font-size: 36px;
            margin-bottom: 16px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
        }

        .result-score {
            font-size: 72px;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
        }

        .result-label {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .result-stars {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 40px;
        }

        .result-stars .star {
            width: 48px;
            height: 48px;
        }

        .action-button {
            background: linear-gradient(145deg, #FF6B6B 0%, #FF8E53 100%);
            border: none;
            color: white;
            font-size: 20px;
            font-weight: bold;
            padding: 16px 48px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
            transition: all 0.3s ease;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .action-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(255, 107, 107, 0.5);
        }

        .action-button:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .safe-zone {
                padding: 2%;
            }
            
            .game-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="safe-zone">
        <div class="game-container">
            <div class="game-screen active" id="start-screen">
                <div class="start-content">
                    <div class="start-logo">
                        <span>字</span>
                    </div>
                    <h1 class="start-title">字灵绘本冒险</h1>
                    <p class="start-subtitle">用汉字的力量，开启魔法冒险</p>
                    <button class="start-button" onclick="startGame()">开始冒险</button>
                </div>
                <div class="tap-indicator">
                    <div class="tap-circle">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    </div>
                    <span class="tap-text">点击开始</span>
                </div>
            </div>

            <div class="game-screen" id="game-screen">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                
                <div class="star-collection">
                    <svg class="star" viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26 12,2"/></svg>
                    <svg class="star" viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26 12,2"/></svg>
                    <svg class="star" viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26 12,2"/></svg>
                </div>

                <div class="interaction-hint" onclick="toggleMicrophone()">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
                </div>

                <div class="story-area">
                    <div class="background-layer">
                        <div class="sun"></div>
                        <div class="cloud cloud-1"></div>
                        <div class="cloud cloud-2"></div>
                        <div class="mountain mountain-1"><div class="mountain-snow"></div></div>
                        <div class="mountain mountain-2"><div class="mountain-snow"></div></div>
                        <div class="mountain mountain-3"><div class="mountain-snow"></div></div>
                        <div class="forest">
                            <div class="tree tree-1"><div class="tree-trunk"></div><div class="tree-foliage"></div></div>
                            <div class="tree tree-2"><div class="tree-trunk"></div><div class="tree-foliage"></div></div>
                            <div class="tree tree-3"><div class="tree-trunk"></div><div class="tree-foliage"></div></div>
                        </div>
                        <div class="river">
                            <div class="river-wave"></div>
                            <div class="river-ripple river-ripple-1"></div>
                            <div class="river-ripple river-ripple-2"></div>
                            <div class="river-ripple river-ripple-3"></div>
                        </div>
                        <div class="foreground-layer"></div>
                        <div class="grass">
                            <div class="grass-blade"></div>
                            <div class="grass-blade"></div>
                            <div class="grass-blade"></div>
                            <div class="grass-blade"></div>
                            <div class="grass-blade"></div>
                            <div class="grass-blade"></div>
                            <div class="grass-blade"></div>
                            <div class="grass-blade"></div>
                            <div class="grass-blade"></div>
                            <div class="grass-blade"></div>
                        </div>
                    </div>
                    
                    <div class="character-sprite" id="character">
                        <div class="character-head">
                            <div class="character-eye left"></div>
                            <div class="character-eye right"></div>
                            <div class="character-mouth"></div>
                        </div>
                        <div class="character-body">
                            <div class="character-arm left"></div>
                            <div class="character-arm right"></div>
                            <div class="character-leg left"></div>
                            <div class="character-leg right"></div>
                        </div>
                    </div>

                    <div class="boat-sprite" id="boat">
                        <div class="boat-body">
                            <div class="boat-mast"></div>
                            <div class="boat-sail"></div>
                        </div>
                    </div>

                    <div class="guide-sprite" id="guide">
                        <div class="guide-body">
                            <div class="guide-crown"></div>
                            <div class="guide-wing left"></div>
                            <div class="guide-wing right"></div>
                        </div>
                    </div>

                    <div class="guide-bubble" id="guide-bubble">
                        遇到困难可以呼叫我哦！
                    </div>

                    <div class="dialogue-box" id="dialogue">
                        <p class="dialogue-text" id="dialogue-text">小勇士来到了一条大河前，怎么过河呢？快选一个魔法汉字吧！</p>
                    </div>
                </div>

                <div class="word-choice-area">
                    <div class="word-card" onclick="selectWord('木', 'mù', this)">
                        <span class="word-icon">🌲</span>
                        <span class="word-character">木</span>
                        <span class="word-pinyin">mù</span>
                    </div>
                    <div class="word-card" onclick="selectWord('船', 'chuán', this)">
                        <span class="word-icon">🚢</span>
                        <span class="word-character">船</span>
                        <span class="word-pinyin">chuán</span>
                    </div>
                    <div class="word-card" onclick="selectWord('沉', 'chén', this)">
                        <span class="word-icon">💧</span>
                        <span class="word-character">沉</span>
                        <span class="word-pinyin">chén</span>
                    </div>
                </div>
            </div>

            <div class="game-screen" id="result-screen">
                <div class="result-content">
                    <div class="result-icon">
                        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    </div>
                    <h2 class="result-title">太棒了！</h2>
                    <div class="result-score">100</div>
                    <p class="result-label">本次冒险得分</p>
                    <div class="result-stars">
                        <svg class="star active" viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26 12,2"/></svg>
                        <svg class="star active" viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26 12,2"/></svg>
                        <svg class="star active" viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26 12,2"/></svg>
                    </div>
                    <button class="action-button" onclick="restartGame()">继续冒险</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedWord = null;
        let isProcessing = false;
        let starCount = 0;
        let guideTimeout = null;

        function startGame() {
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            
            setTimeout(() => {
                showGuide();
            }, 5000);
        }

        function restartGame() {
            document.getElementById('result-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            
            const cards = document.querySelectorAll('.word-card');
            cards.forEach(card => {
                card.classList.remove('selected', 'correct', 'incorrect');
            });
            
            document.getElementById('boat').classList.remove('appear');
            document.getElementById('character').classList.remove('move-right', 'jump');
            document.getElementById('dialogue-text').textContent = '小勇士来到了一条大河前，怎么过河呢？快选一个魔法汉字吧！';
            
            starCount = 0;
            updateStars();
            updateProgress(0);
            
            setTimeout(() => {
                showGuide();
            }, 5000);
        }

        function selectWord(word, pinyin, card) {
            if (isProcessing) return;
            
            isProcessing = true;
            selectedWord = word;
            
            const cards = document.querySelectorAll('.word-card');
            cards.forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            
            createMagicEffect(card);
            
            setTimeout(() => {
                if (word === '船') {
                    handleCorrectAnswer(card);
                } else {
                    handleIncorrectAnswer(card);
                }
            }, 600);
        }

        function handleCorrectAnswer(card) {
            card.classList.remove('selected');
            card.classList.add('correct');
            
            starCount++;
            updateStars();
            
            document.getElementById('dialogue-text').textContent = '太棒了！"船"字的魔法召唤出了一艘小船！';
            
            setTimeout(() => {
                document.getElementById('boat').classList.add('appear');
                
                setTimeout(() => {
                    document.getElementById('character').classList.add('move-right');
                    
                    setTimeout(() => {
                        document.getElementById('character').classList.add('jump');
                        
                        setTimeout(() => {
                            document.getElementById('dialogue-text').textContent = '小勇士成功过河啦！继续前进吧！';
                            
                            setTimeout(() => {
                                updateProgress(100);
                                
                                setTimeout(() => {
                                    document.getElementById('game-screen').classList.remove('active');
                                    document.getElementById('result-screen').classList.add('active');
                                    isProcessing = false;
                                }, 1000);
                            }, 1500);
                        }, 600);
                    }, 1000);
                }, 1000);
            }, 500);
        }

        function handleIncorrectAnswer(card) {
            card.classList.remove('selected');
            card.classList.add('incorrect');
            
            const dialogue = document.getElementById('dialogue-text');
            
            if (selectedWord === '木') {
                dialogue.textContent = '哎呀，一块木头掉进水里漂走了！再想想别的办法吧？';
            } else if (selectedWord === '沉') {
                dialogue.textContent = '哎呀，一块大石头掉进水里沉下去了，水花溅了主角一身！我们再想想别的办法？';
            }
            
            setTimeout(() => {
                card.classList.remove('incorrect');
                isProcessing = false;
            }, 1500);
        }

        function createMagicEffect(element) {
            const rect = element.getBoundingClientRect();
            const container = document.querySelector('.game-container');
            const containerRect = container.getBoundingClientRect();
            
            const centerX = rect.left - containerRect.left + rect.width / 2;
            const centerY = rect.top - containerRect.top + rect.height / 2;
            
            const glow = document.createElement('div');
            glow.className = 'word-glow';
            glow.style.left = (centerX - 60) + 'px';
            glow.style.top = (centerY - 60) + 'px';
            container.appendChild(glow);
            
            setTimeout(() => glow.remove(), 600);
            
            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.className = 'magic-particle';
                
                const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#A29BFE'];
                particle.style.backgroundColor = colors[i % colors.length];
                
                const angle = (i / 12) * Math.PI * 2;
                const distance = 50 + Math.random() * 30;
                
                particle.style.left = (centerX - 4) + 'px';
                particle.style.top = (centerY - 4) + 'px';
                
                particle.style.animation = `floatUp 0.8s ease-out forwards`;
                
                container.appendChild(particle);
                
                setTimeout(() => particle.remove(), 800);
            }
        }

        function updateStars() {
            const stars = document.querySelectorAll('.star-collection .star');
            stars.forEach((star, index) => {
                if (index < starCount) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        function updateProgress(percent) {
            document.getElementById('progress-fill').style.width = percent + '%';
        }

        function toggleMicrophone() {
            const hint = document.querySelector('.interaction-hint');
            hint.style.animation = 'none';
            hint.offsetHeight;
            hint.style.animation = 'pulse 2s ease-in-out infinite';
            
            const dialogue = document.getElementById('dialogue-text');
            dialogue.textContent = '正在听你说话...大声读出汉字吧！';
            
            setTimeout(() => {
                dialogue.textContent = '小勇士来到了一条大河前，怎么过河呢？快选一个魔法汉字吧！';
            }, 2000);
        }

        function showGuide() {
            const guide = document.getElementById('guide');
            const bubble = document.getElementById('guide-bubble');
            
            guide.classList.add('appear');
            bubble.classList.add('appear');
            
            guideTimeout = setTimeout(() => {
                guide.classList.remove('appear');
                bubble.classList.remove('appear');
            }, 5000);
        }

        document.addEventListener('keydown', (e) => {
            const cards = document.querySelectorAll('.word-card');
            if (e.key === '1' && cards[0]) cards[0].click();
            if (e.key === '2' && cards[1]) cards[1].click();
            if (e.key === '3' && cards[2]) cards[2].click();
        });
    </script>
</body>
</html>
