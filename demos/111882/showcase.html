<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>比价侦探 · Demo</title>
<style>
:root{--bg:#0a0a0a;--surface:#171717;--surface2:#262626;--border:#2e2e2e;--text:#fafafa;--muted:#a3a3a3;--accent:#10b981;--aglow:rgba(16,185,129,0.12);--danger:#ef4444;--warn:#f59e0b;--rad:14px;--rad-s:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,20px)}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:8px}
header h1 .ico{font-size:1.3rem}
.subtitle{font-size:11px;color:var(--muted);text-align:center;padding:8px 16px 0}
/* ====== Form ====== */
.form-wrap{padding:12px 16px}
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);padding:14px}
.form-card h3{font-size:13px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-row-3{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:11px;color:var(--muted)}
.form-group input,.form-group select{height:40px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:0 10px;font-size:14px;outline:none;transition:border-color .15s}
.form-group input:focus,.form-group select:focus{border-color:var(--accent)}
.form-group input::placeholder{color:#737373}
/* ====== Buttons ====== */
.btn{height:40px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.btn-primary{background:var(--accent);color:#000;width:100%}
.btn-primary:hover{filter:brightness(1.1)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-outline:hover{border-color:var(--muted);color:var(--text)}
.btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);font-size:11px;height:28px;padding:0 10px}
.btn-sm{font-size:11px;height:32px;padding:0 10px}
/* ====== Products List ====== */
.products-wrap{padding:0 16px}
.product-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);padding:14px;margin-bottom:10px;position:relative;transition:border-color .2s}
.product-card.best{border-color:var(--accent);background:var(--aglow)}
.product-card.group-header{background:var(--surface2);border-style:dashed;text-align:center;font-size:12px;color:var(--muted);padding:8px;margin-bottom:6px;border-radius:var(--rad-s)}
.product-row{display:flex;justify-content:space-between;align-items:center}
.product-name{font-size:14px;font-weight:600;max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.product-name .rank{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--surface2);text-align:center;line-height:22px;font-size:11px;margin-right:6px;color:var(--muted)}
.best .rank{background:var(--accent);color:#000}
.product-unit-price{font-size:1.1rem;font-weight:700;color:var(--muted)}
.best .product-unit-price{color:var(--accent)}
.product-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.product-meta span{font-size:11px;color:var(--muted);background:var(--surface2);padding:2px 8px;border-radius:999px}
.product-meta .promo-tag{background:rgba(245,158,11,0.12);color:var(--warn)}
.best-badge{position:absolute;top:-1px;right:-1px;background:var(--accent);color:#000;font-size:10px;font-weight:700;padding:4px 10px 4px 12px;border-radius:0 var(--rad-s) 0 var(--rad-s)}
.savings{font-size:11px;color:var(--accent);margin-top:4px}
.fair-qty{font-size:11px;color:var(--muted);margin-top:4px;font-style:italic}
.empty{margin:30px 0;text-align:center;color:var(--muted);font-size:14px}
.empty .emoji{font-size:2.5rem;display:block;margin-bottom:12px}
/* ====== Quick Demo ====== */
.quick-demo{padding:0 16px;margin-bottom:8px}
.quick-demo button{font-size:11px;height:28px}
/* ====== Presets ====== */
.preset-row{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.preset-btn{font-size:11px;padding:4px 12px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.preset-btn:hover{border-color:var(--accent);color:var(--accent)}
/* ====== Footer ====== */
footer{text-align:center;padding:24px 16px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);margin-top:16px}
</style>
</head>
<body>

<header>
  <h1><span class="ico">🕵️</span>比价侦探</h1>
  <span style="font-size:11px;color:var(--muted)">纯前端 Demo</span>
</header>
<p class="subtitle">输入商品，自动换算统一单价，一眼识别最划算</p>

<!-- ====== Product Form ====== -->
<div class="form-wrap">
  <div class="form-card" id="formCard">
    <h3>📦 添加商品</h3>
    <div class="form-row-3 form-row">
      <div class="form-group" style="grid-column:span 2">
        <label>商品名称</label>
        <input id="fName" placeholder="如：金龙鱼调和油" autocomplete="off" enterkeyhint="next">
      </div>
      <div class="form-group">
        <label>售价 ¥</label>
        <input id="fPrice" type="number" inputmode="decimal" step="0.01" placeholder="69.9" enterkeyhint="next">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>规格数值</label>
        <input id="fSpecV" type="number" inputmode="decimal" step="0.01" placeholder="5" enterkeyhint="next">
      </div>
      <div class="form-group">
        <label>单位</label>
        <select id="fSpecU">
          <optgroup label="重量"><option value="g">克 (g)</option><option value="kg">千克</option><option value="斤">斤</option><option value="两">两</option><option value="lb">磅</option><option value="oz">盎司</option></optgroup>
          <optgroup label="容量"><option value="ml" selected>毫升</option><option value="l">升</option></optgroup>
          <optgroup label="件数"><option value="个">个</option><option value="包">包</option><option value="瓶">瓶</option><option value="盒">盒</option><option value="片">片</option><option value="打">打 (12个)</option></optgroup>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>包装件数</label>
        <input id="fPack" type="number" inputmode="numeric" min="1" value="1">
      </div>
      <div class="form-group">
        <label>促销</label>
        <select id="fPromo">
          <option value="none">无促销</option>
          <option value="buy2get1">买二送一</option>
          <option value="secondHalf">第二件半价</option>
          <option value="discount">打折</option>
          <option value="fullReduction">满减</option>
        </select>
      </div>
    </div>
    <div class="form-row" id="promoExtra" style="display:none">
      <div class="form-group" id="discountGroup" style="display:none">
        <label>折扣（0~1）</label>
        <input id="fDiscountV" type="number" inputmode="decimal" step="0.01" min="0" max="1" value="0.8" placeholder="0.8 = 8折">
      </div>
      <div class="form-group" id="fullRedGroup" style="display:none">
        <label>满 / 减</label>
        <div style="display:flex;gap:6px">
          <input id="fThreshold" type="number" inputmode="numeric" value="50" placeholder="满" style="flex:1">
          <input id="fReduction" type="number" inputmode="numeric" value="10" placeholder="减" style="flex:1">
        </div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="addProduct()" style="margin-top:6px">加入比价</button>
    <div class="preset-row">
      <span style="font-size:10px;color:var(--muted)">快速示例：</span>
      <button class="preset-btn" onclick="quickAdd('金龙鱼调和油',5,'l',69.9,1,'none')">5L油 ¥69.9</button>
      <button class="preset-btn" onclick="quickAdd('金龙鱼调和油',1.8,'l',22.9,1,'none')">1.8L油 ¥22.9</button>
      <button class="preset-btn" onclick="quickAdd('金龙鱼调和油',900,'ml',12.5,1,'none')">900ml油 ¥12.5</button>
      <button class="preset-btn" onclick="quickAdd('洗衣液',2,'kg',29.9,1,'buy2get1')">洗衣液 买二送一</button>
      <button class="preset-btn" onclick="quickAdd('洗衣液',1.5,'kg',24.9,1,'none')">洗衣液 无促销</button>
    </div>
  </div>
</div>

<!-- ====== Results ====== -->
<div class="quick-demo">
  <button class="btn btn-outline btn-sm" onclick="loadPreset()">📋 加载预置对比示例</button>
  <button class="btn btn-outline btn-sm" onclick="clearAll()">🗑️ 清空列表</button>
</div>

<div class="products-wrap" id="results"></div>

<footer>
  比价侦探 · 极速比价 Demo · 所有逻辑在浏览器本地运行<br>
  拍照识别完整版：price-detective.pages.dev
</footer>

<script>
// ============================================================
//  核心换算引擎 (ported from unitData.ts + unitConverter.ts)
// ============================================================

const UNIT_TABLE = {
  weight: {
    base: 'g', displayStandard: 100,
    aliases: {
      'g':1,'克':1,'gram':1,
      'kg':1000,'千克':1000,'公斤':1000,
      '斤':500,'市斤':500,'两':50,
      'mg':0.001,'毫克':0.001,
      'lb':453.592,'磅':453.592,
      'oz':28.35,'盎司':28.35
    }
  },
  volume: {
    base: 'ml', displayStandard: 100,
    aliases: { 'ml':1,'毫升':1,'l':1000,'升':1000,'fl oz':29.57 }
  },
  count: {
    base: '个', displayStandard: 1,
    aliases: {
      '个':1,'只':1,'颗':1,'片':1,'条':1,'包':1,'袋':1,'盒':1,'瓶':1,'罐':1,'支':1,'块':1,
      '打':12,'箱':1,'套':1,'份':1
    }
  }
};

function resolveUnit(unitStr) {
  if (!unitStr) return null;
  const n = unitStr.trim().toLowerCase();
  for (const [cat, table] of Object.entries(UNIT_TABLE)) {
    for (const [alias, factor] of Object.entries(table.aliases)) {
      if (alias.toLowerCase() === n) return { category: cat, factor };
    }
  }
  return null;
}

// ============================================================
//  促销计算器 (ported from promotionCalculator.ts)
// ============================================================

function applySinglePromotion(unitPrice, promo) {
  if (!isFinite(unitPrice) || unitPrice < 0) return unitPrice;
  if (!promo || promo.type === 'none') return unitPrice;
  switch (promo.type) {
    case 'buy2get1': return unitPrice * 2 / 3;
    case 'secondHalf': return unitPrice * 0.75;
    case 'discount': {
      const v = Number(promo.value);
      if (!isFinite(v) || v <= 0 || v > 1) return unitPrice;
      return unitPrice * v;
    }
    case 'fullReduction': {
      const th = Number(promo.threshold);
      const re = Number(promo.reduction);
      if (!isFinite(th) || th <= 0 || !isFinite(re) || re <= 0 || re >= th) return unitPrice;
      const qty = Math.max(1, Math.ceil(th / unitPrice));
      const total = qty * unitPrice;
      return Math.max(0, total - re) / qty;
    }
    default: return unitPrice;
  }
}

function describePromo(promo) {
  if (!promo || promo.type === 'none') return '';
  switch (promo.type) {
    case 'buy2get1': return '买二送一';
    case 'secondHalf': return '第二件半价';
    case 'discount': return Math.round(Number(promo.value || 0.8) * 10) + '折';
    case 'fullReduction': return '满' + (promo.threshold||0) + '减' + (promo.reduction||0);
    default: return '';
  }
}

// ============================================================
//  换算对比引擎
// ============================================================

function computeProduct(p) {
  const resolved = resolveUnit(p.specUnit);
  if (!resolved) return null;
  const table = UNIT_TABLE[resolved.category];
  const sv = Number(p.specValue), pc = Number(p.packCount), pr = Number(p.price);
  if (!isFinite(sv) || sv <= 0 || !isFinite(pc) || pc <= 0 || !isFinite(pr) || pr < 0) return null;

  const baseValue = sv * resolved.factor * pc;
  if (baseValue <= 0) return null;

  const promo = p.promotion || { primary: { type: 'none' }, secondary: { type: 'none' } };
  const afterP = applySinglePromotion(pr, promo.primary);
  const effectivePrice = applySinglePromotion(afterP, promo.secondary);
  const unitPrice = (effectivePrice / baseValue) * table.displayStandard;

  return {
    ...p,
    category: resolved.category,
    baseValue,
    displayUnit: table.displayStandard + table.base,
    unitPrice,
    effectivePrice
  };
}

function rankProducts(products) {
  const compared = products.map(computeProduct).filter(Boolean);
  const groups = {};
  for (const p of compared) {
    if (!groups[p.category]) groups[p.category] = [];
    groups[p.category].push(p);
  }
  const result = [];
  const catLabels = { weight: '按重量对比', volume: '按容量对比', count: '按件数对比' };
  for (const [cat, group] of Object.entries(groups)) {
    if (group.length === 0) continue;
    group.sort((a, b) => a.unitPrice - b.unitPrice);
    const maxPrice = group[group.length - 1].unitPrice;
    const maxBase = Math.max(...group.map(p => p.baseValue));

    group.forEach((p, i) => {
      p.rank = i + 1;
      p.isBest = i === 0 && group.length > 1;
      p.savings = maxPrice > 0 ? ((maxPrice - p.unitPrice) / maxPrice) : 0;
      p.categoryLabel = catLabels[cat] || cat;

      const fairQty = Math.max(1, Math.ceil(maxBase / p.baseValue));
      p.fairQuantity = fairQty;
      p.fairTotalPrice = fairQty * p.effectivePrice;
      p.fairLabel = fairQty > 1 ? '买 ' + fairQty + ' 件 ≈ ¥' + p.fairTotalPrice.toFixed(2) : '';
      result.push(p);
    });
  }
  return result;
}

// ============================================================
//  State
// ============================================================
let products = [];

function addProduct() {
  const name = document.getElementById('fName').value.trim();
  const price = parseFloat(document.getElementById('fPrice').value);
  const specV = parseFloat(document.getElementById('fSpecV').value);
  const specU = document.getElementById('fSpecU').value;
  const pack = parseInt(document.getElementById('fPack').value) || 1;
  const promoType = document.getElementById('fPromo').value;

  if (!name) return alert('请输入商品名称');
  if (!isFinite(price) || price < 0) return alert('请输入有效价格');
  if (!isFinite(specV) || specV <= 0) return alert('请输入有效规格');
  if (!resolveUnit(specU)) return alert('未知单位');

  const promotion = buildPromotion();
  products.push({ id: Date.now(), name, specValue: specV, specUnit: specU, packCount: pack, price, promotion });
  clearForm();
  render();
}

function quickAdd(name, sv, su, price, pack, promoType) {
  products.push({
    id: Date.now(), name, specValue: sv, specUnit: su,
    packCount: pack || 1, price,
    promotion: makeSinglePromo(promoType)
  });
  render();
}

function makeSinglePromo(type) {
  if (type === 'none' || !type) return { primary: { type: 'none' }, secondary: { type: 'none' } };
  const primary = { type };
  if (type === 'discount') primary.value = 0.8;
  if (type === 'fullReduction') { primary.threshold = 50; primary.reduction = 10; }
  return { primary, secondary: { type: 'none' } };
}

function buildPromotion() {
  const type = document.getElementById('fPromo').value;
  const primary = { type };
  if (type === 'discount') primary.value = parseFloat(document.getElementById('fDiscountV').value) || 0.8;
  if (type === 'fullReduction') {
    primary.threshold = parseFloat(document.getElementById('fThreshold').value) || 50;
    primary.reduction = parseFloat(document.getElementById('fReduction').value) || 10;
  }
  return { primary, secondary: { type: 'none' } };
}

function removeProduct(id) {
  products = products.filter(p => p.id !== id);
  render();
}

function clearAll() {
  products = [];
  render();
}

function clearForm() {
  document.getElementById('fName').value = '';
  document.getElementById('fPrice').value = '';
  document.getElementById('fSpecV').value = '';
  document.getElementById('fPack').value = '1';
  document.getElementById('fPromo').value = 'none';
  document.getElementById('fDiscountV').value = '0.8';
  document.getElementById('fThreshold').value = '50';
  document.getElementById('fReduction').value = '10';
  updatePromoFields();
}

function loadPreset() {
  products = [
    { id: 1, name: '金龙鱼调和油', specValue: 5, specUnit: 'l', packCount: 1, price: 69.9, promotion: makeSinglePromo('none') },
    { id: 2, name: '金龙鱼调和油', specValue: 1.8, specUnit: 'l', packCount: 1, price: 22.9, promotion: makeSinglePromo('none') },
    { id: 3, name: '金龙鱼调和油', specValue: 900, specUnit: 'ml', packCount: 1, price: 12.5, promotion: makeSinglePromo('none') },
  ];
  render();
}

// ============================================================
//  Render
// ============================================================

function fmt(n) { return Number(n).toFixed(2); }

function render() {
  const el = document.getElementById('results');
  if (products.length === 0) {
    el.innerHTML = '<div class="empty"><span class="emoji">📊</span>还没有商品<br><span style="font-size:12px">点「加载预置对比示例」试试，或自己添加商品</span></div>';
    return;
  }

  const ranked = rankProducts(products);
  let html = '';
  let lastCat = '';

  ranked.forEach((p, i) => {
    // Category header
    if (p.categoryLabel !== lastCat) {
      html += '<div class="product-card group-header">' + p.categoryLabel + '（单位：' + p.displayUnit + '）</div>';
      lastCat = p.categoryLabel;
    }

    const promoDesc = describePromo(p.promotion?.primary) || (describePromo(p.promotion?.secondary) || '');
    const cls = p.isBest ? 'product-card best' : 'product-card';

    html += '<div class="' + cls + '">';
    if (p.isBest) html += '<div class="best-badge">最划算</div>';
    html += '<div class="product-row">';
    html += '<span class="product-name"><span class="rank">' + p.rank + '</span>' + esc(p.name) + '</span>';
    html += '<span class="product-unit-price">¥' + fmt(p.unitPrice) + '</span>';
    html += '</div>';
    html += '<div class="product-meta">';
    html += '<span>' + p.specValue + p.specUnit + (p.packCount > 1 ? '×' + p.packCount : '') + '</span>';
    html += '<span>售价 ¥' + fmt(p.price) + '</span>';
    if (p.effectivePrice !== p.price) html += '<span>折后 ¥' + fmt(p.effectivePrice) + '</span>';
    if (promoDesc) html += '<span class="promo-tag">' + promoDesc + '</span>';
    if (p.isBest && p.savings > 0) html += '<span style="color:var(--accent)">省 ' + Math.round(p.savings * 100) + '%</span>';
    html += '</div>';
    if (p.fairLabel) html += '<div class="fair-qty">' + p.fairLabel + '（与最大规格公平对比）</div>';
    html += '<div style="margin-top:8px;text-align:right">';
    html += '<button class="btn btn-danger" onclick="removeProduct(' + p.id + ')">✕ 移除</button>';
    html += '</div>';
    html += '</div>';
  });

  el.innerHTML = html;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ============================================================
//  Promo field toggle
// ============================================================
document.getElementById('fPromo').addEventListener('change', updatePromoFields);

function updatePromoFields() {
  const type = document.getElementById('fPromo').value;
  document.getElementById('promoExtra').style.display = type === 'none' ? 'none' : 'grid';
  document.getElementById('discountGroup').style.display = type === 'discount' ? 'flex' : 'none';
  document.getElementById('fullRedGroup').style.display = type === 'fullReduction' ? 'flex' : 'none';
}

// ============================================================
//  Init
// ============================================================
loadPreset();
</script>

</body>
</html>
