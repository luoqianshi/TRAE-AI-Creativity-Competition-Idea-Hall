<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI代码错题复盘助手</title>
<style>
:root {
    --primary: #1E88E5;
    --primary-light: #42A5F5;
    --primary-dark: #1565C0;
    --bg: #FFFFFF;
    --bg-secondary: #F5F9FF;
    --card: #FFFFFF;
    --text: #1A237E;
    --text-secondary: #5C6BC0;
    --border: #E3F2FD;
    --shadow: 0 2px 8px rgba(30, 136, 229, 0.1);
    --shadow-hover: 0 4px 16px rgba(30, 136, 229, 0.15);
    --success: #43A047;
    --warning: #FB8C00;
    --error: #E53935;
    --code-bg: #F8FAFC;
    --code-text: #374151;
}

[data-theme="dark"] {
    --primary: #64B5F6;
    --primary-light: #90CAF9;
    --primary-dark: #42A5F5;
    --bg: #0D1117;
    --bg-secondary: #161B22;
    --card: #1C2128;
    --text: #E6EDF3;
    --text-secondary: #8B949E;
    --border: #30363D;
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.4);
    --success: #89D185;
    --warning: #D29922;
    --error: #F85149;
    --code-bg: #0D1117;
    --code-text: #E6EDF3;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
}

header {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
    color: white;
    padding: 20px 40px;
    box-shadow: var(--shadow);
}

header h1 {
    font-size: 24px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 12px;
}

header .theme-toggle {
    margin-left: auto;
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.3s;
}

header .theme-toggle:hover {
    background: rgba(255,255,255,0.3);
}

.container {
    max-width: 1200px;
    margin: 24px auto;
    padding: 0 20px;
}

.tabs {
    display: flex;
    gap: 4px;
    background: var(--bg-secondary);
    padding: 4px;
    border-radius: 12px;
    margin-bottom: 24px;
}

.tab {
    flex: 1;
    padding: 14px 20px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 15px;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.tab.active {
    background: var(--primary);
    color: white;
    box-shadow: var(--shadow);
}

.tab:hover:not(.active) {
    background: rgba(30, 136, 229, 0.05);
}

.tab-panel {
    display: none;
}

.tab-panel.active {
    display: block;
}

.card {
    background: var(--card);
    border-radius: 12px;
    padding: 24px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    border: 1px solid var(--border);
}

.card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
}

.card-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
}

.form-row {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
}

.form-row .form-group {
    flex: 1;
    margin-bottom: 0;
}

select {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.3s;
}

select:focus {
    outline: none;
    border-color: var(--primary);
}

textarea {
    width: 100%;
    min-height: 200px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--code-bg);
    color: var(--code-text);
    font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
    font-size: 14px;
    line-height: 1.6;
    resize: vertical;
    transition: border-color 0.3s;
}

textarea:focus {
    outline: none;
    border-color: var(--primary);
}

.btn {
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.btn-primary {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white;
    box-shadow: var(--shadow);
}

.btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-hover);
}

.btn-secondary {
    background: var(--bg-secondary);
    color: var(--text);
    border: 1px solid var(--border);
}

.btn-secondary:hover {
    background: rgba(30, 136, 229, 0.05);
    border-color: var(--primary);
}

.btn-danger {
    background: var(--error);
    color: white;
}

.btn-danger:hover {
    background: #C62828;
}

.btn-sm {
    padding: 6px 12px;
    font-size: 13px;
}

.analysis-result {
    margin-top: 20px;
}

.error-card {
    background: rgba(229, 57, 53, 0.05);
    border: 1px solid rgba(229, 57, 53, 0.2);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
}

.error-card .error-type {
    color: var(--error);
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 8px;
}

.error-card .error-message {
    color: var(--text);
    font-size: 14px;
    margin-bottom: 8px;
    line-height: 1.6;
}

.error-card .error-line {
    font-size: 13px;
    color: var(--text-secondary);
    font-family: monospace;
    background: var(--bg);
    padding: 8px;
    border-radius: 4px;
}

.suggestion-card {
    background: rgba(67, 160, 71, 0.05);
    border: 1px solid rgba(67, 160, 71, 0.2);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
}

.suggestion-card .suggestion-title {
    color: var(--success);
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 8px;
}

.suggestion-card .suggestion-text {
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
}

.code-preview {
    background: var(--code-bg);
    border-radius: 8px;
    padding: 16px;
    overflow-x: auto;
    margin-top: 16px;
}

.code-preview pre {
    margin: 0;
    font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    color: var(--code-text);
}

.code-preview code {
    white-space: pre-wrap;
    word-break: break-word;
}

.token-keyword { color: #900; font-weight: bold; }
.token-string { color: #1A1AA6; }
.token-number { color: #099; }
.token-comment { color: #999; font-style: italic; }
.token-function { color: #006699; }
.token-variable { color: #000; }
.token-operator { color: #333; }
.token-error { background: #FFEBEE; color: #C62828; padding: 0 4px; border-radius: 2px; }

.archive-list {
    display: grid;
    gap: 16px;
}

.archive-item {
    background: var(--bg-secondary);
    border-radius: 8px;
    padding: 16px;
    border: 1px solid var(--border);
    transition: all 0.3s;
}

.archive-item:hover {
    box-shadow: var(--shadow);
    border-color: var(--primary);
}

.archive-item-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.archive-item-lang {
    display: inline-block;
    padding: 4px 10px;
    background: var(--primary);
    color: white;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
}

.archive-item-date {
    font-size: 12px;
    color: var(--text-secondary);
}

.archive-item-error {
    color: var(--error);
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 8px;
}

.archive-item-code {
    font-family: monospace;
    font-size: 13px;
    color: var(--code-text);
    background: var(--code-bg);
    padding: 12px;
    border-radius: 4px;
    overflow-x: auto;
    max-height: 100px;
    overflow-y: auto;
    white-space: pre-wrap;
}

.archive-item-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-secondary);
}

.empty-state .icon {
    font-size: 48px;
    margin-bottom: 16px;
}

.empty-state p {
    font-size: 15px;
}

.exercise-list {
    display: grid;
    gap: 16px;
}

.exercise-item {
    background: var(--bg-secondary);
    border-radius: 8px;
    padding: 20px;
    border: 1px solid var(--border);
}

.exercise-item h4 {
    color: var(--primary-dark);
    margin-bottom: 12px;
    font-size: 15px;
}

.exercise-item .exercise-desc {
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 12px;
    line-height: 1.6;
}

.exercise-item .exercise-code {
    font-family: monospace;
    font-size: 13px;
    color: var(--code-text);
    background: var(--code-bg);
    padding: 12px;
    border-radius: 4px;
    overflow-x: auto;
}

.exercise-item .exercise-hint {
    margin-top: 12px;
    padding: 12px;
    background: rgba(251, 140, 0, 0.05);
    border-left: 4px solid var(--warning);
    color: var(--text-secondary);
    font-size: 13px;
}

.toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 16px 24px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    color: white;
    z-index: 1000;
    animation: slideIn 0.3s ease-out;
}

.toast-success { background: var(--success); }
.toast-error { background: var(--error); }
.toast-info { background: var(--primary); }

@keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

.loading {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: white;
    animation: spin 0.6s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@media (max-width: 768px) {
    header {
        padding: 16px 20px;
    }
    
    header h1 {
        font-size: 18px;
    }
    
    .tabs {
        flex-wrap: wrap;
    }
    
    .tab {
        flex: none;
        padding: 10px 14px;
        font-size: 13px;
    }
    
    .card {
        padding: 16px;
    }
    
    .form-row {
        flex-direction: column;
    }
}
</style>
</head>
<body>
<header>
    <h1><span>🛠️</span> AI代码错题复盘助手</h1>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙 暗色模式</button>
</header>

<div class="container">
    <div class="tabs">
        <button class="tab active" onclick="switchTab('input')"><span>📝</span> 代码输入</button>
        <button class="tab" onclick="switchTab('analysis')"><span>🔍</span> AI解析</button>
        <button class="tab" onclick="switchTab('archive')"><span>📚</span> 错题归档</button>
        <button class="tab" onclick="switchTab('exercises')"><span>💡</span> 同类习题</button>
    </div>

    <div id="input-panel" class="tab-panel active">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title"><span>📋</span> 粘贴代码</h2>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="langSelect">编程语言</label>
                    <select id="langSelect">
                        <option value="python">Python</option>
                        <option value="javascript">JavaScript</option>
                        <option value="c">C</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="codeInput">代码内容</label>
                <textarea id="codeInput" placeholder="请粘贴你的代码..."></textarea>
            </div>
            <button class="btn btn-primary" onclick="analyzeCode()" id="analyzeBtn">
                <span>🚀</span> AI智能分析
            </button>
        </div>
    </div>

    <div id="analysis-panel" class="tab-panel">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title"><span>🎯</span> 分析结果</h2>
                <button class="btn btn-secondary btn-sm" onclick="saveToArchive()">
                    <span>💾</span> 保存到错题本
                </button>
            </div>
            <div id="analysisResult"></div>
            <div class="code-preview" id="codePreview" style="display:none;">
                <pre><code id="highlightedCode"></code></pre>
            </div>
        </div>
    </div>

    <div id="archive-panel" class="tab-panel">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title"><span>📖</span> 错题归档</h2>
                <button class="btn btn-secondary btn-sm" onclick="clearArchive()">
                    <span>🗑️</span> 清空所有
                </button>
            </div>
            <div id="archiveList" class="archive-list"></div>
        </div>
    </div>

    <div id="exercises-panel" class="tab-panel">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title"><span>📝</span> 同类习题</h2>
            </div>
            <div class="form-group">
                <label for="exerciseErrorType">选择错误类型生成习题</label>
                <select id="exerciseErrorType" onchange="generateExercises()">
                    <option value="">请选择错误类型</option>
                    <option value="missing_colon">Python 缺少冒号</option>
                    <option value="indentation">Python 缩进错误</option>
                    <option value="undefined_var">变量未定义</option>
                    <option value="missing_semicolon">缺少分号</option>
                    <option value="syntax_error">语法错误</option>
                    <option value="type_error">类型错误</option>
                    <option value="index_error">索引越界</option>
                    <option value="missing_brace">括号不匹配</option>
                    <option value="infinite_loop">无限循环</option>
                </select>
            </div>
            <div id="exerciseList" class="exercise-list"></div>
        </div>
    </div>
</div>

<script>
const exercisesDB = {
    missing_colon: [
        {
            title: "修复if语句缺少冒号",
            desc: "以下Python代码中，if语句缺少冒号，请修复并说明原因。",
            code: `x = 10
if x > 5
    print("大于5")`,
            hint: "Python中，if/else/for/while/def/class等语句后面必须加冒号来表示代码块开始"
        },
        {
            title: "修复for循环缺少冒号",
            desc: "以下Python代码中，for循环缺少冒号，请修复。",
            code: `fruits = ["apple", "banana", "cherry"]
for fruit in fruits
    print(fruit)`,
            hint: "for循环遍历列表时，语句末尾需要冒号"
        }
    ],
    indentation: [
        {
            title: "修复缩进错误",
            desc: "以下Python代码缩进不正确，导致语法错误，请修复。",
            code: `def greet():
print("Hello")
    print("World")`,
            hint: "Python使用缩进来区分代码块，函数体内的语句需要统一缩进"
        },
        {
            title: "修复嵌套缩进",
            desc: "以下代码嵌套缩进不一致，请修复。",
            code: `for i in range(5):
    if i % 2 == 0:
        print(i)
      print("even")`,
            hint: "同一层级的代码需要保持相同的缩进级别"
        }
    ],
    undefined_var: [
        {
            title: "修复未定义变量",
            desc: "以下代码使用了未定义的变量，请修复。",
            code: `console.log(message)
var message = "Hello"`,
            hint: "在JavaScript中，变量使用前必须先声明"
        },
        {
            title: "Python变量未定义",
            desc: "以下Python代码中变量未定义，请修复。",
            code: `print(name)
name = "Alice"`,
            hint: "Python中变量必须先赋值后使用"
        }
    ],
    missing_semicolon: [
        {
            title: "修复C语言缺少分号",
            desc: "以下C代码缺少分号，请找出并修复。",
            code: `#include <stdio.h>
int main() {
    printf("Hello")
    return 0
}`,
            hint: "C语言中每条语句末尾必须加分号"
        },
        {
            title: "JavaScript缺少分号",
            desc: "以下代码缺少分号，请修复。",
            code: `let x = 10
let y = 20
console.log(x + y)`,
            hint: "虽然JavaScript允许省略分号，但建议始终添加以避免歧义"
        }
    ],
    syntax_error: [
        {
            title: "修复字符串引号不匹配",
            desc: "以下代码字符串引号不匹配，请修复。",
            code: `print('Hello")`,
            hint: "字符串的开始和结束引号必须一致"
        },
        {
            title: "修复C语言括号不匹配",
            desc: "以下C代码括号不匹配，请修复。",
            code: `#include <stdio.h>
int main() {
    if (1) {
        printf("OK")
    return 0;
}`,
            hint: "每个左括号必须有对应的右括号"
        }
    ],
    type_error: [
        {
            title: "修复类型错误",
            desc: "以下代码尝试将字符串与数字相加，请修复。",
            code: `x = "5"
y = 3
print(x + y)`,
            hint: "Python中字符串和数字不能直接相加，需要类型转换"
        },
        {
            title: "JavaScript类型错误",
            desc: "以下代码存在类型错误，请修复。",
            code: `let num = "10"
let result = num * 2 + "5"`,
            hint: "注意JavaScript中的隐式类型转换"
        }
    ],
    index_error: [
        {
            title: "修复索引越界",
            desc: "以下代码访问列表时索引越界，请修复。",
            code: `nums = [1, 2, 3]
print(nums[3])`,
            hint: "列表索引从0开始，长度为3的列表最大索引是2"
        },
        {
            title: "数组越界访问",
            desc: "以下JavaScript代码数组访问越界，请修复。",
            code: `let arr = [10, 20, 30]
console.log(arr[3])`,
            hint: "数组长度为3，有效索引为0、1、2"
        }
    ],
    missing_brace: [
        {
            title: "修复括号不匹配",
            desc: "以下代码大括号不匹配，请修复。",
            code: `function test() {
    if (true) {
        console.log("test")
}`,
            hint: "每个左大括号必须有对应的右大括号"
        },
        {
            title: "修复圆括号不匹配",
            desc: "以下代码圆括号不匹配，请修复。",
            code: `result = (a + b * c`,
            hint: "每个左圆括号必须有对应的右圆括号"
        }
    ],
    infinite_loop: [
        {
            title: "修复无限循环",
            desc: "以下代码存在无限循环，请修复。",
            code: `i = 0
while i < 5:
    print(i)`,
            hint: "while循环内需要更新循环变量，否则条件永远为真"
        },
        {
            title: "for循环无限循环",
            desc: "以下JavaScript代码存在无限循环，请修复。",
            code: `for (let i = 0; i < 5;) {
    console.log(i)
}`,
            hint: "for循环缺少递增语句，循环变量不会变化"
        }
    ]
};

const keywords = {
    python: ["def", "class", "if", "elif", "else", "for", "while", "return", "import", "from", "as", "try", "except", "finally", "raise", "with", "lambda", "pass", "break", "continue", "yield", "True", "False", "None", "and", "or", "not", "in", "is"],
    javascript: ["function", "const", "let", "var", "if", "else", "for", "while", "return", "import", "export", "class", "extends", "new", "this", "try", "catch", "finally", "throw", "async", "await", "true", "false", "null", "undefined", "typeof", "instanceof", "in", "of"],
    c: ["int", "float", "double", "char", "void", "if", "else", "for", "while", "return", "include", "define", "struct", "typedef", "switch", "case", "break", "continue", "do", "sizeof", "static", "extern", "const", "volatile"]
};

let currentAnalysis = null;

function toggleTheme() {
    const theme = document.body.getAttribute("data-theme");
    if (theme === "dark") {
        document.body.removeAttribute("data-theme");
        document.getElementById("themeToggle").textContent = "🌙 暗色模式";
    } else {
        document.body.setAttribute("data-theme", "dark");
        document.getElementById("themeToggle").textContent = "☀️ 亮色模式";
    }
}

function switchTab(tab, btnElement) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    
    if (btnElement) {
        btnElement.classList.add('active');
    } else {
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(t => {
            if (t.getAttribute('onclick').includes("'" + tab + "'")) {
                t.classList.add('active');
            }
        });
    }
    
    document.getElementById(tab + '-panel').classList.add('active');
    
    if (tab === 'archive') {
        loadArchive();
    }
}

function highlightCode(code, lang) {
    let html = code
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

    const strings = [];
    html = html.replace(/("([^"\\]|\\.)*"|'([^'\\]|\\.)*'|`([^`\\]|\\.)*`)/g, (match) => {
        strings.push(match);
        return '___STRING_' + (strings.length - 1) + '___';
    });

    html = html.replace(/(\/\/.*$|#.*$)/gm, '<span class="token-comment">$1</span>');
    
    html = html.replace(/\b(\d+\.?\d*)\b/g, '<span class="token-number">$1</span>');
    
    const langKeywords = keywords[lang] || [];
    if (langKeywords.length > 0) {
        const keywordRegex = new RegExp('\\b(' + langKeywords.join('|') + ')\\b', 'g');
        html = html.replace(keywordRegex, '<span class="token-keyword">$1</span>');
    }
    
    html = html.replace(/\b([a-zA-Z_][a-zA-Z0-9_]*)\s*\(/g, '<span class="token-function">$1</span>(');
    
    html = html.replace(/___STRING_(\d+)___/g, (match, index) => {
        return '<span class="token-string">' + strings[index] + '</span>';
    });
    
    return html;
}

function analyzeError(code, lang) {
    const errors = [];
    const lines = code.split('\n');
    
    for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const trimmed = line.trim();
        
        if (lang === 'python') {
            if ((trimmed.startsWith('if ') || trimmed.startsWith('elif ') || trimmed.startsWith('else') || 
                 trimmed.startsWith('for ') || trimmed.startsWith('while ') || 
                 trimmed.startsWith('def ') || trimmed.startsWith('class ') ||
                 trimmed.startsWith('try') || trimmed.startsWith('except') || 
                 trimmed.startsWith('finally') || trimmed.startsWith('with ') ||
                 trimmed.startsWith('elif') || trimmed.startsWith('else:')) && 
                !trimmed.endsWith(':') && !trimmed.includes('#')) {
                errors.push({
                    type: 'missing_colon',
                    line: i + 1,
                    message: '语句末尾缺少冒号',
                    suggestion: '在' + trimmed.split(' ')[0] + '语句末尾添加冒号，Python使用冒号标识代码块开始'
                });
            }
            
            const hasContent = trimmed.length > 0 && !trimmed.startsWith('#');
            const prevLine = i > 0 ? lines[i-1].trim() : '';
            if (hasContent && !line.startsWith('    ') && !line.startsWith('\t') && 
                prevLine.endsWith(':') && !trimmed.startsWith('if') && !trimmed.startsWith('for') && 
                !trimmed.startsWith('while') && !trimmed.startsWith('def') && !trimmed.startsWith('class')) {
                errors.push({
                    type: 'indentation',
                    line: i + 1,
                    message: '缩进不正确',
                    suggestion: '在' + prevLine.split(' ')[0] + '语句后的代码需要缩进（通常4个空格）'
                });
            }
        }
        
        if (lang === 'javascript' || lang === 'c') {
            const hasSemicolon = trimmed.endsWith(';');
            const isControlFlow = trimmed.startsWith('if') || trimmed.startsWith('for') || trimmed.startsWith('while') || 
                                 trimmed.startsWith('else') || trimmed.startsWith('switch') || trimmed.startsWith('case') ||
                                 trimmed.startsWith('try') || trimmed.startsWith('catch') || trimmed.startsWith('finally') ||
                                 trimmed.startsWith('do') || trimmed.startsWith('struct') || trimmed.startsWith('typedef') ||
                                 trimmed.startsWith('enum');
            const isBlockStartEnd = trimmed.endsWith('{') || trimmed.endsWith('}') || trimmed.includes('{') && !trimmed.includes('}');
            const isComment = trimmed.startsWith('//') || trimmed.startsWith('/*') || trimmed.startsWith('#');
            const isInclude = lang === 'c' && trimmed.startsWith('#include');
            const isDefine = lang === 'c' && trimmed.startsWith('#define');
            
            const isStatement = (/^(var\s|let\s|const\s|int\s|float\s|double\s|char\s|void\s|long\s|short\s).*=/).test(trimmed) ||
                               (/^[a-zA-Z_][a-zA-Z0-9_]*\s*=\s*[^=]/.test(trimmed)) ||
                               (/^[a-zA-Z_][a-zA-Z0-9_]*\s*\(/.test(trimmed)) ||
                               trimmed.startsWith('return') ||
                               trimmed.startsWith('console.log') ||
                               (/^(printf|scanf|puts|gets)\s*\(/.test(trimmed)) ||
                               (/^[a-zA-Z_][a-zA-Z0-9_]*\s*[+\-*/%]=/.test(trimmed)) ||
                               (/^[a-zA-Z_][a-zA-Z0-9_]*\s*[+\-\+\+\-\-]/.test(trimmed));
            
            if (isStatement && !hasSemicolon && !isControlFlow && !isBlockStartEnd && !isComment && !isInclude && !isDefine) {
                errors.push({
                    type: 'missing_semicolon',
                    line: i + 1,
                    message: '语句末尾缺少分号',
                    suggestion: '在语句末尾添加分号'
                });
            }
        }
        
        if (/["']/.test(line) && (line.split('"').length % 2 !== 1 || line.split("'").length % 2 !== 1)) {
            errors.push({
                type: 'syntax_error',
                line: i + 1,
                message: '字符串引号不匹配',
                suggestion: '检查字符串的引号是否成对出现'
            });
        }
        
        if (line.includes('=')) {
            const parts = line.split('=').map(p => p.trim());
            if (parts.length >= 2) {
                const varName = parts[0].split(' ').pop();
                if (varName && /\d/.test(varName.charAt(0))) {
                    errors.push({
                        type: 'syntax_error',
                        line: i + 1,
                        message: '变量名不能以数字开头',
                        suggestion: '修改变量名，使其以字母或下划线开头'
                    });
                }
            }
        }
    }
    
    const openBraces = (code.match(/\{/g) || []).length;
    const closeBraces = (code.match(/\}/g) || []).length;
    if (openBraces !== closeBraces) {
        errors.push({
            type: 'missing_brace',
            line: 1,
            message: '大括号不匹配',
            suggestion: '检查代码中的大括号是否成对出现，当前有' + openBraces + '个左括号和' + closeBraces + '个右括号'
        });
    }
    
    const openParens = (code.match(/\(/g) || []).length;
    const closeParens = (code.match(/\)/g) || []).length;
    if (openParens !== closeParens) {
        errors.push({
            type: 'missing_brace',
            line: 1,
            message: '圆括号不匹配',
            suggestion: '检查代码中的圆括号是否成对出现'
        });
    }
    
    if (code.includes('while') && !code.includes('break') && !code.match(/while\s*\(.*?\+\+/)) {
        errors.push({
            type: 'infinite_loop',
            line: code.indexOf('while') > -1 ? code.split('while')[0].split('\n').length : 1,
            message: '可能存在无限循环',
            suggestion: '确保while循环中有退出条件或break语句'
        });
    }
    
    if (errors.length === 0) {
        errors.push({
            type: 'no_error',
            line: 0,
            message: '未检测到明显错误',
            suggestion: '代码看起来语法正确，建议运行测试验证逻辑'
        });
    }
    
    return errors;
}

function analyzeCode() {
    const code = document.getElementById('codeInput').value;
    const lang = document.getElementById('langSelect').value;
    
    if (!code.trim()) {
        showToast('请输入代码', 'error');
        return;
    }
    
    const btn = document.getElementById('analyzeBtn');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="loading"></span> 分析中...';
    btn.disabled = true;
    
    setTimeout(() => {
        const errors = analyzeError(code, lang);
        currentAnalysis = { code, lang, errors, timestamp: Date.now() };
        
        renderAnalysis(errors, code, lang);
        switchTab('analysis');
        
        btn.innerHTML = originalText;
        btn.disabled = false;
        showToast('分析完成', 'success');
    }, 800);
}

function renderAnalysis(errors, code, lang) {
    const container = document.getElementById('analysisResult');
    const preview = document.getElementById('codePreview');
    const highlightedCode = document.getElementById('highlightedCode');
    
    let html = '';
    
    if (errors[0].type === 'no_error') {
        html += '<div class="suggestion-card"><div class="suggestion-title">✅ 代码检查通过</div><div class="suggestion-text">' + errors[0].message + '</div></div>';
    } else {
        errors.forEach(err => {
            html += '<div class="error-card"><div class="error-type">❌ ' + getErrorTypeName(err.type) + '</div><div class="error-message">' + err.message + '</div><div class="error-line">第 ' + err.line + ' 行</div></div>';
            html += '<div class="suggestion-card"><div class="suggestion-title">💡 修复建议</div><div class="suggestion-text">' + err.suggestion + '</div></div>';
        });
    }
    
    container.innerHTML = html;
    highlightedCode.innerHTML = highlightCode(code, lang);
    preview.style.display = 'block';
}

function getErrorTypeName(type) {
    const names = {
        missing_colon: '缺少冒号',
        indentation: '缩进错误',
        undefined_var: '变量未定义',
        missing_semicolon: '缺少分号',
        syntax_error: '语法错误',
        type_error: '类型错误',
        index_error: '索引越界',
        missing_brace: '括号不匹配',
        infinite_loop: '无限循环',
        no_error: '无错误'
    };
    return names[type] || type;
}

function saveToArchive() {
    if (!currentAnalysis) {
        showToast('请先进行代码分析', 'error');
        return;
    }
    
    const archive = getArchive();
    archive.push({
        id: Date.now(),
        ...currentAnalysis
    });
    localStorage.setItem('codeArchive', JSON.stringify(archive));
    showToast('已保存到错题本', 'success');
}

function getArchive() {
    const data = localStorage.getItem('codeArchive');
    return data ? JSON.parse(data) : [];
}

function loadArchive() {
    const archive = getArchive();
    const container = document.getElementById('archiveList');
    
    if (archive.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无错题记录，快去分析代码吧！</p></div>';
        return;
    }
    
    let html = '';
    archive.slice().reverse().forEach(item => {
        const date = new Date(item.timestamp);
        const dateStr = date.toLocaleDateString('zh-CN') + ' ' + date.toLocaleTimeString('zh-CN');
        const errorTypes = item.errors.map(e => getErrorTypeName(e.type)).join(', ');
        
        html += '<div class="archive-item"><div class="archive-item-header"><span class="archive-item-lang">' + item.lang.toUpperCase() + '</span><span class="archive-item-date">' + dateStr + '</span></div><div class="archive-item-error">' + errorTypes + '</div><div class="archive-item-code">' + escapeHtml(item.code) + '</div><div class="archive-item-actions"><button class="btn btn-secondary btn-sm" onclick="viewArchiveItem(' + item.id + ')">查看详情</button><button class="btn btn-danger btn-sm" onclick="deleteArchiveItem(' + item.id + ')">删除</button></div></div>';
    });
    
    container.innerHTML = html;
}

function escapeHtml(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function deleteArchiveItem(id) {
    let archive = getArchive();
    archive = archive.filter(item => item.id !== id);
    localStorage.setItem('codeArchive', JSON.stringify(archive));
    loadArchive();
    showToast('已删除', 'info');
}

function clearArchive() {
    if (confirm('确定要清空所有错题记录吗？')) {
        localStorage.removeItem('codeArchive');
        loadArchive();
        showToast('已清空', 'info');
    }
}

function viewArchiveItem(id) {
    const archive = getArchive();
    const item = archive.find(i => i.id === id);
    if (item) {
        currentAnalysis = item;
        renderAnalysis(item.errors, item.code, item.lang);
        switchTab('analysis');
    }
}

function generateExercises() {
    const errorType = document.getElementById('exerciseErrorType').value;
    const container = document.getElementById('exerciseList');
    
    if (!errorType) {
        container.innerHTML = '<div class="empty-state"><div class="icon">🎯</div><p>请选择一个错误类型生成同类习题</p></div>';
        return;
    }
    
    const exercises = exercisesDB[errorType] || [];
    
    if (exercises.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📚</div><p>暂无该类型的习题</p></div>';
        return;
    }
    
    let html = '';
    exercises.forEach((ex, index) => {
        html += '<div class="exercise-item"><h4>习题 ' + (index + 1) + ': ' + ex.title + '</h4><div class="exercise-desc">' + ex.desc + '</div><div class="exercise-code">' + escapeHtml(ex.code) + '</div><div class="exercise-hint"><strong>提示：</strong>' + ex.hint + '</div></div>';
    });
    
    container.innerHTML = html;
}

function showToast(message, type) {
    const toast = document.createElement('div');
    toast.className = 'toast toast-' + type;
    toast.textContent = message;
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.remove();
    }, 3000);
}

document.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('theme') === 'dark') {
        document.body.setAttribute('data-theme', 'dark');
        document.getElementById('themeToggle').textContent = '☀️ 亮色模式';
    }
    
    loadArchive();
