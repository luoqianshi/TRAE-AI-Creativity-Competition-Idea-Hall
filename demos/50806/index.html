<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>记梦 / JIMENG</title>
  <style>
    /* =============================================
       记梦 / JIMENG — CSS 骨架
       色彩变量 · 布局 · 组件基础样式
       ============================================= */

    /* ----- 全局重置 & 变量 ----- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #faf8f5;
      --card: #ffffff;
      --ink: #1a1a24;
      --muted: #8a8a96;
      --accent: #5b5fc7;
      --accent2: #e8924f;
      --success: #5cb88d;
      --border: #e8e5e0;
      --phone-width: 375px;
      --phone-height: 700px;
      --phone-radius: 32px;
      --card-radius: 12px;
      --shadow-sm: 0 1px 4px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.10);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-family);
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ----- 桌面端：flex 左右布局 ----- */
    .app-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      padding: 24px;
      gap: 48px;
      overflow: hidden;
    }

    /* 左侧产品介绍区 */
    .intro-panel {
      flex: 0 0 40%;
      max-width: 420px;
      padding: 0 8px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .intro-logo {
      font-size: 32px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 2px;
    }

    .intro-logo .logo-icon {
      font-size: 36px;
      margin-right: 6px;
      vertical-align: middle;
    }

    .intro-slogan {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
      margin-top: 4px;
    }

    .intro-tagline {
      font-size: 14px;
      color: var(--ink);
      line-height: 1.8;
      padding: 16px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .intro-flow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .intro-flow .flow-step {
      background: var(--card);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      border: 1px solid var(--border);
    }

    .intro-flow .flow-arrow {
      color: var(--accent);
      font-weight: 700;
    }

    .intro-rule {
      margin-top: 8px;
      font-size: 14px;
      color: var(--accent);
      background: rgba(91, 95, 199, 0.06);
      padding: 12px 16px;
      border-radius: var(--card-radius);
      line-height: 1.6;
    }

    .intro-rule strong {
      display: block;
      margin-bottom: 2px;
    }

    .quick-start-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 24px;
      font-size: 14px;
      cursor: pointer;
      font-family: var(--font-family);
      transition: opacity 0.2s;
    }

    .quick-start-btn:hover {
      opacity: 0.88;
    }

    /* 右侧手机模拟框 */
    .phone-frame {
      flex: 0 0 auto;
      width: var(--phone-width);
      height: var(--phone-height);
      background: var(--card);
      border-radius: var(--phone-radius);
      box-shadow: var(--shadow-lg), 0 0 0 2px var(--border);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* 手机顶部状态栏 */
    .phone-status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px 6px;
      font-size: 11px;
      color: var(--ink);
      flex-shrink: 0;
    }

    .phone-status-bar .time {
      font-weight: 600;
    }

    .phone-status-bar .icons {
      display: flex;
      gap: 4px;
      font-size: 10px;
    }

    /* 手机内容区 */
    .phone-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 16px;
      position: relative;
    }

    .phone-content::-webkit-scrollbar {
      width: 0;
    }

    /* 底部导航栏 */
    .bottom-nav {
      display: flex;
      align-items: center;
      justify-content: space-around;
      height: 56px;
      background: var(--card);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      padding: 0 8px;
    }

    .bottom-nav .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 10px;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 12px;
      border-radius: var(--card-radius);
      transition: color 0.2s;
      user-select: none;
    }

    .bottom-nav .nav-item .nav-icon {
      font-size: 20px;
      line-height: 1;
    }

    .bottom-nav .nav-item.active {
      color: var(--accent);
    }

    .bottom-nav .nav-item.active .nav-icon {
      /* 选中态由 accent 色体现 */
    }

    /* 记一笔浮动按钮 */
    .fab-record {
      position: absolute;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(91, 95, 199, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .fab-record:hover {
      transform: translateX(-50%) scale(1.06);
      box-shadow: 0 6px 20px rgba(91, 95, 199, 0.45);
    }

    /* 引导层 */
    .onboarding-overlay {
      position: absolute;
      inset: 0;
      background: rgba(26, 26, 36, 0.55);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    .onboarding-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .onboarding-card {
      background: var(--card);
      border-radius: var(--card-radius);
      padding: 32px 24px;
      text-align: center;
      max-width: 280px;
      box-shadow: var(--shadow-lg);
    }

    .onboarding-card .onboarding-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .onboarding-card h2 {
      font-size: 18px;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .onboarding-card p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .onboarding-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 32px;
      border-radius: 24px;
      font-size: 14px;
      cursor: pointer;
      font-family: var(--font-family);
    }

    .onboarding-btn:hover {
      opacity: 0.88;
    }

    /* 重置演示按钮 */
    .reset-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
      cursor: pointer;
      font-family: var(--font-family);
      z-index: 5;
      transition: color 0.2s, border-color 0.2s;
    }

    .reset-btn:hover {
      color: var(--ink);
      border-color: var(--muted);
    }

    /* 快速体验入口 */
    .quick-tour-entry {
      position: absolute;
      top: 8px;
      left: 8px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
      cursor: pointer;
      font-family: var(--font-family);
      z-index: 5;
      transition: color 0.2s, border-color 0.2s;
    }

    .quick-tour-entry:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* ----- 通用组件样式 ----- */
    .card {
      background: var(--card);
      border-radius: var(--card-radius);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .card-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
    }

    .card-value.accent {
      color: var(--accent);
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-income {
      background: rgba(92, 184, 141, 0.12);
      color: var(--success);
    }

    .badge-save {
      background: rgba(232, 146, 79, 0.12);
      color: var(--accent2);
    }

    .badge-dream {
      background: rgba(91, 95, 199, 0.10);
      color: var(--accent);
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 12px 0;
    }

    .section-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 16px 0 8px;
    }

    /* ----- 移动端适配 ----- */
    @media (max-width: 768px) {
      .app-wrapper {
        flex-direction: column;
        padding: 0;
        gap: 0;
      }

      .intro-panel {
        display: none;
      }

      .phone-frame {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }

      .phone-status-bar {
        padding: env(safe-area-inset-top, 8px) 20px 6px;
      }

      .bottom-nav {
        padding-bottom: env(safe-area-inset-bottom, 0);
      }

      .fab-record {
        bottom: 80px;
      }

      .reset-btn,
      .quick-tour-entry {
        top: 4px;
      }
    }

    /* ----- prefers-reduced-motion 支持 ----- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .progress-fill {
        transition: none !important;
      }
    }

    /* ----- 场景占位 ----- */
    [data-scene] {
      display: none;
    }

    [data-scene].active {
      display: block;
    }

    /* =============================================
       场景组件样式扩展
       ============================================= */

    /* --- 场景内容通用 --- */
    .scene-content {
      padding: 8px 0 20px;
    }

    .scene-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .scene-header .back-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: var(--ink);
      padding: 4px;
      line-height: 1;
    }

    .scene-header h2 {
      font-size: 18px;
      font-weight: 700;
    }

    /* --- 首页 --- */
    .greeting {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
      padding-top: 8px;
    }

    .greeting-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* 梦想进度卡 */
    .dream-progress-card {
      background: linear-gradient(135deg, #5b5fc7 0%, #7b7fd8 100%);
      border-radius: var(--card-radius);
      padding: 18px 16px;
      color: #fff;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(91, 95, 199, 0.25);
    }

    .dream-progress-card .dream-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .dream-progress-card .dream-name {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .dream-progress-card .dream-meta {
      font-size: 12px;
      opacity: 0.85;
      margin-bottom: 10px;
    }

    .dream-progress-card .dream-stage {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 11px;
      margin-bottom: 10px;
    }

    .dream-progress-card .progress-bar-light {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.25);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .dream-progress-card .progress-bar-light .progress-fill-light {
      height: 100%;
      background: #fff;
      border-radius: 3px;
      transition: width 0.5s ease;
    }

    .dream-progress-card .progress-text {
      font-size: 12px;
      opacity: 0.9;
    }

    /* 统计卡片网格 */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--card);
      border-radius: var(--card-radius);
      padding: 14px;
      box-shadow: var(--shadow-sm);
    }

    .stat-card .stat-icon {
      font-size: 20px;
      margin-bottom: 6px;
    }

    .stat-card .stat-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .stat-card .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
    }

    .stat-card .stat-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* 最近记录摘要 */
    .recent-record {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
    }

    .recent-record .record-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .recent-record .record-dot.income {
      background: var(--success);
    }

    .recent-record .record-dot.save {
      background: var(--accent2);
    }

    .recent-record .record-info {
      flex: 1;
      font-size: 13px;
    }

    .recent-record .record-amount {
      font-weight: 600;
      font-size: 14px;
    }

    /* 最近成就 */
    .recent-achievement {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
    }

    .recent-achievement .ach-icon {
      font-size: 24px;
    }

    .recent-achievement .ach-name {
      font-size: 13px;
      font-weight: 600;
    }

    .recent-achievement .ach-date {
      font-size: 11px;
      color: var(--muted);
    }

    /* 梦想预计 */
    .dream-eta {
      padding: 12px 0;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    .dream-eta strong {
      color: var(--accent);
    }

    /* --- 表单样式 --- */
    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: var(--font-family);
      color: var(--ink);
      background: var(--bg);
      transition: border-color 0.2s;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-textarea {
      resize: vertical;
      min-height: 60px;
    }

    .form-hint {
      font-size: 11px;
      color: var(--accent);
      margin-top: 4px;
      line-height: 1.4;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-family);
      transition: opacity 0.2s;
    }

    .btn-primary:hover {
      opacity: 0.88;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      width: 100%;
      padding: 10px;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-family: var(--font-family);
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(91, 95, 199, 0.06);
    }

    .btn-outline {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-family: var(--font-family);
      color: var(--ink);
      transition: all 0.2s;
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* 存入选项 */
    .save-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .save-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .save-option.selected {
      border-color: var(--accent);
      background: rgba(91, 95, 199, 0.04);
    }

    .save-option .option-radio {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .save-option.selected .option-radio {
      border-color: var(--accent);
      background: var(--accent);
    }

    .save-option.selected .option-radio::after {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
    }

    .save-option .option-text {
      font-size: 13px;
      font-weight: 600;
    }

    .save-option .option-sub {
      font-size: 11px;
      color: var(--muted);
    }

    .tip-text {
      font-size: 12px;
      color: var(--accent2);
      background: rgba(232, 146, 79, 0.08);
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    /* --- 结算场景容器：填满手机内容区 --- */
    [data-scene="income-settlement"].active,
    [data-scene="save-settlement"].active {
      position: relative;
      min-height: 100%;
    }

    /* --- 结算动画（增强版） --- */
    .settlement-scene {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .settlement-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      text-align: center;
      padding: 40px 16px 80px;
      z-index: 2;
    }

    /* 每个阶段：满屏居中、高亮浮现 */
    .settlement-stage {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.92) translateY(20px);
      transition: opacity 0.5s cubic-bezier(0.16,1,0.3,1), transform 0.5s cubic-bezier(0.16,1,0.3,1);
      padding: 24px;
      pointer-events: none;
    }

    .settlement-stage.visible {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
    }

    /* 高亮光晕脉冲 */
    .settlement-stage .stage-glow {
      position: absolute;
      width: 160px; height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(91,95,199,0.18) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: glowPulse 1.8s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes glowPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    }

    .settlement-stage .stage-icon {
      font-size: 52px;
      margin-bottom: 14px;
      animation: iconBounce 0.5s cubic-bezier(0.34,1.56,0.64,1);
      position: relative;
      z-index: 1;
    }

    @keyframes iconBounce {
      0% { transform: scale(0.4); opacity: 0; }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    .settlement-stage .stage-label {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      position: relative;
      z-index: 1;
    }

    .settlement-stage .stage-value {
      font-size: 34px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.5px;
      position: relative;
      z-index: 1;
    }

    .settlement-stage .stage-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
      position: relative;
      z-index: 1;
    }

    .settlement-stage .stage-highlight {
      color: var(--accent);
      font-weight: 800;
    }

    /* 成就解锁特殊样式 */
    .settlement-stage.achievement-unlock .stage-icon {
      font-size: 64px;
    }
    .settlement-stage.achievement-unlock .stage-value {
      color: var(--accent2);
      font-size: 28px;
    }

    .settlement-skip {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      padding: 6px 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,0.8);
      font-family: var(--font-family);
      z-index: 10;
      transition: color 0.2s, background 0.2s;
    }

    .settlement-skip:hover {
      color: var(--ink);
      background: rgba(255,255,255,0.95);
    }

    /* 庆祝粒子 Canvas */
    .confetti-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 3;
    }

    /* 最终结算汇总卡 */
    .settlement-summary {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.9);
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.34,1.56,0.64,1);
      pointer-events: none;
      padding: 24px;
      z-index: 4;
      background: var(--card);
    }

    .settlement-summary.visible {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .settlement-summary .summary-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--accent), #7b7fd4);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 18px;
      border-radius: 20px;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .settlement-summary .summary-icon {
      font-size: 56px;
      margin-bottom: 12px;
      animation: iconBounce 0.6s cubic-bezier(0.34,1.56,0.64,1);
    }

    .settlement-summary .summary-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .settlement-summary .summary-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .settlement-summary .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      max-width: 280px;
      margin-bottom: 20px;
    }

    .settlement-summary .summary-item {
      background: rgba(91,95,199,0.05);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .settlement-summary .summary-item .si-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .settlement-summary .summary-item .si-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
    }

    .settlement-summary .summary-item .si-value.accent {
      color: var(--accent);
    }

    .settlement-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 260px;
      margin-top: 8px;
    }

    /* 光点粒子 */
    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      pointer-events: none;
      animation: sparkleFade 1s ease-out forwards;
      z-index: 5;
    }

    .sparkle.gold {
      background: var(--accent2);
    }

    @keyframes sparkleFade {
      0% { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(0); }
    }

    /* 数字滚动 */
    .number-roll {
      display: inline-block;
      font-variant-numeric: tabular-nums;
    }

    /* --- 梦想详情 --- */
    .dream-detail-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .dream-detail-header .dream-icon-lg {
      font-size: 48px;
      margin-bottom: 8px;
    }

    .dream-detail-header .dream-name-lg {
      font-size: 20px;
      font-weight: 700;
    }

    .dream-detail-header .dream-target {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    .contrib-section {
      margin-bottom: 16px;
    }

    .contrib-section h3 {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .contrib-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .contrib-item:last-child {
      border-bottom: none;
    }

    .contrib-item .contrib-label {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .contrib-item .contrib-value {
      font-size: 14px;
      font-weight: 600;
    }

    .contrib-item.muted-row {
      color: var(--muted);
    }

    .contrib-item.muted-row .contrib-value {
      font-weight: 400;
    }

    /* 时间轴 */
    .timeline {
      position: relative;
      padding-left: 20px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--border);
    }

    .timeline-item {
      position: relative;
      margin-bottom: 14px;
      padding-left: 10px;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -16px;
      top: 6px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .timeline-item .tl-date {
      font-size: 11px;
      color: var(--muted);
    }

    .timeline-item .tl-desc {
      font-size: 13px;
      margin-top: 2px;
    }

    .timeline-item .tl-amount {
      font-weight: 600;
    }

    /* 里程碑 */
    .milestones {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin: 16px 0 8px;
    }

    .milestones::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 10px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
    }

    .milestone {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
      font-size: 10px;
      color: var(--muted);
    }

    .milestone .ms-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--border);
      margin-bottom: 4px;
      border: 2px solid var(--card);
    }

    .milestone.reached .ms-dot {
      background: var(--accent);
    }

    .milestone.current .ms-dot {
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(91, 95, 199, 0.2);
    }

    /* --- 梦想完成 --- */
    .complete-summary {
      text-align: center;
      padding: 20px 0;
    }

    .complete-summary .complete-icon {
      font-size: 56px;
      margin-bottom: 12px;
    }

    .complete-summary .complete-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .complete-summary .complete-date {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .complete-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .complete-stat {
      text-align: center;
      padding: 12px;
      background: var(--bg);
      border-radius: 8px;
    }

    .complete-stat .cs-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }

    .complete-stat .cs-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .core-message {
      background: rgba(91, 95, 199, 0.06);
      border-radius: var(--card-radius);
      padding: 16px;
      font-size: 14px;
      line-height: 1.8;
      color: var(--ink);
      text-align: center;
      margin-bottom: 16px;
    }

    .memorial-card {
      background: linear-gradient(135deg, #faf8f5 0%, #ede9f5 100%);
      border: 2px solid var(--accent);
      border-radius: var(--card-radius);
      padding: 20px;
      text-align: center;
    }

    .memorial-card .memorial-icon {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .memorial-card .memorial-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .memorial-card .memorial-sub {
      font-size: 12px;
      color: var(--muted);
    }

    /* --- 成就中心 --- */
    .achievement-filter {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .achievement-filter .filter-chip {
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: var(--font-family);
      transition: all 0.2s;
    }

    .achievement-filter .filter-chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .achievement-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .achievement-card {
      background: var(--card);
      border-radius: var(--card-radius);
      padding: 14px;
      box-shadow: var(--shadow-sm);
      text-align: center;
      transition: transform 0.2s;
    }

    .achievement-card.unlocked {
      border: 1px solid var(--success);
      background: rgba(92, 184, 141, 0.04);
    }

    .achievement-card.locked {
      opacity: 0.6;
    }

    .achievement-card .ach-card-icon {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .achievement-card .ach-card-name {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .achievement-card .ach-card-condition {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .achievement-card .ach-card-status {
      font-size: 10px;
    }

    .achievement-card .ach-card-status.unlocked-text {
      color: var(--success);
    }

    .achievement-card .ach-card-status.locked-text {
      color: var(--muted);
    }

    .achievement-card .ach-mini-progress {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }

    .achievement-card .ach-mini-progress .ach-mini-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
    }

    /* --- 我的 --- */
    .profile-header {
      text-align: center;
      padding: 16px 0;
    }

    .profile-avatar {
      font-size: 48px;
      margin-bottom: 8px;
    }

    .profile-name {
      font-size: 18px;
      font-weight: 700;
    }

    .profile-stats {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 12px 0;
    }

    .profile-stat {
      text-align: center;
    }

    .profile-stat .ps-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }

    .profile-stat .ps-label {
      font-size: 11px;
      color: var(--muted);
    }

    .record-list-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .record-list-item:last-child {
      border-bottom: none;
    }

    .record-list-item .rli-icon {
      font-size: 20px;
    }

    .record-list-item .rli-info {
      flex: 1;
      font-size: 13px;
    }

    .record-list-item .rli-amount {
      font-weight: 600;
      font-size: 14px;
    }

    .record-list-item .rli-date {
      font-size: 11px;
      color: var(--muted);
    }

    /* --- 分享 --- */
    .share-card-preview {
      background: linear-gradient(135deg, #5b5fc7 0%, #7b7fd8 100%);
      border-radius: var(--card-radius);
      padding: 24px 20px;
      color: #fff;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(91, 95, 199, 0.25);
    }

    .share-card-preview .share-title {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 8px;
    }

    .share-card-preview .share-dream {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .share-card-preview .share-stats {
      font-size: 12px;
      opacity: 0.85;
    }

    .share-card-preview.achievement-share {
      background: linear-gradient(135deg, #e8924f 0%, #f0a870 100%);
    }

    .share-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .share-options .privacy-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }

    .share-options .privacy-option:hover {
      background: var(--bg);
    }

    .share-options .privacy-option.selected {
      background: rgba(91, 95, 199, 0.06);
    }

    .share-options .privacy-option .privacy-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
    }

    .share-options .privacy-option.selected .privacy-dot {
      border-color: var(--accent);
      background: var(--accent);
    }

    /* --- FAB 弹出菜单 --- */
    .fab-popup {
      position: absolute;
      bottom: 132px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 11;
    }

    .fab-popup.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(-4px);
    }

    .fab-popup-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 10px 18px;
      font-size: 13px;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      white-space: nowrap;
      transition: background 0.2s;
      font-family: var(--font-family);
    }

    .fab-popup-item:hover {
      background: var(--bg);
    }

    .fab-popup-item .popup-icon {
      font-size: 16px;
    }

    /* FAB 遮罩 */
    .fab-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9;
      display: none;
    }

    .fab-backdrop.visible {
      display: block;
    }

    /* --- Toast --- */
    .toast {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 12px;
      z-index: 200;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.visible {
      opacity: 1;
    }

    /* --- 动画关键帧 --- */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.5s ease forwards;
    }

    .animate-pulse {
      animation: pulse 1.5s ease infinite;
    }
  </style>
</head>

  <!-- =============================================

  <div class="app-wrapper">

        <div class="fab-popup-item" data-action="save">

      <!-- 重置演示按钮 -->

            if (parsed._currentTab !== undefined) window.App.currentTab = parsed._currentTab;
          } catch (e) {
            window.App.state = getDefaultData();

      // =============================================
      // 动画引擎
      // =============================================
      function animateNumber(el, from, to, duration, prefix) {
        if (window.App.reducedMotion) { el.textContent = (prefix || '') + to; return; }
        prefix = prefix || '';
        var start = performance.now();
        function step(now) {
          var elapsed = now - start;
          var progress = Math.min(elapsed / duration, 1);
          var eased = 1 - Math.pow(1 - progress, 3);
          var current = Math.round(from + (to - from) * eased);
          el.textContent = prefix + current.toLocaleString('zh-CN');
          if (progress < 1) { requestAnimationFrame(step); }
        }
        requestAnimationFrame(step);
      }

      function animateProgress(el, toPercent, duration) {
        if (window.App.reducedMotion) { el.style.width = toPercent + '%'; return; }
        el.style.transition = 'width ' + (duration / 1000) + 's ease';
        el.style.width = toPercent + '%';
      }

      // =====================================================
      // 声音引擎（Web Audio API 合成，无需外部文件）
      // =====================================================
      var AudioEngine = (function () {
        var ctx = null;
        function getCtx() {
          if (!ctx) {
            try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
          }
          return ctx;
        }
        function playTone(freq, duration, type, vol, ramp) {
          if (window.App.reducedMotion) return;
          var c = getCtx();
          if (!c) return;
          var osc = c.createOscillator();
          var gain = c.createGain();
          osc.type = type || 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(vol || 0.12, c.currentTime);
          if (ramp) gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(c.currentTime);
          osc.stop(c.currentTime + duration);
        }
        return {
          // 阶段切换音
          stageTransition: function () { playTone(660, 0.15, 'sine', 0.08, true); },
          // 数字滚动音
          numberTick: function () { playTone(880, 0.06, 'sine', 0.05, true); },
          // 成就解锁音（上升和弦）
          achievementUnlock: function () {
            playTone(523, 0.2, 'triangle', 0.12, true);
            setTimeout(function () { playTone(659, 0.2, 'triangle', 0.12, true); }, 120);
            setTimeout(function () { playTone(784, 0.35, 'triangle', 0.14, true); }, 240);
          },
          // 庆祝音
          celebration: function () {
            var notes = [523, 659, 784, 1047];
            notes.forEach(function (f, i) {
              setTimeout(function () { playTone(f, 0.3, 'triangle', 0.1, true); }, i * 100);
            });
          },
          // 存入音
          deposit: function () { playTone(440, 0.25, 'sine', 0.1, true); setTimeout(function () { playTone(554, 0.25, 'sine', 0.1, true); }, 120); }
        };
      })();

      // =====================================================
      // 庆祝粒子效果（五彩纸屑）
      // =====================================================
      function spawnConfetti(container) {
        if (window.App.reducedMotion) return;
        var canvas = document.createElement('canvas');
        canvas.className = 'confetti-canvas';
        canvas.width = container.offsetWidth || 375;
        canvas.height = container.offsetHeight || 600;
        container.appendChild(canvas);
        var ctx2d = canvas.getContext('2d');
        var particles = [];
        var colors = ['#5b5fc7', '#e8924f', '#5cb88d', '#f6c76d', '#b982ff', '#43caff', '#ff6b8a'];
        for (var i = 0; i < 60; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: -10 - Math.random() * 60,
            w: 4 + Math.random() * 6,
            h: 2 + Math.random() * 5,
            color: colors[Math.floor(Math.random() * colors.length)],
            vx: (Math.random() - 0.5) * 2,
            vy: 1.5 + Math.random() * 3,
            rot: Math.random() * 360,
            rotV: (Math.random() - 0.5) * 8,
            opacity: 1
          });
        }
        var frame = 0;
        function animate() {
          if (frame > 120) {
            canvas.remove();
            return;
          }
          frame++;
          ctx2d.clearRect(0, 0, canvas.width, canvas.height);
          particles.forEach(function (p) {
            p.x += p.vx;
            p.y += p.vy;
            p.rot += p.rotV;
            p.vx *= 0.99;
            p.vy += 0.02;
            if (frame > 80) p.opacity = Math.max(0, p.opacity - 0.025);
            ctx2d.save();
            ctx2d.translate(p.x, p.y);
            ctx2d.rotate(p.rot * Math.PI / 180);
            ctx2d.globalAlpha = p.opacity;
            ctx2d.fillStyle = p.color;
            ctx2d.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx2d.restore();
          });
          requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);
      }

      // =====================================================
      // 光点粒子爆发
      // =====================================================
      function spawnSparkles(container, count) {
        if (window.App.reducedMotion) return;
        var w = container.offsetWidth || 375;
        var h = container.offsetHeight || 600;
        var cx = w / 2;
        var cy = h / 2;
        for (var i = 0; i < (count || 12); i++) {
          var spark = document.createElement('div');
          spark.className = 'sparkle' + (Math.random() > 0.5 ? ' gold' : '');
          var angle = Math.random() * Math.PI * 2;
          var dist = 40 + Math.random() * 80;
          spark.style.setProperty('--sx', Math.cos(angle) * dist + 'px');
          spark.style.setProperty('--sy', Math.sin(angle) * dist + 'px');
          spark.style.left = cx + 'px';
          spark.style.top = cy + 'px';
          spark.style.animationDuration = (0.6 + Math.random() * 0.8) + 's';
          container.appendChild(spark);
          setTimeout(function () { spark.remove(); }, 1500);
        }
      }

      // =====================================================
      // 结算动画通用引擎（增强版）
      // =====================================================
      function playSettlementStages(container, stages, onComplete, overlayTarget) {
        var overlay = overlayTarget || container;
        if (window.App.reducedMotion) {
          stages.forEach(function (stage) {
            var div = document.createElement('div');
            div.className = 'settlement-stage visible';
            div.innerHTML = '<div class="stage-glow"></div>' + stage.html;
            container.appendChild(div);
          });
          if (onComplete) onComplete();
          return;
        }

        var currentIdx = 0;
        var stageEls = [];

        function showNext() {
          // 上一幕淡出退场
          if (stageEls.length > 0) {
            var prev = stageEls[stageEls.length - 1];
            prev.classList.remove('visible');
            setTimeout(function () { if (prev.parentNode) prev.remove(); }, 500);
          }

          if (currentIdx >= stages.length) {
            if (onComplete) onComplete();
            return;
          }
          var stage = stages[currentIdx];

          // 播放阶段切换音
          AudioEngine.stageTransition();

          var div = document.createElement('div');
          div.className = 'settlement-stage';
          if (stage.isAchievement) div.classList.add('achievement-unlock');
          div.innerHTML = '<div class="stage-glow"></div>' + stage.html;
          container.appendChild(div);
          stageEls.push(div);

          requestAnimationFrame(function () {
            div.classList.add('visible');
          });

          // 粒子效果（飞到独立场景层，不跟文字容器混在一起）
          if (stage.sparkles) {
            setTimeout(function () { spawnSparkles(overlay, stage.sparkles); }, 200);
          }
          if (stage.confetti) {
            setTimeout(function () { spawnConfetti(overlay); }, 300);
          }

          // 数字滚动
          if (stage.animateNumber) {
            var an = stage.animateNumber;
            var targetEl = div.querySelector(an.selector);
            if (targetEl) {
              // 数字滚动时播放滴答音
              var tickCount = 0;
              var origAnim = animateNumber;
              animateNumber(targetEl, an.from, an.to, an.duration || 600, an.prefix || '');
              // 简化：在数字滚动期间播放几次滴答音
              var ticks = Math.min(5, Math.floor((an.duration || 600) / 150));
              for (var t = 0; t < ticks; t++) {
                setTimeout(function () { AudioEngine.numberTick(); }, t * 150);
              }
            }
          }

          // 进度条动画
          if (stage.animateProgress) {
            var ap = stage.animateProgress;
            var progEl = div.querySelector(ap.selector);
            if (progEl) {
              setTimeout(function () {
                animateProgress(progEl, ap.to, ap.duration || 600);
              }, 100);
            }
          }

          // 成就解锁音效
          if (stage.isAchievement) {
            setTimeout(function () { AudioEngine.achievementUnlock(); }, 400);
          }
          // 存入音效
          if (stage.isDeposit) {
            setTimeout(function () { AudioEngine.deposit(); }, 300);
          }
          // 庆祝音效
          if (stage.isCelebration) {
            setTimeout(function () { AudioEngine.celebration(); }, 500);
          }

          currentIdx++;
          setTimeout(showNext, stage.delay || 1000);
        }

        showNext();
      }

      function bindSaveStep1() {
        var nextBtn = document.getElementById('saveNextBtn');

          saveFormData.amount = Number(document.getElementById('saveAmount').value) || 0;
          saveFormData.saveType = document.getElementById('saveType').value;
          saveFormData.originalItem = document.getElementById('saveOriginalItem').value;
          saveFormData.note = document.getElementById('saveNote').value;
          saveFormData.date = getToday();

          if (saveFormData.amount <= 0) {
            showToast('请输入节省金额');
            return;
          }

          saveStep = 2;
          var container = document.getElementById('saveFormContainer');
          // 保持 scene-header，替换表单内容
          var header = container.querySelector('.scene-header');
          container.innerHTML = '';
          container.appendChild(header);
          var step2Div = document.createElement('div');
          step2Div.innerHTML = renderSaveStep2();
          container.appendChild(step2Div);
          bindSaveStep2();
        });

      function bindSaveStep2() {
        var options = document.querySelectorAll('#saveFormContainer .save-option');
        var partialGroup = document.getElementById('partialAmountGroup');
        var confirmedInput = document.getElementById('saveConfirmedAmount');
        var selectedOption = 'partial';

        options.forEach(function (opt) {
          opt.addEventListener('click', function () {
            options.forEach(function (o) { o.classList.remove('selected'); });
            opt.classList.add('selected');
            selectedOption = opt.getAttribute('data-option');
            if (selectedOption === 'none') {
              partialGroup.style.display = 'none';
            } else if (selectedOption === 'all') {
              partialGroup.style.display = 'none';
            } else {
              partialGroup.style.display = 'block';
            }
          });
        });

        var completeBtn = document.getElementById('saveCompleteBtn');
        completeBtn.addEventListener('click', function () {
          var confirmedSave = 0;
          if (selectedOption === 'all') {
            confirmedSave = saveFormData.amount;
          } else if (selectedOption === 'partial') {
            confirmedSave = Number(confirmedInput.value) || 0;
          }
          if (selectedOption !== 'none' && confirmedSave > saveFormData.amount) {
            showToast('确认存入不能超过节省金额');
            return;
          }

          submitSave({
            type: 'save',
            saveType: saveFormData.saveType,
            amount: saveFormData.amount,
            originalItem: saveFormData.originalItem,
            date: saveFormData.date,
            note: saveFormData.note,
            confirmedSave: confirmedSave,
            savedToDream: confirmedSave
          });
        });
      }

        var progress = window.getDreamProgress();

        var milestoneHtml = '';
        milestones.forEach(function (m) {
          var cls = 'milestone';

        });

      // =============================================
      // 表单提交处理
      // =============================================
      function submitIncome(data) {
        var s = window.App.state;
        var oldProgress = window.getDreamProgress();

        // 更新数据
        s.monthlyIncome += data.amount;
        s.monthlyConfirmedSaved += data.savedToDream;
        s.totalRecords += 1;
        if (data.incomeType === '副业') {
          s.sideIncomeMonths += 1;
        }
        s.dream.confirmedSaved += data.savedToDream;
        s.dream.incomeContrib += data.savedToDream;

        // 添加记录
        s.records.push(data);

        // 检查成就：副业渐入佳境
        if (s.sideIncomeMonths >= 4) {
          var ach = s.achievements.find(function (a) { return a.id === 'side_income_improving'; });
          if (ach && !ach.unlocked) {
            ach.unlocked = true;
            ach.unlockedAt = getToday();
            ach.progress = 100;
          }
        }

        // 检查成就：理性消费练习者 (本月已有4次节省)
        var thisMonthSaves = s.records.filter(function (r) {
          return r.type === 'save' && r.date && r.date.startsWith('2026-06');
        }).length;
        var rationalAch = s.achievements.find(function (a) { return a.id === 'rational_consumer'; });
        if (rationalAch && !rationalAch.unlocked && thisMonthSaves >= 4) {
          rationalAch.unlocked = true;
          rationalAch.unlockedAt = getToday();
          rationalAch.progress = 100;
        }

        persistData();

        // 切换到结算场景
        switchScene('income-settlement');
        renderIncomeSettlement({
          incomeType: data.incomeType,
          amount: data.amount,
          savedToDream: data.savedToDream,
          oldProgress: oldProgress
        });
      }

      function submitSave(data) {
        var s = window.App.state;
        var oldProgress = window.getDreamProgress();

        // 更新数据
        s.monthlyBehaviorSaved += data.amount;

        s.totalRecords += 1;

          s.monthlyConfirmedSaved += data.confirmedSave;

      // 绑定收入表单提交事件
      function bindIncomeForm() {
        var btn = document.getElementById('submitIncomeBtn');
        if (!btn) return;
        // 移除旧事件（通过克隆节点）
        var newBtn = btn.cloneNode(true);
        btn.parentNode.replaceChild(newBtn, btn);
        newBtn.addEventListener('click', function () {
          var amount = Number(document.getElementById('incomeAmount').value) || 0;
          var incomeType = document.getElementById('incomeType').value;
          var source = document.getElementById('incomeSource').value;
          var date = document.getElementById('incomeDate').value;
          var note = document.getElementById('incomeNote').value;
          var dreamAllocation = Number(document.getElementById('incomeDreamAllocation').value) || 0;

          if (amount <= 0) { showToast('请输入收入金额'); return; }
          if (dreamAllocation > amount) { showToast('存入金额不能超过收入金额'); return; }

          submitIncome({
            type: 'income',
            incomeType: incomeType,
            amount: amount,
            source: source,
            date: date,
            note: note,
            dreamAllocation: dreamAllocation,
            savedToDream: dreamAllocation
          });
        });
      }

      // 底部导航
      bottomNav.addEventListener('click', function (e) {
        var navItem = e.target.closest('.nav-item');
        if (!navItem) return;
        var tab = navItem.getAttribute('data-tab');
        closeFabMenu();

        if (tab === 'home') {
          switchScene('home');
          updateNavActive('home');
          renderHome();
        } else if (tab === 'dream') {
          switchScene('dream-detail');
          updateNavActive('dream');
          renderDreamDetail();
        } else if (tab === 'achievements') {
          switchScene('achievements');
          updateNavActive('achievements');
          renderAchievements();
        } else if (tab === 'profile') {
          switchScene('profile');
          updateNavActive('profile');
          renderProfile();
        }
      });

      // FAB 按钮
      fabRecord.addEventListener('click', function (e) {
        e.stopPropagation();
        if (fabPopup.classList.contains('visible')) {
          closeFabMenu();
        } else {
          fabPopup.classList.add('visible');
          fabBackdrop.classList.add('visible');
        }
      });

      // FAB 弹出菜单项
      fabPopup.addEventListener('click', function (e) {
        var item = e.target.closest('.fab-popup-item');
        if (!item) return;
        var action = item.getAttribute('data-action');
        closeFabMenu();

        if (action === 'income') {
          switchScene('record-income');
          renderRecordIncome();
          bindIncomeForm();
        } else if (action === 'save') {
          switchScene('record-save');
          renderRecordSave();
        }
      });

      // FAB 遮罩
      fabBackdrop.addEventListener('click', function () {
        closeFabMenu();
      });

      // 引导层
      onboardingStartBtn.addEventListener('click', function () {
        onboardingOverlay.classList.remove('visible');
        window.App.onboardingShown = true;
        persistData();
      });

      // 重置按钮
      resetBtn.addEventListener('click', function () {
        window.resetData();
        renderHome();
        closeFabMenu();
        showToast('\u21BB 数据已重置');
      });

      // 手机端快速体验入口
      quickTourEntry.addEventListener('click', function () {
        startQuickTour();
      });

      // 桌面端快速体验按钮
      quickStartBtn.addEventListener('click', function () {
        startQuickTour();
      });

      // =============================================
      // 启动
      // =============================================
      initData();

      // 渲染首页
      renderHome();

      // 首次打开显示引导层
      if (!window.App.onboardingShown) {
        setTimeout(function () {
          onboardingOverlay.classList.add('visible');
        }, 600);
      }

      console.log('[记梦] 数据层初始化完成。');
      console.log('[记梦] 当前梦想:', window.App.state.dream.name);
      console.log('[记梦] 真实进度:', window.getDreamProgress() + '%');
      console.log('[记梦] 行为节省累计:', window.App.state.dream.behaviorSaved, '(不加入进度)');

    })();
  </script>

</body>
</html>
