<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>雀战奇谭 — 二人麻将卡牌策略</title>
    <script type="module" crossorigin src="./assets/index-DCVPhlCz.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Bh3FJ3xE.css">
  </head>
  <body>
    <!-- App Container designed to behave as a vertical phone viewport -->
    <div id="app">
      <!-- Floating BGM and Fullscreen control buttons -->
      <button id="bgm-control-btn" class="bgm-toggle-btn" title="切换背景音乐">🎵</button>
      <button id="fullscreen-control-btn" class="fullscreen-toggle-btn" title="切换全屏">⛶</button>

      <!-- Portrait Warning Overlay - shown only in portrait mode on mobile -->
      <div id="portrait-warning" class="portrait-warning">
        <div class="portrait-warning-inner">
          <div class="rotate-icon">📱</div>
          <p>请横持设备以获得最佳体验</p>
          <p style="font-size:12px; opacity:0.7;">Please rotate to landscape</p>
        </div>
      </div>
      
      <!-- Top header for stats (Shared across views where needed) -->
      <div id="game-header" class="game-header glass-panel" style="display: none;">
        <div style="display: flex; gap: 10px;">
          <div class="stat-item" id="header-map-btn" style="cursor: pointer;">
            <span>🗺️</span>
            <span class="stat-val">查看地图</span>
          </div>
          <div class="stat-item" id="header-help-btn" style="cursor: pointer; border-left: 1px solid rgba(255,255,255,0.1); padding-left: 10px;">
            <span>📖</span>
            <span class="stat-val">规则帮助</span>
          </div>
        </div>
        <div class="stats-container">
          <div class="stat-item">
            <span>🪙</span>
            <span id="header-gold" class="stat-val">0</span>
          </div>
          <div class="stat-item">
            <span>❤️</span>
            <span id="header-chips" class="stat-val">1000</span>
          </div>
        </div>
      </div>

      <!-- VIEW 1: Main Menu -->
      <div id="view-menu" class="game-view menu-view">
        <h1 class="menu-title neon-glow">雀战奇谭</h1>
        <p class="menu-subtitle">二人麻将 × 牌组构筑 × 策略卡牌</p>
        <div class="menu-buttons">
          <button id="btn-continue-run" class="btn btn-primary" style="display: none;">继续上次闯关</button>
          <button id="btn-start-run" class="btn btn-primary">开始新的闯关</button>
          <button id="btn-open-upgrades" class="btn">局外永久养成</button>
          <button id="btn-open-characters" class="btn">🎭 角色图鉴</button>
          <button id="btn-open-help" class="btn">📖 帮助中心</button>
        </div>
      </div>

      <!-- VIEW 2: Roguelike Map -->
      <div id="view-map" class="game-view map-view" style="display: none;">
        <div class="map-header">
          <h2 id="map-chapter-title" class="neon-glow">第一章：雀坛新手村</h2>
          <button id="btn-map-back-menu" class="btn" style="padding: 5px 10px; font-size: 12px;">返回主页</button>
        </div>
        <div id="map-scroll" class="map-scroll-container">
          <!-- Rows will be injected dynamically -->
        </div>
      </div>

      <!-- VIEW 3: Battle Arena -->
      <div id="view-battle" class="game-view battle-view" style="display: none;">
        <!-- Battle Header Info -->
        <div class="battle-header">
          <div class="battle-info-left">
            <span id="battle-deck-left">牌山剩余: 70 张</span>
            <span id="battle-turn-count">第 1 巡</span>
          </div>
          <div class="battle-info-right" id="battle-status">等待出牌</div>
        </div>

        <!-- Main Battle Area -->
        <div class="battle-main-area">
          <!-- Opponent Area -->
          <div class="battle-opponent-area">
            <div class="opponent-info">
              <div id="ai-name" class="opponent-name">AI 对手</div>
              <div id="ai-chips" class="opponent-chips">1000</div>
              <div id="ai-boss-details" style="font-size: 9px; color: var(--text-secondary); margin-top: 3px;"></div>
            </div>
            <div class="opponent-tower">
              <div id="ai-tower-fill" class="opponent-tower-fill" style="height: 100%;"></div>
            </div>
            <div id="opponent-hand" class="opponent-hand">
              <!-- Opponent tiles (hidden backs) -->
            </div>
          </div>

          <!-- Center Area -->
          <div class="battle-center-area">
            <!-- AI Discard Area (Top) -->
            <div id="ai-discard-area" class="battle-discard-area ai-side"></div>
            <!-- Player Discard Area (Bottom) -->
            <div id="player-discard-area" class="battle-discard-area player-side"></div>
          </div>

          <!-- Player Area -->
          <div class="battle-player-area">
            <div class="player-info">
              <div class="player-name">玩家 (你)</div>
              <div id="player-chips-val" class="player-chips">1000</div>
            </div>
            <div class="player-tower">
              <div id="player-tower-fill" class="player-tower-fill" style="height: 100%;"></div>
            </div>
            <div id="player-hand" class="player-hand-container">
              <!-- Player tiles -->
            </div>
          </div>
        </div>

        <!-- Bottom: Slots and Actions -->
        <div class="battle-bottom-area">
          <div class="inventory-slots">
            <div class="slots-group" id="joker-slots-group">
              <!-- Joker Slots -->
            </div>
            <div class="slots-group" id="card-slots-group">
              <!-- Card Slots -->
            </div>
          </div>
          <div id="actions-bar" class="actions-bar">
            <!-- Action buttons -->
          </div>
        </div>
      </div>

      <!-- VIEW 4: Upgrades Screen -->
      <div id="view-upgrades" class="game-view menu-view" style="display: none; padding: 20px;">
        <h2 class="neon-glow" style="margin-bottom: 10px;">局外永久养成</h2>
        <div style="font-size: 13px; color: var(--text-secondary); margin-bottom: 20px;">
          当前拥有金币: 🪙 <span id="upgrade-gold-val" style="color: var(--accent-color); font-weight: 800;">0</span>
        </div>

        <div id="upgrades-list" style="display: flex; flex-direction: column; gap: 15px; width: 100%; overflow-y: auto; max-height: 500px; padding-right: 5px;">
          <!-- Upgrade items injected here -->
        </div>

        <button id="btn-upgrades-back" class="btn btn-primary" style="margin-top: 20px; width: 100%; max-width: 260px;">返回主菜单</button>
      </div>

      <!-- VIEW 5: Character Codex -->
      <div id="view-characters" class="game-view menu-view" style="display: none; padding: 20px;">
        <h2 class="neon-glow" style="margin-bottom: 5px;">🎭 角色图鉴</h2>
        <div style="font-size: 13px; color: var(--text-secondary); margin-bottom: 20px;">
          当前金币: 🪙 <span id="char-gold-val" style="color: var(--accent-color); font-weight: 800;">0</span>
          <br/>出战角色: <span id="char-current-val" style="color: var(--accent-color); font-weight: 800;">无</span>
        </div>
        <div id="character-list" style="display: flex; flex-direction: column; gap: 15px; width: 100%; overflow-y: auto; max-height: 500px; padding-right: 5px;">
          <!-- Character cards injected here -->
        </div>
        <button id="btn-characters-back" class="btn btn-primary" style="margin-top: 20px; width: 100%; max-width: 260px;">返回主菜单</button>
      </div>

      <!-- VIEW 6: Help Center -->
      <div id="view-help" class="game-view menu-view" style="display: none; padding: 20px;">
        <h2 class="neon-glow" style="margin-bottom: 10px;">📖 帮助中心</h2>
        <div id="help-content-container" style="text-align: left; font-size: 13px; color: var(--text-primary); line-height: 1.8; max-height: 380px; overflow-y: auto; padding: 15px; background: rgba(0,0,0,0.4); border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); width: 100%; box-sizing: border-box; text-shadow: none;">
          <!-- Content dynamically rendered -->
        </div>
        <button id="btn-help-back" class="btn btn-primary" style="margin-top: 20px; width: 100%; max-width: 260px;">返回</button>
      </div>

      <!-- POPUP OVERLAY (For Shop, Events, Settlements, Starting Swaps, Game Over) -->
      <div id="popup-overlay" class="popup-overlay" style="display: none;">
        <div id="popup-content" class="popup-content glass-panel">
          <!-- Inject popup details -->
        </div>
      </div>

    </div>
    
  </body>
</html>
