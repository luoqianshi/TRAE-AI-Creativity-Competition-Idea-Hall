<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI拍照指导助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            padding: 40px 0;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .camera-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .step-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .step-title {
            font-size: 1.5em;
            color: #667eea;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .step-number {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .scene-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .scene-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .scene-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }

        .scene-card.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea15, #764ba215);
        }

        .scene-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .scene-name {
            font-weight: 600;
            color: #495057;
        }

        .subject-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .subject-btn {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 25px;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
        }

        .subject-btn:hover {
            border-color: #667eea;
            background: #667eea10;
        }

        .subject-btn.selected {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: #667eea;
        }

        .generate-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-size: 1.2em;
            cursor: pointer;
            display: block;
            margin: 30px auto;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.5);
        }

        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .result-section {
            display: none;
        }

        .result-section.active {
            display: block;
        }

        .advice-card {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 5px solid #667eea;
        }

        .advice-title {
            font-size: 1.2em;
            color: #667eea;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .advice-content {
            line-height: 1.8;
            color: #495057;
        }

        .advice-content ul {
            list-style: none;
            padding-left: 0;
        }

        .advice-content li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
        }

        .advice-content li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #28a745;
            font-weight: bold;
        }

        .composition-preview {
            background: white;
            border: 2px dashed #dee2e6;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin: 20px 0;
        }

        .grid-demo {
            display: inline-grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(3, 80px);
            gap: 2px;
            background: #333;
            padding: 2px;
        }

        .grid-cell {
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            color: #666;
        }

        .grid-cell.highlight {
            background: #667eea30;
            border: 2px solid #667eea;
        }

        .pose-demo {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 15px;
        }

        .pose-item {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 10px;
            width: 120px;
        }

        .pose-emoji {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .pose-name {
            font-size: 0.9em;
            color: #495057;
        }

        .tips-box {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }

        .tips-box strong {
            color: #856404;
        }

        .reset-btn {
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 10px 30px;
            cursor: pointer;
            display: block;
            margin: 20px auto;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background: #5a6268;
        }

        .hidden {
            display: none !important;
        }

        .progress-bar {
            background: #e9ecef;
            border-radius: 10px;
            height: 8px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .scene-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .step-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="camera-icon">📸</div>
            <h1>AI拍照指导助手</h1>
            <p>让每一张照片都成为大片</p>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressBar" style="width: 33%"></div>
        </div>

        <!-- 步骤1：选择场景 -->

            <div class="scene-grid">
                <div class="scene-card" data-scene="portrait">
                    <div class="scene-icon">👤</div>
                    <div class="scene-name">人像摄影</div>
                </div>
                <div class="scene-card" data-scene="landscape">
                    <div class="scene-icon">🏔️</div>

                </div>
                <div class="scene-card" data-scene="food">
                    <div class="scene-icon">🍜</div>
                    <div class="scene-name">美食摄影</div>
                </div>
                <div class="scene-card" data-scene="pet">
                    <div class="scene-icon">🐕</div>
                    <div class="scene-name">宠物摄影</div>
                </div>
                <div class="scene-card" data-scene="architecture">
                    <div class="scene-icon">🏛️</div>
                    <div class="scene-name">建筑摄影</div>
                </div>
                <div class="scene-card" data-scene="night">
                    <div class="scene-icon">🌃</div>
                    <div class="scene-name">夜景摄影</div>
                </div>
            </div>
        </div>

        <!-- 步骤2：选择被摄对象 -->
        <div class="step-card hidden" id="step2">
            <div class="step-title">
                <div class="step-number">2</div>
                <span>选择被摄对象</span>
            </div>
            <p style="color: #6c757d; margin-bottom: 15px;">请选择您要拍摄的对象类型：</p>
            <div class="subject-options" id="subjectOptions">
                <!-- 动态生成 -->
            </div>
        </div>

        <!-- 步骤3：环境描述 -->
        <div class="step-card hidden" id="step3">
            <div class="step-title">
                <div class="step-number">3</div>
                <span>光线与环境</span>
            </div>
            <p style="color: #6c757d; margin-bottom: 15px;">请选择当前的光线条件：</p>
            <div class="subject-options">
                <button class="subject-btn" data-light="bright">☀️ 明亮自然光</button>
                <button class="subject-btn" data-light="soft">🌤️ 柔和散射光</button>
                <button class="subject-btn" data-light="indoor">💡 室内灯光</button>
                <button class="subject-btn" data-light="golden">🌅 黄金时刻</button>
                <button class="subject-btn" data-light="low">🌙 弱光环境</button>
            </div>
        </div>

        <button class="generate-btn hidden" id="generateBtn" onclick="generateAdvice()">
            ✨ 生成拍照建议
        </button>

        <!-- 结果展示 -->
        <div class="result-section" id="resultSection">
            <div class="step-card">
                <div class="step-title">
                    <span>📋</span>
                    <span>您的专属拍照方案</span>
                </div>
                
                <div class="advice-card">
                    <div class="advice-title">
                        <span>🎯</span>
                        <span>拍摄位置建议</span>
                    </div>
                    <div class="advice-content" id="positionAdvice">
                        <!-- 动态生成 -->
                    </div>
                </div>

                <div class="advice-card">
                    <div class="advice-title">
                        <span>📐</span>
                        <span>构图指导</span>
                    </div>
                    <div class="composition-preview" id="compositionPreview">
                        <!-- 动态生成 -->
                    </div>
                    <div class="advice-content" id="compositionAdvice">
                        <!-- 动态生成 -->
                    </div>
                </div>

                <div class="advice-card">
                    <div class="advice-title">
                        <span>🎭</span>
                        <span>动作与姿势建议</span>
                    </div>
                    <div class="pose-demo" id="poseDemo">
                        <!-- 动态生成 -->
                    </div>
                    <div class="advice-content" id="poseAdvice">
                        <!-- 动态生成 -->
                    </div>
                </div>

                <div class="advice-card">
                    <div class="advice-title">
                        <span>⚙️</span>
                        <span>相机参数建议</span>
                    </div>
                    <div class="advice-content" id="cameraAdvice">
                        <!-- 动态生成 -->
                    </div>
                </div>

                <div class="tips-box">
                    <strong>💡 专业小贴士：</strong>
                    <span id="proTip"></span>
                </div>

                <button class="reset-btn" onclick="resetAll()">重新选择</button>
            </div>
        </div>
    </div>

                camera: {
                    aperture: 'f/8 - f/16（星芒效果）',
                    shutter: '5s-30s（或B门更长）',
                    iso: '100-1600（控制噪点）',
                    focus: '手动对焦无穷远'
                },
                tips: '夜景摄影三要素：三脚架、手动模式、RAW格式！提前到达熟悉环境。'
            }
        };

        // 光线建议
        const lightAdvice = {
            bright: '光线充足，注意避免强烈阴影，可使用反光板补光',
            soft: '最理想的光线条件，适合大多数拍摄，色彩还原好',
            indoor: '注意白平衡设置，可利用窗户自然光，避免混合光源',
            golden: '一天中最美的光线，色温暖，适合人像和风景',
            low: '需要提高ISO或使用三脚架，注意对焦准确性'
        };

        let selectedScene = null;
        let selectedSubject = null;
        let selectedLight = null;

        // 场景选择
        document.querySelectorAll('.scene-card').forEach(card => {
            card.addEventListener('click', function() {
                document.querySelectorAll('.scene-card').forEach(c => c.classList.remove('selected'));
                this.classList.add('selected');
                selectedScene = this.dataset.scene;
                
                // 显示步骤2
                document.getElementById('step2').classList.remove('hidden');
                document.getElementById('progressBar').style.width = '66%';
                
                // 生成被摄对象选项
                const subjectOptions = document.getElementById('subjectOptions');
                subjectOptions.innerHTML = '';
                sceneConfig[selectedScene].subjects.forEach(subject => {
                    const btn = document.createElement('button');
                    btn.className = 'subject-btn';
                    btn.textContent = subject;
                    btn.onclick = function() {
                        document.querySelectorAll('#subjectOptions .subject-btn').forEach(b => b.classList.remove('selected'));
                        this.classList.add('selected');
                        selectedSubject = this.textContent;
                        
                        // 显示步骤3
                        document.getElementById('step3').classList.remove('hidden');
                        document.getElementById('progressBar').style.width = '90%';
                    };
                    subjectOptions.appendChild(btn);
                });
                
                // 重置后续选择
                selectedSubject = null;
                selectedLight = null;
                document.getElementById('step3').classList.add('hidden');
                document.getElementById('generateBtn').classList.add('hidden');
                document.getElementById('resultSection').classList.remove('active');
            });
        });

        // 光线选择
        document.querySelectorAll('#step3 .subject-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('#step3 .subject-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                selectedLight = this.dataset.light;
                document.getElementById('generateBtn').classList.remove('hidden');
                document.getElementById('progressBar').style.width = '100%';
            });
        });

        // 生成建议
        function generateAdvice() {
            if (!selectedScene || !selectedSubject || !selectedLight) {
                alert('请完成所有选择！');
                return;
            }

            const config = sceneConfig[selectedScene];
            
            // 位置建议
            const positionAdvice = document.getElementById('positionAdvice');
            positionAdvice.innerHTML = '<ul>' + config.positions.map(p => `<li>${p}</li>`).join('') + '</ul>';
            
            // 构图指导
            const composition = config.compositions[Math.floor(Math.random() * config.compositions.length)];
            const compositionPreview = document.getElementById('compositionPreview');
            let gridHTML = '<div class="grid-demo">';
            for (let i = 0; i < 9; i++) {
                const isHighlight = composition.grid.includes(i);
                gridHTML += `<div class="grid-cell ${isHighlight ? 'highlight' : ''}">${isHighlight ? '★' : ''}</div>`;
            }
            gridHTML += '</div>';
            gridHTML += `<p style="margin-top: 15px; color: #667eea; font-weight: 600;">${composition.name}</p>`;
            gridHTML += `<p style="color: #6c757d; margin-top: 5px;">${composition.desc}</p>`;
            compositionPreview.innerHTML = gridHTML;
            
            const compositionAdvice = document.getElementById('compositionAdvice');
            compositionAdvice.innerHTML = `<p>推荐使用<strong>${composition.name}</strong>，将主体放置在标记位置。同时注意：</p>
                <ul>
                    <li>保持画面简洁，去除干扰元素</li>
                    <li>注意留白，给主体呼吸空间</li>
                    <li>利用前景增加画面深度</li>
                </ul>`;
            
            // 姿势建议
            const poseDemo = document.getElementById('poseDemo');
            poseDemo.innerHTML = config.poses.map(pose => `
                <div class="pose-item">
                    <div class="pose-emoji">${pose.emoji}</div>
                    <div class="pose-name">${pose.name}</div>
                </div>
            `).join('');
            
            const poseAdvice = document.getElementById('poseAdvice');
            poseAdvice.innerHTML = '<ul>' + config.poses.map(p => `<li><strong>${p.name}：</strong>${p.desc}</li>`).join('') + '</ul>';
            
            // 相机参数
            const cameraAdvice = document.getElementById('cameraAdvice');
            cameraAdvice.innerHTML = `
                <ul>
                    <li><strong>光圈：</strong>${config.camera.aperture}</li>
                    <li><strong>快门：</strong>${config.camera.shutter}</li>
                    <li><strong>ISO：</strong>${config.camera.iso}</li>
                    <li><strong>对焦：</strong>${config.camera.focus}</li>
                </ul>
                <div class="tips-box" style="margin-top: 15px;">
                    <strong>光线提示：</strong>${lightAdvice[selectedLight]}
                </div>
            `;
            
            // 专业提示
            document.getElementById('proTip').textContent = config.tips;
            
            // 显示结果
            document.getElementById('resultSection').classList.add('active');
            document.getElementById('generateBtn').classList.add('hidden');
            
            // 滚动到结果
            setTimeout(() => {
                document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
            }, 100);
        }

        // 重置
        function resetAll() {
            selectedScene = null;
            selectedSubject = null;
            selectedLight = null;
            
            document.querySelectorAll('.scene-card').forEach(c => c.classList.remove('selected'));
            document.querySelectorAll('.subject-btn').forEach(b => b.classList.remove('selected'));
            
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.add('hidden');
            document.getElementById('generateBtn').classList.add('hidden');
            document.getElementById('resultSection').classList.remove('active');
            document.getElementById('progressBar').style.width = '33%';
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
