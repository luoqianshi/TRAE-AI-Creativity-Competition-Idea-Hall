<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智绘精准手绘工程示意系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #1a2332;
      --bg-secondary: #232f42;
      --bg-tertiary: #2a3a52;
      --accent-blue: #3b82f6;
      --accent-green: #22c55e;
      --accent-cyan: #06b6d4;
      --accent-orange: #f59e0b;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-color: #334155;
      --shadow-glow: 0 0 20px rgba(59, 130, 246, 0.3);
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
      height: 100vh;
    }

    .app-container {
      display: grid;
      grid-template-columns: 64px 1fr 280px;
      grid-template-rows: 56px 1fr;
      height: 100vh;
      gap: 1px;
      background: var(--border-color);
    }

    /* Header */
    .header {
      grid-column: 1 / -1;
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 24px;
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      color: var(--accent-blue);
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 20px;
      height: 20px;
      stroke: white;
    }

    .header-tools {
      display: flex;
      gap: 4px;
      flex: 1;
    }

    .header-btn {
      padding: 8px 12px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .header-btn:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .header-btn.active {
      background: var(--accent-blue);
      color: white;
    }

    .zoom-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .zoom-value {
      min-width: 48px;
      text-align: center;
    }

    /* Toolbar */
    .toolbar {
      background: var(--bg-secondary);
      display: flex;
      flex-direction: column;
      padding: 12px 8px;
      gap: 4px;
      border-right: 1px solid var(--border-color);
    }

    .tool-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .tool-group-label {
      font-size: 9px;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 8px 4px 4px;
      letter-spacing: 0.5px;
    }

    .tool-btn {
      width: 48px;
      height: 48px;
      background: transparent;
      border: 2px solid transparent;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      color: var(--text-secondary);
    }

    .tool-btn:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .tool-btn.active {
      background: var(--accent-blue);
      color: white;
      border-color: var(--accent-blue);
      box-shadow: var(--shadow-glow);
    }

    .tool-btn svg {
      width: 22px;
      height: 22px;
    }

    .tool-divider {
      height: 1px;
      background: var(--border-color);
      margin: 8px 4px;
    }

    /* Canvas Area */
    .canvas-container {
      background: var(--bg-primary);
      position: relative;
      overflow: hidden;
    }

    .canvas-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #mainCanvas {
      position: absolute;
      top: 0;
      left: 0;
      cursor: crosshair;
    }

    #gridCanvas {
      pointer-events: none;
    }

    .canvas-overlay {
      position: absolute;
      bottom: 16px;
      left: 16px;
      display: flex;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
    }

    .canvas-info {
      background: rgba(26, 35, 50, 0.9);
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
    }

    /* Right Panel */
    .right-panel {
      background: var(--bg-secondary);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .panel-section {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .panel-title {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .property-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .property-label {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .property-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-primary);
      background: var(--bg-tertiary);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      min-width: 48px;
      text-align: center;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      flex: 1;
      height: 4px;
      -webkit-appearance: none;
      background: var(--bg-tertiary);
      border-radius: 2px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: var(--accent-blue);
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .color-picker-container {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s ease;
    }

    .color-swatch:hover {
      transform: scale(1.1);
    }

    .color-swatch.active {
      border-color: white;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
    }

    .color-custom {
      position: relative;
      overflow: hidden;
    }

    .color-custom input[type="color"] {
      position: absolute;
      width: 150%;
      height: 150%;
      top: -25%;
      left: -25%;
      cursor: pointer;
      border: none;
    }

    /* Action Buttons */
    .action-btn {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-radius: var(--radius-md);
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
    }

    .action-btn:hover {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    .action-btn.primary {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    .action-btn.primary:hover {
      background: #2563eb;
      box-shadow: var(--shadow-glow);
    }

    .action-btn svg {
      width: 18px;
      height: 18px;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .action-grid .action-btn {
      padding: 10px 12px;
      font-size: 11px;
    }

    /* Export Section */
    .export-options {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .export-option {
      flex: 1;
      padding: 8px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 11px;
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all 0.15s ease;
      text-align: center;
      font-family: inherit;
    }

    .export-option:hover {
      border-color: var(--accent-blue);
      color: var(--text-primary);
    }

    .export-option.active {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: white;
    }

    /* Perspective Controls */
    .perspective-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .perspective-btn {
      padding: 8px 4px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 10px;
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all 0.15s ease;
      text-align: center;
      font-family: inherit;
    }

    .perspective-btn:hover {
      border-color: var(--accent-cyan);
      color: var(--text-primary);
    }

    .perspective-btn.active {
      background: var(--accent-cyan);
      border-color: var(--accent-cyan);
      color: white;
    }

    /* Help Tooltip */
    .help-tip {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 12px;
      margin-top: 12px;
    }

    .help-tip-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-green);
      margin-bottom: 6px;
    }

    .help-tip-content {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Animations */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .recording-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-orange);
      font-size: 12px;
    }

    .recording-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-orange);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    /* Coordinate Display */
    .coord-display {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(26, 35, 50, 0.95);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--accent-green);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
            <path d="M2 2l7.586 7.586"></path>
            <circle cx="11" cy="11" r="2"></circle>
          </svg>
        </div>
        <span>智绘工程</span>
      </div>

      <div class="header-tools">
        <button class="header-btn active" data-action="draw">绘图</button>
        <button class="header-btn" data-action="preview">预览</button>
        <button class="header-btn" data-action="guide">辅助线</button>
      </div>

      <div class="zoom-control">
        <button class="header-btn" id="zoomOut">−</button>
        <span class="zoom-value" id="zoomValue">100%</span>
        <button class="header-btn" id="zoomIn">+</button>
      </div>

      <button class="header-btn" id="undoBtn" title="撤销">↩</button>
      <button class="header-btn" id="redoBtn" title="重做">↪</button>
      <button class="header-btn" id="clearBtn">清空</button>
    </header>

    <!-- Toolbar -->
    <aside class="toolbar">
      <div class="tool-group">
        <span class="tool-group-label">绘制</span>
        <button class="tool-btn active" data-tool="brush" title="画笔">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
          </svg>
        </button>
        <button class="tool-btn" data-tool="eraser" title="橡皮擦">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 20H7L3 16c-.8-.8-.8-2 0-2.8L13.4 3a2 2 0 0 1 2.8 0L21 7.8c.8.8.8 2 0 2.8L11 20"></path>
            <path d="M6.5 13.5L12 8"></path>
          </svg>
        </button>
      </div>

      <div class="tool-divider"></div>

      <div class="tool-group">
        <span class="tool-group-label">形状</span>
        <button class="tool-btn" data-tool="line" title="直线">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="19" x2="19" y2="5"></line>
          </svg>
        </button>
        <button class="tool-btn" data-tool="rectangle" title="矩形">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          </svg>
        </button>
        <button class="tool-btn" data-tool="circle" title="圆形">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
          </svg>
        </button>
        <button class="tool-btn" data-tool="polygon" title="多边形">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12,2 22,8.5 22,15.5 12,22 2,15.5 2,8.5"></polygon>
          </svg>
        </button>
      </div>

      <div class="tool-divider"></div>

      <div class="tool-group">
        <span class="tool-group-label">3D</span>
        <button class="tool-btn" data-tool="cube" title="立方体">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
        </button>
        <button class="tool-btn" data-tool="cylinder" title="圆柱">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <ellipse cx="12" cy="5" rx="8" ry="3"></ellipse>
            <path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"></path>
          </svg>
        </button>
      </div>
    </aside>

    <!-- Canvas Area -->
    <main class="canvas-container">
      <div class="canvas-wrapper">
        <canvas id="gridCanvas"></canvas>
        <canvas id="mainCanvas"></canvas>
      </div>
      <div class="coord-display" id="coordDisplay">X: 0 Y: 0</div>
      <div class="canvas-overlay">
        <div class="canvas-info" id="canvasSize">画布: 1920 × 1080</div>
        <div class="canvas-info" id="pathCount">路径: 0</div>
      </div>
    </main>

    <!-- Right Panel -->
    <aside class="right-panel">
      <!-- Drawing Properties -->
      <div class="panel-section">
        <h3 class="panel-title">绘制属性</h3>
        
        <div class="property-row">
          <span class="property-label">线条粗细</span>
          <div class="slider-container">
            <input type="range" id="strokeWidth" min="1" max="20" value="3">
            <span class="property-value" id="strokeWidthValue">3</span>
          </div>
        </div>

        <div class="property-row">
          <span class="property-label">不透明度</span>
          <div class="slider-container">
            <input type="range" id="opacity" min="10" max="100" value="100">
            <span class="property-value" id="opacityValue">100%</span>
          </div>
        </div>

        <div class="property-row">
          <span class="property-label">线条颜色</span>
        </div>
        <div class="color-picker-container">
          <div class="color-swatch active" style="background: #f1f5f9" data-color="#f1f5f9"></div>
          <div class="color-swatch" style="background: #3b82f6" data-color="#3b82f6"></div>
          <div class="color-swatch" style="background: #22c55e" data-color="#22c55e"></div>
          <div class="color-swatch" style="background: #f59e0b" data-color="#f59e0b"></div>
          <div class="color-swatch" style="background: #ef4444" data-color="#ef4444"></div>
          <div class="color-swatch" style="background: #a855f7" data-color="#a855f7"></div>
          <div class="color-swatch color-custom">
            <input type="color" id="customColor" value="#3b82f6">
          </div>
        </div>

        <div class="property-row" style="margin-top: 12px;">
          <span class="property-label">填充颜色</span>
        </div>
        <div class="color-picker-container">
          <div class="color-swatch active" style="background: transparent; border: 1px dashed #64748b" data-fill="transparent"></div>
          <div class="color-swatch" style="background: rgba(59, 130, 246, 0.2)" data-fill="rgba(59, 130, 246, 0.2)"></div>
          <div class="color-swatch" style="background: rgba(34, 197, 94, 0.2)" data-fill="rgba(34, 197, 94, 0.2)"></div>
          <div class="color-swatch" style="background: rgba(245, 158, 11, 0.2)" data-fill="rgba(245, 158, 11, 0.2)"></div>
        </div>
      </div>

      <!-- Correction Tools -->
      <div class="panel-section">
        <h3 class="panel-title">智能规整</h3>
        <div class="action-grid">
          <button class="action-btn" id="smoothBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12c0 0 4-8 9-8s9 8 9 8"></path>
            </svg>
            平滑
          </button>
          <button class="action-btn" id="straightenBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="4" y1="20" x2="20" y2="4"></line>
              <circle cx="4" cy="20" r="2"></circle>
              <circle cx="20" cy="4" r="2"></circle>
            </svg>
            校正角度
          </button>
          <button class="action-btn" id="shapeBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            </svg>
            规整图形
          </button>
          <button class="action-btn" id="perspectiveBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
              <path d="M2 17l10 5 10-5"></path>
              <path d="M2 12l10 5 10-5"></path>
            </svg>
            透视校正
          </button>
        </div>
      </div>

      <!-- 3D Perspective -->
      <div class="panel-section">
        <h3 class="panel-title">3D 透视模式</h3>
        <div class="perspective-grid">
          <button class="perspective-btn" data-perspective="isometric">等轴测</button>
          <button class="perspective-btn active" data-perspective="one-point">一点透视</button>
          <button class="perspective-btn" data-perspective="two-point">两点透视</button>
        </div>
        <div class="property-row">
          <span class="property-label">X轴</span>
          <span class="property-value" id="xAxisValue">0°</span>
        </div>
        <div class="slider-container" style="margin-bottom: 8px;">
          <input type="range" id="xAxis" min="-90" max="90" value="0">
        </div>
        <div class="property-row">
          <span class="property-label">Y轴</span>
          <span class="property-value" id="yAxisValue">0°</span>
        </div>
        <div class="slider-container">
          <input type="range" id="yAxis" min="-90" max="90" value="0">
        </div>
      </div>

      <!-- Export -->
      <div class="panel-section">
        <h3 class="panel-title">导出图纸</h3>
        <div class="export-options">
          <button class="export-option active" data-format="png">PNG</button>
          <button class="export-option" data-format="svg">SVG</button>
        </div>
        <button class="action-btn primary" id="exportBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          导出图片
        </button>
      </div>

      <!-- Help -->
      <div class="help-tip">
        <div class="help-tip-title">使用提示</div>
        <div class="help-tip-content">
          • 绘制后点击"智能规整"自动优化<br>
          • 3D工具可绘制立方体和圆柱<br>
          • 支持触摸屏和压感笔输入<br>
          • 快捷键: Ctrl+Z 撤销, Ctrl+Y 重做
        </div>
      </div>
    </aside>
  </div>

  <script>
    // ============================================
    // 智绘精准手绘工程示意系统 - 核心绘图引擎
    // ============================================

    class DrawingApp {
      constructor() {
        this.canvas = document.getElementById('mainCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.gridCanvas = document.getElementById('gridCanvas');
        this.gridCtx = this.gridCanvas.getContext('2d');

        this.paths = [];
        this.currentPath = null;
        this.history = [];
        this.historyIndex = -1;

        this.currentTool = 'brush';
        this.strokeColor = '#f1f5f9';
        this.strokeWidth = 3;
        this.opacity = 1;
        this.fillColor = 'transparent';

        this.perspective = 'one-point';
        this.xAxisRotation = 0;
        this.yAxisRotation = 0;

        this.zoom = 1;
        this.panX = 0;
        this.panY = 0;

        this.isDrawing = false;
        this.startX = 0;
        this.startY = 0;

        this.standardAngles = [0, 45, 90, 135, 180, -45, -90, -135];

        this.init();
      }

      init() {
        this.setupCanvas();
        this.bindEvents();
        this.drawGrid();
        this.render();
      }

      setupCanvas() {
        const container = this.canvas.parentElement;
        const rect = container.getBoundingClientRect();
        
        this.canvas.width = rect.width * window.devicePixelRatio;
        this.canvas.height = rect.height * window.devicePixelRatio;
        this.canvas.style.width = rect.width + 'px';
        this.canvas.style.height = rect.height + 'px';
        this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

        this.gridCanvas.width = rect.width * window.devicePixelRatio;
        this.gridCanvas.height = rect.height * window.devicePixelRatio;
        this.gridCanvas.style.width = rect.width + 'px';
        this.gridCanvas.style.height = rect.height + 'px';
        this.gridCtx.scale(window.devicePixelRatio, window.devicePixelRatio);

        document.getElementById('canvasSize').textContent = 
          `画布: ${Math.round(rect.width)} × ${Math.round(rect.height)}`;
      }

      bindEvents() {
        // Canvas drawing events
        this.canvas.addEventListener('mousedown', (e) => this.onMouseDown(e));
        this.canvas.addEventListener('mousemove', (e) => this.onMouseMove(e));
        this.canvas.addEventListener('mouseup', (e) => this.onMouseUp(e));
        this.canvas.addEventListener('mouseleave', (e) => this.onMouseUp(e));

        // Touch support
        this.canvas.addEventListener('touchstart', (e) => this.onTouchStart(e));
        this.canvas.addEventListener('touchmove', (e) => this.onTouchMove(e));
        this.canvas.addEventListener('touchend', (e) => this.onTouchEnd(e));

        // Tool buttons
        document.querySelectorAll('.tool-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.currentTool = btn.dataset.tool;
          });
        });

        // Property controls
        document.getElementById('strokeWidth').addEventListener('input', (e) => {
          this.strokeWidth = parseInt(e.target.value);
          document.getElementById('strokeWidthValue').textContent = this.strokeWidth;
        });

        document.getElementById('opacity').addEventListener('input', (e) => {
          this.opacity = parseInt(e.target.value) / 100;
          document.getElementById('opacityValue').textContent = e.target.value + '%';
        });

        // Color swatches
        document.querySelectorAll('.color-swatch[data-color]').forEach(swatch => {
          swatch.addEventListener('click', () => {
            document.querySelectorAll('.color-swatch[data-color]').forEach(s => s.classList.remove('active'));
            swatch.classList.add('active');
            this.strokeColor = swatch.dataset.color;
          });
        });

        document.getElementById('customColor').addEventListener('input', (e) => {
          document.querySelectorAll('.color-swatch[data-color]').forEach(s => s.classList.remove('active'));
          this.strokeColor = e.target.value;
        });

        // Fill colors
        document.querySelectorAll('.color-swatch[data-fill]').forEach(swatch => {
          swatch.addEventListener('click', () => {
            document.querySelectorAll('.color-swatch[data-fill]').forEach(s => s.classList.remove('active'));
            swatch.classList.add('active');
            this.fillColor = swatch.dataset.fill;
          });
        });

        // Perspective controls
        document.querySelectorAll('.perspective-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.perspective-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.perspective = btn.dataset.perspective;
            this.render();
          });
        });

        document.getElementById('xAxis').addEventListener('input', (e) => {
          this.xAxisRotation = parseInt(e.target.value);
          document.getElementById('xAxisValue').textContent = this.xAxisRotation + '°';
          this.render();
        });

        document.getElementById('yAxis').addEventListener('input', (e) => {
          this.yAxisRotation = parseInt(e.target.value);
          document.getElementById('yAxisValue').textContent = this.yAxisRotation + '°';
          this.render();
        });

        // Action buttons
        document.getElementById('undoBtn').addEventListener('click', () => this.undo());
        document.getElementById('redoBtn').addEventListener('click', () => this.redo());
        document.getElementById('clearBtn').addEventListener('click', () => this.clearCanvas());

        document.getElementById('smoothBtn').addEventListener('click', () => this.smoothPaths());
        document.getElementById('straightenBtn').addEventListener('click', () => this.straightenLines());
        document.getElementById('shapeBtn').addEventListener('click', () => this.recognizeShapes());
        document.getElementById('perspectiveBtn').addEventListener('click', () => this.correctPerspective());

        // Zoom controls
        document.getElementById('zoomIn').addEventListener('click', () => this.setZoom(this.zoom + 0.1));
        document.getElementById('zoomOut').addEventListener('click', () => this.setZoom(this.zoom - 0.1));

        // Export
        document.querySelectorAll('.export-option').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.export-option').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
          });
        });

        document.getElementById('exportBtn').addEventListener('click', () => this.exportImage());

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
          if (e.ctrlKey && e.key === 'z') {
            e.preventDefault();
            this.undo();
          } else if (e.ctrlKey && e.key === 'y') {
            e.preventDefault();
            this.redo();
          }
        });

        // Window resize
        window.addEventListener('resize', () => {
          this.setupCanvas();
          this.drawGrid();
          this.render();
        });
      }

      getMousePos(e) {
        const rect = this.canvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) / this.zoom - this.panX,
          y: (e.clientY - rect.top) / this.zoom - this.panY
        };
      }

      onMouseDown(e) {
        const pos = this.getMousePos(e);
        this.isDrawing = true;
        this.startX = pos.x;
        this.startY = pos.y;

        if (this.currentTool === 'brush' || this.currentTool === 'eraser') {
          this.currentPath = {
            id: Date.now().toString(),
            points: [{ x: pos.x, y: pos.y }],
            strokeColor: this.currentTool === 'eraser' ? '#1a2332' : this.strokeColor,
            strokeWidth: this.currentTool === 'eraser' ? 20 : this.strokeWidth,
            opacity: this.opacity,
            fillColor: 'transparent',
            tool: this.currentTool
          };
        }
      }

      onMouseMove(e) {
        const pos = this.getMousePos(e);
        
        // Update coordinate display
        document.getElementById('coordDisplay').textContent = 
          `X: ${Math.round(pos.x)} Y: ${Math.round(pos.y)}`;

        if (!this.isDrawing) return;

        if (this.currentTool === 'brush' || this.currentTool === 'eraser') {
          this.currentPath.points.push({ x: pos.x, y: pos.y });
          this.render();
        } else {
          // Shape tools - preview
          this.render();
          this.drawShapePreview(pos.x, pos.y);
        }
      }

      onMouseUp(e) {
        if (!this.isDrawing) return;
        this.isDrawing = false;

        const pos = this.getMousePos(e);

        if (this.currentTool === 'brush' || this.currentTool === 'eraser') {
          if (this.currentPath && this.currentPath.points.length > 1) {
            this.paths.push(this.currentPath);
            this.saveHistory();
            this.currentPath = null;
          }
        } else {
          // Create shape
          this.createShape(pos.x, pos.y);
        }

        this.updatePathCount();
        this.render();
      }

      // Touch handlers
      onTouchStart(e) {
        e.preventDefault();
        const touch = e.touches[0];
        this.onMouseDown({ clientX: touch.clientX, clientY: touch.clientY });
      }

      onTouchMove(e) {
        e.preventDefault();
        const touch = e.touches[0];
        this.onMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
      }

      onTouchEnd(e) {
        e.preventDefault();
        this.onMouseUp({ clientX: 0, clientY: 0 });
      }

      drawShapePreview(endX, endY) {
        const ctx = this.ctx;
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.strokeStyle = this.strokeColor;
        ctx.lineWidth = this.strokeWidth;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        const width = endX - this.startX;
        const height = endY - this.startY;

        switch (this.currentTool) {
          case 'line':
            ctx.beginPath();
            ctx.moveTo(this.startX, this.startY);
            ctx.lineTo(endX, endY);
            ctx.stroke();
            break;

          case 'rectangle':
            ctx.strokeRect(this.startX, this.startY, width, height);
            break;

          case 'circle':
            const radius = Math.sqrt(width * width + height * height) / 2;
            ctx.beginPath();
            ctx.arc(this.startX + width/2, this.startY + height/2, radius, 0, Math.PI * 2);
            ctx.stroke();
            break;

          case 'polygon':
            this.drawPolygon(ctx, this.startX, this.startY, endX, endY);
            break;

          case 'cube':
            this.drawCube(ctx, this.startX, this.startY, endX, endY);
            break;

          case 'cylinder':
            this.drawCylinder(ctx, this.startX, this.startY, endX, endY);
            break;
        }

        ctx.restore();
      }

      createShape(endX, endY) {
        const width = endX - this.startX;
        const height = endY - this.startY;

        let shape = {
          id: Date.now().toString(),
          tool: this.currentTool,
          strokeColor: this.strokeColor,
          strokeWidth: this.strokeWidth,
          opacity: this.opacity,
          fillColor: this.fillColor,
          startX: this.startX,
          startY: this.startY,
          endX: endX,
          endY: endY
        };

        this.paths.push(shape);
        this.saveHistory();
      }

      drawPolygon(ctx, x1, y1, x2, y2) {
        const cx = (x1 + x2) / 2;
        const cy = (y1 + y2) / 2;
        const rx = Math.abs(x2 - x1) / 2;
        const ry = Math.abs(y2 - y1) / 2;
        const sides = 6;

        ctx.beginPath();
        for (let i = 0; i < sides; i++) {
          const angle = (i * 2 * Math.PI / sides) - Math.PI / 2;
          const px = cx + rx * Math.cos(angle);
          const py = cy + ry * Math.sin(angle);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
      }

      drawCube(ctx, x1, y1, x2, y2) {
        const w = x2 - x1;
        const h = y2 - y1;
        const offset = Math.min(w, h) * 0.3;

        ctx.beginPath();
        // Front face
        ctx.rect(x1, y1 + offset, w, h - offset);
        // Top face
        ctx.moveTo(x1, y1 + offset);
        ctx.lineTo(x1 + offset, y1);
        ctx.lineTo(x1 + w + offset, y1);
        ctx.lineTo(x1 + w, y1 + offset);
        // Side face
        ctx.moveTo(x1 + w, y1 + offset);
        ctx.lineTo(x1 + w + offset, y1);
        ctx.lineTo(x1 + w + offset, y1 + h);
        ctx.lineTo(x1 + w, y1 + h + offset);
        ctx.stroke();
      }

      drawCylinder(ctx, x1, y1, x2, y2) {
        const rx = Math.abs(x2 - x1) / 2;
        const ry = rx * 0.3;
        const h = y2 - y1;
        const cx = (x1 + x2) / 2;
        const cy = y1 + ry;

        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(cx - rx, cy);
        ctx.lineTo(cx - rx, cy + h);
        ctx.lineTo(cx + rx, cy + h);
        ctx.lineTo(cx + rx, cy);
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(cx, cy + h, rx, ry, 0, 0, Math.PI);
        ctx.stroke();
      }

      drawGrid() {
        const ctx = this.gridCtx;
        const width = this.gridCanvas.width / window.devicePixelRatio;
        const height = this.gridCanvas.height / window.devicePixelRatio;
        
        ctx.clearRect(0, 0, width, height);
        
        const gridSize = 20;
        ctx.strokeStyle = 'rgba(51, 65, 85, 0.5)';
        ctx.lineWidth = 0.5;

        // Vertical lines
        for (let x = 0; x <= width; x += gridSize) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }

        // Horizontal lines
        for (let y = 0; y <= height; y += gridSize) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }

        // Major grid lines
        ctx.strokeStyle = 'rgba(51, 65, 85, 0.8)';
        ctx.lineWidth = 1;
        const majorSize = gridSize * 5;

        for (let x = 0; x <= width; x += majorSize) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }

        for (let y = 0; y <= height; y += majorSize) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }
      }

      render() {
        const ctx = this.ctx;
        const width = this.canvas.width / window.devicePixelRatio;
        const height = this.canvas.height / window.devicePixelRatio;

        ctx.clearRect(0, 0, width, height);
        ctx.save();
        ctx.translate(this.panX * this.zoom, this.panY * this.zoom);
        ctx.scale(this.zoom, this.zoom);

        // Draw all paths
        for (const path of this.paths) {
          this.drawPath(path);
        }

        // Draw current path
        if (this.currentPath) {
          this.drawPath(this.currentPath);
        }

        ctx.restore();
      }

      drawPath(path) {
        const ctx = this.ctx;
        ctx.save();
        ctx.strokeStyle = path.strokeColor;
        ctx.lineWidth = path.strokeWidth;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.globalAlpha = path.opacity;

        if (path.tool === 'brush' || path.tool === 'eraser') {
          // Freehand path
          if (path.points.length < 2) {
            ctx.beginPath();
            ctx.arc(path.points[0].x, path.points[0].y, path.strokeWidth / 2, 0, Math.PI * 2);
            ctx.fillStyle = path.strokeColor;
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.moveTo(path.points[0].x, path.points[0].y);
            
            for (let i = 1; i < path.points.length - 1; i++) {
              const xc = (path.points[i].x + path.points[i + 1].x) / 2;
              const yc = (path.points[i].y + path.points[i + 1].y) / 2;
              ctx.quadraticCurveTo(path.points[i].x, path.points[i].y, xc, yc);
            }
            
            if (path.points.length > 1) {
              const last = path.points[path.points.length - 1];
              ctx.lineTo(last.x, last.y);
            }
            ctx.stroke();
          }
        } else {
          // Shape
          const x1 = path.startX;
          const y1 = path.startY;
          const x2 = path.endX;
          const y2 = path.endY;

          if (path.fillColor && path.fillColor !== 'transparent') {
            ctx.fillStyle = path.fillColor;
          }

          switch (path.tool) {
            case 'line':
              ctx.beginPath();
              ctx.moveTo(x1, y1);
              ctx.lineTo(x2, y2);
              ctx.stroke();
              break;

            case 'rectangle':
              ctx.beginPath();
              ctx.rect(x1, y1, x2 - x1, y2 - y1);
              if (path.fillColor !== 'transparent') ctx.fill();
              ctx.stroke();
              break;

            case 'circle':
              const radius = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2)) / 2;
              ctx.beginPath();
              ctx.arc(x1 + (x2 - x1) / 2, y1 + (y2 - y1) / 2, radius, 0, Math.PI * 2);
              if (path.fillColor !== 'transparent') ctx.fill();
              ctx.stroke();
              break;

            case 'polygon':
              this.drawPolygon(ctx, x1, y1, x2, y2);
              break;

            case 'cube':
              this.drawCube(ctx, x1, y1, x2, y2);
              break;

            case 'cylinder':
              this.drawCylinder(ctx, x1, y1, x2, y2);
              break;
          }
        }

        ctx.restore();
      }

      // ============================================
      // 规整算法
      // ============================================

      smoothPaths() {
        for (const path of this.paths) {
          if (path.tool === 'brush' && path.points && path.points.length > 3) {
            path.points = this.catmullRomSpline(path.points, 10);
          }
        }
        this.saveHistory();
        this.render();
      }

      catmullRomSpline(points, segments) {
        if (points.length < 4) return points;
        
        const result = [];
        
        for (let i = 0; i < points.length - 1; i++) {
          const p0 = points[Math.max(0, i - 1)];
          const p1 = points[i];
          const p2 = points[Math.min(points.length - 1, i + 1)];
          const p3 = points[Math.min(points.length - 1, i + 2)];

          for (let t = 0; t < segments; t++) {
            const t1 = t / segments;
            const t2 = t1 * t1;
            const t3 = t2 * t1;

            const x = 0.5 * (
              (2 * p1.x) +
              (-p0.x + p2.x) * t1 +
              (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
              (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3
            );

            const y = 0.5 * (
              (2 * p1.y) +
              (-p0.y + p2.y) * t1 +
              (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
              (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3
            );

            result.push({ x, y });
          }
        }
        
        result.push(points[points.length - 1]);
        return result;
      }

      straightenLines() {
        for (const path of this.paths) {
          if (path.tool === 'line') {
            const angle = Math.atan2(path.endY - path.startY, path.endX - path.startX);
            const snappedAngle = this.snapToStandardAngle(angle);
            const length = Math.sqrt(
              Math.pow(path.endX - path.startX, 2) + 
              Math.pow(path.endY - path.startY, 2)
            );
            
            path.endX = path.startX + length * Math.cos(snappedAngle);
            path.endY = path.startY + length * Math.sin(snappedAngle);
          } else if (path.tool === 'brush' && path.points && path.points.length > 1) {
            // Check if it's approximately a straight line
            const first = path.points[0];
            const last = path.points[path.points.length - 1];
            const angle = Math.atan2(last.y - first.y, last.x - first.x);
            const snappedAngle = this.snapToStandardAngle(angle);
            const length = Math.sqrt(
              Math.pow(last.x - first.x, 2) + 
              Math.pow(last.y - first.y, 2)
            );

            // If points are roughly collinear
            if (this.arePointsCollinear(path.points)) {
              path.points = [first, {
                x: first.x + length * Math.cos(snappedAngle),
                y: first.y + length * Math.sin(snappedAngle)
              }];
            }
          }
        }
        this.saveHistory();
        this.render();
      }

      snapToStandardAngle(angle) {
        const degrees = angle * 180 / Math.PI;
        let closest = this.standardAngles[0];
        let minDiff = Math.abs(degrees - closest);

        for (const std of this.standardAngles) {
          const diff = Math.abs(degrees - std);
          if (diff < minDiff) {
            minDiff = diff;
            closest = std;
          }
        }

        return closest * Math.PI / 180;
      }

      arePointsCollinear(points) {
        if (points.length < 3) return true;
        
        const first = points[0];
        const last = points[points.length - 1];
        const length = Math.sqrt(
          Math.pow(last.x - first.x, 2) + 
          Math.pow(last.y - first.y, 2)
        );
        
        if (length < 10) return false;

        for (let i = 1; i < points.length - 1; i++) {
          const dist = this.pointToLineDistance(
            points[i], 
            first, 
            last
          );
          if (dist > length * 0.1) return false;
        }
        
        return true;
      }

      pointToLineDistance(point, lineStart, lineEnd) {
        const A = point.x - lineStart.x;
        const B = point.y - lineStart.y;
        const C = lineEnd.x - lineStart.x;
        const D = lineEnd.y - lineStart.y;

        const dot = A * C + B * D;
        const lenSq = C * C + D * D;
        let param = -1;

        if (lenSq !== 0) param = dot / lenSq;

        let xx, yy;

        if (param < 0) {
          xx = lineStart.x;
          yy = lineStart.y;
        } else if (param > 1) {
          xx = lineEnd.x;
          yy = lineEnd.y;
        } else {
          xx = lineStart.x + param * C;
          yy = lineStart.y + param * D;
        }

        return Math.sqrt(Math.pow(point.x - xx, 2) + Math.pow(point.y - yy, 2));
      }

      recognizeShapes() {
        for (const path of this.paths) {
          if (path.tool === 'brush' && path.points) {
            const shape = this.detectShapeType(path.points);
            if (shape) {
              path.tool = shape.type;
              path.startX = shape.bounds.x;
              path.startY = shape.bounds.y;
              path.endX = shape.bounds.x + shape.bounds.width;
              path.endY = shape.bounds.y + shape.bounds.height;
              path.points = null;
            }
          }
        }
        this.saveHistory();
        this.render();
      }

      detectShapeType(points) {
        if (points.length < 3) return null;

        // Calculate bounding box
        let minX = Infinity, minY = Infinity;
        let maxX = -Infinity, maxY = -Infinity;
        
        for (const p of points) {
          minX = Math.min(minX, p.x);
          minY = Math.min(minY, p.y);
          maxX = Math.max(maxX, p.x);
          maxY = Math.max(maxY, p.y);
        }

        const width = maxX - minX;
        const height = maxY - minY;
        const aspectRatio = width / height;

        // Check if it's a circle
        const centerX = (minX + maxX) / 2;
        const centerY = (minY + maxY) / 2;
        let avgRadius = 0;
        let radiusVar = 0;

        for (const p of points) {
          const dist = Math.sqrt(Math.pow(p.x - centerX, 2) + Math.pow(p.y - centerY, 2));
          avgRadius += dist;
        }
        avgRadius /= points.length;

        for (const p of points) {
          const dist = Math.sqrt(Math.pow(p.x - centerX, 2) + Math.pow(p.y - centerY, 2));
          radiusVar += Math.pow(dist - avgRadius, 2);
        }
        radiusVar /= points.length;

        // Low variance means circle
        if (radiusVar < Math.pow(avgRadius * 0.2, 2) && avgRadius > 20) {
          return { type: 'circle', bounds: { x: minX, y: minY, width, height } };
        }

        // Check if it's a rectangle (roughly)
        const cornerCount = this.countCorners(points);
        if (cornerCount >= 4 && cornerCount <= 6) {
          return { type: 'rectangle', bounds: { x: minX, y: minY, width, height } };
        }

        // Check if it's a line
        if (this.arePointsCollinear(points)) {
          return { type: 'line', bounds: { x: minX, y: minY, width, height } };
        }

        return null;
      }

      countCorners(points) {
        if (points.length < 3) return 0;
        
        let corners = 0;
        const threshold = 0.7;

        for (let i = 1; i < points.length - 1; i++) {
          const prev = points[i - 1];
          const curr = points[i];
          const next = points[i + 1];

          const angle1 = Math.atan2(curr.y - prev.y, curr.x - prev.x);
          const angle2 = Math.atan2(next.y - curr.y, next.x - curr.x);
          
          let angleDiff = Math.abs(angle2 - angle1);
          if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;

          if (angleDiff > threshold) {
            corners++;
          }
        }

        return corners;
      }

      correctPerspective() {
        for (const path of this.paths) {
          if (path.tool === 'cube') {
            // Apply perspective correction to cube
            const cx = (path.startX + path.endX) / 2;
            const cy = (path.startY + path.endY) / 2;
            const w = path.endX - path.startX;
            const h = path.endY - path.startY;

            switch (this.perspective) {
              case 'isometric':
                path.startX = cx - w / 2;
                path.endX = cx + w / 2;
                path.startY = cy - h / 2;
                path.endY = cy + h / 2;
                break;

              case 'one-point':
                // Apply one-point perspective
                const vanishX = cx;
                const vanishY = cy * 0.5;
                
                // Adjust vertices toward vanishing point
                const factor = 0.2;
                path.startX = path.startX + (vanishX - path.startX) * factor;
                path.startY = path.startY + (vanishY - path.startY) * factor;
                path.endX = path.endX + (vanishX - path.endX) * factor;
                path.endY = path.endY + (vanishY - path.endY) * factor;
                break;

              case 'two-point':
                // Apply two-point perspective
                const leftVP = { x: cx - w, y: cy };
                const rightVP = { x: cx + w, y: cy };
                const horizon = cy;
                
                // Adjust based on vertical position
                const yFactor = (path.startY - horizon) / horizon;
                if (yFactor > 0) {
                  path.endX = path.endX + (rightVP.x - path.endX) * yFactor * 0.3;
                } else {
                  path.startX = path.startX + (leftVP.x - path.startX) * Math.abs(yFactor) * 0.3;
                }
                break;
            }
          }
        }
        this.saveHistory();
        this.render();
      }

      // ============================================
      // 历史记录
      // ============================================

      saveHistory() {
        // Remove any future history if we're not at the end
        this.history = this.history.slice(0, this.historyIndex + 1);
        
        // Deep clone current state
        this.history.push(JSON.parse(JSON.stringify({
          paths: this.paths,
          settings: {
            strokeColor: this.strokeColor,
            strokeWidth: this.strokeWidth,
            opacity: this.opacity,
            fillColor: this.fillColor
          }
        })));
        
        this.historyIndex = this.history.length - 1;
        
        // Limit history size
        if (this.history.length > 50) {
          this.history.shift();
          this.historyIndex--;
        }
      }

      undo() {
        if (this.historyIndex > 0) {
          this.historyIndex--;
          const state = this.history[this.historyIndex];
          this.paths = JSON.parse(JSON.stringify(state.paths));
          this.updatePathCount();
          this.render();
        }
      }

      redo() {
        if (this.historyIndex < this.history.length - 1) {
          this.historyIndex++;
          const state = this.history[this.historyIndex];
          this.paths = JSON.parse(JSON.stringify(state.paths));
          this.updatePathCount();
          this.render();
        }
      }

      // ============================================
      // 导出功能
      // ============================================

      exportImage() {
        const format = document.querySelector('.export-option.active').dataset.format;
        const tempCanvas = document.createElement('canvas');
        const tempCtx = tempCanvas.getContext('2d');
        
        // Use a fixed export size
        tempCanvas.width = 1920;
        tempCanvas.height = 1080;
        
        // White background for export
        tempCtx.fillStyle = '#1a2332';
        tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
        
        // Draw grid
        const gridSize = 40;
        tempCtx.strokeStyle = 'rgba(51, 65, 85, 0.5)';
        tempCtx.lineWidth = 1;
        
        for (let x = 0; x <= 1920; x += gridSize) {
          tempCtx.beginPath();
          tempCtx.moveTo(x, 0);
          tempCtx.lineTo(x, 1080);
          tempCtx.stroke();
        }
        
        for (let y = 0; y <= 1080; y += gridSize) {
          tempCtx.beginPath();
          tempCtx.moveTo(0, y);
          tempCtx.lineTo(1920, y);
          tempCtx.stroke();
        }

        // Calculate scale to fit content
        let minX = Infinity, minY = Infinity;
        let maxX = -Infinity, maxY = -Infinity;
        
        for (const path of this.paths) {
          if (path.tool === 'brush' && path.points) {
            for (const p of path.points) {
              minX = Math.min(minX, p.x);
              minY = Math.min(minY, p.y);
              maxX = Math.max(maxX, p.x);
              maxY = Math.max(maxY, p.y);
            }
          } else {
            minX = Math.min(minX, path.startX, path.endX);
            minY = Math.min(minY, path.startY, path.endY);
            maxX = Math.max(maxX, path.startX, path.endX);
            maxY = Math.max(maxY, path.startY, path.endY);
          }
        }

        if (minX === Infinity) {
          minX = 0; minY = 0; maxX = 1920; maxY = 1080;
        }

        const contentWidth = maxX - minX;
        const contentHeight = maxY - minY;
        const padding = 80;
        
        const scaleX = (1920 - padding * 2) / contentWidth;
        const scaleY = (1080 - padding * 2) / contentHeight;
        const scale = Math.min(scaleX, scaleY, 1);
        
        const offsetX = (1920 - contentWidth * scale) / 2;
        const offsetY = (1080 - contentHeight * scale) / 2;

        // Draw paths
        for (const path of this.paths) {
          tempCtx.save();
          tempCtx.translate(offsetX - minX * scale, offsetY - minY * scale);
          tempCtx.scale(scale, scale);
          this.drawPathToContext(tempCtx, path);
          tempCtx.restore();
        }

        // Download
        const link = document.createElement('a');
        const timestamp = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '');
        
        if (format === 'png') {
          link.download = `工程示意图_${timestamp}.png`;
          link.href = tempCanvas.toDataURL('image/png');
        } else {
          // SVG export
          const svg = this.createSVG(contentWidth + padding * 2, contentHeight + padding * 2, scale, offsetX - minX * scale, offsetY - minY * scale);
          const blob = new Blob([svg], { type: 'image/svg+xml' });
          link.download = `工程示意图_${timestamp}.svg`;
          link.href = URL.createObjectURL(blob);
        }
        
        link.click();
      }

      drawPathToContext(ctx, path) {
        ctx.strokeStyle = path.strokeColor;
        ctx.lineWidth = path.strokeWidth;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.globalAlpha = path.opacity;

        if (path.tool === 'brush' || path.tool === 'eraser') {
          if (path.points.length < 2) {
            ctx.beginPath();
            ctx.arc(path.points[0].x, path.points[0].y, path.strokeWidth / 2, 0, Math.PI * 2);
            ctx.fillStyle = path.strokeColor;
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.moveTo(path.points[0].x, path.points[0].y);
            
            for (let i = 1; i < path.points.length - 1; i++) {
              const xc = (path.points[i].x + path.points[i + 1].x) / 2;
              const yc = (path.points[i].y + path.points[i + 1].y) / 2;
              ctx.quadraticCurveTo(path.points[i].x, path.points[i].y, xc, yc);
            }
            
            if (path.points.length > 1) {
              ctx.lineTo(path.points[path.points.length - 1].x, path.points[path.points.length - 1].y);
            }
            ctx.stroke();
          }
        } else {
          const x1 = path.startX;
          const y1 = path.startY;
          const x2 = path.endX;
          const y2 = path.endY;

          if (path.fillColor && path.fillColor !== 'transparent') {
            ctx.fillStyle = path.fillColor;
          }

          switch (path.tool) {
            case 'line':
              ctx.beginPath();
              ctx.moveTo(x1, y1);
              ctx.lineTo(x2, y2);
              ctx.stroke();
              break;

            case 'rectangle':
              ctx.beginPath();
              ctx.rect(x1, y1, x2 - x1, y2 - y1);
              if (path.fillColor !== 'transparent') ctx.fill();
              ctx.stroke();
              break;

            case 'circle':
              const radius = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2)) / 2;
              ctx.beginPath();
              ctx.arc(x1 + (x2 - x1) / 2, y1 + (y2 - y1) / 2, radius, 0, Math.PI * 2);
              if (path.fillColor !== 'transparent') ctx.fill();
              ctx.stroke();
              break;

            case 'polygon':
              const cx = (x1 + x2) / 2;
              const cy = (y1 + y2) / 2;
              const rx = Math.abs(x2 - x1) / 2;
              const ry = Math.abs(y2 - y1) / 2;
              const sides = 6;

              ctx.beginPath();
              for (let i = 0; i < sides; i++) {
                const angle = (i * 2 * Math.PI / sides) - Math.PI / 2;
                const px = cx + rx * Math.cos(angle);
                const py = cy + ry * Math.sin(angle);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
              }
              ctx.closePath();
              ctx.stroke();
              break;

            case 'cube':
              const w = x2 - x1;
              const h = y2 - y1;
              const offset = Math.min(w, h) * 0.3;

              ctx.beginPath();
              ctx.rect(x1, y1 + offset, w, h - offset);
              ctx.moveTo(x1, y1 + offset);
              ctx.lineTo(x1 + offset, y1);
              ctx.lineTo(x1 + w + offset, y1);
              ctx.lineTo(x1 + w, y1 + offset);
              ctx.moveTo(x1 + w, y1 + offset);
              ctx.lineTo(x1 + w + offset, y1);
              ctx.lineTo(x1 + w + offset, y1 + h);
              ctx.lineTo(x1 + w, y1 + h + offset);
              ctx.stroke();
              break;

            case 'cylinder':
              const rxc = Math.abs(x2 - x1) / 2;
              const ryc = rxc * 0.3;
              const hc = y2 - y1;
              const ccx = (x1 + x2) / 2;
              const ccy = y1 + ryc;

              ctx.beginPath();
              ctx.ellipse(ccx, ccy, rxc, ryc, 0, 0, Math.PI * 2);
              ctx.stroke();

              ctx.beginPath();
              ctx.moveTo(ccx - rxc, ccy);
              ctx.lineTo(ccx - rxc, ccy + hc);
              ctx.lineTo(ccx + rxc, ccy + hc);
              ctx.lineTo(ccx + rxc, ccy);
              ctx.stroke();

              ctx.beginPath();
              ctx.ellipse(ccx, ccy + hc, rxc, ryc, 0, 0, Math.PI);
              ctx.stroke();
              break;
          }
        }
      }

      createSVG(width, height, scale, offsetX, offsetY) {
        let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;
        svg += `<rect width="100%" height="100%" fill="#1a2332"/>`;
        
        // Grid
        const gridSize = 40 * scale;
        svg += `<defs><pattern id="grid" width="${gridSize}" height="${gridSize}" patternUnits="userSpaceOnUse">`;
        svg += `<path d="M ${gridSize} 0 L 0 0 0 ${gridSize}" fill="none" stroke="rgba(51,65,85,0.5)" stroke-width="1"/>`;
        svg += `</pattern></defs>`;
        svg += `<rect width="100%" height="100%" fill="url(#grid)"/>`;
        
        // Paths
        svg += `<g transform="translate(${offsetX}, ${offsetY}) scale(${scale})">`;
        
        for (const path of this.paths) {
          svg += this.getPathSVG(path);
        }
        
        svg += `</g></svg>`;
        return svg;
      }

      getPathSVG(path) {
        let svg = '';
        const strokeColor = path.strokeColor;
        const strokeWidth = path.strokeWidth;
        const opacity = path.opacity;

        if (path.tool === 'brush' || path.tool === 'eraser') {
          if (path.points.length < 2) {
            svg += `<circle cx="${path.points[0].x}" cy="${path.points[0].y}" r="${strokeWidth / 2}" fill="${strokeColor}" opacity="${opacity}"/>`;
          } else {
            let d = `M ${path.points[0].x} ${path.points[0].y}`;
            for (let i = 1; i < path.points.length - 1; i++) {
              const xc = (path.points[i].x + path.points[i + 1].x) / 2;
              const yc = (path.points[i].y + path.points[i + 1].y) / 2;
              d += ` Q ${path.points[i].x} ${path.points[i].y} ${xc} ${yc}`;
            }
            d += ` L ${path.points[path.points.length - 1].x} ${path.points[path.points.length - 1].y}`;
            svg += `<path d="${d}" fill="none" stroke="${strokeColor}" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round" opacity="${opacity}"/>`;
          }
        } else {
          const x1 = path.startX;
          const y1 = path.startY;
          const x2 = path.endX;
          const y2 = path.endY;
          const fillAttr = path.fillColor !== 'transparent' ? `fill="${path.fillColor}"` : 'fill="none"';

          switch (path.tool) {
            case 'line':
              svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${strokeColor}" stroke-width="${strokeWidth}" stroke-linecap="round" opacity="${opacity}"/>`;
              break;
            case 'rectangle':
              svg += `<rect x="${x1}" y="${y1}" width="${x2-x1}" height="${y2-y1}" stroke="${strokeColor}" stroke-width="${strokeWidth}" ${fillAttr} opacity="${opacity}"/>`;
              break;
            case 'circle':
              const radius = Math.sqrt(Math.pow(x2-x1,2) + Math.pow(y2-y1,2)) / 2;
              svg += `<circle cx="${x1+(x2-x1)/2}" cy="${y1+(y2-y1)/2}" r="${radius}" stroke="${strokeColor}" stroke-width="${strokeWidth}" ${fillAttr} opacity="${opacity}"/>`;
              break;
          }
        }

        return svg;
      }

      // ============================================
      // 辅助功能
      // ============================================

      clearCanvas() {
        this.paths = [];
        this.currentPath = null;
        this.saveHistory();
        this.updatePathCount();
        this.render();
      }

      setZoom(newZoom) {
        this.zoom = Math.max(0.25, Math.min(4, newZoom));
        document.getElementById('zoomValue').textContent = Math.round(this.zoom * 100) + '%';
        this.render();
      }

      updatePathCount() {
        document.getElementById('pathCount').textContent = `路径: ${this.paths.length}`;
      }
    }

    // Initialize app
    const app = new DrawingApp();
  </script>
</body>
</html>
