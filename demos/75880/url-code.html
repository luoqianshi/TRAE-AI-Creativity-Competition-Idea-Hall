<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL编解码工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,.1);
    width: 100%;
    max-width: 800px;
    padding: 24px;
  }
  textarea {
    width: 100%;
    height: 200px;
    border: 1px solid #d9d9d9;
    border-radius: 4px;
    padding: 12px 16px;
    font-size: 14px;
    color: #333;
    resize: vertical;
    outline: none;
    transition: border-color .3s;
  }
  textarea::placeholder { color: #bfbfbf; }
  textarea:focus { border-color: #1890ff; }
  .toolbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .char-count {
    font-size: 13px;
    color: #999;
    margin-right: auto;
  }
  button {
    padding: 7px 18px;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    transition: background .25s, transform .1s;
    user-select: none;
  }
  button:active { transform: scale(.97); }
  .btn-primary { background: #1890ff; color: #fff; }
  .btn-primary:hover { background: #40a9ff; }
  .btn-default { background: #fff; color: #333; border: 1px solid #d9d9d9; }
  .btn-default:hover { color: #1890ff; border-color: #1890ff; }
</style>
</head>
<body>
<div class="container">
  <textarea id="inputArea" placeholder="转换的内容粘贴在这里"></textarea>
  <div class="toolbar">
    <span class="char-count"><span id="count">0</span> 字符</span>
    <button class="btn-primary" onclick="doEncode()">UrlEncode编码</button>
    <button class="btn-primary" onclick="doDecode()">UrlDecode解码</button>
    <button class="btn-default" onclick="doClear()">清空结果</button>
  </div>
</div>

<script>
const input = document.getElementById('inputArea');
const countEl = document.getElementById('count');

input.addEventListener('input', () => {
  countEl.textContent = input.value.length;
});

function doEncode() {
  const val = input.value.trim();
  if (!val) return;
  input.value = encodeURIComponent(val);
  countEl.textContent = input.value.length;
}

function doDecode() {
  const val = input.value.trim();
  if (!val) return;
  try {
    input.value = decodeURIComponent(val);
  } catch (e) {
    input.value = '【解码失败】输入内容不是有效的 URL 编码字符串';
  }
  countEl.textContent = input.value.length;
}

function doClear() {
  input.value = '';
  countEl.textContent = '0';
}
</script>
</body>
</html>
