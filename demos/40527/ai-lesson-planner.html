<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能备课助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            padding: 30px 0;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .output-area {
            min-height: 400px;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            white-space: pre-wrap;
            line-height: 1.8;
            color: #333;
            overflow-y: auto;
            max-height: 600px;
        }

        .output-area.loading {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .feature-item {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .feature-item h3 {
            color: #333;
            margin-bottom: 8px;
        }

        .feature-item p {
            color: #666;
            font-size: 0.9rem;
        }

        .copy-btn {
            background: #28a745;
            margin-top: 10px;
            width: auto;
            padding: 10px 20px;
            font-size: 0.9rem;
        }

        .copy-btn:hover {
            box-shadow: 0 5px 20px rgba(40, 167, 69, 0.4);
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tag {
            background: #e9ecef;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #495057;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag:hover {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .features {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 AI智能备课助手</h1>
            <p>让AI成为您的教学伙伴，轻松高效备课</p>
        </header>

        <div class="features">
            <div class="feature-item">
                <div class="feature-icon">📚</div>
                <h3>智能教案生成</h3>
                <p>自动生成完整教案框架</p>
            </div>
            <div class="feature-item">
                <div class="feature-icon">💡</div>
                <h3>教学设计优化</h3>
                <p>提供创新教学方法建议</p>
            </div>
            <div class="feature-item">
                <div class="feature-icon">🎯</div>
                <h3>个性化定制</h3>
                <p>根据学科年级精准推荐</p>
            </div>
        </div>

        <div class="main-content">
            <div class="card">
                <h2 class="card-title">📝 备课信息</h2>
                <form id="lessonForm">
                    <div class="form-group">
                        <label for="subject">学科</label>
                        <select id="subject" required>
                            <option value="">请选择学科</option>
                            <option value="语文">语文</option>
                            <option value="数学">数学</option>
                            <option value="英语">英语</option>
                            <option value="物理">物理</option>
                            <option value="化学">化学</option>
                            <option value="生物">生物</option>
                            <option value="历史">历史</option>
                            <option value="地理">地理</option>
                            <option value="政治">政治</option>
                            <option value="音乐">音乐</option>
                            <option value="美术">美术</option>
                            <option value="体育">体育</option>
                            <option value="信息技术">信息技术</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="grade">年级</label>
                        <select id="grade" required>
                            <option value="">请选择年级</option>
                            <option value="一年级">一年级</option>
                            <option value="二年级">二年级</option>
                            <option value="三年级">三年级</option>
                            <option value="四年级">四年级</option>
                            <option value="五年级">五年级</option>
                            <option value="六年级">六年级</option>
                            <option value="初一">初一</option>
                            <option value="初二">初二</option>
                            <option value="初三">初三</option>
                            <option value="高一">高一</option>
                            <option value="高二">高二</option>
                            <option value="高三">高三</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="topic">课程主题</label>
                        <input type="text" id="topic" placeholder="例如：古诗词鉴赏、一元二次方程、光合作用" required>
                    </div>

                    <div class="form-group">
                        <label for="duration">课时</label>
                        <select id="duration" required>
                            <option value="1课时">1课时（40分钟）</option>
                            <option value="2课时">2课时（80分钟）</option>
                            <option value="3课时">3课时（120分钟）</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="objectives">教学目标（可选）</label>
                        <textarea id="objectives" placeholder="请输入您希望学生达成的学习目标，如：理解...掌握...运用..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>快速模板</label>
                        <div class="tags">
                            <span class="tag" onclick="setTemplate('新课讲授')">新课讲授</span>
                            <span class="tag" onclick="setTemplate('复习巩固')">复习巩固</span>
                            <span class="tag" onclick="setTemplate('实验探究')">实验探究</span>
                            <span class="tag" onclick="setTemplate('小组讨论')">小组讨论</span>
                            <span class="tag" onclick="setTemplate('习题讲解')">习题讲解</span>
                            <span class="tag" onclick="setTemplate('项目学习')">项目学习</span>
                        </div>
                    </div>

                    <button type="submit" class="btn" id="generateBtn">🚀 生成教案</button>
                </form>
            </div>

            <div class="card">
                <h2 class="card-title">📖 生成结果</h2>
                <div id="output" class="output-area">
                    <p style="color: #999; text-align: center; margin-top: 150px;">
                        请填写左侧备课信息，点击"生成教案"按钮<br>
                        AI将为您生成专业的教学设计方案
                    </p>
                </div>
                <button class="btn copy-btn" id="copyBtn" style="display: none;" onclick="copyContent()">📋 复制内容</button>
            </div>
        </div>
    </div>

    <script>
        let currentTemplate = '';

        function setTemplate(template) {
            currentTemplate = template;
            document.querySelectorAll('.tag').forEach(tag => {
                tag.style.background = tag.textContent === template ? '#667eea' : '#e9ecef';
                tag.style.color = tag.textContent === template ? 'white' : '#495057';
            });
        }

        document.getElementById('lessonForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const subject = document.getElementById('subject').value;
            const grade = document.getElementById('grade').value;
            const topic = document.getElementById('topic').value;
            const duration = document.getElementById('duration').value;
            const objectives = document.getElementById('objectives').value;
            
            const output = document.getElementById('output');
            const generateBtn = document.getElementById('generateBtn');
            const copyBtn = document.getElementById('copyBtn');
            
            output.className = 'output-area loading';
            output.innerHTML = '<div class="spinner"></div>';
            generateBtn.disabled = true;
            copyBtn.style.display = 'none';
            
            // 模拟AI生成过程
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            const lessonPlan = generateLessonPlan(subject, grade, topic, duration, objectives, currentTemplate);
            
            output.className = 'output-area';
            output.innerHTML = lessonPlan;
            generateBtn.disabled = false;
            copyBtn.style.display = 'inline-block';
        });

        function generateLessonPlan(subject, grade, topic, duration, objectives, template) {
            const templateType = template || '新课讲授';
            
            return `<h3 style="color: #667eea; margin-bottom: 15px;">📄 ${subject}教案 - ${topic}</h3>

<strong>基本信息</strong>
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
学科：${subject}
年级：${grade}
课题：${topic}
课时：${duration}
课型：${templateType}

<strong>一、教学目标</strong>
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
${objectives || `1. 知识与技能目标：理解并掌握${topic}的基本概念和核心内容。
2. 过程与方法目标：通过探究学习，培养学生的分析思维和解决问题的能力。
3. 情感态度与价值观目标：激发学生的学习兴趣，培养积极主动的学习态度。`}

<strong>二、教学重难点</strong>
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
【教学重点】
• ${topic}的核心概念理解
• 基本方法与技能的掌握

【教学难点】
• 知识的灵活运用与迁移
• 深层次问题的分析与解决

<strong>三、教学方法</strong>
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
• 讲授法：系统讲解核心知识点
• 讨论法：引导学生深入思考
• 练习法：巩固所学知识
• 探究法：培养自主学习能力

<strong>四、教学过程</strong>
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

【导入环节】（5分钟）
• 创设情境，激发兴趣
• 提出问题，引发思考
• 联系旧知，自然过渡

【新知讲授】（20分钟）
• 概念讲解：清晰阐述${topic}的定义和内涵
• 例题示范：通过典型例题演示解题思路
• 互动提问：及时了解学生掌握情况

【合作探究】（10分钟）
• 分组讨论：学生分组探讨相关问题
• 成果展示：各组汇报讨论成果
• 教师点评：总结归纳，深化理解

【巩固练习】（10分钟）
• 基础练习：巩固基本概念和方法
• 拓展提升：解决综合性问题
• 个别辅导：关注学习困难学生

【课堂小结】（5分钟）
• 知识梳理：回顾本节课重点内容
• 方法总结：提炼解题策略和技巧
• 布置作业：分层设计课后练习

<strong>五、板书设计</strong>
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
┌────────────────────────────┐
│                            │
│         ${topic.padEnd(18)}        │
│                            │
│  一、概念                  │
│  二、方法                  │
│  三、应用                  │
│                            │
└────────────────────────────┘

<strong>六、作业布置</strong>
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
【基础作业】
• 完成课后习题第1-3题
• 整理本节课笔记

【拓展作业】
• 完成课后习题第4-5题
• 查阅相关资料，拓展知识面

<strong>七、教学反思</strong>
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
• 本节课教学目标是否达成？
• 学生的参与度如何？
• 哪些环节需要改进？
• 如何更好地照顾到不同层次的学生？

<strong>八、教学资源</strong>
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
• 多媒体课件
• 教学视频/音频资料
• 实物教具/模型
• 练习册/学案

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
⏰ 生成时间：${new Date().toLocaleString('zh-CN')}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`;
        }

        function copyContent() {
            const output = document.getElementById('output');
            const text = output.innerText;
            
            navigator.clipboard.writeText(text).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '✅ 已复制';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 2000);
            }).catch(err => {
                alert('复制失败，请手动选择复制');
            });
        }
    </script>
</body>
</html>
