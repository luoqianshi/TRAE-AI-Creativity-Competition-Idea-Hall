<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta content="default-src 'none'; style-src * 'unsafe-inline'; script-src * 'unsafe-inline'; img-src * data: blob:; font-src * data:; media-src * data: blob:; connect-src 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'" http-equiv="Content-Security-Policy"/>

<title>快乐家庭点菜</title>
<!-- Tailwind CSS -->
<script src="https://image.uc.cn/s/uae/g/3n/mos-production/0915/3.4.17.js"></script>

<link href="https://image.uc.cn/s/uae/g/3n/mos-production/fontawesome-free-7.1.0-web/css/fontawesome.min.css" rel="stylesheet"/>
<!-- Canvas Confetti -->
<script src="https://image.uc.cn/s/uae/g/3n/mos-production/cdn.jsdelivr.net/npm/canvas-confetti/1.6.0/dist/confetti.browser.min.js"></script>
<style>
        /* Custom Font and Cartoon Styles */
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

        body {
            font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
            background-color: #FFF8E1; /* Creamy background */
            overflow: hidden; /* Prevent body scroll, handle inside containers */
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #FFB74D;
            border-radius: 10px;
        }

        /* Cartoon Borders */
        .cartoon-border {
            border: 3px solid #333;
            border-radius: 12px;
            box-shadow: 4px 4px 0px #333;
        }
        .cartoon-border-sm {
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 2px 2px 0px #333;
        }
        .cartoon-btn {
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 2px 2px 0px #333;
            transition: all 0.1s;
        }
        .cartoon-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px #333;
        }

        /* Category Active State */
        .category-item.active {
            background-color: #FFCC80;
            font-weight: bold;
            border-left: 4px solid #E65100;
        }

        /* Modal Animation */
        .modal-enter {
            opacity: 0;
            transform: scale(0.9);
        }
        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.2s, transform 0.2s;
        }
        .modal-exit {
            opacity: 1;
            transform: scale(1);
        }
        .modal-exit-active {
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.2s, transform 0.2s;
        }

        /* Toast Animation */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translate(-50%, 20px); }
            100% { opacity: 1; transform: translate(-50%, 0); }
        }
        .toast-msg {
            animation: slideUpFade 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="h-screen flex flex-col text-gray-800">
<!-- Header -->
<header class="h-14 bg-orange-400 border-b-4 border-black flex items-center justify-between px-4 z-20 shadow-md flex-shrink-0">
<div class="flex items-center gap-2">
<span class="text-2xl">🍱</span>
<h1 class="text-xl text-white drop-shadow-md">快乐家庭点菜</h1>
</div>
<div class="relative cursor-pointer cartoon-btn bg-white px-2 py-1 text-sm" onclick="openCart()">
<i class="fas fa-shopping-basket text-orange-500"></i>
<span class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center border-2 border-black" id="header-cart-count">0</span>
</div>
</header>
<!-- Main Layout -->
<div class="flex flex-1 overflow-hidden relative">
<!-- Left Sidebar Navigation -->
<nav class="w-24 bg-orange-100 overflow-y-auto border-r-4 border-black flex-shrink-0 z-10">
<ul class="flex flex-col" id="category-list">
<!-- Categories will be injected here -->
</ul>
</nav>
<!-- Right Content Area -->
<main class="flex-1 overflow-y-auto bg-orange-50 p-4 pb-24 scroll-smooth" id="menu-container">
<!-- Menu items will be injected here -->
</main>
</div>
<!-- Bottom Cart Bar (Sticky) -->
<div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 w-11/12 max-w-md bg-white cartoon-border p-3 flex justify-between items-center z-30 transition-transform duration-300 translate-y-[150%]" id="bottom-cart-bar">
<div class="flex items-center gap-3">
<div class="bg-orange-500 text-white rounded-full w-10 h-10 flex items-center justify-center text-xl border-2 border-black">
<i class="fas fa-utensils"></i>
</div>
<div>
<div class="font-bold text-lg">¥ <span id="bottom-total-price">0.00</span></div>
<div class="text-xs text-gray-500">已选 <span id="bottom-count">0</span> 份</div>
</div>
</div>
<button class="cartoon-btn bg-green-400 hover:bg-green-500 px-4 py-2 font-bold text-white" onclick="openCart()">
            去结算
        </button>
</div>
<!-- Size Selection Modal -->
<div class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center backdrop-blur-sm" id="size-modal">
<div class="bg-white cartoon-border w-80 max-w-[90%] p-6 relative transform transition-all scale-95 opacity-0" id="size-modal-content">
<button class="absolute top-2 right-2 text-gray-400 hover:text-black text-xl" onclick="closeSizeModal()">
<i class="fas fa-times"></i>
</button>
<div class="text-center mb-6">
<div class="text-6xl mb-2" id="modal-dish-icon">🍲</div>
<h3 class="text-2xl font-bold text-gray-800" id="modal-dish-name">菜品名称</h3>
<p class="text-sm text-gray-500 mt-1">请选择分量</p>
</div>
<div class="space-y-3">
<button class="w-full cartoon-btn bg-blue-100 hover:bg-blue-200 py-3 flex justify-between items-center px-4 group" onclick="confirmOrder('小份')">
<span class="font-bold text-blue-800">小份</span>
<span class="text-blue-600 group-hover:scale-110 transition-transform">🥣</span>
</button>
<button class="w-full cartoon-btn bg-yellow-100 hover:bg-yellow-200 py-3 flex justify-between items-center px-4 group" onclick="confirmOrder('中份')">
<span class="font-bold text-yellow-800">中份</span>
<span class="text-yellow-600 group-hover:scale-110 transition-transform">🥣🥣</span>
</button>
<button class="w-full cartoon-btn bg-red-100 hover:bg-red-200 py-3 flex justify-between items-center px-4 group" onclick="confirmOrder('大份')">
<span class="font-bold text-red-800">大份</span>
<span class="text-red-600 group-hover:scale-110 transition-transform">🥣🥣🥣</span>
</button>
</div>
</div>
</div>
<!-- Cart Detail Modal -->
<div class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-end sm:items-center justify-center backdrop-blur-sm" id="cart-modal">
<div class="bg-white cartoon-border w-full sm:w-96 max-w-[100%] h-[70vh] sm:h-auto sm:max-h-[80vh] flex flex-col relative transform transition-all translate-y-full sm:translate-y-10 opacity-0" id="cart-modal-content">
<div class="p-4 border-b-2 border-black flex justify-between items-center bg-orange-100">
<h3 class="text-xl font-bold"><i class="fas fa-shopping-basket mr-2"></i>我的订单</h3>
<button class="text-gray-500 hover:text-black text-xl" onclick="closeCart()">
<i class="fas fa-times"></i>
</button>
</div>
<div class="flex-1 overflow-y-auto p-4 space-y-4" id="cart-items-container">
<!-- Cart items injected here -->
<div class="text-center text-gray-400 mt-10">
<i class="fas fa-utensils text-4xl mb-2"></i>
<p>还没有点菜哦~</p>
</div>
</div>
<div class="p-4 border-t-2 border-black bg-gray-50">
<div class="flex justify-between items-center mb-4">
<span class="text-lg">合计:</span>
<span class="text-2xl font-bold text-red-600">¥ <span id="cart-modal-total">0.00</span></span>
</div>
<button class="w-full cartoon-btn bg-green-500 hover:bg-green-600 text-white py-3 text-xl font-bold" onclick="submitOrder()">
<i class="fas fa-check-circle mr-2"></i>下单啦
                </button>
</div>
</div>
</div>
<!-- Toast Notification Container -->
<div class="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 pointer-events-none" id="toast-container"></div>
<script>
        // --- Data Definition ---
        // Using Emojis as requested for images
        const menuData = [
            {
                category: "川菜",
                id: "sichuan",
                items: [
                    { name: "麻婆豆腐", emoji: "🍲", price: 18 },

                    { name: "回锅肉", emoji: "🥓", price: 32 },
                    { name: "宫保鸡丁", emoji: "🥜", price: 30 },
                    { name: "水煮肉片", emoji: "🥩", price: 36 },
                    { name: "酸菜鱼", emoji: "🐟", price: 48 },
                    { name: "干煸四季豆", emoji: "🥬", price: 22 },
                    { name: "蚂蚁上树", emoji: "🍜", price: 24 },
                    { name: "干煸牛肉丝", emoji: "🐂", price: 35 },
                    { name: "干煸冬笋", emoji: "🎋", price: 28 }
                ]
            },
            {
                category: "湘菜",
                id: "hunan",
                items: [
                    { name: "辣椒炒肉", emoji: "🌶️", price: 32 },
                    { name: "剁椒鱼头", emoji: "🐟", price: 68 },
                    { name: "酸豆角炒肉末", emoji: "🥒", price: 26 },
                    { name: "蒜苗炒腊肉", emoji: "🥓", price: 38 },
                    { name: "萝卜干炒腊肉", emoji: "🥓", price: 36 },
                    { name: "湘西外婆菜", emoji: "🥗", price: 24 }
                ]
            },
            {
                category: "鲁菜",
                id: "shandong",
                items: [
                    { name: "九转大肠", emoji: "🥓", price: 48 },
                    { name: "糖醋鲤鱼", emoji: "🐟", price: 58 },
                    { name: "油焖大虾", emoji: "🦐", price: 88 },
                    { name: "奶汤蒲菜", emoji: "🥬", price: 32 },
                    { name: "糖醋里脊", emoji: "🥩", price: 36 },
                    { name: "葱烧海参", emoji: "🌊", price: 128 }
                ]
            },
            {
                category: "粤菜",
                id: "cantonese",
                items: [
                    { name: "白切鸡", emoji: "🐔", price: 58 },
                    { name: "清蒸鱼", emoji: "🐟", price: 68 },
                    { name: "老火靓汤", emoji: "🍲", price: 45 },
                    { name: "干炒牛河", emoji: "🍜", price: 28 },
                    { name: "豉油鸡", emoji: "🐔", price: 52 },
                    { name: "白灼虾", emoji: "🦐", price: 78 },
                    { name: "苦瓜牛肉", emoji: "🥒", price: 32 },
                    { name: "煲仔饭", emoji: "🍚", price: 35 },
                    { name: "蒜蓉粉丝蒸扇贝", emoji: "🐚", price: 58 }
                ]
            },
            {
                category: "浙菜",
                id: "zhejiang",
                items: [
                    { name: "西湖醋鱼", emoji: "🐟", price: 68 },
                    { name: "东坡肉", emoji: "🥩", price: 58 },
                    { name: "龙井虾仁", emoji: "🦐", price: 88 },
                    { name: "叫化童鸡", emoji: "🐔", price: 78 }
                ]
            },
            {
                category: "东北菜",
                id: "dongbei",
                items: [
                    { name: "地三鲜", emoji: "🍆", price: 24 }
                ]
            },
            {
                category: "苏菜",
                id: "jiangsu",
                items: [
                    { name: "狮子头", emoji: "🍡", price: 38 },
                    { name: "松鼠鳜鱼", emoji: "🐟", price: 88 }
                ]
            },
            {
                category: "闽菜",
                id: "fujian",
                items: [
                    { name: "佛跳墙", emoji: "🍲", price: 288 }
                ]
            },
            {
                category: "徽菜",
                id: "anhui",
                items: [
                    { name: "臭鳜鱼", emoji: "🐟", price: 78 },
                    { name: "毛豆腐", emoji: "🧀", price: 28 }
                ]
            },
            {
                category: "家常菜",
                id: "home",
                items: [
                    { name: "酸辣土豆丝", emoji: "🥔", price: 16 },
                    { name: "西红柿炒鸡蛋", emoji: "🍅", price: 18 }
                ]
            },
            {
                category: "主食",
                id: "staple",
                items: [
                    { name: "米饭", emoji: "🍚", price: 2 },
                    { name: "馒头", emoji: "🥖", price: 1 }
                ]
            }
        ];

        // --- State Management ---
        let cart = [];
        let currentSelectedDish = null;

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            renderMenu();
        });

        // --- Rendering Functions ---

        function renderSidebar() {
            const list = document.getElementById('category-list');
            list.innerHTML = '';
            
            menuData.forEach((cat, index) => {
                const li = document.createElement('li');
                li.className = `category-item p-4 text-center cursor-pointer border-b border-orange-200 hover:bg-orange-200 transition-colors text-sm ${index === 0 ? 'active' : ''}`;
                li.textContent = cat.category;
                li.onclick = () => scrollToCategory(cat.id, li);
                list.appendChild(li);
            });
        }

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            menuData.forEach(cat => {
                // Section Title
                const section = document.createElement('div');
                section.id = cat.id;
                section.className = 'mb-8 scroll-mt-4'; // scroll-mt for header offset
                section.innerHTML = `
                    <div class="flex items-center gap-2 mb-4">
                        <span class="text-2xl">${getCategoryEmoji(cat.category)}</span>
                        <h2 class="text-2xl font-bold text-gray-800 border-b-4 border-orange-400 pb-1 inline-block">${cat.category}</h2>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        ${cat.items.map(item => createDishCard(item)).join('')}
                    </div>
                `;
                container.appendChild(section);
            });
        }

        function getCategoryEmoji(category) {
            const map = {
                "川菜": "🌶️", "湘菜": "🌶️", "鲁菜": "🍖", "粤菜": "🥟",
                "浙菜": "🍃", "东北菜": "❄️", "苏菜": "🌸", "闽菜": "🌊",
                "徽菜": "🏞️", "家常菜": "🏠", "主食": "🍚"
            };
            return map[category] || "🍽️";
        }

        function createDishCard(item) {
            return `
                <div class="bg-white cartoon-border-sm p-3 flex flex-col items-center justify-between h-full hover:scale-105 transition-transform cursor-pointer" onclick="openSizeModal('${item.name}', '${item.emoji}', ${item.price})">
                    <div class="text-5xl mb-2 filter drop-shadow-sm">${item.emoji}</div>
                    <div class="text-center w-full">
                        <h3 class="font-bold text-gray-800 text-sm mb-1 truncate">${item.name}</h3>
                        <p class="text-orange-600 font-bold">¥${item.price}</p>
                    </div>
                    <button class="mt-2 bg-orange-400 text-white text-xs px-3 py-1 rounded-full border border-black shadow-sm">
                        选规格
                    </button>
                </div>
            `;
        }

        // --- Interaction Logic ---

        function scrollToCategory(id, liElement) {
            // Update active state
            document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
            liElement.classList.add('active');

            // Scroll
            const element = document.getElementById(id);
            if (element) {
                element.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function openSizeModal(name, emoji, price) {
            currentSelectedDish = { name, emoji, price };
            const modal = document.getElementById('size-modal');
            const content = document.getElementById('size-modal-content');
            
            document.getElementById('modal-dish-name').textContent = name;
            document.getElementById('modal-dish-icon').textContent = emoji;
            
            modal.classList.remove('hidden');
            // Small delay to allow display:block to apply before transition
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeSizeModal() {
            const modal = document.getElementById('size-modal');
            const content = document.getElementById('size-modal-content');
            
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                currentSelectedDish = null;
            }, 200);
        }

        function confirmOrder(size) {
            if (!currentSelectedDish) return;

            let multiplier = 1;
            if (size === '小份') multiplier = 0.8;
            if (size === '大份') multiplier = 1.2;

            const finalPrice = Math.round(currentSelectedDish.price * multiplier);
            
            // Check if item exists in cart
            const existingItem = cart.find(item => item.name === currentSelectedDish.name && item.size === size);
            
            if (existingItem) {
                existingItem.count++;
            } else {
                cart.push({
                    name: currentSelectedDish.name,
                    emoji: currentSelectedDish.emoji,
                    size: size,
                    price: finalPrice,
                    count: 1
                });
            }

            updateCartUI();
            closeSizeModal();
            showToast(`已添加: ${currentSelectedDish.name} (${size})`);
        }

        function updateCartUI() {
            const totalCount = cart.reduce((sum, item) => sum + item.count, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.count), 0);

            // Header Badge
            const headerBadge = document.getElementById('header-cart-count');
            headerBadge.textContent = totalCount;
            headerBadge.classList.toggle('hidden', totalCount === 0);

            // Bottom Bar
            const bottomBar = document.getElementById('bottom-cart-bar');
            if (totalCount > 0) {
                bottomBar.classList.remove('translate-y-[150%]');
            } else {
                bottomBar.classList.add('translate-y-[150%]');
            }
            document.getElementById('bottom-total-price').textContent = totalPrice.toFixed(2);
            document.getElementById('bottom-count').textContent = totalCount;
        }

        function openCart() {
            if (cart.length === 0) {
                showToast("购物车是空的哦");
                return;
            }
            const modal = document.getElementById('cart-modal');
            const content = document.getElementById('cart-modal-content');
            
            renderCartItems();
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('translate-y-full', 'sm:translate-y-10', 'opacity-0');
                content.classList.add('translate-y-0', 'opacity-100');
            }, 10);
        }

        function closeCart() {
            const modal = document.getElementById('cart-modal');
            const content = document.getElementById('cart-modal-content');
            
            content.classList.remove('translate-y-0', 'opacity-100');
            content.classList.add('translate-y-full', 'sm:translate-y-10', 'opacity-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items-container');
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.count), 0);
            
            document.getElementById('cart-modal-total').textContent = totalPrice.toFixed(2);

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-gray-400 mt-10">
                        <i class="fas fa-utensils text-4xl mb-2"></i>
                        <p>还没有点菜哦~</p>
                    </div>`;
                return;
            }

            container.innerHTML = cart.map((item, index) => `
                <div class="flex items-center justify-between bg-orange-50 p-3 rounded-lg border border-orange-200">
                    <div class="flex items-center gap-3">
                        <span class="text-3xl">${item.emoji}</span>
                        <div>
                            <div class="font-bold text-gray-800">${item.name}</div>
                            <div class="text-xs text-gray-500 bg-white px-2 py-0.5 rounded border border-gray-200 inline-block">${item.size}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-red-600">¥${item.price * item.count}</span>
                        <div class="flex items-center gap-2 bg-white rounded border border-gray-300">
                            <button onclick="updateItemCount(${index}, -1)" class="w-6 h-6 flex items-center justify-center text-gray-600 hover:bg-gray-100">-</button>
                            <span class="text-sm font-bold w-4 text-center">${item.count}</span>
                            <button onclick="updateItemCount(${index}, 1)" class="w-6 h-6 flex items-center justify-center text-gray-600 hover:bg-gray-100">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateItemCount(index, change) {
            cart[index].count += change;
            if (cart[index].count <= 0) {
                cart.splice(index, 1);
            }
            updateCartUI();
            renderCartItems();
            if (cart.length === 0) closeCart();
        }

        function submitOrder() {
            closeCart();
            // Trigger confetti
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                return clearInterval(interval);
              }

              var particleCount = 50 * (timeLeft / duration);
              // since particles fall down, start a bit higher than random
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);

            showToast("下单成功！厨房正在准备~");
            cart = [];
            updateCartUI();
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg mb-3 flex items-center gap-2';
            toast.innerHTML = `<i class="fas fa-info-circle text-yellow-400"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, -20px)';
                toast.style.transition = 'all 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

    </script>
</body>
</html>
