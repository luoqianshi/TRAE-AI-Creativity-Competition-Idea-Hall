<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>药叮咛 — 从陪诊录音到用药提醒的家庭健康守护助手</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F8F7F4;
  --card: #FFFFFF;
  --teal: #0F766E;
  --teal-light: #CCFBF1;
  --teal-bg: #F0FDFA;
  --coral: #F0625C;
  --coral-light: #FEE2E2;
  --sage: #4D8C57;
  --sage-light: #DCFCE7;
  --amber: #D97706;
  --amber-light: #FEF3C7;
  --navy: #1E293B;
  --slate: #475569;
  --muted: #94A3B8;
  --border: #E8ECF1;
  --hairline: #F0F2F5;
  --shadow-sm: 0 1px 2px rgba(15,23,42,0.04);
  --shadow: 0 4px 12px rgba(15,23,42,0.06);
  --shadow-lg: 0 12px 32px rgba(15,23,42,0.08);
  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 22px;
  --font-display: 'DM Serif Display', 'Georgia', 'Noto Serif SC', serif;
  --font-body: 'DM Sans', 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { font-size: 16px; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--navy);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  background-image:
    linear-gradient(rgba(15,118,110,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15,118,110,0.015) 1px, transparent 1px);
  background-size: 24px 24px;
}
.app {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  position: relative;
  padding-bottom: 80px;
}

/* Header */
.header {
  padding: 22px 22px 14px;
  position: sticky;
  top: 0;
  z-index: 10;
  background: linear-gradient(180deg, var(--bg) 82%, transparent);
  backdrop-filter: blur(8px);
}
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo {
  font-family: var(--font-display);
  font-size: 1.5rem;
  color: var(--teal);
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo-dot {
  width: 10px; height: 10px;
  background: var(--coral);
  border-radius: 50%;
  animation: dotPulse 2s ease infinite;
}
@keyframes dotPulse {
  0%,100% { opacity:1; transform:scale(1); }
  50% { opacity:0.4; transform:scale(0.6); }
}
.header-subtitle {
  font-size: 0.72rem;
  color: var(--muted);
  font-weight: 400;
  margin-top: 2px;
}
.family-select {
  display: flex;
  gap: 4px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 3px;
}
.family-chip {
  padding: 5px 12px;
  border-radius: 16px;
  font-size: 0.7rem;
  border: none;
  cursor: pointer;
  background: none;
  color: var(--slate);
  font-family: var(--font-body);
  transition: all 0.2s;
}
.family-chip.active {
  background: var(--teal);
  color: #fff;
}

/* Tab Bar */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: var(--card);
  border-top: 1px solid var(--hairline);
  display: flex;
  padding: 5px 6px;
  padding-bottom: max(5px, env(safe-area-inset-bottom));
  z-index: 10;
}
.tab-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 0;
  border: none;
  background: none;
  cursor: pointer;
  color: var(--muted);
  font-family: var(--font-body);
  font-size: 0.64rem;
  font-weight: 500;
  transition: color 0.2s;
}
.tab-btn.active { color: var(--teal); }
.tab-icon { font-size: 1.2rem; }

/* Main */
.main { padding: 0 18px; }
.section { display: none; animation: fadeIn 0.3s ease; }
.section.active { display: block; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}

/* Visit Card */
.visit-card {
  background: var(--card);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: box-shadow 0.2s;
  position: relative;
  overflow: hidden;
}
.visit-card:hover { box-shadow: var(--shadow); }
.visit-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: var(--teal);
  border-radius: 4px 0 0 4px;
}
.visit-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}
.visit-dept {
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--navy);
}
.visit-date {
  font-size: 0.7rem;
  color: var(--muted);
}
.visit-doctor {
  font-size: 0.72rem;
  color: var(--slate);
  margin-bottom: 4px;
}
.visit-detail {
  display: none;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--hairline);
}
.visit-card.expanded .visit-detail { display: block; }
.detail-row {
  margin-bottom: 10px;
}
.detail-label {
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--teal);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 3px;
}
.detail-text {
  font-size: 0.82rem;
  color: var(--navy);
  line-height: 1.5;
}

/* Medication Timeline */
.timeline {
  position: relative;
  padding-left: 28px;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 11px; top: 8px; bottom: 8px;
  width: 2px;
  background: var(--border);
  border-radius: 1px;
}
.timeline-item {
  position: relative;
  padding: 12px 0;
}
.timeline-dot {
  position: absolute;
  left: -28px; top: 14px;
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--card);
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
}
.timeline-item.taken .timeline-dot {
  background: var(--sage-light);
  border-color: var(--sage);
}
.timeline-item.taken .timeline-dot::after {
  content: '✓';
  color: var(--sage);
  font-size: 0.7rem;
  font-weight: 700;
}
.timeline-item.missed .timeline-dot {
  background: var(--coral-light);
  border-color: var(--coral);
}
.timeline-item.missed .timeline-dot::after {
  content: '!';
  color: var(--coral);
  font-size: 0.8rem;
  font-weight: 700;
}
.timeline-item.pending .timeline-dot {
  border-color: var(--amber);
  animation: pendingPulse 2s ease infinite;
}
@keyframes pendingPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(217,119,6,0.15); }
  50% { box-shadow: 0 0 0 8px rgba(217,119,6,0); }
}
.timeline-time {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--slate);
  margin-bottom: 2px;
}
.timeline-drug {
  font-weight: 600;
  font-size: 0.88rem;
  color: var(--navy);
}
.timeline-detail {
  font-size: 0.72rem;
  color: var(--muted);
  margin-top: 2px;
}

/* Voice Button */
.voice-check-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--card);
  cursor: pointer;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  flex-shrink: 0;
}
.voice-check-btn.listening {
  border-color: var(--teal);
  background: var(--teal-bg);
  animation: voicePulse 1s ease infinite;
}
@keyframes voicePulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(15,118,110,0.2); }
  50% { box-shadow: 0 0 0 12px rgba(15,118,110,0); }
}
.voice-feedback {
  font-size: 0.7rem;
  color: var(--teal);
  margin-top: 4px;
  font-weight: 500;
  min-height: 18px;
}

/* Recording Screen */
.recording-overlay {
  background: var(--card);
  border: 2px solid var(--teal-light);
  border-radius: var(--radius-lg);
  padding: 32px 24px;
  text-align: center;
  margin-bottom: 14px;
}
.rec-wave {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  height: 48px;
  margin: 16px 0;
}
.rec-wave .bar {
  width: 3px;
  background: var(--teal);
  border-radius: 2px;
  animation: wave 0.8s ease infinite;
}
.rec-wave .bar:nth-child(1) { height: 16px; animation-delay: 0s; }
.rec-wave .bar:nth-child(2) { height: 28px; animation-delay: 0.1s; }
.rec-wave .bar:nth-child(3) { height: 40px; animation-delay: 0.2s; }
.rec-wave .bar:nth-child(4) { height: 24px; animation-delay: 0.3s; }
.rec-wave .bar:nth-child(5) { height: 32px; animation-delay: 0.4s; }
.rec-wave .bar:nth-child(6) { height: 20px; animation-delay: 0.5s; }
.rec-wave .bar:nth-child(7) { height: 36px; animation-delay: 0.6s; }
.rec-wave .bar:nth-child(8) { height: 22px; animation-delay: 0.7s; }
@keyframes wave {
  0%,100% { transform: scaleY(1); }
  50% { transform: scaleY(0.4); }
}
.rec-text {
  font-size: 0.9rem;
  color: var(--slate);
  min-height: 24px;
  line-height: 1.6;
}
.rec-btn {
  width: 72px; height: 72px;
  border-radius: 50%;
  border: none;
  background: var(--coral);
  color: #fff;
  font-size: 1.8rem;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 20px rgba(240,98,92,0.3);
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
}
.rec-btn.recording {
  background: var(--coral);
  animation: recPulse 1.5s ease infinite;
}
@keyframes recPulse {
  0%,100% { box-shadow: 0 4px 20px rgba(240,98,92,0.3); }
  50% { box-shadow: 0 4px 36px rgba(240,98,92,0.5); }
}

/* AI Extraction Card */
.extract-card {
  background: linear-gradient(135deg, var(--teal-bg), #F8FAFC);
  border: 1px solid var(--teal-light);
  border-radius: var(--radius);
  padding: 18px;
  margin-top: 14px;
}
.extract-header {
  font-weight: 600;
  font-size: 0.8rem;
  color: var(--teal);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.extract-field {
  padding: 8px 0;
  border-bottom: 1px solid var(--hairline);
  font-size: 0.82rem;
}
.extract-field:last-child { border: none; }
.extract-label {
  font-size: 0.66rem;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 2px;
}
.extract-value { color: var(--navy); }

/* Family Circle */
.family-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.family-member-card {
  background: var(--card);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  padding: 18px;
  text-align: center;
}
.family-avatar {
  width: 52px; height: 52px;
  border-radius: 50%;
  margin: 0 auto 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  font-family: var(--font-display);
}
.family-name {
  font-weight: 600;
  font-size: 0.85rem;
  margin-bottom: 4px;
}
.adherence-ring {
  width: 60px; height: 60px;
  border-radius: 50%;
  margin: 8px auto;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.adherence-pct {
  font-weight: 700;
  font-size: 0.9rem;
  font-family: var(--font-display);
}
.family-status {
  font-size: 0.68rem;
  margin-top: 4px;
  font-weight: 500;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 20px;
  border: none;
  border-radius: 22px;
  font-family: var(--font-body);
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary {
  background: var(--teal);
  color: #fff;
  width: 100%;
}
.btn-primary:hover { background: #0C6B63; }
.btn-outline {
  background: none;
  border: 1px solid var(--border);
  color: var(--slate);
}
.btn-outline:hover { border-color: var(--teal); color: var(--teal); }
.btn-sm {
  padding: 5px 14px;
  font-size: 0.72rem;
}

/* Badge */
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 0.65rem;
  font-weight: 600;
}
.badge-taken { background: var(--sage-light); color: var(--sage); }
.badge-pending { background: var(--amber-light); color: var(--amber); }
.badge-missed { background: var(--coral-light); color: var(--coral); }

/* Toast */
.toast {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--navy);
  color: #fff;
  padding: 10px 22px;
  border-radius: 22px;
  font-size: 0.78rem;
  z-index: 100;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  font-family: var(--font-body);
}
.toast.show { opacity: 1; }

/* Modal alert for medication reminder — full alarm */
.med-alert {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  background: var(--card);
  border-radius: var(--radius-lg);
  padding: 32px 24px 24px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(15,23,42,0.25);
  z-index: 50;
  max-width: 340px;
  width: 92%;
  display: none;
  border: 2px solid var(--coral);
}
.med-alert.show { display: block; animation: alarmIn 0.4s ease; }
@keyframes alarmIn {
  0% { opacity:0; transform:translate(-50%,-50%) scale(0.8); }
  60% { transform:translate(-50%,-50%) scale(1.04); }
  100% { opacity:1; transform:translate(-50%,-50%) scale(1); }
}
.med-alert .drug-icon { font-size: 3rem; margin-bottom: 8px; animation: bellShake 0.6s ease infinite; }
@keyframes bellShake {
  0%,100% { transform: rotate(0); }
  15% { transform: rotate(12deg); }
  30% { transform: rotate(-10deg); }
  45% { transform: rotate(8deg); }
  60% { transform: rotate(-6deg); }
  75% { transform: rotate(3deg); }
  90% { transform: rotate(-1deg); }
}
.med-alert .drug-name { font-weight: 700; font-size: 1.2rem; margin-bottom: 4px; color: var(--navy); }
.med-alert .drug-info { font-size: 0.82rem; color: var(--slate); margin-bottom: 8px; }
.med-alert .alert-question { font-size:0.9rem; color:var(--coral); font-weight:600; margin-bottom:14px; display:flex; align-items:center; justify-content:center; gap:6px; }
.med-alert .alert-question .ring-dot { width:8px; height:8px; background:var(--coral); border-radius:50%; animation: dotPulse 0.8s ease infinite; }
.med-alert .alert-btns { display: flex; gap: 8px; margin-bottom: 10px; }
.med-alert .alert-btns .btn { flex: 1; }
.med-alert .voice-status { font-size:0.72rem; min-height:20px; padding:6px 0; font-weight:500; border-radius:8px; margin-top:4px; }
.med-alert .voice-status.listening { color:var(--teal); background:var(--teal-bg); animation: voicePulse 1.2s ease infinite; }
.med-alert .voice-status.success { color:var(--sage); background:var(--sage-light); }
.med-alert .voice-status.retry { color:var(--amber); background:var(--amber-light); }

/* Overlay */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,0.3);
  z-index: 49;
  display: none;
}
.overlay.show { display: block; }

/* Prescription form */
.rx-form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.rx-input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 0.85rem;
  background: var(--card);
  color: var(--navy);
  outline: none;
  transition: border-color 0.2s;
}
.rx-input:focus { border-color: var(--teal); }
.rx-label {
  display: block;
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--slate);
  margin-bottom: 4px;
}
.rx-group { margin-bottom: 12px; }
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="header-row">
      <div>
        <div class="logo"><span class="logo-dot"></span>药叮咛</div>
        <div class="header-subtitle">从陪诊录音到用药提醒的家庭健康守护助手</div>
      </div>
      <div class="family-select" id="family-select">
        <button class="family-chip active" onclick="switchPatient('妈妈',this)">妈妈</button>
        <button class="family-chip" onclick="switchPatient('爸爸',this)">爸爸</button>
        <button class="family-chip" onclick="switchPatient('奶奶',this)">奶奶</button>
      </div>
    </div>
  </header>

  <main class="main">
    <!-- Tab 1: 就诊记录 -->
    <section class="section active" id="sec-records">
      <div style="margin-bottom:12px">
        <div class="card" style="background:linear-gradient(135deg, var(--teal-bg), #F0FDFA);border-color:var(--teal-light)">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:2rem">🏥</span>
            <div>
              <div style="font-weight:700;font-size:0.9rem;color:var(--teal)" id="records-patient-label">妈妈的就诊记录</div>
              <div style="font-size:0.7rem;color:var(--muted)" id="records-count"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="visit-list"></div>
      <button class="btn btn-outline" style="width:100%;margin-top:4px" onclick="addMockVisit()">+ 新增就诊记录（演示）</button>
    </section>

    <!-- Tab 2: 智能陪诊 -->
    <section class="section" id="sec-assist">
      <div class="recording-overlay" id="rec-panel">
        <div style="font-weight:600;font-size:0.85rem;color:var(--teal);margin-bottom:4px">🎙️ 智能陪诊模式</div>
        <div style="font-size:0.72rem;color:var(--muted)">录音自动转文字，AI提取关键医嘱</div>
        <div class="rec-wave" id="rec-wave">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <div class="rec-text" id="rec-text">点击下方按钮开始录音...</div>
        <button class="rec-btn" id="rec-btn" onclick="toggleRecording()">🎤</button>
        <div style="font-size:0.7rem;color:var(--muted);margin-top:8px" id="rec-hint">试试说："诊断是高血压，每天吃降压药，饭后一片，下个月复查"</div>
      </div>

      <!-- AI Extraction Result -->
      <div id="extract-result"></div>

      <!-- Manual Rx entry -->
      <div class="card" style="margin-top:14px">
        <div style="font-weight:600;font-size:0.85rem;margin-bottom:12px;color:var(--teal)">📸 手动录入处方 / 拍照识别</div>
        <div class="rx-group">
          <label class="rx-label">药品名称</label>
          <input class="rx-input" id="rx-name" placeholder="如：阿莫西林">
        </div>
        <div class="rx-form-row">
          <div class="rx-group">
            <label class="rx-label">每次剂量</label>
            <input class="rx-input" id="rx-dose" placeholder="如：1片">
          </div>
          <div class="rx-group">
            <label class="rx-label">每日次数</label>
            <select class="rx-input" id="rx-freq">
              <option value="1">每日1次</option>
              <option value="2">每日2次</option>
              <option value="3" selected>每日3次</option>
              <option value="4">每日4次</option>
            </select>
          </div>
        </div>
        <div class="rx-form-row">
          <div class="rx-group">
            <label class="rx-label">服用方式</label>
            <select class="rx-input" id="rx-timing">
              <option value="饭前">饭前</option>

// ============ SMART RECORDING ============
function initSpeech() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) return null;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = 'zh-CN';
  rec.interimResults = true;
  rec.continuous = true;
  return rec;
}

function toggleRecording() {
  if (isRecording) {
    stopRecording();
  } else {
    startRecording();
  }
}

function startRecording() {
  if (!recognition) recognition = initSpeech();
  if (!recognition) {
    showToast('⚠️ 请使用 Chrome 浏览器');
    return;
  }
  isRecording = true;
  const btn = document.getElementById('rec-btn');
  btn.classList.add('recording');
  btn.textContent = '⏹️';
  document.getElementById('rec-text').textContent = '正在聆听...';
  document.getElementById('rec-hint').textContent = '正在录音中，说出医生的诊断、用药和注意事项';

  let fullTranscript = '';
  recognition.onresult = function(e) {
    const t = Array.from(e.results).map(r=>r[0].transcript).join('');
    document.getElementById('rec-text').textContent = t || '正在聆听...';
    fullTranscript = t;
  };
  recognition.onerror = function() {
    document.getElementById('rec-text').textContent = fullTranscript || '识别中断，请重试';
    stopRecording();
  };
  recognition.start();
}

function stopRecording() {
  isRecording = false;
  const btn = document.getElementById('rec-btn');
  btn.classList.remove('recording');
  btn.textContent = '🎤';
  if (recognition) {
    try { recognition.stop(); } catch(e) {}
  }
  const transcript = document.getElementById('rec-text').textContent;
  if (transcript && transcript !== '正在聆听...' && transcript !== '点击下方按钮开始录音...') {
    extractMedicalInfo(transcript);
  } else {
    // Demo: show mock extraction
    mockExtraction();
  }
}

function extractMedicalInfo(text) {
  // NLP extraction from transcribed text
  let diagnosis = '';
  let meds = [];
  let notes = '';
  let followup = '';

  const diagMatch = text.match(/诊断[是为:：]?\s*(.+?)(?:[，,。．]|用药|处方|建议)/);
  if (diagMatch) diagnosis = diagMatch[1];

  const followMatch = text.match(/复查[：:]*\s*(.+?)(?:[，,。．]|$)/);
  if (followMatch) followup = followMatch[1];

  const noteMatch = text.match(/注意[：:]*\s*(.+?)(?:[，,。．]|$)/);
  if (noteMatch) notes = noteMatch[1];

  if (!diagnosis && !notes) {
    // Fall back to mock for demo
    mockExtraction();
    return;
  }

  showExtraction({ diagnosis, medications:meds, notes, followup });
}

// ============ MEDICATION MANAGEMENT ============
function generateSchedule(freq, timing) {
  const schedules = {
    1: { '空腹':['07:00'], '饭前':['07:00'], '饭后':['08:00'], '睡前':['21:00'] },
    2: { '空腹':['07:00','18:00'], '饭前':['07:00','18:00'], '饭后':['08:00','18:00'], '睡前':['13:00','21:00'] },
    3: { '空腹':['07:00','12:00','18:00'], '饭前':['07:00','12:00','18:00'], '饭后':['08:00','12:00','18:00'], '睡前':['09:00','15:00','21:00'] },
    4: { '饭后':['08:00','12:00','17:00','21:00'], '饭前':['07:00','11:00','17:00','21:00'] },
  };
  return schedules[freq]?.[timing] || schedules[3]['饭后'];
}

}

// ============ MED TIMELINE ============
function isMedicationActive(med, dateStr) {
  if (!med.startDate || !med.duration) return true;
  const start = new Date(med.startDate);
  const check = new Date(dateStr);
  const endDate = new Date(start);
  endDate.setDate(endDate.getDate() + med.duration);
  // Active if check date is within [startDate, startDate + duration]
  return check >= start && check < endDate;
}

function getDaysRemaining(med, dateStr) {
  if (!med.startDate || !med.duration) return -1;
  const start = new Date(med.startDate);
  const endDate = new Date(start);
  endDate.setDate(endDate.getDate() + med.duration);
  const check = new Date(dateStr);
  const diffMs = endDate.getTime() - check.getTime();
  return Math.ceil(diffMs / 86400000);
}

function refreshMedTimeline() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('meds-date').textContent = today;
  document.getElementById('meds-patient-label').textContent = currentPatient+'的用药计划';

  const patientMeds = medications.filter(m=>m.patient===currentPatient);
  const timeline = document.getElementById('med-timeline');
  const empty = document.getElementById('med-empty');

  if (patientMeds.length === 0) {
    timeline.innerHTML = '';
    empty.style.display = 'block';
    document.getElementById('meds-adherence').textContent = '—';
    return;
  }

  // Split into active and expired
  const activeMeds = patientMeds.filter(m=>isMedicationActive(m, today));
  const expiredMeds = patientMeds.filter(m=>!isMedicationActive(m, today));

  empty.style.display = 'none';

  // Build flat timeline of all scheduled doses for today (active meds only)
  let entries = [];
  const now = new Date();
  const currentMinutes = now.getHours()*60 + now.getMinutes();

  activeMeds.forEach(m => {
    const logs = m.logs[today] || {};
    const daysLeft = getDaysRemaining(m, today);
    m.schedule.forEach(t => {
      const [h,min] = t.split(':').map(Number);
      const tMinutes = h*60 + min;
      let status = 'pending';
      if (logs[t] === true) status = 'taken';
      else if (tMinutes < currentMinutes - 30) status = 'missed';
      else if (tMinutes < currentMinutes) status = 'pending';

      entries.push({
        medId: m.id, drug: m.drug, dose: m.dose,
        timing: m.timing, time: t, status, note: m.note,
        daysLeft,
      });
    });
  });

  entries.sort((a,b)=>a.time.localeCompare(b.time));

  // Calculate adherence (active meds only)
  const total = entries.length;
  const taken = entries.filter(e=>e.status==='taken').length;
  const pct = total>0 ? Math.round(taken/total*100) : 0;
  document.getElementById('meds-adherence').textContent = total>0 ? pct+'%' : '—';
  document.getElementById('meds-adherence').style.color = pct>=80 ? 'var(--sage)' : pct>=50 ? 'var(--amber)' : 'var(--coral)';

  let html = entries.map(e=>`
    <div class="timeline-item ${e.status}">
      <div class="timeline-dot"></div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div>
          <div class="timeline-time">${e.time}</div>
          <div class="timeline-drug">${e.drug} <span style="font-weight:400;font-size:0.72rem;color:var(--slate)">${e.dose}</span></div>
          <div class="timeline-detail">${e.timing}服用${e.note?' · '+e.note:''}${e.daysLeft>0&&e.daysLeft<=3 ? ` · <span style="color:var(--amber);font-weight:500">还剩${e.daysLeft}天</span>` : ''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="badge badge-${e.status}">${{taken:'已吃',pending:'待吃',missed:'漏吃'}[e.status]}</span>
          ${e.status==='pending'||e.status==='missed' ? `
            <button class="voice-check-btn" onclick="voiceCheckSpecific(${e.medId},'${e.time}','${e.drug.replace(/'/g,"\\'")}','${e.dose}')" title="语音确认">🎤</button>
          ` : ''}
        </div>
      </div>
      ${e.status==='missed' ? `<div style="font-size:0.7rem;color:var(--coral);margin-top:4px">⚠️ 已超时，请尽快补吃</div>` : ''}
    </div>
  `).join('');

  // Expired medications section
  if (expiredMeds.length > 0) {
    html += `
      <div style="margin-top:20px;padding-top:16px;border-top:2px dashed var(--border)">
        <div style="font-size:0.72rem;color:var(--muted);margin-bottom:8px;font-weight:500">📦 已到期疗程</div>
        ${expiredMeds.map(m=>`
          <div class="timeline-item" style="opacity:0.5">
            <div class="timeline-dot" style="background:var(--border);border-color:var(--muted)"></div>
            <div>
              <div class="timeline-drug" style="color:var(--muted)">${m.drug} <span style="font-size:0.7rem">${m.dose}</span></div>
              <div class="timeline-detail" style="color:var(--muted)">${m.startDate} 起 · ${m.duration}天疗程 · <span style="color:var(--sage)">已到期 ✓</span></div>
            </div>
          </div>
        `).join('')}
      </div>`;
  }

  if (activeMeds.length === 0 && expiredMeds.length === 0) {
    html = '';
    empty.style.display = 'block';
  }

  timeline.innerHTML = html;
  refreshFamily();
}

// ============ MEDICATION ALERT & AUTO VOICE CHECK ============
let alertAudioCtx = null;

function playAlarmSound() {
  try {
    if (!alertAudioCtx) alertAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = alertAudioCtx.currentTime;
    // Two-tone alarm: ding-ding ~ ding-ding
    [0, 0.15, 0.4, 0.55].forEach((delay, i) => {
      const osc = alertAudioCtx.createOscillator();
      const gain = alertAudioCtx.createGain();
      osc.connect(gain); gain.connect(alertAudioCtx.destination);
      osc.type = 'sine';
      osc.frequency.value = i % 2 === 0 ? 880 : 660;
      gain.gain.setValueAtTime(0.15, now + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.12);
      osc.start(now + delay);
      osc.stop(now + delay + 0.12);
    });
  } catch(e) { /* mute fallback */ }
}

function showMedAlert(medId, time, drug, dose) {
  // Don't stack alerts
  if (document.getElementById('med-alert').classList.contains('show')) return;

  currentAlertMed = { medId, time, drug, dose };
  document.getElementById('alert-drug').textContent = drug;
  document.getElementById('alert-info').textContent = `${dose} · ${time}`;
  document.getElementById('alert-voice-status').textContent = '🎤 正在听你回答...';
  document.getElementById('alert-voice-status').className = 'voice-status listening';
  document.getElementById('med-alert').classList.add('show');
  document.getElementById('alert-overlay').classList.add('show');

  // Play alarm sound
  playAlarmSound();
  // Repeat alarm every 5 seconds while alert is open
  let repeats = 0;
  const alarmInterval = setInterval(() => {
    if (!document.getElementById('med-alert').classList.contains('show')) {
      clearInterval(alarmInterval);
      return;
    }
    if (repeats < 4) { playAlarmSound(); repeats++; }
  }, 5000);

  // Auto-start voice recognition
  startVoiceCheck();
}

function hideMedAlert() {
  document.getElementById('med-alert').classList.remove('show');
  document.getElementById('alert-overlay').classList.remove('show');
  currentAlertMed = null;
  stopVoiceCheck();
}

function confirmMedTaken(taken) {
  if (!currentAlertMed) return;
  const { medId, time, drug, dose } = currentAlertMed;
  const today = new Date().toISOString().split('T')[0];
  const med = medications.find(m=>m.id===medId);
  if (!med) return;
  if (!med.logs[today]) med.logs[today] = {};
  med.logs[today][time] = taken;
  saveMeds();

  const statusDiv = document.getElementById('alert-voice-status');
  if (taken) {
    statusDiv.textContent = '✅ 已记录：' + drug + ' 已吃';
    statusDiv.className = 'voice-status success';
    playConfirmBeep(true);
  } else {
    statusDiv.textContent = '⏰ 30分钟后再次提醒';
    statusDiv.className = 'voice-status retry';
    playConfirmBeep(false);
  }
  showToast(taken ? '✅ 已记录：已吃药' : '⏰ 30分钟后再次提醒');

  // Close alert after a short delay
  const currentMed = currentAlertMed;
  setTimeout(() => {
    hideMedAlert();
    refreshMedTimeline();
    if (!taken) {
      // Re-alert in 30 seconds (demo: 15s)
      setTimeout(() => showMedAlert(currentMed.medId, currentMed.time, currentMed.drug, currentMed.dose), 15000);
    }
  }, taken ? 800 : 1500);
}

function playConfirmBeep(success) {
  try {
    if (!alertAudioCtx) alertAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = alertAudioCtx.createOscillator();
    const gain = alertAudioCtx.createGain();
    osc.connect(gain); gain.connect(alertAudioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = success ? 1047 : 330;
    gain.gain.setValueAtTime(0.12, alertAudioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, alertAudioCtx.currentTime + 0.2);
    osc.start(); osc.stop(alertAudioCtx.currentTime + 0.2);
  } catch(e) {}
}

// ============ AUTO VOICE CHECK (continuous listening) ============
let voiceCheckRecognition = null;
let voiceRetryCount = 0;
const MAX_VOICE_RETRIES = 3;

function startVoiceCheck() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    document.getElementById('alert-voice-status').textContent = '⚠️ 浏览器不支持语音，请用按钮';
    document.getElementById('alert-voice-status').className = 'voice-status retry';
    return;
  }
  stopVoiceCheck();
  voiceRetryCount = 0;
  _doVoiceListen();
}

function restartVoiceCheck() {
  voiceRetryCount = 0;
  document.getElementById('alert-voice-status').textContent = '🎤 正在听你回答...';
  document.getElementById('alert-voice-status').className = 'voice-status listening';
  _doVoiceListen();
}

function _doVoiceListen() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  voiceCheckRecognition = new SR();
  voiceCheckRecognition.lang = 'zh-CN';
  voiceCheckRecognition.interimResults = false;
  voiceCheckRecognition.continuous = false;

  voiceCheckRecognition.onresult = function(e) {
    const answer = e.results[0][0].transcript.trim().toLowerCase();
    const statusDiv = document.getElementById('alert-voice-status');

    const yesPatterns = /吃了|吃过了|嗯|对|是的|已经|吃了的|吃了呀|吃了哈|嗯嗯|吃了吃了|吃好了|刚吃|吃了药/;
    const noPatterns = /还没|没有|忘了|等会|等下|没吃|没呢|还没有|等一会儿|一会儿|没|不吃|不要/;

    if (yesPatterns.test(answer)) {
      statusDiv.textContent = `✅ 听到你说"${answer}" — 自动记录已吃`;
      statusDiv.className = 'voice-status success';
      playConfirmBeep(true);
      voiceRetryCount = 0;
      setTimeout(() => confirmMedTaken(true), 500);
    } else if (noPatterns.test(answer)) {
      statusDiv.textContent = `⏰ 听到你说"${answer}" — 稍后再提醒`;
      statusDiv.className = 'voice-status retry';
      playConfirmBeep(false);
      voiceRetryCount = 0;
      setTimeout(() => confirmMedTaken(false), 500);
    } else {
      voiceRetryCount++;
      if (voiceRetryCount < MAX_VOICE_RETRIES) {
        statusDiv.textContent = `❓ 没听清"${answer}"，再听一次... (${voiceRetryCount}/${MAX_VOICE_RETRIES})`;
        statusDiv.className = 'voice-status listening';
        setTimeout(() => _doVoiceListen(), 800);
      } else {
        statusDiv.textContent = '💬 语音未识别，请点击按钮回答';
        statusDiv.className = 'voice-status retry';
      }
    }
  };

  voiceCheckRecognition.onerror = function(e) {
    voiceRetryCount++;
    const statusDiv = document.getElementById('alert-voice-status');
    if (voiceRetryCount < MAX_VOICE_RETRIES) {
      statusDiv.textContent = `🎤 重新聆听中... (${voiceRetryCount}/${MAX_VOICE_RETRIES})`;
      setTimeout(() => _doVoiceListen(), 600);
    } else {
      statusDiv.textContent = '💬 语音未识别，请点击按钮回答';
      statusDiv.className = 'voice-status retry';
    }
  };

  voiceCheckRecognition.onend = function() {
    // If alert is still showing and we haven't processed a result, retry
    if (document.getElementById('med-alert').classList.contains('show') && voiceRetryCount > 0 && voiceRetryCount < MAX_VOICE_RETRIES) {
      setTimeout(() => _doVoiceListen(), 500);
    }
  };

  voiceCheckRecognition.start();
}

function stopVoiceCheck() {
  if (voiceCheckRecognition) {
    try { voiceCheckRecognition.stop(); } catch(e) {}
    voiceCheckRecognition = null;
  }
}

function voiceCheckSpecific(medId, time, drug, dose) {
  showMedAlert(medId, time, drug, dose);
}

// ============ FAMILY SYNC ============
function refreshFamily() {
  const today = new Date().toISOString().split('T')[0];
  const patients = ['妈妈','爸爸','奶奶'];
  const grid = document.getElementById('family-grid');
  const eventsDiv = document.getElementById('family-events');

  let events = [];

  grid.innerHTML = patients.map(p=>{
    const pMeds = medications.filter(m=>m.patient===p && isMedicationActive(m, today));
    const expiredCount = medications.filter(m=>m.patient===p && !isMedicationActive(m, today)).length;
    let total=0, taken=0, missed=0;

    pMeds.forEach(m=>{
      const logs = m.logs[today] || {};
      m.schedule.forEach(t=>{
        total++;
        if (logs[t]===true) taken++;
        else {
          const [h,min] = t.split(':').map(Number);
          const tMin = h*60+min;
          const nowMin = new Date().getHours()*60+new Date().getMinutes();
          if (tMin < nowMin - 30) missed++;
        }
      });
    });

    const pct = total>0 ? Math.round(taken/total*100) : 0;
    const ringColor = pct>=80 ? 'var(--sage)' : pct>=50 ? 'var(--amber)' : 'var(--coral)';
    const statusText = total===0 ? (expiredCount>0 ? `${expiredCount}个疗程已结束` : "无用药") : missed>0 ? `漏吃${missed}次` : pct===100 ? "全部完成 ✓" : `${taken}/${total} 已吃`;
    const statusColor = missed>0 ? "var(--coral)" : pct===100 ? "var(--sage)" : total===0 ? "var(--muted)" : "var(--amber)";

    if (missed > 0) events.push(`${p}有 ${missed} 次药漏吃`);

    const avatarColors = { '妈妈':'#FEE2E2', '爸爸':'#DBEAFE', '奶奶':'#FEF3C7' };
    const avatarEmoji = { '妈妈':'👩', '爸爸':'👨', '奶奶':'👵' };

    return `
      <div class="family-member-card">
        <div class="family-avatar" style="background:${avatarColors[p]}">${avatarEmoji[p]}</div>
        <div class="family-name">${p}</div>
        <div class="adherence-ring" style="background:conic-gradient(${ringColor} ${pct}%, var(--border) ${pct}%)">
          <div style="width:46px;height:46px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center">
            <span class="adherence-pct">${pct}%</span>
          </div>
        </div>
        <div class="family-status" style="color:${statusColor}">${statusText}</div>
      </div>
    `;
  }).join('');

  eventsDiv.innerHTML = events.length>0
    ? events.map(e=>`<div style="padding:4px 0;color:var(--coral)">⚠️ ${e}</div>`).join('')
    : '<div style="color:var(--sage)">✅ 全家人今日用药正常</div>';
}

// ============ MEDICATION TIMER ============
// ============ MEDICATION TIMER (with day transition) ============
let lastCheckedDay = new Date().toISOString().split('T')[0];

function startMedTimer() {
  if (medicationTimer) clearInterval(medicationTimer);
  lastCheckedDay = new Date().toISOString().split('T')[0];

  medicationTimer = setInterval(()=>{
    const now = new Date();
    const today = now.toISOString().split('T')[0];
    const currentMinutes = now.getHours()*60 + now.getMinutes();

    // === DAY TRANSITION DETECTION ===
    if (today !== lastCheckedDay) {
      lastCheckedDay = today;
      // New day: automatically reset — yesterday's logs stay, today starts fresh
      refreshMedTimeline();
      refreshFamily();
      showToast('🌅 新的一天，用药计划已重置');
    }

    // === CHECK ACTIVE MEDS ONLY ===
    medications.forEach(m=>{
      // Skip expired medications
      if (!isMedicationActive(m, today)) return;
      // Skip if not current patient
      if (m.patient !== currentPatient) return;

      const logs = m.logs[today] || {};
      m.schedule.forEach(t=>{
        const [h,min] = t.split(':').map(Number);
        const tMinutes = h*60 + min;
        // Alert within 1 minute of scheduled time if not taken
        if (Math.abs(currentMinutes - tMinutes) <= 1 && !logs[t]) {
          if (!document.getElementById('med-alert').classList.contains('show')) {
            showMedAlert(m.id, t, m.drug, m.dose);
          }
        }
      });
    });

    // Refresh timeline every 2 min
    if (now.getMinutes() % 2 === 0 && now.getSeconds() < 5) {
      const activeSection = document.querySelector('.section.active');
      if (activeSection && activeSection.id==='sec-meds') refreshMedTimeline();
    }
  }, 30000);
}

// ============ UTILS ============
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 1800);
}

document.getElementById('alert-overlay').addEventListener('click', hideMedAlert);

// ============ INIT ============
refreshVisits();
refreshMedTimeline();
refreshFamily();
startMedTimer();
</script>
