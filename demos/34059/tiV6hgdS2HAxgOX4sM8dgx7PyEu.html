<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI社恐翻译器</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  body { background: #f8f9fc; display: flex; justify-content: center; }
  .phone { width: 100%; max-width: 420px; min-height: 100vh; background: #fff; position: relative; }
  .input-area:focus-within { box-shadow: 0 0 0 3px rgba(139,92,246,0.1); }
  .fade-in { animation: fadeUp 0.4s ease forwards; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .result-card { animation: fadeUp 0.35s ease forwards; opacity: 0; }
  .result-card:nth-child(1) { animation-delay: 0.05s; }
  .result-card:nth-child(2) { animation-delay: 0.15s; }
  .result-card:nth-child(3) { animation-delay: 0.25s; }
  .result-card:nth-child(4) { animation-delay: 0.35s; }
</style>
</head>
<body>

<div class="phone px-5 pt-10 pb-8">

  <!-- Header -->
  <header class="mb-8">
    <h1 class="text-2xl font-bold text-gray-900 tracking-tight">AI社恐翻译器</h1>
    <p class="text-sm text-gray-400 mt-1">帮你听懂别人没说出口的话。</p>
  </header>

  <!-- Input Area -->
  <div class="mb-5">
    <textarea id="userInput"
      class="input-area w-full p-4 border border-gray-200 rounded-2xl text-[15px] text-gray-700 placeholder-gray-300 resize-none leading-relaxed transition"
      rows="3">这个方案不错，你再优化一下细节。</textarea>
  </div>

  <!-- Translate Button -->
  <button onclick="translateText()" id="translateBtn"
    class="w-full py-3.5 bg-violet-600 text-white font-semibold text-[15px] rounded-2xl hover:bg-violet-700 active:scale-[0.98] transition shadow-sm shadow-violet-200">
    🔍 开始翻译
  </button>

  <!-- Results -->
  <div id="resultsArea" class="hidden mt-6 space-y-3">
    <div class="result-card bg-violet-50 border border-violet-100 rounded-2xl p-4">
      <p class="text-xs text-violet-400 font-medium mb-1">表面意思</p>
      <p class="text-[15px] text-gray-800" id="surfaceText"></p>
    </div>
    <div class="result-card bg-amber-50 border border-amber-100 rounded-2xl p-4">
      <p class="text-xs text-amber-400 font-medium mb-1">潜台词</p>
      <p class="text-[15px] text-gray-800" id="subtextText"></p>
    </div>
    <div class="result-card bg-blue-50 border border-blue-100 rounded-2xl p-4">
      <p class="text-xs text-blue-400 font-medium mb-1">情绪</p>
      <p class="text-[15px] text-gray-800" id="emotionText"></p>
    </div>
    <div class="result-card bg-emerald-50 border border-emerald-100 rounded-2xl p-4">
      <p class="text-xs text-emerald-400 font-medium mb-1">建议回复</p>
      <p class="text-[15px] text-gray-800" id="replyText"></p>
    </div>
  </div>

  <!-- Empty state -->
  <div id="emptyHint" class="mt-8 text-center">
    <p class="text-sm text-gray-300">👆 输入一句话，看看 AI 怎么解读</p>
  </div>

  <!-- Divider -->
  <div class="flex items-center gap-3 my-8">
    <div class="flex-1 h-px bg-gray-100"></div>
    <span class="text-xs text-gray-300 font-medium">热门案例</span>
    <div class="flex-1 h-px bg-gray-100"></div>
  </div>

  <!-- Hot Cases -->
  <div class="space-y-2.5">
    <button onclick="selectCase('领导说：「这个方案再看看。」')"
      class="w-full bg-white border border-gray-100 rounded-2xl p-4 text-left hover:border-violet-200 hover:shadow-sm transition active:scale-[0.99]">
      <p class="text-xs text-gray-400 mb-0.5">👔 领导</p>
      <p class="text-[15px] text-gray-700">"这个方案再看看。"</p>
    </button>
    <button onclick="selectCase('面试官说：「回去等通知吧。」')"
      class="w-full bg-white border border-gray-100 rounded-2xl p-4 text-left hover:border-violet-200 hover:shadow-sm transition active:scale-[0.99]">
      <p class="text-xs text-gray-400 mb-0.5">💼 面试官</p>
      <p class="text-[15px] text-gray-700">"回去等通知吧。"</p>
    </button>
    <button onclick="selectCase('朋友说：「我都可以，你定吧。」')"
      class="w-full bg-white border border-gray-100 rounded-2xl p-4 text-left hover:border-violet-200 hover:shadow-sm transition active:scale-[0.99]">
      <p class="text-xs text-gray-400 mb-0.5">🤝 朋友</p>
      <p class="text-[15px] text-gray-700">"我都可以，你定吧。"</p>
    </button>
  </div>

  <!-- Footer -->
  <p class="text-center text-xs text-gray-300 mt-10">让社交更简单，让沟通更轻松。</p>

</div>

<script>
const mockData = {
  '这个方案不错，你再优化一下细节。': {
    surface: '方案整体不错。',
    subtext: '目前还没有达到预期标准。',
    emotion: '🙂 中性偏积极',
    reply: '好的，我会重点优化相关部分，并尽快提交新版方案。'
  },
  '领导说：「这个方案再看看。」': {
    surface: '需要进一步审阅方案内容。',
    subtext: '方案存在明显不足，需要较大调整，暂时无法通过。',
    emotion: '🤔 保留态度',
    reply: '我会梳理方案中的不足点，修改完善后再请您审阅。'
  },
  '面试官说：「回去等通知吧。」': {
    surface: '面试结果需要后续通知。',
    subtext: '大概率没有通过本轮面试，这是常见的婉拒表述。',
    emotion: '😶 中性 / 回避',
    reply: '好的，感谢您的时间，期待您的反馈。（建议同步准备其他机会）'
  },
  '朋友说：「我都可以，你定吧。」': {
    surface: '对选择没有明确偏好。',
    subtext: '可能希望你来主导决策，也可能是怕选错被埋怨。',
    emotion: '😊 随和 / 信任',
    reply: '那这次我来定，下次换你哦！你觉得A和B哪个稍微好一点点？'
  }
};

function selectCase(text) {
  document.getElementById('userInput').value = text;
  translateText();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function translateText() {
  const input = document.getElementById('userInput').value.trim();
  if (!input) return;

  const btn = document.getElementById('translateBtn');
  btn.textContent = '⏳ 分析中...';
  btn.disabled = true;

  setTimeout(() => {
    const match = mockData[input];
    const data = match || {
      surface: '需结合具体语境理解。',
      subtext: '建议观察语气、表情和上下文综合判断真实含义。',
      emotion: '🔍 不确定',
      reply: '请根据你与对方的关系和场景，选择最合适的回应方式。'
    };

    document.getElementById('surfaceText').textContent = data.surface;
    document.getElementById('subtextText').textContent = data.subtext;
    document.getElementById('emotionText').textContent = data.emotion;
    document.getElementById('replyText').textContent = data.reply;

    document.getElementById('emptyHint').classList.add('hidden');
    const results = document.getElementById('resultsArea');
    results.classList.remove('hidden');
    results.querySelectorAll('.result-card').forEach(c => { c.style.animation = 'none'; c.offsetHeight; c.style.animation = ''; });

    btn.textContent = '🔍 开始翻译';
    btn.disabled = false;
  }, 1000);
}

// Auto-run on load
window.addEventListener('DOMContentLoaded', () => setTimeout(translateText, 300));
</script>

</body>
</html>
