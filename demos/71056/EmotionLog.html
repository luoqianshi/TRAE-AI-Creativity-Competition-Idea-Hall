<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>情绪画记 - 把心情变成画</title>
    <style>
        :root {
            --primary: #6C63FF;
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #2D3436;
            --text-sub: #636E72;
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            --radius: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        
        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 40px;
        }

        /* Header */
        header {
            padding: 10px 0;
            text-align: center;
        }
        header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
        header p { font-size: 0.85rem; color: var(--text-sub); margin-top: 4px; }

        /* Main Canvas Area */
        .canvas-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .placeholder-art {
            width: 100%;
            height: 240px;
            background: linear-gradient(45deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
            opacity: 0.8;
            animation: breathe 4s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.02); opacity: 1; }
        }

        .mood-tag {
            margin-top: 16px;
            padding: 6px 16px;
            background: rgba(108, 99, 255, 0.1);
            color: var(--primary);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Input Area */
        .input-area {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        textarea {
            width: 100%;
            border: none;
            background: transparent;
            resize: none;
            font-size: 1rem;
            line-height: 1.5;
            outline: none;
            min-height: 60px;
            color: var(--text-main);
        }
        textarea::placeholder { color: #b2bec3; }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .voice-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: #f1f2f6;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .voice-btn.active { background: #ff7675; color: white; animation: pulse 1.5s infinite; }

        .gen-btn {
            padding: 10px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .gen-btn:active { transform: scale(0.96); }

        /* Calendar Strip */
        .calendar-strip {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 4px;
            scrollbar-width: none; /* Firefox */
        }
        .calendar-strip::-webkit-scrollbar { display: none; }

        .cal-item {
            flex-shrink: 0;
            width: 56px;
            height: 72px;
            background: var(--card-bg);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            cursor: pointer;
            transition: all 0.2s;
        }
        .cal-item.today { border: 2px solid var(--primary); background: white; }
        .cal-item span:first-child { font-size: 0.7rem; color: var(--text-sub); }
        .cal-dot { width: 20px; height: 20px; border-radius: 50%; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 118, 117, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 118, 117, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 118, 117, 0); }
        }

        /* Loading State */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            border-radius: var(--radius);
        }
        .loading-overlay.show { opacity: 1; pointer-events: auto; }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid #f1f2f6;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>情绪画记</h1>
        <p>今天的心情，是什么颜色的？</p>
    </header>

    <!-- 情绪画作展示区 -->
    <div class="canvas-card" id="canvasCard">
        <div class="placeholder-art" id="artDisplay">🎨</div>
        <div class="mood-tag" id="moodTag">等待记录...</div>
        
        <div class="loading-overlay" id="loading">
            <div class="spinner"></div>
            <span style="font-size:0.85rem; color:var(--text-sub)">AI正在感受你的情绪...</span>
        </div>
    </div>

    <!-- 输入区 -->
    <div class="input-area">
        <textarea id="moodInput" placeholder="说点什么吧...比如'今天加班好累但晚霞很美'"></textarea>
        <div class="action-bar">
            <button class="voice-btn" id="voiceBtn" title="语音输入">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            </button>
            <button class="gen-btn" id="genBtn">生成画作</button>
        </div>
    </div>

    <!-- 情绪日历条 -->
    <div class="calendar-strip" id="calendarStrip">
        <!-- JS动态生成 -->
    </div>
</div>

<script>
    // 模拟情绪色彩映射
    const moodColors = {
        '平静': 'linear-gradient(45deg, #a8edea 0%, #fed6e3 100%)',
        '开心': 'linear-gradient(45deg, #f6d365 0%, #fda085 100%)',
        '疲惫': 'linear-gradient(45deg, #667eea 0%, #764ba2 100%)',
        '焦虑': 'linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%)',
        '悲伤': 'linear-gradient(45deg, #89f7fe 0%, #66a6ff 100%)',
        '默认': 'linear-gradient(45deg, #fdfbfb 0%, #ebedee 100%)'
    };

    const emojis = { '平静': '🌿', '开心': '☀️', '疲惫': '🌙', '焦虑': '🌧️', '悲伤': '💧', '默认': '🎨' };

    // 初始化日历
    function initCalendar() {
        const strip = document.getElementById('calendarStrip');
        const today = new Date();
        for (let i = 6; i >= 0; i--) {
            const d = new Date(today);
            d.setDate(d.getDate() - i);
            const isToday = i === 0;
            const item = document.createElement('div');
            item.className = `cal-item ${isToday ? 'today' : ''}`;
            
            // 模拟历史数据
            const moods = Object.keys(moodColors).filter(k => k !== '默认');
            const randomMood = i > 0 ? moods[Math.floor(Math.random() * moods.length)] : null;
            const dotColor = randomMood ? moodColors[randomMood] : '#eee';
            
            item.innerHTML = `
                <span>${d.getDate()}日</span>
                <div class="cal-dot" style="background: ${dotColor}"></div>
            `;
            strip.appendChild(item);
        }
    }

    // 模拟AI分析与生成
    function generateArt() {
        const input = document.getElementById('moodInput').value.trim();
        if (!input) return alert('请先写下或说出今天的心情哦~');

        const loading = document.getElementById('loading');
        const artDisplay = document.getElementById('artDisplay');
        const moodTag = document.getElementById('moodTag');

        loading.classList.add('show');

        // 简单关键词匹配模拟AI
        let mood = '平静';
        if (/累|疲|困|加班/.test(input)) mood = '疲惫';
        else if (/开心|高兴|棒|美|哈哈/.test(input)) mood = '开心';
        else if (/烦|焦虑|担心|压力/.test(input)) mood = '焦虑';
        else if (/难过|哭|伤心|委屈/.test(input)) mood = '悲伤';

        setTimeout(() => {
            loading.classList.remove('show');
            artDisplay.style.background = moodColors[mood];
            artDisplay.textContent = emojis[mood];
            moodTag.textContent = `今日情绪：${mood} · 已归档`;
            
            // 更新今天的日历点
            const todayDot = document.querySelector('.cal-item.today .cal-dot');
            if (todayDot) todayDot.style.background = moodColors[mood];
            
            document.getElementById('moodInput').value = '';
        }, 1800);
    }

    // 语音按钮交互模拟
    const voiceBtn = document.getElementById('voiceBtn');
    voiceBtn.addEventListener('click', () => {
        voiceBtn.classList.toggle('active');
        if (voiceBtn.classList.contains('active')) {
            setTimeout(() => {
                voiceBtn.classList.remove('active');
                document.getElementById('moodInput').value = '今天虽然很忙，但傍晚看到了很美的晚霞，感觉被治愈了~';
            }, 2000);
        }
    });

    document.getElementById('genBtn').addEventListener('click', generateArt);
    
    // Enter键快捷生成
    document.getElementById('moodInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            generateArt();
        }
    });

    initCalendar();
</script>

</body>
</html>
