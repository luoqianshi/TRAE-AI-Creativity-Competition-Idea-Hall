<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 面试官 — 智能模拟面试训练</title>
<style>
:root {
  --bg: #0f1923;
  --card: #1a2a3a;
  --accent: #00d4aa;
  --accent2: #0099ff;
  --warn: #ffaa00;
  --good: #00d4aa;
  --text: #e8edf2;
  --sub: #7a8fa0;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}
.hero {
  text-align: center; padding: 48px 20px 24px;
  background: linear-gradient(135deg, #0f1923 0%, #0d2840 100%);
}
.hero h1 { font-size: 2.4em; font-weight: 800; }
.hero h1 span { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.hero p { color: var(--sub); margin-top: 8px; }

.container { max-width: 860px; margin: 0 auto; padding: 0 20px 50px; }

/* 场景状态栏 */
.status-bar {
  display: flex; gap: 16px; margin: 20px 0; flex-wrap: wrap;
}
.stat-card {
  flex: 1; min-width: 150px; background: var(--card); border-radius: 14px;
  padding: 16px; text-align: center; border: 1px solid rgba(255,255,255,.06);
}
.stat-card .val { font-size: 1.8em; font-weight: 700; color: var(--accent); }
.stat-card .lbl { font-size: .8em; color: var(--sub); margin-top: 4px; }

/* 面试类型选择 */
.type-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px; margin: 16px 0;
}
.type-card {
  padding: 14px; border-radius: 12px; cursor: pointer; text-align: center;
  background: var(--card); border: 2px solid rgba(255,255,255,.06); transition: all .3s;
}
.type-card:hover { border-color: rgba(0,212,170,.3); transform: translateY(-2px); }
.type-card.active { border-color: var(--accent); background: rgba(0,212,170,.08); }
.type-card .icon { font-size: 1.8em; display: block; margin-bottom: 4px; }
.type-card .tname { font-weight: 600; }
.type-card .tcnt { font-size: .75em; color: var(--sub); margin-top: 2px; }

/* 对话区域 */
.chat-zone {
  background: var(--card); border-radius: 20px; padding: 24px;
  margin: 20px 0; min-height: 350px; max-height: 500px; overflow-y: auto;
  border: 1px solid rgba(255,255,255,.06);
}
.msg { margin-bottom: 18px; display: flex; gap: 10px; animation: fadeIn .4s; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
.msg .avatar {
  width: 38px; height: 38px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 1.2em; flex-shrink: 0;
}
.msg.ai .avatar { background: rgba(0,212,170,.15); }
.msg.user .avatar { background: rgba(0,153,255,.15); }
.msg .bubble {
  background: rgba(255,255,255,.04); padding: 12px 16px; border-radius: 16px;
  border-top-left-radius: 4px; max-width: 80%; line-height: 1.7;
}
.msg.user { flex-direction: row-reverse; }
.msg.user .bubble { border-top-left-radius: 16px; border-top-right-radius: 4px; background: rgba(0,153,255,.08); }

/* 输入区 */
.input-row { display: flex; gap: 12px; margin: 16px 0; }
.input-row input {
  flex: 1; padding: 14px 18px; border-radius: 14px; border: 1px solid rgba(255,255,255,.1);
  background: var(--card); color: #fff; font-size: .95em; outline: none;
}
.input-row input:focus { border-color: var(--accent); }
.input-row button {
  padding: 14px 28px; border-radius: 14px; border: none;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; font-weight: 700; cursor: pointer; transition: all .3s;
}
.input-row button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,212,170,.25); }
.input-row button:disabled { opacity: .5; cursor: not-allowed; transform: none; }

/* 评分展示 */
.score-panel {
  background: var(--card); border-radius: 20px; padding: 24px;
  margin: 20px 0; border: 1px solid rgba(255,255,255,.08); display: none;
}
.score-panel.show { display: block; }
.score-overview {
  display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin: 16px 0;
}
.score-item {
  text-align: center; min-width: 100px; padding: 16px;
  background: rgba(255,255,255,.03); border-radius: 14px;
}
.score-item .sval { font-size: 2em; font-weight: 700; }
.score-item .slbl { font-size: .8em; color: var(--sub); margin-top: 4px; }
.score-item .sval.good { color: var(--good); }
.score-item .sval.warn { color: var(--warn); }
.score-item .sval.accent { color: var(--accent2); }

.feedback-list { margin-top: 16px; }
.fb-item {
  padding: 10px 14px; margin: 8px 0; border-radius: 10px;
  background: rgba(255,255,255,.03); font-size: .9em; display: flex; gap: 8px; align-items: flex-start;
}

/* 按钮 */
.btn-row { display: flex; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
.btn {
  padding: 12px 24px; border-radius: 12px; border: none; font-weight: 600;
  cursor: pointer; transition: all .3s; font-size: .9em;
}
.btn-primary { background: var(--accent); color: #0f1923; }
.btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
.btn-outline:hover { background: rgba(0,212,170,.1); }
.btn-primary:hover { transform: translateY(-1px); }
</style>
</head>
<body>

<div class="hero">
  <h1>💼 AI <span>面试官</span></h1>
  <p>模拟真实面试场景，AI 出题、评分、给反馈，助你拿下心仪 offer</p>
</div>

<div class="container">
  <div class="status-bar" id="statusBar">
    <div class="stat-card">
      <div class="val" id="qCount">0</div>
      <div class="lbl">已回答问题</div>
    </div>
    <div class="stat-card">
      <div class="val" id="totalScore">--</div>
      <div class="lbl">综合评分</div>
    </div>
    <div class="stat-card">
      <div class="val" style="color:var(--accent2);" id="roundNum">R1</div>
      <div class="lbl">面试轮次</div>
    </div>
  </div>

  <label style="color:var(--sub);font-size:.9em;">🎯 选择面试类型</label>
  <div class="type-grid" id="typeGrid">
    <div class="type-card active" data-type="技术">
      <span class="icon">💻</span>
      <div class="tname">技术面试</div>
      <div class="tcnt">算法 · 系统设计 · 项目</div>
    </div>
    <div class="type-card" data-type="产品">
      <span class="icon">📊</span>
      <div class="tname">产品面试</div>
      <div class="tcnt">需求分析 · 数据驱动 · 竞品</div>
    </div>
    <div class="type-card" data-type="运营">
      <span class="icon">📱</span>
      <div class="tname">运营面试</div>
      <div class="tcnt">增长策略 · 用户运营 · 活动</div>
    </div>
    <div class="type-card" data-type="设计">
      <span class="icon">🎨</span>
      <div class="tname">设计面试</div>
      <div class="tcnt">作品集 · 设计思维 · 交互</div>
    </div>
  </div>

  <div class="chat-zone" id="chatZone">
    <div class="msg ai">
      <div class="avatar">🤖</div>
      <div class="bubble">你好！我是你的 AI 面试官。选择面试类型后，点击「开始面试」，我会模拟真实面试场景向你提问。准备好了吗？😊</div>
    </div>
  </div>

  <div class="input-row" id="inputRow">
    <input type="text" id="answerInput" placeholder="在这里输入你的回答……" disabled>
    <button id="btnSend" disabled>发送</button>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="btnStart">🚀 开始面试</button>
    <button class="btn btn-outline" id="btnScore" style="display:none;">📊 结束并评分</button>
    <button class="btn btn-outline" id="btnReset" style="display:none;">🔄 重新开始</button>
  </div>

  <div class="score-panel" id="scorePanel">
    <h3 style="color:var(--accent);">📊 面试评分报告</h3>
    <div class="score-overview" id="scoreOverview"></div>
    <div class="feedback-list" id="feedbackList"></div>
  </div>
</div>

<script>
// 题库
const questionBank = {
  '技术': [
    '请简单介绍一下你最有挑战性的一个技术项目？',
    '你在项目中遇到过什么性能瓶颈？怎么解决的？',
    '请解释一下你对面向对象设计原则的理解？',
    '你是如何保证代码质量的？有什么具体实践？',
    '请描述一次你主导技术方案选型的经历？',
  ],
  '产品': [
    '你最喜欢的 App 是什么？为什么？如果让你改进它，你会怎么做？',
    '请分析一下最近上线的一个新功能，说说你的看法？',
    '如何衡量一个产品功能是否成功？你会定哪些指标？',
    '描述一次你从用户反馈中发现问题并推动解决的经历？',
    '如果你负责的产品DAU下降了20%，你会怎么排查和应对？',
  ],
  '运营': [
    '请分享一个你策划过的最成功的线上活动？',
    '如何提升一个新用户的次日留存率？说说你的思路？',
    '面对竞品的大规模补贴，你会制定什么应对策略？',
    '你如何判断一个运营渠道是否值得持续投入？',
    '请描述一下你对"私域运营"的理解和实践？',
  ],
  '设计': [
    '请分享一个你最满意的作品，讲讲设计思路？',
    '你是如何处理产品和开发之间关于设计方案的争议的？',
    '你认为一个好的用户体验设计应该遵循哪些原则？',
    '请描述一次你通过用户研究改变设计决策的经历？',
    '在设计一个复杂功能时，你如何平衡美观和易用性？',
  ]
};

const feedbacks = [
  '回答结构清晰，逻辑性强，建议多举实际案例支撑观点。',
  '表达流畅自然，如果能量化成果会更有说服力。',
  '核心观点到位，可以补充更多细节让回答更丰满。',
  '思考角度独特，展现了不错的专业素养，继续保持。',
  '回答紧扣问题，展示了你的实践能力。下次可以展示更多数据。',
  '自信大方，沟通能力强，建议准备一些反问环节的问题。',
];

let interviewType = '技术';
let questions = [];
let currentQ = 0;
let answers = [];
let started = false;

// 类型选择
document.getElementById('typeGrid').addEventListener('click', function(e) {
  const card = e.target.closest('.type-card');
  if (!card || started) return;
  document.querySelectorAll('.type-card').forEach(c => c.classList.remove('active'));
  card.classList.add('active');
  interviewType = card.dataset.type;
});

// 开始面试
document.getElementById('btnStart').addEventListener('click', startInterview);
document.getElementById('btnScore').addEventListener('click', showScore);
document.getElementById('btnReset').addEventListener('click', resetInterview);
document.getElementById('btnSend').addEventListener('click', sendAnswer);
document.getElementById('answerInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendAnswer();
});

function startInterview() {
  if (started) return;
  started = true;
  questions = [...questionBank[interviewType]].sort(() => Math.random() - .5).slice(0, 4);
  currentQ = 0;
  answers = [];

  document.getElementById('chatZone').innerHTML = '';
  document.getElementById('scorePanel').classList.remove('show');
  document.getElementById('btnStart').style.display = 'none';
  document.getElementById('btnScore').style.display = 'inline-block';
  document.getElementById('btnReset').style.display = 'inline-block';
  document.getElementById('answerInput').disabled = false;
  document.getElementById('btnSend').disabled = false;
  document.getElementById('totalScore').textContent = '--';
  document.getElementById('qCount').textContent = '0';
  document.getElementById('roundNum').textContent = 'R1';
  document.querySelectorAll('.type-card').forEach(c => c.style.pointerEvents = 'none');

  addMessage('ai', `好的，我们开始进行<b>${interviewType}面试</b>。准备好了吗？以下是第一个问题：`);
  setTimeout(() => askQuestion(), 800);
}

function askQuestion() {
  if (currentQ >= questions.length) {
    addMessage('ai', '面试环节结束！感谢你的参与。点击下方「结束并评分」查看你的面试报告。');
    document.getElementById('answerInput').disabled = true;
    document.getElementById('btnSend').disabled = true;
    return;
  }
  document.getElementById('roundNum').textContent = `R${currentQ + 1}`;
  addMessage('ai', `第 ${currentQ + 1} 题：${questions[currentQ]}`);
}

function sendAnswer() {
  const input = document.getElementById('answerInput');
  const answer = input.value.trim();
  if (!answer || !started || currentQ >= questions.length) return;

  answers.push({ question: questions[currentQ], answer: answer });
  addMessage('user', answer);
  input.value = '';
  currentQ++;
  document.getElementById('qCount').textContent = answers.length;

  // AI 反馈
  setTimeout(() => {
    const fb = feedbacks[Math.floor(Math.random() * feedbacks.length)];
    addMessage('ai', `收到你的回答！${fb} ${currentQ < questions.length ? '我们来看下一题。' : ''}`);
    setTimeout(() => askQuestion(), 600);
  }, 600);
}

function showScore() {
  if (answers.length === 0) { alert('还没有回答任何问题哦！'); return; }

  const expressive = Math.floor(Math.random() * 25 + 65);
  const logic = Math.floor(Math.random() * 25 + 65);
  const professional = Math.floor(Math.random() * 25 + 65);
  const overall = Math.round((expressive + logic + professional) / 3);

  document.getElementById('scoreOverview').innerHTML = `
    <div class="score-item">
      <div class="sval ${overall >= 80 ? 'good' : overall >= 70 ? 'accent' : 'warn'}">${overall}</div>
      <div class="slbl">综合评分</div>
    </div>
    <div class="score-item">
      <div class="sval ${expressive >= 80 ? 'good' : expressive >= 70 ? 'accent' : 'warn'}">${expressive}</div>
      <div class="slbl">表达能力</div>
    </div>
    <div class="score-item">
      <div class="sval ${logic >= 80 ? 'good' : logic >= 70 ? 'accent' : 'warn'}">${logic}</div>
      <div class="slbl">逻辑思维</div>
    </div>
    <div class="score-item">
      <div class="sval ${professional >= 80 ? 'good' : professional >= 70 ? 'accent' : 'warn'}">${professional}</div>
      <div class="slbl">专业深度</div>
    </div>
  `;

  const strengths = [
    '✅ 回答逻辑清晰，层次分明，展现了良好的结构化思维。',
    '✅ 语言表达流畅自然，沟通能力突出。',
    '✅ 对问题理解深入，能抓住核心要点。',
  ];
  const improvements = [
    '💡 可以多结合具体数据或案例，让回答更有说服力。',
    '💡 建议准备一些反问面试官的问题，展现你的主动性。',
    '💡 部分回答可以更简练，避免过度展开。',
  ];

  document.getElementById('feedbackList').innerHTML = [
    ...strengths.sort(()=>Math.random()-.5).slice(0,2),
    ...improvements.sort(()=>Math.random()-.5).slice(0,2)
  ].map(f => `<div class="fb-item">${f}</div>`).join('');

  document.getElementById('totalScore').textContent = overall;
  document.getElementById('scorePanel').classList.add('show');
  document.getElementById('scorePanel').scrollIntoView({ behavior: 'smooth' });
}

function resetInterview() {
  started = false;
  currentQ = 0;
  answers = [];
  document.getElementById('chatZone').innerHTML = `
    <div class="msg ai"><div class="avatar">🤖</div><div class="bubble">面试已重置。选择面试类型后，点击「开始面试」重新开始！😊</div></div>`;
  document.getElementById('scorePanel').classList.remove('show');
  document.getElementById('btnStart').style.display = 'inline-block';
  document.getElementById('btnScore').style.display = 'none';
  document.getElementById('btnReset').style.display = 'none';
  document.getElementById('answerInput').disabled = true;
  document.getElementById('btnSend').disabled = true;
  document.getElementById('answerInput').value = '';
  document.getElementById('totalScore').textContent = '--';
  document.getElementById('qCount').textContent = '0';
  document.getElementById('roundNum').textContent = 'R1';
  document.querySelectorAll('.type-card').forEach(c => c.style.pointerEvents = 'auto');
}

function addMessage(type, text) {
  const zone = document.getElementById('chatZone');
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.innerHTML = `<div class="avatar">${type === 'ai' ? '🤖' : '👤'}</div><div class="bubble">${text}</div>`;
  zone.appendChild(div);
  zone.scrollTop = zone.scrollHeight;
}
</script>
</body>
</html>
