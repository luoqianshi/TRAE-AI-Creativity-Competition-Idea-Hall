<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拾光小助手 Demo</title>
  <style>
    :root {
      --bg: #fff9f2;
      --bg-soft: #fff1df;
      --panel: rgba(255, 252, 247, 0.82);
      --panel-strong: rgba(255, 248, 238, 0.96);
      --line: rgba(211, 164, 113, 0.22);
      --text: #2f241d;
      --sub: #7a6554;
      --primary: #f08a4b;
      --primary-2: #ffb066;
      --accent: #ffd9b6;
      --shadow: 0 24px 70px rgba(187, 118, 57, 0.18);
      --radius-xl: 34px;
      --radius-lg: 24px;
      --radius-md: 18px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 15%, rgba(255, 209, 163, 0.7), transparent 24%),
        radial-gradient(circle at 82% 10%, rgba(255, 237, 213, 0.95), transparent 28%),
        linear-gradient(180deg, #fffdf8 0%, #fff8ee 45%, #fff4e7 100%);
      overflow: hidden;
    }

    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.18) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: .22;
      mask-image: radial-gradient(circle at center, black 50%, transparent 100%);
    }

    .stage {
      min-height: 100%;
      display: grid;
      grid-template-columns: minmax(260px, 380px) minmax(320px, 430px);
      gap: 34px;
      justify-content: center;
      align-items: center;
      padding: 28px;
    }

    .intro {
      padding: 30px;
      border-radius: 32px;
      background: rgba(255,255,255,.5);
      border: 1px solid rgba(255,255,255,.75);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 219, 186, 0.55);
      color: #bf6328;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .03em;
    }

    h1 {
      margin: 18px 0 12px;
      font-size: clamp(34px, 5vw, 56px);
      line-height: 1.05;
      letter-spacing: -.04em;
    }

    .intro p {
      margin: 0;
      color: var(--sub);
      font-size: 16px;
      line-height: 1.85;
    }

    .intro strong { color: #cb6b2a; }

    .tips {
      margin-top: 22px;
      display: grid;
      gap: 12px;
    }

    .tip {
      padding: 14px 16px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,246,235,.82));
      border: 1px solid var(--line);
      color: #785f4b;
      font-size: 14px;
      box-shadow: 0 12px 28px rgba(199, 137, 78, .1);
    }

    .phone-shell {
      width: min(430px, 100%);
      aspect-ratio: 430 / 860;
      border-radius: 48px;
      padding: 14px;
      background: linear-gradient(180deg, #4e3527, #261b16);
      box-shadow: 0 32px 90px rgba(95, 53, 24, .28);
      position: relative;
      animation: floatY 5.2s ease-in-out infinite;
    }

    .phone-shell::before {
      content: "";
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 24px;
      border-radius: 0 0 18px 18px;
      background: #201713;
      z-index: 4;
    }

    .screen {
      position: relative;
      height: 100%;
      border-radius: 36px;
      overflow: hidden;
      background: linear-gradient(180deg, #fffaf4 0%, #fff5ea 100%);
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(255, 210, 166, 0.35), transparent 32%);
      pointer-events: none;
    }

    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 22px 8px;
      font-size: 12px;
      color: #8e7562;
      position: relative;
      z-index: 2;
    }

    .app {
      position: relative;
      z-index: 2;
      height: calc(100% - 38px);
      display: flex;
      flex-direction: column;
      padding: 6px 18px 18px;
    }

    .app-head {
      padding: 8px 4px 12px;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .app-title { font-size: 28px; font-weight: 900; letter-spacing: -.03em; }
    .app-sub { color: var(--sub); font-size: 13px; margin-top: 2px; }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary-2), var(--primary));
      color: white;
      font-size: 20px;
      box-shadow: 0 12px 26px rgba(240,138,75,.28);
    }

    .search-wrap {
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(234, 186, 138, 0.35);
      border-radius: 22px;
      padding: 10px;
      box-shadow: 0 14px 28px rgba(216, 157, 104, 0.14);
    }

    .search-bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff8f1;
      border-radius: 16px;
      padding: 12px 14px;
      border: 1px solid rgba(235, 194, 151, 0.45);
    }

    .input-box input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
    }

    .search-btn, .ghost-btn {
      border: none;
      cursor: pointer;
      border-radius: 16px;
      font-weight: 800;
      transition: .22s ease;
    }

    .search-btn {
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--primary), #e7742e);
      color: white;
      box-shadow: 0 14px 24px rgba(240,138,75,.28);
    }

    .ghost-btn {
      margin-top: 10px;
      width: 100%;
      padding: 11px 14px;
      background: rgba(255, 224, 194, 0.45);
      color: #9a5c2f;
      border: 1px solid rgba(240,138,75,.12);
    }

    .search-btn:hover, .ghost-btn:hover { transform: translateY(-1px); }

    .hint {
      margin-top: 10px;
      color: #8f7562;
      font-size: 12px;
      line-height: 1.7;
      min-height: 20px;
    }

    .album-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 4px 12px;
    }

    .album-head h2 {
      margin: 0;
      font-size: 18px;
    }

    .chip {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 219, 186, .46);
      color: #96572c;
      font-size: 12px;
      font-weight: 800;
    }

    .grid {
      flex: 1;
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding-right: 2px;
      align-content: start;
    }

    .grid::-webkit-scrollbar { width: 6px; }
    .grid::-webkit-scrollbar-thumb { background: rgba(221, 167, 113, .45); border-radius: 999px; }

    .photo-card {
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid rgba(233, 191, 146, 0.25);
      box-shadow: 0 16px 32px rgba(218, 158, 107, 0.12);
      transition: transform .28s ease, opacity .28s ease, filter .28s ease, box-shadow .28s ease;
      cursor: pointer;
    }

    .photo-card:hover { transform: translateY(-4px); box-shadow: 0 22px 36px rgba(218, 158, 107, 0.18); }
    .photo-card.dim { opacity: .28; filter: grayscale(.2) blur(.3px) saturate(.8); }
    .photo-card.highlight { outline: 2px solid rgba(240,138,75,.72); transform: translateY(-3px) scale(1.01); }
    .photo-card.hidden { display: none; }

    .thumb {
      aspect-ratio: 1 / 1;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #ffdcb8, #fff2e0);
    }

    .thumb svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .meta {
      padding: 12px 12px 14px;
    }

    .name {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      padding: 6px 8px;
      border-radius: 999px;
      font-size: 11px;
      color: #8b531f;
      background: rgba(255, 224, 194, .52);
      border: 1px solid rgba(240,138,75,.12);
      white-space: nowrap;
    }

    .match-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.85);
      color: #d06d2b;
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 10px 18px rgba(203, 128, 63, .14);
      opacity: 0;
      transform: translateY(-4px);
      transition: .24s ease;
    }

    .photo-card.highlight .match-badge {
      opacity: 1;
      transform: translateY(0);
    }

    .modal {
      position: absolute;
      inset: 0;
      background: rgba(74, 47, 31, 0.34);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 18px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .28s ease;
      z-index: 8;
    }

    .modal.show {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      width: 100%;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(255,246,236,.96));
      border: 1px solid rgba(236, 194, 149, 0.35);
      box-shadow: 0 24px 50px rgba(79, 49, 26, 0.2);
      transform: translateY(18px) scale(.98);
      transition: transform .3s ease;
      overflow: hidden;
    }

    .modal.show .sheet { transform: translateY(0) scale(1); }

    .sheet-cover {
      height: 220px;
      background: linear-gradient(135deg, #ffe0bf, #fff3e6);
    }

    .sheet-cover svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .sheet-body {
      padding: 18px 18px 20px;
    }

    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 12px;
    }

    .sheet-title {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .sheet-sub {
      color: var(--sub);
      font-size: 13px;
      line-height: 1.7;
    }

    .close-btn {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      background: rgba(255, 224, 194, 0.5);
      color: #995c30;
      font-size: 18px;
      font-weight: 800;
    }

    .sheet-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .sheet-tag {
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255, 218, 185, 0.52);
      color: #8a4f22;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid rgba(240,138,75,.12);
    }

    .bottom-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
      padding: 12px;
      border-radius: 22px;
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(232, 190, 145, 0.28);
    }

    .nav-item {
      text-align: center;
      padding: 10px 8px;
      border-radius: 16px;
      color: #8a705d;
      font-size: 12px;
      font-weight: 700;
      background: transparent;
    }

    .nav-item.active {
      background: rgba(255, 220, 189, 0.52);
      color: #c96a2b;
    }

    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @media (max-width: 980px) {
      body { overflow: auto; }
      .stage {
        grid-template-columns: 1fr;
        padding: 22px 16px 30px;
      }
      .intro { order: 1; }
      .phone-shell { order: 2; margin: 0 auto; }
    }

    @media (max-width: 520px) {
      .stage { gap: 20px; }
      .intro { padding: 22px; }
      .phone-shell { width: 100%; }
      .search-bar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="ambient"></div>
  <div class="stage">
    <section class="intro">
      <div class="eyebrow">📱 可交互产品 Demo</div>
      <h1>拾光小助手</h1>
      <p>
        这不是方案介绍页，而是一个接近真实手机 App 操作体验的 Demo。
        你可以直接在右侧手机界面里体验 <strong>AI 自动打标签</strong>、<strong>自然语言搜照片</strong>、<strong>查看照片详情标签</strong> 这三个核心能力。
      </p>
      <div class="tips">
        <div class="tip">① 在搜索框输入：<strong>去年夏天在海边的那张</strong>，点击“搜索”</div>
        <div class="tip">② 命中的照片会被高亮，未命中的照片会变暗</div>
        <div class="tip">③ 点击任意照片，查看它的完整 AI 标签详情</div>
      </div>
    </section>

    <section class="phone-shell">
      <div class="screen">
        <div class="status">
          <span>9:41</span>
          <span>5G · 96%</span>
        </div>

        <div class="app">
          <div class="app-head">
            <div class="title-row">
              <div>
                <div class="app-title">拾光小助手</div>
                <div class="app-sub">用自然语言，找到你想回看的那张照片</div>
              </div>
              <div class="avatar">📸</div>
            </div>

            <div class="search-wrap">
              <div class="search-bar">
                <div class="input-box">
                  <span>🔎</span>
                  <input id="searchInput" type="text" value="去年夏天在海边的那张" placeholder="输入一句话试试，如：去年夏天在海边的那张" />
                </div>
                <button class="search-btn" id="searchBtn">搜索</button>
              </div>
              <button class="ghost-btn" id="resetBtn">查看全部照片</button>
              <div class="hint" id="searchHint">试试搜索：去年夏天在海边的那张</div>
            </div>

            <div class="album-head">
              <h2>智能相册</h2>
              <div class="chip" id="countChip">共 6 张</div>
            </div>
          </div>

          <div class="grid" id="photoGrid"></div>

          <div class="bottom-bar">
            <div class="nav-item active">🖼️ 相册</div>
            <div class="nav-item">✨ 智能整理</div>
            <div class="nav-item">👤 我的</div>
          </div>
        </div>

        <div class="modal" id="detailModal">
          <div class="sheet">
            <div class="sheet-cover" id="detailVisual"></div>
            <div class="sheet-body">
              <div class="sheet-head">
                <div>
                  <div class="sheet-title" id="detailTitle">照片详情</div>
                  <div class="sheet-sub" id="detailDesc">AI 已识别这张照片的全部标签</div>
                </div>
                <button class="close-btn" id="closeBtn">✕</button>
              </div>
              <div class="sheet-tags" id="detailTags"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const photos = [
      {
        id: 'beach',
        name: '海边夏日',
        emoji: '🏖️',
        description: '去年夏天和朋友去海边时拍下的照片。',
        tags: ['🏖️ 海边', '☀️ 夏天', '👫 朋友', '🧳 旅行', '📍 去年'],
        keywords: ['去年', '夏天', '海边', '朋友', '旅行', '海浪', '沙滩'],
        art: renderArt('beach')
      },
      {
        id: 'hotpot',
        name: '火锅聚餐',
        emoji: '🍲',
        description: '和朋友聚会吃火锅的热闹时刻。',
        tags: ['🍲 火锅', '👫 朋友', '🌃 夜晚', '🎉 聚会'],
        keywords: ['火锅', '朋友', '聚会', '夜晚', '吃饭'],
        art: renderArt('hotpot')
      },
      {
        id: 'camp',
        name: '露营夜景',
        emoji: '🏕️',
        description: '上次露营时拍到的夜空和帐篷。',
        tags: ['🏕️ 露营', '🌙 夜景', '🔥 篝火', '👫 朋友'],
        keywords: ['露营', '夜景', '朋友', '星空', '帐篷', '篝火'],
        art: renderArt('camp')
      },
      {
        id: 'family',
        name: '家庭晚餐',
        emoji: '👨‍👩‍👧',
        description: '全家一起吃饭的温暖瞬间。',
        tags: ['👨‍👩‍👧 家人', '🍽️ 吃饭', '🏠 家里', '❤️ 温馨'],
        keywords: ['家人', '吃饭', '家庭', '温馨', '晚餐'],
        art: renderArt('family')
      },
      {
        id: 'pet',
        name: '小猫午后',
        emoji: '🐱',
        description: '阳光下打盹的小猫。',
        tags: ['🐱 宠物', '☀️ 下午', '🏠 家里', '😴 休闲'],
        keywords: ['宠物', '小猫', '下午', '家里', '休闲'],
        art: renderArt('pet')
      },
      {
        id: 'mountain',
        name: '山顶远眺',
        emoji: '⛰️',
        description: '登山后拍下的远景和云海。',
        tags: ['⛰️ 山景', '🌤️ 白天', '🚶 徒步', '🧳 旅行'],
        keywords: ['山', '山景', '徒步', '旅行', '白天', '远景'],
        art: renderArt('mountain')
      }
    ];

    const grid = document.getElementById('photoGrid');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const resetBtn = document.getElementById('resetBtn');
    const searchHint = document.getElementById('searchHint');
    const countChip = document.getElementById('countChip');
    const modal = document.getElementById('detailModal');
    const detailTitle = document.getElementById('detailTitle');
    const detailDesc = document.getElementById('detailDesc');
    const detailTags = document.getElementById('detailTags');
    const detailVisual = document.getElementById('detailVisual');
    const closeBtn = document.getElementById('closeBtn');

    function renderGrid(items) {
      grid.innerHTML = items.map(photo => `
        <article class="photo-card" data-id="${photo.id}">
          <div class="thumb">${photo.art}</div>
          <div class="match-badge">匹配成功</div>
          <div class="meta">
            <div class="name">${photo.emoji} ${photo.name}</div>
            <div class="tags">
              ${photo.tags.slice(0, 3).map(tag => `<span class="tag">${tag}</span>`).join('')}
            </div>
          </div>
        </article>
      `).join('');

      grid.querySelectorAll('.photo-card').forEach(card => {
        card.addEventListener('click', () => openDetail(card.dataset.id));
      });

      countChip.textContent = `共 ${items.length} 张`;
    }

    function normalize(text) {
      return String(text).toLowerCase().replace(/\s+/g, '');
    }

    function scorePhoto(photo, query) {
      const q = normalize(query);
      if (!q) return 0;
      let score = 0;
      photo.keywords.forEach(word => {
        if (q.includes(normalize(word))) score += 2;
      });
      photo.tags.forEach(tag => {
        const plain = normalize(tag.replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu, ''));
        if (plain && q.includes(plain)) score += 1;
      });
      if (q.includes(normalize(photo.name))) score += 2;
      return score;
    }

    function runSearch() {
      const query = searchInput.value.trim();
      const cards = [...grid.querySelectorAll('.photo-card')];

      if (!query) {
        cards.forEach(card => card.classList.remove('dim', 'highlight', 'hidden'));
        searchHint.textContent = '请输入一句自然语言描述，比如：去年夏天在海边的那张';
        countChip.textContent = `共 ${photos.length} 张`;
        return;
      }

      const results = photos
        .map(photo => ({ photo, score: scorePhoto(photo, query) }))
        .sort((a, b) => b.score - a.score);

      const matchedIds = results.filter(item => item.score > 0).map(item => item.photo.id);

      cards.forEach(card => {
        const matched = matchedIds.includes(card.dataset.id);
        card.classList.remove('dim', 'highlight', 'hidden');
        if (matched) {
          card.classList.add('highlight');
        } else {
          card.classList.add('dim');
        }
      });

      if (matchedIds.length === 0) {
        searchHint.textContent = `没有找到和“${query}”相关的照片，试试更简单的描述。`;
        countChip.textContent = '共 0 张匹配';
      } else {
        const top = photos.find(p => p.id === matchedIds[0]);
        searchHint.textContent = `已为你找到 ${matchedIds.length} 张相关照片，最匹配的是「${top.name}」。`;
        countChip.textContent = `匹配 ${matchedIds.length} 张`;
      }
    }

    function resetSearch() {
      searchInput.value = '';
      grid.querySelectorAll('.photo-card').forEach(card => {
        card.classList.remove('dim', 'highlight', 'hidden');
      });
      searchHint.textContent = '试试搜索：去年夏天在海边的那张';
      countChip.textContent = `共 ${photos.length} 张`;
    }

    function openDetail(id) {
      const photo = photos.find(item => item.id === id);
      if (!photo) return;
      detailTitle.textContent = `${photo.emoji} ${photo.name}`;
      detailDesc.textContent = photo.description;
      detailTags.innerHTML = photo.tags.map(tag => `<span class="sheet-tag">${tag}</span>`).join('');
      detailVisual.innerHTML = photo.art;
      modal.classList.add('show');
    }

    function closeDetail() {
      modal.classList.remove('show');
    }

    searchBtn.addEventListener('click', runSearch);
    resetBtn.addEventListener('click', resetSearch);
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') runSearch();
    });
    closeBtn.addEventListener('click', closeDetail);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeDetail();
    });

    renderGrid(photos);
    runSearch();

    function renderArt(type) {
      const common = 'xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice"';
      const map = {

        pet: `<svg ${common}><rect width="200" height="200" fill="#fff4e7"/><circle cx="158" cy="48" r="22" fill="#ffd37c" opacity=".8"/><rect x="0" y="136" width="200" height="64" fill="#f6d4ac"/><ellipse cx="102" cy="112" rx="44" ry="36" fill="#f3bf7d"/><circle cx="84" cy="84" r="14" fill="#f3bf7d"/><circle cx="120" cy="84" r="14" fill="#f3bf7d"/><polygon points="72,74 82,54 92,76" fill="#f0b570"/><polygon points="112,76 122,54 132,74" fill="#f0b570"/><circle cx="91" cy="108" r="4" fill="#5a3b2b"/><circle cx="113" cy="108" r="4" fill="#5a3b2b"/><path d="M94 122 Q102 128 110 122" stroke="#5a3b2b" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`,
        mountain: `<svg ${common}><rect width="200" height="200" fill="#eef7ff"/><rect x="0" y="136" width="200" height="64" fill="#d5ebff"/><circle cx="154" cy="42" r="18" fill="#ffd181"/><polygon points="20,150 76,70 130,150" fill="#8eb6a2"/><polygon points="84,150 134,84 186,150" fill="#6d957f"/><polygon points="60,94 76,70 92,94" fill="#ffffff"/><polygon points="118,104 134,84 150,104" fill="#ffffff"/><path d="M34 62 C72 34, 108 34, 144 62" stroke="#ffffff" stroke-width="12" fill="none" opacity=".9" stroke-linecap="round"/></svg>`
      };
      return map[type] || map.beach;
    }
  </script>
</body>
