{% extends "base.html" %}
{% block content %}
<h2 class="page-title">{% if form_type == 'edit' %}✏️ 编辑学历学位{% else %}➕ 新增学历学位{% endif %}</h2>

<form method="post" style="max-width:800px">
    <input type="hidden" name="emp_no" value="{{emp_no}}">
    
    <div class="form-group">
        <label>学历 *</label>
        <select name="education_level" required>
            <option value="">请选择</option>
            <option value="高中" {% if record.education_level == '高中' %}selected{% endif %}>高中</option>
            <option value="大专" {% if record.education_level == '大专' %}selected{% endif %}>大专</option>
            <option value="本科" {% if record.education_level == '本科' %}selected{% endif %}>本科</option>
            <option value="硕士" {% if record.education_level == '硕士' %}selected{% endif %}>硕士</option>
            <option value="博士" {% if record.education_level == '博士' %}selected{% endif %}>博士</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>学位</label>
        <input type="text" name="degree" value="{{record.degree or ''}}">
    </div>
    
    <div class="form-group">
        <label>毕业院校 *</label>
        <input type="text" name="school" value="{{record.school or ''}}" required>
    </div>
    
    <div class="form-group">
        <label>专业 *</label>
        <input type="text" name="major" value="{{record.major or ''}}" required>
    </div>
    
    <div class="form-group">
        <label>入学时间 *</label>
        <input type="date" name="start_date" value="{{record.start_date or ''}}" required>
    </div>
    
    <div class="form-group">
        <label>毕业时间 *</label>
        <input type="date" name="end_date" value="{{record.end_date or ''}}" required>
    </div>
    
    <div style="display:flex;gap:10px">
        <button type="submit" class="btn btn-success">保存</button>
        <a href="/employee_archive/detail/{{emp_no}}" class="btn btn-secondary">取消</a>
    </div>
</form>
{% endblock %}
