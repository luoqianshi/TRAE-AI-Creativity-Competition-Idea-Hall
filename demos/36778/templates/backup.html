{% extends "base.html" %}

{% block content %}
<div class="page-title">📦 数据备份管理</div>

<div class="card">
    <h3 style="margin-bottom:15px;">备份操作</h3>
    <button class="btn btn-success" onclick="location.href='/backup/create'">立即备份</button>
</div>

<div class="card">
    <h3 style="margin-bottom:15px;">备份列表</h3>
    <table>
        <tr style="background:#f5f5f5;color:#000000;font-weight:bold;">
            <th style="padding:12px;">备份时间</th>
            <th style="padding:12px;">文件大小</th>
            <th style="padding:12px;">操作</th>
        </tr>
        {% for backup in backups %}
        <tr>
            <td style="padding:10px;">{{ backup.time }}</td>
            <td style="padding:10px;">{{ "{:.2f} KB".format(backup.size / 1024) }}</td>
            <td style="padding:10px;">
                <a href="/backup/download/{{ backup.filename }}" class="btn btn-secondary" style="padding:4px 10px;font-size:12px;margin-right:5px;">下载</a>
                <button class="btn btn-danger" style="padding:4px 10px;font-size:12px;margin-right:5px;" onclick="confirmRestore('{{ backup.filename }}')">恢复</button>
                <button class="btn" style="padding:4px 10px;font-size:12px;" onclick="confirmDelete('{{ backup.filename }}')">删除</button>
            </td>
        </tr>
        {% endfor %}
        {% if backups|length == 0 %}
        <tr>
            <td colspan="3" style="text-align:center;padding:20px;">暂无备份记录</td>
        </tr>
        {% endif %}
    </table>
</div>

<script>
function confirmRestore(filename) {
    if (confirm('确定要从备份 ' + filename + ' 恢复数据吗？\n\n⚠️ 警告：这将覆盖当前所有数据！')) {
        location.href = '/backup/restore/' + filename;
    }
}

function confirmDelete(filename) {
    if (confirm('确定要删除备份 ' + filename + ' 吗？')) {
        location.href = '/backup/delete/' + filename;
    }
}
</script>
{% endblock %}
