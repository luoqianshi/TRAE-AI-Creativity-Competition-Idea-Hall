{% extends "base.html" %}
{% block content %}
<h2 class="page-title">➕ 新增城市社保公积金配置</h2>

<form action="/social_config/add" method="post" class="form-container">
    <div class="form-group">
        <label>城市名称 *</label>
        <input type="text" name="city" required placeholder="如：北京、上海、广州">
    </div>
    
    <div class="form-group">
        <label>养老保险比例 (%) *</label>
        <input type="number" name="pension_rate" step="0.01" required placeholder="如：8.00">
    </div>
    
    <div class="form-group">
        <label>医疗保险比例 (%) *</label>
        <input type="number" name="medical_rate" step="0.01" required placeholder="如：2.00">
    </div>
    
    <div class="form-group">
        <label>失业保险比例 (%) *</label>
        <input type="number" name="unemployment_rate" step="0.001" required placeholder="如：0.50">
    </div>
    
    <div class="form-group">
        <label>公积金比例 (%) *</label>
        <input type="number" name="gjj_rate" step="0.01" required placeholder="如：12.00">
    </div>
    
    <div class="form-group">
        <label>社保基数下限 *</label>
        <input type="number" name="social_min" required placeholder="如：7162">
    </div>
    
    <div class="form-group">
        <label>社保基数上限 *</label>
        <input type="number" name="social_max" required placeholder="如：35811">
    </div>
    
    <div class="form-group">
        <label>公积金基数下限 *</label>
        <input type="number" name="gjj_min" required placeholder="如：2540">
    </div>
    
    <div class="form-group">
        <label>公积金基数上限 *</label>
        <input type="number" name="gjj_max" required placeholder="如：35811">
    </div>
    
    <div class="form-group">
        <label>医疗保险固定费用</label>
        <input type="number" name="medical_fee" placeholder="如：3">
    </div>
    
    <div class="form-group">
        <label>公积金上限</label>
        <input type="number" name="gjj_cap" placeholder="如：4297">
    </div>
    
    <div class="form-actions">
        <button type="submit" class="btn btn-success">保存</button>
        <a href="/social_config" class="btn btn-secondary">取消</a>
    </div>
</form>
{% endblock %}
