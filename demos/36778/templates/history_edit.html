{% extends "base.html" %}
{% block content %}
<h2 class="page-title">📝 编辑历史工资记录</h2>

<form method="post" action="/history/edit/{{record.emp_no}}/{{record.year_month}}" style="max-width:800px;margin:20px auto;padding:20px;background:#f8f9fa;border-radius:8px">
    
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px">
        <div class="form-group">
            <label>员工工号</label>
            <input type="text" value="{{record.emp_no}}" readonly style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;background:#eee">
            <input type="hidden" name="emp_no" value="{{record.emp_no}}">
        </div>
        
        <div class="form-group">
            <label>姓名</label>
            <input type="text" value="{{record.name}}" readonly style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;background:#eee">
            <input type="hidden" name="name" value="{{record.name}}">
        </div>
        
        <div class="form-group">
            <label>工资月份</label>
            <input type="text" value="{{record.year_month}}" readonly style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;background:#eee">
            <input type="hidden" name="year_month" value="{{record.year_month}}">
        </div>
        
        <div class="form-group">
            <label>发放月份</label>
            <input type="text" name="pay_month" value="{{record.pay_month}}" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
    </div>
    
    <hr style="margin:20px 0;border-color:#ddd">
    
    <h4 style="margin-bottom:15px">收入项目</h4>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:15px">
        <div class="form-group">
            <label>基本工资 *</label>
            <input type="number" name="base_sal" step="0.01" value="{{record.base_sal}}" required style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
        
        <div class="form-group">
            <label>奖金</label>
            <input type="number" name="bonus" step="0.01" value="{{record.bonus}}" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
        
        <div class="form-group">
            <label>津贴</label>
            <input type="number" name="allowance" step="0.01" value="{{record.allowance}}" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
        
        <div class="form-group">
            <label>扣款</label>
            <input type="number" name="deduct" step="0.01" value="{{record.deduct}}" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
        
        <div class="form-group">
            <label>经济补偿金</label>
            <input type="number" name="compensation" step="0.01" value="{{record.compensation|default(0)}}" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
    </div>
    
    <h4 style="margin:20px 0 15px 0">五险一金</h4>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:15px">
        <div class="form-group">
            <label>养老保险</label>
            <input type="number" name="pension" step="0.01" value="{{record.pension}}" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
        
        <div class="form-group">
            <label>医疗保险</label>
            <input type="number" name="medical" step="0.01" value="{{record.medical}}" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
        
        <div class="form-group">
            <label>失业保险</label>
            <input type="number" name="unemployment" step="0.01" value="{{record.unemployment}}" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
        
        <div class="form-group">
            <label>公积金</label>
            <input type="number" name="gjj" step="0.01" value="{{record.gjj}}" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
    </div>
    
    <h4 style="margin:20px 0 15px 0">个税信息</h4>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px">
        <div class="form-group">
            <label>社保后收入</label>
            <input type="number" name="after_social" step="0.01" value="{{record.after_social}}" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
        
        <div class="form-group">
            <label>累计个税</label>
            <input type="number" name="cumulative_tax" step="0.01" value="{{record.cumulative_tax|default(0)}}" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
        
        <div class="form-group">
            <label>本月个税</label>
            <input type="number" name="tax" step="0.01" value="{{record.tax}}" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
    </div>
    
    <h4 style="margin:20px 0 15px 0">实发工资</h4>
    <div class="form-group" style="max-width:200px">
        <label>实发工资</label>
        <input type="number" name="real_pay" step="0.01" value="{{record.real_pay}}" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
    </div>
    
    <div style="margin-top:20px;display:flex;gap:10px">
        <button type="submit" class="btn btn-success">✅ 保存修改</button>
        <a href="/history" class="btn btn-secondary">返回历史记录</a>
    </div>
</form>
{% endblock %}
