{% extends "base.html" %}
{% block content %}
<h2 class="page-title">{% if form_type == 'edit' %}✏️ 编辑从业履历{% else %}➕ 新增从业履历{% endif %}</h2>

<form method="post" style="max-width:800px">
    <input type="hidden" name="emp_no" value="{{emp_no}}">
    
    <div class="form-group">
        <label>入职时间 *</label>
        <input type="date" name="join_date" value="{{career_info.join_date or ''}}" required>
    </div>
    
    <div class="form-group">
        <label>参加工作时间 *</label>
        <input type="date" name="work_start_date" value="{{career_info.work_start_date or ''}}" required>
    </div>
    
    <div class="form-group">
        <label>工作年限（自动计算）</label>
        <input type="text" name="work_years" value="{{career_info.work_years or ''}}" readonly>
    </div>
    
    <div class="form-group">
        <label>证券/金融从业起始时间</label>
        <input type="date" name="finance_start_date" value="{{career_info.finance_start_date or ''}}">
    </div>
    
    <div class="form-group">
        <label>证券/金融从业年限（自动计算）</label>
        <input type="text" name="finance_years" value="{{career_info.finance_years or ''}}" readonly>
    </div>
    
    <div class="form-group">
        <label>基金从业资格</label>
        <select name="fund_qualification">
            <option value="">请选择</option>
            <option value="有" {% if career_info.fund_qualification == '有' %}selected{% endif %}>有</option>
            <option value="无" {% if career_info.fund_qualification == '无' %}selected{% endif %}>无</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>基金从业证书编号</label>
        <input type="text" name="fund_cert_no" value="{{career_info.fund_cert_no or ''}}">
    </div>
    
    <div style="display:flex;gap:10px">
        <button type="submit" class="btn btn-success">保存</button>
        <a href="/employee_archive/detail/{{emp_no}}" class="btn btn-secondary">取消</a>
    </div>
</form>
{% endblock %}
