{% extends "base.html" %}
{% block content %}
<h2 class="page-title">{% if form_type == 'edit' %}✏️ 编辑薪酬社保{% else %}➕ 新增薪酬社保{% endif %}</h2>

<form method="post" style="max-width:800px">
    <input type="hidden" name="emp_no" value="{{emp_no}}">
    
    <div class="form-group">
        <label>生效日期 *</label>
        <input type="date" name="effective_date" value="{{record.effective_date or ''}}" required>
    </div>
    
    <div class="form-group">
        <label>税前基础工资 *</label>
        <input type="number" name="base_salary" value="{{record.base_salary or 0}}" step="0.01" required>
    </div>
    
    <div class="form-group">
        <label>岗位工资 *</label>
        <input type="number" name="position_salary" value="{{record.position_salary or 0}}" step="0.01" required>
    </div>
    
    <div class="form-group">
        <label>绩效工资 *</label>
        <input type="number" name="performance_salary" value="{{record.performance_salary or 0}}" step="0.01" required>
    </div>
    
    <div class="form-group">
        <label>社保地 *</label>
        <select name="social_location" required>
            <option value="">请选择</option>
            <option value="北京" {% if record.social_location == '北京' %}selected{% endif %}>北京</option>
            <option value="上海" {% if record.social_location == '上海' %}selected{% endif %}>上海</option>
        </select>
    </div>
    
    <div style="display:flex;gap:10px">
        <button type="submit" class="btn btn-success">保存</button>
        <a href="/employee_archive/detail/{{emp_no}}" class="btn btn-secondary">取消</a>
    </div>
</form>

<div style="margin-top:20px;padding:15px;background:#fff3cd;border:1px solid #ffc107;border-radius:4px">
    <strong>⚠️ 注意：</strong>
    <p style="margin:5px 0 0 0">每次调薪会生成一条新的薪资记录，不会覆盖旧数据。系统会保留所有历史薪资记录。</p>
</div>
{% endblock %}
