{% extends "base.html" %}
{% block content %}
<h2 class="page-title">📝 添加历史工资记录</h2>

<!-- 引入 Choices.js -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js@9.0.1/public/assets/styles/choices.min.css">
<script src="https://cdn.jsdelivr.net/npm/choices.js@9.0.1/public/assets/scripts/choices.min.js"></script>

<form method="post" action="/history/add" style="max-width:800px;margin:20px auto;padding:20px;background:#f8f9fa;border-radius:8px">
    
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px">
        <div class="form-group">
            <label>员工工号 *（支持搜索）</label>
            <select name="emp_no" id="emp_select" required style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
                <option value="">请选择员工</option>
                {% for emp in employees %}
                <option value="{{emp.emp_no}}" data-name="{{emp.name}}" data-dept="{{emp.dept}}" data-city="{{emp.city}}">{{emp.emp_no}} - {{emp.name}}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label>姓名（自动填充）</label>
            <input type="text" name="name" id="emp_name" readonly style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;background:#eee">
        </div>
        
        <div class="form-group">
            <label>部门（自动填充）</label>
            <input type="text" name="dept" id="emp_dept" readonly style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;background:#eee">
        </div>
        
        <div class="form-group">
            <label>城市（自动填充）</label>
            <input type="text" name="city" id="emp_city" readonly style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;background:#eee">
        </div>
        
        <div class="form-group">
            <label>工资月份 *（如：2025-12）</label>
            <input type="text" name="year_month" placeholder="格式：YYYY-MM，如2025-12" required pattern="\d{4}-\d{2}" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
        
        <div class="form-group">
            <label>发放月份 *（如：2026-01）</label>
            <input type="text" name="pay_month" placeholder="格式：YYYY-MM，如2026-01" required pattern="\d{4}-\d{2}" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
    </div>
    
    <hr style="margin:20px 0;border-color:#ddd">
    
    <h4 style="margin-bottom:15px">收入项目</h4>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:15px">
        <div class="form-group">
            <label>基本工资 *</label>
            <input type="number" name="base_sal" step="0.01" required style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
        
        <div class="form-group">
            <label>奖金</label>
            <input type="number" name="bonus" step="0.01" value="0" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
        
        <div class="form-group">
            <label>津贴</label>
            <input type="number" name="allowance" step="0.01" value="0" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
        
        <div class="form-group">
            <label>扣款</label>
            <input type="number" name="deduct" step="0.01" value="0" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
    </div>
    
    <h4 style="margin:20px 0 15px 0">五险一金</h4>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:15px">
        <div class="form-group">
            <label>养老保险</label>
            <input type="number" name="pension" step="0.01" value="0" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
        
        <div class="form-group">
            <label>医疗保险</label>
            <input type="number" name="medical" step="0.01" value="0" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
        
        <div class="form-group">
            <label>失业保险</label>
            <input type="number" name="unemployment" step="0.01" value="0" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
        
        <div class="form-group">
            <label>公积金</label>
            <input type="number" name="gjj" step="0.01" value="0" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
    </div>
    
    <h4 style="margin:20px 0 15px 0">个税信息</h4>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px">
        <div class="form-group">
            <label>社保后收入</label>
            <input type="number" name="after_social" step="0.01" value="0" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
        
        <div class="form-group">
            <label>累计个税</label>
            <input type="number" name="cumulative_tax" step="0.01" value="0" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
        
        <div class="form-group">
            <label>本月个税</label>
            <input type="number" name="tax" step="0.01" value="0" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
        </div>
    </div>
    
    <h4 style="margin:20px 0 15px 0">实发工资</h4>
    <div class="form-group">
        <label>实发工资</label>
        <input type="number" name="real_pay" step="0.01" value="0" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
    </div>
    
    <div style="margin-top:20px;display:flex;gap:10px">
        <button type="submit" class="btn btn-success">✅ 保存记录</button>
        <a href="/history" class="btn btn-secondary">返回历史记录</a>
    </div>
</form>

<script>
// 初始化 Choices.js 可搜索下拉框
var empSelect = document.getElementById('emp_select');

// 先收集所有员工数据
var employeesData = {};
var options = empSelect.querySelectorAll('option');
options.forEach(function(opt) {
    if (opt.value) {
        employeesData[opt.value] = {
            name: opt.dataset.name,
            dept: opt.dataset.dept,
            city: opt.dataset.city
        };
    }
});

var choices = new Choices(empSelect, {
    searchEnabled: true,
    searchPlaceholderValue: '输入工号或姓名搜索...',
    noResultsText: '未找到匹配的员工',
    itemSelectText: '选择',
    shouldSort: false,
    searchResultLimit: 10
});

// 监听选择变化，自动填充姓名、部门、城市
empSelect.addEventListener('change', function() {
    var selectedValue = this.value;
    if (selectedValue && employeesData[selectedValue]) {
        var data = employeesData[selectedValue];
        document.getElementById('emp_name').value = data.name || '';
        document.getElementById('emp_dept').value = data.dept || '';
        document.getElementById('emp_city').value = data.city || '';
    } else {
        document.getElementById('emp_name').value = '';
        document.getElementById('emp_dept').value = '';
        document.getElementById('emp_city').value = '';
    }
});
</script>
{% endblock %}
