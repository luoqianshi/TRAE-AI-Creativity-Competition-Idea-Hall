{% extends "base.html" %}
{% block content %}
<h2 class="page-title">✏️ 编辑员工 - {{employee.name}}</h2>

<div style="margin-bottom: 15px;">
    <a href="/staff/history/{{employee.emp_no}}" class="btn btn-secondary">📋 查看变更历史</a>
</div>

<form method="post" class="card">
    <div class="form-group">
        <label>工号</label>
        <input type="text" name="emp_no" value="{{employee.emp_no}}" readonly>
    </div>
    
    <div class="form-group">
        <label>姓名</label>
        <input type="text" name="name" value="{{employee.name}}" required>
    </div>
    
    <div class="form-group">
        <label>部门</label>
        <input type="text" name="dept" value="{{employee.dept}}" required>
    </div>
    
    <div class="form-group">
        <label>城市</label>
        <select name="city" required>
            <option value="北京" {% if employee.city == '北京' %}selected{% endif %}>北京</option>
            <option value="上海" {% if employee.city == '上海' %}selected{% endif %}>上海</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>基本工资</label>
        <input type="number" name="base_sal" value="{{employee.base_sal}}" step="0.01" required>
    </div>
    
    <div class="form-group">
        <label>基本工资生效月份</label>
        <input type="month" name="base_sal_effective_date" value="{{employee.base_sal_effective_date or ''}}" placeholder="留空表示立即生效">
    </div>
    
    <div class="form-group">
        <label>社保基数（留空则使用基本工资）</label>
        <input type="number" name="social_base" value="{% if employee.social_base is not none %}{{employee.social_base}}{% endif %}" step="0.01" placeholder="特殊社保基数">
    </div>
    
    <div class="form-group">
        <label>公积金基数（留空则使用基本工资）</label>
        <input type="number" name="gjj_base" value="{% if employee.gjj_base is not none %}{{employee.gjj_base}}{% endif %}" step="0.01" placeholder="特殊公积金基数">
    </div>
    
    <div class="form-group">
        <label>入职日期</label>
        <input type="date" name="join_date" value="{{employee.join_date}}" required>
    </div>
    
    <div class="form-group">
        <label>邮箱（用于工资条发送）</label>
        <input type="email" name="email" value="{{employee.email or ''}}" placeholder="example@email.com">
    </div>
    
    <div class="form-group">
        <label>企业微信ID（用于工资条推送）</label>
        <input type="text" name="wxid" value="{{employee.wxid or ''}}" placeholder="企业微信账号">
    </div>
    
    <div class="form-group">
        <label>状态</label>
        <select name="status" onchange="toggleLeaveDate(this.value)">
            <option value="在职" {% if employee.status == '在职' %}selected{% endif %}>在职</option>
            <option value="离职" {% if employee.status == '离职' %}selected{% endif %}>离职</option>
        </select>
    </div>
    
    <div class="form-group" id="leave_date_field" {% if employee.status != '离职' %}style="display:none"{% endif %}>
        <label>离职日期 {% if employee.status == '离职' %}*{% endif %}</label>
        <input type="date" name="leave_date" value="{{employee.leave_date or ''}}" {% if employee.status == '离职' %}required{% endif %}>
    </div>
    
    <div class="form-group">
        <label>变更备注</label>
        <textarea name="remark" rows="3" placeholder="如：2026年社保基数调整、调薪申请审批通过"></textarea>
    </div>
    
    <div class="form-group">
        <button type="submit" class="btn btn-success">保存修改</button>
        <a href="/staff" class="btn btn-secondary">取消</a>
    </div>
</form>

<script>
function toggleLeaveDate(status) {
    var field = document.getElementById('leave_date_field');
    var input = field.querySelector('input');
    
    if (status === '离职') {
        field.style.display = 'block';
        input.required = true;
    } else {
        field.style.display = 'none';
        input.required = false;
    }
}
</script>
{% endblock %}
