{% extends "base.html" %}
{% block content %}
<h2 class="page-title">{% if form_type == 'edit' %}✏️ 编辑个人身份信息{% else %}➕ 新增个人身份信息{% endif %}</h2>

<form method="post" style="max-width:800px">
    <input type="hidden" name="emp_no" value="{{emp_no}}">
    
    <div class="form-group">
        <label>民族</label>
        <input type="text" name="nation" value="{{personal_info.nation or ''}}">
    </div>
    
    <div class="form-group">
        <label>政治面貌</label>
        <select name="political_status">
            <option value="">请选择</option>
            <option value="中共党员" {% if personal_info.political_status == '中共党员' %}selected{% endif %}>中共党员</option>
            <option value="共青团员" {% if personal_info.political_status == '共青团员' %}selected{% endif %}>共青团员</option>
            <option value="群众" {% if personal_info.political_status == '群众' %}selected{% endif %}>群众</option>
            <option value="民主党派" {% if personal_info.political_status == '民主党派' %}selected{% endif %}>民主党派</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>党组织关系所在地</label>
        <input type="text" name="party_location" value="{{personal_info.party_location or ''}}">
    </div>
    
    <div class="form-group">
        <label>婚前状况</label>
        <select name="marital_status">
            <option value="">请选择</option>
            <option value="未婚" {% if personal_info.marital_status == '未婚' %}selected{% endif %}>未婚</option>
            <option value="已婚" {% if personal_info.marital_status == '已婚' %}selected{% endif %}>已婚</option>
            <option value="离异" {% if personal_info.marital_status == '离异' %}selected{% endif %}>离异</option>
            <option value="丧偶" {% if personal_info.marital_status == '丧偶' %}selected{% endif %}>丧偶</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>身份证号码 *</label>
        <input type="text" name="id_card" value="{{personal_info.id_card or ''}}" required maxlength="18">
    </div>
    
    <div class="form-group">
        <label>出生日期（自动计算）</label>
        <input type="text" name="birth_date" value="{{personal_info.birth_date or ''}}" readonly>
    </div>
    
    <div class="form-group">
        <label>实际年龄（自动计算）</label>
        <input type="text" name="age" value="{{personal_info.age or ''}}" readonly>
    </div>
    
    <div class="form-group">
        <label>基金从业资格</label>
        <select name="fund_qualification">
            <option value="">请选择</option>
            <option value="有" {% if personal_info.fund_qualification == '有' %}selected{% endif %}>有</option>
            <option value="无" {% if personal_info.fund_qualification == '无' %}selected{% endif %}>无</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>从业证书编号</label>
        <input type="text" name="cert_no" value="{{personal_info.cert_no or ''}}">
    </div>
    
    <div style="display:flex;gap:10px">
        <button type="submit" class="btn btn-success">保存</button>
        <a href="/employee_archive/detail/{{emp_no}}" class="btn btn-secondary">取消</a>
    </div>
</form>
{% endblock %}
