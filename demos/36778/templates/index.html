{% extends "base.html" %}
{% block content %}
<h2 class="page-title">🏠 系统首页</h2>

<div class="card">
    <h3>📋 功能菜单</h3>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:20px">
        <div style="background:#3498db;color:white;padding:20px;border-radius:8px;text-align:center">
            <div style="font-size:36px;margin-bottom:10px">👥</div>
            <div style="font-size:16px">员工管理</div>
            <div style="font-size:12px;margin-top:5px;color:#ecf0f1">新增、修改、删除员工</div>
            <a href="/employee_archive" class="btn" style="display:block;margin-top:15px;background:#2980b9">进入</a>
        </div>
        <div style="background:#27ae60;color:white;padding:20px;border-radius:8px;text-align:center">
            <div style="font-size:36px;margin-bottom:10px">📝</div>
            <div style="font-size:16px">薪酬调整</div>
            <div style="font-size:12px;margin-top:5px;color:#d5f4e6">奖金、津贴、扣款管理</div>
            <a href="/adjustment" class="btn" style="display:block;margin-top:15px;background:#1e8449">进入</a>
        </div>
        <div style="background:#f39c12;color:white;padding:20px;border-radius:8px;text-align:center">
            <div style="font-size:36px;margin-bottom:10px">💰</div>
            <div style="font-size:16px">工资计算</div>
            <div style="font-size:12px;margin-top:5px;color:#fef5e7">当月工资批量计算</div>
            <a href="/salary" class="btn" style="display:block;margin-top:15px;background:#e67e22">进入</a>
        </div>
        <div style="background:#9b59b6;color:white;padding:20px;border-radius:8px;text-align:center">
            <div style="font-size:36px;margin-bottom:10px">📊</div>
            <div style="font-size:16px">历史记录</div>
            <div style="font-size:12px;margin-top:5px;color:#ebdef0">查询历史工资记录</div>
            <a href="/history" class="btn" style="display:block;margin-top:15px;background:#8e44ad">进入</a>
        </div>
    </div>
</div>

<div class="card">
    <h3>💡 使用说明</h3>
    <ul style="margin-left:20px;margin-top:10px;line-height:2">
        <li><strong>员工管理</strong>：维护员工基本信息，包括姓名、部门、城市、基本工资等</li>
        <li><strong>薪酬调整</strong>：管理员工当月的奖金、津贴、扣款等调整项</li>
        <li><strong>工资计算</strong>：选择月份，批量计算所有在职员工的工资</li>
        <li><strong>历史记录</strong>：查看已保存的工资记录，支持导出CSV</li>
    </ul>
</div>
{% endblock %}
