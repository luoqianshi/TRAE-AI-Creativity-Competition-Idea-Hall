{% extends "base.html" %}
{% block content %}
<h2 class="page-title">➕ 新增调整记录</h2>

<form method="post" class="card">
    <div class="form-group">
        <label>员工 *</label>
        <select id="emp-select" name="emp_no" required>
            <option value="">请选择员工</option>
            {% for emp in employees %}
            <option value="{{emp.emp_no}}" {% if form_data and form_data.emp_no == emp.emp_no %}selected{% endif %}>
                {{emp.emp_no}} - {{emp.name}}
            </option>
            {% endfor %}
        </select>
    </div>
    
    <div class="form-group">
        <label>月份 *</label>
        <input type="month" name="year_month" value="{{form_data.year_month if form_data else ''}}" required>
    </div>
    
    <div class="form-group">
        <label>奖金</label>
        <input type="number" name="bonus" value="{{form_data.bonus if form_data else '0'}}" step="0.01">
    </div>
    
    <div class="form-group">
        <label>津贴</label>
        <input type="number" name="allowance" value="{{form_data.allowance if form_data else '0'}}" step="0.01">
    </div>
    
    <div class="form-group">
        <label>扣款</label>
        <input type="number" name="deduct" value="{{form_data.deduct if form_data else '0'}}" step="0.01">
    </div>
    
    <div class="form-group">
        <label>原因</label>
        <textarea name="reason" rows="3">{{form_data.reason if form_data else ''}}</textarea>
    </div>
    
    <div class="form-group">
        <button type="submit" class="btn btn-success">保存</button>
        <a href="/adjustment" class="btn btn-secondary">取消</a>
    </div>
</form>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const empSelect = document.getElementById('emp-select');
        if (empSelect) {
            new Choices(empSelect, {
                searchEnabled: true,
                searchPlaceholderValue: '输入工号或姓名搜索...',
                noResultsText: '未找到匹配的员工',
                itemSelectText: '点击选择',
                shouldSort: false
            });
        }
    });
</script>
{% endblock %}
