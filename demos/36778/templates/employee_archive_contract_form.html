{% extends "base.html" %}
{% block content %}
<h2 class="page-title">{% if form_type == 'edit' %}✏️ 编辑劳动合同{% else %}➕ 新增劳动合同{% endif %}</h2>

<form method="post" style="max-width:800px">
    <input type="hidden" name="emp_no" value="{{emp_no}}">
    
    <div class="form-group">
        <label>续签次数</label>
        <input type="number" name="renew_count" value="{{contract.renew_count or 0}}" min="0">
    </div>
    
    <div class="form-group">
        <label>劳动合同起始时间 *</label>
        <input type="date" name="start_date" value="{{contract.start_date or ''}}" required>
    </div>
    
    <div class="form-group">
        <label>劳动合同到期时间 *</label>
        <input type="date" name="end_date" value="{{contract.end_date or ''}}" required>
    </div>
    
    <div style="display:flex;gap:10px">
        <button type="submit" class="btn btn-success">保存</button>
        <a href="/employee_archive/detail/{{emp_no}}" class="btn btn-secondary">取消</a>
    </div>
</form>
{% endblock %}
