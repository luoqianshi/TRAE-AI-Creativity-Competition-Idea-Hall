{% extends "base.html" %}
{% block content %}
<h2>当月薪资调整</h2>

<h3>当月调整列表</h3>
<table border="1" cellpadding="6" cellspacing="0" width="100%" style="margin-top:10px;">
    <tr>
        <th>工号</th><th>姓名</th><th>计算月份</th><th>奖金</th><th>津贴</th><th>扣款</th>
    </tr>
    {% for r in rows %}
    <tr>
        <td>{{r.emp_no}}</td>
        <td>{{r.name}}</td>
        <td>{{r.year_month}}</td>
        <td>{{r.bonus}}</td>
        <td>{{r.allowance}}</td>
        <td>{{r.deduct}}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
