{% extends "base.html" %}

{% block title %}五险一金配置{% endblock %}
{% block header %}五险一金配置{% endblock %}

{% block content %}
{% for c in cfg %}
<form method="post" action="/config/save">
    <input type="hidden" name="city" value="{{c.city}}">
    <h3>{{c.city}}</h3>
    <div>
        社保基数下限：<input name="social_min" type="number" step="0.01" value="{{c.social_min}}">
        社保基数上限：<input name="social_max" type="number" step="0.01" value="{{c.social_max}}">
    </div>
    <div>
        公积金基数下限：<input name="gjj_min" type="number" step="0.01" value="{{c.gjj_min}}">
        公积金基数上限：<input name="gjj_max" type="number" step="0.01" value="{{c.gjj_max}}">
    </div>
    <div>
        养老保险率：<input name="pension_rate" type="number" step="0.001" value="{{c.pension_rate}}">
        医疗保险率：<input name="medical_rate" type="number" step="0.001" value="{{c.medical_rate}}">
        失业保险率：<input name="unemployment_rate" type="number" step="0.001" value="{{c.unemployment_rate}}">
    </div>
    <div>
        公积金率：<input name="gjj_rate" type="number" step="0.001" value="{{c.gjj_rate}}">
        医疗大病统筹：<input name="medical_fee" type="number" step="0.01" value="{{c.medical_fee}}">
        公积金封顶：<input name="gjj_cap" type="number" step="0.01" value="{{c.gjj_cap}}">
    </div>
    <button type="submit">保存{{c.city}}配置</button>
</form>
<hr>
{% endfor %}
{% endblock %}
