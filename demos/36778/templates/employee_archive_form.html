{% extends "base.html" %}
{% block content %}
<h2 class="page-title">{% if form_type == 'edit' %}✏️ 编辑员工主要信息{% else %}➕ 新增员工主要信息{% endif %}</h2>

<form method="post" style="max-width:800px">
    <div class="form-group">
        <label>工号 *</label>
        <input type="text" name="emp_no" value="{{employee.emp_no or ''}}" {% if form_type == 'edit' %}readonly{% endif %} required>
    </div>
    
    <div class="form-group">
        <label>姓名 *</label>
        <input type="text" name="name" value="{{employee.name or ''}}" required>
    </div>
    
    <div class="form-group">
        <label>部门划分 *</label>
        <input type="text" name="dept_division" value="{{employee.dept_division or ''}}" required>
    </div>
    
    <div class="form-group">
        <label>一级部门 *</label>
        <input type="text" name="level1_dept" value="{{employee.level1_dept or ''}}" required>
    </div>
    
    <div class="form-group">
        <label>二级部门</label>
        <input type="text" name="level2_dept" value="{{employee.level2_dept or ''}}">
    </div>
    
    <div class="form-group">
        <label>职务</label>
        <input type="text" name="position" value="{{employee.position or ''}}">
    </div>
    
    <div class="form-group">
        <label>岗位类别</label>
        <select name="job_category">
            <option value="">请选择</option>
            <option value="高级管理人员" {% if employee.job_category == '高级管理人员' %}selected{% endif %}>高级管理人员</option>
            <option value="中级管理人员" {% if employee.job_category == '中级管理人员' %}selected{% endif %}>中级管理人员</option>
            <option value="一般管理人员" {% if employee.job_category == '一般管理人员' %}selected{% endif %}>一般管理人员</option>
            <option value="专业技术岗位" {% if employee.job_category == '专业技术岗位' %}selected{% endif %}>专业技术岗位</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>主要工作</label>
        <textarea name="main_work" rows="3">{{employee.main_work or ''}}</textarea>
    </div>
    
    <div class="form-group">
        <label>离职日期</label>
        <input type="date" name="resign_date" value="{{employee.resign_date or ''}}">
        <span style="color:#95a5a6;font-size:12px">（填写后自动判断离职状态）</span>
    </div>
    
    <div style="display:flex;gap:10px">
        <button type="submit" class="btn btn-success">保存</button>
        <a href="/employee_archive" class="btn btn-secondary">取消</a>
    </div>
</form>
{% endblock %}
