{% extends "base.html" %}
{% block content %}
<h2 class="page-title">{% if form_type == 'edit' %}✏️ 编辑联系方式{% else %}➕ 新增联系方式{% endif %}</h2>

<form method="post" style="max-width:800px">
    <input type="hidden" name="emp_no" value="{{emp_no}}">
    
    <div class="form-group">
        <label>企业微信ID</label>
        <input type="text" name="wxid" value="{{contacts.wxid or ''}}">
    </div>
    
    <div class="form-group">
        <label>联系电话 *</label>
        <input type="tel" name="phone" value="{{contacts.phone or ''}}" required>
    </div>
    
    <div class="form-group">
        <label>紧急联系人电话</label>
        <input type="tel" name="emergency_phone" value="{{contacts.emergency_phone or ''}}">
    </div>
    
    <div class="form-group">
        <label>邮箱 *</label>
        <input type="email" name="email" value="{{contacts.email or ''}}" required>
    </div>
    
    <div class="form-group">
        <label>办公电话</label>
        <input type="tel" name="office_phone" value="{{contacts.office_phone or ''}}">
    </div>
    
    <div class="form-group">
        <label>家庭住址</label>
        <input type="text" name="home_address" value="{{contacts.home_address or ''}}">
    </div>
    
    <div class="form-group">
        <label>户籍地址</label>
        <input type="text" name="registered_address" value="{{contacts.registered_address or ''}}">
    </div>
    
    <div class="form-group">
        <label>银行卡号</label>
        <input type="text" name="bank_card" value="{{contacts.bank_card or ''}}" maxlength="19">
    </div>
    
    <div style="display:flex;gap:10px">
        <button type="submit" class="btn btn-success">保存</button>
        <a href="/employee_archive/detail/{{emp_no}}" class="btn btn-secondary">取消</a>
    </div>
</form>
{% endblock %}
