{% extends "base.html" %}
{% block content %}
<h2>专项附加扣除（累计值）</h2>

<h3>专项附加列表</h3>
<table border="1" cellpadding="6" cellspacing="0" width="100%" style="margin-top:10px;">
    <tr>
        <th>工号</th><th>姓名</th><th>生效月份</th><th>累计专项扣除</th>
    </tr>
    {% for r in rows %}
    <tr>
        <td>{{r.emp_no}}</td>
        <td>{{r.name}}</td>
        <td>{{r.start_month}}</td>
        <td>{{r.cumulative_amount}}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
