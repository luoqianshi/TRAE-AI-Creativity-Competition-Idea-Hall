{% extends "base.html" %}
{% block content %}
<h2 class="page-title">✏️ 编辑调整记录</h2>

<form method="post" class="card">
    <div class="form-group">
        <label>员工</label>
        <input type="text" value="{{adjustment.emp_no}} - {{adjustment.name}}" readonly>
        <input type="hidden" name="emp_no" value="{{adjustment.emp_no}}">
        <input type="hidden" name="name" value="{{adjustment.name}}">
    </div>
    
    <div class="form-group">
        <label>月份</label>
        <input type="month" name="year_month" value="{{adjustment.year_month}}" readonly>
    </div>
    
    <div class="form-group">
        <label>奖金</label>
        <input type="number" name="bonus" value="{{adjustment.bonus}}" step="0.01">
    </div>
    
    <div class="form-group">
        <label>津贴</label>
        <input type="number" name="allowance" value="{{adjustment.allowance}}" step="0.01">
    </div>
    
    <div class="form-group">
        <label>扣款</label>
        <input type="number" name="deduct" value="{{adjustment.deduct}}" step="0.01">
    </div>
    
    <div class="form-group">
        <label>原因</label>
        <textarea name="reason" rows="3">{{adjustment.reason or ''}}</textarea>
    </div>
    
    <div class="form-group">
        <button type="submit" class="btn btn-success">保存修改</button>
        <a href="/adjustment" class="btn btn-secondary">取消</a>
    </div>
</form>
{% endblock %}
