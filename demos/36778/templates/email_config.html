{% extends "base.html" %}
{% block content %}
<style>
    .config-form {
        max-width: 600px;
    }
    .config-item {
        background: white;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 15px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .config-item h4 {
        margin-bottom: 15px;
        color: #2c3e50;
        border-bottom: 1px solid #eee;
        padding-bottom: 10px;
    }
    .test-result {
        margin-top: 15px;
        padding: 10px;
        border-radius: 4px;
        display: none;
    }
    .test-success {
        background: #d4edda;
        color: #155724;
    }
    .test-error {
        background: #f8d7da;
        color: #721c24;
    }
</style>

<h2 class="page-title">📧 邮件配置</h2>

<div class="card config-form">
    <form method="post" action="/email_config/save">
        <div class="config-item">
            <h4>📤 发件服务器配置</h4>
            <div class="form-group">
                <label>SMTP服务器地址 *</label>
                <input type="text" name="smtp_host" value="{{ config.smtp_host if config else '' }}" placeholder="如：smtp.qq.com" required>
            </div>
            <div class="form-group">
                <label>SMTP端口 *</label>
                <input type="number" name="smtp_port" value="{{ config.smtp_port if config else '587' }}" placeholder="587 (TLS) 或 465 (SSL)" required>
            </div>
            <div class="form-group">
                <label>使用SSL加密</label>
                <select name="smtp_ssl">
                    <option value="false" {% if not config or config.smtp_ssl == false %}selected{% endif %}>否 (TLS)</option>
                    <option value="true" {% if config and config.smtp_ssl == true %}selected{% endif %}>是 (SSL)</option>
                </select>
            </div>
        </div>
        
        <div class="config-item">
            <h4>🔐 发件账号配置</h4>
            <div class="form-group">
                <label>发件人邮箱 *</label>
                <input type="email" name="smtp_user" value="{{ config.smtp_user if config else '' }}" placeholder="your_email@example.com" required>
            </div>
            <div class="form-group">
                <label>邮箱密码/授权码 *</label>
                <input type="password" name="smtp_password" value="{{ config.smtp_password if config else '' }}" placeholder="邮箱授权码（非登录密码）" required>
            </div>
            <div class="form-group">
                <label>发件人显示名称</label>
                <input type="text" name="smtp_from_name" value="{{ config.smtp_from_name if config else '' }}" placeholder="如：人力资源部">
            </div>
        </div>
        
        <div class="form-group">
            <button type="submit" class="btn btn-success">💾 保存配置</button>
            <button type="button" class="btn btn-secondary" onclick="testEmail()">🧪 测试连接</button>
        </div>
        
        <div class="test-result" id="testResult"></div>
    </form>
</div>

<div class="card" style="max-width: 600px;">
    <h4>📝 配置说明</h4>
    <ul style="color: #666; line-height: 1.8;">
        <li><strong>QQ邮箱</strong>：SMTP服务器 smtp.qq.com，端口 587，使用TLS加密，密码为授权码</li>
        <li><strong>163邮箱</strong>：SMTP服务器 smtp.163.com，端口 465，使用SSL加密，密码为授权码</li>
        <li><strong>企业邮箱</strong>：根据企业邮箱服务提供商配置，通常使用465端口SSL加密</li>
        <li>授权码需在邮箱设置中开启SMTP服务后获取</li>
    </ul>
</div>

<script>
function testEmail() {
    const formData = new FormData(document.querySelector('form'));
    document.getElementById('testResult').style.display = 'block';
    document.getElementById('testResult').className = 'test-result';
    document.getElementById('testResult').innerHTML = '正在测试连接...';
    
    fetch('/email_config/test', {
        method: 'POST',
        body: formData
    }).then(res => res.json()).then(data => {
        if (data.success) {
            document.getElementById('testResult').className = 'test-result test-success';
            document.getElementById('testResult').innerHTML = '✅ 测试成功！' + data.message;
        } else {
            document.getElementById('testResult').className = 'test-result test-error';
            document.getElementById('testResult').innerHTML = '❌ 测试失败：' + data.message;
        }
    }).catch(err => {
        document.getElementById('testResult').className = 'test-result test-error';
        document.getElementById('testResult').innerHTML = '❌ 测试失败：' + err.message;
    });
}
</script>
{% endblock %}
