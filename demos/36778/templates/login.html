<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>工资管理系统 - 登录</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: center;
        }
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo img {
            width: 60px;
            height: 60px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <span style="font-size:48px;">💰</span>
        </div>
        <h2>工资管理系统</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    {% if category == 'error' %}
                        <div class="error-message">{{ message }}</div>
                    {% endif %}
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="post" action="/login" id="loginForm">
            <input type="hidden" name="device_fingerprint" id="device_fingerprint">
            <input type="hidden" name="device_name" id="device_name">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn">登录</button>
        </form>
        
        <!-- 设备指纹提示（仅在设备验证失败时显示） -->
        <div id="deviceFingerprintHint" style="display:none;background:#fff3e0;padding:15px;border-radius:8px;margin-top:20px;border:1px solid #ffe0b2;">
            <h5 style="margin-top:0;color:#e65100;">🔒 设备验证失败</h5>
            <p style="color:#666;font-size:12px;margin-bottom:10px;">您的设备尚未绑定，请联系管理员添加此设备。</p>
            <div style="background:#f5f5f5;padding:10px;border-radius:4px;margin-bottom:10px;">
                <p style="margin:0;font-size:11px;color:#666;">设备指纹：</p>
                <p style="margin:5px 0 0 0;font-family:monospace;font-size:11px;color:#333;word-break:break-all;" id="fingerprintDisplay"></p>
            </div>
            <button type="button" onclick="copyFingerprint()" class="btn" style="padding:6px 12px;font-size:12px;">复制设备指纹</button>
            <p id="copySuccess" style="display:none;color:#43a047;font-size:11px;margin-top:5px;">✓ 已复制到剪贴板</p>
        </div>
        
        <p style="text-align:center;color:#999;font-size:12px;margin-top:20px;">
            默认账号：admin / admin
        </p>
    </div>

    <script>
        function generateFingerprint() {
            // 收集浏览器特征（移除不稳定的窗口大小）
            var features = [
                navigator.userAgent,
                navigator.platform,
                navigator.language,
                navigator.cookieEnabled,
                screen.width + 'x' + screen.height,  // 屏幕分辨率（稳定）
                navigator.hardwareConcurrency || 'unknown',
                navigator.deviceMemory || 'unknown',
                // Canvas指纹（最稳定）
                getCanvasFingerprint(),
                // 时区
                Intl.DateTimeFormat().resolvedOptions().timeZone,
                // 字体检测
                getFontFingerprint(),
                // WebGL指纹
                getWebGLFingerprint()
            ];
            
            // 使用SHA-256哈希生成指纹
            return sha256(features.join('|'));
        }
        
        function getCanvasFingerprint() {
            try {
                var canvas = document.createElement('canvas');
                var ctx = canvas.getContext('2d');
                canvas.width = 200;
                canvas.height = 100;
                
                // 绘制一些内容来生成唯一指纹
                ctx.textBaseline = "top";
                ctx.font = "14px 'Arial'";
                ctx.fillStyle = "#f00";
                ctx.fillRect(125, 1, 62, 20);
                ctx.fillStyle = "#fff";
                ctx.fillText("Hello, World!", 2, 15);
                
                return canvas.toDataURL();
            } catch (e) {
                return 'canvas_not_supported';
            }
        }
        
        function getFontFingerprint() {
            try {
                var fonts = ['Arial', 'Times New Roman', 'Courier New', 'Georgia', 'Verdana', 'Tahoma'];
                var canvas = document.createElement('canvas');
                var ctx = canvas.getContext('2d');
                canvas.width = 100;
                canvas.height = 100;
                ctx.font = '12px Arial';
                var baseline = [];
                
                fonts.forEach(function(font) {
                    ctx.font = '12px ' + font;
                    baseline.push(ctx.measureText('M').width);
                });
                
                return baseline.join(',');
            } catch (e) {
                return 'font_not_supported';
            }
        }
        
        function getWebGLFingerprint() {
            try {
                var canvas = document.createElement('canvas');
                var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return 'webgl_not_supported';
                
                var debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                if (debugInfo) {
                    return gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                }
                return 'webgl_no_debug';
            } catch (e) {
                return 'webgl_error';
            }
        }
        
        function sha256(str) {
            // 简单的SHA-256实现（简化版）
            function rotateRight(n, b) {
                return (n >>> b) | (n << (32 - b));
            }
            
            function digestMessage(message) {
                var K = [
                    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5,
                    0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
                    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3,
                    0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
                    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc,
                    0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
                    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7,
                    0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
                    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13,
                    0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
                    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3,
                    0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
                    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5,
                    0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
                    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208,
                    0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
                ];
                
                var msg = new Uint8Array(message.length);
                for (var i = 0; i < message.length; i++) {
                    msg[i] = message.charCodeAt(i);
                }
                
                var len = msg.length * 8;
                msg = new Uint8Array([...msg, 0x80, ...new Array((56 - (msg.length % 64)) % 64), 
                    (len >>> 56) & 0xff, (len >>> 48) & 0xff, (len >>> 40) & 0xff, (len >>> 32) & 0xff,
                    (len >>> 24) & 0xff, (len >>> 16) & 0xff, (len >>> 8) & 0xff, len & 0xff]);
                
                var h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
                var h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
                
                for (var i = 0; i < msg.length; i += 64) {
                    var w = new Array(64);
                    for (var j = 0; j < 16; j++) {
                        w[j] = (msg[i + j * 4] << 24) | (msg[i + j * 4 + 1] << 16) | 
                               (msg[i + j * 4 + 2] << 8) | msg[i + j * 4 + 3];
                    }
                    for (var j = 16; j < 64; j++) {
                        var s0 = rotateRight(w[j-15], 7) ^ rotateRight(w[j-15], 18) ^ (w[j-15] >>> 3);
                        var s1 = rotateRight(w[j-2], 17) ^ rotateRight(w[j-2], 19) ^ (w[j-2] >>> 10);
                        w[j] = (w[j-16] + s0 + w[j-7] + s1) >>> 0;
                    }
                    
                    var a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
                    for (var j = 0; j < 64; j++) {
                        var S1 = rotateRight(e, 6) ^ rotateRight(e, 11) ^ rotateRight(e, 25);
                        var ch = (e & f) ^ (~e & g);
                        var temp1 = (h + S1 + ch + K[j] + w[j]) >>> 0;
                        var S0 = rotateRight(a, 2) ^ rotateRight(a, 13) ^ rotateRight(a, 22);
                        var maj = (a & b) ^ (a & c) ^ (b & c);
                        var temp2 = (S0 + maj) >>> 0;
                        
                        h = g; g = f; f = e; e = (d + temp1) >>> 0;
                        d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
                    }
                    
                    h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0;
                    h4 = (h4 + e) >>> 0; h5 = (h5 + f) >>> 0; h6 = (h6 + g) >>> 0; h7 = (h7 + h) >>> 0;
                }
                
                var result = '';
                [h0, h1, h2, h3, h4, h5, h6, h7].forEach(function(h) {
                    result += ('00000000' + h.toString(16)).slice(-8);
                });
                return result;
            }
            
            return digestMessage(str);
        }
        
        function getDeviceName() {
            var ua = navigator.userAgent.toLowerCase();
            if (ua.includes('windows')) return 'Windows PC';
            if (ua.includes('mac os')) return 'Mac PC';
            if (ua.includes('iphone') || ua.includes('ipad')) return 'iPhone/iPad';
            if (ua.includes('android')) return 'Android设备';
            if (ua.includes('linux')) return 'Linux设备';
            return '未知设备';
        }
        
        // 页面加载完成后生成指纹
        document.addEventListener('DOMContentLoaded', function() {
            const fingerprint = generateFingerprint();
            document.getElementById('device_fingerprint').value = fingerprint;
            document.getElementById('device_name').value = getDeviceName();
            document.getElementById('fingerprintDisplay').textContent = fingerprint;
            
            // 检查是否有设备验证失败的错误消息
            const errorMessages = document.querySelectorAll('.error-message');
            errorMessages.forEach(function(msg) {
                if (msg.textContent.includes('设备未绑定')) {
                    document.getElementById('deviceFingerprintHint').style.display = 'block';
                }
            });
        });
        
        function copyFingerprint() {
            const fingerprint = document.getElementById('device_fingerprint').value;
            navigator.clipboard.writeText(fingerprint).then(function() {
                const successMsg = document.getElementById('copySuccess');
                successMsg.style.display = 'block';
                setTimeout(function() {
                    successMsg.style.display = 'none';
                }, 2000);
            }).catch(function(err) {
                alert('复制失败，请手动复制设备指纹');
            });
        }
    </script>
</body>
</html>
