{% extends "base.html" %}

{% block title %}编辑工资{% endblock %}
{% block header %}编辑工资明细{% endblock %}

{% block content %}
<style>
form { max-width: 600px; margin: 20px 0; }
div { margin: 15px 0; }
label { display: inline-block; width: 120px; }
input { padding: 8px; width: 300px; }
button { padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px; }
a { color: #6c757d; text-decoration: none; }
a:hover { text-decoration: underline; }
.info { color: #6c757d; font-size: 14px; margin: 5px 0; }
</style>

<form method="post" action="/salary/edit/{{record.id}}">
    <div>
        <label>员工：</label> {{record.name}} 
        <label style="margin-left:20px;">月份：</label> {{record.year_month}}
    </div>

    <div>
        <label>奖金：</label>
        <input name="bonus" type="number" step="0.01" value="{{record.bonus}}">
    </div>
    <div>
        <label>津贴：</label>
        <input name="allowance" type="number" step="0.01" value="{{record.allowance}}">
    </div>
    <div>
        <label>扣款：</label>
        <input name="deduct" type="number" step="0.01" value="{{record.deduct}}">
    </div>

    <div style="margin:20px 0; padding:10px; background:#f8f9fa; border-left:4px solid #007bff;">
        <label>手动实发：</label>
        <input name="real_pay" type="number" step="0.01" value="{{record.real_pay}}">
        <div class="info">提示：留空则自动重新计算个税和实发；填写则直接生效（不重新计算）</div>
    </div>

    <button type="submit">保存修改</button>
    <a href="/salary">取消</a>
</form>
{% endblock %}
