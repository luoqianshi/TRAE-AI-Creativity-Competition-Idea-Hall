{% extends "base.html" %}
{% block content %}
<h2 class="page-title">✏️ 编辑 {{ city_name }} 社保公积金配置</h2>

<form action="/social_config/edit/{{ city_name }}" method="post" class="form-container">
    <div class="form-group">
        <label>城市名称</label>
        <input type="text" value="{{ city_name }}" disabled>
        <input type="hidden" name="city" value="{{ city_name }}">
    </div>
    
    <div class="form-group">
        <label>养老保险比例 (%) *</label>
        <input type="number" name="pension_rate" step="0.01" required value="{{ (config.pension_rate * 100)|round(2) }}">
    </div>
    
    <div class="form-group">
        <label>医疗保险比例 (%) *</label>
        <input type="number" name="medical_rate" step="0.01" required value="{{ (config.medical_rate * 100)|round(2) }}">
    </div>
    
    <div class="form-group">
        <label>失业保险比例 (%) *</label>
        <input type="number" name="unemployment_rate" step="0.001" required value="{{ (config.unemployment_rate * 100)|round(2) }}">
    </div>
    
    <div class="form-group">
        <label>公积金比例 (%) *</label>
        <input type="number" name="gjj_rate" step="0.01" required value="{{ (config.gjj_rate * 100)|round(2) }}">
    </div>
    
    <div class="form-group">
        <label>社保基数下限 *</label>
        <input type="number" name="social_min" required value="{{ config.social_min }}">
    </div>
    
    <div class="form-group">
        <label>社保基数上限 *</label>
        <input type="number" name="social_max" required value="{{ config.social_max }}">
    </div>
    
    <div class="form-group">
        <label>公积金基数下限 *</label>
        <input type="number" name="gjj_min" required value="{{ config.gjj_min }}">
    </div>
    
    <div class="form-group">
        <label>公积金基数上限 *</label>
        <input type="number" name="gjj_max" required value="{{ config.gjj_max }}">
    </div>
    
    <div class="form-group">
        <label>医疗保险固定费用</label>
        <input type="number" name="medical_fee" value="{{ config.medical_fee }}">
    </div>
    
    <div class="form-group">
        <label>公积金上限</label>
        <input type="number" name="gjj_cap" value="{{ config.gjj_cap }}">
    </div>
    
    <div class="form-actions">
        <button type="submit" class="btn btn-success">保存</button>
        <a href="/social_config" class="btn btn-secondary">取消</a>
    </div>
</form>
{% endblock %}
