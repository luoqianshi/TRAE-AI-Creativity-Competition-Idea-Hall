{% extends "base.html" %}
{% block content %}
<h2 class="page-title">➕ 新增员工</h2>

<form method="post" class="card">
    <div class="form-group">
        <label>工号（可选，自动生成）</label>
        <input type="text" name="emp_no" value="{{form_data.emp_no if form_data else ''}}" placeholder="自动生成工号">
    </div>
    
    <div class="form-group">
        <label>姓名 *</label>
        <input type="text" name="name" value="{{form_data.name if form_data else ''}}" required>
    </div>
    
    <div class="form-group">
        <label>部门 *</label>
        <input type="text" name="dept" value="{{form_data.dept if form_data else ''}}" required>
    </div>
    
    <div class="form-group">
        <label>城市 *</label>
        <select name="city" required>
            <option value="">请选择城市</option>
            <option value="北京" {% if form_data and form_data.city == '北京' %}selected{% endif %}>北京</option>
            <option value="上海" {% if form_data and form_data.city == '上海' %}selected{% endif %}>上海</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>基本工资 *</label>
        <input type="number" name="base_sal" value="{{form_data.base_sal if form_data else ''}}" step="0.01" required>
    </div>
    
    <div class="form-group">
        <label>社保基数（留空则使用基本工资）</label>
        <input type="number" name="social_base" value="{% if form_data and form_data.social_base is not none %}{{form_data.social_base}}{% endif %}" step="0.01" placeholder="特殊社保基数">
    </div>
    
    <div class="form-group">
        <label>公积金基数（留空则使用基本工资）</label>
        <input type="number" name="gjj_base" value="{% if form_data and form_data.gjj_base is not none %}{{form_data.gjj_base}}{% endif %}" step="0.01" placeholder="特殊公积金基数">
    </div>
    
    <div class="form-group">
        <label>入职日期 *</label>
        <input type="date" name="join_date" value="{{form_data.join_date if form_data else ''}}" required>
    </div>
    
    <div class="form-group">
        <label>邮箱（用于工资条发送）</label>
        <input type="email" name="email" value="{{form_data.email if form_data else ''}}" placeholder="example@email.com">
    </div>
    
    <div class="form-group">
        <label>企业微信ID（用于工资条推送）</label>
        <input type="text" name="wxid" value="{{form_data.wxid if form_data else ''}}" placeholder="企业微信账号">
    </div>
    
    <div class="form-group">
        <label>状态</label>
        <select name="status">
            <option value="在职" {% if not form_data or form_data.status == '在职' %}selected{% endif %}>在职</option>
            <option value="离职" {% if form_data and form_data.status == '离职' %}selected{% endif %}>离职</option>
        </select>
    </div>
    
    <div class="form-group">
        <button type="submit" class="btn btn-success">保存</button>
        <a href="/staff" class="btn btn-secondary">取消</a>
    </div>
</form>
{% endblock %}
