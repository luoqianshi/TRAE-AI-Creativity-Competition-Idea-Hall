<script>
// ============================================================
//  核心配置
// ============================================================
const canvas = document.getElementById('mathCanvas');
const ctx = canvas.getContext('2d');
const X_MIN = -6.5, X_MAX = 6.5;
const Y_MIN = -4.5, Y_MAX = 4.5;
const dpr = window.devicePixelRatio || 1;
let drawnItems = [];

const COLORS = ['#3b82f6', '#ef4444', '#10b981', '#8b5cf6', '#f59e0b', '#ec4899', '#06b6d4', '#84cc16'];
let colorIndex = 0;

function nextColor() {
    const c = COLORS[colorIndex % COLORS.length];
    colorIndex++;
    return c;
}

// ============================================================
//  数学表达式解析
// ============================================================
function normalizeExpr(expr) {
    return expr
        .replace(/\^/g, '**')
        .replace(/\bln\(/g, 'Math.log(')
        .replace(/\blog\(/g, 'Math.log10(')
        .replace(/\blog10\(/g, 'Math.log10(')
        .replace(/\bsin\(/g, 'Math.sin(')
        .replace(/\bcos\(/g, 'Math.cos(')
        .replace(/\btan\(/g, 'Math.tan(')
        .replace(/\basin\(/g, 'Math.asin(')
        .replace(/\bacos\(/g, 'Math.acos(')
        .replace(/\batan\(/g, 'Math.atan(')
        .replace(/\bsqrt\(/g, 'Math.sqrt(')
        .replace(/\babs\(/g, 'Math.abs(')
        .replace(/\bexp\(/g, 'Math.exp(')
        .replace(/\bfloor\(/g, 'Math.floor(')
        .replace(/\bceil\(/g, 'Math.ceil(')
        .replace(/\bround\(/g, 'Math.round(')
        .replace(/\bmax\(/g, 'Math.max(')
        .replace(/\bmin\(/g, 'Math.min(')
        .replace(/\bPI\b/g, 'Math.PI')
        .replace(/\bE\b/g, 'Math.E')
        // 支持 |x| 写法
        .replace(/\|([^|]+)\|/g, 'Math.abs($1)');
}

function buildFunction(expr) {
    const jsExpr = normalizeExpr(expr);
    return new Function('x', 'return ' + jsExpr);
}

function isTrigonometric(expr) {
    return /\bsin\b|\bcos\b|\btan\b|\basin\b|\bacos\b|\batan\b/.test(expr);
}

// ============================================================
//  坐标与尺寸
// ============================================================
function getCanvasSize() {
    return { w: canvas.width / dpr, h: canvas.height / dpr };
}

function setupCanvas() {
    const wrapper = document.getElementById('canvasWrapper');
    const rect = wrapper.getBoundingClientRect();
    const w = Math.max(rect.width, 320);
    const h = Math.max(rect.height, 280);
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function toCanvas(mx, my) {
    const { w, h } = getCanvasSize();
    const pad = 40;
    const drawW = w - 2 * pad;
    const drawH = h - 2 * pad;
    if (drawW <= 0 || drawH <= 0) return { x: 0, y: 0 };
    const cx = pad + ((mx - X_MIN) / (X_MAX - X_MIN)) * drawW;
    const cy = pad + ((Y_MAX - my) / (Y_MAX - Y_MIN)) * drawH;
    return { x: cx, y: cy };
}

function toMath(cx, cy) {
    const { w, h } = getCanvasSize();
    const pad = 40;
    const drawW = w - 2 * pad;
    const drawH = h - 2 * pad;
    const mx = X_MIN + ((cx - pad) / drawW) * (X_MAX - X_MIN);
    const my = Y_MAX - ((cy - pad) / drawH) * (Y_MAX - Y_MIN);
    return { x: mx, y: my };
}

// ============================================================
//  网格与坐标轴
// ============================================================
function drawGridAndAxes() {
    const { w, h } = getCanvasSize();
    if (w <= 0 || h <= 0) return;

    ctx.clearRect(0, 0, w, h);

    // 网格
    ctx.save();
    ctx.strokeStyle = '#e8ecf1';
    ctx.lineWidth = 0.5;
    for (let x = Math.ceil(X_MIN); x <= Math.floor(X_MAX); x++) {
        if (x === 0) continue;
        const p = toCanvas(x, 0);
        ctx.beginPath();
        ctx.moveTo(p.x, 0);
        ctx.lineTo(p.x, h);
        ctx.stroke();
    }
    for (let y = Math.ceil(Y_MIN); y <= Math.floor(Y_MAX); y++) {
        if (y === 0) continue;
        const p = toCanvas(0, y);
        ctx.beginPath();
        ctx.moveTo(0, p.y);
        ctx.lineTo(w, p.y);
        ctx.stroke();
    }
    ctx.restore();

    const origin = toCanvas(0, 0);

    // 坐标轴
    ctx.save();
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, origin.y);
    ctx.lineTo(w, origin.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(w - 8, origin.y - 5);
    ctx.lineTo(w, origin.y);
    ctx.lineTo(w - 8, origin.y + 5);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(origin.x, 0);
    ctx.lineTo(origin.x, h);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(origin.x - 5, 8);
    ctx.lineTo(origin.x, 0);
    ctx.lineTo(origin.x + 5, 8);
    ctx.stroke();
    ctx.restore();

    // 标签
    ctx.save();
    ctx.fillStyle = '#64748b';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('x', w - 14, origin.y - 8);
    ctx.fillText('y', origin.x + 14, 16);

    ctx.fillStyle = '#334155';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('O', origin.x, origin.y + 8);

    ctx.fillStyle = '#94a3b8';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (let x = Math.ceil(X_MIN); x <= Math.floor(X_MAX); x++) {
        if (x === 0) continue;
        const p = toCanvas(x, 0);
        ctx.fillText(x, p.x, origin.y + 6);
    }
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let y = Math.ceil(Y_MIN); y <= Math.floor(Y_MAX); y++) {
        if (y === 0) continue;
        const p = toCanvas(0, y);
        ctx.fillText(y, origin.x - 8, p.y);
    }
    ctx.restore();
}

// ============================================================
//  图形绘制
// ============================================================
function drawPath(points, color, options = {}) {
    if (points.length === 0) return;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = options.lineWidth || 2.5;
    if (options.dash) ctx.setLineDash(options.dash);
    else ctx.setLineDash([]);
    ctx.beginPath();
    let started = false;
    const { w, h } = getCanvasSize();
    for (const p of points) {
        if (p.x < -10 || p.x > w + 10 || p.y < -10 || p.y > h + 10) {
            started = false;
            continue;
        }
        if (!started) { ctx.moveTo(p.x, p.y); started = true; }
        else { ctx.lineTo(p.x, p.y); }
    }
    ctx.stroke();
    ctx.restore();
}

function plotFunction(fn, color, options = {}) {
    const { w, h } = getCanvasSize();
    if (w <= 0 || h <= 0) return;
    const steps = Math.max(400, Math.floor(w * 1.5));
    const points = [];
    for (let i = 0; i <= steps; i++) {
        const mx = X_MIN + (i / steps) * (X_MAX - X_MIN);
        try {
            const my = fn(mx);
            if (!isFinite(my) || isNaN(my)) {
                points.push(null);
                continue;
            }
            points.push(toCanvas(mx, my));
        } catch (e) {
            points.push(null);
        }
    }
    // 按段绘制，避免不连续点被连接
    let segment = [];
    for (const p of points) {
        if (p) {
            segment.push(p);
        } else if (segment.length > 0) {
            drawPath(segment, color, options);
            segment = [];
        }
    }
    if (segment.length > 0) drawPath(segment, color, options);
}

function drawFunctionItem(item) {
    try {
        const fn = buildFunction(item.expr);
        const isTrig = isTrigonometric(item.expr);
        plotFunction(fn, item.color, { dash: item.dash ? [6, 4] : [] });
    } catch (e) {
        console.error('绘制函数失败', e);
    }
}

function drawTriangleItem(item) {
    const { w, h } = getCanvasSize();
    if (w <= 0 || h <= 0) return;
    const pts = [item.p1, item.p2, item.p3].map(p => toCanvas(p.x, p.y));
    ctx.save();
    ctx.fillStyle = item.color + '20';
    ctx.strokeStyle = item.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    ctx.lineTo(pts[1].x, pts[1].y);
    ctx.lineTo(pts[2].x, pts[2].y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    const labels = item.labels || ['A', 'B', 'C'];
    ctx.save();
    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    pts.forEach((p, i) => {
        ctx.fillText(labels[i], p.x, p.y - 8);
    });
    ctx.restore();
}

function drawCircleItem(item) {
    const { w, h } = getCanvasSize();
    if (w <= 0 || h <= 0) return;
    const center = toCanvas(item.cx, item.cy);
    const p1 = toCanvas(0, 0);
    const p2 = toCanvas(1, 0);
    const pixelPerUnit = p2.x - p1.x;
    const r = Math.max(item.radius * pixelPerUnit, 3);
    ctx.save();
    ctx.strokeStyle = item.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(center.x, center.y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = item.color;
    ctx.beginPath();
    ctx.arc(center.x, center.y, 4, 0, Math.PI * 2);
    ctx.fill();

    // 半径标注
    if (item.showRadius !== false) {
        ctx.strokeStyle = item.color;
        ctx.setLineDash([4, 3]);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(center.x, center.y);
        ctx.lineTo(center.x + r, center.y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = item.color;
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(`r=${item.radius}`, center.x + r / 2, center.y - 4);
    }
    ctx.restore();
}

// ============================================================
//  图例与重绘
// ============================================================
function updateLegend() {
    const bar = document.getElementById('legendBar');
    let html = '<span style="color:#94a3b8;font-size:12px;">📊 图例</span>';
    if (drawnItems.length === 0) { bar.innerHTML = html; return; }
    drawnItems.forEach(item => {
        let style = '';
        if (item.type === 'function' && item.dash) {
            style = `border-top:3px dashed ${item.color};height:0;width:24px;display:inline-block;`;
        } else {
            style = `background:${item.color};height:3px;width:24px;display:inline-block;`;
        }
        html += `<span class="legend-item"><span style="${style}"></span>${item.label}</span>`;
    });
    bar.innerHTML = html;
}

function drawAll() {
    const { w, h } = getCanvasSize();
    if (w <= 0 || h <= 0) {
        setTimeout(drawAll, 50);
        return;
    }

    drawGridAndAxes();

    drawnItems.forEach(item => {
        if (item.type === 'function') drawFunctionItem(item);
        else if (item.type === 'triangle') drawTriangleItem(item);
        else if (item.type === 'circle') drawCircleItem(item);
    });

    updateLegend();

    const emptyState = document.getElementById('emptyState');
    if (emptyState) emptyState.style.display = drawnItems.length === 0 ? 'flex' : 'none';
}

// ============================================================
//  添加图形 API
// ============================================================
function addFunction(expr, options = {}) {
    const label = 'y = ' + expr;
    // 移除同名旧函数
    drawnItems = drawnItems.filter(item => !(item.type === 'function' && item.label === label));
    const isTrig = isTrigonometric(expr);
    const color = options.color || (isTrig ? '#ef4444' : nextColor());
    drawnItems.push({
        type: 'function',
        expr,
        label,
        color,
        dash: options.dash !== undefined ? options.dash : isTrig
    });
}

function addTriangle(p1, p2, p3, options = {}) {
    drawnItems = drawnItems.filter(item => item.type !== 'triangle');
    drawnItems.push({
        type: 'triangle',
        p1, p2, p3,
        label: options.label || '△ABC',
        labels: options.labels || ['A', 'B', 'C'],
        color: options.color || '#3b82f6'
    });
}

function addCircle(cx, cy, radius, options = {}) {
    drawnItems = drawnItems.filter(item => item.type !== 'circle');
    drawnItems.push({
        type: 'circle',
        cx, cy, radius,
        label: options.label || `圆(r=${radius})`,
        color: options.color || '#8b5cf6',
        showRadius: options.showRadius !== false
    });
}

function clearAll() {
    drawnItems = [];
    colorIndex = 0;
    drawAll();
}

function resetDefault() {
    drawnItems = [];
    colorIndex = 0;
    addFunction('x*x', { color: '#3b82f6', dash: false });
    addFunction('sin(x)', { color: '#ef4444', dash: true });
    addTriangle({ x: -2.5, y: -2 }, { x: 2.5, y: -2 }, { x: 0, y: 2.5 }, { color: '#10b981' });
    drawAll();
}

// ============================================================
//  对话交互
// ============================================================
function addMessage(text, type) {
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg msg-' + type;
    const now = new Date();
    const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    div.innerHTML = text + '<span class="msg-time">' + timeStr + '</span>';
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

function processCommand(cmd) {
    const lower = cmd.toLowerCase().trim();

    // 清除 / 重置
    if (lower.includes('清除') || lower.includes('清空')) {
        clearAll();
        addMessage('🗑️ 已清除所有图形，坐标轴保留。', 'ai');
        return;
    }
    if (lower.includes('重置') || lower.includes('恢复默认')) {
        resetDefault();
        addMessage('🔄 已恢复默认示例：y=x²、y=sin(x)、△ABC', 'ai');
        return;
    }

    // 函数
    const funcMatch = cmd.match(/y\s*=\s*(.+)/i);
    if (funcMatch) {
        const expr = funcMatch[1].trim();
        try {
            const fn = buildFunction(expr);
            // 测试几个点
            for (const t of [-1, 0, 1, 2]) {
                const v = fn(t);
                if (!isFinite(v) || isNaN(v)) throw new Error('Invalid');
            }
            addFunction(expr);
            drawAll();
            addMessage(`✅ 已绘制 <span class="math">y = ${expr}</span>`, 'ai');
        } catch (e) {
            addMessage('⚠️ 无法解析函数，请检查表达式。<br/>示例：<span class="math">y = x*x</span>、<span class="math">y = sin(x)</span>、<span class="math">y = sqrt(x)</span>', 'ai');
        }
        return;
    }

    // 三角形
    if (lower.includes('三角形')) {
        addTriangle({ x: -2.5, y: -2 }, { x: 2.5, y: -2 }, { x: 0, y: 2.5 }, { color: nextColor() });
        drawAll();
        addMessage('✅ 已绘制三角形 ABC', 'ai');
        return;
    }

    // 圆
    if (lower.includes('圆')) {
        // 尝试解析半径
        const rMatch = cmd.match(/半径\s*[=为]\s*(\d+\.?\d*)/);
        const radius = rMatch ? parseFloat(rMatch[1]) : 2.5;
        // 尝试解析圆心
        const centerMatch = cmd.match(/圆心\s*[=为]?\s*\(\s*(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)\s*\)/);
        const cx = centerMatch ? parseFloat(centerMatch[1]) : 0;
        const cy = centerMatch ? parseFloat(centerMatch[2]) : 0;
        addCircle(cx, cy, radius, { color: nextColor(), label: `圆心(${cx},${cy}) r=${radius}` });
        drawAll();
        addMessage(`✅ 已绘制圆心(${cx}, ${cy})、半径 ${radius} 的圆`, 'ai');
        return;
    }

    // 默认帮助
    addMessage('🤔 我没理解你的指令。试试这些：<br/>• <span class="math">"画 y = x*x"</span><br/>• <span class="math">"画 y = sin(x) + cos(x)"</span><br/>• <span class="math">"画 y = |x|"</span><br/>• "画一个三角形"<br/>• "画一个半径为3的圆"<br/>• "清除" / "重置"', 'ai');
}

function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    input.value = '';
    processCommand(text);
}

// ============================================================
//  鼠标坐标提示
// ============================================================
const canvasWrapper = document.getElementById('canvasWrapper');
const coordTooltip = document.getElementById('coordTooltip');

canvasWrapper.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const math = toMath(x, y);
    coordTooltip.textContent = `x: ${math.x.toFixed(2)}, y: ${math.y.toFixed(2)}`;
});

canvasWrapper.addEventListener('mouseleave', () => {
    coordTooltip.textContent = 'x: 0.00, y: 0.00';
});

// ============================================================
//  事件绑定
// ============================================================
document.getElementById('sendBtn').addEventListener('click', sendMessage);
document.getElementById('chatInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') sendMessage();
});
document.querySelectorAll('.quick-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.getElementById('chatInput').value = this.dataset.cmd;
        sendMessage();
    });
});
document.getElementById('resetBtn').addEventListener('click', () => {
    resetDefault();
    addMessage('🔄 已恢复默认示例：y=x²、y=sin(x)、△ABC', 'ai');
});
document.getElementById('exportBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'turing_math_graph.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    addMessage('💾 图片已导出', 'ai');
});

// ============================================================
//  窗口调整重绘
// ============================================================
let resizeTimer;
window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
        setupCanvas();
        drawAll();
    }, 100);
});

// ============================================================
//  初始化
// ============================================================
function init() {
    setupCanvas();
    resetDefault();
    setTimeout(() => {
        addMessage('👋 已加载默认示例：y=x²（蓝色）、y=sin(x)（红色虚线）、△ABC', 'ai');
    }, 300);
}

if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(init, 1);
} else {
    window.addEventListener('load', init);
}
</script>
