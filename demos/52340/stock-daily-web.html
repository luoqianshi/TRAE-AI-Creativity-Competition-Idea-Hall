/* ---------- 3. Mock 数据生成 ---------- */
function rand(min, max) { return Math.random() * (max - min) + min; }

/**
 * 根据基础价和波动率，生成"看起来真实"的实时行情。
 * 大部分股票波动 -2% ~ +2%，少量（变动区）波动 -7% ~ +8%。
 */
function genMock(stock, market, force = false) {
  // 用股票代码 + 当日时间锚定随机性，避免每次刷新都"洗牌"过山车
  const seedKey = `${market}|${stock.code}|${new Date().toDateString()}`;
  let h = 0;
  for (let i = 0; i < seedKey.length; i++) h = (h * 31 + seedKey.charCodeAt(i)) | 0;
  const seededRand = ((Math.abs(h) % 1000) / 1000);

  // 变动区候选股有更高概率出现"异常"波动
  const inHotPool = (HOT_POOL[market] || []).some(s => s.code === stock.code);
  const triggerChance = inHotPool ? 0.35 : 0.08;

  let pct;
  if (inHotPool && seededRand < triggerChance) {
    // 触发一个超阈值的"热门"行情
    pct = rand(3.5, 8.5) * (Math.random() < 0.5 ? 1 : -1);
  } else {
    // 常规波动
    pct = rand(-2.2, 2.2);
  }

  // 为了让"刷新"看起来有变化，叠一个小幅实时抖动
  const jitter = rand(-0.4, 0.4);
  pct = pct + jitter;

  const latest = +(stock.base * (1 + pct / 100)).toFixed(2);
  const change = +(latest - stock.base).toFixed(2);
  pct = +pct.toFixed(2);

  const over = pct >= stock.threshold_high || pct <= stock.threshold_low;
  return {
    market, ...stock,
    latest, change, change_pct: pct,
    over,
  };
}

  return all.filter(x => {

    if (seen.has(k)) return false;
    seen.add(k); return true;

/* 构造腾讯请求：A股=sh000001, 美股=usAAPL, 港股=hk00700 */
function toTencentSym(stock, market) {
  let prefix = "sh";
  if (market === "美股") prefix = "us";
  else if (market === "港股") prefix = "hk";
  else if (market === "A股") {
    prefix = stock.code.startsWith("3") || stock.code.startsWith("0") ? "sz" : "sh";
  }
  return `${prefix}${stock.code.toLowerCase()}`;
}

/* 多个 CORS 代理（任何一个可用即可） */
const CORS_PROXIES = [
  "", // 直连（最可能失败）
  "https://corsproxy.io/?",
  "https://api.allorigins.win/raw?url=",
  "https://api.codetabs.com/v1/proxy/?quest=",
];

async function tryFetchText(url) {
  for (const proxy of CORS_PROXIES) {
    const finalUrl = proxy ? proxy + encodeURIComponent(url) : url;
    try {
      const ctrl = new AbortController();
      const timeoutId = setTimeout(() => ctrl.abort(), 8000);
      const resp = await fetch(finalUrl, { signal: ctrl.signal });
      clearTimeout(timeoutId);
      if (!resp.ok) continue;
      const text = await resp.text();
      if (text && text.includes("=")) return text;
    } catch (e) { /* try next */ }
  }
  throw new Error("所有数据源均不可达");
}

function parseTencent(text) {
  /* 形如 v_sh000001="1~上证指数~000001~3250.45~..." */
  const lines = text.split(/[\r\n]+/).filter(l => l.includes('="'));
  const out = [];
  for (const line of lines) {
    const eqIdx = line.indexOf('="');
    if (eqIdx < 0) continue;
    const symRaw = line.substring(0, eqIdx).replace(/^v_/, "").toLowerCase();
    const content = line.substring(eqIdx + 2, line.lastIndexOf('"'));
    const parts = content.split("~");
    if (parts.length < 35) continue;

    let market, code;
    if (symRaw.startsWith("us")) { market = "美股"; code = symRaw.slice(2).toUpperCase(); }
    else if (symRaw.startsWith("hk")) { market = "港股"; code = parts[2] || symRaw.slice(2); }
    else { market = "A股"; code = parts[2] || symRaw.slice(2); }

    const name = parts[1] || code;
    const latest = parseFloat(parts[3]);
    const change = parseFloat(parts[31]);
    const change_pct = parseFloat(parts[32]);
    if (!isFinite(latest) || !isFinite(change_pct)) continue;
    out.push({ market, code, name, latest, change, change_pct });
  }
  return out;
}

        quote.base = s.base;
        quote.over = quote.change_pct >= s.threshold_high || quote.change_pct <= s.threshold_low;

    }
  }
  return null; // 不在自选股里就丢弃
}

async function fetchTencentAll() {
  const all = [];
  for (const market of Object.keys(WATCHLIST)) {
    for (const s of WATCHLIST[market]) {
      const sym = toTencentSym(s, market);
      all.push(sym);
    }
  }
  const url = `https://${TENCENT_HOST}/q=${all.join(",")}`;
  const text = await tryFetchText(url);
  const quotes = parseTencent(text);
  return quotes.map(mergeWatchlistMeta).filter(Boolean);
}

/* ---------- 5. 渲染 ---------- */
const $ = (s) => document.querySelector(s);

function fmtPct(p) {
  if (!isFinite(p)) return "--";
  const sign = p > 0 ? "+" : "";
  return `${sign}${p.toFixed(2)}%`;
}
function fmtPrice(p, market) {
  if (!isFinite(p)) return "--";
  if (market === "港股") return p.toFixed(p < 10 ? 3 : 2);
  if (market === "美股") return p.toFixed(2);
  return p.toFixed(2);
}
function fmtChange(c, market) {
  if (!isFinite(c)) return "--";
  const sign = c > 0 ? "+" : "";
  return `${sign}${c.toFixed(2)}`;
}

function rowHtml(item) {
  const cls = item.change_pct > 0 ? "up" : (item.change_pct < 0 ? "down" : "flat");
  const overTag = item.over ? `<span class="alert-tag">超阈值</span>` : "";
  return `
    <tr>
      <td>
        <div class="name">${item.name}${overTag}</div>
        <div class="code">${item.code}</div>
      </td>
      <td><span class="market-tag ${item.market}">${item.market}</span></td>
      <td>${fmtPrice(item.latest, item.market)}</td>
      <td>${fmtChange(item.change, item.market)}</td>
      <td class="r ${cls}">${fmtPct(item.change_pct)}</td>
      <td class="r" style="color: var(--muted); font-size: 12px;">
        ${item.threshold_low > -999 ? `${item.threshold_low} ~ +${item.threshold_high}` : "--"}
      </td>
    </tr>
  `;
}

function emptyHtml(emoji, text) {
  return `
    <tr><td colspan="6" class="panel-empty">
      <div class="em-icon">${emoji}</div>
      ${text}
    </td></tr>
  `;
}

function render() {
  const tbody = $("#tbody");
  let rows = state.data.slice();

  if (state.currentTab === "hot") {
    rows = rows.filter(r => r.over);
  } else if (state.currentTab !== "all") {
    rows = rows.filter(r => r.market === state.currentTab);
  }

  if (rows.length === 0) {
    tbody.innerHTML = emptyHtml("📭", "暂无数据，下一次刷新会再来看看");
    return;
  }
  tbody.innerHTML = rows.map(rowHtml).join("");

  // 计数
  const cnt = (m) => state.data.filter(r => r.market === m).length;
  $("#cnt-all").textContent  = state.data.length;
  $("#cnt-美股").textContent = cnt("美股");
  $("#cnt-A股").textContent  = cnt("A股");
  $("#cnt-港股").textContent = cnt("港股");
  $("#cnt-hot").textContent  = state.data.filter(r => r.over).length;
}

/* ---------- 6. 数据获取 + 定时刷新 ---------- */
function setStatus(kind, text) {
  const pill = $("#statusPill");
  pill.classList.remove("idle", "error");
  if (kind === "live") { /* default green */ }
  else if (kind === "idle") pill.classList.add("idle");
  else if (kind === "error") pill.classList.add("error");
  $("#statusText").textContent = text;
}

function nowStr() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

async function refresh() {
  if (state.refreshing) return;
  state.refreshing = true;
  setStatus("live", "刷新中");
  try {
    if (state.dataSource === "mock") {
      state.data = fetchMockAll();
    } else {
      state.data = await fetchTencentAll();
    }
    state.lastTs = Date.now();
    $("#lastUpdate").textContent = nowStr();
    setStatus("live", `${state.dataSource === "mock" ? "Mock" : "腾讯"} · 实时`);
    render();
  } catch (e) {
    console.error(e);
    // 失败时降级到 mock，避免白屏
    state.data = fetchMockAll();
    setStatus("error", state.dataSource === "mock" ? "Mock 异常" : "腾讯不可达，已降级");
    $("#lastUpdate").textContent = nowStr();
    render();
  } finally {
    state.refreshing = false;
  }
}

/* ---------- 7. 事件绑定 ---------- */
document.getElementById("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-tab]");
  if (!btn) return;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  state.currentTab = btn.dataset.tab;
  render();
});

document.getElementById("dataSourceToggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-src]");
  if (!btn) return;
  document.querySelectorAll("#dataSourceToggle button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  state.dataSource = btn.dataset.src;
  refresh();
});

document.getElementById("refreshBtn").addEventListener("click", refresh);

/* ---------- 8. 启动 ---------- */
refresh();
setInterval(refresh, state.refreshMs);
</script>
</body>
