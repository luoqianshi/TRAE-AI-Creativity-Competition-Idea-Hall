<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>碎片单词卡</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            perspective: 1000px;
        }

        .card {
            width: 420px;
            height: 520px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 24px;
            background: white;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.1),
                        0 18px 36px -18px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 40px;
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .word {
            font-size: 64px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 16px;
            letter-spacing: -2px;
        }

        .pronunciation {
            font-size: 18px;
            color: #6c757d;
            margin-bottom: 32px;
            font-weight: 300;
        }

        .meaning {
            font-size: 28px;
            color: #4a4a68;
            font-weight: 500;
            margin-bottom: 48px;
        }

        .hint {
            font-size: 14px;
            color: #adb5bd;
            position: absolute;
            bottom: 40px;
        }

        .example {
            font-size: 22px;
            line-height: 1.8;
            text-align: center;
            font-weight: 300;
        }

        .example-label {
            font-size: 16px;
            opacity: 0.8;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .controls {
            margin-top: 40px;
            display: flex;
            gap: 20px;
        }

        .btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .btn-next {
            background: white;
            color: #667eea;
        }

        .btn-star {
            background: white;
            color: #ffd700;
        }

        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
        }

        .stats {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 14px;
            color: #6c757d;
        }

        .title {
            position: absolute;
            top: 30px;
            left: 40px;
            font-size: 18px;
            font-weight: 500;
            color: #4a4a68;
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-face > * {
            animation: floatIn 0.6s ease forwards;
        }

        .card-face > *:nth-child(1) { animation-delay: 0.1s; }
        .card-face > *:nth-child(2) { animation-delay: 0.2s; }
        .card-face > *:nth-child(3) { animation-delay: 0.3s; }
        .card-face > *:nth-child(4) { animation-delay: 0.4s; }
    </style>
</head>
<body>
    <div class="title">碎片单词卡</div>
    <div class="stats">今日第 1 张</div>

    <div class="container">
        <div class="card" id="card">
            <div class="card-face card-front">
                <div class="word">serendipity</div>
                <div class="pronunciation">/ˌserənˈdɪpəti/</div>
                <div class="meaning">意外发现美好事物的运气</div>
                <div class="hint">点击卡片看例句 →</div>
            </div>
            <div class="card-face card-back">
                <div class="example-label">✨ 沙雕例句</div>
                <div class="example">
                    "我本来只是想打开手机<br>
                    查个单词<br>
                    结果刷了三小时短视频<br>
                    这就是我的 serendipity"
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-star">★</button>
        <button class="btn btn-next" id="nextBtn">→</button>
    </div>

    <script>
        const card = document.getElementById('card');
        const nextBtn = document.getElementById('nextBtn');

        const words = [
            {
                word: 'serendipity',
                pro: '/ˌserənˈdɪpəti/',
                mean: '意外发现美好事物的运气',
                example: '我本来只是想打开手机<br>查个单词<br>结果刷了三小时短视频<br>这就是我的 serendipity'
            },
            {
                word: 'ephemeral',
                pro: '/ɪˈfemərəl/',
                mean: '转瞬即逝的，短暂的',
                example: '周末的快乐是 ephemeral 的<br>周一的痛苦是永恒的'
            },
            {
                word: 'procrastinate',
                pro: '/prəˈkræstɪneɪt/',
                mean: '拖延，耽搁',
                example: '我不是在 procrastinate<br>我是在等灵感<br>只不过灵感还在路上'
            }
        ];

        let currentIndex = 0;
        let count = 1;

        card.addEventListener('click', () => {
            card.classList.toggle('flipped');
        });

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % words.length;
            count++;
            
            const w = words[currentIndex];
            document.querySelector('.word').textContent = w.word;
            document.querySelector('.pronunciation').textContent = w.pro;
            document.querySelector('.meaning').textContent = w.mean;
            document.querySelector('.example').innerHTML = w.example;
            document.querySelector('.stats').textContent = `今日第 ${count} 张`;
            
            card.classList.remove('flipped');
            
            // 重新触发动画
            const faces = card.querySelectorAll('.card-face > *');
            faces.forEach((el, i) => {
                el.style.animation = 'none';
                el.offsetHeight; // 触发重绘
                el.style.animation = null;
                el.style.animationDelay = `${(i + 1) * 0.1}s`;
            });
        });
    </script>
</body>
</html>
