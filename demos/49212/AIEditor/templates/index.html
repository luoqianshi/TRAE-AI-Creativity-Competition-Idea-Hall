<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI剪视频 - 智能视频剪辑助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00d2ff;
            --primary-dark: #3a7bd5;
            --bg-dark: #1a1a2e;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --text-secondary: #a0a0a0;
            --success: #00c853;
            --error: #ff5252;
            --warning: #ffc107;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: var(--text);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 300px 1fr 350px;
            gap: 20px;
            min-height: 100vh;
        }

        /* 左侧边栏 - 素材管理 */
        .sidebar-left {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, var(--primary), var(--primary-dark));
            border-radius: 2px;
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(0, 210, 255, 0.05);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .upload-text {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .upload-text span {
            color: var(--primary);
            cursor: pointer;
        }

        .file-list {
            max-height: calc(100vh - 300px);
            overflow-y: auto;
        }

        .file-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 210, 255, 0.3);
        }

        .file-icon {
            font-size: 24px;
        }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-meta {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .file-delete {
            opacity: 0;
            cursor: pointer;
            padding: 4px;
            transition: opacity 0.2s;
        }

        .file-item:hover .file-delete {
            opacity: 1;
        }

        /* 中间区域 - 聊天和预览 */
        .main-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chat-container {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-title {
            font-size: 18px;
            font-weight: 600;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            gap: 12px;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        }

        .message.user .message-avatar {
            background: rgba(255, 255, 255, 0.1);
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
        }

        .message.assistant .message-content {
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid rgba(0, 210, 255, 0.2);
        }

        .message.user .message-content {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-input-area {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-input-wrapper {
            display: flex;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text);
            font-size: 14px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: var(--primary);
        }

        .chat-input::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(0, 210, 255, 0.3);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .preview-container {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .video-preview {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
        }

        .video-preview video {
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }

        .preview-placeholder {
            text-align: center;
            color: var(--text-secondary);
        }

        .preview-placeholder .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        /* 右侧边栏 - 设置和操作 */
        .sidebar-right {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .settings-section {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        .btn {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 210, 255, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-success {
            background: linear-gradient(135deg, #00c853, #69f0ae);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 200, 83, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-dot.connected {
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
        }

        .status-dot.disconnected {
            background: var(--error);
            box-shadow: 0 0 10px var(--error);
        }

        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .quick-action-btn {
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-action-btn:hover {
            background: rgba(0, 210, 255, 0.1);
            border-color: rgba(0, 210, 255, 0.3);
            color: var(--text);
        }

        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Toast 通知 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: linear-gradient(135deg, #00c853, #69f0ae);
        }

        .toast.error {
            background: linear-gradient(135deg, #ff5252, #ff867f);
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
            }

            .sidebar-left, .sidebar-right {
                order: 1;
            }

            .main-area {
                order: 0;
            }
        }

        /* 加载动画 */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            animation: typing 1s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            50% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        /* 操作历史 */
        .action-list {
            margin-top: 15px;
        }

        .action-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .action-icon {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧边栏 - 素材管理 -->
        <div class="sidebar-left">
            <div class="section-title">视频素材</div>
            
            <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📁</div>
                <div class="upload-text">
                    拖拽视频文件到这里<br>
                    或 <span>点击选择文件</span>
                </div>
                <input type="file" id="fileInput" multiple accept="video/*" style="display: none;">
            </div>

            <div class="file-list" id="fileList">
                <!-- 文件列表将动态生成 -->
            </div>
        </div>

        <!-- 中间区域 - 聊天和预览 -->
        <div class="main-area">
            <div class="chat-container">
                <div class="chat-header">
                    <div class="chat-title">💬 AI剪辑助手</div>
                    <button class="btn-secondary btn" style="width: auto; padding: 8px 16px;" onclick="clearChat()">
                        清空对话
                    </button>
                </div>
                
                <div class="chat-messages" id="chatMessages">
                    <div class="message assistant">
                        <div class="message-avatar">🤖</div>
                        <div class="message-content">
                            你好！我是AI视频剪辑助手。请先上传视频素材，然后告诉我你想怎么剪辑，我会帮你完成！<br><br>
                            例如：
                            <ul style="margin: 10px 0; padding-left: 20px;">
                                <li>帮我把这些视频合并成一个30秒的短片</li>
                                <li>提取每个视频的精彩片段，总时长控制在1分钟</li>
                                <li>把第一个视频裁剪10-20秒的部分</li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="chat-input-area">
                    <div class="chat-input-wrapper">
                        <textarea class="chat-input" id="chatInput" placeholder="描述你的剪辑需求..." rows="2"></textarea>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                            ➤
                        </button>
                    </div>
                </div>
            </div>

            <div class="preview-container">
                <div class="section-title">预览</div>
                <div class="video-preview" id="videoPreview">
                    <div class="preview-placeholder">
                        <div class="icon">🎬</div>
                        <div>生成视频后在此预览</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧边栏 - 设置和操作 -->
        <div class="sidebar-right">
            <div class="settings-section">
                <div class="section-title">API 配置</div>
                
                <div class="status-indicator">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">未连接</span>
                </div>

                <div class="form-group">
                    <label class="form-label">API Base URL</label>
                    <input type="text" class="form-input" id="apiBase" placeholder="https://api.openai.com/v1">
                </div>

                <div class="form-group">
                    <label class="form-label">API Key</label>
                    <input type="password" class="form-input" id="apiKey" placeholder="sk-...">
                </div>

                <div class="form-group">
                    <label class="form-label">模型</label>
                    <input type="text" class="form-input" id="modelName" placeholder="gpt-4o">
                </div>

                <button class="btn btn-secondary" onclick="saveConfig()">保存配置</button>
            </div>

            <div class="settings-section">
                <div class="section-title">快捷操作</div>
                <div class="quick-actions">
                    <button class="quick-action-btn" onclick="quickAction('合并所有视频')">合并全部</button>
                    <button class="quick-action-btn" onclick="quickAction('提取30秒精彩片段')">精彩片段</button>
                    <button class="quick-action-btn" onclick="quickAction('添加淡入淡出效果')">淡入淡出</button>
                    <button class="quick-action-btn" onclick="quickAction('生成1分钟短视频')">1分钟短片</button>
                </div>
            </div>

            <div class="settings-section">
                <div class="section-title">生成视频</div>
                <button class="btn btn-success" id="generateBtn" onclick="generateVideo()" disabled>
                    🎬 开始生成
                </button>
                <div class="progress-bar" id="progressBar" style="display: none;">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="settings-section" id="actionHistory" style="display: none;">
                <div class="section-title">操作记录</div>
                <div class="action-list" id="actionList">
                    <!-- 操作记录将动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // 全局状态
        let projectId = null;
        let uploadedFiles = [];
        let chatHistory = [];

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadConfig();
            setupDragDrop();
            setupEnterKey();
        });

        // 加载配置
        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                const data = await response.json();
                if (data.success) {
                    document.getElementById('apiBase').value = data.data.apiBase || 'https://api.openai.com/v1';
                    document.getElementById('modelName').value = data.data.model || 'gpt-4o';
                    updateStatus(data.data.hasApiKey);
                }
            } catch (error) {
                console.error('加载配置失败:', error);
            }
        }

        // 保存配置
        async function saveConfig() {
            const apiKey = document.getElementById('apiKey').value;
            const apiBase = document.getElementById('apiBase').value;
            const model = document.getElementById('modelName').value;

            try {
                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ apiKey, apiBase, model })
                });
                const data = await response.json();
                if (data.success) {
                    showToast('配置保存成功', 'success');
                    updateStatus(!!apiKey);
                } else {
                    showToast(data.message, 'error');
                }
            } catch (error) {
                showToast('保存配置失败', 'error');
            }
        }

        // 更新状态指示器
        function updateStatus(connected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            dot.className = 'status-dot ' + (connected ? 'connected' : 'disconnected');
            text.textContent = connected ? '已连接' : '未连接';
        }

        // 设置拖拽上传
        function setupDragDrop() {
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');

            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = 'var(--primary)';
                uploadArea.style.background = 'rgba(0, 210, 255, 0.1)';
            });

            uploadArea.addEventListener('dragleave', () => {
                uploadArea.style.borderColor = '';
                uploadArea.style.background = '';
            });

            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '';
                uploadArea.style.background = '';
                handleFiles(e.dataTransfer.files);
            });

            fileInput.addEventListener('change', (e) => {
                handleFiles(e.target.files);
            });
        }

        // 处理文件上传
        async function handleFiles(files) {
            for (const file of files) {
                if (!file.type.startsWith('video/')) {
                    showToast('只支持视频文件', 'error');
                    continue;
                }

                const formData = new FormData();
                formData.append('file', file);
                if (projectId) {
                    formData.append('projectId', projectId);
                }

                try {
                    showToast('正在上传 ' + file.name + '...', 'info');
                    const response = await fetch('/api/upload', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();
                    if (data.success) {
                        projectId = data.data.projectId;
                        uploadedFiles.push(data.data.file);
                        updateFileList();
                        updateGenerateButton();
                        showToast('上传成功', 'success');
                    } else {
                        showToast(data.message, 'error');
                    }
                } catch (error) {
                    showToast('上传失败', 'error');
                }
            }
        }

        // 更新文件列表
        function updateFileList() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = uploadedFiles.map((file, index) => `
                <div class="file-item">
                    <div class="file-icon">🎬</div>
                    <div class="file-info">
                        <div class="file-name">${file.name}</div>
                        <div class="file-meta">${file.duration}秒 | ${file.size}MB</div>
                    </div>
                    <div class="file-delete" onclick="deleteFile(${index})">✕</div>
                </div>
            `).join('');
        }

        // 删除文件
        function deleteFile(index) {
            uploadedFiles.splice(index, 1);
            updateFileList();
            updateGenerateButton();
        }

        // 更新生成按钮状态
        function updateGenerateButton() {
            const btn = document.getElementById('generateBtn');
            btn.disabled = uploadedFiles.length === 0;
        }

        // 设置回车键发送
        function setupEnterKey() {
            const input = document.getElementById('chatInput');
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        }

        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;

            if (!projectId) {
                showToast('请先上传视频素材', 'error');
                return;
            }

            addMessage('user', message);
            input.value = '';

            // 显示加载动画
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            document.getElementById('chatMessages').appendChild(loadingDiv);
            scrollChatToBottom();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ projectId, message })
                });
                const data = await response.json();
                
                // 移除加载动画
                loadingDiv.remove();
                
                if (data.success) {
                    addMessage('assistant', data.data.message);
                    
                    // 显示操作记录
                    if (data.data.actions && data.data.actions.length > 0) {
                        showActionHistory(data.data.actions);
                    }
                    
                    // 启用生成按钮
                    updateGenerateButton();
                } else {
                    addMessage('assistant', data.message || '处理失败，请重试');
                }
            } catch (error) {
                loadingDiv.remove();
                addMessage('assistant', '网络错误，请检查连接');
            }
        }

        // 添加消息
        function addMessage(role, content) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + role;
            messageDiv.innerHTML = `
                <div class="message-avatar">${role === 'user' ? '👤' : '🤖'}</div>
                <div class="message-content">${content.replace(/\n/g, '<br>')}</div>
            `;
            messagesDiv.appendChild(messageDiv);
            scrollChatToBottom();
        }

        // 滚动到底部
        function scrollChatToBottom() {
            const messagesDiv = document.getElementById('chatMessages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // 清空对话
        function clearChat() {
            document.getElementById('chatMessages').innerHTML = `
                <div class="message assistant">
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">
                        对话已清空。有什么我可以帮助你的吗？
                    </div>
                </div>
            `;
        }

        // 快捷操作
        function quickAction(action) {
            document.getElementById('chatInput').value = action;
            sendMessage();
        }

        // 显示操作历史
        function showActionHistory(actions) {
            const historyDiv = document.getElementById('actionHistory');
            const listDiv = document.getElementById('actionList');
            
            const icons = {
                'trim': '✂️',
                'concat': '🔗',
                'add_text': '📝',
                'add_music': '🎵',
                'set_duration': '⏱️',
                'highlight': '⭐',
                'transition': '🔄'
            };
            
            listDiv.innerHTML = actions.map(action => `
                <div class="action-item">
                    <span class="action-icon">${icons[action.type] || '🎬'}</span>
                    <span>${action.description || action.type}</span>
                </div>
            `).join('');
            
            historyDiv.style.display = 'block';
        }

        // 生成视频
        async function generateVideo() {
            if (!projectId) {
                showToast('请先上传视频素材', 'error');
                return;
            }

            const btn = document.getElementById('generateBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            
            btn.disabled = true;
            progressBar.style.display = 'block';
            
            // 模拟进度
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress > 90) progress = 90;
                progressFill.style.width = progress + '%';
            }, 500);

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ projectId })
                });
                const data = await response.json();
                
                clearInterval(progressInterval);
                progressFill.style.width = '100%';
                
                if (data.success) {
                    showToast('视频生成成功！', 'success');
                    // 更新预览
                    setTimeout(() => {
                        document.getElementById('videoPreview').innerHTML = `
                            <video controls>
                                <source src="/api/download/${projectId}" type="video/mp4">
                                您的浏览器不支持视频播放
                            </video>
                        `;
                    }, 500);
                } else {
                    showToast(data.message, 'error');
                }
            } catch (error) {
                clearInterval(progressInterval);
                showToast('生成失败，请重试', 'error');
            } finally {
                setTimeout(() => {
                    progressBar.style.display = 'none';
                    progressFill.style.width = '0%';
                    btn.disabled = false;
                }, 1000);
            }
        }

        // 显示提示
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
