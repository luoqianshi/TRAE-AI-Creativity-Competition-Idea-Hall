<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AI 知识卡片工厂 · 产品原型</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --wood-dark: #6b4f3a;
            --wood-mid: #a68b6b;
            --wood-light: #d4c4a8;
            --paper: #fdfbf7;
            --paper-shadow: rgba(107, 79, 58, 0.15);
            --ink: #3d3229;
            --muted: #7d6b5d;
            --accent: #5a7c6f;
            --accent-light: #e8f0ec;
            --correct: #4a8b6b;
            --wrong: #c45a4a;
            --radius: 14px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--ink);
            background:
                linear-gradient(135deg, rgba(107,79,58,0.08) 0%, rgba(166,139,107,0.05) 100%),
                url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><rect fill="%23c9b896" width="400" height="400"/><path d="M0 0h400v20H0zM0 80h400v20H0zM0 160h400v20H0zM0 240h400v20H0zM0 320h400v20H0z" fill="%23bfad8c" opacity="0.5"/><path d="M20 0v400M120 0v400M220 0v400M320 0v400" stroke="%23b5a082" stroke-width="2" opacity="0.3"/></svg>');
            background-size: 400px 400px, 400px 400px;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 600;
            color: var(--paper);
            text-shadow: 0 2px 8px rgba(0,0,0,0.25);
            letter-spacing: 0.05em;
        }

        header p {
            color: var(--paper);
            opacity: 0.9;
            margin-top: 6px;
            font-size: 0.95rem;
            text-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        .paper {
            background: var(--paper);
            border-radius: var(--radius);
            box-shadow: 0 8px 32px var(--paper-shadow);
            padding: 32px;
            margin-bottom: 24px;
            position: relative;
        }

        .paper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: var(--radius);
            pointer-events: none;
            box-shadow: inset 0 0 0 1px rgba(166,139,107,0.2);
        }

        h2 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--wood-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h2::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--wood-light), transparent);
        }

        textarea {
            width: 100%;
            min-height: 160px;
            padding: 16px;
            border: 1px solid var(--wood-light);
            border-radius: 10px;
            font-size: 1rem;
            line-height: 1.7;
            resize: vertical;
            background: #fff;
            color: var(--ink);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(90,124,111,0.1);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .word-count {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .btn {
            padding: 12px 28px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 12px rgba(90,124,111,0.3);
        }

        .btn-primary:hover {
            background: #4d6b60;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: var(--wood-light);
            color: var(--wood-dark);
        }

        .btn-secondary:hover {
            background: #c9b896;
        }

        .model-status {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .model-status.loading { background: var(--accent-light); color: var(--accent); }
        .model-status.ready { background: #e8f5ee; color: var(--correct); }
        .model-status.error { background: #fbecea; color: var(--wrong); }

        .loading {
            text-align: center;
            padding: 48px;
            color: var(--muted);
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid var(--wood-light);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }

        .hint-box {
            margin-top: 12px;
            padding: 10px 14px;
            background: #fff8e6;
            border: 1px solid #f0d78c;
            border-radius: 8px;
            color: #8a6d1f;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .error-box {
            margin-top: 12px;
            padding: 10px 14px;
            background: #fbecea;
            border: 1px solid #eeb8ae;
            border-radius: 8px;
            color: #9a3d2f;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fallback-notice {
            background: #fff8e6;
            color: #8a6d1f;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }

        /* Cards */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        .card {
            perspective: 1000px;
            height: 180px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(107,79,58,0.08);
            border: 1px solid var(--wood-light);
        }

        .card-front {
            background: linear-gradient(135deg, #fff 0%, #f7f4ee 100%);
        }

        .card-back {
            background: linear-gradient(135deg, #e8f5ee 0%, #d4edda 100%);
            transform: rotateY(180deg);
        }

        .card-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .card-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--ink);
        }

        .card-hint {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 10px;
        }

        /* Quiz */
        .quiz-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .quiz-item {
            border: 1px solid var(--wood-light);
            border-radius: 12px;
            padding: 18px;
            background: #fff;
        }

        .quiz-question {
            font-weight: 600;
            margin-bottom: 14px;
            color: var(--ink);
            font-size: 0.95rem;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .quiz-option {
            padding: 11px 14px;
            border: 1px solid var(--wood-light);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
        }

        .quiz-option:hover:not(.disabled) {
            background: var(--accent-light);
            border-color: var(--accent);
        }

        .quiz-option.selected {
            background: var(--accent-light);
            border-color: var(--accent);
        }

        .quiz-option.correct {
            background: #e8f5ee;
            border-color: var(--correct);
            color: var(--correct);
        }

        .quiz-option.wrong {
            background: #fbecea;
            border-color: var(--wrong);
            color: var(--wrong);
        }

        .quiz-option.disabled {
            pointer-events: none;
            opacity: 0.85;
        }

        .option-index {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #f0ebe3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .explanation {
            margin-top: 14px;
            padding: 12px 14px;
            background: var(--accent-light);
            border-radius: 8px;
            color: var(--accent);
            font-size: 0.9rem;
            line-height: 1.5;
            display: none;
        }

        .explanation.show { display: block; }

        .fill-input, .short-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--wood-light);
            border-radius: 8px;
            font-size: 0.95rem;
            margin-top: 8px;
        }

        .fill-input:focus, .short-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .tf-buttons {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .tf-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--wood-light);
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            transition: all 0.15s;
        }

        .tf-btn:hover:not(.disabled) {
            background: var(--accent-light);
            border-color: var(--accent);
        }

        .tf-btn.selected {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .tf-btn.disabled { pointer-events: none; }

        .tf-btn.correct {
            background: #e8f5ee;
            border-color: var(--correct);
            color: var(--correct);
        }

        .tf-btn.wrong {
            background: #fbecea;
            border-color: var(--wrong);
            color: var(--wrong);
        }

        .result-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: var(--accent-light);
            border-radius: 10px;
            margin-top: 20px;
        }

        .result-score {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .nav-tab {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--wood-light);
            background: #fff;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .nav-tab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .review-card {
            padding: 20px;
            border: 1px solid var(--wood-light);
            border-radius: 12px;
            background: #fff;
            margin-bottom: 16px;
        }

        .review-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .review-actions .btn {
            flex: 1;
            padding: 10px;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            body { padding: 24px 12px; }
            header h1 { font-size: 1.6rem; }
            .paper { padding: 20px; }
            .cards-grid { grid-template-columns: 1fr; }
            .toolbar { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AI 知识卡片工厂</h1>
            <p>粘贴文章，生成卡片，智能练习，自动批注</p>
        </header>

        <section class="paper" id="inputSection">
            <h2>输入文章</h2>
            <textarea id="sourceText" placeholder="在这里粘贴文章、笔记或任何学习内容..."></textarea>
            <div class="toolbar">
                <span class="word-count">字数：<span id="wordCount">0</span> / 8000</span>
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-secondary" id="exampleBtn">填入示例</button>
                    <button class="btn btn-primary" id="generateBtn" disabled>生成知识卡片和习题</button>
                </div>
            </div>
            <div id="modelStatus" class="model-status loading">
                <span class="spinner" style="width:18px;height:18px;margin:0;border-width:2px;"></span>
                <span>正在加载本地 AI 模型，首次使用需下载约 300MB，请稍候...</span>
            </div>
            <div id="lengthHint" class="hint-box hidden">
                <span>💡</span>
                <span>字数不少于 250 字，生成效果会更好</span>
            </div>
            <div id="unrecognizedHint" class="error-box hidden">
                <span>⚠️</span>
                <span>无法识别，使用默认示例</span>
            </div>
        </section>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>正在整理知识点...</p>
        </div>

        <section class="paper hidden" id="cardsSection">
            <h2>知识卡片</h2>
            <div id="fallbackNotice" class="fallback-notice hidden"></div>
            <div class="cards-grid" id="cardsList"></div>
        </section>

        <section class="paper hidden" id="quizSection">
            <h2>巩固练习</h2>
            <div class="quiz-list" id="quizList"></div>
            <div style="margin-top:20px; text-align:center;">
                <button class="btn btn-primary" id="submitBtn">提交答案</button>
            </div>
            <div id="resultBar" class="result-bar hidden">
                <span>练习完成</span>
                <span class="result-score" id="resultScore">得分：0/5</span>
            </div>
        </section>

        <section class="paper hidden" id="reviewSection">
            <h2>今日复习</h2>
            <div class="nav-tabs">
                <div class="nav-tab active" data-tab="due">待复习</div>
                <div class="nav-tab" data-tab="wrong">错题本</div>
            </div>
            <div id="reviewContent">
                <div class="review-card">
                    <div class="card-label" style="margin-bottom:8px;">复习 1/3</div>
                    <div class="quiz-question">费曼学习法的核心思想是什么？</div>
                    <div class="review-actions">
                        <button class="btn btn-secondary">模糊</button>
                        <button class="btn btn-primary">记得</button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

        const EXAMPLE_TEXT = `费曼学习法（Feynman Technique）是一种以教代学的深度学习方法，由诺贝尔物理学奖得主理查德·费曼提出。它的核心思想是：如果你不能用简单的语言把一个概念讲清楚，那你就还没有真正理解它。\n\n费曼学习法分为四个步骤：\n第一步，选择一个你想学习的概念，把它写在纸上。\n第二步，假装你在向一个十二岁的孩子讲解这个概念，用尽可能简单的语言描述它，避免使用专业术语。\n第三步，当你卡壳时，回到原始资料重新学习，直到你能用简单语言解释为止。\n第四步，简化和类比，把你的解释进一步精简，并用类比帮助理解。\n\n研究表明，费曼学习法能显著提升长期记忆和理解深度，因为它强迫学习者主动加工信息，而不是被动接受。`;

        const sourceText = document.getElementById('sourceText');
        const wordCount = document.getElementById('wordCount');
        const generateBtn = document.getElementById('generateBtn');
        const exampleBtn = document.getElementById('exampleBtn');
        const modelStatus = document.getElementById('modelStatus');
        const lengthHint = document.getElementById('lengthHint');
        const unrecognizedHint = document.getElementById('unrecognizedHint');
        const loading = document.getElementById('loading');
        const cardsSection = document.getElementById('cardsSection');
        const quizSection = document.getElementById('quizSection');
        const cardsList = document.getElementById('cardsList');
        const quizList = document.getElementById('quizList');
        const submitBtn = document.getElementById('submitBtn');
        const resultBar = document.getElementById('resultBar');
        const resultScore = document.getElementById('resultScore');
        const fallbackNotice = document.getElementById('fallbackNotice');

        let generator = null;
        let modelReady = false;
        let currentQuiz = [];
        let userAnswers = new Array(5).fill(null);

        async function loadModel() {
            try {
                generator = await pipeline('text-generation', 'Xenova/Qwen1.5-0.5B-Chat', {
                    dtype: 'q4f16',
                    device: 'wasm',
                });
                modelReady = true;
                modelStatus.className = 'model-status ready';
                modelStatus.innerHTML = '<span>✅ 本地 AI 模型已就绪</span>';
                generateBtn.disabled = false;
            } catch (err) {
                console.error(err);
                modelStatus.className = 'model-status error';
                modelStatus.innerHTML = '<span>❌ 模型加载失败，将使用本地规则生成</span>';
                generateBtn.disabled = false;
            }
        }

        loadModel();

        sourceText.addEventListener('input', () => {
            const len = sourceText.value.length;
            wordCount.textContent = len;
            lengthHint.classList.toggle('hidden', len === 0 || len >= 250);
            unrecognizedHint.classList.add('hidden');
        });

        exampleBtn.addEventListener('click', () => {
            sourceText.value = EXAMPLE_TEXT;
            wordCount.textContent = sourceText.value.length;
            lengthHint.classList.add('hidden');
        });

        generateBtn.addEventListener('click', async () => {
            const text = sourceText.value.trim();
            if (!text) {
                alert('请先输入文章内容');
                return;
            }

            if (!hasReadableText(text)) {
                unrecognizedHint.classList.remove('hidden');
                sourceText.value = EXAMPLE_TEXT;
                wordCount.textContent = sourceText.value.length;
                lengthHint.classList.add('hidden');
            }

            setLoading(true);
            hideResults();

            const inputText = sourceText.value.trim();
            let result = null;
            let usedFallback = false;

            if (modelReady && generator) {
                try {
                    result = await generateWithModel(inputText);
                } catch (err) {
                    console.error('模型生成失败', err);
                }
            }

            if (!result) {
                result = generateWithRules(inputText);
                usedFallback = true;
            }

            renderCards(result.cards || []);
            currentQuiz = result.quiz || [];
            renderQuiz(currentQuiz);

            if (usedFallback) {
                fallbackNotice.textContent = '本地模型未正常输出，已切换为本地规则生成。';
                fallbackNotice.classList.remove('hidden');
            }

            showResults();
            setLoading(false);
            cardsSection.scrollIntoView({ behavior: 'smooth' });
        });

        function setLoading(isLoading) {
            loading.classList.toggle('hidden', !isLoading);
            generateBtn.disabled = isLoading || !modelReady;
        }

        function hideResults() {
            cardsSection.classList.add('hidden');
            quizSection.classList.add('hidden');
            cardsList.innerHTML = '';
            quizList.innerHTML = '';
            resultBar.classList.add('hidden');
            submitBtn.classList.remove('hidden');
            submitBtn.disabled = false;
            userAnswers = new Array(5).fill(null);
            fallbackNotice.classList.add('hidden');
        }

        function showResults() {
            cardsSection.classList.remove('hidden');
            quizSection.classList.remove('hidden');
        }

        async function generateWithModel(text) {
            const prompt = `请根据以下文章，生成学习材料。只输出 JSON，不要任何额外说明。

文章：${text.slice(0, 1500)}

要求：
1. 提取 5 个核心知识点，每个知识点包含 question（正面问题）和 answer（背面答案）。
2. 生成 5 道单选题，每道题包含 question（题干）、options（4 个选项数组）、correct（正确选项索引 0-3）、explanation（解析）。
3. 输出格式：
{
  "cards": [{"question": "...", "answer": "..."}],
  "quiz": [{"question": "...", "options": ["...", "...", "...", "..."], "correct": 0, "explanation": "..."}]
}`;

            const chatPrompt = `<|im_start|>system\nYou are a helpful assistant that outputs valid JSON only.\n<|im_end|>\n<|im_start|>user\n${prompt}\n<|im_end|>\n<|im_start|>assistant\n`;

            const output = await generator(chatPrompt, {
                max_new_tokens: 1024,
                do_sample: false,
                return_full_text: false,
            });

            const generated = output[0].generated_text;
            const jsonMatch = generated.match(/\{[\s\S]*\}/);
            if (!jsonMatch) throw new Error('未找到 JSON');
            const parsed = JSON.parse(jsonMatch[0]);

            // 把单选题扩展成多种题型
            parsed.quiz = expandQuestionTypes(parsed.quiz || []);
            return parsed;
        }

        function expandQuestionTypes(quiz) {
            const types = ['single', 'multiple', 'true_false', 'fill', 'short'];
            return quiz.slice(0, 5).map((q, i) => {
                const type = types[i % types.length];
                if (type === 'single') {
                    return q;
                } else if (type === 'multiple') {
                    return {
                        type: 'multiple',
                        question: q.question.replace('？', '？（多选）'),
                        options: q.options,
                        correct: [q.correct],
                        explanation: q.explanation
                    };
                } else if (type === 'true_false') {
                    const isTrue = q.correct === 0 || q.correct === 1;
                    return {
                        type: 'true_false',
                        question: q.question,
                        correct: isTrue,
                        explanation: q.explanation
                    };
                } else if (type === 'fill') {
                    const answerText = q.options[q.correct];
                    const keyword = extractKeyword(answerText) || '正确';
                    const blank = '______';
                    return {
                        type: 'fill',
                        question: q.question.replace(/什么|哪个|哪项/, blank),
                        correct: [keyword],
                        explanation: `正确答案是：${answerText}`
                    };
                } else if (type === 'short') {
                    return {
                        type: 'short',
                        question: q.question,
                        correct: [q.options[q.correct]],
                        explanation: q.explanation
                    };
                }
                return q;
            });
        }

        function generateWithRules(text) {
            const sentences = text.replace(/[。！？\n]/g, '|').split('|').map(s => s.trim()).filter(s => s.length > 8);
            const cards = sentences.slice(0, 5).map((sentence, idx) => {
                const keyword = extractKeyword(sentence);
                return {
                    question: `关于「${keyword}」，文章中提到了什么？`,
                    answer: sentence
                };
            });

            while (cards.length < 5) {
                cards.push({ question: '文章中提到了什么？', answer: '请在原文中查找对应内容。' });
            }

            const quiz = [];
            const types = ['single', 'multiple', 'true_false', 'fill', 'short'];
            for (let i = 0; i < 5 && i < cards.length; i++) {
                const correctCard = cards[i];
                const distractors = cards.filter((_, idx) => idx !== i).slice(0, 3);
                while (distractors.length < 3) {
                    distractors.push({ answer: '其他内容' });
                }
                const options = shuffle([correctCard.answer, ...distractors.map(d => d.answer)]);
                const correctIdx = options.indexOf(correctCard.answer);
                const type = types[i];

                if (type === 'single') {
                    quiz.push({
                        type: 'single',
                        question: correctCard.question,
                        options: options,
                        correct: correctIdx,
                        explanation: `根据文章内容，正确答案是：${correctCard.answer}`
                    });
                } else if (type === 'multiple') {
                    quiz.push({
                        type: 'multiple',
                        question: correctCard.question + '（多选）',
                        options: options,
                        correct: [correctIdx],
                        explanation: `根据文章内容，正确答案是：${correctCard.answer}`
                    });
                } else if (type === 'true_false') {
                    quiz.push({
                        type: 'true_false',
                        question: correctCard.question.replace('什么？', '：') + correctCard.answer,
                        correct: true,
                        explanation: `该陈述正确。${correctCard.answer}`
                    });
                } else if (type === 'fill') {
                    const keyword = extractKeyword(correctCard.answer);
                    quiz.push({
                        type: 'fill',
                        question: correctCard.question.replace('提到了什么？', '提到了' + keyword + '？'),
                        correct: [keyword],
                        explanation: `正确答案是：${keyword}`
                    });
                } else if (type === 'short') {
                    quiz.push({
                        type: 'short',
                        question: correctCard.question,
                        correct: [correctCard.answer],
                        explanation: `参考答案：${correctCard.answer}`
                    });
                }
            }

            return { cards, quiz };
        }

        function extractKeyword(sentence) {
            const stopWords = new Set(['的', '了', '是', '在', '和', '与', '或', '它', '这', '那', '一个', '一种', '可以', '需要', '通过']);
            const words = sentence.split(/\s+|，|、|；/);
            for (const word of words) {
                const clean = word.replace(/[.,!?;:()"'""''（）【】]/g, '');
                if (clean.length >= 2 && !stopWords.has(clean)) return clean;
            }
            return '这个知识点';
        }

        function shuffle(arr) {
            const result = [...arr];
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        function hasReadableText(text) {
            const commonWords = ['的', '了', '是', '在', '和', '与', '有', '我', '你', '他', '这', '那', '一个', '一种', '可以', '需要', '通过', '进行', '能够', '因为', '所以', '但是', '如果', '虽然', '于是', '然后', '并且', '或者', '对于', '关于', '没有', '已经', '正在', '开始', '结束', '使用', '学习', '方法', '知识', '内容', '文章', '问题', '答案', '概念', '步骤', '研究', '表明', '提高', '提升', '表示', '定义', '例如', '包括'];
            const mathWords = ['有理数', '无理数', '整数', '分数', '小数', '正数', '负数', '绝对值', '相反数', '倒数', '数轴', '加减', '乘除', '运算', '计算', '公式', '定理', '定律', '方程', '函数', '变量', '常数', '代数', '几何', '证明', '求解', '等于', '大于', '小于', '加上', '减去', '乘以', '除以', '结果', '解集', '范围', '符号', '数值'];
            const allWords = [...commonWords, ...mathWords];

            let commonCount = 0;
            allWords.forEach(word => {
                const matches = text.match(new RegExp(word, 'g'));
                if (matches) commonCount += matches.length;
            });

            const meaningfulChars = text.match(/[\u4e00-\u9fa5a-zA-Z0-9]/g) || [];
            return commonCount >= 3 && meaningfulChars.length >= 30;
        }

        function renderCards(cards) {
            cardsList.innerHTML = cards.map((card, index) => `
                <div class="card" onclick="this.classList.toggle('flipped')">
                    <div class="card-inner">
                        <div class="card-face card-front">
                            <div class="card-label">知识点 ${index + 1}</div>
                            <div class="card-text">${escapeHtml(card.question)}</div>
                            <div class="card-hint">点击翻面查看答案</div>
                        </div>
                        <div class="card-face card-back">
                            <div class="card-label">答案</div>
                            <div class="card-text">${escapeHtml(card.answer)}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderQuiz(quiz) {
            quizList.innerHTML = quiz.map((item, i) => {
                if (item.type === 'single') {
                    return renderSingle(i, item);
                } else if (item.type === 'multiple') {
                    return renderMultiple(i, item);
                } else if (item.type === 'true_false') {
                    return renderTF(i, item);
                } else if (item.type === 'fill') {
                    return renderFill(i, item);
                } else if (item.type === 'short') {
                    return renderShort(i, item);
                }
            }).join('');
        }

        function renderSingle(i, item) {
            return `
                <div class="quiz-item" data-index="${i}" data-type="single">
                    <div class="quiz-question">${i + 1}. ${escapeHtml(item.question)}</div>
                    <div class="quiz-options">
                        ${item.options.map((opt, j) => `
                            <div class="quiz-option" data-opt="${j}" onclick="selectSingle(${i}, ${j})">
                                <span class="option-index">${String.fromCharCode(65 + j)}</span>
                                <span>${escapeHtml(opt)}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="explanation" id="exp-${i}"></div>
                </div>
            `;
        }

        function renderMultiple(i, item) {
            return `
                <div class="quiz-item" data-index="${i}" data-type="multiple">
                    <div class="quiz-question">${i + 1}. ${escapeHtml(item.question)}</div>
                    <div class="quiz-options">
                        ${item.options.map((opt, j) => `
                            <div class="quiz-option" data-opt="${j}" onclick="toggleMultiple(${i}, ${j})">
                                <span class="option-index">${String.fromCharCode(65 + j)}</span>
                                <span>${escapeHtml(opt)}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="explanation" id="exp-${i}"></div>
                </div>
            `;
        }

        function renderTF(i, item) {
            return `
                <div class="quiz-item" data-index="${i}" data-type="true_false">
                    <div class="quiz-question">${i + 1}. ${escapeHtml(item.question)}</div>
                    <div class="tf-buttons">
                        <button class="tf-btn" onclick="selectTF(${i}, true)">正确</button>
                        <button class="tf-btn" onclick="selectTF(${i}, false)">错误</button>
                    </div>
                    <div class="explanation" id="exp-${i}"></div>
                </div>
            `;
        }

        function renderFill(i, item) {
            return `
                <div class="quiz-item" data-index="${i}" data-type="fill">
                    <div class="quiz-question">${i + 1}. ${escapeHtml(item.question)}</div>
                    <input type="text" class="fill-input" placeholder="请输入答案" onchange="setFill(${i}, this.value)">
                    <div class="explanation" id="exp-${i}"></div>
                </div>
            `;
        }

        function renderShort(i, item) {
            return `
                <div class="quiz-item" data-index="${i}" data-type="short">
                    <div class="quiz-question">${i + 1}. ${escapeHtml(item.question)}</div>
                    <textarea class="short-input" rows="2" placeholder="请输入简短回答" onchange="setShort(${i}, this.value)"></textarea>
                    <div class="explanation" id="exp-${i}"></div>
                </div>
            `;
        }

        window.selectSingle = function(i, j) {
            userAnswers[i] = j;
            const item = quizList.children[i];
            const options = item.querySelectorAll('.quiz-option');
            options.forEach((opt, idx) => {
                opt.classList.remove('selected');
                if (idx === j) opt.classList.add('selected');
            });
        };

        window.toggleMultiple = function(i, j) {
            if (userAnswers[i] === 'locked') return;
            if (!Array.isArray(userAnswers[i])) userAnswers[i] = [];
            const idx = userAnswers[i].indexOf(j);
            if (idx > -1) userAnswers[i].splice(idx, 1);
            else userAnswers[i].push(j);

            const item = quizList.children[i];
            const options = item.querySelectorAll('.quiz-option');
            options.forEach((opt, idx) => {
                opt.classList.toggle('selected', userAnswers[i].includes(idx));
            });
        };

        window.selectTF = function(i, val) {
            userAnswers[i] = val;
            const item = quizList.children[i];
            const btns = item.querySelectorAll('.tf-btn');
            btns.forEach(btn => btn.classList.remove('selected'));
            btns[val ? 0 : 1].classList.add('selected');
        };

        window.setFill = function(i, val) {
            userAnswers[i] = val.trim();
        };

        window.setShort = function(i, val) {
            userAnswers[i] = val.trim();
        };

        submitBtn.addEventListener('click', () => {
            let score = 0;
            currentQuiz.forEach((item, i) => {
                let isCorrect = false;
                const itemEl = quizList.children[i];

                if (item.type === 'single') {
                    isCorrect = userAnswers[i] === item.correct;
                    const options = itemEl.querySelectorAll('.quiz-option');
                    options.forEach((opt, idx) => {
                        opt.classList.add('disabled');
                        opt.classList.remove('selected');
                        if (idx === item.correct) opt.classList.add('correct');
                        else if (idx === userAnswers[i]) opt.classList.add('wrong');
                    });
                } else if (item.type === 'true_false') {
                    isCorrect = userAnswers[i] === item.correct;
                    const btns = itemEl.querySelectorAll('.tf-btn');
                    btns.forEach(btn => {
                        btn.classList.add('disabled');
                        btn.classList.remove('selected');
                    });
                    btns[item.correct ? 0 : 1].classList.add('correct');
                    if (userAnswers[i] !== item.correct && userAnswers[i] !== null) {
                        btns[userAnswers[i] ? 0 : 1].classList.add('wrong');
                    }
                } else if (item.type === 'multiple') {
                    const ans = userAnswers[i] || [];
                    isCorrect = ans.length === item.correct.length && ans.every(v => item.correct.includes(v));
                    const options = itemEl.querySelectorAll('.quiz-option');
                    options.forEach((opt, idx) => {
                        opt.classList.add('disabled');
                        opt.classList.remove('selected');
                        if (item.correct.includes(idx)) opt.classList.add('correct');
                        else if (ans.includes(idx)) opt.classList.add('wrong');
                    });
                } else if (item.type === 'fill' || item.type === 'short') {
                    const ans = (userAnswers[i] || '').toLowerCase();
                    isCorrect = item.correct.some(k => ans.includes(k.toLowerCase()));
                }

                if (isCorrect) score++;
                showExplanation(i, isCorrect);
            });

            resultScore.textContent = `得分：${score}/5`;
            resultBar.classList.remove('hidden');
            submitBtn.classList.add('hidden');
            resultBar.scrollIntoView({ behavior: 'smooth' });
        });

        function showExplanation(i, isCorrect) {
            const item = currentQuiz[i];
            const exp = document.getElementById(`exp-${i}`);
            const prefix = isCorrect
                ? '<strong style="color:var(--correct)">回答正确。</strong>'
                : '<strong style="color:var(--wrong)">回答错误。</strong>';
            exp.innerHTML = prefix + '<strong>解析：</strong>' + escapeHtml(item.explanation);
            exp.classList.add('show');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
