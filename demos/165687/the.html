<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>垃圾管家</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #faf7f2;
      --bg-2: #f1ebe1;
      --ink: #1f2421;
      --ink-soft: #5b6258;
      --ink-mute: #9aa098;
      --line: #e6dfd3;
      --card: #ffffff;
      --concrete: #2d5a4a;
      --concrete-soft: #e7efeb;
      --abstract: #6b4e8f;
      --abstract-soft: #efe9f5;
      --star: #d4a017;
      --star-soft: #f6ecd2;
      --danger: #b14b4b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.6;
      min-height: 100vh;
    }

    .wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 56px 28px 96px;
    }

    /* ===== Header ===== */
    header {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeDown 0.7s ease both;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 8px 24px rgba(45, 90, 74, 0.12);
      margin-bottom: 20px;
    }

    .logo svg { width: 30px; height: 30px; stroke: var(--concrete); }

    h1 {
      font-family: "Noto Serif SC", serif;
      font-weight: 900;
      font-size: 38px;
      letter-spacing: 0.12em;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--ink-soft);
      letter-spacing: 0.18em;
      font-weight: 300;
    }

    /* ===== Input Area ===== */
    .input-area {
      display: flex;
      gap: 12px;
      max-width: 620px;
      margin: 0 auto 56px;
      animation: fadeUp 0.7s ease 0.1s both;
    }

    .input-area input {
      flex: 1;
      height: 54px;
      padding: 0 22px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      font-family: inherit;
      font-size: 15px;
      color: var(--ink);
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .input-area input::placeholder { color: var(--ink-mute); }

    .input-area input:focus {
      border-color: var(--concrete);
      box-shadow: 0 0 0 4px rgba(45, 90, 74, 0.08);
    }

    .btn-add {
      height: 54px;
      padding: 0 32px;
      border: none;
      border-radius: 14px;
      background: var(--ink);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: transform 0.18s, background 0.25s, box-shadow 0.25s;
      white-space: nowrap;
    }

    .btn-add:hover:not(:disabled) {
      background: var(--concrete);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(45, 90, 74, 0.22);
    }

    .btn-add:active:not(:disabled) { transform: translateY(0); }

    .btn-add:disabled {
      background: #c9cdc8;
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* ===== List Header ===== */
    .list-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      max-width: 620px;
      margin: 0 auto 18px;
      padding: 0 4px;
    }

    .list-head h2 {
      font-family: "Noto Serif SC", serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .list-head .count {
      font-size: 13px;
      color: var(--ink-mute);
      letter-spacing: 0.05em;
    }

    /* ===== Card List ===== */
    .list {
      max-width: 620px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow: 0 4px 14px rgba(31, 36, 33, 0.05);
      transition: transform 0.22s, box-shadow 0.22s;
      animation: cardIn 0.4s ease both;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(31, 36, 33, 0.1);
    }

    .card-rank {
      flex-shrink: 0;
      width: 30px;
      text-align: center;
      font-family: "Noto Serif SC", serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink-mute);
    }

    .card-body { flex: 1; min-width: 0; }

    .card-name {
      font-size: 16px;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 8px;
      word-break: break-word;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .tag.concrete { background: var(--concrete-soft); color: var(--concrete); }
    .tag.abstract { background: var(--abstract-soft); color: var(--abstract); }

    .stars { display: inline-flex; gap: 1px; font-size: 14px; line-height: 1; }
    .stars .filled { color: var(--star); }
    .stars .empty { color: var(--star-soft); }

    .card-delete {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--ink-mute);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s, background 0.2s, color 0.2s;
    }

    .card:hover .card-delete { opacity: 1; }
    .card-delete:hover { background: rgba(177, 75, 75, 0.1); color: var(--danger); }
    .card-delete svg { width: 16px; height: 16px; }

    /* ===== Empty State ===== */
    .empty {
      max-width: 620px;
      margin: 0 auto;
      text-align: center;
      padding: 64px 20px;
      color: var(--ink-mute);
    }

    .empty svg { width: 56px; height: 56px; stroke: var(--ink-mute); opacity: 0.4; margin-bottom: 18px; }
    .empty p { font-size: 14px; letter-spacing: 0.06em; }

    /* ===== Modal ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(31, 36, 33, 0.4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s, visibility 0.25s;
      z-index: 100;
    }

    .modal-overlay.open { opacity: 1; visibility: visible; }

    .modal {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 24px 60px rgba(31, 36, 33, 0.25);
      transform: translateY(16px) scale(0.98);
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .modal-overlay.open .modal { transform: translateY(0) scale(1); }

    .modal h3 {
      font-family: "Noto Serif SC", serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .modal .modal-sub {
      font-size: 13px;
      color: var(--ink-soft);
      margin-bottom: 26px;
    }

    .modal .modal-sub .target {
      color: var(--ink);
      font-weight: 500;
    }

    .field-label {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--ink-soft);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .field-group { margin-bottom: 26px; }

    .category-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .cat-opt {
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      background: #fff;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.2s, background 0.2s;
      font-family: inherit;
    }

    .cat-opt:hover { border-color: var(--ink-soft); }

    .cat-opt.selected.concrete {
      border-color: var(--concrete);
      background: var(--concrete-soft);
    }

    .cat-opt.selected.abstract {
      border-color: var(--abstract);
      background: var(--abstract-soft);
    }

    .cat-opt .cat-title {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .cat-dot.concrete { background: var(--concrete); }
    .cat-dot.abstract { background: var(--abstract); }

    .cat-opt .cat-desc {
      font-size: 12px;
      color: var(--ink-mute);
      line-height: 1.5;
    }

    .star-options { display: flex; gap: 8px; }

    .star-opt {
      flex: 1;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      padding: 12px 4px;
      background: #fff;
      cursor: pointer;
      text-align: center;
      font-family: inherit;
      transition: border-color 0.2s, background 0.2s;
    }

    .star-opt:hover { border-color: var(--star); }

    .star-opt.selected {
      border-color: var(--star);
      background: var(--star-soft);
    }

    .star-opt .star-sym {
      font-size: 16px;
      color: var(--star);
      display: block;
      line-height: 1;
      margin-bottom: 4px;
    }

    .star-opt .star-num {
      font-size: 11px;
      color: var(--ink-soft);
      font-weight: 500;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    .btn {
      flex: 1;
      height: 48px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      border: none;
    }

    .btn-cancel {
      background: transparent;
      border: 1.5px solid var(--line);
      color: var(--ink-soft);
    }

    .btn-cancel:hover { border-color: var(--ink-soft); color: var(--ink); }

    .btn-confirm {
      background: var(--ink);
      color: #fff;
    }

    .btn-confirm:hover { background: var(--concrete); }

    /* ===== Animations ===== */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== Responsive ===== */
    @media (max-width: 600px) {
      .wrap { padding: 40px 18px 72px; }
      h1 { font-size: 30px; }
      .input-area { flex-direction: column; }
      .btn-add { width: 100%; }
      .card { padding: 16px 18px; gap: 14px; }
      .card-rank { display: none; }
      .modal { padding: 24px; }
      .star-options { gap: 5px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Header -->
    <header>
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          <path d="M10 11v6"></path>
          <path d="M14 11v6"></path>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
        </svg>
      </div>
      <h1>垃圾管家</h1>
      <p class="subtitle">把想丢掉的，一件件归置清楚</p>
    </header>

    <!-- Input Area -->
    <div class="input-area">
      <input id="nameInput" type="text" placeholder="想丢掉什么？输入它的名字…" maxlength="40" />
      <button id="addBtn" class="btn-add" disabled>添加</button>
    </div>

    <!-- List Header -->
    <div class="list-head">
      <h2>清理清单</h2>
      <span class="count" id="countText">0 项</span>
    </div>

    <!-- Card List -->
    <div id="list" class="list"></div>

    <!-- Empty State -->
    <div id="empty" class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18"></path>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
        <path d="M10 11v6"></path>
        <path d="M14 11v6"></path>
      </svg>
      <p>还什么都没丢，先从一件小事开始吧</p>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h3 id="modalTitle">归类与定级</h3>
      <p class="modal-sub">为 <span class="target" id="targetName">—</span> 选择分类与糟糕程度</p>

      <!-- Category -->
      <div class="field-group">
        <div class="field-label">分类</div>
        <div class="category-options" id="categoryOptions">
          <button class="cat-opt selected concrete" data-cat="concrete" type="button">
            <div class="cat-title"><span class="cat-dot concrete"></span>具体垃圾</div>
            <div class="cat-desc">看得见摸得着的实体物品</div>
          </button>
          <button class="cat-opt" data-cat="abstract" type="button">
            <div class="cat-title"><span class="cat-dot abstract"></span>抽象垃圾</div>
            <div class="cat-desc">情绪、任务、关系等负担</div>
          </button>
        </div>
      </div>

      <!-- Stars -->
      <div class="field-group">
        <div class="field-label">糟糕程度（5 星最糟糕）</div>
        <div class="star-options" id="starOptions"></div>
      </div>

      <!-- Actions -->
      <div class="modal-actions">
        <button class="btn btn-cancel" id="cancelBtn" type="button">取消</button>
        <button class="btn btn-confirm" id="confirmBtn" type="button">确认添加</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      // ===== State =====
      var items = [];
      var nextId = 1;
      var pendingName = "";
      var selectedCat = "concrete";
      var selectedStars = 3;

      // ===== DOM refs =====
      var nameInput = document.getElementById("nameInput");
      var addBtn = document.getElementById("addBtn");
      var listEl = document.getElementById("list");
      var emptyEl = document.getElementById("empty");
      var countText = document.getElementById("countText");
      var modal = document.getElementById("modal");
      var targetName = document.getElementById("targetName");
      var categoryOptions = document.getElementById("categoryOptions");
      var starOptions = document.getElementById("starOptions");
      var cancelBtn = document.getElementById("cancelBtn");
      var confirmBtn = document.getElementById("confirmBtn");

      // ===== Helpers =====
      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function buildStars(n) {
        var html = '<span class="stars" aria-label="' + n + ' 星">';
        for (var i = 1; i <= 5; i++) {
          html += '<span class="' + (i <= n ? "filled" : "empty") + '">&#9733;</span>';
        }
        html += "</span>";
        return html;
      }

      // ===== Render =====
      function render() {
        // sort by stars desc, then by id desc (newer first on tie)
        var sorted = items.slice().sort(function (a, b) {
          if (b.stars !== a.stars) return b.stars - a.stars;
          return b.id - a.id;
        });

        countText.textContent = items.length + " 项";
        emptyEl.style.display = items.length === 0 ? "block" : "none";

        if (sorted.length === 0) {
          listEl.innerHTML = "";
          return;
        }

        var html = "";
        for (var i = 0; i < sorted.length; i++) {
          var it = sorted[i];
          var catLabel = it.category === "concrete" ? "具体垃圾" : "抽象垃圾";
          var html2 =
            '<div class="card" data-id="' + it.id + '">' +
              '<div class="card-rank">' + (i + 1) + "</div>" +
              '<div class="card-body">' +
                '<div class="card-name">' + escapeHtml(it.name) + "</div>" +
                '<div class="card-meta">' +
                  '<span class="tag ' + it.category + '">' + catLabel + "</span>" +
                  buildStars(it.stars) +
                "</div>" +
              "</div>" +
              '<button class="card-delete" data-del="' + it.id + '" type="button" aria-label="删除">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                  "<line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"></line>" +
                  "<line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"></line>" +
                "</svg>" +
              "</button>" +
            "</div>";
          html += html2;
        }
        listEl.innerHTML = html;
      }

      // ===== Input enable/disable =====
      function syncAddBtn() {
        var v = nameInput.value.trim();
        addBtn.disabled = v.length === 0;
      }

      nameInput.addEventListener("input", syncAddBtn);

      nameInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !addBtn.disabled) {
          e.preventDefault();
          openModal();
        }
      });

      // ===== Modal =====
      function openModal() {
        pendingName = nameInput.value.trim();
        if (!pendingName) return;
        targetName.textContent = pendingName;
        // reset defaults
        selectedCat = "concrete";
        selectedStars = 3;
        updateCatSelection();
        updateStarSelection();
        modal.classList.add("open");
        // lock scroll
        document.body.style.overflow = "hidden";
      }

      function closeModal() {
        modal.classList.remove("open");
        document.body.style.overflow = "";
        // keep input value so user can edit if needed; clear is done on confirm
      }

      function updateCatSelection() {
        var opts = categoryOptions.querySelectorAll(".cat-opt");
        for (var i = 0; i < opts.length; i++) {
          var o = opts[i];
          var isSel = o.getAttribute("data-cat") === selectedCat;
          o.classList.toggle("selected", isSel);
          // ensure correct color class present
          o.classList.remove("concrete", "abstract");
          o.classList.add(o.getAttribute("data-cat"));
        }
      }

      function updateStarSelection() {
        var opts = starOptions.querySelectorAll(".star-opt");
        for (var i = 0; i < opts.length; i++) {
          var o = opts[i];
          o.classList.toggle("selected", Number(o.getAttribute("data-stars")) === selectedStars);
        }
      }

      // build star options 1..5
      (function buildStarOptions() {
        var html = "";
        for (var s = 1; s <= 5; s++) {
          var filled = "";
          for (var k = 1; k <= s; k++) filled += "&#9733;";
          html +=
            '<button class="star-opt" data-stars="' + s + '" type="button">' +
              '<span class="star-sym">' + filled + "</span>" +
              '<span class="star-num">' + s + " 星</span>" +
            "</button>";
        }
        starOptions.innerHTML = html;
      })();

      categoryOptions.addEventListener("click", function (e) {
        var btn = e.target.closest(".cat-opt");
        if (!btn) return;
        selectedCat = btn.getAttribute("data-cat");
        updateCatSelection();
      });

      starOptions.addEventListener("click", function (e) {
        var btn = e.target.closest(".star-opt");
        if (!btn) return;
        selectedStars = Number(btn.getAttribute("data-stars"));
        updateStarSelection();
      });

      addBtn.addEventListener("click", openModal);
      cancelBtn.addEventListener("click", closeModal);

      // click backdrop to close
      modal.addEventListener("click", function (e) {
        if (e.target === modal) closeModal();
      });

      // ESC to close
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && modal.classList.contains("open")) closeModal();
      });

      // confirm
      confirmBtn.addEventListener("click", function () {
        items.push({
          id: nextId++,
          name: pendingName,
          category: selectedCat,
          stars: selectedStars
        });
        // reset input
        nameInput.value = "";
        syncAddBtn();
        closeModal();
        render();
        nameInput.focus();
      });

      // delete (event delegation)
      listEl.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-del]");
        if (!btn) return;
        var id = Number(btn.getAttribute("data-del"));
        items = items.filter(function (it) { return it.id !== id; });
        render();
      });

      // init
      updateCatSelection();
      updateStarSelection();
      render();
    })();
  </script>
</body>
</html>
