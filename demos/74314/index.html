<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>禅心手串 · 设计工坊</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:#f5f0e6;--paper-2:#ede5d3;--ink:#2c2416;--ink-2:#4a3f2a;
  --vermilion:#c0392b;--vermilion-2:#a93226;--wood:#8b6914;--jade:#5d7052;
  --gold:#c9a961;--line:#d4c9a8;--line-2:#c0b088;
  --shadow:0 2px 12px rgba(44,36,22,.12);
  --font-serif:'Noto Serif SC',serif;--font-sans:'Noto Sans SC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--font-sans);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}

/* 顶栏 */
.topbar{position:fixed;top:0;left:0;right:0;height:60px;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(245,240,230,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--vermilion),var(--vermilion-2));box-shadow:0 0 0 2px var(--gold),0 2px 6px rgba(192,57,43,.4)}
.brand-title{font-family:var(--font-serif);font-size:20px;font-weight:700;letter-spacing:.08em}
.brand-sub{font-size:11px;color:var(--ink-2);letter-spacing:.2em;margin-left:4px}
.top-actions{display:flex;gap:10px;align-items:center}
.btn{padding:8px 18px;border-radius:6px;font-size:13px;font-weight:500;letter-spacing:.05em;transition:all .2s;border:1px solid transparent}
.btn-ghost{color:var(--ink-2);border-color:var(--line)}
.btn-ghost:hover{background:var(--paper-2);border-color:var(--line-2)}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-primary:hover{background:var(--ink-2)}
.btn-accent{background:var(--vermilion);color:#fff}
.btn-accent:hover{background:var(--vermilion-2)}
.btn svg{width:15px;height:15px;vertical-align:-2px;margin-right:5px}

/* 主布局 */
.layout{position:fixed;top:60px;left:0;right:0;bottom:0;display:grid;grid-template-columns:280px 1fr 260px;gap:0}
.sidebar{background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.sidebar.right{border-right:none;border-left:1px solid var(--line)}

/* 组件库 */
.lib-header{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.lib-title{font-family:var(--font-serif);font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.lib-title::before{content:"";width:3px;height:14px;background:var(--vermilion);border-radius:2px}
.tabs{display:flex;gap:4px;margin-top:10px}
.tab{padding:6px 14px;font-size:12px;border-radius:20px;background:transparent;color:var(--ink-2);border:1px solid var(--line);transition:all .2s}
.tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lib-scroll{flex:1;overflow-y:auto;padding:14px}
.lib-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.comp-item{position:relative;aspect-ratio:1;background:var(--paper-2);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:grab;transition:all .2s;overflow:hidden}
.comp-item:hover{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,169,97,.3);transform:translateY(-2px)}
.comp-item.selected{border-color:var(--vermilion);box-shadow:0 0 0 2px rgba(192,57,43,.3)}
.comp-item.dragging{opacity:.5;cursor:grabbing}
.comp-item canvas{width:48px;height:48px}
.comp-item .comp-name{font-size:10px;color:var(--ink-2);text-align:center;line-height:1.2;padding:0 4px}
.comp-item .comp-badge{position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:50%;background:var(--vermilion);color:#fff;font-size:9px;display:grid;place-items:center;opacity:0;transition:opacity .2s}
.comp-item.selected .comp-badge{opacity:1}

/* 预览区 */
.preview{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#faf6ec 0%,var(--paper) 70%);overflow:hidden}
.preview-bg{position:absolute;inset:0;opacity:.08;background-image:radial-gradient(circle,var(--ink) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
.canvas-wrap{position:relative;width:min(560px,90%);aspect-ratio:1}
#bracelet-canvas{width:100%;height:100%;display:block;cursor:pointer;border-radius:50%}
.preview-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--ink-2);opacity:.5;pointer-events:none;font-family:var(--font-serif)}
.preview-hint .ph-icon{font-size:40px;display:block;margin-bottom:8px}
.preview-hint .ph-text{font-size:13px;letter-spacing:.1em}
.preview-controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:center;background:rgba(245,240,230,.92);backdrop-filter:blur(8px);padding:10px 20px;border-radius:30px;border:1px solid var(--line);box-shadow:var(--shadow)}
.ctrl-group{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.ctrl-group label{letter-spacing:.05em}
.ctrl-group input[type=range]{-webkit-appearance:none;appearance:none;width:80px;height:3px;background:var(--line);border-radius:2px;outline:none}
.ctrl-group input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--vermilion);cursor:pointer;box-shadow:0 0 0 2px var(--paper)}
.ctrl-group input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--vermilion);border:none;cursor:pointer}
.ctrl-val{font-weight:600;color:var(--ink);min-width:28px;text-align:center}
.ctrl-sep{width:1px;height:20px;background:var(--line)}

/* 右侧列表 */
.list-header{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.list-title{font-family:var(--font-serif);font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.list-title::before{content:"";width:3px;height:14px;background:var(--jade);border-radius:2px}
.list-count{font-size:11px;color:var(--ink-2);margin-left:auto;background:var(--paper-2);padding:2px 8px;border-radius:10px}
.list-scroll{flex:1;overflow-y:auto;padding:10px}
.list-empty{text-align:center;color:var(--ink-2);opacity:.5;padding:40px 10px;font-size:12px}
.bead-row{display:flex;align-items:center;gap:8px;padding:8px;background:var(--paper-2);border:1px solid var(--line);border-radius:6px;margin-bottom:6px;transition:all .2s;cursor:grab}
.bead-row:hover{border-color:var(--gold);box-shadow:0 1px 6px rgba(201,169,97,.2)}
.bead-row.dragging-over{border-color:var(--vermilion);border-style:dashed}
.bead-row canvas{width:28px;height:28px;flex-shrink:0}
.bead-row .bead-info{flex:1;min-width:0}
.bead-row .bead-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bead-row .bead-type{font-size:10px;color:var(--ink-2)}
.bead-row .bead-del{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);font-size:14px;transition:all .2s;flex-shrink:0}
.bead-row .bead-del:hover{background:var(--vermilion);color:#fff}
.list-foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px}
.list-foot .btn{flex:1;font-size:11px;padding:7px}

/* Toast */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--paper);padding:10px 24px;border-radius:6px;font-size:13px;letter-spacing:.05em;box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* 拖拽指示 */
.drop-indicator{position:absolute;border:2px dashed var(--vermilion);border-radius:50%;pointer-events:none;opacity:0;transition:opacity .2s}
.drop-indicator.show{opacity:.6}

/* 响应式 */
@media (max-width:900px){
  .layout{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;bottom:0}
  .sidebar{border-right:none;border-bottom:1px solid var(--line);max-height:240px}
  .sidebar.right{border-left:none;border-top:1px solid var(--line);border-bottom:none;max-height:200px}
  .preview{min-height:300px}
  .topbar{padding:0 14px;height:50px}
  .brand-sub{display:none}
  .layout{top:50px}
  .btn{padding:6px 12px;font-size:12px}
  .lib-grid{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:500px){
  .lib-grid{grid-template-columns:repeat(3,1fr)}
  .preview-controls{gap:10px;padding:8px 14px}
  .ctrl-group input[type=range]{width:60px}
}
/* 滚动条 */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--wood)}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-logo"></div>
    <div>
      <span class="brand-title">禅心手串</span>
      <span class="brand-sub">DESIGN STUDIO</span>
    </div>
  </div>
  <div class="top-actions">
    <button class="btn btn-ghost" id="btn-undo" title="撤销">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M3 13c2-4 6-7 11-7a8 8 0 1 1 0 16"/></svg>撤销
    </button>
    <button class="btn btn-ghost" id="btn-clear">清空</button>
    <button class="btn btn-primary" id="btn-bg">切换背景</button>
    <button class="btn btn-accent" id="btn-save">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>保存图片
    </button>
  </div>
</header>

<div class="layout">
  <!-- 左侧组件库 -->
  <aside class="sidebar">
    <div class="lib-header">
      <div class="lib-title">组件库</div>
      <div class="tabs">
        <button class="tab active" data-cat="bead">珠子</button>
        <button class="tab" data-cat="accessory">配件</button>
      </div>
    </div>
    <div class="lib-scroll">
      <div class="lib-grid" id="lib-grid"></div>
    </div>
  </aside>

  <!-- 中间预览 -->
  <main class="preview">
    <div class="preview-bg"></div>
    <div class="canvas-wrap">
      <canvas id="bracelet-canvas" width="560" height="560"></canvas>
      <div class="preview-hint" id="preview-hint">
        <span class="ph-icon">◯</span>
        <span class="ph-text">从左侧选择或拖拽组件至此</span>
      </div>
      <div class="drop-indicator" id="drop-indicator"></div>
    </div>
    <div class="preview-controls">
      <div class="ctrl-group">
        <label>珠子大小</label>
        <input type="range" id="ctrl-size" min="14" max="32" value="22" />
        <span class="ctrl-val" id="val-size">22</span>
      </div>
      <div class="ctrl-sep"></div>
      <div class="ctrl-group">
        <label>间距</label>
        <input type="range" id="ctrl-gap" min="0" max="10" value="2" />
        <span class="ctrl-val" id="val-gap">2</span>
      </div>
      <div class="ctrl-sep"></div>
      <div class="ctrl-group">
        <label>绳子</label>
        <select id="ctrl-cord-style" style="padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);font-size:12px;cursor:pointer">
          <option value="plain">圆绳</option>
          <option value="braided">编织绳</option>
          <option value="chain">链条</option>
          <option value="leather">皮绳</option>
          <option value="knot">结绳</option>
        </select>
      </div>
      <div class="ctrl-sep"></div>
      <div class="ctrl-group">
        <label>绳色</label>
        <input type="color" id="ctrl-cord" value="#8b6914" style="width:24px;height:20px;border:none;border-radius:4px;cursor:pointer" />
      </div>
    </div>
  </main>

  <!-- 右侧已添加列表 -->
  <aside class="sidebar right">
    <div class="list-header">
      <div class="list-title">手串组件 <span class="list-count" id="list-count">0</span></div>
    </div>
    <div class="list-scroll" id="list-scroll">
      <div class="list-empty" id="list-empty">尚未添加组件<br>点击或拖拽左侧组件开始设计</div>
    </div>
    <div class="list-foot">
      <button class="btn btn-ghost" id="btn-shuffle">打乱</button>
      <button class="btn btn-ghost" id="btn-reverse">反转</button>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

const COMP_MAP=Object.fromEntries(COMPONENTS.map(c=>[c.id,c]));

/* =========================================================
 * 状态
 * =======================================================*/
let beads=[]; // 已添加的珠子 {id, compId}
let selectedComp=null;
let activeCat='bead';
let beadSize=22;
let beadGap=2;
let cordColor='#8b6914';
let cordStyle='plain'; // plain | braided | chain | leather | knot
const CORD_STYLES=[
  {id:'plain',name:'圆绳'},{id:'braided',name:'编织绳'},{id:'chain',name:'链条'},
  {id:'leather',name:'皮绳'},{id:'knot',name:'结绳'}
];
let bgIndex=0;
const BACKGROUNDS=['#faf6ec','#2c2416','#3a4a3a','#1a1a2e'];
let history=[]; // 撤销栈
const canvas=$('bracelet-canvas');
const ctx=canvas.getContext('2d');

function $(id){return document.getElementById(id);}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}

/* =========================================================
 * 绳子绘制（多种样式）
 * =======================================================*/
function drawCord(ctx,cx,cy,radius,color,style,beadR){
  ctx.save();
  const circ=Math.PI*2*radius;
  const n=beads.length;
  switch(style){
    case 'plain':{ // 圆绳：简单实线
      ctx.strokeStyle=color;ctx.lineWidth=3;ctx.globalAlpha=.75;
      ctx.beginPath();ctx.arc(cx,cy,radius,0,Math.PI*2);ctx.stroke();
      // 暗影
      ctx.strokeStyle=darken(color,.3);ctx.lineWidth=1;ctx.globalAlpha=.3;
      ctx.beginPath();ctx.arc(cx,cy,radius+1.5,0,Math.PI*2);ctx.stroke();
      break;
    }
    case 'braided':{ // 编织绳：菱形交叉纹理
      ctx.strokeStyle=color;ctx.lineWidth=4;ctx.globalAlpha=.8;
      ctx.beginPath();ctx.arc(cx,cy,radius,0,Math.PI*2);ctx.stroke();
      // 交叉斜线
      const step=Math.max(6,beadR*.3);
      const segs=Math.floor(circ/step);
      ctx.strokeStyle=darken(color,.25);ctx.lineWidth=1.5;ctx.globalAlpha=.5;
      for(let i=0;i<segs;i++){
        const a1=(i/segs)*Math.PI*2;
        const a2=((i+.5)/segs)*Math.PI*2;
        const x1=cx+Math.cos(a1)*radius,y1=cy+Math.sin(a1)*radius;
        const x2=cx+Math.cos(a2)*radius,y2=cy+Math.sin(a2)*radius;
        ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
      }
      // 高光
      ctx.strokeStyle=lighten(color,.2);ctx.lineWidth=1;ctx.globalAlpha=.4;
      ctx.beginPath();ctx.arc(cx,cy,radius-1.5,0,Math.PI*2);ctx.stroke();
      break;
    }
    case 'chain':{ // 金属链条：链节
      const step=Math.max(8,beadR*.35);
      const segs=Math.floor(circ/step);
      for(let i=0;i<segs;i++){
        const a=(i/segs)*Math.PI*2;
        const x=cx+Math.cos(a)*radius;
        const y=cy+Math.sin(a)*radius;
        // 椭圆链节
        ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.PI/2);
        const cg=ctx.createLinearGradient(0,-3,0,3);
        cg.addColorStop(0,lighten(color,.4));cg.addColorStop(.5,color);cg.addColorStop(1,darken(color,.3));
        ctx.fillStyle=cg;ctx.globalAlpha=.85;
        ctx.beginPath();ctx.ellipse(0,0,step*.4,3,0,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle=darken(color,.35);ctx.lineWidth=.5;ctx.globalAlpha=.5;
        ctx.stroke();
        ctx.restore();
      }
      break;
    }
    case 'leather':{ // 皮绳：扁平带缝线
      ctx.strokeStyle=color;ctx.lineWidth=5;ctx.globalAlpha=.85;
      ctx.beginPath();ctx.arc(cx,cy,radius,0,Math.PI*2);ctx.stroke();
      // 高光中线
      ctx.strokeStyle=lighten(color,.2);ctx.lineWidth=1.5;ctx.globalAlpha=.4;
      ctx.beginPath();ctx.arc(cx,cy,radius,0,Math.PI*2);ctx.stroke();
      // 缝线点
      const step=Math.max(5,beadR*.25);
      const segs=Math.floor(circ/step);
      ctx.fillStyle=darken(color,.4);ctx.globalAlpha=.5;
      for(let i=0;i<segs;i++){
        const a=(i/segs)*Math.PI*2;
        const x=cx+Math.cos(a)*(radius+2.5);
        const y=cy+Math.sin(a)*(radius+2.5);
        ctx.beginPath();ctx.arc(x,y,1,0,Math.PI*2);ctx.fill();
        const x2=cx+Math.cos(a)*(radius-2.5);
        const y2=cy+Math.sin(a)*(radius-2.5);
        ctx.beginPath();ctx.arc(x2,y2,1,0,Math.PI*2);ctx.fill();
      }
      break;
    }
    case 'knot':{ // 结绳：珠子间打结
      ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.globalAlpha=.7;
      ctx.beginPath();ctx.arc(cx,cy,radius,0,Math.PI*2);ctx.stroke();
      // 在每两个珠子之间画结
      if(n>0){
        for(let i=0;i<n;i++){
          const a1=(i/n)*Math.PI*2-Math.PI/2;
          const a2=((i+1)/n)*Math.PI*2-Math.PI/2;
          const ma=(a1+a2)/2;
          const x=cx+Math.cos(ma)*radius;
          const y=cy+Math.sin(ma)*radius;
          ctx.save();ctx.translate(x,y);ctx.rotate(ma+Math.PI/2);
          ctx.fillStyle=color;ctx.globalAlpha=.8;
          ctx.beginPath();ctx.ellipse(0,0,3,4,0,0,Math.PI*2);ctx.fill();
          ctx.strokeStyle=darken(color,.3);ctx.lineWidth=.6;ctx.globalAlpha=.4;
          ctx.beginPath();ctx.ellipse(0,0,3,4,0,0,Math.PI*2);ctx.stroke();
          ctx.restore();
        }
      }
      break;
    }
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

/* =========================================================
 * 珠子绘制（Canvas 2D，程序化渲染各类材质）
 * =======================================================*/
function drawBead(ctx,cx,cy,r,comp,rotation=0){
  ctx.save();
  ctx.translate(cx,cy);
  if(rotation)ctx.rotate(rotation);
  const {color,accent,type}=comp;
  // 基础球体（径向渐变模拟立体）
  const grad=ctx.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);
  switch(type){
    case 'wood': // 木纹
      grad.addColorStop(0,lighten(color,.25));grad.addColorStop(.6,color);grad.addColorStop(1,darken(color,.3));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      // 木纹圈
      ctx.strokeStyle=darken(color,.2);ctx.lineWidth=.5;ctx.globalAlpha=.4;
      for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(r*.1,-r*.1,r*(.5-i*.15),r*(.7-i*.2),.3,0,Math.PI*2);ctx.stroke();}
      ctx.globalAlpha=1;
      break;
    case 'bodhi': // 星月菩提：米白底 + 黑点
      grad.addColorStop(0,'#f5eed8');grad.addColorStop(.7,color);grad.addColorStop(1,accent);
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#5a4a2a';ctx.globalAlpha=.5;
      for(let i=0;i<6;i++){const a=i*1.3;const rr=r*.5;ctx.beginPath();ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr,r*.06,0,Math.PI*2);ctx.fill();}
      ctx.globalAlpha=1;
      break;
    case 'vajra': // 金刚菩提：棕色纹理
      grad.addColorStop(0,lighten(color,.2));grad.addColorStop(.6,color);grad.addColorStop(1,darken(color,.25));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=darken(color,.3);ctx.lineWidth=.8;ctx.globalAlpha=.5;
      for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*r*.9,Math.sin(a)*r*.9);ctx.stroke();}
      ctx.globalAlpha=1;
      break;
    case 'jade': // 玉石：温润通透
      grad.addColorStop(0,lighten(color,.35));grad.addColorStop(.5,lighten(color,.1));grad.addColorStop(1,darken(color,.15));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      // 内部纹理
      ctx.strokeStyle=lighten(color,.2);ctx.lineWidth=.6;ctx.globalAlpha=.3;
      ctx.beginPath();ctx.ellipse(-r*.2,r*.1,r*.4,r*.6,.5,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=1;
      break;
    case 'agate': // 玛瑙：光泽
      grad.addColorStop(0,lighten(color,.4));grad.addColorStop(.5,color);grad.addColorStop(1,darken(color,.2));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      // 同心纹
      ctx.strokeStyle=darken(color,.15);ctx.lineWidth=.5;ctx.globalAlpha=.3;
      ctx.beginPath();ctx.arc(0,0,r*.6,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=1;
      break;
    case 'amber': // 蜜蜡：琥珀通透
      grad.addColorStop(0,lighten(color,.3));grad.addColorStop(.5,color);grad.addColorStop(1,darken(color,.1));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      // 内含物
      ctx.fillStyle=darken(color,.3);ctx.globalAlpha=.2;
      ctx.beginPath();ctx.arc(r*.2,-r*.1,r*.15,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(-r*.3,r*.2,r*.1,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
      break;
    case 'lapis': // 青金石：深蓝 + 金点
      grad.addColorStop(0,lighten(color,.2));grad.addColorStop(.6,color);grad.addColorStop(1,darken(color,.3));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=accent;ctx.globalAlpha=.7;
      for(let i=0;i<8;i++){const a=i*.9;const rr=rand(r*.2,r*.7);ctx.beginPath();ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr,rand(r*.04,r*.09),0,Math.PI*2);ctx.fill();}
      ctx.globalAlpha=1;
      break;
    case 'pearl': // 砗磲/珍珠：珠光
      grad.addColorStop(0,'#ffffff');grad.addColorStop(.4,lighten(color,.1));grad.addColorStop(1,accent);
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      // 珠光晕
      ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(-r*.3,-r*.3,r*.4,0,Math.PI*1.5);ctx.stroke();
      break;
    case 'turquoise': // 绿松石：带网纹
      grad.addColorStop(0,lighten(color,.2));grad.addColorStop(.6,color);grad.addColorStop(1,darken(color,.2));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      // 铁线纹
      ctx.strokeStyle=darken(color,.4);ctx.lineWidth=.6;ctx.globalAlpha=.4;
      ctx.beginPath();ctx.moveTo(-r*.7,-r*.2);ctx.quadraticCurveTo(0,0,r*.6,r*.3);ctx.stroke();
      ctx.beginPath();ctx.moveTo(r*.2,-r*.6);ctx.quadraticCurveTo(-r*.1,-r*.1,-r*.5,r*.4);ctx.stroke();
      ctx.globalAlpha=1;
      break;
    case 'cinnabar': // 朱砂：红 + 颗粒
      grad.addColorStop(0,lighten(color,.25));grad.addColorStop(.5,color);grad.addColorStop(1,darken(color,.15));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=lighten(color,.4);ctx.globalAlpha=.3;
      for(let i=0;i<10;i++){ctx.beginPath();ctx.arc(rand(-r*.7,r*.7),rand(-r*.7,r*.7),rand(r*.03,r*.07),0,Math.PI*2);ctx.fill();}
      ctx.globalAlpha=1;
      break;
    case 'obsidian': // 黑曜石：黑色玻璃光泽 + 贝壳状断口纹
      grad.addColorStop(0,lighten(color,.5));grad.addColorStop(.4,lighten(color,.15));grad.addColorStop(1,color);
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=accent;ctx.lineWidth=.6;ctx.globalAlpha=.3;
      ctx.beginPath();ctx.arc(r*.2,-r*.1,r*.6,.3,1.5);ctx.stroke();
      ctx.beginPath();ctx.arc(-r*.3,r*.2,r*.4,2,3.5);ctx.stroke();
      ctx.globalAlpha=1;
      break;
    case 'moonstone': // 月光石：蓝白晕彩
      grad.addColorStop(0,'#ffffff');grad.addColorStop(.4,color);grad.addColorStop(1,darken(color,.15));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      // 蓝色光晕
      const msGrad=ctx.createRadialGradient(r*.2,-r*.2,0,r*.2,-r*.2,r*.6);
      msGrad.addColorStop(0,'rgba(100,150,220,.4)');msGrad.addColorStop(1,'rgba(100,150,220,0)');
      ctx.fillStyle=msGrad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      break;
    case 'sunstone': // 太阳石：橙色 + 金色闪光点
      grad.addColorStop(0,lighten(color,.3));grad.addColorStop(.5,color);grad.addColorStop(1,darken(color,.2));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=accent;ctx.globalAlpha=.8;
      for(let i=0;i<12;i++){ctx.beginPath();ctx.arc(rand(-r*.7,r*.7),rand(-r*.7,r*.7),rand(r*.03,r*.06),0,Math.PI*2);ctx.fill();}
      ctx.globalAlpha=1;
      break;
    case 'aquamarine': // 海蓝宝：浅蓝通透
      grad.addColorStop(0,lighten(color,.35));grad.addColorStop(.5,lighten(color,.1));grad.addColorStop(1,darken(color,.1));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      // 晶面线
      ctx.strokeStyle=darken(color,.2);ctx.lineWidth=.5;ctx.globalAlpha=.25;
      ctx.beginPath();ctx.moveTo(-r*.6,-r*.3);ctx.lineTo(r*.6,r*.3);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-r*.3,r*.5);ctx.lineTo(r*.5,-r*.4);ctx.stroke();
      ctx.globalAlpha=1;
      break;
    case 'amethyst': // 紫水晶：紫色 + 晶面切割
      grad.addColorStop(0,lighten(color,.3));grad.addColorStop(.5,color);grad.addColorStop(1,darken(color,.25));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      // 六边形切割面
      ctx.strokeStyle=lighten(color,.2);ctx.lineWidth=.7;ctx.globalAlpha=.4;
      ctx.beginPath();
      for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2-Math.PI/2;const x=Math.cos(a)*r*.7,y=Math.sin(a)*r*.7;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
      ctx.closePath();ctx.stroke();
      ctx.globalAlpha=1;
      break;
    case 'crystal': // 草莓晶：粉透 + 红点
      grad.addColorStop(0,lighten(color,.3));grad.addColorStop(.5,color);grad.addColorStop(1,darken(color,.1));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=accent;ctx.globalAlpha=.5;
      for(let i=0;i<8;i++){ctx.beginPath();ctx.arc(rand(-r*.6,r*.6),rand(-r*.6,r*.6),rand(r*.04,r*.08),0,Math.PI*2);ctx.fill();}
      ctx.globalAlpha=1;
      break;
    case 'rutilated': // 发晶：透黄底 + 金色发丝
      grad.addColorStop(0,lighten(color,.25));grad.addColorStop(.5,color);grad.addColorStop(1,darken(color,.1));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=accent;ctx.lineWidth=.6;ctx.globalAlpha=.6;
      for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(-r*.8,rand(-r*.5,r*.5));ctx.lineTo(r*.8,rand(-r*.5,r*.5));ctx.stroke();}
      ctx.globalAlpha=1;
      break;
    case 'peridot': // 橄榄石：黄绿通透
      grad.addColorStop(0,lighten(color,.3));grad.addColorStop(.5,color);grad.addColorStop(1,darken(color,.2));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=lighten(color,.15);ctx.lineWidth=.5;ctx.globalAlpha=.3;
      ctx.beginPath();ctx.ellipse(0,0,r*.6,r*.4,.6,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=1;
      break;
    case 'banded': // 战国红：红黄相间条带
      grad.addColorStop(0,lighten(color,.2));grad.addColorStop(1,darken(color,.2));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      // 同心条带
      for(let i=0;i<4;i++){
        ctx.strokeStyle=i%2===0?accent:darken(color,.1);ctx.lineWidth=r*.15;ctx.globalAlpha=.5;
        ctx.beginPath();ctx.arc(0,0,r*(.2+i*.18),0,Math.PI*2);ctx.stroke();
      }
      ctx.globalAlpha=1;
      break;
    case 'pharmacist': // 一线药师：黑底 + 白线
      grad.addColorStop(0,lighten(color,.2));grad.addColorStop(.6,color);grad.addColorStop(1,darken(color,.2));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      // 白线
      ctx.strokeStyle=accent;ctx.lineWidth=r*.18;ctx.globalAlpha=.85;
      ctx.beginPath();ctx.moveTo(-r*.85,0);ctx.lineTo(r*.85,0);ctx.stroke();
      ctx.globalAlpha=1;
      break;
    case 'octagon': // 唐八棱：八边形切面
      grad.addColorStop(0,lighten(color,.25));grad.addColorStop(.5,color);grad.addColorStop(1,darken(color,.25));
      ctx.fillStyle=grad;
      ctx.beginPath();
      for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2;const x=Math.cos(a)*r*.95,y=Math.sin(a)*r*.95;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
      ctx.closePath();ctx.fill();
      // 切面线
      ctx.strokeStyle=darken(color,.2);ctx.lineWidth=.6;ctx.globalAlpha=.4;
      for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*r*.9,Math.sin(a)*r*.9);ctx.stroke();}
      ctx.globalAlpha=1;
      break;
    case 'bloodstone': // 鸡血石：暗红底 + 鲜红斑
      grad.addColorStop(0,lighten(color,.15));grad.addColorStop(.5,color);grad.addColorStop(1,darken(color,.2));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=accent;ctx.globalAlpha=.6;
      ctx.beginPath();ctx.ellipse(r*.1,-r*.2,r*.4,r*.25,.3,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(-r*.3,r*.3,r*.25,r*.15,-.5,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
      break;
    case 'tourmaline': // 碧玺：西瓜色（红皮绿心）
      grad.addColorStop(0,accent);grad.addColorStop(.5,lighten(color,.1));grad.addColorStop(.7,color);grad.addColorStop(1,darken(color,.2));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      break;
    case 'sugilite': // 舒俱来：紫色不透明 + 斑纹
      grad.addColorStop(0,lighten(color,.2));grad.addColorStop(.5,color);grad.addColorStop(1,darken(color,.2));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=accent;ctx.globalAlpha=.3;
      ctx.beginPath();ctx.ellipse(r*.2,-r*.1,r*.3,r*.2,.4,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(-r*.2,r*.3,r*.2,r*.15,-.3,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
      break;
    case 'thousandeye': // 千眼菩提：棕底 + 密集斑点
      grad.addColorStop(0,lighten(color,.2));grad.addColorStop(.6,color);grad.addColorStop(1,darken(color,.2));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=accent;ctx.globalAlpha=.4;
      for(let i=0;i<15;i++){ctx.beginPath();ctx.arc(rand(-r*.7,r*.7),rand(-r*.7,r*.7),rand(r*.04,r*.09),0,Math.PI*2);ctx.fill();}
      ctx.fillStyle=darken(color,.3);ctx.globalAlpha=.3;
      for(let i=0;i<8;i++){ctx.beginPath();ctx.arc(rand(-r*.6,r*.6),rand(-r*.6,r*.6),rand(r*.02,r*.05),0,Math.PI*2);ctx.fill();}
      ctx.globalAlpha=1;
      break;
    case 'buddha': // 佛头三通：锥形 + 三孔
      drawAccessory(ctx,r,comp,'buddha');
      break;
    case 'spacer': // 隔珠：小圆饼
      drawAccessory(ctx,r,comp,'spacer');
      break;
    case 'top': // 顶珠：大圆珠
      drawAccessory(ctx,r,comp,'top');
      break;
    case 'counter': // 计数器：圆珠 + 挂件
      drawAccessory(ctx,r,comp,'counter');
      break;
    case 'tassel': // 流苏
      drawAccessory(ctx,r,comp,'tassel');
      break;
    case 'beiyun': // 背云
      drawAccessory(ctx,r,comp,'beiyun');
      break;
    case 'dizizhu': // 弟子珠
      drawAccessory(ctx,r,comp,'dizizhu');
      break;
    case 'kazi': // 卡子
      drawAccessory(ctx,r,comp,'kazi');
      break;
    case 'lotus': // 莲花座
      drawAccessory(ctx,r,comp,'lotus');
      break;
    case 'gourd': // 葫芦
      drawAccessory(ctx,r,comp,'gourd');
      break;
    case 'barrel': // 桶珠
      drawAccessory(ctx,r,comp,'barrel');
      break;
    case 'abacus': // 算盘珠
      drawAccessory(ctx,r,comp,'abacus');
      break;
    case 'vajra_tool': // 金刚杵
      drawAccessory(ctx,r,comp,'vajra_tool');
      break;
    case 'silver': // 银隔片
      drawAccessory(ctx,r,comp,'silver');
      break;
    case 'skull': // 骷髅头
      drawAccessory(ctx,r,comp,'skull');
      break;
    default:
      grad.addColorStop(0,lighten(color,.2));grad.addColorStop(1,darken(color,.2));
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
  }
  // 通用高光（配件自带高光，跳过）
  const noHL=['tassel','counter','beiyun','dizizhu','kazi','lotus','gourd','barrel','abacus','vajra_tool','silver','skull'];
  if(!noHL.includes(type)){
    const hl=ctx.createRadialGradient(-r*.35,-r*.35,0,-r*.35,-r*.35,r*.5);
    hl.addColorStop(0,'rgba(255,255,255,.5)');hl.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=hl;ctx.beginPath();ctx.arc(-r*.35,-r*.35,r*.5,0,Math.PI*2);ctx.fill();
  }
  // 外圈描边（非圆形配件跳过）
  if(!noHL.includes(type)){
    ctx.strokeStyle=darken(color,.35);ctx.lineWidth=.8;ctx.globalAlpha=.6;
    ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
}
function drawAccessory(ctx,r,comp,kind){
  const {color,accent}=comp;
  if(kind==='buddha'){
    // 佛头：上圆下锥
    const grad=ctx.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r*1.2);
    grad.addColorStop(0,lighten(color,.3));grad.addColorStop(.6,color);grad.addColorStop(1,darken(color,.2));
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(0,-r*.2,r*.85,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(-r*.6,r*.3);ctx.lineTo(r*.6,r*.3);ctx.lineTo(0,r*1.2);ctx.closePath();ctx.fill();
    ctx.strokeStyle=darken(color,.25);ctx.lineWidth=.8;ctx.globalAlpha=.5;
    ctx.beginPath();ctx.arc(0,-r*.2,r*.85,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  }else if(kind==='spacer'){
    const grad=ctx.createLinearGradient(-r,-r,r,r);
    grad.addColorStop(0,lighten(color,.25));grad.addColorStop(1,darken(color,.2));
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(0,0,r*.85,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=accent;ctx.lineWidth=1.5;ctx.globalAlpha=.6;
    ctx.beginPath();ctx.arc(0,0,r*.5,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  }else if(kind==='top'){
    const grad=ctx.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r*1.1);
    grad.addColorStop(0,lighten(color,.3));grad.addColorStop(.5,color);grad.addColorStop(1,darken(color,.25));
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r*1.1,0,Math.PI*2);ctx.fill();
    // 顶珠装饰圈
    ctx.strokeStyle=accent;ctx.lineWidth=1;ctx.globalAlpha=.5;
    ctx.beginPath();ctx.arc(0,0,r*.7,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  }else if(kind==='counter'){
    // 圆珠 + 下挂小珠
    const grad=ctx.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r*.8);
    grad.addColorStop(0,lighten(color,.25));grad.addColorStop(1,darken(color,.2));
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,-r*.2,r*.75,0,Math.PI*2);ctx.fill();
    // 挂绳
    ctx.strokeStyle=accent;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(0,r*.4);ctx.lineTo(0,r*.9);ctx.stroke();
    // 小珠
    ctx.fillStyle=accent;ctx.beginPath();ctx.arc(0,r*1.05,r*.25,0,Math.PI*2);ctx.fill();
  }else if(kind==='tassel'){
    // 流苏：顶部圆珠 + 下方流苏线
    const grad=ctx.createRadialGradient(-r*.3,-r*.4,r*.1,0,0,r*.6);
    grad.addColorStop(0,lighten(color,.3));grad.addColorStop(1,color);
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,-r*.6,r*.55,0,Math.PI*2);ctx.fill();
    // 流苏
    ctx.strokeStyle=accent;ctx.lineWidth=1;ctx.globalAlpha=.7;
    for(let i=-3;i<=3;i++){
      const x=i*r*.15;
      ctx.beginPath();ctx.moveTo(x,-r*.1);
      ctx.bezierCurveTo(x+r*.05,r*.4,x-r*.05,r*.8,x,r*1.2);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  }else if(kind==='beiyun'){
    // 背云：扁平牌形 + 穿孔
    const grad=ctx.createLinearGradient(0,-r,0,r);
    grad.addColorStop(0,lighten(color,.25));grad.addColorStop(.5,color);grad.addColorStop(1,darken(color,.2));
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.roundRect(-r*.7,-r*.8,r*1.4,r*1.6,r*.2);ctx.fill();
    // 装饰纹
    ctx.strokeStyle=accent;ctx.lineWidth=1;ctx.globalAlpha=.5;
    ctx.beginPath();ctx.roundRect(-r*.5,-r*.6,r*1,r*1.2,r*.15);ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,r*.3,0,Math.PI*2);ctx.stroke();
    // 穿孔
    ctx.fillStyle=darken(color,.4);ctx.globalAlpha=.6;
    ctx.beginPath();ctx.arc(0,-r*.7,r*.1,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(0,r*.7,r*.1,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }else if(kind==='dizizhu'){
    // 弟子珠：3 颗小珠串联
    const grad=ctx.createRadialGradient(-r*.3,-r*.3,r*.05,0,0,r*.4);
    grad.addColorStop(0,lighten(color,.3));grad.addColorStop(1,darken(color,.15));
    ctx.fillStyle=grad;
    for(let i=0;i<3;i++){
      const y=-r*.6+i*r*.6;
      ctx.beginPath();ctx.arc(0,y,r*.38,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=darken(color,.2);ctx.lineWidth=.5;ctx.globalAlpha=.4;
      ctx.stroke();ctx.globalAlpha=1;
    }
    // 串联线
    ctx.strokeStyle=accent;ctx.lineWidth=1;ctx.globalAlpha=.5;
    ctx.beginPath();ctx.moveTo(0,-r*.95);ctx.lineTo(0,r*.95);ctx.stroke();
    ctx.globalAlpha=1;
  }else if(kind==='kazi'){
    // 卡子：金属夹片
    const grad=ctx.createLinearGradient(-r,0,r,0);
    grad.addColorStop(0,darken(color,.2));grad.addColorStop(.5,lighten(color,.3));grad.addColorStop(1,darken(color,.2));
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.roundRect(-r*.5,-r*.8,r,r*1.6,r*.1);ctx.fill();
    // 开口
    ctx.fillStyle=darken(color,.4);ctx.globalAlpha=.5;
    ctx.beginPath();ctx.rect(-r*.1,-r*.8,r*.2,r*1.6);ctx.fill();
    ctx.globalAlpha=1;
    // 装饰线
    ctx.strokeStyle=accent;ctx.lineWidth=.8;ctx.globalAlpha=.5;
    ctx.beginPath();ctx.moveTo(-r*.4,-r*.5);ctx.lineTo(r*.4,-r*.5);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-r*.4,r*.5);ctx.lineTo(r*.4,r*.5);ctx.stroke();
    ctx.globalAlpha=1;
  }else if(kind==='lotus'){
    // 莲花座：花瓣
    const grad=ctx.createRadialGradient(0,0,r*.1,0,0,r);
    grad.addColorStop(0,lighten(color,.3));grad.addColorStop(1,darken(color,.15));
    // 花瓣
    for(let i=0;i<8;i++){
      const a=(i/8)*Math.PI*2;
      ctx.save();ctx.rotate(a);
      ctx.fillStyle=grad;ctx.globalAlpha=.85;
      ctx.beginPath();ctx.ellipse(0,-r*.5,r*.25,r*.5,0,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha=1;
    // 花心
    const cg=ctx.createRadialGradient(0,0,0,0,0,r*.3);
    cg.addColorStop(0,lighten(accent,.3));cg.addColorStop(1,accent);
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,r*.3,0,Math.PI*2);ctx.fill();
  }else if(kind==='gourd'){
    // 葫芦：上下两圆
    const grad=ctx.createRadialGradient(-r*.3,-r*.4,r*.1,0,0,r);
    grad.addColorStop(0,lighten(color,.3));grad.addColorStop(.6,color);grad.addColorStop(1,darken(color,.2));
    ctx.fillStyle=grad;
    // 上小圆
    ctx.beginPath();ctx.arc(0,-r*.5,r*.4,0,Math.PI*2);ctx.fill();
    // 腰
    ctx.beginPath();ctx.ellipse(0,-r*.1,r*.2,r*.15,0,0,Math.PI*2);ctx.fill();
    // 下大圆
    ctx.beginPath();ctx.arc(0,r*.3,r*.6,0,Math.PI*2);ctx.fill();
    // 高光
    ctx.fillStyle=lighten(color,.4);ctx.globalAlpha=.3;
    ctx.beginPath();ctx.arc(-r*.2,-r*.55,r*.12,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(-r*.25,r*.2,r*.18,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }else if(kind==='barrel'){
    // 桶珠：圆柱形
    const grad=ctx.createLinearGradient(-r,0,r,0);
    grad.addColorStop(0,darken(color,.2));grad.addColorStop(.5,lighten(color,.2));grad.addColorStop(1,darken(color,.2));
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.roundRect(-r*.55,-r*.8,r*1.1,r*1.6,r*.15);ctx.fill();
    // 木纹
    ctx.strokeStyle=darken(color,.25);ctx.lineWidth=.5;ctx.globalAlpha=.3;
    for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(0,-r*.3+i*r*.3,r*.5,r*.15,0,0,Math.PI*2);ctx.stroke();}
    ctx.globalAlpha=1;
    // 两端
    ctx.fillStyle=darken(color,.15);
    ctx.beginPath();ctx.ellipse(0,-r*.8,r*.55,r*.12,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(0,r*.8,r*.55,r*.12,0,0,Math.PI*2);ctx.fill();
  }else if(kind==='abacus'){
    // 算盘珠：扁圆片
    const grad=ctx.createLinearGradient(0,-r,0,r);
    grad.addColorStop(0,lighten(color,.2));grad.addColorStop(.5,color);grad.addColorStop(1,darken(color,.2));
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.ellipse(0,0,r*.7,r*.35,0,0,Math.PI*2);ctx.fill();
    // 中心孔
    ctx.fillStyle=darken(color,.4);ctx.globalAlpha=.6;
    ctx.beginPath();ctx.ellipse(0,0,r*.2,r*.1,0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    // 侧面
    ctx.strokeStyle=darken(color,.25);ctx.lineWidth=.6;ctx.globalAlpha=.4;
    ctx.beginPath();ctx.ellipse(0,0,r*.7,r*.35,0,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  }else if(kind==='vajra_tool'){
    // 金刚杵：两端对称法器
    const grad=ctx.createLinearGradient(0,-r,0,r);
    grad.addColorStop(0,lighten(color,.3));grad.addColorStop(.5,color);grad.addColorStop(1,darken(color,.2));
    ctx.fillStyle=grad;
    // 中杆
    ctx.beginPath();ctx.roundRect(-r*.15,-r*.5,r*.3,r,0);ctx.fill();
    // 上端
    ctx.beginPath();ctx.arc(0,-r*.6,r*.3,0,Math.PI*2);ctx.fill();
    // 下端
    ctx.beginPath();ctx.arc(0,r*.6,r*.3,0,Math.PI*2);ctx.fill();
    // 端尖
    ctx.beginPath();ctx.moveTo(-r*.2,-r*.85);ctx.lineTo(0,-r*1.0);ctx.lineTo(r*.2,-r*.85);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(-r*.2,r*.85);ctx.lineTo(0,r*1.0);ctx.lineTo(r*.2,r*.85);ctx.closePath();ctx.fill();
    // 中间装饰圈
    ctx.strokeStyle=accent;ctx.lineWidth=1;ctx.globalAlpha=.5;
    ctx.beginPath();ctx.arc(0,-r*.2,r*.25,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(0,r*.2,r*.25,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  }else if(kind==='silver'){
    // 银隔片：薄银片
    const grad=ctx.createRadialGradient(-r*.3,-r*.3,r*.05,0,0,r*.7);
    grad.addColorStop(0,accent);grad.addColorStop(.5,color);grad.addColorStop(1,darken(color,.2));
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.ellipse(0,0,r*.6,r*.25,0,0,Math.PI*2);ctx.fill();
    // 银花纹
    ctx.strokeStyle=accent;ctx.lineWidth=.5;ctx.globalAlpha=.6;
    ctx.beginPath();ctx.ellipse(0,0,r*.35,r*.14,0,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,r*.2,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  }else if(kind==='skull'){
    // 骷髅头
    const grad=ctx.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);
    grad.addColorStop(0,lighten(color,.2));grad.addColorStop(1,darken(color,.2));
    ctx.fillStyle=grad;
    // 头骨
    ctx.beginPath();ctx.ellipse(0,-r*.2,r*.65,r*.55,0,0,Math.PI*2);ctx.fill();
    // 下颌
    ctx.beginPath();ctx.ellipse(0,r*.3,r*.4,r*.25,0,0,Math.PI*2);ctx.fill();
    // 眼窝
    ctx.fillStyle=darken(color,.5);ctx.globalAlpha=.8;
    ctx.beginPath();ctx.arc(-r*.25,-r*.25,r*.15,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(r*.25,-r*.25,r*.15,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    // 鼻孔
    ctx.fillStyle=darken(color,.4);ctx.globalAlpha=.6;
    ctx.beginPath();ctx.moveTo(0,-r*.05);ctx.lineTo(-r*.08,r*.1);ctx.lineTo(r*.08,r*.1);ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;
    // 牙齿
    ctx.strokeStyle=darken(color,.3);ctx.lineWidth=.5;ctx.globalAlpha=.5;
    for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*r*.12,r*.2);ctx.lineTo(i*r*.12,r*.4);ctx.stroke();}
    ctx.globalAlpha=1;
  }
}
// 颜色工具
function hex2rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgb2hex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function lighten(h,a){const[r,g,b]=hex2rgb(h);return rgb2hex(r+(255-r)*a,g+(255-g)*a,b+(255-b)*a);}
function darken(h,a){const[r,g,b]=hex2rgb(h);return rgb2hex(r*(1-a),g*(1-a),b*(1-a));}
function rand(a,b){return a+Math.random()*(b-a);}

/* =========================================================
 * 手串主画布渲染
 * =======================================================*/
function renderBracelet(){
  const w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h);
  // 背景
  const bg=BACKGROUNDS[bgIndex];
  ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
  // 装饰：淡淡的纹理
  if(bg==='#faf6ec'){
    ctx.fillStyle='rgba(44,36,22,.02)';
    for(let i=0;i<50;i++){ctx.beginPath();ctx.arc(rand(0,w),rand(0,h),rand(1,3),0,Math.PI*2);ctx.fill();}
  }
  const cx=w/2,cy=h/2;
  if(beads.length===0){return;}
  // 计算环半径（根据珠子数量和大小自适应）
  const n=beads.length;
  const size=beadSize;
  // 环周长至少容纳所有珠子
  const minCirc=n*(size*2+beadGap);
  let radius=Math.max(minCirc/(2*Math.PI),w*0.18);
  radius=Math.min(radius,w*0.42);
  // 绳子
  ctx.strokeStyle=cordColor;ctx.lineWidth=3;ctx.globalAlpha=.7;
  ctx.beginPath();ctx.arc(cx,cy,radius,0,Math.PI*2);ctx.stroke();
  ctx.globalAlpha=1;
  // 逐个绘制珠子
  beads.forEach((b,i)=>{
    const angle=(i/n)*Math.PI*2-Math.PI/2;
    const x=cx+Math.cos(angle)*radius;
    const y=cy+Math.sin(angle)*radius;
    const comp=COMP_MAP[b.compId];
    if(!comp)return;
    const r=size*(comp.scale||1);
    drawBead(ctx,x,y,r,comp,angle);
  });
}
function updateHint(){
  $('preview-hint').style.display=beads.length===0?'block':'none';
}

/* =========================================================
 * 组件库渲染
 * =======================================================*/
function renderLibrary(){
  const grid=$('lib-grid');
  grid.innerHTML='';
  const items=COMPONENTS.filter(c=>c.cat===activeCat);
  items.forEach(comp=>{
    const item=document.createElement('div');
    item.className='comp-item'+(selectedComp&&selectedComp.id===comp.id?' selected':'');
    item.draggable=true;
    item.dataset.compId=comp.id;
    item.innerHTML=`<canvas width="96" height="96"></canvas><span class="comp-name">${comp.name}</span><span class="comp-badge">✓</span>`;
    grid.appendChild(item);
    // 绘制预览
    const c=item.querySelector('canvas');
    const cx=c.getContext('2d');
    cx.scale(2,2); // 高清
    drawBead(cx,24,24,20,comp);
    // 点击选中
    item.addEventListener('click',()=>{
      selectedComp=comp;
      renderLibrary();
    });
    // 拖拽
    item.addEventListener('dragstart',e=>{
      item.classList.add('dragging');
      e.dataTransfer.setData('text/compId',comp.id);
      e.dataTransfer.effectAllowed='copy';
    });
    item.addEventListener('dragend',()=>item.classList.remove('dragging'));
  });
}

/* =========================================================
 * 已添加列表渲染
 * =======================================================*/
function renderList(){
  const scroll=$('list-scroll');
  $('list-count').textContent=beads.length;
  if(beads.length===0){
    scroll.innerHTML='<div class="list-empty">尚未添加组件<br>点击或拖拽左侧组件开始设计</div>';
    return;
  }
  scroll.innerHTML='';
  beads.forEach((b,idx)=>{
    const comp=COMP_MAP[b.compId];
    if(!comp)return;
    const row=document.createElement('div');
    row.className='bead-row';
    row.draggable=true;
    row.dataset.idx=idx;
    row.innerHTML=`<canvas width="56" height="56"></canvas><div class="bead-info"><div class="bead-name">${comp.name}</div><div class="bead-type">${comp.cat==='bead'?'珠子':'配件'} · #${idx+1}</div></div><button class="bead-del" title="删除">×</button>`;
    scroll.appendChild(row);
    const c=row.querySelector('canvas');
    const cx=c.getContext('2d');
    cx.scale(2,2);
    drawBead(cx,14,14,12,comp);
    // 删除
    row.querySelector('.bead-del').addEventListener('click',e=>{
      e.stopPropagation();
      pushHistory();
      beads.splice(idx,1);
      renderList();renderBracelet();updateHint();
    });
    // 拖拽排序
    row.addEventListener('dragstart',e=>{
      row.classList.add('dragging');
      e.dataTransfer.setData('text/idx',String(idx));
      e.dataTransfer.effectAllowed='move';
    });
    row.addEventListener('dragend',()=>row.classList.remove('dragging'));
    row.addEventListener('dragover',e=>{
      e.preventDefault();
      row.classList.add('dragging-over');
    });
    row.addEventListener('dragleave',()=>row.classList.remove('dragging-over'));
    row.addEventListener('drop',e=>{
      e.preventDefault();
      row.classList.remove('dragging-over');
      const from=parseInt(e.dataTransfer.getData('text/idx'));
      if(isNaN(from)||from===idx)return;
      pushHistory();
      const[moved]=beads.splice(from,1);
      beads.splice(idx,0,moved);
      renderList();renderBracelet();
    });
  });
}

/* =========================================================
 * 交互：点击/拖拽添加珠子
 * =======================================================*/
// 画布点击：在点击位置最近的圆环位置插入珠子
canvas.addEventListener('click',e=>{
  if(!selectedComp){toast('请先选择一个组件');return;}
  const rect=canvas.getBoundingClientRect();
  const logical=canvas._logicalSize||560;
  const sx=(e.clientX-rect.left)/rect.width*logical;
  const sy=(e.clientY-rect.top)/rect.height*logical;
  const cx=logical/2,cy=logical/2;
  const dx=sx-cx,dy=sy-cy;
  const dist=Math.hypot(dx,dy);
  // 计算当前环半径
  const n=beads.length;
  const size=beadSize;
  const minCirc=Math.max(n,1)*(size*2+beadGap);
  let radius=Math.max(minCirc/(2*Math.PI),logical*0.18);
  radius=Math.min(radius,logical*0.42);
  // 如果空串或点击在环附近，追加；否则按角度插入
  if(n===0||Math.abs(dist-radius)<size*1.5){
    // 计算插入位置（按角度）
    let angle=Math.atan2(dy,dx)+Math.PI/2;
    if(angle<0)angle+=Math.PI*2;
    const insertIdx=Math.round(angle/(Math.PI*2)*n);
    pushHistory();
    beads.splice(insertIdx%n,0,{compId:selectedComp.id});
    renderList();renderBracelet();updateHint();
  }else{
    // 不在环上：直接追加
    pushHistory();
    beads.push({compId:selectedComp.id});
    renderList();renderBracelet();updateHint();
  }
});
// 画布拖拽接收
canvas.addEventListener('dragover',e=>{
  e.preventDefault();
  e.dataTransfer.dropEffect='copy';
  const rect=canvas.getBoundingClientRect();
  const indicator=$('drop-indicator');
  indicator.style.left=(rect.width/2-rect.width*.42)+'px';
  indicator.style.top=(rect.height/2-rect.width*.42)+'px';
  indicator.style.width=rect.width*.84+'px';
  indicator.style.height=rect.width*.84+'px';
  indicator.classList.add('show');
});
canvas.addEventListener('dragleave',e=>{
  if(e.target===canvas)$('drop-indicator').classList.remove('show');
});
canvas.addEventListener('drop',e=>{
  e.preventDefault();
  $('drop-indicator').classList.remove('show');
  const compId=e.dataTransfer.getData('text/compId');
  if(!compId||!COMP_MAP[compId])return;
  pushHistory();
  // 根据落点角度插入
  const rect=canvas.getBoundingClientRect();
  const logical=canvas._logicalSize||560;
  const sx=(e.clientX-rect.left)/rect.width*logical;
  const sy=(e.clientY-rect.top)/rect.height*logical;
  const cx=logical/2,cy=logical/2;
  const dx=sx-cx,dy=sy-cy;
  let angle=Math.atan2(dy,dx)+Math.PI/2;
  if(angle<0)angle+=Math.PI*2;
  const n=beads.length;
  const insertIdx=n>0?Math.round(angle/(Math.PI*2)*n)%n:0;
  beads.splice(insertIdx,0,{compId});
  renderList();renderBracelet();updateHint();
  toast('已添加：'+COMP_MAP[compId].name);
});

/* =========================================================
 * 操作按钮
 * =======================================================*/
$('btn-clear').onclick=()=>{
  if(beads.length===0)return;
  pushHistory();
  beads=[];renderList();renderBracelet();updateHint();
  toast('已清空');
};
$('btn-undo').onclick=()=>{
  if(history.length===0){toast('无可撤销操作');return;}
  beads=history.pop();
  renderList();renderBracelet();updateHint();
  toast('已撤销');
};
$('btn-shuffle').onclick=()=>{
  if(beads.length<2)return;
  pushHistory();
  for(let i=beads.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[beads[i],beads[j]]=[beads[j],beads[i]];}
  renderList();renderBracelet();
  toast('已打乱顺序');
};
$('btn-reverse').onclick=()=>{
  if(beads.length<2)return;
  pushHistory();
  beads.reverse();
  renderList();renderBracelet();
  toast('已反转顺序');
};
$('btn-bg').onclick=()=>{
  bgIndex=(bgIndex+1)%BACKGROUNDS.length;
  renderBracelet();
};
$('btn-save').onclick=()=>{
  if(beads.length===0){toast('请先添加组件');return;}
  // 高清重绘
  const exportCanvas=document.createElement('canvas');
  const SIZE=1080;
  exportCanvas.width=SIZE;exportCanvas.height=SIZE;
  const ex=exportCanvas.getContext('2d');
  // 临时切换上下文渲染
  const oldCanvas=canvas;const oldCtx=ctx;
  // 直接在导出画布上绘制
  const bg=BACKGROUNDS[bgIndex];
  ex.fillStyle=bg;ex.fillRect(0,0,SIZE,SIZE);
  // 装饰
  if(bg==='#faf6ec'){
    ex.fillStyle='rgba(44,36,22,.02)';
    for(let i=0;i<80;i++){ex.beginPath();ex.arc(rand(0,SIZE),rand(0,SIZE),rand(1,4),0,Math.PI*2);ex.fill();}
  }
  // 水印
  ex.fillStyle=bg==='#faf6ec'?'rgba(44,36,22,.2)':'rgba(245,240,230,.2)';
  ex.font='28px "Noto Serif SC",serif';ex.textAlign='center';
  ex.fillText('禅心手串 · 设计工坊',SIZE/2,SIZE-40);
  // 环
  const cx=SIZE/2,cy=SIZE/2;
  const n=beads.length;
  const logical=canvas._logicalSize||560;
  const size=beadSize*SIZE/logical;
  const minCirc=n*(size*2+beadGap);
  let radius=Math.max(minCirc/(2*Math.PI),SIZE*0.18);
  radius=Math.min(radius,SIZE*0.42);
  drawCord(ex,cx,cy,radius,cordColor,cordStyle,size);
  beads.forEach((b,i)=>{
    const angle=(i/n)*Math.PI*2-Math.PI/2;
    const x=cx+Math.cos(angle)*radius;
    const y=cy+Math.sin(angle)*radius;
    const comp=COMP_MAP[b.compId];
    if(!comp)return;
    const r=size*(comp.scale||1);
    drawBead(ex,x,y,r,comp,angle);
  });
  // 下载
  exportCanvas.toBlob(blob=>{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='禅心手串_'+Date.now()+'.png';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('已保存为图片');
  },'image/png');
};

/* =========================================================
 * 控件
 * =======================================================*/
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    activeCat=t.dataset.cat;
    selectedComp=null;
    renderLibrary();
  };
});
$('ctrl-size').oninput=e=>{beadSize=+e.target.value;$('val-size').textContent=beadSize;renderBracelet();};
$('ctrl-gap').oninput=e=>{beadGap=+e.target.value;$('val-gap').textContent=beadGap;renderBracelet();};
$('ctrl-cord').oninput=e=>{cordColor=e.target.value;renderBracelet();};
$('ctrl-cord-style').onchange=e=>{cordStyle=e.target.value;renderBracelet();};

/* =========================================================
 * 历史 / 撤销
 * =======================================================*/
function pushHistory(){
  history.push(JSON.parse(JSON.stringify(beads)));
  if(history.length>30)history.shift();
}

/* =========================================================
 * 响应式：Canvas 高清适配
 * =======================================================*/
function resizeCanvas(){
  const wrap=canvas.parentElement;
  const size=Math.min(wrap.clientWidth,wrap.clientHeight);
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=size*dpr;canvas.height=size*dpr;
  canvas.style.width=size+'px';canvas.style.height=size+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // 重绘时用逻辑尺寸
  canvas._logicalSize=size;
  renderBracelet();
}
// 覆盖 renderBracelet 以使用逻辑尺寸
const _origRender=renderBracelet;
renderBracelet=function(){
  const size=canvas._logicalSize||560;
  const w=size,h=size;
  ctx.clearRect(0,0,w,h);
  const bg=BACKGROUNDS[bgIndex];
  ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
  if(bg==='#faf6ec'){
    ctx.fillStyle='rgba(44,36,22,.02)';
    for(let i=0;i<50;i++){ctx.beginPath();ctx.arc(rand(0,w),rand(0,h),rand(1,3),0,Math.PI*2);ctx.fill();}
  }
  const cx=w/2,cy=h/2;
  if(beads.length===0)return;
  const n=beads.length;
  const s=beadSize;
  const minCirc=n*(s*2+beadGap);
  let radius=Math.max(minCirc/(2*Math.PI),w*0.18);
  radius=Math.min(radius,w*0.42);
  drawCord(ctx,cx,cy,radius,cordColor,cordStyle,beadSize);
  beads.forEach((b,i)=>{
    const angle=(i/n)*Math.PI*2-Math.PI/2;
    const x=cx+Math.cos(angle)*radius;
    const y=cy+Math.sin(angle)*radius;
    const comp=COMP_MAP[b.compId];
    if(!comp)return;
    const r=s*(comp.scale||1);
    drawBead(ctx,x,y,r,comp,angle);
  });
};

/* =========================================================
 * 初始化
 * =======================================================*/
renderLibrary();
renderList();
resizeCanvas();
updateHint();
addEventListener('resize',resizeCanvas);
// 默认选中第一个珠子
selectedComp=COMPONENTS[0];
renderLibrary();
console.log('%c禅心手串 · 设计工坊 // READY','color:#c0392b;font-size:14px;font-weight:bold;');
