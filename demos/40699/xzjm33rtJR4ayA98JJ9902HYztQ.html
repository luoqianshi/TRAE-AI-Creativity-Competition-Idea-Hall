<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpineSprite · 脊柱共生体 - 硬件交互Demo</title>
    <style>
        :root {
            --bg: #1e1e2f;
            --panel: #2a2a40;
            --text-main: #f1f1f5;
            --text-sub: #a0a0c0;
            
            /* Status Colors */
            --color-healthy: #4ade80;
            --color-warning: #facc15;
            --color-danger: #ef4444;
            
            --pet-color: #818cf8;
            --current-status-color: var(--color-healthy);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        body.danger-bg {
            background-color: #2b1616;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            z-index: 10;
        }

        .header h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .header p {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .demo-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        @media (min-width: 768px) {
            .demo-container {
                flex-direction: row;
            }
        }

        /* 硬件视窗区域 */
        .hardware-window {
            flex: 1.5;
            background-color: #151522;
            border-radius: 24px;
            border: 4px solid #3b3b54;
            position: relative;
            height: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transition: border-color 0.3s;
        }

        .hardware-notch {
            position: absolute;
            top: 0;
            width: 120px;
            height: 20px;
            background-color: #3b3b54;
            border-radius: 0 0 10px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .camera-lens {
            width: 8px;
            height: 8px;
            background-color: #0f0f1a;
            border-radius: 50%;
            border: 1px solid #555;
            box-shadow: inset 0 0 2px #000;
        }

        /* 挤压块 (虚拟重力) */
        .crusher {
            position: absolute;
            top: -20px;
            left: 0;
            width: 100%;
            height: 20px;
            background: linear-gradient(180deg, rgba(239, 68, 68, 0.8) 0%, rgba(239, 68, 68, 0) 100%);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 5;
        }

        /* 电子宠物精灵 */
        .pet-container {
            position: relative;
            margin-bottom: 40px;
            z-index: 10;
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transform-origin: bottom center;
        }

        .pet-blob {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle at 30% 30%, #a5b4fc, var(--pet-color));
            border-radius: 45% 55% 40% 60% / 55% 45% 60% 40%;
            box-shadow: 0 10px 30px rgba(129, 140, 248, 0.4), inset -10px -10px 20px rgba(0,0,0,0.2);
            position: relative;
            animation: float 4s ease-in-out infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .pet-shadow {
            width: 100px;
            height: 15px;
            background-color: rgba(0,0,0,0.4);
            border-radius: 50%;
            margin: 0 auto;
            transition: all 0.3s ease;
        }

        .pet-face {
            font-size: 2rem;
            color: #1e1e2f;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        /* 汗滴 */
        .sweat {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); border-radius: 45% 55% 40% 60% / 55% 45% 60% 40%; }
            50% { transform: translateY(-15px) rotate(2deg); border-radius: 55% 45% 50% 50% / 45% 55% 50% 50%; }
        }

        /* 状态文字悬浮窗 */
        .status-overlay {
            position: absolute;
            top: 40px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid var(--current-status-color);
            transition: border-color 0.3s;
        }

        .status-title {
            font-size: 0.8rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .status-message {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* 控制面板 */
        .control-panel {
            flex: 1;
            background-color: var(--panel);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .panel-title {
            font-size: 1.2rem;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 20px;
            background-color: #818cf8;
            border-radius: 4px;
        }

        .slider-container {
            margin-bottom: 30px;
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* 自定义滑块 */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            border: 4px solid var(--current-status-color);
            transition: border-color 0.3s;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: linear-gradient(90deg, #4ade80 0%, #facc15 50%, #ef4444 100%);
            border-radius: 3px;
        }

        .info-card {
            background-color: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--text-sub);
        }

        .info-card strong {
            color: var(--text-main);
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>SpineSprite · 脊柱共生体</h1>
        <p>桌面姿势镜像舱 —— 拖动滑块，模拟用户的坐姿弯曲度</p>
    </div>

    <div class="demo-container">
        <!-- 左侧/上方：硬件模拟视窗 -->
        <div class="hardware-window" id="hw-window">
            <div class="hardware-notch"><div class="camera-lens"></div></div>
            
            <div class="crusher" id="crusher"></div>

            <div class="status-overlay" id="status-card">
                <div class="status-title">共生舱状态 | 姿势健康度</div>
                <div class="status-message" id="status-text">环境适宜，精灵正在为你工作赋能</div>
            </div>

            <div class="pet-container" id="pet-container">
                <div class="sweat" id="pet-sweat">💦</div>
                <div class="pet-blob" id="pet-blob">
                    <div class="pet-face" id="pet-face">( ˶ˆᗜˆ˵ )</div>
                </div>
            </div>
            <div class="pet-shadow" id="pet-shadow"></div>
        </div>

        <!-- 右侧/下方：交互控制面板 -->
        <div class="control-panel">
            <div class="panel-title">传感器模拟器</div>
            
            <div class="slider-container">
                <div class="slider-labels">
                    <span style="color: var(--color-healthy);">挺拔 (0°)</span>
                    <span style="color: var(--color-warning);">倾斜 (30°)</span>
                    <span style="color: var(--color-danger);">严重驼背 (60°+)</span>
                </div>
                <input type="range" id="posture-slider" min="0" max="100" value="0" step="1">
            </div>

            <div class="info-card">
                <strong>互动说明：</strong><br><br>
                在真实的硬件产品中，滑块由 <strong>摄像头视觉骨骼捕捉</strong> 或 <strong>智能座椅压力传感</strong> 驱动。<br><br>
                当用户因为沉浸工作而不自觉变成“虾米”时，精灵的生存空间会被压缩。这利用了人类的同理心：<strong>“为了不压扁它，我得坐直了。”</strong>
            </div>
        </div>
    </div>

    <script>
        const slider = document.getElementById('posture-slider');
        const petContainer = document.getElementById('pet-container');
        const petBlob = document.getElementById('pet-blob');
        const petFace = document.getElementById('pet-face');
        const petSweat = document.getElementById('pet-sweat');
        const petShadow = document.getElementById('pet-shadow');
        const crusher = document.getElementById('crusher');
        const statusText = document.getElementById('status-text');
        const hwWindow = document.getElementById('hw-window');
        const statusCard = document.getElementById('status-card');

        slider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            updateEcosystem(val);
        });

        function updateEcosystem(stressLevel) {
            // Normalize scale (0 to 1)
            const ratio = stressLevel / 100;
            
            // 1. Calculate Deformation (Squish effect)
            // ScaleX increases (gets wider), ScaleY decreases (gets shorter)
            const scaleX = 1 + (ratio * 0.4);
            const scaleY = 1 - (ratio * 0.6); // At 100%, height is 40%
            const translateY = ratio * 50; // Push down

            petContainer.style.transform = `scale(${scaleX}, ${scaleY}) translateY(${translateY}px)`;
            
            // Shadow gets wider and lighter
            petShadow.style.transform = `scaleX(${1 + ratio * 0.5})`;
            petShadow.style.opacity = 1 - (ratio * 0.5);

            // 2. Logic Thresholds for Colors and Expressions
            if (stressLevel < 30) {
                // HEALTHY
                document.documentElement.style.setProperty('--current-status-color', 'var(--color-healthy)');
                document.body.classList.remove('danger-bg');
                petBlob.style.background = 'radial-gradient(circle at 30% 30%, #a5b4fc, #818cf8)';
                petBlob.style.animationPlayState = 'running';
                
                petFace.innerText = '( ˶ˆᗜˆ˵ )';
                petSweat.style.opacity = 0;
                
                crusher.style.opacity = 0;
                crusher.style.height = '0px';
                
                statusText.innerText = '环境适宜，精灵正在为你工作赋能 ✨';
                statusCard.style.borderLeftColor = 'var(--color-healthy)';
                hwWindow.style.borderColor = '#3b3b54';

            } else if (stressLevel < 70) {
                // WARNING
                document.documentElement.style.setProperty('--current-status-color', 'var(--color-warning)');
                document.body.classList.remove('danger-bg');
                petBlob.style.background = 'radial-gradient(circle at 30% 30%, #fde047, #eab308)';
                petBlob.style.animationPlayState = 'paused'; // Stop floating
                
                petFace.innerText = '( º _ º )';
                petSweat.style.opacity = 1;
                
                crusher.style.opacity = 0.5;
                crusher.style.height = (ratio * 100) + 'px';
                
                statusText.innerText = '警告：侦测到外部重力异常增加，精灵感到压抑！';
                statusCard.style.borderLeftColor = 'var(--color-warning)';
                hwWindow.style.borderColor = 'var(--color-warning)';

            } else {
                // DANGER
                document.documentElement.style.setProperty('--current-status-color', 'var(--color-danger)');
                document.body.classList.add('danger-bg');
                petBlob.style.background = 'radial-gradient(circle at 30% 30%, #fca5a5, #ef4444)';
                petBlob.style.animationPlayState = 'paused';
                
                petFace.innerText = '( ＞﹏＜ )';
                petSweat.style.opacity = 1;
                
                crusher.style.opacity = 1;
                crusher.style.height = (ratio * 150) + 'px';
                
                statusText.innerText = '危急：脊柱严重弯曲！空间压缩即将达到临界值！';
                statusCard.style.borderLeftColor = 'var(--color-danger)';
                hwWindow.style.borderColor = 'var(--color-danger)';
            }
        }
    </script>
</body>
</html>
