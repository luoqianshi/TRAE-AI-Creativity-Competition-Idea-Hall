<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>纸鸢坊 · AI 风筝设计工坊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei","PingFang SC",sans-serif;}
html,body{width:100%;min-height:100%;}
body{
  background:linear-gradient(180deg,#7ec4ff 0%,#a8d8ff 35%,#d4ecff 65%,#fff8e7 100%);
  position:relative;overflow-x:hidden;color:#1a3a5c;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background:
    radial-gradient(ellipse at 20% 0%,rgba(255,235,150,0.5),transparent 50%),
    radial-gradient(ellipse at 80% 30%,rgba(255,200,150,0.3),transparent 50%);
}

/* === 飘动云朵 === */
.sky{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
.cloud{
  position:absolute;background:#fff;border-radius:50%;opacity:0.92;
  filter:blur(2.5px);animation:drift linear infinite;
  box-shadow:0 4px 20px rgba(255,255,255,0.5);
}
.cloud::before,.cloud::after{
  content:"";position:absolute;background:#fff;border-radius:50%;
  box-shadow:0 4px 20px rgba(255,255,255,0.5);
}
.cloud.c1{width:130px;height:55px;top:10%;left:-160px;animation-duration:55s;}
.cloud.c1::before{width:75px;height:75px;top:-32px;left:22px;}
.cloud.c1::after{width:60px;height:60px;top:-22px;left:68px;}
.cloud.c2{width:95px;height:42px;top:25%;left:-130px;animation-duration:70s;animation-delay:-20s;}
.cloud.c2::before{width:58px;height:58px;top:-26px;left:16px;}
.cloud.c2::after{width:48px;height:48px;top:-16px;left:52px;}
.cloud.c3{width:160px;height:60px;top:45%;left:-200px;animation-duration:85s;animation-delay:-40s;}
.cloud.c3::before{width:90px;height:90px;top:-38px;left:28px;}
.cloud.c3::after{width:70px;height:70px;top:-26px;left:78px;}
.cloud.c4{width:105px;height:46px;top:65%;left:-140px;animation-duration:60s;animation-delay:-10s;}
.cloud.c4::before{width:62px;height:62px;top:-28px;left:18px;}
.cloud.c4::after{width:52px;height:52px;top:-18px;left:58px;}
.cloud.c5{width:80px;height:36px;top:80%;left:-110px;animation-duration:75s;animation-delay:-30s;}
.cloud.c5::before{width:50px;height:50px;top:-22px;left:14px;}
.cloud.c5::after{width:40px;height:40px;top:-14px;left:46px;}
@keyframes drift{
  from{transform:translateX(0);}
  to{transform:translateX(calc(100vw + 220px));}
}

/* === 太阳 === */
.sun{
  position:fixed;top:30px;right:50px;width:90px;height:90px;z-index:2;pointer-events:none;
  background:radial-gradient(circle,#fff9c4 0%,#fff59d 35%,#ffe082 60%,rgba(255,235,59,0) 80%);
  border-radius:50%;animation:sunGlow 4s ease-in-out infinite;
}
.sun::after{
  content:"";position:absolute;inset:-20px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,235,59,0.3),transparent 70%);
  animation:sunGlow 4s ease-in-out infinite reverse;
}
@keyframes sunGlow{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}

/* === 飘落花瓣 === */
.petal{position:fixed;top:-20px;z-index:1;pointer-events:none;opacity:0.7;
  font-size:14px;animation:petalFall linear infinite;}
@keyframes petalFall{
  0%{transform:translateY(-20px) translateX(0) rotate(0deg);opacity:0;}
  10%{opacity:0.7;}
  90%{opacity:0.7;}
  100%{transform:translateY(100vh) translateX(100px) rotate(360deg);opacity:0;}
}

/* === 头部 === */
.header{
  position:relative;z-index:10;text-align:center;padding:20px 20px 12px;
  pointer-events:none;
}
.header-inner{display:inline-block;position:relative;}
.header h1{
  font-size:38px;color:#1a3a5c;
  text-shadow:2px 2px 0 #fff,4px 4px 0 rgba(21,101,192,0.15),6px 6px 12px rgba(0,0,0,0.1);
  letter-spacing:10px;font-weight:900;margin-left:10px;
  background:linear-gradient(180deg,#1a3a5c 0%,#2c5d99 50%,#1a3a5c 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;position:relative;
}
.header h1::before,.header h1::after{
  content:"❖";position:absolute;top:50%;transform:translateY(-50%);
  color:#e91e63;font-size:18px;text-shadow:none;
  -webkit-text-fill-color:#e91e63;
}
.header h1::before{left:-30px;}
.header h1::after{right:-30px;}
.header p{font-size:13px;color:#0277bd;margin-top:6px;letter-spacing:4px;font-weight:500;}
.header .badges{display:flex;justify-content:center;gap:14px;margin-top:12px;pointer-events:auto;}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;background:rgba(255,255,255,0.85);backdrop-filter:blur(8px);
  border-radius:20px;font-size:12px;color:#1565c0;font-weight:600;
  box-shadow:0 3px 10px rgba(21,101,192,0.15);border:1px solid rgba(21,101,192,0.1);
}
.badge .ico{font-size:14px;}
.badge .num{color:#e91e63;font-weight:800;}

/* === 主体 === */
.main{
  position:relative;z-index:5;
  display:flex;max-width:1280px;margin:0 auto;padding:14px;gap:14px;
}

/* === 舞台区 === */
.canvas-area{
  flex:1;position:relative;display:flex;align-items:center;justify-content:center;
  min-height:540px;
}
.kite-stage{
  position:relative;width:360px;height:480px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.kite-stage::before,.kite-stage::after{
  content:"";position:absolute;width:18px;height:18px;
  border:2px solid rgba(21,101,192,0.4);border-radius:3px;
}
.kite-stage::before{top:0;left:0;border-right:none;border-bottom:none;}
.kite-stage::after{bottom:0;right:0;border-left:none;border-top:none;}

/* === 风筝主体 === */
.kite-wrap{
  position:relative;width:240px;height:280px;
  transition:transform 0.3s;filter:drop-shadow(0 12px 24px rgba(0,0,0,0.2));
}
.kite-wrap.flying{
  animation:flyUp 2s ease-out forwards,flyFloat 3.5s ease-in-out infinite 2s;
}
@keyframes flyUp{
  from{transform:translateY(0);}
  to{transform:translateY(-30px);}
}
@keyframes flyFloat{
  0%,100%{transform:translateY(-30px) rotate(-6deg);}
  50%{transform:translateY(-55px) rotate(8deg);}
}
.kite-svg{width:100%;height:100%;}

/* === 风筝尾巴 === */
.tail-wrap{
  width:30px;display:flex;flex-direction:column;align-items:center;
  margin-top:-4px;transition:height 0.3s;
}
.tail-seg{
  width:12px;height:18px;margin:2px 0;border-radius:50%;
  animation:tailWave 1.5s ease-in-out infinite;
  box-shadow:1px 2px 4px rgba(0,0,0,0.2),inset 0 1px 2px rgba(255,255,255,0.4);
}
@keyframes tailWave{
  0%,100%{transform:translateX(-8px) rotate(-12deg);}
  50%{transform:translateX(8px) rotate(12deg);}
}

/* === 风筝线 === */
.string{
  position:absolute;top:280px;left:50%;width:2px;height:140px;
  background:linear-gradient(180deg,rgba(60,60,60,0.5),rgba(60,60,60,0.1));
  transform-origin:top;transform:translateX(-50%);
}
.string::after{
  content:"";position:absolute;bottom:0;left:50%;width:10px;height:10px;
  background:radial-gradient(circle,#ef5350,#c62828);
  border-radius:50%;transform:translateX(-50%);
  box-shadow:0 0 8px rgba(239,83,80,0.5);
}

/* === 草地 === */
.grass{
  position:absolute;bottom:0;left:0;right:0;height:60px;
  background:linear-gradient(180deg,transparent,#7cb342 30%,#558b2f 100%);
  border-radius:50% 50% 0 0 / 30px 30px 0 0;
  opacity:0.7;
}

/* === 控制面板 === */
.panel{
  width:340px;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);
  border-radius:18px;padding:18px;
  box-shadow:0 8px 28px rgba(21,101,192,0.15);
  border:1px solid rgba(255,255,255,0.6);
  position:relative;overflow:hidden;
}
.panel::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#e91e63,#ff9800,#4caf50,#2196f3,#9c27b0);
}
.panel-title{
  font-size:18px;color:#1565c0;margin-bottom:14px;padding-bottom:8px;
  border-bottom:2px solid #e3f2fd;display:flex;align-items:center;gap:8px;
  font-weight:800;letter-spacing:1px;
}
.panel-title::before{content:"🎨";font-size:18px;}

.section{margin-bottom:18px;}
.section-label{
  font-size:13px;color:#37474f;font-weight:700;margin-bottom:8px;
  display:flex;align-items:center;gap:6px;
}
.section-label::before{
  content:"";width:3px;height:12px;background:linear-gradient(180deg,#e91e63,#ff9800);
  border-radius:2px;
}

/* === 颜色色板 === */
.color-grid{display:flex;gap:8px;flex-wrap:wrap;}
.color-chip{
  width:36px;height:36px;border-radius:10px;cursor:pointer;
  border:2px solid transparent;transition:all 0.2s;
  box-shadow:0 3px 8px rgba(0,0,0,0.18),inset 0 1px 3px rgba(255,255,255,0.4);
  position:relative;
}
.color-chip:hover{transform:scale(1.15) translateY(-2px);}
.color-chip.active{
  border-color:#1565c0;transform:scale(1.1);
  box-shadow:0 4px 12px rgba(21,101,192,0.4),0 0 0 3px rgba(21,101,192,0.15);
}
.color-chip.active::after{
  content:"✓";position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);color:#fff;font-size:14px;font-weight:800;
  text-shadow:0 1px 2px rgba(0,0,0,0.4);
}

/* === 纹样卡 === */
.pattern-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.pattern-card{
  background:linear-gradient(135deg,#f1f8e9,#e8f5e9);
  border-radius:10px;padding:8px 4px;text-align:center;
  cursor:pointer;transition:all 0.2s;border:2px solid transparent;
  position:relative;overflow:hidden;
}
.pattern-card::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(76,175,80,0.05),rgba(255,255,255,0.4));
  opacity:0;transition:opacity 0.2s;
}
.pattern-card:hover{background:linear-gradient(135deg,#dcedc8,#c8e6c9);transform:translateY(-3px);box-shadow:0 4px 10px rgba(76,175,80,0.2);}
.pattern-card:hover::before{opacity:1;}
.pattern-card.active{
  border-color:#43a047;background:linear-gradient(135deg,#c8e6c9,#a5d6a7);
  box-shadow:0 4px 12px rgba(76,175,80,0.3);
}
.pattern-card svg{width:38px;height:38px;position:relative;z-index:1;}
.pattern-card span{display:block;font-size:11px;color:#33691e;margin-top:2px;font-weight:600;position:relative;z-index:1;}

/* === 滑块 === */
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.slider-row label{font-size:12px;color:#546e7a;width:64px;font-weight:600;}
.slider-row input[type=range]{
  flex:1;-webkit-appearance:none;height:6px;border-radius:3px;
  background:linear-gradient(90deg,#bbdefb,#64b5f6);outline:none;
  box-shadow:inset 0 1px 2px rgba(0,0,0,0.1);
}
.slider-row input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:linear-gradient(135deg,#42a5f5,#1565c0);cursor:pointer;
  box-shadow:0 2px 6px rgba(21,101,192,0.4),inset 0 1px 2px rgba(255,255,255,0.3);
  border:2px solid #fff;
}
.slider-row input[type=range]::-moz-range-thumb{
  width:20px;height:20px;border-radius:50%;
  background:linear-gradient(135deg,#42a5f5,#1565c0);cursor:pointer;
  box-shadow:0 2px 6px rgba(21,101,192,0.4);border:2px solid #fff;
}
.slider-row .val{
  font-size:12px;color:#1565c0;width:30px;text-align:right;font-weight:800;
  background:#e3f2fd;padding:2px 6px;border-radius:8px;
}
.color-pick{
  flex:1;height:32px;border:2px solid #e0e0e0;border-radius:8px;cursor:pointer;
  background:#fff;padding:2px;
}

/* === 放飞按钮 === */
.fly-btn{
  width:100%;padding:14px;font-size:17px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,#42a5f5 0%,#1565c0 50%,#0d47a1 100%);
  border:none;border-radius:12px;cursor:pointer;letter-spacing:6px;
  transition:all 0.3s;
  box-shadow:0 5px 15px rgba(21,101,192,0.4),inset 0 1px 0 rgba(255,255,255,0.3);
  position:relative;overflow:hidden;
}
.fly-btn::before{
  content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent);
  transition:left 0.5s;
}
.fly-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(21,101,192,0.5);}
.fly-btn:hover::before{left:100%;}
.fly-btn:active{transform:translateY(0);}
.fly-btn .ico{display:inline-block;margin-right:6px;}

/* === 评分 === */
.score-box{
  background:linear-gradient(135deg,#fff9c4 0%,#fff59d 50%,#ffe082 100%);
  border-radius:12px;padding:12px;text-align:center;margin-top:12px;
  border:2px solid #ffd54f;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.5);
  position:relative;overflow:hidden;
}
.score-box::before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,#ff9800,transparent);
  animation:shimmer 2s linear infinite;
}
@keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
.score-box .num{font-size:32px;font-weight:900;color:#e65100;
  text-shadow:1px 1px 0 #fff,2px 2px 4px rgba(0,0,0,0.1);
  font-family:Arial,sans-serif;}
.score-box .lbl{font-size:11px;color:#5d4037;font-weight:600;letter-spacing:2px;}

/* === 风向指示 === */
.wind-indicator{
  position:fixed;bottom:20px;left:20px;z-index:10;
  background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);
  padding:10px 16px;border-radius:22px;font-size:12px;color:#0277bd;font-weight:600;
  box-shadow:0 4px 14px rgba(21,101,192,0.15);
  border:1px solid rgba(21,101,192,0.1);
  display:flex;align-items:center;gap:8px;
}
.wind-indicator .ico{font-size:16px;}
.wind-indicator .arrow{display:inline-block;animation:windArrow 1s ease-in-out infinite;color:#42a5f5;}
@keyframes windArrow{0%,100%{transform:translateX(0);}50%{transform:translateX(6px);}}

/* === 飞行统计 === */
.stats-bar{
  position:fixed;bottom:20px;right:20px;z-index:10;
  display:flex;gap:8px;
}
.stat{
  background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);
  padding:8px 14px;border-radius:16px;
  box-shadow:0 3px 10px rgba(21,101,192,0.12);
  border:1px solid rgba(21,101,192,0.08);
  display:flex;align-items:center;gap:6px;
}
.stat .ico{font-size:16px;}
.stat .lbl{font-size:10px;color:#0277bd;font-weight:600;letter-spacing:1px;}
.stat .num{font-size:14px;color:#e91e63;font-weight:800;}

/* === Toast === */
.toast{
  position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);
  background:rgba(21,101,192,0.95);color:#fff;padding:10px 20px;
  border-radius:20px;font-size:13px;font-weight:600;
  box-shadow:0 6px 20px rgba(21,101,192,0.4);
  opacity:0;transition:all 0.3s;z-index:100;pointer-events:none;
  backdrop-filter:blur(8px);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* === 响应式 === */
@media(max-width:900px){
  .main{flex-direction:column;}
  .panel{width:100%;}
  .canvas-area{min-height:480px;}
  .header h1{font-size:28px;letter-spacing:6px;}
  .header h1::before,.header h1::after{display:none;}
  .stats-bar{bottom:10px;right:10px;left:10px;justify-content:center;}
  .wind-indicator{bottom:60px;}
}
</style>
</head>
<body>

<div class="sky">
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="cloud c4"></div>
  <div class="cloud c5"></div>
</div>

<!-- 飘落花瓣 -->
<div class="petal" style="left:10%;animation-duration:14s;animation-delay:0s;">🌸</div>
<div class="petal" style="left:30%;animation-duration:18s;animation-delay:3s;">🌼</div>
<div class="petal" style="left:50%;animation-duration:16s;animation-delay:6s;">🌸</div>
<div class="petal" style="left:70%;animation-duration:20s;animation-delay:2s;">🌼</div>
<div class="petal" style="left:85%;animation-duration:15s;animation-delay:8s;">🌸</div>

<div class="header">
  <div class="header-inner">
    <h1>纸 鸢 坊</h1>
    <p>春风拂柳 · 纸鸢凌云 · AI 智能设计</p>
  </div>
  <div class="badges">
    <div class="badge"><span class="ico">🪁</span><span>纹样库</span><span class="num">6</span></div>
    <div class="badge"><span class="ico">🎨</span><span>底色</span><span class="num">8</span></div>
    <div class="badge"><span class="ico">⭐</span><span>用户评分</span><span class="num">4.9</span></div>
  </div>
</div>

<div class="main">
  <div class="canvas-area">
    <div class="kite-stage">
      <div class="kite-wrap" id="kiteWrap">
        <svg class="kite-svg" viewBox="0 0 200 240" id="kiteSvg">
          <defs>
            <linearGradient id="kiteShade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
              <stop offset="100%" stop-color="rgba(0,0,0,0.18)"/>
            </linearGradient>
            <radialGradient id="kiteHi" cx="0.35" cy="0.3" r="0.5">
              <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
              <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
            </radialGradient>
            <filter id="kiteShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
              <feOffset dx="1" dy="2" result="off"/>
              <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
              <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <!-- 风筝竹骨阴影 -->
          <polygon points="100,10 190,120 100,230 10,120" fill="rgba(0,0,0,0.1)" transform="translate(2,3)"/>
          <!-- 风筝主体 -->
          <polygon points="100,10 190,120 100,230 10,120" id="kiteBody" fill="#ffffff" stroke="#5d4037" stroke-width="2.5" filter="url(#kiteShadow)"/>
          <!-- 风筝高光 -->
          <polygon points="100,10 190,120 100,230 10,120" fill="url(#kiteShade)" pointer-events="none"/>
          <polygon points="100,10 190,120 100,230 10,120" fill="url(#kiteHi)" pointer-events="none"/>
          <!-- 竹骨 -->
          <line x1="100" y1="10" x2="100" y2="230" stroke="#5d4037" stroke-width="2" opacity="0.65"/>
          <line x1="10" y1="120" x2="190" y2="120" stroke="#5d4037" stroke-width="2" opacity="0.65"/>
          <line x1="100" y1="10" x2="10" y2="120" stroke="#8d6e63" stroke-width="1" opacity="0.5"/>
          <line x1="100" y1="10" x2="190" y2="120" stroke="#8d6e63" stroke-width="1" opacity="0.5"/>
          <line x1="10" y1="120" x2="100" y2="230" stroke="#8d6e63" stroke-width="1" opacity="0.5"/>
          <line x1="190" y1="120" x2="100" y2="230" stroke="#8d6e63" stroke-width="1" opacity="0.5"/>
          <!-- 中心装饰 -->
          <circle cx="100" cy="120" r="4" fill="#5d4037"/>
          <g id="patternLayer"></g>
        </svg>
        <div class="tail-wrap" id="tailWrap"></div>
      </div>
      <div class="string" id="string" style="display:none;"></div>
      <div class="grass"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">设计面板</div>

    <div class="section">
      <div class="section-label">底色</div>
      <div class="color-grid" id="colorGrid"></div>
    </div>

    <div class="section">
      <div class="section-label">传统纹样</div>
      <div class="pattern-grid" id="patternGrid"></div>
    </div>

    <div class="section">
      <div class="section-label">尾巴流苏</div>
      <div class="slider-row">
        <label>尾段数</label>
        <input type="range" id="tailLen" min="3" max="18" value="8">
        <span class="val" id="tailLenVal">8</span>
      </div>
      <div class="slider-row">
        <label>流苏色</label>
        <input type="color" id="tailColor" value="#e91e63" class="color-pick">
      </div>
    </div>

    <div class="section">
      <div class="section-label">风力</div>
      <div class="slider-row">
        <label>风力强度</label>
        <input type="range" id="wind" min="1" max="10" value="5">
        <span class="val" id="windVal">5</span>
      </div>
    </div>

    <button class="fly-btn" id="flyBtn"><span class="ico">🪁</span>放 飞</button>

    <div class="score-box">
      <div class="num" id="score">60</div>
      <div class="lbl">放飞评分 · 工艺指数</div>
    </div>
  </div>
</div>

<div class="wind-indicator">
  <span class="ico">🌬️</span>
  <span>东南风</span>
  <span class="arrow">~~~&gt;</span>
  <span id="windText">和风</span>
</div>

<div class="stats-bar">
  <div class="stat"><span class="ico">📏</span><div><div class="lbl">线长</div><div class="num" id="lineLen">12m</div></div></div>
  <div class="stat"><span class="ico">📐</span><div><div class="lbl">张角</div><div class="num" id="angleVal">45°</div></div></div>
  <div class="stat"><span class="ico">📊</span><div><div class="lbl">状态</div><div class="num" id="statusText">待飞</div></div></div>
</div>

<div class="toast" id="toast"></div>

<script>
var colors=[
  {n:"雪白",v:"#ffffff"},{n:"朱砂",v:"#e53935"},{n:"藤黄",v:"#fdd835"},
  {n:"靛青",v:"#1e88e5"},{n:"翠绿",v:"#43a047"},{n:"品紫",v:"#8e24aa"},
  {n:"黛粉",v:"#ec407a"},{n:"天蓝",v:"#29b6f6"}
];
var patterns=[
  {n:"沙燕",draw:drawSwallow,desc:"报春"},
  {n:"蝴蝶",draw:drawButterfly,desc:"福气"},
  {n:"金鱼",draw:drawFish,desc:"年年有余"},
  {n:"八卦",draw:drawBagua,desc:"阴阳调和"},
  {n:"蜈蚣",draw:drawCentipede,desc:"百足"},
  {n:"牡丹",draw:drawPeony,desc:"富贵"}
];
var curColor="#ffffff",curPattern=null,curTailColor="#e91e63",isFlying=false;

function showToast(msg,icon){
  var t=document.getElementById("toast");
  t.innerHTML='<span style="margin-right:6px;">'+(icon||'✨')+'</span>'+msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer=setTimeout(function(){t.classList.remove("show");},1800);
}

function initColors(){
  var g=document.getElementById("colorGrid");
  colors.forEach(function(c,i){
    var d=document.createElement("div");
    d.className="color-chip"+(i===0?" active":"");
    d.style.background=c.v;
    d.title=c.n;
    d.onclick=function(){
      document.querySelectorAll(".color-chip").forEach(function(x){x.classList.remove("active");});
      d.classList.add("active");
      curColor=c.v;
      applyColor();
      updateScore();
      showToast("已选「"+c.n+"」底色","🎨");
    };
    g.appendChild(d);
  });
}
function applyColor(){
  document.getElementById("kiteBody").setAttribute("fill",curColor);
}

function initPatterns(){
  var g=document.getElementById("patternGrid");
  patterns.forEach(function(p,i){
    var card=document.createElement("div");
    card.className="pattern-card";
    var svg='<svg viewBox="0 0 40 40">'+
      '<defs><radialGradient id="pg'+i+'" cx="0.35" cy="0.35" r="0.6">'+
      '<stop offset="0%" stop-color="#a5d6a7"/><stop offset="100%" stop-color="#66bb6a"/>'+
      '</radialGradient></defs>'+
      '<circle cx="20" cy="20" r="17" fill="url(#pg'+i+')" stroke="#388e3c" stroke-width="1.5"/>'+
      '<text x="20" y="26" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold" style="text-shadow:0 1px 1px rgba(0,0,0,0.3)">'+p.n[0]+'</text>'+
      '</svg>';
    card.innerHTML=svg+"<span>"+p.n+"</span>";
    card.title=p.n+" · "+p.desc;
    card.onclick=function(){
      document.querySelectorAll(".pattern-card").forEach(function(x){x.classList.remove("active");});
      card.classList.add("active");
      curPattern=p;
      p.draw();
      updateScore();
      showToast("已贴「"+p.n+"」纹样 · "+p.desc,"🪁");
    };
    g.appendChild(card);
  });
}
function clearPattern(){document.getElementById("patternLayer").innerHTML="";}

function drawSwallow(){
  clearPattern();
  var g=document.getElementById("patternLayer");
  g.innerHTML=
    '<path d="M100,60 Q70,80 60,110 Q75,95 100,100 Q125,95 140,110 Q130,80 100,60Z" fill="#1e88e5" opacity="0.88"/>'+
    '<path d="M100,100 L80,140 L100,130 L120,140 Z" fill="#0d47a1" opacity="0.85"/>'+
    '<circle cx="85" cy="75" r="5" fill="#fff"/><circle cx="115" cy="75" r="5" fill="#fff"/>'+
    '<circle cx="85" cy="75" r="2.5" fill="#000"/><circle cx="115" cy="75" r="2.5" fill="#000"/>'+
    '<circle cx="86" cy="74" r="1" fill="#fff"/><circle cx="116" cy="74" r="1" fill="#fff"/>'+
    '<path d="M100,60 L93,48 L100,55 L107,48Z" fill="#e53935"/>'+
    '<path d="M100,48 L100,40" stroke="#5d4037" stroke-width="1"/>'+
    '<circle cx="100" cy="38" r="2" fill="#5d4037"/>';
}
function drawButterfly(){
  clearPattern();
  var g=document.getElementById("patternLayer");
  g.innerHTML=
    '<ellipse cx="65" cy="95" rx="30" ry="22" fill="#e91e63" opacity="0.82" transform="rotate(-20 65 95)"/>'+
    '<ellipse cx="135" cy="95" rx="30" ry="22" fill="#e91e63" opacity="0.82" transform="rotate(20 135 95)"/>'+
    '<ellipse cx="70" cy="140" rx="22" ry="18" fill="#ab47bc" opacity="0.78" transform="rotate(-15 70 140)"/>'+
    '<ellipse cx="130" cy="140" rx="22" ry="18" fill="#ab47bc" opacity="0.78" transform="rotate(15 130 140)"/>'+
    '<ellipse cx="65" cy="95" rx="10" ry="8" fill="#fff8e1" opacity="0.7" transform="rotate(-20 65 95)"/>'+
    '<ellipse cx="135" cy="95" rx="10" ry="8" fill="#fff8e1" opacity="0.7" transform="rotate(20 135 95)"/>'+
    '<circle cx="58" cy="90" r="3" fill="#fff" opacity="0.9"/>'+
    '<circle cx="142" cy="90" r="3" fill="#fff" opacity="0.9"/>'+
    '<rect x="96" y="80" width="8" height="70" rx="4" fill="#3e2723"/>'+
    '<rect x="97" y="85" width="2" height="60" fill="#5d4037" opacity="0.5"/>'+
    '<circle cx="100" cy="78" r="6" fill="#3e2723"/>'+
    '<path d="M100,72 Q90,60 85,55 M100,72 Q110,60 115,55" stroke="#3e2723" stroke-width="1.5" fill="none"/>'+
    '<circle cx="85" cy="55" r="1.5" fill="#3e2723"/>'+
    '<circle cx="115" cy="55" r="1.5" fill="#3e2723"/>';
}
function drawFish(){
  clearPattern();
  var g=document.getElementById("patternLayer");
  g.innerHTML=
    '<path d="M55,120 Q75,85 120,90 Q150,95 160,120 Q150,145 120,150 Q75,155 55,120Z" fill="#ff6f00" opacity="0.88"/>'+
    '<path d="M55,120 Q75,90 120,95 Q150,100 160,120 Q150,140 120,145 Q75,150 55,120Z" fill="url(#kiteHi)" opacity="0.3"/>'+
    '<path d="M160,120 L185,100 L180,120 L185,140Z" fill="#e65100" opacity="0.88"/>'+
    '<path d="M160,120 L175,108 L172,120 L175,132Z" fill="#bf360c" opacity="0.6"/>'+
    '<circle cx="80" cy="110" r="9" fill="#fff"/><circle cx="80" cy="110" r="5" fill="#000"/>'+
    '<circle cx="82" cy="108" r="1.5" fill="#fff"/>'+
    '<path d="M100,100 Q108,120 100,140" stroke="#e65100" stroke-width="3" fill="none" opacity="0.65"/>'+
    '<path d="M120,95 Q128,120 120,145" stroke="#e65100" stroke-width="3" fill="none" opacity="0.65"/>'+
    '<path d="M135,100 Q140,120 135,140" stroke="#e65100" stroke-width="2.5" fill="none" opacity="0.55"/>'+
    '<ellipse cx="95" cy="125" rx="28" ry="9" fill="#fff8e1" opacity="0.45"/>';
}
function drawBagua(){
  clearPattern();
  var g=document.getElementById("patternLayer");
  g.innerHTML=
    '<circle cx="100" cy="120" r="52" fill="none" stroke="#3e2723" stroke-width="2.5"/>'+
    '<circle cx="100" cy="120" r="52" fill="none" stroke="#5d4037" stroke-width="0.8" opacity="0.5"/>'+
    '<path d="M100,70 A25,25 0 0,1 100,120 A25,25 0 0,0 100,170 A50,50 0 0,1 100,70Z" fill="#3e2723"/>'+
    '<circle cx="100" cy="95" r="9" fill="#fff8e1" stroke="#3e2723" stroke-width="1.5"/>'+
    '<circle cx="100" cy="95" r="3" fill="#3e2723"/>'+
    '<circle cx="100" cy="145" r="9" fill="#3e2723" stroke="#3e2723" stroke-width="1.5"/>'+
    '<circle cx="100" cy="145" r="3" fill="#fff8e1"/>'+
    '<rect x="93" y="64" width="14" height="9" fill="#3e2723" rx="1"/>'+
    '<rect x="93" y="65" width="14" height="2" fill="#5d4037"/>'+
    '<rect x="93" y="69" width="14" height="2" fill="#5d4037"/>'+
    '<rect x="93" y="166" width="14" height="9" fill="#fff8e1" stroke="#3e2723" stroke-width="0.8" rx="1"/>'+
    '<g stroke="#3e2723" stroke-width="2.2" stroke-linecap="round">'+
    '<line x1="38" y1="58" x2="48" y2="53"/><line x1="33" y1="73" x2="43" y2="68"/>'+
    '<line x1="162" y1="58" x2="152" y2="53"/><line x1="167" y1="73" x2="157" y2="68"/>'+
    '<line x1="38" y1="182" x2="48" y2="187"/><line x1="33" y1="167" x2="43" y2="172"/>'+
    '<line x1="162" y1="182" x2="152" y2="187"/><line x1="167" y1="167" x2="157" y2="172"/>'+
    '</g>';
}
function drawCentipede(){
  clearPattern();
  var g=document.getElementById("patternLayer");
  var s='<circle cx="100" cy="120" r="24" fill="#d84315" opacity="0.9"/>';
  s+='<circle cx="100" cy="120" r="24" fill="url(#kiteHi)" opacity="0.3"/>';
  s+='<circle cx="95" cy="115" r="6" fill="#fff"/><circle cx="95" cy="115" r="3.5" fill="#000"/>';
  s+='<circle cx="96" cy="114" r="1" fill="#fff"/>';
  s+='<path d="M105,115 Q115,113 122,118" stroke="#3e2723" stroke-width="1.5" fill="none"/>';
  for(var i=0;i<9;i++){
    var y=146+i*9;
    var r=20-i*1.4;
    s+='<circle cx="100" cy="'+y+'" r="'+r+'" fill="#bf360c" opacity="0.85"/>';
    s+='<circle cx="100" cy="'+y+'" r="'+(r*0.7)+'" fill="#d84315" opacity="0.4"/>';
    s+='<line x1="'+(100-r)+'" y1="'+y+'" x2="'+(100-r-9)+'" y2="'+(y+5)+'" stroke="#3e2723" stroke-width="2.2" stroke-linecap="round"/>';
    s+='<line x1="'+(100+r)+'" y1="'+y+'" x2="'+(100+r+9)+'" y2="'+(y+5)+'" stroke="#3e2723" stroke-width="2.2" stroke-linecap="round"/>';
    s+='<line x1="'+(100-r)+'" y1="'+(y+3)+'" x2="'+(100-r-7)+'" y2="'+(y+9)+'" stroke="#3e2723" stroke-width="1.5"/>';
    s+='<line x1="'+(100+r)+'" y1="'+(y+3)+'" x2="'+(100+r+7)+'" y2="'+(y+9)+'" stroke="#3e2723" stroke-width="1.5"/>';
  }
  s+='<path d="M93,144 L100,138 L107,144 L100,150Z" fill="#3e2723"/>';
  g.innerHTML=s;
}
function drawPeony(){
  clearPattern();
  var g=document.getElementById("patternLayer");
  var s='';
  for(var i=0;i<8;i++){
    var a=i*Math.PI/4;
    var x=100+Math.cos(a)*28;
    var y=120+Math.sin(a)*28;
    s+='<ellipse cx="'+x+'" cy="'+y+'" rx="24" ry="18" fill="#e91e63" opacity="0.7" transform="rotate('+i*45+' '+x+' '+y+')"/>';
  }
  for(var i=0;i<8;i++){
    var a=i*Math.PI/4+0.4;
    var x=100+Math.cos(a)*16;
    var y=120+Math.sin(a)*16;
    s+='<ellipse cx="'+x+'" cy="'+y+'" rx="16" ry="12" fill="#f06292" opacity="0.85" transform="rotate('+i*45+' '+x+' '+y+')"/>';
  }
  s+='<circle cx="100" cy="120" r="11" fill="#fdd835"/>';
  s+='<circle cx="100" cy="120" r="11" fill="url(#kiteHi)" opacity="0.4"/>';
  s+='<circle cx="100" cy="120" r="6" fill="#e65100"/>';
  g.innerHTML=s;
}

function updateTail(){
  var len=parseInt(document.getElementById("tailLen").value);
  var wrap=document.getElementById("tailWrap");
  wrap.innerHTML="";
  for(var i=0;i<len;i++){
    var seg=document.createElement("div");
    seg.className="tail-seg";
    seg.style.background="linear-gradient(135deg,"+curTailColor+","+shadeColor(curTailColor,-20)+")";
    seg.style.animationDelay=(i*0.08)+"s";
    wrap.appendChild(seg);
  }
  document.getElementById("tailLenVal").textContent=len;
}
function shadeColor(hex,percent){
  var num=parseInt(hex.replace("#",""),16);
  var r=Math.min(255,Math.max(0,(num>>16)+percent));
  var g=Math.min(255,Math.max(0,((num>>8)&0x00FF)+percent));
  var b=Math.min(255,Math.max(0,(num&0x0000FF)+percent));
  return "#"+(r<<16|g<<8|b).toString(16).padStart(6,"0");
}
function updateScore(){
  var s=60;
  if(curPattern)s+=15;
  if(curColor!=="#ffffff")s+=8;
  var len=parseInt(document.getElementById("tailLen").value);
  s+=Math.min(len,12);
  s=Math.min(s,99);
  document.getElementById("score").textContent=s;
}

document.getElementById("tailLen").addEventListener("input",function(){
  updateTail();updateScore();
});
document.getElementById("tailColor").addEventListener("input",function(e){
  curTailColor=e.target.value;updateTail();
});
document.getElementById("wind").addEventListener("input",function(e){
  var v=parseInt(e.target.value);
  document.getElementById("windVal").textContent=v;
  var labels=["无风","微风","和风","轻风","清风","强风","大风","烈风","狂风","暴风"];
  document.getElementById("windText").textContent=labels[v-1];
  document.getElementById("lineLen").textContent=(8+v*2)+"m";
  document.getElementById("angleVal").textContent=(30+v*5)+"°";
  var wrap=document.getElementById("kiteWrap");
  if(wrap.classList.contains("flying")){
    wrap.style.animationDuration=(3.5-v*0.2)+"s";
  }
});

document.getElementById("flyBtn").addEventListener("click",function(){
  var wrap=document.getElementById("kiteWrap");
  var str=document.getElementById("string");
  if(isFlying){
    wrap.classList.remove("flying");
    wrap.style.transform="translateY(0)";
    str.style.display="none";
    this.innerHTML='<span class="ico">🪁</span>放 飞';
    document.getElementById("statusText").textContent="待飞";
    document.getElementById("statusText").style.color="#0277bd";
    showToast("风筝已收回","🏠");
    isFlying=false;
  }else{
    wrap.classList.add("flying");
    str.style.display="block";
    str.style.animation="stringWave 2s ease-in-out infinite";
    this.innerHTML='<span class="ico">🪁</span>收 回';
    document.getElementById("statusText").textContent="飞翔中";
    document.getElementById("statusText").style.color="#43a047";
    showToast("风筝起飞 · 迎风而上","🪁");
    isFlying=true;
  }
});

var styleSheet=document.createElement("style");
styleSheet.textContent="@keyframes stringWave{0%,100%{transform:translateX(-50%) skewX(-2deg);}50%{transform:translateX(-50%) skewX(2deg);}}";
document.head.appendChild(styleSheet);

initColors();
initPatterns();
updateTail();
applyColor();
</script>
</body>
</html>
