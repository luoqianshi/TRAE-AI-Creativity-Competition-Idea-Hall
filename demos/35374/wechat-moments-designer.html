    /* Layout: Honeycomb - 蜂巢 */
    .layout-honey-7 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
      aspect-ratio: 4/3;
    }
    .layout-honey-7 .img-placeholder {
      min-height: 55px;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }
    .layout-honey-7 .img-placeholder:nth-child(1) { grid-column: 2; grid-row: 1; transform: scale(1.1); z-index: 1; }
    .layout-honey-7 .img-placeholder:nth-child(2) { grid-column: 1; grid-row: 1; }
    .layout-honey-7 .img-placeholder:nth-child(3) { grid-column: 3; grid-row: 1; }
    .layout-honey-7 .img-placeholder:nth-child(4) { grid-column: 1; grid-row: 2; }
    .layout-honey-7 .img-placeholder:nth-child(5) { grid-column: 3; grid-row: 2; }
    .layout-honey-7 .img-placeholder:nth-child(6) { grid-column: 2; grid-row: 2; }
    .layout-honey-7 .img-placeholder:nth-child(7) { grid-column: 2; grid-row: 3; }

    /* Layout: Cross - 十字形 */
    .layout-cross-5 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 3px;
      aspect-ratio: 1;
    }
    .layout-cross-5 .img-placeholder {
      min-height: 60px;
      border-radius: 4px;
    }
    .layout-cross-5 .img-placeholder:nth-child(1) { grid-column: 2; grid-row: 1; }
    .layout-cross-5 .img-placeholder:nth-child(2) { grid-column: 1; grid-row: 2; }
    .layout-cross-5 .img-placeholder:nth-child(3) { grid-column: 2; grid-row: 2; transform: scale(1.15); z-index: 1; border: 2px solid var(--accent); }
    .layout-cross-5 .img-placeholder:nth-child(4) { grid-column: 3; grid-row: 2; }
    .layout-cross-5 .img-placeholder:nth-child(5) { grid-column: 2; grid-row: 3; }

    /* Layout: Frame - 相框式 */
    .layout-frame-4 {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      grid-template-rows: 1fr 2fr 1fr;
      gap: 3px;
      aspect-ratio: 1;
      background: #2c1810;
      padding: 8px;
      border-radius: 4px;
    }
    .layout-frame-4 .img-placeholder {
      min-height: 50px;
      border-radius: 2px;
    }
    .layout-frame-4 .img-placeholder:nth-child(1) { grid-column: 1; grid-row: 1; }
    .layout-frame-4 .img-placeholder:nth-child(2) { grid-column: 3; grid-row: 1; }
    .layout-frame-4 .img-placeholder:nth-child(3) { grid-column: 1; grid-row: 3; }
    .layout-frame-4 .img-placeholder:nth-child(4) { grid-column: 3; grid-row: 3; }
    .layout-frame-4::before {
      content: '主体';
      grid-column: 2;
      grid-row: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
      border-radius: 2px;
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 600;
      border: 2px dashed var(--accent);
    }

    /* Layout: T-Shape - T字形 */
    .layout-tshape-4 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: 2fr 1fr;
      gap: 3px;
    }
    .layout-tshape-4 .img-placeholder:nth-child(1) { grid-column: span 3; min-height: 130px; }
    .layout-tshape-4 .img-placeholder:not(:nth-child(1)) { min-height: 80px; }

    /* Layout: V-Shape - V字形 */
    .layout-vshape-5 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 3px;
      aspect-ratio: 4/3;
    }
    .layout-vshape-5 .img-placeholder {
      min-height: 55px;
      border-radius: 4px;
    }
    .layout-vshape-5 .img-placeholder:nth-child(1) { grid-column: 1 / span 2; grid-row: 1; }
    .layout-vshape-5 .img-placeholder:nth-child(2) { grid-column: 3 / span 2; grid-row: 1; }
    .layout-vshape-5 .img-placeholder:nth-child(3) { grid-column: 2; grid-row: 2; }
    .layout-vshape-5 .img-placeholder:nth-child(4) { grid-column: 3; grid-row: 2; }
    .layout-vshape-5 .img-placeholder:nth-child(5) { grid-column: 2 / span 2; grid-row: 3; }

    /* Layout: Diamond - 菱形 */
    .layout-diamond-5 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 3px;
      aspect-ratio: 1;
    }
    .layout-diamond-5 .img-placeholder {
      min-height: 60px;
      border-radius: 4px;
    }
    .layout-diamond-5 .img-placeholder:nth-child(1) { grid-column: 2; grid-row: 1; }
    .layout-diamond-5 .img-placeholder:nth-child(2) { grid-column: 1; grid-row: 2; }
    .layout-diamond-5 .img-placeholder:nth-child(3) { grid-column: 2; grid-row: 2; transform: scale(1.2); z-index: 1; border: 2px solid var(--accent); }
    .layout-diamond-5 .img-placeholder:nth-child(4) { grid-column: 3; grid-row: 2; }
    .layout-diamond-5 .img-placeholder:nth-child(5) { grid-column: 2; grid-row: 3; }

    /* Layout: Arc - 弧形排列 */
    .layout-arc-4 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 3px;
      aspect-ratio: 5/3;
    }
    .layout-arc-4 .img-placeholder {
      min-height: 50px;
      border-radius: 50%;
    }
    .layout-arc-4 .img-placeholder:nth-child(1) { grid-column: 1; grid-row: 3; }
    .layout-arc-4 .img-placeholder:nth-child(2) { grid-column: 2; grid-row: 2; }
    .layout-arc-4 .img-placeholder:nth-child(3) { grid-column: 3; grid-row: 1; transform: scale(1.3); z-index: 1; border: 2px solid var(--accent); }
    .layout-arc-4 .img-placeholder:nth-child(4) { grid-column: 4; grid-row: 2; }

    /* Layout: Waterfall Masonry - 真瀑布流 */
    .layout-masonry-5 {
      column-count: 2;
      column-gap: 4px;
    }
    .layout-masonry-5 .img-placeholder {
      break-inside: avoid;
      margin-bottom: 4px;

      border-radius: 4px;

    .layout-masonry-5 .img-placeholder:nth-child(3) { min-height: 110px; }
    .layout-masonry-5 .img-placeholder:nth-child(5) { min-height: 100px; }

    /* Layout: Perspective - 透视效果 */
    .layout-perspective-3 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 3px;
      perspective: 600px;
    }
    .layout-perspective-3 .img-placeholder {
      min-height: 110px;
      transition: transform 0.3s;
    }
    .layout-perspective-3 .img-placeholder:nth-child(1) {
      grid-column: 1 / -1;
      grid-row: 1 / -1;
      transform: rotateY(-5deg) rotateX(3deg);

    .layout-perspective-3 .img-placeholder:nth-child(2) {
      grid-column: 2;
      grid-row: 1;
      transform: rotateY(15deg) translateZ(30px);
      border: 2px solid white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    .layout-perspective-3 .img-placeholder:nth-child(3) {
      grid-column: 1;
      grid-row: 2;
      transform: rotateY(-15deg) translateZ(30px);
      border: 2px solid white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    /* Layout: Tape - 胶带拼贴 */
    .layout-tape-4 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: #f5f5f0;
      padding: 16px;
      position: relative;
    }
    .layout-tape-4 .img-placeholder {
      min-height: 120px;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      position: relative;
    }
    .layout-tape-4 .img-placeholder::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      width: 40px;
      height: 16px;
      background: rgba(255, 220, 100, 0.7);
      z-index: 2;
    }
    .layout-tape-4 .img-placeholder:nth-child(1) { transform: rotate(-2deg); }
    .layout-tape-4 .img-placeholder:nth-child(2) { transform: rotate(1.5deg); }
    .layout-tape-4 .img-placeholder:nth-child(3) { transform: rotate(2deg); }
    .layout-tape-4 .img-placeholder:nth-child(4) { transform: rotate(-1deg); }

    /* Layout: Broken Grid - 破碎网格 */
    .layout-broken-5 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 3px;
      aspect-ratio: 1;

    .layout-broken-5 .img-placeholder:nth-child(3) { grid-column: 3; grid-row: 2; }
    .layout-broken-5 .img-placeholder:nth-child(4) { grid-column: 1; grid-row: 3; }
    .layout-broken-5 .img-placeholder:nth-child(5) { grid-column: 2 / span 2; grid-row: 3; }

    /* === Action bar === */
    .moment-actions {
      display: flex;
      justify-content: flex-end;
      padding-top: 0.5rem;
      border-top: 1px solid var(--rule);
    }
    .like-btn {
      color: #576b95;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    /* === Copy button === */
    .copy-bar {
      display: flex;
      justify-content: center;
      margin-top: 1rem;
      gap: 0.75rem;
    }
    .copy-btn {
      background: var(--accent);

    .copy-btn.secondary {

    /* === Toast === */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--ink);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 2rem;
      font-size: 0.9rem;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* === Layout info === */
    .layout-info {
      text-align: center;
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .layout-info strong {
      color: var(--accent);
    }

    /* === Responsive === */
    @media (max-width: 640px) {
      header.app-header h1 { font-size: 1.5rem; }
      .phone-mockup { max-width: 100%; }
      .layout-selector {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>

          romantic: ['想和你一起度过每一个低谷 💕', '最好的爱情，是彼此的情绪港湾 🏠', '你是我难过时最想见的人 🌙', '愿有人懂你的言外之意，更懂你的欲言又止 🤫', '和你一起，阴天也是晴天 ☀️', '你是我情绪崩溃时的最后一道防线 🛡️', '有你在，我什么都不怕 🦁'],
          motivational: ['低谷只是暂时的，高峰就在前方 🏔️', '允许自己难过，但不允许自己放弃 💪', '今天的眼泪，是明天笑容的铺垫 😊', '你比你想象的更坚强 🦁', '纵有疾风起，人生不言弃 🌪️', '每一个低谷，都是为了更高的飞跃 🦅', '相信自己，你值得更好的 🌟']
        }
      };

      let currentCount = 1;
      let currentScene = 'daily';
      let currentStyle = 'fresh';
      let currentLayout = null;
      let currentCaptionIndex = 0;

      function getLayoutsForCount(count) {
        return layouts[count] || layouts[1];
      }

      function renderLayoutSelector() {
        const selector = document.getElementById('layoutSelector');
        selector.innerHTML = '';
        const available = getLayoutsForCount(currentCount);
        available.forEach((layout, index) => {
          const div = document.createElement('div');
          div.className = 'layout-option' + (index === 0 ? ' active' : '');
          div.dataset.layoutId = layout.id;

          // Build mini icon grid
          let iconHtml = '<div class="layout-icon">';
          const grid = layout.icon;
          const maxCols = Math.max(...grid.map(r => r.length));
          const maxRows = grid.length;
          for (let r = 0; r < maxRows; r++) {
            for (let c = 0; c < maxCols; c++) {
              const val = grid[r] && grid[r][c];
              if (val === 0) {
                iconHtml += '<div class="mini-cell" style="visibility:hidden"></div>';
              } else {
                const isMain = val === 1;
                iconHtml += '<div class="mini-cell' + (isMain ? ' main' : '') + '"></div>';
              }
            }
          }
          iconHtml += '</div>';

          div.innerHTML = iconHtml + '<div class="layout-name">' + layout.name + '</div>';
          div.addEventListener('click', function() {
            selector.querySelectorAll('.layout-option').forEach(o => o.classList.remove('active'));
            div.classList.add('active');
            currentLayout = layout;
            updatePreview();
          });
          selector.appendChild(div);
        });
        currentLayout = available[0];
      }

      function updatePreview() {
        const grid = document.getElementById('imageGrid');
        grid.className = 'image-grid ' + currentLayout.class;
        grid.innerHTML = '';

        for (let i = 1; i <= currentCount; i++) {
          const div = document.createElement('div');
          div.className = 'img-placeholder';
          // Mark first image as main for certain layouts
          if (i === 1 && currentLayout.class.includes('hero') || currentLayout.class.includes('mosaic') || currentLayout.class.includes('collage')) {
            div.classList.add('main-img');
          }
          div.innerHTML = '<span>' + (i === 1 && currentLayout.class.includes('hero') ? '主体' : '图片 ' + i) + '</span>';
          grid.appendChild(div);
        }

        const textOptions = captions[currentScene][currentStyle];
        currentCaptionIndex = Math.floor(Math.random() * textOptions.length);
        document.getElementById('momentText').textContent = textOptions[currentCaptionIndex];

        document.getElementById('layoutInfo').innerHTML =
          '当前排版：<strong>' + currentLayout.name + '</strong> - ' + currentLayout.desc;
      }

      function refreshCaption() {
        const textOptions = captions[currentScene][currentStyle];
        let newIndex;
        do {
          newIndex = Math.floor(Math.random() * textOptions.length);
        } while (newIndex === currentCaptionIndex && textOptions.length > 1);
        currentCaptionIndex = newIndex;
        document.getElementById('momentText').textContent = textOptions[currentCaptionIndex];
      }

      function setActive(groupId, dataAttr, value) {
        const group = document.getElementById(groupId);
        group.querySelectorAll('button').forEach(btn => {
          btn.classList.toggle('active', btn.dataset[dataAttr] == value);
        });
      }

      document.getElementById('imageCountGroup').addEventListener('click', function(e) {
        if (e.target.tagName === 'BUTTON') {
          currentCount = parseInt(e.target.dataset.count);
          setActive('imageCountGroup', 'count', currentCount);
          renderLayoutSelector();
          updatePreview();
        }
      });

      document.getElementById('sceneGroup').addEventListener('click', function(e) {
        if (e.target.tagName === 'BUTTON') {
          currentScene = e.target.dataset.scene;
          setActive('sceneGroup', 'scene', currentScene);
          refreshCaption();
        }
      });

      document.getElementById('styleGroup').addEventListener('click', function(e) {
        if (e.target.tagName === 'BUTTON') {
          currentStyle = e.target.dataset.style;
          setActive('styleGroup', 'style', currentStyle);
          refreshCaption();
        }
      });

      document.getElementById('copyBtn').addEventListener('click', function() {
        const text = document.getElementById('momentText').textContent;
        navigator.clipboard.writeText(text).then(function() {
          const toast = document.getElementById('toast');
          toast.classList.add('show');
          setTimeout(function() { toast.classList.remove('show'); }, 2000);
        });
      });

      document.getElementById('refreshBtn').addEventListener('click', function() {
        refreshCaption();
      });

      // Initialize
      renderLayoutSelector();
      updatePreview();
    })();
  </script>
</body>
</html>
