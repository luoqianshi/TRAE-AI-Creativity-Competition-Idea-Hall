        '哦': '哦',
        '嗯': '嗯',
        '那个女': '那个女的是谁', '她是谁': '那个女的是谁', '那个女生': '那个女的是谁',
        '决定': '你决定吧',
        '说得对': '你说得对',
        '没办法': '你要是这么想我也没办法', '这么想': '你要是这么想我也没办法',
        '行吧': '行吧，都行', '都行': '行吧，都行',
        '随便你': '随便你', '随你': '随便你',
        '真的没事': '没事，真的没事'
      };
      var matchedKeywords = [];
      for (var kw in keywordMap) {
        if (input.indexOf(kw) !== -1) {
          matchedKeywords.push({ kw: kw, key: keywordMap[kw], len: kw.length });
        }
      }
      if (matchedKeywords.length > 0) {
        matchedKeywords.sort(function(a, b) { return b.len - a.len; });
        return translations[matchedKeywords[0].key];
      }

      // Default
      return {
        original: input,
        meaning: '这句话暂时没有被收录到翻译数据库中。但根据经验，如果她说完这句话后沉默了、语气变冷了、或者开始回消息变慢了，那大概率是有什么不对劲了。建议主动关心，温柔询问。',
        danger: 'warning',
        emoji: '\u2753',
        title: '未知含义',
        subtitle: '需要根据语境判断',
        emotions: ['不确定', '需要观察'],
        suggestion: '注意她的语气、表情和后续行为。如果她突然变安静或冷淡，很可能是在等你主动关心。',
        tips: ['观察她的表情和语气', '注意回复速度是否变慢', '主动关心"怎么了？"', '给她一个拥抱']
      };
    }

    // === History ===
    function addHistory(input, result) {
      // Avoid duplicates
      translateHistory = translateHistory.filter(function(h) { return h.input !== input; });
      translateHistory.unshift({ input: input, emoji: result.emoji, danger: result.danger, title: result.title });
      if (translateHistory.length > 20) translateHistory.pop();
      renderHistory();
    }

    function renderHistory() {
      var section = document.getElementById('historySection');
      var list = document.getElementById('historyList');
      var count = document.getElementById('historyCount');

      if (translateHistory.length === 0) {
        section.style.display = 'none';
        return;
      }
      section.style.display = 'block';
      count.textContent = '(' + translateHistory.length + ')';

      list.innerHTML = '';
      translateHistory.forEach(function(item) {
        var div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML =
          '<span class="h-emoji">' + item.emoji + '</span>' +
          '<span class="h-text">' + item.input + '</span>' +
          '<span class="h-level level ' + item.danger + '">' + item.title + '</span>';
        div.addEventListener('click', function() {
          document.getElementById('inputText').value = item.input;
          onInputChange();
          translate();
        });
        list.appendChild(div);
      });
    }

    function toggleHistory() {
      document.getElementById('historyList').classList.toggle('show');
    }

    function showResult(result) {
      var card = document.getElementById('resultCard');
      var meter = document.getElementById('dangerMeter');
      meter.textContent = result.emoji;
      meter.className = 'danger-meter ' + result.danger;

      document.getElementById('resultTitle').textContent = result.title;
      document.getElementById('resultSubtitle').textContent = result.subtitle;
      document.getElementById('resultMeaning').textContent = result.meaning;
      document.getElementById('resultSuggestion').textContent = result.suggestion;

      var tagsEl = document.getElementById('emotionTags');
      tagsEl.innerHTML = '';
      result.emotions.forEach(function(e) {
        var tag = document.createElement('span');
        tag.className = 'emotion-tag';
        tag.textContent = e;
        tagsEl.appendChild(tag);
      });

      var tipsEl = document.getElementById('actionTips');
      tipsEl.innerHTML = '';
      result.tips.forEach(function(tip, i) {
        var div = document.createElement('div');
        div.className = 'action-tip';
        div.innerHTML = '<span class="num">' + (i + 1) + '</span><span>' + tip + '</span>';
        tipsEl.appendChild(div);
      });

      card.classList.add('show');
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // === Dictionary ===
    function renderDict(filter) {
      var list = document.getElementById('dictList');
      list.innerHTML = '';
      var filtered = filter
        ? dictionary.filter(function(d) { return d.original.indexOf(filter) !== -1 || d.meaning.indexOf(filter) !== -1; })
        : dictionary;

      filtered.forEach(function(item) {
        var card = document.createElement('div');
        card.className = 'dict-card';
        card.innerHTML =
          '<div class="dict-original">' +
            '<span class="level ' + item.level + '">' + getLevelText(item.level) + '</span>' +
            item.original +
          '</div>' +
          '<div class="dict-meaning">' + item.meaning + '</div>' +
          '<div class="dict-example">' + item.example.replace(/\n/g, '<br>') + '</div>';
        card.addEventListener('click', function() {
          card.classList.toggle('expanded');
          if (!stats.dictExpanded.has(item.original)) {
            stats.dictExpanded.add(item.original);
            updateStats();
          }
        });
        list.appendChild(card);
      });
    }

    function filterDict() {
      var val = document.getElementById('dictSearch').value.trim();
      renderDict(val);
    }

    function getLevelText(level) {
      var map = { safe: '安全', warning: '注意', danger: '危险', critical: '极度危险' };
      return map[level] || level;
    }

    // === Quiz ===
    function loadQuestion() {
      if (currentQuiz >= quizData.length) {
        showQuizResult();
        return;
      }
      var q = quizData[currentQuiz];
      document.getElementById('quizQuestion').textContent = '"' + q.q + '"';
      document.getElementById('quizIndex').textContent = (currentQuiz + 1) + '/' + quizData.length;
      document.getElementById('quizProgress').style.width = ((currentQuiz) / quizData.length * 100) + '%';

      var optionsEl = document.getElementById('quizOptions');
      optionsEl.innerHTML = '';
      q.options.forEach(function(opt, i) {
        var btn = document.createElement('button');
        btn.className = 'quiz-option';
        btn.textContent = opt;
        btn.addEventListener('click', function() { answerQuestion(i); });
        optionsEl.appendChild(btn);
      });

      document.getElementById('quizFeedback').className = 'quiz-feedback';
      document.getElementById('quizFeedback').textContent = '';
      document.getElementById('quizNextBtn').className = 'quiz-next-btn';
      quizAnswered = false;
    }

    function answerQuestion(idx) {
      if (quizAnswered) return;
      quizAnswered = true;

      var q = quizData[currentQuiz];
      var options = document.querySelectorAll('.quiz-option');
      options.forEach(function(opt, i) {
        opt.disabled = true;
        if (i === q.correct) opt.classList.add('correct');
        if (i === idx && i !== q.correct) opt.classList.add('wrong');
      });

      var fb = document.getElementById('quizFeedback');
      if (idx === q.correct) {
        fb.className = 'quiz-feedback correct-fb show';
        fb.textContent = '\u2705 回答正确！' + q.explain;
        stats.quizCorrect++;
      } else {
        fb.className = 'quiz-feedback wrong-fb show';
        fb.textContent = '\u274C 回答错误。' + q.explain;
      }
      stats.quizTotal++;

      document.getElementById('quizScore').textContent = stats.quizCorrect + ' / ' + stats.quizTotal;
      document.getElementById('quizNextBtn').className = 'quiz-next-btn show';
      updateStats();
    }

    function nextQuestion() {
      currentQuiz++;
      loadQuestion();
    }

    function showQuizResult() {
      var card = document.getElementById('quizCard');
      var rate = Math.round(stats.quizCorrect / stats.quizTotal * 100);
      var grade = rate >= 90 ? '恋爱大师' : rate >= 70 ? '高级玩家' : rate >= 50 ? '初级选手' : '恋爱小白';
      var emoji = rate >= 90 ? '\uD83C\uDFC6' : rate >= 70 ? '\uD83D\uDC4D' : rate >= 50 ? '\uD83D\uDE0A' : '\uD83D\uDE22';

      card.innerHTML =
        '<div style="text-align:center; padding:20px 0;">' +
          '<div style="font-size:48px; margin-bottom:16px;">' + emoji + '</div>' +
          '<h3 style="font-size:22px; margin-bottom:8px;">测试完成！</h3>' +
          '<p style="font-size:16px; color:var(--muted); margin-bottom:16px;">你的成绩：' + stats.quizCorrect + ' / ' + stats.quizTotal + '（' + rate + '%）</p>' +
          '<div class="level-badge ' + (rate >= 90 ? 'master' : rate >= 70 ? 'advanced' : rate >= 50 ? 'intermediate' : 'beginner') + '" style="margin:0 auto 20px;">' +
            '<span>' + grade + '</span>' +
          '</div>' +
          '<button class="translate-btn" onclick="resetQuiz()" style="max-width:200px; margin:0 auto;">重新测试</button>' +
        '</div>';
    }

    function resetQuiz() {
      currentQuiz = 0;
      stats.quizTotal = 0;
      stats.quizCorrect = 0;
      quizAnswered = false;
      var card = document.getElementById('quizCard');
      card.innerHTML =
        '<div class="quiz-progress">' +
          '<span class="score" id="quizScore">0 / 0</span>' +
          '<div class="progress-bar"><div class="progress-fill" id="quizProgress" style="width:0%"></div></div>' +
          '<span class="score" id="quizIndex">1/10</span>' +
        '</div>' +
        '<div class="quiz-question" id="quizQuestion"></div>' +
        '<div class="quiz-options" id="quizOptions"></div>' +
        '<div class="quiz-feedback" id="quizFeedback"></div>' +
        '<button class="quiz-next-btn" id="quizNextBtn" onclick="nextQuestion()">下一题</button>';
      loadQuestion();
      updateStats();
    }

    // === Stats ===
    function updateStats() {
      document.getElementById('statTranslations').textContent = stats.translations;
      document.getElementById('statQuizScore').textContent = stats.quizCorrect + '/' + stats.quizTotal;
      document.getElementById('statCorrectRate').textContent = stats.quizTotal > 0 ? Math.round(stats.quizCorrect / stats.quizTotal * 100) + '%' : '0%';
      document.getElementById('statDictLearned').textContent = stats.dictExpanded.size;

      // Update level
      var score = stats.translations + stats.quizCorrect * 2 + stats.dictExpanded.size;
      var badge = document.getElementById('levelBadge');
      var text = document.getElementById('levelText');
      if (score >= 30) {
        badge.className = 'level-badge master';
        text.textContent = '恋爱大师';
      } else if (score >= 20) {
        badge.className = 'level-badge advanced';
        text.textContent = '高级玩家';
      } else if (score >= 10) {
        badge.className = 'level-badge intermediate';
        text.textContent = '初级选手';
      } else {
        badge.className = 'level-badge beginner';
        text.textContent = '恋爱小白';
      }
    }

    // === Init ===
    renderQuickPhrases();
    renderDict();
    loadQuestion();
    updateStats();
  </script>
</body>
</html>
