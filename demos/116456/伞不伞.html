<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>伞不伞</title>
  <style>
    :root {
      --bg-primary: #f8f9fa;
      --bg-card: #ffffff;
      --text-primary: #212529;
      --text-secondary: #6c757d;
      --accent: #5a9eff;
      --accent-light: #c2e3ff;
      --border: #e9ecef;
      --shadow: 0 4px 12px rgba(0,0,0,0.05);
      --transition: all 0.3s ease;
    }

    .dark-mode {
      --bg-primary: #121619;
      --bg-card: #1e252b;
      --text-primary: #e9ecef;
      --text-secondary: #adb5bd;
      --accent: #4da6ff;
      --accent-light: #2a5a7a;
      --border: #343a40;
      --shadow: 0 4px 12px rgba(0,0,0,0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 16px;
      transition: var(--transition);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      width: 100%;
      max-width: 560px;
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), #7dd0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 16px;
      font-weight: 400;
    }

    .theme-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow);
    }

    .theme-toggle:hover {
      transform: scale(1.05);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: var(--text-primary);
    }

    .main-card {
      width: 100%;
      max-width: 560px;
      background: var(--bg-card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      transition: var(--transition);
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .location-section {
      margin-bottom: 24px;
    }

    .location-label {
      display: block;
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .location-value {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .path-selector {
      display: flex;
      gap: 12px;
      margin: 24px 0;
      flex-wrap: wrap;
    }

    .path-btn {
      flex: 1;
      min-width: 120px;
      padding: 10px 12px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
    }

    .path-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .path-btn:hover:not(.active) {
      background: var(--accent-light);
      border-color: var(--accent);
    }

    .time-slider-container {
      margin: 24px 0;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .time-slider {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      background: var(--border);
      border-radius: 3px;
      outline: none;
    }

    .time-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(90, 158, 255, 0.4);
    }

    .time-display {
      font-size: 16px;
      font-weight: 600;
      margin-top: 12px;
      text-align: center;
      color: var(--accent);
    }

    .result-card {
      background: linear-gradient(135deg, var(--accent-light), #e6f4ff);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin-top: 24px;
      border: 1px solid var(--accent);
      box-shadow: 0 4px 12px rgba(90, 158, 255, 0.1);
    }

    .result-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .result-text {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    .prob-number {
      font-size: 32px;
      font-weight: 800;
      color: var(--accent);
      display: inline-block;
      margin: 0 4px;
    }

    .action-hint {
      font-size: 14px;
      color: var(--text-secondary);
      font-style: italic;
    }

    .footer {
      width: 100%;
      max-width: 560px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 13px;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    /* Responsive */
    @media (max-width: 480px) {
      .path-selector {
        flex-direction: column;
      }
      .path-btn {
        min-width: auto;
      }
      .logo {
        font-size: 24px;
      }
      .main-card {
        padding: 20px;
      }
    }

    @media (max-width: 360px) {
      .logo {
        font-size: 22px;
      }
      .result-text {
        font-size: 18px;
      }
      .prob-number {
        font-size: 28px;
      }
    }

    /* Smooth theme transition */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="切换深色/浅色模式">
    <svg viewBox="0 0 24 24">
      <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM2.25 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM12 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM7.5 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM16.5 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM2.25 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75z"/>
    </svg>
  </button>

  <div class="header">
    <div class="logo">伞不伞</div>
    <div class="subtitle">出门前3秒，确认要不要带伞</div>
  </div>

  <div class="main-card">
    <div class="location-section">
      <span class="location-label">📍 当前定位模拟</span>
      <div class="location-value">北京市朝阳区 呼家楼地铁站附近</div>
    </div>

    <div class="path-selector">
      <button class="path-btn active" data-path="home-to-subway">家 → 地铁</button>
      <button class="path-btn" data-path="subway-to-office">地铁 → 公司</button>
      <button class="path-btn" data-path="home-to-office">家 → 公司直行</button>
    </div>

    <div class="time-slider-container">
      <div class="slider-label">
        <span>7:45</span>
        <span>出门时间</span>
        <span>8:30</span>
      </div>
      <input type="range" min="0" max="50" value="25" class="time-slider" id="timeSlider">
      <div class="time-display">你 <span id="displayTime">8:15</span> 出门</div>
    </div>

    <div class="result-card">
      <div class="result-title">伞不伞？</div>
      <div class="result-text">你 <span id="resultTime">8:15</span> 出门，<span id="resultPath">地铁口</span>有 <span class="prob-number" id="probValue">70%</span> 概率小雨，建议带伞。</div>
      <div class="action-hint">💡 提示：滑动调整出门时间，或点击切换通勤路径</div>
    </div>
  </div>

  <div class="footer">
    <p>纯前端演示 · 数据为模拟生成 · 无需联网 · 双击即用</p>
  </div>

  <script>
    // 初始化
    const timeSlider = document.getElementById('timeSlider');
    const displayTime = document.getElementById('displayTime');
    const resultTime = document.getElementById('resultTime');
    const resultPath = document.getElementById('resultPath');
    const probValue = document.getElementById('probValue');
    const pathBtns = document.querySelectorAll('.path-btn');
    const themeToggle = document.getElementById('themeToggle');

    // 时间映射：0-50 → 7:45 到 8:30（每单位=1.8分钟）
    const timeMap = [
      '7:45', '7:47', '7:49', '7:51', '7:53', '7:55', '7:57', '7:59', '8:01', '8:03',
      '8:05', '8:07', '8:09', '8:11', '8:13', '8:15', '8:17', '8:19', '8:21', '8:23',
      '8:25', '8:27', '8:29', '8:30'
    ];

    // 路径映射
    const pathData = {
      'home-to-subway': { name: '家门口', prob: 65 },
      'subway-to-office': { name: '地铁口', prob: 70 },
      'home-to-office': { name: '公司楼下', prob: 45 }
    };

    // 设置初始值
    function updateTime() {
      const idx = Math.min(Math.floor(timeSlider.value / 2.2), timeMap.length - 1);
      const timeStr = timeMap[idx];
      displayTime.textContent = timeStr;
      resultTime.textContent = timeStr;

      // 动态更新概率（简化逻辑：时间越晚，概率略升）
      const baseProb = parseInt(probValue.textContent);
      const offset = Math.max(-10, Math.min(15, (idx - 15) * 0.8));
      const newProb = Math.min(95, Math.max(15, baseProb + offset));
      probValue.textContent = Math.round(newProb) + '%';
    }

    // 设置路径
    function updatePath(pathKey) {
      const data = pathData[pathKey];
      resultPath.textContent = data.name;
      probValue.textContent = data.prob + '%';
    }

    // 绑定事件
    timeSlider.addEventListener('input', updateTime);
    pathBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        pathBtns.forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        updatePath(this.dataset.path);
      });
    });

    // 主题切换
    themeToggle.addEventListener('click', function() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // 初始化加载
    document.addEventListener('DOMContentLoaded', function() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
      }
      updateTime();
      updatePath('subway-to-office'); // 默认选中地铁口
    });
  </script>
</body>
</html>
