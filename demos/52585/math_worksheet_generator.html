<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动生成数学加减法试卷</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            padding: 30px;
            margin-bottom: 20px;
        }

        .config-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .config-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .config-item label {
            font-weight: 500;
            color: #333;
            font-size: 0.95rem;
        }

        .config-item select,
        .config-item input[type="number"] {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Noto Sans SC', sans-serif;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .config-item select:focus,
        .config-item input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #555;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-print {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(17, 153, 142, 0.4);
        }

        .btn-print:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(17, 153, 142, 0.5);
        }

        .worksheet-section {
            display: none;
        }

        .worksheet-section.active {
            display: block;
        }

        .worksheet-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .worksheet-header h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .worksheet-info {
            color: #666;
            font-size: 0.9rem;
        }

        .questions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
        }

        .question-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 1px solid #e9ecef;
        }

        .question-item .number {
            font-size: 0.8rem;
            color: #999;
            margin-bottom: 8px;
        }

        .question-item .expression {
            font-size: 1.8rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            min-height: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .question-item .answer-line {
            width: 100%;
            height: 30px;
            border-bottom: 2px solid #333;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 5px;
            font-size: 1.2rem;
            color: #666;
        }

        .answer-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px dashed #ddd;
        }

        .answer-section h3 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
        }

        .answer-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background: #e8f5e9;
            border-radius: 8px;
            font-size: 1rem;
        }

        .answer-item .q-num {
            font-weight: 600;
            color: #2e7d32;
            min-width: 30px;
        }

        .answer-item .q-ans {
            font-weight: 500;
            color: #1b5e20;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .card {
                box-shadow: none;
                border: 1px solid #ddd;
                margin-bottom: 0;
            }

            .btn-group {
                display: none;
            }

            .answer-section {
                page-break-before: always;
            }
        }

        .preview-tip {
            text-align: center;
            color: #999;
            font-size: 0.85rem;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧮 数学加减法试卷生成器</h1>
            <p>专为小学一年级学生设计的智能试卷生成工具</p>
        </div>

        <div class="card">
            <div class="config-section">
                <div class="config-item">
                    <label for="questionCount">题目数量</label>
                    <select id="questionCount">
                        <option value="10">10 题</option>
                        <option value="20">20 题</option>
                        <option value="30" selected>30 题</option>
                        <option value="40">40 题</option>
                        <option value="50">50 题</option>
                        <option value="100">100 题</option>
                    </select>
                </div>
                <div class="config-item">
                    <label for="operationType">运算类型</label>
                    <select id="operationType">
                        <option value="both" selected>加法和减法</option>
                        <option value="addition">仅加法</option>
                        <option value="subtraction">仅减法</option>
                    </select>
                </div>
                <div class="config-item">
                    <label for="maxNumber">最大数值</label>
                    <select id="maxNumber">
                        <option value="10">10 以内</option>
                        <option value="20" selected>20 以内</option>
                        <option value="50">50 以内</option>
                        <option value="100">100 以内</option>
                    </select>
                </div>
                <div class="config-item">
                    <label for="layout">排版方式</label>
                    <select id="layout">
                        <option value="grid" selected>网格布局</option>
                        <option value="vertical">纵向排列</option>
                    </select>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="generateWorksheet()">生成试卷</button>
                <button class="btn btn-secondary" onclick="resetForm()">重置设置</button>
                <button class="btn btn-print" onclick="printWorksheet()">打印试卷</button>
            </div>
        </div>

        <div class="card worksheet-section" id="worksheetSection">
            <div class="worksheet-header">
                <h2>小学一年级数学练习卷</h2>
                <div class="worksheet-info">
                    <span>姓名：______________</span>
                    <span style="margin: 0 20px;">班级：______________</span>
                    <span>日期：______________</span>
                </div>
            </div>

            <div class="questions-grid" id="questionsGrid">
            </div>

            <div class="preview-tip">
                💡 提示：点击"打印试卷"可直接打印，答案将在第二页显示
            </div>

            <div class="answer-section" id="answerSection">
                <h3>参考答案</h3>
                <div class="answers-grid" id="answersGrid">
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentQuestions = [];
        let currentAnswers = [];

        function generateRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generateQuestion(maxNum, operationType) {
            let num1, num2, operator, answer;
            const isAddition = operationType === 'addition' || 
                              (operationType === 'both' && Math.random() > 0.5);

            if (isAddition) {
                num1 = generateRandomInt(0, maxNum);
                num2 = generateRandomInt(0, maxNum - num1);
                operator = '+';
                answer = num1 + num2;
            } else {
                num1 = generateRandomInt(0, maxNum);
                num2 = generateRandomInt(0, num1);
                operator = '-';
                answer = num1 - num2;
            }

            return { num1, num2, operator, answer };
        }

        function generateWorksheet() {
            const count = parseInt(document.getElementById('questionCount').value);
            const operationType = document.getElementById('operationType').value;
            const maxNumber = parseInt(document.getElementById('maxNumber').value);
            const layout = document.getElementById('layout').value;

            currentQuestions = [];
            currentAnswers = [];

            for (let i = 0; i < count; i++) {
                const question = generateQuestion(maxNumber, operationType);
                currentQuestions.push(question);
                currentAnswers.push({ index: i + 1, answer: question.answer });
            }

            renderQuestions(layout);
            renderAnswers();

            document.getElementById('worksheetSection').classList.add('active');
            document.getElementById('worksheetSection').scrollIntoView({ behavior: 'smooth' });
        }

        function renderQuestions(layout) {
            const grid = document.getElementById('questionsGrid');
            grid.innerHTML = '';

            if (layout === 'vertical') {
                grid.style.gridTemplateColumns = 'repeat(2, 1fr)';
            } else {
                grid.style.gridTemplateColumns = 'repeat(auto-fit, minmax(140px, 1fr))';
            }

            currentQuestions.forEach((q, index) => {
                const item = document.createElement('div');
                item.className = 'question-item';
                item.innerHTML = `
                    <div class="number">${index + 1}.</div>
                    <div class="expression">${q.num1} ${q.operator} ${q.num2} =</div>
                    <div class="answer-line"></div>
                `;
                grid.appendChild(item);
            });
        }

        function renderAnswers() {
            const grid = document.getElementById('answersGrid');
            grid.innerHTML = '';

            currentAnswers.forEach(a => {
                const item = document.createElement('div');
                item.className = 'answer-item';
                item.innerHTML = `
                    <span class="q-num">${a.index}.</span>
                    <span class="q-ans">${a.answer}</span>
                `;
                grid.appendChild(item);
            });
        }

        function resetForm() {
            document.getElementById('questionCount').value = '30';
            document.getElementById('operationType').value = 'both';
            document.getElementById('maxNumber').value = '20';
            document.getElementById('layout').value = 'grid';
            document.getElementById('worksheetSection').classList.remove('active');
        }

        function printWorksheet() {
            window.print();
        }
    </script>
</body>
</html>
