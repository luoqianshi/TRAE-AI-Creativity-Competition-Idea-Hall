
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI手账生成工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #FFF8E7 0%, #FFE4C4 50%, #FFF5E6 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 2.5rem; color: #8B5A2B; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(139,90,43,0.1); }
        .header p { color: #A07B50; font-size: 1.1rem; }
        .container { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        @media (max-width: 1200px) { .container { grid-template-columns: 1fr; } }
        .panel { background: rgba(255,255,255,0.85); border-radius: 24px; padding: 30px; box-shadow: 0 10px 40px rgba(139,90,43,0.1); backdrop-filter: blur(10px); }
        .panel-title { font-size: 1.3rem; color: #8B5A2B; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .panel-title::before { content: ''; width: 4px; height: 24px; background: linear-gradient(180deg, #FFB347 0%, #FF8C00 100%); border-radius: 2px; }
        .upload-area { border: 3px dashed #FFDAB9; border-radius: 16px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s ease; background: rgba(255,218,185,0.2); }
        .upload-area:hover, .upload-area.dragover { border-color: #FFA500; background: rgba(255,218,185,0.4); transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255,165,0,0.2); }
        .upload-area i { font-size: 4rem; color: #FFA500; margin-bottom: 15px; display: block; }
        .upload-area span { color: #8B5A2B; font-size: 1.1rem; display: block; }
        .upload-area small { color: #A07B50; font-size: 0.9rem; }
        #photo-upload { display: none; }
        .text-input-area { margin-top: 25px; }
        .text-input-area label { display: block; color: #8B5A2B; margin-bottom: 10px; font-weight: 500; }
        .text-input-area textarea { width: 100%; height: 120px; border: 2px solid #FFDAB9; border-radius: 12px; padding: 15px; resize: none; font-family: inherit; font-size: 1rem; color: #5D4037; background: rgba(255,255,255,0.6); transition: all 0.3s ease; }
        .text-input-area textarea:focus { outline: none; border-color: #FFA500; box-shadow: 0 0 15px rgba(255,165,0,0.2); }
        .style-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 15px; }
        .style-card { border: 2px solid #FFDAB9; border-radius: 16px; padding: 20px; cursor: pointer; transition: all 0.3s ease; text-align: center; background: rgba(255,255,255,0.5); }
        .style-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(139,90,43,0.15); }
        .style-card.active { border-color: #FFA500; background: rgba(255,165,0,0.1); box-shadow: 0 5px 20px rgba(255,165,0,0.2); }
        .style-card i { font-size: 2.5rem; margin-bottom: 10px; display: block; }
        .style-card .style-name { color: #8B5A2B; font-weight: 600; display: block; }
        .style-card .style-desc { color: #A07B50; font-size: 0.85rem; margin-top: 5px; display: block; }
        .preview-section { grid-column: span 2; }
        .preview-tabs { display: flex; gap: 15px; margin-bottom: 25px; overflow-x: auto; padding-bottom: 10px; }
        .preview-tab { padding: 12px 24px; border-radius: 25px; border: none; background: rgba(255,218,185,0.5); color: #8B5A2B; cursor: pointer; font-size: 1rem; transition: all 0.3s ease; white-space: nowrap; }
        .preview-tab:hover { background: rgba(255,218,185,0.8); }
        .preview-tab.active { background: linear-gradient(135deg, #FFB347 0%, #FF8C00 100%); color: white; box-shadow: 0 5px 15px rgba(255,165,0,0.3); }
        .journal-preview { background: #FFF8E7; border-radius: 20px; padding: 30px; min-height: 500px; position: relative; overflow: hidden; }
        .journal-preview::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: repeating-linear-gradient(90deg, #FFDAB9 0px, #FFDAB9 30px, transparent 30px, transparent 40px); }
        .journal-content { position: relative; z-index: 1; }
        .journal-header { text-align: center; margin-bottom: 30px; }
        .journal-date { color: #A07B50; font-size: 0.9rem; margin-bottom: 5px; }
        .journal-title { font-size: 1.8rem; color: #8B5A2B; font-weight: 700; }
        .journal-body { display: flex; flex-direction: column; gap: 20px; }
        .journal-image { width: 100%; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(139,90,43,0.15); }
        .journal-image img { width: 100%; height: 250px; object-fit: cover; }
        .journal-text { background: rgba(255,255,255,0.8); border-radius: 12px; padding: 20px; color: #5D4037; line-height: 1.8; font-size: 1rem; }
        .journal-decor { position: absolute; opacity: 0.15; }
        .decor-flower { top: 50px; right: 30px; font-size: 3rem; }
        .decor-heart { bottom: 80px; left: 20px; font-size: 2rem; }
        .decor-star { top: 150px; left: 50px; font-size: 1.5rem; }
        .style-vintage .journal-preview { background: #FDF5E6; }
        .style-vintage .journal-image { border: 4px solid #DEB887; box-shadow: 0 8px 25px rgba(139,90,43,0.3); }
        .style-vintage .journal-text { font-family: Georgia, serif; background: transparent; border-left: 4px solid #DEB887; border-radius: 0; }
        .style-minimal .journal-preview { background: #FFFFFF; }
        .style-minimal .journal-preview::before { display: none; }
        .style-minimal .journal-header { text-align: left; border-bottom: 1px solid #F5F5F5; padding-bottom: 15px; }
        .style-minimal .journal-title { font-size: 1.4rem; font-weight: 400; color: #333; }
        .style-minimal .journal-text { background: transparent; padding: 0; color: #666; }
        .style-doodle .journal-preview { background: #FFF9E6; }
        .style-doodle .journal-image { border-radius: 50% 20% 50% 20%; border: 3px dashed #FFB347; }
        .style-doodle .journal-text { background: transparent; padding: 0; color: #5D4037; }
        .style-doodle .decor-flower, .style-doodle .decor-heart, .style-doodle .decor-star { opacity: 0.3; }
        .style-japanese .journal-preview { background: #FFFAF0; }
        .style-japanese .journal-preview::before { background: repeating-linear-gradient(90deg, #FFE4E1 0px, #FFE4E1 25px, transparent 25px, transparent 35px); }
        .style-japanese .journal-image { border-radius: 0; box-shadow: none; border: 2px solid #FFC0CB; }
        .style-japanese .journal-title { font-family: serif; color: #CD5C5C; }
        .style-japanese .journal-text { background: rgba(255,182,193,0.1); border-radius: 0; border-right: 4px solid #FFB6C1; }
        .generate-btn { width: 100%; padding: 16px; border: none; border-radius: 12px; background: linear-gradient(135deg, #FFB347 0%, #FF8C00 100%); color: white; font-size: 1.1rem; font-weight: 600; cursor: pointer; margin-top: 25px; transition: all 0.3s ease; box-shadow: 0 5px 20px rgba(255,165,0,0.3); }
        .generate-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,165,0,0.4); }
        .generate-btn:active { transform: translateY(0); }
        .uploaded-photos { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-top: 20px; max-height: 150px; overflow-y: auto; }
        .uploaded-photo { height: 80px; border-radius: 8px; overflow: hidden; position: relative; cursor: pointer; }
        .uploaded-photo img { width: 100%; height: 100%; object-fit: cover; }
        .uploaded-photo .remove-btn { position: absolute; top: 5px; right: 5px; width: 20px; height: 20px; background: rgba(0,0,0,0.6); color: white; border-radius: 50%; border: none; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .decor-float { animation: float 3s ease-in-out infinite; }
        .decor-float.delay-1 { animation-delay: 0.5s; }
        .decor-float.delay-2 { animation-delay: 1s; }
    </style>
</head>
<body>
    <div class="header"><h1>🌸 AI手账生成工具</h1><p>上传你的照片和文字，选择喜欢的风格，生成专属手账</p></div>
    <div class="container">
        <div class="panel">
            <h2 class="panel-title">素材上传</h2>
            <label for="photo-upload" class="upload-area" id="upload-area"><i>📷</i><span>点击或拖拽上传照片</span><small>支持 JPG、PNG 格式</small></label>
            <input type="file" id="photo-upload" accept="image/*" multiple>
            <div class="uploaded-photos" id="uploaded-photos"></div>
            <div class="text-input-area"><label for="note-input">📝 文字笔记</label><textarea id="note-input" placeholder="记录你的心情、故事或回忆..."></textarea></div>
            <button class="generate-btn" id="generate-btn">✨ 生成手账</button>
        </div>
        <div class="panel">
            <h2 class="panel-title">风格选择</h2>
            <div class="style-grid" id="style-grid">
                <div class="style-card active" data-style="vintage"><i>📸</i><span class="style-name">复古胶卷</span><span class="style-desc">怀旧胶片质感</span></div>
                <div class="style-card" data-style="minimal"><i>🎨</i><span class="style-name">INS简约</span><span class="style-desc">简洁干净风格</span></div>
                <div class="style-card" data-style="doodle"><i>✏️</i><span class="style-name">手绘涂鸦</span><span class="style-desc">可爱手绘风</span></div>
                <div class="style-card" data-style="japanese"><i>🍵</i><span class="style-name">日系治愈</span><span class="style-desc">清新日系风</span></div>
            </div>
        </div>
        <div class="panel preview-section">
            <h2 class="panel-title">手账预览</h2>
            <div class="preview-tabs" id="preview-tabs">
                <button class="preview-tab active" data-tab="travel">✈️ 旅行日记</button>
                <button class="preview-tab" data-tab="daily">📅 日常生活</button>
                <button class="preview-tab" data-tab="concert">🎤 演唱会</button>
            </div>
            <div class="journal-preview" id="journal-preview">
                <div class="journal-decor decor-flower decor-float">🌸</div>
                <div class="journal-decor decor-heart decor-float delay-1">💖</div>
                <div class="journal-decor decor-star decor-float delay-2">⭐</div>
                <div class="journal-content" id="journal-content">
                    <div class="journal-header"><div class="journal-date">2024年3月15日 星期四</div><h3 class="journal-title">东京旅行日记</h3></div>
                    <div class="journal-body"><div class="journal-image"><img src="https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=1200&h=600&fit=crop" alt="旅行照片"></div><div class="journal-text">今天终于来到了心心念念的东京！一下飞机就被满街的樱花树吸引了，粉色的花瓣随风飘落，美得像童话世界。我们去了浅草寺，品尝了正宗的日式拉面，晚上还去看了东京塔的夜景。这趟旅行真的太治愈了，希望时间能过得慢一点...</div></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const mockData = {
            travel: { date: '2024年3月15日 星期四', title: '东京旅行日记', image: 'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=1200&h=600&fit=crop', text: '今天终于来到了心心念念的东京！一下飞机就被满街的樱花树吸引了，粉色的花瓣随风飘落，美得像童话世界。我们去了浅草寺，品尝了正宗的日式拉面，晚上还去看了东京塔的夜景。这趟旅行真的太治愈了，希望时间能过得慢一点...' },
            daily: { date: '2024年5月20日 星期一', title: '平凡的小确幸', image: 'https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=1200&h=600&fit=crop', text: '今天是个普通的工作日，但却充满了小美好。早上自己做了一杯拿铁，搭配刚买的草莓蛋糕，坐在窗边享受早餐。路上看到一只可爱的猫咪在晒太阳，心情瞬间变得超好。生活中的小确幸，就是这些不经意的瞬间吧。' },
            concert: { date: '2024年6月1日 星期六', title: '梦想成真的夜晚', image: 'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=1200&h=600&fit=crop', text: '终于等到了偶像的演唱会！现场的气氛太燃了，全场大合唱的时候眼泪都忍不住掉下来。从初中开始喜欢他们，没想到有一天能亲眼看到他们的表演。这是我最难忘的儿童节礼物，青春没有遗憾了！' }
        };
        let selectedStyle = 'vintage', currentTab = 'travel', uploadedImages = [];
        const styleGrid = document.getElementById('style-grid'), previewTabs = document.getElementById('preview-tabs'), journalPreview = document.getElementById('journal-preview'), journalContent = document.getElementById('journal-content'), uploadArea = document.getElementById('upload-area'), photoUpload = document.getElementById('photo-upload'), uploadedPhotos = document.getElementById('uploaded-photos'), noteInput = document.getElementById('note-input'), generateBtn = document.getElementById('generate-btn');
        styleGrid.addEventListener('click', e => { const card = e.target.closest('.style-card'); if (card) { document.querySelectorAll('.style-card').forEach(c => c.classList.remove('active')); card.classList.add('active'); selectedStyle = card.dataset.style; updatePreviewStyle(); } });
        previewTabs.addEventListener('click', e => { const tab = e.target.closest('.preview-tab'); if (tab) { document.querySelectorAll('.preview-tab').forEach(t => t.classList.remove('active')); tab.classList.add('active'); currentTab = tab.dataset.tab; updateJournalContent(); } });
        uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', () => { uploadArea.classList.remove('dragover'); });
        uploadArea.addEventListener('drop', e => { e.preventDefault(); uploadArea.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
        photoUpload.addEventListener('change', e => { handleFiles(e.target.files); });
        function handleFiles(files) { for (const file of files) { if (file.type.startsWith('image/')) { const reader = new FileReader(); reader.onload = e => { uploadedImages.push(e.target.result); renderUploadedPhotos(); }; reader.readAsDataURL(file); } } }
        function renderUploadedPhotos() { uploadedPhotos.innerHTML = uploadedImages.map((img, i) => '<div class="uploaded-photo"><img src="' + img + '" alt=""><button class="remove-btn" data-index="' + i + '">×</button></div>').join(''); uploadedPhotos.querySelectorAll('.remove-btn').forEach(btn => btn.addEventListener('click', e => { uploadedImages.splice(parseInt(e.target.dataset.index), 1); renderUploadedPhotos(); })); }
        generateBtn.addEventListener('click', () => { const text = noteInput.value || mockData[currentTab].text; const image = uploadedImages[0] || mockData[currentTab].image; journalContent.innerHTML = '<div class="journal-header"><div class="journal-date">' + new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' }) + '</div><h3 class="journal-title">我的手账</h3></div><div class="journal-body">' + (image ? '<div class="journal-image"><img src="' + image + '" alt="照片"></div>' : '') + '<div class="journal-text">' + (text || '在这里记录你的故事...') + '</div></div>'; });
        function updateJournalContent() { const data = mockData[currentTab]; journalContent.innerHTML = '<div class="journal-header"><div class="journal-date">' + data.date + '</div><h3 class="journal-title">' + data.title + '</h3></div><div class="journal-body"><div class="journal-image"><img src="' + data.image + '" alt="照片"></div><div class="journal-text">' + data.text + '</div></div>'; }
        function updatePreviewStyle() { journalPreview.className = 'journal-preview style-' + selectedStyle; }
    </script>
</body>
</html>
