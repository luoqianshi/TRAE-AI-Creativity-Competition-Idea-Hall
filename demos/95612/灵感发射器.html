    const STRATEGY_MODES = [
      { id: 'default', name: '全维发散 (Default)', prompt: '请综合考虑9大维度，全方位发散生成落地方案。' },
      { id: 'swot', name: 'SWOT分析', prompt: '基于优势、劣势、机会、威胁四个维度进行分析。' },
      { id: 'pestel', name: 'PESTEL分析', prompt: '基于政治、经济、社会、技术、环境、法律宏观维度分析。' },
      { id: 'porter', name: '波特五力', prompt: '基于供应商、购买者、新进入者、替代品、同业竞争五力分析。' },
      { id: 'mckinsey', name: '麦肯锡7S', prompt: '基于战略、结构、系统、风格、员工、技能、价值观进行组织诊断。' },
      { id: '5w2h', name: '5W2H分析', prompt: '基于What, Why, Who, When, Where, How, How much进行细节拆解。' },
      { id: 'fermi', name: '费米估算', prompt: '将复杂问题拆解为可量化的具体小指标进行估算。' },
      { id: 'user_journey', name: '用户旅程', prompt: '从用户接触、认知、购买、使用、售后全链路触点分析。' },
      { id: 'service', name: '服务蓝图', prompt: '分析前台用户行为与后台支撑过程的互动流程。' },
    ];

    const generateId = () => Math.random().toString(36).substr(2, 9);
    const Icon = ({ name, size = 18, ...p }) => {
      useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
      return <i data-lucide={name} style={{ width: size, height: size }} {...p}></i>;
    };

    // --- SIMPLE COLLISION RESOLVER (One-time, Stable) ---
    const useCollisionResolver = (nodes, setNodes) => {
      const lastCountRef = useRef(0);

      useEffect(() => {
        // Only run when nodes are added (not on every render)
        if (nodes.length <= lastCountRef.current) {
          lastCountRef.current = nodes.length;
          return;
        }
        lastCountRef.current = nodes.length;

        // Run collision resolution
        const resolveCollisions = () => {
          setNodes(prev => {
            const resolved = prev.map(n => ({ ...n }));
            const iterations = 15; // Number of passes to separate nodes

            for (let iter = 0; iter < iterations; iter++) {
              for (let i = 0; i < resolved.length; i++) {
                for (let j = i + 1; j < resolved.length; j++) {
                  const a = resolved[i];
                  const b = resolved[j];
                  const dx = b.x - a.x;
                  const dy = b.y - a.y;
                  const dist = Math.sqrt(dx * dx + dy * dy) || 1;

                  // Minimum required distance (based on node radii)
                  const minDist = (a.radius || 60) * 1.2 + (b.radius || 60) * 1.2 + 20;

                  if (dist < minDist) {
                    // Push nodes apart
                    const overlap = minDist - dist;
                    const pushX = (dx / dist) * overlap * 0.5;
                    const pushY = (dy / dist) * overlap * 0.5;

                    a.x -= pushX;
                    a.y -= pushY;
                    b.x += pushX;
                    b.y += pushY;
                  }
                }
              }
            }
            return resolved;
          });
        };

        // Run after a short delay to let React finish rendering
        setTimeout(resolveCollisions, 50);
      }, [nodes.length]);
    };


    function App() {
      // --- Model Config (from localStorage) ---
      const loadConfig = () => {
        try {
          const saved = localStorage.getItem('inspiration_launcher_config');
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return { provider: 'deepseek', apiKey: '', model: 'deepseek-v4-flash' };
      };
      const [config, setConfig] = useState(loadConfig);
      const [showSettings, setShowSettings] = useState(false);
      const [tempConfig, setTempConfig] = useState(config);
      const [settingsTab, setSettingsTab] = useState('api'); // 'api' | 'about'

      const saveConfig = (cfg) => {
        localStorage.setItem('inspiration_launcher_config', JSON.stringify(cfg));
        setConfig(cfg);
      };

      const PROVIDERS = {
        deepseek: {
          name: 'DeepSeek',
          baseURL: 'https://api.deepseek.com',
          models: [
            { id: 'deepseek-v4-flash', name: 'DeepSeek V4 Flash (推荐)', desc: '速度快、性价比高，适合发散与解析' },
            { id: 'deepseek-v4-pro', name: 'DeepSeek V4 Pro', desc: '推理能力更强，适合深度方案生成' },
          ]
        }
      };

      // Parse provider config
      const currentProvider = PROVIDERS[config.provider] || PROVIDERS['deepseek'];
      const apiKey = config.apiKey || '';
      const model = config.model || 'deepseek-v4-flash';

      const [nodes, setNodes] = useState([]);
      const [history, setHistory] = useState([]);
      const [selectedNodeIds, setSelectedNodeIds] = useState(new Set());
      const [suggestions, setSuggestions] = useState([]);

      const [viewport, setViewport] = useState({ x: window.innerWidth / 2, y: window.innerHeight / 2, scale: 0.7 });
      const [inputText, setInputText] = useState('');

      const [loadingNodes, setLoadingNodes] = useState(new Set());
      const [sidePanelContent, setSidePanelContent] = useState(null);
      const [aiProgress, setAiProgress] = useState(0); // 0-100
      const [schemeHistory, setSchemeHistory] = useState([]);

      const [editingNodeId, setEditingNodeId] = useState(null);
      const [editingText, setEditingText] = useState("");

      const dragRef = useRef({ id: null, x: 0, y: 0 });
      const [isDraggingCanvas, setIsDraggingCanvas] = useState(false);
      const mousePosRef = useRef({ x: 0, y: 0 });
      const touchStartRef = useRef({ dist: 0, midX: 0, midY: 0 });
      const [lastSelectedNodeId, setLastSelectedNodeId] = useState(null);

      const [showStrategySelector, setShowStrategySelector] = useState(false);
      const [selectedStrategy, setSelectedStrategy] = useState('default');

      useCollisionResolver(nodes, setNodes);

      useEffect(() => {
        const refresh = () => {
          const shuffled = [...STARTUP_CONCEPTS].sort(() => 0.5 - Math.random());
          setSuggestions(shuffled.slice(0, 5));
        };
        refresh();
        const interval = setInterval(refresh, 10000); // 10s auto refresh
        return () => clearInterval(interval);
      }, []);

      const relatedIds = useMemo(() => {
        if (selectedNodeIds.size !== 1) return new Set();
        const centerId = [...selectedNodeIds][0];
        const related = new Set([centerId]);
        let curr = nodes.find(n => n.id === centerId);
        while (curr && curr.parentId) {
          related.add(curr.parentId);
          curr = nodes.find(n => n.id === curr.parentId);
        }
        const queue = [centerId];
        while (queue.length > 0) {
          const pid = queue.shift();
          nodes.filter(n => n.parentId === pid).forEach(child => {
            related.add(child.id);
            queue.push(child.id);
          });
        }
        return related;
      }, [selectedNodeIds, nodes]);

      const getDepth = (parentId) => {
        if (!parentId) return 0;
        const p = nodes.find(n => n.id === parentId);
        return p ? (p.depth || 0) + 1 : 0;
      };

      const createNode = (text, parentId = null, x = 0, y = 0) => {
        const id = generateId();
        const depth = getDepth(parentId);
        setNodes(prev => [...prev, {
          id, text, x, y, vx: 0, vy: 0,
          parentId, depth, collapsed: false, color: null,
          radius: Math.max(45, 80 - depth * 15),
          createdAt: Date.now()
        }]);
        if (!parentId) setHistory(prev => [{ id, text, time: new Date() }, ...prev]);
        return id;
      };

      const handleCreateChild = (parentId) => {
        const parent = nodes.find(n => n.id === parentId);
        if (!parent) return;
        if (parent.collapsed) toggleCollapse(parentId);
        const id = createNode("", parentId, parent.x + 150, parent.y + (Math.random() - 0.5) * 50);
        setSelectedNodeIds(new Set([id]));
        setLastSelectedNodeId(id);
        setEditingNodeId(id);
        setEditingText("");
      };

      const toggleCollapse = (nodeId) => {
        setNodes(prev => prev.map(n => n.id === nodeId ? { ...n, collapsed: !n.collapsed } : n));
      };

      const setNodeColor = (color) => {
        setNodes(prev => prev.map(n => selectedNodeIds.has(n.id) ? { ...n, color } : n));
      };

      const visibleNodes = useMemo(() => {
        const nodeMap = new Map();
        const childrenMap = new Map();

        // 1. Build maps (O(N))
        for (const n of nodes) {
          nodeMap.set(n.id, n);
          if (n.parentId) {
            if (!childrenMap.has(n.parentId)) childrenMap.set(n.parentId, []);
            childrenMap.get(n.parentId).push(n.id);
          }
        }

        const visibleSet = new Set();
        const queue = nodes.filter(n => !n.parentId).map(n => n.id);

        // 2. BFS from roots (O(N))
        queue.forEach(id => visibleSet.add(id));

        let head = 0;
        while (head < queue.length) {
          const currId = queue[head++];
          const curr = nodeMap.get(currId);
          if (curr && !curr.collapsed) {
            const children = childrenMap.get(currId);
            if (children) {
              for (const childId of children) {
                if (!visibleSet.has(childId)) {
                  visibleSet.add(childId);
                  queue.push(childId);
                }
              }
            }
          }
        }
        return nodes.filter(n => visibleSet.has(n.id));
      }, [nodes]);

      const callDeepSeekStream = async (model, messages, onUpdate) => {
        if (!apiKey) throw new Error('请先配置 API Key');
        const baseURL = currentProvider.baseURL;
        try {
          const response = await fetch(`${baseURL}/v1/chat/completions`, {
            method: "POST",
            headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
            body: JSON.stringify({ model, messages, stream: true })
          });
          if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            const errMsg = errorData?.error?.message || errorData.message || response.statusText;
            throw new Error(`API Error (${response.status}): ${errMsg}`);
          }
          const reader = response.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let buffer = "";
          let fullContent = "";
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop();
            for (const line of lines) {
              if (line.startsWith("data: ")) {
                const jsonStr = line.slice(6);
                if (jsonStr === "[DONE]") continue;
                try {
                  const json = JSON.parse(jsonStr);
                  const delta = json.choices?.[0]?.delta;
                  if (delta?.reasoning_content) onUpdate({ type: 'thinking', content: delta.reasoning_content });
                  else if (delta?.content) { fullContent += delta.content; onUpdate({ type: 'content', content: delta.content, full: fullContent }); }
                } catch (e) { }
              }
            }
          }
          return fullContent;
        } catch (error) {
          console.error(`Model ${model} failed:`, error);
          if (error.message.includes('请先配置 API Key')) throw error;
          throw new Error(`调用失败: ${error.message}`);
        }
      };

      const runAIProcess = async (type, messages, onComplete, nodeId = null) => {
        if (!apiKey) {
          alert('请先设置 API Key！\n点击右下角齿轮图标或在右上角的设置按钮中配置。');
          return;
        }
        if (nodeId) setLoadingNodes(prev => new Set([...prev, nodeId]));
        setAiProgress(10);

        try {
          const rawRes = await callDeepSeekStream(model, messages, (event) => {
            if (event.type === 'content') setAiProgress(prev => Math.min(prev + 5, 95));
          });
          setAiProgress(100);
          onComplete(rawRes);
        } catch (e) {
          setAiProgress(0);
          alert("AI 调用失败: " + e.message);
        } finally {
          if (nodeId) setLoadingNodes(prev => {
            const next = new Set(prev);
            next.delete(nodeId);
            return next;
          });
          setTimeout(() => setAiProgress(0), 1000);
        }
      };

      const fetchDivergence = async (nodeId) => {
        const node = nodes.find(n => n.id === nodeId);
        if (!node) return;

        const strategy = STRATEGY_MODES.find(s => s.id === selectedStrategy) || STRATEGY_MODES[0];

        const prompt = `针对核心概念“${node.text}”，${strategy.prompt}
请生成 6-8 个具有具体落地场景或技术细节的子方向。
要求：
1. 输出格式必须是 JSON 数组，例如：["想法1", "想法2"]。
2. 每个想法严格控制在 5-14 字以内，精炼有力，不要解释。
3. 想法要具体、专业，避免空泛的大词。`;

        await runAIProcess('diverge', [{ role: "user", content: prompt }], (res) => {
          let ideas = [];
          try {
            const jsonMatch = res.match(/\[.*\]/s);
            if (jsonMatch) ideas = JSON.parse(jsonMatch[0]);
            else ideas = res.split("\n").filter(l => l.trim().match(/^\d+\.|- /)).map(l => l.replace(/^\d+\.|- /, '').trim().replace(/[\"\[\]]/g, '')).slice(0, 8);
          } catch (e) { ideas = [res.slice(0, 10) + "..."]; }

          if (ideas.length > 0) {
            if (node.collapsed) toggleCollapse(node.id);
            setNodes(prev => {
              const currentNode = prev.find(n => n.id === nodeId) || node;
              const newNodes = [];
              const startAngle = Math.random() * Math.PI * 2;
              ideas.filter(idea => idea.length >= 2).forEach((idea, i) => { // Basic length check
                const angle = startAngle + (i / ideas.length) * Math.PI * 2;
                const dist = 180 + Math.random() * 50;
                newNodes.push({
                  id: generateId(), text: idea,
                  x: currentNode.x + Math.cos(angle) * dist, y: currentNode.y + Math.sin(angle) * dist,
                  vx: 0, vy: 0, parentId: currentNode.id, depth: (currentNode.depth || 0) + 1,
                  radius: Math.max(45, 80 - ((currentNode.depth || 0) + 1) * 15),
                  createdAt: Date.now() + i * 10
                });
              });
              return [...prev, ...newNodes];
            });
          }
        }, nodeId);
      };

      const fetchSummary = async () => {
        if (selectedNodeIds.size === 0) return;
        const targetId = [...selectedNodeIds][0];
        const node = nodes.find(n => n.id === targetId);
        if (!node) return;

        // Open panel immediately with loading state
        const title = `${node.text}·融合方案`;
        setSidePanelContent({ title, content: "", loading: true });

        const childNodes = nodes.filter(n => n.parentId === targetId).map(n => n.text).join('、');
        const prompt = `角色：产品经理+VC。核心概念：[${node.text}]。${childNodes ? `包含发散点：[${childNodes}]。` : ''}
请基于以上内容，生成一份深度的《融合创新整合方案》。
要求：
1. **结构清晰**：包含【方案概述/痛点分析】、【核心功能/创新点】、【商业价值/变现逻辑】、【技术实现路径】四个模块。
2. **可视化强**：大量使用列表、加粗重点，模拟报告格式。
3. **字数适中**：400-600字左右。
4. **语气专业**：咨询顾问风格。`;

        await runAIProcess('summary', [{ role: "user", content: prompt }], (res) => {
          setSidePanelContent({ title, content: res, loading: false });
          setSchemeHistory(prev => [{ id: Date.now(), title, content: res }, ...prev.slice(0, 9)]); // Add to history, max 10
        });
      };

      const fetchExplanation = async () => {
        if (selectedNodeIds.size !== 1) return;
        const nodeId = [...selectedNodeIds][0];
        const n = nodes.find(x => x.id === nodeId);
        await runAIProcess('explain', [{ role: "user", content: `深度解析：“${n.text}”。150字以内。` }], (content) => {
          setSidePanelContent({ title: `解析：${n.text}`, content });
        }, nodeId);
      };

      const handleNodeEdit = (nodeId, newText) => {
        setNodes(prev => prev.map(n => n.id === nodeId ? { ...n, text: newText } : n));
        setEditingNodeId(null);
      };

      // Touch & Mouse event handling
      useEffect(() => {

        const getPointerPos = (e) => {
          if (e.touches) {
            return { x: e.touches[0].clientX, y: e.touches[0].clientY };
          }
          return { x: e.clientX, y: e.clientY };
        };

        const handleMove = (e) => {
          const pos = getPointerPos(e);
          const dx = pos.x - mousePosRef.current.x;
          const dy = pos.y - mousePosRef.current.y;
          mousePosRef.current = pos;

          if (isDraggingCanvas) {
            setViewport(v => ({ ...v, x: v.x + dx, y: v.y + dy }));
          } else if (dragRef.current.id) {
            const deltaX = dx / viewport.scale;
            const deltaY = dy / viewport.scale;
            setNodes(prev => prev.map(n => {
              if (dragRef.current.descendants.includes(n.id)) {
                const nx = n.x + deltaX;
                const ny = n.y + deltaY;
                if (n.id === dragRef.current.id) {
                  dragRef.current.x = nx;
                  dragRef.current.y = ny;
                }
                return { ...n, x: nx, y: ny };
              }
              return n;
            }));
          }
        };

        const handleTouchMove = (e) => {
          if (e.touches.length === 2) {
            // Pinch to zoom
            e.preventDefault();
            const t1 = e.touches[0];
            const t2 = e.touches[1];
            const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
            const midX = (t1.clientX + t2.clientX) / 2;
            const midY = (t1.clientY + t2.clientY) / 2;

            if (touchStartRef.current.dist > 0) {
              const scaleDelta = dist / touchStartRef.current.dist;
              const newScale = Math.min(Math.max(0.1, viewport.scale * scaleDelta), 4);
              setViewport(v => ({ ...v, scale: newScale }));
            }
            touchStartRef.current = { dist, midX, midY };
          } else if (e.touches.length === 1) {
            handleMove(e);
          }
        };

        const handleUp = () => {
          setIsDraggingCanvas(false);
          dragRef.current.id = null;
          touchStartRef.current = { dist: 0, midX: 0, midY: 0 };
        };

        const handleKeyDown = (e) => {
          if (e.key === 'Tab' && selectedNodeIds.size === 1 && !editingNodeId) {
            e.preventDefault();
            handleCreateChild([...selectedNodeIds][0]);
          }
        };

        const handleWheel = (e) => {
          if (e.ctrlKey || e.metaKey) { // Optional: only prevent if zooming
            e.preventDefault();
          } else {
            e.preventDefault();
          }
          const s = Math.exp(-e.deltaY * 0.0015);
          setViewport(v => ({ ...v, scale: Math.min(Math.max(0.1, v.scale * s), 4) }));
        };

        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleUp);
        window.addEventListener('touchmove', handleTouchMove, { passive: false });
        window.addEventListener('touchend', handleUp);
        window.addEventListener('wheel', handleWheel, { passive: false });
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('mousemove', handleMove);
          window.removeEventListener('mouseup', handleUp);
          window.removeEventListener('touchmove', handleTouchMove);
          window.removeEventListener('touchend', handleUp);
          window.removeEventListener('wheel', handleWheel);
        };
      }, [isDraggingCanvas, viewport.scale, selectedNodeIds, editingNodeId, nodes]);

      return (
        <div className="w-full h-screen bg-slate-50 relative overflow-hidden">
          {/* Canvas Background */}
          <div className="absolute inset-0"
            onMouseDown={e => { if (!e.target.closest('.interactive')) { if (!e.shiftKey) { setSelectedNodeIds(new Set()); setLastSelectedNodeId(null); } setIsDraggingCanvas(true); mousePosRef.current = { x: e.clientX, y: e.clientY }; e.preventDefault(); } }}
            onTouchStart={e => { if (!e.target.closest('.interactive') && e.touches.length === 1) { if (!e.shiftKey) { setSelectedNodeIds(new Set()); setLastSelectedNodeId(null); } setIsDraggingCanvas(true); mousePosRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; } }}
          >
            <div className="absolute inset-0 opacity-20" style={{ backgroundImage: 'radial-gradient(#94a3b8 1px, transparent 1px)', backgroundSize: `${40 * viewport.scale}px ${40 * viewport.scale}px`, backgroundPosition: `${viewport.x}px ${viewport.y}px` }} />
          </div>

          <div className="absolute top-0 left-0 w-full h-full origin-top-left pointer-events-none" style={{ transform: `translate(${viewport.x}px, ${viewport.y}px) scale(${viewport.scale})` }}>
            <svg className="absolute overflow-visible">
              {visibleNodes.map(n => {
                if (!n.parentId) return null;
                const p = nodes.find(x => x.id === n.parentId);
                if (!p) return null;
                const isRelated = relatedIds.has(n.id) && relatedIds.has(p.id);
                const isDimmed = relatedIds.size > 0 && !isRelated;
                // Progressive line thickness: 6px → 4px → 2.5px → 1.5px
                const lineWidth = n.depth === 1 ? 6 : (n.depth === 2 ? 4 : (n.depth === 3 ? 2.5 : 1.5));
                return <line key={n.id} x1={p.x} y1={p.y} x2={n.x} y2={n.y} stroke={isRelated ? "#facc15" : "#cbd5e1"} strokeWidth={isRelated ? lineWidth + 1 : lineWidth} opacity={isDimmed ? 0.4 : 1} />;
              })}
            </svg>
            {visibleNodes.map(node => {
              const isEditing = editingNodeId === node.id;
              const isLoading = loadingNodes.has(node.id);

              const isSelected = selectedNodeIds.has(node.id);
              const isRelated = relatedIds.has(node.id);
              const isDimmed = relatedIds.size > 0 && !isRelated;
              const hasChildren = nodes.some(c => c.parentId === node.id);

              // Text color gradient: depth 0-5 from #000 to #666
              const textColorByDepth = () => {
                const colors = ['#000000', '#1a1a1a', '#333333', '#4d4d4d', '#666666', '#666666'];
                return colors[Math.min(node.depth, 5)];
              };

              // Color Logic: Background + Border
              let customBg = "bg-white";
              let customBorder = "border-slate-200";
              if (node.color) {
                if (node.color === 'red') { customBg = "bg-red-50"; customBorder = "border-red-400"; }
                if (node.color === 'green') { customBg = "bg-green-50"; customBorder = "border-green-400"; }
                if (node.color === 'blue') { customBg = "bg-blue-50"; customBorder = "border-blue-400"; }
                if (node.color === 'purple') { customBg = "bg-purple-50"; customBorder = "border-purple-400"; }
                if (node.color === 'yellow') { customBg = "bg-yellow-50"; customBorder = "border-yellow-400"; }
              }
              if (node.depth === 0 && !node.color) { customBg = "bg-yellow-100"; customBorder = "border-yellow-400"; }

              return (
                <div key={node.id}
                  className={`interactive group pointer-events-auto absolute flex items-center justify-center rounded-2xl shadow-sm border transition-shadow cursor-grab active:cursor-grabbing ${customBg} ${customBorder} ${isSelected ? 'ring-4 ring-yellow-300 border-yellow-500 z-50 scale-105 shadow-xl' : 'z-10 hover:border-yellow-300'} ${isRelated && !isSelected ? 'ring-2 ring-yellow-100 border-yellow-300 z-40' : ''} ${isLoading ? 'p-loading z-[60]' : ''}`}
                  style={{ width: node.radius * 2.5, height: node.radius * 1.1, left: node.x - node.radius * 1.25, top: node.y - node.radius * 0.55, opacity: isDimmed ? 0.6 : 1, transform: isRelated ? 'scale(1.02)' : 'scale(1)' }}
                  onMouseDown={(e) => {
                    e.stopPropagation();
                    // Collect all descendants for group dragging
                    const descendants = new Set([node.id]);
                    const queue = [node.id];
                    while (queue.length > 0) {
                      const pid = queue.shift();
                      nodes.filter(n => n.parentId === pid).forEach(child => {
                        descendants.add(child.id);
                        queue.push(child.id);
                      });
                    }
                    dragRef.current = { id: node.id, x: node.x, y: node.y, descendants: Array.from(descendants) };
                    mousePosRef.current = { x: e.clientX, y: e.clientY };
                  }}
                  onTouchStart={(e) => {
                    e.stopPropagation();
                    const descendants = new Set([node.id]);
                    const queue = [node.id];
                    while (queue.length > 0) {
                      const pid = queue.shift();
                      nodes.filter(n => n.parentId === pid).forEach(child => {
                        descendants.add(child.id);
                        queue.push(child.id);
                      });
                    }
                    dragRef.current = { id: node.id, x: node.x, y: node.y, descendants: Array.from(descendants) };
                    mousePosRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                  }}
                  onClick={(e) => {
                    e.stopPropagation();
                    if (!isEditing) {
                      setSelectedNodeIds(prev => {
                        const next = new Set(prev);
                        if (next.has(node.id)) {
                          next.delete(node.id);
                          if (lastSelectedNodeId === node.id) setLastSelectedNodeId([...next].pop() || null);
                        } else {
                          next.add(node.id);
                          setLastSelectedNodeId(node.id);
                        }
                        return next;
                      });
                    }
                  }}
                  onDoubleClick={(e) => { e.stopPropagation(); toggleCollapse(node.id); }}
                >
                  <div className="text-center px-1 w-full relative select-none">
                    {isLoading && (
                      <div className="absolute inset-0 flex items-center justify-center bg-white/40 backdrop-blur-[1px] z-10 rounded-xl">
                        <div className="w-5 h-5 border-2 border-yellow-500/20 border-t-yellow-500 rounded-full animate-spin"></div>
                      </div>
                    )}
                    {isEditing ? (
                      <input autoFocus value={editingText} onChange={e => setEditingText(e.target.value)} onBlur={() => handleNodeEdit(node.id, editingText)} onKeyDown={e => e.key === 'Enter' && handleNodeEdit(node.id, editingText)} className="w-full bg-slate-100 outline-none rounded px-1 text-center font-bold" style={{ fontSize: node.depth === 0 ? '20px' : '15px' }} onclick={e => e.stopPropagation()} />
                    ) : (
                      <span className={`font-bold transition-opacity ${isLoading ? 'opacity-20' : 'opacity-100'}`} style={{ fontSize: node.depth === 0 ? '20px' : '15px', color: textColorByDepth() }}>{node.text}</span>
                    )}
                  </div>
                  {hasChildren && <button onClick={(e) => { e.stopPropagation(); toggleCollapse(node.id); }} className="absolute -bottom-3 bg-white border rounded-full w-5 h-5 flex items-center justify-center shadow-sm z-20 hover:bg-slate-50 transition-colors"><Icon name={node.collapsed ? "chevron-right" : "chevron-down"} size={12} className="text-slate-500" /></button>}
                  <button onClick={(e) => { e.stopPropagation(); handleCreateChild(node.id); }} className="absolute -right-3 top-1/2 -translate-y-1/2 bg-white border rounded-full w-6 h-6 flex items-center justify-center shadow-sm z-20 hover:bg-yellow-50 hover:border-yellow-300 transition-all opacity-0 group-hover:opacity-100"><Icon name="plus" size={14} className="text-yellow-600" /></button>
                  {isSelected && !isEditing && <div className="absolute -top-1.5 -right-1.5 w-4 h-4 bg-yellow-500 rounded-full border-2 border-white shadow-sm flex items-center justify-center z-20"><Icon name="check" size={10} color="white" /></div>}
                </div>
              );
            })}
          </div>

          {/* SIDE PANEL (LEFT, WIDE, COPY MD, LOADING STATE) */}
          {sidePanelContent && (
            <div className="absolute top-0 left-0 w-[600px] h-full bg-white/95 backdrop-blur-md shadow-2xl border-r flex flex-col z-[80] animate-in-left">
              {(aiProgress > 0 || sidePanelContent.loading) && (
                <div className="h-1.5 w-full bg-slate-100 absolute top-0 left-0 z-50">
                  <div className="h-full bg-blue-500 transition-all duration-300 relative overflow-hidden" style={{ width: sidePanelContent.loading ? '90%' : `${aiProgress}%` }}>
                    <div className="absolute inset-0 bg-white/30 animate-pulse"></div>
                  </div>
                </div>
              )}
              <div className="p-4 border-b flex justify-between items-center bg-slate-50">
                <h3 className="font-bold flex items-center gap-2 text-lg text-slate-800"><Icon name="file-text" size={20} /> {sidePanelContent.title}</h3>
                <div className="flex gap-2">
                  <button onClick={() => { navigator.clipboard.writeText(sidePanelContent.content); alert("已复制 Markdown!"); }} className="p-1.5 px-3 bg-white border rounded-lg hover:bg-slate-100 flex items-center gap-1 text-xs font-bold text-slate-600"><Icon name="copy" size={12} /> 复制文本</button>
                  <button onClick={() => setSidePanelContent(null)} className="p-1.5 hover:bg-slate-200 rounded"><Icon name="x" size={20} /></button>
                </div>
              </div>
              <div className="flex-1 overflow-y-auto p-8 prose prose-slate max-w-none">
                {sidePanelContent.loading ? (
                  <div className="flex flex-col items-center justify-center h-40 gap-4 text-slate-400">
                    <div className="w-8 h-8 border-2 border-blue-200 border-t-blue-500 rounded-full animate-spin"></div>
                    <p>AI 正在分析节点上下文，整合商业、技术与体验维度...</p>
                  </div>
                ) : (
                  <div dangerouslySetInnerHTML={{ __html: marked.parse(sidePanelContent.content || "") }} />
                )}
              </div>
            </div>
          )}

          {/* HEADER & HISTORY TAGS */}
          <div className="absolute top-6 left-8 pointer-events-none z-50">
            <h1 className="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-2">
              <span className="w-10 h-10 rounded-xl bg-black flex items-center justify-center text-yellow-400 shadow-xl"><Icon name="rocket" size={24} /></span>
              灵感发射器 <span className="text-[10px] bg-yellow-100 text-yellow-700 px-2 rounded-full py-0.5 border border-yellow-200"> v5.6</span>
            </h1>
            <div className="mt-3 flex flex-wrap gap-2 pointer-events-auto max-w-[500px]">
              {schemeHistory.map(h => (
                <button key={h.id} onClick={() => setSidePanelContent({ title: h.title, content: h.content, loading: false })} className="text-[10px] bg-white/80 backdrop-blur border border-slate-200 shadow-sm px-2 py-1 rounded hover:bg-blue-50 hover:border-blue-200 hover:text-blue-600 transition-all truncate max-w-[120px]">
                  # {h.title}
                </button>
              ))}
            </div>
          </div>

          {/* TOP RIGHT: Strategy + Settings */}
          <div className="absolute top-6 right-8 z-[90] flex items-center gap-2">
            {/* Strategy Selector */}
            <div className="relative">
              <button onClick={() => setShowStrategySelector(!showStrategySelector)} className={`flex items-center gap-2 px-4 py-2 rounded-xl shadow-lg border transition-all font-bold ${showStrategySelector ? 'bg-yellow-400 text-black border-yellow-500' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'}`}>
                <Icon name="brain-circuit" size={18} />
                <span>{STRATEGY_MODES.find(m => m.id === selectedStrategy)?.name.split(' ')[0] || '思维方案'}</span>
                <Icon name={showStrategySelector ? "chevron-up" : "chevron-down"} size={14} />
              </button>

              {showStrategySelector && (
                <div className="absolute right-0 top-12 w-72 bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl border p-2 animate-in scale-in origin-top-right">
                  <div className="flex flex-col gap-1 max-h-[70vh] overflow-y-auto p-1">
                    {STRATEGY_MODES.map(m => (
                      <button key={m.id} onClick={() => { setSelectedStrategy(m.id); setShowStrategySelector(false); }} className={`flex items-start gap-3 p-3 rounded-lg text-left transition-colors ${selectedStrategy === m.id ? 'bg-yellow-50 border border-yellow-200' : 'hover:bg-slate-50 border border-transparent'}`}>
                        <div className={`mt-0.5 w-4 h-4 rounded-full border flex items-center justify-center ${selectedStrategy === m.id ? 'border-yellow-500 bg-yellow-500' : 'border-slate-300'}`}>
                          {selectedStrategy === m.id && <div className="w-1.5 h-1.5 rounded-full bg-white"></div>}
                        </div>
                        <div className="flex-1">
                          <div className={`font-bold text-sm ${selectedStrategy === m.id ? 'text-yellow-900' : 'text-slate-700'}`}>{m.name.split(' ')[0]}</div>
                          <div className="text-[10px] text-slate-400 leading-tight mt-1 line-clamp-2">{m.prompt.replace(/请基于.*发散[：。]/, '')}</div>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>
            {/* Settings Gear Button */}
            <button onClick={() => { setTempConfig({...config}); setShowSettings(true); }}
              className="flex items-center gap-1.5 px-3 py-2 rounded-xl shadow-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-all font-bold text-sm"
              title="API 设置">
              <Icon name="settings" size={18} />
              <span className="hidden md:inline">模型设置</span>
            </button>
          </div>

          {/* ACTION TOOLBAR - Positioned near selected node */}
          {selectedNodeIds.size > 0 && (
            <div className="absolute flex flex-col items-center gap-4" style={{
              top: (() => {
                const targetId = lastSelectedNodeId || [...selectedNodeIds][selectedNodeIds.size - 1];
                const selectedNode = nodes.find(n => n.id === targetId);
                if (!selectedNode) return '50%';
                return `${viewport.y + selectedNode.y * viewport.scale + 100}px`;
              })(),
              left: (() => {
                const targetId = lastSelectedNodeId || [...selectedNodeIds][selectedNodeIds.size - 1];
                const selectedNode = nodes.find(n => n.id === targetId);
                if (!selectedNode) return '50%';
                return `${viewport.x + selectedNode.x * viewport.scale}px`;
              })(),
              transform: 'translateX(-50%)',
              maxWidth: '600px',
              zIndex: 100
            }}>
              <div className="glass-panel p-2 rounded-2xl flex items-center gap-2 shadow-2xl animate-in scale-in">
                <div className="hidden md:flex gap-1 ml-2 mr-3 border-r pr-3">
                  {['red', 'green', 'blue'].map(c => (
                    <button key={c} onClick={() => setNodeColor(c)} className={`w-6 h-6 rounded-full bg-${c}-400 hover:scale-110 transition-transform shadow-inner ring-offset-2 hover:ring-2 ring-${c}-200`}></button>
                  ))}
                  <button onClick={() => setNodeColor(null)} className="w-6 h-6 rounded-full bg-white border border-slate-300 hover:scale-110 flex items-center justify-center"><Icon name="slash" size={10} /></button>
                </div>
                {selectedNodeIds.size === 1 && (
                  <>
                    <button onClick={() => {
                      const n = nodes.find(x => x.id === [...selectedNodeIds][0]);
                      setEditingNodeId(n.id);
                      setEditingText(n.text);
                    }} className="p-2 text-slate-400 hover:text-yellow-600 hover:bg-yellow-50 rounded-xl transition-colors min-w-[40px] flex items-center justify-center"><Icon name="edit-3" size={20} /></button>
                    <button onClick={() => fetchDivergence([...selectedNodeIds][0])} className="px-3 md:px-4 py-2 bg-yellow-400 text-black text-xs md:text-sm font-bold rounded-xl hover:bg-yellow-500 shadow-sm flex items-center gap-1 whitespace-nowrap"><Icon name="git-branch" size={14} />发散</button>
                    <button onClick={fetchExplanation} className="px-3 md:px-4 py-2 bg-white text-slate-700 text-xs md:text-sm font-bold rounded-xl hover:bg-slate-50 border flex items-center gap-1 shadow-sm whitespace-nowrap"><Icon name="search" size={14} />解析</button>
                  </>
                )}
                <button onClick={fetchSummary} className="px-3 md:px-4 py-2 bg-black text-white text-xs md:text-sm font-bold rounded-xl hover:bg-slate-800 shadow-sm flex items-center gap-1 whitespace-nowrap"><Icon name="sparkles" size={14} />出方案</button>
                <button onClick={() => {
                  const toDelete = new Set(selectedNodeIds);
                  let changed = true;
                  while (changed) { changed = false; nodes.forEach(n => { if (n.parentId && toDelete.has(n.parentId) && !toDelete.has(n.id)) { toDelete.add(n.id); changed = true; } }); }
                  setNodes(prev => prev.filter(n => !toDelete.has(n.id)));
                  setSelectedNodeIds(new Set());
                }} className="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-colors"><Icon name="trash-2" size={20} /></button>
              </div>
            </div>
          )}

          {/* BOTTOM INPUT AREA - Fixed at bottom */}
          <div className="absolute bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-4 w-full max-w-2xl px-4">
            <div className="flex gap-2 justify-center flex-wrap px-4">
              {suggestions.map((s, i) => (
                <button key={i} onClick={() => setInputText(s)} className="text-[10px] bg-white/80 hover:bg-white px-3 py-1.5 rounded-full border border-slate-200 text-slate-500 hover:text-yellow-600 transition-all shadow-sm">{s}</button>
              ))}
              <button onClick={() => { const s = [...STARTUP_CONCEPTS].sort(() => 0.5 - Math.random()); setSuggestions(s.slice(0, 5)); }} className="text-[10px] text-yellow-600 hover:text-yellow-700 font-bold px-2 py-1 flex items-center gap-1"><Icon name="refresh-cw" size={12} />换一批</button>
            </div>

            <form onSubmit={e => { e.preventDefault(); if (!inputText.trim()) return; const id = createNode(inputText.trim(), null, 0, 0); setSelectedNodeIds(new Set([id])); setInputText(''); }} className="relative w-full shadow-2xl rounded-2xl overflow-hidden group">
              <input value={inputText} onChange={e => setInputText(e.target.value)} type="text" maxLength={1000} placeholder="输入核心灵感..." className="w-full h-14 pl-6 pr-14 bg-white/95 focus:bg-white outline-none font-bold text-slate-700 text-lg" />
              <button className="absolute right-2 top-2 w-10 h-10 flex items-center justify-center text-black hover:scale-110 transition-transform"><Icon name="arrow-right-circle" size={32} fill="#facc15" /></button>
            </form>

            {/* Settings Button */}
            <button onClick={() => { setTempConfig({...config}); setShowSettings(true); }} className="text-xs text-slate-400 hover:text-slate-600 flex items-center gap-1 transition-colors">
              <Icon name="settings" size={14} />
              {apiKey ? `${currentProvider.name} / ${PROVIDERS[config.provider]?.models.find(m => m.id === model)?.name || model}` : '点击设置 API Key'}
            </button>
          </div>

          {/* SETTINGS MODAL */}
          {showSettings && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-[200] flex items-center justify-center" onClick={(e) => { if (e.target === e.currentTarget) setShowSettings(false); }}>
              <div className="bg-white rounded-3xl shadow-2xl w-[480px] max-h-[80vh] overflow-hidden flex flex-col animate-in scale-in" onClick={e => e.stopPropagation()}>
                {/* Header */}
                <div className="p-6 pb-4 border-b">
                  <div className="flex justify-between items-center">
                    <h2 className="text-xl font-black text-slate-800 flex items-center gap-2"><Icon name="settings" size={22} />设置</h2>
                    <button onClick={() => setShowSettings(false)} className="p-1.5 hover:bg-slate-100 rounded-lg transition-colors"><Icon name="x" size={20} /></button>
                  </div>
                  {/* Tabs */}
                  <div className="flex gap-1 mt-4 bg-slate-100 rounded-xl p-1">
                    <button onClick={() => setSettingsTab('api')} className={`flex-1 py-2 rounded-lg text-sm font-bold transition-all ${settingsTab === 'api' ? 'bg-white shadow-sm text-slate-800' : 'text-slate-400 hover:text-slate-600'}`}>API 配置</button>
                    <button onClick={() => setSettingsTab('about')} className={`flex-1 py-2 rounded-lg text-sm font-bold transition-all ${settingsTab === 'about' ? 'bg-white shadow-sm text-slate-800' : 'text-slate-400 hover:text-slate-600'}`}>关于</button>
                  </div>
                </div>

                {/* Body */}
                <div className="flex-1 overflow-y-auto p-6">
                  {settingsTab === 'api' ? (
                    <div className="space-y-5">
                      {/* Provider Select */}
                      <div>
                        <label className="block text-xs font-bold text-slate-500 mb-2">模型提供商</label>
                        <div className="grid grid-cols-1 gap-2">
                          {Object.entries(PROVIDERS).map(([key, p]) => (
                            <button key={key} onClick={() => setTempConfig(prev => ({...prev, provider: key, model: p.models[0].id}))}
                              className={`flex items-center gap-3 p-3 rounded-xl border-2 text-left transition-all ${tempConfig.provider === key ? 'border-blue-400 bg-blue-50' : 'border-slate-200 hover:border-slate-300'}`}>
                              <div className={`w-4 h-4 rounded-full border-2 flex items-center justify-center ${tempConfig.provider === key ? 'border-blue-500' : 'border-slate-300'}`}>
                                {tempConfig.provider === key && <div className="w-2 h-2 rounded-full bg-blue-500"></div>}
                              </div>
                              <div>
                                <div className="font-bold text-sm text-slate-700">{p.name}</div>
                                <div className="text-[10px] text-slate-400">{p.baseURL}</div>
                              </div>
                            </button>
                          ))}
                        </div>
                      </div>

                      {/* Model Select */}
                      <div>
                        <label className="block text-xs font-bold text-slate-500 mb-2">模型选择</label>
                        <div className="space-y-2">
                          {(PROVIDERS[tempConfig.provider] || PROVIDERS['deepseek']).models.map(m => (
                            <button key={m.id} onClick={() => setTempConfig(prev => ({...prev, model: m.id}))}
                              className={`w-full flex items-start gap-3 p-3 rounded-xl border-2 text-left transition-all ${tempConfig.model === m.id ? 'border-blue-400 bg-blue-50' : 'border-slate-200 hover:border-slate-300'}`}>
                              <div className={`w-4 h-4 rounded-full border-2 flex items-center justify-center mt-0.5 ${tempConfig.model === m.id ? 'border-blue-500' : 'border-slate-300'}`}>
                                {tempConfig.model === m.id && <div className="w-2 h-2 rounded-full bg-blue-500"></div>}
                              </div>
                              <div>
                                <div className="font-bold text-sm text-slate-700">{m.name}</div>
                                <div className="text-[10px] text-slate-400">{m.desc}</div>
                              </div>
                            </button>
                          ))}
                        </div>
                      </div>

                      {/* API Key Input */}
                      <div>
                        <label className="block text-xs font-bold text-slate-500 mb-2">API Key</label>
                        <input type="password" value={tempConfig.apiKey} onChange={e => setTempConfig(prev => ({...prev, apiKey: e.target.value}))}
                          placeholder={`输入 ${currentProvider.name} 的 API Key...`}
                          className="w-full px-4 py-3 rounded-xl border-2 border-slate-200 outline-none focus:border-blue-400 text-sm font-mono transition-colors" />
                        <p className="text-[10px] text-slate-400 mt-1.5">
                          Key 仅存储在浏览器本地，不会上传到任何服务器。
                          {tempConfig.provider === 'deepseek' && <> 前往 <a href="https://platform.deepseek.com/api_keys" target="_blank" className="text-blue-500 underline">DeepSeek 开放平台</a> 获取。</>}
                        </p>
                      </div>

                      {/* Status indicator */}
                      <div className={`flex items-center gap-2 p-3 rounded-xl text-xs font-bold ${apiKey ? 'bg-green-50 text-green-700' : 'bg-amber-50 text-amber-700'}`}>
                        <div className={`w-2 h-2 rounded-full ${apiKey ? 'bg-green-500' : 'bg-amber-500'}`}></div>
                        {apiKey ? 'API Key 已配置，可以正常使用 AI 功能' : '尚未配置 API Key，AI 功能不可用'}
                      </div>
                    </div>
                  ) : (
                    <div className="space-y-4 text-sm text-slate-600 leading-relaxed">
                      <p className="font-bold text-slate-800 text-lg">灵感发射器 v5.6</p>
                      <p>一个思维发散与方案融合工具，帮助产品经理和创业者快速进行头脑风暴和方案撰写。</p>
                      <div className="bg-slate-50 rounded-xl p-4 space-y-2 text-xs">
                        <p><strong>快捷键：</strong></p>
                        <p><code className="bg-slate-200 px-1.5 py-0.5 rounded">Tab</code> 为选中节点创建子节点</p>
                        <p><code className="bg-slate-200 px-1.5 py-0.5 rounded">双击节点</code> 折叠/展开子节点</p>
                        <p><code className="bg-slate-200 px-1.5 py-0.5 rounded">Shift+点击</code> 多选节点</p>
                        <p><code className="bg-slate-200 px-1.5 py-0.5 rounded">滚轮</code> 缩放画布</p>
                        <p><code className="bg-slate-200 px-1.5 py-0.5 rounded">拖拽空白</code> 平移画布</p>
                      </div>
                      <p className="text-xs text-slate-400">AI 能力由 DeepSeek 提供驱动，需要自行配置 API Key。</p>
                    </div>
                  )}
                </div>

                {/* Footer */}
                <div className="p-4 border-t bg-slate-50 flex gap-3">
                  <button onClick={() => setShowSettings(false)} className="flex-1 py-2.5 rounded-xl border border-slate-200 font-bold text-sm text-slate-500 hover:bg-slate-100 transition-colors">取消</button>
                  <button onClick={() => { saveConfig(tempConfig); setShowSettings(false); }} className="flex-1 py-2.5 rounded-xl bg-blue-500 text-white font-bold text-sm hover:bg-blue-600 transition-colors">保存配置</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />); 
  </script>
</body>

</html>
