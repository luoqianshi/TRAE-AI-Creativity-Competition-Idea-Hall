<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影戏乾坤 - 数字皮影工坊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'SimSun', sans-serif;
            background: #1a0a00;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* 主舞台容器 */
        #stage {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #2a1810 0%, #1a0f0a 100%);
            overflow: hidden;
        }

        /* 幕布纹理 */
        #curtain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 30% 50%, rgba(255,200,100,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 50%, rgba(255,180,80,0.1) 0%, transparent 50%),
                repeating-linear-gradient(90deg, rgba(139,69,19,0.1) 0px, rgba(160,82,45,0.1) 2px, rgba(139,69,19,0.1) 4px);
            pointer-events: none;
            z-index: 1;
        }

        /* 灯光效果层 */
        #lighting {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            mix-blend-mode: screen;
            background: radial-gradient(ellipse at 50% 40%, rgba(255,220,150,0.3) 0%, rgba(255,180,100,0.1) 30%, transparent 60%);
            filter: blur(20px);
            transition: background 0.5s ease;
        }

        /* 皮影角色容器 */
        .puppet {
            position: absolute;
            cursor: grab;
            user-select: none;
            z-index: 10;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.8));
        }

        .puppet:active {
            cursor: grabbing;
        }

        .puppet.dragging {
            opacity: 0.8;
            z-index: 100;
        }

        /* 皮影部件 */
        .puppet-part {
            position: absolute;
            transform-origin: center center;
            transition: transform 0.1s ease;
        }

        .puppet-part:hover {
            filter: brightness(1.2) drop-shadow(0 0 8px rgba(255,200,100,0.5));
        }

        .puppet-part.selected {
            filter: brightness(1.3) drop-shadow(0 0 12px rgba(255,220,150,0.8));
        }

        /* 关节连接点 */
        .joint {
            position: absolute;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, #d4af37 0%, #8b6914 100%);
            border-radius: 50%;
            border: 2px solid #5a4a0a;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 0 4px rgba(212,175,55,0.6);
        }

        .joint:hover {
            transform: scale(1.3);
            box-shadow: 0 0 8px rgba(212,175,55,0.9);
        }

        /* 控制面板 */
        #control-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 280px;
            background: rgba(20, 10, 5, 0.95);
            border: 2px solid #8b6914;
            border-radius: 12px;
            padding: 20px;
            z-index: 1000;
            color: #d4af37;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        #control-panel h2 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(212,175,55,0.5);
        }

        .control-section {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(139,105,20,0.3);
        }

        .control-section:last-child {
            border-bottom: none;
        }

        .control-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        /* 滑块样式 */
        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #3a2510;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: radial-gradient(circle, #d4af37 0%, #8b6914 100%);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(212,175,55,0.6);
        }

        /* 按钮样式 */
        .btn {
            display: inline-block;
            padding: 8px 16px;
            margin: 4px;
            background: linear-gradient(135deg, #8b6914 0%, #6b5010 100%);
            border: 1px solid #d4af37;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn:hover {
            background: linear-gradient(135deg, #d4af37 0%, #8b6914 100%);
            box-shadow: 0 0 12px rgba(212,175,55,0.5);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-record {
            background: linear-gradient(135deg, #c41e3a 0%, #8b0000 100%);
            border-color: #ff6b6b;
        }

        .btn-record:hover {
            background: linear-gradient(135deg, #ff6b6b 0%, #c41e3a 100%);
            box-shadow: 0 0 12px rgba(255,107,107,0.5);
        }

        .btn-record.recording {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 5px rgba(255,0,0,0.5); }
            50% { box-shadow: 0 0 20px rgba(255,0,0,0.8); }
        }

        /* 部件选择区 */
        #parts-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(20, 10, 5, 0.95);
            border: 2px solid #8b6914;
            border-radius: 12px;
            padding: 15px;
            z-index: 1000;
        }

        .part-item {
            width: 60px;
            height: 60px;
            background: rgba(139,105,20,0.2);
            border: 2px solid #8b6914;
            border-radius: 8px;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .part-item:hover {
            background: rgba(212,175,55,0.3);
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(212,175,55,0.4);
        }

        .part-item svg {
            width: 80%;
            height: 80%;
            pointer-events: none;
        }

        /* 录制状态指示器 */
        #record-indicator {
            position: fixed;
            top: 20px;
            left: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(196,30,58,0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 1001;
            font-weight: bold;
        }

        #record-indicator.active {
            display: flex;
        }

        .record-dot {
            width: 12px;
            height: 12px;
            background: #ff0000;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* 提示信息 */
        #tooltip {
            position: fixed;
            background: rgba(20, 10, 5, 0.95);
            color: #d4af37;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            z-index: 1002;
            display: none;
            border: 1px solid #8b6914;
        }

        /* 标题 */
        #title {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212,175,55,0.5);
            z-index: 1000;
            pointer-events: none;
            letter-spacing: 8px;
        }

        /* 操作提示 */
        #hints {
            position: fixed;
            bottom: 100px;
            left: 20px;
            color: rgba(212,175,55,0.7);
            font-size: 12px;
            line-height: 1.8;
            z-index: 1000;
            background: rgba(20, 10, 5, 0.8);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(139,105,20,0.3);
        }

        /* 场景元素 */
        .scene-prop {
            position: absolute;
            pointer-events: none;
            z-index: 5;
        }

        /* 火焰动画 */
        .flame {
            position: absolute;
            bottom: 0;
            width: 30px;
            height: 60px;
            background: radial-gradient(ellipse at 50% 80%, rgba(255,200,50,0.8) 0%, rgba(255,100,0,0.6) 40%, transparent 70%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flicker 0.5s infinite alternate;
            filter: blur(2px);
        }

        @keyframes flicker {
            0% { transform: scaleY(1) scaleX(1); opacity: 0.8; }
            100% { transform: scaleY(1.1) scaleX(0.9); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="stage">
        <div id="curtain"></div>
        <div id="lighting"></div>
        
        <!-- 场景装饰 -->
        <div class="scene-prop" style="bottom: 0; left: 10%; width: 80px; height: 120px;">
            <div class="flame" style="left: 25px;"></div>
        </div>
        <div class="scene-prop" style="bottom: 0; right: 10%; width: 80px; height: 120px;">
            <div class="flame" style="left: 25px;"></div>

            </div>
            
            <div class="control-section">
                <label class="control-label">幕布纹理</label>
                <button class="btn" onclick="changeTexture('smooth')">平滑</button>
                <button class="btn" onclick="changeTexture('rough')">粗糙</button>
                <button class="btn" onclick="changeTexture('pattern')">花纹</button>
            </div>
            
            <div class="control-section">
                <label class="control-label">场景操作</label>
                <button class="btn" onclick="clearStage()">清空舞台</button>

            <div class="control-section">

                    <circle cx="65" cy="40" r="8" fill="#fff"/>

                    <circle cx="65" cy="40" r="4" fill="#000"/>
                    <path d="M 30 65 Q 50 80 70 65" stroke="#d4af37" stroke-width="2" fill="none"/>
                    <path d="M 20 20 Q 50 5 80 20" stroke="#d4af37" stroke-width="3" fill="none"/>
                    <circle cx="50" cy="15" r="8" fill="#c41e3a"/>
                </svg>
            </div>
            <div class="part-item" draggable="true" data-part="body" title="身体">
                <svg viewBox="0 0 100 120">
                    <path d="M 30 10 L 70 10 L 80 100 L 20 100 Z" fill="#8b4513" stroke="#d4af37" stroke-width="2"/>
                    <path d="M 35 20 L 65 20 L 70 80 L 30 80 Z" fill="#a0522d"/>
                    <path d="M 40 30 L 60 30 L 60 50 L 40 50 Z" fill="#c41e3a"/>
                    <path d="M 45 60 L 55 60 L 55 90 L 45 90 Z" fill="#d4af37"/>
                </svg>
            </div>
            <div class="part-item" draggable="true" data-part="arm-left" title="左臂">
                <svg viewBox="0 0 80 100">
                    <path d="M 40 10 L 60 10 L 50 90 L 30 90 Z" fill="#8b4513" stroke="#d4af37" stroke-width="2"/>
                    <circle cx="45" cy="15" r="12" fill="#a0522d"/>
                    <path d="M 35 50 L 55 50" stroke="#d4af37" stroke-width="1"/>
                    <path d="M 33 70 L 57 70" stroke="#d4af37" stroke-width="1"/>
                </svg>
            </div>
            <div class="part-item" draggable="true" data-part="arm-right" title="右臂">
                <svg viewBox="0 0 80 100">
                    <path d="M 20 10 L 40 10 L 50 90 L 30 90 Z" fill="#8b4513" stroke="#d4af37" stroke-width="2"/>
                    <circle cx="35" cy="15" r="12" fill="#a0522d"/>

                </svg>
            </div>
            <div class="part-item" draggable="true" data-part="leg-left" title="左腿">
                <svg viewBox="0 0 60 100">
                    <path d="M 20 10 L 40 10 L 35 90 L 25 90 Z" fill="#8b4513" stroke="#d4af37" stroke-width="2"/>

                    <path d="M 23 60 L 37 60" stroke="#d4af37" stroke-width="1"/>

            </div>
            <div class="part-item" draggable="true" data-part="leg-right" title="右腿">

                    <path d="M 20 10 L 40 10 L 35 90 L 25 90 Z" fill="#8b4513" stroke="#d4af37" stroke-width="2"/>

                    <rect x="48" y="10" width="4" height="80" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>

            </div>
            <div class="part-item" draggable="true" data-part="prop-fan" title="道具-扇">

            </div>
        </div>
        
        <!-- 操作提示 -->
        <div id="hints">
            <div>🎭 拖拽部件到舞台</div>
            <div>🖱️ 点击部件选中，滚轮旋转</div>

            <div>🎬 录制你的皮影剧场</div>
        </div>
        
        <!-- 提示框 -->
        <div id="tooltip"></div>
    </div>

        // 全局状态
        let selectedPart = null;
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };
        let draggedElement = null;
        let puppetIdCounter = 0;

        const stage = document.getElementById('stage');
        const tooltip = document.getElementById('tooltip');

                    break;

                    break;
                case 'arm-left':
                    width = 80; height = 100;
                    svgContent = `<svg width="${width}" height="${height}" viewBox="0 0 80 100">

                            <filter id="shadow-${puppet.id}">
                                <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>

                    break;
                case 'arm-right':
                    width = 80; height = 100;
                    svgContent = `<svg width="${width}" height="${height}" viewBox="0 0 80 100">
                        <defs>

                        </g>
                    </svg>`;
                    break;
                case 'leg-right':
                    width = 60; height = 100;
                    svgContent = `<svg width="${width}" height="${height}" viewBox="0 0 60 100">
                        <defs>
                            <filter id="shadow-${puppet.id}">

                        </defs>
                        <g filter="url(#shadow-${puppet.id})">
                            <path d="M 20 10 L 40 10 L 35 90 L 25 90 Z" fill="#8b4513" stroke="#d4af37" stroke-width="2"/>
                            <ellipse cx="30" cy="15" rx="15" ry="10" fill="#a0522d" stroke="#d4af37" stroke-width="1"/>
                            <path d="M 22 40 L 38 40" stroke="#d4af37" stroke-width="1"/>
                            <path d="M 23 60 L 37 60" stroke="#d4af37" stroke-width="1"/>
                            <ellipse cx="30" cy="92" rx="12" ry="6" fill="#8b4513"/>
                        </g>
                    </svg>`;
                    break;
                case 'prop-sword':
                    width = 100; height = 120;
                    svgContent = `<svg width="${width}" height="${height}" viewBox="0 0 100 120">
                        <defs>
                            <filter id="shadow-${puppet.id}">
                                <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
                            </filter>
                        </defs>
                        <g filter="url(#shadow-${puppet.id})">
                            <rect x="48" y="10" width="4" height="80" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
                            <rect x="40" y="85" width="20" height="4" fill="#d4af37" stroke="#8b6914" stroke-width="1"/>
                            <circle cx="50" cy="95" r="8" fill="#8b4513" stroke="#d4af37" stroke-width="1"/>
                            <path d="M 50 10 L 45 20 L 55 20 Z" fill="#c0c0c0"/>
                            <line x1="50" y1="15" x2="50" y2="85" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
                        </g>
                    </svg>`;
                    break;
                case 'prop-fan':
                    width = 100; height = 80;
                    svgContent = `<svg width="${width}" height="${height}" viewBox="0 0 100 80">
                        <defs>
                            <filter id="shadow-${puppet.id}">
                                <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
                            </filter>
                        </defs>
                        <g filter="url(#shadow-${puppet.id})">
                            <path d="M 10 70 Q 50 10 90 70" fill="#c41e3a" stroke="#d4af37" stroke-width="2"/>
                            <path d="M 20 65 Q 50 20 80 65" fill="#8b0000" stroke="none"/>
                            <line x1="50" y1="70" x2="50" y2="40" stroke="#d4af37" stroke-width="2"/>
                            <line x1="30" y1="68" x2="35" y2="45" stroke="#d4af37" stroke-width="1"/>
                            <line x1="70" y1="68" x2="65" y2="45" stroke="#d4af37" stroke-width="1"/>
                            <line x1="40" y1="69" x2="42" y2="42" stroke="#d4af37" stroke-width="1"/>
                            <line x1="60" y1="69" x2="58" y2="42" stroke="#d4af37" stroke-width="1"/>
                            <circle cx="50" cy="72" r="3" fill="#d4af37"/>
                        </g>
                    </svg>`;
                    break;
            }
            
            puppet.innerHTML = svgContent;
            puppet.style.width = width + 'px';
            puppet.style.height = height + 'px';
            puppet.dataset.rotation = '0';
            puppet.dataset.type = type;
            
            // 添加关节点
            const joint = document.createElement('div');
            joint.className = 'joint';
            joint.style.left = (width / 2 - 6) + 'px';
            joint.style.top = (height / 2 - 6) + 'px';
            joint.title = '点击选中，滚轮旋转';
            puppet.appendChild(joint);
            
            // 事件监听
            puppet.addEventListener('mousedown', startDrag);
            puppet.addEventListener('click', selectPart);
            
            stage.appendChild(puppet);
            return puppet;
        }

        // 拖拽开始
        function startDrag(e) {
            if (e.target.classList.contains('joint')) return;
            
            isDragging = true;
            draggedElement = e.currentTarget;
            const rect = draggedElement.getBoundingClientRect();
            dragOffset.x = e.clientX - rect.left;
            dragOffset.y = e.clientY - rect.top;
            
            draggedElement.classList.add('dragging');
            e.preventDefault();
        }

        // 选择部件
        function selectPart(e) {
            if (isDragging) return;
            
            document.querySelectorAll('.puppet').forEach(p => p.classList.remove('selected'));
            e.currentTarget.classList.add('selected');
            selectedPart = e.currentTarget;
            e.stopPropagation();
        }

        // 鼠标移动
        document.addEventListener('mousemove', (e) => {
            if (isDragging && draggedElement) {
                const stageRect = stage.getBoundingClientRect();
                let x = e.clientX - stageRect.left - dragOffset.x;
                let y = e.clientY - stageRect.top - dragOffset.y;
                
                // 边界限制
                x = Math.max(0, Math.min(x, stageRect.width - draggedElement.offsetWidth));
                y = Math.max(0, Math.min(y, stageRect.height - draggedElement.offsetHeight));
                
                draggedElement.style.left = x + 'px';
                draggedElement.style.top = y + 'px';
            }
        });

        // 鼠标释放
        document.addEventListener('mouseup', () => {
            if (draggedElement) {
                draggedElement.classList.remove('dragging');
            }
            isDragging = false;
            draggedElement = null;
        });

        // 滚轮旋转
        document.addEventListener('wheel', (e) => {
            if (selectedPart) {
                e.preventDefault();
                let rotation = parseFloat(selectedPart.dataset.rotation) || 0;
                rotation += e.deltaY > 0 ? 5 : -5;
                selectedPart.dataset.rotation = rotation;
                selectedPart.style.transform = `rotate(${rotation}deg)`;
            }
        }, { passive: false });

        // 点击空白处取消选择
        stage.addEventListener('click', (e) => {
            if (e.target === stage || e.target.id === 'curtain' || e.target.id === 'lighting') {
                document.querySelectorAll('.puppet').forEach(p => p.classList.remove('selected'));
                selectedPart = null;
            }
        });

        // 部件面板拖拽
        document.querySelectorAll('.part-item').forEach(item => {
            item.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('part-type', item.dataset.part);
            });
        });

        // 舞台放置
        stage.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        stage.addEventListener('drop', (e) => {
            e.preventDefault();
            const partType = e.dataTransfer.getData('part-type');
            if (partType) {
                const stageRect = stage.getBoundingClientRect();
                const x = e.clientX - stageRect.left - 50;
                const y = e.clientY - stageRect.top - 50;
                createPuppetPart(partType, x, y);
            }
        });

        // 灯光控制
        document.getElementById('light-hue').addEventListener('input', updateLighting);
        document.getElementById('light-brightness').addEventListener('input', updateLighting);

        function updateLighting() {
            const hue = document.getElementById('light-hue').value;
            const brightness = document.getElementById('light-brightness').value;
            const lighting = document.getElementById('lighting');
            
            lighting.style.background = `radial-gradient(ellipse at 50% 40%, 
                hsla(${hue}, 80%, ${brightness}%, 0.3) 0%, 
                hsla(${hue}, 60%, ${brightness - 20}%, 0.1) 30%, 
                transparent 60%)`;
        }

        // 幕布纹理切换
        function changeTexture(type) {
            const curtain = document.getElementById('curtain');
            switch(type) {
                case 'smooth':
                    curtain.style.background = 
                        `radial-gradient(ellipse at 30% 50%, rgba(255,200,100,0.15) 0%, transparent 50%),
                         radial-gradient(ellipse at 70% 50%, rgba(255,180,80,0.1) 0%, transparent 50%)`;
                    break;
                case 'rough':
                    curtain.style.background = 
                        `radial-gradient(ellipse at 30% 50%, rgba(255,200,100,0.15) 0%, transparent 50%),
                         radial-gradient(ellipse at 70% 50%, rgba(255,180,80,0.1) 0%, transparent 50%),
                         repeating-linear-gradient(90deg, rgba(139,69,19,0.15) 0px, rgba(160,82,45,0.15) 1px, rgba(139,69,19,0.15) 2px)`;
                    break;
                case 'pattern':
                    curtain.style.background = 
                        `radial-gradient(ellipse at 30% 50%, rgba(255,200,100,0.15) 0%, transparent 50%),
                         radial-gradient(ellipse at 70% 50%, rgba(255,180,80,0.1) 0%, transparent 50%),
                         radial-gradient(circle at 20% 30%, rgba(139,105,20,0.1) 0%, transparent 20%),
                         radial-gradient(circle at 80% 70%, rgba(139,105,20,0.1) 0%, transparent 20%)`;
                    break;
            }
        }

        // 清空舞台
        function clearStage() {
            document.querySelectorAll('.puppet').forEach(puppet => puppet.remove());
            selectedPart = null;
        }

        // 重置位置
        function resetPuppets() {
            document.querySelectorAll('.puppet').forEach((puppet, index) => {
                const stageRect = stage.getBoundingClientRect();
                puppet.style.left = (stageRect.width / 2 - 50 + (index - 2) * 120) + 'px';
                puppet.style.top = (stageRect.height / 2 - 50) + 'px';
                puppet.dataset.rotation = '0';
                puppet.style.transform = 'rotate(0deg)';
            });
        }

        // 录制功能
        async function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { 
                        mediaSource: 'screen',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                });

                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'video/webm;codecs=vp9'
                });

                recordedChunks = [];
                
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) {
                        recordedChunks.push(e.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `影戏乾坤_${new Date().toLocaleString().replace(/[/:]/g, '-')}.webm`;
                    a.click();
                    URL.revokeObjectURL(url);
                    
                    document.getElementById('download-btn').style.display = 'inline-block';
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                recordStartTime = Date.now();
                
                document.getElementById('record-btn').textContent = '停止录制';
                document.getElementById('record-btn').classList.add('recording');
                document.getElementById('record-indicator').classList.add('active');
                
                // 更新录制时间
                recordTimer = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - recordStartTime) / 1000);
                    const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
                    const seconds = (elapsed % 60).toString().padStart(2, '0');
                    document.getElementById('record-time').textContent = `${minutes}:${seconds}`;
                }, 1000);

            } catch (err) {
                alert('录制失败: ' + err.message);
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                
                document.getElementById('record-btn').textContent = '开始录制';
                document.getElementById('record-btn').classList.remove('recording');
                document.getElementById('record-indicator').classList.remove('active');
                
                clearInterval(recordTimer);
                document.getElementById('record-time').textContent = '00:00';
            }
        }

        function downloadRecording() {
            // 重新触发下载
            if (recordedChunks.length > 0) {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `影戏乾坤_${new Date().toLocaleString().replace(/[/:]/g, '-')}.webm`;
                a.click();
                URL.revokeObjectURL(url);
            }
        }

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Delete' || e.key === 'Backspace') {
                if (selectedPart) {
                    selectedPart.remove();
                    selectedPart = null;
                }
            }
            if (e.key === 'r' || e.key === 'R') {
                if (selectedPart) {
                    selectedPart.dataset.rotation = '0';
                    selectedPart.style.transform = 'rotate(0deg)';
                }
            }
        });

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 预置几个部件
            const stageRect = stage.getBoundingClientRect();
            const centerX = stageRect.width / 2;
            const centerY = stageRect.height / 2;
            
            createPuppetPart('head', centerX - 50, centerY - 150);
            createPuppetPart('body', centerX - 50, centerY - 50);
            createPuppetPart('arm-left', centerX - 130, centerY - 40);
            createPuppetPart('arm-right', centerX + 50, centerY - 40);
            createPuppetPart('leg-left', centerX - 40, centerY + 70);
            createPuppetPart('leg-right', centerX + 10, centerY + 70);
        });

        // 防止页面滚动
        document.addEventListener('wheel', (e) => {
            if (selectedPart) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
