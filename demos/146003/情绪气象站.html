<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情绪气象站 · Mood Weather v3.0</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --pink:#fce7f3;--pink2:#fbcfe8;--pink3:rgba(255,200,220,.6);
    --blue:#dbeafe;--blue2:#bfdbfe;--blue3:rgba(190,219,254,.7);
    --lav:#ede9fe;--lav2:#ddd6fe;--lav3:rgba(221,214,254,.6);
    --peach:#fef3c7;--peach2:#fde68a;--peach3:rgba(253,230,138,.6);
    --mint:#d1fae5;--mint2:#a7f3d0;--mint3:rgba(167,243,208,.6);
    --ink:#4c1d95;--ink2:#6d28d9;--rose:#ec4899;--rose2:#f472b6;
    --sky:#3b82f6;--sky2:#60a5fa;--muted:#a78bfa;--soft:#faf5ff;--card:#fff;
  }
  body{font-family:'Comfortaa','PingFang SC',sans-serif;
    background:linear-gradient(135deg,#fce7f3 0%,#ede9fe 30%,#dbeafe 65%,#d1fae5 100%);
    background-attachment:fixed;color:var(--ink);min-height:100vh;overflow-x:hidden;position:relative}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(circle at 20% 20%,rgba(236,72,153,.08),transparent 40%),
      radial-gradient(circle at 80% 80%,rgba(59,130,246,.08),transparent 40%)}
  /* 浮动云朵 */
  .cloud{position:fixed;pointer-events:none;z-index:0;opacity:.6;filter:blur(2px)}
  .cloud.c1{top:8%;left:-10%;font-size:80px;animation:cloudDrift 60s linear infinite}
  .cloud.c2{top:35%;right:-10%;font-size:60px;animation:cloudDrift 50s linear infinite reverse;animation-delay:10s;opacity:.4}
  .cloud.c3{top:65%;left:-5%;font-size:100px;animation:cloudDrift 70s linear infinite;animation-delay:20s;opacity:.3}
  .cloud.c4{top:15%;right:20%;font-size:50px;animation:cloudDrift 40s linear infinite reverse;animation-delay:5s;opacity:.5}
  @keyframes cloudDrift{from{transform:translateX(-30vw)}to{transform:translateX(110vw)}}
  .rain-drop{position:fixed;top:-20px;font-size:14px;color:var(--blue2);opacity:.5;pointer-events:none;z-index:0;animation:rainFall 1.2s linear infinite}
  @keyframes rainFall{0%{transform:translateY(0);opacity:0}10%{opacity:.5}100%{transform:translateY(110vh);opacity:0}}

  /* 顶栏 */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.6);backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.5);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
    box-shadow:0 4px 14px rgba(108,40,217,.06);border-radius:0 0 18px 18px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-cloud{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--rose),var(--sky));
    display:flex;align-items:center;justify-content:center;font-size:22px;
    box-shadow:0 6px 18px rgba(236,72,153,.3);position:relative;animation:brandFloat 3s ease-in-out infinite}
  @keyframes brandFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .brand h1{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:1px}
  .brand h1 .heart{display:inline-block;animation:heartBeat 1.2s infinite;color:var(--rose);margin-left:4px}
  @keyframes heartBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
  .brand .sub{font-size:10px;color:var(--ink2);letter-spacing:2px}
  .top-nav{display:flex;gap:6px;align-items:center}
  .tn{padding:8px 16px;background:rgba(255,255,255,.6);border:1px solid rgba(167,139,250,.3);
    color:var(--ink2);border-radius:20px;font-size:12px;cursor:pointer;transition:all .25s;font-family:inherit;letter-spacing:1px;
    backdrop-filter:blur(10px)}
  .tn:hover{background:linear-gradient(135deg,var(--rose),var(--ink2));color:#fff;border-color:transparent;transform:translateY(-2px);box-shadow:0 4px 12px rgba(236,72,153,.3)}
  .date-pill{display:flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(255,255,255,.6);
    border:1px solid rgba(167,139,250,.3);border-radius:20px;font-size:12px;font-weight:600;backdrop-filter:blur(10px)}
  .date-pill .ic{font-size:14px}

  main{max-width:1100px;margin:0 auto;padding:24px 24px 40px;position:relative;z-index:1}

  /* 今日天气大卡 */
  .today-hero{position:relative;
    background:linear-gradient(135deg,var(--peach2) 0%,var(--rose2) 100%);
    border-radius:32px;padding:32px;margin-bottom:24px;overflow:hidden;
    box-shadow:0 14px 40px rgba(244,114,182,.2)}
  .today-hero::before{content:'';position:absolute;top:0;right:0;width:300px;height:300px;
    background:radial-gradient(circle,rgba(255,255,255,.3),transparent 60%);border-radius:50%;transform:translate(40%,-40%)}
  .today-hero::after{content:'☀️';position:absolute;top:-30px;right:-30px;font-size:200px;opacity:.15;transform:rotate(15deg)}
  .th-grid{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;position:relative;z-index:1}
  .th-emoji{font-size:100px;animation:heroBob 3s ease-in-out infinite;filter:drop-shadow(0 6px 20px rgba(0,0,0,.15))}
  @keyframes heroBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
  .th-text .tag{font-size:11px;letter-spacing:4px;color:rgba(255,255,255,.85);margin-bottom:6px}
  .th-text h2{font-size:36px;font-weight:800;color:#fff;margin-bottom:10px;text-shadow:0 2px 10px rgba(0,0,0,.1)}
  .th-text p{font-size:14px;color:rgba(255,255,255,.95);line-height:1.7;max-width:500px}
  .th-stats{display:flex;flex-direction:column;gap:10px;text-align:right}
  .th-stat{background:rgba(255,255,255,.25);backdrop-filter:blur(10px);padding:10px 16px;border-radius:14px;
    border:1px solid rgba(255,255,255,.4);min-width:140px}
  .th-stat .ts-l{font-size:10px;color:rgba(255,255,255,.85);letter-spacing:2px}
  .th-stat .ts-v{font-size:18px;font-weight:800;color:#fff;margin-top:2px}
  .th-stat .ts-d{font-size:11px;color:rgba(255,255,255,.85);margin-top:2px}

  /* 标签 - 胶囊 */
  .pill-tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;justify-content:center}
  .ptab{padding:11px 22px;background:rgba(255,255,255,.7);border:2px solid transparent;color:var(--ink2);
    border-radius:30px;cursor:pointer;font-size:13px;font-weight:600;transition:all .3s;font-family:inherit;
    letter-spacing:1px;backdrop-filter:blur(10px);box-shadow:0 4px 10px rgba(108,40,217,.05);
    display:flex;align-items:center;gap:6px}
  .ptab:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(108,40,217,.12);border-color:rgba(167,139,250,.4)}
  .ptab.active{background:linear-gradient(135deg,var(--rose),var(--ink2));color:#fff;border-color:transparent;
    box-shadow:0 6px 18px rgba(236,72,153,.35);font-weight:700}
  .ptab .badge{padding:1px 7px;background:rgba(255,255,255,.3);border-radius:8px;font-size:10px;font-weight:700}
  .ptab.active .badge{background:rgba(0,0,0,.2)}

  .panel{display:none;animation:bounceIn .5s}
  .panel.active{display:block}
  @keyframes bounceIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}

  /* 情绪卡 - 拟物天气气泡 */
  .mood-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;margin-bottom:30px}
  .mood-card{position:relative;background:var(--card);border-radius:24px;padding:20px;text-align:center;cursor:pointer;
    transition:all .4s cubic-bezier(.34,1.56,.64,1);border:2px solid transparent;box-shadow:0 6px 20px rgba(108,40,217,.06);
    overflow:hidden}
  .mood-card::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;border-radius:24px 24px 0 0;opacity:.7}
  .mood-card:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 16px 36px rgba(108,40,217,.15);border-color:currentColor}
  .mood-card.sunny{color:#f59e0b;background:linear-gradient(180deg,rgba(254,249,195,.6) 0%,#fff 50%)}
  .mood-card.cloudy{color:#6366f1;background:linear-gradient(180deg,rgba(224,231,255,.6) 0%,#fff 50%)}
  .mood-card.rainy{color:var(--sky);background:linear-gradient(180deg,rgba(219,234,254,.6) 0%,#fff 50%)}
  .mood-card.stormy{color:var(--rose);background:linear-gradient(180deg,rgba(252,231,243,.6) 0%,#fff 50%)}
  .mood-card.rainbow{color:#10b981;background:linear-gradient(180deg,rgba(209,250,229,.6) 0%,#fff 50%)}
  .mood-card .m-emoji{font-size:48px;margin-bottom:8px;display:block;position:relative;z-index:1;
    filter:drop-shadow(0 4px 8px currentColor);animation:moodBob 3s ease-in-out infinite}
  @keyframes moodBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .mood-card .m-name{font-size:16px;font-weight:700;color:var(--ink);position:relative;z-index:1}
  .mood-card .m-en{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:1px;position:relative;z-index:1}
  .mood-card .m-desc{font-size:12px;color:var(--ink2);margin-top:10px;line-height:1.5;position:relative;z-index:1;opacity:.85}
  .mood-card .m-temp{display:inline-block;margin-top:10px;padding:3px 10px;background:rgba(255,255,255,.6);border-radius:12px;
    font-size:11px;font-weight:700;color:currentColor;position:relative;z-index:1}

  /* 雷达图 - 情绪能量 */
  .radar-box{background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(252,231,243,.4));
    border:2px solid rgba(236,72,153,.2);border-radius:24px;padding:24px;margin-bottom:30px;
    box-shadow:0 8px 24px rgba(108,40,217,.08)}
  .radar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
  .radar-title{font-size:16px;color:var(--ink);font-weight:700;display:flex;align-items:center;gap:8px}
  .radar-title::before{content:'📡';font-size:18px}
  .radar-stage{display:flex;align-items:center;justify-content:center;gap:30px;flex-wrap:wrap}
  .radar-svg{filter:drop-shadow(0 4px 12px rgba(236,72,153,.2))}
  .radar-legend{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;min-width:180px}
  .rl-item{display:flex;align-items:center;gap:6px;padding:6px 10px;background:rgba(255,255,255,.5);border-radius:10px;font-size:12px}
  .rl-item .rl-d{width:10px;height:10px;border-radius:50%}
  .rl-item .rl-n{flex:1;color:var(--ink2);font-weight:600}
  .rl-item .rl-v{color:var(--rose);font-weight:700;font-family:monospace}

  /* 情绪预报 */
  .forecast{background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(219,234,254,.4));
    border:2px solid rgba(59,130,246,.2);border-radius:24px;padding:24px;margin-bottom:30px;
    box-shadow:0 8px 24px rgba(108,40,217,.08)}
  .fc-head{font-size:16px;color:var(--ink);font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .fc-week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
  .fday{text-align:center;padding:14px 6px;background:rgba(255,255,255,.6);border-radius:16px;cursor:pointer;
    transition:all .3s;border:2px solid transparent;position:relative;overflow:hidden}
  .fday:hover{transform:translateY(-4px);box-shadow:0 8px 16px rgba(108,40,217,.1);border-color:rgba(167,139,250,.4)}
  .fday.today{background:linear-gradient(135deg,var(--rose),var(--ink2));color:#fff;border-color:transparent}
  .fday .fd-dow{font-size:11px;font-weight:700;letter-spacing:1px;opacity:.7}
  .fday .fd-em{font-size:32px;margin:6px 0;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.1))}
  .fday .fd-temp{font-size:12px;font-weight:700;margin-top:4px}
  .fday .fd-name{font-size:10px;margin-top:2px;opacity:.8}
  .fday .fd-bar{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.5)}
  .fday .fd-bar-fill{height:100%;background:linear-gradient(90deg,var(--rose),var(--sky))}

  /* 日记 */
  .diary-list{display:flex;flex-direction:column;gap:14px;margin-bottom:30px}
  .diary{background:var(--card);border-radius:20px;padding:18px 22px;display:flex;gap:16px;align-items:flex-start;
    transition:all .3s;box-shadow:0 4px 14px rgba(108,40,217,.06);cursor:pointer;border:2px solid transparent}
  .diary:hover{transform:translateX(6px);box-shadow:0 8px 20px rgba(108,40,217,.12);border-color:rgba(236,72,153,.2)}
  .diary .d-emoji{font-size:40px;flex-shrink:0;animation:moodBob 3s infinite}
  .diary .d-body{flex:1}
  .diary .d-date{font-size:11px;color:var(--muted);letter-spacing:2px;font-weight:600}
  .diary .d-title{font-size:16px;font-weight:700;color:var(--ink);margin:4px 0 6px}
  .diary .d-text{font-size:13px;color:var(--ink2);line-height:1.7}
  .diary .d-tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .d-tag{font-size:11px;padding:4px 12px;border-radius:14px;font-weight:600;color:#fff}

  /* 舒缓轮播 */
  .soothe{position:relative;overflow:hidden;border-radius:24px;margin-bottom:24px;
    background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(167,139,250,.15));
    border:2px solid rgba(167,139,250,.2);box-shadow:0 8px 24px rgba(108,40,217,.08)}
  .soothe-track{display:flex;transition:transform .5s cubic-bezier(.4,0,.2,1)}
  .soothe-slide{min-width:100%;padding:40px 30px;text-align:center}
  .soothe-slide .s-icon{font-size:72px;margin-bottom:16px;display:block;animation:moodBob 3s infinite}
  .soothe-slide .s-title{font-size:22px;font-weight:700;color:var(--ink);margin-bottom:12px;letter-spacing:1px}
  .soothe-slide .s-text{font-size:14px;color:var(--ink2);line-height:1.8;max-width:520px;margin:0 auto}
  .soothe-slide .s-steps{display:flex;justify-content:center;gap:14px;margin-top:20px;flex-wrap:wrap}
  .s-step{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);padding:8px 14px;
    background:rgba(255,255,255,.6);border-radius:20px;font-weight:600}
  .s-step .step-num{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--ink2));
    color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
  .soothe-nav{display:flex;gap:8px;justify-content:center;padding:10px 0 20px}
  .soothe-nav .sn{width:10px;height:10px;border-radius:50%;background:rgba(167,139,250,.3);cursor:pointer;transition:all .3s}
  .soothe-nav .sn.active{background:linear-gradient(90deg,var(--rose),var(--ink2));width:30px;border-radius:5px}
  .soothe-btns{display:flex;gap:8px;justify-content:center;padding:0 20px 20px}
  .sbtn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.6);border:1px solid rgba(167,139,250,.3);
    color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s;font-family:inherit}
  .sbtn:hover{background:linear-gradient(135deg,var(--rose),var(--ink2));color:#fff;border-color:transparent}

  /* 能量图 */
  .energy-box{background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(253,230,138,.4));
    border:2px solid rgba(245,158,11,.2);border-radius:24px;padding:24px;margin-bottom:24px;
    box-shadow:0 8px 24px rgba(108,40,217,.08)}
  .eb-head{font-size:16px;color:var(--ink);font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .bar-chart{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px}
  .bc-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
  .bc-bar{width:100%;max-width:36px;border-radius:10px 10px 0 0;transition:all .4s cubic-bezier(.34,1.56,.64,1);min-height:6px;position:relative}
  .bc-col:hover .bc-bar{transform:scaleY(1.05);filter:brightness(1.1)}
  .bc-bar .bc-val{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--ink);
    background:rgba(255,255,255,.8);padding:2px 6px;border-radius:6px;opacity:0;transition:opacity .3s;font-weight:700;white-space:nowrap}
  .bc-col:hover .bc-val{opacity:1}
  .bc-lbl{font-size:11px;color:var(--muted);font-weight:600}

  footer{text-align:center;padding:32px 0;color:var(--ink2);font-size:13px;letter-spacing:2px}
  footer .deco{font-size:22px;margin-bottom:6px;letter-spacing:8px}

  @media(max-width:900px){
    .th-grid{grid-template-columns:auto 1fr;gap:16px}
    .th-stats{grid-column:1/-1;flex-direction:row;justify-content:space-around}
    .th-stat{min-width:auto;flex:1}
  }
  @media(max-width:600px){
    main{padding:18px 14px 30px}
    .topbar{padding:12px 14px}
    .today-hero{padding:24px}
    .th-emoji{font-size:80px}
    .th-text h2{font-size:24px}
    .th-stats{flex-direction:column;align-items:stretch}
    .mood-grid{grid-template-columns:repeat(2,1fr)}
    .fc-week{grid-template-columns:repeat(4,1fr)}
    .radar-stage{flex-direction:column}
    .top-nav{display:none}
  }
</style>
</head>
<body>
<!-- 装饰元素 -->
<div class="cloud c1">☁️</div>
<div class="cloud c2">☁️</div>
<div class="cloud c3">⛅</div>
<div class="cloud c4">☁️</div>

<!-- 顶栏 -->
<header class="topbar" role="banner">
  <div class="brand">
    <div class="brand-cloud" aria-label="品牌">⛅</div>
    <div>
      <h1>情绪气象站<span class="heart">💗</span></h1>
      <div class="sub">MOOD WEATHER · 每种心情都是一种天气</div>
    </div>
  </div>
  <nav class="top-nav" aria-label="导航">
    <button class="tn">📔 我的日记</button>
    <button class="tn">📊 情绪分析</button>
    <button class="tn">🧘 舒缓中心</button>
  </nav>
  <div class="date-pill"><span class="ic">📅</span>7月12日 · 周日</div>
</header>

<main>
  <!-- 今日天气 -->
  <section class="today-hero" aria-label="今日情绪天气">
    <div class="th-grid">
      <div class="th-emoji">⛅</div>
      <div class="th-text">
        <div class="tag">▸ TODAY'S WEATHER</div>
        <h2>今日多云转晴</h2>
        <p>情绪整体平稳,偶有云层遮挡。下午至傍晚阳光会逐渐穿透云层,建议给重要安排留到下午。整体向好,记得给自己一个微笑～</p>
      </div>
      <div class="th-stats">
        <div class="th-stat"><div class="ts-l">情绪指数</div><div class="ts-v">72</div><div class="ts-d">良好 ↑5</div></div>
        <div class="th-stat"><div class="ts-l">能量等级</div><div class="ts-v">B+</div><div class="ts-d">充沛</div></div>
      </div>
    </div>
  </section>

  <!-- 标签 -->
  <nav class="pill-tabs" role="tablist">
    <button class="ptab active" data-t="mood">🌤️ 情绪天气</button>
    <button class="ptab" data-t="radar">📡 情绪雷达</button>
    <button class="ptab" data-t="forecast">📅 情绪预报</button>
    <button class="ptab" data-t="diary">📔 心情日记</button>
    <button class="ptab" data-t="soothe">🧘 舒缓指南</button>
    <button class="ptab" data-t="energy">📊 能量趋势</button>
  </nav>

  <!-- 情绪天气 -->
  <section class="panel active" id="p-mood">
    <div class="mood-grid" id="moodGrid"></div>
  </section>

  <!-- 雷达 -->
  <section class="panel" id="p-radar">
    <div class="radar-box">
      <div class="radar-head">
        <div class="radar-title">情绪雷达 · 本周能量维度</div>
        <div style="font-size:11px;color:var(--muted);font-family:monospace">UPDATED 1分钟前</div>
      </div>
      <div class="radar-stage">
        <svg class="radar-svg" width="280" height="280" viewBox="0 0 280 280">
          <defs><radialGradient id="radarG" cx="50%" cy="50%"><stop offset="0%" stop-color="#ec4899" stop-opacity=".3"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".1"/></radialGradient></defs>
          <g transform="translate(140,140)">
            <polygon points="0,-100 95,-31 59,81 -59,81 -95,-31" fill="none" stroke="#a78bfa" stroke-width="1" opacity=".3"/>
            <polygon points="0,-80 76,-25 47,65 -47,65 -76,-25" fill="none" stroke="#a78bfa" stroke-width="1" opacity=".3"/>

          <div class="rl-item"><span class="rl-d" style="background:#ec4899"></span><span class="rl-n">幸福感</span><span class="rl-v">78</span></div>
          <div class="rl-item"><span class="rl-d" style="background:#f472b6"></span><span class="rl-n">活力</span><span class="rl-v">72</span></div>
          <div class="rl-item"><span class="rl-d" style="background:#a78bfa"></span><span class="rl-n">专注</span><span class="rl-v">85</span></div>
          <div class="rl-item"><span class="rl-d" style="background:#60a5fa"></span><span class="rl-n">平静</span><span class="rl-v">65</span></div>

  <section class="panel" id="p-forecast">

  <section class="panel" id="p-diary">

      <div class="soothe-btns">
        <button class="sbtn" id="sPrev">‹</button>
        <button class="sbtn" id="sNext">›</button>
      </div>

  <!-- 能量 -->
  <section class="panel" id="p-energy">
    <div class="energy-box">
      <div class="eb-head">📊 近7日情绪能量值</div>
      <div class="bar-chart" id="energyChart"></div>

</main>

<script>
const moods=[
  {e:'☀️',n:'晴朗',en:'Sunny',d:'心情明媚,能量充沛,适合创造与分享',cls:'sunny',t:'25°',tag:'#元气满满',c:'#f59e0b'},
  {e:'⛅',n:'多云',en:'Cloudy',d:'情绪平稳,偶有波动,但整体可控',cls:'cloudy',t:'22°',tag:'#平静',c:'#6366f1'},
  {e:'🌧️',n:'小雨',en:'Light Rain',d:'有些低落,需要被温柔对待',cls:'rainy',t:'18°',tag:'#需要拥抱',c:'#3b82f6'},
  {e:'⛈️',n:'雷暴',en:'Storm',d:'情绪激烈,建议先深呼吸冷静',cls:'stormy',t:'15°',tag:'#需要冷静',c:'#ec4899'},
  {e:'🌈',n:'彩虹',en:'Rainbow',d:'雨过天晴,充满希望与感恩',cls:'rainbow',t:'26°',tag:'#充满希望',c:'#10b981'}];
const mg=document.getElementById('moodGrid');
moods.forEach(m=>{
  const c=document.createElement('div');c.className='mood-card '+m.cls;c.tabIndex=0;
  c.innerHTML=`<span class="m-emoji">${m.e}</span>
    <div class="m-name">${m.n}</div>
    <div class="m-en">${m.en}</div>
    <div class="m-desc">${m.d}</div>
    <div class="m-temp">${m.t} · ${m.tag}</div>`;
  c.onclick=()=>{c.style.animation='pulse 0.4s';setTimeout(()=>c.style.animation='',400);};
  mg.appendChild(c);
});
const pulseStyle=document.createElement('style');pulseStyle.textContent='@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}';document.head.appendChild(pulseStyle);

document.querySelectorAll('.ptab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.ptab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  t.classList.add('active');document.getElementById('p-'+t.dataset.t).classList.add('active');
});

const week=[
  {dow:'周一',e:'☀️',t:'晴',n:'元气满满',v:90},{dow:'周二',e:'⛅',t:'多云',n:'平稳',v:75},
  {dow:'周三',e:'🌧️',t:'小雨',n:'有点累',v:55},{dow:'周四',e:'⛅',t:'转晴',n:'好转',v:72},
  {dow:'周五',e:'☀️',t:'晴',n:'期待周末',v:88},{dow:'周六',e:'🌈',t:'彩虹',n:'很快乐',v:95},
  {dow:'周日',e:'⛅',t:'多云',n:'放松',v:78}];
const fw=document.getElementById('fcWeek');
const today=0;
week.forEach((w,i)=>{
  const c=document.createElement('div');c.className='fday'+(i===today?' today':'');
  c.innerHTML=`<div class="fd-dow">${w.dow}</div><span class="fd-em">${w.e}</span>
    <div class="fd-temp">${w.t}</div><div class="fd-name">${w.n}</div>
    <div class="fd-bar"><div class="fd-bar-fill" style="width:${w.v}%"></div></div>`;
  fw.appendChild(c);
});

const diaries=[
  {e:'☀️',date:'7月11日 周六',title:'公园里的野餐',mood:'治愈',text:'和好友去公园野餐,阳光晒在身上暖洋洋的。躺在草地上看云朵变形,觉得生活真美好。',tags:['#治愈','#友情','#阳光'],colors:['#f59e0b','#ec4899','#3b82f6']},
  {e:'🌧️',date:'7月10日 周五',title:'被否定的一天',mood:'低落',text:'方案被否了,心情像被雨淋湿。但回家的路上看到一只流浪猫冲我喵喵叫,突然觉得也没那么糟。',tags:['#低谷','#被治愈'],colors:['#3b82f6','#ec4899']},
  {e:'🌈',date:'7月9日 周四',title:'收到意外的礼物',mood:'感动',text:'同事送了我一束花,说"看你最近辛苦"。原来我的努力有人看在眼里。雨天里突然出现彩虹。',tags:['#感动','#惊喜'],colors:['#ec4899','#f59e0b']},
  {e:'⛅',date:'7月8日 周三',title:'普通的星期三',mood:'平淡',text:'没什么特别的事发生。上了班,下了班,吃了饭,看了会儿书。平淡,但也很安心。',tags:['#平淡','#安心'],colors:['#6366f1','#10b981']},
  {e:'⛈️',date:'7月7日 周二',title:'和妈妈吵架了',mood:'后悔',text:'因为一点小事和妈妈在电话里吵起来。挂了电话很后悔。明明彼此关心,为什么总用错方式表达？',tags:['#后悔','#需要沟通'],colors:['#ef4444','#f59e0b']}];
const dl=document.getElementById('diaryList');
diaries.forEach(d=>{
  const tags=d.tags.map((t,i)=>`<span class="d-tag" style="background:${d.colors[i]}">${t}</span>`).join('');
  const c=document.createElement('div');c.className='diary';
  c.innerHTML=`<div class="d-emoji">${d.e}</div>
    <div class="d-body"><div class="d-date">${d.date} · ${d.mood}</div>
      <div class="d-title">${d.title}</div>
      <div class="d-text">${d.text}</div><div class="d-tags">${tags}</div></div>`;
  dl.appendChild(c);
});

const soothe=[
  {i:'🌬️',t:'4-7-8 呼吸法',text:'吸气4秒,屏息7秒,呼气8秒。重复4个循环。这个简单的呼吸法能快速激活副交感神经,让心跳放缓,焦虑在呼吸间被慢慢带走。',steps:['吸气 4秒','屏息 7秒','呼气 8秒','重复 4次']},
  {i:'🤗',t:'蝴蝶拥抱法',text:'双臂交叉抱住自己,双手轻拍肩膀,左右交替缓慢拍打。这个来自EMDR疗法的技巧,能带来安全感,像在给自己一个温柔的拥抱。',steps:['双臂交叉','手放肩上','左右轻拍','感受温暖']},
  {i:'🌿',t:'五感着陆法',text:'当情绪汹涌时,用五感把自己拉回当下:找5件能看到的东西,4件能摸到的,3件能听到的,2件能闻到的,1件能尝到的。',steps:['看 5样','摸 4样','听 3样','闻 2样','尝 1样']},
  {i:'✍️',t:'情绪书写法',text:'拿出一张纸,把此刻所有的感受不加修饰地写下来。不用担心逻辑和文笔,写完后可以把纸揉成团扔掉,象征把情绪释放出去。',steps:['准备纸笔','尽情书写','不加修饰','揉团释放']}];
const st=document.getElementById('sootheTrack'),sn=document.getElementById('sootheNav');
soothe.forEach(s=>{
  const slide=document.createElement('div');slide.className='soothe-slide';
  const steps=s.steps.map((st,i)=>`<div class="s-step"><span class="step-num">${i+1}</span>${st}</div>`).join('');
  slide.innerHTML=`<span class="s-icon">${s.i}</span><div class="s-title">${s.t}</div>
    <div class="s-text">${s.text}</div><div class="s-steps">${steps}</div>`;
  st.appendChild(slide);
  const dot=document.createElement('div');dot.className='sn';sn.appendChild(dot);
});
let sCur=0;
function sGo(i){sCur=(i+soothe.length)%soothe.length;st.style.transform=`translateX(-${sCur*100}%)`;
  document.querySelectorAll('.sn').forEach((d,j)=>d.classList.toggle('active',j===sCur));}
sGo(0);
document.querySelectorAll('.sn').forEach((d,i)=>d.onclick=()=>sGo(i));
document.getElementById('sPrev').onclick=()=>sGo(sCur-1);
document.getElementById('sNext').onclick=()=>sGo(sCur+1);
setInterval(()=>sGo(sCur+1),6000);

const energy=[60,45,30,55,75,90,65];
const days=['周一','周二','周三','周四','周五','周六','周日'];
const colors=['#fbbf24','#818cf8','#60a5fa','#a78bfa','#34d399','#f472b6','#818cf8'];
const ec=document.getElementById('energyChart');
const maxE=Math.max(...energy);
energy.forEach((v,i)=>{
  const c=document.createElement('div');c.className='bc-col';
  c.innerHTML=`<div class="bc-bar" style="height:${v/maxE*100}%;background:linear-gradient(180deg,${colors[i]},${colors[i]}77)"><span class="bc-val">${v}</span></div><div class="bc-lbl">${days[i]}</div>`;
  ec.appendChild(c);
});
</script>
</body>
</html>
