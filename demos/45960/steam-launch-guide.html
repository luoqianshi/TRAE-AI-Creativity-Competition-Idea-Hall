<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam启航手册 - 独立游戏上架全流程导航</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #1a2332;
            --secondary-blue: #2d3e52;
            --accent-orange: #ff6b35;
            --accent-orange-hover: #ff8555;
            --text-light: #f5f5f5;
            --text-dim: #b0b0b0;
            --success-green: #4ecdc4;
            --border-radius: 12px;
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--secondary-blue) 100%);
            color: var(--text-light);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header Section */
        .header {
            text-align: center;
            padding: 60px 20px 40px;
            position: relative;
        }

        .header::before {
            content: '🎮';
            font-size: 3rem;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #fff, var(--accent-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header h2 {
            font-size: 1.2rem;
            color: var(--text-dim);
            margin-bottom: 20px;
        }

        .header p {
            color: var(--text-dim);
            font-style: italic;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Stage Selector */
        .stage-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .stage-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            padding: 15px 25px;
            border-radius: 30px;
            color: var(--text-light);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.95rem;
            backdrop-filter: blur(10px);
        }

        .stage-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .stage-btn.active {
            background: var(--accent-orange);
            border-color: var(--accent-orange);
            box-shadow: 0 4px 20px rgba(255, 107, 53, 0.4);
        }

        .stage-btn i {
            margin-right: 8px;
        }

        /* Timeline Section */
        .timeline-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--border-radius);
            padding: 30px;
            margin: 30px 0;
            backdrop-filter: blur(10px);
        }

        .section-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--accent-orange);
        }

        .timeline {
            display: flex;
            overflow-x: auto;
            gap: 20px;
            padding: 20px 0;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-orange) var(--secondary-blue);
        }

        .timeline::-webkit-scrollbar {
            height: 8px;
        }

        .timeline::-webkit-scrollbar-track {
            background: var(--secondary-blue);
            border-radius: 4px;
        }

        .timeline::-webkit-scrollbar-thumb {
            background: var(--accent-orange);
            border-radius: 4px;
        }

        .timeline-item {
            min-width: 200px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: var(--border-radius);
            padding: 20px;
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
            position: relative;
        }

        .timeline-item:hover {
            transform: translateY(-5px);
            border-color: var(--accent-orange);
        }

        .timeline-item.completed {
            opacity: 0.6;
        }

        .timeline-item.completed::after {
            content: '✓';
            position: absolute;
            top: 10px;
            right: 10px;
            color: var(--success-green);
            font-size: 1.2rem;
        }

        .timeline-time {
            font-size: 0.85rem;
            color: var(--accent-orange);
            margin-bottom: 8px;
        }

        .timeline-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .timeline-desc {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        /* Checklist Section */
        .checklist-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--border-radius);
            padding: 30px;
            margin: 30px 0;
            backdrop-filter: blur(10px);
        }

        .progress-bar-container {
            margin-bottom: 25px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-orange), var(--success-green));
            border-radius: 4px;
            transition: width 0.5s ease;
            width: 0%;
        }

        .checklist-items {
            display: grid;
            gap: 15px;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--border-radius);
            transition: var(--transition);
        }

        .checklist-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .checklist-item.completed {
            opacity: 0.6;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid var(--accent-orange);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .checkbox:hover {
            background: rgba(255, 107, 53, 0.2);
        }

        .checkbox.checked {
            background: var(--accent-orange);
        }

        .checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 0.8rem;
        }

        .item-content {
            flex: 1;
        }

        .item-title {
            font-weight: 500;
            margin-bottom: 5px;
        }

        .item-title.completed {
            text-decoration: line-through;
            color: var(--text-dim);
        }

        .item-time {
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .tip-btn {
            background: rgba(255, 107, 53, 0.2);
            border: 1px solid var(--accent-orange);
            padding: 8px 15px;
            border-radius: 20px;
            color: var(--accent-orange);
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
            white-space: nowrap;
        }

        .tip-btn:hover {
            background: var(--accent-orange);
            color: white;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: var(--secondary-blue);
            border-radius: var(--border-radius);
            padding: 30px;
            max-width: 500px;
            width: 90%;
            position: relative;
            animation: slideUp 0.3s ease;
            border: 1px solid rgba(255, 107, 53, 0.3);
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .modal-close:hover {
            color: var(--accent-orange);
        }

        .modal-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-title i {
            color: var(--accent-orange);
        }

        .modal-content {
            color: var(--text-dim);
            line-height: 1.8;
        }

        .modal-content h4 {
            color: var(--text-light);
            margin: 15px 0 8px;
        }

        .modal-content ul {
            margin-left: 20px;
        }

        .modal-content li {
            margin-bottom: 8px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 30px;
            margin-top: 40px;
        }

        .reset-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 12px 30px;
            border-radius: 25px;
            color: var(--text-light);
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition);
            margin-bottom: 20px;
        }

        .reset-btn:hover {
            background: rgba(255, 107, 53, 0.3);
            border-color: var(--accent-orange);
        }

        .copyright {
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.4s ease;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .stage-selector {
                flex-direction: column;
            }

            .stage-btn {
                width: 100%;
                text-align: center;
            }

            .timeline {
                flex-direction: column;
            }

            .timeline-item {
                min-width: 100%;
            }

            .checklist-item {
                flex-wrap: wrap;
            }

            .tip-btn {
                width: 100%;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🚢 Steam启航手册</h1>
            <h2>独立游戏上架全流程导航</h2>
            <p>"从开发完成到正式发售，每一步都有人带你避开暗礁。"</p>
        </header>

        <!-- Stage Selector -->
        <div class="stage-selector" id="stageSelector">
            <button class="stage-btn active" data-stage="1">
                <i class="fas fa-code"></i>刚完成开发
            </button>
            <button class="stage-btn" data-stage="2">
                <i class="fas fa-image"></i>正在准备商店页面
            </button>
            <button class="stage-btn" data-stage="3">
                <i class="fas fa-file-alt"></i>已提交审核
            </button>
            <button class="stage-btn" data-stage="4">
                <i class="fas fa-rocket"></i>即将发售
            </button>
        </div>

        <!-- Timeline Section -->
        <section class="timeline-section">
            <h3 class="section-title">
                <i class="fas fa-clock"></i>时间线视图
            </h3>
            <div class="timeline" id="timeline"></div>
        </section>

        <!-- Checklist Section -->
        <section class="checklist-section">
            <h3 class="section-title">
                <i class="fas fa-tasks"></i>任务清单
            </h3>
            <div class="progress-bar-container">
                <div class="progress-header">
                    <span>进度</span>
                    <span id="progressText">已完成 0/8</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
            <div class="checklist-items" id="checklist"></div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <button class="reset-btn" id="resetBtn">
                <i class="fas fa-redo"></i> 重新开始
            </button>
            <p class="copyright">© 2026 Steam启航手册 · 仅供学习交流</p>
        </footer>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="modal-close" id="modalClose">&times;</button>
            <h3 class="modal-title">
                <i class="fas fa-lightbulb"></i>
                <span id="modalTitle">优化建议</span>
            </h3>
            <div class="modal-content" id="modalContent"></div>
        </div>
    </div>

                            pitfalls: "常见踩坑点：\n• 忘记包含VC运行库\n• 游戏路径中包含中文字符\n• 缺少必要的DLL文件"

                            guide: "在Steam后台填写：游戏名称、类型、标签（最多20个）、简短描述（150字符）、详细描述。标签直接影响推荐流量！",

                            pitfalls: "常见踩坑点：\n• 定价过高影响转化\n• 忘记设置地区化定价\n• 首发折扣时间设置错误"

                ]
            },
            4: {
                name: "即将发售",
                timeline: [
                    { time: "距发售前7天", title: "最终测试", desc: "构建版本验证" },
                    { time: "距发售前3天", title: "倒计时设置", desc: "发售日配置" },
                    { time: "发售当天", title: "正式发售", desc: "发布上线公告" },
                    { time: "发售后", title: "持续更新", desc: "监控反馈与补丁" }
                ],
                tasks: [
                    {
                        id: "stage4_task1",
                        title: "最终测试构建版本",
                        time: "建议时间：距发售前7天",
                        tips: {
                            guide: "完整流程测试：\n• 下载并安装完整游戏\n• 新玩家从头到尾游玩\n• 验证成就系统\n• 测试存档功能\n• 验证云同步功能\n确保首发版本稳定运行。",
                            pitfalls: "常见踩坑点：\n• 未测试完整安装流程\n• 低配置机器未测试\n• 忘记测试成就/云存档"
                        }
                    },
                    {
                        id: "stage4_task2",
                        title: "配置发售日倒计时",
                        time: "建议时间：距发售前3天",
                        tips: {
                            guide: "Steam后台设置：\n• 确认发售时间（注意时区）\n• 设置愿望单公开\n• 配置折扣自动启用\n• 准备更新公告\n• 设置商店页可见。",
                            pitfalls: "常见踩坑点：\n• 时区换算错误\n• 折扣未在正确时间启用\n• 忘记公开愿望单"
                        }
                    },
                    {
                        id: "stage4_task3",
                        title: "发布上线公告",
                        time: "建议时间：发售当天",
                        tips: {
                            guide: "发售日公告内容：\n• 感谢语与发售公告\n• 游戏介绍与特色\n• 首发折扣信息\n• 已知问题说明（如有）\n• 社区链接\n• 联系方式\n多语言版本最佳。",
                            pitfalls: "常见踩坑点：\n• 发售日零点才发布公告\n• 忘记提及首发折扣\n• 公告语气过于生硬"
                        }
                    },
                    {
                        id: "stage4_task4",
                        title: "监控玩家反馈并及时更新补丁",
                        time: "建议时间：发售后持续进行",
                        tips: {
                            guide: "建立反馈监控：\n• 关注Steam讨论区\n• 监控社交媒体\n• 收集错误报告\n• 分类问题优先级\n• 快速修复严重bug\n• 定期发布更新日志。",
                            pitfalls: "常见踩坑点：\n• 严重bug修复不及时\n• 更新日志写不清楚\n• 补丁引入新问题"
                        }
                    }
                ]
            }
        };

        // Current state
        let currentStage = 1;
        let completedTasks = {};

        // DOM elements
        const stageSelector = document.getElementById('stageSelector');
        const timeline = document.getElementById('timeline');
        const checklist = document.getElementById('checklist');
        const progressText = document.getElementById('progressText');
        const progressFill = document.getElementById('progressFill');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalContent = document.getElementById('modalContent');
        const modalClose = document.getElementById('modalClose');
        const resetBtn = document.getElementById('resetBtn');

        // Load from localStorage
        function loadState() {
            const savedStage = localStorage.getItem('steamGuide_stage');
            const savedTasks = localStorage.getItem('steamGuide_tasks');

            if (savedStage) {
                currentStage = parseInt(savedStage);
                updateStageButtons();
            }

            if (savedTasks) {
                completedTasks = JSON.parse(savedTasks);
            }
        }

        // Save to localStorage
        function saveState() {
            localStorage.setItem('steamGuide_stage', currentStage);
            localStorage.setItem('steamGuide_tasks', JSON.stringify(completedTasks));
        }

        // Update stage button states
        function updateStageButtons() {
            const buttons = stageSelector.querySelectorAll('.stage-btn');
            buttons.forEach(btn => {
                btn.classList.remove('active');
                if (parseInt(btn.dataset.stage) === currentStage) {
                    btn.classList.add('active');
                }
            });
        }

        // Render timeline
        function renderTimeline() {
            const data = stageData[currentStage];
            timeline.innerHTML = '';

            data.timeline.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'timeline-item fade-in';
                div.style.animationDelay = `${index * 0.1}s`;

                // Check if any task in this timeline item is completed
                const taskIds = data.tasks.map(t => t.id);
                const hasCompleted = taskIds.some(id => completedTasks[id]);

                div.innerHTML = `
                    <div class="timeline-time">⏰ ${item.time}</div>
                    <div class="timeline-title">${item.title}</div>
                    <div class="timeline-desc">${item.desc}</div>
                `;

                timeline.appendChild(div);
            });
        }

        // Render checklist
        function renderChecklist() {
            const data = stageData[currentStage];
            checklist.innerHTML = '';

            data.tasks.forEach((task, index) => {
                const isCompleted = completedTasks[task.id];
                const div = document.createElement('div');
                div.className = `checklist-item ${isCompleted ? 'completed' : ''} fade-in`;
                div.style.animationDelay = `${index * 0.1}s`;

                div.innerHTML = `
                    <div class="checkbox ${isCompleted ? 'checked' : ''}" data-id="${task.id}"></div>
                    <div class="item-content">
                        <div class="item-title ${isCompleted ? 'completed' : ''}">${task.title}</div>
                        <div class="item-time">${task.time}</div>
                    </div>
                    <button class="tip-btn" data-id="${task.id}">
                        <i class="fas fa-lightbulb"></i> 优化建议
                    </button>
                `;

                checklist.appendChild(div);
            });

            updateProgress();
        }

        // Update progress bar
        function updateProgress() {
            const data = stageData[currentStage];
            const total = data.tasks.length;
            const completed = data.tasks.filter(t => completedTasks[t.id]).length;
            const percentage = (completed / total) * 100;

            progressText.textContent = `已完成 ${completed}/${total}`;
            progressFill.style.width = `${percentage}%`;
        }

        // Stage button click handler
        stageSelector.addEventListener('click', (e) => {
            const btn = e.target.closest('.stage-btn');
            if (!btn) return;

            currentStage = parseInt(btn.dataset.stage);
            updateStageButtons();
            renderTimeline();
            renderChecklist();
            saveState();
        });

        // Checkbox click handler
        checklist.addEventListener('click', (e) => {
            const checkbox = e.target.closest('.checkbox');
            if (!checkbox) return;

            const taskId = checkbox.dataset.id;
            completedTasks[taskId] = !completedTasks[taskId];

            renderChecklist();
            saveState();
        });

        // Tip button click handler
        checklist.addEventListener('click', (e) => {
            const btn = e.target.closest('.tip-btn');
            if (!btn) return;

            const taskId = btn.dataset.id;
            const data = stageData[currentStage];
            const task = data.tasks.find(t => t.id === taskId);

            if (task && task.tips) {
                modalTitle.textContent = task.title;
                modalContent.innerHTML = `
                    <h4>📋 操作指南</h4>
                    <p>${task.tips.guide.replace(/\n/g, '<br>')}</p>
                    <h4>⚠️ 常见踩坑点</h4>
                    <ul>
                        ${task.tips.pitfalls.split('•').filter(s => s.trim()).map(s => `<li>${s.trim()}</li>`).join('')}
                    </ul>
                `;
                modalOverlay.classList.add('active');
            }
        });

        // Modal close handlers
        modalClose.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });

        // Reset button handler
        resetBtn.addEventListener('click', () => {
            if (confirm('确定要清除所有进度并重新开始吗？')) {
                completedTasks = {};
                currentStage = 1;
                updateStageButtons();
                renderTimeline();
                renderChecklist();
                saveState();
            }
        });

        // Initialize
        loadState();
        renderTimeline();
        renderChecklist();
    </script>
</body>
</html>
