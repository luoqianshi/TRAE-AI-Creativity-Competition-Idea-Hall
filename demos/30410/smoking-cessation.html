<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>净烟 — 戒烟助手</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;430;500;590;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   1. Reset + Design Tokens
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:'Inter',-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;background:#0B0C0C;color:rgba(255,255,255,0.92);line-height:1.5;min-height:100dvh;overflow-x:hidden}
img,svg{display:block}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input:focus{outline:none}
a{color:inherit;text-decoration:none}

:root{
  --bg-primary:#0B0C0C;
  --bg-elevated:#121314;
  --bg-hover:#1A1B1D;
  --bg-active:#242528;
  --text-primary:rgba(255,255,255,0.92);
  --text-secondary:rgba(255,255,255,0.60);
  --text-tertiary:rgba(255,255,255,0.38);
  --border-default:rgba(255,255,255,0.08);
  --border-hover:rgba(255,255,255,0.14);
  --accent-brand:#5E6AD2;
  --accent-success:#34D399;
  --accent-warning:#FBBF24;
  --accent-danger:#F87171;
  --accent-resisted:#60A5FA;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;
  --space-6:24px;--space-8:32px;--space-10:40px;
  --radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-full:9999px;
  --text-micro:0.6875rem;--text-small:0.75rem;--text-body:0.8125rem;
  --text-body-lg:0.875rem;--text-subhead:0.9375rem;--text-title:1.125rem;
  --text-display:2rem;--text-display-sm:1.5rem;
  --ease-out:cubic-bezier(0.16,1,0.3,1);
  --duration-fast:100ms;--duration-normal:150ms;--duration-slow:250ms;
}

/* ============================================================
   2. Layout System
   ============================================================ */
#app{display:flex;flex-direction:column;min-height:100dvh;max-width:640px;margin:0 auto;padding:0 var(--space-4);width:100%}

/* Header */
#header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-4) 0;border-bottom:1px solid var(--border-default);flex-shrink:0}
.header-left{display:flex;align-items:center;gap:var(--space-3)}
.brand{font-size:var(--text-title);font-weight:590;letter-spacing:-0.02em}
.streak-badge{font-size:var(--text-micro);color:var(--accent-brand);background:rgba(94,106,210,0.12);padding:2px var(--space-2);border-radius:var(--radius-full);white-space:nowrap;letter-spacing:-0.01em;font-weight:500}
.settings-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);color:var(--text-secondary);transition:background var(--duration-fast) ease,color var(--duration-fast) ease}
.settings-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
.settings-btn svg{width:20px;height:20px}

/* Main scroll area */
#main{flex:1;overflow-y:auto;padding:var(--space-6) 0 var(--space-8);-webkit-overflow-scrolling:touch}

/* Light Up Button Section */
#lightUpSection{display:flex;flex-direction:column;align-items:center;gap:var(--space-4);padding:var(--space-8) 0 var(--space-6)}
.light-btn{width:140px;height:140px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--border-default);display:flex;align-items:center;justify-content:center;transition:transform var(--duration-fast) var(--ease-out),background var(--duration-normal) ease,border-color var(--duration-normal) ease;position:relative;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
.light-btn:hover{background:var(--bg-hover);border-color:var(--border-hover)}
.light-btn:active{transform:scale(0.95)}
.light-btn svg{width:52px;height:52px;color:var(--text-secondary);transition:color var(--duration-normal) ease}
.light-btn:hover svg{color:var(--accent-brand)}
@media(max-width:480px){.light-btn{width:120px;height:120px}.light-btn svg{width:44px;height:44px}}

.countdown-text{font-size:var(--text-body);color:var(--text-secondary);letter-spacing:-0.01em;min-height:1.5em;text-align:center;transition:color var(--duration-normal) ease}
.countdown-text.ready{color:var(--accent-success)}
.countdown-label{font-size:var(--text-small);color:var(--text-tertiary);margin-bottom:var(--space-1)}

/* Dashboard Section */
#dashboard{display:flex;flex-direction:column;gap:var(--space-5)}
.section-title{font-size:var(--text-subhead);font-weight:590;letter-spacing:-0.02em;color:var(--text-secondary);padding:var(--space-4) 0 var(--space-3);border-bottom:1px solid var(--border-default)}

/* Metrics Grid */
.metrics-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0}
.metric{padding:var(--space-3) var(--space-2);border-bottom:1px solid var(--border-default);display:flex;flex-direction:column;gap:var(--space-1)}
.metric:nth-child(odd){border-right:1px solid var(--border-default)}
.metric:nth-last-child(-n+2){border-bottom:none}
.metric__label{font-size:var(--text-micro);color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.04em;font-weight:500}
.metric__row{display:flex;align-items:baseline;gap:var(--space-1)}
.metric__value{font-size:var(--text-display-sm);font-weight:590;letter-spacing:-0.03em;line-height:1.1;transition:color var(--duration-slow) ease}
.metric__unit{font-size:var(--text-small);color:var(--text-tertiary)}
.metric__value.success{color:var(--accent-success)}
.metric__value.brand{color:var(--accent-brand)}
.metric__value.danger{color:var(--accent-danger)}

/* Charts */
.charts-grid{display:grid;grid-template-columns:1fr;gap:var(--space-5)}
@media(min-width:480px){.charts-grid{grid-template-columns:1fr 1fr}}
.chart-card{background:var(--bg-elevated);border-radius:var(--radius-md);padding:var(--space-4);border:1px solid var(--border-default)}
.chart-card.full{grid-column:1/-1}
.chart-card__title{font-size:var(--text-small);color:var(--text-tertiary);font-weight:500;margin-bottom:var(--space-3);letter-spacing:0.02em;text-transform:uppercase}
.chart-card .chart-wrap{position:relative;width:100%;height:200px}
.chart-card canvas{width:100%!important;height:100%!important;max-height:200px}

/* Settings Panel */
#settingsPanel{display:none;margin-top:var(--space-4);background:var(--bg-elevated);border-radius:var(--radius-md);padding:var(--space-5);border:1px solid var(--border-default);flex-direction:column;gap:var(--space-5)}
#settingsPanel.open{display:flex}
.setting-group{display:flex;flex-direction:column;gap:var(--space-2)}
.setting-group__header{display:flex;justify-content:space-between;align-items:center}
.setting-group__label{font-size:var(--text-body);color:var(--text-primary);font-weight:500}
.setting-group__value{font-size:var(--text-body);color:var(--accent-brand);font-weight:590;font-variant-numeric:tabular-nums}
.setting-group__desc{font-size:var(--text-micro);color:var(--text-tertiary)}
input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:var(--bg-active);outline:none;cursor:pointer}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent-brand);border:2px solid var(--bg-elevated);cursor:pointer;transition:transform var(--duration-fast) ease}
input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.15)}
input[type="range"]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent-brand);border:2px solid var(--bg-elevated);cursor:pointer}
input[type="number"]{background:var(--bg-active);border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);font-size:var(--text-body);width:80px;color:var(--text-primary);font-variant-numeric:tabular-nums;transition:border-color var(--duration-fast) ease}
input[type="number"]:focus{border-color:var(--accent-brand)}
.danger-btn{font-size:var(--text-body);color:var(--accent-danger);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);transition:background var(--duration-fast) ease;align-self:flex-start}
.danger-btn:hover{background:rgba(248,113,113,0.1)}

/* Modal */
#modal{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;padding:var(--space-4)}
#modal.open{display:flex}
.modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.6);animation:fadeIn var(--duration-slow) var(--ease-out)}
.modal-content{position:relative;background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:var(--space-6);max-width:360px;width:100%;animation:slideUp var(--duration-slow) var(--ease-out)}
.modal-title{font-size:var(--text-body-lg);font-weight:590;letter-spacing:-0.01em;margin-bottom:var(--space-2)}
.modal-desc{font-size:var(--text-body);color:var(--text-secondary);margin-bottom:var(--space-5);line-height:1.6}
.modal-actions{display:flex;flex-direction:column;gap:var(--space-2)}
.modal-btn{width:100%;padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);font-size:var(--text-body);font-weight:500;transition:background var(--duration-fast) ease,opacity var(--duration-fast) ease;text-align:center}
.modal-btn.primary{background:var(--accent-brand);color:#fff}
.modal-btn.primary:hover{opacity:0.9}
.modal-btn.ghost{color:var(--text-secondary)}
.modal-btn.ghost:hover{background:var(--bg-hover)}
.modal-btn.danger{color:var(--accent-danger)}
.modal-btn.danger:hover{background:rgba(248,113,113,0.1)}

/* Toast */
#toast{position:fixed;top:var(--space-4);left:50%;transform:translateX(-50%);z-index:200;background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:var(--space-3) var(--space-5);font-size:var(--text-body);color:var(--text-primary);box-shadow:0 8px 24px rgba(0,0,0,0.4);opacity:0;transition:opacity var(--duration-slow) var(--ease-out),transform var(--duration-slow) var(--ease-out);pointer-events:none;max-width:90vw;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}

/* Animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}

/* Utility */
.hidden{display:none!important}

/* Empty state */
.empty-state{text-align:center;padding:var(--space-8) var(--space-4);color:var(--text-tertiary);font-size:var(--text-body)}
.empty-state svg{width:48px;height:48px;margin:0 auto var(--space-4);opacity:0.3}
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <header id="header">
    <div class="header-left">
      <span class="brand">净烟</span>
      <span class="streak-badge" id="streakBadge">刚刚开始</span>
    </div>
    <button class="settings-btn" id="settingsToggle" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
    </button>
  </header>

  <!-- Main -->
  <main id="main">
    <!-- Light Up Section -->
    <section id="lightUpSection">
      <button class="light-btn" id="lightBtn" aria-label="点烟">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <!-- Cigarette body -->
          <rect x="8" y="28" width="32" height="8" rx="2"/>
          <!-- Filter -->
          <rect x="8" y="28" width="10" height="8" rx="2" fill="currentColor" fill-opacity="0.15"/>
          <!-- Burning tip -->
          <circle cx="40" cy="32" r="3" fill="currentColor" fill-opacity="0.3"/>
          <circle cx="40" cy="32" r="1.5" fill="currentColor" fill-opacity="0.6"/>
          <!-- Smoke lines -->
          <path d="M40 24c2-3 0-6 2-9" stroke-width="1.2" opacity="0.3"/>
          <path d="M36 22c1-2-1-5 1-7" stroke-width="1" opacity="0.2"/>
        </svg>
      </button>
      <div class="countdown-label">距上次吸烟</div>
      <div class="countdown-text" id="countdownText">暂无记录</div>
    </section>

    <!-- Dashboard -->
    <section id="dashboard">
      <div class="section-title">数据概览</div>

      <!-- Metrics -->
      <div class="metrics-grid" id="metricsGrid">
        <div class="metric">
          <span class="metric__label">今日吸烟</span>
          <div class="metric__row">
            <span class="metric__value" id="todaySmoked">0</span>
            <span class="metric__unit">支</span>
          </div>
        </div>
        <div class="metric">
          <span class="metric__label">今日抗拒</span>
          <div class="metric__row">
            <span class="metric__value brand" id="todayResisted">0</span>
            <span class="metric__unit">次</span>
          </div>
        </div>
        <div class="metric">
          <span class="metric__label">本周吸烟</span>
          <div class="metric__row">
            <span class="metric__value" id="weekSmoked">0</span>
            <span class="metric__unit">支</span>
          </div>
        </div>
        <div class="metric">
          <span class="metric__label">本月吸烟</span>
          <div class="metric__row">
            <span class="metric__value" id="monthSmoked">0</span>
            <span class="metric__unit">支</span>
          </div>
        </div>
        <div class="metric">
          <span class="metric__label">节省香烟</span>
          <div class="metric__row">
            <span class="metric__value success" id="savedCigarettes">+0</span>
            <span class="metric__unit">支</span>
          </div>
        </div>
        <div class="metric">
          <span class="metric__label">连续戒烟</span>
          <div class="metric__row">
            <span class="metric__value brand" id="streakDuration">0h</span>
            <span class="metric__unit"></span>
          </div>
        </div>
      </div>

      <!-- Charts -->
      <div class="charts-grid">
        <div class="chart-card full" id="chartTrendCard">
          <div class="chart-card__title">每日趋势（近7天）</div>
          <div class="chart-wrap"><canvas id="chartTrend"></canvas></div>
        </div>
        <div class="chart-card" id="chartWeeklyCard">
          <div class="chart-card__title">周同比</div>
          <div class="chart-wrap"><canvas id="chartWeekly"></canvas></div>
        </div>
        <div class="chart-card" id="chartDoughnutCard">
          <div class="chart-card__title">今日抗拒 vs 吸烟</div>
          <div class="chart-wrap"><canvas id="chartDoughnut"></canvas></div>
        </div>
      </div>

      <!-- Settings Panel -->
      <div id="settingsPanel">
        <div class="setting-group">
          <div class="setting-group__header">
            <span class="setting-group__label">吸烟间隔</span>
            <span class="setting-group__value" id="intervalDisplay">30 分钟</span>
          </div>
          <input type="range" id="intervalSlider" min="15" max="240" step="5" value="30">
          <span class="setting-group__desc">两次吸烟之间最短间隔时间</span>
        </div>
        <div class="setting-group">
          <div class="setting-group__header">
            <span class="setting-group__label">戒烟前日均吸烟量</span>
          </div>
          <input type="number" id="baselineInput" min="1" max="100" value="20">
          <span class="setting-group__desc">用于计算已节省的香烟数量</span>
        </div>
        <div class="setting-group">
          <span class="setting-group__label" style="margin-bottom:var(--space-2)">数据管理</span>
          <button class="danger-btn" id="resetBtn">重置所有数据</button>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- Modal -->
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal-content">
    <div class="modal-title" id="modalTitle">憋一憋好吗？</div>
    <div class="modal-desc" id="modalDesc">距离上次吸烟才 5 分钟，试试深呼吸，再坚持一下！</div>
    <div class="modal-actions">
      <button class="modal-btn primary" id="modalResist">憋一下！💪</button>
      <button class="modal-btn danger" id="modalGiveIn">实在憋不住</button>
      <button class="modal-btn ghost" id="modalCancel">我再想想</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Chart.js -->
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

<script>
/* ============================================================
   Module 1: DataStore
   ============================================================ */
const STORAGE_KEY = 'smoke-data';

const DataStore = {
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return null;
  },

  save(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  },

  getDefaultData() {
    const now = new Date();
    const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    return {
      version: 1,
      settings: {
        intervalMinutes: 30,
        baselinePerDay: 20,
        startDate: dateStr,
      },
      records: [],
    };
  },

  getOrInit() {
    let data = this.load();
    if (!data) {
      data = this.getDefaultData();
      this.save(data);
    }
    return data;
  },

  addRecord(type) {
    const data = this.getOrInit();
    data.records.push({
      id: `rec_${Date.now()}_${Math.random().toString(36).slice(2,6)}`,
      timestamp: Date.now(),
      type: type,
    });
    this.save(data);
    return data;
  },

  deriveStats() {
    const data = this.getOrInit();
    const now = Date.now();
    const records = data.records;
    const settings = data.settings;

    // Sort by timestamp descending
    const sorted = [...records].sort((a,b) => b.timestamp - a.timestamp);
    const lastRecord = sorted[0] || null;

    // Calculate elapsed since last action
    let elapsedSinceLast = null;
    let isWithinInterval = false;
    let remainingMs = 0;
    if (lastRecord) {
      elapsedSinceLast = now - lastRecord.timestamp;
      if (lastRecord.type === 'smoked') {
        const intervalMs = settings.intervalMinutes * 60000;
        isWithinInterval = elapsedSinceLast < intervalMs;
        remainingMs = isWithinInterval ? intervalMs - elapsedSinceLast : 0;
      }
    }

    // Date helpers
    const todayStart = new Date();
    todayStart.setHours(0,0,0,0);
    const todayStartMs = todayStart.getTime();

    const dayOfWeek = todayStart.getDay();
    const mondayOffset = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
    const weekStart = new Date(todayStart);
    weekStart.setDate(weekStart.getDate() - mondayOffset);
    const weekStartMs = weekStart.getTime();

    const monthStart = new Date(todayStart.getFullYear(), todayStart.getMonth(), 1);
    const monthStartMs = monthStart.getTime();

    // Last week range
    const lastWeekStart = new Date(weekStart);
    lastWeekStart.setDate(lastWeekStart.getDate() - 7);
    const lastWeekStartMs = lastWeekStart.getTime();
    const lastWeekEndMs = weekStartMs;

    // Count by period
    let todaySmoked = 0, todayResisted = 0;
    let weekSmoked = 0, weekResisted = 0;
    let monthSmoked = 0, monthResisted = 0;
    let thisWeekSmoked = 0;
    let lastWeekSmoked = 0;

    for (const r of records) {
      const ts = r.timestamp;
      if (ts >= todayStartMs) {
        if (r.type === 'smoked') todaySmoked++;
        else todayResisted++;
      }
      if (ts >= weekStartMs) {
        if (r.type === 'smoked') { weekSmoked++; thisWeekSmoked++; }
        else weekResisted++;
      }
      if (ts >= monthStartMs) {
        if (r.type === 'smoked') monthSmoked++;
        else monthResisted++;
      }
      if (ts >= lastWeekStartMs && ts < lastWeekEndMs && r.type === 'smoked') {
        lastWeekSmoked++;
      }
    }

    // Days since start
    const startDate = new Date(settings.startDate);
    startDate.setHours(0,0,0,0);
    const daysSinceStart = Math.max(0, Math.floor((todayStartMs - startDate.getTime()) / 86400000) + 1);

    // Saved cigarettes
    const expectedTotal = daysSinceStart * settings.baselinePerDay;
    const actualTotal = records.filter(r => r.type === 'smoked').length;
    const savedCigarettes = Math.max(0, expectedTotal - actualTotal);

    // Streak calculation
    let currentStreak = 0; // ms since last smoked
    let longestStreak = 0; // ms
    {
      const smokedRecords = records.filter(r => r.type === 'smoked').sort((a,b) => b.timestamp - a.timestamp);
      if (smokedRecords.length === 0) {
        // No smoked records ever — streak from startDate
        currentStreak = now - startDate.getTime();
        longestStreak = currentStreak;
      } else {
        const lastSmoked = smokedRecords[0].timestamp;
        currentStreak = now - lastSmoked;
        // Longest streak = max gap between consecutive smoked records
        let maxGap = currentStreak;
        for (let i = 0; i < smokedRecords.length - 1; i++) {
          const gap = smokedRecords[i].timestamp - smokedRecords[i+1].timestamp;
          if (gap > maxGap) maxGap = gap;
        }
        longestStreak = maxGap;
      }
    }

    // Daily trend (last 7 days)
    const dailyTrend = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(todayStart);
      d.setDate(d.getDate() - i);
      const dayStart = d.getTime();
      const dayEnd = dayStart + 86400000;
      let smoked = 0, resisted = 0;
      for (const r of records) {
        if (r.timestamp >= dayStart && r.timestamp < dayEnd) {
          if (r.type === 'smoked') smoked++;
          else resisted++;
        }
      }
      dailyTrend.push({
        date: `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`,
        smoked, resisted,
      });
    }

    return {
      lastRecord,
      elapsedSinceLast,
      isWithinInterval,
      remainingMs,
      todaySmoked,
      todayResisted,
      weekSmoked,
      weekResisted,
      monthSmoked,
      monthResisted,
      thisWeekSmoked,
      lastWeekSmoked,
      savedCigarettes,
      currentStreak,
      longestStreak,
      dailyTrend,
      daysSinceStart,
      records,
      settings,
    };
  },

  reset() {
    localStorage.removeItem(STORAGE_KEY);
  },
};

/* ============================================================
   Module 2: AppController
   ============================================================ */
const AppController = {
  lightBtn: document.getElementById('lightBtn'),
  countdownText: document.getElementById('countdownText'),
  streakBadge: document.getElementById('streakBadge'),
  modal: document.getElementById('modal'),
  modalDesc: document.getElementById('modalDesc'),
  modalResist: document.getElementById('modalResist'),
  modalGiveIn: document.getElementById('modalGiveIn'),
  modalCancel: document.getElementById('modalCancel'),
  modalOverlay: document.getElementById('modalOverlay'),
  settingsToggle: document.getElementById('settingsToggle'),
  settingsPanel: document.getElementById('settingsPanel'),
  intervalSlider: document.getElementById('intervalSlider'),
  intervalDisplay: document.getElementById('intervalDisplay'),
  baselineInput: document.getElementById('baselineInput'),
  resetBtn: document.getElementById('resetBtn'),
  toast: document.getElementById('toast'),
  metrics: {},
  countdownTimer: null,
  debounceTimer: null,

  init() {
    // Cache metric elements
    const ids = ['todaySmoked','todayResisted','weekSmoked','monthSmoked','savedCigarettes','streakDuration'];
    ids.forEach(id => { this.metrics[id] = document.getElementById(id); });

    // Load settings
    const data = DataStore.getOrInit();
    this.intervalSlider.value = data.settings.intervalMinutes;
    this.intervalDisplay.textContent = `${data.settings.intervalMinutes} 分钟`;
    this.baselineInput.value = data.settings.baselinePerDay;

    // Event listeners
    this.lightBtn.addEventListener('click', () => this.handleLightClick());
    this.modalResist.addEventListener('click', () => this.handleModalAction('resisted'));
    this.modalGiveIn.addEventListener('click', () => this.handleModalAction('smoked'));
    this.modalCancel.addEventListener('click', () => this.closeModal());
    this.modalOverlay.addEventListener('click', () => this.closeModal());

    this.settingsToggle.addEventListener('click', () => {
      this.settingsPanel.classList.toggle('open');
    });

    this.intervalSlider.addEventListener('change', () => {
      const val = parseInt(this.intervalSlider.value);
      this.intervalDisplay.textContent = `${val} 分钟`;
      const data = DataStore.getOrInit();
      data.settings.intervalMinutes = val;
      DataStore.save(data);
      this.refreshAll();
    });

    this.baselineInput.addEventListener('change', () => {
      const val = parseInt(this.baselineInput.value) || 20;
      const data = DataStore.getOrInit();
      data.settings.baselinePerDay = Math.max(1, Math.min(100, val));
      DataStore.save(data);
      this.refreshAll();
    });

    this.resetBtn.addEventListener('click', () => {
      if (confirm('确定要重置所有数据吗？此操作不可撤销。')) {
        DataStore.reset();
        location.reload();
      }
    });

    // Keyboard: ESC to close modal
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && this.modal.classList.contains('open')) {
        this.closeModal();
      }
    });

    // Page Visibility: pause/resume countdown
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        this.stopCountdown();
      } else {
        this.startCountdown();
      }
    });

    // Init charts (deferred — Chart.js may not be loaded yet)
    if (typeof Chart !== 'undefined') {
      ChartManager.init();
    } else {
      const checkChart = setInterval(() => {
        if (typeof Chart !== 'undefined') {
          clearInterval(checkChart);
          ChartManager.init();
        }
      }, 100);
    }

    // Initial render
    this.refreshAll();
  },

  refreshAll() {
    const stats = DataStore.deriveStats();
    this.updateMetrics(stats);
    this.updateCountdown(stats);
    this.updateStreakBadge(stats);
    if (typeof Chart !== 'undefined' && ChartManager.ready) {
      ChartManager.updateAll(stats);
    }
  },

  handleLightClick() {
    // Debounce 300ms
    if (this.debounceTimer) return;
    this.debounceTimer = setTimeout(() => { this.debounceTimer = null; }, 300);

    const stats = DataStore.deriveStats();
    const { lastRecord, isWithinInterval, settings } = stats;

    // No previous record or last was resisted → smoke
    if (!lastRecord || lastRecord.type === 'resisted') {
      DataStore.addRecord('smoked');
      this.refreshAll();
      this.showToast('已记录吸烟行为');
      return;
    }

    // Last was smoked — check interval
    if (!isWithinInterval) {
      DataStore.addRecord('smoked');
      this.refreshAll();
      this.showToast('已记录吸烟行为');
      return;
    }

    // Within interval — show modal
    const remaining = stats.remainingMs;
    const mins = Math.floor(remaining / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    this.modalDesc.textContent = `距离上次吸烟才 ${mins} 分 ${secs} 秒，试试深呼吸，再坚持一下！`;
    this.modal.classList.add('open');
  },

  handleModalAction(type) {
    DataStore.addRecord(type);
    this.closeModal();
    this.refreshAll();
    if (type === 'resisted') {
      this.showToast('好样的！又战胜了一次冲动！');
    } else {
      this.showToast('已记录，下次试试憋一下！');
    }
  },

  closeModal() {
    this.modal.classList.remove('open');
  },

  updateMetrics(stats) {
    this.metrics.todaySmoked.textContent = stats.todaySmoked;
    this.metrics.todayResisted.textContent = stats.todayResisted;
    this.metrics.weekSmoked.textContent = stats.weekSmoked;
    this.metrics.monthSmoked.textContent = stats.monthSmoked;
    this.metrics.savedCigarettes.textContent = `+${stats.savedCigarettes}`;
    this.metrics.streakDuration.textContent = this.formatDuration(stats.currentStreak);
  },

  updateCountdown(stats) {
    if (!stats.lastRecord || stats.lastRecord.type === 'resisted') {
      if (stats.lastRecord && stats.lastRecord.type === 'resisted') {
        this.countdownText.textContent = '上次已抗拒成功，放心记录';
        this.countdownText.classList.remove('ready');
      } else {
        this.countdownText.textContent = '暂无记录';
        this.countdownText.classList.remove('ready');
      }
      return;
    }
    this.startCountdown();
  },

  startCountdown() {
    this.stopCountdown();
    const tick = () => {
      const stats = DataStore.deriveStats();
      if (!stats.lastRecord || stats.lastRecord.type === 'resisted') {
        this.countdownText.textContent = stats.lastRecord?.type === 'resisted'
          ? '上次已抗拒成功，放心记录'
          : '暂无记录';
        this.countdownText.classList.remove('ready');
        return;
      }
      const elapsed = Date.now() - stats.lastRecord.timestamp;
      const intervalMs = stats.settings.intervalMinutes * 60000;
      if (elapsed >= intervalMs) {
        this.countdownText.textContent = '已超过间隔，可放心记录';
        this.countdownText.classList.add('ready');
      } else {
        const remaining = intervalMs - elapsed;
        const h = Math.floor(remaining / 3600000);
        const m = Math.floor((remaining % 3600000) / 60000);
        const s = Math.floor((remaining % 60000) / 1000);
        let text = '';
        if (h > 0) text += `${h}时`;
        text += `${m}分${s}秒`;
        this.countdownText.textContent = text;
        this.countdownText.classList.remove('ready');
      }
    };
    tick();
    this.countdownTimer = setInterval(tick, 1000);
  },

  stopCountdown() {
    if (this.countdownTimer) {
      clearInterval(this.countdownTimer);
      this.countdownTimer = null;
    }
  },

  updateStreakBadge(stats) {
    const duration = this.formatDuration(stats.currentStreak);
    this.streakBadge.textContent = `已坚持 ${duration}`;
  },

  formatDuration(ms) {
    if (!ms || ms <= 0) return '0h';
    const totalMinutes = Math.floor(ms / 60000);
    if (totalMinutes < 60) return `${totalMinutes}分钟`;
    const hours = Math.floor(totalMinutes / 60);
    const days = Math.floor(hours / 24);
    if (days > 0) {
      const remainingHours = hours % 24;
      return `${days}天${remainingHours > 0 ? remainingHours + '时' : ''}`;
    }
    return `${hours}小时`;
  },

  showToast(msg) {
    this.toast.textContent = msg;
    this.toast.classList.add('show');
    setTimeout(() => { this.toast.classList.remove('show'); }, 2500);
  },
};

/* ============================================================
   Module 3: ChartManager
   ============================================================ */
const ChartManager = {
  trendChart: null,
  weeklyChart: null,
  doughnutChart: null,
  ready: false,

  init() {
    const ctx1 = document.getElementById('chartTrend')?.getContext('2d');
    const ctx2 = document.getElementById('chartWeekly')?.getContext('2d');
    const ctx3 = document.getElementById('chartDoughnut')?.getContext('2d');
    if (!ctx1 || !ctx2 || !ctx3) return;

    // Global defaults
    Chart.defaults.color = 'rgba(255,255,255,0.6)';
    Chart.defaults.borderColor = 'rgba(255,255,255,0.08)';
    Chart.defaults.font.family = "'Inter',-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif";

    const stats = DataStore.deriveStats();

    // Chart 1: Trend line
    this.trendChart = new Chart(ctx1, {
      type: 'line',
      data: {
        labels: stats.dailyTrend.map(d => d.date),
        datasets: [{
          label: '吸烟',
          data: stats.dailyTrend.map(d => d.smoked),
          borderColor: '#5E6AD2',
          backgroundColor: (ctx) => {
            const g = ctx.chart.ctx.createLinearGradient(0,0,0,200);
            g.addColorStop(0,'rgba(94,106,210,0.25)');
            g.addColorStop(1,'rgba(94,106,210,0)');
            return g;
          },
          fill: true,
          tension: 0.35,
          borderWidth: 2,
          pointRadius: 3,
          pointBackgroundColor: '#fff',
          pointBorderColor: '#5E6AD2',
          pointBorderWidth: 2,
          pointHoverRadius: 5,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: {
            grid: { display: false },
            ticks: { font: { size: 10 }, maxRotation: 0 },
          },
          y: {
            beginAtZero: true,
            ticks: { stepSize: 1, font: { size: 10 } },
            grid: { color: 'rgba(255,255,255,0.06)' },
          }
        },
        interaction: { intersect: false, mode: 'index' },
      },
    });

    // Chart 2: Weekly comparison bar
    this.weeklyChart = new Chart(ctx2, {
      type: 'bar',
      data: {
        labels: ['周吸烟量'],
        datasets: [{
          label: '上周',
          data: [stats.lastWeekSmoked],
          backgroundColor: 'rgba(255,255,255,0.15)',
          borderRadius: 4,
          maxBarThickness: 32,
        }, {
          label: '本周',
          data: [stats.thisWeekSmoked],
          backgroundColor: '#5E6AD2',
          borderRadius: 4,
          maxBarThickness: 32,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom',
            labels: { usePointStyle: true, boxWidth: 8, font: { size: 10 }, padding: 12 }
          }
        },
        scales: {
          x: { grid: { display: false } },
          y: {
            beginAtZero: true,
            ticks: { stepSize: 1, font: { size: 10 } },
            grid: { color: 'rgba(255,255,255,0.06)' },
          }
        },
      },
    });

    // Chart 3: Doughnut
    this.doughnutChart = new Chart(ctx3, {
      type: 'doughnut',
      data: {
        labels: ['抗拒', '吸烟'],
        datasets: [{
          data: [stats.todayResisted || 1, stats.todaySmoked || 1],
          backgroundColor: ['#60A5FA', '#F87171'],
          borderWidth: 0,
          hoverOffset: 4,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '70%',
        plugins: {
          legend: {
            position: 'bottom',
            labels: { usePointStyle: true, boxWidth: 8, font: { size: 10 }, padding: 12 }
          }
        },
      },
      plugins: [{
        id: 'centerText',
        beforeDraw(chart) {
          const {width,height,ctx} = chart;
          ctx.save();
          const total = chart.data.datasets[0].data.reduce((a,b) => a+b, 0);
          const text = total > 1 ? total - 1 : 0; // subtract 1 from each placeholder
          ctx.font = `590 ${height > 150 ? 24 : 18}px 'Inter',sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = 'rgba(255,255,255,0.92)';
          ctx.fillText(text, width/2, height/2 - 6);
          ctx.font = '10px sans-serif';
          ctx.fillStyle = 'rgba(255,255,255,0.38)';
          ctx.fillText('今日总数', width/2, height/2 + 16);
          ctx.restore();
        }
      }],
    });

    this.ready = true;
  },

  updateAll(stats) {
    if (!this.ready) return;

    // Update trend
    this.trendChart.data.labels = stats.dailyTrend.map(d => d.date);
    this.trendChart.data.datasets[0].data = stats.dailyTrend.map(d => d.smoked);
    this.trendChart.update('none');

    // Update weekly
    this.weeklyChart.data.datasets[0].data = [stats.lastWeekSmoked];
    this.weeklyChart.data.datasets[1].data = [stats.thisWeekSmoked];
    this.weeklyChart.update('none');

    // Update doughnut — ensure at least 1 for visual
    const resisted = Math.max(1, stats.todayResisted);
    const smoked = Math.max(1, stats.todaySmoked);
    this.doughnutChart.data.datasets[0].data = [resisted, smoked];
    this.doughnutChart.update('none');
  },
};

// Boot
document.addEventListener('DOMContentLoaded', () => AppController.init());
</script>
</body>
