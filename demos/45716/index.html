<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>约起来 - 找球友，一起动</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #1A1A2E;
            --accent: #FFD700;
            --bg-dark: #0F0F1A;
            --bg-card: #1E1E30;
            --bg-card-hover: #252540;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0B8;
            --success: #4ADE80;
            --danger: #F87171;
            --border: #2A2A40;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', 'Poppins', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景装饰 */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 107, 53, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(255, 215, 0, 0.05) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: rgba(15, 15, 26, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .logo {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--text-primary);
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-link {
            padding: 8px 16px;
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            background: none;
        }

        .nav-link:hover {
            color: var(--text-primary);
            background: var(--bg-card);
        }

        .nav-link.active {
            color: var(--primary);
            background: rgba(255, 107, 53, 0.15);
        }

        /* 主要内容区 */
        .main-content {
            padding-top: 80px;
            padding-bottom: 100px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* 页面容器 */
        .page {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 首页样式 */
        .hero {
            text-align: center;
            padding: 60px 0 40px;
        }

        .hero h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 18px;
            color: var(--text-secondary);
            max-width: 500px;
            margin: 0 auto;
        }

        /* 运动类型网格 */
        .sports-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin: 40px 0;
        }

        @media (max-width: 768px) {
            .sports-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .hero h1 {
                font-size: 32px;
            }
        }

        .sport-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .sport-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sport-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 12px 40px rgba(255, 107, 53, 0.2);
        }

        .sport-card:hover::before {
            opacity: 1;
        }

        .sport-icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        .sport-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .sport-count {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* 球局列表 */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: var(--primary);
            border-radius: 2px;
        }

        .games-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .game-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            gap: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .game-card:hover {
            border-color: var(--primary);
            transform: translateX(8px);
        }

        .game-sport-icon {
            font-size: 40px;
            width: 80px;
            height: 80px;
            background: var(--bg-card-hover);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .game-info {
            flex: 1;
            min-width: 0;
        }

        .game-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .game-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .game-badge.recruiting {
            background: rgba(74, 222, 128, 0.2);
            color: var(--success);
        }

        .game-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .game-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .game-players {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .player-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--bg-card-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .player-avatar.more {
            background: var(--border);
            color: var(--text-secondary);
            font-size: 11px;
        }

        /* 发布球局页面 */
        .publish-form {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 0;
        }

        .form-title {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.2);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        textarea.form-input {
            resize: vertical;
            min-height: 100px;
        }

        .sport-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        @media (max-width: 480px) {
            .sport-selector {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .sport-option {
            padding: 16px;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sport-option:hover {
            border-color: var(--primary);
        }

        .sport-option.selected {
            border-color: var(--primary);
            background: rgba(255, 107, 53, 0.1);
        }

        .sport-option-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }

        .sport-option-name {
            font-size: 14px;
            font-weight: 500;
        }

        .level-selector {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .level-option {
            padding: 10px 20px;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .level-option:hover {
            border-color: var(--primary);
        }

        .level-option.selected {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 20px rgba(255, 107, 53, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(255, 107, 53, 0.5);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
        }

        .btn-block {
            width: 100%;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        /* 球局详情 */
        .detail-header {
            padding: 40px 0;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 24px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: var(--primary);
        }

        .detail-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .detail-badges {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .detail-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .info-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .info-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .info-value {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .detail-section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .participants-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .participant-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-card-hover);
            border-radius: 12px;
        }

        .participant-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .participant-info {
            flex: 1;
        }

        .participant-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .participant-level {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 排位中心 */
        .ranking-header {
            text-align: center;
            padding: 40px 0;
        }

        .rank-display {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 60px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            margin: 24px 0;
        }

        .rank-icon {
            font-size: 80px;
            margin-bottom: 16px;
        }

        .rank-name {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .rank-stars {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .star {
            font-size: 24px;
            opacity: 0.3;
        }

        .star.filled {
            opacity: 1;
        }

        .rank-points {
            font-size: 18px;
            color: var(--text-secondary);
        }

        .rank-points strong {
            color: var(--accent);
            font-size: 24px;
        }

        .stars-progress {
            width: 200px;
            height: 8px;
            background: var(--bg-card-hover);
            border-radius: 4px;
            margin-top: 12px;
            overflow: hidden;
        }

        .stars-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        /* 排行榜 */
        .leaderboard {
            margin-top: 40px;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .leaderboard-item:hover {
            border-color: var(--primary);
            transform: translateX(8px);
        }

        .leaderboard-item.top-3 {
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.1), rgba(255, 215, 0, 0.05));
            border-color: rgba(255, 215, 0, 0.3);
        }

        .rank-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            background: var(--bg-card-hover);
        }

        .rank-number.gold {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1A1A2E;
        }

        .rank-number.silver {
            background: linear-gradient(135deg, #C0C0C0, #A0A0A0);
            color: #1A1A2E;
        }

        .rank-number.bronze {
            background: linear-gradient(135deg, #CD7F32, #A0522D);
            color: white;
        }

        .leaderboard-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .leaderboard-info {
            flex: 1;
        }

        .leaderboard-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .leaderboard-level {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .leaderboard-points {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
        }

        /* 个人中心 */
        .profile-header {
            text-align: center;
            padding: 40px 0;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            margin: 0 auto 20px;
            box-shadow: 0 8px 40px rgba(255, 107, 53, 0.4);
        }

        .profile-name {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .profile-join-date {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin: 32px 0;
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .stat-card.wins .stat-value {
            color: var(--success);
        }

        .stat-card.losses .stat-value {
            color: var(--danger);
        }

        .history-section {
            margin-top: 32px;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .history-result {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }

        .history-result.win {
            background: rgba(74, 222, 128, 0.2);
            color: var(--success);
        }

        .history-result.lose {
            background: rgba(248, 113, 113, 0.2);
            color: var(--danger);
        }

        .history-points {
            font-size: 16px;
            font-weight: 600;
        }

        .history-info {
            flex: 1;
        }

        .history-sport {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .history-date {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(15, 15, 26, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            background: none;
        }

        .nav-item:hover,
        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            font-size: 24px;
        }

        /* Toast提示 */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            border: 1px solid var(--primary);
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 200;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 16px;
            margin-bottom: 24px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            max-width: 400px;
            width: 90%;
            text-align: center;

    <script>

        const SPORTS = [
            { id: 'pingpong', name: '乒乓球', icon: '🏓' },

            points: 2850,

        };

        let games = [
            {
                id: 'game_001',
                sportType: '羽毛球',
                sportIcon: '🏸',
                title: '周末羽毛球约起来',

                level: '白银',
                maxPlayers: 4,
                participants: [
                    { id: 'user_001', nickname: '运动达人', avatar: '🎾', level: '黄金' },
                    { id: 'user_002', nickname: '羽球小王子', avatar: '🏸', level: '白银' }
                ],
                creator: 'user_001',
                status: 'recruiting',

            },
            {

                sportIcon: '🏀',
                title: '三对三街头篮球',
                location: '工体篮球场',

                maxPlayers: 6,

                ],
                creator: 'user_003',
                status: 'recruiting',
                desc: '3v3对抗赛，要求有一定基础，胜利方请客喝饮料！'
            },
            {
                id: 'game_003',
                sportType: '乒乓球',
                sportIcon: '🏓',
                title: '乒乓球友谊赛',
                location: '中关村体育馆',
                datetime: '2024-01-22 09:00',
                level: '青铜',
                maxPlayers: 8,
                participants: [
                    { id: 'user_004', nickname: '乒乓老手', avatar: '🏓', level: '青铜' }
                ],
                creator: 'user_004',
                status: 'recruiting',
                desc: '新手友好局，交流球技为主'
            },
            {
                id: 'game_004',
                sportType: '台球',
                sportIcon: '🎱',
                title: '台球交流局',
                location: '国贸台球俱乐部',
                datetime: '2024-01-23 19:00',
                level: '白银',
                maxPlayers: 4,
                participants: [
                    { id: 'user_005', nickname: '台球王子', avatar: '🎱', level: '白银' },
                    { id: 'user_006', nickname: '准度惊人', avatar: '🎯', level: '白银' }
                ],
                creator: 'user_005',
                status: 'recruiting',
                desc: '黑八比赛，AA制台费，赢家有神秘奖品'
            }
        ];

        let historyRecords = [
            { id: 'record_001', sport: '羽毛球', result: 'win', points: +30, date: '2024-01-18', opponent: '羽球小王子' },
            { id: 'record_002', sport: '篮球', result: 'win', points: +30, date: '2024-01-17', opponent: '灌篮高手' },
            { id: 'record_003', sport: '乒乓球', result: 'lose', points: +10, date: '2024-01-16', opponent: '乒乓老手' },
            { id: 'record_004', sport: '台球', result: 'win', points: +30, date: '2024-01-15', opponent: '台球王子' }
        ];

        let leaderboard = [
            { id: 'user_007', nickname: '全能运动王', avatar: '🏃', level: '王者', points: 12500, levelId: 'king' },
            { id: 'user_008', nickname: '羽球女王', avatar: '🦸', level: '钻石', points: 7800, levelId: 'diamond' },
            { id: 'user_001', nickname: '运动达人', avatar: '🎾', level: '黄金', points: 2850, levelId: 'gold' },
            { id: 'user_003', nickname: '灌篮高手', avatar: '🏀', level: '黄金', points: 2600, levelId: 'gold' },
            { id: 'user_009', nickname: '乒乓新星', avatar: '🏓', level: '白银', points: 1800, levelId: 'silver' }
        ];

        // 当前状态
        let currentPage = 'home';
        let selectedSport = null;
        let selectedLevels = ['bronze', 'silver', 'gold'];
        let currentDetailGame = null;

        // 初始化
        function init() {
            loadFromStorage();
            renderSportsGrid();
            renderGamesList();
            renderSportSelector();
            renderLevelSelector();
            updateProfile();
            updateRanking();
            handleHashChange();
            window.addEventListener('hashchange', handleHashChange);
        }

        // 本地存储
        function loadFromStorage() {
            const savedUser = localStorage.getItem('gotoball_user');
            const savedGames = localStorage.getItem('gotoball_games');
            const savedHistory = localStorage.getItem('gotoball_history');
            const savedLeaderboard = localStorage.getItem('gotoball_leaderboard');

            if (savedUser) currentUser = JSON.parse(savedUser);
            if (savedGames) games = JSON.parse(savedGames);
            if (savedHistory) historyRecords = JSON.parse(savedHistory);
            if (savedLeaderboard) leaderboard = JSON.parse(savedLeaderboard);
        }

        function saveToStorage() {
            localStorage.setItem('gotoball_user', JSON.stringify(currentUser));
            localStorage.setItem('gotoball_games', JSON.stringify(games));
            localStorage.setItem('gotoball_history', JSON.stringify(historyRecords));
            localStorage.setItem('gotoball_leaderboard', JSON.stringify(leaderboard));
        }

        // 导航
        function navigateTo(page, params) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById(`page-${page}`).classList.add('active');
            document.querySelectorAll(`[data-page="${page}"]`).forEach(n => n.classList.add('active'));

            currentPage = page;

            if (page === 'detail' && params) {
                showGameDetail(params);
            }

            window.scrollTo(0, 0);
        }

        function handleHashChange() {
            const hash = window.location.hash.slice(1);
            if (hash.startsWith('detail/')) {
                const gameId = hash.split('/')[1];
                navigateTo('detail', gameId);
            } else if (hash) {
                navigateTo(hash);
            } else {
                navigateTo('home');
            }
        }

        // 渲染运动类型网格
        function renderSportsGrid() {
            const grid = document.getElementById('sports-grid');
            grid.innerHTML = SPORTS.map(sport => {
                const count = games.filter(g => g.sportType === sport.name).length;
                return `
                    <div class="sport-card" onclick="filterBySport('${sport.name}')">
                        <span class="sport-icon">${sport.icon}</span>
                        <div class="sport-name">${sport.name}</div>
                        <div class="sport-count">${count}个球局</div>
                    </div>
                `;
            }).join('');
        }

        // 渲染球局列表
        function renderGamesList(filterSport = null) {
            const list = document.getElementById('games-list');
            let filteredGames = filterSport ? games.filter(g => g.sportType === filterSport) : games;

            if (filteredGames.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🏐</div>
                        <p class="empty-text">暂无球局，发布一个吧！</p>
                        <button class="btn btn-primary" onclick="navigateTo('publish')">发布球局</button>
                    </div>
                `;
                return;
            }

            list.innerHTML = filteredGames.map(game => {
                const date = new Date(game.datetime);
                const dateStr = `${date.getMonth() + 1}月${date.getDate()}日 ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
                const participantsCount = game.participants.length;
                const statusText = game.status === 'recruiting' ? '招募中' : (game.status === 'ongoing' ? '进行中' : '已结束');

                return `
                    <div class="game-card" onclick="navigateTo('detail', '${game.id}')">
                        <div class="game-sport-icon">${game.sportIcon}</div>
                        <div class="game-info">
                            <div class="game-title">
                                ${game.title}
                                <span class="game-badge recruiting">${statusText}</span>
                            </div>
                            <div class="game-meta">
                                <span>📅 ${dateStr}</span>
                                <span>📍 ${game.location}</span>
                                <span>🎯 ${game.level}</span>
                            </div>
                            <div class="game-players">
                                ${game.participants.slice(0, 3).map(p => `<div class="player-avatar">${p.avatar}</div>`).join('')}
                                ${participantsCount > 3 ? `<div class="player-avatar more">+${participantsCount - 3}</div>` : ''}
                                <span style="color: var(--text-secondary); font-size: 13px;">${participantsCount}/${game.maxPlayers}人</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterBySport(sportName) {
            renderGamesList(sportName);
        }

        // 渲染运动选择器
        function renderSportSelector() {
            const selector = document.getElementById('sport-selector');
            selector.innerHTML = SPORTS.map(sport => `
                <div class="sport-option" data-sport="${sport.id}" onclick="selectSport('${sport.id}')">
                    <span class="sport-option-icon">${sport.icon}</span>
                    <span class="sport-option-name">${sport.name}</span>
                </div>
            `).join('');
        }

        function selectSport(sportId) {
            selectedSport = sportId;
            document.querySelectorAll('.sport-option').forEach(opt => opt.classList.remove('selected'));
            document.querySelector(`[data-sport="${sportId}"]`).classList.add('selected');
        }

        // 渲染段位选择器
        function renderLevelSelector() {
            const selector = document.getElementById('level-selector');
            selector.innerHTML = LEVELS.map(level => `
                <div class="level-option ${selectedLevels.includes(level.id) ? 'selected' : ''}" data-level="${level.id}" onclick="toggleLevel('${level.id}')">
                    ${level.icon} ${level.name}
                </div>
            `).join('');
        }

        function toggleLevel(levelId) {
            const idx = selectedLevels.indexOf(levelId);
            if (idx > -1) {
                if (selectedLevels.length > 1) {
                    selectedLevels.splice(idx, 1);
                }
            } else {
                selectedLevels.push(levelId);
            }
            renderLevelSelector();
        }

        // 发布球局
        function publishGame() {
            const title = document.getElementById('game-title').value.trim();
            const datetime = document.getElementById('game-datetime').value;
            const location = document.getElementById('game-location').value.trim();
            const desc = document.getElementById('game-desc').value.trim();
            const maxPlayers = parseInt(document.getElementById('game-max-players').value);

            if (!selectedSport) {
                showToast('请选择运动类型');
                return;
            }
            if (!title) {
                showToast('请输入球局标题');
                return;
            }
            if (!datetime) {
                showToast('请选择时间');
                return;
            }
            if (!location) {
                showToast('请输入地点');
                return;
            }

            const sport = SPORTS.find(s => s.id === selectedSport);
            const levelNames = selectedLevels.map(id => LEVELS.find(l => l.id === id).name).join('、');

            const newGame = {
                id: 'game_' + Date.now(),
                sportType: sport.name,
                sportIcon: sport.icon,
                title,
                location,
                datetime,
                level: levelNames,
                maxPlayers,
                participants: [{ id: currentUser.id, nickname: currentUser.nickname, avatar: currentUser.avatar, level: getLevelInfo().name }],
                creator: currentUser.id,
                status: 'recruiting',
                desc: desc || '暂无详细说明'
            };

            games.unshift(newGame);
            saveToStorage();
            renderGamesList();
            renderSportsGrid();

            showModal('🎉', '发布成功', '球局已发布，等待球友响应！', [
                { text: '查看球局', action: () => { hideModal(); navigateTo('detail', newGame.id); } },
                { text: '返回首页', action: () => { hideModal(); navigateTo('home'); }, primary: true }
            ]);
        }

        // 球局详情
        function showGameDetail(gameId) {
            const game = games.find(g => g.id === gameId);
            if (!game) return;

            currentDetailGame = game;

            const date = new Date(game.datetime);
            const dateStr = `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;

            document.getElementById('detail-title').textContent = game.title;
            document.getElementById('detail-status').textContent = game.status === 'recruiting' ? '招募中' : (game.status === 'ongoing' ? '进行中' : '已结束');
            document.getElementById('detail-level').textContent = '🎯 ' + game.level;
            document.getElementById('detail-sport').innerHTML = `${game.sportIcon} ${game.sportType}`;
            document.getElementById('detail-datetime').textContent = dateStr;
            document.getElementById('detail-location').textContent = game.location;
            document.getElementById('detail-players').textContent = `${game.participants.length}/${game.maxPlayers}人`;
            document.getElementById('detail-desc').textContent = game.desc;

            const participantsList = document.getElementById('participants-list');
            participantsList.innerHTML = game.participants.map(p => `
                <div class="participant-item">
                    <div class="participant-avatar">${p.avatar}</div>
                    <div class="participant-info">
                        <div class="participant-name">${p.nickname} ${p.id === currentUser.id ? '(我)' : ''}</div>
                        <div class="participant-level">${getLevelIcon(p.level)} ${p.level}</div>
                    </div>
                </div>
            `).join('');

            const joinBtn = document.getElementById('join-game-btn');
            const isJoined = game.participants.some(p => p.id === currentUser.id);
            const isFull = game.participants.length >= game.maxPlayers;

            if (isJoined) {
                joinBtn.textContent = '已报名';
                joinBtn.disabled = true;
                joinBtn.style.opacity = '0.6';
            } else if (isFull) {
                joinBtn.textContent = '已满员';
                joinBtn.disabled = true;
                joinBtn.style.opacity = '0.6';
            } else {
                joinBtn.textContent = '立即报名';
                joinBtn.disabled = false;
                joinBtn.style.opacity = '1';
            }
        }

        // 加入球局
        function joinGame() {
            if (!currentDetailGame) return;
            if (currentDetailGame.participants.some(p => p.id === currentUser.id)) return;

            currentDetailGame.participants.push({
                id: currentUser.id,
                nickname: currentUser.nickname,
                avatar: currentUser.avatar,
                level: getLevelInfo().name
            });

            currentUser.games++;
            saveToStorage();
            showGameDetail(currentDetailGame.id);

            showModal('🎉', '报名成功', `你已成功加入「${currentDetailGame.title}」`, [
                { text: '确定', action: hideModal, primary: true }
            ]);
        }

        // 更新个人中心
        function updateProfile() {
            document.getElementById('profile-avatar').textContent = currentUser.avatar;
            document.getElementById('profile-name').textContent = currentUser.nickname;
            document.getElementById('profile-join-date').textContent = currentUser.joinDate;
            document.getElementById('stat-games').textContent = currentUser.games;
            document.getElementById('stat-wins').textContent = currentUser.wins;
            document.getElementById('stat-losses').textContent = currentUser.losses;

            const historyList = document.getElementById('history-list');
            if (historyRecords.length === 0) {
                historyList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📋</div>
                        <p class="empty-text">暂无战绩记录</p>
                    </div>
                `;
            } else {
                historyList.innerHTML = historyRecords.map(record => `
                    <div class="history-item">
                        <div class="history-result ${record.result}">
                            ${record.result === 'win' ? '胜' : '负'}
                            <div class="history-points">${record.points > 0 ? '+' : ''}${record.points}</div>
                        </div>
                        <div class="history-info">
                            <div class="history-sport">${getSportIcon(record.sport)} ${record.sport}</div>
                            <div class="history-date">${record.date} · 对阵 ${record.opponent}</div>
                        </div>
                    </div>
                `).join('');
            }
        }

        // 更新排位信息
        function updateRanking() {
            const levelInfo = getLevelInfo();
            const stars = getStars();
            const progress = getProgressToNextStar();

            document.getElementById('my-rank-icon').textContent = levelInfo.icon;
            document.getElementById('my-rank-name').textContent = levelInfo.name + ' · ' + stars + '星';
            document.getElementById('my-points').textContent = currentUser.points;
            document.getElementById('stars-progress-bar').style.width = progress + '%';

            // 渲染星级
            const starsContainer = document.getElementById('my-rank-stars');
            let starsHtml = '';
            for (let i = 1; i <= 5; i++) {
                starsHtml += `<span class="star ${i <= stars ? 'filled' : ''}">⭐</span>`;
            }
            starsContainer.innerHTML = starsHtml;

            // 渲染排行榜
            const leaderboardList = document.getElementById('leaderboard-list');
            leaderboardList.innerHTML = leaderboard.map((user, index) => {
                const rankClass = index === 0 ? 'gold' : (index === 1 ? 'silver' : (index === 2 ? 'bronze' : ''));
                return `
                    <div class="leaderboard-item ${index < 3 ? 'top-3' : ''}">
                        <div class="rank-number ${rankClass}">${index + 1}</div>
                        <div class="leaderboard-avatar">${user.avatar}</div>
                        <div class="leaderboard-info">
                            <div class="leaderboard-name">${user.nickname} ${user.id === currentUser.id ? '(我)' : ''}</div>
                            <div class="leaderboard-level">${getLevelIcon(user.level)} ${user.level}</div>
                        </div>
                        <div class="leaderboard-points">${user.points}</div>
                    </div>
                `;
            }).join('');
        }

        // 获取段位信息
        function getLevelInfo() {
            return LEVELS.find(l => currentUser.points >= l.min && currentUser.points <= l.max) || LEVELS[0];
        }

        // 获取星级
        function getStars() {
            const levelInfo = getLevelInfo();
            const pointsInLevel = currentUser.points - levelInfo.min;
            return Math.min(5, Math.floor(pointsInLevel / 200) + 1);
        }

        // 获取到下一星的进度
        function getProgressToNextStar() {
            const stars = getStars();
            if (stars >= 5) return 100;
            const levelInfo = getLevelInfo();
            const pointsInLevel = currentUser.points - levelInfo.min;
            const progressInStar = pointsInLevel % 200;
            return (progressInStar / 200) * 100;
        }

        // 获取段位图标
        function getLevelIcon(levelName) {
            const level = LEVELS.find(l => l.name === levelName);
            return level ? level.icon : '🥉';
        }

        // 获取运动图标
        function getSportIcon(sportName) {
            const sport = SPORTS.find(s => s.name === sportName);
            return sport ? sport.icon : '⚽';
        }

        // Toast提示
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Modal
        function showModal(icon, title, text, buttons) {
            document.getElementById('modal-icon').textContent = icon;
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-text').textContent = text;

            const buttonsContainer = document.getElementById('modal-buttons');
            buttonsContainer.innerHTML = buttons.map((btn, idx) => `
                <button class="btn ${btn.primary ? 'btn-primary' : 'btn-secondary'}" onclick="(${btn.action.toString()})()">
                    ${btn.text}
                </button>
            `).join('');

            document.getElementById('modal-overlay').classList.add('show');
        }

        function hideModal() {
            document.getElementById('modal-overlay').classList.remove('show');
        }

        // 启动应用
        init();
    </script>
</body>
</html>
