<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DataVision · 多面板数据集对比</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root,[data-theme="dark"]{
  --bg:#08090d;--surface:#10131c;--card:#161a28;--card2:#1c2135;
  --border:rgba(245,158,11,.06);--border-h:rgba(245,158,11,.18);
  --amber:#F59E0B;--amber-d:rgba(245,158,11,.1);--amber-g:rgba(245,158,11,.3);
  --green:#10B981;--red:#EF4444;--blue:#3B82F6;
  --t1:#ddd8cf;--t2:#7a756d;--t3:#3e3b36;
  --chk1:#1a1d28;--chk2:#151821;--hdr-blur:rgba(16,19,28,.92);
  --grain-opacity:.025;
}
[data-theme="light"]{
  --bg:#eae6de;--surface:#f5f2ec;--card:#edeae4;--card2:#e4e0d8;
  --border:rgba(0,0,0,.07);--border-h:rgba(0,0,0,.14);
  --amber:#d97706;--amber-d:rgba(217,119,6,.1);--amber-g:rgba(217,119,6,.25);
  --green:#059669;--red:#dc2626;--blue:#2563eb;
  --t1:#1a1714;--t2:#7a756d;--t3:#b5b0a8;
  --chk1:#e0dcd4;--chk2:#d8d4cc;--hdr-blur:rgba(245,242,236,.92);
  --grain-opacity:.02;
}
[data-theme="eye"]{
  --bg:#12100d;--surface:#1a1714;--card:#211e1a;--card2:#28241e;
  --border:rgba(190,160,100,.07);--border-h:rgba(190,160,100,.18);
  --amber:#c89030;--amber-d:rgba(200,144,48,.1);--amber-g:rgba(200,144,48,.25);
  --green:#7cb342;--red:#e57373;--blue:#64b5f6;
  --t1:#c8bfa8;--t2:#6a6050;--t3:#3a3428;
  --chk1:#1e1b16;--chk2:#19160f;--hdr-blur:rgba(26,23,20,.92);
  --grain-opacity:.015;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t1);font:13px/1.5 'DM Mono',monospace}
body{display:flex;flex-direction:column;transition:background-color .35s,color .35s}
::selection{background:var(--amber-d);color:var(--amber)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--t3);border-radius:2px}

body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:var(--grain-opacity);
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:128px 128px;transition:opacity .35s}

.hdr{height:46px;display:flex;align-items:center;padding:0 12px;gap:6px;
  background:var(--hdr-blur);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  flex-shrink:0;z-index:50;transition:background-color .35s,border-color .35s}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:14px;letter-spacing:1px;
  background:linear-gradient(135deg,var(--amber),#F97316);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;flex-shrink:0}
.sep{width:1px;height:22px;background:var(--border);flex-shrink:0;transition:background-color .35s}
.btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--border);
  background:var(--card);color:var(--t1);border-radius:6px;cursor:pointer;font:inherit;font-size:11px;
  transition:all .2s;white-space:nowrap;user-select:none;flex-shrink:0}
.btn:hover{border-color:var(--border-h);background:var(--card2)}
.btn.on{background:var(--amber-d);border-color:rgba(245,158,11,.2);color:var(--amber)}
.btn.pri{background:var(--amber-d);border-color:var(--amber-g);color:var(--amber)}
.btn.pri:hover{background:var(--amber-g)}
.btn:disabled{opacity:.3;pointer-events:none}
.btn svg{width:13px;height:13px;flex-shrink:0}
.gap{flex:1;min-width:4px}

.search-box{position:relative;flex-shrink:0}
.search-box input{width:150px;padding:4px 8px 4px 24px;border:1px solid var(--border);background:var(--card);
  color:var(--t1);border-radius:6px;font:inherit;font-size:11px;outline:none;transition:all .2s}
.search-box input:focus{border-color:var(--border-h);width:210px}
.search-box input::placeholder{color:var(--t3)}
.search-box svg{position:absolute;left:7px;top:50%;transform:translateY(-50%);width:12px;height:12px;color:var(--t3);pointer-events:none}
.search-box .sres{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--t3)}

.stats{font-size:10px;color:var(--t2);display:flex;gap:8px;white-space:nowrap;flex-shrink:0;overflow:hidden}
.stats b{color:var(--amber);font-weight:500}
.nav-group{display:flex;align-items:center;gap:3px;flex-shrink:0}
.nav-group .nc{font-size:11px;color:var(--t2);min-width:52px;text-align:center}

.theme-btn .theme-label{font-size:10px}

/* Progress bar */
.prog-wrap{height:0;overflow:hidden;background:var(--surface);border-bottom:1px solid var(--border);
  flex-shrink:0;position:relative;transition:height .25s,border-color .35s,background-color .35s}
.prog-wrap.show{height:22px}
.prog-fill{position:absolute;left:0;top:0;bottom:0;background:var(--amber-d);transition:width .15s;width:0}
.prog-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--t2);pointer-events:none}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.pgrid{flex:1;display:grid;gap:1px;background:rgba(128,128,128,.03);overflow:hidden;
  transition:grid-template-columns .35s cubic-bezier(.4,0,.2,1)}
.pgrid[data-n="1"]{grid-template-columns:1fr}
.pgrid[data-n="2"]{grid-template-columns:1fr 1fr}
.pgrid[data-n="3"]{grid-template-columns:1fr 1fr 1fr}
.pgrid[data-n="4"]{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}

.pnl{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);position:relative;
  animation:panelIn .35s ease both;transition:background-color .35s}
@keyframes panelIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.pnl.fs{position:fixed;inset:0;z-index:100;animation:none}

.pnl-hdr{height:34px;display:flex;align-items:center;padding:0 8px;gap:5px;
  background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;
  transition:background-color .35s,border-color .35s}
.pnl-title{font-size:11px;font-weight:500;display:flex;align-items:center;gap:4px;overflow:hidden}
.pcolor{display:inline-block;width:7px;height:7px;border-radius:2px;flex-shrink:0}
.pnl-fname{font-size:10px;color:var(--t3);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:2px}
.pnl-cw{flex:1;position:relative;overflow:hidden;background:var(--bg);cursor:grab;min-height:0;transition:background-color .35s}
.pnl-cw.drag{cursor:grabbing}
.pnl-cw canvas{display:block;width:100%;height:100%}
.pnl-cw .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:2}
.pnl-cw .empty.show{opacity:1;pointer-events:all}
.pnl-cw .empty .ei{font-size:40px;opacity:.4}
.pnl-cw .empty p{font-size:11px;color:var(--t2);text-align:center;max-width:220px;line-height:1.6}
.pnl-cw .empty .eh{font-size:10px;color:var(--t3);margin-top:4px}
.pnl-cw .nomatch{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(8,9,13,.85);z-index:3;font-size:12px;color:var(--t3);opacity:0;transition:opacity .3s}
.pnl-cw .nomatch.show{opacity:1}
.pnl-cw .img-info{position:absolute;top:6px;right:6px;background:rgba(8,9,13,.78);backdrop-filter:blur(6px);
  padding:4px 8px;border-radius:5px;font-size:10px;color:var(--t2);z-index:4;display:flex;gap:8px;
  border:1px solid var(--border);opacity:0;transition:opacity .2s;pointer-events:none}
.pnl-cw:hover .img-info{opacity:1}
.img-info b{color:var(--t1);font-weight:500}
.pnl-cw .ld-ring{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:5;background:rgba(8,9,13,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.pnl-cw .ld-ring.show{opacity:1;pointer-events:all}
.spin{width:24px;height:24px;border:2px solid var(--border-h);border-top-color:var(--amber);
  border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pnl-drop{position:absolute;inset:0;background:var(--amber-d);border:2px dashed var(--amber-g);
  display:none;align-items:center;justify-content:center;z-index:10;pointer-events:none}
.pnl-drop.show{display:flex}
.pnl-drop span{font-size:11px;color:var(--amber);background:rgba(8,9,13,.8);padding:4px 12px;border-radius:4px}

.pnl-bar{height:30px;display:flex;align-items:center;justify-content:space-between;gap:4px;
  background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;padding:0 8px;
  transition:background-color .35s,border-color .35s}
.pnl-bar .btn{padding:2px 7px;font-size:10px}
.pnl-bar .zd{font-size:10px;color:var(--t3);min-width:36px;text-align:center}

.pnl-det{border-top:1px solid var(--border);background:var(--surface);max-height:0;
  overflow-y:auto;flex-shrink:0;transition:max-height .3s ease,background-color .35s,border-color .35s}
.pnl-det.open{max-height:240px}
.pnl-det-h{display:flex;align-items:center;justify-content:space-between;padding:5px 10px 3px;
  font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--t2);position:sticky;
  top:0;background:var(--surface);z-index:1}
.pnl-det-h .badge{background:var(--amber-d);color:var(--amber);padding:1px 6px;border-radius:8px;font-size:10px;letter-spacing:0;text-transform:none}
.pnl-annos{padding:2px 8px 4px}
.ai{display:flex;align-items:center;gap:5px;padding:3px 5px;border-radius:4px;
  cursor:pointer;font-size:10px;margin-bottom:1px;transition:all .12s;border:1px solid transparent}
.ai:hover{background:var(--card)}
.ai.sel{background:var(--amber-d);border-color:rgba(245,158,11,.12)}
.ac-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.ai .alb{color:var(--t1);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai .atp{color:var(--t3);font-size:9px}
.pnl-cats{padding:2px 8px 6px}
.cb{margin-bottom:4px}
.cb-h{display:flex;justify-content:space-between;font-size:10px;margin-bottom:2px}
.cb-h .nm{color:var(--t2)}.cb-h .cn{color:var(--t1);font-weight:500}
.cb-bg{height:3px;background:rgba(128,128,128,.08);border-radius:2px;overflow:hidden}
.cb-f{height:100%;border-radius:2px;transition:width .4s ease}

/* Thumbs */
.thumbs-bar{flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);
  transition:height .3s cubic-bezier(.4,0,.2,1),background-color .35s,border-color .35s;overflow:hidden;position:relative;z-index:40}
.thumbs-bar.collapsed{height:0!important;border-top-color:transparent}
.thumbs-inner{display:flex;align-items:center;height:100%;padding:0 6px;gap:4px}
.thumbs-toggle{width:26px;height:100%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;background:none;border:none;color:var(--t2);font-size:11px;flex-shrink:0;transition:color .2s}
.thumbs-toggle:hover{color:var(--amber)}
.thumbs-scroll{flex:1;height:100%;overflow-x:auto;overflow-y:hidden;position:relative}
.thumbs-scroll::-webkit-scrollbar{height:3px}
.thumbs-spacer{position:relative;height:100%;flex-shrink:0}
.thumbs-spacer .tv{position:absolute;top:50%;transform:translateY(-50%);border-radius:4px;overflow:hidden;
  cursor:pointer;border:2px solid transparent;transition:border-color .15s,opacity .15s;opacity:.5}
.thumbs-spacer .tv:hover{opacity:.8;border-color:var(--t3)}
.thumbs-spacer .tv.cur{opacity:1;border-color:var(--amber);box-shadow:0 0 8px rgba(245,158,11,.15)}
.thumbs-spacer .tv img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs-spacer .tv .tl{position:absolute;bottom:0;left:0;right:0;padding:1px 3px;font-size:7px;
  background:rgba(0,0,0,.7);color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumbs-count{font-size:10px;color:var(--t3);flex-shrink:0;min-width:40px;text-align:center}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(8,9,13,.88);backdrop-filter:blur(8px);
  z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border-h);border-radius:12px;
  padding:24px 28px;max-width:420px;width:90%;max-height:80vh;overflow-y:auto;
  animation:modalIn .25s ease;position:relative;transition:background-color .35s,border-color .35s}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal h2{font-family:'Syne',sans-serif;font-size:16px;margin-bottom:14px;
  background:linear-gradient(135deg,var(--amber),#F97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal h3{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:1.5px;margin:14px 0 6px}
.modal .sc{display:flex;justify-content:space-between;padding:4px 0;font-size:12px}
.modal .sc kbd{background:var(--card);border:1px solid var(--border);padding:1px 6px;
  border-radius:4px;font:inherit;font-size:11px;color:var(--amber)}
.modal .cls{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--t2);cursor:pointer;font-size:16px}
.modal .cls:hover{color:var(--t1)}

.gdrop{position:fixed;inset:0;background:rgba(8,9,13,.92);z-index:300;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:10px;backdrop-filter:blur(8px)}
.gdrop.show{display:flex}
.gdrop .di{font-size:48px;opacity:.6}
.gdrop h3{font-family:'Syne',sans-serif;color:var(--amber);font-size:16px}
.gdrop p{font-size:11px;color:var(--t2)}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--card);
  border:1px solid var(--border-h);color:var(--t1);padding:6px 16px;border-radius:8px;
  font-size:11px;z-index:400;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

@media(max-width:1024px){
  .pgrid[data-n="3"]{grid-template-columns:1fr 1fr}
  .pgrid[data-n="3"] .pnl:first-child{grid-column:1/-1}
}
@media(max-width:768px){
  .pgrid,.pgrid[data-n="2"],.pgrid[data-n="3"],.pgrid[data-n="4"]{
    grid-template-columns:1fr!important;grid-template-rows:auto!important}
  .pnl{min-height:260px}
  .hdr{flex-wrap:wrap;height:auto;padding:6px 8px;gap:4px}
  .hdr .sep{display:none}.stats{display:none}
  .search-box input{width:110px}.search-box input:focus{width:150px}
}
@media(max-width:480px){
  .nav-group .nc{display:none}.pnl-det{display:none}
}
</style>
</head>
<body>
<div class="hdr">
  <span class="logo">DATAVISION</span>
  <div class="sep"></div>
  <button class="btn pri" id="addBtn" title="添加面板"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>面板</button>
  <button class="btn on" id="syncBtn" title="同步导航 (S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>同步</button>
  <button class="btn" id="mergeBtn" title="叠加标注 (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>叠加</button>
  <div class="sep"></div>
  <div class="nav-group">
    <button class="btn" id="prevBtn" title="上一张 (←)">◀</button>
    <span class="nc" id="nc"><b>0</b> / 0</span>
    <button class="btn" id="nextBtn" title="下一张 (→)">▶</button>
  </div>
  <div class="gap"></div>
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="搜索文件名…" autocomplete="off">
    <span class="sres" id="sres"></span>
  </div>
  <div class="sep"></div>
  <div class="stats" id="globalStats"></div>
  <button class="btn theme-btn" id="themeBtn" title="切换主题">
    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
    <span class="theme-label" id="themeLabel">深色</span>
  </button>
  <button class="btn" id="helpBtn" title="帮助 (?)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9 9a3 3 0 114 3c0 1.5-2 2-2 3.5"/><circle cx="12" cy="17" r=".5" fill="currentColor"/></svg></button>
</div>

<div class="prog-wrap" id="progWrap"><div class="prog-fill" id="progFill"></div><span class="prog-label" id="progLabel"></span></div>

<div class="main"><div class="pgrid" id="pgrid" data-n="0"></div></div>

<div class="thumbs-bar" id="thumbsBar" style="height:74px">
  <div class="thumbs-inner">
    <button class="thumbs-toggle" id="thumbsToggle" title="缩略图 (T)">▼</button>
    <div class="thumbs-scroll" id="thumbsScroll"><div class="thumbs-spacer" id="thumbsSpacer"></div></div>
    <span class="thumbs-count" id="thumbsCount">0</span>
  </div>
</div>

<div class="modal-overlay" id="helpModal">
  <div class="modal">
    <button class="cls" id="helpClose">✕</button>
    <h2>快捷键</h2>
    <h3>导航</h3>
    <div class="sc"><span>上 / 下一张</span><kbd>A/←</kbd> <kbd>D/→</kbd></div>
    <div class="sc"><span>首 / 末张</span><kbd>Home</kbd> <kbd>End</kbd></div>
    <div class="sc"><span>跳页 ±10</span><kbd>Shift+←/→</kbd></div>
    <h3>视图</h3>
    <div class="sc"><span>同步导航</span><kbd>S</kbd></div>
    <div class="sc"><span>叠加标注</span><kbd>V</kbd></div>
    <div class="sc"><span>缩略图栏</span><kbd>T</kbd></div>
    <div class="sc"><span>标注详情</span><kbd>E</kbd></div>
    <div class="sc"><span>全屏面板</span><kbd>F</kbd></div>
    <div class="sc"><span>重置缩放</span><kbd>0</kbd> / 双击</div>
    <h3>其他</h3>
    <div class="sc"><span>切换主题</span><kbd>Q</kbd></div>
    <div class="sc"><span>取消 / 关闭</span><kbd>Esc</kbd></div>
    <div class="sc"><span>帮助</span><kbd>?</kbd></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="gdrop" id="gdrop"><div class="di">📂</div><h3>释放以加载数据集</h3><p>支持文件夹拖拽</p></div>
<input type="file" id="fileInput" webkitdirectory multiple hidden>

<script>
/* ═══════════════════════════════════════════════════════
   1. CONSTANTS
   ═══════════════════════════════════════════════════════ */
const PAL=['#F59E0B','#3B82F6','#10B981','#EF4444','#8B5CF6','#EC4899','#06B6D4','#F97316'];
const CAT_PAL=['#F59E0B','#EF4444','#10B981','#3B82F6','#8B5CF6','#EC4899','#06B6D4','#F97316','#84CC16','#6366F1','#14B8A6','#F43F5E'];
const IMG_EXT=new Set(['jpg','jpeg','png','bmp','webp','gif','tiff','tif','avif']);
const $=id=>document.getElementById(id);
const THEME_KEYS=['dark','light','eye'];
const THEME_LABELS={dark:'深色',light:'浅色',eye:'护眼'};
const THEME_ICONS={

/* ═══════════════════════════════════════════════════════
   3. UTILITIES
   ═══════════════════════════════════════════════════════ */
function stem(p){const n=p.split('/').pop();return n.substring(0,n.lastIndexOf('.'))||n;}
function dir(p){const i=p.lastIndexOf('/');return i>=0?p.substring(0,i+1):'';}
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}
function rRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function catColor(p,cat){if(!p.cats.has(cat)){p.cats.set(cat,CAT_PAL[p._ci%CAT_PAL.length]);p._ci++;}return p.cats.get(cat);}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tid);t._tid=setTimeout(()=>t.classList.remove('show'),2000);}
function fmtBytes(b){if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(1)+'KB';return(b/1048576).toFixed(1)+'MB';}
function yieldToMain(){return new Promise(r=>setTimeout(r,0));}

/* ═══════════════════════════════════════════════════════
   4. LRU CACHE
   ═══════════════════════════════════════════════════════ */
function LRUCache(max){this.max=max;this.m=new Map();}
LRUCache.prototype.get=function(k){if(!this.m.has(k))return undefined;const v=this.m.get(k);this.m.delete(k);this.m.set(k,v);return v;};
LRUCache.prototype.set=function(k,v){if(this.m.has(k))this.m.delete(k);this.m.set(k,v);while(this.m.size>this.max){const ok=this.m.keys().next().value;const ov=this.m.get(ok);if(typeof ov==='string'&&ov.startsWith('blob:'))URL.revokeObjectURL(ov);this.m.delete(ok);}};
LRUCache.prototype.has=function(k){return this.m.has(k);};
LRUCache.prototype.clear=function(){this.m.clear();};

/* ═══════════════════════════════════════════════════════
   5. VIRTUAL THUMB SCROLLER
   ═══════════════════════════════════════════════════════ */
function VScroller(scrollEl,spacerEl,opts){
  this.scroll=scrollEl;this.spacer=spacerEl;
  this.iw=opts.itemW;this.ih=opts.itemH;this.gap=opts.gap||4;this.buf=opts.buffer||6;
  this.render=opts.render;this.items=[];this.pool=[];this.active=new Map();this._raf=null;
  this.scroll.addEventListener('scroll',()=>this.schedule());
  new ResizeObserver(()=>this.schedule()).observe(this.scroll);
}
VScroller.prototype.setItems=function(items){
  this.items=items;
  this.spacer.style.width=Math.max(0,items.length*(this.iw+this.gap)-this.gap)+'px';
  this.active.forEach(e=>e.remove());this.active.clear();this.pool=[];
  this.schedule();
};
VScroller.prototype.schedule=function(){if(this._raf)return;this._raf=requestAnimationFrame(()=>{this._raf=null;this._update();});};
VScroller.prototype._update=function(){
  if(!thumbsOpen||!this.items.length)return;
  const sl=this.scroll.scrollLeft,vw=this.scroll.clientWidth,step=this.iw+this.gap;
  const s=Math.max(0,Math.floor(sl/step)-this.buf);
  const e=Math.min(this.items.length,Math.ceil((sl+vw)/step)+this.buf);
  for(const[i,el]of this.active){if(i<s||i>=e){el.remove();this.pool.push(el);this.active.delete(i);}}
  for(let i=s;i<e;i++){
    if(!this.active.has(i)){
      let el=this.pool.pop()||document.createElement('div');
      el.style.cssText=`position:absolute;left:${i*step}px;top:50%;transform:translateY(-50%);width:${this.iw}px;height:${this.ih}px`;
      el.innerHTML='';el.className='tv';
      this.render(el,this.items[i],i);
      this.spacer.appendChild(el);this.active.set(i,el);
    }
  }
};
VScroller.prototype.scrollToIdx=function(idx){
  const step=this.iw+this.gap;
  this.scroll.scrollTo({left:Math.max(0,idx*step-this.scroll.clientWidth/2+this.iw/2),behavior:'smooth'});
};
VScroller.prototype.refresh=function(idx){
  const el=this.active.get(idx);if(!el)return;
  el.innerHTML='';this.render(el,this.items[idx],idx);
};
VScroller.prototype.refreshAll=function(){
  for(const[i,el]of this.active){el.innerHTML='';this.render(el,this.items[i],i);}
};

/* ═══════════════════════════════════════════════════════
   8. MASTER STEM INDEX
   ═══════════════════════════════════════════════════════ */
function rebuildMaster(){
  const all=new Set();
  panels.forEach(p=>p.imgs.forEach(ip=>all.add(stem(ip))));
  masterStems=[...all].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  applySearch();
}
function applySearch(){
  filteredStems=searchQuery?masterStems.filter(s=>s.toLowerCase().includes(searchQuery)):[...masterStems];
  $('sres').textContent=searchQuery?(filteredStems.length+'/'+masterStems.length):'';
  renderThumbs();
}
function findInPanel(p,s){return p.imgs.findIndex(ip=>stem(ip)===s);}

/* ═══════════════════════════════════════════════════════
   10. FILE LOADING (chunked)
   ═══════════════════════════════════════════════════════ */
async function loadPanelFolder(p){
  if(window.showDirectoryPicker){try{const h=await window.showDirectoryPicker({mode:'read'});resetPanel(p);await readDir(h,'',p);await finishPanelLoad(p);}catch(e){if(e.name!=='AbortError')console.error(e);}}
  else{loadTarget=p.id;$('fileInput').click();}
}
$('fileInput').onchange=function(){
  if(!this.files.length)return;const p=panels.find(pp=>pp.id===loadTarget);if(!p)return;
  resetPanel(p);for(const f of this.files){const parts=f.webkitRelativePath.split('/');parts.shift();const path=parts.join('/');if(path)p.files.set(path,{file:f,name:f.name,path});}
  finishPanelLoad(p);this.value='';
};
async function readDir(dh,prefix,p){
  for await(const e of dh.values()){
    if(e.kind==='file'){const f=await e.getFile();p.files.set(prefix+e.name,{file:f,name:f.name,path:prefix+e.name});}
    else if(e.kind==='directory')await readDir(e,prefix+e.name+'/',p);
  }
}
function resetPanel(p){p.files.clear();p.imgs=[];p.annos.clear();p.cats.clear();p._ci=0;p.ci=0;p.selA=-1;p.zoom=1;p.px=0;p.py=0;}

async function finishPanelLoad(p){
  const ld=p.el.querySelector('.ld-ring');ld.classList.add('show');
  await yieldToMain();

  // 1. Classify files
  p.imgs=[];const annoPaths=[];
  p.files.forEach((f,path)=>{
    const ext=path.split('.').pop().toLowerCase();
    if(IMG_EXT.has(ext))p.imgs.push(path);
    else if(['json','txt','xml'].includes(ext))annoPaths.push(path);
  });
  p.imgs.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));

  // 2. Read annotation files in chunks
  const CHUNK=200;
  for(let i=0;i<annoPaths.length;i+=CHUNK){
    const batch=annoPaths.slice(i,i+CHUNK);
    await Promise.all(batch.map(path=>{const f=p.files.get(path);return f.file.text().then(t=>{f.content=t;}).catch(()=>{f.content='';});}));
    showProg('读取标注…',Math.min(1,(i+CHUNK)/annoPaths.length));
    await yieldToMain();
  }

  // 3. Parse annotations
  showProg('解析标注…',0.5);
  await yieldToMain();
  parseAllAnnotations(p);

  p.el.querySelector('.empty').classList.remove('show');
  rebuildMaster();
  if(p.imgs.length>0){
    if(panels.indexOf(p)===0||masterStems.length===p.imgs.length)globalIdx=0;
    const targetStem=filteredStems[globalIdx]||masterStems[0]||'';
    const mi=findInPanel(p,targetStem);p.ci=mi>=0?mi:0;
    if(mi<0&&p.imgs.length){globalIdx=filteredStems.indexOf(stem(p.imgs[0]));if(globalIdx<0)globalIdx=0;}
    loadPanelImage(p);
  }
  syncAllToStem();updateGlobalStats();ld.classList.remove('show');hideProg();
  toast(`已加载 ${p.imgs.length} 张图片`);
}

/* ═══════════════════════════════════════════════════════
   11. ANNOTATION PARSING
   ═══════════════════════════════════════════════════════ */
function parseAllAnnotations(p){
  const jsons=[],txts=[],xmls=[];
  p.files.forEach((f,path)=>{const ext=path.split('.').pop().toLowerCase();if(ext==='json')jsons.push(path);else if(ext==='txt')txts.push(path);else if(ext==='xml')xmls.push(path);});
  let coco=false;jsons.forEach(path=>{if(coco)return;try{const d=JSON.parse(p.files.get(path).content);if(d.images&&d.annotations&&Array.isArray(d.images)){parseCoco(p,d);coco=true;}}catch(e){}});
  jsons.forEach(path=>{try{const d=JSON.parse(p.files.get(path).content);if(d.shapes&&Array.isArray(d.shapes))parseLabelMe(p,d,path);}catch(e){}});
  jsons.forEach(path=>{try{const d=JSON.parse(p.files.get(path).content);if(!d.images&&!d.shapes&&typeof d==='object'&&Object.keys(d).length)parseGeneric(p,d,path);}catch(e){}});
  txts.forEach(path=>{if(/classes\.txt$/i.test(path))return;parseYolo(p,path);});
  xmls.forEach(path=>{parseVOCF(p,path);});
  p.imgs.forEach(imgPath=>{const st=stem(imgPath),d=dir(imgPath);['json','txt','xml'].forEach(ext=>{const aP=d+st+'.'+ext;const f=p.files.get(aP);if(!f||f._u)return;f._u=true;if(ext==='json'){try{const dd=JSON.parse(f.content);if(dd.shapes)parseLabelMe(p,dd,aP);}catch(e){}}else if(ext==='xml')parseVOC(p,f.content,imgPath);});});
}
function parseCoco(p,data){
  const cm=new Map();(data.categories||[]).forEach(c=>{cm.set(c.id,c.name);catColor(p,c.name);});
  const fm=new Map();p.imgs.forEach(ip=>{fm.set(ip.split('/').pop(),ip);fm.set(stem(ip),ip);});
  const ip=new Map();(data.images||[]).forEach(im=>{const fn=im.file_name||'';const fp=fm.get(fn)||fm.get(fn.replace(/\.[^.]+$/,''));if(fp)ip.set(im.id,fp);});
  (data.annotations||[]).forEach(a=>{const fp=ip.get(a.image_id);if(!fp)return;const cat=cm.get(a.category_id)||'unknown';catColor(p,cat);if(!p.annos.has(fp))p.annos.set(fp,[]);const e={type:'bbox',bbox:a.bbox||[0,0,0,0],category:cat};if(a.segmentation&&a.segmentation.length){const seg=a.segmentation[0];if(Array.isArray(seg)&&seg.length>=6){e.type='polygon';e.points=[];for(let i=0;i<seg.length;i+=2)e.points.push([seg[i],seg[i+1]]);}}p.annos.get(fp).push(e);});
}
function parseLabelMe(p,data,jp){
  const st=stem(jp),d=dir(jp);let ip=p.imgs.find(i=>stem(i)===st&&dir(i)===d)||p.imgs.find(i=>stem(i)===st);if(!ip)return;
  const ann=(data.shapes||[]).map(s=>{const c=s.label||'unknown';catColor(p,c);if((s.shape_type==='rectangle'||s.shape_type==='rect')&&s.points.length>=2){const[a,b]=s.points;return{type:'bbox',bbox:[Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1])],category:c};}if(s.shape_type==='circle'&&s.points.length>=2){const[ct,r]=s.points;const rd=Math.hypot(r[0]-ct[0],r[1]-ct[1]);return{type:'bbox',bbox:[ct[0]-rd,ct[1]-rd,rd*2,rd*2],category:c};}if(s.points&&s.points.length>=3){const xs=s.points.map(pt=>pt[0]),ys=s.points.map(pt=>pt[1]);return{type:'polygon',points:s.points,bbox:[Math.min(...xs),Math.min(...ys),Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys)],category:c};}return null;}).filter(Boolean);
  if(ann.length){if(!p.annos.has(ip))p.annos.set(ip,[]);p.annos.get(ip).push(...ann);}
}
function parseGeneric(p,data,jp){
  const st=stem(jp),d=dir(jp);let ip=p.imgs.find(i=>stem(i)===st&&dir(i)===d)||p.imgs.find(i=>stem(i)===st);if(!ip)return;
  const items=Array.isArray(data)?data:(data.objects||data.detections||data.annotations||data.labels||[]);if(!Array.isArray(items)||!items.length)return;
  const ann=[];items.forEach(o=>{const c=o.label||o.name||o.category||o.class||'object';catColor(p,c);if(o.bbox&&Array.isArray(o.bbox)&&o.bbox.length>=4){const[x,y,w,h]=o.bbox;ann.push({type:'bbox',bbox:[x,y,Math.abs(w),Math.abs(h)],category:c});}else if(o.x!=null&&o.width!=null)ann.push({type:'bbox',bbox:[o.x||0,o.y||0,o.width||0,o.height||0],category:c});else if(o.points&&Array.isArray(o.points)&&o.points.length>=3){const pts=o.points.map(pt=>Array.isArray(pt)?pt:[pt.x||0,pt.y||0]);const xs=pts.map(pt=>pt[0]),ys=pts.map(pt=>pt[1]);ann.push({type:'polygon',points:pts,bbox:[Math.min(...xs),Math.min(...ys),Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys)],category:c});}});
  if(ann.length){if(!p.annos.has(ip))p.annos.set(ip,[]);p.annos.get(ip).push(...ann);}
}
function parseYolo(p,tp){
  const f=p.files.get(tp);if(!f||!f.content||!f.content.trim())return;const st=stem(tp),d=dir(tp);
  let ip=p.imgs.find(i=>stem(i)===st&&(dir(i)===d||dir(i).replace(/labels?\/?$/i,'')===d.replace(/labels?\/?$/i,'')));if(!ip)ip=p.imgs.find(i=>stem(i)===st);if(!ip)return;
  let cn=[];const cf=[...p.files.keys()].find(k=>/classes\.txt$/i.test(k));if(cf)cn=(p.files.get(cf).content||'').trim().split('\n').map(s=>s.trim()).filter(Boolean);
  const ann=f.content.trim().split('\n').filter(l=>l.trim()).map(line=>{const pts=line.trim().split(/\s+/);if(pts.length<5)return null;const cid=parseInt(pts[0]),cx=parseFloat(pts[1]),cy=parseFloat(pts[2]),w=parseFloat(pts[3]),h=parseFloat(pts[4]);if(isNaN(cx)||isNaN(cy)||isNaN(w)||isNaN(h))return null;const c=cn[cid]||`class_${cid}`;catColor(p,c);return{type:'bbox',bbox:[cx-w/2,cy-h/2,w,h],category:c,normalized:true};}).filter(Boolean);
  if(ann.length){if(!p.annos.has(ip))p.annos.set(ip,[]);p.annos.get(ip).push(...ann);}
}
function parseVOCF(p,xp){const f=p.files.get(xp);if(!f||!f.content)return;const st=stem(xp),d=dir(xp);let ip=p.imgs.find(i=>stem(i)===st&&dir(i)===d)||p.imgs.find(i=>stem(i)===st);if(!ip)return;parseVOC(p,f.content,ip);}
function parseVOC(p,xml,ip){
  const doc=new DOMParser().parseFromString(xml,'text/xml');const objs=doc.querySelectorAll('object');if(!objs.length)return;
  const ann=[];objs.forEach(o=>{const n=o.querySelector('name')?.textContent||'unknown';catColor(p,n);const bb=o.querySelector('bndbox');if(bb){const x1=+(bb.querySelector('xmin')?.textContent||0),y1=+(bb.querySelector('ymin')?.textContent||0),x2=+(bb.querySelector('xmax')?.textContent||0),y2=+(bb.querySelector('ymax')?.textContent||0);ann.push({type:'bbox',bbox:[x1,y1,x2-x1,y2-y1],category:n});}});
  if(ann.length){if(!p.annos.has(ip))p.annos.set(ip,[]);p.annos.get(ip).push(...ann);}
}

/* ═══════════════════════════════════════════════════════
   12. IMAGE LOADING (cached)
   ═══════════════════════════════════════════════════════ */
function getBlobUrl(p,path){
  const ck=p.id+':'+path;
  let url=thumbUrlCache.get(ck);
  if(url)return url;
  const f=p.files.get(path);if(!f||!f.file)return null;
  url=URL.createObjectURL(f.file);thumbUrlCache.set(ck,url);return url;
}
function loadPanelImage(p){
  if(p.ci<0||p.ci>=p.imgs.length){p.img=null;p.hasMatch=false;p.el.querySelector('.nomatch').classList.add('show');renderPanel(p);updatePanelUI(p);return;}
  const path=p.imgs[p.ci];
  const ck=p.id+':'+path;
  const cached=imgCache.get(ck);
  if(cached){p.img=cached;p.url=null;p.hasMatch=true;p.selA=-1;p.el.querySelector('.nomatch').classList.remove('show');renderPanel(p);updatePanelUI(p);updatePanelInfo(p);return;}
  const url=getBlobUrl(p,path);if(!url){p.img=null;p.hasMatch=false;renderPanel(p);updatePanelUI(p);return;}
  const img=new Image();
  img.onload=()=>{imgCache.set(ck,img);p.img=img;p.url=url;p.hasMatch=true;p.selA=-1;p.el.querySelector('.nomatch').classList.remove('show');renderPanel(p);updatePanelUI(p);updatePanelInfo(p);};
  img.onerror=()=>{p.img=null;p.hasMatch=false;renderPanel(p);updatePanelUI(p);};
  img.src=url;
}
function updatePanelInfo(p){
  const el=p.cwEl.querySelector('.img-info');if(!p.img){el.innerHTML='';return;}
  const path=p.imgs[p.ci],f=p.files.get(path),ann=p.annos.get(path)||[];
  el.innerHTML=`<span><b>${p.img.width}×${p.img.height}</b></span>${f?.file?`<span>${fmtBytes(f.file.size)}</span>`:''}<span>标注 <b>${ann.length}</b></span>`;
}

/* ═══════════════════════════════════════════════════════
   13. CANVAS RENDERING
   ═══════════════════════════════════════════════════════ */
function resizePanel(p){const cw=p.cwEl,dpr=devicePixelRatio||1;p.cvEl.width=cw.clientWidth*dpr;p.cvEl.height=cw.clientHeight*dpr;p.cvEl.style.width=cw.clientWidth+'px';p.cvEl.style.height=cw.clientHeight+'px';renderPanel(p);}
function resizeAll(){panels.forEach(p=>resizePanel(p));}

function renderPanel(p){
  const dpr=devicePixelRatio||1,cw=p.cvEl.width/dpr,ch=p.cvEl.height/dpr,c=p.ctx;
  c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,cw,ch);
  if(!p.img)return;
  const iW=p.img.width,iH=p.img.height,iA=iW/iH,cA=cw/ch;
  let fW,fH,fX,fY;
  if(iA>cA){fW=cw;fH=cw/iA;fX=0;fY=(ch-fH)/2;}else{fH=ch;fW=ch*iA;fX=(cw-fW)/2;fY=0;}
  const sX=fW/iW,sY=fH/iH;p._fit={x:fX,y:fY,w:fW,h:fH,sX,sY,iW,iH};
  c.save();c.translate(p.px,p.py);c.scale(p.zoom,p.zoom);
  const cs=10;for(let y=Math.floor(fY/cs)*cs;y<fY+fH;y+=cs)for(let x=Math.floor(fX/cs)*cs;x<fX+fW;x+=cs)c.fillStyle=((Math.floor(x/cs)+Math.floor(y/cs))%2===0)?'var(--chk1)':'var(--chk2)',c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue(((Math.floor(x/cs)+Math.floor(y/cs))%2===0)?'--chk1':'--chk2').trim(),c.fillRect(x,y,cs,cs);
  c.drawImage(p.img,fX,fY,fW,fH);
  if(p.showA){
    const curStem=p.imgs.length&&p.ci>=0?stem(p.imgs[p.ci]):'';
    if(p.hasMatch&&p.ci>=0){const myP=p.imgs[p.ci],myA=p.annos.get(myP)||[];myA.forEach((a,i)=>drawAnno(c,a,fX,fY,sX,sY,i===p.selA,PAL[p.idx%8],false,p._fit));}
    if(mergeView&&curStem)panels.forEach((op,oi)=>{if(op.id===p.id)return;const oi2=findInPanel(op,curStem);if(oi2<0)return;const oP=op.imgs[oi2],oA=op.annos.get(oP)||[],oC=PAL[oi%8];oA.forEach(a=>drawAnno(c,a,fX,fY,sX,sY,false,oC,true,p._fit));});
  }
  c.strokeStyle='rgba(128,128,128,.06)';c.lineWidth=1/p.zoom;c.strokeRect(fX,fY,fW,fH);c.restore();
}

function drawAnno(c,a,ix,iy,sx,sy,sel,col,muted,f){
  const alpha=sel?.3:muted?.08:.14,lw=sel?2.5:muted?1:1.5,dash=sel?[5,3]:muted?[3,3]:[];
  c.save();c.strokeStyle=col;c.lineWidth=lw;c.setLineDash(dash);
  const tx=x=>a.norm?ix+x*f.w:ix+x*sx,ty=y=>a.norm?iy+y*f.h:iy+y*sy;
  if(a.type==='polygon'&&a.points){c.beginPath();a.points.forEach((pt,i)=>{const px=tx(pt[0]),py=ty(pt[1]);i===0?c.moveTo(px,py):c.lineTo(px,py);});c.closePath();c.fillStyle=hexA(col,alpha);c.fill();c.stroke();if(!muted&&a.points.length)drawLabel(c,tx(a.points[0][0]),ty(a.points[0][1]),a.category,col,sel);}
  else{let[bx,by,bw,bh]=a.bbox;const rx=tx(bx),ry=ty(by),rw=bw*(a.norm?f.w:sx),rh=bh*(a.norm?f.h:sy);c.fillStyle=hexA(col,alpha);c.fillRect(rx,ry,rw,rh);c.strokeRect(rx,ry,rw,rh);if(!muted)drawLabel(c,rx,ry,a.category,col,sel);}
  c.setLineDash([]);c.restore();
}
function drawLabel(c,x,y,l,col,sel){c.font=`500 10px "DM Mono",monospace`;const tw=c.measureText(l).width;c.fillStyle=sel?col:hexA(col,.8);rRect(c,x,y-14,tw+10,14,3);c.fill();c.fillStyle='#fff';c.fillText(l,x+5,y-4);}

/* ═══════════════════════════════════════════════════════
   14. ZOOM & PAN
   ═══════════════════════════════════════════════════════ */
function setupCanvas(p){
  const cw=p.cwEl;
  cw.addEventListener('wheel',e=>{e.preventDefault();if(!p.img)return;const r=p.cvEl.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,z=e.deltaY<0?1.1:.91;const tgs=syncNav?panels:[p];tgs.forEach(t=>{if(!t.img)return;const wx=(mx-t.px)/t.zoom,wy=(my-t.py)/t.zoom;t.zoom=Math.max(.05,Math.min(50,t.zoom*z));t.px=mx-wx*t.zoom;t.py=my-wy*t.zoom;renderPanel(t);t.el.querySelector('.zd').textContent=Math.round(t.zoom*100)+'%';});},{passive:false});
  cw.addEventListener('mousedown',e=>{if(e.button!==0)return;const tgs=syncNav?panels:[p];tgs.forEach(t=>{t.drag=true;t.dsx=e.clientX;t.dsy=e.clientY;t.dpx=t.px;t.dpy=t.py;t.cwEl.classList.add('drag');});});
  window.addEventListener('mousemove',e=>{if(!p.drag)return;const tgs=syncNav?panels:[p];tgs.forEach(t=>{if(!t.drag)return;t.px=t.dpx+(e.clientX-t.dsx);t.py=t.dpy+(e.clientY-t.dsy);renderPanel(t);});});
  window.addEventListener('mouseup',()=>{const tgs=syncNav?panels:[p];tgs.forEach(t=>{t.drag=false;t.cwEl.classList.remove('drag');});});
  cw.addEventListener('dblclick',()=>{const tgs=syncNav?panels:[p];tgs.forEach(t=>{t.zoom=1;t.px=0;t.py=0;renderPanel(t);t.el.querySelector('.zd').textContent='100%';});});
  cw.addEventListener('click',e=>{if(!p.img||!p._fit)return;if(Math.abs(e.clientX-p.dsx)>3||Math.abs(e.clientY-p.dsy)>3)return;const r=p.cvEl.getBoundingClientRect(),mx=(e.clientX-r.left-p.px)/p.zoom,my=(e.clientY-r.top-p.py)/p.zoom,f=p._fit,iX=(mx-f.x)/f.sX,iY=(my-f.y)/f.sY;if(p.ci<0)return;const path=p.imgs[p.ci],ann=p.annos.get(path)||[];let found=-1;for(let i=ann.length-1;i>=0;i--){const a=ann[i];if(!a.bbox)continue;let[bx,by,bw,bh]=a.bbox;if(a.norm){bx*=f.w;by*=f.h;bw*=f.w;bh*=f.h;}if(iX>=bx&&iX<=bx+bw&&iY>=by&&iY<=by+bh){found=i;break;}}p.selA=found;renderPanel(p);updatePanelAnnoList(p);});
  setupPanelDrop(p);
}
function setupPanelDrop(p){
  let dc=0;const cw=p.cwEl;
  cw.addEventListener('dragenter',e=>{e.preventDefault();e.stopPropagation();dc++;p.el.querySelector('.pnl-drop').classList.add('show');});
  cw.addEventListener('dragleave',e=>{e.preventDefault();e.stopPropagation();dc--;if(dc<=0){dc=0;p.el.querySelector('.pnl-drop').classList.remove('show');}});
  cw.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();});
  cw.addEventListener('drop',async e=>{e.preventDefault();e.stopPropagation();dc=0;p.el.querySelector('.pnl-drop').classList.remove('show');const items=e.dataTransfer.items;if(!items)return;resetPanel(p);const proms=[];for(const item of items){if(item.kind!=='file')continue;const entry=item.webkitGetAsEntry?.();if(entry)proms.push(readEntry(entry,'',p));else{const f=item.getAsFile();if(f)p.files.set(f.name,{file:f,name:f.name,path:f.name});}}await Promise.all(proms);finishPanelLoad(p);});
}
async function readEntry(entry,prefix,p){
  if(entry.isFile)return new Promise(r=>entry.file(f=>{p.files.set(prefix+f.name,{file:f,name:f.name,path:prefix+f.name});r();},()=>r()));
  if(entry.isDirectory){const reader=entry.createReader();return new Promise(resolve=>{const batch=()=>{reader.readEntries(async entries=>{if(!entries.length){resolve();return;}await Promise.all(entries.map(e=>readEntry(e,prefix+entry.name+'/',p)));batch();},()=>resolve());};batch();});}
}

/* ═══════════════════════════════════════════════════════
   15. NAVIGATION
   ═══════════════════════════════════════════════════════ */
function navigateAll(d){
  const stems=filteredStems.length?filteredStems:masterStems;if(!stems.length)return;
  globalIdx=(globalIdx+d+stems.length)%stems.length;syncAllToStem();
}
function jumpAll(d){
  const stems=filteredStems.length?filteredStems:masterStems;if(!stems.length)return;
  globalIdx=Math.max(0,Math.min(stems.length-1,globalIdx+d));syncAllToStem();
}
function syncAllToStem(){
  const stems=filteredStems.length?filteredStems:masterStems;if(!stems.length)return;
  const targetStem=stems[globalIdx];
  panels.forEach(p=>{const mi=findInPanel(p,targetStem);if(mi>=0){p.ci=mi;p.hasMatch=true;}else{p.ci=-1;p.hasMatch=false;}loadPanelImage(p);});
  updateGlobalNav();highlightThumb();
}

/* ═══════════════════════════════════════════════════════
   16. THUMBNAILS (virtual)
   ═══════════════════════════════════════════════════════ */
function initThumbs(){
  virtualThumbs=new VScroller($('thumbsScroll'),$('thumbsSpacer'),{
    itemW:68,itemH:50,gap:4,buffer:10,
    render(el,item,idx){
      el.className='tv'+(idx===globalIdx?' cur':'');el.dataset.idx=idx;
      let url=null;
      for(const p of panels){const mi=findInPanel(p,item);if(mi>=0){url=getBlobUrl(p,p.imgs[mi]);break;}}
      if(url){const img=document.createElement('img');img.loading='lazy';img.src=url;el.appendChild(img);}
      const tl=document.createElement('div');tl.className='tl';tl.textContent=item;el.appendChild(tl);
      el.onclick=()=>{globalIdx=idx;syncAllToStem();};
    }
  });
}
function renderThumbs(){
  const stems=filteredStems.length?filteredStems:masterStems;
  $('thumbsCount').textContent=stems.length;
  if(virtualThumbs)virtualThumbs.setItems(stems);
}
function highlightThumb(){
  if(!virtualThumbs)return;
  virtualThumbs.refreshAll();
  virtualThumbs.scrollToIdx(globalIdx);
}
$('thumbsToggle').onclick=function(){
  thumbsOpen=!thumbsOpen;$('thumbsBar').classList.toggle('collapsed',!thumbsOpen);
  this.textContent=thumbsOpen?'▼':'▲';
  if(thumbsOpen&&virtualThumbs)virtualThumbs.schedule();
  setTimeout(resizeAll,350);
};

/* ═══════════════════════════════════════════════════════
   17. SEARCH
   ═══════════════════════════════════════════════════════ */
$('searchInput').addEventListener('input',function(){
  searchQuery=this.value.toLowerCase().trim();applySearch();
  if(filteredStems.length){globalIdx=0;syncAllToStem();}
  updateGlobalNav();
});

/* ═══════════════════════════════════════════════════════
   18. UI UPDATES
   ═══════════════════════════════════════════════════════ */
function updatePanelUI(p){
  const path=p.ci>=0?p.imgs[p.ci]:'';p.el.querySelector('.pnl-fname').textContent=path?path.split('/').pop():'—';
  p.el.querySelector('.pnl-fname').title=path;
  updatePanelAnnoList(p);updatePanelCats(p);updateGlobalNav();updateGlobalStats();
}
function updatePanelAnnoList(p){
  const path=p.ci>=0&&p.ci<p.imgs.length?p.imgs[p.ci]:'';const annos=path?(p.annos.get(path)||[]):[];
  p.el.querySelector('.pnl-ab').textContent=annos.length;
  const el=p.el.querySelector('.pnl-annos');
  if(!annos.length){el.innerHTML='<div style="color:var(--t3);font-size:10px;padding:4px">无标注</div>';return;}
  el.innerHTML=annos.map((a,i)=>{const col=catColor(p,a.category);return`<div class="ai${i===p.selA?' sel':''}" data-i="${i}"><span class="ac-dot" style="background:${col}"></span><span class="alb">${a.category}</span><span class="atp">${a.type}${a.norm?' ★':''}</span></div>`;}).join('');
  el.querySelectorAll('.ai').forEach(a=>{a.onclick=()=>{p.selA=+a.dataset.i;renderPanel(p);updatePanelAnnoList(p);};a.onmouseenter=()=>{p.selA=+a.dataset.i;renderPanel(p);};a.onmouseleave=()=>{p.selA=-1;renderPanel(p);};});
}
function updatePanelCats(p){
  const counts=new Map();p.annos.forEach(aa=>aa.forEach(a=>counts.set(a.category,(counts.get(a.category)||0)+1)));
  const sorted=[...counts.entries()].sort((a,b)=>b[1]-a[1]);const mx=sorted.length?sorted[0][1]:1;
  const el=p.el.querySelector('.pnl-cats');
  if(!sorted.length){el.innerHTML='<div style="color:var(--t3);font-size:10px;padding:2px 0">—</div>';return;}
  el.innerHTML=sorted.map(([cat,cnt])=>{const col=catColor(p,cat);return`<div class="cb"><div class="cb-h"><span class="nm">${cat}</span><span class="cn">${cnt}</span></div><div class="cb-bg"><div class="cb-f" style="width:${(cnt/mx)*100}%;background:${col}"></div></div></div>`;}).join('');
}
function updateGlobalNav(){const stems=filteredStems.length?filteredStems:masterStems;$('nc').innerHTML=`<b>${stems.length?globalIdx+1:0}</b> / ${stems.length}`;}
function updateGlobalStats(){
  let ti=0,ta=0,tc=new Set();
  panels.forEach(p=>{ti+=p.imgs.length;p.annos.forEach(a=>a.forEach(an=>{ta++;tc.add(an.category);}));});
  let h=`<span>面板 <b>${panels.length}</b></span>`;
  if(panels.length>1)h+=`<span>全匹配 <b>${masterStems.filter(s=>panels.every(p=>findInPanel(p,s)>=0)).length}</b></span>`;
  h+=`<span>标注 <b>${ta}</b></span><span>类别 <b>${tc.size}</b></span>`;
  $('globalStats').innerHTML=h;
}

/* ═══════════════════════════════════════════════════════
   19. HEADER BUTTONS
   ═══════════════════════════════════════════════════════ */
$('addBtn').onclick=addPanel;
$('prevBtn').onclick=()=>navigateAll(-1);
$('nextBtn').onclick=()=>navigateAll(1);
$('syncBtn').onclick=function(){syncNav=!syncNav;this.classList.toggle('on',syncNav);toast(syncNav?'同步导航开启':'同步导航关闭');};
$('mergeBtn').onclick=function(){mergeView=!mergeView;this.classList.toggle('on',mergeView);panels.forEach(renderPanel);};
$('helpBtn').onclick=()=>$('helpModal').classList.add('show');
$('helpClose').onclick=()=>$('helpModal').classList.remove('show');
$('helpModal').onclick=function(e){if(e.target===this)this.classList.remove('show');};

/* ═══════════════════════════════════════════════════════
   20. KEYBOARD
   ═══════════════════════════════════════════════════════ */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'){if(e.key==='Escape')e.target.blur();return;}
  switch(e.key){
    case'ArrowLeft':e.shiftKey?jumpAll(-10):navigateAll(-1);break;
    case'ArrowRight':e.shiftKey?jumpAll(10):navigateAll(1);break;
    case'a':case'A':navigateAll(-1);break;
    case'd':case'D':navigateAll(1);break;
    case'Home':globalIdx=0;syncAllToStem();break;
    case'End':{const stems=filteredStems.length?filteredStems:masterStems;globalIdx=Math.max(0,stems.length-1);syncAllToStem();break;}
    case'v':case'V':$('mergeBtn').click();break;
    case's':case'S':if(!e.ctrlKey&&!e.metaKey)$('syncBtn').click();break;
    case't':case'T':$('thumbsToggle').click();break;
    case'e':case'E':panels.forEach(p=>{p.detOpen=!p.detOpen;p.el.querySelector('.pnl-det').classList.toggle('open',p.detOpen);p.el.querySelector('.pnl-detb').classList.toggle('on',p.detOpen);});break;
    case'f':case'F':if(panels.length===1){const p=panels[0];p.fs=!p.fs;p.el.classList.toggle('fs',p.fs);p.el.querySelector('.pnl-fsb').classList.toggle('on',p.fs);setTimeout(()=>resizePanel(p),50);}break;
    case'0':panels.forEach(p=>{p.zoom=1;p.px=0;p.py=0;renderPanel(p);p.el.querySelector('.zd').textContent='100%';});break;
    case'q':case'Q':cycleTheme();break;
    case'Escape':panels.forEach(p=>{if(p.fs){p.fs=false;p.el.classList.remove('fs');p.el.querySelector('.pnl-fsb').classList.remove('on');setTimeout(()=>resizePanel(p),50);}p.selA=-1;renderPanel(p);updatePanelAnnoList(p);});$('helpModal').classList.remove('show');break;
    case'/':case'?':e.preventDefault();$('helpModal').classList.toggle('show');break;
  }
});

/* ═══════════════════════════════════════════════════════
   21. GLOBAL DRAG & DROP
   ═══════════════════════════════════════════════════════ */
let gdc=0;
document.addEventListener('dragenter',e=>{e.preventDefault();gdc++;$('gdrop').classList.add('show');});
document.addEventListener('dragleave',e=>{e.preventDefault();gdc--;if(gdc<=0){gdc=0;$('gdrop').classList.remove('show');}});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',async e=>{e.preventDefault();gdc=0;$('gdrop').classList.remove('show');const items=e.dataTransfer.items;if(!items||panels.length>=4)return;addPanel();const p=panels[panels.length-1];const proms=[];for(const item of items){if(item.kind!=='file')continue;const entry=item.webkitGetAsEntry?.();if(entry)proms.push(readEntry(entry,'',p));else{const f=item.getAsFile();if(f)p.files.set(f.name,{file:f,name:f.name,path:f.name});}}await Promise.all(proms);finishPanelLoad(p);});

/* ═══════════════════════════════════════════════════════
   22. RESIZE & INIT
   ═══════════════════════════════════════════════════════ */
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(resizeAll,50);});

addPanel();
initThumbs();
setTimeout(resizeAll,60);
</script>
</body>
