server:
  port: 8080

spring:
  application:
    name: community-server

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/community_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: "050622"

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleteTime
      logic-delete-value: now()
      logic-not-delete-value: "null"

# JWT 配置
jwt:
  secret: mySecretKeyForCommunityServer2024ThisIsAVeryLongKeyForHS256
  expiration: 86400000  # Token 有效期：24小时（毫秒）

# 文件上传配置
file:
  upload-path: D:/cs2020/community/  # 文件上传存储路径

# 日志配置
logging:
  level:
    com.example.communityserver: debug
