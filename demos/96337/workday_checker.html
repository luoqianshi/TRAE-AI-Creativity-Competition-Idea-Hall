<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作日快速计算器</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/element-plus/dist/index.full.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      width: 100%;
      max-width: 500px;
    }
    .title {
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      color: #303133;
      margin-bottom: 30px;
    }
    .result-card {
      margin-top: 30px;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }
    .result-title {
      font-size: 18px;
      margin-bottom: 10px;
    }
    .result-value {
      font-size: 28px;
      font-weight: 700;
    }
    .workday {
      background: #f0f9eb;
      border: 1px solid #b7eb8f;
    }
    .workday .result-value {
      color: #52c41a;
    }
    .weekend {
      background: #fff7e6;
      border: 1px solid #ffd591;
    }
    .weekend .result-value {
      color: #fa8c16;
    }
    .holiday {
      background: #fff2f0;
      border: 1px solid #ffccc7;
    }
    .holiday .result-value {
      color: #ff4d4f;
    }
    .workday-adjust {
      background: #e6f7ff;
      border: 1px solid #91d5ff;
    }
    .workday-adjust .result-value {
      color: #1890ff;
    }
    .info-row {
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #606266;
    }
    .quick-dates {
      margin-top: 20px;
    }
    .quick-btn {
      margin-right: 10px;
      margin-bottom: 10px;
    }
    .stats {
      margin-top: 30px;
      display: flex;
      justify-content: space-around;
      padding: 20px;
      background: #f5f7fa;
      border-radius: 12px;
    }
    .stat-item {
      text-align: center;
    }
    .stat-value {
      font-size: 24px;
      font-weight: 600;
      color: #303133;
    }
    .stat-label {
      font-size: 12px;
      color: #909399;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <div class="title">📅 工作日快速计算器</div>
      
      <el-form :model="form" label-width="80px">
        <el-form-item label="选择日期">
          <el-date-picker
            v-model="form.date"
            type="date"
            format="YYYY年MM月DD日"
            value-format="YYYY-MM-DD"
            placeholder="请选择日期"
            @change="checkWorkday"
            style="width: 100%;"
          />
        </el-form-item>
      </el-form>

      <div class="quick-dates">
        <el-button size="small" type="primary" plain @click="selectToday" class="quick-btn">今天</el-button>
        <el-button size="small" type="success" plain @click="selectNextWorkday" class="quick-btn">下个工作日</el-button>
        <el-button size="small" type="warning" plain @click="selectLastWorkday" class="quick-btn">上个工作日</el-button>
        <el-button size="small" type="info" plain @click="selectNextWeek" class="quick-btn">下周</el-button>
      </div>

      <div v-if="result" :class="['result-card', result.type]">
        <div class="result-title">{{ result.title }}</div>
        <div class="result-value">{{ result.text }}</div>
        <div class="info-row">
          <span>星期{{ weekDayText }}</span>
          <span>{{ form.date }}</span>
        </div>
        <div v-if="result.note" style="margin-top: 10px; font-size: 12px; color: #909399;">
          {{ result.note }}
        </div>
      </div>

      <div class="stats">
        <div class="stat-item">
          <div class="stat-value">{{ workdaysCount }}</div>
          <div class="stat-label">本月工作日</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">{{ remainingWorkdays }}</div>
          <div class="stat-label">本月剩余工作日</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">{{ daysToWeekend }}</div>
          <div class="stat-label">距周末天数</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed } = Vue

    createApp({
      setup() {
        const form = ref({
          date: ''
        })
        const result = ref(null)

        const holidays = [
          '2025-01-01', '2025-01-02', '2025-01-03',
          '2025-01-28', '2025-01-29', '2025-01-30', '2025-01-31', '2025-02-01', '2025-02-02', '2025-02-03',
          '2025-04-05', '2025-04-06', '2025-04-07',
          '2025-05-01', '2025-05-02', '2025-05-03', '2025-05-04', '2025-05-05',
          '2025-06-08', '2025-06-09', '2025-06-10',
          '2025-10-01', '2025-10-02', '2025-10-03', '2025-10-04', '2025-10-05', '2025-10-06', '2025-10-07',
          '2026-01-01', '2026-01-02', '2026-01-03',
          '2026-02-17', '2026-02-18', '2026-02-19', '2026-02-20', '2026-02-21', '2026-02-22', '2026-02-23',
          '2026-04-04', '2026-04-05', '2026-04-06',
          '2026-05-01', '2026-05-02', '2026-05-03', '2026-05-04', '2026-05-05',
          '2026-06-19', '2026-06-20', '2026-06-21',
          '2026-10-01', '2026-10-02', '2026-10-03', '2026-10-04', '2026-10-05', '2026-10-06', '2026-10-07',
          '2026-10-08'
        ]

        const workdayAdjusts = [
          '2025-01-26', '2025-02-08',
          '2025-04-04', '2025-04-07',
          '2025-09-28', '2025-10-11',
          '2026-02-15', '2026-02-28',
          '2026-04-02', '2026-04-03',
          '2026-09-27', '2026-10-10'
        ]

        const holidayNames = {
          '2025-01-01': '元旦',
          '2025-01-28': '春节', '2025-01-29': '春节', '2025-01-30': '春节', '2025-01-31': '春节', '2025-02-01': '春节', '2025-02-02': '春节', '2025-02-03': '春节',
          '2025-04-05': '清明节', '2025-04-06': '清明节', '2025-04-07': '清明节',
          '2025-05-01': '劳动节', '2025-05-02': '劳动节', '2025-05-03': '劳动节', '2025-05-04': '劳动节', '2025-05-05': '劳动节',
          '2025-06-08': '端午节', '2025-06-09': '端午节', '2025-06-10': '端午节',
          '2025-10-01': '国庆节', '2025-10-02': '国庆节', '2025-10-03': '国庆节', '2025-10-04': '国庆节', '2025-10-05': '国庆节', '2025-10-06': '国庆节', '2025-10-07': '国庆节',
          '2026-01-01': '元旦',
          '2026-02-17': '春节', '2026-02-18': '春节', '2026-02-19': '春节', '2026-02-20': '春节', '2026-02-21': '春节', '2026-02-22': '春节', '2026-02-23': '春节',
          '2026-04-04': '清明节', '2026-04-05': '清明节', '2026-04-06': '清明节',
          '2026-05-01': '劳动节', '2026-05-02': '劳动节', '2026-05-03': '劳动节', '2026-05-04': '劳动节', '2026-05-05': '劳动节',
          '2026-06-19': '端午节', '2026-06-20': '端午节', '2026-06-21': '端午节',
          '2026-10-01': '国庆节', '2026-10-02': '国庆节', '2026-10-03': '国庆节', '2026-10-04': '国庆节', '2026-10-05': '国庆节', '2026-10-06': '国庆节', '2026-10-07': '国庆节', '2026-10-08': '国庆节'
        }

        const weekDayText = computed(() => {
          if (!form.value.date) return ''
          const days = ['日', '一', '二', '三', '四', '五', '六']
          return days[new Date(form.value.date).getDay()]
        })

        const isWorkday = (dateStr) => {
          const date = new Date(dateStr)
          const day = date.getDay()
          if (holidays.includes(dateStr)) return { isWorkday: false, type: 'holiday', name: holidayNames[dateStr] }
          if (workdayAdjusts.includes(dateStr)) return { isWorkday: true, type: 'workday-adjust', name: '调班上班' }
          if (day === 0 || day === 6) return { isWorkday: false, type: 'weekend', name: day === 0 ? '周日' : '周六' }
          return { isWorkday: true, type: 'workday', name: '工作日' }
        }

        const checkWorkday = () => {
          if (!form.value.date) {
            result.value = null
            return
          }
          const checkResult = isWorkday(form.value.date)
          if (checkResult.isWorkday) {
            result.value = {
              title: '✅ 该日期是工作日',
              text: checkResult.name,
              type: checkResult.type,
              note: checkResult.type === 'workday-adjust' ? '（调班补休，正常上班）' : ''
            }
          } else {
            result.value = {
              title: '❌ 该日期不是工作日',
              text: checkResult.name,
              type: checkResult.type,
              note: ''
            }
          }
        }

        const selectToday = () => {
          const today = new Date()
          form.value.date = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`
          checkWorkday()
        }

        const selectNextWorkday = () => {
          let date = form.value.date ? new Date(form.value.date) : new Date()
          date.setDate(date.getDate() + 1)
          while (true) {
            const dateStr = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`
            const result = isWorkday(dateStr)
            if (result.isWorkday) {
              form.value.date = dateStr
              checkWorkday()
              break
            }
            date.setDate(date.getDate() + 1)
          }
        }

        const selectLastWorkday = () => {
          let date = form.value.date ? new Date(form.value.date) : new Date()
          date.setDate(date.getDate() - 1)
          while (true) {
            const dateStr = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`
            const result = isWorkday(dateStr)
            if (result.isWorkday) {
              form.value.date = dateStr
              checkWorkday()
              break
            }
            date.setDate(date.getDate() - 1)
          }
        }

        const selectNextWeek = () => {
          const date = form.value.date ? new Date(form.value.date) : new Date()
          date.setDate(date.getDate() + 7)
          form.value.date = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`
          checkWorkday()
        }

        const getDaysInMonth = (dateStr) => {
          if (!dateStr) return 0
          const [year, month] = dateStr.split('-').map(Number)
          return new Date(year, month, 0).getDate()
        }

        const workdaysCount = computed(() => {
          if (!form.value.date) return 0
          const days = getDaysInMonth(form.value.date)
          const [year, month] = form.value.date.split('-').map(Number)
          let count = 0
          for (let i = 1; i <= days; i++) {
            const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(i).padStart(2, '0')}`
            if (isWorkday(dateStr).isWorkday) count++
          }
          return count
        })

        const remainingWorkdays = computed(() => {
          if (!form.value.date) return 0
          const days = getDaysInMonth(form.value.date)
          const [year, month] = form.value.date.split('-').map(Number)
          const currentDay = parseInt(form.value.date.split('-')[2])
          let count = 0
          for (let i = currentDay; i <= days; i++) {
            const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(i).padStart(2, '0')}`
            if (isWorkday(dateStr).isWorkday) count++
          }
          return count
        })

        const daysToWeekend = computed(() => {
          if (!form.value.date) return 0
          const day = new Date(form.value.date).getDay()
          if (day === 0) return 6
          if (day === 6) return 0
          return 6 - day
        })

        return {
          form,
          result,
          weekDayText,
          checkWorkday,
          selectToday,
          selectNextWorkday,
          selectLastWorkday,
          selectNextWeek,
          workdaysCount,
          remainingWorkdays,
          daysToWeekend
        }
      }
    }).use(ElementPlus).mount('#app')
  </script>
</body>
</html>
