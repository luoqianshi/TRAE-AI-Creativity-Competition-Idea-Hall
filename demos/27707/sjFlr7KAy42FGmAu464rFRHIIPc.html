<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闯关数据中心</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B35;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2D3436;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'ZCOOL KuaiLe', cursive, system-ui;
            background: #1a1a2e;
            min-height: 100vh;
            overflow-x: hidden;
            color: white;
        }

        /* ========== 动态星空背景 ========== */
        .starfield {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: linear-gradient(180deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .shooting-star {
            position: absolute;
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, white, transparent);
            animation: shoot 4s linear infinite;
            opacity: 0;
        }

        @keyframes shoot {
            0% { transform: translateX(-100px) translateY(0) rotate(-45deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateX(100vw) translateY(100vh) rotate(-45deg); opacity: 0; }
        }

        /* 漂浮云朵 */
        .cloud {
            position: absolute;
            background: rgba(255,255,255,0.06);
            border-radius: 100px;
            animation: float var(--float-duration) ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            25% { transform: translateY(-20px) translateX(10px); }
            50% { transform: translateY(-10px) translateX(-5px); }
            75% { transform: translateY(-30px) translateX(5px); }
        }

        /* ========== 主容器 ========== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ========== 头部 ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .header-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 2.2rem;
            background: linear-gradient(135deg, #FF6B35 0%, #F7931E 50%, #FFE66D 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-subtitle {
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* ========== 统计卡片 ========== */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,255,255,0.2);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
        }

        .stat-card.total::before { background: linear-gradient(90deg, #667eea, #764ba2); }
        .stat-card.avg::before { background: linear-gradient(90deg, #4F46E5, #7C3AED); }
        .stat-card.max::before { background: linear-gradient(90deg, #10b981, #34d399); }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .stat-label {
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            font-family: 'Ma Shan Zheng', cursive;
        }

        .stat-card.total .stat-value { color: #a78bfa; }
        .stat-card.avg .stat-value { color: #818cf8; }
        .stat-card.max .stat-value { color: #34d399; }

        /* ========== 图表区域 ========== */
        .chart-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-box {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .chart-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-container {
            height: 300px;
        }

        /* 排行榜迷你列表 */
        .mini-rank {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .rank-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.03);
            transition: all 0.3s;
        }

        .rank-item:hover {
            background: rgba(255,255,255,0.08);
        }

        .rank-num {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .rank-num.gold { background: linear-gradient(135deg, #FFD700, #FFA500); color: #333; }
        .rank-num.silver { background: linear-gradient(135deg, #C0C0C0, #A0A0A0); color: #333; }
        .rank-num.bronze { background: linear-gradient(135deg, #CD7F32, #B87333); color: white; }
        .rank-num.other { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); }

        .rank-info {
            flex: 1;
        }

        .rank-name {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.9);
        }

        .rank-score {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent);
        }

        /* ========== 表格区域 ========== */
        .table-section {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 14px 12px;
            text-align: left;
            color: rgba(255,255,255,0.5);
            font-weight: 500;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.85);
        }

        tr:hover td {
            background: rgba(255,255,255,0.03);
        }

        .score-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .score-high { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .score-mid { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .score-low { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .source-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
        }

        .tag-cloud { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .tag-local { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }

        .detail-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: rgba(255,255,255,0.7);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
        }

        .detail-btn:hover {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.2);
            border: none;
            color: #f87171;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.4);
        }

        /* 详情展开行 */
        .detail-row {
            display: none;
            background: rgba(0,0,0,0.2);
        }

        .detail-content {
            padding: 20px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .detail-item {
            padding: 10px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            font-size: 0.8rem;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .detail-item.correct { border-color: rgba(16, 185, 129, 0.3); }
        .detail-item.wrong { border-color: rgba(239, 68, 68, 0.3); }

        .detail-q {
            color: rgba(255,255,255,0.6);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .detail-result {
            font-weight: bold;
        }

        .detail-result.correct { color: #34d399; }
        .detail-result.wrong { color: #f87171; }

        /* 按钮 */
        .btn {
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            border: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-refresh {
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            color: white;
        }

        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
        }

        .btn-export {
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            color: white;
            margin-left: 10px;
        }

        .btn-export:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }

        /* 配置面板 */
        .config-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 201;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .config-panel {
            position: fixed;
            top: 55px;
            right: 15px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 12px;
            z-index: 200;
            font-size: 12px;
            display: none;
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            width: 260px;
        }

        .config-panel input {
            width: 100%;
            padding: 8px 10px;
            margin: 6px 0 10px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            font-size: 12px;
            background: rgba(255,255,255,0.1);
            color: white;
            box-sizing: border-box;
        }

        .config-panel input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .sync-status {
            position: fixed;
            bottom: 15px;
            right: 15px;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 200;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .sync-status.online { color: #4ade80; }
        .sync-status.offline { color: #f87171; }
        .sync-status.syncing { color: #60a5fa; }

        .empty-state {
            text-align: center;
            color: rgba(255,255,255,0.4);
            padding: 60px 20px;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .stat-grid { grid-template-columns: 1fr; }
            .chart-section { grid-template-columns: 1fr; }
            .detail-grid { grid-template-columns: repeat(2, 1fr); }
            .header { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>
    <button class="config-toggle" onclick="toggleConfig()">⚙️ 配置</button>
    <div class="config-panel" id="configPanel">
        <div style="font-weight:bold;margin-bottom:10px;color:var(--accent);">Supabase 配置</div>
        <div style="color:rgba(255,255,255,0.7);">Project URL:</div>
        <input type="text" id="sbUrl" value="https://your-project.supabase.co" placeholder="https://your-project.supabase.co">
        <div style="color:rgba(255,255,255,0.7);">Anon Key:</div>
        <input type="text" id="sbKey" value="sb_secret_REPLACED" placeholder="your-anon-key">
        <button class="btn btn-refresh" style="width:100%;margin-top:5px;" onclick="saveConfig()">保存并连接</button>
        <div style="margin-top:10px;color:rgba(255,255,255,0.5);font-size:11px;">
            没有账号？<a href="https://supabase.com" target="_blank" style="color:var(--accent);">去 supabase.com 注册</a>
        </div>
    </div>

    <!-- 动态背景 -->
    <div class="starfield" id="starfield"></div>

    <div class="container">
        <div class="header">
            <div>
                <div class="header-title">🏰 小飞侠闯关数据看板</div>
                <div class="header-subtitle">实时追踪学生答题数据</div>
            </div>
            <div>
                <button class="btn btn-refresh" onclick="fetchData()">🔄 刷新数据</button>
                <button class="btn btn-export" onclick="exportExcel()">📊 导出成绩单</button>
            </div>
        </div>

        <div class="stat-grid">
            <div class="stat-card total">
                <div class="stat-icon">👥</div>
                <div class="stat-label">提交总人数</div>
                <div class="stat-value" id="stat-total">0</div>
            </div>
            <div class="stat-card avg">
                <div class="stat-icon">📈</div>
                <div class="stat-label">全班平均分</div>
                <div class="stat-value" id="stat-avg">0</div>
            </div>
            <div class="stat-card max">
                <div class="stat-icon">👑</div>
                <div class="stat-label">最高得分</div>
                <div class="stat-value" id="stat-max">0</div>
            </div>
        </div>

        <div class="chart-section">
            <div class="chart-box">
                <div class="chart-title">📊 题型正确率统计</div>
                <div class="chart-container" id="mainChart"></div>
            </div>
            <div class="mini-rank">
                <div class="chart-title">🏆 TOP 5 排行榜</div>
                <div id="miniRankList">
                    <div class="empty-state" style="padding:20px;">
                        <div class="empty-state-icon">🏅</div>
                        <div>暂无数据</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="table-section">
            <div class="section-header">
                <div class="section-title">📋 学生成绩排名</div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>排名</th>
                        <th>学号</th>
                        <th>总分</th>
                        <th>选择题</th>
                        <th>判断题</th>
                        <th>来源</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="listBody">
                    <tr><td colspan="7" class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <div>点击"刷新数据"获取最新记录</div>
                    </td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="sync-status offline" id="syncStatus">● 离线模式</div>

    <script>
        // ========== 动态背景 ==========
        function initBackground() {
            const starfield = document.getElementById('starfield');
            for(let i = 0; i < 60; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 70 + '%';
                star.style.width = star.style.height = (Math.random() * 3 + 1) + 'px';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.animationDelay = Math.random() * 5 + 's';
                starfield.appendChild(star);
            }
            for(let i = 0; i < 2; i++) {
                const shooting = document.createElement('div');
                shooting.className = 'shooting-star';
                shooting.style.top = Math.random() * 30 + '%';
                shooting.style.left = Math.random() * 50 + '%';
                shooting.style.animationDelay = (i * 8 + Math.random() * 5) + 's';
                starfield.appendChild(shooting);
            }
            for(let i = 0; i < 4; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                cloud.style.width = (Math.random() * 150 + 100) + 'px';
                cloud.style.height = (Math.random() * 40 + 30) + 'px';
                cloud.style.left = Math.random() * 100 + '%';
                cloud.style.top = (Math.random() * 40 + 10) + '%';
                cloud.style.setProperty('--float-duration', (Math.random() * 10 + 10) + 's');
                cloud.style.animationDelay = Math.random() * 5 + 's';
                starfield.appendChild(cloud);
            }
        }
        initBackground();

        // ========== Supabase ==========
        let supabase = null;
        let isOnline = false;

        function loadConfig() {
            const url = 'https://your-project.supabase.co';
            const key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.REPLACED_ANON_KEY';
            document.getElementById('sbUrl').value = url;
            document.getElementById('sbKey').value = key;
            initSupabase(url, key);
        }

        function saveConfig() {
            const url = document.getElementById('sbUrl').value.trim();
            const key = document.getElementById('sbKey').value.trim();
            if(!url || !key) { alert('请填写完整的 URL 和 Key'); return; }
            localStorage.setItem('sb_url', url);
            localStorage.setItem('sb_key', key);
            initSupabase(url, key);
            toggleConfig();
        }

        function toggleConfig() {
            const panel = document.getElementById('configPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        async function initSupabase(url, key) {
            try {
                supabase = window.supabase.createClient(url, key);
                const { error } = await supabase.from('quiz_results').select('count', { count: 'exact', head: true });
                if(error && error.code === '42P01') {
                    console.log('quiz_results 表不存在，尝试自动创建...');
                    const { error: rpcErr } = await supabase.rpc('create_quiz_table');
                    if(rpcErr) {
                        console.warn('自动建表失败(需要手动创建)，但连接正常:', rpcErr.message);
                        isOnline = true;
                        updateSyncStatus('online', '● 已连接云端(请先建表)');
                        fetchData();
                        return;
                    }
                } else if(error) {
                    console.warn('查询出错但连接正常:', error.message);
                    isOnline = true;
                    updateSyncStatus('online', '● 已连接云端');
                    fetchData();
                    return;
                }
                isOnline = true;
                updateSyncStatus('online', '● 已连接云端');
                fetchData();
            } catch(e) {
                console.error('Supabase连接错误:', e);
                isOnline = false;
                updateSyncStatus('offline', '● 连接失败: ' + (e.message || '未知错误'));
            }
        }

        function updateSyncStatus(type, text) {
            const el = document.getElementById('syncStatus');
            el.className = 'sync-status ' + type;
            el.innerText = text;
        }

        // ========== 数据管理 ==========
        window.allRecords = [];

        async function fetchData() {
            updateSyncStatus('syncing', '● 正在获取数据...');
            let records = [];

            if(isOnline && supabase) {
                try {
                    const { data, error } = await supabase
                        .from('quiz_results')
                        .select('*')
                        .order('created_at', { ascending: false });
                    if(error) throw error;
                    if(data) {
                        data.forEach(r => {
                            records.push({
                                docId: 'cloud_' + r.id,
                                source: 'cloud',
                                data: {
                                    no: r.student_no,
                                    totalScore: r.total_score,
                                    answers: r.answers || [],
                                    createdAt: r.created_at
                                },
                                createdAt: r.created_at
                            });
                        });
                    }
                } catch(e) { console.error('云端获取失败:', e); }
            }

            const localRecords = JSON.parse(localStorage.getItem('quiz_records') || '[]');
            localRecords.forEach((r, idx) => {
                records.push({
                    docId: 'local_' + idx,
                    source: 'local',
                    data: r,
                    createdAt: r.created_at
                });
            });

            const seen = new Map();
            records.forEach(r => {
                const no = r.data.no;
                if(!seen.has(no) || new Date(r.createdAt) > new Date(seen.get(no).createdAt)) {
                    seen.set(no, r);
                }
            });
            window.allRecords = Array.from(seen.values());

            updateSyncStatus(isOnline ? 'online' : 'offline', isOnline ? '● 已连接云端' : '● 本地模式');
            renderData();
        }

        function renderData() {
            const data = window.allRecords.map(r => r.data);
            if(data.length === 0) {
                document.getElementById('listBody').innerHTML = '<tr><td colspan="7" class="empty-state"><div class="empty-state-icon">📭</div><div>暂无数据</div></td></tr>';
                document.getElementById('miniRankList').innerHTML = '<div class="empty-state" style="padding:20px;"><div class="empty-state-icon">🏅</div><div>暂无数据</div></div>';
                document.getElementById('stat-total').innerText = '0';
                document.getElementById('stat-avg').innerText = '0';
                document.getElementById('stat-max').innerText = '0';
                const chartDom = document.getElementById('mainChart');
                if(chartDom) { const chart = echarts.init(chartDom); chart.clear(); }
                return;
            }

            const scores = data.map(d => d.totalScore || 0);
            document.getElementById('stat-total').innerText = data.length;
            document.getElementById('stat-avg').innerText = (scores.reduce((a,b)=>a+b,0) / data.length).toFixed(1);
            document.getElementById('stat-max').innerText = Math.max(...scores);

            const sorted = window.allRecords.slice().sort((a,b) => b.data.totalScore - a.data.totalScore);

            // 主表格
            document.getElementById('listBody').innerHTML = sorted.map((r, i) => {
                const d = r.data;
                const cScore = d.answers.filter(a => a.type === '选择').reduce((s, a) => s + a.score, 0);
                const jScore = d.answers.filter(a => a.type === '判断').reduce((s, a) => s + a.score, 0);
                const scoreClass = d.totalScore >= 40 ? 'score-high' : d.totalScore >= 25 ? 'score-mid' : 'score-low';
                const sourceTag = r.source === 'cloud'
                    ? '<span class="source-tag tag-cloud">☁️ 云端</span>'
                    : '<span class="source-tag tag-local">💾 本地</span>';
                return `
                    <tr>
                        <td><strong>#${i+1}</strong></td>
                        <td>${d.no}</td>
                        <td><span class="score-badge ${scoreClass}">${d.totalScore}</span></td>
                        <td>${cScore}</td>
                        <td>${jScore}</td>
                        <td>${sourceTag}</td>
                        <td>
                            <button class="detail-btn" onclick="toggleDetail('${r.docId}')">🔍 详情</button>
                            <button class="delete-btn" onclick="deleteRecord('${r.docId}')">🗑️ 删除</button>
                        </td>
                    </tr>
                    <tr id="detail-${r.docId}" class="detail-row">
                        <td colspan="7">
                            <div class="detail-content">
                                <div class="detail-grid">
                                    ${d.answers.map((a, idx) => `
                                        <div class="detail-item ${a.isCorrect ? 'correct' : 'wrong'}">
                                            <div class="detail-q">${idx+1}. ${a.q.substring(0,20)}...</div>
                                            <div class="detail-result ${a.isCorrect ? 'correct' : 'wrong'}">
                                                ${a.isCorrect ? '✅' : '❌'} ${a.type} · ${a.score}分
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            // 迷你排行榜
            const top5 = sorted.slice(0, 5);
            document.getElementById('miniRankList').innerHTML = top5.map((r, i) => {
                const d = r.data;
                const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : 'other';
                const medals = ['🥇', '🥈', '🥉', '4', '5'];
                return `
                    <div class="rank-item">
                        <div class="rank-num ${rankClass}">${medals[i]}</div>
                        <div class="rank-info">
                            <div class="rank-name">学号 ${d.no}</div>
                        </div>
                        <div class="rank-score">${d.totalScore}分</div>
                    </div>
                `;
            }).join('');

            renderChart(data);
        }

        function renderChart(data) {
            const chartDom = document.getElementById('mainChart');
            if(!chartDom) return;
            const chart = echarts.init(chartDom);
            let cTotal = 0, cCorrect = 0, jTotal = 0, jCorrect = 0;
            data.forEach(d => {
                d.answers.forEach(a => {
                    if(a.type === '选择') { cTotal++; if(a.isCorrect) cCorrect++; }
                    else { jTotal++; if(a.isCorrect) jCorrect++; }
                });
            });

            chart.setOption({
                backgroundColor: 'transparent',
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                xAxis: {
                    type: 'category',
                    data: ['选择题', '判断题'],
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.3)' } },
                    axisLabel: { color: 'rgba(255,255,255,0.7)' }
                },
                yAxis: {
                    type: 'value',
                    max: 100,
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.3)' } },
                    axisLabel: { color: 'rgba(255,255,255,0.7)', formatter: '{value}%' },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } }
                },
                series: [{
                    type: 'bar',
                    barWidth: '40%',
                    data: [
                        { value: cTotal ? (cCorrect/cTotal*100).toFixed(1) : 0, itemStyle: {color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{offset: 0, color: '#667eea'}, {offset: 1, color: '#764ba2'}])} },
                        { value: jTotal ? (jCorrect/jTotal*100).toFixed(1) : 0, itemStyle: {color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{offset: 0, color: '#f093fb'}, {offset: 1, color: '#f5576c'}])} }
                    ],
                    label: { show: true, position: 'top', color: 'rgba(255,255,255,0.8)', formatter: '{c}%' },
                    itemStyle: { borderRadius: [8, 8, 0, 0] }
                }]
            });
        }

        function toggleDetail(id) {
            const el = document.getElementById('detail-' + id);
            if(el) el.style.display = el.style.display === 'table-row' ? 'none' : 'table-row';
        }

        async function deleteRecord(id) {
            if(!confirm('确定删除吗？')) return;
            const record = window.allRecords.find(r => r.docId === id);
            if(!record) return;

            if(record.source === 'cloud' && isOnline && supabase) {
                try {
                    const realId = id.replace('cloud_', '');
                    const { error } = await supabase.from('quiz_results').delete().eq('id', realId);
                    if(error) throw error;
                } catch(e) { console.error('云端删除失败:', e); }
            }

            if(record.source === 'local') {
                const localRecords = JSON.parse(localStorage.getItem('quiz_records') || '[]');
                const idx = localRecords.findIndex(r => r.no === record.data.no && r.created_at === record.data.createdAt);
                if(idx > -1) {
                    localRecords.splice(idx, 1);
                    localStorage.setItem('quiz_records', JSON.stringify(localRecords));
                }
            }

            localStorage.removeItem('played_' + record.data.no);
            fetchData();
        }

        function exportExcel() {
            const exportData = window.allRecords.map(r => {
                const d = r.data;
                const row = {
                    '学号': d.no,
                    '总分': d.totalScore,
                    '选择得分': d.answers.filter(a => a.type === '选择').reduce((s, a) => s + a.score, 0),
                    '判断得分': d.answers.filter(a => a.type === '判断').reduce((s, a) => s + a.score, 0),
                    '数据来源': r.source === 'cloud' ? '云端' : '本地',
                    '提交时间': new Date(r.createdAt).toLocaleString()
                };
                d.answers.forEach((a, idx) => {
                    row[`第${idx + 1}题(${a.type})`] = a.isCorrect ? '√' : '×';
                });
                return row;
            });
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "成绩详情表");
            XLSX.writeFile(wb, "小飞侠闯关成绩汇总.xlsx");
        }

        loadConfig();

        window.addEventListener('resize', () => {
            const chartDom = document.getElementById('mainChart');
            if(chartDom) { const chart = echarts.getInstanceByDom(chartDom); if(chart) chart.resize(); }
        });
    </script>
</body>
</html>
