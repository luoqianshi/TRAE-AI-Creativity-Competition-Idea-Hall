<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>亲情相册 - 一键视频通话</title>
<style>
/* ===== Reset & Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFF8F0;
  --card-bg:#FFFFFF;
  --text:#2D2D2D;
  --text-secondary:#777;
  --accent:#FF6B6B;
  --accent-hover:#E55A5A;
  --green:#4CAF50;
  --green-hover:#43A047;
  --blue:#5B8DEF;
  --shadow:0 4px 20px rgba(0,0,0,0.06);
  --shadow-lg:0 8px 40px rgba(0,0,0,0.10);
  --radius:24px;
  --radius-sm:16px;
  --transition:0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}
#app{
  width:100%;height:100%;
  max-width:480px;margin:0 auto;
  position:relative;overflow:hidden;
  background:var(--bg);
}

/* ===== Views ===== */
.view{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  opacity:0;transform:translateX(40px);
  pointer-events:none;
  transition:opacity 0.35s ease,transform 0.35s ease;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}
.view.slide-back{transform:translateX(-40px)}
.view.active{opacity:1;transform:translateX(0);pointer-events:auto}

/* ===== Home View ===== */
.home-header{
  padding:24px 24px 12px;
  display:flex;align-items:center;justify-content:space-between;
}
.home-header .logo{display:flex;align-items:center;gap:10px}
.home-header .logo-icon{
  width:44px;height:44px;border-radius:14px;
  background:linear-gradient(135deg, var(--accent), #FF8E8E);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;
}
.home-header .logo h1{font-size:28px;font-weight:700;color:var(--text);letter-spacing:1px}
.home-header .mode-toggle{
  font-size:15px;color:var(--blue);
  background:rgba(91,141,239,0.08);border:none;
  padding:10px 18px;border-radius:20px;
  cursor:pointer;font-weight:600;transition:var(--transition);
}
.home-header .mode-toggle:active{background:rgba(91,141,239,0.18);transform:scale(0.95)}

.contact-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:18px;padding:8px 24px 24px;
  flex:1;align-content:center;
}
.contact-card{
  background:var(--card-bg);border-radius:var(--radius);
  padding:0 0 16px 0;
  display:flex;flex-direction:column;align-items:center;
  box-shadow:var(--shadow);cursor:pointer;
  transition:var(--transition);position:relative;overflow:hidden;
}
.contact-card:active{transform:scale(0.96);box-shadow:var(--shadow-lg)}
.contact-card .avatar{
  width:100%;aspect-ratio:3/2;
  border-radius:var(--radius) var(--radius) 0 0;
  position:relative;z-index:1;
  overflow:hidden;border:none;
}
.contact-card .avatar img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.contact-card .avatar-ring{
  position:absolute;inset:0;
  border-radius:var(--radius) var(--radius) 0 0;
  border:3px solid transparent;transition:var(--transition);
  pointer-events:none;
}
.contact-card:active .avatar-ring{border-color:var(--accent)}
.contact-card .info{text-align:center;z-index:1;padding:14px 14px 0}
.contact-card .name{font-size:26px;font-weight:700;color:var(--text);margin-bottom:4px}
.contact-card .relation{
  font-size:17px;color:var(--text-secondary);
  background:#F5F5F5;padding:4px 14px;border-radius:12px;display:inline-block;
}
.contact-card .photo-badge{
  position:absolute;top:14px;right:14px;
  width:34px;height:34px;border-radius:50%;
  background:rgba(255,107,107,0.12);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;z-index:2;transition:var(--transition);
}
.contact-card .photo-badge:active{background:rgba(255,107,107,0.25);transform:scale(1.2)}
.contact-card .photo-count{
  position:absolute;top:-2px;right:-2px;
  width:18px;height:18px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}

.home-footer{text-align:center;padding:12px 24px 28px}
.home-footer p{font-size:16px;color:#B0B0B0;letter-spacing:0.5px}

/* ===== Video Call View ===== */
.video-view{background:#0a0a1a}
.video-container{
  flex:1;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
/* Video background - shows contact's photo */
.video-bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  filter:brightness(0.5);
  transition:filter 1s ease;
}
.video-bg.connected{filter:brightness(0.75)}
/* Subtle shimmer to simulate live video */
.video-bg::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(105deg,
    transparent 40%,rgba(255,255,255,0.06) 45%,
    rgba(255,255,255,0.10) 50%,rgba(255,255,255,0.06) 55%,
    transparent 60%);
  background-size:200% 100%;
  animation:shimmer 3s ease-in-out infinite;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Calling animation overlay */
.remote-video{
  position:absolute;inset:0;z-index:2;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:24px;
}
.remote-video .call-avatar{
  width:100%;height:100%;
  position:absolute;inset:0;
  overflow:hidden;border:none;
  box-shadow:none;
}
.remote-video .call-avatar img{
  width:100%;height:100%;object-fit:cover;display:block;
}
/* Pulsing ring during calling */
.call-ring{
  position:absolute;inset:-12px;border-radius:16px;
  border:2px solid rgba(255,255,255,0.4);
  animation:ringPulse 1.5s ease-out infinite;
}
.call-ring:nth-child(2){animation-delay:0.5s}
.call-ring:nth-child(3){animation-delay:1s}
@keyframes ringPulse{
  0%{transform:scale(1);opacity:0.6}
  100%{transform:scale(1.5);opacity:0}
}
.call-ring.stop{animation-play-state:paused;opacity:0}

.remote-video .call-status{
  color:#fff;font-size:26px;font-weight:600;letter-spacing:1px;
  text-shadow:0 2px 8px rgba(0,0,0,0.3);
}
.remote-video .call-timer{
  color:rgba(255,255,255,0.85);font-size:22px;font-weight:500;
  font-variant-numeric:tabular-nums;
  text-shadow:0 2px 8px rgba(0,0,0,0.3);
}
.remote-video .call-name{
  color:rgba(255,255,255,0.9);font-size:22px;font-weight:500;
  position:absolute;top:24px;left:24px;
  text-shadow:0 2px 8px rgba(0,0,0,0.3);
}
.remote-video .live-badge{
  position:absolute;top:24px;right:24px;
  background:var(--accent);color:#fff;
  padding:4px 12px;border-radius:12px;
  font-size:14px;font-weight:700;
  display:flex;align-items:center;gap:6px;
  animation:livePulse 1.5s ease-in-out infinite;
}
.remote-video .live-badge .dot{
  width:8px;height:8px;border-radius:50%;background:#fff;
}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:0.7}}
.self-video{
  position:absolute;bottom:140px;right:20px;
  width:100px;height:140px;border-radius:16px;
  overflow:hidden;border:2px solid rgba(255,255,255,0.25);
  box-shadow:0 4px 20px rgba(0,0,0,0.4);z-index:3;
}
.self-video img{width:100%;height:100%;object-fit:cover;display:block}
.video-controls{
  display:flex;align-items:center;justify-content:center;gap:28px;
  padding:20px 24px 36px;position:relative;z-index:3;
  background:linear-gradient(to top,rgba(0,0,0,0.7),transparent);
}
.video-btn{
  width:68px;height:68px;border-radius:50%;border:none;
  font-size:28px;cursor:pointer;transition:var(--transition);
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.15);color:#fff;
}
.video-btn:active{transform:scale(0.9)}
.video-btn.hangup{
  width:84px;height:84px;background:var(--accent);
  font-size:36px;
  box-shadow:0 4px 20px rgba(255,107,107,0.4);
  animation:hangupPulse 2s ease-in-out infinite;
}
@keyframes hangupPulse{
  0%,100%{box-shadow:0 4px 20px rgba(255,107,107,0.4)}
  50%{box-shadow:0 4px 35px rgba(255,107,107,0.7)}
}
.video-btn.muted{background:rgba(255,255,255,0.3)}

/* ===== Detail View (Photo Gallery) ===== */
.detail-header{
  padding:20px 24px 12px;display:flex;align-items:center;gap:14px;
}
.detail-back{
  width:44px;height:44px;border-radius:50%;border:none;
  background:var(--card-bg);box-shadow:var(--shadow);
  font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:var(--transition);
}
.detail-back:active{transform:scale(0.9);background:#f0f0f0}
.detail-header .detail-title{font-size:24px;font-weight:700}
.detail-header .detail-subtitle{font-size:15px;color:var(--text-secondary)}
.photo-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:14px;padding:12px 24px 24px;
}
.photo-card{
  background:var(--card-bg);border-radius:var(--radius-sm);
  overflow:hidden;box-shadow:var(--shadow);cursor:pointer;
  transition:var(--transition);
}
.photo-card:active{transform:scale(0.96)}
.photo-card .photo-img{
  width:100%;aspect-ratio:4/3;
  overflow:hidden;position:relative;
}
.photo-card .photo-img img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.photo-card .photo-img::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,0.3),transparent);
  opacity:0;transition:opacity 0.3s;
}
.photo-card:active .photo-img::after{opacity:1}
.photo-card .photo-info{padding:12px 14px}
.photo-card .photo-title{font-size:18px;font-weight:600;margin-bottom:2px}
.photo-card .photo-date{font-size:14px;color:var(--text-secondary)}

/* ===== Family Mode ===== */
.family-view{background:#F8FAFC}
.family-header{
  padding:24px 24px 16px;display:flex;align-items:center;justify-content:space-between;
}
.family-header h2{font-size:26px;font-weight:700}
.family-header .mode-toggle{
  font-size:15px;color:var(--blue);
  background:rgba(91,141,239,0.08);border:none;
  padding:10px 18px;border-radius:20px;
  cursor:pointer;font-weight:600;
}
.family-header .mode-toggle:active{background:rgba(91,141,239,0.18);transform:scale(0.95)}
.family-list{padding:0 24px 24px;display:flex;flex-direction:column;gap:14px}
.family-contact-item{
  background:var(--card-bg);border-radius:var(--radius);
  padding:18px 20px;display:flex;align-items:center;gap:16px;
  box-shadow:var(--shadow);transition:var(--transition);
}
.family-contact-item .f-avatar{
  width:56px;height:56px;border-radius:50%;
  overflow:hidden;flex-shrink:0;
}
.family-contact-item .f-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.family-contact-item .f-info{flex:1;min-width:0}
.family-contact-item .f-name{font-size:22px;font-weight:700;margin-bottom:4px}
.family-contact-item .f-meta{font-size:14px;color:var(--text-secondary)}
.family-contact-item .f-actions{display:flex;flex-direction:column;gap:8px}
.family-contact-item .f-btn{
  padding:10px 18px;border-radius:20px;border:none;
  font-size:15px;font-weight:600;cursor:pointer;
  transition:var(--transition);white-space:nowrap;
}
.family-contact-item .f-btn.upload{background:var(--green);color:#fff}
.family-contact-item .f-btn.upload:active{background:var(--green-hover);transform:scale(0.95)}
.family-contact-item .f-btn.photos{background:rgba(91,141,239,0.1);color:var(--blue)}
.family-contact-item .f-btn.photos:active{background:rgba(91,141,239,0.2);transform:scale(0.95)}
.family-tip{
  margin:0 24px 24px;padding:16px 20px;
  background:rgba(255,183,77,0.1);border-radius:var(--radius-sm);
  font-size:15px;color:#B8860B;line-height:1.6;
}

/* ===== Toast ===== */
.toast{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0.8);
  background:rgba(0,0,0,0.78);color:#fff;
  padding:14px 28px;border-radius:12px;
  font-size:18px;font-weight:600;z-index:999;
  pointer-events:none;opacity:0;
  transition:opacity 0.25s,transform 0.25s;
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ===== Ripple ===== */
.ripple{
  position:absolute;border-radius:50%;
  background:rgba(255,107,107,0.3);
  transform:scale(0);animation:rippleAnim 0.6s ease-out;
  pointer-events:none;
}
@keyframes rippleAnim{to{transform:scale(4);opacity:0}}

/* ===== Upload Modal ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);
  z-index:100;display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 0.3s;
}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-sheet{
  background:#fff;width:100%;max-width:480px;
  border-radius:24px 24px 0 0;padding:24px;
  transform:translateY(100%);
  transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);
}
.modal-overlay.show .modal-sheet{transform:translateY(0)}
.modal-sheet h3{font-size:22px;font-weight:700;margin-bottom:6px}
.modal-sheet .modal-sub{font-size:15px;color:var(--text-secondary);margin-bottom:20px}
.modal-images{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;margin-bottom:20px;
}
.modal-images .mock-img{
  aspect-ratio:1;border-radius:12px;overflow:hidden;
  cursor:pointer;transition:var(--transition);
  border:3px solid transparent;position:relative;
}
.modal-images .mock-img:active{transform:scale(0.93)}
.modal-images .mock-img.selected{border-color:var(--accent)}
.modal-images .mock-img img{width:100%;height:100%;object-fit:cover;display:block}
.modal-images .mock-img .check{
  position:absolute;top:6px;right:6px;
  width:24px;height:24px;border-radius:50%;
  background:var(--accent);color:#fff;
  display:none;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;
}
.modal-images .mock-img.selected .check{display:flex}
.modal-btn{
  width:100%;padding:16px;border-radius:16px;border:none;
  font-size:20px;font-weight:700;cursor:pointer;
  transition:var(--transition);color:#fff;background:var(--green);
}
.modal-btn:active{transform:scale(0.97);background:var(--green-hover)}

/* ===== Contact Picker ===== */
.picker-list{display:flex;flex-direction:column;gap:10px}
.picker-item{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;border-radius:var(--radius-sm);
  background:#F8F9FA;cursor:pointer;
  transition:var(--transition);border:2px solid transparent;
}
.picker-item:active{transform:scale(0.98);background:#EEF0F2}
.picker-item .pi-avatar{
  width:48px;height:48px;border-radius:12px;
  overflow:hidden;flex-shrink:0;
}
.picker-item .pi-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.picker-item .pi-name{font-size:20px;font-weight:700;flex:1}
.picker-item .pi-arrow{font-size:18px;color:var(--text-secondary)}

/* ===== Fullscreen Photo Viewer ===== */
.photo-viewer{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,0.95);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity 0.3s;
}
.photo-viewer.show{opacity:1;pointer-events:auto}
.photo-viewer img{
  max-width:100%;max-height:100%;
  object-fit:contain;
  transform:scale(0.9);
  transition:transform 0.3s;
}
.photo-viewer.show img{transform:scale(1)}
.photo-viewer .viewer-close{
  position:absolute;top:16px;right:16px;
  width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,0.2);border:none;
  color:#fff;font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  z-index:10;transition:var(--transition);
}
.photo-viewer .viewer-close:active{transform:scale(0.9);background:rgba(255,255,255,0.35)}
.photo-viewer .viewer-info{
  position:absolute;bottom:24px;left:24px;right:80px;
  color:#fff;z-index:10;
}
.photo-viewer .viewer-info .v-title{font-size:22px;font-weight:700}
.photo-viewer .viewer-info .v-date{font-size:14px;opacity:0.7;margin-top:4px}

/* ===== Scrollbar ===== */
.view::-webkit-scrollbar{width:0}

/* ===== Responsive ===== */
@media(min-width:480px){
  #app{border-left:1px solid #eee;border-right:1px solid #eee}
}
</style>
</head>
<body>
<div id="app">
  <!-- ==================== Home View (老年端) ==================== -->
  <div class="view active" id="homeView">
    <div class="home-header">
      <div class="logo">
        <div class="logo-icon">📞</div>
        <h1>亲情相册</h1>
      </div>
      <div style="display:flex;gap:8px">
        <button class="mode-toggle" onclick="openElderlyUpload()" style="background:rgba(76,175,80,0.1);color:var(--green)">📤 分享照片</button>
        <button class="mode-toggle" onclick="switchToFamily()">👨‍👩‍👧 子女管理</button>
      </div>
    </div>
    <div class="contact-grid" id="contactGrid"></div>
    <div class="home-footer">
      <p>💡 点击头像即可一键视频通话</p>
    </div>
  </div>

  <!-- ==================== Video Call View ==================== -->
  <div class="view video-view" id="videoView">
    <div class="video-container">
      <div class="video-bg" id="videoBg"></div>
      <div class="remote-video" id="remoteVideo">
        <div class="call-name" id="callName"></div>
        <div class="live-badge" id="liveBadge" style="display:none"><span class="dot"></span> LIVE</div>
        <div class="call-avatar" id="callAvatar">
          <img id="callAvatarImg" src="" alt="">
          <div class="call-ring"></div>
          <div class="call-ring"></div>
          <div class="call-ring"></div>
        </div>
        <div class="call-status" id="callStatus">正在呼叫...</div>
        <div class="call-timer" id="callTimer" style="display:none">00:00</div>
      </div>
      <div class="self-video" id="selfVideo">
        <img id="selfVideoImg" src="" alt="">
      </div>
    </div>
    <div class="video-controls">
      <button class="video-btn" id="muteBtn" onclick="toggleMute()">🎤</button>
      <button class="video-btn hangup" onclick="hangUp()">📞</button>
      <button class="video-btn" id="speakerBtn" onclick="toggleSpeaker()">🔊</button>
    </div>
  </div>

  <!-- ==================== Detail View (照片墙) ==================== -->
  <div class="view" id="detailView">
    <div class="detail-header">
      <button class="detail-back" onclick="goBack()">←</button>
      <div style="flex:1;min-width:0">
        <div class="detail-title" id="detailName"></div>
        <div class="detail-subtitle" id="detailRelation"></div>
      </div>
      <button class="mode-toggle" id="detailUploadBtn" onclick="openUploadModal(currentDetailId)" style="font-size:15px;white-space:nowrap">📤 上传照片</button>
    </div>
    <div class="photo-grid" id="photoGrid"></div>
  </div>

  <!-- ==================== Family Mode View (子女端) ==================== -->
  <div class="view family-view" id="familyView">
    <div class="family-header">
      <h2>👨‍👩‍👧 子女管理</h2>
      <button class="mode-toggle" onclick="switchToHome()">👴 老年模式</button>
    </div>
    <div class="family-tip">
      💡 在这里上传生活照片，爸妈那边的「亲情相册」会自动更新哦~
    </div>
    <div class="family-list" id="familyList"></div>
  </div>

  <!-- ==================== Upload Modal ==================== -->
  <div class="modal-overlay" id="uploadModal" onclick="closeUploadModal(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <h3>📸 上传照片</h3>
      <p class="modal-sub">选择要分享给爸妈的照片（演示数据）</p>
      <div class="modal-images" id="modalImages"></div>
      <button class="modal-btn" onclick="confirmUpload()">✅ 确认上传（共 <span id="selectedCount">0</span> 张）</button>
    </div>
  </div>
</div>

<!-- Contact Picker Modal (for elderly upload) -->
<div class="modal-overlay" id="contactPicker" onclick="closeContactPicker(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()" style="padding-bottom:36px">
    <h3>📤 选择要分享给谁</h3>
    <p class="modal-sub">选一个联系人，上传照片分享给他们</p>
    <div class="picker-list" id="pickerList"></div>
  </div>
</div>

<!-- Photo Viewer -->
<div class="photo-viewer" id="photoViewer" onclick="closePhotoViewer()">
  <button class="viewer-close" onclick="closePhotoViewer()">✕</button>
  <img id="viewerImg" src="" alt="">
  <div class="viewer-info">
    <div class="v-title" id="viewerTitle"></div>
    <div class="v-date" id="viewerDate"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============================
// DATA
// ============================
// Use picsum.photos for realistic placeholder images
// Each seed produces a consistent image for the same seed value
const imgBase = 'https://picsum.photos/seed';

const contacts = [
  {
    id: 'son1',
    name: '大儿子',
    relation: '儿子',
    avatar: `${imgBase}/family1/200/200`,
    photos: [
      { title: '周末郊游', date: '昨天', img: `${imgBase}/outdoor1/400/300` },
      { title: '小孙子生日', date: '3天前', img: `${imgBase}/birthday1/400/300` },
      { title: '全家福合影', date: '上周', img: `${imgBase}/family2/400/300` },
      { title: '新家装修', date: '2周前', img: `${imgBase}/home1/400/300` },
    ]
  },
  {
    id: 'daughter',
    name: '女儿',
    relation: '女儿',
    avatar: `${imgBase}/portrait2/200/200`,
    photos: [
      { title: '旅游纪念', date: '昨天', img: `${imgBase}/travel1/400/300` },
      { title: '做了一桌好菜', date: '5天前', img: `${imgBase}/food1/400/300` },
      { title: '外孙女跳舞', date: '上周', img: `${imgBase}/dance1/400/300` },
    ]
  },
  {
    id: 'son2',
    name: '小儿子',
    relation: '小儿子',
    avatar: `${imgBase}/portrait3/200/200`,
    photos: [
      { title: '公司团建', date: '2天前', img: `${imgBase}/mountain1/400/300` },
      { title: '新买的汽车', date: '1周前', img: `${imgBase}/car1/400/300` },
      { title: '年夜饭', date: '2周前', img: `${imgBase}/dinner1/400/300` },
    ]
  },
  {
    id: 'wife',
    name: '老伴',
    relation: '老伴',
    avatar: `${imgBase}/portrait4/200/200`,
    photos: [
      { title: '一起去公园', date: '昨天', img: `${imgBase}/park1/400/300` },
      { title: '结婚纪念日', date: '1周前', img: `${imgBase}/couple1/400/300` },
    ]
  }
];

// User's own photo (elderly person)
const userPhoto = `${imgBase}/elderly/200/280`;

// ============================
// STATE
// ============================
let currentView = 'home';
let currentCall = null;
let callTimerInterval = null;
let callSeconds = 0;
let isMuted = false;
let isSpeakerOn = true;
let uploadTargetId = null;
let currentDetailId = null;
let selectedPhotos = new Set();

// ============================
// RENDER
// ============================
function renderHome() {
  const grid = document.getElementById('contactGrid');
  grid.innerHTML = contacts.map(c => `
    <div class="contact-card" onclick="startCall('${c.id}')" id="card-${c.id}">
      <div class="photo-badge" onclick="event.stopPropagation();showDetail('${c.id}')">
        📷
        <span class="photo-count">${c.photos.length}</span>
      </div>
      <div class="avatar" style="position:relative">
        <div class="avatar-ring"></div>
        <img src="${c.avatar}" alt="${c.name}" loading="lazy"
             onerror="this.style.display='none';this.parentElement.style.background='#e0e0e0';this.parentElement.innerHTML+='<span style=font-size:44px>${c.emoji||'👤'}</span>'">
      </div>
      <div class="info">
        <div class="name">${c.name}</div>
        <span class="relation">${c.relation}</span>
      </div>
    </div>
  `).join('');
}

function renderDetail(contactId) {
  const contact = contacts.find(c => c.id === contactId);
  if (!contact) return;
  currentDetailId = contactId;
  document.getElementById('detailName').textContent = contact.name;
  document.getElementById('detailRelation').textContent = contact.relation;

  // Update upload button onclick
  const uploadBtn = document.getElementById('detailUploadBtn');
  uploadBtn.setAttribute('onclick', `openUploadModal('${contactId}')`);

  const grid = document.getElementById('photoGrid');
  grid.innerHTML = contact.photos.map(p => `
    <div class="photo-card" onclick="openPhotoViewer('${p.img}','${p.title}','${p.date}')">
      <div class="photo-img">
        <img src="${p.img}" alt="${p.title}" loading="lazy"
             onerror="this.style.display='none';this.parentElement.style.background='#f0f0f0'">
      </div>
      <div class="photo-info">
        <div class="photo-title">${p.title}</div>
        <div class="photo-date">${p.date}</div>
      </div>
    </div>
  `).join('');
}

function renderFamily() {
  const list = document.getElementById('familyList');
  list.innerHTML = contacts.map(c => `
    <div class="family-contact-item">
      <div class="f-avatar">
        <img src="${c.avatar}" alt="${c.name}" loading="lazy"
             onerror="this.style.display='none';this.parentElement.style.background='#e0e0e0'">
      </div>
      <div class="f-info">
        <div class="f-name">${c.name}</div>
        <div class="f-meta">📸 ${c.photos.length} 张照片 · 最近更新：${c.photos[0].date}</div>
      </div>
      <div class="f-actions">
        <button class="f-btn upload" onclick="openUploadModal('${c.id}')">📤 上传</button>
        <button class="f-btn photos" onclick="showDetail('${c.id}')">🖼️ 查看</button>
      </div>
    </div>
  `).join('');
}

// ============================
// NAVIGATION
// ============================
function switchView(viewId, slideBack = false) {
  document.querySelectorAll('.view').forEach(v => {
    v.classList.remove('active', 'slide-back');
  });
  const target = document.getElementById(viewId);
  if (slideBack) target.classList.add('slide-back');
  void target.offsetWidth;
  target.classList.add('active');
  target.scrollTop = 0;
  currentView = viewId;
}

function showDetail(contactId) {
  renderDetail(contactId);
  switchView('detailView');
  speak('查看' + (contacts.find(c => c.id === contactId)?.name || '') + '的照片');
}

function goBack() {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active', 'slide-back'));
  const homeView = document.getElementById('homeView');
  homeView.classList.add('slide-back');
  void homeView.offsetWidth;
  homeView.classList.add('active');
  currentView = 'home';
}

function switchToFamily() {
  renderFamily();
  switchView('familyView');
}

function switchToHome() {
  renderHome();
  const homeView = document.getElementById('homeView');
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active', 'slide-back'));
  homeView.classList.add('slide-back');
  void homeView.offsetWidth;
  homeView.classList.add('active');
  currentView = 'home';
}

// ============================
// VIDEO CALL
// ============================
function startCall(contactId) {
  const contact = contacts.find(c => c.id === contactId);
  if (!contact) return;
  currentCall = contact;

  // Set video background
  const videoBg = document.getElementById('videoBg');
  videoBg.style.backgroundImage = `url(${contact.avatar})`;
  videoBg.classList.remove('connected');

  // Set avatar
  document.getElementById('callAvatarImg').src = contact.avatar;
  document.getElementById('callName').textContent = contact.name;

  // Reset rings
  document.querySelectorAll('.call-ring').forEach(r => r.classList.remove('stop'));

  // Set self video
  document.getElementById('selfVideoImg').src = userPhoto;

  // Reset status
  document.getElementById('liveBadge').style.display = 'none';
  document.getElementById('callStatus').textContent = '正在呼叫...';
  document.getElementById('callStatus').style.display = '';
  document.getElementById('callTimer').style.display = 'none';
  document.getElementById('callAvatar').style.display = '';

  switchView('videoView');
  speak('正在拨打' + contact.name + '的视频电话');

  // Simulate connection after 2.5 seconds
  setTimeout(() => {
    if (currentCall && currentCall.id === contactId) {
      document.getElementById('callStatus').textContent = '已接通';
      document.getElementById('callTimer').style.display = '';
      document.getElementById('liveBadge').style.display = 'flex';
      document.getElementById('callAvatar').style.display = 'none';
      document.querySelectorAll('.call-ring').forEach(r => r.classList.add('stop'));
      videoBg.classList.add('connected');
      callSeconds = 0;
      updateTimer();
      callTimerInterval = setInterval(() => {
        callSeconds++;
        updateTimer();
      }, 1000);
      speak('已接通' + contact.name + '的视频电话');
    }
  }, 2500);
}

function updateTimer() {
  const mins = Math.floor(callSeconds / 60);
  const secs = callSeconds % 60;
  document.getElementById('callTimer').textContent =
    String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
}

function hangUp() {
  if (callTimerInterval) {
    clearInterval(callTimerInterval);
    callTimerInterval = null;
  }
  const duration = callSeconds;
  const name = currentCall?.name || '';
  currentCall = null;
  callSeconds = 0;
  goBack();
  if (duration > 0) {
    const mins = Math.floor(duration / 60);
    const secs = duration % 60;
    const durStr = mins > 0 ? `${mins}分${secs}秒` : `${secs}秒`;
    showToast(`已挂断 · 通话时长 ${durStr}`);
    speak('通话结束，共' + durStr);
  } else {
    showToast('已取消通话');
    speak('已取消通话');
  }
}

function toggleMute() {
  isMuted = !isMuted;
  const btn = document.getElementById('muteBtn');
  btn.textContent = isMuted ? '🔇' : '🎤';
  if (isMuted) btn.classList.add('muted');
  else btn.classList.remove('muted');
  showToast(isMuted ? '已静音' : '已取消静音');
}

function toggleSpeaker() {
  isSpeakerOn = !isSpeakerOn;
  const btn = document.getElementById('speakerBtn');
  btn.textContent = isSpeakerOn ? '🔊' : '🔈';
  if (!isSpeakerOn) btn.classList.add('muted');
  else btn.classList.remove('muted');
  showToast(isSpeakerOn ? '扬声器已开启' : '扬声器已关闭');
}

// ============================
// UPLOAD (Demo)
// ============================
const demoPhotos = [
  { title: '夕阳', img: `${imgBase}/sunset1/300/300` },
  { title: '美食', img: `${imgBase}/food2/300/300` },
  { title: '猫咪', img: `${imgBase}/cat1/300/300` },
  { title: '花卉', img: `${imgBase}/flower1/300/300` },
  { title: '海滩', img: `${imgBase}/beach1/300/300` },
  { title: '音乐会', img: `${imgBase}/concert1/300/300` },
];

function openUploadModal(contactId) {
  uploadTargetId = contactId;
  selectedPhotos.clear();
  const grid = document.getElementById('modalImages');
  grid.innerHTML = demoPhotos.map((p, i) => `
    <div class="mock-img" data-index="${i}" onclick="togglePhotoSelect(${i}, this)">
      <img src="${p.img}" alt="${p.title}" loading="lazy"
           onerror="this.style.display='none';this.parentElement.style.background='#f0f0f0'">
      <div class="check">✓</div>
    </div>
  `).join('');
  document.getElementById('selectedCount').textContent = '0';
  document.getElementById('uploadModal').classList.add('show');
}

function closeUploadModal(e) {
  if (e && e.target !== document.getElementById('uploadModal')) return;
  document.getElementById('uploadModal').classList.remove('show');
  uploadTargetId = null;
  selectedPhotos.clear();
}

function togglePhotoSelect(index, el) {
  if (selectedPhotos.has(index)) {
    selectedPhotos.delete(index);
    el.classList.remove('selected');
  } else {
    selectedPhotos.add(index);
    el.classList.add('selected');
  }
  document.getElementById('selectedCount').textContent = selectedPhotos.size;
}

function confirmUpload() {
  if (selectedPhotos.size === 0) {
    showToast('请至少选择一张照片');
    return;
  }
  const contact = contacts.find(c => c.id === uploadTargetId);
  if (!contact) return;

  selectedPhotos.forEach(idx => {
    const p = demoPhotos[idx];
    contact.photos.unshift({
      title: p.title,
      date: '刚刚',
      img: p.img
    });
  });

  document.getElementById('uploadModal').classList.remove('show');
  renderFamily();
  renderHome();
  if (currentDetailId === uploadTargetId) {
    renderDetail(uploadTargetId);
  }
  showToast(`已上传 ${selectedPhotos.size} 张照片给${contact.name}`);
  speak('照片已成功上传，爸妈那边可以看到啦');
  selectedPhotos.clear();
  uploadTargetId = null;
}

// ============================
// ELDERLY UPLOAD (Contact Picker)
// ============================
function openElderlyUpload() {
  const list = document.getElementById('pickerList');
  list.innerHTML = contacts.map(c => `
    <div class="picker-item" onclick="selectContactForUpload('${c.id}')">
      <div class="pi-avatar">
        <img src="${c.avatar}" alt="${c.name}" loading="lazy">
      </div>
      <div class="pi-name">${c.name}</div>
      <div class="pi-arrow">→</div>
    </div>
  `).join('');
  document.getElementById('contactPicker').classList.add('show');
}

function closeContactPicker(e) {
  if (e && e.target !== document.getElementById('contactPicker')) return;
  document.getElementById('contactPicker').classList.remove('show');
}

function selectContactForUpload(contactId) {
  document.getElementById('contactPicker').classList.remove('show');
  openUploadModal(contactId);
}

// ============================
// TOAST
// ============================
let toastTimeout;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ============================
// SPEECH (Web Speech API)
// ============================
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  // Small delay to let cancel() complete before starting new speech
  setTimeout(() => {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.9;
    utterance.pitch = 1.0;
    utterance.volume = 0.8;
    window.speechSynthesis.speak(utterance);
  }, 120);
}

// ============================
// PHOTO VIEWER
// ============================
function openPhotoViewer(imgSrc, title, date) {
  document.getElementById('viewerImg').src = imgSrc;
  document.getElementById('viewerTitle').textContent = title || '';
  document.getElementById('viewerDate').textContent = date || '';
  document.getElementById('photoViewer').classList.add('show');
}

function closePhotoViewer() {
  document.getElementById('photoViewer').classList.remove('show');
}

// ============================
// RIPPLE EFFECT
// ============================
document.addEventListener('click', function(e) {
  const card = e.target.closest('.contact-card');
  if (!card) return;
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  const rect = card.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
  ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
  card.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove());
});

// ============================
// INIT
// ============================
renderHome();
renderFamily();

// Handle back gesture / browser back
window.addEventListener('popstate', (e) => {
  if (currentView !== 'home') {
    if (currentView === 'videoView') {
      hangUp();
    } else {
      goBack();
    }
    e.preventDefault();
    history.pushState(null, '', window.location.href);
  }
});
history.pushState(null, '', window.location.href);

console.log('📞 亲情相册 Demo 已就绪');
console.log('👴 老年模式：点击头像即可视频通话');
console.log('👨‍👩‍👧 子女管理：点击右上角切换，可上传照片');
console.log('🗣️ 语音播报已启用（需浏览器支持）');
</script>
</body>
