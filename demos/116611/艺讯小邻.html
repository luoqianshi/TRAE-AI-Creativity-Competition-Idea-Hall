<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>艺讯小邻｜本地文艺公益活动助手</title>
  <style>
    :root {
      --bg-primary: #fdfaf5;
      --bg-card: #ffffff;
      --text-primary: #333333;
      --text-secondary: #666666;
      --accent: #6a5acd;
      --accent-light: #9a8ad9;
      --border: #eae5e0;
      --shadow: 0 2px 8px rgba(0,0,0,0.05);
      --radius: 12px;
      --transition: all 0.25s ease;
    }

    .dark-theme {
      --bg-primary: #1e1e24;
      --bg-card: #2d2d37;
      --text-primary: #f0f0f0;
      --text-secondary: #a6a6b2;
      --accent: #a68ad9;
      --accent-light: #c7b8f0;
      --border: #444452;
      --shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 16px;
      transition: var(--transition);
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      padding-top: 16px;
    }

    h1 {
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 100;
      transition: var(--transition);
    }

    .theme-toggle:hover {
      transform: scale(1.05);
      background: var(--accent);
      border-color: var(--accent);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: var(--accent);
      transition: var(--transition);
    }

    .dark-theme .theme-toggle svg {
      fill: #fff;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 28px;
      justify-content: center;
    }

    .filter-btn {
      padding: 8px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.875rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .filter-btn.active, .filter-btn:hover:not(.active) {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .activities-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .activity-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: var(--transition);
      border: 1px solid var(--border);
    }

    .activity-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
    }

    .card-header {
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .icon {
      width: 36px;
      height: 36px;
      background: var(--accent-light);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon svg {
      width: 18px;
      height: 18px;
      fill: white;
    }

    .card-title {
      font-weight: 600;
      font-size: 1.1rem;
      margin: 0;
    }

    .card-meta {
      display: flex;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-body {
      padding: 16px;
    }

    .card-desc {
      font-size: 0.95rem;
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .tag {
      font-size: 0.75rem;
      padding: 4px 10px;
      background: #f8f5ff;
      color: #6a5acd;
      border-radius: 12px;
      font-weight: 500;
      line-height: 1;
    }

    .dark-theme .tag {
      background: #3a3a5a;
      color: #a68ad9;
    }

    .copy-btn {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .copy-btn:hover:not(:disabled) {
      background: #5a4ac5;
      transform: scale(1.02);
    }

    .copy-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 1000;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    footer {
      text-align: center;
      margin-top: 48px;
      padding: 24px 0;
      color: var(--text-secondary);
      font-size: 0.875rem;
      border-top: 1px solid var(--border);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .activities-grid {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 1.5rem;
      }
      .filter-bar {
        gap: 6px;
      }
      .filter-btn {
        padding: 6px 12px;
        font-size: 0.8rem;
      }
      .theme-toggle {
        width: 40px;
        height: 40px;
      }
      body {
        padding: 12px;
      }
    }

    @media (max-width: 480px) {
      .card-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .card-title {
        font-size: 1.05rem;
      }
      .card-meta {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="theme-toggle" id="themeToggle">
    <svg viewBox="0 0 24 24">
      <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.162a.75.75 0 00-1.042-.853l-2.5-2.25a.75.75 0 00-1.094 0l-2.5 2.25a.75.75 0 00-.263.853v5.369a.75.75 0 00.63 1.297h10.042a.75.75 0 00.63-1.297V6.162z"/>
    </svg>
  </div>

  <div class="container">
    <header>
      <h1>艺讯小邻</h1>
      <p class="subtitle">本地文艺公益活动 · 今日可约 · 一键报名</p>
    </header>

    <div class="filter-bar">
      <button class="filter-btn active" data-tag="all">全部活动</button>
      <button class="filter-btn" data-tag="music">音乐</button>
      <button class="filter-btn" data-tag="craft">手工</button>
      <button class="filter-btn" data-tag="senior">银龄友好</button>
      <button class="filter-btn" data-tag="reading">读书会</button>
    </div>

    <div class="activities-grid">
      <!-- 活动卡片 1 -->
      <div class="activity-card" data-tags="music senior">
        <div class="card-header">
          <div class="icon">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          </div>
          <div>
            <h3 class="card-title">古琴公益课</h3>
            <div class="card-meta">
              <div class="meta-item">📍 XX社区中心</div>
              <div class="meta-item">⏰ 今天 15:00</div>
            </div>
          </div>
        </div>
        <div class="card-body">
          <p class="card-desc">零基础也能学！非遗传承人现场教学，含茶歇与琴谱手册。</p>
          <div class="tags">
            <span class="tag">音乐</span>
            <span class="tag">银龄友好</span>
            <span class="tag">免费</span>
          </div>
          <button class="copy-btn" data-text="我要报名古琴课，请预留1个名额，谢谢！">复制报名</button>
        </div>
      </div>

      <!-- 活动卡片 2 -->
      <div class="activity-card" data-tags="craft reading">
        <div class="card-header">
          <div class="icon">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          </div>
          <div>
            <h3 class="card-title">非遗剪纸体验</h3>
            <div class="card-meta">
              <div class="meta-item">📍 文化馆一楼</div>
              <div class="meta-item">⏰ 周六 10:00</div>
            </div>
          </div>
        </div>
        <div class="card-body">
          <p class="card-desc">亲子同乐！老师带您剪出“福”字窗花，材料包现场领取。</p>
          <div class="tags">
            <span class="tag">手工</span>
            <span class="tag">亲子</span>
            <span class="tag">限20人</span>
          </div>
          <button class="copy-btn" data-text="我要报名剪纸体验，请预留1个名额，谢谢！">复制报名</button>
        </div>
      </div>

      <!-- 活动卡片 3 -->
      <div class="activity-card" data-tags="reading senior">
        <div class="card-header">
          <div class="icon">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16 0v14c0 1.1-.9 2-2 2H6v-2h12V6h-3z"/></svg>
          </div>
          <div>
            <h3 class="card-title">银龄读书会</h3>
            <div class="card-meta">
              <div class="meta-item">📍 老年大学报告厅</div>
              <div class="meta-item">⏰ 周四 14:30</div>
            </div>
          </div>
        </div>
        <div class="card-body">
          <p class="card-desc">共读《人间草木》，分享老照片故事，茶水点心全程供应。</p>
          <div class="tags">
            <span class="tag">读书会</span>
            <span class="tag">银龄友好</span>
            <span class="tag">有茶点</span>
          </div>
          <button class="copy-btn" data-text="我要报名读书会，请预留1个名额，谢谢！">复制报名</button>
        </div>
      </div>
    </div>

    <footer>
      <p>基于公开信息聚合生成 · 定位后自动推荐您附近的活动</p>
    </footer>
  </div>

  <div class="toast" id="toast">已复制报名信息</div>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('themeToggle');
    const toast = document.getElementById('toast');
    
    // 初始化主题
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.body.classList.add('dark-theme');
    }
    
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-theme');
    });

    // 标签筛选
    const filterBtns = document.querySelectorAll('.filter-btn');
    const cards = document.querySelectorAll('.activity-card');

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        // 更新激活状态
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const tag = btn.dataset.tag;
        
        cards.forEach(card => {
          const cardTags = card.dataset.tags.split(' ');
          if (tag === 'all' || cardTags.includes(tag)) {
            card.style.display = 'block';
          } else {
            card.style.display = 'none';
          }
        });
      });
    });

    // 复制功能
    const copyBtns = document.querySelectorAll('.copy-btn');
    copyBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const text = btn.dataset.text;
        navigator.clipboard.writeText(text).then(() => {
          toast.classList.add('show');
          setTimeout(() => toast.classList.remove('show'), 2000);
        });
      });
    });
  </script>
</body>
</html>
