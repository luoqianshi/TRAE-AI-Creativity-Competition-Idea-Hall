<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山峰攀登 - 网页版爬山游戏</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js CDN v0.128.0 (兼容非模块 OrbitControls) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <!-- 天空背景层（移动端保留作为背景） -->
    <div class="sky-layer"></div>

    <!-- 山峰剪影背景层（移动端保留） -->
    <div class="mountains-layer">
        <div class="mountain mountain--far"></div>
        <div class="mountain mountain--mid"></div>
        <div class="mountain mountain--near"></div>
    </div>

    <!-- 雪顶装饰（移动端保留） -->
    <div class="snow-cap"></div>

    <!-- 云朵装饰（移动端保留） -->
    <div class="cloud cloud--1"></div>
    <div class="cloud cloud--2"></div>
    <div class="cloud cloud--3"></div>

    <!-- Three.js 3D 场景容器 -->
    <div id="scene3d"></div>

    <!-- 游戏主容器 -->
    <div class="game-container">
        <!-- 奖杯计数 -->
        <div class="trophy-badge" id="trophyBadge" title="已征服山顶次数">
            <span class="trophy-icon">🏆</span>
            <span class="trophy-count" id="trophyCount">0</span>
        </div>

        <!-- 游戏标题 -->
        <h1 class="game-title">🏔️ 山峰攀登</h1>

        <!-- 状态面板 -->
        <div class="status-panel">
            <!-- 高度显示 -->
            <div class="stat-item stat-item--height">
                <span class="stat-label">当前高度</span>
                <div class="height-display">
                    <span class="height-value" id="heightDisplay">0</span>
                    <span class="height-unit">米</span>
                </div>
                <div class="height-progress-bar">
                    <div class="height-progress-fill" id="heightProgressFill"></div>
                </div>
                <span class="height-goal">目标：10000 米 · 10关</span>
                <span class="level-label" id="levelLabel">第 1 关</span>
            </div>

            <!-- 能量条 -->
            <div class="stat-item stat-item--energy">
                <span class="stat-label">能量</span>
                <div class="energy-bar-container">
                    <div class="energy-bar">
                        <div class="energy-bar-fill" id="energyBarFill"></div>
                    </div>
                    <span class="energy-text" id="energyText">100 / 100</span>
                </div>
                <span class="energy-hint" id="energyHint">攀爬消耗 5 点能量</span>
            </div>

            <!-- 金币显示 -->
            <div class="stat-item stat-item--gold">
                <span class="stat-label">金币</span>
                <div class="gold-display">
                    <span class="gold-icon">🪙</span>
                    <span class="gold-value" id="goldDisplay">0</span>
                </div>
            </div>
        </div>

        <!-- 道具面板 -->
        <div class="items-panel">
            <!-- 镐子升级 -->
            <div class="item-card" id="pickaxeCard">
                <div class="item-card-header">
                    <span class="item-icon">⛏️</span>
                    <div class="item-info">
                        <span class="item-name">登山镐</span>
                        <span class="item-level" id="pickaxeLevel">等级 1 / 20</span>
                    </div>
                </div>
                <div class="item-effect" id="pickaxeEffect">效果：+5~10 米/次</div>
                <button class="item-btn item-btn--upgrade" id="pickaxeBtn" onclick="game.upgradePickaxe()">
                    <span class="item-btn-text" id="pickaxeBtnText">升级 · 30 金币</span>
                </button>
            </div>

            <!-- 气球 -->
            <div class="item-card" id="balloonCard">
                <div class="item-card-header">
                    <span class="item-icon">🎈</span>
                    <div class="item-info">
                        <span class="item-name">热气球</span>
                        <span class="item-ownership" id="balloonOwnership">未拥有</span>
                    </div>
                </div>
                <div class="item-effect">效果：+25~40 米/次</div>
                <button class="item-btn item-btn--buy" id="balloonBtn" onclick="game.buyBalloon()">
                    <span class="item-btn-text" id="balloonBtnText">购买 · 120 金币</span>
                </button>
            </div>
        </div>

        <!-- 攀爬按钮区域 -->
        <div class="climb-area">
            <button class="climb-btn" id="climbBtn" onclick="game.climb()">
                <span class="climb-btn-icon">🧗</span>
                <span class="climb-btn-text">攀 爬</span>
                <span class="climb-btn-hint" id="climbHint">按空格键攀爬</span>
            </button>
            <!-- 高度增加值飘出 -->
            <div class="climb-popup" id="climbPopup"></div>
        </div>
    </div>

    <!-- 胜利弹窗遮罩 -->
    <div class="modal-overlay" id="victoryOverlay">
        <div class="modal victory-modal" id="victoryModal">
            <div class="modal-trophy-icon">🏆</div>
            <h2 class="modal-title">恭喜登顶！</h2>
            <p class="modal-subtitle">你成功征服了山峰！</p>
            <div class="modal-stats">
                <div class="modal-stat">
                    <span class="modal-stat-label">总攀爬次数</span>
                    <span class="modal-stat-value" id="victoryTotalClimbs">0</span>
                </div>
                <div class="modal-stat">
                    <span class="modal-stat-label">使用道具数</span>
                    <span class="modal-stat-value" id="victoryItemsUsed">0</span>
                </div>
                <div class="modal-stat">
                    <span class="modal-stat-label">剩余金币</span>
                    <span class="modal-stat-value" id="victoryGold">0</span>
                </div>
            </div>
            <button class="modal-btn" onclick="game.restart()">再来一局</button>
        </div>
    </div>

    <script src="game.js"></script>
    <script defer src="game3d.js"></script>
</body>
</html>
