    <!-- 游戏结束弹窗 -->
    <div class="game-over-overlay" id="gameOverOverlay">
        <div class="game-over-modal">
            <h2>🎉 游戏结束!</h2>
            <div class="final-score" id="finalScore">0</div>
            <p id="gameOverText">不错哦，继续加油！</p>
            <button class="btn btn-start" onclick="closeGameOver()">再玩一次</button>
        </div>
    </div>

    <script>
        // 游戏状态
        let score = 0;
        let timeLeft = 30;
        let hits = 0;
        let combo = 0;
        let gameActive = false;
        let timerInterval;
        let moleInterval;
        let activeMoles = new Set();
        let moleTimers = {};

        // 难度配置
        const difficulties = {
            easy: { minTime: 1200, maxTime: 2000, stayTime: 1500, scoreMult: 1 },
            normal: { minTime: 800, maxTime: 1500, stayTime: 1200, scoreMult: 1.5 },
            hard: { minTime: 600, maxTime: 1200, stayTime: 900, scoreMult: 2 },
            crazy: { minTime: 400, maxTime: 800, stayTime: 700, scoreMult: 3 }
        };

        // 开始游戏
        function startGame() {
            if (gameActive) return;
            
            gameActive = true;
            score = 0;
            timeLeft = 30;
            hits = 0;
            combo = 0;
            activeMoles.clear();
            moleTimers = {};
            
            updateDisplay();
            document.getElementById('startBtn').disabled = true;
            document.getElementById('startBtn').textContent = '游戏进行中...';
            document.getElementById('combo').textContent = '';
            
            // 启动计时器
            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay();
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
            
            // 启动地鼠出现
            spawnMole();
        }

        // 生成地鼠
        function spawnMole() {
            if (!gameActive) return;
            
            const level = document.getElementById('level').value;
            const config = difficulties[level];
            
            // 随机选择一个空的地洞
            const availableHoles = [];
            for (let i = 0; i < 9; i++) {
                if (!activeMoles.has(i)) {
                    availableHoles.push(i);
                }
            }
            
            if (availableHoles.length > 0) {
                const holeIndex = availableHoles[Math.floor(Math.random() * availableHoles.length)];
                showMole(holeIndex, config.stayTime);
            }
            
            // 递归调用，随机间隔
            const nextSpawnTime = Math.random() * (config.maxTime - config.minTime) + config.minTime;
            moleInterval = setTimeout(spawnMole, nextSpawnTime);
        }

        // 显示地鼠
        function showMole(index, stayTime) {
            const mole = document.getElementById(`mole-${index}`);
            mole.classList.add('up');
            mole.classList.remove('hit');
            activeMoles.add(index);
            
            // 地鼠自动消失
            moleTimers[index] = setTimeout(() => {
                hideMole(index);
                // 连击中断
                if (combo > 0) {
                    combo = 0;
                    document.getElementById('combo').textContent = '';
                }
            }, stayTime);
        }

        // 隐藏地鼠
        function hideMole(index) {
            const mole = document.getElementById(`mole-${index}`);
            mole.classList.remove('up');
            activeMoles.delete(index);
            if (moleTimers[index]) {
                clearTimeout(moleTimers[index]);
                delete moleTimers[index];
            }
        }

        // 打地鼠
        function whack(event, index) {
            event.stopPropagation();
            if (!gameActive) return;
            
            const mole = document.getElementById(`mole-${index}`);
            if (!mole.classList.contains('up') || mole.classList.contains('hit')) return;
            
            // 标记为已击中
            mole.classList.add('hit');
            
            // 计算得分
            const level = document.getElementById('level').value;
            const config = difficulties[level];
            combo++;
            const comboBonus = Math.min(combo - 1, 5); // 最多5连击加成
            const points = Math.round(10 * config.scoreMult * (1 + comboBonus * 0.5));
            score += points;
            hits++;
            
            // 显示连击
            if (combo >= 2) {
                document.getElementById('combo').textContent = `${combo} 连击! +${points}分`;
            } else {
                document.getElementById('combo').textContent = `+${points}分`;
            }
            
            // 显示得分飘字
            showScorePopup(event.currentTarget, points);
            
            updateDisplay();
            
            // 延迟隐藏
            setTimeout(() => {
                hideMole(index);
            }, 300);
        }

        // 显示得分飘字
        function showScorePopup(hole, points) {
            const popup = document.createElement('div');
            popup.className = 'score-popup';
            popup.textContent = `+${points}`;
            hole.appendChild(popup);
            
            setTimeout(() => {
                popup.remove();
            }, 800);
        }

        // 更新显示
        function updateDisplay() {
            document.getElementById('score').textContent = score;
            document.getElementById('time').textContent = timeLeft;
            document.getElementById('hits').textContent = hits;
        }

        // 结束游戏
        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            clearTimeout(moleInterval);
            
            // 隐藏所有地鼠
            for (let i = 0; i < 9; i++) {
                hideMole(i);
            }
            
            // 显示结果
            document.getElementById('finalScore').textContent = score;
            
            let text = '';
            if (score < 100) {
                text = '再接再厉，多练习就能打得更快！';
            } else if (score < 300) {
                text = '不错哦，反应很快！';
            } else if (score < 600) {
                text = '太厉害了！你是打地鼠高手！';
            } else {
                text = '简直是神级反应速度！无敌！';
            }
            document.getElementById('gameOverText').textContent = text;
            
            document.getElementById('gameOverOverlay').classList.add('active');
        }

        // 关闭游戏结束弹窗
        function closeGameOver() {
            document.getElementById('gameOverOverlay').classList.remove('active');
            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtn').textContent = '开始游戏';
            document.getElementById('combo').textContent = '';
        }
    </script>
</body>
