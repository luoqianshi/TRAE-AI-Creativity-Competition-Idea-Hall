<style>/* web/style.css */
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#FFFBF0; min-height:100vh; }
#app { display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
.phone { width:375px; height:812px; background:#1a1a1a; border-radius:40px; position:relative; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.3); }
.status-bar { height:44px; background:#fff; display:flex; justify-content:space-between; align-items:center; padding:0 20px; font-size:14px; font-weight:600; }
.screen { height:calc(100% - 44px - 56px); overflow-y:auto; background:#FFFBF0; }
.tabbar { position:absolute; bottom:0; left:0; right:0; height:56px; background:#fff; display:flex; justify-content:space-around; align-items:center; border-top:1px solid #eee; }
.tab-item { display:flex; flex-direction:column; align-items:center; font-size:10px; color:#999; padding:4px 0; flex:1; }

.tab-item svg { width:24px; height:24px; margin-bottom:2px; }
.page { padding:20px; min-height:100%; }
.page-title { font-size:24px; font-weight:700; color:#333; margin-bottom:20px; }
.r-card { background:#fff; border-radius:16px; padding:12px; margin-bottom:12px; display:flex; gap:12px; box-shadow:0 2px 8px rgba(0,0,0,.04); cursor:pointer; transition:all .2s; }

.r-cover { width:96px; height:96px; border-radius:12px; background:#F5E6D3; flex-shrink:0; overflow:hidden; }
.r-cover svg { width:100%; height:100%; }
.r-info { flex:1; display:flex; flex-direction:column; justify-content:space-between; }
.r-name { font-size:16px; font-weight:600; color:#333; }
.r-desc { font-size:12px; color:#999; line-height:1.4; }
.r-tags { display:flex; flex-wrap:wrap; gap:4px; }
.r-tag { font-size:10px; padding:2px 6px; border-radius:4px; background:#F5E6D3; color:#8B7355; }
.r-meta { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#999; }
.detail-header { padding:24px 20px; background:linear-gradient(135deg, #FFD86B 0%, #FFEC8B 100%); border-radius:0 0 32px 32px; }
.detail-title { font-size:24px; font-weight:700; color:#333; margin-bottom:8px; }
.detail-meta { display:flex; gap:12px; font-size:13px; color:#666; }
.hero-cover { width:180px; height:180px; border-radius:20px; margin:20px auto; background:#fff; box-shadow:0 8px 24px rgba(0,0,0,.12); overflow:hidden; }
.hero-cover svg { width:100%; height:100%; }
.hero-deco { position:absolute; top:60px; right:20px; font-size:24px; animation:float 3s ease-in-out infinite; }
.hero-deco:nth-child(2) { right:40px; animation-delay:.5s; }
.hero-deco:nth-child(3) { right:60px; animation-delay:1s; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
.section { margin-bottom:24px; }
.section-title { font-size:16px; font-weight:600; color:#333; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.section-title::before { content:''; width:4px; height:16px; background:#FFD86B; border-radius:2px; }
.ingredients-list { background:#fff; border-radius:16px; padding:16px; }
.ing-item { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #f5f5f5; }
.ing-item:last-child { border-bottom:none; }
.ing-name { font-size:14px; color:#333; }
.ing-qty { font-size:14px; color:#999; }
.steps-list { display:flex; flex-direction:column; gap:16px; }
.step-card { background:#fff; border-radius:16px; padding:16px; display:flex; gap:12px; animation:fadeInUp .4s ease-out backwards; }
.step-card:nth-child(1) { animation-delay:0s; }
.step-card:nth-child(2) { animation-delay:.08s; }
.step-card:nth-child(3) { animation-delay:.16s; }
.step-card:nth-child(4) { animation-delay:.24s; }
.step-card:nth-child(5) { animation-delay:.32s; }

.step-num { width:28px; height:28px; border-radius:50%; background:#FFD86B; color:#333; display:flex; justify-content:center; align-items:center; font-size:12px; font-weight:600; flex-shrink:0; }
.step-img { width:80px; height:80px; border-radius:12px; background:#F5E6D3; flex-shrink:0; overflow:hidden; }

.step-text { flex:1; font-size:14px; color:#333; line-height:1.5; padding-top:4px; }
.action-bar { position:fixed; bottom:56px; left:50%; transform:translateX(-50%); width:375px; background:#fff; padding:16px 20px; display:flex; gap:12px; box-shadow:0 -4px 16px rgba(0,0,0,.08); }
.btn { flex:1; padding:12px; border-radius:12px; font-size:14px; font-weight:600; border:none; cursor:pointer; }
.btn-primary { background:#FFD86B; color:#333; }
.btn-outline { background:#fff; color:#FFD86B; border:2px solid #FFD86B; }

.form-label { font-size:14px; font-weight:600; color:#333; margin-bottom:8px; }

.wheel { width:100%; height:100%; border-radius:50%; border:8px solid #fff; box-shadow:0 8px 24px rgba(0,0,0,.12); position:relative; overflow:hidden; }

.filter-tag.active { background:#FFD86B; color:#333; }

      return `<div class="group-vote-item"><div class="cover">${coverSvg}</div><div class="group-vote-info"><div class="group-vote-name">${r.name}</div><div class="group-vote-count">${currentGroup.votes[r.id] ? currentGroup.votes[r.id].length : 0}票</div></div><button class="group-vote-btn" onclick="App.vote('${r.id}')">${voted ? '✓ 已投票' : '投票'}</button></div>`;
    }).join('')}</div></div>`;
    
    document.getElementById('group-vote-area').innerHTML = html;
  };
  
  const vote = (id) => {
    if (!currentGroup.votes[id]) currentGroup.votes[id] = [];
    if (!currentGroup.votes[id].includes('我')) {
      currentGroup.votes[id].push('我');
      startGroupVote();
    }
  };
  
  const toggleDetailFav = (id) => {
    const isFavorite = toggleFav(id);
    const btn = document.querySelector('.btn-fav');
    btn.innerHTML = isFavorite ? '❤️' : '🤍';
    btn.classList.toggle('active', isFavorite);
  };
  
  const switchTab = (tab) => {
    currentTab = tab;
    document.getElementById('tabbar').innerHTML = renderTabbar();
    let html = '';
    switch(tab) {
      case 'recipes': html = renderRecipes(); break;
      case 'wheel': html = renderWheel(); break;
      case 'budget': html = renderBudget(); break;
      case 'favorites': html = renderFavorites(); break;
      case 'profile': html = renderProfile(); break;
    }
    document.getElementById('screen').innerHTML = html;
  };
  
  const goDetail = (id) => {
    document.getElementById('screen').innerHTML = renderDetail(id);
  };
  
  const showPrefs = () => {
    alert('口味偏好设置：\n\n可选口味：咸鲜、微辣、酸辣、酸甜、清淡、蒜香\n\n当前偏好：' + (userPrefs.flavor.length > 0 ? userPrefs.flavor.join(', ') : '未设置'));
  };
  
  const init = () => {
    loadFavorites();
    document.getElementById('tabbar').innerHTML = renderTabbar();
    document.getElementById('screen').innerHTML = renderRecipes();
    
    setInterval(() => {
      const now = new Date();
      document.getElementById('sb-time').textContent = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
    }, 1000);
  };
  
  return { init, switchTab, goDetail, toggleDetailFav, filterRecipes, generateBudget, spinWheel, generateFridge, startGroupVote, vote };
})();
window.App = App;
document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
