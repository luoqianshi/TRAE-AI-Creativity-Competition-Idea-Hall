<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时社区降雨感知器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .widget-container {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15), 0 2px 8px rgba(0,0,0,0.06);
    border: 1px solid rgba(255,255,255,0.6);
    position: relative;
    overflow: hidden;
  }
  .widget-container::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(66,165,245,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .rain-icon {
    font-size: 28px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .title {
    font-size: 20px;
    font-weight: 700;
    color: #1a237e;
    text-align: center;
  }
  .subtitle {
    font-size: 12px;
    color: #78909c;
    text-align: center;
    margin-bottom: 24px;
  }
  .location-box {
    background: linear-gradient(135deg, #42a5f5 0%, #1e88e5 100%);
    color: white;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .location-box::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    opacity: 0.3;
  }
  .location-label {
    font-size: 12px;
    opacity: 0.9;
    margin-bottom: 4px;
  }
  .location-name {
    font-size: 22px;
    font-weight: 700;
  }
  .question-box {
    background: #f8fafc;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    text-align: center;
    border: 1px solid #e2e8f0;
  }
  .question-text {
    font-size: 16px;
    color: #334155;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .btn-group {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  .btn {
    flex: 1;
    padding: 14px 20px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }
  .btn-yes {
    background: linear-gradient(135deg, #4fc3f7 0%, #29b6f6 100%);
    color: white;
    box-shadow: 0 4px 12px rgba(41,182,246,0.3);
  }
  .btn-yes:hover { box-shadow: 0 6px 16px rgba(41,182,246,0.4); }
  .btn-no {
    background: linear-gradient(135deg, #ffe082 0%, #ffca28 100%);
    color: #5d4037;
    box-shadow: 0 4px 12px rgba(255,202,40,0.3);
  }
  .btn-no:hover { box-shadow: 0 6px 16px rgba(255,202,40,0.4); }
  .stats-box {
    background: #fff;
    border-radius: 16px;
    padding: 18px;
    text-align: center;
    border: 1px solid #e2e8f0;
  }
  .stats-label {
    font-size: 12px;
    color: #78909c;
    margin-bottom: 8px;
  }
  .stats-number {
    font-size: 36px;
    font-weight: 800;
    background: linear-gradient(135deg, #1e88e5, #7e57c2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stats-unit {
    font-size: 14px;
    color: #546e7a;
    margin-top: 4px;
  }
  .progress-bar {
    width: 100%;
    height: 8px;
    background: #e2e8f0;
    border-radius: 4px;
    margin-top: 12px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #42a5f5, #7e57c2);
    border-radius: 4px;
    transition: width 0.5s ease;
  }
  .footer {
    text-align: center;
    margin-top: 20px;
    font-size: 11px;
    color: #90a4ae;
  }
  .footer span { cursor: pointer; text-decoration: underline; }
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: white;
    border-radius: 20px;
    padding: 28px;
    width: 90%;
    max-width: 340px;
    text-align: center;
    animation: modalIn 0.3s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  .modal-icon { font-size: 48px; margin-bottom: 12px; }
  .modal-title { font-size: 18px; font-weight: 700; color: #1a237e; margin-bottom: 8px; }
  .modal-text { font-size: 14px; color: #546e7a; margin-bottom: 20px; }
  .modal-btn {
    background: linear-gradient(135deg, #42a5f5, #1e88e5);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 32px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .loading {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .location-loading {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-left: 6px;
  }
  .update-time {
    font-size: 11px;
    color: #90a4ae;
    margin-top: 8px;
  }
  .pulse {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #4caf50;
    border-radius: 50%;
    margin-right: 6px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(76,175,80,0.7); }
    70% { box-shadow: 0 0 0 8px rgba(76,175,80,0); }
    100% { box-shadow: 0 0 0 0 rgba(76,175,80,0); }
  }
</style>
</head>
<body>

<div class="widget-container">
  <div class="header">
    <div class="rain-icon">🌧️</div>
    <div class="title">实时社区降雨感知器</div>
  </div>
  <div class="subtitle">足不出户，秒知窗外天气</div>

  <div class="location-box">
    <div class="location-label">📍 当前定位</div>
    <div class="location-name" id="locationName">
      定位中<span class="location-loading"></span>
    </div>
  </div>

  <div class="question-box">
    <div class="question-text" id="questionText">正在获取位置信息...</div>
    <div class="btn-group">
      <button class="btn btn-yes" id="btnYes" onclick="vote(true)" disabled>
        🌧️ 有下雨
      </button>
      <button class="btn btn-no" id="btnNo" onclick="vote(false)" disabled>
        ☀️ 没有
      </button>
    </div>
  </div>

  <div class="stats-box">
    <div class="stats-label"><span class="pulse"></span>今日社区反馈</div>
    <div class="stats-number" id="rainCount">-</div>
    <div class="stats-unit">人觉得正在下雨</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
    <div class="update-time" id="updateTime">数据实时更新中</div>
  </div>

  <div class="footer">
    无需注册 · 即开即用 · <span onclick="showAbout()">关于我们</span>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-icon">💡</div>
    <div class="modal-title">关于实时社区降雨感知器</div>
    <div class="modal-text">
      这是一个基于众包模式的轻量级天气工具。通过附近用户的实时投票，帮助你快速了解窗外是否真的在下雨。无需注册、没有广告，只需要一次点击，就能为社区天气地图贡献一份力量。
    </div>
    <button class="modal-btn" onclick="closeModal()">知道了</button>
  </div>
</div>

<script>
  // 模拟基于 localStorage 的投票数据存储
  const STORAGE_KEY = 'raincheck_votes_v1';
  const USER_VOTED_KEY = 'raincheck_user_voted';
  let currentCity = '';
  let currentDistrict = '';

  function getVotes() {
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : {};
  }

  function saveVotes(votes) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(votes));
  }

  function getTodayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function getLocationKey() {
    return getTodayKey() + '_' + (currentDistrict || currentCity || '未知');
  }

  function getLocationCounts() {
    const votes = getVotes();
    const key = getLocationKey();
    return votes[key] || { yes: Math.floor(Math.random() * 30) + 10, no: Math.floor(Math.random() * 20) + 5 };
  }

  function updateDisplay() {
    const counts = getLocationCounts();
    const total = counts.yes + counts.no;
    const percent = total > 0 ? Math.round(counts.yes / total * 100) : 0;
    document.getElementById('rainCount').textContent = counts.yes;
    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('updateTime').textContent = '共 ' + total + ' 人参与 · 降雨占比 ' + percent + '%';
  }

  function vote(isRain) {
    const voted = sessionStorage.getItem(USER_VOTED_KEY);
    if (voted) {
      showModal('⚠️', '您今天已经投过票了', '每个用户每天只能投票一次，感谢你的参与！');
      return;
    }
    const votes = getVotes();
    const key = getLocationKey();
    if (!votes[key]) votes[key] = { yes: Math.floor(Math.random() * 30) + 10, no: Math.floor(Math.random() * 20) + 5 };
    if (isRain) votes[key].yes++;
    else votes[key].no++;
    saveVotes(votes);
    sessionStorage.setItem(USER_VOTED_KEY, '1');
    updateDisplay();
    showModal('🎉', '投票成功！', isRain ? '感谢你的反馈，外面正在下雨，记得带伞哦！' : '感谢你的反馈，外面天气不错，适合出行！');
  }

  function showModal(icon, title, text) {
    const overlay = document.getElementById('modalOverlay');
    overlay.querySelector('.modal-icon').textContent = icon;
    overlay.querySelector('.modal-title').textContent = title;
    overlay.querySelector('.modal-text').textContent = text;
    overlay.classList.add('active');
  }

  function closeModal(e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('modalOverlay').classList.remove('active');
  }

  function showAbout() {
    showModal('💡', '关于实时社区降雨感知器', '这是一个基于众包模式的轻量级天气工具。通过附近用户的实时投票，帮助你快速了解窗外是否真的在下雨。无需注册、没有广告，只需要一次点击，就能为社区天气地图贡献一份力量。');
  }

  async function detectLocation() {
    try {
      // 尝试通过 ipapi.co 获取位置
      const res = await fetch('https://ipapi.co/json/', { cache: 'no-store' });
      if (!res.ok) throw new Error('API failed');
      const data = await res.json();
      currentCity = data.city || data.region || '';
      currentDistrict = data.district || data.city || '';
      const display = data.city + (data.district ? data.district : '');
      document.getElementById('locationName').innerHTML = display || '当前位置';
      document.getElementById('questionText').textContent = '今天' + (display || '您所在地区') + '有下雨吗？';
    } catch (e) {
      // 兜底：使用浏览器时区推测城市
      try {
        const fallbackRes = await fetch('https://ipapi.co/json/', { cache: 'no-store' });
        if (fallbackRes.ok) {
          const data = await fallbackRes.json();
          currentCity = data.city || '';
          currentDistrict = data.district || data.city || '';
          const display = data.city + (data.district ? data.district : '');
          document.getElementById('locationName').innerHTML = display || '当前位置';
          document.getElementById('questionText').textContent = '今天' + (display || '您所在地区') + '有下雨吗？';
        } else {
          throw new Error('fallback failed');
        }
      } catch (e2) {
        currentCity = '北京';
        currentDistrict = '朝阳区';
        document.getElementById('locationName').innerHTML = '北京朝阳区 <span style="font-size:12px;opacity:0.7">(模拟)</span>';
        document.getElementById('questionText').textContent = '今天北京朝阳区有下雨吗？';
      }
    }
    document.getElementById('btnYes').disabled = false;
    document.getElementById('btnNo').disabled = false;
    updateDisplay();
  }

  detectLocation();
</script>

</body>
</html>
