<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恶魔轮盘 Devil's Roulette</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Noto+Serif+SC:wght@700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #fff;
            font-family: 'Noto Serif SC', serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ===== 场景通用 ===== */
        .scene {
            width: 100%;
            height: 100vh;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .scene.active {
            display: flex;
        }

        /* ===== 开始界面 ===== */
        #startScene {
            background: linear-gradient(180deg, #0a0a0a 0%, #1a0505 50%, #0a0a0a 100%);
        }

        .title-container {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }

        .title-container::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 200px;
            border: 3px solid #00ff00;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3), inset 0 0 20px rgba(0, 255, 0, 0.1);
            pointer-events: none;
        }

        .game-title-cn {
            font-size: 72px;
            font-weight: 700;
            color: #ff0000;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8), 0 0 40px rgba(255, 0, 0, 0.4);
            letter-spacing: 10px;
            margin-bottom: 10px;
            animation: titlePulse 2s ease-in-out infinite;
        }

        .game-title-en {
            font-family: 'Creepster', cursive;
            font-size: 42px;
            color: #ff3333;
            text-shadow: 0 0 15px rgba(255, 51, 51, 0.6);
            letter-spacing: 5px;
        }

        @keyframes titlePulse {
            0%, 100% { text-shadow: 0 0 20px rgba(255, 0, 0, 0.8), 0 0 40px rgba(255, 0, 0, 0.4); }
            50% { text-shadow: 0 0 30px rgba(255, 0, 0, 1), 0 0 60px rgba(255, 0, 0, 0.6); }
        }

        .revolver-decoration {
            font-size: 120px;
            margin: 30px 0;
            animation: revolverShake 3s ease-in-out infinite;
        }

        @keyframes revolverShake {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        .start-btn {
            padding: 20px 80px;
            font-size: 28px;
            font-family: 'Noto Serif SC', serif;
            background: linear-gradient(135deg, #8B0000, #4a0000);
            color: #fff;
            border: 3px solid #ff0000;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }

        .start-btn:hover {
            background: linear-gradient(135deg, #aa0000, #660000);
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.6);
            transform: scale(1.05);
        }

        /* ===== 等待界面 ===== */
        #waitScene {
            background: #0a0a0a;
        }

        .wait-container {
            text-align: center;
            max-width: 600px;
            width: 90%;
        }

        .wait-title {
            font-size: 36px;
            color: #ff0000;
            margin-bottom: 40px;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        .player-list {
            background: rgba(20, 0, 0, 0.8);
            border: 2px solid #ff0000;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            min-height: 200px;
        }

        .player-item {
            padding: 10px;
            margin: 5px 0;
            background: rgba(255, 0, 0, 0.1);
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-status {
            color: #00ff00;
            font-size: 14px;
        }

        .player-status.not-ready {
            color: #ff6666;
        }

        .confirm-btn {
            padding: 15px 60px;
            font-size: 24px;
            font-family: 'Noto Serif SC', serif;
            background: linear-gradient(135deg, #006600, #003300);
            color: #fff;
            border: 2px solid #00ff00;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px;
        }

        .confirm-btn:hover {
            background: linear-gradient(135deg, #008800, #004400);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
        }

        .confirm-btn.confirmed {
            background: linear-gradient(135deg, #444, #222);
            border-color: #666;
            cursor: not-allowed;
        }

        .wait-info {
            margin-top: 20px;
            color: #888;
            font-size: 16px;
        }

        /* ===== 游戏界面 ===== */
        #gameScene {
            background: linear-gradient(180deg, #0a0a0a 0%, #150505 100%);
            flex-direction: row;
            padding: 20px;
        }

        .game-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .game-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .text-display {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ff0000;
            border-radius: 15px;
            padding: 40px;
            min-width: 500px;
            max-width: 600px;
            min-height: 200px;
            font-size: 28px;
            line-height: 2;
            letter-spacing: 3px;
            word-wrap: break-word;
            margin-bottom: 30px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
        }

        .text-display .char {
            display: inline-block;
            transition: all 0.1s;
        }

        .text-display .char.correct {
            color: #666;
            text-shadow: none;
        }

        .text-display .char.wrong {
            color: #ff0000;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
            animation: shake 0.3s;
        }

        .text-display .char.pending {
            color: #fff;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .input-area {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .input-hint {
            color: #888;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .error-counter {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .error-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #333;
            border: 2px solid #ff0000;
            transition: all 0.3s;
        }

        .error-dot.active {
            background: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
            animation: pulse 0.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* 持枪人区域 */
        .gunman-container {
            position: relative;
            width: 300px;
            height: 400px;
        }

        .gunman {
            font-size: 200px;
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            animation: gunmanIdle 2s ease-in-out infinite;
        }

        @keyframes gunmanIdle {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        .gunman.shooting {
            animation: gunmanShoot 0.5s ease-out;
        }

        @keyframes gunmanShoot {
            0% { transform: translateX(-50%) rotate(0deg); }
            30% { transform: translateX(-50%) rotate(-20deg) translateY(-30px); }
            100% { transform: translateX(-50%) rotate(0deg); }
        }

        /* 弹夹 */
        .cylinder {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .cylinder.visible {
            opacity: 1;
        }

        .cylinder-spinning {
            animation: spinCylinder 3s linear;
        }

        @keyframes spinCylinder {
            0% { transform: translateX(-50%) rotate(0deg); }
            100% { transform: translateX(-50%) rotate(720deg); }
        }

        .chamber {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #333;
            border: 2px solid #666;
        }

        .chamber.loaded {
            background: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        /* 分数和生命 */
        .game-stats {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 20px;
        }

        .game-stats .stat {
            margin: 10px 0;
        }

        .game-stats .label {
            color: #888;
        }

        .game-stats .value {
            color: #ff0000;
            font-size: 28px;
        }

        /* 游戏结束画面 */
        .game-over-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }

        .game-over-overlay.active {
            display: flex;
        }

        .game-over-text {
            font-size: 80px;
            color: #ff0000;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            margin-bottom: 30px;
            animation: gameOverPulse 1s ease-in-out infinite;
        }

        @keyframes gameOverPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

        .restart-btn {
            padding: 15px 50px;
            font-size: 24px;
            font-family: 'Noto Serif SC', serif;
            background: linear-gradient(135deg, #8B0000, #4a0000);
            color: #fff;
            border: 2px solid #ff0000;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }

        /* 闪烁效果 */
        .flash-red {
            animation: flashRed 0.3s;
        }

        @keyframes flashRed {
            0%, 100% { background: transparent; }
            50% { background: rgba(255, 0, 0, 0.3); }
        }

        /* 子弹上膛动画 */
        .reload-animation {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            color: #ff0000;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .reload-animation.show {
            opacity: 1;
            animation: reloadMove 2s ease-out;
        }

        @keyframes reloadMove {
            0% { transform: translateX(-50%) translateY(0); opacity: 1; }
            100% { transform: translateX(-50%) translateY(-50px); opacity: 0; }
        }

        /* 提示文字 */
        .typing-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- 开始界面 -->
    <div id="startScene" class="scene active">
        <div class="title-container">
            <div class="game-title-cn">恶魔轮盘</div>
            <div class="game-title-en">Devil's Roulette</div>
        </div>
        <div class="revolver-decoration">🔫</div>
        <button class="start-btn" onclick="goToWait()">开始游戏</button>
    </div>

    <!-- 等待界面 -->
    <div id="waitScene" class="scene">
        <div class="wait-container">
            <div class="wait-title">等待玩家加入...</div>
            <div class="player-list" id="playerList">
                <div class="player-item">
                    <span>玩家 1 (你)</span>
                    <span class="player-status not-ready" id="myStatus">未准备</span>
                </div>
                <div class="player-item">
                    <span>电脑玩家 A</span>
                    <span class="player-status">已准备</span>
                </div>
                <div class="player-item">
                    <span>电脑玩家 B</span>
                    <span class="player-status not-ready">未准备</span>
                </div>
            </div>
            <button class="confirm-btn" id="confirmBtn" onclick="confirmReady()">准备</button>
            <div class="wait-info" id="waitInfo">当前 1/3 已准备，达到半数即可开始</div>
        </div>
    </div>

    <!-- 游戏界面 -->
    <div id="gameScene" class="scene">
        <div class="game-stats">
            <div class="stat">
                <span class="label">分数：</span>
                <span class="value" id="score">0</span>
            </div>
            <div class="stat">
                <span class="label">生命：</span>
                <span class="value" id="lives">❤️❤️❤️</span>
            </div>
            <div class="stat">
                <span class="label">连击：</span>
                <span class="value" id="combo">0</span>
            </div>
        </div>

        <div class="game-left">
            <div class="error-counter" id="errorCounter">
                <div class="error-dot" id="dot1"></div>
                <div class="error-dot" id="dot2"></div>
                <div class="error-dot" id="dot3"></div>
            </div>
            <div class="text-display" id="textDisplay"></div>
            <div class="input-area">
                <div class="input-hint">直接敲击键盘输入上方文字...</div>
            </div>
        </div>

        <div class="game-right">
            <div class="gunman-container">
                <div class="gunman" id="gunman">🤠</div>
                <div class="reload-animation" id="reloadAnim">💣 上膛中...</div>
                <div class="cylinder" id="cylinder">
                    <div class="chamber" style="top:0;left:45px;"></div>
                    <div class="chamber" style="top:22px;left:82px;"></div>
                    <div class="chamber" style="top:60px;left:82px;"></div>
                    <div class="chamber" style="top:82px;left:45px;"></div>
                    <div class="chamber" style="top:60px;left:8px;"></div>
                    <div class="chamber" style="top:22px;left:8px;"></div>
                </div>
            </div>
        </div>

        <div class="typing-hint">按 ESC 退出游戏</div>
    </div>

    <!-- 游戏结束 -->
    <div class="game-over-overlay" id="gameOverOverlay">
        <div class="game-over-text" id="gameOverText">你死了</div>
        <div style="font-size: 24px; color: #888; margin-bottom: 20px;">
            最终得分：<span id="finalScore" style="color: #ff0000;">0</span>
        </div>
        <button class="restart-btn" onclick="restartGame()">重新开始</button>
    </div>

    <script>
        // ===== 游戏数据 =====
        const wordList = [
            "What a beautiful day we have today!",
            "Can you tell me what time it is?",
            "I would like to order a cup of coffee.",
            "Do you know where the nearest store is?",
            "Let me think about this for a moment.",
            "She said she would come back soon.",
            "We should meet up for lunch sometime.",
            "The weather is getting colder these days.",
            "He asked me to help him with his homework.",
            "My favorite color has always been blue.",
            "They decided to go on a trip together.",
            "I forgot to bring my umbrella this morning.",
            "Could you please repeat what you said?",
            "The movie we watched last night was amazing.",
            "She told me a very interesting story.",
            "We need to finish this project by tomorrow.",
            "He is learning how to play the guitar.",
            "The restaurant serves delicious food.",
            "I hope we can see each other again soon.",
            "They are planning to visit their grandparents.",
            "She walked into the room and smiled at me.",
            "The teacher explained the lesson very clearly.",
            "He looked out the window and saw a bird.",
            "We spent the afternoon reading books together.",
            "I wonder what the weather will be like tomorrow."
        ];

        let currentScene = 'start';
        let currentText = '';
        let currentIndex = 0;
        let errorCount = 0;
        let score = 0;
        let lives = 3;
        let combo = 0;
        let isGameOver = false;
        let isProcessing = false;

        // ===== 场景切换 =====
        function showScene(sceneId) {
            document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
            document.getElementById(sceneId).classList.add('active');
        }

        function goToWait() {
            showScene('waitScene');
            currentScene = 'wait';
        }

        // ===== 准备逻辑 =====
        let isReady = false;
        let readyCount = 1;
        const totalPlayers = 3;

        function confirmReady() {
            if (isReady) return;
            isReady = true;
            readyCount = 2; // 模拟电脑A已准备

            const btn = document.getElementById('confirmBtn');
            btn.textContent = '已准备';
            btn.classList.add('confirmed');

            document.getElementById('myStatus').textContent = '已准备';
            document.getElementById('myStatus').classList.remove('not-ready');

            document.getElementById('waitInfo').textContent = `当前 ${readyCount}/${totalPlayers} 已准备，达到半数即可开始`;

            // 模拟电脑B准备
            setTimeout(() => {
                readyCount = 3;
                const items = document.querySelectorAll('.player-item');
                items[2].querySelector('.player-status').textContent = '已准备';
                items[2].querySelector('.player-status').classList.remove('not-ready');
                document.getElementById('waitInfo').textContent = `当前 ${readyCount}/${totalPlayers} 已准备，游戏即将开始...`;

                setTimeout(() => {
                    startGame();
                }, 1500);
            }, 2000);
        }

        // ===== 游戏核心 =====
        function startGame() {
            showScene('gameScene');
            currentScene = 'game';
            resetGame();
            nextWord();
        }

        function resetGame() {
            score = 0;
            lives = 3;
            combo = 0;
            errorCount = 0;
            isGameOver = false;
            isProcessing = false;
            updateStats();
            clearErrorDots();
        }

        function nextWord() {
            if (isGameOver) return;
            currentText = wordList[Math.floor(Math.random() * wordList.length)];
            currentIndex = 0;
            errorCount = 0;
            clearErrorDots();
            renderText();
        }

        function renderText() {
            const display = document.getElementById('textDisplay');
            display.innerHTML = '';
            for (let i = 0; i < currentText.length; i++) {
                const span = document.createElement('span');
                span.className = 'char pending';
                span.textContent = currentText[i];
                span.id = `char-${i}`;
                display.appendChild(span);
            }
        }

        function clearErrorDots() {
            document.querySelectorAll('.error-dot').forEach(dot => dot.classList.remove('active'));
        }

        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('combo').textContent = combo;
            let hearts = '';
            for (let i = 0; i < lives; i++) hearts += '❤️';
            for (let i = lives; i < 3; i++) hearts += '🖤';
            document.getElementById('lives').textContent = hearts;
        }

        // ===== 键盘输入处理 =====
        document.addEventListener('keydown', (e) => {
            if (currentScene !== 'game' || isGameOver || isProcessing) return;
            if (e.key === 'Escape') {
                showScene('startScene');
                currentScene = 'start';
                return;
            }

            // 忽略特殊键
            if (e.key.length > 1 || e.ctrlKey || e.altKey || e.metaKey) return;

            const expectedChar = currentText[currentIndex];
            const inputChar = e.key.toLowerCase();

            if (inputChar === expectedChar.toLowerCase()) {
                // 正确输入
                const charEl = document.getElementById(`char-${currentIndex}`);
                charEl.classList.remove('pending');
                charEl.classList.add('correct');
                currentIndex++;
                combo++;
                score += 10 + combo;
                updateStats();

                // 检查是否完成
                if (currentIndex >= currentText.length) {
                    setTimeout(() => {
                        nextWord();
                    }, 300);
                }
            } else {
                // 错误输入
                const charEl = document.getElementById(`char-${currentIndex}`);
                charEl.classList.remove('pending');
                charEl.classList.add('wrong');
                combo = 0;
                errorCount++;
                score = Math.max(0, score - 5);
                updateStats();

                // 标记错误点
                if (errorCount <= 3) {
                    document.getElementById(`dot${errorCount}`).classList.add('active');
                }

                // 3次错误触发转盘
                if (errorCount >= 3) {
                    triggerRoulette();
                }
            }
        });

        // ===== 俄罗斯转盘 =====
        function triggerRoulette() {
            isProcessing = true;

            // 上膛动画
            const reloadAnim = document.getElementById('reloadAnim');
            reloadAnim.classList.add('show');

            // 显示弹夹
            const cylinder = document.getElementById('cylinder');
            cylinder.classList.add('visible');

            // 标记一个弹仓有子弹
            const chambers = cylinder.querySelectorAll('.chamber');
            chambers.forEach(c => c.classList.remove('loaded'));
            const bulletIndex = Math.floor(Math.random() * 6);
            chambers[bulletIndex].classList.add('loaded');

            setTimeout(() => {
                reloadAnim.classList.remove('show');

                // 旋转弹夹
                cylinder.classList.add('cylinder-spinning');

                setTimeout(() => {
                    cylinder.classList.remove('cylinder-spinning');

                    // 随机选择弹孔
                    const selectedChamber = Math.floor(Math.random() * 6);
                    const isDead = selectedChamber === bulletIndex;

                    // 开枪动画
                    const gunman = document.getElementById('gunman');
                    gunman.classList.add('shooting');

                    // 屏幕闪红
                    document.body.classList.add('flash-red');

                    setTimeout(() => {
                        gunman.classList.remove('shooting');
                        document.body.classList.remove('flash-red');

                        if (isDead) {
                            lives--;
                            updateStats();
                            if (lives <= 0) {
                                gameOver();
                                return;
                            }
                        }

                        // 隐藏弹夹，继续游戏
                        cylinder.classList.remove('visible');
                        isProcessing = false;
                        nextWord();

                    }, 500);

                }, 3000); // 旋转3秒

            }, 1500);
        }

        // ===== 游戏结束 =====
        function gameOver() {
            isGameOver = true;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverOverlay').classList.add('active');
        }

        function restartGame() {
            document.getElementById('gameOverOverlay').classList.remove('active');
            showScene('startScene');
            currentScene = 'start';
            isReady = false;
            readyCount = 1;

            // 重置准备按钮
            const btn = document.getElementById('confirmBtn');
            btn.textContent = '准备';
            btn.classList.remove('confirmed');
            document.getElementById('myStatus').textContent = '未准备';
            document.getElementById('myStatus').classList.add('not-ready');
            document.getElementById('waitInfo').textContent = '当前 1/3 已准备，达到半数即可开始';

            // 重置玩家列表
            const items = document.querySelectorAll('.player-item');
            items[1].querySelector('.player-status').textContent = '已准备';
            items[1].querySelector('.player-status').classList.remove('not-ready');
            items[2].querySelector('.player-status').textContent = '未准备';
            items[2].querySelector('.player-status').classList.add('not-ready');
        }
    </script>
</body>
</html>
