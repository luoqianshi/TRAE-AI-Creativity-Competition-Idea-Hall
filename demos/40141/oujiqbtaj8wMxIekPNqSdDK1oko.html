<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>专注计时器</title>
  <!--
    背景图说明：
    - 本页面会优先尝试加载同目录下的 `backhill.png` 作为画布背景；失败则回退到旧的 `backhill-sm.png`；再失败则使用绿色渐变背景。
    - 如果你把 `index.html` 与图片放在同一目录，并通过本地静态服务器访问（例如 VSCode Live Server / `python -m http.server`），浏览器即可稳定、正确地加载图片资源。
  -->
  <style>
    :root{
      --bg0:#0b1220;
      --bg1:#0f172a;
      --card: rgba(17,24,39,0.75);
      --border: rgba(255,255,255,0.10);
      --text: #e5e7eb;
      --muted:#94a3b8;
      --accent:#22c55e;
      --accent2:#38bdf8;
      --danger:#ef4444;
      --shadow: 0 20px 60px rgba(0,0,0,0.45);
      --r-phone: 28px;
      --r-ui: 10px;
      --r-btn: 14px;
      --border-card: 1px solid rgba(255,255,255,0.10);
      --bg-card: rgba(17,24,39,0.55);
      --bg-control: rgba(2,6,23,0.45);
      --transition-fade: opacity 0.2s ease;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:
        radial-gradient(circle at 20% 10%, rgba(34,197,94,0.22), transparent 40%),
        radial-gradient(circle at 90% 30%, rgba(56,189,248,0.16), transparent 45%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
    }

    .phone{
      width: min(420px, 100%);
      aspect-ratio: 9 / 19.5;
      max-height: calc(100vh - 48px);
      border-radius: var(--r-phone);
      border: var(--border-card);
      background: var(--bg-control);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
      backdrop-filter: blur(14px);
      contain: layout style paint;
    }

    .content{
      height:100%;
      display:flex;
      flex-direction:column;
      min-height: 0;
    }

    .view{
      flex: 1 1 auto;
      min-height: 0;
      display:none;
      flex-direction:column;
    }
    .view.active{ display:flex; }

    /* 上半部分：场景区 */
    .scene{
      flex: 1 1 auto;
      padding: 12px 16px 8px;
      position:relative;
      display:flex;
      flex-direction:column;
      min-height: 0;
    }

    .sceneTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-top: 6px;
      margin-bottom: 6px;
      flex: 0 0 auto;
      position:relative;
      z-index: 10;
    }

    .sceneTitle{
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .sceneRight{
      display:flex;
      align-items:center;
      gap: 10px;
      color: var(--text);
      font-weight: 700;
      user-select:none;
    }

    .catCount{
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(17,24,39,0.55);
      font-size: 13px;
    }
    .catCount.inCanvas{
      position:absolute;
      top: 10px;
      right: 10px;
      z-index: 12;
      background: rgba(2,6,23,0.45);
      border-color: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      pointer-events: none;
    }

    .soundBtn{
      visibility: hidden;
      opacity: 0;
      cursor:pointer;
      background: none;
      border: 0;
      color: var(--text);
      padding: 2px;
      transition: opacity 0.2s ease;
      line-height: 1;
    }
    .soundBtn.visible{ visibility: visible; opacity: 0.8; }
    .soundBtn.visible:hover{ opacity: 1; }
    .soundBtn.visible:active{ opacity: 0.7; }
    .soundBtn svg{ display:block; }
    .soundBtn.muted .sound-wave{ display:none; }
    .soundBtn:not(.muted) .sound-x{ display:none; }

    .canvasWrap{
      position:relative;
      border-radius: 22px;
      overflow:hidden;
      border: 1px solid var(--border);
      background: linear-gradient(160deg, rgba(34,197,94,0.35), rgba(34,197,94,0.08));
      flex: 1 1 auto;
      min-height: 60px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.25);
    }

    canvas{
      width:100%;
      height:100%;
      display:block;
    }

    /* 下半部分：控制区 */
    .control{
      flex: 0 0 auto;
      padding: 8px 16px 6px;
      border-top: 1px solid rgba(255,255,255,0.08);
      background: rgba(2,6,23,0.45);
    }

    .controlRow{
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 10px;
      width: 100%;
    }
    .controlRow + .controlRow{
      margin-top: 6px;
    }
    .controlRow.row1{
      height: 44px;
    }
    .controlRow.row2{
      height: 40px;
    }
    .slot{
      position: relative;
      width: 100%;
      height: 100%;
    }
    .slotItem{
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .hidden{
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      transition: none !important;
    }

    .time{
      font-size: 40px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-align:center;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin: 0;
      transition: none;
    }
    .time.tick{
      filter: none;
    }

    .durations{
      display:flex;
      gap: 10px;
      justify-content:center;
      margin: 0;
    }

    .chip{
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(17,24,39,0.55);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 12px;
      font-weight: 800;
      font-size: 13px;
      cursor:pointer;
      transition: background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
      user-select:none;
      min-width: 70px;
      text-align:center;
    }
    .chip:hover{ opacity: 0.92; }
    .chip:active{ opacity: 0.85; }
    .chip.active{
      background: rgba(34,197,94,0.22);
      border-color: rgba(34,197,94,0.55);
      color: #b7f7c9;
    }
    .chip:disabled{
      opacity: 0.45;
      cursor: not-allowed;
      transform:none;
    }

    .mainBtn{
      width: 100%;
      border: 0;
      border-radius: var(--r-ui);
      padding: 10px 16px;
      min-height: 38px;
      font-size: 15px;
      font-weight: 900;
      cursor:pointer;
      background: linear-gradient(90deg, var(--accent), #16a34a);
      color: #06280f;
      box-shadow: 0 14px 30px rgba(34,197,94,0.18);
      transition: var(--transition-fade), filter 0.2s ease;
    }
    .mainBtn:hover{ opacity: 0.94; }
    .mainBtn:active{ opacity: 0.88; }
    .mainBtn.danger{
      background: linear-gradient(90deg, #fb7185, var(--danger));
      color:#fff;
      box-shadow: 0 14px 30px rgba(239,68,68,0.16);
    }
    .mainBtn:disabled{
      opacity: 0.50;
      cursor: not-allowed;
      transform:none;
      filter: grayscale(0.15);
    }

    .cooldownLabel{
      width: 100%;
      text-align:center;
      font-size: 15px;
      font-weight: 950;
      letter-spacing: 0.02em;
      padding: 10px 16px;
      min-height: 38px;
      border-radius: var(--r-ui);
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(17,24,39,0.28);
      color: rgba(229,231,235,0.90);
      user-select:none;
    }

    .tip{
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      text-align:center;
      line-height:1.5;
    }

    .audioRow{
      margin-top: 8px;
      display:flex;
      flex-direction:column;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(17,24,39,0.35);
      color: var(--text);
    }
    .audioLine{
      display:flex;
      align-items:center;
      gap: 10px;
    }
    .audioRow label{
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
      white-space:nowrap;
      flex: 0 0 auto;
    }
    .audioRow select{
      flex: 1;
      min-width: 0;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(2,6,23,0.35);
      color: var(--text);
      border-radius: 12px;
      padding: 8px 10px;
      font-weight: 800;
      outline: none;
    }
    .audioRow input[type="range"]{
      flex: 1;
    }
    .stats{
      margin-top: 10px;
      color: rgba(229,231,235,0.86);
      font-size: 12.5px;
      text-align:center;
    }

    .recordPanel{
      margin-top: 8px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(17,24,39,0.30);
      padding: 8px 10px;
    }
    .recordHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 6px;
    }
    .recordTitle{
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }
    .miniBtn{
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(2,6,23,0.35);
      color: var(--text);
      border-radius: 12px;
      padding: 6px 8px;
      font-weight: 900;
      font-size: 11px;
      cursor:pointer;
      transition: var(--transition-fade);
    }
    .miniBtn:hover{ opacity: 0.92; }
    .miniBtn:active{ opacity: 0.85; }

    .recordList{
      display:flex;
      flex-direction:column;
      gap: 8px;
    }
    .recordItem{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(2,6,23,0.28);
      padding: 8px 10px;
    }
    .recordLeft{
      min-width: 0;
    }
    .recordLine{
      font-size: 12.5px;
      font-weight: 900;
      color: rgba(229,231,235,0.92);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 250px;
    }
    .recordSub{
      margin-top: 3px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 250px;
    }
    .resultBadge{
      flex: 0 0 auto;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      border: 1px solid rgba(255,255,255,0.10);
      margin-top: 1px;
    }
    .resultBadge.ok{
      border-color: rgba(34,197,94,0.35);
      background: rgba(34,197,94,0.18);
      color: #86efac;
    }
    .resultBadge.bad{
      border-color: rgba(239,68,68,0.35);
      background: rgba(239,68,68,0.18);
      color: #fca5a5;
    }
    .recordEmpty{
      text-align:center;
      color: var(--muted);
      font-size: 12.5px;
      padding: 10px 0 4px;
    }

    /* 统计页 */
    .statsView{
      flex: 1 1 auto;
      min-height: 0;
      padding: 12px 16px 10px;
      gap: 10px;
      overflow-y: auto;
    }
    .statsTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-top: 6px;
      margin-bottom: 12px;
    }
    .statsTitle{
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.02em;
    }
    .statsBody{
      flex: none;
      display:flex;
      flex-direction:column;
      gap: 8px;
    }

    .chartCard{
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(17,24,39,0.30);
      padding: 10px 12px 8px;
      box-shadow: 0 16px 32px rgba(0,0,0,0.18);
    }
    .chartTitleRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .chartTitle{
      font-size: 13px;
      font-weight: 900;
      color: var(--muted);
    }
    .chartMeta{
      font-size: 12px;
      font-weight: 900;
      color: rgba(229,231,235,0.85);
      white-space:nowrap;
    }
    .chartCanvasWrap{
      width:100%;
      height: 110px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(2,6,23,0.22);
      overflow:hidden;
    }
    #weekChart{
      width:100%;
      height:100%;
      display:block;
    }

    .statCards{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .statCard{
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(17,24,39,0.28);
      padding: 8px 10px;
    }
    .statLabel{
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
    }
    .statValue{
      margin-top: 4px;
      font-size: 16px;
      font-weight: 950;
      letter-spacing: 0.02em;
    }

    /* 底部 Tab */
    .tabbar{
      flex: 0 0 auto;
      display:flex;
      gap: 10px;
      padding: 6px 12px 8px;
      border-top: 1px solid rgba(255,255,255,0.08);
      background: rgba(2,6,23,0.55);
    }
    .tabBtn{
      flex: 1;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(17,24,39,0.35);
      color: var(--muted);
      border-radius: 8px;
      padding: 8px 10px;
      font-weight: 900;
      cursor:pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
    }
    .tabBtn:hover{ opacity: 0.92; }
    .tabBtn:active{ opacity: 0.85; }
    .tabBtn.active{
      color: var(--text);
      border-color: rgba(34,197,94,0.40);
      background: rgba(34,197,94,0.16);
    }

    /* 弹窗 */
    .modalMask{
      position:absolute;
      inset:0;
      background: rgba(0,0,0,0.55);
      display:none;
      align-items:center;
      justify-content:center;
      z-index: 60;
      padding: 18px;
    }
    .modalMask.show{ display:flex; }
    .modal{
      width: min(360px, 100%);
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(17,24,39,0.92);
      box-shadow: 0 24px 70px rgba(0,0,0,0.55);
      overflow:hidden;
    }
    .modalHeader{
      padding: 14px 16px 10px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .modalTitle{
      margin:0;
      font-size: 18px;
      font-weight: 900;
    }
    .modalDesc{
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .modalTip{
      margin: 8px 0 0;
      color: rgba(255,255,255,0.35);
      font-size: 11px;
      line-height: 1.4;
    }
    .modalBody{
      padding: 14px 16px 16px;
    }
    .thumb{
      width: 100%;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(2,6,23,0.45);
      overflow:hidden;
    }
    .thumb img{
      width:100%;
      display:block;
    }
    .modalActions{
      display:flex;
      gap: 10px;
      margin-top: 12px;
    }
    .btn2{
      flex:1;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(2,6,23,0.35);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 12px;
      font-weight: 900;
      cursor:pointer;
      transition: var(--transition-fade);
    }
    .btn2:hover{ opacity: 0.92; }
    .btn2:active{ opacity: 0.85; }
    .btn2.primary{
      border: 0;
      background: linear-gradient(90deg, var(--accent), #16a34a);
      color:#06280f;
    }

    @media (max-width: 420px){
      body{ padding: 0; }
      .phone{ width: 100%; height: 100vh; aspect-ratio: auto; border-radius: 0; }
    }
  </style>
</head>
<body>
  <main>
  <div class="phone" role="application" aria-label="专注计时器">

    <div class="content">
      <div class="view view-focus active" id="viewFocus" aria-label="专注页">
        <section class="scene">
          <div class="sceneTop">
            <div class="sceneTitle">专注</div>
            <div class="sceneRight">
              <button class="soundBtn" id="soundBtn" aria-label="切换静音">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                  <g class="sound-wave">
                    <path d="M15 9a4 4 0 0 1 0 6"/>
                    <path d="M19 5a8 8 0 0 1 0 14"/>
                  </g>
                  <g class="sound-x">
                    <line x1="22" y1="9" x2="16" y2="15"/>
                    <line x1="16" y1="9" x2="22" y2="15"/>
                  </g>
                </svg>
              </button>
            </div>
          </div>

          <div class="canvasWrap" id="canvasWrap">
            <canvas id="sceneCanvas"></canvas>
          <div class="catCount inCanvas" id="catCount">0 位</div>
          </div>
        </section>

        <section class="control">
          <div class="controlRow row1">
            <div class="slot">
              <div class="time slotItem hidden" id="timeText">25:00</div>
              <div class="durations slotItem" id="durationRow" role="group" aria-label="选择时长">
                <button class="chip active" data-min="25" id="d25">25</button>
                <button class="chip" data-min="45" id="d45">45</button>
              </div>
            </div>
          </div>

          <div class="controlRow row2">
            <div class="slot">
              <button class="mainBtn slotItem" id="mainBtn">开始</button>
              <div class="cooldownLabel slotItem hidden" id="cooldownLabel">休息中</div>
            </div>
          </div>
        </section>
      </div>

      <div class="view view-stats" id="viewStats" aria-label="统计页">
        <div class="statsView">
          <div class="statsTop">
            <div class="statsTitle">统计</div>
            <button class="miniBtn" id="clearHistoryBtn" type="button">清空</button>
          </div>

          <div class="statsBody">
            <div class="chartCard" aria-label="近7天专注图表">
              <div class="chartTitleRow">
                <div class="chartTitle">近 7 天专注时长（分钟）</div>
                <div class="chartMeta" id="chartMeta">本周 0 分钟</div>
              </div>
              <div class="chartCanvasWrap">
                <canvas id="weekChart"></canvas>
              </div>
            </div>

            <div class="statCards" aria-label="统计概览">
              <div class="statCard">
                <div class="statLabel">今日专注次数</div>
                <div class="statValue" id="todayCount">0</div>
              </div>
              <div class="statCard">
                <div class="statLabel">今日专注时长</div>
                <div class="statValue" id="todayMinutes">0 分钟</div>
              </div>
              <div class="statCard">
                <div class="statLabel">本周总时长</div>
                <div class="statValue" id="weekMinutes">0 分钟</div>
              </div>
              <div class="statCard">
                <div class="statLabel">完成率（本周）</div>
                <div class="statValue" id="weekSuccess">0%</div>
              </div>
            </div>

            <div class="stats" id="statsText">今日 0 次 · 本周 0 分钟</div>
            <div class="recordPanel" aria-label="专注详细记录">
              <div class="recordHeader">
                <div class="recordTitle">详细记录</div>
              </div>
              <div class="recordList" id="recordList"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="view view-settings" id="viewSettings" aria-label="设置页">
        <div class="statsView">
          <div class="statsTop">
            <div class="statsTitle">设置</div>
            <div></div>
          </div>

          <div class="statsBody">
            <div class="chartCard" aria-label="背景图设置">
              <div class="chartTitleRow">
                <div class="chartTitle">背景图</div>
                <div class="chartMeta" id="bgMeta">优先 backhill.png</div>
              </div>
              <div style="display:flex; gap:10px; align-items:center;">
                <button class="miniBtn" id="bgBtn" type="button">选择背景图</button>
                <div class="stats" style="margin:0; text-align:left; flex:1;">
                  <span id="bgFileInfo">建议点此选择图片，截图即可带背景图</span>
                </div>
              </div>
              <input id="bgFile" type="file" accept="image/*" style="display:none" />
            </div>

            <div class="chartCard" aria-label="白噪音设置">
              <div class="chartTitleRow">
                <div class="chartTitle">白噪音</div>
                <div class="chartMeta">专注开始会自动播放</div>
              </div>
              <div class="audioRow" aria-label="白噪音控制">
                <div class="audioLine">
                  <label for="soundType">音效</label>
                  <select id="soundType" aria-label="选择环境音">
                    <option value="rain">雨声</option>
                    <option value="wind">风声</option>
                    <option value="stream">溪流</option>
                  </select>
                </div>
                <div class="audioLine">
                  <label for="volume">音量</label>
                  <input id="volume" type="range" min="0" max="100" value="35" aria-label="音量" />
                </div>
              </div>
              <div class="stats" style="margin-top:10px">右上角喇叭可随时切换静音 / 有声（专注前与专注中均可）。</div>
            </div>
          </div>
        </div>
      </div>

      <nav class="tabbar" aria-label="页面切换">
        <button class="tabBtn active" id="tabFocus" type="button" aria-selected="true">专注</button>
        <button class="tabBtn" id="tabStats" type="button" aria-selected="false">统计</button>
        <button class="tabBtn" id="tabSettings" type="button" aria-selected="false">设置</button>
      </nav>
    </div>

    <div class="modalMask" id="modalMask" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-label="专注结果">
        <div class="modalHeader">
          <div>
            <h3 class="modalTitle" id="modalTitle">🎉 专注完成！</h3>
            <p class="modalDesc" id="modalDesc">你专注了 25 分钟，共 12 位小伙伴来陪你</p>
            <p class="modalTip" id="modalBgTip">提示：设置 → 选择背景图，添加与本文件同目录下的 backhill.png，截图即可应用正确的图像。</p>
          </div>
        </div>
        <div class="modalBody">
          <div class="thumb"><img id="thumbImg" alt="场景截图" /></div>
          <div class="modalActions">
            <button class="btn2 primary" id="saveBtn">保存截图</button>
            <button class="btn2" id="closeBtn">关闭</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 状态：idle / focusing / cooldown
    const STATE = {
      idle: "idle",
      focusing: "focusing",
      cooldown: "cooldown",
    };

    // Emoji 规则：
    // 1) 主要使用猫，也允许少量狗；允许重复。
    // 2) 分成 5 组（每组 5 个 emoji），每次新增一只时按 1→2→3→4→5 轮流抽组，再在组内随机抽取。
    const EMOJI_GROUPS = [
      ["🐱","😺","😸","😻","😼"],
      ["😽","🙀","😿","😾","😹"],
      ["🐈","🐈‍⬛","🐱","😺","😸"],
      ["😻","😼","😽","🐈","🐱"],
      ["😺","🐱","🐶","🐕","🐶"], // 不够时可用狗补位；这里保留少量狗作为变化
    ];
    const ALL_EMOJIS = EMOJI_GROUPS.flat();
    let focusGroupCursor = 0;
    const MAX_CATS = 50;
    const COOLDOWN_SECONDS = 30;
    const CAT_ANIM_MS = 520;
    const FOCUS_HISTORY_KEY = "backhill-focus-history";
    const DEFAULT_TITLE = "专注计时器";

    // 缓存历史记录，避免频繁 JSON.parse
    let _focusHistoryCache = null;
    let _focusHistoryDirty = true;

    const canvas = document.getElementById("sceneCanvas");
    const wrap = document.getElementById("canvasWrap");
    const ctx = canvas.getContext("2d");

    const catCountEl = document.getElementById("catCount");
    const soundBtn = document.getElementById("soundBtn");
    const bgBtn = document.getElementById("bgBtn");
    const bgFile = document.getElementById("bgFile");
    const timeText = document.getElementById("timeText");
    const durationRowEl = document.getElementById("durationRow");
    const mainBtn = document.getElementById("mainBtn");
    const cooldownLabelEl = document.getElementById("cooldownLabel");
    const soundTypeEl = document.getElementById("soundType");
    const volumeEl = document.getElementById("volume");
    const statsTextEl = document.getElementById("statsText");
    const recordListEl = document.getElementById("recordList");
    const clearHistoryBtn = document.getElementById("clearHistoryBtn");
    const viewFocusEl = document.getElementById("viewFocus");
    const viewStatsEl = document.getElementById("viewStats");
    const viewSettingsEl = document.getElementById("viewSettings");
    const tabFocusEl = document.getElementById("tabFocus");
    const tabStatsEl = document.getElementById("tabStats");
    const tabSettingsEl = document.getElementById("tabSettings");
    const weekChartEl = document.getElementById("weekChart");
    const chartMetaEl = document.getElementById("chartMeta");
    const todayCountEl = document.getElementById("todayCount");
    const todayMinutesEl = document.getElementById("todayMinutes");
    const weekMinutesEl = document.getElementById("weekMinutes");
    const weekSuccessEl = document.getElementById("weekSuccess");

    const weekChartCtx = weekChartEl ? weekChartEl.getContext("2d") : null;

    const modalMask = document.getElementById("modalMask");
    const modalTitle = document.getElementById("modalTitle");
    const modalDesc = document.getElementById("modalDesc");
    const thumbImg = document.getElementById("thumbImg");
    const saveBtn = document.getElementById("saveBtn");
    const closeBtn = document.getElementById("closeBtn");

    const durationBtns = Array.from(document.querySelectorAll(".chip"));

    let isMuted = true; // 默认静音，仅专注时可播放
    let state = STATE.idle;

    let selectedMinutes = 25;
    let durationSeconds = selectedMinutes * 60;
    let remainingSeconds = durationSeconds;
    let focusStartAt = null;
    let timerId = null;

    // 猫信息：{emoji, x, y, size, angle}
    let cats = [];
    let ghostCats = [];
    let bgLoaded = false;
    let animating = false;
    let lastShownTitle = "";

    const bgImg = new Image();
    // 背景图加载策略：
    //   1. 先从 localStorage 读取用户之前选择的 data URL（data: → 同源 → 截图正常）
    //   2. 没有则尝试 backhill.png → backhill-sm.png
    //   3. 都没有 → 绿色渐变（兜底）
    const BG_STORAGE_KEY = "backhill-custom-bg";
    const BG_CANDIDATES = ["backhill.png", "backhill-sm.png"];
    let bgIndex = 0;

    function getStoredBg(){
      try { return localStorage.getItem(BG_STORAGE_KEY); } catch { return null; }
    }

    function loadNextBg(){
      const stored = getStoredBg();
      if (stored) { bgImg.src = stored; return; }
      bgImg.src = BG_CANDIDATES[bgIndex];
    }
    bgImg.onload = () => { bgLoaded = true; requestRedraw(); };
    bgImg.onerror = () => {
      const stored = getStoredBg();
      if (stored && bgIndex === 0) { bgLoaded = false; requestRedraw(); return; }
      bgIndex += 1;
      if (bgIndex < BG_CANDIDATES.length && !stored) {
        loadNextBg();
      } else {
        bgLoaded = false;
        requestRedraw();
      }
    };
    loadNextBg();

    if (bgBtn && bgFile) {
      bgBtn.addEventListener("click", () => bgFile.click());
      bgFile.addEventListener("change", () => {
      const file = bgFile.files && bgFile.files[0];
      if (!file) return;
      const infoEl = document.getElementById("bgFileInfo");
      const metaEl = document.getElementById("bgMeta");
      // 用 FileReader 读成 data URL → 同源，不会污染画布，截图正常
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        try { localStorage.setItem(BG_STORAGE_KEY, dataUrl); } catch {}
        if (infoEl) infoEl.textContent = `已选择：${file.name}`;
        if (metaEl) metaEl.textContent = file.name;
        bgImg.onload = () => { bgLoaded = true; requestRedraw(); };
        bgImg.onerror = () => { bgLoaded = false; requestRedraw(); };
        bgImg.src = dataUrl;
      };
      reader.onerror = () => {
        if (infoEl) infoEl.textContent = "读取失败，请重试";
      };
      reader.readAsDataURL(file);
      });
    }

    function switchTab(tab){
      const isFocus = tab === "focus";
      const isStats = tab === "stats";
      const isSettings = tab === "settings";

      viewFocusEl.classList.toggle("active", isFocus);
      viewStatsEl.classList.toggle("active", isStats);
      viewSettingsEl.classList.toggle("active", isSettings);

      tabFocusEl.classList.toggle("active", isFocus);
      tabStatsEl.classList.toggle("active", isStats);
      tabSettingsEl.classList.toggle("active", isSettings);

      tabFocusEl.setAttribute("aria-selected", isFocus ? "true" : "false");
      tabStatsEl.setAttribute("aria-selected", isStats ? "true" : "false");
      tabSettingsEl.setAttribute("aria-selected", isSettings ? "true" : "false");

      // 切换到专注页时，确保画布尺寸正确并刷新
      if (isFocus) {
        resizeCanvas();
      } else if (isStats) {
        // 进入统计页：绘制一次图表
        drawWeekChart(loadFocusHistory());
      }
    }

    tabFocusEl.addEventListener("click", () => switchTab("focus"));
    tabStatsEl.addEventListener("click", () => {
      updateStats();
      switchTab("stats");
    });
    tabSettingsEl.addEventListener("click", () => switchTab("settings"));

    // 白噪音（Web Audio），无需额外音频文件
    let audioCtx = null;
    let masterGain = null;
    let noiseSource = null;
    let noiseFilter = null;
    let noiseGain = null;
    let isAudioOn = false;

    function pad2(n){ return String(n).padStart(2,"0"); }

    function formatMMSS(seconds){
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${pad2(m)}:${pad2(s)}`;
    }

    function resizeCanvas(){
      const rect = wrap.getBoundingClientRect();
      // 用 devicePixelRatio 保持清晰
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // 让绘制用 CSS 像素单位
      // 如果当前是空闲态：重新生成 4 只等待猫，避免只出现在左上角一小块区域
      if (state === STATE.idle) {
        generateGhostCats();
      }
      requestRedraw();
    }

    function drawBackground(){
      const w = canvas.width / (window.devicePixelRatio || 1);
      const h = canvas.height / (window.devicePixelRatio || 1);
      if (bgLoaded) {
        // cover
        const imgW = bgImg.naturalWidth;
        const imgH = bgImg.naturalHeight;
        const scale = Math.max(w / imgW, h / imgH);
        const dw = imgW * scale;
        const dh = imgH * scale;
        const dx = (w - dw) / 2;
        const dy = (h - dh) / 2;
        ctx.drawImage(bgImg, dx, dy, dw, dh);
        // 轻微暗角
        const g = ctx.createRadialGradient(w*0.5,h*0.35, 40, w*0.5,h*0.6, Math.max(w,h)*0.75);
        g.addColorStop(0, "rgba(0,0,0,0.00)");
        g.addColorStop(1, "rgba(0,0,0,0.22)");
        ctx.fillStyle = g;
        ctx.fillRect(0,0,w,h);
      } else {
        const grd = ctx.createLinearGradient(0,0,w,h);
        grd.addColorStop(0, "rgba(34,197,94,0.55)");
        grd.addColorStop(1, "rgba(34,197,94,0.10)");
        ctx.fillStyle = grd;
        ctx.fillRect(0,0,w,h);
      }

      // 全天候光线变化（轻微）：早晨偏暖，中午偏亮，傍晚偏暗
      const hour = new Date().getHours();
      ctx.save();
      if (hour >= 6 && hour < 11) {
        ctx.fillStyle = "rgba(255, 196, 140, 0.08)";
      } else if (hour >= 11 && hour < 17) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.05)";
      } else {
        ctx.fillStyle = "rgba(0, 0, 0, 0.14)";
      }
      ctx.fillRect(0,0,w,h);
      ctx.restore();
    }

    function drawCats(list, alpha=1, nowTs=Date.now()){
      const w = canvas.width / (window.devicePixelRatio || 1);
      const h = canvas.height / (window.devicePixelRatio || 1);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      for (const c of list){
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.angle || 0);
        // 入场动画：淡入 + 轻微缩放
        let k = 1;
        let a = 1;
        if (c.bornAt && alpha >= 0.95) {
          const t = Math.min(1, (nowTs - c.bornAt) / CAT_ANIM_MS);
          k = 0.78 + t * 0.22;
          a = 0.20 + t * 0.80;
        }
        ctx.scale(k, k);
        ctx.font = `${c.size}px system-ui, Apple Color Emoji, Segoe UI Emoji`;
        // 给一点阴影，让猫更立体
        ctx.shadowColor = "rgba(0,0,0,0.25)";
        ctx.shadowBlur = 10;
        ctx.globalAlpha = alpha * a;
        ctx.fillText(c.emoji, 0, 0);
        ctx.restore();
      }
      ctx.restore();
    }

    function redraw(nowTs = Date.now()){
      if (!ctx) return;
      const w = canvas.width / (window.devicePixelRatio || 1);
      const h = canvas.height / (window.devicePixelRatio || 1);
      ctx.clearRect(0,0,w,h);
      drawBackground();
      if (state === STATE.idle) {
        drawCats(ghostCats, 0.35, nowTs);
      } else {
        drawCats(cats, 1, nowTs);
      }
    }

    function requestRedraw(){
      if (animating) return;
      animating = true;
      const loop = () => {
        const now = Date.now();
        redraw(now);
        // 只要有猫还在动画时间内，就继续刷；否则停止
        const needsMore =
          state === STATE.focusing &&
          cats.some(c => c.bornAt && (now - c.bornAt) < CAT_ANIM_MS);
        if (needsMore) {
          requestAnimationFrame(loop);
        } else {
          animating = false;
        }
      };
      requestAnimationFrame(loop);
    }

    function randomInRange(min, max){
      return Math.random() * (max - min) + min;
    }

    function randomEmoji(){
      return ALL_EMOJIS[Math.floor(Math.random() * ALL_EMOJIS.length)];
    }

    function nextFocusEmoji(){
      const group = EMOJI_GROUPS[focusGroupCursor];
      focusGroupCursor = (focusGroupCursor + 1) % EMOJI_GROUPS.length;
      return group[Math.floor(Math.random() * group.length)];
    }

    function placeCat(existing, opts = {}){
      const emojiProvider = opts.emojiProvider || randomEmoji;
      const withBornAt = Boolean(opts.withBornAt);
      const w = canvas.width / (window.devicePixelRatio || 1);
      const h = canvas.height / (window.devicePixelRatio || 1);
      const padding = 28;
      const size = Math.floor(randomInRange(22, 29)); // 22~28px
      const angle = (randomInRange(-15, 15) * Math.PI) / 180; // 左右倾斜 15° 内
      const bornAt = withBornAt ? Date.now() : undefined;

      // 碰撞检测：最多尝试 30 次，尽量不重叠
      const tries = 30;

      for (let i=0; i<tries; i++){
        const x = randomInRange(padding, w - padding);
        const y = randomInRange(padding, h - padding);
        let ok = true;
        for (const e of existing){
          const dx = x - e.x;
          const dy = y - e.y;
          const minDist = (size + (e.size || 24)) / 2 + 14;
          if (Math.hypot(dx, dy) < minDist) { ok = false; break; }
        }
        if (ok) return { emoji: emojiProvider(), x, y, size, angle, bornAt };
      }
      // 实在放不下：允许重叠一点
      return {
        emoji: emojiProvider(),
        x: randomInRange(padding, w - padding),
        y: randomInRange(padding, h - padding),
        size,
        angle,
        bornAt
      };
    }

    function generateGhostCats(){
      ghostCats = [];
      for (let i=0; i<4; i++){
        ghostCats.push(placeCat(ghostCats, { emojiProvider: randomEmoji, withBornAt: false }));
      }
    }

    function setCatCount(n){
      catCountEl.textContent = `${n} 位`;
    }

    function setSelectedMinutes(min){
      selectedMinutes = min;
      durationSeconds = selectedMinutes * 60;
      remainingSeconds = durationSeconds;
      timeText.textContent = formatMMSS(remainingSeconds);
      pulseTime();
      updateTitle();
    }

    function pulseTime(){
      // 不做任何动画，避免“抖动/跳动”观感
    }

    function loadFocusHistory(){
      if (_focusHistoryCache && !_focusHistoryDirty) return _focusHistoryCache;
      try { _focusHistoryCache = JSON.parse(localStorage.getItem(FOCUS_HISTORY_KEY)) || []; } catch { _focusHistoryCache = []; }
      _focusHistoryDirty = false;
      return _focusHistoryCache;
    }
    function saveFocusHistory(items){
      localStorage.setItem(FOCUS_HISTORY_KEY, JSON.stringify(items));
      _focusHistoryCache = items;
      _focusHistoryDirty = false;
    }
    function getWeekStart(ts){
      const d = new Date(ts);
      const day = d.getDay(); // 0-6 (Sun-Sat)
      const diff = (day + 6) % 7; // 把周一作为一周开始
      d.setHours(0,0,0,0);
      d.setDate(d.getDate() - diff);
      return d.getTime();
    }
    function updateStats(){
      const list = loadFocusHistory();
      const now = Date.now();
      const today = new Date(now);
      today.setHours(0,0,0,0);
      const todayStart = today.getTime();
      const weekStart = getWeekStart(now);

      const todayCount = list.filter(x => x.endAt >= todayStart).length;
      const todayMinutes = list
        .filter(x => x.endAt >= todayStart)
        .reduce((sum, x) => sum + (x.actualMinutes || 0), 0);

      const weekMinutes = list
        .filter(x => x.endAt >= weekStart)
        .reduce((sum, x) => sum + (x.actualMinutes || 0), 0);

      statsTextEl.textContent = `今日 ${todayCount} 次 · 本周 ${weekMinutes} 分钟`;
      if (todayCountEl) todayCountEl.textContent = String(todayCount);
      if (todayMinutesEl) todayMinutesEl.textContent = `${todayMinutes} 分钟`;
      if (weekMinutesEl) weekMinutesEl.textContent = `${weekMinutes} 分钟`;
      if (chartMetaEl) chartMetaEl.textContent = `本周 ${weekMinutes} 分钟`;

      const weekItems = list.filter(x => x.endAt >= weekStart);
      const success = weekItems.filter(x => x.result === "完成").length;
      const total = weekItems.length || 0;
      const rate = total ? Math.round((success / total) * 100) : 0;
      if (weekSuccessEl) weekSuccessEl.textContent = `${rate}%`;

      drawWeekChart(list);
      renderRecords(list);
    }

    function dayKey(ts){
      const d = new Date(ts);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${dd}`;
    }

    function shortLabel(ts){
      const d = new Date(ts);
      return `${d.getMonth() + 1}/${d.getDate()}`;
    }

    function resizeWeekChart(){
      if (!weekChartEl || !weekChartCtx) return;
      const rect = weekChartEl.getBoundingClientRect();
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      weekChartEl.width = Math.max(1, Math.floor(rect.width * dpr));
      weekChartEl.height = Math.max(1, Math.floor(rect.height * dpr));
      weekChartCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawWeekChart(list){
      if (!weekChartEl || !weekChartCtx) return;
      // 仅在统计页显示时绘制（否则宽高可能为 0）
      if (!viewStatsEl.classList.contains("active")) return;

      resizeWeekChart();

      const w = weekChartEl.width / (window.devicePixelRatio || 1);
      const h = weekChartEl.height / (window.devicePixelRatio || 1);
      const ctx2 = weekChartCtx;

      // 背景清理
      ctx2.clearRect(0, 0, w, h);

      // 近 7 天（含今天）
      const now = Date.now();
      const today = new Date(now);
      today.setHours(0,0,0,0);
      const days = [];
      for (let i = 6; i >= 0; i--){
        const d = new Date(today.getTime());
        d.setDate(d.getDate() - i);
        days.push(d.getTime());
      }

      const map = new Map();
      for (const x of list){
        const k = dayKey(x.endAt);
        map.set(k, (map.get(k) || 0) + (x.actualMinutes || 0));
      }

      const values = days.map(ts => map.get(dayKey(ts)) || 0);
      const maxV = Math.max(10, ...values);

      // 布局
      const padX = 10;
      const padTop = 10;
      const padBottom = 22;
      const chartH = h - padTop - padBottom;
      const gap = 8;
      const barW = Math.floor((w - padX * 2 - gap * 6) / 7);

      // 轻微网格
      ctx2.save();
      ctx2.strokeStyle = "rgba(255,255,255,0.06)";
      ctx2.lineWidth = 1;
      for (let i = 0; i <= 2; i++){
        const y = padTop + (chartH * i) / 2;
        ctx2.beginPath();
        ctx2.moveTo(padX, y);
        ctx2.lineTo(w - padX, y);
        ctx2.stroke();
      }
      ctx2.restore();

      // 柱子 + 标签
      ctx2.textAlign = "center";
      ctx2.textBaseline = "top";
      ctx2.font = "900 11px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif";

      for (let i = 0; i < 7; i++){
        const v = values[i];
        const x = padX + i * (barW + gap);
        const bh = Math.max(2, Math.round((v / maxV) * chartH));
        const y = padTop + (chartH - bh);

        const isToday = i === 6;
        const g = ctx2.createLinearGradient(0, y, 0, y + bh);
        if (isToday) {
          g.addColorStop(0, "rgba(56,189,248,0.95)");
          g.addColorStop(1, "rgba(34,197,94,0.95)");
        } else {
          g.addColorStop(0, "rgba(34,197,94,0.85)");
          g.addColorStop(1, "rgba(34,197,94,0.35)");
        }

        ctx2.fillStyle = g;
        roundRect(ctx2, x, y, barW, bh, 10);
        ctx2.fill();

        // 数值小提示（太小就不画）
        if (v >= 10) {
          ctx2.fillStyle = "rgba(229,231,235,0.82)";
          ctx2.textBaseline = "bottom";
          ctx2.fillText(String(v), x + barW/2, y - 4);
          ctx2.textBaseline = "top";
        }

        // 底部标签
        ctx2.fillStyle = isToday ? "rgba(229,231,235,0.92)" : "rgba(148,163,184,0.90)";
        ctx2.fillText(shortLabel(days[i]), x + barW/2, h - 18);
      }
    }

    function roundRect(ctx2, x, y, w, h, r){
      const rr = Math.min(r, w/2, h/2);
      ctx2.beginPath();
      ctx2.moveTo(x + rr, y);
      ctx2.arcTo(x + w, y, x + w, y + h, rr);
      ctx2.arcTo(x + w, y + h, x, y + h, rr);
      ctx2.arcTo(x, y + h, x, y, rr);
      ctx2.arcTo(x, y, x + w, y, rr);
      ctx2.closePath();
    }

    function formatDateTime(ts){
      return new Date(ts).toLocaleString("zh-CN", { hour12: false });
    }

    function renderRecords(list){
      if (!recordListEl) return;
      if (!list.length) {
        recordListEl.innerHTML = `<div class="recordEmpty">暂无记录</div>`;
        return;
      }

      const latest = list.slice(0, 12);
      recordListEl.innerHTML = latest.map((x) => {
        const badgeClass = x.result === "完成" ? "ok" : "bad";
        return `
          <div class="recordItem">
            <div class="recordLeft">
              <div class="recordLine">${formatDateTime(x.endAt)}</div>
              <div class="recordSub">设定 ${x.plannedMinutes} 分钟 · 实际 ${x.actualMinutes} 分钟 · 🐱 ${x.catsCount}</div>
            </div>
            <div class="resultBadge ${badgeClass}">${x.result}</div>
          </div>
        `;
      }).join("");
    }

    function recordSession({ plannedMinutes, actualMinutes, isComplete, catsCount, startAt, endAt }){
      const list = loadFocusHistory();
      list.unshift({
        id: crypto?.randomUUID?.() || String(Date.now()) + Math.random().toString(16).slice(2),
        startAt,
        endAt,
        plannedMinutes,
        actualMinutes,
        result: isComplete ? "完成" : "中断",
        catsCount
      });
      saveFocusHistory(list.slice(0, 2000));
      updateStats();
    }

    function updateTitle(){
      let next = DEFAULT_TITLE;
      if (state === STATE.focusing) next = `[${formatMMSS(remainingSeconds)}] 专注中`;
      if (state === STATE.cooldown) next = `[${formatMMSS(remainingSeconds)}] 休息中`;
      if (next !== lastShownTitle) {
        document.title = next;
        lastShownTitle = next;
      }
    }

    function ensureAudio(){
      if (audioCtx) return;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      audioCtx = new Ctx();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = Number(volumeEl.value) / 100;
      masterGain.connect(audioCtx.destination);
    }

    function makeNoiseBuffer(ctx){
      const sampleRate = ctx.sampleRate;
      const seconds = 2.0;
      const buffer = ctx.createBuffer(1, sampleRate * seconds, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      return buffer;
    }

    function startNoise(){
      if (isMuted) return;
      ensureAudio();
      if (!audioCtx || isAudioOn) return;
      if (audioCtx.state === "suspended") audioCtx.resume();

      noiseSource = audioCtx.createBufferSource();
      noiseSource.buffer = makeNoiseBuffer(audioCtx);
      noiseSource.loop = true;

      noiseFilter = audioCtx.createBiquadFilter();
      noiseGain = audioCtx.createGain();

      // 不同环境音：用滤波模拟“感觉”（无需音频文件）
      const type = soundTypeEl.value;
      if (type === "rain") {
        noiseFilter.type = "highpass";
        noiseFilter.frequency.value = 900;
        noiseGain.gain.value = 0.13;
      } else if (type === "wind") {
        noiseFilter.type = "lowpass";
        noiseFilter.frequency.value = 380;
        noiseGain.gain.value = 0.18;
      } else { // stream
        noiseFilter.type = "bandpass";
        noiseFilter.frequency.value = 650;
        noiseFilter.Q.value = 0.9;
        noiseGain.gain.value = 0.15;
      }

      noiseSource.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(masterGain);
      noiseSource.start();
      isAudioOn = true;
    }

    function stopNoise(){
      if (!isAudioOn) return;
      try { noiseSource && noiseSource.stop(); } catch {}
      try { noiseSource && noiseSource.disconnect(); } catch {}
      try { noiseFilter && noiseFilter.disconnect(); } catch {}
      try { noiseGain && noiseGain.disconnect(); } catch {}
      noiseSource = null;
      noiseFilter = null;
      noiseGain = null;
      isAudioOn = false;
    }

    function syncSoundIcon(){
      soundBtn.classList.toggle("muted", isMuted);
      soundBtn.setAttribute("aria-label", isMuted ? "已静音" : "已开启声音");
    }

    function setState(next){
      state = next;
      if (state === STATE.idle){
        // 两行布局：25/45 + 开始
        durationRowEl.classList.remove("hidden");
        timeText.classList.add("hidden");
        mainBtn.classList.remove("hidden");
        cooldownLabelEl.classList.add("hidden");

        mainBtn.textContent = "开始";
        mainBtn.classList.remove("danger");
        mainBtn.disabled = false;
        durationBtns.forEach(b => b.disabled = false);
        generateGhostCats();
        cats = [];
        setCatCount(0);
        remainingSeconds = durationSeconds;
        timeText.textContent = formatMMSS(remainingSeconds);
        pulseTime();
        updateTitle();
        requestRedraw();
        soundBtn.classList.remove("visible");
        return;
      }

      if (state === STATE.focusing){
        // 两行布局：倒计时 + 结束专注
        durationRowEl.classList.add("hidden");
        timeText.classList.remove("hidden");
        mainBtn.classList.remove("hidden");
        cooldownLabelEl.classList.add("hidden");

        mainBtn.textContent = "结束专注";
        mainBtn.classList.add("danger");
        mainBtn.disabled = false;
        durationBtns.forEach(b => b.disabled = true);
        updateTitle();
        return;
      }

      if (state === STATE.cooldown){
        // 两行布局：冷却倒计时 + 休息中
        durationRowEl.classList.add("hidden");
        timeText.classList.remove("hidden");
        mainBtn.classList.add("hidden");
        cooldownLabelEl.classList.remove("hidden");

        durationBtns.forEach(b => b.disabled = true);
        updateTitle();
        soundBtn.classList.remove("visible");
      }
    }

    function clearTimer(){
      if (timerId){
        clearInterval(timerId);
        timerId = null;
      }
    }

    function startFocus(){
      if (state !== STATE.idle) return;
      focusStartAt = Date.now();
      remainingSeconds = durationSeconds;
      cats = [];
      setCatCount(0);
      focusGroupCursor = 0; // 每次专注都从第 1 组开始轮流抽取
      setState(STATE.focusing);
      // 显示音量按钮并自动开启（默认 35%，后续按记忆值）
      soundBtn.classList.add("visible");
      isMuted = false;
      syncSoundIcon();
      startNoise();
      requestRedraw();

      // 猫的出现规则：每分钟开始 5 秒后出现
      // 例如 25 分钟：24:55 出现第一只，23:55 出现第二只...
      let spawned = 0;
      let lastShownRemaining = null;

      clearTimer();
      timerId = setInterval(() => {
        // 倒计时以真实经过的毫秒为准，避免 setInterval 累积误差
        const now = Date.now();
        const elapsedSeconds = Math.max(0, Math.floor((now - focusStartAt) / 1000));
        const nextRemaining = Math.max(0, durationSeconds - elapsedSeconds);

        if (nextRemaining !== lastShownRemaining) {
          lastShownRemaining = nextRemaining;
          remainingSeconds = nextRemaining;
          timeText.textContent = formatMMSS(remainingSeconds);
          pulseTime();
          updateTitle();
        }

        const catsShouldBe =
          elapsedSeconds < 5 ? 0 : Math.min(MAX_CATS, Math.floor((elapsedSeconds - 5) / 60) + 1);

        if (catsShouldBe > spawned) {
          const addCount = catsShouldBe - spawned;
          for (let i = 0; i < addCount; i++) {
            if (cats.length >= MAX_CATS) break;
            cats.push(placeCat(cats, { emojiProvider: nextFocusEmoji, withBornAt: true }));
          }
          spawned = catsShouldBe;
          setCatCount(cats.length);
          requestRedraw();
        }

        if (remainingSeconds <= 0){
          finishFocus(true);
        }
      }, 200);
    }

    function finishFocus(isComplete){
      if (state !== STATE.focusing) return;
      clearTimer();
      stopNoise();

      const endAt = Date.now();
      const actualSeconds = Math.max(0, Math.round((endAt - focusStartAt) / 1000));
      const actualMinutes = Math.max(1, Math.ceil(actualSeconds / 60));

      // 弹窗内容
      modalTitle.textContent = isComplete ? "🎉 专注完成！" : "🫧 专注中断";
      modalDesc.textContent = `你专注了 ${actualMinutes} 分钟，共 ${cats.length} 位小伙伴来陪你`;

      recordSession({
        plannedMinutes: selectedMinutes,
        actualMinutes,
        isComplete,
        catsCount: cats.length,
        startAt: focusStartAt,
        endAt
      });

      startCooldown();

      // 截图（data URL 同源 → 不会污染画布，截图正常带背景图）
      let pngData = "";
      let usedFallback = false;
      try {
        pngData = makeScreenshotDataUrl();
      } catch (e) {
        usedFallback = true;
        pngData = makeSafeScreenshotDataUrl();
      }
      thumbImg.src = pngData;
      thumbImg.dataset.png = pngData;

      showModal();
    }

    function startCooldown(){
      setState(STATE.cooldown);
      const cooldownStartAt = Date.now();
      let lastShown = null;
      remainingSeconds = COOLDOWN_SECONDS;
      timeText.textContent = formatMMSS(remainingSeconds);
      pulseTime();
      updateTitle();

      clearTimer();
      timerId = setInterval(() => {
        const now = Date.now();
        const elapsedSeconds = Math.max(0, Math.floor((now - cooldownStartAt) / 1000));
        const remain = Math.max(0, COOLDOWN_SECONDS - elapsedSeconds);

        if (remain !== lastShown) {
          lastShown = remain;
          remainingSeconds = remain;
          timeText.textContent = formatMMSS(remainingSeconds);
          pulseTime();
          updateTitle();
        }

        if (remain <= 0){
          clearTimer();
          // 回到 idle：恢复选定时长的显示
          setSelectedMinutes(selectedMinutes);
          setState(STATE.idle);
        }
      }, 200);
    }

    function makeScreenshotDataUrl(){
      // 基于当前场景 canvas 复制一张，并加水印
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const w = canvas.width;
      const h = canvas.height;

      const out = document.createElement("canvas");
      out.width = w;
      out.height = h;
      const octx = out.getContext("2d");

      // 背景 + 猫
      octx.drawImage(canvas, 0, 0);

      // 水印（在截图上，而不是主画布）
      octx.save();
      octx.scale(dpr, dpr);
      const cw = w / dpr;
      const ch = h / dpr;

      octx.font = "900 16px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif";
      octx.fillStyle = "rgba(255,255,255,0.78)";
      octx.textBaseline = "top";
      octx.fillText("后山生活", 12, 12);

      octx.font = "800 14px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif";
      octx.fillStyle = "rgba(255,255,255,0.72)";
      octx.textBaseline = "bottom";
      octx.restore();

      return out.toDataURL("image/png");
    }

    function makeSafeScreenshotDataUrl(){
      // 安全回退截图：不依赖主画布（避免 file:// + 图片导致的“canvas 被污染”问题）
      // 用渐变背景 + 当前猫的位置重新渲染，再加水印。
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const w = canvas.width;
      const h = canvas.height;

      const out = document.createElement("canvas");
      out.width = w;
      out.height = h;
      const octx = out.getContext("2d");

      // 渐变背景
      octx.save();
      octx.scale(dpr, dpr);
      const cw = w / dpr;
      const ch = h / dpr;
      const grd = octx.createLinearGradient(0, 0, cw, ch);
      grd.addColorStop(0, "rgba(34,197,94,0.55)");
      grd.addColorStop(1, "rgba(34,197,94,0.10)");
      octx.fillStyle = grd;
      octx.fillRect(0, 0, cw, ch);
      octx.restore();

      // 猫（复用当前 cats 的布局）
      const now = Date.now();
      octx.save();
      octx.scale(dpr, dpr);
      octx.textAlign = "center";
      octx.textBaseline = "middle";
      for (const c of cats) {
        octx.save();
        octx.translate(c.x, c.y);
        octx.rotate(c.angle || 0);
        // 直接输出最终态（不做入场动画）
        octx.font = `${c.size}px system-ui, Apple Color Emoji, Segoe UI Emoji`;
        octx.shadowColor = "rgba(0,0,0,0.25)";
        octx.shadowBlur = 10;
        octx.fillText(c.emoji, 0, 0);
        octx.restore();
      }
      octx.restore();

      // 水印：左上角
      octx.save();
      octx.scale(dpr, dpr);
      octx.font = "900 16px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif";
      octx.fillStyle = "rgba(255,255,255,0.78)";
      octx.textBaseline = "top";
      octx.fillText("后山生活", 12, 12);
      octx.restore();

      return out.toDataURL("image/png");
    }

    function showModal(){
      // 未添加背景图时显示提示
      const tipEl = document.getElementById("modalBgTip");
      if (tipEl) tipEl.classList.toggle("hidden", !!localStorage.getItem(BG_STORAGE_KEY));
      modalMask.classList.add("show");
      modalMask.setAttribute("aria-hidden", "false");
    }
    function hideModal(){
      modalMask.classList.remove("show");
      modalMask.setAttribute("aria-hidden", "true");
    }

    function downloadDataUrl(dataUrl, filename){
      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    // 事件
    durationBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        if (state !== STATE.idle) return;
        durationBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        setSelectedMinutes(Number(btn.dataset.min));
      });
    });

    soundBtn.addEventListener("click", () => {
      isMuted = !isMuted;
      syncSoundIcon();
      // 仅专注中才真正播放/停止声音；空闲/冷却时只切换图标
      if (state === STATE.focusing) {
        if (isMuted) {
          stopNoise();
        } else {
          startNoise();
        }
      }
    });

    volumeEl.addEventListener("input", () => {
      ensureAudio();
      if (masterGain) {
        masterGain.gain.value = Number(volumeEl.value) / 100;
      }
    });

    soundTypeEl.addEventListener("change", () => {
      // 切换音效：重启噪音链路
      if (isAudioOn) {
        stopNoise();
        startNoise();
      }
    });

    clearHistoryBtn.addEventListener("click", () => {
      if (!confirm("确定要清空所有专注记录吗？")) return;
      localStorage.removeItem(FOCUS_HISTORY_KEY);
      _focusHistoryCache = null;
      _focusHistoryDirty = true;
      updateStats();
    });

    mainBtn.addEventListener("click", () => {
      if (state === STATE.idle) {
        startFocus();
        return;
      }
      if (state === STATE.focusing) {
        finishFocus(false);
      }
    });

    saveBtn.addEventListener("click", () => {
      const dataUrl = thumbImg.dataset.png;
      if (!dataUrl) return;
      const ts = new Date().toLocaleString("zh-CN", { hour12: false }).replace(/[^\d]/g, "");
      downloadDataUrl(dataUrl, `backhill-focus-${ts}.png`);
    });

    closeBtn.addEventListener("click", hideModal);
    modalMask.addEventListener("click", (e) => {
      if (e.target === modalMask) hideModal();
    });

    // 键盘快捷键（可选）：空格开始/结束专注
    window.addEventListener("keydown", (e) => {
      if (e.code !== "Space") return;
      const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
      if (tag === "input" || tag === "textarea" || tag === "select") return;
      e.preventDefault();
      if (state === STATE.idle) startFocus();
      else if (state === STATE.focusing) finishFocus(false);
    });

    // 防止意外关闭提醒：专注中离开页面提示确认
    window.addEventListener("beforeunload", (e) => {
      if (state !== STATE.focusing) return;
      e.preventDefault();
      e.returnValue = "";
    });

    function debounce(fn, ms){
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), ms);
      };
    }

    const handleResize = debounce(function(){
      // 统计页 display:none 时，canvas 容器尺寸会变成 0；
      // 根据当前页分别 resize。
      if (viewFocusEl.classList.contains("active")) {
        resizeCanvas();
      } else if (viewStatsEl.classList.contains("active")) {
        drawWeekChart(loadFocusHistory());
      }
    }, 150);
    window.addEventListener("resize", handleResize);

    // 初始化
    setSelectedMinutes(25);
    // 先按容器尺寸缩放画布，再进入 idle 生成 4 只等待猫（否则会集中在左上角）
    resizeCanvas();
    setState(STATE.idle);
    updateStats();
    syncSoundIcon();
    document.title = DEFAULT_TITLE;
  </script>
  </main>
</body>
