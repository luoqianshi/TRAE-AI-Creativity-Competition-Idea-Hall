<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>API测试</title>
</head>
<body>
    <h1>DeepSeek API 测试</h1>
    <div id="result"></div>
    <script>
        const apiKey = 'sk-1a38205f866c491a8712d4c23944355a';
        
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>正在测试API...</p>';
            
            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: '你是一个测试助手。' },
                            { role: 'user', content: '你好，请回复"API测试成功"' }
                        ],
                        temperature: 0.7
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    resultDiv.innerHTML = `<p style="color: red;">❌ API错误: ${response.status}<br>${JSON.stringify(error)}</p>`;
                    return;
                }
                
                const data = await response.json();
                const reply = data.choices[0].message.content;
                resultDiv.innerHTML = `<p style="color: green;">✅ API测试成功!<br><br>模型回复: ${reply}</p>`;
                console.log('API响应:', data);
                
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">❌ 连接错误: ${error.message}</p>`;
            }
        }
        
        testAPI();
    </script>
</body>
</html>
