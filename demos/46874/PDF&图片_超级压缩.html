<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF/图片超级压缩</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .upload-area {
            border: 3px dashed #cbd5e0;
            border-radius: 16px;
            padding: 50px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8fafc;
            margin-bottom: 25px;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateY(-2px);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 18px;
            color: #4a5568;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .upload-hint {
            font-size: 14px;
            color: #a0aec0;
        }

        .file-info {
            background: #f0f4ff;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: none;
        }

        .file-info.show {
            display: block;
        }

        .file-name {
            font-size: 15px;
            color: #4a5568;
            font-weight: 500;
            word-break: break-all;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 10px;
        }

        .name-input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        .name-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .name-input::placeholder {
            color: #a0aec0;
            font-style: italic;
        }

        .compression-options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .radio-option {
            flex: 1;
            min-width: 140px;
            position: relative;
        }

        .radio-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .radio-option label {
            display: block;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
            color: #4a5568;
            background: white;
        }

        .radio-option label:hover {
            border-color: #667eea;
            background: #f8fafc;
        }

        .radio-option input[type="radio"]:checked + label {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .progress-container {
            display: none;
            margin-bottom: 25px;
        }

        .progress-container.show {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #e2e8f0;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 6px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            font-size: 14px;
            color: #718096;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 160px;
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            display: none;
        }

        .btn-success.show {
            display: block;
        }

        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(72, 187, 120, 0.4);
        }

        .btn-success:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-info {
            background: #f0fff4;
            border: 1px solid #9ae6b4;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: none;
        }

        .result-info.show {
            display: block;
        }

        .result-info p {
            font-size: 14px;
            color: #276749;
            margin: 5px 0;
        }

        .result-info strong {
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .card {
                padding: 25px;
            }

            .title {
                font-size: 22px;
            }

            .upload-area {
                padding: 35px 20px;
            }

            .compression-options {
                flex-direction: column;
            }

            .radio-option {
                min-width: 100%;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="title">PDF/图片超级压缩</h1>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">拖拽文件到此处，或点击选择文件</div>
            <div class="upload-hint">支持 PDF、JPG、JPEG、PNG 格式</div>
            <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png" style="display: none;">
        </div>

        <div class="file-info" id="fileInfo">
            <div class="file-name" id="fileName"></div>
        </div>

        <div class="form-group">
            <label class="form-label" for="fileNameInput">文件命名</label>
            <input type="text" class="name-input" id="fileNameInput" placeholder="请输入转换后的文件名">
        </div>

        <div class="form-group">
            <label class="form-label">压缩选项</label>
            <div class="compression-options">
                <div class="radio-option">
                    <input type="radio" id="extreme" name="compression" value="108">
                    <label for="extreme">极致压缩 (108)</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="default" name="compression" value="128" checked>
                    <label for="default">默认压缩 (128)</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="safe" name="compression" value="148">
                    <label for="safe">安全压缩 (148)</label>
                </div>
            </div>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">准备中...</div>
        </div>

        <div class="result-info" id="resultInfo">
            <p><strong>原始大小：</strong><span id="originalSize">-</span></p>
            <p><strong>压缩后大小：</strong><span id="compressedSize">-</span></p>
            <p><strong>压缩率：</strong><span id="compressionRate">-</span></p>
        </div>

        <div class="button-group">
            <button class="btn btn-primary" id="compressBtn" disabled>确认压缩</button>
            <button class="btn btn-success" id="downloadBtn">⬇️ 点击保存</button>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const { jsPDF } = window.jspdf;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileNameInput = document.getElementById('fileNameInput');
        const compressBtn = document.getElementById('compressBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const resultInfo = document.getElementById('resultInfo');
        const originalSize = document.getElementById('originalSize');
        const compressedSize = document.getElementById('compressedSize');
        const compressionRate = document.getElementById('compressionRate');

        let currentFile = null;
        let compressedBlob = null;
        let outputFileName = '';

        const A4_WIDTH_MM = 210;
        const A4_HEIGHT_MM = 297;
        const DPI = 150;
        const A4_WIDTH_PX = Math.round(A4_WIDTH_MM * DPI / 25.4);
        const A4_HEIGHT_PX = Math.round(A4_HEIGHT_MM * DPI / 25.4);

        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        function handleFile(file) {
            if (!file) return;

            const validTypes = ['application/pdf', 'image/jpeg', 'image/jpg', 'image/png'];
            if (!validTypes.includes(file.type)) {
                alert('请上传 PDF、JPG、JPEG 或 PNG 格式的文件');
                return;
            }

            currentFile = file;
            fileName.textContent = `已选择：${file.name} (${formatFileSize(file.size)})`;
            fileInfo.classList.add('show');
            compressBtn.disabled = false;

            downloadBtn.classList.remove('show');
            resultInfo.classList.remove('show');
            compressedBlob = null;
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function getThreshold() {
            const selected = document.querySelector('input[name="compression"]:checked');
            return parseInt(selected.value);
        }

        function getOutputFileName() {
            const inputName = fileNameInput.value.trim();
            if (inputName) {
                return inputName.endsWith('.pdf') ? inputName : inputName + '.pdf';
            }
            const originalName = currentFile.name.replace(/\.[^/.]+$/, '');
            return '1_' + originalName + '.pdf';
        }

        function updateProgress(percent, text) {
            progressFill.style.width = percent + '%';
            progressText.textContent = text;
        }

        function disableControls() {
            compressBtn.disabled = true;
            fileNameInput.disabled = true;
            uploadArea.style.pointerEvents = 'none';
            uploadArea.style.opacity = '0.6';
            document.querySelectorAll('input[name="compression"]').forEach(radio => {
                radio.disabled = true;
            });
        }

        function enableControls() {
            compressBtn.disabled = false;
            fileNameInput.disabled = false;
            uploadArea.style.pointerEvents = 'auto';
            uploadArea.style.opacity = '1';
            document.querySelectorAll('input[name="compression"]').forEach(radio => {
                radio.disabled = false;
            });
        }

        function binarizeImage(imageData, threshold) {
            const data = imageData.data;
            const width = imageData.width;
            const height = imageData.height;
            const redMask = new Uint8Array(width * height);

            // 第一步：标记红色印章区域
            for (let i = 0, j = 0; i < data.length; i += 4, j++) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                // 更宽松的红色检测，保留更多边缘红色像素
                const isRed = r > 120 && r - g > 25 && r - b > 25 && g < 160 && b < 160;

                if (isRed) {
                    redMask[j] = 1;
                } else {
                    redMask[j] = 0;
                }
            }

            // 第二步：处理红色区域 - 轻度增强，保留渐变细节
            for (let i = 0, j = 0; i < data.length; i += 4, j++) {
                if (redMask[j] === 1) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];

                    // 轻度增强红色，保留原始渐变和细节
                    // R 稍微提高，G/B 稍微降低，但幅度不大
                    data[i] = Math.min(255, Math.round(r * 1.05 + 10));
                    data[i + 1] = Math.max(0, Math.round(g * 0.85));
                    data[i + 2] = Math.max(0, Math.round(b * 0.85));
                    data[i + 3] = 255;
                } else {
                    // 非红色区域：严格二值化（像素级纯净）
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    const gray = 0.299 * r + 0.587 * g + 0.114 * b;

                    if (gray > threshold) {
                        data[i] = 255;
                        data[i + 1] = 255;
                        data[i + 2] = 255;
                    } else {
                        data[i] = 0;
                        data[i + 1] = 0;
                        data[i + 2] = 0;
                    }
                    data[i + 3] = 255;
                }
            }

            // 第三步：对红色印章边缘做轻度平滑，减少锯齿感
            const tempData = new Uint8ClampedArray(data);
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    const idx = y * width + x;
                    if (redMask[idx] !== 1) continue;

                    // 检查是否是边缘像素（周围有非红色像素）
                    let isEdge = false;
                    for (let dy = -1; dy <= 1 && !isEdge; dy++) {
                        for (let dx = -1; dx <= 1 && !isEdge; dx++) {
                            if (dx === 0 && dy === 0) continue;
                            if (redMask[(y + dy) * width + (x + dx)] !== 1) {
                                isEdge = true;
                            }
                        }
                    }

                    if (isEdge) {
                        // 边缘像素：与白色背景做轻度混合，柔化边缘
                        const pixelIdx = idx * 4;
                        const alpha = 0.85;
                        data[pixelIdx] = Math.round(data[pixelIdx] * alpha + 255 * (1 - alpha));
                        data[pixelIdx + 1] = Math.round(data[pixelIdx + 1] * alpha + 255 * (1 - alpha));
                        data[pixelIdx + 2] = Math.round(data[pixelIdx + 2] * alpha + 255 * (1 - alpha));
                    }
                }
            }

            return { imageData, redMask };
        }

        function getBinaryArray(imageData) {
            const data = imageData.data;
            const width = imageData.width;
            const height = imageData.height;
            const binary = new Uint8Array(width * height);

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    binary[y * width + x] = data[idx] === 0 ? 1 : 0;
                }
            }

            return binary;
        }

        function erode(binary, width, height, kernelSize) {
            const result = new Uint8Array(width * height);
            const half = Math.floor(kernelSize / 2);

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let minVal = 1;
                    for (let ky = -half; ky <= half && minVal; ky++) {
                        for (let kx = -half; kx <= half && minVal; kx++) {
                            const px = x + kx;
                            const py = y + ky;
                            if (px < 0 || px >= width || py < 0 || py >= height) {
                                minVal = 0;
                            } else {
                                minVal = Math.min(minVal, binary[py * width + px]);
                            }
                        }
                    }
                    result[y * width + x] = minVal;
                }
            }

            return result;
        }

        function dilate(binary, width, height, kernelSize) {
            const result = new Uint8Array(width * height);
            const half = Math.floor(kernelSize / 2);

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let maxVal = 0;
                    for (let ky = -half; ky <= half && !maxVal; ky++) {
                        for (let kx = -half; kx <= half && !maxVal; kx++) {
                            const px = x + kx;
                            const py = y + ky;
                            if (px >= 0 && px < width && py >= 0 && py < height) {
                                maxVal = Math.max(maxVal, binary[py * width + px]);
                            }
                        }
                    }
                    result[y * width + x] = maxVal;
                }
            }

            return result;
        }

        function removeSmallComponents(binary, width, height, minArea) {
            const visited = new Uint8Array(width * height);
            const result = new Uint8Array(binary.length);
            const stack = [];

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = y * width + x;
                    if (binary[idx] && !visited[idx]) {
                        stack.length = 0;
                        stack.push(idx);
                        visited[idx] = 1;
                        const component = [];
                        component.push(idx);

                        while (stack.length > 0) {
                            const cur = stack.pop();
                            const cx = cur % width;
                            const cy = Math.floor(cur / width);

                            const neighbors = [
                                cur - width,
                                cur + width,
                                cx > 0 ? cur - 1 : -1,
                                cx < width - 1 ? cur + 1 : -1
                            ];

                            for (const n of neighbors) {
                                if (n >= 0 && n < width * height && !visited[n] && binary[n]) {
                                    visited[n] = 1;
                                    stack.push(n);
                                    component.push(n);
                                }
                            }
                        }

                        if (component.length >= minArea) {
                            for (const c of component) {
                                result[c] = 1;
                            }
                        }
                    }
                }
            }

            return result;
        }

        function denoiseImage(imageData, redMask) {
            const width = imageData.width;
            const height = imageData.height;
            const data = imageData.data;

            // 去噪策略：不做任何像素删除
            // 原因：
            // 1. PNG 无损压缩，黑白噪点不影响压缩率
            // 2. 150 DPI 已经提供足够分辨率，线条应该是完整的
            // 3. 任何去噪算法都可能误删细小线条
            
            // 保持原始二值化结果，不做任何修改
            return imageData;
        }

        function scaleToA4(imgWidth, imgHeight) {
            let newWidth = imgWidth;
            let newHeight = imgHeight;

            const ratio = imgWidth / imgHeight;
            const a4Ratio = A4_WIDTH_PX / A4_HEIGHT_PX;

            if (ratio > a4Ratio) {
                if (imgWidth > A4_WIDTH_PX) {
                    newWidth = A4_WIDTH_PX;
                    newHeight = Math.round(A4_WIDTH_PX / ratio);
                }
            } else {
                if (imgHeight > A4_HEIGHT_PX) {
                    newHeight = A4_HEIGHT_PX;
                    newWidth = Math.round(A4_HEIGHT_PX * ratio);
                }
            }

            return { width: newWidth, height: newHeight };
        }

        async function processImage(file, threshold) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        try {
                            updateProgress(30, '正在处理图片...');

                            const scaled = scaleToA4(img.width, img.height);

                            const canvas = document.createElement('canvas');
                            canvas.width = scaled.width;
                            canvas.height = scaled.height;
                            const ctx = canvas.getContext('2d');

                            ctx.fillStyle = 'white';
                            ctx.fillRect(0, 0, canvas.width, canvas.height);

                            ctx.drawImage(img, 0, 0, scaled.width, scaled.height);

                            updateProgress(50, '正在二值化处理...');

                            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                            const binarizeResult = binarizeImage(imageData, threshold);
                            imageData = binarizeResult.imageData;
                            const redMask = binarizeResult.redMask;

                            updateProgress(60, '正在清除噪点...');
                            denoiseImage(imageData, redMask);
                            ctx.putImageData(imageData, 0, 0);

                            updateProgress(75, '正在生成PDF...');

                            const pdf = new jsPDF({
                                orientation: 'portrait',
                                unit: 'mm',
                                format: 'a4',
                                compress: true
                            });

                            // PNG无损格式，确保像素级纯净（无灰色伪影）
                            const imgData = canvas.toDataURL('image/png');
                            const imgWidthMm = scaled.width * 25.4 / DPI;
                            const imgHeightMm = scaled.height * 25.4 / DPI;
                            const x = (A4_WIDTH_MM - imgWidthMm) / 2;
                            const y = (A4_HEIGHT_MM - imgHeightMm) / 2;

                            pdf.addImage(imgData, 'PNG', x, y, imgWidthMm, imgHeightMm);

                            const pdfBlob = pdf.output('blob');
                            resolve(pdfBlob);
                        } catch (err) {
                            reject(err);
                        }
                    };
                    img.onerror = () => reject(new Error('图片加载失败'));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error('文件读取失败'));
                reader.readAsDataURL(file);
            });
        }

        async function processPDF(file, threshold) {
            const arrayBuffer = await file.arrayBuffer();
            const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const numPages = pdfDoc.numPages;

            updateProgress(10, `共 ${numPages} 页，开始处理...`);

            const pdf = new jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: 'a4',
                compress: true
            });

            for (let pageNum = 1; pageNum <= numPages; pageNum++) {
                updateProgress(
                    Math.round(10 + (pageNum - 1) / numPages * 80),
                    `正在处理第 ${pageNum}/${numPages} 页...`
                );

                const page = await pdfDoc.getPage(pageNum);

                const scale = DPI / 72;
                const scaledViewport = page.getViewport({ scale: scale });

                const canvas = document.createElement('canvas');
                canvas.width = scaledViewport.width;
                canvas.height = scaledViewport.height;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                await page.render({
                    canvasContext: ctx,
                    viewport: scaledViewport
                }).promise;

                let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const binarizeResult = binarizeImage(imageData, threshold);
                imageData = binarizeResult.imageData;
                const redMask = binarizeResult.redMask;
                denoiseImage(imageData, redMask);
                ctx.putImageData(imageData, 0, 0);

                if (pageNum > 1) {
                    pdf.addPage();
                }

                // PNG无损格式，确保像素级纯净（无灰色伪影）
                const imgData = canvas.toDataURL('image/png');
                pdf.addImage(imgData, 'PNG', 0, 0, A4_WIDTH_MM, A4_HEIGHT_MM);

                await new Promise(resolve => setTimeout(resolve, 10));
            }

            updateProgress(95, '正在生成最终PDF...');

            const pdfBlob = pdf.output('blob');
            return pdfBlob;
        }

        compressBtn.addEventListener('click', async () => {
            if (!currentFile) return;

            const threshold = getThreshold();
            outputFileName = getOutputFileName();

            progressContainer.classList.add('show');
            downloadBtn.classList.remove('show');
            resultInfo.classList.remove('show');
            disableControls();

            try {
                updateProgress(5, '正在读取文件...');

                if (currentFile.type === 'application/pdf') {
                    compressedBlob = await processPDF(currentFile, threshold);
                } else {
                    compressedBlob = await processImage(currentFile, threshold);
                }

                updateProgress(100, '处理完成！');

                const originalSizeKB = currentFile.size;
                const compressedSizeKB = compressedBlob.size;
                const rate = ((1 - compressedSizeKB / originalSizeKB) * 100).toFixed(1);

                originalSize.textContent = formatFileSize(originalSizeKB);
                compressedSize.textContent = formatFileSize(compressedSizeKB);
                compressionRate.textContent = rate + '%';
                resultInfo.classList.add('show');

                downloadBtn.classList.add('show');
            } catch (err) {
                alert('处理失败：' + err.message);
                console.error(err);
            } finally {
                enableControls();
            }
        });

        downloadBtn.addEventListener('click', () => {
            if (!compressedBlob) return;

            const url = URL.createObjectURL(compressedBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = outputFileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
