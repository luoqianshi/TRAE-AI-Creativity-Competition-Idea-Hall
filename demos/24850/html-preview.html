<style>
  :root {

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {

    padding: 16px;
  }

  .container {
    width: 100%;
    max-width: 1400px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    height: calc(100vh - 32px);
  }

  /* Header */
  .header {
    text-align: center;
    padding: 8px 0 4px;
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), #f5a623);
    -webkit-background-clip: text;

  }

    color: var(--muted);

  /* Toolbar */
  .toolbar {

  }

  .btn {
    padding: 8px 18px;

    font-size: 0.9rem;

    transition: all 0.2s;
    font-family: var(--font-sans);

  }
  .btn:active { transform: scale(0.96); }

  .btn-primary {
    background: var(--accent);

  }
  .btn-primary:hover {
    background: #ff5252;
    box-shadow: 0 0 16px rgba(255,107,107,0.4);
  }

  .btn-secondary {
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--rule);
  }
  .btn-secondary:hover {
    background: #1a4a7a;
    border-color: var(--accent);
  }

  .btn-accent2 {
    background: var(--accent2);

  }

  .btn-danger {

  }
  .btn-danger:hover {
    background: #e94560;

  .btn-sm {

  .toolbar-spacer { flex: 1; }

  /* Main split view */

    display: flex;

  /* Editor Panel */
  .editor-panel {
    flex: 1;

    box-shadow: var(--shadow);
  }

  .editor-panel:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,107,107,0.12), var(--shadow);
  }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: rgba(0,0,0,0.3);
    border-bottom: 1px solid var(--rule);
    flex-shrink: 0;
  }
  .panel-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }
  .panel-dot.red { background: #ff5f56; }
  .panel-dot.yellow { background: #ffbd2e; }
  .panel-dot.green { background: #27ca40; }
  .panel-title {
    font-size: 0.8rem;
    color: var(--muted);
    margin-left: 6px;
  }

  .editor-inner {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  .line-numbers {
    padding: 12px 8px 12px 12px;
    text-align: right;
    user-select: none;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.6;
    color: var(--muted);
    background: rgba(0,0,0,0.2);
    border-right: 1px solid var(--rule);
    overflow: hidden;
    white-space: pre;
    min-width: 40px;
    flex-shrink: 0;
  }

  .code-area {
    flex: 1;
    position: relative;
    overflow: auto;
  }

  textarea#htmlInput {
    width: 100%;
    height: 100%;
    background: transparent;
    color: var(--ink);
    border: none;
    outline: none;
    resize: none;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.6;
    padding: 12px 14px 12px 10px;
    white-space: pre;
    tab-size: 2;
  }

  textarea#htmlInput::placeholder {
    color: #555;
    font-style: italic;
  }

  /* Preview Panel */
  .preview-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 14px;
    background: #e8e8e8;
    border-bottom: 1px solid #d0d0d0;
    flex-shrink: 0;
  }
  .preview-url {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 0.78rem;
    color: #666;
    border: 1px solid #d0d0d0;
    font-family: var(--font-mono);
  }
  .preview-url .lock-icon { color: #27ca40; font-size: 0.7rem; }

  .preview-body {
    flex: 1;
    background: #fff;
    position: relative;
    overflow: hidden;
  }

  iframe#previewFrame {
    width: 100%;
    height: 100%;
    border: none;
    background: #fff;
  }

  .preview-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #ccc;
    pointer-events: none;
  }
  .preview-placeholder .icon {
    font-size: 3rem;
    margin-bottom: 10px;
    opacity: 0.4;
  }
  .preview-placeholder .text {
    font-size: 0.9rem;
    opacity: 0.5;
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent2);
    color: #1a1a2e;
    padding: 10px 24px;
    border-radius: var(--radius);
    font-weight: 600;
    font-size: 0.9rem;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .toast.show {
    opacity: 1;
    pointer-events: auto;
  }

  /* Resizer handle */
  .resizer {
    width: 6px;
    cursor: col-resize;
    background: transparent;
    flex-shrink: 0;
    position: relative;
  }
  .resizer::after {
    content: '';
    position: absolute;
    inset: 20% 0;
    width: 2px;
    left: 2px;
    background: var(--rule);
    border-radius: 1px;
    transition: background 0.2s;
  }
  .resizer:hover::after {
    background: var(--accent);
  }

  /* Responsive: stack vertically on mobile */
  @media (max-width: 768px) {
    .container { height: auto; }
    .main-area {
      flex-direction: column;
      min-height: 800px;
    }
    .editor-panel { min-height: 350px; }
    .preview-panel { min-height: 400px; }
    .resizer { display: none; }
    .header h1 { font-size: 1.4rem; }
    .btn { padding: 6px 12px; font-size: 0.8rem; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>&lt;/&gt; HTML Preview</h1>
    <p class="subtitle">在线 HTML 代码预览工具 — 编写 HTML，即时查看渲染效果</p>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button class="btn btn-primary" onclick="runPreview()" title="运行/刷新预览">
      &#x25B6; 运行预览
    </button>
    <button class="btn btn-accent2 btn-sm" onclick="autoRunToggle()" id="autoRunBtn" title="切换自动运行">
      &#x2699; 自动运行：开
    </button>
    <span class="toolbar-spacer"></span>
    <button class="btn btn-secondary btn-sm" onclick="loadExample()" title="加载示例 HTML">
      &#x1F4CB; 加载示例
    </button>
    <button class="btn btn-secondary btn-sm" onclick="copyCode()" title="复制代码到剪贴板">
      &#x1F4CB; 复制
    </button>
    <button class="btn btn-danger btn-sm" onclick="clearAll()" title="清空所有内容">
      &#x2716; 清空
    </button>
  </div>

  <!-- Main Split View -->
  <div class="main-area">
    <!-- HTML Editor -->
    <div class="editor-panel" id="editorPanel">
      <div class="panel-header">
        <span class="panel-dot red"></span>
        <span class="panel-dot yellow"></span>
        <span class="panel-dot green"></span>
        <span class="panel-title">index.html</span>
      </div>
      <div class="editor-inner">
        <div class="line-numbers" id="lineNumbers">1</div>
        <div class="code-area">
          <textarea id="htmlInput" placeholder="&lt;!-- 在此编写 HTML 代码... --&gt;" spellcheck="false" oninput="updateLineNumbers(); if(autoRun) debouncePreview();" onkeydown="handleTab(event)" onscroll="syncScroll()"></textarea>
        </div>
      </div>
    </div>

    <!-- Resizer -->
    <div class="resizer" id="resizer"></div>

    <!-- Preview -->
    <div class="preview-panel" id="previewPanel">
      <div class="preview-header">
        <div class="preview-url">
          <span class="lock-icon">&#x1F512;</span>
          <span>preview</span>
        </div>
        <span style="font-size:0.75rem;color:#999;">预览区域</span>
      </div>
      <div class="preview-body">
        <div class="preview-placeholder" id="placeholder">
          <div class="icon">&#x1F4C4;</div>
          <div class="text">在左侧编辑 HTML 代码，然后点击"运行预览"查看效果</div>
        </div>
        <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin" style="display:none;"></iframe>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // --- Example HTML ---
  const EXAMPLE_HTML = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>示例页面</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    .card h1 {
      font-size: 1.8rem;
      color: #333;
      margin-bottom: 8px;
    }
    .card .badge {
      display: inline-block;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-bottom: 20px;
    }
    .card p {
      color: #666;
      line-height: 1.7;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }
    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
    }
    .tag {
      background: #f0f0ff;
      color: #667eea;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
    }
    .btn-cta {
      display: inline-block;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      padding: 12px 32px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      border: none;
    }
    .btn-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102,126,234,0.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>&#x1F389; HTML Preview 工具</h1>
    <span class="badge">v1.0.0</span>
    <p>
      这是一个<strong>示例页面</strong>，展示了 HTML Preview 工具的实时预览能力。
      您可以在左侧编辑器中修改 HTML 代码，点击"运行预览"查看效果。
    </p>
    <div class="features">
      <span class="tag">实时预览</span>
      <span class="tag">代码高亮</span>
      <span class="tag">自动运行</span>
      <span class="tag">响应式设计</span>
    </div>
    <button class="btn-cta" onclick="alert('Hello World! &#x1F44B;')">
      &#x1F44B; 点击我试试
    </button>
  </div>
</body>
</html>`;

  const textarea = document.getElementById('htmlInput');
  const lineNumbers = document.getElementById('lineNumbers');
  const previewFrame = document.getElementById('previewFrame');
  const placeholder = document.getElementById('placeholder');
  let autoRun = true;
  let debounceTimer = null;

  // --- Load example on page load ---
  window.addEventListener('DOMContentLoaded', () => {
    textarea.value = EXAMPLE_HTML;
    updateLineNumbers();
    runPreview();
    // Init resizer
    initResizer();
  });

  // --- Resizer ---
  function initResizer() {
    const resizer = document.getElementById('resizer');
    const editorPanel = document.getElementById('editorPanel');
    const previewPanel = document.getElementById('previewPanel');
    let startX, startEditorWidth;

    resizer.addEventListener('mousedown', (e) => {
      e.preventDefault();
      startX = e.clientX;
      startEditorWidth = editorPanel.getBoundingClientRect().width;
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';

      function onMouseMove(e) {
        const dx = e.clientX - startX;
        const mainArea = document.querySelector('.main-area');
        const totalWidth = mainArea.getBoundingClientRect().width - 6; // resizer width
        const newEditorWidth = startEditorWidth + dx;
        const percent = (newEditorWidth / totalWidth) * 100;
        if (percent > 20 && percent < 80) {
          editorPanel.style.flex = '0 0 ' + percent + '%';
          previewPanel.style.flex = '1';
        }
      }

      function onMouseUp() {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      }

      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    });
  }

  // --- Update line numbers ---
  function updateLineNumbers() {
    const lines = textarea.value.split('\n');
    const count = lines.length;
    let html = '';
    for (let i = 1; i <= count; i++) {
      html += i + '\n';
    }
    lineNumbers.innerHTML = html || '1';
  }

  // --- Sync scroll ---
  function syncScroll() {
    lineNumbers.scrollTop = textarea.scrollTop;
  }

  // --- Handle Tab key ---
  function handleTab(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      textarea.value = textarea.value.substring(0, start) + '  ' + textarea.value.substring(end);
      textarea.selectionStart = textarea.selectionEnd = start + 2;
      updateLineNumbers();
    }
  }

  // --- Run Preview ---
  function runPreview() {
    const code = textarea.value.trim();
    if (!code) {
      previewFrame.style.display = 'none';
      placeholder.style.display = 'flex';
      return;
    }

    placeholder.style.display = 'none';
    previewFrame.style.display = 'block';

    const blob = new Blob([code], { type: 'text/html' });
    const url = URL.createObjectURL(blob);

    // Revoke old URL
    if (previewFrame._blobUrl) {
      URL.revokeObjectURL(previewFrame._blobUrl);
    }

    previewFrame._blobUrl = url;
    previewFrame.src = url;

    showToast('预览已刷新');
  }

  // --- Debounce preview for auto-run ---
  function debouncePreview() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      runPreview();
    }, 600);
  }

  // --- Toggle auto-run ---
  function autoRunToggle() {
    autoRun = !autoRun;
    const btn = document.getElementById('autoRunBtn');
    if (autoRun) {
      btn.innerHTML = '&#x2699; 自动运行：开';
      btn.className = 'btn btn-accent2 btn-sm';
      // Run once immediately
      debouncePreview();
    } else {
      btn.innerHTML = '&#x2699; 自动运行：关';
      btn.className = 'btn btn-secondary btn-sm';
    }
    showToast(autoRun ? '自动运行已开启' : '自动运行已关闭');
  }

  // --- Load example ---
  function loadExample() {
    textarea.value = EXAMPLE_HTML;
    updateLineNumbers();
    runPreview();
    showToast('示例 HTML 已加载');
  }

  // --- Copy code ---
  function copyCode() {
    const raw = textarea.value;
    if (!raw) { showToast('没有可复制的内容'); return; }
    navigator.clipboard.writeText(raw).then(() => {
      showToast('代码已复制到剪贴板');
    }).catch(() => {
      textarea.select();
      document.execCommand('copy');
      showToast('代码已复制到剪贴板');
    });
  }

  // --- Clear ---
  function clearAll() {
    textarea.value = '';
    updateLineNumbers();
    placeholder.style.display = 'flex';
    previewFrame.style.display = 'none';
    showToast('已清空');
  }

  // --- Toast ---
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  // --- Keyboard shortcuts ---
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      runPreview();
    }
  });
</script>

</body>
</html>
