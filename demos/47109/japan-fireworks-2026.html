<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Japan National Fireworks Festival Information Platform</title>
<!-- Leaflet.js -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ========== 基础样式 & CSS变量 ========== */
:root {
  --bg-primary: #0a1628;
  --bg-secondary: #1a0a2e;
  --bg-card: rgba(255, 255, 255, 0.06);
  --bg-card-hover: rgba(255, 255, 255, 0.12);
  --accent-coral: #FF6B35;
  --accent-orange: #FF8C42;
  --accent-gold: #FFD700;
  --accent-pink: #FF69B4;
  --text-primary: #f0f0f0;
  --text-secondary: #b0b8c8;
  --text-muted: #6b7a94;
  --border-color: rgba(255, 255, 255, 0.1);
  --glass-bg: rgba(20, 10, 40, 0.7);
  --glass-border: rgba(255, 255, 255, 0.15);
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  --radius: 16px;
  --radius-sm: 8px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --font-main: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  /* 区域颜色 */
  --region-hokkaido: #00BFFF;
  --region-tohoku: #7B68EE;
  --region-kanto: #FF6B35;
  --region-chubu: #32CD32;
  --region-kinki: #FFD700;
  --region-chugoku: #FF69B4;
  --region-shikoku: #00CED1;
  --region-kyushu: #FF4500;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: var(--font-main);
  background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, #0d1b3e 100%);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
  overflow-x: hidden;
}

/* ========== 自定义滚动条 ========== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
::-webkit-scrollbar-thumb {
  background: rgba(255, 107, 53, 0.4);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover { background: rgba(255, 107, 53, 0.6); }

/* ========== 头部 ========== */
.header {
  position: relative;
  padding: 24px 20px 16px;
  text-align: center;
  overflow: hidden;
  background: linear-gradient(180deg, rgba(255, 107, 53, 0.08) 0%, transparent 100%);
}

.header-fireworks {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

.header h1 {
  position: relative;
  z-index: 1;
  font-size: 2rem;
  font-weight: 700;
  background: linear-gradient(90deg, var(--accent-coral), var(--accent-gold), var(--accent-pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
  letter-spacing: 2px;
}

.header .subtitle {
  position: relative;
  z-index: 1;
  color: var(--text-secondary);
  font-size: 0.9rem;
  font-weight: 300;
}

/* ========== 语言切换 ========== */
.lang-switch {
  position: absolute;
  top: 16px;
  right: 20px;
  z-index: 2;
}

.lang-switch select {
  background: var(--glass-bg);
  color: var(--text-primary);
  border: 1px solid var(--glass-border);
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  font-family: var(--font-main);
  font-size: 0.85rem;
  cursor: pointer;
  outline: none;
  backdrop-filter: blur(10px);
  transition: var(--transition);
}

.lang-switch select:hover {
  border-color: var(--accent-coral);
}

.lang-switch select option {
  background: #1a1a2e;
  color: var(--text-primary);
}

/* ========== 主容器 ========== */
.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 16px 40px;
}

/* ========== 统计面板 ========== */
.stats-panel {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}

.stat-card {
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 20px;
  transition: var(--transition);
}

.stat-card:hover {
  background: var(--bg-card-hover);
  transform: translateY(-2px);
}

.stat-card h3 {
  font-size: 0.8rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.stat-card .stat-number {
  font-size: 2rem;
  font-weight: 700;
  color: var(--accent-coral);
  margin-bottom: 4px;
}

.stat-card .stat-label {
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.chart-container {
  margin-top: 12px;
  overflow-x: auto;
}

.chart-container svg {
  width: 100%;
  height: auto;
  min-height: 180px;
}

/* ========== 筛选面板 ========== */
.filter-panel {
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 20px;
  transition: var(--transition);
}

.filter-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
}

.filter-toggle h2 {
  font-size: 1rem;
  font-weight: 500;
  color: var(--text-primary);
}

.filter-toggle-icon {
  font-size: 1.2rem;
  color: var(--text-secondary);
  transition: transform 0.3s ease;
}

.filter-toggle-icon.open {
  transform: rotate(180deg);
}

.filter-body {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-top: 16px;
}

.filter-group label {
  display: block;
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.filter-group input[type="date"],
.filter-group input[type="text"] {
  width: 100%;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  font-family: var(--font-main);
  font-size: 0.9rem;
  outline: none;
  transition: var(--transition);
}

.filter-group input:focus {
  border-color: var(--accent-coral);
  box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.15);
}

.filter-group input[type="date"]::-webkit-calendar-picker-indicator {
  filter: invert(0.7);
  cursor: pointer;
}

.region-checkboxes {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  max-height: 200px;
  overflow-y: auto;
  padding-right: 4px;
}

.region-checkboxes label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.82rem;
  color: var(--text-secondary);
  cursor: pointer;
  padding: 4px 10px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid transparent;
  transition: var(--transition);
  text-transform: none;
  letter-spacing: 0;
  margin-bottom: 0;
}

.region-checkboxes label:hover {
  background: rgba(255, 255, 255, 0.08);
}

.region-checkboxes input[type="checkbox"] {
  accent-color: var(--accent-coral);
  cursor: pointer;
}

.region-checkboxes input[type="checkbox"]:checked + span {
  font-weight: 500;
}

.filter-actions {
  display: flex;
  gap: 10px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.btn {
  padding: 8px 20px;
  border-radius: var(--radius-sm);
  font-family: var(--font-main);
  font-size: 0.85rem;
  cursor: pointer;
  border: none;
  transition: var(--transition);
  font-weight: 500;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent-coral), var(--accent-orange));
  color: white;
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.12);
  color: var(--text-primary);
}

/* ========== 标签页切换 ========== */
.tab-bar {
  display: flex;
  gap: 4px;
  margin-bottom: 20px;
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 4px;
  border: 1px solid var(--glass-border);
  width: fit-content;
}

.tab-btn {
  padding: 10px 24px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-family: var(--font-main);
  font-size: 0.9rem;
  cursor: pointer;
  border-radius: 12px;
  transition: var(--transition);
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
}

.tab-btn.active {
  background: linear-gradient(135deg, var(--accent-coral), var(--accent-orange));
  color: white;
  box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
}

.tab-btn:not(.active):hover {
  background: rgba(255, 255, 255, 0.06);
  color: var(--text-primary);
}

/* ========== 地图视图 ========== */
.map-view {
  display: none;
  animation: fadeIn 0.4s ease;
}

.map-view.active {
  display: block;
}

#map {
  width: 100%;
  height: 600px;
  border-radius: var(--radius);
  border: 1px solid var(--glass-border);
  overflow: hidden;
  z-index: 1;
}

/* Leaflet弹窗自定义样式 */
.leaflet-popup-content-wrapper {
  background: rgba(20, 10, 40, 0.92) !important;
  color: var(--text-primary) !important;
  border-radius: 12px !important;
  border: 1px solid var(--glass-border) !important;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5) !important;
  backdrop-filter: blur(20px);
  padding: 0 !important;
}

.leaflet-popup-content {
  margin: 0 !important;
  min-width: 260px !important;
  font-family: var(--font-main) !important;
}

.leaflet-popup-tip {
  background: rgba(20, 10, 40, 0.92) !important;
  border: 1px solid var(--glass-border) !important;
}

.leaflet-popup-close-button {
  color: var(--text-secondary) !important;
  font-size: 20px !important;
  padding: 6px 10px 0 0 !important;
}

.popup-card {
  padding: 16px;
}

.popup-card h3 {
  font-size: 1rem;
  font-weight: 600;
  color: var(--accent-orange);
  margin-bottom: 8px;
  line-height: 1.4;
}

.popup-card .popup-meta {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.82rem;
  color: var(--text-secondary);
}

.popup-card .popup-meta span {
  display: flex;
  align-items: center;
  gap: 4px;
}

.popup-card .popup-link {
  display: inline-block;
  margin-top: 8px;
  padding: 4px 12px;
  background: linear-gradient(135deg, var(--accent-coral), var(--accent-orange));
  color: white;
  text-decoration: none;
  border-radius: 6px;
  font-size: 0.8rem;
  transition: var(--transition);
}

.popup-card .popup-link:hover {
  transform: scale(1.05);
}

/* ========== 列表视图 ========== */
.list-view {
  display: none;
  animation: fadeIn 0.4s ease;
}

.list-view.active {
  display: block;
}

.list-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 10px;
}

.list-controls .count-info {
  font-size: 0.85rem;
  color: var(--text-muted);
}

.sort-select {
  background: var(--glass-bg);
  color: var(--text-primary);
  border: 1px solid var(--glass-border);
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  font-family: var(--font-main);
  font-size: 0.85rem;
  cursor: pointer;
  outline: none;
  backdrop-filter: blur(10px);
}

.sort-select option {
  background: #1a1a2e;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}

.festival-card {
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}

.festival-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  border-radius: 4px 0 0 4px;
}

.festival-card:hover {
  background: var(--bg-card-hover);
  transform: translateY(-3px);
  box-shadow: var(--shadow);
}

.festival-card .card-date {
  font-size: 0.78rem;
  color: var(--accent-orange);
  font-weight: 600;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

.festival-card .card-name {
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
  line-height: 1.4;
}

.festival-card .card-name-cn {
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 10px;
}

.festival-card .card-location {
  font-size: 0.82rem;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 4px;
}

.festival-card .card-info-row {
  display: flex;
  gap: 16px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.festival-card .card-info-item {
  font-size: 0.8rem;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 4px;
}

.festival-card .card-info-item .icon {
  color: var(--accent-coral);
}

.festival-card .card-details {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease, padding 0.4s ease;
  margin-top: 0;
}

.festival-card.expanded .card-details {
  max-height: 400px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border-color);
}

.festival-card .detail-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.82rem;
  padding: 3px 0;
}

.festival-card .detail-row .label {
  color: var(--text-muted);
}

.festival-card .detail-row .value {
  color: var(--text-secondary);
  text-align: right;
}

.festival-card .card-link {
  display: inline-block;
  margin-top: 10px;
  padding: 6px 16px;
  background: linear-gradient(135deg, var(--accent-coral), var(--accent-orange));
  color: white;
  text-decoration: none;
  border-radius: 6px;
  font-size: 0.8rem;
  transition: var(--transition);
}

.festival-card .card-link:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
}

/* ========== 图例 ========== */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
  padding: 12px 16px;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.78rem;
  color: var(--text-secondary);
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ========== 动画 ========== */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes sparkle {
  0%, 100% { opacity: 0.3; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.2); }
}

@keyframes fireworkBurst {
  0% { opacity: 1; r: 2; }
  100% { opacity: 0; r: 12; }
}

.sparkle-dot {
  animation: sparkle 2s ease-in-out infinite;
}

/* ========== 响应式 ========== */
@media (max-width: 768px) {
  .header h1 { font-size: 1.4rem; }
  .header .subtitle { font-size: 0.78rem; }
  .lang-switch { top: 10px; right: 10px; }
  .lang-switch select { padding: 4px 8px; font-size: 0.75rem; }
  #map { height: 400px; }
  .card-grid { grid-template-columns: 1fr; }
  .filter-body { grid-template-columns: 1fr; }
  .stats-panel { grid-template-columns: 1fr; }
  .tab-bar { width: 100%; }
  .tab-btn { flex: 1; justify-content: center; padding: 8px 12px; font-size: 0.82rem; }
  .container { padding: 0 10px 30px; }
}

@media (max-width: 480px) {
  .header { padding: 16px 10px 12px; }
  .header h1 { font-size: 1.2rem; }
  .festival-card { padding: 14px; }
}

/* ========== 页脚 ========== */
.footer {
  text-align: center;
  padding: 20px;
  color: var(--text-muted);
  font-size: 0.75rem;
  border-top: 1px solid var(--border-color);
  margin-top: 40px;
}

/* ========== 隐藏辅助 ========== */
.hidden { display: none !important; }
</style>
</head>

  </g>
  <!-- 中间小烟花 -->
  <g class="sparkle-dot" style="animation-delay:1.5s">
    <circle cx="400" cy="25" r="1.5" fill="#FF69B4"/>
    <line x1="400" y1="25" x2="390" y2="12" stroke="#FF69B4" stroke-width="0.6" opacity="0.5"/>
    <line x1="400" y1="25" x2="410" y2="10" stroke="#FF69B4" stroke-width="0.6" opacity="0.5"/>
    <line x1="400" y1="25" x2="388" y2="35" stroke="#FFD700" stroke-width="0.6" opacity="0.5"/>

// ========== 全局状态 ==========
let currentLang = "zh-CN";
let filteredData = [...festivalData];
let map = null;
let markers = [];
let activeTab = "map";

// ========== 初始化 ==========
document.addEventListener("DOMContentLoaded", function() {
  initMap();
  buildRegionCheckboxes();
  buildLegend();
  applyFilters();
});

// ========== 地图初始化 ==========
function initMap() {
  map = L.map("map", {
    center: [36.0, 138.0],
    zoom: 5,
    zoomControl: true,
    scrollWheelZoom: true
  });
  // 使用OpenStreetMap免费瓦片
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a>',
    maxZoom: 18
  }).addTo(map);
  updateMapMarkers();
}

// ========== 更新地图标记 ==========
function updateMapMarkers() {
  // 清除旧标记
  markers.forEach(function(m) { map.removeLayer(m); });
  markers = [];

  var lang = i18n[currentLang];

  filteredData.forEach(function(f) {
    var color = regionConfig[f.region] ? regionConfig[f.region].color : "#FF6B35";
    var marker = L.circleMarker([f.lat, f.lng], {
      radius: 8,
      fillColor: color,
      color: color,
      weight: 2,
      opacity: 0.9,
      fillOpacity: 0.6
    }).addTo(map);

    // 构建弹窗内容
    var popupHtml = '<div class="popup-card">';
    popupHtml += '<h3>' + escapeHtml(f.name) + '</h3>';
    popupHtml += '<div class="popup-meta">';
    popupHtml += '<span>&#128197; ' + f.date + ' ' + f.timeRange + '</span>';
    popupHtml += '<span>&#128205; ' + escapeHtml(f.prefecture) + ' ' + escapeHtml(f.city) + '</span>';
    popupHtml += '<span>&#127912; ' + escapeHtml(f.venue) + '</span>';
    popupHtml += '<span>&#127879; ' + escapeHtml(f.estimatedShells) + '</span>';
    popupHtml += '<span>&#128101; ' + escapeHtml(f.estimatedAudience) + '</span>';
    if (f.url) {
      popupHtml += '</div><a class="popup-link" href="' + escapeHtml(f.url) + '" target="_blank" rel="noopener">' + lang.popupWebsite + ' &#8599;</a>';
    } else {
      popupHtml += '</div>';
    }
    popupHtml += '</div>';

    marker.bindPopup(popupHtml, { maxWidth: 300 });
    markers.push(marker);
  });
}

// ========== 构建地区复选框 ==========
function buildRegionCheckboxes() {
  var container = document.getElementById("regionCheckboxes");
  var lang = i18n[currentLang];
  var html = '<label><input type="checkbox" class="region-cb" value="all" onchange="toggleAllRegions(this.checked)"><span>' + lang.selectAll + '</span></label>';
  Object.keys(regionConfig).forEach(function(key) {
    html += '<label><input type="checkbox" class="region-cb" value="' + key + '" checked><span>' + lang.regionNames[key] + '</span></label>';
  });
  container.innerHTML = html;
}

// ========== 全选/取消全选 ==========
function toggleAllRegions(checked) {
  document.querySelectorAll(".region-cb:not([value='all'])").forEach(function(cb) {
    cb.checked = checked;
  });
}

// ========== 构建图例 ==========
function buildLegend() {
  var container = document.getElementById("legend");
  var lang = i18n[currentLang];
  var html = '';
  Object.keys(regionConfig).forEach(function(key) {
    html += '<div class="legend-item">';
    html += '<div class="legend-dot" style="background:' + regionConfig[key].color + '"></div>';
    html += '<span>' + lang.regionNames[key] + '</span>';
    html += '</div>';
  });
  container.innerHTML = html;
}

// ========== 筛选面板折叠 ==========
function toggleFilter() {
  var body = document.getElementById("filterBody");
  var icon = document.getElementById("filterIcon");
  if (body.style.display === "none") {
    body.style.display = "grid";
    icon.classList.add("open");
  } else {
    body.style.display = "none";
    icon.classList.remove("open");
  }
}

// ========== 应用筛选 ==========
function applyFilters() {
  var dateStart = document.getElementById("dateStart").value;
  var dateEnd = document.getElementById("dateEnd").value;
  var keyword = document.getElementById("keywordInput").value.trim().toLowerCase();

  // 获取选中的地区
  var selectedRegions = [];
  document.querySelectorAll(".region-cb:not([value='all']):checked").forEach(function(cb) {
    selectedRegions.push(cb.value);
  });

  filteredData = festivalData.filter(function(f) {
    // 日期范围筛选
    if (dateStart && f.date < dateStart) return false;
    if (dateEnd && f.date > dateEnd) return false;
    // 地区筛选
    if (selectedRegions.length > 0 && selectedRegions.indexOf(f.region) === -1) return false;
    // 关键词筛选（搜索日文名称）
    if (keyword && f.name.toLowerCase().indexOf(keyword) === -1) return false;
    return true;
  });

  updateStats();
  updateMapMarkers();
  renderList();
}

// ========== 重置筛选 ==========
function resetFilters() {
  document.getElementById("dateStart").value = "2026-01-01";
  document.getElementById("dateEnd").value = "2026-12-31";
  document.getElementById("keywordInput").value = "";
  document.querySelectorAll(".region-cb:not([value='all'])").forEach(function(cb) {
    cb.checked = true;
  });
  var allCb = document.querySelector(".region-cb[value='all']");
  if (allCb) allCb.checked = true;
  applyFilters();
}

// ========== 更新统计 ==========
function updateStats() {
  var lang = i18n[currentLang];

  // 总数
  document.getElementById("statCount").textContent = filteredData.length;

  // 按地区统计
  var regionCounts = {};
  Object.keys(regionConfig).forEach(function(k) { regionCounts[k] = 0; });
  filteredData.forEach(function(f) {
    if (regionCounts[f.region] !== undefined) regionCounts[f.region]++;
  });
  renderRegionChart(regionCounts);

  // 按月份统计
  var monthCounts = {};
  for (var i = 0; i < 12; i++) monthCounts[i] = 0;
  filteredData.forEach(function(f) {
    var m = parseInt(f.date.split("-")[1], 10) - 1;
    monthCounts[m]++;
  });
  renderMonthChart(monthCounts);
}

// ========== 渲染地区柱状图（纯SVG） ==========
function renderRegionChart(counts) {
  var lang = i18n[currentLang];
  var container = document.getElementById("regionChart");
  var data = Object.keys(counts).map(function(k) {
    return { key: k, value: counts[k], name: lang.regionNames[k], color: regionConfig[k].color };
  });
  var maxVal = Math.max.apply(null, data.map(function(d) { return d.value; })) || 1;

  var barHeight = 24;
  var barGap = 8;
  var labelWidth = 80;
  var chartWidth = 220;
  var svgHeight = data.length * (barHeight + barGap) + 10;
  var svgWidth = labelWidth + chartWidth + 40;

  var svg = '<svg width="100%" viewBox="0 0 ' + svgWidth + ' ' + svgHeight + '" xmlns="http://www.w3.org/2000/svg">';
  data.forEach(function(d, i) {
    var y = i * (barHeight + barGap);
    var w = Math.max((d.value / maxVal) * chartWidth, d.value > 0 ? 4 : 0);
    // 标签
    svg += '<text x="' + (labelWidth - 6) + '" y="' + (y + barHeight / 2 + 4) + '" text-anchor="end" fill="' + d.color + '" font-size="11" font-family="Noto Sans JP, sans-serif">' + d.name + '</text>';
    // 背景条
    svg += '<rect x="' + labelWidth + '" y="' + y + '" width="' + chartWidth + '" height="' + barHeight + '" rx="4" fill="rgba(255,255,255,0.05)"/>';
    // 数据条
    svg += '<rect x="' + labelWidth + '" y="' + y + '" width="' + w + '" height="' + barHeight + '" rx="4" fill="' + d.color + '" opacity="0.8"/>';
    // 数值
    svg += '<text x="' + (labelWidth + w + 6) + '" y="' + (y + barHeight / 2 + 4) + '" fill="#b0b8c8" font-size="11" font-family="Noto Sans JP, sans-serif">' + d.value + '</text>';
  });
  svg += '</svg>';
  container.innerHTML = svg;
}

// ========== 渲染月份柱状图（纯SVG） ==========
function renderMonthChart(counts) {
  var lang = i18n[currentLang];
  var container = document.getElementById("monthChart");

  // 只显示有数据的月份
  var activeMonths = [];
  for (var i = 0; i < 12; i++) {
    if (counts[i] > 0) activeMonths.push({ month: i, count: counts[i], name: lang.monthNames[i] });
  }
  if (activeMonths.length === 0) {
    container.innerHTML = '<svg width="100%" viewBox="0 0 300 40" xmlns="http://www.w3.org/2000/svg"><text x="150" y="20" text-anchor="middle" fill="#6b7a94" font-size="12" font-family="Noto Sans JP, sans-serif">No data</text></svg>';
    return;
  }

  var maxVal = Math.max.apply(null, activeMonths.map(function(d) { return d.count; })) || 1;
  var barWidth = Math.max(Math.floor(220 / activeMonths.length) - 6, 20);
  var chartHeight = 120;
  var labelHeight = 20;
  var svgHeight = chartHeight + labelHeight + 10;
  var svgWidth = activeMonths.length * (barWidth + 6) + 40;

  var svg = '<svg width="100%" viewBox="0 0 ' + Math.max(svgWidth, 300) + ' ' + svgHeight + '" xmlns="http://www.w3.org/2000/svg">';
  activeMonths.forEach(function(d, i) {
    var x = 20 + i * (barWidth + 6);
    var barH = Math.max((d.count / maxVal) * (chartHeight - 10), d.count > 0 ? 4 : 0);
    var y = chartHeight - barH;
    // 柱
    svg += '<rect x="' + x + '" y="' + y + '" width="' + barWidth + '" height="' + barH + '" rx="4" fill="' + (i % 2 === 0 ? "#FF6B35" : "#FF8C42") + '" opacity="0.8"/>';
    // 数值
    svg += '<text x="' + (x + barWidth / 2) + '" y="' + (y - 4) + '" text-anchor="middle" fill="#b0b8c8" font-size="11" font-family="Noto Sans JP, sans-serif">' + d.count + '</text>';
    // 月份标签
    svg += '<text x="' + (x + barWidth / 2) + '" y="' + (chartHeight + 14) + '" text-anchor="middle" fill="#6b7a94" font-size="10" font-family="Noto Sans JP, sans-serif">' + d.name + '</text>';
  });
  svg += '</svg>';
  container.innerHTML = svg;
}

// ========== 标签页切换 ==========
function switchTab(tab, btn) {
  activeTab = tab;
  document.querySelectorAll(".tab-btn").forEach(function(b) { b.classList.remove("active"); });
  btn.classList.add("active");

  var mapView = document.getElementById("mapView");
  var listView = document.getElementById("listView");

  if (tab === "map") {
    mapView.classList.add("active");
    listView.classList.remove("active");
    // 重新调整地图大小
    setTimeout(function() { map.invalidateSize(); }, 100);
  } else {
    mapView.classList.remove("active");
    listView.classList.add("active");
  }
}

// ========== 列表渲染 ==========
function renderList() {
  var lang = i18n[currentLang];
  var sortVal = document.getElementById("sortSelect").value;
  var sorted = filteredData.slice();

  // 排序
  switch (sortVal) {
    case "date-asc":
      sorted.sort(function(a, b) { return a.date.localeCompare(b.date); });
      break;
    case "date-desc":
      sorted.sort(function(a, b) { return b.date.localeCompare(a.date); });
      break;
    case "region":
      sorted.sort(function(a, b) { return a.region.localeCompare(b.region) || a.date.localeCompare(b.date); });
      break;
    case "name":
      sorted.sort(function(a, b) { return a.name.localeCompare(b.name); });
      break;
  }

  // 更新计数
  var countText = lang.countInfo.replace("{count}", sorted.length);
  document.getElementById("listCount").textContent = countText;

  // 渲染卡片
  var grid = document.getElementById("cardGrid");
  if (sorted.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-muted);">No matching festivals found.</div>';
    return;
  }

  var html = '';
  sorted.forEach(function(f) {
    var color = regionConfig[f.region] ? regionConfig[f.region].color : "#FF6B35";
    html += '<div class="festival-card" onclick="toggleCard(this)" style="border-left-color:' + color + '">';
    html += '<div style="position:absolute;top:0;left:0;width:4px;height:100%;background:' + color + ';border-radius:4px 0 0 4px;"></div>';
    html += '<div class="card-date">' + f.date + '</div>';
    html += '<div class="card-name">' + escapeHtml(f.name) + '</div>';
    html += '<div class="card-location">&#128205; ' + escapeHtml(f.prefecture) + ' ' + escapeHtml(f.city) + '</div>';
    html += '<div class="card-info-row">';
    html += '<div class="card-info-item"><span class="icon">&#9201;</span> ' + escapeHtml(f.timeRange) + '</div>';
    html += '<div class="card-info-item"><span class="icon">&#127879;</span> ' + escapeHtml(f.estimatedShells) + '</div>';
    html += '</div>';
    // 展开详情
    html += '<div class="card-details">';
    html += '<div class="detail-row"><span class="label">' + lang.cardVenue + '</span><span class="value">' + escapeHtml(f.venue) + '</span></div>';
    html += '<div class="detail-row"><span class="label">' + lang.cardAudience + '</span><span class="value">' + escapeHtml(f.estimatedAudience) + '</span></div>';
    html += '<div class="detail-row"><span class="label">GPS</span><span class="value">' + f.lat.toFixed(4) + ', ' + f.lng.toFixed(4) + '</span></div>';
    if (f.url) {
      html += '<a class="card-link" href="' + escapeHtml(f.url) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' + lang.popupWebsite + ' &#8599;</a>';
    }
    html += '</div>';
    html += '</div>';
  });
  grid.innerHTML = html;
}

// ========== 卡片展开/折叠 ==========
function toggleCard(card) {
  // 关闭其他已展开的卡片
  document.querySelectorAll(".festival-card.expanded").forEach(function(c) {
    if (c !== card) c.classList.remove("expanded");
  });
  card.classList.toggle("expanded");
}

// ========== 语言切换 ==========
function switchLanguage(lang) {
  currentLang = lang;
  var dict = i18n[lang];

  // 更新页面标题和副标题
  document.getElementById("pageTitle").textContent = dict.pageTitle;
  document.getElementById("pageSubtitle").textContent = dict.pageSubtitle;

  // 更新所有 data-i18n 元素
  document.querySelectorAll("[data-i18n]").forEach(function(el) {
    var key = el.getAttribute("data-i18n");
    if (dict[key]) el.textContent = dict[key];
  });

  // 更新 placeholder
  document.querySelectorAll("[data-placeholder-i18n]").forEach(function(el) {
    var key = el.getAttribute("data-placeholder-i18n");
    if (dict[key]) el.placeholder = dict[key];
  });

  // 更新排序选项
  document.querySelectorAll("[data-i18n-opt]").forEach(function(el) {
    var key = el.getAttribute("data-i18n-opt");
    if (dict[key]) el.textContent = dict[key];
  });

  // 更新HTML lang属性
  document.documentElement.lang = lang === "zh-CN" ? "zh-CN" : lang === "zh-TW" ? "zh-TW" : lang === "ja" ? "ja" : "en";

  // 重建地区复选框（保留选中状态）
  var prevState = {};
  document.querySelectorAll(".region-cb:not([value='all'])").forEach(function(cb) {
    prevState[cb.value] = cb.checked;
  });
  buildRegionCheckboxes();
  // 恢复选中状态
  document.querySelectorAll(".region-cb:not([value='all'])").forEach(function(cb) {
    if (prevState[cb.value] !== undefined) cb.checked = prevState[cb.value];
  });

  // 重建图例
  buildLegend();

  // 重新渲染统计图表和列表
  updateStats();
  renderList();
  updateMapMarkers();
}

// ========== HTML转义 ==========
function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
