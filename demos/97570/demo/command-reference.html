<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命令速查表 - Linux 萌新救星工具箱 v3.0</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="commands">
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">🐧</div>
                <div>
                    <div class="sidebar-title">救星工具箱</div>
                    <div class="sidebar-subtitle">v3.0 正式版</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">主要功能</div>
                    <a href="index.html" class="nav-item"><span class="nav-item-icon">🏠</span><span>首页仪表盘</span></a>
                    <a href="emergency-repair.html" class="nav-item"><span class="nav-item-icon">🚨</span><span>紧急修复</span></a>
                    <a href="terminal.html" class="nav-item"><span class="nav-item-icon">💻</span><span>终端模拟器</span></a>
                    <a href="system-cleanup.html" class="nav-item"><span class="nav-item-icon">🧹</span><span>系统清理</span></a>
                    <a href="disk-analyzer.html" class="nav-item"><span class="nav-item-icon">📊</span><span>磁盘分析器</span></a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">扩展工具</div>
                    <a href="gnome-extensions.html" class="nav-item"><span class="nav-item-icon">🧩</span><span>GNOME扩展</span></a>
                    <a href="diagnostic-report.html" class="nav-item"><span class="nav-item-icon">🩺</span><span>诊断报告</span></a>
                    <a href="backup-restore.html" class="nav-item"><span class="nav-item-icon">💾</span><span>备份恢复</span></a>
                    <a href="alias-config.html" class="nav-item"><span class="nav-item-icon">⌨️</span><span>别名配置</span></a>
                    <a href="command-reference.html" class="nav-item"><span class="nav-item-icon">📖</span><span>命令速查表</span></a>
                    <a href="dual-boot.html" class="nav-item"><span class="nav-item-icon">🪟</span><span>双系统工具箱</span></a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">系统设置</div>
                    <a href="settings.html" class="nav-item"><span class="nav-item-icon">⚙️</span><span>设置</span></a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-footer-item"><span>💡</span><span>提示：点击命令查看详情</span></div>
            </div>
        </aside>
        
        <main class="main-content">
            <header class="topbar">
                <h1 class="topbar-title">命令速查表</h1>
                <div class="topbar-spacer"></div>
                <div class="topbar-actions">
                    <div class="permission-btn"><span>🔓</span><span>用户权限</span></div>
                    <button class="topbar-btn"><span>📋</span><span>导出</span></button>
                </div>
            </header>
            
            <div class="content-area">
                <div class="content-container">
                    <div class="command-search-bar">
                        <div class="search-input-wrapper">
                            <span class="search-icon">🔍</span>
                            <input type="text" class="search-input" placeholder="搜索命令名称、功能、分类...">
                        </div>
                        <div class="search-filters">
                            <div class="filter-group">
                                <span class="filter-label">分类:</span>
                                <div class="filter-tags"></div>
                            </div>
                            <div class="filter-group" style="margin-left: auto;">
                                <span class="filter-label">系统:</span>
                                <select class="filter-select">
                                    <option value="all">全部发行版</option>
                                    <option value="fedora">Fedora</option>
                                    <option value="ubuntu">Ubuntu</option>
                                    <option value="debian">Debian</option>
                                    <option value="arch">Arch Linux</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <span class="filter-label">排序:</span>
                                <select class="filter-select">
                                    <option value="frequency">使用频率</option>
                                    <option value="name">命令名称</option>
                                    <option value="safety">安全等级</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="command-list"></div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- 命令详情弹窗 -->
    <div class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">命令详情</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body"></div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">关闭</button>
                <button class="btn primary">
                    <span>📋</span>
                    复制命令
                </button>
            </div>
        </div>
    </div>
    
    <script src="js/main.js"></script>
</body>
</html>
