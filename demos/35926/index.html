<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文脉古树 - 中国诗词传承</title>
<style>
/* ========================================
   文脉古树 - 宣纸水墨国风样式
   ======================================== */
:root {
    --paper-bg: #F5F0E6;
    --paper-dark: #E8E0D0;
    --ink-black: #2C2C2C;
    --ink-light: #4A4A4A;
    --vermilion: #C75450;
    --indigo: #2E4A62;
    --jade: #6B8E6B;
    --gold: #D4A84B;
    --gold-glow: rgba(212,168,75,0.6);
    --shadow: rgba(44,44,44,0.2);
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; font-family:'STSong','SimSun','宋体',serif; }
body {
    background-color:var(--paper-bg);
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E"),linear-gradient(to bottom,var(--paper-bg),var(--paper-dark));
    background-blend-mode:multiply;
    color:var(--ink-black);
}

/* 加载动画 */
#loading-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--paper-bg); display:flex; align-items:center; justify-content:center; z-index:9999; transition:opacity 1.5s ease-out; }
#loading-overlay.fade-out { opacity:0; pointer-events:none; }
.loading-content { text-align:center; }
.ink-brush { width:120px; height:200px; margin:0 auto; position:relative; }
.ink-brush::before { content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:8px; height:0; background:linear-gradient(to top,var(--ink-black),var(--ink-light)); border-radius:4px; animation:ink-grow 3s ease-out forwards; }
.ink-brush::after { content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:40px; height:40px; background:radial-gradient(circle,var(--ink-black) 0%,transparent 70%); border-radius:50%; opacity:0; animation:ink-spread 3s ease-out 0.5s forwards; }
@keyframes ink-grow { 0%{height:0;opacity:0} 30%{height:60px;opacity:1} 100%{height:180px;opacity:1} }
@keyframes ink-spread { 0%{transform:translateX(-50%) scale(0);opacity:0} 50%{transform:translateX(-50%) scale(1);opacity:0.8} 100%{transform:translateX(-50%) scale(2.5);opacity:0} }
.loading-text { font-family:'STKaiti','KaiTi','楷体',cursive; font-size:28px; color:var(--ink-black); margin-top:30px; letter-spacing:8px; opacity:0; animation:text-appear 1s ease-out 1s forwards; }
@keyframes text-appear { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

/* 顶部搜索栏 */
.search-header { position:fixed; top:0; left:0; width:100%; height:80px; display:flex; align-items:center; justify-content:space-between; padding:0 40px; background:linear-gradient(to bottom,var(--paper-bg) 0%,var(--paper-bg) 70%,transparent 100%); z-index:100; opacity:0; animation:header-appear 1s ease-out 3.5s forwards; }
@keyframes header-appear { to{opacity:1} }
.site-title { font-family:'STKaiti','KaiTi','楷体',cursive; font-size:36px; color:var(--ink-black); letter-spacing:6px; text-shadow:2px 2px 4px var(--shadow); }
.search-box { position:relative; width:320px; }
#search-input { width:100%; padding:12px 20px; font-family:'STSong','SimSun','宋体',serif; font-size:16px; color:var(--ink-black); background:rgba(255,255,255,0.7); border:2px solid var(--ink-light); border-radius:30px; outline:none; transition:all 0.3s ease; }
#search-input:focus { background:rgba(255,255,255,0.9); border-color:var(--vermilion); box-shadow:0 0 20px var(--shadow); }
#search-input::placeholder { color:var(--ink-light); opacity:0.7; }
.search-results { position:absolute; top:100%; left:0; width:100%; max-height:300px; overflow-y:auto; background:rgba(245,240,230,0.98); border:1px solid var(--ink-light); border-radius:10px; margin-top:8px; display:none; box-shadow:0 4px 20px var(--shadow); }
.search-results.active { display:block; }
.search-result-item { padding:12px 20px; cursor:pointer; border-bottom:1px solid rgba(44,44,44,0.1); transition:background 0.2s; }
.search-result-item:last-child { border-bottom:none; }
.search-result-item:hover { background:rgba(199,84,80,0.1); }
.search-result-item .poem-title { font-family:'STKaiti','KaiTi','楷体',cursive; font-size:18px; color:var(--ink-black); }
.search-result-item .poem-author { font-size:13px; color:var(--ink-light); margin-top:2px; }
.search-result-item .poem-dynasty { font-size:12px; color:var(--vermilion); }

/* 主画布 */
.tree-container { width:100%; height:100%; position:relative; cursor:grab; background:radial-gradient(ellipse at 50% 90%,rgba(44,44,44,0.05) 0%,transparent 60%),radial-gradient(ellipse at 50% 30%,rgba(44,44,44,0.03) 0%,transparent 50%); }
.tree-container:active { cursor:grabbing; }
#tree-canvas { position:absolute; top:0; left:0; width:100%; height:100%; display:block; }

/* 模态弹窗 */
.modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(44,44,44,0.6); display:none; align-items:center; justify-content:center; z-index:1000; opacity:0; transition:opacity 0.4s ease; }
.modal.active { display:flex; opacity:1; }
.modal-content { position:relative; width:90%; max-width:700px; max-height:85vh; background:var(--paper-bg); background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.06'/%3E%3C/svg%3E"); border-radius:8px; box-shadow:0 10px 50px rgba(44,44,44,0.4); overflow:hidden; transform:scale(0.9) translateY(20px); transition:transform 0.4s ease; }
.modal.active .modal-content { transform:scale(1) translateY(0); }
.modal-close { position:absolute; top:15px; right:20px; width:36px; height:36px; background:none; border:2px solid var(--ink-light); border-radius:50%; font-size:24px; line-height:1; color:var(--ink-black); cursor:pointer; transition:all 0.3s ease; z-index:10; }
.modal-close:hover { background:var(--vermilion); border-color:var(--vermilion); color:white; }
.modal-header { padding:30px 40px 20px; border-bottom:2px solid var(--ink-light); background:linear-gradient(to bottom,rgba(44,44,44,0.05),transparent); }
.modal-header h2 { font-family:'STKaiti','KaiTi','楷体',cursive; font-size:36px; color:var(--ink-black); letter-spacing:4px; margin-bottom:8px; }
.modal-subtitle { font-family:'STSong','SimSun','宋体',serif; font-size:14px; color:var(--ink-light); }
.modal-body { padding:30px 40px; max-height:calc(85vh - 120px); overflow-y:auto; line-height:1.8; }
.modal-body .section-title { font-family:'STKaiti','KaiTi','楷体',cursive; font-size:22px; color:var(--vermilion); margin:25px 0 12px; padding-left:15px; border-left:4px solid var(--vermilion); }
.modal-body .section-title:first-child { margin-top:0; }
.modal-body .poem-content { font-family:'STSong','SimSun','宋体',serif; font-size:18px; color:var(--ink-black); line-height:2.2; padding:20px; background:rgba(255,255,255,0.5); border-radius:8px; margin:15px 0; }
.modal-body .poem-content p { margin:8px 0; }
.modal-body .description { font-size:16px; color:var(--ink-light); text-indent:2em; }
.modal-body .notes { font-size:15px; color:var(--ink-light); padding:15px; background:rgba(46,74,98,0.08); border-radius:6px; }
.modal-body .notes p { margin:6px 0; }
.modal-body .appreciation { font-size:15px; color:var(--ink-black); line-height:1.9; text-indent:2em; }

/* 提示 */
.tooltip { position:fixed; padding:8px 16px; background:var(--ink-black); color:var(--paper-bg); font-family:'STSong','SimSun','宋体',serif; font-size:14px; border-radius:4px; pointer-events:none; opacity:0; transition:opacity 0.3s ease; z-index:500; white-space:nowrap; }
.tooltip.visible { opacity:1; }
.control-hints { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:30px; padding:12px 30px; background:rgba(245,240,230,0.9); border:1px solid var(--ink-light); border-radius:30px; z-index:100; opacity:0; animation:hints-appear 1s ease-out 4s forwards; }
@keyframes hints-appear { to{opacity:1} }
.control-hints span { font-family:'STSong','SimSun','宋体',serif; font-size:13px; color:var(--ink-light); display:flex; align-items:center; gap:6px; }
.control-hints span::before { content:''; width:6px; height:6px; background:var(--vermilion); border-radius:50%; }

/* 滚动条 */
::-webkit-scrollbar { width:8px; }
::-webkit-scrollbar-track { background:var(--paper-dark); border-radius:4px; }
::-webkit-scrollbar-thumb { background:var(--ink-light); border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:var(--ink-black); }

/* 响应式 */
@media (max-width:768px) {
    .search-header { padding:0 20px; height:70px; }
    .site-title { font-size:28px; letter-spacing:4px; }
    .search-box { width:180px; }
    #search-input { padding:10px 16px; font-size:14px; }
    .modal-header { padding:20px 25px 15px; }
    .modal-header h2 { font-size:28px; }
    .modal-body { padding:20px 25px; }
    .control-hints { gap:15px; padding:10px 20px; }
    .control-hints span { font-size:11px; }
}
</style>
</head>
<body>
<!-- 加载动画遮罩 -->
<div id="loading-overlay">
    <div class="loading-content">
        <div class="ink-brush"></div>
        <p class="loading-text">墨染纸香 · 古树萌芽</p>
    </div>
</div>

<!-- 顶部搜索栏 -->
<header class="search-header">
    <h1 class="site-title">文脉古树</h1>
    <div class="search-box">
        <input type="text" id="search-input" placeholder="输入诗词名，追溯文脉..." autocomplete="off">
        <div id="search-results" class="search-results"></div>
    </div>
</header>

<!-- 主画布 -->
<main class="tree-container" id="tree-container">
    <canvas id="tree-canvas"></canvas>
</main>

<!-- 模态弹窗 -->
<div id="modal" class="modal">
    <div class="modal-content">
        <button class="modal-close" id="modal-close">&times;</button>
        <div class="modal-header">
            <h2 id="modal-title"></h2>
            <p id="modal-subtitle" class="modal-subtitle"></p>
        </div>
        <div class="modal-body" id="modal-body"></div>
    </div>
</div>

<!-- 提示 -->
<div id="tooltip" class="tooltip"></div>

<!-- 控制提示 -->
<div class="control-hints">
    <span>拖拽移动</span>
    <span>滚轮缩放</span>
    <span>点击节点</span>
</div>

<script>
/**
 * 文脉古树 - 诗词数据库
 * 预留扩展空间：可新增诗人、诗词到对应流派下
 */
const POETRY_DATABASE = {
    roots: [
        {
            id: 'shijing', name: '诗经',
            description: '中国最早的诗歌总集，收录自西周初年至春秋中叶的诗歌305篇。',
            content: '《诗经》是中国古代诗歌的开端，是最早的一部诗歌总集，收集了西周初年至春秋中叶（前11世纪至前6世纪）的诗歌，共311篇，其中6篇为笙诗，反映了周初至周晚期约五百年间的社会面貌。\n\n诗经的作者佚名，绝大部分已经无法考证，相传为尹吉甫采集、孔子编订。诗经在先秦时期称为《诗》，或取其整数称《诗三百》。西汉时被尊为儒家经典，始称《诗经》，并沿用至今。\n\n诗经内容丰富，反映了劳动与爱情、战争与徭役、压迫与反抗、风俗与婚姻、祭祖与宴会，甚至天象、地貌、动物、植物等方方面面，是周代社会生活的一面镜子。',
            features: ['十五国风','大雅小雅','周颂鲁颂','现实主义源头']
        },
        {
            id: 'chuci', name: '楚辞',
            description: '屈原创造的新诗体，中国浪漫主义文学的源头。',
            content: '《楚辞》是中国文学史上第一部浪漫主义诗歌总集，相传是屈原创作的一种新诗体。其中以屈原的作品为主，包括《离骚》、《九歌》、《天问》等。\n\n屈原是中国浪漫主义文学的奠基人，"楚辞"的创立者和代表作家，开辟了"香草美人"的传统，被誉为"中华诗祖"。\n\n《楚辞》运用楚地的文学样式、方言声韵，叙写楚地的山川人物、历史风情，具有浓厚的地域文化色彩。其想象丰富、感情奔放、风格绚丽，是楚国文化的结晶。',
            features: ['离骚','九歌','天问','浪漫主义源头']
        }
    ],
    dynasties: {
        hanweiliuchao: {
            name: '汉魏六朝', position: {x:200,y:320},
            branches: {
                jianan: {
                    name: '建安风骨', position: {x:120,y:420},
                    poets: [
                        {
                            id: 'caozhi', name: '曹植', description: '字子建，曹操第三子，建安文学的代表人物。',
                            poems: [
                                { id:'mingming', title:'七步诗', content:'煮豆持作羹，漉豉以为汁。\n萁在釜下燃，豆在釜中泣。\n本自同根生，相煎何太急？', notes:'煮豆子是为了做成汤，过滤豆豉用来作汁。豆秆在锅下燃烧，豆子在锅里哭泣。本来是从同一条根上长出来的，为什么要互相煎熬呢？', appreciation:'此诗用同根而生的萁和豆来比喻同父共母的兄弟，用萁煎死豆来比喻兄弟相残。全诗形象生动，寓意深刻，成为千古名篇。' },
                                { id:'longzhong', title:'洛神赋（节选）', content:'翩若惊鸿，婉若游龙。\n荣曜秋菊，华茂春松。\n仿佛兮若轻云之蔽月，\n飘摇兮若流风之回雪。', notes:'翩然若惊飞的鸿雁，婉约若游动的蛟龙。容光焕发如秋日的菊花，体态丰茂如春天的青松。', appreciation:'这段描写洛神姿态的名句，以惊鸿、游龙、秋菊、春松四种意象比喻洛神的美丽，是中国文学史上最著名的美人描写之一。' }
                            ]
                        },
                        {
                            id: 'caocao', name: '曹操', description: '字孟德，汉末枭雄，乱世中的诗人。',
                            poems: [
                                { id:'guilv', title:'龟虽寿', content:'神龟虽寿，犹有竟时。\n腾蛇乘雾，终为土灰。\n老骥伏枥，志在千里。\n烈士暮年，壮心不已。', notes:'神龟虽然长寿，但还是有死去的时候。腾蛇虽然能乘雾飞行，最终也会化为土灰。千里马伏在马槽里，志向却是驰骋千里。', appreciation:'曹操以老骥自喻，表达了自己虽已年老但仍怀有宏大抱负的情怀，体现了建安风骨的刚健有力。' }
                            ]
                        }
                    ]
                },
                xianling: {
                    name: '玄言诗', position: {x:280,y:420},
                    poets: [
                        {
                            id: 'tao yuanming', name: '陶渊明', description: '中国第一位田园诗人，开创田园诗派。',
                            poems: [
                                { id:'drinking', title:'饮酒·其五', content:'结庐在人境，而无车马喧。\n问君何能尔？心远地自偏。\n采菊东篱下，悠然见南山。\n山气日夕佳，飞鸟相与还。\n此中有真意，欲辨已忘言。', notes:'居住在人世间，却没有车马的喧嚣。问我为什么能这样，心既然远离了尘嚣，自然会觉得住所偏僻。在东篱下采摘菊花，悠闲地望向南山。', appreciation:'这首诗表达了陶渊明归隐田园后的心境，"采菊东篱下，悠然见南山"成为千古传诵的名句，体现了中国文学追求自然、超然物外的精神境界。' },
                                { id:'returning', title:'归去来兮辞', content:'归去来兮，田园将芜胡不归？\n既自以心为形役，奚惆怅而独悲？\n悟已往之不谏，知来者之可追。', notes:'回去吧，田园都快荒芜了，为什么还不回去呢？既然自心被形体所役使，又惆怅什么独自悲伤呢？', appreciation:'这是陶渊明辞官归隐时的宣言，表达了他认清了过去的错误但未来还可挽回的觉悟，体现了他洁身自好的高尚品格。' }
                            ]
                        }
                    ]
                }
            }
        },
        tang: {
            name: '唐代', position: {x:400,y:280},
            branches: {
                borderscape: {
                    name: '边塞诗派', position: {x:300,y:380},
                    poets: [
                        {
                            id: 'wangweiling', name: '王昌龄', description: '七绝圣手，边塞诗的代表人物。',
                            poems: [
                                { id:'chongfu', title:'出塞', content:'秦时明月汉时关，\n万里长征人未还。\n但使龙城飞将在，\n不教胡马度阴山。', notes:'依旧是秦汉时的明月和边关，征人万里出征却没有人回来。如果有像李广那样的将军在，绝不会让敌人的兵马越过阴山。', appreciation:'这首诗意境开阔，气势雄浑，既写出了边塞的苍凉，又表达了诗人对良将的渴望，是边塞诗的巅峰之作。' }
                            ]
                        },
                        {
                            id: 'lici', name: '李颀', description: '边塞诗人，以七言歌行见长。',
                            poems: [
                                { id:'listening', title:'听董大弹胡笳弄音寄语', content:'蔡女昔造胡笳声，\n一弹一十有八拍。\n胡人落泪沾边草，\n汉使断肠对归客。', notes:'蔡文姬当年创作了胡笳曲，一弹便是十八拍。胡人流泪打湿了边草，汉使对着归客伤心断肠。', appreciation:'此诗描写胡笳曲的感人力量，以蔡文姬的故事为背景，表达了浓烈的思乡之情和战争的残酷。' }
                            ]
                        }
                    ]
                },
                landscape: {
                    name: '山水田园', position: {x:400,y:380},
                    poets: [
                        {
                            id: 'menghaoran', name: '孟浩然', description: '唐代山水田园诗派的开创者。',
                            poems: [
                                { id:'spring', title:'春晓', content:'春眠不觉晓，\n处处闻啼鸟。\n夜来风雨声，\n花落知多少。', notes:'春天夜里睡得很甜不知不觉天就亮了，到处都能听到鸟叫声。昨夜听见刮风下雨的声音，不知道花瓣被打落了多少。', appreciation:'这首小诗语言平易浅近，意境却深远绵长。"春眠不觉晓"写出了春天的慵懒舒适，"花落知多少"又透露出淡淡的惜春之情。' }
                            ]
                        },
                        {
                            id: 'libai', name: '王维', description: '诗佛，山水田园诗的集大成者。',
                            poems: [
                                { id:'deer', title:'鹿柴', content:'空山不见人，\n但闻人语响。\n返景入深林，\n复照青苔上。', notes:'幽静的山谷里看不见人，只能听到有人说话的声音。夕阳的光线射入深林，又照在青苔上面。', appreciation:'王维以禅意入诗，这首诗描绘了一幅静谧的山林夕照图，以声写静，以光写暗，达到了诗画合一的境界。' }
                            ]
                        }
                    ]
                },
                libai: {
                    name: '李白浪漫', position: {x:500,y:380},
                    poets: [
                        {

                            poems: [

                                { id:'springview', title:'春望', content:'国破山河在，城春草木深。\n感时花溅泪，恨别鸟惊心。\n烽火连三月，家书抵万金。\n白头搔更短，浑欲不胜簪。', notes:'国家破碎但山河依旧，春天来临城中却草木丛生。感伤时事看到花开也落泪，怅恨别离听到鸟鸣也惊心。战火连续三个月不停，一封家书珍贵得胜过万金。', appreciation:'这首诗作于安史之乱期间，表达了诗人对国家命运的忧虑和对亲人的思念。"家书抵万金"成为表达战争年代人们对亲人消息渴求的千古名句。' },
                                { id:'juche', title:'茅屋为秋风所破歌（节选）', content:'八月秋高风怒号，\n卷我屋上三重茅。\n茅飞渡江洒江郊，\n高者挂罥长林梢，\n下者飘转沉塘坳。', notes:'八月秋深狂风呼啸，卷走我屋顶上多层茅草。茅草飞过江散落在江边，高处的挂在树梢上，低处的飘转沉入池塘中。', appreciation:'杜甫虽然自己生活困苦，却仍发出"安得广厦千万间，大庇天下寒士俱欢颜"的呐喊，体现了诗人博大的胸襟和济世的情怀。' }

                                { id:'wuxia', title:'武陵春·春晚', content:'风住尘香花已尽，日晚倦梳头。\n物是人非事事休，欲语泪先流。\n闻说双溪春尚好，也拟泛轻舟。\n只恐双溪舴艋舟，载不动许多愁。', notes:'风停了，花都落尽了，尘土中带着花香，天色已晚却懒得梳头。景物依旧人事已变，什么事都完了，想说话眼泪却先流了出来。听说双溪的春色还好，也打算去划船。只怕双溪的舴艋小船，载不动我这么多忧愁。', appreciation:'这首词以暮春景色起兴，表达了词人晚年寡居的悲愁。"只恐双溪舴艋舟，载不动许多愁"以舟小愁重来比喻愁思之重，成为写愁的名句。' }

                            poems: [
                                { id:'yujue', title:'虞美人', content:'春花秋月何时了？往事知多少。\n小楼昨夜又东风，故国不堪回首月明中。\n雕栏玉砌应犹在，只是朱颜改。\n问君能有几多愁？恰似一江春水向东流。', notes:'春花秋月什么时候才能完结？往事有多少谁知道。小楼昨夜又吹来了东风，在皎洁的月光下回忆故国实在让人心痛。精美的栏杆和台阶应该还在，只是人的容颜已经改变。问你究竟有多少忧愁？就像那满江的春水一直向东流去。', appreciation:'这是李煜的绝命词，以问答的形式将亡国之痛推向高潮。"问君能有几多愁？恰似一江春水向东流"将无形之愁化为有形，成为写愁的千古绝唱。' }

                            id: 'guanhanqing', name: '关汉卿', description: '元曲四大家之首，戏曲奠基人。',
                            poems: [
                                { id:'tianchai', title:'天净沙·秋思', content:'枯藤老树昏鸦，\n小桥流水人家，\n古道西风瘦马。\n夕阳西下，\n断肠人在天涯。', notes:'枯萎的藤蔓缠绕着老树，黄昏的乌鸦栖息在上面。小桥下流水潺潺，旁边有几户人家。古老的道路上吹着西风，骑着消瘦的马。夕阳西下，思念家乡的人漂泊在远方。', appreciation:'这首小令以十种景物勾勒出一幅秋日黄昏的萧瑟图景，"断肠人在天涯"点明主旨，成为元曲中最著名的散曲之一，被誉为"秋思之祖"。' }
                            ]

                            ]
                        }
                    ]
                }

        },
        mingqing: {

                            id: 'tanxians', name: '纳兰性德', description: '清初词人，满洲贵族中的才子。',
                            poems: [
                                { id:'changchenging', title:'长相思', content:'山一程，水一程，\n身向榆关那畔行，\n夜深千帐灯。\n风一更，雪一更，\n聒碎乡心梦不成，\n故园无此声。', notes:'走了一程又一程，翻过了山又涉过了水，向着山海关那边行进。夜深了军营中亮起千万盏灯火。刮了一更风又下了一更雪，嘈杂的声音打破了思乡的梦，故乡没有这样的风声。', appreciation:'这首词以行军旅途中的情景为内容，表达了作者浓烈的思乡之情。"山一程，水一程"和"风一更，雪一更"的反复，音律和谐，感人至深。' }

                            poems: [
                                { id:'wuliuqiyun', title:'葬花吟（节选）', content:'花谢花飞花满天，\n红消香断有谁怜？\n游丝软系飘春榭，\n落絮轻沾扑绣帘。', notes:'花瓣凋零飞舞满天，红色褪去香气消散有谁来怜惜？游动的蛛丝轻轻地缠绕飘向春天的亭榭，飘落的柳絮轻轻沾上绣花的门帘。', appreciation:'这首诗以落花自喻，表达了林黛玉对身世的感慨和对美好事物消逝的悲叹，是《红楼梦》中最著名的诗词之一。' }
                            ]
                        }
                    ]
                }
            }
        }
    }
};

<script>
/**
 * 文脉古树 - 主逻辑（Canvas 递归分枝绘制 + 交互）
 */
(function() {
    'use strict';

    const state = {
        scale: 1, offsetX: 0, offsetY: 0,
        isDragging: false, dragStartX: 0, dragStartY: 0,
        dragStartOffsetX: 0, dragStartOffsetY: 0,
        growthProgress: 0, growthAnimId: null, swayTime: 0,
        hoveredNode: null, highlightedLeafIds: new Set(),
        treeNodes: [], dynasties: [], branches: [], poets: [], leaves: [],
        canvasW: 0, canvasH: 0, virtualW: 1600, virtualH: 1000
    };

    const $ = function(s) { return document.querySelector(s); };
    const els = {
        canvas: $('#tree-canvas'), ctx: null,
        container: $('#tree-container'), overlay: $('#loading-overlay'),
        searchInput: $('#search-input'), searchResults: $('#search-results'),
        modal: $('#modal'), modalClose: $('#modal-close'),
        modalTitle: $('#modal-title'), modalSubtitle: $('#modal-subtitle'),
        modalBody: $('#modal-body'), tooltip: $('#tooltip')
    };

    // 树形布局计算
    function computeTreeLayout() {
        var VW = state.virtualW, VH = state.virtualH;
        var cx = VW / 2, trunkBaseY = VH - 50, trunkTopY = 180;

        state.treeNodes = []; state.dynasties = []; state.branches = []; state.poets = []; state.leaves = [];

        var roots = POETRY_DATABASE.roots;
        state.treeNodes.push({type:'root', id:roots[0].id, data:roots[0], x:cx-80, y:trunkBaseY+30, r:32, label:'诗经'});
        state.treeNodes.push({type:'root', id:roots[1].id, data:roots[1], x:cx+80, y:trunkBaseY+30, r:32, label:'楚辞'});

        state.trunkPath = [
            {x:cx, y:trunkBaseY}, {x:cx+10, y:trunkBaseY-150},
            {x:cx-5, y:trunkBaseY-300}, {x:cx+5, y:trunkBaseY-450}, {x:cx, y:trunkTopY}
        ];

        var dynastyDefs = [
            {key:'hanweiliuchao', name:'汉魏六朝', trunkY:trunkBaseY-180, angle:-62, len:230},
            {key:'tang', name:'唐代', trunkY:trunkBaseY-320, angle:-38, len:280},
            {key:'song', name:'宋代', trunkY:trunkBaseY-400, angle:32, len:280},
            {key:'yuan', name:'元代', trunkY:trunkBaseY-320, angle:52, len:240},
            {key:'mingqing', name:'明清', trunkY:trunkBaseY-180, angle:62, len:230}
        ];

        dynastyDefs.forEach(function(dDef) {
            var dynasty = POETRY_DATABASE.dynasties[dDef.key];
            if (!dynasty) return;
            var trunkX = cx, trunkY = dDef.trunkY;
            var angleRad = dDef.angle * Math.PI / 180;
            var endX = trunkX + Math.sin(angleRad) * dDef.len;
            var endY = trunkY - Math.cos(angleRad) * dDef.len;
            var midX = trunkX + Math.sin(angleRad) * dDef.len * 0.55;
            var midY = trunkY - Math.cos(angleRad) * dDef.len * 0.55;

            var dNode = {type:'dynasty', id:dDef.key, data:dynasty, x:midX, y:midY, r:38, label:dynasty.name, trunkY:trunkY, angle:dDef.angle, length:dDef.len, endX:endX, endY:endY};
            state.treeNodes.push(dNode);
            state.dynasties.push(dNode);

            if (dynasty.branches) {
                var branchEntries = Object.entries(dynasty.branches);
                branchEntries.forEach(function(entry, bIdx) {
                    var bKey = entry[0], branch = entry[1];
                    var spreadCount = branchEntries.length;
                    var spreadAngle = 35;
                    var baseAngle = dDef.angle + (bIdx - (spreadCount-1)/2) * (spreadAngle / Math.max(spreadCount-1,1));
                    var baseAngleRad = baseAngle * Math.PI / 180;
                    var subLen = 100;
                    var subEndX = endX + Math.sin(baseAngleRad) * subLen;
                    var subEndY = endY - Math.cos(baseAngleRad) * subLen;

                    var bNode = {type:'branch', id:bKey, data:branch, x:endX+Math.sin(baseAngleRad)*subLen*0.5, y:endY-Math.cos(baseAngleRad)*subLen*0.5, r:26, label:branch.name, parentX:endX, parentY:endY, endX:subEndX, endY:subEndY, dynastyKey:dDef.key};
                    state.treeNodes.push(bNode);
                    state.branches.push(bNode);

                    if (branch.poets) {
                        var poets = branch.poets;
                        poets.forEach(function(poet, pIdx) {
                            var poetAngleRange = 50;
                            var poetAngle = baseAngle + (pIdx - (poets.length-1)/2) * (poetAngleRange / Math.max(poets.length-1,1));
                            var poetAngleRad = poetAngle * Math.PI / 180;
                            var poetLen = 70;
                            var poetEndX = subEndX + Math.sin(poetAngleRad) * poetLen;
                            var poetEndY = subEndY - Math.cos(poetAngleRad) * poetLen;

                            var pNode = {type:'poet', id:poet.id, data:poet, x:subEndX+Math.sin(poetAngleRad)*poetLen*0.5, y:subEndY-Math.cos(poetAngleRad)*poetLen*0.5, r:20, label:poet.name, parentX:subEndX, parentY:subEndY, endX:poetEndX, endY:poetEndY, dynastyKey:dDef.key, branchKey:bKey};
                            state.treeNodes.push(pNode);
                            state.poets.push(pNode);

                            if (poet.poems) {
                                var poems = poet.poems;
                                poems.forEach(function(poem, pmIdx) {
                                    var leafAngle = poetAngle + (pmIdx - (poems.length-1)/2) * 18;
                                    var leafAngleRad = leafAngle * Math.PI / 180;
                                    var leafDist = 30 + (pmIdx*7%18);
                                    var leafX = poetEndX + Math.sin(leafAngleRad) * leafDist;
                                    var leafY = poetEndY - Math.cos(leafAngleRad) * leafDist;

                                    var leafNode = {type:'leaf', id:poem.id, data:poem, x:leafX, y:leafY, r:10, poemTitle:poem.title, poetId:poet.id, poetName:poet.name, dynastyKey:dDef.key, branchKey:bKey};
                                    state.treeNodes.push(leafNode);
                                    state.leaves.push(leafNode);
                                });
                            }
                        });
                    }
                });
            }
        });
    }

    function resizeCanvas() {
        var dpr = window.devicePixelRatio || 1;
        var rect = els.container.getBoundingClientRect();
        state.canvasW = rect.width; state.canvasH = rect.height;
        els.canvas.width = rect.width * dpr; els.canvas.height = rect.height * dpr;
        els.canvas.style.width = rect.width + 'px'; els.canvas.style.height = rect.height + 'px';
        els.ctx = els.canvas.getContext('2d');
        els.ctx.setTransform(dpr,0,0,dpr,0,0);
    }

    function toScreen(x,y) { return {sx:x*state.scale+state.offsetX, sy:y*state.scale+state.offsetY}; }
    function toVirtual(sx,sy) { return {x:(sx-state.offsetX)/state.scale, y:(sy-state.offsetY)/state.scale}; }

    function drawFrame() {
        var ctx = els.ctx;
        if (!ctx) return;
        var W = state.canvasW, H = state.canvasH, g = state.growthProgress, sway = state.swayTime;
        ctx.clearRect(0,0,W,H);
        ctx.save();
        ctx.translate(state.offsetX, state.offsetY);
        ctx.scale(state.scale, state.scale);

        drawBackground(ctx, g);
        drawRoots(ctx, [{x:state.virtualW/2-80,y:state.virtualH-50+30},{x:state.virtualW/2+80,y:state.virtualH-50+30}], g);
        drawTrunk(ctx, state.trunkPath, g);
        state.dynasties.forEach(function(d) { drawDynastyBranch(ctx, d, g); });
        state.branches.forEach(function(b) { drawSubBranch(ctx, b, g); });
        state.poets.forEach(function(p) { drawPoetBranch(ctx, p, g); });
        state.leaves.forEach(function(leaf) { drawLeaf(ctx, leaf, g, sway); });
        state.leaves.forEach(function(leaf) { drawLeafLabel(ctx, leaf, g); });

        ctx.restore();
    }

    function drawBackground(ctx, g) {
        var VW = state.virtualW, VH = state.virtualH;
        var groundGrad = ctx.createRadialGradient(VW/2, VH-60, 50, VW/2, VH-60, 400);
        groundGrad.addColorStop(0,'rgba(44,44,44,0.12)'); groundGrad.addColorStop(0.5,'rgba(44,44,44,0.05)'); groundGrad.addColorStop(1,'rgba(44,44,44,0)');
        ctx.fillStyle = groundGrad; ctx.fillRect(0, VH-300, VW, 300);
        if (g > 0.3) {
            var washAlpha = (g-0.3)*0.08;
            var washGrad = ctx.createRadialGradient(VW/2, 350, 100, VW/2, 350, 500);
            washGrad.addColorStop(0,'rgba(44,44,44,0)'); washGrad.addColorStop(0.3,'rgba(44,44,44,'+washAlpha+')'); washGrad.addColorStop(1,'rgba(44,44,44,0)');
            ctx.fillStyle = washGrad; ctx.fillRect(0,0,VW,VH);
        }
        if (g > 0.5) {
            ctx.fillStyle = 'rgba(44,44,44,0.03)';
            for (var i=0; i<30; i++) {
                var px = (Math.sin(42+i*7.3)*0.5+0.5)*VW;
                var py = 100+(Math.cos(42+i*5.1)*0.5+0.5)*600;
                var pr = 2+Math.abs(Math.sin(i*3.7))*8;
                ctx.beginPath(); ctx.arc(px,py,pr,0,Math.PI*2); ctx.fill();
            }
        }
    }

    function drawRoots(ctx, positions, g) {
        var cx = state.virtualW/2, baseY = state.virtualH-50;
        var progress = Math.min(1, g/0.15);
        var roots = POETRY_DATABASE.roots;
        positions.forEach(function(pos, i) {
            if (progress <= 0) return;
            var root = roots[i]; if (!root) return;
            var rootLines = [{dx:-60,dy:40,cp:-30},{dx:-30,dy:60,cp:-15},{dx:0,dy:70,cp:0},{dx:30,dy:60,cp:15},{dx:60,dy:40,cp:30}];
            rootLines.forEach(function(line, li) {
                ctx.save(); ctx.globalAlpha = progress*0.6;
                ctx.strokeStyle='#2C2C2C'; ctx.lineWidth=3+(li%3); ctx.lineCap='round';
                ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
                ctx.quadraticCurveTo(pos.x+line.cp, pos.y+line.dy*0.5, pos.x+line.dx, pos.y+line.dy);
                ctx.stroke(); ctx.restore();
            });
            ctx.save(); ctx.globalAlpha = progress; ctx.beginPath(); ctx.arc(pos.x,pos.y,28,0,Math.PI*2);
            var grad = ctx.createRadialGradient(pos.x,pos.y,5,pos.x,pos.y,28);
            grad.addColorStop(0,'#1a1a1a'); grad.addColorStop(0.7,'#3d3d3d'); grad.addColorStop(1,'rgba(44,44,44,0.2)');
            ctx.fillStyle=grad; ctx.fill(); ctx.strokeStyle='#2C2C2C'; ctx.lineWidth=2; ctx.stroke();
            ctx.fillStyle='#F5F0E6'; ctx.font='14px "STKaiti","KaiTi","楷体",cursive'; ctx.textAlign='center'; ctx.textBaseline='middle';
            ctx.fillText(root.name, pos.x, pos.y); ctx.restore();
        });
        if (progress > 0) {
            ctx.save(); ctx.globalAlpha=progress*0.5; ctx.strokeStyle='#2C2C2C'; ctx.lineWidth=3; ctx.setLineDash([4,4]);
            ctx.beginPath(); ctx.moveTo(cx-80,baseY+30); ctx.quadraticCurveTo(cx-40,baseY,cx,baseY);
            ctx.moveTo(cx+80,baseY+30); ctx.quadraticCurveTo(cx+40,baseY,cx,baseY); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
        }
    }

    function drawTrunk(ctx, path, g) {
        var progress = Math.min(1, Math.max(0, (g-0.1)/0.25));
        if (progress <= 0) return;
        ctx.save(); ctx.globalAlpha = progress;
        var bottomW = 28, topW = 10;
        ctx.fillStyle='#2C2C2C'; ctx.beginPath();
        ctx.moveTo(path[0].x-bottomW, path[0].y);
        for (var i=1; i<path.length; i++) { var t=i/(path.length-1); var w=bottomW+(topW-bottomW)*t; ctx.lineTo(path[i].x-w, path[i].y); }
        ctx.lineTo(path[path.length-1].x+topW, path[path.length-1].y);
        for (var i=path.length-2; i>=0; i--) { var t=i/(path.length-1); var w=bottomW+(topW-bottomW)*t; ctx.lineTo(path[i].x+w, path[i].y); }
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle='#3d3d3d'; ctx.lineWidth=10; ctx.lineCap='round'; ctx.beginPath();
        ctx.moveTo(path[0].x-3, path[0].y);
        for (var i=1; i<path.length; i++) { ctx.quadraticCurveTo((path[i-1].x+path[i].x)/2-3, (path[i-1].y+path[i].y)/2, path[i].x-3, path[i].y); }
        ctx.stroke();
        ctx.strokeStyle='#1a1a1a'; ctx.lineWidth=4; ctx.beginPath();
        ctx.moveTo(path[0].x+6, path[0].y);
        for (var i=1; i<path.length; i++) { ctx.quadraticCurveTo((path[i-1].x+path[i].x)/2+6, (path[i-1].y+path[i].y)/2, path[i].x+6, path[i].y); }
        ctx.stroke(); ctx.restore();
    }

    function drawDynastyBranch(ctx, dNode, g) {
        var progress = Math.min(1, Math.max(0, (g-0.25)/0.3));
        if (progress <= 0) return;
        var cx = state.virtualW/2;
        var startX = cx, startY = dNode.trunkY, endX = dNode.endX, endY = dNode.endY;
        var midX = (startX+endX)/2 + (dNode.angle>0?30:-30);
        var midY = (startY+endY)/2 - 20;
        ctx.save(); ctx.globalAlpha = progress;
        ctx.strokeStyle='rgba(44,44,44,0.15)'; ctx.lineWidth=22; ctx.lineCap='round'; ctx.beginPath();
        ctx.moveTo(startX,startY); ctx.quadraticCurveTo(midX,midY,endX,endY); ctx.stroke();
        ctx.strokeStyle='#2C2C2C'; ctx.lineWidth=14; ctx.beginPath();
        ctx.moveTo(startX,startY); ctx.quadraticCurveTo(midX,midY,endX,endY); ctx.stroke();
        ctx.strokeStyle='#3d3d3d'; ctx.lineWidth=6; ctx.beginPath();
        ctx.moveTo(startX+4,startY); ctx.quadraticCurveTo(midX+4,midY,endX+4,endY); ctx.stroke();
        drawNodeCircle(ctx, dNode, progress, dNode.type); ctx.restore();
    }

    function drawSubBranch(ctx, bNode, g) {
        var progress = Math.min(1, Math.max(0, (g-0.4)/0.3));
        if (progress <= 0) return;
        ctx.save(); ctx.globalAlpha = progress;
        ctx.strokeStyle='rgba(44,44,44,0.12)'; ctx.lineWidth=12; ctx.lineCap='round'; ctx.beginPath();
        ctx.moveTo(bNode.parentX,bNode.parentY); ctx.quadraticCurveTo((bNode.parentX+bNode.endX)/2,(bNode.parentY+bNode.endY)/2-5,bNode.endX,bNode.endY); ctx.stroke();
        ctx.strokeStyle='#3d3d3d'; ctx.lineWidth=6; ctx.beginPath();
        ctx.moveTo(bNode.parentX,bNode.parentY); ctx.quadraticCurveTo((bNode.parentX+bNode.endX)/2,(bNode.parentY+bNode.endY)/2,bNode.endX,bNode.endY); ctx.stroke();
        drawNodeCircle(ctx, bNode, progress, bNode.type); ctx.restore();
    }

    function drawPoetBranch(ctx, pNode, g) {
        var progress = Math.min(1, Math.max(0, (g-0.55)/0.3));
        if (progress <= 0) return;
        ctx.save(); ctx.globalAlpha = progress;
        ctx.strokeStyle='rgba(44,44,44,0.1)'; ctx.lineWidth=7; ctx.lineCap='round'; ctx.beginPath();
        ctx.moveTo(pNode.parentX,pNode.parentY); ctx.quadraticCurveTo((pNode.parentX+pNode.endX)/2,(pNode.parentY+pNode.endY)/2-3,pNode.endX,pNode.endY); ctx.stroke();
        ctx.strokeStyle='#4A4A4A'; ctx.lineWidth=3; ctx.beginPath();
        ctx.moveTo(pNode.parentX,pNode.parentY); ctx.quadraticCurveTo((pNode.parentX+pNode.endX)/2,(pNode.parentY+pNode.endY)/2,pNode.endX,pNode.endY); ctx.stroke();
        drawNodeCircle(ctx, pNode, progress, pNode.type); ctx.restore();
    }

    function drawLeaf(ctx, leaf, g, sway) {
        var progress = Math.min(1, Math.max(0, (g-0.7)/0.3));
        if (progress <= 0) return;
        var isHL = state.highlightedLeafIds.has(leaf.id);
        var swayOffset = Math.sin(sway*3 + leaf.x*0.1) * 3;
        ctx.save(); ctx.globalAlpha = progress; ctx.translate(leaf.x, leaf.y+swayOffset);
        ctx.beginPath(); ctx.ellipse(0,0,14,8,0.2,0,Math.PI*2);
        if (isHL) {
            var glowGrad = ctx.createRadialGradient(0,0,2,0,0,18);
            glowGrad.addColorStop(0,'#D4A84B'); glowGrad.addColorStop(0.6,'#C75450'); glowGrad.addColorStop(1,'rgba(212,168,75,0)');
            ctx.fillStyle = glowGrad; ctx.shadowColor='rgba(212,168,75,0.8)'; ctx.shadowBlur=12;
        } else {
            var leafGrad = ctx.createLinearGradient(-10,-5,10,5);
            leafGrad.addColorStop(0,'#6b8e6b'); leafGrad.addColorStop(0.5,'#7a9e6b'); leafGrad.addColorStop(1,'#4a6741');
            ctx.fillStyle = leafGrad;
        }
        ctx.fill();
        if (isHL) ctx.shadowBlur=0;
        ctx.strokeStyle=isHL?'#C75450':'#4a6741'; ctx.lineWidth=1; ctx.stroke();
        ctx.strokeStyle=isHL?'rgba(199,84,80,0.5)':'rgba(74,103,65,0.4)'; ctx.lineWidth=0.5; ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(8,0); ctx.stroke();
        ctx.restore();
    }

    function drawLeafLabel(ctx, leaf, g) {
        var progress = Math.min(1, Math.max(0, (g-0.75)/0.25));
        if (progress <= 0) return;
        var swayOffset = Math.sin(state.swayTime*3 + leaf.x*0.1) * 3;
        ctx.save(); ctx.globalAlpha = progress*0.8; ctx.fillStyle='#2C2C2C';
        ctx.font='9px "STSong","SimSun","宋体",serif'; ctx.textAlign='center'; ctx.textBaseline='top';
        var title = leaf.poemTitle.length>4 ? leaf.poemTitle.substring(0,4) : leaf.poemTitle;
        ctx.fillText(title, leaf.x, leaf.y+11+swayOffset); ctx.restore();
    }

    function drawNodeCircle(ctx, node, progress, nodeType) {
        var isHovered = state.hoveredNode === node;
        ctx.save(); ctx.globalAlpha = progress;
        var fillColor, strokeColor;
        switch (nodeType) {
            case 'dynasty': fillColor=isHovered?'#C75450':'#F5F0E6'; strokeColor=isHovered?'#C75450':'#2C2C2C'; break;
            case 'branch': fillColor=isHovered?'#C75450':'#2E4A62'; strokeColor='#2C2C2C'; break;
            case 'poet': fillColor=isHovered?'#D4A84B':'#F5F0E6'; strokeColor=isHovered?'#C75450':'#2C2C2C'; break;
            default: fillColor='#F5F0E6'; strokeColor='#2C2C2C';
        }
        if (isHovered) { ctx.shadowColor='rgba(199,84,80,0.5)'; ctx.shadowBlur=10; }
        ctx.beginPath(); ctx.arc(node.x, node.y, node.r, 0, Math.PI*2);
        ctx.fillStyle=fillColor; ctx.fill(); ctx.strokeStyle=strokeColor; ctx.lineWidth=nodeType==='dynasty'?3:2; ctx.stroke();
        ctx.shadowBlur=0;
        var labelColor = (nodeType==='branch'&&!isHovered)?'#F5F0E6':'#2C2C2C';
        ctx.fillStyle=labelColor;
        var fontSize = nodeType==='dynasty'?18:nodeType==='branch'?12:13;
        ctx.font=fontSize+'px "STKaiti","KaiTi","楷体",cursive'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(node.label, node.x, node.y); ctx.restore();
    }

    function startGrowthAnimation() {
        state.growthProgress = 0;
        var startTime = performance.now();
        var totalDuration = 4000;
        function animate(now) {
            var elapsed = now - startTime;
            state.growthProgress = Math.min(1, elapsed/totalDuration);
            state.swayTime = now * 0.001;
            drawFrame();
            if (state.growthProgress < 1) { state.growthAnimId = requestAnimationFrame(animate); }
            else { state.growthAnimId = requestAnimationFrame(idleLoop); }
        }
        state.growthAnimId = requestAnimationFrame(animate);
    }

    function idleLoop(now) {
        state.swayTime = now * 0.001;
        drawFrame();
        state.growthAnimId = requestAnimationFrame(idleLoop);
    }

    function getCanvasPos(e) { var rect=els.canvas.getBoundingClientRect(); return {x:e.clientX-rect.left, y:e.clientY-rect.top}; }

    function findNodeAt(sx,sy) {
        var v = toVirtual(sx,sy);
        for (var i=state.treeNodes.length-1; i>=0; i--) {
            var node = state.treeNodes[i];
            var dx=v.x-node.x, dy=v.y-node.y;
            var hitR = node.type==='leaf'?16:node.r+4;
            if (dx*dx+dy*dy <= hitR*hitR) return node;
        }
        return null;
    }

    function handleMouseDown(e) {
        if (e.target.tagName==='INPUT') return;
        var pos = getCanvasPos(e);
        var node = findNodeAt(pos.x, pos.y);
        if (node) { handleNodeClick(node); return; }
        state.isDragging=true; state.dragStartX=e.clientX; state.dragStartY=e.clientY;
        state.dragStartOffsetX=state.offsetX; state.dragStartOffsetY=state.offsetY;
        els.container.style.cursor='grabbing';
    }

    function handleMouseMove(e) {
        var pos = getCanvasPos(e);
        if (state.isDragging) {
            state.offsetX = state.dragStartOffsetX + (e.clientX - state.dragStartX);
            state.offsetY = state.dragStartOffsetY + (e.clientY - state.dragStartY);
            drawFrame(); return;
        }
        var node = findNodeAt(pos.x, pos.y);
        if (node !== state.hoveredNode) {
            state.hoveredNode = node;
            if (node) { els.container.style.cursor='pointer'; showTooltip(node, e.clientX, e.clientY); }
            else { els.container.style.cursor='grab'; hideTooltip(); }
            drawFrame();
        }
    }

    function handleMouseUp() {
        if (state.isDragging) { state.isDragging=false; els.container.style.cursor=state.hoveredNode?'pointer':'grab'; }
    }

    function handleWheel(e) {
        e.preventDefault();
        var pos = getCanvasPos(e);
        var delta = e.deltaY>0 ? -0.08 : 0.08;
        var newScale = Math.max(0.4, Math.min(2.5, state.scale+delta));
        var vBefore = toVirtual(pos.x, pos.y);
        state.scale = newScale;
        var vAfter = toVirtual(pos.x, pos.y);
        state.offsetX += (vAfter.x - vBefore.x) * state.scale;
        state.offsetY += (vAfter.y - vBefore.y) * state.scale;
        drawFrame();
    }

    function handleTouchStart(e) {
        if (e.touches.length===1) {
            var rect = els.canvas.getBoundingClientRect();
            var pos = {x:e.touches[0].clientX-rect.left, y:e.touches[0].clientY-rect.top};
            var node = findNodeAt(pos.x, pos.y);
            if (node) { handleNodeClick(node); return; }
            state.isDragging=true; state.dragStartX=e.touches[0].clientX; state.dragStartY=e.touches[0].clientY;
            state.dragStartOffsetX=state.offsetX; state.dragStartOffsetY=state.offsetY;
        }
    }

    function handleTouchMove(e) {
        if (!state.isDragging || e.touches.length!==1) return;
        e.preventDefault();
        state.offsetX = state.dragStartOffsetX + (e.touches[0].clientX - state.dragStartX);
        state.offsetY = state.dragStartOffsetY + (e.touches[0].clientY - state.dragStartY);
        drawFrame();
    }

    function handleTouchEnd() { state.isDragging = false; }

    function handleNodeClick(node) {
        if (node.type==='root') { showModal(node.data.name, '诗歌起源', buildRootContent(node.data)); }
        else if (node.type==='dynasty') { var d=POETRY_DATABASE.dynasties[node.id]; showModal(d.name, '辉煌时代', buildDynastyContent(d)); }
        else if (node.type==='branch') { showModal(node.data.name, '诗词流派', buildBranchContent(node.data)); }
        else if (node.type==='poet') { showModal(node.data.name, '诗人', buildPoetContent(node.data)); }
        else if (node.type==='leaf') {
            var poet = findPoet(node.poetId, node.dynastyKey, node.branchKey);
            if (poet) showModal(node.data.title, '【'+node.poetName+'】', buildPoemContent(node.data));
        }
    }

    function findPoet(poetId, dynastyKey, branchKey) {
        var d = POETRY_DATABASE.dynasties[dynastyKey];
        if (!d||!d.branches) return null;
        var b = d.branches[branchKey];
        if (!b||!b.poets) return null;
        return b.poets.find(function(p) { return p.id===poetId; });
    }

    function showTooltip(node, mx, my) {
        var text = node.label||node.poemTitle||'';
        if (node.type==='leaf') text = node.poemTitle+' - '+node.poetName;
        els.tooltip.textContent = text;
        els.tooltip.style.left = (mx+15)+'px'; els.tooltip.style.top = (my-30)+'px';
        els.tooltip.classList.add('visible');
    }

    function hideTooltip() { els.tooltip.classList.remove('visible'); }

    function showModal(title, subtitle, html) {
        els.modalTitle.textContent = title; els.modalSubtitle.textContent = subtitle;
        els.modalBody.innerHTML = html; els.modal.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() { els.modal.classList.remove('active'); document.body.style.overflow = ''; }

    function buildRootContent(root) {
        return '<div class="section-title">简介</div><p class="description">'+root.description+'</p><div class="section-title">概述</div><p class="description">'+root.content.replace(/\n/g,'<br>')+'</p><div class="section-title">特色</div><div class="notes"><p>'+root.features.join(' · ')+'</p></div>';
    }

    function buildDynastyContent(dynasty) {
        var poets=[];
        var branches=dynasty.branches||{};
        Object.values(branches).forEach(function(b) { if(b.poets) b.poets.forEach(function(p) { poets.push(p.name); }); });
        return '<div class="section-title">代表成就</div><p class="description">'+dynasty.name+'是中国诗词史上的黄金时代，涌现了众多杰出诗人，如：'+poets.join('、')+'等。</p><div class="section-title">主要流派</div><div class="notes"><p>'+Object.values(branches).map(function(b){return b.name}).join(' · ')+'</p></div>';
    }

    function buildBranchContent(branch) {
        var html = '<div class="section-title">流派简介</div><p class="description">'+branch.name+'是中国诗歌的重要流派，以独特的艺术风格著称于世。</p><div class="section-title">代表诗人</div>';
        if (branch.poets) { branch.poets.forEach(function(poet) { html+='<div class="notes"><p><strong>'+poet.name+'</strong>：'+poet.description+'</p></div>'; }); }
        return html;
    }

    function buildPoetContent(poet) {
        var html = '<div class="section-title">人物简介</div><p class="description">'+poet.description+'</p>';
        if (poet.poems&&poet.poems.length>0) { html+='<div class="section-title">代表作品</div><div class="notes"><p>'+poet.poems.map(function(p){return p.title}).join('、')+'</p></div>'; }
        return html;
    }

    function buildPoemContent(poem) {
        return '<div class="section-title">原文</div><div class="poem-content"><p>'+poem.content.replace(/\n/g,'<br>')+'</p></div><div class="section-title">注释</div><div class="notes"><p>'+poem.notes+'</p></div><div class="section-title">赏析</div><p class="appreciation">'+poem.appreciation+'</p>';
    }

    function handleSearch(e) {
        var query = e.target.value.trim().toLowerCase();
        if (query.length===0) { els.searchResults.classList.remove('active'); clearHighlights(); return; }
        var results = searchPoems(query);
        displaySearchResults(results);
        if (results.length>0) highlightLeaves(results); else clearHighlights();
    }

    function searchPoems(query) {
        var results=[];
        Object.entries(POETRY_DATABASE.dynasties).forEach(function(entry) {
            var dKey=entry[0], dynasty=entry[1];
            if (dynasty.branches) {
                Object.entries(dynasty.branches).forEach(function(be) {
                    var bKey=be[0], branch=be[1];
                    if (branch.poets) {
                        branch.poets.forEach(function(poet) {
                            if (poet.poems) {
                                poet.poems.forEach(function(poem) {
                                    if (poem.title.toLowerCase().indexOf(query)>=0 || poem.content.toLowerCase().indexOf(query)>=0) {
                                        results.push({poem:poem, poet:poet, dynasty:dynasty.name, dKey:dKey, bKey:bKey});
                                    }
                                });
                            }
                        });
                    }
                });
            }
        });
        return results;
    }

    function displaySearchResults(results) {
        els.searchResults.innerHTML = '';
        if (results.length===0) { els.searchResults.innerHTML='<div class="search-result-item"><span class="poem-title">未找到相关诗词</span></div>'; }
        else {
            results.slice(0,10).forEach(function(r) {
                var item = document.createElement('div'); item.className='search-result-item';
                item.innerHTML = '<div class="poem-title">'+r.poem.title+'</div><div class="poem-author">'+r.poet.name+'</div><div class="poem-dynasty">'+r.dynasty+'</div>';
                item.addEventListener('click', function() { focusOnPoem(r); els.searchResults.classList.remove('active'); els.searchInput.value=r.poem.title; });
                els.searchResults.appendChild(item);
            });
        }
        els.searchResults.classList.add('active');
    }

    function highlightLeaves(results) { clearHighlights(); results.forEach(function(r) { state.highlightedLeafIds.add(r.poem.id); }); drawFrame(); }
    function clearHighlights() { state.highlightedLeafIds.clear(); drawFrame(); }

    function focusOnPoem(result) {
        var leaf = state.leaves.find(function(l) { return l.id===result.poem.id; });
        if (leaf) {
            var screen = toScreen(leaf.x, leaf.y);
            state.offsetX = state.canvasW/2 - screen.sx + state.offsetX;
            state.offsetY = state.canvasH/2 - screen.sy + state.offsetY;
            state.scale = 1.5;
            state.highlightedLeafIds.clear(); state.highlightedLeafIds.add(leaf.id);
            drawFrame();
            var poet = findPoet(leaf.poetId, leaf.dynastyKey, leaf.branchKey);
            if (poet) showModal(leaf.data.title, '【'+leaf.poetName+'】', buildPoemContent(leaf.data));
        }
    }

    function bindEvents() {
        els.container.addEventListener('mousedown', handleMouseDown);
        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);
        els.container.addEventListener('wheel', handleWheel, {passive:false});
        els.container.addEventListener('touchstart', handleTouchStart, {passive:false});
        els.container.addEventListener('touchmove', handleTouchMove, {passive:false});
        els.container.addEventListener('touchend', handleTouchEnd);
        els.searchInput.addEventListener('input', handleSearch);
        els.searchInput.addEventListener('focus', function() { if (els.searchResults.children.length>0) els.searchResults.classList.add('active'); });
        document.addEventListener('click', function(e) { if (!e.target.closest('.search-box')) els.searchResults.classList.remove('active'); });
        els.modalClose.addEventListener('click', closeModal);
        els.modal.addEventListener('click', function(e) { if (e.target===els.modal) closeModal(); });
        document.addEventListener('keydown', function(e) { if (e.key==='Escape') closeModal(); });
        window.addEventListener('resize', function() { resizeCanvas(); drawFrame(); });
    }

    function startLoadingSequence() {
        setTimeout(function() {
            els.overlay.classList.add('fade-out');
            setTimeout(function() { els.overlay.style.display='none'; startGrowthAnimation(); }, 1200);
        }, 2000);
    }

    function init() {
        resizeCanvas();
        computeTreeLayout();
        state.offsetX = state.canvasW/2 - 800;
        state.offsetY = state.canvasH/2 - 580;
        bindEvents();
        startLoadingSequence();
        if (els.ctx) drawFrame();
    }

    document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
