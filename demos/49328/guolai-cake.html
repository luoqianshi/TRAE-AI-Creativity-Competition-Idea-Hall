<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>果赖蛋糕坊 - DIY你的梦想甜品</title>
<style>
/* ===== CSS VARIABLES & RESET ===== */
:root {
  --pink: #FFB6C1;
  --pink-light: #FFDDE6;
  --pink-dark: #FF85A2;
  --purple: #DDA0DD;
  --purple-light: #F0E0F6;
  --purple-dark: #B57EDC;
  --blue: #ADD8E6;
  --blue-light: #D6EEF8;
  --blue-dark: #7EC8E3;
  --yellow: #FFF3B0;
  --yellow-light: #FFFDE0;
  --yellow-dark: #FFE066;
  --green: #B8E6B8;
  --green-light: #E0F5E0;
  --green-dark: #77DD77;
  --white: #FFFFFF;
  --bg: #FFF8FB;
  --text: #5A3E6B;
  --text-light: #9B8AAD;
  --shadow: 0 4px 15px rgba(180,130,200,0.2);
  --shadow-hover: 0 6px 20px rgba(180,130,200,0.35);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: all 0.3s ease;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== ANIMATIONS ===== */
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
@keyframes sparkle {
  0%,100% { opacity:1; transform:scale(1); }
  50% { opacity:0.5; transform:scale(1.2); }
}
@keyframes slideUp {
  from { opacity:0; transform:translateY(20px); }
  to { opacity:1; transform:translateY(0); }
}
@keyframes popIn {
  0% { opacity:0; transform:scale(0.8); }
  60% { transform:scale(1.05); }
  100% { opacity:1; transform:scale(1); }
}
@keyframes candleFlicker {
  0%,100% { transform: scaleY(1) scaleX(1); opacity:1; }
  25% { transform: scaleY(1.1) scaleX(0.9); opacity:0.9; }
  50% { transform: scaleY(0.9) scaleX(1.1); opacity:1; }
  75% { transform: scaleY(1.05) scaleX(0.95); opacity:0.95; }
}

/* ===== HEADER ===== */
.header {
  background: linear-gradient(135deg, var(--pink-light), var(--purple-light), var(--blue-light));
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
  position: sticky;
  top: 0;
  z-index: 1000;
}
.logo {
  font-size: 28px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--pink-dark), var(--purple-dark));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: float 3s ease-in-out infinite;
}
.logo-sub {
  font-size: 12px;
  color: var(--text-light);
  margin-left: 8px;
}
.header-actions {
  display: flex;
  gap: 8px;
}
.btn {
  padding: 8px 18px;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.btn:active { transform: translateY(0); }
.btn-primary {
  background: linear-gradient(135deg, var(--pink), var(--purple));
  color: white;
}
.btn-secondary {
  background: var(--white);
  color: var(--text);
  border: 2px solid var(--purple-light);
}
.btn-success {
  background: linear-gradient(135deg, var(--green), var(--blue));
  color: white;
}
.btn-yellow {
  background: linear-gradient(135deg, var(--yellow), #FFE4B5);
  color: var(--text);
}
.btn-voice {
  background: linear-gradient(135deg, var(--blue), var(--purple));
  color: white;
  position: relative;
}
.btn-voice.recording::after {
  content: '';
  position: absolute;
  top: -4px; right: -4px;
  width: 12px; height: 12px;
  background: #FF4444;
  border-radius: 50%;
  animation: sparkle 1s infinite;
}
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-lg { padding: 12px 28px; font-size: 16px; }

/* ===== TABS ===== */
.tabs {
  display: flex;
  justify-content: center;
  gap: 4px;
  padding: 10px 16px;
  background: var(--white);
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  position: sticky;
  top: 56px;
  z-index: 999;
  flex-wrap: wrap;
}
.tab {
  padding: 10px 24px;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  transition: var(--transition);
  background: var(--bg);
  color: var(--text-light);
}
.tab:hover { background: var(--purple-light); color: var(--text); }
.tab.active {
  background: linear-gradient(135deg, var(--pink), var(--purple));
  color: white;
  box-shadow: var(--shadow);
}

/* ===== MAIN LAYOUT ===== */
.main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 16px;
  display: flex;
  gap: 16px;
  min-height: calc(100vh - 180px);
}
.canvas-area {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.canvas-wrapper {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  overflow: hidden;
}
.canvas-wrapper canvas {
  border-radius: var(--radius-sm);
  cursor: crosshair;
  max-width: 100%;
  height: auto;
}
.toolbar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: 320px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-height: calc(100vh - 180px);
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--purple-light) transparent;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--purple-light); border-radius: 3px; }
.panel {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px;
  animation: slideUp 0.3s ease;
}
.panel-title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.panel-title .icon { font-size: 18px; }

/* ===== SHAPE / COLOR PICKERS ===== */
.shape-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.shape-btn {
  aspect-ratio: 1;
  border: 2px solid var(--purple-light);
  border-radius: var(--radius-sm);
  background: var(--white);
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  gap: 4px;
  padding: 6px;
}
.shape-btn:hover { border-color: var(--purple); background: var(--purple-light); }
.shape-btn.active { border-color: var(--purple-dark); background: var(--purple-light); box-shadow: 0 0 0 2px var(--purple); }
.shape-btn canvas { pointer-events: none; }

.color-grid {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.color-swatch {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 3px solid transparent;
  cursor: pointer;
  transition: var(--transition);
}
.color-swatch:hover { transform: scale(1.15); }
.color-swatch.active { border-color: var(--text); box-shadow: 0 0 0 2px var(--purple); }

/* ===== SLIDER ===== */
.slider-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 8px 0;
}
.slider-row label {
  font-size: 13px;
  min-width: 60px;
}
.slider-row input[type="range"] {
  flex: 1;
  accent-color: var(--purple-dark);
}
.slider-row .val {
  font-size: 13px;
  font-weight: 600;
  min-width: 30px;
  text-align: center;
}

/* ===== DECORATION GRID ===== */
.deco-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.deco-btn {
  padding: 8px 4px;
  border: 2px solid var(--purple-light);
  border-radius: var(--radius-sm);
  background: var(--white);
  cursor: pointer;
  transition: var(--transition);
  text-align: center;
  font-size: 11px;
}
.deco-btn:hover { border-color: var(--purple); background: var(--purple-light); }
.deco-btn.active { border-color: var(--purple-dark); background: var(--purple-light); }
.deco-btn .deco-icon { font-size: 22px; display: block; }

/* ===== INPUT ===== */
.input-group {
  margin: 8px 0;
}
.input-group label {
  display: block;
  font-size: 13px;
  margin-bottom: 4px;
  color: var(--text-light);
}
.input-group input, .input-group textarea, .input-group select {
  width: 100%;
  padding: 8px 12px;
  border: 2px solid var(--purple-light);
  border-radius: var(--radius-sm);
  font-size: 14px;
  outline: none;
  transition: var(--transition);
  background: var(--white);
}
.input-group input:focus, .input-group textarea:focus, .input-group select:focus {
  border-color: var(--purple);
}

/* ===== TOGGLE SWITCH ===== */
.toggle {
  position: relative;
  width: 44px; height: 24px;
  display: inline-block;
}
.toggle input { display: none; }
.toggle .slider {
  position: absolute;
  inset: 0;
  background: var(--purple-light);
  border-radius: 12px;
  cursor: pointer;
  transition: var(--transition);
}
.toggle .slider::before {
  content: '';
  position: absolute;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: white;
  top: 2px; left: 2px;
  transition: var(--transition);
}
.toggle input:checked + .slider { background: var(--purple-dark); }
.toggle input:checked + .slider::before { left: 22px; }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 2000;
  display: none;
  justify-content: center;
  align-items: center;
  animation: fadeIn 0.2s;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--white);
  border-radius: var(--radius);
  padding: 24px;
  max-width: 500px;
  width: 90%;
  max-height: 85vh;
  overflow-y: auto;
  animation: popIn 0.3s ease;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.modal-title {
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 16px;
  text-align: center;
}
.modal-close {
  float: right;
  font-size: 24px;
  cursor: pointer;
  color: var(--text-light);
  background: none;
  border: none;
  line-height: 1;
}
.modal-close:hover { color: var(--text); }
.modal-body { margin: 16px 0; }
.modal-footer {
  text-align: center;
  margin-top: 16px;
}

/* ===== SHARE PANEL ===== */
.share-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 16px;
}
.share-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 16px;
  border: 2px solid var(--purple-light);
  border-radius: var(--radius);
  cursor: pointer;
  transition: var(--transition);
  background: var(--white);
  font-size: 13px;
  font-weight: 600;
}
.share-btn:hover { border-color: var(--purple); background: var(--purple-light); transform: translateY(-2px); }
.share-btn .share-icon { font-size: 36px; }

/* ===== FOOTER ===== */
.footer {
  text-align: center;
  padding: 16px;
  background: linear-gradient(135deg, var(--pink-light), var(--purple-light));
  color: var(--text-light);
  font-size: 13px;
  margin-top: 20px;
}
.footer a { color: var(--purple-dark); text-decoration: none; }

/* ===== TOAST ===== */
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: linear-gradient(135deg, var(--purple), var(--pink-dark));
  color: white;
  padding: 12px 24px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  z-index: 3000;
  opacity: 0;
  transition: var(--transition);
  box-shadow: var(--shadow);
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== MODULE PANELS HIDDEN BY DEFAULT ===== */
.module-panel { display: none; }
.module-panel.active { display: flex; }

/* ===== REPLAY BAR ===== */
.replay-bar {
  background: var(--white);
  border-radius: var(--radius-sm);
  padding: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: var(--shadow);
}
.replay-bar .progress {
  flex: 1;
  height: 8px;
  background: var(--purple-light);
  border-radius: 4px;
  overflow: hidden;
}
.replay-bar .progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--pink), var(--purple));
  border-radius: 4px;
  width: 0%;
  transition: width 0.1s;
}

/* ===== MODE TOGGLE ===== */
.mode-toggle {
  display: flex;
  background: var(--purple-light);
  border-radius: var(--radius-sm);
  overflow: hidden;
  margin: 8px 0;
}
.mode-toggle button {
  flex: 1;
  padding: 6px 12px;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: var(--transition);
  color: var(--text-light);
}
.mode-toggle button.active {
  background: var(--purple-dark);
  color: white;
}

/* ===== SECTION HIDDEN ===== */
.hidden { display: none !important; }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .main {
    flex-direction: column;
  }
  .sidebar {
    width: 100%;
    max-height: none;
    overflow-y: visible;
  }
  .header {
    padding: 8px 12px;
  }
  .logo { font-size: 22px; }
  .tabs { top: 48px; }
  .tab { padding: 8px 14px; font-size: 13px; }
  .shape-grid { grid-template-columns: repeat(4, 1fr); }
  .deco-grid { grid-template-columns: repeat(4, 1fr); }
}

/* ===== VOICE INDICATOR ===== */
.voice-indicator {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: var(--blue-light);
  border-radius: 20px;
  font-size: 12px;
  color: var(--text);
  margin: 4px 0;
}
.voice-indicator .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #FF4444;
  animation: sparkle 1s infinite;
}

/* ===== ORDER FORM ===== */
.order-form .input-group {
  margin: 12px 0;
}
.order-row {
  display: flex;
  gap: 12px;
}
.order-row .input-group { flex: 1; }
</style>
</head>
<body>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- HEADER -->
<header class="header">
  <div style="display:flex;align-items:baseline;">
    <span class="logo">🎂 果赖蛋糕坊</span>
    <span class="logo-sub">DIY你的梦想甜品</span>
  </div>
  <div class="header-actions">
    <button class="btn btn-primary" onclick="openShareModal()">📤 分享</button>
    <button class="btn btn-success" onclick="openOrderModal()">🛒 下单</button>
  </div>
</header>

<!-- TABS -->
<nav class="tabs">
  <button class="tab active" data-tab="cake" onclick="switchTab('cake')">🎂 蛋糕DIY</button>
  <button class="tab" data-tab="tea" onclick="switchTab('tea')">🧋 奶茶DIY</button>
  <button class="tab" data-tab="dessert" onclick="switchTab('dessert')">🍪 点心DIY</button>
  <button class="tab" data-tab="replay" onclick="switchTab('replay')">🎬 创作回放</button>
</nav>

<!-- MAIN CONTENT -->
<div class="main">
  <!-- Canvas Area -->
  <div class="canvas-area">
    <!-- ===== CAKE MODULE ===== -->
    <div id="cake-panel" class="module-panel active" style="flex-direction:column;">
      <div class="toolbar">
        <button class="btn btn-secondary btn-sm" onclick="undoAction()">↩ 撤销</button>
        <button class="btn btn-secondary btn-sm" onclick="redoAction()">↪ 重做</button>
        <button class="btn btn-secondary btn-sm" onclick="clearCake()">🗑 清空</button>
        <button class="btn btn-yellow btn-sm" onclick="downloadImage()">💾 保存图片</button>
        <button class="btn btn-voice btn-sm" id="voiceBtn" onclick="toggleVoice()">🎤 语音</button>
      </div>
      <div class="canvas-wrapper">
        <canvas id="cakeCanvas" width="600" height="500"></canvas>
      </div>
      <div class="toolbar" id="voiceHint" style="display:none;">
        <div class="voice-indicator">
          <span class="dot"></span>
          <span>正在听你说... 试试说"草莓""蜡烛""奶油"</span>
        </div>
      </div>
    </div>

    <!-- ===== TEA MODULE ===== -->
    <div id="tea-panel" class="module-panel" style="flex-direction:column;">
      <div class="toolbar">
        <button class="btn btn-secondary btn-sm" onclick="undoTeaAction()">↩ 撤销</button>
        <button class="btn btn-secondary btn-sm" onclick="clearTea()">🗑 清空</button>
        <button class="btn btn-yellow btn-sm" onclick="downloadTeaImage()">💾 保存图片</button>
      </div>
      <div class="canvas-wrapper">
        <canvas id="teaCanvas" width="600" height="500"></canvas>
      </div>
    </div>

    <!-- ===== DESSERT MODULE ===== -->
    <div id="dessert-panel" class="module-panel" style="flex-direction:column;">
      <div class="toolbar">
        <button class="btn btn-secondary btn-sm" onclick="undoDessertAction()">↩ 撤销</button>
        <button class="btn btn-secondary btn-sm" onclick="clearDessert()">🗑 清空</button>
        <button class="btn btn-yellow btn-sm" onclick="downloadDessertImage()">💾 保存图片</button>
      </div>
      <div class="canvas-wrapper">
        <canvas id="dessertCanvas" width="600" height="500"></canvas>
      </div>
    </div>

    <!-- ===== REPLAY MODULE ===== -->
    <div id="replay-panel" class="module-panel" style="flex-direction:column;">
      <div class="canvas-wrapper">
        <canvas id="replayCanvas" width="600" height="500"></canvas>
      </div>
      <div class="replay-bar">
        <button class="btn btn-primary btn-sm" id="replayPlayBtn" onclick="startReplay()">▶ 播放</button>
        <div class="progress">
          <div class="progress-fill" id="replayProgress"></div>
        </div>
        <span id="replayTime" style="font-size:12px;min-width:40px;">0:00</span>
      </div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <!-- ===== CAKE CONTROLS ===== -->
    <div id="cake-controls">
      <!-- Layer Control -->
      <div class="panel">
        <div class="panel-title"><span class="icon">🍰</span> 蛋糕层数</div>
        <div class="slider-row">
          <label>层数</label>
          <input type="range" min="1" max="5" value="2" id="layerCount" oninput="updateLayerCount(this.value)">
          <span class="val" id="layerVal">2</span>
        </div>
        <div id="layerSettings"></div>
      </div>

      <!-- Cream -->
      <div class="panel">
        <div class="panel-title"><span class="icon">🧁</span> 奶油</div>
        <div class="color-grid" id="creamColors"></div>
        <div class="mode-toggle">
          <button class="active" onclick="setCreamMode('auto',this)">自动挤花</button>
          <button onclick="setCreamMode('draw',this)">手绘挤花</button>
        </div>
        <div class="slider-row">
          <label>挤花密度</label>
          <input type="range" min="5" max="30" value="15" id="creamDensity" oninput="updateCake()">
          <span class="val" id="creamDensityVal">15</span>
        </div>
      </div>

      <!-- Decorations -->
      <div class="panel">
        <div class="panel-title"><span class="icon">🍓</span> 装饰素材</div>
        <div class="mode-toggle">
          <button class="active" onclick="setDecoMode('place',this)">放置模式</button>
          <button onclick="setDecoMode('draw',this)">手绘模式</button>
        </div>
        <div class="deco-grid" id="decoGrid"></div>
      </div>

      <!-- Sprinkles -->
      <div class="panel">
        <div class="panel-title"><span class="icon">✨</span> 撒装饰</div>
        <div class="mode-toggle">
          <button class="active" onclick="setSprinkleMode('auto',this)">自动撒</button>
          <button onclick="setSprinkleMode('draw',this)">手绘撒</button>
        </div>
        <div class="color-grid" id="sprinkleColors"></div>
        <button class="btn btn-primary btn-sm" style="width:100%;margin-top:8px;" onclick="autoSprinkle()">🌈 随机撒装饰</button>
      </div>

      <!-- Candles -->
      <div class="panel">
        <div class="panel-title"><span class="icon">🕯️</span> 蜡烛</div>
        <div class="slider-row">
          <label>数量</label>
          <input type="range" min="0" max="10" value="0" id="candleCount" oninput="updateCandleCount(this.value)">
          <span class="val" id="candleVal">0</span>
        </div>
        <div class="deco-grid" id="candleStyles">
          <button class="deco-btn active" onclick="setCandleStyle('thin',this)"><span class="deco-icon">🕯️</span>彩色细烛</button>

<script>
// ============================================================
// GLOBAL STATE
// ============================================================

  {id:'eclair', name:'泡芙', emoji:'🥖'},
  {id:'mochi', name:'麻薯', emoji:'🍡'},
  {id:'tart', name:'蛋挞', emoji:'🥧'},
  {id:'roll', name:'蛋糕卷', emoji:' 🎂'}
];
const DESSERT_DECOS = [
  {id:'sprinkle', name:'糖粉', emoji:'✨'},
  {id:'chocodip', name:'巧克力淋', emoji:'🍫'},
  {id:'fruit', name:'水果', emoji:'🍓'},
  {id:'nut', name:'坚果', emoji:'🥜'},

  {id:'candy', name:'糖珠', emoji:'🍬'}

const SHAPE_TYPES = ['circle','square','rectangle','semi'];

// Cake State
let cakeState = {
  layers: [
    {shape:'circle', color:'#FFB6C1'},
    {shape:'circle', color:'#FFF0F5'}
  ],
  creamColor: '#FFFFFF',
  creamMode: 'auto',
  creamDensity: 15,
  decoMode: 'place',
  activeDeco: null,
  decorations: [],
  candleCount: 0,
  candleStyle: 'thin',
  tagText: '生日快乐',
  tagShow: true,
  tagPosX: 50,
  sprinkleMode: 'auto',
  sprinkleColor: '#FF0000',
  sprinkles: []
};

// Tea State
let teaState = {
  cupType: 'round',
  cupColor: '#87CEEB',
  cupPattern: 'none',
  toppings: {},
  creamHeight: 30,
  teaCreamColor: '#FFFFFF',
  drawMode: false,
  drawColor: '#FF69B4',
  drawSize: 3,
  drawings: [],
  currentStroke: null
};

// Dessert State
let dessertState = {
  template: 'macaron',
  color1: '#FFB6C1',
  color2: '#DDA0DD',
  activeDecos: new Set(),
  sprinkleItems: []
};

// History for undo/redo
let cakeHistory = [];
let cakeHistoryIndex = -1;
let teaHistory = [];
let teaHistoryIndex = -1;
let dessertHistory = [];
let dessertHistoryIndex = -1;

// Action log for replay
let actionLog = [];

// Replay state
let replayState = { playing: false, progress: 0 };

// Voice
let voiceActive = false;
let recognition = null;

// Canvas refs
let cakeCanvas, cakeCtx, teaCanvas, teaCtx, dessertCanvas, dessertCtx, replayCanvas, replayCtx;

// Drawing state
let isDrawing = false;
let currentDrawPath = [];

// ============================================================
// INITIALIZATION
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  cakeCanvas = document.getElementById('cakeCanvas');
  cakeCtx = cakeCanvas.getContext('2d');
  teaCanvas = document.getElementById('teaCanvas');
  teaCtx = teaCanvas.getContext('2d');
  dessertCanvas = document.getElementById('dessertCanvas');
  dessertCtx = dessertCanvas.getContext('2d');
  replayCanvas = document.getElementById('replayCanvas');
  replayCtx = replayCanvas.getContext('2d');

  initUI();
  initCanvasEvents();
  updateCake();
  saveCakeHistory();
  updateTea();
  saveTeaHistory();
  updateDessert();
  saveDessertHistory();

  // Set default date
  const d = new Date();
  d.setDate(d.getDate() + 3);
  document.getElementById('orderDate').value = d.toISOString().split('T')[0];
});

function initUI() {
  // Cream colors
  let html = '';
  CREAM_COLORS.forEach((c, i) => {
    html += `<div class="color-swatch ${i===0?'active':''}" style="background:${c}" onclick="setCreamColor('${c}',this)"></div>`;
  });
  document.getElementById('creamColors').innerHTML = html;

  // Sprinkle colors
  html = '';
  SPRINKLE_COLORS.forEach((c, i) => {
    html += `<div class="color-swatch ${i===0?'active':''}" style="background:${c}" onclick="setSprinkleColor('${c}',this)"></div>`;
  });
  document.getElementById('sprinkleColors').innerHTML = html;

  // Decorations
  html = '';
  DECO_ITEMS.forEach(d => {
    html += `<button class="deco-btn" data-deco="${d.id}" onclick="selectDeco('${d.id}',this)"><span class="deco-icon">${d.emoji}</span>${d.name}</button>`;
  });
  document.getElementById('decoGrid').innerHTML = html;

  // Cup shapes
  html = '';
  CUP_TYPES.forEach((c, i) => {
    html += `<button class="shape-btn ${i===0?'active':''}" onclick="setCupType('${c.id}',this)"><span style="font-size:24px;">${c.emoji}</span>${c.name}</button>`;
  });
  document.getElementById('cupShapes').innerHTML = html;

  // Tea toppings
  html = '';
  TEA_TOPPINGS.forEach(t => {
    html += `<button class="deco-btn" data-topping="${t.id}" onclick="toggleTopping('${t.id}',this)"><span class="deco-icon">${t.emoji}</span>${t.name}</button>`;
  });
  document.getElementById('teaToppings').innerHTML = html;

  // Tea cream colors
  html = '';
  CREAM_COLORS.slice(0,6).forEach((c, i) => {
    html += `<div class="color-swatch ${i===0?'active':''}" style="background:${c}" onclick="setTeaCreamColor('${c}',this)"></div>`;
  });
  document.getElementById('teaCreamColors').innerHTML = html;

  // Dessert templates
  html = '';
  DESSERT_TEMPLATES.forEach((t, i) => {
    html += `<button class="deco-btn ${i===0?'active':''}" data-dessert="${t.id}" onclick="setDessertTemplate('${t.id}',this)"><span class="deco-icon">${t.emoji}</span>${t.name}</button>`;
  });
  document.getElementById('dessertTemplates').innerHTML = html;

  // Dessert decorations
  html = '';
  DESSERT_DECOS.forEach(d => {
    html += `<button class="deco-btn" data-ddeco="${d.id}" onclick="toggleDessertDeco('${d.id}',this)"><span class="deco-icon">${d.emoji}</span>${d.name}</button>`;
  });
  document.getElementById('dessertDecos').innerHTML = html;

  // Layer settings
  updateLayerSettings();
}

function initCanvasEvents() {
  // Cake canvas
  cakeCanvas.addEventListener('mousedown', (e) => onCanvasDown(e, 'cake'));
  cakeCanvas.addEventListener('mousemove', (e) => onCanvasMove(e, 'cake'));
  cakeCanvas.addEventListener('mouseup', (e) => onCanvasUp(e, 'cake'));
  cakeCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); onCanvasDown(e.touches[0], 'cake'); }, {passive:false});
  cakeCanvas.addEventListener('touchmove', (e) => { e.preventDefault(); onCanvasMove(e.touches[0], 'cake'); }, {passive:false});
  cakeCanvas.addEventListener('touchend', (e) => { e.preventDefault(); onCanvasUp(e, 'cake'); }, {passive:false});

  // Tea canvas
  teaCanvas.addEventListener('mousedown', (e) => onTeaCanvasDown(e));
  teaCanvas.addEventListener('mousemove', (e) => onTeaCanvasMove(e));
  teaCanvas.addEventListener('mouseup', (e) => onTeaCanvasUp(e));
  teaCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); onTeaCanvasDown(e.touches[0]); }, {passive:false});
  teaCanvas.addEventListener('touchmove', (e) => { e.preventDefault(); onTeaCanvasMove(e.touches[0]); }, {passive:false});
  teaCanvas.addEventListener('touchend', (e) => { e.preventDefault(); onTeaCanvasUp(e); }, {passive:false});
}

// ============================================================
// TAB SWITCHING
// ============================================================
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

  document.querySelectorAll('.module-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`${tab}-panel`).classList.add('active');

  // Show/hide controls
  document.getElementById('cake-controls').classList.toggle('hidden', tab !== 'cake');
  document.getElementById('tea-controls').classList.toggle('hidden', tab !== 'tea');
  document.getElementById('dessert-controls').classList.toggle('hidden', tab !== 'dessert');
  document.getElementById('replay-controls').classList.toggle('hidden', tab !== 'replay');
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ============================================================
// MODAL
// ============================================================
function openShareModal() {
  const preview = document.getElementById('sharePreview');
  const pCtx = preview.getContext('2d');
  const activeCanvas = document.querySelector('.module-panel.active canvas:not(#sharePreview):not(#replayCanvas)');
  if (activeCanvas) {
    pCtx.clearRect(0,0,300,250);
    pCtx.drawImage(activeCanvas, 0,0,300,250);
  }
  document.getElementById('shareModal').classList.add('show');
}
function openOrderModal() {
  document.getElementById('orderModal').classList.add('show');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}
function simulateShare(platform) {
  closeModal('shareModal');
  showToast(`已分享到${platform}！`);
  logAction('分享', `分享作品到${platform}`);
}

// ============================================================
// ORDER
// ============================================================
function submitOrder() {
  const name = document.getElementById('orderName').value.trim();
  const phone = document.getElementById('orderPhone').value.trim();
  const addr = document.getElementById('orderAddr').value.trim();
  if (!name || !phone || !addr) {
    showToast('请填写完整的收货信息');
    return;
  }
  const size = document.getElementById('orderSize').value;
  const date = document.getElementById('orderDate').value;
  closeModal('orderModal');
  showToast(`下单成功！${name}，您的${size}蛋糕预计${date}送达 🎉`);
  logAction('下单', `${name}下单${size}，预计${date}`);
}

// ============================================================
// HISTORY (UNDO/REDO)
// ============================================================
function saveCakeHistory() {
  const snap = JSON.stringify(cakeState);
  cakeHistory = cakeHistory.slice(0, cakeHistoryIndex + 1);
  cakeHistory.push(snap);
  cakeHistoryIndex = cakeHistory.length - 1;
  if (cakeHistory.length > 50) {
    cakeHistory.shift();
    cakeHistoryIndex--;
  }
}
function undoAction() {
  if (cakeHistoryIndex > 0) {
    cakeHistoryIndex--;
    cakeState = JSON.parse(cakeHistory[cakeHistoryIndex]);
    syncUIFromCakeState();
    updateCake();
    showToast('已撤销');
  }
}
function redoAction() {
  if (cakeHistoryIndex < cakeHistory.length - 1) {
    cakeHistoryIndex++;
    cakeState = JSON.parse(cakeHistory[cakeHistoryIndex]);
    syncUIFromCakeState();
    updateCake();
    showToast('已重做');
  }
}
function syncUIFromCakeState() {
  document.getElementById('layerCount').value = cakeState.layers.length;
  document.getElementById('layerVal').textContent = cakeState.layers.length;
  document.getElementById('candleCount').value = cakeState.candleCount;
  document.getElementById('candleVal').textContent = cakeState.candleCount;
  document.getElementById('tagText').value = cakeState.tagText;
  document.getElementById('tagShow').checked = cakeState.tagShow;
  document.getElementById('tagPosX').value = cakeState.tagPosX;
  updateLayerSettings();
}

function saveTeaHistory() {
  const snap = JSON.stringify(teaState);
  teaHistory = teaHistory.slice(0, teaHistoryIndex + 1);
  teaHistory.push(snap);
  teaHistoryIndex = teaHistory.length - 1;
  if (teaHistory.length > 50) { teaHistory.shift(); teaHistoryIndex--; }
}
function undoTeaAction() {
  if (teaHistoryIndex > 0) {
    teaHistoryIndex--;
    teaState = JSON.parse(teaHistory[teaHistoryIndex]);
    updateTea();
    showToast('已撤销');
  }
}
function saveDessertHistory() {
  const snap = JSON.stringify(dessertState);
  dessertHistory = dessertHistory.slice(0, dessertHistoryIndex + 1);
  dessertHistory.push(snap);
  dessertHistoryIndex = dessertHistory.length - 1;
  if (dessertHistory.length > 50) { dessertHistory.shift(); dessertHistoryIndex--; }
}
function undoDessertAction() {
  if (dessertHistoryIndex > 0) {
    dessertHistoryIndex--;
    dessertState = JSON.parse(dessertHistory[dessertHistoryIndex]);
    updateDessert();
    showToast('已撤销');
  }
}

// ============================================================

function logAction(type, detail) {
  actionLog.push({ type, detail, time: Date.now() });
  updateReplayLog();
}
function updateReplayLog() {
  const el = document.getElementById('replayLog');
  if (actionLog.length === 0) {
    el.innerHTML = '<p>还没有创作记录，开始DIY吧！</p>';
    return;
  }
  el.innerHTML = actionLog.map((a, i) => {
    const t = new Date(a.time);
    const ts = `${t.getMinutes().toString().padStart(2,'0')}:${t.getSeconds().toString().padStart(2,'0')}`;
    return `<div style="padding:4px 0;border-bottom:1px solid var(--purple-light);">${ts} - ${a.type}: ${a.detail}</div>`;
  }).join('');
}

function updateLayerCount(val) {
  val = parseInt(val);
  document.getElementById('layerVal').textContent = val;
  while (cakeState.layers.length < val) {
    const colors = ['#FFB6C1','#FFF0F5','#DDA0DD','#ADD8E6','#B8E6B8','#FFF3B0'];
    cakeState.layers.push({
      shape: 'circle',
      color: colors[cakeState.layers.length % colors.length]
    });
  }
  while (cakeState.layers.length > val) {
    cakeState.layers.pop();
  }
  updateLayerSettings();
  updateCake();
  saveCakeHistory();
  logAction('层数', `设置为${val}层`);
}

        <button class="btn btn-sm ${layer.shape==='semi'?'btn-primary':'btn-secondary'}" onclick="setLayerShape(${i},'semi',this)">半圆</button>

// ============================================================
// CANVAS DRAWING (CAKE)
// ============================================================
function getCanvasPos(e, canvas) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

function onCanvasDown(e, type) {
  const pos = getCanvasPos(e, cakeCanvas);

  if (cakeState.decoMode === 'draw' && cakeState.activeDeco) {
    // Hand-draw decorations
    isDrawing = true;
    currentDrawPath = [{ x: pos.x, y: pos.y, deco: cakeState.activeDeco }];
    return;
  }

  if (cakeState.creamMode === 'draw') {
    // Hand-draw cream
    isDrawing = true;
    currentDrawPath = [{ x: pos.x, y: pos.y, type: 'cream' }];
    return;
  }

  if (cakeState.sprinkleMode === 'draw') {
    isDrawing = true;
    currentDrawPath = [{ x: pos.x, y: pos.y, type: 'sprinkle' }];
    addSprinkleAt(pos.x, pos.y);
    updateCake();
    return;
  }

  // Place decoration
  if (cakeState.activeDeco) {
    const deco = DECO_ITEMS.find(d => d.id === cakeState.activeDeco);
    if (deco) {
      cakeState.decorations.push({
        id: deco.id,
        emoji: deco.emoji,
        name: deco.name,
        x: pos.x,
        y: pos.y
      });
      updateCake();
      saveCakeHistory();
      logAction('装饰', `放置了${deco.name}`);
    }
  }
}

function onCanvasMove(e, type) {
  if (!isDrawing) return;
  const pos = getCanvasPos(e, cakeCanvas);

  if (currentDrawPath.length > 0) {
    const last = currentDrawPath[0];
    if (last.deco) {
      // Hand-draw deco items along path
      if (Math.random() < 0.3) {
        cakeState.decorations.push({
          id: last.deco,
          emoji: DECO_ITEMS.find(d => d.id === last.deco)?.emoji || '✨',
          name: DECO_ITEMS.find(d => d.id === last.deco)?.name || '装饰',
          x: pos.x,
          y: pos.y
        });
        updateCake();
      }
    } else if (last.type === 'cream') {
      // Hand-draw cream path
      currentDrawPath.push({ x: pos.x, y: pos.y, type: 'cream' });
      updateCake();
    } else if (last.type === 'sprinkle') {
      addSprinkleAt(pos.x, pos.y);
      updateCake();
    }
  }
}

function onCanvasUp(e, type) {
  if (!isDrawing) return;
  isDrawing = false;
  if (currentDrawPath.length > 0 && currentDrawPath[0].type === 'cream') {
    // Save cream path
    if (!cakeState.creamPaths) cakeState.creamPaths = [];
    cakeState.creamPaths.push([...currentDrawPath]);
    saveCakeHistory();
    logAction('奶油', '手绘奶油路径');
  } else if (currentDrawPath.length > 0 && currentDrawPath[0].deco) {
    saveCakeHistory();
    logAction('装饰', `手绘放置了${DECO_ITEMS.find(d => d.id === currentDrawPath[0].deco)?.name || '装饰'}`);
  } else if (currentDrawPath.length > 0 && currentDrawPath[0].type === 'sprinkle') {
    saveCakeHistory();
    logAction('撒装饰', '手绘撒装饰');
  }
  currentDrawPath = [];
}

function addSprinkleAt(x, y) {
  cakeState.sprinkles.push({
    x: x + (Math.random()-0.5)*20,
    y: y + (Math.random()-0.5)*20,
    color: cakeState.sprinkleColor,
    size: 2 + Math.random() * 4,
    rotation: Math.random() * Math.PI * 2
  });
}

// ============================================================
// CAKE DRAWING ENGINE
// ============================================================
function updateCake() {
  const W = 600, H = 500;
  cakeCtx.clearRect(0, 0, W, H);

  // Background - soft gradient
  const bgGrad = cakeCtx.createRadialGradient(W/2, H/2, 50, W/2, H/2, 400);
  bgGrad.addColorStop(0, '#FFF8FB');
  bgGrad.addColorStop(1, '#FFF0F5');
  cakeCtx.fillStyle = bgGrad;
  cakeCtx.fillRect(0, 0, W, H);

  // Draw table/board
  cakeCtx.fillStyle = '#F5DEB3';
  cakeCtx.beginPath();
  cakeCtx.ellipse(W/2, H - 30, 250, 30, 0, 0, Math.PI * 2);
  cakeCtx.fill();
  cakeCtx.fillStyle = '#DEB887';
  cakeCtx.beginPath();
  cakeCtx.ellipse(W/2, H - 25, 250, 25, 0, 0, Math.PI);
  cakeCtx.fill();

  // Plate
  cakeCtx.fillStyle = '#FFFFFF';
  cakeCtx.strokeStyle = '#E0E0E0';
  cakeCtx.lineWidth = 2;
  cakeCtx.beginPath();
  cakeCtx.ellipse(W/2, H - 35, 230, 22, 0, 0, Math.PI * 2);
  cakeCtx.fill();
  cakeCtx.stroke();

  const numLayers = cakeState.layers.length;
  const layerHeight = 45;
  const baseY = H - 60;
  const centerX = W / 2;

  // Draw layers bottom to top
  for (let i = numLayers - 1; i >= 0; i--) {
    const layer = cakeState.layers[i];
    const layerW = 160 + (numLayers - i) * 20;
    const y = baseY - i * layerHeight;

    drawCakeLayer(cakeCtx, centerX, y, layerW, layerHeight, layer.shape, layer.color);

    // Cream on top of each layer (except top-most if auto)
    if (i < numLayers - 1 || cakeState.creamMode === 'auto') {
      drawCreamTop(cakeCtx, centerX, y - layerHeight, layerW - 10, layer.shape, layer.color);
    }
  }

  // Draw cream decorations
  drawCreamDecorations(cakeCtx, centerX, baseY, numLayers, layerHeight);

  // Draw hand-drawn cream paths
  if (cakeState.creamPaths) {
    cakeState.creamPaths.forEach(path => {
      drawCreamPath(cakeCtx, path);
    });
  }

  // Decorations
  cakeState.decorations.forEach(d => {
    cakeCtx.font = '24px serif';
    cakeCtx.textAlign = 'center';
    cakeCtx.textBaseline = 'middle';
    cakeCtx.fillText(d.emoji, d.x, d.y);
  });

  // Sprinkles
  cakeState.sprinkles.forEach(s => {
    cakeCtx.save();
    cakeCtx.translate(s.x, s.y);
    cakeCtx.rotate(s.rotation);
    cakeCtx.fillStyle = s.color;
    cakeCtx.fillRect(-s.size/2, -s.size/4, s.size, s.size/2);
    cakeCtx.restore();
  });

  // Candles
  drawCandles(cakeCtx, centerX, baseY, numLayers, layerHeight);

  // Name tag
  if (cakeState.tagShow && cakeState.tagText) {
    drawNameTag(cakeCtx, centerX, baseY - numLayers * layerHeight - 30);
  }

  // Update slider displays
  document.getElementById('creamDensityVal').textContent = document.getElementById('creamDensity').value;
  document.getElementById('tagPosXVal').textContent = document.getElementById('tagPosX').value;
}

function drawCakeLayer(ctx, cx, y, w, h, shape, color) {
  ctx.save();
  const darkerColor = darkenColor(color, 20);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  if (shape === 'circle') {
    ctx.beginPath();
    ctx.ellipse(cx + 5, y + 5, w, h * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (shape === 'square') {
    roundRect(ctx, cx - w + 5, y - h/2 + 5, w * 2, h, 8);
    ctx.fill();
  } else if (shape === 'rectangle') {
    roundRect(ctx, cx - w * 0.7 + 5, y - h/2 + 5, w * 1.4, h, 8);
    ctx.fill();
  } else if (shape === 'semi') {
    ctx.beginPath();
    ctx.ellipse(cx + 5, y + 5, w, h * 0.6, 0, 0, Math.PI);
    ctx.fill();
  }

  // Main body
  const grad = ctx.createLinearGradient(cx - w, y - h/2, cx + w, y + h/2);
  grad.addColorStop(0, color);
  grad.addColorStop(0.5, lightenColor(color, 10));
  grad.addColorStop(1, darkerColor);
  ctx.fillStyle = grad;

  if (shape === 'circle') {
    ctx.beginPath();
    ctx.ellipse(cx, y, w, h * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = darkerColor;
    ctx.lineWidth = 2;
    ctx.stroke();
    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.ellipse(cx - w * 0.3, y - h * 0.15, w * 0.4, h * 0.15, -0.2, 0, Math.PI * 2);
    ctx.fill();
  } else if (shape === 'square') {
    roundRect(ctx, cx - w, y - h/2, w * 2, h, 8);
    ctx.fill();
    ctx.strokeStyle = darkerColor;
    ctx.lineWidth = 2;
    roundRect(ctx, cx - w, y - h/2, w * 2, h, 8);
    ctx.stroke();
    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    roundRect(ctx, cx - w + 10, y - h/2 + 5, w * 0.8, h * 0.3, 4);
    ctx.fill();
  } else if (shape === 'rectangle') {
    roundRect(ctx, cx - w * 0.7, y - h/2, w * 1.4, h, 8);
    ctx.fill();
    ctx.strokeStyle = darkerColor;
    ctx.lineWidth = 2;
    roundRect(ctx, cx - w * 0.7, y - h/2, w * 1.4, h, 8);
    ctx.stroke();
  } else if (shape === 'semi') {
    ctx.beginPath();
    ctx.ellipse(cx, y, w, h * 0.6, 0, Math.PI, 0);
    ctx.lineTo(cx + w, y + h * 0.3);
    ctx.lineTo(cx - w, y + h * 0.3);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = darkerColor;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();
}

function drawCreamTop(ctx, cx, y, w, shape, layerColor) {
  ctx.save();
  const creamColor = cakeState.creamColor;

  if (cakeState.creamMode === 'auto') {
    const numDrops = parseInt(document.getElementById('creamDensity').value) || 15;
    for (let i = 0; i < numDrops; i++) {
      const angle = (i / numDrops) * Math.PI * 2;
      const rx = shape === 'rectangle' ? w * 0.7 : w;
      const px = cx + Math.cos(angle) * rx * 0.85;
      const py = y + Math.sin(angle) * 15;

      ctx.fillStyle = creamColor;
      ctx.beginPath();
      ctx.arc(px, py, 8, 0, Math.PI * 2);
      ctx.fill();

      // Small dollop
      ctx.beginPath();
      ctx.arc(px + Math.cos(angle) * 6, py + Math.sin(angle) * 4, 5, 0, Math.PI * 2);
      ctx.fill();

      // Highlight
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.arc(px - 2, py - 2, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawCreamDecorations(ctx, cx, baseY, numLayers, layerH) {
  if (cakeState.creamMode !== 'auto') return;
  ctx.save();
  const density = parseInt(document.getElementById('creamDensity').value) || 15;

  for (let layer = 0; layer < numLayers; layer++) {
    const y = baseY - layer * layerH - 10;
    const w = 160 + (numLayers - layer) * 20 - 10;

    // Side cream
    for (let i = 0; i < density; i++) {
      const t = i / (density - 1);
      const px = cx - w + t * w * 2;
      const py = y + 15 + Math.sin(t * Math.PI * 4) * 5;

      ctx.fillStyle = cakeState.creamColor;
      ctx.beginPath();
      ctx.arc(px, py, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.arc(px - 1, py - 2, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawCreamPath(ctx, path) {
  if (path.length < 2) return;
  ctx.save();
  ctx.strokeStyle = cakeState.creamColor;
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.beginPath();
  ctx.moveTo(path[0].x, path[0].y);
  for (let i = 1; i < path.length; i++) {
    const prev = path[i-1];
    const curr = path[i];
    const mx = (prev.x + curr.x) / 2;
    const my = (prev.y + curr.y) / 2;
    ctx.quadraticCurveTo(prev.x, prev.y, mx, my);
  }
  ctx.stroke();

  // Add highlights along path
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(path[0].x - 1, path[0].y - 1);
  for (let i = 1; i < path.length; i++) {
    const prev = path[i-1];
    const curr = path[i];
    ctx.quadraticCurveTo(prev.x - 1, prev.y - 1, (prev.x + curr.x) / 2 - 1, (prev.y + curr.y) / 2 - 1);
  }
  ctx.stroke();
  ctx.restore();
}

function drawCandles(ctx, cx, baseY, numLayers, layerH) {
  const count = cakeState.candleCount;
  if (count === 0) return;

  const topY = baseY - numLayers * layerH;
  const topW = 160 + 20;
  const spacing = (topW * 2 - 40) / Math.max(count, 1);

  ctx.save();
  for (let i = 0; i < count; i++) {
    const x = cx - topW + 20 + spacing * i + spacing / 2;
    const y = topY;

    if (cakeState.candleStyle === 'thin') {
      // Colorful thin candle
      const hue = (i / count) * 360;
      ctx.fillStyle = `hsl(${hue}, 80%, 70%)`;
      roundRect(ctx, x - 3, y - 40, 6, 40, 2);
      ctx.fill();
      // Stripe
      ctx.fillStyle = `hsl(${hue}, 80%, 85%)`;
      ctx.fillRect(x - 1, y - 35, 2, 30);
      // Flame
      drawFlame(ctx, x, y - 45);
    } else if (cakeState.candleStyle === 'number') {
      // Number candle
      ctx.fillStyle = '#FF69B4';
      roundRect(ctx, x - 5, y - 35, 10, 35, 3);
      ctx.fill();
      ctx.fillStyle = 'white';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(String(i + 1), x, y - 15);
      drawFlame(ctx, x, y - 40);
    } else if (cakeState.candleStyle === 'star') {
      // Star candle
      ctx.fillStyle = '#FFD700';
      roundRect(ctx, x - 4, y - 35, 8, 35, 2);
      ctx.fill();
      // Star on top
      drawStar(ctx, x, y - 42, 8, '#FFD700');
      drawFlame(ctx, x, y - 40);
    }
  }
  ctx.restore();
}

function drawFlame(ctx, x, y) {
  ctx.save();
  // Outer flame
  const flickerOffset = Math.sin(Date.now() / 200 + x) * 1.5;
  ctx.fillStyle = '#FFA500';
  ctx.beginPath();
  ctx.ellipse(x + flickerOffset, y, 5, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  // Inner flame
  ctx.fillStyle = '#FFFF00';
  ctx.beginPath();
  ctx.ellipse(x, y + 2, 3, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  // Glow
  ctx.fillStyle = 'rgba(255,200,0,0.3)';
  ctx.beginPath();
  ctx.arc(x, y, 12, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawStar(ctx, cx, cy, r, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawNameTag(ctx, cx, topY) {
  const text = cakeState.tagText;
  const posX = parseInt(cakeState.tagPosX) / 100;

  ctx.save();
  const tagW = text.length * 16 + 30;
  const tagX = cx + (posX - 0.5) * 200;

  // Stick
  ctx.strokeStyle = '#8B4513';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(tagX, topY - 10);
  ctx.lineTo(tagX, topY - 50);
  ctx.stroke();

  // Flag
  ctx.fillStyle = '#FFFFFF';
  ctx.strokeStyle = var_pink();
  ctx.lineWidth = 2;
  roundRect(ctx, tagX - tagW/2, topY - 80, tagW, 30, 6);
  ctx.fill();
  roundRect(ctx, tagX - tagW/2, topY - 80, tagW, 30, 6);
  ctx.stroke();

  // Text
  ctx.fillStyle = '#FF69B4';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, tagX, topY - 65);
  ctx.restore();
}

function var_pink() { return '#FFB6C1'; }

function clearCake() {
  cakeState = {
    layers: [{shape:'circle',color:'#FFB6C1'},{shape:'circle',color:'#FFF0F5'}],
    creamColor: '#FFFFFF',
    creamMode: 'auto',
    creamDensity: 15,
    decoMode: 'place',
    activeDeco: null,
    decorations: [],
    candleCount: 0,
    candleStyle: 'thin',
    tagText: '生日快乐',
    tagShow: true,
    tagPosX: 50,
    sprinkleMode: 'auto',
    sprinkleColor: '#FF0000',
    sprinkles: [],
    creamPaths: []
  };
  syncUIFromCakeState();
  updateCake();
  saveCakeHistory();
  logAction('清空', '清空了蛋糕画布');
  showToast('画布已清空');
}

function setCupType(type, el) {
  teaState.cupType = type;
  document.querySelectorAll('#cupShapes .shape-btn').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
  updateTea();
  saveTeaHistory();
  logAction('杯型', `选择${CUP_TYPES.find(c=>c.id===type)?.name||type}`);
}

function toggleTopping(id, el) {
  if (teaState.toppings[id]) {
    delete teaState.toppings[id];
    el.classList.remove('active');
  } else {
    teaState.toppings[id] = true;
    el.classList.add('active');
  }
  updateTea();
  saveTeaHistory();
}

function setTeaCreamColor(color, el) {
  teaState.teaCreamColor = color;
  document.querySelectorAll('#teaCreamColors .color-swatch').forEach(s => s.classList.remove('active'));
  if (el) el.classList.add('active');
  updateTea();
}

function setTeaDrawMode(mode, btn) {
  teaState.drawMode = mode;
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function onTeaCanvasDown(e) {
  if (!teaState.drawMode) return;
  const pos = getCanvasPos(e, teaCanvas);
  teaState.currentStroke = { points: [{x:pos.x,y:pos.y}], color: teaState.drawColor, size: teaState.drawSize };
  isDrawing = true;
}

function onTeaCanvasMove(e) {
  if (!isDrawing || !teaState.currentStroke) return;
  const pos = getCanvasPos(e, teaCanvas);
  teaState.currentStroke.points.push({x:pos.x,y:pos.y});
  updateTea();
}

function onTeaCanvasUp(e) {
  if (teaState.currentStroke && teaState.currentStroke.points.length > 1) {
    teaState.drawings.push(teaState.currentStroke);
    saveTeaHistory();
    logAction('奶茶绘画', '在杯子上画了一笔');
  }
  teaState.currentStroke = null;
  isDrawing = false;
}

function updateTea() {
  const W = 600, H = 500;
  teaCtx.clearRect(0, 0, W, H);

  // Background
  const bgGrad = teaCtx.createRadialGradient(W/2, H/2, 50, W/2, H/2, 400);
  bgGrad.addColorStop(0, '#F0F8FF');
  bgGrad.addColorStop(1, '#E6F0FF');
  teaCtx.fillStyle = bgGrad;
  teaCtx.fillRect(0, 0, W, H);

  const cx = W / 2;
  const cup = teaState;
  let cupW, cupH, cupX, cupY;

  // Cup dimensions based on type
  switch(cup.cupType) {
    case 'round':
      cupW = 100; cupH = 220; break;
    case 'square':
      cupW = 110; cupH = 200; break;
    case 'tall':
      cupW = 80; cupH = 280; break;
    case 'short':
      cupW = 130; cupH = 160; break;
    default:
      cupW = 100; cupH = 220;
  }
  cupX = cx;
  cupY = H - 80 - cupH;

  // Draw toppings at bottom
  const toppingKeys = Object.keys(cup.toppings);
  if (toppingKeys.length > 0) {
    drawToppings(teaCtx, cupX, cupY + cupH, cupW, toppingKeys);
  }

  // Draw drink (liquid)
  const drinkGrad = teaCtx.createLinearGradient(cupX - cupW/2, cupY, cupX + cupW/2, cupY);
  drinkGrad.addColorStop(0, '#F4A460');
  drinkGrad.addColorStop(0.5, '#DEB887');
  drinkGrad.addColorStop(1, '#D2B48C');
  teaCtx.fillStyle = drinkGrad;

  if (cup.cupType === 'round') {
    teaCtx.beginPath();
    teaCtx.moveTo(cupX - cupW * 0.9, cupY + 20);
    teaCtx.lineTo(cupX - cupW * 0.7, cupY + cupH);
    teaCtx.lineTo(cupX + cupW * 0.7, cupY + cupH);
    teaCtx.lineTo(cupX + cupW * 0.9, cupY + 20);
    teaCtx.closePath();
    teaCtx.fill();
  } else if (cup.cupType === 'square') {
    roundRect(teaCtx, cupX - cupW * 0.8, cupY + 15, cupW * 1.6, cupH - 15, 4);
    teaCtx.fill();
  } else if (cup.cupType === 'tall') {
    teaCtx.beginPath();
    teaCtx.moveTo(cupX - cupW * 0.95, cupY + 15);
    teaCtx.lineTo(cupX - cupW * 0.75, cupY + cupH);
    teaCtx.lineTo(cupX + cupW * 0.75, cupY + cupH);
    teaCtx.lineTo(cupX + cupW * 0.95, cupY + 15);
    teaCtx.closePath();
    teaCtx.fill();
  } else if (cup.cupType === 'short') {
    roundRect(teaCtx, cupX - cupW * 0.85, cupY + 15, cupW * 1.7, cupH - 15, 12);
    teaCtx.fill();
  }

  // Draw cup body (transparent with color)
  teaCtx.globalAlpha = 0.3;
  teaCtx.fillStyle = cup.cupColor;
  if (cup.cupType === 'round') {
    teaCtx.beginPath();
    teaCtx.moveTo(cupX - cupW * 0.9, cupY + 20);
    teaCtx.lineTo(cupX - cupW * 0.7, cupY + cupH);
    teaCtx.lineTo(cupX + cupW * 0.7, cupY + cupH);
    teaCtx.lineTo(cupX + cupW * 0.9, cupY + 20);
    teaCtx.closePath();
    teaCtx.fill();
  } else if (cup.cupType === 'square') {
    roundRect(teaCtx, cupX - cupW * 0.8, cupY + 15, cupW * 1.6, cupH - 15, 4);
    teaCtx.fill();
  } else if (cup.cupType === 'tall') {
    teaCtx.beginPath();
    teaCtx.moveTo(cupX - cupW * 0.95, cupY + 15);
    teaCtx.lineTo(cupX - cupW * 0.75, cupY + cupH);
    teaCtx.lineTo(cupX + cupW * 0.75, cupY + cupH);
    teaCtx.lineTo(cupX + cupW * 0.95, cupY + 15);
    teaCtx.closePath();
    teaCtx.fill();
  } else if (cup.cupType === 'short') {
    roundRect(teaCtx, cupX - cupW * 0.85, cupY + 15, cupW * 1.7, cupH - 15, 12);
    teaCtx.fill();
  }
  teaCtx.globalAlpha = 1.0;

  // Cup outline
  teaCtx.strokeStyle = cup.cupColor;
  teaCtx.lineWidth = 3;
  if (cup.cupType === 'round') {
    teaCtx.beginPath();
    teaCtx.moveTo(cupX - cupW * 0.9, cupY + 20);
    teaCtx.lineTo(cupX - cupW * 0.7, cupY + cupH);
    teaCtx.lineTo(cupX + cupW * 0.7, cupY + cupH);
    teaCtx.lineTo(cupX + cupW * 0.9, cupY + 20);
    teaCtx.stroke();
    // Top ellipse
    teaCtx.beginPath();
    teaCtx.ellipse(cupX, cupY + 20, cupW * 0.9, 15, 0, 0, Math.PI * 2);
    teaCtx.stroke();
  } else if (cup.cupType === 'square') {
    roundRect(teaCtx, cupX - cupW * 0.8, cupY + 15, cupW * 1.6, cupH - 15, 4);
    teaCtx.stroke();
  } else if (cup.cupType === 'tall') {
    teaCtx.beginPath();
    teaCtx.moveTo(cupX - cupW * 0.95, cupY + 15);
    teaCtx.lineTo(cupX - cupW * 0.75, cupY + cupH);
    teaCtx.lineTo(cupX + cupW * 0.75, cupY + cupH);
    teaCtx.lineTo(cupX + cupW * 0.95, cupY + 15);
    teaCtx.stroke();
    teaCtx.beginPath();
    teaCtx.ellipse(cupX, cupY + 15, cupW * 0.95, 12, 0, 0, Math.PI * 2);
    teaCtx.stroke();
  } else if (cup.cupType === 'short') {
    roundRect(teaCtx, cupX - cupW * 0.85, cupY + 15, cupW * 1.7, cupH - 15, 12);
    teaCtx.stroke();
  }

  // Pattern on cup
  drawCupPattern(teaCtx, cupX, cupY, cupW, cupH, cup.cupPattern);

  // Cream top
  if (cup.creamHeight > 0) {
    drawTeaCream(teaCtx, cupX, cupY + 20, cupW, cup.creamHeight);
  }

  // Straw
  teaCtx.strokeStyle = '#FF69B4';
  teaCtx.lineWidth = 5;
  teaCtx.lineCap = 'round';
  teaCtx.beginPath();
  teaCtx.moveTo(cupX + 30, cupY - 20);
  teaCtx.lineTo(cupX + 20, cupY + cupH * 0.5);
  teaCtx.stroke();
  // Straw stripes
  teaCtx.strokeStyle = 'white';
  teaCtx.lineWidth = 5;
  teaCtx.setLineDash([8, 8]);
  teaCtx.beginPath();
  teaCtx.moveTo(cupX + 30, cupY - 20);
  teaCtx.lineTo(cupX + 20, cupY + cupH * 0.5);
  teaCtx.stroke();
  teaCtx.setLineDash([]);

  // Lid (for bubble tea)
  if (toppingKeys.length > 0) {
    teaCtx.fillStyle = cup.cupColor;
    teaCtx.globalAlpha = 0.5;
    teaCtx.beginPath();
    if (cup.cupType === 'round') {
      teaCtx.ellipse(cupX, cupY + 20, cupW * 0.9, 15, 0, 0, Math.PI * 2);
    } else {
      teaCtx.ellipse(cupX, cupY + 20, cupW * 0.85, 12, 0, 0, Math.PI * 2);
    }
    teaCtx.fill();
    teaCtx.globalAlpha = 1.0;
    teaCtx.strokeStyle = cup.cupColor;
    teaCtx.lineWidth = 2;
    if (cup.cupType === 'round') {
      teaCtx.beginPath();
      teaCtx.ellipse(cupX, cupY + 20, cupW * 0.9, 15, 0, 0, Math.PI * 2);
    } else {
      teaCtx.beginPath();
      teaCtx.ellipse(cupX, cupY + 20, cupW * 0.85, 12, 0, 0, Math.PI * 2);
    }
    teaCtx.stroke();
  }

  // User drawings
  teaState.drawings.forEach(stroke => {
    teaCtx.strokeStyle = stroke.color;
    teaCtx.lineWidth = stroke.size;
    teaCtx.lineCap = 'round';
    teaCtx.lineJoin = 'round';
    teaCtx.beginPath();
    stroke.points.forEach((p, i) => {
      if (i === 0) teaCtx.moveTo(p.x, p.y);
      else teaCtx.lineTo(p.x, p.y);
    });
    teaCtx.stroke();
  });
  // Current drawing
  if (teaState.currentStroke) {
    teaCtx.strokeStyle = teaState.currentStroke.color;
    teaCtx.lineWidth = teaState.currentStroke.size;
    teaCtx.lineCap = 'round';
    teaCtx.lineJoin = 'round';
    teaCtx.beginPath();
    teaState.currentStroke.points.forEach((p, i) => {
      if (i === 0) teaCtx.moveTo(p.x, p.y);
      else teaCtx.lineTo(p.x, p.y);
    });
    teaCtx.stroke();
  }

  // Update displays
  document.getElementById('creamHeightVal').textContent = document.getElementById('creamHeight').value;
}

function drawToppings(ctx, cx, bottomY, cupW, toppingKeys) {
  ctx.save();
  const toppingColors = {
    pearl: '#1a1a1a',
    coconut: '#FFFFFF',
    pudding: '#FFD700',
    redbean: '#8B0000',
    aloe: '#90EE90',
    grassjelly: '#2F4F4F',
    taro: '#9370DB',
    mango: '#FFA500'
  };

  const h = 35;
  for (let row = 0; row < 3; row++) {
    const numInRow = 5 + row * 2;
    for (let i = 0; i < numInRow; i++) {
      const t = i / (numInRow - 1);
      const x = cx - cupW * 0.6 + t * cupW * 1.2;
      const y = bottomY - row * 12;
      const tid = toppingKeys[Math.floor(Math.random() * toppingKeys.length)];
      ctx.fillStyle = toppingColors[tid] || '#888';

      if (tid === 'pearl') {
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.arc(x - 1, y - 1, 2, 0, Math.PI * 2);
        ctx.fill();
      } else if (tid === 'coconut') {
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#DDD';
        ctx.lineWidth = 1;
        ctx.stroke();
      } else if (tid === 'pudding') {
        ctx.fillStyle = '#FFD700';
        roundRect(ctx, x - 4, y - 4, 8, 8, 2);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  ctx.restore();
}

function drawCupPattern(ctx, cx, cy, cupW, cupH, pattern) {
  if (pattern === 'none') return;
  ctx.save();
  ctx.globalAlpha = 0.15;

  if (pattern === 'dots') {
    for (let y = cy + 30; y < cy + cupH - 10; y += 20) {
      for (let x = cx - cupW * 0.5; x < cx + cupW * 0.5; x += 20) {
        ctx.fillStyle = '#FF69B4';
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  } else if (pattern === 'stripes') {
    ctx.strokeStyle = '#87CEEB';
    ctx.lineWidth = 4;
    for (let x = cx - cupW * 0.6; x < cx + cupW * 0.6; x += 15) {
      ctx.beginPath();
      ctx.moveTo(x, cy + 30);
      ctx.lineTo(x - 10, cy + cupH - 10);
      ctx.stroke();
    }
  } else if (pattern === 'hearts') {
    ctx.fillStyle = '#FF69B4';
    ctx.font = '16px serif';
    for (let y = cy + 40; y < cy + cupH - 20; y += 30) {
      for (let x = cx - cupW * 0.4; x < cx + cupW * 0.4; x += 30) {
        ctx.fillText('♥', x, y);
      }
    }
  } else if (pattern === 'stars') {
    ctx.fillStyle = '#FFD700';
    ctx.font = '14px serif';
    for (let y = cy + 40; y < cy + cupH - 20; y += 28) {
      for (let x = cx - cupW * 0.4; x < cx + cupW * 0.4; x += 28) {
        ctx.fillText('★', x, y);
      }
    }
  }
  ctx.restore();
}

function drawTeaCream(ctx, cx, topY, cupW, height) {
  ctx.save();
  const creamColor = teaState.teaCreamColor;
  const h = height;

  // Cream blob
  ctx.fillStyle = creamColor;
  ctx.beginPath();
  ctx.moveTo(cx - cupW * 0.8, topY);

  // Wavy top
  const segments = 8;
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const x = cx - cupW * 0.8 + t * cupW * 1.6;
    const y = topY - h + Math.sin(t * Math.PI * 3) * 10 + Math.cos(t * Math.PI * 2) * 5;
    if (i === 0) ctx.moveTo(x, topY);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(cx + cupW * 0.8, topY);
  ctx.closePath();
  ctx.fill();

  // Cream highlight
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.ellipse(cx - cupW * 0.2, topY - h * 0.5, cupW * 0.3, h * 0.2, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // Cherry on top
  ctx.fillStyle = '#DC143C';
  ctx.beginPath();
  ctx.arc(cx, topY - h - 8, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.arc(cx - 2, topY - h - 10, 3, 0, Math.PI * 2);
  ctx.fill();
  // Stem
  ctx.strokeStyle = '#228B22';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, topY - h - 16);
  ctx.quadraticCurveTo(cx + 8, topY - h - 25, cx + 5, topY - h - 28);
  ctx.stroke();

  ctx.restore();
}

function clearTea() {
  teaState = {
    cupType: teaState.cupType,
    cupColor: teaState.cupColor,
    cupPattern: 'none',
    toppings: {},
    creamHeight: 30,
    teaCreamColor: '#FFFFFF',
    drawMode: false,
    drawColor: '#FF69B4',
    drawSize: 3,
    drawings: [],
    currentStroke: null
  };
  document.getElementById('cupPattern').value = 'none';
  document.getElementById('teaToppings').querySelectorAll('.deco-btn').forEach(b => b.classList.remove('active'));
  updateTea();
  saveTeaHistory();
  logAction('清空', '清空了奶茶画布');
  showToast('奶茶已清空');
}

function toggleDessertDeco(id, el) {

function sprinkleDessert() {
  for (let i = 0; i < 30; i++) {
    dessertState.sprinkleItems.push({
      x: 200 + Math.random() * 200,
      y: 150 + Math.random() * 200,
      color: SPRINKLE_COLORS[Math.floor(Math.random() * SPRINKLE_COLORS.length)],

    });

  updateDessert();
  saveDessertHistory();

  showToast('已撒糖粉！');

function updateDessert() {
  const W = 600, H = 500;
  dessertCtx.clearRect(0, 0, W, H);

  // Background
  const bgGrad = dessertCtx.createRadialGradient(W/2, H/2, 50, W/2, H/2, 400);
  bgGrad.addColorStop(0, '#FFFDE0');
  bgGrad.addColorStop(1, '#FFF8E8');
  dessertCtx.fillStyle = bgGrad;
  dessertCtx.fillRect(0, 0, W, H);

  // Plate
  dessertCtx.fillStyle = '#FFFFFF';
  dessertCtx.strokeStyle = '#E0E0E0';
  dessertCtx.lineWidth = 2;
  dessertCtx.beginPath();
  dessertCtx.ellipse(W/2, H - 60, 200, 25, 0, 0, Math.PI * 2);
  dessertCtx.fill();
  dessertCtx.stroke();

  const cx = W / 2, cy = H / 2 - 20;
  const c1 = dessertState.color1;
  const c2 = dessertState.color2;

  switch(dessertState.template) {
    case 'macaron':
      drawMacaron(dessertCtx, cx, cy, c1, c2);
      break;
    case 'donut':
      drawDonut(dessertCtx, cx, cy, c1, c2);
      break;
    case 'cookie':
      drawCookie(dessertCtx, cx, cy, c1);
      break;
    case 'cupcake':
      drawCupcake(dessertCtx, cx, cy, c1, c2);
      break;
    case 'eclair':
      drawEclair(dessertCtx, cx, cy, c1, c2);
      break;
    case 'mochi':
      drawMochi(dessertCtx, cx, cy, c1);
      break;
    case 'tart':
      drawTart(dessertCtx, cx, cy, c1, c2);
      break;
    case 'roll':
      drawRoll(dessertCtx, cx, cy, c1, c2);
      break;
  }

  // Dessert decorations
  const decos = dessertState.activeDecos;
  if (decos.has('chocodip')) {
    drawChocoDip(dessertCtx, cx, cy);
  }
  if (decos.has('fruit')) {
    dessertCtx.font = '20px serif';
    dessertCtx.fillText('🍓', cx - 30, cy - 20);
    dessertCtx.fillText('🫐', cx + 20, cy - 15);
  }
  if (decos.has('nut')) {
    dessertCtx.font = '16px serif';
    for (let i = 0; i < 5; i++) {
      dessertCtx.fillText('🥜', cx - 30 + i * 15, cy + 10 + (i%2) * 10);
    }
  }
  if (decos.has('cream')) {
    dessertCtx.font = '20px serif';
    dessertCtx.fillText('🍦', cx + 40, cy - 10);
  }
  if (decos.has('jam')) {
    dessertCtx.fillStyle = '#FF6347';
    dessertCtx.beginPath();
    dessertCtx.ellipse(cx, cy, 25, 10, 0, 0, Math.PI * 2);
    dessertCtx.fill();
  }
  if (decos.has('coconut')) {
    for (let i = 0; i < 20; i++) {
      dessertCtx.fillStyle = 'rgba(255,255,255,0.7)';
      dessertCtx.fillRect(cx - 40 + Math.random() * 80, cy - 30 + Math.random() * 60, 3, 3);
    }
  }
  if (decos.has('candy')) {
    dessertCtx.font = '14px serif';
    for (let i = 0; i < 6; i++) {
      dessertCtx.fillText('🍬', cx - 35 + i * 14, cy - 25 + (i%2) * 15);
    }
  }

  // Sprinkles
  dessertState.sprinkleItems.forEach(s => {
    dessertCtx.save();
    dessertCtx.fillStyle = s.color;
    dessertCtx.beginPath();
    dessertCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    dessertCtx.fill();
    dessertCtx.restore();
  });
}

function drawMacaron(ctx, cx, cy, c1, c2) {
  // Top shell
  ctx.fillStyle = c1;
  ctx.beginPath();
  ctx.ellipse(cx, cy - 15, 60, 25, 0, Math.PI, 0);
  ctx.fill();
  // Ruffled edge
  ctx.fillStyle = lightenColor(c1, 15);
  for (let i = 0; i < 12; i++) {
    const angle = Math.PI + (i / 12) * Math.PI;
    const x = cx + Math.cos(angle) * 55;
    const y = cy - 15 + Math.sin(angle) * 5;
    ctx.beginPath();
    ctx.arc(x, y, 8, 0, Math.PI * 2);
    ctx.fill();
  }
  // Filling
  ctx.fillStyle = c2;
  ctx.beginPath();
  ctx.ellipse(cx, cy, 55, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  // Bottom shell
  ctx.fillStyle = c1;
  ctx.beginPath();
  ctx.ellipse(cx, cy + 15, 60, 25, 0, 0, Math.PI);
  ctx.fill();
  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.ellipse(cx - 15, cy - 22, 20, 8, -0.2, 0, Math.PI * 2);
  ctx.fill();
}

function drawDonut(ctx, cx, cy, c1, c2) {
  // Main donut
  ctx.fillStyle = c1;
  ctx.beginPath();
  ctx.arc(cx, cy, 55, 0, Math.PI * 2);
  ctx.arc(cx, cy, 20, 0, Math.PI * 2, true);
  ctx.fill();
  // Frosting
  ctx.fillStyle = c2;
  ctx.beginPath();
  ctx.arc(cx, cy, 55, -Math.PI * 0.8, Math.PI * 0.1);
  ctx.arc(cx, cy, 20, Math.PI * 0.1, -Math.PI * 0.8, true);
  ctx.closePath();
  ctx.fill();
  // Drip
  ctx.fillStyle = c2;
  for (let i = 0; i < 5; i++) {
    const angle = -Math.PI * 0.5 + i * Math.PI * 0.25;
    const x = cx + Math.cos(angle) * 55;
    const y = cy + Math.sin(angle) * 55;
    ctx.beginPath();
    ctx.moveTo(x - 6, y);
    ctx.quadraticCurveTo(x, y + 15, x + 6, y);
    ctx.fill();
  }
  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.arc(cx - 15, cy - 20, 15, 0, Math.PI * 2);
  ctx.fill();
}

function drawCookie(ctx, cx, cy, c1) {
  ctx.fillStyle = '#DEB887';
  ctx.beginPath();
  ctx.arc(cx, cy, 55, 0, Math.PI * 2);
  ctx.fill();
  // Irregular edge
  ctx.fillStyle = '#D2B48C';
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2;
    const x = cx + Math.cos(angle) * 52;
    const y = cy + Math.sin(angle) * 52;
    ctx.beginPath();
    ctx.arc(x, y, 12, 0, Math.PI * 2);
    ctx.fill();
  }
  // Chocolate chips
  ctx.fillStyle = c1;
  const chips = [[-20,-15],[10,-25],[25,5],[-10,20],[15,25],[-25,10],[0,0]];
  chips.forEach(([ox,oy]) => {
    ctx.beginPath();
    ctx.arc(cx + ox, cy + oy, 5, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawCupcake(ctx, cx, cy, c1, c2) {
  // Wrapper
  ctx.fillStyle = c2;
  ctx.beginPath();
  ctx.moveTo(cx - 35, cy);
  ctx.lineTo(cx - 28, cy + 55);
  ctx.lineTo(cx + 28, cy + 55);
  ctx.lineTo(cx + 35, cy);
  ctx.closePath();
  ctx.fill();
  // Wrapper lines
  ctx.strokeStyle = 'rgba(0,0,0,0.1)';
  ctx.lineWidth = 1;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(cx + i * 10, cy);
    ctx.lineTo(cx + i * 7, cy + 55);
    ctx.stroke();
  }
  // Cake top
  ctx.fillStyle = '#FFDAB9';
  ctx.beginPath();
  ctx.ellipse(cx, cy, 38, 15, 0, 0, Math.PI * 2);
  ctx.fill();
  // Swirl cream
  ctx.fillStyle = c1;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.ellipse(cx, cy - 10 - i * 15, 30 - i * 5, 12, 0, Math.PI, 0);
    ctx.fill();
  }
  // Cherry
  ctx.fillStyle = '#DC143C';
  ctx.beginPath();
  ctx.arc(cx, cy - 50, 8, 0, Math.PI * 2);
  ctx.fill();
}

function drawEclair(ctx, cx, cy, c1, c2) {
  // Pastry body
  ctx.fillStyle = '#D2691E';
  roundRect(ctx, cx - 70, cy - 20, 140, 40, 20);
  ctx.fill();
  // Chocolate top
  ctx.fillStyle = c1;
  roundRect(ctx, cx - 68, cy - 25, 136, 20, 10);
  ctx.fill();
  // Cream filling peek
  ctx.fillStyle = c2;
  ctx.beginPath();
  ctx.ellipse(cx - 20, cy + 10, 8, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + 30, cy + 10, 8, 6, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawMochi(ctx, cx, cy, c1) {
  ctx.fillStyle = c1;
  ctx.beginPath();
  ctx.arc(cx, cy, 50, 0, Math.PI * 2);
  ctx.fill();
  // Powdery texture
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  for (let i = 0; i < 15; i++) {
    ctx.beginPath();
    ctx.arc(cx - 30 + Math.random() * 60, cy - 30 + Math.random() * 60, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  // Face (cute)
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(cx - 15, cy - 5, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + 15, cy - 5, 4, 0, Math.PI * 2);
  ctx.fill();
  // Blush
  ctx.fillStyle = 'rgba(255,150,150,0.4)';
  ctx.beginPath();
  ctx.ellipse(cx - 25, cy + 8, 10, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + 25, cy + 8, 10, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  // Smile
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy + 5, 10, 0.1 * Math.PI, 0.9 * Math.PI);
  ctx.stroke();
  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.ellipse(cx - 15, cy - 20, 15, 8, -0.3, 0, Math.PI * 2);
  ctx.fill();
}

function drawTart(ctx, cx, cy, c1, c2) {
  // Crust
  ctx.fillStyle = '#DEB887';
  ctx.beginPath();
  ctx.moveTo(cx - 55, cy + 10);
  ctx.lineTo(cx - 50, cy + 35);
  ctx.quadraticCurveTo(cx, cy + 40, cx + 50, cy + 35);
  ctx.lineTo(cx + 55, cy + 10);
  ctx.closePath();
  ctx.fill();
  // Top
  ctx.fillStyle = '#D2B48C';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 10, 55, 15, 0, 0, Math.PI * 2);
  ctx.fill();
  // Filling
  ctx.fillStyle = c1;
  ctx.beginPath();
  ctx.ellipse(cx, cy + 8, 48, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  // Fruit decoration
  const fruits = ['🍓','🫐','🥝','🍊','🍒'];
  ctx.font = '16px serif';
  ctx.textAlign = 'center';
  for (let i = 0; i < 5; i++) {
    const angle = -Math.PI * 0.8 + i * Math.PI * 0.4;
    const x = cx + Math.cos(angle) * 30;
    const y = cy + 5 + Math.sin(angle) * 8;
    ctx.fillText(fruits[i], x, y);
  }
}

function drawRoll(ctx, cx, cy, c1, c2) {
  // Outer
  ctx.fillStyle = c1;
  ctx.beginPath();
  ctx.arc(cx - 15, cy, 45, Math.PI * 0.5, Math.PI * 1.5);
  ctx.arc(cx + 15, cy, 45, Math.PI * 1.5, Math.PI * 0.5);
  ctx.closePath();
  ctx.fill();
  // Spiral
  ctx.strokeStyle = c2;
  ctx.lineWidth = 3;
  for (let i = 1; i <= 4; i++) {
    ctx.beginPath();
    ctx.arc(cx + 15 - i * 10, cy, 45 - i * 8, Math.PI * 0.5, Math.PI * 1.5);
    ctx.stroke();
  }
  // Cream filling visible
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.arc(cx + 15, cy, 45, Math.PI * 1.5, Math.PI * 0.5);
  ctx.arc(cx - 15, cy, 45, Math.PI * 0.5, Math.PI * 1.5);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = c2;
  ctx.beginPath();
  ctx.arc(cx - 5, cy, 35, Math.PI * 1.5, Math.PI * 0.5);
  ctx.arc(cx + 25, cy, 35, Math.PI * 0.5, Math.PI * 1.5);
  ctx.closePath();
  ctx.fill();
}

function drawChocoDip(ctx, cx, cy) {
  ctx.fillStyle = '#5C3317';
  // Dripping chocolate
  ctx.beginPath();
  ctx.ellipse(cx, cy - 30, 50, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  for (let i = 0; i < 6; i++) {
    const x = cx - 40 + i * 16;
    ctx.beginPath();
    ctx.moveTo(x - 5, cy - 25);
    ctx.quadraticCurveTo(x, cy - 10 + Math.random() * 10, x + 5, cy - 25);
    ctx.fill();
  }
}

// ============================================================
// REPLAY
// ============================================================
function startReplay() {
  if (actionLog.length === 0) {
    showToast('还没有创作记录');
    return;
  }
  if (replayState.playing) {
    replayState.playing = false;
    document.getElementById('replayPlayBtn').textContent = '▶ 播放';
    return;
  }

  replayState.playing = true;
  document.getElementById('replayPlayBtn').textContent = '⏸ 暂停';

  const totalSteps = actionLog.length;
  let step = 0;
  const startTime = actionLog[0].time;
  const endTime = actionLog[actionLog.length - 1].time;
  const totalTime = Math.min(endTime - startTime, 10000);
  const interval = totalTime / totalSteps;

  function playStep() {
    if (!replayState.playing || step >= totalSteps) {
      replayState.playing = false;
      document.getElementById('replayPlayBtn').textContent = '▶ 播放';
      document.getElementById('replayProgress').style.width = '100%';
      return;
    }

    const progress = ((step + 1) / totalSteps) * 100;
    document.getElementById('replayProgress').style.width = progress + '%';

    const elapsed = Math.round((step / totalSteps) * 10);
    document.getElementById('replayTime').textContent = `0:${elapsed.toString().padStart(2, '0')}`;

    // Draw current state of active canvas to replay canvas
    const activeCanvas = document.querySelector('#cake-panel.active canvas, #tea-panel.active canvas, #dessert-panel.active canvas');
    if (activeCanvas) {
      replayCtx.clearRect(0, 0, 600, 500);
      replayCtx.drawImage(activeCanvas, 0, 0, 600, 500);

      // Show action overlay
      const action = actionLog[step];
      replayCtx.fillStyle = 'rgba(0,0,0,0.6)';
      roundRect(replayCtx, 20, 430, 560, 50, 10);
      replayCtx.fill();
      replayCtx.fillStyle = 'white';
      replayCtx.font = '14px sans-serif';
      replayCtx.textAlign = 'center';
      replayCtx.fillText(`步骤 ${step+1}/${totalSteps}: ${action.detail}`, 300, 460);
    }

    step++;
    setTimeout(playStep, interval);
  }
  playStep();
  logAction('回放', '播放创作过程');
}

// ============================================================
// VOICE
// ============================================================
function toggleVoice() {
  const btn = document.getElementById('voiceBtn');
  const hint = document.getElementById('voiceHint');

  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    showToast('当前浏览器不支持语音识别');
    return;
  }

  if (voiceActive) {
    voiceActive = false;
    if (recognition) recognition.stop();
    btn.classList.remove('recording');
    btn.textContent = '🎤 语音';
    hint.style.display = 'none';
    return;
  }

  voiceActive = true;
  btn.classList.add('recording');
  btn.textContent = '🎤 停止';
  hint.style.display = 'block';

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = (event) => {
    const last = event.results[event.results.length - 1];
    const text = last[0].transcript.trim();
    processVoiceCommand(text);
  };

  recognition.onerror = () => {
    voiceActive = false;
    btn.classList.remove('recording');
    btn.textContent = '🎤 语音';
    hint.style.display = 'none';
  };

  recognition.onend = () => {
    if (voiceActive) recognition.start();
  };

  recognition.start();
  showToast('语音识别已开启');
}

function processVoiceCommand(text) {
  // Match decoration names
  for (const deco of DECO_ITEMS) {
    if (text.includes(deco.name)) {
      selectDeco(deco.id, document.querySelector(`[data-deco="${deco.id}"]`));
      showToast(`已选择${deco.name}`);
      logAction('语音', `语音选择${deco.name}`);
      return;
    }
  }

  if (text.includes('蜡烛')) {
    const cc = Math.min(cakeState.candleCount + 1, 10);
    cakeState.candleCount = cc;
    document.getElementById('candleCount').value = cc;
    document.getElementById('candleVal').textContent = cc;
    updateCake();
    saveCakeHistory();
    showToast('添加了蜡烛');
    logAction('语音', '语音添加蜡烛');
    return;
  }

  if (text.includes('奶油')) {
    cakeState.creamMode = 'draw';
    showToast('已切换到手绘奶油模式');
    logAction('语音', '语音切换奶油模式');
    return;
  }

  if (text.includes('撒') || text.includes('装饰')) {
    autoSprinkle();
    showToast('自动撒装饰');
    return;
  }

  if (text.includes('清空')) {
    clearCake();
    showToast('已清空');
    return;
  }

  if (text.includes('撤销')) {
    undoAction();
    return;
  }
}

// ============================================================
// UTILITY FUNCTIONS
// ============================================================
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, Math.min(Math.abs(w), Math.abs(h)) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function lightenColor(hex, percent) {
  const num = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, (num >> 16) + Math.round(2.55 * percent));
  const g = Math.min(255, ((num >> 8) & 0x00FF) + Math.round(2.55 * percent));
  const b = Math.min(255, (num & 0x0000FF) + Math.round(2.55 * percent));
  return `rgb(${r},${g},${b})`;
}

function darkenColor(hex, percent) {
  const num = parseInt(hex.replace('#',''), 16);
  const r = Math.max(0, (num >> 16) - Math.round(2.55 * percent));
  const g = Math.max(0, ((num >> 8) & 0x00FF) - Math.round(2.55 * percent));
  const b = Math.max(0, (num & 0x0000FF) - Math.round(2.55 * percent));
  return `rgb(${r},${g},${b})`;
}

// Animate candle flames
