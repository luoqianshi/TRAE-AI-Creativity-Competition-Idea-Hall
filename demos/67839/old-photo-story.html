<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>老照片会说话</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ========================================
       基础样式与CSS变量
       ======================================== */
    :root {
      --bg-primary: #F7F3EB;
      --bg-secondary: #F0E6D3;
      --accent-brown: #8B7355;
      --accent-gold: #D4A574;
      --text-primary: #4A4035;
      --text-secondary: #7A6E5F;
      --border-color: #D4C5B0;
      --card-bg: #FFFBF5;
      --shadow-soft: 0 4px 20px rgba(139, 115, 85, 0.12);
      --shadow-hover: 0 8px 30px rgba(139, 115, 85, 0.18);
      --radius: 16px;
      --radius-sm: 8px;
      --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.8;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 20% 80%, rgba(212, 165, 116, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(139, 115, 85, 0.05) 0%, transparent 50%);
    }

    /* ========================================
       页面头部
       ======================================== */
    .page-header {
      text-align: center;
      padding: 48px 20px 32px;
      position: relative;
    }

    .page-header::before,
    .page-header::after {
      content: '✦';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent-gold);
      font-size: 14px;
      opacity: 0.6;
    }

    .page-header::before { left: calc(50% - 120px); }
    .page-header::after { right: calc(50% - 120px); }

    .page-title {
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .page-subtitle {
      font-size: clamp(14px, 2.5vw, 16px);
      color: var(--text-secondary);
      font-weight: 400;
      letter-spacing: 2px;
    }

    /* ========================================
       主容器
       ======================================== */
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    /* ========================================
       上传区域
       ======================================== */
    .upload-section {
      margin-bottom: 32px;
    }

    .upload-zone {
      border: 2px dashed var(--border-color);
      border-radius: var(--radius);
      padding: 48px 24px;
      text-align: center;
      background: var(--card-bg);
      transition: var(--transition);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .upload-zone::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(212, 165, 116, 0.05) 0%, transparent 100%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .upload-zone:hover {
      border-color: var(--accent-gold);
      box-shadow: var(--shadow-soft);
      transform: translateY(-2px);
    }

    .upload-zone:hover::before {
      opacity: 1;
    }

    .upload-zone.dragover {
      border-color: var(--accent-brown);
      background: #FFF8EE;
      transform: scale(1.02);
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 16px;
      display: block;
    }

    .upload-text {
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .upload-hint {
      font-size: 13px;
      color: #A89880;
    }

    .upload-input {
      display: none;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }

    .divider span {
      padding: 0 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      letter-spacing: 1px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-brown) 0%, #A0826D 100%);
      color: #fff;
      box-shadow: 0 4px 12px rgba(139, 115, 85, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 115, 85, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--card-bg);
      color: var(--accent-brown);
      border: 1.5px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: #FFF8EE;
      border-color: var(--accent-gold);
      transform: translateY(-2px);
    }

    .btn-full {
      width: 100%;
    }

    /* ========================================
       照片展示区
       ======================================== */
    .photo-section {
      margin-bottom: 32px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .photo-section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .photo-frame {
      background: var(--card-bg);
      padding: 16px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      position: relative;
    }

    .photo-frame::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      bottom: 8px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      pointer-events: none;
      opacity: 0.5;
    }

    .photo-display {
      width: 100%;
      border-radius: 12px;
      display: block;
      aspect-ratio: 4/3;
      object-fit: cover;
      background: var(--bg-secondary);
    }

    .photo-caption {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
      color: var(--text-secondary);
      font-style: italic;
    }

    /* ========================================
       AI识别结果区
       ======================================== */
    .ai-section {
      margin-bottom: 32px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease 0.1s, transform 0.6s ease 0.1s;
    }

    .ai-section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title .icon {
      color: var(--accent-gold);
    }

    .ai-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .ai-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(212, 197, 176, 0.3);
      transition: var(--transition);
      opacity: 0;
      transform: translateY(10px);
    }

    .ai-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .ai-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }

    .ai-card-label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .ai-card-value {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .ai-card:nth-child(1).visible { transition-delay: 0.1s; }
    .ai-card:nth-child(2).visible { transition-delay: 0.2s; }
    .ai-card:nth-child(3).visible { transition-delay: 0.3s; }
    .ai-card:nth-child(4).visible { transition-delay: 0.4s; }

    /* ========================================
       故事记录区
       ======================================== */
    .story-record-section {
      margin-bottom: 32px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s;
    }

    .story-record-section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .question-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-soft);
      margin-bottom: 16px;
      border-left: 3px solid var(--accent-gold);
      transition: var(--transition);
    }

    .question-card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateX(4px);
    }

    .question-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .question-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      background: var(--accent-gold);
      color: #fff;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .answer-input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 14px;
      color: var(--text-primary);
      background: #FFFBF5;
      transition: var(--transition);
      resize: vertical;
      min-height: 48px;
    }

    .answer-input:focus {
      outline: none;
      border-color: var(--accent-gold);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.15);
    }

    .answer-input::placeholder {
      color: #B8A99A;
    }

    /* ========================================
       生成按钮
       ======================================== */
    .generate-section {
      margin-bottom: 32px;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease 0.3s, transform 0.6s ease 0.3s;
    }

    .generate-section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ========================================
       故事预览区
       ======================================== */
    .story-preview {
      background: var(--card-bg);
      padding: 32px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      position: relative;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .story-preview.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .story-preview::before {
      content: '"';
      position: absolute;
      top: 16px;
      left: 20px;
      font-size: 64px;
      color: var(--accent-gold);
      opacity: 0.2;
      font-family: Georgia, serif;
      line-height: 1;
    }

    .story-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 16px;
      text-align: center;
    }

    .story-content {
      font-size: 15px;
      line-height: 2;
      color: var(--text-primary);
      text-align: justify;
      position: relative;
      z-index: 1;
    }

    .story-content .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1.2em;
      background: var(--accent-brown);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .story-footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px dashed var(--border-color);
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* ========================================
       加载动画
       ======================================== */
    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none !important;
    }

    /* ========================================
       页脚
       ======================================== */
    .page-footer {
      text-align: center;
      padding: 32px 20px;
      font-size: 13px;
      color: #A89880;
    }

    .page-footer .heart {
      color: #C85A54;
    }

    /* ========================================
       响应式适配
       ======================================== */
    @media (max-width: 480px) {
      .page-header {
        padding: 32px 16px 24px;
      }

      .page-header::before,
      .page-header::after {
        display: none;
      }

      .container {
        padding: 0 16px 40px;
      }

      .upload-zone {
        padding: 32px 16px;
      }

      .ai-grid {
        grid-template-columns: 1fr;
      }

      .story-preview {
        padding: 24px 20px;
      }

      .question-card {
        padding: 16px;
      }
    }

    @media (min-width: 768px) {
      .container {
        max-width: 680px;
      }
    }

    /* ========================================
       辅助类
       ======================================== */
    .hidden {
      display: none !important;
    }

    .fade-in {
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- 页面头部 -->
  <header class="page-header">
    <h1 class="page-title">老照片会说话</h1>
    <p class="page-subtitle">让每张老照片，都讲出它的故事</p>
  </header>

  <main class="container">
    <!-- 上传区域 -->
    <section class="upload-section">
      <div class="upload-zone" id="uploadZone">
        <span class="upload-icon">📷</span>
        <p class="upload-text">点击或拖拽上传老照片</p>
        <p class="upload-hint">支持 JPG、PNG 格式，最大 10MB</p>
      </div>
      <input type="file" class="upload-input" id="fileInput" accept="image/*">
      
      <div class="divider"><span>或者</span></div>
      
      <button class="btn btn-secondary btn-full" id="demoBtn">
        <span>✨</span> 体验示例照片
      </button>
    </section>

    <!-- 照片展示区 -->
    <section class="photo-section hidden" id="photoSection">
      <div class="photo-frame">
        <img class="photo-display" id="photoDisplay" src="" alt="上传的照片">
        <p class="photo-caption" id="photoCaption">一张珍贵的回忆</p>
      </div>
    </section>

    <!-- AI识别结果 -->
    <section class="ai-section hidden" id="aiSection">
      <h2 class="section-title">
        <span class="icon">🔍</span> AI 识别结果
      </h2>
      <div class="ai-grid" id="aiGrid">
        <div class="ai-card" data-index="0">
          <div class="ai-card-label">人物数量</div>
          <div class="ai-card-value" id="aiPeople">--</div>
        </div>
        <div class="ai-card" data-index="1">
          <div class="ai-card-label">大致年代</div>
          <div class="ai-card-value" id="aiEra">--</div>
        </div>
        <div class="ai-card" data-index="2">
          <div class="ai-card-label">服装风格</div>
          <div class="ai-card-value" id="aiClothing">--</div>
        </div>
        <div class="ai-card" data-index="3">
          <div class="ai-card-label">背景场景</div>
          <div class="ai-card-value" id="aiScene">--</div>
        </div>
      </div>
    </section>

    <!-- 故事记录区 -->
    <section class="story-record-section hidden" id="storyRecordSection">
      <h2 class="section-title">
        <span class="icon">💭</span> 故事记录
      </h2>
      <div id="questionsContainer">
        <!-- 动态生成问题卡片 -->
      </div>
    </section>

    <!-- 生成按钮 -->
    <section class="generate-section hidden" id="generateSection">
      <button class="btn btn-primary btn-full" id="generateBtn">
        <span>✍️</span> 生成照片故事
      </button>
    </section>

    <!-- 故事预览区 -->
    <section class="story-preview hidden" id="storyPreview">
      <h3 class="story-title" id="storyTitle">照片背后的故事</h3>
      <div class="story-content" id="storyContent"></div>
      <div class="story-footer" id="storyFooter"></div>
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="page-footer">
    <p>老照片会说话 <span class="heart">❤</span> 用 AI 守护家庭记忆</p>
  </footer>

  <script>
    /* ========================================
       示例数据配置
       ======================================== */
    const DEMO_DATA = {
      // 示例照片 URL（复古家庭合影）
      photoUrl: 'https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=800&q=80',
      photoCaption: '1985年春天，奶奶家院子里的全家福',
      // AI 识别结果
      aiResult: {
        people: '3 位人物',
        era: '1980 年代',
        clothing: '复古工装/中山装',
        scene: '庭院/户外'
      },
      // 引导问题与默认答案
      questions: [
        {
          q: '这张照片是在哪里拍的？',
          placeholder: '例如：在我奶奶老家的院子里...',
          answer: '在我奶奶家的老院子里，那棵石榴树后面。'
        },
        {
          q: '照片里的人分别是谁？',
          placeholder: '例如：左边是爸爸，中间是奶奶...',
          answer: '左边是我爸爸，中间是奶奶，右边是我姑姑。'
        },
        {
          q: '那天是什么特别的日子吗？',
          placeholder: '例如：奶奶的生日、春节团聚...',
          answer: '那天是奶奶六十大寿，全家人从各地赶回来。'
        },
        {
          q: '你对这张照片印象最深的是什么？',
          placeholder: '例如：奶奶的笑容、那件旧衣服...',
          answer: '奶奶那件洗得发白却干净整洁的蓝布褂子，和她脸上藏不住的笑意。'
        }
      ]
    };

    /* ========================================
       DOM 元素引用
       ======================================== */
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const demoBtn = document.getElementById('demoBtn');
    const photoSection = document.getElementById('photoSection');
    const photoDisplay = document.getElementById('photoDisplay');
    const photoCaption = document.getElementById('photoCaption');
    const aiSection = document.getElementById('aiSection');
    const aiPeople = document.getElementById('aiPeople');
    const aiEra = document.getElementById('aiEra');
    const aiClothing = document.getElementById('aiClothing');
    const aiScene = document.getElementById('aiScene');
    const storyRecordSection = document.getElementById('storyRecordSection');
    const questionsContainer = document.getElementById('questionsContainer');
    const generateSection = document.getElementById('generateSection');
    const generateBtn = document.getElementById('generateBtn');
    const storyPreview = document.getElementById('storyPreview');
    const storyTitle = document.getElementById('storyTitle');
    const storyContent = document.getElementById('storyContent');
    const storyFooter = document.getElementById('storyFooter');

    /* ========================================
       工具函数
       ======================================== */
    
    // 显示隐藏元素并添加动画
    function showSection(element) {
      element.classList.remove('hidden');
      // 强制重排以确保过渡生效
      void element.offsetWidth;
      element.classList.add('visible');
    }

    // 顺序显示 AI 卡片
    function showAiCards() {
      const cards = document.querySelectorAll('.ai-card');
      cards.forEach((card, index) => {
        setTimeout(() => {
          card.classList.add('visible');
        }, index * 120);
      });
    }

    // 生成问题卡片 HTML
    function renderQuestions(questions) {
      questionsContainer.innerHTML = '';
      questions.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.innerHTML = `
          <div class="question-text">
            <span class="question-number">${index + 1}</span>
            <span>${item.q}</span>
          </div>
          <textarea 
            class="answer-input" 
            data-index="${index}" 
            placeholder="${item.placeholder}"
            rows="2"
          >${item.answer || ''}</textarea>
        `;
        questionsContainer.appendChild(card);
      });
    }

    // 打字机效果
    function typeWriter(element, text, speed = 30) {
      return new Promise((resolve) => {
        element.innerHTML = '<span class="typing-text"></span><span class="typing-cursor"></span>';
        const textSpan = element.querySelector('.typing-text');
        const cursor = element.querySelector('.typing-cursor');
        let i = 0;
        
        function type() {
          if (i < text.length) {
            textSpan.textContent += text.charAt(i);
            i++;
            setTimeout(type, speed);
          } else {
            cursor.style.display = 'none';
            resolve();
          }
        }
        type();
      });
    }

    // 生成故事文本
    function generateStory(questions, answers) {
      const date = new Date();
      const year = date.getFullYear();
      const month = date.getMonth() + 1;
      const day = date.getDate();
      
      let story = '';
      
      // 开头
      story += `这是一张承载着时光印记的照片。`;
      
      // 地点
      if (answers[0]) {
        story += `画面定格在${answers[0].replace(/^[，。！？\s]+/, '').replace(/[，。！？\s]+$/, '')}，`;
      }
      
      // 人物
      if (answers[1]) {
        story += `照片中${answers[1].replace(/^[，。！？\s]+/, '').replace(/[，。！？\s]+$/, '')}，`;
      }
      
      // 年代/服装补充
      story += `那是${DEMO_DATA.aiResult.era.replace(' 年代', '年代')}的光景，`;
      story += `人们穿着${DEMO_DATA.aiResult.clothing.replace('复古', '')}，`;
      story += `在${DEMO_DATA.aiResult.scene.replace(/\/.*/, '')}留下了这珍贵的瞬间。`;
      
      // 特别日子
      if (answers[2]) {
        story += `\n\n那天，${answers[2].replace(/^[，。！？\s]+/, '').replace(/[，。！？\s]+$/, '')}。`;
        story += `快门按下的那一刻，所有的欢笑与温情都被永远珍藏。`;
      }
      
      // 印象
      if (answers[3]) {
        story += `\n\n多年后再翻看这张照片，${answers[3].replace(/^[，。！？\s]+/, '').replace(/[，。！？\s]+$/, '')}。`;
        story += `时光或许会模糊记忆，但照片里的情感却历久弥新。`;
      }
      
      // 结尾
      story += `\n\n每一张老照片都是一段未完的故事，值得我们用心聆听、细心记录。`;
      story += `愿这份温暖的回忆，能够代代相传。`;
      
      return story;
    }

    /* ========================================
       核心流程：加载照片数据
       ======================================== */
    function loadPhotoData(imageUrl, caption, aiData, questionsData) {
      // 1. 展示照片
      photoDisplay.src = imageUrl;
      photoCaption.textContent = caption || '一张珍贵的回忆';
      showSection(photoSection);
      
      // 2. 展示 AI 识别结果（模拟延迟）
      setTimeout(() => {
        aiPeople.textContent = aiData.people;
        aiEra.textContent = aiData.era;
        aiClothing.textContent = aiData.clothing;
        aiScene.textContent = aiData.scene;
        showSection(aiSection);
        showAiCards();
      }, 400);
      
      // 3. 展示问题区域
      setTimeout(() => {
        renderQuestions(questionsData);
        showSection(storyRecordSection);
      }, 700);
      
      // 4. 展示生成按钮
      setTimeout(() => {
        showSection(generateSection);
      }, 900);
    }

    /* ========================================
       事件监听：上传功能
       ======================================== */
    
    // 点击上传区域
    uploadZone.addEventListener('click', () => fileInput.click());
    
    // 文件选择
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (event) => {
          // 使用示例数据但替换为用户上传的图片
          loadPhotoData(
            event.target.result,
            '用户上传的照片',
            DEMO_DATA.aiResult,
            DEMO_DATA.questions
          );
        };
        reader.readAsDataURL(file);
      }
    });
    
    // 拖拽上传
    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('dragover');
    });
    
    uploadZone.addEventListener('dragleave', () => {
      uploadZone.classList.remove('dragover');
    });
    
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      
      const files = e.dataTransfer.files;
      if (files.length > 0 && files[0].type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (event) => {
          loadPhotoData(
            event.target.result,
            '用户上传的照片',
            DEMO_DATA.aiResult,
            DEMO_DATA.questions
          );
        };
        reader.readAsDataURL(files[0]);
      }
    });

    /* ========================================
       事件监听：示例按钮
       ======================================== */
    demoBtn.addEventListener('click', () => {
      loadPhotoData(
        DEMO_DATA.photoUrl,
        DEMO_DATA.photoCaption,
        DEMO_DATA.aiResult,
        DEMO_DATA.questions
      );
    });

    /* ========================================
       事件监听：生成故事
       ======================================== */
    generateBtn.addEventListener('click', async () => {
      // 收集答案
      const inputs = questionsContainer.querySelectorAll('.answer-input');
      const answers = Array.from(inputs).map(input => input.value.trim());
      
      // 检查是否全部填写
      const emptyCount = answers.filter(a => !a).length;
      if (emptyCount > 0) {
        const confirmGenerate = confirm(`还有 ${emptyCount} 个问题未填写，确定要生成故事吗？未填写的问题将被智能补充。`);
        if (!confirmGenerate) return;
      }
      
      // 用默认答案填充空答案
      const finalAnswers = answers.map((a, i) => a || DEMO_DATA.questions[i].answer);
      
      // 显示加载状态
      const originalBtnText = generateBtn.innerHTML;
      generateBtn.disabled = true;
      generateBtn.innerHTML = '<span class="loading-spinner"></span> 正在生成故事...';
      
      // 模拟生成延迟
      await new Promise(resolve => setTimeout(resolve, 1200));
      
      // 生成故事
      const storyText = generateStory(DEMO_DATA.questions, finalAnswers);
      
      // 重置按钮
      generateBtn.disabled = false;
      generateBtn.innerHTML = originalBtnText;
      
      // 显示故事区域
      storyPreview.classList.remove('hidden');
      void storyPreview.offsetWidth;
      storyPreview.classList.add('visible');
      
      // 设置标题和页脚
      storyTitle.textContent = `${DEMO_DATA.aiResult.era.replace(' 年代', '年代')}的那张合影`;
      const now = new Date();
      storyFooter.innerHTML = `—— 由「老照片会说话」于 ${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 记录`;
      
      // 打字机效果输出故事
      storyContent.innerHTML = '';
      await typeWriter(storyContent, storyText, 25);
      
      // 滚动到故事区域
      storyPreview.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  </script>
</body>
