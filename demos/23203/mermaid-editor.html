  <style>

    /* Empty state */
    .empty-state {

    .modal-overlay {

    .modal-body textarea {
      width: 100%; height: 200px;
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 0.75rem;
      font-family: var(--font-mono);

    }

    /* Responsive */
    @media (max-width: 900px) {

<body>
  <header class="app-header">
    <div class="brand">
      <div class="logo">M</div>
      <span>Mermaid图形化编辑器</span>
    </div>
    <div class="actions">
      <button class="btn" onclick="app.importCode()">导入代码</button>
      <button class="btn" onclick="app.exportCode()">导出代码</button>
      <button class="btn primary" onclick="app.copyCode()">复制代码</button>
    </div>
  </header>

  <div class="app-body">
    <!-- Left Sidebar: Node Palette -->
    <aside class="sidebar">
      <h3>节点类型</h3>
      <div class="node-palette" id="node-palette">
        <!-- Filled by JS -->
      </div>
      <h3>连线类型</h3>
      <div class="node-palette" id="edge-palette">
        <!-- Filled by JS -->
      </div>
    </aside>

    <!-- Main Canvas -->
    <div class="main-area">
      <div class="toolbar">
        <button class="btn" onclick="app.undo()">撤销</button>
        <button class="btn" onclick="app.redo()">重做</button>
        <div class="toolbar-sep"></div>
        <button class="btn" onclick="app.clearAll()">清空画布</button>
        <button class="btn" onclick="app.addNode()">+ 添加节点</button>
        <div class="toolbar-sep"></div>
        <button class="btn" onclick="app.layoutAuto()">自动布局</button>
        <div style="flex:1"></div>
        <span style="font-size:0.8rem;color:var(--muted)">提示：点击节点选中，拖拽调整位置（概念演示）</span>
      </div>
      <div class="canvas-wrapper" id="canvas-wrapper">
        <div id="mermaid-canvas">
          <div class="empty-state" id="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <path d="M3 9h18M9 21V9"/>
            </svg>
            <h4>画布为空</h4>
            <p>从左侧拖拽节点到此处，或点击"添加节点"开始创建</p>
          </div>
        </div>
      </div>
      <div class="code-panel">
        <div class="code-panel-header">
          <span>Mermaid 源码</span>
          <span style="font-size:0.75rem;color:var(--muted)">实时生成</span>
        </div>
        <textarea id="code-editor" spellcheck="false" placeholder="graph TD
  A[开始] --> B[处理]
  B --> C[结束]"></textarea>
      </div>
    </div>

    <!-- Right Properties Panel -->
    <aside class="props-panel">
      <h3>节点列表</h3>
      <div class="node-list" id="node-list"></div>
      <h3>节点属性</h3>
      <div id="prop-editor">
        <div class="prop-group">
          <label>节点文本</label>
          <input type="text" id="prop-text" placeholder="输入文本..." oninput="app.updateSelectedNode()">
        </div>
        <div class="prop-group">
          <label>节点形状</label>
          <select id="prop-shape" onchange="app.updateSelectedNode()">
            <option value="rect">矩形 [ ]</option>
            <option value="round">圆角 ( )</option>
            <option value="circle">圆形 (( ))</option>
            <option value="diamond">菱形 { }</option>
            <option value="sub">子流程 [[ ]]</option>
            <option value="cyl">数据库 [( )]</option>
            <option value="asym">不对称 > ]</option>
            <option value="hex">六边形 {{ }}</option>
          </select>
        </div>
        <div class="prop-group">
          <label>填充颜色</label>
          <div class="color-presets" id="color-presets"></div>
        </div>
        <div class="prop-group">
          <label>连接到</label>
          <select id="prop-connect" onchange="app.connectNodes()">
            <option value="">-- 选择节点 --</option>
          </select>
        </div>
        <div class="prop-group">
          <button class="btn danger" style="width:100%" onclick="app.deleteSelectedNode()">删除选中节点</button>
        </div>
      </div>
    </aside>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Import Modal -->
  <div class="modal-overlay" id="import-modal">
    <div class="modal">
      <div class="modal-header">导入 Mermaid 代码</div>
      <div class="modal-body">
        <p>粘贴您的 Mermaid 代码，编辑器将尝试解析并生成图形。</p>
        <textarea id="import-textarea" placeholder="graph TD\n  A --> B"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="app.closeModal()">取消</button>
        <button class="btn primary" onclick="app.confirmImport()">导入</button>
      </div>
    </div>
  </div>

  <script>
    // ========================
    // Mermaid Graphical Editor
    // ========================
    class MermaidEditor {
      constructor() {
        this.nodes = [];
        this.edges = [];
        this.selectedNodeId = null;
        this.history = [];
        this.historyIndex = -1;
        this.nodeCounter = 0;
        this.colors = [
          '#e0f2fe', '#dcfce7', '#fef3c7', '#ffe4e6', '#f3e8ff',
          '#ffedd5', '#ecfccb', '#d1fae5', '#ccfbf1', '#e0e7ff',
          '#0ea5e9', '#22c55e', '#f59e0b', '#ef4444', '#8b5cf6',
          '#f97316', '#84cc16', '#10b981', '#06b6d4', '#6366f1'
        ];
        this.init();
      }

      init() {
        this.renderPalette();
        this.renderColorPresets();
        this.setupCodeEditor();
        this.saveState();
        this.render();
      }

      // ---- State Management ----
      saveState() {
        this.historyIndex++;
        this.history = this.history.slice(0, this.historyIndex);
        this.history.push(JSON.stringify({ nodes: this.nodes, edges: this.edges, counter: this.nodeCounter }));
      }

      undo() {
        if (this.historyIndex > 0) {
          this.historyIndex--;
          this.loadState(this.history[this.historyIndex]);
          this.showToast('已撤销');
        }
      }

      redo() {
        if (this.historyIndex < this.history.length - 1) {
          this.historyIndex++;
          this.loadState(this.history[this.historyIndex]);
          this.showToast('已重做');
        }
      }

      loadState(json) {
        const s = JSON.parse(json);
        this.nodes = s.nodes;
        this.edges = s.edges;
        this.nodeCounter = s.counter;
        this.selectedNodeId = null;
        this.render();
      }

      // ---- Node Operations ----
      genId() {
        this.nodeCounter++;
        return 'N' + this.nodeCounter;
      }

      addNode(type = 'rect') {
        const id = this.genId();
        const shapes = {
          rect: { left: '[', right: ']' },
          round: { left: '(', right: ')' },
          circle: { left: '((', right: '))' },
          diamond: { left: '{', right: '}' },
          sub: { left: '[[', right: ']]' },
          cyl: { left: '[(', right: ')]' },
          asym: { left: '>', right: ']' },
          hex: { left: '{{', right: '}}' }
        };
        const shape = shapes[type] || shapes.rect;
        this.nodes.push({
          id, type,
          text: '新节点 ' + this.nodeCounter,
          shape,
          color: '',
          x: 100 + (this.nodes.length * 30),
          y: 100 + (this.nodes.length * 20)
        });
        this.selectedNodeId = id;
        this.saveState();
        this.render();
      }

      deleteSelectedNode() {
        if (!this.selectedNodeId) return;
        this.nodes = this.nodes.filter(n => n.id !== this.selectedNodeId);
        this.edges = this.edges.filter(e => e.from !== this.selectedNodeId && e.to !== this.selectedNodeId);
        this.selectedNodeId = null;
        this.saveState();
        this.render();
      }

      deleteNode(id) {
        this.nodes = this.nodes.filter(n => n.id !== id);
        this.edges = this.edges.filter(e => e.from !== id && e.to !== id);
        if (this.selectedNodeId === id) this.selectedNodeId = null;
        this.saveState();
        this.render();
      }

      selectNode(id) {
        this.selectedNodeId = id;
        this.renderProps();
        this.render();
      }

      updateSelectedNode() {
        if (!this.selectedNodeId) return;
        const node = this.nodes.find(n => n.id === this.selectedNodeId);
        if (!node) return;
        node.text = document.getElementById('prop-text').value;
        const shapeType = document.getElementById('prop-shape').value;
        const shapes = {
          rect: { left: '[', right: ']' },
          round: { left: '(', right: ')' },
          circle: { left: '((', right: '))' },
          diamond: { left: '{', right: '}' },
          sub: { left: '[[', right: ']]' },
          cyl: { left: '[(', right: ')]' },
          asym: { left: '>', right: ']' },
          hex: { left: '{{', right: '}}' }
        };
        node.shape = shapes[shapeType];
        node.type = shapeType;
        this.render();
      }

      setNodeColor(color) {
        if (!this.selectedNodeId) return;
        const node = this.nodes.find(n => n.id === this.selectedNodeId);
        if (node) {
          node.color = color;
          this.render();
        }
      }

      connectNodes() {
        if (!this.selectedNodeId) return;
        const targetId = document.getElementById('prop-connect').value;
        if (!targetId || targetId === this.selectedNodeId) return;
        const exists = this.edges.some(e => e.from === this.selectedNodeId && e.to === targetId);
        if (!exists) {
          this.edges.push({ from: this.selectedNodeId, to: targetId, label: '' });
          this.saveState();
          this.render();
        }
      }

      // ---- Rendering ----
      generateMermaidCode() {
        if (this.nodes.length === 0) return '';
        let code = 'graph TD\n';
        this.nodes.forEach(n => {
          code += `  ${n.id}${n.shape.left}"${n.text}"${n.shape.right}\n`;
        });
        this.edges.forEach(e => {
          const label = e.label ? `|"${e.label}"|` : '';
          code += `  ${e.from} -->${label} ${e.to}\n`;
        });
        this.nodes.forEach(n => {
          if (n.color) {
            code += `  style ${n.id} fill:${n.color}\n`;
          }
        });
        return code;
      }

      render() {
        const code = this.generateMermaidCode();
        document.getElementById('code-editor').value = code;

        const canvas = document.getElementById('mermaid-canvas');
        if (this.nodes.length === 0) {
          canvas.innerHTML = `
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="M3 9h18M9 21V9"/>
              </svg>
              <h4>画布为空</h4>
              <p>从左侧拖拽节点到此处，或点击"添加节点"开始创建</p>
            </div>`;
        } else {
          canvas.innerHTML = `<div class="mermaid">${code}</div>`;
          try {
            mermaid.init(undefined, canvas.querySelectorAll('.mermaid'));
          } catch (e) {
            canvas.innerHTML += `<div style="color:var(--danger);margin-top:1rem;font-size:0.85rem">渲染错误: ${e.message}</div>`;
          }
        }

        this.renderNodeList();
        this.renderProps();
      }

      renderNodeList() {
        const list = document.getElementById('node-list');
        list.innerHTML = this.nodes.map(n => `
          <div class="node-list-item ${n.id === this.selectedNodeId ? 'active' : ''}" onclick="app.selectNode('${n.id}')">
            <span>${n.text}</span>
            <span class="del-btn" onclick="event.stopPropagation(); app.deleteNode('${n.id}')">删除</span>
          </div>
        `).join('');
      }

      renderProps() {
        const node = this.nodes.find(n => n.id === this.selectedNodeId);
        const connectSelect = document.getElementById('prop-connect');
        connectSelect.innerHTML = '<option value="">-- 选择节点 --</option>' +
          this.nodes.filter(n => n.id !== this.selectedNodeId).map(n =>
            `<option value="${n.id}">${n.text}</option>`
          ).join('');

        if (node) {
          document.getElementById('prop-text').value = node.text;
          document.getElementById('prop-shape').value = node.type;
          document.querySelectorAll('.color-dot').forEach(d => {
            d.classList.toggle('active', d.dataset.color === node.color);
          });
        } else {
          document.getElementById('prop-text').value = '';
          document.getElementById('prop-shape').value = 'rect';
          document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
        }
      }

      renderPalette() {
        const shapes = [
          { type: 'rect', name: '矩形', svg: '<rect x="2" y="2" width="20" height="14" rx="1" fill="var(--accent)" opacity="0.7"/>' },
          { type: 'round', name: '圆角矩形', svg: '<rect x="2" y="2" width="20" height="14" rx="4" fill="var(--accent2)" opacity="0.7"/>' },
          { type: 'circle', name: '圆形', svg: '<circle cx="12" cy="9" r="7" fill="#f59e0b" opacity="0.7"/>' },
          { type: 'diamond', name: '菱形', svg: '<polygon points="12,2 22,9 12,16 2,9" fill="#ef4444" opacity="0.7"/>' },
          { type: 'sub', name: '子流程', svg: '<rect x="2" y="3" width="20" height="12" rx="1" fill="#8b5cf6" opacity="0.7"/><rect x="5" y="3" width="2" height="12" fill="#8b5cf6" opacity="0.9"/><rect x="17" y="3" width="2" height="12" fill="#8b5cf6" opacity="0.9"/>' },
          { type: 'cyl', name: '数据库', svg: '<ellipse cx="12" cy="4" rx="9" ry="3" fill="#10b981" opacity="0.7"/><rect x="3" y="4" width="18" height="10" fill="#10b981" opacity="0.5"/><ellipse cx="12" cy="14" rx="9" ry="3" fill="#10b981" opacity="0.7"/>' },
          { type: 'asym', name: '不对称', svg: '<polygon points="2,2 20,2 22,9 20,16 2,16" fill="#f97316" opacity="0.7"/>' },
          { type: 'hex', name: '六边形', svg: '<polygon points="12,2 20,6 20,12 12,16 4,12 4,6" fill="#06b6d4" opacity="0.7"/>' }
        ];
        document.getElementById('node-palette').innerHTML = shapes.map(s => `
          <div class="palette-item" onclick="app.addNode('${s.type}')">
            <div class="shape-preview"><svg viewBox="0 0 24 18">${s.svg}</svg></div>
            <span>${s.name}</span>
          </div>
        `).join('');
      }

      renderColorPresets() {
        document.getElementById('color-presets').innerHTML = this.colors.map(c => `
          <div class="color-dot" data-color="${c}" style="background:${c}" onclick="app.setNodeColor('${c}')"></div>
        `).join('');
      }

      // ---- Code Editor Sync ----
      setupCodeEditor() {
        const ta = document.getElementById('code-editor');
        let timeout;
        ta.addEventListener('input', () => {
          clearTimeout(timeout);
          timeout = setTimeout(() => this.parseCode(ta.value), 800);
        });
      }

      parseCode(code) {
        // Simple parser for demo
        const lines = code.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('%'));
        if (lines.length === 0) { this.nodes = []; this.edges = []; this.render(); return; }
        const newNodes = [];
        const newEdges = [];
        const nodeMap = {};
        let maxNum = 0;

        lines.forEach(line => {
          // Parse node definition: A["text"] or A[text]
          const nodeMatch = line.match(/^(\w+)\s*([\[(<{]|\(\(|\[\[|\{\{)\s*"?([^"\]]+)"?\s*([\])}>]|\)\)|\]\]|\}\})/);
          if (nodeMatch) {
            const id = nodeMatch[1];
            const left = nodeMatch[2];
            const text = nodeMatch[3];
            const right = nodeMatch[4];
            const typeMap = {
              '[': 'rect', '(': 'round', '((': 'circle', '{': 'diamond',
              '[[': 'sub', '[(]': 'cyl', '>': 'asym', '{{': 'hex'
            };
            const type = typeMap[left] || 'rect';
            if (!nodeMap[id]) {
              const num = parseInt(id.replace(/\D/g, '')) || 0;
              maxNum = Math.max(maxNum, num);
              nodeMap[id] = { id, text, type, shape: { left, right }, color: '' };
              newNodes.push(nodeMap[id]);
            }
          }
          // Parse edge: A --> B or A -->|label| B
          const edgeMatch = line.match(/^(\w+)\s*-->?\s*(?:\|"?([^"|]*)"?\|)?\s*(\w+)/);
          if (edgeMatch && nodeMap[edgeMatch[1]] && nodeMap[edgeMatch[3]]) {
            newEdges.push({ from: edgeMatch[1], to: edgeMatch[3], label: edgeMatch[2] || '' });
          }
          // Parse style: style A fill:#xxx
          const styleMatch = line.match(/style\s+(\w+)\s+fill:([^\s]+)/);
          if (styleMatch && nodeMap[styleMatch[1]]) {
            nodeMap[styleMatch[1]].color = styleMatch[2];
          }
        });

        this.nodes = newNodes;
        this.edges = newEdges;
        this.nodeCounter = maxNum;
        this.render();
      }

      // ---- Actions ----
      clearAll() {
        if (!confirm('确定要清空所有节点和连线吗？')) return;
        this.nodes = [];
        this.edges = [];
        this.selectedNodeId = null;
        this.saveState();
        this.render();
      }

      layoutAuto() {
        // Simple grid layout
        const cols = Math.ceil(Math.sqrt(this.nodes.length));
        this.nodes.forEach((n, i) => {
          n.x = (i % cols) * 180 + 50;
          n.y = Math.floor(i / cols) * 120 + 50;
        });
        this.showToast('已自动布局（概念演示）');
      }

      copyCode() {
        const code = document.getElementById('code-editor').value;
        navigator.clipboard.writeText(code).then(() => this.showToast('代码已复制到剪贴板'));
      }

      exportCode() {
        const code = document.getElementById('code-editor').value;
        const blob = new Blob([code], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'diagram.mmd';
        a.click();
        URL.revokeObjectURL(url);
        this.showToast('已导出 diagram.mmd');
      }

      importCode() {
        document.getElementById('import-modal').classList.add('show');
        document.getElementById('import-textarea').value = document.getElementById('code-editor').value;
      }

      closeModal() {
        document.getElementById('import-modal').classList.remove('show');
      }

      confirmImport() {
        const code = document.getElementById('import-textarea').value;
        this.parseCode(code);
        this.closeModal();
        this.saveState();
        this.showToast('代码已导入');
      }

      showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
      }
    }

    const app = new MermaidEditor();
    mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });

    // Demo data
    app.nodes = [
      { id: 'A', text: '开始', type: 'round', shape: { left: '(', right: ')' }, color: '#dcfce7', x: 50, y: 50 },
      { id: 'B', text: '输入数据', type: 'rect', shape: { left: '[', right: ']' }, color: '', x: 200, y: 50 },
      { id: 'C', text: '验证?', type: 'diamond', shape: { left: '{', right: '}' }, color: '#fef3c7', x: 350, y: 50 },
      { id: 'D', text: '处理', type: 'rect', shape: { left: '[', right: ']' }, color: '', x: 500, y: 50 },
      { id: 'E', text: '结束', type: 'round', shape: { left: '(', right: ')' }, color: '#ffe4e6', x: 650, y: 50 }
    ];
    app.edges = [
      { from: 'A', to: 'B', label: '' },
      { from: 'B', to: 'C', label: '' },
      { from: 'C', to: 'D', label: '通过' },
      { from: 'C', to: 'B', label: '失败' },
      { from: 'D', to: 'E', label: '' }
    ];
    app.nodeCounter = 5;
    app.saveState();
    app.render();
  </script>
</body>
