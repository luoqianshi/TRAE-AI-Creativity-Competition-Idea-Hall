<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>命令生成器</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- 左侧：工具选择栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">命令生成器</div>
      <div class="tool-list" id="toolList"></div>
    </aside>

    <!-- 中间：命令模板列表 -->
    <main class="main-content" id="mainContent">
      <div class="panel-header">命令模板</div>
      <div class="command-list" id="commandList">
        <div class="empty-hint">请在左侧选择工具</div>
      </div>
    </main>

    <!-- 右侧：参数表单与预览 -->
    <aside class="right-panel" id="rightPanel">
      <div class="panel-header">参数填充</div>
      <div class="param-form" id="paramForm">
        <div class="empty-hint">请选择命令模板</div>
      </div>
      <div class="preview-section">
        <label class="preview-label">命令预览</label>
        <div class="preview-box" id="previewBox"></div>
      </div>
      <button class="btn btn-primary btn-copy" id="btnCopy" disabled>复制命令</button>
    </aside>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
