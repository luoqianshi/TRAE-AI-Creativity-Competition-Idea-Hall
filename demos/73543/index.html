<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trae 动态叠加效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #0a0a1a;
            color: #fff;
            position: relative;
        }

        .overlay-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .layer-base {
            position: absolute;
            width: 120%;
            height: 120%;
            top: -10%;
            left: -10%;
            background: linear-gradient(135deg, #1a1a3e 0%, #2d1b69 50%, #0f3460 100%);
            transition: transform 0.2s ease-out;
            z-index: 1;
        }

        .layer-shape {
            position: absolute;
            width: 120%;
            height: 120%;
            top: -10%;
            left: -10%;
            mix-blend-mode: overlay;
            transition: transform 0.25s ease-out;
            z-index: 2;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            animation: breathe 8s ease-in-out infinite;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: #ff6b6b;
            top: 10%;
            left: 15%;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 350px;
            height: 350px;
            background: #4ecdc4;
            top: 40%;
            right: 20%;
            animation-delay: -2s;
        }

        .shape-3 {
            width: 300px;
            height: 300px;
            background: #ffe66d;
            bottom: 15%;
            left: 30%;
            animation-delay: -4s;
        }

        .layer-grid {
            position: absolute;
            width: 120%;
            height: 120%;
            top: -10%;
            left: -10%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            mix-blend-mode: overlay;
            transition: transform 0.15s ease-out;
            z-index: 3;
        }

        .layer-content {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .main-title {
            font-size: 64px;
            font-weight: 700;
            letter-spacing: 8px;
            margin-bottom: 16px;
            background: linear-gradient(90deg, #fff, #a8edea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(168, 237, 234, 0.3);
        }

        .sub-title {
            font-size: 18px;
            color: rgba(255,255,255,0.7);
            letter-spacing: 4px;
        }

        .control-panel {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 24px;
            z-index: 100;
            min-width: 200px;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: rgba(255,255,255,0.9);
        }

        .mode-btn {
            display: block;
            width: 100%;
            padding: 10px 16px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: rgba(255,255,255,0.8);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .mode-btn:hover {
            background: rgba(255,255,255,0.15);
            transform: translateX(-4px);
        }

        .mode-btn.active {
            background: rgba(78, 205, 196, 0.3);
            border-color: rgba(78, 205, 196, 0.6);
            color: #fff;
        }

        .tip {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            z-index: 100;
        }

        @keyframes breathe {
            0%, 100% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 0.9;
                transform: scale(1.1);
            }
        }

        @media (max-width: 768px) {
            .main-title {
                font-size: 36px;
                letter-spacing: 4px;
            }
            .control-panel {
                right: 16px;
                min-width: 160px;
                padding: 16px;
            }
        }

        /* trae 生成标识 */
        .trae-badge {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 12px;
            color: rgba(255,255,255,0.35);
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="overlay-container" id="container">
        <div class="layer-base" id="layerBase"></div>
        
        <div class="layer-shape" id="layerShape">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
        
        <div class="layer-grid" id="layerGrid"></div>
        
        <div class="layer-content">
            <h1 class="main-title">Trae Demo</h1>
            <p class="sub-title">由 Trae 生成 · 动态叠加效果</p>
        </div>
    </div>

    <div class="control-panel">
        <div class="panel-title">叠加模式</div>
        <button class="mode-btn active" data-mode="overlay">叠加</button>
        <button class="mode-btn" data-mode="multiply">正片叠底</button>
        <button class="mode-btn" data-mode="screen">滤色</button>
        <button class="mode-btn" data-mode="difference">差值</button>
    </div>

    <div class="tip">移动鼠标查看视差效果</div>
    <div class="trae-badge">trae 生成</div>

    <script>
        const container = document.getElementById('container');
        const layerBase = document.getElementById('layerBase');
        const layerShape = document.getElementById('layerShape');
        const layerGrid = document.getElementById('layerGrid');
        
        container.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 2;
            const y = (e.clientY / window.innerHeight - 0.5) * 2;
            
            layerBase.style.transform = `translate(${x * -15}px, ${y * -15}px)`;
            layerShape.style.transform = `translate(${x * -30}px, ${y * -30}px)`;
            layerGrid.style.transform = `translate(${x * 20}px, ${y * 20}px)`;
        });

        const modeBtns = document.querySelectorAll('.mode-btn');
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const mode = btn.dataset.mode;
                layerShape.style.mixBlendMode = mode;
                layerGrid.style.mixBlendMode = mode;
            });
        });

        container.addEventListener('mouseleave', () => {
            layerBase.style.transform = 'translate(0, 0)';
            layerShape.style.transform = 'translate(0, 0)';
            layerGrid.style.transform = 'translate(0, 0)';
        });
    </script>
</body>
</html>
