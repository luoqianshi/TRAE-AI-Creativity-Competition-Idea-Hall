<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体感飞机大战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a; display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-height: 100vh;
            font-family: 'Courier New', 'PingFang SC', monospace; overflow: hidden; color: #fff;
        }
        #gameContainer {
            position: relative; width: 960px; height: 540px; border: 3px solid #333;
            border-radius: 8px; overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 150, 255, 0.3);
        }
        canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
        .hud {
            position: absolute; top: 12px; left: 16px; right: 16px;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 10;
        }
        .hud-left { display: flex; flex-direction: column; gap: 2px; }
        .score-display { font-size: 22px; font-weight: bold; color: #00e5ff; text-shadow: 2px 2px 0 #000; }
        .highscore-display { font-size: 12px; color: #ff9800; text-shadow: 1px 1px 0 #000; }
        .combo-display {
            font-size: 14px; color: #ff9800; text-shadow: 1px 1px 0 #000;
            opacity: 0; transition: opacity 0.2s;
        }
        .combo-display.active { opacity: 1; animation: comboPulse 0.4s ease-out; }
        @keyframes comboPulse { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
        .lives-display { font-size: 18px; letter-spacing: 4px; }
        .powerup-indicator {
            font-size: 12px; color: #4fc3f7; text-shadow: 1px 1px 0 #000;
            opacity: 0; transition: opacity 0.3s;
        }
        .powerup-indicator.active { opacity: 1; }
        .gesture-hint { font-size: 14px; color: #aaa; text-shadow: 1px 1px 0 #000; text-align: right; }
        .enemy-legend { font-size: 11px; color: #777; text-shadow: 1px 1px 0 #000; text-align: right; margin-top: 2px; }
        #webcamContainer {
            position: absolute; bottom: 10px; right: 10px;
            width: 160px; height: 120px; border: 2px solid #444;
            border-radius: 6px; overflow: hidden; z-index: 10; opacity: 0.7;
        }
        #webcamFeed { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #camOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 20; pointer-events: none;
        }
        .start-prompt {
            text-align: center; background: rgba(0,0,0,0.85); padding: 30px 50px;
            border-radius: 16px; border: 2px solid #00e5ff; pointer-events: auto;
        }
        .start-prompt h2 { font-size: 28px; color: #00e5ff; margin-bottom: 8px; }
        .start-prompt p { font-size: 14px; color: #ccc; line-height: 1.8; }
        .start-prompt .key {
            display: inline-block; background: #333; color: #00e5ff;
            padding: 4px 12px; border-radius: 6px; margin: 0 4px; border: 1px solid #555;
        }
        .start-prompt .btn {
            display: inline-block; background: #00e5ff; color: #000; font-weight: bold;
            padding: 8px 20px; border-radius: 8px; margin: 4px; cursor: pointer;
            border: none; font-family: inherit; font-size: 14px; transition: all 0.2s; pointer-events: auto;
        }
        .start-prompt .btn:hover { background: #4dd0e1; transform: scale(1.05); }
        .start-prompt .btn.music-on { background: #66bb6a; color: #fff; }
        .start-prompt .btn.music-off { background: #555; color: #aaa; }
        .start-prompt .btn.small { font-size: 12px; padding: 5px 12px; margin-top: 4px; background: #333; color: #aaa; border: 1px solid #555; }
        .start-prompt .btn.small:hover { background: #444; color: #fff; }
        .start-prompt .avatar-preview {
            width: 40px; height: 40px; border-radius: 8px; border: 2px solid #00e5ff;
            margin: 4px auto; image-rendering: pixelated; display: none;
        }
        .start-prompt .avatar-preview.show { display: inline-block; vertical-align: middle; }
        .game-over-overlay {
            text-align: center; background: rgba(0,0,0,0.85); padding: 30px 50px;
            border-radius: 16px; border: 2px solid #e74c3c; pointer-events: auto;
        }
        .game-over-overlay h2 { font-size: 32px; color: #e74c3c; margin-bottom: 8px; }
        .game-over-overlay .final-score { font-size: 48px; color: #00e5ff; font-weight: bold; }
        .game-over-overlay .stats { font-size: 14px; color: #aaa; margin-top: 6px; }
        .game-over-overlay .new-record { color: #FFD700; font-size: 18px; animation: blink 0.5s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
        .score-popup {
            position: absolute; font-size: 20px; font-weight: bold; color: #00e5ff;
            text-shadow: 2px 2px 0 #000; pointer-events: none; z-index: 15;
            animation: popUp 0.8s ease-out forwards;
        }
        @keyframes popUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.5); } }
        @media (max-width: 1000px) { #gameContainer { width: 100vw; height: 56vw; max-height: 540px; } }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div class="hud">
            <div class="hud-left">
                <div class="score-display">SCORE: <span id="scoreText">0</span></div>
                <div class="highscore-display" id="highscoreDisplay">BEST: 0</div>
                <div class="combo-display" id="comboDisplay"></div>
                <div class="lives-display" id="livesDisplay">❤️❤️❤️</div>
                <div class="powerup-indicator" id="powerupIndicator"></div>
            </div>
            <div class="gesture-hint" id="gestureHint">等待开始...</div>
            <div class="enemy-legend" id="enemyLegend">
                <span style="color:#e74c3c;">■</span>普通 <span style="color:#f39c12;">■</span>快 <span style="color:#9c27b0;">■</span>精英×2
            </div>
        </div>
        <button onclick="if(window.parent!==window)window.parent.postMessage('goHome','*')" style="position:absolute;top:12px;left:12px;z-index:30;background:rgba(0,0,0,0.6);color:#fff;border:1px solid rgba(255,255,255,0.2);padding:6px 14px;border-radius:16px;cursor:pointer;font-family:inherit;font-size:13px;letter-spacing:1px;">鈫?杩斿洖棣栭〉</button>
        <button onclick="if(window.parent!==window)window.parent.postMessage('goHome','*')" style="position:absolute;top:12px;left:12px;z-index:30;background:rgba(0,0,0,0.6);color:#fff;border:1px solid rgba(255,255,255,0.2);padding:6px 14px;border-radius:16px;cursor:pointer;font-family:inherit;font-size:13px;letter-spacing:1px;">← 返回首页</button>
        <div id="webcamContainer">
            <video id="webcamFeed" autoplay playsinline></video>
            <canvas id="camOverlay"></canvas>
        </div>
        <div class="overlay-screen" id="overlayScreen">
            <div class="start-prompt" id="startPrompt">
                <h2>✈️ 体感飞机大战</h2>
                <p>
                    手势：<span class="key">双手叉腰</span> = 控制飞机<br>
                    身体 <span class="key">左/右倾斜</span> = 左右移动<br>
                    键盘：<span class="key">←</span><span class="key">→</span> 或 <span class="key">A</span><span class="key">D</span> 移动
                </p>
                <p style="margin-top:6px;">按 <span class="key">空格键</span> 开始游戏 · <span class="key" style="font-size:11px;padding:2px 8px;">P</span> 跑酷</p>
                <p style="font-size:11px;color:#888;margin-top:4px;line-height:1.6;">
                    <span style="color:#e74c3c;">■</span> 普通机  <span style="color:#f39c12;">■</span> 快速机  <span style="color:#9c27b0;">■</span> 精英机(×2)
                </p>
                <p style="margin-top:4px;">
                    <button class="btn music-on" id="btnMusic" onclick="event.stopPropagation();toggleMusic();">🎵 音乐: 开</button>
                </p>
                <p style="margin-top:4px;">
                    <button class="btn small" onclick="event.stopPropagation();switchToParkour();">🏃 返回跑酷</button>
                </p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/vision_bundle.js"></script>
    <script type="module">
        import { PoseLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/+esm';

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreText = document.getElementById('scoreText');
        const highscoreDisplay = document.getElementById('highscoreDisplay');
        const gestureHint = document.getElementById('gestureHint');
        const comboDisplay = document.getElementById('comboDisplay');
        const livesDisplay = document.getElementById('livesDisplay');
        const powerupIndicator = document.getElementById('powerupIndicator');
        const overlayScreen = document.getElementById('overlayScreen');
        const startPrompt = document.getElementById('startPrompt');
        const webcamFeed = document.getElementById('webcamFeed');
        const camOverlay = document.getElementById('camOverlay');
        const camCtx = camOverlay.getContext('2d');

        canvas.width = 960; canvas.height = 540;

        let gameState = 'waiting', score = 0, frameCount = 0;
        let difficultyLevel = 1;
        let lives = 3, invincibleTimer = 0;
        let comboCount = 0, maxCombo = 0, comboResetTimer = 0;
        let highScore = 0;
        let highScoreKey = 'planeHighScore';
        try { highScore = parseInt(localStorage.getItem(highScoreKey) || '0'); } catch(e) { highScore = 0; }
        highscoreDisplay.textContent = 'BEST: ' + highScore;

        const player = {
            x: canvas.width / 2 - 20, y: canvas.height - 70, width: 40, height: 40,
            speed: 8,
        };

        let enemies = [], bullets = [], particles = [], scorePopups = [], starField = [];
        let enemyTimer = 0, enemyInterval = 90;
        let powerupTimer = 0;
        let powerups = [];
        let activePowerup = null, powerupEndTimer = 0;
        const POWERUP_TYPES = { shield: { name: '护盾', color: '#4fc3f7', duration: 360, icon: '🛡️' }, rapid: { name: '速射', color: '#ff9800', duration: 300, icon: '⚡' } };
        let lastFireTime = 0, fireInterval = 7;
        let screenShake = 0;

        let currentGesture = 0, poseLandmarker = null, webcamReady = false;
        let planeMoveDir = 0;
        let smoothTwist = 0;
        let lastDetectTime = 0;

        let audioCtx = null, musicEnabled = true, musicInterval = null, musicNoteIdx = 0;
        const bassNotes = [
            { f: 146.83, d: 0.30 }, { f: 110.00, d: 0.30 }, { f: 146.83, d: 0.30 }, { f: 110.00, d: 0.30 },
            { f: 164.81, d: 0.30 }, { f: 130.81, d: 0.30 }, { f: 98.00, d: 0.30 }, { f: 98.00, d: 0.30 },
        ];
        const melNotes = [
            { f: 440.00, d: 0.20 }, { f: 0, d: 0.10 }, { f: 493.88, d: 0.20 }, { f: 0, d: 0.10 },
            { f: 523.25, d: 0.30 }, { f: 0, d: 0.30 }, { f: 392.00, d: 0.30 }, { f: 0, d: 0.30 },
        ];

        function initAudio() { if (audioCtx) return; try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
        function playTone(freq, duration, type='square', vol=0.08, slide=0, startTime) {
            if (!audioCtx) return;
            const t = startTime || audioCtx.currentTime;
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t);
            if (slide) osc.frequency.linearRampToValueAtTime(freq + slide, t + duration);
            gain.gain.setValueAtTime(vol, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(t); osc.stop(t + duration);
        }
        function sfxShoot() { playTone(880, 0.04, 'square', 0.04); }
        function sfxExplode() { playTone(200, 0.15, 'sawtooth', 0.1, -100); setTimeout(() => playTone(120, 0.2, 'sawtooth', 0.06, -60), 100); }
        function sfxCoin() { playTone(880, 0.06, 'square', 0.06); setTimeout(() => playTone(1100, 0.08, 'square', 0.06), 60); }
        function sfxPowerup() { playTone(523, 0.06, 'square', 0.06); setTimeout(() => playTone(659, 0.06, 'square', 0.05), 60); setTimeout(() => playTone(784, 0.06, 'square', 0.05), 120); setTimeout(() => playTone(1047, 0.1, 'square', 0.06), 180); }
        function sfxHit() { playTone(120, 0.2, 'sawtooth', 0.1, -80); setTimeout(() => playTone(80, 0.15, 'sawtooth', 0.08, -50), 100); }
        function sfxDeath() { playTone(200, 0.15, 'sawtooth', 0.1, -100); setTimeout(() => playTone(150, 0.15, 'sawtooth', 0.08, -80), 120); setTimeout(() => playTone(100, 0.2, 'sawtooth', 0.06, -60), 240); setTimeout(() => playTone(60, 0.3, 'sawtooth', 0.05, -40), 380); }

        function startMusic() {
            if (!musicEnabled || !audioCtx) return; stopMusic(); musicNoteIdx = 0;
            function playNext() {
                if (!musicEnabled || gameState !== 'playing') { stopMusic(); return; }
                const bNote = bassNotes[musicNoteIdx % bassNotes.length], mNote = melNotes[musicNoteIdx % melNotes.length];
                const t = audioCtx.currentTime;
                if (bNote.f > 0) playTone(bNote.f, bNote.d * 0.9, 'triangle', 0.04, 0, t);
                if (mNote.f > 0) playTone(mNote.f, mNote.d * 0.8, 'square', 0.03, 0, t);
                musicNoteIdx++;
                musicInterval = setTimeout(playNext, bNote.d * 1000);
            }
            musicInterval = setTimeout(playNext, 100);
        }
        function stopMusic() { if (musicInterval) { clearTimeout(musicInterval); musicInterval = null; } }
        window.toggleMusic = function() {
            musicEnabled = !musicEnabled;
            const btn = document.getElementById('btnMusic');
            if (btn) { btn.textContent = musicEnabled ? '🎵 音乐: 开' : '🔇 音乐: 关'; btn.className = 'btn ' + (musicEnabled ? 'music-on' : 'music-off'); }
            if (musicEnabled && gameState === 'playing') startMusic(); else stopMusic();
        };

        window.switchToParkour = function() {
            window.location.href = 'parkour-game.html';
        };

        // 手势检测：双手叉腰 + 腰部扭动（Z轴深度版：利用肩膀前后移动检测扭腰）
        function detectPlaneGesture(landmarks) {
            if (!landmarks || landmarks.length === 0) return 0;
            // MediaPipe Pose landmarks:
            // 11=左肩, 12=右肩, 23=左髋, 24=右髋, 15=左手腕, 16=右手腕
            // z 坐标：负值 = 朝向摄像头（前方），正值 = 远离摄像头（后方）
            const lShoulder = landmarks[11], rShoulder = landmarks[12];
            const lHip = landmarks[23], rHip = landmarks[24];
            const lWrist = landmarks[15], rWrist = landmarks[16];
            const lElbow = landmarks[13], rElbow = landmarks[14];
            if (!lShoulder || !rShoulder || !lHip || !rHip) return 0;

            // ===== 1. 检测双手是否在腰部附近（很宽松的阈值） =====
            const hipCenterY = (lHip.y + rHip.y) / 2;
            const shoulderY = (lShoulder.y + rShoulder.y) / 2;
            const torsoHeight = hipCenterY - shoulderY;
            // 手腕在肩腰之间下半部分 或 略低于腰部
            const wristsInTorso = lWrist && rWrist &&
                lWrist.y > shoulderY + torsoHeight * 0.2 &&
                rWrist.y > shoulderY + torsoHeight * 0.2 &&
                Math.abs(lWrist.y - hipCenterY) < torsoHeight * 1.2 &&
                Math.abs(rWrist.y - hipCenterY) < torsoHeight * 1.2;
            // 手肘向外弯（叉腰的典型姿态）
            const elbowsOut = lElbow && rElbow &&
                lElbow.x < (lShoulder.x + lHip.x) / 2 &&
                rElbow.x > (rShoulder.x + rHip.x) / 2;
            const isHandsNearWaist = (!lWrist || !rWrist) ? false : (wristsInTorso || elbowsOut);

            // ===== 2. 扭腰检测（核心：Z轴深度差） =====
            // 肩膀 Z 轴差值：扭腰时肩膀会一前一后
            // 左肩z - 右肩z：左扭时左肩前移(z更负) → 负值；右扭时右肩前移 → 正值
            const zDiff = (lShoulder.z || 0) - (rShoulder.z || 0);

            // 肩膀 X 轴中心相对髋部 X 轴中心的偏移
            const shoulderCenterX = (lShoulder.x + rShoulder.x) / 2;
            const hipCenterX = (lHip.x + rHip.x) / 2;
            const xDiff = shoulderCenterX - hipCenterX;

            // 肩膀倾斜角度（左肩相对右肩的高低差 - 髋部的高低差）
            const shoulderTilt = (lShoulder.y - rShoulder.y);
            const hipTilt = (lHip.y - rHip.y);
            const tiltDiff = shoulderTilt - hipTilt;

            // 综合三个信号，根据不同场景加权
            // Z轴差是最灵敏的扭腰信号（肩膀前后移动），权重最高
            let twist = zDiff * 20      // Z轴深度差（主力）
                       + xDiff * 10     // X轴偏移（辅助）
                       + tiltDiff * 3;  // 肩膀倾斜（辅助）

            // 如果检测到手在腰部附近，说明用户正在主动做叉腰扭腰动作 → 进一步放大
            if (isHandsNearWaist) {
                twist = zDiff * 28 + xDiff * 14 + tiltDiff * 4;
            }

            // ===== 3. 平滑滤波 =====
            // 使用较快的平滑速度，同时保留一定的抗抖动能力
            smoothTwist = smoothTwist * 0.5 + twist * 0.5;

            // ===== 4. 死区 =====
            if (Math.abs(smoothTwist) < 0.012) return 0;

            // ===== 5. 输出 -1~1（取反以匹配镜像摄像头方向） =====
            return Math.max(-1, Math.min(1, -smoothTwist));
        }

        function spawnEnemy() {
            const type = Math.random();
            let e;
            if (type < 0.4) {
                e = { x: Math.random() * (canvas.width - 30), y: -40, width: 28, height: 28, speed: 1.5 + Math.random() * 1 + difficultyLevel * 0.2, hp: 1, color: '#e74c3c', type: 'normal', shootTimer: 0 };
            } else if (type < 0.7) {
                e = { x: Math.random() * (canvas.width - 24), y: -40, width: 24, height: 24, speed: 2 + Math.random() * 0.8 + difficultyLevel * 0.15, hp: 1, color: '#f39c12', type: 'fast', shootTimer: 0 };
            } else {
                e = { x: Math.random() * (canvas.width - 36), y: -40, width: 36, height: 36, speed: 1 + difficultyLevel * 0.15, hp: 2, color: '#9c27b0', type: 'tough', shootTimer: 0 };
            }
            enemies.push(e);
        }

        function spawnParticles(x, y, color, count=8) {
            for (let i = 0; i < count; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5 - 2, life: 20, color, size: Math.random() * 3 + 1 });
        }
        function addScorePopup(x, y, text, color='#00e5ff') { scorePopups.push({ x, y, text, color, life: 35, vy: -2 }); }

        function startGame() {
            gameState = 'playing'; score = 0; frameCount = 0;
            difficultyLevel = 1; lives = 3; invincibleTimer = 0;
            comboCount = 0; maxCombo = 0; comboResetTimer = 0;
            enemies = []; bullets = []; particles = []; scorePopups = [];
            powerups = []; activePowerup = null; powerupEndTimer = 0;
            enemyTimer = 0; enemyInterval = 90; powerupTimer = 0;
            player.x = canvas.width / 2 - 20; planeMoveDir = 0; smoothTwist = 0;
            overlayScreen.style.display = 'none';
            scoreText.textContent = '0';
            comboDisplay.textContent = ''; comboDisplay.classList.remove('active');
            livesDisplay.textContent = '❤️❤️❤️';
            powerupIndicator.textContent = ''; powerupIndicator.classList.remove('active');
            gestureHint.textContent = '准备...';
            startMusic();
        }
        function restartGame() { startGame(); }

        window.goHome = function() {
            if (window.parent !== window) { window.parent.postMessage('goHome', '*'); return; }
            stopMusic(); gameState = 'waiting'; score = 0; frameCount = 0; smoothTwist = 0;
            lives = 3; enemies = []; bullets = []; particles = []; scorePopups = [];
            activePowerup = null; powerupEndTimer = 0;
            scoreText.textContent = '0';
            livesDisplay.textContent = '❤️❤️❤️';
            powerupIndicator.textContent = ''; powerupIndicator.classList.remove('active');
            highscoreDisplay.textContent = 'BEST: ' + highScore;
            overlayScreen.style.display = 'flex';
            gestureHint.textContent = '等待开始...';
        };

        function gameOver() {
            gameState = 'over'; sfxDeath(); stopMusic();
            const finalScore = Math.floor(score);
            let newRecord = false;
            if (finalScore > highScore) { highScore = finalScore; newRecord = true; try { localStorage.setItem(highScoreKey, highScore); } catch(e) {} }
            highscoreDisplay.textContent = 'BEST: ' + highScore;
            overlayScreen.style.display = 'flex';
            startPrompt.innerHTML = `<div class="game-over-overlay">
                <h2>💥 坠毁</h2>
                <div class="final-score">${finalScore}</div>
                ${newRecord ? '<div class="new-record">🏆 历史最高纪录！</div>' : ''}
                <div class="stats">击毁: ${maxCombo}架 | 难度: Lv.${difficultyLevel}</div>
                <p style="color:#ccc;margin-top:10px;">
                    <span class="key" style="padding:4px 16px;">Space</span> 重新开始<br>
                    <span class="key" style="padding:4px 12px;font-size:11px;">H</span> 回主页<br>
                    <span class="key" style="padding:4px 10px;font-size:10px;">P</span> 跑酷
                </p>
                <div style="display:flex;gap:8px;justify-content:center;margin-top:8px;">
                    
                </div>
            </div>`;
        }

        function loseLife() {
            if (invincibleTimer > 0 || (activePowerup && activePowerup.type === 'shield')) return;
            lives--; invincibleTimer = 60; comboCount = 0; comboDisplay.classList.remove('active');
            screenShake = 12; sfxHit();
            livesDisplay.textContent = '❤️'.repeat(Math.max(0, lives));
            if (lives <= 0) { gameOver(); return; }
            spawnParticles(player.x + player.width / 2, player.y + player.height / 2, '#e74c3c', 15);
        }

        function update() {
            if (gameState !== 'playing') return;
            frameCount++;

            if (invincibleTimer > 0) invincibleTimer--;
            if (comboCount > 0) { comboResetTimer++; if (comboResetTimer > 180) { comboCount = 0; comboDisplay.classList.remove('active'); } }

            if (activePowerup) {
                powerupEndTimer--;
                powerupIndicator.textContent = activePowerup.info.icon + ' ' + activePowerup.info.name + ' ' + Math.ceil(powerupEndTimer / 60) + 's';
                if (powerupEndTimer <= 0) { activePowerup = null; powerupIndicator.classList.remove('active'); powerupIndicator.textContent = ''; }
            }

            const newLevel = Math.floor(score / 200) + 1;
            if (newLevel > difficultyLevel) {
                difficultyLevel = newLevel;
                enemyInterval = Math.max(45, 90 - (difficultyLevel - 1) * 5);
                gestureHint.textContent = '难度 UP! Lv.' + difficultyLevel;
            }

            const kbGesture = getKeyboardGesture();
            // currentGesture 是 -1~1 的浮点数（体感），kbGesture 是 -1/0/1（键盘）
            let gestureVal = 0;
            if (kbGesture !== 0) {
                gestureVal = kbGesture;
            } else if (Math.abs(currentGesture) > 0.01 && typeof currentGesture === 'number') {
                gestureVal = currentGesture;
            }
            planeMoveDir = gestureVal;

            player.x += player.speed * planeMoveDir;
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));

            if (Math.abs(planeMoveDir) > 0.1 && frameCount - lastFireTime > fireInterval) {
                if (!activePowerup || activePowerup.type !== 'rapid' || frameCount % 3 === 0) {
                    bullets.push({ x: player.x + player.width / 2 - 2, y: player.y - 10, width: 4, height: 10, speed: 10 });
                    if (activePowerup && activePowerup.type === 'rapid') {
                        bullets.push({ x: player.x + 4, y: player.y - 6, width: 3, height: 8, speed: 8 });
                        bullets.push({ x: player.x + player.width - 7, y: player.y - 6, width: 3, height: 8, speed: 8 });
                    }
                    if (frameCount % 6 === 0) sfxShoot();
                    lastFireTime = frameCount;
                }
                const dir = planeMoveDir > 0 ? '→' : '←';
                const intensity = Math.abs(planeMoveDir);
                const bars = intensity > 0.7 ? '💨' : intensity > 0.4 ? '>>' : '>';
                gestureHint.textContent = dir + ' ' + bars + '  ' + Math.round(intensity * 100) + '%';
            } else if (frameCount % 30 === 0) {
                gestureHint.textContent = '✋ 叉腰扭动';
            }

            for (let i = bullets.length - 1; i >= 0; i--) { bullets[i].y -= bullets[i].speed; if (bullets[i].y < -20) bullets.splice(i, 1); }

            enemyTimer++;
            if (enemyTimer >= enemyInterval) { enemyTimer = 0; spawnEnemy(); }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.speed = (1.5 + Math.random() * 0.5 + difficultyLevel * 0.2) * 1.5;
                e.y += e.speed;
                if (e.y > canvas.height + 40) { enemies.splice(i, 1); continue; }
                if (e.type === 'fast') e.x += Math.sin(frameCount * 0.04 + e.y * 0.01) * 1.5;
            }

            powerupTimer++;
            if (powerupTimer >= 400 && powerups.length < 2) { powerupTimer = 0;
                const types = ['shield', 'rapid'];
                const t = types[Math.floor(Math.random() * types.length)];
                const info = POWERUP_TYPES[t];
                powerups.push({ x: Math.random() * (canvas.width - 28), y: -20, type: t, width: 28, height: 28, speed: 1.2, collected: false, info });
            }
            for (let i = powerups.length - 1; i >= 0; i--) { powerups[i].y += powerups[i].speed; if (powerups[i].y > canvas.height + 30) powerups.splice(i, 1); }

            const px = player.x, py = player.y, pw = player.width, ph = player.height;
            for (let bi = bullets.length - 1; bi >= 0; bi--) {
                const b = bullets[bi];
                let bulletUsed = false;
                for (let ei = enemies.length - 1; ei >= 0; ei--) {
                    const e = enemies[ei];
                    if (b.x < e.x + e.width && b.x + b.width > e.x && b.y < e.y + e.height && b.y + b.height > e.y) {
                        e.hp--;
                        if (e.hp <= 0) {
                            spawnParticles(e.x + e.width / 2, e.y + e.height / 2, e.color, 12);
                            sfxExplode();
                            const pts = Math.floor(10 * (1 + comboCount * 0.2));
                            score += pts;
                            comboCount++; comboResetTimer = 0;
                            if (comboCount > maxCombo) maxCombo = comboCount;
                            addScorePopup(e.x + e.width / 2, e.y, '+' + pts, '#FFD700');
                            if (comboCount >= 3) { comboDisplay.textContent = comboCount + 'x COMBO!'; comboDisplay.classList.add('active'); }
                            enemies.splice(ei, 1);
                        }
                        bulletUsed = true;
                        break;
                    }
                }
                if (bulletUsed) { bullets.splice(bi, 1); }
            }

            for (let ei = enemies.length - 1; ei >= 0; ei--) {
                const e = enemies[ei];
                if (px < e.x + e.width && px + pw > e.x && py < e.y + e.height && py + ph > e.y) {
                    spawnParticles(e.x + e.width / 2, e.y + e.height / 2, '#e74c3c', 15);
                    enemies.splice(ei, 1);
                    loseLife(); return;
                }
            }

            for (let pu of powerups) {
                if (pu.collected) continue;
                if (px < pu.x + pu.width && px + pw > pu.x && py < pu.y + pu.height && py + ph > pu.y) {
                    pu.collected = true; activePowerup = pu; powerupEndTimer = pu.info.duration;
                    powerupIndicator.textContent = pu.info.icon + ' ' + pu.info.name; powerupIndicator.classList.add('active');
                    sfxPowerup(); spawnParticles(pu.x + pu.width / 2, pu.y + pu.height / 2, pu.info.color, 10);
                    addScorePopup(pu.x + pu.width / 2, pu.y, pu.info.name + '!', pu.info.color);
                }
            }
            powerups = powerups.filter(p => !p.collected);

            for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--; if (p.life <= 0) particles.splice(i, 1); }
            for (let i = scorePopups.length - 1; i >= 0; i--) { const sp = scorePopups[i]; sp.y += sp.vy; sp.life--; if (sp.life <= 0) scorePopups.splice(i, 1); }
            if (screenShake > 0) screenShake *= 0.85; if (screenShake < 0.3) screenShake = 0;

            scoreText.textContent = Math.floor(score);
        }

        function drawStarField() {
            if (starField.length === 0) {
                for (let i = 0; i < 80; i++) starField.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2 + 0.5, speed: 0.3 + Math.random() * 0.5 });
            }
            starField.forEach(s => { s.y += s.speed; if (s.y > canvas.height) { s.y = -2; s.x = Math.random() * canvas.width; } });
            starField.forEach(s => { ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.random() * 0.5})`; ctx.fillRect(s.x, s.y, s.size, s.size); });
        }

        function drawPlane() {
            const c = ctx, x = player.x, y = player.y;
            c.fillStyle = '#00e5ff';
            c.fillRect(x + 14, y - 8, 12, 8);
            c.fillStyle = '#00bcd4';
            c.fillRect(x + 12, y - 4, 16, 6);
            c.fillStyle = '#0097a7';
            c.fillRect(x + 10, y, 20, 12);
            c.fillRect(x + 6, y + 6, 28, 10);
            c.fillStyle = '#00838f';
            c.fillRect(x + 4, y + 10, 32, 16);
            c.fillStyle = '#006064';
            c.fillRect(x, y + 14, 40, 22);
            c.fillStyle = '#00e5ff';
            c.fillRect(x + 8, y + 16, 6, 10);
            c.fillRect(x + 26, y + 16, 6, 10);
            c.fillStyle = '#ffeb3b';
            c.fillRect(x + 18, y + 10, 4, 4);
            if (invincibleTimer > 0 && Math.floor(frameCount / 4) % 2 === 0) return;
            if (activePowerup && activePowerup.type === 'shield') {
                c.strokeStyle = `rgba(79,195,247,${0.4 + Math.sin(frameCount * 0.1) * 0.3})`;
                c.lineWidth = 2;
                c.beginPath(); c.arc(x + 20, y + 24, 28, 0, Math.PI * 2); c.stroke();
            }
        }

        function drawEnemy(e) {
            const c = ctx, x = e.x, y = e.y, w = e.width, h = e.height;
            if (e.type === 'tough') {
                c.fillStyle = '#7b1fa2'; c.fillRect(x, y, w, h);
                c.fillStyle = '#ce93d8'; c.fillRect(x + 4, y + 4, w - 8, h - 8);
                c.fillStyle = '#e91e63'; c.fillRect(x + w / 2 - 3, y + h / 2 - 3, 6, 6);
            } else if (e.type === 'fast') {
                c.fillStyle = '#f57c00'; c.fillRect(x, y, w, h);
                c.fillStyle = '#ffe082'; c.fillRect(x + 4, y + 4, w - 8, h - 8);
                c.fillStyle = '#e65100'; c.fillRect(x + w / 2 - 2, y + h / 2 - 2, 4, 4);
            } else {
                c.fillStyle = '#c62828'; c.fillRect(x, y, w, h);
                c.fillStyle = '#ef9a9a'; c.fillRect(x + 4, y + 4, w - 8, h - 8);
                c.fillStyle = '#b71c1c'; c.fillRect(x + w / 2 - 3, y + h / 2 - 3, 6, 6);
            }
            if (e.type === 'tough' && e.hp > 0) {
                c.fillStyle = '#FFD700';
                const hpRatio = e.hp / 2;
                c.fillRect(x + 2, y - 6, (w - 4) * hpRatio, 3);
            }
        }

        function render() {
            const c = ctx; c.clearRect(0, 0, canvas.width, canvas.height);
            let sx = 0, sy = 0;
            if (screenShake > 0) { sx = (Math.random() - 0.5) * screenShake; sy = (Math.random() - 0.5) * screenShake; }
            c.save(); c.translate(sx, sy);

            const grad = c.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#0a0a2e');
            grad.addColorStop(0.5, '#0d0d3a');
            grad.addColorStop(1, '#1a1a2e');
            c.fillStyle = grad; c.fillRect(0, 0, canvas.width, canvas.height);

            drawStarField();

            c.fillStyle = '#00e5ff';
            c.globalAlpha = 0.03;
            for (let i = 0; i < 6; i++) {
                const lx = (i * 200 + frameCount * 0.5) % (canvas.width + 100) - 50;
                c.fillRect(lx, 0, 3, canvas.height);
            }
            c.globalAlpha = 1;

            enemies.forEach(e => drawEnemy(e));

            bullets.forEach(b => {
                c.fillStyle = '#FFD700';
                c.fillRect(b.x, b.y, b.width, b.height);
                c.fillStyle = 'rgba(255,215,0,0.3)';
                c.fillRect(b.x - 2, b.y - 2, b.width + 4, b.height + 4);
            });

            powerups.forEach(pu => {
                if (pu.collected) return;
                const bob = Math.sin(frameCount * 0.06 + pu.x) * 3;
                const glow = Math.sin(frameCount * 0.1) * 0.3 + 0.7;
                c.fillStyle = pu.info.color;
                c.globalAlpha = glow * 0.3;
                c.fillRect(pu.x - 4, pu.y + bob - 4, pu.width + 8, pu.height + 8);
                c.globalAlpha = 1;
                c.fillStyle = pu.info.color;
                c.fillRect(pu.x, pu.y + bob, pu.width, pu.height);
                c.fillStyle = '#fff';
                c.font = 'bold 14px monospace'; c.textAlign = 'center';
                c.fillText(pu.info.icon, pu.x + pu.width / 2, pu.y + bob + pu.height - 6);
            });

            drawPlane();

            particles.forEach(p => { c.fillStyle = p.color; c.globalAlpha = p.life / 20; c.fillRect(p.x, p.y, p.size, p.size); });
            c.globalAlpha = 1; c.restore();

            scorePopups.forEach(sp => { c.fillStyle = sp.color; c.globalAlpha = sp.life / 35; c.font = 'bold 16px "Courier New", monospace'; c.textAlign = 'center'; c.fillText(sp.text, sp.x, sp.y); });
            c.globalAlpha = 1;
        }

        function detectPose() {
            if (!poseLandmarker || !webcamReady || webcamFeed.readyState < 2) {
                return;
            }
            lastDetectTime = performance.now();
            try {
                const results = poseLandmarker.detect(webcamFeed);
                if (results && results.landmarks && results.landmarks.length > 0) {
                    const g = detectPlaneGesture(results.landmarks[0]);
                    if (gameState === 'playing') currentGesture = g;
                } else {
                    currentGesture = 0;
                }
            } catch(e) {
                currentGesture = 0;
            }
        }

        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.key] = true;
            if (e.key === ' ') { e.preventDefault(); initAudio(); if (gameState === 'waiting') startGame(); if (gameState === 'over') restartGame(); }
            if (e.key === 'm' || e.key === 'M') { e.preventDefault(); toggleMusic(); }
            if (e.key === 'Escape' || e.key === 'h' || e.key === 'H') { e.preventDefault(); if (gameState === 'playing' || gameState === 'over') goHome(); }
                    });
        window.addEventListener('keyup', e => { keys[e.key] = false; });
        function getKeyboardGesture() {
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) return -1;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) return 1;
            return 0;
        }

        let recovering = false;

        function gameLoop() {
            try {
                if (gameState === 'playing') {
                    update();
                    detectPose();
                    render();
                } else {
                    currentGesture = 0;
                    if (frameCount % 15 === 0) render();
                }
                // 看门狗：检测 detectPose 是否卡死，3 秒无响应则重建
                const now = performance.now();
                if (webcamReady && poseLandmarker && now - lastDetectTime > 3000 && !recovering) {
                    recovering = true;
                    poseLandmarker.close();
                    poseLandmarker = null;
                    initLandmarker().then(function() { recovering = false; });
                }
            } catch(e) {}
            requestAnimationFrame(gameLoop);
        }

        async function initLandmarker() {
            try {
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm");
                poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
                    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task', delegate: "CPU" },
                    runningMode: "IMAGE", numPoses: 1
                });
                lastDetectTime = performance.now();
            } catch (e) { poseLandmarker = null; }
        }

        async function init() {
            camOverlay.width = 160; camOverlay.height = 120;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
                webcamFeed.srcObject = stream; await webcamFeed.play(); webcamReady = true;
            } catch (e) { gestureHint.textContent = '键盘模式 - 空格开始'; }
            await initLandmarker();
            if (webcamReady) { gestureHint.textContent = '体感就绪 - 空格开始'; }
            gameLoop();
        }
        init();
    </script>
</body>
