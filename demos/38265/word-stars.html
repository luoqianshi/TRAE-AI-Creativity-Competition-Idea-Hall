<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ WordStars — 60,000词星空</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap');

:root {
  --bg-deep: #020810;
  --bg-panel: rgba(8, 16, 32, 0.88);
  --accent-cyan: #00e5ff;
  --accent-pink: #ff2d7b;
  --accent-gold: #ffd700;
  --accent-purple: #b388ff;
  --text-main: #e0e8f0;
  --text-dim: #5a6a80;
  --border-glow: rgba(0, 229, 255, 0.2);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg-deep);
  color: var(--text-main);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  user-select: none;
}

#canvas3d { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; }

/* Sidebar */
.sidebar {
  position:fixed; top:0; left:0; width:280px; height:100vh;
  background: var(--bg-panel); backdrop-filter: blur(24px);
  border-right: 1px solid var(--border-glow); z-index:100;
  display:flex; flex-direction:column;
  transition: transform 0.4s cubic-bezier(0.22,1,0.36,1);
}
.sidebar.collapsed { transform: translateX(-280px); }
.sidebar-toggle {
  position:fixed; top:16px; left:288px; width:36px; height:36px;
  background:var(--bg-panel); border:1px solid var(--border-glow);
  border-radius:8px; color:var(--accent-cyan); cursor:pointer;
  z-index:101; display:flex; align-items:center; justify-content:center;
  font-size:16px; transition:all 0.3s;
}
.sidebar-toggle:hover { background:rgba(0,229,255,0.1); box-shadow:0 0 12px rgba(0,229,255,0.3); }
.sidebar-toggle.shifted { left:8px; }

.sb-header { padding:24px 20px 16px; border-bottom:1px solid rgba(255,255,255,0.06); }
.sb-header h1 {
  font-family:'Orbitron',sans-serif; font-size:18px; font-weight:900;
  background:linear-gradient(135deg,var(--accent-cyan),var(--accent-pink));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:2px;
}
.sb-header .sub { font-size:11px; color:var(--text-dim); margin-top:4px; letter-spacing:1px; }

.progress-wrap { padding:12px 20px; border-bottom:1px solid rgba(255,255,255,0.06); }
.progress-bar-bg { width:100%; height:6px; background:rgba(255,255,255,0.08); border-radius:3px; overflow:hidden; margin-top:6px; }
.progress-bar-fill { height:100%; background:linear-gradient(90deg,var(--accent-cyan),var(--accent-pink)); border-radius:3px; transition:width 0.6s; width:0%; }
.progress-text { font-size:12px; color:var(--text-dim); display:flex; justify-content:space-between; }
.progress-text span:last-child { color:var(--accent-cyan); font-family:'Space Mono',monospace; }

.search-box { padding:12px 20px; border-bottom:1px solid rgba(255,255,255,0.06); }
.search-input {
  width:100%; padding:8px 12px; background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08); border-radius:8px;
  color:var(--text-main); font-size:13px; font-family:'Space Mono',monospace;
  outline:none; transition:all 0.2s;
}
.search-input:focus { border-color:var(--accent-cyan); box-shadow:0 0 8px rgba(0,229,255,0.15); }
.search-input::placeholder { color:var(--text-dim); }

.chapter-list { flex:1; overflow-y:auto; padding:8px 0; scrollbar-width:thin; scrollbar-color:rgba(0,229,255,0.2) transparent; }
.chapter-list::-webkit-scrollbar { width:4px; }
.chapter-list::-webkit-scrollbar-thumb { background:rgba(0,229,255,0.2); border-radius:2px; }
.ch-item {
  padding:10px 20px; cursor:pointer; transition:all 0.25s;
  border-left:3px solid transparent;
}
.ch-item:hover { background:rgba(0,229,255,0.05); border-left-color:rgba(0,229,255,0.3); }
.ch-item.active { background:rgba(0,229,255,0.08); border-left-color:var(--accent-cyan); }
.ch-item.done { border-left-color:var(--accent-gold); }
.ch-item.done .ch-name { color:var(--accent-gold); }
.ch-name { font-size:13px; font-weight:700; margin-bottom:3px; display:flex; align-items:center; gap:8px; }
.ch-meta { font-size:11px; color:var(--text-dim); display:flex; gap:12px; }
.ch-meta .n { color:var(--accent-cyan); }
.ch-bar { width:100%; height:2px; background:rgba(255,255,255,0.06); margin-top:6px; border-radius:1px; overflow:hidden; }
.ch-bar-fill { height:100%; background:var(--accent-cyan); border-radius:1px; transition:width 0.5s; }

/* Word Panel */
.word-panel {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(140%);
  width:520px; max-width:calc(100vw - 320px);
  background:var(--bg-panel); backdrop-filter:blur(24px);
  border:1px solid var(--border-glow); border-radius:16px;
  padding:24px; z-index:200;
  transition:transform 0.5s cubic-bezier(0.22,1,0.36,1);
  box-shadow:0 8px 40px rgba(0,0,0,0.5), 0 0 30px rgba(0,229,255,0.06);
}
.word-panel.show { transform:translateX(-50%) translateY(0); }
.wp-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
.wp-word { font-family:'Orbitron',sans-serif; font-size:26px; font-weight:900; color:#fff; letter-spacing:2px; }
.wp-phonetic { font-family:'Space Mono',monospace; font-size:13px; color:var(--accent-purple); margin-top:3px; }
.wp-close {
  background:none; border:1px solid rgba(255,255,255,0.1); color:var(--text-dim);
  width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:16px;
  display:flex; align-items:center; justify-content:center; transition:all 0.2s;
}
.wp-close:hover { border-color:var(--accent-pink); color:var(--accent-pink); }
.wp-pos {
  display:inline-block; background:rgba(0,229,255,0.1); border:1px solid rgba(0,229,255,0.2);
  color:var(--accent-cyan); font-size:11px; padding:2px 8px; border-radius:4px;
  margin-bottom:10px; font-family:'Space Mono',monospace;
}
.wp-meaning { font-size:15px; line-height:1.7; margin-bottom:10px; padding-left:12px; border-left:2px solid var(--accent-cyan); }
.wp-example { font-size:13px; color:var(--text-dim); line-height:1.6; font-style:italic; padding:8px 12px; background:rgba(255,255,255,0.03); border-radius:8px; margin-bottom:14px; }
.wp-example em { color:var(--accent-cyan); font-style:normal; font-weight:700; }
.wp-relations { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
.rel-tag {
  font-size:11px; padding:3px 10px; border-radius:12px; cursor:pointer; transition:all 0.2s;
}
.rel-tag.syn { background:rgba(0,229,255,0.1); border:1px solid rgba(0,229,255,0.25); color:var(--accent-cyan); }
.rel-tag.ant { background:rgba(255,45,123,0.1); border:1px solid rgba(255,45,123,0.25); color:var(--accent-pink); }
.rel-tag:hover { transform:scale(1.05); }
.wp-actions { display:flex; gap:12px; }
.btn-learn {
  flex:1; padding:10px 0; border:none; border-radius:10px;
  font-size:14px; font-weight:700; cursor:pointer; transition:all 0.3s;
  font-family:'Noto Sans SC',sans-serif;
}
.btn-learn.on { background:linear-gradient(135deg,var(--accent-cyan),#0091ea); color:#000; box-shadow:0 4px 16px rgba(0,229,255,0.3); }
.btn-learn.on:hover { box-shadow:0 4px 24px rgba(0,229,255,0.5); transform:translateY(-1px); }
.btn-learn.off { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); color:var(--text-dim); }
.btn-learn.off:hover { border-color:var(--accent-pink); color:var(--accent-pink); }

/* HUD */
.hud-top {
  position:fixed; top:16px; left:50%; transform:translateX(-50%);
  display:flex; gap:8px; z-index:100;
}
.hud-btn {
  padding:6px 14px; background:var(--bg-panel); border:1px solid var(--border-glow);
  border-radius:8px; color:var(--text-dim); font-size:12px; cursor:pointer;
  transition:all 0.2s; font-family:'Noto Sans SC',sans-serif;
}
.hud-btn.active { border-color:var(--accent-cyan); color:var(--accent-cyan); background:rgba(0,229,255,0.08); }
.hud-btn:hover { border-color:var(--accent-cyan); }

.legend {
  position:fixed; bottom:16px; right:16px; display:flex; gap:14px; z-index:100;
  font-size:11px; color:var(--text-dim);
}
.legend-item { display:flex; align-items:center; gap:5px; }
.legend-dot { width:8px; height:8px; border-radius:50%; }
.legend-dot.d1 { background:rgba(100,120,160,0.4); }
.legend-dot.d2 { background:var(--accent-cyan); box-shadow:0 0 6px var(--accent-cyan); }
.legend-line { width:20px; height:1px; }
.legend-line.l1 { background:rgba(0,229,255,0.5); }
.legend-line.l2 { background:rgba(255,45,123,0.5); }

/* Celebration */
.cele-overlay {
  position:fixed; top:0; left:0; width:100%; height:100%; z-index:500;
  display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,0.7); backdrop-filter:blur(8px);
  opacity:0; pointer-events:none; transition:opacity 0.5s;
}
.cele-overlay.show { opacity:1; pointer-events:all; }
.cele-inner { text-align:center; transform:scale(0.8); transition:transform 0.5s cubic-bezier(0.22,1,0.36,1); }
.cele-overlay.show .cele-inner { transform:scale(1); }
.cele-icon { font-size:72px; margin-bottom:16px; }
.cele-title {
  font-family:'Orbitron',sans-serif; font-size:28px; font-weight:900;
  background:linear-gradient(135deg,var(--accent-gold),var(--accent-pink),var(--accent-cyan));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:8px;
}
.cele-sub { font-size:16px; color:var(--text-dim); margin-bottom:24px; }
.cele-btn {
  padding:12px 32px; background:linear-gradient(135deg,var(--accent-cyan),var(--accent-pink));
  border:none; border-radius:12px; color:#000; font-size:15px; font-weight:700;
  cursor:pointer; font-family:'Noto Sans SC',sans-serif; transition:all 0.3s;
}
.cele-btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,229,255,0.3); }

/* Loading */
.loading-screen {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:var(--bg-deep); z-index:1000;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity 0.8s;
}
.loading-screen.hide { opacity:0; pointer-events:none; }
.ld-title {
  font-family:'Orbitron',sans-serif; font-size:32px; font-weight:900;
  background:linear-gradient(135deg,var(--accent-cyan),var(--accent-pink));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:8px;
}
.ld-sub { font-size:13px; color:var(--text-dim); margin-bottom:24px; }
.ld-bar { width:240px; height:3px; background:rgba(255,255,255,0.06); border-radius:2px; overflow:hidden; }
.ld-fill { width:0%; height:100%; background:linear-gradient(90deg,var(--accent-cyan),var(--accent-pink)); border-radius:2px; transition:width 0.3s; }
.ld-status { margin-top:12px; font-size:11px; color:var(--text-dim); font-family:'Space Mono',monospace; }

/* Toast */
.toast {
  position:fixed; top:60px; left:50%; transform:translateX(-50%) translateY(-80px);
  background:var(--bg-panel); border:1px solid var(--border-glow); border-radius:10px;
  padding:10px 20px; font-size:13px; z-index:300;
  transition:transform 0.4s cubic-bezier(0.22,1,0.36,1);
  backdrop-filter:blur(16px);
}
.toast.show { transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<canvas id="canvas3d"></canvas>

<button class="sidebar-toggle" id="sidebarToggle">☰</button>

<nav class="sidebar" id="sidebar">

    <div class="progress-text"><span>总进度</span><span id="progCount">0 / 0</span></div>

  </div>
  <div class="search-box"><input class="search-input" id="searchInput" placeholder="搜索单词..."></div>
  <div class="chapter-list" id="chList"></div>

<div class="word-panel" id="wordPanel">

    <div><div class="wp-word" id="pWord"></div><div class="wp-phonetic" id="pPhone"></div></div>

  </div>
  <div class="wp-pos" id="pPos"></div>
  <div class="wp-meaning" id="pMeaning"></div>
  <div class="wp-example" id="pExample"></div>
  <div class="wp-relations" id="pRels"></div>
  <div class="wp-actions"><button class="btn-learn" id="btnLearn"></button></div>
</div>

<div class="cele-overlay" id="celeOv">
  <div class="cele-inner">
    <div class="cele-icon">🌟</div>
    <div class="cele-title" id="celeTitle">章节完成！</div>
    <div class="cele-sub" id="celeSub"></div>
    <button class="cele-btn" onclick="document.getElementById('celeOv').classList.remove('show')">继续探索</button>

</div>

<div class="hud-top">

  <button class="hud-btn" data-m="learned" onclick="setMode('learned')">已学</button>
  <button class="hud-btn" onclick="resetView()">🌌 重置视角</button>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot d1"></div>未学习</div>
  <div class="legend-item"><div class="legend-dot d2"></div>已点亮</div>
  <div class="legend-item"><div class="legend-line l1"></div>近义</div>
  <div class="legend-item"><div class="legend-line l2"></div>反义</div>
</div>

<div class="loading-screen" id="loadScreen">
  <div class="ld-title">WORDSTARS</div>
  <div class="ld-sub">正在生成 60,000 颗单词星球...</div>
  <div class="ld-bar"><div class="ld-fill" id="ldFill"></div></div>
  <div class="ld-status" id="ldStatus">初始化...</div>
</div>

<div class="toast" id="toast"></div>

const SUFFIX_MAP = {
  'v.': [

    { s:'ed', p:'v.', d:'{m}(过去式)' },
    { s:'ing', p:'v.', d:'{m}(现在分词)' },
    { s:'er', p:'n.', d:'{m}的人/物' },

    { s:'tion', p:'n.', d:'{m}的过程/行为' },
    { s:'able', p:'adj.', d:'可{m}的' },
    { s:'tion', p:'n.', d:'{m}的行为' },
  ],
  'n.': [
    { s:'al', p:'adj.', d:'{m}的' },
    { s:'ist', p:'n.', d:'{m}专家/从业者' },
    { s:'ism', p:'n.', d:'{m}主义/学说' },
    { s:'ize', p:'v.', d:'使…{m}化' },
    { s:'ic', p:'adj.', d:'{m}的；与{m}有关的' },
    { s:'ous', p:'adj.', d:'充满{m}的' },

    { s:'ful', p:'adj.', d:'充满{m}的' },
  ],
  'adj.': [
    { s:'ly', p:'adv.', d:'{m}地' },
    { s:'ness', p:'n.', d:'{m}的状态/性质' },
    { s:'ity', p:'n.', d:'{m}的性质/状态' },
    { s:'ism', p:'n.', d:'{m}主义' },
    { s:'ist', p:'n.', d:'持{m}观点的人' },
  ]
};

const PREFIXES = [
  { p:'un', d:'不{m}' }, { p:'re', d:'重新{m}' }, { p:'pre', d:'预先{m}' },
  { p:'over', d:'过度{m}' }, { p:'under', d:'不足{m}' }, { p:'mis', d:'错误地{m}' },
  { p:'dis', d:'不{m}' }, { p:'non', d:'非{m}' }, { p:'anti', d:'反{m}' },
  { p:'out', d:'超越{m}' }, { p:'sub', d:'次{m}' }, { p:'super', d:'超{m}' },
  { p:'inter', d:'相互{m}' }, { p:'trans', d:'跨{m}' }, { p:'hyper', d:'过度{m}' },
];

// Generate 60,000+ words
function generateAllWords() {
  const allWords = [];
  const seen = new Set();
  let id = 0;

  for (let ci = 0; ci < CATS.length; ci++) {
    const cat = CATS[ci];
    const chWords = [];

    for (let si = 0; si < cat.seeds.length; si++) {
      const seedArr = Array.isArray(cat.seeds[si]) ? cat.seeds[si] : [cat.seeds[si]];
      const baseDef = Array.isArray(cat.defs[si]) ? cat.defs[si] : [cat.defs[si]];

      for (let wi = 0; wi < seedArr.length; wi++) {
        const w = seedArr[wi];
        const m = baseDef[wi] || baseDef[0];
        if (seen.has(w)) continue;
        seen.add(w);

        const baseWord = { id:id++, word:w, pos:cat.pos, meaning:m, cat:ci, learned:false, relations:[] };
        chWords.push(baseWord);

        // Generate suffix derivatives
        const rules = SUFFIX_MAP[cat.pos] || [];
        for (const rule of rules) {
          let dw;
          if (cat.pos === 'v.' && rule.s === 'ing' && w.endsWith('e')) dw = w.slice(0,-1) + 'ing';
          else if (cat.pos === 'v.' && rule.s === 'ed' && w.endsWith('e')) dw = w + 'd';
          else if (w.endsWith('y') && (rule.s === 'ly' || rule.s === 'ness' || rule.s === 'ist' || rule.s === 'ism')) dw = w.slice(0,-1) + 'i' + rule.s;
          else dw = w + rule.s;

          if (!seen.has(dw)) {
            seen.add(dw);
            const dm = rule.d.replace('{m}', m);
            const rw = { id:id++, word:dw, pos:rule.p, meaning:dm, cat:ci, learned:false, relations:[baseWord.id] };
            baseWord.relations.push(rw.id);
            chWords.push(rw);
          }
        }

        // Generate prefix derivatives
        for (const pf of PREFIXES) {
          const pw = pf.p + w;
          if (!seen.has(pw)) {
            seen.add(pw);
            const pm = pf.d.replace('{m}', m);
            const rw = { id:id++, word:pw, pos:cat.pos, meaning:pm, cat:ci, learned:false, relations:[baseWord.id] };
            baseWord.relations.push(rw.id);
            chWords.push(rw);
          }
        }

        // Synonym connections within same category
        if (si > 0 && chWords.length > 1) {
          const prevBase = chWords.find(cw => cw.word === seedArr[wi > 0 ? wi-1 : 0] || cw.word === (Array.isArray(cat.seeds[si-1]) ? cat.seeds[si-1][0] : cat.seeds[si-1]));
          if (prevBase && prevBase.id !== baseWord.id) {
            baseWord.relations.push(prevBase.id);
            if (!prevBase.relations.includes(baseWord.id)) prevBase.relations.push(baseWord.id);
          }
        }
      }
    }

    allWords.push({ cat:ci, name:cat.name, icon:cat.icon, hue:cat.hue, words:chWords });
  }

  return allWords;
}

//  CREATE BACKGROUND STARS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function createBgStars() {
  const pos = new Float32Array(BG_COUNT * 3);
  const sizes = new Float32Array(BG_COUNT);
  for (let i = 0; i < BG_COUNT; i++) {
    const r = 1500 + Math.random() * 3000;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i*3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);
    sizes[i] = Math.random() * 1.5 + 0.3;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: wordUniforms.uTime, uPixelRatio: wordUniforms.uPixelRatio },
    vertexShader: `
      attribute float size;
      varying float vAlpha;
      uniform float uTime;
      uniform float uPixelRatio;
      void main() {
        vAlpha = 0.3 + 0.7 * fract(sin(dot(position.xy, vec2(12.9898,78.233))) * 43758.5453);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * uPixelRatio * (400.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      varying float vAlpha;
      uniform float uTime;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        if (d > 0.5) discard;
        float glow = 1.0 - smoothstep(0.0, 0.5, d);
        glow = pow(glow, 2.0);
        float twinkle = 0.7 + 0.3 * sin(uTime * 1.5 + gl_PointCoord.x * 50.0);
        gl_FragColor = vec4(0.75, 0.82, 0.95, vAlpha * glow * twinkle * 0.5);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });

  bgPoints = new THREE.Points(geo, mat);
  scene.add(bgPoints);
}

//  CREATE WORD STARS — layout galaxies
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function layoutWordStars() {
  const allWords = getAllWords();
  const totalCount = allWords.length;
  const positions = new Float32Array(totalCount * 3);
  const colors = new Float32Array(totalCount * 3);
  const sizes = new Float32Array(totalCount);
  const catIndices = new Float32Array(totalCount);
  const wordIndices = new Float32Array(totalCount);

  const galaxyRadius = 600;
  const galaxySpread = 180;

  let idx = 0;
  for (let ci = 0; ci < chapters.length; ci++) {
    const ch = chapters[ci];
    const words = ch.words;
    const catColor = new THREE.Color().setHSL(ch.hue / 360, 0.7, 0.6);
    const catAngle = (ci / chapters.length) * Math.PI * 2;
    const cx = Math.cos(catAngle) * galaxyRadius;
    const cz = Math.sin(catAngle) * galaxyRadius;

    // Galaxy center glow
    const armCount = 3 + Math.floor(Math.random() * 2);

    for (let wi = 0; wi < words.length; wi++) {
      const arm = wi % armCount;
      const armAngle = (arm / armCount) * Math.PI * 2;
      const t = wi / words.length;
      const r = t * galaxySpread;
      const spiralAngle = armAngle + t * Math.PI * 4;
      const jitter = (Math.random() - 0.5) * 25;

      const x = cx + Math.cos(spiralAngle) * r + jitter;
      const y = (Math.random() - 0.5) * 40 + Math.sin(t * Math.PI * 6) * 15;
      const z = cz + Math.sin(spiralAngle) * r + jitter;

      positions[idx * 3] = x;
      positions[idx * 3 + 1] = y;
      positions[idx * 3 + 2] = z;

      // Color variation
      const hueVar = (ch.hue + (Math.random() - 0.5) * 20) / 360;
      const col = new THREE.Color().setHSL(hueVar, 0.6 + Math.random() * 0.3, 0.4 + Math.random() * 0.3);
      colors[idx * 3] = col.r;
      colors[idx * 3 + 1] = col.g;
      colors[idx * 3 + 2] = col.b;

      // Size based on word importance (base words bigger)
      const isBase = words[wi].relations.length > 0 || wi < chapters[ci].seeds.length;
      sizes[idx] = isBase ? 3.0 + Math.random() * 2.0 : 1.5 + Math.random() * 1.5;

      catIndices[idx] = ci;
      wordIndices[idx] = words[wi].id;

      starPositions[words[wi].id] = { x, y, z };
      wordMap.set(words[wi].id, words[wi]);

      idx++;
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.setAttribute('aSize', new THREE.Float32BufferAttribute(sizes, 1));
  geo.setAttribute('aCatIndex', new THREE.Float32BufferAttribute(catIndices, 1));
  geo.setAttribute('aWordIndex', new THREE.Float32BufferAttribute(wordIndices, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      ...wordUniforms,
      uLearnedTex: { value: createLearnedTexture() },
    },
    vertexShader: `
      attribute float aSize;
      attribute float aCatIndex;
      attribute float aWordIndex;
      attribute vec3 color;
      varying vec3 vColor;
      varying float vWordIndex;
      varying float vAlpha;
      uniform float uTime;
      uniform float uPixelRatio;
      uniform float uHovered;
      uniform float uSelected;

      void main() {
        vColor = color;
        vWordIndex = aWordIndex;

        float isSelected = step(0.5, abs(aWordIndex - uSelected));
        float isHovered = step(0.5, abs(aWordIndex - uHovered));

        float pulse = 1.0 + 0.15 * sin(uTime * 2.0 + aCatIndex * 0.5 + aWordIndex * 0.01);
        float sizeMultiplier = 1.0;
        sizeMultiplier += (1.0 - isSelected) * 0.0; // selected stays
        sizeMultiplier += isHovered * 0.8;
        sizeMultiplier *= pulse;

        vAlpha = 0.6 + 0.4 * pulse;

        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * sizeMultiplier * uPixelRatio * (300.0 / -mv.z);
        gl_PointSize = clamp(gl_PointSize, 1.0, 80.0);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vWordIndex;
      varying float vAlpha;
      uniform float uTime;
      uniform float uSelected;

      void main() {
        float d = length(gl_PointCoord - 0.5);
        if (d > 0.5) discard;

        // Core glow
        float core = 1.0 - smoothstep(0.0, 0.15, d);
        float midGlow = 1.0 - smoothstep(0.0, 0.35, d);
        float outerGlow = 1.0 - smoothstep(0.0, 0.5, d);

        float brightness = core * 1.0 + midGlow * 0.5 + outerGlow * 0.15;

        // Selected highlight
        float isSelected = 1.0 - step(0.5, abs(vWordIndex - uSelected));
        brightness += isSelected * 0.5;

        // Color: white core, colored outer
        vec3 coreColor = vec3(1.0);
        vec3 finalColor = mix(vColor, coreColor, core * 0.7);
        finalColor += isSelected * vec3(0.0, 0.9, 1.0) * 0.3;

        float alpha = brightness * vAlpha;
        alpha = clamp(alpha, 0.0, 1.0);

        gl_FragColor = vec4(finalColor, alpha);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });

  wordPoints = new THREE.Points(geo, mat);
  scene.add(wordPoints);

  // Create connection lines
  createConnectionLines();
}

function createLearnedTexture() {
  // Just return a dummy; actual learned state is checked via JS
  return null;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  CONNECTION LINES
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function createConnectionLines() {
  const linePos = new Float32Array(MAX_LINES * 6);
  const lineCol = new Float32Array(MAX_LINES * 6);
  connectionGeo = new THREE.BufferGeometry();
  connectionGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePos, 3));
  connectionGeo.setAttribute('color', new THREE.Float32BufferAttribute(lineCol, 3));
  connectionGeo.setDrawRange(0, 0);

  connectionMat = new THREE.LineBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity: 0.6,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });

  connectionObj = new THREE.LineSegments(connectionGeo, connectionMat);
  scene.add(connectionObj);
}

function updateConnections(wordId) {
  const word = wordMap.get(wordId);
  if (!word) { connectionGeo.setDrawRange(0, 0); return; }

  const pos = connectionGeo.attributes.position.array;
  const col = connectionGeo.attributes.color.array;
  let lineIdx = 0;

  const mainPos = starPositions[wordId];
  if (!mainPos) { connectionGeo.setDrawRange(0, 0); return; }

  const rels = word.relations || [];
  for (let i = 0; i < rels.length && lineIdx < MAX_LINES; i++) {
    const relPos = starPositions[rels[i]];
    if (!relPos) continue;

    const relWord = wordMap.get(rels[i]);
    const isAntonym = relWord && relWord.meaning && word.meaning &&
      (word.meaning.includes('不') && !relWord.meaning.includes('不') ||
       !word.meaning.includes('不') && relWord.meaning.includes('不'));

    const c = isAntonym ? new THREE.Color(1, 0.17, 0.48) : new THREE.Color(0, 0.9, 1);

    pos[lineIdx * 6] = mainPos.x;
    pos[lineIdx * 6 + 1] = mainPos.y;
    pos[lineIdx * 6 + 2] = mainPos.z;
    pos[lineIdx * 6 + 3] = relPos.x;
    pos[lineIdx * 6 + 4] = relPos.y;
    pos[lineIdx * 6 + 5] = relPos.z;

    col[lineIdx * 6] = c.r; col[lineIdx * 6 + 1] = c.g; col[lineIdx * 6 + 2] = c.b;
    col[lineIdx * 6 + 3] = c.r; col[lineIdx * 6 + 4] = c.g; col[lineIdx * 6 + 5] = c.b;

    lineIdx++;
  }

  connectionGeo.attributes.position.needsUpdate = true;
  connectionGeo.attributes.color.needsUpdate = true;
  connectionGeo.setDrawRange(0, lineIdx * 2);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  CAMERA FLY-TO
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function flyTo(targetX, targetY, targetZ, duration = 2000) {
  if (isFlying) return;
  isFlying = true;
  flyStart = performance.now();
  flyDuration = duration;
  flyProgress = 0;
  flyCamStart = camera.position.clone();
  flyEnd = new THREE.Vector3(targetX + 30, targetY + 20, targetZ + 50);
  controls.target.set(targetX, targetY, targetZ);
}

function updateFly() {
  if (!isFlying) return;
  const now = performance.now();
  flyProgress = Math.min((now - flyStart) / flyDuration, 1);
  const t = easeInOutCubic(flyProgress);

  camera.position.lerpVectors(flyCamStart, flyEnd, t);
  controls.update();

  if (flyProgress >= 1) isFlying = false;
}

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  INTERACTION
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function onPointerMove(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
}

function checkHover() {
  if (!wordPoints) return;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(wordPoints);
  if (intersects.length > 0) {
    const idx = intersects[0].index;
    const wIdx = wordPoints.geometry.attributes.aWordIndex.array[idx];
    if (hoveredStar !== wIdx) {
      hoveredStar = wIdx;
      wordUniforms.uHovered.value = wIdx;
      document.body.style.cursor = 'pointer';
    }
  } else {
    if (hoveredStar !== null) {
      hoveredStar = null;
      wordUniforms.uHovered.value = -1;
      document.body.style.cursor = 'default';
    }
  }
}

function onClick(e) {
  if (!wordPoints) return;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(wordPoints);
  if (intersects.length > 0) {
    const idx = intersects[0].index;
    const wIdx = wordPoints.geometry.attributes.aWordIndex.array[idx];
    const word = wordMap.get(wIdx);
    if (word) {
      selectWord(word, idx);
    }
  }
}

function selectWord(word, starIdx) {
  activeWord = word;
  selectedStarIndex = starIdx;
  wordUniforms.uSelected.value = word.id;

  // Fly to star
  const pos = starPositions[word.id];
  if (pos) flyTo(pos.x, pos.y, pos.z);

  // Update connections
  updateConnections(word.id);

  // Show panel
  showWordPanel(word);

  // Update sidebar to show correct chapter
  if (word.cat !== activeChapter) {
    activeChapter = word.cat;
    renderSidebar();
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  UI — SIDEBAR
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderSidebar() {
  const list = document.getElementById('chList');
  list.innerHTML = '';

  for (let ci = 0; ci < chapters.length; ci++) {
    const ch = chapters[ci];
    const total = ch.words.length;
    const done = ch.words.filter(w => learned.has(w.id)).length;
    const pct = total ? Math.round(done / total * 100) : 0;
    const complete = done === total && total > 0;

    const el = document.createElement('div');
    el.className = `ch-item ${ci === activeChapter ? 'active' : ''} ${complete ? 'done' : ''}`;
    el.innerHTML = `
      <div class="ch-name"><span>${complete ? '⭐' : ch.icon}</span>${ch.name}</div>
      <div class="ch-meta"><span class="n">${done.toLocaleString()} / ${total.toLocaleString()}</span><span>${pct}%</span></div>
      <div class="ch-bar"><div class="ch-bar-fill" style="width:${pct}%"></div></div>
    `;
    el.addEventListener('click', () => switchChapter(ci));
    list.appendChild(el);
  }

  updateProgress();
}

function switchChapter(ci) {
  activeChapter = ci;
  renderSidebar();

  // Fly to galaxy center
  const galaxyAngle = (ci / chapters.length) * Math.PI * 2;
  const galaxyRadius = 600;
  const cx = Math.cos(galaxyAngle) * galaxyRadius;
  const cz = Math.sin(galaxyAngle) * galaxyRadius;
  flyTo(cx, 0, cz, 1500);
}

function updateProgress() {
  const allWords = getAllWords();
  const total = allWords.length;
  const done = allWords.filter(w => learned.has(w.id)).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progCount').textContent = `${done.toLocaleString()} / ${total.toLocaleString()}`;
  document.getElementById('progBar').style.width = `${pct}%`;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  UI — WORD PANEL
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function showWordPanel(word) {
  document.getElementById('pWord').textContent = word.word;
  document.getElementById('pPhone').textContent = '';
  document.getElementById('pPos').textContent = word.pos;
  document.getElementById('pMeaning').textContent = word.meaning;
  document.getElementById('pExample').innerHTML = '';

  // Relations
  const rels = document.getElementById('pRels');
  rels.innerHTML = '';
  const relIds = word.relations || [];
  for (const rid of relIds.slice(0, 8)) {
    const rw = wordMap.get(rid);
    if (!rw) continue;
    const tag = document.createElement('span');
    const isAnt = (word.meaning.includes('不') && !rw.meaning.includes('不')) ||
                  (!word.meaning.includes('不') && rw.meaning.includes('不'));
    tag.className = `rel-tag ${isAnt ? 'ant' : 'syn'}`;
    tag.textContent = `${isAnt ? '≠ 反义' : '≈ 近义'} ${rw.word}`;
    tag.addEventListener('click', () => selectWord(rw, -1));
    rels.appendChild(tag);
  }

  const btn = document.getElementById('btnLearn');
  if (learned.has(word.id)) {
    btn.textContent = '取消点亮 ✦';
    btn.className = 'btn-learn off';
  } else {
    btn.textContent = '点亮这个星球 ✦';
    btn.className = 'btn-learn on';
  }

  document.getElementById('wordPanel').classList.add('show');
}

function hideWordPanel() {
  document.getElementById('wordPanel').classList.remove('show');
  activeWord = null;
  wordUniforms.uSelected.value = -1;
  connectionGeo.setDrawRange(0, 0);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  UI — SEARCH
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function setupSearch() {
  const input = document.getElementById('searchInput');
  let timeout;
  input.addEventListener('input', () => {
    clearTimeout(timeout);
    timeout = setTimeout(() => {
      const q = input.value.trim().toLowerCase();
      if (!q) return;
      const allWords = getAllWords();
      const match = allWords.find(w => w.word.toLowerCase().startsWith(q));
      if (match) selectWord(match, -1);
    }, 300);
  });
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  UI — VIEW MODE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
window.setMode = function(mode) {
  viewMode = mode;
  document.querySelectorAll('.hud-btn[data-m]').forEach(b => {
    b.classList.toggle('active', b.dataset.m === mode);
  });
  // Update star visibility
  if (!wordPoints) return;
  const sizes = wordPoints.geometry.attributes.aSize;
  const words = getAllWords();
  for (let i = 0; i < words.length; i++) {
    const isL = learned.has(words[i].id);
    if (mode === 'all') sizes.array[i] = words[i].relations.length > 2 ? 3.0 : 1.5;
    else if (mode === 'learned') sizes.array[i] = isL ? 4.0 : 0.2;
    else sizes.array[i] = isL ? 0.2 : 3.0;
  }
  sizes.needsUpdate = true;
};

window.resetView = function() {
  flyTo(0, 200, 500, 1500);
};

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  SIDEBAR TOGGLE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function setupSidebarToggle() {
  const toggle = document.getElementById('sidebarToggle');
  const sidebar = document.getElementById('sidebar');
  let collapsed = false;
  toggle.addEventListener('click', () => {
    collapsed = !collapsed;
    sidebar.classList.toggle('collapsed', collapsed);
    toggle.classList.toggle('shifted', collapsed);
  });
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  LEARN BUTTON
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function setupLearnBtn() {
  document.getElementById('btnLearn').addEventListener('click', () => {
    if (!activeWord) return;
    toggleLearn(activeWord.id);
    showWordPanel(activeWord);
    renderSidebar();

    // Check chapter completion
    if (learned.has(activeWord.id)) {
      const ch = chapters[activeWord.cat];
      const allDone = ch.words.every(w => learned.has(w.id));
      if (allDone) {
        document.getElementById('celeTitle').textContent = `${ch.icon} ${ch.name} 完成！`;
        document.getElementById('celeSub').textContent = `你已点亮本章全部 ${ch.words.length.toLocaleString()} 个星球 🌟`;
        document.getElementById('celeOv').classList.add('show');
      }
      showToast(`✦ 已点亮: ${activeWord.word}`);
    }
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  ANIMATION LOOP
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  wordUniforms.uTime.value += dt;

  controls.update();
  updateFly();
  checkHover();

  // Slow auto-rotate when idle
  if (!isFlying && !activeWord) {
    scene.rotation.y += 0.0001;
  }

  composer.render();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  INIT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function init() {
  const ldFill = document.getElementById('ldFill');
  const ldStatus = document.getElementById('ldStatus');

  ldStatus.textContent = '加载进度...';
  ldFill.style.width = '10%';
  loadProgress();
  await sleep(100);

  ldStatus.textContent = '初始化 3D 引擎...';
  ldFill.style.width = '20%';
  initThree();
  await sleep(100);

  ldStatus.textContent = '生成 60,000 个单词...';
  ldFill.style.width = '35%';
  await sleep(50);
  chapters = generateAllWords();

  const totalCount = getAllWords.length > 0 ? getAllWords().length : chapters.reduce((s,c) => s + c.words.length, 0);
  ldStatus.textContent = `已生成 ${totalCount.toLocaleString()} 个单词`;
  ldFill.style.width = '55%';
  await sleep(200);

  ldStatus.textContent = '绘制星空...';
  ldFill.style.width = '70%';
  createBgStars();
  await sleep(100);

  ldStatus.textContent = '排列星球位置...';
  ldFill.style.width = '85%';
  layoutWordStars();
  await sleep(100);

  ldStatus.textContent = '初始化界面...';
  ldFill.style.width = '95%';
  renderSidebar();
  setupSearch();
  setupSidebarToggle();
  setupLearnBtn();

  document.getElementById('pClose').addEventListener('click', hideWordPanel);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hideWordPanel(); });
  renderer.domElement.addEventListener('pointermove', onPointerMove);
  renderer.domElement.addEventListener('click', onClick);

  await sleep(200);
  ldFill.style.width = '100%';
  await sleep(300);

  document.getElementById('loadScreen').classList.add('hide');
  animate();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

init();
</script>
