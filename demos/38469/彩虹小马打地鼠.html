<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>彩虹小马打地鼠</title>
  <style>
    :root {
      --ink: #263047;
      --paper: #fff9fb;
      --rose: #ff6fae;
      --mint: #66d7bd;
      --sky: #5db7ff;
      --sun: #ffd166;
      --violet: #9b7bff;
      --shadow: rgba(38, 48, 71, .18);
      --panel: rgba(255, 255, 255, .78);
      font-family: "Trebuchet MS", "Microsoft YaHei", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 255, 255, .95) 0 32px, transparent 33px),
        radial-gradient(circle at 22% 15%, rgba(255, 255, 255, .9) 0 21px, transparent 22px),
        radial-gradient(circle at 84% 20%, rgba(255, 255, 255, .9) 0 28px, transparent 29px),
        linear-gradient(180deg, #9ee2ff 0%, #e7f8ff 46%, #fff3c0 47%, #9ce7b2 100%);
    }

    button {
      font: inherit;
    }

    .game-shell {
      width: min(1120px, calc(100vw - 28px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      padding: 18px 0 22px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 16px;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.7rem);
      line-height: .95;
      letter-spacing: 0;
      text-shadow: 0 4px 0 rgba(255, 255, 255, .75), 0 8px 20px rgba(69, 106, 152, .2);
    }

    .title p {
      margin: 8px 0 0;
      max-width: 620px;
      font-size: clamp(.95rem, 1.8vw, 1.12rem);
      color: #47526b;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      min-width: 48px;
      height: 46px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: #263047;
      box-shadow: 0 7px 0 rgba(38, 48, 71, .18), 0 12px 26px rgba(38, 48, 71, .12);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 15px;
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 rgba(38, 48, 71, .18), 0 8px 20px rgba(38, 48, 71, .1);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--rose), #ff9f6e);
    }

    .btn.secondary {
      background: linear-gradient(135deg, var(--sky), var(--violet));
    }

    .icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
      flex: 0 0 auto;
    }

    main {
      display: grid;
      grid-template-columns: minmax(250px, 310px) minmax(320px, 1fr);
      gap: 18px;
      align-items: stretch;
      min-height: 0;
    }

    .side {
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .scoreboard,
    .legend {
      border: 2px solid rgba(255, 255, 255, .9);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 16px 40px var(--shadow);
      backdrop-filter: blur(12px);
      padding: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      min-height: 86px;
      border-radius: 8px;
      padding: 10px;
      background: rgba(255, 255, 255, .72);
      border: 1px solid rgba(38, 48, 71, .08);
    }

    .stat span {
      display: block;
      font-size: .84rem;
      color: #69748e;
    }

    .stat strong {
      display: block;
      margin-top: 5px;
      font-size: clamp(1.6rem, 3.5vw, 2.5rem);
      line-height: 1;
    }

    .timer-wrap {
      margin-top: 12px;
    }

    .timer-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: .9rem;
      margin-bottom: 7px;
      color: #5c667f;
    }

    .timer {
      height: 16px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(38, 48, 71, .12);
      box-shadow: inset 0 2px 4px rgba(38, 48, 71, .16);
    }

    .timer > div {
      height: 100%;
      width: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff5468, #ffca3a, #55d66b, #3bb8ff, #9b5cff);
      transition: width .1s linear;
    }

    .legend h2 {
      margin: 0 0 10px;
      font-size: 1.05rem;
    }

    .legend-row {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 8px 0;
      border-top: 1px dashed rgba(38, 48, 71, .15);
      font-size: .95rem;
    }

    .legend-row:first-of-type {
      border-top: 0;
    }

    .mini-pony,
    .mini-bomb,
    .mini-star {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 900;
    }

    .mini-pony {
      background: #fff;
      border: 3px solid var(--rose);
      color: var(--rose);
    }

    .mini-bomb {
      background: #263047;
      color: #fff;
    }

    .mini-star {
      background: var(--sun);
      color: #7d5200;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 56%, 79% 91%, 50% 70%, 21% 91%, 32% 56%, 2% 35%, 39% 35%);
    }

    .board-wrap {
      position: relative;
      min-height: 520px;
      border-radius: 8px;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, .45) 1px, transparent 1px),
        linear-gradient(180deg, rgba(255, 255, 255, .42) 1px, transparent 1px),
        linear-gradient(180deg, rgba(255, 255, 255, .58), rgba(255, 255, 255, .28));
      background-size: 44px 44px, 44px 44px, auto;
      border: 2px solid rgba(255, 255, 255, .82);
      box-shadow: 0 18px 46px rgba(38, 48, 71, .18);
      overflow: hidden;
    }

    .rainbow {
      position: absolute;
      right: -110px;
      top: -54px;
      width: 380px;
      height: 190px;
      border-radius: 380px 380px 0 0;
      background: repeating-radial-gradient(ellipse at 50% 100%, transparent 0 45px, #ff637d 46px 62px, #ffc857 63px 80px, #5dd97d 81px 98px, #57bdff 99px 116px, #8d73ff 117px 134px, transparent 135px 160px);
      opacity: .76;
      pointer-events: none;
    }

    .board {
      position: relative;
      z-index: 1;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(92px, 1fr));
      grid-template-rows: repeat(3, minmax(116px, 1fr));
      gap: clamp(10px, 2.5vw, 22px);
      padding: clamp(16px, 3vw, 30px);
      user-select: none;
    }

    .hole {
      position: relative;
      min-height: 116px;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      isolation: isolate;
    }

    .hole:focus-visible {
      outline: 4px solid rgba(255, 111, 174, .6);
      outline-offset: 4px;
      border-radius: 12px;
    }

    .dirt {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: min(86%, 190px);
      height: 36%;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .18), transparent 25%),
        linear-gradient(180deg, #785336, #4b2f20);
      box-shadow: inset 0 -9px 15px rgba(0, 0, 0, .22), 0 10px 17px rgba(38, 48, 71, .16);
      z-index: 3;
    }

    .pony,
    .hazard,
    .bonus {
      position: absolute;
      left: 50%;
      bottom: 18%;
      width: min(76%, 150px);
      aspect-ratio: 1;
      /* 初始状态：缩小且在洞底下，透明不可见 */
      transform: translate(-50%, 64%) scale(.72);
      opacity: 0;
      pointer-events: none;
      /* 下沉动画：平滑消失 */
      transition: transform .25s ease-in, opacity .2s ease-in;
      z-index: 2;
    }

    /* 【核心修复】：精准匹配被激活的类型，避免三个元素叠加在一起导致渲染闪烁 */
    .hole.up.type-pony .pony,
    .hole.up.type-hazard .hazard,
    .hole.up.type-bonus .bonus {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
      /* 弹出动画：果冻回弹，绝对清晰 */
      transition: transform .4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity .1s ease-out;
    }

    /* 挨打状态下的精准匹配 */
    .hole.hit.type-pony .pony,
    .hole.hit.type-hazard .hazard,
    .hole.hit.type-bonus .bonus {
      transform: translate(-50%, 5%) scale(.88) rotate(-8deg);
      filter: saturate(1.22);
      transition: transform .1s, filter .1s;
    }

    .pony-face {
      position: absolute;
      inset: 17% 15% 10%;
      border-radius: 49% 51% 45% 45%;
      background: var(--body, #ffd0e7);
      border: 3px solid rgba(38, 48, 71, .13);
      box-shadow: inset 10px -12px 0 rgba(255, 255, 255, .24);
    }

    .ear {
      position: absolute;
      top: 5%;
      width: 25%;
      height: 32%;
      background: var(--body, #ffd0e7);
      border: 3px solid rgba(38, 48, 71, .13);
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      z-index: -1;
    }

    .ear.left {
      left: 18%;
      transform: rotate(-17deg);
    }

    .ear.right {
      right: 18%;
      transform: rotate(17deg);
    }

    .mane {
      position: absolute;
      top: 5%;
      left: 19%;
      width: 60%;
      height: 32%;
      border-radius: 45% 55% 52% 40%;
      background: linear-gradient(90deg, var(--mane-a), var(--mane-b), var(--mane-c));
      transform: rotate(-8deg);
      box-shadow: 0 4px 0 rgba(255, 255, 255, .25);
    }

    .eye {
      position: absolute;
      top: 43%;
      width: 15%;
      height: 23%;
      border-radius: 50%;
      background: #242a3b;
      box-shadow: inset 3px 0 0 rgba(255, 255, 255, .4);
    }

    .eye.left {
      left: 32%;
    }

    .eye.right {
      right: 28%;
    }

    .smile {
      position: absolute;
      left: 43%;
      bottom: 25%;
      width: 22%;
      height: 12%;
      border-bottom: 3px solid rgba(38, 48, 71, .55);
      border-radius: 0 0 999px 999px;
    }

    .sparkle {
      position: absolute;
      left: 8%;
      top: 20%;
      width: 18%;
      height: 18%;
      background: #fff;
      clip-path: polygon(50% 0, 64% 36%, 100% 50%, 64% 64%, 50% 100%, 36% 64%, 0 50%, 36% 36%);
    }

    .hazard {
      width: min(62%, 116px);
    }

    .bomb-ball {
      position: absolute;
      inset: 22% 12% 8%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #57617d, #1d2436 60%);
      box-shadow: inset -10px -12px 0 rgba(0, 0, 0, .2);
    }

    .fuse {
      position: absolute;
      left: 58%;
      top: 8%;
      width: 34%;
      height: 30%;
      border-top: 7px solid #403329;
      border-radius: 50%;
      transform: rotate(25deg);
    }

    .flame {
      position: absolute;
      right: 8%;
      top: 2%;
      width: 24%;
      height: 24%;
      border-radius: 50% 50% 50% 0;
      background: linear-gradient(135deg, #fff07b, #ff5b45);
      transform: rotate(38deg);
    }

    .bonus {
      width: min(58%, 108px);
    }

    .bonus-star {
      position: absolute;
      inset: 8%;
      background: linear-gradient(135deg, #fff7a8, #ffd166 55%, #ff9d42);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 56%, 79% 91%, 50% 70%, 21% 91%, 32% 56%, 2% 35%, 39% 35%);
      filter: drop-shadow(0 8px 0 rgba(127, 80, 0, .18));
    }

    .float-score {
      position: absolute;
      left: 50%;
      top: 24%;
      transform: translate(-50%, 0);
      font-size: 1.5rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 2px 0 rgba(38, 48, 71, .35);
      pointer-events: none;
      animation: popScore .62s ease-out forwards;
      z-index: 6;
    }

    @keyframes popScore {
      from {
        opacity: 0;
        transform: translate(-50%, 12px) scale(.7);
      }
      25% {
        opacity: 1;
      }
      to {
        opacity: 0;
        transform: translate(-50%, -34px) scale(1.12);
      }
    }

    .message {
      position: absolute;
      z-index: 8;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(255, 249, 251, .5);
      backdrop-filter: blur(5px);
    }

    .message[hidden] {
      display: none;
    }

    .message-box {
      width: min(440px, 100%);
      border-radius: 8px;
      padding: 18px;
      background: #fff;
      border: 2px solid rgba(38, 48, 71, .12);
      box-shadow: 0 18px 50px rgba(38, 48, 71, .22);
      text-align: center;
    }

    .message-box h2 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .message-box p {
      margin: 0 0 16px;
      color: #5d6880;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: #566078;
      font-size: .88rem;
    }

    .kbd {
      display: inline-grid;
      place-items: center;
      min-width: 25px;
      height: 24px;
      padding: 0 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, .8);
      border: 1px solid rgba(38, 48, 71, .16);
      box-shadow: 0 2px 0 rgba(38, 48, 71, .12);
      color: #333d54;
      font-weight: 700;
    }

    @media (max-width: 820px) {
      header {
        grid-template-columns: 1fr;
        align-items: start;
      }
      .controls { justify-content: flex-start; }
      main { grid-template-columns: 1fr; }
      .side { grid-template-columns: 1fr; }
      .board-wrap { min-height: 510px; }
    }

    @media (max-width: 560px) {
      .game-shell { width: min(100% - 18px, 1120px); padding-top: 10px; }
      .title h1 { font-size: 2.25rem; }
      .controls { display: grid; grid-template-columns: 1fr 1fr; }
      .btn { width: 100%; padding: 0 10px; }
      .stats { grid-template-columns: repeat(4, 1fr); }
      .stat { min-height: 74px; padding: 8px 6px; }
      .stat span { font-size: .72rem; }
      .stat strong { font-size: 1.45rem; }
      .legend { display: none; }
      .board-wrap { min-height: 430px; }
      .board {
        grid-template-columns: repeat(3, minmax(74px, 1fr));
        grid-template-rows: repeat(3, minmax(98px, 1fr));
        gap: 8px;
        padding: 12px;
      }
      .hole { min-height: 98px; }
      footer { font-size: .78rem; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <header>
      <div class="title">
        <h1>彩虹小马打地鼠</h1>
        <p>点中探头的小马得分，抓住星星加时，避开黑色魔法球。越到后面，小马越调皮。</p>
      </div>
      <div class="controls" aria-label="游戏控制">
        <select id="speedSelect" class="btn" style="background: #fff; color: #263047; font-weight: bold; padding: 0 10px; cursor: pointer;">
          <option value="5.0">🛑 静止模式 (停留长达7秒，绝对跑不了)</option>
          <option value="2.5">🐢 慢速模式 (适合小朋友)</option>
          <option value="1.5">🚶 简单模式</option>
          <option value="1.0" selected>🏃 正常速度</option>
        </select>
        <button class="btn primary" id="startBtn" type="button" title="开始或重新开始">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg> 开始
        </button>
        <button class="btn secondary" id="pauseBtn" type="button" title="暂停或继续">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg> 暂停
        </button>
      </div>
    </header>

    <main>
      <aside class="side">
        <section class="scoreboard" aria-label="分数面板">
          <div class="stats">
            <div class="stat"><span>分数</span><strong id="score">0</strong></div>
            <div class="stat"><span>最高</span><strong id="best">0</strong></div>
            <div class="stat"><span>连击</span><strong id="combo">0</strong></div>
            <div class="stat"><span>等级</span><strong id="level">1</strong></div>
          </div>
          <div class="timer-wrap">
            <div class="timer-label"><span>彩虹时间</span><strong id="timeText">45.0s</strong></div>
            <div class="timer" aria-hidden="true"><div id="timerBar"></div></div>
          </div>
        </section>

        <section class="legend" aria-label="得分说明">
          <h2>目标</h2>
          <div class="legend-row"><span class="mini-pony">+1</span><span>小马探头</span><strong>+10</strong></div>
          <div class="legend-row"><span class="mini-star"></span><span>彩虹星星</span><strong>+5s</strong></div>
          <div class="legend-row"><span class="mini-bomb">!</span><span>黑色魔法球</span><strong>-15</strong></div>
        </section>
      </aside>

      <section class="board-wrap" aria-label="游戏区域">
        <div class="rainbow" aria-hidden="true"></div>
        <div class="board" id="board"></div>
        <div class="message" id="message">
          <div class="message-box">
            <h2 id="messageTitle">准备好了吗？</h2>
            <p id="messageBody">按开始，让彩虹小马们从洞口里跳出来。</p>
            <button class="btn primary" id="messageBtn" type="button">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg> 开始游戏
            </button>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <span><span class="kbd">Space</span> 暂停/继续</span>
      <span><span class="kbd">1</span>-<span class="kbd">9</span> 敲对应洞口</span>
      <span>本地静态小游戏，无需联网。</span>
    </footer>
  </div>

  <script>
    const board = document.querySelector("#board");
    const speedSelect = document.querySelector("#speedSelect");
    const startBtn = document.querySelector("#startBtn");
    const pauseBtn = document.querySelector("#pauseBtn");
    const message = document.querySelector("#message");
    const messageTitle = document.querySelector("#messageTitle");
    const messageBody = document.querySelector("#messageBody");
    const messageBtn = document.querySelector("#messageBtn");
    const scoreEl = document.querySelector("#score");
    const bestEl = document.querySelector("#best");
    const comboEl = document.querySelector("#combo");
    const levelEl = document.querySelector("#level");
    const timeText = document.querySelector("#timeText");
    const timerBar = document.querySelector("#timerBar");

    const ponies = [
      ["#ffd1ec", "#ff5aa5", "#ffd166", "#78d8ff"],
      ["#d8c8ff", "#4f8bff", "#9b7bff", "#ff7bc8"],
      ["#fff3a8", "#ff8e4d", "#ffca3a", "#f55d7a"],
      ["#bdf3ff", "#2fb6ff", "#55d66b", "#ffdf62"],
      ["#f0dcff", "#7b55ff", "#b45dff", "#54d3ff"]
    ];

    // 初始化洞口结构
    const holes = Array.from({ length: 9 }, (_, index) => {
      const hole = document.createElement("button");
      hole.className = "hole"; // 干净的初始类名
      hole.type = "button";
      hole.dataset.index = String(index);
      hole.innerHTML = `
        <div class="pony" aria-hidden="true">
          <div class="ear left"></div><div class="ear right"></div>
          <div class="pony-face">
            <div class="mane"></div>
            <div class="sparkle"></div>
            <div class="eye left"></div><div class="eye right"></div>
            <div class="smile"></div>
          </div>
        </div>
        <div class="hazard" aria-hidden="true">
          <div class="fuse"></div><div class="flame"></div><div class="bomb-ball"></div>
        </div>
        <div class="bonus" aria-hidden="true"><div class="bonus-star"></div></div>
        <div class="dirt" aria-hidden="true"></div>
      `;
      board.appendChild(hole);
      return hole;
    });

    // 纯洁的游戏状态
    let state = {
      score: 0,
      combo: 0,
      level: 1,
      timeLeft: 45,
      totalTime: 45,
      best: Number(localStorage.getItem("ponyWhackBest") || 0)
    };

    let isPlaying = false;
    let isPaused = false;
    
    // 我们把全局倒计时和地鼠的动画彻底解耦，使用最直接的定时器
    let gameClockTimer = null; 
    let moleActionTimer = null; // 这个定时器唯一负责控制地鼠的起落

    bestEl.textContent = state.best;
    updateHud();

    // ---- 核心循环逻辑（已彻底重写） ----

    // 动作 1：让某一只地鼠探出头
    function popUpMole() {
      if (!isPlaying || isPaused) return;

      // 第一步：清空全盘，绝对保证上一只已经干干净净地消失了
      holes.forEach(h => h.className = "hole");

      // 第二步：随机选个洞
      const hole = holes[Math.floor(Math.random() * holes.length)];

      // 第三步：决定出现什么
      const r = Math.random();
      const type = r > 0.88 ? "bonus" : r > 0.75 ? "hazard" : "pony";
      hole.dataset.type = type;

      // 如果是小马，随机换个配色
      if (type === "pony") {
        const palette = ponies[Math.floor(Math.random() * ponies.length)];
        hole.style.setProperty("--body", palette[0]);
        hole.style.setProperty("--mane-a", palette[1]);
        hole.style.setProperty("--mane-b", palette[2]);
        hole.style.setProperty("--mane-c", palette[3]);
      }

      // 第四步：执行弹出！通过添加 type-xxx 类名，防止 CSS 渲染重叠
      hole.classList.add("up", "type-" + type);

      // 第五步：计算它【必须停留】多长时间
      const speedMultiplier = parseFloat(speedSelect.value) || 1.0;
      // 基础停留：至少 1500毫秒 (1.5秒)，随着等级降低，但不会低于 1000毫秒
      const baseStayMs = Math.max(1000, 2000 - (state.level * 100)); 
      const stayMs = baseStayMs * speedMultiplier;

      // 设定时间到了就自动缩回去
      moleActionTimer = setTimeout(() => {
        goDownMole(hole);
      }, stayMs);
    }

    // 动作 2：让地鼠缩回去，并留出空档时间
    function goDownMole(hole) {
      if (!isPlaying || isPaused) return;

      // 拿掉 up 类名，触发 CSS 的缩回动画
      hole.className = "hole";

      // 计算全盘空荡荡的间隔时间
      const speedMultiplier = parseFloat(speedSelect.value) || 1.0;
      const baseGapMs = Math.max(400, 800 - (state.level * 40));
      const gapMs = baseGapMs * speedMultiplier;

      // 间隔时间到了之后，叫醒下一只
      moleActionTimer = setTimeout(popUpMole, gapMs);
    }

    // 动作 3：玩家成功击中！
    function hitHole(hole) {
      // 如果没开始、暂停中、或者洞里没东西、或者已经被打过，一律无效
      if (!isPlaying || isPaused || !hole.classList.contains("up") || hole.classList.contains("hit")) return;

      // 【关键】：立刻掐断“让它自然缩回去”的定时器，它现在被你打住了！
      clearTimeout(moleActionTimer);

      const type = hole.dataset.type;
      hole.classList.add("hit"); // 触发被打的视觉效果

      // 计算分数
      if (type === "pony") {
        state.combo += 1;
        const gained = 10 + Math.min(30, state.combo * 2);
        state.score += gained;
        floatScore(hole, `+${gained}`);
      } else if (type === "bonus") {
        state.timeLeft = Math.min(60, state.timeLeft + 5);
        state.totalTime = Math.max(state.totalTime, state.timeLeft);
        state.score += 20;
        state.combo += 1;
        floatScore(hole, "+5s");
      } else {
        state.score = Math.max(0, state.score - 15);
        state.combo = 0;
        floatScore(hole, "-15");
      }
      updateHud();

      // 展示 250 毫秒的挨打动画，然后强制缩回，并进入出下一只的间隔期
      setTimeout(() => {
        if (!isPlaying) return;
        hole.className = "hole"; // 缩回
        const speedMultiplier = parseFloat(speedSelect.value) || 1.0;
        const gapMs = Math.max(400, 800 - (state.level * 40)) * speedMultiplier;
        moleActionTimer = setTimeout(popUpMole, gapMs); // 重新接上游戏循环
      }, 250);
    }

    // ---- 基础流程控制 ----

    function startGame() {
      clearTimeout(moleActionTimer);
      clearInterval(gameClockTimer);
      
      state.score = 0;
      state.combo = 0;
      state.level = 1;
      state.timeLeft = 45;
      state.totalTime = 45;
      
      isPlaying = true;
      isPaused = false;
      
      message.hidden = true;
      pauseBtn.innerHTML = `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg> 暂停`;
      
      holes.forEach(h => h.className = "hole");
      updateHud();

      // 开启全局倒计时时钟 (固定 100ms 一跳)
      gameClockTimer = setInterval(tickClock, 100);
      
      // 延迟半秒钟后，跳出第一只！
      moleActionTimer = setTimeout(popUpMole, 500);
    }

    function tickClock() {
      if (!isPlaying || isPaused) return;
      state.timeLeft = Math.max(0, state.timeLeft - 0.1);
      state.level = Math.min(9, 1 + Math.floor((state.totalTime - state.timeLeft) / 7));
      updateHud();
      if (state.timeLeft <= 0) endGame();
    }

    function togglePause() {
      if (!isPlaying) return;
      isPaused = !isPaused;
      
      if (isPaused) {
        // 暂停时，切断所有正在倒数的动作
        clearTimeout(moleActionTimer);
        clearInterval(gameClockTimer);
        
        messageTitle.textContent = "彩虹暂停中";
        messageBody.textContent = "再按一次暂停键继续游戏。";
        messageBtn.textContent = "继续游戏";
        message.hidden = false;
        pauseBtn.innerHTML = `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg> 继续`;
      } else {
        // 恢复时
        message.hidden = true;
        pauseBtn.innerHTML = `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg> 暂停`;
        
        gameClockTimer = setInterval(tickClock, 100);
        // 缓冲 400 毫秒后，重新开始跳地鼠
        moleActionTimer = setTimeout(popUpMole, 400);
      }
    }

    function endGame() {
      isPlaying = false;
      isPaused = false;
      clearTimeout(moleActionTimer);
      clearInterval(gameClockTimer);
      holes.forEach(h => h.className = "hole");
      
      if (state.score > state.best) {
        state.best = state.score;
        localStorage.setItem("ponyWhackBest", String(state.best));
      }
      bestEl.textContent = state.best;
      
      messageTitle.textContent = "彩虹收工！";
      messageBody.textContent = `本轮得分 ${state.score}，最高连击 ${state.combo}。再来一局刷新最高分吧。`;
      messageBtn.innerHTML = `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 7l5 5V9c3.31 0 6 2.69 6 6 0 1.01-.25 1.96-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 15c0-4.42-3.58-8-8-8zm-6 4.74A7.93 7.93 0 0 0 4 15c0 4.42 3.58 8 8 8v3l5-5-5-5v3c-3.31 0-6-2.69-6-6 0-1.01.25-1.96.7-2.8L5.24 8.74z"/></svg> 再玩一次`;
      message.hidden = false;
    }

    function floatScore(hole, text) {
      const pop = document.createElement("div");
      pop.className = "float-score";
      pop.textContent = text;
      hole.appendChild(pop);
      setTimeout(() => pop.remove(), 650);
    }

    function updateHud() {
      scoreEl.textContent = state.score;
      comboEl.textContent = state.combo;
      levelEl.textContent = state.level;
      timeText.textContent = `${state.timeLeft.toFixed(1)}s`;
      const pct = Math.max(0, Math.min(100, (state.timeLeft / state.totalTime) * 100));
      timerBar.style.width = `${pct}%`;
    }

    // 绑定事件
    holes.forEach(hole => hole.addEventListener("click", () => hitHole(hole)));
    startBtn.addEventListener("click", startGame);
    messageBtn.addEventListener("click", () => isPlaying && isPaused ? togglePause() : startGame());
    pauseBtn.addEventListener("click", togglePause);

    window.addEventListener("keydown", event => {
      if (event.code === "Space") {
        event.preventDefault();
        togglePause();
      }
      const key = Number(event.key);
      if (key >= 1 && key <= 9) hitHole(holes[key - 1]);
    });
  </script>
</body>
</html>
