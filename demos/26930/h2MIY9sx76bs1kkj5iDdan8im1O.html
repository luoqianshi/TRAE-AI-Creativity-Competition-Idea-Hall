<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习PK大战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    color: #fff;
    overflow: hidden;
  }

  /* ===== 粒子背景 ===== */
  #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  /* ===== 开始界面 ===== */
  #startScreen {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  }
  #startScreen h1 {
    font-size: 4rem; font-weight: 900;
    background: linear-gradient(90deg, #f7971e, #ffd200, #f7971e);
    background-size: 200% auto;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    animation: shimmer 2s linear infinite;
    text-shadow: 0 0 40px rgba(255,210,0,.3);
    margin-bottom: 1rem;
  }
  @keyframes shimmer { to { background-position: 200% center; } }

  #startScreen p { font-size: 1.1rem; color: #aaa; margin-bottom: 2rem; }

  .name-inputs { display: flex; gap: 2rem; margin-bottom: 2rem; }
  .name-inputs label { display: flex; flex-direction: column; align-items: center; gap: .5rem; }
  .name-inputs span { font-size: .95rem; color: #ccc; }
  .name-inputs input {
    width: 180px; padding: .6rem 1rem; border-radius: 12px;
    border: 2px solid rgba(255,255,255,.15); background: rgba(255,255,255,.08);
    color: #fff; font-size: 1rem; text-align: center; outline: none;
    transition: border-color .3s;
  }
  .name-inputs input:focus { border-color: #ffd200; }

  #startBtn {
    padding: 1rem 3rem; font-size: 1.3rem; font-weight: 700;
    border: none; border-radius: 50px; cursor: pointer;
    background: linear-gradient(135deg, #f7971e, #ffd200);
    color: #1a1a2e; box-shadow: 0 0 30px rgba(255,210,0,.4);
    transition: transform .2s, box-shadow .2s;
  }
  #startBtn:hover { transform: scale(1.05); box-shadow: 0 0 50px rgba(255,210,0,.6); }

  /* ===== 游戏界面 ===== */
  #gameScreen { display: none; position: relative; z-index: 1; height: 100vh; padding: 1rem; }

  /* 顶部倒计时 */
  .top-bar {
    display: flex; align-items: center; justify-content: center; gap: 1rem;
    margin-bottom: 1rem;
  }
  .timer {
    font-size: 2.2rem; font-weight: 900;
    background: linear-gradient(135deg, #ff416c, #ff4b2b);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: none;
    position: relative;
  }
  .timer.urgent { animation: pulse .5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.15); } }

  .timer-label { font-size: .85rem; color: #aaa; }

  /* 双栏布局 */
  .arena {
    display: grid; grid-template-columns: 1fr 80px 1fr; gap: 0;
    height: calc(100vh - 100px);
  }

  /* VS */
  .vs-col {
    display: flex; align-items: center; justify-content: center;
    font-size: 2.5rem; font-weight: 900;
    background: linear-gradient(180deg, #ff416c, #ffd200);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    animation: vsPulse 1.5s ease-in-out infinite;
  }
  @keyframes vsPulse { 0%,100%{ opacity:1; } 50%{ opacity:.5; } }

  /* 玩家面板 */
  .player-panel {
    background: rgba(255,255,255,.05);
    border-radius: 20px; padding: 1.5rem;
    display: flex; flex-direction: column;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.08);
    position: relative; overflow: hidden;
  }
  .player-panel::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
  }
  .player-panel.left::before { background: linear-gradient(90deg, #6a11cb, #2575fc); }
  .player-panel.right::before { background: linear-gradient(90deg, #f7971e, #ffd200); }

  .player-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1rem;
  }
  .player-name {
    font-size: 1.4rem; font-weight: 700;
  }
  .left .player-name { color: #7c8cf8; }
  .right .player-name { color: #ffd200; }

  .player-score {
    font-size: .9rem; color: #aaa;
  }
  .player-score span { font-weight: 700; color: #fff; }

  /* 进度条 */
  .progress-wrap {
    height: 8px; background: rgba(255,255,255,.1); border-radius: 4px;
    margin-bottom: 1.2rem; overflow: hidden;
  }
  .progress-bar {
    height: 100%; border-radius: 4px; width: 0%; transition: width .4s ease;
  }
  .left .progress-bar { background: linear-gradient(90deg, #6a11cb, #2575fc); }
  .right .progress-bar { background: linear-gradient(90deg, #f7971e, #ffd200); }

  /* 题目区 */
  .question-area {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .question-num {
    font-size: .85rem; color: #888; margin-bottom: .5rem;
  }
  .question-text {
    font-size: 2.4rem; font-weight: 900; margin-bottom: 1.5rem;
    min-height: 3.5rem;
  }
  .left .question-text { color: #a8b4ff; }
  .right .question-text { color: #ffe066; }

  .answer-row {
    display: flex; gap: .8rem; align-items: center;
  }
  .answer-input {
    width: 140px; padding: .7rem 1rem; font-size: 1.5rem; font-weight: 700;
    text-align: center; border-radius: 14px;
    border: 2px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.08); color: #fff;
    outline: none; transition: border-color .3s, box-shadow .3s;
  }
  .answer-input:focus {
    border-color: #ffd200;
    box-shadow: 0 0 15px rgba(255,210,0,.3);
  }
  .left .answer-input:focus { border-color: #2575fc; box-shadow: 0 0 15px rgba(37,117,252,.3); }

  .submit-btn {
    padding: .7rem 1.5rem; font-size: 1.1rem; font-weight: 700;
    border: none; border-radius: 14px; cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  .left .submit-btn {
    background: linear-gradient(135deg, #6a11cb, #2575fc); color: #fff;
  }
  .right .submit-btn {
    background: linear-gradient(135deg, #f7971e, #ffd200); color: #1a1a2e;
  }
  .submit-btn:hover { transform: scale(1.05); }
  .submit-btn:active { transform: scale(.97); }

  /* 答题反馈 */
  .feedback {
    margin-top: .8rem; font-size: 1rem; font-weight: 700;
    min-height: 1.5rem;
  }
  .feedback.correct { color: #00e676; }
  .feedback.wrong { color: #ff5252; }

  /* 对手状态提示 */
  .opponent-status {
    margin-top: 1rem; padding: .6rem 1rem; border-radius: 10px;
    background: rgba(255,255,255,.06); font-size: .85rem; color: #bbb;
    text-align: center; min-height: 2.5rem;
    transition: background .3s;
  }
  .opponent-status.highlight {
    background: rgba(255,210,0,.15); color: #ffd200;
    animation: statusPop .4s ease;
  }
  @keyframes statusPop { 0%{ transform:scale(1); } 50%{ transform:scale(1.05); } 100%{ transform:scale(1); } }

  /* 完成面板 */
  .done-overlay {
    position: absolute; inset: 0; border-radius: 20px;
    background: rgba(0,0,0,.7); backdrop-filter: blur(6px);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 10;
  }
  .done-overlay.show { display: flex; }
  .done-overlay h2 { font-size: 1.8rem; margin-bottom: .5rem; }
  .done-overlay p { color: #aaa; }

  /* ===== 结果界面 ===== */
  #resultScreen {
    display: none; position: fixed; inset: 0; z-index: 200;
    flex-direction: column; align-items: center; justify-content: center;
    background: rgba(15,12,41,.95); backdrop-filter: blur(10px);
  }
  #resultScreen.show { display: flex; }

  .result-title {
    font-size: 2.5rem; font-weight: 900; margin-bottom: 2rem;
  }
  .result-cards {
    display: flex; gap: 2rem; margin-bottom: 2rem;
  }
  .result-card {
    background: rgba(255,255,255,.06); border-radius: 20px; padding: 2rem 2.5rem;
    text-align: center; min-width: 200px;
    border: 1px solid rgba(255,255,255,.1);
    transition: transform .3s;
  }
  .result-card.winner {
    border-color: #ffd200;
    box-shadow: 0 0 40px rgba(255,210,0,.3);
    transform: scale(1.08);
  }
  .result-card .rname { font-size: 1.3rem; font-weight: 700; margin-bottom: 1rem; }
  .result-card .rstat { font-size: .95rem; color: #bbb; margin-bottom: .4rem; }
  .result-card .rstat span { color: #fff; font-weight: 700; }

  .winner-banner {
    font-size: 2rem; font-weight: 900;
    background: linear-gradient(90deg, #f7971e, #ffd200, #f7971e);
    background-size: 200% auto;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    animation: shimmer 1.5s linear infinite;
    margin-bottom: 2rem;
  }

  #restartBtn {
    padding: .8rem 2.5rem; font-size: 1.1rem; font-weight: 700;
    border: none; border-radius: 50px; cursor: pointer;
    background: linear-gradient(135deg, #6a11cb, #2575fc); color: #fff;
    box-shadow: 0 0 20px rgba(106,17,203,.4);
    transition: transform .2s;
  }
  #restartBtn:hover { transform: scale(1.05); }

  /* ===== 获胜动画 - 五彩纸屑 ===== */
  #confettiCanvas {
    position: fixed; inset: 0; z-index: 300; pointer-events: none;
  }

  /* ===== 对手完成弹出通知 ===== */
  .toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0);
    background: rgba(255,210,0,.15); border: 2px solid #ffd200;
    border-radius: 20px; padding: 1.5rem 3rem; z-index: 150;
    text-align: center; backdrop-filter: blur(10px);
    animation: toastIn .5s ease forwards;
  }
  @keyframes toastIn {
    0% { transform: translate(-50%,-50%) scale(0); opacity:0; }
    60% { transform: translate(-50%,-50%) scale(1.1); opacity:1; }
    100% { transform: translate(-50%,-50%) scale(1); opacity:1; }
  }
  .toast.fadeOut { animation: toastOut .4s ease forwards; }
  @keyframes toastOut {
    to { transform: translate(-50%,-50%) scale(0); opacity:0; }
  }
  .toast h3 { font-size: 1.5rem; color: #ffd200; margin-bottom: .3rem; }
  .toast p { color: #ccc; font-size: .95rem; }
</style>
</head>
<body>

<!-- 粒子背景 -->
<canvas id="particles"></canvas>

<!-- 开始界面 -->
<div id="startScreen">
  <h1>学习PK大战</h1>
  <p>5道题 · 3分钟 · 谁是学霸？</p>
  <div class="name-inputs">
    <label>
      <span>🔵 玩家一</span>
      <input type="text" id="name1" value="小明" maxlength="8">
    </label>
    <label>
      <span>🟡 玩家二</span>
      <input type="text" id="name2" value="小红" maxlength="8">
    </label>
  </div>
  <button id="startBtn">开始PK</button>
</div>

<!-- 游戏界面 -->
<div id="gameScreen">
  <div class="top-bar">
    <span class="timer-label">⏱ 剩余时间</span>
    <span class="timer" id="timer">03:00</span>
  </div>

  <div class="arena">
    <!-- 玩家1 -->
    <div class="player-panel left" id="panel1">
      <div class="player-header">
        <span class="player-name" id="pname1">小明</span>
        <span class="player-score">正确 <span id="score1">0</span>/5</span>
      </div>
      <div class="progress-wrap"><div class="progress-bar" id="prog1"></div></div>
      <div class="question-area">
        <div class="question-num" id="qnum1">第 1 题 / 共 5 题</div>
        <div class="question-text" id="qtext1">—</div>
        <div class="answer-row">
          <input type="number" class="answer-input" id="ans1" autocomplete="off">
          <button class="submit-btn" id="sub1">提交</button>
        </div>
        <div class="feedback" id="fb1"></div>
      </div>
      <div class="opponent-status" id="ostat1">等待对手开始...</div>
      <div class="done-overlay" id="done1">
        <h2>✅ 已完成</h2>
        <p>等待对手答题结束...</p>
      </div>
    </div>

    <!-- VS -->
    <div class="vs-col">VS</div>

    <!-- 玩家2 -->
    <div class="player-panel right" id="panel2">
      <div class="player-header">
        <span class="player-name" id="pname2">小红</span>
        <span class="player-score">正确 <span id="score2">0</span>/5</span>
      </div>
      <div class="progress-wrap"><div class="progress-bar" id="prog2"></div></div>
      <div class="question-area">
        <div class="question-num" id="qnum2">第 1 题 / 共 5 题</div>
        <div class="question-text" id="qtext2">—</div>
        <div class="answer-row">
          <input type="number" class="answer-input" id="ans2" autocomplete="off">
          <button class="submit-btn" id="sub2">提交</button>
        </div>
        <div class="feedback" id="fb2"></div>
      </div>
      <div class="opponent-status" id="ostat2">等待对手开始...</div>
      <div class="done-overlay" id="done2">
        <h2>✅ 已完成</h2>
        <p>等待对手答题结束...</p>
      </div>
    </div>
  </div>
</div>

<!-- 结果界面 -->
<div id="resultScreen">
  <div class="result-title">🏆 PK结果</div>
  <div class="winner-banner" id="winnerBanner"></div>
  <div class="result-cards">
    <div class="result-card" id="rcard1">
      <div class="rname" id="rname1">小明</div>
      <div class="rstat">正确率：<span id="racc1">0%</span></div>
      <div class="rstat">用时：<span id="rtime1">—</span></div>
      <div class="rstat">正确题数：<span id="rcorrect1">0</span>/5</div>
    </div>
    <div class="result-card" id="rcard2">
      <div class="rname" id="rname2">小红</div>
      <div class="rstat">正确率：<span id="racc2">0%</span></div>
      <div class="rstat">用时：<span id="rtime2">—</span></div>
      <div class="rstat">正确题数：<span id="rcorrect2">0</span>/5</div>
    </div>
  </div>
  <button id="restartBtn">再来一局</button>
</div>

<!-- 五彩纸屑 -->
<canvas id="confettiCanvas"></canvas>

<script>
// ===== 粒子背景 =====
(function() {
  const c = document.getElementById('particles');
  const ctx = c.getContext('2d');
  let w, h, pts = [];
  function resize() { w = c.width = innerWidth; h = c.height = innerHeight; }
  resize(); window.addEventListener('resize', resize);
  for (let i = 0; i < 60; i++) {
    pts.push({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*2+1,
               dx: (Math.random()-.5)*.4, dy: (Math.random()-.5)*.4,
               o: Math.random()*.4+.1 });
  }
  function draw() {
    ctx.clearRect(0,0,w,h);
    pts.forEach(p => {
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${p.o})`; ctx.fill();
      p.x += p.dx; p.y += p.dy;
      if (p.x < 0 || p.x > w) p.dx *= -1;
      if (p.y < 0 || p.y > h) p.dy *= -1;
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ===== 游戏逻辑 =====
const TOTAL = 5;
const TIME_LIMIT = 180; // 3分钟

let questions = [];
let players = {};
let timerInterval = null;
let timeLeft = TIME_LIMIT;
let gameEnded = false;

// 生成题目
function genQuestions() {
  questions = [];
  for (let i = 0; i < TOTAL; i++) {
    const ops = ['+', '-', '×'];
    const op = ops[Math.floor(Math.random() * ops.length)];
    let a, b, ans;
    if (op === '+') {
      a = Math.floor(Math.random() * 90) + 10;
      b = Math.floor(Math.random() * 90) + 10;
      ans = a + b;
    } else if (op === '-') {
      a = Math.floor(Math.random() * 90) + 10;
      b = Math.floor(Math.random() * a) + 1;
      ans = a - b;
    } else {
      a = Math.floor(Math.random() * 12) + 2;
      b = Math.floor(Math.random() * 12) + 2;
      ans = a * b;
    }
    questions.push({ text: `${a} ${op} ${b} = ?`, answer: ans });
  }
}

function initPlayer(id, name) {
  return {
    id, name,
    currentQ: 0,
    correct: 0,
    done: false,
    startTime: Date.now(),
    endTime: null,
    answers: []
  };
}

// UI更新
function updateQuestion(p) {
  const idx = p.id;
  const qEl = document.getElementById('qtext' + idx);
  const numEl = document.getElementById('qnum' + idx);
  const ansEl = document.getElementById('ans' + idx);
  const fbEl = document.getElementById('fb' + idx);

  if (p.done) return;
  if (p.currentQ >= TOTAL) {
    p.done = true;
    p.endTime = Date.now();
    qEl.textContent = '—';
    numEl.textContent = '已完成';
    ansEl.disabled = true;
    document.getElementById('done' + idx).classList.add('show');
    // 通知对手
    const otherIdx = idx === 1 ? 2 : 1;
    const ostat = document.getElementById('ostat' + otherIdx);
    ostat.textContent = `⚡ ${p.name} 已完成所有题目！`;
    ostat.classList.add('highlight');
    showToast(p.name + ' 完成了！', '对手已答完全部题目');
    checkGameEnd();
    return;
  }

  const q = questions[p.currentQ];
  qEl.textContent = q.text;
  numEl.textContent = `第 ${p.currentQ + 1} 题 / 共 ${TOTAL} 题`;
  ansEl.value = '';
  fbEl.textContent = '';
  ansEl.focus();

  // 更新对手状态
  const otherIdx = idx === 1 ? 2 : 1;
  const ostat = document.getElementById('ostat' + otherIdx);
  if (!ostat.classList.contains('highlight')) {
    ostat.textContent = `📍 ${p.name} 正在做第 ${p.currentQ + 1} 题`;
  }
}

function updateProgress(p) {
  const idx = p.id;
  const pct = (p.currentQ / TOTAL) * 100;
  document.getElementById('prog' + idx).style.width = pct + '%';
  document.getElementById('score' + idx).textContent = p.correct;
}

function submitAnswer(p) {
  if (p.done || gameEnded) return;
  const idx = p.id;
  const ansEl = document.getElementById('ans' + idx);
  const fbEl = document.getElementById('fb' + idx);
  const val = ansEl.value.trim();
  if (val === '') return;

  const userAns = parseInt(val, 10);
  const correctAns = questions[p.currentQ].answer;

  if (userAns === correctAns) {
    p.correct++;
    fbEl.textContent = '✅ 回答正确！';
    fbEl.className = 'feedback correct';
  } else {
    fbEl.textContent = `❌ 答案是 ${correctAns}`;
    fbEl.className = 'feedback wrong';
  }

  p.answers.push({ question: p.currentQ, userAns, correct: userAns === correctAns });
  p.currentQ++;
  updateProgress(p);

  setTimeout(() => {
    updateQuestion(p);
  }, 600);
}

// 倒计时
function startTimer() {
  timeLeft = TIME_LIMIT;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      endGame();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  const el = document.getElementById('timer');
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if (timeLeft <= 30) el.classList.add('urgent');
  else el.classList.remove('urgent');
}

// 弹出通知
function showToast(title, msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<h3>${title}</h3><p>${msg}</p>`;
  document.body.appendChild(t);
  setTimeout(() => { t.classList.add('fadeOut'); }, 2000);
  setTimeout(() => { t.remove(); }, 2500);
}

// 检查游戏结束
function checkGameEnd() {
  if (players[1].done && players[2].done) {
    endGame();
  }
}

// 结束游戏
function endGame() {
  if (gameEnded) return;
  gameEnded = true;
  clearInterval(timerInterval);

  // 标记未完成的玩家
  [1, 2].forEach(idx => {
    const p = players[idx];
    if (!p.done) {
      p.done = true;
      p.endTime = Date.now();
    }
  });

  showResult();
}

// 显示结果
function showResult() {
  const p1 = players[1], p2 = players[2];
  const acc1 = p1.correct / TOTAL, acc2 = p2.correct / TOTAL;
  const time1 = (p1.endTime - p1.startTime) / 1000;
  const time2 = (p2.endTime - p2.startTime) / 1000;

  // 判定胜负：正确率优先，相同看时间
  let winner = 0;
  if (acc1 > acc2) winner = 1;
  else if (acc2 > acc1) winner = 2;
  else if (time1 < time2) winner = 1;
  else if (time2 < time1) winner = 2;
  // else 平局

  document.getElementById('rname1').textContent = p1.name;
  document.getElementById('rname2').textContent = p2.name;
  document.getElementById('racc1').textContent = Math.round(acc1 * 100) + '%';
  document.getElementById('racc2').textContent = Math.round(acc2 * 100) + '%';
  document.getElementById('rtime1').textContent = time1.toFixed(1) + '秒';
  document.getElementById('rtime2').textContent = time2.toFixed(1) + '秒';
  document.getElementById('rcorrect1').textContent = p1.correct;
  document.getElementById('rcorrect2').textContent = p2.correct;

  const banner = document.getElementById('winnerBanner');
  if (winner === 1) {
    banner.textContent = `🎉 ${p1.name} 获胜！`;
    document.getElementById('rcard1').classList.add('winner');
  } else if (winner === 2) {
    banner.textContent = `🎉 ${p2.name} 获胜！`;
    document.getElementById('rcard2').classList.add('winner');
  } else {
    banner.textContent = '🤝 势均力敌，平局！';
  }

  document.getElementById('resultScreen').classList.add('show');

  if (winner > 0) launchConfetti();
}

// ===== 五彩纸屑动画 =====
function launchConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = innerWidth;
  canvas.height = innerHeight;

  const colors = ['#f7971e','#ffd200','#ff416c','#2575fc','#00e676','#e040fb','#00bcd4'];
  const pieces = [];

  for (let i = 0; i < 200; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      w: Math.random() * 10 + 5,
      h: Math.random() * 6 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      dy: Math.random() * 3 + 2,
      dx: (Math.random() - 0.5) * 2,
      rot: Math.random() * 360,
      dr: (Math.random() - 0.5) * 8,
      o: 1
    });
  }

  let frame = 0;
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    pieces.forEach(p => {
      if (p.o <= 0) return;
      alive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.globalAlpha = p.o;
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();

      p.y += p.dy;
      p.x += p.dx;
      p.rot += p.dr;
      if (p.y > canvas.height + 20) p.o = 0;
      if (frame > 180) p.o -= 0.01;
    });
    frame++;
    if (alive && frame < 400) requestAnimationFrame(animate);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  animate();
}

// ===== 事件绑定 =====
document.getElementById('startBtn').addEventListener('click', () => {
  const n1 = document.getElementById('name1').value.trim() || '玩家一';
  const n2 = document.getElementById('name2').value.trim() || '玩家二';

  genQuestions();
  players[1] = initPlayer(1, n1);
  players[2] = initPlayer(2, n2);
  gameEnded = false;

  document.getElementById('pname1').textContent = n1;
  document.getElementById('pname2').textContent = n2;
  document.getElementById('ostat1').textContent = '等待对手答题...';
  document.getElementById('ostat2').textContent = '等待对手答题...';
  document.getElementById('done1').classList.remove('show');
  document.getElementById('done2').classList.remove('show');
  document.getElementById('prog1').style.width = '0%';
  document.getElementById('prog2').style.width = '0%';
  document.getElementById('score1').textContent = '0';
  document.getElementById('score2').textContent = '0';
  document.getElementById('ans1').disabled = false;
  document.getElementById('ans2').disabled = false;

  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';

  updateQuestion(players[1]);
  updateQuestion(players[2]);
  startTimer();
});

document.getElementById('sub1').addEventListener('click', () => submitAnswer(players[1]));

// 回车提交
document.getElementById('ans1').addEventListener('keydown', e => {

});
document.getElementById('ans2').addEventListener('keydown', e => {

});

// 重新开始
document.getElementById('restartBtn').addEventListener('click', () => {
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('rcard1').classList.remove('winner');
  document.getElementById('rcard2').classList.remove('winner');
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('startScreen').style.display = 'flex';
  clearInterval(timerInterval);
});
</script>
