<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a472a 0%, #0d2818 100%);
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            height: 100%;
            padding: 10px;
        }

        h1 {
            color: #22c55e;
            font-size: clamp(1.5rem, 5vw, 3rem);
            text-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
            margin: 0;
            letter-spacing: 4px;
            flex-shrink: 0;
        }

        .score-panel {
            display: flex;
            gap: clamp(20px, 5vw, 40px);
            margin-bottom: 5px;
            flex-shrink: 0;
        }

        .score-box {
            background: rgba(0, 0, 0, 0.4);
            padding: clamp(8px, 2vw, 15px) clamp(15px, 4vw, 30px);
            border-radius: 15px;
            border: 2px solid #22c55e;
        }

        .score-label {
            color: #86efac;
            font-size: clamp(0.7rem, 1.5vw, 0.9rem);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 3px;
        }

        .score-value {
            color: #fff;
            font-size: clamp(1rem, 4vw, 2rem);
            font-weight: bold;
            text-align: center;
        }

        .canvas-wrapper {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(34, 197, 94, 0.3), inset 0 0 60px rgba(0, 0, 0, 0.5);
            border: 4px solid #22c55e;
            flex-shrink: 0;
        }

        canvas {
            display: block;
            background: #000;
        }

        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .game-over-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .game-over-title {
            color: #ef4444;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }

        .game-over-score {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-start {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.6);
        }

        .btn-pause {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #fff;
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.4);
        }

        .btn-pause:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(234, 179, 8, 0.6);
        }

        .btn-restart {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
        }

        .mode-btn {
            padding: 10px 25px;
            border: 2px solid #22c55e;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.4);
            color: #86efac;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }

        .mode-btn.selected {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
        }

        .instructions {
            color: #86efac;
            font-size: 0.9rem;
            margin-top: 15px;
            text-align: center;
        }

        .mobile-controls {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            width: 200px;
            height: 200px;
            margin-top: 20px;
        }

        .mobile-btn {
            background: rgba(34, 197, 94, 0.3);
            border: 2px solid #22c55e;
            border-radius: 10px;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .mobile-btn:hover,
        .mobile-btn:active {
            background: rgba(34, 197, 94, 0.6);
            transform: scale(0.95);
        }

        .mobile-btn:nth-child(1) { grid-column: 2; grid-row: 1; }
        .mobile-btn:nth-child(2) { grid-column: 1; grid-row: 2; }
        .mobile-btn:nth-child(3) { grid-column: 3; grid-row: 2; }
        .mobile-btn:nth-child(4) { grid-column: 2; grid-row: 3; }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            .score-panel {
                gap: 20px;
            }

            .score-box {
                padding: 10px 20px;
            }

            .score-value {
                font-size: 1.5rem;
            }

            .mobile-controls {
                display: grid;
            }

            .instructions {
                font-size: 0.8rem;
            }

            .difficulty-panel {
                flex-wrap: wrap;
                justify-content: center;
            }

            .difficulty-btn {
                padding: 8px 15px;
                font-size: 0.8rem;
                min-width: 60px;
            }

            .btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .food-pulse {
            animation: pulse 0.5s ease-in-out infinite;
        }

        .difficulty-panel {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .difficulty-btn {
            padding: 10px 20px;
            border: 2px solid #22c55e;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.4);
            color: #86efac;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            min-width: 70px;
        }

        .difficulty-btn:hover:not(.locked) {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }

        .difficulty-btn.locked {
            border-color: #4b5563;
            color: #6b7280;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .difficulty-btn.selected {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
        }

        .difficulty-btn.locked::after {
            content: '🔒';
            position: absolute;
            top: -8px;
            right: -8px;
            font-size: 14px;
        }

        .difficulty-tooltip {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 8px 12px;
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
            white-space: nowrap;
            z-index: 100;
            margin-bottom: 5px;
        }

        .difficulty-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: rgba(0, 0, 0, 0.9);
        }

        .difficulty-btn.locked:hover .difficulty-tooltip {
            display: block;
        }

        .notification-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 10px 40px rgba(34, 197, 94, 0.5);
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s ease;
            text-align: center;
        }

        .notification-toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .difficulty-label {
            color: #86efac;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 贪吃蛇</h1>
        
        <div class="score-panel">
            <div class="score-box">
                <div class="score-label">当前分数</div>
                <div class="score-value" id="currentScore">0</div>
            </div>
            <div class="score-box">
                <div class="score-label" id="highScoreLabel">经典-困难 最高分</div>
                <div class="score-value" id="highScore">0</div>
            </div>
        </div>

        <div class="difficulty-label">游戏模式</div>
        <div class="mode-selector" id="modeSelector">
            <button class="mode-btn selected" data-mode="classic">经典模式</button>
            <button class="mode-btn" data-mode="endless">无尽模式</button>
        </div>

        <div class="difficulty-label" id="difficultyLabel">选择难度</div>
        <div class="difficulty-panel" id="difficultyPanel">
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="game-over-overlay" id="gameOverOverlay">
                <div class="game-over-title">游戏结束!</div>
                <div class="game-over-score">得分: <span id="finalScore">0</span></div>
                <button class="btn btn-restart" onclick="game.restart()">重新开始</button>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-pause" id="pauseBtn" onclick="game.togglePause()" disabled>暂停</button>
            <button class="btn btn-restart" onclick="game.restart()">重新开始</button>
        </div>

        <div class="mobile-controls">
            <button class="mobile-btn" onclick="game.changeDirection('UP')">↑</button>
            <button class="mobile-btn" onclick="game.changeDirection('LEFT')">←</button>
            <button class="mobile-btn" onclick="game.changeDirection('RIGHT')">→</button>
            <button class="mobile-btn" onclick="game.changeDirection('DOWN')">↓</button>
        </div>

        <div class="instructions">
            使用键盘方向键或WSAD控制蛇的移动方向<br>
            空格键暂停/开始 | 回车键重新开始<br>
            准备阶段可切换难度，按下方向键开始游戏
        </div>
    </div>

    <div class="notification-toast" id="notificationToast"></div>

    <script>
        const GRID_SIZE = 20;
        const MIN_CELL_SIZE = 12;
        const MAX_CELL_SIZE = 25;

        const DIFFICULTY_LEVELS = [
            { id: 1, name: '简单', speed: 200, obstacleCount: 0, hasPoisonFood: false },
            { id: 2, name: '普通', speed: 150, obstacleCount: 0, hasPoisonFood: false },
            { id: 3, name: '困难', speed: 110, obstacleCount: 0, hasPoisonFood: false },
            { id: 4, name: '噩梦', speed: 80, obstacleCount: 6, hasPoisonFood: false },
            { id: 5, name: '地狱', speed: 65, obstacleCount: 8, hasPoisonFood: false }
        ];

        const ENDLESS_MODE_CONFIG = {
            startSpeed: 200,
            minSpeed: 50,
            speedDecreasePerScore: 5,
            scorePerSpeedUp: 20,
            obstacleCount: 0,
            hasPoisonFood: true,
            poisonFoodInterval: 100
        };

        class SnakeGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.gridSize = GRID_SIZE;
                this.cellSize = this.calculateCellSize();
                
                this.snake = [];
                this.food = { x: 0, y: 0 };
                this.poisonFood = null;
                this.obstacles = [];
                this.direction = 'RIGHT';
                this.nextDirection = 'RIGHT';
                this.score = 0;
                
                this.isPlaying = false;
                this.isPaused = false;
                this.isReadyToMove = false;
                this.gameLoop = null;
                
                this.selectedDifficulty = 3;
                this.gameMode = 'classic';
                this.currentSpeed = 200;
                this.unlockedLevels = this.loadUnlockedLevels();
                this.levelBestScores = this.loadLevelBestScores();
                
                this.init();
            }

            calculateCellSize() {
                const availableWidth = window.innerWidth - 40;
                const availableHeight = window.innerHeight * 0.55;
                
                const cellWidth = availableWidth / this.gridSize;
                const cellHeight = availableHeight / this.gridSize;
                
                const cellSize = Math.min(cellWidth, cellHeight);
                
                return Math.max(MIN_CELL_SIZE, Math.min(MAX_CELL_SIZE, cellSize));
            }

            resizeCanvas() {
                this.cellSize = this.calculateCellSize();
                const canvasSize = this.cellSize * this.gridSize;
                this.canvas.width = canvasSize;
                this.canvas.height = canvasSize;
                
                if (this.isPlaying && !this.isPaused) {
                    this.draw();
                } else {
                    this.drawInitialScreen();
                }
            }

            loadUnlockedLevels() {
                const saved = localStorage.getItem('snakeUnlockedLevels');
                if (saved) {
                    return JSON.parse(saved);
                }
                return [1];
            }

            loadLevelBestScores() {
                const saved = localStorage.getItem('snakeLevelBestScores');
                if (saved) {
                    return JSON.parse(saved);
                }
                return {};
            }

            saveUnlockedLevels() {
                localStorage.setItem('snakeUnlockedLevels', JSON.stringify(this.unlockedLevels));
            }

            saveLevelBestScores() {
                localStorage.setItem('snakeLevelBestScores', JSON.stringify(this.levelBestScores));
            }

            init() {
                const canvasSize = this.cellSize * this.gridSize;
                this.canvas.width = canvasSize;
                this.canvas.height = canvasSize;
                
                this.bindModeSelector();
                this.updateHighScoreLabel();
                this.updateHighScoreDisplay();
                this.bindEvents();
                this.renderDifficultyButtons();
                this.updateDifficultyVisibility();
                
                window.addEventListener('resize', () => this.resizeCanvas());
                
                this.start();
            }

            bindModeSelector() {
                const modeBtns = document.querySelectorAll('.mode-btn');
                modeBtns.forEach((btn) => {
                    btn.addEventListener('click', () => {
                        if (!this.isPlaying || !this.isReadyToMove) {
                            const mode = btn.getAttribute('data-mode');
                            this.gameMode = mode;
                            
                            modeBtns.forEach(b => b.classList.remove('selected'));
                            btn.classList.add('selected');
                            
                            this.updateDifficultyVisibility();
                            this.updateHighScoreLabel();
                            this.updateHighScoreDisplay();
                            this.start();
                        }
                    });
                });
            }

            updateDifficultyVisibility() {
                const difficultyLabel = document.getElementById('difficultyLabel');
                const difficultyPanel = document.getElementById('difficultyPanel');
                
                if (this.gameMode === 'endless') {
                    difficultyLabel.style.display = 'none';
                    difficultyPanel.style.display = 'none';
                } else {
                    difficultyLabel.style.display = 'block';
                    difficultyPanel.style.display = 'flex';
                }
            }

            renderDifficultyButtons() {
                const panel = document.getElementById('difficultyPanel');
                panel.innerHTML = '';
                
                DIFFICULTY_LEVELS.forEach((level) => {
                    const isUnlocked = this.unlockedLevels.includes(level.id);
                    const isSelected = this.selectedDifficulty === level.id;
                    
                    const btn = document.createElement('button');
                    btn.className = `difficulty-btn${!isUnlocked ? ' locked' : ''}${isSelected ? ' selected' : ''}`.replace(' locked selected', ' selected');
                    btn.innerHTML = `${level.name}`;
                    
                    if (!isUnlocked) {
                        const prevLevel = DIFFICULTY_LEVELS.find(l => l.id === level.id - 1);
                        const tooltip = document.createElement('span');
                        tooltip.className = 'difficulty-tooltip';
                        tooltip.textContent = `在「${prevLevel.name}」获得200分解锁`;
                        btn.appendChild(tooltip);
                    } else {
                        btn.addEventListener('click', ((currentLevel) => {
                            return () => {
                                if (!this.isPlaying || !this.isReadyToMove) {
                                    this.selectedDifficulty = currentLevel.id;
                                    this.updateHighScoreLabel();
                                    this.updateHighScoreDisplay();
                                    this.start();
                                }
                            };
                        })(level));
                    }
                    
                    panel.appendChild(btn);
                });
            }

            showNotification(message) {
                const toast = document.getElementById('notificationToast');
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }

            bindEvents() {
                document.addEventListener('keydown', (e) => {
                    const key = e.key.toLowerCase();
                    
                    if (key === ' ' || e.code === 'Space') {
                        e.preventDefault();
                        if (this.isPlaying) {
                            if (this.isReadyToMove) {
                                this.togglePause();
                            } else {
                                this.isReadyToMove = true;
                            }
                        }
                        return;
                    }
                    
                    if (key === 'enter' || e.code === 'Enter') {
                        e.preventDefault();
                        if (this.isPlaying || document.getElementById('gameOverOverlay').classList.contains('show')) {
                            this.restart();
                        }
                        return;
                    }
                    
                    if (!this.isPlaying || this.isPaused) return;
                    
                    switch (key) {
                        case 'arrowup':
                        case 'w':
                            if (this.direction !== 'DOWN') {
                                this.nextDirection = 'UP';
                                this.isReadyToMove = true;
                            }
                            break;
                        case 'arrowdown':
                        case 's':
                            if (this.direction !== 'UP') {
                                this.nextDirection = 'DOWN';
                                this.isReadyToMove = true;
                            }
                            break;
                        case 'arrowleft':
                        case 'a':
                            if (this.direction !== 'RIGHT') {
                                this.nextDirection = 'LEFT';
                                this.isReadyToMove = true;
                            }
                            break;
                        case 'arrowright':
                        case 'd':
                            if (this.direction !== 'LEFT') {
                                this.nextDirection = 'RIGHT';
                                this.isReadyToMove = true;
                            }
                            break;
                    }
                    
                    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(key)) {
                        e.preventDefault();
                    }
                });

                let touchStartX = 0;
                let touchStartY = 0;
                
                this.canvas.addEventListener('touchstart', (e) => {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                });

                this.canvas.addEventListener('touchend', (e) => {
                    if (!this.isPlaying || this.isPaused) return;
                    
                    const touchEndX = e.changedTouches[0].clientX;
                    const touchEndY = e.changedTouches[0].clientY;
                    
                    const deltaX = touchEndX - touchStartX;
                    const deltaY = touchEndY - touchStartY;
                    
                    if (Math.abs(deltaX) > Math.abs(deltaY)) {
                        if (deltaX > 0 && this.direction !== 'LEFT') {
                            this.nextDirection = 'RIGHT';
                            this.isReadyToMove = true;
                        } else if (deltaX < 0 && this.direction !== 'RIGHT') {
                            this.nextDirection = 'LEFT';
                            this.isReadyToMove = true;
                        }
                    } else {
                        if (deltaY > 0 && this.direction !== 'UP') {
                            this.nextDirection = 'DOWN';
                            this.isReadyToMove = true;
                        } else if (deltaY < 0 && this.direction !== 'DOWN') {
                            this.nextDirection = 'UP';
                            this.isReadyToMove = true;
                        }
                    }
                });
            }

            start() {
                let initialSpeed;
                
                if (this.gameMode === 'endless') {
                    initialSpeed = ENDLESS_MODE_CONFIG.startSpeed;
                    this.currentSpeed = initialSpeed;
                } else {
                    const levelConfig = DIFFICULTY_LEVELS[this.selectedDifficulty - 1];
                    if (!this.unlockedLevels.includes(this.selectedDifficulty)) {
                        this.showNotification('该难度尚未解锁！');
                        return;
                    }
                    initialSpeed = levelConfig.speed;
                    this.currentSpeed = initialSpeed;
                }
                
                if (this.gameLoop) {
                    clearInterval(this.gameLoop);
                    this.gameLoop = null;
                }
                
                this.resetGame();
                this.isPlaying = true;
                this.isPaused = false;
                this.isReadyToMove = false;
                
                document.getElementById('pauseBtn').disabled = false;
                document.getElementById('gameOverOverlay').classList.remove('show');
                
                this.renderDifficultyButtons();
                
                this.gameLoop = setInterval(() => {
                    if (!this.isPaused && this.isReadyToMove) {
                        this.update();
                    }
                    this.draw();
                }, this.currentSpeed);
            }

            updateSpeed() {
                if (this.gameMode !== 'endless') return;
                
                const newSpeed = Math.max(
                    ENDLESS_MODE_CONFIG.minSpeed,
                    ENDLESS_MODE_CONFIG.startSpeed - Math.floor(this.score / ENDLESS_MODE_CONFIG.scorePerSpeedUp) * ENDLESS_MODE_CONFIG.speedDecreasePerScore * 2
                );
                
                if (newSpeed !== this.currentSpeed) {
                    this.currentSpeed = newSpeed;
                    if (this.gameLoop) {
                        clearInterval(this.gameLoop);
                        this.gameLoop = setInterval(() => {
                            if (!this.isPaused && this.isReadyToMove) {
                                this.update();
                            }
                            this.draw();
                        }, this.currentSpeed);
                    }
                }
            }

            resetGame() {
                let obstacleCount = 0;
                let hasPoison = false;
                
                if (this.gameMode === 'endless') {
                    obstacleCount = ENDLESS_MODE_CONFIG.obstacleCount;
                    hasPoison = ENDLESS_MODE_CONFIG.hasPoisonFood;
                } else {
                    const levelConfig = DIFFICULTY_LEVELS[this.selectedDifficulty - 1];
                    obstacleCount = levelConfig.obstacleCount;
                    hasPoison = levelConfig.hasPoisonFood;
                }
                
                this.snake = [
                    { x: 10, y: 10 },
                    { x: 9, y: 10 },
                    { x: 8, y: 10 }
                ];
                this.direction = 'RIGHT';
                this.nextDirection = 'RIGHT';
                this.score = 0;
                this.isReadyToMove = false;
                this.updateScoreDisplay();
                this.obstacles = this.generateObstacles(obstacleCount);
                this.spawnFood();
                this.poisonFood = null;
                if (hasPoison) {
                    this.spawnPoisonFood();
                }
            }

            generateObstacles(count) {
                if (count === 0) return [];
                
                const obstacles = [];
                const pattern = this.getObstaclePattern(count);
                
                for (const pos of pattern) {
                    if (!this.isInSafeZone(pos)) {
                        obstacles.push(pos);
                    }
                }
                
                return obstacles;
            }

            getObstaclePattern(count) {
                const patterns = [];
                
                if (count >= 8) {
                    patterns.push(...this.createCrossPattern());
                }
                
                if (count >= 12) {
                    patterns.push(...this.createDiamondPattern());
                }
                
                const uniquePatterns = [];
                const seen = new Set();
                
                for (const pos of patterns) {
                    const key = `${pos.x},${pos.y}`;
                    if (!seen.has(key)) {
                        seen.add(key);
                        uniquePatterns.push(pos);
                    }
                }
                
                return uniquePatterns.slice(0, count);
            }

            createCrossPattern() {
                const centerX = Math.floor(this.gridSize / 2);
                const centerY = Math.floor(this.gridSize / 2);
                const length = 5;
                const obstacles = [];
                
                for (let i = -length; i <= length; i++) {
                    if (i !== 0 && Math.abs(i) > 2) {
                        obstacles.push({ x: centerX + i, y: centerY });
                        obstacles.push({ x: centerX, y: centerY + i });
                    }
                }
                
                return obstacles;
            }

            createDiamondPattern() {
                const centerX = Math.floor(this.gridSize / 2);
                const centerY = Math.floor(this.gridSize / 2);
                const size = 6;
                const obstacles = [];
                
                for (let i = -size; i <= size; i++) {
                    for (let j = -size; j <= size; j++) {
                        if (Math.abs(i) + Math.abs(j) === size && Math.abs(i) > 1 && Math.abs(j) > 1) {
                            obstacles.push({ x: centerX + i, y: centerY + j });
                        }
                    }
                }
                
                return obstacles;
            }

            isInSafeZone(pos) {
                const safeX = Math.floor(this.gridSize / 2);
                const safeY = Math.floor(this.gridSize / 2);
                return Math.abs(pos.x - safeX) < 6 && Math.abs(pos.y - safeY) < 6;
            }

            restart() {
                if (this.gameLoop) {
                    clearInterval(this.gameLoop);
                }
                this.start();
            }

            togglePause() {
                this.isPaused = !this.isPaused;
                const pauseBtn = document.getElementById('pauseBtn');
                pauseBtn.textContent = this.isPaused ? '继续' : '暂停';
            }

            changeDirection(dir) {
                if (!this.isPlaying || this.isPaused) return;
                
                switch (dir) {
                    case 'UP':
                        if (this.direction !== 'DOWN') this.nextDirection = 'UP';
                        break;
                    case 'DOWN':
                        if (this.direction !== 'UP') this.nextDirection = 'DOWN';
                        break;
                    case 'LEFT':
                        if (this.direction !== 'RIGHT') this.nextDirection = 'LEFT';
                        break;
                    case 'RIGHT':
                        if (this.direction !== 'LEFT') this.nextDirection = 'RIGHT';
                        break;
                }
            }

            update() {
                this.direction = this.nextDirection;
                
                const head = { ...this.snake[0] };
                
                switch (this.direction) {
                    case 'UP':
                        head.y -= 1;
                        break;
                    case 'DOWN':
                        head.y += 1;
                        break;
                    case 'LEFT':
                        head.x -= 1;
                        break;
                    case 'RIGHT':
                        head.x += 1;
                        break;
                }

                if (this.checkCollision(head)) {
                    this.gameOver();
                    return;
                }

                if (this.poisonFood && head.x === this.poisonFood.x && head.y === this.poisonFood.y) {
                    this.gameOver();
                    return;
                }

                this.snake.unshift(head);

                if (head.x === this.food.x && head.y === this.food.y) {
                    this.score += 10;
                    this.updateScoreDisplay();
                    
                    if (this.gameMode === 'classic') {
                        this.checkUnlock();
                    }
                    
                    this.spawnFood();
                    
                    if (this.gameMode === 'endless') {
                        this.updateSpeed();
                        if (ENDLESS_MODE_CONFIG.hasPoisonFood) {
                            if (this.poisonFood) {
                                this.spawnPoisonFood();
                            } else if (this.score >= ENDLESS_MODE_CONFIG.poisonFoodInterval) {
                                this.spawnPoisonFood();
                            }
                        }
                    } else {
                        if (DIFFICULTY_LEVELS[this.selectedDifficulty - 1].hasPoisonFood) {
                            this.spawnPoisonFood();
                        }
                    }
                } else {
                    this.snake.pop();
                }
            }

            checkUnlock() {
                const nextLevel = this.selectedDifficulty + 1;
                if (nextLevel <= 5 && !this.unlockedLevels.includes(nextLevel)) {
                    if (this.score >= 200) {
                        this.unlockedLevels.push(nextLevel);
                        this.saveUnlockedLevels();
                        this.showNotification(`🎉 解锁「${DIFFICULTY_LEVELS[nextLevel - 1].name}」难度！`);
                        this.renderDifficultyButtons();
                    }
                }
            }

            checkCollision(head) {
                if (head.x < 0 || head.x >= this.gridSize || 
                    head.y < 0 || head.y >= this.gridSize) {
                    return true;
                }
                
                for (let i = 1; i < this.snake.length; i++) {
                    if (head.x === this.snake[i].x && head.y === this.snake[i].y) {
                        return true;
                    }
                }
                
                for (const obstacle of this.obstacles) {
                    if (head.x === obstacle.x && head.y === obstacle.y) {
                        return true;
                    }
                }
                
                return false;
            }

            gameOver() {
                clearInterval(this.gameLoop);
                this.isPlaying = false;
                
                const currentBest = this.levelBestScores[this.selectedDifficulty] || 0;
                if (this.score > currentBest) {
                    this.levelBestScores[this.selectedDifficulty] = this.score;
                    this.saveLevelBestScores();
                    this.showNotification('🎉 新纪录！');
                }
                
                this.updateHighScoreDisplay();
                this.renderDifficultyButtons();
                
                document.getElementById('finalScore').textContent = this.score;
                document.getElementById('gameOverOverlay').classList.add('show');
                document.getElementById('startBtn').disabled = false;
                document.getElementById('pauseBtn').disabled = true;
                document.getElementById('pauseBtn').textContent = '暂停';
            }

            spawnFood() {
                const levelConfig = DIFFICULTY_LEVELS[this.selectedDifficulty - 1];
                let newFood;
                let attempts = 0;
                do {
                    newFood = {
                        x: Math.floor(Math.random() * this.gridSize),
                        y: Math.floor(Math.random() * this.gridSize)
                    };
                    attempts++;
                } while (
                    attempts < 100 &&
                    (this.snake.some(segment => segment.x === newFood.x && segment.y === newFood.y) ||
                     this.obstacles.some(o => o.x === newFood.x && o.y === newFood.y) ||
                     (this.poisonFood && newFood.x === this.poisonFood.x && newFood.y === this.poisonFood.y))
                );
                
                if (attempts < 100) {
                    this.food = newFood;
                }
            }

            spawnPoisonFood() {
                let newPoison;
                let attempts = 0;
                do {
                    newPoison = {
                        x: Math.floor(Math.random() * this.gridSize),
                        y: Math.floor(Math.random() * this.gridSize)
                    };
                    attempts++;
                } while (
                    attempts < 100 &&
                    (this.snake.some(segment => segment.x === newPoison.x && segment.y === newPoison.y) ||
                     this.obstacles.some(o => o.x === newPoison.x && o.y === newPoison.y) ||
                     newPoison.x === this.food.x && newPoison.y === this.food.y)
                );
                
                if (attempts < 100) {
                    this.poisonFood = newPoison;
                }
            }

            draw() {
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.drawGrid();
                this.drawObstacles();
                this.drawFood();
                if (this.poisonFood) {
                    this.drawPoisonFood();
                }
                this.drawSnake();
                
                if (this.isPlaying && !this.isReadyToMove && !this.isPaused) {
                    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    
                    this.ctx.fillStyle = '#22c55e';
                    this.ctx.font = `bold ${Math.floor(this.cellSize * 1.5)}px Arial`;
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('🐍 准备开始', this.canvas.width / 2, this.canvas.height / 2 - 20);
                    
                    this.ctx.fillStyle = '#86efac';
                    this.ctx.font = `${Math.floor(this.cellSize * 0.8)}px Arial`;
                    this.ctx.fillText('按下方向键开始移动', this.canvas.width / 2, this.canvas.height / 2 + 20);
                }
            }

            drawGrid() {
                this.ctx.strokeStyle = '#1a3a2a';
                this.ctx.lineWidth = 0.5;
                
                for (let i = 0; i <= this.gridSize; i++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(i * this.cellSize, 0);
                    this.ctx.lineTo(i * this.cellSize, this.canvas.height);
                    this.ctx.stroke();
                    
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, i * this.cellSize);
                    this.ctx.lineTo(this.canvas.width, i * this.cellSize);
                    this.ctx.stroke();
                }
            }

            drawObstacles() {
                this.obstacles.forEach(obstacle => {
                    const gradient = this.ctx.createLinearGradient(
                        obstacle.x * this.cellSize,
                        obstacle.y * this.cellSize,
                        (obstacle.x + 1) * this.cellSize,
                        (obstacle.y + 1) * this.cellSize
                    );
                    gradient.addColorStop(0, '#6b7280');
                    gradient.addColorStop(1, '#374151');
                    
                    this.ctx.fillStyle = gradient;
                    this.ctx.fillRect(
                        obstacle.x * this.cellSize + 1,
                        obstacle.y * this.cellSize + 1,
                        this.cellSize - 2,
                        this.cellSize - 2
                    );
                });
            }

            drawPoisonFood() {
                const gradient = this.ctx.createRadialGradient(
                    this.poisonFood.x * this.cellSize + this.cellSize / 2,
                    this.poisonFood.y * this.cellSize + this.cellSize / 2,
                    0,
                    this.poisonFood.x * this.cellSize + this.cellSize / 2,
                    this.poisonFood.y * this.cellSize + this.cellSize / 2,
                    this.cellSize / 2
                );
                
                gradient.addColorStop(0, '#fca5a5');
                gradient.addColorStop(0.5, '#ef4444');
                gradient.addColorStop(1, '#b91c1c');
                
                this.ctx.fillStyle = gradient;
                this.ctx.beginPath();
                this.ctx.arc(
                    this.poisonFood.x * this.cellSize + this.cellSize / 2,
                    this.poisonFood.y * this.cellSize + this.cellSize / 2,
                    this.cellSize / 2 - 3,
                    0,
                    Math.PI * 2
                );
                this.ctx.fill();
                
                this.ctx.fillStyle = '#7f1d1d';
                this.ctx.font = '12px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillText('☠', this.poisonFood.x * this.cellSize + this.cellSize / 2, this.poisonFood.y * this.cellSize + this.cellSize / 2);
            }

            drawSnake() {
                this.snake.forEach((segment, index) => {
                    const gradient = this.ctx.createLinearGradient(
                        segment.x * this.cellSize,
                        segment.y * this.cellSize,
                        (segment.x + 1) * this.cellSize,
                        (segment.y + 1) * this.cellSize
                    );
                    
                    if (index === 0) {
                        gradient.addColorStop(0, '#4ade80');
                        gradient.addColorStop(1, '#22c55e');
                    } else {
                        const brightness = 1 - (index / this.snake.length) * 0.3;
                        gradient.addColorStop(0, `rgba(34, 197, 94, ${brightness})`);
                        gradient.addColorStop(1, `rgba(22, 163, 74, ${brightness})`);
                    }
                    
                    this.ctx.fillStyle = gradient;
                    this.ctx.beginPath();
                    this.ctx.roundRect(
                        segment.x * this.cellSize + 2,
                        segment.y * this.cellSize + 2,
                        this.cellSize - 4,
                        this.cellSize - 4,
                        4
                    );
                    this.ctx.fill();
                    
                    if (index === 0) {
                        this.drawEyes(segment);
                    }
                });
            }

            drawEyes(head) {
                this.ctx.fillStyle = '#fff';
                const eyeSize = 4;
                const eyeOffset = 5;
                
                let eye1, eye2;
                switch (this.direction) {
                    case 'UP':
                        eye1 = { x: head.x * this.cellSize + eyeOffset, y: head.y * this.cellSize + eyeOffset };
                        eye2 = { x: head.x * this.cellSize + this.cellSize - eyeOffset - eyeSize, y: head.y * this.cellSize + eyeOffset };
                        break;
                    case 'DOWN':
                        eye1 = { x: head.x * this.cellSize + eyeOffset, y: head.y * this.cellSize + this.cellSize - eyeOffset - eyeSize };
                        eye2 = { x: head.x * this.cellSize + this.cellSize - eyeOffset - eyeSize, y: head.y * this.cellSize + this.cellSize - eyeOffset - eyeSize };
                        break;
                    case 'LEFT':
                        eye1 = { x: head.x * this.cellSize + eyeOffset, y: head.y * this.cellSize + eyeOffset };
                        eye2 = { x: head.x * this.cellSize + eyeOffset, y: head.y * this.cellSize + this.cellSize - eyeOffset - eyeSize };
                        break;
                    case 'RIGHT':
                        eye1 = { x: head.x * this.cellSize + this.cellSize - eyeOffset - eyeSize, y: head.y * this.cellSize + eyeOffset };
                        eye2 = { x: head.x * this.cellSize + this.cellSize - eyeOffset - eyeSize, y: head.y * this.cellSize + this.cellSize - eyeOffset - eyeSize };
                        break;
                }
                
                this.ctx.beginPath();
                this.ctx.arc(eye1.x + eyeSize/2, eye1.y + eyeSize/2, eyeSize/2, 0, Math.PI * 2);
                this.ctx.fill();
                
                this.ctx.beginPath();
                this.ctx.arc(eye2.x + eyeSize/2, eye2.y + eyeSize/2, eyeSize/2, 0, Math.PI * 2);
                this.ctx.fill();
                
                this.ctx.fillStyle = '#000';
                this.ctx.beginPath();
                this.ctx.arc(eye1.x + eyeSize/2, eye1.y + eyeSize/2, eyeSize/4, 0, Math.PI * 2);
                this.ctx.fill();
                
                this.ctx.beginPath();
                this.ctx.arc(eye2.x + eyeSize/2, eye2.y + eyeSize/2, eyeSize/4, 0, Math.PI * 2);
                this.ctx.fill();
            }

            drawFood() {
                const gradient = this.ctx.createRadialGradient(
                    this.food.x * this.cellSize + this.cellSize / 2,
                    this.food.y * this.cellSize + this.cellSize / 2,
                    0,
                    this.food.x * this.cellSize + this.cellSize / 2,
                    this.food.y * this.cellSize + this.cellSize / 2,
                    this.cellSize / 2
                );
                
                gradient.addColorStop(0, '#fef08a');
                gradient.addColorStop(0.5, '#eab308');
                gradient.addColorStop(1, '#ca8a04');
                
                this.ctx.fillStyle = gradient;
                this.ctx.beginPath();
                this.ctx.arc(
                    this.food.x * this.cellSize + this.cellSize / 2,
                    this.food.y * this.cellSize + this.cellSize / 2,
                    this.cellSize / 2 - 3,
                    0,
                    Math.PI * 2
                );
                this.ctx.fill();
                
                this.ctx.fillStyle = '#92400e';
                this.ctx.beginPath();
                this.ctx.moveTo(
                    this.food.x * this.cellSize + this.cellSize / 2,
                    this.food.y * this.cellSize + 3
                );
                this.ctx.lineTo(
                    this.food.x * this.cellSize + this.cellSize / 2 + 3,
                    this.food.y * this.cellSize + 8
                );
                this.ctx.lineTo(
                    this.food.x * this.cellSize + this.cellSize / 2 - 3,
                    this.food.y * this.cellSize + 8
                );
                this.ctx.closePath();
                this.ctx.fill();
            }

            drawInitialScreen() {
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.drawGrid();
                
                this.ctx.fillStyle = '#22c55e';
                this.ctx.font = 'bold 24px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.fillText('🐍 贪吃蛇', this.canvas.width / 2, this.canvas.height / 2 - 40);
                
                this.ctx.fillStyle = '#86efac';
                this.ctx.font = '16px Arial';
                this.ctx.fillText('点击开始游戏按钮', this.canvas.width / 2, this.canvas.height / 2);
                this.ctx.fillText('使用方向键控制', this.canvas.width / 2, this.canvas.height / 2 + 25);
            }

            updateScoreDisplay() {
                document.getElementById('currentScore').textContent = this.score;
            }

            updateHighScoreLabel() {
                if (this.gameMode === 'endless') {
                    document.getElementById('highScoreLabel').textContent = '无尽模式 最高分';
                } else {
                    const levelName = DIFFICULTY_LEVELS[this.selectedDifficulty - 1].name;
                    document.getElementById('highScoreLabel').textContent = `${levelName} 最高分`;
                }
            }

            updateHighScoreDisplay() {
                let currentBest = 0;
                if (this.gameMode === 'endless') {
                    currentBest = this.levelBestScores['endless'] || 0;
                } else {
                    currentBest = this.levelBestScores[this.selectedDifficulty] || 0;
                }
                document.getElementById('highScore').textContent = currentBest;
            }
        }

        const game = new SnakeGame();
    </script>
