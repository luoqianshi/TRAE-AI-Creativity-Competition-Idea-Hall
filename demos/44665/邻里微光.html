<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邻里微光 - 创意展示</title>
<style>
  body { font-family: 'PingFang SC', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .phone-frame { width: 360px; height: 700px; background: #fff; border-radius: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); overflow: hidden; border: 8px solid #222; position: relative; }
  .status-bar { height: 30px; background: #fff; display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: bold; }
  .header { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); padding: 20px; color: #fff; }
  .header h2 { margin: 0; font-size: 20px; }
  .header p { margin: 5px 0 0; font-size: 12px; opacity: 0.9; }
  .time-coin { background: rgba(255,255,255,0.3); padding: 10px; border-radius: 12px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; }
  .time-coin .num { font-size: 24px; font-weight: bold; }
  .content { padding: 15px; }
  .section-title { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 10px; display: flex; justify-content: space-between; }
  .section-title span { font-size: 12px; color: #999; font-weight: normal; }
  .task-card { background: #f8f9fa; border-radius: 12px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #ff9a9e; }
  .task-card h4 { margin: 0 0 5px; font-size: 14px; color: #333; }
  .task-card p { margin: 0; font-size: 12px; color: #666; }
  .task-card .meta { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: #999; }
  .btn-accept { background: #ff9a9e; color: #fff; border: none; padding: 4px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; }
  .bottom-nav { position: absolute; bottom: 0; width: 100%; height: 60px; background: #fff; border-top: 1px solid #eee; display: flex; justify-content: space-around; align-items: center; }
  .nav-item { text-align: center; font-size: 10px; color: #999; }
  .nav-item.active { color: #ff9a9e; }
  .nav-item .icon { font-size: 20px; display: block; margin-bottom: 2px; }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar">邻里微光</div>
    <div class="header">
      <h2>📍 阳光苑社区</h2>
      <p>让每一次互助，都成为社区微光</p>
      <div class="time-coin">
        <div>我的时间币 <br><small>帮助他人可获得</small></div>
        <div class="num">125 <small>分钟</small></div>
      </div>
    </div>
    <div class="content">
      <div class="section-title">附近求助 <span>查看全部 ></span></div>
      <div class="task-card">
        <h4>📦 帮忙代取重物快递</h4>
        <p>3栋2单元 王阿姨 | 约20斤</p>
        <div class="meta">
          <span>距离 150m · 悬赏 15时间币</span>
          <button class="btn-accept">接单</button>
        </div>
      </div>
      <div class="task-card">
        <h4>📱 请教智能手机修图</h4>
        <p>5栋1单元 李大爷 | 想发朋友圈</p>
        <div class="meta">
          <span>距离 300m · 悬赏 20时间币</span>
          <button class="btn-accept">接单</button>
        </div>
      </div>
    </div>
    <div class="bottom-nav">
      <div class="nav-item active"><span class="icon">🏠</span>首页</div>
      <div class="nav-item"><span class="icon">➕</span>发布</div>
      <div class="nav-item"><span class="icon">💬</span>消息</div>
      <div class="nav-item"><span class="icon">👤</span>我的</div>
    </div>
  </div>
</body>
</html>
