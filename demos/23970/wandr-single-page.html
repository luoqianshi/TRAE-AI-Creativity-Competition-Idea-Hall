<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漫旅 Wandr - AI 旅游路线生成器</title>
  <style>
    :root {
      --parchment: #F5F0E6;
      --ink: #2C2416;
      --ember: #C45C26;
      --sand: #D4B896;
      --espresso: #3D2B1F;
      --espresso-light: #8B7355;
      --card: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
      background: linear-gradient(135deg, var(--parchment) 0%, #EDE5D8 100%);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23D4B896' fill-opacity='0.06'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
      z-index: -1;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    header {
      text-align: center;
      padding: 40px 20px;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 10px;
      letter-spacing: 0.05em;
    }

    header p {
      color: var(--espresso-light);
      font-size: 1.1rem;
    }

    .badge {
      display: inline-block;
      background: var(--ember);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }

    /* Card */
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(44, 36, 22, 0.08);
      border: 1px solid rgba(212, 184, 150, 0.3);
    }

    .card h2 {
      font-size: 1.3rem;
      color: var(--ink);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--sand);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card h2::before {
      content: '';
      width: 4px;
      height: 20px;
      background: var(--ember);
      border-radius: 2px;
    }

    /* Form Elements */
    label {
      display: block;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    select, input[type="number"], textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--sand);
      border-radius: 10px;
      font-size: 1rem;
      background: var(--parchment);
      color: var(--ink);
      transition: border-color 0.3s ease;
    }

    select:focus, input[type="number"]:focus, textarea:focus {
      outline: none;
      border-color: var(--ember);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
      font-family: inherit;
    }

    /* Preference Tags */
    .preference-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .pref-tag {
      padding: 12px 16px;
      border-radius: 10px;
      border: 2px solid var(--sand);
      background: var(--parchment);
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .pref-tag:hover {
      border-color: var(--ember);
    }

    .pref-tag.selected {
      background: var(--ember);
      border-color: var(--ember);
      color: white;
    }

    .pref-tag .emoji {
      font-size: 1.2rem;
      display: block;
      margin-bottom: 4px;
    }

    .pref-tag .label {
      font-size: 0.9rem;
    }

    /* Pace Selector */
    .pace-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .pace-option {
      padding: 16px;
      border-radius: 10px;
      border: 2px solid var(--sand);
      background: var(--parchment);
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .pace-option:hover {
      border-color: var(--ember);
    }

    .pace-option.selected {
      background: var(--ink);
      border-color: var(--ink);
      color: white;
    }

    .pace-option .label {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .pace-option .hint {
      font-size: 0.85rem;
      opacity: 0.8;
    }

    /* Station Selector */
    .station-selector {
      position: relative;
    }

    .station-search {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--sand);
      border-radius: 10px;
      font-size: 1rem;
      background: var(--parchment);
      color: var(--ink);
      margin-bottom: 12px;
    }

    .station-search:focus {
      outline: none;
      border-color: var(--ember);
    }

    .station-groups {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid var(--sand);
      border-radius: 10px;
    }

    .station-group {
      padding: 8px 12px;
      border-bottom: 1px solid var(--sand);
    }

    .station-group:last-child {
      border-bottom: none;
    }

    .station-group-header {
      font-size: 0.85rem;
      color: var(--ember);
      font-weight: 600;
      margin-bottom: 6px;
      padding: 4px 0;
    }

    .station-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.2s ease;
    }

    .station-item:hover {
      background: var(--parchment);
    }

    .station-item.selected {
      background: var(--ember);
      color: white;
    }

    .station-name {
      flex: 1;
    }

    .station-line {
      font-size: 0.75rem;
      opacity: 0.7;
    }

    .station-hub {
      font-size: 0.75rem;
      background: var(--sand);
      color: var(--ink);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
    }

    .station-item.selected .station-hub {
      background: rgba(255,255,255,0.3);
      color: white;
    }

    /* Analysis Result */
    .analysis-result {
      background: rgba(196, 92, 38, 0.08);
      border: 1px solid rgba(196, 92, 38, 0.3);
      border-radius: 10px;
      padding: 16px;
      margin-top: 12px;
    }

    .analysis-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: var(--ember);
      font-weight: 600;
    }

    .analysis-focus {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .analysis-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .analysis-tag {
      padding: 4px 12px;
      background: rgba(212, 184, 150, 0.5);
      border-radius: 20px;
      font-size: 0.85rem;
    }

    .analysis-mustvisit {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .analysis-mustvisit-tag {
      padding: 4px 12px;
      background: rgba(196, 92, 38, 0.2);
      color: var(--ember);
      border: 1px solid rgba(196, 92, 38, 0.3);
      border-radius: 20px;
      font-size: 0.85rem;
    }

    /* Button */
    .btn-primary {
      width: 100%;
      padding: 16px 32px;
      background: linear-gradient(135deg, var(--ember), #E07B3A);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 20px rgba(196, 92, 38, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(196, 92, 38, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Itinerary Result */
    #result-section {
      display: none;
    }

    #result-section.active {
      display: block;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .result-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--ink);
    }

    .btn-back {
      padding: 10px 20px;
      background: var(--parchment);
      border: 2px solid var(--sand);
      border-radius: 8px;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-back:hover {
      border-color: var(--ember);
    }

    .overview-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .overview-card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(44, 36, 22, 0.06);
    }

    .overview-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--ember);
      margin-bottom: 4px;
    }

    .overview-label {
      font-size: 0.9rem;
      color: var(--espresso-light);
    }

    /* Day Timeline */
    .day-timeline {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(44, 36, 22, 0.08);
    }

    .day-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--sand);
    }

    .day-badge {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--ember), #E07B3A);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .day-title {
      flex: 1;
    }

    .day-title h3 {
      font-size: 1.3rem;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .day-title p {
      font-size: 0.9rem;
      color: var(--espresso-light);
    }

    /* Timeline Items */
    .timeline-items {
      position: relative;
    }

    .timeline-items::before {
      content: '';
      position: absolute;
      left: 19px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--sand);
    }

    .timeline-item {
      display: flex;
      gap: 20px;
      padding: 16px 0;
      position: relative;
    }

    .timeline-item:first-child {
      padding-top: 0;
    }

    .timeline-time {
      width: 70px;
      font-weight: 600;
      color: var(--ember);
      flex-shrink: 0;
    }

    .timeline-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
      z-index: 1;
      background: var(--parchment);
      border: 2px solid var(--sand);
    }

    .timeline-item.meal .timeline-icon {
      background: #FFF8E7;
      border-color: #FFB74D;
    }

    .timeline-item.transport .timeline-icon {
      background: #E3F2FD;
      border-color: #64B5F6;
    }

    .timeline-item.attraction .timeline-icon {
      background: #E8F5E9;
      border-color: #66BB6A;
    }

    .timeline-content {
      flex: 1;
      background: var(--parchment);
      border-radius: 10px;
      padding: 16px;
      border: 1px solid var(--sand);
    }

    .timeline-title {
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 4px;
      font-size: 1rem;
    }

    .timeline-subtitle {
      font-size: 0.9rem;
      color: var(--espresso-light);
      margin-bottom: 8px;
    }

    .timeline-desc {
      font-size: 0.85rem;
      color: var(--espresso);
      line-height: 1.5;
    }

    .timeline-meta {
      display: flex;
      gap: 16px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--espresso-light);
    }

    /* Responsive */
    @media (max-width: 768px) {
      header h1 {
        font-size: 1.8rem;
      }

      .overview-cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .preference-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .timeline-time {
        width: 50px;
        font-size: 0.9rem;
      }
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      display: none;
    }

    .loading.active {
      display: block;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--sand);
      border-top-color: var(--ember);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="badge">学习工作赛道</div>
      <h1>漫旅 Wandr</h1>
      <p>AI 驱动的个性化旅游路线生成器</p>
    </header>

    <!-- Main Form -->
    <section id="form-section">
      <!-- City Selector -->
      <div class="card">
        <h2>选择城市</h2>
        <label for="city-select">目的地城市</label>
        <select id="city-select">
          <option value="guangzhou">广州</option>
          <option value="shenzhen">深圳</option>
          <option value="foshan">佛山</option>
          <option value="zhuhai">珠海</option>
          <option value="shunde">顺德</option>
          <option value="chaozhou">潮州</option>
          <option value="zhaoqing">肇庆</option>
          <option value="chengdu">成都</option>
          <option value="hangzhou">杭州</option>
          <option value="shanghai">上海</option>
          <option value="chongqing">重庆</option>
        </select>
      </div>

      <!-- Days Selector -->
      <div class="card">
        <h2>旅行天数</h2>
        <label for="days-input">计划游玩天数</label>
        <input type="number" id="days-input" min="1" max="7" value="3">
      </div>

      <!-- Preferences Grid -->
      <div class="card">
        <h2>兴趣偏好</h2>
        <div class="preference-grid">
          <div class="pref-tag" data-tag="nature">
            <span class="emoji">🌲</span>
            <span class="label">自然</span>
          </div>
          <div class="pref-tag" data-tag="culture">
            <span class="emoji">🏛️</span>
            <span class="label">人文</span>
          </div>
          <div class="pref-tag" data-tag="food">
            <span class="emoji">🍜</span>
            <span class="label">美食</span>
          </div>
          <div class="pref-tag" data-tag="nightlife">
            <span class="emoji">🌃</span>
            <span class="label">夜景</span>
          </div>
          <div class="pref-tag" data-tag="hidden">
            <span class="emoji">🗝️</span>
            <span class="label">小众</span>
          </div>
          <div class="pref-tag" data-tag="family">
            <span class="emoji">🎈</span>
            <span class="label">亲子</span>
          </div>
          <div class="pref-tag" data-tag="outdoor">
            <span class="emoji">🥾</span>
            <span class="label">户外</span>
          </div>
        </div>
      </div>

      <!-- Free Text Input -->
      <div class="card">
        <h2>自由描述偏好</h2>
        <label for="free-text-input">描述你的旅行期望（选填）</label>
        <textarea id="free-text-input" placeholder="例如：我想去广州逛商场购物，也想看看小蛮腰和珠江夜景，顺便吃吃早茶..."></textarea>
        <div id="text-analysis"></div>
      </div>

      <!-- Start Station -->
      <div class="card">
        <h2>出发地铁站（选填）</h2>
        <div class="station-selector">
          <input type="text" id="station-search" class="station-search" placeholder="搜索地铁站...">
          <div id="station-list" class="station-groups"></div>
        </div>
        <div id="selected-station" style="margin-top: 12px; font-size: 0.9rem; color: var(--espresso-light);"></div>
      </div>

      <!-- Pace Selector -->
      <div class="card">
        <h2>旅行节奏</h2>
        <div class="pace-options">
          <div class="pace-option" data-pace="compact">
            <div class="label">紧凑</div>
            <div class="hint">每天 5 个景点</div>
          </div>
          <div class="pace-option selected" data-pace="moderate">
            <div class="label">适中</div>
            <div class="hint">每天 4 个景点</div>
          </div>
          <div class="pace-option" data-pace="relaxed">
            <div class="label">慵懒</div>
            <div class="hint">每天 3 个景点</div>
          </div>
        </div>
      </div>

      <!-- Generate Button -->
      <button id="generate-btn" class="btn-primary">
        <span>✨</span> 生成我的路线
      </button>

      <div id="loading" class="loading">
        <div class="loading-spinner"></div>
        <p>AI 正在为您规划行程...</p>
      </div>
    </section>

    <!-- Result Section -->
    <section id="result-section">
      <div class="result-header">
        <div class="result-title">我的旅行手账</div>
        <button id="back-btn" class="btn-back">← 返回修改</button>
      </div>

      <!-- Overview -->
      <div class="overview-cards">
        <div class="overview-card">
          <div class="overview-value" id="overview-attractions">0</div>
          <div class="overview-label">总景点</div>
        </div>
        <div class="overview-card">
          <div class="overview-value" id="overview-distance">0</div>
          <div class="overview-label">步行 km</div>
        </div>
        <div class="overview-card">
          <div class="overview-value" id="overview-meals">0</div>
          <div class="overview-label">餐食安排</div>
        </div>
        <div class="overview-card">
          <div class="overview-value" id="overview-budget">0</div>
          <div class="overview-label">估算花费</div>
        </div>
      </div>

      <!-- Days Plan -->
      <div id="days-plan"></div>
    </section>
  </div>

  <script>
    // ==================== 数据 ====================
    const METRO_STATIONS = {

        { id: 'gz-1-06', name: '长寿路', line: '1号线', area: '荔湾区' },
        { id: 'gz-1-07', name: '陈家祠', line: '1号线/8号线', area: '荔湾区', isHub: true },
        { id: 'gz-1-08', name: '西门口', line: '1号线', area: '越秀区' },
        { id: 'gz-1-09', name: '公园前', line: '1号线/2号线', area: '越秀区', isHub: true },
        { id: 'gz-1-10', name: '农讲所', line: '1号线', area: '越秀区' },
        { id: 'gz-1-11', name: '烈士陵园', line: '1号线', area: '越秀区' },
        { id: 'gz-1-12', name: '东山口', line: '1号线/6号线/10号线', area: '越秀区', isHub: true },
        { id: 'gz-1-13', name: '杨箕', line: '1号线/5号线', area: '越秀区', isHub: true },
        { id: 'gz-1-14', name: '体育西路', line: '1号线/3号线/10号线', area: '天河区', isHub: true },
        { id: 'gz-1-15', name: '体育中心', line: '1号线/APM线', area: '天河区', isHub: true },
        { id: 'gz-1-16', name: '广州东站', line: '1号线/3号线/11号线', area: '天河区', isHub: true },

    // ==================== 文本解析 ====================
    function parseFreeTextPreference(text) {
      const normalized = text.toLowerCase().trim();
      const result = {
        focus: 'all',
        tags: [],
        keywords: [],
        mustVisitAttractions: [],
        originalText: text
      };

      // 识别景点
      const attractions = [
        { name: '广东省博物馆', keywords: ['省博物馆', '博物馆'] },
        { name: '广州图书馆', keywords: ['图书馆'] },
        { name: '广州塔', keywords: ['广州塔', '小蛮腰'] },
        { name: '陈家祠', keywords: ['陈家祠'] },
        { name: '白云山', keywords: ['白云山'] },
        { name: '沙面', keywords: ['沙面'] },
        { name: '北京路', keywords: ['北京路'] },
        { name: '上下九', keywords: ['上下九'] },
        { name: '天河城', keywords: ['天河城'] },
        { name: '正佳', keywords: ['正佳'] },
      ];

      for (const attr of attractions) {
        if (attr.keywords.some(k => normalized.includes(k))) {
          result.mustVisitAttractions.push(attr.name);
        }
      }

      // 识别购物偏好
      const shoppingWords = ['购物', '商场', '逛街', '天河城', '正佳', '太古汇', '天环'];
      const isShopping = shoppingWords.some(w => normalized.includes(w));

      // 识别美食偏好
      const foodWords = ['美食', '吃', '早茶', '点心', '粤菜'];
      const isFood = foodWords.some(w => normalized.includes(w));

      // 识别景点偏好
      const attractionWords = ['景点', '参观', '博物馆', '图书馆', '公园'];
      const isAttraction = attractionWords.some(w => normalized.includes(w));

      // 设置专注类型
      if (isShopping && !isAttraction && !isFood) result.focus = 'shopping';
      else if (isFood && !isAttraction && !isShopping) result.focus = 'food';
      else if (isAttraction && !isShopping && !isFood) result.focus = 'attractions';
      else result.focus = 'mixed';

      // 设置标签
      if (isFood) result.tags.push('food');
      if (isAttraction || result.mustVisitAttractions.length > 0) result.tags.push('culture');
      if (isShopping) result.tags.push('culture');

      return result;
    }

    function getFocusLabel(focus) {
      const labels = {
        shopping: { label: '购物优先', emoji: '🛍️' },
        food: { label: '美食之旅', emoji: '🍜' },
        attractions: { label: '景点打卡', emoji: '📸' },
        mixed: { label: '多元体验', emoji: '✨' },
        all: { label: '均衡探索', emoji: '🌟' }
      };
      return labels[focus] || labels.all;
    }

    function getTagLabel(tag) {
      const labels = {
        nature: '🌲 自然',
        culture: '🏛️ 人文',
        food: '🍜 美食',
        nightlife: '🌃 夜景',
        hidden: '🗝️ 小众',
        family: '🎈 亲子',
        outdoor: '🥾 户外'
      };
      return labels[tag] || tag;
    }

    // ==================== 行程生成 ====================
    function generateItinerary() {
      const formSection = document.getElementById('form-section');
      const resultSection = document.getElementById('result-section');
      const loading = document.getElementById('loading');

      // 显示加载状态
      formSection.style.display = 'none';
      loading.classList.add('active');

      // 模拟 AI 处理时间
      setTimeout(() => {
        const city = CITIES[selectedCity];
        if (!city) return;

        // 解析自由文本
        const parsedFreeText = freeTextPreference ? parseFreeTextPreference(freeTextPreference) : null;
        const mustVisitNames = parsedFreeText?.mustVisitAttractions || [];

        // 获取必去景点对象
        const mustVisitAttractions = mustVisitNames.map(name => 
          city.attractions.find(a => a.name.includes(name) || name.includes(a.name.split('（')[0]))
        ).filter(Boolean);

        // 合并偏好
        const mergedPrefs = [...new Set([...selectedPreferences, ...(parsedFreeText?.tags || [])])];

        // 生成行程
        const itinerary = buildItinerary(city, selectedDays, mergedPrefs, selectedPace, mustVisitAttractions);

        // 显示结果
        displayResult(itinerary);

        loading.classList.remove('active');
        resultSection.classList.add('active');
      }, 1500);
    }

    function buildItinerary(city, days, preferences, pace, mustVisitAttractions) {
      const quota = { compact: 5, moderate: 4, relaxed: 3 }[pace];
      const used = new Set();
      const daysPlan = [];
      const allAttractions = [...city.attractions];

      // 打乱景点顺序
      allAttractions.sort(() => Math.random() - 0.5);

      // 优先标记必去景点
      mustVisitAttractions.forEach(a => used.add(a.id));

      const DAY_THEMES = [
        '抵达与初见',
        '深入街巷',
        '自然与远方',
        '隐藏的角落',
        '味觉地图',
        '收束与回望',
        '远足与告别'
      ];

      for (let d = 1; d <= days; d++) {
        // 获取当天必去景点
        const dayMustVisit = mustVisitAttractions.slice((d-1) * 2, d * 2);
        
        // 计算还需要的景点数量
        const needed = quota - dayMustVisit.length;
        
        // 选择额外景点
        const extraAttractions = allAttractions
          .filter(a => !used.has(a.id))
          .slice(0, needed);
        
        extraAttractions.forEach(a => used.add(a.id));
        
        const dayAttractions = [...dayMustVisit, ...extraAttractions];
        
        // 构建当天行程
        const segments = buildDaySegments(city, d, dayAttractions);
        
        daysPlan.push({
          dayIndex: d,
          theme: DAY_THEMES[(d-1) % DAY_THEMES.length],
          segments
        });
      }

      return {
        cityName: city.name,
        days,
        pace,
        preferences,
        daysPlan,
        overview: calculateOverview(daysPlan)
      };
    }

    function buildDaySegments(city, dayIndex, attractions) {
      const segments = [];
      let cursor = '09:00';

      // 早餐
      const breakfast = city.meals.find(m => m.mealType === 'breakfast');
      segments.push({
        id: `d${dayIndex}-breakfast`,
        kind: 'meal',
        startTime: cursor,
        durationMin: 45,
        title: breakfast.name,
        subtitle: breakfast.cuisine,
        description: `${breakfast.area} · 人均 ¥${breakfast.pricePerPersonCNY}`,
        emoji: breakfast.emoji
      });
      cursor = addMinutes(cursor, 45);

      // 景点行程
      for (let i = 0; i < attractions.length; i++) {
        const attr = attractions[i];
        
        // 交通
        if (i > 0) {
          const prevArea = attractions[i-1].area;
          const transport = city.transportSegments.find(t => t.from === prevArea && t.to === attr.area);
          
          if (transport) {
            segments.push({
              id: `d${dayIndex}-t${i}`,
              kind: 'transport',
              startTime: cursor,
              durationMin: transport.durationMin,
              title: `${transport.mode === 'walk' ? '步行' : '地铁'} · ${transport.from} → ${transport.to}`,
              subtitle: transport.line ? `${transport.line} · ${transport.direction}` : `约 ${transport.durationMin} 分钟`,
              emoji: transport.mode === 'walk' ? '🚶' : '🚇'
            });
            cursor = addMinutes(cursor, transport.durationMin);
          }
        }

        // 景点
        segments.push({
          id: `d${dayIndex}-a${i}`,
          kind: 'attraction',
          startTime: cursor,
          durationMin: attr.durationMin,
          title: attr.name,
          subtitle: `${attr.area} · 停留 ${attr.durationMin} 分钟`,
          description: attr.blurb,
          emoji: getAttrEmoji(attr.tags)
        });
        cursor = addMinutes(cursor, attr.durationMin);

        // 午餐（第一个景点后）
        if (i === 0) {
          const lunch = city.meals.find(m => m.mealType === 'lunch');
          segments.push({
            id: `d${dayIndex}-lunch`,
            kind: 'meal',
            startTime: cursor,
            durationMin: 60,
            title: lunch.name,
            subtitle: lunch.cuisine,
            description: `${lunch.area} · 人均 ¥${lunch.pricePerPersonCNY}`,
            emoji: lunch.emoji
          });
          cursor = addMinutes(cursor, 60);
        }
      }

      // 晚餐
      if (cursor > '18:30') {
        const dinner = city.meals.find(m => m.mealType === 'dinner');
        segments.push({
          id: `d${dayIndex}-dinner`,
          kind: 'meal',
          startTime: '19:00',
          durationMin: 90,
          title: dinner.name,
          subtitle: dinner.cuisine,
          description: `${dinner.area} · 人均 ¥${dinner.pricePerPersonCNY}`,
          emoji: dinner.emoji
        });
      }

      return segments;
    }

    function addMinutes(time, mins) {
      const [h, m] = time.split(':').map(Number);
      const total = h * 60 + m + mins;
      const nh = Math.floor((total / 60) % 24);
      const nm = total % 60;
      return `${String(nh).padStart(2, '0')}:${String(nm).padStart(2, '0')}`;
    }

    function getAttrEmoji(tags) {
      if (tags.includes('nature')) return '🌲';
      if (tags.includes('culture')) return '🏛️';
      if (tags.includes('food')) return '🍜';
      if (tags.includes('nightlife')) return '🌃';
      return '📍';
    }

    function calculateOverview(daysPlan) {
      let attractions = 0;
      let meals = 0;
      let budget = 0;

      daysPlan.forEach(day => {
        day.segments.forEach(seg => {
          if (seg.kind === 'attraction') attractions++;
          if (seg.kind === 'meal') {
            meals++;
            const match = seg.description?.match(/¥(\d+)/);
            if (match) budget += parseInt(match[1]);
          }
        });
      });

      return {
        totalAttractions: attractions,
        totalMeals: meals,
        estimatedBudget: [budget, Math.round(budget * 1.5)],
        totalDistance: Math.round(attractions * 1.2 * 10) / 10
      };
    }

    // ==================== 结果展示 ====================
    function displayResult(itinerary) {
      // 更新概览
      document.getElementById('overview-attractions').textContent = itinerary.overview.totalAttractions;
      document.getElementById('overview-distance').textContent = itinerary.overview.totalDistance + ' km';
      document.getElementById('overview-meals').textContent = itinerary.overview.totalMeals;
      document.getElementById('overview-budget').textContent = `¥${itinerary.overview.estimatedBudget[0]}-${itinerary.overview.estimatedBudget[1]}`;

      // 更新行程
      const daysHtml = itinerary.daysPlan.map(day => `
        <div class="day-timeline">
          <div class="day-header">
            <div class="day-badge">${day.dayIndex}</div>
            <div class="day-title">
              <h3>Day ${day.dayIndex} · ${day.theme}</h3>
              <p>${itinerary.pace === 'compact' ? '紧凑' : itinerary.pace === 'relaxed' ? '慵懒' : '适中'}节奏</p>
            </div>
          </div>
          <div class="timeline-items">
            ${day.segments.map(seg => `
              <div class="timeline-item ${seg.kind}">
                <div class="timeline-time">${seg.startTime}</div>
                <div class="timeline-icon">${seg.emoji}</div>
                <div class="timeline-content">
                  <div class="timeline-title">${seg.title}</div>
                  <div class="timeline-subtitle">${seg.subtitle}</div>
                  ${seg.description ? `<div class="timeline-desc">${seg.description}</div>` : ''}
                  <div class="timeline-meta">
                    <span>⏱️ ${seg.durationMin}分钟</span>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');

      document.getElementById('days-plan').innerHTML = daysHtml;
    }
  </script>
