<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智学星 - 小学生趣味复习评测App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'PingFang SC', Arial, sans-serif; background-color: #f0f9ff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 360px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; text-align: center; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .score-board { background: #ffeb3b; padding: 5px 15px; border-radius: 20px; font-weight: bold; color: #d32f2f; font-size: 16px; }
        .question-box { background: #e3f2fd; padding: 20px; border-radius: 15px; margin-bottom: 20px; font-size: 18px; color: #1565c0; font-weight: bold; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .option-btn { padding: 15px; border: 2px solid #bbdefb; border-radius: 10px; background: white; cursor: pointer; font-size: 16px; transition: all 0.3s; }
        .option-btn:hover { background: #e3f2fd; }
        .reward-popup { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,0.95); padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); animation: popIn 0.5s ease; }
        .reward-popup h2 { color: #ff9800; margin-bottom: 10px; }
        @keyframes popIn { from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div class="app-container" style="position: relative;">
        <div class="header">
            <h2>🚀 智学星</h2>
            <div class="score-board">⭐ 积分: <span id="score">0</span></div>
        </div>
        <div class="question-box" id="question">1. 3 × 4 = ?</div>
        <div class="options" id="options-container">
            <button class="option-btn" onclick="checkAnswer(this, false)">10</button>
            <button class="option-btn" onclick="checkAnswer(this, true)">12</button>
            <button class="option-btn" onclick="checkAnswer(this, false)">14</button>
            <button class="option-btn" onclick="checkAnswer(this, false)">11</button>
        </div>
        <div class="reward-popup" id="reward-popup">
            <h2>🎉 回答正确！</h2>
            <p>获得 <b>+10</b> 积分奖励</p>
        </div>
    </div>

    <script>
        let score = 0;
        const scoreEl = document.getElementById('score');
        const popup = document.getElementById('reward-popup');

        function checkAnswer(btn, isCorrect) {
            if (isCorrect) {
                score += 10;
                scoreEl.innerText = score;
                popup.style.display = 'block';
                btn.style.background = '#c8e6c9';
                btn.style.borderColor = '#4caf50';
                setTimeout(() => { popup.style.display = 'none'; }, 1500);
            } else {
                btn.style.background = '#ffcdd2';
                btn.style.borderColor = '#f44336';
                setTimeout(() => { btn.style.background = 'white'; btn.style.borderColor = '#bbdefb'; }, 800);
            }
        }
    </script>
</body>
</html>
