<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星际守护者 - Star Guardian</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0c0c1e 0%, #1a1a3e 50%, #0c0c1e 100%);
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.3), 0 0 80px rgba(138, 43, 226, 0.2);
            border: 2px solid rgba(0, 255, 255, 0.5);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            z-index: 10;
        }

        .hud-right {
            left: auto;
            right: 20px;
            text-align: right;
        }

        .hp-bar {
            width: 200px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 255, 0.5);
        }

        .hp-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4444, #ff8800);
            transition: width 0.3s ease;
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 20;
        }

        h1 {
            font-size: 48px;
            color: #00ffff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 40px rgba(138, 43, 226, 0.6);
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        h2 {
            font-size: 32px;
            color: #ff6600;
            text-shadow: 0 0 15px rgba(255, 102, 0, 0.8);
            margin-bottom: 10px;
        }

        p {
            color: #cccccc;
            font-size: 16px;
            margin-bottom: 30px;
            text-align: center;
            max-width: 500px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, #00ffff, #8a2be2);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.8), 0 0 50px rgba(138, 43, 226, 0.5);
        }

        .instructions {
            margin-top: 30px;
            color: #888888;
            font-size: 14px;
            text-align: center;
        }

        .weapon-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffff00;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.8);
            z-index: 10;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .blink {
            animation: blink 0.5s infinite;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div class="hud">
                <div>分数: <span id="score">0</span></div>
                <div>波次: <span id="wave">1</span></div>
                <div class="hp-bar">
                    <div id="hp-fill" class="hp-fill" style="width: 100%"></div>
                </div>
            </div>
            <div class="hud hud-right">
                <div>击杀: <span id="kills">0</span></div>
                <div>武器: <span id="weapon">普通</span></div>
            </div>
            <div class="weapon-indicator" id="weapon-indicator">按 SPACE 发射 | 按 W/E 切换武器</div>
        </div>

        <div id="start-screen">
            <h1>星际守护者</h1>
            <h1 style="font-size: 24px; color: #8a2be2; margin-top: -10px;">Star Guardian</h1>
            <p>在浩瀚的星际空间中，外星入侵者正在逼近！<br>驾驶你的飞船，抵御敌人的进攻，守护宇宙的和平！</p>
            <button class="btn" onclick="startGame()">开始游戏</button>
            <div class="instructions">
                <p>操作说明：<br>← → 或 A D 移动飞船<br>SPACE 发射子弹<br>W / E 切换武器</p>
            </div>
        </div>

        <div id="game-over-screen" style="display: none;">
            <h2>游戏结束</h2>
            <p>最终得分: <span style="color: #00ffff; font-size: 32px;" id="final-score">0</span></p>
            <p>击杀敌人: <span style="color: #ff6600; font-size: 20px;" id="final-kills">0</span></p>
            <button class="btn" onclick="restartGame()">重新开始</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = 800;
        canvas.height = 600;

        let gameRunning = false;
        let score = 0;
        let wave = 1;
        let kills = 0;
        let playerHP = 100;
        let currentWeapon = 0;
        
        const weapons = [
            { name: '普通', damage: 10, speed: 15, color: '#00ffff', type: 'single' },
            { name: '双发', damage: 8, speed: 12, color: '#ff6600', type: 'double' },
            { name: '激光', damage: 25, speed: 25, color: '#8a2be2', type: 'laser' },
            { name: '散射', damage: 5, speed: 10, color: '#ffff00', type: 'spread' }
        ];

        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 80,
            width: 50,
            height: 60,
            speed: 8
        };

        let bullets = [];
        let enemies = [];
        let particles = [];
        let stars = [];
        let powerups = [];

        const keys = {};

        function initStars() {
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 2 + 0.5,
                    opacity: Math.random() * 0.5 + 0.5
                });
            }
        }

        function drawStarship(x, y) {
            ctx.save();
            ctx.translate(x + player.width / 2, y + player.height / 2);
            
            ctx.beginPath();
            ctx.moveTo(0, -30);
            ctx.lineTo(-20, 25);
            ctx.lineTo(-8, 20);
            ctx.lineTo(0, 30);
            ctx.lineTo(8, 20);
            ctx.lineTo(20, 25);
            ctx.closePath();
            
            const gradient = ctx.createLinearGradient(0, -30, 0, 30);
            gradient.addColorStop(0, '#00ffff');
            gradient.addColorStop(0.5, '#8a2be2');
            gradient.addColorStop(1, '#1a1a3e');
            ctx.fillStyle = gradient;
            ctx.fill();
            
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(-5, 20);
            ctx.lineTo(0, 40);
            ctx.lineTo(5, 20);
            ctx.closePath();
            ctx.fillStyle = '#ff6600';
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(0, -5, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            
            ctx.restore();
        }

        function drawEnemy(enemy) {
            ctx.save();
            ctx.translate(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
            
            ctx.beginPath();
            ctx.moveTo(0, 20);
            ctx.lineTo(-15, -20);
            ctx.lineTo(-5, -15);
            ctx.lineTo(0, -25);
            ctx.lineTo(5, -15);
            ctx.lineTo(15, -20);
            ctx.closePath();
            
            const gradient = ctx.createLinearGradient(0, 20, 0, -25);
            gradient.addColorStop(0, '#ff0066');
            gradient.addColorStop(0.5, '#ff4444');
            gradient.addColorStop(1, '#8b0000');
            ctx.fillStyle = gradient;
            ctx.fill();
            
            ctx.strokeStyle = '#ff0066';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(-5, -5, 4, 0, Math.PI * 2);
            ctx.arc(5, -5, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            
            if (enemy.type === 'boss') {
                ctx.beginPath();
                ctx.arc(0, 0, 25, 0, Math.PI * 2);
                ctx.strokeStyle = '#ffff00';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(-30, 0);
                ctx.lineTo(30, 0);
                ctx.moveTo(0, -30);
                ctx.lineTo(0, 30);
                ctx.strokeStyle = '#ff0066';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            
            ctx.restore();
        }

        function drawBullet(bullet) {
            ctx.save();
            
            if (bullet.type === 'laser') {
                ctx.beginPath();
                ctx.moveTo(bullet.x, bullet.y);
                ctx.lineTo(bullet.x, bullet.y - 20);
                ctx.strokeStyle = bullet.color;
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.stroke();
                
                ctx.shadowColor = bullet.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.moveTo(bullet.x, bullet.y);
                ctx.lineTo(bullet.x, bullet.y - 20);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = bullet.color;
                ctx.fill();
                
                ctx.shadowColor = bullet.color;
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.restore();
        }

        function createParticle(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    size: Math.random() * 4 + 2,
                    color: color,
                    life: 1
                });
            }
        }

        function spawnEnemy() {
            const type = Math.random();
            let enemy;
            
            if (wave % 5 === 0 && enemies.length === 0) {
                enemy = {
                    x: canvas.width / 2 - 50,
                    y: -100,
                    width: 100,
                    height: 80,
                    speed: 1,
                    hp: 200 + wave * 50,
                    maxHp: 200 + wave * 50,
                    type: 'boss',
                    score: 500,
                    shootTimer: 0
                };
            } else if (type < 0.7) {
                enemy = {
                    x: Math.random() * (canvas.width - 40),
                    y: -40,
                    width: 30,
                    height: 40,
                    speed: 2 + wave * 0.3,
                    hp: 20 + wave * 5,
                    maxHp: 20 + wave * 5,
                    type: 'normal',
                    score: 100
                };
            } else if (type < 0.9) {
                enemy = {
                    x: Math.random() * (canvas.width - 50),
                    y: -50,
                    width: 40,
                    height: 50,
                    speed: 1.5 + wave * 0.2,
                    hp: 50 + wave * 10,
                    maxHp: 50 + wave * 10,
                    type: 'tank',
                    score: 200
                };
            } else {
                enemy = {
                    x: Math.random() * (canvas.width - 30),
                    y: -30,
                    width: 25,
                    height: 30,
                    speed: 4 + wave * 0.5,
                    hp: 10 + wave * 3,
                    maxHp: 10 + wave * 3,
                    type: 'fast',
                    score: 150
                };
            }
            
            enemies.push(enemy);
        }

        function spawnPowerup(x, y) {
            if (Math.random() < 0.3) {
                powerups.push({
                    x: x,
                    y: y,
                    width: 25,
                    height: 25,
                    speed: 2,
                    type: Math.floor(Math.random() * 3)
                });
            }
        }

        function shoot() {
            const weapon = weapons[currentWeapon];
            const centerX = player.x + player.width / 2;
            const topY = player.y;
            
            if (weapon.type === 'single') {
                bullets.push({ x: centerX, y: topY, ...weapon });
            } else if (weapon.type === 'double') {
                bullets.push({ x: centerX - 10, y: topY, ...weapon });
                bullets.push({ x: centerX + 10, y: topY, ...weapon });
            } else if (weapon.type === 'laser') {
                bullets.push({ x: centerX, y: topY, ...weapon });
            } else if (weapon.type === 'spread') {
                for (let i = -2; i <= 2; i++) {
                    bullets.push({ 
                        x: centerX, 
                        y: topY, 
                        ...weapon,
                        vx: i * 2
                    });
                }
            }
        }

        function update() {
            if (!gameRunning) return;

            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });

            if (keys['ArrowLeft'] || keys['KeyA']) {
                player.x = Math.max(0, player.x - player.speed);
            }
            if (keys['ArrowRight'] || keys['KeyD']) {
                player.x = Math.min(canvas.width - player.width, player.x + player.speed);
            }

            bullets.forEach((bullet, index) => {
                bullet.y -= bullet.speed;
                if (bullet.vx) bullet.x += bullet.vx;
                if (bullet.y < -20 || bullet.x < 0 || bullet.x > canvas.width) {
                    bullets.splice(index, 1);
                }
            });

            enemies.forEach((enemy, index) => {
                enemy.y += enemy.speed;
                
                if (enemy.type === 'boss') {
                    enemy.x += Math.sin(enemy.y * 0.02) * 2;
                    enemy.shootTimer++;
                }
                
                if (enemy.y > canvas.height + 50) {
                    enemies.splice(index, 1);
                    playerHP -= 10;
                    updateUI();
                }
            });

            powerups.forEach((powerup, index) => {
                powerup.y += powerup.speed;
                if (powerup.y > canvas.height) {
                    powerups.splice(index, 1);
                }
                
                if (player.x < powerup.x + powerup.width &&
                    player.x + player.width > powerup.x &&
                    player.y < powerup.y + powerup.height &&
                    player.y + player.height > powerup.y) {
                    
                    if (powerup.type === 0) {
                        playerHP = Math.min(100, playerHP + 30);
                    } else if (powerup.type === 1) {
                        currentWeapon = (currentWeapon + 1) % weapons.length;
                    } else {
                        score += 500;
                    }
                    powerups.splice(index, 1);
                    updateUI();
                }
            });

            bullets.forEach((bullet, bIndex) => {
                enemies.forEach((enemy, eIndex) => {
                    if (bullet.x > enemy.x && bullet.x < enemy.x + enemy.width &&
                        bullet.y > enemy.y && bullet.y < enemy.y + enemy.height) {
                        
                        bullets.splice(bIndex, 1);
                        enemy.hp -= bullet.damage;
                        
                        createParticle(bullet.x, bullet.y, '#ffff00');
                        
                        if (enemy.hp <= 0) {
                            createParticle(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, '#ff0066');
                            score += enemy.score;
                            kills++;
                            spawnPowerup(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
                            enemies.splice(eIndex, 1);
                            updateUI();
                        }
                    }
                });
            });

            enemies.forEach((enemy, index) => {
                if (player.x < enemy.x + enemy.width &&
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y) {
                    
                    createParticle(player.x + player.width / 2, player.y + player.height / 2, '#ff0000');
                    playerHP -= 20;
                    enemies.splice(index, 1);
                    updateUI();
                }
            });

            particles.forEach((particle, index) => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.life -= 0.02;
                particle.size *= 0.98;
                
                if (particle.life <= 0) {
                    particles.splice(index, 1);
                }
            });

            if (Math.random() < 0.02 + wave * 0.005) {
                spawnEnemy();
            }

            if (kills > 0 && kills % 10 === 0 && Math.floor(kills / 10) > wave) {
                wave = Math.floor(kills / 10) + 1;
                updateUI();
            }

            if (playerHP <= 0) {
                gameOver();
            }
        }

        function draw() {
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            
            powerups.forEach(powerup => {
                ctx.beginPath();
                ctx.arc(powerup.x + powerup.width / 2, powerup.y + powerup.height / 2, powerup.width / 2, 0, Math.PI * 2);
                
                if (powerup.type === 0) {
                    ctx.fillStyle = '#00ff00';
                } else if (powerup.type === 1) {
                    ctx.fillStyle = '#00ffff';
                } else {
                    ctx.fillStyle = '#ffff00';
                }
                ctx.fill();
                
                ctx.shadowColor = ctx.fillStyle;
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
            });
            
            bullets.forEach(drawBullet);
            enemies.forEach(drawEnemy);
            drawStarship(player.x, player.y);
            
            particles.forEach(particle => {
                ctx.globalAlpha = particle.life;
                ctx.fillStyle = particle.color;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            
            requestAnimationFrame(() => {
                update();
                draw();
            });
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('wave').textContent = wave;
            document.getElementById('kills').textContent = kills;
            document.getElementById('weapon').textContent = weapons[currentWeapon].name;
            document.getElementById('hp-fill').style.width = playerHP + '%';
            
            if (playerHP < 30) {
                document.getElementById('hp-fill').classList.add('blink');
            } else {
                document.getElementById('hp-fill').classList.remove('blink');
            }
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'none';
            
            score = 0;
            wave = 1;
            kills = 0;
            playerHP = 100;
            currentWeapon = 0;
            
            player.x = canvas.width / 2 - 25;
            bullets = [];
            enemies = [];
            particles = [];
            powerups = [];
            
            gameRunning = true;
            updateUI();
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('game-over-screen').style.display = 'flex';
            document.getElementById('final-score').textContent = score;
            document.getElementById('final-kills').textContent = kills;
        }

        function restartGame() {
            startGame();
        }

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            
            if (e.code === 'Space' && gameRunning) {
                e.preventDefault();
                shoot();
            }
            
            if ((e.code === 'KeyW' || e.code === 'KeyE') && gameRunning) {
                e.preventDefault();
                currentWeapon = (currentWeapon + 1) % weapons.length;
                updateUI();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        initStars();
        draw();
    </script>
</body>
</html>
