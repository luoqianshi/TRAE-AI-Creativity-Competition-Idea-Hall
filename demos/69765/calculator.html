<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计算器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 80%, rgba(255, 159, 10, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(102, 126, 234, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(118, 75, 162, 0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .calculator {
      width: 320px;
      background: rgba(28, 28, 30, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 14px;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        0 0 0 0.5px rgba(255, 255, 255, 0.1) inset,
        0 1px 0 rgba(255, 255, 255, 0.1) inset;
      overflow: hidden;
      animation: fadeIn 0.5s ease-out, float 6s ease-in-out infinite;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    .title-bar {
      height: 38px;
      background: linear-gradient(180deg, rgba(60, 60, 60, 0.9) 0%, rgba(45, 45, 45, 0.9) 100%);
      display: flex;
      align-items: center;
      padding: 0 16px;
      position: relative;
      cursor: grab;
      border-bottom: 0.5px solid rgba(0, 0, 0, 0.3);
    }

    .title-bar:active {
      cursor: grabbing;
    }

    .traffic-lights {
      display: flex;
      gap: 8px;
    }

    .light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      position: relative;
      transition: all 0.2s ease;
    }

    .light.red {
      background: linear-gradient(180deg, #ff6058 0%, #e0443e 100%);
      box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.2);
    }

    .light.yellow {
      background: linear-gradient(180deg, #ffbd2e 0%, #dea123 100%);
      box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.2);
    }

    .light.green {
      background: linear-gradient(180deg, #28c940 0%, #1aab29 100%);
      box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.2);
    }

    .light::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 3px;
      width: 6px;
      height: 3px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      filter: blur(1px);
    }

    .traffic-lights:hover .light.red::after {
      content: '×';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 9px;
      color: rgba(0, 0, 0, 0.5);
      font-weight: bold;
    }

    .traffic-lights:hover .light.yellow::after {
      content: '−';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
      font-size: 10px;
      color: rgba(0, 0, 0, 0.5);
      font-weight: bold;
    }

    .traffic-lights:hover .light.green::after {
      content: '+';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      font-size: 9px;
      color: rgba(0, 0, 0, 0.5);
      font-weight: bold;
    }

    .title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .display {
      padding: 24px 20px 16px;
      min-height: 100px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
    }

    .display-value {
      font-size: 64px;
      font-weight: 200;
      color: white;
      line-height: 1;
      letter-spacing: -1px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      max-width: 100%;
      transition: font-size 0.15s ease;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 0 14px 14px;
    }

    .btn {
      height: 62px;
      border: none;
      border-radius: 50%;
      font-size: 28px;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.12s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      font-family: inherit;
    }

    .btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0);
      transition: background 0.12s ease;
      border-radius: inherit;
    }

    .btn:active::after {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn.num {
      background: linear-gradient(180deg, #3a3a3c 0%, #333333 100%);
      color: white;
      box-shadow: 0 0.5px 0 rgba(255, 255, 255, 0.1) inset;
    }

    .btn.num:hover {
      background: linear-gradient(180deg, #4a4a4c 0%, #434343 100%);
    }

    .btn.func {
      background: linear-gradient(180deg, #a5a5a5 0%, #959595 100%);
      color: black;
      font-size: 24px;
      font-weight: 500;
      box-shadow: 0 0.5px 0 rgba(255, 255, 255, 0.3) inset;
    }

    .btn.func:hover {
      background: linear-gradient(180deg, #b5b5b5 0%, #a5a5a5 100%);
    }

    .btn.op {
      background: linear-gradient(180deg, #ff9f0a 0%, #ff8a00 100%);
      color: white;
      font-size: 32px;
      font-weight: 400;
      box-shadow: 0 0.5px 0 rgba(255, 255, 255, 0.2) inset;
    }

    .btn.op:hover {
      background: linear-gradient(180deg, #ffaf2a 0%, #ff9a1a 100%);
    }

    .btn.op.active {
      background: linear-gradient(180deg, white 0%, #f0f0f0 100%);
      color: #ff9f0a;
    }

    .btn.zero {
      grid-column: span 2;
      border-radius: 31px;
      justify-content: flex-start;
      padding-left: 26px;
    }

    @media (max-width: 400px) {
      .calculator {
        width: 280px;
      }
      
      .btn {
        height: 54px;
        font-size: 24px;
      }
      
      .btn.zero {
        border-radius: 27px;
        padding-left: 22px;
      }
      
      .display-value {
        font-size: 52px;
      }
      
      .display {
        padding: 20px 16px 12px;
        min-height: 85px;
      }
    }
  </style>
</head>
<body>
  <div class="calculator" id="calculator">
    <div class="title-bar" id="titleBar">
      <div class="traffic-lights">
        <div class="light red"></div>
        <div class="light yellow"></div>
        <div class="light green"></div>
      </div>
      <div class="title">计算器</div>
    </div>
    
    <div class="display">
      <div class="display-value" id="display">0</div>
    </div>
    
    <div class="buttons">
      <button class="btn func" data-action="clear">AC</button>
      <button class="btn func" data-action="negate">+/−</button>
      <button class="btn func" data-action="percent">%</button>
      <button class="btn op" data-action="divide">÷</button>
      
      <button class="btn num" data-action="digit" data-value="7">7</button>
      <button class="btn num" data-action="digit" data-value="8">8</button>
      <button class="btn num" data-action="digit" data-value="9">9</button>
      <button class="btn op" data-action="multiply">×</button>
      
      <button class="btn num" data-action="digit" data-value="4">4</button>
      <button class="btn num" data-action="digit" data-value="5">5</button>
      <button class="btn num" data-action="digit" data-value="6">6</button>
      <button class="btn op" data-action="subtract">−</button>
      
      <button class="btn num" data-action="digit" data-value="1">1</button>
      <button class="btn num" data-action="digit" data-value="2">2</button>
      <button class="btn num" data-action="digit" data-value="3">3</button>
      <button class="btn op" data-action="add">+</button>
      
      <button class="btn num zero" data-action="digit" data-value="0">0</button>
      <button class="btn num" data-action="decimal">.</button>
      <button class="btn op" data-action="equals">=</button>
    </div>
  </div>
  
  <script>
    class Calculator {
      constructor() {
        this.currentValue = '0';
        this.previousValue = '';
        this.operation = null;
        this.waitingForOperand = false;
        this.displayElement = document.getElementById('display');
        
        this.init();
      }

      init() {
        document.querySelectorAll('.btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const action = e.target.dataset.action;
            const value = e.target.dataset.value;
            
            this.handleButton(action, value, e.target);
          });
        });

        document.addEventListener('keydown', (e) => {
          this.handleKeyboard(e);
        });

        this.makeDraggable();
      }

      handleButton(action, value, btnElement) {
        switch (action) {
          case 'digit':
            this.inputDigit(value);
            break;
          case 'decimal':
            this.inputDecimal();
            break;
          case 'clear':
            this.clear();
            break;
          case 'negate':
            this.negate();
            break;
          case 'percent':
            this.percent();
            break;
          case 'add':
            this.performOperation('+');
            break;
          case 'subtract':
            this.performOperation('-');
            break;
          case 'multiply':
            this.performOperation('×');
            break;
          case 'divide':
            this.performOperation('÷');
            break;
          case 'equals':
            this.calculate();
            break;
        }
        
        this.updateDisplay();
        this.updateOperatorButtons();
      }

      handleKeyboard(e) {
        if (e.key >= '0' && e.key <= '9') {
          this.inputDigit(e.key);
        } else if (e.key === '.') {
          this.inputDecimal();
        } else if (e.key === '+') {
          this.performOperation('+');
        } else if (e.key === '-') {
          this.performOperation('-');
        } else if (e.key === '*') {
          this.performOperation('×');
        } else if (e.key === '/') {
          e.preventDefault();
          this.performOperation('÷');
        } else if (e.key === 'Enter' || e.key === '=') {
          e.preventDefault();
          this.calculate();
        } else if (e.key === 'Escape') {
          this.clear();
        } else if (e.key === 'Backspace') {
          this.backspace();
        } else if (e.key === '%') {
          this.percent();
        }
        
        this.updateDisplay();
        this.updateOperatorButtons();
      }

      inputDigit(digit) {
        if (this.waitingForOperand) {
          this.currentValue = digit;
          this.waitingForOperand = false;
        } else {
          if (this.currentValue === '0') {
            this.currentValue = digit;
          } else {
            if (this.currentValue.replace(/[.-]/g, '').length < 12) {
              this.currentValue += digit;
            }
          }
        }
      }

      inputDecimal() {
        if (this.waitingForOperand) {
          this.currentValue = '0.';
          this.waitingForOperand = false;
          return;
        }
        
        if (!this.currentValue.includes('.')) {
          this.currentValue += '.';
        }
      }

      clear() {
        this.currentValue = '0';
        this.previousValue = '';
        this.operation = null;
        this.waitingForOperand = false;
      }

      negate() {
        if (this.currentValue !== '0') {
          if (this.currentValue.startsWith('-')) {
            this.currentValue = this.currentValue.slice(1);
          } else {
            this.currentValue = '-' + this.currentValue;
          }
        }
      }

      percent() {
        const value = parseFloat(this.currentValue);
        this.currentValue = this.formatNumber(value / 100);
      }

      performOperation(op) {
        const inputValue = parseFloat(this.currentValue);

        if (this.operation && !this.waitingForOperand) {
          this.calculate();
        } else {
          this.previousValue = this.currentValue;
        }

        this.operation = op;
        this.waitingForOperand = true;
      }

      calculate() {
        if (!this.operation || this.waitingForOperand) {
          return;
        }

        const prev = parseFloat(this.previousValue);
        const current = parseFloat(this.currentValue);
        let result;

        switch (this.operation) {
          case '+':
            result = prev + current;
            break;
          case '-':
            result = prev - current;
            break;
          case '×':
            result = prev * current;
            break;
          case '÷':
            if (current === 0) {
              result = 'Error';
            } else {
              result = prev / current;
            }
            break;
        }

        if (result !== 'Error') {
          result = Math.round(result * 10000000000) / 10000000000;
          this.currentValue = this.formatNumber(result);
        } else {
          this.currentValue = 'Error';
        }

        this.previousValue = '';
        this.operation = null;
        this.waitingForOperand = true;
      }

      backspace() {
        if (this.currentValue.length > 1) {
          this.currentValue = this.currentValue.slice(0, -1);
          if (this.currentValue === '-') {
            this.currentValue = '0';
          }
        } else {
          this.currentValue = '0';
        }
      }

      formatNumber(num) {
        if (Number.isInteger(num)) {
          return num.toString();
        }
        return num.toString();
      }

      updateDisplay() {
        let displayValue = this.currentValue;
        
        if (displayValue === 'Error') {
          this.displayElement.textContent = 'Error';
          this.displayElement.style.fontSize = '40px';
          return;
        }

        const num = parseFloat(displayValue);
        const absNum = Math.abs(num);
        
        if (absNum >= 1e12) {
          displayValue = num.toExponential(6);
        } else if (absNum > 0 && absNum < 0.000001) {
          displayValue = num.toExponential(6);
        }

        const parts = displayValue.split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        displayValue = parts.join('.');

        this.displayElement.textContent = displayValue;
        
        const length = displayValue.length;
        if (length > 9) {
          this.displayElement.style.fontSize = '40px';
        } else if (length > 7) {
          this.displayElement.style.fontSize = '48px';
        } else {
          this.displayElement.style.fontSize = '64px';
        }
      }

      updateOperatorButtons() {
        document.querySelectorAll('.btn.op').forEach(btn => {
          btn.classList.remove('active');
        });

        if (this.operation && this.waitingForOperand) {
          const opMap = {
            '+': '[data-action="add"]',
            '-': '[data-action="subtract"]',
            '×': '[data-action="multiply"]',
            '÷': '[data-action="divide"]'
          };
          
          const selector = opMap[this.operation];
          if (selector) {
            const btn = document.querySelector(selector);
            if (btn) {
              btn.classList.add('active');
            }
          }
        }
      }

      makeDraggable() {
        const calculator = document.getElementById('calculator');
        const titleBar = document.getElementById('titleBar');
        
        let isDragging = false;
        let startX, startY, initialX, initialY;

        titleBar.addEventListener('mousedown', (e) => {
          if (e.target.closest('.traffic-lights')) return;
          
          isDragging = true;
          startX = e.clientX;
          startY = e.clientY;
          
          const rect = calculator.getBoundingClientRect();
          initialX = rect.left;
          initialY = rect.top;
          
          calculator.style.position = 'fixed';
          calculator.style.left = initialX + 'px';
          calculator.style.top = initialY + 'px';
          calculator.style.margin = '0';
          calculator.style.animation = 'none';
        });

        document.addEventListener('mousemove', (e) => {
          if (!isDragging) return;
          
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          
          calculator.style.left = (initialX + dx) + 'px';
          calculator.style.top = (initialY + dy) + 'px';
        });

        document.addEventListener('mouseup', () => {
          isDragging = false;
        });
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      new Calculator();
    });
  </script>
</body>
</html>
