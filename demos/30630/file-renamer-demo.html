<body>
  <div class="app">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="logo">&#128194;</div>
        <h1>智能批量文件重命名工具</h1>
      </div>
      <div class="header-actions">
        <button class="btn" onclick="showHelp()">&#10067; 帮助</button>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
        &#128193; 导入文件
      </button>
      <input type="file" id="fileInput" class="file-input" multiple onchange="handleFileSelect(event)">
      <button class="btn" onclick="clearFiles()">&#128465; 清空</button>
      <button class="btn" onclick="selectAll()">&#9989; 全选</button>
      <button class="btn" onclick="deselectAll()">&#9744; 取消全选</button>
      <div style="flex:1"></div>
      <button class="btn btn-success" onclick="applyRename()" id="applyBtn" disabled>
        &#9989; 执行重命名
      </button>
    </div>

    <!-- Main -->
    <div class="main">
      <!-- Left: File List -->
      <div class="panel-left">
        <div class="panel-header">
          <span>&#128196; 文件列表</span>
          <span class="count" id="fileCount">0 个文件</span>
        </div>
        <div class="file-list" id="fileList">
          <div class="empty-state">
            <div class="icon">&#128194;</div>
            <p>点击"导入文件"按钮选择文件</p>
            <p style="font-size:12px;margin-top:8px;">支持多选，可拖拽文件夹</p>
          </div>
        </div>
      </div>

      <!-- Center: Rules -->
      <div class="panel-center">
        <div class="panel-header">
          <span>&#9881; 重命名规则</span>
        </div>
        <div class="rules-container">
          <!-- Rule 1: Find & Replace -->
          <div class="rule-section">
            <div class="rule-header">
              <span>&#128269; 查找替换</span>
              <label class="switch">
                <input type="checkbox" id="rule1Enabled" onchange="updatePreview()">
                <span class="slider"></span>
              </label>
            </div>
            <div class="rule-body">
              <div class="form-group">
                <label class="form-label">查找内容</label>
                <input type="text" class="form-input" id="findText" placeholder="输入要查找的文本" oninput="updatePreview()">
              </div>
              <div class="form-group">
                <label class="form-label">替换为</label>
                <input type="text" class="form-input" id="replaceText" placeholder="输入替换后的文本" oninput="updatePreview()">
              </div>
              <div class="checkbox-group">
                <input type="checkbox" id="caseSensitive" onchange="updatePreview()">
                <label for="caseSensitive">区分大小写</label>
              </div>
            </div>
          </div>

          <!-- Rule 2: Add Prefix/Suffix -->
          <div class="rule-section">
            <div class="rule-header">
              <span>&#10133; 添加前缀/后缀</span>
              <label class="switch">
                <input type="checkbox" id="rule2Enabled" onchange="updatePreview()">
                <span class="slider"></span>
              </label>
            </div>
            <div class="rule-body">
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">前缀</label>
                  <input type="text" class="form-input" id="prefixText" placeholder="添加到开头" oninput="updatePreview()">
                </div>
                <div class="form-group">
                  <label class="form-label">后缀</label>
                  <input type="text" class="form-input" id="suffixText" placeholder="添加到结尾（不含扩展名）" oninput="updatePreview()">
                </div>
              </div>
            </div>
          </div>

          <!-- Rule 3: Numbering -->
          <div class="rule-section">
            <div class="rule-header">
              <span>&#128290; 序号编号</span>
              <label class="switch">
                <input type="checkbox" id="rule3Enabled" onchange="updatePreview()">
                <span class="slider"></span>
              </label>
            </div>
            <div class="rule-body">
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">起始序号</label>
                  <input type="number" class="form-input" id="startNum" value="1" min="0" oninput="updatePreview()">
                </div>
                <div class="form-group">
                  <label class="form-label">位数</label>
                  <input type="number" class="form-input" id="numDigits" value="2" min="1" max="10" oninput="updatePreview()">
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">位置</label>
                <select class="form-select" id="numPosition" onchange="updatePreview()">
                  <option value="prefix">文件名开头</option>
                  <option value="suffix">文件名结尾（扩展名前）</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">分隔符</label>
                <input type="text" class="form-input" id="numSeparator" value="_" placeholder="如 _ 或 -" oninput="updatePreview()">
              </div>
            </div>
          </div>

          <!-- Rule 4: Regex -->
          <div class="rule-section">
            <div class="rule-header">
              <span>&#128295; 正则表达式</span>
              <label class="switch">
                <input type="checkbox" id="rule4Enabled" onchange="updatePreview()">
                <span class="slider"></span>
              </label>
            </div>
            <div class="rule-body">
              <div class="form-group">
                <label class="form-label">匹配模式 (Regex)</label>
                <input type="text" class="form-input" id="regexPattern" placeholder="如: \\s+ 匹配空格" oninput="updatePreview()">

              <div class="form-group">
                <label class="form-label">替换为</label>
                <input type="text" class="form-input" id="regexReplace" placeholder="替换后的文本" oninput="updatePreview()">

              <p style="font-size:11px;color:var(--muted);margin-top:8px;">
                常用正则: \\s+ 空格 | \\d+ 数字 | [^a-zA-Z0-9] 特殊字符
              </p>
            </div>
          </div>

          <!-- Rule 5: Case Conversion -->
          <div class="rule-section">
            <div class="rule-header">
              <span>&#128472; 大小写转换</span>
              <label class="switch">
                <input type="checkbox" id="rule5Enabled" onchange="updatePreview()">
                <span class="slider"></span>
              </label>
            </div>
            <div class="rule-body">
              <div class="form-group">
                <label class="form-label">转换方式</label>
                <select class="form-select" id="caseType" onchange="updatePreview()">
                  <option value="lower">全部小写</option>
                  <option value="upper">全部大写</option>
                  <option value="capitalize">首字母大写</option>
                  <option value="camel">驼峰命名</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right: Preview -->
      <div class="panel-right">
        <div class="panel-header">
          <span>&#128064; 实时预览</span>
          <span class="count" id="changeCount">0 处变更</span>
        </div>
        <div class="preview-container" id="previewList">
          <div class="empty-state">
            <div class="icon">&#128064;</div>
            <p>导入文件后将显示预览</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <div class="stats">
        <div class="stat">
          <span>总文件:</span>
          <span class="stat-value" id="statTotal">0</span>
        </div>
        <div class="stat">
          <span>已选择:</span>
          <span class="stat-value" id="statSelected">0</span>
        </div>
        <div class="stat">
          <span>将变更:</span>
          <span class="stat-value" id="statChanged">0</span>
        </div>
      </div>
      <div>智能批量文件重命名工具 v1.0 | TRAE 创造大赛作品</div>
    </div>
  </div>

  <!-- Result Modal -->

      <div class="modal-header">&#9989; 重命名完成</div>
      <div class="modal-body">
        <p style="margin-bottom:12px;">以下文件已成功重命名：</p>
        <div class="result-list" id="resultList"></div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal()">关闭</button>
        <button class="btn btn-primary" onclick="downloadResult()">&#128229; 下载结果</button>
      </div>
    </div>
  </div>

  <script>
    // State
    let files = [];
    let selectedFiles = new Set();
    let renamedFiles = [];

    // File type icons
    const fileIcons = {
      'image': '&#128444;',
      'video': '&#127909;',
      'audio': '&#127925;',
      'document': '&#128196;',
      'code': '&#128187;',
      'archive': '&#128230;',
      'default': '&#128193;'
    };

    function getFileIcon(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      const imageExts = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg'];
      const videoExts = ['mp4', 'avi', 'mkv', 'mov', 'wmv'];
      const audioExts = ['mp3', 'wav', 'flac', 'aac', 'ogg'];
      const docExts = ['pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'txt'];
      const codeExts = ['js', 'html', 'css', 'py', 'java', 'cpp', 'c', 'go', 'rs', 'ts'];
      const archiveExts = ['zip', 'rar', '7z', 'tar', 'gz'];

      if (imageExts.includes(ext)) return fileIcons.image;
      if (videoExts.includes(ext)) return fileIcons.video;
      if (audioExts.includes(ext)) return fileIcons.audio;
      if (docExts.includes(ext)) return fileIcons.document;
      if (codeExts.includes(ext)) return fileIcons.code;
      if (archiveExts.includes(ext)) return fileIcons.archive;
      return fileIcons.default;
    }

    function formatSize(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function handleFileSelect(event) {
      const newFiles = Array.from(event.target.files);
      newFiles.forEach(file => {
        files.push({
          id: Date.now() + Math.random(),
          originalName: file.name,
          newName: file.name,
          size: file.size,
          type: file.type,
          file: file,
          changed: false
        });
        selectedFiles.add(files[files.length - 1].id);
      });
      updateUI();
      updatePreview();
    }

    function clearFiles() {
      files = [];
      selectedFiles.clear();
      updateUI();
      updatePreview();
    }

    function selectAll() {
      files.forEach(f => selectedFiles.add(f.id));
      updateUI();
      updatePreview();
    }

    function deselectAll() {
      selectedFiles.clear();
      updateUI();
      updatePreview();
    }

    function toggleSelect(id) {
      if (selectedFiles.has(id)) {
        selectedFiles.delete(id);
      } else {
        selectedFiles.add(id);
      }
      updateUI();
      updatePreview();
    }

    function applyRules(filename) {
      let result = filename;
      let name = result;
      let ext = '';

      // Separate extension
      const lastDot = result.lastIndexOf('.');
      if (lastDot > 0) {
        name = result.substring(0, lastDot);
        ext = result.substring(lastDot);
      }

      // Rule 1: Find & Replace
      if (document.getElementById('rule1Enabled').checked) {
        const find = document.getElementById('findText').value;
        const replace = document.getElementById('replaceText').value;
        const caseSens = document.getElementById('caseSensitive').checked;
        if (find) {
          if (caseSens) {
            result = result.split(find).join(replace);
          } else {
            const regex = new RegExp(find.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
            result = result.replace(regex, replace);
          }
          // Recalculate name/ext after replace
          const ld = result.lastIndexOf('.');
          if (ld > 0) {
            name = result.substring(0, ld);
            ext = result.substring(ld);
          } else {
            name = result;
            ext = '';
          }
        }
      }

      // Rule 2: Prefix/Suffix
      if (document.getElementById('rule2Enabled').checked) {
        const prefix = document.getElementById('prefixText').value;
        const suffix = document.getElementById('suffixText').value;
        if (prefix) name = prefix + name;
        if (suffix) name = name + suffix;
        result = name + ext;
      }

      // Rule 3: Numbering
      if (document.getElementById('rule3Enabled').checked) {
        const startNum = parseInt(document.getElementById('startNum').value) || 1;
        const digits = parseInt(document.getElementById('numDigits').value) || 2;
        const position = document.getElementById('numPosition').value;
        const separator = document.getElementById('numSeparator').value || '_';
        const index = files.filter(f => selectedFiles.has(f.id)).indexOf(files.find(f => f.originalName === filename));
        const num = String(startNum + index).padStart(digits, '0');

        // Recalculate name/ext
        const ld = result.lastIndexOf('.');
        if (ld > 0) {
          name = result.substring(0, ld);
          ext = result.substring(ld);
        } else {
          name = result;
          ext = '';
        }

        if (position === 'prefix') {
          name = num + separator + name;
        } else {
          name = name + separator + num;
        }
        result = name + ext;
      }

      // Rule 4: Regex
      if (document.getElementById('rule4Enabled').checked) {
        const pattern = document.getElementById('regexPattern').value;
        const replace = document.getElementById('regexReplace').value;
        if (pattern) {
          try {
            const regex = new RegExp(pattern, 'g');
            result = result.replace(regex, replace);
          } catch (e) {
            // Invalid regex, skip
          }
        }
      }

      // Rule 5: Case Conversion
      if (document.getElementById('rule5Enabled').checked) {
        const caseType = document.getElementById('caseType').value;
        // Recalculate name/ext
        const ld = result.lastIndexOf('.');
        if (ld > 0) {
          name = result.substring(0, ld);
          ext = result.substring(ld);
        } else {
          name = result;
          ext = '';
        }

        switch (caseType) {
          case 'lower':
            name = name.toLowerCase();
            break;
          case 'upper':
            name = name.toUpperCase();
            break;
          case 'capitalize':
            name = name.replace(/\b\w/g, c => c.toUpperCase());
            break;
          case 'camel':
            name = name.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g, (m, c) => c.toUpperCase());
            break;
        }
        result = name + ext;
      }

      return result;
    }

    function updatePreview() {
      const selected = files.filter(f => selectedFiles.has(f.id));
      let changedCount = 0;

      selected.forEach(file => {
        const newName = applyRules(file.originalName);
        file.newName = newName;
        file.changed = newName !== file.originalName;
        if (file.changed) changedCount++;
      });

      // Update preview panel
      const previewList = document.getElementById('previewList');
      if (selected.length === 0) {
        previewList.innerHTML = `
          <div class="empty-state">
            <div class="icon">&#128064;</div>
            <p>选择文件后将显示预览</p>
          </div>
        `;
      } else {
        previewList.innerHTML = selected.map(file => `
          <div class="preview-item">
            <span class="old-name" title="${file.originalName}">${file.originalName}</span>
            <span class="arrow">&#10142;</span>
            <span class="new-name ${file.changed ? '' : 'unchanged'}" title="${file.newName}">${file.newName}</span>
            <span class="status ${file.changed ? '' : 'error'}">${file.changed ? '变更' : '未变'}</span>
          </div>
        `).join('');
      }

      document.getElementById('changeCount').textContent = changedCount + ' 处变更';
      document.getElementById('statChanged').textContent = changedCount;
      document.getElementById('applyBtn').disabled = selected.length === 0 || changedCount === 0;
    }

    function updateUI() {
      const fileList = document.getElementById('fileList');
      document.getElementById('fileCount').textContent = files.length + ' 个文件';
      document.getElementById('statTotal').textContent = files.length;
      document.getElementById('statSelected').textContent = selectedFiles.size;

      if (files.length === 0) {
        fileList.innerHTML = `
          <div class="empty-state">
            <div class="icon">&#128194;</div>
            <p>点击"导入文件"按钮选择文件</p>
            <p style="font-size:12px;margin-top:8px;">支持多选</p>
          </div>
        `;
        return;
      }

      fileList.innerHTML = files.map(file => `
        <div class="file-item ${selectedFiles.has(file.id) ? 'selected' : ''}" onclick="toggleSelect(${file.id})">
          <input type="checkbox" class="file-checkbox" ${selectedFiles.has(file.id) ? 'checked' : ''} onclick="event.stopPropagation()">
          <span class="file-icon">${getFileIcon(file.originalName)}</span>
          <div class="file-info">
            <div class="file-name" title="${file.originalName}">${file.originalName}</div>
            <div class="file-meta">${formatSize(file.size)}</div>
          </div>
        </div>
      `).join('');
    }

    function applyRename() {
      const selected = files.filter(f => selectedFiles.has(f.id) && f.changed);
      renamedFiles = [];

      selected.forEach(file => {
        renamedFiles.push({
          original: file.originalName,
          new: file.newName
        });
        file.originalName = file.newName;
        file.changed = false;
      });

      // Show result modal
      const resultList = document.getElementById('resultList');
      resultList.innerHTML = renamedFiles.map(r => `
        <div class="result-item">
          <span>${r.original}</span>
          <span>&#10142;</span>
          <span class="result-name">${r.new}</span>
        </div>
      `).join('');

      document.getElementById('resultModal').classList.add('active');
      updateUI();
      updatePreview();
    }

    function closeModal() {
      document.getElementById('resultModal').classList.remove('active');
    }

    function downloadResult() {
      const content = renamedFiles.map(r => `${r.original} -> ${r.new}`).join('\n');
      const blob = new Blob([content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'rename-log.txt';
      a.click();
      URL.revokeObjectURL(url);
    }

    function showHelp() {
      alert(`智能批量文件重命名工具 使用说明：

1. 点击"导入文件"选择要重命名的文件（可多选）
2. 在左侧勾选要处理的文件
3. 在中间面板配置重命名规则：
   - 查找替换：将指定文本替换为新文本
   - 添加前缀/后缀：在文件名前后添加内容
   - 序号编号：自动添加递增序号
   - 正则表达式：使用正则匹配替换
   - 大小写转换：统一文件名大小写格式
4. 右侧实时预览重命名结果
5. 点击"执行重命名"完成操作

提示：开启规则开关后才会生效，可同时组合多个规则。`);
    }

    // Initialize
    updateUI();
    updatePreview();
  </script>
</body>
</html>
