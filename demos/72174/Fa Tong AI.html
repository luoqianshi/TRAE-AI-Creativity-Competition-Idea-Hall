出租方（甲方）：张某某
承租方（乙方）：李某某

根据《中华人民共和国民法典》及相关法律法规，甲乙双方在平等、自愿的基础上，就房屋租赁事宜达成如下协议：

第一条 房屋基本情况
甲方将位于XX市XX区XX路XX号XX室的房屋出租给乙方使用。房屋建筑面积约80平方米，房屋用途为居住。

第二条 租赁期限
租赁期限为12个月，自2026年1月1日起至2026年12月31日止。

第三条 租金及支付方式
月租金为人民币3500元，押二付一。乙方应于每季度首月5日前一次性支付当季度全部租金。逾期支付租金的，每逾期一日，乙方应按月租金的5%向甲方支付违约金。

第四条 押金
乙方向甲方交纳押金人民币7000元。租赁期满或合同解除后，甲方有权从押金中扣除乙方应承担的费用。押金不予退还的情形包括但不限于：乙方提前退租、乙方未提前60天通知甲方退租、房屋墙面有轻微划痕等。

第五条 房屋维修
租赁期间，房屋及内部设施的所有维修费用均由乙方承担。甲方不承担任何维修义务。

第六条 合同解除
乙方不得提前解除本合同。如乙方单方面提前解除合同，押金不予退还，且乙方应额外向甲方支付相当于三个月租金的违约金。甲方有权随时提前30天通知乙方解除本合同，无需承担任何违约责任。

第七条 转租
乙方不得将房屋转租、转借给任何第三方。未经甲方书面同意，乙方不得改变房屋用途。

第八条 装修约定
乙方不得对房屋进行任何装修或改造。如乙方擅自装修，甲方有权要求乙方恢复原状，费用由乙方承担，且甲方有权解除合同并没收押金。

第九条 物业费用
租赁期间的物业管理费、水电费、燃气费、网络费等所有费用均由乙方承担并按时缴纳。

第十条 争议解决
因本合同引起的任何争议，双方应友好协商解决。协商不成的，只能向甲方所在地人民法院提起诉讼。

第十一条 其他约定
本合同未尽事宜，按照甲方制定的《租客须知》执行。甲方保留对本合同的最终解释权。

甲方（签字）：__________
乙方（签字）：__________
日期：2026年1月1日`},{id:"employment-1",type:"employment",title:"劳动合同",description:"一份新入职劳动合同，含有多处侵犯劳动者权益的条款",icon:"💼",content:`劳动合同书

甲方（用人单位）：XX科技有限公司
乙方（劳动者）：王某某

甲乙双方根据《中华人民共和国劳动法》《中华人民共和国劳动合同法》及相关法律法规，签订本劳动合同：

第一条 合同期限
本合同为固定期限劳动合同，自2026年2月1日起至2027年1月31日止。试用期六个月。

第二条 工作内容与地点
乙方担任前端开发工程师岗位。工作地点为甲方指定的任何城市。甲方可根据经营需要随时调整乙方的工作岗位、工作内容和工作地点，乙方应当服从。

第三条 工作时间与休息
乙方实行不定时工作制，不再适用标准工时制。甲方因经营需要可安排乙方加班，加班费包含在月薪中，不再另行支付。

第四条 劳动报酬
乙方月工资为税前人民币12000元。甲方有权根据公司经营状况和乙方绩效随时调整乙方工资。工资发放日期为每月25日，如遇节假日顺延。

第五条 保密与竞业限制
乙方在职期间及离职后三年内，不得在与甲方有竞争关系的单位工作，不得自行从事与甲方业务相同或类似的经营活动。竞业限制期间甲方不向乙方支付经济补偿。如乙方违反竞业限制约定，应向甲方支付违约金人民币50万元。

第六条 知识产权
乙方在职期间创作的所有作品、发明、软件代码等知识产权成果，均归甲方所有。乙方离职后两年内不得使用上述成果。

第七条 合同解除
乙方在试用期内被证明不符合录用条件的，甲方可以解除合同。乙方主动辞职的，应提前90天书面通知甲方。乙方未提前通知即离职的，应向甲方支付相当于一个月工资的违约金。

第八条 培训与服务期
甲方为乙方提供专项培训的，乙方应为甲方服务满三年。乙方在服务期内离职的，应全额返还培训费用并支付违约金。

第九条 休假
乙方的年休假、法定节假日等按照甲方内部规章制度执行。甲方有权根据经营需要安排乙方在法定节假日加班。

第十条 争议解决
因本合同发生的争议，双方应协商解决。协商不成的，应向甲方所在地劳动仲裁委员会申请仲裁。乙方对仲裁结果不得提起诉讼。

甲方（盖章）：__________
乙方（签字）：__________
签订日期：2026年2月1日`},{id:"cooperation-1",type:"cooperation",title:"项目合作协议",description:"一份外包/合作开发协议，存在付款和知识产权方面的风险",icon:"🤝",content:`项目合作协议

甲方（委托方）：XX传媒有限公司
乙方（开发方）：XX技术工作室

甲乙双方就甲方委托乙方进行"XX电商平台"项目开发事宜，经友好协商，达成如下协议：

第一条 项目概述
甲方委托乙方开发"XX电商平台"项目，包括前端页面、后端API、管理后台、微信小程序四个部分。项目周期为90天。

第二条 费用与支付
项目总费用为人民币150000元。支付方式如下：
1. 合同签订后7个工作日内，甲方向乙方支付首付款人民币30000元；
2. 项目开发完成并交付后，甲方向乙方支付尾款人民币120000元。
甲方有权根据自身资金情况调整付款时间，乙方不得因此停止开发工作。

第三条 验收标准
甲方在收到乙方交付成果后进行验收。验收标准由甲方自行判断，甲方有权反复要求乙方修改，直至甲方满意为止。乙方每次修改不得超过48小时完成。

第四条 知识产权
项目开发过程中产生的所有代码、设计稿、文档等成果的知识产权归甲方所有。乙方不得保留任何副本，不得将上述成果用于其他项目。乙方此前已开发的通用工具、组件、框架等，一经用于本项目，知识产权也归甲方所有。

第五条 保密条款
乙方对甲方的商业秘密、技术信息、项目资料等负有保密义务。保密期限为永久有效。乙方违反保密义务的，应向甲方支付违约金人民币200000元，并赔偿甲方全部损失。

第六条 违约责任
乙方未按期交付的，每逾期一日，应向甲方支付项目总费用5%的违约金。逾期超过15日的，甲方有权解除合同，乙方应返还已收取的全部费用并支付违约金。甲方逾期付款的，不承担违约责任。

第七条 合同变更
甲方有权随时变更项目需求、功能范围、交付时间。乙方应无条件配合，且不得要求增加费用。因甲方变更导致的工期延误，由乙方承担。

第八条 售后维护
乙方应免费提供项目上线后两年的技术维护和bug修复服务。维护范围包括但不限于功能修复、性能优化、服务器迁移、需求变更开发。

第九条 争议解决
因本合同引起的争议，双方应协商解决。协商不成的，向甲方所在地人民法院提起诉讼。

第十条 其他
本合同最终解释权归甲方所有。

甲方（盖章）：__________
乙方（盖章）：__________
签订日期：2026年3月1日`},{id:"renovation-1",type:"renovation",title:"家庭装修施工合同",description:"一份装修合同，暗藏增项无上限、材料偷换、工期延误无赔偿等陷阱",icon:"🔨",content:`家庭装修施工合同

甲方（发包方/业主）：赵某某
乙方（承包方/施工方）：XX装饰工程有限公司

甲乙双方经友好协商，就甲方房屋装修工程事宜，达成如下协议：

第一条 工程概况
工程地点：XX市XX区XX小区XX栋XX室。建筑面积约120平方米。承包方式为半包，即乙方提供施工人工及辅材，甲方提供主材。

第二条 工程期限
工程自开工之日起60个日历天完成。开工日期以乙方通知为准。如因乙方原因导致工期延误，每延误一日，乙方按工程总造价的0.1%向甲方支付违约金，违约金总额不超过工程总造价的1%。因甲方原因（包括但不限于未按时付款、变更需求、未及时提供主材）导致工期延误的，工期顺延，乙方不承担任何责任。

第三条 工程造价与付款方式
工程预算总价为人民币120000元，最终结算金额按实际工程量据实结算，以乙方实际施工量为准。付款方式如下：
1. 合同签订当日支付首付款人民币60000元，占总价50%；
2. 水电隐蔽工程完工后支付人民币30000元；
3. 木工完工后支付人民币20000元；
4. 竣工验收合格后支付剩余尾款人民币10000元。
甲方未按约定时间付款的，乙方有权停止施工，由此造成的工期延误由甲方承担，并按应付未付金额每日1%支付违约金。

第四条 材料供应

nation:"租金支付期限应合理约定，不能设置过高的逾期违约金。",relatedRisks:["penalty","payment_risk"]},{id:"mfw-729",law:"《中华人民共和国民法典》",article:"第七百二十九条",content:"因第三人主张权利，致使承租人不能对租赁物使用、收益的，承租人可以请求减少租金或者不支付租金。",explanation:"租客有权在使用受影响时减少或拒付租金。",relatedRisks:["rights_violation","payment_risk"]},{id:"mfw-712",law:"《中华人民共和国民法典》",article:"第七百一十二条",content:"出租人应当履行租赁物的维修义务，但是当事人另有约定的除外。",explanation:"除非合同另有约定，房屋维修是房东的义务，不能全部推给租客。",relatedRisks:["unfair_term","rights_violation"]},{id:"mfw-716",law:"《中华人民共和国民法典》",article:"第七百一十六条",content:"承租人经出租人同意，可以将租赁物转租给第三人。",explanation:"转租需经房东同意，但合同不应绝对禁止或设置不合理条件。",relatedRisks:["rights_violation"]},{id:"lcl-19",law:"《中华人民共和国劳动合同法》",article:"第十九条",content:"劳动合同期限三个月以上不满一年的，试用期不得超过一个月；劳动合同期限一年以上不满三年的，试用期不得超过二个月；三年以上固定期限和无固定期限的劳动合同，试用期不得超过六个月。",explanation:"一年期合同试用期最多2个月，6个月试用期违法。",relatedRisks:["rights_violation"]},{id:"lcl-20",law:"《中华人民共和国劳动合同法》",article:"第二十条",content:"劳动者在试用期的工资不得低于本单位相同岗位最低档工资或者劳动合同约定工资的百分之八十，并不得低于用人单位所在地的最低工资标准。",explanation:"试用期工资不得低于正式工资的80%。",relatedRisks:["payment_risk"]},{id:"lcl-23",law:"《中华人民共和国劳动合同法》",article:"第二十三条",content:"用人单位与劳动者可以在劳动合同中约定保守用人单位的商业秘密和与知识产权相关的保密事项。对负有保密义务的劳动者，用人单位可以在劳动合同或者保密协议中与劳动者约定竞业限制条款，并约定在解除或者终止劳动合同后，在竞业限制期限内按月给予劳动者经济补偿。",explanation:"竞业限制必须给钱！不给补偿金的竞业限制条款无效。",relatedRisks:["rights_violation","unfair_term"]},{id:"lcl-24",law:"《中华人民共和国劳动合同法》",article:"第二十四条",content:"竞业限制的人员限于用人单位的高级管理人员、高级技术人员和其他负有保密义务的人员。竞业限制期限不得超过两年。",explanation:"竞业限制最长2年，且只适用于特定人员，普通员工不受竞业限制约束。",relatedRisks:["rights_violation","unfair_term"]},{id:"lcl-25",law:"《中华人民共和国劳动合同法》",article:"第二十五条",content:"除本法第二十二条和第二十三条规定的情形外，用人单位不得与劳动者约定由劳动者承担违约金。",explanation:"除了培训服务期和竞业限制外，不能让员工承担违约金。",relatedRisks:["penalty","rights_violation"]},{id:"lcl-31",law:"《中华人民共和国劳动合同法》",article:"第三十一条",content:"用人单位应当严格执行劳动定额标准，不得强迫或者变相强迫劳动者加班。用人单位安排加班的，应当按照国家有关规定向劳动者支付加班费。",explanation:'加班必须给加班费，"加班费包含在月薪中"是违法的。',relatedRisks:["payment_risk","rights_violation"]},{id:"lcl-37",law:"《中华人民共和国劳动合同法》",article:"第三十七条",content:"劳动者提前三十日以书面形式通知用人单位，可以解除劳动合同。劳动者在试用期内提前三日通知用人单位，可以解除劳动合同。",explanation:"员工辞职只需提前30天通知（试用期3天），不能要求90天。",relatedRisks:["rights_violation","termination"]},{id:"lcl-50",law:"《中华人民共和国劳动合同法》",article:"第五十条",content:"用人单位应当在解除或者终止劳动合同时出具解除或者终止劳动合同的证明，并在十五日内为劳动者办理档案和社会保险关系转移手续。",explanation:"用人单位不得以扣留档案等方式限制劳动者离职。",relatedRisks:["rights_violation"]},{id:"mfw-498",law:"《中华人民共和国民法典》",article:"第四百九十八条",content:"对格式条款的理解发生争议的，应当按照通常理解予以解释。对格式条款有两种以上解释的，应当作出不利于提供格式条款一方的解释。格式条款和非格式条款不一致的，应当采用非格式条款。",explanation:'"最终解释权归甲方所有"这类条款没有法律效力。',relatedRisks:["unfair_term","rights_violation"]},{id:"mfw-533",law:"《中华人民共和国民法典》",article:"第五百三十三条",content:"合同成立后，合同的基础条件发生了当事人在订立合同时无法预见的、不属于商业风险的重大变化，继续履行合同对于当事人一方明显不公平的，受不利影响的当事人可以与对方重新协商。",explanation:"情势变更原则：如果条件发生重大变化，可以要求重新协商。",relatedRisks:["unfair_term"]},{id:"xfw-26",law:"《中华人民共和国消费者权益保护法》",article:"第二十六条",content:"经营者在经营活动中使用格式条款的，应当以显著方式提请消费者注意商品或者服务的数量和质量、价款或者费用、履行期限和方式、安全注意事项和风险警示、售后服务、民事责任等与消费者有重大利害关系的内容，并按照消费者的要求予以说明。经营者不得以格式条款、通知、声明、店堂告示等方式，作出排除或者限制消费者权利、减轻或者免除经营者责任、加重消费者责任等对消费者不公平、不合理的规定，不得利用格式条款并借助技术手段强制交易。格式条款、通知、声明、店堂告示等含有前款所列内容的，其内容无效。",explanation:"商家提供的格式合同中，加重消费者责任或减轻自身责任的条款无效。",relatedRisks:["unfair_term","rights_violation"]},{id:"xfw-53",law:"《中华人民共和国消费者权益保护法》",article:"第五十三条",content:"经营者以预收款方式提供商品或者服务的，应当按照约定提供。未按照约定提供的，应当按照消费者的要求履行约定或者退回预付款；并应当承担预付款的利息、消费者必须支付的合理费用。",explanation:"培训机构、装修公司等收了预付款却不按约提供服务，消费者有权要求退款。",relatedRisks:["payment_risk","rights_violation"]},{id:"mjjd-2020-1",law:"《最高人民法院关于审理民间借贷案件适用法律若干问题的规定》",article:"第一条",content:"本规定所称的民间借贷，是指自然人、法人和非法人组织之间进行资金融通的行为。",explanation:"民间借贷受法律保护，但利率不能超过合同成立时一年期贷款市场报价利率（LPR）的四倍。",relatedRisks:["interest_rate","hidden_fee"]},{id:"mfw-670",law:"《中华人民共和国民法典》",article:"第六百七十条",content:"借款的利息不得预先在本金中扣除。利息预先在本金中扣除的，应当按照实际借款数额返还借款并计算利息。",explanation:"砍头息（预先扣除利息）违法，应按实际到手金额计算利息。",relatedRisks:["interest_rate","hidden_fee"]},{id:"mfw-680",law:"《中华人民共和国民法典》",article:"第六百八十条",content:"禁止高利放贷，借款的利率不得违反国家有关规定。借款合同对支付利息没有约定的，视为没有利息。借款合同对支付利息约定不明确，当事人不能达成补充协议的，按照当地或者当事人的交易方式、交易习惯、市场利率等因素确定利息。",explanation:"高利放贷违法，超出LPR四倍的利息法院不支持。",relatedRisks:["interest_rate"]},{id:"xxbhf-13",law:"《中华人民共和国个人信息保护法》",article:"第十三条",content:"符合下列情形之一的，个人信息处理者方可处理个人信息：（一）取得个人的同意；（二）为订立、履行个人作为一方当事人的合同所必需，或者按照依法制定的劳动规章制度和依法签订的集体合同实施人力资源管理所必需。",explanation:'借款合同中要求授权通讯录、位置等与借款无关的个人信息，超出"合同必需"范围，属于过度收集。',relatedRisks:["data_privacy","rights_violation"]},{id:"mfw-799",law:"《中华人民共和国民法典》",article:"第七百九十九条",content:"建设工程竣工后，发包人应当根据施工图纸及说明书、国家颁发的施工验收规范和质量检验标准及时进行验收。验收合格的，发包人应当按照约定支付价款，并接收该建设工程。建设工程竣工经验收合格后，方可交付使用；未经验收或者验收不合格的，不得交付使用。",explanation:"装修工程必须按国家标准验收，未经验收或验收不合格不得交付使用。",relatedRisks:["quality_risk"]},{id:"jsgc-40",law:"《建设工程质量管理条例》",article:"第四十条",content:"在正常使用条件下，建设工程的最低保修期限为：（一）基础设施工程、房屋建筑的地基基础工程和主体结构工程，为设计文件规定的该工程的合理使用年限；（二）屋面防水工程、有防水要求的卫生间、房间和外墙面的防渗漏，为5年；（三）供热与供冷系统，为2个采暖期、供冷期；（四）电气管线、给排水管道、设备安装和装修工程，为2年。",explanation:"防水工程保修至少5年，电气管线和装修工程保修至少2年。低于此标准的约定无效。",relatedRisks:["quality_risk","rights_violation"]},{id:"mfw-933",law:"《中华人民共和国民法典》",article:"第九百三十三条",content:"委托人或者受托人可以随时解除委托合同。因解除合同造成对方损失的，除不可归责于该当事人的事由外，无偿委托合同的解除方应当赔偿因解除时间不当造成的直接损失，有偿委托合同的解除方应当赔偿对方的直接损失和合同履行后可以获得的利益。",explanation:"委托合同双方都有任意解除权，但不能随意约定天价违约金限制解除。",relatedRisks:["termination","penalty"]},{id:"mfw-563",law:"《中华人民共和国民法典》",article:"第五百六十三条",content:"有下列情形之一的，当事人可以解除合同：（一）因不可抗力致使不能实现合同目的；（二）在履行期限届满前，当事人一方明确表示或者以自己的行为表明不履行主要债务；（三）当事人一方迟延履行主要债务，经催告后在合理期限内仍未履行；（四）当事人一方迟延履行债务或者有其他违约行为致使不能实现合同目的；（五）法律规定的其他情形。",explanation:"对方严重违约或根本不履行合同时，你有权单方解除合同。",relatedRisks:["termination","rights_violation"]}],hc=[{type:"rental",label:"房屋租赁合同",weakParty:"租客",icon:"🏠",keywords:["租金","押金","房东","承租","租期","房屋","物业","出租方"]},{type:"employment",label:"劳动合同",weakParty:"劳动者",icon:"💼",keywords:["用人单位","劳动者","工资","社保","试用期","离职","竞业限制","劳动合同"]},{type:"cooperation",label:"项目合作协议",weakParty:"开发方/乙方",icon:"🤝",keywords:["委托","合作","开发","交付","验收","甲方","乙方","项目"]},{type:"renovation",label:"装修合同",weakParty:"业主/消费者",icon:"🔨",keywords:["装修","工程款","工期","建材","水电","验收","增项","施工"]},{type:"loan",label:"借款/贷款合同",weakParty:"借款人",icon:"💰",keywords:["借款","利息","本金","逾期","年化利率","出借人","还款","贷款"]},{type:"mcn",label:"MCN/经纪合同",weakParty:"创作者/主播",icon:"📹",keywords:["主播","达人","账号","分成","公会","独家","违约金","流量","MCN"]},{type:"education",label:"教育培训合同",weakParty:"学员/消费者",icon:"📚",keywords:["培训费","课程","退费","保过","机构","课时","培训"]},{type:"purchase",label:"买卖/购销合同",weakParty:"买方/消费者",icon:"🛒",keywords:["买方","卖方","交付","验收","质量保证","退换货","购销"]}];function qo(e){return{soft:`您好，关于这条"${e.clauseTitle}"的条款，我查了一下相关法律规定，${e.plainLanguage} 建议咱们能不能商量着调整一下：${e.suggestion}`,firm:`这条条款存在法律风险。${e.whyRisky} 根据相关法律规定，我方无法接受当前表述。建议修改为：${e.suggestion}`}}const kp=[{id:"rp-001",keywords:["月租金的5%","月租金5%","日租金","每日.*租金的","按月租金.*%.*违约金","每日.*%.*违约"],level:"high",category:"penalty",clauseTitle:"逾期违约金过高",plainLanguage:"你晚交一天房租，就要多交175块钱（3500的5%）。一个月房租才3500，逾期3天违约金就超过525块了。",whyRisky:"每日5%的违约金换算成年化利率高达1825%，远超法律保护范围（LPR的4倍约15%）。民法典第585条规定，违约金过分高于实际损失的，可请求减少。一般超过损失的30%即认定为过高。",suggestion:'将逾期违约金修改为"每逾期一日，按月租金的0.05%（即每日1.75元）支付违约金"，或约定固定金额如"每日10元"。',suggestedText:"逾期支付租金的，每逾期一日，乙方应按日租金的0.05%向甲方支付违约金。",relatedLaws:["mfw-585","mfw-577"],contractTypes:["rental"]},{id:"rp-002",keywords:["三个月租金的违约金","三个月.*违约金","额外.*三个月","相当于.*三个月.*租金"],level:"high",category:"penalty",clauseTitle:"单方解约违约金过高",plainLanguage:"你提前退租不仅要损失7000块押金，还要再赔3个月房租10500块，加起来要损失17500元。",whyRisky:"合同约定乙方提前解约要没收押金+额外3个月违约金，而甲方随时可解约且不担责。这属于权利义务严重不对等，且违约金远超房东实际损失（一般为一两个月租金）。",suggestion:'删除"额外支付三个月违约金"条款，或修改为"提前30天通知的，仅扣除押金；未通知的，赔偿一个月租金"。',relatedLaws:["mfw-585","mfw-497"],contractTypes:["rental"]},{id:"rp-003",keywords:["50万.*违约金","50万元.*竞业","违约金人民币50万","500000"],level:"high",category:"penalty",clauseTitle:"竞业限制违约金畸高",plainLanguage:"你月薪才12000块，但竞业限制违约金要50万，相当于你41个月的工资。万一违约，你要不吃不喝还3年半。",whyRisky:"劳动合同法第25条规定，除培训服务期和竞业限制外不得约定违约金。即便竞业限制可约定违约金，也应与劳动者收入和实际损失相当。月入1.2万约定50万违约金，明显畸高。",suggestion:"违约金应与竞业限制补偿金和劳动者的收入水平挂钩，建议不超过年薪的2倍（即不超过28.8万），或与竞业限制补偿金总额相当。",relatedLaws:["lcl-23","lcl-25","lcl-24"],contractTypes:["employment"]},{id:"rp-004",keywords:["总费用5%.*违约金","5%.*违约金","每日.*总费用.*%"],level:"high",category:"penalty",clauseTitle:"逾期交付违约金畸高",plainLanguage:"项目总价15万，逾期一天违约金7500元（5%），逾期20天违约金就超过项目总额了。",whyRisky:"每日5%的违约金换算下来，逾期20天就要赔偿100%以上，远超合理范围。民法典第585条规定违约金过分高于损失可请求减少。行业惯例通常为每日0.1%-0.5%。",suggestion:'修改为"每逾期一日，按项目总费用的0.1%支付违约金，累计不超过总费用的10%"。',suggestedText:"乙方未按期交付的，每逾期一日，应向甲方支付项目总费用0.1%的违约金，累计不超过项目总费用的10%。",relatedLaws:["mfw-585"],contractTypes:["cooperation"]},{id:"rp-005",keywords:["未提前.*天.*通知.*退租","提前60天.*通知.*退租","提前90天.*通知"],level:"medium",category:"penalty",clauseTitle:"通知期限过长",plainLanguage:"正常退租只需提前30天通知即可，但合同要求你提前60天甚至90天通知，否则扣押金。",whyRisky:"民法典第730条规定，未约定租赁期限的，可随时解除但需提前通知。约定60-90天通知期限过长，对承租人明显不利，合理期限为30天。",suggestion:'将通知期限修改为"提前30天书面通知"。',relatedLaws:["mfw-533"],contractTypes:["rental"]},{id:"rp-006",keywords:["一个月工资的违约金","未提前.*通知.*离职.*违约金","相当于.*一个月.*工资.*违约"],level:"high",category:"penalty",clauseTitle:"违法约定离职违约金",plainLanguage:"法律规定除了培训服务期和竞业限制外，公司不能让员工赔违约金。你正常辞职却被要求赔一个月工资，这是违法的。",whyRisky:"劳动合同法第25条明确规定，除培训服务期和竞业限制外，用人单位不得与劳动者约定由劳动者承担违约金。该条款违反法律强制性规定，应属无效。",suggestion:"删除该违约金条款。员工提前30天书面通知即可合法解除劳动合同，无需支付违约金。",relatedLaws:["lcl-25","lcl-37"],contractTypes:["employment"]},{id:"rp-007",keywords:["甲方有权随时.*解除.*通知","甲方.*随时.*解除.*不承担.*违约","甲方有权.*提前.*天.*解除.*无需.*违约"],level:"high",category:"unfair_term",clauseTitle:"单方解约权不对等",plainLanguage:"房东可以随时赶你走（提前30天通知就行），你却不能提前退租，否则要赔三个月违约金+扣押金。权利完全不对等。",whyRisky:"合同约定甲方可随时解约且不担责，而乙方解约则面临高额违约金和押金没收，属于典型的权利义务不对等的霸王条款，违反民法典第497条公平原则。",suggestion:'修改为"甲乙双方如需提前解除合同，均应提前30天通知对方，并支付相当于一个月租金的违约金"。',suggestedText:"甲乙双方如需提前解除合同，均应提前30天书面通知对方。甲方提前解约的，应退还剩余租金并赔偿乙方一个月租金。",relatedLaws:["mfw-497","mfw-496"],contractTypes:["rental"]},{id:"rp-008",keywords:["所有维修费用.*乙方承担","维修.*均由.*乙方承担","甲方不承担任何维修"],level:"high",category:"unfair_term",clauseTitle:"维修义务全部转嫁租客",plainLanguage:"水管漏水、电器坏了、墙皮脱落，都要你自己掏钱修。但法律规定这些本来该房东负责修。",whyRisky:'民法典第712条规定，出租人应履行维修义务，除非另有约定。但将"所有"维修费用全部转嫁给承租人，属于不合理加重对方责任的格式条款，可能被认定无效。',suggestion:'修改为"自然损耗和结构性维修由甲方承担，乙方人为损坏的维修费用由乙方承担"。',suggestedText:"房屋主体结构及自然损耗的维修由甲方负责；因乙方使用不当造成的设施损坏，由乙方负责维修或承担维修费用。",relatedLaws:["mfw-712","mfw-497"],contractTypes:["rental"]},{id:"rp-009",keywords:["最终解释权.*甲方","最终解释权","甲方保留.*解释权"],level:"medium",category:"unfair_term",clauseTitle:'"最终解释权"无效条款',plainLanguage:'"最终解释权归甲方"这句话在法律上是无效的。民法典明确规定格式条款有两种解释时，应作不利于提供方的解释。',whyRisky:'民法典第498条规定，格式条款有两种以上解释的，应作出不利于提供格式条款一方的解释。"最终解释权归甲方"违反该规定，属于无效条款。',suggestion:"删除该条款。争议解释应按民法典第498条处理。",suggestedText:"删除该条款。",relatedLaws:["mfw-498"]},{id:"rp-010",keywords:["只能向.*甲方所在地.*起诉","只能.*甲方.*法院","向甲方所在地.*法院.*提起诉讼"],level:"medium",category:"unfair_term",clauseTitle:"管辖法院对乙方不利",plainLanguage:"如果发生纠纷，你只能去房东/公司所在地的法院打官司。如果你住在另一个城市，维权成本很高。",whyRisky:"约定仅在甲方所在地法院诉讼，排除了乙方所在地法院管辖权，增加了弱势方维权成本。虽不一定无效，但对乙方明显不利。",suggestion:'修改为"由合同履行地或被告住所地人民法院管辖"。',suggestedText:"因本合同引起的争议，由合同履行地或被告住所地人民法院管辖。",relatedLaws:["mfw-497"]},{id:"rp-011",keywords:["竞业限制.*不.*支付.*补偿","竞业限制期间.*不.*经济补偿","不向乙方支付.*补偿"],level:"high",category:"unfair_term",clauseTitle:"竞业限制不给补偿",plainLanguage:"公司让你离职后3年不能去同行工作，但一分钱补偿都不给你。这意味着你3年不能从事本专业，却没有任何收入来源。",whyRisky:"劳动合同法第23条规定，竞业限制期间用人单位应按月给予经济补偿。不支付补偿金的竞业限制条款，劳动者可请求解除竞业限制约定。且竞业限制最长2年，3年约定违法。",suggestion:"1. 竞业限制期限修改为不超过2年；2. 约定按月支付不低于离职前12个月平均工资30%的补偿金。",suggestedText:"竞业限制期限不超过两年。在竞业限制期间，甲方按月向乙方支付不低于乙方离职前十二个月平均工资30%的经济补偿。",relatedLaws:["lcl-23","lcl-24"],contractTypes:["employment"]},{id:"rp-012",keywords:["加班费.*包含.*月薪","加班费.*包含.*工资","不再另行支付.*加班"],level:"high",category:"unfair_term",clauseTitle:"加班费打包违规",plainLanguage:"公司说你的加班费已经包含在工资里了，不用再给你加班费。但法律规定加班必须额外给钱。",whyRisky:'劳动合同法第31条规定，用人单位安排加班应按国家规定支付加班费。"加班费包含在月薪中"的约定违反法律强制性规定，劳动者有权要求额外支付加班费。',suggestion:"删除该条款，按法定标准支付加班费：工作日150%、休息日200%（不补休）、法定节假日300%。",suggestedText:"甲方安排乙方加班的，应依法支付加班费。工作日加班按150%、休息日加班按200%、法定节假日加班按300%支付。",relatedLaws:["lcl-31"],contractTypes:["employment"]},{id:"rp-013",keywords:["甲方有权.*调整.*岗位.*地点","随时调整.*工作.*地点","甲方可根据.*调整.*乙方.*岗位"],level:"medium",category:"unfair_term",clauseTitle:"单方调岗调薪权过大",plainLanguage:'公司可以随时把你的岗位、工作地点、工作内容改掉，你必须服从。这意味着你签的是"前端开发"，公司可以把派你去当测试或去另一个城市。',whyRisky:'劳动合同变更应经双方协商一致。单方约定"随时调整岗位、地点"的权利过大，实际执行中需举证合理性，否则劳动者可拒绝。',suggestion:'修改为"甲方可根据生产经营需要调整乙方岗位，但应与乙方协商一致，并书面确认"。',suggestedText:"甲方如需调整乙方的工作岗位或工作地点，应与乙方协商一致，并签订书面变更协议。",relatedLaws:["mfw-497"],contractTypes:["employment"]},{id:"rp-014",keywords:["甲方.*变更.*需求.*乙方.*不得.*增加.*费用","甲方有权.*变更.*乙方.*无条件.*配合","变更.*不得要求.*增加费用"],level:"high",category:"unfair_term",clauseTitle:"需求变更不增费用",plainLanguage:"甲方可以随时改需求、加功能，你必须无条件配合且不能加钱。你原本报15万的项目，可能被改成一个30万的工作量。",whyRisky:"合同约定甲方可随时变更项目需求且乙方不得增加费用，严重违反公平原则。民法典第533条情势变更原则也支持在条件重大变化时重新协商。",suggestion:'修改为"甲方变更需求的，双方应协商确定变更范围、工期和费用调整方案，签订补充协议后执行"。',suggestedText:"甲方变更项目需求的，双方应协商确定变更对工期和费用的影响，签订补充协议后执行。未经协商的变更，乙方有权拒绝。",relatedLaws:["mfw-533","mfw-497"],contractTypes:["cooperation"]},{id:"rp-015",keywords:["逾期付款.*不承担.*违约","甲方.*逾期.*付款.*不.*违约"],level:"high",category:"unfair_term",clauseTitle:"甲方违约不担责",plainLanguage:"你迟交一天要赔5%，但甲方迟付货款一分钱违约金都不用出。法律面前不是人人平等吗？",whyRisky:"合同仅约定乙方违约责任，甲方逾期付款不承担违约责任，属于明显的不对等条款，违反公平原则。",suggestion:'增加"甲方逾期付款的，每逾期一日，按应付金额的0.1%向乙方支付违约金"。',suggestedText:"甲方逾期付款的，每逾期一日，应按应付金额的0.1%向乙方支付违约金。",relatedLaws:["mfw-497","mfw-585"],contractTypes:["cooperation"]},{id:"rp-016",keywords:["试用期六个月","试用期.*六个月","6个月.*试用期"],level:"high",category:"rights_violation",clauseTitle:"试用期超长违法",plainLanguage:"你的合同是一年期的，但试用期却要6个月。法律规定一年期合同试用期最多2个月。",whyRisky:"劳动合同法第19条规定，一年以上不满三年的劳动合同试用期不得超过2个月。6个月试用期违法，超出部分视为已过试用期。",suggestion:"将试用期修改为不超过2个月。",suggestedText:"试用期为二个月。",relatedLaws:["lcl-19"],contractTypes:["employment"]},{id:"rp-017",keywords:["竞业限制.*三年","离职后三年","三年内.*不得.*竞争"],level:"high",category:"rights_violation",clauseTitle:"竞业限制期限超长",plainLanguage:"法律规定竞业限制最长2年，但合同写了3年。超出2年的部分是无效的。",whyRisky:"劳动合同法第24条规定，竞业限制期限不得超过两年。3年约定超出法定上限，超出部分无效。",suggestion:"将竞业限制期限修改为不超过两年。",suggestedText:"竞业限制期限不超过两年。",relatedLaws:["lcl-24","lcl-23"],contractTypes:["employment"]},{id:"rp-018",keywords:["提前90天.*通知.*辞职","提前90日.*书面.*通知","提前90天.*通知.*甲方"],level:"high",category:"rights_violation",clauseTitle:"离职通知期违法",plainLanguage:"法律规定辞职只需提前30天通知，但合同要求你提前90天通知。多出的60天没有法律效力。",whyRisky:"劳动合同法第37条规定，劳动者提前30日书面通知即可解除劳动合同。约定90天通知期限违反法律强制性规定，超出30天的部分无效。",suggestion:'修改为"提前30日书面通知"。',suggestedText:"乙方提前三十日以书面形式通知甲方，可以解除劳动合同。",relatedLaws:["lcl-37"],contractTypes:["employment"]},{id:"rp-019",keywords:["对仲裁结果.*不得.*提起诉讼","不得.*提起诉讼","不得.*诉讼"],level:"high",category:"rights_violation",clauseTitle:"剥夺诉讼权利",plainLanguage:"合同说你对仲裁结果不服也不能去法院告。但诉讼权是法律给你的基本权利，合同不能剥夺。",whyRisky:'劳动争议调解仲裁法第48条规定，劳动者对仲裁裁决不服的，可向人民法院提起诉讼。约定"不得提起诉讼"剥夺了劳动者的法定诉权，该条款无效。',suggestion:'删除"乙方对仲裁结果不得提起诉讼"条款。',suggestedText:"删除该限制。双方对仲裁裁决不服的，均可依法向人民法院提起诉讼。",relatedLaws:["mfw-497"],contractTypes:["employment"]},{id:"rp-020",keywords:["墙面有轻微划痕.*不退","轻微划痕.*不退.*押金","押金不予退还.*包括.*划痕"],level:"medium",category:"unfair_term",clauseTitle:"押金扣除条件过苛",plainLanguage:"墙面有一点划痕就不退押金？正常使用导致的轻微磨损不应该扣你的钱。",whyRisky:"正常使用造成的自然损耗不应作为扣除押金的理由。民法典第710条规定，承租人按约定方法使用租赁物致使损耗的，不承担赔偿责任。",suggestion:'修改为"押金扣除仅限于乙方人为造成的超出正常损耗范围的损坏"。',suggestedText:"押金在扣除乙方人为造成的超出正常损耗范围的损坏赔偿后退还。正常使用损耗不扣除押金。",relatedLaws:["mfw-497"],contractTypes:["rental"]},{id:"rp-021",keywords:["验收标准.*甲方.*自行判断","甲方.*自行.*判断.*验收","甲方有权.*反复.*修改.*直至.*满意"],level:"high",category:"unfair_term",clauseTitle:"验收标准模糊主观",plainLanguage:'甲方说"满意为止"才算验收通过，但没有具体标准。这意味着甲方可以无限次让你改，你永远拿不到尾款。',whyRisky:'验收标准"由甲方自行判断""直至满意"过于主观模糊，无客观标准，可能导致乙方永远无法完成验收，尾款遥遥无期。民法典第511条规定质量要求不明确的按国家标准、行业标准履行。',suggestion:'约定明确的验收标准和验收期限："甲方应在收到交付成果后7个工作日内完成验收，逾期未提出书面修改意见的视为验收通过"。',suggestedText:"甲方在收到交付成果后7个工作日内完成验收并出具书面意见。逾期未提出书面修改意见的，视为验收通过。验收修改不超过3轮。",relatedLaws:["mfw-497"],contractTypes:["cooperation"]},{id:"rp-022",keywords:["免费.*两年.*维护","免费.*两年.*技术维护","免费.*bug.*修复.*两年"],level:"medium",category:"unfair_term",clauseTitle:"免费维护范围过宽",plainLanguage:"甲方要你免费维护2年，包括需求变更开发。这意味着2年内甲方任何新功能需求你都要免费做。",whyRisky:'免费维护2年且范围包括"需求变更开发"，远超合理范围。行业惯例免费维护一般为3-6个月，仅限bug修复，不含新功能开发。',suggestion:'修改为"免费提供3个月的bug修复服务，不含新功能开发。超出范围的按另行约定收费"。',suggestedText:"乙方免费提供3个月的项目bug修复服务。新功能开发、需求变更等另行协商收费。",relatedLaws:["mfw-497"],contractTypes:["cooperation"]},{id:"rp-023",keywords:["通用工具.*组件.*框架.*知识产权.*归甲方","此前.*开发.*归.*甲方"],level:"medium",category:"rights_violation",clauseTitle:"侵犯乙方既有知识产权",plainLanguage:"你以前自己开发的工具和框架，用在这个项目里后，版权就变成甲方的了。这等于甲方白拿你的技术资产。",whyRisky:'乙方此前已独立开发的通用工具、组件、框架等，其知识产权属于乙方。合同约定"一经用于本项目知识产权归甲方"属于侵犯乙方既有权利，该条款可能无效。',suggestion:'增加例外条款："乙方在本项目前已独立开发并拥有的通用工具、组件、框架，其知识产权仍归乙方所有，甲方获得在本项目范围内的使用许可"。',suggestedText:"项目成果知识产权归甲方所有。但乙方在签约前已独立拥有的通用工具、组件、框架的知识产权仍归乙方，甲方获得在项目范围内的永久使用许可。",relatedLaws:["mfw-497"],contractTypes:["cooperation"]},{id:"rp-024",keywords:["不定时工作制.*不.*适用.*标准工时","不定时.*工作制"],level:"medium",category:"rights_violation",clauseTitle:"不定时工作制未审批",plainLanguage:'合同写你实行"不定时工作制"，但公司没有经过劳动部门审批。这意味着你实际上还是标准工时，加班应该给加班费。',whyRisky:"不定时工作制需经劳动行政部门审批后方可实施。未经审批的，仍按标准工时制执行，加班应支付加班费。",suggestion:"如确需不定时工作制，应依法申请审批。审批前按标准工时制执行。",relatedLaws:["lcl-31"],contractTypes:["employment"]},{id:"rp-025",keywords:["保密.*永久有效","保密期限.*永久","保密.*永久"],level:"low",category:"unfair_term",clauseTitle:"保密期限过长",plainLanguage:'保密义务"永久有效"听起来合理，但实际上商业秘密有生命周期，且一旦公开就不再是秘密。永久保密可能不合理。',whyRisky:"永久保密义务过于宽泛。合理的保密期限应根据信息性质约定，通常为合同终止后2-5年。已公开的信息不再受保密约束。",suggestion:'约定具体保密期限，如"保密期限为合同终止后5年，已公开的信息除外"。',suggestedText:"保密期限为本合同终止后5年。已经公开的信息不再受保密约束。",relatedLaws:["mfw-497"],contractTypes:["cooperation"]},{id:"rp-026",keywords:["同等档次","同等品质","同档次.*替代","类似品牌"],level:"high",category:"vague_language",clauseTitle:'材料标准模糊（"同等档次"陷阱）',plainLanguage:'合同写"可用同等档次产品替代"，但什么算"同等"完全由装修公司说了算。你以为用的是马可波罗瓷砖，最后给你换成杂牌的。',whyRisky:'"同等档次"是装修行业最大的坑之一，没有客观标准，容易被偷工减料。民法典第511条规定质量要求不明确的按国家标准、行业标准履行。',suggestion:'所有材料必须写明品牌、型号、规格，删除"同等档次"表述。如确需替换，须经业主书面同意。',suggestedText:"所有材料品牌、型号、规格详见附件《材料清单》。如需替换材料，须经甲方书面同意，且替换产品品牌档次不得低于原定产品。",relatedLaws:["mfw-511","mfw-497"],contractTypes:["renovation"],negotiationScript:{soft:'师傅，这条"同等档次"写得太模糊了，万一换了个牌子我都不认识，咱们把品牌型号都写清楚吧，我也能放心。',firm:'"同等档次"没有客观标准，我无法接受这种模糊表述。请把所有材料的品牌、型号、规格写进合同附件，否则我不会签约。'}},{id:"rp-027",keywords:["增项.*由.*承担","实际.*增项.*另行.*收费","增项.*不设上限","增项.*按实际.*结算"],level:"high",category:"hidden_fee",clauseTitle:"增项费用无上限",plainLanguage:"合同不设增项上限，装修公司可以不断加项加钱。说好15万的装修，最后可能变25万。",whyRisky:"不设增项上限是装修行业的常见陷阱。消费者权益保护法第26条规定，经营者不得利用格式条款加重消费者责任。增项应有合理上限。",suggestion:'约定"增项总额不超过合同总价的5%"，超出部分由乙方承担。',suggestedText:"施工过程中如有增项，须经甲方书面确认。增项总额不得超过合同总价的5%，超出部分由乙方自行承担。",relatedLaws:["xfw-26","mfw-497"],contractTypes:["renovation"],negotiationScript:{soft:"这条增项没有上限我不太放心，咱们加个限制吧，比如增项不超过总价5%？这样大家都安心。",firm:"增项不设上限严重损害消费者权益，违反消费者权益保护法第26条。我要求增项总额不超过合同总价5%，否则不予签约。"}},{id:"rp-028",keywords:["水电.*质保.*[12].*年","防水.*质保.*[123].*年","质保期.*一年","质保.*12个月"],level:"high",category:"quality_risk",clauseTitle:"质保年限低于法定标准",plainLanguage:"法律规定防水工程至少保修5年、电气管线和装修工程至少2年，但合同只写了1年质保。",whyRisky:"建设工程质量管理条例第40条明确规定，屋面防水工程防渗漏保修5年，电气管线、装修工程保修2年。低于法定标准的约定无效。",suggestion:"将质保修改为：水电工程5年，防水工程5年，整体装修2年。",suggestedText:"防水工程保修期为5年，水电工程保修期为5年，整体装修工程保修期为2年。保修期内出现的质量问题由乙方免费维修。",relatedLaws:["jsgc-40","mfw-799"],contractTypes:["renovation"],negotiationScript:{soft:"师傅，质保1年有点短了，我记得国家规定防水至少5年，水电至少2年，咱们按国家标准来吧？",firm:"质保1年低于建设工程质量管理条例第40条的法定标准。防水和水电至少5年，整体装修至少2年，请按法定标准修改。"}},{id:"rp-029",keywords:["施工.*安全.*由.*承担","工人.*受伤.*甲方.*负责","安全责任.*甲方","施工.*事故.*业主"],level:"high",category:"unfair_term",clauseTitle:"安全责任全部推给业主",plainLanguage:"装修工人在施工中受伤，合同却让你业主来负责赔偿。这完全不合理。",whyRisky:"施工安全是装修公司的法定义务，工人受伤应由装修公司承担工伤责任。将安全责任转嫁给业主属于加重消费者责任的不公平条款，消费者权益保护法第26条规定此类条款无效。",suggestion:'删除该条款，改为"施工期间的安全责任由乙方承担，乙方应为施工人员购买工伤保险"。',suggestedText:"施工期间的安全责任由乙方承担。乙方应为所有施工人员购买工伤保险或雇主责任险，施工期间发生的人身伤害事故由乙方负责。",relatedLaws:["xfw-26","mfw-497"],contractTypes:["renovation"],negotiationScript:{soft:"这条安全责任写的不对吧？工人在施工中受伤应该是你们公司负责啊，我作为业主又不能管工人安全。",firm:"施工安全是装修公司的法定义务，将工人工伤责任转嫁给业主违反消费者权益保护法第26条。我要求删除此条款，明确安全责任由乙方承担。"}},{id:"rp-030",keywords:["砍头息","预先.*扣除.*利息","实际.*到账.*少于.*本金","服务费.*从.*本金.*扣除"],level:"high",category:"hidden_fee",clauseTitle:"砍头息（预先扣息）",plainLanguage:'你借10万，对方先扣1万"利息"或"服务费"，实际到手只有9万，但你得按10万还本金和利息。',whyRisky:"民法典第670条明确规定，借款利息不得预先在本金中扣除。预先扣除的，按实际借款数额返还并计算利息。",suggestion:"删除预先扣费条款，按实际到账金额计算本金和利息。",suggestedText:"借款本金以实际到账金额为准，出借人不得预先从本金中扣除利息、服务费等任何费用。",relatedLaws:["mfw-670","mfw-680"],contractTypes:["loan"],negotiationScript:{soft:"这个预先扣费的做法好像不太合规，我查了下民法典说不能预先扣利息，咱们按实际到账金额算吧？",firm:"预先从本金中扣除费用违反民法典第670条，属于砍头息。我要求按实际到账金额计算本金和利息，否则不予借款。"}},{id:"rp-031",keywords:["年化利率.*3[0-9]%","年利率.*3[0-9]%","月息.*[3-9]%","日息.*0\\.[1-9]","综合.*年化.*3[0-9]"],level:"high",category:"interest_rate",clauseTitle:"利率超过法定上限",plainLanguage:"这个利率折算成年化超过36%了，远超法律保护范围（LPR的4倍约15%）。超出部分法院不支持。",whyRisky:"最高人民法院规定，民间借贷利率超过合同成立时一年期LPR的四倍的部分，法院不予支持。按当前LPR约3.45%计算，4倍约13.8%，超过部分无效。",suggestion:"将年化利率降至LPR的4倍以内（目前约13.8%以内）。",suggestedText:"借款年化利率不超过合同签订时一年期贷款市场报价利率（LPR）的四倍。",relatedLaws:["mfw-680","mjjd-2020-1"],contractTypes:["loan"],negotiationScript:{soft:"这个利率好像有点高了，我记得法律保护的范围是LPR的4倍，超出部分法院不支持，咱们能不能调低一点？",firm:"该利率超过LPR四倍的法定上限，超出部分不受法律保护。我要求将利率调整至LPR四倍以内，否则将向金融监管部门举报。"}},{id:"rp-032",keywords:["利滚利","复利","利息.*计入.*本金","逾期利息.*计入.*本金"],level:"high",category:"interest_rate",clauseTitle:"利滚利（复利条款）",plainLanguage:"你没还上的利息会被算进本金里继续生利息，越滚越多，最后可能翻好几倍。",whyRisky:"最高人民法院规定，借贷双方对逾期利息可以约定，但不得将利息计入本金计算复利。利滚利条款不受法律保护。",suggestion:"删除复利条款，利息不得计入本金重复计息。",suggestedText:"借款利息按单利计算，逾期利息不得计入本金重复计息。",relatedLaws:["mfw-680","mjjd-2020-1"],contractTypes:["loan"],negotiationScript:{soft:"利滚利这一条我接受不了，利上加利的话最后要还的太多了，咱们改成单利计算吧？",firm:"利滚利条款不受法律保护。我要求改为单利计算，否则不予签约。"}},{id:"rp-033",keywords:["授权.*通讯录","授权.*手机.*通讯录","读取.*通讯录","获取.*联系人","授权.*位置.*信息"],level:"high",category:"data_privacy",clauseTitle:"过度收集个人信息",plainLanguage:"借款合同要求你授权通讯录、位置等隐私信息。一旦你逾期，对方可能用你的通讯录骚扰你的亲友。",whyRisky:'个人信息保护法第13条规定，处理个人信息需取得个人同意，且限于"合同所必需"范围。通讯录、位置信息与借款无关，属于过度收集。',suggestion:"删除授权通讯录、位置等与借款无关的信息条款。",suggestedText:"甲方仅可收集与借款合同履行直接相关的必要信息，不得收集借款人通讯录、位置等与借款无关的个人信息。",relatedLaws:["xxbhf-13","mfw-497"],contractTypes:["loan"],negotiationScript:{soft:"授权通讯录这条我不太理解，借款跟我的手机通讯录有什么关系呢？能不能删掉这一条？",firm:"收集通讯录和位置信息与借款合同无关，违反个人信息保护法第13条。我要求删除此条款，否则不予签约。"}},{id:"rp-034",keywords:["提前还款.*违约金","提前还款.*手续费.*[0-9]%","提前.*还款.*需.*支付"],level:"medium",category:"hidden_fee",clauseTitle:"提前还款违约金过高",plainLanguage:"你想提前还清借款省利息，但对方要收你一笔违约金。有些平台收剩余本金的3-5%，提前还款反而亏了。",whyRisky:"提前还款违约金过高可能构成不公平条款。根据消费者权益保护法第26条，经营者不得利用格式条款加重消费者责任。合理的提前还款手续费一般不超过1%。",suggestion:'约定"提前还款不收取违约金"或"手续费不超过剩余本金的1%"。',suggestedText:"借款人可随时提前还款，提前还款不收取违约金。如收取手续费，不超过剩余本金的1%。",relatedLaws:["xfw-26","mfw-497"],contractTypes:["loan"],negotiationScript:{soft:"提前还款还要收违约金不太合理吧，我是提前还钱又不是不还，能不能免掉？",firm:"提前还款违约金过高加重借款人责任，违反消费者权益保护法第26条。我要求提前还款不收违约金，或手续费不超过1%。"}},{id:"rp-035",keywords:["账号.*归.*机构","账号.*归属.*甲方","账号.*归.*公司.*所有","解约.*账号.*不.*归还"],level:"high",category:"ip_ownership",clauseTitle:"账号归属归机构（最大陷阱）",plainLanguage:"你辛辛苦苦做起来的账号，合同却写归机构所有。解约后你什么都带不走，粉丝全归公司。",whyRisky:"账号归属是MCN合同的核心争议点。如果合同约定账号归机构，创作者解约后将失去所有粉丝积累。建议约定账号归创作者所有，机构仅有运营权。",suggestion:'修改为"账号归创作者本人所有，机构在合同期内享有运营权。解约后账号无条件归还创作者"。',suggestedText:"合同期内账号由双方共同运营。合同终止后，账号及所有粉丝数据无条件归还创作者本人，机构不得扣留或转移。",relatedLaws:["mfw-497"],contractTypes:["mcn"],negotiationScript:{soft:"账号是我自己做的，粉丝也是我积累的，这条说账号归公司不太合适吧？咱们改成账号归我，公司有运营权怎么样？",firm:"账号是我一手做起来的，粉丝是我的核心资产。账号归机构所有这一条我绝不接受，否则不会签约。"}},{id:"rp-036",keywords:["剩余.*合同期.*预期.*收益","违约金.*剩余.*收益","全部.*预期.*收益.*违约"],level:"high",category:"penalty",clauseTitle:"天价违约金（剩余收益赔偿）",plainLanguage:'你提前解约，违约金是"剩余合同期内全部预期收益"。如果你月入5万签了3年，解约要赔180万！',whyRisky:'以"剩余合同期预期收益"计算违约金明显畸高，远超机构实际损失。民法典第585条规定违约金过分高于损失可请求减少。合理违约金一般不超过3-6个月收益。',suggestion:'约定固定违约金，如"不超过解约前6个月平均月收入的6倍"。',suggestedText:"乙方提前解约的违约金为解约前6个月平均月收入的6倍，最高不超过10万元。",relatedLaws:["mfw-585","mfw-497"],contractTypes:["mcn"],negotiationScript:{soft:"这个违约金算下来太多了，万一以后需要解约我根本赔不起，咱们定个合理的数字吧，比如几个月收入？",firm:"以剩余合同期预期收益作为违约金明显畸高，违反民法典第585条。我要求改为固定金额或不超过6个月收入，否则不予签约。"}},{id:"rp-037",keywords:["独家.*全平台","全平台.*独家","所有.*平台.*独家.*合作","全网.*独家"],level:"high",category:"unfair_term",clauseTitle:"全平台独家期限过长",plainLanguage:"合同要求你在所有平台独家合作3年以上，这期间你不能在任何其他平台发布内容。",whyRisky:"全平台独家期限过长严重限制创作者发展。合理的独家期限一般不超过1-2年，且应约定机构的具体投入义务。超过3年的独家约定对创作者明显不利。",suggestion:'将独家期限缩短至1年以内，或约定"首年独家，次年起可协商多平台合作"。',suggestedText:"乙方在合同首年为全平台独家合作。第二年起，乙方可与甲方协商在指定平台开展非独家合作。",relatedLaws:["mfw-497"],contractTypes:["mcn"],negotiationScript:{soft:"3年全平台独家有点太长了，万一合作不愉快我就被绑死了，咱们缩短到1年怎么样？后面看合作情况再续。",firm:"3年全平台独家严重限制我的发展空间，期限不合理。我要求独家期限不超过1年，且需约定机构的具体投入义务。"}},{id:"rp-038",keywords:["到期.*自动.*续约","自动.*续展.*[0-9]*年","未.*书面.*通知.*自动.*续约","视为.*续约"],level:"medium",category:"unfair_term",clauseTitle:"自动续约陷阱",plainLanguage:"合同到期如果你忘了提前书面通知，就自动续约了。很多人因为忘了通知被多绑了好几年。",whyRisky:"自动续约条款要求创作者在特定时间前主动通知终止，否则视为续约，属于加重对方责任的格式条款。民法典第497条规定此类条款可能无效。",suggestion:'删除自动续约条款，改为"合同到期自然终止，如需续约双方另行签订书面协议"。',suggestedText:"合同到期自然终止。如需续约，双方应另行协商并签订书面续约协议。",relatedLaws:["mfw-497"],contractTypes:["mcn"],negotiationScript:{soft:"自动续约这条我容易忘记通知，万一忘了就被绑住了，咱们改成到期自然终止吧？想续再签。",firm:"自动续约条款加重了我的责任，民法典第497条规定此类格式条款可能无效。我要求删除自动续约，改为到期自然终止。"}},{id:"rp-039",keywords:["不得.*接.*私单","禁止.*私下.*接单","不得.*开设.*小号","禁止.*其他.*平台.*发布"],level:"medium",category:"rights_violation",clauseTitle:"限制创作者自由（禁私单/禁小号）",plainLanguage:"合同禁止你接私单、开小号、在其他平台发展。这意味着你被完全绑定在一家机构。",whyRisky:"合理竞业限制应在合同期内且范围有限。完全禁止创作者在其他平台发展、开设个人账号，过度限制个人自由，可能被认定为无效。",suggestion:'约定"合同期内不得在同一平台接私单，但不限制在其他平台以个人名义发展"。',suggestedText:"合同期内乙方不得在甲方运营的平台上接私单。但不限制乙方在其他平台以个人名义进行内容创作。",relatedLaws:["mfw-497"],contractTypes:["mcn"],negotiationScript:{soft:"完全禁止我在其他平台发展有点严格了，能不能只限制在你运营的平台上不接私单？其他平台让我自由发展。",firm:"完全限制我在所有平台的发展权不合理，过度限制个人自由。我要求仅限制在甲方运营的平台内不接私单，不限制其他平台的个人发展。"}},{id:"rp-040",keywords:["概不退费","一律.*不退","学费.*不退","报名.*后.*不.*退.*费","费用.*不予.*退还"],level:"high",category:"unfair_term",clauseTitle:'"概不退费"霸王条款',plainLanguage:'合同写"报名后概不退费"，但你可能上了一节课发现质量很差，想退费却被拒绝。',whyRisky:'消费者权益保护法第53条规定，经营者以预收款方式提供服务但未按约定提供的，应退回预付款。"概不退费"属于排除消费者主要权利的无效条款。',suggestion:'改为"退费按已消耗课时比例扣除后退还剩余费用，退费标准为XX元/课时"。',suggestedText:"乙方申请退费的，按已上课时数乘以单课时费用扣除后，退还剩余费用。退费应在15个工作日内完成。",relatedLaws:["xfw-53","xfw-26","mfw-497"],contractTypes:["education"],negotiationScript:{soft:'"概不退费"这一条太绝对了，万一课程不满意怎么办呢？咱们加个按比例退费的条款吧？',firm:'"概不退费"违反消费者权益保护法第53条，属于排除消费者主要权利的无效条款。我要求增加按比例退费条款，否则不予报名。'}},{id:"rp-041",keywords:["培训贷","分期.*贷款.*学费","向.*第三方.*贷款.*支付","教育.*分期"],level:"high",category:"hidden_fee",clauseTitle:"培训贷陷阱",plainLanguage:'培训机构让你向第三方贷款平台借款付学费，表面上是"分期付款"，实际是高息贷款，课程没上完贷款还得还。',whyRisky:"培训贷将消费者与贷款机构绑定，即使退费也无法停止还贷。消费者权益保护法第26条规定经营者不得利用格式条款加重消费者责任，诱导贷款涉嫌欺诈。",suggestion:'删除培训贷条款，改为"学费直接向培训机构支付，不涉及任何第三方贷款"。',suggestedText:"学费
