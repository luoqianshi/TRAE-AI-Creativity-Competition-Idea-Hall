<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B站UP主数据洞察 - Demo版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); min-height: 100vh; color: #e2e8f0; }
    .app { max-width: 900px; margin: 0 auto; padding: 20px; }
    
    .header { text-align: center; padding: 30px 0; }
    .header h1 { font-size: 28px; background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
    .header p { color: #94a3b8; font-size: 14px; }
    
    .search-box { background: rgba(30, 41, 59, 0.8); border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 24px rgba(0,0,0,0.3); }
    .search-box h2 { font-size: 16px; margin-bottom: 16px; color: #f1f5f9; }
    .search-input { width: 100%; padding: 12px 16px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: white; font-size: 14px; outline: none; transition: border-color 0.3s; }
    .search-input:focus { border-color: #3b82f6; }
    .search-btn { width: 100%; margin-top: 12px; padding: 12px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; transition: transform 0.2s; }
    .search-btn:hover { transform: translateY(-2px); }
    .examples { margin-top: 12px; font-size: 12px; color: #64748b; }
    .examples span { margin-right: 8px; padding: 4px 8px; background: rgba(59, 130, 246, 0.1); border-radius: 4px; cursor: pointer; }
    .examples span:hover { background: rgba(59, 130, 246, 0.2); }
    .demo-hint { margin-top: 8px; padding: 8px 12px; background: rgba(245, 158, 11, 0.1); border-radius: 6px; font-size: 12px; color: #f59e0b; }
    
    .card { background: rgba(30, 41, 59, 0.6); border-radius: 12px; padding: 20px; margin-bottom: 20px; backdrop-filter: blur(10px); }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    
    .user-card { display: flex; align-items: center; gap: 16px; }
    .avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 32px; color: white; }
    .user-info h3 { font-size: 20px; margin-bottom: 8px; }
    .user-meta { display: flex; gap: 20px; font-size: 14px; }
    .user-meta span { color: #94a3b8; }
    .user-meta strong { color: #3b82f6; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .stat-item { background: rgba(15, 23, 42, 0.5); border-radius: 8px; padding: 16px; text-align: center; }
    .stat-value { font-size: 20px; font-weight: 700; color: #3b82f6; }
    .stat-label { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    
    .chart-container { height: 200px; margin-top: 16px; }
    .bar-chart { display: flex; align-items: flex-end; justify-content: space-between; height: 100%; padding: 10px; }
    .bar { background: linear-gradient(180deg, #3b82f6, #1d4ed8); border-radius: 4px 4px 0 0; position: relative; transition: height 0.3s; cursor: pointer; }
    .bar:hover { background: linear-gradient(180deg, #60a5fa, #3b82f6); }
    .bar-label { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #94a3b8; white-space: nowrap; }
    .bar-tooltip { position: absolute; top: -40px; left: 50%; transform: translateX(-50%); background: #0f172a; padding: 4px 8px; border-radius: 4px; font-size: 12px; white-space: nowrap; display: none; z-index: 10; }
    .bar:hover .bar-tooltip { display: block; }
    
    .pie-chart-container { display: flex; justify-content: center; align-items: center; height: 100%; }
    .pie-svg { width: 150px; height: 150px; }
    .pie-center { width: 60px; height: 60px; background: #1e293b; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; text-align: center; position: absolute; }
    .pie-legend { margin-left: 30px; font-size: 13px; }
    .pie-legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .pie-dot { width: 12px; height: 12px; border-radius: 50%; }
    
    .analysis-section { margin-top: 16px; }
    .analysis-item { margin-bottom: 12px; padding: 12px; border-radius: 8px; background: rgba(15, 23, 42, 0.3); }
    .analysis-item h4 { font-size: 14px; margin-bottom: 8px; }
    .analysis-item.positive h4 { color: #10b981; }
    .analysis-item.negative h4 { color: #f59e0b; }
    .analysis-item.suggestion h4 { color: #3b82f6; }
    .analysis-item p { font-size: 13px; line-height: 1.6; color: #cbd5e1; }
    
    .video-list { margin-top: 16px; }
    .video-item { display: flex; gap: 12px; padding: 12px; border-radius: 8px; background: rgba(15, 23, 42, 0.3); margin-bottom: 8px; cursor: pointer; transition: background 0.2s; }
    .video-item:hover { background: rgba(15, 23, 42, 0.5); }
    .video-thumb { width: 120px; height: 80px; border-radius: 6px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; }
    .video-info { flex: 1; }
    .video-title { font-size: 14px; font-weight: 500; margin-bottom: 8px; }
    .video-stats { display: flex; gap: 16px; font-size: 12px; color: #64748b; }
    
    .loading { text-align: center; padding: 40px; }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(59, 130, 246, 0.3); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-top { background: linear-gradient(135deg, #f59e0b, #ef4444); color: white; }
    .badge-pro { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; }
    
    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: 1fr; }
      .user-card { flex-direction: column; text-align: center; }
      .user-meta { flex-wrap: wrap; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>📊 B站UP主数据洞察</h1>
      <p>输入UP主用户名，一键获取完整数据分析报告</p>
    </div>
    
    <div class="search-box">
      <h2>🔍 搜索UP主</h2>
      <input class="search-input" type="text" id="searchInput" placeholder="请输入B站UP主用户名...">
      <button class="search-btn" onclick="handleSearch()">开始分析</button>
      <div class="examples">
        示例：
        <span onclick="handleExample('老番茄')">老番茄</span>
        <span onclick="handleExample('何同学')">何同学</span>
        <span onclick="handleExample('罗翔说刑法')">罗翔说刑法</span>
      </div>
      <div class="demo-hint">💡 演示版仅支持搜索：老番茄、何同学、罗翔说刑法</div>
    </div>
    
    <div id="loading" style="display: none;" class="loading">
      <div class="loading-spinner"></div>
      <p>正在分析数据...</p>
    </div>
    
    <div id="error" style="display: none;" class="card">
      <p style="color: #ef4444; text-align: center;">⚠️ <span id="errorText"></span></p>
    </div>
    
    <div id="content" style="display: none;"></div>
  </div>
  
  <script>
    const mockUsers = {
      '老番茄': {
        name: '老番茄',
        avatar: 'L',
        fans: 20500000,
        likes: 35000000,
        videos: 665,
        tier: '顶流UP主',
        stats: { avgViews: 3500000, likeRate: 4.5, commentRate: 0.8, shareRate: 0.3 },
        videosData: [
          { title: '老番茄的超级马里奥', views: 33820636, likes: 1858379, comments: 145568 },
          { title: '史上最骚侦探', views: 31423494, likes: 1863451, comments: 241256 },
          { title: '猫和老鼠', views: 27513139, likes: 883633, comments: 196832 },
          { title: '你画我猜', views: 25445540, likes: 919740, comments: 268370 },
          { title: '超级马里奥2', views: 22020540, likes: 1501286, comments: 373655 }
        ],
        strengths: ['粉丝基数庞大，拥有超过2000万忠实粉丝，头部效应明显', '平均播放量高达350万，内容吸引力极强', '点赞率4.5%，处于行业领先水平', '代表作《老番茄的超级马里奥》播放量突破3300万，形成品牌记忆'],
        weaknesses: ['头部效应下增长放缓，需突破流量天花板', '内容创新压力大，观众期待值持续升高'],
        suggestions: ['建立稳定更新节奏，建议每周1-2条', '继续保持当前内容风格，围绕高点赞作品做选题延伸', '尝试固定封面风格与标题结构，强化账号辨识度'],
        summary: '老番茄目前属于「顶流UP主」梯队，账号处于稳定运营状态。近期内容的观众互动高粘性，选题方向与平台推荐机制有较好的契合度。代表作《老番茄的超级马里奥》已形成一定的品牌记忆，可作为后续选题延伸的锚点。'
      },
      '何同学': {
        name: '何同学',
        avatar: 'H',
        fans: 10200000,
        likes: 28000000,
        videos: 120,
        tier: '头部UP主',
        stats: { avgViews: 2800000, likeRate: 6.2, commentRate: 1.2, shareRate: 0.8 },
        videosData: [
          { title: '5G到底有多快', views: 20645678, likes: 1567890, comments: 234567 },
          { title: '苹果发布会', views: 18543210, likes: 1234567, comments: 189012 },
          { title: 'AirPods Pro测评', views: 16789012, likes: 987654, comments: 156789 },
          { title: '自制AirDesk', views: 15432109, likes: 876543, comments: 212345 },
          { title: '我做了一个遥控器', views: 14321098, likes: 765432, comments: 178901 }
        ],
        strengths: ['技术内容质量极高，全网影响力突出', '点赞率6.2%，处于极高粘性区间', '评论率1.2%，观众互动积极性高', '内容选题独特，科技+人文结合，差异化优势明显'],
        weaknesses: ['视频产量较低，更新频率不稳定', '增长速度面临瓶颈，需探索新的流量增长点'],
        suggestions: ['在保持内容质量的前提下，适当提高更新频率', '围绕「科技体验」方向做系列化内容', '增加粉丝向内容（QA、幕后），强化社群温度'],
        summary: '何同学目前属于「头部UP主」梯队，技术内容质量极高。近期内容的观众互动极高粘性，代表作《5G到底有多快》已形成广泛影响力，可作为后续选题延伸的锚点。'
      },
      '罗翔说刑法': {
        name: '罗翔说刑法',
        avatar: 'L',
        fans: 18500000,
        likes: 52000000,
        videos: 850,
        tier: '顶流UP主',
        stats: { avgViews: 1200000, likeRate: 8.5, commentRate: 2.1, shareRate: 1.2 },
        videosData: [
          { title: '法外狂徒张三', views: 15678901, likes: 1234567, comments: 345678 },
          { title: '正当防卫解析', views: 14321098, likes: 987654, comments: 289012 },
          { title: '法律与道德', views: 12123456, likes: 876543, comments: 234567 },
          { title: '刑法修正案解读', views: 11234567, likes: 765432, comments: 212345 },
          { title: '刑法的边界', views: 10432109, likes: 654321, comments: 189012 }
        ],
        strengths: ['法律专业度极高，知识权威性强', '点赞率8.5%，处于极高粘性区间', '评论率2.1%，观众讨论热情高涨', '内容兼具知识性与趣味性，传播力极强'],
        weaknesses: ['头部竞争激烈，差异化定位需持续强化', '内容创新压力大，观众期待值持续升高'],
        suggestions: ['持续深耕法律科普领域，强化专业壁垒', '尝试多元化内容形式，拓展受众边界', '建立固定栏目，增强观众期待感'],
        summary: '罗翔说刑法目前属于「顶流UP主」梯队，法律专业度极高。近期内容的观众互动极高粘性，代表作《法外狂徒张三》系列已形成广泛影响力，账号具备在垂直内容上进一步放大影响力的潜力。'
      }
    };
    
    function formatNumber(num) {
      if (num >= 100000000) return (num / 100000000).toFixed(1) + '亿';
      if (num >= 10000) return (num / 10000).toFixed(1) + '万';
      return num.toLocaleString();
    }
    
    function renderBarChart(data) {
      const maxValue = Math.max(...data.map(d => d.views));
      return `<div class="bar-chart">${data.map(d => {
        const height = (d.views / maxValue) * 80 + '%';
        return `<div class="bar" style="height:${height};width:16%;">
          <div class="bar-tooltip">${formatNumber(d.views)}</div>
          <div class="bar-label">${d.title.substring(0, 6)}...</div>
        </div>`;
      }).join('')}</div>`;
    }
    
    function renderPieChart(stats) {
      const total = stats.likeRate + stats.commentRate + stats.shareRate;
      const colors = ['#3b82f6', '#8b5cf6', '#ec4899'];
      const data = [
        { name: '点赞率', value: stats.likeRate },
        { name: '评论率', value: stats.commentRate },
        { name: '分享率', value: stats.shareRate }
      ];
      
      let svgContent = '';
      let startAngle = 0;
      const centerX = 75;
      const centerY = 75;
      const radius = 50;
      
      data.forEach((d, i) => {
        const angle = (d.value / total) * 360;
        const endAngle = startAngle + angle;
        
        const startRad = (startAngle - 90) * Math.PI / 180;
        const endRad = (endAngle - 90) * Math.PI / 180;
        
        const x1 = centerX + radius * Math.cos(startRad);
        const y1 = centerY + radius * Math.sin(startRad);
        const x2 = centerX + radius * Math.cos(endRad);
        const y2 = centerY + radius * Math.sin(endRad);
        
        const largeArcFlag = angle > 180 ? 1 : 0;
        
        svgContent += `<path d="M${centerX},${centerY} L${x1},${y1} A${radius},${radius} 0 ${largeArcFlag},1 ${x2},${y2} Z" fill="${colors[i]}"/>`;
        
        startAngle = endAngle;
      });
      
      const legend = data.map((d, i) => 
        `<div class="pie-legend-item"><div class="pie-dot" style="background:${colors[i]}"></div>${d.name}: ${d.value}%</div>`
      ).join('');
      
      return `<div class="pie-chart-container" style="position:relative;">
        <svg class="pie-svg" viewBox="0 0 150 150">${svgContent}</svg>
        <div class="pie-center">互动<br/>指标</div>
        <div class="pie-legend">${legend}</div>
      </div>`;
    }
    
    function renderUserCard(user) {
      const badgeClass = user.tier.includes('顶流') ? 'badge-top' : 'badge-pro';
      return `<div class="card">
        <div class="card-title">
          <span>👤</span> 用户信息
          <span class="badge ${badgeClass}">${user.tier}</span>
        </div>
        <div class="user-card">
          <div class="avatar">${user.avatar}</div>
          <div class="user-info">
            <h3>${user.name}</h3>
            <div class="user-meta">
              <span>粉丝：<strong>${formatNumber(user.fans)}</strong></span>
              <span>获赞：<strong>${formatNumber(user.likes)}</strong></span>
              <span>视频：<strong>${user.videos}</strong></span>
            </div>
          </div>
        </div>
      </div>`;
    }
    
    function renderStatsGrid(stats) {
      return `<div class="card">
        <div class="card-title">📈 核心数据指标</div>
        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-value">${formatNumber(stats.avgViews)}</div>
            <div class="stat-label">平均播放量</div>
          </div>
          <div class="stat-item">
            <div class="stat-value">${stats.likeRate}%</div>
            <div class="stat-label">点赞率</div>
          </div>
          <div class="stat-item">
            <div class="stat-value">${stats.commentRate}%</div>
            <div class="stat-label">评论率</div>
          </div>
        </div>
      </div>`;
    }
    
    function renderAnalysis(user) {
      const strengths = user.strengths.map(s => `<div class="analysis-item positive"><p>${s}</p></div>`).join('');
      const weaknesses = user.weaknesses.map(w => `<div class="analysis-item negative"><p>${w}</p></div>`).join('');
      const suggestions = user.suggestions.map(s => `<div class="analysis-item suggestion"><p>${s}</p></div>`).join('');
      
      return `<div class="card">
        <div class="card-title">💡 AI分析报告</div>
        <p style="font-size:14px;line-height:1.6;margin-bottom:16px;color:#cbd5e1;">${user.summary}</p>
        <div class="analysis-section">
          <h4 style="font-size:15px;margin-bottom:12px;color:#10b981;">✅ 优势分析</h4>
          ${strengths}
        </div>
        <div class="analysis-section">
          <h4 style="font-size:15px;margin-bottom:12px;color:#f59e0b;">⚠️ 潜在不足</h4>
          ${weaknesses}
        </div>
        <div class="analysis-section">
          <h4 style="font-size:15px;margin-bottom:12px;color:#3b82f6;">💬 运营建议</h4>
          ${suggestions}
        </div>
      </div>`;
    }
    
    function renderVideoList(videos) {
      return `<div class="card">
        <div class="card-title">🎬 热门视频</div>
        <div class="video-list">
          ${videos.map(v => `<div class="video-item">
            <div class="video-thumb">🎬</div>
            <div class="video-info">
              <div class="video-title">${v.title}</div>
              <div class="video-stats">
                <span>👁️ ${formatNumber(v.views)}</span>
                <span>👍 ${formatNumber(v.likes)}</span>
                <span>💬 ${formatNumber(v.comments)}</span>
              </div>
            </div>
          </div>`).join('')}
        </div>
      </div>`;
    }
    
    function renderContent(user) {
      return `
        ${renderUserCard(user)}
        ${renderStatsGrid(user.stats)}
        <div class="card">
          <div class="card-title">📊 视频数据排行</div>
          <div class="chart-container">${renderBarChart(user.videosData)}</div>
        </div>
        <div class="card">
          <div class="card-title">🎯 互动指标分布</div>
          <div class="chart-container">${renderPieChart(user.stats)}</div>
        </div>
        ${renderAnalysis(user)}
        ${renderVideoList(user.videosData)}
      `;
    }
    
    function handleSearch() {
      const query = document.getElementById('searchInput').value.trim();
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const content = document.getElementById('content');
      const errorText = document.getElementById('errorText');
      
      if (!query) {
        errorText.textContent = '请输入用户名';
        error.style.display = 'block';
        content.style.display = 'none';
        return;
      }
      
      error.style.display = 'none';
      loading.style.display = 'block';
      content.style.display = 'none';
      
      setTimeout(() => {
        const user = mockUsers[query];
        loading.style.display = 'none';
        
        if (user) {
          content.innerHTML = renderContent(user);
          content.style.display = 'block';
        } else {
          errorText.textContent = '演示版仅支持搜索：老番茄、何同学、罗翔说刑法';
          error.style.display = 'block';
        }
      }, 1500);
    }
    
    function handleExample(name) {
      document.getElementById('searchInput').value = name;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'none';
      document.getElementById('content').style.display = 'none';
    }
    
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSearch();
    });
  </script>
</body>
</html>
