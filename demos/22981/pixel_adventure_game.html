<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MONITO ADVENTURES v0.32</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a1a;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            touch-action: none;
            width: 100vw;
            height: 100vh;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            border: none;
            border-radius: 0;
            box-shadow: none;
            background: #1a1a1a;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #e8d5a3;
            font-size: 12px;
            text-shadow: 2px 2px 0 #1a1a2e;
            pointer-events: none;
            z-index: 10;
            line-height: 1.6;
        }
        #versionTag {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #5a8a9a;
            font-size: 10px;
            text-shadow: 1px 1px 0 #1a1a2e;
            pointer-events: none;
            z-index: 10;
        }
        #timeIndicator {
            position: absolute;
            top: 28px;
            left: 10px;
            pointer-events: none;
            z-index: 10;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #8fb8c9;
            font-size: 11px;
            text-align: center;
            text-shadow: 1px 1px 0 #1a1a2e;
            pointer-events: none;
            z-index: 10;
            opacity: 0.8;
        }
        #transitionOverlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
            z-index: 100;
        }
        #transitionOverlay.active { opacity: 1; }
        .scanlines {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 2px,
                rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px
            );
            pointer-events: none;
            z-index: 15;
        }
        }
        #minimap {
            position: absolute;
            bottom: 40px;
            right: 10px;
            border: 2px solid rgba(45, 74, 92, 0.7);
            border-radius: 4px;
            z-index: 10;
            pointer-events: none;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <canvas id="minimap" width="120" height="90" style="display:none;"></canvas>
        <div id="ui" style="display:none;">
            <div id="sceneName">🌸 金色花田</div>
            <div id="coords">X: 400 Y: 300</div>
            <div id="orbCounter">✨ 0/20</div>
        </div>
        <div id="timeIndicator" style="display:none;">
            <canvas id="timeCanvas" width="60" height="12"></canvas>
        </div>
        <div id="versionTag" style="display:none;">v0.32</div>
        <div id="transitionOverlay"></div>
        <div class="scanlines"></div>
    </div>

    <script>
    // ================================================================
    // MONITO ADVENTURES v0.32 — 低优先级功能添加
    // 在 v0.29 基础上新增：
    //   1. 天气系统 — 场景独特天气效果
    //   2. NPC系统 — 场景NPC与对话
    //   3. 互动元素 — 可推石头、可钓鱼水域
    //   4. 任务系统 — 收集光球目标
    //   5. 存档功能 — localStorage
    //   6. 宝箱系统
    //   7. 传送门系统
    //   8. 角色升级系统
    // ================================================================

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const minimapCanvas = document.getElementById('minimap');
    const minimapCtx = minimapCanvas.getContext('2d');
    const timeCanvas = document.getElementById('timeCanvas');
    const timeCtx = timeCanvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    minimapCtx.imageSmoothingEnabled = false;
    timeCtx.imageSmoothingEnabled = false;

    // ==================== 帧率独立 ====================
    let lastTime = 0;
    let deltaTime = 1 / 60;
    let fpsCounter = 0;
    let fpsTimer = 0;
    let currentFps = 60;

    // ==================== 音效引擎 ====================
    const AudioEngine = {
        ctx: null,
        masterGain: null,
        volume: 0.5,
        muted: false,
        initialized: false,
        footstepCooldown: 0,
        ambientNodes: [],
        lastPhase: '',

        init() {
            if (this.initialized) return;
            try {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = this.volume;
                this.masterGain.connect(this.ctx.destination);
                this.initialized = true;
            } catch(e) { console.log('Web Audio API not available'); }
        },
        resume() {
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        },
        setVolume(v) {
            this.volume = Math.max(0, Math.min(1, v));
            if (this.masterGain) {
                this.masterGain.gain.setTargetAtTime(this.muted ? 0 : this.volume, this.ctx.currentTime, 0.05);
            }
            const pct = Math.round(this.volume * 100);
        },
        toggleMute() {
            this.muted = !this.muted;
            this.setVolume(this.volume);
        },
        createNoiseBuffer(duration) {
            const sr = this.ctx.sampleRate;
            const len = sr * duration;
            const buffer = this.ctx.createBuffer(1, len, sr);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
            return buffer;
        },
        playFootstep(scene) {
            if (!this.initialized || this.footstepCooldown > 0) return;
            this.footstepCooldown = 0.25;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(scene === 'flowerField' ? 80 : 60, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(now);
            osc.stop(now + 0.1);

            const noise = this.ctx.createBufferSource();
            const noiseGain = this.ctx.createGain();
            const filter = this.ctx.createBiquadFilter();
            noise.buffer = this.createNoiseBuffer(0.06);
            filter.type = 'bandpass';
            filter.frequency.value = scene === 'flowerField' ? 3000 : 1500;
            filter.Q.value = 1;
            noiseGain.gain.setValueAtTime(scene === 'flowerField' ? 0.06 : 0.04, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
            noise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(this.masterGain);
            noise.start(now);
            noise.stop(now + 0.06);
        },
        playTransition() {
            if (!this.initialized) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(440, now + 0.4);
            osc.frequency.exponentialRampToValueAtTime(330, now + 0.8);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.linearRampToValueAtTime(0.12, now + 0.3);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(now);
            osc.stop(now + 0.8);
        },
        startAmbient(scene) {
            this.stopAmbient();
            if (!this.initialized) return;
            const now = this.ctx.currentTime;
            const noise = this.ctx.createBufferSource();
            noise.buffer = this.createNoiseBuffer(4);
            noise.loop = true;
            const noiseGain = this.ctx.createGain();
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = scene === 'flowerField' ? 400 : 300;
            filter.Q.value = 0.5;
            noiseGain.gain.value = scene === 'flowerField' ? 0.02 : 0.025;
            noise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(this.masterGain);
            noise.start(now);
            this.ambientNodes.push(noise, noiseGain, filter);

            if (scene === 'pillarSea') {
                const waterOsc = this.ctx.createOscillator();
                const waterGain = this.ctx.createGain();
                waterOsc.type = 'sine';
                waterOsc.frequency.value = 120;
                const lfo = this.ctx.createOscillator();
                const lfoGain = this.ctx.createGain();
                lfo.frequency.value = 0.3;
                lfoGain.gain.value = 20;
                lfo.connect(lfoGain);
                lfoGain.connect(waterOsc.frequency);
                waterGain.gain.value = 0.015;
                waterOsc.connect(waterGain);
                waterGain.connect(this.masterGain);
                waterOsc.start(now);
                lfo.start(now);
                this.ambientNodes.push(waterOsc, waterGain, lfo, lfoGain);
            }
        },
        stopAmbient() {
            this.ambientNodes.forEach(node => {
                try { if (node.stop) node.stop(); node.disconnect(); } catch(e) {}
            });
            this.ambientNodes = [];
        },
        updateDayNightAmbient(phase) {
            if (phase === this.lastPhase || !this.initialized) return;
            this.lastPhase = phase;
            const now = this.ctx.currentTime;
            if (phase === 'night') {
                for (let i = 0; i < 3; i++) {
                    const delay = i * 0.8 + Math.random() * 0.5;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = 4000 + Math.random() * 2000;
                    gain.gain.setValueAtTime(0, now + delay);
                    gain.gain.linearRampToValueAtTime(0.02, now + delay + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.05);
                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start(now + delay);
                    osc.stop(now + delay + 0.05);
                }
            }
            if (phase === 'dawn') {
                for (let i = 0; i < 2; i++) {
                    const delay = i * 1.2 + Math.random() * 0.3;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800 + Math.random() * 400, now + delay);
                    osc.frequency.exponentialRampToValueAtTime(2000 + Math.random() * 500, now + delay + 0.1);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + delay + 0.15);
                    gain.gain.setValueAtTime(0.03, now + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.2);
                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start(now + delay);
                    osc.stop(now + delay + 0.2);
                }
            }
        },
        update(dt) {
            if (this.footstepCooldown > 0) this.footstepCooldown -= dt;
        },
        // 摸头音效 — 柔和上升音
        playPetSound() {
            if (!this.initialized) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(500, now + 0.2);
            osc.frequency.exponentialRampToValueAtTime(400, now + 0.4);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(now);
            osc.stop(now + 0.4);
        },
        // 呼唤音效 — 短促双音
        playCallSound() {
            if (!this.initialized) return;
            const now = this.ctx.currentTime;
            for (let i = 0; i < 2; i++) {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = 600 + i * 100;
                gain.gain.setValueAtTime(0.05, now + i * 0.15);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.12);
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start(now + i * 0.15);
                osc.stop(now + i * 0.15 + 0.12);
            }
        },
        // 逗玩音效 — 跳跃音符
        playPlaySound() {
            if (!this.initialized) return;
            const now = this.ctx.currentTime;
            const notes = [400, 500, 600, 500];
            notes.forEach((freq, i) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.04, now + i * 0.12);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.1);
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start(now + i * 0.12);
                osc.stop(now + i * 0.12 + 0.1);
            });
        }
    };

    function ensureAudioInit() {
        if (!AudioEngine.initialized) {
            AudioEngine.init();
            AudioEngine.startAmbient(GameState.currentScene);
        } else {
            AudioEngine.resume();
        }
    }

    // ==================== 昼夜循环 ====================
    const DayNight = {
        timeOfDay: 0.35,
        speed: 0.008,
        timeSpeed: 1,
        ambientR: 0, ambientG: 0, ambientB: 0,
        ambientAlpha: 0,
        sunAngle: 0,
        sunIntensity: 1,
        getPhase() {
            const t = this.timeOfDay;
            if (t < 0.2) return 'night';
            if (t < 0.3) return 'dawn';
            if (t < 0.7) return 'day';
            if (t < 0.8) return 'dusk';
            return 'night';
        },
        getPhaseName() {
            const phase = this.getPhase();
            return { night: '🌙 夜晚', dawn: '🌅 黎明', day: '☀️ 白天', dusk: '🌇 黄昏' }[phase];
        },
        update(dt) {
            this.timeOfDay = (this.timeOfDay + this.speed * this.timeSpeed * dt) % 1;
            this.sunAngle = this.timeOfDay * Math.PI * 2 - Math.PI / 2;
            this.sunIntensity = Math.max(0, Math.sin(this.timeOfDay * Math.PI * 2 - Math.PI / 2));
            const phase = this.getPhase();
            if (phase === 'night') {
                this.ambientR = 5; this.ambientG = 8; this.ambientB = 25;
                this.ambientAlpha = 0.7;
            } else if (phase === 'dawn') {
                const t = (this.timeOfDay - 0.2) / 0.1;
                this.ambientR = 10 + t * 40; this.ambientG = 15 + t * 20; this.ambientB = 40 - t * 10;
                this.ambientAlpha = 0.55 - t * 0.35;
            } else if (phase === 'day') {
                this.ambientR = 50; this.ambientG = 35; this.ambientB = 30;
                this.ambientAlpha = 0.2 - this.sunIntensity * 0.1;
            } else if (phase === 'dusk') {
                const t = (this.timeOfDay - 0.7) / 0.1;
                this.ambientR = 50 + t * 20; this.ambientG = 35 - t * 20; this.ambientB = 30 + t * 20;
                this.ambientAlpha = 0.2 + t * 0.35;
            }
        },
        drawOverlay(ctx) {
            // 黑夜覆盖层 - 覆盖整个画面包括天空
            ctx.fillStyle = `rgba(${this.ambientR}, ${this.ambientG}, ${this.ambientB}, ${this.ambientAlpha})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (this.ambientAlpha > 0.3) {
                const px = Player.x - GameState.camera.x;
                 const py = Player.y - GameState.camera.y;
                 // 角色周围光源（更大更柔和）
                const lightRadius = 150 + this.sunIntensity * 80;
                const grad = ctx.createRadialGradient(px, py, 0, px, py, lightRadius);
                grad.addColorStop(0, `rgba(255, 230, 180, ${this.ambientAlpha * 0.6})`);
                grad.addColorStop(0.3, `rgba(255, 210, 140, ${this.ambientAlpha * 0.3})`);
                grad.addColorStop(0.7, `rgba(255, 190, 100, ${this.ambientAlpha * 0.1})`);
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.fillRect(px - lightRadius, py - lightRadius, lightRadius * 2, lightRadius * 2);

                // 小猫也有小光源
                const cx = Cat.x - GameState.camera.x;
                const cy = Cat.y - GameState.camera.y;
                const catGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 40);
                catGrad.addColorStop(0, `rgba(255, 220, 150, ${this.ambientAlpha * 0.25})`);
                catGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = catGrad;
                ctx.fillRect(cx - 40, cy - 40, 80, 80);
            }
            if (this.getPhase() === 'dawn' || this.getPhase() === 'dusk') {
                const px = Player.x - GameState.camera.x;
                const py = Player.y - GameState.camera.y;
                const grad = ctx.createRadialGradient(px, py - 20, 0, px, py - 20, 80);
                grad.addColorStop(0, 'rgba(255, 180, 80, 0.08)');
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.fillRect(px - 80, py - 100, 160, 160);
            }
        },
        drawTimeBar(ctx) {
            const w = timeCanvas.width;
            const h = timeCanvas.height;
            timeCtx.clearRect(0, 0, w, h);
            timeCtx.fillStyle = 'rgba(0,0,0,0.5)';
            timeCtx.fillRect(0, 0, w, h);
            for (let x = 0; x < w; x++) {
                const t = x / w;
                let r, g, b;
                if (t < 0.2 || t > 0.8) { r = 20; g = 25; b = 60; }
                else if (t < 0.3) { r = 200; g = 120; b = 60; }
                else if (t < 0.7) { r = 100; g = 160; b = 220; }
                else { r = 200; g = 100; b = 50; }
                timeCtx.fillStyle = `rgb(${r},${g},${b})`;
                timeCtx.fillRect(x, 1, 1, h - 2);
            }
            const cx = this.timeOfDay * w;
            timeCtx.fillStyle = '#fff';
            timeCtx.fillRect(cx - 1, 0, 2, h);
        }
    };

    // ==================== 游戏状态 ====================
    const GameState = {
        currentScene: 'flowerField',
        transitioning: false,
        camera: { x: 0, y: 0 },
        worldWidth: 1600,
        worldHeight: 1200,
        keys: {},
        orbs: [],
        orbsCollected: 0,
        orbsTotal: 0,
        butterflies: [],
        time: 0,
        footprints: [],
        maxFootprints: 80,
        weather: { type: 'calm', intensity: 0, windDir: 1, rainTimer: 0 },
        expandingOrbs: [],
        collectParticles: [],
        bubbles: [],
        // 天气效果数据
        weatherEffects: {
            rainDrops: [],
            ripples: [],
            seaDust: [],
            fishSchools: [],
            cloudFluffs: [],
            sunBeams: []
        },
        // NPC对话状态
        npcDialog: { active: false, text: '', timer: 0, targetNpc: null },
        // 钓鱼状态
        fishing: { active: false, timer: 0, spot: null },
        // 任务系统
        quests: {
            current: { id: 'collect_orbs', name: '收集光球', target: 5, current: 0, completed: false },
            completed: []
        },
        questCompletedTimer: 0,
        // 传送门粒子
        portalParticles: [],
        // 升级提示
        levelUpTimer: 0,
        // 场景切换提示
        sceneHint: { text: '', timer: 0, opacity: 0 },
        // 统计变量（成就系统用）
        totalChestsOpened: 0,
        visitedScenes: new Set(['flowerField']),
        totalFishCaught: 0,
        npcTalked: new Set(),
        frameCount: 0,
        // 成就系统
        achievements: {
            list: [
                { id: 'first_orb', name: '初见光球', desc: '收集第1个光球', unlocked: false, condition: () => GameState.orbsCollected >= 1 },
                { id: 'orb_10', name: '光球猎人', desc: '收集10个光球', unlocked: false, condition: () => GameState.orbsCollected >= 10 },
                { id: 'orb_50', name: '光球大师', desc: '收集50个光球', unlocked: false, condition: () => GameState.orbsCollected >= 50 },
                { id: 'chest_1', name: '开箱达人', desc: '打开第1个宝箱', unlocked: false, condition: () => GameState.totalChestsOpened >= 1 },
                { id: 'chest_10', name: '宝箱猎人', desc: '打开10个宝箱', unlocked: false, condition: () => GameState.totalChestsOpened >= 10 },
                { id: 'level_5', name: '冒险进阶', desc: '达到5级', unlocked: false, condition: () => Player.level >= 5 },
                { id: 'explore_all', name: '探索者', desc: '访问所有场景', unlocked: false, condition: () => (GameState.visitedScenes || new Set()).size >= 4 },
                { id: 'fish_1', name: '钓鱼新手', desc: '成功钓到鱼', unlocked: false, condition: () => (GameState.totalFishCaught || 0) >= 1 },
                { id: 'npc_all', name: '社交达人', desc: '与所有NPC对话', unlocked: false, condition: () => (GameState.npcTalked || new Set()).size >= 4 },
            ],
            notification: null,
            totalUnlocked: 0
        },
        // 昼夜循环
        dayNight: {
            cycle: 0,        // 0-1 循环值
            speed: 0.00003,  // 循环速度（约 55 秒一个完整昼夜）
            currentPhase: 'day' // day, dusk, night, dawn
        }
    };

    // ==================== 角色 ====================
    const Player = {
        x: 400, y: 300,
        width: 24, height: 32,
        speed: 150,
        direction: 'down',
        isMoving: false,
        animFrame: 0,
        animTimer: 0,
        footprintTimer: 0,
        idleTime: 0,
        blinkTimer: 0,
        isBlinking: false,
        name: '冒险者',
        nameColor: '#e8d5a3',
        level: 1,
        exp: 0,
        colors: {
            skin: '#f4d0a4', hair: '#5c3a1e',
            shirt: '#c0392b', pants: '#2c3e50',
            shoes: '#1a1a1a', cloak: '#8b4513', cloakLight: '#a0522d'
        },
        costumes: {
            current: 'default',
            unlocked: ['default'],
            list: {
                default: { name: '冒险者', shirt: '#c0392b', pants: '#2c3e50', cloak: '#8b4513' },
                ocean: { name: '海洋行者', shirt: '#2980b9', pants: '#1a5276', cloak: '#1a3a5a' },
                forest: { name: '森林守卫', shirt: '#27ae60', pants: '#1a5a2a', cloak: '#2a4a1a' },
            }
        },
        costumeSwitchTimer: 0,
        // 开场动画
        intro: {
            active: true,
            phase: 0, // 0=淡入标题, 1=显示副标题, 2=淡出, 3=开始游戏
            timer: 0,
            alpha: 0
        }
    };

    // ==================== 命名系统 ====================
    const NameSystem = {
        isEditing: false,
        inputEl: null,
        nameHitbox: { x: 0, y: 0, w: 0, h: 0 },

        drawName(px, py) {
            const camX = GameState.camera.x;
            const camY = GameState.camera.y;
            const name = Player.name;
            const fontSize = 10;
            ctx.font = `${fontSize}px 'Courier New', monospace`;
            const textWidth = ctx.measureText(name).width;
            const nameX = px - textWidth / 2;
            const nameY = py - 22;

            // 保存点击检测区域（屏幕坐标）
            this.nameHitbox = {
                x: nameX + camX,
                y: nameY + camY - fontSize,
                w: textWidth,
                h: fontSize + 4
            };

            // 名字背景（半透明底板）
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(nameX - 4, nameY - fontSize - 1, textWidth + 8, fontSize + 4);
            // 名字边框
            ctx.strokeStyle = 'rgba(232, 213, 163, 0.3)';
            ctx.lineWidth = 1;
            ctx.strokeRect(nameX - 4, nameY - fontSize - 1, textWidth + 8, fontSize + 4);

            // 名字文字
            ctx.fillStyle = Player.nameColor;
            ctx.textAlign = 'center';
            ctx.fillText(name, px, nameY);
            ctx.textAlign = 'left';
        },

        checkClick(screenX, screenY) {
            // 检测角色名字
            const hb = this.nameHitbox;
            const inPlayerHitbox = screenX >= hb.x - GameState.camera.x &&
                           screenX <= hb.x - GameState.camera.x + hb.w &&
                           screenY >= hb.y - GameState.camera.y &&
                           screenY <= hb.y - GameState.camera.y + hb.h;
            if (inPlayerHitbox && !this.isEditing) {
                this.showInput(Player, '✏️ 输入你的名字');
                return true;
            }
            // 检测小猫名字
            const chb = Cat.nameHitbox;
            const inCatHitbox = screenX >= chb.x - GameState.camera.x &&
                           screenX <= chb.x - GameState.camera.x + chb.w &&
                           screenY >= chb.y - GameState.camera.y &&
                           screenY <= chb.y - GameState.camera.y + chb.h;
            if (inCatHitbox && !this.isEditing) {
                this.showInput(Cat, '🐱 输入小猫的名字');
                return true;
            }
            return false;
        },

        showInput(target, labelText) {
            if (this.isEditing) return;
            this.isEditing = true;

            // 创建输入框
            this.inputEl = document.createElement('input');
            this.inputEl.type = 'text';
            this.inputEl.value = target.name;
            this.inputEl.maxLength = 12;
            this.inputEl.style.cssText = `
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(10, 15, 30, 0.95);
                border: 2px solid #2d7d8a;
                border-radius: 8px;
                color: #e8d5a3;
                font-family: 'Courier New', monospace;
                font-size: 16px;
                padding: 12px 20px;
                text-align: center;
                outline: none;
                z-index: 100;
                width: 200px;
                box-shadow: 0 0 20px rgba(45, 125, 138, 0.5);
            `;

            // 提示文字
            const label = document.createElement('div');
            label.textContent = labelText;
            label.style.cssText = `
                position: absolute;
                top: calc(50% - 50px);
                left: 50%;
                transform: translateX(-50%);
                color: #8fb8c9;
                font-family: 'Courier New', monospace;
                font-size: 12px;
                z-index: 100;
                text-shadow: 1px 1px 2px #000;
            `;

            document.getElementById('gameContainer').appendChild(label);
            document.getElementById('gameContainer').appendChild(this.inputEl);
            this.inputEl.focus();
            this.inputEl.select();

            // 确认命名
            const confirm = () => {
                const newName = this.inputEl.value.trim();
                if (newName) {
                    target.name = newName;
                }
                this.closeInput(label);
            };

            this.inputEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') confirm();
                if (e.key === 'Escape') this.closeInput(label);
            });

            this.inputEl.addEventListener('blur', () => {
                setTimeout(() => confirm(), 100);
            });
        },

        closeInput(label) {
            if (this.inputEl) {
                this.inputEl.remove();
                this.inputEl = null;
            }
            if (label) label.remove();
            this.isEditing = false;
        }
    };

    // ==================== 小猫伙伴 ====================
    const Cat = {
        x: 420, y: 320,
        width: 14, height: 12,
        speed: 80,
        direction: 'down',
        isMoving: false,
        animFrame: 0,
        animTimer: 0,
        state: 'follow', // follow, idle, sit, chase, rub, roll
        idleTimer: 0,
        sitTimer: 0,
        tailAngle: 0,
        rubbing: false,
        rubTimer: 0,
        rollTimer: 0,
        isRolling: false,
        name: '小橘猫',
        nameColor: '#f0c060',
        nameHitbox: { x: 0, y: 0, w: 0, h: 0 },
        colors: {
            body: '#e8a838',
            bodyLight: '#f0c060',
            stripes: '#c07820',
            eyes: '#2a8a3a',
            nose: '#f08080',
            ears: '#d08020'
        },
        update(dt) {
            const dx = Player.x - this.x;
            const dy = Player.y - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            // 状态机
            if (this.state === 'chase') {
                // 追逐蝴蝶
                const bx = Butterflies[0].x - this.x;
                const by = Butterflies[0].y - this.y;
                const bdist = Math.sqrt(bx * bx + by * by);
                if (bdist > 5) {
                    this.x += (bx / bdist) * this.speed * 1.5 * dt;
                    this.y += (by / bdist) * this.speed * 1.5 * dt;
                    this.isMoving = true;
                    this.direction = Math.abs(bx) > Math.abs(by) ? (bx > 0 ? 'right' : 'left') : (by > 0 ? 'down' : 'up');
                }
                if (bdist < 15) {
                    this.state = 'follow';
                }
                this.idleTimer = 0;
            } else if (this.state === 'follow') {
                if (dist > 60) {
                    this.x += (dx / dist) * this.speed * dt;
                    this.y += (dy / dist) * this.speed * dt;
                    this.isMoving = true;
                    this.direction = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
                    this.idleTimer = 0;
                } else {
                    this.isMoving = false;
                    this.idleTimer += dt;
                    if (this.idleTimer > 5 + Math.random() * 5 && Math.random() < 0.01) {
                        this.state = 'sit';
                        this.sitTimer = 0;
                    }
                    // 随机追逐蝴蝶
                    if (Butterflies.length > 0 && Math.random() < 0.002) {
                        this.state = 'chase';
                    }
                }
            } else if (this.state === 'sit') {
                this.isMoving = false;
                this.sitTimer += dt;
                // 打滚触发
                if (!this.isRolling && Math.random() < 0.2) {
                    this.isRolling = true;
                    this.rollTimer = 0;
                }
                if (this.isRolling) {
                    this.rollTimer += dt;
                    if (this.rollTimer > 1) {
                        this.isRolling = false;
                        this.rollTimer = 0;
                    }
                }
                if (this.sitTimer > 5 + Math.random() * 5) {
                    this.state = 'follow';
                    this.idleTimer = 0;
                    this.isRolling = false;
                }
            } else if (this.state === 'rub') {
                this.isMoving = false;
                this.rubTimer += dt;
                if (this.rubTimer > 2) {
                    this.state = 'follow';
                    this.rubTimer = 0;
                    this.rubbing = false;
                }
            }

            // 蹭腿检测
            if (this.state !== 'rub' && this.state !== 'chase' && !Player.isMoving && dist < 30) {
                this.state = 'rub';
                this.rubTimer = 0;
                this.rubbing = true;
            }

            // 动画
            if (this.isMoving) {
                this.animTimer += dt * 10;
                this.animFrame = this.animTimer;
            } else {
                this.animFrame = 0;
            }

            // 尾巴摆动
            this.tailAngle += dt * 3;

            // 边界
            this.x = Math.max(10, Math.min(GameState.worldWidth - 10, this.x));
            this.y = Math.max(10, Math.min(GameState.worldHeight - 10, this.y));
        },
        draw(px, py) {
            const c = this.colors;
            const frame = this.isMoving ? Math.floor(this.animFrame) % 4 : 0;
            const bob = this.isMoving ? Math.sin(this.animFrame * 0.3) * 1 : 0;
            const x = Math.floor(px - this.width / 2);
            const y = Math.floor(py - this.height / 2 + bob);

            // 小猫阴影（根据场景调整）
            const catShadowColor = GameState.currentScene === 'flowerField' ? 'rgba(0,0,0,0.15)'
                : GameState.currentScene === 'pillarSea' ? 'rgba(0,20,40,0.1)'
                : 'rgba(0,0,0,0.2)';
            ctx.fillStyle = catShadowColor;
            ctx.beginPath();
            ctx.ellipse(x + 7, y + 11, 5, 2, 0, 0, Math.PI * 2);
            ctx.fill();

            if (this.state === 'sit') {
                if (this.isRolling) {
                    // 打滚动画：旋转的黄色椭圆
                    ctx.save();
                    ctx.translate(px, py);
                    ctx.rotate(this.rollTimer * Math.PI * 2);
                    ctx.fillStyle = c.body;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 7, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = c.bodyLight;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 5, 2.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else {
                    // 坐姿（身体变扁，高度减半）
                    drawPixelRect(x + 2, y + 6, 10, 4, c.body);
                    drawPixelRect(x + 3, y + 5, 8, 2, c.bodyLight);
                    drawPixelRect(x + 4, y + 7, 6, 1, c.stripes);
                    drawPixelRect(x + 3, y + 2, 8, 4, c.body);
                    drawPixelRect(x + 3, y + 1, 2, 2, c.ears);
                    drawPixelRect(x + 9, y + 1, 2, 2, c.ears);
                    drawPixelRect(x + 5, y + 3, 1, 1, c.eyes);
                    drawPixelRect(x + 8, y + 3, 1, 1, c.eyes);
                    drawPixelRect(x + 6, y + 4, 2, 1, c.nose);
                    const tailX = x + 12 + Math.sin(this.tailAngle) * 2;
                    const tailY = y + 6 + Math.cos(this.tailAngle * 0.5) * 1;
                    drawPixelRect(tailX, tailY, 3, 2, c.body);
                    drawPixelRect(tailX + 2, tailY - 1, 2, 2, c.body);
                }
            } else if (this.state === 'rub') {
                // 蹭腿：在角色腿边左右摆动
                const rubOffset = Math.sin(GameState.time * 0.08) * 5;
                const rx = x + rubOffset;
                drawPixelRect(rx + 3, y + 8, 2, 3, c.body);
                drawPixelRect(rx + 9, y + 8, 2, 3, c.body);
                drawPixelRect(rx + 2, y + 3, 10, 6, c.body);
                drawPixelRect(rx + 3, y + 4, 8, 3, c.bodyLight);
                drawPixelRect(rx + 4, y + 5, 6, 1, c.stripes);
                drawPixelRect(rx + 3, y, 8, 5, c.body);
                drawPixelRect(rx + 3, y - 1, 2, 2, c.ears);
                drawPixelRect(rx + 9, y - 1, 2, 2, c.ears);
                // 蹭腿时闭眼享受
                drawPixelRect(rx + 5, y + 2, 2, 1, c.eyes);
                drawPixelRect(rx + 8, y + 2, 2, 1, c.eyes);
                drawPixelRect(rx + 6, y + 3, 2, 1, c.nose);
                const tailSway = Math.sin(this.tailAngle * 3) * 4;
                drawPixelRect(rx + 12, y + 4 + tailSway, 2, 2, c.body);
                drawPixelRect(rx + 13, y + 3 + tailSway * 0.7, 2, 2, c.bodyLight);
            } else if (this.state === 'pet') {
                // 被摸头 — 闭眼享受
                const legOffset = 0;
                drawPixelRect(x + 3 + legOffset, y + 8, 2, 3, c.body);
                drawPixelRect(x + 9 - legOffset, y + 8, 2, 3, c.body);
                drawPixelRect(x + 2, y + 3, 10, 6, c.body);
                drawPixelRect(x + 3, y + 4, 8, 3, c.bodyLight);
                drawPixelRect(x + 4, y + 5, 6, 1, c.stripes);
                drawPixelRect(x + 3, y, 8, 5, c.body);
                drawPixelRect(x + 3, y - 1, 2, 2, c.ears);
                drawPixelRect(x + 9, y - 1, 2, 2, c.ears);
                // 闭眼（横线）
                drawPixelRect(x + 5, y + 2, 2, 1, c.eyes);
                drawPixelRect(x + 8, y + 2, 2, 1, c.eyes);
                drawPixelRect(x + 6, y + 3, 2, 1, c.nose);
                // 尾巴快速摇摆
                const tailSway = Math.sin(this.tailAngle * 3) * 4;
                drawPixelRect(x + 12, y + 4 + tailSway, 2, 2, c.body);
                drawPixelRect(x + 13, y + 3 + tailSway * 0.7, 2, 2, c.bodyLight);
            } else if (this.state === 'play') {
                // 逗玩 — 跳跃
                const jumpBob = Math.sin(Interaction.timer * 8) * 4;
                const playY = y + jumpBob;
                drawPixelRect(x + 3, playY + 8, 2, 3, c.body);
                drawPixelRect(x + 9, playY + 8, 2, 3, c.body);
                drawPixelRect(x + 2, playY + 3, 10, 6, c.body);
                drawPixelRect(x + 3, playY + 4, 8, 3, c.bodyLight);
                drawPixelRect(x + 4, playY + 5, 6, 1, c.stripes);
                drawPixelRect(x + 3, playY, 8, 5, c.body);
                drawPixelRect(x + 3, playY - 1, 2, 2, c.ears);
                drawPixelRect(x + 9, playY - 1, 2, 2, c.ears);
                // 兴奋的大眼睛
                drawPixelRect(x + 5, playY + 1, 2, 2, c.eyes);
                drawPixelRect(x + 8, playY + 1, 2, 2, c.eyes);
                drawPixelRect(x + 6, playY + 3, 2, 1, c.nose);
                const tailSway = Math.sin(this.tailAngle * 4) * 5;
                drawPixelRect(x + 12, playY + 4 + tailSway, 2, 2, c.body);
                drawPixelRect(x + 13, playY + 3 + tailSway * 0.7, 2, 2, c.bodyLight);
            } else {
                // 行走/站立
                const legOffset = frame === 1 ? -1 : frame === 3 ? 1 : 0;
                drawPixelRect(x + 3 + legOffset, y + 8, 2, 3, c.body);
                drawPixelRect(x + 9 - legOffset, y + 8, 2, 3, c.body);
                // 身体
                drawPixelRect(x + 2, y + 3, 10, 6, c.body);
                drawPixelRect(x + 3, y + 4, 8, 3, c.bodyLight);
                // 条纹
                drawPixelRect(x + 4, y + 5, 6, 1, c.stripes);
                // 头
                drawPixelRect(x + 3, y, 8, 5, c.body);
                // 耳朵
                drawPixelRect(x + 3, y - 1, 2, 2, c.ears);
                drawPixelRect(x + 9, y - 1, 2, 2, c.ears);
                // 眼睛
                const eyeDir = this.direction === 'left' ? -1 : this.direction === 'right' ? 1 : 0;
                drawPixelRect(x + 5 + eyeDir, y + 1, 1, 2, c.eyes);
                drawPixelRect(x + 8 + eyeDir, y + 1, 1, 2, c.eyes);
                // 鼻子
                drawPixelRect(x + 6, y + 3, 2, 1, c.nose);
                // 尾巴
                const tailSway = Math.sin(this.tailAngle) * 5;
                drawPixelRect(x + 12, y + 4 + tailSway, 2, 2, c.body);
                drawPixelRect(x + 13, y + 3 + tailSway * 0.7, 2, 2, c.body);
                drawPixelRect(x + 14, y + 2 + tailSway * 0.4, 2, 2, c.bodyLight);
            }

            // 小猫名字
            const catName = this.name;
            const catFontSize = 9;
            ctx.font = `${catFontSize}px 'Courier New', monospace`;
            // 中文字符每个约 9-10px 宽，确保足够空间
            const catTextW = Math.max(ctx.measureText(catName).width, catName.length * catFontSize);
            const catNameX = px - catTextW / 2;
            const catNameY = py - 10;
            const catNamePad = 4;
            // 保存点击区域
            this.nameHitbox = {
                x: catNameX + GameState.camera.x,
                y: catNameY + GameState.camera.y - catFontSize,
                w: catTextW + catNamePad * 2,
                h: catFontSize + 4
            };
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.fillRect(catNameX - catNamePad, catNameY - catFontSize, catTextW + catNamePad * 2, catFontSize + 3);
            ctx.strokeStyle = 'rgba(240, 192, 96, 0.3)';
            ctx.lineWidth = 1;
            ctx.strokeRect(catNameX - catNamePad, catNameY - catFontSize, catTextW + catNamePad * 2, catFontSize + 3);
            ctx.fillStyle = this.nameColor;
            ctx.textAlign = 'center';
            ctx.fillText(catName, px, catNameY);
            ctx.textAlign = 'left';
        }
    };

    // ==================== NPC系统 ====================
    const NPCSystem = {
        npcs: [],
        init() {
            this.npcs = [
                // 迷雾森林
                {
                    x: 600, y: 400, name: '森林守护者', type: 'oldman',
                    dialog: '这片森林很古老，小心迷路', scene: 'flowerField',
                    animPhase: 0, width: 20, height: 32
                },
                // 深海柱林
                {
                    x: 500, y: 500, name: '海之女', type: 'mermaid',
                    dialog: '深海之下藏着古老的秘密...', scene: 'pillarSea',
                    animPhase: 0, width: 20, height: 28
                },
                // 云端花田
                {
                    x: 700, y: 300, name: '云之精灵', type: 'fairy',
                    dialog: '彩虹的尽头有宝藏哦~', scene: 'cloudSea',
                    animPhase: 0, width: 18, height: 30
                },
                // 熔岩洞穴
                {
                    x: 600, y: 500, name: '火焰守护者', type: 'firespirit',
                    dialog: '不要掉进岩浆里...', scene: 'lavaCave',
                    animPhase: 0, width: 20, height: 32
                }
            ];
        },
        update(dt) {
            this.npcs.forEach(npc => {
                npc.animPhase += dt;
            });
            // 对话计时器
            if (GameState.npcDialog.timer > 0) {
                GameState.npcDialog.timer -= dt;
                if (GameState.npcDialog.timer <= 0) {
                    GameState.npcDialog.active = false;
                    GameState.npcDialog.text = '';
                    GameState.npcDialog.targetNpc = null;
                }
            }
        },
        draw(camX, camY) {
            this.npcs.forEach(npc => {
                if (npc.scene !== GameState.currentScene) return;
                const sx = npc.x - camX;
                const sy = npc.y - camY;
                if (sx < -40 || sx > canvas.width + 40 || sy < -40 || sy > canvas.height + 40) return;

                // 绘制NPC
                if (npc.type === 'oldman') {
                    // 森林老人 - 绿色斗篷
                    const sway = Math.sin(npc.animPhase * 1.5) * 1;
                    // 阴影
                    ctx.fillStyle = 'rgba(0,0,0,0.15)';
                    ctx.beginPath();
                    ctx.ellipse(sx, sy + 16, 10, 3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // 身体（绿色斗篷）
                    ctx.fillStyle = '#2a5a2a';
                    ctx.fillRect(sx - 8, sy - 4, 16, 18);
                    ctx.fillStyle = '#3a7a3a';
                    ctx.fillRect(sx - 6, sy - 2, 12, 14);
                    // 头
                    ctx.fillStyle = '#d4b896';
                    ctx.fillRect(sx - 5, sy - 14, 10, 10);
                    // 白发
                    ctx.fillStyle = '#e8e8e8';
                    ctx.fillRect(sx - 6, sy - 16, 12, 4);
                    ctx.fillRect(sx - 5, sy - 14, 2, 4);
                    ctx.fillRect(sx + 3, sy - 14, 2, 4);
                    // 眼睛
                    ctx.fillStyle = '#1a1a1a';
                    ctx.fillRect(sx - 2, sy - 10, 1, 2);
                    ctx.fillRect(sx + 1, sy - 10, 1, 2);
                    // 斗篷摆动
                    ctx.fillStyle = '#2a5a2a';
                    ctx.fillRect(sx - 8 + sway, sy + 10, 4, 8);
                    ctx.fillRect(sx + 4 + sway, sy + 10, 4, 8);
                    // 手杖
                    ctx.fillStyle = '#5a3a1a';
                    ctx.fillRect(sx + 9, sy - 8, 2, 24);
                } else if (npc.type === 'mermaid') {
                    // 美人鱼 - 蓝色长发，坐在柱子上
                    const tailWave = Math.sin(npc.animPhase * 2) * 3;
                    // 柱子底座
                    ctx.fillStyle = 'rgba(30,60,80,0.6)';
                    ctx.fillRect(sx - 10, sy + 10, 20, 12);
                    // 尾巴
                    ctx.fillStyle = '#4a8aaa';
                    ctx.fillRect(sx - 4, sy + 6, 8, 8);
                    ctx.fillRect(sx - 6 + tailWave, sy + 12, 12, 4);
                    ctx.fillRect(sx - 4 + tailWave * 1.5, sy + 15, 8, 3);
                    ctx.fillStyle = '#6aaaca';
                    ctx.fillRect(sx - 2, sy + 8, 4, 4);
                    // 身体
                    ctx.fillStyle = '#d4b896';
                    ctx.fillRect(sx - 5, sy - 8, 10, 14);
                    // 头发
                    ctx.fillStyle = '#3a6aaa';
                    ctx.fillRect(sx - 7, sy - 14, 14, 8);
                    ctx.fillRect(sx - 8, sy - 10, 3, 10);
                    ctx.fillRect(sx + 5, sy - 10, 3, 10);
                    // 脸
                    ctx.fillStyle = '#1a1a1a';
                    ctx.fillRect(sx - 2, sy - 6, 1, 2);
                    ctx.fillRect(sx + 1, sy - 6, 1, 2);
                } else if (npc.type === 'fairy') {
                    // 云端仙子 - 白色长裙，漂浮
                    const floatY = Math.sin(npc.animPhase * 1.2) * 4;
                    const fy = sy + floatY;
                    // 阴影（淡）
                    ctx.fillStyle = 'rgba(0,0,0,0.08)';
                    ctx.beginPath();
                    ctx.ellipse(sx, fy + 18, 8, 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // 裙子
                    ctx.fillStyle = '#f0f0f0';
                    ctx.fillRect(sx - 6, fy + 2, 12, 14);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(sx - 4, fy + 4, 8, 10);

                    ctx.fillRect(sx - 4, fy - 8, 8, 10);
                    // 头

                    ctx.fillRect(sx - 4, fy - 16, 8, 8);
                    // 头发

                    ctx.fillRect(sx - 5, fy - 18, 10, 4);

                } else if (npc.type === 'firespirit') {
                    // 火焰精灵 - 红橙色，飘浮
                    const floatY = Math.sin(npc.animPhase * 1.5) * 5;
                    const fy = sy + floatY;
                    const flicker = 0.7 + Math.sin(npc.animPhase * 8) * 0.3;
                    // 火焰光晕
                    ctx.fillStyle = `rgba(255, 100, 0, ${0.15 * flicker})`;
                    ctx.beginPath();
                    ctx.arc(sx, fy, 20, 0, Math.PI * 2);

                    // 身体（火焰色）
                    ctx.fillStyle = `rgb(${Math.floor(200 * flicker)}, ${Math.floor(80 * flicker)}, 0)`;
                    ctx.fillRect(sx - 6, fy - 4, 12, 16);
                    ctx.fillStyle = `rgb(${Math.floor(255 * flicker)}, ${Math.floor(120 * flicker)}, 20)`;
                    ctx.fillRect(sx - 4, fy - 2, 8, 12);
                    // 头
                    ctx.fillStyle = `rgb(${Math.floor(255 * flicker)}, ${Math.floor(150 * flicker)}, 50)`;
                    ctx.fillRect(sx - 5, fy - 14, 10, 10);
                    // 火焰头发
                    ctx.fillStyle = `rgb(255, ${Math.floor(200 * flicker)}, 0)`;
                    ctx.fillRect(sx - 6, fy - 18, 12, 6);
                    ctx.fillRect(sx - 4, fy - 20, 3, 4);
                    ctx.fillRect(sx + 1, fy - 21, 3, 5);
                    ctx.fillRect(sx + 4, fy - 18, 2, 3);
                    // 眼睛（发光）
                    ctx.fillStyle = '#ffff00';
                    ctx.fillRect(sx - 2, fy - 10, 2, 2);
                    ctx.fillRect(sx + 1, fy - 10, 2, 2);
                    // 火焰尾巴
                    ctx.fillStyle = `rgba(255, 100, 0, ${0.6 * flicker})`;
                    ctx.fillRect(sx - 3, fy + 10, 2, 6);
                    ctx.fillRect(sx + 1, fy + 10, 2, 8);
                    ctx.fillStyle = `rgba(255, 200, 0, ${0.4 * flicker})`;
                    ctx.fillRect(sx - 1, fy + 12, 2, 4);
                }

                // 名字
                ctx.font = '9px "Courier New", monospace';
                ctx.textAlign = 'center';
                const nameW = ctx.measureText(npc.name).width;
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(sx - nameW / 2 - 3, sy - 28, nameW + 6, 11);
                ctx.fillStyle = '#e8d5a3';
                ctx.fillText(npc.name, sx, sy - 20);

                // 靠近检测 - 显示对话气泡 "..."
                const pdx = Player.x - npc.x;

                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    ctx.fillRect(sx - 8, sy - 42, 16, 12);
                    ctx.strokeStyle = '#aaa';

                    ctx.strokeRect(sx - 8, sy - 42, 16, 12);

                    ctx.textAlign = 'center';
                    ctx.fillText('...', sx, sy - 33);

            });

            // 绘制对话文本
            if (GameState.npcDialog.active && GameState.npcDialog.targetNpc) {
                const npc = GameState.npcDialog.targetNpc;
                const sx = npc.x - camX;
                const sy = npc.y - camY;
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                const textW = ctx.measureText(GameState.npcDialog.text).width;
                ctx.fillRect(sx - textW / 2 - 6, sy - 60, textW + 12, 20);
                ctx.strokeStyle = '#e8d5a3';
                ctx.lineWidth = 1;

                ctx.fillStyle = '#e8d5a3';
                ctx.font = '10px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText(GameState.npcDialog.text, sx, sy - 47);
                ctx.textAlign = 'left';
            }
        },
        tryTalk() {
            for (const npc of this.npcs) {
                if (npc.scene !== GameState.currentScene) continue;
                const pdx = Player.x - npc.x;
                const pdy = Player.y - npc.y;
                const pdist = Math.sqrt(pdx * pdx + pdy * pdy);
                if (pdist < 35) {
                    GameState.npcDialog.active = true;
                    GameState.npcDialog.text = npc.dialog;
                    GameState.npcDialog.timer = 3;
                    GameState.npcDialog.targetNpc = npc;
                    if (!GameState.npcTalked) GameState.npcTalked = new Set();
                    GameState.npcTalked.add(npc.name);
                    return true;
                }
            }
            return false;
        }
    };

    // ==================== 互动系统 ====================
    const Interaction = {
        active: false,
        type: '', // 'pet', 'call', 'play', 'carry'
        timer: 0,
        duration: 0,
        cooldown: 0,
        particles: [],

        tryInteract() {
            if (this.active || this.cooldown > 0) return;
            const dx = Player.x - Cat.x;
            const dy = Player.y - Cat.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 50) {
                // 靠近：摸头 或 逗玩
                if (Cat.state === 'sit') {
                    this.start('pet', 1.5);
                } else if (Math.random() < 0.4) {
                    this.start('play', 2.0);
                } else {
                    this.start('pet', 1.5);
                }
            } else {
                // 远离：呼唤
                this.start('call', 1.0);
            }
        },

        start(type, duration) {
            this.active = true;
            this.type = type;
            this.timer = 0;
            this.duration = duration;
            this.particles = [];

            if (type === 'pet') {
                Cat.state = 'pet';
                Cat.isMoving = false;
                AudioEngine.playPetSound();
            } else if (type === 'call') {
                Player.direction = Math.abs(dx_calc()) > Math.abs(dy_calc()) ? (Cat.x > Player.x ? 'right' : 'left') : (Cat.y > Player.y ? 'down' : 'up');
                Cat.state = 'follow';
                Cat.speed = 200; // 加速跑来
                AudioEngine.playCallSound();
            } else if (type === 'play') {
                Cat.state = 'play';
                Cat.isMoving = false;
                AudioEngine.playPlaySound();
            }
        },

        update(dt) {
            if (this.cooldown > 0) this.cooldown -= dt;

            if (!this.active) return;
            this.timer += dt;

            // 生成互动粒子
            if (this.type === 'pet') {
                if (Math.random() < 0.15) {
                    this.particles.push({
                        x: Cat.x + (Math.random() - 0.5) * 10,
                        y: Cat.y - 15,
                        vy: -20 - Math.random() * 15,
                        life: 1,
                        type: 'heart'
                    });
                }
            } else if (this.type === 'play') {
                if (Math.random() < 0.2) {
                    this.particles.push({
                        x: Cat.x + (Math.random() - 0.5) * 16,
                        y: Cat.y + (Math.random() - 0.5) * 16,
                        vy: -15 - Math.random() * 10,
                        vx: (Math.random() - 0.5) * 20,
                        life: 1,
                        type: 'sparkle'
                    });
                }
                // 小猫转圈
                Cat.x += Math.cos(this.timer * 6) * 0.5;
                Cat.y += Math.sin(this.timer * 6) * 0.5;
            }

            // 更新粒子
            this.particles.forEach(p => {
                p.y += (p.vy || 0) * dt;
                p.x += (p.vx || 0) * dt;
                p.life -= 0.02;
            });
            this.particles = this.particles.filter(p => p.life > 0);

            // 互动结束
            if (this.timer >= this.duration) {
                this.end();
            }
        },

        end() {
            this.active = false;
            this.type = '';
            this.cooldown = 0.5;
            Cat.state = 'follow';
            Cat.speed = 80;
            Cat.idleTimer = 0;
            this.particles = [];
        },

        drawParticles(camX, camY) {
            this.particles.forEach(p => {
                const sx = p.x - camX;
                const sy = p.y - camY;
                ctx.globalAlpha = Math.max(0, p.life);
                if (p.type === 'heart') {
                    ctx.fillStyle = '#ff6b8a';
                    ctx.font = '8px monospace';
                    ctx.fillText('❤', sx, sy);
                } else if (p.type === 'sparkle') {
                    ctx.fillStyle = '#ffe87c';
                    ctx.fillRect(sx, sy, 2, 2);
                    ctx.fillStyle = `rgba(255, 232, 124, ${p.life * 0.3})`;
                    ctx.fillRect(sx - 1, sy - 1, 4, 4);
                }
                ctx.globalAlpha = 1;
            });
        },

        drawActionIndicator(camX, camY) {
            // [F] 提示已移除，保持接口兼容
        }
    };

    function dx_calc() { return Cat.x - Player.x; }
    function dy_calc() { return Cat.y - Player.y; }

    // ==================== 蝴蝶 ====================
    const Butterflies = [];
    function spawnButterfly() {

        });

    function updateButterflies(dt) {
        Butterflies.forEach(b => {
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            b.wingAngle += b.wingSpeed * dt;
            b.vx += Math.sin(GameState.time * 0.5 + b.y * 0.01) * 10 * dt;
            b.vy += Math.cos(GameState.time * 0.3 + b.x * 0.01) * 5 * dt;
            // 边界反弹
            if (b.x < 0 || b.x > GameState.worldWidth) b.vx *= -1;
            if (b.y < 0 || b.y > GameState.worldHeight) b.vy *= -1;
            b.x = Math.max(0, Math.min(GameState.worldWidth, b.x));
            b.y = Math.max(0, Math.min(GameState.worldHeight, b.y));
        });
    }

    function drawButterflies(camX, camY) {
        Butterflies.forEach(b => {

            const by = b.y - camY;

    // ==================== 粒子对象池 ====================
    class ParticlePool {
        constructor(maxSize) {
            this.pool = []; this.active = []; this.maxSize = maxSize;
        }
        get(x, y, type) {
            let p;
            if (this.pool.length > 0) { p = this.pool.pop(); p.reset(x, y, type); }
            else { p = new Particle(x, y, type); }
            this.active.push(p);
            return p;
        }
        release(p) {
            const idx = this.active.indexOf(p);
            if (idx > -1) {
                this.active.splice(idx, 1);
                if (this.pool.length < this.maxSize) this.pool.push(p);
            }
        }
        update(dt) {
            for (let i = this.active.length - 1; i >= 0; i--) {
                this.active[i].update(dt);
                if (this.active[i].life <= 0) this.release(this.active[i]);
            }
        }
        draw(ctx, camX, camY) {
            for (let i = 0; i < this.active.length; i++) {
                this.active[i].draw(ctx, camX, camY);
            }
        }
    }

    class Particle {
        constructor(x, y, type) {
            this.x = x; this.y = y; this.type = type;
            this.life = 1; this.decay = 0.005;
            this.vx = 0; this.vy = 0; this.size = 1; this.color = '#fff';
            this.trail = [];
            this.maxTrail = 5;
        }
        reset(x, y, type) {
            this.x = x; this.y = y; this.type = type;
            this.life = 1; this.decay = 0.005 + Math.random() * 0.01;
            this.vx = 0; this.vy = 0; this.trail = [];
            if (type === 'pollen') {
                this.vx = (Math.random() - 0.5) * 30;
                this.vy = -12 - Math.random() * 30;
                this.size = 1 + Math.random() * 2;
                this.color = '#f4d03f';
            } else if (type === 'dust') {
                this.vx = (Math.random() - 0.5) * 18;
                this.vy = -6 - Math.random() * 18;
                this.size = 1 + Math.random() * 1.5;
                this.color = '#d4a843';
            } else if (type === 'sparkle') {
                this.vx = (Math.random() - 0.5) * 12;
                this.vy = (Math.random() - 0.5) * 12;
                this.size = 1 + Math.random() * 2;
                this.color = '#fff8dc';
                this.decay = 0.02 + Math.random() * 0.02;
            } else if (type === 'footstep_dust') {
                this.vx = (Math.random() - 0.5) * 20;
                this.vy = -8 - Math.random() * 15;
                this.size = 1 + Math.random() * 1.5;
                this.color = GameState.currentScene === 'flowerField' ? '#8a7a5a' : '#4a6a7a';
                this.decay = 0.03 + Math.random() * 0.02;
            } else if (type === 'firefly') {
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.size = 2;
                this.color = '#ffe87c';
                this.decay = 0.003 + Math.random() * 0.003;
            } else if (type === 'rain') {
                this.vx = GameState.weather.windDir * 30;
                this.vy = 200 + Math.random() * 100;
                this.size = 1;
                this.color = 'rgba(180, 200, 220, 0.4)';
                this.decay = 0.02;
            } else if (type === 'wind_leaf') {
                this.vx = GameState.weather.windDir * 60 + (Math.random() - 0.5) * 20;
                this.vy = (Math.random() - 0.5) * 30;
                this.size = 2;
                this.color = GameState.currentScene === 'flowerField' ? '#6a8a3a' : '#4a6a8a';
                this.decay = 0.005;
            }
        }
        update(dt) {
            // 拖尾记录
            if (this.type === 'sparkle' || this.type === 'firefly') {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.maxTrail) this.trail.shift();
            }
            this.x += this.vx * dt;
            this.y += this.vy * dt;
            this.life -= this.decay;
            if (this.type === 'pollen') {
                this.vx += Math.sin(GameState.time * 0.05 + this.y * 0.01) * 1.2 * dt;
            } else if (this.type === 'firefly') {
                this.vx += Math.sin(GameState.time * 0.03 + this.x * 0.02) * 3 * dt;
                this.vy += Math.cos(GameState.time * 0.04 + this.y * 0.02) * 3 * dt;
            }
        }
        draw(ctx, camX, camY) {
            // 拖尾
            if (this.trail.length > 1) {
                for (let i = 0; i < this.trail.length; i++) {
                    const t = this.trail[i];
                    const alpha = (i / this.trail.length) * this.life * 0.3;
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = alpha;
                    ctx.fillRect(Math.floor(t.x - camX), Math.floor(t.y - camY), 1, 1);
                }
            }
            // 主体
            ctx.fillStyle = this.color;
            ctx.globalAlpha = Math.max(0, this.life);
            const sx = Math.floor(this.x - camX);
            const sy = Math.floor(this.y - camY);
            ctx.fillRect(sx, sy, this.size, this.size);
            // 萤火虫发光
            if (this.type === 'firefly' && this.life > 0.3) {
                ctx.fillStyle = `rgba(255, 232, 124, ${this.life * 0.15})`;
                ctx.fillRect(sx - 2, sy - 2, this.size + 4, this.size + 4);
            }
            // 闪烁效果
            if (this.type === 'sparkle') {
                const flicker = 0.5 + Math.sin(GameState.time * 10 + this.x) * 0.5;
                ctx.fillStyle = `rgba(255, 255, 255, ${this.life * flicker * 0.5})`;
                ctx.fillRect(sx - 1, sy - 1, this.size + 2, this.size + 2);
            }
            ctx.globalAlpha = 1;
        }
    }
