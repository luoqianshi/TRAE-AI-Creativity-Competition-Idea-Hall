    // ==================== 脚印系统 ====================
    function addFootprint() {
        // 柱海场景水下不显示脚印
        if (GameState.currentScene === 'pillarSea') return;
        GameState.footprints.push({ x: Player.x, y: Player.y + 14, life: 1, direction: Player.direction });
        if (GameState.footprints.length > GameState.maxFootprints) GameState.footprints.shift();
    }

    function updateFootprints(dt) {
        for (let i = GameState.footprints.length - 1; i >= 0; i--) {
            GameState.footprints[i].life -= 0.08 * dt; // 持续时间从约2秒增加到约3秒
            if (GameState.footprints[i].life <= 0) GameState.footprints.splice(i, 1);
        }
    }

    function drawFootprints(camX, camY) {
        // 柱海场景不绘制脚印
        if (GameState.currentScene === 'pillarSea') return;
        // 场景适配颜色
        let baseColor;
        if (GameState.currentScene === 'flowerField') {
            baseColor = '20,40,10';
        } else if (GameState.currentScene === 'cloudSea') {
            baseColor = '100,100,120';
        } else if (GameState.currentScene === 'lavaCave') {
            baseColor = '60,30,10';
        } else {
            baseColor = '0,0,0';
        }
        GameState.footprints.forEach(fp => {
            ctx.fillStyle = `rgba(${baseColor},${fp.life * 0.15})`;
            const ox = fp.direction === 'left' ? 2 : fp.direction === 'right' ? -2 : 0;
            // 脚印大小从 3px 增大到 4px
            ctx.fillRect(Math.floor(fp.x - camX - 4 + ox), Math.floor(fp.y - camY), 4, 2);
            ctx.fillRect(Math.floor(fp.x - camX + 1 + ox), Math.floor(fp.y - camY), 4, 2);
        });
    }

    // ==================== 动态阴影 ====================
    function drawShadow(screenX, screenY, width, height, opacity) {
        ctx.fillStyle = `rgba(0,0,0,${opacity})`;
        ctx.beginPath();
        ctx.ellipse(screenX, screenY, width, height * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // ==================== 水面反射 ====================
    function drawWaterReflection(objX, objY, objW, objH, camX, camY, waterY) {
        const refY = waterY + (waterY - objY - objH);
        if (refY > waterY - 50 && refY < canvas.height) {
            ctx.save();
            ctx.globalAlpha = 0.15;
            ctx.scale(1, -0.4);
            ctx.fillStyle = 'rgba(45, 125, 138, 0.3)';
            ctx.fillRect(objX - camX, -(refY + objH * 0.4 - camY), objW, objH);
            ctx.restore();
        }
    }

    // ==================== 离屏 Canvas 预渲染 ====================
    function prerenderGround(scene) {
        const s = Scenes[scene];
        if (!s.groundCanvas) {
            s.groundCanvas = document.createElement('canvas');
            s.groundCanvas.width = GameState.worldWidth;
            s.groundCanvas.height = GameState.worldHeight;
        }
        const gc = s.groundCanvas.getContext('2d');
        gc.imageSmoothingEnabled = false;
        gc.clearRect(0, 0, s.groundCanvas.width, s.groundCanvas.height);

        if (scene === 'flowerField') {
            // 基底绿色（v0.15风格）
            gc.fillStyle = '#4a8a2a';
            gc.fillRect(0, 0, GameState.worldWidth, GameState.worldHeight);
            // 自然草地色块变化（大块渐变）
            for (let i = 0; i < 200; i++) {
                const gx = (i * 137) % GameState.worldWidth;
                const gy = (i * 241) % GameState.worldHeight;
                const size = 8 + Math.random() * 20;
                gc.fillStyle = (i % 4 === 0) ? '#3d7a1e' : (i % 4 === 1) ? '#5a9a32' : (i % 4 === 2) ? '#4a8828' : '#6aaa3a';
                gc.fillRect(gx, gy, size, size);
            }
            // 草丛簇（更自然的草）
            for (let i = 0; i < 300; i++) {
                const gx = Math.random() * GameState.worldWidth;
                const gy = Math.random() * GameState.worldHeight;
                gc.fillStyle = '#3a7018';
                gc.fillRect(gx, gy, 1, 4);
                gc.fillRect(gx + 2, gy - 1, 1, 5);
                gc.fillRect(gx + 4, gy, 1, 3);
                gc.fillRect(gx - 1, gy + 1, 1, 3);
            }
            // 小石头
            for (let i = 0; i < 40; i++) {
                const gx = Math.random() * GameState.worldWidth;
                const gy = Math.random() * GameState.worldHeight;
                gc.fillStyle = '#8a8a7a';
                gc.fillRect(gx, gy, 3, 2);
                gc.fillStyle = '#9a9a8a';
                gc.fillRect(gx, gy, 2, 1);
            }
            // 泥土小路（蜿蜒）
            gc.fillStyle = '#7a6a4a';
            for (let x = 0; x < GameState.worldWidth; x += 3) {
                const yOff = Math.sin(x * 0.005) * 50 + Math.sin(x * 0.012) * 20 + GameState.worldHeight / 2;
                const width = 6 + Math.sin(x * 0.008) * 2;
                gc.fillRect(x, yOff, 3, width);
            }
            // 小路边缘草
            gc.fillStyle = '#5a7a2a';
            for (let x = 0; x < GameState.worldWidth; x += 5) {
                const yOff = Math.sin(x * 0.005) * 50 + Math.sin(x * 0.012) * 20 + GameState.worldHeight / 2;
                gc.fillRect(x, yOff - 3, 1, 2);
                gc.fillRect(x, yOff + 7, 1, 2);
            }
        } else if (scene === 'pillarSea') {
            gc.fillStyle = '#0d1f2d';
            gc.fillRect(0, 0, GameState.worldWidth, GameState.worldHeight);
            for (let i = 0; i < 400; i++) {
                const gx = (i * 97) % GameState.worldWidth;
                const gy = (i * 193) % GameState.worldHeight;
                gc.fillStyle = `rgba(30, 60, 80, ${0.3 + Math.random() * 0.3})`;
                gc.fillRect(gx, gy, 2, 1);
            }
        } else if (scene === 'cloudSea') {
            // 云端花田地面 - 柔和天空感（淡蓝渐变）
            gc.fillStyle = '#b8d4e8';
            gc.fillRect(0, 0, GameState.worldWidth, GameState.worldHeight);
            // 天空渐变层次
            const skyColors = ['#a8c8e0', '#c8dff0', '#d8e8f8', '#e0ecf8'];
            for (let i = 0; i < 150; i++) {
                const gx = (i * 157) % GameState.worldWidth;
                const gy = (i * 271) % GameState.worldHeight;
                gc.fillStyle = skyColors[i % skyColors.length];
                gc.globalAlpha = 1;
                gc.fillRect(gx, gy, 6 + Math.floor(Math.random() * 10), 4 + Math.floor(Math.random() * 6));
            }
            // 远处云影（柔和）
            const cloudShadowColors = ['#d0e0f0', '#c8d8ec'];
            for (let i = 0; i < 50; i++) {
                const cx = Math.random() * GameState.worldWidth;
                const cy = Math.random() * GameState.worldHeight * 0.6;
                gc.fillStyle = cloudShadowColors[i % cloudShadowColors.length];
                gc.globalAlpha = 0.3;
                gc.fillRect(cx, cy, 20 + Math.random() * 40, 8 + Math.random() * 12);
            }
            gc.globalAlpha = 1;
        } else if (scene === 'lavaCave') {
            // 熔岩洞穴 - 暗红色地面
            gc.fillStyle = '#2a1a0a';
            gc.fillRect(0, 0, GameState.worldWidth, GameState.worldHeight);
            // 地面色块变化
            const lavaGroundColors = ['#2a1a0a', '#221508', '#301e0c', '#1a0a0a', '#2e1c0b'];
            for (let i = 0; i < 400; i++) {
                const gx = (i * 137) % GameState.worldWidth;
                const gy = (i * 241) % GameState.worldHeight;
                const size = 3 + Math.random() * 6;
                gc.fillStyle = lavaGroundColors[i % lavaGroundColors.length];
                gc.fillRect(gx, gy, size, size);
            }
            // 裂纹纹理
            gc.strokeStyle = '#1a0a0a';
            gc.lineWidth = 1;
            for (let i = 0; i < 60; i++) {
                const cx = Math.random() * GameState.worldWidth;
                const cy = Math.random() * GameState.worldHeight;
                gc.beginPath();
                gc.moveTo(cx, cy);
                let px = cx, py = cy;
                const segs = 3 + Math.floor(Math.random() * 5);
                for (let j = 0; j < segs; j++) {
                    px += (Math.random() - 0.5) * 30;
                    py += (Math.random() - 0.5) * 30;
                    gc.lineTo(px, py);
                }
                gc.stroke();
            }
            // 熔岩边缘发光点
            for (let i = 0; i < 100; i++) {
                const gx = Math.random() * GameState.worldWidth;
                const gy = Math.random() * GameState.worldHeight;
                gc.fillStyle = `rgba(255, ${60 + Math.floor(Math.random() * 40)}, 0, ${0.1 + Math.random() * 0.15})`;
                gc.fillRect(gx, gy, 2, 2);
            }
        }
        s.groundDirty = false;
    }

    // ==================== 存档系统 ====================
    function saveGame() {
        const saveData = {
            currentScene: GameState.currentScene,
            orbsCollected: GameState.orbsCollected,
            quests: GameState.quests,
            playerName: Player.name,
            catName: Cat.name,
            playerLevel: Player.level,
            playerExp: Player.exp,
            playerSpeed: Player.speed,
            playerX: Player.x,
            playerY: Player.y,
            catX: Cat.x,
            catY: Cat.y,
            chestsState: {},
            totalChestsOpened: GameState.totalChestsOpened,
            visitedScenes: GameState.visitedScenes ? Array.from(GameState.visitedScenes) : ['flowerField'],
            totalFishCaught: GameState.totalFishCaught,
            npcTalked: GameState.npcTalked ? Array.from(GameState.npcTalked) : [],
            achievementsUnlocked: GameState.achievements.list.map(a => ({ id: a.id, unlocked: a.unlocked })),
            achievementsTotalUnlocked: GameState.achievements.totalUnlocked,
            costumeCurrent: Player.costumes.current,
            costumeUnlocked: Player.costumes.unlocked
        };
        // 保存宝箱状态
        for (const sceneKey in Scenes) {
            saveData.chestsState[sceneKey] = Scenes[sceneKey].chests.map(c => ({ opened: c.opened }));
        }
        localStorage.setItem('monitoAdventuresSave', JSON.stringify(saveData));
        showSaveLoadHint('💾 存档成功！');
    }

    function loadGame() {
        const saveStr = localStorage.getItem('monitoAdventuresSave');
        if (!saveStr) return false;
        try {
            const saveData = JSON.parse(saveStr);
            if (saveData.currentScene) GameState.currentScene = saveData.currentScene;
            if (saveData.orbsCollected !== undefined) GameState.orbsCollected = saveData.orbsCollected;
            if (saveData.quests) GameState.quests = saveData.quests;
            if (saveData.playerName) Player.name = saveData.playerName;
            if (saveData.catName) Cat.name = saveData.catName;
            if (saveData.playerLevel !== undefined) Player.level = saveData.playerLevel;
            if (saveData.playerExp !== undefined) Player.exp = saveData.playerExp;
            if (saveData.playerSpeed !== undefined) Player.speed = saveData.playerSpeed;
            if (saveData.playerX !== undefined) Player.x = saveData.playerX;
            if (saveData.playerY !== undefined) Player.y = saveData.playerY;
            if (saveData.catX !== undefined) Cat.x = saveData.catX;
            if (saveData.catY !== undefined) Cat.y = saveData.catY;
            // 恢复统计变量
            if (saveData.totalChestsOpened !== undefined) GameState.totalChestsOpened = saveData.totalChestsOpened;
            if (saveData.visitedScenes) GameState.visitedScenes = new Set(saveData.visitedScenes);
            if (saveData.totalFishCaught !== undefined) GameState.totalFishCaught = saveData.totalFishCaught;
            if (saveData.npcTalked) GameState.npcTalked = new Set(saveData.npcTalked);
            // 恢复成就状态
            if (saveData.achievementsUnlocked) {
                saveData.achievementsUnlocked.forEach(saved => {
                    const ach = GameState.achievements.list.find(a => a.id === saved.id);
                    if (ach) ach.unlocked = saved.unlocked;
                });
            }
            if (saveData.achievementsTotalUnlocked !== undefined) GameState.achievements.totalUnlocked = saveData.achievementsTotalUnlocked;
            // 恢复服装状态
            if (saveData.costumeCurrent) Player.costumes.current = saveData.costumeCurrent;
            if (saveData.costumeUnlocked) Player.costumes.unlocked = saveData.costumeUnlocked;
            // 恢复宝箱状态
            if (saveData.chestsState) {
                for (const sceneKey in saveData.chestsState) {
                    if (Scenes[sceneKey] && Scenes[sceneKey].chests) {
                        saveData.chestsState[sceneKey].forEach((state, i) => {
                            if (Scenes[sceneKey].chests[i]) Scenes[sceneKey].chests[i].opened = state.opened;
                        });
                    }
                }
            }
            showSaveLoadHint('📂 读档成功！');
            return true;
        } catch (e) {
            console.log('读档失败', e);
            return false;
        }
    }

    let saveLoadHintTimer = 0;
    let saveLoadHintText = '';
    function showSaveLoadHint(text) {
        saveLoadHintText = text;
        saveLoadHintTimer = 2;
    }

    // ==================== 升级系统 ====================
    function addExp(amount) {
        Player.exp += amount;
        const needed = Player.level * 100;
        if (Player.exp >= needed) {
            Player.exp -= needed;
            Player.level++;
            Player.speed = Math.min(200, Player.speed + 10);
            GameState.levelUpTimer = 2;
            GameState.screenFlash = { timer: 20, color: '#ffd700' };
        }
    }

    // ==================== 任务系统 ====================
    function checkQuestProgress() {
        const q = GameState.quests.current;
        if (!q.completed && q.current >= q.target) {
            q.completed = true;
            GameState.quests.completed.push(q);
            GameState.questCompletedTimer = 2;
            // 生成下一个任务
            const nextTarget = q.target + 5;
            GameState.quests.current = {
                id: 'collect_orbs_' + nextTarget,
                name: '收集光球',
                target: nextTarget,
                current: 0,
                completed: false
            };
        }
    }

    // ==================== 宝箱绘制（贝壳/沉船宝箱风格）====================
    function drawChest(chest, camX, camY) {
        const cx = chest.x - camX;
        const cy = chest.y - camY;
        if (cx < -30 || cx > canvas.width + 30 || cy < -30 || cy > canvas.height + 30) return;

        const lidOpen = chest.openAnim > 0 ? chest.openAnim * 12 : 0;
        const isUnderwater = GameState.currentScene === 'pillarSea';

        if (isUnderwater) {
            // 水下贝壳宝箱风格
            const shellColor = chest.opened ? '#0d2a4a' : '#1a3a5a';
            const shellBorder = '#0d2a4a';
            const openAngle = lidOpen * Math.PI / 180;

            // 阴影
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(cx + 10, cy + 18, 10, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            // 下半贝壳
            ctx.fillStyle = shellColor;
            ctx.beginPath();
            ctx.ellipse(cx + 10, cy + 12, 10, 7, 0, 0, Math.PI, false);
            ctx.fill();
            ctx.strokeStyle = shellBorder;
            ctx.lineWidth = 1;
            ctx.stroke();

            // 上半贝壳（可张开）
            ctx.save();
            ctx.translate(cx + 10, cy + 12);
            ctx.rotate(-openAngle);
            ctx.translate(-10, -12);
            ctx.fillStyle = shellColor;
            ctx.beginPath();
            ctx.ellipse(10, 12, 10, 7, 0, Math.PI, 0, false);
            ctx.fill();
            ctx.strokeStyle = shellBorder;
            ctx.stroke();
            ctx.restore();

            // 珍珠光泽（未打开时）
            if (!chest.opened) {
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.beginPath();
                ctx.arc(cx + 10, cy + 12, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(200,230,255,0.4)';
                ctx.beginPath();
                ctx.arc(cx + 9, cy + 11, 1.5, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // 打开后内部发光
                ctx.fillStyle = '#4a7aaa';
                ctx.beginPath();
                ctx.ellipse(cx + 10, cy + 12, 7, 4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(100,180,220,0.3)';
                ctx.beginPath();
                ctx.arc(cx + 10, cy + 12, 5, 0, Math.PI * 2);
                ctx.fill();
            }
        } else {
            // 原陆地宝箱风格
            const baseColor = chest.opened ? '#5a3a1a' : '#8a5a2a';
            const borderColor = chest.opened ? '#4a2a0a' : '#6a3a1a';

            // 阴影
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(cx + 10, cy + 18, 10, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            // 箱体
            ctx.fillStyle = baseColor;
            ctx.fillRect(cx, cy + 6, 20, 12);
            ctx.strokeStyle = borderColor;
            ctx.lineWidth = 1;
            ctx.strokeRect(cx, cy + 6, 20, 12);

            // 盖子
            ctx.save();
            ctx.translate(cx + 10, cy + 6);
            ctx.rotate(-lidOpen * Math.PI / 180);
            ctx.translate(-10, -6);
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, 20, 7);
            ctx.strokeStyle = borderColor;
            ctx.strokeRect(0, 0, 20, 7);
            // 金色锁扣
            if (!chest.opened) {
                ctx.fillStyle = '#d4a843';
                ctx.fillRect(8, 4, 4, 4);
                ctx.fillStyle = '#f0d060';
                ctx.fillRect(9, 5, 2, 2);
            }
            ctx.restore();

            // 空箱内部
            if (chest.opened) {
                ctx.fillStyle = '#3a2a1a';
                ctx.fillRect(cx + 2, cy + 8, 16, 8);
            }
        }
    }

    // ==================== 传送门绘制 ====================
    function drawPortal(portal, camX, camY) {
        if (!portal) return;
        const px = portal.x - camX;
        const py = portal.y - camY;
        if (px < -50 || px > canvas.width + 50 || py < -50 || py > canvas.height + 50) return;

        const time = GameState.time;
        const isUnderwater = GameState.currentScene === 'pillarSea';

        if (isUnderwater) {
            // 水下漩涡风格
            const colors = ['#1a3a5a', '#153050', '#0f2848', '#0a1a2a', '#071420'];
            for (let i = 0; i < 5; i++) {
                const radius = 15 + i * 4;
                const offset = time * (2 + i * 0.5) * 0.05;
                ctx.strokeStyle = colors[i];
                ctx.globalAlpha = 0.3 + Math.sin(time * 0.1 + i) * 0.15;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(px, py, radius, offset, offset + Math.PI * 1.5);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;

            // 中心微光
            ctx.fillStyle = 'rgba(100,150,200,0.3)';
            ctx.globalAlpha = 0.4 + Math.sin(time * 0.2) * 0.2;
            ctx.beginPath();
            ctx.arc(px, py, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        } else {
            // 原彩色光圈风格
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff'];
            for (let i = 0; i < 5; i++) {
                const radius = 15 + i * 4;
                const offset = time * (2 + i * 0.5) * 0.05;
                ctx.strokeStyle = colors[i];
                ctx.globalAlpha = 0.4 + Math.sin(time * 0.1 + i) * 0.2;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(px, py, radius, offset, offset + Math.PI * 1.5);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;

            // 中心光点
            ctx.fillStyle = '#ffffff';
            ctx.globalAlpha = 0.6 + Math.sin(time * 0.2) * 0.3;
            ctx.beginPath();
            ctx.arc(px, py, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    // ==================== 传送门粒子爆发 ====================
    function spawnPortalParticles(x, y) {
        for (let i = 0; i < 20; i++) {
            const angle = (Math.PI * 2 / 20) * i;
            const speed = 50 + Math.random() * 80;
            GameState.portalParticles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1,
                color: ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3'][Math.floor(Math.random() * 4)]
            });
        }
    }

    // ==================== 互动元素系统 ====================
    const Interactables = {
        stones: [],
        fishingSpots: [],
        dustParticles: [],
        waterRipples: [],
        init() {
            // 迷雾森林 - 可推石头
            for (let i = 0; i < 4; i++) {
                this.stones.push({
                    x: 200 + i * 300 + Math.random() * 100,
                    y: 200 + Math.random() * 600,
                    radius: 10 + Math.random() * 6,
                    scene: 'flowerField',
                    pushed: false
                });
            }
            // 深海柱林 - 钓鱼点
            for (let i = 0; i < 3; i++) {
                this.fishingSpots.push({
                    x: 300 + i * 400 + Math.random() * 100,
                    y: 550 + Math.random() * 100,
                    scene: 'pillarSea',
                    active: false,
                    bobOffset: Math.random() * Math.PI * 2
                });
            }
        },
        update(dt) {
            // 灰尘粒子
            for (let i = this.dustParticles.length - 1; i >= 0; i--) {
                const p = this.dustParticles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt * 1.5;
                if (p.life <= 0) this.dustParticles.splice(i, 1);
            }
            // 水波纹
            for (let i = this.waterRipples.length - 1; i >= 0; i--) {
                const r = this.waterRipples[i];
                r.r += 15 * dt;
                r.alpha -= dt * 0.8;
                if (r.alpha <= 0) this.waterRipples.splice(i, 1);
            }
            // 钓鱼计时
            if (GameState.fishing.active) {
                GameState.fishing.timer -= dt;
                if (GameState.fishing.timer <= 0) {
                    // 钓到！
                    GameState.fishing.active = false;
                    GameState.totalFishCaught++;
                    GameState.orbsCollected++;
                    GameState.quests.current.current++;
                    checkQuestProgress();
                    addExp(10);
                    // 生成光球效果
                    if (GameState.fishing.spot) {
                        for (let i = 0; i < 8; i++) {
                            particlePool.get(GameState.fishing.spot.x, GameState.fishing.spot.y, 'sparkle');
                        }
                        GameState.expandingOrbs.push({
                            x: GameState.fishing.spot.x, y: GameState.fishing.spot.y,
                            radius: 4, maxRadius: 20, alpha: 1, color: '#88ddff'
                        });
                    }
                    GameState.fishing.spot = null;
                }
            }
        },
        draw(camX, camY) {
            const scene = GameState.currentScene;
            // 绘制石头
            this.stones.forEach(s => {
                if (s.scene !== scene) return;
                const sx = s.x - camX;
                const sy = s.y - camY;
                if (sx < -30 || sx > canvas.width + 30 || sy < -30 || sy > canvas.height + 30) return;
                // 阴影
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.ellipse(sx, sy + s.radius * 0.6, s.radius, s.radius * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();
                // 石头本体
                ctx.fillStyle = '#6a6a6a';
                ctx.beginPath();
                ctx.arc(sx, sy, s.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#7a7a7a';
                ctx.beginPath();
                ctx.arc(sx - s.radius * 0.2, sy - s.radius * 0.2, s.radius * 0.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#5a5a5a';
                ctx.beginPath();
                ctx.arc(sx + s.radius * 0.3, sy + s.radius * 0.1, s.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();
            });
            // 绘制钓鱼点浮标
            this.fishingSpots.forEach(fs => {
                if (fs.scene !== scene) return;
                const sx = fs.x - camX;
                const sy = fs.y - camY;
                if (sx < -20 || sx > canvas.width + 20 || sy < -20 || sy > canvas.height + 20) return;
                const bob = Math.sin(GameState.time * 2 + fs.bobOffset) * 2;
                // 浮标线
                ctx.strokeStyle = 'rgba(200,200,200,0.5)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(sx, sy + bob);
                ctx.lineTo(sx, sy - 15);
                ctx.stroke();
                // 浮标
                ctx.fillStyle = '#cc4444';
                ctx.fillRect(sx - 2, sy + bob - 2, 4, 4);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(sx - 1, sy + bob - 1, 2, 2);
            });
            // 灰尘粒子
            this.dustParticles.forEach(p => {
                const sx = p.x - camX;
                const sy = p.y - camY;
                ctx.fillStyle = `rgba(180,170,150,${p.life})`;
                ctx.fillRect(sx, sy, p.size, p.size);
            });
            // 水波纹
            this.waterRipples.forEach(r => {
                const sx = r.x - camX;
                const sy = r.y - camY;
                ctx.strokeStyle = `rgba(150,200,220,${r.alpha})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.ellipse(sx, sy, r.r, r.r * 0.4, 0, 0, Math.PI * 2);
                ctx.stroke();
            });
            // 钓鱼进度提示
            if (GameState.fishing.active && GameState.fishing.spot) {
                const sx = GameState.fishing.spot.x - camX;
                const sy = GameState.fishing.spot.y - camY - 25;
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(sx - 30, sy - 6, 60, 12);
                ctx.fillStyle = '#4a9aaa';
                const progress = 1 - (GameState.fishing.timer / 1.5);
                ctx.fillRect(sx - 28, sy - 4, 56 * progress, 8);
            }
        },
        tryPushStone() {
            const scene = GameState.currentScene;
            if (scene !== 'flowerField') return false;
            for (const s of this.stones) {
                if (s.scene !== scene) continue;
                const pdx = Player.x - s.x;
                const pdy = Player.y - s.y;
                const pdist = Math.sqrt(pdx * pdx + pdy * pdy);
                if (pdist < 30) {
                    // 推动石头
                    const pushDist = 20;
                    let pushX = 0, pushY = 0;
                    if (Player.direction === 'left') pushX = -pushDist;
                    else if (Player.direction === 'right') pushX = pushDist;
                    else if (Player.direction === 'up') pushY = -pushDist;
                    else if (Player.direction === 'down') pushY = pushDist;
                    s.x += pushX;
                    s.y += pushY;
                    s.x = Math.max(s.radius, Math.min(GameState.worldWidth - s.radius, s.x));
                    s.y = Math.max(s.radius, Math.min(GameState.worldHeight - s.radius, s.y));
                    // 灰尘粒子
                    for (let i = 0; i < 10; i++) {
                        this.dustParticles.push({
                            x: s.x, y: s.y,
                            vx: (Math.random() - 0.5) * 40,
                            vy: -10 - Math.random() * 20,
                            life: 0.5 + Math.random() * 0.5,
                            size: 2 + Math.random() * 2
                        });
                    }
                    return true;
                }
            }
            return false;
        },
        tryFish() {
            const scene = GameState.currentScene;
            if (scene !== 'pillarSea') return false;
            for (const fs of this.fishingSpots) {
                if (fs.scene !== scene) continue;
                const pdx = Player.x - fs.x;
                const pdy = Player.y - fs.y;
                const pdist = Math.sqrt(pdx * pdx + pdy * pdy);
                if (pdist < 30 && !GameState.fishing.active) {
                    GameState.fishing.active = true;
                    GameState.fishing.timer = 1.5;
                    GameState.fishing.spot = fs;
                    // 水波纹动画
                    for (let i = 0; i < 3; i++) {
                        this.waterRipples.push({
                            x: fs.x, y: fs.y,
                            r: 2 + i * 3, alpha: 0.5 - i * 0.1
                        });
                    }
                    return true;
                }
            }
            return false;
        }
    };

    // ==================== 绘制函数 ====================
    function drawPixelRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
    }

    function drawCharacter(px, py) {
        const costume = Player.costumes.list[Player.costumes.current];
        const c = {
            skin: Player.colors.skin, hair: Player.colors.hair,
            shirt: costume.shirt, pants: costume.pants,
            shoes: Player.colors.shoes,
            cloak: costume.cloak, cloakLight: costume.cloak
        };
        const frame = Player.isMoving ? Math.floor(Player.animFrame) % 4 : 0;
        const bob = Player.isMoving ? Math.sin(Player.animFrame * Math.PI) * 2 : 0;
        // idle 呼吸动画：不移动时轻微上下浮动
        const idleBreath = !Player.isMoving ? Math.sin(GameState.time * 0.05) * 1 : 0;
        // 走路时身体左右摇摆
        const sway = Player.isMoving ? Math.sin(Player.animFrame * 0.5) * 1 * (Player.direction === 'left' ? -1 : 1) : 0;
        const x = Math.floor(px - Player.width / 2 + sway);
        const y = Math.floor(py - Player.height / 2 + bob + idleBreath);

            // 角色阴影（根据场景调整）
            const playerShadowColor = GameState.currentScene === 'flowerField' ? 'rgba(0,0,0,0.15)'
                : GameState.currentScene === 'pillarSea' ? 'rgba(0,20,40,0.1)'
                : 'rgba(0,0,0,0.2)';
            ctx.fillStyle = playerShadowColor;
        ctx.beginPath();
        ctx.ellipse(px, py + 16, 8, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        // 斗篷（后）
        drawPixelRect(x + 2, y + 12, 20, 18, c.cloak);
        drawPixelRect(x + 4, y + 14, 16, 14, c.cloakLight);

        // 腿部
        const legOffset = frame === 1 ? -2 : frame === 3 ? 2 : 0;
        drawPixelRect(x + 6 + legOffset, y + 24, 4, 8, c.pants);
        drawPixelRect(x + 14 - legOffset, y + 24, 4, 8, c.pants);
        drawPixelRect(x + 6 + legOffset, y + 30, 4, 2, c.shoes);
        drawPixelRect(x + 14 - legOffset, y + 30, 4, 2, c.shoes);

        // 身体
        drawPixelRect(x + 6, y + 14, 12, 12, c.shirt);
        drawPixelRect(x + 10, y + 16, 4, 2, '#a93226');

        // 手臂
        let armOffset = frame === 1 ? 2 : frame === 3 ? -2 : 0;
        let leftArmWave = 0;
        let rightArmWave = 0;
        if (!Player.isMoving && Player.idleTime > 3) {
            // idle 挥手动画
            const wave = Math.sin(GameState.time * 0.1) * 3;
            leftArmWave = wave;
            rightArmWave = -wave;
        }
        drawPixelRect(x + 3, y + 15 + armOffset + leftArmWave, 3, 8, c.skin);
        drawPixelRect(x + 18, y + 15 - armOffset + rightArmWave, 3, 8, c.skin);

        // 头部
        drawPixelRect(x + 8, y + 4, 8, 10, c.skin);

        // 头发
        drawPixelRect(x + 7, y + 2, 10, 6, c.hair);
        drawPixelRect(x + 8, y + 1, 8, 2, c.hair);
        drawPixelRect(x + 6, y + 4, 2, 4, c.hair);
        drawPixelRect(x + 16, y + 4, 2, 4, c.hair);

        // 眼睛
        const eyeDir = Player.direction === 'left' ? -1 : Player.direction === 'right' ? 1 : 0;
        const eyeY = Player.direction === 'up' ? 6 : 8;
        if (Player.isBlinking) {
            // 眨眼：画成一条线
            drawPixelRect(x + 10 + eyeDir, y + eyeY + 1, 2, 1, '#1a1a1a');
            drawPixelRect(x + 13 + eyeDir, y + eyeY + 1, 2, 1, '#1a1a1a');
        } else {
            drawPixelRect(x + 10 + eyeDir, y + eyeY, 2, 2, '#1a1a1a');
            drawPixelRect(x + 13 + eyeDir, y + eyeY, 2, 2, '#1a1a1a');
            if (Player.direction !== 'up') {
                drawPixelRect(x + 10 + eyeDir, y + eyeY, 1, 1, '#fff');
                drawPixelRect(x + 13 + eyeDir, y + eyeY, 1, 1, '#fff');
            }
        }

        // 斗篷飘动
        const cloakWave = Math.sin(GameState.time * 0.1) * 2;
        drawPixelRect(x + 2 + cloakWave, y + 20, 4, 8, c.cloak);
        drawPixelRect(x + 18 - cloakWave, y + 20, 4, 8, c.cloak);
    }

    function drawFlowerField(camX, camY) {
        const s = Scenes.flowerField;
        if (s.groundDirty) prerenderGround('flowerField');

        // 地面填满整个画面
        ctx.drawImage(s.groundCanvas, -camX, -camY);
        // 填充屏幕边缘（防止黑色区域）
        const groundRight = GameState.worldWidth - camX;
        const groundBottom = GameState.worldHeight - camY;
        if (groundRight < canvas.width) {
            ctx.fillStyle = s.groundColor;
            ctx.fillRect(groundRight, 0, canvas.width - groundRight, canvas.height);
        }
        if (groundBottom < canvas.height) {
            ctx.fillStyle = s.groundColor;
            ctx.fillRect(0, groundBottom, canvas.width, canvas.height - groundBottom);
        }
        if (camX < 0) {
            ctx.fillStyle = s.groundColor;
            ctx.fillRect(0, 0, -camX, canvas.height);
        }
        if (camY < 0) {
            ctx.fillStyle = s.groundColor;
            ctx.fillRect(0, 0, canvas.width, -camY);
        }

        // 远景石头堆（视差）
        // 远景石头堆已移除

        // 前景草丛（半透明，在角色之前绘制）
        s.fgGrass.forEach(g => {
            const gx = g.x - camX;
            const gy = g.y - camY;
            if (gx > -10 && gx < canvas.width + 10 && gy > -10 && gy < canvas.height + 10) {
                const sway = Math.sin(GameState.time * 0.02 + g.sway) * 3;
                ctx.globalAlpha = 0.5;
                ctx.fillStyle = '#2a5a10';
                ctx.fillRect(Math.floor(gx - 1 + sway), Math.floor(gy - g.height), 1, g.height);
                ctx.fillRect(Math.floor(gx + 1 + sway), Math.floor(gy - g.height + 1), 1, g.height - 1);
                ctx.fillRect(Math.floor(gx + sway * 0.5), Math.floor(gy - g.height + 2), 1, g.height - 2);
                ctx.globalAlpha = 1;
            }
        });

        // 像素大树
        s.trees.forEach(t => {
            const tx = t.x - camX;
            const ty = t.y - camY;
            if (tx > -60 && tx < canvas.width + 60 && ty > -80 && ty < canvas.height + 80) {
                const s = t.size;
                const sway = Math.sin(GameState.time * 0.008 + t.sway) * 1;
                // 树干
                ctx.fillStyle = '#5a3a1a';
                ctx.fillRect(Math.floor(tx - 2 * s), Math.floor(ty - 10 * s), 4 * s, 14 * s);
                ctx.fillStyle = '#4a2a10';
                ctx.fillRect(Math.floor(tx - 1 * s), Math.floor(ty - 8 * s), 2 * s, 12 * s);
                // 树冠（深色剪影风格）
                const crownX = Math.floor(tx + sway);
                const crownY = Math.floor(ty - 20 * s);
                if (t.type === 0) {
                    // 大树剪影
                    const darkColors = ['#1a3a0a','#1e4210','#223a12','#1a3210'];
                    const px4 = Math.floor(4 * s);
                    for (let row = 0; row < 4; row++) {
                        for (let col = 0; col < 5; col++) {
                            ctx.fillStyle = darkColors[(row + col) % darkColors.length];
                            ctx.fillRect(crownX - 2 * px4 + col * px4, crownY + 2 * px4 - row * px4, px4, px4);
                        }
                    }
                    for (let row = 0; row < 3; row++) {
                        for (let col = 0; col < 4; col++) {
                            ctx.fillStyle = darkColors[(row + col + 1) % darkColors.length];
                            ctx.fillRect(crownX - 1.5 * px4 + col * px4, crownY - row * px4, px4, px4);
                        }
                    }
                    for (let row = 0; row < 2; row++) {
                        for (let col = 0; col < 3; col++) {
                            ctx.fillStyle = darkColors[(row + col + 2) % darkColors.length];
                            ctx.fillRect(crownX - px4 + col * px4, crownY - 2 * px4 - row * px4, px4, px4);
                        }
                    }
                } else if (t.type === 1) {
                    // 松树剪影
                    const darkPine = ['#1a3a0a','#1e4210','#223a12','#1a3210'];
                    const px4 = Math.floor(4 * s);
                    for (let col = -3; col <= 3; col++) {
                        ctx.fillStyle = darkPine[Math.abs(col) % darkPine.length];
                        ctx.fillRect(crownX + col * px4, crownY + 2 * px4, px4, px4);
                    }
                    for (let col = -2; col <= 2; col++) {
                        ctx.fillStyle = darkPine[(Math.abs(col) + 1) % darkPine.length];
                        ctx.fillRect(crownX + col * px4, crownY + px4, px4, px4);
                    }
                    for (let col = -1; col <= 1; col++) {
                        ctx.fillStyle = darkPine[(Math.abs(col) + 2) % darkPine.length];
                        ctx.fillRect(crownX + col * px4, crownY, px4, px4);
                    }
                    ctx.fillStyle = darkPine[3];
                    ctx.fillRect(crownX, crownY - px4, px4, px4);
                } else {
                    // 灌木剪影
                    const darkBush = ['#1a3a0a','#1e4210','#223a12'];
                    const px3 = Math.floor(3 * s);
                    for (let row = 0; row < 3; row++) {
                        for (let col = 0; col < 4; col++) {
                            ctx.fillStyle = darkBush[(row + col) % darkBush.length];
                            ctx.fillRect(crownX - 1.5 * px3 + col * px3, crownY + px3 - row * px3, px3, px3);
                        }
                    }
                    for (let row = 0; row < 2; row++) {
                        for (let col = 0; col < 3; col++) {
                            ctx.fillStyle = darkBush[(row + col + 1) % darkBush.length];
                            ctx.fillRect(crownX - px3 + col * px3, crownY - row * px3, px3, px3);
                        }
                    }
                }
                // 树影
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.beginPath();
                ctx.ellipse(Math.floor(tx), Math.floor(ty + 4 * s), 14 * s, 4, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        });

        // 装饰物
        s.decorations.forEach(d => {
            const dx = d.x - camX;
            const dy = d.y - camY;
            if (dx > -20 && dx < canvas.width + 20 && dy > -20 && dy < canvas.height + 20) {
                if (d.type === 'bush') {
                    ctx.fillStyle = '#2d5a14';
                    ctx.fillRect(dx, dy, d.size, d.size * 0.6);
                    ctx.fillStyle = '#3a7020';
                    ctx.fillRect(dx + 1, dy - 1, d.size - 2, d.size * 0.5);
                } else {
                    ctx.fillStyle = '#6a6a5a';
                    ctx.fillRect(dx, dy, d.size * 0.7, d.size * 0.5);
                    ctx.fillStyle = '#7a7a6a';
                    ctx.fillRect(dx, dy, d.size * 0.5, d.size * 0.3);
                }
                // 装饰物阴影
                drawShadow(d.x + d.size / 2 - camX, d.y + d.size * 0.4 - camY, d.size * 0.5, 3, 0.15);
            }
        });

        // 森林蘑菇（代替花朵）
        s.flowers.forEach(f => {
            const fx = f.x - camX;
            const fy = f.y - camY;
            if (fx > -15 && fx < canvas.width + 15 && fy > -15 && fy < canvas.height + 15) {
                // 蘑菇茎
                ctx.fillStyle = '#d0c0a0';
                ctx.fillRect(Math.floor(fx), Math.floor(fy), 2, 4);
                // 蘑菇帽（红色或棕色）
                ctx.fillStyle = f.color === '#ffdd44' ? '#cc4444' : '#8a5a3a';
                ctx.fillRect(Math.floor(fx - 2), Math.floor(fy - 3), 6, 3);
                // 蘑菇点
                ctx.fillStyle = '#f0e0d0';
                ctx.fillRect(Math.floor(fx - 1), Math.floor(fy - 2), 1, 1);
                ctx.fillRect(Math.floor(fx + 1), Math.floor(fy - 2), 1, 1);
            }
        });

        // 迷雾效果（角色周围）
        const px = Player.x - camX;
        const py = Player.y - camY;
        const fogGrad = ctx.createRadialGradient(px, py, 30, px, py, 250);
        fogGrad.addColorStop(0, 'rgba(200,220,200,0)');
        fogGrad.addColorStop(0.5, 'rgba(180,200,180,0.05)');
        fogGrad.addColorStop(1, 'rgba(160,180,160,0.15)');
        ctx.fillStyle = fogGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 萤火虫
        if (!GameState.fireflies) {
            GameState.fireflies = [];
            for (let i = 0; i < 20; i++) {
                GameState.fireflies.push({
                    x: Math.random() * GameState.worldWidth,
                    y: Math.random() * GameState.worldHeight,
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.5 + Math.random() * 1
                });
            }
        }
        GameState.fireflies.forEach(ff => {
            ff.x += Math.sin(GameState.time * 0.01 + ff.phase) * ff.speed;
            ff.y += Math.cos(GameState.time * 0.008 + ff.phase) * ff.speed * 0.5;
            const brightness = 0.3 + Math.sin(GameState.time * 0.05 + ff.phase) * 0.3;
            const ffx = ff.x - camX;
            const ffy = ff.y - camY;
            if (ffx > -5 && ffx < canvas.width + 5 && ffy > -5 && ffy < canvas.height + 5) {
                ctx.fillStyle = `rgba(200,255,100,${brightness})`;
                ctx.fillRect(Math.floor(ffx), Math.floor(ffy), 2, 2);
                ctx.fillStyle = `rgba(200,255,100,${brightness * 0.3})`;
                ctx.fillRect(Math.floor(ffx - 1), Math.floor(ffy - 1), 4, 4);
            }
        });

    }

    function drawCloudSea(camX, camY) {
        const s = Scenes.cloudSea;
        if (s.groundDirty) prerenderGround('cloudSea');

        // 地面填满整个画面
        ctx.drawImage(s.groundCanvas, -camX, -camY);
        const groundRight2 = GameState.worldWidth - camX;
        const groundBottom2 = GameState.worldHeight - camY;
        if (groundRight2 < canvas.width) {
            ctx.fillStyle = s.groundColor;
            ctx.fillRect(groundRight2, 0, canvas.width - groundRight2, canvas.height);
        }
        if (groundBottom2 < canvas.height) {
            ctx.fillStyle = s.groundColor;
            ctx.fillRect(0, groundBottom2, canvas.width, canvas.height - groundBottom2);
        }
        if (camX < 0) {
            ctx.fillStyle = s.groundColor;
            ctx.fillRect(0, 0, -camX, canvas.height);
        }
        if (camY < 0) {
            ctx.fillStyle = s.groundColor;
            ctx.fillRect(0, 0, canvas.width, -camY);
        }

        // 浮空云朵平台
        s.clouds.forEach(c => {
            const cx = c.x - camX;
            const cy = c.y - camY + Math.sin(GameState.time * 0.01 + c.x * 0.01) * 5;
            if (cx > -50 && cx < canvas.width + 50) {
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fillRect(cx - 15, cy, 30, 8);
                ctx.fillRect(cx - 10, cy - 3, 20, 5);
                ctx.fillRect(cx - 5, cy - 5, 10, 5);
                // 云朵高光
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(cx - 12, cy - 2, 24, 3);
            }
        });

        // 木栅栏
        s.decorations.forEach(d => {
            const dx = d.x - camX;
            const dy = d.y - camY;
            if (dx > -20 && dx < canvas.width + 20 && dy > -20 && dy < canvas.height + 20) {
                if (d.type === 'fence') {
                    ctx.fillStyle = '#6a4a2a';
                    ctx.fillRect(dx, dy, 2, d.size);
                    ctx.fillRect(dx + 6, dy, 2, d.size);
                    ctx.fillRect(dx - 2, dy + 3, 12, 2);
                    ctx.fillRect(dx - 2, dy + 8, 12, 2);
                }
            }
        });

        // 金色花朵（多层）
        s.flowers.forEach(f => {
            const fx = f.x - camX;
            const fy = f.y - camY;
            if (fx > -15 && fx < canvas.width + 15 && fy > -15 && fy < canvas.height + 15) {
                const sway = Math.sin(GameState.time * 0.015 + f.sway) * 2;
                // 花茎
                ctx.fillStyle = '#5a6a2a';
                ctx.fillRect(Math.floor(fx), Math.floor(fy), 1, f.height);
                // 花朵（多层花瓣）
                ctx.fillStyle = f.color;
                ctx.fillRect(Math.floor(fx - 2 + sway), Math.floor(fy - 3), 5, 4);
                ctx.fillRect(Math.floor(fx - 1 + sway), Math.floor(fy - 5), 3, 3);
                ctx.fillRect(Math.floor(fx + sway), Math.floor(fy - 6), 1, 2);
                // 花心
                ctx.fillStyle = '#d4a843';
                ctx.fillRect(Math.floor(fx + sway), Math.floor(fy - 3), 2, 2);
            }
        });

        // 云层（缓慢移动）
        s.clouds.forEach(c => {
            c.x += c.speed * deltaTime;
            if (c.x > GameState.worldWidth + c.width) c.x = -c.width;
            const cx = c.x - camX * 0.5;
            const cy = c.y - camY * 0.3;
            if (cx + c.width > -50 && cx < canvas.width + 50) {
                ctx.fillStyle = `rgba(255, 250, 240, ${c.opacity})`;
                ctx.fillRect(cx, cy, c.width, c.height);
                ctx.fillStyle = `rgba(255, 255, 255, ${c.opacity * 0.5})`;
                ctx.fillRect(cx + c.width * 0.2, cy - 3, c.width * 0.6, c.height * 0.5);
            }
        });

        // 天空渐变 - 暖色调黄昏
        const csSky2 = ctx.createLinearGradient(0, 0, 0, 300);
        csSky2.addColorStop(0, 'rgba(200, 160, 140, 0.4)');
        csSky2.addColorStop(0.4, 'rgba(220, 190, 150, 0.2)');
        csSky2.addColorStop(1, 'transparent');
        ctx.fillStyle = csSky2;
        ctx.fillRect(0, 0, canvas.width, 300);

        // 阳光光束
        ctx.fillStyle = 'rgba(255, 220, 150, 0.03)';
        for (let i = 0; i < 4; i++) {
            const bx = 150 + i * 180 + Math.sin(GameState.time * 0.005 + i) * 40;
            ctx.beginPath();
            ctx.moveTo(bx, 0);
            ctx.lineTo(bx - 30, 400);
            ctx.lineTo(bx + 30, 400);
            ctx.closePath();
            ctx.fill();
        }

        // 彩虹效果（固定位置，不随相机移动）
        const rainbowColors = [
            { r: 255, g: 0, b: 0 },
            { r: 255, g: 127, b: 0 },
            { r: 255, g: 255, b: 0 },
            { r: 0, g: 255, b: 0 },
            { r: 0, g: 127, b: 255 },
            { r: 139, g: 0, b: 255 }
        ];
        const rainbowX = canvas.width * 0.6;
        const rainbowY = canvas.height * 0.15;
        const rainbowRadius = 140;
        ctx.lineWidth = 6;
        rainbowColors.forEach((col, i) => {
            ctx.strokeStyle = `rgba(${col.r},${col.g},${col.b},0.15)`;
            ctx.beginPath();
            ctx.arc(rainbowX, rainbowY, rainbowRadius - i * 7, Math.PI, 0);
            ctx.stroke();
        });

        // 云海星星粒子
        if (!GameState.cloudParticles) {
            GameState.cloudParticles = [];
            for (let i = 0; i < 15; i++) {
                GameState.cloudParticles.push({
                    x: Math.random() * GameState.worldWidth,
                    y: Math.random() * GameState.worldHeight,
                    phase: Math.random() * Math.PI * 2,
                    size: 1 + Math.random() * 2
                });
            }
        }
        GameState.cloudParticles.forEach(p => {
            const brightness = 0.3 + Math.sin(GameState.time * 0.04 + p.phase) * 0.3;
            const px = p.x - camX;
            const py = p.y - camY;
            if (px > -5 && px < canvas.width + 5 && py > -5 && py < canvas.height + 5) {
                ctx.fillStyle = `rgba(255,255,200,${brightness})`;
                ctx.fillRect(Math.floor(px), Math.floor(py), Math.ceil(p.size), Math.ceil(p.size));
            }
        });
    }

    function drawPillarSea(camX, camY) {
        const s = Scenes.pillarSea;
        if (s.groundDirty) prerenderGround('pillarSea');

        // 地面填满整个画面
        ctx.drawImage(s.groundCanvas, -camX, -camY);
        const groundRight3 = GameState.worldWidth - camX;
        const groundBottom3 = GameState.worldHeight - camY;
        if (groundRight3 < canvas.width) {
            ctx.fillStyle = s.groundColor;
            ctx.fillRect(groundRight3, 0, canvas.width - groundRight3, canvas.height);
        }
        if (groundBottom3 < canvas.height) {
            ctx.fillStyle = s.groundColor;
            ctx.fillRect(0, groundBottom3, canvas.width, canvas.height - groundBottom3);
        }
        if (camX < 0) {
            ctx.fillStyle = s.groundColor;
            ctx.fillRect(0, 0, -camX, canvas.height);
        }
        if (camY < 0) {
            ctx.fillStyle = s.groundColor;
            ctx.fillRect(0, 0, canvas.width, -camY);
        }

        const waterBaseY = 400;

        // 水面波纹
        for (let i = 0; i < 40; i++) {
            const wx = ((i * 73 + GameState.time * 0.5) % (canvas.width + 100)) - 50;
            const wy = waterBaseY + (i * 7) % 200;
            ctx.fillStyle = `rgba(100, 180, 200, ${0.06 + Math.sin(i + GameState.time * 0.03) * 0.03})`;
            ctx.fillRect(wx, wy, 15 + Math.sin(i * 0.5 + GameState.time * 0.02) * 8, 1);
        }

        // 水面反光线条
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 12; i++) {
            const rx = ((i * 127 + GameState.time * 0.3) % (canvas.width + 60)) - 30;
            const ry = waterBaseY + 10 + (i * 17) % 180;
            const rLen = 8 + Math.sin(i * 0.7 + GameState.time * 0.04) * 6;
            ctx.beginPath();
            ctx.moveTo(rx, ry);
            ctx.lineTo(rx + rLen, ry + Math.sin(GameState.time * 0.05 + i) * 1);
            ctx.stroke();
        }

        // 动态波纹（正弦波线条）
        ctx.strokeStyle = 'rgba(100,200,255,0.2)';
        ctx.lineWidth = 1;
        for (let w = 0; w < 5; w++) {
            ctx.beginPath();
            const waveY = waterBaseY + 20 + w * 35;
            for (let x = 0; x < canvas.width; x += 2) {
                const wy = waveY + Math.sin(x * 0.02 + GameState.time * 0.03 + w * 1.5) * 4;
                if (x === 0) ctx.moveTo(x, wy);
                else ctx.lineTo(x, wy);
            }
            ctx.stroke();
        }

        // 水下光线（斜线光柱）
        for (let i = 0; i < 6; i++) {
            const lx = 80 + i * 130 + Math.sin(GameState.time * 0.005 + i * 2) * 40;
            const lw = 3 + Math.sin(i * 1.5) * 2;
            ctx.fillStyle = 'rgba(100,200,255,0.08)';
            ctx.beginPath();
            ctx.moveTo(lx, waterBaseY);
            ctx.lineTo(lx + lw, waterBaseY);
            ctx.lineTo(lx + lw + 30, canvas.height);
            ctx.lineTo(lx + 30, canvas.height);
            ctx.closePath();
            ctx.fill();
        }

        // 气泡绘制
        // 气泡绘制已移除
        /* GameState.bubbles.forEach(b => {
            const bx = b.x - camX;
            const by = b.y - camY;
            if (by > waterBaseY && by < canvas.height && bx > -10 && bx < canvas.width + 10) {
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.arc(bx, by, b.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.beginPath();
                ctx.arc(bx - b.size * 0.3, by - b.size * 0.3, b.size * 0.3, 0, Math.PI * 2);
                ctx.fill();
            }
        }); */

        // 初始化瀑布柱子索引
        if (!GameState.waterfallPillars) {
            const indices = [];
            while (indices.length < Math.min(3, Math.max(2, s.pillars.length))) {
                const idx = Math.floor(Math.random() * s.pillars.length);
                if (!indices.includes(idx)) indices.push(idx);
            }
            GameState.waterfallPillars = indices;
        }

        // 柱子（从远到近，先画远的）
        s.pillars.forEach((p, idx) => {
            const px = p.x - camX * p.parallax;
            const py = p.y - camY * (0.3 + p.depth * 0.3);
            if (px + p.width > -50 && px < canvas.width + 50) {
                // 根据视差深度选择柱子颜色
                let c1, c2, c3;
                if (p.parallax < 0.5) {
                    c1 = `rgba(13, 42, 58, ${p.opacity})`;
                    c2 = `rgba(18, 50, 68, ${p.opacity})`;
                    c3 = `rgba(10, 35, 50, ${p.opacity})`;
                } else if (p.parallax <= 0.8) {
                    c1 = `rgba(26, 58, 74, ${p.opacity})`;
                    c2 = `rgba(35, 75, 95, ${p.opacity})`;
                    c3 = `rgba(20, 50, 65, ${p.opacity})`;
                } else {
                    c1 = `rgba(42, 74, 90, ${p.opacity})`;
                    c2 = `rgba(55, 95, 115, ${p.opacity})`;
                    c3 = `rgba(35, 65, 80, ${p.opacity})`;
                }
                const pg = ctx.createLinearGradient(px, py, px + p.width, py);
                pg.addColorStop(0, c1);
                pg.addColorStop(0.5, c2);
                pg.addColorStop(1, c3);
                ctx.fillStyle = pg;
                ctx.fillRect(px, py, p.width, p.height);
                ctx.fillStyle = `rgba(100, 200, 220, ${p.opacity * 0.15})`;
                ctx.fillRect(px + p.width * 0.2, py, p.width * 0.25, p.height);

                // 柱子表面纹理（竖向细线）
                ctx.fillStyle = p.parallax < 0.5 ? 'rgba(8, 28, 40, 0.4)' : (p.parallax <= 0.8 ? 'rgba(15, 40, 55, 0.4)' : 'rgba(25, 55, 70, 0.4)');
                for (let tx = 0; tx < p.width; tx += 4) {
                    ctx.fillRect(px + tx, py, 1, p.height);
                }

                // 瀑布效果
                if (GameState.waterfallPillars.includes(idx)) {
                    const wfX = px + p.width * 0.3;
                    const wfW = p.width * 0.4;
                    for (let wy = py; wy < py + p.height; wy += 3) {
                        const wave = Math.sin(GameState.time * 0.05 + wy * 0.1) * 2;
                        ctx.fillStyle = 'rgba(200,220,255,0.6)';
                        ctx.fillRect(wfX + wave, wy, wfW, 1);
                    }
                    // 底部水花飞溅
                    for (let sp = 0; sp < 5; sp++) {
                        const spX = wfX + Math.random() * wfW;
                        const spY = py + p.height + Math.random() * 4;
                        ctx.fillStyle = 'rgba(255,255,255,0.5)';
                        ctx.fillRect(spX, spY, 1 + Math.random(), 1 + Math.random());
                    }
                }

                // 水面反射
                drawWaterReflection(p.x + p.width / 2, py, p.width, p.height, camX, camY, waterBaseY);

                // 柱子阴影
                drawShadow(p.x + p.width / 2 - camX, py + p.height - camY, p.width * 0.6, 6, p.opacity * 0.2);
            }
        });

        // 发光球
        s.decorations.forEach(d => {
            const dx = d.x - camX;
            const dy = d.y - camY;
            if (dx > -10 && dx < canvas.width + 10 && dy > -10 && dy < canvas.height + 10) {
                const pulse = 0.5 + Math.sin(GameState.time * 0.05 + d.pulse) * 0.5;
                const nightBoost = DayNight.ambientAlpha > 0.4 ? 2 : 1;
                ctx.fillStyle = `rgba(200, 220, 255, ${pulse * 0.3 * nightBoost})`;
                ctx.fillRect(dx - 1, dy - 1, d.size + 2, d.size + 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${pulse * 0.6 * nightBoost})`;
                ctx.fillRect(dx, dy, d.size, d.size);
            }
        });

        // 天空
        const psSky2 = ctx.createLinearGradient(0, 0, 0, 250);
        psSky2.addColorStop(0, `rgba(10, 26, 46, ${0.8 - DayNight.sunIntensity * 0.3})`);
        psSky2.addColorStop(0.5, `rgba(26, 58, 90, ${0.4 - DayNight.sunIntensity * 0.2})`);
        psSky2.addColorStop(1, 'transparent');
        ctx.fillStyle = psSky2;
        ctx.fillRect(0, 0, canvas.width, 250);

        // 丁达尔光束
        const beamAlpha = 0.015 + DayNight.sunIntensity * 0.02;
        ctx.fillStyle = `rgba(200, 180, 100, ${beamAlpha})`;
        for (let i = 0; i < 5; i++) {
            const bx = 100 + i * 150 + Math.sin(GameState.time * 0.008 + i) * 30;
            ctx.beginPath();
            ctx.moveTo(bx, 0);
            ctx.lineTo(bx - 25, 350);
            ctx.lineTo(bx + 25, 350);
            ctx.closePath();
            ctx.fill();
        }

        // 水母粒子
        if (!GameState.jellyfish) {
            GameState.jellyfish = [];
            for (let i = 0; i < 8; i++) {
                GameState.jellyfish.push({
                    x: Math.random() * GameState.worldWidth,
                    y: 100 + Math.random() * (GameState.worldHeight - 200),
                    phase: Math.random() * Math.PI * 2,
                    size: 4 + Math.random() * 4
                });
            }
        }
        GameState.jellyfish.forEach(j => {
            j.y += Math.sin(GameState.time * 0.015 + j.phase) * 0.3;
            j.x += Math.cos(GameState.time * 0.008 + j.phase) * 0.2;
            const jx = j.x - camX;
            const jy = j.y - camY;
            if (jx > -10 && jx < canvas.width + 10 && jy > -10 && jy < canvas.height + 10) {
                // 水母身体
                ctx.fillStyle = 'rgba(150,100,200,0.4)';
                ctx.fillRect(Math.floor(jx - j.size/2), Math.floor(jy), Math.ceil(j.size), Math.ceil(j.size * 0.6));
                // 水母触须
                ctx.fillStyle = 'rgba(150,100,200,0.2)';
                const tentLen = j.size * 0.8;
                for (let ti = 0; ti < 3; ti++) {
                    const tx = jx - j.size/3 + ti * j.size/3;
                    const tw = Math.sin(GameState.time * 0.03 + j.phase + ti) * 2;
                    ctx.fillRect(Math.floor(tx + tw), Math.floor(jy + j.size * 0.6), 1, Math.ceil(tentLen));
                }
            }
        });

        // 海底珊瑚
        if (!s.corals) {
            s.corals = [];
            for (let i = 0; i < 15; i++) {
                s.corals.push({
                    x: Math.random() * GameState.worldWidth,
                    y: GameState.worldHeight - 20 - Math.random() * 30,
                    type: Math.floor(Math.random() * 3),
                    color: ['#cc4444', '#ff8844', '#44aacc'][Math.floor(Math.random() * 3)]
                });
            }
        }
        s.corals.forEach(c => {
            const cx = c.x - camX;
            const cy = c.y - camY;
            if (cx > -20 && cx < canvas.width + 20) {
                ctx.fillStyle = c.color;
                if (c.type === 0) {
                    // 分支状珊瑚
                    ctx.fillRect(cx, cy, 3, 8);
                    ctx.fillRect(cx - 3, cy - 3, 3, 5);
                    ctx.fillRect(cx + 3, cy - 2, 3, 4);
                } else if (c.type === 1) {
                    // 圆形珊瑚
                    ctx.fillRect(cx - 2, cy - 2, 5, 5);
                    ctx.fillRect(cx - 1, cy - 4, 3, 3);
                } else {
                    // 海草
                    ctx.fillStyle = '#2a6a3a';
                    const sway = Math.sin(GameState.time * 0.02 + c.x) * 3;
                    ctx.fillRect(cx + sway, cy - 10, 2, 10);
                }
            }
        });

        // 水面倒影
        const reflectY = canvas.height * 0.85;
        // 角色倒影
        const playerScreenX = Player.x - camX;
        const playerScreenY = Player.y - camY;
        if (playerScreenY < reflectY) {
            ctx.save();
            ctx.globalAlpha = 0.15;
            ctx.translate(0, reflectY * 2);
            ctx.scale(1, -1);
            drawCharacter(playerScreenX, playerScreenY);
            ctx.restore();
        }
        // 小猫倒影
        const catScreenX = Cat.x - camX;
        const catScreenY = Cat.y - camY;
        if (catScreenY < reflectY) {
            ctx.save();
            ctx.globalAlpha = 0.1;
            ctx.translate(0, reflectY * 2);
            ctx.scale(1, -1);
            ctx.fillStyle = '#cc9922';
            ctx.fillRect(catScreenX - 4, catScreenY - 3, 8, 6);
            ctx.restore();
        }
        // 水面线
        ctx.strokeStyle = 'rgba(100,180,220,0.2)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, reflectY);
        ctx.lineTo(canvas.width, reflectY);
        ctx.stroke();
    }
