        if (camY < 0) {
            ctx.fillStyle = s.groundColor;
            ctx.fillRect(0, 0, canvas.width, -camY);
        }

        // 洞穴顶部暗影
        const caveTop = ctx.createLinearGradient(0, 0, 0, 120);
        caveTop.addColorStop(0, 'rgba(10, 5, 5, 0.8)');
        caveTop.addColorStop(1, 'transparent');
        ctx.fillStyle = caveTop;
        ctx.fillRect(0, 0, canvas.width, 120);

        // 熔岩池（红色发光圆形，带脉冲动画）
        s.lavaPools.forEach(pool => {
            const px = pool.x - camX;
            const py = pool.y - camY;
            if (px > -60 && px < canvas.width + 60 && py > -60 && py < canvas.height + 60) {
                const pulse = 1 + Math.sin(GameState.time * 0.05 + pool.pulse) * 0.3;
                const r = pool.radius * pulse;
                // 外层光晕
                const glow = ctx.createRadialGradient(px, py, 0, px, py, r * 1.5);
                glow.addColorStop(0, 'rgba(255, 68, 0, 0.4)');
                glow.addColorStop(0.5, 'rgba(255, 40, 0, 0.15)');
                glow.addColorStop(1, 'transparent');
                ctx.fillStyle = glow;
                ctx.fillRect(px - r * 1.5, py - r * 1.5, r * 3, r * 3);
                // 熔岩池本体
                const lavaGrad = ctx.createRadialGradient(px, py, 0, px, py, r);
                lavaGrad.addColorStop(0, '#ff6600');
                lavaGrad.addColorStop(0.4, '#ff4400');
                lavaGrad.addColorStop(0.8, '#cc2200');
                lavaGrad.addColorStop(1, '#881100');
                ctx.fillStyle = lavaGrad;
                ctx.beginPath();
                ctx.arc(px, py, r, 0, Math.PI * 2);
                ctx.fill();
                // 高光
                ctx.fillStyle = 'rgba(255, 200, 100, 0.3)';
                ctx.beginPath();
                ctx.arc(px - r * 0.2, py - r * 0.2, r * 0.3, 0, Math.PI * 2);
                ctx.fill();
            }
        });

        // 石柱（棕灰色，比柱海的柱子更粗）
        s.pillars.forEach(p => {
            const px = p.x - camX * p.parallax;
            const py = p.y - camY * 0.3;
            if (px + p.width > -50 && px < canvas.width + 50 && py + p.height > -50 && py < canvas.height + 50) {
                // 石柱本体
                const pillarGrad = ctx.createLinearGradient(px, py, px + p.width, py);
                pillarGrad.addColorStop(0, `rgba(74, 58, 42, ${p.opacity})`);
                pillarGrad.addColorStop(0.3, `rgba(90, 72, 55, ${p.opacity})`);
                pillarGrad.addColorStop(0.7, `rgba(80, 65, 48, ${p.opacity})`);
                pillarGrad.addColorStop(1, `rgba(60, 48, 35, ${p.opacity})`);
                ctx.fillStyle = pillarGrad;
                ctx.fillRect(px, py, p.width, p.height);
                // 石柱纹理
                ctx.fillStyle = `rgba(50, 40, 30, ${p.opacity * 0.5})`;
                for (let tx = 0; tx < p.width; tx += 5) {
                    ctx.fillRect(px + tx, py, 1, p.height);
                }
                // 石柱顶部
                ctx.fillStyle = `rgba(100, 80, 60, ${p.opacity})`;
                ctx.fillRect(px - 2, py, p.width + 4, 4);
                // 石柱底部
                ctx.fillStyle = `rgba(60, 45, 30, ${p.opacity})`;
                ctx.fillRect(px - 1, py + p.height - 3, p.width + 2, 3);
                // 阴影
                drawShadow(p.x + p.width / 2 - camX, py + p.height - camY, p.width * 0.6, 6, p.opacity * 0.2);
            }
        });

        // 天气效果：上升的火星粒子
        if (!GameState.lavaEmbers) {
            GameState.lavaEmbers = [];
            for (let i = 0; i < 40; i++) {
                GameState.lavaEmbers.push({
                    x: Math.random() * GameState.worldWidth,
                    y: Math.random() * GameState.worldHeight,
                    vx: (Math.random() - 0.5) * 10,
                    vy: -20 - Math.random() * 30,
                    life: Math.random(),
                    size: 1 + Math.random() * 2
                });
            }
        }
        GameState.lavaEmbers.forEach(e => {
            e.x += e.vx * 0.016;
            e.y += e.vy * 0.016;
            e.life -= 0.005;
            if (e.life <= 0 || e.y < 0) {
                e.x = Math.random() * GameState.worldWidth;
                e.y = GameState.worldHeight - Math.random() * 100;
                e.life = 0.5 + Math.random() * 0.5;
                e.vx = (Math.random() - 0.5) * 10;
                e.vy = -20 - Math.random() * 30;
            }
            const ex = e.x - camX;
            const ey = e.y - camY;
            if (ex > -5 && ex < canvas.width + 5 && ey > -5 && ey < canvas.height + 5) {
                ctx.fillStyle = `rgba(255, 102, 0, ${e.life * 0.8})`;
                ctx.fillRect(Math.floor(ex), Math.floor(ey), Math.ceil(e.size), Math.ceil(e.size));
                // 火星光晕
                ctx.fillStyle = `rgba(255, 150, 50, ${e.life * 0.3})`;
                ctx.fillRect(Math.floor(ex) - 1, Math.floor(ey) - 1, Math.ceil(e.size) + 2, Math.ceil(e.size) + 2);
            }
        });

        // 洞穴环境光（红色微光）
        const ambientGlow = ctx.createRadialGradient(
            canvas.width / 2, canvas.height / 2, 0,
            canvas.width / 2, canvas.height / 2, canvas.width * 0.6
        );
        ambientGlow.addColorStop(0, 'rgba(80, 20, 0, 0.05)');
        ambientGlow.addColorStop(1, 'rgba(40, 10, 0, 0.1)');
        ctx.fillStyle = ambientGlow;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // ==================== 小地图 ====================
    function drawMinimap() {
        const mw = minimapCanvas.width;
        const mh = minimapCanvas.height;
        const scaleX = mw / GameState.worldWidth;
        const scaleY = mh / GameState.worldHeight;
        minimapCtx.clearRect(0, 0, mw, mh);

        const isNight = DayNight.ambientAlpha > 0.4;
        if (GameState.currentScene === 'flowerField') {
            minimapCtx.fillStyle = isNight ? '#1a3010' : '#3a6a1a';
        } else if (GameState.currentScene === 'lavaCave') {
            minimapCtx.fillStyle = isNight ? '#100505' : '#2a1a0a';
        } else {
            minimapCtx.fillStyle = isNight ? '#060d18' : '#0d1f2d';
        }
        minimapCtx.fillRect(0, 0, mw, mh);

        const s = Scenes[GameState.currentScene];
        minimapCtx.fillStyle = GameState.currentScene === 'flowerField' ? 'rgba(26,58,58,0.5)' : GameState.currentScene === 'lavaCave' ? 'rgba(74,58,42,0.5)' : 'rgba(45,125,138,0.6)';
        s.pillars.forEach(p => {
            minimapCtx.fillRect(p.x * scaleX, p.y * scaleY, Math.max(2, p.width * scaleX), Math.max(4, p.height * scaleY));
        });

        minimapCtx.strokeStyle = 'rgba(255,255,255,0.4)';
        minimapCtx.lineWidth = 1;
        minimapCtx.strokeRect(
            GameState.camera.x * scaleX,
            GameState.camera.y * scaleY,
            canvas.width * scaleX,
            canvas.height * scaleY
        );

        // 小猫
        minimapCtx.fillStyle = '#e8a838';
        minimapCtx.fillRect(Cat.x * scaleX - 1, Cat.y * scaleY - 1, 2, 2);

        // 角色
        minimapCtx.fillStyle = '#c0392b';
        minimapCtx.fillRect(Player.x * scaleX - 2, Player.y * scaleY - 2, 4, 4);
    }

    // ==================== 大气雾化 ====================
    function drawAtmosphericFog(camX, camY) {
        // 远景雾化层 — 根据场景类型调整颜色
        const fogColor = GameState.currentScene === 'flowerField'
            ? { r: 180, g: 200, b: 160 }
            : GameState.currentScene === 'cloudSea'
            ? { r: 220, g: 190, b: 160 }
            : { r: 30, g: 50, b: 70 };

        // 底部雾气（地面附近更浓）
        const bottomGrad = ctx.createLinearGradient(0, canvas.height - 100, 0, canvas.height);
        bottomGrad.addColorStop(0, 'transparent');
        bottomGrad.addColorStop(1, `rgba(${fogColor.r}, ${fogColor.g}, ${fogColor.b}, 0.25)`);
        ctx.fillStyle = bottomGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 远景雾化（顶部天空区域）
        const topGrad = ctx.createLinearGradient(0, 0, 0, 120);
        topGrad.addColorStop(0, `rgba(${fogColor.r}, ${fogColor.g}, ${fogColor.b}, 0.15)`);
        topGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = topGrad;
        ctx.fillRect(0, 0, canvas.width, 120);

    }

    // ==================== 天气系统 ====================
    function updateWeather(dt) {
        const scene = GameState.currentScene;
        const we = GameState.weatherEffects;

        if (scene === 'flowerField') {
            // 迷雾森林 - 细雨
            // 初始化雨滴
            if (we.rainDrops.length === 0) {
                for (let i = 0; i < 65; i++) {
                    we.rainDrops.push({
                        x: Math.random() * GameState.worldWidth,
                        y: Math.random() * GameState.worldHeight,
                        speed: 120 + Math.random() * 80,
                        len: 6 + Math.random() * 6
                    });
                }
            }
            we.rainDrops.forEach(r => {
                r.y += r.speed * dt;
                r.x += r.speed * 0.3 * dt; // 斜向右下
                if (r.y > GameState.worldHeight) {
                    // 地面产生涟漪
                    if (Math.random() < 0.3) {
                        we.ripples.push({ x: r.x, y: GameState.worldHeight - 5 - Math.random() * 20, r: 1, alpha: 0.4, maxR: 8 + Math.random() * 6 });
                    }
                    r.y = -20;
                    r.x = Math.random() * GameState.worldWidth;
                }
            });
            // 更新涟漪
            for (let i = we.ripples.length - 1; i >= 0; i--) {
                we.ripples[i].r += 8 * dt;
                we.ripples[i].alpha -= 0.4 * dt;
                if (we.ripples[i].alpha <= 0) we.ripples.splice(i, 1);
            }
        } else if (scene === 'pillarSea') {
            // 深海柱林 - 气泡增强已在原代码中，添加浮尘和鱼群
            if (we.seaDust.length === 0) {
                for (let i = 0; i < 80; i++) {
                    we.seaDust.push({
                        x: Math.random() * GameState.worldWidth,
                        y: Math.random() * GameState.worldHeight,
                        vy: 3 + Math.random() * 8,
                        vx: (Math.random() - 0.5) * 5,
                        size: 1 + Math.random() * 1.5
                    });
                }
            }
            we.seaDust.forEach(d => {
                d.y += d.vy * dt;
                d.x += d.vx * dt;
                if (d.y > GameState.worldHeight) { d.y = 0; d.x = Math.random() * GameState.worldWidth; }
                if (d.x < 0) d.x = GameState.worldWidth;
                if (d.x > GameState.worldWidth) d.x = 0;
            });
            // 鱼群
            if (we.fishSchools.length === 0) {
                for (let i = 0; i < 3; i++) {
                    we.fishSchools.push({
                        x: -50 - Math.random() * 200,
                        y: 450 + Math.random() * 300,
                        speed: 80 + Math.random() * 60,
                        fish: []
                    });
                    const count = 3 + Math.floor(Math.random() * 3);
                    for (let f = 0; f < count; f++) {
                        we.fishSchools[i].fish.push({
                            offX: (Math.random() - 0.5) * 20,
                            offY: (Math.random() - 0.5) * 10
                        });
                    }
                }
            }
            we.fishSchools.forEach(fs => {
                fs.x += fs.speed * dt;
                if (fs.x > GameState.worldWidth + 100) {
                    fs.x = -100 - Math.random() * 200;
                    fs.y = 450 + Math.random() * 300;
                }
            });
        } else if (scene === 'cloudSea') {
            // 云端花田 - 云絮和阳光光束
            if (we.cloudFluffs.length === 0) {
                for (let i = 0; i < 12; i++) {
                    we.cloudFluffs.push({
                        x: Math.random() * GameState.worldWidth,
                        y: 50 + Math.random() * 200,
                        speed: 8 + Math.random() * 12,
                        width: 30 + Math.random() * 40,
                        height: 10 + Math.random() * 15,
                        alpha: 0.15 + Math.random() * 0.2
                    });
                }
            }
            we.cloudFluffs.forEach(c => {
                c.x += c.speed * dt;
                if (c.x > GameState.worldWidth + c.width) c.x = -c.width;
            });
            if (we.sunBeams.length === 0) {
                for (let i = 0; i < 5; i++) {
                    we.sunBeams.push({
                        x: 100 + i * 300 + Math.random() * 100,
                        width: 30 + Math.random() * 30,
                        angle: 0.1 + Math.random() * 0.1
                    });
                }
            }
        }
    }

    function drawWeather(camX, camY) {
        const scene = GameState.currentScene;
        const we = GameState.weatherEffects;

        if (scene === 'flowerField') {
            // 细雨 - 斜线
            ctx.strokeStyle = 'rgba(180,200,220,0.3)';
            ctx.lineWidth = 1;
            we.rainDrops.forEach(r => {
                const sx = r.x - camX;
                const sy = r.y - camY;
                if (sx > -20 && sx < canvas.width + 20 && sy > -20 && sy < canvas.height + 20) {
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx + r.len * 0.4, sy + r.len);
                    ctx.stroke();
                }
            });
            // 涟漪
            we.ripples.forEach(rp => {
                const sx = rp.x - camX;
                const sy = rp.y - camY;
                if (sx > -20 && sx < canvas.width + 20 && sy > -20 && sy < canvas.height + 20) {
                    ctx.strokeStyle = `rgba(180,200,220,${rp.alpha * 0.5})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.ellipse(sx, sy, rp.r, rp.r * 0.3, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }
            });
        } else if (scene === 'pillarSea') {
            // 海底浮尘
            ctx.fillStyle = 'rgba(200,220,255,0.1)';
            we.seaDust.forEach(d => {
                const sx = d.x - camX;
                const sy = d.y - camY;
                if (sx > -5 && sx < canvas.width + 5 && sy > -5 && sy < canvas.height + 5) {
                    ctx.fillRect(sx, sy, d.size, d.size);
                }
            });
            // 鱼群
            we.fishSchools.forEach(fs => {
                const sx = fs.x - camX;
                const sy = fs.y - camY;
                if (sx > -100 && sx < canvas.width + 100 && sy > -50 && sy < canvas.height + 50) {
                    fs.fish.forEach(f => {
                        const fx = sx + f.offX;
                        const fy = sy + f.offY;
                        ctx.fillStyle = 'rgba(150,200,220,0.6)';
                        ctx.fillRect(fx, fy, 3, 2);
                    });
                }
            });
        } else if (scene === 'cloudSea') {
            // 飘动的云絮
            we.cloudFluffs.forEach(c => {
                const sx = c.x - camX;
                const sy = c.y - camY;
                if (sx > -100 && sx < canvas.width + 100 && sy > -50 && sy < canvas.height + 50) {
                    ctx.fillStyle = `rgba(255,255,255,${c.alpha})`;
                    ctx.fillRect(sx, sy, c.width, c.height);
                    ctx.fillRect(sx + c.width * 0.2, sy - c.height * 0.3, c.width * 0.6, c.height * 0.5);
                }
            });
            // 阳光光束
            ctx.fillStyle = 'rgba(255,255,200,0.05)';
            we.sunBeams.forEach(b => {
                const sx = b.x - camX;
                if (sx > -100 && sx < canvas.width + 100) {
                    ctx.beginPath();
                    ctx.moveTo(sx, 0);
                    ctx.lineTo(sx + b.width + 60, canvas.height);
                    ctx.lineTo(sx + b.width + 90, canvas.height);
                    ctx.lineTo(sx + b.width * 0.3, 0);
                    ctx.closePath();
                    ctx.fill();
                }
            });
        }
    }

    // ==================== 游戏逻辑 ====================
    function update(dt) {
        // 开场动画
        if (GameState.intro && GameState.intro.active) {
            GameState.intro.timer++;
            if (GameState.intro.phase === 0) {
                // 标题淡入（2秒）
                GameState.intro.alpha = Math.min(1, GameState.intro.timer / 60);
                if (GameState.intro.timer > 120) { GameState.intro.phase = 1; GameState.intro.timer = 0; }
            } else if (GameState.intro.phase === 1) {
                // 显示副标题（2秒）
                if (GameState.intro.timer > 120) { GameState.intro.phase = 2; GameState.intro.timer = 0; }
            } else if (GameState.intro.phase === 2) {
                // 淡出（1秒）
                GameState.intro.alpha = Math.max(0, 1 - GameState.intro.timer / 60);
                if (GameState.intro.timer > 60) { GameState.intro.phase = 3; GameState.intro.active = false; }
            }
            return; // 开场动画期间不更新游戏
        }

        GameState.time += dt;
        DayNight.update(dt);
        AudioEngine.updateDayNightAmbient(DayNight.getPhase());
        AudioEngine.update(dt);
        updateWeather(dt);

        // 昼夜循环更新
        GameState.dayNight.cycle = (GameState.dayNight.cycle + GameState.dayNight.speed * dt * 60) % 1;
        const c = GameState.dayNight.cycle;
        if (c < 0.25) GameState.dayNight.currentPhase = 'day';
        else if (c < 0.4) GameState.dayNight.currentPhase = 'dusk';
        else if (c < 0.7) GameState.dayNight.currentPhase = 'night';
        else if (c < 0.85) GameState.dayNight.currentPhase = 'dawn';
        else GameState.dayNight.currentPhase = 'day';

        // 时间控制
        if (GameState.keys['e']) DayNight.timeSpeed = 5;
        else if (GameState.keys['q']) DayNight.timeSpeed = 0.2;
        else DayNight.timeSpeed = 1;

        // 互动键
        if (GameState.keys['f']) {
            Interaction.tryInteract();
            GameState.keys['f'] = false; // 单次触发
        }

        // 成就检查（每60帧检查一次）
        GameState.frameCount++;
        if (GameState.frameCount % 60 === 0) {
            GameState.achievements.list.forEach(a => {
                if (!a.unlocked && a.condition()) {
                    a.unlocked = true;
                    GameState.achievements.totalUnlocked++;
                    GameState.achievements.notification = { name: a.name, desc: a.desc, timer: 180 };
                }
            });
        }

        // 输入
        let dx = 0, dy = 0;
        if (GameState.keys['w'] || GameState.keys['arrowup']) { dy = -1; Player.direction = 'up'; }
        if (GameState.keys['s'] || GameState.keys['arrowdown']) { dy = 1; Player.direction = 'down'; }
        if (GameState.keys['a'] || GameState.keys['arrowleft']) { dx = -1; Player.direction = 'left'; }
        if (GameState.keys['d'] || GameState.keys['arrowright']) { dx = 1; Player.direction = 'right'; }

        Player.isMoving = dx !== 0 || dy !== 0;
        if (Player.isMoving && !GameState.transitioning) {
            const len = Math.sqrt(dx * dx + dy * dy);
            Player.x += (dx / len) * Player.speed * dt;
            Player.y += (dy / len) * Player.speed * dt;
            Player.animTimer += dt * (1000 / 150);
            Player.animFrame = Player.animTimer;
            Player.idleTime = 0;

            Player.footprintTimer += dt;
            if (Player.footprintTimer > 0.3) {
                addFootprint();
                spawnFootstepDust();
                AudioEngine.playFootstep(GameState.currentScene);
                Player.footprintTimer = 0;
            }
        } else {
            Player.animFrame = 0;
            Player.animTimer = 0;
            Player.idleTime += dt;
        }

        // 眨眼动画
        if (!Player.isBlinking) {
            Player.blinkTimer += dt;
            if (Player.blinkTimer > 3 + Math.random() * 2) {
                Player.isBlinking = true;
                Player.blinkTimer = 0;
            }
        } else {
            Player.blinkTimer += dt;
            if (Player.blinkTimer > 0.15) {
                Player.isBlinking = false;
                Player.blinkTimer = 0;
            }
        }

        Player.x = Math.max(20, Math.min(GameState.worldWidth - 20, Player.x));
        Player.y = Math.max(20, Math.min(GameState.worldHeight - 20, Player.y));

        // 树碰撞检测
        const s = Scenes[GameState.currentScene];
        if (s.trees) {
            s.trees.forEach(t => {
                const dx = Player.x - t.x;
                const dy = Player.y - t.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 20) {
                    Player.x += dx / dist * 2;
                    Player.y += dy / dist * 2;
                }
            });
        }

        // 云朵碰撞检测（云海场景）
        if (GameState.currentScene === 'cloudSea') {
            const cs = Scenes.cloudSea;
            if (!cs.cloudPlatforms) {
                cs.cloudPlatforms = [];
                for (let i = 0; i < 10; i++) {
                    cs.cloudPlatforms.push({
                        x: 200 + Math.random() * (GameState.worldWidth - 400),
                        y: 150 + Math.random() * (GameState.worldHeight - 300),
                        width: 60 + Math.random() * 40,
                        height: 15 + Math.random() * 10
                    });
                }
            }
            cs.cloudPlatforms.forEach(cp => {
                const cpx = Player.x - cp.x;
                const cpy = Player.y - cp.y;
                const halfW = cp.width / 2;
                const halfH = cp.height / 2;
                if (Math.abs(cpx) < halfW + 8 && Math.abs(cpy) < halfH + 8) {
                    const overlapX = (halfW + 8) - Math.abs(cpx);
                    const overlapY = (halfH + 8) - Math.abs(cpy);
                    if (overlapX < overlapY) {
                        Player.x += cpx > 0 ? overlapX : -overlapX;
                    } else {
                        Player.y += cpy > 0 ? overlapY : -overlapY;
                    }
                }
            });
        }

        // 场景切换
        if (!GameState.transitioning) {
            // 蝴蝶移动
            GameState.butterflies.forEach(b => {
                b.timer--;
                if (b.timer <= 0) {
                    b.vx = (Math.random() - 0.5) * 0.8;
                    b.vy = (Math.random() - 0.5) * 0.6;
                    b.timer = 100 + Math.random() * 200;
                }
                b.x += b.vx;
                b.y += b.vy + Math.sin(GameState.time * 0.03 + b.wingPhase) * 0.3;
                b.wingPhase += 0.15;
                if (b.x < 0) b.x = GameState.worldWidth;
                if (b.x > GameState.worldWidth) b.x = 0;
                if (b.y < 0) b.y = GameState.worldHeight;
                if (b.y > GameState.worldHeight) b.y = 0;
            });

            // 光球收集检测
            GameState.orbs.forEach(orb => {
                if (!orb.collected) {
                    const dx = Player.x - orb.x;
                    const dy = Player.y - orb.y;
                    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) {
                        orb.collected = true;
                        if (typeof playSound === 'function') playSound('collect');
                        GameState.orbsCollected++;
                        // 服装解锁检查
                        if (GameState.orbsCollected >= 10 && !Player.costumes.unlocked.includes('ocean')) {
                            Player.costumes.unlocked.push('ocean');
                        }
                        if (GameState.orbsCollected >= 25 && !Player.costumes.unlocked.includes('forest')) {
                            Player.costumes.unlocked.push('forest');
                        }
                        // 任务进度
                        GameState.quests.current.current++;
                        checkQuestProgress();
                        // 经验值
                        addExp(10);
                        // 收集动画
                        GameState.expandingOrbs.push({
                            x: orb.x, y: orb.y,
                            radius: 4, maxRadius: 20,
                            alpha: 1, color: orb.color
                        });
                        // 收集粒子效果
                        for (let i = 0; i < 8; i++) {
                            particlePool.get(orb.x, orb.y, 'sparkle');
                        }
                        // 收集爆发粒子
                        for (let i = 0; i < 8; i++) {
                            const angle = (Math.PI * 2 / 8) * i;
                            GameState.collectParticles.push({
                                x: orb.x, y: orb.y,
                                vx: Math.cos(angle) * 2,
                                vy: Math.sin(angle) * 2,
                                life: 30,
                                color: orb.color || '#ffdd44'
                            });
                        }
                    }
                }
            });

            // 宝箱检测（E键打开）
            const currentSceneData = Scenes[GameState.currentScene];
            if (GameState.keys['e']) {
                let eHandled = false;
                currentSceneData.chests.forEach(chest => {
                    if (!chest.opened && !eHandled) {
                        const cdx = Player.x - chest.x;
                        const cdy = Player.y - chest.y;
                        const cdist = Math.sqrt(cdx * cdx + cdy * cdy);
                        if (cdist < 25) {
                            chest.opened = true;
                            chest.openAnim = 1;
                            GameState.totalChestsOpened++;
                            const orbsGained = 3 + Math.floor(Math.random() * 3); // 3-5
                            GameState.orbsCollected += orbsGained;
                            GameState.quests.current.current += orbsGained;
                            checkQuestProgress();
                            addExp(50);
                            // 宝箱粒子效果
                            for (let i = 0; i < 12; i++) {
                                particlePool.get(chest.x + 10, chest.y + 10, 'sparkle');
                            }
                            eHandled = true;
                        }
                    }
                });
                // 传送门检测（E键激活）
                if (!eHandled && currentSceneData.portal) {
                    const pdx = Player.x - currentSceneData.portal.x;
                    const pdy = Player.y - currentSceneData.portal.y;
                    const pdist = Math.sqrt(pdx * pdx + pdy * pdy);
                    if (pdist < 30) {
                        // 随机传送到安全位置
                        let safeX, safeY, attempts = 0;
                        do {
                            safeX = 100 + Math.random() * (GameState.worldWidth - 200);
                            safeY = 100 + Math.random() * (GameState.worldHeight - 200);
                            attempts++;
                        } while (attempts < 20);
                        spawnPortalParticles(Player.x, Player.y);
                        Player.x = safeX;
                        Player.y = safeY;
                        Cat.x = safeX + 20;
                        Cat.y = safeY + 20;
                        spawnPortalParticles(Player.x, Player.y);
                        eHandled = true;
                    }
                }
                // NPC对话（E键）
                if (!eHandled) {
                    eHandled = NPCSystem.tryTalk();
                }
                // 推石头（E键）
                if (!eHandled) {
                    eHandled = Interactables.tryPushStone();
                }
                // 钓鱼（E键）
                if (!eHandled) {
                    eHandled = Interactables.tryFish();
                }
                GameState.keys['e'] = false; // 单次触发
            }

            if (Player.x > GameState.worldWidth - 30) {
                if (GameState.currentScene === 'flowerField') startTransition('pillarSea');
                else if (GameState.currentScene === 'pillarSea') startTransition('cloudSea');
                else if (GameState.currentScene === 'cloudSea') startTransition('lavaCave');
                else if (GameState.currentScene === 'lavaCave') startTransition('flowerField');
            } else if (Player.x < 30) {
                if (GameState.currentScene === 'flowerField') startTransition('lavaCave');
                else if (GameState.currentScene === 'pillarSea') startTransition('flowerField');
                else if (GameState.currentScene === 'cloudSea') startTransition('pillarSea');
                else if (GameState.currentScene === 'lavaCave') startTransition('cloudSea');
            }
        }

        // 相机
        const targetCamX = Player.x - canvas.width / 2;
        const targetCamY = Player.y - canvas.height / 2;
        GameState.camera.x += (targetCamX - GameState.camera.x) * 0.08;
        GameState.camera.y += (targetCamY - GameState.camera.y) * 0.08;
        GameState.camera.x = Math.max(0, Math.min(GameState.worldWidth - canvas.width, GameState.camera.x));
        GameState.camera.y = Math.max(0, Math.min(GameState.worldHeight - canvas.height, GameState.camera.y));

        // 小猫
        Cat.update(dt);

        // NPC系统
        NPCSystem.update(dt);

        // 互动元素
        Interactables.update(dt);

        // 互动系统
        Interaction.update(dt);

        // 自动小猫互动
        if (Interaction.cooldown <= 0 && !Interaction.active) {
            const dx = Player.x - Cat.x;
            const dy = Player.y - Cat.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 60) {
                Interaction.tryInteract();
            }
        }

        // 蝴蝶
        updateButterflies(dt);

        // 粒子
        spawnParticles(GameState.currentScene);
        particlePool.update(dt);

        // 气泡更新
        GameState.bubbles.forEach(b => {
            b.y -= b.speed * dt;
            b.x += Math.sin(GameState.time * 0.02 + b.x * 0.01) * 0.3;
            if (b.y < 400) {
                b.y = 600;
                b.x = Math.random() * 800;
            }
        });

        // 脚印
        updateFootprints(dt);

        // UI
        document.getElementById('sceneName').textContent = Scenes[GameState.currentScene].name;
        document.getElementById('coords').textContent = `X: ${Math.floor(Player.x)} Y: ${Math.floor(Player.y)}`;

        // 任务完成提示计时器
        if (GameState.questCompletedTimer > 0) GameState.questCompletedTimer -= dt;
        if (GameState.levelUpTimer > 0) GameState.levelUpTimer -= dt;
        if (saveLoadHintTimer > 0) saveLoadHintTimer -= dt;
        if (Player.costumeSwitchTimer > 0) Player.costumeSwitchTimer--;

        // 场景切换提示计时器与淡入淡出
        if (GameState.sceneHint.timer > 0) {
            GameState.sceneHint.timer -= dt;
            const halfDuration = 0.75; // 淡入/淡出各0.75秒
            const elapsed = 1.5 - GameState.sceneHint.timer;
            if (elapsed < halfDuration) {
                GameState.sceneHint.opacity = elapsed / halfDuration; // 淡入 0→1
            } else {
                GameState.sceneHint.opacity = Math.max(0, (1.5 - elapsed) / halfDuration); // 淡出 1→0
            }
        } else {
            GameState.sceneHint.opacity = 0;
        }

        // 宝箱打开动画
        const scene = Scenes[GameState.currentScene];
        if (scene && scene.chests) {
            scene.chests.forEach(chest => {
                if (chest.opened && chest.openAnim < 1) {
                    chest.openAnim = Math.min(1, chest.openAnim + dt * 3);
                }
            });
        }

        // 传送门粒子更新
        for (let i = GameState.portalParticles.length - 1; i >= 0; i--) {
            const p = GameState.portalParticles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt * 1.5;
            if (p.life <= 0) GameState.portalParticles.splice(i, 1);
        }
    }

    function startTransition(targetScene) {
        GameState.transitioning = true;
        if (typeof playSound === 'function') playSound('transition');
        ensureAudioInit();
        AudioEngine.playTransition();
        const overlay = document.getElementById('transitionOverlay');
        overlay.classList.add('active');
        // 设置场景切换提示
        const sceneNames = {
            flowerField: '🌲 迷雾森林',
            pillarSea: '🌊 深海柱林',
            cloudSea: '☁️ 云端花田',
            lavaCave: '🌋 熔岩洞穴'
        };
        GameState.sceneHint.text = sceneNames[targetScene] || '';
        GameState.sceneHint.timer = 1.5; // 显示1.5秒
        GameState.sceneHint.opacity = 0;
        setTimeout(() => {
            GameState.currentScene = targetScene;
            if (!GameState.visitedScenes) GameState.visitedScenes = new Set();
            GameState.visitedScenes.add(targetScene);
            GameState.footprints = [];
            AudioEngine.startAmbient(targetScene);
            if (targetScene === 'pillarSea') {
                Player.x = 50;
                Cat.x = 35;
            } else if (targetScene === 'cloudSea') {
                Player.x = 50;
                Cat.x = 35;
            } else if (targetScene === 'lavaCave') {
                Player.x = 50;
                Cat.x = 35;
            } else {
                Player.x = GameState.worldWidth - 50;
                Cat.x = GameState.worldWidth - 65;
            }
            Cat.y = Player.y;
            Cat.state = 'follow';
            setTimeout(() => {
                overlay.classList.remove('active');
                GameState.transitioning = false;
            }, 800);
        }, 800);
    }

    function draw() {
        // 开场动画
        if (GameState.intro && GameState.intro.active) {
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.globalAlpha = GameState.intro.alpha;

            // 标题
            ctx.fillStyle = '#e8d5a3';
            ctx.font = 'bold 28px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('MONITO ADVENTURES', canvas.width / 2, canvas.height / 2 - 30);

            // 副标题（phase 1 后显示）
            if (GameState.intro.phase >= 1) {
                const subAlpha = GameState.intro.phase === 1 ?
                    Math.min(1, GameState.intro.timer / 60) : GameState.intro.alpha;
                ctx.globalAlpha = subAlpha;
                ctx.fillStyle = '#a08060';
                ctx.font = '14px monospace';
                ctx.fillText('和小橘猫一起探索奇妙世界', canvas.width / 2, canvas.height / 2 + 10);
            }

            // 提示（phase 1 后显示）
            if (GameState.intro.phase >= 1) {
                ctx.globalAlpha = GameState.intro.alpha * (0.5 + Math.sin(GameState.time * 0.05) * 0.3);
                ctx.fillStyle = '#666';
                ctx.font = '12px monospace';
                ctx.fillText('按任意键开始', canvas.width / 2, canvas.height / 2 + 50);
            }

            ctx.globalAlpha = 1;
            ctx.textAlign = 'left';
            return;
        }

        const camX = GameState.camera.x;
        const camY = GameState.camera.y;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (GameState.currentScene === 'flowerField') drawFlowerField(camX, camY);
        else if (GameState.currentScene === 'cloudSea') drawCloudSea(camX, camY);
        else if (GameState.currentScene === 'lavaCave') drawLavaCave(camX, camY);
        else drawPillarSea(camX, camY);

        // 互动元素（石头、钓鱼浮标）
        Interactables.draw(camX, camY);

        // NPC
        NPCSystem.draw(camX, camY);

        // 蝴蝶
        drawButterflies(camX, camY);

        // 脚印
        drawFootprints(camX, camY);

        // 粒子
        particlePool.draw(ctx, camX, camY);

        // 天气效果
        drawWeather(camX, camY);

        // 小猫
        Cat.draw(Cat.x - camX, Cat.y - camY);

        // 互动粒子
        Interaction.drawParticles(camX, camY);
        // 互动提示
        Interaction.drawActionIndicator(camX, camY);

        // 光球绘制
        GameState.orbs.forEach(orb => {
            if (!orb.collected) {
                const floatY = Math.sin(GameState.time * 0.03 + orb.x * 0.01) * 3;
                const pulse = 1 + Math.sin(GameState.time * 0.05 + orb.x * 0.02) * 0.2;
                const ox = orb.x - camX;
                const oy = orb.y + floatY - camY;
                if (ox > -20 && ox < canvas.width + 20 && oy > -20 && oy < canvas.height + 20) {
                    const bob = Math.sin(GameState.time * 0.04 + orb.bobPhase) * 3;
                    // 光晕
                    ctx.fillStyle = orb.color.replace(')', ',0.15)').replace('rgb', 'rgba').replace('#', '');
                    const glow = ctx.createRadialGradient(ox, oy + bob, 0, ox, oy + bob, 16 * pulse);
                    glow.addColorStop(0, orb.color + '44');
                    glow.addColorStop(1, 'transparent');
                    ctx.fillStyle = glow;
                    ctx.fillRect(ox - 16 * pulse, oy + bob - 16 * pulse, 32 * pulse, 32 * pulse);
                    // 光球本体
                    ctx.fillStyle = orb.color;
                    ctx.beginPath();
                    ctx.arc(ox, oy + bob, 4 * pulse, 0, Math.PI * 2);
                    ctx.fill();
                    // 高光
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(ox - 1, oy + bob - 1, 1.5 * pulse, 0, Math.PI * 2);
                    ctx.fill();
                    // 拖尾效果
                    for (let ti = 1; ti <= 3; ti++) {
                        const trailAlpha = 0.3 - ti * 0.08;
                        const trailR = (4 - ti * 1) * pulse;
                        ctx.fillStyle = orb.color;
                        ctx.globalAlpha = Math.max(0.05, trailAlpha);
                        ctx.beginPath();
                        ctx.arc(ox - ti * 3, oy + bob + ti * 2, Math.max(1, trailR), 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                }
            }
        });

        // 收集扩散动画
        for (let i = GameState.expandingOrbs.length - 1; i >= 0; i--) {
            const eo = GameState.expandingOrbs[i];
            eo.radius += 0.8;
            eo.alpha -= 0.04;
            if (eo.alpha <= 0 || eo.radius >= eo.maxRadius) {
                GameState.expandingOrbs.splice(i, 1);
                continue;
            }
            const eox = eo.x - camX;
            const eoy = eo.y - camY;
            if (eox > -30 && eox < canvas.width + 30 && eoy > -30 && eoy < canvas.height + 30) {
                ctx.strokeStyle = eo.color;
                ctx.globalAlpha = eo.alpha;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(eox, eoy, eo.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.globalAlpha = 1;
            }
        }

        // 收集爆发粒子
        for (let i = GameState.collectParticles.length - 1; i >= 0; i--) {
            const p = GameState.collectParticles[i];
            p.x += p.vx; p.y += p.vy;
            p.life--;
            if (p.life <= 0) { GameState.collectParticles.splice(i, 1); continue; }
            const ppx = p.x - camX;
            const ppy = p.y - camY;
            if (ppx > -10 && ppx < canvas.width + 10 && ppy > -10 && ppy < canvas.height + 10) {
                ctx.globalAlpha = p.life / 30;
                ctx.fillStyle = p.color;
                ctx.fillRect(Math.floor(ppx) - 2, Math.floor(ppy) - 2, 4, 4);
                ctx.globalAlpha = 1;
            }
        }

        // 角色
        // 蝴蝶绘制
        GameState.butterflies.forEach(b => {
            const bx = b.x - camX;
            const by = b.y - camY;
            if (bx > -10 && bx < canvas.width + 10 && by > -10 && by < canvas.height + 10) {
                const wingOpen = Math.abs(Math.sin(b.wingPhase));
                const w = Math.max(1, wingOpen * 3);
                ctx.fillStyle = b.color;
                ctx.fillRect(Math.floor(bx - w), Math.floor(by - 1), Math.floor(w), 2);
                ctx.fillRect(Math.floor(bx + 1), Math.floor(by - 1), Math.floor(w), 2);
                ctx.fillStyle = '#333';
                ctx.fillRect(Math.floor(bx), Math.floor(by - 1), 1, 3);
            }
        });

        drawCharacter(Player.x - camX, Player.y - camY);

        // 角色名字
        NameSystem.drawName(Player.x - camX, Player.y - camY);

        // 柔和阳光覆盖（固定温暖氛围）
        const sunGrad = ctx.createRadialGradient(
            canvas.width * 0.7, 50, 0,
            canvas.width * 0.7, 50, canvas.height * 0.8
        );
        sunGrad.addColorStop(0, 'rgba(255, 240, 180, 0.08)');
        sunGrad.addColorStop(0.5, 'rgba(255, 230, 160, 0.04)');
        sunGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = sunGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 天气覆盖
        if (GameState.weather.type === 'rain') {
            ctx.fillStyle = 'rgba(100, 120, 140, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // 场景切换提示
        if (!GameState.transitioning) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.font = '10px monospace';
            if (Player.x > GameState.worldWidth - 100 && GameState.currentScene === 'flowerField') {
                ctx.fillText('→ 前往柱之海', canvas.width - 120, canvas.height / 2);
            } else if (Player.x < 100 && GameState.currentScene === 'pillarSea') {
                ctx.fillText('← 返回花田', 20, canvas.height / 2);
            } else if (Player.x > GameState.worldWidth - 100 && GameState.currentScene === 'pillarSea') {
                ctx.fillText('→ 前往云端花田', canvas.width - 120, canvas.height / 2);
            } else if (Player.x < 100 && GameState.currentScene === 'cloudSea') {
                ctx.fillText('← 返回柱之海', 20, canvas.height / 2);
            } else if (Player.x > GameState.worldWidth - 100 && GameState.currentScene === 'cloudSea') {
                ctx.fillText('→ 前往熔岩洞穴', canvas.width - 120, canvas.height / 2);
            } else if (Player.x < 100 && GameState.currentScene === 'lavaCave') {
                ctx.fillText('← 返回云端花田', 20, canvas.height / 2);
            } else if (Player.x > GameState.worldWidth - 100 && GameState.currentScene === 'lavaCave') {
                ctx.fillText('→ 返回迷雾森林', canvas.width - 120, canvas.height / 2);
            } else if (Player.x < 100 && GameState.currentScene === 'flowerField') {
                ctx.fillText('← 前往熔岩洞穴', 20, canvas.height / 2);
            }
        }

        // 绘制宝箱
        const currentSceneObj = Scenes[GameState.currentScene];
        if (currentSceneObj && currentSceneObj.chests) {
            currentSceneObj.chests.forEach(chest => drawChest(chest, camX, camY));
        }

        // 绘制传送门
        if (currentSceneObj && currentSceneObj.portal) {
            drawPortal(currentSceneObj.portal, camX, camY);
        }

        // 传送门粒子
        GameState.portalParticles.forEach(p => {
            const sx = p.x - camX;
            const sy = p.y - camY;
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.fillRect(sx, sy, 3, 3);
        });
        ctx.globalAlpha = 1;

        // 任务完成提示
        if (GameState.questCompletedTimer > 0) {
            ctx.fillStyle = `rgba(255, 215, 0, ${Math.min(1, GameState.questCompletedTimer)})`;
            ctx.font = 'bold 24px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('任务完成！', canvas.width / 2, canvas.height / 2);
            ctx.textAlign = 'left';
        }

        // 升级提示
        if (GameState.levelUpTimer > 0) {
            const px = Player.x - camX;
            const py = Player.y - camY;
            ctx.fillStyle = `rgba(100, 255, 100, ${Math.min(1, GameState.levelUpTimer)})`;
            ctx.font = 'bold 14px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('LEVEL UP!', px, py - 35);
            ctx.textAlign = 'left';
        }

        // 全屏闪光效果
        if (GameState.screenFlash && GameState.screenFlash.timer > 0) {
            ctx.globalAlpha = GameState.screenFlash.timer / 20 * 0.3;
            ctx.fillStyle = GameState.screenFlash.color;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1;
            GameState.screenFlash.timer--;
        }

        // 换装提示（角色头顶显示服装名1.5秒）
        if (Player.costumeSwitchTimer > 0) {
            const cpx = Player.x - camX;
            const cpy = Player.y - camY;
            const costumeName = Player.costumes.list[Player.costumes.current].name;
            const cAlpha = Player.costumeSwitchTimer > 60 ? (90 - Player.costumeSwitchTimer) / 30 : Player.costumeSwitchTimer < 30 ? Player.costumeSwitchTimer / 30 : 1;
            ctx.globalAlpha = cAlpha;
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 12px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText(costumeName, cpx, cpy - 45);
            ctx.textAlign = 'left';
            ctx.globalAlpha = 1;
        }

        // 存档/读档提示
        if (saveLoadHintTimer > 0) {
            ctx.fillStyle = `rgba(143, 184, 201, ${Math.min(1, saveLoadHintTimer)})`;
            ctx.font = '12px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText(saveLoadHintText, canvas.width / 2, canvas.height / 2 + 30);
            ctx.textAlign = 'left';
        }

        // 场景切换提示（大字体，淡入淡出，画面中央偏上）
        if (GameState.sceneHint.opacity > 0 && GameState.sceneHint.text) {
            ctx.save();
            ctx.globalAlpha = Math.min(1, GameState.sceneHint.opacity);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 6;
            ctx.fillText(GameState.sceneHint.text, canvas.width / 2, canvas.height * 0.3);
            ctx.shadowBlur = 0;
            ctx.textAlign = 'left';
            ctx.restore();
        }

        // 昼夜叠加
        const dn = GameState.dayNight;
        // 星星（在叠加层之前）
        if (dn.currentPhase === 'night' || dn.currentPhase === 'dusk') {
            const starAlpha = dn.currentPhase === 'night' ? 0.6 : 0.3;
            for (let i = 0; i < 30; i++) {
                const sx = (i * 137.5 + 50) % canvas.width;
                const sy = (i * 97.3 + 20) % (canvas.height * 0.5);
                const twinkle = 0.5 + Math.sin(GameState.time * 0.05 + i * 2) * 0.5;
                ctx.fillStyle = `rgba(255,255,220,${starAlpha * twinkle})`;
                ctx.fillRect(Math.floor(sx), Math.floor(sy), 1, 1);
            }
        }
        let overlayAlpha = 0;
        let overlayColor = '#000';
        if (dn.currentPhase === 'dusk') {
            overlayAlpha = 0.15 + Math.sin((dn.cycle - 0.25) / 0.15 * Math.PI) * 0.15;
            overlayColor = '#1a0a2a'; // 紫色黄昏
        } else if (dn.currentPhase === 'night') {
            overlayAlpha = 0.3 + Math.sin((dn.cycle - 0.4) / 0.3 * Math.PI) * 0.1;
            overlayColor = '#0a0a1a'; // 深蓝夜色
        } else if (dn.currentPhase === 'dawn') {
            overlayAlpha = 0.15 + Math.sin((dn.cycle - 0.7) / 0.15 * Math.PI) * 0.15;
            overlayColor = '#2a1a0a'; // 橙色黎明
        }
        if (overlayAlpha > 0) {
            ctx.fillStyle = overlayColor;
            ctx.globalAlpha = overlayAlpha;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1;
        }

        // 时间指示器
        DayNight.drawTimeBar(timeCtx);

        // 小地图
        drawMinimap();

        // 成就通知（画面右上角）
        if (GameState.achievements.notification && GameState.achievements.notification.timer > 0) {
            const n = GameState.achievements.notification;
            const alpha = n.timer > 150 ? (180 - n.timer) / 30 : n.timer < 30 ? n.timer / 30 : 1;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(canvas.width - 200, 10, 190, 50);
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 12px monospace';
            ctx.fillText('\u{1F3C6} ' + n.name, canvas.width - 190, 30);
            ctx.fillStyle = '#e8d5a3';
            ctx.font = '10px monospace';
            ctx.fillText(n.desc, canvas.width - 190, 48);
            ctx.globalAlpha = 1;
            n.timer--;
        }
    }

    function gameLoop(timestamp) {
        if (lastTime === 0) lastTime = timestamp;
        deltaTime = Math.min((timestamp - lastTime) / 1000, 0.05);
        lastTime = timestamp;

        fpsCounter++;
        fpsTimer += deltaTime;
        if (fpsTimer >= 1) {
            currentFps = fpsCounter;
            fpsCounter = 0;
            fpsTimer = 0;
            document.getElementById('orbCounter').textContent = `✨ ${GameState.orbsCollected}/${GameState.orbsTotal}`;
        }

        update(deltaTime);
        draw();
        requestAnimationFrame(gameLoop);
    }

    // ==================== 输入 ====================
    window.addEventListener('keydown', (e) => {
        // 开场动画跳过
        if (GameState.intro && GameState.intro.active) {
            GameState.intro.active = false;
            return;
        }
        GameState.keys[e.key.toLowerCase()] = true;
        ensureAudioInit();
        if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright','q','e','f'].includes(e.key.toLowerCase())) {
            e.preventDefault();
        }
        if (e.key.toLowerCase() === 'm') AudioEngine.toggleMute();
        if (e.key.toLowerCase() === 'n') AudioEngine.setVolume(AudioEngine.volume - 0.1);
        if (e.key.toLowerCase() === 'b') AudioEngine.setVolume(AudioEngine.volume + 0.1);
        // 换装切换（C键）
        if (e.key.toLowerCase() === 'c') {
            const unlocked = Player.costumes.unlocked;
            const currentIdx = unlocked.indexOf(Player.costumes.current);
            const nextIdx = (currentIdx + 1) % unlocked.length;
            Player.costumes.current = unlocked[nextIdx];
            Player.costumeSwitchTimer = 90; // 1.5秒（60fps）
            e.preventDefault();
        }
        // 存档/读档
        if (e.key.toLowerCase() === 'l') {
            loadGame();
            e.preventDefault();
        }
    });
    window.addEventListener('keyup', (e) => {
        GameState.keys[e.key.toLowerCase()] = false;
        if (e.key.toLowerCase() === 's') {
            // 当S键松开时存档（避免与移动键冲突，仅当没有方向键按下时）
            if (!GameState.keys['w'] && !GameState.keys['a'] && !GameState.keys['d']) {
                saveGame();
            }
        }
    });
    // keyup 事件已在上面统一处理

    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        ensureAudioInit();
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const dx = e.touches[0].clientX - touchStartX;
        const dy = e.touches[0].clientY - touchStartY;
        GameState.keys['d'] = dx > 20;
        GameState.keys['a'] = dx < -20;
        GameState.keys['s'] = dy > 20;
        GameState.keys['w'] = dy < -20;
    }, { passive: false });
    canvas.addEventListener('touchend', () => {
        GameState.keys['w'] = GameState.keys['a'] = GameState.keys['s'] = GameState.keys['d'] = false;
    });

    // 鼠标点击检测名字
    canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;
        NameSystem.checkClick(clickX, clickY);
    });

    // 触摸点击检测名字（短触）
    let touchStartTime = 0;
    canvas.addEventListener('touchstart', (e) => {
        touchStartTime = Date.now();
    }, { passive: true });
    canvas.addEventListener('touchend', (e) => {
        const touchDuration = Date.now() - touchStartTime;
        if (touchDuration < 200) { // 短触视为点击
            const rect = canvas.getBoundingClientRect();
            const touch = e.changedTouches[0];
            const clickX = touch.clientX - rect.left;
            const clickY = touch.clientY - rect.top;
            NameSystem.checkClick(clickX, clickY);
        }
    }, { passive: true });

    // ==================== 启动 ====================
    initScenes();
    NPCSystem.init();
    Interactables.init();
    // 尝试自动读档
    if (loadGame()) {
        // 有存档，跳过开场动画
        if (GameState.intro) GameState.intro.active = false;
    }
    // 初始化气泡
    for (let i = 0; i < 15; i++) {
        GameState.bubbles.push({
            x: Math.random() * 800,
            y: 400 + Math.random() * 200,
            size: 1 + Math.random() * 3,
            speed: 10 + Math.random() * 20
        });
    }
    requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
