<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私人小厨 - 发现美食创意</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <i class="fas fa-utensils"></i>
                <span>私人小厨</span>
            </div>
            <nav class="nav">
                <a href="#home" class="nav-link active">首页</a>
                <a href="#recipes" class="nav-link">菜谱</a>
                <a href="#upload" class="nav-link">上传</a>
            </nav>
        </div>
    </header>

    <section id="home" class="hero">
        <div class="container">
            <h1>发现美食的无限可能</h1>
            <p>告别刻板菜谱，探索创意搭配，让每一道菜都成为艺术品</p>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索菜谱、食材或菜系...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
            <div class="tags">
                <span class="tag active">全部</span>
                <span class="tag">家常菜</span>
                <span class="tag">创意菜</span>
                <span class="tag">小众菜系</span>
                <span class="tag">传统菜</span>
            </div>
        </div>
    </section>

    <section id="recipes" class="recipes-section">
        <div class="container">
            <h2>精选菜谱</h2>
            <div id="recipesGrid" class="recipes-grid">
            </div>
        </div>
    </section>

    <section id="upload" class="upload-section">
        <div class="container">
            <h2>分享你的美味</h2>
            <form id="recipeForm" class="upload-form">
                <div class="form-group">
                    <label for="recipeName">菜谱名称</label>
                    <input type="text" id="recipeName" required>
                </div>
                <div class="form-group">
                    <label for="recipeCategory">菜系分类</label>
                    <select id="recipeCategory" required>
                        <option value="">请选择菜系</option>
                        <option value="家常菜">家常菜</option>
                        <option value="创意菜">创意菜</option>
                        <option value="小众菜系">小众菜系</option>
                        <option value="传统菜">传统菜</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="recipeIngredients">食材清单</label>
                    <textarea id="recipeIngredients" rows="3" required placeholder="请输入食材，用逗号分隔"></textarea>
                </div>
                <div class="form-group">
                    <label for="recipeSteps">做法步骤</label>
                    <textarea id="recipeSteps" rows="5" required placeholder="请详细描述做法步骤"></textarea>
                </div>
                <div class="form-group">
                    <label for="recipeImage">上传图片（可选）</label>
                    <input type="text" id="recipeImage" placeholder="输入图片URL">
                </div>
                <div class="form-group">
                    <label for="recipeDescription">创意介绍</label>
                    <textarea id="recipeDescription" rows="3" placeholder="分享你的创意想法..."></textarea>
                </div>
                <button type="submit" class="submit-btn">上传菜谱</button>
            </form>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 私人小厨 - 让美食更有创意</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
