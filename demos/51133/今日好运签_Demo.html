<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>今日好运签</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #fdf6f0 0%, #fff9f0 50%, #fef5e7 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 顶部装饰 */
        .top-decoration {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #d4846a, #e8b89a, #d4846a);
            z-index: 100;
        }

        /* 主容器 */
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* 标题区域 */
        .header {
            text-align: center;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #3d3d3d;
            letter-spacing: 0.1em;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 0.9rem;
            color: #8a8a8a;
            letter-spacing: 0.05em;
        }

        .date-display {
            font-size: 0.85rem;
            color: #d4846a;
            margin-top: 8px;
            font-weight: 600;
        }

        /* 签文卡片 */
        .card {
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow: 0 8px 32px rgba(212, 132, 106, 0.12);
            border: 1px solid rgba(232, 184, 154, 0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            min-height: 360px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card.hidden {
            opacity: 0;
            transform: translateY(20px) scale(0.95);
        }

        .card.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #d4846a, #e8b89a);
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #e8b89a, #d4846a);
        }

        /* 签文内容 */
        .fortune-tag {
            display: inline-block;
            padding: 4px 14px;
            background: linear-gradient(135deg, #fef0e8, #fff5ee);
            border: 1px solid #e8b89a;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #d4846a;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 0.05em;
        }

        .fortune-text {
            font-size: 1.35rem;
            line-height: 1.8;
            color: #3d3d3d;
            font-weight: 600;
            margin-bottom: 28px;
            padding: 0 8px;
        }

        .divider {
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #e8b89a, transparent);
            margin: 0 auto 24px;
        }

        .lucky-color {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .color-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .color-label {
            font-size: 0.85rem;
            color: #8a8a8a;
        }

        .color-name {
            font-size: 0.95rem;
            color: #3d3d3d;
            font-weight: 600;
        }

        .advice {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.7;
            padding: 0 4px;
        }

        .advice-label {
            font-size: 0.8rem;
            color: #d4846a;
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            color: #8a8a8a;
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-state p {
            font-size: 1rem;
            line-height: 1.7;
        }

        /* 按钮 */
        .shake-btn {
            width: 100%;
            max-width: 400px;
            padding: 16px 32px;
            background: linear-gradient(135deg, #d4846a, #e8b89a);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.1em;
            box-shadow: 0 4px 20px rgba(212, 132, 106, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .shake-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(212, 132, 106, 0.4);
        }

        .shake-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 12px rgba(212, 132, 106, 0.3);
        }

        .shake-btn.shaking {
            animation: btnShake 0.5s ease;
        }

        @keyframes btnShake {
            0%, 100% { transform: rotate(0deg); }
            20% { transform: rotate(-5deg); }
            40% { transform: rotate(5deg); }
            60% { transform: rotate(-3deg); }
            80% { transform: rotate(3deg); }
        }

        /* 底部提示 */
        .hint {
            font-size: 0.8rem;
            color: #aaa;
            text-align: center;
            margin-top: 8px;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.7rem;
            }
            .card {
                padding: 28px 22px;
                min-height: 320px;
            }
            .fortune-text {
                font-size: 1.2rem;
            }
        }

        /* 打印/截图优化 */
        @media print {
            body {
                background: #fdf6f0;
            }
            .shake-btn, .hint {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="top-decoration"></div>

    <div class="container">
        <div class="header">
            <h1>今日好运签</h1>
            <p>摇一摇，开启一天好运气</p>
            <div class="date-display" id="dateDisplay"></div>
        </div>

        <div class="card" id="fortuneCard">
            <div class="empty-state">
                <div class="icon">&#127775;</div>
                <p>点击下方按钮<br>或摇晃手机<br>抽取今日好运签</p>
            </div>
        </div>

        <button class="shake-btn" id="shakeBtn" onclick="drawFortune()">
            &#127808; 摇一摇
        </button>

        <p class="hint">点击按钮或摇晃手机即可抽签</p>
    </div>

    <script>
        // 显示日期
        function showDate() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('dateDisplay').textContent = now.toLocaleDateString('zh-CN', options);
        }
        showDate();

        // 签文数据
        const fortunes = [
            {
                text: "今天适合微笑面对每一个小挑战，好运正在路上。",
                color: "#d4846a",
                colorName: "暖珊瑚色",
                advice: "今天适合穿温暖色调的衣服，会给身边人带来好心情。"
            },
            {
                text: "慢下来，你会发现生活中藏着许多小确幸。",
                color: "#7db9a8",
                colorName: "薄荷绿",
                advice: "午休时出去走走，晒晒太阳，心情会豁然开朗。"
            },
            {
                text: "你今天的直觉特别准，相信第一感觉就对了。",
                color: "#9b8ec7",
                colorName: "薰衣草紫",
                advice: "做决策时别犹豫太多，你的直觉今天很靠谱。"
            },
            {
                text: "一个意想不到的惊喜正在靠近，保持期待吧。",
                color: "#e8b89a",
                colorName: "蜜桃粉",
                advice: "今天多留意身边的人和事，惊喜可能来自最平常的地方。"
            },
            {
                text: "今天的努力会在未来某天开花结果，继续加油。",
                color: "#6fa8dc",
                colorName: "天空蓝",
                advice: "把最难的任务放在上午完成，效率会出奇地高。"
            },
            {
                text: "适合和老朋友联系的一天，一条消息就能温暖彼此。",
                color: "#f5c842",
                colorName: "向日葵黄",
                advice: "给许久未联系的朋友发个表情包，今天特别适合 reconnect。"
            },
            {
                text: "今天的你特别有创造力，别吝啬你的想法。",
                color: "#e8927c",
                colorName: "晚霞橙",
                advice: "随身带个小本子，把灵感的火花及时记下来。"
            },
            {
                text: "对自己温柔一点，你已经做得很好了。",
                color: "#a8d5ba",
                colorName: "抹茶绿",
                advice: "今晚给自己做顿好吃的，或者点一份最爱的甜品。"
            },
            {
                text: "新的机会就在转角，保持开放的心态去迎接。",
                color: "#c9a0dc",
                colorName: "淡紫藤",
                advice: "今天遇到的新面孔或新提议，都值得认真了解一下。"
            },
            {
                text: "今天的幸运藏在细节里，用心感受就能发现。",
                color: "#f4a460",
                colorName: "焦糖棕",
                advice: "下班路上绕个弯，去那家一直想去的店看看。"
            },
            {
                text: "你的善意会回流到自己身上，今天多行善事。",
                color: "#ff8fab",
                colorName: "玫瑰粉",
                advice: "帮同事一个小忙，或者给陌生人一个微笑。"
            },
            {
                text: "适合整理和断舍离的一天，清理空间就是清理心情。",
                color: "#90c8e8",
                colorName: "雾霾蓝",
                advice: "花15分钟整理桌面或衣柜，你会感觉整个人都轻盈了。"
            }
        ];

        let lastIndex = -1;
        let isAnimating = false;

        function drawFortune() {
            if (isAnimating) return;
            isAnimating = true;

            const btn = document.getElementById('shakeBtn');
            const card = document.getElementById('fortuneCard');

            btn.classList.add('shaking');
            card.classList.remove('show');
            card.classList.add('hidden');

            setTimeout(() => {
                // 随机选择，避免连续重复
                let index;
                do {
                    index = Math.floor(Math.random() * fortunes.length);
                } while (index === lastIndex && fortunes.length > 1);
                lastIndex = index;

                const fortune = fortunes[index];

                card.innerHTML = `
                    <div class="fortune-tag">${getLuckLevel()}</div>
                    <div class="fortune-text">"${fortune.text}"</div>
                    <div class="divider"></div>
                    <div class="lucky-color">
                        <div class="color-dot" style="background: ${fortune.color}"></div>
                        <span class="color-label">今日幸运色</span>
                        <span class="color-name" style="color: ${fortune.color}">${fortune.colorName}</span>
                    </div>
                    <div class="advice">
                        <span class="advice-label">今日小建议</span>
                        ${fortune.advice}
                    </div>
                `;

                card.classList.remove('hidden');
                card.classList.add('show');
                btn.classList.remove('shaking');
                isAnimating = false;
            }, 400);
        }

        function getLuckLevel() {
            const levels = ["大吉", "上上签", "好运", "福星高照", "心想事成"];
            return levels[Math.floor(Math.random() * levels.length)];
        }

        // 手机摇一摇支持
        let lastX = 0, lastY = 0, lastZ = 0;
        let lastUpdate = 0;
        const SHAKE_THRESHOLD = 800;

        if (window.DeviceMotionEvent) {
            window.addEventListener('devicemotion', function(event) {
                const current = event.accelerationIncludingGravity;
                if (!current) return;

                const now = Date.now();
                if ((now - lastUpdate) > 100) {
                    const diffTime = now - lastUpdate;
                    lastUpdate = now;

                    const speed = Math.abs(current.x + current.y + current.z - lastX - lastY - lastZ) / diffTime * 10000;

                    if (speed > SHAKE_THRESHOLD) {
                        drawFortune();
                    }

                    lastX = current.x;
                    lastY = current.y;
                    lastZ = current.z;
                }
            }, false);
        }
    </script>
</body>
</html>
