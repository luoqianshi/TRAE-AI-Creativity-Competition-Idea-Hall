<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜数字游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        /* 装饰性元素 */
        .decorative-element {
            position: absolute;
            opacity: 0.8;
        }
        
        .sun {
            top: 50px;
            left: 100px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #ff6b6b, #ff9a8b);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 107, 107, 0.5);
        }
        
        .moon {
            top: 150px;
            right: 100px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #4ecdc4, #45b7d1);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(78, 205, 196, 0.5);
        }
        
        .mountain {
            position: absolute;
            bottom: 0;
        }
        
        .mountain-1 {
            left: 0;
            width: 400px;
            height: 200px;
            background: linear-gradient(to top, #3a0ca3, #7209b7);
            clip-path: polygon(0 100%, 50% 0, 100% 100%);
        }
        
        .mountain-2 {
            right: 0;
            width: 350px;
            height: 180px;
            background: linear-gradient(to top, #4361ee, #4cc9f0);
            clip-path: polygon(0 100%, 50% 0, 100% 100%);
        }
        
        /* 游戏容器 */
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
            z-index: 10;
            position: relative;
        }
        
        /* 标题 */
        h1 {
            font-size: 3em;
            color: white;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            font-weight: bold;
            letter-spacing: 2px;
        }
        
        /* 按钮样式 */
        .game-button {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: none;
            border-radius: 30px;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .game-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .level-mode {
            background: linear-gradient(135deg, #ff9a8b, #ff6b6b);
        }
        
        .challenge-mode {
            background: linear-gradient(135deg, #4ecdc4, #45b7d1);
        }
        
        /* 底部导航 */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            margin-top: 40px;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .nav-item:hover {
            transform: translateY(-5px);
        }
        
        .nav-icon {
            font-size: 1.5em;
            margin-bottom: 5px;
        }
        
        .nav-text {
            font-size: 0.9em;
        }
        
        /* 难度选择弹窗 */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            margin: 15% auto;
            padding: 30px;
            width: 80%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .modal-content h2 {
            color: white;
            margin-bottom: 20px;
        }
        
        .difficulty-button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .easy {
            background: linear-gradient(135deg, #4caf50, #45a049);
        }
        
        .normal {
            background: linear-gradient(135deg, #ff9800, #f57c00);
        }
        
        .hard {
            background: linear-gradient(135deg, #f44336, #d32f2f);
        }
        
        .difficulty-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        /* 猜数字游戏界面 */
        .guess-game {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
            z-index: 10;
            position: relative;
        }
        
        .guess-game h1 {
            font-size: 2.5em;
            color: white;
            margin-bottom: 20px;
        }
        
        .game-info {
            margin-bottom: 20px;
            color: white;
        }
        
        .guess-input {
            width: 100%;
            padding: 10px;
            font-size: 1.2em;
            border: 2px solid #ddd;
            border-radius: 5px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.9);
        }
        
        .guess-button, .reset-button, .back-button {
            padding: 10px 20px;
            font-size: 1.1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: background-color 0.3s;
            color: white;
        }
        
        .guess-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        
        .reset-button {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }
        
        .back-button {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }
        
        .guess-button:hover, .reset-button:hover, .back-button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .guess-button:disabled, .guess-input:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .message {
            margin: 20px 0;
            padding: 10px;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: bold;
        }
        
        .message.success {
            background: rgba(76, 175, 80, 0.8);
            color: white;
            border: 1px solid rgba(76, 175, 80, 0.5);
        }
        
        .message.info {
            background: rgba(33, 150, 243, 0.8);
            color: white;
            border: 1px solid rgba(33, 150, 243, 0.5);
        }
        
        .history {
            margin-top: 20px;
            text-align: left;
            color: white;
        }
        
        .history h3 {
            margin-bottom: 10px;
        }
        
        .history-list {
            list-style-type: none;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .history-list li {
            padding: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .history-list li:last-child {
            border-bottom: none;
        }
        
        /* 评分和最佳记录 */
        .score-section {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
        }
        
        .score {
            margin-bottom: 10px;
        }
        
        .stars {
            font-size: 1.5em;
            margin: 10px 0;
        }
        
        .best-record {
            font-size: 1em;
            margin-top: 10px;
        }
        
        /* 彩带动画 */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            z-index: 1000;
            animation: confetti-fall 3s ease-out forwards;
        }
        
        @keyframes confetti-fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        
        /* 烟花动画 */
        .firework {
            position: fixed;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            z-index: 1000;
            animation: firework-explode 1.5s ease-out forwards;
        }
        
        @keyframes firework-explode {
            0% {
                transform: scale(1);
                opacity: 1;
                box-shadow: 0 0 10px currentColor;
            }
            100% {
                transform: scale(3);
                opacity: 0;
                box-shadow: 0 0 30px currentColor;
            }
        }
        
        .firework-particle {
            position: fixed;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            z-index: 999;
        }
        
        @keyframes particle-fly {
            0% {
                transform: translate(0, 0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty));
                opacity: 0;
            }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .game-container, .guess-game {
                margin: 20px;
                padding: 30px;
            }
            
            h1 {
                font-size: 2.5em;
            }
            
            .sun, .moon {
                width: 100px;
                height: 100px;
            }
            
            .mountain-1, .mountain-2 {
                width: 250px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <!-- 装饰性元素 -->
    <div class="decorative-element sun"></div>
    <div class="decorative-element moon"></div>
    <div class="decorative-element mountain mountain-1"></div>
    <div class="decorative-element mountain mountain-2"></div>
    
    <!-- 主菜单 -->
    <div class="game-container" id="mainMenu">
        <h1>猜数字</h1>
        <button class="game-button level-mode" id="levelModeBtn">闯关模式</button>
        <button class="game-button challenge-mode">挑战模式</button>
        
        <div class="bottom-nav">
            <div class="nav-item">
                <div class="nav-icon">👤</div>
                <div class="nav-text">资料</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon">🏆</div>
                <div class="nav-text">排行榜</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon">⚙️</div>
                <div class="nav-text">设置</div>
            </div>
        </div>
    </div>
    
    <!-- 难度选择弹窗 -->
    <div class="modal" id="difficultyModal">
        <div class="modal-content">
            <h2>选择难度</h2>
            <button class="difficulty-button easy" data-difficulty="easy">简单 (1-50)</button>
            <button class="difficulty-button normal" data-difficulty="normal">普通 (1-100)</button>
            <button class="difficulty-button hard" data-difficulty="hard">困难 (1-1500)</button>
        </div>
    </div>
    
    <!-- 猜数字游戏界面 -->
    <div class="guess-game" id="guessGame">
        <h1>猜数字游戏</h1>
        <div class="game-info" id="gameInfo">
            <p>请输入1-100之间的数字</p>
        </div>
        <input type="number" class="guess-input" id="guessInput" min="1" max="100" placeholder="请输入数字">
        <button class="guess-button" id="guessButton">猜一猜</button>
        <button class="reset-button" id="resetButton">再来一局</button>
        <button class="back-button" id="backButton">返回主菜单</button>
        <div class="message" id="message"></div>
        <div class="history">
            <h3>历史猜测记录</h3>
            <ul class="history-list" id="historyList"></ul>
        </div>
        <div class="score-section">
            <div class="score" id="score"></div>
            <div class="stars" id="stars"></div>
            <div class="best-record" id="bestRecord">最佳记录：-- 次</div>
        </div>
    </div>
    
    <script>
        // 游戏变量
        let targetNumber;
        let guessCount;
        let gameActive;
        let history = [];
        let currentDifficulty;
        let maxNumber;
        let bestRecord = Infinity;
        
        // DOM 元素
        const mainMenu = document.getElementById('mainMenu');
        const levelModeBtn = document.getElementById('levelModeBtn');
        const difficultyModal = document.getElementById('difficultyModal');
        const guessGame = document.getElementById('guessGame');
        const guessInput = document.getElementById('guessInput');
        const guessButton = document.getElementById('guessButton');
        const resetButton = document.getElementById('resetButton');
        const backButton = document.getElementById('backButton');
        const message = document.getElementById('message');
        const historyList = document.getElementById('historyList');
        const gameInfo = document.getElementById('gameInfo');
        const score = document.getElementById('score');
        const stars = document.getElementById('stars');
        const bestRecordElement = document.getElementById('bestRecord');
        
        // Web Audio API 音效系统
        let audioContext = null;
        
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioContext;
        }
        
        // 播放提示音"滴"
        function playGuessSound() {
            const ctx = initAudio();
            const oscillator = ctx.createOscillator();
            const gainNode = ctx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(ctx.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
            
            oscillator.start(ctx.currentTime);
            oscillator.stop(ctx.currentTime + 0.15);
        }
        
        // 播放胜利音效
        function playWinSound() {
            const ctx = initAudio();
            const notes = [523, 659, 784, 1047];
            const duration = 0.15;
            
            notes.forEach((freq, index) => {
                setTimeout(() => {
                    const oscillator = ctx.createOscillator();
                    const gainNode = ctx.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(ctx.destination);
                    
                    oscillator.frequency.value = freq;
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                    
                    oscillator.start(ctx.currentTime);
                    oscillator.stop(ctx.currentTime + duration);
                }, index * 150);
            });
        }
        
        // 显示难度选择弹窗
        levelModeBtn.addEventListener('click', function() {
            difficultyModal.style.display = 'block';
        });
        
        // 关闭弹窗（点击外部）
        window.addEventListener('click', function(event) {
            if (event.target == difficultyModal) {
                difficultyModal.style.display = 'none';
            }
        });
        
        // 难度选择
        document.querySelectorAll('.difficulty-button').forEach(button => {
            button.addEventListener('click', function() {
                const difficulty = this.getAttribute('data-difficulty');
                startGame(difficulty);
                difficultyModal.style.display = 'none';
            });
        });
        
        // 开始游戏
        function startGame(difficulty) {
            // 设置难度参数
            currentDifficulty = difficulty;
            switch(difficulty) {
                case 'easy':
                    maxNumber = 50;
                    break;
                case 'normal':
                    maxNumber = 100;
                    break;
                case 'hard':
                    maxNumber = 1500;
                    break;
            }
            
            // 更新游戏信息
            gameInfo.innerHTML = `<p>请输入1-${maxNumber}之间的数字</p>`;
            guessInput.max = maxNumber;
            
            // 初始化游戏
            initGame();
            
            // 显示游戏界面
            mainMenu.style.display = 'none';
            guessGame.style.display = 'block';
        }
        
        // 初始化游戏
        function initGame() {
            targetNumber = Math.floor(Math.random() * maxNumber) + 1;
            guessCount = 0;
            gameActive = true;
            history = [];
            
            // 重置UI
            guessInput.value = '';
            guessInput.disabled = false;
            guessButton.disabled = false;
            message.textContent = '';
            message.className = 'message';
            historyList.innerHTML = '';
            score.textContent = '';
            stars.textContent = '';
            updateBestRecord();
        }
        
        // 处理猜测
        function handleGuess() {
            if (!gameActive) return;
            
            const guess = parseInt(guessInput.value);
            
            // 验证输入
            if (isNaN(guess) || guess < 1 || guess > maxNumber) {
                showMessage(`请输入1-${maxNumber}之间的有效数字！`, 'info');
                return;
            }
            
            guessCount++;
            history.push(guess);
            updateHistory();
            
            // 播放提示音
            playGuessSound();
            
            // 检查猜测
            if (guess === targetNumber) {
                showMessage(`🎉 恭喜你！答案就是 ${targetNumber}，你用了 ${guessCount} 次猜对！`, 'success');
                endGame();
            } else if (guess > targetNumber) {
                showMessage('太大了！往小猜', 'info');
            } else {
                showMessage('太小了！往大猜', 'info');
            }
            
            // 清空输入框
            guessInput.value = '';
        }
        
        // 显示消息
        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
        }
        
        // 更新历史记录
        function updateHistory() {
            historyList.innerHTML = '';
            history.forEach((guess, index) => {
                const li = document.createElement('li');
                li.textContent = `第 ${index + 1} 次：${guess}`;
                historyList.appendChild(li);
            });
        }
        
        // 结束游戏
        function endGame() {
            gameActive = false;
            guessInput.disabled = true;
            guessButton.disabled = true;
            
            // 播放胜利音效
            playWinSound();
            
            // 计算评分
            calculateScore();
            
            // 更新最佳记录
            if (guessCount < bestRecord) {
                bestRecord = guessCount;
                updateBestRecord();
            }
        }
        
        // 计算评分
        function calculateScore() {
            let scoreText = '';
            let starCount = 0;
            
            if (guessCount <= 3) {
                scoreText = '完美！';
                starCount = 5;
                createConfetti();
            } else if (guessCount <= 5) {
                scoreText = '优秀！';
                starCount = 4;
                createConfetti();
            } else if (guessCount <= 8) {
                scoreText = '不错！';
                starCount = 3;
                createFirework();
            } else {
                scoreText = '继续加油！';
                starCount = 2;
            }
            
            score.textContent = `评分：${scoreText}`;
            stars.textContent = '⭐'.repeat(starCount);
        }
        
        // 创建彩带动画
        function createConfetti() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#6ab04c', '#eb4d4b', '#a55eea'];
            const confettiCount = 50;
            
            for (let i = 0; i < confettiCount; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    confetti.style.animationDelay = Math.random() * 0.5 + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => {
                        confetti.remove();
                    }, 4000);
                }, i * 30);
            }
        }
        
        // 创建烟花动画
        function createFirework() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#6ab04c', '#eb4d4b', '#a55eea'];
            const fireworkCount = 8;
            
            for (let i = 0; i < fireworkCount; i++) {
                setTimeout(() => {
                    const x = Math.random() * 80 + 10;
                    const y = Math.random() * 50 + 20;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    
                    // 创建爆炸中心
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    firework.style.left = x + 'vw';
                    firework.style.top = y + 'vh';
                    firework.style.backgroundColor = color;
                    firework.style.color = color;
                    document.body.appendChild(firework);
                    
                    // 创建粒子
                    const particleCount = 20;
                    for (let j = 0; j < particleCount; j++) {
                        const particle = document.createElement('div');
                        particle.className = 'firework-particle';
                        particle.style.left = x + 'vw';
                        particle.style.top = y + 'vh';
                        particle.style.backgroundColor = color;
                        
                        const angle = (j / particleCount) * Math.PI * 2;
                        const distance = Math.random() * 100 + 50;
                        const tx = Math.cos(angle) * distance;
                        const ty = Math.sin(angle) * distance;
                        
                        particle.style.setProperty('--tx', tx + 'px');
                        particle.style.setProperty('--ty', ty + 'px');
                        particle.style.animation = `particle-fly 1s ease-out forwards`;
                        particle.style.animationDelay = '0.1s';
                        
                        document.body.appendChild(particle);
                        
                        setTimeout(() => {
                            particle.remove();
                        }, 1200);
                    }
                    
                    setTimeout(() => {
                        firework.remove();
                    }, 1500);
                }, i * 300);
            }
        }
        
        // 更新最佳记录
        function updateBestRecord() {
            if (bestRecord === Infinity) {
                bestRecordElement.textContent = '最佳记录：-- 次';
            } else {
                bestRecordElement.textContent = `最佳记录：${bestRecord} 次`;
            }
        }
        
        // 返回主菜单
        function backToMainMenu() {
            guessGame.style.display = 'none';
            mainMenu.style.display = 'block';
        }
        
        // 事件监听
        guessButton.addEventListener('click', handleGuess);
        resetButton.addEventListener('click', initGame);
        backButton.addEventListener('click', backToMainMenu);
        
        // 按回车键也可以提交猜测
        guessInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleGuess();
            }
        });
        
        // 挑战模式点击事件
        document.querySelector('.challenge-mode').addEventListener('click', function() {
            alert('挑战模式即将开启！');
        });
        
        // 底部导航点击事件
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                const text = this.querySelector('.nav-text').textContent;
                alert(`${text}功能即将上线！`);
            });
        });
    </script>
</body>
</html>
