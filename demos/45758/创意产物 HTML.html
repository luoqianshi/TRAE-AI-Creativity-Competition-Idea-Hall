<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <!-- 手機適配強制 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>牛馬計薪器｜打工人專屬摸魚工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #121418;
            color: #e8e8e8;
            min-height: 100vh;
            padding: 20px 16px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 24px;
            color: #44ff88;
            letter-spacing: 2px;
        }
        /* 今日已賺大數字區塊 */
        .total-box {
            background: #1a1d23;
            border-radius: 16px;
            padding: 32px 16px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #29303a;
        }
        .total-label {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 8px;
        }
        .total-money {
            font-size: 52px;
            font-weight: bold;
            color: #44ff88;
            text-shadow: 0 0 12px #44ff8866;
        }
        /* 數據卡片佈局 */
        .card-wrap {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .card {
            background: #1a1d23;
            border-radius: 12px;
            padding: 18px 12px;
            text-align: center;
            border: 1px solid #29303a;
        }
        .card-title {
            font-size: 14px;
            color: #999;
            margin-bottom: 6px;
        }
        .card-num {
            font-size: 22px;
            color: #44ff88;
            font-weight: bold;
        }
        .countdown-card {
            grid-column: 1 / -1;
        }
        /* 摸魚專區 */
        .fish-box {
            background: #1f242b;
            border-radius: 12px;
            padding: 20px 16px;
            margin-bottom: 20px;
            border: 1px dashed #44ff8855;
            text-align: center;
        }
        .fish-status {
            font-size: 18px;
            margin-bottom: 10px;
            color: #ffdd44;
        }
        .fish-money {
            font-size: 26px;
            color: #44ff88;
            font-weight: bold;
            margin-bottom: 12px;
        }
        button {
            background: #284e38;
            color: #44ff88;
            border: 1px solid #44ff88;
            border-radius: 8px;
            padding: 10px 24px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #44ff88;
            color: #121418;
        }
        /* 設置面板 */
        .set-box {
            background: #1a1d23;
            border-radius: 12px;
            padding: 20px 16px;
            margin-bottom: 20px;
            border: 1px solid #29303a;
        }
        .set-title {
            font-size: 18px;
            margin-bottom: 16px;
            color: #44ff88;
        }
        .row {
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .row label {
            font-size: 15px;
            color: #ccc;
        }
        input {
            width: 140px;
            background: #242930;
            border: 1px solid #333b47;
            color: #44ff88;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
        }
        /* 毒雞湯底部 */
        .soup-text {
            text-align: center;
            font-size: 15px;
            color: #bbbbbb;
            padding: 10px;
            line-height: 1.6;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🐂 牛馬計薪器 🐎</h1>

    <!-- 今日累計收入 -->
    <div class="total-box">
        <div class="total-label">今日已經賺到</div>
        <div class="total-money" id="totalIncome">$0.00</div>
    </div>

    <!-- 核心數據卡片 -->
    <div class="card-wrap">
        <div class="card">
            <div class="card-title">每分鐘收入</div>
            <div class="card-num" id="perMin">$0.00</div>
        </div>
        <div class="card">
            <div class="card-title">每秒收入</div>
            <div class="card-num" id="perSec">$0.00</div>
        </div>
        <div class="card countdown-card">
            <div class="card-title">距離下班倒計時</div>
            <div class="card-num" id="countdown">00:00:00</div>
        </div>
    </div>

    <!-- 摸魚模式區塊 -->
    <div class="fish-box">
        <div class="fish-status" id="fishTip">未開啟摸魚模式</div>
        <div class="fish-money">摸魚收益：<span id="fishIncome">$0.00</span></div>
        <button id="fishBtn">開啟摸魚模式</button>
    </div>

    <!-- 參數設置面板 -->
    <div class="set-box">
        <div class="set-title">⚙️ 打工參數設定</div>
        <div class="row">
            <label>日薪金額 ($)</label>
            <input type="number" id="salaryDay" value="500" min="1">
        </div>
        <div class="row">
            <label>每日工時 (小時)</label>
            <input type="number" id="workHour" value="8" min="0.5" step="0.5">
        </div>
        <div class="row">
            <label>上班時間 (HH:mm)</label>
            <input type="time" id="startTime" value="09:00">
        </div>
        <div class="row">
            <label>下班時間 (HH:mm)</label>
            <input type="time" id="endTime" value="18:00">
        </div>
    </div>

    <!-- 底部毒雞湯 -->
    <div class="soup-text" id="chickenSoup"></div>
</div>

<script>
// ====================== 配置常數 & 毒雞湯庫 ======================
const soupList = [
    "今日又係賣身嘅一日",
    "返工唔係為咗理想，係為咗出糧",
    "老細畫嘅餅，飽唔到我個肚",
    "月薪三千，操住三萬個心",
    "生命誠可貴，返工好攰",
    "摸魚先係工作嘅核心競爭力",
    "世界那麼大，我淨係想準時放工",
    "努力唔一定有回報，但摸魚一定有",
    "牛馬嘅宿命：日出而作，日落仲作",
    "錢唔係萬能，但冇錢萬萬不能",
    "上班只為苟活，下班先係生活",
    "年年打工年年愁，日日加班日日憂"
];

// 全局狀態
let appData = {
    daySalary: 500,        // 日薪
    workHours: 8,          // 每日工時
    startWork: "09:00",    // 上班時間
    endWork: "18:00",      // 下班時間
    fishOpen: false,       // 摸魚開關
    fishStartStamp: 0,     // 摸魚開始時間戳
    perSecondMoney: 0      // 每秒收入
};

// DOM元素緩存
const dom = {
    totalIncome: document.getElementById("totalIncome"),
    perMin: document.getElementById("perMin"),
    perSec: document.getElementById("perSec"),
    countdown: document.getElementById("countdown"),
    fishTip: document.getElementById("fishTip"),
    fishIncome: document.getElementById("fishIncome"),
    fishBtn: document.getElementById("fishBtn"),
    salaryDay: document.getElementById("salaryDay"),
    workHour: document.getElementById("workHour"),
    startTime: document.getElementById("startTime"),
    endTime: document.getElementById("endTime"),
    chickenSoup: document.getElementById("chickenSoup")
};

// ====================== 本地存儲封裝（模擬wx.setStorageSync，瀏覽器localStorage兼容） ======================
const storage = {
    set(key, val) {
        localStorage.setItem(key, JSON.stringify(val));
    },
    get(key) {
        const str = localStorage.getItem(key);
        return str ? JSON.parse(str) : null;
    }
};

// 讀取本地保存設定
function loadStorage() {
    const save = storage.get("cowWorkerPay");
    if (save) {
        appData = {...appData, ...save};
        // 同步到輸入框
        dom.salaryDay.value = appData.daySalary;
        dom.workHour.value = appData.workHours;
        dom.startTime.value = appData.startWork;
        dom.endTime.value = appData.endWork;
    }
    calcUnitMoney(); // 計算每分每秒收入
}

// 保存設定到本地
function saveStorage() {
    appData.daySalary = Number(dom.salaryDay.value);
    appData.workHours = Number(dom.workHour.value);
    appData.startWork = dom.startTime.value;
    appData.endWork = dom.endTime.value;
    storage.set("cowWorkerPay", appData);
    calcUnitMoney();
}

// ====================== 薪資基礎計算：每秒/每分鐘收入 ======================
function calcUnitMoney() {
    const dayTotalSec = appData.workHours * 60 * 60;
    appData.perSecondMoney = appData.daySalary / dayTotalSec;
    const perMin = appData.perSecondMoney * 60;
    dom.perSec.innerText = `$${appData.perSecondMoney.toFixed(2)}`;
    dom.perMin.innerText = `$${perMin.toFixed(2)}`;
}

// ====================== 時間工具函數 ======================
// 將 HH:mm 轉今日時間戳
function timeToStamp(timeStr) {
    const now = new Date();
    const [h, m] = timeStr.split(":").map(Number);
    const target = new Date(now);
    target.setHours(h, m, 0, 0);
    return target.getTime();
}

// 秒數轉 時:分:秒
function secToHms(totalSec) {
    if (totalSec <= 0) return "已落班！";
    let s = Math.floor(totalSec);
    const h = Math.floor(s / 3600);
    s = s % 3600;
    const m = Math.floor(s / 60);
    s = s % 60;
    const pad = n => String(n).padStart(2, "0");
    return `${pad(h)}:${pad(m)}:${pad(s)}`;
}

// ====================== 實時刷新主邏輯（每秒執行） ======================
function updateAll() {
    const nowStamp = Date.now();
    const startStamp = timeToStamp(appData.startWork);
    const endStamp = timeToStamp(appData.endWork);

    // 1. 計算今日已賺金額
    let earnSec = 0;
    if (nowStamp > startStamp) {
        if (nowStamp < endStamp) {
            earnSec = (nowStamp - startStamp) / 1000;
        } else {
            earnSec = (endStamp - startStamp) / 1000;
        }
    }
    const todayMoney = earnSec * appData.perSecondMoney;
    dom.totalIncome.innerText = `$${todayMoney.toFixed(2)}`;

    // 2. 下班倒計時
    const diffSec = (endStamp - nowStamp) / 1000;
    dom.countdown.innerText = secToHms(diffSec);

    // 3. 摸魚收益計算
    if (appData.fishOpen && appData.fishStartStamp > 0) {
        const fishSec = (nowStamp - appData.fishStartStamp) / 1000;
        const fishMoney = fishSec * appData.perSecondMoney;
        dom.fishIncome.innerText = `$${fishMoney.toFixed(2)}`;
    }
}

// ====================== 摸魚模式切換 ======================
function toggleFishMode() {
    appData.fishOpen = !appData.fishOpen;
    if (appData.fishOpen) {
        appData.fishStartStamp = Date.now();
        dom.fishTip.innerText = "摸魚中，緊賺老闆錢";
        dom.fishBtn.innerText = "結束摸魚模式";
    } else {
        dom.fishTip.innerText = "未開啟摸魚模式";
        dom.fishIncome.innerText = "$0.00";
        dom.fishBtn.innerText = "開啟摸魚模式";
    }
}

// ====================== 隨機切換毒雞湯 ======================
function randomSoup() {
    const randomIdx = Math.floor(Math.random() * soupList.length);
    dom.chickenSoup.innerText = soupList[randomIdx];
}

// ====================== 綁定輸入框監聽（改參數自動保存） ======================
function bindInputEvent() {
    const inputs = [dom.salaryDay, dom.workHour, dom.startTime, dom.endTime];
    inputs.forEach(input => {
        input.addEventListener("change", saveStorage);
    });
    dom.fishBtn.addEventListener("click", toggleFishMode);
}

// ====================== 程序入口初始化 ======================
function init() {
    loadStorage();
    bindInputEvent();
    randomSoup();
    // 每秒刷新畫面
    setInterval(updateAll, 1000);
    // 每30秒更換一次毒雞湯
    setInterval(randomSoup, 30000);
    // 開頁即時執行一次渲染
    updateAll();
}

// 啟動
init();
</script>
</body>
</html>
