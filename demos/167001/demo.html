<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2026世界杯球员册 - Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    background: #0a1a0a;
    background-image:
        radial-gradient(ellipse at 50% 0%, rgba(212,175,55,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 100%, rgba(45,90,29,0.15) 0%, transparent 60%),
        linear-gradient(135deg, #0d1f0d 0%, #0a1a0a 100%);
    min-height: 100vh;
    color: #fff;
    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background:
        linear-gradient(180deg, #f5f1e8 0%, #ede4d0 100%);
    background-image:
        radial-gradient(ellipse at 50% 0%, rgba(212,175,55,0.04) 0%, transparent 40%),
        linear-gradient(180deg, #f5f1e8 0%, #e8dfc8 100%);
    color: #4a3020;
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 0 60px rgba(212,175,55,0.15), 0 0 100px rgba(0,0,0,0.4);
}

/* === 纸张纹理通用卡片 === */
.paper-card {
    background: linear-gradient(180deg, #fffcf5 0%, #f8f2e4 100%);
    border: 2px solid #d4af37;
    border-radius: 12px;
    box-shadow: 0 4px 12px rgba(139,90,43,0.12), inset 0 0 20px rgba(212,175,55,0.04);
}

/* === 顶部 === */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    background: linear-gradient(180deg, #1d3a12 0%, #0d1f06 100%);
    color: #fff;
    flex-shrink: 0;
    border-bottom: 3px solid #d4af37;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
.header h1 {
    font-size: 17px;
    background: linear-gradient(180deg, #ffd700, #d4af37);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.pts-badge {
    display: flex; align-items: center; gap: 6px;
    background: linear-gradient(180deg, rgba(212,175,55,0.25), rgba(212,175,55,0.1));
    border: 1px solid rgba(212,175,55,0.4);
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 14px;
    color: #ffd700;
}
.pts-badge .pts-icon { font-size: 14px; }

/* === 页面区域 === */
.page {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: none;
}
.page.active { display: block; }

/* === 抽卡页 === */
.gacha-title {
    text-align: center;
    font-size: 13px;
    color: #8b5a2b;
    margin-bottom: 12px;
    letter-spacing: 1px;
}

/* CSS 卡包 */
.pack-wrap {
    perspective: 800px;
    margin-bottom: 20px;
}
.pack {
    width: 200px;
    height: 260px;
    margin: 0 auto;
    border-radius: 16px;
    position: relative;
    cursor: pointer;
    transition: transform 0.3s ease;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4), 0 0 20px rgba(212,175,55,0.2);
    overflow: hidden;
}
.pack:hover { transform: rotateY(-5deg) translateY(-4px); }
.pack:active { transform: scale(0.97); }

.pack-bg {
    position: absolute; inset: 0;
    background:
        linear-gradient(135deg, #8b1a1a 0%, #2d5a1d 50%, #d4af37 100%);
}
.pack-pattern {
    position: absolute; inset: 0;
    background-image:
        repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(255,255,255,0.03) 8px, rgba(255,255,255,0.03) 16px);
}
.pack-border {
    position: absolute; inset: 8px;
    border: 2px solid rgba(255,215,0,0.5);
    border-radius: 10px;
}
.pack-content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}
.pack-ball {
    font-size: 48px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    animation: packBallBounce 2s ease-in-out infinite;
}
@keyframes packBallBounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}
.pack-title {
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 3px;
    color: #ffd700;
}
.pack-sub {
    font-size: 10px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 1px;
}

.gacha-cost {
    text-align: center;
    font-size: 11px;
    color: #8b5a2b;
    margin-top: 8px;
    margin-bottom: 16px;
}

.gacha-btns { display: flex; gap: 12px; margin-bottom: 20px; }
.gacha-btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    color: #fff;
}
.gacha-btn:active { transform: scale(0.96); }
.gacha-btn.single {
    background: linear-gradient(180deg, #d4af37, #b8941f);
    box-shadow: 0 4px 12px rgba(212,175,55,0.3);
}
.gacha-btn.multi {
    background: linear-gradient(180deg, #8b5a2b, #6b4423);
    box-shadow: 0 4px 12px rgba(107,68,35,0.3);
}
.gacha-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.gacha-btn-sub { font-size: 11px; font-weight: normal; opacity: 0.8; }

/* 演示补满按钮 */
.demo-fill-btn {
    display: block;
    width: 100%;
    padding: 10px;
    margin-bottom: 16px;
    border: 2px dashed #d4af37;
    border-radius: 10px;
    background: rgba(212,175,55,0.08);
    color: #8b5a2b;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
}
.demo-fill-btn:active { background: rgba(212,175,55,0.15); }

/* 新球员获得提示 */
.new-notice {
    background: linear-gradient(180deg, #fff3cd 0%, #ffe8a3 100%);
    border: 2px solid #ffd700;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 12px;
    text-align: center;
    font-size: 13px;
    color: #8b6d00;
    font-weight: bold;
    animation: noticeIn 0.4s ease;
}
@keyframes noticeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}
.new-notice .nn-icon { margin-right: 4px; }

/* 抽卡结果 */
.pull-results {
    border-radius: 12px;
    padding: 14px;
    border: 2px solid #d4af37;
    background: linear-gradient(180deg, #fffcf5 0%, #f8f2e4 100%);
    box-shadow: 0 4px 12px rgba(139,90,43,0.12);
}
.pull-results-title {
    font-size: 13px;
    color: #8b5a2b;
    margin-bottom: 10px;
    font-weight: bold;
}
.pull-list {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
}

/* 球员卡（通用 - 抽卡结果 & 图鉴复用） */
.player-card {
    aspect-ratio: 3/4;
    border-radius: 8px;
    border: 2px solid;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding: 4px 2px;
    font-size: 10px;
    position: relative;
    overflow: hidden;
    animation: cardReveal 0.4s ease backwards;
}
@keyframes cardReveal {
    from { opacity: 0; transform: rotateY(90deg) scale(0.8); }
    to { opacity: 1; transform: rotateY(0) scale(1); }
}

.player-card.empty {
    border-style: dashed;
    border-color: #c0b89e;
    background: rgba(139,90,43,0.06);
    color: #b0a888;
    justify-content: center;
}
.player-card.empty .qmark { font-size: 28px; opacity: 0.5; }
.player-card.empty .empty-text { font-size: 8px; margin-top: 4px; }

/* 稀有度边框 */
.player-card.rarity-SSR {
    border-color: #ffd700;
    background: linear-gradient(180deg, #fffbe6 0%, #fff5cc 100%);
    box-shadow: 0 0 10px rgba(255,215,0,0.4), 0 2px 6px rgba(255,215,0,0.2);
}
.player-card.rarity-SR {
    border-color: #9b59b6;
    background: linear-gradient(180deg, #f9f0fb 0%, #efd8f5 100%);
    box-shadow: 0 0 6px rgba(155,89,182,0.2);
}
.player-card.rarity-R {
    border-color: #3498db;
    background: linear-gradient(180deg, #f0f7fc 0%, #d9ecf8 100%);
}
.player-card.rarity-N {
    border-color: #a0a0a0;
    background: linear-gradient(180deg, #f8f8f8 0%, #eee 100%);
}

/* 球员卡内容 */
.pc-rar-tag {
    position: absolute; top: 2px; left: 2px;
    font-size: 7px; font-weight: bold;
    padding: 1px 4px; border-radius: 3px;
    color: #fff;
    line-height: 1.2;
}
.pc-rar-tag.SSR { background: #ffd700; color: #4a3020; }
.pc-rar-tag.SR { background: #9b59b6; }
.pc-rar-tag.R { background: #3498db; }
.pc-rar-tag.N { background: #95a5a6; }

.pc-flag { font-size: 22px; margin-top: 14px; }
.pc-name {
    font-size: 9px; text-align: center;
    line-height: 1.1; padding: 0 2px;
    color: #4a3020;
}
.pc-ovr {
    font-size: 12px; font-weight: bold;
    color: #d4af37;
    align-self: flex-end;
    padding-right: 4px;
}
.pc-pos {
    font-size: 7px; color: #888;
    position: absolute; bottom: 2px; left: 3px;
}
.pc-status {
    position: absolute; bottom: 2px; right: 2px;
    font-size: 7px; font-weight: bold;
}
.pc-status.new { color: #e53e3e; }
.pc-status.dup { color: #999; }

/* === 图鉴页 === */
.inv-progress-bar {
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
    border: 2px solid #d4af37;
    text-align: center;
    background: linear-gradient(180deg, #fffcf5 0%, #f8f2e4 100%);
    box-shadow: 0 4px 10px rgba(139,90,43,0.08);
}
.inv-progress-bar .num { font-size: 28px; font-weight: bold; color: #d4af37; }
.inv-progress-bar .label { font-size: 11px; color: #8b5a2b; }

.country-filter { display: flex; gap: 8px; margin-bottom: 12px; }
.country-btn {
    flex: 1;
    padding: 10px;
    border: 2px solid #d4af37;
    border-radius: 10px;
    background: linear-gradient(180deg, #fffcf5 0%, #f8f2e4 100%);
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    color: #6b4423;
    transition: all 0.2s;
}
.country-btn.active {
    background: linear-gradient(180deg, #d4af37 0%, #b8941f 100%);
    color: #fff;
    border-color: #ffd700;
    box-shadow: 0 2px 8px rgba(212,175,55,0.3);
}

.inv-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

/* === 出征页 === */
.match-intro {
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    border: 2px solid #d4af37;
    text-align: center;
    background: linear-gradient(180deg, #fffcf5 0%, #f8f2e4 100%);
    box-shadow: 0 4px 10px rgba(139,90,43,0.08);
}
.match-intro p { font-size: 13px; color: #8b5a2b; }

.team-list { display: flex; flex-direction: column; gap: 12px; }
.team-entry {
    border-radius: 12px;
    padding: 16px;
    border: 2px solid #d4af37;
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(180deg, #fffcf5 0%, #f8f2e4 100%);
    box-shadow: 0 4px 10px rgba(139,90,43,0.08);
}
.team-entry .tflag { font-size: 36px; }
.team-entry .tinfo { flex: 1; }
.team-entry .tname { font-size: 16px; font-weight: bold; }
.team-entry .tcount { font-size: 12px; color: #8b5a2b; margin-top: 2px; }
.team-entry .tovr { font-size: 12px; color: #d4af37; font-weight: bold; margin-top: 2px; }
.team-entry .tstatus { font-size: 12px; margin-top: 4px; }
.team-entry .tstatus.ready { color: #228b22; font-weight: bold; }
.team-entry .tstatus.locked { color: #999; }
.deploy-btn {
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
    transition: transform 0.15s;
}
.deploy-btn:active { transform: scale(0.95); }
.deploy-btn.ready {
    background: linear-gradient(180deg, #228b22, #1a6b1a);
    color: #fff;
    box-shadow: 0 4px 10px rgba(34,139,34,0.3);
}
.deploy-btn.locked {
    background: #ddd;
    color: #999;
    cursor: not-allowed;
}

/* === 比赛面板 === */
.match-arena { display: none; }
.match-arena.active { display: block; }

/* 比分牌 */
.scoreboard {
    background: linear-gradient(180deg, #1a3a0d 0%, #0d1f06 100%);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 8px;
    border: 2px solid #d4af37;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
.sb-side { text-align: center; flex: 1; }
.sb-side .sb-flag { font-size: 28px; }
.sb-side .sb-name { font-size: 11px; color: #ccc; margin-top: 2px; }
.sb-score {
    font-size: 36px; font-weight: bold;
    color: #ffd700;
    min-width: 90px; text-align: center;
    text-shadow: 0 2px 8px rgba(255,215,0,0.3);
}
.sb-minute {
    text-align: center;
    font-size: 12px;
    color: #d4af37;
    margin-bottom: 10px;
    font-weight: bold;
    letter-spacing: 1px;
}

/* CSS 球场 */
.pitch {
    background: linear-gradient(180deg, #2d7a2d 0%, #1a5a1a 50%, #2d7a2d 100%);
    border-radius: 12px;
    height: 140px;
    margin-bottom: 12px;
    border: 2px solid #d4af37;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
}
/* 草坪条纹 */
.pitch::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
        180deg,
        transparent 0px, transparent 20px,
        rgba(255,255,255,0.03) 20px, rgba(255,255,255,0.03) 40px
    );
}
/* 中线 */
.pitch-line-center {
    position: absolute;
    top: 0; bottom: 0; left: 50%;
    width: 2px;
    background: rgba(255,255,255,0.25);
}
/* 中圈 */
.pitch-circle {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 50px; height: 50px;
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 50%;
}
/* 中点 */
.pitch-dot {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 4px; height: 4px;
    background: rgba(255,255,255,0.4);
    border-radius: 50%;
}
/* 禁区 */
.pitch-box-left {
    position: absolute;
    top: 20%; left: 0;
    width: 20%; height: 60%;
    border: 2px solid rgba(255,255,255,0.2);
    border-left: none;
}
.pitch-box-right {
    position: absolute;
    top: 20%; right: 0;
    width: 20%; height: 60%;
    border: 2px solid rgba(255,255,255,0.2);
    border-right: none;
}
/* 小禁区 */
.pitch-small-left {
    position: absolute;
    top: 35%; left: 0;
    width: 10%; height: 30%;
    border: 2px solid rgba(255,255,255,0.15);
    border-left: none;
}
.pitch-small-right {
    position: absolute;
    top: 35%; right: 0;
    width: 10%; height: 30%;
    border: 2px solid rgba(255,255,255,0.15);
    border-right: none;
}
/* 足球 */
.pitch-ball {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 16px;
    z-index: 2;
    animation: ballFloat 3s ease-in-out infinite;
}
@keyframes ballFloat {
    0%,100% { transform: translate(-50%, -50%); }
    25% { transform: translate(-30%, -60%); }
    50% { transform: translate(-70%, -40%); }
    75% { transform: translate(-50%, -55%); }
}

/* 战术面板 */
.tactic-panel {
    border-radius: 12px;
    padding: 14px;
    border: 2px solid #d4af37;
    margin-bottom: 12px;
    background: linear-gradient(180deg, #fffcf5 0%, #f8f2e4 100%);
    box-shadow: 0 4px 10px rgba(139,90,43,0.08);
}
.tactic-panel .tp-minute {
    display: inline-block;
    background: linear-gradient(180deg, #d4af37, #b8941f);
    color: #fff;
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 6px;
}
.tactic-panel .tp-title { font-size: 15px; font-weight: bold; color: #6b4423; margin-bottom: 4px; }
.tactic-panel .tp-desc { font-size: 12px; color: #8b5a2b; margin-bottom: 14px; line-height: 1.4; }
.tactic-cards { display: flex; flex-direction: column; gap: 10px; }

/* 战术卡片 */
.tactic-card {
    display: flex;
    flex-direction: column;
    padding: 12px;
    border: 2px solid;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    gap: 8px;
}
.tactic-card:active { transform: scale(0.97); }
.tactic-card:disabled { opacity: 0.4; cursor: not-allowed; }

.tactic-card.risk-safe { border-color: #228b22; background: linear-gradient(180deg, #f0fdf4 0%, #dcfce7 100%); }
.tactic-card.risk-balanced { border-color: #d4af37; background: linear-gradient(180deg, #fffcf5 0%, #fef9e7 100%); }
.tactic-card.risk-aggressive { border-color: #dc2626; background: linear-gradient(180deg, #fef2f2 0%, #fee2e2 100%); }

.tc-top { display: flex; justify-content: space-between; align-items: center; }
.tc-name { font-size: 13px; font-weight: bold; color: #4a3020; }
.tc-risk-tag {
    font-size: 9px; font-weight: bold; padding: 2px 8px; border-radius: 8px; color: #fff;
}
.tc-risk-tag.safe { background: #228b22; }
.tc-risk-tag.balanced { background: #d4af37; color: #4a3020; }
.tc-risk-tag.aggressive { background: #dc2626; }

.tc-desc { font-size: 11px; color: #6b4423; line-height: 1.3; }

/* 球员对位小牌 */
.tc-matchup { display: flex; align-items: center; gap: 6px; }
.tc-player-mini {
    display: flex; align-items: center; gap: 4px;
    padding: 3px 6px;
    border-radius: 6px;
    border: 1px solid;
    font-size: 9px;
    flex: 1;
}
.tc-player-mini.me { border-color: #d4af37; background: rgba(212,175,55,0.08); }
.tc-player-mini.opp { border-color: #888; background: rgba(0,0,0,0.04); }
.tc-player-mini .pm-flag { font-size: 12px; }
.tc-player-mini .pm-pos { font-weight: bold; color: #6b4423; }
.tc-player-mini .pm-name { color: #888; font-size: 8px; }
.tc-player-mini .pm-ovr { font-weight: bold; color: #d4af37; margin-left: auto; }
.tc-vs { font-size: 10px; color: #aaa; font-weight: bold; flex-shrink: 0; }

/* 比赛事件反馈 */
.match-event {
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
    border: 2px solid;
    text-align: center;
    font-size: 13px;
    display: none;
    animation: evtIn 0.3s ease;
    font-weight: bold;
}
@keyframes evtIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.match-event.goal { border-color: #228b22; background: linear-gradient(180deg, #f0fdf4, #dcfce7); color: #228b22; }
.match-event.lose { border-color: #dc2626; background: linear-gradient(180deg, #fef2f2, #fee2e2); color: #dc2626; }
.match-event.neutral { border-color: #d4af37; background: linear-gradient(180deg, #fffcf5, #fef9e7); color: #6b4423; }

/* 事件列表 */
.event-log {
    border-radius: 10px;
    padding: 10px;
    border: 2px solid #d4af37;
    margin-bottom: 12px;
    max-height: 150px;
    overflow-y: auto;
    background: linear-gradient(180deg, #fffcf5 0%, #f8f2e4 100%);
    box-shadow: 0 4px 8px rgba(139,90,43,0.06);
}
.event-log .el-title { font-size: 11px; font-weight: bold; color: #8b5a2b; margin-bottom: 6px; }
.event-log .el-item { font-size: 11px; color: #6b4423; padding: 3px 0; border-bottom: 1px solid #f0e8d8; }
.event-log .el-item:last-child { border-bottom: none; }

/* 比赛结果 */
.match-result {
    border-radius: 16px;
    padding: 28px 20px;
    text-align: center;
    border: 3px solid #d4af37;
    display: none;
    background: linear-gradient(180deg, #fffcf5 0%, #f8f2e4 100%);
    box-shadow: 0 8px 24px rgba(139,90,43,0.15);
}
.match-result.show { display: block; animation: evtIn 0.4s ease; }
.result-icon { font-size: 56px; margin-bottom: 12px; }

var RARITY_ORDER = {SSR:4,SR:3,R:2,N:1};
var RARITY_COLOR = {SSR:"#ffd700",SR:"#9b59b6",R:"#3498db",N:"#95a5a6"};

// ============================================
// 2. 数据存储
// ============================================
var SAVE_KEY = 'wc2026_demo';
var data = {pts:1000, inventory:{}};

function loadData() {
    try {
        var s = localStorage.getItem(SAVE_KEY);
        if (s) {
            var p = JSON.parse(s);
            data.pts = p.pts || 1000;
            data.inventory = p.inventory || {};
        }
    } catch(e) {}
}
function saveData() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch(e) {}
}
function isOwned(id) { return !!data.inventory[id]; }
function ownedCount(team) {
    var c = 0;
    for (var i = 0; i < PLAYERS.length; i++) {
        if (PLAYERS[i].team === team && isOwned(PLAYERS[i].id)) c++;
    }
    return c;
}
function totalOwned() {
    var c = 0;
    for (var id in data.inventory) c++;
    return c;
}
function getTeamOVR(team) {
    var owned = PLAYERS.filter(function(p){ return p.team === team && isOwned(p.id); });
    if (owned.length === 0) return 0;
    var total = 0;
    for (var i = 0; i < owned.length; i++) total += owned[i].ovr;
    return Math.round(total / owned.length);
}

// ============================================
// 3. 抽卡
// ============================================
function rollRarity() {
    var r = Math.random();
    if (r < 0.05) return 'SSR';
    if (r < 0.20) return 'SR';
    if (r < 0.50) return 'R';
    return 'N';
}

function pullOne() {
    var rarity = rollRarity();
    var pool = PLAYERS.filter(function(p){ return p.rarity === rarity; });
    if (pool.length === 0) pool = PLAYERS;
    return pool[Math.floor(Math.random() * pool.length)];
}

function doPull(count) {
    var cost = count === 1 ? 100 : 900;
    if (data.pts < cost) {
        showToast('PTS 不足！');
        return;
    }
    data.pts -= cost;

    var results = [];
    var hasSRPlus = false;

    for (var i = 0; i < count; i++) {
        var p = pullOne();
        var isNew = !isOwned(p.id);
        if (isNew) {
            data.inventory[p.id] = {count:1};
        } else {
            data.inventory[p.id].count = (data.inventory[p.id].count || 1) + 1;
            data.pts += 20; // 重复补偿
        }
        if (RARITY_ORDER[p.rarity] >= 3) hasSRPlus = true;
        results.push({player:p, isNew:isNew});
    }

    // 十连保底：如果没有SR+，最后一个强制变SR
    if (count === 10 && !hasSRPlus) {
        var srPool = PLAYERS.filter(function(p){ return p.rarity === 'SR'; });
        if (srPool.length > 0) {
            var replacement = srPool[Math.floor(Math.random() * srPool.length)];
            var isNew = !isOwned(replacement.id);
            if (isNew) {
                data.inventory[replacement.id] = {count:1};
            } else {
                data.inventory[replacement.id].count = (data.inventory[replacement.id].count || 1) + 1;
                data.pts += 20;
            }
            results[9] = {player:replacement, isNew:isNew};
        }
    }

    saveData();
    renderPTS();
    renderPullResults(results);
    renderInventory();
    renderMatch();
}

// 演示模式：补齐葡萄牙
function demoFill() {
    var porPlayers = PLAYERS.filter(function(p){ return p.team === '葡萄牙'; });
    var newCount = 0;
    for (var i = 0; i < porPlayers.length; i++) {
        if (!isOwned(porPlayers[i].id)) {
            data.inventory[porPlayers[i].id] = {count:1};
            newCount++;
        }
    }
    saveData();
    renderPTS();
    renderInventory();
    renderMatch();
    if (newCount > 0) {
        showNewNotice([{player:{name:'葡萄牙全员',flag:'🇵🇹'},isNew:true}]);
        showToast('已补齐葡萄牙 ' + newCount + ' 人！');
    } else {
        showToast('葡萄牙已满员！');
    }
}

function renderPTS() {
    document.getElementById('pts').textContent = data.pts;
}

// 新球员获得提示
function showNewNotice(results) {
    var newPlayers = results.filter(function(r){ return r.isNew; });
    if (newPlayers.length === 0) return;

    var wrap = document.getElementById('new-notice-wrap');
    var names = newPlayers.map(function(r){
        return r.player.flag + ' ' + r.player.name;
    }).join(' / ');

    wrap.innerHTML =
        '<div class="new-notice">' +
            '<span class="nn-icon">✨</span>新获得：' + names +
        '</div>';
}

function renderPullResults(results) {
    var box = document.getElementById('pull-results');
    var list = document.getElementById('pull-list');
    list.innerHTML = '';
    box.style.display = 'block';

    results.sort(function(a,b){
        return (RARITY_ORDER[b.player.rarity]||0) - (RARITY_ORDER[a.player.rarity]||0);
    });

    // 新球员提示
    showNewNotice(results);

    for (var i = 0; i < results.length; i++) {
        var r = results[i];
        var el = createPlayerCard(r.player, r.isNew);
        el.style.animationDelay = (i * 0.08) + 's';
        list.appendChild(el);
    }
}

// ============================================
// 4. 球员卡组件（抽卡结果 & 图鉴复用）
// ============================================
function createPlayerCard(player, isNew) {
    var card = document.createElement('div');
    card.className = 'player-card rarity-' + player.rarity;
    card.innerHTML =
        '<span class="pc-rar-tag ' + player.rarity + '">' + player.rarity + '</span>' +
        '<div class="pc-flag">' + player.flag + '</div>' +
        '<div class="pc-name">' + player.name + '</div>' +
        '<div class="pc-pos">' + player.position + '</div>' +
        '<div class="pc-ovr">' + player.ovr + '</div>' +
        (isNew !== undefined ? '<span class="pc-status ' + (isNew ? 'new' : 'dup') + '">' + (isNew ? 'NEW' : 'DUP') + '</span>' : '');
    return card;
}

function createEmptyCard() {
    var card = document.createElement('div');
    card.className = 'player-card empty';
    card.innerHTML = '<div class="qmark">?</div><div class="empty-text">未获得</div>';
    return card;
}

var invCountry = '葡萄牙';

function renderInventory() {
    document.getElementById('inv-num').textContent = totalOwned() + ' / ' + PLAYERS.length;

    var filter = document.getElementById('country-filter');
    filter.innerHTML = '';
    for (var i = 0; i < COUNTRIES.length; i++) {
        var btn = document.createElement('button');
        btn.className = 'country-btn' + (invCountry === COUNTRIES[i].name ? ' active' : '');
        btn.textContent = COUNTRIES[i].flag + ' ' + COUNTRIES[i].name;
        btn.onclick = (function(c){ return function(){ invCountry = c; renderInventory(); }; })(COUNTRIES[i].name);
        filter.appendChild(btn);
    }

    var grid = document.getElementById('inv-grid');
    grid.innerHTML = '';

    var players = PLAYERS.filter(function(p){ return p.team === invCountry; });
    players.sort(function(a,b){
        var d = (RARITY_ORDER[b.rarity]||0) - (RARITY_ORDER[a.rarity]||0);
        if (d !== 0) return d;
        return b.ovr - a.ovr;
    });

    for (var j = 0; j < players.length; j++) {
        var p = players[j];
        if (isOwned(p.id)) {
            grid.appendChild(createPlayerCard(p));
        } else {
            grid.appendChild(createEmptyCard());
        }
    }
}

// 风险类型对应的中文和基础概率
var RISK_CONFIG = {
    safe:       {label:'稳健', myGoalBase:0.18, oppGoalBase:0.10},
    balanced:   {label:'平衡', myGoalBase:0.28, oppGoalBase:0.22},
    aggressive: {label:'冒险', myGoalBase:0.38, oppGoalBase:0.32}
};

var match = {
    active:false, eventIdx:0, myScore:0, oppScore:0,
    myTeam:'', oppTeam:'', myFlag:'', oppFlag:'',
    myOvr:0, oppOvr:0, myLineup:[], oppLineup:[],
    events:[]  // 本场抽到的3个事件
};

// 随机抽3个事件，分配分钟
function rollMatchEvents() {
    var pool = EVENT_POOL.slice();
    // 洗牌
    for (var i = pool.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    var picked = pool.slice(0, 3);
    // 分配分钟：23±2, 58±2, 82±2
    var baseMinutes = [23, 58, 82];
    for (var k = 0; k < picked.length; k++) {
        picked[k].minute = baseMinutes[k] + Math.floor(Math.random() * 5) - 2;
        if (picked[k].minute < 1) picked[k].minute = 1;
        if (picked[k].minute > 89) picked[k].minute = 89;
    }
    // 按分钟排序
    picked.sort(function(a,b){ return a.minute - b.minute; });
    return picked;
}

// 按位置从阵容中选球员（OVR加权）
function pickPlayerByPos(lineup, pos, flag) {
    var candidates = lineup.filter(function(p){ return p.position === pos; });
    if (candidates.length === 0) {
        // 该位置无人，用全场最高OVR
        candidates = lineup.slice().sort(function(a,b){ return b.ovr - a.ovr; });
    }
    if (candidates.length === 0) return {name:'球员',ovr:70,position:pos,flag:flag};

    // OVR加权随机
    var total = 0;
    for (var i = 0; i < candidates.length; i++) total += candidates[i].ovr;
    var rand = Math.random() * total;
    var cum = 0;
    for (var j = 0; j < candidates.length; j++) {
        cum += candidates[j].ovr;
        if (rand <= cum) return candidates[j];
    }
    return candidates[candidates.length - 1];
}

// 生成对手阵容（虚拟数据）
function generateOppLineup(oppTeam, oppFlag, avgOvr) {
    var positions = ['GK','DF','DF','DF','DF','MF','MF','MF','FW','FW','FW'];
    var names = ['球员A','球员B','球员C','球员D','球员E','球员F','球员G','球员H','球员I','球员J','球员K'];
    var lineup = [];
    for (var i = 0; i < 11; i++) {
        lineup.push({
            name: oppTeam + names[i],
            position: positions[i],
            ovr: avgOvr + Math.floor(Math.random() * 10) - 5,
            flag: oppFlag
        });
    }
    return lineup;
}

function renderMatch() {
    var selectDiv = document.getElementById('match-select');
    var arena = document.getElementById('match-arena');
    selectDiv.style.display = 'block';
    arena.classList.remove('active');

    var list = document.getElementById('team-list');
    list.innerHTML = '';
    for (var i = 0; i < COUNTRIES.length; i++) {
        var c = COUNTRIES[i];
        var cnt = ownedCount(c.name);
        var ready = cnt >= 11;
        var ovr = getTeamOVR(c.name);
        var entry = document.createElement('div');
        entry.className = 'team-entry';
        entry.innerHTML =
            '<div class="tflag">' + c.flag + '</div>' +
            '<div class="tinfo">' +
                '<div class="tname">' + c.name + '</div>' +
                '<div class="tcount">已收集 ' + cnt + '/11</div>' +
                (ovr > 0 ? '<div class="tovr">平均 OVR ' + ovr + '</div>' : '') +
                '<div class="tstatus ' + (ready ? 'ready' : 'locked') + '">' + (ready ? '✅ 可出征' : '🔒 需11人') + '</div>' +
            '</div>' +
            '<button class="deploy-btn ' + (ready ? 'ready' : 'locked') + '" ' + (ready ? '' : 'disabled') + '>出征</button>';

        if (ready) {
            (function(name, flag) {
                entry.querySelector('.deploy-btn').onclick = function() { startMatch(name, flag); };
            })(c.name, c.flag);
        }
        list.appendChild(entry);
    }
}

function startMatch(team, flag) {
    // 我方阵容
    var ownedPlayers = PLAYERS.filter(function(p){ return p.team === team && isOwned(p.id); });
    ownedPlayers.sort(function(a,b){ return b.ovr - a.ovr; });
    match.myLineup = ownedPlayers.slice(0, 11);

    var total = 0;
    for (var i = 0; i < match.myLineup.length; i++) total += match.myLineup[i].ovr;
    match.myOvr = Math.round(total / match.myLineup.length);

    // 对手
    var opp = COUNTRIES.filter(function(c){ return c.name !== team; })[0];
    match.oppTeam = opp.name;
    match.oppFlag = opp.flag;
    match.oppOvr = 55 + Math.floor(Math.random() * 30);
    match.oppLineup = generateOppLineup(opp.name, opp.flag, match.oppOvr);

    // 抽事件
    match.events = rollMatchEvents();
    match.eventIdx = 0;
    match.myScore = 0;
    match.oppScore = 0;
    match.myTeam = team;
    match.myFlag = flag;
    match.active = true;

    // 切换视图
    document.getElementById('match-select').style.display = 'none';
    document.getElementById('match-arena').classList.add('active');

    document.getElementById('m-flag').textContent = match.myFlag;
    document.getElementById('m-name').textContent = match.myTeam;
    document.getElementById('o-flag').textContent = match.oppFlag;
    document.getElementById('o-name').textContent = match.oppTeam;
    document.getElementById('m-score').textContent = '0 - 0';
    document.getElementById('el-list').innerHTML = '';
    document.getElementById('match-result').classList.remove('show');
    document.getElementById('match-event').style.display = 'none';

    showKeyEvent();
}

function showKeyEvent() {
    if (match.eventIdx >= match.events.length) {
        endMatch();
        return;
    }

    var evt = match.events[match.eventIdx];
    document.getElementById('m-minute').textContent = evt.minute + "'";
    document.getElementById('tp-minute').textContent = evt.minute + "'";
    document.getElementById('tp-title').textContent = evt.title;
    document.getElementById('tp-desc').textContent = evt.desc;

    // 生成战术卡片
    var cardsContainer = document.getElementById('tactic-cards');
    cardsContainer.innerHTML = '';

    for (var i = 0; i < evt.options.length; i++) {
        var opt = evt.options[i];
        var myPlayer = pickPlayerByPos(match.myLineup, opt.myPos, match.myFlag);
        var oppPlayer = pickPlayerByPos(match.oppLineup, opt.oppPos, match.oppFlag);

        var card = document.createElement('button');
        card.className = 'tactic-card risk-' + opt.risk;
        card.innerHTML =
            '<div class="tc-top">' +
                '<span class="tc-name">' + opt.name + '</span>' +
                '<span class="tc-risk-tag ' + opt.risk + '">' + RISK_CONFIG[opt.risk].label + '</span>' +
            '</div>' +
            '<div class="tc-desc">' + opt.desc + '</div>' +
            '<div class="tc-matchup">' +
                '<div class="tc-player-mini me">' +
                    '<span class="pm-flag">' + (myPlayer.flag || match.myFlag) + '</span>' +
                    '<span class="pm-pos">' + opt.myPos + '</span>' +
                    '<span class="pm-name">' + (myPlayer.name || '') + '</span>' +
                    '<span class="pm-ovr">' + (myPlayer.ovr || 70) + '</span>' +
                '</div>' +
                '<span class="tc-vs">VS</span>' +
                '<div class="tc-player-mini opp">' +
                    '<span class="pm-flag">' + (oppPlayer.flag || match.oppFlag) + '</span>' +
                    '<span class="pm-pos">' + opt.oppPos + '</span>' +
                    '<span class="pm-name">' + (oppPlayer.name || '') + '</span>' +
                    '<span class="pm-ovr">' + (oppPlayer.ovr || 70) + '</span>' +
                '</div>' +
            '</div>';

        (function(option, myP, oppP) {
            card.onclick = function() { selectTactic(option, myP, oppP); };
        })(opt, myPlayer, oppPlayer);

        cardsContainer.appendChild(card);
    }

    document.getElementById('tactic-panel').style.display = 'block';
    document.getElementById('match-event').style.display = 'none';
}

function selectTactic(option, myPlayer, oppPlayer) {
    // 禁用所有卡片
    var cards = document.querySelectorAll('.tactic-card');
    for (var i = 0; i < cards.length; i++) {
        cards[i].disabled = true;
        cards[i].style.opacity = '0.4';
    }
    document.getElementById('tactic-panel').style.display = 'none';

    var evt = match.events[match.eventIdx];
    var result = resolveEvent(option, myPlayer, oppPlayer);

    match.myScore += result.myGoals;
    match.oppScore += result.oppGoals;

    // 事件文案
    var evtText = generateEventText(result, myPlayer, oppPlayer);
    var logText = evt.minute + "' " + evt.title + '｜' + evtText + '｜' +
        myPlayer.name + ' 对位 ' + oppPlayer.name + '｜比分 ' + match.myScore + ':' + match.oppScore;

    // 更新比分牌
    document.getElementById('m-score').textContent = match.myScore + ' - ' + match.oppScore;

    // 事件反馈
    var evtDiv = document.getElementById('match-event');
    var type = 'neutral';
    if (result.myGoals > 0 && result.oppGoals === 0) type = 'goal';
    else if (result.myGoals === 0 && result.oppGoals > 0) type = 'lose';
    evtDiv.className = 'match-event ' + type;
    evtDiv.textContent = evt.minute + "' " + evtText;
    evtDiv.style.display = 'block';

    // 事件日志
    var elItem = document.createElement('div');
    elItem.className = 'el-item';
    elItem.textContent = logText;
    document.getElementById('el-list').appendChild(elItem);

    match.eventIdx++;
    setTimeout(function() { showKeyEvent(); }, 2500);
}

function resolveEvent(option, myPlayer, oppPlayer) {
    var cfg = RISK_CONFIG[option.risk];
    var myProb = cfg.myGoalBase;
    var oppProb = cfg.oppGoalBase;

    // OVR差值影响
    var ovrDiff = (myPlayer.ovr || 70) - (oppPlayer.ovr || 70);
    myProb += ovrDiff * 0.004;
    oppProb -= ovrDiff * 0.003;

    // 比分态势：落后追分 / 领先反扑
    if (match.myScore < match.oppScore) {
        myProb += 0.05; // 落后追分
    } else if (match.myScore > match.oppScore) {
        oppProb += 0.04; // 领先后对方反扑
    }

    myProb = Math.max(0.05, Math.min(0.70, myProb));
    oppProb = Math.max(0.05, Math.min(0.55, oppProb));

    var myGoals = Math.random() < myProb ? 1 : 0;
    var oppGoals = Math.random() < oppProb ? 1 : 0;

    // 冒险额外概率：双进或双不进
    if (option.risk === 'aggressive' && Math.random() < 0.12) {
        if (myGoals === 0) myGoals = 1;
        else myGoals = 2;
    }

    return {myGoals:myGoals, oppGoals:oppGoals};
}

function generateEventText(result, myPlayer, oppPlayer) {
    if (result.myGoals > 0 && result.oppGoals === 0) {
        if (result.myGoals >= 2) return '我方连入两球！' + myPlayer.name + ' 状态火热';
        var texts = [
            '我方攻入一球！' + myPlayer.name + ' 完成破门',
            myPlayer.name + ' 抓住机会得分',
            myPlayer.name + ' 射门建功，比分改写'
        ];
        return texts[Math.floor(Math.random()*texts.length)];
    }
    if (result.myGoals === 0 && result.oppGoals > 0) {
        var loseTexts = [
            '对方攻入一球，' + oppPlayer.name + ' 突破防线',
            '对方连入一球，防线出现漏洞',
            oppPlayer.name + ' 反击得手'
        ];
        return loseTexts[Math.floor(Math.random()*loseTexts.length)];
    }
    if (result.myGoals > 0 && result.oppGoals > 0) {
        return '双方各入一球，对攻激烈';
    }
    var noGoal = [
        '攻防化解，比分未变',
        myPlayer.name + ' 与 ' + oppPlayer.name + ' 对抗后球权转换',
        '防守成功，本回合无进球'
    ];
    return noGoal[Math.floor(Math.random()*noGoal.length)];
}

function endMatch() {
    document.getElementById('tactic-panel').style.display = 'none';
    document.getElementById('match-event').style.display = 'none';

    var myScore = match.myScore;
    var oppScore = match.oppScore;
    var win = myScore > oppScore;
    var draw = myScore === oppScore;

    if (draw) {
        var penaltyWin = Math.random() < 0.5 + (match.myOvr - match.oppOvr) * 0.01;
        win = penaltyWin;
        var elItem = document.createElement('div');
        elItem.className = 'el-item';
        elItem.textContent = "90' 点球大战！" + (penaltyWin ? match.myTeam : match.oppTeam) + ' 获胜';
        document.getElementById('el-list').appendChild(elItem);
    }

    // 比赛奖励
    var reward = win ? 200 : 80;
    data.pts += reward;
    saveData();
    renderPTS();

    var resultDiv = document.getElementById('match-result');
    resultDiv.classList.add('show');
    resultDiv.innerHTML =
        '<div class="result-icon">' + (win ? '🎉' : '💔') + '</div>' +
        '<div class="result-title" style="color:' + (win ? '#228b22' : '#dc2626') + '">' + (win ? '胜利！' : '失败') + '</div>' +
        '<div class="result-score">' + myScore + ' - ' + oppScore + '</div>' +
        '<div class="result-msg">' +
            (draw ? '（点球决胜）' : '') +
            (win ? match.myTeam + ' 赢下比赛！' : match.oppTeam + ' 赢下比赛') +
        '</div>' +
        '<div class="result-reward">💰 奖励 ' + reward + ' PTS</div>' +
        '<br><button class="result-btn" onclick="exitMatch()">返回出征</button>';

    match.active = false;
}

function exitMatch() {
    document.getElementById('match-arena').classList.remove('active');
    document.getElementById('match-select').style.display = 'block';
    renderMatch();
}

function switchTab(name) {
    var pages = document.querySelectorAll('.page');
    for (var i = 0; i < pages.length; i++) pages[i].classList.remove('active');
    document.getElementById('page-' + name).classList.add('active');

    var navs = document.querySelectorAll('.nav-btn');
    for (var j = 0; j < navs.length; j++) navs[j].classList.remove('active');
    document.querySelectorAll('.nav-btn')[{'gacha':0,'inventory':1,'match':2}[name]].classList.add('active');

    if (name === 'inventory') renderInventory();
    if (name === 'match') renderMatch();
}

function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2000);
}
