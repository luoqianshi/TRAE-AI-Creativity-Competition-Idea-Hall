<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>孙文浩 - 交互式简历游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #1a1a2e; }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #2d1b4e 0%, #4a2c6a 30%, #6b3d8a 60%, #8b4d9a 100%);
            overflow: hidden;
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
        }
        .control-btn {
            width: 60px;
            height: 60px;
            background: rgba(139, 77, 154, 0.6);
            border: 3px solid #c9a0dc;
            border-radius: 50%;
            color: #ffd700;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            user-select: none;
            touch-action: manipulation;
            transition: transform 0.1s;
            box-shadow: 0 0 10px rgba(201, 160, 220, 0.5);
        }
        .control-btn:active { transform: scale(0.95); }
        .jump-btn { width: 70px; height: 70px; font-size: 28px; background: rgba(255, 215, 0, 0.3); border-color: #ffd700; }
        #music-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background: rgba(139, 77, 154, 0.7);
            border: 2px solid #ffd700;
            border-radius: 50%;
            color: #ffd700;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 60;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }
        #music-btn:hover { transform: scale(1.1); box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }
        #music-btn.muted { background: rgba(100, 50, 80, 0.7); border-color: #8b6a8a; color: #8b6a8a; }
        #game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(45, 27, 78, 0.95) 0%, rgba(26, 26, 46, 0.98) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #start-screen { text-align: center; color: white; }
        #start-screen h1 {
            font-family: 'Courier New', monospace;
            font-size: 3rem;
            margin-bottom: 10px;
            color: #c9a0dc;
            text-shadow: 3px 3px 0 #8b4d9a, -3px -3px 0 #ffd700;
            animation: pulse 1.5s infinite;
            letter-spacing: 4px;
        }
        #start-screen p { font-family: 'Courier New', monospace; font-size: 1.2rem; margin-bottom: 30px; color: #c9a0dc; }
        #start-btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #8b4d9a 0%, #6b3d8a 50%, #4a2c6a 100%);
            border: 3px solid #ffd700;
            border-radius: 8px;
            color: #ffd700;
            cursor: pointer;
            box-shadow: 0 4px 0 #4a2c6a;
            letter-spacing: 2px;
        }
        #start-btn:hover { transform: translateY(-2px); }
        #start-btn:active { transform: translateY(2px); }
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(45, 27, 78, 0.9) 0%, rgba(26, 26, 46, 0.95) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        .modal.hidden { display: none; }
        .modal-content {
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 50%, #f0f0f0 100%);
            border-radius: 12px;
            padding: 30px;
            max-width: 80%;
            max-height: 80%;
            overflow-y: auto;
            box-shadow: 0 0 0 4px #8b4d9a, 0 0 0 8px #ffd700, 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .scroll-header { text-align: center; margin-bottom: 20px; }
        .scroll-header h2 {
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            color: #4a2c6a;
            margin: 10px 0;
            text-shadow: 1px 1px 0 rgba(255, 215, 0, 0.5);
        }
        .scroll-decoration {
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #ffd700, #8b4d9a, #ffd700, transparent);
            margin: 5px 0;
        }
        .scroll-body { font-family: 'Courier New', monospace; color: #2d1b4e; font-size: 0.95rem; line-height: 1.6; padding: 0 10px; }
        .scroll-body p { margin: 10px 0; }
        .scroll-body ul { list-style: none; padding-left: 15px; }
        .scroll-body li { position: relative; margin: 8px 0; padding-left: 20px; }
        .scroll-body li::before { content: '♦'; position: absolute; left: 0; color: #8b4d9a; }
        .scroll-footer { text-align: center; margin-top: 25px; }
        #continue-btn, #restart-btn {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #8b4d9a 0%, #6b3d8a 50%, #4a2c6a 100%);
            border: 3px solid #ffd700;
            border-radius: 6px;
            color: #ffd700;
            cursor: pointer;
            box-shadow: 0 3px 0 #4a2c6a;
        }
        .win-content { text-align: center; }
        .win-header h2 {
            font-family: 'Courier New', monospace;
            font-size: 2rem;
            color: #8b4d9a;
            text-shadow: 2px 2px 0 #ffd700;
            margin-bottom: 20px;
        }
        .win-body p { font-family: 'Courier New', monospace; font-size: 1.2rem; color: #4a2c6a; margin-bottom: 20px; }
        .contact-info p { font-size: 1rem; margin: 8px 0; color: #6b3d8a; }
        #collectibles-hint {
            position: absolute;
            top: 20px;
            left: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #ffd700;
            background: rgba(45, 27, 78, 0.8);
            padding: 8px 15px;
            border-radius: 4px;
            border: 2px solid #8b4d9a;
            z-index: 50;
        }
        #collect-count { font-weight: bold; color: #ffd700; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
        @media (min-width: 768px) { #controls { display: none; } .modal-content { max-width: 600px; } #start-screen h1 { font-size: 4rem; } }
        @media (max-width: 480px) {
            #start-screen h1 { font-size: 2rem; }
            .control-btn { width: 75px; height: 75px; font-size: 30px; }
            .jump-btn { width: 90px; height: 90px; font-size: 36px; }
            #music-btn { width: 57px; height: 57px; font-size: 21px; }
            #controls { bottom: 40px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="controls">
            <div id="left-btn" class="control-btn">◀</div>
            <div id="right-btn" class="control-btn">▶</div>
            <div id="jump-btn" class="control-btn jump-btn">⬆</div>
        </div>
        <button id="music-btn" type="button">🔇</button>
        <audio id="bgm-audio" loop>
            <source src="https://music.163.com/song/media/outer/url?id=449578101.mp3" type="audio/mpeg">
        </audio>
        <div id="game-overlay">
            <div id="start-screen">
                <h1>像素勇者冒险</h1>
                <p>交互式个人简历</p>
                <button id="start-btn" type="button">开始冒险</button>
            </div>
        </div>
        <div id="resume-modal" class="modal hidden">
            <div class="modal-content">
                <div class="scroll-header">
                    <div class="scroll-decoration"></div>
                    <h2 id="modal-title">标题</h2>
                    <div class="scroll-decoration"></div>
                </div>
                <div class="scroll-body"><div id="modal-content"></div></div>
                <div class="scroll-footer"><button id="continue-btn" type="button">继续冒险</button></div>
            </div>
        </div>
        <div id="win-modal" class="modal hidden">
            <div class="modal-content win-content">
                <div class="win-header"><h2>🎉 冒险完成！🎉</h2></div>
                <div class="win-body">
                    <p>冒险只是开始，期待加入您的团队！</p>
                    <div class="contact-info">
                        <p>📧 邮箱：1844877460@qq.com</p>
                        <p>📱 电话：13338021188</p>
                    </div>
                </div>
                <div class="scroll-footer"><button id="restart-btn" type="button">重新冒险</button></div>
            </div>
        </div>
        <div id="collectibles-hint"><p>收集进度: <span id="collect-count">0</span>/6</p></div>
    </div>

    <script>
    (function() {
        'use strict';

        var canvas = document.getElementById('game-canvas');
        var ctx = canvas.getContext('2d');

        var TILE_SIZE = 32;
        var VIEWPORT_WIDTH = 30;
        var VIEWPORT_HEIGHT = 18;

        canvas.width = VIEWPORT_WIDTH * TILE_SIZE;
        canvas.height = VIEWPORT_HEIGHT * TILE_SIZE;

        var gameRunning = false;
        var gamePaused = false;
        var cameraX = 0;
        var collectCount = 0;
        var gameWon = false;

        var bgmAudio = null;
        var isMusicPlaying = false;
        var audioCtx = null;

        var resumeData = [
            {
                title: '【智慧卷轴：勇者的起源】',
                content: '<p><strong>📚 教育背景</strong></p>' +
                         '<p>苏州大学 (211) 硕士 (2024.09至今)</p>' +
                         '<br><p><strong>👤 自我评价</strong></p>' +
                         '<p>热爱探索新事物，拥有强大的学习能力和AI工具驾驭能力。数据驱动思维，具备敏锐的商业洞察力和全球化视野。</p>'
            },
            {
                title: '【神器背包：勇者的武器库】',
                content: '<p><strong>🎯 核心技能</strong></p>' +
                         '<ul>' +
                         '<li>数据驱动能力：精通 Excel (透视表/VLOOKUP/函数)、SQL (基础查询与聚合)、Xmind</li>' +
                         '<li>商业化敏感度：熟悉电商/展会场景下的用户转化链路，全流程运营经验</li>' +
                         '<li>全球化视野：独立走访亚非欧13国40+城市，沟通能力极强</li>' +
                         '<li>Vibecoding 实践者：熟练使用 AI 工具提升工作效率</li>' +
                         '</ul>'
            },
            {
                title: '【战利品一：得物策略运营】',
                content: '<p><strong>⚔️ 得物 (Poizon)</strong> · 中台策略运营 · 2026.3-2026.5</p>' +
                         '<p>负责NPS体验治理与归因分析，推动跨部门协同优化，主导商品知识库建设，新增6万多条保养贴士。</p>'
            },
            {
                title: '【战利品二：贵金属治理项目】',
                content: '<p><strong>💎 得物贵金属治理专项</strong></p>' +
                         '<p><strong>问题背景</strong>：贵金属克重不足问题严重，且商家前置退差比例低，平台治理规则细碎散乱，各种条款未拉齐，细节场景未理清。</p>' +
                         '<br><p><strong>工具</strong>：MySQL、Excel、数据看板平台</p>' +
                         '<br><p><strong>数据准备</strong></p>' +
                         '<p>通过MySQL从公司数据库拉取贵金属补差数据，发现克重不足问题严重，普遍超过国家规定0.01g，最高克差达8g，平台补差退款比例达24.5%，严重影响贵金属NPS与舆情指标。</p>' +
                         '<br><p><strong>规则讨论</strong></p>' +
                         '<p>调研竞对平台头部商家保障规则，发现竞对对此治理力度仅细分到0.05g，细分程度依旧不足。基于数据初步拟定治理细则：克重差问题细化场景及标准，带钻商品的克差问题，银饰"只换不修"退货问题。联动各部门完成规则探讨，如克差分层处置分为描述不符场景、证书错发场景、质量场景，克重细分至0.1g、0.3g，足银"只换不修"克差保障标准优化（"原克重"换新，"回收价"补差退款），预计覆盖订单量5.3w单/月。</p>' +
                         '<br><p><strong>数据持续监控</strong></p>' +
                         '<p>规则制定完成，公示并落实后对相关数据进行监控。贵金属平台补差退款比例下降至16.8%，克重问题NPS贬损下降6.38pt（15.69%→9.3%），占季度业绩重点部分。</p>'
            },
            {
                title: '【战利品三：蔚来区域运营】',
                content: '<p><strong>⚔️ 蔚来汽车 (NIO)</strong> · 区域业务运营 · 2025.6-2025.9</p>' +
                         '<p>基于数据分析制定运营策略，推动取消过程性考核后订单锁定数量增长超1000单；设计差异化复购策略，拉升苏州区域复购率4个百分点。</p>'
            },
            {
                title: '【世界地图：行万里路】',
                content: '<p><strong>🌍 旅行事迹</strong></p>' +
                         '<p>曾独自背包跨越亚非欧13个国家、40+座城市，从繁华的都市到宁静的小镇，从沙漠绿洲到雪山之巅。</p>' +
                         '<br><p>这段旅程赋予了我：</p>' +
                         '<ul>' +
                         '<li>极强的适应能力：快速融入不同文化环境</li>' +
                         '<li>开阔的视野：理解世界的多样性</li>' +
                         '<li>出色的沟通能力：与不同背景的人交流</li>' +
                         '<li>独立解决问题的能力：应对旅途中的各种挑战</li>' +
                         '</ul>'
            }
        ];

        var player = {
            x: 5 * TILE_SIZE,
            y: 12 * TILE_SIZE,
            width: TILE_SIZE,
            height: 46,
            velocityX: 0,
            velocityY: 0,
            speed: 6,
            jumpForce: -12,
            gravity: 0.6,
            isOnGround: false,
            facingRight: true,
            frame: 0,
            frameTimer: 0,
            jumpCount: 0,
            maxJumps: 2,
            scale: 1.0,
            health: 5,
            maxHealth: 5,
            isInvincible: false,
            invincibleTimer: 0,
            hurtFlash: 0,
            lastStepTime: 0
        };

        var keys = { left: false, right: false, jump: false };
        var platforms = [];
        var collectibles = [];
        var enemies = [];
        var clouds = [];
        var mountains = [];

        function initLevel() {
            platforms.length = 0;
            collectibles.length = 0;
            enemies.length = 0;
            clouds.length = 0;
            mountains.length = 0;

            for (var x = 0; x < 400; x++) {
                platforms.push({ x: x * TILE_SIZE, y: 15 * TILE_SIZE, width: TILE_SIZE, height: TILE_SIZE * 3 });
            }

            var platData = [
                [25,13,4],[35,11,3],[45,13,5],
                [60,12,4],[70,10,3],[80,12,6],
                [95,13,4],[105,11,3],[115,13,5],[125,10,4],[135,12,6],
                [150,13,4],[165,11,5],[180,13,4],[195,10,6],
                [215,12,4],[230,14,5],[245,11,4],[260,13,6],
                [280,12,5],[295,10,4],[310,12,6],
                [330,12,5],[350,11,4],[365,13,6]
            ];
            for (var i = 0; i < platData.length; i++) {
                var p = platData[i];
                platforms.push({ x: p[0]*TILE_SIZE, y: p[1]*TILE_SIZE, width: p[2]*TILE_SIZE, height: TILE_SIZE });
            }

            var colData = [
                {x:30,y:9,type:0},
                {x:75,y:7,type:1},
                {x:115,y:9,type:2},
                {x:165,y:7,type:3},
                {x:240,y:8,type:4},
                {x:320,y:7,type:5}
            ];
            for (var j = 0; j < colData.length; j++) {
                var c = colData[j];
                collectibles.push({
                    x: c.x*TILE_SIZE,
                    y: c.y*TILE_SIZE,
                    width: TILE_SIZE,
                    height: TILE_SIZE,
                    collected: false,
                    triggered: false,
                    type: c.type,
                    color: '#ffd700'
                });
            }

            var eneData = [
                {x:110,y:14,sx:110,ex:120,speed:2},
                {x:120,y:14,sx:115,ex:125,speed:1.5},
                {x:135,y:11,sx:135,ex:145,speed:2},
                {x:230,y:11,sx:225,ex:240,speed:2.5}
            ];
            for (var k = 0; k < eneData.length; k++) {
                var e = eneData[k];
                enemies.push({ x: e.x*TILE_SIZE, y: e.y*TILE_SIZE, width: TILE_SIZE, height: TILE_SIZE, speed: e.speed, direction: 1, startX: e.sx*TILE_SIZE, endX: e.ex*TILE_SIZE });
            }

            for (var m = 0; m < 18; m++) {
                clouds.push({ x: m*700 + Math.random()*200, y: 50 + Math.random()*150, width: 120 + Math.random()*100, height: 50 + Math.random()*40 });
            }
            for (var n = 0; n < 25; n++) {
                mountains.push({ x: n*250 + Math.random()*100, y: 500, height: 200 + Math.random()*100, width: 250 + Math.random()*100 });
            }
        }

        function drawPixelRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
        }

        function drawPlayer() {
            var px = player.x - cameraX;
            var py = player.y;
            var pw = player.width * player.scale;
            var ph = player.height * player.scale;

            player.frameTimer++;
            if (player.frameTimer > 10) {
                player.frame = (player.frame + 1) % 4;
                player.frameTimer = 0;
            }

            ctx.save();

            if (!player.facingRight) {
                ctx.translate(px + pw, py);
                ctx.scale(-1, 1);
                ctx.translate(-px, -py);
            }

            if (player.hurtFlash > 0) {
                player.hurtFlash--;
                if (Math.floor(player.hurtFlash / 3) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }
            }

            drawPixelRect(px + 6 * player.scale, py, 20 * player.scale, 4 * player.scale, '#d4a574');
            drawPixelRect(px + 4 * player.scale, py + 2 * player.scale, 4 * player.scale, 4 * player.scale, '#d4a574');
            drawPixelRect(px + 24 * player.scale, py + 2 * player.scale, 4 * player.scale, 4 * player.scale, '#d4a574');
            drawPixelRect(px + 8 * player.scale, py + 4 * player.scale, 16 * player.scale, 4 * player.scale, '#e8c39e');
            drawPixelRect(px + 8 * player.scale, py + 6 * player.scale, 16 * player.scale, 14 * player.scale, '#ffeaa7');
            drawPixelRect(px + 6 * player.scale, py + 10 * player.scale, 10 * player.scale, 5 * player.scale, '#1a1a2e');
            drawPixelRect(px + 18 * player.scale, py + 10 * player.scale, 10 * player.scale, 5 * player.scale, '#1a1a2e');
            drawPixelRect(px + 16 * player.scale, py + 11 * player.scale, 2 * player.scale, 3 * player.scale, '#1a1a2e');
            drawPixelRect(px + 9 * player.scale, py + 12 * player.scale, 4 * player.scale, 3 * player.scale, '#2d3436');
            drawPixelRect(px + 21 * player.scale, py + 12 * player.scale, 4 * player.scale, 3 * player.scale, '#2d3436');
            drawPixelRect(px + 14 * player.scale, py + 18 * player.scale, 4 * player.scale, 2 * player.scale, '#d4a574');
            drawPixelRect(px + 10 * player.scale, py + 20 * player.scale, 12 * player.scale, 8 * player.scale, '#ffffff');
            drawPixelRect(px + 8 * player.scale, py + 22 * player.scale, 4 * player.scale, 16 * player.scale, '#4a2c6a');
            drawPixelRect(px + 20 * player.scale, py + 22 * player.scale, 4 * player.scale, 16 * player.scale, '#4a2c6a');
            drawPixelRect(px + 6 * player.scale, py + 24 * player.scale, 2 * player.scale, 12 * player.scale, '#4a2c6a');
            drawPixelRect(px + 24 * player.scale, py + 24 * player.scale, 2 * player.scale, 12 * player.scale, '#4a2c6a');
            drawPixelRect(px + 14 * player.scale, py + 22 * player.scale, 4 * player.scale, 2 * player.scale, '#2d1b4e');
            drawPixelRect(px + 13 * player.scale, py + 24 * player.scale, 6 * player.scale, 8 * player.scale, '#2d1b4e');
            drawPixelRect(px + 14 * player.scale, py + 32 * player.scale, 4 * player.scale, 2 * player.scale, '#2d1b4e');

            var armSwing = player.velocityX !== 0 ? Math.sin(player.frameTimer * 0.8) * 2 : 0;
            drawPixelRect(px + 2 * player.scale, py + 24 * player.scale + armSwing, 4 * player.scale, 10 * player.scale, '#4a2c6a');
            drawPixelRect(px + 26 * player.scale, py + 24 * player.scale - armSwing, 4 * player.scale, 10 * player.scale, '#4a2c6a');
            drawPixelRect(px + 2 * player.scale, py + 32 * player.scale + armSwing, 4 * player.scale, 4 * player.scale, '#ffeaa7');
            drawPixelRect(px + 26 * player.scale, py + 32 * player.scale - armSwing, 4 * player.scale, 4 * player.scale, '#ffeaa7');

            var legOffset = player.velocityX !== 0 ? Math.sin(player.frameTimer * 0.8) * 3 : 0;
            drawPixelRect(px + 10 * player.scale, py + 36 * player.scale, 6 * player.scale, 8 * player.scale + legOffset, '#2d1b4e');
            drawPixelRect(px + 16 * player.scale, py + 36 * player.scale, 6 * player.scale, 8 * player.scale - legOffset, '#2d1b4e');
            drawPixelRect(px + 9 * player.scale, py + 42 * player.scale + legOffset, 8 * player.scale, 4 * player.scale, '#1a1a2e');
            drawPixelRect(px + 15 * player.scale, py + 42 * player.scale - legOffset, 8 * player.scale, 4 * player.scale, '#1a1a2e');

            ctx.restore();
        }

        function drawPlatform(p) {
            var px = p.x - cameraX;
            if (px < -TILE_SIZE || px > canvas.width + TILE_SIZE) return;

            drawPixelRect(px, p.y, p.width, p.height, '#4a2c6a');
            drawPixelRect(px, p.y, p.width, 4, '#ffd700');

            var tileCount = Math.floor(p.width / TILE_SIZE);
            for (var i = 0; i < tileCount; i++) {
                drawPixelRect(px + i * TILE_SIZE + 4, p.y + 8, 24, 4, '#6b3d8a');
                drawPixelRect(px + i * TILE_SIZE + 8, p.y + 12, 16, 4, '#8b4d9a');
            }
        }

        function drawCollectible(c) {
            var px = c.x - cameraX;
            if (px < -TILE_SIZE || px > canvas.width + TILE_SIZE) return;
            if (c.collected) return;

            var glow = Math.sin(Date.now() / 200) * 5;
            ctx.save();
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 15 + glow;

            drawPixelRect(px, c.y, c.width, c.height, '#4a2c6a');
            drawPixelRect(px + 4, c.y + 4, 24, 24, '#ffd700');
            drawPixelRect(px + 8, c.y + 8, 16, 16, '#ffffff');
            drawPixelRect(px + 12, c.y + 12, 8, 8, '#ffd700');

            ctx.restore();
        }

        function drawEnemy(e) {
            var px = e.x - cameraX;
            if (px < -TILE_SIZE || px > canvas.width + TILE_SIZE) return;
            if (e.y > 1000) return;

            drawPixelRect(px, e.y, e.width, e.height, '#e74c3c');
            drawPixelRect(px + 8, e.y + 8, 16, 16, '#c0392b');
            drawPixelRect(px + 4, e.y + 4, 8, 8, '#ffd700');
            drawPixelRect(px + 20, e.y + 4, 8, 8, '#ffd700');
            drawPixelRect(px + 8, e.y + 8, 4, 4, '#2d3436');
            drawPixelRect(px + 20, e.y + 8, 4, 4, '#2d3436');
            drawPixelRect(px + 4, e.y + 20, 8, 4, '#c9a0dc');
            drawPixelRect(px + 20, e.y + 20, 8, 4, '#c9a0dc');
        }

        function drawCloud(c) {
            var px = c.x - cameraX * 0.3;
            if (px < -c.width - 50 || px > canvas.width + 50) return;

            ctx.fillStyle = 'rgba(201, 160, 220, 0.6)';
            ctx.beginPath();
            ctx.arc(px + c.width * 0.3, c.y + c.height * 0.5, c.height * 0.4, 0, Math.PI * 2);
            ctx.arc(px + c.width * 0.5, c.y + c.height * 0.3, c.height * 0.5, 0, Math.PI * 2);
            ctx.arc(px + c.width * 0.7, c.y + c.height * 0.5, c.height * 0.4, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawMountain(m) {
            var px = m.x - cameraX * 0.5;
            if (px < -m.width - 50 || px > canvas.width + 50) return;

            var gradient = ctx.createLinearGradient(px, m.y, px, m.y - m.height);
            gradient.addColorStop(0, '#2d1b4e');
            gradient.addColorStop(0.5, '#4a2c6a');
            gradient.addColorStop(0.8, '#6b3d8a');
            gradient.addColorStop(1, '#c9a0dc');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(px, m.y);
            ctx.lineTo(px + m.width / 2, m.y - m.height);
            ctx.lineTo(px + m.width, m.y);
            ctx.closePath();
            ctx.fill();
        }

        function drawCastle() {
            var castleX = 380 * TILE_SIZE;
            var px = castleX - cameraX;
            if (px < -200 || px > canvas.width + 200) return;

            drawPixelRect(px - 60, 10 * TILE_SIZE, 280, 6 * TILE_SIZE, '#4a2c6a');
            drawPixelRect(px, 6 * TILE_SIZE, 80, 4 * TILE_SIZE, '#6b3d8a');
            drawPixelRect(px + 40, 2 * TILE_SIZE, 20, 4 * TILE_SIZE, '#8b4d9a');
            drawPixelRect(px + 30, 8 * TILE_SIZE, 20, 1 * TILE_SIZE, '#ffd700');
            drawPixelRect(px - 40, 7 * TILE_SIZE, 20, 4 * TILE_SIZE, '#6b3d8a');
            drawPixelRect(px + 100, 7 * TILE_SIZE, 20, 4 * TILE_SIZE, '#6b3d8a');
            drawPixelRect(px + 10, 4 * TILE_SIZE, 10, 3 * TILE_SIZE, '#8b4d9a');
            drawPixelRect(px + 60, 4 * TILE_SIZE, 10, 3 * TILE_SIZE, '#8b4d9a');
            drawPixelRect(px + 20, 5 * TILE_SIZE, 40, 1 * TILE_SIZE, '#ffd700');
            for (var i = 0; i < 5; i++) {
                drawPixelRect(px - 50 + i * 20, 6 * TILE_SIZE, 5, 5, '#c9a0dc');
                drawPixelRect(px + 75 + i * 20, 6 * TILE_SIZE, 5, 5, '#c9a0dc');
            }
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function updatePlayer() {
            var pw = player.width * player.scale;
            var ph = player.height * player.scale;

            if (keys.left) {
                player.velocityX = -player.speed;
                player.facingRight = false;
            } else if (keys.right) {
                player.velocityX = player.speed;
                player.facingRight = true;
            } else {
                player.velocityX *= 0.8;
            }

            if (keys.jump && player.jumpCount < player.maxJumps) {
                player.velocityY = player.jumpForce;
                player.jumpCount++;
                player.isOnGround = false;
                keys.jump = false;
                playSound('jump');
            }

            player.velocityY += player.gravity;

            var nextX = player.x + player.velocityX;
            var playerRect = { x: nextX, y: player.y, width: pw, height: ph };
            var canMoveX = true;

            for (var i = 0; i < platforms.length; i++) {
                var platform = platforms[i];
                if (checkCollision(playerRect, platform)) {
                    canMoveX = false;
                    if (player.velocityX > 0) {
                        nextX = platform.x - pw;
                    } else if (player.velocityX < 0) {
                        nextX = platform.x + platform.width;
                    }
                    player.velocityX = 0;
                    break;
                }
            }

            if (canMoveX) {
                player.x = nextX;
            } else {
                player.x = nextX;
            }

            var nextY = player.y + player.velocityY;
            playerRect = { x: player.x, y: nextY, width: pw, height: ph };
            player.isOnGround = false;

            var wasInAir = !player.isOnGround;
            
            for (var j = 0; j < platforms.length; j++) {
                var platform2 = platforms[j];
                if (checkCollision(playerRect, platform2)) {
                    if (player.velocityY > 0) {
                        nextY = platform2.y - ph;
                        player.velocityY = 0;
                        player.isOnGround = true;
                        player.jumpCount = 0;
                        if (wasInAir) {
                            playSound('land');
                        }
                    } else if (player.velocityY < 0) {
                        nextY = platform2.y + platform2.height;
                        player.velocityY = 0;
                    }
                    break;
                }
            }

            player.y = nextY;
            
            if (player.isOnGround && player.velocityX !== 0) {
                var now = Date.now();
                if (now - player.lastStepTime > 300) {
                    playSound('step');
                    player.lastStepTime = now;
                }
            }

            if (player.y > VIEWPORT_HEIGHT * TILE_SIZE) {
                player.x = 5 * TILE_SIZE;
                player.y = 12 * TILE_SIZE;
                player.velocityX = 0;
                player.velocityY = 0;
                player.jumpCount = 0;
            }

            if (player.x < 0) player.x = 0;
        }

        function updateEnemies() {
            for (var i = 0; i < enemies.length; i++) {
                var enemy = enemies[i];
                enemy.x += enemy.speed * enemy.direction;
                if (enemy.x <= enemy.startX || enemy.x >= enemy.endX - enemy.width) {
                    enemy.direction *= -1;
                }
            }
        }

        function checkEnemyCollision() {
            if (player.isInvincible) {
                player.invincibleTimer--;
                if (player.invincibleTimer <= 0) {
                    player.isInvincible = false;
                }
                return;
            }
            
            var pw = player.width * player.scale;
            var ph = player.height * player.scale;
            var playerRect = { x: player.x, y: player.y, width: pw, height: ph };

            for (var i = 0; i < enemies.length; i++) {
                var enemy = enemies[i];
                if (enemy.y > 1000) continue;
                if (checkCollision(playerRect, enemy)) {
                    if (player.velocityY > 0 && player.y + ph - player.velocityY <= enemy.y + 10) {
                        enemy.y = 2000;
                        player.velocityY = -8;
                    } else {
                        player.health--;
                        playSound('hurt');
                        player.isInvincible = true;
                        player.invincibleTimer = 60;
                        player.hurtFlash = 30;
                        
                        if (player.facingRight) {
                            player.velocityX = -15;
                        } else {
                            player.velocityX = 15;
                        }
                        player.velocityY = -10;
                        
                        if (player.health <= 0) {
                            player.x = 5 * TILE_SIZE;
                            player.y = 12 * TILE_SIZE;
                            player.health = player.maxHealth;
                        }
                    }
                }
            }
        }

        function checkCollectibleCollision() {
            var pw = player.width * player.scale;
            var ph = player.height * player.scale;
            var playerRect = { x: player.x, y: player.y, width: pw, height: ph };

            for (var i = 0; i < collectibles.length; i++) {
                var collectible = collectibles[i];
                if (!collectible.collected && !collectible.triggered && checkCollision(playerRect, collectible)) {
                    collectible.collected = true;
                    collectible.triggered = true;
                    collectCount++;
                    document.getElementById('collect-count').textContent = collectCount;
                    player.scale = Math.min(player.scale + 0.1, 2.5);
                    showResumeModal(collectible.type);
                }
            }
        }

        function checkWinCondition() {
            if (player.x >= 380 * TILE_SIZE - player.width && !gameWon) {
                gameWon = true;
                gameRunning = false;
                showWinModal();
            }
        }

        function updateCamera() {
            var targetX = player.x - canvas.width / 3;
            cameraX += (targetX - cameraX) * 0.1;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > 380 * TILE_SIZE - canvas.width) cameraX = 380 * TILE_SIZE - canvas.width;
        }

        function drawBackground() {
            var gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#2d1b4e');
            gradient.addColorStop(0.3, '#4a2c6a');
            gradient.addColorStop(0.6, '#6b3d8a');
            gradient.addColorStop(1, '#8b4d9a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (var i = 0; i < mountains.length; i++) drawMountain(mountains[i]);
            for (var j = 0; j < clouds.length; j++) drawCloud(clouds[j]);
        }

        function drawHealthBar() {
            var barWidth = 120;
            var barHeight = 12;
            var x = 20;
            var y = 20;
            
            ctx.fillStyle = '#333';
            ctx.fillRect(x, y, barWidth, barHeight);
            
            ctx.fillStyle = '#4a2c6a';
            ctx.fillRect(x + 2, y + 2, barWidth - 4, barHeight - 4);
            
            var healthPercent = player.health / player.maxHealth;
            var healthWidth = (barWidth - 4) * healthPercent;
            
            if (healthPercent > 0.5) {
                ctx.fillStyle = '#ffd700';
            } else if (healthPercent > 0.25) {
                ctx.fillStyle = '#ff9800';
            } else {
                ctx.fillStyle = '#e74c3c';
            }
            
            ctx.fillRect(x + 2, y + 2, healthWidth, barHeight - 4);
            
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, barWidth, barHeight);
            
            ctx.fillStyle = '#ffd700';
            ctx.font = '10px Courier New';
            ctx.fillText('HP', x + 4, y + barHeight + 12);
        }

        function draw() {
            drawBackground();
            for (var i = 0; i < platforms.length; i++) drawPlatform(platforms[i]);
            for (var j = 0; j < collectibles.length; j++) drawCollectible(collectibles[j]);
            for (var k = 0; k < enemies.length; k++) drawEnemy(enemies[k]);
            drawCastle();
            drawPlayer();
            drawHealthBar();
        }

        function gameLoop(timestamp) {
            if (!gameRunning || gamePaused) {
                draw();
                requestAnimationFrame(gameLoop);
                return;
            }

            updatePlayer();
            updateEnemies();
            checkEnemyCollision();
            checkCollectibleCollision();
            checkWinCondition();
            updateCamera();
            draw();

            requestAnimationFrame(gameLoop);
        }

        function showResumeModal(type) {
            gamePaused = true;
            var modal = document.getElementById('resume-modal');
            document.getElementById('modal-title').textContent = resumeData[type].title;
            document.getElementById('modal-content').innerHTML = resumeData[type].content;
            modal.classList.remove('hidden');
        }

        function showWinModal() {
            document.getElementById('win-modal').classList.remove('hidden');
        }

        function hideResumeModal() {
            document.getElementById('resume-modal').classList.add('hidden');
            gamePaused = false;
        }

        function restartGame() {
            document.getElementById('win-modal').classList.add('hidden');
            player.x = 5 * TILE_SIZE;
            player.y = 12 * TILE_SIZE;
            player.velocityX = 0;
            player.velocityY = 0;
            player.scale = 1.0;
            player.health = player.maxHealth;
            player.isInvincible = false;
            player.invincibleTimer = 0;
            player.hurtFlash = 0;
            collectCount = 0;
            document.getElementById('collect-count').textContent = '0';
            gameWon = false;
            gamePaused = false;
            initLevel();
            gameRunning = true;
        }

        function playSound(type) {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            
            gain.connect(audioCtx.destination);
            osc.connect(gain);
            
            if (type === 'step') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'hurt') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'land') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            }
        }

        function toggleMusic() {
            if (!bgmAudio) {
                bgmAudio = document.getElementById('bgm-audio');
            }

            if (isMusicPlaying) {
                isMusicPlaying = false;
                bgmAudio.pause();
                document.getElementById('music-btn').textContent = '🔇';
                document.getElementById('music-btn').classList.add('muted');
            } else {
                isMusicPlaying = true;
                bgmAudio.play().catch(function(e) {
                    console.log('Music play failed:', e);
                });
                document.getElementById('music-btn').textContent = '🎵';
                document.getElementById('music-btn').classList.remove('muted');
            }
        }

        function startGame() {
            document.getElementById('game-overlay').style.display = 'none';
            gameRunning = true;
            if (!isMusicPlaying) {
                toggleMusic();
            }
        }

        function init() {
            document.getElementById('start-btn').addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                startGame();
            });
            document.getElementById('continue-btn').addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                hideResumeModal();
            });
            document.getElementById('restart-btn').addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                restartGame();
            });
            document.getElementById('music-btn').addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                toggleMusic();
            });

            var leftBtn = document.getElementById('left-btn');
            var rightBtn = document.getElementById('right-btn');
            var jumpBtn = document.getElementById('jump-btn');

            function bindButton(btn, key) {
                btn.addEventListener('touchstart', function(e) { e.preventDefault(); keys[key] = true; });
                btn.addEventListener('touchend', function(e) { e.preventDefault(); keys[key] = false; });
                btn.addEventListener('mousedown', function(e) { e.preventDefault(); keys[key] = true; });
                btn.addEventListener('mouseup', function(e) { e.preventDefault(); keys[key] = false; });
                btn.addEventListener('mouseleave', function() { keys[key] = false; });
            }
            bindButton(leftBtn, 'left');
            bindButton(rightBtn, 'right');
            bindButton(jumpBtn, 'jump');

            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') {
                    e.preventDefault();
                    keys.jump = true;
                }
            });
            document.addEventListener('keyup', function(e) {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') keys.jump = false;
            });

            initLevel();
            requestAnimationFrame(gameLoop);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
