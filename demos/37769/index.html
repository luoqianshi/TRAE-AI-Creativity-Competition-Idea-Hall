<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 面试官 · 你的随身模拟面试教练</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ========== 主题 ========== */
        :root {
            --bg-primary:   #0f0f1e;
            --bg-secondary: #1a1a2e;
            --bg-card:      #25253e;
            --accent:       #6c5ce7;
            --accent-soft:  #a29bfe;
            --text-primary:   #ffffff;
            --text-secondary: #b8b8d4;
            --success: #00b894;
            --error:   #ff7675;
            --border:  rgba(255,255,255,0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }

        .app {
            max-width: 480px;
            margin: 0 auto;
            height: 100vh;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }

        /* ========== View 切换基础 ========== */
        .view {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            transition: transform 0.35s cubic-bezier(.4,0,.2,1),
                        opacity   0.3s ease;
        }
        .view.hidden-right  { transform: translateX(100%); opacity: 0; pointer-events: none; }
        .view.hidden-left   { transform: translateX(-100%); opacity: 0; pointer-events: none; }
        .view.active        { transform: translateX(0);     opacity: 1; pointer-events: auto; }

        /* ====================================================
         * View 1: 首页 —— 方向选择
         * ==================================================== */
        .home-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 24px 18px 32px;
        }
        .home-scroll::-webkit-scrollbar { width: 0; }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 12px;
            background: linear-gradient(135deg, var(--accent), #8b7cf6);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.4);
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #fff, var(--accent-soft));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            color: var(--text-secondary);
            font-size: 12px;
            line-height: 1.6;
        }

        /* 分类区块 */
        .category { margin-bottom: 22px; }
        .category-title {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        .category-title::before {
            content: '';
            width: 3px;
            height: 12px;
            background: var(--accent);
            border-radius: 2px;
        }
        .category-title .count {
            margin-left: auto;
            font-size: 10px;
            color: #6c6c8a;
        }

        .dir-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .dir-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 6px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .dir-card:hover  { border-color: var(--accent); transform: translateY(-2px); }
        .dir-card:active { transform: scale(0.95); background: var(--accent); }
        .dir-card .icon { font-size: 24px; }
        .dir-card .name { font-size: 12px; font-weight: 500; }

        .home-footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 10px;
            padding: 8px 0 4px;
            line-height: 1.6;
        }

        /* ====================================================
         * View 2: 出题页
         * ==================================================== */
        .header {
            padding: 12px 14px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .back-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .back-btn:hover  { background: var(--accent); border-color: var(--accent); }
        .back-btn:active { transform: scale(0.92); }

        .header-info { flex: 1; min-width: 0; }
        .header-title {
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-title .dir-icon { font-size: 17px; }
        .header-subtitle {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .header-badge {
            background: var(--accent);
            color: white;
            padding: 3px 9px;
            border-radius: 10px;
            font-size: 10px;
            flex-shrink: 0;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 14px 12px;
        }
        .chat-area::-webkit-scrollbar { width: 3px; }
        .chat-area::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

        .message { margin-bottom: 14px; animation: slideIn 0.3s ease; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ====================================================
         * 设置模态框
         * ==================================================== */
        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-mask.open { display: flex; }
        .modal {
            background: var(--bg-card);
            border-radius: 14px;
            width: 100%;
            max-width: 420px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.25s ease;
        }
        .modal-header {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
        }
        .modal-title {
            flex: 1;
            font-size: 15px;
            font-weight: 600;
        }
        .modal-close {
            width: 28px;
            height: 28px;
            border: none;
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .modal-body {
            padding: 18px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-input, .form-select {
            width: 100%;
            padding: 9px 11px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 6px;
            font-size: 12px;
            font-family: 'SF Mono', 'Consolas', monospace;
            outline: none;
            transition: border 0.2s;
        }
        .form-input:focus, .form-select:focus {
            border-color: var(--accent);
        }
        .form-hint {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 4px;
            line-height: 1.5;
        }
        .form-presets {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }
        .preset-btn {
            padding: 4px 9px;
            font-size: 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: 10px;
            cursor: pointer;
        }
        .preset-btn:hover { background: var(--accent); color: white; }
        .switch-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 8px;
            margin-bottom: 14px;
        }
        .switch {
            position: relative;
            width: 38px;
            height: 22px;
            background: #444;
            border-radius: 11px;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .switch.on { background: var(--accent); }
        .switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            transition: transform 0.2s;
        }
        .switch.on::after { transform: translateX(16px); }
        .switch-label {
            font-size: 12px;
            color: var(--text-primary);
            flex: 1;
        }
        .switch-hint {
            font-size: 10px;
            color: var(--text-secondary);
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            padding: 14px 18px;
            border-top: 1px solid var(--border);
        }
        .btn-secondary, .btn-primary {
            flex: 1;
            padding: 9px 0;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-secondary { background: var(--bg-secondary); color: var(--text-primary); }
        .btn-primary   { background: var(--accent);        color: white; }
        .btn-primary:hover   { filter: brightness(1.1); }
        .btn-secondary:hover { background: var(--border); }
        .mode-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
            background: var(--accent);
            color: white;
        }
        .mode-tag.mock  { background: #fdcb6e; color: #333; }
        .mode-tag.api   { background: #74b9ff; color: #333; }
        .message.user { text-align: right; }
        .message.ai   { text-align: left; }

        .bubble {
            display: inline-block;
            max-width: 88%;
            padding: 9px 13px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.55;
            word-break: break-word;
            white-space: pre-wrap;
            text-align: left;
        }
        .message.user .bubble {
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.ai .bubble {
            background: var(--bg-card);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        .quiz-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 10px;
            padding: 12px;
            margin: 10px 0;
            text-align: left;
            max-width: 92%;
        }
        .quiz-title { color: var(--accent-soft); font-size: 12px; font-weight: 600; margin-bottom: 8px; }
        .quiz-section { margin-bottom: 8px; }
        .quiz-section:last-child { margin-bottom: 0; }
        .quiz-label { color: var(--text-secondary); font-size: 10px; margin-bottom: 3px; }
        .quiz-content {
            background: rgba(0,0,0,0.35);
            padding: 7px 9px;
            border-radius: 6px;
            font-family: 'SF Mono', 'Consolas', 'Courier New', monospace;
            font-size: 11px;
            color: #a8e6cf;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.45;
        }

        .input-area {
            border-top: 1px solid var(--border);
            padding: 10px 12px 12px;
            background: var(--bg-secondary);
            flex-shrink: 0;
        }
        .input-text {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 9px 12px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            resize: none;
            font-family: inherit;
            line-height: 1.5;
        }
        .input-text:focus { border-color: var(--accent); }
        .input-text::placeholder { color: #6c6c8a; }

        .action-btns { display: flex; gap: 8px; margin-top: 8px; }
        .btn {
            flex: 1;
            padding: 9px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #5d4ad8; }
        .btn-primary:disabled { background: #444; cursor: not-allowed; opacity: 0.7; }
        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: #2f2f4e; }

        .status-bar {
            text-align: center;
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 6px;
            min-height: 14px;
        }

        .typing {
            display: inline-flex;
            gap: 4px;
            padding: 12px 14px;
            background: var(--bg-card);
            border-radius: 14px;
        }
        .typing span {
            width: 6px;
            height: 6px;
            background: var(--accent-soft);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30%           { transform: translateY(-6px); }
        }

        /* ====================================================
         * ReAct 步骤追踪卡片
         * 思想：把 Agent 的 Thought/Action/Observation 全部可视化
         * 每种类型用不同左边色 + 状态徽章区分
         * ==================================================== */
        .step {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 8px;
            margin-bottom: 8px;
            overflow: hidden;
            animation: slideIn 0.3s ease;
            max-width: 95%;
        }
        .step.thought { border-left-color: #74b9ff; }
        .step.action  { border-left-color: #a29bfe; }
        .step.obs     { border-left-color: #fdcb6e; }
        .step.success { border-left-color: var(--success); }
        .step.error   { border-left-color: var(--error); }

        .step-header {
            display: flex;
            align-items: center;
            padding: 8px 11px;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }
        .step-header:hover { background: rgba(255,255,255,0.03); }
        .step-icon  { font-size: 14px; flex-shrink: 0; }
        .step-title {
            font-size: 12px;
            font-weight: 600;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .step-status {
            display: inline-block;
            padding: 1px 7px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 600;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .step.status-running .step-status { background: var(--accent); color: white; }
        .step.status-success .step-status { background: var(--success); color: white; }
        .step.status-error   .step-status { background: var(--error);   color: white; }

        .step-time {
            font-size: 10px;
            color: var(--text-secondary);
            flex-shrink: 0;
            font-family: 'SF Mono', 'Consolas', monospace;
        }
        .step-toggle {
            font-size: 9px;
            color: var(--text-secondary);
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .step.open .step-toggle { transform: rotate(180deg); }

        .step-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
        }
        .step.open .step-body {
            max-height: 480px;
            overflow-y: auto;
        }
        .step-body::-webkit-scrollbar { width: 3px; }
        .step-body::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

        .step-content {
            margin: 0 11px 10px;
            padding: 8px 10px;
            background: rgba(0,0,0,0.35);
            border-radius: 6px;
            font-family: 'SF Mono', 'Consolas', 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.55;
            color: #d8d8f0;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* 步骤分隔标记（连接相邻步骤） */
        .step-divider {
            text-align: center;
            margin: 2px 0;
            color: #5d4ad8;
            font-size: 10px;
            font-weight: 500;
        }
        .step-divider::before { content: '│  '; }
        .step-divider::after  { content: '  │'; }
    </style>
</head>
<body>
<div class="app">

    <!-- ====================================================
         View 1: 首页（方向选择）
         ==================================================== -->
    <div class="view active" id="homeView">
        <div class="home-scroll">
            <div class="brand">
                <div class="logo">🤖</div>
                <h1>AI 面试官</h1>
                <p class="subtitle">选择就业方向 · AI 帮你定制专业面试题<br>通勤路上也能练</p>
            </div>

            <div id="categories"></div>

            <div class="home-footer">
                💡 选好方向后输入你的背景（技术栈 / 项目 / 目标公司）<br>
                AI 会出题 → 自动验证 → 最多重试 3 轮
            </div>
        </div>
    </div>

    <!-- ====================================================
         View 2: 出题页（对话界面）
         ==================================================== -->
    <div class="view hidden-right" id="quizView">
        <div class="header">
            <div class="header-info">
                <div class="header-title">
                    <span class="dir-icon" id="dirIcon">🎯</span>
                    <span id="dirName">加载中...</span>
                </div>
                <div class="header-subtitle" id="dirTag">AI 面试官 · 出题助手</div>
            </div>
            <button class="back-btn" id="settingsBtn" title="设置" style="right:60px;background:rgba(255,255,255,0.1)">⚙️</button>
            <button class="back-btn" id="backBtn" title="返回选择方向" style="right:14px">←</button>
        </div>
        <div class="content">
            <div class="chat-area" id="chatArea"></div>
            <div class="input-area">
                <textarea class="input-text" id="detailInput" rows="2"
                          placeholder="补充细节：技术栈 / 项目经验 / 目标公司 / 岗位要求..."></textarea>
                <div class="action-btns">
                    <button class="btn btn-secondary" id="resetBtn">重置</button>
                    <button class="btn btn-primary" id="generateBtn">开始出题</button>
                </div>
                <div class="status-bar" id="statusBar"></div>
            </div>
        </div>
    </div>
</div>

<script>
/* ============================================================
 * 20 个就业方向 · 4 大分类（贴合大众）
 * 思想：方向分类让用户更快找到目标，类似信息架构中的"导航分层"
 * ============================================================ */
const CATEGORIES = [
    {
        id: 'tech',
        name: '互联网 / 技术',
        dirs: [
            { id: 'frontend',     name: '前端开发',   icon: '🎨' },
            { id: 'backend',      name: '后端开发',   icon: '⚙️' },
            { id: 'mobile',       name: '移动端开发', icon: '📱' },
            { id: 'test',         name: '测试工程',   icon: '🔍' },
            { id: 'ops',          name: '运维工程',   icon: '🛠️' },
            { id: 'algorithm',    name: '算法工程',   icon: '🧠' }
        ]
    },
    {
        id: 'emerging',
        name: '新兴技术 / 热门',
        dirs: [
            { id: 'ai',           name: 'AI 工程师',  icon: '🤖' },
            { id: 'data',         name: '数据分析',   icon: '📊' },
            { id: 'cloud',        name: '云计算',     icon: '☁️' },
            { id: 'game',         name: '游戏开发',   icon: '🎮' },
            { id: 'security',     name: '网络安全',   icon: '🔐' },
            { id: 'product',      name: '产品经理',   icon: '💡' }
        ]
    },
    {
        id: 'design',
        name: '设计 / 创意',
        dirs: [
            { id: 'ui',           name: 'UI 设计',    icon: '✏️' },
            { id: 'newmedia',     name: '新媒体运营', icon: '📢' }
        ]
    },
    {
        id: 'business',
        name: '职能 / 商业（贴合大众）',
        dirs: [
            { id: 'marketing',    name: '市场营销',   icon: '📈' },
            { id: 'ecommerce',    name: '电商运营',   icon: '🛒' },
            { id: 'hr',           name: '人力资源',   icon: '👥' },
            { id: 'finance',      name: '财务会计',   icon: '💰' },
            { id: 'sales',        name: '销售业务',   icon: '🤝' },
            { id: 'teacher',      name: '教师教育',   icon: '📚' }
        ]
    }
];

// 扁平方向表（供 quiz 页查 name / icon）
const DIRECTIONS = CATEGORIES.flatMap(c => c.dirs);
const DIR_MAP    = Object.fromEntries(DIRECTIONS.map(d => [d.id, d]));

function pickMockQuiz(dirId) {
    const bank = MOCK_QUIZ_BANK[dirId] || MOCK_QUIZ_BANK.others;
    return bank[Math.floor(Math.random() * bank.length)];
}

const DEFAULT_CONFIG = {
    BASE_URL:  "https://api.openai.com/v1",
    API_KEY:   "",
    MODEL:     "gpt-4o-mini",
    MOCK_MODE: true         // 默认开启 Mock 演示，避免 API 不通时卡住
};
function loadConfig() {
    try {
        const saved = JSON.parse(localStorage.getItem("aiInterviewerConfig") || "{}");
        return { ...DEFAULT_CONFIG, ...saved };
    } catch { return { ...DEFAULT_CONFIG }; }
}
let CFG = loadConfig();
function saveConfig() {
    localStorage.setItem("aiInterviewerConfig", JSON.stringify(CFG));
    // 同步全局
    BASE_URL = CFG.BASE_URL;
    API_KEY  = CFG.API_KEY;
    MODEL    = CFG.MODEL;
}

// View 切换（带滑动动画）
// 思想：SPA 内 view 切换 + 滑动转场，模拟原生 App 体验
// ============================================================
const homeView = document.getElementById('homeView');
const quizView = document.getElementById('quizView');

function showView(to) {
    if (to === 'quiz') {
        homeView.classList.remove('active');
        homeView.classList.add('hidden-left');
        quizView.classList.remove('hidden-right');
        quizView.classList.add('active');
    } else {
        quizView.classList.remove('active');
        quizView.classList.add('hidden-right');
        homeView.classList.remove('hidden-left');
        homeView.classList.add('active');
    }
}

    });
})();

/* ============================================================
 * Tool 1：generate_quiz
 * 思想：
 *   - Mock 模式：直接从内置题库抽题，模拟 1-3s 思考时间
 *   - 真实模式：调用 LLM API，超时 30s
 * ============================================================ */
async function generateQuiz(dirName, detail) {
    // ===== Mock 分支 =====
    if (CFG.MOCK_MODE) {
        const t0 = performance.now();
        console.groupCollapsed(`[AI面试官] generate_quiz (MOCK) → ${dirName}`);
        console.log('Detail:', detail || '(无)');
        // 模拟 0.8-2.0s 思考时间
        const delay = 800 + Math.random() * 1200;
        await new Promise(r => setTimeout(r, delay));
        const dirId = currentDir ? currentDir.id : 'others';
        const quiz = pickMockQuiz(dirId);
        console.log('从题库抽取题目:', quiz.question.slice(0, 50) + '...');
        console.log('耗时:', (performance.now() - t0).toFixed(0) + 'ms');
        console.groupEnd();
        // 返回 JSON 字符串（与 LLM 输出格式一致，方便走 validate_quiz）
        return JSON.stringify(quiz, null, 2);
    }

    // ===== 真实 API 分支 =====
    const prompt = `你是 ${dirName} 岗位的资深面试官。请根据候选人情况出 1 道专业面试题。

候选人补充信息：${detail || '（无）'}

严格按以下 JSON 格式输出（不要任何其他内容、解释或 markdown 标记）：

{
    "question": "题目描述（清楚说明要做什么，${dirName}相关）",
    "starter_code": "// 起手代码框架",
    "answer": "完整的标准答案实现",
    "case": [
        ["输入1", "期望输出1"],
        ["输入2", "期望输出2"],
        ["输入3", "期望输出3"]
    ]
}

要求：
1. 题目必须与 ${dirName} 强相关
2. 至少 3 个测试用例
3. answer 必须能通过所有 case
4. 只输出 JSON`;

    const controller = new AbortController();
    const timeoutMs   = 30000; // 30s 超时
    const timer = setTimeout(() => controller.abort(), timeoutMs);

    // 调试日志
    console.groupCollapsed(`[AI面试官] generate_quiz → ${dirName}`);
    console.log('BASE_URL:', BASE_URL);
    console.log('MODEL:', MODEL);
    console.log('API_KEY prefix:', API_KEY ? API_KEY.slice(0, 8) + '...' : '(空)');
    console.log('Detail:', detail || '(无)');

    let response;
    try {
        response = await fetch(`${BASE_URL}/chat/completions`, {
            method: 'POST',
            headers: {
                'Content-Type':  'application/json',
                'Authorization': `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                model: MODEL,
                messages: [{ role: 'user', content: prompt }],
                temperature: 0.3
            }),
            signal: controller.signal
        });
    } catch (e) {
        clearTimeout(timer);
        console.error('fetch 失败:', e);
        console.groupEnd();
        if (e.name === 'AbortError') {
            throw new Error(`请求超时（${timeoutMs/1000}s 未响应）。可能是网络慢或 BASE_URL 不正确：${BASE_URL}`);
        }
        throw new Error(`网络请求失败：${e.message}\n\n请检查：\n1. 网络是否正常\n2. BASE_URL 是否正确（当前：${BASE_URL}）\n3. 是否被浏览器/CORS 拦截`);
    }
    clearTimeout(timer);

    if (!response.ok) {
        const errBody = await response.text().catch(() => '');
        console.error('HTTP 错误', response.status, errBody.slice(0, 300));
        console.groupEnd();
        throw new Error(`API 调用失败：HTTP ${response.status}\n${errBody.slice(0, 200)}\n\n请检查：\n1. API_KEY 是否有效\n2. MODEL 名称是否正确（当前：${MODEL}）`);
    }

    const data = await response.json();
    const content = data.choices?.[0]?.message?.content;
    if (!content) {
        console.error('返回数据异常:', data);
        console.groupEnd();
        throw new Error(`API 返回数据格式异常：${JSON.stringify(data).slice(0, 200)}`);
    }
    console.log('返回内容（前200字）:', content.slice(0, 200));
    console.groupEnd();
    return content;
}


/* ============================================================
 * Tool 2：validate_quiz
 * ============================================================ */
function validateQuiz(quizJson) {
    let text = quizJson.trim();
    if (text.startsWith('```')) {
        const lines = text.split('\n');
        if (lines[0].startsWith('```')) lines.shift();
        if (lines[lines.length - 1].trim() === '```') lines.pop();
        text = lines.join('\n');
    }
    let quiz;
    try {
        quiz = JSON.parse(text);
    } catch (e) {
        return { status: 'failed', error: `JSON 解析失败：${e.message}` };
    }
    const required = ['question', 'starter_code', 'answer', 'case'];
    const missing  = required.filter(k => !(k in quiz));
    if (missing.length) {
        return { status: 'failed', error: `缺少字段：${missing.join(', ')}` };
    }
    if (!Array.isArray(quiz.case) || quiz.case.length < 3) {
        return { status: 'failed', error: '测试用例至少 3 个' };
    }
    for (let i = 0; i < quiz.case.length; i++) {
        if (!Array.isArray(quiz.case[i]) || quiz.case[i].length !== 2) {
            return { status: 'failed', error: `测试用例 ${i + 1} 格式错误` };
        }
    }
    return { status: 'success', message: '题目验证通过！', quiz };
}


/**
 * ReAct Agent 主循环（Thought → Action → Observation → Validation → Decision）
 * 思想：每一步都拆成独立的步骤卡片，让用户看见 Agent 的内部推理过程
 */
async function runAgent() {
    if (isGenerating || !currentDir) return;
    isGenerating = true;
    generateBtn.disabled = true;
    generateBtn.textContent = '出题中...';

    const detail = detailInput.value.trim();

    // 1. 用户消息
    addMessage('user', `📌 方向：${currentDir.name}\n📝 补充：${detail || '（无）'}`);

    // ============================================================
    // Step 1 · Thought · 任务分析
    // ============================================================
    addStep({
        type: 'thought',
        title: 'Step 1 · Thought · 任务分析',
        content:
            `目标：为【${currentDir.name}】岗位的候选人出 1 道专业面试题。\n` +
            `用户补充信息：${detail || '（无）'}\n\n` +
            `我的策略：\n` +
            `  ① 调用 generate_quiz 工具，让 LLM 根据方向生成题目\n` +
            `  ② 调用 validate_quiz 工具，本地校验题目质量\n` +
            `  ③ 失败则重试，最多 ${3} 轮`,
        status: 'success'
    });
    await sleep(600);

    const MAX_RETRY = 3;
    let finalQuiz  = null;
    let lastError  = null;

    for (let i = 0; i < MAX_RETRY; i++) {
        addDivider(`── 第 ${i + 1} / ${MAX_RETRY} 轮 ──`);

        // ============================================================
        // Step 2 · Action · generate_quiz
        // ============================================================
        const promptPreview = buildPromptPreview(currentDir.name, detail);
        const stepGen = addStep({
            type: 'action',
            title: `Step 2 · Action · generate_quiz`,
            content: promptPreview,
            status: 'running',
            open: false
        });
        setStepTime(stepGen, '⏳ 请求中...');
        statusBar.textContent = `🎬 generate_quiz（第 ${i + 1}/${MAX_RETRY} 轮）...`;

        const t0 = performance.now();
        let quizText;
        try {
            quizText = await generateQuiz(currentDir.name, detail);
        } catch (e) {
            setStepStatus(stepGen, 'error');
            setStepTime(stepGen, '✗ 失败');
            addStep({
                type: 'error',
                title: 'Step ✗ · API 调用失败',
                content: `错误信息：${e.message}\n\n建议：检查 API Key 与网络`,
                status: 'error'
            });
            isGenerating = false;
            generateBtn.disabled = false;
            generateBtn.textContent = '开始出题';
            statusBar.textContent = '❌ 出错';
            return;
        }
        const t1 = performance.now();
        setStepStatus(stepGen, 'success');
        setStepTime(stepGen, `✓ ${((t1 - t0) / 1000).toFixed(1)}s`);

        // ============================================================
        // Step 3 · Observation · 工具返回的原始内容
        // ============================================================
        addStep({
            type: 'obs',
            title: `Step 3 · Observation · LLM 原始返回内容`,
            content: quizText,
            status: 'success',
            open: false
        });
        await sleep(300);

        // ============================================================
        // Step 4 · Action · validate_quiz
        // ============================================================
        const stepVal = addStep({
            type: 'action',
            title: `Step 4 · Action · validate_quiz`,
            content:
                `校验项：\n` +
                `  ① 是否被 \`\`\` 标记包裹（需剥离）\n` +
                `  ② JSON 是否可解析\n` +
                `  ③ 必填字段：question / starter_code / answer / case\n` +
                `  ④ case 至少 3 个，每个为 [输入, 期望输出]`,
            status: 'running'
        });
        setStepTime(stepVal, '⏳ 校验中...');
        statusBar.textContent = `🔍 validate_quiz...`;

        const t2 = performance.now();
        const result = validateQuiz(quizText);
        const t3 = performance.now();
        setStepStatus(stepVal, 'success');
        setStepTime(stepVal, `✓ ${(t3 - t2).toFixed(0)}ms`);

        // ============================================================
        // Step 5 · Validation Result
        // ============================================================
        if (result.status === 'success') {
            addStep({
                type: 'success',
                title: `Step 5 · Validation · ✅ 验证通过`,
                content:
                    `所有检查项通过！\n` +
                    `  • JSON 解析：成功\n` +
                    `  • 必填字段：4/4 完整\n` +
                    `  • 测试用例：${result.quiz.case.length} 个\n` +
                    `  • 耗时统计：生成 ${((t1 - t0) / 1000).toFixed(1)}s + 验证 ${(t3 - t2).toFixed(0)}ms`,
                status: 'success'
            });
            finalQuiz = result.quiz;
            statusBar.textContent = '✅ 验证通过';
            break;
        } else {
            addStep({
                type: 'error',
                title: `Step 5 · Validation · ❌ 验证失败`,
                content:
                    `失败原因：${result.error}\n\n` +
                    `下一步：调用 generate_quiz 重新生成`,
                status: 'error'
            });
            lastError = result.error;
            statusBar.textContent = `❌ 第 ${i + 1} 轮失败：${result.error}`;

            if (i < MAX_RETRY - 1) {
                // ============================================================
                // Step 6 · Decision · 重试决策
                // ============================================================
                addStep({
                    type: 'thought',
                    title: `Step 6 · Decision · 🔄 重试决策`,
                    content:
                        `第 ${i + 1} 次验证失败。\n` +
                        `决定：进入第 ${i + 2} 轮重试。\n` +
                        `剩余次数：${MAX_RETRY - i - 1}`,
                    status: 'success'
                });
                await sleep(600);
            }
        }
    }

    // ============================================================
    // Step 7 · Final · 最终结果
    // ============================================================
    addDivider('── 最终结果 ──');
    if (finalQuiz) {
        addStep({
            type: 'final',
            title: `Step 7 · Final · 🎉 任务完成`,
            content:
                `成功为【${currentDir.name}】方向生成 1 道高质量面试题！\n` +
                `下方是完整的题目卡片，可直接用于练习。`,
            status: 'success'
        });
        renderQuizCard(finalQuiz);
        statusBar.textContent = '✅ 完成';
    } else {
        addStep({
            type: 'error',
            title: `Step 7 · Final · 😔 任务未完成`,
            content:
                `经过 ${MAX_RETRY} 次尝试仍未通过验证。\n` +
                `最后错误：${lastError || '未知'}\n\n` +
                `建议：换个更详细的输入，或换个方向试试。`,
            status: 'error'
        });
        statusBar.textContent = '❌ 失败';
    }

    isGenerating = false;
    generateBtn.disabled = false;
    generateBtn.textContent = '开始出题';
}

/* ============================================================
 * ReAct 步骤追踪系统
 * 思想：把 LangChain/LangGraph 中 ReAct Agent 的内部推理过程
 *       完整可视化给用户，每个步骤都是一个可折叠卡片
 * ============================================================ */
const STEP_ICONS = {
    thought: '💭',
    action:  '🎬',
    obs:     '📤',
    success: '✅',
    error:   '❌',
    retry:   '🔄',
    final:   '🎉'
};
const STATUS_TEXT = {
    pending: '等待',
    running: '执行中',
    success: '完成',
    error:   '失败'
};

/**
 * 创建一个步骤卡片
 * @param {Object} opts
 * @param {string} opts.type    - thought / action / obs / success / error / retry / final
 * @param {string} opts.title   - 卡片标题
 * @param {string} opts.content - 卡片详情（可长可短）
 * @param {string} opts.status  - pending / running / success / error
 * @param {boolean} opts.open   - 是否默认展开
 * @returns {HTMLElement} 卡片 DOM
 */
function addStep({ type, title, content = '', status = 'pending', open = true }) {
    const div = document.createElement('div');
    div.className = `step ${type} status-${status}`;

    const icon = STEP_ICONS[type] || '•';
    const statusText = STATUS_TEXT[status] || status;

    div.innerHTML = `
        <div class="step-header">
            <span class="step-icon">${icon}</span>
            <span class="step-title">${escape(title)}</span>
            <span class="step-status">${statusText}</span>
            <span class="step-time"></span>
            <span class="step-toggle">▼</span>
        </div>
        <div class="step-body">
            <div class="step-content">${escape(content)}</div>
        </div>
    `;

    if (open) div.classList.add('open');
    div.querySelector('.step-header').onclick = () => div.classList.toggle('open');

    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return div;
}

function setStepStatus(step, status) {
    step.classList.remove('status-pending', 'status-running', 'status-success', 'status-error');
    step.classList.add(`status-${status}`);
    const statusEl = step.querySelector('.step-status');
    if (statusEl) statusEl.textContent = STATUS_TEXT[status] || status;
}

function setStepTime(step, text) {
    const t = step.querySelector('.step-time');
    if (t) t.textContent = text;
}

function addDivider(text = '') {
    const div = document.createElement('div');
    div.className = 'step-divider';
    div.textContent = text;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
}

function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
}

    cfgModel.value   = CFG.MODEL;
    updateModeTag();
    settingsModal.classList.add('open');
}
function closeSettings() {
    settingsModal.classList.remove('open');
}

settingsBtn  && settingsBtn.addEventListener('click',  openSettings);
modalClose   && modalClose.addEventListener('click',   closeSettings);
cfgCancel    && cfgCancel.addEventListener('click',    closeSettings);
cfgSave && cfgSave.addEventListener('click', () => {
    CFG = {
        BASE_URL:  cfgBaseUrl.value.trim() || DEFAULT_CONFIG.BASE_URL,
        API_KEY:   cfgApiKey.value.trim(),
        MODEL:     cfgModel.value.trim()   || DEFAULT_CONFIG.MODEL,
        MOCK_MODE: mockSwitch.classList.contains('on')
    };
    saveConfig();
    updateModeTag();
    closeSettings();
});
mockSwitch && mockSwitch.addEventListener('click', () => {
    mockSwitch.classList.toggle('on');
});
// 预设 BASE_URL
document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        cfgBaseUrl.value = btn.dataset.url;
    });
});
// 点击遮罩关闭
settingsModal && settingsModal.addEventListener('click', (e) => {
    if (e.target === settingsModal) closeSettings();
});

updateModeTag();
});
</script>
<!-- ====================================================
     设置模态框
     ==================================================== -->
<div class="modal-mask" id="settingsModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">⚙️ 设置</div>
            <button class="modal-close" id="modalClose">✕</button>
        </div>
        <div class="modal-body">
            <!-- 当前模式 -->
            <div style="margin-bottom:14px;font-size:12px;">
                当前模式：<span class="mode-tag" id="modeTag">Mock</span>
            </div>

            <!-- Mock 开关 -->
            <div class="switch-row">
                <div class="switch on" id="mockSwitch"></div>
                <div>
                    <div class="switch-label">使用 Mock 演示模式</div>
                    <div class="switch-hint">关闭后使用真实 LLM API（需自备 Key）</div>
                </div>
            </div>

            <!-- BASE_URL -->
            <div class="form-group">
                <label class="form-label">BASE_URL</label>
                <input class="form-input" id="cfgBaseUrl" placeholder="https://api.openai.com/v1">
                <div class="form-presets">
                    <span class="preset-btn" data-url="https://api.openai.com/v1">OpenAI</span>
                    <span class="preset-btn" data-url="https://api.deepseek.com/v1">DeepSeek</span>
                    <span class="preset-btn" data-url="https://api.moonshot.cn/v1">月之暗面</span>
                    <span class="preset-btn" data-url="https://open.bigmodel.cn/api/paas/v4">智谱AI</span>
                    <span class="preset-btn" data-url="https://dashscope.aliyuncs.com/compatible-mode/v1">通义千问</span>
                </div>
            </div>

            <!-- API_KEY -->
            <div class="form-group">
                <label class="form-label">API_KEY</label>
                <input class="form-input" id="cfgApiKey" type="password" placeholder="sk-...">
                <div class="form-hint">仅保存在浏览器 localStorage，不会上传</div>
            </div>

            <!-- MODEL -->
            <div class="form-group">
                <label class="form-label">MODEL</label>
                <input class="form-input" id="cfgModel" placeholder="gpt-4o-mini">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" id="cfgCancel">取消</button>
            <button class="btn-primary" id="cfgSave">保存</button>
        </div>
    </div>
</div>

</body>
</html>
