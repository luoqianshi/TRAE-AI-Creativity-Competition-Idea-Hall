<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>世界怪谈地图</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
/* ==========================================================================
   MIDNIGHT MANUSCRIPT — Design Tokens
   ========================================================================== */
:root {
  --void: #07060f;
  --panel: rgba(14, 11, 24, 0.9);
  --panel-raised: rgba(20, 16, 34, 0.94);
  --panel-hover: rgba(26, 21, 42, 0.96);

  --border: rgba(200, 188, 224, 0.11);
  --border-strong: rgba(200, 188, 224, 0.24);
  --border-active: rgba(201, 169, 110, 0.48);

  --text: #ebe6f2;
  --text-muted: #9089a3;
  --text-dim: #5c5568;

  --accent: #c9a96e;
  --accent-bright: #e0c48a;
  --accent-glow: rgba(201, 169, 110, 0.32);
  --accent-soft: rgba(201, 169, 110, 0.1);
  --parchment: #d4c8f0;
  --spectral: #8b7ec8;
  --spectral-dim: rgba(139, 126, 200, 0.16);
  --wax: #d46868;
  --wax-glow: rgba(212, 104, 104, 0.42);

  --font-display: 'Noto Serif SC', 'EB Garamond', Georgia, serif;
  --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'IBM Plex Mono', 'Courier New', monospace;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;

  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --transition: 0.3s var(--ease-out);
  --transition-fast: 0.15s ease;
}

/* ==========================================================================
   Reset & Global
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body, html {
  width: 100%;
  min-width: 1280px;
  height: 100%;
  overflow: hidden;
  background: var(--void);
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--text);
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(200, 188, 224, 0.2);
  border-radius: 2px;
}
::-webkit-scrollbar-thumb:hover { background: rgba(200, 188, 224, 0.38); }

/* Corner bracket signature — reused on cards & detail */
.frame-brackets {
  position: relative;
}
.frame-brackets::before,
.frame-brackets::after {
  content: '';
  position: absolute;
  width: 10px;
  height: 10px;
  border-color: var(--accent);
  border-style: solid;
  opacity: 0.55;
  pointer-events: none;
  z-index: 2;
  transition: opacity var(--transition-fast);
}
.frame-brackets::before {
  top: 5px; left: 5px;
  border-width: 1.5px 0 0 1.5px;
}
.frame-brackets::after {
  bottom: 5px; right: 5px;
  border-width: 0 1.5px 1.5px 0;
}

/* ==========================================================================
   Globe & Markers
   ========================================================================== */
#globe-container {
  position: absolute;
  inset: 0;
  z-index: 1;
}

#globe-container canvas { cursor: grab; }

#marker-container {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

.map-marker {
  position: absolute;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.3s ease;
}

.marker-emoji {
  font-size: 18px;
  pointer-events: auto;
  cursor: pointer;
  filter: drop-shadow(0 0 3px rgba(212, 200, 240, 0.85))
          drop-shadow(0 0 8px rgba(201, 169, 110, 0.45));
  transition: transform 0.2s var(--ease-out);
}

.map-marker:hover .marker-emoji {
  transform: scale(1.25) translateY(-2px);
  filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.9))
          drop-shadow(0 0 12px rgba(201, 169, 110, 0.55));
}

.map-marker.selected .marker-emoji {
  transform: scale(1.35) translateY(-3px);
  filter: drop-shadow(0 0 6px rgba(255, 255, 255, 1))
          drop-shadow(0 0 14px rgba(212, 104, 104, 0.8));
}

/* ==========================================================================
   UI Layer & Panels
   ========================================================================== */
.ui-layer {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
}

.ui-layer > * { pointer-events: auto; }

.glass-panel {
  background: var(--panel);
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow:
    0 16px 48px rgba(0, 0, 0, 0.7),
    inset 0 1px 0 rgba(200, 188, 224, 0.07);
  transition: border-color var(--transition), box-shadow var(--transition);
}

/* ==========================================================================
   Left Dock (toolbar + broadcast)
   ========================================================================== */
.left-dock {
  position: absolute;
  left: 24px;
  top: 44px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 10px;
  max-height: calc(100vh - 100px);
  pointer-events: none;
}

.left-dock > * {
  pointer-events: auto;
}

/* ==========================================================================
   Side Toolbar
   ========================================================================== */
.side-toolbar {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
}

.icon-btn {
  background: var(--panel);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  color: var(--text-muted);
  width: 38px;
  height: 38px;
  border-radius: var(--radius-md);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition-fast);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
}

.icon-btn:hover {
  background: var(--panel-hover);
  color: var(--parchment);
  border-color: var(--border-strong);
}

.icon-btn.active {
  background: var(--accent-soft);
  border-color: var(--border-active);
  color: var(--accent);
  box-shadow: 0 0 12px var(--accent-glow);
}

/* ==========================================================================
   Broadcast Panel
   ========================================================================== */
.broadcast-panel {
  width: 300px;
  flex-shrink: 1;
  min-height: 0;
  max-height: calc(100vh - 220px);
  overflow-x: hidden;
  overflow-y: auto;
}

.broadcast-panel.hidden {
  display: none !important;
}

.broadcast-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  background: rgba(0, 0, 0, 0.22);
}

.broadcast-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.5px;
  color: var(--accent);
}

.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--wax);
  box-shadow: 0 0 8px var(--wax-glow);
  animation: pulse-dot 1.4s infinite;
}

.broadcast-panel.is-paused .live-dot {
  background: var(--text-dim);
  box-shadow: none;
  animation: none;
}

.broadcast-controls {
  display: flex;
  gap: 4px;
}

.bc-btn {
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  cursor: pointer;
  transition: var(--transition-fast);
}

.bc-btn:hover {
  color: var(--parchment);
  border-color: var(--border-strong);
}

.bc-btn.active {
  color: var(--accent);
  border-color: var(--border-active);
  background: var(--accent-soft);
}

.broadcast-body {
  padding: 12px 14px 14px;
}

.broadcast-meta {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  color: var(--parchment);
  margin-bottom: 8px;
  line-height: 1.35;
  animation: fade-up 0.35s var(--ease-out);
}

.broadcast-text {
  font-size: 11.5px;
  line-height: 1.6;
  color: rgba(235, 230, 242, 0.78);
  max-height: 80px;
  overflow-y: auto;
  padding-right: 4px;
}

.broadcast-text.is-updating {
  animation: fade-up 0.35s var(--ease-out);
}

/* ==========================================================================
   Header
   ========================================================================== */
#panel-header {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 32px 14px;
  text-align: center;
}

.header-eyebrow {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 4px;
}

.occult-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 4px;
  color: var(--parchment);
  text-shadow: 0 0 24px rgba(200, 188, 224, 0.18);
}

.header-location {
  margin-top: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--spectral);
  letter-spacing: 0.5px;
  animation: fade-up 0.35s var(--ease-out);
}

.header-location.hidden { display: none !important; }

.loc-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--spectral);
  box-shadow: 0 0 6px var(--spectral);
  animation: pulse-dot 2s infinite;
}

/* ==========================================================================
   Right Sidebar — Tale List
   ========================================================================== */
#panel-right {
  position: absolute;
  top: 36px;
  right: 20px;
  bottom: 36px;
  width: 300px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#panel-right .panel-header {
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.panel-title-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 12px;
}

#panel-right h2 {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--parchment);
}

.list-count {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid rgba(201, 169, 110, 0.22);
  padding: 2px 7px;
  border-radius: 10px;
  letter-spacing: 0.5px;
}

.search-box {
  position: relative;
}

.search-box input {
  width: 100%;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 9px 12px 9px 32px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 12px;
  transition: var(--transition-fast);
}

.search-box input::placeholder { color: var(--text-dim); }

.search-box input:focus {
  outline: none;
  border-color: var(--border-active);
  box-shadow: 0 0 0 2px var(--accent-soft);
}

.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  pointer-events: none;
}

/* Single-column dossier strips */
.list-container {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: stretch;
}

.list-empty {
  margin: 48px 16px;
  text-align: center;
  color: var(--text-dim);
  font-size: 12px;
  line-height: 1.6;
}

.list-empty-icon {
  display: block;
  font-size: 24px;
  margin-bottom: 8px;
  opacity: 0.5;
}

.tale-card {
  position: relative;
  display: grid;
  grid-template-columns: 56px 1fr 22px;
  grid-template-rows: 1fr;
  align-items: center;
  gap: 10px;
  flex: 0 0 auto;
  height: 68px;
  min-height: 68px;
  max-height: 68px;
  padding: 0 10px 0 8px;
  border-radius: var(--radius-md);
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid var(--border);
  cursor: pointer;
  overflow: hidden;
  transition: var(--transition-fast);
}

.tale-card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 2px;
  background: transparent;
  transition: background var(--transition-fast);
}

.tale-card:hover {
  background: rgba(200, 188, 224, 0.04);
  border-color: var(--border-strong);
  transform: translateX(-2px);
}

.tale-card:hover::before { background: var(--accent); }

.tale-card.selected {
  background: var(--accent-soft);
  border-color: var(--border-active);
  box-shadow: 0 0 16px var(--accent-glow), inset 0 0 0 1px rgba(201, 169, 110, 0.08);
}

.tale-card.selected::before {
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent-glow);
}

.card-thumb-wrap {
  position: relative;
  width: 56px;
  height: 52px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: rgba(0, 0, 0, 0.5);
  flex-shrink: 0;
  align-self: center;
}

.card-thumb-wrap::before,
.card-thumb-wrap::after {
  content: '';
  position: absolute;
  width: 6px;
  height: 6px;
  border-color: rgba(201, 169, 110, 0.42);
  border-style: solid;
  z-index: 2;
  pointer-events: none;
}
.card-thumb-wrap::before {
  top: 3px; left: 3px;
  border-width: 1px 0 0 1px;
}
.card-thumb-wrap::after {
  bottom: 3px; right: 3px;
  border-width: 0 1px 1px 0;
}

.card-thumb-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s var(--ease-out);
  filter: saturate(0.85) contrast(1.05);
}

.tale-card:hover .card-thumb-wrap img { transform: scale(1.08); }

.card-fallback {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  background: radial-gradient(circle, rgba(139, 126, 200, 0.08) 0%, transparent 70%);
}

.card-body {
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding: 6px 0;
}

.card-badge {
  font-family: var(--font-body);
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0;
  text-transform: none;
  color: var(--text-muted);
  line-height: 1.2;
  flex-shrink: 0;
}

.card-body h4 {
  font-family: var(--font-display);
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.25;
  flex-shrink: 0;
}

.card-location {
  font-size: 10.5px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.25;
  flex-shrink: 0;
}

.card-emoji {
  font-size: 15px;
  line-height: 1;
  opacity: 0.7;
  align-self: center;
  justify-self: center;
  flex-shrink: 0;
  transition: opacity var(--transition-fast), transform var(--transition-fast);
}

.tale-card:hover .card-emoji,
.tale-card.selected .card-emoji {
  opacity: 1;
  transform: scale(1.1);
}

/* ==========================================================================
   Detail Dossier Panel
   ========================================================================== */
#panel-detail {
  position: absolute;
  bottom: 72px;
  left: 50%;
  transform: translateX(-50%);
  width: 680px;
  max-width: calc(100vw - 360px);
  overflow: hidden;
}

#panel-detail.collapsed { display: none !important; }

.dossier-panel {
  border-color: var(--border-strong);
}

.detail-content {
  display: flex;
  flex-direction: column;
  height: 100%;
}

.dossier-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  background: rgba(0, 0, 0, 0.2);
}

.dossier-stamp {
  display: flex;
  align-items: center;
  gap: 8px;
}

.stamp-label {
  font-family: var(--font-body);
  font-size: 10px;
  letter-spacing: 0;
  color: var(--text-muted);
  text-transform: none;
}

.stamp-id {
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 500;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid rgba(201, 169, 110, 0.26);
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  letter-spacing: 0;
}

.close-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-dim);
  font-size: 18px;
  line-height: 1;
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition-fast);
  display: flex;
  align-items: center;
  justify-content: center;
}

.close-btn:hover {
  color: var(--wax);
  border-color: rgba(212, 104, 104, 0.32);
  background: rgba(212, 104, 104, 0.08);
}

.detail-grid {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 20px;
  padding: 16px 18px 18px;
}

.detail-visual {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.visual-container {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  border-radius: var(--radius-md);
  overflow: hidden;
  background: #000;
  border: 1px solid var(--border);
}

.visual-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
  filter: saturate(0.9) contrast(1.05);
}

.visual-vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(7, 6, 15, 0.68) 100%);
  pointer-events: none;
  z-index: 1;
}

.illustration-fallback {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle, rgba(139, 126, 200, 0.07) 0%, rgba(7, 6, 15, 0.95) 100%);
}

.occult-symbol {
  font-size: 40px;
  filter: drop-shadow(0 0 8px rgba(201, 169, 110, 0.32));
  animation: pulse-glow 3.5s infinite ease-in-out;
}

.metadata-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.meta-item {
  background: rgba(0, 0, 0, 0.25);
  border: 1px solid var(--border);
  padding: 6px 8px;
  border-radius: var(--radius-sm);
}

.meta-label {
  display: block;
  font-family: var(--font-body);
  font-size: 10px;
  letter-spacing: 0;
  text-transform: none;
  color: var(--text-muted);
  margin-bottom: 2px;
}

.meta-value {
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 500;
}

.meta-era { color: var(--parchment); }
.meta-type { color: var(--spectral); }

.detail-info {
  display: flex;
  flex-direction: column;
  min-height: 0;
  gap: 10px;
}

.detail-title-block {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.detail-emoji {
  font-size: 28px;
  line-height: 1;
  padding: 6px;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  flex-shrink: 0;
}

.detail-title-text h3 {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--parchment);
  line-height: 1.25;
  margin-bottom: 4px;
}

.detail-location {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--text-muted);
}

.detail-location svg { color: var(--spectral); opacity: 0.7; flex-shrink: 0; }

.detail-body {
  flex: 1;
  font-size: 13px;
  line-height: 1.65;
  color: rgba(235, 230, 242, 0.82);
  overflow-y: auto;
  max-height: 88px;
  padding-right: 8px;
}

.detail-body p {
  text-align: justify;
  hyphens: auto;
}

.detail-footer-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  margin-top: auto;
}

.detail-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.action-btn-ghost {
  background: transparent;
  border: 1px solid var(--border-strong);
  color: var(--parchment);
  box-shadow: none;
}

.action-btn-ghost:hover {
  background: var(--accent-soft);
  border-color: var(--border-active);
  color: var(--accent);
  box-shadow: 0 0 10px var(--accent-glow);
}

.action-btn-ghost.is-speaking {
  border-color: var(--border-active);
  color: var(--accent);
  background: var(--accent-soft);
}

.detail-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  flex: 1;
  min-width: 0;
}

.detail-tag {
  font-family: var(--font-body);
  font-size: 10px;
  letter-spacing: 0;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--border);
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  transition: var(--transition-fast);
  cursor: default;
}

.detail-tag:hover {
  border-color: var(--border-strong);
  color: var(--parchment);
}

.action-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(201, 169, 110, 0.12);
  border: 1px solid var(--border-active);
  color: var(--accent-bright);
  padding: 8px 14px;
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  border-radius: var(--radius-md);
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: var(--transition-fast);
  box-shadow: 0 2px 12px var(--accent-glow);
}

.action-btn:hover {
  background: rgba(201, 169, 110, 0.22);
  color: #f0e6c8;
  transform: translateY(-1px);
  box-shadow: 0 4px 16px var(--accent-glow);
}

.action-btn svg { opacity: 0.8; }

/* ==========================================================================
   Bottom Filter Panel
   ========================================================================== */
#panel-filter {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 780px;
  max-width: calc(100vw - 360px);
}

.filter-content {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
}

.filter-label {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  flex-shrink: 0;
}

.tag-cloud {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  justify-content: flex-start;
  max-height: 52px;
  overflow: hidden;
  flex: 1;
}

.tag-pill {
  font-family: var(--font-body);
  font-size: 10px;
  background: rgba(0, 0, 0, 0.25);
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 4px 10px;
  border-radius: 20px;
  cursor: pointer;
  transition: var(--transition-fast);
  white-space: nowrap;
}

.tag-pill:hover {
  border-color: var(--border-strong);
  color: var(--parchment);
  background: rgba(200, 188, 224, 0.06);
}

.tag-pill.active {
  background: var(--accent-soft);
  border-color: var(--border-active);
  color: var(--accent);
  box-shadow: 0 0 8px var(--accent-glow);
}

/* ==========================================================================
   Tooltip
   ========================================================================== */
.tooltip {
  position: absolute;
  background: var(--panel-raised);
  border: 1px solid var(--border-strong);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  font-family: var(--font-body);
  font-size: 11px;
  color: var(--parchment);
  z-index: 999;
  pointer-events: none;
  backdrop-filter: blur(8px);
  transition: opacity 0.15s ease;
}

.tooltip.hidden { opacity: 0; }

/* ==========================================================================
   Animations
   ========================================================================== */
@keyframes pulse-glow {
  0%, 100% { filter: drop-shadow(0 0 4px rgba(201, 169, 110, 0.2)); }
  50% { filter: drop-shadow(0 0 12px rgba(201, 169, 110, 0.48)); }
}

@keyframes fade-up {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

  <script>
    (function() {
      window.showDiagnosticError = function(msg, category = 'General') {
        const overlay = document.getElementById("diagnostics-overlay");
        const content = document.getElementById("diagnostics-content");
        if (overlay && content) {
          overlay.style.display = "block";
          content.innerHTML += `<div style="margin-bottom: 8px; border-left: 3px solid #ef4444; padding-left: 10px;">
            <strong>[${category}]</strong> ${msg}
          </div>`;
        }
        console.error(`[${category}]`, msg);
      };

      window.onerror = function(message, source, lineno, colno, error) {
        const file = source ? source.split('/').pop() : 'unknown';
        window.showDiagnosticError(`${message} at ${file}:${lineno}:${colno}`, 'JS Crash');
        return false;
      };

      window.onunhandledrejection = function(event) {
        window.showDiagnosticError(event.reason || 'Unhandled Promise Rejection', 'Promise Reject');
      };
    })();
  </script>

  // ─── Math helpers (zero alloc hot path) ─────────────────────────────────────
  const _v0 = new THREE.Vector3();
  const _v1 = new THREE.Vector3();
  const _v2 = new THREE.Vector3();
  const _m0 = new THREE.Matrix4();

  function latLonToVec3(lat, lon, radius, out) {
    const o = out || _v0;
    const radLat = (lat * Math.PI) / 180;
    const radLon = (lon * Math.PI) / 180;
    const cosLat = Math.cos(radLat);
    o.x = radius * cosLat * Math.sin(radLon);
    o.y = radius * Math.sin(radLat);
    o.z = radius * cosLat * Math.cos(radLon);
    return o;
  }

  function clampTilt(x) {
    return Math.max(-CFG.maxTilt, Math.min(CFG.maxTilt, x));
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function shortestAngleDelta(from, to) {
    let d = to - from;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
  }

  // ─── GeoJSON helpers ──────────────────────────────────────────────────────
  function featureBBox(geometry) {
    let minLon = Infinity, minLat = Infinity, maxLon = -Infinity, maxLat = -Infinity;
    const rings = geometry.type === "Polygon"
      ? geometry.coordinates
      : geometry.coordinates.flat(1);

    for (const ring of rings) {
      for (const [lon, lat] of ring) {
        if (lon < minLon) minLon = lon;
        if (lat < minLat) minLat = lat;
        if (lon > maxLon) maxLon = lon;
        if (lat > maxLat) maxLat = lat;
      }
    }
    return { minLon, minLat, maxLon, maxLat };
  }

  function pointInPolygon(point, ring) {
    const x = point[0], y = point[1];
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const xi = ring[i][0], yi = ring[i][1];
      const xj = ring[j][0], yj = ring[j][1];
      if (((yi > y) !== (yj > y)) && (x < ((xj - xi) * (y - yi)) / (yj - yi) + xi)) {
        inside = !inside;
      }
    }
    return inside;
  }

  function pointInGeometry(point, geometry) {
    if (geometry.type === "Polygon") {
      return pointInPolygon(point, geometry.coordinates[0]);
    }
    if (geometry.type === "MultiPolygon") {
      return geometry.coordinates.some((poly) => pointInPolygon(point, poly[0]));
    }
    return false;
  }

  function drawPolygonRings(rings, ctx, w, h) {
    rings.forEach((ring, idx) => {
      ctx.fillStyle = idx === 0 ? "#ffffff" : "#000000";
      ctx.beginPath();
      ring.forEach(([lon, lat], i) => {
        const x = ((lon + 180) / 360) * w;
        const y = ((90 - lat) / 180) * h;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
    });
  }

  function collectBorderSegments(geojson, segments) {
    const pushRing = (ring) => {
      for (let i = 0; i < ring.length - 1; i++) {
        const a = ring[i], b = ring[i + 1];
        latLonToVec3(a[1], a[0], CFG.radius + 0.15, _v1);
        latLonToVec3(b[1], b[0], CFG.radius + 0.15, _v2);
        segments.push(_v1.x, _v1.y, _v1.z, _v2.x, _v2.y, _v2.z);
      }
    };

    for (const feature of geojson.features) {
      const geom = feature.geometry;
      if (!geom) continue;
      if (geom.type === "Polygon") {
        geom.coordinates.forEach(pushRing);
      } else if (geom.type === "MultiPolygon") {
        geom.coordinates.forEach((poly) => poly.forEach(pushRing));
      }
    }
  }

  // ─── Texture factories ────────────────────────────────────────────────────
  function createCircleTexture() {
    const size = 16;
    const canvas = document.createElement("canvas");
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(size / 2, size / 2, size / 2 - 1, 0, Math.PI * 2);
    ctx.fill();
    return new THREE.CanvasTexture(canvas);
  }

  // ─── Globe Engine ─────────────────────────────────────────────────────────
  class GlobeEngine {
    constructor() {
      this.tales = [];
      this.markers = [];
      this.geojson = null;
      this.countryIndex = [];

      this.scene = null;
      this.camera = null;
      this.renderer = null;
      this.controls = null;
      this.globeGroup = null;
      this.auroraMaterial = null;

      this.container = null;
      this.markerContainer = null;
      this.tooltip = null;

      this.isAutoRotating = true;
      this.isPageVisible = true;
      this.frameCount = 0;
      this.lastTime = 0;

      this.cachedVisibleIds = null;
      this.cachedSelectedId = null;

      this.headerLocationEl = null;
      this.headerCountryEl = null;
      this.lastHeaderText = "";

      this.drag = {
        active: false,
        pointerId: null,
        lastX: 0,
        lastY: 0,
        lastTime: 0,
        velX: 0,
        velY: 0
      };

      this.fly = {
        active: false,
        progress: 0,
        startRotY: 0,
        startRotX: 0,
        endRotY: 0,
        endRotX: 0,
        startCam: new THREE.Vector3(),
        endCam: new THREE.Vector3()
      };

      this._scratchProject = new THREE.Vector3();
      this._scratchDir = new THREE.Vector3();
      this._scratchLocal = new THREE.Vector3();
      this._scratchNormal = new THREE.Vector3();
      this._scratchToCam = new THREE.Vector3();
    }

    // ── Init ────────────────────────────────────────────────────────────────
    init(talesList) {
      this.tales = talesList;
      this.container = document.getElementById("globe-container");
      this.markerContainer = document.getElementById("marker-container");
      this.tooltip = document.getElementById("tooltip");

      if (!this._checkEnvironment()) return;

      this._buildScene();
      this._setupDrag();
      this._loadGeoJson();

      document.addEventListener("visibilitychange", () => {
        this.isPageVisible = !document.hidden;
        if (this.isPageVisible) this.lastTime = performance.now();
      });

      window.addEventListener("resize", () => this._onResize());
    }

    _checkEnvironment() {
      if (typeof THREE === "undefined") {
        window.showDiagnosticError?.("Three.js library is not loaded.", "CDN Crash");
        return false;
      }
      if (typeof THREE.OrbitControls === "undefined") {
        window.showDiagnosticError?.("THREE.OrbitControls is not loaded.", "CDN Crash");
        return false;
      }
      try {
        const c = document.createElement("canvas");
        if (!c.getContext("webgl") && !c.getContext("experimental-webgl")) {
          throw new Error("WebGL unavailable");
        }
      } catch (err) {
        window.showDiagnosticError?.("WebGL unsupported: " + err.message, "WebGL Failure");
        return false;
      }
      return true;
    }

    _buildScene() {
      this.scene = new THREE.Scene();

      this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
      this.camera.position.set(CFG.cameraDefault.x, CFG.cameraDefault.y, CFG.cameraDefault.z);

      this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      this.renderer.setPixelRatio(window.devicePixelRatio);
      this.renderer.setSize(window.innerWidth, window.innerHeight);
      this.renderer.setClearColor(0x07060f, 1);
      this.container.appendChild(this.renderer.domElement);

      this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
      this.controls.target.set(0, 0, 0);
      this.controls.enableRotate = false;
      this.controls.enablePan = false;
      this.controls.enableDamping = true;
      this.controls.dampingFactor = 0.08;
      this.controls.zoomSpeed = 0.85;
      this.controls.minDistance = 150;
      this.controls.maxDistance = 500;

      this.globeGroup = new THREE.Group();
      this.scene.add(this.globeGroup);

      // Occluder — hides back-side land particles
      const inner = new THREE.Mesh(
        new THREE.SphereGeometry(CFG.innerRadius, 32, 32),
        new THREE.MeshBasicMaterial({ color: 0x07060f })
      );
      this.globeGroup.add(inner);

      // Fresnel atmosphere shell
      const atmos = new THREE.Mesh(
        new THREE.SphereGeometry(CFG.radius * 1.018, 48, 48),
        new THREE.ShaderMaterial({
          vertexShader: ATMOS_VS,
          fragmentShader: ATMOS_FS,
          transparent: true,
          blending: THREE.AdditiveBlending,
          side: THREE.BackSide,
          depthWrite: false
        })
      );
      this.scene.add(atmos);

      // Aurora
      this.auroraMaterial = new THREE.ShaderMaterial({
        vertexShader: AURORA_VS,
        fragmentShader: AURORA_FS,
        uniforms: { uTime: { value: 0 } },
        transparent: true,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const aurora = new THREE.Mesh(
        new THREE.CylinderGeometry(30, 42, 12, 48, 6, true),
        this.auroraMaterial
      );
      aurora.position.y = 95;
      this.globeGroup.add(aurora);

      // Lat/lon wire grid
      const grid = new THREE.Mesh(
        new THREE.SphereGeometry(CFG.radius, 20, 20),
        new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.012 })
      );
      this.globeGroup.add(grid);

      // Starfield
      const starPos = new Float32Array(900 * 3);
      for (let i = 0; i < 900; i++) {
        const r = 800 + Math.random() * 600;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(Math.random() * 2 - 1);
        starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        starPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        starPos[i * 3 + 2] = r * Math.cos(phi);
      }
      const stars = new THREE.Points(
        new THREE.BufferGeometry().setAttribute("position", new THREE.BufferAttribute(starPos, 3)),
        new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, transparent: true, opacity: 0.45, sizeAttenuation: false })
      );
      this.scene.add(stars);
    }

    _applyGeoJson(geojson) {
      this.geojson = geojson;
      this._buildCountryIndex(geojson);
      this._buildLandParticles(geojson);
      this._buildMergedBorders(geojson);
      this._createMarkers();
      this._startLoop();
    }

    _loadGeoJson() {
      if (window.__WORLD_GEOJSON__) {
        try {
          this._applyGeoJson(window.__WORLD_GEOJSON__);
          return;
        } catch (err) {
          console.error("Embedded GeoJSON invalid:", err);
        }
      }

      fetch("./world.json")
        .then((res) => {
          if (!res.ok) throw new Error("world.json not found");
          return res.json();
        })
        .then((geojson) => this._applyGeoJson(geojson))
        .catch((err) => {
          console.error("GeoJSON load failed:", err);
          this._buildFallbackLand();
          this._createMarkers();
          this._startLoop();
        });
    }

    _buildCountryIndex(geojson) {
      this.countryIndex = geojson.features
        .filter((f) => f.geometry)
        .map((f) => ({
          name: f.properties?.NAME || "Unknown",
          geometry: f.geometry,
          bbox: featureBBox(f.geometry)
        }))
        .sort((a, b) => {
          const areaA = (a.bbox.maxLon - a.bbox.minLon) * (a.bbox.maxLat - a.bbox.minLat);
          const areaB = (b.bbox.maxLon - b.bbox.minLon) * (b.bbox.maxLat - b.bbox.minLat);
          return areaA - areaB;
        });
    }

    _buildLandParticles(geojson) {
      const { mapScanWidth: w, mapScanHeight: h, mapScanStep: step } = CFG;
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#fff";

      for (const feature of geojson.features) {
        if (!feature.geometry) continue;
        const { type, coordinates } = feature.geometry;
        if (type === "Polygon") drawPolygonRings(coordinates, ctx, w, h);
        else if (type === "MultiPolygon") coordinates.forEach((poly) => drawPolygonRings(poly, ctx, w, h));
      }

      const data = ctx.getImageData(0, 0, w, h).data;
      const positions = [];

      for (let y = 0; y < h; y += step) {
        for (let x = 0; x < w; x += step) {
          if (data[(y * w + x) * 4] > 128) {
            const lon = (x / w) * 360 - 180;
            const lat = 90 - (y / h) * 180;
            latLonToVec3(lat, lon, CFG.radius, _v0);
            positions.push(_v0.x, _v0.y, _v0.z);
          }
        }
      }

      const points = new THREE.Points(
        new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(positions, 3)),
        new THREE.PointsMaterial({
          size: 1.1,
          color: 0xffffff,
          map: createCircleTexture(),
          transparent: true,
          opacity: 0.9,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      this.globeGroup.add(points);
    }

    _buildMergedBorders(geojson) {
      const segments = [];
      collectBorderSegments(geojson, segments);
      if (!segments.length) return;

      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(segments, 3));
      const borders = new THREE.LineSegments(
        geo,
        new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.14 })
      );
      this.globeGroup.add(borders);
    }

    _buildFallbackLand() {
      const positions = [];
      for (let i = 0; i < 3000; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(Math.random() * 2 - 1);
        positions.push(
          CFG.radius * Math.sin(phi) * Math.cos(theta),
          CFG.radius * Math.sin(phi) * Math.sin(theta),
          CFG.radius * Math.cos(phi)
        );
      }
      this.globeGroup.add(new THREE.Points(
        new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(positions, 3)),
        new THREE.PointsMaterial({ size: 1.1, color: 0xffffff, map: createCircleTexture(), transparent: true, opacity: 0.85 })
      ));
    }

    // ── Markers ─────────────────────────────────────────────────────────────
    _createMarkers() {
      for (const tale of this.tales) {
        const localPos = latLonToVec3(tale.coords.lat, tale.coords.lon, CFG.radius, new THREE.Vector3());
        const el = document.createElement("div");
        el.className = "map-marker";
        el.dataset.id = tale.id;
        const emojiEl = document.createElement("span");
        emojiEl.className = "marker-emoji";
        emojiEl.textContent = tale.emoji;
        el.appendChild(emojiEl);

        emojiEl.addEventListener("click", (e) => {
          e.stopPropagation();
          window.selectTaleFromMap?.(tale.id);
        });
        emojiEl.addEventListener("mouseenter", () => {
          this.tooltip.innerHTML = `<strong>${tale.title || tale.id}</strong><br><span style='font-size:10px;color:#94a3b8;'>📍 ${tale.location || ""}</span>`;
          this.tooltip.classList.remove("hidden");
        });
        emojiEl.addEventListener("mousemove", (e) => {
          this.tooltip.style.left = `${e.clientX + 15}px`;
          this.tooltip.style.top = `${e.clientY + 15}px`;
        });
        emojiEl.addEventListener("mouseleave", () => this.tooltip.classList.add("hidden"));

        this.markerContainer.appendChild(el);
        this.markers.push({
          id: tale.id,
          element: el,
          localPos,
          _cache: { visible: null, selected: null, x: 0, y: 0, scale: 0 }
        });
      }
    }

    refreshFilterCache() {
      this.cachedVisibleIds = new Set((window.getVisibleTales?.() ?? []).map((t) => t.id));
      this.cachedSelectedId = window.getSelectedTaleId?.() ?? null;
    }

    updateMarkers() {
      if (!this.camera || !this.globeGroup) return;
      if (!this.cachedVisibleIds) this.refreshFilterCache();

      for (const marker of this.markers) {
        this._scratchProject.copy(marker.localPos).applyMatrix4(this.globeGroup.matrixWorld);

        this._scratchToCam.copy(this._scratchProject).sub(this.camera.position).normalize();
        this._scratchNormal.copy(this._scratchProject).normalize();
        const facing = this._scratchToCam.dot(this._scratchNormal);

        const filtered = !this.cachedVisibleIds.has(marker.id);
        const selected = marker.id === this.cachedSelectedId;
        const show = facing <= -0.15 && !filtered;
        const c = marker._cache;

        if (!show) {
          if (c.visible !== false) { marker.element.style.display = "none"; c.visible = false; }
          continue;
        }

        if (c.visible !== true) { marker.element.style.display = "flex"; c.visible = true; }
        if (c.selected !== selected) { marker.element.classList.toggle("selected", selected); c.selected = selected; }

        const dist = this.camera.position.distanceTo(this._scratchProject);
        const scale = Math.max(0.6, Math.min(1.0, 300 / dist));
        this._scratchProject.project(this.camera);

        const x = (this._scratchProject.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-(this._scratchProject.y * 0.5) + 0.5) * window.innerHeight;

        if (Math.abs(c.x - x) > 0.5 || Math.abs(c.y - y) > 0.5 || Math.abs(c.scale - scale) > 0.01) {
          marker.element.style.left = `${x}px`;
          marker.element.style.top = `${y}px`;
          marker.element.style.transform = `translate(-50%, -50%) scale(${scale})`;
          c.x = x; c.y = y; c.scale = scale;
        }

        const z = selected ? "50" : "10";
        if (marker.element.style.zIndex !== z) marker.element.style.zIndex = z;
      }
    }

    _cancelFly() {
      if (!this.fly.active) return;
      this.fly.active = false;
      if (this.controls) this.controls.enableZoom = true;
    }

    // ── Drag & inertia ──────────────────────────────────────────────────────
    _dragZoomScale() {
      if (!this.camera || !this.controls) return 1;
      const dist = this.camera.position.distanceTo(this.controls.target);
      return dist / CFG.cameraDefault.z;
    }

    _setupDrag() {
      const canvas = this.renderer.domElement;
      canvas.style.cursor = "grab";

      const applyDelta = (clientX, clientY, dt) => {
        const dx = clientX - this.drag.lastX;
        const dy = clientY - this.drag.lastY;
        this.drag.lastX = clientX;
        this.drag.lastY = clientY;
        this.drag.lastTime = performance.now();
        if (!dx && !dy) return;

        const zoomScale = this._dragZoomScale();
        const rotY = dx * CFG.dragSensY * zoomScale;
        const rotX = dy * CFG.dragSensX * zoomScale;
        this.globeGroup.rotation.y += rotY;
        this.globeGroup.rotation.x = clampTilt(this.globeGroup.rotation.x + rotX);
        const safeDt = Math.max(dt, 0.008);
        this.drag.velY = rotY / safeDt;
        this.drag.velX = rotX / safeDt;
      };

      canvas.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        // Ignore if OrbitControls or a marker consumed the event
        if (e.target !== canvas) return;

        e.preventDefault();
        this._cancelFly();
        this.drag.velX = this.drag.velY = 0;

        this.drag.active = true;
        this.drag.pointerId = e.pointerId;
        this.drag.lastX = e.clientX;
        this.drag.lastY = e.clientY;
        this.drag.lastTime = performance.now();
        this.drag.velX = this.drag.velY = 0;

        canvas.setPointerCapture(e.pointerId);
        canvas.style.cursor = "grabbing";
        this._pauseAutoRotate();
      }, true);

      canvas.addEventListener("pointermove", (e) => {
        if (!this.drag.active || e.pointerId !== this.drag.pointerId) return;
        const dt = (performance.now() - this.drag.lastTime) / 1000;
        applyDelta(e.clientX, e.clientY, dt);
      });

      const endDrag = (e) => {
        if (!this.drag.active || e.pointerId !== this.drag.pointerId) return;
        this.drag.active = false;
        this.drag.pointerId = null;
        if (canvas.hasPointerCapture(e.pointerId)) {
          canvas.releasePointerCapture(e.pointerId);
        }
        canvas.style.cursor = "grab";
      };

      canvas.addEventListener("pointerup", endDrag);
      canvas.addEventListener("pointercancel", endDrag);
    }

    _hasInertia() {
      return Math.abs(this.drag.velX) > CFG.minInertia || Math.abs(this.drag.velY) > CFG.minInertia;
    }

    _updateInertia(dt) {
      if (this.drag.active || this.fly.active || !this._hasInertia()) return;
      this.globeGroup.rotation.y += this.drag.velY * dt;
      this.globeGroup.rotation.x = clampTilt(this.globeGroup.rotation.x + this.drag.velX * dt);
      const decay = Math.pow(CFG.inertiaDamping, dt * 60);
      this.drag.velY *= decay;
      this.drag.velX *= decay;
    }

    _pauseAutoRotate() {
      if (!this.isAutoRotating) return;
      this.isAutoRotating = false;
      window.setAutoRotateActive?.(false);
    }

    // ── Fly-to (globe spin + camera) ────────────────────────────────────────
    flyTo(lat, lon) {
      if (!this.camera || !this.globeGroup) return;

      this.isAutoRotating = false;
      this.drag.velX = this.drag.velY = 0;
      if (this.controls) {
        this.controls.enableZoom = false;
      }
      window.setAutoRotateActive?.(false);

      latLonToVec3(lat, lon, 1, _v0);

      // Spin globe so target faces the camera (+Z hemisphere)
      this.fly.startRotY = this.globeGroup.rotation.y;
      this.fly.startRotX = this.globeGroup.rotation.x;
      this.fly.endRotY = -Math.atan2(_v0.x, _v0.z);
      this.fly.endRotX = clampTilt(Math.asin(_v0.y) * 0.55);
      this.fly.startCam.copy(this.camera.position);

      const flyDist = Math.min(this.camera.position.length(), CFG.cameraFlyDistance);
      this.fly.endCam.set(0, CFG.cameraDefault.y * (flyDist / CFG.cameraDefault.z), flyDist);

      this.fly.progress = 0;
      this.fly.active = true;
    }

    _updateFly(dt) {
      if (!this.fly.active) return;

      this.fly.progress += dt / CFG.flyDuration;
      if (this.fly.progress >= 1) {
        this.fly.progress = 1;
        this.fly.active = false;
        this.globeGroup.rotation.y = this.fly.endRotY;
        this.globeGroup.rotation.x = this.fly.endRotX;
        this.camera.position.copy(this.fly.endCam);
        if (this.controls) this.controls.enableZoom = true;
        this.controls?.update();
        return;
      }

      const t = easeOutCubic(this.fly.progress);
      this.globeGroup.rotation.y = this.fly.startRotY + shortestAngleDelta(this.fly.startRotY, this.fly.endRotY) * t;
      this.globeGroup.rotation.x = this.fly.startRotX + (this.fly.endRotX - this.fly.startRotX) * t;
      this.camera.position.lerpVectors(this.fly.startCam, this.fly.endCam, t);
      this.controls?.update();
    }

    // ── Country detection ───────────────────────────────────────────────────
    detectCountry(lat, lon) {
      if (!this.countryIndex.length) return null;
      const point = [lon, lat];

      for (const entry of this.countryIndex) {
        const { minLon, minLat, maxLon, maxLat } = entry.bbox;
        if (lon < minLon || lon > maxLon || lat < minLat || lat > maxLat) continue;
        if (pointInGeometry(point, entry.geometry)) return entry.name;
      }
      return null;
    }

    updateHeaderLocation() {
      if (!this.camera) return;
      if (!this.headerLocationEl) {
        this.headerLocationEl = document.getElementById("header-location");
        this.headerCountryEl = document.getElementById("detected-country-name");
      }
      if (!this.headerLocationEl || !this.headerCountryEl) return;

      const lon = Math.atan2(this._scratchLocal.x, this._scratchLocal.z) * (180 / Math.PI);
      const country = this.detectCountry(lat, lon);

      if (country) {

      this._updateFly(dt);

      if (this.frameCount % CFG.countryCheckInterval === 0) {

      this.updateMarkers();

const taleMap = new Map(strangeTales.map(t => [t.id, t]));

// 2. APP STATE
const state = {
  selectedTaleId: null,
  filters: {
    eras: [],
    types: [],
    tags: []
  },
  searchQuery: ""
};

// Expose state helpers directly on window (used by globe.js)
window.getVisibleTales = () => getFilteredTales();
window.getSelectedTaleId = () => state.selectedTaleId;
window.getTaleById = (id) => taleMap.get(id);
window.setAutoRotateActive = (active) => {
  const btn = document.getElementById("btn-auto-rotate");
  if (btn) btn.classList.toggle("active", active);
};

function syncGlobe() {
  window.updateMapMarkers?.();
}

function flyToTale(id) {
  const tale = taleMap.get(id);
  if (tale?.coords) {
    window.flyToCoordinate?.(tale.coords.lat, tale.coords.lon);
  }
}

function clearSelection() {
  state.selectedTaleId = null;
  renderList();
  updateDetailPanel();
  syncGlobe();
}

// ==========================================================================
// BROADCAST ENGINE
// ==========================================================================

const broadcast = {
  active: false,
  loop: false,
  paused: false,
  muted: false,
  index: 0,
  queue: [],
  advanceTimer: null,
  _programmatic: false
};

const BROADCAST_PAUSE_MS = 2800;
const BROADCAST_MUTED_MS = 9000;
const BROADCAST_RATE = 0.92;
const BROADCAST_PITCH = 0.9;

function buildBroadcastScript(tale) {
  const era = eraNames[tale.era] || tale.era;
  const type = typeNames[tale.type] || tale.type;
  return `${tale.title}。位于${tale.location}。分类：${type}，时代：${era}。${tale.desc}`;
}

function refreshBroadcastQueue() {
  broadcast.queue = getFilteredTales();
  if (broadcast.queue.length === 0) {
    broadcast.index = 0;
    return;
  }
  if (broadcast.index >= broadcast.queue.length) {
    broadcast.index = 0;
  }
}

function getChineseVoices() {
  const voices = window.speechSynthesis?.getVoices() || [];
  const zhVoices = voices.filter(v => v.lang.startsWith("zh"));
  return zhVoices.length ? zhVoices : voices;
}

function scoreChineseVoice(voice) {
  const hint = `${voice.name} ${voice.voiceURI}`.toLowerCase();
  let score = 0;
  if (voice.lang === "zh-CN") score += 12;
  else if (voice.lang.startsWith("zh")) score += 8;
  if (/yunxi|kangkang|yunyang|yunjian|male|男/.test(hint)) score += 10;
  if (/xiaoxiao|huihui|xiaoyi|tingting/.test(hint)) score += 4;
  if (/google/.test(hint)) score += 3;
  if (voice.localService) score += 2;
  return score;
}

function getDefaultChineseVoice() {
  const voices = getChineseVoices().filter(v => v.lang.startsWith("zh"));
  if (!voices.length) return getChineseVoices()[0] || null;
  return [...voices].sort((a, b) => scoreChineseVoice(b) - scoreChineseVoice(a))[0];
}

function speakText(script, onComplete) {
  const done = () => onComplete?.();

  if (broadcast.muted || !window.speechSynthesis) {
    broadcast.advanceTimer = setTimeout(done, BROADCAST_MUTED_MS);
    return;
  }

  stopSpeech();
  const utterance = new SpeechSynthesisUtterance(script);
  utterance.lang = "zh-CN";
  utterance.rate = BROADCAST_RATE;
  utterance.pitch = BROADCAST_PITCH;

  const voice = getDefaultChineseVoice();
  if (voice) {
    utterance.voice = voice;
    utterance.lang = voice.lang;
  }

  utterance.onend = done;
  utterance.onerror = done;
  window.speechSynthesis.speak(utterance);
}

function clearBroadcastTimers() {
  clearTimeout(broadcast.advanceTimer);
  broadcast.advanceTimer = null;
}

function stopSpeech() {
  clearBroadcastTimers();
  window.speechSynthesis?.cancel();
}

function setBroadcastPanelVisible(visible) {
  document.getElementById("broadcast-panel")?.classList.toggle("hidden", !visible);
}

function setBroadcastPausedUI(paused) {
  const panel = document.getElementById("broadcast-panel");
  panel?.classList.toggle("is-paused", paused);
  const pauseBtn = document.getElementById("btn-broadcast-pause");
  if (pauseBtn) {
    pauseBtn.title = paused ? "继续" : "暂停";
    pauseBtn.innerHTML = paused
      ? `<svg viewBox="0 0 24 24" width="12" height="12"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>`
      : `<svg viewBox="0 0 24 24" width="12" height="12"><path fill="currentColor" d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/></svg>`;
  }
}

function setBroadcastMuteUI() {
  const muteBtn = document.getElementById("btn-broadcast-mute");
  muteBtn?.classList.toggle("active", broadcast.muted);
  if (muteBtn) {
    muteBtn.title = broadcast.muted ? "取消静音" : "静音";
    muteBtn.innerHTML = broadcast.muted
      ? `<svg viewBox="0 0 24 24" width="12" height="12"><path fill="currentColor" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>`
      : `<svg viewBox="0 0 24 24" width="12" height="12"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>`;
  }
}

function updateBroadcastUI(tale, message) {
  const metaEl = document.getElementById("broadcast-meta");
  const textEl = document.getElementById("broadcast-text");
  if (!metaEl || !textEl) return;

  if (!tale) {
    metaEl.textContent = "暂无播报";
    textEl.textContent = message || "当前筛选条件下无可播报的异象档案。";
    return;
  }

  metaEl.textContent = `${tale.emoji} ${tale.title} · ${tale.location}`;
  textEl.textContent = buildBroadcastScript(tale);
  textEl.classList.remove("is-updating");
  void textEl.offsetWidth;
  textEl.classList.add("is-updating");
}

function setSelectedTale(id, flyTo = true) {
  broadcast._programmatic = true;
  state.selectedTaleId = id;
  renderList();
  updateDetailPanel();
  syncGlobe();
  if (id && flyTo) flyToTale(id);
  broadcast._programmatic = false;
}

function scheduleNextBroadcast() {
  if (!broadcast.active || broadcast.paused || !broadcast.loop) return;
  if (broadcast.queue.length === 0) return;
  clearBroadcastTimers();
  broadcast.advanceTimer = setTimeout(() => {
    broadcast.index = (broadcast.index + 1) % broadcast.queue.length;
    playBroadcastItem();
  }, BROADCAST_PAUSE_MS);
}

function speakBroadcast(tale, onComplete) {
  const done = () => {
    document.getElementById("btn-broadcast-one")?.classList.remove("is-speaking");
    onComplete?.();
  };

  if (broadcast.muted || !window.speechSynthesis) {
    broadcast.advanceTimer = setTimeout(done, BROADCAST_MUTED_MS);
    return;
  }

  speakText(buildBroadcastScript(tale), done);
}

function playBroadcastItem() {
  if (!broadcast.active || broadcast.paused) return;

  refreshBroadcastQueue();
  if (broadcast.queue.length === 0) {
    updateBroadcastUI(null);
    return;
  }

  const tale = broadcast.queue[broadcast.index];
  setSelectedTale(tale.id, true);
  updateBroadcastUI(tale);

  speakBroadcast(tale, () => {
    if (broadcast.loop) scheduleNextBroadcast();
  });
}

function startBroadcastLoop() {
  broadcast.active = true;
  broadcast.loop = true;
  broadcast.paused = false;
  refreshBroadcastQueue();
  setBroadcastPanelVisible(true);
  setBroadcastPausedUI(false);
  document.getElementById("btn-broadcast")?.classList.add("active");

  if (broadcast.queue.length === 0) {
    updateBroadcastUI(null);
    return;
  }

  if (state.selectedTaleId) {
    const idx = broadcast.queue.findIndex(t => t.id === state.selectedTaleId);
    if (idx >= 0) broadcast.index = idx;
  }

  playBroadcastItem();
}

function broadcastCurrentTale() {
  if (!state.selectedTaleId) return;

  const tale = taleMap.get(state.selectedTaleId);
  if (!tale) return;

  stopBroadcast(false);
  broadcast.active = true;
  broadcast.loop = false;
  broadcast.paused = false;
  setBroadcastPanelVisible(true);
  setBroadcastPausedUI(false);
  document.getElementById("btn-broadcast")?.classList.add("active");
  document.getElementById("btn-broadcast-one")?.classList.add("is-speaking");

  setSelectedTale(tale.id, true);
  updateBroadcastUI(tale);
  speakBroadcast(tale, () => {});
}

function pauseBroadcast() {
  if (!broadcast.active) return;
  broadcast.paused = true;
  stopSpeech();
  setBroadcastPausedUI(true);
}

function resumeBroadcast() {
  if (!broadcast.active) return;
  broadcast.paused = false;
  setBroadcastPausedUI(false);
  if (window.speechSynthesis?.paused) {
    window.speechSynthesis.resume();
    return;
  }
  if (!window.speechSynthesis?.speaking) {
    playBroadcastItem();
  }
}

function toggleBroadcastPause() {
  if (!broadcast.active) return;
  if (broadcast.paused) resumeBroadcast();
  else pauseBroadcast();
}

function stopBroadcast(hidePanel = true) {
  broadcast.active = false;
  broadcast.loop = false;
  broadcast.paused = false;
  stopSpeech();
  document.getElementById("btn-broadcast")?.classList.remove("active");
  document.getElementById("btn-broadcast-one")?.classList.remove("is-speaking");
  if (hidePanel) setBroadcastPanelVisible(false);
}

function toggleBroadcastLoop() {
  if (broadcast.active && broadcast.loop) {
    stopBroadcast(true);
    return;
  }
  startBroadcastLoop();
}

function stepBroadcast(delta) {
  if (!broadcast.active) return;
  refreshBroadcastQueue();
  if (broadcast.queue.length === 0) {
    updateBroadcastUI(null);
    return;
  }

  broadcast.paused = false;
  setBroadcastPausedUI(false);
  stopSpeech();

  broadcast.index = (broadcast.index + delta + broadcast.queue.length) % broadcast.queue.length;
  broadcast.loop = true;
  playBroadcastItem();
}

function toggleBroadcastMute() {
  broadcast.muted = !broadcast.muted;
  setBroadcastMuteUI();
  if (broadcast.muted) stopSpeech();
  else if (broadcast.active && !broadcast.paused) playBroadcastItem();
}

function initBroadcast() {
  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }
  setBroadcastMuteUI();
}

// ==========================================================================
// CORE FUNCTIONS & FILTER LOGIC
// ==========================================================================

// Era and Type Translation Maps for UI badges
const eraNames = {
  ancient: "远古神话",
  early_modern: "近代怪谈",
  modern: "现代都市"
};

const typeNames = {
  cryptid: "神秘生物",
  urban_legend: "都市传说",
  cursed_object: "诅咒之物",
  haunted_place: "灵异地点"
};

// Get list of tales matching current search and filter settings
function getFilteredTales() {
  const q = state.searchQuery.toLowerCase();
  return strangeTales.filter(tale => {
    const matchesSearch =
      !q ||
      tale.title.toLowerCase().includes(q) ||
      tale.location.toLowerCase().includes(q);

    if (!matchesSearch) return false;

    // Era filter match
    if (state.filters.eras.length > 0 && !state.filters.eras.includes(tale.era)) {
      return false;
    }

    // Type filter match
    if (state.filters.types.length > 0 && !state.filters.types.includes(tale.type)) {
      return false;
    }

    // Tag filter match
    if (state.filters.tags.length > 0) {
      const match = state.filters.tags.every(tag => {
        return tale.tags.includes(tag);
      });
      if (!match) return false;
    }

    return true;
  });
}

// Extract all unique tags (computed once — the dataset is static)
const allTagsCache = (() => {
  const tagsSet = new Set();
  strangeTales.forEach(tale => {
    tale.tags.forEach(tag => tagsSet.add(tag));
  });
  return Array.from(tagsSet);
})();

// ==========================================================================
// UI RENDERING CONTROLLERS
// ==========================================================================

let lastRenderedListKey = "";

function updateListSelection() {
  document.querySelectorAll("#tales-list .tale-card").forEach(card => {
    card.classList.toggle("selected", card.dataset.id === state.selectedTaleId);
  });
}

function updateListCount(count) {
  const el = document.getElementById("list-count");
  if (el) el.textContent = String(count);
}

// Render the right sidebar directory cards
function renderList() {
  const container = document.getElementById("tales-list");
  const filtered = getFilteredTales();
  const listKey = filtered.map(t => t.id).join("|");

  updateListCount(filtered.length);

  if (listKey === lastRenderedListKey) {
    updateListSelection();
    return;
  }
  lastRenderedListKey = listKey;
  container.innerHTML = "";

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="list-empty">
        <span class="list-empty-icon">📂</span>
        <p>未找到匹配的异象档案</p>
        <p>尝试调整筛选条件或搜索词</p>
      </div>`;
    return;
  }

  filtered.forEach(tale => {
    const isSelected = tale.id === state.selectedTaleId;
    const typeLabel = typeNames[tale.type] || tale.type;

    const card = document.createElement("article");
    card.className = `tale-card${isSelected ? " selected" : ""}`;
    card.dataset.id = tale.id;

    const thumbHtml = tale.image
      ? `<img src="${tale.image}" alt="" loading="lazy" onerror="this.onerror=null;this.style.display='none';this.parentNode.insertAdjacentHTML('beforeend','<div class=\\'card-fallback\\'>${tale.emoji}</div>')">`
      : `<div class="card-fallback">${tale.emoji}</div>`;

    card.innerHTML = `
      <div class="card-thumb-wrap frame-brackets">${thumbHtml}</div>
      <div class="card-body">
        <span class="card-badge">${typeLabel}</span>
        <h4>${tale.title}</h4>
        <p class="card-location">${tale.location}</p>
      </div>
      <span class="card-emoji" aria-hidden="true">${tale.emoji}</span>
    `;

    card.addEventListener("click", () => selectTale(tale.id));
    container.appendChild(card);
  });
}

// Generic filter toggle — single implementation shared by all filter groups
function toggleFilter(filterKey, value) {
  const arr = state.filters[filterKey];
  const idx = arr.indexOf(value);
  if (idx > -1) {
    arr.splice(idx, 1);
  } else {
    arr.push(value);
  }
  applyFilters();
  const pill = document.querySelector(
    `.tag-pill[data-filter-key="${filterKey}"][data-filter-id="${CSS.escape(value)}"]`
  );
  pill?.classList.toggle("active", arr.includes(value));
}

// Render the tags in the bottom filter panel
function renderFilters() {
  const container = document.getElementById("unified-tags-cloud");
  if (!container) return;
  container.innerHTML = "";

  const filterGroups = [
    { key: "eras", items: Object.entries(eraNames) },
    { key: "types", items: Object.entries(typeNames) },
    { key: "tags", items: allTagsCache.map(t => [t, "#" + t]) }
  ];

  filterGroups.forEach(({ key, items }) => {
    items.forEach(([id, label]) => {
      const isActive = state.filters[key].includes(id);
      const pill = document.createElement("button");
      pill.type = "button";
      pill.className = `tag-pill ${isActive ? "active" : ""}`;
      pill.dataset.filterKey = key;
      pill.dataset.filterId = id;
      pill.textContent = label;
      pill.addEventListener("click", () => toggleFilter(key, id));
      container.appendChild(pill);
    });
  });
}

// Update the detailed view panel at the bottom
function updateDetailPanel() {
  const detailPanel = document.getElementById("panel-detail");

  if (!state.selectedTaleId) {
    detailPanel.classList.add("collapsed");
    return;
  }

  const tale = taleMap.get(state.selectedTaleId);
  if (!tale) return;

  detailPanel.classList.remove("collapsed");

  document.getElementById("detail-id").textContent = tale.id.replace(/_/g, "-").toUpperCase();
  document.getElementById("detail-emoji").textContent = tale.emoji;
  document.getElementById("detail-title").textContent = tale.title;
  const locText = document.getElementById("detail-location-text");
  if (locText) locText.textContent = tale.location;
  document.getElementById("detail-desc").textContent = tale.desc;
  document.getElementById("detail-era").textContent = eraNames[tale.era] || tale.era;
  document.getElementById("detail-type").textContent = typeNames[tale.type] || tale.type;

  const imgEl = document.getElementById("detail-image");
  const fallbackEl = document.getElementById("detail-fallback-art");
  const fallbackEmoji = document.getElementById("detail-fallback-emoji");
  if (fallbackEmoji) fallbackEmoji.textContent = tale.emoji;

  if (tale.image) {
    imgEl.src = tale.image;
    imgEl.style.display = "block";
    fallbackEl.style.display = "none";
    imgEl.onerror = function() {
      imgEl.onerror = null;
      imgEl.style.display = "none";
      fallbackEl.style.display = "flex";
    };
  } else {
    imgEl.src = "";
    imgEl.style.display = "none";
    fallbackEl.style.display = "flex";
  }
  
  // Set tags
  const tagsContainer = document.getElementById("detail-tags");
  tagsContainer.innerHTML = "";
  tale.tags.forEach(tag => {
    const span = document.createElement("span");
    span.className = "detail-tag";
    span.textContent = `#${tag}`;
    tagsContainer.appendChild(span);
  });
}

// Global selection trigger (both from list clicking and map marker clicking)
function selectTale(id, flyTo = true) {
  if (broadcast.active && !broadcast._programmatic) {
    pauseBroadcast();
  }
  state.selectedTaleId = (state.selectedTaleId === id) ? null : id;
  renderList();
  updateDetailPanel();
  syncGlobe();
  if (state.selectedTaleId && flyTo) {
    flyToTale(state.selectedTaleId);
  }
}

window.selectTaleFromMap = (id) => selectTale(id, true);

// ==========================================================================
// INTERACTIVE EVENT LISTENERS & FILTER TRIGGERS
// ==========================================================================

// Run updates when filter configuration changes
function applyFilters() {
  const visibleTales = getFilteredTales();

  // If the currently selected item gets filtered out, deselect it
  if (state.selectedTaleId && !visibleTales.some(t => t.id === state.selectedTaleId)) {
    state.selectedTaleId = null;
    updateDetailPanel();
  }

  renderList();
  syncGlobe();

  if (broadcast.active) {
    refreshBroadcastQueue();
    if (broadcast.queue.length === 0) {
      updateBroadcastUI(null);
      stopSpeech();
    } else if (!broadcast.paused && broadcast.loop) {
      const currentId = broadcast.queue[broadcast.index]?.id;
      if (!visibleTales.some(t => t.id === currentId)) {
        broadcast.index = 0;
        playBroadcastItem();
      }
    }
  }
}

let searchDebounceTimer = null;
function scheduleFilterUpdate() {
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(applyFilters, 200);
}

// Bind interactive event listeners
function bindEvents() {
  // Search bar input
  document.getElementById("search-input").addEventListener("input", (e) => {
    state.searchQuery = e.target.value.trim();
    scheduleFilterUpdate();
  });

  document.getElementById("detail-close-btn").addEventListener("click", clearSelection);

  document.getElementById("btn-broadcast-one")?.addEventListener("click", broadcastCurrentTale);
  document.getElementById("btn-broadcast")?.addEventListener("click", toggleBroadcastLoop);
  document.getElementById("btn-broadcast-pause")?.addEventListener("click", toggleBroadcastPause);
  document.getElementById("btn-broadcast-prev")?.addEventListener("click", () => stepBroadcast(-1));
  document.getElementById("btn-broadcast-next")?.addEventListener("click", () => stepBroadcast(1));
  document.getElementById("btn-broadcast-mute")?.addEventListener("click", toggleBroadcastMute);

  // Auto rotate button
  const autoRotateBtn = document.getElementById("btn-auto-rotate");
  autoRotateBtn.addEventListener("click", () => {
    const isActive = autoRotateBtn.classList.toggle("active");
    if (window.toggleAutoRotation) {
      window.toggleAutoRotation(isActive);
    }
  });

  // Fullscreen button
  const fullscreenBtn = document.getElementById("btn-fullscreen");
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.error(`Error enabling fullscreen: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    });

    document.addEventListener("fullscreenchange", () => {
      if (document.fullscreenElement) {
        fullscreenBtn.title = "退出全屏";
        fullscreenBtn.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>`;
        fullscreenBtn.classList.add("active");
      } else {
        fullscreenBtn.title = "全屏模式";
        fullscreenBtn.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>`;
        fullscreenBtn.classList.remove("active");
      }
    });
  }
}

// Initialize App
document.addEventListener("DOMContentLoaded", () => {
  bindEvents();
  initBroadcast();

  renderList();
  renderFilters();
  updateDetailPanel();
  
  if (window.updateViewCoordinatesText) {
    window.updateViewCoordinatesText();
  }
  
  // globe.js loads before app.js per script tag order; initGlobe is already defined
  if (window.initGlobe) {
    window.initGlobe(strangeTales);
  }
});

  </script>
