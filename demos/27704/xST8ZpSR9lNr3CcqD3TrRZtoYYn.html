<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作文小教练</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fff8ef;
        --card: #ffffff;
        --ink: #243044;
        --muted: #667085;
        --primary: #f97316;
        --primary-dark: #d95f0d;
        --soft: #ffedd5;
        --line: #f3d7bd;
        --green: #16a34a;
        --shadow: 0 18px 55px rgba(124, 45, 18, 0.13);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(251, 146, 60, 0.24), transparent 32rem),
          linear-gradient(135deg, #fff8ef 0%, #fffdf8 48%, #eef6ff 100%);
        color: var(--ink);
        font-family:
          "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      .app-shell {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 36px 0;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 24px;
        align-items: stretch;
        margin-bottom: 24px;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--primary-dark);
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 12px;
        font-size: clamp(40px, 7vw, 76px);
        line-height: 0.98;
        letter-spacing: -0.05em;
      }

      h2 {
        margin-bottom: 10px;
        font-size: clamp(24px, 3vw, 34px);
        letter-spacing: -0.03em;
      }

      .hero-text {
        max-width: 680px;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.8;
      }

      .hero-card {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        min-height: 210px;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: linear-gradient(160deg, #ffffff, #fff1e4);
        box-shadow: var(--shadow);
      }

      .hero-card span {
        color: var(--primary-dark);
        font-weight: 800;
      }

      .hero-card strong {
        display: block;
        margin-top: 10px;
        font-size: 25px;
        line-height: 1.25;
      }

      .workspace {
        display: grid;
        grid-template-columns: 230px minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }

      .steps {
        position: sticky;
        top: 20px;
        display: grid;
        gap: 10px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.8);
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
      }

      .step {
        width: 100%;
        padding: 13px 14px;
        border: 0;
        border-radius: 16px;
        background: transparent;
        color: var(--muted);
        text-align: left;
        cursor: pointer;
      }

      .step.active {
        background: var(--soft);
        color: var(--primary-dark);
        font-weight: 800;
      }

      .panel {
        min-height: 620px;
        padding: clamp(22px, 4vw, 44px);
        border: 1px solid var(--line);
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: var(--shadow);
      }

      .screen {
        display: none;
      }

      .screen.active {
        display: block;
        animation: rise 0.24s ease-out;
      }

      .hint {
        color: var(--muted);
        line-height: 1.8;
      }

      label {
        display: grid;
        gap: 8px;
        margin: 18px 0;
        color: #344054;
        font-weight: 800;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid #ead6c5;
        border-radius: 18px;
        background: #fffaf5;
        color: var(--ink);
        outline: none;
      }

      input,
      select {
        height: 52px;
        padding: 0 16px;
      }

      textarea {
        padding: 15px 16px;
        line-height: 1.75;
        resize: vertical;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.13);
      }

      .question-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px 18px;
      }

      .primary,
      .secondary {
        margin-top: 10px;
        padding: 14px 20px;
        border: 0;
        border-radius: 999px;
        font-weight: 900;
        cursor: pointer;
      }

      .primary {
        background: var(--primary);
        color: white;
        box-shadow: 0 12px 24px rgba(249, 115, 22, 0.25);
      }

      .primary:hover {
        background: var(--primary-dark);
      }

      .secondary {
        background: #eaf2ff;
        color: #1d4ed8;
      }

      .result-card,
      .prompt-list {
        display: grid;
        gap: 14px;
        margin: 22px 0;
      }

      .item {
        padding: 18px;
        border: 1px solid #f0dcc9;
        border-radius: 22px;
        background: #fffaf5;
        line-height: 1.75;
      }

      .item strong {
        color: var(--primary-dark);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        margin: 0 8px 8px 0;
        padding: 6px 11px;
        border-radius: 999px;
        background: #ecfdf3;
        color: var(--green);
        font-size: 14px;
        font-weight: 800;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 840px) {
        .hero,
        .workspace,
        .question-grid {
          grid-template-columns: 1fr;
        }

        .steps {
          position: static;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 520px) {
        .app-shell {
          width: min(100% - 20px, 1180px);
          padding: 18px 0;
        }

        .steps {
          grid-template-columns: 1fr;
        }

        .panel {
          border-radius: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <div>
          <p class="eyebrow">四年级以上小学生作文构思陪练</p>
          <h1>作文小教练</h1>
          <p class="hero-text">
            不是直接替孩子写作文，而是从选择题和少量填空开始，帮孩子想清楚"写什么、怎么写、哪里要写具体"。
          </p>
        </div>
        <div class="hero-card">
          <span>第一版目标</span>
          <strong>把空白文档变成一张可写的作文地图</strong>
        </div>
      </section>

      <section class="workspace">
        <aside class="steps" aria-label="写作步骤">
          <button class="step active" data-step="0">1. 输入题目</button>
          <button class="step" data-step="1">2. 构思选择</button>
          <button class="step" data-step="2">3. 想法卡</button>
          <button class="step" data-step="3">4. 作文提纲</button>
          <button class="step" data-step="4">5. 细节补充</button>
          <button class="step" data-step="5">6. 完成初稿</button>
          <button class="step" data-step="6">7. 修改建议</button>
        </aside>

        <section class="panel">
          <div class="screen active" data-screen="0">
            <h2>先告诉我作文题目</h2>
            <p class="hint">可以输入老师布置的题目，也可以输入一个大概方向。</p>
            <label>
              作文题目
              <input id="titleInput" type="text" placeholder="例如：一件难忘的事、我的妈妈、校园一角" />
            </label>
            <label>
              这篇作文大概属于哪一类？
              <select id="typeInput">
                <option value="记事作文">记事作文</option>
                <option value="写人作文">写人作文</option>
                <option value="写景作文">写景作文</option>
                <option value="状物作文">状物作文</option>
                <option value="想象作文">想象作文</option>
                <option value="读后感">读后感</option>
              </select>
            </label>
            <button class="primary" id="startBtn">开始构思</button>
          </div>

          <div class="screen" data-screen="1">
            <h2>用选择和填空降低开始难度</h2>
            <div class="question-grid">
              <label>
                你最想写的核心内容是什么？
                <input id="mainThing" type="text" placeholder="例如：运动会接力赛、妈妈照顾我、雨后的校园" />
              </label>
              <label>
                这件事或这个内容最打动你的地方是？
                <select id="emotionInput">
                  <option>开心</option>
                  <option>紧张</option>
                  <option>感动</option>
                  <option>后悔</option>
                  <option>自豪</option>
                  <option>新奇</option>
                </select>
              </label>
              <label>
                主要人物或对象是谁？
                <input id="personInput" type="text" placeholder="例如：我、妈妈、同学、小狗、校园里的银杏树" />
              </label>
              <label>
                最关键的一幕发生在哪里？
                <input id="placeInput" type="text" placeholder="例如：操场、厨房、教室、回家的路上" />
              </label>
              <label>
                你想表达的收获或感受是？
                <input id="lessonInput" type="text" placeholder="例如：坚持很重要、妈妈很爱我、生活中有美" />
              </label>
            </div>
            <button class="primary" id="ideaBtn">生成我的想法卡</button>
          </div>

          <div class="screen" data-screen="2">
            <h2>我的作文想法卡</h2>
            <div id="ideaCard" class="result-card"></div>
            <button class="primary" id="outlineBtn">继续生成提纲</button>
          </div>

          <div class="screen" data-screen="3">
            <h2>作文提纲</h2>
            <p class="hint">提纲只搭路，不替孩子走路。孩子仍然要自己写句子。</p>
            <div id="outlineCard" class="result-card"></div>
            <button class="primary" id="detailBtn">看看哪里还能写具体</button>
          </div>

          <div class="screen" data-screen="4">
            <h2>细节补充提示</h2>
            <div id="detailPrompts" class="prompt-list"></div>
            <label>
              选择一个最有画面感的细节，先写几句话
              <textarea id="detailDraft" rows="5" placeholder="例如：接力棒快到我手里时，我的手心全是汗，心里像有一只小兔子在乱跳……"></textarea>
            </label>
            <button class="primary" id="draftBtn">进入初稿区</button>
          </div>

          <div class="screen" data-screen="5">
            <h2>根据提纲写初稿</h2>
            <p class="hint">可以先写得不完美，重点是把事情写完整。</p>
            <textarea id="fullDraft" rows="12" placeholder="在这里写作文初稿……"></textarea>
            <button class="primary" id="reviewBtn">获得修改建议</button>
          </div>

          <div class="screen" data-screen="6">
            <h2>修改建议</h2>
            <div id="reviewCard" class="result-card"></div>
            <button class="secondary" id="restartBtn">再练一篇</button>
          </div>
        </section>
      </section>
    </main>

    <script>
      const state = {
        title: "",
        type: "记事作文",
        mainThing: "",
        emotion: "开心",
        person: "",
        place: "",
        lesson: "",
        detailDraft: "",
      };

      const $ = (selector) => document.querySelector(selector);
      const $$ = (selector) => Array.from(document.querySelectorAll(selector));

      const defaults = {
        title: "一件难忘的事",
        mainThing: "一次让我印象深刻的经历",
        person: "我和身边的人",
        place: "一个熟悉的地方",
        lesson: "我明白了要认真观察、勇敢表达自己的真实感受",
      };

      function valueOf(id, fallback) {
        return (document.getElementById(id).value || "").trim() || fallback || "";
      }

      function go(step) {
        $$(".screen").forEach((screen) => {
          screen.classList.toggle("active", screen.dataset.screen === String(step));
        });
        $$(".step").forEach((button) => {
          button.classList.toggle("active", button.dataset.step === String(step));
        });
      }

      function updateStateFromInputs() {
        state.title = valueOf("titleInput", defaults.title);
        state.type = document.getElementById("typeInput").value;
        state.mainThing = valueOf("mainThing", defaults.mainThing);
        state.emotion = document.getElementById("emotionInput").value;
        state.person = valueOf("personInput", defaults.person);
        state.place = valueOf("placeInput", defaults.place);
        state.lesson = valueOf("lessonInput", defaults.lesson);
      }

      function renderIdeaCard() {
        document.getElementById("ideaCard").innerHTML =
          '<div class="item"><span class="pill">' + state.type + '</span><span class="pill">' + state.emotion + '</span></div>' +
          '<div class="item"><strong>我想写的题目：</strong>' + state.title + '</div>' +
          '<div class="item"><strong>我想写的内容：</strong>' + state.mainThing + '</div>' +
          '<div class="item"><strong>主要人物或对象：</strong>' + state.person + '</div>' +
          '<div class="item"><strong>最关键的地点：</strong>' + state.place + '</div>' +
          '<div class="item"><strong>文章最后想表达：</strong>' + state.lesson + '</div>';
      }

      function openingTip() {
        var map = {
          "记事作文": "开头可以用一句话交代时间、地点和人物，再点出这件事让你" + state.emotion + "。",
          "写人作文": "开头可以先写这个人给你的第一印象，再用一个小事件证明这个特点。",
          "写景作文": "开头可以交代观察地点和时间，再写你第一眼看到的整体感觉。",
          "状物作文": "开头可以写这个物品或动物从哪里来，为什么它让你想写。",
          "想象作文": "开头可以设置一个奇妙变化，让读者马上进入故事。",
          "读后感": "开头可以先用两三句话介绍读到的内容，再引出你最深的感受。",
        };
        return map[state.type] || map["记事作文"];
      }

      function middleTip() {
        var map = {
          "记事作文": "中间重点写清" + state.mainThing + "的经过，尤其写具体在" + state.place + "发生的关键一幕。",
          "写人作文": "中间选择一件最能表现" + state.person + "特点的小事，写出动作、语言和你的感受。",
          "写景作文": "中间按照观察顺序写" + state.place + "的景物，加入颜色、声音、气味和变化。",
          "状物作文": "中间写清外形、特点和你与它之间的小故事，不要只列特点。",
          "想象作文": "中间写清奇妙事情的发展，要有遇到问题、尝试解决和发生变化。",
          "读后感": "中间先写哪个情节打动你，再联系自己的生活经历说为什么。",
        };
        return map[state.type] || map["记事作文"];
      }

      function renderOutline() {
        document.getElementById("outlineCard").innerHTML =
          '<div class="item"><strong>开头：</strong>' + openingTip() + '</div>' +
          '<div class="item"><strong>中间第一层：</strong>先写事情或对象的基本情况：谁、在哪里、发生了什么。</div>' +
          '<div class="item"><strong>中间第二层：</strong>' + middleTip() + '</div>' +
          '<div class="item"><strong>结尾：</strong>回到你的真实感受，写出"' + state.lesson + '"。</div>';
      }

      function renderDetailPrompts() {
        var prompts = [
          '如果把"' + state.place + '"像拍电影一样写出来，你能看到什么、听到什么？',
          '当你感到"' + state.emotion + '"时，身体有什么反应？比如手、心跳、脚步、眼睛。',
          state.person + '当时说了什么？试着写一句原话。',
          '最关键的一秒发生了什么？把动作分成两三个小动作写出来。',
          '读者看完后，怎样才能明白"' + state.lesson + '"？你可以加一个具体例子。',
        ];

        document.getElementById("detailPrompts").innerHTML = prompts
          .map(function (prompt, index) {
            return '<div class="item"><strong>提示 ' + (index + 1) + '：</strong>' + prompt + '</div>';
          })
          .join("");
      }

      function seedDraft() {
        var detail = document.getElementById("detailDraft").value.trim();
        state.detailDraft = detail;
        document.getElementById("fullDraft").value = [
          "题目：" + state.title,
          "",
          openingTip(),
          "",
          "我准备重点写：" + state.mainThing + "。" + middleTip(),
          "",
          detail ? "我已经想到的细节：" + detail : "我已经想到的细节：",
          "",
          "结尾可以写：通过这件事，我感受到" + state.lesson + "。",
        ].join("\n");
      }

      function sentenceCount(text) {
        return (text.match(/[。！？!?]/g) || []).length;
      }

      function renderReview() {
        var draft = document.getElementById("fullDraft").value.trim();
        var suggestions = [];

        if (!draft) {
          suggestions.push("你还没有写初稿。先不用追求完美，按照提纲把事情写完整。");
        }
        if (draft.length < 220) {
          suggestions.push("内容还比较短，可以把最关键的一幕写得更具体。建议增加动作、语言、心理描写。");
        }
        if (!/["""]/.test(draft)) {
          suggestions.push("文章里还缺少人物说的话。可以加入一句原话，让画面更真实。");
        }
        if (!/(我想|我觉得|心里|感到|明白|懂得|难忘|自豪|紧张|感动)/.test(draft)) {
          suggestions.push("文章里的心理感受还不明显。可以补一句当时心里怎么想，结尾再写收获。");
        }
        if (sentenceCount(draft) < 8) {
          suggestions.push("句子数量偏少。可以把一个长句拆成几句，按照先后顺序写清楚。");
        }
        suggestions.push('下一步重点练习：把"' + state.emotion + '"写具体，不只说这个词，而是写身体反应、动作和心里的想法。');

        document.getElementById("reviewCard").innerHTML = suggestions
          .map(function (item, index) {
            return '<div class="item"><strong>建议 ' + (index + 1) + '：</strong>' + item + '</div>';
          })
          .join("");
      }

      document.getElementById("startBtn").addEventListener("click", function () {
        state.title = valueOf("titleInput", defaults.title);
        state.type = document.getElementById("typeInput").value;
        go(1);
      });

      document.getElementById("ideaBtn").addEventListener("click", function () {
        updateStateFromInputs();
        renderIdeaCard();
        go(2);
      });

      document.getElementById("outlineBtn").addEventListener("click", function () {
        renderOutline();
        go(3);
      });

      document.getElementById("detailBtn").addEventListener("click", function () {
        renderDetailPrompts();
        go(4);
      });

      document.getElementById("draftBtn").addEventListener("click", function () {
        seedDraft();
        go(5);
      });

      document.getElementById("reviewBtn").addEventListener("click", function () {
        renderReview();
        go(6);
      });

      document.getElementById("restartBtn").addEventListener("click", function () {
        location.reload();
      });

      $$(".step").forEach(function (button) {
        button.addEventListener("click", function () {
          go(Number(button.dataset.step));
        });
      });
    </script>
  </body>
</html>
