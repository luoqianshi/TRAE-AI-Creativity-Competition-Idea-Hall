<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>僵尸射击游戏</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 40%, rgba(89, 125, 78, 0.28), transparent 34%),
        linear-gradient(135deg, #0b1010 0%, #15201d 45%, #070908 100%);
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      color: #eef7eb;
    }

    .game-shell {
      position: relative;
      width: min(96vw, 1080px);
      aspect-ratio: 16 / 9;
      border: 2px solid rgba(204, 255, 191, 0.2);
      border-radius: 22px;
      overflow: hidden;
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.6),
        inset 0 0 70px rgba(151, 255, 122, 0.08);
      background: #101712;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at center, rgba(56, 92, 50, 0.2), transparent 45%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 18px),
        #111912;
      cursor: crosshair;
    }

    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 3;
      gap: 12px;
    }

    .panel {
      padding: 12px 16px;
      border: 1px solid rgba(204, 255, 191, 0.18);
      border-radius: 16px;
      background: rgba(6, 10, 8, 0.58);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
    }

    .stats {
      display: grid;
      gap: 5px;
      font-size: clamp(13px, 1.6vw, 18px);
      line-height: 1.25;
    }

    .stats strong {
      color: #b9ff78;
      letter-spacing: 0.5px;
    }

    .controls {
      max-width: 350px;
      color: rgba(238, 247, 235, 0.78);
      font-size: clamp(12px, 1.35vw, 15px);
      line-height: 1.55;
      text-align: right;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at center, rgba(132, 255, 92, 0.12), transparent 40%),
        rgba(0, 0, 0, 0.68);
      z-index: 5;
      text-align: center;
    }

    .card {
      width: min(560px, 92%);
      padding: 34px 30px;
      border: 1px solid rgba(204, 255, 191, 0.26);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(16, 27, 19, 0.95), rgba(6, 10, 8, 0.95));
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.58);
    }

    h1 {
      margin-bottom: 12px;
      color: #caff8a;
      font-size: clamp(32px, 5vw, 54px);
      letter-spacing: 2px;
      text-shadow: 0 0 28px rgba(153, 255, 93, 0.35);
    }

    .subtitle {
      margin-bottom: 22px;
      color: rgba(238, 247, 235, 0.8);
      font-size: 16px;
      line-height: 1.7;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 26px;
      background: linear-gradient(135deg, #b9ff78, #55dc66);
      color: #08210e;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(80, 220, 100, 0.32);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    button:active {
      transform: translateY(0);
    }

    .hidden {
      display: none;
    }

    .mobile-tip {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      width: max-content;
      max-width: 90%;
      padding: 9px 13px;
      border-radius: 999px;
      background: rgba(6, 10, 8, 0.55);
      color: rgba(238, 247, 235, 0.7);
      font-size: 12px;
      pointer-events: none;
      z-index: 4;
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <canvas id="game"></canvas>

    <div class="hud">
      <div class="panel stats">
        <div>分数：<strong id="score">0</strong></div>
        <div>生命：<strong id="health">1000000</strong></div>
        <div>弹药：<strong id="ammo">19999999999</strong></div>
        <div>波次：<strong id="wave">1</strong></div>
      </div>
      <div class="panel controls">
        WASD / 方向键移动<br>
        鼠标移动瞄准，左键射击<br>
        R 换弹，空格冲刺
      </div>
    </div>

    <div class="mobile-tip">触屏：左半屏移动，右半屏瞄准并射击</div>

    <section id="overlay" class="overlay">
      <div class="card">
        <h1>僵尸射击</h1>
        <p id="message" class="subtitle">
          夜色降临，僵尸从四面逼近。保持移动，瞄准头部，尽可能活下去。
        </p>
        <button id="startBtn">开始游戏</button>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const healthEl = document.getElementById("health");
    const ammoEl = document.getElementById("ammo");
    const waveEl = document.getElementById("wave");
    const overlay = document.getElementById("overlay");
    const message = document.getElementById("message");
    const startBtn = document.getElementById("startBtn");

    const state = {
      running: false,
      width: 960,
      height: 540,
      lastTime: 0,
      keys: new Set(),
      mouse: { x: 480, y: 270, down: false },
      player: null,
      bullets: [],
      zombies: [],
      particles: [],
      pickups: [],
      score: 0,
      wave: 1,
      spawnTimer: 0,
      waveTimer: 0,
      shake: 0,
      touchMove: null,
      touchAim: null
    };

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      state.width = rect.width;
      state.height = rect.height;
      if (state.player) {
        state.player.x = clamp(state.player.x, 24, state.width - 24);
        state.player.y = clamp(state.player.y, 24, state.height - 24);
      }
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function randomEdgePoint() {
      const side = Math.floor(Math.random() * 4);
      if (side === 0) return { x: Math.random() * state.width, y: -30 };
      if (side === 1) return { x: state.width + 30, y: Math.random() * state.height };
      if (side === 2) return { x: Math.random() * state.width, y: state.height + 30 };
      return { x: -30, y: Math.random() * state.height };
    }

    function startGame() {
      state.running = true;
      state.lastTime = performance.now();
      state.score = 0;
      state.wave = 1;
      state.spawnTimer = 0;
      state.waveTimer = 0;
      state.shake = 0;
      state.bullets = [];
      state.zombies = [];
      state.particles = [];
      state.pickups = [];
      state.player = {
        x: state.width / 2,
        y: state.height / 2,
        radius: 18,
        speed: 230,
        health: 1000000,
        ammo: 19999999999,
        maxAmmo: 19999999999,
        reload: 0,
        fireCooldown: 0,
        dashCooldown: 0,
        dashTime: 0
      };
      overlay.classList.add("hidden");
      updateHud();
      requestAnimationFrame(loop);
    }

    function endGame() {
      state.running = false;
      message.innerHTML = `你坚持到了第 <strong>${state.wave}</strong> 波，最终分数 <strong>${state.score}</strong>。<br>再来一次，看看能不能守得更久。`;
      startBtn.textContent = "重新开始";
      overlay.classList.remove("hidden");
    }

    function updateHud() {
      scoreEl.textContent = state.score;
      healthEl.textContent = Math.max(0, Math.ceil(state.player?.health || 0));
      ammoEl.textContent = state.player?.reload > 0 ? "换弹中" : `${state.player?.ammo || 0}/${state.player?.maxAmmo || 12}`;
      waveEl.textContent = state.wave;
    }

    function spawnZombie() {
      const p = randomEdgePoint();
      const tough = Math.random() < Math.min(0.08 + state.wave * 0.018, 0.28);
      state.zombies.push({
        x: p.x,
        y: p.y,
        radius: tough ? 23 : 18,
        speed: (tough ? 58 : 82) + state.wave * 5 + Math.random() * 22,
        health: tough ? 80 + state.wave * 12 : 38 + state.wave * 7,
        maxHealth: tough ? 80 + state.wave * 12 : 38 + state.wave * 7,
        damage: tough ? 18 : 11,
        attackCooldown: 0,
        tough
      });
    }

    function shoot() {
      const player = state.player;
      if (player.fireCooldown > 0 || player.reload > 0 || player.ammo <= 0) return;

      const angle = Math.atan2(state.mouse.y - player.y, state.mouse.x - player.x);
      player.ammo--;
      player.fireCooldown = 0.13;
      state.shake = 4;

      state.bullets.push({
        x: player.x + Math.cos(angle) * 24,
        y: player.y + Math.sin(angle) * 24,
        vx: Math.cos(angle) * 560,
        vy: Math.sin(angle) * 560,
        radius: 12,
        life: 4.5,
        damage: 9999,
        blastRadius: 105,
        bounces: 999,
        explodeCooldown: 0
      });

      for (let i = 0; i < 16; i++) {
        makeParticle(player.x + Math.cos(angle) * 24, player.y + Math.sin(angle) * 24, "#9dff57", 180, 0.32);
      }

      if (player.ammo === 0) reload();
    }

    function reload() {
      const player = state.player;
      if (player.reload <= 0 && player.ammo < player.maxAmmo) {
        player.reload = 1.0;
      }
    }

    function dash() {
      const player = state.player;
      if (player.dashCooldown > 0) return;
      player.dashTime = 0.15;
      player.dashCooldown = 1.3;
      state.shake = 3;
    }

    function makeParticle(x, y, color, speed = 80, life = 0.45) {
      const angle = Math.random() * Math.PI * 2;
      const power = Math.random() * speed;
      state.particles.push({
        x,
        y,
        vx: Math.cos(angle) * power,
        vy: Math.sin(angle) * power,
        radius: 2 + Math.random() * 3,
        color,
        life,
        maxLife: life
      });
    }

    function detonateNuke(b) {
      state.shake = 18;
      for (let i = 0; i < 90; i++) {
        makeParticle(b.x, b.y, i % 3 === 0 ? "#eaff7b" : i % 3 === 1 ? "#79ff5b" : "#ff8a3d", 360, 0.75);
      }

      for (let i = state.zombies.length - 1; i >= 0; i--) {
        const z = state.zombies[i];
        const d = Math.hypot(z.x - b.x, z.y - b.y);
        if (d <= b.blastRadius) {
          const power = 1 - d / b.blastRadius;
          z.health -= b.damage * (0.45 + power);
          z.x += (z.x - b.x) * 0.24;
          z.y += (z.y - b.y) * 0.24;
          if (z.health <= 0) {
            state.score += z.tough ? 35 : 18;
            for (let p = 0; p < 18; p++) makeParticle(z.x, z.y, "#6fbf4a", 170, 0.55);
            spawnPickup(z.x, z.y);
            state.zombies.splice(i, 1);
          }
        }
      }
    }

    function spawnPickup(x, y) {
      if (Math.random() > 0.13) return;
      state.pickups.push({
        x,
        y,
        radius: 11,
        type: Math.random() > 0.45 ? "ammo" : "heal",
        life: 8
      });
    }

    function update(dt) {
      const player = state.player;
      state.waveTimer += dt;
      state.spawnTimer -= dt;
      state.shake = Math.max(0, state.shake - dt * 16);

      if (state.waveTimer > 25) {
        state.wave++;
        state.waveTimer = 0;
        for (let i = 0; i < Math.min(2 + state.wave, 8); i++) spawnZombie();
      }

      const spawnInterval = Math.max(0.34, 1.35 - state.wave * 0.075);
      if (state.spawnTimer <= 0) {
        spawnZombie();
        state.spawnTimer = spawnInterval;
      }

      let moveX = 0;
      let moveY = 0;
      if (state.keys.has("w") || state.keys.has("arrowup")) moveY -= 1;
      if (state.keys.has("s") || state.keys.has("arrowdown")) moveY += 1;
      if (state.keys.has("a") || state.keys.has("arrowleft")) moveX -= 1;
      if (state.keys.has("d") || state.keys.has("arrowright")) moveX += 1;

      if (state.touchMove) {
        moveX += state.touchMove.x;
        moveY += state.touchMove.y;
      }

      const len = Math.hypot(moveX, moveY) || 1;
      const dashBoost = player.dashTime > 0 ? 2.9 : 1;
      player.x = clamp(player.x + (moveX / len) * player.speed * dashBoost * dt, player.radius, state.width - player.radius);
      player.y = clamp(player.y + (moveY / len) * player.speed * dashBoost * dt, player.radius, state.height - player.radius);

      player.fireCooldown = Math.max(0, player.fireCooldown - dt);
      player.reload = Math.max(0, player.reload - dt);
      player.dashCooldown = Math.max(0, player.dashCooldown - dt);
      player.dashTime = Math.max(0, player.dashTime - dt);
      if (player.reload === 0 && player.ammo < player.maxAmmo && state.keys.has("r")) player.ammo = player.maxAmmo;
      if (player.reload === 0 && player.ammo === 0) player.ammo = player.maxAmmo;
      if (state.mouse.down) shoot();

      for (let i = state.bullets.length - 1; i >= 0; i--) {
        const b = state.bullets[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
        b.explodeCooldown = Math.max(0, b.explodeCooldown - dt);

        if (b.x <= b.radius || b.x >= state.width - b.radius) {
          b.x = clamp(b.x, b.radius, state.width - b.radius);
          b.vx *= -1;
          b.bounces--;
          state.shake = 5;
          for (let p = 0; p < 8; p++) makeParticle(b.x, b.y, "#9dff57", 140, 0.28);
        }

        if (b.y <= b.radius || b.y >= state.height - b.radius) {
          b.y = clamp(b.y, b.radius, state.height - b.radius);
          b.vy *= -1;
          b.bounces--;
          state.shake = 5;
          for (let p = 0; p < 8; p++) makeParticle(b.x, b.y, "#9dff57", 140, 0.28);
        }

        if (b.life <= 0 || b.bounces < 0) {
          state.bullets.splice(i, 1);
        }
      }

      for (let i = state.zombies.length - 1; i >= 0; i--) {
        const z = state.zombies[i];
        const angle = Math.atan2(player.y - z.y, player.x - z.x);
        z.x += Math.cos(angle) * z.speed * dt;
        z.y += Math.sin(angle) * z.speed * dt;
        z.attackCooldown = Math.max(0, z.attackCooldown - dt);

        if (distance(z, player) < z.radius + player.radius && z.attackCooldown <= 0) {
          player.health -= z.damage;
          z.attackCooldown = 0.72;
          state.shake = 9;
          for (let p = 0; p < 12; p++) makeParticle(player.x, player.y, "#ff5d57", 140, 0.38);
          if (player.health <= 0) {
            updateHud();
            endGame();
            return;
          }
        }

        for (let j = state.bullets.length - 1; j >= 0; j--) {
          const b = state.bullets[j];
          if (Math.hypot(z.x - b.x, z.y - b.y) < z.radius + b.radius) {
            if (b.explodeCooldown <= 0) {
              detonateNuke(b);
              b.explodeCooldown = 0.38;
              b.vx *= -0.86;
              b.vy *= -0.86;
            }
            break;
          }
        }
      }

      for (let i = state.pickups.length - 1; i >= 0; i--) {
        const item = state.pickups[i];
        item.life -= dt;
        if (distance(item, player) < item.radius + player.radius) {
          if (item.type === "ammo") player.ammo = player.maxAmmo;
          if (item.type === "heal") player.health = Math.min(1000000, player.health + 22000);
          for (let p = 0; p < 10; p++) makeParticle(item.x, item.y, item.type === "ammo" ? "#ffd36d" : "#ff7070", 90, 0.35);
          state.pickups.splice(i, 1);
        } else if (item.life <= 0) {
          state.pickups.splice(i, 1);
        }
      }

      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.96;
        p.vy *= 0.96;
        p.life -= dt;
        if (p.life <= 0) state.particles.splice(i, 1);
      }

      updateHud();
    }

    function draw() {
      const sx = (Math.random() - 0.5) * state.shake;
      const sy = (Math.random() - 0.5) * state.shake;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.clearRect(-20, -20, state.width + 40, state.height + 40);

      drawGround();
      for (const item of state.pickups) drawPickup(item);
      for (const b of state.bullets) drawBullet(b);
      for (const z of state.zombies) drawZombie(z);
      for (const p of state.particles) drawParticle(p);
      drawPlayer();
      drawCrosshair();

      ctx.restore();
    }

    function drawGround() {
      ctx.fillStyle = "#111912";
      ctx.fillRect(0, 0, state.width, state.height);
      ctx.strokeStyle = "rgba(199,255,177,0.035)";
      ctx.lineWidth = 1;
      for (let x = -state.height; x < state.width; x += 38) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + state.height, state.height);
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(0,0,0,0.25)";
      ctx.fillRect(0, 0, state.width, state.height);
    }

    function drawPlayer() {
      const p = state.player;
      const angle = Math.atan2(state.mouse.y - p.y, state.mouse.x - p.x);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(angle);

      ctx.fillStyle = "rgba(185,255,120,0.18)";
      ctx.beginPath();
      ctx.arc(0, 0, p.radius + 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#d9f7d1";
      ctx.beginPath();
      ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#293329";
      ctx.fillRect(7, -5, 28, 10);
      ctx.fillStyle = "#caff8a";
      ctx.fillRect(27, -3, 15, 6);
      ctx.restore();
    }

    function drawZombie(z) {
      const hp = z.health / z.maxHealth;
      const player = state.player;
      const faceAngle = player ? Math.atan2(player.y - z.y, player.x - z.x) : 0;
      ctx.save();
      ctx.translate(z.x, z.y);
      ctx.rotate(faceAngle);

      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ctx.beginPath();
      ctx.ellipse(-2, z.radius * 0.72, z.radius * 0.95, z.radius * 0.38, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = z.tough ? "#6d8f58" : "#79aa62";
      ctx.lineWidth = z.tough ? 7 : 5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-z.radius * 0.35, z.radius * 0.12);
      ctx.lineTo(-z.radius * 1.08, z.radius * 0.58);
      ctx.moveTo(z.radius * 0.35, z.radius * 0.12);
      ctx.lineTo(z.radius * 1.1, z.radius * 0.5);
      ctx.stroke();

      ctx.fillStyle = z.tough ? "#31472c" : "#3f5c39";
      ctx.beginPath();
      ctx.ellipse(0, z.radius * 0.35, z.radius * 0.68, z.radius * 0.9, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = z.tough ? "#5a342f" : "#5d4936";
      ctx.beginPath();
      ctx.moveTo(-z.radius * 0.58, -z.radius * 0.05);
      ctx.lineTo(z.radius * 0.48, -z.radius * 0.05);
      ctx.lineTo(z.radius * 0.28, z.radius * 0.98);
      ctx.lineTo(-z.radius * 0.42, z.radius * 0.88);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "rgba(12, 18, 12, 0.42)";
      ctx.beginPath();
      ctx.moveTo(-z.radius * 0.5, z.radius * 0.15);
      ctx.lineTo(-z.radius * 0.18, z.radius * 0.32);
      ctx.lineTo(-z.radius * 0.42, z.radius * 0.52);
      ctx.fill();

      ctx.fillStyle = z.tough ? "#88aa65" : "#7fb86c";
      ctx.beginPath();
      ctx.arc(0, -z.radius * 0.32, z.radius * 0.76, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "rgba(60, 20, 18, 0.5)";
      ctx.beginPath();
      ctx.arc(-z.radius * 0.25, -z.radius * 0.55, z.radius * 0.16, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ff4b45";
      ctx.shadowColor = "#ff4b45";
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(-z.radius * 0.26, -z.radius * 0.34, z.radius * 0.11, 0, Math.PI * 2);
      ctx.arc(z.radius * 0.26, -z.radius * 0.34, z.radius * 0.11, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.strokeStyle = "#231714";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-z.radius * 0.26, -z.radius * 0.02);
      ctx.quadraticCurveTo(0, z.radius * 0.17, z.radius * 0.32, -z.radius * 0.02);
      ctx.stroke();

      ctx.fillStyle = "#e7e2bd";
      ctx.fillRect(-z.radius * 0.05, z.radius * 0.02, 3, 5);
      ctx.fillRect(z.radius * 0.12, z.radius * 0.01, 3, 5);

      ctx.strokeStyle = "rgba(126, 26, 24, 0.78)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(z.radius * 0.12, -z.radius * 0.13);
      ctx.lineTo(z.radius * 0.28, z.radius * 0.08);
      ctx.moveTo(-z.radius * 0.08, -z.radius * 0.76);
      ctx.lineTo(-z.radius * 0.3, -z.radius * 0.58);
      ctx.stroke();

      ctx.rotate(-faceAngle);
      ctx.fillStyle = "#ff5d57";
      ctx.fillRect(-z.radius, -z.radius - 10, z.radius * 2, 4);
      ctx.fillStyle = "#b9ff78";
      ctx.fillRect(-z.radius, -z.radius - 10, z.radius * 2 * hp, 4);
      ctx.restore();
    }

    function drawBullet(b) {
      const angle = Math.atan2(b.vy, b.vx);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(angle);

      ctx.shadowColor = "#9dff57";
      ctx.shadowBlur = 22;
      ctx.fillStyle = "#20291d";
      ctx.beginPath();
      ctx.ellipse(0, 0, b.radius * 1.35, b.radius * 0.78, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#9dff57";
      ctx.beginPath();
      ctx.arc(-b.radius * 0.3, 0, b.radius * 0.52, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#eaff7b";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-b.radius * 0.95, 0);
      ctx.lineTo(b.radius * 1.05, 0);
      ctx.moveTo(0, -b.radius * 0.6);
      ctx.lineTo(0, b.radius * 0.6);
      ctx.stroke();

      ctx.fillStyle = "#eaff7b";
      ctx.font = "bold 10px Microsoft YaHei";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("核", 0, 0);
      ctx.shadowBlur = 0;

      ctx.globalAlpha = 0.16;
      ctx.strokeStyle = "#9dff57";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, b.blastRadius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function drawPickup(item) {
      const color = item.type === "ammo" ? "#ffd36d" : "#ff7070";
      ctx.save();
      ctx.translate(item.x, item.y);
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(0, 0, item.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#111912";
      ctx.font = "bold 13px Microsoft YaHei";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(item.type === "ammo" ? "弹" : "+", 0, 0);
      ctx.restore();
    }

    function drawParticle(p) {
      const alpha = p.life / p.maxLife;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius * alpha, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    function drawCrosshair() {
      const m = state.mouse;
      ctx.strokeStyle = "rgba(202,255,138,0.8)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(m.x, m.y, 11, 0, Math.PI * 2);
      ctx.moveTo(m.x - 17, m.y);
      ctx.lineTo(m.x - 6, m.y);
      ctx.moveTo(m.x + 6, m.y);
      ctx.lineTo(m.x + 17, m.y);
      ctx.moveTo(m.x, m.y - 17);
      ctx.lineTo(m.x, m.y - 6);
      ctx.moveTo(m.x, m.y + 6);
      ctx.lineTo(m.x, m.y + 17);
      ctx.stroke();
    }

    function loop(now) {
      if (!state.running) return;
      const dt = Math.min((now - state.lastTime) / 1000, 0.033);
      state.lastTime = now;
      update(dt);
      draw();
      if (state.running) requestAnimationFrame(loop);
    }

    function pointerPosition(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * (state.width / rect.width),
        y: (event.clientY - rect.top) * (state.height / rect.height)
      };
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("keydown", (event) => {
      state.keys.add(event.key.toLowerCase());
      if (event.key.toLowerCase() === "r") reload();
      if (event.code === "Space") {
        event.preventDefault();
        dash();
      }
    });
    window.addEventListener("keyup", (event) => state.keys.delete(event.key.toLowerCase()));
    canvas.addEventListener("mousemove", (event) => Object.assign(state.mouse, pointerPosition(event)));
    canvas.addEventListener("mousedown", (event) => {
      Object.assign(state.mouse, pointerPosition(event));
      state.mouse.down = true;
      shoot();
    });
    window.addEventListener("mouseup", () => state.mouse.down = false);

    canvas.addEventListener("touchstart", handleTouch, { passive: false });
    canvas.addEventListener("touchmove", handleTouch, { passive: false });
    canvas.addEventListener("touchend", handleTouch, { passive: false });
    canvas.addEventListener("touchcancel", handleTouch, { passive: false });

    function handleTouch(event) {
      event.preventDefault();
      const rect = canvas.getBoundingClientRect();
      state.touchMove = null;
      state.touchAim = null;
      state.mouse.down = false;

      for (const touch of event.touches) {
        const x = (touch.clientX - rect.left) * (state.width / rect.width);
        const y = (touch.clientY - rect.top) * (state.height / rect.height);
        if (x < state.width / 2) {
          const cx = state.width * 0.18;
          const cy = state.height * 0.76;
          const dx = clamp((x - cx) / 70, -1, 1);
          const dy = clamp((y - cy) / 70, -1, 1);
          state.touchMove = { x: dx, y: dy };
        } else {
          state.mouse.x = x;
          state.mouse.y = y;
          state.mouse.down = true;
        }
      }
    }

    startBtn.addEventListener("click", startGame);
    resizeCanvas();
    drawGround();
  </script>
</body>
</html>
