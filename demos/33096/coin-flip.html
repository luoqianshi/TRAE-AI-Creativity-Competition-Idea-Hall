<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抛硬币 - 帮你做决定</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .coin-container {
            perspective: 1000px;
            margin: 40px auto;
            width: 200px;
            height: 200px;
        }

        .coin {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s;
        }

        .coin.flipping {
            animation: flip 3s ease-in-out;
        }

        @keyframes flip {
            0% { transform: rotateY(0) rotateX(0); }
            10% { transform: rotateY(180deg) rotateX(5deg); }
            20% { transform: rotateY(360deg) rotateX(-5deg); }
            30% { transform: rotateY(540deg) rotateX(5deg); }
            40% { transform: rotateY(720deg) rotateX(-5deg); }
            50% { transform: rotateY(900deg) rotateX(5deg); }
            60% { transform: rotateY(1080deg) rotateX(-5deg); }
            70% { transform: rotateY(1260deg) rotateX(5deg); }
            80% { transform: rotateY(1440deg) rotateX(-5deg); }
            90% { transform: rotateY(1620deg) rotateX(2deg); }
            100% { transform: rotateY(1800deg) rotateX(0); }
        }

        .coin-face {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 0 8px rgba(255,255,255,0.1),
                0 10px 30px rgba(0,0,0,0.3),
                inset 0 0 30px rgba(0,0,0,0.1);
        }

        .coin-front {
            background: linear-gradient(145deg, #ffd700, #ffed4e);
            color: #b8860b;
            transform: rotateY(0deg);
        }

        .coin-back {
            background: linear-gradient(145deg, #c0c0c0, #e8e8e8);
            color: #666;
            transform: rotateY(180deg);
        }

        .coin-symbol {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .coin-text {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .flip-btn {
            background: linear-gradient(145deg, #ff6b6b, #ee5a5a);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(238, 90, 90, 0.4);
            transition: all 0.3s ease;
            margin: 20px 0;
            font-family: inherit;
        }

        .flip-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(238, 90, 90, 0.5);
        }

        .flip-btn:active {
            transform: translateY(0);
        }

        .flip-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            font-size: 1.5rem;
            margin: 20px 0;
            min-height: 40px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .result.show {
            opacity: 1;
        }

        .result-text {
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stats {
            background: rgba(255,255,255,0.15);
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            backdrop-filter: blur(10px);
        }

        .stats h3 {
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-item {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #ffd700;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 5px;
        }

        .reset-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 25px;
            font-size: 0.9rem;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: sparkle 1s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .coin-container, .coin, .coin-face {
                width: 150px;
                height: 150px;
            }
            .coin-symbol { font-size: 3rem; }
            .flip-btn { padding: 15px 40px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🪙 抛硬币</h1>
        <p class="subtitle">让命运帮你做决定</p>

        <div class="coin-container">
            <div class="coin" id="coin">
                <div class="coin-face coin-front">
                    <div class="coin-symbol">正</div>
                    <div class="coin-text">正面</div>
                </div>
                <div class="coin-face coin-back">
                    <div class="coin-symbol">反</div>
                    <div class="coin-text">反面</div>
                </div>
            </div>
        </div>

        <button class="flip-btn" id="flipBtn" onclick="flipCoin()">开始抛硬币</button>

        <div class="result" id="result">
            <div class="result-text" id="resultText"></div>
        </div>

        <div class="stats">
            <h3>📊 统计记录</h3>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-number" id="frontCount">0</div>
                    <div class="stat-label">正面次数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="backCount">0</div>
                    <div class="stat-label">反面次数</div>
                </div>
            </div>
            <button class="reset-btn" onclick="resetStats()">重置统计</button>
        </div>
    </div>

    <script>
        let isFlipping = false;
        let frontCount = 0;
        let backCount = 0;

        // 从本地存储读取统计
        function loadStats() {
            const saved = localStorage.getItem('coinFlipStats');
            if (saved) {
                const stats = JSON.parse(saved);
                frontCount = stats.front || 0;
                backCount = stats.back || 0;
                updateStatsDisplay();
            }
        }

        // 保存统计到本地存储
        function saveStats() {
            localStorage.setItem('coinFlipStats', JSON.stringify({
                front: frontCount,
                back: backCount
            }));
        }

        // 更新统计显示
        function updateStatsDisplay() {
            document.getElementById('frontCount').textContent = frontCount;
            document.getElementById('backCount').textContent = backCount;
        }

        // 抛硬币
        function flipCoin() {
            if (isFlipping) return;

            isFlipping = true;
            const coin = document.getElementById('coin');
            const btn = document.getElementById('flipBtn');
            const result = document.getElementById('result');
            const resultText = document.getElementById('resultText');

            // 禁用按钮
            btn.disabled = true;
            btn.textContent = '抛掷中...';

            // 隐藏结果
            result.classList.remove('show');

            // 随机决定结果 (0 = 正面, 1 = 反面)
            const isFront = Math.random() < 0.5;

            // 添加动画类
            coin.classList.add('flipping');

            // 动画结束后显示结果
            setTimeout(() => {
                coin.classList.remove('flipping');

                // 设置最终旋转角度
                if (isFront) {
                    coin.style.transform = 'rotateY(1800deg)';
                    frontCount++;
                    resultText.innerHTML = '🎉 结果是：<span style="color: #ffd700;">正面</span>';
                } else {
                    coin.style.transform = 'rotateY(1980deg)';
                    backCount++;
                    resultText.innerHTML = '🎉 结果是：<span style="color: #c0c0c0;">反面</span>';
                }

                // 更新统计
                updateStatsDisplay();
                saveStats();

                // 显示结果
                setTimeout(() => {
                    result.classList.add('show');
                }, 100);

                // 恢复按钮
                btn.disabled = false;
                btn.textContent = '再抛一次';
                isFlipping = false;

            }, 3000);
        }

        // 重置统计
        function resetStats() {
            frontCount = 0;
            backCount = 0;
            updateStatsDisplay();
            saveStats();

            // 重置硬币位置
            const coin = document.getElementById('coin');
            coin.style.transform = 'rotateY(0deg)';

            // 隐藏结果
            const result = document.getElementById('result');
            result.classList.remove('show');

            // 重置按钮文字
            const btn = document.getElementById('flipBtn');
            btn.textContent = '开始抛硬币';
        }

        // 页面加载时读取统计
        loadStats();
    </script>
</body>
</html>
