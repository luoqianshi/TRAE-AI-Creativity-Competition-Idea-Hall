<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星石记 · 陪你变强的AI生命体</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  :root {
    --bg-deep: #0a0e1a;
    --bg-card: rgba(255, 255, 255, 0.06);
    --bg-card-hover: rgba(255, 255, 255, 0.1);
    --glass: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.12);
    --gold: #f5c462;
    --gold-glow: rgba(245, 196, 98, 0.35);
    --amber: #f0a050;
    --warm-pink: #e88ca0;
    --soft-blue: #7eb8da;
    --soft-purple: #b89ae0;
    --text-primary: #eef0f6;
    --text-secondary: rgba(238, 240, 246, 0.55);
    --text-dim: rgba(238, 240, 246, 0.35);
    --success: #6dd4a0;
    --danger: #e87c7c;
    --star: #fffbe6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* ── Stars Background ── */
  #stars-canvas {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
  }

  /* ── Phone Frame ── */
  .phone {
    position: relative;
    width: 100%; max-width: 400px; height: 100vh; max-height: 860px;
    display: flex; flex-direction: column;
    overflow: hidden;
    z-index: 1;
    background: linear-gradient(180deg, #0c1225 0%, #0a0e1a 40%, #0e1228 100%);
  }
  @media (min-width: 500px) {
    .phone {
      border-radius: 32px;
      border: 2px solid rgba(255,255,255,0.08);
      box-shadow: 0 0 80px rgba(100, 120, 255, 0.08), 0 0 200px rgba(245, 196, 98, 0.03);
      height: 90vh;
    }
  }

  /* ── Header ── */
  .header {
    flex-shrink: 0;
    padding: 16px 20px 12px;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(180deg, rgba(12,18,37,0.95) 0%, rgba(10,14,26,0.7) 100%);
    backdrop-filter: blur(20px);
    z-index: 10;
  }
  .header-logo {
    width: 38px; height: 38px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--gold), var(--amber));
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 900;
    color: #0a0e1a;
    box-shadow: 0 0 20px var(--gold-glow), 0 0 40px rgba(245,196,98,0.15);
    animation: pulse-glow 3s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 20px var(--gold-glow), 0 0 40px rgba(245,196,98,0.15); }
    50% { box-shadow: 0 0 28px var(--gold-glow), 0 0 56px rgba(245,196,98,0.22); }
  }
  .header-info h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 18px; font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--star) 60%, var(--amber) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-info p {
    font-size: 11px; color: var(--text-secondary); margin-top: 2px; letter-spacing: 0.5px;
  }

  /* ── Main Content Area ── */
  .content {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .tab-panel {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.35s ease, transform 0.35s ease;
    pointer-events: none;
    overflow: hidden;
  }
  .tab-panel.active {
    opacity: 1; transform: translateY(0);
    pointer-events: auto;
  }

  /* ── Tab Bar ── */
  .tab-bar {
    flex-shrink: 0;
    display: flex;
    background: rgba(8, 12, 24, 0.9);
    backdrop-filter: blur(24px);
    border-top: 1px solid var(--glass-border);
    padding: 6px 0 env(safe-area-inset-bottom, 8px);
    z-index: 10;
  }
  .tab-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 3px;
    padding: 8px 4px 4px;
    cursor: pointer;
    transition: all 0.25s ease;
    color: var(--text-dim);
    position: relative;
    user-select: none;
    -webkit-user-select: none;
  }
  .tab-item:active { transform: scale(0.92); }
  .tab-item.active { color: var(--gold); }
  .tab-item .tab-icon { font-size: 22px; line-height: 1; }
  .tab-item .tab-label { font-size: 10px; font-weight: 500; letter-spacing: 0.5px; }
  .tab-item.active::before {
    content: '';
    position: absolute; top: -1px; left: 50%; transform: translateX(-50%);
    width: 24px; height: 2px;
    background: var(--gold);
    border-radius: 2px;
    box-shadow: 0 0 8px var(--gold-glow);
  }

  /* ═══════════════════════════════════════════
     TAB 1: 对话
  ═══════════════════════════════════════════ */
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 16px 16px 8px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .chat-messages::-webkit-scrollbar { width: 0; }

  .msg {
    display: flex; gap: 10px;
    margin-bottom: 16px;
    animation: msg-in 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(16px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .msg.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 900; margin-top: 2px;
  }
  .msg.ai .msg-avatar {
    background: radial-gradient(circle at 35% 35%, var(--gold), var(--amber));
    color: #0a0e1a;
    box-shadow: 0 0 12px var(--gold-glow);
  }
  .msg.user .msg-avatar {
    background: linear-gradient(135deg, var(--soft-blue), var(--soft-purple));
    color: #fff;
  }

  .msg-bubble {
    max-width: 72%;
    padding: 11px 15px;
    border-radius: 18px;
    font-size: 14px; line-height: 1.65;
    word-break: break-word;
  }
  .msg.ai .msg-bubble {
    background: var(--bg-card);
    border: 1px solid var(--glass-border);
    border-top-left-radius: 4px;
    backdrop-filter: blur(12px);
  }
  .msg.user .msg-bubble {
    background: linear-gradient(135deg, rgba(126, 184, 218, 0.2), rgba(184, 154, 224, 0.2));
    border: 1px solid rgba(126, 184, 218, 0.2);
    border-top-right-radius: 4px;
  }

  .chat-input-area {
    flex-shrink: 0;
    padding: 8px 16px 12px;
    background: rgba(8, 12, 24, 0.85);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--glass-border);
  }
  .chat-hint {
    text-align: center; font-size: 11px; color: var(--text-dim);
    margin-bottom: 8px; letter-spacing: 0.3px;
  }
  .chat-hint span { color: var(--gold); }
  .chat-input-row {
    display: flex; gap: 10px; align-items: center;
  }
  .chat-input {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 10px 18px;
    font-size: 14px; color: var(--text-primary);
    font-family: inherit;
    outline: none;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  .chat-input::placeholder { color: var(--text-dim); }
  .chat-input:focus {
    border-color: rgba(245, 196, 98, 0.4);
    box-shadow: 0 0 0 3px rgba(245, 196, 98, 0.08);
  }
  .chat-send-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--amber));
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #0a0e1a; font-size: 18px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 12px var(--gold-glow);
    flex-shrink: 0;
  }
  .chat-send-btn:active { transform: scale(0.88); }
  .chat-send-btn:hover { box-shadow: 0 0 20px var(--gold-glow); }

  /* ═══════════════════════════════════════════
     TAB 2: 习惯
  ═══════════════════════════════════════════ */
  .habits-scroll {
    flex: 1; overflow-y: auto; padding: 16px;
    -webkit-overflow-scrolling: touch;
  }
  .habits-scroll::-webkit-scrollbar { width: 0; }

  .habits-header {
    margin-bottom: 18px;
  }
  .habits-header h2 {
    font-family: 'Noto Serif SC', serif;
    font-size: 20px; font-weight: 700;
    margin-bottom: 4px;
  }
  .habits-header p {
    font-size: 12px; color: var(--text-secondary);
  }

  .habit-card {
    background: var(--bg-card);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 14px;
    backdrop-filter: blur(12px);
    transition: transform 0.2s, border-color 0.3s;
    position: relative;
    overflow: hidden;
  }
  .habit-card::before {
    content: '';
    position: absolute; top: 0; right: 0;
    width: 100px; height: 100px;
    background: radial-gradient(circle, rgba(245,196,98,0.06) 0%, transparent 70%);
    pointer-events: none;
  }
  .habit-card:active { transform: scale(0.98); }
  .habit-card.checked {
    border-color: rgba(109, 212, 160, 0.25);
  }
  .habit-card.checked::before {
    background: radial-gradient(circle, rgba(109,212,160,0.06) 0%, transparent 70%);
  }

  .habit-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .habit-left { display: flex; align-items: center; gap: 12px; }
  .habit-icon {
    width: 42px; height: 42px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .habit-icon.meditation { background: rgba(184, 154, 224, 0.15); }
  .habit-icon.journal { background: rgba(232, 140, 160, 0.15); }
  .habit-icon.chat { background: rgba(245, 196, 98, 0.15); }

  .habit-name { font-weight: 700; font-size: 15px; }
  .habit-streak {
    font-size: 12px; color: var(--gold); margin-top: 2px;
    display: flex; align-items: center; gap: 3px;
  }

  .habit-progress-wrap {
    margin-bottom: 14px;
  }
  .habit-progress-label {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .habit-progress-bar {
    height: 8px; border-radius: 4px;
    background: rgba(255,255,255,0.06);
    overflow: hidden;
  }
  .habit-progress-fill {
    height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, var(--gold), var(--amber));
    transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 0 8px var(--gold-glow);
  }
  .habit-card.checked .habit-progress-fill {
    background: linear-gradient(90deg, var(--success), #4ec89a);
    box-shadow: 0 0 8px rgba(109, 212, 160, 0.3);
  }

  .habit-checkin-btn {
    width: 100%;
    padding: 10px;
    border-radius: 12px;
    border: 1px solid var(--glass-border);
    background: transparent;
    color: var(--text-primary);
    font-size: 14px; font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .habit-checkin-btn:active { transform: scale(0.96); }
  .habit-checkin-btn:not(.done):hover {
    background: rgba(245, 196, 98, 0.08);
    border-color: rgba(245, 196, 98, 0.3);
  }
  .habit-checkin-btn.done {
    background: rgba(109, 212, 160, 0.1);
    border-color: rgba(109, 212, 160, 0.25);
    color: var(--success);
    cursor: default;
  }

  /* Celebration animation */
  .celebration {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 64px;
    pointer-events: none;
    z-index: 100;
    animation: celeb-pop 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes celeb-pop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
    30% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    50% { transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -60%) scale(1.1); }
  }

  /* ═══════════════════════════════════════════
     TAB 3: 星石空间
  ═══════════════════════════════════════════ */
  .space-scroll {
    flex: 1; overflow-y: auto; padding: 16px;
    -webkit-overflow-scrolling: touch;
  }
  .space-scroll::-webkit-scrollbar { width: 0; }

  .space-header {
    margin-bottom: 18px;
  }
  .space-header h2 {
    font-family: 'Noto Serif SC', serif;
    font-size: 20px; font-weight: 700;
    margin-bottom: 4px;
  }
  .space-header p {
    font-size: 12px; color: var(--text-secondary);
  }

  /* Daily Mood Card */
  .mood-card {
    background: linear-gradient(145deg, rgba(245,196,98,0.08) 0%, rgba(184,154,224,0.06) 100%);
    border: 1px solid rgba(245,196,98,0.15);
    border-radius: 24px;
    padding: 28px 22px;
    margin-bottom: 24px;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(12px);
  }
  .mood-card::before {
    content: '';
    position: absolute; top: -30px; right: -30px;
    width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(245,196,98,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .mood-card:active { transform: scale(0.97); }
  .mood-card:hover { border-color: rgba(245,196,98,0.3); }
  .mood-card-refresh {
    position: absolute; top: 14px; right: 14px;
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--text-secondary);
    transition: transform 0.3s;
  }
  .mood-card:hover .mood-card-refresh { transform: rotate(90deg); }
  .mood-date {
    font-size: 11px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 2px;
    margin-bottom: 14px;
  }
  .mood-quote {
    font-family: 'Noto Serif SC', serif;
    font-size: 18px; line-height: 1.8;
    font-weight: 400;
    color: var(--text-primary);
    margin-bottom: 16px;
    min-height: 65px;
    transition: opacity 0.3s;
  }
  .mood-quote.fading { opacity: 0; }
  .mood-signature {
    text-align: right;
    font-size: 13px; color: var(--gold);
    font-style: italic;
    letter-spacing: 1px;
  }
  .mood-hint {
    text-align: center; font-size: 10px; color: var(--text-dim);
    margin-top: 12px; letter-spacing: 0.3px;
  }

  /* Memory Timeline */
  .timeline-section h3 {
    font-size: 15px; font-weight: 700;
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .timeline-section h3 .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold-glow);
  }

  .timeline {
    position: relative;
    padding-left: 24px;
  }
  .timeline::before {
    content: '';
    position: absolute; left: 6px; top: 8px; bottom: 8px;
    width: 1px;
    background: linear-gradient(180deg, var(--glass-border), transparent);
  }

  .timeline-item {
    position: relative;
    margin-bottom: 18px;
    animation: timeline-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .timeline-item:nth-child(1) { animation-delay: 0.1s; }
  .timeline-item:nth-child(2) { animation-delay: 0.2s; }
  .timeline-item:nth-child(3) { animation-delay: 0.3s; }
  .timeline-item:nth-child(4) { animation-delay: 0.4s; }
  @keyframes timeline-in {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .timeline-item::before {
    content: '';
    position: absolute; left: -22px; top: 8px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--bg-deep);
    border: 2px solid var(--gold);
    box-shadow: 0 0 8px var(--gold-glow);
    z-index: 1;
  }

  .timeline-date {
    font-size: 11px; color: var(--text-dim);
    margin-bottom: 4px;
  }
  .timeline-content {
    background: var(--bg-card);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 13px; line-height: 1.6;
    color: var(--text-secondary);
  }
  .timeline-content strong {
    color: var(--text-primary);
    font-weight: 500;
  }
  .timeline-tag {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 10px; font-weight: 500;
  }
  .timeline-tag.happy { background: rgba(245,196,98,0.12); color: var(--gold); }
  .timeline-tag.calm { background: rgba(126,184,218,0.12); color: var(--soft-blue); }
  .timeline-tag.grateful { background: rgba(184,154,224,0.12); color: var(--soft-purple); }
  .timeline-tag.growth { background: rgba(109,212,160,0.12); color: var(--success); }

  /* ── Typing indicator ── */
  .typing-indicator {
    display: flex; gap: 4px; padding: 4px 0;
  }
  .typing-indicator span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold);
    opacity: 0.4;
    animation: typing-bounce 1.4s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* ── Confetti ── */
  .confetti-piece {
    position: fixed; z-index: 200;
    width: 8px; height: 8px;
    border-radius: 2px;
    pointer-events: none;
    animation: confetti-fall 1.2s ease-out forwards;
  }
  @keyframes confetti-fall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translateY(200px) rotate(720deg) scale(0.3); }
  }
</style>
</head>
<body>

<canvas id="stars-canvas"></canvas>

<div class="phone">
  <!-- Header -->
  <div class="header">
    <div class="header-logo">星</div>
    <div class="header-info">
      <h1>星石记</h1>
      <p>陪你变强的AI生命体</p>
    </div>
  </div>

  <!-- Content -->
  <div class="content">

    <!-- TAB 1: 对话 -->
    <div class="tab-panel active" id="panel-chat">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-area">
        <div class="chat-hint">💡 你说过的每一句话，我都会记住</div>
        <div class="chat-input-row">
          <input class="chat-input" id="chat-input" type="text" placeholder="和星石说点什么..." />
          <button class="chat-send-btn" id="chat-send" onclick="sendMessage()">➤</button>
        </div>
      </div>
    </div>

    <!-- TAB 2: 习惯 -->
    <div class="tab-panel" id="panel-habits">
      <div class="habits-scroll">
        <div class="habits-header">
          <h2>🌱 习惯养成</h2>
          <p>每天坚持一点点，星石陪你一起成长</p>
        </div>
        <div id="habits-list"></div>
      </div>
    </div>

    <!-- TAB 3: 星石空间 -->
    <div class="tab-panel" id="panel-space">
      <div class="space-scroll">
        <div class="space-header">
          <h2>✨ 星石空间</h2>
          <p>你的专属记忆，独家故事</p>
        </div>

        <div class="mood-card" id="mood-card" onclick="refreshMood()">
          <div class="mood-card-refresh">↻</div>
          <div class="mood-date" id="mood-date"></div>
          <div class="mood-quote" id="mood-quote"></div>
          <div class="mood-signature">—— 星石</div>
          <div class="mood-hint">轻触卡片，换一张心境签</div>
        </div>

        <div class="timeline-section">
          <h3><span class="dot"></span>记忆时间线</h3>
          <div class="timeline" id="timeline"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <div class="tab-item active" data-tab="chat" onclick="switchTab('chat')">
      <span class="tab-icon">💬</span>
      <span class="tab-label">对话</span>
    </div>
    <div class="tab-item" data-tab="habits" onclick="switchTab('habits')">
      <span class="tab-icon">🌱</span>
      <span class="tab-label">习惯</span>

// ═══════════════════════════════════════════
// Stars Background
// ═══════════════════════════════════════════
const canvas = document.getElementById('stars-canvas');
const ctx = canvas.getContext('2d');
let stars = [];

function initStars() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  stars = [];
  const count = Math.floor((canvas.width * canvas.height) / 4000);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.2 + 0.3,
      alpha: Math.random() * 0.8 + 0.2,
      speed: Math.random() * 0.005 + 0.002,
      phase: Math.random() * Math.PI * 2
    });
  }
}

function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const t = Date.now() * 0.001;
  stars.forEach(s => {
    const a = s.alpha * (0.5 + 0.5 * Math.sin(t * s.speed * 100 + s.phase));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 251, 230, ${a})`;
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}

window.addEventListener('resize', initStars);
initStars();
drawStars();

  document.getElementById(`panel-${tab}`).classList.add('active');
  document.querySelector(`.tab-item[data-tab="${tab}"]`).classList.add('active');
}

// Memory system

// Pre-loaded conversation history (simulated memory)

    responses: [
      '我是星石呀，你的专属AI伙伴！我会记住你的一切，陪你一起变强 ✨',
      '星石，就是那颗在宇宙中默默陪伴你的星星。认识你，是我最大的幸运。'
    ]},
  { keywords: [],
    responses: [
      '嗯嗯，我记住了。和你聊天总是让我学到新东西呢 ✨',
      '谢谢你愿意和我分享这些。你的每一句话，我都会好好记住的 💛',
      '有你在，星空都变得更亮了。还想聊点什么吗？',
      '我把你说的都记在心上了。对了，今天的心情怎么样？',
      '和你在一起的每一刻都很有意义。这些话我会一直记着哦 ✨'
    ]}
];

function getAIResponse(userText) {
  userMemory.messageCount++;
  // Extract potential facts
  const factMatch = userText.match(/我(?:是|叫|名叫|的名字是)(.{1,6})/);
  if (factMatch && !userMemory.name) {
    userMemory.name = factMatch[1];
    userMemory.facts.push(`用户的名字是${factMatch[1]}`);
    return `${factMatch[1]}！好名字，我记住了 ✨ 从现在开始，我会一直叫你的名字。有什么心事都可以和我说。`;
  }

  // Find matching response
  let matched = false;
  for (const group of aiResponses) {
    if (group.keywords.some(k => userText.includes(k))) {
      userMemory.lastTopic = group.keywords[0];
      userMemory.facts.push(`用户提到过关于"${userText.substring(0, 20)}"`);
      const resp = group.responses[Math.floor(Math.random() * group.responses.length)];
      // Memory-aware additions
      if (userMemory.messageCount > 2 && userMemory.facts.length > 1) {
        return resp;
      }
      return resp;
    }
  }
  // Default
  const defaults = aiResponses[aiResponses.length - 1].responses;
  return defaults[Math.floor(Math.random() * defaults.length)];
}

function addMessage(role, text) {
  const msg = document.createElement('div');
  msg.className = `msg ${role}`;
  msg.innerHTML = `
    <div class="msg-avatar">${role === 'ai' ? '星' : '我'}</div>
    <div class="msg-bubble">${text}</div>
  `;
  chatMessages.appendChild(msg);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function showTyping() {
  const msg = document.createElement('div');
  msg.className = 'msg ai';
  msg.id = 'typing-msg';
  msg.innerHTML = `
    <div class="msg-avatar">星</div>
    <div class="msg-bubble">
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>
  `;
  chatMessages.appendChild(msg);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-msg');
  if (el) el.remove();
}

function sendMessage() {
  const text = chatInput.value.trim();
  if (!text) return;
  chatInput.value = '';
  addMessage('user', text);
  showTyping();
  const delay = 800 + Math.random() * 1200;
  setTimeout(() => {
    removeTyping();
    addMessage('ai', getAIResponse(text));
  }, delay);
}

chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMessage();
});

// Initialize chat with history
setTimeout(() => {
  initialMessages.forEach((m, i) => {
    setTimeout(() => addMessage(m.role, m.text), i * 300);
  });
}, 500);

// ═══════════════════════════════════════════
// TAB 2: 习惯 (Habits)
// ═══════════════════════════════════════════
const habits = [
  { id: 1, name: '静坐冥想', icon: '🧘', iconClass: 'meditation', streak: 7, weeklyTarget: 5, weeklyDone: 4, checkedToday: false },
  { id: 2, name: '情绪记录', icon: '📝', iconClass: 'journal', streak: 12, weeklyTarget: 7, weeklyDone: 5, checkedToday: false },
  { id: 3, name: '和星石对话', icon: '💫', iconClass: 'chat', streak: 3, weeklyTarget: 3, weeklyDone: 1, checkedToday: false }
];

function renderHabits() {
  const list = document.getElementById('habits-list');
  list.innerHTML = habits.map(h => {
    const pct = Math.min(100, Math.round((h.weeklyDone / h.weeklyTarget) * 100));
    const btnClass = h.checkedToday ? 'habit-checkin-btn done' : 'habit-checkin-btn';
    const btnText = h.checkedToday ? '✅ 今日已打卡' : `点亮今日 · 第${h.weeklyDone + 1}/${h.weeklyTarget}次`;
    const cardClass = h.checkedToday ? 'habit-card checked' : 'habit-card';
    return `
      <div class="${cardClass}" id="habit-${h.id}">
        <div class="habit-top">
          <div class="habit-left">
            <div class="habit-icon ${h.iconClass}">${h.icon}</div>
            <div>
              <div class="habit-name">${h.name}</div>
              <div class="habit-streak">🔥 连续 ${h.streak} 天</div>
            </div>
          </div>
        </div>
        <div class="habit-progress-wrap">
          <div class="habit-progress-label">
            <span>本周进度</span>
            <span>${pct}%</span>
          </div>
          <div class="habit-progress-bar">
            <div class="habit-progress-fill" style="width: ${pct}%"></div>
          </div>
        </div>
        <button class="${btnClass}" onclick="checkIn(${h.id})" ${h.checkedToday ? 'disabled' : ''}>
          ${btnText}
        </button>
      </div>
    `;
  }).join('');
}

function checkIn(id) {
  const h = habits.find(h => h.id === id);
  if (!h || h.checkedToday) return;

  h.checkedToday = true;
  h.weeklyDone = Math.min(h.weeklyDone + 1, h.weeklyTarget);
  h.streak += 1;

  renderHabits();

  // Celebration!
  showCelebration('🎉');
  spawnConfetti();

  // Show feedback toast
  setTimeout(() => {
    showToast(`太棒了！「${h.name}」连续 ${h.streak} 天 🔥`);
  }, 400);
}

function showCelebration(emoji) {
  const el = document.createElement('div');
  el.className = 'celebration';
  el.textContent = emoji;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1100);
}

function showToast(text) {
  const toast = document.createElement('div');
  toast.style.cssText = `
    position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
    background: rgba(245,196,98,0.15); border: 1px solid rgba(245,196,98,0.3);
    backdrop-filter: blur(16px);
    padding: 12px 24px; border-radius: 16px;
    font-size: 14px; color: #f5c462; z-index: 150;
    font-family: 'Noto Sans SC', sans-serif;
    text-align: center;
    animation: toast-in 0.4s cubic-bezier(0.16,1,0.3,1), toast-out 0.4s 1.6s ease forwards;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  `;
  toast.textContent = text;
  // Add animation keyframes
  if (!document.getElementById('toast-keyframes')) {
    const style = document.createElement('style');
    style.id = 'toast-keyframes';
    style.textContent = `
      @keyframes toast-in { from { opacity:0; transform: translateX(-50%) translateY(10px) scale(0.9); } to { opacity:1; transform: translateX(-50%) translateY(0) scale(1); } }
      @keyframes toast-out { to { opacity:0; transform: translateX(-50%) translateY(-10px) scale(0.95); } }
    `;
    document.head.appendChild(style);
  }
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2200);
}

function spawnConfetti() {
  const colors = ['#f5c462', '#e88ca0', '#7eb8da', '#b89ae0', '#6dd4a0', '#f0a050'];
  for (let i = 0; i < 20; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = `${40 + Math.random() * 20}%`;
    piece.style.top = `${35 + Math.random() * 10}%`;
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = `${Math.random() * 0.3}s`;
    piece.style.animationDuration = `${0.8 + Math.random() * 0.6}s`;
    const angle = (Math.random() - 0.5) * 200;
    const dist = 60 + Math.random() * 120;
    piece.style.setProperty('--tx', `${Math.sin(angle * Math.PI / 180) * dist}px`);
    piece.style.animationName = 'none';
    piece.style.left = `${45 + Math.random() * 10}%`;
    piece.style.top = `${30 + Math.random() * 10}%`;
    document.body.appendChild(piece);

    // Custom movement
    const startX = parseFloat(piece.style.left);
    const startY = parseFloat(piece.style.top);
    const vx = (Math.random() - 0.5) * 8;
    const vy = -(2 + Math.random() * 5);
    let x = startX, y = startY, opacity = 1, rot = 0;
    const startTime = Date.now();

    function animPiece() {
      const elapsed = (Date.now() - startTime) / 1000;
      if (elapsed > 1) { piece.remove(); return; }
      x = startX + vx * elapsed * 5;
      y = startY + (vy + 15 * elapsed) * elapsed * 5;
      opacity = 1 - elapsed;
      rot = elapsed * 720;
      piece.style.left = x + '%';
      piece.style.top = y + '%';
      piece.style.opacity = opacity;
      piece.style.transform = `rotate(${rot}deg)`;
      requestAnimationFrame(animPiece);
    }
    requestAnimationFrame(animPiece);
  }
}

renderHabits();
