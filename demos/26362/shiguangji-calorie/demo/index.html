    // ========== Tab Navigation ==========
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        const tabId = item.dataset.tab;
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        item.classList.add('active');
        document.getElementById(tabId).classList.add('active');
      });
    });

    // ========== Meal Selector ==========
    document.querySelectorAll('.meal-option').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.meal-option').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        currentMeal = btn.dataset.meal;
      });
    });

    // ========== File Upload ==========
    uploadArea.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', handleFileSelect);

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        currentImage = event.target.result;
        previewImg.src = currentImage;
        previewContainer.style.display = 'block';
        uploadArea.style.display = 'none';
        analyzeBtn.disabled = false;
        resultCard.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    removeBtn.addEventListener('click', () => {
      currentImage = null;
      previewContainer.style.display = 'none';
      uploadArea.style.display = 'block';
      analyzeBtn.disabled = true;
      resultCard.style.display = 'none';
      fileInput.value = '';
    });

    // ========== AI Analysis (Simulated) ==========
    analyzeBtn.addEventListener('click', () => {
      if (!currentImage) return;

      analyzeBtn.style.display = 'none';
      loading.style.display = 'block';
      resultCard.style.display = 'none';

      // Simulate AI processing
      setTimeout(() => {
        const foods = Object.keys(foodDatabase);
        const randomFood = foods[Math.floor(Math.random() * foods.length)];
        currentFood = { name: randomFood, ...foodDatabase[randomFood] };
        currentPortion = 100;

        showResult();
        loading.style.display = 'none';
        analyzeBtn.style.display = 'flex';
      }, 2000);
    });

    function showResult() {
      if (!currentFood) return;

      document.getElementById('foodName').textContent = currentFood.name;
      document.getElementById('foodConfidence').textContent = `识别置信度: ${currentFood.confidence}%`;
      document.getElementById('calorieNumber').textContent = currentFood.cal;
      document.getElementById('protein').textContent = currentFood.protein + 'g';
      document.getElementById('fat').textContent = currentFood.fat + 'g';
      document.getElementById('carbs').textContent = currentFood.carbs + 'g';
      document.getElementById('portionValue').textContent = currentPortion;
      updateTotalCalorie();

      resultCard.style.display = 'block';
    }

    // ========== Portion Control ==========
    document.getElementById('minusBtn').addEventListener('click', () => {
      if (currentPortion > 50) {
        currentPortion -= 50;
        document.getElementById('portionValue').textContent = currentPortion;
        updateTotalCalorie();
      }
    });

    document.getElementById('plusBtn').addEventListener('click', () => {
      currentPortion += 50;
      document.getElementById('portionValue').textContent = currentPortion;
      updateTotalCalorie();
    });

    function updateTotalCalorie() {
      if (!currentFood) return;
      const total = Math.round(currentFood.cal * currentPortion / 100);
      document.getElementById('totalCalorie').textContent = total;
    }

    // ========== Add Record ==========
    document.getElementById('addRecordBtn').addEventListener('click', () => {
      if (!currentFood) return;

      const record = {
        id: Date.now(),
        food: currentFood.name,
        calorie: Math.round(currentFood.cal * currentPortion / 100),
        portion: currentPortion,
        meal: currentMeal,
        image: currentImage,
        time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }),
        date: new Date().toDateString()
      };

      records.push(record);
      saveRecords();
      updateSummary();
      renderRecords();
      renderWeekGrid();
      updateSuggestion();

      showToast(`已添加: ${record.food} ${record.calorie}kcal`);

      // Reset
      currentFood = null;
      currentPortion = 100;
      currentImage = null;
      previewContainer.style.display = 'none';
      uploadArea.style.display = 'block';
      analyzeBtn.disabled = true;
      resultCard.style.display = 'none';
      fileInput.value = '';

      // Switch to records tab
      document.querySelector('[data-tab="tab-records"]').click();
    });

    // ========== Quick Foods ==========
    function renderQuickFoods() {
      const container = document.getElementById('quickFoods');
      container.innerHTML = quickFoods.map(food => `
        <button class="meal-option" style="flex:0 0 auto;padding:8px 16px;" onclick="addQuickFood('${food}')">
          ${food}
        </button>
      `).join('');
    }

    function addQuickFood(foodName) {
      const food = foodDatabase[foodName];
      if (!food) return;

      currentFood = { name: foodName, ...food };
      currentPortion = 100;
      currentImage = null;

      // Show result directly
      document.getElementById('foodName').textContent = foodName;
      document.getElementById('foodConfidence').textContent = `识别置信度: ${food.confidence}%`;
      document.getElementById('calorieNumber').textContent = food.cal;
      document.getElementById('protein').textContent = food.protein + 'g';
      document.getElementById('fat').textContent = food.fat + 'g';
      document.getElementById('carbs').textContent = food.carbs + 'g';
      document.getElementById('portionValue').textContent = 100;
      updateTotalCalorie();

      previewContainer.style.display = 'none';
      uploadArea.style.display = 'none';
      analyzeBtn.style.display = 'none';
      resultCard.style.display = 'block';
    }

    // ========== Records ==========
    function saveRecords() {
      localStorage.setItem('shiguangji_records', JSON.stringify(records));
    }

    function getTodayRecords() {
      const today = new Date().toDateString();
      return records.filter(r => r.date === today);
    }

    function updateSummary() {
      const todayRecords = getTodayRecords();
      const total = todayRecords.reduce((sum, r) => sum + r.calorie, 0);
      const remaining = targetCalories - total;

      document.getElementById('todayCal').textContent = total;
      document.getElementById('targetCal').textContent = targetCalories;
      document.getElementById('remainCal').textContent = remaining;

      const progress = Math.min((total / targetCalories) * 100, 100);
      document.getElementById('todayProgress').style.width = progress + '%';
      document.getElementById('remainProgress').style.width = Math.max((remaining / targetCalories) * 100, 0) + '%';
    }

    function renderRecords() {
      const container = document.getElementById('recordsList');
      const todayRecords = getTodayRecords();

      if (todayRecords.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">&#128230;</div>
            <p>今日还没有记录哦<br>快去拍照添加吧！</p>
          </div>
        `;
        return;
      }

      const mealNames = { breakfast: '早餐', lunch: '午餐', dinner: '晚餐' };
      const mealEmojis = { breakfast: '&#127774;', lunch: '&#127775;', dinner: '&#127769;' };

      container.innerHTML = todayRecords.map(record => `
        <div class="record-item">
          ${record.image ? `<img src="${record.image}" alt="">` : `<div style="width:56px;height:56px;border-radius:8px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:24px;">${mealEmojis[record.meal]}</div>`}
          <div class="record-info">
            <div class="name">${record.food}</div>
            <div class="detail">${mealNames[record.meal]} · ${record.portion}g · ${record.time}</div>
          </div>
          <div class="record-calorie">${record.calorie}</div>
          <button class="record-delete" onclick="deleteRecord(${record.id})">&times;</button>
        </div>
      `).join('');
    }

    function deleteRecord(id) {
      records = records.filter(r => r.id !== id);
      saveRecords();
      updateSummary();
      renderRecords();
      renderWeekGrid();
      updateSuggestion();
      showToast('已删除记录');
    }

    // ========== Week Grid ==========
    function renderWeekGrid() {
      const container = document.getElementById('weekGrid');
      const days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
      const today = new Date().getDay();
      const adjustedToday = today === 0 ? 6 : today - 1;

      let html = '';
      for (let i = 0; i < 7; i++) {
        const date = new Date();
        date.setDate(date.getDate() - adjustedToday + i);
        const dateStr = date.toDateString();
        const dayRecords = records.filter(r => r.date === dateStr);
        const total = dayRecords.reduce((sum, r) => sum + r.calorie, 0);
        const isToday = i === adjustedToday;
        const barWidth = Math.min((total / targetCalories) * 100, 100);

        html += `
          <div class="week-day ${isToday ? 'today' : ''}">
            <div class="day-name">${days[i]}</div>
            <div class="day-cal">${total}</div>
            <div class="day-bar">
              <div class="day-bar-fill" style="width:${barWidth}%"></div>
            </div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    // ========== Profile ==========
    document.getElementById('saveGoalBtn').addEventListener('click', () => {
      targetCalories = parseInt(document.getElementById('targetInput').value) || 1500;
      localStorage.setItem('shiguangji_target', targetCalories);
      updateSummary();
      renderWeekGrid();
      updateSuggestion();
      showToast('设置已保存');
    });

    function updateSuggestion() {
      const todayRecords = getTodayRecords();
      const total = todayRecords.reduce((sum, r) => sum + r.calorie, 0);
      const remaining = targetCalories - total;
      const weight = parseFloat(document.getElementById('weightInput').value) || 65;
      const goalWeight = parseFloat(document.getElementById('goalWeightInput').value) || 58;

      let suggestion = '';
      if (total === 0) {
        suggestion = '&#127774; 今天还没有记录饮食哦！建议早餐摄入 300-400 kcal，可以选择燕麦、鸡蛋、牛奶等营养丰富的食物。';
      } else if (remaining > 500) {
        suggestion = `&#127775; 今日已摄入 ${total} kcal，还可摄入约 ${remaining} kcal。建议晚餐选择低热量蔬菜，如西兰花、黄瓜、西红柿等。距离目标体重还有 ${(weight - goalWeight).toFixed(1)}kg，加油！`;
      } else if (remaining > 0) {
        suggestion = `&#9888; 今日剩余热量不多了（约 ${remaining} kcal），建议下一餐选择清淡食物，避免高热量油炸食品。`;
      } else {
        suggestion = `&#128308; 今日热量已超标 ${Math.abs(remaining)} kcal！建议适当运动消耗，如快走 30 分钟可消耗约 150 kcal。明天继续加油！`;
      }

      document.getElementById('suggestionText').innerHTML = suggestion;
    }

    // ========== Toast ==========
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ========== Start ==========
    init();
  </script>
</body>
</html>
