<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽象礼物 — 把心意做成卡片，礼物不必真的存在</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=ZCOOL+XiaoWei&family=Long+Cang&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --cream:#fef6e4;
    --cream-2:#fffaf0;
    --ink:#2a2a2a;
    --ink-2:#5a5a5a;
    --ink-3:#9a9a9a;
    --pink:#ff5d8f;
    --blue:#3a86ff;
    --yellow:#ffbe0b;
    --mint:#06d6a0;
    --purple:#8338ec;
    --coral:#ff6b35;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Noto Sans SC',sans-serif;
    color:var(--ink);
    background:var(--cream);
    background-image:
      radial-gradient(circle at 10% 10%, rgba(255,93,143,.08), transparent 40%),
      radial-gradient(circle at 90% 20%, rgba(58,134,255,.08), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(131,56,236,.07), transparent 45%);
    min-height:100vh;
    overflow-x:hidden;
    line-height:1.7;
  }
  /* 背景小点点 */
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background-image:
      radial-gradient(circle, rgba(255,190,11,.5) 1.5px, transparent 1.6px),
      radial-gradient(circle, rgba(255,93,143,.4) 1px, transparent 1.1px);
    background-size:48px 48px, 72px 72px;
    background-position:0 0, 24px 24px;
  }
  .wrap{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:48px 24px 70px}

  /* 头部 */
  header{text-align:center;margin-bottom:36px;position:relative}
  .logo-row{display:inline-flex;align-items:center;gap:14px;position:relative}
  .gift-ico{
    width:64px;height:64px;
    background:linear-gradient(135deg,var(--pink),var(--coral));
    border-radius:18px;
    display:flex;align-items:center;justify-content:center;
    font-size:36px;
    box-shadow:0 10px 24px rgba(255,93,143,.35), inset 0 -4px 0 rgba(0,0,0,.12);
    transform:rotate(-6deg);
    animation:wobble 4s ease-in-out infinite;
  }
  @keyframes wobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(4deg)}}
  h1{
    font-family:'ZCOOL KuaiLe',cursive;
    font-size:clamp(40px,7vw,64px);
    color:var(--ink);
    letter-spacing:4px;
    line-height:1;
  }
  h1 span{color:var(--pink)}
  .sub{font-family:'Long Cang';font-size:22px;color:var(--purple);letter-spacing:4px;margin-top:8px}
  .desc{font-size:13px;color:var(--ink-2);margin-top:10px;letter-spacing:2px}
  .desc::before,.desc::after{content:'✦';color:var(--yellow);margin:0 8px}
  .sticker{
    position:absolute;font-family:'ZCOOL KuaiLe';font-size:14px;
    padding:4px 10px;border-radius:12px;color:#fff;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
  }
  .stk-1{top:-8px;left:8%;background:var(--mint);transform:rotate(-12deg)}
  .stk-2{top:14px;right:6%;background:var(--blue);transform:rotate(8deg)}

  /* 输入卡 */
  .input-card{
    background:var(--cream-2);
    border:2.5px solid var(--ink);
    border-radius:22px;
    padding:28px 28px 24px;
    box-shadow:8px 8px 0 var(--ink);
    position:relative;
    margin-bottom:32px;
  }
  .tape{
    position:absolute;width:90px;height:26px;
    background:rgba(255,190,11,.6);
    box-shadow:0 2px 6px rgba(0,0,0,.08);
  }
  .tape::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 4px,rgba(255,255,255,.3) 4px 8px)}
  .tape-1{top:-13px;left:40px;transform:rotate(-4deg)}
  .tape-2{top:-13px;right:40px;transform:rotate(3deg);background:rgba(58,134,255,.5)}

  .field{margin-bottom:20px}
  .field:last-of-type{margin-bottom:0}
  .field-label{
    font-family:'ZCOOL KuaiLe';font-size:18px;color:var(--ink);
    display:flex;align-items:center;gap:8px;margin-bottom:10px;letter-spacing:1px;
  }
  .field-label .num{
    width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--cream);
    display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-family:'Noto Sans SC';font-weight:700;
  }
  .field-label .opt{font-family:'Noto Sans SC';font-size:11px;color:var(--ink-3);font-weight:400;margin-left:auto;letter-spacing:0}
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{
    cursor:pointer;padding:8px 15px;border-radius:20px;
    background:#fff;border:2px solid var(--ink);
    font-size:13px;color:var(--ink);font-weight:500;
    transition:all .15s;
    box-shadow:2px 2px 0 var(--ink);
  }
  .chip:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
  .chip:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
  .chip.active{background:var(--ink);color:var(--cream);box-shadow:2px 2px 0 var(--pink)}
  .chip .em{margin-right:3px}

  .gen-btn{
    width:100%;margin-top:24px;padding:18px;
    font-family:'ZCOOL KuaiLe';font-size:24px;letter-spacing:6px;
    color:#fff;
    background:linear-gradient(135deg,var(--pink),var(--coral));
    border:2.5px solid var(--ink);border-radius:16px;cursor:pointer;
    box-shadow:5px 5px 0 var(--ink);
    transition:all .12s;
    position:relative;overflow:hidden;
  }
  .gen-btn:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--ink)}
  .gen-btn:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink)}
  .gen-btn:disabled{opacity:.6;cursor:not-allowed}

  /* 加载 */
  .loading{display:none;text-align:center;padding:40px}
  .loading.show{display:block}
  .box-shake{
    width:70px;height:70px;margin:0 auto 16px;
    background:linear-gradient(135deg,var(--purple),var(--pink));
    border:2.5px solid var(--ink);border-radius:14px;
    display:flex;align-items:center;justify-content:center;font-size:36px;
    box-shadow:4px 4px 0 var(--ink);
    animation:shake .4s ease-in-out infinite;
  }
  @keyframes shake{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-4px)}}
  .load-text{font-family:'ZCOOL KuaiLe';color:var(--ink);font-size:18px;letter-spacing:3px}
  .load-dots span{animation:blink 1.4s infinite}
  .load-dots span:nth-child(2){animation-delay:.2s}
  .load-dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}

  /* 礼物卡 */
  .result{display:none;margin-top:8px}
  .result.show{display:block;animation:popIn .6s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes popIn{0%{opacity:0;transform:scale(.7) translateY(20px)}100%{opacity:1;transform:scale(1) translateY(0)}}

  .gift-card{
    background:var(--cream-2);
    border:2.5px solid var(--ink);
    border-radius:24px;
    box-shadow:10px 10px 0 var(--ink);
    overflow:hidden;
    position:relative;
    max-width:480px;margin:0 auto;
  }
  /* 卡顶 */
  .gc-top{
    padding:14px 20px;
    border-bottom:2.5px solid var(--ink);
    display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(90deg, rgba(255,190,11,.15), rgba(255,93,143,.12));
  }
  .gc-brand{font-family:'ZCOOL KuaiLe';font-size:16px;letter-spacing:2px;display:flex;align-items:center;gap:6px}
  .gc-brand .dot{width:10px;height:10px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 2px var(--ink)}
  .rarity{
    font-family:'ZCOOL KuaiLe';font-size:13px;letter-spacing:1px;
    padding:4px 12px;border-radius:12px;border:2px solid var(--ink);
    box-shadow:2px 2px 0 var(--ink);
  }
  .rarity.SSR{background:linear-gradient(135deg,var(--yellow),var(--coral));color:var(--ink)}
  .rarity.SR{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff}
  .rarity.R{background:var(--blue);color:#fff}
  .rarity.N{background:#fff;color:var(--ink)}

  /* 视觉区 */
  .gc-visual{
    height:200px;position:relative;overflow:hidden;
    border-bottom:2.5px solid var(--ink);
    display:flex;align-items:center;justify-content:center;
  }
  .gc-visual .blob{
    position:absolute;width:240px;height:240px;border-radius:48% 52% 60% 40% / 50%;
    filter:blur(0);opacity:.85;
    animation:morph 8s ease-in-out infinite;
  }
  @keyframes morph{0%,100%{border-radius:48% 52% 60% 40% / 50%}50%{border-radius:60% 40% 48% 52% / 40% 60%}}
  .gc-visual .em{
    position:relative;font-size:84px;z-index:2;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,.2));
    animation:floaty 4s ease-in-out infinite;
  }
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
  .gc-visual .star{position:absolute;font-size:20px;animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .gc-visual .cost{
    position:absolute;top:14px;right:14px;
    background:#fff;border:2px solid var(--ink);border-radius:10px;
    padding:5px 10px;font-size:11px;font-weight:700;
    box-shadow:2px 2px 0 var(--ink);transform:rotate(4deg);z-index:3;
    font-family:'Noto Sans SC';
  }

  /* 名称区 */
  .gc-name-sec{padding:22px 24px 14px;text-align:center;border-bottom:2px dashed var(--ink-3)}
  .gc-name{font-family:'ZCOOL KuaiLe';font-size:30px;line-height:1.25;color:var(--ink);letter-spacing:1px}
  .gc-tags{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:12px}
  .gc-tag{font-size:11px;padding:3px 9px;border-radius:10px;background:var(--cream);border:1.5px solid var(--ink-3);color:var(--ink-2)}

  /* 详情区 */
  .gc-body{padding:18px 24px}
  .gc-row{display:flex;gap:12px;margin-bottom:14px}
  .gc-row:last-child{margin-bottom:0}
  .gc-ic{
    flex-shrink:0;width:32px;height:32px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-size:16px;
    border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);
  }
  .gc-content{flex:1;min-width:0}
  .gc-label{font-family:'ZCOOL KuaiLe';font-size:14px;color:var(--ink);letter-spacing:1px;margin-bottom:2px}
  .gc-text{font-size:14px;color:var(--ink-2);line-height:1.75}

  /* 祝福区 */
  .gc-bless{
    margin:6px 24px 22px;padding:18px 20px;
    background:linear-gradient(135deg, rgba(255,190,11,.2), rgba(255,93,143,.12));
    border:2px dashed var(--ink);border-radius:16px;
    position:relative;
  }
  .gc-bless::before{
    content:'祝福';position:absolute;top:-12px;left:18px;
    background:var(--ink);color:var(--cream);
    font-family:'ZCOOL KuaiLe';font-size:12px;letter-spacing:2px;
    padding:3px 10px;border-radius:10px;
  }
  .gc-bless-text{font-family:'Long Cang';font-size:22px;color:var(--ink);line-height:1.6;letter-spacing:2px;text-align:center}

  /* 卡底 */
  .gc-foot{
    padding:14px 24px;border-top:2.5px solid var(--ink);
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(42,42,42,.04);
    font-size:11px;color:var(--ink-3);font-family:'Noto Sans SC';letter-spacing:1px;
  }
  .gc-foot .seal{font-family:'ZCOOL KuaiLe';color:var(--pink);font-size:13px}

  /* 操作 */
  .ops{display:flex;justify-content:center;gap:12px;margin-top:24px;flex-wrap:wrap}
  .op-btn{
    padding:12px 20px;border-radius:14px;cursor:pointer;
    font-family:'Noto Sans SC';font-size:13px;font-weight:500;
    background:#fff;border:2px solid var(--ink);color:var(--ink);
    box-shadow:3px 3px 0 var(--ink);
    display:inline-flex;align-items:center;gap:6px;
    transition:all .12s;
  }
  .op-btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .op-btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .op-btn.primary{background:var(--ink);color:var(--cream);box-shadow:3px 3px 0 var(--pink)}
  .op-btn.primary:hover{box-shadow:4px 4px 0 var(--pink)}

  /* 彩纸 */
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
  .confetti span{position:absolute;width:10px;height:14px;top:-20px;animation:fall 2.6s ease-in forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

  /* toast */
  .toast{
    position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--cream);padding:12px 24px;border-radius:24px;
    font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);
    opacity:0;transition:all .3s;z-index:100;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  footer{text-align:center;padding:30px 20px;color:var(--ink-3);font-size:12px;letter-spacing:2px}
  footer .big{font-family:'ZCOOL KuaiLe';font-size:16px;color:var(--ink-2);margin-bottom:4px}

  @media(max-width:560px){
    .wrap{padding:36px 14px 60px}
    .input-card,.gift-card{padding:22px 18px}
    .gc-bless{margin:6px 18px 18px}
    .gc-body{padding:16px 18px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="sticker stk-1">100%抽象</span>
    <span class="sticker stk-2">0运费</span>
    <div class="logo-row">
      <div class="gift-ico">🎁</div>
      <h1>抽象<span>礼物</span></h1>
    </div>
    <div class="sub">把心意做成卡片，礼物不必真的存在</div>
    <div class="desc">AI 脑补 专属定制</div>
  </header>

  <section class="input-card">
    <div class="tape tape-1"></div>
    <div class="tape tape-2"></div>

    <div class="field">
      <div class="field-label"><span class="num">1</span>送给谁？</div>
      <div class="chips" id="whoChips"></div>
    </div>

    <div class="field">
      <div class="field-label"><span class="num">2</span>想表达什么？</div>
      <div class="chips" id="occChips"></div>
    </div>

    <div class="field">
      <div class="field-label"><span class="num">3</span>预算范围？<span class="opt">（可选，影响成本核算）</span></div>
      <div class="chips" id="budChips"></div>
    </div>

    <button class="gen-btn" id="genBtn">🎁 生成抽象礼物</button>
  </section>

  <div class="loading" id="loading">
    <div class="box-shake">📦</div>
    <div class="load-text">正在脑补礼物<span class="load-dots"><span>·</span><span>·</span><span>·</span></span></div>
  </div>

  <section class="result" id="result">
    <div class="gift-card" id="giftCard">
      <div class="gc-top">
        <div class="gc-brand"><span class="dot"></span>抽象礼物 GIFT LAB</div>
        <div class="rarity SSR" id="rarity">SSR</div>
      </div>
      <div class="gc-visual" id="visual">
        <div class="blob" id="blob"></div>
        <div class="cost" id="cost">成本核算：?</div>
        <div class="star" style="top:20px;left:30px;color:var(--yellow)">✦</div>
        <div class="star" style="bottom:30px;right:36px;color:var(--mint);animation-direction:reverse">✦</div>
        <div class="star" style="top:40px;right:60px;color:var(--pink);font-size:14px">✦</div>
        <div class="em" id="em">🎁</div>
      </div>
      <div class="gc-name-sec">
        <div class="gc-name" id="gname">礼物名</div>
        <div class="gc-tags" id="gtags"></div>
      </div>
      <div class="gc-body">
        <div class="gc-row">
          <div class="gc-ic" style="background:var(--yellow)">🎨</div>
          <div class="gc-content">
            <div class="gc-label">外观描述</div>
            <div class="gc-text" id="look"></div>
          </div>
        </div>
        <div class="gc-row">
          <div class="gc-ic" style="background:var(--mint)">💭</div>
          <div class="gc-content">
            <div class="gc-label">抽象寓意</div>
            <div class="gc-text" id="meaning"></div>
          </div>
        </div>
        <div class="gc-row">
          <div class="gc-ic" style="background:var(--blue);color:#fff">🎬</div>
          <div class="gc-content">
            <div class="gc-label">使用场景</div>
            <div class="gc-text" id="scene"></div>
          </div>
        </div>
      </div>
      <div class="gc-bless">
        <div class="gc-bless-text" id="bless"></div>
      </div>
      <div class="gc-foot">
        <span>送自 <strong id="fromWho">神秘朋友</strong></span>
        <span class="seal">抽象认证 · No.<span id="seq">0001</span></span>
      </div>
    </div>

    <div class="ops">
      <button class="op-btn primary" id="saveBtn">⬇ 保存卡片</button>
      <button class="op-btn" id="rewrap">🎨 换个包装</button>
      <button class="op-btn" id="regen">↻ 重新生成</button>
    </div>
  </section>
</div>

<footer>
  <div class="big">礼物是假的，心意是真的</div>
  抽象礼物 · 一份脑补，十分真诚
</footer>

<div class="confetti" id="confetti"></div>
<div class="toast" id="toast"></div>

<script>
/* ============== 数据 ============== */
const WHO=[
  {id:'friend',t:'朋友',em:'👯'},
  {id:'bestie',t:'闺蜜',em:'👯‍♀️'},
  {id:'bro',t:'兄弟',em:'🤜'},
  {id:'lover',t:'对象',em:'❤️'},
  {id:'crush',t:'暗恋的人',em:'🫶'},
  {id:'cowork',t:'同事',em:'💼'},
  {id:'parent',t:'爸妈',em:'👪'},
  {id:'self',t:'自己',em:'🪞'}
];

const OCC=[
  {id:'birthday',t:'生日',em:'🎂'},
  {id:'thanks',t:'谢谢你',em:'🙏'},
  {id:'miss',t:'想你啦',em:'☁️'},
  {id:'cheer',t:'加油打气',em:'⚡'},
  {id:'sorry',t:'对不起',em:'🌹'},
  {id:'troll',t:'纯整活',em:'🤡'},
  {id:'longdistance',t:'异地慰问',em:'✈️'},
  {id:'nothing',t:'没事找事',em:'🎲'},
  {id:'breakup',t:'分手安慰',em:'💔'}
];

const BUD=[
  {id:'0',t:'0元',note:'成本核算：0元（纯抽象，含心意100%）'},
  {id:'5',t:'5元内',note:'成本核算：约3.5元（含人工0元）'},
  {id:'20',t:'20元内',note:'成本核算：12元（材料9，运费3）'},
  {id:'50',t:'50元内',note:'成本核算：38元（已尽力）'},
  {id:'100',t:'100元内',note:'成本核算：88元（豪气版）'},
  {id:'any',t:'不限',note:'成本核算：无价（主要靠脑补）'}
];

/* 礼物库 */
const GIFTS={
  birthday:[

/* ============== 状态 ============== */
const state={ who:null, occ:null, bud:'any', current:null, seq:1 };

/* ============== 工具 ============== */
const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];

function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2000);
}

/* 彩纸 */
function fireConfetti(){
  const box=$('#confetti');
  const colors=['#ff5d8f','#3a86ff','#ffbe0b','#06d6a0','#8338ec','#ff6b35'];
  box.innerHTML='';
  for(let i=0;i<60;i++){
    const s=document.createElement('span');
    s.style.left=Math.random()*100+'%';
    s.style.background=pick(colors);
    s.style.animationDelay=Math.random()*.5+'s';
    s.style.animationDuration=(2+Math.random()*1.5)+'s';
    s.style.transform=`rotate(${Math.random()*360}deg)`;
    if(Math.random()<.3){s.style.borderRadius='50%'}
    box.appendChild(s);
  }
  setTimeout(()=>box.innerHTML='',3200);
}

/* 渲染 chips */
function renderChips(boxId,list,onClick,activeId){
  const box=$('#'+boxId);
  box.innerHTML=list.map(o=>`<span class="chip ${activeId===o.id?'active':''}" data-id="${o.id}"><span class="em">${o.em}</span>${o.t}</span>`).join('');
  box.querySelectorAll('.chip').forEach(el=>{
    el.onclick=()=>onClick(el.dataset.id,el);
  });
}

/* 生成 */
function generate(){
  const occ=state.occ||pick(OCC).id;
  const pool=GIFTS[occ]||GIFTS.nothing;
  let g=pick(pool);
  // 避免重复
  if(state.current && pool.length>1){
    let tries=0;
    while(g.name===state.current?.name && tries<6){ g=pick(pool);tries++; }
  }
  const whoObj=WHO.find(w=>w.id===state.who);
  const whoName=whoObj?whoObj.t:'神秘朋友';
  const budObj=BUD.find(b=>b.id===state.bud)||BUD.find(b=>b.id==='any');
  // 序号
  state.seq++;
  state.current={...g,whoName,occId:occ,budNote:budObj.note,seq:state.seq};
  return state.current;
}

/* 渲染卡片 */
function renderCard(g){
  $('#rarity').textContent=g.rarity;
  $('#rarity').className='rarity '+g.rarity;
  $('#em').textContent=g.em;
  $('#blob').style.background=`radial-gradient(circle at 35% 30%, ${g.color}cc, ${g.color}66 60%, ${g.color}22)`;
  $('#blob').style.boxShadow=`0 0 60px ${g.color}55`;
  $('#cost').textContent=g.budNote;
  $('#gname').textContent=g.name;
  $('#gtags').innerHTML=g.tags.map(t=>`<span class="gc-tag">${t}</span>`).join('');
  $('#look').textContent=g.look;
  $('#meaning').textContent=g.meaning;
  $('#scene').textContent=g.scene;
  $('#bless').textContent=g.bless;
  $('#fromWho').textContent=g.whoName;
  $('#seq').textContent=String(g.seq).padStart(4,'0');
  // 视觉区背景渐变随颜色
  $('#visual').style.background=`linear-gradient(160deg, ${g.color}1a, ${g.color}05 60%, transparent)`;
}

/* 交互 */
function doGenerate(){
  if(!state.who){toast('先选一个"送给谁"吧');return}
  $('#genBtn').disabled=true;
  $('#result').classList.remove('show');
  $('#loading').classList.add('show');
  setTimeout(()=>{
    const g=generate();
    renderCard(g);
    $('#loading').classList.remove('show');
    $('#result').classList.add('show');
    $('#genBtn').disabled=false;
    fireConfetti();
    setTimeout(()=>$('#result').scrollIntoView({behavior:'smooth',block:'center'}),150);
  },1300);
}

function doRegen(){
  const g=generate();
  renderCard(g);
  $('#result').classList.remove('show');
  setTimeout(()=>{$('#result').classList.add('show');fireConfetti();},50);
  toast('换了一份抽象 ✦');
}

function doRewrap(){
  if(!state.current)return;
  const g=state.current;
  // 换颜色/emoji/稀有度的随机扰动
  const colors=['#ff5d8f','#3a86ff','#ffbe0b','#06d6a0','#8338ec','#ff6b35'];
  const newColor=pick(colors);
  // 保留礼物内容，换包装
  const wrapped={...g,color:newColor};
  state.current=wrapped;
  renderCard(wrapped);
  toast('换了层包装 ✦');
}

async function doSave(){
  if(!state.current)return;
  toast('正在生成图片…');
  try{
    const canvas=await html2canvas($('#giftCard'),{scale:2,backgroundColor:null,useCORS:true,logging:false});
    const link=document.createElement('a');
    link.download=`抽象礼物_${state.current.whoName}.png`;
    link.href=canvas.toDataURL('image/png');
    link.click();
    toast('卡片已保存 ✦');
  }catch(e){toast('保存失败，请重试');console.error(e)}
}

/* 初始化 */
renderChips('whoChips',WHO,(id,el)=>{
  state.who=id;
  $('#whoChips').querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
});
renderChips('occChips',OCC,(id,el)=>{
  state.occ=id;
  el.classList.toggle('active');
  // 单选
  if(el.classList.contains('active')){
    el.parentElement.querySelectorAll('.chip').forEach(c=>{if(c!==el)c.classList.remove('active')});
  } else { state.occ=null; }
});
renderChips('budChips',BUD,(id,el)=>{
  state.bud=id;
  el.parentElement.querySelectorAll('.chip').forEach(c=>{if(c!==el)c.classList.remove('active')});
  el.classList.add('active');
},'any');

$('#genBtn').onclick=doGenerate;
$('#regen').onclick=doRegen;
$('#rewrap').onclick=doRewrap;
$('#saveBtn').onclick=doSave;
</script>
