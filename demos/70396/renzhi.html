```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高阶神经认知与代谢模拟器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0e;
            --panel-bg: #16161e;
            --text-main: #e0e0e0;
            --glu-color: #ff3366;
            --dop-color: #00e5ff;
            --pfc-color: #2ed573;
            --amy-color: #ff4757;
            --bg-color: #ffa502;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* ====== 3 区域 Grid 布局 ====== */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            grid-template-rows: 1fr auto auto;
            gap: 10px;
            height: 100vh;
            padding: 10px;
        }

        /* 左侧：3D 认知能量地貌（含悬浮2D图例） */
        .area-3d {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
            background-color: var(--panel-bg);
            border-radius: 12px;
            border: 1px solid #2a2a35;
            position: relative;
            overflow: hidden;
            min-height: 300px;
        }
        .area-3d canvas { width: 100% !important; height: 100% !important; display: block; }
        .area-3d-overlay {
            position: absolute; top: 10px; left: 10px; z-index: 5;
            background: rgba(15,15,20,0.8); backdrop-filter: blur(6px);
            padding: 8px 14px; border-radius: 8px; font-size: 12px;
            border: 1px solid rgba(255,255,255,0.1); pointer-events: none;
        }
        .area-3d-overlay h2 { font-size: 14px; color: #00e5ff; margin: 0 0 4px 0; text-shadow: 0 0 8px rgba(0,229,255,0.4); }
        .area-3d-overlay p { color: #888; font-size: 11px; margin: 0; }
        .area-3d-meters {
            position: absolute; top: 10px; right: 10px; z-index: 5; width: 220px;
            background: rgba(15,15,20,0.85); backdrop-filter: blur(6px);
            padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
        }
        .meter3d { margin-bottom: 8px; }
        .meter3d:last-child { margin-bottom: 0; }
        .meter3d-label { font-size: 11px; display: flex; justify-content: space-between; margin-bottom: 3px; }
        .meter3d-bar-bg { width: 100%; height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
        .meter3d-bar-fill { height: 100%; width: 0%; transition: width 0.3s; }

        /* 悬浮2D代谢模拟器（图例） */
        .area-2d-float {
            position: absolute;
            bottom: 12px;
            left: 12px;
            z-index: 5;
            width: 70%;
            max-width: 750px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .canvas-container {
            background-color: rgba(22,22,30,0.85);
            backdrop-filter: blur(6px);
            border-radius: 10px;
            padding: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }
        #brainCanvas {
            width: 100%;
            height: auto;
            aspect-ratio: 960 / 350;
            display: block;
            background: radial-gradient(circle at center, #1e1e28 0%, #0a0a0e 100%);
            border-radius: 6px;
        }
        #scenarioEmoji {
            position: absolute; bottom: 8px; right: 10px; font-size: 20px;
            line-height: 1; text-shadow: 0 0 10px rgba(0,0,0,0.8);
            pointer-events: none; transition: opacity 0.3s; opacity: 0;
        }

        /* 左下：终端与历史记录的并排布局 */
        .area-bottom-panels {
            grid-column: 1 / 2;
            grid-row: 2 / 3;
            display: flex;
            gap: 10px;
            height: 160px;
        }

        /* 终端日志 */
        .terminal {
            flex: 1;
            background-color: #0a0a0e; border: 1px solid #2a2a35;
            border-radius: 10px; padding: 10px; font-family: 'Courier New', monospace;
            font-size: 12px; color: #2ed573; overflow-y: auto; line-height: 1.5;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.3);
        }
        .log-time { color: #6c6c86; margin-right: 8px; }
        .log-warn { color: #ff4757; font-weight: bold; text-shadow: 0 0 5px rgba(255,71,87,0.3); }
        .log-sys { color: #00e5ff; }

        /* 历史记录面板 */
        .history-panel {
            flex: 1;
            background-color: #0a0a0e; border: 1px solid rgba(0,229,255,0.3);
            border-radius: 10px; padding: 10px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 8px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.3);
        }
        .history-header {
            font-size: 12px; color: #00e5ff; font-weight: bold;
            margin-bottom: 4px; display: flex; justify-content: space-between;
        }
        .history-item {
            background: rgba(255,255,255,0.05); border: 1px solid #333;
            padding: 8px; border-radius: 6px; cursor: pointer; transition: all 0.2s;
        }
        .history-item:hover { border-color: #00e5ff; background: rgba(0,229,255,0.1); }
        .history-item.active { border-color: #2ed573; background: rgba(46,213,115,0.1); }
        .history-item-title { font-size: 12px; color: #e0e0e0; margin-bottom: 6px; font-weight: bold; }
        .history-item-pipeline { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
        .history-item-status { font-size: 11px; color: #ff9900; }
        .history-item-narration { font-size: 11px; color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-style: italic; border-left: 2px solid #00e5ff; padding-left: 6px; margin-top: 4px; }

        /* 右侧参数控制面板 */
        .area-params {
            grid-column: 2 / 3;
            grid-row: 1 / 3;
            background-color: var(--panel-bg);
            border-radius: 12px;
            border: 1px solid #2a2a35;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .area-params h3 {
            font-size: 13px; color: #00e5ff; margin: 0 0 6px 0;
            text-shadow: 0 0 6px rgba(0,229,255,0.3);
            border-bottom: 1px solid #2a2a35; padding-bottom: 4px;
        }
        .param-section { display: flex; flex-direction: column; gap: 6px; }
        .narration-toggle-section {
            padding: 8px 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            border: 1px solid #2a2a35;
        }
        .narration-toggle-label {
            display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; color: #e0e0e0;
        }
        .narration-toggle-label input[type="checkbox"] {
            width: 16px; height: 16px; cursor: pointer; accent-color: #00e5ff;
        }
        .narration-toggle-label span { user-select: none; }
        .reset-section {
            margin-top: auto; padding-top: 12px; border-top: 1px solid #2a2a35;
        }
        .reset-btn {
            width: 100%; background: linear-gradient(135deg, #ff4757 0%, #ff3838 100%);
            color: #fff; border: none; padding: 10px 16px; border-radius: 6px;
            cursor: pointer; font-weight: bold; font-size: 13px;
            box-shadow: 0 2px 8px rgba(255,71,87,0.3); transition: all 0.2s;
        }
        .reset-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255,71,87,0.5); }
        .param-select {
            width: 100%; background: #0b0b10; color: #e0e0e0; border: 1px solid #3d3d52;
            padding: 6px 8px; border-radius: 5px; font-size: 12px; cursor: pointer;
        }
        .param-select:focus { border-color: #00e5ff; outline: none; }
        .param-table { width: 100%; font-size: 11px; border-collapse: collapse; }
        .param-table th { text-align: left; color: #888; font-weight: normal; padding: 3px 4px; border-bottom: 1px solid #2a2a35; }
        .param-table td { padding: 3px 4px; color: #e0e0e0; }
        .param-table td.val { color: #ff9900; font-weight: bold; font-family: monospace; }
        .param-narration {
            font-size: 11px; color: #aaa; line-height: 1.5; background: rgba(0,0,0,0.3);
            padding: 8px; border-radius: 6px; border-left: 3px solid #00e5ff;
        }
        .param-pipeline-vis { display: flex; gap: 4px; flex-wrap: wrap; }
        .pipeline-step {
            padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold;
            background: #222; color: #888; border: 1px solid #333; transition: all 0.3s;
        }
        .pipeline-step.active { background: #00e5ff; color: #000; border-color: #00e5ff; box-shadow: 0 0 8px rgba(0,229,255,0.4); }
        .pipeline-step.done { background: #2ed573; color: #000; border-color: #2ed573; }

        /* 底部 AI 时序解析面板 */
        .area-ai {
            grid-column: 1 / 3;
            grid-row: 3 / 4;
            background-color: var(--panel-bg);
            border-radius: 10px;
            border: 1px solid rgba(46,213,115,0.3);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .area-ai label { font-size: 12px; color: #2ed573; font-weight: bold; white-space: nowrap; }
        #ai-input {
            flex-grow: 1; background: rgba(0,0,0,0.5); border: 1px solid #444;
            color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 12px; outline: none;
        }
        #ai-input:focus { border-color: #2ed573; }
        #ai-btn {
            background: linear-gradient(135deg, #2ed573 0%, #00e5ff 100%);
            color: #000; border: none; padding: 8px 16px; border-radius: 6px;
            cursor: pointer; font-weight: bold; font-size: 12px;
            box-shadow: 0 0 8px rgba(46,213,115,0.4); white-space: nowrap;
        }
        #ai-btn:hover { transform: translateY(-1px); box-shadow: 0 0 12px rgba(0,229,255,0.6); }
        #ai-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        #settings-btn {
            background: #2a2a35; border: 1px solid #444;
            color: #00e5ff; padding: 8px 12px; border-radius: 6px;
            cursor: pointer; font-size: 14px; transition: all 0.2s;
        }
        #settings-btn:hover {
            background: #3a3a45; border-color: #00e5ff;
            box-shadow: 0 0 8px rgba(0,229,255,0.3);
        }

        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; grid-template-rows: 300px auto auto auto; }
            .area-3d { grid-column: 1; grid-row: 1; }
            .area-bottom-panels { grid-column: 1; grid-row: 2; flex-direction: column; height: auto; }
            .terminal, .history-panel { height: 150px; }
            .area-params { grid-column: 1; grid-row: 3; }
            .area-ai { grid-column: 1; grid-row: 4; }
            .area-2d-float { width: 50%; max-width: 300px; }
        }

        /* ====== 设置弹窗样式 ====== */
        .settings-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .settings-overlay.active { display: flex; }
        .settings-modal {
            background: var(--panel-bg); border-radius: 16px;
            border: 1px solid #333; padding: 24px;
            width: 90%; max-width: 480px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: modalIn 0.2s ease-out;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .settings-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 12px;
            border-bottom: 1px solid #2a2a35;
        }
        .settings-header h2 {
            font-size: 18px; color: #00e5ff;
            text-shadow: 0 0 8px rgba(0,229,255,0.3);
        }
        .settings-close {
            background: none; border: none; color: #888;
            font-size: 24px; cursor: pointer; padding: 0 8px;
            transition: color 0.2s;
        }
        .settings-close:hover { color: #fff; }
        .settings-section { margin-bottom: 20px; }
        .settings-section label {
            display: block; font-size: 12px; color: #aaa;
            margin-bottom: 6px; font-weight: bold;
        }
        .settings-select {
            width: 100%; background: #0b0b10; color: #e0e0e0;
            border: 1px solid #3d3d52; padding: 10px 12px;
            border-radius: 8px; font-size: 14px; cursor: pointer;
        }
        .settings-select:focus { border-color: #00e5ff; outline: none; }
        .settings-input {
            width: 100%; background: #0b0b10; color: #e0e0e0;
            border: 1px solid #3d3d52; padding: 10px 12px;
            border-radius: 8px; font-size: 14px;
            font-family: 'Courier New', monospace;
        }
        .settings-input:focus { border-color: #00e5ff; outline: none; }
        .api-provider-info {
            font-size: 11px; color: #666; margin-top: 6px;
            padding: 8px; background: rgba(0,0,0,0.3);
            border-radius: 6px; border-left: 3px solid #2ed573;
        }
        .settings-actions {
            display: flex; gap: 10px; margin-top: 24px;
            padding-top: 16px; border-top: 1px solid #2a2a35;
        }
        .settings-btn {
            flex: 1; padding: 10px 16px; border-radius: 8px;
            font-size: 14px; font-weight: bold; cursor: pointer;
            transition: all 0.2s; border: none;
        }
        .settings-btn-cancel {
            background: #2a2a35; color: #aaa;
        }
        .settings-btn-cancel:hover { background: #3a3a45; }
        .settings-btn-save {
            background: linear-gradient(135deg, #00e5ff 0%, #2ed573 100%);
            color: #000;
            box-shadow: 0 0 10px rgba(0,229,255,0.3);
        }
        .settings-btn-save:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 15px rgba(0,229,255,0.5);
        }
        .api-key-hint {
            font-size: 11px; color: #ff9900; margin-top: 4px;
        }
        .api-status {
            display: flex; align-items: center; gap: 6px;
            font-size: 11px; margin-top: 8px;
        }
        .api-status.ok { color: #2ed573; }
        .api-status.error { color: #ff4757; }
        .api-status.pending { color: #ff9900; }
        .api-status span {
            width: 8px; height: 8px; border-radius: 50%;
            display: inline-block;
        }
        .api-status.ok span { background: #2ed573; box-shadow: 0 0 6px #2ed573; }
        .api-status.error span { background: #ff4757; }
        .api-status.pending span { background: #ff9900; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<div class="main-grid">
    <div class="area-3d" id="area3d">
        <div id="three-container"></div>
        <div class="area-3d-overlay">
            <h2>3D 认知能量地貌</h2>
            <p>🖱️ 左键拖动旋转 | 滚轮缩放</p>
        </div>
        <div class="area-3d-meters">
            <div class="meter3d">
                <div class="meter3d-label"><span>系统自由能</span><span id="eng-val">0%</span></div>
                <div class="meter3d-bar-bg"><div id="eng-bar" class="meter3d-bar-fill" style="background:#ff9900;"></div></div>
            </div>
            <div class="meter3d">
                <div class="meter3d-label"><span>谷氨酸</span><span id="glu-val">0%</span></div>
                <div class="meter3d-bar-bg"><div id="glu-bar" class="meter3d-bar-fill" style="background:#ff4757;"></div></div>
            </div>
            <div class="meter3d">
                <div class="meter3d-label"><span>毒性</span><span id="tox-val">0%</span></div>
                <div class="meter3d-bar-bg"><div id="tox-bar" class="meter3d-bar-fill" style="background:#ff0000;"></div></div>
            </div>
            <div class="meter3d">
                <div class="meter3d-label"><span>多巴胺 (RPE)</span><span id="dop-val-3d">0%</span></div>
                <div class="meter3d-bar-bg"><div id="dop-bar-3d" class="meter3d-bar-fill" style="background:#00e5ff;"></div></div>
            </div>
        </div>

        <div class="area-2d-float">
            <div class="canvas-container">
                <canvas id="brainCanvas" width="960" height="350"></canvas>
                <div id="scenarioEmoji"></div>
            </div>
        </div>
    </div>

    <!-- 左下：终端与历史记录 -->
    <div class="area-bottom-panels">
        <div class="terminal" id="terminal">
            <div><span class="log-sys">系统就绪：等待输入或选择认知场景...</span></div>
        </div>
        <div class="history-panel" id="historyPanel">
            <div class="history-header">
                <span>🕰️ 用户交互认知历史</span>
                <span style="color:#aaa; font-weight:normal; font-size:10px;">点击记录重播演示</span>
            </div>
            <div id="historyList">
                <div style="color:#555; font-size:11px; text-align:center; margin-top:10px;">暂无历史数据。在下方输入软描述开始解析。</div>
            </div>
        </div>
    </div>

    <div class="area-params">
        <div class="param-section">
            <h3>🧬 认知基元预览</h3>
            <select id="primitiveSelect" class="param-select"></select>
        </div>
        <div class="param-section">
            <h3>🔗 内置管线预览</h3>
            <select id="pipelineSelect" class="param-select"></select>
            <button id="playPipelineBtn" class="reset-btn" style="background: linear-gradient(135deg, #2ed573 0%, #00e5ff 100%); margin-top: 4px;">
                ▶ 播放内置序列
            </button>
            <div class="param-pipeline-vis" id="pipelineVis">
                <div class="pipeline-step" style="color:#666;">选择序列查看流程</div>
            </div>
        </div>
        
        <div class="narration-toggle-section">
            <label class="narration-toggle-label">
                <input type="checkbox" id="narrationToggle" checked onchange="toggleNarration(this.checked)">
                <span>🔊 启用语音旁白</span>
            </label>
            <button id="testSpeechBtn" style="margin-top: 8px; margin-bottom: 8px; width: 100%; padding: 6px; background: #00e5ff; color: #000; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                🔊 授权语音（首次使用点击）
            </button>
            
            <div style="padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1);">
                <div style="display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-bottom: 5px;">
                    <span>演示速度: <span id="speedValueDisplay" style="color:#fff; font-weight:bold;">1.00x</span></span>
                    <span id="speedMinDisplay" style="color: #2ed573;">(同步旁白: 1.00x)</span>
                </div>
                <input type="range" id="speedSlider" min="0.1" max="2.0" step="0.05" value="1.0" style="width: 100%; accent-color: #2ed573;">
            </div>
            
            <label class="narration-toggle-label" style="margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1);">
                <input type="checkbox" id="loopToggle">
                <span>🔁 开启循环演示</span>
            </label>
        </div>

        <div class="reset-section">
            <button class="reset-btn" onclick="resetSystem()">🔄 重置系统</button>
        </div>
    </div>

    <div class="area-ai">
        <label>✨ AI 认知解析</label>
        <input type="text" id="ai-input" placeholder="输入情境软描述，例如：遇到困难着急哭泣，询问AI，掌握方法搭建树屋" onkeypress="handleAiEnter(event)" />
        <button id="ai-btn" onclick="analyzeState()">🧠 开始 4步 AI 解析转化</button>
        <button id="settings-btn" onclick="openSettings()" title="设置LLM API">⚙️</button>
    </div>
</div>

<div class="settings-overlay" id="settingsOverlay">
    <div class="settings-modal">
        <div class="settings-header">
            <h2>⚙️ LLM API 设置</h2>
            <button class="settings-close" onclick="closeSettings()">&times;</button>
        </div>
        
        <div class="settings-section">
            <label for="apiProvider">API 提供商</label>
            <select id="apiProvider" class="settings-select" onchange="onProviderChange()">
                <option value="gemini">Google Gemini</option>
                <option value="deepseek">DeepSeek</option>
                <option value="openai">OpenAI</option>
                <option value="azure">Azure OpenAI</option>
                <option value="ollama">Ollama (本地)</option>
            </select>
            <div id="apiProviderInfo" class="api-provider-info">选择一个LLM API提供商</div>
        </div>

        <div class="settings-section">
            <label for="apiKey">API Key</label>
            <input type="password" id="apiKey" class="settings-input" placeholder="请输入您的API密钥" />
            <div class="api-key-hint">密钥仅存储在本地浏览器中，不会上传到服务器</div>
            <div id="apiStatus" class="api-status" style="display: none;">
                <span></span>
                <span id="apiStatusText">检查中...</span>
            </div>
        </div>

        <div class="settings-section" id="apiEndpointSection" style="display: none;">
            <label for="apiEndpoint">API 端点 (可选)</label>
            <input type="text" id="apiEndpoint" class="settings-input" placeholder="自定义API端点地址" />
        </div>

        <div class="settings-section" id="apiModelSection" style="display: none;">
            <label for="apiModel">模型名称</label>
            <select id="apiModel" class="settings-select">
            </select>
        </div>

        <div class="settings-actions">
            <button class="settings-btn settings-btn-cancel" onclick="closeSettings()">取消</button>
            <button class="settings-btn settings-btn-save" onclick="saveSettings()">保存设置</button>
        </div>
    </div>
</div>

    } catch (e) {

    }
}

function saveSettingsToStorage() {
    try {
        localStorage.setItem('llmConfig', JSON.stringify(llmConfig));
    } catch (e) {
        console.warn('Failed to save settings to localStorage:', e);
    }
}

function openSettings() {
    document.getElementById('settingsOverlay').classList.add('active');
    document.getElementById('apiProvider').value = llmConfig.provider;
    document.getElementById('apiKey').value = llmConfig.apiKey;
    document.getElementById('apiEndpoint').value = llmConfig.endpoint;
    onProviderChange();
}

function closeSettings() {
    document.getElementById('settingsOverlay').classList.remove('active');
}

function onProviderChange() {
    const provider = document.getElementById('apiProvider').value;
    const config = API_PROVIDERS[provider];
    if (!config) return;

    document.getElementById('apiProviderInfo').textContent = config.info;
    
    const keySection = document.querySelector('.settings-section:has(#apiKey)');
    keySection.style.display = config.requiresKey ? 'block' : 'none';
    
    const endpointSection = document.getElementById('apiEndpointSection');
    endpointSection.style.display = config.requiresEndpoint ? 'block' : 'none';
    if (!config.requiresEndpoint && config.endpoint) {
        document.getElementById('apiEndpoint').value = config.endpoint;
    }
    
    const modelSection = document.getElementById('apiModelSection');
    modelSection.style.display = config.requiresModel ? 'block' : 'none';
    
    const modelSelect = document.getElementById('apiModel');
    modelSelect.innerHTML = '';
    if (config.models) {
        config.models.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.value;
            opt.textContent = m.label;
            modelSelect.appendChild(opt);
        });
        const currentModel = llmConfig.model;
        if (config.models.some(m => m.value === currentModel)) {
            modelSelect.value = currentModel;
        } else {
            modelSelect.value = config.models[0].value;
        }
    }
}

function saveSettings() {
    const provider = document.getElementById('apiProvider').value;
    const config = API_PROVIDERS[provider];
    
    llmConfig.provider = provider;
    llmConfig.apiKey = config.requiresKey ? document.getElementById('apiKey').value : '';

    log(`✅ LLM API 设置已保存: ${config.name}`, "sys");
    closeSettings();
}

// 历史数据库设计
let dbHistory = [];

function createHistoryRecord(userInput) {
    const record = {
        id: 'hist_' + Date.now(),
        time: new Date().toLocaleTimeString('zh-CN', {hour12: false}),
        userInput: userInput,
        pipeline: null,
        hardDescription: '',
        narrations: null,
        status: '解析中...'
    };
    dbHistory.unshift(record);
    renderHistoryUI();
    return record;
}

function updateHistoryRecord(id, updates) {
    const record = dbHistory.find(r => r.id === id);
    if (record) {
        Object.assign(record, updates);
        renderHistoryUI();
    }
}

function renderHistoryUI() {
    const list = document.getElementById('historyList');
    list.innerHTML = '';
    if (dbHistory.length === 0) {
        list.innerHTML = '<div style="color:#555; font-size:11px; text-align:center; margin-top:10px;">暂无历史数据。在下方输入软描述开始解析。</div>';
        return;
    }

    dbHistory.forEach(record => {
        const item = document.createElement('div');
        item.className = 'history-item';
        // 只有完成状态才可以点击重放
        if (record.status === '✅ 准备就绪' && record.pipeline) {
            item.onclick = () => {
                document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
                item.classList.add('active');
                playHistoryRecord(record.id);
            };
        } else {
            item.style.cursor = 'default';
        }

        let pipelineHtml = '';
        if (record.pipeline) {
            pipelineHtml = `<div class="history-item-pipeline">` + 
                record.pipeline.map(p => `<span class="pipeline-step">${p.primitiveId || p.primitive}</span>`).join('<span style="color:#444;">➔</span>') + 
                `</div>`;
        }

        let narrationSnippet = '';
        if (record.narrations && record.narrations.length > 0) {
            narrationSnippet = `<div class="history-item-narration">${record.narrations[0].narration}</div>`;
        }

        let statusColor = record.status.includes('失败') ? '#ff4757' : (record.status.includes('就绪') ? '#2ed573' : '#ff9900');

        item.innerHTML = `
            <div class="history-item-title">${record.time} - "${record.userInput}"</div>
            ${pipelineHtml}
            <div class="history-item-status" style="color: ${statusColor}">${record.status}</div>
            ${narrationSnippet}
        `;
        list.appendChild(item);
    });
}

function playHistoryRecord(id) {
    const record = dbHistory.find(r => r.id === id);
    if (!record || !record.pipeline) return;
    
    log(`▶️ 正在重播历史交互认知...`, "sys");
    
    // 直接执行保存好的管线，并跳过生成旁白的步骤，因为已经融合保存在 record.pipeline 里了
    executePipeline({
        name: `历史记录 ${record.time}`,
        primitives: record.pipeline
    }, true, false);
}

const speechEngine = {
    synth: window.speechSynthesis, enabled: true, voice: null, queue: [], isPlaying: false, unlocked: false,
    init() {
        const loadVoices = () => {
            const voices = this.synth.getVoices();
            this.voice = voices.find(v => v.lang.includes('zh') && v.name.includes('Female'))
                || voices.find(v => v.lang.includes('zh')) || voices[0];
        };
        loadVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }
        
        const unlock = () => {
            if (this.unlocked) return;
            const u = new SpeechSynthesisUtterance('');
            u.volume = 0;
            this.synth.speak(u);
            this.unlocked = true;
        };
        document.addEventListener('click', unlock, { once: false });
        document.addEventListener('keydown', unlock, { once: false });
    },
    _resume() {
        if (this.synth) this.synth.resume();
    },
    speak(text) { 
        if (!this.enabled || !this.synth || !text) return;
        this._resume();
        this.queue.push(text); 
        if (!this.isPlaying) this.playNext(); 
    },
    playNext() {
        if (this.queue.length === 0) { this.isPlaying = false; return; }
        this._resume();
        this.isPlaying = true;
        const text = this.queue.shift();
        const u = new SpeechSynthesisUtterance(text);
        if (this.voice) u.voice = this.voice;
        u.lang = 'zh-CN'; u.rate = 1.0; u.pitch = 1.0; u.volume = 0.8;
        u.onend = () => this.playNext();
        u.onerror = (e) => { console.warn('TTS error:', e); this.playNext(); };
        this.synth.speak(u);
    },
    clearQueue() { 
        this.queue = []; 
        this.isPlaying = false; 
        if(this.synth) this.synth.cancel();
    },
    setEnabled(enabled) {
        this.enabled = enabled;
        if (!enabled) this.clearQueue();
    }
};
speechEngine.init();

function toggleNarration(enabled) {
    speechEngine.setEnabled(enabled);
    log(enabled ? "🔊 语音旁白已启用" : "🔇 语音旁白已禁用", "sys");
}

function estimateSpeechTime(text) {
    if (!text) return 0;
    return (text.length * 250) + 800; 
}

function calculateAndApplyMinSpeed(stages) {
    let totalBaseDuration = 0;
    let totalSpeechTime = 0;

    stages.forEach(stage => {
        const prim = PRIMITIVES[stage.primitiveId || stage.primitive];
        if (prim) {
            totalBaseDuration += (stage.durationMs || prim.durationMs);
            const narration = stage.narration || prim.narration || "";
            totalSpeechTime += estimateSpeechTime(narration);
        }
    });

    let minSpeed = 1.0;
    if (totalSpeechTime > 0) {
        minSpeed = totalBaseDuration / totalSpeechTime;
    }
    
    minSpeed = Math.max(0.1, Math.min(1.0, minSpeed));
    
    const slider = document.getElementById('speedSlider');
    slider.min = minSpeed.toFixed(2);
    slider.value = minSpeed.toFixed(2); 
    
    document.getElementById('speedMinDisplay').innerText = `(同步旁白: ${minSpeed.toFixed(2)}x)`;
    document.getElementById('speedValueDisplay').innerText = `${minSpeed.toFixed(2)}x`;
    
    log(`⏱️ 速度条已自适应调整至: ${minSpeed.toFixed(2)}x`, "sys");
}

const engine = { glu: 0, dop: 0, targetGlu: 0, targetDop: 0, scenario: null, step: 0, timer: null, crashed: false };
const nodes = {};
for (const key in METABOLIC_NODES) nodes[key] = { x: METABOLIC_NODES[key].x, y: METABOLIC_NODES[key].y, label: METABOLIC_NODES[key].label, color: METABOLIC_NODES[key].color, active: false };

function resizeCanvas() {
    const canvas = document.getElementById('brainCanvas');
    const rect = canvas.getBoundingClientRect();
    if (rect.width < 10 || rect.height < 10) return;
    const dpr = window.devicePixelRatio || 1;
    const w = Math.round(rect.width * dpr);
    const h = Math.round(rect.height * dpr);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    const scaleX = w / 960;
    const scaleY = h / 350;
    for (const key in METABOLIC_NODES) {
        const n = METABOLIC_NODES[key];
        nodes[key] = { x: n.x * scaleX, y: n.y * scaleY, label: n.label, color: n.color, active: nodes[key].active };
    }
}

let particles = [];
class Particle {
    constructor(fromK, toK, color) {
        this.fromKey = fromK; this.toKey = toK;
        this.x = nodes[fromK].x; this.y = nodes[fromK].y;
        this.color = color; this.progress = 0;
        this.speed = 0.015 + Math.random() * 0.015;
        this.history = [];
        const dx = nodes[toK].x - nodes[fromK].x;
        const dy = nodes[toK].y - nodes[fromK].y;
        const curveDirection = (fromK.length > toK.length) ? 1 : -1;
        const offset = 0.2 * curveDirection;
        this.cp1x = nodes[fromK].x + dx * 0.3 - dy * offset;
        this.cp1y = nodes[fromK].y + dy * 0.3 + dx * offset;
        this.cp2x = nodes[fromK].x + dx * 0.7 - dy * offset;
        this.cp2y = nodes[fromK].y + dy * 0.7 + dx * offset;
    }
    update() {
        this.history.push({x: this.x, y: this.y});
        if (this.history.length > 12) this.history.shift();
        const currentSpeedMultiplier = parseFloat(document.getElementById('speedSlider').value) || 1.0;
        this.progress += (this.speed * currentSpeedMultiplier);
        if (this.progress > 1) return true;
        const t = this.progress, mt = 1 - t;
        const p0 = nodes[this.fromKey], p3 = nodes[this.toKey];
        this.x = mt*mt*mt*p0.x + 3*mt*mt*t*this.cp1x + 3*mt*t*t*this.cp2x + t*t*t*p3.x;
        this.y = mt*mt*mt*p0.y + 3*mt*mt*t*this.cp1y + 3*mt*t*t*this.cp2y + t*t*t*p3.y;
        return false;
    }
    draw(ctx) {
        if (this.history.length > 1) {
            ctx.beginPath(); ctx.moveTo(this.history[0].x, this.history[0].y);
            for (let i = 1; i < this.history.length; i++) ctx.lineTo(this.history[i].x, this.history[i].y);
            ctx.lineTo(this.x, this.y);
            ctx.strokeStyle = this.color; ctx.lineWidth = 3.5; ctx.lineCap = "round";
            ctx.globalAlpha = 0.3; ctx.stroke(); ctx.globalAlpha = 1.0;
        }
        ctx.beginPath(); ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = "#fff"; ctx.shadowBlur = 8; ctx.shadowColor = this.color; ctx.fill();
        ctx.beginPath(); ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
        ctx.fillStyle = this.color; ctx.globalAlpha = 0.6; ctx.fill();
        ctx.shadowBlur = 0; ctx.globalAlpha = 1.0;
    }
}

function drawCurvePath(ctx, n1, n2) {
    const dx = n2.x - n1.x, dy = n2.y - n1.y;
    const curveDirection = (n1.label.length > n2.label.length) ? 1 : -1;
    const offset = 0.2 * curveDirection;
    ctx.beginPath(); ctx.moveTo(n1.x, n1.y);
    ctx.bezierCurveTo(n1.x+dx*0.3-dy*offset, n1.y+dy*0.3+dx*offset, n1.x+dx*0.7-dy*offset, n1.y+dy*0.7+dx*offset, n2.x, n2.y);
    ctx.stroke();
}

function drawNetwork() {
    resizeCanvas();
    const canvas = document.getElementById('brainCanvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const displayScale = canvas.width / 960 / dpr;
    let shakeX = 0, shakeY = 0;
    if (engine.glu > 85 || engine.crashed) {
        const intensity = engine.crashed ? 6 : (engine.glu - 80) / 2;
        shakeX = (Math.random() - 0.5) * intensity * displayScale;
        shakeY = (Math.random() - 0.5) * intensity * displayScale;
    }
    ctx.save();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.translate(shakeX, shakeY);
    ctx.lineWidth = 2.5 * displayScale; ctx.strokeStyle = "rgba(100,100,150,0.15)";
    
    drawCurvePath(ctx, nodes.INPUT, nodes.PFC);
    drawCurvePath(ctx, nodes.INPUT, nodes.AMY);
    drawCurvePath(ctx, nodes.PFC, nodes.EXEC);
    drawCurvePath(ctx, nodes.PFC, nodes.AMY);
    drawCurvePath(ctx, nodes.AMY, nodes.PFC);
    drawCurvePath(ctx, nodes.AMY, nodes.BG);
    drawCurvePath(ctx, nodes.BG, nodes.EXEC);
    drawCurvePath(ctx, nodes.EXEC, nodes.VTA);
    drawCurvePath(ctx, nodes.INPUT, nodes.BG);

    particles = particles.filter(p => { const done = p.update(); p.draw(ctx); return !done; });

    const now = Date.now();
    const iconScale = Math.max(displayScale, 1.2);
    for (let key in nodes) {
        const n = nodes[key];
        let radius = 16 * iconScale, drawColor = n.color, sBlur = 0;
        if (n.active) { const pulse = Math.sin(now / 150) * 2 * iconScale; radius = 17 * iconScale + pulse; sBlur = (14 + pulse * 2) * iconScale; }
        if (engine.crashed && key === 'PFC') { drawColor = '#444'; radius = 16 * iconScale; sBlur = 0; }
        else if (engine.glu > 85 && key === 'PFC' && n.active) { drawColor = '#ff0000'; sBlur = 22 * iconScale; }
        ctx.beginPath(); ctx.arc(n.x, n.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = n.active ? drawColor : "#1a1a24";
        ctx.strokeStyle = drawColor; ctx.lineWidth = 2.5 * iconScale;
        if (n.active) { ctx.shadowBlur = sBlur; ctx.shadowColor = drawColor; }
        ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
        ctx.fillStyle = "#ffffff"; ctx.font = `bold ${Math.round(13 * iconScale)}px 'Segoe UI'`; ctx.textAlign = "center";
        ctx.fillText(n.label, n.x, n.y - 26 * iconScale);
    }
    ctx.restore();

    engine.glu += (engine.targetGlu - engine.glu) * 0.1;
    engine.dop += (engine.targetDop - engine.dop) * 0.1;
    sharedState.targetGlu = engine.targetGlu;
    sharedState.targetDop = engine.targetDop;
    sharedState.glu = engine.glu;
    sharedState.dop = engine.dop;

    document.getElementById('glu-val').innerText = Math.round(engine.glu) + '%';
    document.getElementById('glu-bar').style.width = engine.glu + '%';
    document.getElementById('tox-val').innerText = Math.round(sharedState.targetToxicity * 100) + '%';
    document.getElementById('tox-bar').style.width = (sharedState.targetToxicity * 100) + '%';
    document.getElementById('dop-val-3d').innerText = Math.round(engine.dop) + '%';
    document.getElementById('dop-bar-3d').style.width = engine.dop + '%';

    requestAnimationFrame(drawNetwork);
}

function spawn(fromK, toK, color, count=1) {
    for (let i = 0; i < count; i++) setTimeout(() => particles.push(new Particle(fromK, toK, color)), i * 90);
}
function setNodes(activeKeys) { for (let key in nodes) nodes[key].active = activeKeys.includes(key); }
function log(msg, type="normal") {
    const term = document.getElementById('terminal');
    const time = new Date().toLocaleTimeString('zh-CN', {hour12: false});
    let cls = type === 'warn' ? 'log-warn' : (type === 'sys' ? 'log-sys' : '');
    term.innerHTML += `<div><span class="log-time">[${time}]</span> <span class="${cls}">${msg}</span></div>`;
    term.scrollTop = term.scrollHeight;
}

function resetSystem(clearSpeech = true) {
    if (loopTimer) { clearTimeout(loopTimer); loopTimer = null; }
    clearInterval(engine.timer);
    
    engine.glu = 0; engine.dop = 0; engine.targetGlu = 0; engine.targetDop = 0;
    engine.crashed = false; engine.step = 0; engine.scenario = null;
    sharedState.glu = 0; sharedState.dop = 0; sharedState.targetGlu = 0; sharedState.targetDop = 0;
    sharedState.toxicity = 0; sharedState.targetToxicity = 0; sharedState.energy = 0;
    
    resetEngine3D();
    setNodes([]); particles = [];
    
    if (clearSpeech) { speechEngine.clearQueue(); speechEngine.loopKeys = {}; }
    updatePipelineProgress(-1);
    
    log("系统已重置，等待指示。", "sys");
}

let scene, camera, renderer3d, landscape, ball, uniforms3d;
let physics3d = { x: 0, z: 0, vx: 0, vz: 0, friction: 0.92, gravity: 0.03, active: true };
let state3d = { time: 0, toxicity: 0, targetToxicity: 0, energy: 0, attractors: [], barriers: [], noise: 0.02 };
let targetState3d = { friction: 0.92, noise: 0.02, attractors: [], barriers: [] };
let carvingInterval3d = null;
let currentPipelineTimer = null;
const size3d = 30;

function init3D() {
    const container = document.getElementById('three-container');
    const area3d = document.getElementById('area3d');
    const w = area3d.clientWidth; const h = area3d.clientHeight;

    scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x050505, 0.02);
    camera = new THREE.PerspectiveCamera(60, w / h, 0.1, 1000);
    camera.position.set(0, 15, 20); camera.lookAt(0, 0, 0);

    renderer3d = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer3d.setSize(w, h); renderer3d.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer3d.domElement);

    const ambientLight = new THREE.AmbientLight(0x222233); scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0x00e5ff, 1.5, 50); pointLight.position.set(0, 15, 0); scene.add(pointLight);
    const redLight = new THREE.PointLight(0xff4757, 0, 50); redLight.position.set(0, 5, 0); scene.add(redLight);

    const segments = 60; const geometry = new THREE.PlaneGeometry(size3d, size3d, segments, segments); geometry.rotateX(-Math.PI / 2);
    const baseVertices = []; const positionAttr = geometry.attributes.position;
    for (let i = 0; i < positionAttr.count; i++) baseVertices.push(new THREE.Vector3().fromBufferAttribute(positionAttr, i));

    const vertexShader = `varying vec3 vWorldPosition; void main() { vec4 worldPosition = modelMatrix * vec4(position, 1.0); vWorldPosition = worldPosition.xyz; gl_Position = projectionMatrix * viewMatrix * worldPosition; }`;
    const fragmentShader = `uniform float toxicity; varying vec3 vWorldPosition; void main() { float height = vWorldPosition.y; vec3 lowColor = vec3(0.0, 0.1, 0.3); vec3 highColor = vec3(0.0, 0.8, 1.0); float t = clamp((height + 5.0) / 10.0, 0.0, 1.0); vec3 finalColor = mix(lowColor, highColor, t); float grid = abs(fract(vWorldPosition.x * 2.0) - 0.5) + abs(fract(vWorldPosition.z * 2.0) - 0.5); grid = smoothstep(0.4, 0.5, grid); finalColor += vec3(grid * 0.1); vec3 toxicColor = vec3(1.0, 0.1, 0.1); finalColor = mix(finalColor, toxicColor, toxicity * 0.8); gl_FragColor = vec4(finalColor, 0.8); }`;

    uniforms3d = { toxicity: { value: 0.0 } };
    const material = new THREE.ShaderMaterial({ uniforms: uniforms3d, vertexShader, fragmentShader, wireframe: true, transparent: true });
    landscape = new THREE.Mesh(geometry, material); landscape.userData.baseVertices = baseVertices; scene.add(landscape);

    const ballGeo = new THREE.SphereGeometry(0.5, 32, 32);
    const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.8, roughness: 0.2, metalness: 0.8 });
    ball = new THREE.Mesh(ballGeo, ballMat); scene.add(ball);

    let isDragging = false, mouseX = 0, mouseY = 0, prevMouseX = 0, prevMouseY = 0;
    renderer3d.domElement.addEventListener('mousedown', (e) => { isDragging = true; prevMouseX = e.clientX; prevMouseY = e.clientY; });
    renderer3d.domElement.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
    renderer3d.domElement.addEventListener('mouseup', () => isDragging = false);
    renderer3d.domElement.addEventListener('wheel', (e) => { camera.position.z += e.deltaY * 0.01; camera.position.z = Math.max(5, Math.min(40, camera.position.z)); });
    renderer3d.domElement.addEventListener('mouseleave', () => isDragging = false);

    const clock = new THREE.Clock();

    function animate3D() {
        requestAnimationFrame(animate3D);
        let dt = clock.getDelta();
        const currentSpeedMultiplier = parseFloat(document.getElementById('speedSlider').value) || 1.0;
        state3d.time += dt * currentSpeedMultiplier;

        const LERP_SPEED = 0.035 * currentSpeedMultiplier;

        state3d.toxicity += (sharedState.targetToxicity - state3d.toxicity) * LERP_SPEED;
        state3d.targetToxicity = sharedState.targetToxicity;
        uniforms3d.toxicity.value = state3d.toxicity;
        redLight.intensity = state3d.toxicity * 2.0;
        pointLight.intensity = 1.5 - state3d.toxicity;

        physics3d.friction += (targetState3d.friction - physics3d.friction) * LERP_SPEED;
        state3d.noise = state3d.noise || 0;
        state3d.noise += (targetState3d.noise - state3d.noise) * LERP_SPEED;

        lerpArray(state3d.attractors, targetState3d.attractors, LERP_SPEED, 'depth');
        lerpArray(state3d.barriers, targetState3d.barriers, LERP_SPEED, 'height');

        const pos = landscape.geometry.attributes.position;
        const bv = landscape.userData.baseVertices;
        for (let i = 0; i < pos.count; i++) pos.setY(i, getZ3D(bv[i].x, bv[i].z, state3d.time));
        pos.needsUpdate = true;
        landscape.geometry.computeVertexNormals();

        if (physics3d.active) {
            let delta = 0.1;
            let h_center = getZ3D(physics3d.x, physics3d.z, state3d.time);
            let h_dx = getZ3D(physics3d.x + delta, physics3d.z, state3d.time);
            let h_dz = getZ3D(physics3d.x, physics3d.z + delta, state3d.time);
            physics3d.vx -= ((h_dx - h_center) / delta) * physics3d.gravity;
            physics3d.vz -= ((h_dz - h_center) / delta) * physics3d.gravity;
            physics3d.vx *= physics3d.friction;
            physics3d.vz *= physics3d.friction;
            if (state3d.toxicity > 0) {
                physics3d.vx += (Math.random() - 0.5) * state3d.toxicity * 0.2;
                physics3d.vz += (Math.random() - 0.5) * state3d.toxicity * 0.2;
            }
            physics3d.x += (physics3d.vx * currentSpeedMultiplier); 
            physics3d.z += (physics3d.vz * currentSpeedMultiplier);
            let limit = size3d / 2 - 1;
            physics3d.x = Math.max(-limit, Math.min(limit, physics3d.x));
            physics3d.z = Math.max(-limit, Math.min(limit, physics3d.z));
            let currentY = getZ3D(physics3d.x, physics3d.z, state3d.time);
            ball.position.set(physics3d.x, currentY + 0.5, physics3d.z);
            state3d.energy = (Math.abs(physics3d.vx) + Math.abs(physics3d.vz)) * 50 + (currentY + 5) * 5;
            sharedState.energy = state3d.energy;
        }

        document.getElementById('eng-bar').style.width = Math.min(100, Math.max(0, state3d.energy)) + '%';
        document.getElementById('eng-val').innerText = Math.round(state3d.energy) + '%';

        if (isDragging) {
            scene.rotation.y += (mouseX - prevMouseX) * 0.01;
            scene.rotation.x += (mouseY - prevMouseY) * 0.01;
            prevMouseX = mouseX; prevMouseY = mouseY;
        }

        renderer3d.render(scene, camera);
    }

    const resizeObserver = new ResizeObserver(() => {
        const w2 = area3d.clientWidth; const h2 = area3d.clientHeight;
        camera.aspect = w2 / h2; camera.updateProjectionMatrix(); renderer3d.setSize(w2, h2);
    });
    resizeObserver.observe(area3d);

    resetEngine3D();
    animate3D();
    drawNetwork();
}

function getZ3D(x, z, t) {
    let zHeight = Math.sin(x * 0.5 + t) * 0.5 + Math.cos(z * 0.5 - t * 0.8) * 0.5;
    for (let a of state3d.attractors) zHeight -= a.depth * Math.exp(-((x - a.x) ** 2 + (z - a.z) ** 2) / (a.radius ** 2));
    for (let b of state3d.barriers) zHeight += b.height * Math.exp(-((Math.sqrt((x - b.x) ** 2 + (z - b.z) ** 2) - b.radius) ** 2) / (b.thickness ** 2));
    let currentNoise = Math.max(state3d.toxicity, state3d.noise || 0);
    if (currentNoise > 0) zHeight += (Math.random() - 0.5) * currentNoise * 4.0;
    let edgeDist = Math.max(Math.abs(x), Math.abs(z));
    if (edgeDist > size3d / 2 - 2) zHeight += (edgeDist - (size3d / 2 - 2)) * 2;
    return zHeight;
}

function lerpArray(current, target, speed, fadeProp) {
    while(current.length < target.length) {
        let t = target[current.length]; let newObj = { ...t }; newObj[fadeProp] = 0; current.push(newObj);
    }
    for(let i = 0; i < current.length; i++) {
        let c = current[i];
        if (i < target.length) {
            let t = target[i];
            if(c.x !== undefined) c.x += (t.x - c.x) * speed;
            if(c.z !== undefined) c.z += (t.z - c.z) * speed;
            if(c.radius !== undefined) c.radius += (t.radius - c.radius) * speed;
            if(c.thickness !== undefined) c.thickness += (t.thickness - c.thickness) * speed;
            c[fadeProp] += (t[fadeProp] - c[fadeProp]) * speed;
        } else {
            c[fadeProp] += (0 - c[fadeProp]) * speed;
        }
    }
    while(current.length > target.length && current[current.length - 1][fadeProp] < 0.05 && current[current.length - 1][fadeProp] > -0.05) current.pop();
}

function resetEngine3D() {
    if (currentPipelineTimer) clearTimeout(currentPipelineTimer);
    if (carvingInterval3d) clearInterval(carvingInterval3d);
    state3d.attractors = []; state3d.barriers = []; state3d.targetToxicity = 0; state3d.noise = 0.02;
    targetState3d.attractors = []; targetState3d.barriers = []; targetState3d.friction = 0.92; targetState3d.noise = 0.02;
    physics3d.friction = 0.92; physics3d.vx = 0; physics3d.vz = 0; physics3d.x = 8; physics3d.z = 8;
}

function buildTrackerUI3D(numStages) {
    const tracker = document.getElementById('pipelineVis');
    tracker.innerHTML = '';
    for (let i = 0; i < numStages; i++) {
        let d = document.createElement('div');
        d.className = 'pipeline-step'; d.id = `pipe-seg-${i}`; d.textContent = `${i + 1}`;
        tracker.appendChild(d);
    }
}

// ============================================================
// 管线执行引擎
// ============================================================
function executePrimitive(primitiveId, overrides = {}, skipSpeech = false, onComplete = null) {
    const prim = PRIMITIVES[primitiveId];
    if (!prim) {
        log(`❌ 未知基元: ${primitiveId}`, "warn");
        if (onComplete) onComplete();
        return;
    }

    const baseDuration = overrides.durationMs || prim.durationMs;
    const currentSpeedMultiplier = parseFloat(document.getElementById('speedSlider').value) || 1.0;
    const actualDurationMs = baseDuration / currentSpeedMultiplier;

    const narration = overrides.narration || prim.narration;

    log(`▶️ 执行: ${prim.name} (${primitiveId}) [${(actualDurationMs/1000).toFixed(1)}s]`, "sys");
    if (!skipSpeech) speechEngine.speak(narration);

    targetState3d.attractors = JSON.parse(JSON.stringify(prim.physics.attractors || []));
    targetState3d.barriers = JSON.parse(JSON.stringify(prim.physics.barriers || []));
    targetState3d.friction = prim.physics.friction !== undefined ? prim.physics.friction : 0.92;
    targetState3d.noise = prim.physics.noise !== undefined ? prim.physics.noise : 0.02;

    executeMetabolicSteps(prim.metabolicSteps, actualDurationMs);

    setTimeout(() => { if (onComplete) onComplete(); }, actualDurationMs);
}

function executeMetabolicSteps(steps, totalActualDuration) {
    if (!steps || steps.length === 0) return;
    const stepDuration = totalActualDuration / steps.length;
    let currentStep = 0;

    function executeNextStep() {
        if (currentStep >= steps.length) return;
        const step = steps[currentStep];
        
        setNodes(step.nodes || []);
        if (step.particles) step.particles.forEach(p => spawn(p.from, p.to, p.color, p.count || 1));

        if (step.metabolism) {
            if (step.metabolism.gluDelta !== undefined) engine.targetGlu = Math.max(0, Math.min(100, engine.targetGlu + step.metabolism.gluDelta));
            if (step.metabolism.dopDelta !== undefined) engine.targetDop = Math.max(0, Math.min(100, engine.targetDop + step.metabolism.dopDelta));
            if (step.metabolism.toxicityDelta !== undefined) sharedState.targetToxicity = Math.max(0, Math.min(1, sharedState.targetToxicity + step.metabolism.toxicityDelta));
        }

        log(`  微观步骤 ${step.step}: ${step.action || "执行过程"}`, "normal");
        currentStep++;
        if (currentStep < steps.length) setTimeout(executeNextStep, stepDuration);
    }
    executeNextStep();
}

function executePipeline(pipeline, skipNarrationGeneration = false, skipFirstSpeech = false) {
    resetSystem(false);  
    currentPipelineData = pipeline;
    
    let stages = pipeline.primitives;
    if (typeof stages[0] === 'string') stages = stages.map(id => ({ primitiveId: id }));

    log(`🔗 开启管线: ${pipeline.name || 'AI动态序列'}`, "sys");
    
    buildTrackerUI3D(stages.length);
    updatePipelineVis(stages);

    // AI 生成旁白的逻辑已经在 analyzeState 中彻底完成并持久化，此处仅做预设序列的补全
    if (!skipNarrationGeneration) {
        stages.forEach((stage) => {
            const prim = PRIMITIVES[stage.primitiveId];
            if (!stage.narration && prim) {
                stage.narration = prim.narration;
            }
        });
    }

    calculateAndApplyMinSpeed(stages);
    executeStageRecursive(stages, 0, skipFirstSpeech);
}

function executeStageRecursive(stages, index, skipFirstSpeech = false) {
    if (index >= stages.length) {
        const isLooping = document.getElementById('loopToggle').checked;
        if (isLooping && currentPipelineData) {
            log(`🔁 2秒后重播该序列...`, "sys");
            updatePipelineProgress(-1);
            loopTimer = setTimeout(() => {
                executePipeline(currentPipelineData, true, false); 
            }, 2000);
        } else {
            log(`✅ 序列执行完毕`, "sys");
        }
        return;
    }

    updatePipelineProgress(index);
    const stage = stages[index];
    const primitiveId = stage.primitiveId || stage.primitive;
    
    const shouldSkipSpeech = (index === 0 && skipFirstSpeech);
    executePrimitive(primitiveId, stage, shouldSkipSpeech, () => {
        executeStageRecursive(stages, index + 1, false);
    });
}

function updatePipelineVis(stages) {
    const vis = document.getElementById('pipelineVis');
    vis.innerHTML = '';
    stages.forEach((stage, i) => {
        const div = document.createElement('div');
        div.className = 'pipeline-step';
        div.id = `pipeline-vis-${i}`;
        div.textContent = `${i + 1}. ${stage.primitiveId || stage.primitive}`;
        div.title = stage.narration || '';
        vis.appendChild(div);
    });
}

function updatePipelineProgress(activeIndex) {
    for (let i = 0; i < 10; i++) {
        const step = document.getElementById(`pipeline-vis-${i}`);
        if (step) {
            step.classList.remove('active', 'done');
            if (i < activeIndex) step.classList.add('done');
            else if (i === activeIndex) step.classList.add('active');
        }
    }
}

function concatenateHardDescription(pipeline) {
    if (!pipeline || !pipeline.primitives) return '';
    const hardDescriptions = pipeline.primitives.map((p, i) => {
        const prim = PRIMITIVES[p.primitiveId || p.primitive];
        const narration = p.narration || (prim ? prim.narration : '');
        return `阶段 ${i + 1} (${p.primitiveId || p.primitive}): ${narration}`;
    });
    return hardDescriptions.join('\n\n');
}

// ============================================================
// 4-Step 级联 AI 管线分析流程
// ============================================================
async function fetchWithRetry(url, options, retries = 5) {
    const delays = [1000, 2000, 4000, 8000, 16000];
    for (let i = 0; i < retries; i++) {
        try {
            const response = await fetch(url, options);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.json();
        } catch (e) {
            if (i === retries - 1) throw e;
            await new Promise(res => setTimeout(res, delays[i]));
        }
    }
}

async function callLLMAPI(systemPrompt, userText) {
    const provider = llmConfig.provider;
    const config = API_PROVIDERS[provider];
    
    if (!llmConfig.apiKey && config.requiresKey) {
        throw new Error(`请先在设置中配置${config.name}的API密钥`);
    }
    
    if (!llmConfig.endpoint) {
        throw new Error(`请先在设置中配置API端点`);
    }

    let url, payload, headers;

    headers = { "Content-Type": "application/json" };
    if (config.requiresKey) {
        headers["Authorization"] = `Bearer ${llmConfig.apiKey}`;
    }

    switch (provider) {
        case 'gemini':
            url = `${llmConfig.endpoint}/${llmConfig.model}:generateContent?key=${llmConfig.apiKey}`;
            payload = {
                contents: [{ parts: [{ text: userText }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: { responseMimeType: "application/json" }
            };
            break;
            
        case 'deepseek':
        case 'openai':
        case 'azure':
        case 'ollama':
            url = `${llmConfig.endpoint}/chat/completions`;
            payload = {
                model: llmConfig.model,
                messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: userText }
                ],
                response_format: { type: 'json_object' }
            };
            if (provider === 'azure') {
                headers["api-key"] = llmConfig.apiKey;
                delete headers["Authorization"];
            }
            break;
            
        default:
            throw new Error(`不支持的API提供商: ${provider}`);
    }

    log(`📡 正在调用 ${config.name} API...`, "sys");
    const result = await fetchWithRetry(url, { method: "POST", headers, body: JSON.stringify(payload) });
    
    let textContent;
    switch (provider) {
        case 'gemini':
            textContent = result.candidates?.[0]?.content?.parts?.[0]?.text;
            break;
        case 'deepseek':
        case 'openai':
        case 'azure':
        case 'ollama':
            textContent = result.choices?.[0]?.message?.content;
            break;
    }
    
    if (!textContent) throw new Error("API 未返回有效内容");
    
    const cleanJsonStr = textContent.replace(/```json/gi, '').replace(/```/g, '').trim();
    const jsonMatch = cleanJsonStr.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error("模型返回的内容不包含有效的 JSON 结构。");
    
    return JSON.parse(jsonMatch[0]);
}

请返回 JSON，格式如: { "analysis": "分析概要", "pipeline": [ {"primitiveId": "ANXIETY"} ] }`;
        
        const pipelineData = await callLLMAPI(prompt1, inputStr);

        // 【2. 生成“硬描述”】
        const hardDescription = concatenateHardDescription({ primitives: record.pipeline });

        log(`📝 [第二步] 物理/化学硬描述拼接完成`, "sys");

        // 【3. 调用 AI 融合软描述与硬描述生成旁白】

        const prompt2 = `你是一位认知叙事专家。你的任务是将科学准确的"硬描述"与用户提供的"软描述"融合，生成极具代入感的个性化认知旁白。
硬描述：\n${hardDescription}\n\n软描述（用户个人经历）：\n${inputStr}\n\n
要求：
1. 保持神经学科学术语。2. 融入用户的具体个人情境。3. 像讲故事一样。
输出格式 JSON: { "narrations": [ { "stage": 1, "narration": "融合后的旁白..." } ] }`;

        const fuseData = await callLLMAPI(prompt2, "请融合。");
        if (fuseData && fuseData.narrations) {

        // 【4. 执行渲染】

    } catch (error) {

        log(`❌ 转化失败: ${errMsg}`, "warn");

}
