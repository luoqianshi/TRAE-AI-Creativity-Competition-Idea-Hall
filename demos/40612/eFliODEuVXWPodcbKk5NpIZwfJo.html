<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情绪共创实验室 | Emotion Co-creation Lab</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;400;700;900&family=ZCOOL+XiaoWei&display=swap');

:root {
  --bg-primary: #0a0a0f;
  --text-primary: rgba(255,255,255,0.92);
  --text-secondary: rgba(255,255,255,0.5);
  --transition-speed: 1.8s;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Serif SC', serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow-x: hidden;
  min-height: 100vh;
  cursor: crosshair;
}

/* ========== CANVAS LAYERS ========== */
#particle-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}

#ambient-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
  pointer-events: none;
  opacity: 0.6;
  mix-blend-mode: screen;
}

/* ========== MAIN CONTENT ========== */
.main-container {
  position: relative;
  z-index: 10;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}

/* ========== ENTRANCE SCREEN ========== */
.entrance {
  text-align: center;
  animation: fadeInUp 2s ease-out;
}

.entrance-logo {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  letter-spacing: 0.15em;
  margin-bottom: 0.5rem;
  background: linear-gradient(135deg, #c9a96e, #f0d9a0, #c9a96e);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 30px rgba(201,169,110,0.3));
}

.entrance-sub {
  font-size: clamp(0.85rem, 2vw, 1.1rem);
  font-weight: 200;
  color: var(--text-secondary);
  letter-spacing: 0.4em;
  margin-bottom: 3rem;
}

.entrance-prompt {
  font-size: clamp(1rem, 2.5vw, 1.3rem);
  font-weight: 200;
  color: rgba(255,255,255,0.7);
  margin-bottom: 2.5rem;
  line-height: 1.8;
  animation: breathe 4s ease-in-out infinite;
}

/* ========== EMOTION GRID ========== */
.emotion-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 1.2rem;
  max-width: 700px;
  margin: 0 auto 2rem;
}

.emotion-btn {
  position: relative;
  width: 120px;
  height: 120px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 50%;
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(10px);
  cursor: pointer;
  transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  overflow: hidden;
}

.emotion-btn::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.6s ease;
}

.emotion-btn:hover {
  transform: scale(1.12);
  border-color: rgba(255,255,255,0.2);
}

.emotion-btn:hover::before { opacity: 1; }

.emotion-btn .icon {
  font-size: 2.2rem;
  transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
  filter: grayscale(0.3);
}

.emotion-btn:hover .icon {
  transform: scale(1.2);
  filter: grayscale(0);
}

.emotion-btn .label {
  font-size: 0.85rem;
  font-weight: 400;
  letter-spacing: 0.15em;
  color: rgba(255,255,255,0.7);
  transition: color 0.4s;
}

.emotion-btn:hover .label { color: #fff; }

/* Individual emotion colors */
.emotion-btn[data-emotion="happy"]::before { background: radial-gradient(circle, rgba(255,200,50,0.15), transparent 70%); }
.emotion-btn[data-emotion="happy"]:hover { box-shadow: 0 0 40px rgba(255,200,50,0.2); }

.emotion-btn[data-emotion="anxious"]::before { background: radial-gradient(circle, rgba(180,80,255,0.15), transparent 70%); }
.emotion-btn[data-emotion="anxious"]:hover { box-shadow: 0 0 40px rgba(180,80,255,0.2); }

.emotion-btn[data-emotion="tired"]::before { background: radial-gradient(circle, rgba(100,160,220,0.15), transparent 70%); }
.emotion-btn[data-emotion="tired"]:hover { box-shadow: 0 0 40px rgba(100,160,220,0.2); }

.emotion-btn[data-emotion="excited"]::before { background: radial-gradient(circle, rgba(255,80,120,0.15), transparent 70%); }
.emotion-btn[data-emotion="excited"]:hover { box-shadow: 0 0 40px rgba(255,80,120,0.2); }

.emotion-btn[data-emotion="sad"]::before { background: radial-gradient(circle, rgba(80,130,200,0.15), transparent 70%); }
.emotion-btn[data-emotion="sad"]:hover { box-shadow: 0 0 40px rgba(80,130,200,0.2); }

/* ========== CUSTOM INPUT ========== */
.custom-input-area {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  max-width: 500px;
  width: 100%;
  margin: 0 auto;
}

.custom-input {
  flex: 1;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 30px;
  padding: 0.9rem 1.5rem;
  color: var(--text-primary);
  font-family: 'Noto Serif SC', serif;
  font-size: 0.95rem;
  font-weight: 200;
  outline: none;
  transition: all 0.4s ease;
  letter-spacing: 0.05em;
}

.custom-input::placeholder { color: rgba(255,255,255,0.25); }
.custom-input:focus {
  border-color: rgba(201,169,110,0.4);
  box-shadow: 0 0 20px rgba(201,169,110,0.1);
}

.submit-btn {
  width: 48px; height: 48px;
  border-radius: 50%;
  border: 1px solid rgba(201,169,110,0.3);
  background: rgba(201,169,110,0.1);
  color: #c9a96e;
  font-size: 1.2rem;
  cursor: pointer;
  transition: all 0.4s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}

.submit-btn:hover {
  background: rgba(201,169,110,0.2);
  transform: scale(1.1);
  box-shadow: 0 0 20px rgba(201,169,110,0.2);
}

/* ========== EXPERIENCE SCREEN ========== */
.experience-screen {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 1s ease;
}

.experience-screen.active {
  display: flex;
  opacity: 1;
}

.experience-content {
  text-align: center;
  max-width: 700px;
  padding: 2rem;
  position: relative;
  z-index: 10;
}

.experience-emotion-label {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: clamp(1rem, 2vw, 1.3rem);
  letter-spacing: 0.5em;
  color: rgba(255,255,255,0.4);
  margin-bottom: 1rem;
  text-transform: uppercase;
}

.experience-title {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: clamp(2rem, 5vw, 3.5rem);
  line-height: 1.4;
  margin-bottom: 2rem;
  letter-spacing: 0.1em;
  animation: titleReveal 2s ease-out;
}

.experience-body {
  font-size: clamp(0.95rem, 2vw, 1.15rem);
  font-weight: 200;
  line-height: 2.2;
  color: rgba(255,255,255,0.75);
  margin-bottom: 2.5rem;
  max-width: 560px;
  margin-left: auto;
  margin-right: auto;
}

.experience-quote {
  font-size: clamp(1.1rem, 2.5vw, 1.4rem);
  font-weight: 400;
  line-height: 2;
  color: rgba(255,255,255,0.85);
  padding: 1.5rem 2rem;
  border-left: 2px solid rgba(201,169,110,0.4);
  margin-bottom: 2.5rem;
  max-width: 500px;
  margin-left: auto;
  margin-right: auto;
  text-align: left;
  animation: quoteReveal 2.5s ease-out 0.5s both;
}

/* Breathing circle */
.breath-circle {
  width: 120px; height: 120px;
  border-radius: 50%;
  margin: 0 auto 2rem;
  animation: breatheCircle 6s ease-in-out infinite;
  position: relative;
}

.breath-circle::after {
  content: '';
  position: absolute;
  inset: 15px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.15), transparent);
  animation: breatheCircleInner 6s ease-in-out infinite;
}

/* Back button */
.back-btn {
  position: fixed;
  top: 2rem; left: 2rem;
  z-index: 200;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 30px;
  padding: 0.6rem 1.5rem;
  color: rgba(255,255,255,0.6);
  font-family: 'Noto Serif SC', serif;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.4s ease;
  letter-spacing: 0.1em;
  backdrop-filter: blur(10px);
}

.back-btn:hover {
  background: rgba(255,255,255,0.1);
  color: #fff;
}

/* Music toggle */
.music-toggle {
  position: fixed;
  top: 2rem; right: 2rem;
  z-index: 200;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.5);
  font-size: 1.1rem;
  cursor: pointer;
  transition: all 0.4s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(10px);
}

.music-toggle:hover {
  background: rgba(255,255,255,0.1);
  color: #fff;
}

.music-toggle.playing {
  animation: pulse 2s ease-in-out infinite;
}

/* ========== EMOTION-SPECIFIC BACKGROUNDS ========== */
body.emotion-happy { --bg-primary: #1a1408; }
body.emotion-happy .experience-title { color: #ffd54f; }
body.emotion-happy .breath-circle { background: radial-gradient(circle, rgba(255,213,79,0.3), rgba(255,152,0,0.1), transparent); }

body.emotion-anxious { --bg-primary: #0d0818; }
body.emotion-anxious .experience-title { color: #ce93d8; }
body.emotion-anxious .breath-circle { background: radial-gradient(circle, rgba(186,104,200,0.3), rgba(124,77,255,0.1), transparent); }

body.emotion-tired { --bg-primary: #060d18; }
body.emotion-tired .experience-title { color: #90caf9; }
body.emotion-tired .breath-circle { background: radial-gradient(circle, rgba(100,181,246,0.3), rgba(66,165,245,0.1), transparent); }

body.emotion-excited { --bg-primary: #180810; }
body.emotion-excited .experience-title { color: #ff8a80; }
body.emotion-excited .breath-circle { background: radial-gradient(circle, rgba(255,82,82,0.3), rgba(255,23,68,0.1), transparent); }

body.emotion-sad { --bg-primary: #080c18; }
body.emotion-sad .experience-title { color: #82b1ff; }
body.emotion-sad .breath-circle { background: radial-gradient(circle, rgba(68,138,255,0.3), rgba(41,98,255,0.1), transparent); }

/* ========== TYPING ANIMATION ========== */
.typewriter { overflow: hidden; white-space: normal; }

/* ========== ANIMATIONS ========== */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(40px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes breathe {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

@keyframes breatheCircle {
  0%, 100% { transform: scale(0.85); opacity: 0.6; }
  50% { transform: scale(1.15); opacity: 1; }
}

@keyframes breatheCircleInner {
  0%, 100% { transform: scale(0.9); opacity: 0.3; }
  50% { transform: scale(1.1); opacity: 0.8; }
}

@keyframes titleReveal {
  from { opacity: 0; transform: translateY(30px) scale(0.95); filter: blur(10px); }
  to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

@keyframes quoteReveal {
  from { opacity: 0; transform: translateX(-20px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(201,169,110,0.3); }
  50% { box-shadow: 0 0 0 10px rgba(201,169,110,0); }
}

@keyframes floatUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.stagger-1 { animation: floatUp 0.8s ease-out 0.1s both; }
.stagger-2 { animation: floatUp 0.8s ease-out 0.2s both; }
.stagger-3 { animation: floatUp 0.8s ease-out 0.3s both; }
.stagger-4 { animation: floatUp 0.8s ease-out 0.4s both; }
.stagger-5 { animation: floatUp 0.8s ease-out 0.5s both; }

/* ========== RESPONSIVE ========== */
@media (max-width: 600px) {
  .emotion-btn { width: 90px; height: 90px; }
  .emotion-btn .icon { font-size: 1.6rem; }
  .emotion-btn .label { font-size: 0.75rem; }
  .emotion-grid { gap: 0.8rem; }
  .back-btn { top: 1rem; left: 1rem; padding: 0.5rem 1rem; font-size: 0.8rem; }
  .music-toggle { top: 1rem; right: 1rem; }
}

/* ========== TRANSITION OVERLAY ========== */
.transition-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: #000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease;
}

.transition-overlay.active {
  opacity: 1;
  pointer-events: all;
}

/* ========== FOOTER ========== */
.footer-hint {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.75rem;
  color: rgba(255,255,255,0.15);
  letter-spacing: 0.3em;
  z-index: 10;
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>
<canvas id="ambient-canvas"></canvas>

<div class="transition-overlay" id="transitionOverlay"></div>

<!-- ========== ENTRANCE ========== -->
<div class="main-container" id="entranceScreen">
  <div class="entrance">
    <div class="entrance-logo">情绪共创实验室</div>
    <div class="entrance-sub">EMOTION CO-CREATION LAB</div>
    <div class="entrance-prompt">此刻，你的心情是什么？</div>

    <div class="emotion-grid">
      <button class="emotion-btn stagger-1" data-emotion="happy" onclick="selectEmotion('happy')">
        <span class="icon">☀️</span>
        <span class="label">开心</span>
      </button>
      <button class="emotion-btn stagger-2" data-emotion="anxious" onclick="selectEmotion('anxious')">
        <span class="icon">🌀</span>
        <span class="label">焦虑</span>
      </button>
      <button class="emotion-btn stagger-3" data-emotion="tired" onclick="selectEmotion('tired')">
        <span class="icon">🌙</span>
        <span class="label">疲惫</span>
      </button>
      <button class="emotion-btn stagger-4" data-emotion="excited" onclick="selectEmotion('excited')">
        <span class="icon">🔥</span>
        <span class="label">兴奋</span>
      </button>
      <button class="emotion-btn stagger-5" data-emotion="sad" onclick="selectEmotion('sad')">
        <span class="icon">💧</span>
        <span class="label">悲伤</span>
      </button>
    </div>

    <div class="custom-input-area">
      <input type="text" class="custom-input" id="customEmotion" placeholder="或者，描述你此刻的感受..." maxlength="50">
      <button class="submit-btn" onclick="submitCustomEmotion()">→</button>
    </div>
  </div>
</div>

<!-- ========== EXPERIENCE SCREEN ========== -->
<div class="experience-screen" id="experienceScreen">
  <button class="back-btn" onclick="goBack()">← 返回</button>
  <button class="music-toggle" id="musicToggle" onclick="toggleMusic()">♪</button>

  <div class="experience-content">
    <div class="breath-circle"></div>
    <div class="experience-emotion-label" id="expEmotionLabel"></div>
    <div class="experience-title" id="expTitle"></div>
    <div class="experience-body" id="expBody"></div>
    <div class="experience-quote" id="expQuote"></div>
  </div>
</div>

<div class="footer-hint">POWERED BY TRAE AI · 情绪共创实验室</div>

<script>
// ========== EMOTION DATA ==========
const emotionData = {
  happy: {
    label: '开心 · HAPPY',
    title: '阳光正好，你也是',
    body: '此刻的你，像一颗被阳光亲吻过的橘子糖，甜得刚刚好。这份快乐不需要理由，不需要保存——它属于现在，属于你。让这份温暖在身体里多停留一会儿吧。',
    quote: '「快乐不是终点，而是一种行走方式。你此刻的微笑，就是最好的风景。」',
    colors: { primary: [255, 213, 79], secondary: [255, 152, 0], bg: '#1a1408' },
    particleStyle: 'rise',
    ambientStyle: 'warm-glow'
  },
  anxious: {
    label: '焦虑 · ANXIOUS',
    title: '深呼吸，风暴会过去',
    body: '焦虑是身体在提醒你——你在乎，所以才会紧张。这不是软弱，是勇气的前奏。现在，试着把注意力放在呼吸上：吸气4秒，屏住4秒，呼气6秒。风暴从不曾真正停留。',
    quote: '「你不需要控制一切。有些事情，放下反而比握紧更需要力量。」',
    colors: { primary: [186, 104, 200], secondary: [124, 77, 255], bg: '#0d0818' },
    particleStyle: 'swirl',
    ambientStyle: 'aurora'
  },
  tired: {
    label: '疲惫 · TIRED',
    title: '允许自己停下来',
    body: '你已经走了很远，做了很多。此刻的疲惫，是身体在温柔地说：够了，休息一下吧。不需要 productivity，不需要 efficiency。你值得一段什么都不做的时光。闭上眼，让世界安静下来。',
    quote: '「休息不是浪费时间，而是为下一次出发积蓄星光。今夜，你是月亮最宠爱的孩子。」',
    colors: { primary: [100, 181, 246], secondary: [66, 165, 245], bg: '#060d18' },
    particleStyle: 'fall',
    ambientStyle: 'ocean'
  },
  excited: {
    label: '兴奋 · EXCITED',
    title: '你的能量，正在燃烧',
    body: '能感受到吗？那种从胸腔里涌上来的热度——那是生命力在沸腾。兴奋的时候，整个宇宙都在为你让路。不要压抑它，让它带着你飞。这一刻，你就是自己的烟花。',
    quote: '「世界上最强大的力量，是一个人知道自己想要什么，并且全身心地燃烧。」',
    colors: { primary: [255, 82, 82], secondary: [255, 23, 68], bg: '#180810' },
    particleStyle: 'burst',
    ambientStyle: 'fire'
  },
  sad: {
    label: '悲伤 · SAD',
    title: '眼泪是灵魂在洗澡',
    body: '悲伤不是敌人，它是爱留下的影子。你感到难过，说明你曾认真地在乎过某个人、某件事。允许自己难过，就像允许天空下雨。雨后会放晴，而你会在泪水里看见更清澈的自己。',
    quote: '「脆弱不是缺陷，是通向温柔的护照。你今天流下的每一滴泪，都会变成明天的星光。」',
    colors: { primary: [68, 138, 255], secondary: [41, 98, 255], bg: '#080c18' },
    particleStyle: 'rain',
    ambientStyle: 'deep-sea'
  }
};

// Custom emotion mapping
const customKeywords = {
  happy: ['开心', '快乐', '高兴', '幸福', '满足', '喜悦', '愉快', '美好', '棒', '好', '甜', '笑', '赞', '爽', '乐', '嗨'],
  anxious: ['焦虑', '紧张', '担心', '不安', '烦躁', '压力', '慌', '怕', '烦', '急', '纠结', '迷茫', '无助'],
  tired: ['疲惫', '累', '困', '倦', '乏', '无力', '没精神', '撑不住', '透支', '消耗', '筋疲力尽'],
  excited: ['兴奋', '激动', '期待', '热情', '燃', '冲', '冲劲', '斗志', '澎湃', '热血', '振奋'],
  sad: ['悲伤', '难过', '伤心', '失落', '孤独', '寂寞', '心痛', '哭', '泪', '低落', '沮丧', '郁闷', '消沉']
};

// ========== PARTICLE SYSTEM ==========
const particleCanvas = document.getElementById('particle-canvas');
const pCtx = particleCanvas.getContext('2d');
const ambientCanvas = document.getElementById('ambient-canvas');
const aCtx = ambientCanvas.getContext('2d');
let particles = [];
let currentEmotion = null;
let animationId = null;
let audioCtx = null;
let isPlaying = false;
let oscillators = [];

function resizeCanvases() {
  particleCanvas.width = window.innerWidth;
  particleCanvas.height = window.innerHeight;
  ambientCanvas.width = window.innerWidth;
  ambientCanvas.height = window.innerHeight;
}
resizeCanvases();
window.addEventListener('resize', resizeCanvases);

class Particle {
  constructor(emotion) {
    this.reset(emotion);
  }

  reset(emotion) {
    const w = particleCanvas.width;
    const h = particleCanvas.height;
    const data = emotionData[emotion];
    const c = data.colors;

    switch(data.particleStyle) {
      case 'rise':
        this.x = Math.random() * w;
        this.y = h + 20;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = -(Math.random() * 1.5 + 0.5);
        this.size = Math.random() * 4 + 1;
        this.life = Math.random() * 200 + 100;
        this.color = `rgba(${c.primary[0]},${c.primary[1]},${c.primary[2]},`;
        break;
      case 'swirl':
        this.angle = Math.random() * Math.PI * 2;
        this.radius = Math.random() * 200 + 50;
        this.cx = w / 2;
        this.cy = h / 2;
        this.speed = (Math.random() * 0.02 + 0.005) * (Math.random() > 0.5 ? 1 : -1);
        this.size = Math.random() * 3 + 1;
        this.life = Math.random() * 300 + 150;
        this.color = `rgba(${c.primary[0]},${c.primary[1]},${c.primary[2]},`;
        break;
      case 'fall':
        this.x = Math.random() * w;
        this.y = -20;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = Math.random() * 0.8 + 0.2;
        this.size = Math.random() * 3 + 0.5;
        this.life = Math.random() * 400 + 200;
        this.color = `rgba(${c.primary[0]},${c.primary[1]},${c.primary[2]},`;
        this.wobble = Math.random() * Math.PI * 2;
        this.wobbleSpeed = Math.random() * 0.03 + 0.01;
        break;
      case 'burst':
        this.x = w / 2;
        this.y = h / 2;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.size = Math.random() * 5 + 2;
        this.life = Math.random() * 80 + 40;
        this.color = `rgba(${c.primary[0]},${c.primary[1]},${c.primary[2]},`;
        this.gravity = 0.02;
        break;
      case 'rain':
        this.x = Math.random() * w;
        this.y = -20;
        this.vx = -0.5;
        this.vy = Math.random() * 4 + 3;
        this.size = Math.random() * 1.5 + 0.5;
        this.length = Math.random() * 20 + 10;
        this.life = Math.random() * 200 + 100;
        this.color = `rgba(${c.primary[0]},${c.primary[1]},${c.primary[2]},`;
        break;
    }
    this.maxLife = this.life;
    this.emotion = emotion;
  }

  update() {
    this.life--;
    const data = emotionData[this.emotion];

    switch(data.particleStyle) {
      case 'rise':
        this.x += this.vx;
        this.y += this.vy;
        this.vx += (Math.random() - 0.5) * 0.05;
        break;
      case 'swirl':
        this.angle += this.speed;
        this.radius += Math.sin(this.angle * 3) * 0.3;
        this.x = this.cx + Math.cos(this.angle) * this.radius;
        this.y = this.cy + Math.sin(this.angle) * this.radius;
        break;
      case 'fall':
        this.wobble += this.wobbleSpeed;
        this.x += this.vx + Math.sin(this.wobble) * 0.5;
        this.y += this.vy;
        break;
      case 'burst':
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.vx *= 0.99;
        break;
      case 'rain':
        this.x += this.vx;
        this.y += this.vy;
        break;
    }

    if (this.life <= 0) this.reset(this.emotion);
  }

  draw(ctx) {
    const alpha = Math.min(1, this.life / (this.maxLife * 0.3));
    const data = emotionData[this.emotion];

    if (data.particleStyle === 'rain') {
      ctx.strokeStyle = this.color + alpha * 0.4 + ')';
      ctx.lineWidth = this.size;
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(this.x + this.vx * 3, this.y - this.length);
      ctx.stroke();
    } else {
      ctx.fillStyle = this.color + alpha * 0.6 + ')';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();

      if (this.size > 2) {
        ctx.fillStyle = this.color + alpha * 0.15 + ')';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

// ========== AMBIENT GRADIENT ==========
let ambientTime = 0;

function drawAmbient() {
  if (!currentEmotion) return;
  const w = ambientCanvas.width;
  const h = ambientCanvas.height;
  const data = emotionData[currentEmotion];
  const c = data.colors;

  aCtx.clearRect(0, 0, w, h);
  ambientTime += 0.005;

  switch(data.ambientStyle) {
    case 'warm-glow': {
      const gx = w * 0.5 + Math.sin(ambientTime) * w * 0.2;
      const gy = h * 0.4 + Math.cos(ambientTime * 0.7) * h * 0.15;
      const grad = aCtx.createRadialGradient(gx, gy, 0, gx, gy, Math.max(w, h) * 0.5);
      grad.addColorStop(0, `rgba(${c.primary[0]},${c.primary[1]},${c.primary[2]},0.12)`);
      grad.addColorStop(0.5, `rgba(${c.secondary[0]},${c.secondary[1]},${c.secondary[2]},0.05)`);
      grad.addColorStop(1, 'transparent');
      aCtx.fillStyle = grad;
      aCtx.fillRect(0, 0, w, h);
      break;
    }
    case 'aurora': {
      for (let i = 0; i < 3; i++) {
        const gx = w * (0.3 + i * 0.2) + Math.sin(ambientTime + i) * 100;
        const gy = h * 0.3 + Math.cos(ambientTime * 0.5 + i * 2) * 80;
        const grad = aCtx.createRadialGradient(gx, gy, 0, gx, gy, 300);
        grad.addColorStop(0, `rgba(${c.primary[0]},${c.primary[1]},${c.primary[2]},0.08)`);
        grad.addColorStop(1, 'transparent');
        aCtx.fillStyle = grad;
        aCtx.fillRect(0, 0, w, h);
      }
      break;
    }
    case 'ocean': {
      const gx = w * 0.5;
      const gy = h * 0.6 + Math.sin(ambientTime * 0.5) * 50;
      const grad = aCtx.createRadialGradient(gx, gy, 0, gx, gy, Math.max(w, h) * 0.6);
      grad.addColorStop(0, `rgba(${c.primary[0]},${c.primary[1]},${c.primary[2]},0.1)`);
      grad.addColorStop(0.6, `rgba(${c.secondary[0]},${c.secondary[1]},${c.secondary[2]},0.04)`);
      grad.addColorStop(1, 'transparent');
      aCtx.fillStyle = grad;
      aCtx.fillRect(0, 0, w, h);
      break;
    }
    case 'fire': {
      for (let i = 0; i < 4; i++) {
        const gx = w * 0.5 + Math.sin(ambientTime * 2 + i * 1.5) * 150;
        const gy = h * 0.5 + Math.cos(ambientTime * 1.5 + i) * 100;
        const grad = aCtx.createRadialGradient(gx, gy, 0, gx, gy, 200);
        grad.addColorStop(0, `rgba(${c.primary[0]},${c.primary[1]},${c.primary[2]},0.1)`);
        grad.addColorStop(1, 'transparent');
        aCtx.fillStyle = grad;
        aCtx.fillRect(0, 0, w, h);
      }
      break;
    }
    case 'deep-sea': {
      const gx = w * 0.5 + Math.sin(ambientTime * 0.3) * 80;
      const gy = h * 0.4 + Math.cos(ambientTime * 0.4) * 60;
      const grad = aCtx.createRadialGradient(gx, gy, 0, gx, gy, Math.max(w, h) * 0.5);
      grad.addColorStop(0, `rgba(${c.primary[0]},${c.primary[1]},${c.primary[2]},0.08)`);
      grad.addColorStop(0.5, `rgba(${c.secondary[0]},${c.secondary[1]},${c.secondary[2]},0.04)`);
      grad.addColorStop(1, 'transparent');
      aCtx.fillStyle = grad;
      aCtx.fillRect(0, 0, w, h);
      break;
    }
  }
}

// ========== ANIMATION LOOP ==========
function animate() {
  pCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
  particles.forEach(p => { p.update(); p.draw(pCtx); });
  drawAmbient();
  animationId = requestAnimationFrame(animate);
}

// Default idle particles
function initIdleParticles() {
  particles = [];
  for (let i = 0; i < 40; i++) {
    const p = new Particle('tired');
    p.life = Math.random() * p.maxLife;
    particles.push(p);
  }
}

function initEmotionParticles(emotion) {
  particles = [];
  const count = emotionData[emotion].particleStyle === 'burst' ? 80 : 60;
  for (let i = 0; i < count; i++) {
    const p = new Particle(emotion);
    p.life = Math.random() * p.maxLife;
    particles.push(p);
  }
}

// ========== AUDIO SYSTEM (Web Audio API) ==========
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function createAmbientSound(emotion) {
  stopAudio();
  initAudio();

  const data = emotionData[emotion];
  const now = audioCtx.currentTime;

  switch(emotion) {
    case 'happy': {
      // Warm major chord - C E G
      [261.63, 329.63, 392.00].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.04, now + 2);
        gain.gain.linearRampToValueAtTime(0.03, now + 10);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now);
        oscillators.push({ osc, gain });
      });
      break;
    }
    case 'anxious': {
      // Dissonant minor - A C D#
      [220, 261.63, 311.13].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.linearRampToValueAtTime(freq * 1.02, now + 3);
        osc.frequency.linearRampToValueAtTime(freq, now + 6);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.03, now + 2);
        gain.gain.linearRampToValueAtTime(0.02, now + 10);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now);
        oscillators.push({ osc, gain });
      });
      break;
    }
    case 'tired': {
      // Soft pad - low frequencies
      [130.81, 164.81, 196.00].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.05, now + 3);
        gain.gain.linearRampToValueAtTime(0.03, now + 10);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now);
        oscillators.push({ osc, gain });
      });
      break;
    }
    case 'excited': {
      // Energetic - rhythmic pulse
      [329.63, 440, 523.25].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.04, now + 1);
        gain.gain.linearRampToValueAtTime(0.02, now + 2);
        gain.gain.linearRampToValueAtTime(0.04, now + 3);
        gain.gain.linearRampToValueAtTime(0.02, now + 4);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now);
        oscillators.push({ osc, gain });
      });
      break;
    }
    case 'sad': {
      // Melancholic minor - D F A
      [146.83, 174.61, 220].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.04, now + 3);
        gain.gain.linearRampToValueAtTime(0.025, now + 10);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now);
        oscillators.push({ osc, gain });
      });
      break;
    }
  }
}

function stopAudio() {
  oscillators.forEach(({ osc, gain }) => {
    try {
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
      osc.stop(audioCtx.currentTime + 0.6);
    } catch(e) {}
  });
  oscillators = [];
  isPlaying = false;
  document.getElementById('musicToggle').classList.remove('playing');
}

function toggleMusic() {
  if (!currentEmotion) return;
  if (isPlaying) {
    stopAudio();
  } else {
    createAmbientSound(currentEmotion);
    isPlaying = true;
    document.getElementById('musicToggle').classList.add('playing');
  }
}

// ========== EMOTION SELECTION ==========
function selectEmotion(emotion) {
  const overlay = document.getElementById('transitionOverlay');
  overlay.classList.add('active');

  setTimeout(() => {
    currentEmotion = emotion;
    document.body.className = `emotion-${emotion}`;
    document.body.style.background = emotionData[emotion].colors.bg;
    document.body.style.transition = `background ${1.8}s ease`;

    initEmotionParticles(emotion);

    document.getElementById('entranceScreen').style.display = 'none';
    const expScreen = document.getElementById('experienceScreen');
    expScreen.classList.add('active');

    const data = emotionData[emotion];
    document.getElementById('expEmotionLabel').textContent = data.label;
    document.getElementById('expTitle').textContent = data.title;
    document.getElementById('expBody').textContent = data.body;
    document.getElementById('expQuote').textContent = data.quote;

    // Auto-play ambient sound
    createAmbientSound(emotion);
    isPlaying = true;
    document.getElementById('musicToggle').classList.add('playing');

    setTimeout(() => {
      overlay.classList.remove('active');
    }, 400);
  }, 800);
}

function submitCustomEmotion() {
  const input = document.getElementById('customEmotion').value.trim();
  if (!input) return;

  let matched = null;
  for (const [emotion, keywords] of Object.entries(customKeywords)) {
    if (keywords.some(kw => input.includes(kw))) {
      matched = emotion;
      break;
    }
  }

  if (matched) {
    selectEmotion(matched);
  } else {
    // Default to a calming experience for unrecognized emotions
    selectEmotion('tired');
  }
}

// Enter key support
document.getElementById('customEmotion').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submitCustomEmotion();
});

function goBack() {
  const overlay = document.getElementById('transitionOverlay');
  overlay.classList.add('active');

  setTimeout(() => {
    stopAudio();
    currentEmotion = null;
    document.body.className = '';
    document.body.style.background = '#0a0a0f';

    document.getElementById('experienceScreen').classList.remove('active');
    document.getElementById('entranceScreen').style.display = 'flex';

    initIdleParticles();

    setTimeout(() => {
      overlay.classList.remove('active');
    }, 400);
  }, 800);
}

// ========== INIT ==========
initIdleParticles();
animate();
</script>
