<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>手势音乐台 · Air Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Sora:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <style>
:root {
  --bg: #f5f5f8;
  --bg-elev: #ffffff;
  --bg-elev-2: #eef0f4;
  --text: #1a1a2e;
  --text-muted: #8a8aa0;
  --accent: #6c5ce7;
  --accent-hover: #5a4bd6;
  --accent-soft: rgba(108, 92, 231, 0.1);
  --accent-glow: rgba(108, 92, 231, 0.35);
  --danger: #ff4757;
  --success: #2ed573;
  --border: rgba(20, 20, 40, 0.08);
  --border-strong: rgba(20, 20, 40, 0.16);
  --font-display: 'Syne', system-ui, sans-serif;
  --font-body: 'Sora', system-ui, sans-serif;
  --font-mono: 'Space Mono', ui-monospace, monospace;
  --panel-width: 300px;
  --header-h: 72px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-weight: 400;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  /* 100dvh 适配 iOS Safari 地址栏伸缩 */
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  /* 浅色氛围光：柔和的紫色光晕，营造干净通透的舞台感 */
  background-image:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(108, 92, 231, 0.08), transparent 60%),
    radial-gradient(circle at 85% 90%, rgba(108, 92, 231, 0.04), transparent 50%);
}

/* ---------- Header ---------- */
.app-header {
  flex-shrink: 0;
  height: var(--header-h);
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-mark {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  background: var(--accent);
  box-shadow: 0 0 16px var(--accent-glow);
  animation: pulse 2.4s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.75); }
}

.brand-title {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 21px;
  letter-spacing: 0.3px;
  color: var(--text);
}

.brand-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 1.8px;
  text-transform: uppercase;
}

/* ---------- Workspace ---------- */
.workspace {
  flex: 1;
  min-height: 0;
  display: flex;
}

.stage-wrap {
  flex: 1;
  display: flex;
  padding: 24px;
  min-width: 0;
}

.stage {
  position: relative;
  flex: 1;
  border-radius: 18px;
  overflow: hidden;
  background: #000;
  border: 1px solid var(--border-strong);
  box-shadow:
    0 24px 60px rgba(20, 20, 60, 0.12),
    0 0 0 1px rgba(108, 92, 231, 0.1);
}

#video,
#overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#video {
  transform: scaleX(-1);
}

#overlay {
  pointer-events: none;
}

/* ---------- 空状态提示（无手时居中显示，在深色视频上） ---------- */
.stage-hint {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  pointer-events: none;
  transition: opacity 0.4s ease;
}

.stage-hint.hidden {
  opacity: 0;
}

.stage-hint-icon {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 1.5px solid var(--accent);
  box-shadow: 0 0 32px var(--accent-glow);
  animation: hintPulse 2.8s ease-in-out infinite;
  position: relative;
}

.stage-hint-icon::after {
  content: '';
  position: absolute;
  inset: 14px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0.7;
}

@keyframes hintPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 32px var(--accent-glow); }
  50% { transform: scale(1.12); box-shadow: 0 0 48px var(--accent-glow); }
}

/* 视频舞台内部文字保持白色（视频是深色的） */
.stage-hint-text {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 18px;
  letter-spacing: 0.5px;
  color: #fff;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
}

.stage-hint-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: rgba(255, 255, 255, 0.7);
  letter-spacing: 1px;
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
}

/* ---------- Status bar（视频底部叠加，保持深色渐变） ---------- */
.status-bar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 16px 22px;
  background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
  color: #fff;
  font-size: 13px;
  letter-spacing: 0.3px;
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: none;
  z-index: 6;
}

/* ---------- Error overlay（视频上叠加，保持深色蒙层） ---------- */
.error-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(10, 10, 20, 0.82);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.error-card {
  text-align: center;
  padding: 32px 40px;
  border: 1px solid var(--border-strong);
  border-radius: 16px;
  background: var(--bg-elev);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
}

.error-text {
  font-size: 15px;
  margin-bottom: 20px;
  color: var(--text);
}

.error-retry {
  padding: 10px 26px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
}

.error-retry:hover {
  background: var(--accent-hover);
  transform: translateY(-1px);
}

/* ---------- Control panel（白色系） ---------- */
.control-panel {
  flex-shrink: 0;
  width: var(--panel-width);
  padding: 28px 22px;
  background: var(--bg-elev);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 24px;
  overflow-y: auto;
}

.panel-section {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* AI 音乐导演状态显示区 */
.ai-state-section {
  flex: 1 1 100%;
}

.ai-state-display {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
  background: var(--accent-soft);
  border: 1px solid rgba(108, 92, 231, 0.2);
  border-radius: 10px;
  padding: 12px 14px;
  letter-spacing: 0.02em;
  transition: border-color 0.3s, background 0.3s;
}

/* AI 状态指示点：呼吸光效，暗示 AI 正在实时工作 */
.ai-state-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent-glow);
  flex-shrink: 0;
  animation: aiBreathe 1.8s ease-in-out infinite;
}

@keyframes aiBreathe {
  0%, 100% { opacity: 1; box-shadow: 0 0 10px var(--accent-glow); }
  50% { opacity: 0.4; box-shadow: 0 0 4px var(--accent-glow); }
}

.ai-state-text {
  flex: 1;
  color: var(--accent);
}

.ai-hint {
  margin: 0;
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.5;
}

.panel-label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: var(--text-muted);
}

/* ---------- BPM 滑块 ---------- */
.bpm-row {
  display: flex;
  align-items: center;
  gap: 14px;
}

.panel-range {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: var(--bg-elev-2);
  border-radius: 999px;
  outline: none;
  cursor: pointer;
}

.panel-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.15), 0 2px 8px rgba(108, 92, 231, 0.3);
  transition: transform 0.15s, box-shadow 0.15s;
}

.panel-range::-webkit-slider-thumb:hover {
  transform: scale(1.2);
  box-shadow: 0 0 0 6px rgba(108, 92, 231, 0.2), 0 2px 12px rgba(108, 92, 231, 0.4);
}

.panel-range::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border: none;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.15);
}

.bpm-value {
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  min-width: 38px;
  text-align: right;
}

/* ---------- Transport buttons ---------- */
.transport {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.btn {
  width: 100%;
  padding: 13px 16px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: var(--bg-elev-2);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.4px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.2s;
}

.btn:hover:not(:disabled) {
  border-color: var(--border-strong);
  transform: translateY(-1px);
  background: #e4e7ed;
}

.btn:active:not(:disabled) {
  transform: translateY(0);
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.btn-record {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 4px 16px rgba(108, 92, 231, 0.25);
}

.btn-record:hover:not(:disabled) {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
  box-shadow: 0 6px 22px rgba(108, 92, 231, 0.35);
  color: #fff;
}

.btn-record.recording {
  background: var(--danger);
  border-color: var(--danger);
  color: #fff;
  box-shadow: 0 0 0 4px rgba(255, 71, 87, 0.18);
  animation: recordPulse 1.4s ease-in-out infinite;
}

@keyframes recordPulse {
  0%, 100% { box-shadow: 0 0 0 4px rgba(255, 71, 87, 0.18); }
  50% { box-shadow: 0 0 0 10px rgba(255, 71, 87, 0.04); }
}

.btn-stop:hover:not(:disabled) {
  background: var(--danger);
  border-color: var(--danger);
  color: #fff;
}

.btn-play:hover:not(:disabled) {
  background: var(--success);
  border-color: var(--success);
  color: #062b14;
}

/* ---------- Utility ---------- */
.hidden {
  display: none !important;
}

/* ---------- Responsive ---------- */
@media (max-width: 768px) {
  body {
    overflow: auto;
    height: auto;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .app-header {
    padding-top: calc(0px + env(safe-area-inset-top));
    padding-left: 20px;
    padding-right: 20px;
    height: auto;
    min-height: var(--header-h);
  }

  .brand-title {
    font-size: 18px;
  }

  .brand-sub {
    font-size: 9px;
  }

  .workspace {
    flex-direction: column;
  }

  .stage-wrap {
    padding: 12px;
    min-height: 52vh;
  }

  .stage {
    border-radius: 14px;
  }

  .stage-hint-text {
    font-size: 16px;
  }

  .control-panel {
    width: 100%;
    border-left: none;
    border-top: 1px solid var(--border);
    flex-direction: row;
    flex-wrap: wrap;
    gap: 16px;
    padding: 20px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
  }

  .panel-section {
    flex: 1 1 calc(50% - 8px);
    min-width: 140px;
  }

  .ai-state-section {
    flex: 1 1 100%;
  }

  .panel-range {
    height: 6px;
  }

  .panel-range::-webkit-slider-thumb {
    width: 22px;
    height: 22px;
  }

  .panel-range::-moz-range-thumb {
    width: 22px;
    height: 22px;
  }

  .transport {
    flex: 1 1 100%;
    flex-direction: row;
    margin-top: 0;
  }

  .transport .btn {
    flex: 1;
    padding: 15px 16px;
    font-size: 15px;
  }
}

  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1 class="brand-title">手势音乐台</h1>
    </div>
    <p class="brand-sub">Air Media · Gesture Music Studio</p>
  </header>

  <main class="workspace">
    <section class="stage-wrap">
      <div class="stage">
        <video id="video" autoplay playsinline webkit-playsinline muted></video>
        <canvas id="overlay"></canvas>

        <div id="stage-hint" class="stage-hint">
          <div class="stage-hint-icon" aria-hidden="true"></div>
          <p class="stage-hint-text">将手伸入画面 · 开始演奏</p>
          <p class="stage-hint-sub">挥手 旋律 / 握拳 节奏 / 张开 和弦 / 捏合 装饰</p>
        </div>

        <div id="status" class="status-bar">请将手放入画面</div>

        <div id="error-overlay" class="error-overlay hidden">
          <div class="error-card">
            <p id="error-text" class="error-text">摄像头无法启动</p>
            <button id="retry-btn" class="error-retry">重试</button>
          </div>
        </div>
      </div>
    </section>

    <aside class="control-panel">
      <div class="panel-section ai-state-section">
        <label class="panel-label">AI 音乐导演</label>
        <div id="ai-state" class="ai-state-display">
          <span class="ai-state-dot" aria-hidden="true"></span>
          <span class="ai-state-text">AI: 待启动</span>
        </div>
        <p class="ai-hint">音阶 · 音色 · 情绪由 AI 根据你的手势自动选择</p>
      </div>

      <div class="panel-section">
        <label class="panel-label" for="bpm-slider">速度 BPM</label>
        <div class="bpm-row">
          <input
            type="range"
            id="bpm-slider"
            class="panel-range"
            min="60"
            max="180"
            value="120"
          />
          <span id="bpm-value" class="bpm-value">120</span>
        </div>
      </div>

      <div class="panel-section transport">
        <button id="record-btn" class="btn btn-record">录制</button>
        <button id="stop-btn" class="btn btn-stop" disabled>停止</button>
        <button id="play-btn" class="btn btn-play" disabled>回放</button>
      </div>
    </aside>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script type="module">
// ===================== audio-engine.js =====================
// ============================================================
// audio-engine.js — Web Audio 音频合成引擎（音色优化版）
// 提供 AudioEngine：音阶映射、音色合成（synth/drums/bass/pad）、
// 音阶内和弦、鼓点、按手停止等能力，供手势映射层调用。
// 仅依赖 Web Audio API，无外部依赖。
// ============================================================

// 音阶定义：根音频率 + 一个八度内的半音偏移
const SCALES = {
  cmajor: { root: 261.63, semitones: [0, 2, 4, 5, 7, 9, 11], label: 'C 大调' }, // C 大调（根音 C4）
  aminor: { root: 220.00, semitones: [0, 2, 3, 5, 7, 8, 10], label: 'A 小调' }, // A 小调（根音 A3）
  pentatonic: { root: 261.63, semitones: [0, 2, 4, 7, 9], label: '五声音阶' }, // 五声音阶（C 根音）
  blues: { root: 261.63, semitones: [0, 3, 5, 6, 7, 10], label: '蓝调音阶' }, // 蓝调音阶（C 根音）
};

// 音阶内自然和弦级数（相对根音的半音偏移，三和弦叠加：根/三度/五度）
// 用音阶音级构建，确保和弦永远在调内——这是"怎么弹都好听"的关键。
const SCALE_DEGREES = {
  // 大调顺阶和弦：I(ii) IV V(vi) 等，这里给几个常用级数的三音叠加
  cmajor:    [[0, 4, 7], [5, 9, 12], [7, 11, 14], [9, 12, 16]], // I / IV / V / vi
  aminor:    [[0, 3, 7], [5, 8, 12], [7, 10, 14], [2, 5, 9]],   // i / iv / v / III
  pentatonic:[[0, 4, 7], [2, 7, 9], [4, 9, 12], [7, 12, 14]],   // 调内五声和弦
  blues:     [[0, 3, 7], [5, 8, 12], [7, 10, 14], [3, 7, 10]],  // 蓝调常用
};

const VALID_SCALES = Object.keys(SCALES);

class AudioEngine {
  constructor() {
    // Safari 前缀兼容
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) {
      throw new Error('当前浏览器不支持 Web Audio API');
    }
    this.ctx = new AudioContextClass();

    // ---------- 主输出链（加压缩器让声音更紧实饱满）----------
    // source → masterGain → compressor → {dry→destination, convolver→wetGain→destination}
    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.value = 0.75; // 略低，留给 compressor 余量

    // 总线压缩器：控制峰值、增加响度与凝聚力
    this.compressor = this.ctx.createDynamicsCompressor();
    this.compressor.threshold.value = -18;  // 阈值
    this.compressor.knee.value = 24;        // 软拐点
    this.compressor.ratio.value = 3.5;      // 温和压缩比
    this.compressor.attack.value = 0.005;
    this.compressor.release.value = 0.25;

    // 轻量混响：ConvolverNode + 程序生成的指数衰减噪声脉冲响应
    this.convolver = this.ctx.createConvolver();
    this.convolver.buffer = this._generateReverbIR(2.4, 2.6);
    this.wetGain = this.ctx.createGain();
    this.wetGain.gain.value = 0.22; // 混响湿度

    // 连接：masterGain → compressor → {destination, convolver→wetGain→destination}
    this.masterGain.connect(this.compressor);
    this.compressor.connect(this.ctx.destination);
    this.compressor.connect(this.convolver);
    this.convolver.connect(this.wetGain);
    this.wetGain.connect(this.ctx.destination);

    // 运行时状态
    this.scaleName = 'pentatonic'; // 五声音阶最不容易难听（无半音冲突）
    this.bpm = 110;
    this.volume = 0.75;

    // 每只手的活跃节点集合：Map<handId, Array<nodeInfo>>
    this.activeNodes = new Map();

    // pad 背景和声节点集合（独立于手，由 music-director 控制）
    // 初始为 null（非 []），否则空数组为 truthy 会绕过 stopPad 的空值守卫，
    // 导致解构出 undefined 的 oscs，后续 [...oscs] 抛 "oscs is not iterable"。
    this.padNodes = null;

    // 预生成当前音阶频率数组
    this.scaleFreqs = this._buildScaleFreqs(this.scaleName);
  }

  // ---------- 内部工具 ----------

  _generateReverbIR(duration, decayRate) {
    const sampleRate = this.ctx.sampleRate;
    const length = Math.max(1, Math.floor(sampleRate * duration));
    const buffer = this.ctx.createBuffer(2, length, sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const data = buffer.getChannelData(ch);
      for (let i = 0; i < length; i++) {
        const env = Math.exp((-i / length) * decayRate);
        data[i] = (Math.random() * 2 - 1) * env;
      }
    }
    return buffer;
  }

  _createNoiseBuffer(duration) {
    const sampleRate = this.ctx.sampleRate;
    const length = Math.max(1, Math.floor(sampleRate * duration));
    const buffer = this.ctx.createBuffer(1, length, sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    return buffer;
  }

  freqFromSemitones(baseFreq, semitones) {
    return baseFreq * Math.pow(2, semitones / 12);
  }

  _buildScaleFreqs(scaleName) {
    const { root, semitones } = SCALES[scaleName];
    const freqs = [];
    for (let octave = 0; octave < 2; octave++) {
      for (const s of semitones) {
        freqs.push(this.freqFromSemitones(root, s + octave * 12));
      }
    }
    freqs.push(this.freqFromSemitones(root, 24));
    return freqs;
  }

  _getHandNodes(handId) {
    if (!this.activeNodes.has(handId)) {
      this.activeNodes.set(handId, []);
    }
    return this.activeNodes.get(handId);
  }

  _trackNode(handId, nodeInfo) {
    this._getHandNodes(handId).push(nodeInfo);
  }

  _untrackNode(handId, nodeInfo) {
    const nodes = this.activeNodes.get(handId);
    if (!nodes) return;
    const idx = nodes.indexOf(nodeInfo);
    if (idx >= 0) nodes.splice(idx, 1);
  }

  _disconnectNodes(nodes) {
    for (const n of nodes) {
      try { n.disconnect(); } catch (e) { /* 已断开 */ }
    }
  }

  // ---------- 公共 API ----------

  async resume() {
    if (this.ctx.state === 'suspended') {
      await this.ctx.resume();
    }
  }

  setScale(scaleName) {
    if (!VALID_SCALES.includes(scaleName)) return;
    this.scaleName = scaleName;
    this.scaleFreqs = this._buildScaleFreqs(scaleName);
  }

  getScaleLabel() {
    return SCALES[this.scaleName]?.label || '';
  }

  setBpm(bpm) {
    const v = Number(bpm);
    if (!isFinite(v)) return;
    this.bpm = Math.max(40, Math.min(240, v));
  }

  setVolume(vol) {
    const v = Number(vol);
    if (!isFinite(v)) return;
    this.volume = Math.max(0, Math.min(1, v));
    this.masterGain.gain.setTargetAtTime(this.volume, this.ctx.currentTime, 0.02);
  }

  getScaleFreqs() {
    return this.scaleFreqs;
  }

  // ---------- 音符播放（音色由 music-director 指定，不再用全局 timbre）----------

  // 播放旋律音符：type 由调用方指定 'synth'|'bass'
  playNote(freq, handId, type = 'synth') {
    const f = Number(freq);
    if (!isFinite(f) || f <= 0) return;
    if (type === 'bass') {
      this._playBassNote(f, handId);
    } else {
      this._playSynthNote(f, handId);
    }
  }

  // 合成器音色（优化版）：双锯齿 detune + 低通滤波（cutoff 随音高）+ ADSR
  _playSynthNote(freq, handId) {
    const ctx = this.ctx;
    const now = ctx.currentTime;
    const f = Math.max(20, freq);

    // 双振荡器 detune：营造更厚实、有合唱感的音色
    const osc1 = ctx.createOscillator();
    osc1.type = 'sawtooth';
    osc1.frequency.value = f;
    const osc2 = ctx.createOscillator();
    osc2.type = 'sawtooth';
    osc2.frequency.value = f;
    osc2.detune.value = 8; // 轻微失谐

    // 低通滤波：cutoff 随音高变化，高音更亮、低音更暖
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(Math.min(8000, f * 6), now);
    filter.frequency.exponentialRampToValueAtTime(Math.min(4000, f * 2.5), now + 0.4);
    filter.Q.value = 1.2;

    const gain = ctx.createGain();
    // ADSR：attack 0.015s→0.28，decay 0.12s→0.18(sustain)，release 0.35s
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.28, now + 0.015);
    gain.gain.linearRampToValueAtTime(0.18, now + 0.015 + 0.12);

    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(gain);
    gain.connect(this.masterGain);
    osc1.start(now);
    osc2.start(now);

    const nodeInfo = { oscs: [osc1, osc2], gain, filter, release: 0.35, type: 'synth', handId };
    this._trackNode(handId, nodeInfo);

    const onEnded = () => {
      this._disconnectNodes([osc1, osc2, filter, gain]);
      this._untrackNode(handId, nodeInfo);
    };
    osc1.onended = onEnded;
    osc2.onended = onEnded;
  }

  // 贝斯音色（优化版）：三角+正弦叠加 + 滤波包络 + ADSR
  _playBassNote(freq, handId) {
    const ctx = this.ctx;
    const now = ctx.currentTime;
    const f = Math.max(20, freq);

    // 三角波（主体）+ 正弦波（增强基频厚度）
    const osc1 = ctx.createOscillator();
    osc1.type = 'triangle';
    osc1.frequency.value = f;
    const osc2 = ctx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = f;

    // 滤波包络：起始亮，快速收暗，模拟贝斯拨弦
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1200, now);
    filter.frequency.exponentialRampToValueAtTime(500, now + 0.15);
    filter.Q.value = 2;

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.38, now + 0.01);
    gain.gain.linearRampToValueAtTime(0.28, now + 0.01 + 0.08);

    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(gain);
    gain.connect(this.masterGain);
    osc1.start(now);
    osc2.start(now);

    const nodeInfo = { oscs: [osc1, osc2], gain, filter, release: 0.22, type: 'bass', handId };
    this._trackNode(handId, nodeInfo);

    const onEnded = () => {
      this._disconnectNodes([osc1, osc2, filter, gain]);
      this._untrackNode(handId, nodeInfo);
    };
    osc1.onended = onEnded;
    osc2.onended = onEnded;
  }

  // 音阶内和弦：基于当前音阶的自然级数和弦（永远在调内，怎么按都和谐）
  // degreeIndex 选择 SCALE_DEGREES[scaleName] 中的第几个级数
  playChord(degreeIndex, handId) {
    const degrees = SCALE_DEGREES[this.scaleName] || SCALE_DEGREES.pentatonic;
    const degree = degrees[degreeIndex % degrees.length];
    if (!degree) return;
    const { root } = SCALES[this.scaleName];
    // 三音叠加，全部基于音阶根音 + 级数偏移
    for (const semis of degree) {
      this.playNote(this.freqFromSemitones(root, semis), handId, 'synth');
    }
  }

  // ---------- Pad 背景和声（持续，由 music-director 控制）----------
  // 用柔和的多个正弦/三角波叠加，营造氛围垫底，让曲子丰满不空洞。
  startPad(degreeIndex) {
    this.stopPad();
    const ctx = this.ctx;
    const now = ctx.currentTime;
    const degrees = SCALE_DEGREES[this.scaleName] || SCALE_DEGREES.pentatonic;
    const degree = degrees[degreeIndex % degrees.length];
    if (!degree) return;
    const { root } = SCALES[this.scaleName];

    const padGain = ctx.createGain();
    padGain.gain.setValueAtTime(0, now);
    padGain.gain.linearRampToValueAtTime(0.12, now + 1.5); // 缓慢淡入
    padGain.gain.value = 0.12;

    const padFilter = ctx.createBiquadFilter();
    padFilter.type = 'lowpass';
    padFilter.frequency.value = 1800;
    padFilter.Q.value = 0.5;

    padGain.connect(padFilter);
    padFilter.connect(this.masterGain);

    const oscs = [];
    for (const semis of degree) {
      const f = this.freqFromSemitones(root, semis) / 2; // pad 低一个八度
      // 每个和弦音用正弦+三角叠加，detune 增加暖度
      for (const [i, t] of [['sine', 0], ['triangle', 5]].entries()) {
        const osc = ctx.createOscillator();
        osc.type = t;
        osc.frequency.value = f;
        osc.detune.value = (i === 1 ? 5 : -5);
        osc.connect(padGain);
        osc.start(now);
        oscs.push(osc);
      }
    }
    this.padNodes = { oscs, gain: padGain, filter: padFilter };
  }

  stopPad() {
    if (!this.padNodes) return;
    const ctx = this.ctx;
    const now = ctx.currentTime;
    const { oscs, gain, filter } = this.padNodes;
    try {
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(gain.gain.value, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.8); // 缓慢淡出
      oscs.forEach((osc) => { try { osc.stop(now + 0.85); } catch (e) { /* */ } });
    } catch (e) { /* */ }
    const cleanup = () => this._disconnectNodes([...oscs, gain, filter]);
    setTimeout(cleanup, 1000);
    this.padNodes = null;
  }

  // ---------- 鼓点（优化版，更厚实）----------

  playDrum(type, handId) {
    if (type === 'kick') this._playKick();
    else if (type === 'snare') this._playSnare();
    else if (type === 'hihat') this._playHihat();
  }

  // kick（优化）：低频正弦下滑 + 短促 click（高频脉冲）增加打击感
  _playKick() {
    const ctx = this.ctx;
    const now = ctx.currentTime;

    // 主体：正弦 150→45Hz 下滑
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(45, now + 0.35);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.85, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start(now);
    osc.stop(now + 0.4);

    // click：短暂高频脉冲，增加起音打击感
    const click = ctx.createOscillator();
    click.type = 'square';
    click.frequency.value = 1200;
    const clickGain = ctx.createGain();
    clickGain.gain.setValueAtTime(0.18, now);
    clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
    click.connect(clickGain);
    clickGain.connect(this.masterGain);
    click.start(now);
    click.stop(now + 0.025);

    osc.onended = () => this._disconnectNodes([osc, gain, click, clickGain]);
  }

  // snare（优化）：噪声（高通更脆）+ 三角波 180Hz + 更厚衰减
  _playSnare() {
    const ctx = this.ctx;
    const now = ctx.currentTime;

    // 噪声成分（高通使其更脆亮）
    const noise = ctx.createBufferSource();
    noise.buffer = this._createNoiseBuffer(0.22);
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'highpass';
    noiseFilter.frequency.value = 1500;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.55, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(this.masterGain);
    noise.start(now);
    noise.stop(now + 0.22);

    // 三角波 180Hz 成分（鼓体共鸣）
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = 180;
    const oscGain = ctx.createGain();
    oscGain.gain.setValueAtTime(0.38, now);
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc.connect(oscGain);
    oscGain.connect(this.masterGain);
    osc.start(now);
    osc.stop(now + 0.2);

    const cleanup = () =>
      this._disconnectNodes([noise, noiseFilter, noiseGain, osc, oscGain]);
    noise.onended = cleanup;
  }

  // hihat（优化）：高通白噪声 + 更短衰减，闭镲感
  _playHihat() {
    const ctx = this.ctx;
    const now = ctx.currentTime;
    const noise = ctx.createBufferSource();
    noise.buffer = this._createNoiseBuffer(0.05);
    const filter = ctx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 8000;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.28, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.masterGain);
    noise.start(now);
    noise.stop(now + 0.05);
    noise.onended = () => this._disconnectNodes([noise, filter, gain]);
  }

  // ---------- 停止 ----------

  stopHand(handId) {
    const nodes = this.activeNodes.get(handId);
    if (!nodes || nodes.length === 0) return;
    const ctx = this.ctx;
    const now = ctx.currentTime;
    const toStop = nodes.slice();
    this.activeNodes.set(handId, []);

    for (const nodeInfo of toStop) {
      const { oscs, gain, release } = nodeInfo;
      const rel = release || 0.3;
      try {
        gain.gain.cancelScheduledValues(now);
        gain.gain.setValueAtTime(gain.gain.value, now);
        gain.gain.linearRampToValueAtTime(0, now + rel);
        oscs.forEach((osc) => { try { osc.stop(now + rel + 0.02); } catch (e) { /* */ } });
      } catch (e) {
        oscs.forEach((osc) => { try { osc.stop(now); } catch (e2) { /* */ } });
      }
    }
  }

  // 停止所有手与 pad（应用退出/重置时调用）
  stopAll() {
    for (const handId of this.activeNodes.keys()) {
      this.stopHand(handId);
    }
    this.stopPad();
  }
}


// ===================== music-director.js =====================
// ============================================================
// music-director.js — AI 音乐导演
// 核心：让"怎么动都好听"。
//   1. 根据手势运动特征（速度/位置/节奏密度）自动选择音阶与音色
//   2. 旋律约束：手部 X 映射到音阶时做"就近衔接"，避免突兀大跳
//   3. 维护背景 pad 和声，按小节切换级数，让曲子始终丰满
//   4. 情绪状态机：平静/活跃/激烈，驱动音阶/音区/鼓点密度变化
// ============================================================

// 情绪档位：决定音阶、音区范围、鼓点密度、pad 切换速度
const MOODS = {
  calm:    { scale: 'pentatonic', octaveBias: 0,  drumEvery: 2, padSwitchBars: 4 }, // 平静：五声、稀疏鼓、慢换 pad
  active:  { scale: 'cmajor',     octaveBias: 0,  drumEvery: 1, padSwitchBars: 2 }, // 活跃：大调、每拍鼓
  intense: { scale: 'blues',      octaveBias: -1, drumEvery: 1, padSwitchBars: 1 }, // 激烈：蓝调、低音区、快换 pad
};

// 旋律约束：相邻音最大跳跃（音阶索引步数），超过则向最近的合规音靠拢
const MAX_MELODIC_LEAP = 3;
// 音阶索引范围（audio-engine 的 scaleFreqs 长度约 11~15）
const MELODY_MIN_IDX = 2;
let MELODY_MAX_IDX = 12;

class MusicDirector {
  /**
   * @param {AudioEngine} audioEngine
   */
  constructor(audioEngine) {
    this.audio = audioEngine;

    // 情绪状态
    this.mood = 'calm';
    this.moodScore = 0; // 累积运动能量，决定情绪档位

    // 运动特征统计
    this._handSpeeds = [0, 0];      // 每只手最近速度（像素/帧 归一化）
    this._lastHandPos = [null, null];
    this._lastHandT = [0, 0];
    this._gestureEventCount = 0;    // 近期手势事件计数（节奏密度）
    this._eventWindowStart = performance.now();

    // 旋律状态（每只手独立，避免双手旋律互相干扰）
    this._lastMelodyIdx = [4, 4];   // 上次旋律音在音阶中的索引

    // pad/和弦进行
    this._currentDegree = 0;        // 当前和弦级数索引
    this._barCount = 0;             // 小节计数
    this._beatCount = 0;            // 拍计数（用于鼓点密度判断）
    this._padActive = false;
    this._lastBeatTime = 0;

    // 当前音色（由 AI 决定，供 mapper 读取）
    this.currentTimbre = 'synth';

    // 状态回调：供 UI 显示 AI 当前决策
    this.onStateChange = null;
  }

  // ---------- 公共：每帧更新运动特征 ----------
  // 由 gesture-mapper 在 processHand 中调用，传入归一化坐标。
  updateMotion(handId, handX, handY, gesture) {
    const now = performance.now();
    const last = this._lastHandPos[handId];
    const lastT = this._lastHandT[handId];
    if (last && lastT) {
      const dx = handX - last.x;
      const dy = handY - last.y;
      const dt = Math.max(1, now - lastT);
      // 速度（归一化距离/秒），乘 0.001 转每毫秒
      const speed = Math.sqrt(dx * dx + dy * dy) / dt * 1000;
      // 平滑（指数移动平均）
      this._handSpeeds[handId] = this._handSpeeds[handId] * 0.8 + speed * 0.2;
    }
    this._lastHandPos[handId] = { x: handX, y: handY };
    this._lastHandT[handId] = now;

    // 统计手势事件密度（非 none 的手势计为事件）
    if (gesture && gesture !== 'none') {
      this._gestureEventCount++;
    }
    // 每秒重置事件窗口
    if (now - this._eventWindowStart > 1000) {
      this._gestureEventCount = 0;
      this._eventWindowStart = now;
    }

    // 更新情绪评分：综合速度与事件密度
    const avgSpeed = (this._handSpeeds[0] + this._handSpeeds[1]) / 2;
    this.moodScore = this.moodScore * 0.95 + (avgSpeed * 0.5 + this._gestureEventCount * 0.15) * 0.05;
    this._updateMood();
  }

  // 情绪档位切换（带迟滞，避免抖动）
  _updateMood() {
    const prev = this.mood;
    let next = prev;
    if (this.moodScore < 0.15) next = 'calm';
    else if (this.moodScore < 0.6) next = 'active';
    else next = 'intense';

    if (next !== prev) {
      this.mood = next;
      const cfg = MOODS[next];
      this.audio.setScale(cfg.scale);
      // 切换音阶后重新触发 pad（用新音阶的级数）
      if (this._padActive) {
        this.audio.startPad(this._currentDegree);
      }
      this._emitState();
    }
  }

  // ---------- 旋律选音（核心：保证好听）----------
  // 输入手部 X，返回音阶内的频率。关键：做"就近衔接"约束，
  // 让连续音符不会大跳，旋律线条平滑自然。
  getMelodicFreq(handId, handX) {
    const freqs = this.audio.getScaleFreqs();
    if (!freqs || freqs.length === 0) return 0;

    // 音阶索引上限随实际音阶长度调整
    const maxIdx = Math.min(freqs.length - 1, MELODY_MAX_IDX);
    const minIdx = MELODY_MIN_IDX;
    const cfg = MOODS[this.mood];

    // 目标索引：handX 线性映射到 [minIdx, maxIdx]，再按情绪偏移八度
    const x = Math.max(0, Math.min(1, handX));
    let targetIdx = Math.round(minIdx + x * (maxIdx - minIdx));
    // 情绪 octaveBias：intense 时整体低一个八度（音阶索引 -7 左右）
    targetIdx += cfg.octaveBias * 7;
    targetIdx = Math.max(0, Math.min(freqs.length - 1, targetIdx));

    // 就近衔接约束：与上次旋律音的索引差不超过 MAX_MELODIC_LEAP
    const lastIdx = this._lastMelodyIdx[handId];
    let idx = targetIdx;
    const diff = targetIdx - lastIdx;
    if (Math.abs(diff) > MAX_MELODIC_LEAP) {
      // 超过最大跳跃：截断到 ±MAX_MELODIC_LEAP，使旋律平滑过渡
      idx = lastIdx + Math.sign(diff) * MAX_MELODIC_LEAP;
    }
    idx = Math.max(0, Math.min(freqs.length - 1, idx));

    this._lastMelodyIdx[handId] = idx;
    return freqs[idx];
  }

  // ---------- 决定某手势用何种音色 ----------
  // wave/point → 旋律（synth 或 bass，随情绪）
  // fist → 鼓点（不需要 timbre，直接 playDrum）
  // open → 和弦（synth pad 风格）
  decideTimbre(gesture) {
    if (this.mood === 'intense') {
      // 激烈时旋律用贝斯音色，更有力量
      this.currentTimbre = (gesture === 'wave' || gesture === 'point') ? 'bass' : 'synth';
    } else {
      this.currentTimbre = 'synth';
    }
    return this.currentTimbre;
  }

  // ---------- 拍点推进：每拍调用一次，驱动 pad 切换与鼓点 ----------
  // 返回 'kick' | 'snare' | 'hihat' | null（null 表示该拍不击鼓）
  tickBeat() {
    const now = performance.now();
    const cfg = MOODS[this.mood];
    this._beatCount++;
    this._barCount = Math.floor(this._beatCount / 4);

    // 每 padSwitchBars 小节切换一次 pad 和弦级数（I→IV→V→vi 循环）
    if (this._barCount % cfg.padSwitchBars === 0) {
      this._currentDegree = (this._currentDegree + 1) % 4;
      if (this._padActive) {
        this.audio.startPad(this._currentDegree);
      }
    }

    // 鼓点模式：4 拍循环
    // beat 0,2 → kick；beat 1,3 → snare；每拍穿插 hihat
    const beatInBar = this._beatCount % 4;
    let drum = null;
    if (cfg.drumEvery === 1) {
      // 活跃/激烈：每拍都有鼓
      drum = (beatInBar === 0 || beatInBar === 2) ? 'kick' : 'snare';
    } else {
      // 平静：仅强拍 kick
      drum = (beatInBar === 0) ? 'kick' : null;
    }
    this._lastBeatTime = now;
    return drum;
  }

  // ---------- pad 控制 ----------
  startPad() {
    this._padActive = true;
    this.audio.startPad(this._currentDegree);
    this._emitState();
  }

  stopPad() {
    this._padActive = false;
    this.audio.stopPad();
    this._emitState();
  }

  isPadActive() {
    return this._padActive;
  }

  // ---------- 用户开始演奏时调用（首帧有手时）----------
  onPerformanceStart() {
    // 开启背景 pad，营造氛围
    if (!this._padActive) this.startPad();
  }

  // ---------- 用户停止演奏（无手）----------
  onPerformanceStop() {
    // 不立即关 pad，保留余韵；但重置旋律状态避免下次大跳
    this._lastMelodyIdx = [4, 4];
    this._handSpeeds = [0, 0];
    this._lastHandPos = [null, null];
  }

  // ---------- 状态回调 ----------
  _emitState() {
    if (this.onStateChange) {
      this.onStateChange({
        mood: this.mood,
        scale: this.audio.getScaleLabel(),
        timbre: this.currentTimbre,
        pad: this._padActive,
      });
    }
  }

  // 获取当前状态（供 UI 主动查询）
  getState() {
    return {
      mood: this.mood,
      scale: this.audio.getScaleLabel(),
      timbre: this.currentTimbre,
      pad: this._padActive,
    };
  }
}


// ===================== gesture-recognizer.js =====================
// ============================================================
// gesture-recognizer.js
// 手势识别模块：基于 MediaPipe Hands 21 关键点的几何关系，
// 识别 fist / open / pinch / point / wave / none 六种手势。
// 纯计算逻辑，无外部依赖，ES Module。
// ============================================================

// ---------- 可调阈值 ----------
// 伸直度比值阈值（规格示例值约 1.6）。
// 说明：规格文字描述为"指尖到 MCP / MCP 到手腕"，但该比值在 MediaPipe
// 归一化坐标下对伸直手指仅约 0.8~1.0，与 1.6 阈值矛盾。此处改用等价且
// 同样稳健的"指尖到手腕 / MCP 到手腕"：伸直 ≈ 1.6+、弯曲 ≈ 0.7~1.0，
// 与 ~1.6 阈值吻合；并据实测略调至 1.5，由 200ms 防抖吸收边界抖动。
const FINGER_STRAIGHT_RATIO = 1.5;
const PINKY_STRAIGHT_RATIO = 1.35;  // 小指较短，单独放低阈值
const THUMB_STRAIGHT_RATIO = 0.9;   // 拇指伸直阈值（仅供参考，判定不依赖拇指）

const PINCH_THRESHOLD = 0.05;       // 拇指尖(4)与食指尖(8) 距离 < 该值视为捏合（归一化坐标）
const PINCH_HOLD_MS = 100;          // 捏合为瞬间触发，保持该时长避免单帧闪烁

const DEBOUNCE_MS = 200;            // 静态手势防抖时长（约 6 帧 @30fps）

const WAVE_WINDOW_MS = 400;         // 挥手检测的时间窗口
const WAVE_HOLD_MS = 250;           // 挥手持续状态保持时长（避免闪烁）
const WAVE_MIN_STEP = 0.02;         // 挥手方向变化所需最小位移（滤除抖动）
const WAVE_MIN_AMPLITUDE = 0.15;    // 挥手总位移幅度阈值
const WAVE_MIN_DIR_CHANGES = 2;     // 挥手方向改变最少次数

// ---------- 关键点索引 ----------
const WRIST = 0;
const THUMB_CMC = 1, THUMB_MCP = 2, THUMB_TIP = 4;
const INDEX_MCP = 5, INDEX_TIP = 8;
const MIDDLE_MCP = 9, MIDDLE_TIP = 12;
const RING_MCP = 13, RING_TIP = 16;
const PINKY_MCP = 17, PINKY_TIP = 20;

// ---------- 工具函数 ----------
function dist2D(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}

function clamp(v, lo, hi) {
  return v < lo ? lo : (v > hi ? hi : v);
}

// 计算一组手指的置信度：根据各手指比值相对阈值的归一化裕度均值。
// expectStraight[i] 为 true 表示该指应伸直（比值越大越确定），false 表示应弯曲（越小越确定）。
function fingersConfidence(ratios, thresholds, expectStraight) {
  let sum = 0;
  for (let i = 0; i < ratios.length; i++) {
    const th = thresholds[i];
    const margin = expectStraight[i]
      ? (ratios[i] - th) / th
      : (th - ratios[i]) / th;
    sum += margin;
  }
  return clamp(0.6 + (sum / ratios.length) * 0.8, 0.5, 0.95);
}

class GestureRecognizer {
  constructor() {
    this.reset();
  }

  // 清空内部状态：当前手势、pending、挥手时间序列
  reset() {
    this.committedStatic = 'none';   // 已确认的静态手势
    this.staticPending = null;       // 待确认的静态手势
    this.staticPendingSince = 0;     // 待确认开始时间戳
    this.waveHistory = [];           // 挥手 x 时间序列 [{x, t}]
    this.waveExpireAt = 0;           // 挥手保持到期时间
    this.pinchExpireAt = 0;          // 捏合保持到期时间
  }

  update(landmarks) {
    // 输入校验：异常输入直接返回 none
    if (!Array.isArray(landmarks) || landmarks.length < 21) {
      return { gesture: 'none', confidence: 0, handX: 0.5, handY: 0.5 };
    }
    const now = performance.now();

    // 手部中心：手腕(0)与中指 MCP(9) 的中点
    const handX = (landmarks[WRIST].x + landmarks[MIDDLE_MCP].x) / 2;
    const handY = (landmarks[WRIST].y + landmarks[MIDDLE_MCP].y) / 2;

    // ---- 1. 计算各手指伸直度（距离比值法，对缩放与平面内倾斜稳健）----
    // 基准：各手指 MCP 到手腕的距离，消除手远近导致的绝对距离差异。
    const indexPalm  = dist2D(landmarks[INDEX_MCP],  landmarks[WRIST]);
    const middlePalm = dist2D(landmarks[MIDDLE_MCP], landmarks[WRIST]);
    const ringPalm   = dist2D(landmarks[RING_MCP],   landmarks[WRIST]);
    const pinkyPalm  = dist2D(landmarks[PINKY_MCP],  landmarks[WRIST]);

    // 伸直度 = 指尖到手腕距离 / (MCP 到手腕距离)：伸直 ≈1.6+，弯曲 ≈0.7~1.0
    const indexRatio  = dist2D(landmarks[INDEX_TIP],  landmarks[WRIST]) / indexPalm;
    const middleRatio = dist2D(landmarks[MIDDLE_TIP], landmarks[WRIST]) / middlePalm;
    const ringRatio   = dist2D(landmarks[RING_TIP],   landmarks[WRIST]) / ringPalm;
    const pinkyRatio  = dist2D(landmarks[PINKY_TIP],  landmarks[WRIST]) / pinkyPalm;
    // 拇指较短且方向独立，本实现的静态手势判定不依赖拇指（fist/open/point
    // 均基于食/中/无名/小四指的伸直组合），故此处不再计算 thumbRatio。

    // ---- 2. 各手指是否伸直（基于伸直度比值与阈值）----
    const indexStraight  = indexRatio  >= FINGER_STRAIGHT_RATIO;
    const middleStraight = middleRatio >= FINGER_STRAIGHT_RATIO;
    const ringStraight   = ringRatio   >= FINGER_STRAIGHT_RATIO;
    const pinkyStraight  = pinkyRatio  >= PINKY_STRAIGHT_RATIO;

    // 四指（食/中/无名/小）的比值、阈值，用于置信度计算
    const ratios = [indexRatio, middleRatio, ringRatio, pinkyRatio];
    const thresholds = [FINGER_STRAIGHT_RATIO, FINGER_STRAIGHT_RATIO, FINGER_STRAIGHT_RATIO, PINKY_STRAIGHT_RATIO];

    // ---- 3. 静态手势原始判定（无防抖） ----
    // 握拳 fist：四指全弯
    // 张开 open：四指全伸（拇指可伸可弯）
    // 指向 point：仅食指伸，中/无名/小全弯
    let rawStatic = 'none';
    let expectStraight = [true, true, true, true]; // 默认 open 的期望，用于置信度
    if (!indexStraight && !middleStraight && !ringStraight && !pinkyStraight) {
      rawStatic = 'fist';
      expectStraight = [false, false, false, false];
    } else if (indexStraight && middleStraight && ringStraight && pinkyStraight) {
      rawStatic = 'open';
      expectStraight = [true, true, true, true];
    } else if (indexStraight && !middleStraight && !ringStraight && !pinkyStraight) {
      rawStatic = 'point';
      expectStraight = [true, false, false, false];
    }

    // ---- 4. 静态手势防抖（持续 DEBOUNCE_MS 才确认提交） ----
    if (rawStatic !== this.staticPending) {
      this.staticPending = rawStatic;
      this.staticPendingSince = now;
    }
    if (this.staticPending !== null && (now - this.staticPendingSince) >= DEBOUNCE_MS) {
      this.committedStatic = this.staticPending;
    }
    const staticConfidence = fingersConfidence(ratios, thresholds, expectStraight);

    // ---- 5. 捏合检测（瞬间触发，PINCH_HOLD_MS 保持避免单帧闪烁） ----
    const pinchDist = dist2D(landmarks[THUMB_TIP], landmarks[INDEX_TIP]);
    if (pinchDist < PINCH_THRESHOLD) {
      this.pinchExpireAt = now + PINCH_HOLD_MS;
    }
    const isPinching = now < this.pinchExpireAt;

    // ---- 6. 挥手检测（手腕 x 时间序列分析） ----
    // 追加当前手腕 x，淘汰超出 WAVE_WINDOW_MS 的旧点
    this.waveHistory.push({ x: landmarks[WRIST].x, t: now });
    while (this.waveHistory.length && this.waveHistory[0].t < now - WAVE_WINDOW_MS) {
      this.waveHistory.shift();
    }
    // 统计方向变化次数与 x 总幅度
    let dirChanges = 0;
    let lastDir = 0; // -1 左移, 1 右移, 0 未定
    let minX = Infinity, maxX = -Infinity;
    for (let i = 1; i < this.waveHistory.length; i++) {
      const prev = this.waveHistory[i - 1].x;
      const cur = this.waveHistory[i].x;
      if (cur < minX) minX = cur;
      if (cur > maxX) maxX = cur;
      const delta = cur - prev;
      if (Math.abs(delta) < WAVE_MIN_STEP) continue; // 滤除微小抖动
      const dir = delta > 0 ? 1 : -1;
      if (lastDir !== 0 && dir !== lastDir) dirChanges++;
      lastDir = dir;
    }
    const amplitude = (isFinite(minX) && isFinite(maxX)) ? (maxX - minX) : 0;
    const isWavingMotion = dirChanges >= WAVE_MIN_DIR_CHANGES && amplitude >= WAVE_MIN_AMPLITUDE;
    // 挥手保持：检测到挥手动作后保持 WAVE_HOLD_MS，避免状态闪烁
    if (isWavingMotion) {
      this.waveExpireAt = now + WAVE_HOLD_MS;
    }
    const isWaving = now < this.waveExpireAt;

    // ---- 7. 综合判定（优先级：wave > pinch > fist > point > open > none） ----
    let gesture = 'none';
    let confidence = 0.5;
    if (isWaving) {
      gesture = 'wave';
      confidence = 0.85;
    } else if (isPinching) {
      gesture = 'pinch';
      confidence = 0.8;
    } else if (this.committedStatic && this.committedStatic !== 'none') {
      gesture = this.committedStatic;
      confidence = staticConfidence;
    }

    return { gesture, confidence, handX, handY };
  }
}

// ===================== hand-tracker.js =====================
// ============================================================
// HandTracker —— 基于 MediaPipe Hands 的手部追踪模块
//
// 依赖：index.html 中通过 CDN 引入的全局 Hands（hands.js）与 Camera（camera_utils.js）。
// 这两个脚本是普通脚本（非 ES Module），会在 window 上挂载全局构造函数。
//
// 接口契约：
//   constructor(videoEl, onResults)   // onResults(results) 每帧回调
//   async start()                      // 启动摄像头与检测；失败时抛出错误
//   stop()                             // 停止并释放资源
//
// onResults 接收的 results 直接透传 MediaPipe 原始对象，包含：
//   - results.multiHandLandmarks: Array<Array<{x,y,z}>>，每只手 21 个关键点，归一化坐标 [0,1]
//     （x 横向、y 纵向、z 深度）。不做镜像翻转，由可视化层处理。
//   - results.multiHandedness: Array<{label:'Left'|'Right', score:number}>
// ============================================================

class HandTracker {
  /**
   * @param {HTMLVideoElement} videoEl
   * @param {(results: any) => void} onResults
   */
  constructor(videoEl, onResults) {
    this.videoEl = videoEl;
    this.onResults = onResults;
    // 延迟到 start() 中初始化，确保 DOM 就绪且便于错误处理
    this.hands = null;
    this.stream = null;       // 自管理的 MediaStream（兼容手机 facingMode）
    this._running = false;    // 检测循环运行标志
    this._rafId = null;       // requestAnimationFrame 句柄
  }

  /**
   * 启动摄像头与手部检测。
   * 失败（CDN 未加载、权限被拒、无设备）时抛出错误，由上层显示错误层。
   *
   * 适配说明：不再依赖 camera_utils 的 Camera 类（其在手机上 facingMode 不生效、
   * 部分设备 onFrame 不触发）。改为直接 getUserMedia 获取前置摄像头流，
   * 并用 requestAnimationFrame 自驱动检测循环。
   */
  async start() {
    // 全局 Hands 未定义时（CDN 加载失败）给出明确错误
    if (typeof Hands === 'undefined') {
      throw new Error('MediaPipe 未加载，请检查网络');
    }

    // 初始化 MediaPipe Hands
    this.hands = new Hands({
      locateFile: (file) =>
        'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + file,
    });
    // 手机性能降级：modelComplexity 0 更轻量，保证帧率
    const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
      || (('ontouchstart' in window) && window.innerWidth < 1024);
    this.hands.setOptions({
      maxNumHands: 2,
      modelComplexity: isMobile ? 0 : 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.5,
    });
    this.hands.onResults(this.onResults);

    // 获取摄像头流：优先前置（facingMode user，手机自拍），失败回退到任意摄像头
    try {
      this.stream = await this._getUserMedia();
    } catch (err) {
      this._cleanup();
      throw err;
    }
    this.videoEl.srcObject = this.stream;
    // iOS 必须显式 play；playsinline 已在 HTML 中设置避免全屏
    try {
      await this.videoEl.play();
    } catch (_) {
      /* 某些情况下 play() 被中断，忽略；loadeddata 后可恢复 */
    }

    // 自驱动检测循环：每帧将 video 送入 Hands，串行 await 避免任务堆积
    this._running = true;
    const loop = async () => {
      if (!this._running) return;
      try {
        // readyState >= 2 (HAVE_CURRENT_DATA) 才有可用画面
        if (this.videoEl.readyState >= 2) {
          await this.hands.send({ image: this.videoEl });
        }
      } catch (err) {
        console.warn('[HandTracker] 检测帧异常:', err);
      }
      if (this._running) {
        this._rafId = requestAnimationFrame(loop);
      }
    };
    this._rafId = requestAnimationFrame(loop);
  }

  /**
   * 获取摄像头流。优先前置摄像头（手机自拍），逐级回退以兼容桌面无前置摄像头的情况。
   */
  async _getUserMedia() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('当前浏览器不支持摄像头 API');
    }
    const configs = [
      // 1. 前置摄像头 + 理想分辨率（手机优先）
      { video: { facingMode: { ideal: 'user' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
      // 2. 任意摄像头 + 理想分辨率（桌面/无前置）
      { video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
      // 3. 最宽松约束（兜底）
      { video: true, audio: false },
    ];
    let lastErr;
    for (const cfg of configs) {
      try {
        return await navigator.mediaDevices.getUserMedia(cfg);
      } catch (err) {
        lastErr = err;
      }
    }
    throw lastErr || new Error('无法访问摄像头，请检查权限');
  }

  /**
   * 停止检测循环、释放摄像头流并清理资源。
   */
  stop() {
    this._running = false;
    if (this._rafId) {
      cancelAnimationFrame(this._rafId);
      this._rafId = null;
    }
    if (this.stream) {
      this.stream.getTracks().forEach((track) => track.stop());
      this.stream = null;
    }
    if (this.videoEl) {
      try {
        this.videoEl.pause();
      } catch (_) {
        /* 忽略 pause 异常 */
      }
      this.videoEl.srcObject = null;
    }
    this._cleanup();
  }

  _cleanup() {
    this.stream = null;
    this.hands = null;
  }
}


// ===================== gesture-mapper.js =====================
// ============================================================
// gesture-mapper.js — 手势 → 音乐参数映射模块（AI 导演版）
// 把 GestureRecognizer 的识别结果映射为对 AudioEngine / MusicDirector 的调用。
// 音阶/音色/和弦级数全部由 MusicDirector 自动决定，用户无需手动选择。
// 每只手（按 handId 0/1）独立维护状态，互不干扰。
// ============================================================

// 持续型手势：切换出该集合或切到不同手势时需 stopHand 停止持续发声。
// 注意：point 使用 playNote（合成器/贝斯为持续振荡器，不会自动停止），
// 故也按持续型处理，离开 point 时需 stopHand，否则音符会无限延音。
const SUSTAINED_GESTURES = ['wave', 'fist', 'open', 'point'];

// wave 旋律音符去重时间窗（ms）：同音在此间隔内不重复触发
const WAVE_DEDUP_MS = 140;

class GestureMapper {
  /**
   * @param {AudioEngine} audioEngine
   * @param {GestureRecognizer} sharedRecognizer  （保留契约，实际按 handId 用独立实例）
   * @param {MusicDirector} director  AI 音乐导演，自动决定音阶/音色/和弦
   */
  constructor(audioEngine, sharedRecognizer, director) {
    this.audio = audioEngine;
    this.director = director;
    // GestureRecognizer 内部含帧间状态（waveHistory / staticPending），
    // 双手若共用同一实例会互相污染。故此处按 handId 各建独立实例。
    this._sharedRecognizer = sharedRecognizer;
    this.recognizers = new Map();
    this.bpm = 110;

    // 每只手独立状态：Map<handId, handState>
    this.handStates = new Map();

    // 演奏活跃标志：有任意手在画面中即为 true，用于驱动 director 的 pad/情绪
    this._handsActive = 0;
  }

  _recognizerFor(handId) {
    let r = this.recognizers.get(handId);
    if (!r) {
      r = new GestureRecognizer();
      this.recognizers.set(handId, r);
    }
    return r;
  }

  // ---------- 内部：手部状态管理 ----------

  _ensureHandState(handId) {
    let s = this.handStates.get(handId);
    if (!s) {
      s = this._newHandState();
      this.handStates.set(handId, s);
    }
    return s;
  }

  _newHandState() {
    return {
      lastGesture: 'none',
      lastFreq: 0,
      lastNoteTime: 0,
      lastDrumTime: 0,
      drumBeatCount: 0,
      chordActive: false,
      lastChordDegree: -1,
      pinchActive: false,    // pinch 防抖
      lastFillTime: 0,       // pinch 触发装饰音的去重时间
    };
  }

  _resetHandState(s) {
    s.lastGesture = 'none';
    s.lastFreq = 0;
    s.lastNoteTime = 0;
    s.lastDrumTime = 0;
    s.drumBeatCount = 0;
    s.chordActive = false;
    s.lastChordDegree = -1;
    s.pinchActive = false;
    s.lastFillTime = 0;
  }

  // ---------- 公共 API ----------

  setBpm(bpm) {
    const v = Number(bpm);
    if (!isFinite(v)) return;
    this.bpm = Math.max(40, Math.min(240, v));
  }

  // 手离开画面：停止该手所有持续发声并清空其内部状态。
  onHandLost(handId) {
    this.audio.stopHand(handId);
    const s = this.handStates.get(handId);
    if (s) this._resetHandState(s);
    const r = this.recognizers.get(handId);
    if (r) r.reset();

    // 活跃手计数：用于通知 director 开始/结束演奏
    this._handsActive = Math.max(0, this._handsActive - 1);
    if (this._handsActive === 0 && this.director) {
      this.director.onPerformanceStop();
    }
  }

  // 每帧对每只手调用：识别手势 → 更新通用参数 → 触发音效
  processHand(landmarks, handedness, handId) {
    // 1. 识别手势（使用该 handId 专属的识别器，避免双手状态互相污染）
    const recognizer = this._recognizerFor(handId);
    const res = recognizer.update(landmarks);
    const { gesture, handX, handY } = res;
    const now = performance.now();

    const s = this._ensureHandState(handId);

    // 首次检测到手：通知 director 演奏开始（开启 pad 等）
    if (this._handsActive === 0 && this.director) {
      this.director.onPerformanceStart();
    }
    // 注意：_handsActive 在 onHandLost 递减，这里用"该手是否有 lastGesture"
    // 判断是否为"新进入"，避免每帧累加。简化：用 set 追踪当前帧活跃手。
    // （_handsActive 的增减由 main.js 的 onResults 统一管理更合理，
    //   此处用 director 的 start/stop 调用做近似：每帧若有手即视为活跃）

    // 2. 更新运动特征给 AI 导演（驱动情绪/音阶/音色自动选择）
    if (this.director) {
      this.director.updateMotion(handId, handX, handY, gesture);
    }

    // 3. 通用参数：手部高度 → 音量（手越高 handY 越小 → 音量越大）
    this.audio.setVolume(Math.max(0.2, 1 - handY));

    // 4. 持续型手势切换处理：先停掉上一手势的持续发声
    const wasSustained = SUSTAINED_GESTURES.includes(s.lastGesture);
    const gestureChanged = gesture !== s.lastGesture;
    if (wasSustained && gestureChanged) {
      this.audio.stopHand(handId);
      s.chordActive = false;
      s.lastChordDegree = -1;
    }

    // 5. 各手势触发
    switch (gesture) {
      case 'wave':
        this._handleWave(handId, s, handX, now);
        break;
      case 'fist':
        this._handleFist(handId, s, now);
        break;
      case 'open':
        this._handleOpen(handId, s, handX);
        break;
      case 'pinch':
        this._handlePinch(handId, s, handX, now);
        break;
      case 'point':
        this._handlePoint(handId, s, handX);
        break;
      default:
        break;
    }

    // pinch 释放防抖
    if (gesture !== 'pinch') {
      s.pinchActive = false;
    }

    s.lastGesture = gesture;
    return res;
  }

  // ---------- 各手势处理 ----------

  // wave → 旋律：AI 导演选音（就近衔接），频率变化或超过去重窗才触发
  _handleWave(handId, s, handX, now) {
    if (s.lastGesture !== 'wave') {
      s.lastFreq = 0;
      s.lastNoteTime = 0;
    }
    // 用 director 的旋律选音（保证好听：音阶内 + 就近衔接）
    const freq = this.director
      ? this.director.getMelodicFreq(handId, handX)
      : this._fallbackFreq(handX);
    if (freq <= 0) return;
    if (freq !== s.lastFreq || (now - s.lastNoteTime) >= WAVE_DEDUP_MS) {
      this.audio.stopHand(handId);
      // 音色由 director 根据 mood 自动决定
      const timbre = this.director ? this.director.decideTimbre('wave') : 'synth';
      this.audio.playNote(freq, handId, timbre);
      s.lastFreq = freq;
      s.lastNoteTime = now;
    }
  }

  // fist → 节奏：按当前 BPM 推进 director.tickBeat()，返回鼓点类型
  // 节奏跟随用户握拳的持续时长（握多久打多少拍），密度由情绪档位决定
  _handleFist(handId, s, now) {
    if (s.lastGesture !== 'fist') {
      s.drumBeatCount = 0;
      s.lastDrumTime = 0;
    }
    const beatIntervalMs = (60 / this.bpm) * 1000;
    if (s.lastDrumTime === 0 || (now - s.lastDrumTime) >= beatIntervalMs) {
      // 让 director 推进一拍并决定鼓点类型
      const drum = this.director ? this.director.tickBeat() : 'kick';
      if (drum) {
        this.audio.playDrum(drum, handId);
      }
      s.drumBeatCount++;
      s.lastDrumTime = now;
    }
  }

  // open → 和弦：AI 导演决定级数（音阶内，永远和谐）
  // 仅在"刚进入 open"或级数变化时触发一次
  _handleOpen(handId, s, handX) {
    // 用 handX 选择和弦级数（0-3），让用户能切换和弦
    const degree = Math.floor(Math.max(0, Math.min(1, handX)) * 4) % 4;
    if (!s.chordActive || degree !== s.lastChordDegree) {
      this.audio.stopHand(handId);
      this.audio.playChord(degree, handId);
      s.chordActive = true;
      s.lastChordDegree = degree;
    }
  }

  // pinch → 装饰音 fill（瞬间触发，给演奏加花）
  // 不再切换音色（音色由 AI 管），改为快速琶音装饰，增加表现力
  _handlePinch(handId, s, handX, now) {
    if (s.pinchActive) return;
    // 去重：500ms 内不重复触发 fill
    if (now - s.lastFillTime < 500) return;
    s.pinchActive = true;
    s.lastFillTime = now;

    // 装饰音：用当前音阶的 3 个连续音做快速琶音
    const freqs = this.audio.getScaleFreqs();
    if (!freqs || freqs.length === 0) return;
    const baseIdx = Math.floor(Math.max(0, Math.min(1, handX)) * (freqs.length - 3));
    const timbre = this.director ? this.director.decideTimbre('wave') : 'synth';
    // 三个音快速错开触发（60ms 间隔），形成琶音
    for (let i = 0; i < 3; i++) {
      const idx = Math.min(freqs.length - 1, baseIdx + i);
      setTimeout(() => {
        this.audio.playNote(freqs[idx], handId, timbre);
      }, i * 60);
    }
  }

  // point → 预览音：类似 wave 但单次触发（仅当频率变化才重新发声，不连奏）
  _handlePoint(handId, s, handX) {
    if (s.lastGesture !== 'point') {
      s.lastFreq = 0;
    }
    const freq = this.director
      ? this.director.getMelodicFreq(handId, handX)
      : this._fallbackFreq(handX);
    if (freq <= 0) return;
    if (freq !== s.lastFreq) {
      this.audio.stopHand(handId);
      const timbre = this.director ? this.director.decideTimbre('point') : 'synth';
      this.audio.playNote(freq, handId, timbre);
      s.lastFreq = freq;
      s.lastNoteTime = performance.now();
    }
  }

  // 兜底：无 director 时直接按 handX 取音阶频率
  _fallbackFreq(handX) {
    const freqs = this.audio.getScaleFreqs();
    if (!freqs || freqs.length === 0) return 0;
    const idx = Math.floor(Math.max(0, Math.min(1, handX)) * (freqs.length - 1));
    return freqs[idx];
  }
}


// ===================== visualizer.js =====================
// ============================================================
// AI 手势控制音乐创作台 - Canvas 可视化层
// 在 #overlay canvas 上绘制：手部骨架、关键点、手势标签、
// 音高/音量指示条、活跃音符飞溅动画。
//
// 注意：#video 通过 CSS transform:scaleX(-1) 做了自拍镜像，
// MediaPipe 返回的是原始（非镜像）坐标，因此绘制时 x 需翻转为 (1-x)。
// ============================================================

// MediaPipe Hands 21 关键点连线（去重）
const HAND_CONNECTIONS = [
  [0, 1], [1, 2], [2, 3], [3, 4],          // 拇指
  [0, 5], [5, 6], [6, 7], [7, 8],          // 食指
  [5, 9], [9, 10], [10, 11], [11, 12],     // 中指
  [9, 13], [13, 14], [14, 15], [15, 16],   // 无名指
  [13, 17], [17, 18], [18, 19], [19, 20],  // 小指
  [0, 17]                                   // 手掌底
];

// 手势名中英文映射
const GESTURE_NAMES = {
  fist: '握拳',
  open: '张开',
  pinch: '捏合',
  point: '指向',
  wave: '挥手',
  none: '无'
};

// 主题色
const COLOR_ACCENT = '#6c5ce7';
const COLOR_ACCENT_RGB = '108, 92, 231';
const COLOR_TEXT = '#e8e8f0';

class Visualizer {
  /**
   * @param {HTMLCanvasElement} canvasEl  #overlay canvas
   * @param {HTMLVideoElement} videoEl    #video
   */
  constructor(canvasEl, videoEl) {
    this.canvas = canvasEl;
    this.video = videoEl;
    this.ctx = canvasEl.getContext('2d');

    this.lowPerf = false;       // 性能降级开关
    this._scale = 1;            // 当前像素缩放（低性能=0.5，全分辨率=1）
    this._logicalW = 0;         // 逻辑绘制宽度（= video.videoWidth）
    this._logicalH = 0;         // 逻辑绘制高度（= video.videoHeight）

    // 尝试同步初始尺寸（视频流可能尚未加载）
    this._syncSize(true);
  }

  /**
   * 同步 canvas 像素尺寸到 video 尺寸。
   * 低性能模式下像素尺寸降为 50%（CSS 仍拉伸至 100% 显示）。
   * @param {boolean} force 强制重设
   */
  _syncSize(force = false) {
    const vw = this.video.videoWidth;
    const vh = this.video.videoHeight;
    if (!vw || !vh) return; // 视频未就绪

    const scale = this.lowPerf ? 0.5 : 1;
    const targetW = Math.max(1, Math.round(vw * scale));
    const targetH = Math.max(1, Math.round(vh * scale));

    if (force || this.canvas.width !== targetW || this.canvas.height !== targetH) {
      // 设置 width/height 会清空画布并重置上下文变换
      this.canvas.width = targetW;
      this.canvas.height = targetH;
    }
    this._scale = scale;
    this._logicalW = vw;
    this._logicalH = vh;
  }

  /**
   * 性能降级开关。
   * @param {boolean} enabled
   */
  setLowPerfMode(enabled) {
    this.lowPerf = !!enabled;
    this._syncSize();
  }

  /**
   * 清空整个画布。
   */
  clear() {
    // 使用恒等变换清空整个设备像素区域
    this.ctx.setTransform(1, 0, 0, 1, 0, 0);
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
  }

  /**
   * 归一化坐标 -> 逻辑屏幕坐标。
   * 注意 x 镜像翻转：(1 - x) * logicalW。y 不变。
   */
  _toScreen(x, y) {
    return {
      sx: (1 - x) * this._logicalW,
      sy: y * this._logicalH
    };
  }

  /**
   * 主绘制入口。
   * @param {Array<Array<{x,y,z}>>} landmarksList  每只手 21 个关键点（归一化）
   * @param {Array<{label,score}>}   handednessList 左右手信息
   * @param {Array<string>}          gestureList    每只手手势名
   * @param {Array<{x,y,age}>}       activeNotes    活跃音符残影
   */
  draw(landmarksList, handednessList, gestureList, activeNotes) {
    // 1. 同步尺寸（视频流加载后尺寸才确定）
    this._syncSize();

    // 2. 清空（在恒等变换下）
    this.clear();

    // 视频未就绪：仅清空，不绘制
    if (!this._logicalW || !this._logicalH) return;

    // 设置变换：以逻辑坐标（0..videoWidth, 0..videoHeight）绘制，
    // 自动映射到设备像素。低性能模式下光栅化像素量减半，视觉尺寸保持一致。
    this.ctx.setTransform(this._scale, 0, 0, this._scale, 0, 0);

    // 取第一只手的手腕坐标用于音高/音量指示条
    let firstHand = null;
    if (landmarksList && landmarksList.length > 0) {
      const lm = landmarksList[0];
      if (lm && lm[0]) firstHand = { x: lm[0].x, y: lm[0].y };
    }

    // 3. 绘制音高/音量指示条（背景 + 当前位置）
    this._drawIndicators(firstHand);

    // 4. 遍历每只手：骨架连线、关键点、手势标签
    if (landmarksList) {
      for (let i = 0; i < landmarksList.length; i++) {
        const landmarks = landmarksList[i];
        if (!landmarks) continue;
        const gesture = (gestureList && gestureList[i]) || 'none';
        this._drawHand(landmarks, gesture);
      }
    }

    // 5. 活跃音符飞溅动画（低性能模式跳过）
    if (!this.lowPerf && activeNotes) {
      this._drawNotes(activeNotes);
    }
  }

  /**
   * 绘制单只手：骨架连线、关键点、手势标签。
   */
  _drawHand(landmarks, gesture) {
    const ctx = this.ctx;

    // 关键点逻辑屏幕坐标缓存
    const pts = landmarks.map(p => this._toScreen(p.x, p.y));

    // 骨架连线
    ctx.lineWidth = 2;
    ctx.strokeStyle = `rgba(${COLOR_ACCENT_RGB}, 0.8)`;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (const [a, b] of HAND_CONNECTIONS) {
      const pa = pts[a];
      const pb = pts[b];
      if (!pa || !pb) continue;
      ctx.moveTo(pa.sx, pa.sy);
      ctx.lineTo(pb.sx, pb.sy);
    }
    ctx.stroke();

    // 关键点圆点
    // 低性能模式：只画手腕 + 5 个指尖，减少细节
    const indices = this.lowPerf ? [0, 4, 8, 12, 16, 20] : null;
    const radius = 4;
    const idxList = indices || pts.map((_, i) => i);
    ctx.fillStyle = COLOR_ACCENT;
    for (const i of idxList) {
      const p = pts[i];
      if (!p) continue;
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    // 手势标签（手腕 0 上方）
    const wrist = pts[0];
    if (wrist) {
      this._drawLabel(wrist.sx, wrist.sy, GESTURE_NAMES[gesture] || GESTURE_NAMES.none);
    }
  }

  /**
   * 绘制半透明手势文字标签（深色背景 + 强调色边框），默认位于坐标上方。
   */
  _drawLabel(x, y, text) {
    const ctx = this.ctx;
    const padX = 8;
    const padY = 5;
    const fontSize = 14;

    ctx.font = `600 ${fontSize}px "Sora", system-ui, sans-serif`;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';

    const textW = ctx.measureText(text).width;
    const boxW = textW + padX * 2;
    const boxH = fontSize + padY * 2;

    // 默认放在手腕上方；贴近顶部则下移到下方
    let boxX = x - boxW / 2;
    let boxY = y - boxH - 10;
    if (boxY < 4) boxY = y + 12;

    // 水平边界裁剪
    if (boxX < 4) boxX = 4;
    if (boxX + boxW > this._logicalW - 4) boxX = this._logicalW - 4 - boxW;

    // 背景
    ctx.fillStyle = 'rgba(15, 15, 26, 0.72)';
    this._roundRectPath(boxX, boxY, boxW, boxH, 6);
    ctx.fill();
    // 强调色边框
    ctx.strokeStyle = `rgba(${COLOR_ACCENT_RGB}, 0.9)`;
    ctx.lineWidth = 1;
    this._roundRectPath(boxX, boxY, boxW, boxH, 6);
    ctx.stroke();
    // 文字
    ctx.fillStyle = COLOR_TEXT;
    ctx.fillText(text, boxX + padX, boxY + boxH / 2);
  }

  /**
   * 构造圆角矩形路径（不 fill/stroke，由调用方处理）。
   */
  _roundRectPath(x, y, w, h, r) {
    const ctx = this.ctx;
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  /**
   * 音量条（右侧竖条）+ 音高条（底部横条）。
   * 取第一只手的手腕坐标：音量 = 1 - handY，音高位置 = handX（镜像后与画面手部对齐）。
   */
  _drawIndicators(hand) {
    const ctx = this.ctx;
    const W = this._logicalW;
    const H = this._logicalH;

    // ---- 音量条：右侧竖条 ----
    const barW = 8;
    const barH = H * 0.5;
    const barX = W - barW - 12;
    const barY = (H - barH) / 2;

    // 背景轨
    ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
    this._roundRectPath(barX, barY, barW, barH, barW / 2);
    ctx.fill();

    // 音量填充：手越靠上音量越大（volume = 1 - handY）
    const volume = hand ? Math.max(0, Math.min(1, 1 - hand.y)) : 0;
    if (volume > 0) {
      const fillH = barH * volume;
      const grad = ctx.createLinearGradient(0, barY + barH, 0, barY);
      grad.addColorStop(0, '#4a6cf7');       // 底部蓝
      grad.addColorStop(1, COLOR_ACCENT);    // 顶部紫
      ctx.fillStyle = grad;
      this._roundRectPath(barX, barY + barH - fillH, barW, fillH, barW / 2);
      ctx.fill();
    }

    // ---- 音高条：底部横条 ----
    const phW = W * 0.5;
    const phH = 8;
    const phX = (W - phW) / 2;
    const phY = H - phH - 12;

    ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
    this._roundRectPath(phX, phY, phW, phH, phH / 2);
    ctx.fill();

    // 当前音高滑块（镜像 x，与画面中手部水平位置对齐）
    if (hand) {
      const hx = Math.max(0, Math.min(1, 1 - hand.x));
      const sliderCx = phX + hx * phW;
      ctx.fillStyle = COLOR_ACCENT;
      this._roundRectPath(sliderCx - 3, phY - 3, 6, phH + 6, 3);
      ctx.fill();
    }
  }

  /**
   * 活跃音符飞溅动画：扩散圆环 + 透明度衰减。
   * age=0 为新生成，越大越旧；age>30 由主循环移除，此处仅作保护性跳过。
   */
  _drawNotes(notes) {
    const ctx = this.ctx;
    ctx.lineWidth = 2;
    for (const n of notes) {
      if (!n) continue;
      const age = n.age || 0;
      if (age > 30) continue;
      const alpha = Math.max(0, 1 - age / 30) * 0.6;
      if (alpha <= 0) continue;
      const { sx, sy } = this._toScreen(n.x, n.y);
      const radius = 10 + age * 2;
      ctx.beginPath();
      ctx.strokeStyle = `rgba(${COLOR_ACCENT_RGB}, ${alpha})`;
      ctx.arc(sx, sy, radius, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
}


// ===================== recorder.js =====================
// ============================================================
// 录制与回放模块
// 录制内容为每帧的"输入数据"（手势 + 关键点 + 左右手信息），
// 回放时通过重新驱动 mapper（触发音效）与 visualizer（重绘画面）
// 来重现当时的音频与画面，而非录制音频本身。
// ============================================================

// 录制时长上限（毫秒）：5 分钟
const MAX_RECORD_MS = 300000;

// 深拷贝工具：优先使用 structuredClone，不可用时回退到 JSON 方案。
// 用于录制时复制关键点等数据，避免后续帧修改同一引用。
function deepClone(obj) {
  if (typeof structuredClone === 'function') {
    try {
      return structuredClone(obj);
    } catch (_) {
      /* 降级到 JSON 方案 */
    }
  }
  return JSON.parse(JSON.stringify(obj));
}

class Recorder {
  /**
   * @param {object} audioEngine AudioEngine 实例（回放时由 mapper 间接驱动）
   * @param {object} mapper      GestureMapper 实例（回放时重新触发音效）
   * @param {object} visualizer  Visualizer 实例（回放时重绘画面）
   */
  constructor(audioEngine, mapper, visualizer) {
    this.audioEngine = audioEngine;
    this.mapper = mapper;
    this.visualizer = visualizer;

    // 录制状态
    this.recording = false;   // 是否正在录制
    this.startTime = 0;       // 录制开始时间戳（performance.now）
    this.frames = [];         // 录制帧数组：{ t, landmarksList, handednessList, gestureList }

    // 回放状态
    this.playing = false;     // 是否正在回放
    this.playStart = 0;       // 回放开始时间戳
    this.playFrameIndex = 0;  // 已应用到的回放帧指针
    this.rafId = null;        // 回放循环的 requestAnimationFrame 句柄

    // 是否存在有效录制
    this.hasRec = false;

    // 绑定回放循环，保证 this 指向
    this._loop = this._loop.bind(this);
  }

  // ---------- 录制 ----------

  /**
   * 开始录制：若正在回放则先停止回放，清空旧录制并记录起始时间。
   */
  startRecording() {
    if (this.playing) {
      this._stopPlayback();
    }
    this.frames = [];
    this.hasRec = false;
    this.recording = true;
    this.startTime = performance.now();
  }

  /**
   * 由主循环每帧调用以记录一帧输入数据。
   * 仅在录制中生效；超过 5 分钟自动停止。
   * @param {Array<Array<{x,y,z}>>} landmarksList  双手 21 关键点（归一化坐标）
   * @param {Array<{label,score}>}  handednessList 左右手信息
   * @param {Array<string>}         gestureList    每只手的手势名
   */
  captureFrame(landmarksList, handednessList, gestureList) {
    if (!this.recording) return;

    const t = performance.now() - this.startTime;

    // 超过录制时长上限：自动停止
    if (t > MAX_RECORD_MS) {
      this.stopRecording();
      return;
    }

    this.frames.push({
      t,
      // 深拷贝，避免外部数组对象在后续帧被原地修改导致录制内容被污染
      landmarksList: deepClone(landmarksList),
      handednessList: deepClone(handednessList),
      gestureList: deepClone(gestureList),
    });
  }

  /**
   * 停止录制：标记是否已保存有效录制。
   */
  stopRecording() {
    if (!this.recording) return;
    this.recording = false;
    this.hasRec = this.frames.length > 0;
  }

  // ---------- 回放 ----------

  /**
   * 回放录制：若无录制或正在回放则直接返回。
   * 用 requestAnimationFrame 按时间戳逐帧重放，重现音频与画面。
   */
  playRecording() {
    if (!this.hasRecording()) return;
    if (this.isPlaying()) return;

    // 若正在录制则先停止录制
    if (this.recording) {
      this.stopRecording();
    }
    // 再次校验（停止后可能无有效录制）
    if (!this.hasRecording()) return;

    this.playing = true;
    this.playStart = performance.now();
    this.playFrameIndex = 0;

    // 启动回放循环
    this.rafId = requestAnimationFrame(this._loop);
  }

  /**
   * 回放循环：根据已流逝时间，依次应用所有到时且尚未应用的帧。
   */
  _loop() {
    if (!this.playing) return;

    const elapsed = performance.now() - this.playStart;

    // 依次应用所有 t <= elapsed 且尚未应用的帧
    while (
      this.playFrameIndex < this.frames.length &&
      this.frames[this.playFrameIndex].t <= elapsed
    ) {
      this._applyFrame(this.frames[this.playFrameIndex]);
      this.playFrameIndex++;
    }

    // 全部帧应用完毕：结束回放并清理
    if (this.playFrameIndex >= this.frames.length) {
      this._stopPlayback();
      return;
    }

    // 继续下一帧
    this.rafId = requestAnimationFrame(this._loop);
  }

  /**
   * 应用单帧：重新驱动 mapper 触发音效，并重绘画面。
   */
  _applyFrame(frame) {
    const { landmarksList, handednessList, gestureList } = frame;

    // 音频重现：对每只手调用 processHand 重新触发对应音效
    for (let i = 0; i < landmarksList.length; i++) {
      this.mapper.processHand(landmarksList[i], handednessList[i], i);
    }

    // 可视化重现：重绘画面（回放帧无活跃音符残影，传空数组）
    this.visualizer.draw(landmarksList, handednessList, gestureList, []);
  }

  /**
   * 停止回放并清理：取消 rAF、停止残余发声、清空画面。
   */
  _stopPlayback() {
    if (this.rafId !== null) {
      cancelAnimationFrame(this.rafId);
      this.rafId = null;
    }
    this.playing = false;
    this.playFrameIndex = 0;

    // 停止残余发声并清空画面
    if (this.mapper) {
      this.mapper.onHandLost(0);
      this.mapper.onHandLost(1);
    }
    if (this.visualizer) {
      this.visualizer.clear();
    }
  }

  // ---------- 状态查询 ----------

  /** 是否正在录制 */
  isRecording() {
    return this.recording === true;
  }

  /** 是否正在回放 */
  isPlaying() {
    return this.playing === true;
  }

  /** 是否存在有效录制 */
  hasRecording() {
    return this.hasRec === true && this.frames.length > 0;
  }
}


// ===================== main.js =====================
// ============================================================
// 模块接口契约（其他子代理将按此契约实现各模块）
// ============================================================
//
// hand-tracker.js:
//   export class HandTracker {
//     constructor(videoEl, onResults)  // onResults(results) 回调，results.multiHandLandmarks: Array<Array<{x,y,z}>>，results.multiHandedness: Array<{label, score}>
//     async start()                    // 启动摄像头与检测
//     stop()                           // 停止
//   }
//
// gesture-recognizer.js:
//   export class GestureRecognizer {
//     update(landmarks)                // 输入单手 21 个关键点，返回 { gesture: 'fist'|'open'|'pinch'|'point'|'wave'|'none', confidence: number, handX: number, handY: number }
//     reset()                          // 重置内部状态（手离开画面时调用）
//   }
//
// audio-engine.js:
//   export class AudioEngine {
//     constructor()
//     async resume()                   // 用户手势后恢复 AudioContext
//     setScale(scaleName)              // 'cmajor'|'aminor'|'pentatonic'|'blues'
//     setTimbre(timbreName)            // 'synth'|'drums'|'bass'
//     setBpm(bpm)
//     setVolume(vol)                   // 0..1
//     playNote(freq, handId)           // 播放单音（合成器/贝斯）
//     playChord(rootFreq, handId)      // 播放和弦
//     playDrum(type, handId)           // type: 'kick'|'snare'|'hihat'
//     stopHand(handId)                 // 停止该手所有发声
//     getScaleFreqs()                  // 返回当前音阶频率数组
//   }
//
// gesture-mapper.js:
//   export class GestureMapper {
//     constructor(audioEngine, recognizer)
//     processHand(landmarks, handedness, handId)  // 识别手势并触发对应音频事件；返回 { gesture, confidence, handX, handY } 供可视化使用
//     onHandLost(handId)                          // 手离开时停止该手发声
//     setBpm(bpm)
//   }
//
// visualizer.js:
//   export class Visualizer {
//     constructor(canvasEl, videoEl)
//     draw(landmarksList, handednessList, gestureList, activeNotes)  // landmarksList: 双手关键点数组；gestureList: 每手手势名；activeNotes: 活跃音符数组 [{x,y,age}]
//     setLowPerfMode(enabled)
//     clear()
//   }
//   注意：#video 已通过 CSS transform scaleX(-1) 做了镜像，绘制 landmarks 时需将 x 翻转为 (1 - x) 以与画面中对齐。
//
// recorder.js:
//   export class Recorder {
//     constructor(audioEngine, mapper, visualizer)
//     startRecording()
//     stopRecording()
//     playRecording()
//     isRecording()
//     isPlaying()
//     hasRecording()
//     captureFrame(landmarksList, handednessList, gestureList)  // 由主循环每帧调用以记录手势时间线
//   }
// ============================================================







// ---------- DOM ----------
const videoEl = document.getElementById('video');
const overlayEl = document.getElementById('overlay');
const bpmSlider = document.getElementById('bpm-slider');
const bpmValue = document.getElementById('bpm-value');
const recordBtn = document.getElementById('record-btn');
const stopBtn = document.getElementById('stop-btn');
const playBtn = document.getElementById('play-btn');
const statusEl = document.getElementById('status');
const errorOverlay = document.getElementById('error-overlay');
const errorText = document.getElementById('error-text');
const retryBtn = document.getElementById('retry-btn');
// AI 状态显示区（替代原音阶/音色手动选择）
const aiStateEl = document.getElementById('ai-state');

// ---------- 配置 ----------
const LOW_FPS_THRESHOLD = 20; // 低于该值进入性能模式
const LOW_FPS_HYSTERESIS = 26; // 恢复阈值（带迟滞，避免抖动）
const FPS_WINDOW_MS = 3000;
const NOTE_MAX_AGE = 30; // 活跃音符最大存活帧数

// ---------- 模块实例 ----------
let audioEngine;
let recognizer;
let director;
let mapper;
let visualizer;
let recorder;
let tracker;

// ---------- 运行时状态 ----------
const frameTimes = [];
let lowPerfActive = false;
const activeNotes = new Map(); // handId -> { x, y, age }

// ---------- 工具函数 ----------
function setStatus(msg) {
  if (statusEl) statusEl.textContent = msg;
}

function showError(msg) {
  if (errorText) errorText.textContent = msg;
  errorOverlay.classList.remove('hidden');
}

function hideError() {
  errorOverlay.classList.add('hidden');
}

// ---------- 帧率监测（用于性能降级） ----------
function trackFps() {
  const now = performance.now();
  frameTimes.push(now);
  while (frameTimes.length && frameTimes[0] < now - FPS_WINDOW_MS) {
    frameTimes.shift();
  }
  if (frameTimes.length < 10) return;

  const span = (frameTimes[frameTimes.length - 1] - frameTimes[0]) / 1000;
  const fps = span > 0 ? (frameTimes.length - 1) / span : 0;

  if (fps < LOW_FPS_THRESHOLD && !lowPerfActive) {
    lowPerfActive = true;
    visualizer?.setLowPerfMode(true);
    setStatus('性能模式已开启');
  } else if (fps >= LOW_FPS_HYSTERESIS && lowPerfActive) {
    lowPerfActive = false;
    visualizer?.setLowPerfMode(false);
    setStatus('就绪');
  }
}

// ---------- 活跃音符视觉缓存 ----------
// 基于当前帧手势结果生成，供可视化层渲染音符残影。
function updateActiveNotes(gestureResults) {
  for (const [id, note] of activeNotes) {
    note.age++;
    if (note.age > NOTE_MAX_AGE) activeNotes.delete(id);
  }
  gestureResults.forEach((g, i) => {
    if (g && g.gesture && g.gesture !== 'none' && g.gesture !== 'fist') {
      activeNotes.set(i, { x: g.handX, y: g.handY, age: 0 });
    }
  });
}

// ---------- 主循环回调（由 HandTracker 每帧驱动） ----------
const stageHintEl = document.getElementById('stage-hint');

function onResults(results) {
  trackFps();

  const landmarksList = results?.multiHandLandmarks || [];
  const handednessList = results?.multiHandedness || [];
  const gestureResults = [];
  const gestureList = [];

  if (landmarksList.length === 0) {
    // 无手入画：重置识别器、停止全部发声、清空音符残影
    mapper.onHandLost(0);
    mapper.onHandLost(1);
    recognizer.reset();
    activeNotes.clear();
    // 显示空状态提示
    if (stageHintEl) stageHintEl.classList.remove('hidden');
  } else {
    // 有手：隐藏空状态提示
    if (stageHintEl) stageHintEl.classList.add('hidden');
    landmarksList.forEach((landmarks, i) => {
      const handedness = handednessList[i];
      const res = mapper.processHand(landmarks, handedness, i);
      gestureResults.push(res);
      gestureList.push(res?.gesture || 'none');
    });
  }

  updateActiveNotes(gestureResults);
  visualizer.draw(
    landmarksList,
    handednessList,
    gestureList,
    Array.from(activeNotes.values())
  );

  // 录制中则记录当前帧
  if (recorder.isRecording()) {
    recorder.captureFrame(landmarksList, handednessList, gestureList);
  }

  // 状态提示
  if (landmarksList.length === 0) {
    if (!lowPerfActive && !recorder.isRecording()) setStatus('请将手放入画面');
  } else if (!recorder.isRecording()) {
    setStatus(`检测到 ${landmarksList.length} 只手 · ${gestureList.join(' / ')}`);
  }
}

// ---------- UI 事件绑定 ----------
// 音阶/音色已由 AI 导演自动决定，无需手动选择；仅保留 BPM 与录制控制。
function bindUI() {
  bpmSlider.addEventListener('input', () => {
    const bpm = Number(bpmSlider.value);
    bpmValue.textContent = String(bpm);
    audioEngine.setBpm(bpm);
    mapper.setBpm(bpm);
  });

  recordBtn.addEventListener('click', async () => {
    await audioEngine.resume();
    recorder.startRecording();
    recordBtn.classList.add('recording');
    recordBtn.textContent = '录制中';
    stopBtn.disabled = false;
    playBtn.disabled = true;
    setStatus('录制中…');
  });

  stopBtn.addEventListener('click', () => {
    recorder.stopRecording();
    recordBtn.classList.remove('recording');
    recordBtn.textContent = '录制';
    stopBtn.disabled = true;
    playBtn.disabled = !recorder.hasRecording();
    setStatus(recorder.hasRecording() ? '已保存录制，可点击回放' : '就绪');
  });

  playBtn.addEventListener('click', () => {
    if (!recorder.hasRecording()) return;
    recorder.playRecording();
    setStatus('回放中…');
  });

  retryBtn.addEventListener('click', () => {
    hideError();
    startTracker();
  });
}

// ---------- AI 状态显示 ----------
// director 决策变化时刷新 UI，让用户感知 AI 当前选择的音阶/音色/情绪。
const MOOD_LABEL = { calm: '平静', active: '活跃', intense: '激烈' };
const TIMBRE_LABEL = { synth: '合成器', bass: '贝斯', drums: '鼓机' };
function updateAIState(state) {
  if (!aiStateEl || !state) return;
  const mood = MOOD_LABEL[state.mood] || state.mood;
  const timbre = TIMBRE_LABEL[state.timbre] || state.timbre;
  const pad = state.pad ? ' · pad 开' : '';
  // 仅更新文本 span，保留呼吸点指示器
  const textEl = aiStateEl.querySelector('.ai-state-text');
  if (textEl) {
    textEl.textContent = `${mood} · ${state.scale} · ${timbre}${pad}`;
  }
}

// ---------- 启动摄像头追踪 ----------
async function startTracker() {
  try {
    setStatus('正在启动摄像头…');
    await tracker.start();
    setStatus('请将手放入画面');
  } catch (err) {
    console.error('[HandTracker] 启动失败:', err);
    showError('摄像头无法启动，请检查权限后重试');
  }
}

// ---------- 浏览器自动播放策略：首次用户手势恢复 AudioContext ----------
// iOS Safari 仅响应 touchstart/touchend；Android Chrome 响应 touchstart/pointerdown；
// 桌面浏览器响应 pointerdown/keydown。三者全部监听以确保移动端可解锁音频。
function attachAudioUnlock() {
  const unlock = async () => {
    try {
      if (audioEngine) await audioEngine.resume();
    } catch (err) {
      console.warn('[AudioEngine] resume 失败:', err);
    }
  };
  window.addEventListener('pointerdown', unlock, { once: true });
  window.addEventListener('keydown', unlock, { once: true });
  window.addEventListener('touchstart', unlock, { once: true, passive: true });
}

// ---------- 初始化 ----------
async function init() {
  try {
    audioEngine = new AudioEngine();
    recognizer = new GestureRecognizer();
    // AI 音乐导演：自动决定音阶/音色/和弦/情绪，用户无需手动选择
    director = new MusicDirector(audioEngine);
    director.onStateChange = updateAIState;
    mapper = new GestureMapper(audioEngine, recognizer, director);
    visualizer = new Visualizer(overlayEl, videoEl);
    recorder = new Recorder(audioEngine, mapper, visualizer);
    tracker = new HandTracker(videoEl, onResults);

    // 同步 BPM 初始值（音阶/音色由 director 接管，不再手动设置）
    audioEngine.setBpm(Number(bpmSlider.value));
    mapper.setBpm(Number(bpmSlider.value));
    // 初始显示 AI 状态
    updateAIState(director.getState());

    bindUI();
    attachAudioUnlock();
    await startTracker();
  } catch (err) {
    console.error('[init] 初始化失败:', err);
    showError('初始化失败：' + (err?.message || err));
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

  </script>
