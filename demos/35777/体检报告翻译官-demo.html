<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体检报告翻译官 - 把专业指标变成普通人看得懂的复查清单</title>
    <style>
        :root {
            --safe: #2E8B57;
            --warn: #F0B800;
            --warn2: #F0D400;
            --danger: #D9534F;
            --primary: #3D5AFE;
            --primary2: #7B9AF5;
            --bg: #FAFAFA;
            --card: #FFFFFF;
            --border: #E6E8EF;
            --text: #1E2028;
            --text-medium: #4A4E56;
            --text-light: #6B7280;
            --muted: #9BA1AD;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Segoe UI, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.75;
            min-height: 100vh;
            font-size: 15px;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #3D5AFE 0%, #7B9AF5 100%);
            color: #fff;
            padding: 48px 0 44px;
            text-align: center;
        }

        .header-inner {
            max-width: 820px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .logo-icon {
            width: 52px;
            height: 52px;
            background: rgba(255,255,255,0.18);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        .logo {
            font-family: "Georgia", "Times New Roman", serif;
            font-size: 2.1rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .tagline {
            font-size: 1.15rem;
            opacity: 0.95;
            max-width: 520px;
            margin: 0 auto 10px;
            font-weight: 500;
        }

        .tagline-sub {
            font-size: 0.98rem;
            opacity: 0.85;
        }

        /* SAFETY BANNER */
        .safety-banner {
            background: #FFF8E1;
            border-bottom: 1px solid #F3E0A6;
            padding: 14px 20px;
            text-align: center;
            font-size: 0.95rem;
            color: #7A5A10;
        }

        .safety-banner strong { color: #6A4A00; }

        /* CONTAINER */
        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 28px 20px 60px;
        }

        /* CARD */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px 24px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title-icon { font-size: 1.4rem; }

        .card-subtitle {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 16px;
        }

        /* TEXT INPUT */
        .text-input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text);
            background: #F8FAFC;
            resize: vertical;
            min-height: 90px;
        }

        .text-input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(61, 90, 254, 0.08);
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 22px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            background: #fff;
            color: var(--text);
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            padding: 14px 28px;
            font-size: 1.05rem;
            box-shadow: 0 4px 14px rgba(61, 90, 254, 0.2);
        }

        .btn-primary:hover {
            background: #3a57e0;
            color: #fff;
        }

        .btn-secondary {
            background: #fff;
            color: var(--text);
            padding: 10px 18px;
            font-size: 0.95rem;
        }

        .btn-action {
            padding: 10px 18px;
            font-size: 0.95rem;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* SCENARIO BUTTONS */
        .scenario-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-top: 14px;
        }

        .scenario-btn {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            background: #fff;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text);
            font-family: inherit;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-start;
            text-align: left;
        }

        .scenario-btn:hover {
            border-color: var(--primary);
            background: #F5F7FF;
        }

        .scenario-btn.active {
            border-color: var(--primary);
            background: #EBF0FF;
            color: var(--primary);
        }

        .scenario-btn-icon {
            width: 24px;
            height: 24px;
            background: #F0F3FA;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .scenario-btn.active .scenario-btn-icon {
            background: var(--primary);
            color: #fff;
        }

        /* RESULT HEADER */
        .result-section { display: none; }

        .result-section.show { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* INDICATOR CARD */
        .indicator-card {
            border-left: 4px solid var(--primary);
            padding-left: 20px;
            padding-top: 14px;
            padding-bottom: 14px;
            margin-bottom: 14px;
        }

        .indicator-name-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .indicator-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
        }

        /* RISK BADGE */
        .risk-badge {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .risk-normal { background: #E8F5E9; color: var(--safe); }
        .risk-watch { background: #FFF8E1; color: #8B6F10; }
        .risk-check { background: #FFF3E0; color: #D97A3A; }
        .risk-doctor { background: #FFEBEE; color: var(--danger); }

        /* INFO ROWS */
        .info-row {
            padding: 8px 0;
            border-bottom: 1px dashed var(--border);
        }

        .info-row:last-child { border-bottom: none; }

        .info-label {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .info-value {
            font-size: 1rem;
            color: var(--text);
        }

        /* LIST */
        .custom-list {
            list-style: none;
            padding: 0;
        }

        .custom-list li {
            padding: 4px 0 4px 22px;
            position: relative;
            font-size: 1rem;
        }

        .custom-list li::before {
            content: "";
            position: absolute;
            left: 0;
            top: 12px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
        }

        /* TODO LIST */
        .todo-list { list-style: none; padding: 0; }

        .todo-item {
            display: flex;
            gap: 10px;
            padding: 10px 12px;
            background: #F8FAFC;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.98rem;
        }

        .todo-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border);
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
        }

        .todo-checkbox:hover {
            border-color: var(--primary);
        }

        .todo-checkbox.checked {
            background: var(--safe);
            border-color: var(--safe);
            color: #fff;
        }

        .todo-checkbox.checked::after {
            content: "✓";
            font-size: 0.85rem;
            font-weight: 700;
        }

        .todo-text {
            flex: 1;
            color: var(--text);
        }

        /* FAMILY SUMMARY */
        .family-summary {
            background: linear-gradient(135deg, #F5F7FF 0%, #FAFBFF 100%);
            border: 1px solid #E0E6FF;
            border-radius: 12px;
            padding: 20px 22px;
            font-size: 1rem;
            color: var(--text);
            line-height: 1.9;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }

        .empty-state-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        /* SECTIONS */
        .section-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ROW GAP */
        .row-gap { margin-top: 16px; }

        /* SUBHEADER */
        .subheader {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 10px;
        }

        /* HR */
        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 18px 0;
        }

        /* LOADING */
        .loading-overlay {
            display: none;
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }

        .loading-overlay.show { display: block; }

        .loading-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .loading-dots span {
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
            animation: bounce 1.4s ease infinite;
        }

        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); opacity: 0.5; }
        }

        /* SAFETY BOX */
        .safety-box {
            background: linear-gradient(135deg, #F8F9FC 0%, #FDFDFF 100%);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 0.92rem;
            color: var(--text-medium);
            line-height: 1.8;
        }

        .safety-box strong { color: var(--text); }

        /* INDICATOR BORDER COLORS */
        .indicator-card.risk-watch { border-left-color: var(--warn); }
        .indicator-card.risk-check { border-left-color: #E89A3A; }
        .indicator-card.risk-doctor { border-left-color: var(--danger); }
        .indicator-card.risk-normal { border-left-color: var(--safe); }

        /* MOBILE */
        @media (max-width: 600px) {
            .header { padding: 32px 0 28px; }
            .logo { font-size: 1.7rem; }
            .logo-icon { width: 44px; height: 44px; font-size: 1.5rem; }
            .tagline { font-size: 1rem; padding: 0 20px; }
            .card { padding: 18px 18px; }
            .card-title { font-size: 1.05rem; }
            .indicator-name-row { font-size: 0.95rem; }
            .indicator-title { font-size: 1.1rem; }
            .container { padding: 22px 14px 50px; }
            .scenario-buttons { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 400px) {
            .scenario-buttons { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <div class="logo-row">
            <div class="logo-icon">📋</div>
            <h1 class="logo">体检报告翻译官</h1>
        </div>
        <p class="tagline">把专业指标变成普通人看得懂的复查清单</p>
        <p class="tagline-sub">上传或输入体检异常指标 · 生成通俗解释、风险等级、复查建议和家人版总结</p>
    </div>
</header>

<div class="safety-banner">
    ⚠️ <strong>安全提醒：</strong>本工具仅用于体检报告科普解读，不替代医生诊断，不提供处方和用药建议。如出现明显不适或指标严重异常，请及时就医。
</div>

<div class="container">

    <!-- 输入区 -->
    <div class="card">
        <div class="card-title">
            <span class="card-title-icon">📝</span>
            输入体检异常指标
        </div>
        <div class="card-subtitle">可以直接点击下方示例查看解读结果，也可以手动输入您体检报告中的异常项目</div>

        <textarea class="text-input" id="customInput" placeholder="例：体检报告中显示以下指标异常，如：尿酸 尿酸偏高，ALT 42（正常范围 0-40），总胆固醇 6.2（正常范围 5.2）..."></textarea>

        <div style="margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn btn-primary" id="analyzeBtn">🔍 开始解读</button>
            <button class="btn btn-secondary" id="clearBtn">清空输入</button>
        </div>

        <hr class="divider">

        <div class="subheader">常见异常指标示例（点击查看解读）：</div>
        <div class="scenario-buttons" id="scenarioButtons">
            <button class="scenario-btn" data-key="uric">
                <span class="scenario-btn-icon">🩸</span>尿酸偏高
            </button>
            <button class="scenario-btn" data-key="ldl">
                <span class="scenario-btn-icon">💔</span>低密度脂蛋白偏高
            </button>
            <button class="scenario-btn" data-key="glucose">
                <span class="scenario-btn-icon">🍬</span>空腹血糖临界
            </button>
            <button class="scenario-btn" data-key="alt">
                <span class="scenario-btn-icon">🫀</span>转氨酶偏高
            </button>
            <button class="scenario-btn" data-key="thyroid">
                <span class="scenario-btn-icon">🦋</span>甲状腺结节
            </button>
            <button class="scenario-btn" data-key="fatty">
                <span class="scenario-btn-icon">🫃</span>脂肪肝
            </button>
        </div>
    </div>

    <!-- 解读结果区 -->
    <div id="resultArea">
        <div id="emptyState" class="card empty-state">
            <div class="empty-state-icon">🩺</div>
            <p>请选择上方的示例按钮，或输入您的体检异常指标后点击「开始解读」</p>
            <p style="font-size: 0.9rem; margin-top: 8px;">解读结果将在这里显示</p>
        </div>
    </div>
</div>

<script>
    // =====================================================
    // 体检指标解读数据
    // =====================================================
    const indicators = {
        uric: {
            name: '尿酸（UA）偏高',
            explain: '尿酸是身体代谢嘌呤后的废物，主要通过肾脏随尿液排出。尿酸偏高通常意味着身体产生了过多尿酸，或者肾脏排出能力不足。',
            causes: [
                '高嘌呤饮食：动物内脏、海鲜、啤酒、浓肉汤、火锅等摄入过多',
                '喝水不足，尿酸排泄减少',
                '超重或肥胖，代谢变慢',
                '长期饮酒，尤其啤酒和烈酒',
                '久坐不动，缺乏规律运动',
                '肾功能下降或服用某些药物（如利尿剂）',
            ],
            risk: 'watch',
            riskText: '需要关注',
            riskDesc: '目前偏高，但短期内通常不会造成严重问题。持续高尿酸可能增加痛风、肾结石风险。',
            next: '建议 1~3 个月后复查尿酸，同时复查肾功能（肌酐、尿素氮）。可挂「全科 / 风湿免疫科 / 内分泌科」咨询。',
            life: [
                '每天饮水 2000ml 以上（约 8~10 杯），促进尿酸排泄',
                '减少高嘌呤食物：动物内脏、海鲜、浓肉汤、火锅、沙丁鱼、凤尾鱼',
                '严格限制饮酒，尤其啤酒和烈酒',
                '控制体重，循序渐进减重（每月不超过 2kg）',
                '每周进行 3~5 次有氧运动（快走、游泳、骑车），每次 30 分钟',
                '减少含糖饮料、甜食摄入，果糖会促进尿酸升高',
            ],
            todo: [
                '1~3 个月后复查「尿酸 + 肾功能」',
                '控制高嘌呤饮食',
                '每日饮水 2000ml 以上',
                '限制饮酒或戒酒',
                '如出现关节红肿疼痛（尤其脚趾、脚踝）及时就医',
                '如持续异常或尿酸超过 540 μmol/L，建议咨询风湿免疫科或全科医生',
            ],
            family: '这次体检主要是尿酸偏高，目前属于「需要关注」级别，不代表马上有严重疾病。建议先调整饮食（少吃高嘌呤食物、多喝水、少喝酒），配合规律运动，1~3 个月后复查。如持续升高或出现关节疼痛再去风湿免疫科或全科就诊。',
        },

        ldl: {
            name: '低密度脂蛋白胆固醇（LDL-C）偏高',
            explain: '低密度脂蛋白俗称「坏胆固醇」。它会把胆固醇运到血管壁上堆积，使血管变窄变硬（动脉粥样硬化），是心血管疾病的重要危险因素。',
            risk: 'check',
            riskText: '建议复查',
            causes: [
                '高油高脂饮食：油炸食品、肥肉、奶油、糕点摄入过多',
                '缺乏运动，脂肪堆积',
                '超重或肥胖，尤其是腹型肥胖',
                '吸烟、饮酒',
                '家族性高胆固醇血症（遗传因素）',
                '甲状腺功能减退等代谢疾病',
            ],
            riskDesc: '偏高的 LDL-C 短期内没有明显症状，但长期偏高会加速血管老化，增加冠心病、脑中风的风险。',
            next: '建议 2~3 个月后复查「血脂四项」（总胆固醇、LDL-C、HDL-C、甘油三酯）。可挂「心内科 / 内分泌科 / 全科」咨询。建议同时测量血压和血糖。',
            life: [
                '减少油炸、烧烤、肥肉、奶油、糕点、动物内脏的摄入',
                '多吃蔬菜、全谷物、豆类、坚果（原味，每日一小把）',
                '选择瘦肉（鸡胸肉、鱼肉）替代肥肉和油炸',
                '每周至少 150 分钟中等强度有氧运动（快走、慢跑、游泳）',
                '戒烟限酒，尤其白酒和甜酒',
                '保持健康体重，腰围男性 <90cm、女性 <85cm',
            ],
            todo: [
                '2~3 个月后复查「血脂四项」',
                '调整饮食结构，减少高脂高油',
                '开始规律运动（每周 150 分钟）',
                '测量血压和血糖',
                '如 LDL-C 持续升高或家族中有心血管病史，建议心内科或内分泌科就诊',
            ],
            family: '这次体检主要是坏胆固醇（LDL-C）偏高。目前属于「建议复查」级别，短期内一般没有症状，但长期偏高会增加血管和心脏风险。建议先从改善饮食、增加运动入手，2~3 个月后再复查血脂。如持续偏高或有家族史、高血压、糖尿病等情况，建议心内科或内分泌科进一步评估。',
        },

        glucose: {

    // 自定义输入分析器
    function analyzeCustom(text) {
        // 简单关键词匹配
        const rules = [
            { keys: ['尿酸', 'UA'], data: indicators.uric },
            { keys: ['低密度', 'LDL', 'ldl', '坏胆固醇'], data: indicators.ldl },
            { keys: ['血糖', '葡萄糖', 'FPG'], data: indicators.glucose },
            { keys: ['转氨酶', 'ALT', 'AST', '谷丙', '谷草'], data: indicators.alt },
            { keys: ['甲状腺', '结节'], data: indicators.thyroid },
            { keys: ['脂肪肝', '脂肪 肝'], data: indicators.fatty },
        ];

        // 匹配度最高者优先
        let bestMatch = null;
        let bestCount = 0;

        for (const rule of rules) {
            const count = rule.keys.reduce((sum, k) => sum + (text.includes(k) ? 1 : 0), 0);
            if (count > bestCount) {
                bestCount = count;
                bestMatch = rule.data;
            }
        }
        return bestMatch;
    }

    // 渲染单个指标卡片
    function renderIndicator(indicator) {
        const riskMap = {
            normal: { class: 'risk-normal', text: '正常' },
            watch: { class: 'risk-watch', text: '需要关注' },
            check: { class: 'risk-check', text: '建议复查' },
            doctor: { class: 'risk-doctor', text: '建议就医' },
        };
        const r = riskMap[indicator.risk];

        return `
            <div class="indicator-card risk-${indicator.risk}">
                <div class="indicator-name-row">
                    <div class="indicator-title">📌 ${indicator.name}</div>
                    <span class="risk-badge ${r.class}">${r.text}</span>
                </div>

                <div class="info-row">
                    <div class="info-label">👨‍⚕️ 这个指标是什么意思</div>
                    <div class="info-value">${indicator.explain}</div>
                </div>

                <div class="info-row">
                    <div class="info-label">🤔 可能的原因</div>
                    <div class="info-value">
                        <ul class="custom-list">
                            ${indicator.causes.map(c => `<li>${c}</li>`).join('')}
                        </ul>
                    </div>
                </div>

                <div class="info-row">
                    <div class="info-label">⚠️ 风险等级说明</div>
                    <div class="info-value">${indicator.riskDesc}</div>
                </div>

                <div class="info-row">
                    <div class="info-label">📅 下一步建议</div>
                    <div class="info-value">${indicator.next}</div>
                </div>

                <div class="info-row">
                    <div class="info-label">🥗 生活建议</div>
                    <div class="info-value">
                        <ul class="custom-list">
                            ${indicator.life.map(c => `<li>${c}</li>`).join('')}
                        </ul>
                    </div>
                </div>
            </div>
        `;
    }

    // 安全提示
    function renderSafety() {
        return `
            <div class="card safety-box">
                <strong>⚠️ 重要安全提示</strong><br>
                1. 本工具仅用于体检报告的科普解读，帮助您理解异常指标含义，不替代医生诊断。<br>
                2. 本工具不提供处方和用药建议。具体用药请遵医嘱。<br>
                3. 风险等级是基于通用医学常识给出的参考，具体诊断和治疗方案请咨询专业医生。<br>
                4. 如出现明显不适症状（如持续疼痛、胸闷、呼吸困难、头晕、体重快速变化等）或指标严重异常，请及时就医。<br>
                5. 不同地区、不同医院的正常值参考范围可能略有差异，请以报告上标注的范围和医生意见为准。<br>
                6. 孕妇、儿童、老年人及有基础疾病者的解读请特别咨询专科医生。
            </div>
        `;
    }

    // 渲染完整解读结果
    function renderResult(indicator) {
        const html = `
            <div class="result-section show">
                <div class="card">

                        <span class="card-title-icon">📊</span>
                        体检指标解读结果

                    <div class="card-subtitle">以下为基于通用医学常识给出的科普解释，仅供参考。具体诊断请以医生意见为准。</div>
                    <div id="indicatorList">
                        ${renderIndicator(indicator)}
                    </div>
                </div>

                ${renderTodoList(indicator)}

                ${renderFamily(indicator)}

                ${renderSafety()}
            </div>
        `;
        return html;
    }

    // 渲染加载动画
    function showLoading() {
        document.getElementById('resultArea').innerHTML = `
            <div class="card loading-overlay show">
                <div class="loading-dots"><span></span><span></span><span></span></div>
                <p>AI 正在分析您的体检报告...</p>
            </div>
        `;
    }

    // 处理示例按钮点击
    function handleScenario(key) {
        // 更新按钮高亮
        document.querySelectorAll('.scenario-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`[data-key="${key}"]`).classList.add('active');

        // 显示加载动画
        showLoading();

        // 模拟 AI 分析
        setTimeout(() => {
            const ind = indicators[key];
            document.getElementById('resultArea').innerHTML = renderResult(ind);
            // 绑定 todo 勾选
            bindTodoCheckboxes();
            // 滚动到结果区
            document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
            // 绑定家人版按钮
            bindFamilyButtons(ind);
        }, 900);
    }

    // 处理自定义输入
    function handleCustom() {
        const text = document.getElementById('customInput').value.trim();
        if (!text) {
            alert('请先输入您的体检异常指标内容');
            return;
        }

        const match = analyzeCustom(text);

        showLoading();
        setTimeout(() => {
            if (match) {
                document.getElementById('resultArea').innerHTML = renderResult(match);
            } else {
                document.getElementById('resultArea').innerHTML = `
                    <div class="card">
                        <div class="card-title"><span class="card-title-icon">📊</span>暂未识别的指标类型</div>
                        <div style="margin-top: 10px; color: var(--text-medium); font-size: 0.98rem;">
                            您输入的内容暂未在本 Demo 的内置示例库中。建议您：
                            <ul class="custom-list" style="margin-top: 10px;">
                                <li>直接点击上方的常见异常指标示例查看对应解读</li>
                                <li>把报告带给开单医生，获取最准确的解读</li>
                                <li>如指标明显异常，请不要犹豫，及时就医咨询</li>
                            </ul>
                        </div>
                    </div>
                `;
            }
            bindTodoCheckboxes();
            document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 900);
    }

    // 待办清单勾选
    function bindTodoCheckboxes() {
        document.querySelectorAll('.todo-checkbox').forEach(cb => {
            cb.addEventListener('click', () => cb.classList.toggle('checked'));
        });
    }

    // 家人版按钮
    function bindFamilyButtons(indicator) {
        const copyBtn = document.getElementById('copyFamily');
        if (copyBtn) {
            copyBtn.addEventListener('click', () => {
                const text = `【体检报告家人版总结】\n${indicator.family}\n\n⚠️ 本总结仅供家人参考，不替代医生诊断。如有疑问请咨询医生。`;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(() => {
                        alert('已复制到剪贴板，可以发给家人了 👨‍👩‍👧');
                    }).catch(() => alert('复制失败，请手动复制'));
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    alert('已复制到剪贴板，可以发给家人了 👨‍👩‍👧');
                }
            });
        }

        const printBtn = document.getElementById('printSummary');
        if (printBtn) {
            printBtn.addEventListener('click', () => window.print());
        }
    }

    // ============ 初始化绑定 ============
    document.querySelectorAll('.scenario-btn').forEach(btn => {
        btn.addEventListener('click', () => handleScenario(btn.dataset.key));
    });

    document.getElementById('analyzeBtn').addEventListener('click', handleCustom);

    document.getElementById('clearBtn').addEventListener('click', () => {
        document.getElementById('customInput').value = '';
        document.querySelectorAll('.scenario-btn').forEach(b => b.classList.remove('active'));
    });

    // Enter 快捷键（在输入框中 Enter 不触发提交）
    document.getElementById('customInput').addEventListener('keydown', (e) => {
        // 不阻止换行，保持多行输入功能
    });
