<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具-数轴 - 星童学</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./prototype.css">
</head>
<body class="min-h-screen pb-20">
  <div id="app" class="w-full min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-blue-100 shadow-2xl">
    <div id="contentRoot">
      <div id="page-16" class="page-container active">
        <div id="page-16-normal" class="fade-in">
          <div class="p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100 sticky top-0 z-50 flex items-center justify-between">
            <div class="flex items-center gap-4">
              <button onclick="goToPage(12)" class="p-2 hover:bg-indigo-100 rounded-xl transition" aria-label="返回工具列表">
                <i data-lucide="arrow-left" class="w-5 h-5 text-indigo-600"></i>
              </button>
              <h2 class="text-xl font-bold text-indigo-900">工具 / 数轴</h2>
            </div>
            <button class="p-2 hover:bg-indigo-100 rounded-xl transition" aria-label="更多">
              <i data-lucide="more-horizontal" class="w-5 h-5 text-indigo-600"></i>
            </button>
          </div>
          <div class="p-6 space-y-6">
            <div class="clay-card p-6">
              <div class="flex items-center gap-3 mb-4">
                <div class="w-12 h-12 bg-blue-100 rounded-2xl flex items-center justify-center">
                  <i data-lucide="ruler" class="w-6 h-6 text-blue-600"></i>
                </div>
                <div>
                  <h3 class="text-lg font-bold text-indigo-900">加减法跳跃演示</h3>
                  <p class="text-sm text-gray-500">区间切换 / 拖拽平移 / 缩放 / 加减跳跃 / 凑十与破十分步</p>
                </div>
              </div>
              <div class="grid grid-cols-1 lg:grid-cols-[1.45fr_0.9fr] gap-5">
                <div class="space-y-3">
                  <div id="nlStage" class="nl-stage is-grab p-4 pt-20">
                    <div class="absolute left-4 top-4 flex gap-2 flex-wrap items-center z-10">
                      <div class="nl-pill px-3 py-1 text-xs text-gray-600 flex items-center gap-2">
                        <i data-lucide="move-horizontal" class="w-4 h-4 text-indigo-500"></i>
                        <span id="nlViewInfo">视窗：0–20</span>
                      </div>
                      <div class="nl-pill px-3 py-1 text-xs text-gray-600 flex items-center gap-2">
                        <i data-lucide="map-pin" class="w-4 h-4 text-indigo-500"></i>
                        <span>起点 <span class="font-semibold text-indigo-700" id="nlStartText">0</span> → 落点 <span class="font-semibold text-indigo-700" id="nlEndText">0</span></span>
                      </div>
                    </div>
                    <div id="nlSvg" class="w-full h-[220px] block"></div>
                  </div>
                  <div class="nl-hint text-xs text-gray-600 flex items-center justify-between gap-3">
                    <span>拖拽数轴可平移；点击刻度可快速设为起点。</span>
                    <button id="nlCenterOnStart" class="clay-button clay-button-secondary text-xs py-2 px-3" type="button">
                      <i data-lucide="crosshair" class="w-4 h-4"></i>
                      定位起点
                    </button>
                  </div>
                </div>

                <div class="space-y-4">
                  <div class="p-4 rounded-2xl border border-indigo-100 bg-white">
                    <div class="flex items-center justify-between gap-3">
                      <div class="flex items-center gap-2">
                        <i data-lucide="layers" class="w-4 h-4 text-indigo-600"></i>
                        <span class="font-bold text-indigo-900">区间</span>
                      </div>
                      <span class="text-xs text-gray-500">至少 0-20 / 0-100</span>
                    </div>
                    <div class="mt-3 grid grid-cols-2 gap-2">
                      <button id="nlRange20" class="clay-button clay-button-primary text-sm py-2 px-4" type="button">0–20</button>
                      <button id="nlRange100" class="clay-button clay-button-secondary text-sm py-2 px-4" type="button">0–100</button>
                    </div>
                  </div>

                  <div class="p-4 rounded-2xl border border-indigo-100 bg-white">
                    <div class="flex items-center justify-between gap-3">
                      <div class="flex items-center gap-2">
                        <i data-lucide="zoom-in" class="w-4 h-4 text-indigo-600"></i>
                        <span class="font-bold text-indigo-900">缩放</span>
                      </div>
                      <button id="nlResetView" class="clay-button clay-button-secondary text-xs py-2 px-3" type="button">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                        重置
                      </button>
                    </div>
                    <div class="mt-3 flex items-center gap-2">
                      <button id="nlZoomOut" class="clay-button clay-button-secondary text-sm py-2 px-3" type="button" aria-label="缩小">
                        <i data-lucide="minus" class="w-4 h-4"></i>
                      </button>
                      <input id="nlZoomSlider" class="w-full" type="range" min="1" max="5" step="0.1" value="1" aria-label="缩放滑块">
                      <button id="nlZoomIn" class="clay-button clay-button-secondary text-sm py-2 px-3" type="button" aria-label="放大">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>

                  <div class="p-4 rounded-2xl border border-indigo-100 bg-white">
                    <div class="flex items-center justify-between gap-3">
                      <div class="flex items-center gap-2">
                        <i data-lucide="function-square" class="w-4 h-4 text-indigo-600"></i>
                        <span class="font-bold text-indigo-900">输入与演示</span>
                      </div>
                      <button id="nlClearBtn" class="clay-button clay-button-secondary text-xs py-2 px-3" type="button">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                        清空
                      </button>
                    </div>
                    <div class="mt-3 grid grid-cols-[1fr_auto] gap-2">
                      <input id="nlExprInput" class="clay-input !py-2 !px-3 !text-base" inputmode="numeric" placeholder="如：8+5 或 12-7" aria-label="输入加减表达式">
                      <button id="nlPlayBtn" class="clay-button clay-button-cta text-sm py-2 px-4" type="button">
                        <i data-lucide="play" class="w-4 h-4"></i>
                        演示
                      </button>
                    </div>
                    <div class="mt-3 flex items-center justify-between gap-3">
                      <label class="flex items-center gap-2 text-sm text-gray-700 select-none">
                        <input id="nlStepMode" type="checkbox" class="accent-indigo-600">
                        凑十/破十分步
                      </label>
                      <div class="flex gap-2">
                        <button id="nlDemoAdd" class="clay-button clay-button-secondary text-xs py-2 px-3" type="button">示例 8+5</button>
                        <button id="nlDemoSub" class="clay-button clay-button-secondary text-xs py-2 px-3" type="button">示例 12-7</button>
                      </div>
                    </div>
                    <div class="mt-3 nl-hint text-sm text-gray-700">
                      <div class="flex items-center gap-2">
                        <i data-lucide="sparkles" class="w-4 h-4 text-indigo-600"></i>
                        <span id="nlResultText">结果：0</span>
                      </div>
                      <div class="text-xs text-gray-500 mt-1" id="nlStepsText">步骤：—</div>
                    </div>
                    <div id="nlFeedback" class="nl-hint mt-3 text-sm text-gray-600" aria-live="polite">提示：先输入表达式，再点击“演示”。</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./prototype.js"></script>
</body>
</html>
