<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 星童学小学计算能力训练平台</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./prototype.css">
</head>
<body class="min-h-screen pb-20">
  <div id="app" class="w-full min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-blue-100 shadow-2xl">
    <div id="contentRoot">
      <div id="page-1" class="page-container active">
        <div id="page-1-normal" class="fade-in">
          <div class="fixed inset-0 z-[100] bg-white overflow-y-auto">
            <div class="flex flex-col md:flex-row min-h-full">
              <div class="hidden md:flex flex-1 flex-col justify-center p-8 lg:p-12 text-white bg-cover bg-center relative" style="background-image: url('./bg1.png');">
                <div class="max-w-xl mx-auto w-full z-10">
                  <img src="./logo.png" alt="星童学" class="h-12 w-auto mb-8 select-none" draggable="false">
                  <h1 class="text-3xl lg:text-4xl font-bold leading-tight tracking-wide mb-2">星童学小学计算能力训练平台</h1>
                  <p class="text-lg lg:text-xl text-indigo-100 mb-8 lg:mb-12">从“会算数”到“懂数学”</p>
                  <div class="grid grid-cols-2 gap-4 lg:gap-6">
                    <div class="bg-white rounded-2xl p-4 lg:p-5 relative overflow-hidden h-32 lg:h-36 shadow-lg transform transition hover:-translate-y-1">
                      <div class="inline-block bg-gradient-to-r from-indigo-500 to-purple-500 text-white rounded-full px-3 lg:px-4 py-1 text-xs lg:text-sm font-semibold mb-2 lg:mb-3">一、数感培养</div>
                      <p class="text-xs lg:text-sm text-gray-700 relative z-10">从“会算数”到“懂数学”</p>
                      <img src="./tag1.png" class="absolute bottom-2 right-2 w-16 h-16 lg:w-20 lg:h-20 object-contain z-0" alt="">
                    </div>
                    <div class="bg-white rounded-2xl p-4 lg:p-5 relative overflow-hidden h-32 lg:h-36 shadow-lg transform transition hover:-translate-y-1">
                      <div class="inline-block bg-gradient-to-r from-indigo-500 to-purple-500 text-white rounded-full px-3 lg:px-4 py-1 text-xs lg:text-sm font-semibold mb-2 lg:mb-3">二、聚焦算理</div>
                      <p class="text-xs lg:text-sm text-gray-700 relative z-10">知其然，更知其所以然</p>
                      <img src="./tag2.png" class="absolute bottom-2 right-2 w-16 h-16 lg:w-20 lg:h-20 object-contain z-0" alt="">
                    </div>
                    <div class="bg-white rounded-2xl p-4 lg:p-5 relative overflow-hidden h-32 lg:h-36 shadow-lg transform transition hover:-translate-y-1">
                      <div class="inline-block bg-gradient-to-r from-indigo-500 to-purple-500 text-white rounded-full px-3 lg:px-4 py-1 text-xs lg:text-sm font-semibold mb-2 lg:mb-3">三、智能出题</div>
                      <p class="text-xs lg:text-sm text-gray-700 relative z-10">精准匹配，高效提分</p>
                      <img src="./tag3.png" class="absolute bottom-2 right-2 w-16 h-16 lg:w-20 lg:h-20 object-contain z-0" alt="">
                    </div>
                    <div class="bg-white rounded-2xl p-4 lg:p-5 relative overflow-hidden h-32 lg:h-36 shadow-lg transform transition hover:-translate-y-1">
                      <div class="inline-block bg-gradient-to-r from-indigo-500 to-purple-500 text-white rounded-full px-3 lg:px-4 py-1 text-xs lg:text-sm font-semibold mb-2 lg:mb-3">四、智能错题本</div>
                      <p class="text-xs lg:text-sm text-gray-700 relative z-10">错题会变少，分数会变高</p>
                      <img src="./tag4.png" class="absolute bottom-2 right-2 w-16 h-16 lg:w-20 lg:h-20 object-contain z-0" alt="">
                    </div>
                  </div>
                </div>
              </div>

              <div class="flex-1 flex items-center justify-center p-6 md:p-8 bg-white">
                <div class="w-full max-w-md bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] p-10">
                  <div class="md:hidden text-center mb-5">
                    <img src="./logo.png" alt="星童学" class="h-10 w-auto mx-auto mb-2 select-none" draggable="false">
                    <p class="text-xs text-gray-500">小学计算能力训练平台</p>
                  </div>
                  <div class="mb-10">
                    <h2 class="text-2xl font-bold text-gray-800">欢迎使用星童学</h2>
                  </div>

                  <div id="loginFormSection" class="space-y-6">
                    <div class="relative">
                      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i data-lucide="user" class="w-5 h-5 text-gray-400"></i>
                      </div>
                      <input id="phoneInput" type="text" class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition" placeholder="账号/用户名">
                    </div>
                    <div class="relative">
                      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i data-lucide="lock" class="w-5 h-5 text-gray-400"></i>
                      </div>
                      <input id="passwordInput" type="password" class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition" placeholder="密码">
                    </div>
                    <button id="loginBtn" class="w-full py-3.5 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white rounded-full font-medium text-lg shadow-md hover:shadow-lg transition transform hover:-translate-y-0.5" onclick="handleLoginClick()">
                      登录
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div id="page-1-loading" class="hidden">
          <div class="min-h-screen flex items-center justify-center">
            <div class="text-center">
              <div class="spinner mx-auto mb-4"></div>
              <p class="text-gray-500">验证码发送中...</p>
            </div>
          </div>
        </div>

        <div id="page-1-error" class="hidden">
          <div class="min-h-screen flex items-center justify-center p-8">
            <div class="error-state clay-card max-w-sm w-full">
              <div class="error-state-icon">
                <i data-lucide="alert-circle" class="w-12 h-12 text-red-500"></i>
              </div>
              <h3 class="text-xl font-bold text-gray-800 mb-2">登录失败</h3>
              <p class="text-gray-500 mb-6">网络连接不稳定，请检查网络后重试</p>
              <button class="clay-button clay-button-primary" onclick="switchState('page-1', 'normal')">
                重新登录
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="verificationModal" class="verification-modal">
      <div class="verification-content bounce-in">
        <h3 class="text-xl font-bold text-indigo-900 mb-2">请完成验证</h3>
        <p class="text-gray-500 mb-6">按住滑块拖动到最右侧完成验证</p>
        <div class="slider-container">
          <div class="slider-track">
            <div class="slider-fill" id="sliderFill" style="width: 0%"></div>
            <div class="slider-handle" id="sliderHandle" style="left: 4px"></div>
          </div>
        </div>
        <div class="text-sm text-gray-400 mt-4">
          <span id="sliderStatus">向右滑动完成验证</span>
        </div>
        <button class="clay-button clay-button-secondary w-full mt-6" onclick="closeVerificationModal()">
          取消
        </button>
      </div>
    </div>
  </div>

  <script src="./prototype.js"></script>
</body>
</html>
