<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>错题本-整数加减法 - 星童学</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./prototype.css">
</head>
<body class="min-h-screen pb-20">
  <div id="app" class="w-full min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-blue-100 shadow-2xl">
    <div id="contentRoot">
      <div id="page-10" class="page-container active">
        <div id="page-10-normal" class="fade-in">
          <div class="p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100 flex items-center gap-4 sticky top-0 z-50">
            <button onclick="goToPage(9)" class="p-2 hover:bg-indigo-100 rounded-xl transition">
              <i data-lucide="arrow-left" class="w-5 h-5 text-indigo-600"></i>
            </button>
            <h2 class="text-xl font-bold text-indigo-900">错题本 / 一、整数加减法</h2>
          </div>

          <div class="p-6 space-y-4">
            <div class="wrong-question-card">
              <div class="flex items-center gap-4">
                <span class="text-2xl font-bold text-red-500">9 + 7 = 17</span>
                <span class="badge badge-error">错误2次</span>
              </div>
              <div class="flex gap-2">
                <button class="clay-button clay-button-primary py-2 px-4 text-sm" onclick="goToPage(11)">
                  <i data-lucide="edit-3" class="w-4 h-4"></i>
                  改错
                </button>
              </div>
            </div>

            <div class="wrong-question-card">
              <div class="flex items-center gap-4">
                <span class="text-2xl font-bold text-red-500">15 - 8 = 8</span>
                <span class="badge badge-error">错误1次</span>
              </div>
              <div class="flex gap-2">
                <button class="clay-button clay-button-primary py-2 px-4 text-sm">
                  <i data-lucide="edit-3" class="w-4 h-4"></i>
                  改错
                </button>
              </div>
            </div>

            <div class="wrong-question-card">
              <div class="flex items-center gap-4">
                <span class="text-2xl font-bold text-red-500">6 + 8 = 13</span>
                <span class="badge badge-error">错误1次</span>
              </div>
              <div class="flex gap-2">
                <button class="clay-button clay-button-primary py-2 px-4 text-sm">
                  <i data-lucide="edit-3" class="w-4 h-4"></i>
                  改错
                </button>
              </div>
            </div>

            <button class="clay-button clay-button-cta w-full mt-6">
              <i data-lucide="refresh-cw" class="w-4 h-4"></i>
              生成同类练习
            </button>
          </div>
        </div>

        <div id="page-10-empty" class="hidden">
          <div class="p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100 flex items-center gap-4">
            <button onclick="goToPage(9)" class="p-2 hover:bg-indigo-100 rounded-xl transition">
              <i data-lucide="arrow-left" class="w-5 h-5 text-indigo-600"></i>
            </button>
            <h2 class="text-xl font-bold text-indigo-900">错题本 / 一、整数加减法</h2>
          </div>
          <div class="empty-state">
            <div class="empty-state-icon">
              <i data-lucide="check-circle" class="w-16 h-16 text-green-300"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">本模块暂无错题</h3>
            <p class="text-gray-500 mb-6">继续保持！</p>
            <button class="clay-button clay-button-primary" onclick="goToPage(3)">
              继续学习
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./prototype.js"></script>
</body>
</html>
