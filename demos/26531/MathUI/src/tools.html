<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具 - 星童学</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./prototype.css">
</head>
<body class="min-h-screen pb-20">
  <div id="app" class="w-full min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-blue-100 shadow-2xl">
    <div id="contentRoot">
      <div id="page-12" class="page-container active">
        <div id="page-12-normal" class="fade-in">
          <nav class="lg:hidden flex justify-around p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100 sticky top-0 z-50">
            <div class="nav-item" onclick="goToPage(2)">
              <i data-lucide="home" class="w-5 h-5"></i>
              <span>首页</span>
            </div>
            <div class="nav-item" onclick="goToPage(3)">
              <i data-lucide="book-open" class="w-5 h-5"></i>
              <span>学习</span>
            </div>
            <div class="nav-item" onclick="goToPage(6)">
              <i data-lucide="pen-tool" class="w-5 h-5"></i>
              <span>练习</span>
            </div>
            <div class="nav-item" onclick="goToPage(9)">
              <i data-lucide="file-x" class="w-5 h-5"></i>
              <span>错题本</span>
            </div>
            <div class="nav-item active">
              <i data-lucide="wrench" class="w-5 h-5"></i>
              <span>工具</span>
            </div>
          </nav>

          <div class="p-6">
            <h2 class="text-2xl font-bold text-indigo-900 mb-6">工具</h2>
            <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-4">
              <div class="tool-card" onclick="goToPage(19)">
                <div class="w-16 h-16 bg-blue-100 rounded-2xl flex items-center justify-center mb-2">
                  <i data-lucide="grid-2x2-plus" class="w-8 h-8 text-blue-600"></i>
                </div>
                <span class="font-medium text-gray-700">十格阵</span>
              </div>

              <div class="tool-card" onclick="goToPage(13)">
                <div class="w-16 h-16 bg-rose-100 rounded-2xl flex items-center justify-center mb-2">
                  <i data-lucide="align-justify" class="w-8 h-8 text-rose-600"></i>
                </div>
                <span class="font-medium text-gray-700">小棒</span>
              </div>

              <div class="tool-card" onclick="goToPage(14)">
                <div class="w-16 h-16 bg-green-100 rounded-2xl flex items-center justify-center mb-2">
                  <i data-lucide="plus-minus" class="w-8 h-8 text-green-600"></i>
                </div>
                <span class="font-medium text-gray-700">计数器</span>
              </div>

              <div class="tool-card" onclick="goToPage(15)">
                <div class="w-16 h-16 bg-purple-100 rounded-2xl flex items-center justify-center mb-2">
                  <i data-lucide="git-branch" class="w-8 h-8 text-purple-600"></i>
                </div>
                <span class="font-medium text-gray-700">数字分解</span>
              </div>

              <div class="tool-card" onclick="goToPage(16)">
                <div class="w-16 h-16 bg-blue-100 rounded-2xl flex items-center justify-center mb-2">
                  <i data-lucide="ruler" class="w-8 h-8 text-blue-600"></i>
                </div>
                <span class="font-medium text-gray-700">数轴</span>
              </div>

              <div class="tool-card" onclick="goToPage(17)">
                <div class="w-16 h-16 bg-amber-100 rounded-2xl flex items-center justify-center mb-2">
                  <i data-lucide="cube" class="w-8 h-8 text-amber-600"></i>
                </div>
                <span class="font-medium text-gray-700">正方体10</span>
              </div>

              <div class="tool-card" onclick="goToPage(18)">
                <div class="w-16 h-16 bg-yellow-100 rounded-2xl flex items-center justify-center mb-2 text-3xl">🍌</div>
                <span class="font-medium text-gray-700">香蕉加减法</span>
              </div>
            </div>

            <div class="clay-card p-6 mt-8">
              <h3 class="text-lg font-bold text-indigo-900 mb-2">提示</h3>
              <p class="text-gray-600">点击任一工具卡片进入对应工具原型页；在工具页标题栏点击返回可回到此列表。</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./prototype.js"></script>
</body>
</html>
