<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具-串珠10 - 星童学</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./prototype.css">
</head>
<body class="min-h-screen pb-20">
  <div id="app" class="w-full min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-blue-100 shadow-2xl">
    <div id="contentRoot">
      <div id="page-17" class="page-container active">
        <div id="page-17-normal" class="fade-in">
          <div class="p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100 sticky top-0 z-50 flex items-center justify-between">
            <div class="flex items-center gap-4">
              <button onclick="goToPage(12)" class="p-2 hover:bg-indigo-100 rounded-xl transition" aria-label="返回工具列表">
                <i data-lucide="arrow-left" class="w-5 h-5 text-indigo-600"></i>
              </button>
              <h2 class="text-xl font-bold text-indigo-900">工具 / 串珠10</h2>
            </div>
            <button class="p-2 hover:bg-indigo-100 rounded-xl transition" aria-label="更多">
              <i data-lucide="more-horizontal" class="w-5 h-5 text-indigo-600"></i>
            </button>
          </div>
          <div class="p-6 space-y-6">
            <div class="clay-card p-6">
              <div class="flex items-center gap-3 mb-4">
                <div class="w-12 h-12 bg-amber-100 rounded-2xl flex items-center justify-center">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 text-amber-600">
                    <line x1="1" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    <circle cx="4" cy="12" r="2" />
                    <circle cx="8" cy="12" r="2" />
                    <circle cx="12" cy="12" r="2" />
                    <circle cx="16" cy="12" r="2" />
                    <circle cx="20" cy="12" r="2" />
                  </svg>
                </div>
                <div>
                  <h3 class="text-lg font-bold text-indigo-900">1 / 10 / 100 / 1000 十进制串珠</h3>
                  <p class="text-sm text-gray-500">添加/移除、自动合并与拆解借位</p>
                </div>
              </div>
              <div class="cube10-stage p-5">
                <div id="cube10Fx" class="cube10-fx" aria-hidden="true"></div>
                <div class="cube10-grid">
                  <div id="cube10BinOnes" class="cube10-bin relative">
                    <div class="flex items-center justify-between mb-3">
                      <div class="flex items-center gap-2">
                        <span class="text-sm font-bold text-gray-800">1（单珠）</span>
                      </div>
                      <span id="cube10CountOnes" class="cube10-count">0</span>
                    </div>
                    <div id="cube10ItemsOnes" class="cube10-items"></div>
                    <div class="absolute bottom-3 right-3 flex gap-1 z-10">
                      <button id="cube10Add1" class="w-8 h-8 rounded-full bg-white/90 shadow-sm border border-indigo-100 flex items-center justify-center hover:bg-indigo-50 transition" title="+1">
                        <i data-lucide="plus" class="w-4 h-4 text-indigo-600"></i>
                      </button>
                      <button id="cube10Sub1" class="w-8 h-8 rounded-full bg-white/90 shadow-sm border border-indigo-100 flex items-center justify-center hover:bg-indigo-50 transition" title="-1">
                        <i data-lucide="minus" class="w-4 h-4 text-indigo-600"></i>
                      </button>
                    </div>
                  </div>
                  <div id="cube10BinTens" class="cube10-bin relative">
                    <div class="flex items-center justify-between mb-3">
                      <div class="flex items-center gap-2">
                        <span class="text-sm font-bold text-gray-800">10（棒）</span>
                      </div>
                      <span id="cube10CountTens" class="cube10-count">0</span>
                    </div>
                    <div id="cube10ItemsTens" class="cube10-items"></div>
                    <div class="absolute bottom-3 right-3 flex gap-1 z-10">
                      <button id="cube10Add10" class="w-8 h-8 rounded-full bg-white/90 shadow-sm border border-indigo-100 flex items-center justify-center hover:bg-indigo-50 transition" title="+10">
                        <i data-lucide="plus" class="w-4 h-4 text-indigo-600"></i>
                      </button>
                      <button id="cube10Sub10" class="w-8 h-8 rounded-full bg-white/90 shadow-sm border border-indigo-100 flex items-center justify-center hover:bg-indigo-50 transition" title="-10">
                        <i data-lucide="minus" class="w-4 h-4 text-indigo-600"></i>
                      </button>
                    </div>
                  </div>
                  <div id="cube10BinHundreds" class="cube10-bin relative">
                    <div class="flex items-center justify-between mb-3">
                      <div class="flex items-center gap-2">
                        <span class="text-sm font-bold text-gray-800">100（板）</span>
                      </div>
                      <span id="cube10CountHundreds" class="cube10-count">0</span>
                    </div>
                    <div id="cube10ItemsHundreds" class="cube10-items"></div>
                    <div class="absolute bottom-3 right-3 flex gap-1 z-10">
                      <button id="cube10Add100" class="w-8 h-8 rounded-full bg-white/90 shadow-sm border border-indigo-100 flex items-center justify-center hover:bg-indigo-50 transition" title="+100">
                        <i data-lucide="plus" class="w-4 h-4 text-indigo-600"></i>
                      </button>
                      <button id="cube10Sub100" class="w-8 h-8 rounded-full bg-white/90 shadow-sm border border-indigo-100 flex items-center justify-center hover:bg-indigo-50 transition" title="-100">
                        <i data-lucide="minus" class="w-4 h-4 text-indigo-600"></i>
                      </button>
                    </div>
                  </div>
                  <div id="cube10BinThousands" class="cube10-bin relative">
                    <div class="flex items-center justify-between mb-3">
                      <div class="flex items-center gap-2">
                        <span class="text-sm font-bold text-gray-800">1000（大块）</span>
                      </div>
                      <span id="cube10CountThousands" class="cube10-count">0</span>
                    </div>
                    <div id="cube10ItemsThousands" class="cube10-items"></div>
                    <div class="absolute bottom-3 right-3 flex gap-1 z-10">
                      <button id="cube10Add1000" class="w-8 h-8 rounded-full bg-white/90 shadow-sm border border-indigo-100 flex items-center justify-center hover:bg-indigo-50 transition" title="+1000">
                        <i data-lucide="plus" class="w-4 h-4 text-indigo-600"></i>
                      </button>
                      <button id="cube10Sub1000" class="w-8 h-8 rounded-full bg-white/90 shadow-sm border border-indigo-100 flex items-center justify-center hover:bg-indigo-50 transition" title="-1000">
                        <i data-lucide="minus" class="w-4 h-4 text-indigo-600"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="mt-5 flex flex-wrap items-center gap-3">
                <div class="nl-pill px-4 py-2 text-sm">
                  总数：<span id="cube10Total" class="font-extrabold text-indigo-900">0</span>
                </div>
                <div class="nl-pill px-4 py-2 text-sm">
                  千/百/十/个：<span id="cube10Digits" class="font-extrabold text-indigo-900">0 / 0 / 0 / 0</span>
                </div>
                <button id="cube10ResetBtn" class="clay-button clay-button-secondary text-sm py-2 px-4" type="button">
                  <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                  重置
                </button>
                <div class="flex-1"></div>
                <div class="flex gap-2">
                  <button id="cube10DemoCarry" class="clay-button clay-button-secondary text-xs py-2 px-3" type="button">
                    <i data-lucide="play" class="w-4 h-4"></i>
                    999 + 1
                  </button>
                  <button id="cube10DemoBorrow" class="clay-button clay-button-secondary text-xs py-2 px-3" type="button">
                    <i data-lucide="play" class="w-4 h-4"></i>
                    1000 - 1
                  </button>
                  <button id="cube10StopBtn" class="clay-button clay-button-secondary text-xs py-2 px-3 hidden" type="button">
                    <i data-lucide="square" class="w-4 h-4"></i>
                    停止
                  </button>
                </div>
              </div>

              <div id="cube10Feedback" class="nl-hint mt-4 text-sm text-gray-700" aria-live="polite">提示：用每个区域内的 +/- 按钮添加或移除；满十自动合并，不足自动拆解借位。</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./prototype.js"></script>
</body>
</html>
