<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>改错-整数加减法 - 星童学</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./prototype.css">
</head>
<body class="min-h-screen pb-20">
  <div id="app" class="w-full min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-blue-100 shadow-2xl">
    <div id="contentRoot">
      <div id="page-11" class="page-container active">
        <div id="page-11-normal" class="fade-in">
          <div class="p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100 flex items-center justify-between sticky top-0 z-50">
            <div class="flex items-center gap-4">
              <button onclick="goToPage(10)" class="p-2 hover:bg-indigo-100 rounded-xl transition">
                <i data-lucide="arrow-left" class="w-5 h-5 text-indigo-600"></i>
              </button>
              <div>
                <h2 class="text-lg font-bold text-indigo-900">改错 / 一、整数加减法</h2>
                <p class="text-sm text-gray-500">第 1 / 9 题</p>
              </div>
            </div>
          </div>

          <div class="p-6">
            <div class="text-center mb-8">
              <div class="question-display inline-block mb-4">
                9 + 7 = ?
              </div>
              <div class="flex justify-center gap-4">
                <button class="clay-button clay-button-secondary">
                  <i data-lucide="chevron-left" class="w-4 h-4"></i>
                  上一题
                </button>
                <button class="clay-button clay-button-secondary">
                  下一题
                  <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            <div class="text-center mb-6">
              <div class="inline-flex items-center gap-2 bg-red-100 px-4 py-2 rounded-xl">
                <i data-lucide="x-circle" class="w-5 h-5 text-red-500"></i>
                <span class="text-red-600 font-medium">上次答案：17（错误）</span>
              </div>
            </div>

            <div class="text-center mb-8">
              <p class="text-gray-500 mb-4">请重新作答</p>
              <div class="answer-display inline-block mb-4" id="answerDisplay3"></div>
            </div>

            <div class="grid grid-cols-4 gap-3 max-w-sm mx-auto">
              <button class="number-key number-key-default" onclick="inputAnswer3(1)">1</button>
              <button class="number-key number-key-default" onclick="inputAnswer3(2)">2</button>
              <button class="number-key number-key-default" onclick="inputAnswer3(3)">3</button>
              <button class="number-key number-key-default" onclick="inputAnswer3(4)">4</button>
              <button class="number-key number-key-default" onclick="inputAnswer3(5)">5</button>
              <button class="number-key number-key-default" onclick="inputAnswer3(6)">6</button>
              <button class="number-key number-key-default" onclick="inputAnswer3(7)">7</button>
              <button class="number-key number-key-default" onclick="inputAnswer3(8)">8</button>
              <button class="number-key number-key-default" onclick="inputAnswer3(9)">9</button>
              <button class="number-key number-key-default" onclick="inputAnswer3(0)">0</button>
              <button class="number-key number-key-action" onclick="inputAnswer3('-')">±</button>
              <button class="number-key number-key-delete" onclick="deleteAnswer3()">
                <i data-lucide="backspace" class="w-5 h-5"></i>
              </button>
              <button class="number-key number-key-submit col-span-2" onclick="submitAnswer3()">
                <i data-lucide="check" class="w-5 h-5"></i>
                提交
              </button>
            </div>

            <div class="mt-8 flex justify-center">
              <button class="clay-button" style="background:#F1F5F9;border-color:#CBD5E1;color:#64748B">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
                移除错题本
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./prototype.js"></script>
</body>
</html>
