<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>练习-5以内加减法 - 星童学</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./prototype.css">
</head>
<body class="min-h-screen pb-20">
  <div id="app" class="w-full min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-blue-100 shadow-2xl">
    <div id="contentRoot">
      <div id="page-8" class="page-container active">
        <div id="page-8-normal" class="fade-in">
          <div class="p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100 flex items-center justify-between sticky top-0 z-50">
            <div class="flex items-center gap-4">
              <button onclick="goToPage(7)" class="p-2 hover:bg-indigo-100 rounded-xl transition">
                <i data-lucide="arrow-left" class="w-5 h-5 text-indigo-600"></i>
              </button>
              <div>
                <h2 class="text-lg font-bold text-indigo-900">练习 / 一、整数加减法</h2>
                <p class="text-sm text-gray-500">5以内加减法</p>
              </div>
            </div>
          </div>

          <div class="p-4 bg-indigo-50 flex justify-center gap-4">
            <button class="clay-button clay-button-secondary text-sm py-2 px-4">
              <i data-lucide="refresh-cw" class="w-4 h-4"></i>
              生成练习题
            </button>
            <button class="clay-button clay-button-secondary text-sm py-2 px-4">
              <i data-lucide="download" class="w-4 h-4"></i>
              下载练习题
            </button>
            <button class="clay-button clay-button-secondary text-sm py-2 px-4">
              <i data-lucide="upload" class="w-4 h-4"></i>
              上传答案
            </button>
          </div>

          <div class="p-6">
            <div class="flex flex-col lg:flex-row gap-10">
              <div class="flex-1">
                <div class="clay-card p-8">
                  <div class="flex items-center justify-between mb-6">
                    <span class="text-lg font-bold text-indigo-900">第 1 题 / 共 20 题</span>
                    <div class="flex gap-2">
                      <button class="clay-button clay-button-secondary py-2 px-3">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                      </button>
                      <button class="clay-button clay-button-secondary py-2 px-3">
                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>

                  <div class="text-center mb-8">
                    <div class="question-display inline-block mb-4">
                      8 + 7 = ?
                    </div>
                  </div>

                  <div class="text-center">
                    <p class="text-gray-500 mb-4">请输入答案</p>
                    <div class="answer-display inline-block mb-4" id="answerDisplay2"></div>
                  </div>
                </div>
              </div>

              <div class="w-full lg:w-[420px] xl:w-[480px]">
                <div class="clay-card p-6">
                  <div class="bg-indigo-50/60 border border-indigo-100 rounded-2xl p-4">
                    <div class="grid grid-cols-3 gap-3 w-full max-w-sm mx-auto">
                      <button class="number-key number-key-default" onclick="inputAnswer2(1)">1</button>
                      <button class="number-key number-key-default" onclick="inputAnswer2(2)">2</button>
                      <button class="number-key number-key-default" onclick="inputAnswer2(3)">3</button>
                      <button class="number-key number-key-default" onclick="inputAnswer2(4)">4</button>
                      <button class="number-key number-key-default" onclick="inputAnswer2(5)">5</button>
                      <button class="number-key number-key-default" onclick="inputAnswer2(6)">6</button>
                      <button class="number-key number-key-default" onclick="inputAnswer2(7)">7</button>
                      <button class="number-key number-key-default" onclick="inputAnswer2(8)">8</button>
                      <button class="number-key number-key-default" onclick="inputAnswer2(9)">9</button>
                      <button class="number-key number-key-default" onclick="inputAnswer2('.')">.</button>
                      <button class="number-key number-key-default" onclick="inputAnswer2(0)">0</button>
                      <button class="number-key number-key-delete" onclick="deleteAnswer2()">⌫</button>
                    </div>
                    <div class="mt-4 flex justify-center">
                      <button class="clay-button clay-button-primary w-full max-w-sm justify-center" onclick="submitAnswer2()">
                        <i data-lucide="check" class="w-5 h-5"></i>
                        提交答案
                      </button>
                    </div>
                  </div>

                  <div class="mt-8">
                    <h3 class="text-lg font-bold text-indigo-900 mb-4 text-center">辅助工具</h3>
                    <div class="grid grid-cols-3 gap-4">
                      <div class="tool-card">
                        <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center">
                          <i data-lucide="grid-3x3" class="w-6 h-6 text-blue-600"></i>
                        </div>
                        <span class="font-medium text-gray-700">十格阵</span>
                      </div>
                      <div class="tool-card">
                        <div class="w-12 h-12 bg-green-100 rounded-xl flex items-center justify-center">
                          <i data-lucide="plus-minus" class="w-6 h-6 text-green-600"></i>
                        </div>
                        <span class="font-medium text-gray-700">计数器</span>
                      </div>
                      <div class="tool-card">
                        <div class="w-12 h-12 bg-orange-100 rounded-xl flex items-center justify-center">
                          <i data-lucide="square" class="w-6 h-6 text-orange-600"></i>
                        </div>
                        <span class="font-medium text-gray-700">正方形</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div id="page-8-empty" class="hidden">
          <div class="p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100 flex items-center gap-4">
            <button onclick="goToPage(7)" class="p-2 hover:bg-indigo-100 rounded-xl transition">
              <i data-lucide="arrow-left" class="w-5 h-5 text-indigo-600"></i>
            </button>
            <h2 class="text-xl font-bold text-indigo-900">练习 / 一、整数加减法</h2>
          </div>
          <div class="empty-state">
            <div class="empty-state-icon">
              <i data-lucide="file-text" class="w-16 h-16 text-indigo-300"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">暂无练习题</h3>
            <p class="text-gray-500 mb-6">请点击“生成练习题”开始练习</p>
            <button class="clay-button clay-button-cta">
              <i data-lucide="refresh-cw" class="w-4 h-4"></i>
              生成练习题
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./prototype.js"></script>
</body>
</html>
