<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具-小棒 - 星童学</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./prototype.css">
</head>
<body class="min-h-screen pb-20">
  <div id="app" class="w-full min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-blue-100 shadow-2xl">
    <div id="contentRoot">
      <div id="page-13" class="page-container active">
        <div id="page-13-normal" class="fade-in">
          <div class="p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100 sticky top-0 z-50 flex items-center justify-between">
            <div class="flex items-center gap-4">
              <button onclick="goToPage(12)" class="p-2 hover:bg-indigo-100 rounded-xl transition" aria-label="返回工具列表">
                <i data-lucide="arrow-left" class="w-5 h-5 text-indigo-600"></i>
              </button>
              <h2 class="text-xl font-bold text-indigo-900">工具 / 小棒</h2>
            </div>
            <button class="p-2 hover:bg-indigo-100 rounded-xl transition" aria-label="更多">
              <i data-lucide="more-horizontal" class="w-5 h-5 text-indigo-600"></i>
            </button>
          </div>
          <div class="p-6 space-y-6">
            <div class="clay-card p-6">
              <div class="flex items-center gap-3 mb-4">
                <div class="w-12 h-12 bg-rose-100 rounded-2xl flex items-center justify-center">
                  <i data-lucide="align-justify" class="w-6 h-6 text-rose-600"></i>
                </div>
                <div>
                  <h3 class="text-lg font-bold text-indigo-900">100 以内数的认识与加减</h3>
                  <p class="text-sm text-gray-500">个位单棒 / 十位成捆（满十自动合并、借位自动拆捆）</p>
                </div>
              </div>
              
              <!-- Tabs -->
              <div class="flex items-center gap-2 mb-4 border-b border-indigo-100 pb-2">
                <button class="px-4 py-2 text-sm font-bold text-indigo-600 border-b-2 border-indigo-600" onclick="switchTab('recognition')">识数</button>
                <button class="px-4 py-2 text-sm font-medium text-gray-500 hover:text-indigo-600" onclick="switchTab('addition')">加法</button>
                <button class="px-4 py-2 text-sm font-medium text-gray-500 hover:text-indigo-600" onclick="switchTab('subtraction')">减法</button>
              </div>

              <!-- 识数页面 -->
              <div id="tab-recognition" class="grid grid-cols-1 lg:grid-cols-2 gap-5 mt-4">
                <!-- 左侧：小棒演示区 -->
                <div class="p-4 rounded-2xl border border-indigo-100 bg-indigo-50/50 flex flex-col">
                  <div class="flex items-center justify-between bg-white p-3 rounded-xl border border-indigo-100">
                    <p class="text-sm font-bold text-indigo-900">演示区（捆与单棒）</p>
                    <span class="text-xs text-gray-500">一捆和单个在同个区域显示</span>
                  </div>
                  <div class="flex-1 flex flex-wrap content-start gap-4 mt-3 p-4 bg-white rounded-xl border border-indigo-100 min-h-[300px]" id="stickRecognitionArea">
                    <div id="stickTensArea" class="stick-area stick-area-tens flex flex-wrap gap-2"></div>
                    <div id="stickOnesArea" class="stick-area stick-area-ones flex flex-wrap gap-2"></div>
                  </div>
                </div>

                <!-- 右侧：操作区 -->
                <div class="space-y-4">
                  <div class="p-4 rounded-2xl border border-indigo-100 bg-indigo-50/50">
                    <div class="flex items-start justify-between gap-3">
                      <div>
                        <p class="text-sm text-gray-500">当前数值</p>
                        <div class="mt-1 flex items-end gap-2">
                          <div class="text-4xl font-extrabold text-indigo-900" id="stickTotalValue">0</div>
                          <div class="text-sm text-gray-500 mb-1">（总数）</div>
                        </div>
                      </div>
                      <div class="text-right">
                        <p class="text-xs text-gray-500">十位 / 个位</p>
                        <div class="mt-1 flex items-center justify-end gap-2">
                          <div class="w-12 h-12 bg-white rounded-xl border border-indigo-100 flex items-center justify-center font-extrabold text-indigo-900 text-lg" id="stickTensValue">0</div>
                          <span class="text-gray-400">捆</span>
                          <div class="w-12 h-12 bg-white rounded-xl border border-indigo-100 flex items-center justify-center font-extrabold text-indigo-900 text-lg" id="stickOnesValue">0</div>
                          <span class="text-gray-400">根</span>
                        </div>
                      </div>
                    </div>
                    <!-- 新增算式显示 -->
                    <div class="mt-3 pt-3 border-t border-indigo-100 text-center">
                      <span class="text-xs text-gray-400 uppercase tracking-wider">算式：</span>
                      <span id="stickExpression" class="text-lg font-bold text-indigo-600">--</span>
                    </div>
                  </div>

                  <div class="p-4 rounded-2xl border border-indigo-100 bg-white">
                    <p class="text-sm text-gray-500 mb-3">操作</p>
                    <div class="grid grid-cols-2 gap-3">
                      <button id="stickBtnMinus10" class="clay-button clay-button-secondary text-sm py-2 px-4 justify-center">
                        <i data-lucide="minus" class="w-4 h-4"></i>
                        减 10
                      </button>
                      <button id="stickBtnPlus10" class="clay-button clay-button-cta text-sm py-2 px-4 justify-center">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        加 10
                      </button>
                      <button id="stickBtnMinus1" class="clay-button clay-button-secondary text-sm py-2 px-4 justify-center">
                        <i data-lucide="minus" class="w-4 h-4"></i>
                        减 1
                      </button>
                      <button id="stickBtnPlus1" class="clay-button clay-button-cta text-sm py-2 px-4 justify-center">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        加 1
                      </button>
                    </div>
                  </div>

                  <div class="p-4 rounded-2xl border border-indigo-100 bg-white">
                    <p class="text-sm text-gray-500 mb-3">数字设定</p>
                    <div class="flex gap-3">
                      <input type="number" id="stickCustomInput" class="flex-1 border border-indigo-200 rounded-xl px-3 py-2 text-indigo-900 font-bold" placeholder="输入0-100">
                      <button id="stickBtnSet" class="clay-button clay-button-primary text-sm py-2 px-4">设定</button>
                    </div>
                  </div>

                  <!-- 新增步骤提示 -->
                  <div id="stickStepText" class="nl-hint text-sm text-gray-600">提示：满十会自动合并成 1 捆；个位为 0 再减会自动拆 1 捆借位。</div>
                </div>
              </div>

              <!-- 加法页面 -->
              <div id="tab-addition" class="grid grid-cols-1 lg:grid-cols-2 gap-5 mt-4 hidden">
                <!-- 左侧：小棒演示区 -->
                <div class="p-4 rounded-2xl border border-indigo-100 bg-indigo-50/50 flex flex-col">
                  <div class="flex items-center justify-between bg-white p-3 rounded-xl border border-indigo-100">
                    <p class="text-sm font-bold text-indigo-900">加法演示区</p>
                    <span class="text-xs text-gray-500">满十进一</span>
                  </div>
                  <div class="flex-1 flex gap-4 mt-3 p-4 bg-white rounded-xl border border-indigo-100 min-h-[300px]">
                    <div class="w-1/2 min-h-0 border-r border-dashed border-indigo-100 pr-2 stick-area stick-area-tens" id="stickAddTensArea"></div>
                    <div class="w-1/2 min-h-0 pl-2 stick-area stick-area-ones" id="stickAddOnesArea"></div>
                  </div>
                </div>

                <!-- 右侧：操作区 -->
                <div class="space-y-4">
                  <div class="p-4 rounded-2xl border border-indigo-100 bg-white">
                    <p class="text-sm text-gray-500 mb-3">加法算式</p>
                    <div class="text-2xl font-extrabold text-indigo-900 mb-4 text-center" id="stickAddExpression">18 + 5 = 23</div>
                    <div class="flex gap-3 flex-wrap justify-center">
                      <button id="stickDemoAddCarry" class="clay-button clay-button-primary text-sm py-2 px-4">
                        <i data-lucide="play" class="w-4 h-4"></i>
                        播放进位加法 18 + 5
                      </button>
                      <button id="stickDemoStop" class="clay-button clay-button-secondary text-sm py-2 px-4">
                        <i data-lucide="square" class="w-4 h-4"></i>
                        停止
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <!-- 减法页面 -->
              <div id="tab-subtraction" class="grid grid-cols-1 lg:grid-cols-2 gap-5 mt-4 hidden">
                <!-- 左侧：小棒演示区 -->
                <div class="p-4 rounded-2xl border border-indigo-100 bg-indigo-50/50 flex flex-col">
                  <div class="flex items-center justify-between bg-white p-3 rounded-xl border border-indigo-100">
                    <p class="text-sm font-bold text-indigo-900">减法演示区</p>
                    <span class="text-xs text-gray-500">借一当十</span>
                  </div>
                  <div class="flex-1 flex gap-4 mt-3 p-4 bg-white rounded-xl border border-indigo-100 min-h-[300px]">
                    <div class="w-1/2 min-h-0 border-r border-dashed border-indigo-100 pr-2 stick-area stick-area-tens" id="stickSubTensArea"></div>
                    <div class="w-1/2 min-h-0 pl-2 stick-area stick-area-ones" id="stickSubOnesArea"></div>
                  </div>
                </div>

                <!-- 右侧：操作区 -->
                <div class="space-y-4">
                  <div class="p-4 rounded-2xl border border-indigo-100 bg-white">
                    <p class="text-sm text-gray-500 mb-3">减法算式</p>
                    <div class="text-2xl font-extrabold text-indigo-900 mb-4 text-center" id="stickSubExpression">32 - 7 = 25</div>
                    <div class="flex gap-3 flex-wrap justify-center">
                      <button id="stickDemoSubBorrow" class="clay-button clay-button-primary text-sm py-2 px-4">
                        <i data-lucide="play" class="w-4 h-4"></i>
                        播放退位减法 32 - 7
                      </button>
                      <button id="stickDemoStop2" class="clay-button clay-button-secondary text-sm py-2 px-4">
                        <i data-lucide="square" class="w-4 h-4"></i>
                        停止
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    function switchTab(tabId) {
      // 隐藏所有标签页内容
      document.getElementById('tab-recognition').classList.add('hidden');
      document.getElementById('tab-addition').classList.add('hidden');
      document.getElementById('tab-subtraction').classList.add('hidden');
      
      // 显示选中的标签页内容
      document.getElementById('tab-' + tabId).classList.remove('hidden');
      
      // 更新标签样式
      const tabs = document.querySelectorAll('.border-b.border-indigo-100 > button');
      tabs.forEach(tab => {
        tab.className = 'px-4 py-2 text-sm font-medium text-gray-500 hover:text-indigo-600';
      });
      
      // 选中项的样式
      const activeTab = event.target;
      activeTab.className = 'px-4 py-2 text-sm font-bold text-indigo-600 border-b-2 border-indigo-600';
    }
  </script>
  <script src="./prototype.js"></script>
</body>
</html>
