<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具-计数器 - 星童学</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./prototype.css">
</head>
<body class="min-h-screen pb-20">
  <div id="app" class="w-full min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-blue-100 shadow-2xl">
    <div id="contentRoot">
      <div id="page-14" class="page-container active">
        <div id="page-14-normal" class="fade-in">
          <div class="p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100 sticky top-0 z-50 flex items-center justify-between">
            <div class="flex items-center gap-4">
              <button onclick="goToPage(12)" class="p-2 hover:bg-indigo-100 rounded-xl transition" aria-label="返回工具列表">
                <i data-lucide="arrow-left" class="w-5 h-5 text-indigo-600"></i>
              </button>
              <h2 class="text-xl font-bold text-indigo-900">工具 / 计数器</h2>
            </div>
            <button class="p-2 hover:bg-indigo-100 rounded-xl transition" aria-label="更多">
              <i data-lucide="more-horizontal" class="w-5 h-5 text-indigo-600"></i>
            </button>
          </div>
          <div class="p-6 space-y-6">
            <div class="clay-card p-6">
              <div class="flex items-center gap-3 mb-4">
                <div class="w-12 h-12 bg-green-100 rounded-2xl flex items-center justify-center">
                  <i data-lucide="plus-minus" class="w-6 h-6 text-green-600"></i>
                </div>
                <div>
                  <h3 class="text-lg font-bold text-indigo-900">理解数位与十进制</h3>
                  <p class="text-sm text-gray-500">覆盖个位到千万位：逐位 +1/-1，并自动处理进位与借位</p>
                </div>
              </div>
              <div class="pv-board">
                <div id="counterPvColumns" class="pv-columns" aria-label="八位计数器（个位到千万位）"></div>
                <div id="counterPvTotal" class="pv-total pv-total-value" aria-live="polite">0</div>
                <div id="counterPvHint" class="mt-3 text-xs text-gray-500" aria-live="polite">提示：点击每一列的 + / - 改变该位；满 10 会自动进位，借位会从高位拆 1。横向滑动可查看高位。</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./prototype.js"></script>
</body>
</html>
