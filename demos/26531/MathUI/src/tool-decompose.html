<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具-数字分解 - 星童学</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./prototype.css">
</head>
<body class="min-h-screen pb-20">
  <div id="app" class="w-full min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-blue-100 shadow-2xl">
    <div id="contentRoot">
      <div id="page-15" class="page-container active">
        <div id="page-15-normal" class="fade-in">
          <div class="p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100 sticky top-0 z-50 flex items-center justify-between">
            <div class="flex items-center gap-4">
              <button onclick="goToPage(12)" class="p-2 hover:bg-indigo-100 rounded-xl transition" aria-label="返回工具列表">
                <i data-lucide="arrow-left" class="w-5 h-5 text-indigo-600"></i>
              </button>
              <h2 class="text-xl font-bold text-indigo-900">工具 / 数字分解</h2>
            </div>
            <button class="p-2 hover:bg-indigo-100 rounded-xl transition" aria-label="更多">
              <i data-lucide="more-horizontal" class="w-5 h-5 text-indigo-600"></i>
            </button>
          </div>
          <div class="p-6 space-y-6">
            <div class="clay-card decomp-card p-6">
              <div class="flex items-center gap-3 mb-4">
                <div class="w-12 h-12 bg-purple-100 rounded-2xl flex items-center justify-center">
                  <i data-lucide="git-branch" class="w-6 h-6 text-purple-600"></i>
                </div>
                <div>
                  <h3 class="text-lg font-bold text-indigo-900">10 以内分合</h3>
                  <p class="text-sm text-gray-500">设置整体（1-10）/ 左右联动 / 随机分配 / “？”遮蔽填空 / 实物同步展示</p>
                </div>
              </div>
              <div class="grid lg:grid-cols-3 gap-4 items-start">
                <div class="lg:col-span-2 space-y-4">
                  <div class="p-4 rounded-2xl border border-indigo-100 bg-indigo-50/50">
                    <div class="flex items-center justify-between gap-3 flex-wrap">
                      <div class="flex items-center gap-2">
                        <i data-lucide="hash" class="w-4 h-4 text-indigo-600"></i>
                        <span class="font-bold text-indigo-900">整体数</span>
                        <span class="text-xs text-gray-500">1-10</span>
                      </div>
                      <div class="flex items-center gap-2">
                        <input id="decompTotalInput" class="clay-input !py-2 !px-3 !text-base !w-24" type="number" min="1" max="10" step="1" value="6" aria-label="设置整体数（1到10）">
                        <button id="decompRandomBtn" class="clay-button clay-button-secondary text-sm py-2 px-4" type="button">
                          <i data-lucide="shuffle" class="w-4 h-4"></i>
                          随机分配
                        </button>
                      </div>
                    </div>
                    <div id="decompTotalChips" class="mt-3 flex flex-wrap gap-2" aria-label="整体数快捷选择（1到10）"></div>
                  </div>

                  <div class="decomp-diagram p-5">
                    <div class="relative h-[280px]">
                      <svg class="absolute inset-0 w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
                        <!-- 连接线渐变定义 -->
                        <defs>
                          <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:rgba(34, 197, 94, 0.45)" />
                            <stop offset="100%" style="stop-color:rgba(79, 70, 229, 0.35)" />
                          </linearGradient>
                        </defs>
                        <path d="M50 24 L20 64" stroke="url(#lineGrad)" stroke-width="0.95" stroke-linecap="round" fill="none"></path>
                        <path d="M50 24 L80 64" stroke="url(#lineGrad)" stroke-width="0.95" stroke-linecap="round" fill="none"></path>
                        <path d="M20 64 L80 64" stroke="rgba(79, 70, 229, 0.12)" stroke-width="0.55" stroke-linecap="round" stroke-dasharray="2 2" fill="none"></path>
                      </svg>
                      <div class="absolute left-1/2 top-[14px] -translate-x-1/2">
                        <div class="decomp-node decomp-node-total" id="decompTotalNode">
                          <div class="decomp-node-label">整体</div>
                          <div class="decomp-node-value" id="decompTotalValue">6</div>
                        </div>
                      </div>
                      <div class="absolute left-[20%] top-[134px] -translate-x-1/2">
                        <div class="decomp-node" id="decompLeftNode">
                          <div class="decomp-node-label">左边</div>
                          <div class="decomp-node-value" id="decompLeftValue">3</div>
                        </div>
                      </div>
                      <div class="absolute left-1/2 top-[153px] -translate-x-1/2">
                        <div class="decomp-plus" aria-hidden="true">+</div>
                      </div>
                      <div class="absolute left-[80%] top-[134px] -translate-x-1/2">
                        <div class="decomp-node" id="decompRightNode">
                          <div class="decomp-node-label">右边</div>
                          <div class="decomp-node-value" id="decompRightValue">3</div>
                        </div>
                      </div>
                      <div class="absolute left-1/2 bottom-[6px] -translate-x-1/2 text-xs text-gray-500 text-center px-3 py-2 rounded-xl bg-white/70 border border-indigo-100 backdrop-blur-sm">
                        点击实物可在左右之间移动；加/减会自动保持“左 + 右 = 整体”
                      </div>
                    </div>
                  </div>

                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div id="decompLeftPanel" class="decomp-side p-4">
                      <div class="decomp-side-header">
                        <div class="flex items-center gap-2">
                          <span class="decomp-side-title">左边</span>
                          <span class="text-xs text-gray-500">部分数</span>
                        </div>
                        <div class="flex items-center gap-3">
                          <div class="decomp-side-count" id="decompLeftCount">3</div>
                          <div class="decomp-side-actions">
                            <button id="decompLeftMinus" class="decomp-mini-btn" type="button" aria-label="左边移除 1 个">
                              <i data-lucide="minus" class="w-5 h-5 text-indigo-600"></i>
                            </button>
                            <button id="decompLeftPlus" class="decomp-mini-btn" type="button" aria-label="左边添加 1 个">
                              <i data-lucide="plus" class="w-5 h-5 text-indigo-600"></i>
                            </button>
                          </div>
                        </div>
                      </div>
                      <div class="mt-3 relative">
                        <div id="decompLeftArea" class="decomp-items" aria-label="左边实物区域"></div>
                        <div class="decomp-mask-overlay" aria-hidden="true">
                          <div class="decomp-mask-badge">？</div>
                        </div>
                      </div>
                    </div>
                    <div id="decompRightPanel" class="decomp-side p-4">
                      <div class="decomp-side-header">
                        <div class="flex items-center gap-2">
                          <span class="decomp-side-title">右边</span>
                          <span class="text-xs text-gray-500">部分数</span>
                        </div>
                        <div class="flex items-center gap-3">
                          <div class="decomp-side-count" id="decompRightCount">3</div>
                          <div class="decomp-side-actions">
                            <button id="decompRightMinus" class="decomp-mini-btn" type="button" aria-label="右边移除 1 个">
                              <i data-lucide="minus" class="w-5 h-5 text-indigo-600"></i>
                            </button>
                            <button id="decompRightPlus" class="decomp-mini-btn" type="button" aria-label="右边添加 1 个">
                              <i data-lucide="plus" class="w-5 h-5 text-indigo-600"></i>
                            </button>
                          </div>
                        </div>
                      </div>
                      <div class="mt-3 relative">
                        <div id="decompRightArea" class="decomp-items" aria-label="右边实物区域"></div>
                        <div class="decomp-mask-overlay" aria-hidden="true">
                          <div class="decomp-mask-badge">？</div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="space-y-4">
                  <div class="p-4 rounded-2xl border border-indigo-100 bg-white">
                    <div class="flex items-center justify-between gap-3">
                      <div class="flex items-center gap-2">
                        <i data-lucide="help-circle" class="w-4 h-4 text-indigo-600"></i>
                        <span class="font-bold text-indigo-900">“？”遮蔽</span>
                      </div>
                      <span class="text-xs text-gray-500">填空校验</span>
                    </div>
                    <div class="mt-3 flex flex-wrap gap-2">
                      <button id="decompMaskNone" class="decomp-chip is-active" type="button">不遮蔽</button>
                      <button id="decompMaskLeft" class="decomp-chip" type="button">遮蔽左边</button>
                      <button id="decompMaskRight" class="decomp-chip" type="button">遮蔽右边</button>
                    </div>
                    <div class="mt-3 grid grid-cols-[1fr_auto] gap-2">
                      <input id="decompAnswerInput" class="clay-input !py-2 !px-3 !text-base" inputmode="numeric" placeholder="输入“？”的数字" aria-label="输入遮蔽侧的数字">
                      <button id="decompCheckBtn" class="clay-button clay-button-cta text-sm py-2 px-4" type="button">
                        <i data-lucide="check" class="w-4 h-4"></i>
                        校验
                      </button>
                    </div>
                    <div id="decompFeedback" class="decomp-feedback mt-3" aria-live="polite">
                      <div class="decomp-feedback-icon">
                        <i data-lucide="sparkles" class="w-4 h-4 text-indigo-600"></i>
                      </div>
                      <div class="text-sm text-gray-600" id="decompFeedbackText">提示：先遮蔽一侧，再输入答案进行校验</div>
                    </div>
                  </div>

                  <div class="p-4 rounded-2xl border border-indigo-100 bg-white">
                    <div class="flex items-center justify-between gap-3">
                      <div class="flex items-center gap-2">
                        <i data-lucide="package" class="w-4 h-4 text-indigo-600"></i>
                        <span class="font-bold text-indigo-900">实物选择</span>
                      </div>
                      <span class="text-xs text-gray-500">至少 3 种</span>
                    </div>
                    <div id="decompItemPicker" class="mt-3 flex flex-col gap-2" aria-label="实物类型选择">
                      <button class="decomp-chip is-active justify-between" type="button" data-item="apple">
                        <span class="flex items-center gap-2"><span class="text-xl">🍎</span><span>苹果</span></span>
                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                      </button>
                      <button class="decomp-chip justify-between" type="button" data-item="grape">
                        <span class="flex items-center gap-2"><span class="text-xl">🍇</span><span>葡萄</span></span>
                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                      </button>
                      <button class="decomp-chip justify-between" type="button" data-item="soccer">
                        <span class="flex items-center gap-2"><span class="text-xl">⚽</span><span>足球</span></span>
                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                      </button>
                    </div>
                    <div class="mt-3 text-xs text-gray-500">更换实物会同步刷新左右两侧展示。</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./prototype.js"></script>
</body>
</html>
