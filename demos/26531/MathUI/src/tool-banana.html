<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具-香蕉加减法 - 星童学</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./prototype.css">
</head>
<body class="min-h-screen pb-20">
  <div id="app" class="w-full min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-blue-100 shadow-2xl">
    <div id="contentRoot">
      <div id="page-18" class="page-container active">
        <div id="page-18-normal" class="fade-in">
          <div class="p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100 sticky top-0 z-50 flex items-center justify-between">
            <div class="flex items-center gap-4">
              <button onclick="goToPage(12)" class="p-2 hover:bg-indigo-100 rounded-xl transition" aria-label="返回工具列表">
                <i data-lucide="arrow-left" class="w-5 h-5 text-indigo-600"></i>
              </button>
              <h2 class="text-xl font-bold text-indigo-900">工具 / 香蕉加减法</h2>
            </div>
            <button class="p-2 hover:bg-indigo-100 rounded-xl transition" aria-label="更多">
              <i data-lucide="more-horizontal" class="w-5 h-5 text-indigo-600"></i>
            </button>
          </div>
          <div class="p-6 space-y-6">
            <div class="clay-card p-6">
              <div class="flex items-center gap-3 mb-4">
                <div class="w-12 h-12 bg-yellow-100 rounded-2xl flex items-center justify-center text-2xl">🍌</div>
                <div>
                  <h3 class="text-lg font-bold text-indigo-900">故事化 100 以内加减演示</h3>
                  <p class="text-sm text-gray-500">单根（1）/一串（10），满十自动成串、个位不足自动拆串借位（0-99）</p>
                </div>
              </div>
              <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
                <div class="lg:col-span-2">
                  <div class="p-5 rounded-2xl border border-indigo-100 bg-indigo-50/50">
                    <div class="flex flex-wrap items-end justify-between gap-3">
                      <div>
                        <div class="text-sm font-bold text-gray-800">当前香蕉</div>
                        <div class="mt-1 flex items-baseline gap-3">
                          <div class="text-3xl font-extrabold text-indigo-900"><span id="bananaTotal">0</span></div>
                          <div class="text-sm text-gray-500">十位/个位：<span id="bananaDigits" class="font-bold text-indigo-700">0 / 0</span></div>
                        </div>
                      </div>
                      <div class="text-sm text-gray-600">表达式：<span id="bananaExpression" class="font-bold text-indigo-800">—</span></div>
                    </div>

                    <div id="bananaStage" class="banana-stage mt-4 p-4 rounded-2xl border border-indigo-100 bg-white/70 relative overflow-visible">
                      <div id="bananaFx" class="banana-fx" aria-hidden="true"></div>
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div id="bananaBinTens" class="banana-bin" data-level="tens" aria-label="十位区（成串）" tabindex="0">
                          <div class="flex items-center justify-between gap-2">
                            <div class="text-sm font-bold text-gray-800">十位区 <span class="text-xs font-semibold text-gray-500">（一串=10）</span></div>
                            <div class="text-xs text-gray-600"><span id="bananaCountTens" class="font-bold text-indigo-800">0</span> 串</div>
                          </div>
                          <div id="bananaItemsTens" class="banana-items mt-3" aria-label="十位区香蕉列表"></div>
                          <div class="mt-3 text-xs text-gray-500">可拖拽“成串”到这里</div>
                        </div>
                        <div id="bananaBinOnes" class="banana-bin" data-level="ones" aria-label="个位区（单根）" tabindex="0">
                          <div class="flex items-center justify-between gap-2">
                            <div class="text-sm font-bold text-gray-800">个位区 <span class="text-xs font-semibold text-gray-500">（单根=1）</span></div>
                            <div class="text-xs text-gray-600"><span id="bananaCountOnes" class="font-bold text-indigo-800">0</span> 根</div>
                          </div>
                          <div id="bananaItemsOnes" class="banana-items mt-3" aria-label="个位区香蕉列表"></div>
                          <div class="mt-3 text-xs text-gray-500">可拖拽“单根”到这里</div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="space-y-4">
                  <div class="p-4 rounded-2xl border border-indigo-100 bg-indigo-50/50">
                    <div class="text-sm font-bold text-gray-800 mb-3">添加 / 移除</div>
                    <div class="grid grid-cols-2 gap-2">
                      <button id="bananaAdd1" class="clay-button clay-button-secondary text-sm py-2 px-3" type="button">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        +1
                      </button>
                      <button id="bananaSub1" class="clay-button clay-button-secondary text-sm py-2 px-3" type="button">
                        <i data-lucide="minus" class="w-4 h-4"></i>
                        -1
                      </button>
                      <button id="bananaAdd10" class="clay-button clay-button-secondary text-sm py-2 px-3" type="button">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        +10
                      </button>
                      <button id="bananaSub10" class="clay-button clay-button-secondary text-sm py-2 px-3" type="button">
                        <i data-lucide="minus" class="w-4 h-4"></i>
                        -10
                      </button>
                    </div>
                    <div class="mt-3 text-xs text-gray-500">提示：也可以拖拽或点击香蕉来移除。</div>
                  </div>

                  <div class="p-4 rounded-2xl border border-indigo-100 bg-indigo-50/50">
                    <div class="text-sm font-bold text-gray-800 mb-3">拖拽区</div>
                    <div class="flex items-center gap-3 flex-wrap">
                      <div id="bananaDragSingle" class="banana-drag" draggable="true" aria-label="拖拽添加单根">🍌<span class="banana-drag-badge">1</span></div>
                      <div id="bananaDragBunch" class="banana-drag" draggable="true" aria-label="拖拽添加成串">🍌🍌🍌<span class="banana-drag-badge">10</span></div>
                      <div id="bananaTrash" class="banana-trash" aria-label="香蕉皮桶（拖拽移除）">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                        <span>丢掉</span>
                      </div>
                    </div>
                  </div>

                  <div class="p-4 rounded-2xl border border-indigo-100 bg-indigo-50/50">
                    <div class="flex items-center justify-between gap-3">
                      <div class="text-sm font-bold text-gray-800">故事演示（一键播放）</div>
                      <button id="bananaStopBtn" class="clay-button clay-button-secondary text-xs py-2 px-3" type="button">
                        <i data-lucide="square" class="w-4 h-4"></i>
                        停止
                      </button>
                    </div>
                    <div class="mt-3 grid grid-cols-1 gap-2">
                      <button id="bananaDemo18Add5" class="clay-button clay-button-secondary text-sm py-2 px-4 justify-start" type="button">
                        <i data-lucide="play" class="w-4 h-4"></i>
                        演示 18 + 5
                      </button>
                      <button id="bananaDemo32Sub7" class="clay-button clay-button-secondary text-sm py-2 px-4 justify-start" type="button">
                        <i data-lucide="play" class="w-4 h-4"></i>
                        演示 32 - 7
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div id="bananaFeedback" class="nl-hint mt-5 text-sm text-gray-700" aria-live="polite">提示：个位满 10 会自动扎成一串并移到十位区；个位不够减时会自动拆一串变成 10 根继续“吃掉”。</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./prototype.js"></script>
</body>
</html>
