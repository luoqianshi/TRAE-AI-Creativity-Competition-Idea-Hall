<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>练习 - 星童学</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./prototype.css">
</head>
<body class="min-h-screen pb-20">
  <div id="app" class="w-full min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-blue-100 shadow-2xl">
    <div id="contentRoot">
      <div id="page-6" class="page-container active">
        <div id="page-6-normal" class="fade-in">
          <nav class="lg:hidden flex justify-around p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100 sticky top-0 z-50">
            <div class="nav-item" onclick="goToPage(2)">
              <i data-lucide="home" class="w-5 h-5"></i>
              <span>首页</span>
            </div>
            <div class="nav-item" onclick="goToPage(3)">
              <i data-lucide="book-open" class="w-5 h-5"></i>
              <span>学习</span>
            </div>
            <div class="nav-item active">
              <i data-lucide="pen-tool" class="w-5 h-5"></i>
              <span>练习</span>
            </div>
            <div class="nav-item" onclick="goToPage(9)">
              <i data-lucide="file-x" class="w-5 h-5"></i>
              <span>错题本</span>
            </div>
            <div class="nav-item" onclick="goToPage(12)">
              <i data-lucide="wrench" class="w-5 h-5"></i>
              <span>工具</span>
            </div>
          </nav>

          <div class="p-6">
            <h2 class="text-2xl font-bold text-indigo-900 mb-6">练习模块</h2>
            <div class="grid grid-cols-2 gap-4">
              <div class="module-card module-card-1" onclick="goToPage(7)">
                <div class="module-icon">🔢</div>
                <div class="text-center">
                  <h3 class="font-bold text-gray-800">一</h3>
                  <p class="text-sm text-gray-600">整数加减法</p>
                </div>
              </div>
              <div class="module-card module-card-2">
                <div class="module-icon">✖️</div>
                <div class="text-center">
                  <h3 class="font-bold text-gray-800">二</h3>
                  <p class="text-sm text-gray-600">整数乘除法</p>
                </div>
              </div>
              <div class="module-card module-card-3">
                <div class="module-icon">📊</div>
                <div class="text-center">
                  <h3 class="font-bold text-gray-800">三</h3>
                  <p class="text-sm text-gray-600">小数计算</p>
                </div>
              </div>
              <div class="module-card module-card-4">
                <div class="module-icon">½</div>
                <div class="text-center">
                  <h3 class="font-bold text-gray-800">四</h3>
                  <p class="text-sm text-gray-600">分数计算</p>
                </div>
              </div>
              <div class="module-card module-card-5 col-span-2">
                <div class="module-icon">🧮</div>
                <div class="text-center">
                  <h3 class="font-bold text-gray-800">五</h3>
                  <p class="text-sm text-gray-600">综合运算</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./prototype.js"></script>
</body>
</html>
