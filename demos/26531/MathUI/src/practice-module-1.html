<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>练习-整数加减法 - 星童学</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./prototype.css">
</head>
<body class="min-h-screen pb-20">
  <div id="app" class="w-full min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-blue-100 shadow-2xl">
    <div id="contentRoot">
      <div id="page-7" class="page-container active">
        <div id="page-7-normal" class="fade-in">
          <div class="p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100 flex items-center gap-4 sticky top-0 z-50">
            <button onclick="goToPage(6)" class="p-2 hover:bg-indigo-100 rounded-xl transition">
              <i data-lucide="arrow-left" class="w-5 h-5 text-indigo-600"></i>
            </button>
            <h2 class="text-xl font-bold text-indigo-900">练习 / 一、整数加减法</h2>
          </div>

          <div class="p-6 space-y-3">
            <div class="sub-item" onclick="goToPage(8)">
              <div class="sub-item-number">1</div>
              <span class="font-medium text-gray-700">5以内加减法</span>
              <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400 ml-auto"></i>
            </div>
            <div class="sub-item">
              <div class="sub-item-number">2</div>
              <span class="font-medium text-gray-700">10以内加减法</span>
              <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400 ml-auto"></i>
            </div>
            <div class="sub-item">
              <div class="sub-item-number">3</div>
              <span class="font-medium text-gray-700">20以内：两位数+一位数（加法）</span>
              <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400 ml-auto"></i>
            </div>
            <div class="sub-item">
              <div class="sub-item-number">4</div>
              <span class="font-medium text-gray-700">20以内：两位数-一位数（减法）</span>
              <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400 ml-auto"></i>
            </div>
            <div class="sub-item">
              <div class="sub-item-number">5</div>
              <span class="font-medium text-gray-700">两位数+两位数（进位）</span>
              <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400 ml-auto"></i>
            </div>
            <div class="sub-item">
              <div class="sub-item-number">6</div>
              <span class="font-medium text-gray-700">三位数+两位/一位数（加法）</span>
              <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400 ml-auto"></i>
            </div>
            <div class="sub-item">
              <div class="sub-item-number">7</div>
              <span class="font-medium text-gray-700">三位数+三位数（加法）</span>
              <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400 ml-auto"></i>
            </div>
            <div class="sub-item">
              <div class="sub-item-number">8</div>
              <span class="font-medium text-gray-700">两位数-两位数（减法）</span>
              <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400 ml-auto"></i>
            </div>
            <div class="sub-item">
              <div class="sub-item-number">9</div>
              <span class="font-medium text-gray-700">三位数-两位/一位数（减法）</span>
              <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400 ml-auto"></i>
            </div>
            <div class="sub-item" style="background: linear-gradient(145deg, #FEF3C7, #FDE68A); border-color: #FCD34D;">
              <div class="sub-item-number" style="background: linear-gradient(145deg, #F59E0B, #D97706);">10</div>
              <span class="font-medium text-gray-800">加减法综合计算检测</span>
              <i data-lucide="chevron-right" class="w-5 h-5 text-gray-500 ml-auto"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./prototype.js"></script>
</body>
</html>
