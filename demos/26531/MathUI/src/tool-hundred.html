<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具-百数板 - 星童学</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./prototype.css">
  <style>
    .hundred-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
      padding: 12px;
      background: #F8FAFC;
      border-radius: 16px;
    }

    .grid-cell {
      aspect-ratio: 1;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Baloo 2', cursive;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s ease-out;
      border: 2px solid transparent;
      user-select: none;
    }

    .grid-cell.normal {
      background: linear-gradient(145deg, #BFDBFE, #93C5FD);
      border-color: rgba(59, 130, 246, 0.3);
      color: #1E40AF;
    }

    .grid-cell.multiple5 {
      background: linear-gradient(145deg, #FDE68A, #FCD34D);
      border-color: rgba(245, 158, 11, 0.3);
      color: #92400E;
    }

    .grid-cell.multiple10 {
      background: linear-gradient(145deg, #FED7AA, #FDBA74);
      border-color: rgba(249, 115, 22, 0.3);
      color: #9A3412;
    }

    .grid-cell:hover {
      transform: scale(1.08);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
      z-index: 10;
    }

    .grid-cell.marked {
      background: linear-gradient(145deg, #FECACA, #FCA5A5);
      border-color: #EF4444;
      color: #991B1B;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.3);
    }

    .grid-cell.highlighted {
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.5);
      transform: scale(1.05);
      z-index: 5;
    }

    .grid-cell.path {
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.5);
      animation: pathPulse 0.5s ease-out;
    }

    .grid-cell.hidden {
      background: #E2E8F0;
      border-color: #CBD5E1;
      color: transparent;
      border-style: dashed;
    }

    .grid-cell.hidden:hover {
      color: #64748B;
    }

    .grid-cell.correct {
      background: linear-gradient(145deg, #BBF7D0, #86EFAC);
      border-color: #22C55E;
      color: #166534;
    }

    .grid-cell.wrong {
      background: linear-gradient(145deg, #FECACA, #FCA5A5);
      border-color: #EF4444;
      color: #991B1B;
      animation: shake 0.5s ease-out;
    }

    .grid-cell.eliminated {
      opacity: 0;
      transform: scale(0);
      pointer-events: none;
    }

    @keyframes pathPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1.05); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .info-panel {
      background: linear-gradient(145deg, #FFFFFF, #F8FAFC);
      border: 3px solid #C7D2FE;
      border-radius: 20px;
      padding: 20px;
      min-height: 200px;
    }

    .relation-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #F1F5F9;
      border-radius: 10px;
      margin-bottom: 6px;
    }

    .relation-number {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Baloo 2', cursive;
      font-weight: 700;
      font-size: 16px;
    }

    .relation-number.plus { background: #D1FAE5; color: #059669; }
    .relation-number.minus { background: #FEE2E2; color: #DC2626; }

    .control-btn {
      padding: 8px 16px;
      border-radius: 12px;
      font-family: 'Baloo 2', cursive;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease-out;
      border: 2px solid;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .control-btn-primary {
      background: linear-gradient(145deg, #818CF8, #6366F1);
      border-color: #4F46E5;
      color: white;
    }

    .control-btn-secondary {
      background: linear-gradient(145deg, #BFDBFE, #93C5FD);
      border-color: #3B82F6;
      color: #1E40AF;
    }

    .control-btn-success {
      background: linear-gradient(145deg, #BBF7D0, #86EFAC);
      border-color: #22C55E;
      color: #166534;
    }

    .control-btn-warning {
      background: linear-gradient(145deg, #FDE68A, #FCD34D);
      border-color: #F59E0B;
      color: #92400E;
    }

    .control-btn-danger {
      background: linear-gradient(145deg, #FECACA, #FCA5A5);
      border-color: #EF4444;
      color: #991B1B;
    }

    .control-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
    }

    .control-btn.active {
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.4);
    }

    .input-field {
      padding: 10px 14px;
      border-radius: 12px;
      border: 2px solid #C7D2FE;
      background: #F8FAFC;
      font-family: 'Comic Neue', sans-serif;
      font-size: 16px;
      outline: none;
      transition: all 0.2s ease-out;
      width: 100%;
    }

    .input-field:focus {
      border-color: #6366F1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .mode-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .mode-tab {
      padding: 8px 16px;
      border-radius: 20px;
      font-family: 'Baloo 2', cursive;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: 2px solid;
      transition: all 0.2s ease-out;
    }

    .mode-tab-normal {
      background: #EFF6FF;
      border-color: #BFDBFE;
      color: #1D4ED8;
    }

    .mode-tab.active {
      background: linear-gradient(145deg, #818CF8, #6366F1);
      border-color: #4F46E5;
      color: white;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .path-display {
      background: #F1F5F9;
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
    }

    .path-step {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-family: 'Baloo 2', cursive;
      font-size: 14px;
    }

    .path-arrow {
      color: #6366F1;
      font-weight: 700;
    }

    .hint-text {
      font-size: 12px;
      color: #64748B;
      margin-top: 8px;
    }

    @media (max-width: 768px) {
      .grid-cell {
        font-size: 14px;
      }
      .control-btn {
        padding: 6px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body class="min-h-screen pb-20">
  <div id="app" class="w-full min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-blue-100 shadow-2xl">
    <div id="contentRoot">
      <div id="page-hundred" class="page-container active">
        <div id="page-hundred-normal" class="fade-in">
          <div class="p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100 sticky top-0 z-50 flex items-center justify-between">
            <div class="flex items-center gap-4">
              <button onclick="goToPage(12)" class="p-2 hover:bg-indigo-100 rounded-xl transition" aria-label="返回工具列表">
                <i data-lucide="arrow-left" class="w-5 h-5 text-indigo-600"></i>
              </button>
              <h2 class="text-xl font-bold text-indigo-900">工具 / 百数板</h2>
            </div>
            <button onclick="toggleFullscreen()" class="p-2 hover:bg-indigo-100 rounded-xl transition" aria-label="全屏">
              <i data-lucide="maximize" class="w-5 h-5 text-indigo-600"></i>
            </button>
          </div>

          <div class="p-4 md:p-6 space-y-6">
            <div class="clay-card p-4 md:p-6">
              <div class="flex items-center gap-3 mb-4">
                <div class="w-12 h-12 bg-blue-100 rounded-2xl flex items-center justify-center">
                  <i data-lucide="grid-3x3" class="w-6 h-6 text-blue-600"></i>
                </div>
                <div>
                  <h3 class="text-lg font-bold text-indigo-900">数学百数板</h3>
                  <p class="text-sm text-gray-500">1-100数字学习工具，支持规律探究、运算演示和填空挑战</p>
                </div>
              </div>

              <div class="mode-tabs">
                <button class="mode-tab mode-tab-normal active" onclick="setMode('normal')" data-mode="normal">基础</button>
                <button class="mode-tab mode-tab-normal" onclick="setMode('pattern')" data-mode="pattern">规律</button>
                <button class="mode-tab mode-tab-normal" onclick="setMode('calculation')" data-mode="calculation">运算</button>
                <button class="mode-tab mode-tab-normal" onclick="setMode('challenge')" data-mode="challenge">挑战</button>
              </div>

              <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2">
                  <div id="hundredGrid" class="hundred-grid"></div>
                </div>

                <div class="info-panel">
                  <div id="normalPanel" class="mode-panel">
                    <h4 class="font-bold text-indigo-900 mb-3">快捷操作</h4>
                    <div class="flex flex-wrap gap-2 mb-4">
                      <button class="control-btn control-btn-primary" onclick="markMultiple5()">
                        <i data-lucide="hash" class="w-4 h-4"></i> 5的倍数
                      </button>
                      <button class="control-btn control-btn-secondary" onclick="markMultiple10()">
                        <i data-lucide="hash" class="w-4 h-4"></i> 10的倍数
                      </button>
                      <button class="control-btn control-btn-success" onclick="markEven()">
                        <i data-lucide="activity" class="w-4 h-4"></i> 偶数
                      </button>
                      <button class="control-btn control-btn-warning" onclick="markOdd()">
                        <i data-lucide="activity" class="w-4 h-4"></i> 奇数
                      </button>
                    </div>
                    <button class="control-btn control-btn-danger w-full" onclick="clearAll()">
                      <i data-lucide="trash-2" class="w-4 h-4"></i> 清空所有标记
                    </button>
                    <p class="hint-text">提示：点击数字可手动标记/取消标记</p>
                  </div>

                  <div id="patternPanel" class="mode-panel hidden">
                    <h4 class="font-bold text-indigo-900 mb-3">规律探究</h4>
                    <div class="flex flex-wrap gap-2 mb-4">
                      <button class="control-btn control-btn-primary" onclick="highlightRowCol()">
                        <i data-lucide="crosshair" class="w-4 h-4"></i> 行列
                      </button>
                      <button class="control-btn control-btn-secondary" onclick="highlightDiagonal()">
                        <i data-lucide="move-diagonal" class="w-4 h-4"></i> 斜向
                      </button>
                      <button class="control-btn control-btn-success" onclick="highlightSameTens()">
                        <i data-lucide="layers" class="w-4 h-4"></i> 同十位
                      </button>
                      <button class="control-btn control-btn-warning" onclick="highlightSameOnes()">
                        <i data-lucide="layers" class="w-4 h-4"></i> 同个位
                      </button>
                    </div>
                    <div id="patternInfo" class="text-sm text-gray-600">
                      点击数字查看相关规律
                    </div>
                  </div>

                  <div id="calculationPanel" class="mode-panel hidden">
                    <h4 class="font-bold text-indigo-900 mb-3">加减法演示</h4>
                    <div class="space-y-3">
                      <div>
                        <label class="text-sm text-gray-600 mb-1 block">起始数</label>
                        <input type="number" id="startNumber" class="input-field" min="1" max="100" value="23">
                      </div>
                      <div>
                        <label class="text-sm text-gray-600 mb-1 block">运算值</label>
                        <input type="number" id="calcValue" class="input-field" min="-99" max="99" value="18">
                      </div>
                      <button class="control-btn control-btn-primary w-full" onclick="demonstrateCalculation()">
                        <i data-lucide="play" class="w-4 h-4"></i> 演示运算
                      </button>
                    </div>
                    <div id="calculationPath" class="path-display hidden">
                      <h5 class="font-bold text-indigo-900 mb-2">运算路径</h5>
                      <div id="pathSteps"></div>
                    </div>
                  </div>

                  <div id="challengePanel" class="mode-panel hidden">
                    <h4 class="font-bold text-indigo-900 mb-3">填空挑战</h4>
                    <div class="flex flex-wrap gap-2 mb-4">
                      <button class="control-btn control-btn-primary" onclick="generateFillBlank(5)">
                        隐藏5个
                      </button>
                      <button class="control-btn control-btn-secondary" onclick="generateFillBlank(10)">
                        隐藏10个
                      </button>
                      <button class="control-btn control-btn-success" onclick="generateFillBlank(20)">
                        隐藏20个
                      </button>
                    </div>
                    <button class="control-btn control-btn-warning w-full mb-2" onclick="checkAnswers()">
                      <i data-lucide="check-circle" class="w-4 h-4"></i> 检查答案
                    </button>
                    <button class="control-btn control-btn-danger w-full" onclick="startMake100Game()">
                      <i data-lucide="gamepad-2" class="w-4 h-4"></i> 凑100游戏
                    </button>
                    <p class="hint-text">凑100游戏：点击两个数字，如果和为100则消除</p>
                  </div>

                  <div id="selectedInfo" class="mt-4 pt-4 border-t border-gray-200 hidden">
                    <h4 class="font-bold text-indigo-900 mb-3">选中数字：<span id="selectedNumber">-</span></h4>
                    <div id="relationInfo"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentMode = 'normal';
    let selectedNumber = null;
    let markedNumbers = new Set();
    let hiddenNumbers = new Set();
    let make100Mode = false;
    let firstSelection = null;

    function init() {
      renderGrid();
      lucide.createIcons();
    }

    function renderGrid() {
      const grid = document.getElementById('hundredGrid');
      grid.innerHTML = '';

      for (let i = 1; i <= 100; i++) {
        const cell = document.createElement('div');
        cell.className = 'grid-cell';
        cell.dataset.number = i;

        if (i % 10 === 0) {
          cell.classList.add('multiple10');
        } else if (i % 5 === 0) {
          cell.classList.add('multiple5');
        } else {
          cell.classList.add('normal');
        }

        if (markedNumbers.has(i)) {
          cell.classList.add('marked');
        }

        if (hiddenNumbers.has(i)) {
          cell.classList.add('hidden');
          cell.innerHTML = `<input type="number" class="input-field text-center" style="width: 100%; height: 100%; border: none; background: transparent;" min="1" max="100" onchange="checkAnswer(${i}, this.value)">`;
        } else {
          cell.textContent = i;
        }

        cell.onclick = () => handleCellClick(i);
        grid.appendChild(cell);
      }
    }

    function handleCellClick(number) {
      if (make100Mode) {
        handleMake100Click(number);
        return;
      }

      if (hiddenNumbers.has(number)) {
        return;
      }

      const cell = document.querySelector(`[data-number="${number}"]`);

      if (currentMode === 'normal') {
        if (markedNumbers.has(number)) {
          markedNumbers.delete(number);
          cell.classList.remove('marked');
        } else {
          markedNumbers.add(number);
          cell.classList.add('marked');
        }
      } else if (currentMode === 'pattern') {
        selectedNumber = number;
        updateSelectedInfo();
      } else if (currentMode === 'calculation') {
        document.getElementById('startNumber').value = number;
        selectedNumber = number;
        updateSelectedInfo();
      }
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-tab').forEach(tab => {
        tab.classList.remove('active');
        if (tab.dataset.mode === mode) {
          tab.classList.add('active');
        }
      });

      document.querySelectorAll('.mode-panel').forEach(panel => {
        panel.classList.add('hidden');
      });
      document.getElementById(`${mode}Panel`).classList.remove('hidden');

      clearHighlights();
    }

    function clearAll() {
      markedNumbers.clear();
      hiddenNumbers.clear();
      make100Mode = false;
      firstSelection = null;
      renderGrid();
      clearHighlights();
      document.getElementById('selectedInfo').classList.add('hidden');
    }

    function markMultiple5() {
      for (let i = 5; i <= 100; i += 5) {
        markedNumbers.add(i);
      }
      renderGrid();
    }

    function markMultiple10() {
      for (let i = 10; i <= 100; i += 10) {
        markedNumbers.add(i);
      }
      renderGrid();
    }

    function markEven() {
      for (let i = 2; i <= 100; i += 2) {
        markedNumbers.add(i);
      }
      renderGrid();
    }

    function markOdd() {
      for (let i = 1; i <= 100; i += 2) {
        markedNumbers.add(i);
      }
      renderGrid();
    }

    function clearHighlights() {
      document.querySelectorAll('.grid-cell').forEach(cell => {
        cell.classList.remove('highlighted', 'path');
      });
    }

    function highlightRowCol() {
      if (!selectedNumber) {
        alert('请先点击一个数字');
        return;
      }

      clearHighlights();
      const row = Math.ceil(selectedNumber / 10);
      const col = (selectedNumber - 1) % 10 + 1;

      for (let i = 1; i <= 100; i++) {
        const currentRow = Math.ceil(i / 10);
        const currentCol = (i - 1) % 10 + 1;

        if (currentRow === row || currentCol === col) {
          const cell = document.querySelector(`[data-number="${i}"]`);
          cell.classList.add('highlighted');
        }
      }

      updatePatternInfo(`第${row}行和第${col}列的数字`);
    }

    function highlightDiagonal() {
      if (!selectedNumber) {
        alert('请先点击一个数字');
        return;
      }

      clearHighlights();
      const row = Math.ceil(selectedNumber / 10);
      const col = (selectedNumber - 1) % 10 + 1;

      for (let i = 1; i <= 100; i++) {
        const currentRow = Math.ceil(i / 10);
        const currentCol = (i - 1) % 10 + 1;

        if (currentRow - currentCol === row - col || currentRow + currentCol === row + col) {
          const cell = document.querySelector(`[data-number="${i}"]`);
          cell.classList.add('highlighted');
        }
      }

      updatePatternInfo(`对角线数字`);
    }

    function highlightSameTens() {
      if (!selectedNumber) {
        alert('请先点击一个数字');
        return;
      }

      clearHighlights();
      const tens = Math.floor(selectedNumber / 10);

      for (let i = 1; i <= 100; i++) {
        if (Math.floor(i / 10) === tens) {
          const cell = document.querySelector(`[data-number="${i}"]`);
          cell.classList.add('highlighted');
        }
      }

      updatePatternInfo(`十位为${tens}的数字`);
    }

    function highlightSameOnes() {
      if (!selectedNumber) {
        alert('请先点击一个数字');
        return;
      }

      clearHighlights();
      const ones = selectedNumber % 10;

      for (let i = 1; i <= 100; i++) {
        if (i % 10 === ones) {
          const cell = document.querySelector(`[data-number="${i}"]`);
          cell.classList.add('highlighted');
        }
      }

      updatePatternInfo(`个位为${ones}的数字`);
    }

    function updatePatternInfo(text) {
      document.getElementById('patternInfo').textContent = text;
    }

    function updateSelectedInfo() {
      if (!selectedNumber) return;

      document.getElementById('selectedInfo').classList.remove('hidden');
      document.getElementById('selectedNumber').textContent = selectedNumber;

      const relationInfo = document.getElementById('relationInfo');
      const row = Math.ceil(selectedNumber / 10);
      const col = (selectedNumber - 1) % 10 + 1;

      let html = '';

      if (selectedNumber > 1) {
        html += `<div class="relation-item">
          <div class="relation-number minus">-1</div>
          <span>${selectedNumber - 1} (左移)</span>
        </div>`;
      }

      if (selectedNumber < 100) {
        html += `<div class="relation-item">
          <div class="relation-number plus">+1</div>
          <span>${selectedNumber + 1} (右移)</span>
        </div>`;
      }

      if (selectedNumber > 10) {
        html += `<div class="relation-item">
          <div class="relation-number minus">-10</div>
          <span>${selectedNumber - 10} (上移)</span>
        </div>`;
      }

      if (selectedNumber <= 90) {
        html += `<div class="relation-item">
          <div class="relation-number plus">+10</div>
          <span>${selectedNumber + 10} (下移)</span>
        </div>`;
      }

      html += `<div class="relation-item">
        <span>位置：第${row}行，第${col}列</span>
      </div>`;

      relationInfo.innerHTML = html;
    }

    function demonstrateCalculation() {
      const start = parseInt(document.getElementById('startNumber').value);
      const value = parseInt(document.getElementById('calcValue').value);

      if (start < 1 || start > 100) {
        alert('起始数必须在1-100之间');
        return;
      }

      if (Math.abs(value) > 99) {
        alert('运算值必须在-99到99之间');
        return;
      }

      const end = start + value;
      if (end < 1 || end > 100) {
        alert('运算结果超出范围（1-100）');
        return;
      }

      clearHighlights();

      const steps = [];
      let current = start;
      const absValue = Math.abs(value);
      const tens = Math.floor(absValue / 10);
      const ones = absValue % 10;

      steps.push({ number: current, label: '起始' });

      if (tens > 0) {
        const step = value > 0 ? 10 : -10;
        for (let i = 0; i < tens; i++) {
          current += step;
          steps.push({ number: current, label: `${step > 0 ? '+' : ''}${step}` });
        }
      }

      if (ones > 0) {
        const step = value > 0 ? 1 : -1;
        for (let i = 0; i < ones; i++) {
          current += step;
          steps.push({ number: current, label: `${step > 0 ? '+' : ''}${step}` });
        }
      }

      const pathSteps = document.getElementById('pathSteps');
      let html = '';

      steps.forEach((step, index) => {
        const cell = document.querySelector(`[data-number="${step.number}"]`);
        cell.classList.add('path');

        if (index < steps.length - 1) {
          html += `<div class="path-step">
            <span class="font-bold">${step.number}</span>
            <span class="path-arrow">→</span>
            <span class="text-gray-600">${step.label}</span>
          </div>`;
        } else {
          html += `<div class="path-step">
            <span class="font-bold text-green-600">${step.number}</span>
            <span class="text-green-600 font-bold">(结果)</span>
          </div>`;
        }
      });

      pathSteps.innerHTML = html;
      document.getElementById('calculationPath').classList.remove('hidden');
    }

    function generateFillBlank(count) {
      clearAll();
      make100Mode = false;

      const numbers = [];
      for (let i = 1; i <= 100; i++) {
        numbers.push(i);
      }

      for (let i = numbers.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
      }

      for (let i = 0; i < count; i++) {
        hiddenNumbers.add(numbers[i]);
      }

      renderGrid();
    }

    function checkAnswer(number, value) {
      const cell = document.querySelector(`[data-number="${number}"]`);
      const input = cell.querySelector('input');

      if (parseInt(value) === number) {
        cell.classList.remove('hidden', 'wrong');
        cell.classList.add('correct');
        cell.textContent = number;
        hiddenNumbers.delete(number);
      } else {
        cell.classList.add('wrong');
        setTimeout(() => {
          cell.classList.remove('wrong');
        }, 500);
      }
    }

    function checkAnswers() {
      hiddenNumbers.forEach(number => {
        const cell = document.querySelector(`[data-number="${number}"]`);
        const input = cell.querySelector('input');
        if (input) {
          checkAnswer(number, input.value);
        }
      });
    }

    function startMake100Game() {
      clearAll();
      make100Mode = true;
      firstSelection = null;
      alert('凑100游戏开始！点击两个数字，如果和为100则消除它们。');
    }

    function handleMake100Click(number) {
      if (hiddenNumbers.has(number)) return;

      const cell = document.querySelector(`[data-number="${number}"]`);

      if (firstSelection === null) {
        firstSelection = number;
        cell.classList.add('highlighted');
      } else {
        const firstCell = document.querySelector(`[data-number="${firstSelection}"]`);

        if (firstSelection + number === 100 && firstSelection !== number) {
          firstCell.classList.add('eliminated');
          cell.classList.add('eliminated');
          setTimeout(() => {
            firstCell.style.display = 'none';
            cell.style.display = 'none';
          }, 300);
        } else {
          firstCell.classList.remove('highlighted');
          alert('这两个数字的和不是100，请重新选择');
        }

        firstSelection = null;
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    function goToPage(pageNumber) {
      window.location.href = './tools.html';
    }

    init();
  </script>
</body>
</html>
