<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具-十格阵 - 星童学</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./prototype.css">
</head>
<body class="min-h-screen pb-20">
  <div id="app" class="w-full min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-blue-100 shadow-2xl">
    <div id="contentRoot">
      <div id="page-19" class="page-container active">
        <div id="page-19-normal" class="fade-in">
          <div class="p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100 sticky top-0 z-50 flex items-center justify-between">
            <div class="flex items-center gap-4">
              <button onclick="goToPage(12)" class="p-2 hover:bg-indigo-100 rounded-xl transition" aria-label="返回工具列表">
                <i data-lucide="arrow-left" class="w-5 h-5 text-indigo-600"></i>
              </button>
              <h2 class="text-xl font-bold text-indigo-900">工具 / 十格阵</h2>
            </div>
            <button class="p-2 hover:bg-indigo-100 rounded-xl transition" aria-label="更多">
              <i data-lucide="more-horizontal" class="w-5 h-5 text-indigo-600"></i>
            </button>
          </div>

          <div class="p-6 space-y-6">
            <div class="clay-card p-6">
              <div class="flex items-center gap-3 mb-4">
                <div class="w-12 h-12 bg-blue-100 rounded-2xl flex items-center justify-center">
                  <i data-lucide="grid-2x2-plus" class="w-6 h-6 text-blue-600"></i>
                </div>
                <div>
                  <h3 class="text-lg font-bold text-indigo-900">默认主题十格阵</h3>
                  <p class="text-sm text-gray-500">支持识数、加减法演示，以及圆片点击与拖动移动。</p>
                </div>
              </div>

              <div class="tf-layout">
                <section class="tf-stage">
                  <div class="tf-stage-top">
                    <div class="flex flex-wrap items-center gap-2">
                      <span class="tf-pill">总数：<strong id="tenframeTotalCount">0</strong></span>
                      <span class="tf-pill">模式：<strong id="tenframeModeLabel">一盘</strong></span>
                      <span class="tf-pill">页签：<strong id="tenframeTabLabel">识数</strong></span>
                    </div>
                    <div class="tf-legend">
                      <span class="tf-legend-item"><i class="tf-legend-dot tf-blue"></i>默认蓝片</span>
                      <span class="tf-legend-item"><i class="tf-legend-dot tf-red"></i>演示红片</span>
                    </div>
                  </div>

                  <div id="tenframeBoardStage" class="tf-board-stage">
                    <div class="tf-board-card">
                      <div class="tf-board-header">
                        <span class="tf-board-title">十格阵</span>
                        <span class="tf-board-subtitle" id="tenframeLeftSummary">0 / 10</span>
                      </div>
                      <div id="tenframeBoardLeft" class="tf-grid" aria-label="左侧十格阵"></div>
                    </div>

                    <div id="tenframeBoardRightWrap" class="tf-board-card">
                      <div class="tf-board-header">
                        <span class="tf-board-title">十格阵（右）</span>
                        <span class="tf-board-subtitle" id="tenframeRightSummary">0 / 10</span>
                      </div>
                      <div id="tenframeBoardRight" class="tf-grid" aria-label="右侧十格阵"></div>
                    </div>

                    <div id="tenframeDragGhost" class="tf-drag-ghost" aria-hidden="true"></div>
                  </div>

                  <div id="tenframeHint" class="nl-hint mt-5 text-sm text-gray-700" aria-live="polite">
                    提示：点击空格可添加或移除圆片；拖动已有圆片可以在空格之间移动。
                  </div>
                </section>

                <aside class="tf-sidebar">
                  <div class="tf-tabs" role="tablist" aria-label="十格阵模式">
                    <button id="tenframeTabRecognize" class="tf-tab is-active" type="button" data-tab="recognize">识数</button>
                    <button id="tenframeTabMath" class="tf-tab" type="button" data-tab="math">加减法</button>
                  </div>

                  <section id="tenframePanelRecognize" class="tf-panel">
                    <div class="tf-panel-group">
                      <div class="tf-panel-label">模式</div>
                      <div class="tf-segment">
                        <button id="tenframeRecognizeModeOne" class="tf-seg-btn is-active" type="button">一盘</button>
                        <button id="tenframeRecognizeModeTwo" class="tf-seg-btn" type="button">两盘</button>
                      </div>
                    </div>

                    <div class="tf-panel-group">
                      <div class="tf-panel-label">设置数量</div>
                      <div class="space-y-3">
                        <div class="tf-segment">
                          <button id="tenframeFillSequential" class="tf-seg-btn is-active" type="button">顺序</button>
                          <button id="tenframeFillRandom" class="tf-seg-btn" type="button">乱序</button>
                        </div>
                        <div class="tf-segment">
                          <button id="tenframeColorUniform" class="tf-seg-btn is-active" type="button">统一色</button>
                          <button id="tenframeColorRandom" class="tf-seg-btn" type="button">随机色</button>
                        </div>
                        <div class="tf-range-row">
                          <input id="tenframeCountRange" type="range" min="0" max="20" value="8" class="w-full">
                          <span id="tenframeCountValue" class="tf-range-value">8</span>
                        </div>
                        <button id="tenframeRandomCount" class="clay-button clay-button-secondary w-full text-sm py-3" type="button">
                          <i data-lucide="shuffle" class="w-4 h-4"></i>
                          随机数
                        </button>
                      </div>
                    </div>
                  </section>

                  <section id="tenframePanelMath" class="tf-panel hidden">
                    <div class="tf-panel-group">
                      <div class="tf-panel-label">模式</div>
                      <div class="tf-segment">
                        <button id="tenframeMathModeOne" class="tf-seg-btn is-active" type="button">一盘</button>
                        <button id="tenframeMathModeTwo" class="tf-seg-btn" type="button">两盘</button>
                      </div>
                    </div>

                    <div class="tf-panel-group">
                      <div class="tf-panel-label">手动颜色</div>
                      <div class="tf-segment">
                        <button id="tenframeManualBlue" class="tf-seg-btn is-active" type="button">蓝色</button>
                        <button id="tenframeManualRed" class="tf-seg-btn" type="button">红色</button>
                      </div>
                    </div>

                    <div class="tf-panel-group">
                      <div class="tf-panel-label">算式</div>
                      <div class="tf-expression">
                        <input id="tenframeLeftOperand" class="clay-input text-center" type="number" min="0" max="20" value="8" aria-label="左操作数">
                        <button id="tenframeOperationToggle" class="tf-op-btn" type="button" title="点击切换加减法">+</button>
                        <input id="tenframeRightOperand" class="clay-input text-center" type="number" min="0" max="20" value="5" aria-label="右操作数">
                      </div>
                      <button id="tenframeStartDemo" class="clay-button clay-button-primary w-full text-sm py-3" type="button">
                        <i data-lucide="play" class="w-4 h-4"></i>
                        开始演示
                      </button>
                      <div class="grid grid-cols-2 gap-2">
                        <button id="tenframeDemo8Add5" class="clay-button clay-button-secondary text-xs py-2 px-3" type="button">8 + 5</button>
                        <button id="tenframeDemo13Sub4" class="clay-button clay-button-secondary text-xs py-2 px-3" type="button">13 - 4</button>
                      </div>
                    </div>
                  </section>

                  <div id="tenframeStatus" class="tf-status" aria-live="polite">待开始</div>
                </aside>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./prototype.js"></script>
</body>
</html>
