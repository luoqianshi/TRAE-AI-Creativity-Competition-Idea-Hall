<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习-5以内加减法 - 星童学</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']]
      },
      svg: {
        fontCache: 'global'
      },
      startup: {
        ready: function() {
          console.log('MathJax is ready');
          MathJax.startup.defaultReady();
        }
      }
    };
  </script>
  <link rel="stylesheet" href="./prototype.css">
</head>
<body class="min-h-screen pb-20">
  <div id="app" class="w-full min-h-screen bg-slate-50 shadow-2xl">
    <div id="contentRoot">
      <div id="page-5" class="page-container active">
        <div id="page-5-normal" class="fade-in">
          <div class="p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100 flex items-center justify-between sticky top-0 z-50">
            <div class="flex items-center gap-4">
              <button onclick="goToPage(4)" class="p-2 hover:bg-indigo-100 rounded-xl transition">
                <i data-lucide="arrow-left" class="w-5 h-5 text-indigo-600"></i>
              </button>
              <div>
                <h2 class="text-lg font-bold text-indigo-900">学习 / 一、整数加减法</h2>
                <p class="text-sm text-gray-500">5以内加减法</p>
              </div>
            </div>
            <div class="text-sm text-indigo-600 font-medium" id="questionProgress">第 1 / 34 题</div>
          </div>

          <div class="p-6">
            <div class="flex flex-col lg:flex-row gap-10">
              <div class="flex-1">
                <div class="clay-card p-8">
                  <div class="text-center mb-8">
                    <div class="question-title text-3xl font-bold text-slate-800 mb-6" id="questionTitle"></div>
                    <div class="question-content text-2xl text-slate-700 mb-8" id="questionContent"></div>
                    
                    <!-- 选项区域 -->
                    <div id="questionOptions" class="space-y-4 mb-8"></div>
                    
                    <!-- 计算题答案输入区域 -->
                    <div id="calculationAnswer" class="hidden">
                      <p class="text-gray-500 mb-4">请输入答案</p>
                      <div class="answer-display inline-block mb-4" id="answerDisplay"></div>
                      <div class="flex justify-center gap-4">
                        <button class="clay-button clay-button-primary" onclick="setAnswer('')">
                          清空
                        </button>
                      </div>
                    </div>

                    <div class="flex justify-center gap-4">
                      <button class="px-6 py-3 bg-orange-400 hover:bg-orange-500 text-white font-bold rounded-2xl transition hover:scale-105 active:scale-95 flex items-center gap-2" onclick="previousQuestion()">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                        上一题
                      </button>
                      <button class="px-6 py-3 bg-sky-400 hover:bg-sky-500 text-white font-bold rounded-2xl transition hover:scale-105 active:scale-95 flex items-center gap-2" onclick="nextQuestion()">
                        下一题
                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>

                  <div class="mt-8 pt-6 border-t border-indigo-100">
                    <div class="text-sm text-gray-500 text-center mb-4">演示入口</div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="questionTools"></div>
                  </div>

                  <!-- 题目解析 -->
                  <div id="questionExplanation" class="mt-8 pt-6 border-t border-indigo-100 hidden">
                    <h3 class="text-lg font-bold text-indigo-900 mb-4">题目解析</h3>
                    <p class="text-gray-700" id="explanationContent"></p>
                  </div>
                </div>
              </div>

              <div class="w-full lg:w-[420px] xl:w-[480px]">
                <div class="clay-card p-6">
                  <div id="calculationKeyboard" class="bg-indigo-50/60 border border-indigo-100 rounded-2xl p-4">
                    <div class="grid grid-cols-3 gap-4 w-full max-w-sm mx-auto">
                      <button class="w-16 h-16 bg-white border-2 border-gray-200 rounded-2xl text-xl font-bold hover:bg-orange-50 hover:border-orange-300 transition hover:scale-105 active:scale-95" onclick="inputAnswer(1)">1</button>
                      <button class="w-16 h-16 bg-white border-2 border-gray-200 rounded-2xl text-xl font-bold hover:bg-orange-50 hover:border-orange-300 transition hover:scale-105 active:scale-95" onclick="inputAnswer(2)">2</button>
                      <button class="w-16 h-16 bg-white border-2 border-gray-200 rounded-2xl text-xl font-bold hover:bg-orange-50 hover:border-orange-300 transition hover:scale-105 active:scale-95" onclick="inputAnswer(3)">3</button>
                      <button class="w-16 h-16 bg-white border-2 border-gray-200 rounded-2xl text-xl font-bold hover:bg-orange-50 hover:border-orange-300 transition hover:scale-105 active:scale-95" onclick="inputAnswer(4)">4</button>
                      <button class="w-16 h-16 bg-white border-2 border-gray-200 rounded-2xl text-xl font-bold hover:bg-orange-50 hover:border-orange-300 transition hover:scale-105 active:scale-95" onclick="inputAnswer(5)">5</button>
                      <button class="w-16 h-16 bg-white border-2 border-gray-200 rounded-2xl text-xl font-bold hover:bg-orange-50 hover:border-orange-300 transition hover:scale-105 active:scale-95" onclick="inputAnswer(6)">6</button>
                      <button class="w-16 h-16 bg-white border-2 border-gray-200 rounded-2xl text-xl font-bold hover:bg-orange-50 hover:border-orange-300 transition hover:scale-105 active:scale-95" onclick="inputAnswer(7)">7</button>
                      <button class="w-16 h-16 bg-white border-2 border-gray-200 rounded-2xl text-xl font-bold hover:bg-orange-50 hover:border-orange-300 transition hover:scale-105 active:scale-95" onclick="inputAnswer(8)">8</button>
                      <button class="w-16 h-16 bg-white border-2 border-gray-200 rounded-2xl text-xl font-bold hover:bg-orange-50 hover:border-orange-300 transition hover:scale-105 active:scale-95" onclick="inputAnswer(9)">9</button>
                      <button class="w-16 h-16 bg-white border-2 border-gray-200 rounded-2xl text-xl font-bold hover:bg-orange-50 hover:border-orange-300 transition hover:scale-105 active:scale-95" onclick="inputAnswer('.')">.</button>
                      <button class="w-16 h-16 bg-white border-2 border-gray-200 rounded-2xl text-xl font-bold hover:bg-orange-50 hover:border-orange-300 transition hover:scale-105 active:scale-95" onclick="inputAnswer(0)">0</button>
                      <button class="w-16 h-16 bg-rose-100 border-2 border-rose-300 rounded-2xl text-xl font-bold hover:bg-rose-200 transition hover:scale-105 active:scale-95" onclick="deleteAnswer()">⌫</button>
                    </div>
                    <div class="mt-6 flex justify-center">
                      <button class="px-8 py-4 bg-orange-400 hover:bg-orange-500 text-white font-bold rounded-2xl transition hover:scale-105 active:scale-95 flex items-center gap-2 w-full max-w-sm justify-center" onclick="submitAnswer()">
                        <i data-lucide="check" class="w-5 h-5"></i>
                        提交答案
                      </button>
                    </div>
                  </div>

                  <div class="mt-8">
                    <h3 class="text-xl font-bold text-slate-800 mb-6 text-center">辅助工具</h3>
                    <div class="grid grid-cols-3 gap-6">
                      <div class="flex flex-col items-center cursor-pointer hover:scale-105 transition">
                        <div class="w-16 h-16 bg-sky-100 rounded-2xl flex items-center justify-center mb-3">
                          <i data-lucide="grid-3x3" class="w-8 h-8 text-sky-600"></i>
                        </div>
                        <span class="font-semibold text-slate-700">十格阵</span>
                      </div>
                      <div class="flex flex-col items-center cursor-pointer hover:scale-105 transition">
                        <div class="w-16 h-16 bg-lime-100 rounded-2xl flex items-center justify-center mb-3">
                          <i data-lucide="plus-circle" class="w-8 h-8 text-lime-600"></i>
                        </div>
                        <span class="font-semibold text-slate-700">计数器</span>
                      </div>
                      <div class="flex flex-col items-center cursor-pointer hover:scale-105 transition">
                        <div class="w-16 h-16 bg-purple-100 rounded-2xl flex items-center justify-center mb-3">
                          <i data-lucide="circle-dot" class="w-8 h-8 text-purple-600"></i>
                        </div>
                        <span class="font-semibold text-slate-700">整体</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div id="page-5-loading" class="hidden">
          <div class="p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100 flex items-center gap-4">
            <div class="skeleton w-10 h-10 rounded-xl"></div>
            <div>
              <div class="skeleton w-32 h-6 mb-1"></div>
              <div class="skeleton w-20 h-4"></div>
            </div>
          </div>
          <div class="p-6 flex flex-col items-center">
            <div class="spinner mb-8"></div>
            <p class="text-gray-500">题目加载中...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./prototype.js"></script>
  <script src="./mock-api.js"></script>
  <script>
    // 学习模块数据管理
    let currentLesson = null;
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let selectedAnswer = null;

    // 页面加载时初始化
    document.addEventListener('DOMContentLoaded', async () => {
      await loadLessonData();
    });

    // 加载课程数据
    async function loadLessonData() {
      showLoading(true);
      
      try {
        currentLesson = await MockAPI.getLesson(1, 1);
        currentQuestions = await MockAPI.getQuestions(1, 1);
        currentQuestionIndex = 0;
        selectedAnswer = null;
        
        // 显示第一个题目
        displayQuestion();
        updateQuestionProgress();
      } catch (error) {
        console.error('加载课程数据失败:', error);
      } finally {
        showLoading(false);
      }
    }

    // 显示/隐藏加载状态
    function showLoading(loading) {
      const normalPage = document.getElementById('page-5-normal');
      const loadingPage = document.getElementById('page-5-loading');
      
      if (loading) {
        normalPage.classList.add('hidden');
        loadingPage.classList.remove('hidden');
      } else {
        normalPage.classList.remove('hidden');
        loadingPage.classList.add('hidden');
      }
    }

    // 显示当前题目
    function displayQuestion() {
      const question = currentQuestions[currentQuestionIndex];
      selectedAnswer = null;

      // 显示题目标题和内容
      document.getElementById('questionTitle').textContent = question.title;
      document.getElementById('questionContent').textContent = question.content;

      // 根据题目类型显示不同的内容
      const questionOptions = document.getElementById('questionOptions');
      const calculationAnswer = document.getElementById('calculationAnswer');
      const calculationKeyboard = document.getElementById('calculationKeyboard');

      questionOptions.innerHTML = '';
      calculationAnswer.classList.add('hidden');
      calculationKeyboard.classList.add('hidden');

      switch (question.type) {
        case QuestionType.CONCEPT:
        case QuestionType.COMPARISON:
        case QuestionType.DECOMPOSITION:
          // 选择题显示选项
          question.options.forEach((option, index) => {
            const optionDiv = document.createElement('div');
            optionDiv.className = 'p-4 border border-gray-200 rounded-xl hover:bg-indigo-50 transition cursor-pointer';
            optionDiv.textContent = option;
            optionDiv.onclick = () => selectOption(index);
            questionOptions.appendChild(optionDiv);
          });
          break;
          
        case QuestionType.CALCULATION:
          // 计算题显示答案输入区域
          calculationAnswer.classList.remove('hidden');
          calculationKeyboard.classList.remove('hidden');
          setAnswer('');
          break;
          
        case QuestionType.VERTICAL:
          // 竖式计算显示
          displayVerticalCalculation(question);
          calculationAnswer.classList.remove('hidden');
          calculationKeyboard.classList.remove('hidden');
          setAnswer('');
          break;
      }

      // 显示题目工具
      displayQuestionTools(question.tools);

      // 隐藏解析内容
      document.getElementById('questionExplanation').classList.add('hidden');

      // 渲染数学公式
      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise();
      }
    }

    // 显示题目工具
    function displayQuestionTools(tools) {
      const toolsContainer = document.getElementById('questionTools');
      toolsContainer.innerHTML = '';

      tools.forEach(tool => {
        const toolDiv = document.createElement('div');
        toolDiv.className = 'tool-card tool-card-compact';
        toolDiv.onclick = () => goToTool(tool);
        
        let toolIcon = '';
        switch (tool) {
          case '十格阵':
            toolIcon = '<i data-lucide="grid-3x3" class="w-6 h-6 text-blue-600"></i>';
            break;
          case '小棒':
            toolIcon = '<i data-lucide="align-justify" class="w-6 h-6 text-rose-600"></i>';
            break;
          case '苹果':
            toolIcon = '🍎';
            break;
          case '西红柿':
            toolIcon = '🍅';
            break;
          case '数轴':
            toolIcon = '<i data-lucide="minus" class="w-6 h-6 text-green-600"></i>';
            break;
          case '数字分解工具':
            toolIcon = '<i data-lucide="scissors" class="w-6 h-6 text-purple-600"></i>';
            break;
          default:
            toolIcon = '<i data-lucide="wrench" class="w-6 h-6 text-gray-600"></i>';
        }

        toolDiv.innerHTML = `
          <div class="w-12 h-12 bg-gray-100 rounded-xl flex items-center justify-center">
            ${toolIcon}
          </div>
          <span class="font-medium text-gray-700">${tool}</span>
        `;
        
        toolsContainer.appendChild(toolDiv);
      });

      // 重新创建图标
      lucide.createIcons();
    }

    // 显示竖式计算
    function displayVerticalCalculation(question) {
      const questionOptions = document.getElementById('questionOptions');
      const verticalData = question.verticalData;
      
      const verticalDiv = document.createElement('div');
      verticalDiv.className = 'flex justify-center mb-8';
      
      let verticalContent = '';
      
      if (verticalData.operator === '÷') {
        // 除法竖式特殊格式
        verticalContent = `
          <div class="border-2 border-gray-300 p-4 rounded-lg bg-white">
            <div class="flex items-center">
              <span class="mr-2 font-bold">${verticalData.result}</span>
              <span class="border-l-2 border-gray-300 h-12 ml-2"></span>
            </div>
            <div class="flex items-center">
              <span class="mr-2">${verticalData.operator}</span>
              <span>${verticalData.bottom}</span>
              <span class="border-l-2 border-gray-300 h-12 ml-2"></span>
              <span class="ml-4">${verticalData.top}</span>
            </div>
          </div>
        `;
      } else {
        // 加减乘竖式格式
        let carryHtml = '';
        if (verticalData.carry) {
          carryHtml = '<div class="text-xs text-gray-500 absolute -top-6 left-0">1</div>';
        }
        
        let borrowHtml = '';
        if (verticalData.borrow) {
          borrowHtml = '<div class="text-xs text-gray-500 absolute -top-6 left-0">1</div>';
        }
        
        verticalContent = `
          <div class="text-right border-2 border-gray-300 p-4 rounded-lg bg-white relative">
            ${carryHtml}
            ${borrowHtml}
            <div class="mb-1">${verticalData.top}</div>
            <div class="flex items-end justify-end">
              <span class="mr-2">${verticalData.operator}</span>
              <span>${verticalData.bottom}</span>
            </div>
            <div class="border-t border-gray-300 mt-1 mb-1"></div>
            <div>${verticalData.result}</div>
          </div>
        `;
      }
      
      verticalDiv.innerHTML = verticalContent;
      questionOptions.appendChild(verticalDiv);
    }

    // 跳转到工具页面
    function goToTool(toolName) {
      const toolMap = {
        '十格阵': 12,
        '小棒': 13,
        '数字分解工具': 15,
        '数轴': 16
      };

      if (toolMap[toolName]) {
        goToPage(toolMap[toolName]);
      } else {
        alert(`工具 ${toolName} 暂未实现`);
      }
    }

    // 选择题选项点击
    function selectOption(index) {
      // 清除所有选项的选中状态
      const options = document.querySelectorAll('#questionOptions > div');
      options.forEach(option => {
        option.classList.remove('bg-indigo-100', 'border-indigo-300');
        option.classList.add('border-gray-200');
      });

      // 添加当前选项的选中状态
      const selectedOption = options[index];
      selectedOption.classList.add('bg-indigo-100', 'border-indigo-300');
      selectedOption.classList.remove('border-gray-200');

      selectedAnswer = index;
    }

    // 计算题答案输入
    function inputAnswer(value) {
      const answerDisplay = document.getElementById('answerDisplay');
      const currentValue = answerDisplay.textContent;
      
      if (currentValue.length < 2) {
        answerDisplay.textContent = currentValue + value;
      }
    }

    // 计算题删除答案
    function deleteAnswer() {
      const answerDisplay = document.getElementById('answerDisplay');
      const currentValue = answerDisplay.textContent;
      
      if (currentValue.length > 0) {
        answerDisplay.textContent = currentValue.slice(0, -1);
      }
    }

    // 计算题设置答案
    function setAnswer(value) {
      document.getElementById('answerDisplay').textContent = value;
    }

    // 上一题
    function previousQuestion() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        displayQuestion();
        updateQuestionProgress();
      }
    }

    // 下一题
    function nextQuestion() {
      if (currentQuestionIndex < currentQuestions.length - 1) {
        currentQuestionIndex++;
        displayQuestion();
        updateQuestionProgress();
      }
    }

    // 更新题目进度
    function updateQuestionProgress() {
      const progressDiv = document.getElementById('questionProgress');
      progressDiv.textContent = `第 ${currentQuestionIndex + 1} / ${currentQuestions.length} 题`;
    }

    // 提交答案
    async function submitAnswer() {
      const question = currentQuestions[currentQuestionIndex];
      let userAnswer;

      if (question.type === QuestionType.CALCULATION) {
        userAnswer = parseInt(document.getElementById('answerDisplay').textContent);
      } else {
        userAnswer = selectedAnswer;
      }

      if (userAnswer === null || userAnswer === '' || userAnswer === undefined) {
        alert('请先选择或输入答案');
        return;
      }

      // 提交答案
      const result = await MockAPI.submitAnswer(1, 1, question.id, userAnswer);

      // 显示反馈
      if (result.isCorrect) {
        alert('回答正确！');
      } else {
        alert(`回答错误。正确答案是 ${question.options[result.correctAnswer]}`);
      }

      // 显示解析
      document.getElementById('explanationContent').textContent = question.explanation;
      document.getElementById('questionExplanation').classList.remove('hidden');
    }
  </script>
</body>
</html>
