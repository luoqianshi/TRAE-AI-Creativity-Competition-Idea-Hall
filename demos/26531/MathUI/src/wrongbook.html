<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>错题本 - 星童学</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./prototype.css">
</head>
<body class="min-h-screen pb-20">
  <div id="app" class="w-full min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-blue-100 shadow-2xl">
    <div id="contentRoot">
      <div id="page-9" class="page-container active">
        <div id="page-9-normal" class="fade-in">
          <nav class="lg:hidden flex justify-around p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100 sticky top-0 z-50">
            <div class="nav-item" onclick="goToPage(2)">
              <i data-lucide="home" class="w-5 h-5"></i>
              <span>首页</span>
            </div>
            <div class="nav-item" onclick="goToPage(3)">
              <i data-lucide="book-open" class="w-5 h-5"></i>
              <span>学习</span>
            </div>
            <div class="nav-item" onclick="goToPage(6)">
              <i data-lucide="pen-tool" class="w-5 h-5"></i>
              <span>练习</span>
            </div>
            <div class="nav-item active">
              <i data-lucide="file-x" class="w-5 h-5"></i>
              <span>错题本</span>
            </div>
            <div class="nav-item" onclick="goToPage(12)">
              <i data-lucide="wrench" class="w-5 h-5"></i>
              <span>工具</span>
            </div>
          </nav>

          <div class="p-6">
            <h2 class="text-2xl font-bold text-indigo-900 mb-6">错题本</h2>
            <div class="grid grid-cols-2 gap-4">
              <div class="module-card module-card-1" onclick="goToPage(10)">
                <div class="module-icon">🔢</div>
                <div class="text-center">
                  <h3 class="font-bold text-gray-800">一</h3>
                  <p class="text-sm text-gray-600">整数加减法</p>
                </div>
                <span class="badge badge-error">9题</span>
              </div>
              <div class="module-card module-card-2">
                <div class="module-icon">✖️</div>
                <div class="text-center">
                  <h3 class="font-bold text-gray-800">二</h3>
                  <p class="text-sm text-gray-600">整数乘除法</p>
                </div>
                <span class="badge badge-error">5题</span>
              </div>
              <div class="module-card module-card-3">
                <div class="module-icon">📊</div>
                <div class="text-center">
                  <h3 class="font-bold text-gray-800">三</h3>
                  <p class="text-sm text-gray-600">小数计算</p>
                </div>
                <span class="badge badge-error">3题</span>
              </div>
              <div class="module-card module-card-4">
                <div class="module-icon">½</div>
                <div class="text-center">
                  <h3 class="font-bold text-gray-800">四</h3>
                  <p class="text-sm text-gray-600">分数计算</p>
                </div>
                <span class="badge badge-error">7题</span>
              </div>
              <div class="module-card module-card-5 col-span-2">
                <div class="module-icon">🧮</div>
                <div class="text-center">
                  <h3 class="font-bold text-gray-800">五</h3>
                  <p class="text-sm text-gray-600">综合运算</p>
                </div>
                <span class="badge badge-error">12题</span>
              </div>
            </div>
          </div>
        </div>

        <div id="page-9-empty" class="hidden">
          <nav class="lg:hidden flex justify-around p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100">
            <div class="nav-item" onclick="goToPage(2)"><i data-lucide="home" class="w-5 h-5"></i><span>首页</span></div>
            <div class="nav-item" onclick="goToPage(3)"><i data-lucide="book-open" class="w-5 h-5"></i><span>学习</span></div>
            <div class="nav-item" onclick="goToPage(6)"><i data-lucide="pen-tool" class="w-5 h-5"></i><span>练习</span></div>
            <div class="nav-item active"><i data-lucide="file-x" class="w-5 h-5"></i><span>错题本</span></div>
            <div class="nav-item" onclick="goToPage(12)"><i data-lucide="wrench" class="w-5 h-5"></i><span>工具</span></div>
          </nav>
          <div class="empty-state">
            <div class="empty-state-icon">
              <i data-lucide="check-circle" class="w-16 h-16 text-green-300"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">太棒了！</h3>
            <p class="text-gray-500 mb-6">暂无错题，保持好成绩！</p>
            <button class="clay-button clay-button-primary" onclick="goToPage(3)">
              继续学习
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./prototype.js"></script>
</body>
</html>
