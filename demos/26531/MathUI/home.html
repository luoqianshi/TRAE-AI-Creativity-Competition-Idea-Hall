<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页 - 星童学小学计算能力训练平台</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./src/prototype.css">
</head>
<body class="min-h-screen pb-20">
  <div id="app" class="w-full min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-blue-100 shadow-2xl">
    <div id="sidebarNav" class="hidden lg:flex sidebar-disabled fixed left-0 top-0 h-full w-56 bg-white/95 backdrop-blur-sm border-r border-indigo-100 z-50 flex-col">
      <div class="p-6 border-b border-indigo-100 flex items-start justify-between gap-3">
        <div class="flex flex-col gap-2">
          <img src="./src/logo.png" alt="星童学" class="h-10 w-auto select-none" draggable="false">
          <p class="text-sm text-gray-500">小学计算训练平台</p>
        </div>
        <button id="sidebarToggleBtn" onclick="toggleSidebar()" class="p-2 hover:bg-indigo-100 rounded-xl transition" aria-label="收起左侧菜单">
          <i data-lucide="chevron-left" class="w-5 h-5 text-indigo-600"></i>
        </button>
      </div>
      <nav class="flex-1 p-4 space-y-2">
        <div class="sidebar-nav-item active" onclick="goToPage(2)">
          <i data-lucide="home" class="w-5 h-5"></i>
          <span>首页</span>
        </div>
        <div class="sidebar-nav-item" onclick="goToPage(3)">
          <i data-lucide="book-open" class="w-5 h-5"></i>
          <span>学习</span>
        </div>
        <div class="sidebar-nav-item" onclick="goToPage(6)">
          <i data-lucide="pen-tool" class="w-5 h-5"></i>
          <span>练习</span>
        </div>
        <div class="sidebar-nav-item" onclick="goToPage(9)">
          <i data-lucide="file-x" class="w-5 h-5"></i>
          <span>错题本</span>
        </div>
        <div class="sidebar-nav-item" onclick="goToPage(12)">
          <i data-lucide="wrench" class="w-5 h-5"></i>
          <span>工具</span>
        </div>
      </nav>
      <div class="p-4 border-t border-indigo-100">
        <div class="flex items-center gap-3 p-3 bg-indigo-50 rounded-xl">
          <div class="w-10 h-10 bg-indigo-200 rounded-full flex items-center justify-center">
            <i data-lucide="user" class="w-5 h-5 text-indigo-600"></i>
          </div>
          <div>
            <p class="font-medium text-sm text-gray-800">小明同学</p>
            <p class="text-xs text-gray-500">学习中</p>
          </div>
        </div>
        <button class="clay-button w-full mt-3" style="background: linear-gradient(145deg, #FCA5A5, #F87171); border-color: #EF4444; color: white" onclick="logout()">
          <i data-lucide="log-out" class="w-5 h-5"></i>
          退出
        </button>
      </div>
    </div>

    <button id="sidebarToggleFloating" onclick="toggleSidebar()" class="sidebar-toggle sidebar-toggle-hidden fixed left-4 top-4 z-50 p-2 bg-white/90 backdrop-blur-sm border border-indigo-100 rounded-xl shadow-md hover:bg-indigo-50 transition" aria-label="展开左侧菜单">
      <i data-lucide="chevron-right" class="w-5 h-5 text-indigo-600"></i>
    </button>

    <div id="contentRoot" class="lg:ml-56 sidebar-offset-disabled">
      <div id="page-2" class="page-container active">
        <div id="page-2-normal" class="fade-in">
          <nav class="lg:hidden flex justify-around p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100 sticky top-0 z-50">
            <div class="nav-item active">
              <i data-lucide="home" class="w-5 h-5"></i>
              <span>首页</span>
            </div>
            <div class="nav-item" onclick="goToPage(3)">
              <i data-lucide="book-open" class="w-5 h-5"></i>
              <span>学习</span>
            </div>
            <div class="nav-item" onclick="goToPage(6)">
              <i data-lucide="pen-tool" class="w-5 h-5"></i>
              <span>练习</span>
            </div>
            <div class="nav-item" onclick="goToPage(9)">
              <i data-lucide="file-x" class="w-5 h-5"></i>
              <span>错题本</span>
            </div>
            <div class="nav-item" onclick="goToPage(12)">
              <i data-lucide="wrench" class="w-5 h-5"></i>
              <span>工具</span>
            </div>
          </nav>

          <div class="p-6 space-y-6">
            <div class="clay-card p-6">
              <div class="flex items-center justify-between mb-4">
                <span class="text-gray-500">当前学习</span>
                <span class="badge badge-success">进行中</span>
              </div>
              <h3 class="text-xl font-bold text-indigo-900 mb-2">一、整数加减法</h3>
              <p class="text-gray-600 mb-4">5以内加减法</p>
              <button class="clay-button clay-button-primary" onclick="goToPage(4)">
                进入学习
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
              </button>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div class="stat-card stat-card-blue">
                <div class="stat-value text-blue-600">328</div>
                <div class="stat-label">完成习题</div>
              </div>
              <div class="stat-card stat-card-red">
                <div class="stat-value text-red-500">45</div>
                <div class="stat-label">错误数</div>
              </div>
              <div class="stat-card stat-card-green">
                <div class="stat-value text-green-600">86%</div>
                <div class="stat-label">正确率</div>
              </div>
              <div class="stat-card stat-card-purple">
                <div class="stat-value text-purple-600">+12%</div>
                <div class="stat-label">本周提升</div>
              </div>
            </div>

            <div class="clay-card p-6">
              <h3 class="text-lg font-bold text-indigo-900 mb-4">能力分布</h3>
              <div class="flex justify-center">
                <div class="radar-chart">
                  <svg width="200" height="200" viewBox="0 0 200 200">
                    <polygon points="100,20 176,75 147,165 53,165 24,75" fill="none" stroke="#E2E8F0" stroke-width="2"/>
                    <polygon points="100,46 150,83 131,143 69,143 50,83" fill="none" stroke="#E2E8F0" stroke-width="2"/>
                    <polygon points="100,72 125,90 116,121 84,121 75,90" fill="none" stroke="#E2E8F0" stroke-width="2"/>
                    <line x1="100" y1="100" x2="100" y2="20" stroke="#C7D2FE" stroke-width="1" stroke-dasharray="4"/>
                    <line x1="100" y1="100" x2="176" y2="75" stroke="#C7D2FE" stroke-width="1" stroke-dasharray="4"/>
                    <line x1="100" y1="100" x2="147" y2="165" stroke="#C7D2FE" stroke-width="1" stroke-dasharray="4"/>
                    <line x1="100" y1="100" x2="53" y2="165" stroke="#C7D2FE" stroke-width="1" stroke-dasharray="4"/>
                    <line x1="100" y1="100" x2="24" y2="75" stroke="#C7D2FE" stroke-width="1" stroke-dasharray="4"/>
                    <polygon points="100,42 165,79 135,149 69,142 39,80" fill="rgba(99, 102, 241, 0.16)" stroke="#6366F1" stroke-width="2"/>
                    <circle cx="100" cy="42" r="6" fill="#4F46E5"/>
                    <circle cx="165" cy="79" r="6" fill="#818CF8"/>
                    <circle cx="135" cy="149" r="6" fill="#22C55E"/>
                    <circle cx="69" cy="142" r="6" fill="#F59E0B"/>
                    <circle cx="39" cy="80" r="6" fill="#A855F7"/>
                  </svg>
                  <div class="absolute inset-0 flex items-center justify-center">
                    <div class="text-center">
                      <div class="text-2xl font-bold text-indigo-900">综合</div>
                      <div class="text-sm text-indigo-600">能力</div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="flex flex-wrap justify-center gap-4 mt-4 text-sm">
                <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-indigo-600"></span>加法</span>
                <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-indigo-400"></span>减法</span>
                <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-green-500"></span>乘法</span>
                <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-amber-500"></span>除法</span>
                <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-purple-500"></span>四则运算</span>
              </div>
            </div>
          </div>
        </div>

        <div id="page-2-loading" class="hidden">
          <nav class="lg:hidden flex justify-around p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100">
            <div class="skeleton w-16 h-10"></div>
            <div class="skeleton w-16 h-10"></div>
            <div class="skeleton w-16 h-10"></div>
            <div class="skeleton w-16 h-10"></div>
            <div class="skeleton w-16 h-10"></div>
          </nav>
          <div class="p-6 space-y-6">
            <div class="skeleton h-48"></div>
            <div class="grid grid-cols-2 gap-4">
              <div class="skeleton h-24"></div>
              <div class="skeleton h-24"></div>
              <div class="skeleton h-24"></div>
              <div class="skeleton h-24"></div>
            </div>
            <div class="skeleton h-64"></div>
          </div>
        </div>

        <div id="page-2-empty" class="hidden">
          <nav class="lg:hidden flex justify-around p-4 bg-white/80 backdrop-blur-sm border-b border-indigo-100">
            <div class="nav-item active"><i data-lucide="home" class="w-5 h-5"></i><span>首页</span></div>
            <div class="nav-item"><i data-lucide="book-open" class="w-5 h-5"></i><span>学习</span></div>
            <div class="nav-item"><i data-lucide="pen-tool" class="w-5 h-5"></i><span>练习</span></div>
            <div class="nav-item"><i data-lucide="file-x" class="w-5 h-5"></i><span>错题本</span></div>
            <div class="nav-item"><i data-lucide="wrench" class="w-5 h-5"></i><span>工具</span></div>
          </nav>
          <div class="empty-state">
            <div class="empty-state-icon">
              <i data-lucide="sparkles" class="w-16 h-16 text-indigo-300"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">欢迎开始学习</h3>
            <p class="text-gray-500 mb-6">还没有学习记录，现在开始你的计算之旅吧！</p>
            <button class="clay-button clay-button-cta" onclick="goToPage(3)">
              开始学习
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="verificationModal" class="verification-modal">
      <div class="verification-content bounce-in">
        <h3 class="text-xl font-bold text-indigo-900 mb-2">请完成验证</h3>
        <p class="text-gray-500 mb-6">按住滑块拖动到最右侧完成验证</p>
        <div class="slider-container">
          <div class="slider-track">
            <div class="slider-fill" id="sliderFill" style="width: 0%"></div>
            <div class="slider-handle" id="sliderHandle" style="left: 4px"></div>
          </div>
        </div>
        <div class="text-sm text-gray-400 mt-4">
          <span id="sliderStatus">向右滑动完成验证</span>
        </div>
        <button class="clay-button clay-button-secondary w-full mt-6" onclick="closeVerificationModal()">
          取消
        </button>
      </div>
    </div>
  </div>

  <script src="./src/prototype.js"></script>
</body>
</html>
