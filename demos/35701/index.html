<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>童言 - 0-9岁儿童言语康复训练</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Nunito', 'PingFang SC', sans-serif; background: linear-gradient(135deg, #FFF8F0 0%, #F0F8FF 100%); min-height: 100vh; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 159, 67, 0.3); border-radius: 3px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.15); opacity: 0.8; } }
        @keyframes ripple { 0% { width: 60px; height: 60px; opacity: 0.8; } 100% { width: 120px; height: 120px; opacity: 0; } }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-10px) rotate(5deg); } }
        @keyframes speak { 0%, 100% { transform: scale(1); } 25% { transform: scale(1.1) rotate(-5deg); } 75% { transform: scale(1.1) rotate(5deg); } }
        @keyframes starBurst { 0% { transform: scale(0) rotate(0deg); opacity: 1; } 100% { transform: scale(2) rotate(180deg); opacity: 0; } }
        @keyframes wave { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(20deg); } 75% { transform: rotate(-20deg); } }
        @keyframes mouthOpen { 0%, 100% { transform: scaleY(0.1); } 50% { transform: scaleY(1); } }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        .animate-bounce { animation: bounce 2s ease-in-out infinite; }
        .animate-pulse { animation: pulse 2s ease-in-out infinite; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-speak { animation: speak 0.5s ease-in-out; }
        .animate-wave { animation: wave 1s ease-in-out infinite; }
        .animate-mouth { animation: mouthOpen 0.8s ease-in-out infinite; }
        .gradient-orange { background: linear-gradient(135deg, #FF9F43 0%, #FF6B6B 100%); }
        .gradient-blue { background: linear-gradient(135deg, #54A0FF 0%, #5F27CD 100%); }
        .gradient-green { background: linear-gradient(135deg, #1DD1A1 0%, #10AC84 100%); }
        .gradient-purple { background: linear-gradient(135deg, #A29BFE 0%, #6C5CE7 100%); }
        .gradient-pink { background: linear-gradient(135deg, #FF9FF3 0%, #F368E0 100%); }
        .card-shadow { box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04); }
        .btn-glow:hover { box-shadow: 0 0 20px rgba(255, 159, 67, 0.5); }
        .recording-ripple { position: absolute; border: 3px solid #FF6B6B; border-radius: 50%; animation: ripple 1.2s ease-out infinite; }
        .progress-ring { transform: rotate(-90deg); }
        .mouth-animation { transform-origin: center; }
        .touch-target { min-height: 48px; min-width: 48px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        const { useState, useEffect, useCallback, useRef } = React;
        const e = React.createElement;

        // ==================== 数据定义 ====================
        const AGE_GROUPS = {
            infant: { id: 'infant', name: '婴幼儿段', range: '0-3岁', color: '#FFB6C1', icon: '👶' },
            preschool: { id: 'preschool', name: '学龄前', range: '3-6岁', color: '#87CEEB', icon: '🧒' },
            school: { id: 'school', name: '学龄初', range: '6-9岁', color: '#98D8AA', icon: '👧' }
        };

        const MODULES = {
            auditory: { id: 'auditory', name: '听觉感知', icon: '👂', color: 'from-pink-400 to-rose-400', desc: '声音分辨训练' },
            oral: { id: 'oral', name: '口腔训练', icon: '👄', color: 'from-orange-400 to-red-400', desc: '口肌运动训练' },
            breath: { id: 'breath', name: '气息控制', icon: '🌬️', color: 'from-cyan-400 to-blue-400', desc: '吹气练习' },
            comprehension: { id: 'comprehension', name: '语言理解', icon: '🧠', color: 'from-purple-400 to-violet-400', desc: '指令理解' },
            expression: { id: 'expression', name: '语言表达', icon: '💬', color: 'from-green-400 to-teal-400', desc: '口语表达' },
            sign: { id: 'sign', name: '手语学习', icon: '🤟', color: 'from-yellow-400 to-amber-400', desc: '手语联动' },
            emotion: { id: 'emotion', name: '情绪安抚', icon: '🌈', color: 'from-rose-400 to-pink-400', desc: '情绪识别' }
        };

        const hearingExercises = [
            { id: 1, type: 'animal', sound: '汪汪', word: '狗', emoji: '🐕', isCorrect: false },
            { id: 2, type: 'animal', sound: '喵喵', word: '猫', emoji: '🐱', isCorrect: false },
            { id: 3, type: 'animal', sound: '叽叽', word: '鸟', emoji: '🐦', isCorrect: false },
            { id: 4, type: 'environment', sound: '叮咚', word: '门铃', emoji: '🔔', isCorrect: false },
            { id: 5, type: 'instrument', sound: '铛铛', word: '铃铛', emoji: '🔔', isCorrect: false },
        ];

        const oralExercises = [
            { id: 1, name: '伸舌', desc: '把舌头尽量伸出来', icon: '👅', difficulty: 1 },
            { id: 2, name: '卷舌', desc: '把舌头卷起来', icon: '👅', difficulty: 1 },
            { id: 3, name: '鼓腮', desc: '把嘴巴鼓起来像气球', icon: '😮', difficulty: 1 },
            { id: 4, name: '噘嘴', desc: '把嘴唇噘起来', icon: '😗', difficulty: 1 },
            { id: 5, name: '咬肌', desc: '咬紧牙关', icon: '😬', difficulty: 2 },
        ];

        const breathGames = [
            { id: 1, name: '吹泡泡', desc: '轻轻吹气，让泡泡飞起来', emoji: '🫧', duration: 5 },
            { id: 2, name: '吹蜡烛', desc: '用力吹灭蜡烛火焰', emoji: '🕯️', duration: 3 },
            { id: 3, name: '吹纸片', desc: '把纸片吹得飘起来', emoji: '📄', duration: 5 },
        ];

        const vocabularyData = {
            animals: [
                { id: 1, word: '猫', pinyin: 'māo', emoji: '🐱' },
                { id: 2, word: '狗', pinyin: 'gǒu', emoji: '🐕' },
                { id: 3, word: '鸟', pinyin: 'niǎo', emoji: '🐦' },
                { id: 4, word: '鱼', pinyin: 'yú', emoji: '🐟' },
            ],
            food: [
                { id: 1, word: '苹果', pinyin: 'píng guǒ', emoji: '🍎' },
                { id: 2, word: '香蕉', pinyin: 'xiāng jiāo', emoji: '🍌' },
                { id: 3, word: '米饭', pinyin: 'mǐ fàn', emoji: '🍚' },
                { id: 4, word: '牛奶', pinyin: 'niú nǎi', emoji: '🥛' },
            ],
            family: [
                { id: 1, word: '妈妈', pinyin: 'mā ma', emoji: '👩' },
                { id: 2, word: '爸爸', pinyin: 'bà ba', emoji: '👨' },
                { id: 3, word: '爷爷', pinyin: 'yé ye', emoji: '👴' },
                { id: 4, word: '奶奶', pinyin: 'nǎi nai', emoji: '👵' },
            ],
            actions: [
                { id: 1, word: '吃', pinyin: 'chī', emoji: '🍽️' },
                { id: 2, word: '喝', pinyin: 'hē', emoji: '🥤' },
                { id: 3, word: '走', pinyin: 'zǒu', emoji: '🚶' },
                { id: 4, word: '跑', pinyin: 'pǎo', emoji: '🏃' },
            ]
        };

        const sentenceTemplates = [
            { id: 1, template: '我要___', example: '我要苹果', words: ['苹果', '香蕉', '牛奶', '面包'] },
            { id: 2, template: '这是___', example: '这是猫', words: ['猫', '狗', '鸟', '鱼'] },
            { id: 3, template: '我喜欢___', example: '我喜欢妈妈', words: ['妈妈', '爸爸', '爷爷', '奶奶'] },
            { id: 4, template: '___在哪里', example: '妈妈在哪里', words: ['妈妈', '爸爸', '哥哥', '姐姐'] },
        ];

        const signLanguageData = [
            { id: 1, word: '你好', sign: '👋', desc: '挥手打招呼' },
            { id: 2, word: '谢谢', sign: '🤝', desc: '双手合十表示感谢' },
            { id: 3, word: '再见', sign: '👋', desc: '挥手说再见' },
            { id: 4, word: '我爱你', sign: '❤️', desc: '比心动作' },
            { id: 5, word: '对不起', sign: '😔', desc: '双手合十鞠躬' },
            { id: 6, word: '请', sign: '🙏', desc: '掌心向上示意' },
        ];

        const achievements = [
            { id: 1, name: '初次发声', icon: '🎵', desc: '完成第一次发音练习', earned: true, progress: 100 },
            { id: 2, name: '耳朵灵敏', icon: '👂', desc: '完成听觉训练5次', earned: true, progress: 100 },
            { id: 3, name: '口肌达人', icon: '💪', desc: '完成口腔训练10次', earned: false, progress: 70 },
            { id: 4, name: '气息大师', icon: '🌬️', desc: '完成吹气训练8次', earned: false, progress: 50 },
            { id: 5, name: '词汇小天才', icon: '📚', desc: '学习50个词汇', earned: false, progress: 30 },
            { id: 6, name: '句子小达人', icon: '💬', desc: '构建20个句子', earned: false, progress: 20 },
            { id: 7, name: '坚持之星', icon: '⭐', desc: '连续训练7天', earned: true, progress: 100 },
            { id: 8, name: '手语小能手', icon: '🤟', desc: '学习10个手语', earned: false, progress: 40 },
        ];

        const parentReports = [
            { date: '今天', duration: 15, modules: ['听觉训练', '口腔训练'], progress: 85, note: '表现很棒！' },
            { date: '昨天', duration: 18, modules: ['气息训练', '词汇学习'], progress: 78, note: '有进步' },
            { date: '6月18日', duration: 12, modules: ['发音练习'], progress: 92, note: '发音越来越清晰' },
        ];

        const doctors = [
            { id: 1, name: '王康复师', title: '资深言语治疗师', hospital: '儿童康复中心', avatar: '👩‍⚕️', available: true },
            { id: 2, name: '李医生', title: '儿童语言发育专家', hospital: '人民医院', avatar: '👨‍⚕️', available: false },
        ];

        // ==================== 工具函数 ====================
        const speak = (text, rate = 0.8) => {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = rate;
                utterance.pitch = 1.1;
                speechSynthesis.speak(utterance);
            }
        };

        const playSound = (type) => {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.gain.value = 0.3;
            switch(type) {
                case 'success': oscillator.frequency.value = 880; break;
                case 'error': oscillator.frequency.value = 220; break;
                case 'click': oscillator.frequency.value = 440; break;
                case 'reward': oscillator.frequency.value = 660; break;
            }
            oscillator.start();
            setTimeout(() => { oscillator.stop(); audioContext.close(); }, 200);
        };

        // ==================== 组件定义 ====================

        // 底部导航
        function Navigation({ currentPage, onNavigate, role }) {
            const navItems = role === 'parent' ? [
                { id: 'parent-home', label: '首页', icon: '🏠' },
                { id: 'parent-reports', label: '报告', icon: '📊' },
                { id: 'parent-plan', label: '计划', icon: '📋' },
                { id: 'parent-doctor', label: '医生', icon: '👨‍⚕️' },
                { id: 'parent-settings', label: '设置', icon: '⚙️' },
            ] : [
                { id: 'home', label: '首页', icon: '🏠' },
                { id: 'training', label: '训练', icon: '🎯' },
                { id: 'games', label: '游戏', icon: '🎮' },
                { id: 'profile', label: '我的', icon: '👤' },
            ];

            return e('nav', { className: 'fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-sm shadow-[0_-4px_20px_rgba(0,0,0,0.08)] z-50 border-t border-gray-100' },
                e('div', { className: 'max-w-md mx-auto px-2' },
                    e('div', { className: 'flex justify-around items-center py-2' },
                        navItems.map(item =>
                            e('button', {
                                key: item.id,
                                onClick: () => onNavigate(item.id),
                                className: `flex flex-col items-center py-2 px-3 rounded-xl transition-all duration-200 touch-target ${
                                    currentPage === item.id
                                        ? 'bg-gradient-to-b from-orange-50 to-orange-100 text-orange-500'
                                        : 'text-gray-400 active:text-gray-600'
                                }`
                            },
                                e('span', { className: 'text-xl mb-0.5' }, item.icon),
                                e('span', { className: 'text-xs font-semibold' }, item.label)
                            )
                        )
                    )
                )
            );
        }

        // 进度环
        function ProgressRing({ progress, size = 100, strokeWidth = 10, color = '#FF9F43' }) {
            const radius = (size - strokeWidth) / 2;
            const circumference = radius * 2 * Math.PI;
            const offset = circumference - (progress / 100) * circumference;
            return e('div', { className: 'relative inline-flex items-center justify-center' },
                e('svg', { width: size, height: size, className: 'progress-ring' },
                    e('circle', { className: 'text-gray-200', strokeWidth: strokeWidth, stroke: 'currentColor', fill: 'transparent', r: radius, cx: size / 2, cy: size / 2 }),
                    e('circle', {
                        className: 'transition-all duration-1000 ease-out', strokeWidth: strokeWidth,
                        strokeDasharray: circumference, strokeDashoffset: offset,
                        strokeLinecap: 'round', stroke: color, fill: 'transparent', r: radius, cx: size / 2, cy: size / 2
                    })
                ),
                e('div', { className: 'absolute flex flex-col items-center' },
                    e('span', { className: 'text-2xl font-bold text-gray-800' }, `${progress}%`)
                )
            );
        }

        // 星星动画
        function StarBurst({ show }) {
            if (!show) return null;
            return e('div', { className: 'fixed inset-0 pointer-events-none z-50' },
                [...Array(8)].map((_, i) =>
                    e('div', {
                        key: i,
                        className: 'absolute text-4xl animate-starBurst',
                        style: {
                            left: '50%', top: '50%',
                            animationDelay: `${i * 0.1}s`,
                            transform: `rotate(${i * 45}deg) translateY(-50px)`
                        }
                    }, '⭐')
                )
            );
        }

        // 年龄段选择器
        function AgeSelector({ selectedAge, onSelect }) {
            return e('div', { className: 'flex gap-3 justify-center mb-6' },
                Object.values(AGE_GROUPS).map(group =>
                    e('button', {
                        key: group.id,
                        onClick: () => onSelect(group.id),
                        className: `px-4 py-3 rounded-2xl flex items-center gap-2 transition-all duration-300 touch-target ${
                            selectedAge === group.id
                                ? 'gradient-orange text-white shadow-lg scale-105'
                                : 'bg-white text-gray-600 hover:shadow-md'
                        }`
                    },
                        e('span', { className: 'text-xl' }, group.icon),
                        e('span', { className: 'font-semibold text-sm' }, group.range)
                    )
                )
            );
        }

        // 首页 - 儿童端
        function HomePage({ childName, ageGroup, onNavigate }) {
            const [stars, setStars] = useState(128);
            const [showStars, setShowStars] = useState(false);
            const [todayProgress] = useState(65);

            const quickModules = [
                { ...MODULES.auditory, page: 'auditory-training' },
                { ...MODULES.oral, page: 'oral-training' },
                { ...MODULES.comprehension, page: 'comprehension-training' },
                { ...MODULES.expression, page: 'expression-training' },
                { ...MODULES.sign, page: 'sign-training' },
                { ...MODULES.emotion, page: 'emotion-training' },
            ];

            const todayTasks = [
                { id: 1, title: '听觉分辨', desc: '区分动物叫声', progress: 80, icon: '👂', module: 'auditory-training', color: 'from-pink-400 to-rose-400' },
                { id: 2, title: '口腔运动', desc: '舌头力量练习', progress: 60, icon: '👄', module: 'oral-training', color: 'from-orange-400 to-red-400' },
                { id: 3, title: '气息训练', desc: '吹泡泡游戏', progress: 40, icon: '🌬️', module: 'breath-training', color: 'from-cyan-400 to-blue-400' },
                { id: 4, title: '词汇学习', desc: '动物类词汇', progress: 50, icon: '📚', module: 'vocabulary-training', color: 'from-purple-400 to-violet-400' },
            ];

            const handleTaskClick = (module) => {
                onNavigate(module);
            };

            return e('div', { className: 'min-h-screen pb-20 animate-fadeIn' },
                e(StarBurst, { show: showStars }),
                // 头部
                e('div', { className: 'gradient-orange text-white px-5 pt-10 pb-6 rounded-b-3xl' },
                    e('div', { className: 'max-w-md mx-auto' },
                        e('div', { className: 'flex items-center justify-between mb-5' },
                            e('div', null,
                                e('p', { className: 'text-orange-100 text-sm mb-1' }, AGE_GROUPS[ageGroup].icon + ' ' + AGE_GROUPS[ageGroup].name),
                                e('h1', { className: 'text-2xl font-bold' }, `你好，${childName}！👋`)
                            ),
                            e('div', {
                                onClick: () => { setShowStars(true); setTimeout(() => setShowStars(false), 1000); },
                                className: 'bg-white/20 backdrop-blur-sm rounded-2xl px-4 py-2 cursor-pointer active:scale-95 transition-transform'
                            },
                                e('span', { className: 'text-2xl mr-1' }, '⭐'),
                                e('span', { className: 'text-xl font-bold' }, stars)
                            )
                        ),
                        // 今日进度
                        e('div', { className: 'bg-white/95 backdrop-blur-sm rounded-3xl p-5 card-shadow' },
                            e('div', { className: 'flex items-center justify-between' },
                                e('div', { className: 'flex-1' },
                                    e('h3', { className: 'font-bold text-gray-800 mb-2' }, '今日学习进度'),
                                    e('div', { className: 'w-full bg-gray-200 rounded-full h-3 mb-2' },
                                        e('div', { className: 'h-3 rounded-full bg-gradient-to-r from-yellow-400 to-orange-400 transition-all duration-1000', style: { width: `${todayProgress}%` } })
                                    ),
                                    e('p', { className: 'text-sm text-gray-500' }, `已完成 ${todayProgress}% 的训练任务`)
                                ),
                                e('div', { className: 'ml-4' }, e(ProgressRing, { progress: todayProgress, size: 80 }))
                            )
                        )
                    )
                ),
                e('div', { className: 'max-w-md mx-auto px-5 mt-6' },
                    // 训练模块入口
                    e('div', { className: 'mb-6' },
                        e('h2', { className: 'text-lg font-bold text-gray-800 mb-4' }, '🎯 开始训练'),
                        e('div', { className: 'grid grid-cols-3 gap-3' },
                            quickModules.map(mod =>
                                e('button', {
                                    key: mod.id,
                                    onClick: () => onNavigate(mod.page),
                                    className: 'bg-white rounded-2xl p-4 card-shadow active:scale-95 transition-all duration-200'
                                },
                                    e('div', { className: `w-12 h-12 rounded-xl bg-gradient-to-br ${mod.color} flex items-center justify-center mb-2 mx-auto text-2xl` }, mod.icon),
                                    e('h3', { className: 'font-bold text-gray-800 text-sm' }, mod.name),
                                    e('p', { className: 'text-xs text-gray-500 mt-1' }, mod.desc)
                                )
                            )
                        )
                    ),
                    // 今日任务
                    e('div', { className: 'mb-6' },
                        e('h2', { className: 'text-lg font-bold text-gray-800 mb-4' }, '📋 今日任务'),
                        e('div', { className: 'space-y-3' },
                            todayTasks.map(task =>
                                e('div', {
                                    key: task.id,
                                    onClick: () => handleTaskClick(task.module),
                                    className: 'bg-white rounded-2xl p-4 card-shadow cursor-pointer active:scale-[0.98] transition-all duration-200'
                                },
                                    e('div', { className: 'flex items-center gap-4' },
                                        e('div', { className: `w-12 h-12 rounded-xl bg-gradient-to-br ${task.color} flex items-center justify-center text-2xl` }, task.icon),
                                        e('div', { className: 'flex-1' },
                                            e('h3', { className: 'font-bold text-gray-800' }, task.title),
                                            e('p', { className: 'text-sm text-gray-500' }, task.desc)
                                        ),
                                        e('div', { className: 'text-right' },
                                            e('span', { className: 'text-sm font-bold text-orange-500' }, `${task.progress}%`),
                                            e('div', { className: 'w-16 bg-gray-200 rounded-full h-1.5 mt-1' },
                                                e('div', { className: `h-1.5 rounded-full bg-gradient-to-r ${task.color}`, style: { width: `${task.progress}%` } })
                                            )
                                        )
                                    )
                                )
                            )
                        )
                    ),
                    // 成就墙
                    e('div', { className: 'mb-6' },

                }
                return () => clearInterval(interval);
            }, [isBlowing, breathLevel]);

                        id: Date.now() + i,
                        x: Math.random() * 80 + 10,
                        size: Math.random() * 30 + 20

                    setBreathLevel(0);
                    playSound('success');

        // AI评测页面
        function AIPronunciationPage({ onBack }) {
            const [isRecording, setIsRecording] = useState(false);
            const [score, setScore] = useState(null);
            const [showResult, setShowResult] = useState(false);
            const [recordingTime, setRecordingTime] = useState(0);
            const [waveform, setWaveform] = useState([]);

            const testWords = ['苹果', '香蕉', '妈妈', '爸爸', '蛋糕'];

            useEffect(() => {
                let interval;
                if (isRecording) {
                    interval = setInterval(() => {
                        setRecordingTime(t => t + 1);
                        // 模拟波形数据
                        setWaveform(prev => [...prev.slice(-20), Math.random() * 40 + 10]);
                    }, 100);
                }
                return () => clearInterval(interval);
            }, [isRecording]);

            const startRecording = () => {
                setIsRecording(true);
                setRecordingTime(0);
                setWaveform([]);
                setShowResult(false);
                speak('请跟我读');
            };

            const stopRecording = () => {
                setIsRecording(false);
                const newScore = Math.floor(Math.random() * 20) + 80;
                setScore(newScore);
                setShowResult(true);
                playSound('reward');
            };

            return e('div', { className: 'min-h-screen pb-20 animate-fadeIn' },
                e('div', { className: 'gradient-orange text-white px-5 pt-10 pb-6 rounded-b-3xl' },
                    e('div', { className: 'max-w-md mx-auto' },
                        e('div', { className: 'flex items-center gap-4 mb-4' },

                        ),
                        e('p', { className: 'text-orange-100' }, 'AI实时分析你的发音')
                    )
                ),
                e('div', { className: 'max-w-md mx-auto px-5 mt-6' },

                        // 发音示范

                            e('p', { className: 'text-gray-500 mb-2' }, '跟读词汇'),
                            e('div', { className: 'text-5xl font-bold text-orange-500 animate-pulse' },
                                testWords[Math.floor(recordingTime / 3) % testWords.length]
                            )
                        ),
                        // 波形显示
                        e('div', { className: 'h-24 bg-gray-100 rounded-2xl mb-6 flex items-center justify-center overflow-hidden' },
                            isRecording ? e('div', { className: 'flex items-center gap-1' },
                                waveform.map((h, i) =>
                                    e('div', {
                                        key: i,
                                        className: 'w-1.5 bg-orange-400 rounded-full animate-pulse',
                                        style: { height: `${h}px`, animationDelay: `${i * 0.02}s` }
                                    })

                            ) : e('p', { className: 'text-gray-400' }, '准备就绪')
                        ),
                        // 录音按钮
                        e('div', { className: 'text-center' },
                            e('div', { className: 'relative inline-block' },
                                isRecording && e('div', { className: 'recording-ripple', style: { top: '50%', left: '50%', transform: 'translate(-50%, -50%)' } }),
                                e('button', {
                                    onClick: isRecording ? stopRecording : startRecording,
                                    className: `w-20 h-20 rounded-full flex items-center justify-center text-3xl transition-all duration-300 ${
                                        isRecording ? 'bg-red-500 animate-pulse' : 'gradient-orange btn-glow'

                            ),
                            e('p', { className: 'mt-4 text-gray-600 font-semibold' },

                    ),
                    // 导出报告按钮
                    e('button', { className: 'w-full py-4 gradient-blue text-white rounded-2xl font-bold' }, '📥 导出PDF报告')
                )
            );
        }

        // 康复计划页面
        function ParentPlanPage({ onBack }) {
            const plan = [
                { time: '09:00-09:15', module: '听觉分辨训练', type: '感知训练' },
                { time: '09:30-09:45', module: '口腔运动训练', type: '构音训练' },
                { time: '10:00-10:20', module: '词汇学习', type: '语言理解' },
                { time: '14:00-14:15', module: '气息训练', type: '呼吸训练' },
                { time: '15:00-15:20', module: '句子构建', type: '表达训练' },
            ];

            return e('div', { className: 'min-h-screen pb-20 animate-fadeIn' },
                e('div', { className: 'bg-gradient-to-r from-blue-500 to-indigo-600 text-white px-5 pt-10 pb-6' },
                    e('div', { className: 'max-w-md mx-auto' },
                        e('div', { className: 'flex items-center gap-4' },
                            e('button', { onClick: onBack, className: 'w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-xl' }, '←'),
                            e('h1', { className: 'text-xl font-bold' }, '康复计划 📋')
                        ),
                        e('p', { className: 'text-blue-100 mt-2' }, '今日居家康复训练安排')
                    )
                ),
                e('div', { className: 'max-w-md mx-auto px-5 mt-6' },
                    e('div', { className: 'space-y-4' },
                        plan.map((item, i) =>
                            e('div', { key: i, className: 'bg-white rounded-2xl p-4 card-shadow flex items-center gap-4' },
                                e('div', { className: 'w-16 text-center' },
                                    e('p', { className: 'text-sm font-bold text-blue-500' }, item.time.split('-')[0]),
                                    e('p', { className: 'text-xs text-gray-400' }, item.time.split('-')[1]
                                ),
                                e('div', { className: 'w-1 h-12 rounded-full bg-gradient-to-b from-blue-400 to-indigo-400' }),
                                e('div', { className: 'flex-1' },
                                    e('h3', { className: 'font-bold text-gray-800' }, item.module),
                                    e('p', { className: 'text-xs text-gray-500' }, item.type)
                                ),
                                e('span', {
                                    className: `px-3 py-1 rounded-full text-xs font-semibold ${
                                        i === 0 ? 'bg-green-100 text-green-600' : 'bg-gray-100 text-gray-500'
                                    }`
                                }, i === 0 ? '进行中' : '待开始')
                            )
                        )
                    ),
                    e('div', { className: 'mt-6 bg-blue-50 rounded-2xl p-4' },
                        e('h4', { className: 'font-bold text-gray-800 mb-2' }, '💡 居家训练小贴士'),
                        e('p', { className: 'text-sm text-gray-600' }, '• 保持环境安静，减少干扰\n• 每次训练后给予适当鼓励\n• 如有疑问可联系康复师')
                    )
                )
            );
        }

        // 医生联动页面
        function DoctorPage({ onBack }) {
            const [selectedDoctor, setSelectedDoctor] = useState(null);

            return e('div', { className: 'min-h-screen pb-20 animate-fadeIn' },
                e('div', { className: 'bg-gradient-to-r from-blue-500 to-indigo-600 text-white px-5 pt-10 pb-6' },
                    e('div', { className: 'max-w-md mx-auto' },
                        e('div', { className: 'flex items-center gap-4' },
                            e('button', { onClick: onBack, className: 'w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-xl' }, '←'),
                            e('h1', { className: 'text-xl font-bold' }, '医师联动 👨‍⚕️')
                        ),
                        e('p', { className: 'text-blue-100 mt-2' }, '联系专业康复师获取指导')
                    )
                ),
                e('div', { className: 'max-w-md mx-auto px-5 mt-6' },
                    e('h3', { className: 'font-bold text-gray-800 mb-4' }, '我的康复师'),
                    e('div', { className: 'space-y-4' },
                        doctors.map(doctor =>
                            e('div', { key: doctor.id, className: 'bg-white rounded-2xl p-4 card-shadow' },
                                e('div', { className: 'flex items-center gap-4' },
                                    e('div', { className: 'w-14 h-14 rounded-full bg-gradient-to-br from-blue-400 to-indigo-500 flex items-center justify-center text-2xl' }, doctor.avatar),
                                    e('div', { className: 'flex-1' },
                                        e('h3', { className: 'font-bold text-gray-800' }, doctor.name),
                                        e('p', { className: 'text-sm text-gray-500' }, doctor.title),
                                        e('p', { className: 'text-xs text-gray-400' }, doctor.hospital)
                                    ),
                                    e('span', {
                                        className: `px-3 py-1 rounded-full text-xs font-semibold ${
                                            doctor.available ? 'bg-green-100 text-green-600' : 'bg-gray-100 text-gray-400'
                                        }`
                                    }, doctor.available ? '可预约' : '已离线')
                                ),
                                doctor.available && e('button', {
                                    onClick: () => setSelectedDoctor(doctor),
                                    className: 'w-full mt-4 py-2 bg-blue-500 text-white rounded-xl font-semibold'
                                }, '预约视频会诊')
                            )
                        )
                    ),
                    selectedDoctor && e('div', { className: 'mt-6 bg-white rounded-3xl p-6 card-shadow' },
                        e('h3', { className: 'font-bold text-gray-800 mb-4' }, '预约确认'),
                        e('p', { className: 'text-gray-600 mb-4' }, `确定预约 ${selectedDoctor.name} 线上会诊吗？`),
                        e('div', { className: 'flex gap-3' },
                            e('button', {
                                onClick: () => setSelectedDoctor(null),
                                className: 'flex-1 py-3 bg-gray-100 text-gray-600 rounded-xl font-semibold'
                            }, '取消'),
                            e('button', {
                                onClick: () => { alert('预约成功！'); setSelectedDoctor(null); },
                                className: 'flex-1 py-3 gradient-blue text-white rounded-xl font-semibold'
                            }, '确认预约')
                        )
                    )
                )
            );
        }

        // ==================== 主应用 ====================
        function App() {
            const [currentPage, setCurrentPage] = useState('home');
            const [role, setRole] = useState('child'); // 'child' or 'parent'
            const [childName] = useState('小明');
            const [childAge] = useState(5);
            const [ageGroup, setAgeGroup] = useState('preschool');

            const handleNavigate = (page) => {
                setCurrentPage(page);
            };

            const handleBack = () => {
                if (role === 'parent') {
                    setCurrentPage('parent-home');
                } else {
                    setCurrentPage('home');
                }
            };

            const renderPage = () => {
                // 家长端页面
                if (role === 'parent') {
                    switch (currentPage) {
                        case 'parent-home': return e(ParentHomePage, { onNavigate: handleNavigate });
                        case 'parent-reports': return e(ParentReportsPage, { onBack: handleBack });
                        case 'parent-plan': return e(ParentPlanPage, { onBack: handleBack });
                        case 'parent-doctor': return e(DoctorPage, { onBack: handleBack });
                        default: return e(ParentHomePage, { onNavigate: handleNavigate });
                    }
                }

                // 儿童端页面
                switch (currentPage) {
                    case 'home': return e(HomePage, { childName, ageGroup, onNavigate: handleNavigate });
                    case 'auditory-training': return e(AuditoryTrainingPage, { onBack: handleBack });
                    case 'oral-training': return e(OralTrainingPage, { onBack: handleBack });
                    case 'breath-training': return e(BreathTrainingPage, { onBack: handleBack });
                    case 'vocabulary-training': return e(VocabularyPage, { onBack: handleBack });
                    case 'sentence-training': return e(SentencePage, { onBack: handleBack });
                    case 'sign-training': return e(SignLanguagePage, { onBack: handleBack });
                    case 'emotion-training': return e(EmotionPage, { onBack: handleBack });
                    case 'ai-pronunciation': return e(AIPronunciationPage, { onBack: handleBack });
                    case 'profile': return e(ProfilePage, { childName, childAge, ageGroup, onBack: handleBack });
                    default: return e(HomePage, { childName, ageGroup, onNavigate: handleNavigate });
                }
            };

            return e('div', { className: 'min-h-screen bg-gradient-to-b from-orange-50 to-blue-50' },
                // 顶部角色切换
                e('div', { className: 'fixed top-0 left-0 right-0 z-40 bg-white/80 backdrop-blur-sm border-b border-gray-100' },
                    e('div', { className: 'max-w-md mx-auto px-4 py-2' },
                        e('div', { className: 'flex justify-between items-center' },
                            e('div', { className: 'text-xl font-bold text-orange-500' }, '童言'),
                            e('div', { className: 'flex gap-2' },
                                e('button', {
                                    onClick: () => { setRole('child'); setCurrentPage('home'); },
                                    className: `px-4 py-1.5 rounded-full text-sm font-semibold transition-all ${
                                        role === 'child' ? 'gradient-orange text-white' : 'bg-gray-100 text-gray-500'
                                    }`
                                }, '儿童端'),
                                e('button', {
                                    onClick: () => { setRole('parent'); setCurrentPage('parent-home'); },
                                    className: `px-4 py-1.5 rounded-full text-sm font-semibold transition-all ${
                                        role === 'parent' ? 'gradient-blue text-white' : 'bg-gray-100 text-gray-500'
                                    }`
                                }, '家长端')
                            )
                        )
                    )
                ),
                // 年龄段选择（仅儿童端）
                role === 'child' && currentPage === 'home' && e('div', { className: 'pt-14' },
                    e('div', { className: 'max-w-md mx-auto px-5' },
                        e('p', { className: 'text-sm text-gray-500 mb-2 text-center' }, '选择年龄段，获取适合的训练内容'),
                        e(AgeSelector, { selectedAge: ageGroup, onSelect: setAgeGroup })
                    )
                ),
                // 主内容区
                e('div', { className: 'pt-14' }, renderPage()),
                // 底部导航
                e(Navigation, { currentPage, onNavigate: handleNavigate, role })
            );
        }

        // 渲染
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(App));
    </script>
</body>
</html>
