<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>旅行攻略生成器 ✈️</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #E8985E;
  --primary-light: #F5C89A;
  --bg: #FFF8F0;
  --card-bg: #FFFFFF;
  --text: #4A3728;
  --text-light: #8B7355;
  --accent: #D4A574;
  --success: #7CB342;
  --border: #F0E0D0;
  --shadow: 0 4px 20px rgba(139,69,19,0.08);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
/* ========== 顶部 ========== */
.app-header {
  background: linear-gradient(135deg, #E8985E 0%, #D4A574 50%, #C4956A 100%);
  padding: 20px 16px 24px;
  text-align: center;
  color: #fff;
  position: relative;
  overflow: hidden;
}
.app-header::before {
  content: '✈️ 🗺️ 🏔️ 🌊 🏯 🎒';
  position: absolute;
  top: 8px;
  left: 0;
  width: 200%;
  font-size: 18px;
  letter-spacing: 20px;
  opacity: 0.2;
  animation: scroll 20s linear infinite;
}
@keyframes scroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.app-header h1 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 4px;
  position: relative;
}
.app-header p {
  font-size: 13px;
  opacity: 0.9;
  position: relative;
}

/* ========== 步骤指示器 ========== */
.steps-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px 12px;
  background: #fff;
  border-bottom: 1px solid var(--border);
  gap: 4px;
  flex-wrap: wrap;
}
.step-dot {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  background: #F0E0D0;
  color: #B8A08A;
  transition: all 0.3s;
  flex-shrink: 0;
}
.step-dot.active {
  background: var(--primary);
  color: #fff;
  transform: scale(1.15);
  box-shadow: 0 2px 12px rgba(232,152,94,0.4);
}
.step-dot.done {
  background: var(--success);
  color: #fff;
}
.step-line {
  width: 20px;
  height: 2px;
  background: #E0D0C0;
  flex-shrink: 0;
}
.step-line.done { background: var(--success); }

/* ========== 页面容器 ========== */
.page { display: none; padding: 16px; animation: fadeIn 0.3s; }
.page.active { display: block; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.page-title {
  font-size: 18px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 4px;
}
.page-desc {
  font-size: 13px;
  color: var(--text-light);
  text-align: center;
  margin-bottom: 16px;
}

/* ========== 城市选择 ========== */
.city-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.city-card {
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: all 0.3s;
  border: 3px solid transparent;
}
.city-card:active { transform: scale(0.96); }
.city-card.selected {
  border-color: var(--primary);
  box-shadow: 0 4px 20px rgba(232,152,94,0.3);
}
.city-emoji {
  font-size: 40px;
  text-align: center;
  padding: 16px 0 8px;
  background: linear-gradient(135deg, #FFF5EB, #FFE8D6);
}
.city-info {
  padding: 10px 12px 14px;
}
.city-name {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 2px;
}
.city-tag {
  font-size: 11px;
  color: var(--primary);
  background: #FFF0E0;
  padding: 2px 8px;
  border-radius: 10px;
  display: inline-block;
}
/* 自定义城市 */
.custom-city {
  margin-top: 16px;
  display: flex;
  gap: 8px;
}
.custom-city input {
  flex: 1;
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 15px;
  outline: none;
  background: #fff;
}
.custom-city input:focus { border-color: var(--primary); }
.custom-city button {
  padding: 12px 20px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

/* ========== 天数选择 ========== */
.days-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.day-btn {
  padding: 16px 8px;
  background: #fff;
  border: 2px solid var(--border);
  border-radius: 14px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
}
.day-btn:active { transform: scale(0.95); }
.day-btn.selected {
  border-color: var(--primary);
  background: #FFF0E0;
}
.day-num {
  font-size: 24px;
  font-weight: 700;
  color: var(--primary);
}
.day-label {
  font-size: 11px;
  color: var(--text-light);
  margin-top: 2px;
}

/* ========== 类型选择 ========== */
.type-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.type-card {
  background: #fff;
  border-radius: 16px;
  padding: 20px 16px;
  text-align: center;
  cursor: pointer;
  border: 3px solid transparent;
  transition: all 0.3s;
  box-shadow: var(--shadow);
}
.type-card:active { transform: scale(0.96); }
.type-card.selected {
  border-color: var(--primary);
  background: #FFF5EB;
}
.type-emoji { font-size: 36px; margin-bottom: 8px; }
.type-name { font-size: 15px; font-weight: 600; }
.type-desc { font-size: 11px; color: var(--text-light); margin-top: 4px; }

/* ========== 景点/美食选择 ========== */
.select-section {
  margin-bottom: 20px;
}
.section-title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-title span {
  font-size: 12px;
  color: var(--text-light);
  font-weight: 400;
}
.item-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.item-card {
  background: #fff;
  border-radius: 14px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.item-card:active { transform: scale(0.98); }
.item-card.selected {
  border-color: var(--primary);
  background: #FFF5EB;
}
.item-emoji {
  font-size: 28px;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #FFF0E0;
  border-radius: 12px;
  flex-shrink: 0;
}
.item-content { flex: 1; min-width: 0; }
.item-name { font-size: 14px; font-weight: 600; }
.item-desc {
  font-size: 11px;
  color: var(--text-light);
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.item-check {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid #D0C0B0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  font-size: 14px;
  color: #fff;
}
.item-card.selected .item-check {
  background: var(--primary);
  border-color: var(--primary);
}
/* 图片样式 */
.item-img {
  width: 44px;
  height: 44px;
  object-fit: cover;
  border-radius: 12px;
  flex-shrink: 0;
}
.select-hint {
  text-align: center;
  font-size: 12px;
  color: var(--text-light);
  margin: 12px 0;
  padding: 8px;
  background: #FFF5EB;
  border-radius: 10px;
}

/* ========== 底部按钮 ========== */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: #fff;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  z-index: 100;
}
.btn {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.btn:active { transform: scale(0.97); }
.btn-back {
  background: #F0E0D0;
  color: var(--text);
  flex: 0.6;
}
.btn-next {
  background: linear-gradient(135deg, #E8985E, #D4A574);
  color: #fff;
}
.btn-next:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.btn-generate {
  background: linear-gradient(135deg, #E8985E, #D4804A);
  color: #fff;
  font-size: 16px;
  letter-spacing: 2px;
}

/* ========== 生成中 ========== */
.generating {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(255,248,240,0.95);
  z-index: 200;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
}
.generating.show { display: flex; }
.gen-spinner {
  width: 60px;
  height: 60px;
  border: 4px solid #F0E0D0;
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.gen-text {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}
.gen-sub {
  font-size: 13px;
  color: var(--text-light);
}

/* ========== 结果页面 - 卡片式时间线布局 ========== */
#resultPage { padding: 0; }
.result-header {
  background: linear-gradient(135deg, #E8985E 0%, #D4804A 100%);
  padding: 28px 16px 24px;
  color: #fff;
  text-align: center;
  position: relative;
}
.result-header::after {
  content: '';
  position: absolute;
  bottom: -20px;
  left: 0;
  right: 0;
  height: 40px;
  background: var(--bg);
  border-radius: 20px 20px 0 0;
}
.result-header h2 { font-size: 24px; margin-bottom: 6px; font-weight: 700; }
.result-header p { font-size: 13px; opacity: 0.9; }

/* 标题区 */
.guide-hero {
  background: linear-gradient(180deg, #FFF8F0 0%, #FFF5EB 100%);
  padding: 32px 16px 20px;
  text-align: center;
  position: relative;
}
.guide-hero h2 {
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
}
.guide-hero .hero-sub {
  font-size: 14px;
  color: var(--text-light);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.guide-hero .hero-sub::before,
.guide-hero .hero-sub::after {
  content: '';
  width: 40px;
  height: 1px;
  background: var(--accent);
}

/* 统计卡片行 */
.stats-row {
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 0 16px 20px;
  background: var(--bg);
}
.stats-item {
  background: #fff;
  border-radius: 16px;
  padding: 16px 20px;
  text-align: center;
  box-shadow: 0 4px 16px rgba(232,152,94,0.12);
  flex: 1;
  max-width: 120px;
}
.stats-num {
  font-size: 28px;
  font-weight: 700;
  color: var(--primary);
  display: block;
}
.stats-label {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 2px;
}

/* 操作按钮 */
.result-actions {
  display: flex;
  gap: 10px;
  padding: 16px;
  background: var(--bg);
}
.result-actions .btn {
  padding: 12px 16px;
  font-size: 14px;
  border-radius: 12px;
}
.btn-outline {
  background: #fff;
  border: 2px solid var(--primary);
  color: var(--primary);
  flex: 0.6;
}
.result-body {
  padding: 16px;
  padding-bottom: 80px;
  background: var(--bg);
}

/* 攻略内容样式 - 概览 */
.guide-overview {
  background: #fff;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(139,69,19,0.06);
}
.guide-overview h3 {
  font-size: 17px;
  color: var(--primary);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
}
.overview-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.overview-item {
  text-align: center;
  padding: 12px 6px;
  background: #FFF8F0;
  border-radius: 14px;
}
.overview-item .ov-emoji { font-size: 24px; display: block; margin-bottom: 4px; }
.overview-item .ov-label { font-size: 11px; color: var(--text-light); }
.overview-item .ov-value { font-size: 14px; font-weight: 600; margin-top: 4px; }

/* 分日卡片网格 */
.day-cards-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  margin-bottom: 20px;
}
@media (min-width: 600px) {
  .day-cards-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
@media (min-width: 900px) {
  .day-cards-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

/* 单天卡片 */
.day-card {
  background: #fff;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(139,69,19,0.08);
  transition: transform 0.3s, box-shadow 0.3s;
}
.day-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 30px rgba(139,69,19,0.12);
}

/* 卡片头部 */
.day-card-header {
  padding: 16px 18px 12px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}

/* 彩色标签 */
.day-badge-tag {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  color: #fff;
}
.day-badge-tag.arrival { background: linear-gradient(135deg, #E74C3C, #C0392B); }
.day-badge-tag.guide { background: linear-gradient(135deg, #E67E22, #D35400); }
.day-badge-tag.free { background: linear-gradient(135deg, #27AE60, #1E8449); }
.day-badge-tag.final { background: linear-gradient(135deg, #3498DB, #2980B9); }

.day-num-date {
  text-align: right;
}
.day-number {
  display: block;
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}
.day-date {
  font-size: 12px;
  color: var(--text-light);
}

/* 每日主题 */
.day-theme {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  padding: 0 18px 14px;
  border-bottom: 1px dashed #F0E0D0;
}

/* 时间线 */
.timeline {
  padding: 14px 18px;
}
.timeline-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding-bottom: 14px;
  position: relative;
}
.timeline-item:last-child {
  padding-bottom: 0;
}
.timeline-item:not(:last-child)::before {
  content: '';
  position: absolute;
  left: 7px;
  top: 22px;
  bottom: 0;
  width: 2px;
  background: #F0E0D0;
}
.timeline-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 4px;
  position: relative;
  z-index: 1;
}
.timeline-dot.red { background: linear-gradient(135deg, #E74C3C, #C0392B); }
.timeline-dot.orange { background: linear-gradient(135deg, #E67E22, #D35400); }
.timeline-dot.green { background: linear-gradient(135deg, #27AE60, #1E8449); }
.timeline-dot.blue { background: linear-gradient(135deg, #3498DB, #2980B9); }

.timeline-time {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-light);
  min-width: 44px;
  padding-top: 3px;
}
.timeline-content {
  flex: 1;
}
.tl-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.4;
}
.tl-desc {
  font-size: 11px;
  color: var(--text-light);
  margin-top: 3px;
  line-height: 1.5;
}
.tl-info {
  display: flex;
  gap: 6px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.tl-tag {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 8px;
  background: #FFF5EB;
  color: var(--primary);
}
.tl-tag.food { background: #E8F5E9; color: #27AE60; }
.tl-tag.tip { background: #E3F2FD; color: #3498DB; }

/* 卡片底部标签 */
.day-card-footer {
  padding: 12px 18px 16px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  border-top: 1px dashed #F0E0D0;
}
.footer-tag {
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 12px;
  background: #FFF8F0;
  color: var(--primary);
}

/* 美食汇总 */
.food-section {
  background: #fff;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(139,69,19,0.06);
}
.food-section h3 {
  font-size: 17px;
  color: var(--primary);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
}
.food-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
@media (min-width: 600px) {
  .food-grid { grid-template-columns: repeat(3, 1fr); }
}
.food-card {
  background: #FFF8F0;
  border-radius: 16px;
  padding: 14px;
  text-align: center;
}
.food-emoji { font-size: 32px; margin-bottom: 8px; display: block; }
.food-img {
  width: 56px;
  height: 56px;
  object-fit: cover;
  border-radius: 14px;
  margin-bottom: 8px;
  display: block;
  margin-left: auto;
  margin-right: auto;
}
.food-name { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.food-desc { font-size: 10px; color: var(--text-light); }

/* 出行贴士 */
.tips-section {
  background: linear-gradient(135deg, #FFF5EB, #FFE8D6);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 20px;
}
.tips-section h3 {
  font-size: 16px;
  color: var(--primary);
  margin-bottom: 12px;
  font-weight: 600;
}
.tip-item {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 13px;
  line-height: 1.6;
  color: var(--text);
}
.tip-item:last-child { margin-bottom: 0; }

.footer-note {
  text-align: center;
  padding: 24px;
  font-size: 12px;
  color: var(--text-light);
}

/* ========== 响应式 ========== */
@media (min-width: 600px) {
  .city-grid { grid-template-columns: repeat(3, 1fr); }
  .days-grid { grid-template-columns: repeat(7, 1fr); }
  .overview-grid { grid-template-columns: repeat(6, 1fr); }
}
</style>
</head>
<body>

<div class="app-header">
  <h1>✈️ 旅行攻略生成器</h1>
  <p>选城市 · 挑景点 · 一键生成精美攻略</p>
</div>

<div class="steps-bar" id="stepsBar">
  <div class="step-dot active" data-step="1">1</div>
  <div class="step-line" data-line="1"></div>
  <div class="step-dot" data-step="2">2</div>
  <div class="step-line" data-line="2"></div>
  <div class="step-dot" data-step="3">3</div>
  <div class="step-line" data-line="3"></div>
  <div class="step-dot" data-step="4">4</div>
  <div class="step-line" data-line="4"></div>
  <div class="step-dot" data-step="5">5</div>
</div>

<!-- ====== Step 1: 选城市 ====== -->
<div class="page active" id="page1">
  <div class="page-title">选择目的地 🏙️</div>
  <div class="page-desc">选择热门城市或输入你想去的地方</div>
  <div class="city-grid" id="cityGrid"></div>
  <div class="custom-city">
    <input type="text" id="customCityInput" placeholder="输入其他城市名...">
    <button onclick="selectCustomCity()">确定</button>
  </div>
</div>

<!-- ====== Step 2: 选天数 ====== -->
<div class="page" id="page2">
  <div class="page-title">旅行天数 📅</div>

// ==================== 状态 ====================
let currentStep = 1;
let selectedCity = '';
let selectedDays = 0;
let selectedType = '';
let selectedSpots = [];
let selectedFoods = [];

// ==================== 初始化 ====================
function init() {
  renderCities();
  renderDays();
  renderTypes();
}

function renderCities() {
  const grid = document.getElementById('cityGrid');
  grid.innerHTML = '';
  Object.entries(cityData).forEach(([name, data]) => {
    grid.innerHTML += `
      <div class="city-card" onclick="selectCity('${name}')" data-city="${name}">
        <div class="city-emoji">${data.emoji}</div>
        <div class="city-info">
          <div class="city-name">${name}</div>
          <div class="city-tag">${data.tag}</div>
        </div>
      </div>`;
  });
}

function renderDays() {
  const grid = document.getElementById('daysGrid');
  grid.innerHTML = '';
  for (let i = 1; i <= 7; i++) {
    grid.innerHTML += `
      <div class="day-btn" onclick="selectDays(${i})" data-day="${i}">
        <div class="day-num">${i}</div>
        <div class="day-label">天</div>
      </div>`;
  }
}

function renderTypes() {
  const grid = document.getElementById('typeGrid');
  grid.innerHTML = '';
  travelTypes.forEach((t, i) => {
    grid.innerHTML += `
      <div class="type-card" onclick="selectType('${t.name}')" data-type="${t.name}">
        <div class="type-emoji">${t.emoji}</div>
        <div class="type-name">${t.name}</div>
        <div class="type-desc">${t.desc}</div>
      </div>`;
  });
}

function selectCity(name) {
  selectedCity = name;
  document.querySelectorAll('.city-card').forEach(c => c.classList.remove('selected'));
  document.querySelector(`[data-city="${name}"]`)?.classList.add('selected');
  updateBtn();
}

function selectCustomCity() {
  const input = document.getElementById('customCityInput');
  const name = input.value.trim();
  if (!name) return;
  selectedCity = name;
  document.querySelectorAll('.city-card').forEach(c => c.classList.remove('selected'));
  updateBtn();
}

function selectDays(n) {
  selectedDays = n;
  document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('selected'));
  document.querySelector(`[data-day="${n}"]`)?.classList.add('selected');
  updateBtn();
}

function selectType(name) {
  selectedType = name;
  document.querySelectorAll('.type-card').forEach(c => c.classList.remove('selected'));
  document.querySelector(`[data-type="${name}"]`)?.classList.add('selected');
  updateBtn();
}

function toggleSpot(i) {
  const card = document.querySelector(`#spotList [data-idx="${i}"]`);
  if (selectedSpots.includes(i)) {
    selectedSpots = selectedSpots.filter(x => x !== i);
    card.classList.remove('selected');
  } else {
    selectedSpots.push(i);
    card.classList.add('selected');
  }
  updateBtn();
}

function toggleFood(i) {
  const card = document.querySelector(`#foodList [data-idx="${i}"]`);
  if (selectedFoods.includes(i)) {
    selectedFoods = selectedFoods.filter(x => x !== i);
    card.classList.remove('selected');
  } else {
    selectedFoods.push(i);
    card.classList.add('selected');
  }
  updateBtn();
}

function toggleSpotCustom(i) {
  const cards = document.querySelectorAll('#spotList .item-card');
  if (selectedSpots.includes(i)) {
    selectedSpots = selectedSpots.filter(x => x !== i);
    cards[i]?.classList.remove('selected');
  } else {
    selectedSpots.push(i);
    cards[i]?.classList.add('selected');
  }
  updateBtn();
}

function toggleFoodCustom(i) {
  const cards = document.querySelectorAll('#foodList .item-card');
  if (selectedFoods.includes(i)) {
    selectedFoods = selectedFoods.filter(x => x !== i);
    cards[i]?.classList.remove('selected');
  } else {
    selectedFoods.push(i);
    cards[i]?.classList.add('selected');
  }
  updateBtn();
}

// ==================== 导航 ====================
function updateBtn() {
  const btn = document.getElementById('btnNext');
  const back = document.getElementById('btnBack');
  back.style.display = currentStep > 1 ? 'block' : 'none';

  switch(currentStep) {
    case 1: btn.disabled = !selectedCity; btn.textContent = '下一步'; btn.className = 'btn btn-next'; break;
    case 2: btn.disabled = !selectedDays; btn.textContent = '下一步'; btn.className = 'btn btn-next'; break;
    case 3: btn.disabled = !selectedType; btn.textContent = '下一步'; btn.className = 'btn btn-next'; break;
    case 4: btn.disabled = selectedSpots.length === 0 || selectedFoods.length === 0; btn.textContent = '下一步'; btn.className = 'btn btn-next'; break;
    case 5: btn.disabled = false; btn.textContent = '✨ 生成攻略'; btn.className = 'btn btn-generate'; break;
  }
}

function updateSteps() {
  document.querySelectorAll('.step-dot').forEach(d => {
    const s = parseInt(d.dataset.step);
    d.classList.remove('active', 'done');
    if (s < currentStep) d.classList.add('done');
    if (s === currentStep) d.classList.add('active');
  });
  document.querySelectorAll('.step-line').forEach(l => {
    const s = parseInt(l.dataset.line);
    l.classList.toggle('done', s < currentStep);
  });
}

function showPage(n) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page' + n).classList.add('active');
}

function nextStep() {
  if (currentStep === 4) {
    renderSummary();
  }
  if (currentStep === 5) {
    generateGuide();
    return;
  }
  if (currentStep < 5) {
    currentStep++;
    if (currentStep === 4) renderSpotFoodList();
    showPage(currentStep);
    updateSteps();
    updateBtn();
    window.scrollTo(0, 0);
  }
}

function prevStep() {
  if (currentStep > 1) {
    currentStep--;
    showPage(currentStep);
    updateSteps();
    updateBtn();
    window.scrollTo(0, 0);
  }
}

// ==================== 生成攻略 ====================
function generateGuide() {
  const gen = document.getElementById('generating');
  const sub = document.getElementById('genSub');
  gen.classList.add('show');

  const steps = ['搜索景点信息中', '规划每日行程中', '整理美食推荐中', '生成攻略页面中'];
  let si = 0;
  const timer = setInterval(() => {
    si++;
    if (si < steps.length) sub.textContent = steps[si];
  }, 600);

  setTimeout(() => {
    clearInterval(timer);
    gen.classList.remove('show');
    buildResult();
  }, 2500);
}

function buildResult() {
  const data = cityData[selectedCity];
  const spots = data ? selectedSpots.map(i => data.spots[i]) : selectedSpots.map(i =>
    ({ name: ['城市地标景点', '自然风光', '文化古迹'][i], emoji: ['🏛️','🌳','🏮'][i], desc: `${selectedCity}著名景点`, duration: '2-3小时', ticket: '视情况' })
  );
  const foods = data ? selectedFoods.map(i => data.foods[i]) : selectedFoods.map(i =>
    ({ name: ['当地特色主食', '特色小吃'][i], emoji: ['🍜','🍡'][i], desc: `${selectedCity}特色美食` })
  );

  // 计算日期
  const today = new Date();
  const startMonth = today.getMonth() + 1;
  const startDay = today.getDate();

  // 隐藏表单元素
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('resultPage').classList.add('active');
  document.getElementById('bottomBar').style.display = 'none';
  document.querySelector('.steps-bar').style.display = 'none';

  let bodyHTML = '';

  // ====== 标题区 ======
  bodyHTML += `
    <div class="guide-hero">
      <h2>${selectedCity}${selectedDays}日游攻略</h2>
      <div class="hero-sub">${startMonth}月${startDay}日 - ${startMonth}月${startDay + selectedDays - 1}日 · ${selectedType}</div>
    </div>`;

  // ====== 统计卡片 ======
  bodyHTML += `
    <div class="stats-row">
      <div class="stats-item"><span class="stats-num">${selectedDays}</span><span class="stats-label">天</span></div>
      <div class="stats-item"><span class="stats-num">${spots.length}+</span><span class="stats-label">景点</span></div>
      <div class="stats-item"><span class="stats-num">${foods.length}</span><span class="stats-label">美食</span></div>
      <div class="stats-item"><span class="stats-num">${estimateBudget(spots, selectedDays)}</span><span class="stats-label">预估花费</span></div>
    </div>`;

  // ====== 操作按钮 ======
  bodyHTML += `
    <div class="result-actions" style="padding:12px 16px;background:#fff;border-bottom:1px solid var(--border);display:flex;gap:10px;">
      <button class="btn btn-outline" onclick="goBackToForm()" style="flex:1;padding:10px;font-size:13px">🔄 重新生成</button>
      <button class="btn btn-next" onclick="copyGuide()" style="flex:1;padding:10px;font-size:13px">📋 复制攻略</button>
    </div>`;

  // ====== 行程概览 ======
  bodyHTML += `
    <div class="guide-overview" style="margin:16px;">
      <h3>📋 行程概览</h3>
      <div class="overview-grid">
        <div class="overview-item"><span class="ov-emoji">🏙️</span><div class="ov-label">目的地</div><div class="ov-value">${selectedCity}</div></div>
        <div class="overview-item"><span class="ov-emoji">📅</span><div class="ov-label">天数</div><div class="ov-value">${selectedDays}天</div></div>
        <div class="overview-item"><span class="ov-emoji">👥</span><div class="ov-label">类型</div><div class="ov-value">${selectedType}</div></div>
        <div class="overview-item"><span class="ov-emoji">🏛️</span><div class="ov-label">景点</div><div class="ov-value">${spots.length}个</div></div>
        <div class="overview-item"><span class="ov-emoji">🍜</span><div class="ov-label">美食</div><div class="ov-value">${foods.length}种</div></div>
        <div class="overview-item"><span class="ov-emoji">💰</span><div class="ov-label">预估</div><div class="ov-value">${estimateBudget(spots, selectedDays)}</div></div>
      </div>
    </div>`;

  // ====== 分日行程卡片 ======
  const dayThemes = generateDayThemes(spots, selectedDays, selectedType);
  bodyHTML += `<div class="day-cards-grid">`;

  for (let d = 0; d < selectedDays; d++) {
    const daySpots = dayThemes[d].spots;
    const dayFood1 = foods[d % foods.length];
    const dayFood2 = foods[(d + 1) % foods.length];

    // 标签类型
    let badgeClass = 'guide', badgeText = '导游全天';
    if (d === 0) { badgeClass = 'arrival'; badgeText = '抵达日'; }
    else if (d === selectedDays - 1) { badgeClass = 'final'; badgeText = '最后一站'; }

    const dayDate = startDay + d;
    const footerTags = ['景点游览'];
    if (d % 2 === 0) footerTags.push('美食探索');
    if (d === selectedDays - 1) footerTags.push('返程准备');

    bodyHTML += `
      <div class="day-card">
        <div class="day-card-header">
          <span class="day-badge-tag ${badgeClass}">${badgeText}</span>
          <div class="day-num-date">
            <span class="day-number">Day ${d + 1}</span>
            <span class="day-date">${dayDate}日</span>
          </div>
        </div>
        <div class="day-theme">${dayThemes[d].theme}</div>
        <div class="timeline">
          <div class="timeline-item">
            <span class="timeline-dot blue"></span>
            <span class="timeline-time">08:00</span>
            <div class="timeline-content">
              <div class="tl-title">🌅 酒店早餐</div>
              <div class="tl-desc">元气满满的一天</div>
            </div>
          </div>`;

    // 上午景点
    daySpots.forEach((sp, idx) => {
      const times = ['09:00', '10:30'];
      const time = times[idx] || '11:00';
      bodyHTML += `
          <div class="timeline-item">
            <span class="timeline-dot red"></span>
            <span class="timeline-time">${time}</span>
            <div class="timeline-content">
              <div class="tl-title">${sp.emoji} ${sp.name}</div>
              <div class="tl-desc">${sp.desc}</div>
              <div class="tl-info">
                <span class="tl-tag">⏱️ ${sp.duration || '2-3小时'}</span>
                <span class="tl-tag tip">🎫 ${sp.ticket || '免费'}</span>
              </div>
            </div>
          </div>`;
    });

    // 午餐
    bodyHTML += `
          <div class="timeline-item">
            <span class="timeline-dot orange"></span>
            <span class="timeline-time">12:00</span>
            <div class="timeline-content">
              <div class="tl-title">🍜 午餐 · ${dayFood1.name}</div>
              <div class="tl-desc">${dayFood1.desc || `品尝${selectedCity}特色美食`}</div>
            </div>
          </div>`;

    // 下午补充
    if (daySpots.length < 2) {
      bodyHTML += `
          <div class="timeline-item">
            <span class="timeline-dot green"></span>
            <span class="timeline-time">14:00</span>
            <div class="timeline-content">
              <div class="tl-title">🏛️ ${selectedCity}特色体验</div>
              <div class="tl-desc">深入了解当地文化</div>
            </div>
          </div>`;
    } else {
      const extraSpots = daySpots.slice(2);
      extraSpots.forEach((sp, idx) => {
        const time = idx === 0 ? '14:00' : '16:00';
        bodyHTML += `
          <div class="timeline-item">
            <span class="timeline-dot red"></span>
            <span class="timeline-time">${time}</span>
            <div class="timeline-content">
              <div class="tl-title">${sp.emoji} ${sp.name}</div>
              <div class="tl-desc">${sp.desc}</div>
            </div>
          </div>`;
      });
    }

    // 晚餐
    bodyHTML += `
          <div class="timeline-item">
            <span class="timeline-dot orange"></span>
            <span class="timeline-time">18:00</span>
            <div class="timeline-content">
              <div class="tl-title">🌆 晚餐 · ${dayFood2.name}</div>
              <div class="tl-desc">${dayFood2.desc || '逛夜市或自由觅食'}</div>
            </div>
          </div>
          <div class="timeline-item">
            <span class="timeline-dot blue"></span>
            <span class="timeline-time">21:00</span>
            <div class="timeline-content">
              <div class="tl-title">🏨 返回酒店</div>
              <div class="tl-desc">${d === selectedDays - 1 ? '整理行李，准备返程' : '养精蓄锐，明天继续'}</div>
            </div>
          </div>
        </div>
        <div class="day-card-footer">
          ${footerTags.map(t => `<span class="footer-tag">${t}</span>`).join('')}
        </div>
      </div>`;
  }
  bodyHTML += `</div>`;

  // ====== 美食清单 ======
  bodyHTML += `
    <div class="food-section">
      <h3>🍜 美食清单</h3>
      <div class="food-grid">
        ${foods.map(f => `
          <div class="food-card">
            ${f.img ? `<img class="food-img" src="${f.img}" alt="${f.name}" onerror="this.outerHTML='<span class=food-emoji>${f.emoji}</span>'">` : `<span class="food-emoji">${f.emoji}</span>`}
            <div class="food-name">${f.name}</div>
            <div class="food-desc">${f.desc}</div>
          </div>`).join('')}
      </div>
    </div>`;

  // ====== 出行贴士 ======
  bodyHTML += `
    <div class="tips-section">
      <h3>💡 出行小贴士</h3>
      <div class="tip-item">📱 提前下载离线地图，标注景点位置</div>
      <div class="tip-item">🎫 热门景点建议提前网上购票，避免排队</div>
      <div class="tip-item">💰 预估总花费约 ${estimateBudget(spots, selectedDays)}（不含交通住宿）</div>
      <div class="tip-item">👕 ${getWeatherTip(selectedCity)}</div>
      <div class="tip-item">🎒 ${getTypeTip(selectedType)}</div>
      <div class="tip-item">📸 别忘了带上充电宝和好心情！</div>
    </div>
    <div class="footer-note">✈️ 由旅行攻略生成器创建 · 祝旅途愉快！</div>`;

  document.getElementById('resultBody').innerHTML = bodyHTML;
  window.scrollTo(0, 0);
}

function generateDayThemes(spots, days, type) {
  const result = [];
  const spotsPerDay = Math.ceil(spots.length / days);
  const themeTemplates = {
    '亲子游': ['亲子探索日', '欢乐学习日', '自然发现日', '文化体验日', '趣味冒险日', '创意手工日', '温馨回忆日'],
    '情侣游': ['浪漫初见', '甜蜜时光', '漫步云端', '星空物语', '花海漫步', '日落黄昏', '温馨告别'],
    '朋友游': ['欢乐出发', '探险之旅', '美食寻味', '文化漫游', '自由活动', '购物狂欢', '依依惜别'],
    '独自游': ['独自出发', '随心漫步', '深度探索', '美食之旅', '文化沉浸', '自由时光', '温暖归途'],
  };
  const themes = themeTemplates[type] || themeTemplates['独自游'];
  let spotIdx = 0;
  for (let d = 0; d < days; d++) {
    const daySpots = [];
    const count = Math.min(spotsPerDay, spots.length - spotIdx);
    for (let i = 0; i < count && spotIdx < spots.length; i++) {
      daySpots.push(spots[spotIdx++]);
    }
    if (daySpots.length === 0 && spots.length > 0) {
      daySpots.push(spots[spots.length - 1]);
    }
    result.push({
      theme: themes[d] || `精彩第${d + 1}天`,
      spots: daySpots
    });
  }
  return result;
}

function estimateBudget(spots, days) {
  let total = 0;
  spots.forEach(s => {
    const m = (s.ticket || '').match(/(\d+)/);
    if (m) total += parseInt(m[1]);
  });
  total += days * 150; // 餐饮
  if (total < 500) return `${total}元`;
  if (total < 2000) return `${total}元`;
  return `约${Math.round(total / 100) * 100}元`;
}

function getWeatherTip(city) {
  const tips = {
    '北京': '春秋温差大，带件薄外套；夏天防晒',
    '上海': '梅雨季带伞；夏天闷热注意防暑',
    '成都': '多阴雨天气，随身带伞；湿润气候',
    '西安': '干燥气候注意保湿补水；防晒',
    '杭州': '春夏多雨带伞；西湖边风大注意保暖',
    '三亚': '全年高温，防晒霜必备；防蚊虫',
  };
  return tips[city] || '出发前查看天气预报，准备合适衣物';
}

function getTypeTip(type) {
  const tips = {
    '亲子游': '带好儿童零食、湿巾和小玩具；安排午休时间',
    '情侣游': '提前预约网红餐厅；准备小惊喜',
    '朋友游': '提前AA制预算；多拍照留念',
    '独自游': '注意安全，告知家人行程；享受独处时光',

}

function copyGuide() {
  const body = document.getElementById('resultBody');
  const text = body.innerText;
  navigator.clipboard.writeText(text).then(() => {
    alert('攻略已复制到剪贴板！');
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('攻略已复制到剪贴板！');
  });
}
