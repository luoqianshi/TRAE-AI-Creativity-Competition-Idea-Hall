<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手写表格离线图像预处理系统</title>
<style>
:root {
  --bg-deep: #f1f5f9;
  --bg-main: #ffffff;
  --bg-panel: #f8fafc;
  --bg-card: #ffffff;
  --bg-hover: #f1f5f9;
  --bg-input: #f8fafc;
  --border-soft: #e2e8f0;
  --border-light: #cbd5e1;
  --accent: #3b82f6;
  --accent-light: #60a5fa;
  --accent-dim: rgba(59,130,246,0.1);
  --accent-glow: rgba(59,130,246,0.2);
  --btn-primary: #3b82f6;
  --btn-primary-hover: #2563eb;
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --selected-bg: rgba(59,130,246,0.08);
  --danger: #ef4444;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Microsoft YaHei", "SimHei", sans-serif; background: var(--bg-deep); color: var(--text-primary); overflow: hidden; }
#app { display: flex; flex-direction: column; height: 100vh; }
.toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 14px; background: var(--bg-main); border-bottom: 1px solid var(--border-soft); }
.toolbar button, .toolbar label { padding: 6px 14px; background: var(--btn-primary); color: #fff; border: 1px solid var(--border-soft); border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; white-space: nowrap; }
.toolbar button:hover, .toolbar label:hover { background: var(--btn-primary-hover); border-color: var(--border-light); }
.toolbar button.active { background: var(--accent); border-color: var(--accent-light); color: #fff; }
.toolbar input[type="file"] { display: none; }
.toolbar .sep { width: 1px; height: 22px; background: var(--border-soft); margin: 0 2px; flex-shrink: 0; }
.toolbar span { font-size: 12px; color: var(--text-muted); margin-left: auto; }
.main { display: flex; flex: 1; overflow: hidden; }
.canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; background: var(--bg-deep); position: relative; overflow: auto; padding: 16px; }
#imageCanvas { background: #fff; box-shadow: 0 2px 16px rgba(0,0,0,0.4); cursor: crosshair; }
.side-panel { width: 320px; min-width: 280px; background: var(--bg-panel); border-left: 1px solid var(--border-soft); display: flex; flex-direction: column; overflow: hidden; }
.panel-tabs { display: flex; gap: 2px; padding: 8px 8px 0; }
.panel-tabs button { flex: 1; padding: 8px 0; background: transparent; color: var(--text-secondary); border: 1px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 13px; transition: all 0.2s; }
.panel-tabs button:hover { color: var(--text-primary); background: var(--bg-card); }
.panel-tabs button.active { color: var(--accent-light); background: var(--bg-card); border-color: var(--border-soft); border-bottom-color: var(--bg-card); position: relative; z-index: 1; }
.panel-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.panel-content { flex: 1; overflow-y: auto; padding: 12px; background: var(--bg-card); border-top: 1px solid var(--border-soft); border-radius: 0 0 8px 8px; }
.panel-section { margin-bottom: 14px; }
.panel-section h3 { font-size: 13px; color: var(--accent-light); margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border-soft); font-weight: 600; }
.cell-list { max-height: 240px; overflow-y: auto; }
.cell-item { display: flex; align-items: center; gap: 5px; padding: 5px 6px; background: var(--bg-input); margin-bottom: 3px; border-radius: 6px; font-size: 12px; border: 1px solid transparent; transition: all 0.15s; }
.cell-item:hover { border-color: var(--border-soft); }
.cell-item.selected { border-color: var(--accent); background: var(--selected-bg); }
.cell-item input[type="text"] { flex: 1; padding: 3px 6px; background: var(--bg-deep); color: var(--text-primary); border: 1px solid var(--border-soft); border-radius: 4px; font-size: 11px; }
.cell-item button { padding: 2px 8px; background: var(--btn-primary); color: #fff; border: 1px solid var(--border-soft); border-radius: 4px; cursor: pointer; font-size: 11px; }
.cell-item button:hover { background: var(--btn-primary-hover); }
.cell-item button.del-btn { background: transparent; color: var(--text-muted); border-color: transparent; }
.cell-item button.del-btn:hover { color: var(--danger); }
.cell-item .cell-id { min-width: 22px; color: var(--accent); font-weight: bold; font-size: 11px; }
.result-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; border-radius: 6px; overflow: hidden; }
.result-table th, .result-table td { padding: 7px 8px; text-align: center; }
.result-table th { background: var(--btn-primary); color: #fff; font-weight: 600; }
.result-table td { background: var(--bg-input); color: var(--text-primary); border-bottom: 1px solid var(--border-soft); }
.result-table tr:last-child td { border-bottom: none; }
.result-table td input { width: 100%; background: transparent; color: var(--text-primary); border: none; text-align: center; font-size: 13px; }
.sample-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; margin-top: 6px; }
.sample-item { aspect-ratio: 1; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #000; border-radius: 4px; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; }
.sample-item:hover { border-color: var(--accent); }
.sample-item.selected { border-color: var(--accent); background: #dbeafe; }
.status-bar { padding: 5px 14px; background: var(--bg-main); font-size: 11px; color: var(--text-muted); border-top: 1px solid var(--border-soft); }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; }
.modal-overlay.show { display: flex; }
.modal { background: var(--bg-panel); padding: 20px; border-radius: 10px; border: 1px solid var(--border-soft); min-width: 380px; max-width: 80vw; max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
.modal h3 { color: var(--accent-light); margin-bottom: 14px; font-size: 15px; }
.modal .form-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.modal .form-row label { min-width: 70px; font-size: 13px; color: var(--text-secondary); }
.modal .form-row input, .modal .form-row select { flex: 1; padding: 7px 10px; background: var(--bg-input); color: var(--text-primary); border: 1px solid var(--border-soft); border-radius: 6px; font-size: 13px; }
.modal .btn-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.modal .btn-row button { padding: 7px 20px; background: var(--btn-primary); color: #fff; border: 1px solid var(--border-soft); border-radius: 6px; cursor: pointer; font-size: 13px; }
.modal .btn-row button:hover { background: var(--btn-primary-hover); }
.modal .btn-row button.primary { background: var(--accent); border-color: var(--accent-light); }
.modal .btn-row button.primary:hover { background: var(--accent-light); }
.char-pool { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; max-height: 110px; overflow-y: auto; padding: 6px; background: var(--bg-input); border-radius: 6px; }
.char-pool span { display: inline-block; padding: 3px 7px; background: var(--bg-card); border-radius: 4px; cursor: pointer; font-size: 13px; border: 1px solid transparent; transition: all 0.12s; }
.char-pool span:hover { border-color: var(--border-light); }
.char-pool span.selected { background: var(--accent); color: #fff; border-color: var(--accent-light); }
.char-actions { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.char-actions button { padding: 4px 10px; background: var(--btn-primary); color: var(--text-secondary); border: 1px solid var(--border-soft); border-radius: 5px; cursor: pointer; font-size: 11px; }
.char-actions button:hover { background: var(--btn-primary-hover); color: #fff; }
.sample-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.sample-preview canvas { background: #fff; border-radius: 4px; }
.form-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.form-row label { min-width: 70px; font-size: 12px; color: var(--text-secondary); }
.form-row input[type="range"] { flex: 1; accent-color: var(--accent); }
.form-row select { padding: 5px 8px; background: var(--bg-input); color: var(--text-primary); border: 1px solid var(--border-soft); border-radius: 5px; font-size: 12px; }
.form-row span.val { min-width: 36px; font-size: 12px; color: var(--text-muted); text-align: right; }
.hidden { display: none !important; }
#loading { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 2000; flex-direction: column; }
#loading.show { display: flex; }
#loading .spinner { width: 36px; height: 36px; border: 3px solid var(--border-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading p { margin-top: 12px; color: var(--accent-light); font-size: 13px; }
.zoom-controls { position: absolute; bottom: 10px; right: 10px; display: flex; gap: 3px; }
.zoom-controls button { width: 28px; height: 28px; background: var(--bg-panel); color: var(--text-secondary); border: 1px solid var(--border-soft); border-radius: 6px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.zoom-controls button:hover { background: var(--btn-primary-hover); color: #fff; }
.small-btn { padding: 5px 12px; background: var(--btn-primary); color: var(--text-secondary); border: 1px solid var(--border-soft); border-radius: 6px; cursor: pointer; font-size: 12px; }
.small-btn:hover { background: var(--btn-primary-hover); color: #fff; }
.tmpl-item { padding: 8px 10px; background: var(--bg-input); margin-bottom: 4px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; transition: all 0.15s; }
.tmpl-item:hover { border-color: var(--border-light); background: var(--bg-hover); }
.tmpl-item strong { color: var(--accent-light); font-size: 13px; }
.tmpl-item .meta { color: var(--text-muted); font-size: 11px; }
.empty-hint { font-size: 12px; color: var(--text-muted); }
.cell-item .size-info { color: var(--text-muted); font-size: 10px; }
</style>
</head>
<body>
<div id="app">
  <div class="toolbar">
    <label for="fileInput">上传图片</label>
    <input type="file" id="fileInput" accept="image/*">
    <button id="btnCorrect">图像规整</button>
    <div class="sep"></div>
    <button id="btnSelect" class="active">分区模式</button>
    <button id="btnClearRect">清空分区</button>
    <button id="btnSaveTemplate">保存模板</button>
    <button id="btnLoadTemplate">加载模板</button>
    <div class="sep"></div>
    <button id="btnSamples">笔迹样本</button>
    <button id="btnRecognize">笔迹处理</button>
    <button id="btnExport">导出结果</button>
    <span id="statusText">就绪</span>
  </div>
  <div class="main">
    <div class="canvas-area">
      <canvas id="imageCanvas"></canvas>
      <div class="zoom-controls">
        <button id="btnZoomOut">-</button>
        <button id="btnZoomIn">+</button>
        <button id="btnZoomFit">__</button>
      </div>
    </div>
    <div class="side-panel">
      <div class="panel-body">
        <div class="panel-tabs">
          <button class="active" data-tab="cells">分区列表</button>
          <button data-tab="result">处理结果</button>
          <button data-tab="settings">参数配置</button>
        </div>
        <div class="panel-content" id="panelCells">
          <div class="panel-section">
            <h3>已划分区域</h3>
            <div class="cell-list" id="cellList">
              <p class="empty-hint">暂无分区，请在画布上拖拽框选</p>
            </div>
          </div>
          <div class="panel-section">
            <h3>当前区域笔迹范围</h3>
            <div id="charRangePanel">
              <p class="empty-hint">先选择一个区域</p>
            </div>
          </div>
        </div>
        <div class="panel-content hidden" id="panelResult">
          <div class="panel-section">
            <h3>处理结果</h3>
            <div id="resultContainer">
              <p class="empty-hint">尚未进行处理</p>
            </div>
          </div>
        </div>
        <div class="panel-content hidden" id="panelSettings">
          <div class="panel-section">
            <h3>处理参数</h3>
            <div class="form-row">
              <label>匹配阈值</label>
              <input type="range" id="matchThreshold" min="50" max="99" value="75">
              <span class="val" id="thresholdVal">75%</span>
            </div>
            <div class="form-row">
              <label>灰度阈值</label>
              <input type="range" id="binThreshold" min="100" max="200" value="128">
              <span class="val" id="binVal">128</span>
            </div>
            <div class="form-row">
              <label>样本尺寸</label>
              <select id="sampleSize">
                <option value="24">24x24</option>
                <option value="32" selected>32x32</option>
                <option value="48">48x48</option>
              </select>
            </div>
          </div>
          <div class="panel-section">
            <h3>内置笔迹样本</h3>
            <p class="empty-hint" style="margin-bottom:6px;">点击字符可预览样本图像</p>
            <div class="sample-grid" id="builtinSamples"></div>
            <div class="sample-preview" id="samplePreview"></div>
          </div>
          <div class="panel-section">
            <h3>自定义样本</h3>
            <button class="small-btn" id="btnAddCustomSample">添加当前选中区域为样本</button>
            <div id="customSamples" style="margin-top:8px;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="status-bar" id="statusBar">就绪 | 图片: 无 | 区域: 0</div>
</div>

<div id="loading">
  <div class="spinner"></div>
  <p>处理中...</p>
</div>

<div class="modal-overlay" id="templateModal">
  <div class="modal">
    <h3>保存模板</h3>
    <div class="form-row">
      <label>模板名称</label>
      <input type="text" id="templateName" placeholder="输入模板名称">
    </div>
    <div class="btn-row">
      <button onclick="closeModal('templateModal')">取消</button>
      <button class="primary" id="btnConfirmSave">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="loadModal">
  <div class="modal">
    <h3>加载模板</h3>
    <div id="templateList" style="max-height:300px;overflow-y:auto;"></div>
    <div class="btn-row">
      <button onclick="closeModal('loadModal')">关闭</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('imageCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
let originalImage = null;
let currentImage = null;
let rectangles = [];
let selectedRectIndex = -1;
let isDrawing = false;
let startX, startY;
let zoom = 1;
let offsetX = 0, offsetY = 0;
let mode = 'select';
let builtinSamples = [];
let customSamples = [];
let sampleSize = 32;

const NUMBERS = '0123456789';
const UPPERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const LOWERS = 'abcdefghijklmnopqrstuvwxyz';
const CHINESE_COMMON = '一二三四五六七八九十百千万个件米厘米毫米克千克升毫升年月日时分秒甲乙丙丁戊己庚辛壬癸子丑寅卯辰巳午未申酉戌亥红黄蓝绿黑白紫橙灰粉金银青棕深浅明暗正负零整半';
const SYMBOLS = '.,;:+-*/=()[]{}%￥$@#&!?';
const ALL_CHARS = NUMBERS + UPPERS + LOWERS + CHINESE_COMMON + SYMBOLS;

function showLoading(text) {
  const el = document.getElementById('loading');
  el.querySelector('p').textContent = text || '处理中...';
  el.classList.add('show');
}

function hideLoading() {
  document.getElementById('loading').classList.remove('show');
}

function updateStatus(text) {
  document.getElementById('statusText').textContent = text;
  const imgInfo = currentImage ? `${currentImage.width}x${currentImage.height}` : '无';
  document.getElementById('statusBar').textContent = `${text} | 图片: ${imgInfo} | 区域: ${rectangles.length}`;
}

function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    const img = new Image();
    img.onload = function() {
      originalImage = img;
      currentImage = img;
      resetView();
      drawImage();
      rectangles = [];
      selectedRectIndex = -1;
      updateCellList();
      updateStatus('图片已加载');
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
});

function resetView() {
  zoom = 1;
  offsetX = 0;
  offsetY = 0;
}

function drawImage() {
  if (!currentImage) return;
  const container = canvas.parentElement;
  const maxW = container.clientWidth - 32;
  const maxH = container.clientHeight - 32;
  let cw = currentImage.width * zoom;
  let ch = currentImage.height * zoom;
  if (cw > maxW) { zoom = maxW / currentImage.width; cw = maxW; ch = currentImage.height * zoom; }
  if (ch > maxH) { zoom = maxH / currentImage.height; ch = maxH; cw = currentImage.width * zoom; }
  canvas.width = cw;
  canvas.height = ch;
  ctx.clearRect(0, 0, cw, ch);
  ctx.drawImage(currentImage, 0, 0, cw, ch);
  drawRectangles();
}

function drawRectangles() {
  rectangles.forEach((rect, i) => {
    const x = rect.x * zoom;
    const y = rect.y * zoom;
    const w = rect.w * zoom;
    const h = rect.h * zoom;
    ctx.strokeStyle = i === selectedRectIndex ? '#2563eb' : '#3b82f6';
    ctx.lineWidth = i === selectedRectIndex ? 2 : 1;
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = i === selectedRectIndex ? 'rgba(37,99,235,0.1)' : 'rgba(59,130,246,0.05)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = i === selectedRectIndex ? '#2563eb' : '#3b82f6';
    ctx.font = 'bold 11px sans-serif';
    ctx.fillText(String(i + 1), x + 3, y + 13);
  });
}

canvas.addEventListener('mousedown', function(e) {
  if (!currentImage || mode !== 'select') return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / zoom;
  const y = (e.clientY - rect.top) / zoom;
  const clickedIndex = rectangles.findIndex(r => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h);
  if (clickedIndex >= 0) {
    selectedRectIndex = clickedIndex;
    updateCellList();
    drawImage();
    return;
  }
  isDrawing = true;
  startX = x;
  startY = y;
});

canvas.addEventListener('mousemove', function(e) {
  if (!isDrawing) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / zoom;
  const y = (e.clientY - rect.top) / zoom;
  drawImage();
  const rx = Math.min(startX, x);
  const ry = Math.min(startY, y);
  const rw = Math.abs(x - startX);
  const rh = Math.abs(y - startY);
  ctx.strokeStyle = '#2563eb';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 4]);
  ctx.strokeRect(rx * zoom, ry * zoom, rw * zoom, rh * zoom);
  ctx.setLineDash([]);
});

canvas.addEventListener('mouseup', function(e) {
  if (!isDrawing) return;
  isDrawing = false;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / zoom;
  const y = (e.clientY - rect.top) / zoom;
  const rx = Math.min(startX, x);
  const ry = Math.min(startY, y);
  const rw = Math.abs(x - startX);
  const rh = Math.abs(y - startY);
  if (rw > 10 && rh > 10) {
    rectangles.push({ x: rx, y: ry, w: rw, h: rh, charRange: NUMBERS, result: '' });
    selectedRectIndex = rectangles.length - 1;
    updateCellList();
    drawImage();
    updateStatus('已添加区域');
  }
});

function updateCellList() {
  const list = document.getElementById('cellList');
  if (rectangles.length === 0) {
    list.innerHTML = '<p class="empty-hint">暂无分区，请在画布上拖拽框选</p>';
    updateCharRangePanel();
    return;
  }
  list.innerHTML = rectangles.map((rect, i) => `
    <div class="cell-item ${i === selectedRectIndex ? 'selected' : ''}">
      <span class="cell-id">${i + 1}</span>
      <span class="size-info">${Math.round(rect.w)}x${Math.round(rect.h)}</span>
      <input type="text" value="${rect.charRange}" onchange="updateRectCharRange(${i}, this.value)">
      <button class="del-btn" onclick="deleteRect(${i})">删除</button>
      <button onclick="selectRect(${i})" style="${i === selectedRectIndex ? 'background:var(--accent);color:#fff;border-color:var(--accent-light);' : ''}">选中</button>
    </div>
  `).join('');
  updateCharRangePanel();
}

function selectRect(index) {
  selectedRectIndex = index;
  updateCellList();
  drawImage();
}

function deleteRect(index) {
  rectangles.splice(index, 1);
  if (selectedRectIndex >= rectangles.length) selectedRectIndex = rectangles.length - 1;
  updateCellList();
  drawImage();
  updateStatus('已删除区域');
}

function updateRectCharRange(index, value) {
  rectangles[index].charRange = value;
  updateCharRangePanel();
}

function updateCharRangePanel() {
  const panel = document.getElementById('charRangePanel');
  if (selectedRectIndex < 0 || selectedRectIndex >= rectangles.length) {
    panel.innerHTML = '<p class="empty-hint">先选择一个区域</p>';
    return;
  }
  const rect = rectangles[selectedRectIndex];
  const chars = ALL_CHARS.split('');
  panel.innerHTML = `
    <p class="empty-hint" style="margin-bottom:6px;">点击切换（${rect.charRange.length}个字符）</p>
    <div class="char-pool" id="charPool"></div>
    <div class="char-actions">
      <button onclick="setCharRange('numbers')">数字</button>
      <button onclick="setCharRange('uppers')">大写字母</button>
      <button onclick="setCharRange('lowers')">小写字母</button>
      <button onclick="setCharRange('chinese')">常用汉字</button>
      <button onclick="setCharRange('all')">全部</button>
    </div>
  `;
  const pool = document.getElementById('charPool');
  const selected = new Set(rect.charRange.split(''));
  pool.innerHTML = chars.map(c => {
    const isSel = selected.has(c);
    return `<span class="${isSel ? 'selected' : ''}" onclick="toggleChar('${c}')">${c}</span>`;
  }).join('');
}

function toggleChar(char) {
  if (selectedRectIndex < 0) return;
  const rect = rectangles[selectedRectIndex];
  const set = new Set(rect.charRange.split(''));
  if (set.has(char)) set.delete(char); else set.add(char);
  rect.charRange = Array.from(set).join('');
  updateCellList();
  updateCharRangePanel();
}

function setCharRange(type) {
  if (selectedRectIndex < 0) return;
  const map = { numbers: NUMBERS, uppers: UPPERS, lowers: LOWERS, chinese: CHINESE_COMMON, all: ALL_CHARS };
  rectangles[selectedRectIndex].charRange = map[type] || '';
  updateCellList();
  updateCharRangePanel();
}

function generateBuiltinSamples() {
  builtinSamples = [];
  const size = sampleSize;
  const chars = ALL_CHARS.split('');
  chars.forEach(char => {
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const x = c.getContext('2d');
    x.fillStyle = '#ffffff';
    x.fillRect(0, 0, size, size);
    x.fillStyle = '#000000';
    x.font = `bold ${size * 0.7}px "Microsoft YaHei", "SimHei", sans-serif`;
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText(char, size / 2, size / 2);
    const data = x.getImageData(0, 0, size, size).data;
    builtinSamples.push({ char, data, size });
  });
}

function renderBuiltinSamples() {
  const grid = document.getElementById('builtinSamples');
  grid.innerHTML = builtinSamples.map((s, i) => {
    return `<div class="sample-item" onclick="previewSample(${i})"><canvas width="32" height="32" id="sampleCanvas_${i}"></canvas></div>`;
  }).join('');
  builtinSamples.forEach((s, i) => {
    const c = document.getElementById(`sampleCanvas_${i}`);
    if (c) {
      const x = c.getContext('2d');
      const imgData = new ImageData(new Uint8ClampedArray(s.data), s.size, s.size);
      x.putImageData(imgData, 0, 0);
    }
  });
}

function previewSample(index) {
  const s = builtinSamples[index];
  const preview = document.getElementById('samplePreview');
  const c = document.createElement('canvas');
  c.width = 64;
  c.height = 64;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  const temp = document.createElement('canvas');
  temp.width = s.size;
  temp.height = s.size;
  temp.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(s.data), s.size, s.size), 0, 0);
  x.drawImage(temp, 0, 0, 64, 64);
  preview.innerHTML = '';
  preview.appendChild(c);
  const info = document.createElement('div');
  info.innerHTML = `<p style="font-size:12px;color:var(--text-muted);">字符: <strong style="color:var(--accent-light);font-size:18px;">${s.char}</strong><br>尺寸: ${s.size}x${s.size}</p>`;
  preview.appendChild(info);
}

document.getElementById('btnSelect').addEventListener('click', function() {
  mode = 'select';
  document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
  this.classList.add('active');
});

document.getElementById('btnClearRect').addEventListener('click', function() {
  rectangles = [];
  selectedRectIndex = -1;
  updateCellList();
  drawImage();
  updateStatus('已清空分区');
});

document.getElementById('btnCorrect').addEventListener('click', function() {
  if (!currentImage) { alert('请先上传图片'); return; }
  showLoading('图像规整处理中...');
  setTimeout(() => {
    const corrected = autoCorrectTilt(currentImage);
    currentImage = corrected;
    drawImage();
    hideLoading();
    updateStatus('图像规整完成');
  }, 100);
});

function autoCorrectTilt(img) {
  const c = document.createElement('canvas');
  c.width = img.width;
  c.height = img.height;
  const x = c.getContext('2d');
  x.drawImage(img, 0, 0);
  const src = x.getImageData(0, 0, c.width, c.height);
  const gray = toGray(src.data, c.width, c.height);
  const binary = threshold(gray, c.width, c.height, 128);
  const angle = detectSkewAngle(binary, c.width, c.height);
  if (Math.abs(angle) < 0.5) return img;
  return rotateImage(img, -angle);
}

function toGray(data, w, h) {
  const gray = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) {
    gray[i] = 0.299 * data[i * 4] + 0.587 * data[i * 4 + 1] + 0.114 * data[i * 4 + 2];
  }
  return gray;
}

function threshold(gray, w, h, thr) {
  const bin = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) bin[i] = gray[i] < thr ? 255 : 0;
  return bin;
}

function detectSkewAngle(binary, w, h) {
  let bestAngle = 0;
  let bestScore = 0;
  for (let a = -15; a <= 15; a += 0.5) {
    const rad = a * Math.PI / 180;
    const cos = Math.cos(rad);
    const sin = Math.sin(rad);
    const proj = new Uint32Array(h * 2);
    for (let y = 0; y < h; y += 2) {
      for (let x = 0; x < w; x += 2) {
        if (binary[y * w + x] > 0) {
          const ny = Math.round(y * cos - x * sin + h / 2);
          if (ny >= 0 && ny < proj.length) proj[ny]++;
        }
      }
    }
    let score = 0;
    for (let i = 0; i < proj.length; i++) score += proj[i] * proj[i];
    if (score > bestScore) { bestScore = score; bestAngle = a; }
  }
  return bestAngle;
}

function rotateImage(img, angle) {
  const rad = angle * Math.PI / 180;
  const sin = Math.abs(Math.sin(rad));
  const cos = Math.abs(Math.cos(rad));
  const nw = Math.round(img.width * cos + img.height * sin);
  const nh = Math.round(img.width * sin + img.height * cos);
  const c = document.createElement('canvas');
  c.width = nw;
  c.height = nh;
  const x = c.getContext('2d');
  x.translate(nw / 2, nh / 2);
  x.rotate(rad);
  x.drawImage(img, -img.width / 2, -img.height / 2);
  const result = new Image();
  result.src = c.toDataURL();
  return result;
}

document.getElementById('btnSaveTemplate').addEventListener('click', function() {
  if (rectangles.length === 0) { alert('请先划分区域'); return; }
  openModal('templateModal');
  document.getElementById('templateName').value = '模板' + new Date().toLocaleString().replace(/[\/:\s]/g, '-');
});

document.getElementById('btnConfirmSave').addEventListener('click', function() {
  const name = document.getElementById('templateName').value.trim();
  if (!name) { alert('请输入模板名称'); return; }
  const templates = JSON.parse(localStorage.getItem('ocr_templates') || '[]');
  const template = {
    name,
    time: new Date().toISOString(),
    rectangles: rectangles.map(r => ({ x: r.x, y: r.y, w: r.w, h: r.h, charRange: r.charRange })),
    imageWidth: currentImage ? currentImage.width : 0,
    imageHeight: currentImage ? currentImage.height : 0
  };
  templates.push(template);
  localStorage.setItem('ocr_templates', JSON.stringify(templates));
  closeModal('templateModal');
  updateStatus('模板已保存');
});

document.getElementById('btnLoadTemplate').addEventListener('click', function() {
  const templates = JSON.parse(localStorage.getItem('ocr_templates') || '[]');
  const list = document.getElementById('templateList');
  if (templates.length === 0) {
    list.innerHTML = '<p class="empty-hint">暂无保存的模板</p>';
  } else {
    list.innerHTML = templates.map((t, i) => `
      <div class="tmpl-item" onclick="loadTemplate(${i})">
        <strong>${t.name}</strong>
        <span class="meta" style="float:right;">${new Date(t.time).toLocaleString()}</span>
        <p class="meta" style="margin-top:3px;">${t.rectangles.length}个区域 | ${t.imageWidth}x${t.imageHeight}</p>
      </div>
    `).join('');
  }
  openModal('loadModal');
});

function loadTemplate(index) {
  const templates = JSON.parse(localStorage.getItem('ocr_templates') || '[]');
  const t = templates[index];
  if (!t) return;
  rectangles = t.rectangles.map(r => ({ ...r, result: '' }));
  selectedRectIndex = -1;
  updateCellList();
  drawImage();
  closeModal('loadModal');
  updateStatus('模板已加载');
}

document.getElementById('btnSamples').addEventListener('click', function() {
  document.querySelector('.panel-tabs button[data-tab="settings"]').click();
});

document.getElementById('btnRecognize').addEventListener('click', function() {
  if (!currentImage) { alert('请先上传图片'); return; }
  if (rectangles.length === 0) { alert('请先划分区域'); return; }
  if (builtinSamples.length === 0) generateBuiltinSamples();
  showLoading('笔迹处理中...');
  setTimeout(() => {
    recognizeAll();
    hideLoading();
    document.querySelector('.panel-tabs button[data-tab="result"]').click();
    updateStatus('处理完成');
  }, 100);
});

function recognizeAll() {
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = currentImage.width;
  tempCanvas.height = currentImage.height;
  const tx = tempCanvas.getContext('2d');
  tx.drawImage(currentImage, 0, 0);
  const fullData = tx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
  const gray = toGray(fullData.data, tempCanvas.width, tempCanvas.height);
  const bin = threshold(gray, tempCanvas.width, tempCanvas.height, parseInt(document.getElementById('binThreshold').value));
  const thresholdVal = parseInt(document.getElementById('matchThreshold').value) / 100;
  const size = sampleSize;
  rectangles.forEach((rect, idx) => {
    const cellCanvas = document.createElement('canvas');
    const cw = Math.round(rect.w);
    const ch = Math.round(rect.h);
    cellCanvas.width = cw;
    cellCanvas.height = ch;
    const cx = cellCanvas.getContext('2d');
    cx.drawImage(currentImage, rect.x, rect.y, cw, ch, 0, 0, cw, ch);
    const cellData = cx.getImageData(0, 0, cw, ch).data;
    const cellGray = toGray(cellData, cw, ch);
    const cellBin = threshold(cellGray, cw, ch, parseInt(document.getElementById('binThreshold').value));
    const resized = resizeBinary(cellBin, cw, ch, size, size);
    let bestChar = '';
    let bestScore = Infinity;
    const allowedChars = new Set(rect.charRange.split(''));
    const allSamples = [...builtinSamples, ...customSamples];
    allSamples.forEach(sample => {
      if (!allowedChars.has(sample.char)) return;
      const score = compareSamples(resized, sample.data, size);
      if (score < bestScore) { bestScore = score; bestChar = sample.char; }
    });
    const confidence = Math.max(0, 1 - bestScore / (size * size * 255));
    rect.result = confidence >= thresholdVal ? bestChar : '?';
    rect.confidence = confidence;
  });
  renderResults();
}

function resizeBinary(src, sw, sh, dw, dh) {
  const dst = new Uint8Array(dw * dh);
  const sx = sw / dw;
  const sy = sh / dh;
  for (let y = 0; y < dh; y++) {
    for (let x = 0; x < dw; x++) {
      const sx0 = Math.floor(x * sx);
      const sy0 = Math.floor(y * sy);
      dst[y * dw + x] = src[sy0 * sw + sx0];
    }
  }
  return dst;
}

function compareSamples(a, b, size) {
  let sum = 0;
  for (let i = 0; i < size * size; i++) {
    const va = a[i] > 0 ? 255 : 0;
    const vb = b[i * 4] < 128 ? 255 : 0;
    const diff = va - vb;
    sum += diff * diff;
  }
  return sum;
}

function renderResults() {
  const container = document.getElementById('resultContainer');
  if (rectangles.length === 0) {
    container.innerHTML = '<p class="empty-hint">尚未进行处理</p>';
    return;
  }
  let html = '<table class="result-table"><thead><tr><th>#</th><th>处理结果</th><th>置信度</th><th>笔迹范围</th></tr></thead><tbody>';
  rectangles.forEach((rect, i) => {
    const conf = (rect.confidence * 100).toFixed(1);
    html += `<tr><td>${i + 1}</td><td><strong style="color:var(--accent-light);font-size:16px;">${rect.result}</strong></td><td>${conf}%</td><td>${rect.charRange.substring(0, 20)}${rect.charRange.length > 20 ? '...' : ''}</td></tr>`;
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

document.getElementById('btnExport').addEventListener('click', function() {
  if (rectangles.length === 0 || !rectangles[0].result) { alert('请先进行处理'); return; }
  let text = '';
  rectangles.forEach((rect, i) => {
    text += `[${i + 1}] ${rect.result}\n`;
  });
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '处理结果_' + new Date().toLocaleString().replace(/[\/:\s]/g, '-') + '.txt';
  a.click();
  URL.revokeObjectURL(url);
  updateStatus('结果已导出');
});

document.querySelectorAll('.panel-tabs button').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.panel-tabs button').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    document.querySelectorAll('.panel-content').forEach(p => p.classList.add('hidden'));
    document.getElementById('panel' + this.dataset.tab.charAt(0).toUpperCase() + this.dataset.tab.slice(1)).classList.remove('hidden');
  });
});

document.getElementById('matchThreshold').addEventListener('input', function() {
  document.getElementById('thresholdVal').textContent = this.value + '%';
});

document.getElementById('binThreshold').addEventListener('input', function() {
  document.getElementById('binVal').textContent = this.value;
});

document.getElementById('sampleSize').addEventListener('change', function() {
  sampleSize = parseInt(this.value);
  generateBuiltinSamples();
  renderBuiltinSamples();
});

document.getElementById('btnZoomIn').addEventListener('click', function() {
  zoom *= 1.2;
  drawImage();
});

document.getElementById('btnZoomOut').addEventListener('click', function() {
  zoom /= 1.2;
  if (zoom < 0.1) zoom = 0.1;
  drawImage();
});

document.getElementById('btnZoomFit').addEventListener('click', function() {
  zoom = 1;
  drawImage();
});

document.getElementById('btnAddCustomSample').addEventListener('click', function() {
  if (selectedRectIndex < 0 || !currentImage) { alert('请先选择区域'); return; }
  const rect = rectangles[selectedRectIndex];
  const char = prompt('请输入这个样本对应的字符：');
  if (!char || char.length !== 1) return;
  const c = document.createElement('canvas');
  const cw = Math.round(rect.w);
  const ch = Math.round(rect.h);
  c.width = cw;
  c.height = ch;
  const x = c.getContext('2d');
  x.drawImage(currentImage, rect.x, rect.y, cw, ch, 0, 0, cw, ch);
  const gray = toGray(x.getImageData(0, 0, cw, ch).data, cw, ch);
  const bin = threshold(gray, cw, ch, parseInt(document.getElementById('binThreshold').value));
  const resized = resizeBinary(bin, cw, ch, sampleSize, sampleSize);
  const fullData = new Uint8ClampedArray(sampleSize * sampleSize * 4);
  for (let i = 0; i < sampleSize * sampleSize; i++) {
    const v = resized[i] > 0 ? 0 : 255;
    fullData[i * 4] = v;
    fullData[i * 4 + 1] = v;
    fullData[i * 4 + 2] = v;
    fullData[i * 4 + 3] = 255;
  }
  customSamples.push({ char, data: fullData, size: sampleSize });
  updateCustomSamples();
  updateStatus('自定义样本已添加: ' + char);
});

function updateCustomSamples() {
  const container = document.getElementById('customSamples');
  if (customSamples.length === 0) {
    container.innerHTML = '<p class="empty-hint">暂无自定义样本</p>';
    return;
  }
  container.innerHTML = '<div style="display:flex;flex-wrap:wrap;gap:4px;">' + customSamples.map((s, i) => {
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><canvas width="32" height="32" id="customSample_${i}" style="background:#fff;border-radius:4px;"></canvas><span style="font-size:10px;color:var(--text-muted);">${s.char}</span></div>`;
  }).join('') + '</div>';
  customSamples.forEach((s, i) => {
    const c = document.getElementById(`customSample_${i}`);
    if (c) {
      const x = c.getContext('2d');
      const imgData = new ImageData(new Uint8ClampedArray(s.data), s.size, s.size);
      x.putImageData(imgData, 0, 0);
    }
  });
}

window.addEventListener('resize', function() {
  if (currentImage) drawImage();
});

generateBuiltinSamples();
renderBuiltinSamples();
updateCustomSamples();
</script>
