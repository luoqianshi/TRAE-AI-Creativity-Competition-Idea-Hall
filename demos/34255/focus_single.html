<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer - 专注倒计时</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --primary-dark: #4f46e5;
            --secondary-color: #8b5cf6;
            --accent-color: #f472b6;
            --bg-gradient-start: #0f0f23;
            --bg-gradient-end: #1a1a2e;
            --card-bg: rgba(30, 30, 50, 0.8);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            color: var(--text-primary);
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .timer-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .timer-ring {
            position: relative;
            width: 280px;
            height: 280px;
        }

        .ring-svg {
            transform: rotate(-90deg);
        }

        .ring-progress {
            transition: stroke-dashoffset 1s linear;
            filter: drop-shadow(0 0 10px var(--primary-color));
        }

        .timer-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .time {
            display: block;
            font-size: 4.5rem;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            margin-bottom: 8px;
            letter-spacing: -2px;
        }

        .period {
            display: block;
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .mode-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
        }

        .mode-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 25px;
            background: var(--card-bg);
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            color: var(--text-primary);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-btn {
            width: 56px;
            height: 56px;
            border: none;
            border-radius: 50%;
            background: var(--card-bg);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            transform: scale(1.05);
        }

        .control-btn svg {
            width: 22px;
            height: 22px;
        }

        .play-btn {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            box-shadow: 0 4px 25px rgba(99, 102, 241, 0.5);
        }

        .play-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 30px rgba(99, 102, 241, 0.6);
        }

        .play-btn svg {
            width: 26px;
            height: 26px;
        }

        .stats {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 20px;
            margin-bottom: 30px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            display: block;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .stat-divider {
            width: 1px;
            height: 40px;
            background: rgba(148, 163, 184, 0.2);
        }

        .task-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .task-header h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .add-task-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-task-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 15px rgba(99, 102, 241, 0.4);
        }

        .task-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .empty-tip {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 20px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 8px;
            transition: all 0.3s ease;
        }

        .task-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .task-checkbox:hover {
            border-color: var(--primary-color);
        }

        .task-item.completed .task-checkbox {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-color: transparent;
        }

        .task-checkbox svg {
            width: 12px;
            height: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .task-item.completed .task-checkbox svg {
            opacity: 1;
        }

        .task-text {
            flex: 1;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .task-delete {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .task-delete:hover {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger-color);
        }

        .task-delete svg {
            width: 16px;
            height: 16px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-content h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-content input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .modal-content input:focus {
            border-color: var(--primary-color);
        }

        .modal-content input::placeholder {
            color: var(--text-muted);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-btn.cancel {
            background: rgba(148, 163, 184, 0.2);
            color: var(--text-secondary);
        }

        .modal-btn.cancel:hover {
            background: rgba(148, 163, 184, 0.3);
        }

        .modal-btn.confirm {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .modal-btn.confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .completion-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 10px 40px rgba(99, 102, 241, 0.4);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 2000;
        }

        .completion-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            .container { padding: 10px; }
            .timer-ring { width: 240px; height: 240px; }
            .time { font-size: 3.5rem; }
            .controls { gap: 15px; }
            .control-btn { width: 50px; height: 50px; }
            .play-btn { width: 62px; height: 62px; }
            .stats { gap: 20px; padding: 15px; }
            .stat-value { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">专注时光</h1>
            <p class="subtitle">让每一分钟都有意义</p>
        </div>

        <div class="timer-container">
            <div class="timer-ring">
                <svg class="ring-svg" viewBox="0 0 200 200">
                    <circle class="ring-bg" cx="100" cy="100" r="90" fill="none" stroke="#e2e8f0" stroke-width="8"/>
                    <circle class="ring-progress" cx="100" cy="100" r="90" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" stroke-dasharray="565.49" stroke-dashoffset="565.49"/>
                </svg>
                <div class="timer-display">
                    <span class="time" id="time">25:00</span>
                    <span class="period" id="period">专注时间</span>
                </div>
            </div>
        </div>

        <div class="mode-tabs">
            <button class="mode-btn active" data-mode="focus">专注</button>
            <button class="mode-btn" data-mode="short">短休息</button>
            <button class="mode-btn" data-mode="long">长休息</button>
        </div>

        <div class="controls">
            <button class="control-btn" id="reset">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                    <path d="M21 3v5h-5"/>
                    <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                    <path d="M8 16H3v5"/>
                </svg>
            </button>
            <button class="control-btn play-btn" id="start">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 3v18l13.5-9z"/>
                </svg>
            </button>
            <button class="control-btn" id="pause">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 4h4v16H6zM14 4h4v16h-4z"/>
                </svg>
            </button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-value" id="completed">0</span>
                <span class="stat-label">已完成</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="stat-value" id="streak">0</span>
                <span class="stat-label">连续天数</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="stat-value" id="total">0</span>
                <span class="stat-label">总专注时长</span>
            </div>
        </div>

        <div class="task-section">
            <div class="task-header">
                <h3>今日任务</h3>
                <button class="add-task-btn" id="addTask">+ 添加任务</button>
            </div>
            <div class="task-list" id="taskList">
                <div class="empty-tip">点击上方按钮添加任务</div>
            </div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h3>添加任务</h3>
            <input type="text" id="taskInput" placeholder="输入任务名称..." maxlength="50">
            <div class="modal-actions">
                <button class="modal-btn cancel" id="cancelTask">取消</button>
                <button class="modal-btn confirm" id="confirmTask">添加</button>
            </div>
        </div>
    </div>

    <script>
        class FocusTimer {
            constructor() {
                this.modes = {
                    focus: { minutes: 25, label: '专注时间', color: '#6366f1' },
                    short: { minutes: 5, label: '短休息', color: '#10b981' },
                    long: { minutes: 15, label: '长休息', color: '#f59e0b' }
                };
                
                this.currentMode = 'focus';
                this.timeLeft = this.modes.focus.minutes * 60;
                this.isRunning = false;
                this.timer = null;
                this.completedPomodoros = 0;
                
                this.loadStats();
                this.loadTasks();
                this.setupEventListeners();
                this.updateDisplay();
            }

            setupEventListeners() {
                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        if (!this.isRunning) {
                            this.setMode(e.target.dataset.mode);
                        }
                    });
                });

                document.getElementById('start').addEventListener('click', () => this.start());
                document.getElementById('pause').addEventListener('click', () => this.pause());
                document.getElementById('reset').addEventListener('click', () => this.reset());

                document.getElementById('addTask').addEventListener('click', () => this.showTaskModal());
                document.getElementById('cancelTask').addEventListener('click', () => this.hideTaskModal());
                document.getElementById('confirmTask').addEventListener('click', () => this.addTask());
                document.getElementById('taskInput').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') this.addTask();
                });
            }

            setMode(mode) {
                this.currentMode = mode;
                this.timeLeft = this.modes[mode].minutes * 60;
                this.updateDisplay();
                
                document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
                document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
                document.querySelector('.ring-progress').style.stroke = this.modes[mode].color;
            }

            start() {
                if (this.isRunning) return;
                this.isRunning = true;
                this.timer = setInterval(() => {
                    this.timeLeft--;
                    this.updateDisplay();
                    if (this.timeLeft <= 0) this.complete();
                }, 1000);
            }

            pause() {
                if (!this.isRunning) return;
                this.isRunning = false;
                clearInterval(this.timer);
                this.timer = null;
            }

            reset() {
                this.pause();
                this.timeLeft = this.modes[this.currentMode].minutes * 60;
                this.updateDisplay();
            }

            complete() {
                this.pause();
                
                if (this.currentMode === 'focus') {
                    this.completedPomodoros++;
                    this.updateStats();
                    this.playNotificationSound();
                    this.showCompletionToast();
                    
                    if (this.completedPomodoros % 4 === 0) {
                        this.setMode('long');
                    } else {
                        this.setMode('short');
                    }
                } else {
                    this.setMode('focus');
                }
                
                this.updateDisplay();
            }

            updateDisplay() {
                const minutes = Math.floor(this.timeLeft / 60);
                const seconds = this.timeLeft % 60;
                const formattedTime = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                document.getElementById('time').textContent = formattedTime;
                document.getElementById('period').textContent = this.modes[this.currentMode].label;
                
                const totalSeconds = this.modes[this.currentMode].minutes * 60;
                const progress = (totalSeconds - this.timeLeft) / totalSeconds;
                const circumference = 2 * Math.PI * 90;
                const offset = circumference * (1 - progress);
                
                document.querySelector('.ring-progress').style.strokeDashoffset = offset;
            }

            playNotificationSound() {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                    oscillator.frequency.setValueAtTime(1000, audioContext.currentTime + 0.1);
                    
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.5);
                } catch (e) {}
            }

            showCompletionToast() {
                const toast = document.createElement('div');
                toast.className = 'completion-toast';
                toast.textContent = `🎉 太棒了！已完成 ${this.completedPomodoros} 个专注时段`;
                document.body.appendChild(toast);
                
                setTimeout(() => toast.classList.add('show'), 10);
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            loadStats() {
                const saved = localStorage.getItem('focusStats');
                if (saved) {
                    const stats = JSON.parse(saved);
                    this.completedPomodoros = stats.completed || 0;
                    
                    const today = new Date().toDateString();
                    if (stats.lastDate !== today) {
                        const lastDate = new Date(stats.lastDate);
                        const todayDate = new Date(today);
                        const diffDays = Math.round((todayDate - lastDate) / (1000 * 60 * 60 * 24));
                        
                        if (diffDays === 1) {
                            stats.streak = (stats.streak || 1) + 1;
                        } else if (diffDays > 1) {
                            stats.streak = 1;
                        }
                        stats.lastDate = today;
                    }
                    
                    this.stats = stats;
                } else {
                    this.stats = {
                        completed: 0,
                        streak: 1,
                        total: 0,
                        lastDate: new Date().toDateString()
                    };
                }
                
                this.updateStatsDisplay();
            }

            updateStats() {
                this.stats.completed = this.completedPomodoros;
                this.stats.total += this.modes.focus.minutes;
                localStorage.setItem('focusStats', JSON.stringify(this.stats));
                this.updateStatsDisplay();
            }

            updateStatsDisplay() {
                document.getElementById('completed').textContent = this.stats.completed;
                document.getElementById('streak').textContent = this.stats.streak || 1;
                
                const hours = Math.floor(this.stats.total / 60);
                const minutes = this.stats.total % 60;
                document.getElementById('total').textContent = hours > 0 ? `${hours}h ${minutes}m` : `${minutes}m`;
            }

            loadTasks() {
                const saved = localStorage.getItem('focusTasks');
                if (saved) {
                    this.tasks = JSON.parse(saved);
                    this.renderTasks();
                } else {
                    this.tasks = [];
                }
            }

            saveTasks() {
                localStorage.setItem('focusTasks', JSON.stringify(this.tasks));
            }

            showTaskModal() {
                document.getElementById('modal').classList.add('active');
                document.getElementById('taskInput').focus();
            }

            hideTaskModal() {
                document.getElementById('modal').classList.remove('active');
                document.getElementById('taskInput').value = '';
            }

            addTask() {
                const input = document.getElementById('taskInput');
                const text = input.value.trim();
                
                if (text) {
                    this.tasks.push({ id: Date.now(), text, completed: false });
                    this.saveTasks();
                    this.renderTasks();
                    this.hideTaskModal();
                }
            }

            toggleTask(id) {
                const task = this.tasks.find(t => t.id === id);
                if (task) {
                    task.completed = !task.completed;
                    this.saveTasks();
                    this.renderTasks();
                }
            }

            deleteTask(id) {
                this.tasks = this.tasks.filter(t => t.id !== id);
                this.saveTasks();
                this.renderTasks();
            }

            renderTasks() {
                const container = document.getElementById('taskList');
                
                if (this.tasks.length === 0) {
                    container.innerHTML = '<div class="empty-tip">点击上方按钮添加任务</div>';
                    return;
                }
                
                container.innerHTML = this.tasks.map(task => `
                    <div class="task-item ${task.completed ? 'completed' : ''}" data-id="${task.id}">
                        <div class="task-checkbox" onclick="timer.toggleTask(${task.id})">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </div>
                        <span class="task-text">${task.text}</span>
                        <button class="task-delete" onclick="timer.deleteTask(${task.id})">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
