<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能体项目管理平台 - 页面原型</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0f;color:#e0e0e0;overflow:hidden;height:100vh}
.login-page{display:flex;justify-content:center;align-items:center;height:100vh;background:linear-gradient(135deg,#0a0a0f 0%,#12121a 50%,#0d1117 100%)}
.login-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:48px;width:400px;backdrop-filter:blur(20px)}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo h1{font-size:24px;color:#e0e0e0;font-weight:600}
.login-logo p{color:#888;font-size:14px;margin-top:8px}
.fg{margin-bottom:20px}
.fg label{display:block;font-size:13px;color:#888;margin-bottom:8px}
.fi{width:100%;padding:12px 16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:#e0e0e0;font-size:14px;outline:none}
.fi:focus{border-color:#6366f1}
.btn{padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:500;transition:all .2s}
.btn-p{background:#6366f1;color:#fff;width:100%;padding:12px}
.btn-p:hover{background:#5558e6}
.btn-s{padding:6px 12px;font-size:12px}
.btn-o{background:transparent;border:1px solid rgba(255,255,255,0.15);color:#ccc}
.btn-o:hover{border-color:#6366f1;color:#6366f1}
.btn-ok{background:#22c55e;color:#fff}
.btn-w{background:#f59e0b;color:#111}
.btn-d{background:#ef4444;color:#fff}
.btn-g{background:transparent;color:#aaa;border:none}
.btn-g:hover{color:#e0e0e0}
.app{display:flex;height:100vh}
.sb{width:256px;background:rgba(255,255,255,0.02);border-right:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;flex-shrink:0}
.sb-h{padding:20px 16px 12px}
.sb-h h2{font-size:15px;color:#e0e0e0;font-weight:600}
.sb-h p{font-size:11px;color:#666;margin-top:2px}
.sb-nav{flex:1;overflow-y:auto;padding:4px 8px}
.sb-sec{margin-bottom:4px}
.sb-st{font-size:11px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.5px;padding:12px 12px 6px}
.ni{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:#888;transition:all .15s;margin-bottom:1px;text-decoration:none}
.ni:hover{background:rgba(255,255,255,0.04);color:#bbb}
.ni.a{background:rgba(99,102,241,0.12);color:#a5b4fc}
.ni svg{width:16px;height:16px;flex-shrink:0}
.mc{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tb{height:56px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.tb-l{display:flex;align-items:center;gap:12px}
.bc{font-size:13px;color:#888}
.bc span{color:#e0e0e0}
.tb-r{display:flex;align-items:center;gap:16px}
.tb-s{padding:7px 12px 7px 32px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:6px;color:#888;font-size:13px;width:220px;outline:none}
.nb{position:relative}
.nb::after{content:'3';position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:9px;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.pc{flex:1;overflow-y:auto;padding:24px}
.ph{margin-bottom:24px}
.ph h1{font-size:22px;font-weight:600;color:#e0e0e0}
.ph p{font-size:13px;color:#666;margin-top:4px}
.ph-a{display:flex;justify-content:space-between;align-items:center}
.sr{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.sc{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:20px}
.sc .sl{font-size:12px;color:#888;margin-bottom:8px}
.sc .sv{font-size:28px;font-weight:700;color:#e0e0e0}
.sc .sch{font-size:12px;margin-top:6px}
.sc .sch.u{color:#22c55e}
.sc .sch.d{color:#ef4444}
.cd{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:10px;overflow:hidden}
.cd-h{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;justify-content:space-between;align-items:center}
.cd-h h3{font-size:14px;font-weight:600;color:#e0e0e0}
.cd-b{padding:20px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:#888;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.06)}
td{padding:12px 16px;font-size:13px;color:#ccc;border-bottom:1px solid rgba(255,255,255,0.03)}
tr:hover{background:rgba(255,255,255,0.02)}
.bg{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:500}
.bg-g{background:rgba(34,197,94,0.12);color:#4ade80}
.bg-y{background:rgba(245,158,11,0.12);color:#fbbf24}
.bg-r{background:rgba(239,68,68,0.12);color:#f87171}
.bg-b{background:rgba(59,130,246,0.12);color:#60a5fa}
.bg-gr{background:rgba(156,163,175,0.15);color:#9ca3af}
.bg-p{background:rgba(168,85,247,0.12);color:#c084fc}
.pb{height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px;transition:width .3s}
.ch{height:200px;display:flex;align-items:flex-end;gap:8px;padding:20px}
.cb{flex:1;border-radius:4px 4px 0 0;min-width:20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tg{display:inline-block;padding:2px 8px;background:rgba(255,255,255,0.05);border-radius:4px;font-size:11px;color:#aaa;margin-right:4px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
textarea.fi{min-height:80px;resize:vertical}
.tgl{width:40px;height:22px;background:#444;border-radius:11px;position:relative;cursor:pointer}
.tgl::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2px;left:2px}
.tgl.on{background:#6366f1}
.tgl.on::after{left:20px}
.tabs{display:flex;gap:0;border-bottom:1px solid rgba(255,255,255,0.06);margin-bottom:20px}
.tab{padding:10px 20px;font-size:13px;color:#888;cursor:pointer;border-bottom:2px solid transparent}
.tab.a{color:#a5b4fc;border-bottom-color:#6366f1}
.tl-i{padding:16px 0 16px 24px;border-left:2px solid rgba(255,255,255,0.06);position:relative;margin-left:8px}
.tl-i::before{content:'';position:absolute;left:-5px;top:20px;width:8px;height:8px;border-radius:50%;background:#6366f1}
.tl-t{font-size:11px;color:#666}
.tl-c{margin-top:4px;font-size:13px;color:#ccc}
.dl{font-family:'Fira Code',monospace;font-size:12px;padding:2px 12px}
.da{background:rgba(34,197,94,0.08);color:#4ade80}
.dr{background:rgba(239,68,68,0.08);color:#f87171}
.di{background:rgba(59,130,246,0.06);color:#60a5fa}
.mono{font-family:'Fira Code','Consolas',monospace}
.cr{cursor:pointer}
.cr:hover{background:rgba(99,102,241,0.05)!important}
.lbl{font-size:12px;color:#888;margin-bottom:4px;display:block}
.val{font-size:13px;color:#e0e0e0}
.sd{height:1px;background:rgba(255,255,255,0.06);margin:16px 0}
.sb::-webkit-scrollbar{width:4px}
.sb::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}
.pc::-webkit-scrollbar{width:6px}
.pc::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px}
.h{display:none!important}
</style>
</head>
<body>
<div id="login-page" class="login-page">
<div class="login-card">
<div class="login-logo"><h1>AI Agent Platform</h1><p>多智能体调度与编排管理平台</p></div>
<div class="fg"><label>用户名</label><input class="fi" placeholder="请输入用户名" value="admin"></div>
<div class="fg"><label>密码</label><input class="fi" type="password" placeholder="请输入密码" value="••••••••"></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;font-size:13px">
<label style="display:flex;align-items:center;gap:6px;color:#888"><input type="checkbox" checked> 记住登录</label>
<a href="javascript:void(0)" style="color:#6366f1;text-decoration:none">忘记密码？</a></div>
<button class="btn btn-p" onclick="showApp()">登 录</button>
</div></div>

<div id="app" class="app h">
<aside class="sb">
<div class="sb-h"><h2>AI Agent Platform</h2><p>v2.1.0</p></div>
<nav class="sb-nav">
<div class="sb-sec"><div class="sb-st">概览</div>
<a class="ni a" onclick="go('dashboard',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>仪表盘</a></div>
<div class="sb-sec"><div class="sb-st">核心功能</div>
<a class="ni" onclick="go('tasks',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 12l2 2 4-4"/></svg>任务管理</a>
<a class="ni" onclick="go('agent-list',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4"/></svg>智能体管理</a>
<a class="ni" onclick="go('approvals',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>审批管理</a>
<a class="ni" onclick="go('knowledge-bases',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>知识库管理</a>
<a class="ni" onclick="go('skill-list',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>技能管理</a>
<a class="ni" onclick="go('tool-manage',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>工具管理</a></div>
<div class="sb-sec"><div class="sb-st">治理</div>
<a class="ni" onclick="go('governance',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>治理总览</a>
<a class="ni" onclick="go('sandbox',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M8 2v20M16 2v20M2 12h20"/></svg>沙箱配置</a>
<a class="ni" onclick="go('workflow',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg>审批工作流</a></div>
<div class="sb-sec"><div class="sb-st">LLM 管理</div>
<a class="ni" onclick="go('llm-providers',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>供应商管理</a>
<a class="ni" onclick="go('llm-models',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>模型配置</a>
<a class="ni" onclick="go('llm-call-logs',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>调用日志</a></div>
<div class="sb-sec"><div class="sb-st">运维监控</div>
<a class="ni" onclick="go('monitoring',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>监控面板</a>
<a class="ni" onclick="go('logs',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>运行日志</a>
<a class="ni" onclick="go('alerts',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>告警管理</a></div>
<div class="sb-sec"><div class="sb-st">系统设置</div>
<a class="ni" onclick="go('settings',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09c-.658.003-1.25.396-1.51 1z"/></svg>系统设置</a>
<a class="ni" onclick="go('users',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>用户管理</a></div>
</nav></aside>

<main class="mc">
<header class="tb">
<div class="tb-l"><div class="bc">首页 / <span id="bc-cur">仪表盘</span></div></div>
<div class="tb-r">
<input class="tb-s" placeholder="搜索功能、智能体、任务...">
<div class="nb" style="cursor:pointer;font-size:18px">&#128276;</div>
<div style="display:flex;align-items:center;gap:8px">
<div style="width:32px;height:32px;border-radius:50%;background:#6366f1;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff">A</div>
<span style="font-size:13px;color:#888">Admin</span></div></div></header>
<div id="page-area" class="pc"></div>
</main></div>

<script>
const N={
'dashboard':'仪表盘','tasks':'任务管理','task-detail':'任务详情','create-task':'创建任务',
'agent-list':'智能体管理','agent-detail':'智能体详情',
'approvals':'审批管理','approval-detail':'审批详情',
'knowledge-bases':'知识库管理','knowledge-collections':'知识库分组','knowledge-documents':'知识库文档','knowledge-upload':'上传文档',
'skill-list':'技能管理','skill-detail':'技能详情','skill-editor':'技能编辑',
'skill-dev':'技能开发','skill-dev-chat':'技能开发对话','skill-dev-tools':'工具配置','skill-dev-prompts':'提示词配置','skill-dev-preview':'技能预览',
'tool-manage':'工具管理','tool-models':'工具模型',
'governance':'治理总览','sandbox':'沙箱配置','workflow':'审批工作流',
'llm-providers':'供应商管理','provider-form':'供应商表单','provider-detail':'供应商详情',
'llm-models':'模型配置','model-form':'模型表单','llm-model-detail':'模型详情',
'llm-call-logs':'调用日志','llm-config':'LLM配置',
'monitoring':'监控面板','trace-detail':'链路详情',
'logs':'运行日志','log-detail':'日志详情',
'alerts':'告警管理','alert-detail':'告警详情',
'settings':'系统设置','settings-general':'通用设置','settings-notification':'通知设置',
'settings-security':'安全设置','settings-backup':'备份恢复','settings-cicd':'CI/CD配置','settings-database':'数据库管理',
'users':'用户管理','user-form':'用户表单','profile':'个人信息'
};

function showApp(){document.getElementById('login-page').classList.add('h');document.getElementById('app').classList.remove('h');go('dashboard')}

function go(p,el){
document.querySelectorAll('.ni').forEach(n=>n.classList.remove('a'));
if(el)el.classList.add('a');
else document.querySelector('.ni[onclick*="'+p+'"]')?.classList.add('a');
document.getElementById('bc-cur').textContent=N[p]||p;
const area=document.getElementById('page-area');
if(typeof P[p]==='function')area.innerHTML=P[p]();
else area.innerHTML='<div class="ph"><h1>'+(N[p]||p)+'</h1><p>功能开发中</p></div><div style="text-align:center;padding:80px;color:#555"><div style="font-size:48px;margin-bottom:16px">🚧</div><div style="font-size:16px;color:#888">此页面正在开发中</div><div style="font-size:13px;color:#666;margin-top:8px">敬请期待</div></div>';
}

const P={};

// === DASHBOARD ===
P.dashboard=()=>`<div class="ph"><h1>仪表盘</h1><p>平台运行概览</p></div>
<div class="sr">
<div class="sc"><div class="sl">智能体总数</div><div class="sv">24</div><div class="sch u">+3 本周新增</div></div>
<div class="sc"><div class="sl">运行中任务</div><div class="sv">156</div><div class="sch u">+12 较昨日</div></div>
<div class="sc"><div class="sl">今日调用次数</div><div class="sv">12.8K</div><div class="sch u">+18.5%</div></div>
<div class="sc"><div class="sl">平均响应时间</div><div class="sv">245<span style="font-size:14px;color:#888">ms</span></div><div class="sch d">-12ms</div></div></div>
<div class="g2">
<div class="cd"><div class="cd-h"><h3>任务趋势 (近7天)</h3></div><div class="cd-b"><div class="ch"><div class="cb" style="height:40%;background:#6366f1"></div><div class="cb" style="height:55%;background:#6366f1"></div><div class="cb" style="height:45%;background:#6366f1"></div><div class="cb" style="height:70%;background:#6366f1"></div><div class="cb" style="height:60%;background:#6366f1"></div><div class="cb" style="height:85%;background:#6366f1"></div><div class="cb" style="height:75%;background:#6366f1"></div></div></div></div>
<div class="cd"><div class="cd-h"><h3>智能体状态分布</h3></div><div class="cd-b"><div style="display:flex;gap:24px;align-items:center;justify-content:center;height:200px">
