<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社区老年智能便民查询助手</title>
    <style>
        /* ========== 全局样式（适老化规范） ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif;
            background-color: #FFF8E7;
            color: #1A1A1A;
            line-height: 1.8;
            font-size: 20px;
            min-height: 100vh;
        }

        body.font-large {
            font-size: 26px;
        }

        body.font-xlarge {
            font-size: 32px;
        }

        /* ========== 顶部标题区 ========== */
        .header {
            background-color: #2E7D32;
            color: #FFFFFF;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .header h1 {
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 24px;
            opacity: 0.95;
        }

        /* ========== 辅助功能区 ========== */
        .utility-bar {
            background-color: #E8F5E9;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            border-bottom: 3px solid #2E7D32;
        }

        .utility-btn {
            background-color: #2E7D32;
            color: #FFFFFF;
            border: 3px solid #1B5E20;
            padding: 12px 30px;
            font-size: 22px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 160px;
            min-height: 60px;
        }

        .utility-btn:hover,
        .utility-btn:focus {
            background-color: #1B5E20;
            transform: scale(1.05);
            outline: 4px solid #FF9800;
        }

        .utility-btn:active {
            transform: scale(0.98);
        }

        /* ========== 搜索区 ========== */
        .search-section {
            padding: 40px 20px;
            background-color: #FFF8E7;
        }

        .search-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .search-input-wrapper {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        #searchInput {
            flex: 1;
            min-width: 300px;
            padding: 20px 25px;
            font-size: 28px;
            border: 4px solid #2E7D32;
            border-radius: 15px;
            background-color: #FFFFFF;
            color: #1A1A1A;
            outline: none;
            transition: border-color 0.2s;
        }

        #searchInput:focus {
            border-color: #FF9800;
            box-shadow: 0 0 0 4px rgba(255,152,0,0.3);
        }

        #searchInput::placeholder {
            color: #999;
            font-size: 24px;
        }

        .search-btn {
            background-color: #FF9800;
            color: #FFFFFF;
            border: 4px solid #E65100;
            padding: 20px 40px;
            font-size: 28px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            min-width: 180px;
            min-height: 80px;
            transition: all 0.2s;
        }

        .search-btn:hover,
        .search-btn:focus {
            background-color: #E65100;
            transform: scale(1.05);
            outline: 4px solid #2E7D32;
        }

        .voice-btn {
            background-color: #2196F3;
            color: #FFFFFF;
            border: 4px solid #1565C0;
            padding: 20px 30px;
            font-size: 28px;
            border-radius: 15px;
            cursor: pointer;
            min-width: 120px;
            min-height: 80px;
            transition: all 0.2s;
        }

        .voice-btn:hover,
        .voice-btn:focus {
            background-color: #1565C0;
            transform: scale(1.05);
            outline: 4px solid #FF9800;
        }

        .voice-btn.recording {
            background-color: #F44336;
            border-color: #C62828;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .search-history {
            margin-top: 15px;
            font-size: 20px;
            color: #666;
        }

        .history-item {
            display: inline-block;
            background-color: #E8F5E9;
            padding: 8px 18px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid #A5D6A7;
            transition: all 0.2s;
        }

        .history-item:hover {
            background-color: #C8E6C9;
            transform: scale(1.05);
        }

        /* ========== 分类按钮区 ========== */
        .category-section {
            padding: 30px 20px;
            background-color: #F1F8E9;
            border-top: 3px solid #C5E1A5;
            border-bottom: 3px solid #C5E1A5;
        }

        .category-title {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #2E7D32;
            margin-bottom: 25px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .category-btn {
            background-color: #FFFFFF;
            border: 4px solid #2E7D32;
            padding: 25px 20px;
            font-size: 24px;
            border-radius: 15px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            color: #1B5E20;
            transition: all 0.2s;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .category-btn:hover,
        .category-btn:focus {
            background-color: #2E7D32;
            color: #FFFFFF;
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            outline: 4px solid #FF9800;
        }

        .category-btn:active {
            transform: scale(0.98);
        }

        .category-icon {
            font-size: 48px;
        }

        /* ========== 搜索结果展示区 ========== */
        .result-section {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 400px;
        }

        .result-placeholder {
            text-align: center;
            padding: 80px 20px;
            color: #999;
            font-size: 26px;
        }

        .result-placeholder-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .result-card {
            background-color: #FFFFFF;
            border: 4px solid #2E7D32;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }

        .result-card:hover {
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
            transform: translateY(-2px);
        }

        .result-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #E8F5E9;
            flex-wrap: wrap;
            gap: 10px;
        }

        .result-card-title {
            font-size: 32px;
            font-weight: bold;
            color: #1B5E20;
        }

        .result-card-category {
            background-color: #FF9800;
            color: #FFFFFF;
            padding: 8px 20px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .result-card-body {
            font-size: 24px;
            line-height: 2;
            color: #333;
        }

        .result-card-body p {
            margin-bottom: 15px;
        }

        .highlight-material {
            background-color: #FFF3E0;
            padding: 12px 20px;
            border-left: 6px solid #FF9800;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
            color: #E65100;
        }

        .highlight-time {
            background-color: #E8F5E9;
            padding: 12px 20px;
            border-left: 6px solid #2E7D32;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
            color: #1B5E20;
        }

        .ai-transform-box {
            background-color: #E3F2FD;
            border: 3px solid #2196F3;
            border-radius: 12px;
            padding: 25px;
            margin-top: 20px;
        }

        .ai-transform-title {
            font-size: 26px;
            font-weight: bold;
            color: #1565C0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ai-transform-content {
            font-size: 24px;
            line-height: 2;
            color: #1A1A1A;
        }

        .ai-transform-content ol {
            padding-left: 30px;
            margin: 10px 0;
        }

        .ai-transform-content li {
            margin-bottom: 12px;
        }

        .step-number {
            display: inline-block;
            background-color: #2196F3;
            color: #FFFFFF;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            text-align: center;
            line-height: 36px;
            font-weight: bold;
            margin-right: 10px;
        }

        .view-detail-btn {
            background-color: #2E7D32;
            color: #FFFFFF;
            border: 3px solid #1B5E20;
            padding: 15px 35px;
            font-size: 24px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .view-detail-btn:hover,
        .view-detail-btn:focus {
            background-color: #1B5E20;
            transform: scale(1.05);
            outline: 4px solid #FF9800;
        }

        /* ========== 详情弹窗 ========== */
        .detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            z-index: 1000;
            overflow-y: auto;
            padding: 40px 20px;
        }

        .detail-modal.active {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .detail-modal-content {
            background-color: #FFFFFF;
            border: 5px solid #2E7D32;
            border-radius: 20px;
            padding: 40px;
            max-width: 1000px;
            width: 100%;
            position: relative;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .detail-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #F44336;
            color: #FFFFFF;
            border: 3px solid #C62828;
            width: 60px;
            height: 60px;
            font-size: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .detail-close-btn:hover {
            background-color: #C62828;
            transform: scale(1.1);
        }

        .detail-title {
            font-size: 36px;
            font-weight: bold;
            color: #1B5E20;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 4px solid #2E7D32;
        }

        .detail-section {
            margin-bottom: 25px;
        }

        .detail-section-title {
            font-size: 28px;
            font-weight: bold;
            color: #FF9800;
            margin-bottom: 12px;
        }

        .detail-section-content {
            font-size: 24px;
            line-height: 2;
            color: #333;
        }

        .detail-back-btn {
            background-color: #2E7D32;
            color: #FFFFFF;
            border: 3px solid #1B5E20;
            padding: 15px 35px;
            font-size: 24px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .detail-back-btn:hover {
            background-color: #1B5E20;
            transform: scale(1.05);
        }

        /* ========== 底部操作区 ========== */
        .footer {
            background-color: #2E7D32;
            color: #FFFFFF;
            padding: 25px 20px;
            text-align: center;
            margin-top: 40px;
        }

        .footer p {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .footer-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .footer-btn {
            background-color: #FFFFFF;
            color: #2E7D32;
            border: 3px solid #FFFFFF;
            padding: 12px 30px;
            font-size: 22px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .footer-btn:hover {
            background-color: #FF9800;
            color: #FFFFFF;
            border-color: #FF9800;
            transform: scale(1.05);
        }

        /* ========== 响应式适配 ========== */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 32px;
            }

            .header p {
                font-size: 20px;
            }

            #searchInput {
                font-size: 24px;
                padding: 16px 20px;
            }

            .search-btn,
            .voice-btn {
                font-size: 24px;
                padding: 16px 30px;
            }

            .category-btn {
                font-size: 20px;
                min-height: 100px;
            }

            .category-icon {
                font-size: 40px;
            }

            .result-card-title {
                font-size: 26px;
            }

            .result-card-body {
                font-size: 20px;
            }

            .detail-modal-content {
                padding: 25px;
            }

            .detail-title {
                font-size: 28px;
            }

            .detail-section-title {
                font-size: 24px;
            }

            .detail-section-content {
                font-size: 20px;
            }
        }

        /* ========== 无障碍焦点样式 ========== */
        *:focus {
            outline: 4px solid #FF9800;
            outline-offset: 2px;
        }

        /* ========== 打印样式 ========== */
        @media print {
            .utility-bar,
            .search-section,
            .category-section,
            .footer {
                display: none;
            }

            .result-card {
                break-inside: avoid;
                box-shadow: none;
                border: 2px solid #000;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部标题区 -->
    <header class="header">
        <h1>🏘️ 社区老年智能便民查询助手</h1>
        <p>简单、快速、贴心——您的社区生活好帮手</p>
    </header>

    <!-- 辅助功能区 -->
    <nav class="utility-bar" aria-label="辅助功能">
        <button class="utility-btn" onclick="changeFontSize('normal')" aria-label="正常字体大小">🔤 正常字体</button>
        <button class="utility-btn" onclick="changeFontSize('large')" aria-label="放大字体">🔍 放大字体</button>
        <button class="utility-btn" onclick="changeFontSize('xlarge')" aria-label="超大字体">🔎 超大字体</button>
        <button class="utility-btn" onclick="goHome()" aria-label="返回首页">🏠 返回首页</button>
        <button class="utility-btn" onclick="clearHistory()" aria-label="清空搜索历史">🗑️ 清空历史</button>
    </nav>

    <!-- 搜索区 -->
    <section class="search-section" aria-label="搜索区域">
        <div class="search-container">
            <div class="search-input-wrapper">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="请输入您想查询的内容，例如：养老金、义诊..."
                    aria-label="搜索输入框"
                    autocomplete="off"
                >
                <button class="search-btn" onclick="performSearch()" aria-label="搜索">🔍 搜索</button>
                <button class="voice-btn" id="voiceBtn" onclick="toggleVoiceInput()" aria-label="语音输入">🎤 语音</button>
            </div>
            <div class="search-history" id="searchHistory" style="display: none;">
                <strong>最近搜索：</strong>
                <div id="historyList"></div>
            </div>
        </div>
    </section>

    <!-- 分类按钮区 -->
    <section class="category-section" aria-label="服务分类">
        <h2 class="category-title">📋 便民服务分类</h2>
        <div class="category-grid">
            <button class="category-btn" onclick="searchByCategory('社保医保办理')" aria-label="社保医保办理">
                <span class="category-icon">🏥</span>
                <span>社保医保办理</span>
            </button>
            <button class="category-btn" onclick="searchByCategory('养老补贴申领')" aria-label="养老补贴申领">
                <span class="category-icon">💰</span>
                <span>养老补贴申领</span>
            </button>
            <button class="category-btn" onclick="searchByCategory('社区义诊活动')" aria-label="社区义诊活动">
                <span class="category-icon">🩺</span>
                <span>社区义诊活动</span>
            </button>
            <button class="category-btn" onclick="searchByCategory('城乡公交路线')" aria-label="城乡公交路线">
                <span class="category-icon">🚌</span>
                <span>城乡公交路线</span>
            </button>
            <button class="category-btn" onclick="searchByCategory('老年证件办理')" aria-label="老年证件办理">
                <span class="category-icon">🪪</span>
                <span>老年证件办理</span>
            </button>
        </div>
    </section>

    <!-- 搜索结果展示区 -->
    <main class="result-section" id="resultSection" aria-label="搜索结果">
        <div class="result-placeholder" id="placeholder">
            <div class="result-placeholder-icon">🔍</div>
            <p>请在上方搜索框中输入您想了解的内容</p>
            <p style="margin-top: 10px; font-size: 22px;">或者点击下面的分类按钮快速查询</p>
        </div>
        <div id="resultContainer"></div>
    </main>

    <!-- 详情弹窗 -->
    <div class="detail-modal" id="detailModal" role="dialog" aria-label="详情信息">
        <div class="detail-modal-content">
            <button class="detail-close-btn" onclick="closeDetail()" aria-label="关闭详情">✕</button>
            <div id="detailContent"></div>
            <button class="detail-back-btn" onclick="closeDetail()">← 返回搜索结果</button>
        </div>
    </div>

    <!-- 底部操作区 -->
    <footer class="footer">
        <p>📞 社区服务热线：400-XXX-XXXX</p>
        <p>⏰ 服务时间：周一至周五 9:00-17:00</p>
        <div class="footer-actions">
            <button class="footer-btn" onclick="goHome()">🏠 返回首页</button>
            <button class="footer-btn" onclick="window.print()">🖨️ 打印本页</button>
        </div>
    </footer>

        // ========== 搜索历史记录 ==========
        let searchHistory = [];
        let isRecording = false;

        // ========== 搜索功能 ==========
        function performSearch() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) {
                alert('请输入您要查询的内容');
                return;
            }

            // 添加到搜索历史
            addToHistory(keyword);

            // 执行搜索
            const results = searchService(keyword);
            displayResults(results, keyword);
        }

        // 回车搜索
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        function searchService(keyword) {
            const lowerKeyword = keyword.toLowerCase();
            return serviceData.filter(item => {
                return item.title.toLowerCase().includes(lowerKeyword) ||
                       item.category.toLowerCase().includes(lowerKeyword) ||
                       item.summary.toLowerCase().includes(lowerKeyword) ||
                       item.materials.some(m => m.toLowerCase().includes(lowerKeyword)) ||
                       item.aiTransform.explanation.includes(keyword);
            });
        }

        function searchByCategory(category) {
            document.getElementById('searchInput').value = category;
            const results = searchService(category);
            displayResults(results, category);
        }

        // ========== 显示搜索结果 ==========
        function displayResults(results, keyword) {
            const container = document.getElementById('resultContainer');
            const placeholder = document.getElementById('placeholder');

            if (results.length === 0) {
                placeholder.style.display = 'block';
                placeholder.innerHTML = `
                    <div class="result-placeholder-icon">😔</div>
                    <p>没有找到"${keyword}"相关的信息</p>
                    <p style="margin-top: 10px; font-size: 22px;">试试其他关键词，或点击下面的分类按钮查询</p>
                `;
                container.innerHTML = '';
                return;
            }

            placeholder.style.display = 'none';
            container.innerHTML = '';

            results.forEach(item => {
                const card = createResultCard(item);
                container.appendChild(card);
            });

            // 滚动到结果区域
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
        }

        function createResultCard(item) {
            const card = document.createElement('div');
            card.className = 'result-card';

            card.innerHTML = `
                <div class="result-card-header">
                    <h3 class="result-card-title">${item.title}</h3>
                    <span class="result-card-category">${item.category}</span>
                </div>
                <div class="result-card-body">
                    <p>${item.summary}</p>
                    <div class="highlight-material">📋 需要材料：${item.materials.join('、')}</div>
                    <div class="highlight-time">🕐 办理时间：${item.time}</div>
                    <p>📍 办理地点：${item.location}</p>
                    <p>📞 咨询电话：${item.phone}</p>
                </div>
                <div class="ai-transform-box">
                    <div class="ai-transform-title">🤖 通俗易懂版</div>
                    <div class="ai-transform-content">
                        <p><strong>啥意思：</strong>${item.aiTransform.explanation}</p>
                        <p style="margin-top: 15px;"><strong>怎么办：</strong></p>
                        <ol>
                            ${item.aiTransform.steps.map(step => `<li>${step}</li>`).join('')}
                        </ol>
                        <div class="highlight-material" style="margin-top: 15px;">
                            <strong>📦 带什么材料：</strong><br>
                            ${item.aiTransform.materials.join('<br>')}
                        </div>
                    </div>
                </div>
                <button class="view-detail-btn" onclick="showDetail(${item.id})">📖 查看详细</button>
            `;

            return card;
        }

                </div>

                <div class="detail-section">
                    <h3 class="detail-section-title">📦 所需材料</h3>
                    <div class="detail-section-content">
                        <div class="highlight-material">
                            ${item.materials.map(m => `<p>• ${m}</p>`).join('')}
                        </div>
                    </div>
                </div>

                <div class="detail-section">
                    <h3 class="detail-section-title">🤖 AI通俗解读</h3>
                    <div class="ai-transform-box" style="background-color: #E3F2FD; border-color: #2196F3;">
                        <p><strong>啥意思：</strong>${item.aiTransform.explanation}</p>
                        <p style="margin-top: 15px;"><strong>怎么办：</strong></p>
                        <ol>
                            ${item.aiTransform.steps.map(step => `<li style="margin-bottom: 10px;">${step}</li>`).join('')}
                        </ol>
                        <div class="highlight-material" style="margin-top: 15px;">
                            <strong>📦 带什么材料：</strong><br>
                            ${item.aiTransform.materials.join('<br>')}
                        </div>
                    </div>
                </div>

                <div class="detail-section">
                    <h3 class="detail-section-title">📜 官方原文</h3>
                    <div class="detail-section-content" style="background-color: #F5F5F5; padding: 20px; border-radius: 10px; font-size: 20px;">
                        <p style="line-height: 1.8;">${item.officialText}</p>
                    </div>
                </div>
            `;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeDetail() {
            const modal = document.getElementById('detailModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // 点击遮罩层关闭
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeDetail();
            }
        });

        // ESC键关闭
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeDetail();
            }
        });

        // ========== 语音输入模拟 ==========
        function toggleVoiceInput() {
            const voiceBtn = document.getElementById('voiceBtn');
            
            if (isRecording) {
                isRecording = false;
                voiceBtn.classList.remove('recording');
                voiceBtn.textContent = '🎤 语音';
                
                // 模拟语音识别结果
                const voiceKeywords = ['养老金', '义诊', '公交', '老年证', '医保'];
                const randomKeyword = voiceKeywords[Math.floor(Math.random() * voiceKeywords.length)];
                document.getElementById('searchInput').value = randomKeyword;
                
                // 显示提示
                showToast(`已识别语音："${randomKeyword}"`);
            } else {
                isRecording = true;
                voiceBtn.classList.add('recording');
                voiceBtn.textContent = '⏹️ 停止';
                showToast('正在聆听，请说话...');
            }
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background-color: rgba(0,0,0,0.8);
                color: white;
                padding: 20px 40px;
                font-size: 24px;
                border-radius: 12px;
                z-index: 2000;
                animation: fadeInOut 2s ease-in-out;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);

            const style = document.createElement('style');
            style.textContent = `
                @keyframes fadeInOut {
                    0% { opacity: 0; }
                    20% { opacity: 1; }
                    80% { opacity: 1; }
                    100% { opacity: 0; }
                }
            `;
            document.head.appendChild(style);

            setTimeout(() => {
                document.body.removeChild(toast);
                document.head.removeChild(style);
            }, 2000);
        }

        // ========== 字体大小切换 ==========
        function changeFontSize(size) {
            document.body.classList.remove('font-large', 'font-xlarge');
            
            switch(size) {
                case 'large':
                    document.body.classList.add('font-large');
                    showToast('字体已放大');
                    break;
                case 'xlarge':
                    document.body.classList.add('font-xlarge');
                    showToast('字体已调至最大');
                    break;
                default:
                    showToast('字体已恢复正常');
                    break;
            }
        }

        // ========== 返回首页 ==========
        function goHome() {
            document.getElementById('searchInput').value = '';
            document.getElementById('resultContainer').innerHTML = '';
            document.getElementById('placeholder').style.display = 'block';
            document.getElementById('placeholder').innerHTML = `
                <div class="result-placeholder-icon">🔍</div>
                <p>请在上方搜索框中输入您想了解的内容</p>
                <p style="margin-top: 10px; font-size: 22px;">或者点击下面的分类按钮快速查询</p>
            `;
            changeFontSize('normal');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ========== 清空搜索历史 ==========
        function clearHistory() {
            searchHistory = [];
            updateHistoryDisplay();
            showToast('搜索历史已清空');
        }

        function addToHistory(keyword) {
            // 避免重复
            const index = searchHistory.indexOf(keyword);
            if (index > -1) {
                searchHistory.splice(index, 1);
            }
            
            // 添加到开头
            searchHistory.unshift(keyword);
            
            // 最多保留10条
            if (searchHistory.length > 10) {
                searchHistory.pop();
            }
            
            updateHistoryDisplay();
        }

        function updateHistoryDisplay() {
            const historyDiv = document.getElementById('searchHistory');
            const listDiv = document.getElementById('historyList');
            
            if (searchHistory.length === 0) {
                historyDiv.style.display = 'none';
                return;
            }
            
            historyDiv.style.display = 'block';
            listDiv.innerHTML = searchHistory.map(item => 
                `<span class="history-item" onclick="searchFromHistory('${item}')">${item}</span>`
            ).join('');
        }

        function searchFromHistory(keyword) {
            document.getElementById('searchInput').value = keyword;
            performSearch();
        }

        // ========== 初始化 ==========
        document.addEventListener('DOMContentLoaded', function() {
            // 确保初始状态正确
            goHome();
        });
    </script>
</body>
</html>
