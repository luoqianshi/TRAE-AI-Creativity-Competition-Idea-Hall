<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>拼音小乐园 - 快乐学拼音</title>
<style>
/* ========== 全局变量与重置 ========== */
:root {
  --primary: #FF8C42;
  --secondary: #5BC0EB;
  --accent: #FDE74C;
  --success: #9BC53D;
  --danger: #E63946;
  --purple: #9B5DE5;
  --pink: #F15BB5;
  --bg-gradient-1: #FFF5E6;
  --bg-gradient-2: #E8F4FD;
  --card-bg: #FFFFFF;
  --text-primary: #2D3436;
  --text-secondary: #636E72;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.1);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.15);
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
  color: var(--text-primary);
  user-select: none;
}

#app {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

/* ========== 通用组件 ========== */
.page {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: none;
  flex-direction: column;
  overflow: hidden;
}

.page.active {
  display: flex;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 12px 24px;
  border: none;
  border-radius: var(--radius-md);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  text-decoration: none;
  color: white;
  box-shadow: var(--shadow-sm);
}

.btn:active {
  transform: scale(0.95);
}

.btn-primary {
  background: linear-gradient(135deg, #FF8C42, #FF6B35);
}

.btn-secondary {
  background: linear-gradient(135deg, #5BC0EB, #3AB0D8);
}

.btn-success {
  background: linear-gradient(135deg, #9BC53D, #7CB342);
}

.btn-danger {
  background: linear-gradient(135deg, #E63946, #D62828);
}

.btn-purple {
  background: linear-gradient(135deg, #9B5DE5, #7B2CBF);
}

.btn-pink {
  background: linear-gradient(135deg, #F15BB5, #E04FB0);
}

.btn-large {
  padding: 16px 32px;
  font-size: 18px;
  border-radius: var(--radius-lg);
}

.btn-circle {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  padding: 0;
  font-size: 24px;
}

/* 顶部导航栏 */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(10px);
  box-shadow: var(--shadow-sm);
  z-index: 100;
  flex-shrink: 0;
}

.back-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--secondary);
  color: white;
  border: none;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-sm);
}

.page-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
}

.coin-display {
  display: flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg, #FFD700, #FFA500);
  padding: 6px 14px;
  border-radius: 20px;
  color: white;
  font-weight: 700;
  font-size: 14px;
  box-shadow: var(--shadow-sm);
}

/* 卡片样式 */
.card {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  padding: 20px;
}

/* 动画 */
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideInRight {
  from { opacity: 0; transform: translateX(100%); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes popIn {
  0% { opacity: 0; transform: scale(0.5); }
  70% { transform: scale(1.1); }
  100% { opacity: 1; transform: scale(1); }
}

@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-20px) rotate(5deg); }
}

@keyframes sparkle {
  0%, 100% { opacity: 0; transform: scale(0); }
  50% { opacity: 1; transform: scale(1); }
}

.bounce { animation: bounce 2s ease-in-out infinite; }
.pulse { animation: pulse 2s ease-in-out infinite; }
.shake { animation: shake 0.5s ease-in-out; }
.fade-in { animation: fadeIn 0.5s ease-out; }
.pop-in { animation: popIn 0.4s ease-out; }
.float { animation: float 3s ease-in-out infinite; }

/* ========== 地图页样式 ========== */
#mapPage {
  background: linear-gradient(180deg, #87CEEB 0%, #98FB98 50%, #90EE90 100%);
}

.map-container {
  flex: 1;
  position: relative;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
}

.map-header {
  text-align: center;
  padding: 20px 0 10px;
}

.map-title {
  font-size: 28px;
  font-weight: 800;
  color: #FF6B35;
  text-shadow: 2px 2px 0 #FFF, 4px 4px 8px rgba(0,0,0,0.1);
  margin-bottom: 8px;
}

.map-subtitle {
  font-size: 14px;
  color: #555;
}

/* 地图路径 */
.map-path {
  position: relative;
  max-width: 500px;
  margin: 0 auto;
  padding: 30px 0;
}

/* 阶段节点 */
.stage-node {
  position: relative;
  display: flex;
  align-items: center;
  margin-bottom: 30px;
  cursor: pointer;
  transition: transform 0.3s;
}

.stage-node:active {
  transform: scale(0.98);
}

.stage-node:nth-child(odd) {
  flex-direction: row;
}

.stage-node:nth-child(even) {
  flex-direction: row-reverse;
}

.stage-icon {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  box-shadow: var(--shadow-lg);
  position: relative;
  z-index: 2;
  flex-shrink: 0;
  transition: all 0.3s;
}

.stage-node.locked .stage-icon {
  background: #B0B0B0;
  filter: grayscale(0.5);
}

.stage-node.completed .stage-icon {
  border: 4px solid #FFD700;
}

.stage-info {
  flex: 1;
  background: rgba(255,255,255,0.95);
  border-radius: var(--radius-lg);
  padding: 12px 16px;
  box-shadow: var(--shadow-md);
  margin: 0 15px;
}

.stage-name {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.stage-desc {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.stage-progress {
  display: flex;
  align-items: center;
  gap: 8px;
}

.progress-bar {
  flex: 1;
  height: 8px;
  background: #E0E0E0;
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--success), #7CB342);
  border-radius: 4px;
  transition: width 0.5s ease;
}

.stage-stars {
  font-size: 12px;
  color: #FFD700;
  font-weight: 700;
}

/* 路径连线 */
.stage-node::after {
  content: '';
  position: absolute;
  width: 4px;
  height: 30px;
  background: repeating-linear-gradient(180deg, #FFD700, #FFA500);
  left: 50%;
  bottom: -30px;
  transform: translateX(-50%);
  border-radius: 2px;
}

.stage-node:last-child::after {
  display: none;
}

.stage-node.locked::after {
  background: #CCC;
}

/* 底部导航按钮 */
.map-bottom-nav {
  display: flex;
  justify-content: space-around;
  padding: 12px 16px;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  box-shadow: 0 -4px 16px rgba(0,0,0,0.1);
  flex-shrink: 0;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  padding: 8px 16px;
  border-radius: var(--radius-md);
  transition: all 0.3s;
}

.nav-item:active {
  transform: scale(0.95);
}

.nav-item.active {
  background: rgba(255, 140, 66, 0.2);
}

.nav-icon {
  font-size: 24px;
}

.nav-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
}

.nav-item.active .nav-label {
  color: var(--primary);
}

/* ========== 学习页样式 ========== */
#learnPage {
  background: linear-gradient(180deg, #E8F4FD 0%, #FFF5E6 100%);
}

.learn-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 16px;
  overflow-y: auto;
}

.stage-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 12px;
  flex-shrink: 0;
}

.stage-tab {
  padding: 8px 16px;
  border-radius: 20px;
  background: rgba(255,255,255,0.8);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.3s;
  border: 2px solid transparent;
}

.stage-tab.active {
  background: var(--primary);
  color: white;
  border-color: #FF6B35;
}

.stage-tab.locked {
  opacity: 0.5;
  cursor: not-allowed;
}

/* 拼音卡片区域 */
.card-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 0;
}

.pinyin-card {
  width: 100%;
  max-width: 320px;
  background: white;
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  padding: 30px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.pinyin-card::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,140,66,0.1) 0%, transparent 70%);
  animation: pulse 3s ease-in-out infinite;
}

.pinyin-main {
  font-size: 120px;
  font-weight: 800;
  color: var(--primary);
  line-height: 1.2;
  position: relative;
  z-index: 1;
  text-shadow: 4px 4px 0 rgba(255,140,66,0.2);
}

.pinyin-type {
  display: inline-block;
  padding: 4px 12px;
  background: var(--secondary);
  color: white;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 16px;
}

.pinyin-example {
  margin-top: 20px;
  font-size: 18px;
  color: var(--text-secondary);
}

.example-word {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-primary);
  margin-top: 8px;
}

/* 声调展示 */
.tones-row {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.tone-item {
  width: 50px;
  height: 60px;
  background: linear-gradient(135deg, #FFF5E6, #FFE4CC);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 700;
  color: var(--primary);
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: var(--shadow-sm);
}

.tone-item:active {
  transform: scale(0.9);
}

.tone-item.active {
  background: var(--primary);
  color: white;
  transform: scale(1.1);
}

/* 学习控制区 */
.learn-controls {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 16px;
  flex-shrink: 0;
}

.speak-btn {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--secondary), #3AB0D8);
  border: none;
  color: white;
  font-size: 36px;
  cursor: pointer;
  box-shadow: var(--shadow-lg);
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
}

.speak-btn:active {
  transform: scale(0.9);
}

.speak-btn.recording {
  background: linear-gradient(135deg, var(--danger), #D62828);
  animation: pulse 1s ease-in-out infinite;
}

.nav-buttons {
  display: flex;
  gap: 12px;
}

.nav-buttons .btn {
  flex: 1;
}

/* 互动练习区 */
.practice-area {
  margin-top: 20px;
  padding: 20px;
  background: rgba(255,255,255,0.9);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}

.practice-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 16px;
  text-align: center;
  color: var(--text-primary);
}

.practice-options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.practice-option {
  padding: 16px;
  background: white;
  border: 3px solid #E0E0E0;
  border-radius: var(--radius-md);
  font-size: 32px;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
  color: var(--primary);
}

.practice-option:active {
  transform: scale(0.95);
}

.practice-option.correct {
  border-color: var(--success);
  background: #E8F5E9;
  animation: popIn 0.3s ease-out;
}

.practice-option.wrong {
  border-color: var(--danger);
  background: #FFEBEE;
  animation: shake 0.5s ease-in-out;
}

.feedback-text {
  text-align: center;
  margin-top: 12px;
  font-size: 18px;
  font-weight: 700;
  min-height: 28px;
}

.feedback-text.correct {
  color: var(--success);
}

.feedback-text.wrong {
  color: var(--danger);
}

/* ========== 游戏页样式 ========== */
#gamePage {
  background: linear-gradient(180deg, #FFE4E1 0%, #E8F4FD 100%);
}

.game-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 16px;
  overflow-y: auto;
}

/* 关卡选择 */
.level-select {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  padding: 20px 0;
}

.level-node {
  aspect-ratio: 1;
  background: white;
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--shadow-md);
  transition: all 0.3s;
  position: relative;
}

.level-node:active {
  transform: scale(0.95);
}

.level-node.locked {
  background: #E0E0E0;
  cursor: not-allowed;
}

.level-node.completed {
  background: linear-gradient(135deg, #FFF9C4, #FFEB3B);
}

.level-number {
  font-size: 32px;
  font-weight: 800;
  color: var(--primary);
}

.level-node.locked .level-number {
  color: #999;
}

.level-stars {
  display: flex;
  gap: 2px;
  margin-top: 4px;
  font-size: 14px;
}

.level-stars .star.filled {
  color: #FFD700;
}

.level-stars .star.empty {
  color: #E0E0E0;
}

/* 游戏进行界面 */
.game-play {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.game-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: rgba(255,255,255,0.9);
  border-radius: var(--radius-lg);
  margin-bottom: 16px;
}

.game-score, .game-lives, .game-combo {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 700;
}

.game-score { color: var(--primary); }
.game-lives { color: var(--danger); }
.game-combo { color: var(--purple); }

.question-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.question-text {
  font-size: 20px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 20px;
  text-align: center;
}

.question-pinyin {
  font-size: 80px;
  font-weight: 800;
  color: var(--primary);
  margin-bottom: 30px;
  text-shadow: 3px 3px 0 rgba(255,140,66,0.2);
}

.game-options {
  width: 100%;
  max-width: 400px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

.game-option {
  padding: 24px;
  background: white;
  border: 4px solid #E0E0E0;
  border-radius: var(--radius-lg);
  font-size: 36px;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
  color: var(--primary);
  box-shadow: var(--shadow-sm);
}

.game-option:active {
  transform: scale(0.95);
}

.game-option.correct {
  border-color: var(--success);
  background: #E8F5E9;
}

.game-option.wrong {
  border-color: var(--danger);
  background: #FFEBEE;
}

/* 判断题样式 */
.judge-options {
  display: flex;
  gap: 24px;
  justify-content: center;
}

.judge-btn {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  border: none;
  font-size: 48px;
  cursor: pointer;
  box-shadow: var(--shadow-lg);
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.judge-btn.correct-btn {
  background: linear-gradient(135deg, var(--success), #7CB342);
  color: white;
}

.judge-btn.wrong-btn {
  background: linear-gradient(135deg, var(--danger), #D62828);
  color: white;
}

.judge-btn:active {
  transform: scale(0.9);
}

/* 游戏结算 */
.game-result {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  text-align: center;
}

.result-title {
  font-size: 32px;
  font-weight: 800;
  color: var(--primary);
  margin-bottom: 20px;
}

.result-score {
  font-size: 64px;
  font-weight: 800;
  color: var(--accent);
  text-shadow: 3px 3px 0 rgba(255,215,0,0.3);
  margin-bottom: 16px;
}

.result-stars {
  font-size: 48px;
  margin-bottom: 24px;
}

.result-stats {
  display: flex;
  justify-content: space-around;
  width: 100%;
  max-width: 300px;
  margin-bottom: 30px;
}

.stat-item {
  text-align: center;
}

.stat-value {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-primary);
}

.stat-label {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 4px;
}

.result-actions {
  display: flex;
  gap: 12px;
  width: 100%;
  max-width: 320px;
}

.result-actions .btn {
  flex: 1;
}

/* ========== 成就页样式 ========== */
#achievementPage {
  background: linear-gradient(180deg, #F3E5F5 0%, #E8F4FD 100%);
}

.achievement-container {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
}

.stats-overview {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}

.stat-card {
  background: white;
  border-radius: var(--radius-lg);
  padding: 16px 8px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}

.stat-card .value {
  font-size: 24px;
  font-weight: 800;
  color: var(--primary);
}

.stat-card .label {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 4px;
}

.achievement-section {
  margin-bottom: 24px;
}

.section-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 12px;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.achievement-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.achievement-badge {
  aspect-ratio: 1;
  background: white;
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px;
  box-shadow: var(--shadow-sm);
  text-align: center;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}

.achievement-badge.locked {
  filter: grayscale(1);
  opacity: 0.6;
}

.badge-icon {
  font-size: 40px;
  margin-bottom: 4px;
}

.badge-name {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.2;
}

.badge-rarity {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.badge-rarity.common { background: #9E9E9E; }
.badge-rarity.rare { background: #2196F3; }
.badge-rarity.epic { background: #9C27B0; }
.badge-rarity.legendary { background: #FF9800; }

/* 分享区域 */
.share-section {
  margin-top: 20px;
  padding: 20px;
  background: white;
  border-radius: var(--radius-lg);
  text-align: center;
  box-shadow: var(--shadow-md);
}

.share-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 12px;
  color: var(--text-primary);
}

.share-desc {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 16px;
}

.share-buttons {
  display: flex;
  justify-content: center;
  gap: 16px;
}

.share-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: none;
  font-size: 28px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-md);
  transition: all 0.3s;
}

.share-btn:active {
  transform: scale(0.9);
}

.share-btn.wechat {
  background: #07C160;
  color: white;
}

/* ========== 弹窗样式 ========== */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}

.modal-overlay.active {
  display: flex;
}

.modal-content {
  background: white;
  border-radius: var(--radius-xl);
  padding: 24px;
  max-width: 360px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  animation: popIn 0.3s ease-out;
}

.modal-title {
  font-size: 20px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 16px;
  color: var(--text-primary);
}

.modal-body {
  margin-bottom: 20px;
}

.modal-actions {
  display: flex;
  gap: 12px;
}

.modal-actions .btn {
  flex: 1;
}

/* 成就解锁弹窗 */
.achievement-unlock {
  text-align: center;
  padding: 20px;
}

.unlock-icon {
  font-size: 80px;
  margin-bottom: 16px;
  animation: bounce 1s ease-in-out;
}

.unlock-title {
  font-size: 24px;
  font-weight: 800;
  color: var(--primary);
  margin-bottom: 8px;
}

.unlock-name {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.unlock-desc {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 20px;
}

/* 粒子效果容器 */
.particles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 999;
}

.particle {
  position: absolute;
  font-size: 24px;
  animation: floatUp 2s ease-out forwards;
}

@keyframes floatUp {
  0% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  100% {
    opacity: 0;
    transform: translateY(-200px) scale(0.5);
  }
}

/* ========== 响应式适配 ========== */
@media (min-width: 768px) {
  .pinyin-main {
    font-size: 150px;
  }
  
  .pinyin-card {
    max-width: 400px;
    padding: 40px;
  }
  
  .question-pinyin {
    font-size: 100px;
  }
  
  .map-path {
    max-width: 600px;
  }
  
  .stage-icon {
    width: 100px;
    height: 100px;
    font-size: 44px;
  }
}

@media (max-height: 600px) {
  .pinyin-main {
    font-size: 80px;
  }
  
  .pinyin-card {
    padding: 20px;
  }
  
  .question-pinyin {
    font-size: 60px;
  }
  
  .speak-btn {
    width: 64px;
    height: 64px;
    font-size: 28px;
  }
}

/* 滚动条美化 */
::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: rgba(0,0,0,0.2);
  border-radius: 3px;
}
</style>

// ==================== 状态管理 ====================

let userData = {
  totalStars: 0,
  studyDays: 1,
  lastStudyDate: new Date().toDateString(),
  stages: {},
  achievements: [],
  maxCombo: 0,
  totalCorrect: 0,
  totalWrong: 0
};

// 初始化各阶段状态
function initStageData() {
  Object.keys(pinyinData).forEach((stageId, index) => {
    if (!userData.stages[stageId]) {
      userData.stages[stageId] = {
        unlocked: index === 0,
        completed: false,
        progress: 0,
        levels: {}
      };
    }
    const levels = levelData[stageId] || [];
    levels.forEach((level, idx) => {
      if (!userData.stages[stageId].levels[level.id]) {
        userData.stages[stageId].levels[level.id] = {
          unlocked: idx === 0,
          stars: 0,
          bestScore: 0,
          attempts: 0
        };
      }
    });
  });
}

// 保存数据
function saveData() {
  localStorage.setItem('pinyin_app_data', JSON.stringify(userData));
}

// 加载数据
function loadData() {
  const saved = localStorage.getItem('pinyin_app_data');
  if (saved) {
    try {
      userData = JSON.parse(saved);
    } catch(e) {
      console.error('加载数据失败', e);
    }
  }
  initStageData();
  
  // 更新学习天数
  const today = new Date().toDateString();
  if (userData.lastStudyDate !== today) {
    userData.studyDays++;
    userData.lastStudyDate = today;
    saveData();
  }
}

// 解锁成就
function unlockAchievement(id) {
  if (userData.achievements.includes(id)) return;
  
  userData.achievements.push(id);
  saveData();
  
  // 显示成就弹窗
  const allBadges = [...achievementData.progress, ...achievementData.skill];
  const badge = allBadges.find(b => b.id === id);
  if (badge) {
    showAchievementUnlock(badge);
    createParticles();
  }
}

// 检查成就
function checkAchievements() {
  // 首次学习
  if (userData.totalCorrect > 0) {
    unlockAchievement('first_lesson');
  }
  
  // 各阶段通关
  const stages = ['stage1', 'stage2', 'stage3', 'stage4'];
  const badges = ['stage1_clear', 'stage2_clear', 'stage3_clear', 'stage4_clear'];
  stages.forEach((stageId, idx) => {
    const levels = levelData[stageId] || [];
    const allCompleted = levels.every(l => userData.stages[stageId]?.levels[l.id]?.stars > 0);
    if (allCompleted && levels.length > 0) {
      unlockAchievement(badges[idx]);
    }
  });
  
  // 全部通关
  const allStagesClear = Object.keys(pinyinData).every(stageId => {
    const levels = levelData[stageId] || [];
    if (levels.length === 0) return true;
    return levels.every(l => userData.stages[stageId]?.levels[l.id]?.stars > 0);
  });
  if (allStagesClear) {
    unlockAchievement('all_clear');
  }
  
  // 完美表现
  let hasPerfect = false;
  Object.keys(userData.stages).forEach(stageId => {
    const levels = userData.stages[stageId].levels;
    Object.keys(levels).forEach(levelId => {
      if (levels[levelId].stars === 3) hasPerfect = true;
    });
  });
  if (hasPerfect) unlockAchievement('perfect_level');
  
  // 连击
  if (userData.maxCombo >= 5) unlockAchievement('combo_5');
  if (userData.maxCombo >= 10) unlockAchievement('combo_10');
}

// ==================== 语音服务 ====================

let speechSynthesis = window.speechSynthesis;
let chineseVoice = null;

function initSpeech() {
  if (!speechSynthesis) {
    console.warn('浏览器不支持语音合成');
    return;
  }
  
  function loadVoices() {
    const voices = speechSynthesis.getVoices();
    chineseVoice = voices.find(v => v.lang.includes('zh')) || voices[0];
  }
  
  loadVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }
}

function speak(text, rate = 0.8) {
  if (!speechSynthesis) return;
  
  speechSynthesis.cancel();
  
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'zh-CN';
  utterance.rate = rate;
  utterance.pitch = 1.1;
  if (chineseVoice) utterance.voice = chineseVoice;
  
  speechSynthesis.speak(utterance);
}

// ==================== 导航 ====================

let currentPage = 'map';
let currentStage = 'stage1';
let currentPinyinIndex = 0;

function navigateTo(page, params = {}) {
  // 隐藏所有页面
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  
  // 更新底部导航
  document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
  
  currentPage = page;
  
  switch(page) {
    case 'map':
      document.getElementById('mapPage').classList.add('active');
      document.querySelectorAll('.nav-item')[0].classList.add('active');
      renderMap();
      break;
    case 'learn':
      document.getElementById('learnPage').classList.add('active');
      document.querySelectorAll('.nav-item')[1].classList.add('active');
      initLearnPage();
      break;
    case 'game':
      document.getElementById('gamePage').classList.add('active');
      document.querySelectorAll('.nav-item')[2].classList.add('active');
      showLevelSelect();
      break;
    case 'achievement':
      document.getElementById('achievementPage').classList.add('active');
      document.querySelectorAll('.nav-item')[3].classList.add('active');
      renderAchievements();
      break;
  }
  
  window.scrollTo(0, 0);
}

// ==================== 地图页 ====================

function renderMap() {
  const mapPath = document.getElementById('mapPath');
  mapPath.innerHTML = '';
  
  let totalStars = 0;
  
  Object.values(userData.stages).forEach(stage => {
    Object.values(stage.levels).forEach(level => {
      totalStars += level.stars || 0;
    });
  });
  userData.totalStars = totalStars;
  document.getElementById('totalStars').textContent = totalStars;
  
  Object.keys(pinyinData).forEach((stageId, index) => {
    const stage = pinyinData[stageId];
    const userStage = userData.stages[stageId];
    const levels = levelData[stageId] || [];
    
    let stageStars = 0;
    let totalPossibleStars = levels.length * 3;
    Object.values(userStage.levels).forEach(l => { stageStars += l.stars || 0; });
    
    const progress = totalPossibleStars > 0 ? (stageStars / totalPossibleStars * 100) : 0;
    
    const node = document.createElement('div');
    node.className = `stage-node fade-in ${userStage.unlocked ? '' : 'locked'} ${userStage.completed ? 'completed' : ''}`;
    node.style.animationDelay = `${index * 0.1}s`;
    
    node.innerHTML = `
      <div class="stage-icon" style="background: linear-gradient(135deg, ${stage.color}, ${adjustColor(stage.color, -20)})">
        ${userStage.unlocked ? stage.icon : '🔒'}
      </div>
      <div class="stage-info">
        <div class="stage-name">${stage.name}</div>
        <div class="stage-desc">${stage.description}</div>
        <div class="stage-progress">
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${progress}%"></div>
          </div>
          <div class="stage-stars">⭐${stageStars}/${totalPossibleStars || 0}</div>
        </div>
      </div>
    `;
    
    if (userStage.unlocked) {
      node.onclick = () => openStageModal(stageId);
    }
    
    mapPath.appendChild(node);
  });
}

function adjustColor(color, amount) {
  const hex = color.replace('#', '');
  const r = Math.max(0, Math.min(255, parseInt(hex.substr(0, 2), 16) + amount));
  const g = Math.max(0, Math.min(255, parseInt(hex.substr(2, 2), 16) + amount));
  const b = Math.max(0, Math.min(255, parseInt(hex.substr(4, 2), 16) + amount));
  return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
}

function renderStageTabs() {

function renderPinyinCard() {
  const stage = pinyinData[currentStage];
  const item = stage.items[currentPinyinIndex];
  
  document.getElementById('pinyinType').textContent = item.type;
  document.getElementById('pinyinMain').textContent = item.pinyin;
  document.getElementById('exampleWord').textContent = item.example;
  
  // 声调
  const tonesRow = document.getElementById('tonesRow');
  tonesRow.innerHTML = '';
  
  if (item.tones) {
    item.tones.forEach((tone, idx) => {
      const toneItem = document.createElement('div');
      toneItem.className = 'tone-item';
      toneItem.textContent = tone;
      toneItem.onclick = () => {
        document.querySelectorAll('.tone-item').forEach(t => t.classList.remove('active'));
        toneItem.classList.add('active');
        speak(tone);
      };
      tonesRow.appendChild(toneItem);
    });
  } else if (item.syllables) {
    item.syllables.forEach(syl => {

      toneItem.className = 'tone-item';
      toneItem.textContent = syl;
      toneItem.style.width = 'auto';
      toneItem.style.padding = '0 12px';
      toneItem.onclick = () => {
        document.querySelectorAll('.tone-item').forEach(t => t.classList.remove('active'));
        toneItem.classList.add('active');
        speak(syl);
      };

    });

  card.classList.remove('fade-in');
  void card.offsetWidth;
  card.classList.add('fade-in');
}

function renderPractice() {
  const stage = pinyinData[currentStage];
  const item = stage.items[currentPinyinIndex];
  const feedback = document.getElementById('practiceFeedback');
  feedback.textContent = '';
  feedback.className = 'feedback-text';
  
  const optionsContainer = document.getElementById('practiceOptions');
  optionsContainer.innerHTML = '';
  
  // 生成干扰项
  const allItems = stage.items.map(i => i.pinyin);
  const correctAnswer = item.pinyin;
  let wrongOptions = allItems.filter(p => p !== correctAnswer);
  wrongOptions = shuffleArray(wrongOptions).slice(0, 3);
  const options = shuffleArray([correctAnswer, ...wrongOptions]);
  
  options.forEach(opt => {
    const optionEl = document.createElement('div');
    optionEl.className = 'practice-option';
    optionEl.textContent = opt;
    optionEl.onclick = () => checkPracticeAnswer(opt, correctAnswer, optionEl);
    optionsContainer.appendChild(optionEl);
  });
}

function checkPracticeAnswer(selected, correct, element) {
  const feedback = document.getElementById('practiceFeedback');
  const allOptions = document.querySelectorAll('.practice-option');
  
  allOptions.forEach(opt => opt.style.pointerEvents = 'none');
  
  if (selected === correct) {
    element.classList.add('correct');
    feedback.textContent = '🎉 答对了！真棒！';
    feedback.classList.add('correct');
    userData.totalCorrect++;
    createParticles();
    
    // 解锁下一阶段检查
    checkStageProgress();
  } else {
    element.classList.add('wrong');
    feedback.textContent = '😅 再试一次吧';
    feedback.classList.add('wrong');
    userData.totalWrong++;
    
    // 显示正确答案
    allOptions.forEach(opt => {
      if (opt.textContent === correct) {
        setTimeout(() => opt.classList.add('correct'), 500);
      }
    });
  }
  
  saveData();
  checkAchievements();
  
  // 1.5秒后重置
  setTimeout(() => {
    allOptions.forEach(opt => {
      opt.classList.remove('correct', 'wrong');
      opt.style.pointerEvents = 'auto';
    });
    feedback.textContent = '';
    feedback.className = 'feedback-text';
  }, 1500);
}

function speakCurrentPinyin() {
  const stage = pinyinData[currentStage];
  const item = stage.items[currentPinyinIndex];
  speak(item.pinyin);
}

function prevPinyin() {
  const stage = pinyinData[currentStage];
  if (currentPinyinIndex > 0) {
    currentPinyinIndex--;
    renderPinyinCard();
  }
}

function nextPinyin() {
  const stage = pinyinData[currentStage];
  if (currentPinyinIndex < stage.items.length - 1) {
    currentPinyinIndex++;
    renderPinyinCard();
  } else {
    // 完成当前阶段学习
    const stageKeys = Object.keys(pinyinData);
    const currentIndex = stageKeys.indexOf(currentStage);
    if (currentIndex < stageKeys.length - 1) {
      const nextStageId = stageKeys[currentIndex + 1];
      userData.stages[nextStageId].unlocked = true;
      saveData();
      showModal(`
        <div class="achievement-unlock">
          <div class="unlock-icon">🎊</div>
          <div class="unlock-title">恭喜完成！</div>
          <div class="unlock-name">${stage.name}</div>
          <div class="unlock-desc">你已经学完了这个阶段的所有内容！<br>下一阶段已解锁</div>
          <button class="btn btn-primary btn-large" onclick="closeModal()">太棒了！</button>
        </div>
      `);
    } else {
      showModal(`
        <div class="achievement-unlock">
          <div class="unlock-icon">👑</div>
          <div class="unlock-title">太厉害了！</div>
          <div class="unlock-name">全部学完！</div>
          <div class="unlock-desc">你已经学完了所有拼音内容！<br>去挑战模式巩固一下吧！</div>
          <button class="btn btn-primary btn-large" onclick="closeModal()">好的！</button>

function checkStageProgress() {
  // 简单的进度更新
  const stage = pinyinData[currentStage];
  const userStage = userData.stages[currentStage];
  const progress = Math.min(100, ((currentPinyinIndex + 1) / stage.items.length) * 100);
  userStage.progress = progress;
  if (progress >= 100) userStage.completed = true;
  saveData();
}

let currentGameStage = 'stage1';
let currentLevelId = null;
let currentQuestionIndex = 0;
let gameScore = 0;
let gameLives = 3;
let gameCombo = 0;
let gameMaxCombo = 0;
let gameCorrect = 0;
let gameWrong = 0;
let currentQuestions = [];

function startLearning(stageId) {

  navigateTo('learn');
}

function showLevelSelect() {

function startGameLevel(stageId, levelId) {
  closeModal();
  currentGameStage = stageId;
  currentLevelId = levelId;
  currentQuestionIndex = 0;
  gameScore = 0;
  gameLives = 3;
  gameCombo = 0;
  gameMaxCombo = 0;
  gameCorrect = 0;
  gameWrong = 0;
  
  // 获取关卡题目
  const stageLevels = levelData[stageId];
  const level = stageLevels.find(l => l.id === levelId);
  currentQuestions = shuffleArray([...level.questions]);
  
  document.getElementById('levelSelectView').style.display = 'none';
  document.getElementById('gamePlayView').style.display = 'flex';
  document.getElementById('gameResultView').style.display = 'none';
  
  updateGameUI();
  showQuestion();
}

function updateGameUI() {
  document.getElementById('gameScore').textContent = gameScore;
  document.getElementById('gameCombo').textContent = gameCombo;
  
  let hearts = '';
  for (let i = 0; i < gameLives; i++) hearts += '❤️';
  for (let i = gameLives; i < 3; i++) hearts += '🖤';
  document.getElementById('gameLives').textContent = hearts;
}

function showQuestion() {
  if (currentQuestionIndex >= currentQuestions.length) {
    endGame();
    return;
  }
  
  const question = currentQuestions[currentQuestionIndex];
  const questionText = document.getElementById('questionText');
  const questionPinyin = document.getElementById('questionPinyin');
  const optionsContainer = document.getElementById('gameOptionsContainer');
  
  if (question.type === 'listen-select') {
    questionText.textContent = '🔊 听一听，选择正确的拼音';
    questionPinyin.textContent = '?';
    questionPinyin.style.cursor = 'pointer';
    questionPinyin.onclick = () => speak(question.audio);
    
    // 自动播放
    setTimeout(() => speak(question.audio), 500);
    
    optionsContainer.innerHTML = '<div class="game-options" id="gameOptions"></div>';
    const optionsEl = document.getElementById('gameOptions');
    
    question.options.forEach(opt => {
      const optEl = document.createElement('div');
      optEl.className = 'game-option';
      optEl.textContent = opt;
      optEl.onclick = () => checkGameAnswer(opt, question.answer, optEl);
      optionsEl.appendChild(optEl);
    });
    
  } else if (question.type === 'tone-match') {
    questionText.textContent = `选择第 ${question.tone} 声的 ${question.pinyin}`;
    questionPinyin.textContent = question.pinyin;
    questionPinyin.onclick = null;
    questionPinyin.style.cursor = 'default';
    
    optionsContainer.innerHTML = '<div class="game-options" id="gameOptions"></div>';
    const optionsEl = document.getElementById('gameOptions');
    
    question.options.forEach(opt => {
      const optEl = document.createElement('div');
      optEl.className = 'game-option';
      optEl.textContent = opt;
      optEl.onclick = () => checkGameAnswer(opt, question.answer, optEl);
      optionsEl.appendChild(optEl);
    });
    
  } else if (question.type === 'judge') {
    questionText.textContent = question.desc || '判断这个拼音对吗？';
    questionPinyin.textContent = question.show;
    questionPinyin.onclick = () => speak(question.show);
    questionPinyin.style.cursor = 'pointer';
    
    // 播放发音
    setTimeout(() => speak(question.show), 500);
    
    optionsContainer.innerHTML = `
      <div class="judge-options">
        <button class="judge-btn correct-btn" onclick="checkGameAnswer(true, ${question.answer}, this, 'correct')">✓</button>
        <button class="judge-btn wrong-btn" onclick="checkGameAnswer(false, ${question.answer}, this, 'wrong')">✗</button>
      </div>
    `;
  }
  
  // 动画
  questionPinyin.classList.remove('pop-in');
  void questionPinyin.offsetWidth;
  questionPinyin.classList.add('pop-in');
}

function checkGameAnswer(selected, correct, element, type = '') {
  const allOptions = document.querySelectorAll('.game-option, .judge-btn');
  allOptions.forEach(opt => opt.style.pointerEvents = 'none');
  
  const isCorrect = selected === correct;
  
  if (isCorrect) {
    element.classList.add('correct');
    gameCombo++;
    gameMaxCombo = Math.max(gameMaxCombo, gameCombo);
    gameCorrect++;
    
    // 计分：基础分 + 连击加成
    const baseScore = 100;
    const comboBonus = Math.min(gameCombo * 10, 50);
    gameScore += baseScore + comboBonus;
    
    createParticles();
    speak('对了');
  } else {
    element.classList.add('wrong');
    gameCombo = 0;
    gameWrong++;
    gameLives--;
    
    // 显示正确答案
    if (type === '') {
      allOptions.forEach(opt => {
        if (opt.textContent === correct) {
          setTimeout(() => opt.classList.add('correct'), 300);
        }
      });
    }
    
    speak('错了');
  }
  
  updateGameUI();
  
  setTimeout(() => {
    if (gameLives <= 0) {
      endGame();
    } else {
      currentQuestionIndex++;
      showQuestion();
    }
  }, 1500);
}

function endGame() {
  document.getElementById('gamePlayView').style.display = 'none';
  document.getElementById('gameResultView').style.display = 'flex';
  
  // 计算星级
  const totalQuestions = currentQuestions.length;
  const accuracy = gameCorrect / totalQuestions;
  let stars = 0;
  if (accuracy >= 0.9) stars = 3;
  else if (accuracy >= 0.7) stars = 2;
  else if (accuracy >= 0.5) stars = 1;
  
  // 保存成绩
  if (currentLevelId && userData.stages[currentGameStage]?.levels[currentLevelId]) {
    const levelData = userData.stages[currentGameStage].levels[currentLevelId];
    levelData.attempts++;
    if (stars > levelData.stars) levelData.stars = stars;
    if (gameScore > levelData.bestScore) levelData.bestScore = gameScore;
    
    // 解锁下一关
    const stageLevels = levelData[currentGameStage] || [];
    const currentIdx = stageLevels.findIndex(l => l.id === currentLevelId);
    if (currentIdx >= 0 && currentIdx < stageLevels.length - 1 && stars > 0) {
      const nextLevelId = stageLevels[currentIdx + 1].id;
      userData.stages[currentGameStage].levels[nextLevelId].unlocked = true;
    }
    
    // 检查是否解锁下一阶段
    const allLevels = levelData[currentGameStage] || [];
    const allPassed = allLevels.every(l => userData.stages[currentGameStage].levels[l.id]?.stars > 0);
    if (allPassed) {
      userData.stages[currentGameStage].completed = true;
      const stageKeys = Object.keys(pinyinData);
      const currentStageIdx = stageKeys.indexOf(currentGameStage);
      if (currentStageIdx < stageKeys.length - 1) {
        userData.stages[stageKeys[currentStageIdx + 1]].unlocked = true;
      }
    }
  }
  
  // 更新最大连击
  if (gameMaxCombo > userData.maxCombo) {
    userData.maxCombo = gameMaxCombo;
  }
  
  saveData();
  checkAchievements();
  
  // 显示结果
  document.getElementById('resultTitle').textContent = stars > 0 ? '🎉 挑战成功！' : '💪 继续加油！';
  document.getElementById('resultScore').textContent = gameScore;
  
  let starsHtml = '';
  for (let i = 0; i < 3; i++) {
    starsHtml += i < stars ? '⭐' : '☆';
  }
  document.getElementById('resultStars').textContent = starsHtml;
  
  document.getElementById('resultCorrect').textContent = gameCorrect;
  document.getElementById('resultWrong').textContent = gameWrong;
  document.getElementById('resultMaxCombo').textContent = gameMaxCombo;
  
  if (stars > 0) {
    createParticles();
  }
}

function restartLevel() {
  startGameLevel(currentGameStage, currentLevelId);
}

            <div style="font-size:28px;font-weight:800">${userData.studyDays}</div>
            <div style="font-size:12px;opacity:0.9">学习天数</div>
          </div>
          <div>
            <div style="font-size:28px;font-weight:800">${userData.totalStars}</div>
            <div style="font-size:12px;opacity:0.9">星星数</div>
          </div>
          <div>
            <div style="font-size:28px;font-weight:800">${userData.achievements.length}</div>
            <div style="font-size:12px;opacity:0.9">成就数</div>
          </div>
        </div>
      </div>
      <div style="font-size:14px;color:var(--text-secondary);margin-bottom:16px;padding:0 20px">
        ${shareText}
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
        <button class="btn btn-primary" onclick="copyShareText()">复制文案</button>
      </div>
    </div>
  `);
}

function copyShareText() {
  const shareText = `我在拼音小乐园已经学习了 ${userData.studyDays} 天，收集了 ${userData.totalStars} 颗星星，获得了 ${userData.achievements.length} 个成就！快来和我一起学拼音吧！`;
  
  if (navigator.clipboard) {
    navigator.clipboard.writeText(shareText).then(() => {
      alert('文案已复制，快去分享吧！');
    });
  } else {
    alert(shareText);
  }
}

// ==================== 弹窗控制 ====================

function showModal(content) {
  document.getElementById('modalContent').innerHTML = content;
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ==================== 粒子效果 ====================

function createParticles() {
  const container = document.getElementById('particles');
  const emojis = ['⭐', '✨', '🎉', '💫', '🌟'];
  
  for (let i = 0; i < 15; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    particle.style.left = Math.random() * 100 + '%';
    particle.style.top = '50%';
    particle.style.animationDelay = Math.random() * 0.5 + 's';
    particle.style.fontSize = (16 + Math.random() * 16) + 'px';
    container.appendChild(particle);
    
    setTimeout(() => particle.remove(), 2500);
  }
}

// ==================== 工具函数 ====================

function shuffleArray(array) {
  const newArray = [...array];
  for (let i = newArray.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
  }
  return newArray;
}

// ==================== 初始化 ====================

document.addEventListener('DOMContentLoaded', function() {
  loadData();
  initSpeech();
  renderMap();
});

// 阻止双击缩放
document.addEventListener('gesturestart', function(e) {
  e.preventDefault();
});

let lastTouchEnd = 0;
document.addEventListener('touchend', function(e) {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) {
    e.preventDefault();
  }
  lastTouchEnd = now;
}, false);
</script>
