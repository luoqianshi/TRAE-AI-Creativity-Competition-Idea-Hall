<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作文档 - 季度数据汇总</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif; }

  /* ============ 通用 ============ */
  #app { height: 100vh; position: relative; }
  .hidden { display: none !important; }

  /* ============ 顶栏（伪装标题） ============ */
  .titlebar {
    height: 32px; display: flex; align-items: center; padding: 0 12px;
    font-size: 12px; color: #fff; user-select: none; flex-shrink: 0;
    -webkit-app-region: drag;
  }
  .titlebar .tb-title { flex: 1; text-align: center; opacity: 0.95; }
  .titlebar .tb-btns { display: flex; gap: 8px; }
  .titlebar .tb-btns span {
    width: 16px; height: 16px; border-radius: 50%; display: inline-block;
    line-height: 16px; text-align: center; font-size: 10px; cursor: pointer;
  }

  /* Excel 皮肤 */
  .skin-excel .titlebar { background: #107c41; }
  .skin-excel .tb-btns span:nth-child(1) { background:#fbbf24; }
  .skin-excel .tb-btns span:nth-child(2) { background:#34d399; }
  .skin-excel .tb-btns span:nth-child(3) { background:#f87171; }

  /* Code 皮肤 */
  .skin-code .titlebar { background: #1e1e2e; color: #cdd6f4; }
  .skin-code .tb-btns span:nth-child(1) { background:#fbbf24; }
  .skin-code .tb-btns span:nth-child(2) { background:#34d399; }
  .skin-code .tb-btns span:nth-child(3) { background:#f87171; }

  /* Word 皮肤 */
  .skin-word .titlebar { background: #2b579a; }
  .skin-word .tb-btns span:nth-child(1) { background:#fbbf24; }
  .skin-word .tb-btns span:nth-child(2) { background:#34d399; }
  .skin-word .tb-btns span:nth-child(3) { background:#f87171; }

  /* ============ 工具栏 ============ */
  .toolbar { height: 36px; display: flex; align-items: center; padding: 0 12px; gap: 6px; font-size: 12px; flex-shrink: 0; border-bottom: 1px solid #ddd; }
  .skin-excel .toolbar { background: #f3f3f3; color: #333; }
  .skin-code .toolbar { background: #181825; color: #cdd6f4; border-bottom: 1px solid #313244; }
  .skin-word .toolbar { background: #f3f3f3; color: #333; }
  .toolbar .tb-item { padding: 3px 8px; border-radius: 3px; cursor: pointer; }
  .toolbar .tb-item:hover { background: rgba(0,0,0,0.08); }
  .skin-code .toolbar .tb-item:hover { background: rgba(255,255,255,0.1); }

  /* ============ 内容区 ============ */
  .content { flex: 1; overflow: auto; position: relative; outline: none; }
  .skin-excel .content { background: #fff; }
  .skin-code .content { background: #1e1e2e; color: #cdd6f4; }
  .skin-word .content { background: #e6e6e6; }

  /* ============ Excel 伪装 ============ */
  .excel-grid { font-family: 'Calibri', 'Microsoft YaHei'; font-size: 13px; }
  .excel-grid .col-head, .excel-grid .row-head { position: sticky; background: #f3f3f3; color: #888; text-align: center; font-size: 11px; border: 1px solid #d4d4d4; }
  .excel-grid .cell { border: 1px solid #d4d4d4; padding: 2px 6px; min-height: 22px; line-height: 20px; white-space: nowrap; overflow: hidden; }
  .excel-grid .row-head { min-width: 40px; text-align: center; }
  .excel-table { border-collapse: collapse; width: 100%; }
  .excel-table td { border: 1px solid #d4d4d4; padding: 2px 6px; font-size: 13px; vertical-align: top; }

  /* ============ Code 伪装 ============ */
  .code-area { font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; line-height: 1.7; padding: 16px 20px; white-space: pre-wrap; }
  .code-area .ln { color: #585b70; user-select: none; margin-right: 14px; }
  .code-area .kw { color: #cba6f7; }
  .code-area .str { color: #a6e3a1; }
  .code-area .num { color: #fab387; }
  .code-area .comment { color: #6c7086; }
  .code-area .fn { color: #89b4fa; }

  /* ============ Word 伪装 ============ */
  .word-page { background: #fff; max-width: 820px; margin: 24px auto; padding: 48px 56px; min-height: 90%; box-shadow: 0 1px 4px rgba(0,0,0,0.12); font-family: 'Calibri', 'Microsoft YaHei'; font-size: 14px; line-height: 1.8; color: #333; }
  .word-page h1 { font-size: 22px; color: #2b579a; margin-bottom: 16px; }
  .word-page h2 { font-size: 16px; color: #2b579a; margin: 18px 0 8px; }
  .word-page p { margin-bottom: 12px; text-indent: 2em; }

  /* ============ 小说文字（伪装态） ============ */
  .novel-text { transition: all 0.25s ease; }
  /* stealth: 小字浅色嵌入 */
  .mode-stealth .novel-text { font-size: 12px !important; color: #999 !important; opacity: 0.85; }
  .mode-stealth.skin-code .novel-text { color: #6c7086 !important; }
  .mode-stealth.skin-excel .novel-text { color: #888 !important; font-size: 12px !important; }
  /* boss: 完全隐藏 */
  .mode-boss .novel-text { font-size: 0 !important; color: transparent !important; opacity: 0; height: 0; overflow: hidden; }
  /* immersive: 大字纯净 */
  .mode-immersive .content { background: #f7f6f3 !important; }
  .mode-immersive .novel-text {
    font-size: var(--read-size, 19px) !important; color: #2b2b2b !important;
    line-height: 2.1 !important; opacity: 1 !important; font-family: 'Microsoft YaHei', serif !important;
  }
  .mode-immersive .excel-grid, .mode-immersive .code-area, .mode-immersive .word-page { background: transparent !important; box-shadow: none !important; padding: 24px 32px !important; max-width: 100% !important; margin: 0 !important; }
  .mode-immersive .excel-table, .mode-immersive .code-area { display: none; }
  .mode-immersive .stealth-only { display: none !important; }
  .mode-immersive .immersive-only { display: block !important; }

  /* 沉浸阅读专用容器 */
  .immersive-view { display: none; max-width: 720px; margin: 0 auto; padding: 40px 32px; }
  .mode-immersive .immersive-view { display: block; }
  .immersive-view .iv-title { font-size: 22px; font-weight: bold; color: #1a1a1a; margin-bottom: 6px; text-align: center; }
  .immersive-view .iv-meta { font-size: 12px; color: #aaa; text-align: center; margin-bottom: 28px; }
  .immersive-view .iv-body p { margin-bottom: 1.2em; text-indent: 2em; }

  /* ============ 浮动控制条 ============ */
  .control-dock {
    position: fixed; right: 16px; bottom: 16px; z-index: 999;
    display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
    opacity: 0; transition: opacity 0.2s;
  }
  .control-dock:hover, .control-dock.show { opacity: 1; }
  .dock-btn {
    width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(30,30,30,0.85); color: #fff; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3); transition: transform 0.15s;
    backdrop-filter: blur(6px);
  }
  .dock-btn:hover { transform: scale(1.1); background: rgba(59,108,255,0.9); }
  .dock-btn.active { background: #3b6cff; }
  .dock-label { background: rgba(30,30,30,0.85); color:#fff; font-size:11px; padding:3px 8px; border-radius:4px; backdrop-filter: blur(6px); }

  /* 设置面板 */
  .settings-panel {
    position: fixed; right: 64px; bottom: 16px; z-index: 999;
    background: rgba(255,255,255,0.97); border-radius: 10px; padding: 16px 18px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.18); width: 240px; font-size: 13px; color: #333;
    backdrop-filter: blur(8px); display: none;
  }
  .settings-panel.show { display: block; }
  .settings-panel h4 { font-size: 13px; margin-bottom: 10px; color: #1a1a1a; }
  .settings-panel .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .settings-panel .skin-btns { display: flex; gap: 6px; }
  .settings-panel .skin-btn { padding: 4px 10px; border-radius: 4px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: 12px; }
  .settings-panel .skin-btn.active { background: #3b6cff; color: #fff; border-color: #3b6cff; }
  .settings-panel input[type=range] { width: 110px; }
  .settings-panel .kbd-hint { font-size: 11px; color: #888; line-height: 1.8; margin-top: 8px; border-top: 1px solid #eee; padding-top: 8px; }
  .settings-panel .kbd { background: #f0f0f0; border: 1px solid #ddd; border-radius: 3px; padding: 1px 5px; font-size: 11px; font-family: monospace; }

  /* 状态指示 */
  .mode-badge {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    background: rgba(0,0,0,0.8); color: #fff; padding: 14px 28px; border-radius: 8px;
    font-size: 16px; z-index: 9999; pointer-events: none; opacity: 0; transition: opacity 0.3s;
  }
  .mode-badge.show { opacity: 1; }

  /* 自动滚动指示 */
  .auto-scroll-bar { position: fixed; right: 0; top: 0; width: 3px; height: 100%; background: transparent; z-index: 998; }
  .auto-scroll-bar .progress { width: 100%; background: #3b6cff; transition: height 0.2s; }

  /* 滚动条美化 */
  .content::-webkit-scrollbar { width: 8px; }
  .content::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 4px; }
  .skin-code .content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>
<div id="app" class="skin-excel mode-stealth">

  <!-- 顶栏 -->
  <div class="titlebar">
    <div class="tb-title" id="tb-title">季度数据汇总.xlsx - Excel</div>
    <div class="tb-btns"><span>—</span><span>□</span><span>×</span></div>
  </div>

  <!-- 工具栏 -->
  <div class="toolbar stealth-only">
    <span class="tb-item" id="tb-file">文件</span>
    <span class="tb-item">开始</span>
    <span class="tb-item">插入</span>
    <span class="tb-item">页面布局</span>
    <span class="tb-item">公式</span>
    <span class="tb-item">数据</span>
    <span class="tb-item">审阅</span>
    <span class="tb-item">视图</span>
    <span style="flex:1"></span>
    <span class="tb-item" id="skin-quick" title="切换皮肤">🎨</span>
  </div>

  <!-- 内容区 -->
  <div class="content" id="content">

    <!-- Excel 伪装视图 -->
    <div class="excel-view stealth-only">
      <table class="excel-table" id="excel-table"></table>
    </div>

    <!-- Code 伪装视图 -->
    <div class="code-view stealth-only">
      <div class="code-area" id="code-area"></div>
    </div>

    <!-- Word 伪装视图 -->
    <div class="word-view stealth-only">
      <div class="word-page" id="word-page"></div>
    </div>

    <!-- 沉浸阅读视图 -->
    <div class="immersive-view immersive-only" id="immersive-view">
      <div class="iv-title" id="iv-title"></div>
      <div class="iv-meta" id="iv-meta"></div>
      <div class="iv-body" id="iv-body"></div>
    </div>

  </div>

  <!-- 自动滚动进度条 -->
  <div class="auto-scroll-bar"><div class="progress" id="scroll-progress" style="height:0%"></div></div>

  <!-- 浮动控制 -->
  <div class="control-dock" id="dock">
    <button class="dock-btn" id="btn-mode" title="切换模式 (F)">📖</button>
    <button class="dock-btn" id="btn-boss" title="老板键 (ESC)">🛡️</button>
    <button class="dock-btn" id="btn-auto" title="自动滚动 (空格)">⏯</button>
    <button class="dock-btn" id="btn-prev" title="上一章 (←)">⏮</button>
    <button class="dock-btn" id="btn-next" title="下一章 (→)">⏭</button>
    <button class="dock-btn" id="btn-settings" title="设置">⚙️</button>
  </div>

  <!-- 设置面板 -->
  <div class="settings-panel" id="settings">
    <h4>摸鱼设置</h4>
    <div class="row">
      <span>伪装皮肤</span>
      <div class="skin-btns">
        <button class="skin-btn active" data-skin="excel">表格</button>
        <button class="skin-btn" data-skin="code">代码</button>
        <button class="skin-btn" data-skin="word">文档</button>
      </div>
    </div>
    <div class="row">
      <span>阅读字号</span>
      <input type="range" id="font-size" min="15" max="26" value="19">
      <span id="font-size-val">19px</span>
    </div>
    <div class="row">
      <span>滚动速度</span>
      <input type="range" id="scroll-speed" min="1" max="10" value="4">
      <span id="scroll-speed-val">4</span>
    </div>
    <div class="kbd-hint">
      <span class="kbd">ESC</span> 老板键 · <span class="kbd">F</span> 沉浸阅读<br>
      <span class="kbd">空格</span> 自动滚动 · <span class="kbd">←/→</span> 翻章<br>
      <span class="kbd">[ / ]</span> 字号 · <span class="kbd">M</span> 切皮肤
    </div>
  </div>

  <!-- 模式提示 -->
  <div class="mode-badge" id="mode-badge"></div>
</div>

<script>
// ============================================================
// 小说内容（示例：职场轻小说）
// ============================================================

// 状态管理
// ============================================================
const state = {
  skin: 'excel',        // excel | code | word
  mode: 'stealth',      // stealth | boss | immersive
  chapter: 0,
  fontSize: 19,
  scrollSpeed: 4,
  autoScroll: false,
  scrollTimer: null,
  scrollPos: {},        // 每章滚动位置
};

// ============================================================
// DOM 引用
// ============================================================
const app = document.getElementById('app');
const content = document.getElementById('content');
const tbTitle = document.getElementById('tb-title');
const excelTable = document.getElementById('excel-table');
const codeArea = document.getElementById('code-area');
const wordPage = document.getElementById('word-page');
const ivTitle = document.getElementById('iv-title');
const ivMeta = document.getElementById('iv-meta');
const ivBody = document.getElementById('iv-body');
const dock = document.getElementById('dock');
const settings = document.getElementById('settings');
const modeBadge = document.getElementById('mode-badge');
const scrollProgress = document.getElementById('scroll-progress');

// ============================================================
// 伪装界面渲染
// ============================================================
const SKIN_META = {
  excel: { title: '季度数据汇总.xlsx - Excel', tb: ['文件','开始','插入','页面布局','公式','数据','审阅','视图'] },
  code:  { title: 'main.ts - Visual Studio Code', tb: ['文件','编辑','选择','查看','转到','运行','终端','帮助'] },
  word:  { title: '项目周报.docx - Word', tb: ['文件','开始','插入','设计','布局','引用','审阅','视图'] },
};

function renderDisguise() {
  tbTitle.textContent = SKIN_META[state.skin].title;
  excelTable.innerHTML = '';
  codeArea.innerHTML = '';
  wordPage.innerHTML = '';

  // 隐藏所有视图
  document.querySelector('.excel-view').classList.toggle('hidden', state.skin !== 'excel');
  document.querySelector('.code-view').classList.toggle('hidden', state.skin !== 'code');
  document.querySelector('.word-view').classList.toggle('hidden', state.skin !== 'word');

  if (state.skin === 'excel') renderExcel();
  else if (state.skin === 'code') renderCode();
  else if (state.skin === 'word') renderWord();
}

// Excel 伪装：小说文字塞进单元格
function renderExcel() {
  const chapter = NOVEL.chapters[state.chapter];
  const paras = chapter.paras;
  const headers = ['A','B','C','D','E','F'];
  let html = '<tr><td class="row-head"></td>';
  headers.forEach(h => html += `<td class="col-head">${h}</td>`);
  html += '</tr>';

  // 前3行是假数据
  const fakeData = [
    ['1月','营收','128.5','成本','89.2','利润','39.3'],
    ['2月','营收','142.8','成本','95.6','利润','47.2'],
    ['3月','营收','156.3','成本','102.1','利润','54.2'],
  ];
  fakeData.forEach((row, i) => {
    html += `<tr><td class="row-head">${i+1}</td>`;
    row.forEach(c => html += `<td>${c}</td>`);
    html += '</tr>';
  });

  // 小说段落嵌入后续行
  paras.forEach((p, i) => {
    const row = i + 5;
    html += `<tr><td class="row-head">${row}</td>`;
    html += `<td>备注${row}</td>`;
    html += `<td class="cell novel-text" colspan="5">${escapeHtml(p)}</td>`;
    html += '</tr>';
  });

  // 尾部假数据
  for (let i = paras.length + 5; i < paras.length + 12; i++) {
    html += `<tr><td class="row-head">${i}</td><td>汇总</td><td colspan="5" style="color:#aaa">=SUM(F2:F${i-1})</td></tr>`;
  }

  excelTable.innerHTML = html;
}

// Code 伪装：小说作为注释
function renderCode() {
  const chapter = NOVEL.chapters[state.chapter];
  const codePrefix = [
    'import { DataService } from "./service";',
    'import { Logger } from "./utils";',
    '',
    '/**',
    ' * 数据处理主模块',
    ' * @author dev-team',
    ' */',
    'export class MainProcessor {',
    '  private service: DataService;',
    '',
    '  constructor() {',
    '    this.service = new DataService();',
    '  }',
    '',
    '  async process(data: any[]): Promise<void> {',
    '    // TODO: 以下为业务逻辑说明',
  ];
  const codeSuffix = [
    '    const result = await this.service.batchUpdate(data);',
    '    Logger.info(`处理完成，共 ${result.count} 条`);',
    '    return result;',
    '  }',
    '}',
  ];

  let lines = [];
  codePrefix.forEach((l, i) => lines.push(formatCodeLine(l, i+1)));
  // 小说作为注释
  chapter.paras.forEach((p, i) => {
    const ln = codePrefix.length + i + 1;
    lines.push(`<span class="ln">${String(ln).padStart(2,' ')}</span><span class="comment">// ${escapeHtml(p)}</span>`);
  });
  codeSuffix.forEach((l, i) => {
    const ln = codePrefix.length + chapter.paras.length + i + 1;
    lines.push(formatCodeLine(l, ln));
  });

  codeArea.innerHTML = lines.join('\n');
}

function formatCodeLine(line, ln) {
  // 简单语法高亮
  let html = escapeHtml(line);
  html = html.replace(/\b(import|export|class|const|async|await|return|new|private|void|Promise)\b/g, '<span class="kw">$1</span>');
  html = html.replace(/"([^"]*)"/g, '<span class="str">"$1"</span>');
  html = html.replace(/\b(\d+)\b/g, '<span class="num">$1</span>');
  html = html.replace(/(\w+)(?=\()/g, '<span class="fn">$1</span>');
  return `<span class="ln">${String(ln).padStart(2,' ')}</span>${html}`;
}

// Word 伪装：小说作为正文
function renderWord() {
  const chapter = NOVEL.chapters[state.chapter];
  let html = `<h1>项目周报 - 第${state.chapter + 1}周</h1>`;
  html += `<p style="color:#888;font-size:12px;text-indent:0">汇报人：林默　　日期：2026年Q2　　部门：研发部</p>`;
  html += `<h2>一、本周工作概述</h2>`;
  // 第一段作为"工作概述"
  html += `<p class="novel-text">${escapeHtml(chapter.paras[0])}</p>`;
  html += `<h2>二、详细进展</h2>`;
  chapter.paras.slice(1, -1).forEach(p => {
    html += `<p class="novel-text">${escapeHtml(p)}</p>`;
  });
  html += `<h2>三、下周计划</h2>`;
  html += `<p class="novel-text">${escapeHtml(chapter.paras[chapter.paras.length-1])}</p>`;
  html += `<p style="color:#aaa;font-size:11px;text-indent:0;margin-top:24px">— 本文档仅供内部参考 —</p>`;
  wordPage.innerHTML = html;
}

// 沉浸阅读视图
function renderImmersive() {
  const chapter = NOVEL.chapters[state.chapter];
  ivTitle.textContent = chapter.title;
  ivMeta.textContent = `${NOVEL.title} · ${NOVEL.author}`;
  ivBody.innerHTML = chapter.paras.map(p => `<p>${escapeHtml(p)}</p>`).join('');
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============================================================
// 模式切换
// ============================================================
function setMode(mode) {
  state.mode = mode;
  app.className = `skin-${state.skin} mode-${mode}`;
  document.documentElement.style.setProperty('--read-size', state.fontSize + 'px');

  if (mode === 'immersive') renderImmersive();

  // 恢复滚动位置
  setTimeout(() => {
    const key = `${mode}-${state.skin}-${state.chapter}`;
    content.scrollTop = state.scrollPos[key] || 0;
  }, 50);

  // 按钮状态
  document.getElementById('btn-mode').classList.toggle('active', mode === 'immersive');
  document.getElementById('btn-boss').classList.toggle('active', mode === 'boss');

  showBadge(mode === 'boss' ? '🛡️ 老板模式' : mode === 'immersive' ? '📖 沉浸阅读' : '🕶️ 伪装阅读');
}

function setSkin(skin) {
  state.skin = skin;
  app.className = `skin-${skin} mode-${state.mode}`;
  renderDisguise();
  document.querySelectorAll('.skin-btn').forEach(b => b.classList.toggle('active', b.dataset.skin === skin));
  setTimeout(() => {
    const key = `${state.mode}-${skin}-${state.chapter}`;
    content.scrollTop = state.scrollPos[key] || 0;
  }, 50);
  showBadge({excel:'📊 表格模式', code:'💻 代码模式', word:'📝 文档模式'}[skin]);
}

// ============================================================
// 章节切换
// ============================================================
function gotoChapter(idx) {
  // 保存当前滚动位置
  saveScrollPos();
  state.chapter = Math.max(0, Math.min(NOVEL.chapters.length - 1, idx));
  renderDisguise();
  if (state.mode === 'immersive') renderImmersive();
  content.scrollTop = 0;
  showBadge(`${NOVEL.chapters[state.chapter].title}`);
}

function saveScrollPos() {
  const key = `${state.mode}-${state.skin}-${state.chapter}`;
  state.scrollPos[key] = content.scrollTop;
}

// ============================================================
// 自动滚动
// ============================================================
function toggleAutoScroll() {
  state.autoScroll = !state.autoScroll;
  document.getElementById('btn-auto').classList.toggle('active', state.autoScroll);
  if (state.autoScroll) {
    startAutoScroll();
    showBadge('▶ 自动滚动');
  } else {
    stopAutoScroll();
    showBadge('⏸ 停止滚动');
  }
}

function startAutoScroll() {
  stopAutoScroll();
  state.scrollTimer = setInterval(() => {
    content.scrollTop += state.scrollSpeed;
    if (content.scrollTop + content.clientHeight >= content.scrollHeight - 2) {
      stopAutoScroll();
      state.autoScroll = false;
      document.getElementById('btn-auto').classList.remove('active');
      showBadge('本章读完');
    }
  }, 50);
}

function stopAutoScroll() {
  if (state.scrollTimer) { clearInterval(state.scrollTimer); state.scrollTimer = null; }
}

// ============================================================
// 提示气泡
// ============================================================
let badgeTimer = null;
function showBadge(text) {
  modeBadge.textContent = text;
  modeBadge.classList.add('show');
  clearTimeout(badgeTimer);
  badgeTimer = setTimeout(() => modeBadge.classList.remove('show'), 1200);
}

// ============================================================
// 事件绑定
// ============================================================
document.getElementById('btn-mode').onclick = () => setMode(state.mode === 'immersive' ? 'stealth' : 'immersive');
document.getElementById('btn-boss').onclick = () => setMode(state.mode === 'boss' ? 'stealth' : 'boss');
document.getElementById('btn-auto').onclick = toggleAutoScroll;
document.getElementById('btn-prev').onclick = () => gotoChapter(state.chapter - 1);
document.getElementById('btn-next').onclick = () => gotoChapter(state.chapter + 1);
document.getElementById('btn-settings').onclick = () => settings.classList.toggle('show');
document.getElementById('skin-quick').onclick = () => {
  const skins = ['excel','code','word'];
  const next = skins[(skins.indexOf(state.skin) + 1) % 3];
  setSkin(next);
};

document.querySelectorAll('.skin-btn').forEach(btn => {
  btn.onclick = () => setSkin(btn.dataset.skin);
});

document.getElementById('font-size').oninput = e => {
  state.fontSize = +e.target.value;
  document.getElementById('font-size-val').textContent = state.fontSize + 'px';
  document.documentElement.style.setProperty('--read-size', state.fontSize + 'px');
};
document.getElementById('scroll-speed').oninput = e => {
  state.scrollSpeed = +e.target.value;
  document.getElementById('scroll-speed-val').textContent = state.scrollSpeed;
  if (state.autoScroll) { stopAutoScroll(); startAutoScroll(); }
};

// 鼠标移近右下角显示控制栏
document.addEventListener('mousemove', e => {
  if (e.clientX > window.innerWidth - 100 && e.clientY > window.innerHeight - 200) {
    dock.classList.add('show');
  } else {
    dock.classList.remove('show');
  }
});

// 滚动进度
content.addEventListener('scroll', () => {
  const pct = content.scrollTop / (content.scrollHeight - content.clientHeight) * 100;
  scrollProgress.style.height = pct + '%';
  saveScrollPos();
});

// 快捷键
document.addEventListener('keydown', e => {
  // ESC 老板键
  if (e.key === 'Escape') {
    e.preventDefault();
    setMode(state.mode === 'boss' ? 'stealth' : 'boss');
    if (state.autoScroll) { stopAutoScroll(); state.autoScroll = false; document.getElementById('btn-auto').classList.remove('active'); }
    return;
  }
  // F 沉浸阅读
  if (e.key === 'f' || e.key === 'F') {
    if (e.ctrlKey || e.metaKey) return; // 不拦截Ctrl+F
    e.preventDefault();
    setMode(state.mode === 'immersive' ? 'stealth' : 'immersive');
    return;
  }
  // 空格 自动滚动
  if (e.key === ' ' && state.mode !== 'boss') {
    e.preventDefault();
    toggleAutoScroll();
    return;
  }
  // 左右翻章
  if (e.key === 'ArrowLeft') { e.preventDefault(); gotoChapter(state.chapter - 1); return; }
  if (e.key === 'ArrowRight') { e.preventDefault(); gotoChapter(state.chapter + 1); return; }
  // [ ] 字号
  if (e.key === '[') { e.preventDefault(); adjustFont(-1); return; }
  if (e.key === ']') { e.preventDefault(); adjustFont(1); return; }
  // M 切皮肤
  if (e.key === 'm' || e.key === 'M') {
    e.preventDefault();
    const skins = ['excel','code','word'];
    setSkin(skins[(skins.indexOf(state.skin) + 1) % 3]);
    return;
  }
});

function adjustFont(delta) {
  state.fontSize = Math.max(15, Math.min(26, state.fontSize + delta));
  document.getElementById('font-size').value = state.fontSize;
  document.getElementById('font-size-val').textContent = state.fontSize + 'px';
  document.documentElement.style.setProperty('--read-size', state.fontSize + 'px');
}

// 失焦自动进入老板模式
window.addEventListener('blur', () => {
  if (state.mode !== 'boss') {
    setMode('boss');
    showBadge('🛡️ 窗口失焦，已自动防护');
  }
});

// 点击设置面板外关闭
document.addEventListener('click', e => {
  if (!settings.contains(e.target) && e.target.id !== 'btn-settings' && !e.target.closest('#btn-settings')) {
    settings.classList.remove('show');
  }
});

// ============================================================
// 初始化
// ============================================================
renderDisguise();
setMode('stealth');
showBadge('👋 欢迎使用摸鱼阅读器 · 按F开始阅读');

// 首次提示
setTimeout(() => {
  if (!localStorage.getItem('moyu-tip')) {
    showBadge('提示：ESC=老板键 F=沉浸阅读 空格=自动滚动');
    localStorage.setItem('moyu-tip', '1');
  }
}, 3000);
</script>
</body>
</html>
