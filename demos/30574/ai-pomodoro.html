<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能番茄钟</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0e1a;
            --bg-surface: #111827;
            --bg-elevated: #1a2236;
            --text-primary: #f0f4f8;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #22d3ee;
            --accent-soft: rgba(34, 211, 238, 0.12);
            --accent-glow: rgba(34, 211, 238, 0.3);
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --border: rgba(148, 163, 184, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* 背景粒子画布 */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            padding: 0 24px;
        }

        /* 品牌标识 */
        .brand {
            text-align: center;
            margin-bottom: 48px;
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeInDown 0.8s ease forwards;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--accent), #0ea5e9);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px var(--accent-glow);
        }

        .brand-icon svg {
            width: 28px;
            height: 28px;
            color: white;
        }

        .brand h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 6px;
            font-weight: 400;
        }

        /* 番茄钟主体 */
        .pomodoro-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease 0.2s forwards;
            position: relative;
            overflow: hidden;
        }

        .pomodoro-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.5;
        }

        /* 模式切换 */
        .mode-tabs {
            display: inline-flex;
            background: var(--bg-deep);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 36px;
            border: 1px solid var(--border);
        }

        .mode-tab {
            padding: 8px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            background: transparent;
            font-family: inherit;
        }

        .mode-tab:hover {
            color: var(--text-secondary);
        }

        .mode-tab.active {
            background: var(--accent-soft);
            color: var(--accent);
            box-shadow: 0 2px 12px var(--accent-glow);
        }

        /* 圆形进度条 */
        .timer-ring-wrapper {
            position: relative;
            width: 240px;
            height: 240px;
            margin: 0 auto 36px;
        }

        .timer-ring-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .timer-ring-bg {
            fill: none;
            stroke: var(--bg-elevated);
            stroke-width: 8;
        }

        .timer-ring-progress {
            fill: none;
            stroke: url(#ringGradient);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 691;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }

        .timer-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .timer-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 56px;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: -2px;
            line-height: 1;
        }

        .timer-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 8px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 控制按钮 */
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 28px;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #0ea5e9);
            color: var(--bg-deep);
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px var(--accent-glow);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-deep);
            color: var(--text-primary);
            border-color: var(--text-muted);
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        /* 统计信息 */
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 24px;
            font-weight: 500;
            color: var(--accent);
            line-height: 1;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 500;
        }

        /* 任务输入 */
        .task-input-wrapper {
            margin-bottom: 28px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease 0.4s forwards;
        }

        .task-input {
            width: 100%;
            padding: 14px 20px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        .task-input::placeholder {
            color: var(--text-muted);
        }

        .task-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        /* 提示信息 */
        .tip {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-muted);
            opacity: 0;
            animation: fadeIn 0.8s ease 0.6s forwards;
        }

        .tip svg {
            width: 14px;
            height: 14px;
            vertical-align: text-bottom;
            margin-right: 4px;
        }

        /* 动画 */
        @keyframes fadeInDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        .timer-running .timer-time {
            animation: pulse 2s ease-in-out infinite;
        }

        /* 完成动画 */
        .complete-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 26, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .complete-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .complete-content {
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.5s ease;
        }

        .complete-overlay.show .complete-content {
            transform: scale(1);
        }

        .complete-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, var(--success), #10b981);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(52, 211, 153, 0.3);
        }

        .complete-icon svg {
            width: 40px;
            height: 40px;
            color: white;
        }

        .complete-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-primary), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .complete-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .timer-ring-wrapper {
                width: 200px;
                height: 200px;
            }

            .timer-time {
                font-size: 44px;
            }

            .pomodoro-card {
                padding: 32px 24px;
            }

            .brand h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- 背景粒子画布 -->
    <canvas id="particleCanvas"></canvas>

    <!-- SVG 渐变定义 -->
    <svg width="0" height="0" style="position: absolute;">
        <defs>
            <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#22d3ee"/>
                <stop offset="100%" style="stop-color:#0ea5e9"/>
            </linearGradient>
        </defs>
    </svg>

    <div class="container">
        <!-- 品牌 -->
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
            </div>
            <h1>AI 智能番茄钟</h1>
            <p>专注当下，高效每一刻</p>
        </div>

        <!-- 任务输入 -->
        <div class="task-input-wrapper">
            <input type="text" class="task-input" id="taskInput" placeholder="输入当前专注任务..." maxlength="50">
        </div>

        <!-- 番茄钟卡片 -->
        <div class="pomodoro-card" id="pomodoroCard">
            <!-- 模式切换 -->
            <div class="mode-tabs">
                <button class="mode-tab active" data-mode="pomodoro" data-time="25">专注</button>
                <button class="mode-tab" data-mode="shortBreak" data-time="5">短休息</button>
                <button class="mode-tab" data-mode="longBreak" data-time="15">长休息</button>
            </div>

            <!-- 圆形进度条 -->
            <div class="timer-ring-wrapper">
                <svg class="timer-ring-svg" viewBox="0 0 240 240">
                    <circle class="timer-ring-bg" cx="120" cy="120" r="110"/>
                    <circle class="timer-ring-progress" id="progressRing" cx="120" cy="120" r="110"/>
                </svg>
                <div class="timer-display">
                    <div class="timer-time" id="timerDisplay">25:00</div>
                    <div class="timer-label" id="timerLabel">准备开始</div>
                </div>
            </div>

            <!-- 控制按钮 -->
            <div class="controls">
                <button class="btn btn-primary" id="startBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    开始
                </button>
                <button class="btn btn-secondary" id="pauseBtn" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="4" width="4" height="16"/>
                        <rect x="14" y="4" width="4" height="16"/>
                    </svg>
                    暂停
                </button>
                <button class="btn btn-secondary" id="resetBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="1 4 1 10 7 10"/>
                        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                    </svg>
                    重置
                </button>
            </div>

            <!-- 统计 -->
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="completedCount">0</div>
                    <div class="stat-label">完成次数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalMinutes">0</div>
                    <div class="stat-label">专注分钟</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="currentStreak">0</div>
                    <div class="stat-label">当前连击</div>
                </div>
            </div>
        </div>

        <!-- 提示 -->
        <div class="tip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="16" x2="12" y2="12"/>
                <line x1="12" y1="8" x2="12.01" y2="8"/>
            </svg>
            每完成 4 个番茄钟，建议进行一次长休息
        </div>
    </div>

    <!-- 完成弹窗 -->
    <div class="complete-overlay" id="completeOverlay">
        <div class="complete-content">
            <div class="complete-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
            </div>
            <div class="complete-title">番茄钟完成！</div>
            <div class="complete-subtitle" id="completeSubtitle">休息一下，你做得很好</div>
            <button class="btn btn-primary" id="dismissComplete">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
                继续
            </button>
        </div>
    </div>

    <script>
        // ==================== 粒子背景 ====================
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.opacity = Math.random() * 0.5 + 0.1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(34, 211, 238, ${this.opacity})`;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.min(80, Math.floor((canvas.width * canvas.height) / 15000));
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // 绘制连线
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(34, 211, 238, ${0.08 * (1 - dist / 120)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }

            animationId = requestAnimationFrame(animateParticles);
        }

        resizeCanvas();
        initParticles();
        animateParticles();

        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticles();
        });

        // ==================== 番茄钟逻辑 ====================
        const MODES = {
            pomodoro: { time: 25 * 60, label: '专注中', completeMsg: '专注完成！休息一下吧' },
            shortBreak: { time: 5 * 60, label: '短休息', completeMsg: '休息结束，继续加油' },
            longBreak: { time: 15 * 60, label: '长休息', completeMsg: '精力充沛，开始新任务' }
        };

        let currentMode = 'pomodoro';
        let totalTime = MODES.pomodoro.time;
        let remainingTime = totalTime;
        let isRunning = false;
        let timerInterval = null;
        let completedPomodoros = parseInt(localStorage.getItem('completedPomodoros') || '0');
        let totalFocusMinutes = parseInt(localStorage.getItem('totalFocusMinutes') || '0');
        let currentStreak = parseInt(localStorage.getItem('currentStreak') || '0');

        const timerDisplay = document.getElementById('timerDisplay');
        const timerLabel = document.getElementById('timerLabel');
        const progressRing = document.getElementById('progressRing');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const pomodoroCard = document.getElementById('pomodoroCard');
        const completeOverlay = document.getElementById('completeOverlay');
        const completeSubtitle = document.getElementById('completeSubtitle');
        const dismissComplete = document.getElementById('dismissComplete');
        const completedCountEl = document.getElementById('completedCount');
        const totalMinutesEl = document.getElementById('totalMinutes');
        const currentStreakEl = document.getElementById('currentStreak');

        // 圆环周长
        const CIRCUMFERENCE = 2 * Math.PI * 110;
        progressRing.style.strokeDasharray = CIRCUMFERENCE;

        function updateStats() {
            completedCountEl.textContent = completedPomodoros;
            totalMinutesEl.textContent = totalFocusMinutes;
            currentStreakEl.textContent = currentStreak;
        }

        updateStats();

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateDisplay() {
            timerDisplay.textContent = formatTime(remainingTime);
            const progress = (totalTime - remainingTime) / totalTime;
            const offset = CIRCUMFERENCE * (1 - progress);
            progressRing.style.strokeDashoffset = offset;
        }

        function updateLabel(text) {
            timerLabel.textContent = text;
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            pomodoroCard.classList.add('timer-running');
            startBtn.style.display = 'none';
            pauseBtn.style.display = 'inline-flex';
            updateLabel(MODES[currentMode].label);

            timerInterval = setInterval(() => {
                remainingTime--;
                updateDisplay();

                if (remainingTime <= 0) {
                    completeTimer();
                }
            }, 1000);
        }

        function pauseTimer() {
            if (!isRunning) return;
            isRunning = false;
            pomodoroCard.classList.remove('timer-running');
            clearInterval(timerInterval);
            startBtn.style.display = 'inline-flex';
            pauseBtn.style.display = 'none';
            updateLabel('已暂停');
        }

        function resetTimer() {
            pauseTimer();
            remainingTime = totalTime;
            updateDisplay();
            updateLabel('准备开始');
            progressRing.style.strokeDashoffset = 0;
        }

        function completeTimer() {
            pauseTimer();
            remainingTime = 0;
            updateDisplay();

            // 更新统计
            if (currentMode === 'pomodoro') {
                completedPomodoros++;
                totalFocusMinutes += 25;
                currentStreak++;
                localStorage.setItem('completedPomodoros', completedPomodoros);
                localStorage.setItem('totalFocusMinutes', totalFocusMinutes);
                localStorage.setItem('currentStreak', currentStreak);
                updateStats();
            }

            // 显示完成弹窗
            completeSubtitle.textContent = MODES[currentMode].completeMsg;
            completeOverlay.classList.add('show');

            // 播放提示音（使用 Web Audio API 生成简单提示音）
            playNotificationSound();
        }

        function playNotificationSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.15); // E5
                oscillator.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.3); // G5

                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);

                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.6);
            } catch (e) {
                console.log('Audio not supported');
            }
        }

        // 模式切换
        document.querySelectorAll('.mode-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                if (isRunning) {
                    if (!confirm('切换模式将重置当前计时，是否继续？')) return;
                    pauseTimer();
                }

                document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                currentMode = tab.dataset.mode;
                totalTime = parseInt(tab.dataset.time) * 60;
                remainingTime = totalTime;
                updateDisplay();
                updateLabel('准备开始');
                progressRing.style.strokeDashoffset = 0;
            });
        });

        // 按钮事件
        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);

        dismissComplete.addEventListener('click', () => {
            completeOverlay.classList.remove('show');
            resetTimer();
        });

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (isRunning) {
                    pauseTimer();
                } else {
                    startTimer();
                }
            } else if (e.code === 'KeyR') {
                resetTimer();
            }
        });

        // 页面可见性变化处理
        document.addEventListener('visibilitychange', () => {
            // 使用 Page Visibility API 确保后台计时准确
            if (!document.hidden && isRunning) {
                // 页面重新可见时，不需要额外操作，setInterval 会继续
            }
        });

        // 初始化显示
        updateDisplay();
    </script>
</body>
</html>
