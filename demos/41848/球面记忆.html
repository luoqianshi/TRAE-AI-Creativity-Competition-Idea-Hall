<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记忆的引力定律</title>
<style>
:root {
  --bg: #050510; --surface: #0b0b1a; --text: #c8c8d8; --text2: #606078;
  --cyan: #00b8d4; --green: #00e676; --gold: #ffc400; --red: #ff4060;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  min-height: 100vh; padding: 20px 16px; overflow-x: auto;
}
.title-area { text-align: center; margin-bottom: 8px; }
.title-area h1 {
  font-size: 2.8rem; font-weight: 700;
  background: linear-gradient(135deg, var(--cyan), #8464ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.title-area .sub { font-size: 0.95rem; color: var(--text2); letter-spacing: 3px; margin-top: 2px; }
.scene { display: flex; gap: 24px; align-items: flex-start; justify-content: center; }
.panel {
  background: var(--surface); border-radius: 16px; padding: 16px 14px 12px;
  position: relative; overflow: hidden; flex-shrink: 0;
}
.panel .tag {
  font-size: 0.75rem; letter-spacing: 2px; text-align: center; margin-bottom: 8px; font-weight: 600;
}
.panel.left  .tag { color: var(--red); }
.panel.mid   .tag { color: var(--green); }
.panel canvas { display: block; border-radius: 8px; }
.panel .bar-wrap { margin-top: 10px; display: flex; align-items: center; gap: 6px; padding: 0 4px; }
.panel .bar-wrap .bar-label { font-size: 0.65rem; color: var(--text2); min-width: 28px; }
.panel .bar-wrap .bar { flex: 1; height: 4px; border-radius: 2px; background: #1e1e32; overflow: hidden; }
.panel .bar-wrap .bar .fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
.panel.left  .bar .fill { background: var(--red); }
.panel.mid   .bar .fill { background: var(--green); }
.annotation {
  position: absolute; font-size: 0.75rem; padding: 4px 8px; border-radius: 5px;
  pointer-events: none; opacity: 0; transition: opacity 0.5s;
  white-space: nowrap; z-index: 10; bottom: 36px; left: 50%; transform: translateX(-50%);
}
.annotation.show { opacity: 1; }
.annotation.warn { color: var(--red); background: rgba(255,64,96,0.08); border: 1px solid rgba(255,64,96,0.2); }
.annotation.ok   { color: var(--green); background: rgba(0,230,118,0.08); border: 1px solid rgba(0,230,118,0.2); }
.annotation.gold { color: var(--gold); background: rgba(255,196,0,0.08); border: 1px solid rgba(255,196,0,0.2); }
.bottom-ann { text-align: center; margin-top: 12px; height: 20px; }
.bottom-ann .annotation { position: static; display: inline-block; }
.timeline { display: flex; align-items: center; gap: 10px; margin-top: 16px; width: 620px; max-width: 95vw; margin-left: auto; margin-right: auto; }
.timeline input[type=range] { flex: 1; -webkit-appearance: none; height: 3px; background: #1e1e32; border-radius: 2px; outline: none; }
.timeline input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: var(--cyan); border-radius: 50%; cursor: pointer; }
.timeline .t-label { font-size: 0.7rem; color: var(--text2); min-width: 30px; text-align: center; }
.timeline .btn { font-size: 0.78rem; padding: 5px 12px; border: 1px solid #1e1e32; border-radius: 5px; background: transparent; color: var(--text); cursor: pointer; transition: all 0.3s; }
.timeline .btn:hover { border-color: var(--cyan); color: var(--cyan); }
.results {
  margin: 20px auto 0; background: var(--surface); border-radius: 12px; padding: 16px 22px;
  max-width: 700px; width: 100%; opacity: 0; transform: translateY(10px); transition: all 0.8s ease;
}
.results.visible { opacity: 1; transform: translateY(0); }
.results table { width: 100%; border-collapse: collapse; }
.results th { font-size: 0.65rem; color: var(--text2); letter-spacing: 2px; padding: 6px 8px; text-align: left; border-bottom: 1px solid #1a1a2e; }
.results td { padding: 8px; font-size: 0.85rem; border-bottom: 1px solid rgba(26,26,46,0.5); }
.results .hi { color: var(--green); font-weight: 700; }
.results .lo { color: var(--red); }
.results .go { color: var(--gold); }
.footer { margin-top: 16px; color: var(--text2); font-size: 0.75rem; text-align: center; opacity: 0.5; }
</style>
</head>
<body>

<div class="title-area">
  <h1>记忆的引力定律</h1>
  <div class="sub">球面记忆：公式驱动结构自涌现</div>
</div>

<div class="scene">
  <div class="panel left">
    <div class="tag"><span style="font-weight:400;opacity:0.5">无槽</span></div>
    <canvas id="cL" width="360" height="360"></canvas>
    <div class="bar-wrap"><span class="bar-label">探索度</span><div class="bar"><div class="fill" id="barL"></div></div><span id="pctL" style="font-size:0.65rem;color:var(--red);min-width:30px">0%</span></div>
    <div class="annotation warn" id="annL"></div>
  </div>
  <div class="panel mid">
    <div class="tag"><span style="color:#ffc400;font-size:0.65rem">抽屉x3</span> <span style="font-weight:400;opacity:0.5">有槽</span></div>
    <canvas id="cM" width="360" height="360"></canvas>
    <div class="bar-wrap"><span class="bar-label">探索度</span><div class="bar"><div class="fill" id="barM"></div></div><span id="pctM" style="font-size:0.65rem;color:var(--green);min-width:30px">0%</span></div>
    <div class="annotation ok" id="annM"></div>
  </div>

<div class="bottom-ann"><div class="annotation warn" id="annB" style="position:static;display:inline-block"></div></div>

<div class="timeline">
  <span class="t-label" id="tl">0</span>
  <input type="range" id="scrub" min="0" max="160" value="0" step="1">
  <span class="t-label">160</span>
  <button class="btn" id="btn-play">播放</button>
  <button class="btn" id="btn-replay">重播</button>
</div>

<div class="results" id="results-table">
  <table>
    <thead><tr><th>任务</th><th>无槽</th><th>有槽</th><th>验证</th></tr></thead>
    <tbody>
      <tr><td>784步</td><td class="lo">0.2965</td><td class="hi">0.5550</td><td class="go">+87% 精度</td></tr>
      <tr><td>3072步</td><td class="lo">0.3203</td><td class="hi">0.4062</td><td class="go">唯一可行路径</td></tr>
      <tr><td>WikiText-2 LM</td><td class="lo">PPL 5.23</td><td class="hi">PPL 5.03</td><td class="go">超越全秩</td></tr>
    </tbody>
  </table>
</div>

<div class="footer"></div>

<script>
"use strict";

function norm(v) {
  var n = Math.sqrt(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]);
  return [v[0]/Math.max(n,1e-8), v[1]/Math.max(n,1e-8), v[2]/Math.max(n,1e-8)];
}

function mkRenderer(cid, size) {
  var cv = document.getElementById(cid);
  var ctx = cv.getContext("2d");
  var S = size, C = S/2, R = S*0.36;
  var rx = 0.5, ry = 0.12;

  function proj(x,y,z) {
    var cx = Math.cos(rx), sx = Math.sin(rx);
    var cy = Math.cos(ry), sy = Math.sin(ry);
    var y1 = y*cx - z*sx, z1 = y*sx + z*cx;
    var x1 = x*cy - z1*sy;
    return { x: C + x1*R, y: C + y1*R, d: x*sy + z1*cy };
  }

  function draw(h, traj, slots, trajSlots, opts) {
    opts = opts || {};
    var gridA = opts.gridA || 0.22;
    var trajC = opts.trajC || "#00c8f0";
    var ptC   = opts.ptC || "#00e676";
    var showSlots = opts.showSlots || false;
    var mainA = opts.mainA || 0.8;

    ctx.clearRect(0, 0, S, S);

    ctx.strokeStyle = "rgba(26,26,46," + gridA + ")"; ctx.lineWidth = 0.5;
    for (var lat = -90; lat <= 90; lat += 15) {
      ctx.beginPath();
      for (var lon = 0; lon <= 360; lon += 5) {
        var phi = lat*Math.PI/180, theta = lon*Math.PI/180;
        var p = proj(Math.cos(phi)*Math.cos(theta), Math.cos(phi)*Math.sin(theta), Math.sin(phi));
        if (lon===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
      }
      ctx.stroke();
    }
    for (var lon = 0; lon < 360; lon += 18) {
      ctx.beginPath();
      for (var lat = -90; lat <= 90; lat += 4) {
        var phi = lat*Math.PI/180, theta = lon*Math.PI/180;
        var p = proj(Math.cos(phi)*Math.cos(theta), Math.cos(phi)*Math.sin(theta), Math.sin(phi));
        if (lat===-90) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
      }
      ctx.stroke();
    }

    if (traj && traj.length > 1) {
      ctx.beginPath();
      for (var i = 0; i < traj.length; i++) {
        var p = proj(traj[i][0], traj[i][1], traj[i][2]);
        if (i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
      }
      ctx.strokeStyle = trajC; ctx.globalAlpha = mainA; ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = 1;
    }

    if (showSlots && trajSlots) {
      for (var s = 0; s < trajSlots.length; s++) {
        if (trajSlots[s].length < 2) continue;
        ctx.beginPath();
        for (var i = 0; i < trajSlots[s].length; i++) {
          var p = proj(trajSlots[s][i][0], trajSlots[s][i][1], trajSlots[s][i][2]);
          if (i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
        }
        ctx.strokeStyle = "rgba(255,196,0," + (0.25+0.3*s/trajSlots.length) + ")";
        ctx.lineWidth = 1.3; ctx.stroke();
      }
    }

    if (h) {
      var p = proj(h[0], h[1], h[2]);
      ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
      ctx.fillStyle = ptC; ctx.fill();
      ctx.shadowColor = ptC; ctx.shadowBlur = 12; ctx.fill(); ctx.shadowBlur = 0;
    }

    if (showSlots && slots) {
      var sc = ["#ffc400","#ffa000","#ff7000"];
      for (var s = 0; s < slots.length; s++) {
        var p = proj(slots[s][0], slots[s][1], slots[s][2]);
        ctx.beginPath(); ctx.arc(p.x, p.y, 3.2, 0, Math.PI*2);
        ctx.fillStyle = sc[s%3]; ctx.fill();
        ctx.shadowColor = sc[s%3]; ctx.shadowBlur = 7; ctx.fill(); ctx.shadowBlur = 0;
      }
    }
  }

  return { draw: draw, proj: proj };
}

function computeTraj(N) {
  var xs = [];
  for (var t = 0; t < N; t++) {
    // 两个清晰模式交替: A(0-19,40-59...) vs B(20-39,60-79...)
    var modeB = (t%40) >= 20;
    xs.push(norm([
      Math.cos(t*0.18 + (modeB?1.2:0))*0.7,
      Math.sin(t*0.18 + (modeB?1.2:0))*0.7,
      modeB ? 0.5 : -0.5
    ]));
  }

  // 左: 纯 circulant — Z轴锁死, 只在XY面绕圈
  var trajL = [[1,0,0]];
  var hL = [1,0,0];
  for (var t = 0; t < N; t++) {
    var a = 0.78, ang = 0.05*Math.sin(t*0.15);
    var cs = Math.cos(ang), sn = Math.sin(ang);
    // 只绕Z轴转, XY面受限
    var r = [cs*hL[0]-sn*hL[1], sn*hL[0]+cs*hL[1], hL[2]];
    hL = norm([a*r[0]+0.18*xs[t][0], a*r[1]+0.18*xs[t][1], a*r[2]+0.15*xs[t][2]]);
    trajL.push([hL[0], hL[1], hL[2]]);
  }

  // 右: circulant + 记忆槽 — 槽提供额外旋转自由度
  var trajM = [[1,0,0]];
  var tSl = [[],[],[]];
  var hM = [1,0,0];
  var sl = [norm([0.6,0.1,0.1]), norm([-0.3,0.7,0.05]), norm([0.1,-0.5,0.6])];
  for (var s=0; s<3; s++) tSl[s].push([sl[s][0], sl[s][1], sl[s][2]]);
  for (var t = 0; t < N; t++) {
    var a = 0.78, ang = 0.05*Math.sin(t*0.15);
    var cs = Math.cos(ang), sn = Math.sin(ang);
    var r = [cs*hM[0]-sn*hM[1], sn*hM[0]+cs*hM[1], hM[2]];
    // 记忆槽推力 — 放大到 0.12 (原 0.048)
    var inf = [0,0,0];
    for (var s=0; s<sl.length; s++) {
      var dot = hM[0]*sl[s][0] + hM[1]*sl[s][1] + hM[2]*sl[s][2];
      inf[0] += 0.12*sl[s][0]*dot;
      inf[1] += 0.12*sl[s][1]*dot;
      inf[2] += 0.12*sl[s][2]*dot;
    }
    r[0]+=inf[0]; r[1]+=inf[1]; r[2]+=inf[2];
    hM = norm([a*r[0]+0.18*xs[t][0], a*r[1]+0.18*xs[t][1], a*r[2]+0.15*xs[t][2]]);
    trajM.push([hM[0], hM[1], hM[2]]);
    // 槽各自演化
    for (var s=0; s<sl.length; s++) {
      var sang = 0.18*Math.sin(t*0.2 + s*1.6);
      var c2=Math.cos(sang), s2=Math.sin(sang);
      var sr = [c2*sl[s][0]-s2*sl[s][1], s2*sl[s][0]+c2*sl[s][1], sl[s][2]];
      sl[s] = norm([sr[0]+0.07*xs[t][0], sr[1]+0.07*xs[t][1], sr[2]+0.07*xs[t][2]]);
      tSl[s].push([sl[s][0], sl[s][1], sl[s][2]]);
    }
  }

  return { left: trajL, mid: trajM, tSl: tSl, lastSl: sl };
}

var N = 160;
var data = computeTraj(N);
var L = mkRenderer("cL", 360);
var M = mkRenderer("cM", 360);
var scrub = document.getElementById("scrub");
scrub.max = N;

function coverage(traj, t) {
  var seen = {};
  for (var i = 0; i <= t; i++) {
    var h = traj[Math.min(i, traj.length-1)];
    // 等面积分桶: 用球坐标 (theta, sin(phi)) 而非笛卡尔网格
    var phi = Math.asin(Math.max(-1, Math.min(1, h[2])));
    var theta = Math.atan2(h[1], h[0]);
    var b = Math.round(theta/Math.PI*14 + 14) + "," + Math.round(Math.sin(phi)*14 + 14);
    seen[b] = 1;
  }
  return Object.keys(seen).length;
}

var annotationsData = [
  "%E6%9D%A5%2C%20%E6%8B%96%E5%8A%A8%E6%BB%91%E5%9D%97%2C%20%E7%9C%8B%E7%9C%8B%E5%90%8C%E4%B8%80%E4%B8%B2%E8%BE%93%E5%85%A5%E4%BF%A1%E5%8F%B7%E4%B8%8B%E5%B7%A6%E5%8F%B3%E4%B8%A4%E8%BE%B9%E7%9A%84%E5%8C%BA%E5%88%AB",
  "%E5%B7%A6%E8%BE%B9%E5%B0%8F%E7%90%83%E5%8F%AA%E4%BC%9A%E5%B7%A6%E5%8F%B3%E6%99%83%2C%20%E9%81%87%E5%88%B0%E6%96%B0%E6%83%85%E5%86%B5%E5%8F%8D%E5%BA%94%E4%B8%8D%E8%BF%87%E6%9D%A5",
  "%E5%8F%B3%E8%BE%B9%E5%A4%9A%E4%BA%86%E4%B8%89%E4%B8%AA%E6%8A%BD%E5%B1%89%2C%20%E8%83%BD%E5%B8%AE%E5%B0%8F%E7%90%83%E8%AE%B0%E4%B8%9C%E8%A5%BF",
  "%E6%B3%A8%E6%84%8F%2C%20%E8%BE%93%E5%85%A5%E8%A6%81%E5%8F%98%E5%A4%A9%E4%BA%86%2C%20%E4%BB%8E%E6%A8%A1%E5%BC%8FA%E5%88%87%E6%8D%A2%E5%88%B0%E6%A8%A1%E5%BC%8FB",
  "%E4%BD%A0%E7%9C%8B%E5%B7%A6%E8%BE%B9%3A%20%E5%A4%A9%E9%83%BD%E5%8F%98%E4%BA%86%E5%AE%83%E8%BF%98%E5%82%BB%E4%B9%8E%E4%B9%8E%E8%B5%B0%E8%80%81%E8%B7%AF",
  "%E4%BD%A0%E7%9C%8B%E5%8F%B3%E8%BE%B9%3A%20%E6%8A%BD%E5%B1%89%E6%84%9F%E8%A7%89%E5%88%B0%E4%BA%86%E5%8F%98%E5%8C%96%2C%20%E5%B8%A6%E7%9D%80%E5%B0%8F%E7%90%83%E6%8B%90%E5%BC%AF%E4%BA%86",
  "%E6%8B%96%E5%88%B0%E4%B8%AD%E9%97%B4%E7%9C%8B%E7%9C%8B%2C%20%E4%B8%8B%E9%9D%A2%E7%9A%84%E8%BF%9B%E5%BA%A6%E6%9D%A1%2C%20%E8%B0%81%E8%B7%91%E7%9A%84%E5%9C%B0%E6%96%B9%E6%9B%B4%E5%A4%A7%3F",
  "%E5%B7%A6%E8%BE%B9%E8%BD%A8%E8%BF%B9%E7%BB%95%E6%9D%A5%E7%BB%95%E5%8E%BB%E5%B0%B1%E9%82%A3%E4%B9%88%E4%B8%80%E5%B0%8F%E5%9D%97%2C%20%E5%87%BA%E4%B8%8D%E5%8E%BB",
  "%E5%8F%B3%E8%BE%B9%E6%8A%BD%E5%B1%89%E5%90%84%E7%8E%A9%E5%90%84%E7%9A%84%2C%20%E6%8A%8A%E5%B0%8F%E7%90%83%E5%B8%A6%E5%88%B0%E6%B2%A1%E5%8E%BB%E8%BF%87%E7%9A%84%E5%9C%B0%E6%96%B9",
  "%E5%8F%88%E6%9D%A5%E4%B8%80%E6%AC%A1%E6%A8%A1%E5%BC%8F%E5%88%87%E6%8D%A2%2C%20%E8%BF%99%E5%9B%9E%E7%9C%8B%E8%B0%81%E5%8F%8D%E5%BA%94%E5%BF%AB",
  "%E5%B7%A6%E8%BE%B9%E6%97%A9%E6%8A%8A%E7%AC%AC%E4%B8%80%E6%AC%A1%E7%9A%84%E4%BA%8B%E5%BF%98%E5%85%89%E4%BA%86%2C%20%E8%B6%8A%E8%B5%B0%E8%B6%8A%E7%AA%84",
  "%E5%8F%B3%E8%BE%B9%E6%8A%BD%E5%B1%89%E9%87%8C%E8%BF%98%E5%AD%98%E7%9D%80%E6%A8%A1%E5%BC%8FA%2C%20%E4%B8%80%E4%B8%8B%E5%AD%90%E5%B0%B1%E6%8B%90%E5%9B%9E%E5%8E%BB%E4%BA%86",
  "%E5%88%B0%E6%9C%80%E5%90%8E%2C%20%E6%8A%BD%E5%B1%89%E8%87%AA%E5%B7%B1%E5%AD%A6%E4%BC%9A%E4%BA%86%E4%BB%80%E4%B9%88%E6%97%B6%E5%80%99%E8%AF%A5%E8%AE%B0%E4%BD%8F%E4%BB%80%E4%B9%88%2C%20%E4%B8%8D%E7%94%A8%E4%BA%BA%E6%95%99",
  "%E4%BD%A0%E5%95%A5%E4%B9%9F%E6%B2%A1%E6%94%B9%2C%20%E5%B0%B1%E6%98%AF%E6%8A%8Ad_total%E8%B0%83%E5%A4%A7%E4%BA%86%E4%B8%80%E7%82%B9%2C%20%E5%89%A9%E4%B8%8B%E7%9A%84%E6%A8%A1%E5%9E%8B%E8%87%AA%E5%B7%B1%E6%90%9E%E5%AE%9A%E4%BA%86"
];

function decode(txt) {
  return decodeURIComponent(txt);
}

var allAnnotations = [
  { t: 0,   side: "bottom", style: "warn" },
  { t: 8,   side: "L",      style: "warn" },
  { t: 8,   side: "M",      style: "ok" },
  { t: 18,  side: "bottom", style: "warn" },
  { t: 28,  side: "L",      style: "warn" },
  { t: 28,  side: "M",      style: "ok" },
  { t: 42,  side: "bottom", style: "ok" },
  { t: 58,  side: "L",      style: "warn" },
  { t: 58,  side: "M",      style: "gold" },
  { t: 78,  side: "bottom", style: "ok" },
  { t: 95,  side: "L",      style: "warn" },
  { t: 95,  side: "M",      style: "ok" },
  { t: 120, side: "bottom", style: "gold" },
  { t: 150, side: "bottom", style: "ok" }
];

for (var i = 0; i < allAnnotations.length; i++) {
  allAnnotations[i].text = decode(annotationsData[i]);
}

function drawAt(t) {
  t = Math.max(0, Math.min(N, t));

  var leftTraj = data.left.slice(0, t+1);
  L.draw(data.left[t], leftTraj, null, null, { trajC: "rgba(255,64,96,0.75)", ptC: "#ff4060" });

  var midTraj = data.mid.slice(0, t+1);
  var midSlotsArr = [], curSl = [];
  for (var s=0; s<3; s++) {
    midSlotsArr.push(data.tSl[s].slice(0, t+1));
    curSl.push(data.tSl[s][Math.min(t, data.tSl[s].length-1)]);
  }
  M.draw(data.mid[t], midTraj, curSl, midSlotsArr, {
    trajC: "rgba(0,230,118,0.75)", ptC: "#00e676", showSlots: true
  });

  var maxCov = coverage(data.mid, N);
  var covL = coverage(data.left, t), covM = coverage(data.mid, t);
  document.getElementById("barL").style.width = (covL/maxCov*100).toFixed(0) + "%";
  document.getElementById("barM").style.width = (covM/maxCov*100).toFixed(0) + "%";
  document.getElementById("pctL").textContent = (covL/maxCov*100).toFixed(0) + "%";
  document.getElementById("pctM").textContent = (covM/maxCov*100).toFixed(0) + "%";

  var anns = { L: document.getElementById("annL"), M: document.getElementById("annM"),
               bottom: document.getElementById("annB") };
  var found = { L: null, M: null, bottom: null };
  for (var i = allAnnotations.length-1; i >=0; i--) {
    var a = allAnnotations[i];
    if (t >= a.t && !found[a.side]) found[a.side] = a;
    if (found.L && found.M && found.bottom) break;
  }

  Object.keys(anns).forEach(function(k) {
    var el = anns[k], msg = found[k];
    if (msg) {
      el.textContent = msg.text; el.className = "annotation show " + msg.style;
    } else {
      el.classList.remove("show");
    }
  });

  document.getElementById("tl").textContent = t;
  document.getElementById("results-table").classList.toggle("visible", t >= N);
}

scrub.addEventListener("input", function() { drawAt(+scrub.value); });

var playing = false, playTimer = null;
document.getElementById("btn-play").addEventListener("click", function() {
  if (playing) {
    playing = false; if (playTimer) clearTimeout(playTimer);
    document.getElementById("btn-play").textContent = "播放"; return;
  }
  playing = true; document.getElementById("btn-play").textContent = "暂停";
  var t = +scrub.value;
  (function step() {
    if (!playing) return;
    t++; if (t > N) { playing = false; document.getElementById("btn-play").textContent = "重播"; return; }
    scrub.value = t; drawAt(t); playTimer = setTimeout(step, 28);
  })();
});

document.getElementById("btn-replay").addEventListener("click", function() {
  playing = false; if (playTimer) clearTimeout(playTimer);
  document.getElementById("btn-play").textContent = "播放";
  scrub.value = 0; drawAt(0); document.getElementById("results-table").classList.remove("visible");
});

drawAt(0);
</script>
</body>
</html>
