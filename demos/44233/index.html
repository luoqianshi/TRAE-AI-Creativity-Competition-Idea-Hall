<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创意星云 - 灵感可视化</title>
    <!-- 引入Google字体：优雅的衬线标题字体和中文正文字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ========== 全局样式重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* ========== 深空渐变背景 ========== */
        body {
            background: radial-gradient(ellipse at center, #1a1a3e 0%, #0a0a1a 50%, #050510 100%);
            position: relative;
        }

        /* ========== Canvas画布层：粒子、星辰、连接线 ========== */
        #starCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: pointer;
        }

        /* ========== 标题区域 ========== */
        .header {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            animation: fadeInDown 1.5s ease-out 0.5s forwards;
        }

        .title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 3rem;
            font-weight: 700;
            color: #ffd700;
            text-shadow: 
                0 0 10px rgba(255, 215, 0, 0.8),
                0 0 20px rgba(255, 215, 0, 0.5),
                0 0 40px rgba(255, 215, 0, 0.3),
                0 0 80px rgba(255, 215, 0, 0.1);
            letter-spacing: 0.3em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 300;
            letter-spacing: 0.5em;
            text-transform: uppercase;
        }

        /* ========== 操作提示 ========== */
        .hint {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            animation: pulse 2s ease-in-out infinite;
            pointer-events: none;
        }

        /* ========== 详情面板：玻璃拟态风格 ========== */
        .detail-panel {
            position: fixed;
            top: 0;
            right: -480px;
            width: 450px;
            height: 100%;
            background: rgba(20, 20, 50, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
            padding: 60px 40px 40px;
            transition: right 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            box-shadow: -10px 0 50px rgba(0, 0, 0, 0.5);
        }

        .detail-panel.active {
            right: 0;
        }

        /* 关闭按钮 */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        /* 详情面板内容样式 */
        .idea-category {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            margin-bottom: 20px;
        }

        .idea-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 2rem;
            color: white;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .idea-divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #ffd700, transparent);
            margin-bottom: 25px;
            border-radius: 2px;
        }

        .idea-description {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            line-height: 1.8;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .idea-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tag {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .tag:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .related-title {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.1em;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .related-ideas {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .related-item {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border-left: 3px solid;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .related-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }

        .related-item-name {
            color: white;
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .related-item-category {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
        }

        /* ========== 遮罩层：点击空白处关闭面板 ========== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 50;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* ========== 动画关键帧 ========== */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.4;
            }
            50% {
                opacity: 0.8;
            }
        }

        /* ========== 响应式适配 ========== */
        @media (max-width: 768px) {
            .title {
                font-size: 1.8rem;
            }
            .subtitle {
                font-size: 0.7rem;
                letter-spacing: 0.3em;
            }
            .detail-panel {
                width: 100%;
                right: -100%;
            }
            .hint {
                font-size: 0.75rem;
                bottom: 20px;
            }
        }

        /* 自定义滚动条 */
        .detail-panel::-webkit-scrollbar {
            width: 6px;
        }

        .detail-panel::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .detail-panel::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .detail-panel::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <!-- 标题区域 -->
    <header class="header">
        <h1 class="title">创意星云</h1>
        <p class="subtitle">Creative Nebula</p>
    </header>

    <!-- 画布：用于绘制粒子、星辰、连接线 -->
    <canvas id="starCanvas"></canvas>

    <!-- 操作提示 -->
    <div class="hint">✨ 点击星辰探索创意灵感</div>

    <!-- 遮罩层 -->
    <div class="overlay" id="overlay"></div>

    <!-- 详情面板 -->
    <div class="detail-panel" id="detailPanel">
        <button class="close-btn" id="closeBtn">×</button>
        <div id="panelContent"></div>
    </div>

    <script>
        // ========== 获取DOM元素 ==========
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        const detailPanel = document.getElementById('detailPanel');
        const overlay = document.getElementById('overlay');
        const closeBtn = document.getElementById('closeBtn');
        const panelContent = document.getElementById('panelContent');

        // ========== 画布尺寸设置 ==========
        let width, height;
        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ========== 创意想法数据 ==========
        const ideas = [
            {
                id: 1,
                category: '科技',
                title: 'AI梦境可视化工具',
                description: '利用脑机接口技术捕捉睡眠时的脑电波信号，通过AI算法将抽象的梦境转化为可观看的视觉影像。用户醒来后可以立即"回放"自己的梦境，甚至可以与他人分享、编辑和二次创作。',
                tags: ['人工智能', '脑机接口', '视觉生成', '神经科学'],
                color: '#00f5ff',
                connections: [2, 5],
                baseX: 0.2,
                baseY: 0.3,
                size: 25
            },
            {
                id: 2,
                category: '艺术',
                title: '声音绘画装置',
                description: '一个交互式艺术装置，观众的声音、说话、甚至心跳都能实时转化为绚丽的视觉画面。不同频率和音量对应不同的色彩和笔触，每个人都能创作出独一无二的"声音画作"。',
                tags: ['交互艺术', '声音可视化', '装置艺术', '实时渲染'],
                color: '#ff6b9d',
                connections: [1, 3],
                baseX: 0.75,
                baseY: 0.25,
                size: 30
            },
            {
                id: 3,
                category: '设计',
                title: '情绪色彩生成器',
                description: '通过人脸识别和声纹分析感知用户当前的情绪状态，自动生成匹配当下心情的配色方案。设计师可以用它快速获取灵感，普通人也能用它为生活空间选择合适的色彩氛围。',
                tags: ['色彩心理学', '情感计算', '设计工具', '人机交互'],
                color: '#50fa7b',
                connections: [2, 4],
                baseX: 0.3,
                baseY: 0.7,
                size: 22
            },
            {
                id: 4,
                category: '生活',
                title: '记忆气味博物馆',
                description: '一个能记录和重现气味的设备。你可以保存童年外婆家饭菜的香气、雨后青草的味道、恋人身上的气息...多年后再次闻到，记忆会瞬间被唤醒，仿佛穿越回那个特定的时刻。',
                tags: ['嗅觉科技', '记忆保存', '感官体验', '情感产品'],
                color: '#ffd700',
                connections: [3, 5],
                baseX: 0.8,
                baseY: 0.65,
                size: 28
            },
            {
                id: 5,
                category: '音乐',
                title: '植物乐章合成器',
                description: '连接植物的生物传感器，将植物的生物电流、光合作用节律转化为音乐。每一种植物都有自己独特的"声音"，不同时间、不同天气下演奏出的乐章也各不相同，聆听自然的低语。',
                tags: ['生物艺术', '生成音乐', '自然科技', '实验音乐'],
                color: '#bd93f9',
                connections: [1, 4, 6],
                baseX: 0.15,
                baseY: 0.55,
                size: 26
            },
            {
                id: 6,
                category: '文学',
                title: '随机诗境生成器',
                description: '结合天气、时间、地理位置、用户心情等多维数据，实时生成独一无二的诗歌。它不仅是文字的组合，更会配上应景的视觉画面和环境音效，创造沉浸式的诗意瞬间。',
                tags: ['生成文学', '自然语言处理', '诗意计算', '多媒体'],
                color: '#ff8c42',
                connections: [5, 7],
                baseX: 0.5,
                baseY: 0.15,
                size: 24
            },
            {
                id: 7,
                category: '游戏',
                title: '时间迷宫探险',
                description: '一款时间可以自由操控的解谜游戏。玩家可以倒放、暂停、快进时间，在不同时间线中探索因果关系。你的一个微小选择可能会在另一条时间线上引发意想不到的结果。',
                tags: ['时间机制', '解谜游戏', '非线性叙事', '因果悖论'],
                color: '#ff4757',
                connections: [6, 8],
                baseX: 0.65,
                baseY: 0.8,
                size: 27
            },
            {
                id: 8,
                category: '建筑',
                title: '云朵城市构想',
                description: '利用超轻材料和反重力技术在云层之上建造的悬浮城市。建筑会像云朵一样缓慢流动变形，居民乘坐个人飞行器穿梭其间，与鸟类为伴，在天空中过着诗意的栖居生活。',
                tags: ['未来建筑', '悬浮城市', '低碳生活', '天空居住'],
                color: '#8be9fd',
                connections: [7, 4],
                baseX: 0.4,
                baseY: 0.45,
                size: 32
            }
        ];

        // ========== 远景粒子星星 ==========
        class BackgroundStar {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.5 + 0.5;
                this.baseOpacity = Math.random() * 0.5 + 0.2;
                this.opacity = this.baseOpacity;
                this.twinkleSpeed = Math.random() * 0.02 + 0.005;
                this.phase = Math.random() * Math.PI * 2;
            }
            
            update(time) {
                this.opacity = this.baseOpacity + Math.sin(time * this.twinkleSpeed + this.phase) * 0.3;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        // ========== 主星辰类 ==========
        class Star {
            constructor(idea) {
                this.idea = idea;
                this.x = idea.baseX * width;
                this.y = idea.baseY * height;
                this.baseX = this.x;
                this.baseY = this.y;
                this.size = idea.size;
                this.baseSize = idea.size;
                this.color = idea.color;
                this.angle = Math.random() * Math.PI * 2;
                this.orbitRadius = Math.random() * 30 + 20;
                this.orbitSpeed = Math.random() * 0.0005 + 0.0003;
                this.pulsePhase = Math.random() * Math.PI * 2;
                this.isHovered = false;
                this.isSelected = false;
                this.scale = 0;
                this.targetScale = 1;
            }
            
            update(time, mouseX, mouseY) {
                // 入场缩放动画
                this.scale += (this.targetScale - this.scale) * 0.05;
                
                // 圆周漂浮运动
                this.angle += this.orbitSpeed;
                this.x = this.baseX + Math.cos(this.angle) * this.orbitRadius;
                this.y = this.baseY + Math.sin(this.angle) * this.orbitRadius;
                
                // 鼠标视差效果（根据距离中心的偏移产生深度感）
                const parallaxFactor = 0.03;
                const centerX = width / 2;
                const centerY = height / 2;
                const offsetX = (mouseX - centerX) * parallaxFactor;
                const offsetY = (mouseY - centerY) * parallaxFactor;
                this.x += offsetX;
                this.y += offsetY;
                
                // 呼吸效果
                const pulse = Math.sin(time * 0.002 + this.pulsePhase) * 0.15 + 1;
                let currentSize = this.baseSize * pulse * this.scale;
                
                // 悬停放大效果
                if (this.isHovered) {
                    currentSize *= 1.5;
                }
                
                // 选中脉冲效果
                if (this.isSelected) {
                    currentSize *= 1.3 + Math.sin(time * 0.005) * 0.2;
                }
                
                this.size = currentSize;
            }
            
            draw() {
                // 外层光晕
                const gradient1 = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 4);
                gradient1.addColorStop(0, this.color + '60');
                gradient1.addColorStop(0.3, this.color + '20');
                gradient1.addColorStop(1, 'transparent');
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
                ctx.fillStyle = gradient1;
                ctx.fill();
                
                // 中层光晕
                const gradient2 = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2);
                gradient2.addColorStop(0, this.color + 'aa');
                gradient2.addColorStop(0.5, this.color + '40');
                gradient2.addColorStop(1, 'transparent');
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                ctx.fillStyle = gradient2;
                ctx.fill();
                
                // 核心球体
                const gradient3 = ctx.createRadialGradient(
                    this.x - this.size * 0.3, 
                    this.y - this.size * 0.3, 
                    0, 
                    this.x, 
                    this.y, 
                    this.size
                );
                gradient3.addColorStop(0, '#ffffff');
                gradient3.addColorStop(0.3, this.color);
                gradient3.addColorStop(1, this.color + '80');
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = gradient3;
                ctx.fill();
                
                // 十字星芒
                ctx.strokeStyle = this.color + '80';
                ctx.lineWidth = 2;
                const rayLength = this.size * 2.5;
                
                // 水平光线
                ctx.beginPath();
                ctx.moveTo(this.x - rayLength, this.y);
                ctx.lineTo(this.x + rayLength, this.y);
                ctx.stroke();
                
                // 垂直光线
                ctx.beginPath();
                ctx.moveTo(this.x, this.y - rayLength);
                ctx.lineTo(this.x, this.y + rayLength);
                ctx.stroke();
            }
            
            // 检测点是否在星辰范围内
            contains(px, py) {
                const dx = px - this.x;
                const dy = py - this.y;
                return dx * dx + dy * dy < this.size * this.size * 4;
            }
        }

        // ========== 初始化背景星星 ==========
        const backgroundStars = [];
        for (let i = 0; i < 200; i++) {
            backgroundStars.push(new BackgroundStar());
        }

        // ========== 初始化创意星辰 ==========
        const stars = ideas.map(idea => new Star(idea));

        // ========== 鼠标状态 ==========
        let mouseX = width / 2;
        let mouseY = height / 2;
        let selectedStar = null;
        let hoveredStar = null;

        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            // 检测悬停
            hoveredStar = null;
            for (let i = stars.length - 1; i >= 0; i--) {
                if (stars[i].contains(mouseX, mouseY)) {
                    hoveredStar = stars[i];
                    canvas.style.cursor = 'pointer';
                    break;
                }
            }
            if (!hoveredStar) {
                canvas.style.cursor = 'default';
            }
            
            // 更新所有星辰的悬停状态
            stars.forEach(star => {
                star.isHovered = star === hoveredStar;
            });
        });

        canvas.addEventListener('click', (e) => {
            const clickX = e.clientX;
            const clickY = e.clientY;
            
            // 检测点击的星辰（从后往前检测，优先选中上层的）
            for (let i = stars.length - 1; i >= 0; i--) {
                if (stars[i].contains(clickX, clickY)) {
                    selectStar(stars[i]);
                    return;
                }
            }
        });

        // ========== 选中星辰，显示详情面板 ==========
        function selectStar(star) {
            // 更新选中状态
            stars.forEach(s => s.isSelected = false);
            star.isSelected = true;
            selectedStar = star;
            
            // 填充详情面板内容
            const idea = star.idea;
            const relatedIdeas = idea.connections.map(id => ideas.find(i => i.id === id));
            
            panelContent.innerHTML = `
                <div class="idea-category" style="background: ${idea.color}30; color: ${idea.color}; border: 1px solid ${idea.color}50;">
                    ${idea.category}
                </div>
                <h2 class="idea-title">${idea.title}</h2>
                <div class="idea-divider" style="background: linear-gradient(90deg, ${idea.color}, transparent);"></div>
                <p class="idea-description">${idea.description}</p>
                <div class="idea-tags">
                    ${idea.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
                </div>
                <div class="related-title">✨ 相关灵感</div>
                <div class="related-ideas">
                    ${relatedIdeas.map(related => `
                        <div class="related-item" style="border-left-color: ${related.color};" data-id="${related.id}">
                            <div class="related-item-name">${related.title}</div>
                            <div class="related-item-category">${related.category}</div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            // 为相关灵感添加点击事件
            document.querySelectorAll('.related-item').forEach(item => {
                item.addEventListener('click', () => {
                    const relatedId = parseInt(item.dataset.id);
                    const relatedStar = stars.find(s => s.idea.id === relatedId);
                    if (relatedStar) {
                        selectStar(relatedStar);
                    }
                });
            });
            
            // 显示面板和遮罩
            detailPanel.classList.add('active');
            overlay.classList.add('active');
        }

        // ========== 关闭详情面板 ==========
        function closePanel() {
            detailPanel.classList.remove('active');
            overlay.classList.remove('active');
            if (selectedStar) {
                selectedStar.isSelected = false;
                selectedStar = null;
            }
        }

        closeBtn.addEventListener('click', closePanel);
        overlay.addEventListener('click', closePanel);

        // ========== 绘制连接线 ==========
        function drawConnections(time) {
            stars.forEach(star => {
                const idea = star.idea;
                idea.connections.forEach(connectedId => {
                    // 避免重复绘制
                    if (connectedId < idea.id) return;
                    
                    const connectedStar = stars.find(s => s.idea.id === connectedId);
                    if (!connectedStar) return;
                    
                    // 计算距离，太远的线淡化
                    const dx = connectedStar.x - star.x;
                    const dy = connectedStar.y - star.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const maxDistance = Math.sqrt(width * width + height * height) * 0.5;
                    let opacity = 1 - distance / maxDistance;
                    opacity = Math.max(0.1, opacity * 0.4);
                    
                    // 选中时连接线高亮
                    const isHighlighted = selectedStar && 
                        (selectedStar === star || selectedStar === connectedStar);
                    if (isHighlighted) {
                        opacity = 0.8;
                    }
                    
                    // 绘制贝塞尔曲线（控制点偏向中心，形成优美弧线）
                    const midX = (star.x + connectedStar.x) / 2;
                    const midY = (star.y + connectedStar.y) / 2;
                    const centerX = width / 2;
                    const centerY = height / 2;
                    const cpX = midX + (centerX - midX) * 0.3;
                    const cpY = midY + (centerY - midY) * 0.3;
                    
                    ctx.beginPath();
                    ctx.moveTo(star.x, star.y);
                    ctx.quadraticCurveTo(cpX, cpY, connectedStar.x, connectedStar.y);
                    
                    // 渐变颜色
                    const gradient = ctx.createLinearGradient(star.x, star.y, connectedStar.x, connectedStar.y);
                    gradient.addColorStop(0, star.color + Math.floor(opacity * 255).toString(16).padStart(2, '0'));
                    gradient.addColorStop(1, connectedStar.color + Math.floor(opacity * 255).toString(16).padStart(2, '0'));
                    
                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = isHighlighted ? 3 : 1;
                    ctx.stroke();
                });
            });
        }

        // ========== 主渲染循环 ==========
        let startTime = Date.now();
        function animate() {
            const time = Date.now() - startTime;
            
            // 清空画布
            ctx.clearRect(0, 0, width, height);
            
            // 绘制背景星星
            backgroundStars.forEach(star => {
                star.update(time);
                star.draw();
            });
            
            // 绘制连接线
            drawConnections(time);
            
            // 更新并绘制主星辰
            stars.forEach(star => {
                star.update(time, mouseX, mouseY);
                star.draw();
            });
            
            requestAnimationFrame(animate);
        }

        // 延迟启动入场动画
        setTimeout(() => {
            animate();
        }, 300);

        // 页面加载完成后星辰依次入场
        stars.forEach((star, index) => {
            star.targetScale = 0;
            setTimeout(() => {
                star.targetScale = 1;
            }, 500 + index * 150);
        });
    </script>
</body>
