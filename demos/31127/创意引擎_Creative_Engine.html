<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创意引擎 | Creative Engine - TRAE 创意大赛作品</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #0a0a0f;
            --color-primary: #e8d5b7;
            --color-accent: #ff6b35;
            --color-secondary: #7b68ee;
            --color-text: #f5f5f5;
            --color-muted: #888;
            --font-display: 'Noto Serif SC', serif;
            --font-mono: 'Space Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-mono);
            background: var(--color-bg);
            color: var(--color-text);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Noise texture overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 1000;
        }

        /* Canvas for particles */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Main content */
        .content {
            position: relative;
            z-index: 10;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 700;
            text-align: center;
            opacity: 0;
            animation: fadeSlideUp 1.2s ease-out 0.3s forwards;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 50%, var(--color-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
        }

        .hero-subtitle {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            color: var(--color-muted);
            margin-top: 1.5rem;
            opacity: 0;
            animation: fadeSlideUp 1.2s ease-out 0.6s forwards;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        .hero-tagline {
            font-family: var(--font-display);
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: var(--color-primary);
            margin-top: 3rem;
            opacity: 0;
            animation: fadeSlideUp 1.2s ease-out 0.9s forwards;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            animation: fadeSlideUp 1.2s ease-out 1.2s forwards, bounce 2s ease-in-out 2.4s infinite;
        }

        .scroll-indicator svg {
            width: 30px;
            height: 30px;
            stroke: var(--color-accent);
        }

        /* Interactive Section */
        .interactive-section {
            min-height: 100vh;
            padding: 4rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .section-title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: var(--color-primary);
            margin-bottom: 1rem;
            text-align: center;
        }

        .section-desc {
            color: var(--color-muted);
            text-align: center;
            max-width: 600px;
            margin-bottom: 3rem;
            font-size: 1rem;
        }

        .creative-canvas {
            width: min(90vw, 700px);
            height: min(70vh, 500px);
            background: linear-gradient(145deg, rgba(30, 30, 40, 0.8), rgba(15, 15, 25, 0.9));
            border-radius: 20px;
            border: 1px solid rgba(232, 213, 183, 0.1);
            position: relative;
            cursor: crosshair;
            overflow: hidden;
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.5),
                inset 0 0 100px rgba(123, 104, 238, 0.05);
        }

        .creative-canvas::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, var(--color-secondary), transparent 30%);
            animation: rotate 4s linear infinite;
            opacity: 0.1;
        }

        .canvas-content {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .canvas-prompt {
            font-size: 1.2rem;
            color: var(--color-text);
            text-align: center;
            opacity: 0.8;
        }

        .idea-counter {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            font-size: 0.9rem;
            color: var(--color-accent);
            background: rgba(255, 107, 53, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 107, 53, 0.3);
        }

        /* Control buttons */
        .controls {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            font-family: var(--font-mono);
            font-size: 0.95rem;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-accent), #ff8f5a);
            color: var(--color-bg);
            font-weight: 700;
        }

        .btn-secondary {
            background: transparent;
            color: var(--color-primary);
            border: 1px solid var(--color-primary);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        /* Ideas Gallery */
        .ideas-section {
            padding: 6rem 2rem;
            background: linear-gradient(180deg, transparent, rgba(123, 104, 238, 0.05), transparent);
        }

        .ideas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 3rem auto 0;
        }

        .idea-card {
            background: linear-gradient(145deg, rgba(30, 30, 40, 0.6), rgba(20, 20, 30, 0.8));
            border-radius: 16px;
            padding: 2rem;
            border: 1px solid rgba(232, 213, 183, 0.08);
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .idea-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .idea-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--color-accent), var(--color-secondary));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }

        .idea-card:hover::before {
            transform: scaleX(1);
        }

        .idea-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .idea-number {
            font-family: var(--font-display);
            font-size: 3rem;
            font-weight: 700;
            color: var(--color-secondary);
            opacity: 0.3;
            position: absolute;
            top: 1rem;
            right: 1.5rem;
        }

        .idea-title {
            font-family: var(--font-display);
            font-size: 1.4rem;
            color: var(--color-primary);
            margin-bottom: 1rem;
        }

        .idea-desc {
            color: var(--color-muted);
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .idea-tag {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.4rem 1rem;
            background: rgba(123, 104, 238, 0.15);
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--color-secondary);
        }

        /* Philosophy Section */
        .philosophy-section {
            padding: 8rem 2rem;
            text-align: center;
            position: relative;
        }

        .philosophy-quote {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: var(--color-primary);
            max-width: 900px;
            margin: 0 auto;
            line-height: 1.8;
            position: relative;
        }

        .philosophy-quote::before,
        .philosophy-quote::after {
            content: '"';
            font-size: 4rem;
            color: var(--color-accent);
            opacity: 0.5;
            position: absolute;
        }

        .philosophy-quote::before {
            top: -1rem;
            left: -2rem;
        }

        .philosophy-quote::after {
            bottom: -2rem;
            right: -2rem;
            transform: rotate(180deg);
        }

        .author {
            margin-top: 2rem;
            color: var(--color-muted);
            font-size: 1rem;
        }

        /* Stats Section */
        .stats-section {
            padding: 6rem 2rem;
            background: linear-gradient(180deg, transparent, rgba(255, 107, 53, 0.03), transparent);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 3rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        .stat-item {
            text-align: center;
            padding: 2rem;
        }

        .stat-number {
            font-family: var(--font-display);
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-accent), var(--color-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: var(--color-muted);
            margin-top: 0.5rem;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        /* Footer */
        .footer {
            padding: 4rem 2rem;
            text-align: center;
            border-top: 1px solid rgba(232, 213, 183, 0.1);
        }

        .footer-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: var(--color-primary);
            margin-bottom: 1rem;
        }

        .footer-text {
            color: var(--color-muted);
            font-size: 0.9rem;
        }

        .footer-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 2rem;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.1), rgba(123, 104, 238, 0.1));
            border-radius: 30px;
            border: 1px solid rgba(232, 213, 183, 0.2);
        }

        .footer-badge svg {
            width: 20px;
            height: 20px;
        }

        /* Animations */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(10px);
            }
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        /* Generated ideas appear animation */
        .idea-generated {
            animation: ideaAppear 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes ideaAppear {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(20px);
            }
            50% {
                transform: scale(1.02) translateY(-5px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-title {
                font-size: clamp(2.5rem, 15vw, 5rem);
            }

            .creative-canvas {
                height: 400px;
            }

            .philosophy-quote::before,
            .philosophy-quote::after {
                display: none;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Focus styles */
        .btn:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 3px;
        }

        /* Selection */
        ::selection {
            background: var(--color-accent);
            color: var(--color-bg);
        }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>

    <div class="content">
        <!-- Hero Section -->
        <section class="hero">
            <h1 class="hero-title">创意引擎</h1>
            <p class="hero-subtitle">Creative Engine</p>
            <p class="hero-tagline">世界很大，放手去造</p>
            <div class="scroll-indicator">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M19 12l-7 7-7-7"/>
                </svg>
            </div>
        </section>

        <!-- Interactive Section -->
        <section class="interactive-section">
            <h2 class="section-title">点击释放创意</h2>
            <p class="section-desc">在画布上点击或移动鼠标，让创意的火花绽放。每一次点击都是一次灵感的迸发。</p>
            
            <div class="creative-canvas" id="creativeCanvas">
                <div class="idea-counter">创意火花: <span id="ideaCount">0</span></div>
                <div class="canvas-content">
                    <p class="canvas-prompt" id="canvasPrompt">↓ 在这里点击或移动鼠标 ↓</p>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="generateBtn">生成创意想法</button>
                <button class="btn btn-secondary" id="clearBtn">清空画布</button>
            </div>
        </section>

        <!-- Ideas Gallery -->
        <section class="ideas-section">
            <h2 class="section-title">灵感图谱</h2>
            <p class="section-desc">点击"生成创意想法"按钮，AI 将为你展现创意的无限可能</p>
            
            <div class="ideas-grid" id="ideasGrid">
                <!-- Ideas will be dynamically generated -->
            </div>
        </section>

        <!-- Philosophy Section -->
        <section class="philosophy-section">
            <blockquote class="philosophy-quote">
                创意不是天赋，而是每个人都能点燃的火焰。当 AI 成为你的创意伙伴，想象力的边界将被重新定义。
            </blockquote>
            <p class="author">— TRAE 创意大赛</p>
        </section>

        <!-- Stats Section -->
        <section class="stats-section">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-number" data-target="10000">0</div>
                    <div class="stat-label">创意可能</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" data-target="∞">∞</div>
                    <div class="stat-label">想象空间</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" data-target="1">0</div>
                    <div class="stat-label">你的灵感</div>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <h3 class="footer-title">创意引擎 Creative Engine</h3>
            <p class="footer-text">由 TRAE AI 辅助生成 · 参加 TRAE 创意大赛</p>
            <div class="footer-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <span>TRAE AI 创意作品</span>
            </div>
        </footer>
    </div>

    <script>
        // ===== Particle System =====
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouseX = 0;
        let mouseY = 0;
        let ideaCount = 0;

        // Resize canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Particle class
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 4 + 2;
                this.speedX = (Math.random() - 0.5) * 3;
                this.speedY = (Math.random() - 0.5) * 3;
                this.life = 1;
                this.decay = Math.random() * 0.015 + 0.005;
                this.hue = Math.random() * 60 + 20; // Orange to yellow range
                this.gravity = 0.05;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += this.gravity;
                this.speedX *= 0.99;
                this.life -= this.decay;
                this.size *= 0.98;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = `hsl(${this.hue}, 100%, 60%)`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = `hsl(${this.hue}, 100%, 50%)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Create particles on click
        function createParticles(x, y, count = 20) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y));
            }
        }

        // Mouse tracking
        const creativeCanvas = document.getElementById('creativeCanvas');
        creativeCanvas.addEventListener('click', (e) => {
            const rect = creativeCanvas.getBoundingClientRect();
            const x = e.clientX;
            const y = e.clientY;
            createParticles(x, y, 30);
            ideaCount++;
            updateIdeaCount();
            
            // Update prompt text
            const prompt = document.getElementById('canvasPrompt');
            const messages = [
                '创意火花绽放中...',
                '灵感正在涌现...',
                '想法正在成形...',
                '继续探索更多可能...'
            ];
            prompt.textContent = messages[Math.floor(Math.random() * messages.length)];
        });

        creativeCanvas.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.85) {
                createParticles(e.clientX, e.clientY, 5);
            }
        });

        // Touch support
        creativeCanvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            createParticles(touch.clientX, touch.clientY, 30);
            ideaCount++;
            updateIdeaCount();
        });

        creativeCanvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            if (Math.random() > 0.7) {
                createParticles(touch.clientX, touch.clientY, 3);
            }
        });

        function updateIdeaCount() {
            const countEl = document.getElementById('ideaCount');
            countEl.textContent = ideaCount;
            countEl.style.animation = 'none';
            countEl.offsetHeight; // Trigger reflow
            countEl.style.animation = 'pulse 0.3s ease';
        }

        // Animation loop
        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 15, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach((particle, index) => {
                particle.update();
                particle.draw();
                if (particle.life <= 0) {
                    particles.splice(index, 1);
                }
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Clear canvas button
        document.getElementById('clearBtn').addEventListener('click', () => {
            particles = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('canvasPrompt').textContent = '↓ 在这里点击或移动鼠标 ↓';
        });

        // ===== Ideas Generation =====
        const ideas = [
            {
                title: '智能色彩交响曲',
                desc: '一个能根据用户情绪自动生成配色方案的AI工具，让设计从灵感到实现无缝衔接。',
                tag: '设计工具'
            },
            {
                title: '声音可视化实验室',
                desc: '将音乐转化为独特的视觉艺术，让每个人都能看见自己喜爱的旋律。',
                tag: '艺术创作'
            },
            {
                title: '城市记忆拼图',
                desc: '用AI重塑城市街景，将老照片与新技术结合，打造沉浸式的时光旅行体验。',
                tag: 'AR/VR'
            },
            {
                title: '创意写作伙伴',
                desc: '不只是写作助手，更是激发灵感的创意伙伴，帮助突破创作瓶颈。',
                tag: 'AI助手'
            },
            {
                title: '生态数据画廊',
                desc: '将环境数据转化为艺术品，让气候变化不再是冰冷的数字。',
                tag: '数据可视化'
            },
            {
                title: '手语翻译精灵',
                desc: '实时手语识别与翻译，为听障人士搭建无障碍沟通的桥梁。',
                tag: '无障碍'
            },
            {
                title: '梦境编辑器',
                desc: '记录并可视化你的梦境，用AI探索潜意识的无限疆域。',
                tag: '心理健康'
            },
            {
                title: '风味配方AI',
                desc: '上传食材照片，AI为你量身定制创意食谱，发现意想不到的美食组合。',
                tag: '生活创意'
            }
        ];

        function renderIdeas(count = 3) {
            const grid = document.getElementById('ideasGrid');
            const shuffled = [...ideas].sort(() => Math.random() - 0.5);
            const selected = shuffled.slice(0, count);

            selected.forEach((idea, index) => {
                const card = document.createElement('div');
                card.className = 'idea-card idea-generated';
                card.style.animationDelay = `${index * 0.2}s`;
                card.innerHTML = `
                    <span class="idea-number">${String(index + 1).padStart(2, '0')}</span>
                    <h3 class="idea-title">${idea.title}</h3>
                    <p class="idea-desc">${idea.desc}</p>
                    <span class="idea-tag">${idea.tag}</span>
                `;
                grid.appendChild(card);

                // Trigger visibility animation
                setTimeout(() => {
                    card.classList.add('visible');
                }, 100 + index * 200);
            });
        }

        document.getElementById('generateBtn').addEventListener('click', () => {
            const grid = document.getElementById('ideasGrid');
            grid.innerHTML = '';
            renderIdeas(6);
        });

        // Initial render
        setTimeout(() => {
            renderIdeas(3);
        }, 1500);

        // ===== Stats Counter Animation =====
        const statsObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const statNumbers = entry.target.querySelectorAll('.stat-number');
                    statNumbers.forEach(stat => {
                        const target = stat.getAttribute('data-target');
                        if (target !== '∞' && target !== '1') {
                            animateCounter(stat, parseInt(target));
                        } else if (target === '1') {
                            animateCounter(stat, 1);
                        }
                    });
                    statsObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.5 });

        statsObserver.observe(document.querySelector('.stats-section'));

        function animateCounter(element, target) {
            let current = 0;
            const increment = target / 50;
            const timer = setInterval(() => {
                current += increment;
                if (current >= target) {
                    element.textContent = target.toLocaleString();
                    clearInterval(timer);
                } else {
                    element.textContent = Math.floor(current).toLocaleString();
                }
            }, 30);
        }

        // ===== Scroll Animations =====
        const scrollObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.2 });

        document.querySelectorAll('.idea-card').forEach(card => {
            scrollObserver.observe(card);
        });

        // ===== Keyboard Accessibility =====
        creativeCanvas.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                const rect = creativeCanvas.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                createParticles(centerX, centerY, 30);
                ideaCount++;
                updateIdeaCount();
            }
        });
        creativeCanvas.setAttribute('tabindex', '0');
        creativeCanvas.setAttribute('role', 'button');
        creativeCanvas.setAttribute('aria-label', '创意画布：点击或按回车键生成创意火花');
    </script>
</body>
</html>
