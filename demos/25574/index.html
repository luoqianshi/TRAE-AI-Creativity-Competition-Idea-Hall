<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>万物皆可非遗 — 纹样/工艺生成器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700;900&family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-paper: #F9F7F1;
            --bg-paper-dark: #F0EDE6;
            --ink-black: #222222;
            --ink-gray: #666666;
            --ink-light: #999999;
            --cinnabar: #D32F2F;
            --cinnabar-light: #FF6B6B;
            --cinnabar-dark: #B71C1C;
            --porcelain-blue: #1E3A5F;
            --porcelain-light: #4A90A4;
            --gold: #C9A96E;
            --shadow-soft: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-medium: 0 8px 32px rgba(0,0,0,0.1);
            --radius: 12px;
            --radius-lg: 20px;
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background: var(--bg-paper);
            color: var(--ink-black);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 宣纸纹理背景 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            max-width: 1440px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            position: relative;
            z-index: 1;
        }

        /* ============================================
           左栏：创作控制台
           ============================================ */
        .left-panel {
            width: 420px;
            min-width: 420px;
            background: linear-gradient(180deg, #FFFFFF 0%, var(--bg-paper) 100%);
            border-right: 1px solid rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(0,0,0,0.1) transparent;
        }

        .left-panel::-webkit-scrollbar {
            width: 4px;
        }

        .left-panel::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.1);
            border-radius: 2px;
        }

        .panel-header {
            padding: 32px 28px 20px;
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--cinnabar) 0%, var(--cinnabar-dark) 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 22px;
            box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
        }

        .logo-text h1 {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 22px;
            font-weight: 400;
            letter-spacing: 2px;
            color: var(--ink-black);
        }

        .logo-text p {
            font-size: 12px;
            color: var(--ink-light);
            margin-top: 2px;
            letter-spacing: 1px;
        }

        .panel-content {
            flex: 1;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-gray);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 16px;
            background: var(--cinnabar);
            border-radius: 2px;
        }

        /* 富媒体上传区 */
        .upload-area {
            border: 2px dashed rgba(0,0,0,0.12);
            border-radius: var(--radius-lg);
            padding: 40px 24px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            background: rgba(255,255,255,0.6);
        }

        .upload-area:hover {
            border-color: var(--cinnabar);
            background: rgba(211, 47, 47, 0.02);
        }

        .upload-area.dragover {
            border-color: var(--cinnabar);
            background: rgba(211, 47, 47, 0.05);
            transform: scale(1.01);
        }

        .upload-area.has-image {
            padding: 0;
            border-style: solid;
            border-color: rgba(0,0,0,0.08);
        }

        .upload-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .upload-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--bg-paper-dark) 0%, #E8E4DC 100%);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--ink-gray);
        }

        .upload-text {
            font-size: 14px;
            color: var(--ink-gray);
            line-height: 1.6;
        }

        .upload-hint {
            font-size: 12px;
            color: var(--ink-light);
        }

        .upload-preview {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: var(--radius-lg);
            display: none;
        }

        .upload-area.has-image .upload-preview {
            display: block;
        }

        .upload-area.has-image .upload-placeholder {
            display: none;
        }

        .reupload-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            opacity: 0;
            transition: var(--transition);
            backdrop-filter: blur(8px);
        }

        .upload-area.has-image:hover .reupload-btn {
            opacity: 1;
        }

        /* 创意文本输入 */
        .prompt-input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 14px;
            color: var(--ink-black);
            background: rgba(255,255,255,0.8);
            transition: var(--transition);
            resize: none;
            line-height: 1.6;
        }

        .prompt-input:focus {
            outline: none;
            border-color: var(--cinnabar);
            box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.08);
        }

        .prompt-input::placeholder {
            color: var(--ink-light);
        }

        /* 工艺图鉴网格 */
        .style-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .style-card {
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
            aspect-ratio: 1;
        }

        .style-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-medium);
        }

        .style-card.active {
            border-color: var(--cinnabar);
            box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.1);
        }

        .style-card-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .style-card:hover .style-card-bg {
            transform: scale(1.08);
        }

        .style-card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 30%, rgba(0,0,0,0.7) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
            transition: var(--transition);
        }

        .style-card:hover .style-card-overlay {
            background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
        }

        .style-card-name {
            color: white;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .style-card-desc {
            color: rgba(255,255,255,0.8);
            font-size: 11px;
            margin-top: 4px;
            opacity: 0;
            transform: translateY(8px);
            transition: var(--transition);
            line-height: 1.4;
        }

        .style-card:hover .style-card-desc {
            opacity: 1;
            transform: translateY(0);
        }

        .style-check {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 24px;
            height: 24px;
            background: var(--cinnabar);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            opacity: 0;
            transform: scale(0.5);
            transition: var(--transition);
        }

        .style-card.active .style-check {
            opacity: 1;
            transform: scale(1);
        }

        /* 高阶设置 */
        .advanced-section {
            border-top: 1px solid rgba(0,0,0,0.06);
            padding-top: 20px;
        }

        .advanced-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            padding: 4px 0;
        }

        .advanced-toggle-text {
            font-size: 13px;
            color: var(--ink-gray);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .advanced-toggle-icon {
            transition: transform 0.3s ease;
            color: var(--ink-light);
        }

        .advanced-toggle.open .advanced-toggle-icon {
            transform: rotate(180deg);
        }

        .advanced-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }

        .advanced-content.open {
            max-height: 200px;
        }

        .slider-container {
            margin-top: 16px;
            padding: 0 4px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--ink-gray);
            margin-bottom: 10px;
        }

        .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--bg-paper-dark) 0%, var(--cinnabar) 100%);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: white;
            border: 3px solid var(--cinnabar);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: var(--transition);
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
        }

        /* 生成按钮 */
        .generate-btn-container {
            padding: 20px 28px 28px;
            background: linear-gradient(180deg, transparent 0%, var(--bg-paper) 30%);
            position: sticky;
            bottom: 0;
            z-index: 10;
        }

        .generate-btn {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, var(--cinnabar) 0%, var(--cinnabar-dark) 100%);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 17px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 16px rgba(211, 47, 47, 0.3);
            position: relative;
            overflow: hidden;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(211, 47, 47, 0.4);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .generate-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: rotate(30deg);
            transition: all 0.6s;
        }

        .generate-btn:hover::after {
            left: 100%;
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ============================================
           右栏：视觉呈现区
           ============================================ */
        .right-panel {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, var(--bg-paper) 0%, #F5F3ED 50%, var(--bg-paper-dark) 100%);
        }

        /* 初始状态 */
        .idle-state {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
            transition: opacity 0.6s ease;
        }

        .idle-state.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .ink-wash-bg {
            position: absolute;
            inset: 0;
            opacity: 0.15;
            background: 
                radial-gradient(ellipse at 30% 40%, rgba(30, 58, 95, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(211, 47, 47, 0.06) 0%, transparent 50%);
            animation: inkFloat 8s ease-in-out infinite;
        }

        @keyframes inkFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(20px, -15px) scale(1.05); }
            66% { transform: translate(-15px, 10px) scale(0.95); }
        }

        .idle-content {
            position: relative;
            z-index: 1;
        }

        .idle-poem {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 42px;
            color: var(--ink-black);
            line-height: 1.6;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInUp 1s ease forwards;
        }

        .idle-poem .highlight {
            color: var(--cinnabar);
        }

        .idle-slogan {
            font-size: 15px;
            color: var(--ink-gray);
            letter-spacing: 3px;
            opacity: 0;
            animation: fadeInUp 1s ease 0.3s forwards;
        }

        .idle-decoration {
            margin-top: 40px;
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--cinnabar), transparent);
            opacity: 0;
            animation: fadeInUp 1s ease 0.6s forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 工作状态 */
        .working-state {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
        }

        .working-state.active {
            display: flex;
        }

        /* 扫描区域 */
        .scan-area {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .scan-image-container {
            position: relative;
            width: 70%;
            max-width: 600px;
            aspect-ratio: 4/3;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-medium);
        }

        .scan-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scan-beam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--porcelain-light), transparent);
            box-shadow: 0 0 20px var(--porcelain-light), 0 0 40px rgba(74, 144, 164, 0.3);
            animation: scanMove 2s ease-in-out infinite;
        }

        @keyframes scanMove {
            0%, 100% { top: 0; }
            50% { top: calc(100% - 4px); }
        }

        .scan-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(30, 58, 95, 0.1) 0%, transparent 50%, rgba(30, 58, 95, 0.1) 100%);
            pointer-events: none;
        }

        /* 终端日志 */
        .terminal-panel {
            height: 200px;
            background: rgba(10, 10, 10, 0.92);
            border-top: 1px solid rgba(255,255,255,0.08);
            padding: 16px 24px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.8;
            color: #00ff88;
        }

        .terminal-panel::-webkit-scrollbar {
            width: 4px;
        }

        .terminal-panel::-webkit-scrollbar-thumb {
            background: rgba(0,255,136,0.3);
            border-radius: 2px;
        }

        .terminal-line {
            opacity: 0;
            animation: terminalFadeIn 0.3s ease forwards;
        }

        @keyframes terminalFadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .terminal-line.system { color: #00ff88; }
        .terminal-line.supervisor { color: #66b3ff; }
        .terminal-line.art { color: #ff9966; }
        .terminal-line.scholar { color: #ffcc66; }
        .terminal-line.export { color: #cc99ff; }
        .terminal-line.error { color: #ff6666; }

        .terminal-timestamp {
            color: #666;
            margin-right: 8px;
        }

        /* 结果状态 */
        .result-state {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            padding: 40px;
            overflow-y: auto;
        }

        .result-state.active {
            display: flex;
        }

        /* 开盲盒特效 */
        .reveal-effect {
            position: absolute;
            inset: 0;
            background: white;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .reveal-effect.active {
            display: flex;
            animation: revealFlash 1.2s ease forwards;
        }

        @keyframes revealFlash {
            0% { opacity: 1; }
            30% { opacity: 1; background: radial-gradient(circle, white 0%, transparent 70%); }
            100% { opacity: 0; pointer-events: none; }
        }

        .reveal-text {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 48px;
            color: var(--cinnabar);
            animation: revealScale 1s ease forwards;
        }

        @keyframes revealScale {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* 图片对比滑块 */
        .comparison-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-medium);
            background: #000;
        }

        .comparison-image {
            width: 100%;
            display: block;
        }

        .comparison-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            overflow: hidden;
        }

        .comparison-overlay img {
            height: 100%;
            max-width: none;
            object-fit: cover;
        }

        .comparison-slider {
            position: absolute;
            top: 0;
            left: 50%;
            width: 40px;
            height: 100%;
            transform: translateX(-50%);
            cursor: ew-resize;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .comparison-slider::before {
            content: '';
            position: absolute;
            width: 2px;
            height: 100%;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        .slider-handle {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            z-index: 1;
        }

        .slider-handle svg {
            width: 16px;
            height: 16px;
            color: var(--ink-black);
        }

        .comparison-label {
            position: absolute;
            top: 16px;
            padding: 6px 12px;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 12px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
        }

        .comparison-label.before {
            left: 16px;
        }

        .comparison-label.after {
            right: 16px;
        }

        /* 文案区 */
        .scholar-section {
            max-width: 800px;
            margin: 32px auto 0;
            padding: 28px;
            background: rgba(255,255,255,0.8);
            border-radius: var(--radius);
            border-left: 4px solid var(--cinnabar);
            backdrop-filter: blur(8px);
        }

        .scholar-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 18px;
            color: var(--cinnabar);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .scholar-content {
            font-size: 14px;
            line-height: 2;
            color: var(--ink-gray);
        }

        .scholar-content .typed-cursor {
            color: var(--cinnabar);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* 操作按钮 */
        .action-buttons {
            max-width: 800px;
            margin: 24px auto 0;
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .ghost-btn {
            padding: 12px 28px;
            background: transparent;
            border: 1.5px solid var(--ink-black);
            color: var(--ink-black);
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
        }

        .ghost-btn:hover {
            background: var(--ink-black);
            color: white;
            transform: translateY(-2px);
        }

        .ghost-btn.primary {
            border-color: var(--cinnabar);
            color: var(--cinnabar);
        }

        .ghost-btn.primary:hover {
            background: var(--cinnabar);
            color: white;
        }

        /* 响应式 */
        @media (max-width: 1024px) {
            .app-container {
                flex-direction: column;
            }
            
            .left-panel {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid rgba(0,0,0,0.06);
            }
            
            .right-panel {
                min-height: 60vh;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 左栏：创作控制台 -->
        <aside class="left-panel">
            <div class="panel-header">
                <div class="logo">
                    <div class="logo-icon">非</div>
                    <div class="logo-text">
                        <h1>万物皆可非遗</h1>
                        <p>纹样 / 工艺生成器</p>
                    </div>
                </div>
            </div>
            
            <div class="panel-content">
                <!-- 富媒体上传区 -->
                <section>
                    <div class="section-title">上传原图</div>
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-placeholder">
                            <div class="upload-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                    <polyline points="17 8 12 3 7 8"/>
                                    <line x1="12" y1="3" x2="12" y2="15"/>
                                </svg>
                            </div>
                            <div class="upload-text">点击或拖拽上传图片</div>
                            <div class="upload-hint">支持 JPG、PNG 格式，建议尺寸 1024×1024</div>
                        </div>
                        <img class="upload-preview" id="uploadPreview" alt="预览">
                        <button class="reupload-btn" id="reuploadBtn">重新上传</button>
                    </div>
                </section>
                
                <!-- 创意文本输入 -->
                <section>
                    <div class="section-title">创意题词</div>
                    <textarea class="prompt-input" id="promptInput" rows="3" placeholder="输入一句你想刻上去的座右铭，或对画面的额外要求（选填）"></textarea>
                </section>
                
                <!-- 工艺图鉴 -->
                <section>
                    <div class="section-title">选择工艺</div>
                    <div class="style-grid" id="styleGrid">
                        <div class="style-card" data-style="shadow-puppet">
                            <img class="style-card-bg" src="images/shadow-puppet.jpg" alt="皮影戏">
                            <div class="style-card-overlay">
                                <div class="style-card-name">皮影戏</div>
                                <div class="style-card-desc">光影交错，千年傀儡戏说人间百态</div>
                            </div>
                            <div class="style-check">✓</div>
                        </div>
                        <div class="style-card" data-style="cloisonne">
                            <img class="style-card-bg" src="images/cloisonne.jpg" alt="景泰蓝">
                            <div class="style-card-overlay">
                                <div class="style-card-name">景泰蓝</div>
                                <div class="style-card-desc">掐丝珐琅，皇家御用的蓝色传奇</div>
                            </div>
                            <div class="style-check">✓</div>
                        </div>
                        <div class="style-card" data-style="miaoxiu">
                            <img class="style-card-bg" src="images/miaoxiu.jpg" alt="苗绣">
                            <div class="style-card-overlay">
                                <div class="style-card-name">苗绣</div>
                                <div class="style-card-desc">针尖上的史诗，绣出民族记忆</div>
                            </div>
                            <div class="style-check">✓</div>
                        </div>
                        <div class="style-card" data-style="blue-white">
                            <img class="style-card-bg" src="images/blue-white.jpg" alt="青花瓷">
                            <div class="style-card-overlay">
                                <div class="style-card-name">青花瓷</div>
                                <div class="style-card-desc">素胚勾勒，天青色等烟雨的浪漫</div>
                            </div>
                            <div class="style-check">✓</div>
                        </div>
                    </div>
                </section>
                
                <!-- 高阶设置 -->
                <section class="advanced-section">
                    <div class="advanced-toggle" id="advancedToggle">
                        <span class="advanced-toggle-text">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="3"/>
                                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                            </svg>
                            高阶设置
                        </span>
                        <svg class="advanced-toggle-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                    <div class="advanced-content" id="advancedContent">
                        <div class="slider-container">
                            <div class="slider-label">
                                <span>AI 创造力与抽象度</span>
                                <span id="sliderValue">50%</span>
                            </div>
                            <input type="range" class="slider" id="creativitySlider" min="0" max="100" value="50">
                        </div>
                    </div>
                </section>
            </div>
            
            <!-- 生成按钮 -->
            <div class="generate-btn-container">
                <button class="generate-btn" id="generateBtn">
                    <span>开启生成</span>
                </button>
            </div>
        </aside>
        
        <!-- 右栏：视觉呈现区 -->
        <main class="right-panel" id="rightPanel">
            <!-- 初始状态 -->
            <div class="idle-state" id="idleState">
                <div class="ink-wash-bg"></div>
                <div class="idle-content">
                    <div class="idle-poem">
                        千<span class="highlight">年</span>匠心，一<span class="highlight">键</span>传承
                    </div>
                    <div class="idle-slogan">让 AI 成为非遗文化的数字守艺人</div>
                    <div class="idle-decoration"></div>
                </div>
            </div>
            
            <!-- 工作状态 -->
            <div class="working-state" id="workingState">
                <div class="scan-area">
                    <div class="scan-image-container">
                        <img class="scan-image" id="scanImage" src="" alt="扫描中">
                        <div class="scan-beam"></div>
                        <div class="scan-overlay"></div>
                    </div>
                </div>
                <div class="terminal-panel" id="terminalPanel"></div>
            </div>
            
            <!-- 结果状态 -->
            <div class="result-state" id="resultState">
                <div class="comparison-container" id="comparisonContainer">
                    <img class="comparison-image" id="afterImage" src="" alt="生成结果">
                    <div class="comparison-overlay" id="comparisonOverlay">
                        <img id="beforeImage" src="" alt="原图">
                    </div>
                    <div class="comparison-slider" id="comparisonSlider">
                        <div class="slider-handle">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="15 18 9 12 15 6"/>
                                <polyline points="9 18 15 12 9 6"/>
                            </svg>
                        </div>
                    </div>
                    <div class="comparison-label before">原图</div>
                    <div class="comparison-label after">非遗重构</div>
                </div>
                
                <div class="scholar-section">
                    <div class="scholar-title">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                        </svg>
                        非遗学者解读
                    </div>
                    <div class="scholar-content" id="scholarContent"></div>
                </div>
                
                <div class="action-buttons">
                    <button class="ghost-btn" id="downloadBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        下载高清画卷
                    </button>
                    <button class="ghost-btn primary" id="shareBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="18" cy="5" r="3"/>
                            <circle cx="6" cy="12" r="3"/>
                            <circle cx="18" cy="19" r="3"/>
                            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                        </svg>
                        分享作品
                    </button>
                </div>
            </div>
            
            <!-- 开盲盒特效 -->
            <div class="reveal-effect" id="revealEffect">
                <div class="reveal-text">非遗重构完成</div>
            </div>
        </main>
    </div>

    <script>
        // ============================================
        // 状态管理
        // ============================================
        const state = {
            uploadedImage: null,
            selectedStyle: null,
            prompt: '',
            creativity: 50,
            isGenerating: false
        };

        // ============================================
        // DOM 元素
        // ============================================
        const uploadArea = document.getElementById('uploadArea');
        const uploadPreview = document.getElementById('uploadPreview');
        const reuploadBtn = document.getElementById('reuploadBtn');
        const promptInput = document.getElementById('promptInput');
        const styleGrid = document.getElementById('styleGrid');
        const advancedToggle = document.getElementById('advancedToggle');
        const advancedContent = document.getElementById('advancedContent');
        const creativitySlider = document.getElementById('creativitySlider');
        const sliderValue = document.getElementById('sliderValue');
        const generateBtn = document.getElementById('generateBtn');
        const idleState = document.getElementById('idleState');
        const workingState = document.getElementById('workingState');
        const resultState = document.getElementById('resultState');
        const scanImage = document.getElementById('scanImage');
        const terminalPanel = document.getElementById('terminalPanel');
        const revealEffect = document.getElementById('revealEffect');
        const beforeImage = document.getElementById('beforeImage');
        const afterImage = document.getElementById('afterImage');
        const comparisonOverlay = document.getElementById('comparisonOverlay');
        const comparisonSlider = document.getElementById('comparisonSlider');
        const comparisonContainer = document.getElementById('comparisonContainer');
        const scholarContent = document.getElementById('scholarContent');
        const downloadBtn = document.getElementById('downloadBtn');
        const shareBtn = document.getElementById('shareBtn');

        // ============================================
        // 上传功能
        // ============================================
        uploadArea.addEventListener('click', () => {
            if (!state.uploadedImage) {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = handleFileSelect;
                input.click();
            }
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });

        reuploadBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            state.uploadedImage = null;
            uploadArea.classList.remove('has-image');
            uploadPreview.src = '';
        });

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) handleFile(file);
        }

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                state.uploadedImage = e.target.result;
                uploadPreview.src = state.uploadedImage;
                uploadArea.classList.add('has-image');
            };
            reader.readAsDataURL(file);
        }

        // ============================================
        // 工艺选择
        // ============================================
        styleGrid.addEventListener('click', (e) => {
            const card = e.target.closest('.style-card');
            if (!card) return;
            
            document.querySelectorAll('.style-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            state.selectedStyle = card.dataset.style;
        });

        // ============================================
        // 高阶设置
        // ============================================
        advancedToggle.addEventListener('click', () => {
            advancedToggle.classList.toggle('open');
            advancedContent.classList.toggle('open');
        });

        creativitySlider.addEventListener('input', (e) => {
            state.creativity = e.target.value;
            sliderValue.textContent = `${state.creativity}%`;
        });

        // ============================================
        // 生成流程
        // ============================================
        generateBtn.addEventListener('click', async () => {
            if (!state.uploadedImage) {
                alert('请先上传一张图片');
                return;
            }
            if (!state.selectedStyle) {
                alert('请选择一种非遗工艺');
                return;
            }
            
            state.isGenerating = true;
            generateBtn.disabled = true;
            generateBtn.innerHTML = '<span>生成中...</span>';
            
            // 切换到工作状态
            idleState.classList.add('hidden');
            workingState.classList.add('active');
            scanImage.src = state.uploadedImage;
            
            // 模拟多智能体协作日志
            await runAgentSimulation();
            
            // 显示结果
            showResult();
        });

        // 模拟 Agent 日志
        const agentLogs = [
            { type: 'system', text: '启动非遗重构协议...' },
            { type: 'system', text: '系统初始化完成，加载工艺模型库' },
            { type: 'supervisor', text: 'Supervisor Agent: 正在解析原始图像空间结构...' },
            { type: 'supervisor', text: 'Supervisor Agent: 图像特征提取完成，检测到主体轮廓' },
            { type: 'art', text: `Art Direction Agent: 注入【${getStyleName()}】LoRA模型，调节掐丝参数...` },
            { type: 'art', text: 'Art Direction Agent: 色彩映射表加载完成，应用传统配色方案' },
            { type: 'scholar', text: 'Heritage Scholar Agent: 正在检索明代工艺文献，匹配解说词...' },
            { type: 'scholar', text: 'Heritage Scholar Agent: 文化语境分析完成，生成学术解读' },
            { type: 'export', text: 'Export Agent: 正在渲染最终画卷...' },
            { type: 'export', text: 'Export Agent: 高清输出完成，准备交付' },
            { type: 'system', text: '非遗重构协议执行完毕 ✅' }
        ];

        function getStyleName() {
            const names = {
                'shadow-puppet': '皮影戏',
                'cloisonne': '景泰蓝',
                'miaoxiu': '苗绣',
                'blue-white': '青花瓷'
            };
            return names[state.selectedStyle] || '传统工艺';
        }

        async function runAgentSimulation() {
            terminalPanel.innerHTML = '';
            
            for (const log of agentLogs) {
                await new Promise(resolve => setTimeout(resolve, 600 + Math.random() * 400));
                addTerminalLine(log);
            }
            
            // 额外等待时间模拟渲染
            await new Promise(resolve => setTimeout(resolve, 1500));
        }

        function addTerminalLine(log) {
            const line = document.createElement('div');
            line.className = `terminal-line ${log.type}`;
            const timestamp = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            line.innerHTML = `<span class="terminal-timestamp">[${timestamp}]</span>${log.text}`;
            terminalPanel.appendChild(line);
            terminalPanel.scrollTop = terminalPanel.scrollHeight;
        }

        // ============================================
        // 结果展示
        // ============================================
        function showResult() {
            workingState.classList.remove('active');
            resultState.classList.add('active');
            
            // 设置对比图片
            beforeImage.src = state.uploadedImage;
            // 模拟生成结果（使用原图加滤镜效果模拟）
            afterImage.src = state.uploadedImage;
            
            // 开盲盒特效
            revealEffect.classList.add('active');
            setTimeout(() => {
                revealEffect.classList.remove('active');
            }, 1200);
            
            // 打字机效果显示文案
            const scholarText = generateScholarText();
            typeWriter(scholarContent, scholarText);
            
            state.isGenerating = false;
            generateBtn.disabled = false;
            generateBtn.innerHTML = '<span>开启生成</span>';
        }

        function generateScholarText() {
            const texts = {
                'shadow-puppet': '皮影戏，始于西汉，兴于唐宋，是一种以兽皮或纸板做成的人物剪影以表演故事的民间戏剧。其制作工艺繁复，需经过选皮、制皮、画稿、过稿、镂刻、敷彩、发汗熨平、缀结合成等八道工序。您的作品通过 AI 重构，将传统皮影的镂雕美学与现代图像融合，光影之间，千年故事 anew 演绎。',
                'cloisonne': '景泰蓝，正名"铜胎掐丝珐琅"，因其在明朝景泰年间盛行，制作技艺比较成熟，使用的珐琅釉多以蓝色为主，故而得名。制作需经制胎、掐丝、烧焊、点蓝、烧蓝、磨光、镀金等工序。AI 重构后的作品保留了掐丝珐琅的华丽质感，金丝线条勾勒出皇家御用的尊贵气息。',
                'miaoxiu': '苗绣是苗族民间传承的刺绣技艺，被称为"穿在身上的史书"。其图案多取材于自然，有龙凤、蝴蝶、花草等，色彩鲜艳浓烈，构图对称和谐。2006年列入第一批国家级非物质文化遗产名录。AI 重构将苗绣的刺绣肌理与您的图像结合，每一针都承载着苗族千年的文化记忆。',
                'blue-white': '青花瓷，又称白地青花瓷，是中国瓷器的主流品种之一。原始青花瓷于唐宋已见端倪，成熟的青花瓷则出现在元代景德镇的湖田窑。其以含氧化钴的钴矿为原料，在陶瓷坯体上描绘纹饰，再罩上一层透明釉，经高温还原焰一次烧成。AI 重构让传统青花美学在现代图像中焕发新生。'
            };
            return texts[state.selectedStyle] || '非遗文化博大精深，AI 重构让传统工艺在现代语境中焕发新的生命力。';
        }

        function typeWriter(element, text, speed = 50) {
            element.innerHTML = '<span class="typed-text"></span><span class="typed-cursor">|</span>';
            const typedText = element.querySelector('.typed-text');
            let i = 0;
            
            function type() {
                if (i < text.length) {
                    typedText.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                }
            }
            
            type();
        }

        // ============================================
        // 图片对比滑块
        // ============================================
        let isDragging = false;

        comparisonSlider.addEventListener('mousedown', () => isDragging = true);
        document.addEventListener('mouseup', () => isDragging = false);
        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            updateComparison(e);
        });

        // 触摸支持
        comparisonSlider.addEventListener('touchstart', () => isDragging = true);
        document.addEventListener('touchend', () => isDragging = false);
        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            updateComparison(e.touches[0]);
        });

        function updateComparison(e) {
            const rect = comparisonContainer.getBoundingClientRect();
            let x = e.clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            
            const percentage = (x / rect.width) * 100;
            comparisonOverlay.style.width = `${percentage}%`;
            comparisonSlider.style.left = `${percentage}%`;
        }

        // ============================================
        // 操作按钮
        // ============================================
        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `非遗重构_${getStyleName()}_${Date.now()}.png`;
            link.href = state.uploadedImage;
            link.click();
        });

        shareBtn.addEventListener('click', () => {
            if (navigator.share) {
                navigator.share({
                    title: '万物皆可非遗',
                    text: `我用 AI 将图片重构为${getStyleName()}风格，快来体验吧！`,
                    url: window.location.href
                });
            } else {
                alert('链接已复制到剪贴板');
            }
        });

        // ============================================
        // 初始化
        // ============================================
        // 默认选中第一个工艺
        document.querySelector('.style-card').classList.add('active');
        state.selectedStyle = 'shadow-puppet';
    </script>
</body>
</html>
