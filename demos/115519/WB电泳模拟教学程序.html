<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Western Blot Electrophoresis Simulator</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --ink: #1f2933;
      --muted: #667085;
      --line: #d8dee8;
      --gel-top: #eef5fb;
      --gel-bottom: #dfeaf4;
      --accent: #2b6cb0;
      --danger: #b42318;
      --success: #027a48;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f7f8fb 0%, #eef1f5 100%);
      color: var(--ink);
    }

    header {
      padding: 22px 32px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(8px);
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .app {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
      padding: 20px 28px 30px;
      max-width: 1520px;
      margin: 0 auto;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(17, 24, 39, 0.06);
    }

    .controls {
      padding: 18px;
      position: sticky;
      top: 12px;
      align-self: start;
    }

    .section-title {
      font-size: 13px;
      color: #111827;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin: 4px 0 12px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #344054;
      margin: 12px 0 6px;
      font-weight: 600;
    }

    input, select, button {
      font-family: inherit;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid #cfd6e3;
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    input:focus, select:focus {
      border-color: #7aa7d9;
      box-shadow: 0 0 0 3px rgba(43,108,176,0.12);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: none;
      border-radius: 11px;
      padding: 11px 12px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.08s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    button:active { transform: translateY(1px); }

    .primary { background: var(--accent); color: white; }
    .secondary { background: #edf2f7; color: #1f2933; }
    .danger { background: #fee4e2; color: var(--danger); }
    .success { background: #d1fadf; color: var(--success); }

    .small-note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .gel-card {
      padding: 18px 18px 22px;
      overflow-x: auto;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
      min-width: 980px;
    }

    .status {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    .pill {
      background: #f2f4f7;
      border: 1px solid #e4e7ec;
      border-radius: 999px;
      padding: 6px 10px;
      color: #344054;
    }

    .gel-wrap {
      display: grid;
      grid-template-columns: 68px 1fr;
      gap: 8px;
      min-width: 980px;
    }

    .scale {
      position: relative;
      height: 640px;
      margin-top: 30px;
      border-right: 1px solid #b9c3d3;
      color: #475467;
      font-size: 11px;
    }

    .tick {
      position: absolute;
      right: 0;
      width: 10px;
      height: 1px;
      background: #667085;
    }

    .tick span {
      position: absolute;
      right: 14px;
      top: -7px;
      white-space: nowrap;
    }

    .gel-area {
      position: relative;
    }

    .lane-labels {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      gap: 4px;
      height: 30px;
      padding: 0 8px;
    }

    .lane-label {
      text-align: center;
      color: #344054;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #gel {
      position: relative;
      height: 640px;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.32), rgba(255,255,255,0) 22%, rgba(255,255,255,0.22) 55%, rgba(255,255,255,0)),
        linear-gradient(180deg, var(--gel-top) 0%, var(--gel-bottom) 100%);
      border: 1px solid #b9c3d3;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: inset 0 0 38px rgba(96, 125, 155, 0.22);
    }

    #gel::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 50px;
      background: linear-gradient(180deg, rgba(210,224,238,0.75), rgba(210,224,238,0));
      pointer-events: none;
      z-index: 1;
    }

    .lane {
      position: absolute;
      top: 0;
      bottom: 0;
      border-left: 1px solid rgba(100,116,139,0.14);
      border-right: 1px solid rgba(255,255,255,0.28);
    }

    .well {
      position: absolute;
      top: 14px;
      height: 18px;
      border-radius: 0 0 9px 9px;
      background: rgba(103, 125, 150, 0.26);
      border: 1px solid rgba(71, 84, 103, 0.25);
      z-index: 2;
    }

    .front-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(43, 108, 176, 0.35);
      box-shadow: 0 0 6px rgba(43,108,176,0.24);
      pointer-events: none;
      z-index: 3;
    }

    .band {
      position: absolute;
      height: 8px;
      border-radius: 999px;
      transform: translateY(-50%);
      opacity: 0.9;
      box-shadow: 0 0 4px rgba(0,0,0,0.25), 0 0 11px rgba(0,0,0,0.12);
      filter: blur(0.35px);
      cursor: pointer;
      z-index: 4;
    }

    .band::after {
      content: "";
      position: absolute;
      left: 5%;
      right: 5%;
      top: 45%;
      height: 1px;
      background: rgba(255,255,255,0.25);
      border-radius: 999px;
    }

    .target-band {
      background: linear-gradient(180deg, rgba(19,24,31,0.88), rgba(0,0,0,0.95));
    }

    .protein-list {
      margin-top: 16px;
      max-height: 220px;
      overflow: auto;
      border-top: 1px solid #edf0f4;
      padding-top: 8px;
    }

    .protein-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px dashed #e4e7ec;
      font-size: 12px;
      color: #344054;
    }

    .protein-item button {
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 11px;
      background: #fff1f3;
      color: #c01048;
    }

    .legend {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 12px;
      color: #475467;
      margin-top: 12px;
      min-width: 980px;
    }

    .legend-swatch {
      width: 28px;
      height: 7px;
      border-radius: 999px;
      display: inline-block;
      vertical-align: middle;
      margin-right: 5px;
      box-shadow: 0 0 4px rgba(0,0,0,0.25);
    }

    .tooltip {
      position: fixed;
      display: none;
      z-index: 9999;
      padding: 8px 10px;
      background: rgba(17, 24, 39, 0.94);
      color: #fff;
      border-radius: 9px;
      font-size: 12px;
      line-height: 1.35;
      pointer-events: none;
      max-width: 220px;
    }

    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; padding: 16px; }
      .controls { position: static; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Western Blot 电泳模拟系统</h1>
    <p>分子量越小，迁移速度越快；分子量越大，迁移速度越慢。支持 15 个泳道、Marker、目的蛋白动态添加、暂停/继续和导出图片。</p>
  </header>

  <main class="app">
    <aside class="panel controls">
      <div class="section-title">添加蛋白</div>

      <div class="row">
        <div>
          <label for="laneSelect">泳道</label>
          <select id="laneSelect"></select>
        </div>
        <div>
          <label for="proteinType">类型</label>
          <select id="proteinType">
            <option value="target">目的蛋白</option>
            <option value="marker">Marker</option>
          </select>
        </div>
      </div>

      <label for="proteinName">蛋白名称</label>
      <input id="proteinName" type="text" value="β-actin" placeholder="如 GAPDH / β-actin / Target A" />

      <label for="mwInput">分子量 kDa</label>
      <input id="mwInput" type="number" value="42" min="5" max="300" step="1" />

      <label for="intensityInput">条带强度</label>
      <input id="intensityInput" type="range" min="0.25" max="1" step="0.05" value="0.85" />

      <div class="button-grid">
        <button class="primary" id="addProteinBtn">添加蛋白</button>
        <button class="success" id="addMarkerBtn">添加标准 Marker</button>
      </div>

      <div class="section-title" style="margin-top:22px;">电泳控制</div>
      <div class="button-grid">
        <button class="primary" id="startPauseBtn">▶ 开始</button>
        <button class="secondary" id="resetBtn">↺ 重置</button>
      </div>

      <label for="speedSelect">运行速度</label>
      <select id="speedSelect">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="5">5×</option>
      </select>

      <label for="frontSelect">染料前沿速度</label>
      <select id="frontSelect">
        <option value="0.65">慢</option>
        <option value="1" selected>标准</option>
        <option value="1.35">快</option>
      </select>

      <div class="button-grid">
        <button class="secondary" id="clearLaneBtn">清空当前泳道</button>
        <button class="secondary" id="exportBtn">导出 PNG</button>
      </div>

      <p class="small-note">
        速度算法：每个蛋白的迁移速度按 <b>1 / log(kDa)</b> 类非线性函数计算，因此小分子蛋白跑得更快，更接近真实 SDS-PAGE/WB 电泳迁移规律。
      </p>

      <div class="protein-list" id="proteinList"></div>
    </aside>

    <section class="panel gel-card">
      <div class="toolbar">
        <div>
          <div class="section-title" style="margin:0 0 6px;">Gel simulation</div>
          <div class="status">
            <span class="pill" id="runStatus">状态：未开始</span>
            <span class="pill" id="proteinCount">蛋白数：0</span>
            <span class="pill">泳道：15</span>
          </div>
        </div>
        <div class="status">
          <span class="pill">Marker: 250–10 kDa</span>
          <span class="pill">Hover 条带查看信息</span>
        </div>
      </div>

      <div class="gel-wrap" id="captureArea">
        <div class="scale" id="scale"></div>
        <div class="gel-area">
          <div class="lane-labels" id="laneLabels"></div>
          <div id="gel">
            <div class="front-line" id="frontLine"></div>
          </div>
        </div>
      </div>

      <div class="legend">
        <span><i class="legend-swatch" style="background:#111827"></i>目的蛋白</span>
        <span><i class="legend-swatch" style="background:linear-gradient(90deg,#2f80ed,#eb5757,#27ae60)"></i>彩色 Marker</span>
        <span>迁移方向：上 → 下</span>
      </div>
    </section>
  </main>

  <div class="tooltip" id="tooltip"></div>

  <script>
    const GEL_HEIGHT = 640;
    const WELL_Y = 24;
    const STOP_Y = 612;
    const LANE_COUNT = 15;

    const markerMWs = [250, 180, 130, 100, 70, 55, 40, 35, 25, 15, 10];
    const markerColors = [
      '#5b5fc7', '#2f80ed', '#56ccf2', '#27ae60', '#f2c94c',
      '#f2994a', '#eb5757', '#9b51e0', '#00a3a3', '#7a5c58', '#111827'
    ];

    let lanes = Array.from({ length: LANE_COUNT }, (_, i) => ({ id: i + 1, proteins: [] }));
    let running = false;
    let lastTime = null;
    let speedMultiplier = 1;
    let frontMultiplier = 1;
    let dyeFrontY = WELL_Y + 18;
    let rafId = null;
    let proteinAutoId = 1;

    const gel = document.getElementById('gel');
    const scale = document.getElementById('scale');
    const laneSelect = document.getElementById('laneSelect');
    const laneLabels = document.getElementById('laneLabels');
    const proteinList = document.getElementById('proteinList');
    const runStatus = document.getElementById('runStatus');
    const proteinCount = document.getElementById('proteinCount');
    const startPauseBtn = document.getElementById('startPauseBtn');
    const tooltip = document.getElementById('tooltip');
    const frontLine = document.getElementById('frontLine');

    function initUI() {
      for (let i = 1; i <= LANE_COUNT; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `Lane ${i}`;
        laneSelect.appendChild(opt);

        const label = document.createElement('div');
        label.className = 'lane-label';
        label.textContent = i === 1 ? 'M / 1' : String(i);
        laneLabels.appendChild(label);
      }

      for (let i = 0; i < LANE_COUNT; i++) {
        const laneDiv = document.createElement('div');
        laneDiv.className = 'lane';
        laneDiv.style.left = `${(i / LANE_COUNT) * 100}%`;
        laneDiv.style.width = `${100 / LANE_COUNT}%`;
        gel.appendChild(laneDiv);

        const well = document.createElement('div');
        well.className = 'well';
        well.style.left = `calc(${(i / LANE_COUNT) * 100}% + 9px)`;
        well.style.width = `calc(${100 / LANE_COUNT}% - 18px)`;
        gel.appendChild(well);
      }

      drawScale();
      addStandardMarker(1);
      addProtein({ lane: 2, name: 'β-actin', mw: 42, type: 'target', intensity: 0.85 });
      addProtein({ lane: 3, name: 'GAPDH', mw: 36, type: 'target', intensity: 0.75 });
      render();
    }

    function drawScale() {
      scale.innerHTML = '';
      markerMWs.forEach(mw => {
        const y = mwToFinalY(mw);
        const tick = document.createElement('div');
        tick.className = 'tick';
        tick.style.top = `${y}px`;
        tick.innerHTML = `<span>${mw} kDa</span>`;
        scale.appendChild(tick);
      });
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    // 终点位置模拟：SDS-PAGE 迁移距离通常与 log(MW) 近似线性相关。
    // 大分子靠上，小分子靠下。
    function mwToFinalY(mw) {
      const minMW = 10;
      const maxMW = 250;
      const normalized = (Math.log(maxMW) - Math.log(clamp(mw, minMW, maxMW))) / (Math.log(maxMW) - Math.log(minMW));
      return WELL_Y + 42 + normalized * (STOP_Y - WELL_Y - 72);
    }

    // 迁移速度模拟：分子量越小，速度越快；采用非线性函数避免线性迁移过假。
    function speedFromMW(mw) {
      const base = 9.5;
      const logTerm = Math.log(clamp(mw, 8, 300));
      return base * (1 / logTerm) * 3.4;
    }

    function bandThickness(mw) {
      const t = 11 - Math.log10(clamp(mw, 10, 250)) * 1.6;
      return clamp(t, 5, 9.5);
    }

    function laneGeometry(lane) {
      const laneW = gel.clientWidth / LANE_COUNT;
      const left = (lane - 1) * laneW;
      return {
        laneW,
        bandLeft: left + laneW * 0.16,
        bandWidth: laneW * 0.68
      };
    }

    function addProtein({ lane, name, mw, type, intensity, color }) {
      const finalY = mwToFinalY(mw);
      const protein = {
        id: proteinAutoId++,
        lane: Number(lane),
        name: name || (type === 'marker' ? `${mw} kDa` : 'Target protein'),
        mw: Number(mw),
        type,
        color: color || (type === 'marker' ? markerColors[Math.floor(Math.random() * markerColors.length)] : '#111827'),
        y: WELL_Y + 16,
        finalY,
        speed: speedFromMW(mw),
        intensity: Number(intensity ?? 0.85),
        createdAtRunning: running
      };
      lanes[protein.lane - 1].proteins.push(protein);
      render();
    }

    function addStandardMarker(laneNumber) {
      markerMWs.forEach((mw, idx) => {
        addProtein({
          lane: laneNumber,
          name: `Marker ${mw} kDa`,
          mw,
          type: 'marker',
          color: markerColors[idx],
          intensity: 0.82
        });
      });
    }

    function render() {
      document.querySelectorAll('.band').forEach(el => el.remove());
      const total = lanes.reduce((s, lane) => s + lane.proteins.length, 0);
      proteinCount.textContent = `蛋白数：${total}`;
      frontLine.style.top = `${dyeFrontY}px`;

      lanes.forEach(lane => {
        lane.proteins.forEach(p => {
          const geo = laneGeometry(p.lane);
          const band = document.createElement('div');
          band.className = `band ${p.type === 'target' ? 'target-band' : ''}`;
          band.dataset.id = p.id;
          band.style.left = `${geo.bandLeft}px`;
          band.style.width = `${geo.bandWidth}px`;
          band.style.top = `${p.y}px`;
          band.style.height = `${bandThickness(p.mw)}px`;
          band.style.opacity = String(clamp(p.intensity, 0.25, 1));

          if (p.type === 'marker') {
            band.style.background = `linear-gradient(180deg, ${p.color}, ${p.color} 45%, rgba(0,0,0,0.22))`;
          }

          band.addEventListener('mouseenter', e => showTooltip(e, p));
          band.addEventListener('mousemove', e => showTooltip(e, p));
          band.addEventListener('mouseleave', hideTooltip);
          gel.appendChild(band);
        });
      });
      renderProteinList();
    }

    function renderProteinList() {
      const flat = lanes.flatMap(l => l.proteins);
      proteinList.innerHTML = flat.length ? '' : '<div class="small-note">暂无蛋白</div>';
      flat.slice().reverse().forEach(p => {
        const item = document.createElement('div');
        item.className = 'protein-item';
        item.innerHTML = `
          <span>Lane ${p.lane}｜${escapeHtml(p.name)}｜${p.mw} kDa｜${p.type}</span>
          <button data-remove="${p.id}">删除</button>
        `;
        proteinList.appendChild(item);
      });

      proteinList.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = Number(btn.dataset.remove);
          lanes.forEach(lane => lane.proteins = lane.proteins.filter(p => p.id !== id));
          render();
        });
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>'"]/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[c]));
    }

    function showTooltip(e, p) {
      tooltip.style.display = 'block';
      tooltip.style.left = `${e.clientX + 12}px`;
      tooltip.style.top = `${e.clientY + 12}px`;
      tooltip.innerHTML = `<b>${escapeHtml(p.name)}</b><br>Lane ${p.lane}<br>${p.mw} kDa<br>${p.type === 'marker' ? 'Marker' : 'Target protein'}<br>Position: ${p.y.toFixed(1)} px`;
    }

    function hideTooltip() {
      tooltip.style.display = 'none';
    }

    function animate(timestamp) {
      if (!running) return;
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;

      dyeFrontY = Math.min(STOP_Y, dyeFrontY + 25 * frontMultiplier * speedMultiplier * dt);

      lanes.forEach(lane => {
        lane.proteins.forEach(p => {
          if (p.y < p.finalY) {
            p.y = Math.min(p.finalY, p.y + p.speed * speedMultiplier * dt * 11);
          }
        });
      });

      updateBandPositionsOnly();
      const allStopped = lanes.every(lane => lane.proteins.every(p => p.y >= p.finalY)) && dyeFrontY >= STOP_Y;
      if (allStopped) {
        running = false;
        startPauseBtn.textContent = '▶ 开始';
        runStatus.textContent = '状态：已完成';
        lastTime = null;
        return;
      }

      rafId = requestAnimationFrame(animate);
    }

    function updateBandPositionsOnly() {
      frontLine.style.top = `${dyeFrontY}px`;
      lanes.forEach(lane => {
        lane.proteins.forEach(p => {
          const el = document.querySelector(`.band[data-id="${p.id}"]`);
          if (el) el.style.top = `${p.y}px`;
        });
      });
    }

    function startPause() {
      running = !running;
      if (running) {
        startPauseBtn.textContent = '⏸ 暂停';
        runStatus.textContent = '状态：运行中';
        lastTime = null;
        rafId = requestAnimationFrame(animate);
      } else {
        startPauseBtn.textContent = '▶ 继续';
        runStatus.textContent = '状态：已暂停';
        cancelAnimationFrame(rafId);
      }
    }

    function reset() {
      running = false;
      cancelAnimationFrame(rafId);
      lastTime = null;
      dyeFrontY = WELL_Y + 18;
      lanes.forEach(lane => lane.proteins.forEach(p => p.y = WELL_Y + 16));
      startPauseBtn.textContent = '▶ 开始';
      runStatus.textContent = '状态：已重置';
      render();
    }

    function clearCurrentLane() {
      const lane = Number(laneSelect.value);
      lanes[lane - 1].proteins = [];
      render();
    }

    function exportPNG() {
      const node = document.getElementById('captureArea');
      const rect = node.getBoundingClientRect();
      const svgData = `
        <svg xmlns="http://www.w3.org/2000/svg" width="${rect.width}" height="${rect.height}">
          <foreignObject width="100%" height="100%">
            <div xmlns="http://www.w3.org/1999/xhtml">${node.outerHTML}</div>
          </foreignObject>
        </svg>`;
      const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = function () {
        const canvas = document.createElement('canvas');
        canvas.width = rect.width * 2;
        canvas.height = rect.height * 2;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.scale(2, 2);
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        const a = document.createElement('a');
        a.download = 'WB_electrophoresis_simulation.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      };
      img.src = url;
    }

    document.getElementById('addProteinBtn').addEventListener('click', () => {
      const lane = Number(laneSelect.value);
      const type = document.getElementById('proteinType').value;
      const name = document.getElementById('proteinName').value.trim();
      const mw = Number(document.getElementById('mwInput').value);
      const intensity = Number(document.getElementById('intensityInput').value);
      if (!mw || mw <= 0) {
        alert('请输入有效的分子量 kDa');
        return;
      }
      addProtein({ lane, name, mw, type, intensity });
    });

    document.getElementById('addMarkerBtn').addEventListener('click', () => {
      addStandardMarker(Number(laneSelect.value));
    });

    startPauseBtn.addEventListener('click', startPause);
    document.getElementById('resetBtn').addEventListener('click', reset);
    document.getElementById('clearLaneBtn').addEventListener('click', clearCurrentLane);
    document.getElementById('exportBtn').addEventListener('click', exportPNG);

    document.getElementById('speedSelect').addEventListener('change', e => {
      speedMultiplier = Number(e.target.value);
    });

    document.getElementById('frontSelect').addEventListener('change', e => {
      frontMultiplier = Number(e.target.value);
    });

    window.addEventListener('resize', render);

    initUI();
  </script>
</body>
</html>
