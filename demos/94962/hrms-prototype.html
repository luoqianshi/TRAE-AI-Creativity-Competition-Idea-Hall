<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR管理系统 - 产品原型</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; overflow: hidden; }
        .layout { display: flex; height: 100vh; }
        .sidebar { width: 240px; background: linear-gradient(180deg, #1e3a8a 0%, #3b82f6 100%); color: white; padding: 20px 0; position: fixed; height: 100vh; overflow-y: auto; }
        .sidebar-header { padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .sidebar-header h1 { font-size: 20px; font-weight: 600; }
        .menu-item { padding: 12px 20px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.3s; font-size: 14px; }
        .menu-item:hover { background: rgba(255,255,255,0.1); }
        .menu-item.active { background: rgba(255,255,255,0.15); border-left: 3px solid #fff; }
        .main-content { flex: 1; margin-left: 240px; display: flex; flex-direction: column; overflow: hidden; }
        .header { padding: 16px 24px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: center; }
        .header h2 { font-size: 20px; font-weight: 600; color: #1e3a8a; }
        .page-content { flex: 1; padding: 24px; overflow-y: auto; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 20px; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
        .stat-card { background: white; border-radius: 12px; padding: 20px; border-left: 4px solid #3b82f6; }
        .stat-card.green { border-left-color: #10b981; }
        .stat-card.yellow { border-left-color: #f59e0b; }
        .stat-card.red { border-left-color: #ef4444; }
        .stat-value { font-size: 28px; font-weight: 700; }
        .stat-label { font-size: 14px; color: #6b7280; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #f3f4f6; }
        th { background: #f9fafb; font-weight: 600; }
        .btn { padding: 6px 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-sm { padding: 4px 12px; font-size: 12px; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; }
        .tab { padding: 10px 20px; cursor: pointer; font-size: 14px; font-weight: 500; color: #6b7280; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .tab.active { color: #3b82f6; border-bottom-color: #3b82f6; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.show { display: flex; }
        .modal { background: white; border-radius: 12px; width: 500px; padding: 20px; }
        .modal h3 { margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        .flex-row { display: flex; gap: 20px; }
        .flex-1 { flex: 1; }
    </style>
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-header"><h1>👥 HR管理系统</h1></div>
            <div class="menu-item active" onclick="showPage('dashboard')">📊 仪表盘</div>
            <div class="menu-item" onclick="showPage('employee')">👤 人事管理</div>
            <div class="menu-item" onclick="showPage('attendance')">⏰ 考勤管理</div>
            <div class="menu-item" onclick="showPage('salary')">💰 薪资管理</div>
            <div class="menu-item" onclick="showPage('asset')">💻 资产设备</div>
            <div class="menu-item" onclick="showPage('vehicle')">🚗 车辆管理</div>
            <div class="menu-item" onclick="showPage('welfare')">🎁 福利管理</div>
            <div class="menu-item" onclick="showPage('contract')">📄 合同管理</div>
            <div class="menu-item" onclick="showPage('turnover')">🚪 离职流程</div>
            <div class="menu-item" onclick="showPage('training')">📚 员工培训</div>
            <div class="menu-item" onclick="showPage('notice')">📢 公告管理</div>
        </div>
        <div class="main-content">
            <div class="header">
                <h2 id="pageTitle">仪表盘</h2>
                <div style="display:flex;align-items:center;gap:15px;">
                    <input type="text" placeholder="搜索..." style="padding:8px 15px;border:1px solid #ddd;border-radius:20px;font-size:14px;">
                    <div style="width:36px;height:36px;border-radius:50%;background:#3b82f6;color:white;display:flex;align-items:center;justify-content:center;font-weight:600;">A</div>
                </div>
            </div>
            <div class="page-content" id="pageContent"></div>
        </div>
    </div>
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3 id="modalTitle">标题</h3>
            <div id="modalBody"></div>
            <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px;">
                <button class="btn" style="background:#f3f4f6;" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveModal()">保存</button>
            </div>
        </div>
    </div>
    <script>
        var pages = {
            dashboard: function(){
                return '<div class="stats-grid"><div class="stat-card"><div class="stat-value">7</div><div class="stat-label">在职员工</div></div><div class="stat-card green"><div class="stat-value">4/5</div><div class="stat-label">今日考勤</div></div><div class="stat-card yellow"><div class="stat-value">1</div><div class="stat-label">即将到期合同</div></div><div class="stat-card red"><div class="stat-value">1</div><div class="stat-label">待处理离职</div></div></div><div class="flex-row"><div class="card flex-1"><div class="card-title">📈 本月薪资概览</div><div style="height:200px;display:flex;align-items:flex-end;justify-content:space-around;">'+
                ['张三:24200','李四:21500','王五:14700','赵六:17600'].map(function(s){var p=s.split(':');return '<div style="text-align:center"><div style="background:#3b82f6;width:60px;color:white;font-size:12px;padding:5px;border-radius:4px 4px 0 0;height:'+(p[1]/30000*150)+'px;">'+(p[1]/1000)+'k</div><div style="font-size:12px;margin-top:5px;">'+p[0]+'</div></div>';}).join('')+
                '</div></div><div class="card flex-1"><div class="card-title">📋 近期动态</div>'+
                ['孙七 技术部 入职 2026-06-01','吴九 技术部 离职 2026-07-05','周八 运营部 转正 2026-07-01'].map(function(s){var a=s.split(' ');return '<div style="padding:10px 0;border-bottom:1px solid #f3f4f6;"><span style="font-weight:500">'+a[0]+'</span> <span style="color:#6b7280">'+a[1]+' · '+a[2]+'</span> <span style="float:right;color:#9ca3af">'+a[3]+'</span></div>';}).join('')+
                '</div></div>';
            },
            employee: function(){
                return '<div style="text-align:right;margin-bottom:15px;"><button class="btn btn-primary" onclick="openModal(\'新增员工\',\'<div class=form-group><label>姓名</label><input type=text></div><div class=form-group><label>部门</label><select><option>技术部</option><option>市场部</option><option>人事部</option></select></div><div class=form-group><label>职位</label><input type=text></div><div class=form-group><label>入职日期</label><input type=date></div>\')">+ 新增员工</button></div><div class="card"><table><thead><tr><th>姓名</th><th>部门</th><th>职位</th><th>入职日期</th><th>状态</th><th>操作</th></tr></thead><tbody>'+
                [
                    {name:'张三',dept:'技术部',pos:'高级工程师',hire:'2020-05-15',status:'在职'},
                    {name:'李四',dept:'市场部',pos:'市场经理',hire:'2019-08-20',status:'在职'},
                    {name:'王五',dept:'人事部',pos:'HR专员',hire:'2021-03-10',status:'在职'},
                    {name:'孙七',dept:'技术部',pos:'前端开发',hire:'2026-06-01',status:'试用期'}
                ].map(function(e){
                    return '<tr><td>'+e.name+'</td><td>'+e.dept+'</td><td>'+e.pos+'</td><td>'+e.hire+'</td><td><span class="badge '+ (e.status==='在职'?'badge-success':'badge-warning') +'">'+e.status+'</span></td><td><button class="btn btn-sm btn-primary" onclick="alert(\'编辑 '+e.name+'\')">编辑</button></td></tr>';
                }).join('')+'</tbody></table></div>';
            },
            attendance: function(){
                return '<div class="tabs"><div class="tab active" onclick="switchTab(this,\'daily\')">今日考勤</div><div class="tab" onclick="switchTab(this,\'monthly\')">月度统计</div></div><div class="card" id="att-card"><table><thead><tr><th>员工姓名</th><th>日期</th><th>上班时间</th><th>下班时间</th><th>状态</th></tr></thead><tbody>'+
                [
                    {name:'张三',date:'2026-07-08',cin:'08:55',cout:'18:05',status:'正常'},
                    {name:'李四',date:'2026-07-08',cin:'09:10',cout:'18:30',status:'迟到'},
                    {name:'王五',date:'2026-07-08',cin:'08:45',cout:'17:30',status:'早退'}
                ].map(function(a){
                    return '<tr><td>'+a.name+'</td><td>'+a.date+'</td><td>'+a.cin+'</td><td>'+a.cout+'</td><td><span class="badge '+ (a.status==='正常'?'badge-success':'badge-warning') +'">'+a.status+'</span></td></tr>';
                }).join('')+'</tbody></table></div>';
            },
            salary: function(){
                return '<div style="text-align:right;margin-bottom:15px;"><button class="btn btn-primary" onclick="alert(\'薪资计算完成\')">计算薪资</button></div><div class="card"><table><thead><tr><th>员工姓名</th><th>月份</th><th>基本工资</th><th>奖金</th><th>扣款</th><th>实发工资</th></tr></thead><tbody>'+
                [
                    {name:'张三',month:'2026-06',base:20000,bonus:5000,deduct:800,net:24200},
                    {name:'李四',month:'2026-06',base:18000,bonus:4000,deduct:500,net:21500}
                ].map(function(s){
                    return '<tr><td>'+s.name+'</td><td>'+s.month+'</td><td>¥'+s.base+'</td><td>¥'+s.bonus+'</td><td>-¥'+s.deduct+'</td><td><strong>¥'+s.net+'</strong></td></tr>';
                }).join('')+'</tbody></table></div>';
            },
            asset: function(){
                return '<div style="text-align:right;margin-bottom:15px;"><button class="btn btn-primary" onclick="openModal(\'新增资产\',\'<div class=form-group><label>资产名称</label><input type=text></div><div class=form-group><label>类型</label><select><option>办公设备</option><option>电子设备</option></select></div>\')">+ 新增资产</button></div><div class="card"><table><thead><tr><th>资产名称</th><th>类型</th><th>使用人</th><th>状态</th><th>操作</th></tr></thead><tbody>'+
                [
                    {name:'笔记本电脑',type:'办公设备',user:'张三',status:'使用中'},
                    {name:'显示器',type:'办公设备',user:'李四',status:'使用中'},
                    {name:'投影仪',type:'电子设备',user:'王五',status:'已归还'}
                ].map(function(a){
                    return '<tr><td>'+a.name+'</td><td>'+a.type+'</td><td>'+a.user+'</td><td><span class="badge '+ (a.status==='使用中'?'badge-success':'badge-info') +'">'+a.status+'</span></td><td><button class="btn btn-sm btn-primary" onclick="alert(\'归还资产\')">归还</button></td></tr>';
                }).join('')+'</tbody></table></div>';
            },
            vehicle: function(){
                return '<div class="tabs"><div class="tab active" onclick="switchTab(this,\'vehicle-list\')">车辆列表</div><div class="tab" onclick="switchTab(this,\'violation\')">违章记录</div></div><div class="card" id="vehicle-card"><table><thead><tr><th>车牌号</th><th>车型</th><th>状态</th><th>驾驶员</th><th>操作</th></tr></thead><tbody>'+
                [
                    {plate:'京A12345',model:'奥迪A6',status:'可用',driver:'张三'},
                    {plate:'京B67890',model:'丰田凯美瑞',status:'使用中',driver:'李四'},
                    {plate:'京C11111',model:'大众帕萨特',status:'维修中',driver:'-'}
                ].map(function(v){
                    var badgeClass = v.status==='可用'?'badge-success':v.status==='使用中'?'badge-warning':'badge-danger';
                    return '<tr><td>'+v.plate+'</td><td>'+v.model+'</td><td><span class="badge '+badgeClass+'">'+v.status+'</span></td><td>'+v.driver+'</td><td><button class="btn btn-sm btn-primary" onclick="openModal(\'用车申请\',\'<div class=form-group><label>车牌号</label><input type=text value='+v.plate+' readonly></div><div class=form-group><label>使用日期</label><input type=date></div>\')">申请使用</button></td></tr>';
                }).join('')+'</tbody></table></div>';
            },
            welfare: function(){
                return '<div style="text-align:right;margin-bottom:15px;"><button class="btn btn-primary" onclick="openModal(\'新增福利\',\'<div class=form-group><label>福利名称</label><input type=text></div><div class=form-group><label>金额</label><input type=number></div>\')">+ 新增福利</button></div><div class="card"><table><thead><tr><th>福利名称</th><th>类型</th><th>金额</th><th>状态</th><th>操作</th></tr></thead><tbody>'+
                [
                    {name:'端午节福利',type:'节日福利',amount:30000,status:'已发放'},
                    {name:'年度体检',type:'健康福利',amount:50000,status:'进行中'},
                    {name:'团建活动',type:'活动福利',amount:15000,status:'待审批'}
                ].map(function(w){
                    var badgeClass = w.status==='已发放'?'badge-success':w.status==='进行中'?'badge-warning':'badge-info';
                    return '<tr><td>'+w.name+'</td><td>'+w.type+'</td><td>¥'+w.amount+'</td><td><span class="badge '+badgeClass+'">'+w.status+'</span></td><td><button class="btn btn-sm btn-primary" onclick="alert(\'审批福利\')">审批</button></td></tr>';
                }).join('')+'</tbody></table></div>';
            },
            contract: function(){
                return '<div class="card"><table><thead><tr><th>员工姓名</th><th>合同类型</th><th>开始日期</th><th>结束日期</th><th>状态</th><th>操作</th></tr></thead><tbody>'+
                [
                    {name:'张三',type:'劳动合同',start:'2020-05-15',end:'2026-05-14',status:'正常'},
                    {name:'李四',type:'劳动合同',start:'2019-08-20',end:'2025-08-19',status:'即将到期'},
                    {name:'孙七',type:'实习协议',start:'2026-06-01',end:'2026-08-31',status:'正常'}
                ].map(function(c){
                    var badgeClass = c.status==='正常'?'badge-success':'badge-warning';
                    return '<tr><td>'+c.name+'</td><td>'+c.type+'</td><td>'+c.start+'</td><td>'+c.end+'</td><td><span class="badge '+badgeClass+'">'+c.status+'</span></td><td><button class="btn btn-sm btn-primary" onclick="alert(\'续签合同\')">续签</button></td></tr>';
                }).join('')+'</tbody></table></div>';
            },
            turnover: function(){
                return '<div style="text-align:right;margin-bottom:15px;"><button class="btn btn-primary" onclick="openModal(\'离职申请\',\'<div class=form-group><label>员工姓名</label><select><option>孙七</option><option>周八</option></select></div><div class=form-group><label>离职类型</label><select><option>主动离职</option><option>合同到期</option></select></div><div class=form-group><label>离职原因</label><textarea></textarea></div>\')">+ 提交离职申请</button></div><div class="card"><table><thead><tr><th>员工姓名</th><th>离职类型</th><th>状态</th><th>提交日期</th><th>操作</th></tr></thead><tbody>'+
                [
                    {name:'吴九',type:'主动离职',status:'已完成',submit:'2026-07-01'},
                    {name:'钱十一',type:'合同到期',status:'审批中',submit:'2026-07-06'}
                ].map(function(t){
                    var badgeClass = t.status==='已完成'?'badge-success':'badge-warning';
                    var action = t.status==='审批中'?'<button class="btn btn-sm btn-success" onclick="alert(\'批准离职\')">批准离职</button>':'';
                    return '<tr><td>'+t.name+'</td><td>'+t.type+'</td><td><span class="badge '+badgeClass+'">'+t.status+'</span></td><td>'+t.submit+'</td><td>'+action+'</td></tr>';
                }).join('')+'</tbody></table></div>';
            },
            training: function(){
                return '<div style="text-align:right;margin-bottom:15px;"><button class="btn btn-primary" onclick="openModal(\'新增培训\',\'<div class=form-group><label>培训名称</label><input type=text></div><div class=form-group><label>类型</label><select><option>技术培训</option><option>管理培训</option></select></div>\')">+ 新增培训</button></div><div class="card"><table><thead><tr><th>培训名称</th><th>类型</th><th>状态</th><th>参与人数</th><th>操作</th></tr></thead><tbody>'+
                [
                    {name:'Java进阶培训',type:'技术培训',status:'进行中',num:20},
                    {name:'新员工入职培训',type:'入职培训',status:'已完成',num:5},
                    {name:'项目管理培训',type:'管理培训',status:'待开始',num:15}
                ].map(function(t){
                    var badgeClass = t.status==='已完成'?'badge-success':t.status==='进行中'?'badge-warning':'badge-info';
                    return '<tr><td>'+t.name+'</td><td>'+t.type+'</td><td><span class="badge '+badgeClass+'">'+t.status+'</span></td><td>'+t.num+'人</td><td><button class="btn btn-sm btn-primary" onclick="alert(\'编辑培训\')">编辑</button></td></tr>';
                }).join('')+'</tbody></table></div>';
            },
            notice: function(){
                return '<div style="text-align:right;margin-bottom:15px;"><button class="btn btn-primary" onclick="openModal(\'发布公告\',\'<div class=form-group><label>标题</label><input type=text></div><div class=form-group><label>内容</label><textarea></textarea></div>\')">+ 发布公告</button></div><div class="card"><table><thead><tr><th>标题</th><th>发布日期</th><th>状态</th><th>操作</th></tr></thead><tbody>'+
                [
                    {title:'端午节放假安排',date:'2026-06-15',status:'已发布'},
                    {title:'年度体检通知',date:'2026-06-20',status:'已发布'},
                    {title:'新员工培训计划',date:'2026-07-01',status:'待发布'}
                ].map(function(n){
                    var badgeClass = n.status==='已发布'?'badge-success':'badge-info';
                    var action = n.status==='待发布'?'<button class="btn btn-sm btn-success" onclick="alert(\'发布公告\')">发布</button>':'';
                    return '<tr><td>'+n.title+'</td><td>'+n.date+'</td><td><span class="badge '+badgeClass+'">'+n.status+'</span></td><td>'+action+'</td></tr>';
                }).join('')+'</tbody></table></div>';
            }
        };
        var titles = {
            dashboard:'仪表盘',employee:'人事管理',attendance:'考勤管理',salary:'薪资管理',
            asset:'资产设备',vehicle:'车辆管理',welfare:'福利管理',contract:'合同管理',
            turnover:'离职流程',training:'员工培训',notice:'公告管理'
        };
        function showPage(page){
            document.querySelectorAll('.menu-item').forEach(function(m){m.classList.remove('active');});
            event.target.classList.add('active');
            document.getElementById('pageTitle').textContent = titles[page];
            document.getElementById('pageContent').innerHTML = pages[page]();
        }
        function openModal(title,body){
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = body;
            document.getElementById('modal').classList.add('show');
        }
        function closeModal(){
            document.getElementById('modal').classList.remove('show');
        }
        function saveModal(){
            alert('保存成功');
            closeModal();
        }
        function switchTab(el,tab){
            document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
            el.classList.add('active');
            var card = document.getElementById('att-card') || document.getElementById('vehicle-card');
            if(tab==='monthly'){
                card.innerHTML = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;"><div style="background:#f9fafb;padding:20px;border-radius:8px;"><div style="font-size:24px;font-weight:700;color:#10b981;">95%</div><div style="font-size:14px;color:#6b7280;">出勤率</div></div><div style="background:#f9fafb;padding:20px;border-radius:8px;"><div style="font-size:24px;font-weight:700;color:#f59e0b;">3</div><div style="font-size:14px;color:#6b7280;">迟到次数</div></div><div style="background:#f9fafb;padding:20px;border-radius:8px;"><div style="font-size:24px;font-weight:700;color:#ef4444;">1</div><div style="font-size:14px;color:#6b7280;">早退次数</div></div></div>';
            }else if(tab==='violation'){
