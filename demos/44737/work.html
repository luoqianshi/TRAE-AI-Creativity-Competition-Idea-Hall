<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基于现有食材的智能菜谱演示</title>
    <style>
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .mock-phone {
            background-color: #ffffff;
            width: 375px;
            height: 667px;
            border-radius: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 8px solid #333;
        }
        .header {
            background-color: #07c160;
            color: #ffffff;
            text-align: center;
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
        }
        .main-content {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #333333;
            margin-bottom: 15px;
        }
        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }
        .ingredient-tag {
            background-color: #f0f0f0;
            color: #333333;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .ingredient-tag.active {
            background-color: #07c160;
            color: #ffffff;
        }
        .generate-btn {
            background-color: #ff9800;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 12px 0;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .generate-btn:hover {
            background-color: #e68a00;
        }
        .recipe-result {
            background-color: #f9f9f9;
            border: 1px solid #eeeeee;
            border-radius: 10px;
            padding: 15px;
            display: none;
        }
        .recipe-title {
            font-size: 18px;
            color: #ff5722;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid #eeeeee;
            padding-bottom: 5px;
        }
        .recipe-steps {
            font-size: 14px;
            color: #666666;
            line-height: 1.6;
        }
        .step-item {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="mock-phone">
        <div class="header">智能菜谱</div>
        <div class="main-content">
            <div class="section-title">请选择冰箱里现有的食材：</div>
            
            <div class="tag-container" id="ingredientBox">
                <div class="ingredient-tag" onclick="toggleSelection(this)">西红柿</div>
                <div class="ingredient-tag" onclick="toggleSelection(this)">鸡蛋</div>
                <div class="ingredient-tag" onclick="toggleSelection(this)">土豆</div>
                <div class="ingredient-tag" onclick="toggleSelection(this)">牛肉</div>
                <div class="ingredient-tag" onclick="toggleSelection(this)">青椒</div>
                <div class="ingredient-tag" onclick="toggleSelection(this)">洋葱</div>
                <div class="ingredient-tag" onclick="toggleSelection(this)">猪肉</div>
            </div>

            <button class="generate-btn" onclick="generateRecipe()">一键生成菜谱</button>

            <div class="recipe-result" id="resultArea">
                <div class="recipe-title" id="dishName"></div>
                <div class="recipe-steps" id="dishSteps"></div>
            </div>
        </div>
    </div>

    <script>
        function toggleSelection(element) {
            element.classList.toggle('active');
        }

        function generateRecipe() {
            const activeTags = document.querySelectorAll('.ingredient-tag.active');
            const selectedIngredients = Array.from(activeTags).map(tag => tag.innerText);
            const resultArea = document.getElementById('resultArea');
            const dishName = document.getElementById('dishName');
            const dishSteps = document.getElementById('dishSteps');

            if (selectedIngredients.length === 0) {
                alert("请至少选择一种食材");
                return;
            }

            resultArea.style.display = 'block';

            // 简单的逻辑判断，模拟AI生成
            if (selectedIngredients.includes('西红柿') && selectedIngredients.includes('鸡蛋')) {
                dishName.innerText = "经典西红柿炒鸡蛋";
                dishSteps.innerHTML = `
                    <div class="step-item">1. 西红柿洗净切块，鸡蛋打入碗中搅匀。</div>
                    <div class="step-item">2. 热锅热油，倒入鸡蛋液炒熟后盛出备用。</div>
                    <div class="step-item">3. 锅中底油炒香葱花，下西红柿翻炒出汁。</div>
                    <div class="step-item">4. 加入炒好的鸡蛋，加少许盐和糖调味，翻炒均匀出锅。</div>
                `;
            } else if (selectedIngredients.includes('土豆') && selectedIngredients.includes('牛肉')) {
                dishName.innerText = "家常土豆炖牛肉";
                dishSteps.innerHTML = `
                    <div class="step-item">1. 牛肉切块焯水去血沫，土豆切滚刀块。</div>
                    <div class="step-item">2. 锅中热油，下葱姜蒜八角炒香，放入牛肉翻炒变色。</div>
                    <div class="step-item">3. 加生抽、老抽、料酒调味，加开水没过牛肉，小火炖煮40分钟。</div>
                    <div class="step-item">4. 加入土豆块，继续炖煮20分钟至土豆软烂，大火收汁。</div>
                `;
            } else if (selectedIngredients.includes('青椒') && selectedIngredients.includes('猪肉')) {
                dishName.innerText = "农家青椒肉丝";
                dishSteps.innerHTML = `
                    <div class="step-item">1. 猪肉切丝，加生抽、淀粉腌制10分钟；青椒切丝。</div>
                    <div class="step-item">2. 热锅滑油，下肉丝快速炒至变色盛出。</div>
                    <div class="step-item">3. 原锅底油炒香蒜末，下青椒丝翻炒至断生。</div>
                    <div class="step-item">4. 倒入肉丝同炒，加适量盐调味，翻匀出锅。</div>
                `;
            } else {
                dishName.innerText = "创意混搭炒菜";
                dishSteps.innerHTML = `
                    <div class="step-item">1. 将所选的 <b>${selectedIngredients.join('、')}</b> 清洗干净并切成大小适中的块或片。</div>
                    <div class="step-item">2. 锅中放入适量食用油烧热。</div>
                    <div class="step-item">3. 按照食材易熟程度（肉类先下，蔬菜后下）依次放入锅中翻炒。</div>
                    <div class="step-item">4. 加入生抽、盐等基础调料翻炒均匀，熟透后即可装盘。</div>
                `;
            }
        }
    </script>
</body>
</html>
