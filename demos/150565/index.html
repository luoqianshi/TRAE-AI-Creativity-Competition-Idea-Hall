<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>衡阳保卫战 - 方先觉壕</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #87ceeb; overflow: hidden; font-family: 'Microsoft YaHei', sans-serif; cursor: crosshair; }
    #game-container { width: 100%; height: 100vh; position: relative; }
    
    .ui-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 10;
    }
    
    .hud-top {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between;
    }
    
    .player-panel {
      background: rgba(0,0,0,0.7); color: #fff; padding: 10px; border-radius: 8px;
      pointer-events: auto;
    }
    
    .stat-bar { height: 15px; background: #333; border-radius: 7px; margin: 5px 0; overflow: hidden; }
    .stat-fill { height: 100%; border-radius: 7px; display: flex; align-items: center; justify-content: center; }
    .stat-fill.hp { background: #ff4444; }
    .stat-fill.ammo { background: #44ff44; }
    .stat-text { font-size: 10px; color: #fff; }
    
    .weapon-info { margin-top: 5px; font-size: 12px; }
    .current-weapon { font-weight: bold; color: #ffaa00; }
    
    .weapon-switch {
      display: flex; gap: 5px; margin-top: 5px;
    }
    
    .weapon-btn {
      padding: 3px 8px; border: 1px solid #555; border-radius: 4px;
      font-size: 10px; cursor: pointer; background: #333; color: #fff;
      pointer-events: auto;
    }
    
    .weapon-btn.active { border-color: #ffaa00; background: #554400; }
    
    .level-info {
      background: rgba(0,0,0,0.7); color: #fff; padding: 10px; border-radius: 8px;
      text-align: center;
    }
    
    .level-info h2 { font-size: 16px; color: #c86432; }
    
    .crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 20px; height: 20px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    
    .crosshair::before, .crosshair::after {
      content: ''; position: absolute; background: #fff;
    }
    
    .crosshair::before { width: 2px; height: 20px; top: 0; left: 9px; }
    .crosshair::after { width: 20px; height: 2px; top: 9px; left: 0; }
    
    .game-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 100;
      pointer-events: auto;
    }
    
    .game-overlay h1 { color: #c86432; font-size: 3rem; margin-bottom: 20px; }
    .game-overlay h2 { color: #d4d4d4; font-size: 1.5rem; margin-bottom: 30px; }
    
    .level-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
      max-width: 800px; margin-bottom: 30px;
    }
    
    .level-card {
      background: rgba(50,50,50,0.8); border: 2px solid #444; border-radius: 10px;
      padding: 20px; text-align: center; cursor: pointer;
      transition: all 0.3s;
    }
    
    .level-card:hover { border-color: #c86432; background: rgba(80,60,40,0.8); }
    .level-card.completed { border-color: #00ff00; }
    .level-card.current { border-color: #ffaa00; }
    
    .level-card h3 { color: #fff; margin-bottom: 5px; }
    .level-card p { color: #aaa; font-size: 12px; margin-bottom: 10px; }
    .level-card .level-btn {
      padding: 8px 20px; background: linear-gradient(90deg, #8b0000, #cc0000);
      color: #fff; border: none; border-radius: 4px; cursor: pointer;
    }
    
    .start-btn {
      padding: 15px 50px; font-size: 1.3rem; font-weight: bold;
      color: #fff; background: linear-gradient(90deg, #8b0000, #cc0000);
      border: none; border-radius: 8px; cursor: pointer;
    }
    
    .info-text {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.7); font-size: 12px;
      text-align: center;
    }
    
    #level-complete-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); display: none; flex-direction: column;
      align-items: center; justify-content: center; z-index: 200;
      pointer-events: auto;
    }
    
    #level-complete-overlay h1 { color: #00ff00; font-size: 3rem; margin-bottom: 20px; }
    #level-complete-overlay p { color: #d4d4d4; font-size: 1.2rem; margin-bottom: 30px; }
    
    .control-hints {
      position: absolute; bottom: 10px; left: 10px;
      background: rgba(0,0,0,0.5); color: #fff; padding: 10px;
      border-radius: 5px; font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  
  <div class="ui-layer">
    <div class="hud-top">
      <div class="player-panel">
        <h3>第十军 士兵</h3>
        <div class="stat-bar">
          <div class="stat-fill hp" id="hp-bar" style="width: 100%;">
            <span class="stat-text" id="hp-text">100/100</span>
          </div>
        </div>
        <div class="stat-bar">
          <div class="stat-fill ammo" id="ammo-bar" style="width: 100%;">
            <span class="stat-text" id="ammo-text">30/30</span>
          </div>
        </div>
        <div class="weapon-info">
          <div class="current-weapon" id="current-weapon">中正式步枪</div>
          <div>备用: <span id="reserve-ammo">150</span></div>
        </div>
        <div class="weapon-switch">
          <button class="weapon-btn active" id="weapon-1" onclick="switchWeapon(0)">1. 步枪</button>
          <button class="weapon-btn" id="weapon-2" onclick="switchWeapon(1)">2. 手枪</button>
          <button class="weapon-btn" id="weapon-3" onclick="switchWeapon(2)">3. 冲锋枪</button>
        </div>
      </div>
      
      <div class="level-info">
        <h2 id="level-title">方先觉壕防线</h2>
        <p id="level-desc">第一关：护城河防线</p>
        <div>日军: <span id="enemy-count">0</span>/<span id="total-enemies">30</span></div>
        <div>友军: <span id="friend-count">6</span></div>
      </div>
    </div>
    
    <div class="crosshair" id="crosshair"></div>
    
    <div class="control-hints">
      W/A/S/D 移动 | 鼠标 瞄准 | 左键 射击 | R 换弹 | 1/2/3 切换武器 | ESC 暂停
    </div>
  </div>
  
  <div id="overlay" class="game-overlay">
    <h1>衡阳保卫战</h1>
    <h2>1944年8月 - 方先觉壕</h2>
    <button class="start-btn" onclick="showLevelSelect()">选择阵地</button>
  </div>
  
  <div id="level-select" class="game-overlay" style="display:none;">
    <h1>选择作战阵地</h1>
    <div class="level-grid">
      <div class="level-card current" onclick="selectLevel(0)">
        <h3>第一关</h3>
        <p>护城河防线</p>
        <p style="font-size:10px;color:#ffaa00;">方先觉设计</p>
        <button class="level-btn">死守!</button>
      </div>
      <div class="level-card" onclick="selectLevel(1)">
        <h3>第二关</h3>
        <p>战壕防线</p>
        <p style="font-size:10px;color:#ffaa00;">交叉火力</p>
        <button class="level-btn">死守!</button>
      </div>
      <div class="level-card" onclick="selectLevel(2)">
        <h3>第三关</h3>
        <p>碉堡阵地</p>
        <p style="font-size:10px;color:#ffaa00;">机枪碉堡</p>
        <button class="level-btn">死守!</button>
      </div>
      <div class="level-card" onclick="selectLevel(3)">
        <h3>第四关</h3>
        <p>核心防线</p>
        <p style="font-size:10px;color:#ffaa00;">师团总攻</p>
        <button class="level-btn">死守!</button>
      </div>
      <div class="level-card" onclick="selectLevel(4)">
        <h3>第五关</h3>
        <p>衡阳城防</p>
        <p style="font-size:10px;color:#ffaa00;">最终决战</p>
        <button class="level-btn">死守!</button>
      </div>
    </div>
    <button class="start-btn" style="margin-top:20px;" onclick="hideLevelSelect()">返回</button>
  </div>
  
  <div id="level-complete-overlay">
    <h1>关卡完成!</h1>
    <p>击杀敌人: <span id="killed-count">0</span></p>
    <button class="start-btn" onclick="nextLevel()">下一关</button>
    <button class="start-btn" style="background:#444;margin-top:10px;" onclick="showLevelSelect()">选择其他关卡</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    console.log('Three.js loaded:', THREE.REVISION);
    
    let scene, camera, renderer;
    let enemies = [], friends = [], bullets = [], particles = [];
    let keys = {}, mouse = { x: 0, y: 0, isLocked: false };
    let gameState = 'menu';
    let currentLevel = 0;
    let enemiesSpawned = 0, enemiesKilled = 0;
    let enemiesInWave = 0;
    let waveDelayTimer = 0;
    
    const LEVELS = [
      { name: '护城河防线', desc: '方先觉设计的第一道防线', enemies: 30, friends: 6 },
      { name: '战壕防线', desc: '交叉火力网，日军难以突破', enemies: 40, friends: 8 },
      { name: '碉堡阵地', desc: '机枪碉堡，固若金汤', enemies: 50, friends: 10 },
      { name: '核心防线', desc: '师团总攻，生死之战', enemies: 60, friends: 12 },
      { name: '衡阳城防', desc: '最终决战，死守衡阳', enemies: 80, friends: 15 }
    ];
    
    const WEAPONS = [
      { name: '中正式步枪', damage: 10, range: 200, rate: 150, magSize: 30, reserve: 150, color: 0x888888 },
      { name: '驳壳枪', damage: 10, range: 50, rate: 100, magSize: 10, reserve: 80, color: 0x666666 },
      { name: '汤姆森冲锋枪', damage: 10, range: 80, rate: 50, magSize: 50, reserve: 200, color: 0x444444 }
    ];
    
    let currentWeapon = 0;
    let currentClip = 30;
    let playerHealth = 100;
    let lastShotTime = 0;
    
    const GROUND_SIZE = 150;
    
    function init() {
      const container = document.getElementById('game-container');
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);
      scene.fog = new THREE.Fog(0x87ceeb, 80, 200);
      
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
      camera.position.set(0, 1.8, 30);
      camera.lookAt(0, 1.8, -50);
      
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);
      
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);
      
      const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
      directionalLight.position.set(100, 200, 100);
      directionalLight.castShadow = true;
      scene.add(directionalLight);
      
      createTerrain();
      
      setupInput();
      
      animate();
      console.log('Scene initialized!');
    }
    
    function createTerrain() {
      const geometry = new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE);
      const material = new THREE.MeshStandardMaterial({ color: 0x6b8e5a });
      const ground = new THREE.Mesh(geometry, material);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);
    }
    
    function buildBattlefield() {
      while (scene.children.length > 0) {
        if (scene.children[0].type !== 'AmbientLight' && 
            scene.children[0].type !== 'DirectionalLight') {
          scene.remove(scene.children[0]);
        } else {
          break;
        }
      }
      
      createTerrain();
      
      const level = LEVELS[currentLevel];
      
      if (currentLevel === 0) {
        buildMoatDefense();
      } else if (currentLevel === 1) {
        buildTrenchDefense();
      } else if (currentLevel === 2) {
        buildBunkerDefense();
      } else if (currentLevel === 3) {
        buildCoreDefense();
      } else {
        buildCityDefense();
      }
      
      spawnFriendlies(level.friends);
    }
    
    function buildMoatDefense() {
      const moatGeo = new THREE.BoxGeometry(120, 2, 8);
      const moatMat = new THREE.MeshStandardMaterial({ color: 0x2a5a8a });
      const moat = new THREE.Mesh(moatGeo, moatMat);
      moat.position.set(0, -1, 0);
      scene.add(moat);
      
      const waterGeo = new THREE.PlaneGeometry(120, 8);
      const waterMat = new THREE.MeshStandardMaterial({ color: 0x4a8ab0, transparent: true, opacity: 0.6 });
      const water = new THREE.Mesh(waterGeo, waterMat);
      water.rotation.x = -Math.PI / 2;
      water.position.set(0, -0.05, 0);
      scene.add(water);
      
      const trenchGeo = new THREE.BoxGeometry(100, 1.2, 2);
      const trenchMat = new THREE.MeshStandardMaterial({ color: 0x3a3020 });
      const trench = new THREE.Mesh(trenchGeo, trenchMat);
      trench.position.set(0, -0.6, 20);
      scene.add(trench);
      
      createSandbags(-45, 22);
      createSandbags(45, 22);
      createSandbags(0, 22);
    }
    
    function buildTrenchDefense() {
      for (let i = -40; i <= 40; i += 20) {
        const trenchGeo = new THREE.BoxGeometry(18, 1.5, 3);
        const trenchMat = new THREE.MeshStandardMaterial({ color: 0x3a3020 });
        const trench = new THREE.Mesh(trenchGeo, trenchMat);
        trench.position.set(i, -0.75, 25);
        scene.add(trench);
        
        if (i < 40) {
          const connectorGeo = new THREE.BoxGeometry(2, 1.5, 3);
          const connector = new THREE.Mesh(connectorGeo, trenchMat);
          connector.position.set(i + 10, -0.75, 15);
          scene.add(connector);
        }
      }
      
      createMachineGun(-30, 28);
      createMachineGun(30, 28);
    }
    
    function buildBunkerDefense() {
      createBunker(-40, 20);
      createBunker(40, 20);
      createBunker(0, 25);
      
      const wallGeo = new THREE.BoxGeometry(100, 3, 1);
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x5a5040 });
      const wall = new THREE.Mesh(wallGeo, wallMat);
      wall.position.set(0, 1.5, 30);
      scene.add(wall);
      
      createMachineGun(-35, 22);
      createMachineGun(35, 22);
    }
    
    function buildCoreDefense() {
      for (let i = 0; i < 4; i++) {
        createBunker(-30 + i * 20, 20);
      }
      
      const moatGeo = new THREE.BoxGeometry(140, 3, 10);
      const moatMat = new THREE.MeshStandardMaterial({ color: 0x2a5a8a });
      const moat = new THREE.Mesh(moatGeo, moatMat);
      moat.position.set(0, -1.5, 10);
      scene.add(moat);
      
      createMachineGun(-25, 22);
      createMachineGun(-5, 22);
      createMachineGun(15, 22);
      createMachineGun(35, 22);
    }
    
    function buildCityDefense() {
      for (let i = 0; i < 5; i++) {
        createBunker(-40 + i * 20, 20);
      }
      
      const wallGeo = new THREE.BoxGeometry(120, 5, 2);
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x6a6050 });
      const wall = new THREE.Mesh(wallGeo, wallMat);
      wall.position.set(0, 2.5, 35);
      scene.add(wall);
      
      createMachineGun(-30, 25);
      createMachineGun(-10, 25);
      createMachineGun(10, 25);
      createMachineGun(30, 25);
    }
    
    function createBunker(x, z) {
      const group = new THREE.Group();
      
      const base = new THREE.Mesh(
        new THREE.BoxGeometry(6, 2.5, 5),
        new THREE.MeshStandardMaterial({ color: 0x4a4030 })
      );
      base.position.set(0, 1.25, 0);
      base.castShadow = true;
      group.add(base);
      
      const roof = new THREE.Mesh(
        new THREE.BoxGeometry(7, 1.5, 6),
        new THREE.MeshStandardMaterial({ color: 0x5a5040 })
      );
      roof.position.set(0, 3, 0);
      roof.castShadow = true;
      group.add(roof);
      
      group.position.set(x, 0, z);
      scene.add(group);
    }
    
    function createMachineGun(x, z) {
      const group = new THREE.Group();
      
      const barrel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.15, 0.15, 2.5, 8),
        new THREE.MeshStandardMaterial({ color: 0x2a2a2a })
      );
      barrel.rotation.x = Math.PI / 2;
      barrel.position.set(0, 1.2, 0);
      barrel.castShadow = true;
      group.add(barrel);
      
      const tripod = new THREE.Mesh(
        new THREE.CylinderGeometry(0.06, 0.06, 1.8, 4),
        new THREE.MeshStandardMaterial({ color: 0x3a3a3a })
      );
      tripod.position.set(0, 0.9, 0);
      group.add(tripod);
      
      group.position.set(x, 0, z);
      scene.add(group);
    }
    
    function createSandbags(x, z) {
      for (let i = -3; i <= 3; i++) {
        const bagGeo = new THREE.BoxGeometry(1.2, 0.5, 0.8);
        const bagMat = new THREE.MeshStandardMaterial({ color: 0x6a5a4a });
        const bag = new THREE.Mesh(bagGeo, bagMat);
        bag.position.set(x + i * 1.3, 0.25, z);
        bag.castShadow = true;
        scene.add(bag);
      }
    }
    
    function spawnFriendlies(count) {
      friends.forEach(f => scene.remove(f.mesh));
      friends = [];
      
      const positions = [];
      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI - Math.PI / 2;
        positions.push({
          x: Math.sin(angle) * 30,
          z: 25 + Math.cos(angle) * 5
        });
      }
      
      positions.forEach(pos => {
        const friend = createFriendModel(pos.x, pos.z);
        scene.add(friend);
        friends.push({ mesh: friend, x: pos.x, z: pos.z, shootTimer: Math.random() * 1000 });
      });
    }
    
    function createFriendModel(x, z) {
      const group = new THREE.Group();
      
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, 1.3, 0.4),
        new THREE.MeshStandardMaterial({ color: 0x8b0000 })
      );
      body.position.set(0, 0.65, 0);
      body.castShadow = true;
      group.add(body);
      
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.28, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xffcc99 })
      );
      head.position.set(0, 1.35, 0);
      head.castShadow = true;
      group.add(head);
      
      const helmet = new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0x555555 })
      );
      helmet.position.set(0, 1.35, 0);
      helmet.scale.y = 0.6;
      group.add(helmet);
      
      const gun = new THREE.Mesh(
        new THREE.CylinderGeometry(0.06, 0.06, 1, 8),
        new THREE.MeshStandardMaterial({ color: 0x333333 })
      );
      gun.rotation.x = Math.PI / 2;
      gun.position.set(0.25, 0.7, 0);
      group.add(gun);
      
      const flag = new THREE.Mesh(
        new THREE.BoxGeometry(0.03, 0.5, 0.3),
        new THREE.MeshStandardMaterial({ color: 0xff0000 })
      );
      flag.position.set(0, 1.7, -0.2);
      group.add(flag);
      
      group.position.set(x, 0, z);
      group.rotation.y = Math.PI;
      
      return group;
    }
    
    function spawnEnemy() {
      const level = LEVELS[currentLevel];
      if (enemiesSpawned >= level.enemies) return;
      if (enemiesInWave >= 5) return;
      
      const x = 60 + Math.random() * 30;
      const z = -30 + Math.random() * 100;
      
      const enemy = createEnemyModel(x, z);
      scene.add(enemy);
      enemies.push({
        mesh: enemy,
        x: x,
        z: z,
        speed: 0.02 + Math.random() * 0.03,
        hp: 20,
        shootTimer: Math.random() * 2000,
        isAlive: true
      });
      
      enemiesSpawned++;
      enemiesInWave++;
      updateUI();
    }
    
    function createEnemyModel(x, z) {
      const group = new THREE.Group();
      
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.55, 1.4, 0.45),
        new THREE.MeshStandardMaterial({ color: 0x333344 })
      );
      body.position.set(0, 0.7, 0);
      body.castShadow = true;
      group.add(body);
      
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xffcc99 })
      );
      head.position.set(0, 1.5, 0);
      head.castShadow = true;
      group.add(head);
      
      const helmet = new THREE.Mesh(
        new THREE.SphereGeometry(0.33, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0x2a2a3a })
      );
      helmet.position.set(0, 1.5, 0);
      helmet.scale.y = 0.7;
      group.add(helmet);
      
      const gun = new THREE.Mesh(
        new THREE.CylinderGeometry(0.07, 0.07, 1.1, 8),
        new THREE.MeshStandardMaterial({ color: 0x1a1a1a })
      );
      gun.rotation.x = Math.PI / 2;
      gun.position.set(0.28, 0.8, 0);
      group.add(gun);
      
      const flag = new THREE.Mesh(
        new THREE.BoxGeometry(0.04, 0.6, 0.4),
        new THREE.MeshStandardMaterial({ color: 0xff0000 })
      );
      flag.position.set(0, 1.8, -0.25);
      group.add(flag);
      
      const marker = new THREE.Mesh(
        new THREE.ConeGeometry(0.12, 0.5, 8),
        new THREE.MeshStandardMaterial({ color: 0xff0000 })
      );
      marker.position.set(0, 2, 0);
      group.add(marker);
      
      group.position.set(x, 0, z);
      group.rotation.y = Math.PI;
      
      return group;
    }
    
    function shootBullet() {
      const now = Date.now();
      const weapon = WEAPONS[currentWeapon];
      
      if (now - lastShotTime < weapon.rate) return;
      if (currentClip <= 0) {
        reload();
        return;
      }
      
      lastShotTime = now;
      currentClip--;
      
      const startPos = camera.position.clone();
      const direction = new THREE.Vector3(0, 0, -1);
      direction.applyQuaternion(camera.quaternion);
      direction.normalize();
      
      const bulletGeo = new THREE.BoxGeometry(0.15, 0.06, 0.06);
      const bulletMat = new THREE.MeshStandardMaterial({ color: 0xffffcc });
      const bulletMesh = new THREE.Mesh(bulletGeo, bulletMat);
      bulletMesh.position.copy(startPos);
      bulletMesh.lookAt(startPos.clone().add(direction));
      scene.add(bulletMesh);
      
      bullets.push({
        mesh: bulletMesh,
        position: startPos.clone(),
        direction: direction.clone(),
        speed: 200,
        damage: weapon.damage,
        range: weapon.range,
        traveled: 0,
        isEnemy: false
      });
      
      createMuzzleFlash();
      updateUI();
    }
    
    function enemyShoot(enemy) {
      const startPos = enemy.mesh.position.clone();
      startPos.y += 1.2;
      
      const dx = camera.position.x - enemy.mesh.position.x;
      const dz = camera.position.z - enemy.mesh.position.z;
      const direction = new THREE.Vector3(dx, 0, dz).normalize();
      
      const bulletGeo = new THREE.BoxGeometry(0.12, 0.05, 0.05);
      const bulletMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
      const bulletMesh = new THREE.Mesh(bulletGeo, bulletMat);
      bulletMesh.position.copy(startPos);
      bulletMesh.lookAt(startPos.clone().add(direction));
      scene.add(bulletMesh);
      
      bullets.push({
        mesh: bulletMesh,
        position: startPos.clone(),
        direction: direction.clone(),
        speed: 150,
        damage: 10,
        range: 100,
        traveled: 0,
        isEnemy: true
      });
    }
    
    function createMuzzleFlash() {
      const flashGeo = new THREE.SphereGeometry(0.25, 8, 8);
      const flashMat = new THREE.MeshBasicMaterial({ 
        color: 0xffffaa,
        transparent: true,
        opacity: 0.9
      });
      const flash = new THREE.Mesh(flashGeo, flashMat);
      
      const direction = new THREE.Vector3(0, 0, -1);
      direction.applyQuaternion(camera.quaternion);
      flash.position.copy(camera.position);
      flash.position.addScaledVector(direction, 0.5);
      
      scene.add(flash);
      
      let opacity = 0.9;
      const animateFlash = () => {
        opacity -= 0.3;
        flash.material.opacity = opacity;
        flash.scale.setScalar(flash.scale.x + 0.3);
        
        if (opacity > 0) {
          requestAnimationFrame(animateFlash);
        } else {
          scene.remove(flash);
        }
      };
      animateFlash();
    }
    
    function reload() {
      const weapon = WEAPONS[currentWeapon];
      if (weapon.reserve <= 0) return;
      
      const needed = weapon.magSize - currentClip;
      const reloadAmount = Math.min(needed, weapon.reserve);
      
      currentClip += reloadAmount;
      weapon.reserve -= reloadAmount;
      updateUI();
    }
    
    window.switchWeapon = function(index) {
      currentWeapon = index;
      currentClip = WEAPONS[currentWeapon].magSize;
      
      document.querySelectorAll('.weapon-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });
      
      updateUI();
    };
    
    function createHitEffect(position, color) {
      for (let i = 0; i < 6; i++) {
        const particle = new THREE.Mesh(
          new THREE.SphereGeometry(0.06, 8, 8),
          new THREE.MeshBasicMaterial({ color: color })
        );
        particle.position.copy(position);
        scene.add(particle);
        
        particles.push({
          mesh: particle,
          velocity: new THREE.Vector3(
            (Math.random() - 0.5) * 0.4,
            Math.random() * 0.3,
            (Math.random() - 0.5) * 0.4
          ),
          life: 1,
          decay: 0.04
        });
      }
    }
    
    function createExplosion(position) {
      const flashGeo = new THREE.SphereGeometry(1.5, 16, 16);
      const flashMat = new THREE.MeshBasicMaterial({ 
        color: 0xff3300,
        transparent: true,
        opacity: 1
      });
      const flash = new THREE.Mesh(flashGeo, flashMat);
      flash.position.copy(position);
      flash.scale.set(0.3, 0.3, 0.3);
      scene.add(flash);
      
      let scale = 0.3;
      let opacity = 1;
      const animateFlash = () => {
        scale += 0.1;
        opacity -= 0.08;
        flash.scale.set(scale, scale, scale);
        flash.material.opacity = opacity;
        
        if (opacity > 0) {
          requestAnimationFrame(animateFlash);
        } else {
          scene.remove(flash);
        }
      };
      animateFlash();
      
      for (let i = 0; i < 15; i++) {
        const particle = new THREE.Mesh(
          new THREE.SphereGeometry(0.1, 8, 8),
          new THREE.MeshBasicMaterial({ color: 0xff6600 })
        );
        particle.position.copy(position);
        scene.add(particle);
        
        particles.push({
          mesh: particle,
          velocity: new THREE.Vector3(
            (Math.random() - 0.5) * 1.2,
            Math.random() * 1,
            (Math.random() - 0.5) * 1.2
          ),
          life: 1,
          decay: 0.03
        });
      }
    }
    
    function setupInput() {
      window.addEventListener('keydown', e => {
        keys[e.code] = true;
        
        if (e.code === 'Digit1') switchWeapon(0);
        if (e.code === 'Digit2') switchWeapon(1);
        if (e.code === 'Digit3') switchWeapon(2);
        if (e.code === 'KeyR') reload();
        
        if (e.code === 'Escape') {
          if (gameState === 'playing') {
            gameState = 'paused';
            document.exitPointerLock();
          } else if (gameState === 'paused') {
            gameState = 'playing';
            renderer.domElement.requestPointerLock();
          }
        }
      });
      
      window.addEventListener('keyup', e => {
        keys[e.code] = false;
      });
      
      renderer.domElement.addEventListener('mousedown', () => {
        if (gameState === 'playing') {
          shootBullet();
          renderer.domElement.requestPointerLock();
        }
      });
      
      document.addEventListener('mousemove', e => {
        if (!mouse.isLocked) return;
        
        const movementX = e.movementX || 0;
        const movementY = e.movementY || 0;
        
        camera.rotation.y -= movementX * 0.002;
        camera.rotation.x -= movementY * 0.002;
        camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
      });
      
      document.addEventListener('pointerlockchange', () => {
        mouse.isLocked = document.pointerLockElement === renderer.domElement;
      });
      
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }
    
    function updatePlayer(delta) {
      const speed = 5;
      
      const forward = new THREE.Vector3(0, 0, -1);
      forward.applyQuaternion(camera.quaternion);
      
      const right = new THREE.Vector3(1, 0, 0);
      right.applyQuaternion(camera.quaternion);
      
      if (keys['KeyW']) camera.position.addScaledVector(forward, speed * delta);
      if (keys['KeyS']) camera.position.addScaledVector(forward, -speed * delta);
      if (keys['KeyA']) camera.position.addScaledVector(right, -speed * delta);
      if (keys['KeyD']) camera.position.addScaledVector(right, speed * delta);
      
      camera.position.x = Math.max(-60, Math.min(60, camera.position.x));
      camera.position.z = Math.max(-40, Math.min(50, camera.position.z));
      camera.position.y = 1.8;
    }
    
    function updateEnemies(delta) {
      enemies.forEach(enemy => {
        if (!enemy.isAlive) return;
        
        const dx = camera.position.x - enemy.mesh.position.x;
        const dz = camera.position.z - enemy.mesh.position.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        
        const targetAngle = Math.atan2(dx, dz);
        enemy.mesh.rotation.y = targetAngle;
        
        if (dist > 10) {
          enemy.mesh.position.x += Math.sin(targetAngle) * enemy.speed;
          enemy.mesh.position.z += Math.cos(targetAngle) * enemy.speed;
        }
        
        enemy.mesh.position.x = Math.max(-60, Math.min(80, enemy.mesh.position.x));
        enemy.mesh.position.z = Math.max(-40, Math.min(45, enemy.mesh.position.z));
        
        enemy.shootTimer -= delta * 1000;
        if (enemy.shootTimer <= 0 && dist < 40) {
          enemy.shootTimer = 2000 + Math.random() * 1000;
          enemyShoot(enemy);
        }
      });
      
      const aliveEnemies = enemies.filter(e => e.isAlive).length;
      if (aliveEnemies === 0 && enemiesInWave > 0 && enemiesSpawned < LEVELS[currentLevel].enemies) {
        waveDelayTimer += delta;
        if (waveDelayTimer >= 3) {
          waveDelayTimer = 0;
          enemiesInWave = 0;
        }
      }
    }
    
    function updateFriendlies(delta) {
      const now = Date.now();
      
      friends.forEach(friend => {
        let nearestEnemy = null;
        let minDist = Infinity;
        
        enemies.forEach(enemy => {
          if (!enemy.isAlive) return;
          const dx = enemy.mesh.position.x - friend.mesh.position.x;
          const dz = enemy.mesh.position.z - friend.mesh.position.z;
          const dist = Math.sqrt(dx * dx + dz * dz);
          if (dist < minDist && dist < 50) {
            minDist = dist;
            nearestEnemy = enemy;
          }
        });
        
        if (nearestEnemy) {
          const dx = nearestEnemy.mesh.position.x - friend.mesh.position.x;
          const dz = nearestEnemy.mesh.position.z - friend.mesh.position.z;
          friend.mesh.rotation.y = Math.atan2(dx, dz);
          
          if (Math.random() < 0.02) {
            createHitEffect(nearestEnemy.mesh.position, 0xff0000);
            nearestEnemy.hp -= 10;
            if (nearestEnemy.hp <= 0) {
              nearestEnemy.isAlive = false;
              enemiesKilled++;
              createExplosion(nearestEnemy.mesh.position);
              scene.remove(nearestEnemy.mesh);
            }
          }
        }
      });
    }
    
    function updateBullets(delta) {
      bullets = bullets.filter(bullet => {
        bullet.position.addScaledVector(bullet.direction, bullet.speed * delta);
        bullet.mesh.position.copy(bullet.position);
        bullet.mesh.lookAt(bullet.position.clone().add(bullet.direction));
        bullet.traveled += bullet.speed * delta;
        
        if (bullet.traveled >= bullet.range) {
          scene.remove(bullet.mesh);
          return false;
        }
        
        if (bullet.isEnemy) {
          const playerDist = bullet.position.distanceTo(camera.position);
          if (playerDist < 0.8) {
            playerHealth -= bullet.damage;
            createHitEffect(bullet.position, 0xff0000);
            
            if (playerHealth <= 0) {
              playerHealth = 0;
              gameState = 'gameOver';
              document.exitPointerLock();
            }
            
            scene.remove(bullet.mesh);
            updateUI();
            return false;
          }
        } else {
          for (const enemy of enemies) {
            if (!enemy.isAlive) continue;
            
            const dist = bullet.position.distanceTo(enemy.mesh.position);
            if (dist < 0.6) {
              enemy.hp -= bullet.damage;
              createHitEffect(bullet.position, 0xff0000);
              
              if (enemy.hp <= 0) {
                enemy.isAlive = false;
                enemiesKilled++;
                createExplosion(enemy.mesh.position);
                scene.remove(enemy.mesh);
              }
              
              scene.remove(bullet.mesh);
              return false;
            }
          }
        }
        
        return true;
      });
    }
    
    function updateParticles() {
      particles = particles.filter(particle => {
        particle.mesh.position.add(particle.velocity);
        particle.mesh.position.y -= 0.01;
        particle.life -= particle.decay;
        particle.mesh.material.opacity = particle.life;
        
        if (particle.life <= 0) {
          scene.remove(particle.mesh);
          return false;
        }
        
        return true;
      });
    }
    
    function checkLevelComplete() {
      const level = LEVELS[currentLevel];
      if (enemiesKilled >= level.enemies && enemiesSpawned >= level.enemies) {
        gameState = 'levelComplete';
        document.getElementById('killed-count').textContent = enemiesKilled;
        document.getElementById('level-complete-overlay').style.display = 'flex';
        document.exitPointerLock();
      }
    }
    
    function updateUI() {
      const weapon = WEAPONS[currentWeapon];
      const level = LEVELS[currentLevel];
      
      document.getElementById('hp-bar').style.width = playerHealth + '%';
      document.getElementById('hp-text').textContent = playerHealth + '/100';
      
      document.getElementById('ammo-bar').style.width = (currentClip / weapon.magSize * 100) + '%';
      document.getElementById('ammo-text').textContent = currentClip + '/' + weapon.magSize;
      
      document.getElementById('current-weapon').textContent = weapon.name;
      document.getElementById('reserve-ammo').textContent = weapon.reserve;
      
      document.getElementById('enemy-count').textContent = enemies.filter(e => e.isAlive).length;
      document.getElementById('total-enemies').textContent = level.enemies;
      document.getElementById('friend-count').textContent = friends.length;
      
      document.getElementById('level-title').textContent = level.name;
      document.getElementById('level-desc').textContent = level.desc;
    }
    
    function animate() {
      requestAnimationFrame(animate);
      
      if (gameState === 'playing') {
        updatePlayer(0.016);
        updateEnemies(0.016);
        updateFriendlies(0.016);
        updateBullets(0.016);
        updateParticles();
        checkLevelComplete();
        
        if (enemiesSpawned < LEVELS[currentLevel].enemies && Math.random() < 0.02) {
          spawnEnemy();
        }
      }
      
      renderer.render(scene, camera);
    }
    
    window.showLevelSelect = function() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('level-select').style.display = 'flex';
    };
    
    window.hideLevelSelect = function() {
      document.getElementById('level-select').style.display = 'none';
      document.getElementById('overlay').style.display = 'flex';
    };
    
    window.selectLevel = function(index) {
      currentLevel = index;
      startGame();
    };
    
    window.startGame = function() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('level-select').style.display = 'none';
      document.getElementById('level-complete-overlay').style.display = 'none';
      
      enemiesSpawned = 0;
      enemiesKilled = 0;
      enemiesInWave = 0;
      waveDelayTimer = 0;
      enemies.forEach(e => scene.remove(e.mesh));
      enemies = [];
      bullets.forEach(b => scene.remove(b.mesh));
      bullets = [];
      
      playerHealth = 100;
      currentWeapon = 0;
      currentClip = WEAPONS[0].magSize;
      
      buildBattlefield();
      
      for (let i = 0; i < 5; i++) {
        spawnEnemy();
      }
      
      gameState = 'playing';
      updateUI();
      renderer.domElement.requestPointerLock();
    };
    
    window.nextLevel = function() {
      if (currentLevel < LEVELS.length - 1) {
        currentLevel++;
      }
      startGame();
    };
    
    init();
  </script>
</body>
</html>
