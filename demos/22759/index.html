                }
                
                // 变色百搭牌可以用于群组（同数字不同颜色）
                if (!foundMatch && joker.jokerType === 'color') {
                    // 寻找同数字不同颜色的牌，加上变色百搭牌组成群组
                    const numberGroups = {};
                    player.hand.forEach(card => {
                        if (!card.isJoker && !usedCardIds.has(card.id)) {
                            if (!numberGroups[card.number]) {
                                numberGroups[card.number] = [];
                            }
                            numberGroups[card.number].push(card);
                        }
                    });
                    
                    // 检查每个数字组是否可以和变色百搭牌组成有效群组
                    for (const num in numberGroups) {
                        const cards = numberGroups[num];
                        // 检查颜色是否重复
                        const colorSet = new Set(cards.map(c => c.color));
                        if (colorSet.size >= 2) { // 至少两种颜色，加上变色百搭牌可以组成群组
                            matchedGroupId = `group-${foundGroups.length}`;
                            matchedCards = [...cards, joker];
                            foundMatch = true;
                            break;
                        }
                    }
                    
                    if (foundMatch && matchedGroupId) {
                        matchedCards.forEach(card => {
                            card.suggested = true;
                            card.suggestedGroup = matchedGroupId;
                            usedCardIds.add(card.id);
                        });
                        
                        foundGroups.push({
                            id: matchedGroupId,
                            type: '群组（含变色百搭牌）',
                            cards: matchedCards
                        });
                    }
                }
            }
            
            // 重排手牌：群组在前，保持原有顺序在后
            const arrangedHand = [];
            
            // 添加群组卡牌（按识别顺序）
            foundGroups.forEach(group => {
                arrangedHand.push(...group.cards);
            });
            
            // 添加剩余卡牌（保持原顺序）
            player.hand.forEach(card => {
                if (!usedCardIds.has(card.id)) {
                    arrangedHand.push(card);
                }
            });
            
            // 更新手牌顺序
            player.hand = arrangedHand;
            
            renderHand();
            
            // 显示提示信息
            if (foundGroups.length > 0) {
                let message = `识别到 ${foundGroups.length} 组有效牌组：\n`;
                foundGroups.forEach((group, index) => {
                    message += `${index + 1}. ${group.type}: ${group.cards.map(c => c.isJoker ? '百搭牌' : `${c.color}色${c.number}`).join('、')}\n`;
                });
                message += '\n已高亮显示这些牌组，请选择要打出的牌组';
                showHint(message, 'success');
            } else {
                showHint('手牌已整理完成，但未找到可打出的有效牌组（至少需要3张同色连续数字或同数字不同颜色）', 'info');
            }
        }

        // 撤销操作
        function undoAction() {
            const player = gameState.players[gameState.currentIndex];
            if (player.isAI || gameState.isAIThinking) return;
            
            if (gameState.snapshotStack.length === 0) {
                showHint('没有可撤销的操作', 'error');
                return;
            }
            
            const snapshot = gameState.snapshotStack.pop();
            gameState.players = snapshot.players;
            gameState.table = snapshot.table;
            gameState.deck = snapshot.deck;
            gameState.currentIndex = snapshot.currentIndex;
            
            renderPlayersStatus();
            renderHand();
            renderTable();
            updateButtonStates();
            showHint('已撤销上一步操作', 'success');
        }

        // 重置回合
        function resetTurn() {
            const player = gameState.players[gameState.currentIndex];
            if (player.isAI || gameState.isAIThinking) return;
            
            if (gameState.snapshotStack.length === 0) {
                showHint('没有可重置的操作', 'error');
                return;
            }
            
            // 恢复到回合开始时的状态
            while (gameState.snapshotStack.length > 0) {
                const snapshot = gameState.snapshotStack.pop();
                gameState.players = snapshot.players;
                gameState.table = snapshot.table;
                gameState.deck = snapshot.deck;
                gameState.currentIndex = snapshot.currentIndex;
            }
            
            gameState.selectedCard = null;
            gameState.selectedGroupIndex = -1;
            
            renderPlayersStatus();
            renderHand();
            renderTable();
            updateButtonStates();
            showHint('回合已重置', 'success');
        }

        // 摸牌
        function drawCard() {
            const player = gameState.players[gameState.currentIndex];
            if (player.isAI || gameState.isAIThinking) return;
            if (gameState.deck.length === 0) {
                showHint('牌堆已空！', 'error');
                return;
            }
            
            // 检查是否已经摸牌
            if (gameState.hasDrawnThisTurn) {
                showHint('本回合已经摸过牌了', 'error');
                return;
            }
            
            saveSnapshot();
            
            // 摸一张牌
            const drawnCard = gameState.deck.pop();
            player.hand.push(drawnCard);
            
            // 标记已摸牌
            gameState.hasDrawnThisTurn = true;
            
            // 更新牌堆数量显示
            document.getElementById('deckCount').textContent = gameState.deck.length;
            
            // 结束回合
            gameState.selectedCard = null;
            showHint(`摸牌成功！已获得 ${drawnCard.isJoker ? '百搭牌' : `${drawnCard.color}色${drawnCard.number}`}`, 'success');
            nextTurn();
        }

        // 提交回合
        function submitTurn() {
            const player = gameState.players[gameState.currentIndex];
            if (player.isAI || gameState.isAIThinking) return;
            
            if (gameState.selectedCard) {
                showHint('请先取消选择卡牌或打出卡牌', 'error');
                return;
            }
            
            // 检查是否已摸牌，如果摸牌了就不能出牌
            if (gameState.hasDrawnThisTurn) {
                showHint('摸牌后不能立即出牌，请等待下一回合', 'error');
                return;
            }
            
            // 检查是否需要破冰
            if (!player.iceBroken) {
                // 计算本回合打出的牌的总分
                let totalPoints = 0;
                let hasJoker = false;
                
                // 检查桌面上的新牌组（本回合添加的）
                const newGroups = gameState.table.filter(group => group.isNew);
                newGroups.forEach(group => {
                    group.cards.forEach(card => {
                        if (card.isJoker) {
                            hasJoker = true;
                        } else {
                            totalPoints += card.number;
                        }
                    });
                });
                
                // 检查是否破冰成功
                if (totalPoints < 30) {
                    showHint(`破冰失败！首次出牌必须≥30点，当前只有${totalPoints}点`, 'error');
                    return;
                }
                
                if (hasJoker) {
                    showHint('破冰阶段禁止使用百搭牌！', 'error');
                    return;
                }
                
                // 破冰成功
                player.iceBroken = true;
                showHint(`破冰成功！${totalPoints}点`, 'success');
            }
            
            // 标记所有牌组为非新牌组
            gameState.table.forEach(group => {
                group.isNew = false;
            });
            
            showHint('回合已提交，等待其他玩家操作...', 'success');
            nextTurn();
        }

        // 下一个回合
        function nextTurn() {
            // 检查当前玩家是否获胜
            if (gameState.players[gameState.currentIndex].hand.length === 0) {
                gameState.winner = gameState.players[gameState.currentIndex];
                showWinner();
                return;
            }
            
            // 切换到下一个玩家
            gameState.currentIndex = (gameState.currentIndex + 1) % gameState.players.length;
            gameState.selectedCard = null;
            gameState.selectedGroupIndex = -1;
            gameState.hasDrawnThisTurn = false;  // 重置摸牌状态
            
            renderPlayersStatus();
            renderHand();
            renderTable();
            
            // 如果是AI玩家，自动执行回合
            if (gameState.players[gameState.currentIndex].isAI) {
                executeAITurn();
            }
        }

        // 执行AI回合
        async function executeAITurn() {
            gameState.isAIThinking = true;
            updateButtonStates();
            
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            const aiPlayer = gameState.players[gameState.currentIndex];
            
            // AI简单策略：尝试打出牌组
            const moves = findAIMoves(aiPlayer);
            
            if (moves.length > 0) {
                // 执行最佳移动
                const bestMove = moves[0];
                executeAIMove(bestMove);
            } else {
                // 无法出牌，摸牌
                if (gameState.deck.length > 0) {
                    const drawnCard = gameState.deck.pop();
                    aiPlayer.hand.push(drawnCard);
                    // 更新牌堆数量显示
                    document.getElementById('deckCount').textContent = gameState.deck.length;
                }
            }
            
            gameState.isAIThinking = false;
            updateButtonStates();
            
            // 检查是否获胜
            if (aiPlayer.hand.length === 0) {
                gameState.winner = aiPlayer;
                showWinner();
                return;
            }
            
            nextTurn();
        }

        // 寻找AI可执行的移动
        function findAIMoves(player) {
            const moves = [];
            
            // 检查是否已破冰
            if (!player.iceBroken) {
                // 尝试破冰
                const iceBreakGroups = findIceBreakGroups(player.hand);
                iceBreakGroups.forEach(group => {
                    moves.push({ type: 'iceBreak', cards: group });
                });
            } else {
                // 尝试添加到现有牌组
                gameState.table.forEach((group, groupIndex) => {
                    player.hand.forEach(card => {
                        const newGroup = [...group.cards, card];
                        if (isValidGroup(newGroup)) {
                            moves.push({ type: 'addToGroup', card: card, groupIndex: groupIndex });
                        }
                    });
                });
                
                // 尝试创建新牌组
                const newGroups = findNewGroupsFromHand(player.hand);
                newGroups.forEach(group => {
                    moves.push({ type: 'newGroup', cards: group });
                });
            }
            
            return moves;
        }

        // 寻找破冰牌组
        function findIceBreakGroups(hand) {
            const groups = [];
            const usedIndices = new Set();
            
            // 尝试找到所有可能的牌组组合
            for (let i = 0; i < hand.length; i++) {
                if (usedIndices.has(i)) continue;
                
                for (let j = i + 1; j < hand.length; j++) {
                    if (usedIndices.has(j)) continue;
                    
                    for (let k = j + 1; k < hand.length; k++) {
                        if (usedIndices.has(k)) continue;
                        
                        const group = [hand[i], hand[j], hand[k]];
                        if (isValidGroup(group)) {
                            const score = calculateGroupScore(group);
                            if (score >= 30) {
                                groups.push({ cards: group, score: score });
                            }
                        }
                    }
                }
            }
            
            // 按分数排序
            return groups.sort((a, b) => b.score - a.score).map(g => g.cards);
        }

        // 计算牌组分数
        function calculateGroupScore(cards) {
            return cards.reduce((sum, card) => sum + (card.isJoker ? 30 : card.number), 0);
        }

        // 从手牌寻找新牌组
        function findNewGroupsFromHand(hand) {
            const groups = [];
            const usedIndices = new Set();
            
            for (let i = 0; i < hand.length; i++) {
                if (usedIndices.has(i)) continue;
                if (hand[i].isJoker) continue;
                
                // 尝试找顺组
                const runCards = [hand[i]];
                const runIndices = [i];
                
                for (let num = hand[i].number - 1; num >= 1; num--) {
                    const foundIdx = hand.findIndex((c, idx) => !usedIndices.has(idx) && !runIndices.includes(idx) && 
                        !c.isJoker && c.color === hand[i].color && c.number === num);
                    if (foundIdx !== -1) {
                        runCards.push(hand[foundIdx]);
                        runIndices.push(foundIdx);
                    } else {
                        break;
                    }
                }
                
                for (let num = hand[i].number + 1; num <= 13; num++) {
                    const foundIdx = hand.findIndex((c, idx) => !usedIndices.has(idx) && !runIndices.includes(idx) && 
                        !c.isJoker && c.color === hand[i].color && c.number === num);
                    if (foundIdx !== -1) {
                        runCards.push(hand[foundIdx]);
                        runIndices.push(foundIdx);
                    } else {
                        break;
                    }
                }
                
                if (runCards.length >= 3) {
                    groups.push(runCards);
                    runIndices.forEach(idx => usedIndices.add(idx));
                    continue;
                }
                
                // 尝试找群组
                const setCards = [hand[i]];
                const setIndices = [i];
                const usedColors = [hand[i].color];
                
                const colors = ['red', 'yellow', 'blue', 'black'];
                for (const color of colors) {
                    if (usedColors.includes(color)) continue;
                    const foundIdx = hand.findIndex((c, idx) => !usedIndices.has(idx) && !setIndices.includes(idx) && 
                        !c.isJoker && c.color === color && c.number === hand[i].number);
                    if (foundIdx !== -1) {
                        setCards.push(hand[foundIdx]);
                        setIndices.push(foundIdx);
                        usedColors.push(color);
                    }
                }
                
                if (setCards.length >= 3) {
                    groups.push(setCards);
                    setIndices.forEach(idx => usedIndices.add(idx));
                }
            }
            
            return groups;
        }

        // 执行AI移动
        function executeAIMove(move) {
            const player = gameState.players[gameState.currentIndex];
            if (move.type === 'draw') {
                drawCard();
            } else if (move.type === 'place') {
                // 放置卡牌逻辑
                gameState.selectedCard = { card: move.card, from: 'hand', index: move.index };
                if (move.toTable) {
                    placeCardOnTable(move.groupIndex, move.position);
                } else {
                    placeCardOnExistingGroup(move.groupIndex, move.position);
                }
                gameState.selectedCard = null;
            } else if (move.type === 'iceBreak' || move.type === 'newGroup') {
                // 打出新牌组
                const cards = move.cards;
                cards.forEach(card => {
                    const index = player.hand.findIndex(c => c.id === card.id);
                    if (index !== -1) {
                        player.hand.splice(index, 1);
                    }
                });
                gameState.table.push({ cards: cards, isNew: true });
                if (move.type === 'iceBreak') {
                    player.iceBroken = true;
                }
                renderHand();
                renderTable();
            } else if (move.type === 'addToGroup') {
                // 添加到现有牌组
                const card = move.card;
                const groupIndex = move.groupIndex;
                const index = player.hand.findIndex(c => c.id === card.id);
                if (index !== -1) {
                    player.hand.splice(index, 1);
                    gameState.table[groupIndex].cards.push(card);
                }
                renderHand();
                renderTable();
            }
        }
// 启用重组模式
        function enableReorganizeMode() {
            const player = gameState.players[gameState.currentIndex];
            if (player.isAI || gameState.isAIThinking) return;
            
            if (!player.iceBroken) {
                showHint('破冰阶段不能重组牌组', 'error');
                return;
            }
            
            gameState.isReorganizeMode = true;
            gameState.selectedTableCards = [];
            gameState.selectedTableGroups = [];
            
            showHint('重组模式已启用！点击卡牌选择要重组的卡牌，然后点击确认按钮', 'info');
            renderTable();
            updateButtonStates();
            
            // 显示重组操作按钮
            const controlBar = document.querySelector('.control-bar');
            const reorganizeControls = document.createElement('div');
            reorganizeControls.className = 'reorganize-controls';
            reorganizeControls.innerHTML = `
                <button class="control-btn confirm" onclick="mergeSelectedCards()">✓ 确认重组</button>
                <button class="control-btn cancel" onclick="exitReorganizeMode()">✗ 取消</button>
            `;
            controlBar.appendChild(reorganizeControls);
        }

        // 退出重组模式
        function exitReorganizeMode() {
            gameState.isReorganizeMode = false;
            gameState.selectedTableCards = [];
            gameState.selectedTableGroups = [];
            
            showHint('重组模式已退出', 'info');
            renderTable();
            updateButtonStates();
            
            // 移除重组操作按钮
            const reorganizeControls = document.querySelector('.reorganize-controls');
            if (reorganizeControls) {
                reorganizeControls.remove();
            }
        }

        // 选择桌面卡牌进行重组
        function selectTableCard(card, groupIndex) {
            if (!gameState.isReorganizeMode) return;
            
            const cardIndex = gameState.selectedTableCards.findIndex(c => c.id === card.id);
            if (cardIndex !== -1) {
                // 取消选择
                gameState.selectedTableCards.splice(cardIndex, 1);
            } else {
                // 添加选择
                gameState.selectedTableCards.push(card);
            }
            
            renderTable();
        }

        // 合并选中的卡牌形成新牌组
        function mergeSelectedCards() {
            if (gameState.selectedTableCards.length < 3) {
                showHint('至少需要选择3张卡牌才能组成新牌组', 'error');
                return;
            }
            
            if (!isValidGroup(gameState.selectedTableCards)) {
                showHint('选中的卡牌无法组成有效牌组', 'error');
                return;
            }
            
            saveSnapshot();
            
            // 从原牌组中移除选中的卡牌
            gameState.selectedTableCards.forEach(card => {
                for (let i = 0; i < gameState.table.length; i++) {
                    const group = gameState.table[i];
                    const cardIndex = group.cards.findIndex(c => c.id === card.id);
                    if (cardIndex !== -1) {
                        group.cards.splice(cardIndex, 1);
                        break;
                    }
                }
            });
            
            // 移除空的牌组
            gameState.table = gameState.table.filter(group => group.cards.length > 0);
            
            // 创建新牌组
            gameState.table.push({ cards: [...gameState.selectedTableCards], isNew: false });
            
            // 清空选择
            gameState.selectedTableCards = [];
            
            // 退出重组模式
            exitReorganizeMode();
            
            showHint('卡牌重组成功！', 'success');
            renderTable();
            updateButtonStates();
        }

        // 拆分牌组
        function splitGroup(groupIndex) {
            if (!gameState.isReorganizeMode) return;
            
            const group = gameState.table[groupIndex];
            if (!group || group.cards.length <= 3) {
                showHint('该牌组无法拆分', 'error');
                return;
            }
            
            saveSnapshot();
            
            // 简单拆分：将牌组分成两部分
            const midPoint = Math.floor(group.cards.length / 2);
            const firstPart = group.cards.slice(0, midPoint);
            const secondPart = group.cards.slice(midPoint);
            
            // 检查拆分后的两部分是否都有效
            if (firstPart.length >= 3 && isValidGroup(firstPart) && 
                secondPart.length >= 3 && isValidGroup(secondPart)) {
                // 移除原牌组
                gameState.table.splice(groupIndex, 1);
                
                // 添加拆分后的牌组
                gameState.table.push({ cards: firstPart, isNew: false });
                gameState.table.push({ cards: secondPart, isNew: false });
                
                showHint('牌组拆分成功！', 'success');
            } else {
                showHint('无法拆分该牌组，拆分后的部分不满足规则', 'error');
                return;
            }
            
            renderTable();
            updateButtonStates();
        }

        // 添加手牌到桌面牌组
        function addHandCardToTableGroup(handCard, tableGroupIndex) {
            const player = gameState.players[gameState.currentIndex];
            if (player.isAI || gameState.isAIThinking) return;
            
            if (!player.iceBroken) {
                showHint('请先破冰（首次出牌需≥30点）', 'error');
                return;
            }
            
            const targetGroup = gameState.table[tableGroupIndex];
            if (!targetGroup) return;
            
            // 尝试添加到目标牌组
            const newGroup = [...targetGroup.cards, handCard];
            if (isValidGroup(newGroup)) {
                saveSnapshot();
                
                // 从手牌移除
                const cardIndex = player.hand.findIndex(c => c.id === handCard.id);
                if (cardIndex !== -1) {
                    player.hand.splice(cardIndex, 1);
                }
                
                // 添加到桌面牌组
                targetGroup.cards.push(handCard);
                
                // 排序牌组
                sortGroupCards(targetGroup.cards);
                
                showHint('卡牌添加成功！', 'success');
                renderHand();
                renderTable();
            } else {
                showHint('无法添加到该牌组', 'error');
            }
        }

    </script>
