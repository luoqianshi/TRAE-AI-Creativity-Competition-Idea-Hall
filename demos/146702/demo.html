<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时光织卷 - 交互Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            color: #f4ecd8;
            font-family: 'SimSun', 'STSong', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            max-width: 900px;
            width: 100%;
            background: #f4ecd8;
            border-radius: 10px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .header {
            background: #004d99;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .era-info {
            background: #fffcf0;
            padding: 20px;
            border-bottom: 2px solid #004d99;
        }

        .era-info h2 {
            color: #d32f2f;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .era-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .era-details p {
            color: #2c2c2c;
            line-height: 1.6;
        }

        .warning-box {
            background: rgba(211, 47, 47, 0.1);
            border-left: 4px solid #d32f2f;
            padding: 15px;
            margin-top: 15px;
            font-style: italic;
            color: #d32f2f;
        }

        .narrative {
            background: #fffcf0;
            padding: 30px;
            min-height: 300px;
        }

        .narrative h3 {
            color: #004d99;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        #story-text {
            line-height: 1.8;
            font-size: 1.1rem;
            color: #2c2c2c;
            white-space: pre-wrap;
        }

        .story-section {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0, 77, 153, 0.05);
            border-radius: 5px;
        }

        .story-section strong {
            color: #004d99;
            display: block;
            margin-bottom: 8px;
        }

        .actions {
            background: #fffcf0;
            padding: 20px;
            border-top: 2px solid #004d99;
        }

        .actions h3 {
            color: #004d99;
            margin-bottom: 15px;
        }

        .choice-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 15px 20px;
            margin-bottom: 10px;
            background: white;
            border: 2px solid #004d99;
            color: #2c2c2c;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .choice-btn:hover {
            background: #004d99;
            color: white;
            transform: translateX(10px);
        }

        .choice-btn.highlight {
            border-color: #d32f2f;
            color: #d32f2f;
        }

        .choice-btn.highlight:hover {
            background: #d32f2f;
            color: white;
        }

        .input-area {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px;
            border: 2px solid #004d99;
            background: white;
            color: #2c2c2c;
            font-size: 1rem;
            font-family: inherit;
        }

        .input-area button {
            padding: 12px 30px;
            background: #004d99;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
        }

        .input-area button:hover {
            background: #ffd700;
            color: #2c2c2c;
        }

        .status-bar {
            background: #2c2c2c;
            color: #00ff41;
            padding: 15px;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        /* 弹窗样式 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .overlay.active {
            display: flex;
        }

        .overlay-content {
            background: #f4ecd8;
            padding: 40px;
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
            text-align: center;
        }

        .overlay-content h2 {
            color: #d32f2f;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .overlay-content p {
            color: #2c2c2c;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .cross-generation {
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid #ffd700;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
        }

        .cross-generation p {
            color: #d32f2f;
            font-style: italic;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .overlay-content button {
            padding: 12px 30px;
            margin: 10px;
            background: #004d99;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
        }

        .overlay-content button:hover {
            background: #ffd700;
            color: #2c2c2c;
        }

        .report-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            margin: 20px 0;
            text-align: left;
        }

        .report-card h3 {
            color: #d32f2f;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .report-card p {
            line-height: 1.8;
            margin-bottom: 20px;
            color: #2c2c2c;
        }

        .report-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .report-tags span {
            background: #ffd700;
            color: #2c2c2c;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #004d99;
            font-style: italic;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>时光织卷 TimeWeave</h1>
            <p>时代平行宇宙引擎 - 交互Demo</p>
        </div>

        <div class="era-info">
            <h2>📋 秘密档案</h2>
            <div class="era-details">
                <p><strong>当前年份：</strong><span id="current-year">1995年</span></p>
                <p><strong>地点：</strong><span id="current-loc">东北某国企</span></p>
                <p><strong>身份：</strong><span id="era-identity">25岁的车间工人</span></p>
                <p><strong>政策：</strong><span id="era-policy">国企改革深化中</span></p>
                <p><strong>约束：</strong><span id="era-constraint">禁止未申报的跨省人口流动</span></p>
            </div>
            <div class="warning-box">
                <p>"别用你那2024年的大脑试图挑战1995年的介绍信。" —— DM</p>
            </div>
        </div>

        <div class="narrative">
            <h3>📖 时代叙事</h3>
            <div id="story-text">
                <div class="loading">正在生成时代背景</div>
            </div>
        </div>

        <div class="actions">
            <h3>🎮 你的选择</h3>
            <div id="choices-container">
                <button class="choice-btn" data-choice="1">1. 坚守国企，等待分配</button>
                <button class="choice-btn" data-choice="2">2. 拿安置费，去南方闯荡</button>
                <button class="choice-btn highlight" data-choice="future">3. 辞职开发"短视频"APP (现代思维)</button>
            </div>
            <div class="input-area">
                <input type="text" id="custom-input" placeholder="输入自定义行动...">
                <button id="submit-custom">提交</button>
            </div>
        </div>

        <div class="status-bar">
            连接状态：<span id="api-status">DeepSeek-API (已配置)</span>
        </div>
    </div>

    <!-- 剧情杀弹窗 -->
    <div class="overlay" id="crash-overlay">
        <div class="overlay-content">
            <h2>⚠️ 时代冲突警告</h2>
            <p id="death-reason"></p>
            <div class="cross-generation">
                <p>"你通关失败的时代死局，你长辈当年靠双脚硬生生走通了，才有了今天的你。"</p>
            </div>
            <button id="btn-restart">重新载入灵魂</button>
            <button id="btn-report">生成小红书战报</button>
        </div>
    </div>

    <!-- 战报弹窗 -->
    <div class="overlay" id="report-overlay">
        <div class="overlay-content">
            <h2>📱 小红书战报</h2>
            <div class="report-card">
                <h3 id="report-title"></h3>
                <p id="report-text"></p>
                <div class="report-tags">
                    <span>#时光织卷</span>
                    <span>#魂穿90年代</span>
                    <span>#时代约束</span>
                </div>
            </div>
            <button id="btn-copy">复制文案</button>
            <button id="btn-close-report">关闭</button>
        </div>
    </div>

    <script>
        // 配置
        const CONFIG = {
            API: {
                baseURL: 'https://api.deepseek.com/v1',
                apiKey: 'sk-83a8b7ce3b5d4ece89d9713578e2733f',
                model: 'deepseek-chat',
                temperature: 0.8,
                maxTokens: 1000
            },
            GAME: {
                defaultEra: {
                    year: 1995,
                    location: '东北某国企',
                    identity: '25岁的车间工人',
                    policy: '国企改革深化中',
                    constraint: '禁止未申报的跨省人口流动'
                }
            }
        };

        // 时代知识库
        const ERA_KNOWLEDGE = {
            redLines: {
                advancedInvestment: {
                    keywords: ['炒股', '买股票', '投资', '买房', '购房', '房地产'],
                    trigger: '超前投资',
                    response: '你的现代金融知识在这个时代毫无用武之地。没有证券交易所，没有网上银行，甚至连股票认购证都需要排队购买。',
                    result: '你的投资计划胎死腹中'
                },
                advancedStartup: {
                    keywords: ['互联网', '创业', '开公司', '搞网络', '电商', 'APP', '短视频'],
                    trigger: '超前创业',
                    response: '你的互联网创业计划在这个时代简直是天方夜谭。没有光纤，没有宽带，连拨号上网都是奢侈品。',
                    result: '你的创业梦想破灭'
                },
                advancedTechnology: {
                    keywords: ['手机', '电脑', '上网', '微信', '支付宝', '智能手机', '比特币'],
                    trigger: '超前技术',
                    response: '你试图使用超越时代的技术，但这个时代还没有这些发明。BP机和大哥大已经是最高科技了。',
                    result: '你的技术优势荡然无存'
                }
            },

            checkConstraint: function(action) {
                for (const [key, constraint] of Object.entries(this.redLines)) {
                    for (const keyword of constraint.keywords) {
                        if (action.includes(keyword)) {
                            return {
                                triggered: true,
                                constraint: constraint
                            };
                        }
                    }
                }
                return { triggered: false };
            }
        };

        // 游戏状态
        let gameState = {
            currentEra: { ...CONFIG.GAME.defaultEra },
            failureCount: 0,
            gameHistory: [],
            isGameOver: false
        };

        // DOM元素
        const storyText = document.getElementById('story-text');
        const choicesContainer = document.getElementById('choices-container');
        const customInput = document.getElementById('custom-input');
        const submitCustom = document.getElementById('submit-custom');
        const crashOverlay = document.getElementById('crash-overlay');
        const deathReason = document.getElementById('death-reason');
        const reportOverlay = document.getElementById('report-overlay');
        const reportTitle = document.getElementById('report-title');
        const reportText = document.getElementById('report-text');

        // 调用DeepSeek API
        async function callDeepSeekAPI(userMessage) {
            const systemPrompt = `你是一位严谨、毒舌、带有黑色幽默的90年代社会学教授，同时也是一位游戏主持人(DM)。

【你的职责】
1. 扮演一位穿越到${gameState.currentEra.year}年代的中国年轻人的"命运引导者"
2. 基于真实历史政策，对玩家的选择进行合理反馈
3. 用黑色幽默的方式"物理超度"那些试图用现代思维降维打击的玩家
4. 最终引导玩家理解：长辈当年的"保守"不是愚蠢，而是时代的重量

【当前时代背景】
年份：${gameState.currentEra.year}年
地点：${gameState.currentEra.location}
身份：${gameState.currentEra.identity}
政策：${gameState.currentEra.policy}
约束：${gameState.currentEra.constraint}

【输出格式】
每次回复必须包含：
1. 【时代背景】：当前年份、地点、社会环境
2. 【剧情发展】：基于玩家选择的剧情推进（200-300字）
3. 【时代反馈】：如果违反时代约束，给出硬核反馈（100-150字）
4. 【选择提示】：提供2-3个符合时代的选项

记住：你的目标不是让玩家轻松通关，而是让他们真切感受到那个时代的重量。`;

            try {
                const response = await fetch(`${CONFIG.API.baseURL}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${CONFIG.API.apiKey}`
                    },
                    body: JSON.stringify({
                        model: CONFIG.API.model,
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: userMessage }
                        ],
                        temperature: CONFIG.API.temperature,
                        max_tokens: CONFIG.API.maxTokens
                    })
                });

                if (!response.ok) {
                    throw new Error(`API请求失败: ${response.status}`);
                }

                const data = await response.json();
                return data.choices[0].message.content;
            } catch (error) {
                console.error('API调用错误:', error);
                return getMockResponse(userMessage);
            }
        }

        // 模拟响应（API失败时的fallback）
        function getMockResponse(userMessage) {
            const constraints = ERA_KNOWLEDGE.checkConstraint(userMessage);

            if (constraints.triggered) {
                return `【时代背景】${gameState.currentEra.year}年，${gameState.currentEra.location}

【剧情发展】
你试图${userMessage}，但现实给了你当头一棒。${constraints.constraint.response}

【时代反馈】
${constraints.constraint.result}。这就是时代的重量，不是你能用现代思维就能轻易改变的。

【选择提示】
1. 老老实实按照当时的规则办事
2. 寻找符合时代背景的机会
3. 重新思考你的策略`;
            }

            return `【时代背景】${gameState.currentEra.year}年，${gameState.currentEra.location}

【剧情发展】
你选择了${userMessage}。在这个年代，这个选择需要勇气和决心。周围的同事都在观望，而你却迈出了这一步。

【时代反馈】
你的选择符合当时的社会环境，但未来的路还很长。每一步都需要谨慎，因为那个年代容错率很低。

【选择提示】
1. 继续前进，承担风险
2. 稳扎稳打，步步为营
3. 寻求他人的帮助和建议`;
        }

        // 解析选项
        function parseChoices(response) {
            const choices = [];
            const choiceRegex = /(\d+)\.\s*([^\n]+)/g;
            let match;

            while ((match = choiceRegex.exec(response)) !== null) {
                choices.push({
                    id: match[1],
                    text: match[2].trim()
                });
            }

            if (choices.length === 0) {
                choices.push(
                    { id: '1', text: '继续前进' },
                    { id: '2', text: '谨慎观察' },
                    { id: '3', text: '寻求帮助' }
                );
            }

            return choices;
        }

        // 渲染故事
        function renderStory(text) {
            storyText.innerHTML = '';
            const sections = text.split('\n\n');

            sections.forEach(section => {
                if (section.trim()) {
                    const div = document.createElement('div');
                    div.className = 'story-section';

                    const lines = section.split('\n');
                    lines.forEach(line => {
                        if (line.startsWith('【')) {
                            const strong = document.createElement('strong');
                            strong.textContent = line;
                            div.appendChild(strong);
                        } else if (line.trim()) {
                            const p = document.createElement('p');
                            p.textContent = line;
                            div.appendChild(p);
                        }
                    });

                    storyText.appendChild(div);
                }
            });
        }

        // 渲染选项
        function renderChoices(choices) {
            choicesContainer.innerHTML = '';

            choices.forEach((choice, index) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                if (index === choices.length - 1) {
                    btn.classList.add('highlight');
                }
                btn.textContent = `${index + 1}. ${choice.text}`;
                btn.addEventListener('click', () => handleChoice(choice.text));
                choicesContainer.appendChild(btn);
            });
        }

        // 处理选择
        async function handleChoice(choice) {
            if (gameState.isGameOver) {
                alert('游戏已结束，请重新开始');
                return;
            }

            // 禁用所有按钮
            const buttons = choicesContainer.querySelectorAll('button');
            buttons.forEach(btn => btn.disabled = true);
            customInput.disabled = true;
            submitCustom.disabled = true;

            // 显示加载状态
            storyText.innerHTML = '<div class="loading">时代引擎正在运转</div>';

            // 记录历史
            gameState.gameHistory.push({
                era: gameState.currentEra.year,
                choice: choice,
                timestamp: Date.now()
            });

            // 检查约束
            const constraintCheck = ERA_KNOWLEDGE.checkConstraint(choice);

            let response;
            if (constraintCheck.triggered) {
                response = getMockResponse(choice);
                gameState.failureCount++;

                if (gameState.failureCount >= 3) {
                    gameState.isGameOver = true;
                }
            } else {
                response = await callDeepSeekAPI(choice);
            }

            // 渲染结果
            renderStory(response);
            const newChoices = parseChoices(response);
            renderChoices(newChoices);

            // 如果触发约束，显示剧情杀弹窗
            if (constraintCheck.triggered) {
                setTimeout(() => {
                    showCrashOverlay(response);
                }, 1000);
            }

            // 重新启用按钮
            buttons.forEach(btn => btn.disabled = false);
            customInput.disabled = false;
            submitCustom.disabled = false;
        }

        // 显示剧情杀弹窗
        function showCrashOverlay(reason) {
            deathReason.textContent = reason;
            crashOverlay.classList.add('active');
        }

        // 显示战报
        function showReport() {
            const title = `《家人们谁懂啊！带着现代思维回${gameState.currentEra.year}年，结果被时代狠狠教育！》`;
            const content = `家人们谁懂啊！带着现代思维回${gameState.currentEra.year}年，结果被时代狠狠教育！本想当人生赢家，结果屡屡碰壁……穿越到${gameState.currentEra.year}年的第${gameState.gameHistory.length}天，我裂开了！`;

            reportTitle.textContent = title;
            reportText.textContent = content;
            reportOverlay.classList.add('active');
        }

        // 复制战报
        function copyReport() {
            const title = reportTitle.textContent;
            const content = reportText.textContent;
            const tags = '#时光织卷 #魂穿90年代 #时代约束';
            const text = `${title}\n\n${content}\n\n${tags}`;

            navigator.clipboard.writeText(text).then(() => {
                alert('战报已复制到剪贴板！');
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('战报已复制到剪贴板！');
            });
        }

        // 重新开始
        function restartGame() {
            gameState = {
                currentEra: { ...CONFIG.GAME.defaultEra },
                failureCount: 0,
                gameHistory: [],
                isGameOver: false
            };

            crashOverlay.classList.remove('active');
            reportOverlay.classList.remove('active');

            // 重新加载初始故事
            initGame();
        }

        // 初始化游戏
        async function initGame() {
            storyText.innerHTML = '<div class="loading">正在生成时代背景</div>';

            const initialPrompt = `游戏开始。玩家刚刚穿越到${gameState.currentEra.year}年的${gameState.currentEra.location}，身份是${gameState.currentEra.identity}。请描述初始场景和背景，给玩家提供2-3个初始选择。`;

            const response = await callDeepSeekAPI(initialPrompt);
            renderStory(response);

            const choices = parseChoices(response);
            renderChoices(choices);
        }

        // 事件监听
        submitCustom.addEventListener('click', () => {
            const val = customInput.value.trim();
            if (val) {
                handleChoice(val);
                customInput.value = '';
            }
        });

        customInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const val = customInput.value.trim();
                if (val) {
                    handleChoice(val);
                    customInput.value = '';
                }
            }
        });

        document.getElementById('btn-restart').addEventListener('click', restartGame);
        document.getElementById('btn-report').addEventListener('click', () => {
            crashOverlay.classList.remove('active');
            showReport();
        });
        document.getElementById('btn-copy').addEventListener('click', copyReport);
        document.getElementById('btn-close-report').addEventListener('click', () => {
            reportOverlay.classList.remove('active');
        });

        // 启动游戏
        initGame();
    </script>
</body>
</html>
