<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Header -->
<header class="header">
  <h1>🎵 <span>视唱练耳</span>训练工具</h1>
  <p>标准音高 · 听音盲盒 · 简谱视唱 · 五线谱视唱</p>
</header>

<!-- Navigation -->
<nav class="nav-tabs">
  <button class="nav-tab active" onclick="switchTab('standard')">
    <span class="icon">🎼</span> 标准音高
  </button>
  <button class="nav-tab" onclick="switchTab('blindbox')">
    <span class="icon">🎁</span> 听音盲盒
  </button>
  <button class="nav-tab" onclick="switchTab('notation')">
    <span class="icon">📝</span> 简谱视唱
  </button>
  <button class="nav-tab" onclick="switchTab('staff')">
    <span class="icon">🎼</span> 五线谱视唱
  </button>
</nav>

<!-- Main Content -->
<main class="main">

  <!-- ===== SECTION 1: 标准音高 ===== -->
  <div id="section-standard" class="section active">
    <div class="card">
      <div class="card-title"><span class="dot"></span> 标准音高播放器</div>
      <div class="pitch-display">
        <div class="pitch-note" id="pitchNote">A4</div>
        <div class="pitch-freq" id="pitchFreq">440 Hz</div>
        <div class="pitch-wave">
          <canvas id="waveCanvas"></canvas>
        </div>
        <div class="pitch-controls">
          <button class="btn btn-primary btn-lg" id="playPitchBtn" onclick="toggleStandardPitch()">
            ▶ 播放标准音
          </button>
          <button class="btn btn-secondary" onclick="playNote(69, 1)">播放 A4 (1秒)</button>
          <button class="btn btn-secondary" onclick="playNote(69, 2)">播放 A4 (2秒)</button>
        </div>
        <div class="playing-indicator" id="playingIndicator">
          <span class="waveform-bar"></span>
          <span class="waveform-bar"></span>
          <span class="waveform-bar"></span>
          <span class="waveform-bar"></span>
          <span class="waveform-bar"></span>
          <span class="waveform-bar"></span>
          <span class="waveform-bar"></span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="dot"></span> 音高参考表</div>
      <div class="setting-row">
        <div>
          <div class="setting-label">选择八度</div>
          <div class="setting-desc">点击音符可试听</div>
        </div>
        <select id="refOctave" onchange="updateRefTable()">
          <option value="3">第3八度 (C3-B3)</option>
          <option value="4" selected>第4八度 (C4-B4)</option>
          <option value="5">第5八度 (C5-B5)</option>
        </select>
      </div>
      <div id="refTable" style="display:grid;grid-template-columns:repeat(7,1fr);gap:0.4rem;margin-top:1rem;"></div>
    </div>

    <div class="card">
      <div class="card-title"><span class="dot"></span> 虚拟钢琴</div>
      <div class="piano-container">
        <div class="piano" id="piano"></div>
      </div>
      <div style="text-align:center;margin-top:0.8rem;">
        <span style="font-size:0.8rem;color:var(--muted);">点击琴键或使用键盘快捷键 (A-L 白键, W-U 黑键)</span>
      </div>
    </div>
  </div>

  <!-- ===== SECTION 2: 听音盲盒 ===== -->
  <div id="section-blindbox" class="section">
    <div class="card">
      <div class="card-title"><span class="dot"></span> 听音盲盒</div>

      <div class="setting-row">
        <div>
          <div class="setting-label">难度设置</div>
        </div>
        <select id="bbDifficulty">
          <option value="easy">简单 (白键音)</option>
          <option value="medium" selected>中等 (含黑键)</option>

<script>
// ============================================================
// AUDIO ENGINE
// ============================================================
let audioCtx = null;
let activeOscillators = [];
let standardPitchOsc = null;
let standardPitchPlaying = false;
let waveAnimFrame = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function playNote(midiNote, duration, timbre, volume) {
  timbre = timbre || 'triangle';
  volume = volume || 0.3;
  const ctx = getAudioCtx();
  const freq = midiToFreq(midiNote);

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = timbre;
  osc.frequency.setValueAtTime(freq, ctx.currentTime);

  // ADSR envelope
  const attack = 0.02;
  const decay = 0.1;
  const sustain = volume * 0.7;
  const release = Math.min(0.3, duration * 0.3);

  gain.gain.setValueAtTime(0, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(volume, ctx.currentTime + attack);
  gain.gain.linearRampToValueAtTime(sustain, ctx.currentTime + attack + decay);
  gain.gain.setValueAtTime(sustain, ctx.currentTime + duration - release);
  gain.gain.linearRampToValueAtTime(0, ctx.currentTime + duration);

  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + duration + 0.05);

  return osc;
}

function playChord(midiNotes, duration, timbre) {
  midiNotes.forEach(function(n) { playNote(n, duration, timbre, 0.2); });
}

// ============================================================
// WAVEFORM VISUALIZATION
// ============================================================
function initWaveCanvas() {
  const canvas = document.getElementById('waveCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * 2;
  canvas.height = canvas.offsetHeight * 2;
  ctx.scale(2, 2);
  drawStaticWave(ctx, canvas);
}

function drawStaticWave(ctx, canvas) {
  const w = canvas.offsetWidth;
  const h = canvas.offsetHeight;
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(108,140,255,0.2)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let x = 0; x < w; x++) {
    const y = h / 2 + Math.sin(x * 0.05) * 10;
    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function drawAnimatedWave() {
  const canvas = document.getElementById('waveCanvas');
  const ctx = canvas.getContext('2d');
  const w = canvas.offsetWidth;
  const h = canvas.offsetHeight;
  let phase = 0;

  function draw() {
    ctx.clearRect(0, 0, w * 2, h * 2);
    ctx.save();
    ctx.scale(2, 2);

    // Main wave
    ctx.strokeStyle = 'rgba(108,140,255,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = 0; x < w; x++) {
      const y = h / 2 + Math.sin(x * 0.04 + phase) * 25 * Math.sin(phase * 0.3);
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Secondary wave
    ctx.strokeStyle = 'rgba(255,107,157,0.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let x = 0; x < w; x++) {
      const y = h / 2 + Math.sin(x * 0.06 + phase * 1.3) * 15 * Math.sin(phase * 0.2);
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();

    ctx.restore();
    phase += 0.15;
    waveAnimFrame = requestAnimationFrame(draw);
  }
  draw();
}

function stopWaveAnim() {
  if (waveAnimFrame) cancelAnimationFrame(waveAnimFrame);
  waveAnimFrame = null;
  initWaveCanvas();
}

// ============================================================
// TAB SWITCHING
// ============================================================
function switchTab(tabName) {
  document.querySelectorAll('.section').forEach(function(s) { s.classList.remove('active'); });
  document.querySelectorAll('.nav-tab').forEach(function(t) { t.classList.remove('active'); });
  document.getElementById('section-' + tabName).classList.add('active');
  event.currentTarget.classList.add('active');

  if (tabName === 'standard') initWaveCanvas();
  if (tabName === 'notation' && !currentNotation.length) generateNotation();
  if (tabName === 'staff') generateStaffNotation();
}

// ============================================================
// STANDARD PITCH
// ============================================================
function toggleStandardPitch() {
  const btn = document.getElementById('playPitchBtn');
  const indicator = document.getElementById('playingIndicator');

  if (standardPitchPlaying) {
    standardPitchPlaying = false;
    btn.innerHTML = '▶ 播放标准音';
    indicator.classList.remove('active');
    stopWaveAnim();
    return;
  }

  standardPitchPlaying = true;
  btn.innerHTML = '⏹ 停止播放';
  indicator.classList.add('active');
  drawAnimatedWave();

  function loop() {
    if (!standardPitchPlaying) return;
    standardPitchOsc = playNote(69, 1.5, 'sine', 0.25);
    setTimeout(function() {
      if (standardPitchPlaying) loop();
    }, 1500);
  }
  loop();
}

// ============================================================
// REFERENCE TABLE
// ============================================================
const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const SOLFEGE = ['Do', 'Do#', 'Re', 'Re#', 'Mi', 'Fa', 'Fa#', 'Sol', 'Sol#', 'La', 'La#', 'Si'];

function updateRefTable() {
  const octave = parseInt(document.getElementById('refOctave').value);
  const container = document.getElementById('refTable');
  container.innerHTML = '';

  for (let i = 0; i < 12; i++) {
    const midi = (octave + 1) * 12 + i;
    const name = NOTE_NAMES[i];
    const sol = SOLFEGE[i];
    const freq = Math.round(midiToFreq(midi));
    const isBlack = name.includes('#');

    const btn = document.createElement('button');
    btn.className = 'btn btn-sm ' + (isBlack ? 'btn-secondary' : 'btn-primary');
    btn.style.opacity = isBlack ? '0.7' : '1';
    btn.style.fontSize = '0.8rem';
    btn.style.padding = '0.5rem';
    btn.style.minWidth = '60px';
    btn.innerHTML = name + octave + '<br><span style="font-size:0.7rem;opacity:0.7">' + freq + 'Hz</span>';
    btn.onclick = (function(m) { return function() { playNote(m, 0.8); }; })(midi);
    container.appendChild(btn);
  }
}

// ============================================================
// PIANO KEYBOARD
// ============================================================
const KEY_MAP = {
  'a': 60, 'w': 61, 's': 62, 'e': 63, 'd': 64,
  'f': 65, 't': 66, 'g': 67, 'y': 68, 'h': 69,
  'u': 70, 'j': 71, 'k': 72, 'o': 73, 'l': 74
};

function buildPiano() {
  const piano = document.getElementById('piano');
  const whiteNotes = [0, 2, 4, 5, 7, 9, 11]; // C D E F G A B
  const blackNotes = [1, 3, 6, 8, 10]; // C# D# F# G# A#
  const blackPositions = [0.7, 1.7, 3.7, 4.7, 5.7]; // relative to white key index

  // Build 2 octaves
  for (let oct = 0; oct < 2; oct++) {
    const offset = oct * 7;
    whiteNotes.forEach(function(note, i) {
      const midi = 60 + oct * 12 + note;
      const key = document.createElement('div');
      key.className = 'white-key';
      key.style.left = ((offset + i) * 44 + 4) + 'px';
      key.dataset.midi = midi;
      key.innerHTML = '<span class="key-label">' + NOTE_NAMES[note] + (oct + 4) + '</span>';
      key.onmousedown = (function(m) { return function() { pianoKeyDown(m, this); }; })(midi);
      key.onmouseup = (function() { return function() { pianoKeyUp(this); }; })();
      key.onmouseleave = (function() { return function() { pianoKeyUp(this); }; })();
      piano.appendChild(key);
    });

    blackNotes.forEach(function(note, i) {
      const midi = 60 + oct * 12 + note;
      const key = document.createElement('div');
      key.className = 'black-key';
      key.style.left = ((offset + blackPositions[i]) * 44 + 4 + 28) + 'px';
      key.dataset.midi = midi;
      key.innerHTML = '<span class="key-label">' + NOTE_NAMES[note] + (oct + 4) + '</span>';
      key.onmousedown = (function(m) { return function() { pianoKeyDown(m, this); }; })(midi);
      key.onmouseup = (function() { return function() { pianoKeyUp(this); }; })();
      key.onmouseleave = (function() { return function() { pianoKeyUp(this); }; })();
      piano.appendChild(key);
    });
  }
}

let pianoOsc = null;
function pianoKeyDown(midi, el) {
  el.classList.add('pressed');
  pianoOsc = playNote(midi, 2, 'triangle', 0.25);
}
function pianoKeyUp(el) {
  el.classList.remove('pressed');
}

document.addEventListener('keydown', function(e) {
  if (e.repeat) return;
  const midi = KEY_MAP[e.key.toLowerCase()];
  if (midi) {
    const key = document.querySelector('.piano [data-midi="' + midi + '"]');
    if (key) pianoKeyDown(midi, key);
  }
});
document.addEventListener('keyup', function(e) {
  const midi = KEY_MAP[e.key.toLowerCase()];
  if (midi) {
    const key = document.querySelector('.piano [data-midi="' + midi + '"]');
    if (key) pianoKeyUp(key);
  }
});

// ============================================================
// BLIND BOX (听音盲盒)
// ============================================================
let bbCurrentNote = null;
let bbAnswered = false;
let bbCorrect = 0;
let bbWrong = 0;
let bbStreak = 0;

function getBlindBoxNotes() {
  const diff = document.getElementById('bbDifficulty').value;
  if (diff === 'easy') {
    // White keys only in octave 4
    return [60, 62, 64, 65, 67, 69, 71]; // C4 D4 E4 F4 G4 A4 B4
  } else if (diff === 'medium') {
    // All notes in octave 4
    return [60, 61, 62, 63, 64, 65, 66, 67, 68, 69, 70, 71];
  } else {
    // Three octaves
    var notes = [];
    for (var i = 48; i <= 83; i++) notes.push(i);
    return notes;
  }
}

function playBlindBox() {
  const notes = getBlindBoxNotes();
  const idx = Math.floor(Math.random() * notes.length);
  bbCurrentNote = notes[idx];
  bbAnswered = false;

  const timbre = document.getElementById('bbTimbre').value;
  const duration = parseFloat(document.getElementById('bbDuration').value);

  const card = document.getElementById('mysteryCard');
  card.className = 'mystery-card playing';
  card.innerHTML = '<span class="question-mark" style="font-size:5rem;color:var(--accent)">♪</span>';

  playNote(bbCurrentNote, duration, timbre, 0.3);

  setTimeout(function() {
    card.className = 'mystery-card';
    card.innerHTML = '<span class="question-mark">?</span>';
  }, duration * 1000);

  document.getElementById('bbReplayBtn').disabled = false;

  // Generate answer options
  generateAnswerOptions();
}

function replayBlindBox() {
  if (bbCurrentNote === null) return;
  const timbre = document.getElementById('bbTimbre').value;
  const duration = parseFloat(document.getElementById('bbDuration').value);

  const card = document.getElementById('mysteryCard');
  card.className = 'mystery-card playing';
  card.innerHTML = '<span class="question-mark" style="font-size:5rem;color:var(--accent)">♪</span>';

  playNote(bbCurrentNote, duration, timbre, 0.3);

  setTimeout(function() {
    card.className = 'mystery-card';
    card.innerHTML = '<span class="question-mark">?</span>';
  }, duration * 1000);
}

function generateAnswerOptions() {
  const container = document.getElementById('answerOptions');
  container.innerHTML = '';
  const notes = getBlindBoxNotes();

  // Pick 3 random wrong answers
  var options = [bbCurrentNote];
  while (options.length < 8) {
    var n = notes[Math.floor(Math.random() * notes.length)];
    if (options.indexOf(n) === -1) options.push(n);
  }
  // Shuffle
  options.sort(function() { return Math.random() - 0.5; });

  options.forEach(function(midi) {
    var btn = document.createElement('button');
    btn.className = 'answer-btn';
    var noteName = NOTE_NAMES[midi % 12];
    var octave = Math.floor(midi / 12) - 1;
    btn.textContent = noteName + octave;
    btn.onclick = (function(m) { return function() { checkAnswer(m, this); }; })(midi);
    container.appendChild(btn);
  });
}

function checkAnswer(midi, btn) {
  if (bbAnswered) return;
  bbAnswered = true;

  const card = document.getElementById('mysteryCard');
  const correctName = NOTE_NAMES[bbCurrentNote % 12] + (Math.floor(bbCurrentNote / 12) - 1);

  if (midi === bbCurrentNote) {
    btn.classList.add('correct');
    card.className = 'mystery-card revealed';
    card.innerHTML = '<span class="answer-note">✓</span>';
    bbCorrect++;
    bbStreak++;
    showToast('正确! ' + correctName, 'success');
  } else {
    btn.classList.add('wrong');
    // Highlight correct answer
    var btns = document.querySelectorAll('.answer-btn');
    btns.forEach(function(b) {
      var noteName = NOTE_NAMES[bbCurrentNote % 12];
      var octave = Math.floor(bbCurrentNote / 12) - 1;
      if (b.textContent === noteName + octave) b.classList.add('correct');
    });
    card.className = 'mystery-card';
    card.innerHTML = '<span class="answer-note" style="color:var(--error)">✗</span>';
    bbWrong++;
    bbStreak = 0;
    showToast('错误! 正确答案是 ' + correctName, 'error');
  }

  // Play the correct note for learning
  setTimeout(function() {
    playNote(bbCurrentNote, 1.5, 'triangle', 0.3);
  }, 500);

  document.getElementById('bbCorrect').textContent = bbCorrect;
  document.getElementById('bbWrong').textContent = bbWrong;
  document.getElementById('bbStreak').textContent = bbStreak;
}

function resetBlindBoxScore() {
  bbCorrect = 0;
  bbWrong = 0;
  bbStreak = 0;
  document.getElementById('bbCorrect').textContent = '0';
  document.getElementById('bbWrong').textContent = '0';
  document.getElementById('bbStreak').textContent = '0';
  showToast('分数已重置', 'info');
}

// ============================================================
// NUMBERED NOTATION (简谱视唱)
// ============================================================
let currentNotation = [];
let jnBpm = 80;
let jnPlayingSingle = false;
let jnSingleIndex = 0;

// Key signatures: semitone offset from C
const KEY_OFFSETS = { 'C': 0, 'G': 7, 'D': 2, 'A': 9, 'F': 5, 'bB': 10, 'bE': 3 };
const KEY_BASE_MIDI = { 'C': 60, 'G': 67, 'D': 62, 'A': 69, 'F': 65, 'bB': 70, 'bE': 63 };

function generateNotation() {
  const key = document.getElementById('jnKey').value;
  const meter = document.getElementById('jnMeter').value;
  const bars = parseInt(document.getElementById('jnBars').value);
  const range = document.getElementById('jnRange').value;

  var beatsPerBar = parseInt(meter.split('/')[0]);
  var totalBeats = beatsPerBar * bars;

  // Note range in numbered notation (1-7)
  var minNote, maxNote;
  if (range === 'narrow') { minNote = 1; maxNote = 5; }
  else if (range === 'medium') { minNote = -5; maxNote = 5; }
  else { minNote = -6; maxNote = 6; }

  // Generate melody using stepwise motion with occasional leaps
  var melody = [];
  var current = Math.floor(Math.random() * 3) + 1; // Start around 1-3

  for (var i = 0; i < totalBeats; i++) {
    var step = Math.random();
    var interval;
    if (step < 0.5) {
      interval = Math.random() < 0.5 ? 1 : -1; // Step
    } else if (step < 0.8) {
      interval = Math.random() < 0.5 ? 2 : -2; // Skip
    } else {
      interval = Math.floor(Math.random() * 5) - 2; // Leap
    }

    current = Math.max(minNote, Math.min(maxNote, current + interval));

    // Duration: mostly quarter notes, some half and eighth
    var dur;
    var durRoll = Math.random();
    if (durRoll < 0.6) dur = 1; // quarter
    else if (durRoll < 0.85) dur = 2; // half
    else dur = 0.5; // eighth

    // Adjust for meter
    if (dur > 1 && i + dur > totalBeats) dur = 1;

    melody.push({ note: current, duration: dur });
    if (dur > 1) i += dur - 1; // Skip beats for longer notes
  }

  currentNotation = melody;
  renderNotation();
}

function renderNotation() {
  const key = document.getElementById('jnKey').value;
  const meter = document.getElementById('jnMeter').value;
  const display = document.getElementById('jnDisplay');
  const info = document.getElementById('jnInfo');

  display.innerHTML = '';
  info.innerHTML = '<div class="info-item">调号: <strong>1=' + key + '</strong></div>' +
    '<div class="info-item">拍号: <strong>' + meter + '</strong></div>' +
    '<div class="info-item">速度: <strong>' + jnBpm + ' BPM</strong></div>' +
    '<div class="info-item">音符数: <strong>' + currentNotation.length + '</strong></div>';

  var beatCount = 0;
  var beatsPerBar = parseInt(meter.split('/')[0]);

  currentNotation.forEach(function(item, idx) {
    if (beatCount >= beatsPerBar) {
      beatCount = 0;
      // Bar line
      var barLine = document.createElement('span');
      barLine.className = 'notation-note';
      barLine.innerHTML = '<span class="num" style="color:var(--muted);font-size:1.5rem">|</span>';
      display.appendChild(barLine);
    }

    var el = document.createElement('span');
    el.className = 'notation-note';
    if (item.note < 0) el.className += ' zero-octave';
    if (item.note > 7) el.className += ' high-octave';

    var displayNote = Math.abs(item.note);
    var html = '';

    // Dots for octave
    if (item.note > 7) {
      var dots = Math.floor((item.note - 1) / 7);
      for (var d = 0; d < dots; d++) {
        html += '<span class="dot-above">•</span>';
      }
    }
    if (item.note < 1) {
      var dots = Math.ceil((1 - item.note) / 7);
      for (var d = 0; d < dots; d++) {
        html += '<span class="dot-below">•</span>';
      }
    }

    // Note number
    if (item.note === 0) {
      html += '<span class="num" style="color:var(--muted)">0</span>';
    } else {
      html += '<span class="num">' + displayNote + '</span>';
    }

    // Duration markers
    if (item.duration === 0.5) {
      html += '<span class="underline"></span>';
    } else if (item.duration === 2) {
      html += '<span class="dash">-</span>';
    } else if (item.duration === 4) {
      html += '<span class="dash">-</span><span class="dash">-</span>';
    }

    el.innerHTML = html;
    el.onclick = (function(i) { return function() { playNotationNote(i); highlightNote(i); }; })(idx);
    el.dataset.index = idx;
    display.appendChild(el);

    beatCount += item.duration;
  });

  // Final bar line
  var finalBar = document.createElement('span');
  finalBar.className = 'notation-note';
  finalBar.innerHTML = '<span class="num" style="color:var(--muted);font-size:1.5rem">|</span>';
  display.appendChild(finalBar);
}

function notationToMidi(noteNum) {
  // Convert numbered notation to MIDI
  // 1 = Do, 2 = Re, etc.
  // In key of C: 1=C4(60), so note 1 -> 60
  var key = document.getElementById('jnKey').value;
  var baseMidi = KEY_BASE_MIDI[key];

  if (noteNum === 0) return baseMidi - 12; // rest or low octave reference

  // Map: 1->0, 2->2, 3->4, 4->5, 5->7, 6->9, 7->11 (semitones from root)
  var semitoneMap = [0, 2, 4, 5, 7, 9, 11];
  var octave = Math.floor((noteNum - 1) / 7);
  var degree = ((noteNum - 1) % 7 + 7) % 7;

  return baseMidi + octave * 12 + semitoneMap[degree];
}

function playNotationNote(idx) {
  var item = currentNotation[idx];
  if (item.note === 0) return;
  var midi = notationToMidi(item.note);
  playNote(midi, item.duration * (60 / jnBpm), 'triangle', 0.3);
}

function highlightNote(idx) {
  document.querySelectorAll('.notation-note').forEach(function(el) { el.classList.remove('active'); });
  var el = document.querySelector('.notation-note[data-index="' + idx + '"]');
  if (el) el.classList.add('active');
}

function playNotation() {
  var key = document.getElementById('jnKey').value;
  var beatDuration = 60 / jnBpm;
  var delay = 0;

  currentNotation.forEach(function(item, idx) {
    setTimeout(function() {
      highlightNote(idx);
      if (item.note !== 0) {
        var midi = notationToMidi(item.note);
        playNote(midi, item.duration * beatDuration * 0.9, 'triangle', 0.3);
      }
    }, delay * 1000);
    delay += item.duration * beatDuration;
  });
}

function playNotationWithMetro() {
  var beatDuration = 60 / jnBpm;
  var delay = 0;
  var beatCount = 0;
  var metro = document.getElementById('jnMetro');

  // Metronome click
  function metroClick() {
    setTimeout(function() {
      metro.classList.add('active');
      setTimeout(function() { metro.classList.remove('active'); }, 100);
      // Play click sound
      var ctx = getAudioCtx();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.frequency.value = beatCount % 4 === 0 ? 1000 : 800;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.05);
      beatCount++;
    }, delay * 1000);
    delay += beatDuration;
    if (delay < currentNotation.reduce(function(s, n) { return s + n.duration; }, 0) * beatDuration + beatDuration) {
      metroClick();
    }
  }

  // Play notes with metronome
  var noteDelay = 0;
  currentNotation.forEach(function(item, idx) {
    setTimeout(function() {
      highlightNote(idx);
      if (item.note !== 0) {
        var midi = notationToMidi(item.note);
        playNote(midi, item.duration * beatDuration * 0.9, 'triangle', 0.3);
      }
    }, noteDelay * 1000);
    noteDelay += item.duration * beatDuration;
  });

  metroClick();
}

function playNotationSingle() {
  if (jnPlayingSingle) {
    jnPlayingSingle = false;
    document.getElementById('jnPlaySingleBtn').textContent = '▶ 逐音播放';
    return;
  }
  jnPlayingSingle = true;
  jnSingleIndex = 0;
  document.getElementById('jnPlaySingleBtn').textContent = '⏹ 停止';

  function playNext() {
    if (!jnPlayingSingle || jnSingleIndex >= currentNotation.length) {
      jnPlayingSingle = false;
      document.getElementById('jnPlaySingleBtn').textContent = '▶ 逐音播放';
      return;
    }
    highlightNote(jnSingleIndex);
    playNotationNote(jnSingleIndex);
    jnSingleIndex++;
    setTimeout(playNext, 800);
  }
  playNext();
}

// ============================================================
// STAFF NOTATION (五线谱视唱)
// ============================================================
let staffNotation = [];
let staffShowSolfege = false;
let staffPlaying = false;

const STAFF_KEY_OFFSETS = {
  'C': 0, 'G': 7, 'D': 2, 'A': 9, 'F': 5, 'bB': 10, 'bE': 3,
  'a': 0, 'e': 7, 'd': 5
};
const STAFF_KEY_SHARPS = {
  'C': [], 'G': ['F#'], 'D': ['F#', 'C#'], 'A': ['F#', 'C#', 'G#'],
  'F': ['Bb'], 'bB': ['Bb', 'Eb'], 'bE': ['Bb', 'Eb', 'Ab'],
  'a': [], 'e': ['F#'], 'd': ['Bb']
};

function generateStaffNotation() {
  const key = document.getElementById('staffKey').value;
  const meter = document.getElementById('staffMeter').value;
  const bars = parseInt(document.getElementById('staffBars').value);
  const diff = parseInt(document.getElementById('staffDiff').value);

  var beatsPerBar = parseInt(meter.split('/')[0]);
  var totalBeats = beatsPerBar * bars;
  var isMinor = ['a', 'e', 'd'].indexOf(key) !== -1;

  // Scale degrees in semitones from root
  var scale;
  if (isMinor) {
    scale = [0, 2, 3, 5, 7, 8, 10]; // natural minor
  } else {
    scale = [0, 2, 4, 5, 7, 9, 11]; // major
  }

  var melody = [];
  var currentDeg = 0; // Start on tonic

  for (var i = 0; i < totalBeats; i++) {
    var step;
    if (diff === 1) {
      // Mostly stepwise
      step = Math.random() < 0.85 ? (Math.random() < 0.5 ? 1 : -1) : 0;
    } else if (diff === 2) {
      step = Math.random() < 0.6 ? (Math.random() < 0.5 ? 1 : -1) :
             Math.random() < 0.8 ? (Math.random() < 0.5 ? 2 : -2) : 0;
    } else {
      step = Math.random() < 0.4 ? (Math.random() < 0.5 ? 1 : -1) :
             Math.random() < 0.7 ? (Math.floor(Math.random() * 5) - 2) : 0;
    }

    currentDeg = Math.max(0, Math.min(6, currentDeg + step));

    var dur;
    var durRoll = Math.random();
    if (durRoll < 0.55) dur = 1;
    else if (durRoll < 0.8) dur = 2;
    else dur = 0.5;

    if (dur > 1 && i + dur > totalBeats) dur = 1;

    melody.push({ degree: currentDeg, duration: dur });
    if (dur > 1) i += dur - 1;
  }

  staffNotation = melody;
  drawStaff();
  updateStaffKeyDisplay();
}

function staffDegreeToMidi(degree) {
  var key = document.getElementById('staffKey').value;
  var offset = STAFF_KEY_OFFSETS[key];
  var isMinor = ['a', 'e', 'd'].indexOf(key) !== -1;

  var scale = isMinor ? [0, 2, 3, 5, 7, 8, 10] : [0, 2, 4, 5, 7, 9, 11];

  // Base: C4 = 60, but adjust for key
  var baseNote = 60;
  if (isMinor) {
    var minorBase = { 'a': 57, 'e': 64, 'd': 62 };
    baseNote = minorBase[key] || 60;
  } else {
    baseNote = KEY_BASE_MIDI[key] || 60;
  }

  return baseNote + scale[degree];
}

function updateStaffKeyDisplay() {
  var key = document.getElementById('staffKey').value;
  var display = document.getElementById('staffKeyDisplay');
  var isMinor = ['a', 'e', 'd'].indexOf(key) !== -1;
  var sharps = STAFF_KEY_SHARPS[key] || [];

  var text = '1 = ' + key.toUpperCase();
  if (isMinor) text += ' 小调';
  else text += ' 大调';
  if (sharps.length > 0) text += ' (' + sharps.join(', ') + ')';
  display.textContent = text;
}

function drawStaff() {
  var canvas = document.getElementById('staffCanvas');
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var displayW = canvas.parentElement.offsetWidth - 48;
  canvas.width = displayW * dpr;
  canvas.height = 200 * dpr;
  canvas.style.width = displayW + 'px';
  canvas.style.height = '200px';
  ctx.scale(dpr, dpr);

  var w = displayW;
  var h = 200;
  var staffTop = 50;
  var lineSpacing = 12;
  var noteStartX = 60;
  var noteSpacing = 40;

  ctx.clearRect(0, 0, w, h);

  // Draw staff lines
  ctx.strokeStyle = 'rgba(139,143,163,0.4)';
  ctx.lineWidth = 1;
  for (var i = 0; i < 5; i++) {
    var y = staffTop + i * lineSpacing;
    ctx.beginPath();
    ctx.moveTo(20, y);
    ctx.lineTo(w - 20, y);
    ctx.stroke();
  }

  // Draw clef (treble)
  ctx.fillStyle = 'var(--ink)';
  ctx.font = '40px serif';
  ctx.fillText('𝄞', 22, staffTop + 4 * lineSpacing + 5);

  // Draw key signature
  var key = document.getElementById('staffKey').value;
  var sharps = STAFF_KEY_SHARPS[key] || [];
  var sharpX = 55;
  sharps.forEach(function() {
    ctx.font = '16px serif';
    ctx.fillText('♯', sharpX, staffTop + 3 * lineSpacing);
    sharpX += 12;
  });

  // Draw time signature
  var meter = document.getElementById('staffMeter').value;
  var meterParts = meter.split('/');
  ctx.font = 'bold 18px InstrumentSans, sans-serif';
  ctx.fillStyle = 'var(--ink)';
  ctx.textAlign = 'center';
  ctx.fillText(meterParts[0], sharpX + 10, staffTop + 2 * lineSpacing);
  ctx.fillText(meterParts[1], sharpX + 10, staffTop + 4 * lineSpacing);
  ctx.textAlign = 'left';

  // Draw notes
  var x = sharpX + 30;
  var beatCount = 0;
  var beatsPerBar = parseInt(meter.split('/')[0]);

  staffNotation.forEach(function(item, idx) {
    // Bar line
    if (beatCount >= beatsPerBar && idx > 0) {
      ctx.strokeStyle = 'rgba(139,143,163,0.6)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x - noteSpacing / 2, staffTop);
      ctx.lineTo(x - noteSpacing / 2, staffTop + 4 * lineSpacing);
      ctx.stroke();
      beatCount = 0;
    }

    var midi = staffDegreeToMidi(item.degree);
    // Convert MIDI to staff position
    // C4 = middle of staff (3rd line from bottom)
    // Each semitone = half a line space
    var staffPos = (midi - 60) * 0.5; // in half-line-spaces from middle line
    var noteY = staffTop + 2 * lineSpacing - staffPos * (lineSpacing / 2);

    // Ledger lines
    if (noteY > staffTop + 4 * lineSpacing) {
      ctx.strokeStyle = 'rgba(139,143,163,0.5)';
      ctx.lineWidth = 1;
      for (var ly = staffTop + 4 * lineSpacing + lineSpacing; ly <= noteY; ly += lineSpacing) {
        ctx.beginPath();
        ctx.moveTo(x - 12, ly);
        ctx.lineTo(x + 12, ly);
        ctx.stroke();
      }
    }
    if (noteY < staffTop) {
      ctx.strokeStyle = 'rgba(139,143,163,0.5)';
      ctx.lineWidth = 1;
      for (var ly = staffTop - lineSpacing; ly >= noteY; ly -= lineSpacing) {
        ctx.beginPath();
        ctx.moveTo(x - 12, ly);
        ctx.lineTo(x + 12, ly);
        ctx.stroke();
      }
    }

    // Draw note head
    ctx.fillStyle = '#e8eaf0';
    ctx.beginPath();
    ctx.ellipse(x, noteY, 7, 5, -0.2, 0, Math.PI * 2);
    ctx.fill();

    // Draw stem
    ctx.strokeStyle = '#e8eaf0';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (noteY >= staffTop + 2 * lineSpacing) {
      // Stem down
      ctx.moveTo(x - 7, noteY);
      ctx.lineTo(x - 7, noteY - 30);
    } else {
      // Stem up
      ctx.moveTo(x + 7, noteY);
      ctx.lineTo(x + 7, noteY + 30);
    }
    ctx.stroke();

    // Note name label
    if (staffShowSolfege) {
      var isMinor = ['a', 'e', 'd'].indexOf(key) !== -1;
      var solfegeMajor = ['Do', 'Re', 'Mi', 'Fa', 'Sol', 'La', 'Si'];
      var solfegeMinor = ['La', 'Si', 'Do', 'Re', 'Mi', 'Fa', 'Sol'];
      var sol = isMinor ? solfegeMinor[item.degree] : solfegeMajor[item.degree];
      ctx.fillStyle = 'var(--accent)';
      ctx.font = '10px GeistMono, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(sol, x, noteY + (noteY >= staffTop + 2 * lineSpacing ? -35 : 42));
      ctx.textAlign = 'left';
    }

    // Duration flags
    if (item.duration === 0.5) {
      // Eighth note flag
      ctx.strokeStyle = '#e8eaf0';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      if (noteY >= staffTop + 2 * lineSpacing) {
        ctx.moveTo(x - 7, noteY - 30);
        ctx.quadraticCurveTo(x - 2, noteY - 25, x + 2, noteY - 20);
      } else {
        ctx.moveTo(x + 7, noteY + 30);
        ctx.quadraticCurveTo(x + 12, noteY + 25, x + 16, noteY + 20);
      }
      ctx.stroke();
    } else if (item.duration === 2) {
      // Half note - hollow
      ctx.fillStyle = 'var(--bg)';
      ctx.beginPath();
      ctx.ellipse(x, noteY, 5, 3.5, -0.2, 0, Math.PI * 2);
      ctx.fill();
    }

    beatCount += item.duration;
    x += item.duration >= 2 ? noteSpacing * 1.5 : noteSpacing;
  });

  // Final bar line (double)
  ctx.strokeStyle = 'rgba(139,143,163,0.6)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x - noteSpacing / 2, staffTop);
  ctx.lineTo(x - noteSpacing / 2, staffTop + 4 * lineSpacing);
  ctx.stroke();
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x - noteSpacing / 2 + 4, staffTop);
  ctx.lineTo(x - noteSpacing / 2 + 4, staffTop + 4 * lineSpacing);
  ctx.stroke();
}

function playStaffNotation() {
  if (staffPlaying) {
    staffPlaying = false;
    return;
  }
  staffPlaying = true;
  var beatDuration = 60 / jnBpm;
  var delay = 0;

  staffNotation.forEach(function(item, idx) {
    setTimeout(function() {
      if (!staffPlaying) return;
      var midi = staffDegreeToMidi(item.degree);
      playNote(midi, item.duration * beatDuration * 0.9, 'triangle', 0.3);
    }, delay * 1000);
    delay += item.duration * beatDuration;
  });

  setTimeout(function() { staffPlaying = false; }, delay * 1000 + 200);
}

function toggleStaffSolfege() {
  staffShowSolfege = !staffShowSolfege;
  document.getElementById('staffSolfegeLabel').textContent = '当前显示: ' + (staffShowSolfege ? '唱名' : '音名');
  drawStaff();
}
