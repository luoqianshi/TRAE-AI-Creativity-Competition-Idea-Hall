<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中学生地理会考综合软件</title>
<style>
  :root {
    --primary: #2c7a7b;
    --primary-dark: #276749;
    --primary-light: #e6fffa;
    --secondary: #d69e2e;
    --bg: #f7fafc;
    --card: #ffffff;
    --text: #2d3748;
    --text-light: #718096;
    --border: #e2e8f0;
    --success: #48bb78;
    --danger: #e53e3e;
    --warning: #ed8936;
    --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
  }
  .app {
    display: flex;
    height: 100vh;
    width: 100vw;
  }
  /* Sidebar */
  .sidebar {
    width: 220px;
    background: linear-gradient(180deg, #234e52 0%, #2c7a7b 100%);
    color: white;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: transform 0.3s;
  }
  .sidebar-header {
    padding: 24px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    text-align: center;
  }
  .sidebar-header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 1px; }
  .sidebar-header p { font-size: 0.75rem; opacity: 0.8; margin-top: 4px; }
  .nav-menu { flex: 1; overflow-y: auto; padding: 12px 0; }
  .nav-item {
    display: flex;
    align-items: center;
    padding: 12px 20px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.9rem;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { background: rgba(255,255,255,0.1); }
  .nav-item.active { background: rgba(255,255,255,0.15); border-left-color: var(--secondary); }
  .nav-item .icon { width: 24px; text-align: center; margin-right: 10px; font-size: 1.1rem; }
  .nav-item .badge {
    margin-left: auto;
    background: var(--danger);
    color: white;
    font-size: 0.7rem;
    padding: 1px 6px;
    border-radius: 10px;
  }
  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid rgba(255,255,255,0.15);
    font-size: 0.75rem;
    opacity: 0.7;
    text-align: center;
  }
  /* Main Content */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .topbar {
    height: 56px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    flex-shrink: 0;
  }
  .topbar-title { font-size: 1.1rem; font-weight: 600; color: var(--primary); }
  .topbar-stats { display: flex; gap: 16px; font-size: 0.85rem; color: var(--text-light); }
  .topbar-stats span { display: flex; align-items: center; gap: 4px; }
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }
  .page { display: none; animation: fadeIn 0.3s; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  /* Cards */
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .card-title {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--primary);
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--primary-light);
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  @media (max-width: 900px) {
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    .sidebar { position: fixed; z-index: 100; transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
  }
  /* Stat boxes */
  .stat-box {
    background: linear-gradient(135deg, var(--primary-light) 0%, #fff 100%);
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    border: 1px solid var(--border);
  }
  .stat-box .value { font-size: 2rem; font-weight: 700; color: var(--primary); }
  .stat-box .label { font-size: 0.85rem; color: var(--text-light); margin-top: 4px; }
  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 500;
    transition: all 0.2s;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: var(--secondary); color: white; }
  .btn-secondary:hover { background: #c08a1a; }
  .btn-success { background: var(--success); color: white; }
  .btn-danger { background: var(--danger); color: white; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
  .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
  .btn-lg { padding: 14px 28px; font-size: 1rem; }
  /* Form elements */
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; color: var(--text); }
  .form-input, .form-select, .form-textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    font-family: inherit;
    transition: border-color 0.2s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    outline: none;
    border-color: var(--primary);
  }
  .form-textarea { min-height: 80px; resize: vertical; }
  /* Option list for quiz */
  .option-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .option-item {
    display: flex;
    align-items: center;
    padding: 14px 18px;
    border: 2px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.95rem;
  }
  .option-item:hover { border-color: var(--primary); background: var(--primary-light); }
  .option-item.selected { border-color: var(--primary); background: var(--primary-light); }
  .option-item.correct { border-color: var(--success); background: #f0fff4; }
  .option-item.wrong { border-color: var(--danger); background: #fff5f5; }
  .option-item .opt-letter {
    width: 28px; height: 28px; border-radius: 50%; background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 0.85rem; margin-right: 12px; flex-shrink: 0;
  }
  .option-item.selected .opt-letter { background: var(--primary); color: white; }
  .option-item.correct .opt-letter { background: var(--success); color: white; }
  .option-item.wrong .opt-letter { background: var(--danger); color: white; }
  /* Progress bar */
  .progress-bar {
    height: 8px; background: var(--border); border-radius: 4px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-dark));
    border-radius: 4px; transition: width 0.3s;
  }
  /* Tags */
  .tag {
    display: inline-block; padding: 2px 10px; border-radius: 20px;
    font-size: 0.75rem; font-weight: 500; margin-right: 6px; margin-bottom: 4px;
  }
  .tag-blue { background: #bee3f8; color: #2b6cb0; }
  .tag-green { background: #c6f6d5; color: #276749; }
  .tag-orange { background: #feebc8; color: #c05621; }
  .tag-red { background: #fed7d7; color: #c53030; }
  .tag-purple { background: #e9d8fd; color: #6b46c1; }
  /* Quiz layout */
  .quiz-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
  }
  .quiz-timer {
    font-size: 1.2rem; font-weight: 600; color: var(--primary);
    font-family: monospace;
  }
  .quiz-timer.warning { color: var(--danger); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .question-text { font-size: 1.1rem; font-weight: 500; margin-bottom: 8px; line-height: 1.8; }
  .question-meta { font-size: 0.8rem; color: var(--text-light); margin-bottom: 16px; }
  .quiz-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }
  .quiz-nav { display: flex; gap: 8px; flex-wrap: wrap; }
  .quiz-nav-dot {
    width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 0.75rem;
    cursor: pointer; transition: all 0.2s;
  }
  .quiz-nav-dot:hover { border-color: var(--primary); }
  .quiz-nav-dot.answered { background: var(--primary); color: white; border-color: var(--primary); }
  .quiz-nav-dot.current { border-color: var(--secondary); box-shadow: 0 0 0 2px rgba(214,158,46,0.3); }
  /* Analysis */
  .analysis-box {
    background: #fffaf0; border-left: 4px solid var(--secondary);
    padding: 16px; border-radius: 0 8px 8px 0; margin-top: 16px;
  }
  .analysis-box h4 { color: var(--secondary); margin-bottom: 8px; font-size: 0.95rem; }
  /* Book selector */
  .book-selector { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .book-btn {
    padding: 10px 18px; border-radius: 8px; border: 2px solid var(--border);
    background: var(--card); cursor: pointer; font-size: 0.9rem; font-weight: 500;
    transition: all 0.2s;
  }
  .book-btn:hover { border-color: var(--primary); color: var(--primary); }
  .book-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
  .chapter-list { display: flex; flex-direction: column; gap: 8px; }
  .chapter-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); cursor: pointer; transition: all 0.2s;
  }
  .chapter-item:hover { border-color: var(--primary); background: var(--primary-light); }
  .chapter-item.selected { border-color: var(--primary); background: var(--primary-light); }
  /* Knowledge cards */
  .knowledge-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; transition: all 0.2s; cursor: pointer; position: relative;
  }
  .knowledge-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
  .knowledge-card .card-status {
    position: absolute; top: 12px; right: 12px;
    width: 12px; height: 12px; border-radius: 50%;
  }
  .knowledge-card .card-status.mastered { background: var(--success); }
  .knowledge-card .card-status.learning { background: var(--warning); }
  .knowledge-card .card-status.unknown { background: var(--border); }
  .knowledge-card h4 { font-size: 1rem; color: var(--primary); margin-bottom: 8px; }
  .knowledge-card p { font-size: 0.85rem; color: var(--text-light); line-height: 1.6; }
  /* Wrong question item */
  .wq-item {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; margin-bottom: 16px;
  }
  .wq-item .wq-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .wq-item .wq-title { font-weight: 500; flex: 1; }
  .wq-item .wq-actions { display: flex; gap: 8px; }
  /* Chart bars (simple CSS) */
  .bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding: 10px 0; }
  .bar-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bar-item .bar {
    width: 100%; border-radius: 4px 4px 0 0; background: var(--primary);
    min-height: 4px; transition: height 0.5s;
  }
  .bar-item .bar-label { font-size: 0.7rem; color: var(--text-light); text-align: center; }
  /* Pie chart placeholder */
  .pie-chart { display: flex; align-items: center; justify-content: center; }
  .pie-legend { display: flex; flex-direction: column; gap: 8px; margin-left: 20px; }
  .pie-legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
  .pie-legend-color { width: 14px; height: 14px; border-radius: 3px; }
  /* Modal */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 1000;
    display: none; align-items: center; justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal-content {
    background: var(--card); border-radius: 12px; padding: 28px;
    max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto;
    box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-header h3 { color: var(--primary); font-size: 1.1rem; }
  .modal-close { font-size: 1.5rem; cursor: pointer; color: var(--text-light); line-height: 1; }
  /* Tooltip */
  .tooltip { position: relative; }
  .tooltip-text {
    position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    background: var(--text); color: white; padding: 6px 10px; border-radius: 6px;
    font-size: 0.75rem; white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity 0.2s; margin-bottom: 6px;
  }
  .tooltip:hover .tooltip-text { opacity: 1; }
  /* Mobile menu toggle */
  .menu-toggle {
    display: none; font-size: 1.5rem; cursor: pointer; margin-right: 12px;
  }
  @media (max-width: 900px) {
    .menu-toggle { display: block; }
  }
  /* Exam result */
  .result-summary { text-align: center; padding: 40px 20px; }
  .result-score { font-size: 4rem; font-weight: 700; color: var(--primary); }
  .result-label { font-size: 1rem; color: var(--text-light); margin-top: 8px; }
  .result-detail { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 24px; }
  .result-box { background: var(--primary-light); padding: 16px; border-radius: 10px; }
  .result-box .num { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
  .result-box .txt { font-size: 0.85rem; color: var(--text-light); margin-top: 4px; }
  /* Hide/Show */
  .hidden { display: none !important; }
  .fade-in { animation: fadeIn 0.4s ease-out; }
  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-light); }
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>地理会考</h1>
      <p>综合复习软件</p>
    </div>
    <nav class="nav-menu">
      <div class="nav-item active" data-page="dashboard" onclick="router('dashboard')">
        <span class="icon">📊</span> 仪表盘
      </div>
      <div class="nav-item" data-page="selftest" onclick="router('selftest')">
        <span class="icon">📝</span> 自测
      </div>
      <div class="nav-item" data-page="review" onclick="router('review')">
        <span class="icon">🧠</span> 梳理
      </div>
      <div class="nav-item" data-page="wrongbook" onclick="router('wrongbook')">
        <span class="icon">❌</span> 错题本
        <span class="badge" id="wrongBadge" style="display:none">0</span>
      </div>
      <div class="nav-item" data-page="simulate" onclick="router('simulate')">
        <span class="icon">⏱️</span> 模拟练习
      </div>
      <div class="nav-item" data-page="create" onclick="router('create')">
        <span class="icon">➕</span> 制作题目
      </div>
    </nav>
    <div class="sidebar-footer">
      数据保存在本地浏览器
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;">
        <span class="menu-toggle" onclick="toggleSidebar()">☰</span>
        <span class="topbar-title" id="pageTitle">仪表盘</span>
      </div>
      <div class="topbar-stats">
        <span>📚 已答 <strong id="statTotal">0</strong></span>
        <span>✅ 正确 <strong id="statCorrect">0</strong></span>
        <span>❌ 错题 <strong id="statWrong">0</strong></span>
      </div>
    </div>

    <div class="content" id="contentArea">
      <!-- Dashboard Page -->
      <div class="page active" id="page-dashboard">
        <div class="grid-4">
          <div class="stat-box">
            <div class="value" id="dashTotal">0</div>
            <div class="label">累计答题</div>
          </div>
          <div class="stat-box">
            <div class="value" id="dashCorrect">0%</div>
            <div class="label">正确率</div>
          </div>
          <div class="stat-box">
            <div class="value" id="dashWrong">0</div>
            <div class="label">待消灭错题</div>
          </div>
          <div class="stat-box">
            <div class="value" id="dashStreak">0</div>
            <div class="label">今日答题</div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">学习进度</div>
          <div id="dashProgress"></div>
        </div>
        <div class="grid-2">
          <div class="card">
            <div class="card-title">最近错题分布</div>
            <div id="dashWrongChart"></div>
          </div>
          <div class="card">
            <div class="card-title">7日正确率趋势</div>
            <div id="dashTrendChart"></div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">快速开始</div>
          <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <button class="btn btn-primary btn-lg" onclick="router('selftest')">📝 开始自测</button>
            <button class="btn btn-secondary btn-lg" onclick="router('simulate')">⏱️ 模拟练习</button>
            <button class="btn btn-success btn-lg" onclick="router('wrongbook')">❌ 消灭错题</button>
          </div>
        </div>
      </div>

      <!-- Self Test Page -->
      <div class="page" id="page-selftest">
        <div id="selftest-setup">
          <div class="card">
            <div class="card-title">选择测试范围</div>
            <div class="book-selector" id="stBookSelector"></div>
            <div class="chapter-list" id="stChapterList"></div>
            <div style="margin-top:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
              <span style="font-size:0.9rem;font-weight:500;">题目数量：</span>
              <select class="form-select" id="stCount" style="width:100px;">
                <option value="10">10题</option>
                <option value="20" selected>20题</option>
                <option value="30">30题</option>
                <option value="50">50题</option>
              </select>
              <button class="btn btn-primary" onclick="startSelfTest()">开始测试</button>
            </div>
          </div>
        </div>
        <div id="selftest-quiz" style="display:none;">
          <div class="card">
            <div class="quiz-header">
              <div>题目 <span id="stCurrent">1</span> / <span id="stTotalNum">20</span></div>
              <div class="quiz-timer" id="stTimer">--:--</div>
            </div>
            <div class="question-text" id="stQuestion"></div>
            <div class="question-meta" id="stMeta"></div>
            <div class="option-list" id="stOptions"></div>
            <div class="analysis-box" id="stAnalysis" style="display:none;">
              <h4>解析</h4>
              <p id="stAnalysisText"></p>
            </div>
            <div class="quiz-footer">
              <div class="quiz-nav" id="stNav"></div>
              <div>
                <button class="btn btn-outline" id="stPrevBtn" onclick="stPrev()" style="margin-right:8px;">上一题</button>
                <button class="btn btn-primary" id="stNextBtn" onclick="stNext()">下一题</button>
                <button class="btn btn-success" id="stSubmitBtn" onclick="stSubmit()" style="display:none;">提交</button>
              </div>
            </div>
          </div>
        </div>
        <div id="selftest-result" style="display:none;">
          <div class="card">
            <div class="result-summary">
              <div class="result-score" id="stScore">0</div>
              <div class="result-label">分</div>
              <div class="result-detail">
                <div class="result-box"><div class="num" id="stResultTotal">0</div><div class="txt">总题数</div></div>
                <div class="result-box"><div class="num" id="stResultCorrect">0</div><div class="txt">正确</div></div>
                <div class="result-box"><div class="num" id="stResultWrong">0</div><div class="txt">错误</div></div>
              </div>
            </div>
            <div style="text-align:center;margin-top:20px;">
              <button class="btn btn-primary" onclick="showWrongInResult()">查看错题</button>
              <button class="btn btn-outline" onclick="resetSelfTest()" style="margin-left:12px;">再来一次</button>
              <button class="btn btn-outline" onclick="router('dashboard')" style="margin-left:12px;">返回首页</button>
            </div>
          </div>
          <div id="stResultWrongList"></div>
        </div>
      </div>

      <!-- Review Page -->
      <div class="page" id="page-review">
        <div class="card">
          <div class="card-title">选择教材章节</div>
          <div class="book-selector" id="rvBookSelector"></div>
          <div id="rvKnowledgeGrid"></div>
        </div>
      </div>

      <!-- Wrong Book Page -->
      <div class="page" id="page-wrongbook">
        <div class="card">

// ==================== QUESTION DATABASE ====================
// This will be populated in the next part due to size constraints
let QUESTIONS = [];
let CUSTOM_QUESTIONS = [];

// ==================== STATE MANAGEMENT ====================
let currentPage = 'dashboard';
let selfTestState = { questions: [], answers: [], current: 0, submitted: false, timer: null, timeLeft: 0 };
let simState = { questions: [], answers: [], current: 0, submitted: false, timer: null, timeLeft: 0, totalTime: 0 };
let wrongPracticeState = { questions: [], answers: [], current: 0, submitted: false };
let userProgress = { totalAnswered: 0, totalCorrect: 0, dailyStats: {}, chapterProgress: {}, knowledgeStatus: {} };
let wrongRecords = [];

// ==================== STORAGE ====================
function loadData() {
  try {
    const p = localStorage.getItem('geo_progress');
    if (p) userProgress = JSON.parse(p);
    const w = localStorage.getItem('geo_wrong');
    if (w) wrongRecords = JSON.parse(w);
    const c = localStorage.getItem('geo_custom');
    if (c) CUSTOM_QUESTIONS = JSON.parse(c);
    const q = localStorage.getItem('geo_knowledge');
    if (q) userProgress.knowledgeStatus = JSON.parse(q);
  } catch(e) { console.error('Load error', e); }
}

function saveData() {
  localStorage.setItem('geo_progress', JSON.stringify(userProgress));
  localStorage.setItem('geo_wrong', JSON.stringify(wrongRecords));
  localStorage.setItem('geo_custom', JSON.stringify(CUSTOM_QUESTIONS));
  localStorage.setItem('geo_knowledge', JSON.stringify(userProgress.knowledgeStatus || {}));
}

function getToday() {
  return new Date().toISOString().split('T')[0];
}

function updateStats() {
  const today = getToday();
  const daily = userProgress.dailyStats[today] || { answered: 0, correct: 0 };
  const totalWrong = wrongRecords.filter(r => !r.isEliminated).length;
  document.getElementById('statTotal').textContent = userProgress.totalAnswered;
  document.getElementById('statCorrect').textContent = userProgress.totalCorrect;
  document.getElementById('statWrong').textContent = totalWrong;
  const badge = document.getElementById('wrongBadge');
  if (totalWrong > 0) { badge.textContent = totalWrong; badge.style.display = 'inline-block'; }
  else badge.style.display = 'none';
}

// ==================== ROUTER ====================
function router(page) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const nav = document.querySelector('.nav-item[data-page="' + page + '"]');
  if (nav) nav.classList.add('active');
  const titles = {
    dashboard: '仪表盘', selftest: '自测', review: '梳理',
    wrongbook: '错题本', simulate: '模拟练习', create: '制作题目'
  };
  document.getElementById('pageTitle').textContent = titles[page] || '';
  document.getElementById('sidebar').classList.remove('open');
  updateStats();
  if (page === 'dashboard') renderDashboard();
  if (page === 'selftest') initSelfTestSetup();
  if (page === 'review') initReview();
  if (page === 'wrongbook') renderWrongBook();
  if (page === 'simulate') initSimulate();
  if (page === 'create') initCreate();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ==================== DASHBOARD ====================
function renderDashboard() {
  const today = getToday();
  const daily = userProgress.dailyStats[today] || { answered: 0, correct: 0 };
  const totalWrong = wrongRecords.filter(r => !r.isEliminated).length;
  const rate = userProgress.totalAnswered > 0 ? Math.round(userProgress.totalCorrect / userProgress.totalAnswered * 100) : 0;
  document.getElementById('dashTotal').textContent = userProgress.totalAnswered;
  document.getElementById('dashCorrect').textContent = rate + '%';
  document.getElementById('dashWrong').textContent = totalWrong;
  document.getElementById('dashStreak').textContent = daily.answered;

  // Progress by book
  let progressHTML = '<div class="grid-2">';
  for (const [bid, book] of Object.entries(BOOKS)) {
    const chaps = book.chapters;
    let mastered = 0;
    chaps.forEach((ch, idx) => {
      const key = bid + '_' + idx;
      const p = userProgress.chapterProgress[key];
      if (p && p.rate > 0.6) mastered++;
    });
    const pct = Math.round(mastered / chaps.length * 100);
    progressHTML += `
      <div class="stat-box" style="text-align:left;padding:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-weight:600;font-size:0.95rem;">${book.name}</span>
          <span class="tag tag-blue">${pct}%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div style="font-size:0.8rem;color:var(--text-light);margin-top:6px;">${mastered}/${chaps.length} 章节达标</div>
      </div>`;
  }
  progressHTML += '</div>';
  document.getElementById('dashProgress').innerHTML = progressHTML;

  // Wrong chart by book
  const bookWrong = {};
  wrongRecords.filter(r => !r.isEliminated).forEach(r => {
    const q = findQuestion(r.questionId);
    if (q) { bookWrong[q.book] = (bookWrong[q.book] || 0) + 1; }
  });
  let chartHTML = '<div class="bar-chart">';
  for (const [bid, name] of Object.entries({'7a':'七上','7b':'七下','8a':'八上','8b':'八下'})) {
    const h = (bookWrong[bid] || 0) * 10;
    chartHTML += `<div class="bar-item"><div class="bar" style="height:${Math.min(h,100)}px"></div><div class="bar-label">${name}</div></div>`;
  }
  chartHTML += '</div>';
  document.getElementById('dashWrongChart').innerHTML = chartHTML;

  // Trend chart (7 days)
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    days.push(d.toISOString().split('T')[0]);
  }
  let trendHTML = '<div class="bar-chart">';
  days.forEach(d => {
    const s = userProgress.dailyStats[d];
    const rate = s && s.answered > 0 ? Math.round(s.correct / s.answered * 100) : 0;
    trendHTML += `<div class="bar-item"><div class="bar" style="height:${rate}px;background:${rate>60?'var(--success)':rate>40?'var(--warning)':'var(--danger)'};"></div><div class="bar-label">${d.slice(5)}</div></div>`;
  });
  trendHTML += '</div>';
  document.getElementById('dashTrendChart').innerHTML = trendHTML;
}

// ==================== SELF TEST ====================
let stSelectedChapters = new Set();
let stCurrentBook = '7a';

function initSelfTestSetup() {
  document.getElementById('selftest-setup').style.display = 'block';
  document.getElementById('selftest-quiz').style.display = 'none';
  document.getElementById('selftest-result').style.display = 'none';
  let sel = document.getElementById('stBookSelector');
  if (!sel) return;
  sel.innerHTML = '';
  let first = true;
  for (const bid of ['7a','7b','8a','8b']) {
    const book = BOOKS[bid];
    const btn = document.createElement('button');
    const isActive = first || stCurrentBook === bid;
    btn.className = 'book-btn' + (isActive ? ' active' : '');
    btn.textContent = book.name;
    btn.onclick = () => {
      stCurrentBook = bid;
      sel.querySelectorAll('.book-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderSTChapters(bid);
    };
    sel.appendChild(btn);
    if (first) {
      stCurrentBook = bid;
      renderSTChapters(bid, true);
    }
    first = false;
  }
}

function renderSTChapters(bid, selectAll) {
  stCurrentBook = bid;
  const list = document.getElementById('stChapterList');
  if (!list) return;
  list.innerHTML = '';
  // 清除该册以外的选择
  stSelectedChapters = new Set(Array.from(stSelectedChapters).filter(k => k.startsWith(bid + '_')));
  if (selectAll) {
    BOOKS[bid].chapters.forEach((_, idx) => stSelectedChapters.add(bid + '_' + idx));
  }
  // 统计信息
  const info = document.createElement('div');
  info.style.cssText = 'font-size:0.85rem;color:var(--text-light);margin-bottom:12px;padding:8px 12px;background:var(--primary-light);border-radius:6px;';
  const totalQ = QUESTIONS.filter(q => q.book === bid).length;
  info.innerHTML = `<strong>${BOOKS[bid].name}</strong> 共 ${BOOKS[bid].chapters.length} 章 · 题库 ${totalQ} 题 · 已选 ${stSelectedChapters.size} 章`;
  list.appendChild(info);
  // 全选按钮
  const allBtn = document.createElement('div');
  const allSelected = stSelectedChapters.size === BOOKS[bid].chapters.length;
  allBtn.className = 'chapter-item' + (allSelected ? ' selected' : '');
  allBtn.innerHTML = '<span><strong>全选该册所有章节</strong></span><span style="font-size:0.8rem;color:var(--text-light);">' + (allSelected ? '已全选' : '点击全选') + '</span>';
  allBtn.onclick = () => {
    if (stSelectedChapters.size === BOOKS[bid].chapters.length) {
      stSelectedChapters.clear();
    } else {
      BOOKS[bid].chapters.forEach((_, idx) => stSelectedChapters.add(bid + '_' + idx));
    }
    renderSTChapters(bid);
  };
  list.appendChild(allBtn);
  // 章节列表
  BOOKS[bid].chapters.forEach((ch, idx) => {
    const key = bid + '_' + idx;
    const qCount = QUESTIONS.filter(q => q.book === bid && q.chapter === ch).length;
    const item = document.createElement('div');
    item.className = 'chapter-item' + (stSelectedChapters.has(key) ? ' selected' : '');
    item.innerHTML = `<span>${ch}</span><span style="font-size:0.8rem;color:var(--text-light);">${qCount}题 ${stSelectedChapters.has(key) ? '✓' : '点击选择'}</span>`;
    item.onclick = () => {
      if (stSelectedChapters.has(key)) stSelectedChapters.delete(key);
      else stSelectedChapters.add(key);
      renderSTChapters(bid);
    };
    list.appendChild(item);
  });
}

function startSelfTest() {
  if (stSelectedChapters.size === 0) { alert('请至少选择一个章节'); return; }
  const count = parseInt(document.getElementById('stCount').value);
  let pool = QUESTIONS.filter(q => {
    const b = q.book;
    const cidx = BOOKS[b].chapters.indexOf(q.chapter);
    return stSelectedChapters.has(b + '_' + cidx);
  });
  if (pool.length === 0) { alert('所选章节暂无题目'); return; }
  if (pool.length > count) {
    pool = pool.sort(() => Math.random() - 0.5).slice(0, count);
  }
  selfTestState = { questions: pool, answers: new Array(pool.length).fill(-1), current: 0, submitted: false, timer: null, timeLeft: 0 };
  document.getElementById('selftest-setup').style.display = 'none';
  document.getElementById('selftest-quiz').style.display = 'block';
  document.getElementById('selftest-result').style.display = 'none';
  document.getElementById('stTotalNum').textContent = pool.length;
  renderSTQuestion();
}

function renderSTQuestion() {
  const idx = selfTestState.current;
  const q = selfTestState.questions[idx];
  document.getElementById('stCurrent').textContent = idx + 1;
  document.getElementById('stQuestion').textContent = q.question;
  const b = BOOKS[q.book];
  document.getElementById('stMeta').innerHTML = `<span class="tag tag-blue">${b.name}</span> <span class="tag tag-green">${q.chapter}</span> <span class="tag tag-purple">${q.difficulty==='easy'?'易':q.difficulty==='medium'?'中':'难'}</span>`;
  const opts = document.getElementById('stOptions');
  opts.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option-item';
    if (selfTestState.answers[idx] === i) div.classList.add('selected');
    if (selfTestState.submitted) {
      if (i === q.answer) div.classList.add('correct');
      else if (selfTestState.answers[idx] === i) div.classList.add('wrong');
    }
    div.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt}</span>`;
    if (!selfTestState.submitted) {
      div.onclick = () => { selfTestState.answers[idx] = i; renderSTQuestion(); };
    }
    opts.appendChild(div);
  });
  document.getElementById('stAnalysis').style.display = selfTestState.submitted ? 'block' : 'none';
  document.getElementById('stAnalysisText').textContent = q.analysis || '暂无解析';
  document.getElementById('stPrevBtn').disabled = idx === 0;
  document.getElementById('stNextBtn').style.display = idx === selfTestState.questions.length - 1 ? 'none' : 'inline-flex';
  document.getElementById('stSubmitBtn').style.display = idx === selfTestState.questions.length - 1 && !selfTestState.submitted ? 'inline-flex' : 'none';
  renderSTNav();
}

function renderSTNav() {
  const nav = document.getElementById('stNav');
  nav.innerHTML = '';
  selfTestState.questions.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'quiz-nav-dot' + (selfTestState.answers[i] !== -1 ? ' answered' : '') + (i === selfTestState.current ? ' current' : '');
    dot.textContent = i + 1;
    dot.onclick = () => { selfTestState.current = i; renderSTQuestion(); };
    nav.appendChild(dot);
  });
}

function stPrev() { if (selfTestState.current > 0) { selfTestState.current--; renderSTQuestion(); } }
function stNext() { if (selfTestState.current < selfTestState.questions.length - 1) { selfTestState.current++; renderSTQuestion(); } }

function stSubmit() {
  if (selfTestState.answers.includes(-1)) {
    if (!confirm('还有未答题目，确定提交吗？')) return;
  }
  selfTestState.submitted = true;
  let correct = 0, wrong = 0;
  selfTestState.questions.forEach((q, i) => {
    const ans = selfTestState.answers[i];
    if (ans === q.answer) correct++;
    else {
      wrong++;
      addWrongRecord(q, ans);
    }
  });
  updateProgress(correct, wrong);
  renderSTQuestion();
  showSTResult(correct, wrong);
}

function showSTResult(correct, wrong) {
  document.getElementById('selftest-quiz').style.display = 'none';
  document.getElementById('selftest-result').style.display = 'block';
  const total = selfTestState.questions.length;
  const score = Math.round(correct / total * 100);
  document.getElementById('stScore').textContent = score;
  document.getElementById('stResultTotal').textContent = total;
  document.getElementById('stResultCorrect').textContent = correct;
  document.getElementById('stResultWrong').textContent = wrong;
}

function showWrongInResult() {
  const list = document.getElementById('stResultWrongList');
  list.innerHTML = '';
  selfTestState.questions.forEach((q, i) => {
    if (selfTestState.answers[i] !== q.answer) {
      list.appendChild(createWrongCard(q, selfTestState.answers[i], 'result'));
    }
  });
}

function resetSelfTest() {
  document.getElementById('selftest-result').style.display = 'none';
  document.getElementById('stResultWrongList').innerHTML = '';
  initSelfTestSetup();
}

// ==================== REVIEW ====================
function initReview() {
  const sel = document.getElementById('rvBookSelector');
  sel.innerHTML = '';
  let first = true;
  for (const [bid, book] of Object.entries(BOOKS)) {
    const btn = document.createElement('button');
    btn.className = 'book-btn' + (first ? ' active' : '');
    btn.textContent = book.name;
    btn.onclick = () => {
      sel.querySelectorAll('.book-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderReviewGrid(bid);
    };
    sel.appendChild(btn);
    if (first) renderReviewGrid(bid);
    first = false;
  }
}

function renderReviewGrid(bid) {
  const grid = document.getElementById('rvKnowledgeGrid');
  grid.innerHTML = '';
  const data = KNOWLEDGE_DATA[bid];
  if (!data) return;
  for (const [ch, items] of Object.entries(data)) {
    const section = document.createElement('div');
    section.className = 'card';
    section.innerHTML = `<div class="card-title">${ch}</div><div class="grid-2" id="rv-grid-${bid}-${ch}"></div>`;
    grid.appendChild(section);
    const g = section.querySelector('.grid-2');
    items.forEach((item, idx) => {
      const key = bid + '|' + ch + '|' + idx;
      const status = (userProgress.knowledgeStatus || {})[key] || 'unknown';
      const card = document.createElement('div');
      card.className = 'knowledge-card';
      card.innerHTML = `
        <div class="card-status ${status}"></div>
        <h4>${item.title}</h4>
        <p>${item.content.substring(0, 60)}...</p>
      `;
      card.onclick = () => openKnowledgeModal(bid, ch, idx);
      g.appendChild(card);
    });
  }
}

function openKnowledgeModal(bid, ch, idx) {
  const item = KNOWLEDGE_DATA[bid][ch][idx];
  const key = bid + '|' + ch + '|' + idx;
  const status = (userProgress.knowledgeStatus || {})[key] || 'unknown';
  document.getElementById('modalTitle').textContent = item.title;
  document.getElementById('modalBody').innerHTML = `
    <p style="line-height:1.8;margin-bottom:20px;">${item.content}</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn ${status==='mastered'?'btn-success':'btn-outline'}" onclick="setKnowledgeStatus('${key}','mastered')">已掌握</button>
      <button class="btn ${status==='learning'?'btn-secondary':'btn-outline'}" onclick="setKnowledgeStatus('${key}','learning')">学习中</button>
      <button class="btn ${status==='unknown'?'btn-danger':'btn-outline'}" onclick="setKnowledgeStatus('${key}','unknown')">未掌握</button>
    </div>
  `;
  document.getElementById('modal').classList.add('active');
}

function setKnowledgeStatus(key, status) {
  if (!userProgress.knowledgeStatus) userProgress.knowledgeStatus = {};
  userProgress.knowledgeStatus[key] = status;
  saveData();
  closeModal();
  const activeBtn = document.querySelector('#rvBookSelector .active');
  if (activeBtn) {
    const bid = Object.keys(BOOKS).find(b => BOOKS[b].name === activeBtn.textContent);
    if (bid) renderReviewGrid(bid);
  }
}

function closeModal() { document.getElementById('modal').classList.remove('active'); }

// ==================== WRONG BOOK ====================
function renderWrongBook() {
  const bookFilter = document.getElementById('wbFilterBook').value;
  const reasonFilter = document.getElementById('wbFilterReason').value;
  const list = document.getElementById('wrongBookList');
  list.innerHTML = '';
  const filtered = wrongRecords.filter(r => {
    if (r.isEliminated) return false;
    const q = findQuestion(r.questionId);
    if (!q) return false;
    if (bookFilter && q.book !== bookFilter) return false;
    if (reasonFilter && !(r.reasonTags || []).includes(reasonFilter)) return false;
    return true;
  });
  if (filtered.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--text-light);padding:40px;">暂无错题，快去练习吧！</div>';
    return;
  }
  filtered.forEach(r => {
    const q = findQuestion(r.questionId);
    if (!q) return;
    list.appendChild(createWrongCard(q, r.wrongAnswer, 'book', r));
  });
}

function createWrongCard(q, wrongAnswer, context, record) {
  const div = document.createElement('div');
  div.className = 'wq-item';
  const letters = ['A','B','C','D'];
  const reasons = record && record.reasonTags ? record.reasonTags.join(' ') : '';
  div.innerHTML = `
    <div class="wq-header">
      <div class="wq-title">${q.question}</div>
      <div class="wq-actions">
        <span class="tag tag-red">错选：${letters[wrongAnswer] || '-'}</span>
        <span class="tag tag-green">正确答案：${letters[q.answer]}</span>
      </div>
    </div>
    <div style="font-size:0.85rem;color:var(--text-light);margin-bottom:8px;">
      ${BOOKS[q.book].name} · ${q.chapter}
      ${reasons ? '<span class="tag tag-orange" style="margin-left:8px;">' + reasons + '</span>' : ''}
    </div>
    <div style="margin-bottom:10px;">
      ${q.options.map((o,i) => `<span style="margin-right:12px;font-size:0.85rem;${i===q.answer?'color:var(--success);font-weight:600;':i===wrongAnswer?'color:var(--danger);':''}">${letters[i]}. ${o}</span>`).join('')}
    </div>
    ${q.analysis ? '<div style="background:var(--primary-light);padding:10px;border-radius:6px;font-size:0.85rem;margin-bottom:10px;"><strong>解析：</strong>' + q.analysis + '</div>' : ''}
    <div style="display:flex;gap:8px;">
      ${context === 'book' ? `
        <select class="form-select" style="width:120px;" onchange="setWrongReason('${record.questionId}',this.value)">
          <option value="">标记原因</option>
          <option value="概念模糊" ${(record.reasonTags||[]).includes('概念模糊')?'selected':''}>概念模糊</option>
          <option value="读图失误" ${(record.reasonTags||[]).includes('读图失误')?'selected':''}>读图失误</option>
          <option value="记忆偏差" ${(record.reasonTags||[]).includes('记忆偏差')?'selected':''}>记忆偏差</option>
          <option value="审题不慎" ${(record.reasonTags||[]).includes('审题不慎')?'selected':''}>审题不慎</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="practiceSingleWrong('${q.id}')">重练此题</button>
        <button class="btn btn-success btn-sm" onclick="eliminateWrong('${q.id}')">消灭</button>
      ` : ''}
    </div>
  `;
  return div;
}

function setWrongReason(qid, reason) {
  if (!reason) return;
  const r = wrongRecords.find(w => w.questionId === qid && !w.isEliminated);
  if (r) {
    if (!r.reasonTags) r.reasonTags = [];
    if (!r.reasonTags.includes(reason)) r.reasonTags.push(reason);
    saveData();
    renderWrongBook();
  }
}

function eliminateWrong(qid) {
  const r = wrongRecords.find(w => w.questionId === qid && !w.isEliminated);
  if (r) { r.isEliminated = true; saveData(); renderWrongBook(); updateStats(); }
}

function startWrongPractice() {
  const pool = wrongRecords.filter(r => !r.isEliminated).map(r => findQuestion(r.questionId)).filter(q => q);
  if (pool.length === 0) { alert('暂无需消灭的错题'); return; }
  const limit = Math.min(pool.length, 20);
  const selected = pool.sort(() => Math.random() - 0.5).slice(0, limit);
  wrongPracticeState = { questions: selected, answers: new Array(selected.length).fill(-1), current: 0, submitted: false };
  // Reuse self test UI
  selfTestState = { questions: selected, answers: new Array(selected.length).fill(-1), current: 0, submitted: false, timer: null, timeLeft: 0 };
  document.getElementById('selftest-setup').style.display = 'none';
  document.getElementById('selftest-quiz').style.display = 'block';
  document.getElementById('selftest-result').style.display = 'none';
  document.getElementById('stTotalNum').textContent = selected.length;
  renderSTQuestion();
}

function practiceSingleWrong(qid) {
  const q = findQuestion(qid);
  if (!q) return;
  selfTestState = { questions: [q], answers: [-1], current: 0, submitted: false, timer: null, timeLeft: 0 };
  document.getElementById('selftest-setup').style.display = 'none';
  document.getElementById('selftest-quiz').style.display = 'block';
  document.getElementById('selftest-result').style.display = 'none';

// ==================== SIMULATE ====================
function initSimulate() {
  document.getElementById('sim-setup').style.display = 'block';
  document.getElementById('sim-quiz').style.display = 'none';
  document.getElementById('sim-result').style.display = 'none';
}

function startSimulate() {
  const range = document.getElementById('simRange').value;
  const count = parseInt(document.getElementById('simCount').value);
  const time = parseInt(document.getElementById('simTime').value);
  const diff = document.getElementById('simDifficulty').value;
  let pool = range === 'all' ? QUESTIONS : QUESTIONS.filter(q => q.book === range);
  if (pool.length === 0) { alert('所选范围暂无题目'); return; }
  // Difficulty distribution
  if (diff === 'mixed') {
    const easy = pool.filter(q => q.difficulty === 'easy');
    const medium = pool.filter(q => q.difficulty === 'medium');
    const hard = pool.filter(q => q.difficulty === 'hard');
    const eCount = Math.floor(count * 0.5);
    const mCount = Math.floor(count * 0.3);
    const hCount = count - eCount - mCount;
    let selected = [];
    selected = selected.concat(easy.sort(() => Math.random() - 0.5).slice(0, eCount));
    selected = selected.concat(medium.sort(() => Math.random() - 0.5).slice(0, mCount));
    selected = selected.concat(hard.sort(() => Math.random() - 0.5).slice(0, hCount));
    if (selected.length < count) {
      const rest = pool.filter(q => !selected.includes(q)).sort(() => Math.random() - 0.5).slice(0, count - selected.length);
      selected = selected.concat(rest);
    }
    pool = selected.sort(() => Math.random() - 0.5);
  } else {
    pool = pool.filter(q => diff === 'easy' ? q.difficulty === 'easy' : diff === 'hard' ? q.difficulty === 'hard' : q.difficulty === 'medium').sort(() => Math.random() - 0.5).slice(0, count);
  }
  if (pool.length < count) {
    alert('题库数量不足，已抽取' + pool.length + '题');
  }
  simState = { questions: pool, answers: new Array(pool.length).fill(-1), current: 0, submitted: false, timer: null, timeLeft: time * 60, totalTime: time * 60 };
  document.getElementById('sim-setup').style.display = 'none';
  document.getElementById('sim-quiz').style.display = 'block';
  document.getElementById('sim-result').style.display = 'none';
  document.getElementById('simTotalNum').textContent = pool.length;
  startSimTimer();
  renderSimQuestion();
}

function startSimTimer() {
  simState.timer = setInterval(() => {
    simState.timeLeft--;
    const m = Math.floor(simState.timeLeft / 60);
    const s = simState.timeLeft % 60;
    const timerEl = document.getElementById('simTimer');
    timerEl.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    if (simState.timeLeft <= 300) timerEl.classList.add('warning');
    if (simState.timeLeft <= 0) { clearInterval(simState.timer); simSubmit(); }
  }, 1000);
}

function renderSimQuestion() {
  const idx = simState.current;
  const q = simState.questions[idx];
  document.getElementById('simCurrent').textContent = idx + 1;
  const progress = ((idx + 1) / simState.questions.length * 100);
  document.getElementById('simProgress').style.width = progress + '%';
  document.getElementById('simQuestion').textContent = q.question;
  const b = BOOKS[q.book];
  document.getElementById('simMeta').innerHTML = `<span class="tag tag-blue">${b.name}</span> <span class="tag tag-green">${q.chapter}</span>`;
  const opts = document.getElementById('simOptions');
  opts.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option-item' + (simState.answers[idx] === i ? ' selected' : '');
    div.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt}</span>`;
    div.onclick = () => { simState.answers[idx] = i; renderSimQuestion(); };
    opts.appendChild(div);
  });
  document.getElementById('simPrevBtn').disabled = idx === 0;
  document.getElementById('simNextBtn').style.display = idx === simState.questions.length - 1 ? 'none' : 'inline-flex';
  document.getElementById('simSubmitBtn').style.display = idx === simState.questions.length - 1 ? 'inline-flex' : 'none';
  renderSimNav();
}

function renderSimNav() {
  const nav = document.getElementById('simNav');
  nav.innerHTML = '';
  simState.questions.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'quiz-nav-dot' + (simState.answers[i] !== -1 ? ' answered' : '') + (i === simState.current ? ' current' : '');
    dot.textContent = i + 1;
    dot.onclick = () => { simState.current = i; renderSimQuestion(); };
    nav.appendChild(dot);
  });
}

function simPrev() { if (simState.current > 0) { simState.current--; renderSimQuestion(); } }
function simNext() { if (simState.current < simState.questions.length - 1) { simState.current++; renderSimQuestion(); } }

function simSubmit() {
  if (simState.timer) clearInterval(simState.timer);
  if (simState.answers.includes(-1)) {
    if (!confirm('还有未答题目，确定交卷吗？')) return;
  }
  simState.submitted = true;
  let correct = 0, wrong = 0;
  simState.questions.forEach((q, i) => {
    const ans = simState.answers[i];
    if (ans === q.answer) correct++;
    else { wrong++; addWrongRecord(q, ans); }
  });
  updateProgress(correct, wrong);
  showSimResult(correct, wrong);
}

function showSimResult(correct, wrong) {
  document.getElementById('sim-quiz').style.display = 'none';
  document.getElementById('sim-result').style.display = 'block';
  const total = simState.questions.length;
  const score = Math.round(correct / total * 100);
  document.getElementById('simScore').textContent = score;
  document.getElementById('simResultTotal').textContent = total;
  document.getElementById('simResultCorrect').textContent = correct;
  document.getElementById('simResultWrong').textContent = wrong;
  const used = simState.totalTime - simState.timeLeft;
  const um = Math.floor(used / 60), us = used % 60;
  document.getElementById('simResultTime').textContent = `用时：${um}分${us}秒`;
}

function showSimWrong() {
  const list = document.getElementById('simResultWrongList');
  list.innerHTML = '';
  simState.questions.forEach((q, i) => {
    if (simState.answers[i] !== q.answer) {
      list.appendChild(createWrongCard(q, simState.answers[i], 'result'));
    }
  });
}

function resetSimulate() {
  document.getElementById('sim-result').style.display = 'none';
  document.getElementById('simResultWrongList').innerHTML = '';
  initSimulate();
}

// ==================== HELPERS ====================
function findQuestion(id) {
  return QUESTIONS.find(q => q.id === id) || CUSTOM_QUESTIONS.find(q => q.id === id);
}

function addWrongRecord(q, wrongAnswer) {
  if (wrongAnswer === -1) return;
  let r = wrongRecords.find(w => w.questionId === q.id && !w.isEliminated);
  if (r) {
    r.wrongCount++;
    r.lastWrongAt = new Date().toISOString();
    if (r.wrongAnswer !== wrongAnswer) r.wrongAnswer = wrongAnswer;
  } else {
    wrongRecords.push({
      questionId: q.id,
      wrongAnswer: wrongAnswer,
      wrongCount: 1,
      reasonTags: [],
      firstWrongAt: new Date().toISOString(),
      lastWrongAt: new Date().toISOString(),
      isEliminated: false
    });
  }
  saveData();
  updateStats();
}

function updateProgress(correct, wrong) {
  userProgress.totalAnswered += correct + wrong;
  userProgress.totalCorrect += correct;
  const today = getToday();
  if (!userProgress.dailyStats[today]) userProgress.dailyStats[today] = { answered: 0, correct: 0 };
  userProgress.dailyStats[today].answered += correct + wrong;
  userProgress.dailyStats[today].correct += correct;
  // Update chapter progress
  const currentQuestions = currentPage === 'selftest' ? selfTestState.questions : simState.questions;
  currentQuestions.forEach((q, i) => {
    const ans = currentPage === 'selftest' ? selfTestState.answers[i] : simState.answers[i];
    const cidx = BOOKS[q.book].chapters.indexOf(q.chapter);
    const key = q.book + '_' + cidx;
    if (!userProgress.chapterProgress[key]) userProgress.chapterProgress[key] = { answered: 0, correct: 0, total: 0 };
    userProgress.chapterProgress[key].answered++;
    userProgress.chapterProgress[key].total = Math.max(userProgress.chapterProgress[key].total, QUESTIONS.filter(qq => qq.book === q.book && qq.chapter === q.chapter).length);
    if (ans === q.answer) userProgress.chapterProgress[key].correct++;
    userProgress.chapterProgress[key].rate = userProgress.chapterProgress[key].correct / userProgress.chapterProgress[key].answered;
  });
  saveData();
}
