  { id:"q_7a_01_06", question:"世界上海陆变迁的主要原因是", options:[,"地壳的变动和海平面的升降","全球气候变暖","填海造陆"], answer:1, book:"7a", chapter:"陆地和海洋", tags:["海陆变迁"], difficulty:"easy", analysis:"地壳的变动和海平面的升降是造成海陆变迁的主要原因，人类活动只是次要原因。"},
  { id:"q_7a_01_07", question:"世界上火山地震多分布在", options:[,"板块交界处","大陆内部","海洋中部"], answer:1, book:"7a", chapter:"陆地和海洋", tags:["板块构造"], difficulty:"easy", analysis:"板块交界处地壳活跃，多火山地震；板块内部地壳相对稳定。"},
  { id:"q_7a_01_08", question:"喜马拉雅山脉的形成是由于", options:[,"印度洋板块与亚欧板块碰撞","太平洋板块与亚欧板块碰撞","美洲板块与太平洋板块碰撞"], answer:1, book:"7a", chapter:"陆地和海洋", tags:["板块构造","山脉"], difficulty:"medium", analysis:"喜马拉雅山脉是由印度洋板块与亚欧板块碰撞挤压隆起形成的。"},
  { id:"q_7a_01_09", question:"大西洋位于哪两个板块之间", options:[,"美洲板块与非洲板块、亚欧板块","太平洋板块与美洲板块","印度洋板块与太平洋板块"], answer:1, book:"7a", chapter:"陆地和海洋", tags:["板块构造","大洋"], difficulty:"medium", analysis:"大西洋位于美洲板块与非洲板块、亚欧板块之间，正处于板块张裂地带，面积在不断扩大。"},
  { id:"q_7a_01_10", question:"东非大裂谷的形成原因是", options:[,"板块张裂拉伸","火山喷发","冰川侵蚀"], answer:1, book:"7a", chapter:"陆地和海洋", tags:["板块构造"], difficulty:"medium", analysis:"东非大裂谷是非洲板块内部张裂形成的，未来可能发展成新的大洋。"},
  { id:"q_7a_01_11", question:"下列大洲中，赤道穿过中部的是", options:[,"南美洲","非洲","大洋洲"], answer:2, book:"7a", chapter:"陆地和海洋", tags:["七大洲"], difficulty:"easy", analysis:"赤道穿过非洲中部，因此非洲有'热带大陆'之称。"},
  { id:"q_7a_01_12", question:"世界上最大的岛屿是", options:[,"格陵兰岛","马达加斯加岛","海南岛"], answer:1, book:"7a", chapter:"陆地和海洋", tags:["岛屿"], difficulty:"easy", analysis:"格陵兰岛面积约216万平方千米，是世界上最大的岛屿。"},

  // 七年级上 - 天气与气候
  { id:"q_7a_02_01", question:"下列描述中，属于天气现象的是", options:[,"极地地区终年严寒","明天多云转晴","热带雨林终年高温多雨"], answer:2, book:"7a", chapter:"天气与气候", tags:["天气与气候"], difficulty:"easy", analysis:"天气是短时间内的大气状况，如晴、雨、多云等；气候是多年的平均状况。"},
  { id:"q_7a_02_02", question:"一天中最高气温一般出现在", options:[,"中午12时","午后2时左右","日落前后"], answer:2, book:"7a", chapter:"天气与气候", tags:["气温"], difficulty:"easy", analysis:"一天中最高气温出现在午后2时左右，最低气温出现在日出前后。"},
  { id:"q_7a_02_03", question:"北半球陆地月平均气温最高出现在", options:[,"7月","2月","8月"], answer:1, book:"7a", chapter:"天气与气候", tags:["气温"], difficulty:"easy", analysis:"北半球陆地最热月是7月，最冷月是1月（海洋分别是8月和2月）。"},
  { id:"q_7a_02_04", question:"世界气温分布的一般规律是", options:[,"从高纬度向低纬度递减","从沿海向内陆递增","从内陆向沿海递减"], answer:0, book:"7a", chapter:"天气与气候", tags:["气温分布"], difficulty:"easy", analysis:"受太阳辐射影响，世界气温从低纬度向高纬度递减。"},
  { id:"q_7a_02_05", question:"下列地区中，降水最多的是", options:[,"回归线附近大陆西岸","两极地区","中纬度大陆内部"], answer:0, book:"7a", chapter:"天气与气候", tags:["降水分布"], difficulty:"easy", analysis:"赤道附近终年受热，空气膨胀上升，形成对流雨，降水丰富。"},
  { id:"q_7a_02_06", question:"影响气候的主要因素不包括", options:[,"海陆位置","地形","宗教信仰"], answer:3, book:"7a", chapter:"天气与气候", tags:["气候因素"], difficulty:"easy", analysis:"影响气候的主要因素有纬度位置、海陆位置、地形、洋流等，与宗教信仰无关。"},
  { id:"q_7a_02_07", question:"地中海气候的特征是", options:[,"夏季高温多雨，冬季寒冷干燥","夏季炎热干燥，冬季温和多雨","全年温和湿润"], answer:2, book:"7a", chapter:"天气与气候", tags:["气候类型"], difficulty:"medium", analysis:"地中海气候受副热带高气压带和西风带交替控制，夏季炎热干燥，冬季温和多雨。"},
  { id:"q_7a_02_08", question:"温带海洋性气候主要分布在", options:[,"大陆西岸","大陆内部","赤道附近"], answer:1, book:"7a", chapter:"天气与气候", tags:["气候类型"], difficulty:"medium", analysis:"温带海洋性气候主要分布在中纬度大陆西岸，如欧洲西部，终年受西风影响。"},
  { id:"q_7a_02_09", question:"热带季风气候主要分布在", options:[,"非洲北部","南美洲亚马孙平原","欧洲西部"], answer:0, book:"7a", chapter:"天气与气候", tags:["气候类型"], difficulty:"medium", analysis:"热带季风气候主要分布在亚洲的中南半岛和印度半岛，受季风影响，分旱雨两季。"},
  { id:"q_7a_02_10", question:"青藏高原纬度较低但气候寒冷，主要影响因素是", options:[,"海陆位置","地形","洋流"], answer:2, book:"7a", chapter:"天气与气候", tags:["气候因素","地形"], difficulty:"medium", analysis:"青藏高原海拔高（平均4000米以上），气温随海拔升高而降低，因此气候寒冷。"},
  { id:"q_7a_02_11", question:"被称为'地球之肺'的是", options:[,"热带草原","温带森林","亚寒带针叶林"], answer:0, book:"7a", chapter:"天气与气候", tags:["热带雨林"], difficulty:"easy", analysis:"亚马孙热带雨林通过光合作用吸收大量二氧化碳，释放氧气，被称为'地球之肺'。"},
  { id:"q_7a_02_12", question:"下列气候类型中，降水季节变化最大的是", options:[,"温带海洋性气候","热带季风气候","地中海气候"], answer:2, book:"7a", chapter:"天气与气候", tags:["气候类型"], difficulty:"medium", analysis:"热带季风气候分明显的旱季和雨季，降水季节变化最大，年降水量可达1500-2000毫米。"},

  // 七年级上 - 居民与聚落
  { id:"q_7a_03_01", question:"世界人口分布最稠密的地区是", options:[,"干旱的沙漠地区","亚洲东部和南部","寒冷的极地地区"], answer:2, book:"7a", chapter:"居民与聚落", tags:["人口分布"], difficulty:"easy", analysis:"亚洲东部和南部自然条件优越，农业发展历史悠久，人口稠密。"},
  { id:"q_7a_03_02", question:"下列地区中，人口稀疏的是", options:[,"亚洲东部","青藏高原","北美洲东部"], answer:2, book:"7a", chapter:"居民与聚落", tags:["人口分布"], difficulty:"easy", analysis:"青藏高原海拔高、气候寒冷、空气稀薄，不适宜人类居住，人口稀疏。"},
  { id:"q_7a_03_03", question:"人口增长过快带来的问题不包括", options:[,"资源紧张","劳动力短缺","环境恶化"], answer:2, book:"7a", chapter:"居民与聚落", tags:["人口问题"], difficulty:"easy", analysis:"劳动力短缺是人口增长过慢带来的问题，不是过快。"},
  { id:"q_7a_03_04", question:"世界上使用人数最多的语言是", options:[,"汉语","西班牙语","阿拉伯语"], answer:1, book:"7a", chapter:"居民与聚落", tags:["语言"], difficulty:"easy", analysis:"汉语是世界上使用人数最多的语言，英语是世界上使用范围最广的语言。"},
  { id:"q_7a_03_05", question:"世界上信徒最多的宗教是", options:[,"佛教","基督教","道教"], answer:2, book:"7a", chapter:"居民与聚落", tags:["宗教"], difficulty:"easy", analysis:"基督教是世界上信徒最多、流传最广的宗教。"},
  { id:"q_7a_03_06", question:"伊斯兰教的发源地是", options:[,"阿拉伯半岛","中国","欧洲"], answer:1, book:"7a", chapter:"居民与聚落", tags:["宗教"], difficulty:"easy", analysis:"伊斯兰教起源于7世纪的阿拉伯半岛，创始人是穆罕默德。"},
  { id:"q_7a_03_07", question:"聚落的形成与发展的有利条件不包括", options:[,"水源充足","交通便利","气候寒冷"], answer:3, book:"7a", chapter:"居民与聚落", tags:["聚落"], difficulty:"easy", analysis:"气候寒冷不利于人类居住和农业生产，不是聚落形成的有利条件。"},
  { id:"q_7a_03_08", question:"下列民居中，适应湿热气候的是", options:[,"窑洞","高脚屋","四合院"], answer:2, book:"7a", chapter:"居民与聚落", tags:["民居","气候"], difficulty:"medium", analysis:"高脚屋底层架空，利于通风防潮，适应热带雨林或热带季风气候的湿热环境。"},
  { id:"q_7a_03_09", question:"世界上黑种人的故乡是", options:[,"欧洲西部","撒哈拉以南非洲","大洋洲"], answer:2, book:"7a", chapter:"居民与聚落", tags:["人种"], difficulty:"easy", analysis:"撒哈拉以南非洲是黑种人的故乡，有'黑非洲'之称。"},
  { id:"q_7a_03_10", question:"城市聚落与乡村聚落的本质区别是", options:[,"人口多少不同","生产方式不同","道路宽窄不同"], answer:2, book:"7a", chapter:"居民与聚落", tags:["聚落"], difficulty:"medium", analysis:"城市以非农业生产（工业、服务业）为主，乡村以农业生产为主，这是本质区别。"},

  // 七年级上 - 发展与合作
  { id:"q_7a_04_01", question:"世界上最大的发展中国家是", options:[,"巴西","中国","俄罗斯"], answer:2, book:"7a", chapter:"发展与合作", tags:["发展中国家"], difficulty:"easy", analysis:"中国是世界上最大的发展中国家。"},
  { id:"q_7a_04_02", question:"发达国家主要分布在", options:[,"欧洲、北美洲、大洋洲","非洲、南极洲","南美洲、大洋洲"], answer:1, book:"7a", chapter:"发展与合作", tags:["发达国家"], difficulty:"easy", analysis:"发达国家主要分布在欧洲、北美洲、大洋洲，如美国、日本、德国、澳大利亚等。"},
  { id:"q_7a_04_03", question:"国际上习惯把发展中国家之间的合作称为", options:[,"南南合作","东西合作","北北合作"], answer:1, book:"7a", chapter:"发展与合作", tags:["国际合作"], difficulty:"easy", analysis:"发展中国家多在南半球及北半球南部，称为'南方国家'，它们之间的合作叫'南南合作'。"},
  { id:"q_7a_04_04", question:"世界贸易组织的英文缩写是", options:[,"WTO","EU","APEC"], answer:1, book:"7a", chapter:"发展与合作", tags:["国际组织"], difficulty:"easy", analysis:"WTO是世界贸易组织(World Trade Organization)的缩写。UN是联合国，EU是欧盟，APEC是亚太经合组织。"},
  { id:"q_7a_04_05", question:"联合国总部设在", options:[,"瑞士日内瓦","法国巴黎","英国伦敦"], answer:0, book:"7a", chapter:"发展与合作", tags:["国际组织"], difficulty:"easy", analysis:"联合国总部设在美国纽约。"},

  // 七年级下 - 我们生活的大洲——亚洲
  { id:"q_7b_00_01", question:"亚洲是世界上", options:[,"面积最大的大洲","热带面积最广的大洲","平均气温最高的大洲"], answer:1, book:"7b", chapter:"我们生活的大洲——亚洲", tags:["亚洲概况"], difficulty:"easy", analysis:"亚洲面积约4400万平方千米，是世界上面积最大的大洲。"},
  { id:"q_7b_00_02", question:"亚洲地势的特点是", options:[,"中部高、四周低","西高东低","东高西低"], answer:1, book:"7b", chapter:"我们生活的大洲——亚洲", tags:["亚洲地形"], difficulty:"easy", analysis:"亚洲地形以高原、山地为主，地势中部高、四周低。"},
  { id:"q_7b_00_03", question:"亚洲河流流向的特点是", options:[,"自东向西流","从中部呈放射状流向四周","从四周流向中部"], answer:2, book:"7b", chapter:"我们生活的大洲——亚洲", tags:["亚洲河流"], difficulty:"easy", analysis:"受地势中部高、四周低的影响，亚洲大河多发源于中部高原山地，呈放射状流向四周。"},
  { id:"q_7b_00_04", question:"亚洲气候的特点是", options:[,"气候复杂多样，季风气候显著","热带草原气候广布","寒带气候为主"], answer:1, book:"7b", chapter:"我们生活的大洲——亚洲", tags:["亚洲气候"], difficulty:"easy", analysis:"亚洲地跨寒、温、热三带，地形复杂，气候复杂多样；东临太平洋，季风气候显著。"},
  { id:"q_7b_00_05", question:"世界上最高的高原是", options:[,"青藏高原","埃塞俄比亚高原","蒙古高原"], answer:1, book:"7b", chapter:"我们生活的大洲——亚洲", tags:["亚洲地形"], difficulty:"easy", analysis:"青藏高原平均海拔4000米以上，是世界上海拔最高的高原，有'世界屋脊'之称。"},

  // 七年级下 - 我们邻近的地区和国家
  { id:"q_7b_01_01", question:"日本多火山地震的原因是", options:[,"位于板块交界处","填海造陆","过度开采矿产"], answer:1, book:"7b", chapter:"我们邻近的地区和国家", tags:["日本","板块"], difficulty:"easy", analysis:"日本位于亚欧板块与太平洋板块交界处，地壳活跃，多火山地震。"},
  { id:"q_7b_01_02", question:"日本工业主要分布在", options:[,"太平洋沿岸和濑户内海沿岸","北海道岛","日本中部山地"], answer:1, book:"7b", chapter:"我们邻近的地区和国家", tags:["日本","工业"], difficulty:"medium", analysis:"日本工业主要分布在太平洋沿岸和濑户内海沿岸，便于进口原料和出口产品。"},
  { id:"q_7b_01_03", question:"东南亚'十字路口'的咽喉是", options:[,"马六甲海峡","白令海峡","英吉利海峡"], answer:1, book:"7b", chapter:"我们邻近的地区和国家", tags:["东南亚","海峡"], difficulty:"easy", analysis:"马六甲海峡是连接太平洋与印度洋的重要海上通道，是东南亚'十字路口'的咽喉。"},
  { id:"q_7b_01_04", question:"东南亚是世界上哪些热带作物的重要产地", options:[,"天然橡胶、油棕、椰子","苹果、葡萄","甜菜、亚麻"], answer:1, book:"7b", chapter:"我们邻近的地区和国家", tags:["东南亚","农业"], difficulty:"easy", analysis:"东南亚气候湿热，是世界天然橡胶、油棕、椰子、蕉麻的最大产地。"},
  { id:"q_7b_01_05", question:"印度的主要气候类型是", options:[,"热带季风气候","热带沙漠气候","亚热带季风气候"], answer:1, book:"7b", chapter:"我们邻近的地区和国家", tags:["印度","气候"], difficulty:"easy", analysis:"印度大部分地区属于热带季风气候，全年高温，分旱雨两季。"},
  { id:"q_7b_01_06", question:"印度软件外包产业发达，被称为", options:[,"世界办公室","世界加油站","世界面包篮"], answer:1, book:"7b", chapter:"我们邻近的地区和国家", tags:["印度","产业"], difficulty:"easy", analysis:"印度软件外包产业发达，承接了全球大量软件外包业务，被称为'世界办公室'。"},
  { id:"q_7b_01_07", question:"俄罗斯最重要的运输方式是", options:[,"铁路","公路","航空"], answer:1, book:"7b", chapter:"我们邻近的地区和国家", tags:["俄罗斯","交通"], difficulty:"easy", analysis:"俄罗斯国土辽阔，铁路运输是最重要的运输方式，西伯利亚大铁路横贯东西。"},
  { id:"q_7b_01_08", question:"俄罗斯在世界上占有重要地位的产业是", options:[,"食品工业","核工业和航空航天工业","电子工业"], answer:2, book:"7b", chapter:"我们邻近的地区和国家", tags:["俄罗斯","工业"], difficulty:"medium", analysis:"俄罗斯重工业发达，核工业和航空航天工业在世界上占有重要地位，但轻工业相对薄弱。"},

  // 七年级下 - 东半球其他的地区和国家
  { id:"q_7b_02_01", question:"中东地区最丰富的矿产资源是", options:[,"铁矿","石油","金矿"], answer:2, book:"7b", chapter:"东半球其他的地区和国家", tags:["中东","石油"], difficulty:"easy", analysis:"中东是世界上石油储量最大、产量最高和输出量最多的地区，石油主要分布在波斯湾及其沿岸。"},
  { id:"q_7b_02_02", question:"中东地区大多数居民信奉的宗教是", options:[,"佛教","伊斯兰教","犹太教"], answer:2, book:"7b", chapter:"东半球其他的地区和国家", tags:["中东","宗教"], difficulty:"easy", analysis:"中东是伊斯兰教、基督教和犹太教的发源地，大多数居民信奉伊斯兰教。"},
  { id:"q_7b_02_03", question:"欧洲西部最典型的气候类型是", options:[,"温带海洋性气候","温带大陆性气候","亚热带季风气候"], answer:1, book:"7b", chapter:"东半球其他的地区和国家", tags:["欧洲西部","气候"], difficulty:"easy", analysis:"欧洲西部位于中纬度大陆西岸，终年受西风影响，温带海洋性气候分布最广。"},
  { id:"q_7b_02_04", question:"欧洲西部畜牧业发达的主要原因是", options:[,"气候温和湿润，适合多汁牧草生长","地形崎岖，耕地少","人们喜好吃肉"], answer:1, book:"7b", chapter:"东半球其他的地区和国家", tags:["欧洲西部","畜牧业"], difficulty:"medium", analysis:"温带海洋性气候终年温和湿润，日照少，适合多汁牧草生长，因此畜牧业发达。"},
  { id:"q_7b_02_05", question:"撒哈拉以南非洲面临的三大问题是", options:[,"人口、粮食、环境","战争、疾病、贫困","教育、医疗、住房"], answer:1, book:"7b", chapter:"东半球其他的地区和国家", tags:["非洲","人口粮食环境"], difficulty:"easy", analysis:"撒哈拉以南非洲人口增长快，粮食短缺，过度开垦导致环境恶化，人口、粮食、环境是三大问题。"},
  { id:"q_7b_02_06", question:"澳大利亚被称为'骑在羊背上的国家'是因为", options:[,"羊毛产量和出口量居世界前列","羊肉最好吃","羊的种类最多"], answer:1, book:"7b", chapter:"东半球其他的地区和国家", tags:["澳大利亚","畜牧业"], difficulty:"easy", analysis:"澳大利亚羊毛产量和出口量居世界前列，因此被称为'骑在羊背上的国家'。"},
  { id:"q_7b_02_07", question:"澳大利亚古老生物众多的原因是", options:[,"长期孤立于南半球海洋中","没有天敌","食物丰富"], answer:1, book:"7b", chapter:"东半球其他的地区和国家", tags:["澳大利亚","生物"], difficulty:"medium", analysis:"澳大利亚长期孤立于南半球海洋中，生物进化缓慢，保留了许多古老物种，如袋鼠、考拉、鸭嘴兽等。"},

  // 七年级下 - 西半球的国家
  { id:"q_7b_03_01", question:"美国领土除本土外，还包括", options:[,"佛罗里达州","得克萨斯州","加利福尼亚州"], answer:0, book:"7b", chapter:"西半球的国家", tags:["美国","领土"], difficulty:"easy", analysis:"美国领土包括本土48个州，以及海外的阿拉斯加州和夏威夷州。"},
  { id:"q_7b_03_02", question:"美国农业的特点是", options:[,"地区专业化、机械化、商品化程度高","精耕细作","以人力为主"], answer:1, book:"7b", chapter:"西半球的国家", tags:["美国","农业"], difficulty:"easy", analysis:"美国农业实现了地区专业化（形成农业带）、机械化（使用大型机械）和商品化（产品大量出口）。"},
  { id:"q_7b_03_03", question:"世界最大的热带雨林区位于", options:[,"东南亚马来群岛","南美洲亚马孙平原","澳大利亚东北部"], answer:2, book:"7b", chapter:"西半球的国家", tags:["巴西","热带雨林"], difficulty:"easy", analysis:"亚马孙平原位于巴西境内，分布着世界最大的热带雨林区，占世界热带雨林面积的一半以上。"},
  { id:"q_7b_03_04", question:"巴西人口和城市主要分布在", options:[,"巴西高原北部","东南沿海地区","西部内陆"], answer:2, book:"7b", chapter:"西半球的国家", tags:["巴西","人口分布"], difficulty:"medium", analysis:"巴西东南沿海地区气候温和、交通便利、开发历史悠久，是人口和城市的主要分布区。"},
  { id:"q_7b_03_05", question:"巴西的首都是", options:[,"里约热内卢","巴西利亚","萨尔瓦多"], answer:2, book:"7b", chapter:"西半球的国家", tags:["巴西","首都"], difficulty:"easy", analysis:"巴西利亚是巴西的首都，是一座新建的城市，1960年从里约热内卢迁都至此。"},

  // 七年级下 - 极地地区
  { id:"q_7b_04_01", question:"南极地区的气候特征是", options:[,"温暖、湿润、无风","炎热、干燥","温和、多雨"], answer:0, book:"7b", chapter:"极地地区", tags:["南极","气候"], difficulty:"easy", analysis:"南极地区纬度高、海拔高、冰雪覆盖，形成酷寒、干燥、烈风的气候特征。"},
  { id:"q_7b_04_02", question:"到南极地区进行科学考察的最佳时间是", options:[,"6月至8月","9月至11月","11月至次年3月"], answer:3, book:"7b", chapter:"极地地区", tags:["南极","科考"], difficulty:"medium", analysis:"11月至次年3月是南极的暖季，有极昼现象，是科学考察的最佳时间。"},
  { id:"q_7b_04_03", question:"南极地区的代表性动物是", options:[,"企鹅","海豹","海象"], answer:1, book:"7b", chapter:"极地地区", tags:["南极","动物"], difficulty:"easy", analysis:"企鹅是南极地区的代表性动物。北极熊是北极地区的代表性动物。"},
  { id:"q_7b_04_04", question:"北极地区以海洋为主，这个海洋是", options:[,"太平洋","印度洋","北冰洋"], answer:3, book:"7b", chapter:"极地地区", tags:["北极","海洋"], difficulty:"easy", analysis:"北极地区以海洋为主，主要是北冰洋。南极地区以陆地为主，主要是南极洲。"},

  // 八年级上 - 从世界看中国
  { id:"q_8a_00_01", question:"我国陆地面积约", options:[,"960万平方千米","960平方千米","9600万平方千米"], answer:1, book:"8a", chapter:"从世界看中国", tags:["中国疆域"], difficulty:"easy", analysis:"我国陆地面积约960万平方千米，居世界第三位，仅次于俄罗斯和加拿大。"},
  { id:"q_8a_00_02", question:"我国领土最南端位于", options:[,"帕米尔高原","黑龙江与乌苏里江主航道中心线汇合处","曾母暗沙"], answer:3, book:"8a", chapter:"从世界看中国", tags:["中国疆域"], difficulty:"easy", analysis:"我国领土最南端在南沙群岛的曾母暗沙(约4°N)，最北端在漠河以北的黑龙江主航道中心线上。"},
  { id:"q_8a_00_03", question:"我国共有多少个省级行政区域", options:[,"33个","34个","35个"], answer:2, book:"8a", chapter:"从世界看中国", tags:["行政区划"], difficulty:"easy", analysis:"我国共有34个省级行政区域，包括23个省、5个自治区、4个直辖市和2个特别行政区。"},
  { id:"q_8a_00_04", question:"我国人口分布的地理界线是", options:[,"黑河—腾冲一线","大兴安岭—太行山一线","昆仑山—祁连山一线"], answer:1, book:"8a", chapter:"从世界看中国", tags:["人口分布"], difficulty:"easy", analysis:"黑河—腾冲一线是我国人口分布的地理界线，此线东南部人口稠密，西北部人口稀疏。"},
  { id:"q_8a_00_05", question:"我国人口的基本特点是", options:[,"人口基数小，增长慢","人口老龄化严重","人口分布均匀"], answer:0, book:"8a", chapter:"从世界看中国", tags:["人口特点"], difficulty:"easy", analysis:"我国人口基数大（14亿多），虽然增长率下降，但每年新增人口仍然较多。"},
  { id:"q_8a_00_06", question:"我国共有多少个民族", options:[,"55个","56个","57个"], answer:2, book:"8a", chapter:"从世界看中国", tags:["民族"], difficulty:"easy", analysis:"我国共有56个民族，汉族人口最多，其他55个为少数民族。"},
  { id:"q_8a_00_07", question:"我国少数民族主要分布在", options:[,"西南地区、西北地区和东北地区","华北地区","长江中下游地区"], answer:1, book:"8a", chapter:"从世界看中国", tags:["民族分布"], difficulty:"easy", analysis:"我国少数民族主要分布在西南、西北和东北地区，呈现'大散居、小聚居、交错杂居'的分布特点。"},
  { id:"q_8a_00_08", question:"我国人口最多的少数民族是", options:[,"满族","壮族","苗族"], answer:2, book:"8a", chapter:"从世界看中国", tags:["民族"], difficulty:"easy", analysis:"壮族是我国人口最多的少数民族，主要分布在广西壮族自治区。"},

  // 八年级上 - 中国的自然环境
  { id:"q_8a_01_01", question:"我国地势的主要特征是", options:[,"西高东低，呈阶梯状分布","中部高，四周低","南北高，中间低"], answer:1, book:"8a", chapter:"中国的自然环境", tags:["地势"], difficulty:"easy", analysis:"我国地势西高东低，呈三级阶梯状分布。"},
  { id:"q_8a_01_02", question:"我国地势第一、二级阶梯的分界线是", options:[,"昆仑山—祁连山—横断山脉","秦岭—淮河","长白山—武夷山"], answer:1, book:"8a", chapter:"中国的自然环境", tags:["地势","阶梯"], difficulty:"medium", analysis:"昆仑山—祁连山—横断山脉是第一、二级阶梯的分界线；大兴安岭—太行山—巫山—雪峰山是第二、三级阶梯的分界线。"},
  { id:"q_8a_01_03", question:"我国地形类型中，所占比例最大的是", options:[,"高原","山地","盆地"], answer:2, book:"8a", chapter:"中国的自然环境", tags:["地形"], difficulty:"easy", analysis:"我国山地面积约占全国总面积的1/3，加上高原、丘陵，山区面积约占全国总面积的2/3。"},
  { id:"q_8a_01_04", question:"位于我国地势第一级阶梯上的地形区是", options:[,"黄土高原","青藏高原","四川盆地"], answer:2, book:"8a", chapter:"中国的自然环境", tags:["地形区","阶梯"], difficulty:"easy", analysis:"青藏高原位于我国地势第一级阶梯，平均海拔4000米以上，有'世界屋脊'之称。"},
  { id:"q_8a_01_05", question:"我国冬季南北温差大的主要原因是", options:[,"地形差异","纬度位置不同","冬季风影响"], answer:2, book:"8a", chapter:"中国的自然环境", tags:["气温","冬季"], difficulty:"medium", analysis:"冬季南北温差大的主要原因是纬度位置不同，北方纬度高，太阳高度角小，获得太阳辐射少。"},
  { id:"q_8a_01_06", question:"我国年降水量分布的总趋势是", options:[,"从西北内陆向东南沿海递减","从南向北递增","从东向西递增"], answer:0, book:"8a", chapter:"中国的自然环境", tags:["降水"], difficulty:"easy", analysis:"受夏季风影响，我国年降水量从东南沿海向西北内陆递减。"},
  { id:"q_8a_01_07", question:"秦岭—淮河一线大致与哪条等降水量线吻合", options:[,"400毫米","800毫米","1600毫米"], answer:2, book:"8a", chapter:"中国的自然环境", tags:["秦岭淮河","降水"], difficulty:"easy", analysis:"秦岭—淮河一线大致与800毫米年等降水量线吻合，也是1月0°C等温线经过的地方。"},
  { id:"q_8a_01_08", question:"我国气候的主要特征是", options:[,"季风气候显著，气候复杂多样","海洋性气候为主","大陆性气候为主"], answer:1, book:"8a", chapter:"中国的自然环境", tags:["气候特征"], difficulty:"easy", analysis:"我国地域辽阔，地形复杂，气候复杂多样；东临太平洋，季风气候显著。"},
  { id:"q_8a_01_09", question:"影响我国的夏季风主要是", options:[,"东南季风和西南季风","西风","极地东风"], answer:1, book:"8a", chapter:"中国的自然环境", tags:["季风"], difficulty:"easy", analysis:"影响我国的夏季风主要是来自太平洋的东南季风和来自印度洋的西南季风，温暖湿润。"},
  { id:"q_8a_01_10", question:"我国最长的河流是", options:[,"珠江","长江","黑龙江"], answer:2, book:"8a", chapter:"中国的自然环境", tags:["长江"], difficulty:"easy", analysis:"长江全长约6300千米，是我国长度最长、水量最大、流域面积最广的河流。"},
  { id:"q_8a_01_11", question:"黄河中游流经的地形区是", options:[,"黄土高原","华北平原","内蒙古高原"], answer:1, book:"8a", chapter:"中国的自然环境", tags:["黄河","地形区"], difficulty:"easy", analysis:"黄河中游流经黄土高原，黄土高原水土流失严重，使黄河成为世界上含沙量最大的河流。"},
  { id:"q_8a_01_12", question:"黄河下游形成'地上河'的主要原因是", options:[,"下游水量大增","中游水土流失，下游泥沙淤积","下游筑堤防洪"], answer:2, book:"8a", chapter:"中国的自然环境", tags:["黄河","地上河"], difficulty:"medium", analysis:"黄河中游流经黄土高原，水土流失严重，大量泥沙进入下游，下游河道变宽，水流变缓，泥沙淤积，河床抬高，形成'地上河'。"},
  { id:"q_8a_01_13", question:"长江被称为'黄金水道'的原因是", options:[,"航运价值高","渔业资源丰富","沿岸风景优美"], answer:1, book:"8a", chapter:"中国的自然环境", tags:["长江","航运"], difficulty:"easy", analysis:"长江干支流通航里程长，宜宾以下四季通航，航运价值高，被称为'黄金水道'。"},
  { id:"q_8a_01_14", question:"我国常见的地质灾害有", options:[,"台风、寒潮","地震、滑坡、泥石流","沙尘暴、冰雹"], answer:2, book:"8a", chapter:"中国的自然环境", tags:["地质灾害"], difficulty:"easy", analysis:"地震、滑坡、泥石流属于地质灾害；干旱、洪涝、台风、寒潮属于气象灾害。"},
  { id:"q_8a_01_15", question:"我国水旱灾害频繁的主要原因是", options:[,"季风气候不稳定","河流众多","植被破坏"], answer:1, book:"8a", chapter:"中国的自然环境", tags:["水旱灾害","季风"], difficulty:"medium", analysis:"我国季风气候显著，夏季风的强弱和进退早晚不稳定，导致降水季节变化和年际变化大，水旱灾害频繁。"},

  // 八年级上 - 中国的自然资源
  { id:"q_8a_02_01", question:"我国自然资源的基本特征是", options:[,"总量丰富，人均不足","总量不足，人均充足","总量不足，人均不足"], answer:1, book:"8a", chapter:"中国的自然资源", tags:["自然资源"], difficulty:"easy", analysis:"我国自然资源总量丰富，种类齐全，但由于人口众多，人均占有量远低于世界平均水平。"},
  { id:"q_8a_02_02", question:"我国土地资源中，占比最小的是", options:[,"林地","耕地","建设用地"], answer:2, book:"8a", chapter:"中国的自然资源", tags:["土地资源"], difficulty:"easy", analysis:"我国耕地比重小，仅占国土面积的12.68%左右，后备耕地资源不足。"},
  { id:"q_8a_02_03", question:"我国水资源的空间分布特点是", options:[,"南少北多，东少西多","分布均匀","西北多，东南少"], answer:0, book:"8a", chapter:"中国的自然资源", tags:["水资源","分布"], difficulty:"easy", analysis:"受降水影响，我国水资源空间分布不均，南多北少，东多西少。"},
  { id:"q_8a_02_04", question:"解决我国水资源空间分布不均的主要措施是", options:[,"跨流域调水","节约用水","防治水污染"], answer:1, book:"8a", chapter:"中国的自然资源", tags:["水资源","调水"], difficulty:"easy", analysis:"跨流域调水是解决水资源空间分布不均的主要措施，如南水北调工程。兴修水库是解决时间分布不均的措施。"},
  { id:"q_8a_02_05", question:"我国最大的渔场是", options:[,"舟山渔场","南海沿岸渔场","北部湾渔场"], answer:1, book:"8a", chapter:"中国的自然资源", tags:["海洋资源","渔场"], difficulty:"easy", analysis:"舟山渔场位于长江入海口附近，是我国最大的渔场，也是世界著名渔场之一。"},

  // 八年级上 - 中国的经济发展
  { id:"q_8a_03_01", question:"我国最重要的运输方式是", options:[,"铁路运输","水路运输","航空运输"], answer:1, book:"8a", chapter:"中国的经济发展", tags:["交通运输"], difficulty:"easy", analysis:"铁路运输运量大、速度快、运费较低，是我国最重要的运输方式。"},
  { id:"q_8a_03_02", question:"我国铁路干线中，属于东西向的是", options:[,"京沪线","陇海—兰新线","京九线"], answer:2, book:"8a", chapter:"中国的经济发展", tags:["铁路","干线"], difficulty:"medium", analysis:"陇海—兰新线是东西向铁路干线，连接连云港和阿拉山口，是第二亚欧大陆桥的重要组成部分。京广、京沪、京九是南北向干线。"},
  { id:"q_8a_03_03", question:"我国农业分布的基本格局是", options:[,"东牧西耕，南麦北稻","东耕西牧，南麦北稻","均匀分布"], answer:0, book:"8a", chapter:"中国的经济发展", tags:["农业","分布"], difficulty:"easy", analysis:"我国东部以种植业为主，西部以畜牧业为主；南方以水稻为主，北方以小麦为主，即'东耕西牧、南稻北麦'。"},
  { id:"q_8a_03_04", question:"我国四大牧区是", options:[,"内蒙古、甘肃、青海、西藏","新疆、青海、西藏、云南","内蒙古、新疆、四川、西藏"], answer:0, book:"8a", chapter:"中国的经济发展", tags:["牧区"], difficulty:"easy", analysis:"我国四大牧区是内蒙古牧区、新疆牧区、青海牧区和西藏牧区，主要分布在西北和青藏高原地区。"},
  { id:"q_8a_03_05", question:"我国最大的综合性工业基地是", options:[,"京津唐工业基地","沪宁杭工业基地","珠江三角洲工业基地"], answer:2, book:"8a", chapter:"中国的经济发展", tags:["工业基地"], difficulty:"easy", analysis:"沪宁杭工业基地（长江三角洲工业基地）是我国最大的综合性工业基地，工业门类齐全，技术水平高。"},
  { id:"q_8a_03_06", question:"以重工业为主的工业基地是", options:[,"京津唐工业基地","沪宁杭工业基地","珠江三角洲工业基地"], answer:0, book:"8a", chapter:"中国的经济发展", tags:["工业基地"], difficulty:"easy", analysis:"辽中南工业基地依托丰富的煤铁资源，以钢铁、机械、化工等重工业为主。"},

  // 八年级下 - 中国的地理差异
  { id:"q_8b_00_01", question:"我国四大地理区域划分的依据主要是", options:[,"地理位置、自然地理和人文地理特点","降水量和气温","海拔高度"], answer:1, book:"8b", chapter:"中国的地理差异", tags:["四大地理区域"], difficulty:"medium", analysis:"我国四大地理区域是根据地理位置、自然地理和人文地理特点的不同划分的。"},
  { id:"q_8b_00_02", question:"北方地区与南方地区的分界线大致是", options:[,"秦岭—淮河一线","昆仑山—祁连山","横断山脉"], answer:1, book:"8b", chapter:"中国的地理差异", tags:["秦岭淮河","分界线"], difficulty:"easy", analysis:"秦岭—淮河一线是北方地区与南方地区的重要地理分界线。"},
  { id:"q_8b_00_03", question:"秦岭—淮河一线是我国", options:[,"亚热带与暖温带的分界线","暖温带与中温带的分界线","中温带与寒温带的分界线"], answer:1, book:"8b", chapter:"中国的地理差异", tags:["秦岭淮河","温度带"], difficulty:"medium", analysis:"秦岭—淮河一线大致是1月0°C等温线和800mm等降水量线经过的地方，是亚热带与暖温带的分界线。"},
  { id:"q_8b_00_04", question:"下列地理界线中，与秦岭—淮河一线大致吻合的是", options:[,"400毫米年等降水量线","800毫米年等降水量线","1600毫米年等降水量线"], answer:2, book:"8b", chapter:"中国的地理差异", tags:["秦岭淮河","降水"], difficulty:"easy", analysis:"秦岭—淮河一线大致与800毫米年等降水量线吻合。"},
  { id:"q_8b_00_05", question:"我国西北地区与北方地区的分界线大致与哪条线吻合", options:[,"400毫米年等降水量线","800毫米年等降水量线","1月0°C等温线"], answer:1, book:"8b", chapter:"中国的地理差异", tags:["分界线","降水"], difficulty:"medium", analysis:"西北地区与北方地区的分界线大致与400毫米年等降水量线吻合，此线以西降水较少，以畜牧业为主。"},

  // 八年级下 - 北方地区
  { id:"q_8b_01_01", question:"北方地区的主要气候类型是", options:[,"亚热带季风气候","温带季风气候","温带大陆性气候"], answer:2, book:"8b", chapter:"北方地区", tags:["北方地区","气候"], difficulty:"easy", analysis:"北方地区位于秦岭—淮河以北，主要是温带季风气候，夏季高温多雨，冬季寒冷干燥。"},
  { id:"q_8b_01_02", question:"东北三省是指", options:[,"黑龙江、吉林、河北","辽宁、吉林、山东","黑龙江、内蒙古、辽宁"], answer:0, book:"8b", chapter:"北方地区", tags:["东北三省"], difficulty:"easy", analysis:"东北三省包括黑龙江省、吉林省和辽宁省，位于我国东北部。"},
  { id:"q_8b_01_03", question:"东北三省发展成为我国最大的重工业基地的有利条件不包括", options:[,"交通便利","工业基础好","气候温暖湿润"], answer:3, book:"8b", chapter:"北方地区", tags:["东北","工业"], difficulty:"medium", analysis:"东北三省气候冷湿，冬季寒冷漫长，这不是发展工业的有利条件。其发展重工业的有利条件是资源丰富、交通便利、工业基础好。"},
  { id:"q_8b_01_04", question:"黄土高原水土流失严重的自然原因不包括", options:[,"夏季多暴雨","植被稀少","过度开垦"], answer:3, book:"8b", chapter:"北方地区", tags:["黄土高原","水土流失"], difficulty:"medium", analysis:"过度开垦是人为原因，不是自然原因。黄土高原水土流失的自然原因包括土质疏松、夏季多暴雨、植被稀少等。"},
  { id:"q_8b_01_05", question:"治理黄土高原水土流失的主要生物措施是", options:[,"打坝淤地","植树种草","修建水库"], answer:2, book:"8b", chapter:"北方地区", tags:["黄土高原","治理"], difficulty:"easy", analysis:"植树种草是治理水土流失的主要生物措施，可以涵养水源、保持水土。"},
  { id:"q_8b_01_06", question:"北京的城市职能不包括", options:[,"全国经济中心","全国文化中心","国际交往中心"], answer:1, book:"8b", chapter:"北方地区", tags:["北京","城市职能"], difficulty:"easy", analysis:"北京是全国政治中心、文化中心、国际交往中心、科技创新中心，但不是全国经济中心（上海是经济中心）。"},
  { id:"q_8b_01_07", question:"北京位于华北平原的", options:[,"西北部","东南部","西南部"], answer:1, book:"8b", chapter:"北方地区", tags:["北京","位置"], difficulty:"easy", analysis:"北京位于华北平原的西北部边缘，背靠燕山，西倚太行山余脉。"},

  // 八年级下 - 南方地区
  { id:"q_8b_02_01", question:"南方地区的主要气候类型是", options:[,"亚热带季风气候和热带季风气候","温带大陆性气候","高原山地气候"], answer:1, book:"8b", chapter:"南方地区", tags:["南方地区","气候"], difficulty:"easy", analysis:"南方地区位于秦岭—淮河以南，主要是亚热带季风气候，南部部分地区是热带季风气候。"},
  { id:"q_8b_02_02", question:"我国南方地区主要的粮食作物是", options:[,"玉米","水稻","高粱"], answer:2, book:"8b", chapter:"南方地区", tags:["南方地区","农业"], difficulty:"easy", analysis:"南方地区水热条件好，耕地以水田为主，主要粮食作物是水稻。"},
  { id:"q_8b_02_03", question:"长江三角洲地区的核心城市是", options:[,"杭州","苏州","上海"], answer:3, book:"8b", chapter:"南方地区", tags:["长三角","城市"], difficulty:"easy", analysis:"上海是长江三角洲地区的核心城市，是我国最大的城市和经济中心。"},
  { id:"q_8b_02_04", question:"香港与祖国内地的经济合作优势互补，香港的优势主要是", options:[,"丰富的自然资源","先进的技术和管理经验","广阔的土地"], answer:2, book:"8b", chapter:"南方地区", tags:["香港","经济"], difficulty:"medium", analysis:"香港拥有先进的技术、管理经验和资金，祖国内地拥有廉价的劳动力、丰富的自然资源和广阔的市场，优势互补。"},
  { id:"q_8b_02_05", question:"台湾省的主要少数民族是", options:[,"高山族","壮族","满族"], answer:1, book:"8b", chapter:"南方地区", tags:["台湾","民族"], difficulty:"easy", analysis:"台湾省的主要少数民族是高山族，汉族约占总人口的97%。"},
  { id:"q_8b_02_06", question:"台湾岛森林资源丰富，最著名的树种是", options:[,"樟树","松树","榕树"], answer:1, book:"8b", chapter:"南方地区", tags:["台湾","森林"], difficulty:"easy", analysis:"台湾岛气候温暖湿润，森林资源丰富，樟树是台湾最著名的树种，樟脑产量居世界首位。"},

  // 八年级下 - 西北地区
  { id:"q_8b_03_01", question:"西北地区最突出的自然地理特征是", options:[,"干旱","湿热","冷湿"], answer:1, book:"8b", chapter:"西北地区", tags:["西北地区","干旱"], difficulty:"easy", analysis:"西北地区深居内陆，距海遥远，降水稀少，干旱是最突出的自然地理特征。"},
  { id:"q_8b_03_02", question:"西北地区植被自东向西的变化规律是", options:[,"荒漠—荒漠草原—草原","草原—森林—荒漠","森林—草原—荒漠"], answer:0, book:"8b", chapter:"西北地区", tags:["西北地区","植被"], difficulty:"medium", analysis:"西北地区自东向西，距海越来越远，降水逐渐减少，植被依次为草原—荒漠草原—荒漠。"},
  { id:"q_8b_03_03", question:"塔里木盆地中最主要的矿产资源是", options:[,"铁矿","石油和天然气","有色金属"], answer:2, book:"8b", chapter:"西北地区", tags:["塔里木盆地","油气"], difficulty:"easy", analysis:"塔里木盆地油气资源丰富，是我国西气东输工程的重要气源地。"},
  { id:"q_8b_03_04", question:"西气东输工程的起点位于", options:[,"塔里木盆地","柴达木盆地","四川盆地"], answer:1, book:"8b", chapter:"西北地区", tags:["西气东输"], difficulty:"easy", analysis:"西气东输工程西起塔里木盆地的轮南油气田，东至上海。"},
  { id:"q_8b_03_05", question:"西北地区的农业主要以什么为主", options:[,"林业","畜牧业","渔业"], answer:2, book:"8b", chapter:"西北地区", tags:["西北地区","农业"], difficulty:"easy", analysis:"西北地区气候干旱，草原和荒漠广布，农业以畜牧业为主，是我国重要的畜牧业基地。"},

  // 八年级下 - 青藏地区
  { id:"q_8b_04_01", question:"青藏地区最突出的自然特征是", options:[,"高寒","湿热","炎热"], answer:1, book:"8b", chapter:"青藏地区", tags:["青藏地区","高寒"], difficulty:"easy", analysis:"青藏地区平均海拔4000米以上，'高'和'寒'是其最突出的自然特征。"},
  { id:"q_8b_04_02", question:"青藏高原上主要的农业类型是", options:[,"畜牧业","林业","渔业"], answer:1, book:"8b", chapter:"青藏地区", tags:["青藏地区","农业"], difficulty:"easy", analysis:"青藏地区气候高寒，草原广布，主要发展高寒畜牧业，主要牲畜有牦牛、藏绵羊等。"},
  { id:"q_8b_04_03", question:"被称为'高原之舟'的是", options:[,"牦牛","藏绵羊","驴"], answer:1, book:"8b", chapter:"青藏地区", tags:["青藏地区","牦牛"], difficulty:"easy", analysis:"牦牛适应高寒环境，是青藏高原上重要的运输工具和奶源，被称为'高原之舟'。"},
  { id:"q_8b_04_04", question:"三江源地区中的'三江'是指", options:[,"长江、黄河、珠江","黄河、淮河、海河","长江、珠江、澜沧江"], answer:0, book:"8b", chapter:"青藏地区", tags:["三江源","河流"], difficulty:"easy", analysis:"三江源地区是长江、黄河、澜沧江的发源地，位于青藏高原腹地，有'中华水塔'之称。"},
  { id:"q_8b_04_05", question:"三江源地区生态环境脆弱的主要原因是", options:[,"高寒气候，植被恢复慢","过度放牧","土地沙漠化"], answer:1, book:"8b", chapter:"青藏地区", tags:["三江源","生态"], difficulty:"medium", analysis:"三江源地区海拔高，气候寒冷，生态系统简单，植被生长缓慢，一旦破坏很难恢复，因此生态环境脆弱。"},

  // 八年级下 - 中国在世界中
  { id:"q_8b_05_01", question:"我国目前是世界第几大经济体", options:[,"第二","第三","第四"], answer:1, book:"8b", chapter:"中国在世界中", tags:["中国经济"], difficulty:"easy", analysis:"我国目前是世界第二大经济体，仅次于美国。"},
  { id:"q_8b_05_02", question:"我国提出的'一带一路'倡议中的'一路'是指", options:[,"21世纪海上丝绸之路","长江经济带","沿海开放带"], answer:1, book:"8b", chapter:"中国在世界中", tags:["一带一路"], difficulty:"easy", analysis:"'一带一路'指'丝绸之路经济带'和'21世纪海上丝绸之路'。'一路'指21世纪海上丝绸之路。"},
  { id:"q_8b_05_03", question:"我国面临的主要挑战不包括", options:[,"区域发展不平衡","海洋权益面临严峻挑战","人口数量不足"], answer:3, book:"8b", chapter:"中国在世界中", tags:["中国发展","挑战"], difficulty:"easy", analysis:"我国人口基数大，人口数量充足，不是挑战。主要挑战包括人地关系、区域发展不平衡、海洋权益等。"}
,
// === 七年级上 补充题 ===
  // 地球和地图 补充
  { id:"q_7a_00_13", question:"下列关于经线和纬线的说法，正确的是", options:[,"所有纬线长度相等","经线指示东西方向","纬线连接南北两极"], answer:0, book:"7a", chapter:"地球和地图", tags:["经纬线"], difficulty:"easy", analysis:"所有经线长度相等，都连接南北两极；纬线长度不等，赤道最长；经线指示南北方向，纬线指示东西方向。"},
  { id:"q_7a_00_14", question:"划分南北半球的分界线是", options:[,"赤道","北回归线","南极圈"], answer:1, book:"7a", chapter:"地球和地图", tags:["半球"], difficulty:"easy", analysis:"赤道(0°纬线)是南北半球的分界线。本初子午线是东西经度的分界线。"},
  { id:"q_7a_00_15", question:"当北京是正午时，纽约大约是", options:[,"清晨","傍晚","下午"], answer:0, book:"7a", chapter:"地球和地图", tags:["时差"], difficulty:"medium", analysis:"北京位于东八区，纽约位于西五区，时差约13小时。北京正午时，纽约大约是前一天的午夜。"},
  // 陆地和海洋 补充
  { id:"q_7a_01_13", question:"被太平洋、大西洋、印度洋环绕的大洲是", options:[,"非洲","南极洲","大洋洲"], answer:2, book:"7a", chapter:"陆地和海洋", tags:["七大洲"], difficulty:"easy", analysis:"南极洲位于南极地区，被太平洋、大西洋、印度洋三大洋环绕。"},
  { id:"q_7a_01_14", question:"地中海位于哪两个板块之间", options:[,"美洲板块与太平洋板块","印度洋板块与亚欧板块","非洲板块与印度洋板块"], answer:0, book:"7a", chapter:"陆地和海洋", tags:["板块构造"], difficulty:"medium", analysis:"地中海位于亚欧板块与非洲板块的交界处，两大板块相互碰撞挤压，使地中海面积不断缩小。"},
  { id:"q_7a_01_15", question:"下列大洲中，被赤道穿过的大洲有", options:[,"欧洲、北美洲、南极洲","非洲、欧洲、亚洲","南美洲、北美洲、大洋洲"], answer:0, book:"7a", chapter:"陆地和海洋", tags:["七大洲"], difficulty:"easy", analysis:"赤道穿过非洲中部、亚洲东南部(印度尼西亚)、大洋洲北部和南美洲北部。"},
  { id:"q_7a_01_16", question:"世界上面积最大的大洋是", options:[,"印度洋","太平洋","北冰洋"], answer:2, book:"7a", chapter:"陆地和海洋", tags:["四大洋"], difficulty:"easy", analysis:"太平洋面积约1.8亿平方千米，是世界上面积最大、最深的大洋。"},
  { id:"q_7a_01_17", question:"红海面积不断扩大的原因是", options:[,"板块张裂拉伸","海平面上升","填海造陆"], answer:1, book:"7a", chapter:"陆地和海洋", tags:["板块构造"], difficulty:"medium", analysis:"红海位于非洲板块与印度洋板块的张裂地带，面积不断扩大，未来可能发展成新的大洋。"},
  { id:"q_7a_01_18", question:"下列地理事物中，由板块碰撞形成的是", options:[,"红海","喜马拉雅山脉","大西洋中脊"], answer:2, book:"7a", chapter:"陆地和海洋", tags:["板块构造"], difficulty:"medium", analysis:"喜马拉雅山脉由印度洋板块与亚欧板块碰撞挤压形成。东非大裂谷、红海、大西洋中脊都是板块张裂形成的。"},
  // 天气与气候 补充
  { id:"q_7a_02_13", question:"测量气温时，温度计应放置在", options:[,"室内窗台上","百叶箱中","地面上"], answer:2, book:"7a", chapter:"天气与气候", tags:["气温测量"], difficulty:"easy", analysis:"温度计应放置在百叶箱中，避免阳光直射和地面辐射的影响，测量的是离地面1.5米处的气温。"},
  { id:"q_7a_02_14", question:"世界\u201c雨极\u201d是指", options:[,"乞拉朋齐","伦敦","纽约"], answer:1, book:"7a", chapter:"天气与气候", tags:["降水"], difficulty:"easy", analysis:"印度东北部的乞拉朋齐位于喜马拉雅山脉南坡，受地形影响，年降水量极大，被称为世界\u201c雨极\u201d。"},
  { id:"q_7a_02_15", question:"下列气候类型中，主要分布在南北纬40°—60°大陆西岸的是", options:[,"温带海洋性气候","温带季风气候","亚热带季风气候"], answer:1, book:"7a", chapter:"天气与气候", tags:["气候类型"], difficulty:"easy", analysis:"温带海洋性气候主要分布在南北纬40°—60°的大陆西岸，终年受西风带控制。"},
  // 居民与聚落 补充
  { id:"q_7a_03_11", question:"世界人口自然增长率最高的大洲是", options:[,"欧洲","非洲","南美洲"], answer:2, book:"7a", chapter:"居民与聚落", tags:["人口增长"], difficulty:"easy", analysis:"非洲是世界人口自然增长率最高的大洲，人口增长速度快。欧洲人口自然增长率最低，部分国家出现负增长。"},
  { id:"q_7a_03_12", question:"下列语言中，属于联合国工作语言的是", options:[,"汉语、英语、法语、俄语、西班牙语、阿拉伯语","葡萄牙语、意大利语","韩语、泰语"], answer:1, book:"7a", chapter:"居民与聚落", tags:["语言"], difficulty:"easy", analysis:"联合国的六种工作语言是：汉语、英语、法语、俄语、西班牙语、阿拉伯语。"},
  { id:"q_7a_03_13", question:"佛教的发源地是", options:[,"古印度","中国","欧洲"], answer:1, book:"7a", chapter:"居民与聚落", tags:["宗教"], difficulty:"easy", analysis:"佛教起源于公元前6世纪的古印度(今尼泊尔境内)，创始人是释迦牟尼。"},
  { id:"q_7a_03_14", question:"下列民居中，适应寒冷气候的是", options:[,"冰屋","窑洞","土楼"], answer:1, book:"7a", chapter:"居民与聚落", tags:["民居","气候"], difficulty:"easy", analysis:"冰屋是北极地区因纽特人的传统民居，用冰雪建造，保温性能好，适应寒冷气候。"},
  { id:"q_7a_03_15", question:"乡村聚落主要从事的生产活动是", options:[,"服务业","农业生产","商业活动"], answer:2, book:"7a", chapter:"居民与聚落", tags:["聚落"], difficulty:"easy", analysis:"乡村聚落人口规模小，主要从事农业生产活动；城市聚落主要从事工业、服务业等非农业生产活动。"},
  // 发展与合作 补充
  { id:"q_7a_04_06", question:"国际上把发展中国家与发达国家之间的政治、经济商谈称为", options:[,"南北对话","东西合作","北北对话"], answer:1, book:"7a", chapter:"发展与合作", tags:["国际合作"], difficulty:"easy", analysis:"发展中国家多在南半球及北半球南部(南方)，发达国家多在北半球北部(北方)，两者之间的商谈称为南北对话"},
  { id:"q_7a_04_07", question:"世界上最大的国际组织是", options:[,"联合国","欧盟","红十字会"], answer:1, book:"7a", chapter:"发展与合作", tags:["国际组织"], difficulty:"easy", analysis:"联合国(UN)是世界上规模最大、最具影响力的国际组织，成立于1945年。"},
  { id:"q_7a_04_08", question:"欧盟的英文缩写是", options:[,"WTO","EU","APEC"], answer:2, book:"7a", chapter:"发展与合作", tags:["国际组织"], difficulty:"easy", analysis:"EU是欧洲联盟(European Union)的缩写。UN是联合国，WTO是世界贸易组织，APEC是亚太经合组织。"},
  { id:"q_7a_04_09", question:"下列国家中，属于发达国家的是", options:[,"美国、日本、德国","巴西、阿根廷","埃及、南非"], answer:1, book:"7a", chapter:"发展与合作", tags:["发达国家"], difficulty:"easy", analysis:"美国、日本、德国是发达国家。中国、印度、巴西、阿根廷、埃及、南非都是发展中国家。"},
  { id:"q_7a_04_10", question:"金砖国家", options:["中国","俄罗斯","巴西","加拿大"], answer:3, book:"7a", chapter:"发展与合作", tags:["国际合作"], difficulty:"easy", analysis:"金砖国家"},

  // === 七年级下 补充题 ===
  // 我们生活的大洲——亚洲 补充
  { id:"q_7b_00_06", question:"亚洲流经国家最多的河流是", options:[,"黄河","湄公河","恒河"], answer:2, book:"7b", chapter:"我们生活的大洲——亚洲", tags:["亚洲河流"], difficulty:"medium", analysis:"湄公河发源于中国，流经缅甸、老挝、泰国、柬埔寨、越南等6个国家，是亚洲流经国家最多的河流。"},
  { id:"q_7b_00_07", question:"亚洲没有的气候类型是", options:[,"温带海洋性气候","热带季风气候","温带大陆性气候"], answer:1, book:"7b", chapter:"我们生活的大洲——亚洲", tags:["亚洲气候"], difficulty:"medium", analysis:"亚洲没有温带海洋性气候，因为温带海洋性气候分布在中纬度大陆西岸，而亚洲西部与欧洲接壤，东临太平洋。"},
  { id:"q_7b_00_08", question:"世界陆地最低点是", options:[,"里海","贝加尔湖","吐鲁番盆地"], answer:0, book:"7b", chapter:"我们生活的大洲——亚洲", tags:["亚洲地形"], difficulty:"easy", analysis:"死海位于亚洲西部，湖面海拔约-430米，是世界陆地最低点。"},
  { id:"q_7b_00_09", question:"贝加尔湖的特点是", options:[,"世界最深的湖泊","世界海拔最高的湖泊","世界盐度最高的湖泊"], answer:1, book:"7b", chapter:"我们生活的大洲——亚洲", tags:["亚洲湖泊"], difficulty:"easy", analysis:"贝加尔湖位于俄罗斯西伯利亚地区，最深处达1642米，是世界最深和蓄水量最大的淡水湖。"},
  { id:"q_7b_00_10", question:"亚洲南部三大半岛自西向东依次是", options:[,"阿拉伯半岛、印度半岛、中南半岛","印度半岛、阿拉伯半岛、中南半岛","阿拉伯半岛、中南半岛、印度半岛"], answer:1, book:"7b", chapter:"我们生活的大洲——亚洲", tags:["亚洲地形"], difficulty:"medium", analysis:"亚洲南部三大半岛自西向东依次是阿拉伯半岛(世界最大)、印度半岛、中南半岛。"},
  { id:"q_7b_00_11", question:"里海的特点是", options:[,"世界面积最大的湖泊","世界蓄水量最大的湖泊","世界海拔最低的湖泊"], answer:1, book:"7b", chapter:"我们生活的大洲——亚洲", tags:["亚洲湖泊"], difficulty:"easy", analysis:"里海面积约37万平方千米，是世界面积最大的湖泊(咸水湖)。"},
  { id:"q_7b_00_12", question:"亚洲人口超过1亿的国家中，位于东南亚的是", options:[,"印度、巴基斯坦","印度尼西亚、菲律宾","孟加拉国、俄罗斯"], answer:2, book:"7b", chapter:"我们生活的大洲——亚洲", tags:["亚洲人口"], difficulty:"medium", analysis:"亚洲人口超过1亿的国家中，印度尼西亚和菲律宾位于东南亚。中国、日本位于东亚，印度、巴基斯坦、孟加拉国位于南亚。"},

  // 我们邻近的地区和国家 补充
  { id:"q_7b_01_09", question:"日本传统服装是", options:[,"和服","纱丽","韩服"], answer:1, book:"7b", chapter:"我们邻近的地区和国家", tags:["日本","文化"], difficulty:"easy", analysis:"和服是日本的传统服装。旗袍是中国传统服装，纱丽是印度传统服装，韩服是韩国传统服装。"},
  { id:"q_7b_01_10", question:"日本领土由四大岛组成，其中最大的是", options:[,"本州","四国","九州"], answer:1, book:"7b", chapter:"我们邻近的地区和国家", tags:["日本","领土"], difficulty:"easy", analysis:"本州岛是日本最大的岛屿，东京、大阪、名古屋等主要城市都位于本州岛上。"},
  { id:"q_7b_01_11", question:"日本多温泉的原因是", options:[,"位于板块交界处，地热资源丰富","降水多","森林覆盖率高"], answer:1, book:"7b", chapter:"我们邻近的地区和国家", tags:["日本","地热"], difficulty:"easy", analysis:"日本位于亚欧板块与太平洋板块交界处，地壳活跃，地热资源丰富，因此多温泉。"},
  { id:"q_7b_01_12", question:"东南亚的气候类型主要是", options:[,"温带季风气候","地中海气候","热带沙漠气候"], answer:0, book:"7b", chapter:"我们邻近的地区和国家", tags:["东南亚","气候"], difficulty:"easy", analysis:"东南亚大部分地区位于热带，主要是热带季风气候(中南半岛)和热带雨林气候(马来群岛)。"},
  { id:"q_7b_01_13", question:"印度的主要粮食作物是", options:[,"玉米和大豆","棉花和茶叶","咖啡和可可"], answer:0, book:"7b", chapter:"我们邻近的地区和国家", tags:["印度","农业"], difficulty:"easy", analysis:"印度的主要粮食作物是小麦和水稻。水稻主要分布在降水丰富的东北部及沿海地区，小麦主要分布在西北部的干旱地区。"},
  { id:"q_7b_01_14", question:"印度的班加罗尔以什么产业著称", options:[,"棉纺织工业","软件产业","石油工业"], answer:2, book:"7b", chapter:"我们邻近的地区和国家", tags:["印度","产业"], difficulty:"easy", analysis:"班加罗尔是印度的硅谷"},
  { id:"q_7b_01_15", question:"俄罗斯的首都是", options:[,"莫斯科","伏尔加格勒","海参崴"], answer:1, book:"7b", chapter:"我们邻近的地区和国家", tags:["俄罗斯","首都"], difficulty:"easy", analysis:"莫斯科是俄罗斯的首都，也是俄罗斯最大的城市和交通中心。"},
  { id:"q_7b_01_16", question:"俄罗斯被称为世界加油站", options:["石油、天然气资源丰富","煤炭资源丰富","水能资源丰富","核能资源丰富"], answer:0, book:"7b", chapter:"我们邻近的地区和国家", tags:["俄罗斯","资源"], difficulty:"easy", analysis:"俄罗斯石油、天然气资源极为丰富，是世界上最大的能源出口国之一，因此被称为世界加油站"},
  { id:"q_7b_01_17", question:"俄罗斯亚洲部分河流航运价值不高的主要原因是", options:[,"结冰期长","河流太浅","水流太急"], answer:1, book:"7b", chapter:"我们邻近的地区和国家", tags:["俄罗斯","河流"], difficulty:"medium", analysis:"俄罗斯亚洲部分纬度高，气候寒冷，河流结冰期长，因此航运价值不高。"},
  { id:"q_7b_01_18", question:"下列国家中，属于东南亚的是", options:[,"泰国、越南","日本、韩国","伊朗、伊拉克"], answer:1, book:"7b", chapter:"我们邻近的地区和国家", tags:["东南亚","国家"], difficulty:"easy", analysis:"泰国、越南位于东南亚。印度、巴基斯坦位于南亚，日本、韩国位于东亚，伊朗、伊拉克位于西亚(中东)。"},
  { id:"q_7b_01_19", question:"日本海外投资建厂的主要对象是", options:[,"欧洲、美国、东亚、东南亚","南极洲","大洋洲"], answer:1, book:"7b", chapter:"我们邻近的地区和国家", tags:["日本","经济"], difficulty:"medium", analysis:"日本海外投资建厂的主要对象是欧洲、美国、东亚和东南亚等国家和地区，利用当地的廉价劳动力、资源和广阔市场。"},
  { id:"q_7b_01_20", question:"印度旱涝灾害频繁的主要原因是", options:[,"西南季风不稳定","植被破坏","河流众多"], answer:1, book:"7b", chapter:"我们邻近的地区和国家", tags:["印度","气候"], difficulty:"medium", analysis:"印度主要受西南季风影响，西南季风的强弱和进退时间不稳定，导致降水年际变化大，旱涝灾害频繁。"},

  // 东半球其他的地区和国家 补充
  { id:"q_7b_02_08", question:"中东地区水资源匮乏的主要原因是", options:[,"河流太少","人口太多","水污染严重"], answer:0, book:"7b", chapter:"东半球其他的地区和国家", tags:["中东","水资源"], difficulty:"easy", analysis:"中东地区大部分属于热带沙漠气候，降水稀少，气候干旱，因此水资源极为匮乏。"},
  { id:"q_7b_02_09", question:"霍尔木兹海峡被称为世界油阀", options:["石油运输量最大","海峡最窄","海水最深","风景最美"], answer:0, book:"7b", chapter:"东半球其他的地区和国家", tags:["中东","海峡"], difficulty:"easy", analysis:"霍尔木兹海峡是波斯湾石油输出的必经之路，全球约1/3的海运原油经此运输，因此被称为世界油阀"},
  { id:"q_7b_02_10", question:"欧洲西部旅游业发达的原因不包括", options:[,"历史文化古迹众多","交通便利","气候炎热"], answer:3, book:"7b", chapter:"东半球其他的地区和国家", tags:["欧洲西部","旅游"], difficulty:"easy", analysis:"欧洲西部主要是温带海洋性气候，终年温和湿润，并不炎热。旅游业发达的原因是自然景观丰富、历史文化古迹众多、交通便利等。"},
  { id:"q_7b_02_11", question:"欧盟多数国家使用的统一货币是", options:[,"英镑","欧元","法郎"], answer:2, book:"7b", chapter:"东半球其他的地区和国家", tags:["欧洲西部","货币"], difficulty:"easy", analysis:"欧元是欧盟多数国家使用的统一货币。英国(已脱欧)曾使用英镑，法国曾使用法郎。"},
  { id:"q_7b_02_12", question:"撒哈拉以南非洲的经济特点是", options:[,"以单一商品经济为主","以服务业为主","以高新技术产业为主"], answer:1, book:"7b", chapter:"东半球其他的地区和国家", tags:["非洲","经济"], difficulty:"easy", analysis:"撒哈拉以南非洲许多国家历史上长期受殖民统治，形成了依赖一种或几种初级产品出口的单一商品经济"},
  { id:"q_7b_02_13", question:"非洲的赤道雪峰", options:["乞力马扎罗山","阿特拉斯山","德拉肯斯山","肯尼亚山"], answer:0, book:"7b", chapter:"东半球其他的地区和国家", tags:["非洲","地形"], difficulty:"easy", analysis:"乞力马扎罗山位于赤道附近，海拔5895米，山顶终年积雪，被称为赤道雪峰"},
  { id:"q_7b_02_14", question:"澳大利亚的首都是", options:[,"墨尔本","堪培拉","布里斯班"], answer:2, book:"7b", chapter:"东半球其他的地区和国家", tags:["澳大利亚","首都"], difficulty:"easy", analysis:"堪培拉是澳大利亚的首都。悉尼是澳大利亚最大的城市，墨尔本是第二大城市。"},
  { id:"q_7b_02_15", question:"澳大利亚人口和城市主要分布在", options:[,"北部沿海地区","东南沿海地区","中部内陆地区"], answer:2, book:"7b", chapter:"东半球其他的地区和国家", tags:["澳大利亚","人口分布"], difficulty:"easy", analysis:"澳大利亚东南沿海地区气候温和湿润、交通便利、开发历史悠久，是人口和城市的主要分布区。"},
  { id:"q_7b_02_16", question:"澳大利亚特有的动物是", options:[,"袋鼠、考拉","狮子、大象","北极熊、企鹅"], answer:1, book:"7b", chapter:"东半球其他的地区和国家", tags:["澳大利亚","动物"], difficulty:"easy", analysis:"袋鼠、考拉、鸭嘴兽等是澳大利亚特有的动物。熊猫、金丝猴是中国特有的，狮子、大象主要在非洲，北极熊在北极，企鹅在南极。"},
  { id:"q_7b_02_17", question:"欧洲西部的地形以什么为主", options:[,"平原","盆地","丘陵"], answer:1, book:"7b", chapter:"东半球其他的地区和国家", tags:["欧洲西部","地形"], difficulty:"easy", analysis:"欧洲西部地形以平原为主，如西欧平原、波德平原等，地势低平，有利于交通和经济发展。"},
  { id:"q_7b_02_18", question:"中东地区的主要人种和语言是", options:[,"黄种人、汉语","黑种人、英语","混血人种、西班牙语"], answer:0, book:"7b", chapter:"东半球其他的地区和国家", tags:["中东","人种语言"], difficulty:"easy", analysis:"中东地区居民主要是白种人，大多数讲阿拉伯语，信奉伊斯兰教。"},
  { id:"q_7b_02_19", question:"下列关于非洲的叙述，正确的是", options:[,"气候以温带气候为主","拥有世界最大的沙漠和最长的河流","经济以工业为主"], answer:2, book:"7b", chapter:"东半球其他的地区和国家", tags:["非洲","概况"], difficulty:"medium", analysis:"非洲拥有世界最大的沙漠(撒哈拉沙漠)和世界最长的河流(尼罗河)。非洲地形以高原为主，气候以热带气候为主，经济以初级产品出口为主。"},

  // 西半球的国家 补充
  { id:"q_7b_03_06", question:"美国的土著居民是", options:[,"黑种人","印第安人","亚裔"], answer:2, book:"7b", chapter:"西半球的国家", tags:["美国","人口"], difficulty:"easy", analysis:"印第安人是美洲的土著居民。美国是移民国家，白种人、黑种人、亚裔等都是后来迁入的。"},
  { id:"q_7b_03_07", question:"美国农业生产的显著特点是", options:[,"地区专业化","以人力为主","以小农经济为主"], answer:1, book:"7b", chapter:"西半球的国家", tags:["美国","农业"], difficulty:"easy", analysis:"美国农业生产的显著特点是地区专业化，形成了玉米带、小麦带、棉花带、乳畜带等农业带。"},
  { id:"q_7b_03_08", question:"美国高新技术产业中心硅谷", options:["纽约","洛杉矶","旧金山(圣弗朗西斯科)","芝加哥"], answer:2, book:"7b", chapter:"西半球的国家", tags:["美国","硅谷"], difficulty:"easy", analysis:"硅谷"},
  { id:"q_7b_03_09", question:"巴西产量居世界首位的热带经济作物是", options:[,"油棕","咖啡","椰子"], answer:2, book:"7b", chapter:"西半球的国家", tags:["巴西","农业"], difficulty:"easy", analysis:"巴西是世界上最大的咖啡生产国和出口国，被称为咖啡王国"},
  { id:"q_7b_03_10", question:"巴西最丰富的矿产资源是", options:[,"石油","铁矿","金矿"], answer:2, book:"7b", chapter:"西半球的国家", tags:["巴西","矿产"], difficulty:"easy", analysis:"巴西铁矿储量大、品位高，产量和出口量均居世界前列。"},
  { id:"q_7b_03_11", question:"亚马孙热带雨林的作用不包括", options:[,"提供新鲜空气","涵养水源","加剧全球变暖"], answer:3, book:"7b", chapter:"西半球的国家", tags:["巴西","热带雨林"], difficulty:"easy", analysis:"亚马孙热带雨林通过光合作用吸收二氧化碳、释放氧气，调节全球气候，涵养水源。破坏雨林会加剧全球变暖，但雨林本身的作用是减缓全球变暖。"},
  { id:"q_7b_03_12", question:"美国东北部发展乳畜业的有利条件是", options:[,"气候炎热，草原广布","土地肥沃，适宜种植粮食","交通便利，工业发达"], answer:0, book:"7b", chapter:"西半球的国家", tags:["美国","农业"], difficulty:"medium", analysis:"美国东北部气候冷湿，适合牧草生长，且城市和人口密集，消费市场广阔，因此乳畜业发达。"},
  { id:"q_7b_03_13", question:"下列关于美国的叙述，正确的是", options:[,"美国是世界第一大经济体","美国农业落后","美国没有海外州"], answer:1, book:"7b", chapter:"西半球的国家", tags:["美国","概况"], difficulty:"easy", analysis:"美国是世界第一大经济体，本土位于北半球，农业高度发达，有阿拉斯加州和夏威夷州两个海外州。"},
  { id:"q_7b_03_14", question:"巴西的官方语言是", options:[,"英语","葡萄牙语","法语"], answer:2, book:"7b", chapter:"西半球的国家", tags:["巴西","语言"], difficulty:"easy", analysis:"巴西曾是葡萄牙的殖民地，官方语言是葡萄牙语。拉丁美洲大多数国家讲西班牙语。"},
  { id:"q_7b_03_15", question:"亚马孙河的特点是", options:[,"世界水量最大、流域面积最广的河流","世界含沙量最大的河流","世界流经国家最多的河流"], answer:1, book:"7b", chapter:"西半球的国家", tags:["巴西","河流"], difficulty:"easy", analysis:"亚马孙河是世界水量最大、流域面积最广、支流最多的河流，长度居世界第二(仅次于尼罗河)。"},

  // 极地地区 补充
  { id:"q_7b_04_05", question:"南极地区的象征是", options:[,"企鹅","海豹","鲸"], answer:1, book:"7b", chapter:"极地地区", tags:["南极","动物"], difficulty:"easy", analysis:"企鹅是南极地区的象征。北极熊是北极地区的象征。"},
  { id:"q_7b_04_06", question:"南极地区比北极地区更寒冷的主要原因是", options:[,"南极地区风力更大","南极地区降水更少","南极地区纬度更高"], answer:0, book:"7b", chapter:"极地地区", tags:["南极","气候"], difficulty:"medium", analysis:"南极地区是大陆(南极洲)，平均海拔高(约2350米)，且被冰雪覆盖，反射率高；北极地区是海洋(北冰洋)，海拔低。因此南极比北极更寒冷。"},
  { id:"q_7b_04_07", question:"我国在南极建立的第一个科学考察站是", options:[,"长城站","昆仑站","泰山站"], answer:1, book:"7b", chapter:"极地地区", tags:["南极","科考"], difficulty:"easy", analysis:"长城站建于1985年，是我国在南极建立的第一个科学考察站。"},
  { id:"q_7b_04_08", question:"北极地区的原住居民主要是", options:[,"因纽特人","阿拉伯人","欧洲人"], answer:1, book:"7b", chapter:"极地地区", tags:["北极","居民"], difficulty:"easy", analysis:"因纽特人(旧称爱斯基摩人)是北极地区的原住居民，主要分布在格陵兰岛、加拿大北部和阿拉斯加。"},
  { id:"q_7b_04_09", question:"南极地区科学考察的意义不包括", options:[,"研究地球历史","开采矿产资源","保护臭氧层"], answer:2, book:"7b", chapter:"极地地区", tags:["南极","科考"], difficulty:"medium", analysis:"南极地区科学考察主要是为了了解全球气候变化、研究地球历史、保护臭氧层等科学目的。根据《南极条约》，南极地区禁止一切军事活动和矿产资源开采。"},
  { id:"q_7b_04_10", question:"下列关于两极地区的叙述，正确的是", options:[,"南极地区以海洋为主","北极地区有常住人口","南极地区有常住人口"], answer:2, book:"7b", chapter:"极地地区", tags:["极地","概况"], difficulty:"medium", analysis:"北极地区以海洋(北冰洋)为主，有因纽特人等常住人口；南极地区以陆地(南极洲)为主，没有常住人口，只有科考人员。"},

  // === 八年级上 补充题 ===
  // 从世界看中国 补充
  { id:"q_8a_00_09", question:"我国濒临的海洋自北向南依次是", options:[,"黄海、渤海、东海、南海","南海、东海、黄海、渤海","渤海、东海、黄海、南海"], answer:0, book:"8a", chapter:"从世界看中国", tags:["中国海域"], difficulty:"easy", analysis:"我国濒临的海洋自北向南依次是渤海、黄海、东海、南海，其中渤海是内海。"},
  { id:"q_8a_00_10", question:"我国领土最西端位于", options:[,"帕米尔高原","黑龙江与乌苏里江汇合处","曾母暗沙"], answer:1, book:"8a", chapter:"从世界看中国", tags:["中国疆域"], difficulty:"easy", analysis:"我国领土最西端在新疆帕米尔高原(约73°E)，最东端在黑龙江与乌苏里江主航道中心线汇合处(约135°E)。"},
  { id:"q_8a_00_11", question:"我国纬度最低的省区是", options:[,"海南省","台湾省","福建省"], answer:1, book:"8a", chapter:"从世界看中国", tags:["中国疆域"], difficulty:"easy", analysis:"海南省包括海南岛和南海诸岛，是我国纬度最低的省区，也是最南端的省区。"},
  { id:"q_8a_00_12", question:"我国人口密度最小的省区是", options:[,"新疆维吾尔自治区","青海省","内蒙古自治区"], answer:0, book:"8a", chapter:"从世界看中国", tags:["人口分布"], difficulty:"easy", analysis:"西藏自治区海拔高、气候寒冷、交通不便，是我国人口密度最小的省区。"},
  { id:"q_8a_00_13", question:"我国跨经度最广的省区是", options:[,"西藏","内蒙古","青海"], answer:2, book:"8a", chapter:"从世界看中国", tags:["行政区划"], difficulty:"easy", analysis:"内蒙古自治区东西跨经度约29°，是我国跨经度最广的省区。新疆是面积最大的省区。"},
  { id:"q_8a_00_14", question:"我国回族的主要聚居区是", options:[,"西藏","宁夏","广西"], answer:2, book:"8a", chapter:"从世界看中国", tags:["民族分布"], difficulty:"easy", analysis:"宁夏回族自治区是回族的主要聚居区。新疆是维吾尔族的主要聚居区，西藏是藏族的主要聚居区，广西是壮族的主要聚居区。"},
  { id:"q_8a_00_15", question:"我国实行计划生育政策的目的是", options:[,"控制人口数量，提高人口素质","增加人口数量","提高人口出生率"], answer:1, book:"8a", chapter:"从世界看中国", tags:["人口政策"], difficulty:"easy", analysis:"我国实行计划生育政策的目的是控制人口数量，提高人口素质，使人口增长与社会经济发展相适应。"},

  // 中国的自然环境 补充
  { id:"q_8a_01_16", question:"我国地势第二级阶梯上的主要地形区是", options:[,"长江中下游平原","内蒙古高原、黄土高原、云贵高原、四川盆地","东北平原、华北平原"], answer:2, book:"8a", chapter:"中国的自然环境", tags:["地形区","阶梯"], difficulty:"easy", analysis:"我国地势第二级阶梯上的主要地形区包括内蒙古高原、黄土高原、云贵高原、塔里木盆地、准噶尔盆地、四川盆地等。"},
  { id:"q_8a_01_17", question:"我国地势第三级阶梯上的主要地形区是", options:[,"东北平原、华北平原、长江中下游平原、东南丘陵","内蒙古高原","黄土高原"], answer:1, book:"8a", chapter:"中国的自然环境", tags:["地形区","阶梯"], difficulty:"easy", analysis:"我国地势第三级阶梯上的主要地形区包括东北平原、华北平原、长江中下游平原和东南丘陵等。"},
  { id:"q_8a_01_18", question:"秦岭—淮河一线大致是我国", options:[,"400mm等降水量线经过的地方","季风区与非季风区的分界线","地势第二、三级阶梯的分界线"], answer:0, book:"8a", chapter:"中国的自然环境", tags:["秦岭淮河","气候"], difficulty:"easy", analysis:"秦岭—淮河一线大致与1月0°C等温线和800mm等降水量线吻合，是亚热带与暖温带的分界线。"},
  { id:"q_8a_01_19", question:"我国夏季气温最低的地区是", options:[,"青藏高原","吐鲁番盆地","海南岛"], answer:1, book:"8a", chapter:"中国的自然环境", tags:["气温","夏季"], difficulty:"easy", analysis:"青藏高原海拔高，气温随海拔升高而降低，是我国夏季气温最低的地区。"},
  { id:"q_8a_01_20", question:"我国降水量最多的地方是", options:[,"武汉","火烧寮","拉萨"], answer:2, book:"8a", chapter:"中国的自然环境", tags:["降水"], difficulty:"easy", analysis:"台湾东北部的火烧寮位于台湾山脉东北季风的迎风坡，年降水量极大，是我国降水量最多的地方。"},
  { id:"q_8a_01_21", question:"我国外流区与内流区的分界线大致与哪条线吻合", options:[,"400毫米年等降水量线","800毫米年等降水量线","1月0°C等温线"], answer:1, book:"8a", chapter:"中国的自然环境", tags:["河流","分界线"], difficulty:"medium", analysis:"我国内外流区的分界线大致与400毫米年等降水量线吻合，此线东南部降水多，为外流区；西北部降水少，为内流区。"},
  { id:"q_8a_01_22", question:"黄河上、中、下游的分界点分别是", options:[,"河口和桃花峪","宜昌和河口","湖口和桃花峪"], answer:1, book:"8a", chapter:"中国的自然环境", tags:["黄河","分界"], difficulty:"easy", analysis:"黄河上游与中游的分界点是内蒙古河口镇，中游与下游的分界点是河南桃花峪。长江上中游分界点是宜昌，中下游分界点是湖口。"},
  { id:"q_8a_01_23", question:"治理黄河的关键是", options:["治理下游\u201c加固堤坝\u201d","治理中游\u201c保持水土\u201d","治理上游\u201c植树造林\u201d","疏浚河道"], answer:1, book:"8a", chapter:"中国的自然环境", tags:["黄河","治理"], difficulty:"easy", analysis:"黄河问题的根源在中游的黄土高原水土流失，因此治理黄河的关键是在中游保持水土(植树种草、修建梯田等)。"},
  { id:"q_8a_01_24", question:"长江三峡工程位于长江的", options:[,"中游","下游","入海口"], answer:0, book:"8a", chapter:"中国的自然环境", tags:["长江","三峡"], difficulty:"easy", analysis:"长江三峡工程位于长江上游(重庆至湖北宜昌段)，是世界上最大的水利枢纽工程。"},
  { id:"q_8a_01_25", question:"我国最大的内流河是", options:[,"黄河","塔里木河","京杭运河"], answer:2, book:"8a", chapter:"中国的自然环境", tags:["内流河"], difficulty:"easy", analysis:"塔里木河位于新疆塔里木盆地，全长约2179千米，是我国最大的内流河。"},
  { id:"q_8a_01_26", question:"我国长度最长、水量最大、流域面积最广的河流是", options:[,"珠江","长江","黑龙江"], answer:2, book:"8a", chapter:"中国的自然环境", tags:["长江"], difficulty:"easy", analysis:"长江全长约6300千米，年径流量约9600亿立方米，流域面积约180万平方千米，是我国长度最长、水量最大、流域面积最广的河流。"},
  { id:"q_8a_01_27", question:"我国冬季最冷的地方是", options:[,"漠河","吐鲁番盆地","海南岛"], answer:1, book:"8a", chapter:"中国的自然环境", tags:["气温","冬季"], difficulty:"easy", analysis:"黑龙江省漠河市位于我国最北端，纬度高，冬季寒冷漫长，是我国冬季最冷的地方。"},
  { id:"q_8a_01_28", question:"我国被称为天府之国", options:["塔里木盆地","准噶尔盆地","四川盆地","柴达木盆地"], answer:2, book:"8a", chapter:"中国的自然环境", tags:["四川盆地"], difficulty:"easy", analysis:"四川盆地土壤肥沃(紫色土)、气候温暖湿润、农业发达，成都平原位于盆地西部，被称为天府之国"},
  { id:"q_8a_01_29", question:"我国年降水量空间分布的总趋势是", options:[,"从西北内陆向东南沿海递减","从南向北递增","从北向南递减"], answer:0, book:"8a", chapter:"中国的自然环境", tags:["降水分布"], difficulty:"easy", analysis:"受夏季风影响，我国年降水量从东南沿海向西北内陆递减。东南沿海地区年降水量可达1600毫米以上，西北内陆地区不足50毫米。"},
  { id:"q_8a_01_30", question:"我国主要的气象灾害有", options:[,"干旱、洪涝、台风、寒潮","火山喷发、海啸","泥石流、雪崩"], answer:1, book:"8a", chapter:"中国的自然环境", tags:["气象灾害"], difficulty:"easy", analysis:"干旱、洪涝、台风、寒潮属于气象灾害。地震、滑坡、泥石流属于地质灾害。"},

  // 中国的自然资源 补充
  { id:"q_8a_02_06", question:"我国土地资源的国情是", options:[,"草地多，耕地少","林地多，耕地多","建设用地多，耕地多"], answer:1, book:"8a", chapter:"中国的自然资源", tags:["土地资源"], difficulty:"easy", analysis:"我国草地面积广大，耕地比重小，后备耕地不足，林地比重也不大。"},
  { id:"q_8a_02_07", question:"我国水资源时间分布的特点是", options:[,"春夏多，秋冬少","全年均匀分布","全年都少"], answer:0, book:"8a", chapter:"中国的自然资源", tags:["水资源","分布"], difficulty:"easy", analysis:"我国降水主要集中在夏秋季节，因此水资源时间分布特点是夏秋多、冬春少，年际变化也大。"},
  { id:"q_8a_02_08", question:"解决我国水资源时间分布不均的主要措施是", options:[,"兴修水库","节约用水","防治水污染"], answer:1, book:"8a", chapter:"中国的自然资源", tags:["水资源","水库"], difficulty:"easy", analysis:"兴修水库可以在洪水期蓄水、枯水期放水，调节水资源的时间分配。跨流域调水是解决空间分布不均的措施。"},
  { id:"q_8a_02_09", question:"我国著名的盐场是", options:[,"长芦盐场","洞庭湖","鄱阳湖"], answer:1, book:"8a", chapter:"中国的自然资源", tags:["海洋资源","盐场"], difficulty:"easy", analysis:"长芦盐场位于渤海西岸，是我国最大的盐场，有利于晒盐的气候条件是晴天多、蒸发旺盛。"},
  { id:"q_8a_02_10", question:"我国矿产资源的分布特点是", options:[,"分布广泛，相对集中","集中在东部沿海","集中在西部地区"], answer:1, book:"8a", chapter:"中国的自然资源", tags:["矿产资源"], difficulty:"easy", analysis:"我国矿产资源分布广泛，但相对集中，如煤、石油主要分布在北方，有色金属主要分布在南方。"},
  { id:"q_8a_02_11", question:"下列资源中，属于非可再生资源的是", options:[,"水能","煤炭","森林"], answer:2, book:"8a", chapter:"中国的自然资源", tags:["资源分类"], difficulty:"easy", analysis:"煤炭、石油、天然气、铁矿等矿产资源属于非可再生资源。太阳能、水能、森林属于可再生资源。"},
  { id:"q_8a_02_12", question:"我国耕地主要分布在", options:[,"西部高原和山地","西北内陆地区","青藏高原"], answer:0, book:"8a", chapter:"中国的自然资源", tags:["耕地分布"], difficulty:"easy", analysis:"我国耕地主要分布在东部季风区的平原及低缓丘陵地区，这里水热条件好，土壤肥沃，适宜耕作。"},
  { id:"q_8a_02_13", question:"南水北调工程是把哪个流域的水调到缺水的华北和西北地区", options:[,"珠江流域","长江流域","淮河流域"], answer:2, book:"8a", chapter:"中国的自然资源", tags:["南水北调"], difficulty:"easy", analysis:"南水北调工程是把长江流域丰富的水资源调到缺水的华北和西北地区，分东、中、西三条线路。"},
  { id:"q_8a_02_14", question:"我国水资源人均占有量约为世界平均水平的", options:[,"1/3","1/4","1/5"], answer:2, book:"8a", chapter:"中国的自然资源", tags:["水资源","人均"], difficulty:"easy", analysis:"我国水资源总量丰富，但人均占有量仅为世界平均水平的1/4左右，是水资源短缺的国家。"},
  { id:"q_8a_02_15", question:"保护土地资源的基本国策是", options:[,"十分珍惜、合理利用土地和切实保护耕地","对外开放","节约资源"], answer:1, book:"8a", chapter:"中国的自然资源", tags:["土地国策"], difficulty:"easy", analysis:"我国把十分珍惜、合理利用土地和切实保护耕地"},

  // 中国的经济发展 补充
  { id:"q_8a_03_07", question:"我国铁路干线中，属于南北向的是", options:[,"京广线、京沪线、京九线","沪昆线","滨洲—滨绥线"], answer:1, book:"8a", chapter:"中国的经济发展", tags:["铁路","干线"], difficulty:"medium", analysis:"京广线、京沪线、京九线是南北向铁路干线。陇海—兰新线、沪昆线、滨洲—滨绥线是东西向干线。"},
  { id:"q_8a_03_08", question:"我国高速公路最密集的地区是", options:[,"西南地区","长江三角洲、珠江三角洲、环渤海地区","青藏高原"], answer:2, book:"8a", chapter:"中国的经济发展", tags:["交通"], difficulty:"easy", analysis:"长江三角洲、珠江三角洲、环渤海地区经济发达、人口稠密，高速公路网最密集。"},
  { id:"q_8a_03_09", question:"我国南方地区的主要糖料作物是", options:[,"甘蔗","棉花","油菜"], answer:1, book:"8a", chapter:"中国的经济发展", tags:["糖料作物"], difficulty:"easy", analysis:"甘蔗喜高温多雨，主要分布在华南地区。甜菜喜温凉，主要分布在东北、西北和华北北部地区。"},
  { id:"q_8a_03_10", question:"我国北方地区的油料作物主要是", options:[,"花生","大豆","芝麻"], answer:1, book:"8a", chapter:"中国的经济发展", tags:["油料作物"], difficulty:"easy", analysis:"花生主要分布在华北平原，是我国北方主要的油料作物。油菜主要分布在长江流域。"},
  { id:"q_8a_03_11", question:"我国最大的商品粮基地是", options:[,"东北平原","长江中下游平原","成都平原"], answer:1, book:"8a", chapter:"中国的经济发展", tags:["商品粮基地"], difficulty:"easy", analysis:"东北平原地广人稀，耕地面积大，机械化水平高，是我国最大的商品粮基地。"},
  { id:"q_8a_03_12", question:"我国的高新技术产业多依附于", options:[,"小城镇","农村","边疆地区"], answer:0, book:"8a", chapter:"中国的经济发展", tags:["高新技术产业"], difficulty:"easy", analysis:"我国高新技术产业多依附于大中城市，因为大城市科技力量雄厚、人才集中、信息通达。"},
  { id:"q_8a_03_13", question:"下列工业基地中，以轻工业为主的是", options:[,"京津唐","沪宁杭","珠江三角洲"], answer:3, book:"8a", chapter:"中国的经济发展", tags:["工业基地"], difficulty:"easy", analysis:"珠江三角洲工业基地靠近港澳，侨乡众多，以轻工业(纺织、服装、电子、玩具等)为主。"},
  { id:"q_8a_03_14", question:"我国北方主要的粮食作物是", options:[,"小麦","玉米","高粱"], answer:1, book:"8a", chapter:"中国的经济发展", tags:["粮食作物"], difficulty:"easy", analysis:"北方地区降水较少，耕地以旱地为主，主要粮食作物是小麦(冬小麦和春小麦)。南方地区主要粮食作物是水稻。"},
  { id:"q_8a_03_15", question:"我国东部沿海地区经济发展迅速的主要优势条件是", options:[,"交通便利，科技发达","土地面积大","劳动力成本低"], answer:1, book:"8a", chapter:"中国的经济发展", tags:["经济发展"], difficulty:"easy", analysis:"东部沿海地区海运便利、铁路公路网密集、科技发达、人才集中、对外开放程度高，经济发展迅速。"},
  { id:"q_8a_03_16", question:"下列关于我国农业的叙述，正确的是", options:[,"南方主要粮食作物是小麦，北方是水稻","东部以种植业为主，西部以畜牧业为主","我国没有商品粮基地"], answer:2, book:"8a", chapter:"中国的经济发展", tags:["农业","分布"], difficulty:"easy", analysis:"我国东部以种植业为主，西部以畜牧业为主。南方以水田为主，主要粮食作物是水稻；北方以旱地为主，主要粮食作物是小麦。"},
  { id:"q_8a_03_17", question:"西气东输一线工程西起新疆轮南，东至", options:[,"天津","上海","广州"], answer:2, book:"8a", chapter:"中国的经济发展", tags:["西气东输"], difficulty:"easy", analysis:"西气东输一线工程西起新疆塔里木盆地的轮南油气田，东至上海，是我国距离最长、口径最大的输气管道。"},
  { id:"q_8a_03_18", question:"下列农作物中，主要分布在东北地区的是", options:[,"甜菜、大豆、春小麦","油菜、水稻","棉花、花生"], answer:1, book:"8a", chapter:"中国的经济发展", tags:["农作物分布"], difficulty:"easy", analysis:"东北地区气候温凉，主要农作物有甜菜、大豆、春小麦、玉米等。甘蔗、橡胶主要分布在华南，油菜、水稻主要分布在长江流域，棉花主要分布在华北、西北和长江流域。"},
  { id:"q_8a_03_19", question:"我国高新技术产业的核心城市是", options:[,"北京","深圳","广州"], answer:1, book:"8a", chapter:"中国的经济发展", tags:["高新技术产业"], difficulty:"easy", analysis:"北京是我国高新技术产业的核心城市之一，拥有中关村科技园区等。上海、深圳也是重要的高新技术产业城市。"},
  { id:"q_8a_03_20", question:"青藏铁路的起止点是", options:[,"成都—拉萨","兰州—拉萨","乌鲁木齐—拉萨"], answer:0, book:"8a", chapter:"中国的经济发展", tags:["青藏铁路"], difficulty:"easy", analysis:"青藏铁路东起青海西宁，西至西藏拉萨，是世界上海拔最高、线路最长的高原铁路。"},

  // === 八年级下 补充题 ===
  // 中国的地理差异 补充
  { id:"q_8b_00_06", question:"青藏地区与其他三大地理区域的分界线是", options:[,"400毫米年等降水量线","青藏高原边缘线","大兴安岭—太行山一线"], answer:2, book:"8b", chapter:"中国的地理差异", tags:["分界线"], difficulty:"easy", analysis:"青藏地区与其他三大地理区域的分界线是青藏高原边缘线(昆仑山—祁连山—横断山脉)。"},
  { id:"q_8b_00_07", question:"西北地区与北方地区的分界线大致与哪条等降水量线一致", options:[,"400毫米","800毫米","1600毫米"], answer:1, book:"8b", chapter:"中国的地理差异", tags:["分界线","降水"], difficulty:"easy", analysis:"西北地区与北方地区的分界线大致与400毫米年等降水量线一致。"},
  { id:"q_8b_00_08", question:"下列地理界线中，与我国1月0°C等温线大致吻合的是", options:[,"大兴安岭—太行山一线","昆仑山—祁连山一线","横断山脉"], answer:0, book:"8b", chapter:"中国的地理差异", tags:["秦岭淮河","气温"], difficulty:"easy", analysis:"秦岭—淮河一线大致与我国1月0°C等温线和800毫米年等降水量线吻合。"},
  { id:"q_8b_00_09", question:"我国四大地理区域中，面积最大的是", options:[,"南方地区","西北地区","青藏地区"], answer:2, book:"8b", chapter:"中国的地理差异", tags:["四大地理区域"], difficulty:"easy", analysis:"西北地区包括新疆、内蒙古大部、宁夏、甘肃北部等，面积约300多万平方千米，是四大地理区域中面积最大的。"},
  { id:"q_8b_00_10", question:"下列关于秦岭—淮河一线的叙述，正确的是", options:[,"湿润区与半湿润区的分界线","地势第一、二级阶梯的分界线","内流区与外流区的分界线"], answer:1, book:"8b", chapter:"中国的地理差异", tags:["秦岭淮河","地理意义"], difficulty:"medium", analysis:"秦岭—淮河一线是湿润区与半湿润区的分界线、亚热带与暖温带的分界线等，但不是地势阶梯分界线或内外流区分界线。"},

  // 北方地区 补充
  { id:"q_8b_01_08", question:"东北平原发展农业的不利条件是", options:[,"热量不足","水源缺乏","地形崎岖"], answer:1, book:"8b", chapter:"北方地区", tags:["东北","农业"], difficulty:"easy", analysis:"东北平原纬度高，气温低，热量不足，农作物只能一年一熟，这是发展农业的主要不利条件。但土壤肥沃(黑土)、水源充足、地形平坦。"},
  { id:"q_8b_01_09", question:"黄土高原的传统民居是", options:[,"窑洞","蒙古包","四合院"], answer:1, book:"8b", chapter:"北方地区", tags:["黄土高原","民居"], difficulty:"easy", analysis:"窑洞是黄土高原地区的传统民居，利用黄土直立性好的特点挖掘而成，冬暖夏凉。"},
  { id:"q_8b_01_10", question:"华北平原春旱严重的主要原因是", options:[,"夏季风来得晚","冬季风势力强","河流干涸"], answer:0, book:"8b", chapter:"北方地区", tags:["华北","春旱"], difficulty:"medium", analysis:"华北平原春季降水少，气温回升快，蒸发旺盛，而农作物需水量大，因此春旱严重。"},
  { id:"q_8b_01_11", question:"北京的世界文化遗产不包括", options:[,"长城","天坛","黄山"], answer:3, book:"8b", chapter:"北方地区", tags:["北京","文化遗产"], difficulty:"easy", analysis:"黄山位于安徽省，不是北京的世界文化遗产。北京的世界文化遗产有故宫、长城、天坛、颐和园、周口店北京人遗址、明十三陵等。"},
  { id:"q_8b_01_12", question:"东北三省的农作物熟制主要是", options:[,"一年两熟","两年三熟","一年三熟"], answer:0, book:"8b", chapter:"北方地区", tags:["东北","熟制"], difficulty:"easy", analysis:"东北三省纬度高，热量不足，农作物熟制为一年一熟。华北地区为两年三熟或一年两熟，南方地区为一年两熟到三熟。"},
  { id:"q_8b_01_13", question:"下列关于黄土高原的叙述，正确的是", options:[,"千沟万壑，支离破碎","植被茂密","气候湿润"], answer:1, book:"8b", chapter:"北方地区", tags:["黄土高原","地貌"], difficulty:"easy", analysis:"黄土高原水土流失严重，地表被流水侵蚀形成千沟万壑、支离破碎的地表形态。"},
  { id:"q_8b_01_14", question:"东北平原的黑土", options:["土壤中腐殖质含量高","土壤中有大量矿物质","土壤中水分充足","土壤中空气含量高"], answer:0, book:"8b", chapter:"北方地区", tags:["东北","黑土"], difficulty:"medium", analysis:"东北平原气候冷湿，有机质分解慢，土壤中腐殖质大量积累，形成肥沃的黑土。"},
  { id:"q_8b_01_15", question:"北京的气候类型是", options:[,"亚热带季风气候","温带大陆性气候","高原山地气候"], answer:0, book:"8b", chapter:"北方地区", tags:["北京","气候"], difficulty:"easy", analysis:"北京位于秦岭—淮河以北，属于温带季风气候，夏季高温多雨，冬季寒冷干燥。"},

  // 南方地区 补充
  { id:"q_8b_02_07", question:"南方地区的耕地类型主要是", options:[,"水田","草地","林地"], answer:1, book:"8b", chapter:"南方地区", tags:["南方地区","耕地"], difficulty:"easy", analysis:"南方地区降水丰富，耕地以水田为主，主要种植水稻。北方地区耕地以旱地为主。"},
  { id:"q_8b_02_08", question:"长江三角洲地区被称为鱼米之乡", options:["盛产鱼和稻米","盛产鱼和棉花","盛产稻米和小麦","盛产棉花和油菜"], answer:0, book:"8b", chapter:"南方地区", tags:["长三角","农业"], difficulty:"easy", analysis:"长江三角洲地区地势低平、河网密布、气候湿润，盛产稻米和淡水鱼，因此被称为鱼米之乡"},
  { id:"q_8b_02_09", question:"珠江三角洲的\u201c前店后厂\u201d合作模式中，\u201c店\u201d和\u201c厂\u201d分别指", options:["内地—港澳","港澳—珠江三角洲","珠江三角洲—港澳","内地—珠江三角洲"], answer:1, book:"8b", chapter:"南方地区", tags:["珠三角","经济合作"], difficulty:"medium", analysis:"\u201c前店后厂\u201d是港澳地区与珠江三角洲地区经济合作的传统模式，港澳提供资金、技术、市场(店)，珠江三角洲提供土地、劳动力(厂)。"},
  { id:"q_8b_02_10", question:"下列关于台湾的叙述，正确的是", options:[,"台湾岛是我国第二大岛","台湾海峡位于台湾岛与菲律宾之间","台湾属于热带气候"], answer:0, book:"8b", chapter:"南方地区", tags:["台湾","概况"], difficulty:"easy", analysis:"台湾岛面积约3.6万平方千米，是我国第一大岛。台湾海峡位于台湾岛与祖国大陆之间。台湾北部属于亚热带气候，南部属于热带气候。"},
  { id:"q_8b_02_11", question:"港澳地区与祖国内地的经济联系中，祖国内地的优势主要是", options:[,"管理和信息","市场和劳动力","人才和交通"], answer:2, book:"8b", chapter:"南方地区", tags:["港澳","经济"], difficulty:"easy", analysis:"祖国内地的优势主要是自然资源、劳动力资源丰富和市场广阔。港澳的优势主要是资金、技术、管理经验和信息。"},
  { id:"q_8b_02_12", question:"下列地区中，被称为天府之国", options:["长江三角洲","珠江三角洲","成都平原","江汉平原"], answer:2, book:"8b", chapter:"南方地区", tags:["成都平原"], difficulty:"easy", analysis:"成都平原位于四川盆地西部，土壤肥沃、灌溉便利，农业发达，被称为天府之国"},
  { id:"q_8b_02_13", question:"南方地区的主要油料作物是", options:[,"油菜","大豆","芝麻"], answer:1, book:"8b", chapter:"南方地区", tags:["油料作物"], difficulty:"easy", analysis:"油菜是南方地区主要的油料作物，主要分布在长江流域。花生主要分布在北方地区。"},
  { id:"q_8b_02_14", question:"下列关于香港和澳门的叙述，正确的是", options:[,"香港位于珠江口东侧，澳门位于西侧","香港和澳门都位于珠江口西侧","香港和澳门都临南海"], answer:1, book:"8b", chapter:"南方地区", tags:["香港","澳门","位置"], difficulty:"easy", analysis:"香港位于珠江口东侧，北邻深圳；澳门位于珠江口西侧，北邻珠海。香港和澳门都临南海。"},
  { id:"q_8b_02_15", question:"台湾岛的地形特点是", options:[,"以山地为主，山地约占2/3","以高原为主","以盆地为主"], answer:1, book:"8b", chapter:"南方地区", tags:["台湾","地形"], difficulty:"easy", analysis:"台湾岛地形以山地为主，山地约占全岛面积的2/3，主要分布在中部和东部，平原主要分布在西部沿海。"},

  // 西北地区 补充
  { id:"q_8b_03_06", question:"西北地区农业发展的主要限制性因素是", options:[,"水源不足","土壤贫瘠","热量不足"], answer:1, book:"8b", chapter:"西北地区", tags:["西北地区","农业"], difficulty:"easy", analysis:"西北地区深居内陆，降水稀少，水源不足是农业发展的主要限制性因素。"},
  { id:"q_8b_03_07", question:"新疆的绿洲农业主要分布在", options:[,"盆地边缘的山麓地带和河流沿岸","高原地区","山地顶部"], answer:1, book:"8b", chapter:"西北地区", tags:["新疆","绿洲农业"], difficulty:"easy", analysis:"新疆绿洲农业主要分布在盆地边缘的山麓地带和河流沿岸，这里有高山冰雪融水作为灌溉水源。"},
  { id:"q_8b_03_08", question:"内蒙古草原的优良畜种是", options:[,"藏绵羊","三河马、三河牛","细毛羊"], answer:2, book:"8b", chapter:"西北地区", tags:["内蒙古","畜牧业"], difficulty:"easy", analysis:"三河马、三河牛是内蒙古草原的优良畜种。牦牛和藏绵羊是青藏地区的优良畜种，新疆细毛羊是新疆的优良畜种。"},
  { id:"q_8b_03_09", question:"塔里木盆地的气候类型是", options:[,"温带大陆性气候","高原山地气候","亚热带季风气候"], answer:1, book:"8b", chapter:"西北地区", tags:["塔里木盆地","气候"], difficulty:"easy", analysis:"塔里木盆地深居内陆，远离海洋，属于温带大陆性气候，冬冷夏热，降水稀少，昼夜温差大。"},
  { id:"q_8b_03_10", question:"西北地区河流的主要补给水源是", options:[,"高山冰雪融水","地下水","湖泊水"], answer:1, book:"8b", chapter:"西北地区", tags:["西北地区","河流"], difficulty:"easy", analysis:"西北地区降水稀少，河流的主要补给水源是高山冰雪融水(夏季气温升高时融化最多)。"},
  { id:"q_8b_03_11", question:"新疆的棉花产区主要分布在", options:[,"准噶尔盆地中心","天山山顶","吐鲁番盆地"], answer:0, book:"8b", chapter:"西北地区", tags:["新疆","棉花"], difficulty:"easy", analysis:"新疆棉花(长绒棉)产区主要分布在塔里木盆地边缘的绿洲地带，这里有灌溉水源，光照充足，昼夜温差大，有利于棉花生长。"},
  { id:"q_8b_03_12", question:"下列关于西北地区的叙述，正确的是", options:[,"以畜牧业为主","以林业为主","以渔业为主"], answer:1, book:"8b", chapter:"西北地区", tags:["西北地区","农业"], difficulty:"easy", analysis:"西北地区气候干旱，草原和荒漠广布，农业以畜牧业为主，是我国重要的牧区。"},
  { id:"q_8b_03_13", question:"坎儿井是新疆古老的引水工程，其水源主要来自", options:[,"高山冰雪融水","地下水","河流水"], answer:1, book:"8b", chapter:"西北地区", tags:["坎儿井","水源"], difficulty:"easy", analysis:"坎儿井是新疆吐鲁番盆地的古老引水工程，通过地下渠道将高山冰雪融水输送到绿洲，减少水分蒸发。"},
  { id:"q_8b_03_14", question:"西北地区主要的生态环境问题是", options:[,"土地荒漠化","湿地减少","森林破坏"], answer:1, book:"8b", chapter:"西北地区", tags:["西北地区","生态"], difficulty:"easy", analysis:"西北地区气候干旱，过度放牧、过度开垦等导致土地荒漠化严重，是主要的生态环境问题。"},
  { id:"q_8b_03_15", question:"西气东输工程对东部地区的意义是", options:[,"缓解能源短缺，改善环境质量","增加就业机会","促进民族团结"], answer:1, book:"8b", chapter:"西北地区", tags:["西气东输"], difficulty:"easy", analysis:"西气东输工程对东部地区的意义是缓解能源短缺，改善环境质量(天然气是清洁能源)。对西部地区的意义是将资源优势转化为经济优势，增加就业。"},

  // 青藏地区 补充
  { id:"q_8b_04_06", question:"青藏地区的农业主要分布在", options:[,"河谷地带","山地","湖泊周围"], answer:1, book:"8b", chapter:"青藏地区", tags:["青藏地区","农业"], difficulty:"easy", analysis:"青藏地区气候高寒，农业主要分布在海拔较低、气温较高的河谷地带，如雅鲁藏布江谷地和湟水谷地。"},
  { id:"q_8b_04_07", question:"青藏地区的代表性畜种是", options:[,"牦牛、藏绵羊","细毛羊","滩羊"], answer:1, book:"8b", chapter:"青藏地区", tags:["青藏地区","畜牧业"], difficulty:"easy", analysis:"牦牛和藏绵羊是青藏地区的代表性畜种，适应高寒环境。三河马、三河牛是内蒙古的优良畜种，细毛羊是新疆的优良畜种。"},
  { id:"q_8b_04_08", question:"青藏地区种植的主要粮食作物是", options:[,"小麦","青稞","玉米"], answer:2, book:"8b", chapter:"青藏地区", tags:["青藏地区","农业"], difficulty:"easy", analysis:"青稞是青藏地区主要的粮食作物，耐寒性强，是藏族人民的主要食物(糌粑的原料)。"},
  { id:"q_8b_04_09", question:"下列关于青藏地区的叙述，正确的是", options:[,"地热能资源丰富","水能资源贫乏","矿产资源贫乏"], answer:1, book:"8b", chapter:"青藏地区", tags:["青藏地区","资源"], difficulty:"medium", analysis:"青藏地区海拔高，空气稀薄，太阳辐射强，太阳能资源丰富；位于板块交界处，地热能资源丰富(如羊八井地热田)；是我国许多大河的发源地，水能资源丰富。"},
  { id:"q_8b_04_10", question:"青藏铁路在修建过程中需要克服的主要困难是", options:[,"沙漠广布","沼泽密布","台风频繁"], answer:0, book:"8b", chapter:"青藏地区", tags:["青藏铁路","困难"], difficulty:"easy", analysis:"青藏铁路穿越青藏高原，海拔高，气候寒冷，空气稀薄(高寒缺氧)，且有大面积多年冻土，是修建过程中需要克服的主要困难。"},
  { id:"q_8b_04_11", question:"三江源自然保护区建立的主要目的是", options:[,"保护高原湿地和水源地","发展畜牧业","开采矿产资源"], answer:1, book:"8b", chapter:"青藏地区", tags:["三江源","保护"], difficulty:"easy", analysis:"三江源自然保护区建立的主要目的是保护高原湿地生态系统和水源涵养功能，保护珍稀野生动植物。"},
  { id:"q_8b_04_12", question:"下列关于青藏高原的叙述，正确的是", options:[,"世界面积最大的高原","世界纬度最高的高原","世界人口最多的高原"], answer:0, book:"8b", chapter:"青藏地区", tags:["青藏高原"], difficulty:"easy", analysis:"青藏高原平均海拔4000米以上，是世界海拔最高的高原，有世界屋脊"},
  { id:"q_8b_04_13", question:"青藏地区丰富的清洁能源有", options:[,"太阳能、地热能、水能","天然气、核能","风能、潮汐能"], answer:1, book:"8b", chapter:"青藏地区", tags:["青藏地区","能源"], difficulty:"medium", analysis:"青藏地区太阳能(海拔高、空气稀薄)、地热能(板块交界处)、水能(大河发源地、落差大)资源丰富，都是清洁能源。"},
  { id:"q_8b_04_14", question:"拉萨被称为日光城", options:["纬度低","海拔高，空气稀薄，太阳辐射强","降水少，晴天多","工业污染少"], answer:1, book:"8b", chapter:"青藏地区", tags:["拉萨","日光城"], difficulty:"easy", analysis:"拉萨海拔约3650米，空气稀薄，大气对太阳辐射的削弱作用弱，太阳辐射强，年日照时数长，因此被称为日光城"},
  { id:"q_8b_04_15", question:"下列关于青藏地区的生态环境问题的叙述，正确的是", options:[,"土地荒漠化严重","湿地减少、草场退化","酸雨严重"], answer:2, book:"8b", chapter:"青藏地区", tags:["青藏地区","生态"], difficulty:"easy", analysis:"青藏地区主要的生态环境问题包括湿地减少、草场退化、野生动物数量减少等。水土流失主要在黄土高原，土地荒漠化主要在西北地区。"},

  // 中国在世界中 补充
  { id:"q_8b_05_04", question:"我国是世界上最大的", options:[,"发展中国家","资本主义国家","内陆国"], answer:1, book:"8b", chapter:"中国在世界中", tags:["中国","地位"], difficulty:"easy", analysis:"我国是世界上最大的发展中国家，也是世界第二大经济体。"},
  { id:"q_8b_05_05", question:"我国提出的\u201c一带一路\u201d倡议中，\u201c一带\u201d是指", options:["21世纪海上丝绸之路","丝绸之路经济带","长江经济带","沿海经济带"], answer:1, book:"8b", chapter:"中国在世界中", tags:["一带一路"], difficulty:"easy", analysis:"\u201c一带一路\u201d指\u201c丝绸之路经济带\u201d(一带)和\u201c21世纪海上丝绸之路\u201d(一路)。"},
  { id:"q_8b_05_06", question:"下列关于我国经济发展的叙述，正确的是", options:[,"我国经济发展迅速，但仍属于发展中国家","我国经济以农业为主","我国不需要进口任何产品"], answer:1, book:"8b", chapter:"中国在世界中", tags:["中国经济"], difficulty:"easy", analysis:"我国经济虽然发展迅速，成为世界第二大经济体，但人均GDP仍较低，区域发展不平衡，仍属于发展中国家。"},
  { id:"q_8b_05_07", question:"我国面临的主要挑战不包括", options:[,"区域发展不平衡","海洋权益面临严峻挑战","人口数量不足"], answer:3, book:"8b", chapter:"中国在世界中", tags:["中国发展","挑战"], difficulty:"easy", analysis:"我国人口基数大，人口数量充足。主要挑战包括人地关系不够和谐、区域发展不平衡、海洋权益面临严峻挑战等。"},
  { id:"q_8b_05_08", question:"我国积极融入经济全球化的表现是", options:[,"加入世界贸易组织","拒绝外资进入","限制对外贸易"], answer:1, book:"8b", chapter:"中国在世界中", tags:["全球化"], difficulty:"easy", analysis:"2001年我国加入世界贸易组织(WTO)，积极融入经济全球化，扩大对外开放。"},
  { id:"q_8b_05_09", question:"我国建设和谐世界的理念是", options:[,"构建人类命运共同体","输出中国模式","闭关自守"], answer:1, book:"8b", chapter:"中国在世界中", tags:["人类命运共同体"], difficulty:"easy", analysis:"我国倡导构建人类命运共同体，推动建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界。"},
  { id:"q_8b_05_10", question:"下列关于中国在国际事务中的作用的叙述，正确的是", options:[,"中国不参加任何国际组织","中国不维护世界和平","中国不促进世界经济发展"], answer:0, book:"8b", chapter:"中国在世界中", tags:["国际事务"], difficulty:"easy", analysis:"中国是联合国安理会五个常任理事国之一，积极参与国际事务，维护世界和平，促进世界经济发展。"}
