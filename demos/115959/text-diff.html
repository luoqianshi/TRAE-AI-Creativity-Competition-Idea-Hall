<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本对比工具 - Diff</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #1e1e1e;
    color: #d4d4d4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    background: #252526;
    border-bottom: 1px solid #3c3c3c;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .header h1 { font-size: 16px; font-weight: 600; color: #cccccc; }
  .btn-header {
    background: #0e639c;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 5px 14px;
    font-size: 12px;
    cursor: pointer;
    transition: background .2s;
    margin-left: auto;
  }
  .btn-header:hover { background: #1177bb; }
  .btn-header.secondary { background: #3a3d41; }
  .btn-header.secondary:hover { background: #45494e; }

  /* Main area */
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel + .panel { border-left: 2px solid #3c3c3c; }

  /* Panel header */
  .panel-head {
    background: #252526;
    border-bottom: 1px solid #3c3c3c;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .panel-label { font-size: 13px; font-weight: 600; color: #cccccc; }
  .panel-label span { color: #569cd6; margin-left: 4px; }
  .panel-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
  }
  .btn-small {
    background: transparent;
    border: 1px solid #3c3c3c;
    border-radius: 3px;
    padding: 2px 10px;
    font-size: 11px;
    color: #888;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-small:hover { color: #569cd6; border-color: #569cd6; }

  /* Editor area (input mode) */
  .editor-wrap {
    flex: 1;
    overflow: hidden;
    position: relative;
  }
  textarea.editor {
    width: 100%;
    height: 100%;
    background: #1e1e1e;
    color: #d4d4d4;
    border: none;
    padding: 12px 16px;
    font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
    font-size: 13px;
    line-height: 1.7;
    resize: none;
    outline: none;
    tab-size: 2;
  }
  textarea.editor::placeholder { color: #555; }

  /* Diff result area */
  .diff-result {
    flex: 1;
    overflow-y: auto;
    font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
    font-size: 13px;
    line-height: 1.7;
  }
  .line-row {
    display: flex;
    white-space: pre;
    min-height: 22.4px;
  }
  .line-num {
    width: 44px;
    flex-shrink: 0;
    text-align: right;
    padding-right: 12px;
    user-select: none;
    color: #858585;
    background: inherit;
  }
  .line-content {
    flex: 1;
    padding-right: 16px;
    overflow-x: auto;
  }

  /* Line types */
  .line-equal .line-content { color: #d4d4d4; }
  .line-add { background: rgba(35,134,54,.18); }
  .line-add .line-num { color: #81b88b; }
  .line-add .line-content { color: #b4cca1; }
  .line-del { background: rgba(185,49,41,.18); }
  .line-del .line-num { color: #ce9178; }
  .line-del .line-content { color: #f48771; }
  .line-empty { opacity: .35; }
  .line-empty .line-num { visibility: hidden; }

  /* Inline diff highlight within changed lines */
  .del-chunk { background: rgba(185,49,41,.35); color: #f48771; }
  .add-chunk { background: rgba(35,134,54,.35); color: #b4cca1; }

  /* Stats bar */
  .stats-bar {
    background: #252526;
    border-top: 1px solid #3c3c3c;
    padding: 6px 20px;
    font-size: 12px;
    color: #888;
    display: flex;
    gap: 20px;
    flex-shrink: 0;
  }
  .stat-add { color: #b4cca1; }
  .stat-del { color: #f48771; }

  /* Scroll sync */
  .sync-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
  .sync-scroll::-webkit-scrollbar-track { background: #1e1e1e; }
  .sync-scroll::-webkit-scrollbar-thumb { background: #424242; border-radius: 5px; }
  .sync-scroll::-webkit-scrollbar-thumb:hover { background: #555; }

  @media (max-width: 700px) {
    .main { flex-direction: column; }
    .panel + .panel { border-left: none; border-top: 2px solid #3c3c3c; }
    .editor-wrap, .diff-result { max-height: 40vh; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>文本对比工具</h1>
  <button class="btn-header secondary" onclick="clearAll()">清空</button>
  <button class="btn-header" onclick="doCompare()">开始对比</button>
</div>

<div class="main">
  <!-- Left Panel -->
  <div class="panel" id="leftPanel">
    <div class="panel-head">
      <span class="panel-label">左侧（原始 / A）</span>
      <div class="panel-actions">
        <button class="btn-small" onclick="pasteText('left')">粘贴</button>
        <button class="btn-small" onclick="clearEditor('left')">清空</button>
      </div>
    </div>
    <div class="editor-wrap">
      <textarea class="editor" id="leftText" placeholder="在这里输入或粘贴第一个文本..."></textarea>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="panel" id="rightPanel">
    <div class="panel-head">
      <span class="panel-label">右侧（修改后 / B）</span>
      <div class="panel-actions">
        <button class="btn-small" onclick="pasteText('right')">粘贴</button>
        <button class="btn-small" onclick="clearEditor('right')">清空</button>
      </div>
    </div>
    <div class="editor-wrap">
      <textarea class="editor" id="rightText" placeholder="在这里输入或粘贴第二个文本..."></textarea>
    </div>
  </div>
</div>

<div class="stats-bar" id="statsBar">
  <span>等待输入...</span>
</div>

<script>
/* ===== Simple diff algorithm (LCS-based) ===== */
function diffArrays(oldArr, newArr) {
  const m = oldArr.length, n = newArr.length;
  // Build LCS backtrace table
  const dp = Array.from({ length: m + 1 }, () => new Uint32Array(n + 1));
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = oldArr[i - 1] === newArr[j - 1]
        ? dp[i - 1][j - 1] + 1
        : Math.max(dp[i - 1][j], dp[i][j - 1]);
    }
  }
  // Backtrack to produce edit script
  const result = [];
  let i = m, j = n;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && oldArr[i - 1] === newArr[j - 1]) {
      result.unshift({ type: 'equal', leftVal: oldArr[i - 1], rightVal: newArr[j - 1] });
      i--; j--;
    } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
      result.unshift({ type: 'add', rightVal: newArr[j - 1] });
      j--;
    } else if (i > 0) {
      result.unshift({ type: 'del', leftVal: oldArr[i - 1] });
      i--;
    }
  }
  return result;
}

/* ===== Inline word-level diff for changed lines ===== */
function inlineDiff(oldStr, newStr) {
  // Simple char-level LCS for inline highlighting
  const o = oldStr.split('');
  const n = newStr.split('');
  const ol = o.length, nl = n.length;
  const dp = Array.from({ length: ol + 1 }, () => new Uint32Array(nl + 1));
  for (let i = 1; i <= ol; i++)
    for (let j = 1; j <= nl; j++)
      dp[i][j] = o[i - 1] === n[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);

  const leftParts = [], rightParts = [];
  let i = ol, j = nl;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && o[i - 1] === n[j - 1]) {
      leftParts.unshift(escHtml(o[i - 1]));
      rightParts.unshift(escHtml(n[j - 1]));
      i--; j--;
    } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
      rightParts.unshift('<span class="add-chunk">' + escHtml(n[j - 1]) + '</span>');
      j--;
    } else {
      leftParts.unshift('<span class="del-chunk">' + escHtml(o[i - 1]) + '</span>');
      i--;
    }
  }
  return [leftParts.join(''), rightParts.join('')];
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ===== Render diff results ===== */
function doCompare() {
  const leftVal = document.getElementById('leftText').value;
  const rightVal = document.getElementById('rightText').value;

  const oldLines = leftVal.endsWith('\n') ? leftVal.slice(0, -1).split('\n') : leftVal.split('\n');
  const newLines = rightVal.endsWith('\n') ? rightVal.slice(0, -1).split('\n') : rightVal.split('\n');

  const edits = diffArrays(oldLines, newLines);

  let leftNum = 0, rightNum = 0;
  let addCount = 0, delCount = 0;

  let leftHtml = '', rightHtml = '';

  for (const e of edits) {
    if (e.type === 'equal') {
      leftNum++; rightNum++;
      const t = escHtml(e.leftVal) || ' ';
      leftHtml += renderLine('equal', leftNum, t);
      rightHtml += renderLine('equal', rightNum, t);
    } else if (e.type === 'del') {
      leftNum++; delCount++;
      const [ld] = inlineDiff(e.leftVal, '');
      leftHtml += renderLine('del', leftNum, ld || escHtml(e.leftVal) || ' ');
      rightHtml += renderEmpty();
    } else if (e.type === 'add') {
      rightNum++; addCount++;
      const [, rd] = inlineDiff('', e.rightVal);
      leftHtml += renderEmpty();
      rightHtml += renderLine('add', rightNum, rd || escHtml(e.rightVal) || ' ');
    }
  }

  replaceWithDiff('leftPanel', leftHtml);
  replaceWithDiff('rightPanel', rightHtml);

  document.getElementById('statsBar').innerHTML =
    `共 ${oldLines.length} 行 → ${newLines.length} 行 | ` +
    `<span class="stat-del">−${delCount}</span> 删除 &nbsp; <span class="stat-add">+${addCount}</span> 添加`;

  syncScrolls();
}

function renderLine(cls, num, content) {
  return `<div class="line-row ${cls}-line"><span class="line-num">${num}</span><span class="line-content">${content}</span></div>`;
}
function renderEmpty() {
  return `<div class="line-row line-empty"><span class="line-num">&nbsp;</span><span class="line-content">&nbsp;</span></div>`;
}

function replaceWithDiff(panelId, html) {
  const panel = document.getElementById(panelId);
  const editorWrap = panel.querySelector('.editor-wrap');
  editorWrap.innerHTML = '<div class="diff-result sync-scroll">' + html + '</div>';
}

function syncScrolls() {
  const leftScroll = document.querySelector('#leftPanel .diff-result');
  const rightScroll = document.querySelector('#rightPanel .diff-result');
  if (!leftScroll || !rightScroll) return;
  let syncing = false;
  leftScroll.addEventListener('scroll', () => {
    if (syncing) return;
    syncing = true;
    rightScroll.scrollTop = leftScroll.scrollTop;
    rightScroll.scrollLeft = leftScroll.scrollLeft;
    syncing = false;
  });
  rightScroll.addEventListener('scroll', () => {
    if (syncing) return;
    syncing = true;
    leftScroll.scrollTop = rightScroll.scrollTop;
    leftScroll.scrollLeft = rightScroll.scrollLeft;
    syncing = false;
  });
}

/* ===== Helpers ===== */
async function pasteText(side) {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById(side + 'Text').value = text;
  } catch (_) {
    alert('无法读取剪贴板，请使用 Ctrl+V 粘贴');
  }
}
function clearEditor(side) {
  document.getElementById(side + 'Text').value = '';
}
function clearAll() {
  document.getElementById('leftText').value = '';
  document.getElementById('rightText').value = '';
  resetToEditor();
  document.getElementById('statsBar').innerHTML = '<span>等待输入...</span>';
}
function resetToEditor() {
  ['leftPanel','rightPanel'].forEach(id => {
    const panel = document.getElementById(id);
    const diffDiv = panel.querySelector('.diff-result');
    if (diffDiv) {
      const side = id === 'leftPanel' ? 'left' : 'right';
      panel.innerHTML =
        `<div class="panel-head">` +
          `<span class="panel-label">${side === 'left' ? '左侧（原始 / A）' : '右侧（修改后 / B）'}</span>` +
          `<div class="panel-actions">` +
            `<button class="btn-small" onclick="pasteText('${side}')">粘贴</button>` +
            `<button class="btn-small" onclick="clearEditor('${side}')">清空</button>` +
          `</div></div>` +
        `<div class="editor-wrap"><textarea class="editor" id="${side}Text" placeholder="在这里输入或粘贴${side === 'left' ? '第一个' : '第二个'}文本..."></textarea></div>`;
    }
  });
}
</script>
</body>
</html>
