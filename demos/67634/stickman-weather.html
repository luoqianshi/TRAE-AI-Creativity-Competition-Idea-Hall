<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>火柴人像素天气站</title>
  <style>
    :root {
      --ink: #16324f;
      --sky: #6fc7ff;
      --sky-deep: #3599df;
      --cream: #fffaf0;
      --orange: #ff8a3d;
      --yellow: #ffd84d;
      --panel: #102940;
      --muted: #60758a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 10%, rgba(255,255,255,.7) 0 5%, transparent 5.5%),
        linear-gradient(180deg, #c8ecff 0%, #edf8ff 42%, #fff7e7 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .1;
      background-image:
        linear-gradient(rgba(22,50,79,.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(22,50,79,.35) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .app {
      position: relative;
      width: min(1080px, calc(100% - 28px));
      margin: 0 auto;
      padding: 34px 0 42px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 22px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: #0b659d;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .eyebrow::before {
      content: "";
      width: 9px;
      height: 9px;
      border: 3px solid currentColor;
      transform: rotate(45deg);
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 62px);
      line-height: 1;
      letter-spacing: -.06em;
    }

    .subtitle {
      max-width: 430px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .online-pill {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 14px;
      border: 2px solid rgba(22,50,79,.14);
      border-radius: 999px;
      background: rgba(255,255,255,.75);
      font-weight: 800;
      box-shadow: 0 8px 20px rgba(38,106,148,.08);
    }

    .online-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #a7b2bd;
      box-shadow: 0 0 0 5px rgba(167,178,189,.18);
    }

    .online-pill.connected .online-dot {
      background: #36c66c;
      box-shadow: 0 0 0 5px rgba(54,198,108,.18);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      50% { transform: scale(.72); }
    }

    .control-bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 14px;
      margin-bottom: 20px;
      border: 2px solid rgba(22,50,79,.12);
      border-radius: 20px;
      background: rgba(255,255,255,.84);
      box-shadow: 0 14px 40px rgba(38,106,148,.12);
    }

    .city-box {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 0 14px;
      border: 2px solid #cfe0ea;
      border-radius: 13px;
      background: white;
    }

    .city-box span { font-size: 21px; }

    input {
      width: 100%;
      min-width: 0;
      padding: 13px 0;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font: inherit;
      font-weight: 700;
    }

    button {
      border: 0;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }

    .connect-btn {
      padding: 13px 22px;
      color: white;
      border-radius: 13px;
      background: var(--ink);
      box-shadow: 0 5px 0 #081d30;
      transition: transform .15s, box-shadow .15s;
    }

    button:hover { filter: brightness(1.04); }
    button:active { transform: translateY(3px); box-shadow: none; }
    button:focus-visible { outline: 4px solid rgba(255,138,61,.35); outline-offset: 3px; }

    .device {
      position: relative;
      padding: 26px;
      border: 4px solid var(--ink);
      border-radius: 30px;
      background: #f5b95d;
      box-shadow: 0 12px 0 #c87836, 0 30px 60px rgba(63,94,115,.22);
      overflow: hidden;
    }

    .device::before,
    .device::after {
      content: "";
      position: absolute;
      top: 15px;
      width: 11px;
      height: 11px;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: #f8d38d;
    }

    .device::before { left: 16px; }
    .device::after { right: 16px; }

    .screens {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .screen-card {
      min-width: 0;
      padding: 18px;
      color: white;
      border: 4px solid var(--ink);
      border-radius: 21px;
      background: var(--panel);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.05);
    }

    .screen-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .screen-number {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      color: var(--ink);
      border-radius: 8px;
      background: var(--yellow);
      font-size: 14px;
      font-weight: 900;
    }

    .screen-title {
      margin-right: auto;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .matrix-shell {
      width: min(100%, 330px);
      margin: 0 auto;
      padding: 11px;
      border: 3px solid #071a29;
      border-radius: 14px;
      background: #06131f;
      box-shadow: inset 0 0 24px rgba(0,0,0,.75), 0 10px 20px rgba(0,0,0,.25);
    }

    .matrix {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: clamp(4px, .8vw, 8px);
      aspect-ratio: 1;
    }

    .led {
      aspect-ratio: 1;
      border-radius: 50%;
      background: #172c3b;
      box-shadow: inset 0 1px 2px rgba(255,255,255,.07);
      transition: background .08s, box-shadow .08s, transform .08s;
    }

    .led.on {
      transform: scale(1.06);
      background: var(--led, #ff9a47);
      box-shadow:
        0 0 5px var(--led, #ff9a47),
        0 0 12px color-mix(in srgb, var(--led, #ff9a47) 70%, transparent);
    }

    .readout {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      min-height: 42px;
    }

    .big-reading {
      color: #fff;
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 900;
      white-space: nowrap;
    }

    .small-reading {
      color: #9fc2d8;
      font-size: 13px;
      line-height: 1.4;
      text-align: right;
    }

    .story-progress {
      display: flex;
      gap: 5px;
      margin-top: 9px;
    }

    .story-progress i {
      flex: 1;
      height: 4px;
      border-radius: 4px;
      background: #28485e;
    }

    .story-progress i.active { background: var(--yellow); }

    .demo-panel {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 3px dashed rgba(22,50,79,.24);
    }

    .demo-label {
      flex: 0 0 auto;
      font-weight: 900;
    }

    .weather-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .weather-btn {
      padding: 9px 13px;
      color: var(--ink);
      border: 2px solid rgba(22,50,79,.18);
      border-radius: 999px;
      background: #fff9e8;
      box-shadow: 0 3px 0 rgba(22,50,79,.18);
    }

    .weather-btn.active {
      color: white;
      border-color: var(--ink);
      background: var(--ink);
    }

    .tip {
      display: flex;
      gap: 12px;
      margin-top: 22px;
      padding: 15px 17px;
      color: #42627a;
      border-radius: 16px;
      background: rgba(255,255,255,.62);
      font-size: 13px;
      line-height: 1.6;
    }

    .tip strong { color: var(--ink); }

    @media (max-width: 720px) {
      .app { padding-top: 24px; }
      header { align-items: flex-start; flex-direction: column; gap: 14px; }
      .control-bar { grid-template-columns: 1fr; }
      .connect-btn { width: 100%; }
      .device { padding: 18px 12px; border-radius: 24px; }
      .screens { grid-template-columns: 1fr; gap: 15px; }
      .screen-card { padding: 14px; }
      .matrix-shell { max-width: 310px; }
      .demo-panel { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <div class="eyebrow">STICKMAN WEATHER</div>
        <h1>火柴人像素天气站</h1>
        <p class="subtitle">连上网，天气就会变成一段 8×8 像素小故事。左边看温度，右边看火柴人怎么面对今天的天气。</p>
      </div>
      <div class="online-pill" id="onlinePill" aria-live="polite">
        <span class="online-dot"></span>
        <span id="onlineText">演示模式</span>
      </div>
    </header>

    <section class="control-bar" aria-label="联网天气">
      <label class="city-box">
        <span aria-hidden="true">⌖</span>
        <input id="cityInput" value="北京" placeholder="输入城市，例如：北京" aria-label="城市名称">
      </label>
      <button class="connect-btn" id="connectButton">连接网络天气</button>
    </section>

    <section class="device" aria-label="两块8乘8 LED天气显示器">
      <div class="screens">
        <article class="screen-card">
          <div class="screen-head">
            <span class="screen-number">1</span>
            <span class="screen-title">温度屏 · 8×8 LED</span>
          </div>
          <div class="matrix-shell">
            <div class="matrix" id="tempMatrix" role="img" aria-label="温度像素图"></div>
          </div>
          <div class="readout">
            <span class="big-reading" id="temperatureText">26°C</span>
            <span class="small-reading" id="locationText">北京<br>演示数据</span>
          </div>
        </article>

        <article class="screen-card">
          <div class="screen-head">
            <span class="screen-number">2</span>
            <span class="screen-title">动画屏 · 8×8 LED</span>
          </div>
          <div class="matrix-shell">
            <div class="matrix" id="weatherMatrix" role="img" aria-label="火柴人天气动画"></div>
          </div>
          <div class="readout">
            <span class="big-reading" id="weatherText">晴天</span>
            <span class="small-reading" id="storyText">火柴人向太阳挥手</span>
          </div>
          <div class="story-progress" id="storyProgress" aria-label="动画进度">
            <i class="active"></i><i></i><i></i>
          </div>
        </article>
      </div>

      <div class="demo-panel">
        <span class="demo-label">试播天气：</span>
        <div class="weather-buttons" id="weatherButtons">
          <button class="weather-btn active" data-weather="clear">☀ 晴天</button>
          <button class="weather-btn" data-weather="rain">☂ 雨天</button>
          <button class="weather-btn" data-weather="cloud">☁ 阴天</button>
          <button class="weather-btn" data-weather="snow">❄ 雪天</button>
          <button class="weather-btn" data-weather="thunder">ϟ 雷雨</button>
          <button class="weather-btn" data-weather="wind">≈ 大风</button>
        </div>
      </div>
    </section>

    <div class="tip">
      <span aria-hidden="true">💡</span>
      <span><strong>怎么使用：</strong>输入城市后点“连接网络天气”。比赛现场如果没有网络，也可以点上面的天气按钮，直接播放火柴人动画。</span>
    </div>
  </main>

  <script>
    const LED_COLORS = {
      o: "#ff984f",
      y: "#ffe052",
      b: "#5ec8ff",
      w: "#eaf7ff",
      p: "#cda3ff"
    };

    const tempMatrix = document.getElementById("tempMatrix");
    const weatherMatrix = document.getElementById("weatherMatrix");
    const weatherText = document.getElementById("weatherText");
    const storyText = document.getElementById("storyText");
    const temperatureText = document.getElementById("temperatureText");
    const locationText = document.getElementById("locationText");
    const onlinePill = document.getElementById("onlinePill");
    const onlineText = document.getElementById("onlineText");
    const connectButton = document.getElementById("connectButton");
    const cityInput = document.getElementById("cityInput");
    const progressLights = [...document.querySelectorAll("#storyProgress i")];

    let currentWeather = "clear";
    let currentTemperature = 26;
    let animationTick = 0;

    function buildMatrix(element) {
      for (let i = 0; i < 64; i++) {
        const led = document.createElement("span");
        led.className = "led";
        element.appendChild(led);
      }
    }

    buildMatrix(tempMatrix);
    buildMatrix(weatherMatrix);

    function blank() {
      return Array.from({ length: 8 }, () => Array(8).fill("."));
    }

    function dot(frame, x, y, color = "b") {
      if (x >= 0 && x < 8 && y >= 0 && y < 8) frame[y][x] = color;
    }

    function dots(frame, points, color = "b") {
      points.forEach(([x, y]) => dot(frame, x, y, color));
    }

    function render(element, frame) {
      [...element.children].forEach((led, index) => {
        const y = Math.floor(index / 8);
        const x = index % 8;
        const colorKey = frame[y][x];
        const isOn = colorKey !== ".";
        led.classList.toggle("on", isOn);
        if (isOn) led.style.setProperty("--led", LED_COLORS[colorKey] || LED_COLORS.o);
      });
    }

    const DIGITS = {
      "0": ["111","101","101","101","111"],
      "1": ["010","110","010","010","111"],
      "2": ["111","001","111","100","111"],
      "3": ["111","001","111","001","111"],
      "4": ["101","101","111","001","001"],
      "5": ["111","100","111","001","111"],
      "6": ["111","100","111","101","111"],
      "7": ["111","001","010","010","010"],
      "8": ["111","101","111","101","111"],
      "9": ["111","101","111","001","111"],
      "-": ["000","000","111","000","000"]
    };

    function makeTemperatureFrame(value) {
      const frame = blank();
      const rounded = Math.round(value);
      const safe = Math.max(-9, Math.min(99, rounded));
      const text = safe < 0 ? `-${Math.abs(safe)}` : String(safe).padStart(2, "0");

      [...text].slice(0, 2).forEach((character, digitIndex) => {
        const pattern = DIGITS[character];
        const startX = digitIndex === 0 ? 0 : 4;
        pattern.forEach((row, y) => {
          [...row].forEach((cell, x) => {
            if (cell === "1") dot(frame, startX + x, y + 1, "o");
          });
        });
      });

      dot(frame, 6, 6, "y");
      dots(frame, [[5,7],[6,7],[7,7]], "o");
      return frame;
    }

    function drawStickman(frame, x, y, pose = 0, color = "w") {
      dot(frame, x, y, color);
      dot(frame, x, y + 1, color);
      dot(frame, x, y + 2, color);
      if (pose === 0) {
        dots(frame, [[x-1,y+1],[x+1,y+1],[x-1,y+3],[x+1,y+3]], color);
      } else if (pose === 1) {
        dots(frame, [[x-1,y+2],[x+1,y],[x-1,y+3],[x+1,y+3]], color);
      } else {
        dots(frame, [[x-1,y+1],[x+1,y+2],[x-1,y+3],[x+1,y+2]], color);
      }
    }

    function drawCloud(frame, y = 1) {
      dots(frame, [
        [2,y+1],[3,y],[4,y],[5,y+1],
        [1,y+2],[2,y+2],[3,y+2],[4,y+2],[5,y+2],[6,y+2]
      ], "w");
    }

    function clearFrame(tick) {
      const frame = blank();
      dots(frame, [[1,0],[0,1],[1,1],[2,1],[1,2]], "y");
      if (tick % 2 === 0) dots(frame, [[3,0],[0,3]], "y");
      drawStickman(frame, 5, 3, tick % 3 === 0 ? 1 : 0);
      return { frame, title: "晴天", story: "火柴人向太阳挥手", part: tick % 3 };
    }

    function rainFrame(tick) {
      const part = Math.floor((tick % 18) / 6);
      const sub = tick % 6;
      const frame = blank();

      if (part === 0) {
        drawCloud(frame, 0);
        const shift = sub % 3;
        dots(frame, [[2,4+shift],[5,4+((shift+1)%3)],[3,5+((shift+2)%2)]], "b");
        return { frame, title: "雨天", story: "第一幕：雨从云朵落下", part };
      }

      if (part === 1) {
        dots(frame, [[1,1],[2,0],[3,0],[4,1],[5,0],[6,1]], "b");
        dots(frame, [[2,3],[3,2],[4,2],[5,3],[3,3],[4,3]], "y");
        dot(frame, 4, 4, "y");
        drawStickman(frame, 4, 4, 0);
        if (sub % 2 === 0) dots(frame, [[0,3],[7,2]], "b");
        return { frame, title: "雨天", story: "第二幕：火柴人撑起雨伞", part };
      }

      dots(frame, [[0,0],[2,1],[4,0],[6,1],[7,0]], "b");
      const x = [2,3,4,5,4,3][sub];
      drawStickman(frame, x, 3, sub % 2 ? 2 : 0);
      return { frame, title: "雨天", story: "第三幕：火柴人在雨中走路", part };
    }

    function cloudFrame(tick) {
      const frame = blank();
      drawCloud(frame, 1);
      drawStickman(frame, 3 + (tick % 2), 4, tick % 2);
      return { frame, title: "阴天", story: "火柴人在云下散步", part: tick % 3 };
    }

    function snowFrame(tick) {
      const frame = blank();
      const shift = tick % 3;
      dots(frame, [[1,shift],[4,(shift+1)%3],[7,shift],[2,3+shift],[6,3+((shift+1)%3)]], "w");
      drawStickman(frame, 3, 3, tick % 2);
      dots(frame, [[5,5],[4,6],[5,6],[6,6],[3,7],[4,7],[5,7],[6,7],[7,7]], "b");
      return { frame, title: "雪天", story: "火柴人在雪中堆雪人", part: tick % 3 };
    }

    function thunderFrame(tick) {
      const frame = blank();
      drawCloud(frame, 0);
      if (tick % 2 === 0) dots(frame, [[4,3],[3,4],[4,4],[3,5],[2,6]], "y");
      drawStickman(frame, 6, 4, tick % 2 ? 1 : 0);
      return { frame, title: "雷雨", story: "闪电来了，快回家！", part: tick % 3 };
    }

    function windFrame(tick) {
      const frame = blank();
      const offset = tick % 3;
      dots(frame, [[0,1],[1,1],[2,1],[4,2],[5,2],[6,2],[1,4],[2,4]], "b");
      drawStickman(frame, 5 - offset, 3, 2);
      return { frame, title: "大风", story: "火柴人顶着风向前走", part: tick % 3 };
    }

    const animationMakers = {
      clear: clearFrame,
      rain: rainFrame,
      cloud: cloudFrame,
      snow: snowFrame,
      thunder: thunderFrame,
      wind: windFrame
    };

    function drawAnimation() {
      const animation = animationMakers[currentWeather](animationTick++);
      render(weatherMatrix, animation.frame);
      weatherText.textContent = animation.title;
      storyText.textContent = animation.story;
      progressLights.forEach((light, index) => light.classList.toggle("active", index === animation.part));
    }

    function chooseWeather(type, temperature, mode = "demo") {
      currentWeather = type;
      animationTick = 0;
      if (typeof temperature === "number") {
        currentTemperature = temperature;
        render(tempMatrix, makeTemperatureFrame(currentTemperature));
        temperatureText.textContent = `${Math.round(currentTemperature)}°C`;
      }
      document.querySelectorAll(".weather-btn").forEach(button => {
        button.classList.toggle("active", button.dataset.weather === type);
      });
      if (mode === "demo") {
        onlinePill.classList.remove("connected");
        onlineText.textContent = "演示模式";
        locationText.innerHTML = `${cityInput.value.trim() || "北京"}<br>演示数据`;
      }
      drawAnimation();
    }

    function codeToWeather(code) {
      if (code === 0) return "clear";
      if ([1,2,3,45,48].includes(code)) return "cloud";
      if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return "rain";
      if ([71,73,75,77,85,86].includes(code)) return "snow";
      if ([95,96,99].includes(code)) return "thunder";
      return "cloud";
    }

    async function connectWeather() {
      const city = cityInput.value.trim();
      if (!city) {
        cityInput.focus();
        return;
      }

      connectButton.disabled = true;
      connectButton.textContent = "正在找天气…";
      onlineText.textContent = "连接中";

      try {
        const placeUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=zh&format=json`;
        const placeResponse = await fetch(placeUrl);
        if (!placeResponse.ok) throw new Error("城市查询失败");
        const placeData = await placeResponse.json();
        const place = placeData.results && placeData.results[0];
        if (!place) throw new Error("没有找到这个城市");

        const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,weather_code&timezone=auto`;
        const weatherResponse = await fetch(weatherUrl);
        if (!weatherResponse.ok) throw new Error("天气查询失败");
        const weatherData = await weatherResponse.json();
        const temperature = weatherData.current.temperature_2m;
        const type = codeToWeather(weatherData.current.weather_code);

        chooseWeather(type, temperature, "online");
        onlinePill.classList.add("connected");
        onlineText.textContent = "天气已联网";
        locationText.innerHTML = `${place.name}<br>${place.admin1 || place.country || "实时天气"}`;
      } catch (error) {
        onlinePill.classList.remove("connected");
        onlineText.textContent = "连接失败";
        locationText.innerHTML = `${city}<br>请检查网络或城市名`;
      } finally {
        connectButton.disabled = false;
        connectButton.textContent = "连接网络天气";
      }
    }

    document.getElementById("weatherButtons").addEventListener("click", event => {
      const button = event.target.closest(".weather-btn");
      if (!button) return;
      const demoTemps = { clear: 28, rain: 21, cloud: 24, snow: -3, thunder: 23, wind: 17 };
      chooseWeather(button.dataset.weather, demoTemps[button.dataset.weather]);
    });

    connectButton.addEventListener("click", connectWeather);
    cityInput.addEventListener("keydown", event => {
      if (event.key === "Enter") connectWeather();
    });

    render(tempMatrix, makeTemperatureFrame(currentTemperature));
    drawAnimation();
    setInterval(drawAnimation, 450);
  </script>
</body>
</html>
