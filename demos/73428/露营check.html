<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>露营装备清单生成器</title>
  <style>
    :root {
      --bg-primary: #f9f7f3;
      --bg-card: #ffffff;
      --text-primary: #333333;
      --text-secondary: #666666;
      --accent: #4a7c59;
      --accent-light: #e8f5e9;
      --border: #e0d9cf;
      --shadow: 0 2px 12px rgba(0,0,0,0.05);
      --transition: all 0.3s ease;
      --radius: 12px;
      --spacing-xs: 8px;
      --spacing-sm: 16px;
      --spacing-md: 24px;
      --spacing-lg: 32px;
      --font-title: 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
      --font-body: 'Helvetica Neue', 'Arial', sans-serif;
    }

    .dark-theme {
      --bg-primary: #1e293b;
      --bg-card: #2d3748;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --accent: #60a5fa;
      --accent-light: #1e40af;
      --border: #4a5568;
      --shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: var(--spacing-sm);
      transition: var(--transition);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: var(--spacing-lg);
      padding-top: var(--spacing-md);
    }

    h1 {
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 1.8rem;
      color: var(--accent);
      margin-bottom: var(--spacing-xs);
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-secondary);
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: var(--spacing-md);
      margin-bottom: var(--spacing-md);
      border: 1px solid var(--border);
      transition: var(--transition);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: var(--spacing-sm);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title svg {
      width: 1.2em;
      height: 1.2em;
      fill: var(--accent);
    }

    .form-group {
      margin-bottom: var(--spacing-sm);
    }

    label {
      display: block;
      margin-bottom: var(--spacing-xs);
      font-weight: 500;
      color: var(--text-primary);
    }

    select, input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 1rem;
      transition: var(--transition);
    }

    select:focus, input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.1);
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-xs);
      margin-top: var(--spacing-xs);
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
    }

    .checkbox-item input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--accent);
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
      width: 100%;
      text-align: center;
      margin-top: var(--spacing-sm);
    }

    .btn:hover:not(:disabled) {
      background: #3a6246;
      transform: translateY(-1px);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .list-container {
      margin-top: var(--spacing-md);
      display: none;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-sm);
      padding-bottom: var(--spacing-xs);
      border-bottom: 1px dashed var(--border);
    }

    .list-title {
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--text-primary);
    }

    .copy-btn {
      background: var(--accent-light);
      color: var(--accent);
      border: none;
      padding: 6px 14px;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      transition: var(--transition);
    }

    .copy-btn:hover:not(:disabled) {
      background: var(--accent);
      color: white;
    }

    .item-list {
      list-style: none;
    }

    .item {
      display: flex;
      align-items: flex-start;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    .item:last-child {
      border-bottom: none;
    }

    .item-checkbox {
      margin-top: 4px;
      margin-right: 12px;
      flex-shrink: 0;
      accent-color: var(--accent);
      width: 18px;
      height: 18px;
    }

    .item-content {
      flex: 1;
      padding-right: 12px;
    }

    .item-name {
      font-weight: 500;
      margin-bottom: 4px;
    }

    .item-note {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .theme-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 100;
      transition: var(--transition);
      font-size: 1.2rem;
      padding: 0;
      line-height: 1;
    }

    .theme-toggle:hover:not(:disabled) {
      transform: scale(1.05);
      background: #3a6246;
    }

    .empty-state {
      text-align: center;
      padding: var(--spacing-md);
      color: var(--text-secondary);
      font-style: italic;
    }

    /* Responsive */
    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      h1 {
        font-size: 1.5rem;
      }
      .card {
        padding: 16px;
      }
      .btn {
        padding: 12px;
      }
      .theme-toggle {
        width: 44px;
        height: 44px;
        font-size: 1.1rem;
        bottom: 16px;
        right: 16px;
      }
    }

    /* Animation for list reveal */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .list-container.show {
      display: block;
      animation: fadeInUp 0.4s ease-out forwards;
    }

    /* Print style */
    @media print {
      .theme-toggle, .copy-btn, .btn {
        display: none;
      }
      body {
        background: white;
        color: black;
      }
      .card {
        box-shadow: none;
        border: 1px solid #ccc;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏕️ 露营装备清单生成器</h1>
      <p class="subtitle">输入基本信息，5秒生成专属清单｜免注册｜纯离线运行</p>
    </header>

    <main>
      <section class="card">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          快速设置你的行程
        </h2>
        <div class="form-group">
          <label for="people">同行人数</label>
          <input type="number" id="people" min="1" max="10" value="2" />
        </div>
        <div class="form-group">
          <label for="days">露营天数</label>
          <select id="days">
            <option value="1">1天（当日往返）</option>
            <option value="2" selected>2天（过夜）</option>
            <option value="3">3天</option>
          </select>
        </div>
        <div class="form-group">
          <label for="weather">天气情况</label>
          <select id="weather">
            <option value="sunny">晴朗干燥</option>
            <option value="cloudy">多云微凉</option>
            <option value="rainy" selected>可能有雨</option>
            <option value="cold">低温（<10°C）</option>
          </select>
        </div>
        <div class="form-group">
          <label>特殊需求</label>
          <div class="checkbox-group">
            <div class="checkbox-item">
              <input type="checkbox" id="with-kids" />
              <label for="with-kids">带儿童</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="with-pet" />
              <label for="with-pet">带宠物</label>
            </div>
          </div>
        </div>
        <button id="generate-btn" class="btn">▶️ 生成我的清单</button>
      </section>

      <section class="list-container" id="list-section">
        <div class="card">
          <div class="list-header">
            <h2 class="list-title">✅ 你的专属清单（共<span id="item-count">0</span>项）</h2>
            <button id="copy-btn" class="copy-btn">📋 复制到微信</button>
          </div>
          <ul class="item-list" id="item-list">
            <li class="empty-state">清单将在此处生成...</li>
          </ul>
        </div>
      </section>
    </main>
  </div>

  <button id="theme-toggle" class="theme-toggle" aria-label="切换深色/浅色模式">☀️</button>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('theme-toggle');
    const body = document.body;

    function setTheme(isDark) {
      if (isDark) {
        body.classList.add('dark-theme');
        themeToggle.innerHTML = '🌙';
      } else {
        body.classList.remove('dark-theme');
        themeToggle.innerHTML = '☀️';
      }
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    // 初始化主题
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      setTheme(true);
    } else {
      setTheme(false);
    }

    themeToggle.addEventListener('click', () => {
      const isDark = body.classList.contains('dark-theme');
      setTheme(!isDark);
    });

    // 清单生成逻辑
    const generateBtn = document.getElementById('generate-btn');
    const listSection = document.getElementById('list-section');
    const itemList = document.getElementById('item-list');
    const itemCount = document.getElementById('item-count');
    const copyBtn = document.getElementById('copy-btn');

    // 基础装备库（按优先级分组）
    const baseItems = [
      { name: "帐篷及地钉", note: "含防风绳、修补胶带" },
      { name: "睡袋", note: "根据气温选择舒适温标" },
      { name: "防潮垫/充气垫", note: "必备，隔绝地面湿冷" },
      { name: "头灯/营地灯", note: "带备用电池" },
      { name: "折叠水杯", note: "推荐带盖款，防尘防洒" },
      { name: "餐具套装", note: "含碗、筷、勺、小刀" },
      { name: "垃圾袋（加厚）", note: "至少2个，分类打包" }
    ];

    const weatherItems = {
      sunny: [
        { name: "防晒霜（SPF50+）", note: "补涂提醒：每2小时一次" },
        { name: "遮阳帽 & 墨镜", note: "防紫外线必备" }
      ],
      cloudy: [
        { name: "轻量防风外套", note: "应对午后降温" }
      ],
      rainy: [
        { name: "防水背包罩", note: "或直接用大号密封袋" },
        { name: "速干毛巾", note: "吸水快、易拧干" },
        { name: "备用打火石", note: "潮湿环境下比打火机可靠" }
      ],
      cold: [
        { name: "保暖中层（抓绒/羽绒）", note: "贴身保暖关键" },
        { name: "暖宝宝（10片）", note: "贴于腰腹/足底" }
      ]
    };

    const optionalItems = [
      { name: "便携炉具 & 气罐", note: "确认营地允许明火" },
      { name: "滤水器/净水药片", note: "溪水需净化再饮用" },
      { name: "折叠椅", note: "提升营地舒适度" }
    ];

    const kidItems = [
      { name: "儿童防蚊贴/驱蚊液", note: "避开眼口，低龄慎用喷雾" },
      { name: "儿童保温水壶", note: "防烫设计更安全" },
      { name: "简易玩具/绘本", note: "安抚等待时间" }
    ];

    const petItems = [
      { name: "宠物牵引绳 & 拾便袋", note: "文明露营必备" },
      { name: "宠物便携食盆", note: "避免共用餐具" },
      { name: "宠物驱虫喷雾", note: "出发前24小时使用" }
    ];

    function generateList() {
      const people = parseInt(document.getElementById('people').value) || 2;
      const days = document.getElementById('days').value;
      const weather = document.getElementById('weather').value;
      const withKids = document.getElementById('with-kids').checked;
      const withPet = document.getElementById('with-pet').checked;

      let items = [...baseItems];

      // 添加天气相关项
      if (weatherItems[weather]) {
        items = items.concat(weatherItems[weather]);
      }

      // 添加儿童项
      if (withKids) {
        items = items.concat(kidItems);
      }

      // 添加宠物项
      if (withPet) {
        items = items.concat(petItems);
      }

      // 添加可选项（2天及以上默认添加）
      if (days >= 2) {
        items = items.concat(optionalItems);
      }

      // 去重（按name去重，保留第一个）
      const seenNames = new Set();
      const uniqueItems = [];
      for (const item of items) {
        if (!seenNames.has(item.name)) {
          seenNames.add(item.name);
          uniqueItems.push(item);
        }
      }

      // 渲染列表
      itemList.innerHTML = '';
      uniqueItems.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = 'item';
        li.innerHTML = `
          <input type="checkbox" id="item-${index}" class="item-checkbox" checked>
          <div class="item-content">
            <div class="item-name">${item.name}</div>
            <div class="item-note">${item.note}</div>
          </div>
        `;
        itemList.appendChild(li);
      });

      itemCount.textContent = uniqueItems.length;
      listSection.classList.add('show');
    }

    generateBtn.addEventListener('click', generateList);

    // 复制功能
    copyBtn.addEventListener('click', () => {
      const items = Array.from(itemList.querySelectorAll('.item'));
      if (items.length === 0) return;

      const lines = items.map(li => {
        const name = li.querySelector('.item-name').textContent;
        const checked = li.querySelector('.item-checkbox').checked;
        return `${checked ? '✅' : '⬜'} ${name}`;
      });

      const text = `【我的露营清单】\n${lines.join('\n')}\n\n💡 小贴士：出发前1小时再核对一遍！`;
      
      navigator.clipboard.writeText(text)
        .then(() => {
          const originalText = copyBtn.textContent;
          copyBtn.textContent = '✓ 已复制！';
          setTimeout(() => {
            copyBtn.textContent = originalText;
          }, 2000);
        })
        .catch(err => {
          console.error('复制失败:', err);
        });
    });

    // 初始化时生成一次默认清单
    window.addEventListener('DOMContentLoaded', () => {
      generateList();
    });
  </script>
</body>
</html>
