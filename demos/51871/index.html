<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>校园外卖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            -webkit-tap-highlight-color: transparent;
        }
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .tab-active {
            color: #ff6b35;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .cart-bounce {
            animation: cartBounce 0.3s ease;
        }
        @keyframes cartBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        .modal-enter {
            animation: modalEnter 0.2s ease-out;
        }
        @keyframes modalEnter {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="max-w-md mx-auto bg-gray-50 min-h-screen relative">

        let cart = [];
        let orders = [];
        let currentCategory = 'all';
        let currentMerchant = null;
        let currentOrderFilter = 'all';

        function loadData() {
            try {
                const savedCart = localStorage.getItem('campus_cart');
                if (savedCart) cart = JSON.parse(savedCart);
                const savedOrders = localStorage.getItem('campus_orders');
                if (savedOrders) orders = JSON.parse(savedOrders);
            } catch (e) {
                console.error('Failed to load data:', e);
            }
        }

        function saveCart() {
            try {
                localStorage.setItem('campus_cart', JSON.stringify(cart));
            } catch (e) {
                console.error('Failed to save cart:', e);
            }
        }

        function saveOrders() {
            try {
                localStorage.setItem('campus_orders', JSON.stringify(orders));
            } catch (e) {
                console.error('Failed to save orders:', e);
            }
        }

        function renderMerchants() {
            const list = document.getElementById('merchant-list');
            const filtered = currentCategory === 'all' 
                ? merchants 
                : merchants.filter(m => m.category === currentCategory);
            
            list.innerHTML = filtered.map(m => `
                <div onclick="openMerchantDetail(${m.id})" class="bg-white rounded-xl p-3 shadow-sm active:opacity-80 transition-opacity">

                        <img src="${m.image}" class="w-20 h-20 rounded-lg object-cover" alt="${m.name}">
                        <div class="flex-1">
                            <div class="flex items-center justify-between">

                                <span class="text-xs text-orange-500 font-medium">${m.rating}分</span>
                            </div>
                            <p class="text-xs text-gray-400 mt-1">${m.deliveryTime} | 配送费 ¥${m.deliveryFee}</p>
                            <p class="text-xs text-gray-400">起送 ¥${m.minOrder}</p>
                            <div class="mt-2 flex items-center">
                                <span class="text-xs bg-orange-50 text-orange-500 px-2 py-0.5 rounded">${m.category}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-orange-500', 'text-white');
                btn.classList.add('bg-gray-100', 'text-gray-600');
            });
            event.target.classList.remove('bg-gray-100', 'text-gray-600');
            event.target.classList.add('bg-orange-500', 'text-white');
            renderMerchants();
        }

        function openMerchantDetail(id) {
            currentMerchant = merchants.find(m => m.id === id);
            if (!currentMerchant) return;
            
            document.getElementById('detail-title').textContent = currentMerchant.name;
            document.getElementById('detail-subtitle').textContent = `${currentMerchant.rating}分 | ${currentMerchant.deliveryTime}`;
            document.getElementById('delivery-fee').textContent = currentMerchant.deliveryFee;
            document.getElementById('min-order').textContent = currentMerchant.minOrder;
            
            const categories = [...new Set(currentMerchant.foods.map(f => f.category))];
            document.getElementById('food-categories').innerHTML = categories.map(c => 
                `<button onclick="filterFoodCategory('${c}')" class="food-cat-btn active px-3 py-1 bg-orange-500 text-white rounded-full text-xs whitespace-nowrap">${c}</button>`
            ).join('');
            
            renderFoods(currentMerchant.foods);
            document.getElementById('merchant-detail').classList.remove('hidden');
        }

        function filterFoodCategory(category) {
            document.querySelectorAll('.food-cat-btn').forEach(btn => {
                btn.classList.remove('bg-orange-500', 'text-white');
                btn.classList.add('bg-gray-100', 'text-gray-600');
            });
            event.target.classList.remove('bg-gray-100', 'text-gray-600');
            event.target.classList.add('bg-orange-500', 'text-white');
            
            const filtered = category === '全部' 
                ? currentMerchant.foods 
                : currentMerchant.foods.filter(f => f.category === category);
            renderFoods(filtered);
        }

        function renderFoods(foods) {
            const list = document.getElementById('food-list');
            list.innerHTML = foods.map(f => {
                const cartItem = cart.find(c => c.foodId === f.id);
                const count = cartItem ? cartItem.count : 0;
                return `
                    <div class="flex space-x-3 bg-gray-50 rounded-lg p-3">
                        <img src="${f.image}" class="w-16 h-16 rounded-lg object-cover" alt="${f.name}">
                        <div class="flex-1">
                            <div class="flex items-start justify-between">
                                <h4 class="font-medium text-gray-800">${f.name}</h4>
                                <span class="text-red-500 font-bold">¥${f.price}</span>
                            </div>
                            <p class="text-xs text-gray-400 mt-1">${f.category}</p>
                        </div>
                        <div class="flex flex-col justify-end">
                            ${count > 0 ? `
                                <div class="flex items-center space-x-2">
                                    <button onclick="updateCart(${f.id}, -1)" class="w-6 h-6 bg-white border rounded-full flex items-center justify-center text-gray-600">-</button>
                                    <span class="w-6 text-center text-sm">${count}</span>
                                    <button onclick="updateCart(${f.id}, 1)" class="w-6 h-6 bg-orange-500 text-white rounded-full flex items-center justify-center">+</button>
                                </div>
                            ` : `
                                <button onclick="updateCart(${f.id}, 1)" class="w-6 h-6 bg-orange-500 text-white rounded-full flex items-center justify-center cart-bounce">+</button>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function closeMerchantDetail() {
            document.getElementById('merchant-detail').classList.add('hidden');
            currentMerchant = null;
        }

        function updateCart(foodId, change) {
            const food = currentMerchant.foods.find(f => f.id === foodId);
            if (!food) return;

            const existing = cart.find(c => c.foodId === foodId);
            if (existing) {
                existing.count += change;
                if (existing.count <= 0) {
                    cart = cart.filter(c => c.foodId !== foodId);
                }
            } else {
                cart.push({
                    foodId,
                    merchantId: currentMerchant.id,
                    merchantName: currentMerchant.name,
                    name: food.name,
                    price: food.price,
                    image: food.image,
                    count: 1
                });
            }
            saveCart();
            updateCartUI();
            if (currentMerchant) {
                renderFoods(currentMerchant.foods);
            }
        }

        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            const totalCount = cart.reduce((sum, item) => sum + item.count, 0);
            if (totalCount > 0) {
                badge.textContent = totalCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
            renderCartPage();
        }

        function renderCartPage() {
            const items = document.getElementById('cart-items');
            const empty = document.getElementById('cart-empty');
            const footer = document.getElementById('cart-footer');
            const total = document.getElementById('cart-total');

            if (cart.length === 0) {
                items.innerHTML = '';
                empty.classList.remove('hidden');
                footer.classList.add('hidden');
                total.textContent = '0.00';
                return;
            }

            empty.classList.add('hidden');
            footer.classList.remove('hidden');

            const merchantGroups = {};
            cart.forEach(item => {
                if (!merchantGroups[item.merchantId]) {
                    merchantGroups[item.merchantId] = {
                        name: item.merchantName,
                        items: []
                    };
                }
                merchantGroups[item.merchantId].items.push(item);
            });

            let html = '';
            let totalPrice = 0;

            Object.values(merchantGroups).forEach(group => {
                html += `
                    <div class="bg-white rounded-xl overflow-hidden shadow-sm">
                        <div class="px-4 py-2 bg-gray-50 border-b">
                            <span class="text-sm font-medium text-gray-700">${group.name}</span>
                        </div>
                        <div class="divide-y divide-gray-50">
                            ${group.items.map(item => {
                                totalPrice += item.price * item.count;
                                return `
                                    <div class="flex items-center space-x-3 p-4">
                                        <img src="${item.image}" class="w-14 h-14 rounded-lg object-cover" alt="${item.name}">
                                        <div class="flex-1">
                                            <h4 class="font-medium text-gray-800 text-sm">${item.name}</h4>
                                            <span class="text-red-500 font-bold text-sm">¥${item.price}</span>
                                        </div>
                                        <div class="flex items-center space-x-2">
                                            <button onclick="removeFromCart(${item.foodId})" class="text-gray-400 text-sm">删除</button>
                                            <div class="flex items-center border rounded-full">
                                                <button onclick="updateCartFromList(${item.foodId}, -1)" class="w-6 h-6 flex items-center justify-center text-gray-600">-</button>
                                                <span class="w-6 text-center text-sm">${item.count}</span>
                                                <button onclick="updateCartFromList(${item.foodId}, 1)" class="w-6 h-6 flex items-center justify-center text-gray-600">+</button>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            });

            items.innerHTML = html;
            total.textContent = totalPrice.toFixed(2);
        }

        function updateCartFromList(foodId, change) {
            const item = cart.find(c => c.foodId === foodId);
            if (item) {
                item.count += change;
                if (item.count <= 0) {
                    cart = cart.filter(c => c.foodId !== foodId);
                }
                saveCart();
                updateCartUI();
            }
        }

        function removeFromCart(foodId) {
            cart = cart.filter(c => c.foodId !== foodId);
            saveCart();
            updateCartUI();
        }

        function checkout() {
            if (cart.length === 0) {
                showToast('购物车是空的');
                return;
            }
            createOrder();
        }

        function checkoutFromDetail() {
            const merchantItems = cart.filter(c => c.merchantId === currentMerchant.id);
            if (merchantItems.length === 0) {
                showToast('请先添加菜品');
                return;
            }
            createOrder();
        }

        function createOrder() {
            const total = cart.reduce((sum, item) => sum + item.price * item.count, 0);
            const order = {
                id: Date.now(),
                time: new Date().toLocaleString(),
                total: total,
                items: [...cart],
                status: 'preparing'
            };
            orders.unshift(order);
            saveOrders();
            cart = [];
            saveCart();
            updateCartUI();
            closeMerchantDetail();
            document.getElementById('success-modal').classList.remove('hidden');
        }

        function closeSuccessModal() {
            document.getElementById('success-modal').classList.add('hidden');
            switchTab('orders');
        }

        function renderOrders() {
            const list = document.getElementById('order-list');
            let filtered = orders;
            if (currentOrderFilter !== 'all') {
                filtered = orders.filter(o => o.status === currentOrderFilter);
            }

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20">
                        <span class="text-5xl mb-4">📦</span>
                        <p class="text-gray-400">暂无订单</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = filtered.map(order => `
                <div class="bg-white rounded-xl overflow-hidden shadow-sm">
                    <div class="px-4 py-3 border-b flex justify-between items-center">
                        <span class="text-sm text-gray-400">订单号：${order.id}</span>
                        <span class="text-sm ${getStatusColor(order.status)}">${getStatusText(order.status)}</span>
                    </div>
                    <div class="p-4">
                        ${order.items.map(item => `
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-sm text-gray-700">${item.name} x${item.count}</span>
                                <span class="text-sm text-gray-500">¥${item.price * item.count}</span>
                            </div>
                        `).join('')}
                        <div class="pt-2 border-t flex justify-between items-center">
                            <span class="text-sm text-gray-500">共${order.items.reduce((sum, i) => sum + i.count, 0)}件商品</span>
                            <span class="text-red-500 font-bold">实付 ¥${order.total.toFixed(2)}</span>
                        </div>
                    </div>
                    <div class="px-4 py-3 bg-gray-50 flex justify-end space-x-2">
                        ${order.status === 'preparing' ? `
                            <button onclick="cancelOrder(${order.id})" class="px-4 py-1.5 border rounded-full text-sm text-gray-600">取消订单</button>
                            <button onclick="confirmReceipt(${order.id})" class="px-4 py-1.5 bg-orange-500 text-white rounded-full text-sm">确认收货</button>
                        ` : order.status === 'completed' ? `
                            <button onclick="reorder(${order.id})" class="px-4 py-1.5 bg-orange-500 text-white rounded-full text-sm">再来一单</button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function getStatusText(status) {
            const map = {
                pending: '待付款',
                preparing: '制作中',
                delivering: '配送中',
                completed: '已完成'
            };
            return map[status] || status;
        }

        function getStatusColor(status) {
            const map = {
                pending: 'text-yellow-500',
                preparing: 'text-orange-500',
                delivering: 'text-blue-500',
                completed: 'text-green-500'
            };
            return map[status] || 'text-gray-500';
        }

        function filterOrders(status) {
            currentOrderFilter = status;
            document.querySelectorAll('.order-tab').forEach(tab => {
                tab.classList.remove('text-orange-500', 'font-medium');
                tab.classList.add('text-gray-500');
            });
            event.target.classList.remove('text-gray-500');
            event.target.classList.add('text-orange-500', 'font-medium');
            renderOrders();
        }

        function cancelOrder(id) {
            const order = orders.find(o => o.id === id);
            if (order) {
                order.status = 'cancelled';
                saveOrders();
                renderOrders();
                showToast('订单已取消');
            }
        }

        function confirmReceipt(id) {
            const order = orders.find(o => o.id === id);
            if (order) {
                order.status = 'completed';
                saveOrders();
                renderOrders();
                showToast('已确认收货');
            }
        }

        function reorder(id) {
            const order = orders.find(o => o.id === id);
            if (order) {
                order.items.forEach(item => {
                    const existing = cart.find(c => c.foodId === item.foodId);
                    if (existing) {
                        existing.count += item.count;
                    } else {
                        cart.push({ ...item });
                    }
                });
                saveCart();
                updateCartUI();
                switchTab('cart');
                showToast('已添加到购物车');
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.add('hidden'));
            document.getElementById(`${tab}-page`).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('tab-active');
            });
            event.target.classList.add('tab-active');

            if (tab === 'cart') {
                renderCartPage();
            } else if (tab === 'orders') {
                renderOrders();
            } else if (tab === 'home') {
                renderMerchants();
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2000);
        }

        function showNotification() {
            showToast('暂无新消息');
        }

        loadData();
        renderMerchants();
        updateCartUI();
    </script>
</body>
</html>
