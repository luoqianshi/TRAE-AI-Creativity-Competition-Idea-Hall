<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>记得TA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
/* ====================================================
   DESIGN SYSTEM - Warm Paper Journal
   ==================================================== */
:root {
  /* Paper & Background - Clean White */
  --paper: #FFFFFF;
  --paper-dark: #FFF8F5;
  --paper-fold: #FFE8E0;
  --paper-line: #FFE0D0;
  --paper-grain: rgba(255, 120, 50, 0.03);

  /* Text Colors */
  --ink: #2D1810;
  --ink-light: #5C3A28;
  --ink-faint: #9E7860;
  --ink-ghost: #D4A088;

  /* Primary Orange Accent */
  --primary: #FF6B35;
  --primary-light: #FF8C66;
  --primary-dark: #E5541F;
  --primary-glow: rgba(255, 107, 53, 0.1);
  --primary-dim: rgba(255, 107, 53, 0.08);

  /* Secondary */
  --gold: #FF9F1C;
  --gold-light: #FFB84D;
  --gold-dim: rgba(255, 159, 28, 0.1);
  --jade: #2EC4B6;
  --jade-light: #5DD9CD;
  --plum: #E0719D;

  /* UI */
  --border: rgba(255, 107, 53, 0.12);
  --border-light: rgba(255, 107, 53, 0.06);
  --shadow-sm: 0 2px 12px rgba(255, 107, 53, 0.06);
  --shadow-md: 0 4px 24px rgba(255, 107, 53, 0.08);
  --shadow-lg: 0 8px 48px rgba(255, 107, 53, 0.1);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
  --transition: all 0.25s ease;
  --transition-slow: all 0.5s cubic-bezier(0.4,0,0.2,1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

/* Lucide icon base styles */
.icon-sm {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  font-size: 16px;
  stroke-width: 1.8;
}

.icon-sm svg {
  width: 100%;
  height: 100%;
}

/* Primary color for icons */
.icon-primary { color: var(--primary); }
.icon-gold { color: var(--gold); }
.icon-ink { color: var(--ink); }
.icon-ghost { color: var(--ink-ghost); }

/* Large icons */
.icon-lg {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  font-size: 20px;
}

/* Avatar icon wrapper */
.avatar-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--primary-glow);
  border: 1px solid rgba(255,107,53,0.15);
}

body {
  font-family: 'Noto Serif SC', serif;
  background: #FAFAFA;
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(circle at 30% 60%, rgba(255,107,53,0.04) 0%, transparent 50%),
    radial-gradient(circle at 70% 30%, rgba(255,159,28,0.03) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ====================================================
   APP SHELL
   ==================================================== */
.app {
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--paper);
  position: relative;
  z-index: 1;
  box-shadow: -8px 0 40px rgba(44,24,16,0.1), 8px 0 40px rgba(44,24,16,0.1);
}

.app::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--primary), transparent);
  opacity: 0.6;
}

/* Page transitions */
.page { display: none; }
.page.active { display: block; animation: pageIn 0.4s ease; }

@keyframes pageIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ====================================================
   HEADER - Left-aligned Title
   ==================================================== */
.header {
  padding: 24px 28px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-left { flex: 1; }

.header-left h1 {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 24px;
  color: var(--primary);
  letter-spacing: 3px;
  font-weight: 400;
  line-height: 1.2;
}

.header-sub {
  font-family: 'Cormorant Garamond', serif;
  font-size: 12px;
  color: var(--ink-ghost);
  margin-top: 3px;
  letter-spacing: 1px;
}

.header-actions {
  display: flex;
  gap: 8px;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--paper);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  cursor: pointer;
  transition: var(--transition);
  color: var(--ink-faint);
}

.icon-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: var(--primary-glow);
}

/* ====================================================
   PERSON TABS - Elegant Underline Style
   ==================================================== */
.person-tabs {
  display: flex;
  gap: 0;
  padding: 0 28px 20px;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--paper-line);
  scroll-snap-type: x mandatory;
}

.person-tabs::-webkit-scrollbar { display: none; }

.person-tab {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  font-size: 13px;
  color: var(--ink-faint);
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
  scroll-snap-align: start;
  position: relative;
}

.person-tab::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 50%;
  width: 0;
  height: 2px;
  background: var(--primary);
  transition: var(--transition);
  transform: translateX(-50%);
  border-radius: 2px;
}

.person-tab:hover { color: var(--ink-light); }
.person-tab:hover::after { width: 30%; }

.person-tab.active {
  color: var(--primary);
  font-weight: 600;
}

.person-tab.active::after { width: 60%; }

.person-tab .avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--paper-dark);
  border: 1px solid var(--paper-line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  transition: var(--transition);
}

.person-tab.active .avatar {
  background: var(--primary-glow);
  border-color: var(--primary);
}

/* ====================================================
   SECTION HEADERS
   ==================================================== */
.section-header {
  padding: 24px 28px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.section-label {
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px;
  color: var(--ink-ghost);
  text-transform: uppercase;
  letter-spacing: 3px;
  font-weight: 400;
}

.section-label::before {
  content: '— ';
  opacity: 0.5;
}

.section-label::after {
  content: ' —';
  opacity: 0.5;
}

.section-action {
  font-size: 12px;
  color: var(--primary);
  cursor: pointer;
  transition: var(--transition);
  opacity: 0.7;
}

.section-action:hover { opacity: 1; }

/* ====================================================
   RECOMMENDED FESTIVALS - Horizontal Scroll Cards
   ==================================================== */
.recommended-section {
  padding: 0 0 16px;
}

.recommended-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 10px;
  color: var(--ink-ghost);
  text-transform: uppercase;
  letter-spacing: 3px;
  padding: 0 28px 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.recommended-title::before {
  content: '';
  width: 16px;
  height: 1px;
  background: var(--ink-ghost);
  opacity: 0.5;
}

.recommended-list {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 0 28px;
  scrollbar-width: none;
  scroll-snap-type: x mandatory;
}

.recommended-list::-webkit-scrollbar { display: none; }

.recommended-card {
  flex-shrink: 0;
  width: 120px;
  scroll-snap-align: start;
  background: var(--paper-dark);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius);
  padding: 14px 12px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}

.recommended-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--primary);
  transform: scaleX(0);
  transition: var(--transition);
}

.recommended-card:hover {
  border-color: var(--primary);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.recommended-card:hover::before { transform: scaleX(1); }

.recommended-card .rec-emoji { font-size: 28px; margin-bottom: 6px; display: block; }

.recommended-card .rec-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 2px;
}

.recommended-card .rec-date {
  font-family: 'Cormorant Garamond', serif;
  font-size: 10px;
  color: var(--ink-ghost);
  margin-bottom: 8px;
}

.recommended-card .rec-add {
  font-size: 10px;
  color: var(--primary);
  font-weight: 600;
  display: inline-block;
  padding: 3px 10px;
  border: 1px solid var(--primary);
  border-radius: 20px;
  opacity: 0.7;
  transition: var(--transition);
}

.recommended-card:hover .rec-add { opacity: 1; background: var(--primary-glow); }

.recommended-card.added { opacity: 0.4; pointer-events: none; }

/* ====================================================
   REMINDER CARDS - Letter Style
   ==================================================== */
.reminder-list {
  padding: 0 28px 120px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.reminder-card {
  background: var(--paper);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius);
  padding: 18px 20px;
  cursor: pointer;
  transition: var(--transition-slow);
  position: relative;
  animation: cardIn 0.5s ease both;
  box-shadow: var(--shadow-sm);
}

.reminder-card::before {
  content: '';
  position: absolute;
  top: 12px;
  left: 20px;
  width: 24px;
  height: 2px;
  border-radius: 1px;
}

.reminder-card.type-birthday::before { background: var(--primary); }
.reminder-card.type-anniversary::before { background: var(--gold); }
.reminder-card.type-festival::before { background: var(--plum); }
.reminder-card.type-custom::before { background: var(--jade); }

.reminder-card:hover {
  border-color: var(--ink-ghost);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

.reminder-card.disabled { opacity: 0.45; filter: grayscale(0.3); }
.reminder-card.disabled .card-desc { text-decoration: line-through; text-decoration-color: var(--ink-ghost); }

.reminder-card .card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 6px;
  padding-left: 32px;
}

.reminder-card .card-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.4;
  flex: 1;
}

.reminder-card .card-date {
  font-family: 'Cormorant Garamond', serif;
  font-size: 12px;
  color: var(--ink-ghost);
  white-space: nowrap;
  margin-left: 10px;
  padding-top: 2px;
}

.reminder-card .card-date.near {
  color: var(--primary);
  font-weight: 600;
  position: relative;
}

.reminder-card .card-date.near::before {
  content: '◆ ';
  font-size: 8px;
}

.reminder-card .card-desc {
  font-size: 12px;
  color: var(--ink-faint);
  line-height: 1.6;
  margin-bottom: 10px;
  padding-left: 32px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.reminder-card .card-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding-left: 32px;
  align-items: center;
}

.reminder-card .tag {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 20px;
  background: var(--paper-dark);
  color: var(--ink-faint);
  border: 1px solid var(--paper-line);
}

/* Toggle switch - elegant ink style */
.toggle-switch {
  position: relative;
  width: 38px;
  height: 20px;
  flex-shrink: 0;
}

.toggle-switch input { opacity: 0; width: 0; height: 0; }

.toggle-slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--paper-dark);
  border: 1px solid var(--paper-line);
  border-radius: 20px;
  transition: var(--transition);
}

.toggle-slider::before {
  content: '';
  position: absolute;
  height: 14px;
  width: 14px;
  left: 2px;
  bottom: 2px;
  background: var(--ink-ghost);
  border-radius: 50%;
  transition: var(--transition);
}

.toggle-switch input:checked + .toggle-slider {
  background: var(--primary);
  border-color: var(--primary);
}

.toggle-switch input:checked + .toggle-slider::before {
  transform: translateX(18px);
  background: white;
}

/* ====================================================
   COUNTDOWN BADGE - Ink Stamp Style
   ==================================================== */
.countdown-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--ink);
  color: var(--paper);
  padding: 6px 16px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 13px;
  letter-spacing: 1px;
  font-weight: 400;

  margin: 0 auto 16px;
  display: flex;
  justify-content: center;
  width: fit-content;
}

.countdown-badge .count-num {
  font-family: 'Noto Serif SC', serif;
  font-size: 15px;
  font-weight: 700;
  font-style: normal;
  color: var(--gold-light);
}

/* ====================================================
   MODAL - Slide Up Card
   ==================================================== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(44,24,16,0.3);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 1000;
  display: none;
  align-items: flex-end;
  justify-content: center;
}

.modal-overlay.show { display: flex; }

.modal-content {
  background: var(--paper);
  width: 100%;
  max-width: 430px;
  max-height: 88vh;
  border-radius: 20px 20px 0 0;
  padding: 0;
  overflow: hidden;
  animation: modalUp 0.45s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 -8px 40px rgba(44,24,16,0.15);
}

.modal-content::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--primary), var(--gold), var(--primary));
}

@keyframes modalUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-handle {
  width: 40px;
  height: 4px;
  border-radius: 2px;
  background: var(--paper-line);
  margin: 12px auto 0;
}

.modal-scroll {
  padding: 16px 28px 40px;
  max-height: calc(88vh - 20px);
  overflow-y: auto;
}

.modal-title {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 26px;
  color: var(--ink);
  text-align: center;
  letter-spacing: 4px;
  margin-bottom: 4px;
}

.modal-subtitle {
  text-align: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 13px;
  color: var(--ink-ghost);

  margin-bottom: 20px;
}

/* Detail sections in modal */
.detail-section {
  background: var(--paper-dark);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-bottom: 12px;
}

.detail-section h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px;
  color: var(--primary);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 400;
}

.detail-section h3::before {
  content: '';
  width: 12px;
  height: 1px;
  background: var(--primary);
}

.detail-section p, .detail-section li {
  font-size: 13px;
  color: var(--ink-light);
  line-height: 1.8;
}

.detail-section ul { padding-left: 18px; }
.detail-section li { margin-bottom: 4px; }

.detail-section .highlight {
  color: var(--ink);
  font-weight: 600;
}

/* ====================================================
   AI SUGGESTIONS - Paper Note Style
   ==================================================== */
.ai-section {
  background: linear-gradient(135deg, #FFF8F5 0%, #FFF5F0 100%);
  border: 1px solid var(--paper-fold);
  border-left: 3px solid var(--primary);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-bottom: 12px;
  position: relative;
}

.ai-section h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px;
  color: var(--ink-ghost);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 400;
}

.ai-badge {
  font-size: 9px;
  background: var(--primary);
  color: white;
  padding: 1px 6px;
  border-radius: 2px;
  letter-spacing: 1px;
  font-family: 'Cormorant Garamond', serif;
}

.ai-tip {
  display: flex;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--paper-line);
  font-size: 12px;
  line-height: 1.7;
  color: var(--ink-light);
}

.ai-tip:last-child { border-bottom: none; }

.ai-tip .tip-icon {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--paper);
  border: 1px solid var(--paper-line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  margin-top: 1px;
}

.ai-tip .tip-content { flex: 1; }

.ai-tip .tip-label {
  font-size: 10px;
  color: var(--primary);
  font-weight: 600;
  margin-bottom: 2px;
  font-family: 'Cormorant Garamond', serif;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.ai-tip .tip-urgent { color: var(--primary); font-weight: 600; }

/* ====================================================
   CALENDAR - Editorial Grid
   ==================================================== */
.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 28px;
}

.calendar-title {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 20px;
  color: var(--ink);
  letter-spacing: 4px;
}

.calendar-nav {
  display: flex;
  gap: 6px;
}

.calendar-nav button {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--paper-line);
  background: var(--paper);
  cursor: pointer;
  font-size: 14px;
  color: var(--ink-faint);
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
}

.calendar-nav button:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: var(--primary-glow);
}

.calendar-grid { padding: 0 28px; }

.calendar-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  margin-bottom: 6px;
}

.calendar-weekdays span {
  font-family: 'Cormorant Garamond', serif;
  font-size: 10px;
  color: var(--ink-ghost);
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 6px 0;
}

.calendar-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}

.calendar-day {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  cursor: pointer;
  transition: var(--transition);
  font-size: 13px;
  color: var(--ink-light);
  background: transparent;
  position: relative;
}

.calendar-day:hover { background: var(--paper-dark); color: var(--ink); }

.calendar-day.today {
  background: var(--ink);
  color: var(--paper);
  font-weight: 600;
}

.calendar-day.other-month { color: var(--ink-ghost); opacity: 0.4; }

.calendar-day.has-event::after {
  content: '';
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--primary);
  position: absolute;
  bottom: 3px;
}

.calendar-day.today.has-event::after { background: var(--gold-light); }

.calendar-day.selected {
  background: var(--primary-glow);
  border: 1px solid var(--primary);
  color: var(--primary);
  font-weight: 600;
}

.calendar-day.today.selected { background: var(--primary); color: white; }

.calendar-events { padding: 16px 28px; }

.calendar-events h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px;
  color: var(--ink-ghost);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 12px;
}

.calendar-event-item {
  background: var(--paper-dark);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex;

.calendar-event-item:hover {

.calendar-event-dot {

}

.chat-person-selector { padding: 0 28px 14px; }

.chat-person-btn {

}

.chat-person-btn .avatar-lg {

.chat-person-btn .info { flex: 1; text-align: left; }

.chat-bubble {

@keyframes bubbleIn {

}

.chat-bubble.user {
  align-self: flex-end;

  color: var(--paper);
  border-radius: 16px 16px 4px 16px;
}

.chat-bubble.bot {
  align-self: flex-start;
  background: var(--paper-dark);
  color: var(--ink-light);
  border-radius: 16px 16px 16px 4px;
  border: 1px solid var(--paper-line);
}

.chat-bubble .bubble-meta {
  font-size: 10px;
  opacity: 0.4;
  margin-top: 4px;
  font-family: 'Cormorant Garamond', serif;
}

.chat-input-area {
  padding: 10px 28px 24px;
  display: flex;
  gap: 10px;
  background: linear-gradient(to top, var(--paper) 70%, transparent);
  border-top: 1px solid var(--paper-line);

  bottom: 0;
}

.chat-input {
  flex: 1;
  padding: 12px 16px;
  border-radius: 24px;
  border: 1px solid var(--paper-line);
  background: var(--paper-dark);
  font-size: 14px;
  color: var(--ink);

  transition: var(--transition);

}

.chat-input:focus { border-color: var(--primary); background: var(--paper); }
.chat-input::placeholder { color: var(--ink-ghost); font-family: 'Cormorant Garamond', serif; }

.chat-send {
  width: 46px;
  height: 46px;
  border-radius: 50%;

  background: var(--ink);
  color: var(--paper);
  font-size: 16px;

  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.chat-send:hover { background: var(--primary); transform: scale(1.05); }

.voice-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;

  color: var(--ink-faint);

  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.voice-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-glow); }
.voice-btn.recording { border-color: var(--primary); color: var(--primary); background: var(--primary-glow); animation: pulse 1s infinite; }

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

/* Quick action chips in chat */
.quick-actions { display: flex; gap: 6px; padding: 0 28px 10px; flex-wrap: wrap; }

.quick-action {

  color: var(--ink-faint);

  transition: var(--transition);
}

.quick-action:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-glow); }

/* Context chip */
.chat-context-bar { padding: 0 28px 8px; display: flex; align-items: center; gap: 8px; }

.context-chip {

  align-items: center;
  gap: 4px;
  padding: 4px 12px;
  background: var(--primary-glow);
  border: 1px solid rgba(255,107,53,0.2);
  border-radius: 20px;
  font-size: 11px;
  color: var(--primary);
  font-weight: 600;
}

/* ====================================================
   PEOPLE PAGE - Card List
   ==================================================== */
.person-list { padding: 0 28px 20px; display: flex; flex-direction: column; gap: 14px; }

.person-card {
  background: var(--paper);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius);
  padding: 18px;
  cursor: pointer;
  transition: var(--transition-slow);
  animation: cardIn 0.5s ease both;
  box-shadow: var(--shadow-sm);
}

.person-card:hover {
  border-color: var(--ink-ghost);

}

.person-card-top { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }

.person-avatar {

.person-detail-item {

/* ====================================================

.form-section { padding: 0 28px 24px; }

.form-group { margin-bottom: 16px; }

.form-group label {

.form-group input,

  font-size: 14px;
  color: var(--ink);
  outline: none;
  transition: var(--transition);

}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {

.form-group textarea { min-height: 80px; resize: vertical; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Template chips */
.template-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }

.template-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;

  border-radius: 20px;
  border: 1px solid var(--paper-line);
  background: var(--paper-dark);
  font-size: 11px;
  color: var(--ink-faint);
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
}

.template-chip:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-glow); }
.template-chip .chip-icon { font-size: 13px; }

/* Buttons */
.btn-primary {
  width: 100%;
  padding: 14px;
  border-radius: var(--radius);
  border: none;
  background: var(--ink);
  color: var(--paper);
  font-size: 14px;
  font-weight: 600;
  font-family: 'Noto Serif SC', serif;
  cursor: pointer;
  transition: var(--transition);
  letter-spacing: 2px;
}

.btn-primary:hover { background: var(--primary); }

.btn-secondary {
  width: 100%;
  padding: 13px;

  border: 1px solid var(--primary);
  background: transparent;
  color: var(--primary);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  margin-top: 8px;
}

.btn-secondary:hover { background: var(--primary-glow); }

/* ====================================================
   HOME CHAT BAR
   ==================================================== */
.home-chat-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;

}

.home-chat-bar .chat-hint {

  color: var(--ink-ghost);

  transition: var(--transition);

  display: flex;
  align-items: center;

}

.home-chat-bar .chat-hint:hover { border-color: var(--primary); color: var(--ink-faint); background: var(--paper); }

.home-chat-bar .chat-btn {
  width: 46px;
  height: 46px;

  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.home-chat-bar .chat-btn:hover { background: var(--ink); transform: scale(1.05); }

/* ====================================================
   PAGE HEADER WITH BACK
   ==================================================== */
.page-header {
  display: flex;
  align-items: center;
  padding: 20px 28px 8px;
  gap: 12px;
}

.back-btn {

/* ====================================================

   ==================================================== */
.person-selector-dropdown {

  justify-content: center;
}

.person-selector-dropdown.show { display: flex; }

.person-selector-content {

   ==================================================== */

   TOAST

   SCROLLBAR & ANIMATIONS

::-webkit-scrollbar { width: 3px; }

@keyframes cardIn {

.reminder-card:nth-child(1) { animation-delay: 0.05s; }

/* Mini button */

  align-items: center;

  padding: 5px 12px;

    const m = new Date().getMonth() + 1;
    if (m >= 3 && m <= 5) return 'spring';
    if (m >= 6 && m <= 8) return 'summer';
    if (m >= 9 && m <= 11) return 'autumn';
    return 'winter';
  },

  // 获取当前节气/节日
  getSolarTerm() {
    const m = new Date().getMonth() + 1;
    const d = new Date().getDate();
    const terms = {
      '1-1': '元旦', '2-14': '情人节', '3-8': '女神节', '4-1': '愚人节',
      '5-1': '劳动节', '5-4': '青年节', '6-1': '儿童节', '6-18': '618',
      '7-1': '建党节', '8-1': '建军节', '9-10': '教师节', '10-1': '国庆',
      '11-11': '双十一', '12-24': '平安夜', '12-25': '圣诞节'
    };
    const key = `${m}-${d}`;
    if (terms[key]) return terms[key];
    if (m === 3 && d >= 20) return '春分';
    if (m === 6 && d >= 21) return '夏至';
    if (m === 9 && d >= 23) return '秋分';
    if (m === 12 && d >= 22) return '冬至';
    if (m === 8 && (d === 7 || d === 8)) return '立秋';
    if (m === 2 && d >= 4) return '立春';
    if (m === 5 && d >= 5) return '立夏';
    if (m === 11 && d >= 7) return '立冬';
    return null;

        '平安夜': { icon: '<i data-lucide="apple" class="icon-sm"></i>', text: '平安夜，记得给' + p.name + '送个苹果', type: 'gift' },
        '圣诞节': { icon: '<i data-lucide="tree-pine" class="icon-sm"></i>', text: '圣诞节到啦，给' + p.name + '准备圣诞礼物了吗？', type: 'gift' },
        '元旦': { icon: '<i data-lucide="sparkles" class="icon-sm"></i>', text: '新年的第一天，给' + p.name + '送上新年的第一声祝福', type: 'interaction' },
        '教师节': { icon: '<i data-lucide="book-open" class="icon-sm"></i>', text: '教师节，如果' + p.name + '是老师或者曾经是老师，别忘了问候', type: 'interaction' }
      };
      if (solarTips[solar]) {
        suggestions.push({ ...solarTips[solar], category: 'solar', title: solar });
      }
    }

    // ---- 4. 久未联系关怀 ----
    if (cfg.interaction) {
      const lastContact = p.lastContact ? new Date(p.lastContact) : null;
      let daysSince = null;
      if (lastContact) {
        daysSince = Math.floor((now - lastContact) / (1000 * 60 * 60 * 24));
      }

      if (!lastContact || daysSince > 7) {
        const msg = !lastContact
          ? '还没有记录和' + p.name + '的联系，最近可以打个电话关心一下'
          : '已经和' + p.name + (daysSince > 30 ? '好久没联系了' : '有' + daysSince + '天没联系了') + '，要不要主动关心一下？';
        suggestions.push({
          icon: '<i data-lucide="phone" class="icon-sm"></i>',
          text: msg,
          type: 'interaction',
          category: 'interaction',
          daysSince
        });
      }
    }

    // ---- 5. 根据喜好推荐小礼物 ----
    if (cfg.gift && p.likes) {
      const likes = p.likes.toLowerCase();
      const giftByLike = [
        { keywords: ['咖啡', '奶茶', '饮料'], icon: '<i data-lucide="cup-soda" class="icon-sm"></i>', tip: p.name + '喜欢喝咖啡/奶茶，可以请' + p.name + '喝一杯' },
        { keywords: ['花', '玫瑰', '绿植'], icon: '<i data-lucide="flower" class="icon-sm"></i>', tip: p.name + '喜欢花，可以送一束鲜花或者绿植' },
        { keywords: ['猫', '狗', '宠物'], icon: '<i data-lucide="cat" class="icon-sm"></i>', tip: '可以给' + p.name + '买宠物相关的小礼物或零食' },
        { keywords: ['书', '阅读'], icon: '<i data-lucide="book-open" class="icon-sm"></i>', tip: p.name + '喜欢阅读，可以送一本好书' },
        { keywords: ['巧克力', '甜食', '蛋糕'], icon: '<i data-lucide="candy" class="icon-sm"></i>', tip: '甜甜的礼物最适合，可以送巧克力或蛋糕' },
        { keywords: ['香水'], icon: '<i data-lucide="flower" class="icon-sm"></i>', tip: '可以送一瓶心仪的香水' },
        { keywords: ['首饰', '项链', '耳环'], icon: '<i data-lucide="gem" class="icon-sm"></i>', tip: '精致的首饰是送女生不出错的选择' },
        { keywords: ['手表'], icon: '⌚', tip: '一块好手表是不错的礼物' },
        { keywords: ['化妆品', '口红', '护肤品'], icon: '<i data-lucide="lipstick" class="icon-sm"></i>', tip: '可以送化妆品或护肤品套装' }
      ];
      for (const item of giftByLike) {
        if (item.keywords.some(k => likes.includes(k))) {
          suggestions.push({ icon: item.icon, text: item.tip, type: 'gift', category: 'gift' });
          break;
        }
      }
    }

    // ---- 6. 恋人专属 ----
    if (p.relation === '恋人' && cfg.interaction) {
      const loverTips = [
        { icon: '<i data-lucide="mail" class="icon-sm"></i>', text: '给' + p.name + '写一封手写信，现代人的浪漫稀缺品' },
        { icon: '<i data-lucide="clapperboard" class="icon-sm"></i>', text: '最近有什么好看的电影吗？可以约' + p.name + '一起去看' },
        { icon: '<i data-lucide="utensils" class="icon-sm"></i>', text: '最近有没有好好约会？可以计划一顿浪漫晚餐' },
        { icon: '<i data-lucide="message-circle" class="icon-sm"></i>', text: '主动说一些甜蜜的话，比如"' + p.name + '今天真好看"', type: 'interaction' }
      ];
      const tip = loverTips[Math.floor(Math.random() * loverTips.length)];
      suggestions.push({ ...tip, category: 'lover' });
    }

    // ---- 7. 妈妈专属 ----
    if (p.relation === '妈妈' && cfg.interaction) {
      const momTips = [
        { icon: '<i data-lucide="phone" class="icon-sm"></i>', text: '给妈妈打个电话吧，她一定在等你联系' },
        { icon: '<i data-lucide="home" class="icon-sm"></i>', text: '有时间回家看看，妈妈一定很开心' },
        { icon: '<i data-lucide="flower" class="icon-sm"></i>', text: '可以给妈妈送一束康乃馨，她会非常感动' },
        { icon: '<i data-lucide="droplet" class="icon-sm"></i>', text: '可以给妈妈买一些保养品或护肤品' }
      ];
      const tip = momTips[Math.floor(Math.random() * momTips.length)];
      suggestions.push({ ...tip, category: 'family' });
    }

    // 打乱顺序，只取前3条
    return suggestions.sort(() => Math.random() - 0.5).slice(0, 3);
  }
};

function renderCare() {
  const section = document.getElementById('careSection');
  if (data.people.length === 0) { section.innerHTML = ''; return; }

  const allSuggestions = [];

  data.people.forEach(p => {
    if (p.careEnabled === false) return; // 被禁用则跳过
    const suggestions = CareEngine.generate(p);
    suggestions.forEach(s => {
      allSuggestions.push({ ...s, person: p });
    });
  });

  if (allSuggestions.length === 0) {
    section.innerHTML = '';
    return;
  }

  // 只显示前3条
  const show = allSuggestions.slice(0, 3);

  section.innerHTML = `
    <div class="care-card" style="overflow:hidden;">
      <div class="care-card-header">
        <span class="care-icon"><i data-lucide="lightbulb" class="icon-sm"></i></span>
        <h4>AI 关爱</h4>
        <div class="care-pages" id="carePages">
          ${show.map((_, i) => `<div class="care-dot ${i === 0 ? 'active' : ''}" onclick="switchCare(${i})"></div>`).join('')}
        </div>
        <div class="care-arrows">
          <span class="care-arrow prev" id="carePrev" onclick="prevCare()">‹</span>
          <span class="care-arrow next" id="careNext" onclick="nextCare()">›</span>
        </div>
      </div>
      <div class="care-carousel" id="careCarousel">
        ${show.map((s, i) => `
          <div class="care-card-slide ${i === 0 ? 'active' : ''}" data-idx="${i}">
            <div class="care-item" onclick="careActions[${i}]()">
              <div class="care-item-left">
                <div class="care-item-avatar">${s.person.emoji}</div>
              </div>
              <div class="care-item-body">
                <div class="care-item-person">${s.person.name} · ${s.person.relation}</div>
                <div class="care-item-text">${s.icon} ${s.text}</div>
              </div>
              <div class="care-item-action">${s.type === 'interaction' ? '<i data-lucide="phone" class="icon-sm"></i>' : s.type === 'gift' ? '<i data-lucide="gift" class="icon-sm"></i>' : s.type === 'health' ? '<i data-lucide="pill" class="icon-sm"></i>' : '<i data-lucide="sparkles" class="icon-sm"></i>'}</div>
            </div>
          </div>
        `).join('')}
      </div>
      <div style="text-align:center;margin-top:10px;">
        <span class="mini-btn" onclick="navigateTo('people')">设置关怀偏好 →</span>
      </div>
    </div>
  `;

  window.careActions = show.map(s => () => {
    selectedPersonId = s.person.id;
    navigateTo('chat');
  });

  window.careTotal = show.length;
  window.careCurrentIdx = 0;
  window.careTouchStartX = 0;
  window.careTouchStartY = 0;

  const carousel = document.getElementById('careCarousel');
  if (carousel) {
    carousel.addEventListener('touchstart', careTouchStart, { passive: true });
    carousel.addEventListener('touchend', careTouchEnd, { passive: false });
  }
}

function careTouchStart(e) {
  window.careTouchStartX = e.changedTouches[0].clientX;
  window.careTouchStartY = e.changedTouches[0].clientY;
}

function careTouchEnd(e) {
  const endX = e.changedTouches[0].clientX;
  const endY = e.changedTouches[0].clientY;
  const diffX = endX - window.careTouchStartX;
  const diffY = Math.abs(endY - window.careTouchStartY);

  // 只响应水平滑动（排除垂直滚动）
  if (Math.abs(diffX) < 40 || diffY > Math.abs(diffX)) return;

  if (diffX < 0) nextCare();
  else prevCare();
}

function nextCare() {
  const total = window.careTotal || 1;
  window.careCurrentIdx = (window.careCurrentIdx + 1) % total;
  updateCareCarousel();
}

function prevCare() {
  const total = window.careTotal || 1;
  window.careCurrentIdx = (window.careCurrentIdx - 1 + total) % total;
  updateCareCarousel();
}

function switchCare(idx) {
  window.careCurrentIdx = idx;
  updateCareCarousel();
}

function updateCareCarousel() {
  const slides = document.querySelectorAll('.care-card-slide');
  const dots = document.querySelectorAll('.care-dot');
  slides.forEach((s, i) => s.classList.toggle('active', i === window.careCurrentIdx));
  dots.forEach((d, i) => d.classList.toggle('active', i === window.careCurrentIdx));
}

function renderPersonTabs() {
  const tabs = document.getElementById('personTabs');
  if (data.people.length === 0) { tabs.innerHTML = ''; return; }
  if (selectedPersonId !== 'all' && !data.people.find(p => p.id === selectedPersonId)) {
    selectedPersonId = 'all';
  }
  tabs.innerHTML = `<div class="person-tab ${selectedPersonId === 'all' ? 'active' : ''}" onclick="selectPerson('all')">
      <div class="avatar"><i data-lucide="star" class="icon-sm"></i></div>
      <span>全部</span>
    </div>` +
    data.people.map(p =>
    `<div class="person-tab ${p.id === selectedPersonId ? 'active' : ''}" onclick="selectPerson('${p.id}')">

      <span>${p.name}</span>
    </div>`
  ).join('');
}

function selectPerson(id) {
  selectedPersonId = id;
  renderPersonTabs();
  renderReminders();
  renderRecommended();
}

function renderRecommended() {
  const section = document.getElementById('recommendedSection');
  const list = document.getElementById('recommendedList');
  if (selectedPersonId === 'all' || !selectedPersonId) { section.style.display = 'none'; return; }
  const now = new Date();
  const currentYear = now.getFullYear();
  const upcoming = festivalTemplates.filter(f => {
    if (!f.date) return false;
    const [m, d] = f.date.split('-').map(Number);
    const eventDate = new Date(currentYear, m - 1, d);
    if (eventDate < now) return false;
    const daysUntil = Math.ceil((eventDate - now) / (1000 * 60 * 60 * 24));
    return daysUntil <= 60;
  });
  const added = data.reminders.filter(r => r.personId === selectedPersonId).map(r => r.title);
  const toShow = upcoming.filter(f => !added.some(t => t.includes(f.name)));
  if (toShow.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  list.innerHTML = toShow.map(f => {
    const [m, d] = f.date.split('-').map(Number);
    const dStr = `${m}月${d}日`;
    return `<div class="recommended-card" onclick="addFestival('${f.name}','${f.date}','${f.type}','${f.desc}','${f.gifts}','${f.words}','${f.surprise}')">
      <span class="rec-emoji">${f.emoji}</span>
      <div class="rec-name">${f.name}</div>
      <div class="rec-date">${dStr}</div>
      <div class="rec-add">+ 添加</div>
    </div>`;
  }).join('');
}

function addFestival(name, date, type, desc, gifts, words, surprise) {
  const id = 'rf_' + Date.now();
  data.reminders.push({
    id, personId: selectedPersonId, title: name, type, date, desc, gifts, words, surprise, enabled: true
  });
  saveData();
  renderRecommended();
  renderReminders();
  showToast('已添加：' + name);
}

function renderReminders() {
  const list = document.getElementById('reminderList');
  if (data.people.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon"><i data-lucide="sticky-note" class="icon-sm"></i></div><p>请先添加一个重要的人</p></div>';
    return;
  }
  let reminders = selectedPersonId === 'all'
    ? data.reminders
    : data.reminders.filter(r => r.personId === selectedPersonId);

  // 显示所属人名
  reminders = reminders.map(r => {
    const person = data.people.find(p => p.id === r.personId);
    return { ...r, personName: person ? person.name : '', personEmoji: person ? person.emoji : '' };
  });

  reminders = reminders.sort((a, b) => {
    if (a.enabled !== b.enabled) return b.enabled ? 1 : -1;
    return getDaysUntil(a.date) - getDaysUntil(b.date);
  });

  if (reminders.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon"><i data-lucide="sparkles" class="icon-sm"></i></div><p>还没有提醒，<br>在下方对话中告诉我想添加什么</p></div>';
    return;
  }

  list.innerHTML = reminders.map(r => {
    const days = getDaysUntil(r.date);
    const isNear = days <= 14;
    const dateStr = formatDateDisplay(r.date);
    const personTag = selectedPersonId === 'all' ? `<span class="tag" style="background:var(--gold-dim);border-color:rgba(255,159,28,0.3)">${r.personEmoji} ${r.personName}</span>` : '';
    return `<div class="reminder-card type-${r.type} ${r.enabled ? '' : 'disabled'}" onclick="showReminderDetail('${r.id}')">
      <div class="card-top">
        <div class="card-title">${r.title}</div>
        <div class="card-date ${isNear ? 'near' : ''}">${dateStr}</div>
      </div>
      <div class="card-desc">${r.desc || '暂无描述'}</div>
      <div class="card-tags">
        ${personTag}
        <span class="tag">${getTypeName(r.type)}</span>
        ${isNear ? '<span class="tag" style="color:var(--primary);border-color:var(--primary)">' + days + '天后</span>' : ''}
        <div class="toggle-switch" style="margin-left:auto" onclick="event.stopPropagation()">
          <input type="checkbox" ${r.enabled ? 'checked' : ''} onchange="toggleReminder('${r.id}',this.checked)">
          <span class="toggle-slider"></span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleReminder(id, enabled) {
  const r = data.reminders.find(r => r.id === id);
  if (r) { r.enabled = enabled; saveData(); }
  setTimeout(renderReminders, 100);
}

function closeModal() { document.getElementById('reminderModal').classList.remove('show'); }
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('modal-overlay')) closeModal();
});

function editReminder(id) {
  closeModal();
  const r = data.reminders.find(r => r.id === id);
  if (!r) return;
  document.getElementById('reminderTitle').value = r.title;
  document.getElementById('reminderType').value = r.type;
  const [m, d] = r.date.split('-');
  const y = new Date().getFullYear();
  document.getElementById('reminderDate').value = `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
  document.getElementById('reminderDesc').value = r.desc || '';
  document.getElementById('reminderGifts').value = r.gifts || '';
  document.getElementById('reminderWords').value = r.words || '';
  document.getElementById('reminderSurprise').value = r.surprise || '';
  data.reminders = data.reminders.filter(rem => rem.id !== id);
  saveData();
  navigateTo('addReminder');
}

function getAISuggestions(r, person, days) {
  const tips = [];
  tips.push({ icon: '<i data-lucide="alarm-clock" class="icon-sm"></i>', label: '时间提醒', content: days <= 3 ? `只剩 <span class="tip-urgent">${days}天</span> 了，抓紧准备！` : days <= 7 ? '还有一周时间，可以开始准备了。' : '还有足够时间，好好规划。' });
  tips.push({ icon: '<i data-lucide="package" class="icon-sm"></i>', label: '礼物提醒', content: '建议提前3-5天下单，考虑快递时效和意外情况。' });
  if (r.type === 'birthday') tips.push({ icon: '<i data-lucide="cake" class="icon-sm"></i>', label: '生日建议', content: '生日当天一早发祝福最感人，礼物可以前一天给惊喜。' });
  if (r.type === 'festival') tips.push({ icon: '<i data-lucide="star" class="icon-sm"></i>', label: '节日建议', content: '节日当天人很多，建议提前预约或准备，避免临时慌张。' });
  if (days <= 7) tips.push({ icon: '<i data-lucide="lightbulb" class="icon-sm"></i>', label: '紧急提醒', content: `<span class="tip-urgent">${days === 0 ? '就是今天！' : '马上到了！'}</span> 确认礼物和安排都已到位。` });
  return tips;
}

// ========== CALENDAR ==========
function renderCalendar() {
  const months = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  document.getElementById('calendarTitle').textContent = calendarYear + ' · ' + months[calendarMonth];
  const grid = document.getElementById('calendarDays');
  const firstDay = new Date(calendarYear, calendarMonth, 1).getDay();
  const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
  const today = new Date();
  let html = '';
  for (let i = 0; i < firstDay; i++) html += '<div class="calendar-day other-month"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = today.getDate() === d && today.getMonth() === calendarMonth && today.getFullYear() === calendarYear;
    const dateStr = `${String(calendarMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const hasEvent = data.reminders.some(r => r.date === dateStr && r.enabled);
    html += `<div class="calendar-day ${isToday ? 'today' : ''} ${hasEvent ? 'has-event' : ''} ${selectedDate === dateStr ? 'selected' : ''}" onclick="selectCalendarDay('${dateStr}',this)">${d}</div>`;
  }
  grid.innerHTML = html;
  if (selectedDate) renderDayEvents(selectedDate);
  else document.getElementById('dayEvents').innerHTML = '<p style="color:var(--ink-ghost);font-size:12px;text-align:center;">点击日期查看当天提醒</p>';
}

function changeMonth(dir) {
  if (dir === 0) { calendarMonth = new Date().getMonth(); calendarYear = new Date().getFullYear(); }
  else { calendarMonth += dir; if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; } if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; } }
  selectedDate = null;
  renderCalendar();
}

function selectCalendarDay(dateStr, el) {
  document.querySelectorAll('.calendar-day.selected').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  selectedDate = dateStr;
  renderDayEvents(dateStr);
}

function renderDayEvents(dateStr) {
  const events = data.reminders.filter(r => r.date === dateStr);
  const container = document.getElementById('dayEvents');
  if (events.length === 0) { container.innerHTML = '<p style="color:var(--ink-ghost);font-size:12px;text-align:center;">当天没有提醒</p>'; return; }
  container.innerHTML = events.map(r => {
    const person = data.people.find(p => p.id === r.personId);
    const dotColor = { birthday: 'var(--primary)', anniversary: 'var(--gold)', festival: 'var(--plum)', custom: 'var(--jade)' }[r.type] || 'var(--primary)';
    return `<div class="calendar-event-item" onclick="showReminderDetail('${r.id}')">
      <div class="calendar-event-dot" style="background:${dotColor}"></div>
      <div class="calendar-event-info">
        <h4>${r.title}</h4>
        <p>${person ? person.name : ''} · ${getTypeName(r.type)}</p>
      </div>
    </div>`;
  }).join('');
}

// ========== VOICE INPUT ==========
let recognition = null;
let isRecording = false;

function toggleVoice() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    showToast('当前浏览器不支持语音输入');
    return;
  }
  if (isRecording) {
    stopVoice();
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    isRecording = true;
    const btn = document.getElementById('voiceBtn');
    if (btn) btn.classList.add('recording');
    showToast('正在聆听...');
  };

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    const input = document.getElementById('chatInput');
    if (input) input.value = transcript;
  };

  recognition.onerror = (event) => {
    isRecording = false;
    const btn = document.getElementById('voiceBtn');
    if (btn) btn.classList.remove('recording');
    if (event.error !== 'no-speech') showToast('语音识别出错：' + event.error);
  };

  recognition.onend = () => {
    isRecording = false;
    const btn = document.getElementById('voiceBtn');
    if (btn) btn.classList.remove('recording');
    const input = document.getElementById('chatInput');
    if (input && input.value.trim()) sendMessage();
  };

  recognition.start();
}

function stopVoice() {
  if (recognition) { recognition.stop(); recognition = null; }
  isRecording = false;
  const btn = document.getElementById('voiceBtn');
  if (btn) btn.classList.remove('recording');
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  if (!window.chatSelectedPersonId) { showToast('请先选择一个人'); return; }
  const pid = window.chatSelectedPersonId;
  if (!data.chatHistory[pid]) data.chatHistory[pid] = [];
  const now = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  data.chatHistory[pid].push({ role: 'user', content: text, time: now });
  input.value = '';
  const response = generateResponse(text, pid);
  data.chatHistory[pid].push({ role: 'bot', content: response, time: now });
  saveData();
  renderChatHistory();
}

function sendQuick(text) {
  document.getElementById('chatInput').value = text;
  sendMessage();
}

function generateResponse(text, pid) {
  const p = data.people.find(p => p.id === pid);
  const t = text.trim();

  // ---- 意图识别 ----
  // 1. 添加/修改生日
  const birthdayMatch = t.match(/([\u4e00-\u9fa5]{2,6})(的?)?生日(是|在|在?于)?(\d{1,2})[月\-\/](\d{1,2})/);
  if (t.includes('生日') && (t.includes('是') || t.includes('在') || t.includes('于')) && birthdayMatch) {
    const m = birthdayMatch[4], d = birthdayMatch[5];
    p.birthday = `${new Date().getFullYear()}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
    saveData();
    return `好的，已记录${p.name}的生日：${m}月${d}日。`;
  }

  // 2. 添加纪念日/提醒
  const reminderPatterns = [
    { keywords: ['纪念日', '在一起', '相识', '相恋', '交往'], type: 'anniversary' },
    { keywords: ['节日', '节', '情人节', '中秋', '圣诞', '七夕', '520', '母亲节', '父亲节', '女神节'], type: 'festival' }
  ];
  for (const pat of reminderPatterns) {
    if (pat.keywords.some(k => t.includes(k)) && (t.includes('提醒') || t.includes('记住') || t.includes('记') || t.includes('添加') || t.includes('是'))) {
      const dateMatch = t.match(/(\d{1,2})[月\-\/](\d{1,2})/);
      if (dateMatch) {
        const m = dateMatch[1], d = dateMatch[2];
        const title = t.replace(/添加|提醒|记住|记|是|在|于/g, '').replace(/\d{1,2}[月\-\/]\d{1,2}/g, '').trim() || pat.keywords[0];
        const id = 'r_' + Date.now();
        data.reminders.push({
          id, personId: pid, title, type: pat.type,
          date: `${m.padStart(2,'0')}-${d.padStart(2,'0')}`,
          desc: '通过对话添加', gifts: '', words: '', surprise: '', enabled: true
        });
        saveData();
        renderReminders();
        return `已添加${p.name}的「${title}」：${m}月${d}日。`;
      }
    }
  }
  // 添加自定义提醒
  if ((t.includes('提醒') || t.includes('记得') || t.includes('记住')) && !t.includes('生日') && !t.includes('纪念日')) {
    const dateMatch = t.match(/(\d{1,2})[月\-\/](\d{1,2})/);
    if (dateMatch) {
      const m = dateMatch[1], d = dateMatch[2];
      const titleClean = t.replace(/\d{1,2}[月\-\/]\d{1,2}/g, '');
      const title = titleClean.replace(/添加|提醒|记住|记|是|在|于|提醒我|记得/g, '').trim() || '自定义提醒';
      const id = 'r_' + Date.now();
      data.reminders.push({
        id, personId: pid, title, type: 'custom',
        date: `${m.padStart(2,'0')}-${d.padStart(2,'0')}`,
        desc: '通过对话添加', gifts: '', words: '', surprise: '', enabled: true
      });
      saveData();
      renderReminders();
      return `已添加${p.name}的「${title}」：${m}月${d}日。`;
    }
  }

  // 3. 添加/更新喜好
  if (t.includes('喜欢') || t.includes('爱好') || t.includes('爱') || t.includes('爱看') || t.includes('爱听')) {
    const val = t.replace(/她|他|它的|记录|记住|新增|一下|喜欢|爱好|爱/g, '').trim();
    if (val && val.length > 1) {
      if (!p.likes) p.likes = val;
      else p.likes += '。' + val;
      saveData();
      return `好的，已记录${p.name}的喜好：${val}`;
    }
  }

  // 4. 添加/更新价值观
  if (t.includes('价值观') || t.includes('看重') || t.includes('在意') || t.includes('在乎') || t.includes('重视')) {
    const val = t.replace(/她|他|它|的|价值观|看重|在意|在乎|重视|记录|记住/g, '').trim();
    if (val && val.length > 1) {
      if (!p.values) p.values = val;
      else p.values += '。' + val;
      saveData();
      return `好的，已记录${p.name}的价值观：${val}`;
    }
  }

  // 5. 添加/更新备注
  if (t.includes('备注') || t.includes('补充') || t.includes('note')) {
    const val = t.replace(/她|他|它|备注|补充|note/g, '').trim();
    if (val && val.length > 1) {
      if (!p.notes) p.notes = val;
      else p.notes += '。' + val;
      saveData();
      return `好的，已记录备注：${val}`;
    }
  }

  // 6. 添加/更新星座
  const zodiacMatch = t.match(/(白羊座|金牛座|双子座|巨蟹座|狮子座|处女座|天秤座|天蝎座|射手座|摩羯座|水瓶座|双鱼座)/);
  if (t.includes('星座') && zodiacMatch) {
    p.zodiac = zodiacMatch[1];
    saveData();
    return `好的，已记录${p.name}是${zodiacMatch[1]}。`;
  }

  // 7. 添加/更新关系
  if (t.includes('关系') || t.includes('是')) {
    const rels = ['恋人', '妈妈', '爸爸', '闺蜜', '兄弟', '朋友', '其他'];
    for (const rel of rels) {
      if (t.includes(rel)) {
        p.relation = rel;
        saveData();
        return `好的，已更新${p.name}的关系：${rel}。`;
      }
    }
  }

  // 8. 讨厌什么
  if (t.includes('讨厌') || t.includes('不喜欢')) {
    const val = t.replace(/她|他|它|讨厌|不喜欢/g, '').trim();
    if (val && val.length > 1) {
      if (!p.likes) p.likes = '讨厌' + val;
      else p.likes += '。讨厌' + val;
      saveData();
      return `好的，已记录${p.name}讨厌：${val}`;
    }
  }

  // 9. 查询生日
  if (t.includes('生日') && (t.includes('什么') || t.includes('哪') || t.includes('几') || t.includes('怎么') || t.includes('多大'))) {
    if (p.birthday) return `${p.name}的生日是${formatDateDisplay(p.birthday)}${p.zodiac ? '，' + p.zodiac : ''}。`;
    return `还没有记录${p.name}的生日。可以告诉我：「${p.name}的生日是3月15日」`;
  }

  // 10. 查询喜好
  if (t.includes('喜欢') && !t.includes('想要')) {
    if (p.likes) return `${p.name}喜欢：${p.likes}`;
    return `还没有记录${p.name}的喜好。可以告诉我：「${p.name}喜欢花和咖啡」`;
  }

  // 11. 查询价值观
  if (t.includes('价值观') || t.includes('看重') || t.includes('在意')) {
    if (p.values) return `${p.name}的价值观：${p.values}`;
    return `还没有记录${p.name}的价值观。`;
  }

  // 12. 查询想要/礼物
  if (t.includes('想要') || t.includes('wish') || (t.includes('礼物') && t.includes('什么'))) {
    const rems = data.reminders.filter(r => r.personId === pid && r.gifts);
    if (rems.length) return `建议给${p.name}的礼物：${rems[0].gifts}`;
    return `还没有记录${p.name}想要的礼物。可以告诉我：「${p.name}最近想要一支口红」`;
  }

  // 13. 查询纪念日
  if (t.includes('纪念日') || t.includes('在一起') || t.includes('相识')) {
    const rems = data.reminders.filter(r => r.personId === pid && (r.type === 'anniversary' || r.type === 'birthday'));
    if (rems.length) return `${p.name}的重要日期：\n${rems.map(r => `· ${r.title}（${formatDateDisplay(r.date)}）`).join('\n')}`;
    return `还没有记录${p.name}的纪念日。可以告诉我：「记住我们的纪念日是9月1日」`;
  }

  // 14. 查询星座
  if (t.includes('星座') || t.includes('zodiac')) {
    if (p.zodiac) return `${p.name}是${p.zodiac}。`;
    return `还没有记录${p.name}的星座。可以告诉我：「${p.name}是处女座」`;
  }

  // 15. 查询备注
  if (t.includes('备注') || t.includes('补充')) {
    if (p.notes) return `${p.name}的备注：${p.notes}`;
    return `还没有记录${p.name}的备注。`;
  }

  // 16. 查询所有提醒
  if (t.includes('提醒') && !t.includes('添加') && !t.includes('记得') && (t.includes('有什么') || t.includes('哪些') || t.includes('查看'))) {
    const rems = data.reminders.filter(r => r.personId === pid);
    if (rems.length) return `${p.name}的提醒（${rems.length}条）：\n${rems.map(r => `· ${r.title}（${formatDateDisplay(r.date)}）`).join('\n')}`;
    return `还没有记录${p.name}的提醒。`;
  }

  // 17. 默认回复：汇总信息
  const info = [`关于 ${p.name}，我找到了：`];
  info.push(`· 关系：${p.relation}`);
  if (p.birthday) info.push(`· 生日：${formatDateDisplay(p.birthday)}`);
  if (p.zodiac) info.push(`· 星座：${p.zodiac}`);
  if (p.likes) info.push(`· 喜好：${p.likes.slice(0, 80)}${p.likes.length > 80 ? '...' : ''}`);
  if (p.values) info.push(`· 价值观：${p.values.slice(0, 60)}${p.values.length > 60 ? '...' : ''}`);
  const rems = data.reminders.filter(r => r.personId === pid);
  if (rems.length) info.push(`· 提醒：${rems.length}条`);
  info.push(`\n<i data-lucide="lightbulb" class="icon-sm"></i> 你可以告诉我：「${p.name}的生日是3月15日」「记住她喜欢花」「添加纪念日8月1日」等`);
  return info.join('\n');
}

function updateCareConfig(id, key, value) {
  const p = data.people.find(p => p.id === id);
  if (!p) return;
  if (!p.careConfig) p.careConfig = { weather: true, season: true, interaction: true, gift: true };
  p.careConfig[key] = value;
  saveData();
  renderCare();
}

function toggleCareEnabled(id, enabled) {
  const p = data.people.find(p => p.id === id);
  if (!p) return;
  p.careEnabled = enabled;
  saveData();
  renderCare();
}

function markContacted(id) {
  const p = data.people.find(p => p.id === id);
  if (!p) return;
  p.lastContact = new Date().toISOString();
  saveData();
  closeModal();
  renderCare();
  showToast('已标记为已联系');
}

function deletePerson(id) {
  if (!confirm('确定删除此人？所有相关提醒也会删除。')) return;
  data.people = data.people.filter(p => p.id !== id);
  data.reminders = data.reminders.filter(r => r.personId !== id);
  if (selectedPersonId === id) selectedPersonId = 'all';
  saveData();
  closeModal();
  renderPeople();
  renderHome();
}

// ========== ADD PERSON ==========
function savePerson() {
  const name = document.getElementById('personName').value.trim();
  if (!name) { showToast('请输入姓名'); return; }
  const relations = { '恋人': '<i data-lucide="heart" class="icon-sm"></i>', '妈妈': '<i data-lucide="flower-2" class="icon-sm"></i>', '爸爸': '<i data-lucide="sprout" class="icon-sm"></i>', '闺蜜': '<i data-lucide="flower" class="icon-sm"></i>', '兄弟': '<i data-lucide="handshake" class="icon-sm"></i>', '其他': '<i data-lucide="sparkles" class="icon-sm"></i>' };
  const rel = document.getElementById('personRelation').value;
  const id = 'p_' + Date.now();
  data.people.push({
    id,
    name,
    relation: rel,
    emoji: relations[rel] || '<i data-lucide="sparkles" class="icon-sm"></i>',
    birthday: document.getElementById('personBirthday').value,
    zodiac: document.getElementById('personZodiac').value,
    likes: document.getElementById('personLikes').value,
    values: document.getElementById('personValues').value,
    notes: document.getElementById('personNotes').value,
    lastContact: null,
    careEnabled: true,
    careConfig: { weather: true, season: true, interaction: true, gift: true }
  });
  // Auto add birthday reminder
  const bd = document.getElementById('personBirthday').value;
  if (bd) {
    const [y, m, d] = bd.split('-');
    const dateStr = `${m}-${d}`;
    data.reminders.push({
      id: 'r_' + Date.now(),
      personId: id,
      title: `${name}的生日`,
      type: 'birthday',
      date: dateStr,
      desc: '一年一度的特别日子',
      gifts: '鲜花、蛋糕、定制礼物',
      words: '生日快乐！愿你天天开心',
      surprise: '准备惊喜派对',
      enabled: true
    });
  }
  saveData();
  clearPersonForm();
  navigateTo('people');
  showToast('已添加：' + name);
}

function clearPersonForm() {
  document.getElementById('personName').value = '';
  document.getElementById('personBirthday').value = '';
  document.getElementById('personZodiac').value = '';
  document.getElementById('personLikes').value = '';
  document.getElementById('personValues').value = '';
  document.getElementById('personNotes').value = '';
}

// ========== ADD REMINDER ==========
function initReminderForm() {
  const chips = document.getElementById('templateChips');
  chips.innerHTML = festivalTemplates.map(f =>
    `<span class="template-chip" onclick="applyTemplate('${f.name}','${f.date}','${f.type}','${f.desc}','${f.gifts}','${f.words}','${f.surprise}')">
      <span class="chip-icon">${f.emoji}</span>${f.name}
    </span>`
  ).join('');
}

function applyTemplate(name, date, type, desc, gifts, words, surprise) {
  document.getElementById('reminderTitle').value = name;
  document.getElementById('reminderType').value = type;
  document.getElementById('reminderDesc').value = desc;
  document.getElementById('reminderGifts').value = gifts;
  document.getElementById('reminderWords').value = words;
  document.getElementById('reminderSurprise').value = surprise;
  if (date) {
    const y = new Date().getFullYear();
    document.getElementById('reminderDate').value = `${y}-${date.split('-')[0]}-${date.split('-')[1]}`;
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function saveReminder() {
  const title = document.getElementById('reminderTitle').value.trim();
  if (!title) { showToast('请输入提醒名称'); return; }
  const dateVal = document.getElementById('reminderDate').value;
  if (!dateVal) { showToast('请选择日期'); return; }
  const [y, m, d] = dateVal.split('-');
  const id = 'r_' + Date.now();
  data.reminders.push({
    id,
    personId: selectedPersonId,
    title,
    type: document.getElementById('reminderType').value,
    date: `${m}-${d}`,
    desc: document.getElementById('reminderDesc').value,
    gifts: document.getElementById('reminderGifts').value,
    words: document.getElementById('reminderWords').value,
    surprise: document.getElementById('reminderSurprise').value,
    enabled: true
  });
  saveData();
  navigateTo('home');
  showToast('提醒已保存');
}

// ========== PERSON SELECTOR ==========
function showPersonSelector(context) {
  const dropdown = document.getElementById('personSelectorDropdown');
  const content = document.getElementById('personSelectorContent');
  if (data.people.length === 0) {
    content.innerHTML = '<p style="text-align:center;color:var(--ink-ghost);padding:20px;">还没有添加任何人</p>';
  } else {
    content.innerHTML = `<h3>选择对象</h3>` +
      data.people.map(p =>
        `<div class="person-selector-item" onclick="selectPersonForChat('${p.id}','${context}')">
          <div class="avatar" style="width:36px;height:36px;border-radius:50%;background:var(--primary-glow);border:1px solid rgba(255,107,53,0.2);display:flex;align-items:center;justify-content:center;font-size:18px;">${p.emoji}</div>
          <div>
            <div style="font-size:14px;color:var(--ink);font-weight:600;">${p.name}</div>
            <div style="font-size:12px;color:var(--ink-ghost);">${p.relation}</div>
          </div>
        </div>`
      ).join('');
  }
  dropdown.classList.add('show');
  dropdown.onclick = function(e) {
    if (e.target === dropdown) dropdown.classList.remove('show');
  };
}

function selectPersonForChat(id, context) {
  window.chatSelectedPersonId = id;
  document.getElementById('personSelectorDropdown').classList.remove('show');
  renderChatUI();
}

// ========== UTILITIES ==========
function getDaysUntil(dateStr) {
  const [m, d] = dateStr.split('-').map(Number);
  const now = new Date();
  let target = new Date(now.getFullYear(), m - 1, d);
  if (target < now) target = new Date(now.getFullYear() + 1, m - 1, d);
  return Math.ceil((target - now) / (1000 * 60 * 60 * 24));
}

function formatDateDisplay(dateStr) {
  if (!dateStr) return '未设置';
  if (dateStr.includes('-')) {
    const [m, d] = dateStr.split('-');
    return `${parseInt(m)}月${parseInt(d)}日`;
  }
  return dateStr;
}

function getTypeName(type) {
  return { birthday: '生日', anniversary: '纪念日', festival: '节日', custom: '自定义' }[type] || type;
}

function getZodiac(zodiac) {
  if (!zodiac) return '';
  return zodiac + '，非常温柔细腻的人';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ========== INIT ==========
renderHome();
if (typeof lucide !== 'undefined') lucide.createIcons();
</script>
