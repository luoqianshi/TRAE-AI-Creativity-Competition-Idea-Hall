/* ===== 设计系统 CSS ===== */
/* ============================================================
   投石 · 当代自然主义绘本插画风格设计系统
   灵感来源：用户提供的三张自然绘本插画
   核心美学：
   - 低饱和自然色：薄荷青绿、暖灰米白、深青蓝绿、暖紫灰褐
   - 印刷纸张肌理：Risograph/丝网印刷般的颗粒噪点
   - 柔和透明叠加：通过半透明色块表现空间层次
   - 有机线条：植物的弧线、水面的波纹、石头的圆钝
   - 漫射光：无硬阴影，光线像清晨或黄昏一样柔和
   ============================================================ */

/* ===== 色彩系统 =====
   三层空间对应三种色调：
   - 湖面（surface）：薄荷青绿调，天空反射的柔和光线
   - 湖底（bottom）：深青蓝绿调，水下沉淀的静谧
   - 岸边（shore）：暖紫灰褐调，泥土与黄昏的温度

   色彩哲学：
   - 无纯黑/纯白，所有颜色都带自然灰度
   - 低饱和度（S: 8-30%），模拟自然光与纸张印刷的色彩衰减
   - 暖色偏赭石/暖棕，冷色偏灰蓝/鼠尾草/薄荷青
   ===== */
:root {
  /* ---- 湖面层：薄荷青绿水面 ----
     灵感来自图1：大面积浅青绿色的水面，带有天空的柔和反光 */
  --pond-water:        #2a4a52;   /* 池塘水面主色 — 薄荷灰蓝绿（加深） */
  --pond-water-light:  #4a7278;   /* 水面浅处 — 中薄荷青 */
  --pond-water-pale:   #8aa8a8;   /* 水面最浅 — 雾薄荷青 */
  --pond-sky:          #c8d4cc;   /* 天空反射 — 浅暖灰绿（微调） */

  /* ---- 湖底层：深青蓝绿水下 ----
     灵感来自图2：水下深蓝绿色，随深度增加而变浓 */
  --pond-deep:         #16262e;   /* 湖底最深 — 墨青蓝绿（更深，与沉积层区分） */
  --pond-deep-mid:     #1e3640;   /* 湖底中层 — 深青蓝 */
  --pond-deep-light:   #2a4854;   /* 湖底浅层 — 中深青 */

  /* ---- 岸边层：暖紫灰褐调 ----
     灵感来自图3：黄昏岸边的暖紫灰、暖棕、泥土色 */
  --shore-earth:       #8a7a6a;   /* 泥土 — 暖灰褐 */
  --shore-earth-light: #b8a898;   /* 浅泥土 — 暖灰米 */
  --shore-reed:        #6a8068;   /* 芦苇 — 橄榄灰绿 */
  --shore-reed-light:  #8ea88a;   /* 浅芦苇 — 灰绿 */
  --shore-stone:       #9a9088;   /* 石头 — 暖灰 */
  --shore-stone-warm:  #c8b8a8;   /* 暖石 — 米灰褐 */

  /* ---- 植物色：克制自然 ----
     灵感来自图1前景芦苇、图2水草 */
  --plant-leaf:        #5a8060;   /* 叶子 — 灰绿（非荧光绿） */
  --plant-leaf-light:  #7ea880;   /* 嫩叶 — 柔和灰绿 */
  --plant-leaf-dark:   #3e5a42;   /* 暗叶 — 深灰绿 */
  --plant-moss:        #6a8060;   /* 苔藓 — 黄灰绿 */
  --plant-algae:       #4a6e60;   /* 水藻 — 蓝灰绿 */

  /* ---- 暖色点缀：赭石/琥珀/暖棕 ---- */
  --accent-ochre:      #b89070;   /* 赭石 — 暖棕橙 */
  --accent-ochre-light:#d0b898;   /* 浅赭石 — 暖米 */
  --accent-amber:      #b0a078;   /* 琥珀 — 灰金 */
  --accent-rust:       #987860;   /* 铁锈 — 暖棕 */

  /* ---- 文字色（提升对比度，确保易读性） ---- */
  --text-primary:      #f5f0e8;   /* 主文字 — 暖纸白，对比度 > 12:1 */
  --text-secondary:    #d4ccc0;   /* 次要文字 — 暖灰米，对比度 > 8:1 */
  --text-tertiary:     #a89e90;   /* 三级文字 — 中暖灰，对比度 > 5.5:1 */
  --text-water:        #bcc8d0;   /* 水中文字 — 蓝灰，对比度 > 7:1 */
  --text-muted:        #7a7268;   /* 最低调文字 — 仅用于装饰性提示 */

  /* ---- 功能色 ---- */
  --border-subtle:     rgba(160, 150, 135, 0.14);  /* 微妙边框 */
  --border-visible:    rgba(160, 150, 135, 0.26);  /* 可见边框 */
  --border-active:     rgba(190, 160, 120, 0.40);  /* 激活边框 */
  --border-focus:      rgba(200, 165, 120, 0.55);  /* 聚焦边框 */
  --surface-card:      rgba(30, 46, 52, 0.58);     /* 卡片底色 — 更透明，贴近纸张半透明感 */
  --surface-card-hover:rgba(36, 54, 62, 0.72);    /* 卡片悬停 */
  --surface-input:     rgba(24, 38, 46, 0.72);     /* 输入框底色 */
  --surface-elevated:  rgba(36, 52, 60, 0.62);     /* 浮层底色 */

  /* ---- 阴影（自然柔光，无硬阴影） ---- */
  --shadow-soft:       0 3px 18px rgba(20, 32, 40, 0.30);
  --shadow-card:       0 2px 8px rgba(20, 32, 40, 0.22);
  --shadow-elevated:   0 5px 28px rgba(18, 28, 36, 0.38);
}

/* ===== Tailwind v4 主题集成 ===== */


/* ===== 全局基础 ===== */
html, body {
  height: 100%;
  overflow: hidden;
  background: var(--pond-deep);
  color: var(--text-primary);
  font-family: 'Georgia', 'Noto Serif SC', 'Source Han Serif SC', 'STSong', 'Songti SC', serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  /* 移动端安全区适配 */
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
/* 纸纹肌理 — 多层叠加模拟绘本印刷纸张
     1. 底层粗颗粒：模拟纸张纤维
     2. 中层细噪点：模拟印刷油墨颗粒
     3. 顶层微斑点：模拟Risograph印刷的墨点不均匀 */
  background-image:
    /* 顶层微斑点 */
    url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.025'/%3E%3C/svg%3E"),
    /* 中层细噪点 */
    url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E"),
    /* 底层粗颗粒 */
    url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.4' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  background-size: 128px 128px, 256px 256px, 512px 512px;
}

/* 防止移动端触摸时的高亮和弹跳 */
* {
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

/* 输入框移动端适配 */
input, textarea {

/* ===== 纸纹卡片 — 模拟绘本纸张质感 ===== */
.paper-card {
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  box-shadow: var(--shadow-card);
  /* 微纸纹叠加 */
  position: relative;
  /* 柔和的纸张边缘光，模拟印刷品的厚度 */
  backdrop-filter: blur(1px);
}
.paper-card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
  pointer-events: none;
  mix-blend-mode: overlay;
}

/* 高亮卡片 — 用于重要信息或当前激活态 */
.paper-card-elevated {
  background: var(--surface-elevated);
  border: 1px solid var(--border-visible);
  border-radius: 12px;
  box-shadow: var(--shadow-elevated);
  position: relative;
  backdrop-filter: blur(2px);
}
.paper-card-elevated::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");

/* ===== 水面渐变背景 =====
   渐变节奏：顶部最亮（天空/浅水），向下逐渐加深（水深处）

.bg-water-surface {
  background: linear-gradient(
    180deg,
    var(--pond-sky) 0%,
    var(--pond-water-pale) 15%,
    var(--pond-water-light) 40%,
    var(--pond-water) 70%,
    var(--pond-deep-light) 100%
  );
}

.bg-water-deep {
  background: linear-gradient(
    180deg,
    var(--pond-deep-light) 0%,
    var(--pond-deep-mid) 45%,
    var(--pond-deep) 100%
  );
}

.bg-shore-warm {

    var(--shore-stone-warm) 0%,
    var(--shore-earth-light) 45%,
    var(--shore-earth) 100%
  );
}

/* ===== 湖面文字浮现效果（柔和版） ===== */
.text-float-up {
  animation: floatUp 2.5s ease-out forwards;
}

@keyframes floatUp {
  0% {
    opacity: 0;
    transform: translateY(16px);
  }
  25% {
    opacity: 0.92;
  }
  100% {
    opacity: 0;
    transform: translateY(-8px);
  }
}

/* ===== 文字下沉效果 ===== */
.text-sink-down {
  animation: sinkDown 1.8s ease-in forwards;
}

@keyframes sinkDown {
  0% {
    opacity: 0.80;
    transform: translateY(0);
  }
  100% {
    opacity: 0;
    transform: translateY(24px);
  }
}

/* ===== 涟漪回音效果（更柔和持久） ===== */
.echo-text {
  animation: echoAppear 2.5s ease-out forwards;
}

@keyframes echoAppear {
  0% {
    opacity: 0;
    transform: scale(0.97);
  }
  15% {
    opacity: 0.90;
    transform: scale(1);
  }
  75% {
    opacity: 0.90;
    transform: scale(1);
  }
  100% {
    opacity: 0;
    transform: scale(1.02);
  }
}

.tutorial-narrative-text {

  0% {

  18% {

    transform: scale(0.97);

// ===== gen-core.js =====
// ===== localStorage 数据层 =====
const STORAGE_KEY = 'toushi_app';

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).substring(2, 8);
}

function createDefaultData() {
  return {
    user: {
      id: generateId(), nickname: '', createdAt: Date.now(), introCompleted: false,
      anchors: ANCHOR_DEFINITIONS.map(d => ({...d})),
      anchorHits: { identity: 0, direction: 0, connection: 0, agency: 0 },
      surfaceTutorialCompleted: false, bottomTutorialCompleted: false, shoreTutorialCompleted: false,
    },
    fragments: [], introAnswers: [], dailyAnsweredDate: null, dailyAnsweredIndexes: [], sedimentFolders: [],
  };
}

function loadAppData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return createDefaultData();
    const data = JSON.parse(raw);
    if (!data.user.anchors) data.user.anchors = ANCHOR_DEFINITIONS.map(d => ({...d}));
    if (!data.user.anchorHits) data.user.anchorHits = { identity: 0, direction: 0, connection: 0, agency: 0 };
    if (data.dailyAnsweredDate === undefined) data.dailyAnsweredDate = null;
    if (data.dailyAnsweredIndexes === undefined) data.dailyAnsweredIndexes = [];
    if (data.sedimentFolders === undefined) data.sedimentFolders = [];
    if (data.user.surfaceTutorialCompleted === undefined) data.user.surfaceTutorialCompleted = false;
    if (data.user.bottomTutorialCompleted === undefined) data.user.bottomTutorialCompleted = false;
    if (data.user.shoreTutorialCompleted === undefined) data.user.shoreTutorialCompleted = false;
    return data;
  } catch { return createDefaultData(); }
}

function saveAppData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function completeIntro(data) {
  const hits = data.user.anchorHits;
  const sorted = Object.entries(hits).sort((a,b) => b[1] - a[1]);
  const maxCount = sorted[0]?.[1] ?? 0;
  const tied = sorted.filter(([,c]) => c === maxCount).map(([id]) => id);
  const maxAnchor = tied.length === 1 ? tied[0] : null;
  const updatedAnchors = ANCHOR_DEFINITIONS.map(d => ({...d, isPrimary: maxAnchor ? d.id === maxAnchor : false}));
  return {...data, user: {...data.user, introCompleted: maxAnchor !== null, anchors: updatedAnchors}};
}

function setPrimaryAnchor(data, anchorId) {
  return {...data, user: {...data.user, introCompleted: true, anchors: ANCHOR_DEFINITIONS.map(d => ({...d, isPrimary: d.id === anchorId}))}};
}

function getTiedAnchors(data) {
  const hits = data.user.anchorHits;
  const sorted = Object.entries(hits).sort((a,b) => b[1] - a[1]);
  const maxCount = sorted[0]?.[1] ?? 0;
  return sorted.filter(([,c]) => c === maxCount).map(([id]) => id);
}

function addFragment(data, f) { return {...data, fragments: [...data.fragments, f]}; }
function deleteFragment(data, fid) {
  const childIds = data.fragments.filter(f => f.parentId === fid).map(f => f.id);
  const allIds = new Set([fid, ...childIds]);
  return {...data, fragments: data.fragments.filter(f => !allIds.has(f.id)),
    sedimentFolders: data.sedimentFolders.map(f => ({...f, fragmentIds: f.fragmentIds.filter(id => !allIds.has(id))}))};
}
function mergeFragments(data, childId, parentId) {
  return {...data, fragments: data.fragments.map(f => f.id === childId ? {...f, parentId} : f)};
}
function unmergeFragment(data, fid) {
  return {...data, fragments: data.fragments.map(f => f.id === fid ? {...f, parentId: undefined} : f)};
}

const keywordMap = {
  identity: ['我是','自己','真实','演','面具','期待','标签','定义','本质','版本','角色','身份','别人觉得','去掉期待'],
  direction: ['想做','目标','选择','未来','路','迷茫','不知道想','职业','规划','方向','梦想','志向','该走','自己选的','犹豫'],
  connection: ['关系','朋友','孤独','理解','接纳','频道','消耗','共鸣','信任','依靠','在一起','隔了一层','回应期待','不装','被需要'],
  agency: ['行不行','敢不敢','害怕','信心','擅长','能力','资格','底气','资源','积累','做好','不敢开始','比我厉害','不够好','我能不能'],
};

function categorize(content) {
  const hits = { identity: 0, direction: 0, connection: 0, agency: 0 };
  for (const [anchor, keywords] of Object.entries(keywordMap))
    for (const kw of keywords) if (content.includes(kw)) hits[anchor]++;
  const sorted = Object.entries(hits).sort((a,b) => b[1] - a[1]);
  const [maxAnchor, maxHits] = sorted[0], [secondAnchor, secondHits] = sorted[1];
  if (maxHits === 0) return { anchorId: null, isBoundary: false, topTwoAnchors: null };
  if (maxHits > 0 && secondHits > 0 && maxHits <= secondHits * 1.5)
    return { anchorId: null, isBoundary: true, topTwoAnchors: [maxAnchor, secondAnchor] };
  return { anchorId: maxAnchor, isBoundary: false, topTwoAnchors: null };
}

function detectContradiction(content) {
  for (const pair of contradictionPairs)
    if (content.includes(pair.keywords[0]) && content.includes(pair.keywords[1])) return pair.anchors;
  return null;
}

function formatTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff/60000)+'分钟前';
  if (diff < 86400000) return Math.floor(diff/3600000)+'小时前';
  if (diff < 604800000) return Math.floor(diff/86400000)+'天前';
  return d.getMonth()+1+'/'+d.getDate();
}

function handleIntroSelect(mappedAnchors) {
  const updatedHits = { ...appData.user.anchorHits };
  for (const a of mappedAnchors) updatedHits[a]++;
  const newData = { ...appData, user: { ...appData.user, anchorHits: updatedHits } };
  if (introStep < introQuestions.length - 1) {
    introStep++;
    persistData(newData);
  } else {
    const completed = completeIntro(newData);
    const tied = getTiedAnchors(completed);
    if (tied.length > 1) { persistData(completed); tiedAnchors = tied; render(); return; }
    finishIntro(completed);
    return;
  }
  render();
}

function handleTieSelect(anchorId) {
  const updated = setPrimaryAnchor(appData, anchorId);
  persistData(updated); tiedAnchors = [];

}

  persistData(data); isIntro = false; introActive = false; introStep = 0; convState = 'idle';

// ===== 投石 =====
function handleThrowStone() {
  if (!inputText.trim()) return;
  convState = 'echo';
  const result = categorize(inputText);
  let anchorId = result.anchorId;
  const isBoundary = result.isBoundary;
  const contradictionAnchors = detectContradiction(inputText);

  if (result.anchorId === null) {
    pendingContent = inputText;
    if (result.topTwoAnchors) {
      const all = ['identity','direction','connection','agency'];
      pendingAnchors = [...result.topTwoAnchors, ...all.filter(a => !result.topTwoAnchors.includes(a)).slice(0,2)];
    } else {
      pendingAnchors = ['identity','direction','connection','agency'];
    }
    categorizePending = true; anchorId = null;
  } else {
    anchorId = result.anchorId;
  }

  if (anchorId) {
    const count = appData.fragments.filter(f => f.anchorId === anchorId).length;
    const hasContradiction = contradictionAnchors !== null;
    const echo = selectEcho(anchorId, isBoundary, count, hasContradiction);
    currentEcho = echo.text;
    const fragment = { id: generateId(), content: inputText, createdAt: Date.now(), anchorId, source: 'spontaneous', echoText: echo.text };
    const newData = addFragment(appData, fragment);
    persistData(newData);

    if (hasContradiction && contradictionAnchors) {
      coachPhases = getCoachPhases(contradictionAnchors, inputText);
      contradictionSession = { anchors: contradictionAnchors, phase: 1, answers: {}, completed: false, triggerContent: inputText };
      setTimeout(() => { convState = 'contradiction_coach'; currentEcho = null; render(); }, 2500);
    } else {
      const followUp = shouldFollowUp('spontaneous', isBoundary);
      if (followUp) {
        setTimeout(() => { followUpHint = '涟漪散去，水面又泛起新的波纹…'; currentEcho = null; render(); }, 2500);
        setTimeout(() => { followUpHint = null; currentFollowUp = getFollowUp(isBoundary ? 'boundary' : 'spontaneous'); convState = 'follow_up'; render(); }, 4500);
      } else {
        setTimeout(() => { convState = 'idle'; currentEcho = null; render(); }, 2500);
      }
    }
  }
  inputText = '';
  render();
}

  const content = pendingContent;

  } else {

}

function handleCoachSubmit() {
  if (!coachInput.trim() || !contradictionSession) return;
  const session = contradictionSession;
  const currentPhase = session.phase;
  const updatedAnswers = { ...session.answers, [currentPhase]: coachInput };

  if (currentPhase === 5) {
    contradictionSession = { ...session, answers: updatedAnswers, completed: true };
    coachInput = '';
    const summary = generateCompletionSummary(session.anchors);
    const fragment = { id: generateId(), content: '矛盾探索完成：「'+ANCHOR_NAMES[session.anchors[0]]+'」与「'+ANCHOR_NAMES[session.anchors[1]]+'」', createdAt: Date.now(), anchorId: session.anchors[0], source: 'spontaneous', echoText: summary };
    const newData = addFragment(appData, fragment);
    persistData(newData);
    setTimeout(() => { convState = 'idle'; contradictionSession = null; coachPhases = []; currentEcho = null; render(); }, 4000);
  } else {
    let nextPhase = currentPhase + 1;
    if (nextPhase === 3) {
      const phase3Summary = generatePhase3Summary(session.anchors, updatedAnswers[1]||'', updatedAnswers[2]||'');
      coachPhases = coachPhases.map(p => p.phase === 3 ? {...p, coachResponse: phase3Summary} : p);
      contradictionSession = { ...session, answers: updatedAnswers, phase: 3 };
      coachInput = '';
      setTimeout(() => { contradictionSession = {...contradictionSession, phase: 4}; render(); }, 3000);
      render();
      return;
    }
    if (nextPhase === 5) {
      const allAnswers = { ...updatedAnswers, [4]: updatedAnswers[4]||'' };
      const phase5Q = generatePhase5Question(session.anchors, allAnswers);
      coachPhases = coachPhases.map(p => p.phase === 5 ? {...p, prompt: phase5Q} : p);

    contradictionSession = { ...session, answers: updatedAnswers, phase: nextPhase };
    coachInput = '';
  }

// ===== 拖拽 =====
function handleDragStart(e, fragmentId) {
  if (sortMode) { dragSortFromId = fragmentId; e.dataTransfer.setData('text/sort', fragmentId); }
  else { draggingFragmentId = fragmentId; e.dataTransfer.setData('text/plain', fragmentId); }
  e.dataTransfer.effectAllowed = 'move';
}

function handleDragOver(e, fragmentId) {
  e.preventDefault(); e.stopPropagation(); e.dataTransfer.dropEffect = 'move';
  if (sortMode) { if (dragSortFromId && dragSortFromId !== fragmentId) dragSortOverId = fragmentId; }
  else { if (draggingFragmentId && draggingFragmentId !== fragmentId) dragOverFragmentId = fragmentId; }
}

function handleDragLeave() { dragOverFragmentId = null; dragSortOverId = null; }

function handleDrop(e, targetFragmentId, anchorId) {
  e.preventDefault(); e.stopPropagation();
  dragOverFragmentId = null; dragSortOverId = null;
  if (sortMode) {
    const fromId = dragSortFromId; dragSortFromId = null; sortMode = false;
    if (!fromId || fromId === targetFragmentId) { render(); return; }
    const mainFragments = appData.fragments.filter(f => f.anchorId === anchorId && !f.parentId);
    const fromIdx = mainFragments.findIndex(f => f.id === fromId);
    const toIdx = mainFragments.findIndex(f => f.id === targetFragmentId);
    if (fromIdx === -1 || toIdx === -1) { render(); return; }
    const sorted = [...mainFragments].sort((a,b) => (a.order??a.createdAt)-(b.order??b.createdAt));
    const moved = sorted.splice(fromIdx, 1)[0];
    sorted.splice(toIdx, 0, moved);
    const updatedFragments = appData.fragments.map(f => {
      const newIdx = sorted.findIndex(s => s.id === f.id);
      return newIdx !== -1 ? {...f, order: newIdx} : f;
    });
    persistData({...appData, fragments: updatedFragments});
  } else {
    const sourceId = draggingFragmentId; draggingFragmentId = null;
    if (!sourceId || sourceId === targetFragmentId) { render(); return; }
    const targetFragment = appData.fragments.find(f => f.id === targetFragmentId);
    if (targetFragment?.parentId === sourceId) { render(); return; }
    const sourceChildren = appData.fragments.filter(f => f.parentId === sourceId);
    if (sourceChildren.some(c => c.id === targetFragmentId)) { render(); return; }
    const newData = mergeFragments(appData, sourceId, targetFragmentId);
    persistData(newData);
  }
  render();
}

function handleDragToDetach(e) {
  e.preventDefault();
  if (sortMode) { dragSortFromId = null; dragSortOverId = null; sortMode = false; render(); return; }
  const sourceId = draggingFragmentId; draggingFragmentId = null; dragOverFragmentId = null;
  if (!sourceId) { render(); return; }
  const fragment = appData.fragments.find(f => f.id === sourceId);
  if (fragment?.parentId) { const newData = unmergeFragment(appData, sourceId); persistData(newData); }
  render();
}

function handleDragEnd() {
  draggingFragmentId = null; dragOverFragmentId = null; dragSortFromId = null; dragSortOverId = null; sortMode = false;
}

// ===== 长按排序 =====
function handleTouchStart(fragmentId, e) {
  if (e.clientX) mouseDownPos = { x: e.clientX, y: e.clientY };
  else if (e.touches && e.touches[0]) mouseDownPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  longPressTimer = setTimeout(() => { sortMode = true; mouseDownPos = null; render(); }, 800);
}

function handleTouchEnd() {
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  mouseDownPos = null;
}

function handleTouchMove(e) {
  if (!mouseDownPos) return;
  let cx = 0, cy = 0;
  if (e.clientX) { cx = e.clientX; cy = e.clientY; }
  else if (e.touches && e.touches[0]) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
  if (Math.abs(cx - mouseDownPos.x) > 5 || Math.abs(cy - mouseDownPos.y) > 5) handleTouchEnd();
}

    h += '<div class="flex flex-col items-center gap-4 max-w-sm w-full px-4">';
    h += '<div class="text-center text-base text-text-primary/90 leading-relaxed paper-card-elevated p-5 border border-plant-leaf/20 w-full font-body">';
    h += '<span class="text-plant-leaf-light/65 text-xs block mb-1.5 font-caption">今日问题</span>';
    h += esc(selectedDailyQuestion.question)+'</div>';
    h += '<div class="w-full flex gap-2 items-center input-natural border border-plant-leaf/20">';
    h += '<input id="input-main" type="text" value="'+esc(inputText)+'" placeholder="写下你的回答…" class="flex-1 bg-transparent text-text-primary outline-none text-sm placeholder:text-text-muted/50 font-body">';
    h += '<button id="btn-daily-answer" class="btn-plant text-xs px-3 py-1">回答</button></div>';
    h += '<button onclick="selectedDailyQuestion=null;dailyFollowUpAnswers=[];dailyMainAnswer=\'\';dailySummary=null;render()" class="btn-ghost text-xs">换一题</button>';
    h += '</div>';
  }

  // 追问过渡提示
  if (followUpHint) {
    h += '<div class="text-center text-sm text-text-secondary/65 italic max-w-sm animate-pulse font-body">'+esc(followUpHint)+'</div>';
  }

  // 涟漪回音
  if (convState === 'echo' && currentEcho && !dailySummary) {
    h += '<div class="echo-text text-center text-base text-accent-ochre/85 max-w-sm font-body leading-relaxed">'+esc(currentEcho)+'</div>';
  }

  // 每日问题总结
  if (convState === 'echo' && dailySummary) {
    h += '<div class="flex flex-col items-center gap-3 max-w-sm w-full px-4">';
    h += '<div class="text-center text-sm text-text-primary/80 leading-relaxed paper-card-elevated p-5 border border-plant-leaf/20 whitespace-pre-line font-body">'+esc(dailySummary)+'</div>';
    h += '<button onclick="dailySummary=null;convState=\'idle\';currentEcho=null;selectedDailyQuestion=null;dailyFollowUpIndex=0;dailyFollowUpAnswer=\'\';dailyFollowUpAnswers=[];dailyMainAnswer=\'\';render()" class="btn-ghost text-xs">收起小结</button>';
    h += '</div>';
  }

  // 每日问题追问
  if (convState === 'follow_up' && currentFollowUp && selectedDailyQuestion) {
    h += '<div class="flex flex-col items-center gap-4 max-w-sm w-full px-4">';
    h += '<div class="text-center text-base text-text-primary/90 leading-relaxed paper-card-elevated p-5 border border-plant-leaf/20 font-body">';
    h += '<span class="text-plant-leaf-light/65 text-xs block mb-1.5 font-caption">追问 '+(dailyFollowUpIndex+1)+'/'+selectedDailyQuestion.followUpQuestions.length+'</span>';
    h += esc(currentFollowUp)+'</div>';
    h += '<div class="w-full flex gap-2 items-center input-natural border border-border-visible">';
    h += '<input id="input-followup" type="text" value="'+esc(dailyFollowUpAnswer)+'" placeholder="写下你的回答…" class="flex-1 bg-transparent text-text-primary outline-none text-sm placeholder:text-text-muted/50 font-body">';
    h += '<button id="btn-followup-send" class="btn-plant text-xs px-3 py-1">回应</button></div>';
    h += '<button onclick="handleSkipDailyFollowUp()" class="btn-ghost text-xs">跳过追问</button>';
    h += '</div>';
  }

  // 普通追问（无自带输入框，用底部通用输入框）
  if (convState === 'follow_up' && currentFollowUp && !selectedDailyQuestion) {
    h += '<div class="flex flex-col items-center gap-4">';
    h += '<div class="text-center text-lg text-text-primary/90 leading-relaxed max-w-sm font-body">'+esc(currentFollowUp)+'</div>';
    h += '<button onclick="convState=\'idle\';currentFollowUp=null;render()" class="btn-ghost text-xs">收起</button>';
    h += '</div>';
  }

  // 归类选择
  if (categorizePending) {
    h += '<div class="flex flex-col items-center gap-4">';
    h += '<p class="text-base text-text-secondary/80 text-center font-body">这颗石头，你觉得它更靠近哪片水域？</p>';
    h += '<div class="flex flex-wrap gap-3 justify-center">';
    pendingAnchors.forEach(aid => {
      const def = ANCHOR_DEFINITIONS.find(d => d.id === aid);
      h += '<button onclick="handleSelectAnchor(\''+aid+'\')" class="px-4 py-2 organic-md border border-border-visible text-text-primary/85 hover:border-accent-ochre/45 hover:text-text-primary hover:bg-surface-card-hover transition-all font-body text-sm">'+esc(def?def.name:aid)+'</button>';
    });
    h += '</div></div>';
  }

  // 矛盾探索五阶段教练
  if (convState === 'contradiction_coach' && contradictionSession) {
    h += '<div class="flex flex-col items-center gap-4 max-w-sm w-full px-4">';
    h += '<div class="flex items-center gap-2 mb-1">';
    h += '<span class="text-xs text-accent-ochre/65 border border-accent-ochre/30 organic-full px-3 py-0.5 font-caption">矛盾探索</span>';
    h += '<span class="text-xs text-text-tertiary/60 font-caption">阶段 '+contradictionSession.phase+'/5 · '+esc((coachPhases[contradictionSession.phase-1]||{}).name||'')+'</span></div>';

    if (contradictionSession.phase === 3) {
      h += '<div class="flex flex-col items-center gap-4">';
      h += '<div class="text-center text-base text-text-primary/90 leading-relaxed paper-card-elevated p-5 border border-accent-ochre/20 font-body">'+esc((coachPhases[2]||{}).coachResponse||'正在梳理你的矛盾…')+'</div>';
      h += '<p class="text-xs text-text-tertiary/55 font-caption">（正在梳理，请稍候…）</p></div>';
    } else if (contradictionSession.completed) {
      h += '<div class="flex flex-col items-center gap-4">';
      h += '<div class="text-center text-base text-accent-ochre/85 leading-relaxed paper-card-elevated p-5 border border-accent-ochre/20 font-body">'+esc(generateCompletionSummary(contradictionSession.anchors))+'</div>';
      h += '<p class="text-xs text-text-tertiary/55 font-caption">矛盾探索完成 · 即将返回湖面</p></div>';
    } else {
      h += '<div class="text-center text-base text-text-primary/90 leading-relaxed paper-card-elevated p-5 border border-border-visible font-body">'+esc((coachPhases[contradictionSession.phase-1]||{}).prompt||'')+'</div>';
      h += '<div class="w-full flex gap-2 items-center input-natural border border-border-visible">';
      h += '<input id="input-coach" type="text" value="'+esc(coachInput)+'" placeholder="写下你的感受…" class="flex-1 bg-transparent text-text-primary outline-none text-sm placeholder:text-text-muted/50 font-body">';
      h += '<button id="btn-coach-send" class="btn-natural text-xs px-3 py-1">回应</button></div>';
    }
    h += '<button onclick="handleCoachDismiss()" class="btn-ghost text-xs">跳过探索</button>';
    h += '</div>';
  }

  // 平静态提示
  if (convState === 'idle') {
    h += '<div class="text-center text-sm text-text-secondary/65 max-w-xs font-body italic">湖面平静。点击下方石头投石。</div>';
  }

  h += '</div>'; // end 中间内容区

  // 投石按钮 — 仅平静态
  if (convState === 'idle') {
    h += '<div class="relative flex justify-center pb-3 '+(surfaceTutorialStep===4?'z-50':'z-10')+'">';
    h += '<button id="btn-throw" class="px-10 py-4 organic-xl border-2 transition-all duration-300 text-base font-body shadow-soft bg-surface-card border-shore-stone/30 text-text-primary/85 hover:text-text-primary hover:border-accent-ochre/40 hover:bg-surface-card-hover active:scale-[0.97] '+
      (surfaceTutorialStep===4?'!border-accent-ochre/60 shadow-[0_0_32px_rgba(200,160,100,0.50)] animate-pulse pointer-events-none':'')+'">🪨 投石</button></div>';
  }

  // 底部导航 — 仅平静态
  if (convState === 'idle') {
    h += '<div class="relative z-10 flex justify-center gap-6 pb-6">';
    h += '<button id="btn-bottom" class="px-4 py-2 organic-full border transition-all text-xs font-body border-border-subtle text-text-secondary/65 hover:text-text-primary/80 hover:border-border-visible">湖底</button>';
    h += '<button id="btn-shore" class="px-4 py-2 organic-full border transition-all text-xs font-body border-border-subtle text-text-secondary/65 hover:text-text-primary/80 hover:border-border-visible">岸边</button>';
    h += '</div>';
  }

  // 通用输入区 — 自发投石/普通追问
  if (((convState === 'dialogue' && dialogueMode === 'stone') || (convState === 'follow_up' && !selectedDailyQuestion)) && !categorizePending) {
    h += '<div class="relative z-20 px-4 pb-4">';
    h += '<div class="flex justify-center mb-2">';
    h += '<button onclick="convState=\'idle\';currentFollowUp=null;inputText=\'\';followUpHint=null;render()" class="btn-ghost text-xs">收起</button></div>';
    h += '<div class="flex gap-3 items-center input-natural border border-border-visible">';
    h += '<input id="input-main" type="text" value="'+esc(inputText)+'" placeholder="写下你的感受、碎片、想法..." class="flex-1 bg-transparent text-text-primary outline-none text-sm placeholder:text-text-muted/50 font-body">';
    h += '<button id="btn-send" class="btn-natural text-sm px-4 py-1.5">发送</button></div></div>';
  }

  // 湖面教程覆盖层
  if (surfaceTutorialStep > 0 && !appData.user.surfaceTutorialCompleted) {
    // Step 2 时如果不需要显示引入选择题，不渲染覆盖层
    if (!(surfaceTutorialStep === 2 && (!isIntro || !introActive))) {
      h += renderSurfaceTutorial();
    }
  }

  h += '</div>';
  return h;
}

function renderSurfaceTutorial() {
  let h = '<div class="absolute inset-0 z-40">';
  const step = surfaceTutorialStep;
  const primaryAnchor = appData.user.anchors.find(a => a.isPrimary);
  const primaryName = primaryAnchor ? primaryAnchor.name : '';

  // Step 1: 叙事 — "你来到了这片湖。"
  if (step === 1) {
    h += '<div class="absolute inset-0 bg-water-surface flex items-center justify-center pointer-events-auto cursor-pointer" onclick="skipNarrativeStep()">';
    h += '<p class="tutorial-narrative-text text-xl text-text-primary/90 text-center leading-relaxed font-body px-8">你来到了这片湖。</p>';
    h += '<p class="absolute bottom-8 left-1/2 -translate-x-1/2 text-xs text-text-secondary/50 font-body animate-pulse">点击任意处跳过</p></div>';
  }

  // Step 2: 引入选择题
  if (step === 2 && introActive && isIntro && tiedAnchors.length === 0) {
    h += '<div class="absolute inset-0 bg-water-surface flex flex-col items-center justify-center pointer-events-auto">';
    h += '<div class="absolute inset-0 water-ripple-bg pointer-events-none"></div>';
    h += '<div class="absolute top-0 left-1/2 -translate-x-1/2 w-96 h-64 bg-gradient-to-b from-pond-sky/20 to-transparent rounded-full blur-3xl pointer-events-none"></div>';
    h += '<div class="relative z-10 flex flex-col items-center gap-10 max-w-md px-8">';
    h += '<p class="text-lg text-text-primary/90 text-center leading-relaxed font-body">'+esc(introQuestions[introStep].text)+'</p>';
    h += '<div class="flex flex-col gap-3 w-full">';
    introQuestions[introStep].options.forEach(opt => {
      h += '<button onclick="handleIntroSelect('+JSON.stringify(opt.mappedAnchors).replace(/"/g,'&quot;')+')" class="px-6 py-3.5 organic-md border border-border-visible hover:border-accent-ochre/45 hover:bg-surface-card-hover transition-all duration-300 text-left bg-surface-card font-body">';
      h += '<span class="block text-sm text-text-primary/90">'+esc(opt.label)+'</span>';
      h += '<span class="block text-xs text-text-secondary/60 mt-0.5">'+esc(opt.subLabel)+'</span></button>';
    });
    h += '</div>';
    h += '<p class="text-xs text-text-tertiary/70 font-caption tracking-widest">'+(introStep+1)+' / '+introQuestions.length+'</p>';
    h += '</div></div>';
  }

  // 平局选择主锚点
  if (step === 2 && tiedAnchors.length > 1) {
    h += '<div class="absolute inset-0 bg-water-surface flex flex-col items-center justify-center pointer-events-auto">';
    h += '<div class="absolute inset-0 water-ripple-bg pointer-events-none"></div>';
    h += '<div class="absolute top-0 left-1/2 -translate-x-1/2 w-96 h-64 bg-gradient-to-b from-pond-sky/20 to-transparent rounded-full blur-3xl pointer-events-none"></div>';
    h += '<div class="relative z-10 flex flex-col items-center gap-8 max-w-md px-8">';
    h += '<p class="text-lg text-text-primary/90 text-center leading-relaxed font-body">你似乎对这几个方面都很在意。<br/>你更想先探索哪一个？</p>';
    h += '<div class="flex flex-col gap-3 w-full">';
    tiedAnchors.forEach(aid => {
      const def = ANCHOR_DEFINITIONS.find(d => d.id === aid);
      if (!def) return;
      h += '<button onclick="handleTieSelect(\''+aid+'\')" class="px-6 py-3.5 organic-md border border-border-visible hover:border-accent-ochre/45 hover:bg-surface-card-hover transition-all duration-300 text-left bg-surface-card font-body">';
      h += '<span class="block text-sm text-text-primary/90">'+esc(def.name)+'</span>';
      h += '<span class="block text-xs text-text-secondary/60 mt-0.5">'+esc(def.definition)+'</span></button>';
    });
    h += '</div></div></div>';
  }

  // Step 3: 叙事 — "湖面平静。但是深处潜藏着你所有的规律和秘密。"
  if (step === 3) {
    h += '<div class="absolute inset-0 bg-water-surface flex items-center justify-center pointer-events-auto cursor-pointer" onclick="skipNarrativeStep()">';
    h += '<p class="tutorial-narrative-text text-xl text-text-primary/90 text-center leading-relaxed font-body px-8">湖面平静。<br/>但是深处潜藏着你所有的规律和秘密。</p>';
    h += '<p class="absolute bottom-8 left-1/2 -translate-x-1/2 text-xs text-text-secondary/50 font-body animate-pulse">点击任意处跳过</p></div>';
  }

  // Step 4: 投石按钮引导
  if (step === 4) {
    h += '<div class="absolute inset-0 pointer-events-auto z-40" onclick="advanceSurfaceTutorial()">';
    h += '<div class="absolute inset-0 bg-black/55 transition-opacity duration-500"></div>';
    h += '<div class="absolute bottom-[180px] left-1/2 -translate-x-1/2 text-center z-50 pointer-events-none w-full px-4">';
    h += '<p class="text-base text-text-primary/95 font-body mb-1">你可以往湖里投石，<br/>聆听自己的回音。</p>';
    if (primaryName) h += '<p class="text-xs text-accent-ochre/80 font-body mb-1">你刚刚选择的主锚点似乎是【'+esc(primaryName)+'】，记录一下这个方面你自己的体验吧</p>';
    h += '<p class="text-xs text-text-secondary/70 font-body mt-3">点击任意处继续</p></div>';
    h += '<div class="absolute bottom-8 left-1/2 -translate-x-1/2 z-50 pointer-events-none">';
    h += '<p class="text-xs text-text-secondary/50 font-body animate-pulse">点击任意处继续</p></div></div>';
  }

  // Step 5: 每日问题 + 本周议题引导
  if (step === 5) {
    h += '<div class="absolute inset-0 pointer-events-auto z-40" onclick="advanceSurfaceTutorial()">';
    h += '<div class="absolute inset-0 bg-black/55 transition-opacity duration-500"></div>';
    // 一级文案 — 放在与 Step 4 引导文字相同的底部位置
    h += '<div class="absolute bottom-[180px] left-1/2 -translate-x-1/2 text-center z-50 pointer-events-none w-full px-4">';
    h += '<p class="text-base text-text-primary/95 font-body mb-1">也可以只是坐着，对视自己的倒影</p></div>';
    h += '<div class="absolute top-[76px] left-1/2 -translate-x-1/2 z-50 pointer-events-none">';
    h += '<div class="flex items-start gap-3">';
    h += '<div class="flex items-center gap-2 px-3.5 py-0" style="width:auto;min-width:130px">';
    h += '<p class="text-[8px] text-text-secondary/70 font-body text-center leading-snug w-full">每天，<br/>一片叶子会落在湖面上，<br/>带着一个问题来找你。</p></div>';
    h += '<div class="flex items-center gap-2 px-3.5 py-0" style="width:auto;min-width:110px">';
    h += '<p class="text-[8px] text-text-secondary/70 font-body text-center leading-snug w-full">每周，<br/>豆荚会长出新的议题，<br/>等待你持续发现。</p></div>';
    h += '</div></div>';
    h += '<div class="absolute bottom-8 left-1/2 -translate-x-1/2 z-50 pointer-events-none">';
    h += '<p class="text-xs text-text-secondary/50 font-body animate-pulse">点击任意处继续</p></div></div>';
  }

  // Step 6: 收束叙事
  if (step === 6) {
    h += '<div class="absolute inset-0 bg-water-surface flex items-center justify-center pointer-events-auto cursor-pointer" onclick="skipNarrativeStep()">';
    h += '<p class="tutorial-narrative-text text-xl text-text-primary/90 text-center leading-relaxed font-body px-8">它们都将变成你留给未来的线索</p>';
    h += '<p class="absolute bottom-8 left-1/2 -translate-x-1/2 text-xs text-text-secondary/50 font-body animate-pulse">点击任意处跳过</p></div>';
  }

  h += '</div>';
  return h;
}


// ===== gen-ui-bottom.js =====
// ===== 湖底层渲染 =====
function renderBottom() {
  let h = '<div class="h-screen flex flex-col overflow-hidden bg-water-deep relative">';
  h += '<div class="absolute inset-0 water-ripple-bg pointer-events-none"></div>';

  // 顶部返回栏
  h += '<div class="relative z-10 flex justify-between items-center px-4 pt-6">';
  h += '<button id="btn-back" class="px-4 py-2 organic-full border border-border-visible text-sm text-text-secondary/80 hover:text-text-primary hover:border-border-active transition-all font-body cursor-pointer">↑ 湖面</button>';
  h += '<div class="flex items-center gap-3"><span class="text-sm text-text-tertiary/60 font-caption">湖底 — 你的沉淀</span></div></div>';

  // 多选操作栏
  if (selectionMode && selectedFragmentIds.size > 0) {
    h += '<div class="relative z-10 mx-4 mt-3 p-3 organic-md border border-accent-ochre/30 flex flex-wrap items-center gap-2 paper-card-elevated">';
    h += '<span class="text-xs text-accent-ochre/75 font-caption">已选 '+selectedFragmentIds.size+' 条</span>';
    h += '<input id="input-tag" class="flex-1 min-w-[120px] input-natural text-xs py-1 font-body" placeholder="输入标签，逗号分隔…" value="'+esc(tagInput)+'">';
    h += '<button id="btn-tag" class="btn-natural text-xs px-3 py-1">打标签</button>';
    const manualFolders = appData.sedimentFolders.filter(f => f.type !== 'tag');
    if (manualFolders.length > 0) {
      h += '<select id="sel-folder" class="input-natural text-xs py-1 text-text-secondary outline-none font-body"><option value="" disabled>归入分类夹…</option>';
      manualFolders.forEach(f => {
        h += '<option value="'+f.id+'">'+esc(f.name)+'</option>';
      });
      h += '</select>';
    }
    h += '</div>';
  }

  // 锚点石 + 碎片列表
  h += '<div class="relative z-10 flex-1 overflow-y-auto px-4 py-8" ondragover="event.preventDefault()" ondrop="handleDragToDetach(event)">';

  if (sortMode) {
    h += '<div class="sticky top-0 z-20 mb-4 px-4 py-2 organic-md border border-pond-water-pale/35 text-center cursor-pointer paper-card-elevated" onclick="sortMode=false;render()"><p class="text-xs text-pond-water-pale/75 font-caption">排序模式 · 拖拽记录调整顺序 · 点击此处退出</p></div>';
  }

  appData.user.anchors.forEach(anchor => {
    const mainFragments = appData.fragments
      .filter(f => f.anchorId === anchor.id && !f.parentId)
      .sort((a,b) => (a.order??a.createdAt) - (b.order??b.createdAt));
    const totalCount = appData.fragments.filter(f => f.anchorId === anchor.id).length;

    h += '<div class="mt-3 mb-2">';
    // 锚点石光圈
    h += '<div class="p-3 organic-md '+anchorGlowClass[anchor.id]+' border border-border-subtle" style="background:rgba(30,46,52,0.3)">';
    h += '<div class="flex items-center justify-between"><span class="text-sm font-medium text-text-primary/90 font-body">'+esc(anchor.name)+(anchor.isPrimary?' · 主锚点':'')+'</span>';
    h += '<span class="text-[10px] text-text-tertiary/50 font-body">'+totalCount+' 条记录</span></div>';
    h += '<p class="text-[10px] text-text-tertiary/45 mt-1 font-body">'+esc(anchor.definition)+'</p></div>';

    // 碎片列表
    if (mainFragments.length > 0) {
      h += '<div class="mt-2 space-y-0">';
      mainFragments.forEach(fragment => {
        h += renderFragmentCard(fragment, anchor.id);
      });
      h += '</div>';
    } else {
      h += '<p class="text-[10px] text-text-tertiary/35 text-center py-2 font-body">还没有记录</p>';
    }

    h += '</div>';
  });

  // 矛盾探索入口
  h += '<div class="mb-4 text-center">';
  h += '<button onclick="currentLayer=\'surface\';convState=\'idle\';render()" class="text-xs text-text-tertiary/55 hover:text-accent-ochre/65 transition-all font-body">';
  h += '✦ 矛盾探索 — 投石时若触及矛盾，会自动开启</button></div>';

  // 返回湖面
  h += '<div class="text-center py-3"><button onclick="handleGoBack()" class="btn-ghost text-xs">返回湖面</button></div>';

  // 沉积层
  h += '<div class="relative z-10 border-t border-border-subtle" style="background:rgba(30,48,56,0.96)">';
  h += '<div class="px-4 pt-4 pb-2">';
  h += '<div class="flex items-center justify-between mb-3">';
  h += '<h3 class="text-base font-semibold text-text-primary/90 font-caption tracking-wide">沉积层</h3>';
  h += '<div class="flex items-center gap-2">';
  h += '<button onclick="selectionMode=!selectionMode;selectedFragmentIds=new Set();render()" class="px-3 py-1 organic-full text-xs border transition-all font-body '+
    (selectionMode?'border-accent-ochre/40 text-accent-ochre/75 bg-accent-ochre/10':'border-border-subtle text-text-tertiary/55 hover:text-text-tertiary/70 hover:border-border-visible')+'">'+
    (selectionMode?'退出多选':'多选归类')+'</button>';
  h += '<span class="text-[11px] text-text-tertiary/40 font-caption">'+
    (appData.sedimentFolders.length>0?appData.sedimentFolders.length+' 个分类':'打标签或创建分类夹来整理')+'</span></div></div>';

  // 分类夹列表 — 水平 flex-wrap
  if (appData.sedimentFolders.length > 0) {
    h += '<div class="flex flex-wrap gap-2 mb-2">';
    appData.sedimentFolders.forEach(folder => {
      const count = folder.fragmentIds.length;
      const isTag = folder.type === 'tag';
      const isActive = showSedimentPanel === folder.id;
      h += '<div class="relative group/sediment">';
      h += '<button onclick="showSedimentPanel=showSedimentPanel===\''+folder.id+'\'?false:\''+folder.id+'\';render()" class="px-3 py-1.5 organic-full text-xs border transition-all font-body '+
        (isActive?'border-accent-ochre/40 text-accent-ochre/75 bg-accent-ochre/12':
         isTag?'border-border-subtle text-text-tertiary/55 hover:text-text-primary/65 hover:border-border-visible':
         'border-pond-water-pale/20 text-pond-water-pale/60 hover:text-pond-water-pale/75 hover:border-pond-water-pale/35')+'">';
      h += (isTag?'#':'📁')+' '+esc(folder.name);
      h += '<span class="ml-1 text-[10px] opacity-50">'+count+'</span></button></div>';
    });
    h += '</div>';
  } else {
    h += '<p class="text-[10px] text-text-tertiary/35 text-center py-2 font-body">还没有分类。多选记录并打标签，或点击下方 + 创建分类夹</p>';
  }

  // 展开详情
  if (typeof showSedimentPanel === 'string' && showSedimentPanel !== 'new') {
    const activeFolder = appData.sedimentFolders.find(f => f.id === showSedimentPanel);
    if (activeFolder) {
      const folderFragments = activeFolder.fragmentIds.map(fid => appData.fragments.find(f => f.id === fid)).filter(Boolean);
      h += '<div class="mt-2 p-3 organic-md border border-border-visible space-y-2 max-h-48 overflow-y-auto paper-card-elevated">';
      h += '<div class="flex items-center justify-between">';
      h += '<span class="text-xs text-text-primary/70 font-body">'+(activeFolder.type==='tag'?'#':'📁')+' '+esc(activeFolder.name)+'</span>';
      h += '<button onclick="showSedimentPanel=false;render()" class="text-[10px] text-text-tertiary/45 hover:text-text-tertiary/65 font-body">收起</button></div>';
      if (activeFolder.description) h += '<p class="text-[10px] text-text-tertiary/50 font-body">'+esc(activeFolder.description)+'</p>';
      if (folderFragments.length > 0) {
        h += '<div class="space-y-1">';
        folderFragments.forEach(ff => {
          h += '<div class="text-xs text-text-tertiary/55 pl-2 vine-line truncate font-body">'+esc(ff.content.slice(0,60))+(ff.content.length>60?'…':'')+'</div>';
        });
        h += '</div>';
      } else { h += '<p class="text-[10px] text-text-tertiary/35 font-body">暂无关联记录</p>'; }
      h += '</div>';
    }
  }

  // 新建分类夹
  if (showSedimentPanel === 'new') {
    h += '<div class="mt-2 p-3 organic-md border border-pond-water-pale/20 space-y-2 paper-card-elevated">';
    h += '<input id="input-folder-name" class="w-full input-natural text-sm py-1.5 font-body" placeholder="分类夹名称，如「我在乎的人」" value="'+esc(newFolderName)+'">';
    h += '<input id="input-folder-desc" class="w-full input-natural text-sm py-1.5 font-body" placeholder="描述（可选）" value="'+esc(newFolderDesc)+'">';
    h += '<div class="flex gap-2"><button id="btn-create-folder" class="btn-plant text-xs px-3 py-1">创建</button>';
    h += '<button onclick="showSedimentPanel=false;newFolderName=\'\';newFolderDesc=\'\';render()" class="btn-ghost text-xs">取消</button></div></div>';
  }

  h += '</div>'; // end px-4

  // 底部加号
  h += '<div class="flex justify-center pb-3"><button onclick="showSedimentPanel=showSedimentPanel===\'new\'?false:\'new\';newFolderName=\'\';newFolderDesc=\'\';render()" class="w-8 h-8 organic-full border flex items-center justify-center transition-all text-lg font-body '+
    (showSedimentPanel==='new'?'border-pond-water-pale/45 text-pond-water-pale/80 bg-pond-water-pale/10':'border-border-subtle text-text-tertiary/45 hover:text-text-tertiary/65 hover:border-border-visible')+'">'+
    (showSedimentPanel==='new'?'−':'+')+'</button></div>';

  // 底部提示
  h += '<div class="text-center pb-4"><p class="text-[10px] text-text-muted/35 font-caption tracking-wider">拖拽合并 · 拖到空白处分离 · 长按进入排序模式 · 双击删除 · 多选打标签</p></div>';

  h += '</div>'; // end 沉积层
  h += '</div>'; // end 滚动区

  // 湖底教程覆盖层
  if (bottomTutorialStep > 0 && !appData.user.bottomTutorialCompleted) {
    h += renderBottomTutorial();
  }

  h += '</div>';
  return h;
}

function renderFragmentCard(fragment, anchorId) {

    (sortMode?'cursor-grabbing':'cursor-grab')+'" '+

    'ondragstart="handleDragStart(event,\''+fragment.id+'\')" '+
    'ondragover="handleDragOver(event,\''+fragment.id+'\')" '+
    'ondragleave="handleDragLeave()" '+
    'ondrop="handleDrop(event,\''+fragment.id+'\',\''+anchorId+'\')" '+
    'ondragend="handleDragEnd()" '+
    'onmousedown="handleTouchStart(\''+fragment.id+'\',event)" '+
    'onmousemove="handleTouchMove(event)" '+
    'onmouseup="handleTouchEnd()" '+
    'onmouseleave="handleTouchEnd()" '+
    'ontouchstart="handleTouchStart(\''+fragment.id+'\',event)" '+
    'ontouchmove="handleTouchMove(event)" '+
    'ontouchend="handleTouchEnd()" '+
    'style="'+(isDragging?'opacity:0.4;':'')+'">';

  // 多选复选框
  if (selectionMode) {

      (isSelected?'border-accent-ochre bg-accent-ochre/20':'border-border-visible hover:border-border-active')+'">';

        childChildren.forEach(cc => {

            'ondblclick="handleDoubleClickDelete(\''+cc.id+'\')" title="双击删除">';
          if (cc.echoText && cc.echoText.startsWith('追问：')) h += '<p class="text-[9px] text-accent-ochre/35 mb-0.5 font-caption">'+esc(cc.echoText)+'</p>';

        });

      }

    });

  }

  h += '</div>'; // end 主容器

  if (btnSend) {
    btnSend.onclick = () => { handleThrowStone(); };
  }
  // 每日问题回答按钮
  const btnDailyAnswer = document.getElementById('btn-daily-answer');
  if (btnDailyAnswer) {
    btnDailyAnswer.onclick = () => { handleDailyAnswer(); };
  }
  // 通用输入框（自发投石）
  const inputMain = document.getElementById('input-main');
  if (inputMain) {
    inputMain.oninput = (e) => { inputText = e.target.value; };
    inputMain.onkeydown = (e) => {
      if (e.key === 'Enter') {
        if (dialogueMode === 'stone') handleThrowStone();
        else if (dialogueMode === 'leaf' && selectedDailyQuestion) handleDailyAnswer();
      }
    };
  }

  // 每日问题追问输入
  const inputFollowup = document.getElementById('input-followup');
  if (inputFollowup) {
    inputFollowup.oninput = (e) => { dailyFollowUpAnswer = e.target.value; };
    inputFollowup.onkeydown = (e) => { if (e.key === 'Enter') handleDailyFollowUpAnswer(); };
  }
  const btnFollowupSend = document.getElementById('btn-followup-send');
  if (btnFollowupSend) btnFollowupSend.onclick = handleDailyFollowUpAnswer;

  // 矛盾探索输入
  const inputCoach = document.getElementById('input-coach');
  if (inputCoach) {
    inputCoach.oninput = (e) => { coachInput = e.target.value; };
    inputCoach.onkeydown = (e) => { if (e.key === 'Enter') handleCoachSubmit(); };
  }
  const btnCoachSend = document.getElementById('btn-coach-send');
  if (btnCoachSend) btnCoachSend.onclick = handleCoachSubmit;

  // 叶子按钮
  const btnLeaf = document.getElementById('btn-leaf');
  if (btnLeaf) btnLeaf.onclick = handleLeafClick;

  // 每周议题按钮
  const btnWeekly = document.getElementById('btn-weekly');
  if (btnWeekly) btnWeekly.onclick = () => { showPlaceholder = 'weekly'; render(); };

  // 底部导航
  const btnBottom = document.getElementById('btn-bottom');
  if (btnBottom) btnBottom.onclick = handleGoBottom;
  const btnShore = document.getElementById('btn-shore');
  if (btnShore) btnShore.onclick = handleGoShore;

  // 返回按钮
  const btnBack = document.getElementById('btn-back');
  if (btnBack) btnBack.onclick = handleGoBack;

  // 湖底追问输入
  const inputLakeFollowup = document.getElementById('input-lake-followup');
  if (inputLakeFollowup) {
    inputLakeFollowup.oninput = (e) => { lakeFollowUpInput = e.target.value; };
    inputLakeFollowup.onkeydown = (e) => { if (e.key === 'Enter') handleLakeFollowUpSubmit(); };
  }
  const btnLakeFollowupSend = document.getElementById('btn-lake-followup-send');
  if (btnLakeFollowupSend) btnLakeFollowupSend.onclick = handleLakeFollowUpSubmit;

  // 补充思考输入
  const inputSupplement = document.getElementById('input-supplement');
  if (inputSupplement) {
    inputSupplement.oninput = (e) => { supplementInput = e.target.value; };
    inputSupplement.onkeydown = (e) => { if (e.key === 'Enter') handleSupplementSubmit(); };
  }
  const btnSupplementSend = document.getElementById('btn-supplement-send');
  if (btnSupplementSend) btnSupplementSend.onclick = handleSupplementSubmit;

  // 编辑输入
  const inputEdit = document.getElementById('input-edit');
  if (inputEdit) {
    inputEdit.oninput = (e) => { editContent = e.target.value; };
    inputEdit.onkeydown = (e) => { if (e.key === 'Enter') handleEditSave(); if (e.key === 'Escape') handleEditCancel(); };
  }
  const btnEditSave = document.getElementById('btn-edit-save');
  if (btnEditSave) btnEditSave.onclick = handleEditSave;

  // 标签输入
  const inputTag = document.getElementById('input-tag');
  if (inputTag) {
    inputTag.oninput = (e) => { tagInput = e.target.value; };
    inputTag.onkeydown = (e) => { if (e.key === 'Enter') handleTagSelected(); };
  }
  const btnTag = document.getElementById('btn-tag');
  if (btnTag) btnTag.onclick = handleTagSelected;

  // 分类夹下拉
  const selFolder = document.getElementById('sel-folder');
  if (selFolder) {
    selFolder.onchange = (e) => { if (e.target.value) handleMoveToFolder(e.target.value); };
  }

  // 新建分类夹
  const inputFolderName = document.getElementById('input-folder-name');
  if (inputFolderName) {
    inputFolderName.oninput = (e) => { newFolderName = e.target.value; };
    inputFolderName.onkeydown = (e) => { if (e.key === 'Enter') handleCreateFolder(); };
  }
  const inputFolderDesc = document.getElementById('input-folder-desc');
  if (inputFolderDesc) inputFolderDesc.oninput = (e) => { newFolderDesc = e.target.value; };
  const btnCreateFolder = document.getElementById('btn-create-folder');
  if (btnCreateFolder) btnCreateFolder.onclick = handleCreateFolder;

  // 拖拽到空白区域分离
  const scrollAreas = document.querySelectorAll('.overflow-y-auto');
  scrollAreas.forEach(area => {
    area.ondragover = (e) => { e.preventDefault(); };
    area.ondrop = handleDragToDetach;
  });

  // 教程自动推进
  if (surfaceTutorialStep > 0 && !appData.user.surfaceTutorialCompleted) {
    if (surfaceTutorialTimer) clearTimeout(surfaceTutorialTimer);
    if (surfaceTutorialStep === 2) {
      if (!isIntro) { surfaceTutorialStep = 3; render(); }
      else if (!introActive) { introActive = true; introStep = 0; render(); }
    } else if (surfaceTutorialStep !== 4 && surfaceTutorialStep !== 5) {
      const timings = { 1: 3500, 3: 3500, 6: 3500 };
      const delay = timings[surfaceTutorialStep] || 3500;
      surfaceTutorialTimer = setTimeout(() => {
        if (surfaceTutorialStep === 1) { introActive = true; introStep = 0; surfaceTutorialStep = 2; }
        else if (surfaceTutorialStep === 3) surfaceTutorialStep = 4;
        else if (surfaceTutorialStep < 6) surfaceTutorialStep++;
        else { const updated = completeSurfaceTutorial(appData); persistData(updated); surfaceTutorialStep = 0; }
        render();
      }, delay);
    }
  }

  if (bottomTutorialStep > 0 && !appData.user.bottomTutorialCompleted) {
    if (bottomTutorialTimer) clearTimeout(bottomTutorialTimer);
    if (bottomTutorialStep === 1) {
      bottomTutorialTimer = setTimeout(() => { bottomTutorialStep = 2; render(); }, 3500);
    }
  }

  if (shoreTutorialStep > 0 && !appData.user.shoreTutorialCompleted) {
    if (shoreTutorialTimer) clearTimeout(shoreTutorialTimer);
    if (shoreTutorialStep === 1) {
      shoreTutorialTimer = setTimeout(() => { shoreTutorialStep = 2; render(); }, 3500);
    } else if (shoreTutorialStep === 2) {
      shoreTutorialTimer = setTimeout(() => { shoreTutorialStep = 3; render(); }, 3500);
    }
  }
}

// ===== 启动应用 =====
init();


  </script>
</body>
</html>
