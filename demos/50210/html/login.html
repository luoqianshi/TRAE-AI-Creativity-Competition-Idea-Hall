<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电路开源社区 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="bi bi-cpu me-2"></i>
                <span>电路开源社区</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="projects.html">项目</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="components.html">元器件库</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="discussions.html">讨论区</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-cpu display-4 text-primary"></i>
                            <h2 class="mt-3">欢迎回来</h2>
                            <p class="text-muted">登录你的电路开源社区账号</p>
                        </div>

                        <form data-login-form>
                            <div class="mb-3">
                                <label for="email" class="form-label">邮箱地址</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" placeholder="请输入邮箱" required data-email-input>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">密码</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="请输入密码" required minlength="6" data-password-input>
                                    <button class="btn btn-outline-secondary" type="button" data-toggle-password>
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="remember" data-remember-me>
                                    <label class="form-check-label" for="remember">记住我</label>
                                </div>
                                <a href="#" class="text-decoration-none">忘记密码？</a>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mb-3" data-submit-btn>
                                <span class="spinner-border spinner-border-sm d-none" data-loading-spinner></span>
                                登录
                            </button>
                        </form>

                        <div class="text-center mb-4">
                            <span class="text-muted">或者</span>
                        </div>

                        <div class="d-grid gap-2 mb-4">
                            <button class="btn btn-outline-dark" type="button" data-social-login="github">
                                <i class="bi bi-github me-2"></i>使用 GitHub 登录
                            </button>
                            <button class="btn btn-outline-primary" type="button" data-social-login="wechat">
                                <i class="bi bi-wechat me-2"></i>使用微信登录
                            </button>
                        </div>

                        <div class="text-center">
                            <span class="text-muted">还没有账号？</span>
                            <a href="register.html" class="text-decoration-none">立即注册</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
