<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电路开源社区 - 注册</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="bi bi-cpu me-2"></i>
                <span>电路开源社区</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="projects.html">项目</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="components.html">元器件库</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="discussions.html">讨论区</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-cpu display-4 text-primary"></i>
                            <h2 class="mt-3">加入社区</h2>
                            <p class="text-muted">创建你的电路开源社区账号</p>
                        </div>

                        <form data-register-form>
                            <div class="mb-3">
                                <label for="username" class="form-label">用户名</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="username" placeholder="请输入用户名" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+" data-username-input>
                                </div>
                                <div class="form-text">3-20个字符，只允许字母、数字和下划线</div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">邮箱地址</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" placeholder="请输入邮箱" required data-email-input>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">密码</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="请输入密码" required minlength="8" data-password-input>
                                    <button class="btn btn-outline-secondary" type="button" data-toggle-password>
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div class="form-text">至少8个字符，包含字母和数字</div>
                                <div class="mt-2" data-password-strength>
                                    <div class="progress" style="height: 5px;">
                                        <div class="progress-bar" role="progressbar" style="width: 0%"></div>
                                    </div>
                                    <small class="text-muted" data-strength-text></small>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">确认密码</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" class="form-control" id="confirmPassword" placeholder="请再次输入密码" required data-confirm-password-input>
                                </div>
                            </div>

                            <div class="mb-4">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="agree" required data-agree-terms>
                                    <label class="form-check-label" for="agree">
                                        我已阅读并同意 <a href="#" class="text-decoration-none">用户协议</a> 和 <a href="#" class="text-decoration-none">隐私政策</a>
                                    </label>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mb-3" data-submit-btn>
                                <span class="spinner-border spinner-border-sm d-none" data-loading-spinner></span>
                                注册
                            </button>
                        </form>

                        <div class="text-center mb-4">
                            <span class="text-muted">或者</span>
                        </div>

                        <div class="d-grid gap-2 mb-4">
                            <button class="btn btn-outline-dark" type="button" data-social-register="github">
                                <i class="bi bi-github me-2"></i>使用 GitHub 注册
                            </button>
                            <button class="btn btn-outline-primary" type="button" data-social-register="wechat">
                                <i class="bi bi-wechat me-2"></i>使用微信注册
                            </button>
                        </div>

                        <div class="text-center">
                            <span class="text-muted">已有账号？</span>
                            <a href="login.html" class="text-decoration-none">立即登录</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
