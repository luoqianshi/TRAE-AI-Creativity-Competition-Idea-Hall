<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pipe Bird Loop</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #16213e;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: min(92vw, 900px);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 6px solid #0c1428;
      border-radius: 8px;
      background:
        linear-gradient(#7bdff2 0 62%, #76c893 62% 72%, #4f772d 72% 100%);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      isolation: isolate;
    }

    .sun {
      position: absolute;
      top: 7%;
      right: 10%;
      width: 10%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #ffd166;
      box-shadow: 0 0 35px rgba(255, 209, 102, 0.75);
    }

    .cloud {
      position: absolute;
      width: 19%;
      height: 8%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      animation: drift 18s linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      bottom: 25%;
      border-radius: 50%;
      background: inherit;
    }

    .cloud::before {
      left: 16%;
      width: 32%;
      aspect-ratio: 1;
    }

    .cloud::after {
      right: 18%;
      width: 42%;
      aspect-ratio: 1;
    }

    .cloud.one {
      top: 14%;
      left: 5%;
    }

    .cloud.two {
      top: 28%;
      left: 55%;
      width: 15%;
      animation-duration: 24s;
      animation-delay: -9s;
    }

    .pipe-set {
      position: absolute;
      inset: 0;
      animation: move-pipe 4.2s linear infinite;
    }

    .pipe-set.two {
      animation-delay: -2.1s;
    }

    .pipe {
      position: absolute;
      left: 110%;
      width: 12%;
      background:
        linear-gradient(90deg, #1b7f38 0 12%, #33b864 12% 76%, #0e6f2d 76%);
      border: 4px solid #0b4d24;
      box-shadow: inset 9px 0 0 rgba(255, 255, 255, 0.18);
    }

    .pipe::before {
      content: "";
      position: absolute;
      left: -14%;
      width: 128%;
      height: 13%;
      background:
        linear-gradient(90deg, #1b7f38 0 12%, #42d477 12% 76%, #0e6f2d 76%);
      border: 4px solid #0b4d24;
      border-radius: 4px;
    }

    .pipe.top {
      top: -4px;
      height: 31%;
      border-top: 0;
      border-radius: 0 0 4px 4px;
    }

    .pipe.top::before {
      bottom: -7%;
    }

    .pipe.bottom {
      bottom: 16%;
      height: 30%;
      border-bottom: 0;
      border-radius: 4px 4px 0 0;
    }

    .pipe.bottom::before {
      top: -7%;
    }

    .pipe-set.two .pipe.top {
      height: 22%;
    }

    .pipe-set.two .pipe.bottom {
      height: 38%;
    }

    .bird {
      position: absolute;
      left: 20%;
      top: 43%;
      width: 8%;
      aspect-ratio: 1.25;
      animation: bird-hop 1.05s ease-in-out infinite;
      z-index: 3;
    }

    .bird-body {
      position: absolute;
      inset: 10% 2% 8% 0;
      border: 4px solid #6c3f00;
      border-radius: 58% 48% 54% 48%;
      background: #ffca3a;
      box-shadow: inset -8px -8px 0 rgba(255, 145, 0, 0.35);
    }

    .bird-wing {
      position: absolute;
      left: 24%;
      top: 42%;
      width: 36%;
      height: 35%;
      border: 3px solid #6c3f00;
      border-radius: 52% 52% 58% 58%;
      background: #f77f00;
      transform-origin: 18% 12%;
      animation: flap 0.35s ease-in-out infinite alternate;
    }

    .bird-eye {
      position: absolute;
      top: 25%;
      right: 17%;
      width: 21%;
      aspect-ratio: 1;
      border: 3px solid #1d1d1d;
      border-radius: 50%;
      background: #fff;
    }

    .bird-eye::after {
      content: "";
      position: absolute;
      right: 13%;
      bottom: 17%;
      width: 42%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #1d1d1d;
    }

    .bird-beak {
      position: absolute;
      right: -15%;
      top: 43%;
      width: 25%;
      height: 20%;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
      background: #ef476f;
      border: 2px solid #7a1832;
    }

    .ground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 16%;
      background:
        repeating-linear-gradient(
          90deg,
          #d6a85b 0 36px,
          #c9913f 36px 72px
        );
      border-top: 5px solid #6b4f1d;
      animation: ground-scroll 0.8s linear infinite;
      z-index: 4;
    }

    .ground::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 28%;
      background: #7ac74f;
      border-bottom: 4px solid #497f28;
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: 5%;
      transform: translateX(-50%);
      z-index: 5;
      color: rgba(12, 20, 40, 0.75);
      font-size: clamp(12px, 1.8vw, 17px);
      font-weight: 700;
      pointer-events: none;
    }

    @keyframes bird-hop {
      0%, 100% {
        transform: translateY(20%) rotate(7deg);
      }
      42% {
        transform: translateY(-68%) rotate(-11deg);
      }
      72% {
        transform: translateY(-5%) rotate(5deg);
      }
    }

    @keyframes flap {
      from {
        transform: rotate(22deg);
      }
      to {
        transform: rotate(-30deg);
      }
    }

    @keyframes move-pipe {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-145%);
      }
    }

    @keyframes ground-scroll {
      from {
        background-position-x: 0;
      }
      to {
        background-position-x: -72px;
      }
    }

    @keyframes drift {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-150%);
      }
    }

    @media (max-width: 560px) {
      .scene {
        width: 100vw;
        height: 100vh;
        border: 0;
        border-radius: 0;
      }

      .bird {
        width: 18%;
        left: 18%;
      }

      .pipe {
        width: 20%;
      }

      .pipe.top {
        height: 29%;
      }

      .pipe.bottom {
        height: 34%;
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="Looping pipe bird animation">
    <div class="sun"></div>
    <div class="cloud one"></div>
    <div class="cloud two"></div>

    <section class="pipe-set" aria-hidden="true">
      <div class="pipe top"></div>
      <div class="pipe bottom"></div>
    </section>

    <section class="pipe-set two" aria-hidden="true">
      <div class="pipe top"></div>
      <div class="pipe bottom"></div>
    </section>

    <div class="bird" aria-hidden="true">
      <div class="bird-body"></div>
      <div class="bird-wing"></div>
      <div class="bird-eye"></div>
      <div class="bird-beak"></div>
    </div>

    <div class="ground"></div>
    <div class="hint">PIPE BIRD LOOP</div>
  </main>
</body>
</html>
