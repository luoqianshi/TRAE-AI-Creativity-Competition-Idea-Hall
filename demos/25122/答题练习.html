<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>操作系统答题练习</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  min-height: 100vh;
  color: #e0e0e0;
}
.container { max-width: 900px; margin: 0 auto; padding: 20px; }
.header { text-align: center; padding: 30px 20px 20px; }
.header h1 {
  font-size: 2em;
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.header p { color: #8892b0; font-size: 0.95em; }
.stats-bar { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-bottom: 25px; }
.stat-card {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 18px 24px;
  text-align: center;
  min-width: 100px;
  flex: 1;
  max-width: 180px;
}
.stat-card .num {
  font-size: 2em;
  font-weight: bold;
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.stat-card .label { color: #8892b0; font-size: 0.85em; margin-top: 4px; }
.stat-card.correct .num { background: linear-gradient(135deg, #00b894, #00cec9); -webkit-background-clip: text; background-clip: text; }
.stat-card.wrong .num { background: linear-gradient(135deg, #e17055, #d63031); -webkit-background-clip: text; background-clip: text; }
.controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 25px; }
.btn {
  padding: 12px 28px;
  border: none;
  border-radius: 30px;
  font-size: 0.95em;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  letter-spacing: 0.5px;
}
.btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; box-shadow: 0 4px 20px rgba(102,126,234,0.3); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(102,126,234,0.45); }
.btn-outline { background: transparent; color: #8892b0; border: 1.5px solid rgba(255,255,255,0.2); }
.btn-outline:hover { border-color: #667eea; color: #667eea; }
.btn-danger { background: linear-gradient(135deg, #e17055, #d63031); color: #fff; }
.btn-danger:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(214,48,49,0.35); }
.btn-success { background: linear-gradient(135deg, #00b894, #00cec9); color: #fff; }
.btn-success:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(0,184,148,0.35); }
.mode-select { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; flex-wrap: wrap; }
.mode-select .btn { padding: 10px 22px; font-size: 0.88em; }
.mode-select .btn.active { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border-color: transparent; }
.question-card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 30px;
  margin-bottom: 20px;
  animation: fadeIn 0.4s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
.question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.question-num { font-size: 0.9em; color: #667eea; font-weight: bold; }
.question-tag { font-size: 0.78em; padding: 4px 12px; border-radius: 20px; background: rgba(102,126,234,0.15); color: #667eea; }
.question-text { font-size: 1.1em; line-height: 1.8; margin-bottom: 25px; color: #f0f0f0; }
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  padding: 16px 20px;
  border: 1.5px solid rgba(255,255,255,0.12);
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.25s;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 0.95em;
}
.option:hover { border-color: #667eea; background: rgba(102,126,234,0.08); }
.option.selected { border-color: #667eea; background: rgba(102,126,234,0.18); }
.option.correct-answer { border-color: #00b894 !important; background: rgba(0,184,148,0.15) !important; color: #00cec9 !important; }
.option.wrong-answer { border-color: #e17055 !important; background: rgba(225,112,85,0.15) !important; color: #e17055 !important; }
.option.disabled { pointer-events: none; opacity: 0.7; }
.option-letter {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center;
  font-weight: bold; font-size: 0.9em; flex-shrink: 0;
}
.option.selected .option-letter { background: #667eea; color: #fff; }
.option.correct-answer .option-letter { background: #00b894; color: #fff; }
.option.wrong-answer .option-letter { background: #e17055; color: #fff; }
.feedback {
  margin-top: 20px;
  padding: 18px 22px;
  border-radius: 14px;
  font-size: 0.95em;
  display: none;
  animation: fadeIn 0.3s ease;
}
.feedback.show { display: block; }
.feedback.correct { background: rgba(0,184,148,0.1); border: 1px solid rgba(0,184,148,0.3); color: #00cec9; }
.feedback.wrong { background: rgba(225,112,85,0.1); border: 1px solid rgba(225,112,85,0.3); color: #e17055; }
.feedback .explanation { margin-top: 8px; color: #8892b0; font-size: 0.88em; line-height: 1.7; }
.progress-wrap { margin-bottom: 20px; display: none; align-items: center; gap: 12px; }
.progress-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 3px; transition: width 0.4s; }
.progress-text { color: #8892b0; font-size: 0.85em; white-space: nowrap; }
.complete-card { text-align: center; padding: 50px 30px; }
.complete-card .icon { font-size: 5em; margin-bottom: 20px; }
.complete-card h2 { font-size: 1.8em; margin-bottom: 10px; color: #00cec9; }
.complete-card .score {
  font-size: 3.5em; font-weight: bold;
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.complete-card .detail { color: #8892b0; margin: 15px 0 25px; line-height: 1.8; }
.wrong-review { margin-top: 25px; }
.wrong-review h3 { margin-bottom: 15px; color: #e17055; }
.review-item {
  background: rgba(255,255,255,0.04);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 12px;
  text-align: left;
  border: 1px solid rgba(255,255,255,0.06);
}
.review-item .q-text { color: #e0e0e0; margin-bottom: 10px; line-height: 1.7; }
.review-item .q-meta { font-size: 0.85em; color: #8892b0; }
.review-item .q-meta span { margin-right: 16px; }
.review-item .correct-tag { color: #00cec9; }
.review-item .wrong-tag { color: #e17055; }
@media (max-width: 600px) {
  .container { padding: 12px; }
  .question-card { padding: 20px 16px; }
  .stats-bar { gap: 8px; }
  .stat-card { padding: 14px 16px; min-width: 70px; }
  .stat-card .num { font-size: 1.5em; }
  .btn { padding: 10px 20px; font-size: 0.85em; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>操作系统 答题练习</h1>
    <p>共计 300 题 | 涵盖进程管理、内存管理、文件系统、I/O 等核心知识点</p>
  </div>

  <div class="stats-bar">
    <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">总答题</div></div>
    <div class="stat-card correct"><div class="num" id="statCorrect">0</div><div class="label">正确</div></div>
    <div class="stat-card wrong"><div class="num" id="statWrong">0</div><div class="label">错误</div></div>
    <div class="stat-card"><div class="num" id="statRate">0%</div><div class="label">正确率</div></div>
  </div>

  <div class="mode-select" id="modeSelect">
    <button class="btn btn-outline active" data-mode="random">随机出题</button>
    <button class="btn btn-outline" data-mode="sequential">顺序出题</button>
    <button class="btn btn-outline" data-mode="wrong">错题复习</button>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="btnStart">开始答题</button>
    <button class="btn btn-outline" id="btnReset">重置统计</button>
    <button class="btn btn-danger" id="btnStop" style="display:none;">结束答题</button>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">0/20</div>
  </div>

  <div id="questionArea"></div>
</div>

  {"id":298,"topic":"设备管理","question":"虚拟设备是通过（\u3000）技术实现的。","options":["A. 缓冲","B. 中断","C. SPOOLing","D. DMA"],"answer":"C"},
  {"id":299,"topic":"文件管理","question":"在文件系统中，采用位示图管理磁盘空闲块时，位示图的大小由（\u3000）决定。","options":["A. 磁盘容量和盘块大小","B. 文件数量","C. 目录数量","D. 内存大小"],"answer":"A"},
  {"id":300,"topic":"操作系统概述","question":"以下关于微内核操作系统的描述中，错误的是（\u3000）。","options":["A. 微内核将最基本的服务放在内核中","B. 微内核具有较好的可扩展性","C. 微内核具有较好的可移植性","D. 微内核的性能通常优于单体内核"],"answer":"D"}

</script>

<script>
(function() {
  'use strict';

  // 从 JSON 标签加载题库（避免中文引号等语法问题）
  var questions = JSON.parse(document.getElementById('quiz-data').textContent);

  // ==================== 应用状态 ====================
  var state = {
    mode: 'random',
    totalAnswered: 0,
    correctCount: 0,
    wrongCount: 0,
    wrongList: [],
    currentIndex: 0,
    answered: false,
    selectedAnswer: null,
    currentQuestion: null,
    isActive: false,
    questionPool: [],
    totalTarget: 20,
    roundCorrect: 0,
    roundTotal: 0
  };

  // ==================== DOM 元素 ====================
  var $ = function(id) { return document.getElementById(id); };

  var btnStart = $('btnStart');
  var btnStop = $('btnStop');
  var btnReset = $('btnReset');
  var progressWrap = $('progressWrap');
  var progressFill = $('progressFill');
  var progressText = $('progressText');
  var questionArea = $('questionArea');
  var modeSelect = $('modeSelect');
  var statTotal = $('statTotal');
  var statCorrect = $('statCorrect');
  var statWrong = $('statWrong');
  var statRate = $('statRate');

  // ==================== 初始化 ====================
  function init() {
    loadFromStorage();
    updateStats();
    console.log('答题练习初始化成功！题库:', questions.length, '题');
  }

  function loadFromStorage() {
    try {
      var saved = JSON.parse(localStorage.getItem('osQuizState'));
      if (saved) {
        state.totalAnswered = saved.totalAnswered || 0;
        state.correctCount = saved.correctCount || 0;
        state.wrongCount = saved.wrongCount || 0;
        state.wrongList = saved.wrongList || [];
      }
    } catch(e) {
      console.warn('localStorage 不可用，统计数据将不会保存');
    }
  }

  function saveToStorage() {
    try {
      localStorage.setItem('osQuizState', JSON.stringify({
        totalAnswered: state.totalAnswered,
        correctCount: state.correctCount,
        wrongCount: state.wrongCount,
        wrongList: state.wrongList
      }));
    } catch(e) {}
  }

  // ==================== 事件绑定 ====================
  btnStart.addEventListener('click', startPractice);
  btnStop.addEventListener('click', stopPractice);
  btnReset.addEventListener('click', resetStats);

  // 模式切换 - 使用事件委托
  modeSelect.addEventListener('click', function(e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var mode = btn.getAttribute('data-mode');
    if (!mode) return;
    switchMode(mode);
  });

  // ==================== 模式切换 ====================
  function switchMode(mode) {
    if (state.isActive) {
      if (!confirm('当前答题未完成，切换模式将放弃本轮进度，确定吗？')) return;
    }
    state.mode = mode;
    state.isActive = false;
    btnStart.style.display = '';
    btnStop.style.display = 'none';
    progressWrap.style.display = 'none';
    questionArea.innerHTML = '';

    var buttons = modeSelect.querySelectorAll('.btn');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.remove('active');
    }
    var target = modeSelect.querySelector('[data-mode="' + mode + '"]');
    if (target) target.classList.add('active');
  }

  // ==================== 开始答题 ====================
  function startPractice() {
    state.isActive = true;
    state.currentIndex = 0;
    state.answered = false;
    state.roundCorrect = 0;
    state.roundTotal = 0;

    if (state.mode === 'wrong') {
      state.questionPool = questions.filter(function(q) {
        return state.wrongList.indexOf(q.id) !== -1;
      });
      if (state.questionPool.length === 0) {
        alert('没有错题可复习！请先做一些题积累错题。');
        state.isActive = false;
        return;
      }
    } else if (state.mode === 'sequential') {
      state.questionPool = questions.slice();
    } else {
      state.questionPool = shuffleArray(questions.slice());
    }

    // 顺序出题模式：直接出全部题目；随机/错题模式：最多20题
    if (state.mode === 'sequential') {
      state.totalTarget = state.questionPool.length;
    } else {
      state.totalTarget = Math.min(20, state.questionPool.length);
    }

    btnStart.style.display = 'none';
    btnStop.style.display = '';
    progressWrap.style.display = 'flex';
    showQuestion();
  }

  function stopPractice() {
    state.isActive = false;
    btnStart.style.display = '';
    btnStop.style.display = 'none';
    progressWrap.style.display = 'none';
    questionArea.innerHTML = '';
  }

  // ==================== 显示题目 ====================
  function showQuestion() {
    if (state.currentIndex >= state.totalTarget || state.questionPool.length === 0) {
      showComplete();
      return;
    }

    var q = state.questionPool[state.currentIndex];
    state.currentQuestion = q;
    state.answered = false;
    state.selectedAnswer = null;

    var html = '';
    html += '<div class="question-card">';
    html += '<div class="question-header">';
    html += '<span class="question-num">第 ' + (state.currentIndex + 1) + '/' + state.totalTarget + ' 题 #' + q.id + '</span>';
    html += '<span class="question-tag">' + q.topic + '</span>';
    html += '</div>';
    html += '<div class="question-text">' + q.question + '</div>';
    html += '<div class="options">';

    q.options.forEach(function(opt, i) {
      var letter = String.fromCharCode(65 + i);
      var text = opt.substring(2).trim();
      html += '<div class="option" data-letter="' + letter + '">';
      html += '<span class="option-letter">' + letter + '</span>';
      html += '<span>' + text + '</span>';
      html += '</div>';
    });

    html += '</div>';
    html += '<div class="feedback" id="feedback"></div>';
    html += '<div style="text-align:center;margin-top:20px;" id="nextBtnWrap"></div>';
    html += '</div>';

    questionArea.innerHTML = html;
    updateProgress();

    // 绑定选项点击事件
    var options = questionArea.querySelectorAll('.option');
    for (var j = 0; j < options.length; j++) {
      options[j].addEventListener('click', function() {
        selectAnswer(this.getAttribute('data-letter'));
      });
    }
  }

  // ==================== 选择答案 ====================
  function selectAnswer(letter) {
    if (state.answered) return;
    state.answered = true;
    state.selectedAnswer = letter;

    var q = state.currentQuestion;
    var isCorrect = (letter === q.answer);

    var allOptions = questionArea.querySelectorAll('.option');
    for (var i = 0; i < allOptions.length; i++) {
      var opt = allOptions[i];
      opt.classList.add('disabled');
      var ol = opt.getAttribute('data-letter');
      if (ol === q.answer) opt.classList.add('correct-answer');
      if (ol === letter && !isCorrect) opt.classList.add('wrong-answer');
    }

    state.totalAnswered++;
    state.roundTotal++;
    if (isCorrect) {
      state.correctCount++;
      state.roundCorrect++;
    } else {
      state.wrongCount++;
      if (state.wrongList.indexOf(q.id) === -1) {
        state.wrongList.push(q.id);
      }
    }

    var fb = $('feedback');
    fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
    fb.innerHTML = isCorrect
      ? '回答正确！'
      : '回答错误！ 正确答案是：<strong>' + q.answer + '</strong>';

    var isLast = state.currentIndex >= state.totalTarget - 1;
    var nextBtn = $('nextBtnWrap');
    nextBtn.innerHTML = '<button class="btn btn-primary" id="btnNext">' +
      (isLast ? '查看结果' : '下一题 →') + '</button>';

    $('btnNext').addEventListener('click', nextQuestion);

    updateStats();
    saveToStorage();
  }

  function nextQuestion() {
    state.currentIndex++;
    showQuestion();
  }

  // ==================== 完成 ====================
  function showComplete() {
    state.isActive = false;
    var rate = state.roundTotal > 0 ? Math.round(state.roundCorrect / state.roundTotal * 100) : 0;

    var emoji = rate >= 80 ? '\uD83C\uDF89' : rate >= 60 ? '\uD83D\uDC4D' : '\uD83D\uDCAA';

    var html = '';
    html += '<div class="question-card complete-card">';
    html += '<div class="icon">' + emoji + '</div>';
    html += '<h2>本轮答题完成！</h2>';
    html += '<div class="score">' + rate + '%</div>';
    html += '<div class="detail">';
    html += '本轮：正确 ' + state.roundCorrect + ' 题 / 共 ' + state.roundTotal + ' 题<br>';
    html += '累计：答题 ' + state.totalAnswered + ' 题 | 正确 ' + state.correctCount + ' 题';
    html += '</div>';
    html += '<div class="controls">';
    html += '<button class="btn btn-primary" id="btnAgain">再来一轮</button>';
    html += '<button class="btn btn-outline" id="btnBack">返回</button>';
    html += '</div>';

    // 错题回顾
    if (state.wrongList.length > 0) {
      html += '<div class="wrong-review"><h3>错题回顾 (' + state.wrongList.length + '题)</h3>';
      for (var i = 0; i < state.wrongList.length; i++) {
        var id = state.wrongList[i];
        var q = null;
        for (var j = 0; j < questions.length; j++) {
          if (questions[j].id === id) { q = questions[j]; break; }
        }
        if (q) {
          html += '<div class="review-item">';
          html += '<div class="q-text">#' + q.id + ' ' + q.question + '</div>';
          html += '<div class="q-meta">';
          html += '<span class="correct-tag">正确答案：' + q.answer + '</span>';
          html += '<span class="wrong-tag">知识点：' + q.topic + '</span>';
          html += '</div></div>';
        }
      }
      html += '</div>';
    }

    html += '</div>';

    questionArea.innerHTML = html;
    btnStart.style.display = '';
    btnStop.style.display = 'none';
    progressWrap.style.display = 'none';
    updateStats();

    // 绑定完成页按钮
    var btnAgain = $('btnAgain');
    var btnBack = $('btnBack');
    if (btnAgain) btnAgain.addEventListener('click', startPractice);
    if (btnBack) btnBack.addEventListener('click', function() {
      switchMode('random');
      stopPractice();
    });
  }

  // ==================== 重置统计 ====================
  function resetStats() {
    if (!confirm('确定要重置所有统计数据吗？（包括错题记录）')) return;
    state.totalAnswered = 0;
    state.correctCount = 0;
    state.wrongCount = 0;
    state.wrongList = [];
    state.isActive = false;
    btnStart.style.display = '';
    btnStop.style.display = 'none';
    progressWrap.style.display = 'none';
    questionArea.innerHTML = '';
    updateStats();
    saveToStorage();
  }

  // ==================== 更新统计 ====================
  function updateStats() {
    statTotal.textContent = state.totalAnswered;
    statCorrect.textContent = state.correctCount;
    statWrong.textContent = state.wrongCount;
    var rate = state.totalAnswered > 0 ? Math.round(state.correctCount / state.totalAnswered * 100) : 0;
    statRate.textContent = rate + '%';
  }

  function updateProgress() {
    var pct = Math.round((state.currentIndex / state.totalTarget) * 100);
    progressFill.style.width = pct + '%';
    progressText.textContent = state.currentIndex + '/' + state.totalTarget;
  }

  // ==================== 工具函数 ====================
  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }

  // ==================== 启动 ====================
  init();
})();
</script>
</body>
