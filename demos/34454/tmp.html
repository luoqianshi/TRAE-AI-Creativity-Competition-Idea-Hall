<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>简程 · 项目琐事看板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f5f7fb;
            color: #1e293b;
            padding: 20px;
            min-height: 100vh;
        }
        .app {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 24px;
            background: white;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.06);
            min-height: 90vh;
        }
        /* 侧边栏 */
        .sidebar {
            border-right: 1px solid #e9edf4;
            padding-right: 20px;
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo span {
            background: #3b82f6;
            color: white;
            font-size: 16px;
            padding: 2px 10px;
            border-radius: 40px;
        }
        .nav-section {
            margin-bottom: 32px;
        }
        .nav-section h3 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            margin-bottom: 12px;
        }
        .nav-item {
            display: block;
            padding: 8px 12px;
            border-radius: 10px;
            color: #334155;
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 4px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .nav-item:hover {
            background: #f1f5f9;
        }
        .nav-item.active {
            background: #eef2ff;
            color: #3b82f6;
        }
        .project-list {
            margin-top: 8px;
        }
        .project-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.1s;
            font-size: 14px;
        }
        .project-item:hover {
            background: #f8fafc;
        }
        .project-item.active {
            background: #eef2ff;
            font-weight: 500;
        }
        .project-item .badge {
            background: #e2e8f0;
            border-radius: 40px;
            padding: 0 8px;
            font-size: 12px;
            color: #475569;
        }
        .add-project {
            margin-top: 12px;
            display: flex;
            gap: 6px;
        }
        .add-project input {
            flex: 1;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 14px;
            outline: none;
            background: white;
        }
        .add-project input:focus {
            border-color: #3b82f6;
        }
        .add-project button {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 6px 16px;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
        }
        .add-project button:hover {
            background: #2563eb;
        }
        /* 主内容 */
        .main {
            padding-left: 4px;
        }
        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .view-header h2 {
            font-size: 22px;
            font-weight: 600;
        }
        .view-tabs {
            display: flex;
            gap: 6px;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 40px;
        }
        .view-tabs button {
            border: none;
            background: transparent;
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: 500;
            cursor: pointer;
            color: #475569;
            transition: 0.1s;
            font-size: 14px;
        }
        .view-tabs button.active {
            background: white;
            color: #0f172a;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .task-board {
            margin-top: 8px;
        }
        .task-card {
            background: white;
            border: 1px solid #e9edf4;
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: 0.1s;
        }
        .task-card:hover {
            border-color: #cbd5e1;
        }
        .task-card .checkbox {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
        }
        .task-card .checkbox.done {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }
        .task-card .checkbox.done::after {
            content: "✓";
            font-weight: 700;
            font-size: 14px;
        }
        .task-info {
            flex: 1;
        }
        .task-title {
            font-weight: 500;
            font-size: 15px;
        }
        .task-meta {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: #64748b;
            margin-top: 2px;
            flex-wrap: wrap;
        }
        .task-meta .project-tag {
            background: #eef2ff;
            color: #3b82f6;
            padding: 0 10px;
            border-radius: 30px;
            font-size: 12px;
        }
        .task-meta .due {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .task-meta .due.overdue {
            color: #ef4444;
        }
        .task-meta .due.today {
            color: #f59e0b;
        }
        .delete-task {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 18px;
            padding: 0 4px;
        }
        .delete-task:hover {
            color: #ef4444;
        }
        /* 添加任务 */
        .add-task-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: #f8fafc;
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            align-items: center;
        }
        .add-task-form input, .add-task-form select {
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 14px;
            background: white;
            outline: none;
            flex: 1 1 150px;
        }
        .add-task-form input:focus, .add-task-form select:focus {
            border-color: #3b82f6;
        }
        .add-task-form button {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 8px 24px;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
        }
        .add-task-form button:hover {
            background: #2563eb;
        }
        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: #94a3b8;
        }
        .empty-state p {
            margin-top: 8px;
        }
        /* 视图容器 */
        .view-container {
            display: block;
        }
        .view-container.hidden {
            display: none;
        }
        /* 日历网格 */
        .week-grid, .month-grid {
            display: grid;
            gap: 6px;
            margin-top: 12px;
        }
        .week-grid {
            grid-template-columns: repeat(7, 1fr);
        }
        .month-grid {
            grid-template-columns: repeat(7, 1fr);
        }
        .day-cell {
            background: #f8fafc;
            border-radius: 12px;
            padding: 8px 4px;
            min-height: 60px;
            font-size: 13px;
            text-align: center;
            border: 1px solid transparent;
        }
        .day-cell.today {
            border-color: #3b82f6;
            background: #f0f7ff;
        }
        .day-cell .date {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .day-cell .task-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #3b82f6;
            border-radius: 50%;
            margin: 0 2px;
        }
        .day-cell .task-dot.completed {
            background: #94a3b8;
        }
        /* 响应式 */
        @media (max-width: 800px) {
            .app {
                grid-template-columns: 1fr;
                padding: 16px;
            }
            .sidebar {
                border-right: none;
                padding-right: 0;
                border-bottom: 1px solid #e9edf4;
                padding-bottom: 16px;
                margin-bottom: 16px;
            }
            .project-list {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
            }
            .project-item {
                padding: 4px 12px;
                background: #f1f5f9;
                border-radius: 40px;
            }
        }
        @media (max-width: 500px) {
            .add-task-form {
                flex-direction: column;
            }
            .add-task-form input, .add-task-form select {
                width: 100%;
            }
            .view-tabs button {
                padding: 4px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="logo">📋 简程 <span>Beta</span></div>
        <div class="nav-section">
            <h3>看板</h3>
            <div class="nav-item active" data-view="today">📌 今日任务</div>
            <div class="nav-item" data-view="week">📅 本周</div>
            <div class="nav-item" data-view="month">📆 本月</div>
        </div>
        <div class="nav-section">
            <h3>项目</h3>
            <div class="project-list" id="projectList">
                <!-- 动态渲染 -->
            </div>
            <div class="add-project">
                <input type="text" id="newProjectInput" placeholder="新建项目..." />
                <button id="addProjectBtn">+</button>
            </div>
        </div>
    </div>
    <!-- 主内容 -->
    <div class="main">
        <div class="view-header">
            <h2 id="viewTitle">今日任务</h2>
            <div class="view-tabs">
                <button class="active" data-view="today">今日</button>
                <button data-view="week">周</button>
                <button data-view="month">月</button>
            </div>
        </div>
        <!-- 今日视图 -->
        <div id="viewToday" class="view-container">
            <div id="todayBoard"></div>
        </div>
        <!-- 周视图 -->
        <div id="viewWeek" class="view-container hidden">
            <div id="weekBoard"></div>
        </div>
        <!-- 月视图 -->
        <div id="viewMonth" class="view-container hidden">
            <div id="monthBoard"></div>
        </div>
    </div>
</div>
<script>
    // ---------- 数据层 ----------
    const STORAGE_KEY = 'simpletrack_data';
    let data = loadData();

    function loadData() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            try {
                return JSON.parse(raw);
            } catch(e) {}
        }
        return { projects: [], tasks: [] };
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // 辅助函数
    function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function getProject(id) {
        return data.projects.find(p => p.id === id);
    }

    function getTasksForProject(projectId) {
        return data.tasks.filter(t => t.projectId === projectId);
    }

    function getAllTasks() {
        return data.tasks;
    }

    function getTasksForDate(dateStr) {
        // dateStr format: YYYY-MM-DD
        return data.tasks.filter(t => t.dueDate === dateStr);
    }

    function getTodayStr() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        const parts = dateStr.split('-');
        return parts[0] + '年' + parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日';
    }

    function isToday(dateStr) {
        return dateStr === getTodayStr();
    }

    function isOverdue(dateStr) {
        if (!dateStr) return false;
        return dateStr < getTodayStr();
    }

    // ---------- 渲染函数 ----------
    function renderProjectList() {
        const container = document.getElementById('projectList');
        container.innerHTML = '';
        data.projects.forEach(p => {
            const div = document.createElement('div');
            div.className = 'project-item';
            const count = getTasksForProject(p.id).filter(t => !t.completed).length;
            div.innerHTML = `<span>${p.name}</span><span class="badge">${count}</span>`;
            div.dataset.projectId = p.id;
            div.addEventListener('click', () => {
                // 切换到项目视图（直接显示今日，但过滤该项目？我们简单处理：选中项目并刷新今日视图）
                // 为了简化，我们在今日视图里增加项目筛选？目前设计为全局看板，点击项目可筛选
                // 我们用URL参数或状态来模拟：设定当前筛选项目
                currentProjectFilter = p.id;
                renderAllViews();
                // 高亮项目
                document.querySelectorAll('.project-item').forEach(el => el.classList.remove('active'));
                div.classList.add('active');
                document.getElementById('viewTitle').textContent = `📁 ${p.name} 的任务`;
            });
            container.appendChild(div);
        });
        // 清除高亮
        document.querySelectorAll('.project-item').forEach(el => el.classList.remove('active'));
    }

    let currentProjectFilter = null; // null 表示全部

    function renderTodayBoard() {
        const container = document.getElementById('todayBoard');
        const today = getTodayStr();
        let tasks = getAllTasks().filter(t => !t.completed);
        if (currentProjectFilter) {
            tasks = tasks.filter(t => t.projectId === currentProjectFilter);
        }
        // 按截止日期排序，今天和过期的优先
        tasks.sort((a,b) => {
            if (!a.dueDate && !b.dueDate) return 0;
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;
            return a.dueDate.localeCompare(b.dueDate);
        });
        // 展示所有未完成，但标记今天/过期
        if (tasks.length === 0) {
            container.innerHTML = `<div class="empty-state"><div>🎯</div><p>太棒啦，今天没有待办任务！</p></div>`;
            return;
        }
        let html = '';
        tasks.forEach(t => {
            const project = getProject(t.projectId);
            const due = t.dueDate ? formatDate(t.dueDate) : '无截止';
            let dueClass = '';
            if (t.dueDate && isOverdue(t.dueDate)) dueClass = 'overdue';
            else if (t.dueDate && isToday(t.dueDate)) dueClass = 'today';
            html += `
                <div class="task-card" data-task-id="${t.id}">
                    <div class="checkbox" onclick="toggleTask('${t.id}')"></div>
                    <div class="task-info">
                        <div class="task-title">${escapeHtml(t.title)}</div>
                        <div class="task-meta">
                            <span class="project-tag">${project ? escapeHtml(project.name) : '已删除'}</span>
                            <span class="due ${dueClass}">📅 ${due}</span>
                            ${t.note ? `<span>📝 ${escapeHtml(t.note)}</span>` : ''}
                        </div>
                    </div>
                    <button class="delete-task" onclick="deleteTask('${t.id}')">✕</button>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function renderWeekBoard() {
        const container = document.getElementById('weekBoard');
        // 计算本周日期范围 (周一到周日)
        const now = new Date();
        const dayOfWeek = now.getDay(); // 0 周日
        const diff = (dayOfWeek === 0 ? 6 : dayOfWeek - 1); // 周一偏移
        const monday = new Date(now);
        monday.setDate(now.getDate() - diff);
        const dates = [];
        for (let i = 0; i < 7; i++) {
            const d = new Date(monday);
            d.setDate(monday.getDate() + i);
            const y = d.getFullYear();
            const m = String(d.getMonth()+1).padStart(2,'0');
            const day = String(d.getDate()).padStart(2,'0');
            dates.push(y + '-' + m + '-' + day);
        }
        let html = `<div class="week-grid">`;
        const weekdays = ['周一','周二','周三','周四','周五','周六','周日'];
        dates.forEach((dateStr, idx) => {
            const tasks = getAllTasks().filter(t => t.dueDate === dateStr);
            const completed = tasks.filter(t => t.completed);
            const uncompleted = tasks.filter(t => !t.completed);
            const isTodayFlag = dateStr === getTodayStr();
            html += `<div class="day-cell ${isTodayFlag ? 'today' : ''}">
                <div class="date">${weekdays[idx]}<br>${dateStr.slice(5)}</div>
                <div>${uncompleted.length} 未完成</div>
                <div style="font-size:12px;color:#94a3b8;">${completed.length} 已完成</div>
                <div style="margin-top:4px;">
                    ${uncompleted.slice(0,3).map(t => `<span class="task-dot"></span>`).join('')}
                    ${uncompleted.length > 3 ? `<span style="font-size:12px;">+${uncompleted.length-3}</span>` : ''}
                </div>
            </div>`;
        });
        html += `</div>`;
        container.innerHTML = html;
    }

    function renderMonthBoard() {
        const container = document.getElementById('monthBoard');
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const firstDay = new Date(year, month, 1).getDay(); // 0周日
        const daysInMonth = new Date(year, month+1, 0).getDate();
        let html = `<div class="month-grid">`;
        const weekdays = ['日','一','二','三','四','五','六'];
        // 头部
        weekdays.forEach(w => {
            html += `<div style="font-weight:600;text-align:center;padding:4px 0;">${w}</div>`;
        });
        // 空白格
        for (let i = 0; i < (firstDay === 0 ? 6 : firstDay - 1); i++) {
            html += `<div></div>`;
        }
        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
            const tasks = getAllTasks().filter(t => t.dueDate === dateStr);
            const uncompleted = tasks.filter(t => !t.completed);
            const isTodayFlag = dateStr === getTodayStr();
            html += `<div class="day-cell ${isTodayFlag ? 'today' : ''}">
                <div class="date">${d}</div>
                <div>${uncompleted.length > 0 ? uncompleted.length : ''}</div>
                <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:2px;">
                    ${uncompleted.slice(0,3).map(t => `<span class="task-dot"></span>`).join('')}
                    ${uncompleted.length > 3 ? `<span style="font-size:10px;">+${uncompleted.length-3}</span>` : ''}
                </div>
            </div>`;
        }
        html += `</div>`;
        container.innerHTML = html;
    }

    function renderAllViews() {
        renderProjectList();
        renderTodayBoard();
        renderWeekBoard();
        renderMonthBoard();
    }

    // 辅助：转义HTML
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ---------- 操作函数 ----------
    function addProject(name) {
        if (!name.trim()) return;
        const p = {
            id: generateId(),
            name: name.trim(),
            createdAt: new Date().toISOString()
        };
        data.projects.push(p);
        saveData();
        renderAllViews();
        document.getElementById('newProjectInput').value = '';
    }

    function addTask(projectId, title, dueDate, note) {
        if (!title.trim()) return;
        const task = {
            id: generateId(),
            projectId: projectId,
            title: title.trim(),
            dueDate: dueDate || '',
            note: note || '',
            completed: false,
            createdAt: new Date().toISOString()
        };
        data.tasks.push(task);
        saveData();
        renderAllViews();
    }

    function toggleTask(taskId) {
        const task = data.tasks.find(t => t.id === taskId);
        if (task) {
            task.completed = !task.completed;
            saveData();
            renderAllViews();
        }
    }

    function deleteTask(taskId) {
        if (confirm('确定删除该任务吗？')) {
            data.tasks = data.tasks.filter(t => t.id !== taskId);
            saveData();
            renderAllViews();
        }
    }

    // ---------- 事件绑定 ----------
    document.getElementById('addProjectBtn').addEventListener('click', () => {
        const input = document.getElementById('newProjectInput');
        addProject(input.value);
    });
    document.getElementById('newProjectInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            document.getElementById('addProjectBtn').click();
        }
    });

    // 视图切换 (顶部标签和侧边栏)
    function switchView(view) {
        // 隐藏所有视图容器
        document.querySelectorAll('.view-container').forEach(el => el.classList.add('hidden'));
        document.getElementById('viewToday').classList.toggle('hidden', view !== 'today');
        document.getElementById('viewWeek').classList.toggle('hidden', view !== 'week');
        document.getElementById('viewMonth').classList.toggle('hidden', view !== 'month');
        // 更新标题
        const titles = { today: '📌 今日任务', week: '📅 本周任务', month: '📆 本月任务' };
        document.getElementById('viewTitle').textContent = titles[view] || '今日任务';
        // 更新高亮
        document.querySelectorAll('.nav-item').forEach(el => {
            el.classList.toggle('active', el.dataset.view === view);
        });
        document.querySelectorAll('.view-tabs button').forEach(el => {
            el.classList.toggle('active', el.dataset.view === view);
        });
        // 清除项目筛选
        currentProjectFilter = null;
        document.querySelectorAll('.project-item').forEach(el => el.classList.remove('active'));
        renderAllViews();
    }

    document.querySelectorAll('.nav-item').forEach(el => {
        el.addEventListener('click', () => {
            switchView(el.dataset.view);
        });
    });
    document.querySelectorAll('.view-tabs button').forEach(el => {
        el.addEventListener('click', () => {
            switchView(el.dataset.view);
        });
    });

    // 添加任务（在今日视图中的快速添加表单，我们放在今日视图上面）
    // 在今日视图上方添加一个任务添加区域，但需要选择项目。我们在今日视图显示时添加一个表单。
    // 动态插入添加任务表单
    const todayView = document.getElementById('viewToday');
    const formContainer = document.createElement('div');
    formContainer.className = 'add-task-form';
    formContainer.innerHTML = `
        <select id="taskProjectSelect"><option value="">选择项目</option></select>
        <input type="text" id="taskTitleInput" placeholder="任务标题..." />
        <input type="date" id="taskDueInput" />
        <input type="text" id="taskNoteInput" placeholder="备注（可选）" />
        <button id="addTaskBtn">添加任务</button>
    `;
    todayView.insertBefore(formContainer, todayView.firstChild);

    // 更新项目下拉
    function updateProjectSelect() {
        const select = document.getElementById('taskProjectSelect');
        const currentVal = select.value;
        select.innerHTML = '<option value="">选择项目</option>';
        data.projects.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.textContent = p.name;
            select.appendChild(opt);
        });
        if (currentVal && data.projects.some(p => p.id === currentVal)) {
            select.value = currentVal;
        }
    }

    // 监听项目变化更新下拉
    document.getElementById('addTaskBtn').addEventListener('click', () => {
        const projectId = document.getElementById('taskProjectSelect').value;
        const title = document.getElementById('taskTitleInput').value;
        const due = document.getElementById('taskDueInput').value;
        const note = document.getElementById('taskNoteInput').value;
        if (!projectId) { alert('请选择项目'); return; }
        if (!title.trim()) { alert('请输入任务标题'); return; }
        addTask(projectId, title, due, note);
        document.getElementById('taskTitleInput').value = '';
        document.getElementById('taskDueInput').value = '';
        document.getElementById('taskNoteInput').value = '';
    });
    document.getElementById('taskTitleInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('addTaskBtn').click();
    });

    // 每次渲染后更新下拉
    const origRender = renderAllViews;
    renderAllViews = function() {
        origRender();
        updateProjectSelect();
    };

    // 默认加载
    renderAllViews();
    switchView('today');

    // 额外：点击项目时，我们已经在项目点击事件中设置了filter，但需要确保表单的项目下拉也同步
    // 可以添加一个全局变量，在点击项目时设置currentProjectFilter并刷新视图
    // 修改项目点击逻辑，集成到渲染中
    // 由于项目点击动态绑定，我们重新绑定
    function bindProjectClicks() {
        document.querySelectorAll('.project-item').forEach(el => {
            el.addEventListener('click', function(e) {
                const pid = this.dataset.projectId;
                currentProjectFilter = pid;
                // 切换到今日视图，并显示项目名
                switchView('today');
                document.getElementById('viewTitle').textContent = `📁 ${getProject(pid).name} 的任务`;
                // 高亮项目
                document.querySelectorAll('.project-item').forEach(p => p.classList.remove('active'));
                this.classList.add('active');
                // 更新下拉选择
                const select = document.getElementById('taskProjectSelect');
                if (select) select.value = pid;
                renderAllViews();
            });
        });
    }

    // 覆盖渲染以重新绑定
    const oldRender = renderAllViews;
    renderAllViews = function() {
        oldRender();
        updateProjectSelect();
        bindProjectClicks();
    };
    // 初始化
    renderAllViews();
    switchView('today');
</script>
</body>
</html>
