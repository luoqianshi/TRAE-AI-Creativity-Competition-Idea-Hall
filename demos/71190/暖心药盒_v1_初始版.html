<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暖心药盒 · 用药提醒助手（初始版）</title>
<style>
:root {
  --bg-primary: #FFF0F3;
  --bg-secondary: #FFE4EC;
  --bg-card: #FFFFFF;
  --pink-soft: #FFD6DD;
  --pink-medium: #FFB6C1;
  --pink-strong: #FF85A2;
  --pink-deep: #E91E63;
  --text-primary: #4A2C3A;
  --text-secondary: #8B6F7B;
  --text-soft: #B89DA8;
  --success: #66BB6A;
  --success-deep: #4CAF50;
  --warning: #FFA726;
  --shadow-soft: 0 4px 16px rgba(255, 182, 193, 0.25);
  --shadow-card: 0 8px 24px rgba(233, 30, 99, 0.08);
  --radius-lg: 24px;
  --radius-md: 16px;
  --radius-sm: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Hiragino Sans GB", sans-serif;
  background: linear-gradient(180deg, #FFF0F3 0%, #FFE4EC 100%);
  min-height: 100vh;
  color: var(--text-primary);
  font-size: 17px;
  line-height: 1.6;
  padding-bottom: 40px;
}

.app {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}

/* 头部 */
.header {
  background: linear-gradient(135deg, #FFB6C1 0%, #FF85A2 100%);
  color: white;
  padding: 32px 24px;
  border-radius: var(--radius-lg);
  margin-bottom: 20px;
  box-shadow: var(--shadow-soft);
  position: relative;
  overflow: hidden;
}

.header::before {
  content: '';
  position: absolute;
  top: -60px;
  right: -30px;
  width: 180px;
  height: 180px;
  background: rgba(255,255,255,0.18);
  border-radius: 50%;
}

.header::after {
  content: '';
  position: absolute;
  bottom: -40px;
  left: -20px;
  width: 120px;
  height: 120px;
  background: rgba(255,255,255,0.12);
  border-radius: 50%;
}

.header h1 {
  font-size: 30px;
  font-weight: 700;
  margin-bottom: 6px;
  position: relative;
  z-index: 1;
}

.header p {
  font-size: 15px;
  opacity: 0.95;
  position: relative;
  z-index: 1;
}

.header-date {
  margin-top: 12px;
  font-size: 14px;
  opacity: 0.9;
  position: relative;
  z-index: 1;
}

/* 进度条 */
.progress-card {
  background: white;
  border-radius: var(--radius-md);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-card);
}

.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.progress-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--text-primary);
}

.progress-text {
  font-size: 15px;
  color: var(--pink-deep);
  font-weight: 600;
}

.progress-bar {
  width: 100%;
  height: 12px;
  background: var(--pink-soft);
  border-radius: 6px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #FFB6C1, #FF85A2, #E91E63);
  border-radius: 6px;
  transition: width 0.5s ease;
}

/* 标签导航 */
.tabs {
  display: flex;
  gap: 6px;
  background: white;
  padding: 6px;
  border-radius: var(--radius-md);
  margin-bottom: 20px;
  box-shadow: var(--shadow-card);
  position: sticky;
  top: 10px;
  z-index: 50;
}

.tab-btn {
  flex: 1;
  padding: 14px 8px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-size: 16px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.3s ease;
  font-family: inherit;
}

.tab-btn.active {
  background: linear-gradient(135deg, #FFB6C1, #FF85A2);
  color: white;
  box-shadow: 0 4px 12px rgba(255, 133, 162, 0.4);
}

/* 页面 */
.page { display: none; }
.page.active {
  display: block;
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.card {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: 24px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-card);
}

.card h2 {
  font-size: 20px;
  margin-bottom: 16px;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* 提醒横幅 */
.reminder-banner {
  background: linear-gradient(135deg, #FF85A2, #E91E63);
  color: white;
  padding: 18px 20px;
  border-radius: var(--radius-md);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 4px 12px rgba(233, 30, 99, 0.3); }
  50% { box-shadow: 0 4px 28px rgba(233, 30, 99, 0.6); }
}

.reminder-icon {
  font-size: 36px;
  animation: shake 1s ease-in-out infinite;
}

@keyframes shake {
  0%, 100% { transform: rotate(-10deg); }
  50% { transform: rotate(10deg); }
}

/* 服药列表项 */
.schedule-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px;
  background: linear-gradient(135deg, #FFF5F7, #FFE4EC);
  border-radius: var(--radius-md);
  margin-bottom: 12px;
  transition: transform 0.2s;
  border-left: 4px solid var(--pink-medium);
}

.schedule-item.overdue {
  border-left-color: #E53935;
  background: linear-gradient(135deg, #FFF5F7, #FFCCD2);
}

.schedule-item.taken {
  border-left-color: var(--success);
  background: linear-gradient(135deg, #F1F8E9, #DCEDC8);
  opacity: 0.85;
}

.med-photo {
  width: 64px;
  height: 64px;
  border-radius: var(--radius-sm);
  background: var(--pink-soft);
  object-fit: cover;
  flex-shrink: 0;
  border: 2px solid white;
  box-shadow: var(--shadow-soft);
}

.med-photo-placeholder {
  width: 64px;
  height: 64px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, #FFD6DD, #FFB6C1);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 28px;
  flex-shrink: 0;
  border: 2px solid white;
  box-shadow: var(--shadow-soft);
}

.schedule-info { flex: 1; min-width: 0; }

.schedule-time {
  font-size: 22px;
  font-weight: 700;
  color: var(--pink-deep);
  margin-bottom: 2px;
}

.schedule-name {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
}

.schedule-dose {
  font-size: 14px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.schedule-warn {
  color: #E53935;
  font-size: 13px;
  margin-top: 4px;
  font-weight: 600;
}

.take-btn {
  padding: 12px 22px;
  background: linear-gradient(135deg, #66BB6A, #4CAF50);
  color: white;
  border: none;
  border-radius: 24px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  white-space: nowrap;
}

.take-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
}

.take-btn.taken {
  background: linear-gradient(135deg, #B89DA8, #8B6F7B);
  cursor: default;
}

.take-btn.taken:hover { transform: none; box-shadow: none; }

/* 表单 */
.form-group { margin-bottom: 20px; }

.form-label {
  display: block;
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.form-input, .form-textarea, .form-select {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid var(--pink-soft);
  border-radius: var(--radius-sm);
  font-size: 16px;
  font-family: inherit;
  background: #FFFBFC;
  color: var(--text-primary);
  transition: border-color 0.2s;
}

.form-input:focus, .form-textarea:focus, .form-select:focus {
  outline: none;
  border-color: var(--pink-strong);
  background: white;
}

.form-textarea {
  min-height: 100px;
  resize: vertical;
}

/* 照片上传 */
.photo-upload {
  width: 100%;
  height: 200px;
  border: 2px dashed var(--pink-medium);
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #FFFBFC;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--text-secondary);
  overflow: hidden;
  position: relative;
}

.photo-upload:hover {
  background: #FFF0F3;
  border-color: var(--pink-strong);
}

.photo-upload img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  top: 0;
  left: 0;
}

/* 按钮 */
.btn {
  padding: 14px 24px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.btn-primary {
  background: linear-gradient(135deg, #FFB6C1, #FF85A2);
  color: white;
  box-shadow: 0 4px 12px rgba(255, 133, 162, 0.4);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(255, 133, 162, 0.5);
}

.btn-secondary {
  background: var(--pink-soft);
  color: var(--pink-deep);
}

.btn-full { width: 100%; }

/* 统计卡片 */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
}

.stat-card {
  background: linear-gradient(135deg, #FFF5F7, #FFE4EC);
  padding: 20px 16px;
  border-radius: var(--radius-md);
  text-align: center;
  border: 1px solid var(--pink-soft);
}

.stat-value {
  font-size: 32px;
  font-weight: 700;
  color: var(--pink-deep);
  margin-bottom: 4px;
  line-height: 1.1;
}

.stat-label {
  font-size: 14px;
  color: var(--text-secondary);
}

/* 日历 */
.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.calendar-weekday {
  text-align: center;
  padding: 6px;
  font-weight: 600;
  color: var(--pink-deep);
  font-size: 14px;
}

.calendar-day {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  font-size: 15px;
  background: #FFFBFC;
  color: var(--text-secondary);
  font-weight: 500;
}

.calendar-day.taken {
  background: linear-gradient(135deg, #66BB6A, #4CAF50);
  color: white;
}

.calendar-day.partial {
  background: linear-gradient(135deg, #FFD6DD, #FFB6C1);
  color: var(--pink-deep);
  font-weight: 600;
}

.calendar-day.today {
  border: 2px solid var(--pink-strong);
  font-weight: 700;
}

.calendar-legend {
  display: flex;
  gap: 16px;
  margin-top: 16px;
  font-size: 14px;
  color: var(--text-secondary);
  flex-wrap: wrap;
}

.legend-dot {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 4px;
  margin-right: 4px;
  vertical-align: middle;
}

/* 药品列表 */
.med-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px;
  background: #FFFBFC;
  border-radius: var(--radius-md);
  margin-bottom: 12px;
  border: 1px solid var(--pink-soft);
  transition: all 0.2s;
}

.med-item:hover {
  border-color: var(--pink-medium);
  box-shadow: var(--shadow-soft);
}

.med-info { flex: 1; min-width: 0; }

.med-name {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.med-detail {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.5;
}

.med-notes {
  margin-top: 6px;
  padding: 8px 12px;
  background: var(--bg-primary);
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-primary);
  border-left: 3px solid var(--pink-medium);
}

.med-actions {
  display: flex;
  gap: 8px;
}

.icon-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: var(--pink-soft);
  color: var(--pink-deep);
  font-size: 18px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.icon-btn:hover {
  background: var(--pink-medium);
  transform: scale(1.1);
}

.icon-btn.danger {
  background: #FFEBEE;
  color: #E53935;
}

.icon-btn.danger:hover {
  background: #FFCDD2;
}

/* 空状态 */
.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-secondary);
}

.empty-icon {
  font-size: 64px;
  margin-bottom: 16px;
  opacity: 0.7;
}

.empty-text {
  font-size: 16px;
  line-height: 1.8;
}

/* Toast 提示 */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: linear-gradient(135deg, #FF85A2, #E91E63);
  color: white;
  padding: 14px 28px;
  border-radius: 24px;
  font-size: 16px;
  font-weight: 500;
  box-shadow: 0 8px 24px rgba(233, 30, 99, 0.4);
  opacity: 0;
  transition: all 0.3s ease;
  z-index: 1000;
  max-width: 90%;
  text-align: center;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

.toast.success {
  background: linear-gradient(135deg, #66BB6A, #4CAF50);
}

/* 模态框 */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(74, 44, 58, 0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
  backdrop-filter: blur(4px);
}

.modal-overlay.show { display: flex; }

.modal {
  background: white;
  border-radius: var(--radius-lg);
  padding: 28px;
  max-width: 400px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  animation: modalIn 0.3s ease;
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

.modal h3 {
  font-size: 20px;
  margin-bottom: 12px;
  color: var(--text-primary);
}

.modal p {
  margin: 12px 0 20px;
  color: var(--text-secondary);
  font-size: 16px;
}

.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

/* 响应式 */
@media (max-width: 600px) {
  .header h1 { font-size: 24px; }
  .schedule-item { flex-wrap: wrap; }
  .take-btn { width: 100%; }
  .tab-btn { font-size: 15px; padding: 12px 4px; }
  .stat-value { font-size: 28px; }
  .app { padding: 12px; }
  .card { padding: 18px; }
}

/* 通知设置 */
.notif-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: #FFFBFC;
  border-radius: var(--radius-sm);
  border: 1px solid var(--pink-soft);
  margin-bottom: 12px;
}

.toggle-switch {
  position: relative;
  width: 52px;
  height: 28px;
  background: var(--pink-soft);
  border-radius: 14px;
  cursor: pointer;
  transition: background 0.3s;
}

.toggle-switch.on {
  background: var(--pink-strong);
}

.toggle-switch::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 22px;
  height: 22px;
  background: white;
  border-radius: 50%;
  transition: transform 0.3s;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

.toggle-switch.on::after {
  transform: translateX(24px);
}
</style>
</head>
<body>
<div class="app">
  <!-- 头部 -->
  <div class="header">
    <h1>💊 暖心药盒</h1>
    <p>按时服药 · 守护健康 · 温暖相伴</p>
    <div class="header-date" id="today-date"></div>
  </div>

  <!-- 今日进度 -->
  <div class="progress-card">
    <div class="progress-header">
      <span class="progress-title">📋 今日服药进度</span>
      <span class="progress-text" id="progress-text">0 / 0</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <!-- 标签导航 -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="today">今日</button>
    <button class="tab-btn" data-tab="medications">药品</button>
    <button class="tab-btn" data-tab="records">记录</button>
    <button class="tab-btn" data-tab="add">添加</button>
    <button class="tab-btn" data-tab="settings">设置</button>
  </div>

  <!-- 今日页面 -->
  <div class="page active" id="page-today">
    <div id="reminder-banner"></div>
    <div class="card">
      <h2>⏰ 今日用药计划</h2>
      <div id="today-list"></div>
    </div>
  </div>

  <!-- 药品页面 -->
  <div class="page" id="page-medications">
    <div class="card">
      <h2>💊 药品列表</h2>
      <div id="med-list"></div>
    </div>
  </div>

  <!-- 记录页面 -->
  <div class="page" id="page-records">
    <div class="card">
      <h2>📊 用药统计</h2>
      <div class="stats-grid" id="stats-grid"></div>
    </div>
    <div class="card">
      <div class="calendar-header">
        <h2 style="margin:0;">📅 本月打卡</h2>
        <span id="calendar-month" style="color:var(--pink-deep);font-weight:600;"></span>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>
      <div class="calendar-legend">
        <span><span class="legend-dot" style="background:linear-gradient(135deg,#66BB6A,#4CAF50);"></span>全部完成</span>
        <span><span class="legend-dot" style="background:linear-gradient(135deg,#FFD6DD,#FFB6C1);"></span>部分完成</span>
        <span><span class="legend-dot" style="background:#FFFBFC;border:1px solid var(--pink-soft);"></span>未服药</span>
      </div>
    </div>
    <div class="card">
      <h2>📝 最近记录</h2>
      <div id="recent-records"></div>
    </div>
  </div>

  <!-- 添加药品页面 -->
  <div class="page" id="page-add">
    <div class="card">
      <h2 id="form-title">➕ 添加药品</h2>
      <input type="hidden" id="med-id">
      <div class="form-group">
        <label class="form-label">药品照片</label>
        <div class="photo-upload" id="photo-upload">
          <div style="font-size:48px;">📷</div>
          <div style="margin-top:8px;">点击上传药品照片</div>
        </div>
        <input type="file" id="photo-input" accept="image/*" style="display:none;">
      </div>
      <div class="form-group">
        <label class="form-label">药品名称 *</label>
        <input type="text" class="form-input" id="med-name" placeholder="如：降压药">
      </div>
      <div class="form-group">
        <label class="form-label">服用剂量 *</label>
        <input type="text" class="form-input" id="med-dose" placeholder="如：1片 / 5ml">
      </div>
      <div class="form-group">
        <label class="form-label">首次服药时间 *</label>
        <input type="time" class="form-input" id="med-time">
      </div>
      <div class="form-group">
        <label class="form-label">每日服药次数</label>
        <select class="form-select" id="med-frequency">
          <option value="1">每日 1 次</option>
          <option value="2">每日 2 次</option>
          <option value="3">每日 3 次</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">服用说明（可自主编辑）</label>
        <textarea class="form-textarea" id="med-notes" placeholder="如：饭后半小时温水送服，避免与牛奶同服"></textarea>
      </div>
      <button class="btn btn-primary btn-full" id="save-btn">💾 保存药品</button>
      <button class="btn btn-secondary btn-full" id="cancel-btn" style="display:none;margin-top:8px;">取消编辑</button>
    </div>
  </div>

  <!-- 设置页面 -->
  <div class="page" id="page-settings">
    <div class="card">
      <h2>⚙️ 提醒设置</h2>
      <div class="notif-toggle">
        <div>
          <div style="font-weight:600;font-size:16px;">🔔 浏览器通知</div>
          <div style="font-size:13px;color:var(--text-secondary);margin-top:2px;">到时间弹窗提醒服药</div>
        </div>
        <div class="toggle-switch" id="notif-toggle"></div>
      </div>
      <div class="notif-toggle">
        <div>
          <div style="font-weight:600;font-size:16px;">🔊 声音提醒</div>
          <div style="font-size:13px;color:var(--text-secondary);margin-top:2px;">到时间发出提示音</div>
        </div>
        <div class="toggle-switch on" id="sound-toggle"></div>
      </div>
      <div class="notif-toggle">
        <div>
          <div style="font-weight:600;font-size:16px;">⏱️ 提前提醒</div>
          <div style="font-size:13px;color:var(--text-secondary);margin-top:2px;">提前几分钟提醒</div>
        </div>
        <select id="advance-time" style="padding:8px;border:1px solid var(--pink-soft);border-radius:8px;font-size:14px;">
          <option value="0">准点提醒</option>
          <option value="5" selected>提前 5 分钟</option>
          <option value="10">提前 10 分钟</option>
          <option value="15">提前 15 分钟</option>
        </select>
      </div>
    </div>
    <div class="card">
      <h2>📋 数据管理</h2>
      <button class="btn btn-secondary btn-full" id="export-btn" style="margin-bottom:10px;">📤 导出我的数据</button>
      <button class="btn btn-secondary btn-full" id="clear-btn" style="background:#FFEBEE;color:#E53935;">🗑 清空所有数据</button>
    </div>
    <div class="card">
      <h2>ℹ️ 关于</h2>
      <p style="color:var(--text-secondary);line-height:1.8;">
        <strong style="color:var(--pink-deep);">暖心药盒</strong> 是一款专为老人及特殊人群设计的用药提醒软件。<br><br>
        ✓ 药品照片上传，方便识别<br>
        ✓ 自主编辑服用说明<br>
        ✓ 按时服药提醒<br>
        ✓ 记录服药天数与次数<br><br>
        所有数据保存在本地，保护您的隐私。
      </p>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 模态框 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modal-title">提醒</h3>
    <p id="modal-body"></p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="modal-cancel">取消</button>
      <button class="btn btn-primary" id="modal-ok">确定</button>
    </div>
  </div>
</div>

<script>
// === 数据管理 ===
const STORE_KEY = 'warm-pillbox-data';

function loadData() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY));
    return d || { meds: [], records: {}, settings: { notif: false, sound: true, advance: 5 } };
  } catch {
    return { meds: [], records: {}, settings: { notif: false, sound: true, advance: 5 } };
  }
}

function saveData() {
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}

let data = loadData();
let editingId = null;
let currentPhoto = null;
let notifiedKeys = new Set();

// === 工具函数 ===
function $(id) { return document.getElementById(id); }

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDate() {
  const d = new Date();
  const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · ${weekdays[d.getDay()]}`;
}

// === 标签导航 ===
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    $('page-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'today') { renderToday(); updateProgress(); }
    if (btn.dataset.tab === 'medications') renderMedList();
    if (btn.dataset.tab === 'records') renderRecords();
    if (btn.dataset.tab === 'settings') renderSettings();
    if (btn.dataset.tab === 'add' && !editingId) resetForm();
  });
});

// === Toast 提示 ===
function toast(msg, type) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// === 模态框 ===
function showModal(title, body, onOk, okText) {
  $('modal-title').textContent = title;
  $('modal-body').textContent = body;
  $('modal-ok').textContent = okText || '确定';
  $('modal').classList.add('show');
  const close = () => $('modal').classList.remove('show');
  $('modal-ok').onclick = () => { close(); onOk && onOk(); };
  $('modal-cancel').onclick = close;
}

// === 今日进度 ===
function updateProgress() {
  const today = todayStr();
  const todayRecords = data.records[today] || {};
  const total = data.meds.reduce((sum, m) => sum + (parseInt(m.frequency) || 1), 0);
  const taken = Object.keys(todayRecords).length;
  const pct = total > 0 ? Math.round((taken / total) * 100) : 0;
  $('progress-text').textContent = `${taken} / ${total}`;
  $('progress-fill').style.width = pct + '%';
}

// === 今日用药计划 ===
function renderToday() {
  const list = $('today-list');
  const today = todayStr();
  const todayRecords = data.records[today] || {};
  
  if (data.meds.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">💊</div><div class="empty-text">还没有添加药品<br>请点击「添加」开始记录</div></div>';
    return;
  }
  
  const schedules = [];
  data.meds.forEach(med => {
    const freq = parseInt(med.frequency) || 1;
    for (let i = 0; i < freq; i++) {
      const time = med.times[i] || med.time;
      schedules.push({ med, time, idx: i });
    }
  });
  
  schedules.sort((a, b) => a.time.localeCompare(b.time));
  
  const now = new Date();
  list.innerHTML = schedules.map(s => {
    const recordKey = `${s.med.id}-${s.idx}`;
    const taken = todayRecords[recordKey];
    const [h, m] = s.time.split(':').map(Number);
    const scheduleTime = new Date();
    scheduleTime.setHours(h, m, 0, 0);
    const isOverdue = !taken && now > scheduleTime;
    
    return `
      <div class="schedule-item ${taken ? 'taken' : ''} ${isOverdue ? 'overdue' : ''}">
        ${s.med.photo 
          ? `<img class="med-photo" src="${s.med.photo}" alt="">` 
          : `<div class="med-photo-placeholder">💊</div>`}
        <div class="schedule-info">
          <div class="schedule-time">${s.time}</div>
          <div class="schedule-name">${s.med.name}</div>
          <div class="schedule-dose">${s.med.dose}${s.med.notes ? ' · ' + s.med.notes : ''}</div>
          ${taken ? `<div class="schedule-dose" style="color:var(--success-deep);font-weight:600;">✓ 已于 ${taken.slice(11,16)} 服用</div>` : ''}
          ${isOverdue ? '<div class="schedule-warn">⚠ 已过服药时间</div>' : ''}
        </div>
        <button class="take-btn ${taken ? 'taken' : ''}" 
          onclick="takeMedicine('${s.med.id}', ${s.idx})" 
          ${taken ? 'disabled' : ''}>
          ${taken ? '✓ 已服' : '服药'}
        </button>
      </div>
    `;
  }).join('');
  
  checkReminders();
}

function takeMedicine(medId, idx) {
  const today = todayStr();
  if (!data.records[today]) data.records[today] = {};
  data.records[today][`${medId}-${idx}`] = new Date().toISOString();
  saveData();
  toast('✓ 已记录服药', 'success');
  renderToday();
  updateProgress();
}

// === 药品列表 ===
function renderMedList() {
  const list = $('med-list');
  if (data.meds.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">暂无药品<br>请点击「添加」按钮</div></div>';
    return;
  }
  
  list.innerHTML = data.meds.map(med => `
    <div class="med-item">
      ${med.photo 
        ? `<img class="med-photo" src="${med.photo}" alt="">` 
        : `<div class="med-photo-placeholder">💊</div>`}
      <div class="med-info">
        <div class="med-name">${med.name}</div>
        <div class="med-detail">剂量：${med.dose} · 每日 ${med.frequency} 次</div>
        <div class="med-detail">服药时间：${(med.times||[med.time]).join('、')}</div>
        ${med.notes ? `<div class="med-notes">📝 ${med.notes}</div>` : ''}
      </div>
      <div class="med-actions">
        <button class="icon-btn" onclick="editMed('${med.id}')" title="编辑">✏️</button>
        <button class="icon-btn danger" onclick="deleteMed('${med.id}')" title="删除">🗑</button>
      </div>
    </div>
  `).join('');
}

function editMed(id) {
  const med = data.meds.find(m => m.id === id);
  if (!med) return;
  editingId = id;
  $('form-title').textContent = '✏️ 编辑药品';
  $('med-id').value = id;
  $('med-name').value = med.name;
  $('med-dose').value = med.dose;
  $('med-time').value = med.time;
  $('med-frequency').value = med.frequency;
  $('med-notes').value = med.notes || '';
  currentPhoto = med.photo;
  
  const upload = $('photo-upload');
  if (med.photo) {
    upload.innerHTML = `<img src="${med.photo}" alt="">`;
  } else {
    upload.innerHTML = '<div style="font-size:48px;">📷</div><div style="margin-top:8px;">点击上传药品照片</div>';
  }
  
  $('cancel-btn').style.display = 'block';
  document.querySelector('[data-tab="add"]').click();
}

function deleteMed(id) {
  showModal('删除药品', '确定要删除这个药品吗？相关服药记录将保留。', () => {
    data.meds = data.meds.filter(m => m.id !== id);
    saveData();
    toast('已删除药品');
    renderMedList();
    updateProgress();
  }, '删除');
}

// === 添加/编辑表单 ===
const photoUpload = $('photo-upload');
const photoInput = $('photo-input');

photoUpload.addEventListener('click', () => photoInput.click());

photoInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    toast('图片不能超过 5MB');
    return;
  }
  const reader = new FileReader();
  reader.onload = (ev) => {
    currentPhoto = ev.target.result;
    photoUpload.innerHTML = `<img src="${currentPhoto}" alt="">`;
  };
  reader.readAsDataURL(file);
});

$('save-btn').addEventListener('click', () => {
  const name = $('med-name').value.trim();
  const dose = $('med-dose').value.trim();
  const time = $('med-time').value;
  const frequency = parseInt($('med-frequency').value);
  const notes = $('med-notes').value.trim();
  
  if (!name) { toast('请输入药品名称'); return; }
  if (!dose) { toast('请输入服用剂量'); return; }
  if (!time) { toast('请选择服药时间'); return; }
  
  // 根据次数自动生成时间
  const times = [time];
  const [h, m] = time.split(':').map(Number);
  const interval = Math.floor(12 / frequency);
  for (let i = 1; i < frequency; i++) {
    const newH = (h + interval * i) % 24;
    times.push(`${String(newH).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
  }
  
  if (editingId) {
    const med = data.meds.find(m => m.id === editingId);
    Object.assign(med, { name, dose, time, frequency, notes, times, photo: currentPhoto });
    editingId = null;
    $('form-title').textContent = '➕ 添加药品';
    $('cancel-btn').style.display = 'none';
    toast('✓ 已更新药品', 'success');
  } else {
    data.meds.push({
      id: 'med-' + Date.now(),
      name, dose, time, frequency, notes, times,
      photo: currentPhoto,
      createdAt: new Date().toISOString()
    });
    toast('✓ 已添加药品', 'success');
  }
  
  saveData();
  resetForm();
  updateProgress();
  document.querySelector('[data-tab="today"]').click();
});

$('cancel-btn').addEventListener('click', () => {
  editingId = null;
  $('form-title').textContent = '➕ 添加药品';
  $('cancel-btn').style.display = 'none';
  resetForm();
  document.querySelector('[data-tab="today"]').click();
});

function resetForm() {
  $('med-id').value = '';
  $('med-name').value = '';
  $('med-dose').value = '';
  $('med-time').value = '';
  $('med-frequency').value = '1';
  $('med-notes').value = '';
  currentPhoto = null;
  photoUpload.innerHTML = '<div style="font-size:48px;">📷</div><div style="margin-top:8px;">点击上传药品照片</div>';
  photoInput.value = '';
}

// === 记录页面 ===
function renderRecords() {
  const stats = calculateStats();
  $('stats-grid').innerHTML = `
    <div class="stat-card">
      <div class="stat-value">${stats.totalMeds}</div>
      <div class="stat-label">药品总数</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${stats.consecutiveDays}</div>
      <div class="stat-label">连续服药天数</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${stats.totalDays}</div>
      <div class="stat-label">累计服药天数</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${stats.totalTaken}</div>
      <div class="stat-label">累计服药次数</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${stats.todayTaken}<span style="font-size:18px;">/${stats.todayTotal}</span></div>
      <div class="stat-label">今日已服</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${stats.adherenceRate}%</div>
      <div class="stat-label">近7日按时率</div>
    </div>
  `;
  
  renderCalendar();
  renderRecentRecords();
}

function calculateStats() {
  const today = todayStr();
  const todayRecords = data.records[today] || {};
  const todayTotal = data.meds.reduce((sum, m) => sum + (parseInt(m.frequency) || 1), 0);
  
  // 连续服药天数
  let consecutiveDays = 0;
  const date = new Date();
  if (Object.keys(todayRecords).length === 0) {
    date.setDate(date.getDate() - 1);
  }
  while (true) {
    const ds = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    const recs = data.records[ds] || {};
    if (Object.keys(recs).length > 0) {
      consecutiveDays++;
      date.setDate(date.getDate() - 1);
    } else {
      break;
    }
  }
  
  // 累计服药天数
  let totalDays = 0;
  let totalTaken = 0;
  Object.values(data.records).forEach(r => {
    const cnt = Object.keys(r).length;
    if (cnt > 0) {
      totalDays++;
      totalTaken += cnt;
    }
  });
  
  // 近7日按时率
  let scheduled = 0, taken = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    scheduled += todayTotal;
    taken += Object.keys(data.records[ds] || {}).length;
  }
  const adherenceRate = scheduled > 0 ? Math.round((taken / scheduled) * 100) : 0;
  
  return {
    totalMeds: data.meds.length,
    consecutiveDays,
    totalDays,
    totalTaken,
    todayTaken: Object.keys(todayRecords).length,
    todayTotal,
    adherenceRate
  };
}

function renderCalendar() {
  const calendar = $('calendar-grid');
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = now.getDate();
  
  $('calendar-month').textContent = `${year}年${month + 1}月`;
  
  let html = '';
  ['日','一','二','三','四','五','六'].forEach(d => {
    html += `<div class="calendar-weekday">${d}</div>`;
  });
  
  const firstDay = new Date(year, month, 1).getDay();
  for (let i = 0; i < firstDay; i++) html += '<div></div>';
  
  const todayTotal = data.meds.reduce((sum, m) => sum + (parseInt(m.frequency) || 1), 0);
  
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const records = data.records[dateStr] || {};
    const takenCount = Object.keys(records).length;
    let cls = 'calendar-day';
    if (d === today) cls += ' today';
    if (takenCount > 0 && todayTotal > 0 && takenCount >= todayTotal) cls += ' taken';
    else if (takenCount > 0) cls += ' partial';
    html += `<div class="${cls}">${d}</div>`;
  }
  
  calendar.innerHTML = html;
}

function renderRecentRecords() {
  const list = $('recent-records');
  const dates = Object.keys(data.records).sort().reverse().slice(0, 7);
  
  if (dates.length === 0) {
    list.innerHTML = '<div class="empty-state" style="padding:24px;"><div class="empty-icon" style="font-size:48px;">📝</div><div class="empty-text">还没有服药记录</div></div>';
    return;
  }
  
  list.innerHTML = dates.map(ds => {
    const recs = data.records[ds];
    const takenCount = Object.keys(recs).length;
    const totalToday = data.meds.reduce((sum, m) => sum + (parseInt(m.frequency) || 1), 0);
    const d = new Date(ds);
    const dsText = `${d.getMonth()+1}月${d.getDate()}日`;
    const status = takenCount >= totalToday ? '✓ 全部完成' : `部分完成 ${takenCount}/${totalToday}`;
    const statusColor = takenCount >= totalToday ? 'var(--success-deep)' : 'var(--pink-deep)';
    return `
      <div class="med-item" style="background:#FFFBFC;">
        <div class="med-photo-placeholder" style="background:linear-gradient(135deg,#FFD6DD,#FFB6C1);width:48px;height:48px;font-size:22px;">📅</div>
        <div class="med-info">
          <div class="med-name" style="font-size:16px;">${dsText}</div>
          <div class="med-detail">服药 ${takenCount} 次 · ${status}</div>
        </div>
        <div style="color:${statusColor};font-weight:600;font-size:14px;">${status}</div>
      </div>
    `;
  }).join('');
}

// === 提醒检查 ===
function checkReminders() {
  const now = new Date();
  const today = todayStr();
  const todayRecords = data.records[today] || {};
  const banner = $('reminder-banner');
  
  let dueMeds = [];
  let notifyMeds = [];
  
  data.meds.forEach(med => {
    const freq = parseInt(med.frequency) || 1;
    for (let i = 0; i < freq; i++) {
      const time = med.times[i] || med.time;
      const [h, m] = time.split(':').map(Number);
      const scheduleTime = new Date();
      scheduleTime.setHours(h, m, 0, 0);
      const diff = (scheduleTime - now) / 60000;
      const recordKey = `${med.id}-${i}`;
      const advance = data.settings.advance || 0;
      
      // 显示横幅：到达提醒时间且未服药
      if (!todayRecords[recordKey] && diff <= 0 && diff >= -30) {
        dueMeds.push(med.name);
      }
      
      // 触发通知：到达提前提醒时间点
      const notifyKey = `${today}-${recordKey}`;
      if (!todayRecords[recordKey] && !notifiedKeys.has(notifyKey) 
          && diff <= advance && diff > advance - 1) {
        notifyMeds.push({ med, time, idx: i, key: notifyKey });
      }
    }
  });
  
  if (dueMeds.length > 0) {
    banner.innerHTML = `<div class="reminder-banner"><div class="reminder-icon">⏰</div><div><strong style="font-size:18px;">该吃药啦！</strong><br>${dueMeds.join('、')}</div></div>`;
  } else {
    banner.innerHTML = '';
  }
  
  // 触发浏览器通知
  notifyMeds.forEach(n => {
    notifiedKeys.add(n.key);
    if (data.settings.notif && 'Notification' in window && Notification.permission === 'granted') {
      new Notification('💊 暖心药盒提醒', {
        body: `该服用 ${n.med.name} 了（${n.med.dose}）`,
        icon: n.med.photo || ''
      });
    }
    if (data.settings.sound) {
      playBeep();
    }
  });
}

// 提示音
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
  } catch(e) {}
}

// === 设置 ===
function renderSettings() {
  $('notif-toggle').classList.toggle('on', data.settings.notif);
  $('sound-toggle').classList.toggle('on', data.settings.sound);
  $('advance-time').value = data.settings.advance || 0;
}

$('notif-toggle').addEventListener('click', () => {
  if (!data.settings.notif) {
    if ('Notification' in window) {
      Notification.requestPermission().then(p => {
        if (p === 'granted') {
          data.settings.notif = true;
          saveData();
          $('notif-toggle').classList.add('on');
          toast('已开启通知提醒', 'success');
        } else {
          toast('请在浏览器设置中允许通知');
        }
      });
    } else {
      toast('您的浏览器不支持通知');
    }
  } else {
    data.settings.notif = false;
    saveData();
    $('notif-toggle').classList.remove('on');
    toast('已关闭通知提醒');
  }
});

$('sound-toggle').addEventListener('click', () => {
  data.settings.sound = !data.settings.sound;
  saveData();
  $('sound-toggle').classList.toggle('on', data.settings.sound);
  if (data.settings.sound) playBeep();
});

$('advance-time').addEventListener('change', (e) => {
  data.settings.advance = parseInt(e.target.value);
  saveData();
  toast('已设置提前 ' + (data.settings.advance || 0) + ' 分钟提醒');
});

$('export-btn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `暖心药盒数据_${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('✓ 数据已导出', 'success');
});

$('clear-btn').addEventListener('click', () => {
  showModal('清空数据', '将删除所有药品和服药记录，此操作不可恢复！', () => {
    data = { meds: [], records: {}, settings: data.settings };
    saveData();
    toast('已清空所有数据');
    renderSettings();
    updateProgress();
    document.querySelector('[data-tab="today"]').click();
  }, '清空');
});

// === 初始化示例数据 ===
function initDemoData() {
  if (data.meds.length === 0 && Object.keys(data.records).length === 0) {
    data.meds = [
      {
        id: 'demo-1',
        name: '降压药',
        dose: '1片',
        time: '08:00',
        frequency: 2,
        times: ['08:00', '20:00'],
        notes: '饭后半小时服用，温水送服',
        photo: null,
        createdAt: new Date().toISOString()
      },
      {
        id: 'demo-2',
        name: '维生素D',
        dose: '1粒',
        time: '09:00',
        frequency: 1,
        times: ['09:00'],
        notes: '早餐后服用，促进钙吸收',
        photo: null,
        createdAt: new Date().toISOString()
      }
    ];
    saveData();
  }
}

// === 启动 ===
$('today-date').textContent = formatDate();
initDemoData();
renderToday();
updateProgress();

// 每分钟检查提醒
setInterval(() => {
  if (document.querySelector('.tab-btn.active').dataset.tab === 'today') {
    renderToday();
  } else {
    checkReminders();
  }
}, 60000);

// 每分钟更新进度
setInterval(updateProgress, 30000);
</script>
</body>
</html>
