<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>梦芽阅灵 - 教育戏剧AI阅读陪伴机器人</title>
<style>
/* ==========================================
   Global Reset & Variables
   ========================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#5B8DEF;
  --primary-light:#E8F0FE;
  --secondary:#FF8A65;
  --bg:#FFF8F0;
  --card:#FFFFFF;
  --text:#3D3D3D;
  --text-light:#8A8A8A;
  --elf-body:#FDD835;
  --elf-eye:#5B8DEF;
  --elf-cheek:#FFAB91;
  --bubble-bot:#FFF;
  --bubble-user:#E8F0FE;
  --success:#66BB6A;
  --shadow:0 4px 20px rgba(0,0,0,0.08);
  --shadow-lg:0 8px 40px rgba(0,0,0,0.12);
  --radius:20px;
  --radius-sm:12px;
  --transition:0.3s cubic-bezier(0.4,0,0.2,1);
}
html,body{height:100%;overflow:hidden}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:10px;
  background-image:radial-gradient(circle at 20% 30%,#FFF3E0 0%,transparent 50%),radial-gradient(circle at 80% 70%,#E8F0FE 0%,transparent 50%);
}

/* ==========================================
   Phone Frame
   ========================================== */
.phone{
  width:100%;
  max-width:420px;
  height:100%;
  max-height:850px;
  background:var(--card);
  border-radius:32px;
  box-shadow:var(--shadow-lg);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* ==========================================
   Header
   ========================================== */
.header{
  padding:16px 20px 12px;
  display:flex;
  align-items:center;
  gap:12px;
  background:linear-gradient(135deg,#FFF,#E8F0FE);
  border-bottom:1px solid #F0F0F0;
  flex-shrink:0;
}
.header-avatar{
  width:40px;height:40px;
  border-radius:50%;
  background:var(--elf-body);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  box-shadow:0 2px 8px rgba(253,216,53,0.4);
  flex-shrink:0;
}
.header-info{flex:1;min-width:0}
.header-name{font-size:15px;font-weight:700;color:var(--text)}
.header-status{font-size:12px;color:var(--success);display:flex;align-items:center;gap:4px}
.header-status::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--success)}
.header-book{
  font-size:12px;color:var(--text-light);
  background:#F5F5F5;padding:4px 10px;border-radius:20px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;
}

/* ==========================================
   Chat Area
   ========================================== */
.chat-area{
  flex:1;
  overflow-y:auto;
  padding:16px 16px 8px;
  display:flex;
  flex-direction:column;
  gap:14px;
  scroll-behavior:smooth;
  background:linear-gradient(180deg,#FAFAFA 0%,#FFF 30%);
}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-thumb{background:#E0E0E0;border-radius:4px}

/* ==========================================
   Messages
   ========================================== */
.msg{display:flex;gap:8px;max-width:88%;animation:msgIn 0.4s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.msg.bot{align-self:flex-start;flex-direction:row}
.msg.user{align-self:flex-end;flex-direction:row-reverse}

.msg-avatar{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.msg.bot .msg-avatar{
  background:var(--elf-body);
  box-shadow:0 2px 8px rgba(253,216,53,0.3);
}
.msg.user .msg-avatar{
  background:var(--primary-light);
  font-size:16px;
}

.msg-bubble{
  padding:12px 16px;
  border-radius:var(--radius-sm);
  font-size:14px;
  line-height:1.7;
  position:relative;
  word-break:break-word;
}
.msg.bot .msg-bubble{
  background:var(--bubble-bot);
  border:1px solid #F0F0F0;
  border-radius:var(--radius-sm) var(--radius-sm) var(--radius-sm) 4px;
}
.msg.user .msg-bubble{
  background:var(--bubble-user);
  border-radius:var(--radius-sm) var(--radius-sm) 4px var(--radius-sm);
  color:#3D3D3D;
}

.msg-typing .msg-bubble{
  padding:8px 16px;
  display:flex;gap:4px;
}
.typing-dot{
  width:8px;height:8px;border-radius:50%;
  background:#CCC;
  animation:typing 1.4s infinite;
}
.typing-dot:nth-child(2){animation-delay:0.2s}
.typing-dot:nth-child(3){animation-delay:0.4s}
@keyframes typing{0%,60%,100%{opacity:0.3;transform:scale(0.8)}30%{opacity:1;transform:scale(1)}}

/* ==========================================
   Emotion Tag
   ========================================== */
.emotion-tag{
  display:inline-block;
  font-size:11px;
  padding:2px 8px;
  border-radius:10px;
  margin-left:6px;
  vertical-align:middle;
  background:#FFF3E0;
  color:#FF8A65;
}

/* ==========================================
   Page Turn Overlay
   ========================================== */
.page-turn-overlay{
  position:absolute;inset:0;
  background:rgba(0,0,0,0.5);
  display:flex;align-items:center;justify-content:center;
  z-index:20;
  animation:fadeIn 0.3s ease;
}
.page-turn-card{
  background:var(--card);
  border-radius:var(--radius);
  padding:24px;
  text-align:center;
  max-width:300px;
  box-shadow:var(--shadow-lg);
  animation:popIn 0.4s ease;
}
@keyframes popIn{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.page-turn-emoji{font-size:48px;margin-bottom:8px}
.page-turn-title{font-size:18px;font-weight:700;margin-bottom:4px;color:var(--primary)}
.page-turn-hint{font-size:13px;color:var(--text-light);margin-bottom:16px}
.page-turn-btn{
  background:linear-gradient(135deg,var(--primary),#7BAAF7);
  color:#FFF;border:none;padding:12px 32px;
  border-radius:25px;font-size:16px;font-weight:600;
  cursor:pointer;transition:var(--transition);
  box-shadow:0 4px 15px rgba(91,141,239,0.3);
}
.page-turn-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(91,141,239,0.4)}
.page-turn-btn:active{transform:scale(0.95)}

/* ==========================================
   End Screen
   ========================================== */
.end-overlay{
  position:absolute;inset:0;
  background:rgba(0,0,0,0.6);
  display:flex;align-items:center;justify-content:center;
  z-index:20;
  animation:fadeIn 0.5s ease;
}
.end-card{
  background:var(--card);
  border-radius:var(--radius);
  padding:28px;
  text-align:center;
  max-width:320px;
  box-shadow:var(--shadow-lg);
  animation:popIn 0.5s ease;
}
.end-badge{font-size:56px;margin-bottom:8px}
.end-title{font-size:20px;font-weight:700;color:var(--primary);margin-bottom:4px}
.end-subtitle{font-size:13px;color:var(--text-light);margin-bottom:16px}
.end-stats{display:flex;gap:16px;justify-content:center;margin-bottom:16px}
.end-stat{text-align:center}
.end-stat-num{font-size:22px;font-weight:700;color:var(--secondary)}
.end-stat-label{font-size:11px;color:var(--text-light)}
.end-restart-btn{
  background:linear-gradient(135deg,var(--secondary),#FFAB91);
  color:#FFF;border:none;padding:12px 32px;
  border-radius:25px;font-size:16px;font-weight:600;
  cursor:pointer;transition:var(--transition);
  box-shadow:0 4px 15px rgba(255,138,101,0.3);
}
.end-restart-btn:hover{transform:translateY(-2px)}

/* ==========================================
   Welcome Screen
   ========================================== */
.welcome-overlay{
  position:absolute;inset:0;
  background:linear-gradient(180deg,#E8F0FE 0%,#FFF8F0 60%,#FFF 100%);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:30;
  padding:32px;
  text-align:center;
}
.welcome-elf{font-size:72px;margin-bottom:8px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.welcome-title{font-size:24px;font-weight:800;color:var(--primary);margin-bottom:4px}
.welcome-subtitle{font-size:14px;color:var(--text-light);margin-bottom:24px;line-height:1.6}
.welcome-features{display:flex;flex-direction:column;gap:8px;margin-bottom:24px;width:100%}
.welcome-feature{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;background:rgba(255,255,255,0.8);
  border-radius:var(--radius-sm);font-size:13px;color:var(--text);
}
.welcome-feature-icon{font-size:20px;flex-shrink:0}

.book-select{margin-bottom:24px;width:100%}
.book-select-label{font-size:13px;color:var(--text-light);margin-bottom:8px;text-align:left}
.book-options{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.book-option{
  width:80px;padding:12px 8px;
  border-radius:var(--radius-sm);
  border:2px solid #E0E0E0;
  background:#FFF;
  cursor:pointer;
  transition:var(--transition);
  text-align:center;
}
.book-option:hover{border-color:var(--primary);transform:translateY(-2px)}
.book-option.selected{border-color:var(--primary);background:var(--primary-light);box-shadow:0 2px 12px rgba(91,141,239,0.2)}
.book-option-emoji{font-size:28px;display:block;margin-bottom:4px}
.book-option-name{font-size:11px;color:var(--text);font-weight:600}

.age-select{margin-bottom:24px;width:100%}
.age-select-label{font-size:13px;color:var(--text-light);margin-bottom:8px;text-align:left}
.age-options{display:flex;gap:8px;justify-content:center}
.age-option{
  padding:8px 16px;
  border-radius:20px;
  border:2px solid #E0E0E0;
  background:#FFF;
  cursor:pointer;
  transition:var(--transition);
  font-size:13px;font-weight:600;
}
.age-option:hover{border-color:var(--primary)}
.age-option.selected{border-color:var(--primary);background:var(--primary);color:#FFF;box-shadow:0 2px 12px rgba(91,141,239,0.3)}

.start-btn{
  background:linear-gradient(135deg,var(--primary),#7BAAF7);
  color:#FFF;border:none;padding:14px 48px;
  border-radius:30px;font-size:18px;font-weight:700;
  cursor:pointer;transition:var(--transition);
  box-shadow:0 6px 25px rgba(91,141,239,0.35);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 6px 25px rgba(91,141,239,0.35)}50%{box-shadow:0 6px 35px rgba(91,141,239,0.55)}}
.start-btn:hover{transform:translateY(-3px)}
.start-btn:active{transform:scale(0.95)}
.start-btn:disabled{opacity:0.5;cursor:not-allowed;animation:none}

/* ==========================================
   Voice Button
   ========================================== */
.voice-bar{
  padding:10px 16px 16px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
  border-top:1px solid #F0F0F0;
  background:#FFF;
}
.voice-btn{
  width:56px;height:56px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg,var(--primary),#7BAAF7);
  color:#FFF;
  font-size:24px;
  cursor:pointer;
  transition:var(--transition);
  box-shadow:0 4px 15px rgba(91,141,239,0.3);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.voice-btn:hover{transform:scale(1.05)}
.voice-btn:active,.voice-btn.active{transform:scale(0.9);background:var(--secondary);box-shadow:0 2px 8px rgba(255,138,101,0.4)}
.voice-hint{font-size:12px;color:var(--text-light);flex:1}

/* ==========================================
   Page Counter
   ========================================== */
.page-counter{
  text-align:center;
  padding:4px 0 8px;
  font-size:11px;
  color:var(--text-light);
  flex-shrink:0;
}

/* ==========================================
   Hidden
   ========================================== */
.hidden{display:none !important}

/* ==========================================
   Responsive
   ========================================== */
@media(max-width:440px){
  .phone{border-radius:0;max-height:100vh}
  .msg{max-width:92%}
  .welcome-overlay{padding:20px}
}
</style>
</head>
<body>

<div class="phone" id="phone">

  <!-- Header -->
  <div class="header" id="header">
    <div class="header-avatar" id="elfFace">&#x1F9DD;</div>
    <div class="header-info">
      <div class="header-name">梦芽</div>
      <div class="header-status">在线陪伴中</div>
    </div>
    <div class="header-book" id="headerBook">等待选书...</div>
  </div>

  <!-- Chat Area -->
  <div class="chat-area" id="chatArea"></div>

  <!-- Page Counter -->
  <div class="page-counter hidden" id="pageCounter">第 1 / 7 页</div>

  <!-- Voice Bar -->
  <div class="voice-bar hidden" id="voiceBar">
    <span class="voice-hint" id="voiceHint">点击麦克风，说出你的想法</span>
    <button class="voice-btn" id="voiceBtn" title="语音输入">&#x1F3A4;</button>
  </div>

  <!-- Page Turn Overlay -->
  <div class="page-turn-overlay hidden" id="pageTurnOverlay">
    <div class="page-turn-card">
      <div class="page-turn-emoji" id="pageTurnEmoji">&#x1F4D6;</div>
      <div class="page-turn-title" id="pageTurnTitle">翻到下一页</div>
      <div class="page-turn-hint" id="pageTurnHint">梦芽已经准备好了~</div>
      <button class="page-turn-btn" id="pageTurnBtn">继续阅读 &#x27A1;</button>
    </div>
  </div>

  <!-- End Overlay -->
  <div class="end-overlay hidden" id="endOverlay">
    <div class="end-card">
      <div class="end-badge">&#x1F31F;</div>
      <div class="end-title">阅读完成！</div>
      <div class="end-subtitle" id="endBookName"></div>
      <div class="end-stats">
        <div class="end-stat">
          <div class="end-stat-num" id="endPages">7</div>
          <div class="end-stat-label">页数</div>
        </div>
        <div class="end-stat">
          <div class="end-stat-num" id="endInteractions">5</div>
          <div class="end-stat-label">互动次数</div>
        </div>
        <div class="end-stat">
          <div class="end-stat-num" id="endBadge">&#x1F3C5;</div>
          <div class="end-stat-label" id="endBadgeName">勇敢表达者</div>
        </div>
      </div>
      <button class="end-restart-btn" id="endRestartBtn">再读一本 &#x1F4DA;</button>
    </div>
  </div>

  <!-- Welcome Overlay -->
  <div class="welcome-overlay" id="welcomeOverlay">
    <div class="welcome-elf">&#x1F9DD;</div>
    <div class="welcome-title">梦芽阅灵</div>
    <div class="welcome-subtitle">教育戏剧AI阅读陪伴精灵<br>让每个孩子从"听故事"变成"活在故事里"</div>
    <div class="welcome-features">
      <div class="welcome-feature">
        <span class="welcome-feature-icon">&#x1F3AD;</span>
        <span>教育戏剧引导：角色扮演 + 情境互动 + 反思对话</span>
      </div>
      <div class="welcome-feature">
        <span class="welcome-feature-icon">&#x1F4D6;</span>
        <span>识别纸质绘本，翻到哪页互动到哪页</span>
      </div>
      <div class="welcome-feature">
        <span class="welcome-feature-icon">&#x1F9E0;</span>
        <span>培养六大能力：情绪认知 表达 思辨 共情 想象 责任</span>
      </div>
    </div>
    <div class="book-select">
      <div class="book-select-label">选择一本绘本：</div>
      <div class="book-options" id="bookOptions">
        <div class="book-option selected" data-book="nezha" data-age="4-8">
          <span class="book-option-emoji">&#x1F409;</span>
          <span class="book-option-name">哪吒闹海</span>
        </div>
        <div class="book-option" data-book="dayu" data-age="6-12">
          <span class="book-option-emoji">&#x1F4A7;</span>
          <span class="book-option-name">大禹治水</span>
        </div>
        <div class="book-option" data-book="caterpillar" data-age="0-3">
          <span class="book-option-emoji">&#x1F41B;</span>
          <span class="book-option-name">好饿的毛毛虫</span>

    <div class="age-select">
      <div class="age-select-label">孩子的年龄：</div>
      <div class="age-options" id="ageOptions">
        <div class="age-option" data-age="0-3">0-3岁</div>
        <div class="age-option" data-age="4-6">4-6岁</div>
        <div class="age-option selected" data-age="7-11">7-11岁</div>
        <div class="age-option" data-age="12-15">12-15岁</div>
      </div>

    <button class="start-btn" id="startBtn">开始阅读 &#x2728;</button>

</div>

<script>
// ==========================================
// 梦芽阅灵 - 教育戏剧AI阅读陪伴机器人
// Trae IDE 创意产物 HTML DEMO
// ==========================================

// ==========================================
// State
// ==========================================
const state = {
  currentBook: 'nezha',
  currentAge: '7-11',
  currentPage: 0,
  totalPages: 7,
  interactionCount: 0,
  isReading: false,
  waitingForResponse: false,
  sessionHistory: []
};

// ==========================================
// DOM Elements
// ==========================================
const $ = id => document.getElementById(id);
const chatArea = $('chatArea');
const voiceBar = $('voiceBar');
const voiceBtn = $('voiceBtn');
const voiceHint = $('voiceHint');
const pageTurnOverlay = $('pageTurnOverlay');
const pageTurnBtn = $('pageTurnBtn');
const pageTurnTitle = $('pageTurnTitle');
const pageTurnHint = $('pageTurnHint');
const pageTurnEmoji = $('pageTurnEmoji');
const endOverlay = $('endOverlay');
const welcomeOverlay = $('welcomeOverlay');
const headerBook = $('headerBook');
const elfFace = $('elfFace');
const pageCounter = $('pageCounter');
const startBtn = $('startBtn');

// ==========================================
// Book Data
// ==========================================
const books = {
  nezha: {
    title: '哪吒闹海',
    emoji: '&#x1F409;',
    pages: [
      {
        stage: 'introduction',
        text: '很久很久以前，在很远很远的地方，有一座美丽的城市，叫做陈塘关。那里有高高的城墙，蓝蓝的天空，还有一位总兵叫李靖。今天，李靖的家里发生了一件奇怪的事情——他的夫人怀了一个宝宝，可是这个宝宝在妈妈肚子里待了三年零六个月......',
        emotion: 'curious',
        action: 'light_blink'
      },
      {
        stage: 'role_adoption',
        text: '现在，你就是李靖。你站在城墙上，看着天空。夫人要生宝宝了，可是等了三年又六个月，你的心里在想什么呢？',
        emotion: 'curious',
        action: 'light_blink',
        wait: true
      },
      {
        stage: 'empathy',
        text: '嗯，我听到了你的感受。是的，等了这么久，心里一定很复杂——又期待又担心。但是你知道吗？就在李靖想着这些的时候，天空突然亮了起来......',
        emotion: 'gentle',
        action: 'heart_eyes'
      },
      {
        stage: 'advancement',
        text: '"砰！"房间里传来一声巨响！一道金光从天而降，照亮了整个陈塘关。李靖赶紧跑过去，推开门——你猜他看到了什么？',
        emotion: 'exciting',
        action: 'light_blink'
      },
      {
        stage: 'introduction',
        text: '哇——你看！肉球裂开了，里面跳出来一个小男孩！他圆圆的脸上有一双亮晶晶的眼睛，手里还拿着一个金色的圈圈。他就是哪吒！',
        emotion: 'happy',
        action: 'smile'
      },
      {
        stage: 'role_adoption',
        text: '现在，你是哪吒。你刚刚来到这个世界，你看到了什么？你觉得这个世界怎么样？',
        emotion: 'curious',
        action: 'light_blink',
        wait: true
      },
      {
        stage: 'reflection',
        text: '真有意思！你说你看到了这个世界的美好。但是哪吒的命运并不简单——他有一个特别的使命，也遇到了很多困难。今天我们刚刚认识哪吒，下一次，我们还会陪他一起经历更多冒险。你最喜欢哪吒的什么呢？',
        emotion: 'gentle',
        action: 'heart_eyes',
        wait: true
      }
    ]
  },
  dayu: {
    title: '大禹治水',
    emoji: '&#x1F4A7;',
    pages: [
      {
        stage: 'introduction',
        text: '很久很久以前，中华大地上发生了一场大洪水。滔天的洪水淹没了农田，冲毁了房屋，百姓们流离失所，哭声震天。当时的首领叫舜，他派了一个人去治理洪水，这个人叫鲧——但是鲧花了九年时间，水还是没有治好......',
        emotion: 'calm',
        action: 'light_blink'
      },

// ==========================================
// Demo Responses (simulated child responses)
// ==========================================
const demoResponses = {
  nezha: {
    1: '我觉得很期待，等了三年，一定是个了不起的宝宝！',
    5: '这个世界好大呀，天空好蓝，我想去看看！',

  },
  dayu: {
    1: '我相信他！他爸爸失败不代表他也会失败。',
    3: '因为如果他不去治水，会有更多人失去家园……他做了很艰难的选择。',
    5: '我想回家，抱抱我的孩子，然后告诉他们我为什么这么久没回来。',
    6: '我学过游泳，学了好久好久才学会，但是我没有放弃！'
  },
  caterpillar: {
    1: '（宝宝扭来扭去，咯咯笑）',
    2: '苹果！苹果好吃！',
    5: '会变成蝴蝶！',
    6: '黄色！红色！好漂亮！喜欢！'
  }
};

// ==========================================
// Helpers
// ==========================================
function scrollToBottom() {
  setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 100);
}

function addMessage(type, text, emotion = '') {
  const msg = document.createElement('div');
  msg.className = `msg ${type}`;
  
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.innerHTML = type === 'bot' ? '&#x1F9DD;' : '&#x1F9D2;';
  
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = text + (emotion ? `<span class="emotion-tag">${emotion}</span>` : '');
  
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chatArea.appendChild(msg);
  scrollToBottom();
  return msg;
}

function addTyping() {
  const msg = document.createElement('div');
  msg.className = 'msg bot msg-typing';
  msg.id = 'typingIndicator';
  
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.innerHTML = '&#x1F9DD;';
  
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
  
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chatArea.appendChild(msg);
  scrollToBottom();
  return msg;
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function updateElfFace(emotion) {
  const faces = {
    'happy': '&#x1F60A;',
    'curious': '&#x1F914;',
    'gentle': '&#x1F917;',
    'encouraging': '&#x1F60A;',
    'calm': '&#x1F60C;',
    'playful': '&#x1F61C;',
    'exciting': '&#x1F929;',
    'default': '&#x1F9DD;'
  };
  elfFace.innerHTML = faces[emotion] || faces['default'];
}

function updatePageCounter() {
  pageCounter.textContent = `第 ${state.currentPage + 1} / ${state.totalPages} 页`;
}

// ==========================================
// Core: Process Page
// ==========================================
function processPage() {
  const book = books[state.currentBook];
  const page = book.pages[state.currentPage];
  if (!page) return;
  
  updateElfFace(page.emotion);
  updatePageCounter();
  
  addTyping();
  
  setTimeout(() => {
    removeTyping();
    addMessage('bot', page.text, page.emotion === 'curious' ? '好奇' : page.emotion === 'gentle' ? '温柔' : page.emotion === 'happy' ? '开心' : page.emotion === 'exciting' ? '兴奋' : page.emotion === 'playful' ? '活泼' : '');
    updateElfFace('default');
    
    if (page.wait) {
      // Wait for child response
      state.waitingForResponse = true;
      voiceHint.textContent = '点击麦克风，说出你的想法';
      voiceBtn.classList.remove('active');
      
      // Auto demo response after 2 seconds
      setTimeout(() => {
        if (state.waitingForResponse) {
          simulateChildResponse();
        }
      }, 2000);
    } else {
      // Auto advance
      setTimeout(() => {
        if (state.currentPage < state.totalPages - 1) {
          showPageTurn();
        } else {
          showEndScreen();
        }
      }, 2500);
    }
  }, 1200 + Math.random() * 800);
}

function simulateChildResponse() {
  if (!state.waitingForResponse) return;
  
  const book = books[state.currentBook];
  const response = demoResponses[state.currentBook]?.[state.currentPage];
  if (!response) return;
  
  state.waitingForResponse = false;
  state.interactionCount++;
  voiceHint.textContent = '正在聆听...';
  voiceBtn.classList.add('active');
  
  // Show child's response
  setTimeout(() => {
    addMessage('user', response);
    voiceBtn.classList.remove('active');
    voiceHint.textContent = '点击麦克风，说出你的想法';
    
    // Bot responds to child's answer
    setTimeout(() => {
      addTyping();
      setTimeout(() => {
        removeTyping();
        
        // Get the follow-up response based on the page
        const followUp = getFollowUpResponse();
        if (followUp) {
          addMessage('bot', followUp.text, followUp.emotion === 'gentle' ? '温柔' : followUp.emotion === 'encouraging' ? '鼓励' : '');
          updateElfFace(followUp.emotion);
          setTimeout(() => updateElfFace('default'), 2000);
        }
        
        // Advance
        setTimeout(() => {
          if (state.currentPage < state.totalPages - 1) {
            showPageTurn();
          } else {
            showEndScreen();
          }
        }, 2000);
      }, 1000);
    }, 600);
  }, 400);
}

function getFollowUpResponse() {
  const book = books[state.currentBook];
  const nextPage = book.pages[Math.min(state.currentPage + 1, book.pages.length - 1)];
  
  // If next page is already the advancement, return a brief empathy response
  if (state.currentPage === 1 && state.currentBook === 'nezha') {
    return { text: '我听到了你的感受。你说得对，等了这么久的宝宝一定很特别。让我们继续往下看......', emotion: 'gentle' };
  }
  if (state.currentPage === 5 && state.currentBook === 'nezha') {
    return { text: '你看到了哪吒眼睛里的光，他确实不害怕。每一个新生命来到世界上的时候，都是这样充满好奇的。', emotion: 'encouraging' };
  }
  if (state.currentPage === 6 && state.currentBook === 'nezha') {
    return { text: '你找到了哪吒最特别的地方——他的眼睛里有光，心里有勇气。今天我们认识了哪吒，下次我们还会陪他一起冒险。', emotion: 'gentle' };
  }
  if (state.currentPage === 1 && state.currentBook === 'dayu') {
    return { text: '你说得对——不能因为父亲失败就否定儿子。大禹一定很感激你愿意相信他。', emotion: 'encouraging' };
  }
  if (state.currentPage === 3 && state.currentBook === 'dayu') {
    return { text: '你理解了大禹的选择。有时候，做对的事情需要巨大的勇气，也需要放弃一些东西。', emotion: 'gentle' };
  }
  if (state.currentPage === 5 && state.currentBook === 'dayu') {
    return { text: '等了十三年，第一件事就是回家。你的心里装着家人，大禹的心里也是。', emotion: 'gentle' };
  }
  if (state.currentPage === 6 && state.currentBook === 'dayu') {
    return { text: '你学游泳也坚持了很久！你也有大禹一样的精神。坚持做一件事情，最后一定会看到成果的。', emotion: 'encouraging' };
  }
  if (state.currentBook === 'caterpillar') {
    return { text: '宝宝说得真好！我们继续看毛毛虫的故事吧~', emotion: 'happy' };
  }
  return { text: '嗯，我听到了。你的想法很棒！让我们继续看下去吧。', emotion: 'encouraging' };
}

// ==========================================
// Page Turn
// ==========================================
function showPageTurn() {
  pageTurnOverlay.classList.remove('hidden');
  pageTurnTitle.textContent = '翻到下一页';
  pageTurnHint.textContent = '梦芽已经准备好了~';
  pageTurnEmoji.innerHTML = '&#x1F4D6;';
  pageTurnBtn.textContent = '继续阅读 &#x27A1;';
}

function hidePageTurn() {
  pageTurnOverlay.classList.add('hidden');
}

function nextPage() {
  hidePageTurn();
  state.currentPage++;
  state.waitingForResponse = false;
  processPage();
}

// ==========================================
// End Screen
// ==========================================
function showEndScreen() {
  const book = books[state.currentBook];
  $('endBookName').textContent = `《${book.title}》`;
  $('endPages').textContent = state.totalPages;
  $('endInteractions').textContent = state.interactionCount;
  
  const badges = {
    nezha: '勇敢表达者',
    dayu: '坚持小勇士',
    caterpillar: '好奇探索家'
  };
  $('endBadgeName').textContent = badges[state.currentBook] || '阅读小达人';
  
  endOverlay.classList.remove('hidden');
  voiceBar.classList.add('hidden');
  pageCounter.classList.add('hidden');
}

function restart() {
  endOverlay.classList.add('hidden');
  pageTurnOverlay.classList.add('hidden');
  voiceBar.classList.add('hidden');
  pageCounter.classList.add('hidden');
  welcomeOverlay.classList.remove('hidden');
  chatArea.innerHTML = '';
  state.currentPage = 0;
  state.interactionCount = 0;
  state.isReading = false;
  state.waitingForResponse = false;
  state.sessionHistory = [];
  headerBook.textContent = '等待选书...';
  updateElfFace('default');
}

// ==========================================
// Start Reading
// ==========================================
function startReading() {
  welcomeOverlay.classList.add('hidden');
  voiceBar.classList.remove('hidden');
  pageCounter.classList.remove('hidden');
  chatArea.innerHTML = '';
  state.currentPage = 0;
  state.interactionCount = 0;
  state.isReading = true;
  state.waitingForResponse = false;
  state.totalPages = books[state.currentBook].pages.length;
  
  const book = books[state.currentBook];
  headerBook.textContent = book.title;
  updateElfFace('default');
  
  // Welcome message
  addTyping();
  setTimeout(() => {
    removeTyping();
    const ageGreetings = {
      '0-3': '宝宝好！我是梦芽，今天我们要一起看一本好好玩的书——' + book.title + '！准备好了吗？',
      '4-6': '你好呀！我是梦芽，你的阅读小精灵！今天我们要一起读一本精彩的故事——' + book.title + '！你准备好了吗？',
      '7-11': '嘿！欢迎来到梦芽阅灵的阅读世界！我是梦芽，今天我们要一起深度阅读《' + book.title + '》。准备好了吗？',
      '12-15': '欢迎回来！我是梦芽。今天我们要一起探讨《' + book.title + '》，透过故事思考一些有意思的问题。准备好了吗？'
    };
    addMessage('bot', ageGreetings[state.currentAge] || ageGreetings['7-11'], '开心');
    
    setTimeout(() => {
      processPage();
    }, 1500);
  }, 1000);
}

// ==========================================
// Event Listeners
// ==========================================
startBtn.addEventListener('click', startReading);
pageTurnBtn.addEventListener('click', nextPage);
$('endRestartBtn').addEventListener('click', restart);

// Voice button - simulate child response
voiceBtn.addEventListener('click', () => {
  if (state.waitingForResponse) {
    simulateChildResponse();
  }
});

// Book selection
document.querySelectorAll('.book-option').forEach(opt => {
  opt.addEventListener('click', () => {
    document.querySelectorAll('.book-option').forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
    state.currentBook = opt.dataset.book;
    // Auto-select appropriate age
    const ageRange = opt.dataset.age;
    const ageMap = { '0-3': '0-3', '4-8': '4-6', '6-12': '7-11' };
    const targetAge = ageMap[ageRange] || '7-11';
    document.querySelectorAll('.age-option').forEach(a => {
      a.classList.toggle('selected', a.dataset.age === targetAge);
    });
    state.currentAge = targetAge;
  });
});

// Age selection
document.querySelectorAll('.age-option').forEach(opt => {
  opt.addEventListener('click', () => {
    document.querySelectorAll('.age-option').forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
    state.currentAge = opt.dataset.age;
  });
});

// Keyboard support
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' && !pageTurnOverlay.classList.contains('hidden')) {
    nextPage();
  }
  if (e.key === 'Enter' && !welcomeOverlay.classList.contains('hidden')) {
    startReading();
  }
  if (e.key === ' ' && state.waitingForResponse) {
    e.preventDefault();
    simulateChildResponse();
  }
});

// ==========================================
// Init
// ==========================================
headerBook.textContent = '梦芽阅灵';
console.log('&#x1F9DD; 梦芽阅灵 - 教育戏剧AI阅读陪伴机器人');
console.log('&#x1F3AD; 让每个孩子从"听故事"变成"活在故事里"');
console.log('&#x1F4D6; DEMO版本 - Trae IDE 创意产物');
</script>
