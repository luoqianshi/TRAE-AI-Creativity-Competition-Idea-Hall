<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>平替智选 Agent</title>
<style>
:root{--primary:#0d9488;--primary-light:#14b8a6;--primary-dark:#0f766e;--accent:#f59e0b;--accent-light:#fbbf24;--bg:#f8fafc;--surface:#fff;--text:#1e293b;--text-secondary:#64748b;--border:#e2e8f0;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-lg:0 10px 25px rgba(0,0,0,.1);--success:#22c55e;--warning:#f59e0b;--danger:#ef4444}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:480px;background:var(--surface);min-height:100vh;position:relative;overflow:hidden}
.header{padding:20px 16px 12px;text-align:center;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:#fff}
.header h1{font-size:22px;font-weight:700;margin-bottom:4px}
.header p{font-size:13px;opacity:.9}
.progress{display:flex;align-items:center;justify-content:center;padding:16px;gap:8px;background:#fff;border-bottom:1px solid var(--border)}
.progress-dot{width:10px;height:10px;border-radius:50%;background:var(--border);transition:all .3s}
.progress-dot.active{background:var(--primary);transform:scale(1.2)}
.progress-bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;max-width:120px}
.progress-bar-fill{height:100%;background:var(--primary);border-radius:2px;transition:width .4s ease}
.content{padding:16px;padding-bottom:100px;min-height:calc(100vh - 180px)}
.step-title{font-size:18px;font-weight:600;margin-bottom:8px;color:var(--text)}
.step-desc{font-size:14px;color:var(--text-secondary);margin-bottom:20px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:14px;font-weight:500;margin-bottom:8px;color:var(--text)}
input[type="text"],textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:15px;font-family:inherit;transition:border-color .2s;background:#fff}
input[type="text"]:focus,textarea:focus{outline:none;border-color:var(--primary)}
textarea{resize:vertical;min-height:80px}
.options{display:flex;flex-direction:column;gap:10px}
.option-card{display:flex;align-items:center;padding:14px 16px;border:1.5px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .2s;background:#fff}
.option-card:hover{border-color:var(--primary-light)}
.option-card.selected{border-color:var(--primary);background:rgba(13,148,136,.06)}
.option-card .check{width:20px;height:20px;border:2px solid var(--border);border-radius:50%;margin-right:12px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.option-card.selected .check{border-color:var(--primary);background:var(--primary)}
.option-card.selected .check::after{content:"";width:8px;height:8px;background:#fff;border-radius:50%}
.option-text{font-size:15px;font-weight:500}
.option-sub{font-size:12px;color:var(--text-secondary);margin-top:2px}
.budget-options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.budget-card{text-align:center;padding:16px;border:1.5px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .2s;background:#fff}
.budget-card:hover{border-color:var(--primary-light)}
.budget-card.selected{border-color:var(--primary);background:rgba(13,148,136,.06)}
.budget-card .amount{font-size:18px;font-weight:700;color:var(--text)}
.budget-card.selected .amount{color:var(--primary)}
.budget-card .desc{font-size:12px;color:var(--text-secondary);margin-top:4px}
.footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 16px 24px;background:#fff;border-top:1px solid var(--border);display:flex;gap:12px;z-index:10}
.btn{flex:1;padding:14px 20px;border-radius:var(--radius);font-size:15px;font-weight:600;border:none;cursor:pointer;transition:all .2s;text-align:center}
.btn-secondary{background:var(--bg);color:var(--text-secondary);border:1.5px solid var(--border)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-accent{background:var(--accent);color:#fff}

/* Results */
.result-section{margin-bottom:24px}
.result-section-title{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.result-section-title .icon{width:24px;height:24px;border-radius:6px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.radar-container{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.radar-container canvas{max-width:100%}
.risk-card{padding:14px 16px;border-radius:var(--radius);margin-bottom:12px;font-size:14px}
.risk-card.low{background:rgba(34,197,94,.1);border-left:4px solid var(--success);color:#166534}
.risk-card.medium{background:rgba(245,158,11,.1);border-left:4px solid var(--warning);color:#92400e}
.risk-card.high{background:rgba(239,68,68,.1);border-left:4px solid var(--danger);color:#991b1b}
.risk-title{font-weight:600;margin-bottom:4px}
.recommend-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;transition:all .2s}
.recommend-card:hover{box-shadow:var(--shadow-lg)}
.recommend-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.recommend-type{font-size:11px;padding:3px 8px;border-radius:20px;background:rgba(13,148,136,.1);color:var(--primary-dark);font-weight:600}
.recommend-coverage{font-size:13px;color:var(--text-secondary)}
.recommend-name{font-size:16px;font-weight:600;margin-bottom:4px}
.recommend-price{color:var(--primary);font-size:18px;font-weight:700}
.recommend-price .original{text-decoration:line-through;color:var(--text-secondary);font-size:13px;font-weight:400;margin-left:6px}
.recommend-note{font-size:13px;color:var(--text-secondary);margin-top:8px;line-height:1.5}
.coverage-bar{height:6px;background:var(--border);border-radius:3px;margin-top:8px;overflow:hidden}
.coverage-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-light));border-radius:3px;transition:width 1s ease}
.advice-list{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);padding:16px}
.advice-item{display:flex;gap:10px;margin-bottom:12px;font-size:14px}
.advice-item:last-child{margin-bottom:0}
.advice-item .dot{width:6px;height:6px;border-radius:50%;background:var(--primary);margin-top:7px;flex-shrink:0}
.export-area{background:#f1f5f9;border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;font-size:13px;line-height:1.8;white-space:pre-wrap;font-family:monospace;margin-top:16px}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .4s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.slide-in{animation:slideIn .3s ease}

/* Analysis loading */
.analyzing{text-align:center;padding:40px 20px}
.analyzing-spinner{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.analyzing p{color:var(--text-secondary);font-size:14px}

/* Matrix */
.matrix-container{position:relative;width:100%;height:220px;background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden}
.matrix-bg{position:absolute;inset:0}
.matrix-bg .q{width:50%;height:50%;float:left;opacity:.15}
.matrix-bg .q1{background:var(--success)}
.matrix-bg .q2{background:var(--warning)}
.matrix-bg .q3{background:var(--danger)}
.matrix-bg .q4{background:var(--border)}
.matrix-label{position:absolute;font-size:10px;color:var(--text-secondary);font-weight:500}
.matrix-label.lt{top:4px;left:4px}
.matrix-label.rt{top:4px;right:4px}
.matrix-label.lb{bottom:4px;left:4px}
.matrix-label.rb{bottom:4px;right:4px}
.matrix-dot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:var(--shadow);transform:translate(-50%,-50%)}
.matrix-axis{position:absolute;font-size:10px;color:var(--text-secondary)}

/* Comparison table */
.compare-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.compare-table th,.compare-table td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border)}
.compare-table th{color:var(--text-secondary);font-weight:500;font-size:12px}
.compare-table td{font-weight:500}
.compare-table .highlight{color:var(--primary);font-weight:700}

/* Responsive */
@media(min-width:481px){.app{border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>平替智选 Agent</h1>
    <p>消费降级不降质，AI 帮你买得更值得</p>
  </div>
  <div class="progress" id="progressBar">
    <div class="progress-dot active"></div>
    <div class="progress-bar"><div class="progress-bar-fill" style="width:20%"></div></div>
    <div class="progress-dot"></div>
    <div class="progress-dot"></div>
    <div class="progress-dot"></div>
  </div>
  <div class="content" id="content">
    <!-- Dynamic content -->
  </div>
  <div class="footer" id="footer">
    <button class="btn btn-secondary" id="btnPrev" onclick="prevStep()" style="display:none">上一步</button>
    <button class="btn btn-primary" id="btnNext" onclick="nextStep()">下一步</button>
  </div>
</div>

<script>
// ===== Knowledge Base =====
const knowledgeBase={categories:[{name:"美妆个护",items:[{name:"SK-II 神仙水 230ml",price:1690,category:"护肤精华",substitutes:[{name:"肌活糙米水 215ml",price:198,coverage:85,note:"同样含发酵滤液，控油维稳效果接近"},{name:"自然之名酵母水 200ml",price:89,coverage:75,note:"平价酵母精华水，基础保湿维稳"}],audience:"油皮/混油皮，追求水油平衡"},{name:"雅诗兰黛小棕瓶 50ml",price:935,category:"护肤精华",substitutes:[{name:"欧莱雅黑精华 50ml",price:299,coverage:80,note:"同集团同源二裂酵母，抗初老功效接近"},{name:"Purid 2号精华 50ml",price:119,coverage:70,note:"主打修护维稳，性价比极高"}],audience:"初老肌，需要修护抗氧"},{name:"戴森吹风机 HD15",price:3199,category:"美发电器",substitutes:[{name:"徕芬 LF03",price:599,coverage:90,note:"同样11万转高速马达，温控和风力接近"},{name:"米家高速吹风机 H501",price:249,coverage:80,note:"2亿负离子，基础速干需求满足"}],audience:"中长发，追求速干和护发"},{name:"Lamer 面霜 60ml",price:3080,category:"面霜",substitutes:[{name:"FAB 急救面霜 170g",price:189,coverage:75,note:"同样主打修护屏障，急救舒缓效果好"},{name:"薇诺娜特护霜 50g",price:268,coverage:80,note:"国货修护标杆，敏感肌友好"}],audience:"敏感肌/屏障受损，需要修护"}]},{name:"数码家电",items:[{name:"AirPods Pro 2",price:1899,category:"耳机",substitutes:[{name:"漫步者 Lolli Pro3",price:359,coverage:82,note:"同样支持 LDAC 高清解码和主动降噪"},{name:"Redmi Buds 5 Pro",price:399,coverage:80,note:"52dB 降噪深度，同价位性能突出"}],audience:"通勤族，需要降噪和便携"},{name:"iPad Pro 11寸 256G",price:7599,category:"平板电脑",substitutes:[{name:"小米平板 6S Pro 12.4",price:3299,coverage:85,note:"同样骁龙8Gen2，屏幕更大分辨率更高"},{name:"vivo Pad3 Pro",price:2999,coverage:80,note:"天玑9300，影音和笔记体验优秀"}],audience:"学生/轻办公，笔记和影音为主"},{name:"索尼 WH-1000XM5",price:2499,category:"头戴耳机",substitutes:[{name:"漫步者 W860NB Pro",price:549,coverage:80,note:"同样支持 LDAC 和主动降噪，续航更长"},{name:"QCY H3",price:199,coverage:70,note:"43dB 降噪，基础头戴降噪需求满足"}],audience:"长途飞行/办公室，需要长时间佩戴"},{name:"戴森吸尘器 V12",price:4499,category:"清洁电器",substitutes:[{name:"追觅 V12S",price:1699,coverage:88,note:"同样15万转马达，绿光显尘功能"},{name:"米家无线吸尘器 2 Pro",price:1299,coverage:80,note:"190AW吸力，满足日常清洁需求"}],audience:"养宠家庭/过敏体质，深度清洁需求"}]},{name:"日用百货",items:[{name:"The Laundress 洗衣液 1L",price:210,category:"衣物清洁",substitutes:[{name:"绽家洗衣液 1.2L",price:69,coverage:88,note:"同样植萃配方，留香持久，洗护合一"},{name:"蓝月亮至尊浓缩",price:45,coverage:80,note:"浓缩配方，清洁力达标"}],audience:"精致衣物护理，追求天然成分"},{name:"Tempo 抽纸 18包",price:76,category:"纸品",substitutes:[{name:"维达棉韧 24包",price:45,coverage:90,note:"同样4层加厚，触感接近"},{name:"洁柔 Face 24包",price:39,coverage:85,note:"可湿水，柔韧度好"}],audience:"家庭囤货，追求厚实触感"},{name:"无印良品收纳盒 大号",price:98,category:"收纳",substitutes:[{name:"太力收纳箱 同款尺寸",price:29,coverage:90,note:"同样PP材质，可叠加设计"},{name:"宜家 SAMLA",price:19,coverage:85,note:"透明可视，性价比极高"}],audience:"租房/小户型，需要规整收纳"},{name:"象印保温杯 480ml",price:299,category:"杯具",substitutes:[{name:"富光保温杯 500ml",price:59,coverage:88,note:"同样316不锈钢，保温效果接近"},{name:"小米保温杯 2 500ml",price:79,coverage:85,note:"极简设计，保温性能优秀"}],audience:"日常通勤/办公室，保温保冷"}]},{name:"服装鞋包",items:[{name:"Canada Goose 羽绒服",price:9500,category:"羽绒服",substitutes:[{name:"波司登极寒系列",price:1999,coverage:90,note:"同样鹅绒填充，蓬松度700+，御寒等级相当"},{name:"凯乐石羽绒服",price:1200,coverage:85,note:"专业户外品牌，保暖性能优秀"}],audience:"北方严寒地区，需要极寒防护"},{name:"New Balance 990v6",price:1999,category:"运动鞋",substitutes:[{name:"安踏 C37 3.0",price:399,coverage:82,note:"同样强调缓震舒适，日常通勤脚感接近"},{name:"李宁 越影 3 Pro",price:498,coverage:80,note:"全掌䨻科技，缓震回弹优秀"}],audience:"日常通勤/轻度运动，追求舒适"},{name:"Longchamp 饺子包",price:1100,category:"通勤包",substitutes:[{name:"龙骧同款尼龙包",price:89,coverage:85,note:"1688同源工厂，材质和容量一致"},{name:"优衣库饺子包",price:149,coverage:80,note:"同样轻便防水，多色可选"}],audience:"上班族，需要轻便大容量通勤包"},{name:"始祖鸟 Beta Jacket",price:4500,category:"冲锋衣",substitutes:[{name:"凯乐石 Mont-X",price:1800,coverage:88,note:"同样Gore-Tex面料，专业户外性能接近"},{name:"伯希和 北极星",price:899,coverage:80,note:"eVent面料，透气性优秀"}],audience:"户外爱好者，需要防水透气"}]}]};

// ===== State =====
let state={step:0,input:{productName:"",scenarios:[],budgetRange:"",priorities:[],concerns:""},analysis:null,recommendations:null,advice:null};
const scenarios=[{id:"commute",label:"日常通勤",weight:30},{id:"home",label:"居家办公",weight:25},{id:"travel",label:"户外旅行",weight:10},{id:"social",label:"社交聚会",weight:15},{id:"work",label:"专业工作",weight:20},{id:"other",label:"其他",weight:15}];
const budgets=[{id:"<100",label:"100元以内",max:100},{id:"100-500",label:"100-500元",max:500},{id:"500-1000",label:"500-1000元",max:1000},{id:"1000-3000",label:"1000-3000元",max:3000},{id:">3000",label:"3000元以上",max:99999}];
const priorities=[{id:"function",label:"功能优先"},{id:"brand",label:"品牌认同"},{id:"design",label:"颜值设计"},{id:"quality",label:"耐用品质"},{id:"social",label:"社交属性"}];

// ===== Render =====
function render(){
  const content=document.getElementById('content');
  const btnPrev=document.getElementById('btnPrev');
  const btnNext=document.getElementById('btnNext');
  updateProgress();
  if(state.step===0)renderStep0(content);
  else if(state.step===1)renderStep1(content);
  else if(state.step===2)renderStep2(content);
  else if(state.step===3)renderStep3(content);
  else if(state.step===4)renderStep4(content);
  else if(state.step===5)renderAnalyzing(content);
  else if(state.step===6)renderResults(content);
  btnPrev.style.display=state.step>0&&state.step<6?'block':'none';
  if(state.step===0){btnNext.textContent='下一步';btnNext.disabled=!state.input.productName.trim();}
  else if(state.step===1){btnNext.textContent='下一步';btnNext.disabled=state.input.scenarios.length===0;}
  else if(state.step===2){btnNext.textContent='下一步';btnNext.disabled=!state.input.budgetRange;}
  else if(state.step===3){btnNext.textContent='下一步';btnNext.disabled=state.input.priorities.length===0;}
  else if(state.step===4){btnNext.textContent='开始分析';btnNext.disabled=false;}
  else if(state.step===5){btnNext.style.display='none';btnPrev.style.display='none';}
  else if(state.step===6){btnNext.style.display='none';btnPrev.style.display='none';}
}

function updateProgress(){
  const dots=document.querySelectorAll('.progress-dot');
  const fill=document.querySelector('.progress-bar-fill');
  const pct=state.step<5?(state.step+1)*20:100;
  fill.style.width=pct+'%';
  dots.forEach((d,i)=>d.classList.toggle('active',i<=Math.min(state.step,3)));
}

function renderStep0(el){
  el.innerHTML=`<div class="slide-in"><div class="step-title">想买点什么？</div><div class="step-desc">输入你近期想购买的商品名称，越具体越好</div><div class="form-group"><input type="text" id="productName" placeholder="例如：戴森吹风机、SK-II神仙水..." value="${state.input.productName}" oninput="state.input.productName=this.value;render()"></div></div>`;
  setTimeout(()=>document.getElementById('productName')?.focus(),100);
}

function renderStep1(el){
  let html=`<div class="slide-in"><div class="step-title">使用场景</div><div class="step-desc">在哪些场景下会用到它？（可多选）</div><div class="options">`;
  scenarios.forEach(s=>{
    const selected=state.input.scenarios.includes(s.id);
    html+=`<div class="option-card ${selected?'selected':''}" onclick="toggleScenario('${s.id}')">
      <div class="check"></div><div><div class="option-text">${s.label}</div></div>
    </div>`;
  });
  html+=`</div></div>`;
  el.innerHTML=html;
}

function renderStep2(el){
  let html=`<div class="slide-in"><div class="step-title">预算范围</div><div class="step-desc">你打算花多少钱？</div><div class="budget-options">`;
  budgets.forEach(b=>{
    const selected=state.input.budgetRange===b.id;
    html+=`<div class="budget-card ${selected?'selected':''}" onclick="state.input.budgetRange='${b.id}';render()">
      <div class="amount">${b.label}</div>
    </div>`;
  });
  html+=`</div></div>`;
  el.innerHTML=html;
}

function renderStep3(el){
  let html=`<div class="slide-in"><div class="step-title">核心诉求</div><div class="step-desc">买它最看重什么？（可多选）</div><div class="options">`;
  priorities.forEach(p=>{
    const selected=state.input.priorities.includes(p.id);
    html+=`<div class="option-card ${selected?'selected':''}" onclick="togglePriority('${p.id}')">
      <div class="check"></div><div><div class="option-text">${p.label}</div></div>
    </div>`;
  });
  html+=`</div></div>`;
  el.innerHTML=html;
}

function renderStep4(el){
  el.innerHTML=`<div class="slide-in"><div class="step-title">还有什么顾虑？</div><div class="step-desc">描述你已有的替代品，或对这次购买的顾虑（可选）</div><div class="form-group"><textarea id="concerns" placeholder="例如：我已经有一个普通吹风机，但吹干太慢；或者担心便宜的容易坏..." oninput="state.input.concerns=this.value">${state.input.concerns}</textarea></div></div>`;
}

function renderAnalyzing(el){
  el.innerHTML=`<div class="analyzing fade-in"><div class="analyzing-spinner"></div><p>AI 正在分析你的需求...</p></div>`;
  setTimeout(()=>{doAnalysis();render();},1800);
}

function toggleScenario(id){
  const idx=state.input.scenarios.indexOf(id);
  if(idx>-1)state.input.scenarios.splice(idx,1);else state.input.scenarios.push(id);
  render();
}
function togglePriority(id){
  const idx=state.input.priorities.indexOf(id);
  if(idx>-1)state.input.priorities.splice(idx,1);else state.input.priorities.push(id);
  render();
}

function nextStep(){if(state.step<5){state.step++;if(state.step===5)render();else render();}}
function prevStep(){if(state.step>0){state.step--;render();}}

// ===== Analysis Engine =====
function doAnalysis(){
  const inp=state.input;
  // Demand breakdown
  const funcScore=Math.min(100,(inp.scenarios.includes('work')?20:0)+(inp.priorities.includes('function')?30:0)+(inp.priorities.includes('quality')?15:0)+30);
  const emoScore=Math.min(100,(inp.priorities.includes('design')?25:0)+(inp.priorities.includes('brand')?20:0)+20);
  const socScore=Math.min(100,(inp.scenarios.includes('social')?30:0)+(inp.priorities.includes('social')?40:0)+10);
  state.analysis={functional:funcScore,emotional:emoScore,social:socScore};
  // Pseudo need risk
  let riskScore=0,riskReasons=[];
  const maxBudget=budgets.find(b=>b.id===inp.budgetRange)?.max||99999;
  const matchedItem=findMatchedItem(inp.productName);
  if(matchedItem&&maxBudget>matchedItem.price*2){riskScore+=20;riskReasons.push('预算远超商品 typical 价格，存在过度消费倾向');}
  if(inp.scenarios.length===1&&inp.scenarios[0]==='travel'){riskScore+=25;riskReasons.push('仅用于低频场景（户外旅行），使用频率可能很低');}
  if(inp.priorities.length===1&&(inp.priorities[0]==='brand'||inp.priorities[0]==='social')){riskScore+=30;riskReasons.push('决策权重过于侧重品牌/社交，功能价值可能被忽视');}
  if(inp.concerns.trim().length>0&&!inp.concerns.includes('不')&&!inp.concerns.includes('坏')&&!inp.concerns.includes('慢')){riskScore+=15;riskReasons.push('已有替代品但未表达明确不满，替换动力不足');}
  state.analysis.riskScore=Math.min(100,riskScore);
  state.analysis.riskReasons=riskReasons.length?riskReasons:['需求描述较为理性，暂未发现明显风险'];
  // Priority matrix
  const freqWeight={commute:30,home:25,travel:10,social:15,work:20,other:15};
  const freqScore=inp.scenarios.reduce((sum,s)=>sum+(freqWeight[s]||15),0);
  const irreplaceability=inp.concerns.trim()?70:50;
  state.analysis.frequency=Math.min(100,freqScore);
  state.analysis.irreplaceability=irreplaceability;
  // Recommendations
  state.recommendations=generateRecommendations(inp,matchedItem);
  // Advice
  state.advice=generateAdvice(inp,state.analysis,matchedItem);
  state.step=6;
  saveHistory();
}

function findMatchedItem(productName){
  const pn=productName.toLowerCase();
  for(const cat of knowledgeBase.categories){
    for(const item of cat.items){
      if(pn.includes(item.name.toLowerCase().split(' ')[0])||item.name.toLowerCase().includes(pn))return item;
    }
  }
  return null;
}

function generateRecommendations(inp,matchedItem){
  const recs=[];
  const maxB=budgets.find(b=>b.id===inp.budgetRange)?.max||99999;
  if(matchedItem){
    matchedItem.substitutes.forEach(sub=>{
      if(sub.price<=maxB){
        const valueScore=(sub.coverage/100)/(sub.price/Math.max(matchedItem.price,1))*100;
        recs.push({type:'direct',original:matchedItem,substitute:sub,similarityScore:sub.coverage,valueScore:Math.round(valueScore)});
      }
    });
  }
  // Generic recommendations based on category keywords
  if(recs.length===0){
    for(const cat of knowledgeBase.categories){
      for(const item of cat.items){
        if(inp.productName.includes(cat.name.slice(0,2))){
          item.substitutes.forEach(sub=>{
            if(sub.price<=maxB){
              const valueScore=(sub.coverage/100)/(sub.price/Math.max(item.price,1))*100;
              recs.push({type:'direct',original:item,substitute:sub,similarityScore:sub.coverage,valueScore:Math.round(valueScore)});
            }
          });
        }
      }
    }
  }
  recs.sort((a,b)=>b.valueScore-a.valueScore);
  return recs.slice(0,3);
}

function generateAdvice(inp,analysis,matchedItem){
  const advices=[];
  const risk=analysis.riskScore;
  const freq=analysis.frequency;
  if(risk>60)advices.push({icon:'⏸️',text:'建议暂缓购买，观察 30 天是否仍有需求'});
  else if(risk>30)advices.push({icon:'📅',text:'非急需，建议等大促（618 / 双11 / 黑五）再入手'});
  else if(freq>60)advices.push({icon:'✅',text:'真实高频需求，建议立即购买'});
  else advices.push({icon:'🤔',text:'需求频率一般，可考虑二手或租赁方案'});
  // Channel
  const pn=inp.productName.toLowerCase();
  if(pn.includes('手机')||pn.includes('耳机')||pn.includes('平板')||pn.includes('吹风')||pn.includes('吸尘')){
    advices.push({icon:'🛒',text:'数码家电推荐渠道：京东自营（售后保障）/ 拼多多百亿补贴（价格优势）'});
  }else if(pn.includes('霜')||pn.includes('精华')||pn.includes('水')||pn.includes('面膜')){
    advices.push({icon:'🛒',text:'美妆个护推荐渠道：天猫旗舰店（正品保障）/ 中免日上（免税价格）'});
  }else if(pn.includes('洗衣')||pn.includes('纸')||pn.includes('收纳')){
    advices.push({icon:'🛒',text:'日用百货推荐渠道：1688 同源工厂（批发价）/ 天猫超市（次日达）'});
  }else{
    advices.push({icon:'🛒',text:'综合推荐：京东自营 / 天猫旗舰店，大促期间叠加满减券最优'});
  }
  // Saving tips
  advices.push({icon:'💡',text:'省钱策略：开通京东 Plus / 88VIP 享额外折扣，或通过返利平台下单'});
  if(matchedItem){
    const save=matchedItem.price-(matchedItem.substitutes[0]?.price||0);
    if(save>0)advices.push({icon:'💰',text:`选择推荐平替可预估节省 ¥${save}`});
  }
  return advices;
}

function saveHistory(){
  try{
    const history=JSON.parse(localStorage.getItem('ssa_history')||'[]');
    history.push({date:new Date().toISOString(),product:state.input.productName,analysis:state.analysis,recommendations:state.recommendations});
    localStorage.setItem('ssa_history',JSON.stringify(history.slice(-10)));
  }catch(e){}
}

// ===== Results Render =====
function renderResults(el){
  const a=state.analysis,r=state.recommendations,adv=state.advice;
  let html=`<div class="fade-in">`;
  // Risk
  const riskClass=a.riskScore>60?'high':a.riskScore>30?'medium':'low';
  const riskTitle=a.riskScore>60?'伪需求警报！':a.riskScore>30?'建议再想想':'需求较为理性';
  html+=`<div class="result-section"><div class="result-section-title"><span class="icon">🚨</span>需求风险评估</div><div class="risk-card ${riskClass}"><div class="risk-title">${riskTitle}（风险值 ${a.riskScore}/100）</div><div>${a.riskReasons.join('；')}</div></div></div>`;
  // Radar
  html+=`<div class="result-section"><div class="result-section-title"><span class="icon">📊</span>需求雷达图</div><div class="radar-container"><canvas id="radarChart" width="300" height="240"></canvas></div></div>`;
  // Matrix
  html+=`<div class="result-section"><div class="result-section-title"><span class="icon">📍</span>需求优先级矩阵</div><div class="matrix-container">
    <div class="matrix-bg"><div class="q q1"></div><div class="q q2"></div><div class="q q3"></div><div class="q q4"></div></div>
    <span class="matrix-label lt">高频·不可替代</span><span class="matrix-label rt">低频·不可替代</span>
    <span class="matrix-label lb">高频·可替代</span><span class="matrix-label rb">低频·可替代</span>
    <div class="matrix-dot" style="left:${a.frequency}%;top:${100-a.irreplaceability}%"></div>
  </div></div>`;
  // Recommendations
  html+=`<div class="result-section"><div class="result-section-title"><span class="icon">💎</span>平替推荐</div>`;
  if(r.length){
    r.forEach((rec,i)=>{
      const typeLabels={direct:'直接平替',functional:'功能替代',scenario:'场景替代',channel:'渠道替代'};
      html+=`<div class="recommend-card slide-in" style="animation-delay:${i*0.1}s">
        <div class="recommend-header"><span class="recommend-type">${typeLabels[rec.type]}</span><span class="recommend-coverage">功能覆盖 ${rec.substitute.coverage}%</span></div>
        <div class="recommend-name">${rec.substitute.name}</div>
        <div class="recommend-price">¥${rec.substitute.price}<span class="original">原品 ¥${rec.original.price}</span></div>
        <div class="coverage-bar"><div class="coverage-bar-fill" style="width:${rec.substitute.coverage}%"></div></div>
        <div class="recommend-note">${rec.substitute.note}</div>
      </div>`;
    });
    // Comparison table
    html+=`<div style="overflow-x:auto;margin-top:12px"><table class="compare-table"><tr><th>对比项</th><th>原品</th><th>推荐平替</th></tr>`;
    const orig=r[0].original,sub=r[0].substitute;
    html+=`<tr><td>价格</td><td>¥${orig.price}</td><td class="highlight">¥${sub.price}</td></tr>`;
    html+=`<tr><td>功能覆盖</td><td>100%</td><td class="highlight">${sub.coverage}%</td></tr>`;
    html+=`<tr><td>预估节省</td><td>-</td><td class="highlight">¥${orig.price-sub.price}</td></tr>`;
    html+=`</table></div>`;
  }else{
    html+=`<div style="padding:20px;text-align:center;color:var(--text-secondary);font-size:14px">暂无精准平替数据，以下是通用消费建议</div>`;
  }
  html+=`</div>`;
  // Advice
  html+=`<div class="result-section"><div class="result-section-title"><span class="icon">💡</span>消费建议</div><div class="advice-list">`;
  adv.forEach(ad=>{html+=`<div class="advice-item"><div class="dot"></div><div>${ad.icon} ${ad.text}</div></div>`;});
  html+=`</div></div>`;
  // Export
  html+=`<div class="result-section"><div class="result-section-title"><span class="icon">📋</span>购买清单</div><div class="export-area" id="exportArea">${generateExportText()}</div><button class="btn btn-accent" style="width:100%;margin-top:12px" onclick="copyExport()">复制清单</button></div>`;
  // Restart
  html+=`<div style="text-align:center;padding:20px 0 40px"><button class="btn btn-secondary" style="width:auto;padding:12px 32px" onclick="location.reload()">再测一个</button></div>`;
  html+=`</div>`;
  el.innerHTML=html;
  setTimeout(()=>drawRadar(),300);
}

function drawRadar(){
  const canvas=document.getElementById('radarChart');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const w=300,h=240;
  canvas.width=w*dpr;canvas.height=h*dpr;
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  ctx.scale(dpr,dpr);
  const cx=w/2,cy=h/2+10,radius=75;
  const dims=[{label:'功能性',score:state.analysis.functional},{label:'情感价值',score:state.analysis.emotional},{label:'社交属性',score:state.analysis.social},{label:'使用频率',score:state.analysis.frequency},{label:'不可替代',score:state.analysis.irreplaceability}];
  const angleStep=(Math.PI*2)/dims.length;
  // Grid
  ctx.strokeStyle='#e2e8f0';ctx.lineWidth=1;
  for(let level=1;level<=4;level++){
    ctx.beginPath();
    for(let i=0;i<=dims.length;i++){const angle=i*angleStep-Math.PI/2;const dist=(radius/4)*level;const x=cx+Math.cos(angle)*dist;const y=cy+Math.sin(angle)*dist;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
    ctx.closePath();ctx.stroke();
  }
  // Axis lines
  ctx.beginPath();
  for(let i=0;i<dims.length;i++){const angle=i*angleStep-Math.PI/2;ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(angle)*radius,cy+Math.sin(angle)*radius);}
  ctx.stroke();
  // Data
  ctx.beginPath();ctx.fillStyle='rgba(13,148,136,0.2)';ctx.strokeStyle='var(--primary)';ctx.lineWidth=2;
  for(let i=0;i<=dims.length;i++){const dim=dims[i%dims.length];const angle=(i%dims.length)*angleStep-Math.PI/2;const dist=(dim.score/100)*radius;const x=cx+Math.cos(angle)*dist;const y=cy+Math.sin(angle)*dist;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
  ctx.closePath();ctx.fill();ctx.stroke();
  // Labels
  ctx.fillStyle='var(--text-secondary)';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<dims.length;i++){const angle=i*angleStep-Math.PI/2;const x=cx+Math.cos(angle)*(radius+18);const y=cy+Math.sin(angle)*(radius+18);ctx.fillText(dims[i].label,x,y);}
}

function generateExportText(){
  const inp=state.input,r=state.recommendations;
  let text=`【平替智选 Agent 购买清单】\n📦 商品：${inp.productName}\n`;
  if(r.length){
    text+=`💡 推荐平替：${r[0].substitute.name}\n💰 预估节省：¥${r[0].original.price-r[0].substitute.price}\n`;
  }
  text+=`📍 推荐渠道：京东自营 / 天猫旗舰店\n⏰ 购买时机：${state.analysis.riskScore>30?'建议等大促':'真实需求，可立即购买'}\n💡 省钱Tips：开通会员享折扣，或通过返利平台下单`;
  return text;
}
function copyExport(){
  const text=document.getElementById('exportArea').textContent;
  navigator.clipboard?.writeText(text).then(()=>alert('已复制到剪贴板'));
}

// Init
render();
</script>
