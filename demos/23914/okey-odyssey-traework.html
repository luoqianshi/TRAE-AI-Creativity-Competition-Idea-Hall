<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Okey 奇旅 · Roguelike 麻将冒险</title>
<style>
  :root{
    --bg:#0d0f17; --panel:#171a28; --panel2:#1e2236; --line:#2d3350;
    --text:#e9ecf7; --muted:#959fbd; --accent:#ffb454; --accent2:#7c8cff;
    --good:#5ad19a; --danger:#ff6b6b; --gold:#ffd54a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    background:radial-gradient(900px 500px at 60% -10%,#1b2236 0,var(--bg) 60%);color:var(--text);
    display:flex;justify-content:center}
  .app{width:100%;max-width:460px;min-height:100%;padding:14px 14px 24px;display:flex;flex-direction:column;gap:12px}

  /* top bar */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{font-weight:800;font-size:17px;letter-spacing:.3px}
  .brand .o{color:var(--accent)} .brand .r{color:var(--accent2)}
  .stats{display:flex;gap:8px;font-size:12px}
  .pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
  .pill b{color:var(--text)}
  .pill.gold b{color:var(--gold)}

  /* hp + stage */
  .hpwrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .hprow{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
  .hprow b{color:var(--text)}
  .hpbar{height:12px;background:#27202c;border-radius:8px;overflow:hidden}
  .hpbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff6b6b,#ff9f6b);transition:width .35s}

  /* track */
  .track{display:flex;align-items:center;justify-content:space-between;gap:5px;
    background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:14px;padding:14px 10px}
  .cell{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
  .node{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:var(--muted);background:#11131d;border:1px dashed var(--line)}
  .node.you{background:#13233a;border:1px solid var(--accent2);color:#cdd7ff;font-size:16px}
  .mob{width:42px;height:46px;border-radius:11px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:#2a1530;border:1px solid #5a2b63;position:relative;transition:transform .25s}
  .mob .face{font-size:18px;line-height:1}
  .mob .hp{font-size:10px;color:#ffb8e6;margin-top:1px}
  .mob.elite{background:#3a1320;border-color:#8a2b3c}
  .mob.hurt{animation:shake .25s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .mlabel{font-size:10px;color:var(--muted)}

  /* combo readout */
  .combo{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;color:var(--muted);
    min-height:30px}
  .combo .chips{color:var(--accent)} .combo .mult{color:var(--accent2)} .combo .dmg{color:var(--good);font-weight:800;font-size:18px}

  /* rack */
  .rack{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 10px;min-height:74px}
  .tile{width:38px;height:52px;border-radius:8px;background:#f5f2e8;color:#222;display:flex;
    align-items:center;justify-content:center;font-weight:800;font-size:20px;cursor:pointer;
    border:2px solid transparent;user-select:none;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .12s}
  .tile.sel{border-color:var(--accent);transform:translateY(-8px)}
  .tile.red{color:#d6332e} .tile.black{color:#23262e} .tile.blue{color:#2358cc} .tile.yellow{color:#bd8f00}
  .tile.joker{background:#2b2150;color:#ffd54a;border-color:#5a4a9a}

  /* actions */
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button{font-family:inherit;border:0;border-radius:11px;padding:13px 10px;font-weight:800;font-size:14px;cursor:pointer}
  .b-play{background:var(--accent);color:#241803;grid-column:1/3}
  .b-win{background:linear-gradient(90deg,#ff6b6b,#ffb454);color:#2a0f00}
  .b-disc{background:transparent;color:var(--muted);border:1px solid var(--line)}
  button:disabled{opacity:.4;cursor:not-allowed}

  /* log */
  .log{font-size:12px;color:var(--muted);background:#11131d;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;min-height:40px;line-height:1.5}
  .log b{color:var(--good)} .log .bad{color:var(--danger)}

  /* overlay */
  .overlay{position:fixed;inset:0;background:rgba(8,9,15,.82);display:flex;align-items:center;justify-content:center;
    padding:24px;z-index:20}
  .overlay.hide{display:none}
  .modal{width:100%;max-width:380px;background:var(--panel2);border:1px solid var(--line);border-radius:18px;
    padding:22px;text-align:center}
  .modal h2{margin:0 0 6px;font-size:22px}
  .modal p{color:var(--muted);font-size:14px;margin:0 0 16px}
  .shop{display:flex;flex-direction:column;gap:10px;margin:14px 0}
  .shopItem{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
  .shopItem:hover{border-color:var(--accent)}
  .shopItem .n{font-weight:700;font-size:14px} .shopItem .d{font-size:12px;color:var(--muted)}
  .shopItem .c{color:var(--gold);font-weight:800;font-size:13px;white-space:nowrap}
  .modal .full{width:100%;background:var(--accent);color:#241803}
  .hint{font-size:12px;color:var(--muted);text-align:center;margin-top:-2px}
  .credit{text-align:center;font-size:11px;color:var(--muted);opacity:.7;margin-top:4px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><span class="o">Okey</span> 奇旅 · <span class="r">Roguelike</span></div>
    <div class="stats">
      <span class="pill">关卡 <b id="stage">1</b></span>
      <span class="pill gold">金币 <b id="gold">0</b></span>
    </div>
  </div>

  <div class="hpwrap">
    <div class="hprow"><span>玩家 HP</span><span><b id="hptxt">25 / 25</b></span></div>
    <div class="hpbar"><i id="hpbar"></i></div>
  </div>

  <div class="track" id="track"></div>

  <div class="combo" id="combo">从手牌选一组<b style="color:var(--accent)">&nbsp;同色顺子&nbsp;</b>或<b style="color:var(--accent2)">&nbsp;同数刻子&nbsp;</b></div>

  <div class="rack" id="rack"></div>

  <div class="actions">
    <button class="b-play" id="play">出牌打怪</button>
    <button class="b-win" id="declare">胡牌 · 大招</button>
    <button class="b-disc" id="discard">弃选中 · 重抽</button>
  </div>

  <div class="hint">提示：顺子 ×3 · 刻子(3)×4 · 刻子(4)×6；整手胡牌总伤害再 ×3。</div>
  <div class="log" id="log">怪物每回合逼近 1 步，抵达「你」会反击。清光全部怪物即通关。</div>
  <div class="credit">本创意产物由 TRAE Work（Auto 模式）生成 · 生活娱乐赛道</div>
</div>

<div class="overlay hide" id="overlay"><div class="modal" id="modal"></div></div>

<script>
(function(){
  const COLORS=['red','black','blue','yellow'];
  const CNAME={red:'红',black:'黑',blue:'蓝',yellow:'黄'};
  const HAND_SIZE=14;
  const TRACK_LEN=5;

  const G={
    stage:1, gold:0, hp:25, maxhp:25,
    chipBonus:0,      // 火焰强化：每组 +筹码
    multMul:1,        // 暗影强化：倍率叠乘
    deck:[], hand:[], sel:new Set(), mobs:[], busy:false
  };

  // ---------- deck ----------
  function buildDeck(){
    const d=[];
    for(let copy=0;copy<2;copy++)
      for(const c of COLORS)
        for(let n=1;n<=13;n++) d.push({c,n});
    d.push({c:'joker',n:0,joker:true});
    d.push({c:'joker',n:0,joker:true});
    return shuffle(d);
  }
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
  function draw(n){
    const out=[];
    for(let i=0;i<n;i++){
      if(!G.deck.length) G.deck=buildDeck();
      out.push(G.deck.pop());
    }
    return out;
  }

  // ---------- stage setup ----------
  function spawnStage(){
    const s=G.stage;
    const count=Math.min(2+Math.floor(s/2),4);
    G.mobs=[];
    for(let i=0;i<count;i++){
      const elite=(s>=3 && i===count-1);
      const base=40+s*14+i*10;
      const hp=elite?Math.round(base*1.6):base;
      G.mobs.push({hp,max:hp, node:TRACK_LEN-i*( i? 0:0), elite, atk:6+Math.floor(s*1.2)+(elite?4:0)});
    }
    // stagger starting nodes so they don't stack
    G.mobs.forEach((m,i)=>{ m.node=Math.min(TRACK_LEN, TRACK_LEN-i); });
    refillHand();
  }
  function refillHand(){
    const need=HAND_SIZE-G.hand.length;
    if(need>0) G.hand.push(...draw(need));
  }

  // ---------- combos ----------
  function tileVal(t){ return t.joker?0:t.n; }
  function evaluate(tiles){
    if(tiles.length<3) return {ok:false,msg:'至少选 3 张牌。'};
    const jokers=tiles.filter(t=>t.joker).length;
    const real=tiles.filter(t=>!t.joker);
    if(real.length===0) return {ok:false,msg:'不能全是百搭。'};
    // 刻子: same number, distinct-ish colors, 3-4 tiles
    const sameNum=real.every(t=>t.n===real[0].n);
    if(sameNum && tiles.length<=4){
      const mult=tiles.length>=4?6:4;
      return finalize('刻子',mult,tiles,real[0].n*tiles.length);
    }
    // 顺子: same color, consecutive (jokers fill gaps)
    const sameColor=real.every(t=>t.c===real[0].c);
    if(sameColor){
      const nums=real.map(t=>t.n).sort((a,b)=>a-b);
      const span=nums[nums.length-1]-nums[0]+1;
      const distinct=new Set(nums).size===nums.length;
      if(distinct && span<=tiles.length && (span-real.length)<=jokers){
        // chips = sum of the full run span values
        let chips=0; const start=nums[0];
        for(let k=0;k<tiles.length;k++) chips+=(start+k<=13?start+k:0);
        return finalize('顺子',3,tiles,chips);
      }
    }
    return {ok:false,msg:'不是合法组合：顺子需同色连续，刻子需同数字。'};
  }
  function finalize(kind,mult,tiles,chips){
    chips+=G.chipBonus;
    const eff=mult*G.multMul;
    return {ok:true,kind,mult:eff,chips,dmg:Math.round(chips*eff),tiles};
  }

  // ---------- combat ----------
  function dealDamage(dmg){
    const live=G.mobs.filter(m=>m.hp>0).sort((a,b)=>a.node-b.node);
    let log=[];
    for(const m of live){
      if(dmg<=0)break;
      const hit=Math.min(dmg,m.hp); m.hp-=hit; dmg-=hit;
      log.push('击中'+(m.elite?'精英':'怪')+' -'+hit+(m.hp<=0?'（击杀'+(dmg>0?'，溢出':'')+'）':''));
    }
    return log;
  }
  function enemyTurn(){
    // advance
    G.mobs.forEach(m=>{ if(m.hp>0 && m.node>0) m.node--; });
    // attack if at node 0
    const adj=G.mobs.filter(m=>m.hp>0 && m.node===0);
    let dmg=adj.reduce((s,m)=>s+m.atk,0);
    if(dmg>0){ G.hp-=dmg; }
    return dmg;
  }

  function takeAction(actionFn){
    if(G.busy) return;
    const res=actionFn();
    if(!res || !res.ok){ setLog(res?res.msg:'无效操作', true); return; }
    G.busy=true;
    // remove played tiles
    res.played.forEach(t=>{ const i=G.hand.indexOf(t); if(i>=0)G.hand.splice(i,1); });
    G.sel.clear();
    const dlog=dealDamage(res.dmg);
    render();

    const cleared = G.mobs.every(m=>m.hp<=0);
    if(cleared){
      setLog(res.head+' '+dlog.join('；')+'。<b>本关清空！</b>');
      G.busy=false;
      setTimeout(winStage, 450);
      return;
    }
    refillHand();
    const counter=enemyTurn();
    let tail = counter>0 ? ' <span class="bad">怪物反击 -'+counter+' HP</span>' : ' 怪物推进 1 步。';
    setLog(res.head+' '+dlog.join('；')+'。'+tail);
    render();
    if(G.hp<=0){ setTimeout(gameOver, 350); return; }
    G.busy=false;
  }

  // ---------- action handlers ----------
  function selectedTiles(){ return [...G.sel].map(i=>G.hand[i]); }

  function actPlay(){
    const tiles=selectedTiles();
    const r=evaluate(tiles);
    if(!r.ok) return r;
    return {ok:true, dmg:r.dmg, played:tiles,
      head:'打出<b>'+r.kind+'</b>（'+r.chips+'×'+r.mult+'='+r.dmg+'）'};
  }
  function actDeclare(){
    // partition whole hand greedily into valid combos
    const pool=[...G.hand];
    const groups=[]; let total=0;
    let progress=true;
    const remaining=[...pool];
    // try to pull out runs/sets
    function tryPull(){
      // brute small: try sets first then runs of size 3-4
      for(let size=4;size>=3;size--){
        const combo=findCombo(remaining,size);
        if(combo) return combo;
      }
      return null;
    }
    while(true){
      const combo=tryPull();
      if(!combo) break;
      const r=evaluate(combo);
      if(!r.ok) break;
      groups.push(r); total+=r.dmg;
      combo.forEach(t=>{const i=remaining.indexOf(t); if(i>=0)remaining.splice(i,1);});
    }
    if(groups.length<2) return {ok:false,msg:'胡牌需整手拆成≥2 组合法组合，当前牌型不足。'};
    const dmg=Math.round(total*3);
    const played=G.hand.filter(t=>!remaining.includes(t));
    return {ok:true, dmg, played,
      head:'<b>胡牌大招</b>！'+groups.length+' 组共 '+total+' ×3 = '+dmg};
  }
  function findCombo(pool,size){
    // sets: same number
    const byNum={};
    pool.forEach(t=>{ if(!t.joker){(byNum[t.n]=byNum[t.n]||[]).push(t);} });
    for(const n in byNum){ if(byNum[n].length>=size) return byNum[n].slice(0,size); }
    // runs: same color consecutive
    const byCol={};
    pool.forEach(t=>{ if(!t.joker){(byCol[t.c]=byCol[t.c]||[]).push(t);} });
    for(const c in byCol){
      const nums=[...new Set(byCol[c].map(t=>t.n))].sort((a,b)=>a-b);
      for(let i=0;i+size<=nums.length+1 && i<nums.length;i++){
        let run=[nums[i]];
        for(let k=i+1;k<nums.length && run.length<size;k++){
          if(nums[k]===run[run.length-1]+1) run.push(nums[k]);
          else break;
        }
        if(run.length===size){
          return run.map(v=>byCol[c].find(t=>t.n===v));
        }
      }
    }
    return null;
  }
  function actDiscard(){
    const tiles=selectedTiles();
    if(tiles.length===0) return {ok:false,msg:'先选要弃掉的牌。'};
    tiles.forEach(t=>{const i=G.hand.indexOf(t); if(i>=0)G.hand.splice(i,1);});
    G.sel.clear();
    refillHand();
    const counter=enemyTurn();
    render();
    let msg='弃 '+tiles.length+' 张重抽。'+(counter>0?'<span class="bad">怪物反击 -'+counter+' HP</span>':'怪物推进 1 步。');
    setLog(msg);
    if(G.hp<=0) setTimeout(gameOver,300);
    return {ok:false,msg:null}; // handled internally; don't double-process
  }

  // ---------- stage flow ----------
  function winStage(){
    const reward=8+G.stage*3;
    G.gold+=reward;
    G.hp=Math.min(G.maxhp,G.hp+4);
    openShop(reward);
  }
  function gameOver(){
    showModal(
      '<h2>本局结束</h2>'+
      '<p>你坚持到了第 <b style="color:var(--accent)">'+G.stage+'</b> 关，累计 '+G.gold+' 金币。</p>'+
      '<button class="full" onclick="window.__restart()">再来一局</button>'
    );
  }
  function openShop(reward){
    const items=[
      {n:'🔥 火焰强化',d:'之后每组出牌 +6 筹码',cost:12,buy:()=>{G.chipBonus+=6;}},
      {n:'🌑 暗影强化',d:'之后所有倍率 ×1.5',cost:16,buy:()=>{G.multMul*=1.5;}},
      {n:'❤️ 生命药剂',d:'最大 HP +5 并回满',cost:10,buy:()=>{G.maxhp+=5;G.hp=G.maxhp;}},
    ];
    let html='<h2>第 '+G.stage+' 关通关！</h2>'+
      '<p>奖励 +'+reward+' 金币，回复 4 HP。当前金币 <b style="color:var(--gold)">'+G.gold+'</b></p><div class="shop">';
    items.forEach((it,i)=>{
      const afford=G.gold>=it.cost;
      html+='<div class="shopItem" '+(afford?'onclick="window.__buy('+i+')"':'style="opacity:.45"')+'>'+
        '<div><div class="n">'+it.n+'</div><div class="d">'+it.d+'</div></div>'+
        '<div class="c">'+it.cost+' 金</div></div>';
    });
    html+='</div><button class="full" onclick="window.__next()">进入第 '+(G.stage+1)+' 关 →</button>';
    window.__shopItems=items;
    showModal(html);
  }

  window.__buy=function(i){
    const it=window.__shopItems[i];
    if(G.gold<it.cost) return;
    G.gold-=it.cost; it.buy(); render();
    openShop(0); // refresh affordability (reward already given)
    // re-open keeps title; tweak: avoid double reward text
  };
  window.__next=function(){
    hideModal();
    G.stage++;
    G.hand=[]; // fresh hand next stage
    spawnStage();
    setLog('进入第 '+G.stage+' 关，新的怪物逼近！');
    render();
  };
  window.__restart=function(){
    hideModal();
    Object.assign(G,{stage:1,gold:0,hp:25,maxhp:25,chipBonus:0,multMul:1,deck:buildDeck(),hand:[],sel:new Set(),mobs:[],busy:false});
    spawnStage();
    setLog('新的奇旅开始，祝你好运！');
    render();
  };

  // ---------- render ----------
  function render(){
    document.getElementById('stage').textContent=G.stage;
    document.getElementById('gold').textContent=G.gold;
    document.getElementById('hptxt').textContent=Math.max(0,G.hp)+' / '+G.maxhp;
    document.getElementById('hpbar').style.width=Math.max(0,G.hp/G.maxhp*100)+'%';

    // track: nodes TRACK_LEN..1, then YOU(0)
    const t=document.getElementById('track'); t.innerHTML='';
    for(let node=TRACK_LEN;node>=0;node--){
      const cell=document.createElement('div'); cell.className='cell';
      const m=G.mobs.find(x=>x.hp>0 && x.node===node);
      if(node===0){
        const y=document.createElement('div'); y.className='node you'; y.textContent='🧙';
        cell.appendChild(y);
        const l=document.createElement('div'); l.className='mlabel'; l.textContent='你'; cell.appendChild(l);
      } else if(m){
        const d=document.createElement('div'); d.className='mob'+(m.elite?' elite':'');
        d.innerHTML='<div class="face">'+(m.elite?'👹':'👾')+'</div><div class="hp">'+m.hp+'</div>';
        cell.appendChild(d);
        const l=document.createElement('div'); l.className='mlabel'; l.textContent='⚔'+m.atk; cell.appendChild(l);
      } else {
        const d=document.createElement('div'); d.className='node'; d.textContent=node;
        cell.appendChild(d);
        const l=document.createElement('div'); l.className='mlabel'; l.textContent=' '; cell.appendChild(l);
      }
      t.appendChild(cell);
    }

    // rack
    const rack=document.getElementById('rack'); rack.innerHTML='';
    G.hand.forEach((tile,i)=>{
      const d=document.createElement('div');
      d.className='tile '+(tile.joker?'joker':tile.c)+(G.sel.has(i)?' sel':'');
      d.textContent=tile.joker?'★':tile.n;
      d.onclick=()=>{ if(G.busy)return; G.sel.has(i)?G.sel.delete(i):G.sel.add(i); render(); };
      rack.appendChild(d);
    });

    // live combo preview
    const c=document.getElementById('combo');
    const tiles=selectedTiles();
    if(tiles.length>=3){
      const r=evaluate(tiles);
      if(r.ok) c.innerHTML='<b>'+r.kind+'</b> · 筹码 <span class="chips">'+r.chips+'</span> × 倍率 <span class="mult">'+r.mult+'</span> = <span class="dmg">'+r.dmg+'</span> 伤害';
      else c.innerHTML='<span style="color:var(--danger)">'+r.msg+'</span>';
    } else {
      c.innerHTML='从手牌选一组<b style="color:var(--accent)">&nbsp;同色顺子&nbsp;</b>或<b style="color:var(--accent2)">&nbsp;同数刻子&nbsp;</b>';
    }
  }
  function setLog(html,bad){ const l=document.getElementById('log'); l.innerHTML=html; }

  function showModal(html){ document.getElementById('modal').innerHTML=html; document.getElementById('overlay').classList.remove('hide'); }
  function hideModal(){ document.getElementById('overlay').classList.add('hide'); }

  // ---------- bind ----------
  document.getElementById('play').onclick=()=>takeAction(actPlay);
  document.getElementById('declare').onclick=()=>takeAction(actDeclare);
  document.getElementById('discard').onclick=()=>takeAction(actDiscard);

  // boot
  G.deck=buildDeck();
  spawnStage();
  render();
})();
</script>
