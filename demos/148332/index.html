<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍃 我的小森林 — 首页</title>
  <meta name="description" content="我的小森林 — 一个清新自然的个人生活记录网站，记录日记、照片、学习打卡、心情和成长。">
  <meta property="og:title" content="🍃 我的小森林 — 首页">
  <meta property="og:description" content="用文字和影像记录生活的温柔时光">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#38a169">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 静态导航栏 -->
  <header class="site-header"><nav class="nav-inner"></nav></header>

  <main class="container">

    <!-- ======== 个人区域 ======== -->
    <section class="hero">
      <img class="hero-avatar" id="heroAvatar"
           src="https://picsum.photos/seed/my-avatar/300/300"
           alt="头像">
      <h1 id="heroName">你好，我是小林 🌱</h1>
      <p class="tagline" id="heroBio">用文字和影像记录生活的温柔时光</p>
      <div class="quote-box" id="homeQuote">「生活明朗，万物可爱。」</div>
    </section>

    <!-- ======== 实时卡片 ======== -->
    <div class="home-cards" id="homeCards">
      <div class="home-card">
        <span class="home-card-emoji" id="homeMood">—</span>
        <span class="home-card-label">今日心情</span>
      </div>
      <div class="home-card">
        <span class="home-card-number" id="homeStudy">0</span>
        <span class="home-card-label">本周学习(分)</span>
      </div>
      <div class="home-card">
        <span class="home-card-number" id="homeGoals">0</span>
        <span class="home-card-label">进行中目标</span>
      </div>
      <div class="home-card">
        <span class="home-card-number" id="homePhotos">0</span>
        <span class="home-card-label">张照片</span>
      </div>
    </div>

    <!-- ======== 最新心情 ======== -->
    <section id="homeMoodSection" style="display:none;">
      <h2 class="section-title">💭 最新心情</h2>
      <div class="home-mood-preview" id="homeMoodPreview"></div>
    </section>

    <!-- ======== 最新文章 ======== -->
    <section>
      <h2 class="section-title">📝 最新文章</h2>
      <div class="post-grid" id="latestPosts">
        <p class="loading">正在加载</p>
      </div>
      <div style="text-align:center;">
        <a href="blog.html" class="btn-more">查看更多 →</a>
      </div>
    </section>

  </main>

  <!-- 静态页脚 -->
  <footer class="site-footer">
    <div class="footer-deco">🍃 🌿 🌱</div>
    <p>用文字和影像记录生活的温柔时光</p>
    <p style="margin-top:6px;font-size:0.82rem;">© 2026 🍃 我的小森林 · 用心生活</p>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/pages/home.js"></script>
  <script>
  (async function() {
    const L = window.Liger;

    // 并行加载数据
    const [profile, moods, photos, goals, study] = await Promise.all([
      L.loadProfile().catch(() => ({})),
      L.loadMoods().catch(() => []),
      L.loadPhotos().catch(() => []),
      L.loadGoals().catch(() => []),
      L.loadStudy().catch(() => [])
    ]);

    if (profile.name) {
      document.getElementById('heroName').textContent = `你好，我是${L.escapeHTML(profile.name)} 🌱`;
    }
    if (profile.avatar) {
      document.getElementById('heroAvatar').src = profile.avatar;
    }
    if (profile.bio) {
      document.getElementById('heroBio').textContent = profile.bio.split('\n')[0];
    }

    // 今日心情
    const today = new Date().toISOString().slice(0, 10);
    const todayMood = moods.find(m => m.date === today);
    document.getElementById('homeMood').textContent = todayMood ? todayMood.emoji : '—';

    // 本周学习
    const dayOfWeek = new Date().getDay() || 7;
    const monday = new Date();
    monday.setDate(new Date().getDate() - dayOfWeek + 1);
    monday.setHours(0,0,0,0);
    const weekMin = study.filter(r => new Date(r.date) >= monday).reduce((s,r) => s + (r.duration||0), 0);
    document.getElementById('homeStudy').textContent = weekMin;

    // 目标数
    document.getElementById('homeGoals').textContent = goals.length;
    document.getElementById('homePhotos').textContent = photos.length;

    // 最新心情
    if (moods.length > 0) {
      const latest = moods[0];
      document.getElementById('homeMoodSection').style.display = '';
      document.getElementById('homeMoodPreview').innerHTML = `
        <div class="mood-item">
          <span class="mood-emoji">${latest.emoji}</span>
          <div class="mood-body">
            <p class="mood-text">${L.escapeHTML(latest.text)}</p>
            <span class="mood-time">${L.escapeHTML(latest.date)} ${L.escapeHTML(latest.time)}</span>
          </div>
        </div>
      `;
    }
  })();
  </script>
</body>
</html>
