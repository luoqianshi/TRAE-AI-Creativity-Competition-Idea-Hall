迹","考古发现"]},{id:"4",name:"长城",image:"https://picsum.photos/id/1035/800/400",location:"北京市延庆区G6京藏高速58号出口",description:'长城，又称万里长城，是中国古代的军事防御工程，是一道高大、坚固而连绵不断的长垣，用以限隔敌骑的行动。长城修筑的历史可上溯到西周时期，发生在首都镐京（今陕西西安）的著名的典故"烽火戏诸侯"就源于此。',culture:"长城是中华民族的象征，是世界文化遗产中的瑰宝。它见证了中国两千多年的历史变迁，承载了无数英雄儿女的热血与豪情。长城不仅是军事防御工程，更是中国古代建筑技术的杰出代表，体现了中华民族的智慧和毅力。",story:"孟姜女哭长城的故事是中国民间流传最广的传说之一。相传秦朝时期，孟姜女的丈夫范喜良被征召去修建长城，多年杳无音信。孟姜女千里寻夫，来到长城脚下，却得知丈夫早已累死并被埋在长城之下。悲痛欲绝的孟姜女在长城下痛哭了三天三夜，哭声震天动地，竟然哭倒了长城八百里。这个故事表达了人们对封建暴政的控诉和对真挚爱情的赞美。",openTime:"07:30 - 17:30",ticketPrice:"40元",tags:["世界遗产","历史古迹","壮丽景观"]},{id:"5",name:"九寨沟",image:"https://picsum.photos/id/1025/800/400",location:"四川省阿坝藏族羌族自治州九寨沟县",description:"九寨沟位于四川省阿坝藏族羌族自治州九寨沟县境内，地处青藏高原、川西高原、山地向四川盆地过渡地带，南距成都市300多公里，是一条纵深50余千米的山沟谷地，总面积64297公顷，森林覆盖率超过80%。",culture:"九寨沟是藏族和羌族文化的交汇地，这里的民俗风情独具特色。藏族的锅庄舞、羌族的羊皮鼓舞，都展现了少数民族的热情与豪迈。九寨沟的自然景观与人文景观完美融合，成为了中国最美的自然保护区之一。",story:"九寨沟有着一个美丽的传说。相传在很久以前，九寨沟是一个干旱缺水的地方。一位美丽的仙女路过此地，看到当地百姓生活困苦，心生怜悯，便将自己身上的翡翠项链撒向大地。项链化作了一个个五彩斑斓的湖泊，从此九寨沟变得美丽富饶。这个传说为九寨沟增添了神秘的色彩，也让人们更加珍惜这片神奇的土地。",openTime:"08:00 - 17:00",ticketPrice:"280元",tags:["自然风光","生态保护","人间仙境"]},{id:"6",name:"丽江古城",image:"https://picsum.photos/id/1059/800/400",location:"云南省丽江市古城区",description:"丽江古城位于云南省丽江市古城区，又名大研镇，坐落在丽江坝中部，始建于宋末元初（公元13世纪后期），地处云贵高原，面积为7.279平方公里。丽江古城内的街道依山傍水修建，以红色角砾岩铺就，有四方街、木府、五凤楼等景点。",culture:"丽江古城是纳西族文化的重要载体，这里保存了大量的明清建筑和纳西族传统民居。纳西族的东巴文化、音乐舞蹈都在这里得到了很好的传承。古城的建筑风格独特，融合了汉、藏、白等多个民族的建筑特色，形成了别具一格的风貌。",story:"丽江古城有着一个浪漫的传说。相传在很久以前，丽江是一片汪洋大海。有一天，一位勇敢的纳西族青年为了拯救被困的百姓，挺身而出，用自己的身躯堵住了海水的出口。海水退去后，青年化作了一座山峰，守护着这片土地。人们为了纪念他，便在山脚下建起了这座美丽的古城。",openTime:"全天开放",ticketPrice:"80元",tags:["历史名城","民族风情","文化遗产"]}],Vc=[{id:"all",name:"全部",icon:"compass"},{id:"history",name:"历史古迹",icon:"landmark"},{id:"nature",name:"自然风光",icon:"tree-pine"},{id:"culture",name:"文化体验",icon:"book-open"},{id:"city",name:"城市观光",icon:"building-2"}];function Wc({onAttractionClick:F}){const[N,h]=Ue.useState(""),[R,z]=Ue.useState("all"),[L,j]=Ue.useState("北京市"),W=Zp.filter(M=>{const V=M.name.toLowerCase().includes(N.toLowe
