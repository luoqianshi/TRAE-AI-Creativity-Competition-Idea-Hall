@keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(600px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes walk{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}

<body>
<div id="app">

<!-- ===== SPLASH ===== -->
<div id="page-splash" class="page splash-page active">
  <div class="sky-sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="mountains">
    <svg viewBox="0 0 480 200" preserveAspectRatio="none">
      <path d="M0,200 L0,80 Q80,20 160,80 T320,60 T480,90 L480,200 Z" fill="#7A8E7A" opacity=".6"/>
      <path d="M0,200 L0,120 Q100,70 200,120 T400,100 T480,140 L480,200 Z" fill="#6B7D6B" opacity=".8"/>
      <path d="M0,200 L0,150 Q120,120 240,150 T480,160 L480,200 Z" fill="#5A6B5A" opacity=".9"/>
    </svg>
  </div>
  <div class="hero-stage">
    <div class="hero-fig" id="hero-fig"></div>
  </div>
  <div class="scroll-panel">
    <div class="logo">职业溯源探险队</div>
    <div class="sub">穿越千年职场，找到你的天赋方向</div>
    <div class="difficulty">
      <div class="diff-btn" data-age="elementary" onclick="selectAge('elementary',this)">小学段<br><span style="font-size:.7rem;font-weight:400">10-12岁</span></div>
      <div class="diff-btn sel" data-age="junior" onclick="selectAge('junior',this)">初中段<br><span style="font-size:.7rem;font-weight:400">13-16岁</span></div>
    </div>
    <button class="btn btn-primary start-btn" onclick="startAdventure()">🚀 开始探险</button>
    <div class="privacy">趣味体验仅供参考，数据仅保存在本地</div>
  </div>
</div>

<!-- ===== MAP ===== -->
<div id="page-map" class="page map-page">
  <div class="map-hud">
    <div class="title">探险路线图</div>
    <div class="progress-pill">徽章 <strong id="stat-badges">0</strong>/4 · 进度 <strong id="stat-progress">0</strong>%</div>
  </div>
  <div class="map-world" id="map-world"></div>
  <div class="traveler" id="traveler"></div>
  <div class="map-tip">← 左右滑动选择关卡 →</div>
</div>

<!-- ===== SCENE ===== -->
<div id="page-scene" class="page scene-page">
  <div class="scene-hud">
    <button class="hud-back" onclick="returnToMap()">←</button>
    <div class="hud-title">
      <div class="name" id="scene-name">产品经理</div>
      <div class="step" id="scene-step">第 1 / 5 站</div>
    </div>
    <div class="hud-dots" id="hud-dots"></div>
  </div>
  <div class="scene-viewport" id="scene-viewport" onclick="tapScene()">
    <div class="scene-bg" id="scene-bg"></div>
    <div class="scene-actor" id="scene-actor"></div>
    <div class="scene-badge" id="scene-badge">谋士</div>
  </div>
  <div class="dialogue-panel" id="dialogue-panel"></div>
</div>

<!-- ===== REPORT ===== -->
<div id="page-report" class="page report-page">
  <div class="report-scroll" id="report-scroll"></div>
</div>

<!-- ===== POSTER ===== -->
<div class="poster-overlay" id="poster-overlay">
  <button class="poster-close" onclick="closePoster()">✕</button>
  <canvas id="poster-canvas" width="750" height="1200"></canvas>
</div>

</div>

<script>
// ============================================================
// GAME DATA

var state={ageGroup:'junior',completedCareers:[],unlockedCareers:[0],riasecScores:{R:0,I:0,A:0,S:0,E:0,C:0},mbtiScores:{E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0},visited:false,currentCareer:0,currentSection:1,typing:false,dialogueQueue:[]};
function loadState(){try{var s=localStorage.getItem('guwen_state');if(s){var l=JSON.parse(s);state.ageGroup=l.ageGroup||'junior';state.completedCareers=l.completedCareers||[];state.unlockedCareers=l.unlockedCareers||[0];state.riasecScores=l.riasecScores||{R:0,I:0,A:0,S:0,E:0,C:0};state.mbtiScores=l.mbtiScores||{E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};state.visited=l.visited||false;}}catch(e){}}
function saveState(){try{localStorage.setItem('guwen_state',JSON.stringify({ageGroup:state.ageGroup,completedCareers:state.completedCareers,unlockedCareers:state.unlockedCareers,riasecScores:state.riasecScores,mbtiScores:state.mbtiScores,visited:state.visited}));}catch(e){}}
function resetState(){state.ageGroup='junior';state.completedCareers=[];state.unlockedCareers=[0];state.riasecScores={R:0,I:0,A:0,S:0,E:0,C:0};state.mbtiScores={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};state.visited=false;try{localStorage.removeItem('guwen_state');}catch(e){}}
function recordAnswer(r,m){if(state.riasecScores[r]!==undefined)state.riasecScores[r]++;if(state.mbtiScores[m]!==undefined)state.mbtiScores[m]++;}
function unlockCareer(idx){if(state.completedCareers.indexOf(idx)===-1)state.completedCareers.push(idx);var n=idx+1;if(n<4&&state.unlockedCareers.indexOf(n)===-1)state.unlockedCareers.push(n);saveState();}

function calcMBTI(){var s=state.mbtiScores;var r='';r+=s.E>s.I?'E':(s.I>s.E?'I':'X');r+=s.S>s.N?'S':(s.N>s.S?'N':'X');r+=s.T>s.F?'T':(s.F>s.T?'F':'X');r+=s.J>s.P?'J':(s.P>s.J?'P':'X');return r;}
function calcRIASEC(){var arr=[];for(var k in state.riasecScores)arr.push({key:k,val:state.riasecScores[k]});arr.sort(function(a,b){return b.val-a.val;});return arr;}
function calcTopRIASEC(){return calcRIASEC()[0].key;}
function calcDominantTF(){return state.mbtiScores.T>=state.mbtiScores.F?'T':'F';}

function showPage(pid){var ps=document.querySelectorAll('.page');for(var i=0;i<ps.length;i++)ps[i].classList.remove('active');var t=document.getElementById('page-'+pid);if(t){t.classList.add('active');t.scrollTop=0;window.scrollTo(0,0);}}

function selectAge(age,el){state.ageGroup=age;var opts=document.querySelectorAll('.diff-btn');for(var i=0;i<opts.length;i++)opts[i].classList.remove('sel');el.classList.add('sel');}
function startAdventure(){state.visited=true;saveState();showPage('map');renderMap();}
document.getElementById('hero-fig').innerHTML=heroSVG;

// ============================================================
// MAP
// ============================================================
function renderMap(){
  var completed=state.completedCareers.length;
  document.getElementById('stat-badges').textContent=completed;
  document.getElementById('stat-progress').textContent=Math.round(completed/4*100);
  var html='';
  for(var i=0;i<gameData.careers.length;i++){
    var c=gameData.careers[i];
    var unlocked=state.unlockedCareers.indexOf(i)!==-1;
    var done=state.completedCareers.indexOf(i)!==-1;
    html+='<div class="map-stop">';
    html+='<div class="terrain">'+terrainSVG+'</div>';
    html+='<div class="stop-avatar">'+charAvatar(c.id)+(done?'<div class="avatar-badge">已获得</div>':'')+'</div>';
    html+='<div class="stop-sign '+(unlocked?'':'locked')+'" '+(unlocked?'onclick="enterCareer('+i+')"':'')+'>';
    html+='<div class="num">0'+(i+1)+'</div>';
    html+='<div class="name">'+c.modernName+'</div>';
    html+='<div class="ancient">'+c.ancientName+'</div>';
    html+='<div class="tags">';
    var tags=c.personalityTag.split(' · ');
    for(var j=0;j<tags.length;j++)html+='<span class="tag">'+tags[j]+'</span>';
    html+='</div></div></div>';
  }
  document.getElementById('map-world').innerHTML=html;
  positionTraveler();
}
function charAvatar(id){switch(id){case'product-manager':return charSVGs.advisor;case'doctor':return charSVGs.doctor;case'engineer':return charSVGs.craftsman;case'analyst':return charSVGs.mathematician;}return'';}
function positionTraveler(){
  var traveler=document.getElementById('traveler');
  var idx=0;
  for(var i=0;i<4;i++)if(state.unlockedCareers.indexOf(i)!==-1)idx=i;
  var left=12+idx*82;
  if(left>300)left=300;
  traveler.style.left=left+'vw';
}
function enterCareer(idx){var t=document.getElementById('traveler');t.classList.add('walking');var target=12+idx*82;if(target>300)target=300;t.style.left=target+'vw';setTimeout(function(){t.classList.remove('walking');startCareer(idx);},800);}

// ============================================================
// SCENE GAME
// ============================================================
function startCareer(idx){state.currentCareer=idx;state.currentSection=1;showPage('scene');renderScene();}
function returnToMap(){if(state.completedCareers.length>=4){showPage('report');renderReport();}else{showPage('map');renderMap();}}

function renderScene(){
  var c=gameData.careers[state.currentCareer];
  document.getElementById('scene-name').textContent=c.modernName;
  document.getElementById('scene-step').textContent='第 '+state.currentSection+' / 5 站';
  document.getElementById('scene-bg').innerHTML=sceneSVGs[c.id];
  document.getElementById('scene-actor').innerHTML=charAvatar(c.id);
  document.getElementById('scene-badge').textContent=c.ancientName;
  renderDots();
  renderDialogue();
}
function renderDots(){
  var html='';
  for(var i=1;i<=5;i++)html+='<div class="hud-dot '+(i<=state.currentSection?'on':'')+'"></div>';
  document.getElementById('hud-dots').innerHTML=html;
}

function renderDialogue(){
  var c=gameData.careers[state.currentCareer];
  var panel=document.getElementById('dialogue-panel');
  var text='';
  if(state.currentSection===5){
    panel.innerHTML='<div class="complete-panel"><div class="trophy">🏅</div><div class="earned-badge">'+c.ancientName+'徽章 获得！</div><h2>「'+c.modernName+'」探索完成</h2><p>你的选择很有智慧！这个世界正期待你这样独特的探索者。</p><button class="btn btn-primary" onclick="finishCareer()">返回地图，继续探险 →</button></div>';
    return;
  }
  switch(state.currentSection){
    case 1:text=c.ancientIntro.desc;break;
    case 2:text='"技术工具一直在变，但核心能力与性格底色从未改变。"';break;
    case 3:text='同样的职业，古代和现代有什么不一样？';break;
    case 4:text='这里有一本古代「职业教科书」，里面藏着这个职业的智慧密码。';break;
  }
  var html=speaker(speakerName(state.currentSection,c),speakerRole(state.currentSection),speakerEmoji(state.currentSection,c));
  html+='<div class="dialogue-text" id="dialogue-text"><span class="cursor"></span></div>';
  html+='<div class="dialogue-continue" id="dialogue-continue">点击任意处继续 →</div>';
  panel.innerHTML=html;
  typeText(text);
}
function speakerName(sec,c){if(sec===1)return'古代'+c.ancientName;if(sec===2)return'历史长河';if(sec===3)return'古今对比台';return'古籍守护人';}
function speakerRole(sec){if(sec===1)return'职业向导';if(sec===2)return'时间守护者';if(sec===3)return'探秘员';return'文化向导';}
function speakerEmoji(sec,c){if(sec===1)return c.emoji;if(sec===2)return'🕰';if(sec===3)return'⚖';return'📜';}
function speaker(name,role,emoji){return '<div class="dialogue-speaker"><div class="d-avatar">'+emoji+'</div><div><div class="d-name">'+name+'</div><div class="d-role">'+role+'</div></div></div>';}
function typeText(text){state.typing=true;var el=document.getElementById('dialogue-text');var cursor=el.querySelector('.cursor');var i=0;el.textContent='';el.appendChild(cursor);var timer=setInterval(function(){if(i>=text.length){clearInterval(timer);state.typing=false;document.getElementById('dialogue-continue').style.opacity='1';return;}el.insertBefore(document.createTextNode(text.charAt(i)),cursor);i++;},28);}
function tapScene(){if(state.typing||state.currentSection===5)return;if(state.currentSection===4){showQuestion(gameData.careers[state.currentCareer]);return;}state.currentSection++;renderScene();}

function showQuestion(c){
  var panel=document.getElementById('dialogue-panel');
  var html=speaker('情境挑战','命运分支','❓');
  html+='<div class="dialogue-text" style="min-height:auto">'+c.question.scenario+'</div>';
  html+='<div class="choice-list">';
  var letters=['A','B','C'];
  for(var i=0;i<c.question.options.length;i++){
    var o=c.question.options[i];
    html+='<div class="choice-card" onclick="chooseOption(this,\''+o.riasec+'\',\''+o.mbti+'\')">';
    html+='<div class="letter">'+letters[i]+'</div><div>'+o.text+'</div></div>';
  }
  html+='</div><div id="quiz-feedback" class="feedback-pop" style="display:none"></div>';
  html+='<div style="text-align:center;margin-top:.8rem"><button class="btn btn-primary" id="btn-finish" style="display:none" onclick="completeCareer()">完成探索，获得徽章 →</button></div>';
  panel.innerHTML=html;
}
function chooseOption(el,r,m){var opts=document.querySelectorAll('.choice-card');for(var i=0;i<opts.length;i++){opts[i].classList.add('disabled');opts[i].style.pointerEvents='none';if(opts[i]===el)opts[i].classList.add('sel');}recordAnswer(r,m);var c=gameData.careers[state.currentCareer];var key=r+'_'+m;var fb=quizFeedbacks[c.id]&&quizFeedbacks[c.id][key]?quizFeedbacks[c.id][key]:'很棒的选择！继续探索吧！';var f=document.getElementById('quiz-feedback');f.textContent=fb;f.style.display='block';document.getElementById('btn-finish').style.display='inline-flex';saveState();}
function completeCareer(){state.currentSection=5;renderScene();unlockCareer(state.currentCareer);}
function finishCareer(){returnToMap();}

// ============================================================
// REPORT
// ============================================================
function renderReport(){
  var mbti=calcMBTI();var topR=calcTopRIASEC();var domTF=calcDominantTF();
  var info=mbtiNames[mbti]||{name:'独特探索者',tag:'你有自己独特的性格魅力'};
  var rDesc=gameData.riasecDesc[topR];
  var matchKey=topR+'_'+domTF;
  var match=matchLibrary[matchKey];
  if(!match){for(var k in matchLibrary){if(k.indexOf(topR)===0){match=matchLibrary[k];break;}}}
  if(!match)match=matchLibrary['I_T'];

  var html='<div class="report-title">探险成就卷轴</div>';
  html+='<div class="identity-box">';
  html+='<div class="type-main">'+info.name+' '+mbti.replace(/X/g,'')+'</div>';
  html+='<div class="type-sub">'+info.tag+'</div>';
  html+='<div class="type-interest">主导职业兴趣：'+rDesc+'</div>';
  html+='</div>';

  html+='<h3 style="font-family:var(--serif);font-size:1rem;text-align:center;margin:1rem 0">已收集职业徽章</h3>';
  html+='<div class="badge-show">';
  for(var i=0;i<4;i++){var done=state.completedCareers.indexOf(i)!==-1;var c=gameData.careers[i];html+='<div class="bd '+(done?'':'locked')+'">'+(done?c.emoji:'🔒')+'</div>';}
  html+='</div>';

  html+='<h3 style="font-family:var(--serif);font-size:1rem;text-align:center;margin:1.2rem 0 .6rem">性格能力图谱</h3>';
  html+='<div class="dim-bars">';
  var dims=[{k:'EI',l:'能量',a:'E'},{k:'SN',l:'信息',a:'S'},{k:'TF',l:'决策',a:'T'},{k:'JP',l:'风格',a:'J'}];
  var icons={'E':'🗣','I':'🧘','S':'🔍','N':'💡','T':'⚖','F':'❤','J':'📋','P':'🌊'};
  for(var d=0;d<dims.length;d++){
    var dim=gameData.mbtiDimensions[dims[d].k];
    var s1=state.mbtiScores[dims[d].k[0]];var s2=state.mbtiScores[dims[d].k[1]];
    var total=s1+s2||1;var dominant=s1>s2?dims[d].k[0]:(s2>s1?dims[d].k[1]:dims[d].k[0]);
    var pct=Math.round((state.mbtiScores[dominant]/total)*100);
    var di=dim[dominant];
    html+='<div class="dim-row"><div class="label">'+icons[dominant]+' '+di.name.replace(/型$/,'')+'</div><div class="bar"><div class="fill '+(d%2?'alt':'')+'" style="width:'+pct+'%"></div></div></div>';
  }
  html+='</div>';

  html+='<h3 style="font-family:var(--serif);font-size:1rem;text-align:center;margin:1.2rem 0 .6rem">现代职业推荐</h3>';
  html+='<div class="rec-list">';
  for(var j=0;j<match.careers.length;j++){
    var cr=match.careers[j];var cm=careerMatchReasons[cr]||{tip:'多了解这个领域'};
    html+='<div class="rec-card"><div class="rank">'+(j+1)+'</div><div class="info"><div class="rt">'+cr+'</div><div class="rd">'+(j===0?'最匹配你的性格和兴趣组合':(j===1?'也非常适合你的特质':'可以作为备选方向了解'))+'</div><div class="tip">💡 '+cm.tip+'</div></div></div>';
  }
  html+='</div>';

  var topJob=match.careers[0];var aj=ancientJobMap[topJob];
  html+='<div class="ancient-card"><div class="ar-title">穿越古代身份</div><div class="ar-job">你最适合做「'+aj.job+'」</div><div class="ar-desc">'+aj.reason+'</div></div>';

  html+='<h3 style="font-family:var(--serif);font-size:1rem;text-align:center;margin:1rem 0 .6rem">古籍拓展书单</h3>';
  var mbtiChars=mbti.replace(/X/g,'').split('');var books=[];
  for(var b=0;b<mbtiChars.length;b++){var br=bookRecs[mbtiChars[b]]||[];for(var r=0;r<br.length;r++)if(books.indexOf(br[r])===-1)books.push(br[r]);}
  books=books.slice(0,3);
  html+='<div class="book-list">';
  for(var bk=0;bk<books.length;bk++){html+='<div class="book-chip"><div class="bm">📖</div><div class="bt"><strong>'+books[bk]+'</strong><br>'+bookDescs[books[bk]]+'</div></div>';}
  html+='</div>';

  html+='<div class="report-actions"><button class="btn btn-primary" onclick="generatePoster()">生成分享海报</button><button class="btn btn-outline" onclick="confirmReset()">重新探险</button></div>';
  document.getElementById('report-scroll').innerHTML=html;
}
function confirmReset(){if(confirm('确定要重新开始探险吗？当前进度和报告数据将被清除。')){resetState();showPage('splash');document.querySelector('.diff-btn[data-age="junior"]').classList.add('sel');document.querySelector('.diff-btn[data-age="elementary"]').classList.remove('sel');}}

// ============================================================
// POSTER
// ============================================================
function generatePoster(){
  document.getElementById('poster-overlay').classList.add('active');
  var cv=document.getElementById('poster-canvas');var ctx=cv.getContext('2d');var w=cv.width,h=cv.height;
  ctx.fillStyle='#FFF8F0';ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#C83C23';ctx.lineWidth=6;ctx.strokeRect(30,30,w-60,h-60);
  ctx.strokeStyle='#D4A853';ctx.lineWidth=3;ctx.strokeRect(48,48,w-96,h-96);
  ctx.fillStyle='#C83C23';ctx.font='bold 54px "Noto Serif SC","PingFang SC",serif';ctx.textAlign='center';
  ctx.fillText('我的职业探险报告',w/2,120);
  var mbti=calcMBTI().replace(/X/g,'');var info=mbtiNames[calcMBTI()]||mbtiNames['INTP'];
  ctx.fillStyle='#2C2C2C';ctx.font='bold 46px "Noto Serif SC","PingFang SC",serif';
  ctx.fillText(info.name+' '+mbti,w/2,215);
  ctx.fillStyle='#666';ctx.font='26px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(info.tag,w/2,265);
  var topR=calcTopRIASEC();var matchKey=topR+'_'+calcDominantTF();var match=matchLibrary[matchKey];
  if(!match){for(var k in matchLibrary){if(k.indexOf(topR)===0){match=matchLibrary[k];break;}}}
  if(!match)match=matchLibrary['I_T'];
  var topCareer=match.careers[0];
  ctx.fillStyle='#C83C23';ctx.font='bold 34px "Noto Serif SC","PingFang SC",serif';
  ctx.fillText('TOP1 匹配职业',w/2,370);
  ctx.fillStyle='#2C2C2C';ctx.font='bold 56px "Noto Serif SC","PingFang SC",serif';
  ctx.fillText(topCareer,w/2,445);
  var aj=ancientJobMap[topCareer];
  ctx.fillStyle='#C83C23';ctx.font='bold 34px "Noto Serif SC","PingFang SC",serif';
  ctx.fillText('穿越回古代：'+aj.job,w/2,555);
  ctx.fillStyle='#3E8865';ctx.font='italic 30px "Noto Serif SC","PingFang SC",serif';
  ctx.fillText('穿越千年职场，找到你的天赋方向',w/2,665);
  ctx.strokeStyle='#D4A853';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(150,735);ctx.lineTo(w-150,735);ctx.stroke();
  ctx.fillStyle='#666';ctx.font='26px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('古籍职业启蒙读本 · 职业溯源探险队',w/2,815);
  ctx.fillStyle='#999';ctx.font='20px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('长按或右键保存图片',w/2,875);
}
function closePoster(){document.getElementById('poster-overlay').classList.remove('active');}

// ============================================================
// INIT
// ============================================================
loadState();
if(state.visited){renderMap();showPage('map');}else{showPage('splash');}
</script>
