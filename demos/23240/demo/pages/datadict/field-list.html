<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字段管理 - 数据标准</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        /* 超长文本省略号样式，鼠标悬停通过 title 属性显示完整内容 */
        .col-name {
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .col-code {
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .col-category {
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        /* 码值列链接颜色 */
        .col-codevalue {
            color: var(--primary);
        }
        .col-codevalue a {
            color: var(--primary);
            margin-left: 4px;
            cursor: pointer;
            text-decoration: none;
        }
        .col-codevalue a:hover {
            text-decoration: underline;
        }
        .col-codevalue .dash {
            color: var(--text-secondary, #999);
        }
    </style>
<script src="../../js/nav-helper.js"></script>
</head>
<body>

<div class="page-wrapper">

    <!-- ====== 页面标题区（根据 mode=readonly 切换为只读模式） ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2 id="pageTitle"><i class="fa fa-th-list" style="color:var(--primary);margin-right:8px"></i>字段管理</h2>
            <div class="page-desc" id="pageDesc">
                全行字段清单与码值管理 · 累计标准字段：1,286
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default"><i class="fa fa-refresh"></i> 刷新</button>
            <button class="btn btn-default"><i class="fa fa-download"></i> 导出</button>
            <button class="btn btn-primary" id="btnAddField"><i class="fa fa-plus-circle"></i> 新增字段</button>
        </div>
    </div>

    <!-- ====== 筛选操作区 ====== -->
    <div class="filter-bar">
        <div class="form-row">
            <div class="form-item">
                <label>字段名称</label>
                <input type="text" class="form-control" placeholder="请输入字段名称">
            </div>
            <div class="form-item">
                <label>字段类型</label>
                <select class="form-control">
                    <option>全部</option>
                    <option>VARCHAR</option>
                    <option>CHAR</option>
                    <option>DECIMAL</option>
                    <option>INTEGER</option>
                    <option>DATE</option>
                    <option>TIME</option>
                </select>
            </div>
            <div class="form-item">
                <label>码值</label>
                <select class="form-control">
                    <option>全部</option>
                    <option>有码值</option>
                    <option>无码值</option>
                </select>
            </div>
            <div class="form-item">
                <label>所属分类</label>
                <select class="form-control">
                    <option>全部</option>
                    <option>基础数据类</option>
                    <option>业务数据类</option>
                    <option>交易数据类</option>
                    <option>文件数据类</option>
                    <option>字典枚举类</option>
                </select>
            </div>
            <div class="form-item">
                <label>来源</label>
                <select class="form-control">
                    <option>全部</option>
                    <option>国家标准</option>
                    <option>行业标准</option>
                    <option>人行标准</option>
                    <option>行内标准</option>
                    <option>业务部门</option>
                    <option>继承字段</option>
                    <option>自定义</option>
                </select>
            </div>
            <div class="form-item">
                <label>状态</label>
                <select class="form-control">
                    <option>全部</option>
                    <option>启用</option>
                    <option>停用</option>
                </select>
            </div>
            <div class="form-item" style="min-width:auto">
                <button class="btn btn-primary"><i class="fa fa-search"></i> 查询</button>
                <button class="btn btn-default"><i class="fa fa-eraser"></i> 重置</button>
            </div>
        </div>
    </div>

    <!-- ====== 表格内容区 ====== -->
    <div class="card" style="margin-bottom:0">
        <div class="card-header">
            <div class="card-title">字段列表</div>
        </div>
        <div class="table-wrapper" style="border-radius:0; border-left:none; border-right:none; border-top:none;">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width:40px"><input type="checkbox"></th>
                        <th style="width:150px">字段编码</th>
                        <th>字段名称</th>
                        <th style="width:110px" class="text-center">来源</th>
                        <th style="width:140px" class="text-center">码值</th>
                        <th style="width:120px">字段类型</th>
                        <th style="width:90px">长度</th>
                        <th style="width:130px">所属分类</th>
                        <th style="width:120px" class="text-right">引用系统数</th>
                        <th style="width:90px" class="text-center">状态</th>
                        <th style="width:140px" class="text-center">操作</th>
                    </tr>
                </thead>
                <tbody id="fieldListBody"></tbody>
            </table>
        </div>
        <div class="pagination">
            <div class="page-info">共 <span class="text-primary">128</span> 条记录</div>
            <div class="page-list">
                <button><i class="fa fa-angle-left"></i></button>
                <button class="active">1</button>
                <button>2</button>
                <button>3</button>
                <button>4</button>
                <button>5</button>
                <button><i class="fa fa-angle-right"></i></button>
            </div>
            <div class="page-size">
                <select class="form-control" style="height:32px">
                    <option>10 条/页</option>
                    <option>20 条/页</option>
                    <option>50 条/页</option>
                </select>
            </div>
        </div>
    </div>
</div>

<script src="../../js/mock-data.js"></script>
<script>
(function () {
    /** 解析URL参数 */
    function getParam(key) {
        const params = new URLSearchParams(window.location.search);
        return params.get(key);
    }

    /** 只读模式处理：用户侧的"数据标准查询"菜单会以 mode=readonly 进入 */
    const isReadonly = getParam('mode') === 'readonly';
    if (isReadonly) {
        const titleEl = document.getElementById('pageTitle');
        const descEl = document.getElementById('pageDesc');
        const addBtn = document.getElementById('btnAddField');
        if (titleEl) titleEl.innerHTML = '<i class="fa fa-search" style="color:var(--primary);margin-right:8px"></i>数据标准查询';
        if (descEl) descEl.textContent = '查询全行标准字段与码值（只读模式）';
        if (addBtn) addBtn.style.display = 'none';
    }

    /**
     * 渲染码值列：有码值时显示数量 + 查看链接；无码值时显示"—"
     * 规则：字典枚举类或显式带 codeValueCount 的字段视为有码值
     */
    function renderCodeValueCell(field) {
        const hasCodeValue = field.codeValueCount > 0 || field.category === '字典枚举类';
        if (!hasCodeValue) {
            return '<span class="dash">—</span>';
        }
        const count = field.codeValueCount || (field.code === 'CUST_ID' ? 2 : 1);
        return `<span>${count}</span><a onclick="govNav('pages/datadict/field-detail.html', ['首页', '数据标准管理', '字段详情'], {code:'${field.code}', from:'list'${isReadonly ? ", mode:'readonly'" : ''}})">查看</a>`;
    }

    /**
     * 渲染字段来源标记
     */
    function renderSourceCell(field) {
        if (!field.source) {
            return '<span class="tag tag-default" style="font-size:11px">—</span>';
        }
        // 来源图标与颜色映射
        const sourceStyles = {
            '国家标准': { color: '#2563eb', bg: '#eff6ff', icon: 'fa-flag' },
            '行业标准': { color: '#0891b2', bg: '#ecfeff', icon: 'fa-building' },
            '人行标准': { color: '#16a34a', bg: '#f0fdf4', icon: 'fa-university' },
            '行内标准': { color: '#7c3aed', bg: '#f5f3ff', icon: 'fa-bank' },
            '业务部门': { color: '#d97706', bg: '#fffbeb', icon: 'fa-users' },
            '继承字段': { color: '#dc2626', bg: '#fef2f2', icon: 'fa-arrow-circle-up' },
            '自定义':   { color: '#6b7280', bg: '#f3f4f6', icon: 'fa-edit' }
        };
        const style = sourceStyles[field.source] || sourceStyles['自定义'];
        return `<span class="tag" style="font-size:11px;color:${style.color};background:${style.bg};border-color:transparent"><i class="fa ${style.icon}"></i> ${field.source}</span>`;
    }

    const rows = window.GovernanceMockData.standardFields;
    document.getElementById('fieldListBody').innerHTML = rows.map(r => `
        <tr>
            <td><input type="checkbox"></td>
            <td class="col-code" title="${r.code}" style="font-family:'Segoe UI',sans-serif; font-weight:600; color:var(--primary)">${r.code}</td>
            <td class="col-name" title="${r.name}">${r.name}</td>
            <td class="text-center">${renderSourceCell(r)}</td>
            <td class="col-codevalue text-center">${renderCodeValueCell(r)}</td>
            <td><span class="tag tag-info" style="font-size:11px">${r.type}</span></td>
            <td class="num">${r.length}</td>
            <td class="col-category" title="${r.category}"><span class="tag tag-default" style="font-size:11px">${r.category}</span></td>
            <td class="text-right num">${r.refCount}</td>
            <td class="text-center">
                <span class="tag ${r.status==='启用'?'tag-success':'tag-default'}" style="font-size:11px"><i class="fa fa-${r.status==='启用'?'check-circle':'minus-circle'}"></i> ${r.status}</span>
            </td>
            <td class="text-center">
                <a class="btn-link" style="padding:0 4px;cursor:pointer" onclick="govNav('pages/datadict/field-detail.html', ['首页', '数据标准管理', '字段详情'], {code:'${r.code}', from:'list'${isReadonly ? ", mode:'readonly'" : ''}})"><i class="fa fa-eye"></i> 查看</a>
            </td>
        </tr>
    `).join('');
})();
</script>
</body>
</html>
