<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字段引用分析 - 数据字典</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        .stat-mini { display:flex; gap:16px; }
        .stat-mini .mini-item {
            flex:1; background:#fff; border:1px solid var(--border);
            border-radius:var(--radius); padding:16px;
        }
        .mini-label { font-size:13px; color:var(--text-secondary); margin-bottom:6px; }
        .mini-value { font-size:24px; font-weight:700; color:var(--text-primary); font-family:'Segoe UI',sans-serif; }
    </style>
<script src="../../js/nav-helper.js"></script>
</head>
<body>

<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-share-alt" style="color:var(--primary);margin-right:8px"></i>字段引用分析</h2>
            <div class="page-desc">
                分析标准字段在各接口、文件服务中的引用情况，用于影响分析与变更评估
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default"><i class="fa fa-refresh"></i> 刷新</button>
            <button class="btn btn-default"><i class="fa fa-download"></i> 导出报告</button>
        </div>
    </div>

    <!-- ====== 筛选操作区（字段选择器） ====== -->
    <div class="filter-bar">
        <div class="form-row">
            <div class="form-item" style="min-width:360px">
                <label>选择字段</label>
                <select class="form-control" id="fieldSelector" onchange="window._changeField()">
                    <!-- JS 填充 -->
                </select>
            </div>
            <div class="form-item">
                <label>引用类型</label>
                <select class="form-control">
                    <option>全部</option>
                    <option>API接口</option>
                    <option>文件服务</option>
                </select>
            </div>
            <div class="form-item" style="min-width:auto">
                <button class="btn btn-primary"><i class="fa fa-search"></i> 分析</button>
            </div>
        </div>
    </div>

    <!-- ====== 统计信息卡片 ====== -->
    <div class="stat-mini" style="margin-bottom:16px">
        <div class="mini-item" id="stat-code">
            <div class="mini-label">字段编码</div>
            <div class="mini-value" id="fld-code" style="font-size:18px; color:var(--primary)">CUST_ID</div>
        </div>
        <div class="mini-item">
            <div class="mini-label">数据类型</div>
            <div class="mini-value" id="fld-type" style="font-size:18px">VARCHAR(20)</div>
        </div>
        <div class="mini-item">
            <div class="mini-label"><i class="fa fa-plug" style="color:var(--primary)"></i> 被多少接口引用</div>
            <div class="mini-value" id="fld-api" style="color:var(--primary)">286</div>
        </div>
        <div class="mini-item">
            <div class="mini-label"><i class="fa fa-file-text-o" style="color:var(--info)"></i> 被多少文件服务引用</div>
            <div class="mini-value" id="fld-file" style="color:var(--info)">128</div>
        </div>
        <div class="mini-item">
            <div class="mini-label"><i class="fa fa-server" style="color:var(--success)"></i> 涉及系统数</div>
            <div class="mini-value" id="fld-sys" style="color:var(--success)">38</div>
        </div>
    </div>

    <!-- ====== 引用详情 ====== -->
    <div class="card" style="margin-bottom:0">
        <div class="card-header">
            <div class="card-title">引用详情（引用类型 · 系统名称 · 接口/文件服务名 · 引用位置 · 引用方式</div>
            <div class="card-action">
                <a href="javascript:;">按系统分组</a>
                <a href="javascript:;">按类型分组</a>
            </div>
        </div>
        <div class="table-wrapper" style="border-radius:0; border-left:none; border-right:none; border-top:none;">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width:110px">引用类型</th>
                        <th>系统名称</th>
                        <th>接口名称 / 文件服务名</th>
                        <th style="width:180px">引用位置</th>
                        <th style="width:120px" class="text-center">引用方式</th>
                        <th style="width:120px" class="text-center">分级</th>
                        <th style="width:120px" class="text-center">操作</th>
                    </tr>
                </thead>
                <tbody id="refBody"></tbody>
            </table>
        </div>
        <div class="pagination">
            <div class="page-info">共 <span class="text-primary">414</span> 条引用记录</div>
            <div class="page-list">
                <button><i class="fa fa-angle-left"></i></button>
                <button class="active">1</button>
                <button>2</button>
                <button>3</button>
                <button><i class="fa fa-angle-right"></i></button>
            </div>
        </div>
    </div>
</div>

<script src="../../js/mock-data.js"></script>
<script>
(function () {
    const fields = window.GovernanceMockData.fieldRefAnalysis;

    // 填充下拉
    const sel = document.getElementById('fieldSelector');
    sel.innerHTML = fields.map((f, i) =>
        `<option value="${i}">${f.field.code} - ${f.field.name}</option>`
    ).join('');

    window._changeField = function () {
        const idx = parseInt(document.getElementById('fieldSelector').value);
        render(fields[idx]);
    };

    function render(f) {
        document.getElementById('fld-code').textContent = f.field.code;
        document.getElementById('fld-code').innerHTML = f.field.code;
        document.querySelector('#stat-code .mini-value').textContent = f.field.code;
        document.getElementById('fld-type').textContent = f.field.type;
        document.getElementById('fld-api').textContent = f.stats.apis;
        document.getElementById('fld-file').textContent = f.stats.files;
        document.getElementById('fld-sys').textContent = f.stats.systems;

        const tbody = document.getElementById('refBody');
        tbody.innerHTML = f.refs.map(r => `
            <tr>
                <td>
                    <span class="tag ${r.kind==='API'?'tag-info':'tag-purple'}" style="font-size:11px">
                        <i class="fa fa-${r.kind==='API'?'plug':'file-text-o'}"></i> ${r.kind}
                    </span>
                </td>
                <td>${r.system}</td>
                <td style="font-weight:500">${r.name}</td>
                <td style="color:${r.location}</td>
                <td class="text-center">
                    <span class="tag ${r.use==='输入'?'tag-warning':r.use==='输出'?'tag-success':'tag-default'}" style="font-size:11px">${r.use}</span>
                </td>
                <td class="text-center">
                    <span class="tag tag-level-${r.level.toLowerCase()}" style="font-size:11px">${r.level}</span>
                </td>
                <td class="text-center">
                    <a class="btn-link" style="padding:0 4px"><i class="fa fa-eye"></i> 查看</a>
                    <a class="btn-link" style="padding:0 4px"><i class="fa fa-link"></i> 血缘</a>
                </td>
            </tr>
        `).join('');
    }
    render(fields[0]);
})();
</script>
</body>
</html>
