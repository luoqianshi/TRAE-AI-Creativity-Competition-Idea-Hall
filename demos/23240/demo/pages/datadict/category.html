<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字段分类 - 数据标准</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        /* ====== 环境治理新增样式 ====== */
        .env-switcher { display:flex; align-items:center; gap:10px; padding:10px 16px; background:#fff; border:1px solid var(--border-color, #e2e8f0); border-radius:var(--radius, 6px); }
        .env-switcher .env-label { font-size:13px; color:var(--text-secondary, #64748b); font-weight:600; }
        .env-pill { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:500; color:#475569; background:#f1f5f9; border:1px solid transparent; transition:all .15s ease; user-select:none; }
        .env-pill:hover { box-shadow:0 2px 6px rgba(0,0,0,.08); }
        .env-pill.active { background:var(--primary, #1e40af); color:#fff; border-color:var(--primary, #1e40af); }
        .env-pill.active:hover { box-shadow:0 3px 10px rgba(30,64,175,.25); }
        .env-pill .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
        .env-pill .dot.green { background:#16a34a; }
        .env-pill .dot.yellow { background:#eab308; }
        .env-pill .dot.blue { background:#2563eb; }
        .env-pill .dot.purple { background:#9333ea; }
        .env-badge-bench { margin-left:4px; font-size:10px; padding:1px 6px; border-radius:10px; background:rgba(255,255,255,.25); color:#fff; font-weight:500; letter-spacing:.5px; }

        .env-banner { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 16px; background:#eff6ff; border:1px solid #bfdbfe; border-radius:var(--radius, 6px); margin-top:10px; }
        .env-banner .bn-left { display:flex; align-items:center; gap:10px; font-size:13px; color:#1e40af; }
        .env-banner .bn-left i { font-size:16px; color:#2563eb; }
        .env-banner .bn-right { display:flex; gap:8px; }

        .env-stat-row { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin:12px 0 0 0; }
        .env-stat-card { background:linear-gradient(135deg,#f0f9ff,#e0f2fe); border:1px solid #bae6fd; border-radius:8px; padding:14px 16px; }
        .env-stat-card.ovr { background:linear-gradient(135deg,#fff7ed,#ffedd5); border-color:#fed7aa; }
        .env-stat-card.base { background:linear-gradient(135deg,#f0fdf4,#dcfce7); border-color:#bbf7d0; }
        .env-stat-card .esc-label { font-size:12px; color:#475569; }
        .env-stat-card .esc-value { font-size:22px; font-weight:700; color:#0c4a6e; margin-top:4px; font-family:'Segoe UI',sans-serif; }
        .env-stat-card.ovr .esc-value { color:#9a3412; }
        .env-stat-card.base .esc-value { color:#166534; }

        .ovr-tag { display:inline-block; font-size:10px; padding:1px 6px; border-radius:4px; background:#fef3c7; color:#b45309; border:1px solid #fde68a; margin-left:6px; font-weight:500; letter-spacing:.5px; }
        .op-col .ovr-btn { color:#d97706; font-weight:500; }
        .op-col .restore-btn { color:#b45309; }
    </style>
<script src="../../js/nav-helper.js"></script>
</head>
<body>

<div class="page-wrapper">

    <!-- ====== 页面标题区（支持 mode=readonly 只读模式） ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2 id="pageTitle"><i class="fa fa-sitemap" style="color:var(--primary);margin-right:8px"></i>字段管理</h2>
            <div class="page-desc" id="pageDesc">
                对数据字典中的字段进行分类管理，支持按分类快速定位和维护字段信息
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default"><i class="fa fa-refresh"></i> 刷新</button>
            <button class="btn btn-default"><i class="fa fa-download"></i> 导出</button>
            <button class="btn btn-primary" id="btnAddCategory"><i class="fa fa-plus-circle"></i> 新增分类</button>
        </div>
    </div>

    <!-- ====== 环境胶囊切换器 ====== -->
    <div class="env-switcher" id="envSwitcher">
        <span class="env-label">环境:</span>
        <span class="env-pill active" data-env="PROD">PROD · 生产 <span class="dot green"></span><span class="env-badge-bench">基准</span></span>
        <span class="env-pill" data-env="SIT">SIT · 测试 <span class="dot yellow"></span></span>
        <span class="env-pill" data-env="UAT">UAT · 验收 <span class="dot blue"></span></span>
        <span class="env-pill" data-env="DEV">DEV · 开发 <span class="dot purple"></span></span>
    </div>

    <!-- ====== 环境继承关系横幅 ====== -->
    <div class="env-banner" id="envBanner">
        <div class="bn-left">
            <i class="fa fa-info-circle"></i>
            <span id="envBannerText">当前环境: PROD(生产) · 基准环境 · 无需覆盖</span>
        </div>
        <div class="bn-right">
            <button class="btn btn-default" style="height:30px; padding:0 12px; font-size:12px" onclick="alert('继承关系图：\nPROD(基准) ← SIT ← UAT ← DEV\n\n各环境可针对单个字段进行覆盖；未覆盖项自动继承基准环境配置。\n实际生效规则：当前环境覆盖 > 上层继承 > 基准。')"><i class="fa fa-sitemap"></i> 查看继承关系图</button>
            <button class="btn btn-default" style="height:30px; padding:0 12px; font-size:12px; color:#b91c1c; border-color:#fca5a5" onclick="if(confirm('确认将当前环境的所有覆盖字段恢复为基准值？\n\n该操作将清除当前环境对字段的自定义覆盖，字段数量、属性全部恢复为 PROD 基准。')) alert('Demo：已恢复为基准值。')"><i class="fa fa-rotate-left"></i> 全部恢复为基准值</button>
        </div>
    </div>

    <!-- ====== 字段统计（环境差异） ====== -->
    <div class="env-stat-row">
        <div class="env-stat-card">
            <div class="esc-label"><i class="fa fa-database" style="color:#0c4a6e"></i> 当前环境字段总数</div>
            <div class="esc-value" id="envStatTotal">1,286</div>
        </div>
        <div class="env-stat-card ovr">
            <div class="esc-label"><i class="fa fa-pencil-square-o" style="color:#9a3412"></i> 本环境覆盖字段</div>
            <div class="esc-value" id="envStatOvr">0</div>
        </div>
        <div class="env-stat-card base">
            <div class="esc-label"><i class="fa fa-check-circle-o" style="color:#166534"></i> 继承基准字段</div>
            <div class="esc-value" id="envStatBase">1,286</div>
        </div>
    </div>

    <!-- ====== 筛选操作区 ====== -->
    <div class="filter-bar">
        <div class="form-row">
            <div class="form-item">
                <label>关键字</label>
                <input type="text" class="form-control" placeholder="字段名称 / 编码">
            </div>
            <div class="form-item">
                <label>数据类型</label>
                <select class="form-control">
                    <option>全部</option>
                    <option>VARCHAR</option>
                    <option>CHAR</option>
                    <option>DECIMAL</option>
                    <option>INTEGER</option>
                    <option>DATE</option>
                    <option>DATETIME</option>
                </select>
            </div>
            <div class="form-item">
                <label>必填</label>
                <select class="form-control">
                    <option>全部</option>
                    <option>是</option>
                    <option>否</option>
                </select>
            </div>
            <div class="form-item">
                <label>状态</label>
                <select class="form-control">
                    <option>全部</option>
                    <option>启用</option>
                    <option>停用</option>
                </select>
            </div>
            <div class="form-item" style="min-width:auto">
                <button class="btn btn-primary"><i class="fa fa-search"></i> 查询</button>
                <button class="btn btn-default"><i class="fa fa-eraser"></i> 重置</button>
            </div>
        </div>
    </div>

    <!-- ====== 表格/表单内容区：左树 + 右表 ====== -->
    <div style="display:grid; grid-template-columns: 260px 1fr; gap:16px;">

        <!-- 左侧分类树 -->
        <div class="card" style="margin-bottom:0">
            <div class="card-header">
                <div class="card-title"><i class="fa fa-folder-open-o"></i> 分类树</div>
                <div class="card-action"><a href="javascript:;">展开</a></div>
            </div>
            <div class="card-body" id="categoryTree" style="padding:8px 12px">
                <!-- JS 动态渲染 -->
            </div>
        </div>

        <!-- 右侧字段列表 -->
        <div class="card" style="margin-bottom:0">
            <div class="card-header">
                <div class="card-title" id="rightTitle">基础数据类 · 字段列表</div>
                <div class="card-action">
                    <a id="btnAddFieldLink" href="javascript:;"><i class="fa fa-plus"></i> 新增字段</a>
                    <a id="btnBatchDisable" href="javascript:;"><i class="fa fa-trash-o"></i> 批量停用</a>
                </div>
            </div>
            <div class="table-wrapper" style="border-radius:0; border-left:none; border-right:none; border-top:none;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width:40px"><input type="checkbox"></th>
                            <th style="width:140px">字段编码</th>
                            <th>字段名称</th>
                            <th style="width:110px" class="text-center">来源</th>
                            <th style="width:120px">数据类型</th>
                            <th style="width:80px">长度</th>
                            <th style="width:80px" class="text-center">必填</th>
                            <th style="width:120px" class="text-right">引用系统数</th>
                            <th style="width:240px" class="text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="fieldTable"></tbody>
                </table>
            </div>
            <div class="pagination">
                <div class="page-info">共 <span class="text-primary" id="totalCount">268</span> 条记录</div>
                <div class="page-list">
                    <button><i class="fa fa-angle-left"></i></button>
                    <button class="active">1</button>
                    <button>2</button>
                    <button>3</button>
                    <button><i class="fa fa-angle-right"></i></button>
                </div>
                <div class="page-size">
                    <select class="form-control" style="height:32px">
                        <option>10 条/页</option>
                        <option>20 条/页</option>
                        <option>50 条/页</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../../js/mock-data.js"></script>
<script>
/* =========================================================
 * 环境治理 - 字段管理
 * 基准：PROD；SIT/UAT/DEV 可选择性覆盖字段属性
 * 保留原有字段列表/分类树渲染逻辑
 * ======================================================= */

(function () {
    // ====== 只读模式判断（用户侧数据标准查询入口会带 mode=readonly 参数） ======
    function getParam(key) {
        const params = new URLSearchParams(window.location.search);
        return params.get(key);
    }
    const isReadonly = getParam('mode') === 'readonly';
    if (isReadonly) {
        const tEl = document.getElementById('pageTitle');
        const dEl = document.getElementById('pageDesc');
        if (tEl) tEl.innerHTML = '<i class="fa fa-search" style="color:var(--primary);margin-right:8px"></i>数据标准查询';
        if (dEl) dEl.textContent = '按分类查询全行标准字段与码值配置（只读模式）';
        const addCat = document.getElementById('btnAddCategory');
        const addField = document.getElementById('btnAddFieldLink');
        const batchDisable = document.getElementById('btnBatchDisable');
        if (addCat) addCat.style.display = 'none';
        if (addField) addField.style.display = 'none';
        if (batchDisable) batchDisable.style.display = 'none';
    }

    const data = window.GovernanceMockData;

    /* -------- 环境覆盖配置（字段编码 -> 环境 -> 覆盖属性） -------- */
    // PROD 基准：覆盖项为 0
    // DEV 示例覆盖：customer_type、channel_code、user_level
    // SIT 示例覆盖：channel_code
    // UAT 示例覆盖：customer_type、user_level
    const envSwitcher_fieldOverrideMap = {
        PROD: {},
        SIT:  {
            'channel_code': { type: 'VARCHAR', length: 20, nullable: '否', refCountDelta: 2, reason: '联调阶段渠道编码长度加长' },
        },
        UAT:  {
            'customer_type': { type: 'CHAR', length: 4, nullable: '是', refCountDelta: 1, reason: '验收临时扩展客户类型字段' },
            'user_level':    { type: 'VARCHAR', length: 16, nullable: '否', refCountDelta: 2, reason: '灰度扩展用户等级' },
        },
        DEV:  {
            'customer_type': { type: 'CHAR', length: 6, nullable: '是', refCountDelta: 3, reason: 'DEV：新增内部客户类型' },
            'channel_code':  { type: 'VARCHAR', length: 32, nullable: '否', refCountDelta: 4, reason: 'DEV：渠道联调测试扩展' },
            'user_level':    { type: 'VARCHAR', length: 20, nullable: '是', refCountDelta: 2, reason: 'DEV：新增体验用户等级' },
        },
    };

    /* -------- 环境乘数（对统计数字做小幅差异） -------- */
    const envSwitcher_envFactor = { PROD: 1.00, SIT: 0.97, UAT: 0.95, DEV: 1.03 };
    const envSwitcher_envNames = { PROD: '生产', SIT: '测试', UAT: '验收', DEV: '开发' };

    /* -------- 分类树（按环境做数量差异） -------- */
    function renderCategoryTree(env) {
        const map = envSwitcher_fieldOverrideMap[env];
        const factor = envSwitcher_envFactor[env];
        const cats = data.dictCategories.map((c, idx) => {
            // 基准字段数 + 环境浮动
            const baseCount = c.count;
            const adj = Math.max(0, Math.round(baseCount * factor)) - baseCount;
            const displayCount = baseCount + adj;
            return { name: c.name, count: displayCount, idx: idx, orig: c };
        });

        const tree = document.getElementById('categoryTree');
        tree.innerHTML = cats.map((c) => `
            <div style="margin-bottom:2px; cursor:pointer; border-radius:4px; padding:8px 10px; ${c.idx===0?'background:#eff6ff; color:var(--primary); font-weight:600':'color:var(--text-primary)'}"
                 data-id="${c.orig.id}" onclick="window._selectCategory(this, ${c.idx})">
                <i class="fa ${c.idx===0?'fa-folder-open':'fa-folder-o'}" style="color:${c.idx===0?'var(--primary)':'#94a3b8'}; margin-right:6px"></i>
                <span>${c.name}</span>
                <span style="float:right; font-size:12px; color:#94a3b8">${c.count}</span>
            </div>
        `).join('');

        // 保存分类数用于统计
        window._envCats = cats;
    }

    /* -------- 分类切换（更新右侧标题 + 记录条数） -------- */
    window._selectCategory = function (el, idx) {
        document.querySelectorAll('#categoryTree > div').forEach((d, i) => {
            if (i === idx) {
                d.style.background = '#eff6ff';
                d.style.color = 'var(--primary)';
                d.style.fontWeight = '600';
                const icon = d.querySelector('i.fa');
                if (icon) { icon.className = 'fa fa-folder-open'; icon.style.color = 'var(--primary)'; }
            } else {
                d.style.background = '';
                d.style.color = 'var(--text-primary)';
                d.style.fontWeight = 'normal';
                const icon = d.querySelector('i.fa');
                if (icon) { icon.className = 'fa fa-folder-o'; icon.style.color = '#94a3b8'; }
            }
        });
        const cat = window._envCats[idx];
        document.getElementById('rightTitle').textContent = cat.name + ' · 字段列表';
        document.getElementById('totalCount').textContent = cat.count;
        renderFields(cat.orig.fields, window._currentEnv || 'PROD');
    };

    /* -------- 字段列表 -------- */
    function renderSourceCell(field) {
        const sourceStyles = {
            '国家标准': { color: '#2563eb', bg: '#eff6ff', icon: 'fa-flag' },
            '行业标准': { color: '#0891b2', bg: '#ecfeff', icon: 'fa-building' },
            '人行标准': { color: '#16a34a', bg: '#f0fdf4', icon: 'fa-university' },
            '行内标准': { color: '#7c3aed', bg: '#f5f3ff', icon: 'fa-bank' },
            '业务部门': { color: '#d97706', bg: '#fffbeb', icon: 'fa-users' },
            '继承字段': { color: '#dc2626', bg: '#fef2f2', icon: 'fa-arrow-circle-up' },
            '自定义':   { color: '#6b7280', bg: '#f3f4f6', icon: 'fa-edit' }
        };
        const style = sourceStyles[field.source] || sourceStyles['自定义'];
        return `<span class="tag" style="font-size:11px;color:${style.color};background:${style.bg};border-color:transparent"><i class="fa ${style.icon}"></i> ${field.source || '自定义'}</span>`;
    }

    function renderFields(fields, env) {
        const override = envSwitcher_fieldOverrideMap[env] || {};
        const tbody = document.getElementById('fieldTable');
        const factor = envSwitcher_envFactor[env];
        tbody.innerHTML = fields.map(f => {
            const ov = override[f.code];
            const isOverridden = !!ov;
            const type = ov ? ov.type : f.type;
            const length = ov ? ov.length : f.length;
            const nullable = ov ? ov.nullable : f.nullable;
            const deltaRef = ov ? ov.refCountDelta : 0;
            const refCount = Math.max(1, Math.round(f.refCount * factor) + deltaRef);
            const ovBadge = isOverridden ? ` <span class="ovr-tag">覆盖</span>` : '';
            const opOvrBtn = isOverridden
                ? `<a class="btn-link restore-btn" style="padding:0 6px" onclick="alert('Demo：将字段【${f.code} - ${f.name}】恢复为基准值，取消本环境覆盖。')"><i class="fa fa-rotate-left"></i> 恢复基准</a>`
                : `<a class="btn-link ovr-btn" style="padding:0 6px" onclick="alert('Demo：在此环境覆盖字段【${f.code} - ${f.name}】配置。')"><i class="fa fa-pencil"></i> 在此环境覆盖</a>`;

            return `<tr>
                <td><input type="checkbox"></td>
                <td class="text-primary" style="font-family:'Segoe UI',sans-serif; font-weight:600">${f.code}${ovBadge}</td>
                <td>${f.name}${isOverridden ? `<div style="color:#9a3412;font-size:11px;margin-top:2px"><i class="fa fa-comment-o"></i> ${ov.reason}</div>` : ''}</td>
                <td class="text-center">${renderSourceCell(f)}</td>
                <td><span class="tag tag-info" style="font-size:11px">${type}</span></td>
                <td class="num">${length}</td>
                <td class="text-center">
                    <span class="tag ${nullable==='否'?'tag-danger':'tag-default'}" style="font-size:11px">${nullable}</span>
                </td>
                <td class="text-right num">${refCount}</td>
                <td class="text-center op-col">
                    <a class="btn-link" style="padding:0 6px;cursor:pointer" onclick="govNav('pages/datadict/field-detail.html', ['首页', '数据标准管理', '字段详情'], {code:'${f.code}', from:'category'${isReadonly ? ", mode:'readonly'" : ''}})"><i class="fa fa-eye"></i> 查看</a>
                    ${isReadonly ? '' : opOvrBtn + `
                    <a class="btn-link" style="padding:0 6px; color:var(--danger)" onclick="if(confirm('确认删除字段【${f.code} - ${f.name}】？\n\n注意：该字段被多个接口/文件引用，删除后将影响引用方的字段解析与校验。')) alert('Demo：字段已删除（实际环境需校验引用为空后方可删除）')"><i class="fa fa-trash-o"></i> 删除</a>
                    <a class="btn-link" style="padding:0 6px; color:var(--danger)"><i class="fa fa-ban"></i> 停用</a>`}
                </td>
            </tr>`;
        }).join('');
    }

    /* -------- 更新横幅 & 统计卡 -------- */
    function updateBanner(env) {
        const name = envSwitcher_envNames[env];
        const factor = envSwitcher_envFactor[env];
        const totalBase = data.dictCategories.reduce((s, c) => s + c.count, 0);
        const total = Math.round(totalBase * factor);
        const overriddenCount = Object.keys(envSwitcher_fieldOverrideMap[env] || {}).length;
        const inherited = total - overriddenCount;

        let text = '';
        if (env === 'PROD') {
            text = `当前环境: PROD(${name}) · 基准环境 · 无需覆盖 · 共管理 ${total.toLocaleString()} 字段`;
        } else {
            text = `当前环境: ${env}(${name}) · 继承自 PROD 基准 · 当前 ${overriddenCount} 项已覆盖 · 共管理 ${total.toLocaleString()} 字段`;
        }
        document.getElementById('envBannerText').textContent = text;
        document.getElementById('envStatTotal').textContent = total.toLocaleString();
        document.getElementById('envStatOvr').textContent = overriddenCount;
        document.getElementById('envStatBase').textContent = Math.max(0, inherited).toLocaleString();
        document.getElementById('pageDesc').textContent =
            `对数据字典中的字段进行分类管理，支持按分类快速定位和维护字段信息 · 共 ${data.dictCategories.length} 大分类 · 累计字段数：${total.toLocaleString()}`;
    }

    /* -------- 切换环境 -------- */
    function envSwitcher_switch(env) {
        window._currentEnv = env;
        document.querySelectorAll('#envSwitcher .env-pill').forEach(p => {
            p.classList.toggle('active', p.getAttribute('data-env') === env);
        });
        updateBanner(env);
        renderCategoryTree(env);
        // 默认选中第一个分类并渲染字段
        const firstEl = document.querySelector('#categoryTree > div');
        if (firstEl) window._selectCategory(firstEl, 0);
    }

    window._envSwitcher_switch = envSwitcher_switch;

    // 绑定点击
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('#envSwitcher .env-pill').forEach(p => {
            p.addEventListener('click', function () {
                envSwitcher_switch(this.getAttribute('data-env'));
            });
        });
        // 初始加载
        renderCategoryTree('PROD');
        updateBanner('PROD');
        const firstEl = document.querySelector('#categoryTree > div');
        if (firstEl) window._selectCategory(firstEl, 0);
    });

    // 页面可见即执行一次（防止 DOMContentLoaded 已触发）
    if (document.readyState === 'interactive' || document.readyState === 'complete') {
        renderCategoryTree('PROD');
        updateBanner('PROD');
        const firstEl2 = document.querySelector('#categoryTree > div');
        if (firstEl2) window._selectCategory(firstEl2, 0);
    }
})();
</script>
</body>
</html>
