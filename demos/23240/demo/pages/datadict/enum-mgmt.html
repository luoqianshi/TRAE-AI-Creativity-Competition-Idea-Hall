<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>枚举值管理 - 数据标准</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<script src="../../js/nav-helper.js"></script>
</head>
<body>

<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-list-ul" style="color:var(--primary);margin-right:8px"></i>枚举值管理</h2>
            <div class="page-desc">
                维护全行统一的业务枚举值（如：证件类型、账户状态、交易类型等），确保各系统取值一致 · 枚举类型 326 个 · 枚举值 5,824 个
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default"><i class="fa fa-refresh"></i> 刷新</button>
            <button class="btn btn-default"><i class="fa fa-download"></i> 导出</button>
            <button class="btn btn-primary"><i class="fa fa-plus-circle"></i> 新增枚举类型</button>
        </div>
    </div>

    <!-- ====== 筛选操作区 ====== -->
    <div class="filter-bar">
        <div class="form-row">
            <div class="form-item">
                <label>关键字</label>
                <input type="text" class="form-control" placeholder="枚举类型 / 值 / 描述">
            </div>
            <div class="form-item">
                <label>状态</label>
                <select class="form-control">
                    <option>全部</option>
                    <option>启用</option>
                    <option>停用</option>
                </select>
            </div>
            <div class="form-item" style="min-width:auto">
                <button class="btn btn-primary"><i class="fa fa-search"></i> 查询</button>
                <button class="btn btn-default"><i class="fa fa-eraser"></i> 重置</button>
            </div>
        </div>
    </div>

    <!-- ====== 左枚举类型 + 右枚举值 ====== -->
    <div style="display:grid; grid-template-columns: 280px 1fr; gap:16px;">

        <!-- 左侧枚举类型 -->
        <div class="card" style="margin-bottom:0">
            <div class="card-header">
                <div class="card-title"><i class="fa fa-tags"></i> 枚举类型</div>
                <div class="card-action"><a href="javascript:;"><i class="fa fa-plus"></i></a></div>
            </div>
            <div class="card-body" id="enumTypes" style="padding:6px 10px">
                <!-- JS 渲染 -->
            </div>
        </div>

        <!-- 右侧枚举值列表 -->
        <div class="card" style="margin-bottom:0">
            <div class="card-header">
                <div class="card-title" id="enumTitle">接口类型 (IF_TYPE) · 枚举值</div>
                <div class="card-action">
                    <a href="javascript:;"><i class="fa fa-plus"></i> 新增枚举值</a>
                    <a href="javascript:;"><i class="fa fa-upload"></i> 批量导入</a>
                </div>
            </div>
            <div class="table-wrapper" style="border-radius:0; border-left:none; border-right:none; border-top:none;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width:110px">编码</th>
                            <th style="width:120px">值</th>
                            <th>描述</th>
                            <th style="width:80px" class="text-center">排序</th>
                            <th style="width:80px" class="text-center">状态</th>
                            <th style="width:180px" class="text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="enumValueBody"></tbody>
                </table>
            </div>
            <div class="pagination">
                <div class="page-info">共 <span class="text-primary" id="enumTotal">12</span> 条枚举值</div>
                <div class="page-list">
                    <button><i class="fa fa-angle-left"></i></button>
                    <button class="active">1</button>
                    <button>2</button>
                    <button><i class="fa fa-angle-right"></i></button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../../js/mock-data.js"></script>
<script>
(function () {
    const types = window.GovernanceMockData.enumTypes;

    // 渲染左侧类型列表
    const left = document.getElementById('enumTypes');
    left.innerHTML = types.map((t, i) => `
        <div data-idx="${i}" onclick="window._pickType(${i})"
             style="padding:10px 12px; border-radius:4px; cursor:pointer; margin-bottom:2px;
                    ${i===0?'background:#eff6ff; color:var(--primary); font-weight:600':'color:var(--text-primary)'}">
            <i class="fa fa-tag" style="margin-right:6px; color:${i===0?'var(--primary)':'#94a3b8'}"></i>
            ${t.name}
            <span style="float:right; font-size:12px; color:#94a3b8">${t.values.length}</span>
            <div style="font-size:11px; color:#94a3b8; margin-top:2px; padding-left:18px">${t.code}</div>
        </div>
    `).join('');

    window._pickType = function (idx) {
        document.querySelectorAll('#enumTypes > div').forEach((d, i) => {
            if (i === idx) {
                d.style.background = '#eff6ff';
                d.style.color = 'var(--primary)';
                d.style.fontWeight = '600';
                d.querySelector('i').style.color = 'var(--primary)';
            } else {
                d.style.background = '';
                d.style.color = 'var(--text-primary)';
                d.style.fontWeight = 'normal';
                d.querySelector('i').style.color = '#94a3b8';
            }
        });
        document.getElementById('enumTitle').textContent = `${types[idx].name} (${types[idx].code}) · 枚举值`;
        document.getElementById('enumTotal').textContent = types[idx].values.length;
        renderValues(types[idx].values);
    };

    function renderValues(values) {
        const tbody = document.getElementById('enumValueBody');
        tbody.innerHTML = values.map(v => `
            <tr>
                <td style="font-family:'Segoe UI',sans-serif; color:var(--primary); font-weight:600">${v.code}</td>
                <td style="font-family:'Segoe UI',sans-serif">${v.value}</td>
                <td>${v.desc}</td>
                <td class="text-center num">${v.order}</td>
                <td class="text-center">
                    <span class="tag ${v.status==='启用'?'tag-success':'tag-default'}" style="font-size:11px">${v.status}</span>
                </td>
                <td class="text-center">
                    <a class="btn-link" style="padding:0 4px"><i class="fa fa-eye"></i> 查看</a>
                    <a class="btn-link" style="padding:0 4px"><i class="fa fa-edit"></i> 编辑</a>
                    <a class="btn-link" style="padding:0 4px; color:var(--danger)"><i class="fa fa-ban"></i> 停用</a>
                </td>
            </tr>
        `).join('');
    }
    renderValues(types[0].values);
})();
</script>
</body>
</html>
