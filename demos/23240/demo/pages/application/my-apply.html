<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的申请 - 申请流程管理</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<script src="../../js/nav-helper.js"></script>
<style>
    .apply-dropdown { position: relative; display: inline-block; }
    .apply-dropdown .dropdown-menu { display: none; position: absolute; top: 100%; right: 0; z-index: 1000; background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); min-width: 180px; padding: 4px 0; margin-top: 4px; }
    .apply-dropdown.show .dropdown-menu { display: block; }
    .apply-dropdown .dropdown-menu > div { padding: 10px 16px; cursor: pointer; font-size: 13px; color: #1e293b; display: flex; align-items: center; gap: 8px; }
    .apply-dropdown .dropdown-menu > div:hover { background: #eff6ff; }
    .apply-dropdown .dropdown-menu .dropdown-sep { border-top: 1px solid #e2e8f0; margin: 4px 0; padding: 0; cursor: default; }
    .apply-dropdown .dropdown-menu .dropdown-sep:hover { background: transparent; }
</style>
</head>
<body>

<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-file-text-o" style="color:var(--primary);margin-right:8px"></i>我的申请</h2>
            <div class="page-desc">
                申请流程管理 / 我的申请列表 · 当前用户：李经理（零售业务部）
            </div>
        </div>
        <div class="action-group">
            <div style="position:relative;display:inline-block" class="apply-dropdown">
                <button class="btn btn-primary" onclick="document.querySelector('.apply-dropdown').classList.toggle('show')"><i class="fa fa-plus-circle"></i> 发起申请 <i class="fa fa-caret-down" style="margin-left:4px"></i></button>
                <div class="dropdown-menu">
                    <div onclick="navTo('pages/application/register-apply.html','接口注册申请',{type:'API'});document.querySelector('.apply-dropdown').classList.remove('show')" onmouseover="this.style.background='#eff6ff'" onmouseout="this.style.background='transparent'"><i class="fa fa-plus-circle" style="color:#2563eb"></i> 接口注册申请</div>
                    <div onclick="navTo('pages/application/change-apply.html','接口变更申请',{type:'API'});document.querySelector('.apply-dropdown').classList.remove('show')" onmouseover="this.style.background='#eff6ff'" onmouseout="this.style.background='transparent'"><i class="fa fa-pencil-square-o" style="color:#d97706"></i> 接口变更申请</div>
                    <div onclick="navTo('pages/application/call-apply.html','服务调用申请',{type:'API'});document.querySelector('.apply-dropdown').classList.remove('show')" onmouseover="this.style.background='#eff6ff'" onmouseout="this.style.background='transparent'"><i class="fa fa-plug" style="color:#059669"></i> 服务调用申请</div>
                    <div onclick="navTo('pages/application/offline-apply.html','接口下线申请',{type:'API'});document.querySelector('.apply-dropdown').classList.remove('show')" onmouseover="this.style.background='#eff6ff'" onmouseout="this.style.background='transparent'"><i class="fa fa-power-off" style="color:#dc2626"></i> 接口下线申请</div>
                    <div class="dropdown-sep"></div>
                    <div onclick="navTo('pages/application/file-register-apply.html','文件服务注册');document.querySelector('.apply-dropdown').classList.remove('show')" onmouseover="this.style.background='#eff6ff'" onmouseout="this.style.background='transparent'"><i class="fa fa-file-o" style="color:#7c3aed"></i> 文件服务注册</div>
                    <div onclick="navTo('pages/application/file-change-apply.html','文件服务变更');document.querySelector('.apply-dropdown').classList.remove('show')" onmouseover="this.style.background='#eff6ff'" onmouseout="this.style.background='transparent'"><i class="fa fa-exchange" style="color:#d97706"></i> 文件服务变更</div>
                    <div class="dropdown-sep"></div>
                    <div onclick="navTo('pages/application/register-apply.html','系统接入申请',{type:'SYSTEM'});document.querySelector('.apply-dropdown').classList.remove('show')" onmouseover="this.style.background='#eff6ff'" onmouseout="this.style.background='transparent'"><i class="fa fa-desktop" style="color:#7c3aed"></i> 系统接入申请</div>
                </div>
            </div>
            <script>
            document.addEventListener('click',function(e){if(!e.target.closest('.apply-dropdown')){var m=document.querySelector('.apply-dropdown');if(m)m.classList.remove('show');}});
            </script>
            <button class="btn btn-default"><i class="fa fa-download"></i> 导出</button>
        </div>
    </div>

    <!-- 快捷说明横幅 -->
    <div style="background:linear-gradient(90deg,#fffbeb,#eff6ff);border:1px solid #fde68a;border-radius:8px;padding:10px 16px;margin-bottom:16px;font-size:13px;color:#92400e;display:flex;align-items:center;gap:12px">
        <i class="fa fa-lightbulb-o" style="font-size:18px;color:#d97706"></i>
        <span><b>快捷操作说明：</b>点击申请单号查看详情 · "审核进度"实时追踪审批节点 · 待审核状态申请可撤回 · 顶部"新建申请"选择申请类型快速发起</span>
    </div>

    <!-- ====== 筛选操作区 + Tab 切换 ====== -->
    <div class="filter-bar">
        <div class="tabs" style="border-bottom:none;padding:0;margin-bottom:12px">
            <div class="tab-item active">全部 <span style="color:#94a3b8">(42)</span></div>
            <div class="tab-item">待提交 <span style="color:#94a3b8">(3)</span></div>
            <div class="tab-item">待审核 <span style="color:#d97706">(8)</span></div>
            <div class="tab-item">已通过 <span style="color:#059669">(26)</span></div>
            <div class="tab-item">已驳回 <span style="color:#dc2626">(4)</span></div>
            <div class="tab-item">已关闭 <span style="color:#94a3b8">(1)</span></div>
        </div>
        <div class="form-row">
            <div class="form-item">
                <label>申请单号</label>
                <input class="form-control" id="filtCode" placeholder="输入申请单号">
            </div>
            <div class="form-item">
                <label>申请标题</label>
                <input class="form-control" id="filtTitle" placeholder="模糊匹配申请标题，如：客户信息、接口、v2" style="min-width:220px">
            </div>
            <div class="form-item">
                <label>申请类型</label>
                <select class="form-control" id="filtType">
                    <option value="">全部</option>
                    <option>接口注册</option>
                    <option>接口变更</option>
                    <option>服务调用</option>
                    <option>接口下线</option>
                </select>
            </div>
            <div class="form-item">
                <label>提交时间</label>
                <input class="form-control" placeholder="选择日期范围">
            </div>
            <div class="form-item" style="gap:8px">
                <button class="btn btn-primary" onclick="renderApplies()"><i class="fa fa-search"></i> 查询</button>
                <button class="btn btn-default" onclick="resetFilters()"><i class="fa fa-eraser"></i> 重置</button>
            </div>
        </div>
    </div>

    <!-- ====== 表格内容区 ====== -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><i class="fa fa-list"></i> 申请列表</div>
            <div class="card-action">
                <a href="javascript:;">批量提交</a>
                <a href="javascript:;">批量撤回</a>
            </div>
        </div>
        <div class="card-body" style="padding:0">
            <div class="table-wrapper" style="border:none;border-radius:0">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>申请单号</th>
                            <th>申请类型</th>
                            <th>申请标题</th>
                            <th class="text-center">提交时间</th>
                            <th class="text-center">状态</th>
                            <th class="text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="applyBody"></tbody>
                </table>
            </div>
        </div>
        <div class="pagination">
            <div class="page-info">共 42 条记录 · 当前显示第 1-7 条</div>
            <div class="page-list">
                <button disabled><i class="fa fa-angle-left"></i></button>
                <button class="active">1</button>
                <button>2</button>
                <button>3</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button><i class="fa fa-angle-right"></i></button>
            </div>
        </div>
    </div>

</div>

<script src="../../js/mock-data.js"></script>
<script>
(function () {
    const applies = [
        { code: 'APL-2026-0604-001', type: '接口注册', typeName: '注册申请', title: '客户基本信息查询 v2.3 接口新增',   time: '2026-06-04 10:32', node: '业务审核', status: '待审核' },
        { code: 'APL-2026-0604-002', type: '接口变更', typeName: '变更申请', title: '账户余额查询接口入参字段调整',       time: '2026-06-04 09:18', node: '技术审核', status: '待审核' },
        { code: 'APL-2026-0603-015', type: '服务调用', typeName: '调用申请', title: '申请调用"反洗钱名单校验"接口',       time: '2026-06-03 16:45', node: '安全审核', status: '待审核' },
        { code: 'APL-2026-0603-008', type: '接口下线', typeName: '下线申请', title: '贷款余额查询 v1.0 接口下线申请',     time: '2026-06-03 14:20', node: '已完成',   status: '已通过' },
        { code: 'APL-2026-0602-021', type: '接口注册', typeName: '注册申请', title: '客户对账单文件服务 v1.0 新增',        time: '2026-06-02 15:08', node: '已完成',   status: '已通过' },
        { code: 'APL-2026-0602-012', type: '接口变更', typeName: '变更申请', title: '信用评分查询接口版本升级 v3.0',       time: '2026-06-02 10:32', node: '已驳回',   status: '已驳回' },
        { code: 'APL-2026-0601-006', type: '接口注册', typeName: '注册申请', title: '监管报送文件服务 v2.1 新增',          time: '2026-06-01 11:20', node: '草稿',     status: '待提交' },
        { code: 'APL-2026-0530-032', type: '服务调用', typeName: '调用申请', title: '申请调用"客户信用评级"接口',          time: '2026-05-30 14:05', node: '技术审核', status: '待审核' },
        { code: 'APL-2026-0528-018', type: '接口变更', typeName: '变更申请', title: '支付转账接口超时参数调整',             time: '2026-05-28 09:32', node: '已完成',   status: '已通过' },
        { code: 'APL-2026-0525-009', type: '接口注册', typeName: '注册申请', title: '反欺诈评估服务 v1.0 新增',            time: '2026-05-25 16:18', node: '业务审核', status: '待审核' }
    ];
    const tagMap = { '待审核': 'tag-warning', '已通过': 'tag-success', '已驳回': 'tag-danger', '待提交': 'tag-default' };

    // === 模糊匹配：关键词高亮 ===
    function highlight(text, keyword) {
        if (!keyword) return text;
        var escaped = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        var reg = new RegExp('(' + escaped + ')', 'gi');
        return text.replace(reg, '<span style="background:#fef3c7;color:#92400e;font-weight:600;border-radius:2px;padding:0 2px">$1</span>');
    }

    // === 过滤函数：支持标题模糊匹配 + 申请单号精确匹配 + 类型筛选 ===
    window.renderApplies = function () {
    const code = document.getElementById('filtCode').value.trim().toLowerCase();
    const title = document.getElementById('filtTitle').value.trim().toLowerCase();
    const type = document.getElementById('filtType').value;

    const filtered = applies.filter(a => {
        if (code && a.code.toLowerCase().indexOf(code) === -1) return false;
        if (title && a.title.toLowerCase().indexOf(title) === -1) return false;
        if (type && a.type !== type) return false;
        return true;
    });

    const body = document.getElementById('applyBody');
    if (filtered.length === 0) {
        body.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:#94a3b8"><i class="fa fa-inbox" style="font-size:32px;color:#cbd5e1;margin-bottom:12px;display:block"></i>暂无符合条件的申请记录</td>';
    } else {
        body.innerHTML = filtered.map(a => {
            const isPending = a.status === '待审核';
            return `<tr>
                <td class="num"><a href="javascript:void(0)" onclick="navTo('pages/application/apply-detail.html','申请详情',{id:'${a.code}', type:'${a.typeName}'})" style="color:var(--primary);font-weight:600">${highlight(a.code, code)}</a></td>
                <td><span class="tag tag-info">${a.type}</span></td>
                <td>${highlight(a.title, title)}</td>
                <td class="text-center">${a.time}</td>
                <td class="text-center"><span class="tag ${tagMap[a.status]||'tag-default'}">${a.status}</span></td>
                <td class="text-center" style="white-space:nowrap">
                    <button class="btn btn-link" style="padding:2px 4px" onclick="navTo('pages/application/apply-detail.html','申请详情',{id:'${a.code}', type:'${a.typeName}'})"><i class="fa fa-eye"></i> 查看详情</button>
                    <button class="btn btn-link" style="padding:2px 4px" onclick="navTo('pages/application/apply-detail.html','审核进度',{id:'${a.code}'})"><i class="fa fa-line-chart"></i> 审核进度</button>
                    ${isPending ? `<button class="btn btn-sm" style="padding:2px 8px;margin-left:4px;background:#fff;color:#dc2626;border:1px solid #fecaca" onclick="if(confirm('确认撤回申请【${a.code}】吗？')) alert('申请已撤回（演示）');"><i class="fa fa-undo"></i> 撤回申请</button>` : ''}
                </td>
            </tr>`;
        }).join('');
    }
    // 更新分页信息
    const info = document.querySelector('.page-info');
    if (info) info.innerHTML = '共 ' + applies.length + ' 条记录' + ((code || title || type) ? ' · 筛选后 ' + filtered.length + ' 条' : '') + ' · 当前显示第 1-' + Math.min(filtered.length, 7) + ' 条';
};

    window.resetFilters = function () {
        document.getElementById('filtCode').value = '';
        document.getElementById('filtTitle').value = '';
        document.getElementById('filtType').value = '';
        document.getElementById('filtNode').value = '';
        renderApplies();
    };

    // 首次渲染 + 实时搜索（输入即时过滤）
    ['filtCode', 'filtTitle'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('input', function() { renderApplies(); });
    });
    renderApplies();
})();
function navTo(url, title, params) {
    // 页面特定的面包屑（保持原值）
    var bc = ['首页', '工作台', '我的申请'];
    if (title) bc = ['首页', '工作台', '我的申请', title];
    // 优先使用 nav-helper.js 提供的 govNav（通过 postMessage 跨域兼容）
    if (window.govNav) { window.govNav(url, bc, params || {}); return; }
    try {
        if (window.parent && window.parent.governancePlatform && typeof window.parent.governancePlatform.navigate === 'function') {
            window.parent.governancePlatform.navigate(url, bc, params || {});
            return;
        }
    } catch (e) { /* fall through */ }
    // 最终回退：在新窗口打开
    var fallback = '../../index.html?nav=' + encodeURIComponent(url);
    if (params && typeof params === 'object') {
        var qs = Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&');
        if (qs) fallback += '&' + qs;
    }
    try { window.parent.location.href = fallback; } catch(e) { window.location.href = fallback; }
}
</script>
</body>
</html>
