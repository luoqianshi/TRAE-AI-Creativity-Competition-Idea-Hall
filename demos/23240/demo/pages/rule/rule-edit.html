<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>规则编辑 - 规则引擎与审核管理</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<script src="../../js/nav-helper.js"></script>
<script>
    // 根据 URL 参数 ?name=接口命名格式校验 动态更新页面标题
    (function () {
        function getParam(key) {
            var params = new URLSearchParams(window.location.search);
            return params.get(key);
        }
        var ruleName = getParam('name') || '接口命名格式校验';
        var titleEl = document.getElementById('page-title');
        if (titleEl) {
            titleEl.textContent = ruleName + ' - 规则编辑';
        }
        document.title = ruleName + ' - 规则编辑';
    })();
</script>
</head>
<body>

<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-pencil-square-o" style="color:var(--primary);margin-right:8px"></i><span id="page-title">接口命名格式校验 - 规则编辑</span></h2>
            <div class="page-desc">
                编辑规则的基础信息、适用范围及校验逻辑
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default" onclick="govNav('pages/rule/rule-list.html', ['首页', '规则引擎与审核管理', '规则管理'], {})"><i class="fa fa-arrow-left"></i> 返回列表</button>
            <button class="btn btn-default" onclick="alert('Demo：已重置为上次保存的内容')"><i class="fa fa-refresh"></i> 重置</button>
            <button class="btn btn-primary" onclick="alert('Demo：规则已保存，新版本将进入审核流程')"><i class="fa fa-save"></i> 保存</button>
        </div>
    </div>

    <!-- ====== 基本信息 ====== -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><i class="fa fa-info-circle" style="color:var(--primary);margin-right:6px"></i>基本信息</div>
        </div>
        <div class="card-body">
            <div class="form-row" style="grid-template-columns:repeat(2,1fr)">
                <div class="form-item">
                    <label>规则编码</label>
                    <input class="form-control" value="R-FMT-0001" readonly style="background:#f8fafc">
                </div>
                <div class="form-item">
                    <label>规则名称</label>
                    <input class="form-control" value="接口命名格式校验">
                </div>
                <div class="form-item">
                    <label>规则类型</label>
                    <select class="form-control">
                        <option selected>校验规则</option>
                        <option>审核规则</option>
                        <option>完整性规则</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>规则分类</label>
                    <select class="form-control">
                        <option>格式校验</option>
                        <option>标准合规</option>
                        <option>业务规则</option>
                        <option>关联关系</option>
                        <option>文件完整性</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>严重程度</label>
                    <select class="form-control">
                        <option>阻断</option>
                        <option selected>警告</option>
                        <option>提示</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>当前版本</label>
                    <input class="form-control" value="v3.2" readonly style="background:#f8fafc">
                </div>
                <div class="form-item" style="grid-column:span 2">
                    <label>规则描述</label>
                    <textarea class="form-control" rows="3">校验接口命名是否符合 RESTful 规范，使用小驼峰命名法，前缀必须符合标准业务域定义。</textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- ====== 适用范围 ====== -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><i class="fa fa-sitemap" style="color:var(--primary);margin-right:6px"></i>适用范围</div>
        </div>
        <div class="card-body">
            <div class="form-row" style="grid-template-columns:repeat(2,1fr)">
                <div class="form-item">
                    <label>适用业务域</label>
                    <select class="form-control">
                        <option selected>所有接口</option>
                        <option>接口报文</option>
                        <option>接口入参</option>
                        <option>接口出参</option>
                        <option>文件服务</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>例外白名单（可选）</label>
                    <input class="form-control" placeholder="多个以逗号分隔，如：OA,HR">
                </div>
            </div>
        </div>
    </div>

    <!-- ====== 规则逻辑 ====== -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><i class="fa fa-code" style="color:var(--primary);margin-right:6px"></i>规则逻辑</div>
        </div>
        <div class="card-body">
            <div class="form-item">
                <label>校验表达式（正则 / 脚本）</label>
                <textarea class="form-control" rows="8" style="font-family:'Consolas','Monaco',monospace;font-size:13px;line-height:1.6">^[a-z][a-z0-9]*([A-Z][a-z0-9]*)*$
// 匹配规则：
// 1. 以小写字母开头
// 2. 使用小驼峰（camelCase）命名
// 3. 仅允许字母和数字
// 4. 不可使用特殊字符或连续大写</textarea>
            </div>
            <div class="form-item">
                <label>命中提示文案</label>
                <input class="form-control" value="接口命名不符合小驼峰规范，请修正。">
            </div>
        </div>
    </div>

</div>

</body>
</html>
