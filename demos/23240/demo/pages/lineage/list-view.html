<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>血缘列表 - 追溯与血缘管理</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<script src="../../js/nav-helper.js"></script>
</head>
<body>
<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-list-alt" style="color:var(--primary);margin-right:8px"></i>血缘列表</h2>
            <div class="page-desc">
                以表格形式展示所有注册的血缘关系 · 总计 2,648 条血缘 · 已验证 2,412 条
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default" onclick="window.location.reload()"><i class="fa fa-refresh"></i> 刷新</button>
            <button class="btn btn-default" onclick="govNav('pages/lineage/graph-view.html', ['首页', '追溯与血缘管理', '血缘图谱'], {})"><i class="fa fa-sitemap"></i> 切换到图谱</button>
            <button class="btn btn-primary" onclick="alert('新增血缘：请选择上下游接口（演示）');"><i class="fa fa-plus-circle"></i> 新增血缘</button>
        </div>
    </div>

    <!-- 快捷说明横幅 -->
    <div style="background:linear-gradient(90deg,#f5f3ff,#ecfdf5);border:1px solid #ddd6fe;border-radius:8px;padding:10px 16px;margin-bottom:16px;font-size:13px;color:#5b21b6;display:flex;align-items:center;gap:12px">
        <i class="fa fa-sitemap" style="font-size:18px;color:#7c3aed"></i>
        <span><b>快捷操作说明：</b>"查看图谱"可视化展示上下游调用关系 · "查看提供方接口 / 消费方接口"跳转到对应接口详情页</span>
    </div>

    <!-- ====== 筛选操作区 ====== -->
    <div class="filter-bar">
        <div class="form-row">
            <div class="form-item">
                <label>血缘类型</label>
                <select class="form-control">
                    <option>全部</option>
                    <option>API 调用</option>
                    <option>文件传输</option>
                    <option>交叉血缘</option>
                </select>
            </div>
            <div class="form-item">
                <label>关系类型</label>
                <select class="form-control">
                    <option>全部</option>
                    <option>同步调用</option>
                    <option>异步调用</option>
                    <option>文件传输</option>
                </select>
            </div>
            <div class="form-item">
                <label>提供方系统</label>
                <select class="form-control">
                    <option>全部</option>
                    <option>核心业务系统</option>
                    <option>信贷管理系统</option>
                    <option>风险管理系统</option>
                </select>
            </div>
            <div class="form-item">
                <label>消费方系统</label>
                <select class="form-control">
                    <option>全部</option>
                    <option>信用卡核心</option>
                    <option>电子渠道</option>
                    <option>监管报送平台</option>
                </select>
            </div>
            <div class="form-item">
                <label>验证状态</label>
                <select class="form-control">
                    <option>全部</option>
                    <option>已验证</option>
                    <option>待确认</option>
                    <option>异常</option>
                </select>
            </div>
            <div class="form-item" style="min-width:auto">
                <button class="btn btn-primary"><i class="fa fa-search"></i> 查询</button>
                <button class="btn btn-default"><i class="fa fa-eraser"></i> 重置</button>
            </div>
        </div>
    </div>

    <!-- ====== 表格内容区 ====== -->
    <div class="card" style="margin-bottom:0">
        <div class="card-header">
            <div class="card-title">血缘关系列表</div>
            <div class="card-action">
                <a href="javascript:;"><i class="fa fa-file-excel-o"></i> 批量导入</a>
                <a href="javascript:;"><i class="fa fa-download"></i> 导出</a>
            </div>
        </div>
        <div class="table-wrapper" style="border-radius:0; border-left:none; border-right:none; border-top:none;">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width:40px"><input type="checkbox"></th>
                        <th style="width:120px">血缘ID</th>
                        <th style="width:90px">血缘类型</th>
                        <th>提供方路径 / 系统 / 接口</th>
                        <th>消费方路径 / 系统 / 接口</th>
                        <th style="width:90px">关系类型</th>
                        <th style="width:90px">数据来源</th>
                        <th style="width:90px" class="text-center">验证状态</th>
                        <th style="width:130px" class="text-center">更新时间</th>
                        <th style="width:160px" class="text-center">操作</th>
                    </tr>
                </thead>
                <tbody id="lineageBody"></tbody>
            </table>
        </div>
        <div class="pagination">
            <div class="page-info">共 <span class="text-primary">2,648</span> 条记录</div>
            <div class="page-list">
                <button><i class="fa fa-angle-left"></i></button>
                <button class="active">1</button>
                <button>2</button>
                <button>3</button>
                <button>4</button>
                <button>5</button>
                <button>...</button>
                <button>133</button>
                <button><i class="fa fa-angle-right"></i></button>
            </div>
            <div class="page-size">
                <select class="form-control" style="height:32px">
                    <option>20 条/页</option>
                    <option>50 条/页</option>
                    <option>100 条/页</option>
                </select>
            </div>
        </div>
    </div>
</div>
<script src="../../js/mock-data.js"></script>
<script>
(function () {
    // type: 'API' | 'FILE' | 'HYBRID' (交叉血缘)
    const lineages = [
        { id: 'LINE-20241005', type: 'API',    providerDomain: '信贷 / 零售信贷',   providerSys: '核心业务系统',   providerApi: '客户基本信息查询 (API-CUS-0001)',    consumerDomain: '信贷 / 贷款审批',   consumerSys: '信贷管理系统',   consumerApi: '贷款受理服务 (API-LOAN-0023)',    relation: '同步调用', source: '日志分析', status: '已验证', updated: '2024-10-05 14:23', providerCode: 'API-CUS-0001', consumerCode: 'API-LOAN-0023' },
        { id: 'LINE-20241004', type: 'FILE',   providerDomain: '交易 / 清算',       providerSys: '交易清算系统',   providerApi: '日终交易流水文件 (FILE-TRX-0045)',   consumerDomain: '财务 / 总账',      consumerSys: '会计总账系统',   consumerApi: '流水入账服务 (SVC-ACC-0078)',     relation: '文件传输', source: '自登记',   status: '已验证', updated: '2024-10-04 09:12', providerCode: 'FILE-TRX-0045', consumerCode: 'SVC-ACC-0078' },
        { id: 'LINE-20241003', type: 'HYBRID', providerDomain: '风险 / 反洗钱',     providerSys: '风控系统',       providerApi: '反洗钱名单校验 (API-RISK-0078)',    consumerDomain: '信贷 / 贷款审批',   consumerSys: '信贷管理系统',   consumerApi: '贷款审批服务',                        relation: '异步调用', source: '手工维护', status: '待确认', updated: '2024-10-03 17:45', providerCode: 'API-RISK-0078', consumerCode: 'API-LOAN-0023' },
        { id: 'LINE-20241002', type: 'API',    providerDomain: '客户 / 基础信息',   providerSys: '核心业务系统',   providerApi: '账户余额查询 (API-ACC-0012)',        consumerDomain: '渠道 / 手机银行',   consumerSys: '电子渠道',       consumerApi: '账户首页服务',                           relation: '同步调用', source: '日志分析', status: '已验证', updated: '2024-10-02 11:08', providerCode: 'API-ACC-0012', consumerCode: 'API-ACC-0012' },
        { id: 'LINE-20241001', type: 'FILE',   providerDomain: '信用卡 / 对账单',   providerSys: '信用卡核心',     providerApi: '月度客户对账单文件 (FILE-STMT-0056)',consumerDomain: '渠道 / 邮件',       consumerSys: '客户关系管理',   consumerApi: '对账单发送服务',                         relation: '文件传输', source: '日志分析', status: '异常',   updated: '2024-10-01 20:30', providerCode: 'FILE-STMT-0056', consumerCode: 'API-CRM-0055' },
        { id: 'LINE-20240928', type: 'API',    providerDomain: '信贷 / 授信',       providerSys: '风险管理系统',   providerApi: '信用评分查询 (API-CRD-0068)',        consumerDomain: '信贷 / 贷款审批',   consumerSys: '信贷管理系统',   consumerApi: '贷款审批服务',                           relation: '同步调用', source: '自登记',   status: '已验证', updated: '2024-09-28 15:15', providerCode: 'API-CRD-0068', consumerCode: 'API-LOAN-0023' },
        { id: 'LINE-20240925', type: 'API',    providerDomain: '客户 / 画像',       providerSys: '核心业务系统',   providerApi: '客户信息查询 (API-CUS-0005)',        consumerDomain: '营销 / 推荐',       consumerSys: '营销系统',       consumerApi: '客户画像服务',                           relation: '同步调用', source: '日志分析', status: '已验证', updated: '2024-09-25 10:42', providerCode: 'API-CUS-0005', consumerCode: 'API-MKT-0012' },
        { id: 'LINE-20240922', type: 'FILE',   providerDomain: '运营 / 报表',       providerSys: '报表平台',       providerApi: '月度运营报表文件 (FILE-RPT-0088)',   consumerDomain: '渠道 / 邮件',       consumerSys: '客户关系管理',   consumerApi: '报表推送服务',                           relation: '文件传输', source: '自登记',   status: '待确认', updated: '2024-09-22 18:55', providerCode: 'FILE-RPT-0088', consumerCode: 'API-MKT-0034' },
        { id: 'LINE-20240918', type: 'HYBRID', providerDomain: '支付 / 清算',       providerSys: '支付清算系统',   providerApi: '支付状态查询 (API-PAY-0115)',        consumerDomain: '客户 / 对账单',     consumerSys: '信用卡核心',     consumerApi: '月度对账单生成服务',                     relation: '异步调用', source: '日志分析', status: '已验证', updated: '2024-09-18 08:12', providerCode: 'API-PAY-0115', consumerCode: 'API-CRD-0128' },
        { id: 'LINE-20240915', type: 'API',    providerDomain: '风控 / 名单',       providerSys: '风控系统',       providerApi: '黑名单校验 (API-RISK-0032)',         consumerDomain: '支付 / 结算',       consumerSys: '支付清算系统',   consumerApi: '支付拦截服务',                           relation: '同步调用', source: '日志分析', status: '已验证', updated: '2024-09-15 13:08', providerCode: 'API-RISK-0032', consumerCode: 'API-PAY-0078' }
    ];
    const typeTag = (t) => t === 'API' ? { cls: 'tag-info', label: 'API 调用' } : t === 'FILE' ? { cls: 'tag-purple', label: '文件传输' } : { cls: 'tag-warning', label: '交叉血缘' };
    const statusTag = (s) => s === '已验证' ? 'tag-success' : s === '待确认' ? 'tag-warning' : 'tag-danger';
    const isApi = (code) => code && (code.toUpperCase().startsWith('API') || code.toUpperCase().startsWith('SVC'));

    document.getElementById('lineageBody').innerHTML = lineages.map(l => {
        const t = typeTag(l.type);
        const pDetailPage = isApi(l.providerCode) ? 'pages/interface/api-detail.html' : 'pages/interface/file-detail.html';
        const cDetailPage = isApi(l.consumerCode) ? 'pages/interface/api-detail.html' : 'pages/interface/file-detail.html';
        const pType = isApi(l.providerCode) ? 'API' : 'FILE';
        const cType = isApi(l.consumerCode) ? 'API' : 'FILE';
        return `
        <tr>
            <td><input type="checkbox"></td>
            <td style="font-family:'Segoe UI';color:var(--primary);font-weight:600">
                <a href="javascript:void(0)" onclick="govNav('pages/lineage/graph-view.html', ['首页', '追溯与血缘管理', '血缘图谱'], {id:'${l.id}'})">${l.id}</a>
            </td>
            <td><span class="tag ${t.cls}" style="font-size:11px">${t.label}</span></td>
            <td>
                <div style="font-size:11px;color:var(--text-secondary)">${l.providerDomain}</div>
                <div style="font-weight:500">${l.providerSys}</div>
                <div style="font-size:12px;color:var(--text-secondary)">${l.providerApi}</div>
            </td>
            <td>
                <div style="font-size:11px;color:var(--text-secondary)">${l.consumerDomain}</div>
                <div style="font-weight:500">${l.consumerSys}</div>
                <div style="font-size:12px;color:var(--text-secondary)">${l.consumerApi}</div>
            </td>
            <td>${l.relation}</td>
            <td>${l.source}</td>
            <td class="text-center"><span class="tag ${statusTag(l.status)}" style="font-size:11px">${l.status}</span></td>
            <td class="text-center" style="font-size:12px;color:var(--text-secondary)">${l.updated}</td>
            <td class="text-center" style="white-space:nowrap">
                <button class="btn btn-link" style="padding:2px 4px" onclick="govNav('pages/lineage/graph-view.html', ['首页', '追溯与血缘管理', '血缘图谱'], {id:'${l.id}'})"><i class="fa fa-sitemap"></i> 查看图谱</button>
                <button class="btn btn-link" style="padding:2px 4px" onclick="govNav('${pDetailPage}', ['首页', '服务目录', '接口详情'], {id:'${l.providerCode}', type:'${pType}'})"><i class="fa fa-arrow-right"></i> 查看提供方接口</button>
                <button class="btn btn-link" style="padding:2px 4px" onclick="govNav('${cDetailPage}', ['首页', '服务目录', '接口详情'], {id:'${l.consumerCode}', type:'${cType}'})"><i class="fa fa-arrow-left"></i> 查看消费方接口</button>
            </td>
        </tr>`;
    }).join('');
})();
</script>
</body>
</html>
