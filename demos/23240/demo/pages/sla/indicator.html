<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>SLA指标定义 - SLA管理</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        /* ====== 环境治理新增样式 ====== */
        .env-switcher { display:flex; align-items:center; gap:10px; padding:10px 16px; background:#fff; border:1px solid var(--border-color, #e2e8f0); border-radius:var(--radius, 6px); }
        .env-switcher .env-label { font-size:13px; color:var(--text-secondary, #64748b); font-weight:600; }
        .env-pill { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:500; color:#475569; background:#f1f5f9; border:1px solid transparent; transition:all .15s ease; user-select:none; }
        .env-pill:hover { box-shadow:0 2px 6px rgba(0,0,0,.08); }
        .env-pill.active { background:var(--primary, #1e40af); color:#fff; border-color:var(--primary, #1e40af); }
        .env-pill.active:hover { box-shadow:0 3px 10px rgba(30,64,175,.25); }
        .env-pill .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
        .env-pill .dot.green { background:#16a34a; }
        .env-pill .dot.yellow { background:#eab308; }
        .env-pill .dot.blue { background:#2563eb; }
        .env-pill .dot.purple { background:#9333ea; }
        .env-badge-bench { margin-left:4px; font-size:10px; padding:1px 6px; border-radius:10px; background:rgba(255,255,255,.25); color:#fff; font-weight:500; letter-spacing:.5px; }

        .env-banner { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 16px; background:#eff6ff; border:1px solid #bfdbfe; border-radius:var(--radius, 6px); margin-top:10px; }
        .env-banner .bn-left { display:flex; align-items:center; gap:10px; font-size:13px; color:#1e40af; }
        .env-banner .bn-left i { font-size:16px; color:#2563eb; }
        .env-banner .bn-right { display:flex; gap:8px; }

        .ovr-tag { display:inline-block; font-size:10px; padding:2px 8px; border-radius:4px; background:#fef3c7; color:#b45309; border:1px solid #fde68a; margin-left:6px; font-weight:500; letter-spacing:.5px; }

        /* 原有样式 */
        .sla-indicator-card { background:#fff; border:1px solid var(--border-color); border-radius:var(--radius); margin-bottom:14px; }
        .sla-indicator-head { padding:14px 18px; border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center; background:linear-gradient(90deg, rgba(59,130,246,0.06), transparent); }
        .sla-indicator-head .title { font-size:14px; font-weight:700; color:var(--text-primary); }
        .sla-indicator-head .title .icon-wrap { background:var(--primary); color:#fff; width:28px; height:28px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; font-size:13px; margin-right:10px; }
        .sla-indicator-head .sub { font-size:11px; color:var(--text-secondary); font-weight:400; margin-left:8px; }
        .indicator-grid { padding:14px 18px; display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
        .indicator-box { background:var(--bg-body); border:1px solid var(--border-color); border-radius:6px; padding:12px; position:relative; transition:box-shadow .2s; }
        .indicator-box.is-overridden { border-color:#f59e0b; background:linear-gradient(135deg, #fff7ed 0%, #fff 70%); box-shadow:0 2px 6px rgba(245,158,11,.12); }
        .indicator-box .iname { font-size:13px; font-weight:600; color:var(--text-primary); margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
        .indicator-box .iname .iname-tag { font-size:10px; padding:1px 6px; border-radius:3px; background:rgba(59,130,246,0.15); color:var(--primary); font-weight:500; }
        .indicator-box .idesc { font-size:11px; color:var(--text-secondary); line-height:1.6; margin-bottom:8px; min-height:36px; }
        .level-row { display:flex; gap:6px; margin-top:6px; font-size:11px; }
        .level-chip { flex:1; padding:4px 6px; border-radius:3px; text-align:center; background:#fff; border:1px solid var(--border-color); font-family:'Segoe UI'; }
        .level-chip.a { background:rgba(239,68,68,0.08); border-color:rgba(239,68,68,0.3); color:#b91c1c; font-weight:700; }
        .level-chip.b { background:rgba(245,158,11,0.08); border-color:rgba(245,158,11,0.3); color:#92400e; font-weight:700; }
        .level-chip.c { background:rgba(16,185,129,0.08); border-color:rgba(16,185,129,0.3); color:#047857; font-weight:700; }
        .filter-bar-row { padding:12px 18px; display:flex; gap:12px; align-items:center; border-bottom:1px solid var(--border-color); background:var(--bg-body); }

        .ib-actions { display:flex; justify-content:flex-end; gap:6px; margin-top:10px; }
        .ib-actions .ib-btn { font-size:11px; padding:4px 10px; border-radius:4px; cursor:pointer; border:1px solid var(--border-color); background:#fff; color:var(--text-secondary); transition:all .15s; }
        .ib-actions .ib-btn:hover { color:var(--primary); border-color:var(--primary); }
        .ib-actions .ib-btn.ovr { color:#b45309; border-color:#fcd34d; background:#fffbeb; }
        .ib-actions .ib-btn.ovr:hover { background:#fde68a; color:#92400e; }
        .ib-top-corner { position:absolute; top:8px; right:8px; font-size:10px; padding:2px 6px; border-radius:10px; background:linear-gradient(90deg, #f59e0b, #d97706); color:#fff; font-weight:500; letter-spacing:.5px; }
    </style>
<script src="../../js/nav-helper.js"></script>
</head>
<body>
<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-tachometer" style="color:var(--primary);margin-right:8px"></i>SLA 指标定义</h2>
            <div class="page-desc" id="slaPageDesc">
                全行 API 接口统一服务水平协议（SLA）指标定义与分级要求差异
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default"><i class="fa fa-refresh"></i> 刷新</button>
            <button class="btn btn-default"><i class="fa fa-download"></i> 导出定义</button>
            <button class="btn btn-primary"><i class="fa fa-plus-circle"></i> 新增指标</button>
        </div>
    </div>

    <!-- ====== 环境胶囊切换器 ====== -->
    <div class="env-switcher" id="envSwitcher">
        <span class="env-label">环境:</span>
        <span class="env-pill active" data-env="PROD">PROD · 生产 <span class="dot green"></span><span class="env-badge-bench">基准</span></span>
        <span class="env-pill" data-env="SIT">SIT · 测试 <span class="dot yellow"></span></span>
        <span class="env-pill" data-env="UAT">UAT · 验收 <span class="dot blue"></span></span>
        <span class="env-pill" data-env="DEV">DEV · 开发 <span class="dot purple"></span></span>
    </div>

    <!-- ====== 环境继承关系横幅 ====== -->
    <div class="env-banner" id="envBanner">
        <div class="bn-left">
            <i class="fa fa-info-circle"></i>
            <span id="envBannerText">当前环境: PROD(生产) · 基准环境 · 最严格阈值 · 共管理 8 项核心指标</span>
        </div>
        <div class="bn-right">
            <button class="btn btn-default" style="height:30px; padding:0 12px; font-size:12px" onclick="alert('SLA 继承关系：\nPROD(最严格) → UAT(略放宽) → SIT(适度放宽) → DEV(显著放宽)\n\n每个环境可针对单个指标进行覆盖，覆盖后本环境独立生效，不影响其他环境。')"><i class="fa fa-sitemap"></i> 查看继承关系图</button>
            <button class="btn btn-default" style="height:30px; padding:0 12px; font-size:12px; color:#b91c1c; border-color:#fca5a5" onclick="if(confirm('确认将当前环境的所有 SLA 指标阈值恢复为基准值？\n\n该操作将清除本环境的自定义阈值，所有指标沿用 PROD 配置。')) alert('Demo：已恢复为基准值。')"><i class="fa fa-rotate-left"></i> 全部恢复为基准值</button>
        </div>
    </div>

    <!-- ====== 筛选操作区 ====== -->
    <div class="filter-bar">
        <div class="form-row">
            <div class="form-item">
                <label>接口类型</label>
                <select class="form-control">
                    <option>全部</option>
                    <option>API 接口</option>
                    <option>文件服务</option>
                    <option>异步消息</option>
                </select>
            </div>
            <div class="form-item">
                <label>适用分级</label>
                <select class="form-control">
                    <option>全部</option>
                    <option>A 级（核心）</option>
                    <option>B 级（重要）</option>
                    <option>C 级（一般）</option>
                </select>
            </div>
            <div class="form-item">
                <label>测量周期</label>
                <select class="form-control">
                    <option>全部</option>
                    <option>实时（分钟级）</option>
                    <option>日</option>
                    <option>周</option>
                    <option>月</option>
                </select>
            </div>
            <div class="form-item" style="flex:1">
                <label>关键字</label>
                <input type="text" class="form-control" placeholder="指标名称 / 描述">
            </div>
            <div class="form-item" style="min-width:auto">
                <button class="btn btn-primary"><i class="fa fa-search"></i> 查询</button>
                <button class="btn btn-default"><i class="fa fa-eraser"></i> 重置</button>
            </div>
        </div>
    </div>

    <!-- ====== API 接口 SLA 指标 ====== -->
    <div class="sla-indicator-card">
        <div class="sla-indicator-head">
            <div class="title"><span class="icon-wrap"><i class="fa fa-plug"></i></span>API 接口 SLA 指标 <span class="sub">共 8 项核心指标 · 覆盖可用性、响应、错误、恢复</span></div>
            <button class="btn btn-default" style="height:30px; font-size:12px; padding:0 12px"><i class="fa fa-pencil"></i> 编辑模板</button>
        </div>
        <div class="indicator-grid" id="apiGrid">
            <!-- JS 渲染 -->
        </div>
    </div>

    <!-- ====== 异步消息 SLA 指标 ====== -->
    <div class="sla-indicator-card">
        <div class="sla-indicator-head">
            <div class="title"><span class="icon-wrap" style="background:#8b5cf6"><i class="fa fa-exchange"></i></span>异步消息 SLA 指标 <span class="sub">共 4 项核心指标 · 覆盖消息投递、延迟、丢失</span></div>
            <button class="btn btn-default" style="height:30px; font-size:12px; padding:0 12px"><i class="fa fa-pencil"></i> 编辑模板</button>
        </div>
        <div class="indicator-grid" id="msgGrid">
            <!-- JS 渲染 -->
        </div>
    </div>

    <!-- ====== 文件服务 SLA 跳转提示 ====== -->
    <div class="sla-indicator-card">
        <div class="sla-indicator-head">
            <div class="title"><span class="icon-wrap" style="background:#10b981"><i class="fa fa-file-text-o"></i></span>文件服务 SLA 指标 <span class="sub">传输及时率、成功率、完整性、异常处理时效 · 详见独立页面</span></div>
            <a class="btn-link" style="padding:6px 12px"><i class="fa fa-arrow-right"></i> 查看文件服务 SLA 详细定义</a>
        </div>
    </div>
</div>

<script src="../../js/mock-data.js"></script>
<script>
/* =========================================================
 * 环境治理 - SLA 指标定义
 * 基准：PROD；SIT/UAT/DEV 各环境阈值逐级放宽
 * ======================================================= */

// 基准指标定义（PROD 原始阈值）
// 结构: { key, name, tag, desc, levels:{a,b,c}, measure }
const envSwitcher_slaBase = [
    { key: 'availability',    name: '可用率',            tag: '核心', desc: '接口正常响应调用的比例，以周为测量周期，取连续30天加权平均',
      levels: { a: 'A ≥ 99.95%', b: 'B ≥ 99.80%', c: 'C ≥ 99.00%' }, measure: '测量：周 · 告警：低于阈值 0.3%' },
    { key: 'avg-rt',          name: '平均响应时间',      tag: '核心', desc: '所有成功请求的响应时间算术平均值，自网关采集，忽略超时异常样本',
      levels: { a: 'A ≤ 200ms',  b: 'B ≤ 500ms',  c: 'C ≤ 1500ms' }, measure: '测量：实时 · 告警：超阈值 20%' },
    { key: 'p99-rt',          name: 'P99 响应时间',     tag: '关键', desc: '99 分位响应时间，反映高负载场景下的长尾表现，关注极端用户体验',
      levels: { a: 'A ≤ 800ms',  b: 'B ≤ 1500ms', c: 'C ≤ 3000ms' }, measure: '测量：小时 · 告警：连续2小时超阈值' },
    { key: 'error-rate',      name: '错误率',           tag: '核心', desc: '5xx 服务端错误响应占总调用的比例，区分系统错误与业务错误',
      levels: { a: 'A ≤ 0.05%',  b: 'B ≤ 0.20%', c: 'C ≤ 0.50%' }, measure: '测量：分钟 · 告警：5分钟超阈值' },
    { key: 'mttr',            name: '故障恢复时间',      tag: '关键', desc: '从确认故障到恢复服务的时长，按故障等级分别衡量（P0/P1/P2）',
      levels: { a: 'A ≤ 30min',  b: 'B ≤ 60min', c: 'C ≤ 120min' }, measure: '测量：事件 · 告警：P0 未在 15min 响应' },
    { key: 'throughput',      name: '并发吞吐',          tag: '扩展', desc: '接口在稳定响应下能支撑的每秒最大请求量（QPS/TPS）',
      levels: { a: 'A ≥ 1000',   b: 'B ≥ 500',   c: 'C ≥ 200' },    measure: '测量：压测 · 告警：低于预期 80%' },
    { key: 'timeout-rate',    name: '超时率',           tag: '扩展', desc: '超过配置超时时间的调用比例，反映下游依赖的影响',
      levels: { a: 'A ≤ 0.10%',  b: 'B ≤ 0.50%', c: 'C ≤ 1.00%' }, measure: '测量：分钟 · 告警：5分钟超阈值' },
    { key: 'change-success',  name: '变更成功率',        tag: '管理', desc: '版本/配置变更发布后 24 小时内，未发生回滚或降级的比例',
      levels: { a: 'A ≥ 99.5%',  b: 'B ≥ 98.0%', c: 'C ≥ 95.0%' }, measure: '测量：月 · 告警：月度低于目标' },
];

const envSwitcher_msgBase = [
    { key: 'msg-delivery',    name: '消息投递成功率',     tag: '核心', desc: '消息最终成功到达消费者端的比例，不区分重试次数',
      levels: { a: 'A ≥ 99.99%', b: 'B ≥ 99.90%', c: 'C ≥ 99.00%' }, measure: '测量：日 · 告警：单日低于阈值 0.5%' },
    { key: 'msg-latency',     name: '消息平均投递延迟',   tag: '关键', desc: '从生产到消费端接收确认的耗时',
      levels: { a: 'A ≤ 3 秒',   b: 'B ≤ 10 秒',  c: 'C ≤ 60 秒' },   measure: '测量：小时 · 告警：连续3小时超阈值' },
    { key: 'msg-loss',        name: '消息丢失率',        tag: '关键', desc: '生产发出后超出最大重试仍未成功投递的消息比例',
      levels: { a: 'A ≤ 0.001%', b: 'B ≤ 0.01%',  c: 'C ≤ 0.10%' },  measure: '测量：日 · 告警：任意丢失事件告警' },
    { key: 'msg-backlog',     name: '消息队列堆积阈值',    tag: '扩展', desc: '队列中未被消费的消息数超过设定阈值即触发告警',
      levels: { a: 'A ≤ 1000',   b: 'B ≤ 5000',   c: 'C ≤ 20000' },  measure: '测量：分钟 · 告警：持续10分钟超阈值' },
];

// 各环境差异化（用于修改具体 level 阈值文本）
// 规则：PROD 保留原值；SIT/UAT 对百分比类 A 级适度放宽；DEV 显著放宽
// 对"反向数值"（越大越差，如响应时间、错误率）做反向放宽
const envSwitcher_slaOverrides = {
    PROD: {},
    SIT: {
        'availability':   { a: 'A ≥ 99.90%', b: 'B ≥ 99.70%', c: 'C ≥ 98.50%', reason: '联调阶段允许较低可用率' },
        'avg-rt':         { a: 'A ≤ 300ms',   b: 'B ≤ 700ms',  c: 'C ≤ 2000ms', reason: '测试环境不追求极致响应' },
        'error-rate':     { a: 'A ≤ 0.15%',   b: 'B ≤ 0.50%',  c: 'C ≤ 1.00%',  reason: '联调期间允许更高错误率' },
        'timeout-rate':   { a: 'A ≤ 0.25%',   b: 'B ≤ 1.00%',  c: 'C ≤ 2.00%',  reason: '依赖不稳定，超时容忍度提升' },
    },
    UAT: {
        'availability':   { a: 'A ≥ 99.92%', b: 'B ≥ 99.75%', c: 'C ≥ 98.80%', reason: '验收阶段略低于生产' },
        'avg-rt':         { a: 'A ≤ 250ms',  b: 'B ≤ 600ms',  c: 'C ≤ 1800ms', reason: '验收资源不与生产对齐' },
        'error-rate':     { a: 'A ≤ 0.10%',  b: 'B ≤ 0.30%',  c: 'C ≤ 0.80%',  reason: '灰度发布允许小幅度业务错误' },
        'change-success': { a: 'A ≥ 99.0%',  b: 'B ≥ 97.5%',  c: 'C ≥ 94.0%',  reason: '验收变更频繁，成功率适度放宽' },
    },
    DEV: {
        'availability':   { a: 'A ≥ 99.50%', b: 'B ≥ 99.00%', c: 'C ≥ 97.00%', reason: '开发环境不稳定，显著放宽' },
        'avg-rt':         { a: 'A ≤ 500ms',  b: 'B ≤ 1000ms', c: 'C ≤ 3000ms', reason: '开发环境资源共享，延迟容忍度大' },
        'p99-rt':         { a: 'A ≤ 1500ms', b: 'B ≤ 2500ms', c: 'C ≤ 5000ms', reason: '长尾延迟不影响联调' },
        'error-rate':     { a: 'A ≤ 0.50%',  b: 'B ≤ 1.50%',  c: 'C ≤ 3.00%',  reason: '联调期间错误率容忍度显著提升' },
        'mttr':           { a: 'A ≤ 60min',  b: 'B ≤ 120min', c: 'C ≤ 240min', reason: '开发环境故障响应较慢' },
        'throughput':     { a: 'A ≥ 200',    b: 'B ≥ 100',    c: 'C ≥ 50',     reason: '开发环境仅支撑小流量联调' },
        'timeout-rate':   { a: 'A ≤ 0.80%',  b: 'B ≤ 2.00%',  c: 'C ≤ 5.00%',  reason: '下游依赖缺失，超时频繁' },
        'change-success': { a: 'A ≥ 95.0%',  b: 'B ≥ 90.0%',  c: 'C ≥ 85.0%',  reason: '开发变更频繁且快速迭代' },
    },
};

const envSwitcher_msgOverrides = {
    PROD: {},
    SIT: {
        'msg-delivery': { a: 'A ≥ 99.95%', b: 'B ≥ 99.80%', c: 'C ≥ 98.50%', reason: '测试环境消息链路不稳定' },
        'msg-latency':  { a: 'A ≤ 5 秒',   b: 'B ≤ 15 秒',  c: 'C ≤ 90 秒',  reason: '测试环境中间件资源有限' },
    },
    UAT: {
        'msg-delivery': { a: 'A ≥ 99.97%', b: 'B ≥ 99.85%', c: 'C ≥ 98.80%', reason: '验收略低于生产' },
        'msg-latency':  { a: 'A ≤ 4 秒',   b: 'B ≤ 12 秒',  c: 'C ≤ 75 秒',  reason: '验收消息量较小' },
    },
    DEV: {
        'msg-delivery': { a: 'A ≥ 99.00%', b: 'B ≥ 98.00%', c: 'C ≥ 95.00%', reason: '开发环境消息允许丢失' },
        'msg-latency':  { a: 'A ≤ 10 秒',  b: 'B ≤ 30 秒',  c: 'C ≤ 120 秒', reason: '开发不追求实时投递' },
        'msg-loss':     { a: 'A ≤ 0.01%',  b: 'B ≤ 0.10%',  c: 'C ≤ 0.50%',  reason: '联调允许更高丢失率' },
        'msg-backlog':  { a: 'A ≤ 500',    b: 'B ≤ 2000',   c: 'C ≤ 10000',  reason: '开发环境消费能力有限' },
    },
};

const envSwitcher_envNames = { PROD: '生产', SIT: '测试', UAT: '验收', DEV: '开发' };

function envSwitcher_renderBox(item, overrideCfg) {
    const isOvr = !!overrideCfg;
    const levels = isOvr
        ? { a: overrideCfg.a || item.levels.a, b: overrideCfg.b || item.levels.b, c: overrideCfg.c || item.levels.c }
        : item.levels;
    const reasonHtml = isOvr
        ? `<div style="font-size:11px; color:#b45309; margin-top:6px; line-height:1.5"><i class="fa fa-comment-o"></i> ${overrideCfg.reason}</div>`
        : '';
    const topTag = isOvr ? `<span class="ib-top-corner"><i class="fa fa-flag"></i> 已覆盖</span>` : '';
    const opBtn = isOvr
        ? `<button class="ib-btn" onclick="alert('Demo：恢复指标【${item.name}】为基准值（继承 PROD）。')"><i class="fa fa-rotate-left"></i> 恢复基准</button>`
        : `<button class="ib-btn ovr" onclick="alert('Demo：在当前环境覆盖【${item.name}】阈值配置。')"><i class="fa fa-pencil"></i> 在此环境覆盖</button>`;

    return `
    <div class="indicator-box ${isOvr ? 'is-overridden' : ''}" data-key="${item.key}">
        ${topTag}
        <div class="iname">${item.name} <span class="iname-tag">${item.tag}</span></div>
        <div class="idesc">${item.desc}</div>
        <div class="level-row">
            <div class="level-chip a">${levels.a}</div>
            <div class="level-chip b">${levels.b}</div>
            <div class="level-chip c">${levels.c}</div>
        </div>
        <div class="level-row" style="margin-top:6px; color:var(--text-secondary)">
            <div class="level-chip">${item.measure}</div>
        </div>
        ${reasonHtml}
        <div class="ib-actions">${opBtn}</div>
    </div>`;
}

function envSwitcher_renderGrid(env) {
    const apiOvr = envSwitcher_slaOverrides[env] || {};
    const msgOvr = envSwitcher_msgOverrides[env] || {};

    document.getElementById('apiGrid').innerHTML = envSwitcher_slaBase
        .map(it => envSwitcher_renderBox(it, apiOvr[it.key])).join('');
    document.getElementById('msgGrid').innerHTML = envSwitcher_msgBase
        .map(it => envSwitcher_renderBox(it, msgOvr[it.key])).join('');
}

function envSwitcher_updateBanner(env) {
    const name = envSwitcher_envNames[env];
    const apiOvrCount = Object.keys(envSwitcher_slaOverrides[env] || {}).length;
    const msgOvrCount = Object.keys(envSwitcher_msgOverrides[env] || {}).length;
    const total = envSwitcher_slaBase.length + envSwitcher_msgBase.length;
    const totalOvr = apiOvrCount + msgOvrCount;

    let text;
    if (env === 'PROD') {
        text = `当前环境: PROD(${name}) · 基准环境 · 最严格阈值 · 共管理 ${total} 项核心指标`;
    } else {
        text = `当前环境: ${env}(${name}) · 继承自 PROD 基准 · 当前 ${totalOvr} 项已覆盖（API ${apiOvrCount} 项 · 消息 ${msgOvrCount} 项） · 共管理 ${total} 项指标`;
    }
    document.getElementById('envBannerText').textContent = text;
    document.getElementById('slaPageDesc').textContent =
        `全行 API 接口统一服务水平协议（SLA）指标定义与分级要求差异 · 当前环境：${env}（${name}）`;
}

function envSwitcher_switch(env) {
    document.querySelectorAll('#envSwitcher .env-pill').forEach(p => {
        p.classList.toggle('active', p.getAttribute('data-env') === env);
    });
    envSwitcher_updateBanner(env);
    envSwitcher_renderGrid(env);
}

document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('#envSwitcher .env-pill').forEach(p => {
        p.addEventListener('click', function () {
            envSwitcher_switch(this.getAttribute('data-env'));
        });
    });
    envSwitcher_switch('PROD');
});
</script>
</body>
</html>
