<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字段映射配置 - 存量接口标准化改造</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        .filter-bar { margin-bottom:14px; }
    </style>
<script src="../../js/nav-helper.js"></script>
</head>
<body>
<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-exchange" style="color:var(--primary);margin-right:8px"></i>字段映射配置</h2>
            <div class="page-desc">
                维护非标字段到标准字段的映射关系，支持一对一、一对多、脚本转换等多种映射方式
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-primary" onclick="alert('Demo：批量导入映射 Excel')"><i class="fa fa-cloud-upload"></i> 批量导入映射</button>
            <button class="btn btn-default" onclick="alert('Demo：下载映射配置模板')"><i class="fa fa-download"></i> 映射模板下载</button>
        </div>
    </div>

    <!-- ====== 筛选区 ====== -->
    <div class="filter-bar">
        <div class="form-row">
            <div class="form-item">
                <label>接口 / 系统</label>
                <select class="form-control"><option>全部</option><option>核心账务系统</option><option>客户管理系统</option><option>信贷管理系统</option><option>支付清算系统</option></select>
            </div>
            <div class="form-item">
                <label>映射类型</label>
                <select class="form-control"><option>全部</option><option>一对一</option><option>一对多</option><option>脚本转换</option></select>
            </div>
            <div class="form-item">
                <label>状态</label>
                <select class="form-control"><option>全部</option><option>已启用</option><option>已停用</option><option>待审核</option></select>
            </div>
            <div class="form-item" style="flex:1">
                <label>关键字</label>
                <input type="text" class="form-control" placeholder="字段名 / 字段编码">
            </div>
            <div class="form-item" style="min-width:auto">
                <button class="btn btn-primary"><i class="fa fa-search"></i> 查询</button>
                <button class="btn btn-default"><i class="fa fa-eraser"></i> 重置</button>
            </div>
        </div>
    </div>

    <!-- ====== 映射列表 ====== -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><i class="fa fa-list"></i> 字段映射配置</div>
            <div class="card-action"><span style="font-size:12px;color:var(--text-secondary)">共 328 条映射</span></div>
        </div>
        <div class="table-wrapper" style="border-left:none;border-right:none;border-top:none;border-radius:0">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width:220px">源字段（非标）</th>
                        <th style="width:110px" class="text-center">源字段类型</th>
                        <th style="width:220px">目标标准字段</th>
                        <th style="width:110px" class="text-center">目标字段类型</th>
                        <th style="width:100px" class="text-center">映射类型</th>
                        <th>转换规则</th>
                        <th style="width:90px" class="text-center">映射状态</th>
                        <th style="width:130px">最后更新</th>
                        <th style="width:180px" class="text-center">操作</th>
                    </tr>
                </thead>
                <tbody id="mapBody"></tbody>
            </table>
        </div>
        <div class="pagination">
            <div class="page-info">共 <span class="text-primary">328</span> 条</div>
            <div class="page-list">
                <button><i class="fa fa-angle-left"></i></button>
                <button class="active">1</button><button>2</button><button>3</button><button>4</button>
                <button><i class="fa fa-angle-right"></i></button>
            </div>
            <div class="page-size">
                <select class="form-control" style="height:32px"><option>10 条/页</option><option>20 条/页</option></select>
            </div>
        </div>
    </div>

</div>

<script>
(function () {
    const list = [
        { src:'customer_name', srcType:'VARCHAR(100)', tgt:'cust_full_name', tgtType:'VARCHAR(64)', type:'一对一', rule:'直接映射，无需转换', status:'已启用', time:'2026-06-05 14:22' },
        { src:'certificat_no', srcType:'VARCHAR(30)', tgt:'cert_id', tgtType:'VARCHAR(20)', type:'脚本转换', rule:'字符串截取前10位 + 格式校验', status:'已启用', time:'2026-06-04 10:18' },
        { src:'loan_id_code', srcType:'VARCHAR(20)', tgt:'loan_no', tgtType:'VARCHAR(16)', type:'脚本转换', rule:'日期格式转换 YYYYMMDD → YYYY-MM-DD', status:'已启用', time:'2026-06-03 09:30' },
        { src:'biz_status_code', srcType:'CHAR(1)', tgt:'biz_sts', tgtType:'VARCHAR(10)', type:'一对多', rule:'枚举值映射：0→A / 1→B / 2→C', status:'待审核', time:'2026-06-02 16:45' },
        { src:'tran_amount_old', srcType:'DECIMAL(18,2)', tgt:'txn_amt', tgtType:'DECIMAL(18,2)', type:'一对一', rule:'直接映射', status:'已启用', time:'2026-06-01 11:28' },
        { src:'customer_id_old', srcType:'VARCHAR(16)', tgt:'cust_id', tgtType:'VARCHAR(16)', type:'一对一', rule:'直接映射，去空格处理', status:'已启用', time:'2026-05-31 15:56' },
        { src:'record_time', srcType:'VARCHAR(14)', tgt:'rec_ts', tgtType:'DATETIME', type:'脚本转换', rule:'YYYYMMDDHHmmss → DATETIME 格式转换', status:'已启用', time:'2026-05-30 09:12' },
        { src:'currency_cd', srcType:'CHAR(2)', tgt:'currency_code', tgtType:'VARCHAR(3)', type:'一对多', rule:'枚举值映射：CN→CNY / US→USD / EU→EUR', status:'待审核', time:'2026-05-29 13:40' },
        { src:'address_province', srcType:'VARCHAR(32)', tgt:'addr', tgtType:'VARCHAR(256)', type:'一对多', rule:'与 address_city 合并为完整地址', status:'已停用', time:'2026-05-28 10:05' },
        { src:'credit_score_old', srcType:'INTEGER', tgt:'credit_scr', tgtType:'DECIMAL(6,2)', type:'脚本转换', rule:'数值缩放 / 100.0，保留2位小数', status:'已启用', time:'2026-05-26 16:22' }
    ];
    const typeMap = { '一对一':'tag-info', '一对多':'tag-warning', '脚本转换':'tag-danger' };
    const statusMap = { '已启用':'tag-success', '待审核':'tag-warning', '已停用':'tag-default' };
    document.getElementById('mapBody').innerHTML = list.map(d => `
        <tr>
            <td style="font-family:'Segoe UI';color:#dc2626;font-weight:500">${d.src}</td>
            <td class="text-center"><span class="tag tag-default" style="font-size:11px">${d.srcType}</span></td>
            <td style="font-family:'Segoe UI';color:#10b981;font-weight:500">${d.tgt}</td>
            <td class="text-center"><span class="tag tag-default" style="font-size:11px">${d.tgtType}</span></td>
            <td class="text-center"><span class="tag ${typeMap[d.type]}" style="font-size:11px">${d.type}</span></td>
            <td style="font-size:12px;color:var(--text-secondary)">${d.rule}</td>
            <td class="text-center"><span class="tag ${statusMap[d.status]}" style="font-size:11px">${d.status}</span></td>
            <td style="font-size:12px">${d.time}</td>
            <td class="text-center">
                <a class="btn-link"><i class="fa fa-eye"></i> 查看</a>
                <a class="btn-link"><i class="fa fa-pencil"></i> 编辑</a>
                <a class="btn-link" style="color:var(--danger)"><i class="fa fa-trash-o"></i> 删除</a>
            </td>
        </tr>
    `).join('');
})();
</script>
</body>
</html>
