<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标准化差距分析 - 存量接口标准化改造</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        .gap-stats { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:14px; }
        .gap-stat { background:#fff; border:1px solid var(--border-color); border-radius:var(--radius); padding:16px 14px; text-align:center; }
        .gap-stat .label { font-size:12px; color:var(--text-secondary); margin-bottom:6px; }
        .gap-stat .value { font-size:26px; font-weight:700; font-family:'Segoe UI'; color:var(--text-primary); }
        .gap-stat .sub { font-size:11px; color:var(--text-secondary); margin-top:4px; }

        .chart-bar-row { display:flex; align-items:center; margin-bottom:12px; }
        .chart-bar-label { width:180px; font-size:13px; color:var(--text-primary); flex-shrink:0; }
        .chart-bar-outer { flex:1; height:24px; background:#f1f5f9; border-radius:4px; overflow:hidden; position:relative; }
        .chart-bar-inner { height:100%; background:linear-gradient(90deg,#3b82f6,#2563eb); border-radius:4px; transition:width .3s; }
        .chart-bar-value { position:absolute; right:10px; top:0; bottom:0; display:flex; align-items:center; font-size:12px; font-weight:700; color:#fff; }
        .chart-bar-value.alt { color:var(--text-primary); }
    </style>
<script src="../../js/nav-helper.js"></script>
</head>
<body>
<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-exclamation-triangle" style="color:var(--primary);margin-right:8px"></i>标准化差距分析报告</h2>
            <div class="page-desc">
                基于全行字段标准体系，扫描已纳管接口与字段的标准化缺口，识别非标字段、明确需改造对象
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default" onclick="alert('Demo：正在重新扫描...')"><i class="fa fa-refresh"></i> 重新扫描</button>
            <button class="btn btn-primary" onclick="alert('Demo：导出差距分析报告')"><i class="fa fa-download"></i> 导出差距报告</button>
        </div>
    </div>

    <!-- ====== 6个大指标卡 ====== -->
    <div class="gap-stats">
        <div class="gap-stat">
            <div class="label">已扫描接口数</div>
            <div class="value">1,286</div>
            <div class="sub">覆盖 14 系统</div>
        </div>
        <div class="gap-stat">
            <div class="label">标准字段总数</div>
            <div class="value" style="color:#3b82f6">8,642</div>
            <div class="sub">共 14 大类 · 86 小类</div>
        </div>
        <div class="gap-stat">
            <div class="label">非标字段数</div>
            <div class="value" style="color:#f59e0b">328</div>
            <div class="sub">分布于 47 个接口</div>
        </div>
        <div class="gap-stat">
            <div class="label">标准化率</div>
            <div class="value" style="color:#10b981">96.2%</div>
            <div class="sub">目标 98%</div>
        </div>
        <div class="gap-stat">
            <div class="label">需改造接口数</div>
            <div class="value" style="color:#dc2626">47</div>
            <div class="sub">优先级 P0-P2</div>
        </div>
        <div class="gap-stat">
            <div class="label">已完成改造数</div>
            <div class="value" style="color:#10b981">12</div>
            <div class="sub">改造完成率 25.5%</div>
        </div>
    </div>

    <!-- ====== 按系统的标准化率柱状图 ====== -->
    <div class="card" style="margin-bottom:14px">
        <div class="card-header">
            <div class="card-title"><i class="fa fa-bar-chart"></i> 按系统的标准化率排行</div>
            <div class="card-action"><span style="font-size:12px;color:var(--text-secondary)">共 14 个系统 · 按标准化率升序</span></div>
        </div>
        <div class="card-body" id="chartBody"></div>
    </div>

    <!-- ====== 差距分析明细 ====== -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><i class="fa fa-list"></i> 差距分析明细</div>
            <div class="card-action">
                <a class="btn-link"><i class="fa fa-filter"></i> 仅显示待改造</a>
                <span style="font-size:12px;color:var(--text-secondary);margin-left:10px">共 47 条</span>
            </div>
        </div>
        <div class="table-wrapper" style="border-left:none;border-right:none;border-top:none;border-radius:0">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>系统名称</th>
                        <th style="width:100px" class="text-center">接口总数</th>
                        <th style="width:100px" class="text-center">字段总数</th>
                        <th style="width:100px" class="text-center">非标字段数</th>
                        <th style="width:110px" class="text-center">标准化率</th>
                        <th style="width:100px" class="text-center">已完成改造</th>
                        <th style="width:100px" class="text-center">待改造</th>
                        <th style="width:90px" class="text-center">状态</th>
                        <th style="width:180px" class="text-center">操作</th>
                    </tr>
                </thead>
                <tbody id="gapBody"></tbody>
            </table>
        </div>
        <div class="pagination">
            <div class="page-info">共 <span class="text-primary">14</span> 条</div>
            <div class="page-list">
                <button><i class="fa fa-angle-left"></i></button>
                <button class="active">1</button><button>2</button>
                <button><i class="fa fa-angle-right"></i></button>
            </div>
            <div class="page-size">
                <select class="form-control" style="height:32px"><option>10 条/页</option><option>20 条/页</option></select>
            </div>
        </div>
    </div>

</div>

<script>
(function () {
    const data = [
        { name:'信贷管理系统', api:156, fields:1842, nonStd:58, rate:96.8, done:4, pending:12, status:'改造中' },
        { name:'风险管理系统', api:82, fields:986, nonStd:42, rate:95.7, done:2, pending:10, status:'待改造' },
        { name:'客户管理系统', api:128, fields:1428, nonStd:52, rate:96.3, done:3, pending:8, status:'改造中' },
        { name:'对账中心', api:52, fields:462, nonStd:18, rate:96.1, done:1, pending:4, status:'待改造' },
        { name:'核心账务系统', api:186, fields:2048, nonStd:48, rate:97.7, done:8, pending:6, status:'已完成' },
        { name:'商户管理系统', api:67, fields:628, nonStd:22, rate:96.5, done:3, pending:4, status:'改造中' }
    ];
    // 柱状图
    document.getElementById('chartBody').innerHTML = data.slice().sort((a,b)=>a.rate-b.rate).map(d => {
        const color = d.rate >= 97 ? '#10b981' : d.rate >= 95 ? '#3b82f6' : '#f59e0b';
        return `
        <div class="chart-bar-row">
            <div class="chart-bar-label">${d.name}</div>
            <div class="chart-bar-outer">
                <div class="chart-bar-inner" style="width:${d.rate}%;background:linear-gradient(90deg,${color},${color}cc)"></div>
            </div>
            <div style="width:70px;text-align:right;font-weight:700;font-family:'Segoe UI';color:${color};margin-left:10px">${d.rate}%</div>
        </div>`;
    }).join('');
    // 明细表
    document.getElementById('gapBody').innerHTML = data.map(d => {
        let statusTag = 'tag-danger';
        if (d.status === '改造中') statusTag = 'tag-warning';
        else if (d.status === '已完成') statusTag = 'tag-success';
        const rateColor = d.rate >= 97 ? '#10b981' : d.rate >= 95 ? '#3b82f6' : '#f59e0b';
        return `
        <tr>
            <td>${d.name}</td>
            <td class="text-center num">${d.api}</td>
            <td class="text-center num">${d.fields}</td>
            <td class="text-center num" style="color:#f59e0b;font-weight:600">${d.nonStd}</td>
            <td class="text-center"><b style="color:${rateColor}">${d.rate}%</b></td>
            <td class="text-center num" style="color:#10b981">${d.done}</td>
            <td class="text-center num" style="color:#dc2626">${d.pending}</td>
            <td class="text-center"><span class="tag ${statusTag}" style="font-size:11px">${d.status}</span></td>
            <td class="text-center">
                <a class="btn-link"><i class="fa fa-eye"></i> 详情</a>
                <a class="btn-link"><i class="fa fa-plus-circle"></i> 新建计划</a>
            </td>
        </tr>`;
    }).join('');
})();
</script>
</body>
</html>
