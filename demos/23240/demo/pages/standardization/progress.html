<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>改造进度看板 - 存量接口标准化改造</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        .progress-stats { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:14px; }
        .prog-stat { background:#fff; border:1px solid var(--border-color); border-radius:var(--radius); padding:16px 14px; text-align:center; position:relative; overflow:hidden; }
        .prog-stat::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; }
        .prog-stat.wait::before { background:#94a3b8; }
        .prog-stat.doing::before { background:#f59e0b; }
        .prog-stat.verify::before { background:#3b82f6; }
        .prog-stat.done::before { background:#10b981; }
        .prog-stat.reject::before { background:#dc2626; }
        .prog-stat .label { font-size:12px; color:var(--text-secondary); margin-bottom:6px; font-weight:500; }
        .prog-stat .value { font-size:28px; font-weight:700; font-family:'Segoe UI'; color:var(--text-primary); margin-bottom:4px; }
        .prog-stat .sub { font-size:11px; color:var(--text-secondary); }

        .timeline { background:#fff; border:1px solid var(--border-color); border-radius:var(--radius); padding:20px 24px; }
        .timeline-title { font-size:14px; font-weight:700; color:var(--text-primary); margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--border-color); }
        .tl-item { position:relative; padding-left:24px; padding-bottom:16px; border-left:2px solid #e2e8f0; }
        .tl-item:last-child { border-left:2px solid transparent; padding-bottom:0; }
        .tl-item::before { content:''; position:absolute; left:-7px; top:2px; width:12px; height:12px; border-radius:50%; background:var(--primary); border:3px solid #eff6ff; }
        .tl-item .tl-title { font-size:13px; font-weight:600; color:var(--text-primary); margin-bottom:3px; }
        .tl-item .tl-time { font-size:11px; color:var(--text-secondary); margin-bottom:4px; }
        .tl-item .tl-desc { font-size:12px; color:var(--text-secondary); }
    </style>
<script src="../../js/nav-helper.js"></script>
</head>
<body>
<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-tachometer" style="color:var(--primary);margin-right:8px"></i>改造进度看板</h2>
            <div class="page-desc">
                统一跟踪所有改造任务的执行进度，包括待改造、改造中、待验证、已完成、已驳回各阶段状态
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default" onclick="alert('Demo：导出进度报告')"><i class="fa fa-file-pdf-o"></i> 导出进度报告</button>
            <button class="btn btn-primary" onclick="alert('Demo：批量更新状态')"><i class="fa fa-check-square-o"></i> 批量状态更新</button>
        </div>
    </div>

    <!-- ====== 5个状态汇总卡 ====== -->
    <div class="progress-stats">
        <div class="prog-stat wait">
            <div class="label">待改造</div>
            <div class="value" style="color:#64748b">18</div>
            <div class="sub">占比 38.3%</div>
        </div>
        <div class="prog-stat doing">
            <div class="label">改造中</div>
            <div class="value" style="color:#f59e0b">12</div>
            <div class="sub">占比 25.5%</div>
        </div>
        <div class="prog-stat verify">
            <div class="label">待验证</div>
            <div class="value" style="color:#3b82f6">8</div>
            <div class="sub">占比 17.0%</div>
        </div>
        <div class="prog-stat done">
            <div class="label">已完成</div>
            <div class="value" style="color:#10b981">8</div>
            <div class="sub">占比 17.0%</div>
        </div>
        <div class="prog-stat reject">
            <div class="label">已驳回</div>
            <div class="value" style="color:#dc2626">1</div>
            <div class="sub">占比 2.1%</div>
        </div>
    </div>

    <!-- ====== 按系统进度表格 + 右侧时间线 ====== -->
    <div style="display:grid; grid-template-columns:1fr 360px; gap:14px;">
        <div class="card">
            <div class="card-header">
                <div class="card-title"><i class="fa fa-server"></i> 按系统的改造进度</div>
                <div class="card-action"><span style="font-size:12px;color:var(--text-secondary)">共 14 个系统</span></div>
            </div>
            <div class="table-wrapper" style="border-left:none;border-right:none;border-top:none;border-radius:0">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>系统</th>
                            <th style="width:100px">负责人</th>
                            <th style="width:100px" class="text-center">计划接口数</th>
                            <th style="width:100px" class="text-center">已完成</th>
                            <th style="width:100px" class="text-center">进行中</th>
                            <th style="width:100px" class="text-center">待处理</th>
                            <th style="width:160px" class="text-center">完成率</th>
                            <th style="width:160px" class="text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="sysProgBody"></tbody>
                </table>
            </div>
        </div>

        <div class="timeline">
            <div class="timeline-title"><i class="fa fa-history" style="color:var(--primary);margin-right:6px"></i>最近改造事件</div>
            <div id="tlBody"></div>
        </div>
    </div>

</div>

<script>
(function () {
    const sysData = [
        { name:'核心账务系统', owner:'张工', total:18, done:18, doing:0, wait:0 },
        { name:'客户管理系统', owner:'王工', total:12, done:6, doing:4, wait:2 },
        { name:'信贷管理系统', owner:'刘工', total:15, done:4, doing:6, wait:5 },
        { name:'支付清算系统', owner:'陈工', total:9, done:2, doing:3, wait:4 },
        { name:'风险管理系统', owner:'孙工', total:10, done:0, doing:1, wait:9 },
        { name:'对账中心', owner:'吴工', total:8, done:0, doing:0, wait:8 }
    ];
    document.getElementById('sysProgBody').innerHTML = sysData.map(s => {
        const rate = Math.round((s.done / s.total) * 100);
        const color = rate === 100 ? '#10b981' : rate >= 50 ? '#3b82f6' : rate >= 20 ? '#f59e0b' : '#94a3b8';
        return `
        <tr>
            <td>${s.name}</td>
            <td>${s.owner}</td>
            <td class="text-center num">${s.total}</td>
            <td class="text-center num" style="color:#10b981;font-weight:600">${s.done}</td>
            <td class="text-center num" style="color:#f59e0b">${s.doing}</td>
            <td class="text-center num" style="color:#94a3b8">${s.wait}</td>
            <td>
                <div style="display:flex;align-items:center;gap:8px">
                    <div style="flex:1;height:10px;background:#f1f5f9;border-radius:5px;overflow:hidden"><div style="width:${rate}%;height:100%;background:${color};border-radius:5px"></div></div>
                    <span style="font-size:12px;font-weight:700;color:${color};width:40px;text-align:right">${rate}%</span>
                </div>
            </td>
            <td class="text-center">
                <a class="btn-link"><i class="fa fa-eye"></i> 详情</a>
                <a class="btn-link"><i class="fa fa-check"></i> 更新</a>
            </td>
        </tr>`;
    }).join('');

    const tl = [
        { title:'接口 API-ACC-0023 账户余额查询 v2.3 完成改造验证', time:'2026-06-08 10:22', desc:'标准字段映射已完成，原非标字段 customer_name → cust_full_name，验证通过' },
        { title:'字段 cert_no → cert_id 映射脚本更新', time:'2026-06-07 16:45', desc:'新增身份证长度校验逻辑，15→18位自动转换' },
        { title:'接口 API-CUS-0101 客户信息查询 通过改造评审', time:'2026-06-07 14:30', desc:'评审组：架构组 + 数据标准组 + 业务方代表，结论：通过' },
        { title:'字段 loan_id_code 映射配置上线', time:'2026-06-06 09:18', desc:'所属系统：信贷管理系统，映射类型：脚本转换（日期格式转换）' },
        { title:'接口 API-LOAN-0156 额度占用查询 改造启动', time:'2026-06-05 11:22', desc:'改造负责人：刘工 · 预计完成日期：2026-06-18' },
        { title:'接口 API-PAY-0115 支付转账接口 改造驳回', time:'2026-06-04 17:10', desc:'驳回原因：字段映射规则不符合数据标准 v2.1 第3.2节，请重新提交' }
    ];
    document.getElementById('tlBody').innerHTML = tl.map(t => `
        <div class="tl-item">
            <div class="tl-title">${t.title}</div>
            <div class="tl-time"><i class="fa fa-clock-o" style="margin-right:4px"></i>${t.time}</div>
            <div class="tl-desc">${t.desc}</div>
        </div>
    `).join('');
})();
</script>
</body>
</html>
