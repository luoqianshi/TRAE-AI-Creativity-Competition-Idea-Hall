<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页驾驶舱 - 银行服务治理平台</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        /* 可点击元素的视觉反馈 */
        .card-clickable {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .card-clickable:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.15);
            border-color: #bfdbfe;
        }
        .row-clickable {
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .row-clickable:hover {
            background-color: #eff6ff;
            border-radius: 4px;
        }
        .text-link {
            color: #2563eb;
            cursor: pointer;
            font-size: 12px;
        }
        .text-link:hover {
            text-decoration: underline;
            color: #1d4ed8;
        }
        .stat-card {
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
            border-radius: 8px;
            padding: 16px;
            border: 1px solid #e2e8f0;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.12);
            border-color: #bfdbfe;
        }
        .level-row:hover {
            background: #eff6ff;
            border-radius: 4px;
        }
        .domain-row:hover {
            background: #eff6ff;
            border-radius: 4px;
        }
        .todo-card {
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 16px;
            background: #fff;
        }
        .todo-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.12);
            border-color: #bfdbfe;
        }
        .todo-num {
            font-size: 28px;
            font-weight: 700;
            line-height: 1;
        }
        .todo-label {
            font-size: 12px;
            color: #64748b;
            margin-top: 6px;
        }
    </style>
<script src="../../js/nav-helper.js"></script>
</head>
<body>

<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-tachometer" style="color:var(--primary);margin-right:8px"></i>首页驾驶舱</h2>
            <div class="page-desc">
                银行服务治理全景视图 · 数据更新时间：<span id="updateTime"></span>
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default" onclick="location.reload()"><i class="fa fa-refresh"></i> 刷新数据</button>
        </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px">
        <div class="todo-card" onclick="govNav('pages/workspace/todo.html', ['首页','工作台','待办事项'], {})">
            <div style="display:flex;align-items:center;justify-content:space-between">
                <div class="todo-num" style="color:#dc2626">5</div>
                <div style="width:36px;height:36px;border-radius:8px;background:#fef2f2;color:#dc2626;display:flex;align-items:center;justify-content:center;font-size:16px"><i class="fa fa-inbox"></i></div>
            </div>
            <div class="todo-label">待处理申请</div>

        <div class="todo-card" onclick="govNav('pages/rule/audit-workbench.html', ['首页','规则引擎与审核管理','审核工作台'], {})">
            <div style="display:flex;align-items:center;justify-content:space-between">

            </div>
            <div class="todo-label">待审核事项</div>
        </div>
        <div class="todo-card" onclick="govNav('pages/workspace/impact-alert.html', ['首页','工作台','影响分析预警'], {})">

                <div class="todo-num" style="color:#2563eb">4</div>
                <div style="width:36px;height:36px;border-radius:8px;background:#eff6ff;color:#2563eb;display:flex;align-items:center;justify-content:center;font-size:16px"><i class="fa fa-exclamation-triangle"></i></div>
            </div>
            <div class="todo-label">影响分析预警</div>
        </div>
        <div class="todo-card" onclick="govNav('pages/workspace/message.html', ['首页','工作台','消息通知'], {})">

                <div class="todo-num" style="color:#7c3aed">12</div>
                <div style="width:36px;height:36px;border-radius:8px;background:#f5f3ff;color:#7c3aed;display:flex;align-items:center;justify-content:center;font-size:16px"><i class="fa fa-bell-o"></i></div>
            </div>
            <div class="todo-label">未读消息</div>
        </div>
    </div>

    <!-- ====== 关键指标卡片（3个，面向普通用户） ====== -->
    <div class="stat-grid" id="statGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px"></div>

    <!-- ====== 第二行：发起申请快捷入口 + 常用功能入口 ====== -->
    <div style="display:grid; grid-template-columns: 1.5fr 1fr; gap:16px; margin-bottom:16px;">

        <div class="card" id="card-applyShortcut">
            <div class="card-header">
                <div class="card-title"><i class="fa fa-plus-circle" style="color:#2563eb;margin-right:6px"></i>发起申请</div>
                <div class="card-action">
                    <span class="text-link" onclick="govNav('pages/application/my-apply.html', ['首页', '申请流程管理', '我的申请'], {})">我的申请 →</span>
                </div>
            </div>
            <div class="card-body" id="applyShortcutBody" style="padding:16px 16px 4px"></div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title"><i class="fa fa-th-large" style="color:#2563eb;margin-right:6px"></i>常用功能入口</div>
            </div>
            <div class="card-body" id="shortcutBody" style="padding:20px 16px"></div>
        </div>
    </div>

    <!-- ====== 影响分析预警卡片（移至最后） ====== -->
    <div class="card card-clickable" id="cardImpactAlert" style="margin-bottom:16px;background:linear-gradient(135deg,#fff 0%,#fff7ed 100%);border-color:#fbbf24">
        <div class="card-header">
            <div class="card-title" style="color:#92400e"><i class="fa fa-exclamation-triangle" style="color:#d97706;margin-right:6px"></i>影响分析预警</div>
            <div class="card-action">
                <span class="text-link" onclick="event.stopPropagation();govNav('pages/workspace/impact-alert.html', ['首页','工作台','影响分析预警'], {})">查看全部 →</span>
            </div>
        </div>
        <div class="card-body" id="impactAlertBody" style="padding:12px 20px"></div>
    </div>

</div>

<script>
/**
 * 统一导航函数：调用父框架的 navigate 方法
 * @param {string} url - 目标页面URL
 * @param {string[]} crumb - 面包屑数组
 * @param {object} params - URL参数对象
 */
function navTo(url, crumb, params) {
    // 面包屑由调用方传入（页面通过 crumb 参数传入完整数组）
    var bc = crumb || [];
    // 优先使用 nav-helper.js 提供的 govNav（通过 postMessage 跨域兼容）
    if (window.govNav) { window.govNav(url, bc, params || {}); return; }
    try {
        if (window.parent && window.parent.governancePlatform && typeof window.parent.governancePlatform.navigate === 'function') {
            window.parent.governancePlatform.navigate(url, bc, params || {});
            return;
        }
    } catch (e) { /* fall through */ }
    // 最终回退：跳转到 index.html?nav=...
    var fallback = '../../index.html?nav=' + encodeURIComponent(url);
    if (params && typeof params === 'object') {
        var qs = Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&');
        if (qs) fallback += '&' + qs;
    }
    try { window.parent.location.href = fallback; } catch(e) { window.location.href = fallback; }
}

/** 通用：为元素绑定点击事件 */
function bindClick(id, url, crumb, params) {
    const el = document.getElementById(id);
    if (el) {
        el.addEventListener('click', function() {
            navTo(url, crumb, params);
        });
    }
}

// ====== 页面标题区：更新时间 ======
(function() {
    const now = new Date();
    const pad = function(n) { return n < 10 ? '0' + n : n; };
    const t = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) +
              ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
    const el = document.getElementById('updateTime');
    if (el) el.textContent = t;
})();

// ====== 1. 关键指标卡片（面向普通用户：3 张） ======
(function() {
    const statConfig = [
        { label: '我可调用的接口', value: 3482, unit: '', foot: '较上月 +184', trend: 'up', icon: 'fa-plug', style: 'primary',
          url: 'pages/interface/list.html', crumb: ['首页', '服务目录', '接口服务清单'], params: { type: 'API', scope: 'mine' } },
        { label: '我可订阅的文件服务', value: 1256, unit: '', foot: '较上月 +68', trend: 'up', icon: 'fa-file-text-o', style: 'purple',
          url: 'pages/interface/list.html', crumb: ['首页', '服务目录', '接口服务清单'], params: { type: 'FILE', scope: 'mine' } },
        { label: '我的待办申请', value: 7, unit: '', foot: '待处理', trend: 'warn', icon: 'fa-file-text', style: 'orange',
          url: 'pages/application/my-apply.html', crumb: ['首页', '申请流程管理', '我的申请'], params: { status: 'pending' } }
    ];

    const statGrid = document.getElementById('statGrid');
    if (!statGrid) return;

    let html = '';
    for (let i = 0; i < statConfig.length; i++) {
        const s = statConfig[i];
        const arrowColor = s.trend === 'up' ? '#10b981' : s.trend === 'warn' ? '#d97706' : '#dc2626';
        const icon = s.icon;
        const bgMap = {
            primary: '#eff6ff', cyan: '#ecfeff', purple: '#f5f3ff', green: '#ecfdf5', orange: '#fff7ed'
        };
        const iconBg = bgMap[s.style] || '#eff6ff';
        const styleColor = {
            primary: '#2563eb', cyan: '#0891b2', purple: '#7c3aed', green: '#10b981', orange: '#d97706'
        };
        const iconColor = styleColor[s.style] || '#2563eb';

        html += `
            <div class="stat-card" data-nav-index="${i}">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
                    <div style="font-size:13px;color:#64748b;font-weight:500">${s.label}</div>
                    <div style="width:36px;height:36px;border-radius:8px;background:${iconBg};color:${iconColor};display:flex;align-items:center;justify-content:center;font-size:16px">
                        <i class="fa ${icon}"></i>
                    </div>
                </div>
                <div style="font-size:28px;font-weight:700;color:#1e293b;margin-bottom:8px;line-height:1">
                    ${s.value}<span style="font-size:14px;font-weight:500;color:#64748b;margin-left:4px">${s.unit}</span>
                </div>
                <div style="font-size:12px;color:#64748b;display:flex;align-items:center">
                    <i class="fa fa-arrow-${s.trend === 'up' ? 'up' : s.trend === 'warn' ? 'circle-o-notch' : 'down'}" style="color:${arrowColor};margin-right:4px;font-size:10px"></i>
                    ${s.foot}
                </div>
            </div>
        `;
    }
    statGrid.innerHTML = html;

    // 绑定每个卡片的点击事件
    const cards = statGrid.querySelectorAll('.stat-card');
    cards.forEach(function(card, idx) {
        const s = statConfig[idx];
        card.addEventListener('click', function() {
            navTo(s.url, s.crumb, s.params);
        });
    });
})();

// ====== 1b. 影响分析预警卡片 ======
(function() {
    const alertData = [
        { level: 'critical', title: '客户基本信息查询接口字段变更', desc: '影响 28 个下游接口 · 待评估', time: '10 分钟前', color: '#dc2626', bg: '#fef2f2' },
        { level: 'high', title: '账户余额查询服务 v2.3 下线提醒', desc: '影响 15 个调用方系统 · 需切换至 v3.0', time: '1 小时前', color: '#ea580c', bg: '#fff7ed' },
        { level: 'medium', title: '日终批处理文件字段新增', desc: '新增 3 个字段，下游 8 个系统需适配', time: '3 小时前', color: '#d97706', bg: '#fffbeb' },
        { level: 'low', title: '反洗钱名单校验规则更新', desc: '规则配置变更，需关注接口兼容性', time: '昨天', color: '#0891b2', bg: '#ecfeff' }
    ];

    const body = document.getElementById('impactAlertBody');
    if (!body) return;

    const levelText = { critical: '严重', high: '高', medium: '中', low: '低' };

    body.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:8px">
            ${alertData.map(function(a) {
                return `
                    <div class="row-clickable" style="display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid #fed7aa;border-radius:6px;background:${a.bg}"
                         onclick="govNav('pages/workspace/impact-alert.html', ['首页','工作台','影响分析预警'], {level:'${a.level}'})">
                        <span style="padding:3px 8px;border-radius:4px;background:${a.color};color:#fff;font-size:11px;font-weight:600;flex-shrink:0">${levelText[a.level]}</span>
                        <div style="flex:1;min-width:0">
                            <div style="font-size:13px;font-weight:600;color:#1e293b;margin-bottom:2px">${a.title}</div>
                            <div style="font-size:12px;color:#64748b">${a.desc}</div>
                        </div>
                        <span style="font-size:11px;color:#94a3b8;flex-shrink:0"><i class="fa fa-clock-o" style="margin-right:3px"></i>${a.time}</span>
                        <i class="fa fa-angle-right" style="color:#94a3b8;flex-shrink:0"></i>
                    </div>
                `;
            }).join('')}
        </div>
    `;

    // 整张卡片点击跳转
    const card = document.getElementById('cardImpactAlert');
    if (card) {
        card.addEventListener('click', function(e) {
            if (!e.target.closest('.row-clickable') && !e.target.closest('.text-link')) {
                govNav('pages/workspace/impact-alert.html', ['首页','工作台','影响分析预警'], {});
            }
        });
    }
})();

// ====== 3. 接口分级分布 ======
(function() {
    const levelData = [
        { label: 'A级（核心）', value: 186, percent: 15, code: 'A', color: '#dc2626' },
        { label: 'B级（重要）', value: 518, percent: 42, code: 'B', color: '#d97706' },
        { label: 'C级（一般）', value: 456, percent: 37, code: 'C', color: '#059669' },
        { label: 'D级（低优）', value: 82, percent: 6, code: 'D', color: '#1e40af' }
    ];
    const total = levelData.reduce(function(sum, i) { return sum + i.value; }, 0);
    const body = document.getElementById('levelBody');
    if (!body) return;

    // 圆环图的 conic-gradient 参数
    let prevDeg = 0;
    let gradStops = levelData.map(function(l) {
        const endDeg = prevDeg + (l.value / total * 360);
        const stop = l.color + ' ' + prevDeg.toFixed(1) + 'deg ' + endDeg.toFixed(1) + 'deg';
        prevDeg = endDeg;
        return stop;
    }).join(', ');

    body.innerHTML = `
        <div style="display:flex;align-items:center;gap:32px">
            <div style="position:relative;width:160px;height:160px;border-radius:50%;background:conic-gradient(${gradStops});display:flex;align-items:center;justify-content:center;flex-shrink:0">
                <div style="width:100px;height:100px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 8px #f8fafc">
                    <div style="font-size:22px;font-weight:700;color:#1e293b">${total}</div>
                    <div style="font-size:11px;color:#64748b;margin-top:2px">接口总数</div>
                </div>
            </div>
            <div style="flex:1" id="levelRows">
                ${levelData.map(function(l) {
                    return `
                        <div class="level-row row-clickable" data-level="${l.code}" style="display:flex;align-items:center;margin-bottom:14px;padding:6px 8px;border-radius:4px">
                            <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${l.color};margin-right:10px;flex-shrink:0"></span>
                            <span style="flex:1;font-size:13px;color:#1e293b;font-weight:500">${l.label}</span>
                            <span style="font-size:14px;font-weight:700;color:#1e293b;width:50px;text-align:right">${l.value}</span>
                            <span style="font-size:12px;color:#64748b;width:50px;text-align:right">${l.percent}%</span>
                        </div>
                    `;
                }).join('')}
            </div>
        </div>
    `;

    // 每行点击跳转到接口清单（带分级筛选）
    body.querySelectorAll('.level-row').forEach(function(row) {
        const code = row.getAttribute('data-level');
        row.addEventListener('click', function() {
            navTo('pages/interface/list.html', ['首页', '服务目录', '接口服务清单'], { level: code });
        });
    });

    // 整张卡片点击：跳转到接口清单
    const card = document.getElementById('card-levelDist');
    if (card) {
        card.addEventListener('click', function(e) {
            // 如果用户点击了某一行，让行的事件优先；否则整张卡片跳转到接口清单
            if (!e.target.closest('.level-row')) {
                navTo('pages/interface/list.html', ['首页', '服务目录', '接口服务清单'], {});
            }
        });
    }
})();



// ====== 5. 发起申请快捷入口 ======
(function() {
    const applyShortcuts = [
        { title: '接口注册申请',  desc: '新接口注册、提交基本信息并定义接口', color: '#2563eb', bg: '#eff6ff', icon: 'fa-plus-circle',
          url: 'pages/application/register-apply.html', crumb: ['首页', '申请流程管理', '接口注册申请'] },
        { title: '接口变更申请',  desc: '已上线接口的字段、版本变更申请',    color: '#d97706', bg: '#fff7ed', icon: 'fa-pencil-square-o',
          url: 'pages/application/change-apply.html',   crumb: ['首页', '申请流程管理', '接口变更申请'] },
        { title: '服务调用申请',  desc: '申请调用已发布的接口服务',          color: '#059669', bg: '#ecfdf5', icon: 'fa-plug',
          url: 'pages/application/call-apply.html',     crumb: ['首页', '申请流程管理', '服务调用申请'] },
        { title: '文件服务注册',  desc: '新增文件服务的字段、格式定义',      color: '#7c3aed', bg: '#f5f3ff', icon: 'fa-file-o',
          url: 'pages/application/file-register-apply.html', crumb: ['首页', '申请流程管理', '文件服务注册'] },
        { title: '文件服务变更',  desc: '已发布文件服务的字段调整、版本更新', color: '#be185d', bg: '#fdf2f8', icon: 'fa-exchange',
          url: 'pages/application/file-change-apply.html',   crumb: ['首页', '申请流程管理', '文件服务变更'] },

    ];
    const body = document.getElementById('applyShortcutBody');
    if (!body) return;

    body.innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
            ${applyShortcuts.map(function(s, i) {
                return `
                    <div data-apply-index="${i}" class="row-clickable" style="display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;cursor:pointer;transition:all 0.15s"
                         onmouseover="this.style.background='${s.bg}';this.style.borderColor='${s.color}'"
                         onmouseout="this.style.background='#fff';this.style.borderColor='#e2e8f0'">
                        <div style="width:36px;height:36px;border-radius:8px;background:${s.bg};color:${s.color};display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px">
                            <i class="fa ${s.icon}"></i>
                        </div>
                        <div style="flex:1;min-width:0">
                            <div style="font-size:13px;color:#1e293b;font-weight:600;margin-bottom:4px">${s.title}</div>
                            <div style="font-size:12px;color:#64748b;line-height:1.5">${s.desc}</div>
                        </div>
                    </div>
                `;
            }).join('')}
        </div>

    body.querySelectorAll('[data-apply-index]').forEach(function(row) {
        const idx = parseInt(row.getAttribute('data-apply-index'));
        const s = applyShortcuts[idx];
        row.addEventListener('click', function() {
            navTo(s.url, s.crumb, {});
        });
    });
})();

// ====== 6. 常用功能入口 ======
(function() {
    const shortcuts = [
        { icon: 'fa-plus-circle', label: '发起申请', color: '#2563eb',
          url: 'pages/application/register-apply.html', crumb: ['首页', '申请流程管理', '接口注册申请'] },
        { icon: 'fa-search', label: '接口服务清单', color: '#059669',
          url: 'pages/interface/list.html', crumb: ['首页', '服务目录', '接口服务清单'] },
        { icon: 'fa-file-text-o', label: '文件服务', color: '#7c3aed',
          url: 'pages/interface/list.html', crumb: ['首页', '服务目录', '接口服务清单'] },
        { icon: 'fa-check-square-o', label: '审核工作台', color: '#d97706',
          url: 'pages/rule/audit-workbench.html', crumb: ['首页', '规则引擎与审核管理', '审核工作台'] },
        { icon: 'fa-users', label: '系统管理', color: '#0284c7',
          url: 'pages/system/system-list.html', crumb: ['首页', '系统管理', '系统清单'] },
        { icon: 'fa-bar-chart', label: '治理报表', color: '#dc2626',
          url: 'pages/report/governance.html', crumb: ['首页', '报表统计', '治理报表'] },
        { icon: 'fa-paper-plane-o', label: '传输监控', color: '#0891b2',
          url: 'pages/transfer/record.html', crumb: ['首页', '文件传输监控与SLA', '传输记录'] },
        { icon: 'fa-shield', label: '数据安全', color: '#be185d',
          url: 'pages/security/sensitive-identify.html', crumb: ['首页', '文件安全与数据保护', '敏感数据识别'] }
    ];
    const body = document.getElementById('shortcutBody');
    if (!body) return;

    body.innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
            ${shortcuts.map(function(s, i) {
                return `
                    <div class="row-clickable" data-shortcut-index="${i}" style="display:flex;flex-direction:column;align-items:center;padding:12px 4px;border-radius:8px;background:#f8fafc;text-align:center">
                        <div style="width:40px;height:40px;border-radius:10px;background:${s.color};color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:8px;font-size:16px">
                            <i class="fa ${s.icon}"></i>
                        </div>
                        <div style="font-size:12px;color:#1e293b;font-weight:500;line-height:1.3">${s.label}</div>
                    </div>
                `;
            }).join('')}
        </div>
    `;

    body.querySelectorAll('[data-shortcut-index]').forEach(function(row) {
        const idx = parseInt(row.getAttribute('data-shortcut-index'));
        const s = shortcuts[idx];
        row.addEventListener('click', function() {
            navTo(s.url, s.crumb, {});
        });
    });
})();
</script>

</body>
</html>
