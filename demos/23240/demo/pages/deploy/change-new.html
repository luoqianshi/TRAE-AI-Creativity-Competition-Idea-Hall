<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增变更单 - 投产管理</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        .change-form { background:#fff; border:1px solid var(--border-color); border-radius:var(--radius); padding:20px; margin-bottom:16px; }
        .form-section { margin-bottom:24px; }
        .form-section-title { font-size:14px; font-weight:600; color:var(--text-primary); margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border-color); display:flex; align-items:center; gap:8px; }
        .form-section-title i { color:var(--primary); }
        .form-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px 20px; }
        .form-grid .full { grid-column:1/-1; }
        .form-item select.form-control { background:#fff; }
        .tag-input-box { display:flex; flex-wrap:wrap; gap:6px; padding:8px 12px; border:1px solid var(--border-color); border-radius:4px; min-height:40px; background:#fff; align-items:center; }
        .tag-input-box input { border:none; outline:none; flex:1; min-width:160px; font-size:13px; }
        .tag-chip { background:#eff6ff; color:#1e40af; padding:4px 10px; border-radius:3px; font-size:12px; display:inline-flex; align-items:center; gap:6px; }
        .tag-chip i { cursor:pointer; font-size:10px; opacity:.7; }
        .tag-chip i:hover { opacity:1; color:#dc2626; }
        .change-type-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:8px; }
        .change-type-card { padding:12px; border:1px solid var(--border-color); border-radius:6px; text-align:center; cursor:pointer; transition:all 0.15s; font-size:12px; }
        .change-type-card:hover { border-color:var(--primary); }
        .change-type-card.selected { border-color:var(--primary); background:#eff6ff; color:var(--primary); font-weight:600; }
        .change-type-card i { font-size:18px; display:block; margin-bottom:6px; }
        .preview-box { background:#f8fafc; border:1px solid var(--border-color); border-radius:6px; padding:12px 14px; font-size:12px; color:var(--text-secondary); }
        .preview-box b { color:var(--text-primary); font-weight:600; }
    </style>
<script src="../../js/nav-helper.js"></script>
</head>
<body>
<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-plus-square" style="color:var(--primary);margin-right:8px"></i>新增变更单</h2>
            <div class="page-desc">
                登记接口 / 文件服务的变更请求，用于后续投产批次编排
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default" onclick="govNav('pages/deploy/change-order.html', ['首页','投产管理','变更单管理'], {})"><i class="fa fa-arrow-left"></i> 返回列表</button>
            <button class="btn btn-default" onclick="alert('Demo：已保存为草稿')"><i class="fa fa-floppy-o"></i> 保存草稿</button>
            <button class="btn btn-primary" onclick="submitChange()"><i class="fa fa-paper-plane"></i> 提交变更</button>
        </div>
    </div>

    <!-- ====== 基本信息 ====== -->
    <div class="change-form">
        <div class="form-section-title"><i class="fa fa-info-circle"></i>一、变更基本信息</div>
        <div class="form-grid">
            <div class="form-item">
                <label>变更单编号</label>
                <input class="form-control" value="CHG-20260608-001" readonly style="background:#f8fafc">
            </div>
            <div class="form-item">
                <label>变更类型 <span style="color:var(--danger)">*</span></label>
                <select class="form-control" id="chgType">
                    <option value="接口变更">接口变更</option>
                    <option value="文件变更">文件变更</option>
                    <option value="配置变更">配置变更</option>
                    <option value="混合变更">混合变更（接口+文件）</option>
                </select>
            </div>
            <div class="form-item">
                <label>变更标题 <span style="color:var(--danger)">*</span></label>
                <input class="form-control" id="chgTitle" placeholder="如：核心账务系统 v2.4 字段标准化升级">
            </div>
            <div class="form-item">
                <label>变更等级 <span style="color:var(--danger)">*</span></label>
                <select class="form-control" id="chgLevel">
                    <option>一般变更</option>
                    <option>重大变更</option>
                    <option>紧急变更</option>
                </select>
            </div>
            <div class="form-item">
                <label>关联业务系统 <span style="color:var(--danger)">*</span></label>
                <select class="form-control">
                    <option>核心账务系统</option>
                    <option>客户管理系统</option>
                    <option>信贷管理系统</option>
                    <option>支付清算系统</option>
                    <option>风险管理系统</option>
                    <option>对账中心</option>
                    <option>商户管理系统</option>
                </select>
            </div>
            <div class="form-item">
                <label>负责人 <span style="color:var(--danger)">*</span></label>
                <input class="form-control" placeholder="请输入负责人姓名">
            </div>
            <div class="form-item">
                <label>计划投产日期 <span style="color:var(--danger)">*</span></label>
                <input class="form-control" value="2026-06-15">
            </div>
            <div class="form-item">
                <label>影响业务领域</label>
                <select class="form-control">
                    <option>个人金融业务</option>
                    <option>对公金融业务</option>
                    <option>信贷业务</option>
                    <option>支付清算业务</option>
                    <option>全业务</option>
                </select>
            </div>
        </div>
    </div>

    <!-- ====== 变更内容 ====== -->
    <div class="change-form">
        <div class="form-section-title"><i class="fa fa-list-ul"></i>二、变更类型选择</div>
        <div class="change-type-grid">
            <div class="change-type-card selected" onclick="selectType(this, '字段变更')">
                <i class="fa fa-pencil-square-o"></i>字段变更
            </div>
            <div class="change-type-card" onclick="selectType(this, '字段新增')">
                <i class="fa fa-plus-circle"></i>字段新增
            </div>
            <div class="change-type-card" onclick="selectType(this, '字段删除')">
                <i class="fa fa-trash-o"></i>字段删除
            </div>
            <div class="change-type-card" onclick="selectType(this, '格式变更')">
                <i class="fa fa-file-text-o"></i>格式变更
            </div>
            <div class="change-type-card" onclick="selectType(this, '编码变更')">
                <i class="fa fa-code"></i>编码变更
            </div>
            <div class="change-type-card" onclick="selectType(this, '协议升级')">
                <i class="fa fa-exchange"></i>协议升级
            </div>
            <div class="change-type-card" onclick="selectType(this, '配置调整')">
                <i class="fa fa-sliders"></i>配置调整
            </div>
            <div class="change-type-card" onclick="selectType(this, '其他')">
                <i class="fa fa-ellipsis-h"></i>其他
            </div>
        </div>

        <div style="margin-top:16px">
            <div style="font-size:12px; color:var(--text-secondary); margin-bottom:8px"><i class="fa fa-exclamation-triangle" style="color:#d97706"></i> 提示：选择变更类型后，下方将自动展示对应字段清单</div>
            <div class="preview-box" id="changePreview">
                <b>当前选择：</b>字段变更 &nbsp;&nbsp; <b>影响范围：</b>接口入参 / 出参字段定义调整
            </div>
        </div>
    </div>

    <!-- ====== 变更描述 ====== -->
    <div class="change-form">
        <div class="form-section-title"><i class="fa fa-file-text-o"></i>三、变更详细描述</div>
        <div class="form-grid">
            <div class="form-item full">
                <label>变更内容描述 <span style="color:var(--danger)">*</span></label>
                <textarea class="form-control" rows="4" placeholder="请描述本次变更的具体内容、修改目的..."></textarea>
            </div>
            <div class="form-item full">
                <label>变更影响分析 <span style="color:var(--danger)">*</span></label>
                <textarea class="form-control" rows="3" placeholder="请描述本次变更对消费方、系统间调用、数据一致性等方面的影响..."></textarea>
            </div>
            <div class="form-item">
                <label>回滚方案 <span style="color:var(--danger)">*</span></label>
                <select class="form-control">
                    <option>版本回退 + 配置还原（推荐）</option>
                    <option>仅版本回退</option>
                    <option>灰度切换</option>
                    <option>其他</option>
                </select>
            </div>
            <div class="form-item">
                <label>风险等级</label>
                <select class="form-control">
                    <option>低风险</option>
                    <option>中风险</option>
                    <option>高风险</option>
                </select>
            </div>
        </div>

        <div style="margin-top:16px">
            <label style="font-size:12px; color:var(--text-secondary); display:block; margin-bottom:6px">变更标签（便于后续检索）</label>
            <div class="tag-input-box" id="tagBox">
                <span class="tag-chip">字段标准化 <i class="fa fa-times" onclick="this.parentElement.remove()"></i></span>
                <span class="tag-chip">v2.4升级 <i class="fa fa-times" onclick="this.parentElement.remove()"></i></span>
                <input type="text" placeholder="输入标签后按回车添加..." onkeydown="if(event.key==='Enter' && this.value.trim()){ addTag(this.value.trim()); this.value=''; event.preventDefault(); } ">
            </div>
        </div>
    </div>

    <!-- ====== 变更提交信息 ====== -->
    <div class="change-form">
        <div class="form-section-title"><i class="fa fa-paperclip"></i>四、附件与备注</div>
        <div class="form-grid">
            <div class="form-item full">
                <label>附件上传</label>
                <div style="border:2px dashed var(--border-color); border-radius:6px; padding:30px; text-align:center; color:var(--text-secondary); font-size:12px">
                    <i class="fa fa-cloud-upload" style="font-size:32px; display:block; margin-bottom:10px"></i>
                    点击或拖拽文件到此处上传（支持 PDF / Word / Excel，单个文件不超过 20MB）
                </div>
            </div>
            <div class="form-item full">
                <label>备注</label>
                <textarea class="form-control" rows="2" placeholder="备注信息..."></textarea>
            </div>
        </div>
    </div>

</div>

<script>
function selectType(el, type) {
    document.querySelectorAll('.change-type-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('changePreview').innerHTML =
        '<b>当前选择：</b>' + type + ' &nbsp;&nbsp; <b>影响范围：</b>请在下方补充具体修改字段名称';
}

function addTag(val) {
    const span = document.createElement('span');
    span.className = 'tag-chip';
    span.innerHTML = val + ' <i class="fa fa-times" onclick="this.parentElement.remove()"></i>';
    document.getElementById('tagBox').appendChild(span);
}

function submitChange() {
    if (!document.getElementById('chgTitle').value.trim()) { alert('请填写变更标题'); return; }
    if (!confirm('确认提交变更单审核？\n编号：CHG-20260608-001')) return;
    alert('Demo：变更单已提交审核！\n\n编号：CHG-20260608-001\n审核状态：待审核');
    govNav('pages/deploy/change-order.html', ['首页','投产管理','变更单管理'], {});
}
</script>
</body>
</html>
