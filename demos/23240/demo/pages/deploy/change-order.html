<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>变更单管理 - 投产管理</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        .co-tag { display:inline-block; font-family:'Segoe UI'; font-weight:600; color:#1e40af; font-size:13px; }
        .env-tag { display:inline-block; padding:1px 6px; font-size:11px; border:1px solid #c7d2fe; background:#eef2ff; color:#1e40af; border-radius:3px; margin-right:2px; }
        .env-tag-only { display:inline-block; padding:2px 8px; font-size:11px; border:1px solid #fbbf24; background:#fffbeb; color:#92400e; border-radius:3px; }
        .ver-tag { display:inline-block; font-family:'Segoe UI'; font-weight:600; color:#0f766e; font-size:12px; }
    </style>
<script src="../../js/nav-helper.js"></script>
</head>
<body>
<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-file-text-o" style="color:var(--primary);margin-right:8px"></i>变更单管理</h2>
            <div class="page-desc">
                对接口与文件服务的变更请求进行登记、跟踪，是投产批次管理与变更审计的基础单据
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-primary" onclick="govNav('pages/deploy/change-new.html', ['首页','投产管理','新增变更单'],{})"><i class="fa fa-plus-circle"></i> 新增变更单</button>
            <button class="btn btn-default" onclick="alert('Demo：下载变更单模板')"><i class="fa fa-file-text-o"></i> 变更单模板</button>
        </div>
    </div>

    <!-- ====== 筛选区 ====== -->
    <div class="filter-bar">
        <div class="form-row">
            <div class="form-item">
                <label>状态</label>
                <select class="form-control"><option>全部</option><option>草稿</option><option>待投产</option><option>已投产</option><option>已回滚</option></select>
            </div>
            <div class="form-item">
                <label>创建时间</label>
                <input type="text" class="form-control" placeholder="2026-06-01 至 2026-06-30">
            </div>
            <div class="form-item">
                <label>负责人</label>
                <input type="text" class="form-control" placeholder="姓名">
            </div>
            <div class="form-item">
                <label>关联系统</label>
                <select class="form-control"><option>全部系统</option><option>核心账务系统</option><option>客户管理系统</option><option>信贷管理系统</option><option>支付清算系统</option></select>
            </div>
            <div class="form-item">
                <label>基准版本</label>
                <input type="text" class="form-control" placeholder="如 v2.3.0">
            </div>
            <div class="form-item">
                <label>影响环境</label>
                <select class="form-control">
                    <option>全部</option>
                    <option>仅 DEV</option>
                    <option>仅 SIT</option>
                    <option>仅 UAT</option>
                    <option>仅 PROD</option>
                    <option>多环境</option>
                </select>
            </div>
            <div class="form-item" style="min-width:auto">
                <button class="btn btn-primary"><i class="fa fa-search"></i> 查询</button>
                <button class="btn btn-default"><i class="fa fa-eraser"></i> 重置</button>
            </div>
        </div>
    </div>

    <!-- ====== 变更单列表 ====== -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><i class="fa fa-list"></i> 变更单列表</div>
            <div class="card-action"><span style="font-size:12px;color:var(--text-secondary)">共 32 条</span></div>
        </div>
        <div class="table-wrapper" style="border-left:none;border-right:none;border-top:none;border-radius:0">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width:150px">变更单号</th>
                        <th>变更标题</th>
                        <th style="width:100px" class="text-center">关联接口数</th>
                        <th style="width:160px">关联系统</th>
                        <th style="width:100px">负责人</th>
                        <th style="width:130px">计划投产日期</th>
                        <th style="width:90px" class="text-center">当前状态</th>
                        <th style="width:100px">基准版本</th>
                        <th style="width:180px">影响环境</th>
                        <th style="width:130px">创建时间</th>
                        <th style="width:200px" class="text-center">操作</th>
                    </tr>
                </thead>
                <tbody id="coBody"></tbody>
            </table>
        </div>
        <div class="pagination">
            <div class="page-info">共 <span class="text-primary">32</span> 条</div>
            <div class="page-list">
                <button><i class="fa fa-angle-left"></i></button>
                <button class="active">1</button><button>2</button><button>3</button>
                <button><i class="fa fa-angle-right"></i></button>
            </div>
            <div class="page-size">
                <select class="form-control" style="height:32px"><option>10 条/页</option><option>20 条/页</option></select>
            </div>
        </div>
    </div>

</div>

<script>
(function () {
    const orders = [
        { no:'CHG-20260601-001', title:'核心账务系统接口 v2.4 升级（字段标准化改造）', apis:18, sys:'核心账务系统', owner:'张工', date:'2026-06-15', status:'已投产', created:'2026-05-28 09:30', baseVersion:'v2.3.8', affectedEnvs:['DEV','SIT','UAT','PROD'] },
        { no:'CHG-20260601-002', title:'客户信息查询接口增加新客户类型字段', apis:4, sys:'客户管理系统', owner:'王工', date:'2026-06-18', status:'待投产', created:'2026-05-30 14:12', baseVersion:'v1.5.0', affectedEnvs:['DEV','SIT','UAT'] },
        { no:'CHG-20260601-003', title:'信贷额度占用接口改造（非标字段统一）', apis:10, sys:'信贷管理系统', owner:'刘工', date:'2026-06-22', status:'待投产', created:'2026-06-02 10:58', baseVersion:'v2.1.3', affectedEnvs:['DEV','SIT','UAT','PROD'] },
        { no:'CHG-20260601-004', title:'支付清算系统 v3.0 接口升级', apis:9, sys:'支付清算系统', owner:'陈工', date:'2026-06-28', status:'待投产', created:'2026-06-03 16:45', baseVersion:'v3.0.0', affectedEnvs:['PROD'] },
        { no:'CHG-20260601-005', title:'风险评分模型 v1.7 → v1.8 字段调整', apis:6, sys:'风险管理系统', owner:'孙工', date:'2026-07-01', status:'草稿', created:'2026-06-05 11:22', baseVersion:'v1.7.0', affectedEnvs:['DEV','SIT'] },
        { no:'CHG-20260601-006', title:'商户结算文件格式调整（新增结算币种字段）', apis:3, sys:'商户管理系统', owner:'周工', date:'2026-06-20', status:'已投产', created:'2026-05-22 15:08', baseVersion:'v1.2.5', affectedEnvs:['DEV','SIT','UAT','PROD'] },
        { no:'CHG-20260601-007', title:'反洗钱监测接口字段调整', apis:5, sys:'风险管理系统', owner:'吕工', date:'2026-06-12', status:'已回滚', created:'2026-05-18 09:58', baseVersion:'v2.0.1', affectedEnvs:['UAT'] },
        { no:'CHG-20260601-008', title:'对账中心文件生成规则优化', apis:2, sys:'对账中心', owner:'吴工', date:'2026-06-25', status:'草稿', created:'2026-06-06 17:32', baseVersion:'v1.0.0', affectedEnvs:['DEV'] },
        { no:'CHG-20260601-009', title:'ECIF 客户信息平台 v2.1 字段变更', apis:12, sys:'客户管理系统', owner:'许工', date:'2026-06-30', status:'待投产', created:'2026-06-07 13:10', baseVersion:'v2.1.0', affectedEnvs:['DEV','SIT','UAT','PROD'] }
    ];
    const statusMap = { '草稿':'tag-default', '待投产':'tag-warning', '已投产':'tag-success', '已回滚':'tag-danger' };

    // 将影响环境数组渲染为 tag 组合：多环境用 DEV·SIT·UAT·PROD，单环境用 仅UAT 样式
    function renderEnvs(envs) {
        if (!envs || envs.length === 0) return '<span style="color:#94a3b8;font-size:12px">-</span>';
        if (envs.length === 1) {
            return '<span class="env-tag-only">仅 ' + envs[0] + '</span>';
        }
        return envs.map(e => '<span class="env-tag">' + e + '</span>').join('');
    }

    document.getElementById('coBody').innerHTML = orders.map(o => `
        <tr>
            <td><span class="co-tag">${o.no}</span></td>
            <td>${o.title}</td>
            <td class="text-center num">${o.apis}</td>
            <td>${o.sys}</td>
            <td>${o.owner}</td>
            <td>${o.date}</td>
            <td class="text-center"><span class="tag ${statusMap[o.status]}" style="font-size:11px">${o.status}</span></td>
            <td><span class="ver-tag">${o.baseVersion}</span></td>
            <td>${renderEnvs(o.affectedEnvs)}</td>
            <td style="font-size:12px">${o.created}</td>
            <td class="text-center">
                <a class="btn-link"><i class="fa fa-eye"></i> 查看</a>
                <a class="btn-link"><i class="fa fa-pencil"></i> 编辑</a>
                <a class="btn-link" style="color:var(--danger)"><i class="fa fa-trash-o"></i> 删除</a>
            </td>
        </tr>
    `).join('');
})();
</script>
</body>
</html>
