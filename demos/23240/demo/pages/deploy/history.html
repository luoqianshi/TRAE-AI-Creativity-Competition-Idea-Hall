<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投产历史记录 - 投产管理</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        .hist-timeline { background:#fff; border:1px solid var(--border-color); border-radius:var(--radius); padding:18px 24px; }
        .hist-node { position:relative; padding:16px 0 16px 28px; border-left:3px solid var(--border-color); }
        .hist-node:last-child { border-left:3px solid transparent; }
        .hist-node::before { content:''; position:absolute; left:-9px; top:22px; width:15px; height:15px; border-radius:50%; background:#fff; border:3px solid var(--primary); }
        .hist-card { background:#f8fafc; border-radius:6px; padding:14px 16px; border:1px solid var(--border-color); }
        .hist-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
        .hist-title { font-size:14px; font-weight:700; color:var(--text-primary); }
        .hist-no { font-size:12px; color:var(--text-secondary); margin-top:3px; font-family:'Segoe UI'; }
        .hist-info { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; padding:8px 0; font-size:12px; border-top:1px dashed var(--border-color); }
        .hist-info > div .label { color:var(--text-secondary); font-size:11px; margin-bottom:2px; }
        .hist-info > div .val { color:var(--text-primary); font-weight:600; font-size:13px; }
        .hist-action { margin-top:10px; padding-top:10px; border-top:1px dashed var(--border-color); display:flex; justify-content:flex-end; gap:10px; }
    </style>
<script src="../../js/nav-helper.js"></script>
</head>
<body>
<div class="page-wrapper">

    <!-- ====== 页面标题区 ====== -->
    <div class="page-header">
        <div class="title-group">
            <h2><i class="fa fa-history" style="color:var(--primary);margin-right:8px"></i>投产历史记录</h2>
            <div class="page-desc">
                按时间倒序展示所有已完成的投产批次，提供历史追溯、审计查询与应急回滚入口
            </div>
        </div>
        <div class="action-group">
            <button class="btn btn-default" onclick="alert('Demo：导出历史记录')"><i class="fa fa-file-excel-o"></i> 导出历史报告</button>
        </div>
    </div>

    <!-- ====== 筛选区 ====== -->
    <div class="filter-bar">
        <div class="form-row">
            <div class="form-item">
                <label>时间范围</label>
                <input type="text" class="form-control" placeholder="2026-01-01 至 2026-06-30">
            </div>
            <div class="form-item">
                <label>批次类型</label>
                <select class="form-control"><option>全部</option><option>常规投产</option><option>紧急投产</option><option>重大升级</option></select>
            </div>
            <div class="form-item">
                <label>负责人</label>
                <input type="text" class="form-control" placeholder="姓名">
            </div>
            <div class="form-item" style="min-width:auto">
                <button class="btn btn-primary"><i class="fa fa-search"></i> 查询</button>
                <button class="btn btn-default"><i class="fa fa-eraser"></i> 重置</button>
            </div>
        </div>
    </div>

    <!-- ====== 历史时间线 ====== -->
    <div class="hist-timeline">
        <div id="histBody"></div>
        <div style="text-align:center; padding:14px; color:var(--text-secondary); font-size:12px; border-top:1px solid var(--border-color); margin-top:16px">
            <i class="fa fa-spinner" style="margin-right:6px"></i>加载更多历史...
        </div>
    </div>

</div>

<script>
(function () {
    const items = [
        { no:'BAT-20260615', title:'6月中旬核心系统投产批次', date:'2026-06-15 22:45', chg:3, api:'18接口/4文件', owner:'张工', status:'成功', tag:'tag-success', remark:'核心账务 v2.4 升级顺利，业务验证通过' },
        { no:'BAT-20260618', title:'客户信息接口专项批次', date:'2026-06-18 22:30', chg:2, api:'6接口/1文件', owner:'王工', status:'成功', tag:'tag-success', remark:'客户信息字段改造完成' },
        { no:'BAT-20260610', title:'文件服务 v2.1 合并批次', date:'2026-06-10 22:18', chg:4, api:'12接口/8文件', owner:'刘工', status:'部分成功', tag:'tag-warning', remark:'文件 FILE-LOAN-0088 未能在窗口内完成，已纳入下次批次' },
        { no:'BAT-20260605', title:'ECIF 客户信息平台升级', date:'2026-06-05 22:50', chg:2, api:'10接口/0文件', owner:'许工', status:'失败', tag:'tag-danger', remark:'数据库连接异常，已启动回滚' },
        { no:'BAT-20260605-RB', title:'ECIF 客户信息平台回滚', date:'2026-06-05 23:15', chg:1, api:'—', owner:'运维组', status:'已回滚', tag:'tag-default', remark:'按回滚预案执行，15 分钟内恢复至 v2.0' },
        { no:'BAT-20260528', title:'5月末常规批次', date:'2026-05-28 22:30', chg:5, api:'22接口/6文件', owner:'陈工', status:'成功', tag:'tag-success', remark:'常规月度投产，业务验证通过' },
        { no:'BAT-20260520', title:'支付清算 v3.0 Beta', date:'2026-05-20 22:40', chg:1, api:'9接口/0文件', owner:'陈工', status:'成功', tag:'tag-success', remark:'v3.0 Beta 灰度发布' },
        { no:'BAT-20260512', title:'反洗钱监测调整批次', date:'2026-05-12 22:28', chg:1, api:'5接口/1文件', owner:'吕工', status:'成功', tag:'tag-success', remark:'规则引擎参数调整' }
    ];
    document.getElementById('histBody').innerHTML = items.map(i => `
        <div class="hist-node">
            <div class="hist-card">
                <div class="hist-head">
                    <div>
                        <div class="hist-title">${i.title}</div>
                        <div class="hist-no"><i class="fa fa-hashtag" style="margin-right:4px"></i>${i.no} · ${i.date}</div>
                    </div>
                    <span class="tag ${i.tag}" style="font-size:12px;padding:4px 10px">${i.status}</span>
                </div>
                <div style="font-size:12px;color:var(--text-secondary);line-height:1.8;padding-bottom:6px">${i.remark}</div>
                <div class="hist-info">
                    <div><div class="label">变更单数</div><div class="val">${i.chg}</div></div>
                    <div><div class="label">接口/文件</div><div class="val">${i.api}</div></div>
                    <div><div class="label">负责人</div><div class="val">${i.owner}</div></div>
                    <div><div class="label">投产时间</div><div class="val">${i.date}</div></div>
                    <div><div class="label">状态</div><div class="val" style="color:var(--primary)">${i.status}</div></div>
                </div>
                <div class="hist-action">
                    <a class="btn-link" onclick="govNav('pages/deploy/report.html', ['首页','投产管理','投产报告'],{})"><i class="fa fa-file-pdf-o"></i> 查看报告</a>
                    ${i.status==='成功' || i.status==='部分成功' ? `<a class="btn-link" style="color:#dc2626"><i class="fa fa-undo"></i> 回滚</a>` : ''}
                </div>
            </div>
        </div>
    `).join('');
})();
</script>
</body>
</html>
