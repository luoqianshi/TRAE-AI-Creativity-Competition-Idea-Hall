<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银行服务治理平台 - Bank Service Governance Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<style>
    /* 顶部标签栏样式 */
    .tab-bar {
        background: #fff;
        border-bottom: 1px solid #e2e8f0;
        padding: 0 8px;
        display: flex;
        align-items: center;
        overflow-x: auto;
        white-space: nowrap;
        min-height: 38px;
        flex-shrink: 0;
    }
    .tab-bar::-webkit-scrollbar { height: 0; }
    .tab-item-tab {
        display: inline-flex;
        align-items: center;
        padding: 8px 14px;
        font-size: 13px;
        color: #64748b;
        cursor: pointer;
        border-right: 1px solid #e2e8f0;
        position: relative;
        user-select: none;
        transition: all 0.15s;
        gap: 8px;
        flex-shrink: 0;
    }
    .tab-item-tab:first-child { border-left: 1px solid #e2e8f0; }
    .tab-item-tab:hover { background: #f8fafc; color: #334155; }
    .tab-item-tab.active {
        background: #eff6ff;
        color: #2563eb;
        border-bottom: 2px solid #2563eb;
        font-weight: 500;
    }
    .tab-item-tab .tab-icon {
        font-size: 12px;
        color: #94a3b8;
    }
    .tab-item-tab.active .tab-icon { color: #2563eb; }
    .tab-item-tab .tab-close {
        width: 16px; height: 16px;
        display: inline-flex;
        align-items: center; justify-content: center;
        border-radius: 50%;
        color: #94a3b8;
        font-size: 11px;
    }
    .tab-item-tab .tab-close:hover { background: #e2e8f0; color: #dc2626; }
    .tab-item-tab.active .tab-close { color: #2563eb; }
    .tab-item-tab.active .tab-close:hover { background: #2563eb; color: #fff; }

    .main-wrapper { display: flex; flex-direction: column; height: 100vh; }
    .topbar { flex-shrink: 0; }
    .content-area { flex: 1; min-height: 0; position: relative; background: #f1f5f9; }
    .content-area iframe {
        width: 100%; height: 100%;
        border: none; display: block;
        position: absolute; top: 0; left: 0;
    }
    .content-area iframe.hidden-frame { display: none; }
</style>
</head>
<body>

<div class="app-container">

    <!-- ========== 左侧侧边栏 ========== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon"><i class="fa fa-shield"></i></div>
            <div class="logo-text">
                <div class="logo-title">服务治理平台</div>
                <div class="logo-sub">Service Governance</div>
            </div>
        </div>
        <div class="sidebar-menu" id="sidebarMenu"><!-- 菜单项 JS 生成 --></div>
        <div class="sidebar-footer">
            <div class="version"><i class="fa fa-info-circle"></i> <span>版本 V2.3.0</span></div>
        </div>
    </aside>

    <!-- ========== 主内容区 ========== -->
    <div class="main-wrapper">

        <!-- 顶部导航栏 -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle" id="sidebarToggle" title="收起/展开侧边栏"><i class="fa fa-bars"></i></button>
                <nav class="breadcrumb" id="breadcrumb">
                    <span class="bc-icon"><i class="fa fa-home"></i></span>
                    <span class="bc-item">首页</span>
                    <span class="bc-sep">/</span>
                    <span class="bc-item active">首页驾驶舱</span>
                </nav>
            </div>
            <div class="topbar-right">
                <div class="global-search">
                    <i class="fa fa-search"></i>
                    <input type="text" placeholder="全局搜索：接口/系统/字段/申请..." id="globalSearch">
                </div>

                <!-- 消息通知 -->
                <div class="topbar-action notify-wrapper">
                    <button class="icon-btn" id="notifyBtn">
                        <i class="fa fa-bell-o"></i>
                        <span class="badge-dot">9</span>
                    </button>
                    <div class="dropdown notify-dropdown" id="notifyDropdown">
                        <div class="dropdown-header">
                            <span>消息通知</span>
                            <a href="pages/notify/message-list.html" class="dd-link">查看全部</a>
                        </div>
                        <div class="dropdown-list">
                            <div class="dd-item"><div class="dd-icon"><i class="fa fa-file-text-o"></i></div><div class="dd-content"><div class="dd-title">新的申请待审核</div><div class="dd-desc">您有 3 个接口变更申请待审核</div><div class="dd-time">10 分钟前</div></div></div>
                            <div class="dd-item"><div class="dd-icon"><i class="fa fa-exclamation-triangle"></i></div><div class="dd-content"><div class="dd-title">完整性预警</div><div class="dd-desc">客户信息文件服务存在依赖缺失</div><div class="dd-time">1 小时前</div></div></div>
                            <div class="dd-item"><div class="dd-icon"><i class="fa fa-tachometer"></i></div><div class="dd-content"><div class="dd-title">SLA 超阈值</div><div class="dd-desc">账户查询接口响应超时，请关注</div><div class="dd-time">2 小时前</div></div></div>
                        </div>
                    </div>
                </div>

                <!-- 管理后台切换 -->
                <div class="topbar-action">
                    <button class="btn btn-default btn-sm" id="modeSwitchBtn"><i class="fa fa-cogs"></i> 管理后台</button>
                </div>

                <!-- 用户 -->
                <div class="topbar-action user-wrapper">
                    <button class="user-btn" id="userBtn">
                        <div class="user-avatar"><span>ZY</span></div>
                        <div class="user-info">
                            <div class="user-name">张运维</div>
                            <div class="user-role">系统管理员</div>
                        </div>
                        <i class="fa fa-caret-down"></i>
                    </button>
                    <div class="dropdown user-dropdown" id="userDropdown">
                        <div class="dd-item" data-url="pages/system/profile.html"><i class="fa fa-user-circle-o"></i><span>个人中心</span></div>
                        <div class="dd-divider"></div>
                        <div class="dd-item" onclick="alert('退出登录')"><i class="fa fa-sign-out"></i><span>退出系统</span></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- ========== 顶部标签栏（新增） ========== -->
        <div class="tab-bar" id="tabBar">
            <!-- 标签页由 JS 动态生成 -->
        </div>

        <!-- 内容 iframe 容器（多标签共享，每个标签一个 iframe） -->
        <main class="content-area" id="contentArea">
            <!-- iframe 由 JS 动态创建 -->
        </main>
    </div>

</div>

<script src="js/layout.js"></script>
</body>
</html>
