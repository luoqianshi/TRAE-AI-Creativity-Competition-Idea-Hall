                svg += `
                    <circle cx="${s.x}" cy="${s.y}" r="16" fill="${s.color}" filter="url(#shadow)"/>
                    <text x="${s.x}" y="${s.y + 5}" text-anchor="middle" fill="white" font-size="14">${s.label}</text>
                    <text x="${s.x}" y="${s.y + 35}" text-anchor="middle" class="route-label">${s.name}</text>
                `;
            });

            // 图例
            svg += `
                <rect x="15" y="15" width="140" height="90" rx="8" fill="white" fill-opacity="0.95" stroke="#e0e5f0"/>
                <text x="25" y="33" font-size="11" fill="#333" font-weight="bold">📋 图例</text>
                <line x1="25" y1="48" x2="55" y2="48" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="5,3"/>
                <text x="62" y="52" font-size="10" fill="#666">上午行程</text>
                <line x1="25" y1="65" x2="55" y2="65" stroke="#f97316" stroke-width="2.5" stroke-dasharray="8,4"/>
                <text x="62" y="69" font-size="10" fill="#666">下午返程</text>
                <circle cx="35" cy="82" r="5" fill="#22c55e"/>
                <text x="62" y="86" font-size="10" fill="#666">活动地点</text>
            `;

            // 时间标注
            svg += `
                <text x="480" y="480" text-anchor="end" font-size="10" fill="#999">06:00 - 18:00</text>
            `;

            svg += `</svg>`;
            container.innerHTML = svg;
        }

        function renderLeafletMap() {
            if (leafletMap) {
                leafletMap.remove();
                leafletMap = null;
            }
            const container = document.getElementById('leaflet-map');
            container.style.display = 'block';

            const coords = [];
            const stationNames = [];
            tripData.forEach(item => {
                const name = item.title.split(' - ')[0];
                const stationName = item.stationInfo ? item.stationInfo.name : name;
                if (stationCoords[stationName] && !stationNames.includes(stationName)) {
                    stationNames.push(stationName);
                    coords.push({
                        name: stationName,
                        lat: stationCoords[stationName][0],
                        lng: stationCoords[stationName][1],
                        type: item.type
                    });
                }
            });

            if (coords.length === 0) {
                container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;">暂无站点坐标数据，请使用SVG模式</div>';
                return;
            }

            const lats = coords.map(c => c.lat);
            const lngs = coords.map(c => c.lng);
            const centerLat = (Math.min(...lats) + Math.max(...lats)) / 2;
            const centerLng = (Math.min(...lngs) + Math.max(...lngs)) / 2;

            leafletMap = L.map('leaflet-map').setView([centerLat, centerLng], 13);

            L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
                subdomains: ['1', '2', '3', '4'],
                attribution: '&copy; 高德地图'
            }).addTo(leafletMap);

            const latlngs = [];
            coords.forEach((coord, i) => {
                latlngs.push([coord.lat, coord.lng]);
                let iconHtml = '';
                let iconColor = '#48bb78';
                if (coord.type === 'start') {
                    iconHtml = '<div style="background:#667eea;color:white;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);">起</div>';
                } else if (coord.type === 'end') {
                    iconHtml = '<div style="background:#764ba2;color:white;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);">终</div>';
                } else {
                    iconHtml = `<div style="background:#48bb78;width:20px;height:20px;border-radius:50%;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);"></div>`;
                }
                const icon = L.divIcon({
                    html: iconHtml,
                    className: 'custom-marker',
                    iconSize: coord.type === 'start' || coord.type === 'end' ? [28, 28] : [20, 20],
                    iconAnchor: coord.type === 'start' || coord.type === 'end' ? [14, 14] : [10, 10]
                });
                L.marker([coord.lat, coord.lng], { icon: icon })
                    .addTo(leafletMap)
                    .bindPopup(`<b>${coord.name}</b>`);
            });

            if (latlngs.length > 1) {
                L.polyline(latlngs, { color: '#667eea', weight: 4, opacity: 0.7, dashArray: '8, 5' }).addTo(leafletMap);
            }

            leafletMap.fitBounds(latlngs.map(c => [c.lat, c.lng]), { padding: [50, 50] });
        }

        function toggleMapMode() {
            const svgMap = document.getElementById('svg-map');
            const leafletMapDiv = document.getElementById('leaflet-map');
            const toggleBtn = document.getElementById('mapToggle');
            const fallbackNotice = document.getElementById('fallbackNotice');

            if (currentMapMode === 'svg') {
                svgMap.style.display = 'none';
                leafletMapDiv.style.display = 'block';
                fallbackNotice.style.display = 'none';
                toggleBtn.textContent = 'SVG示意图';
                toggleBtn.classList.add('active');
                currentMapMode = 'leaflet';
                renderLeafletMap();
            } else {
                if (leafletMap) {
                    leafletMap.remove();
                    leafletMap = null;
                }
                leafletMapDiv.style.display = 'none';
                svgMap.style.display = 'block';
                fallbackNotice.style.display = 'block';
                toggleBtn.textContent = '切换地图';
                toggleBtn.classList.remove('active');
                currentMapMode = 'svg';
            }
        }

        function checkNetworkAndInitMap() {
            const hasCoords = Object.keys(stationCoords).length > 0;
            const testImg = new Image();
            testImg.onload = function() {
                if (hasCoords) {
                    toggleMapMode();
                }
            };
            testImg.onerror = function() {
                document.getElementById('fallbackNotice').style.display = 'block';
            };
            testImg.src = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/images/marker-icon.png';
        }

        renderTimeline();
        renderSVGMap();
        checkNetworkAndInitMap();
    </script>
</body>
