<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>未来星轨 · 多维潜能测评</title>
    <style>
        /* ===== 全局重置 & 未来科技风 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap');

        :root {
            --bg-primary: #0a0e1a;
            --bg-card: rgba(18, 28, 50, 0.75);
            --glow-cyan: #00f0ff;
            --glow-purple: #a855f7;
            --glow-pink: #f472b6;
            --glow-blue: #3b82f6;
            --text-primary: #e8f0fe;
            --text-secondary: #94a3b8;
            --border-glow: rgba(0, 240, 255, 0.25);
            --shadow-glow: 0 0 40px rgba(0, 240, 255, 0.08);
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(0, 240, 255, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(168, 85, 247, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(244, 114, 182, 0.03) 0%, transparent 50%);
        }

        /* 粒子背景 (纯CSS) */
        .particle-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle-bg span {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--glow-cyan);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--glow-cyan);
            animation: float-particle linear infinite;
            opacity: 0.3;
        }
        @keyframes float-particle {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.4;
            }
            90% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--glow-cyan);
            border-radius: 12px;
            box-shadow: 0 0 20px var(--glow-cyan);
        }

        /* ===== 通用容器 ===== */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 24px 60px;
        }

        /* ===== 顶部标题 ===== */
        .app-header {
            text-align: center;
            padding: 32px 0 24px;
            position: relative;
        }
        .app-header h1 {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 2.8rem;
            letter-spacing: 4px;
            background: linear-gradient(135deg, var(--glow-cyan), var(--glow-purple), var(--glow-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 60px rgba(0, 240, 255, 0.15);
            animation: title-pulse 4s ease-in-out infinite;
        }
        @keyframes title-pulse {
            0%,
            100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.25);
            }
        }
        .app-header .sub {
            font-size: 1rem;
            color: var(--text-secondary);
            letter-spacing: 6px;
            margin-top: 8px;
            font-weight: 300;
            text-transform: uppercase;
        }
        .app-header .sub span {
            color: var(--glow-cyan);
            font-weight: 600;
        }

        /* 权重标签 */
        .weight-badge {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: rgba(0, 240, 255, 0.12);
            border: 1px solid rgba(0, 240, 255, 0.25);
            color: var(--glow-cyan);
            margin-left: 8px;
        }
        .weight-badge.purple {
            background: rgba(168, 85, 247, 0.12);
            border-color: rgba(168, 85, 247, 0.25);
            color: var(--glow-purple);
        }
        .weight-badge.pink {
            background: rgba(244, 114, 182, 0.12);
            border-color: rgba(244, 114, 182, 0.25);
            color: var(--glow-pink);
        }

        /* ===== 进度条 ===== */
        .progress-wrap {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 40px;
            height: 6px;
            margin: 12px 0 28px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--glow-cyan), var(--glow-purple));
            border-radius: 40px;
            transition: width 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        }
        .progress-text {
            text-align: right;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* ===== 模块卡片 ===== */
        .module-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 32px 36px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: var(--shadow-glow);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        .module-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(0, 240, 255, 0.02), transparent 60%);
            pointer-events: none;
        }
        .module-card:hover {
            border-color: rgba(0, 240, 255, 0.12);
            box-shadow: 0 0 60px rgba(0, 240, 255, 0.05);
        }

        .module-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .module-title {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 2px;
        }
        .module-title .highlight {
            color: var(--glow-cyan);
        }
        .module-title .highlight.purple {
            color: var(--glow-purple);
        }
        .module-title .highlight.pink {
            color: var(--glow-pink);
        }

        .module-status {
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .module-status .done {
            color: #4ade80;
        }

        /* ===== 题目样式 ===== */
        .question-item {
            padding: 16px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .question-item:last-child {
            border-bottom: none;
        }
        .question-text {
            font-size: 0.98rem;
            font-weight: 400;
            line-height: 1.6;
            color: var(--text-primary);
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .question-text .qnum {
            color: var(--glow-cyan);
            font-weight: 700;
            font-size: 0.8rem;
            min-width: 28px;
            opacity: 0.6;
        }

        /* 选项 - 李克特量表 (5点) */
        .likert-options {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding-left: 38px;
        }
        .likert-options label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.25s ease;
            font-size: 0.75rem;
            color: var(--text-secondary);
            min-width: 44px;
        }
        .likert-options label:hover {
            background: rgba(0, 240, 255, 0.06);
            border-color: rgba(0, 240, 255, 0.15);
        }
        .likert-options input[type="radio"] {
            display: none;
        }
        .likert-options input[type="radio"]:checked+span {
            color: var(--glow-cyan);
            font-weight: 600;
        }
        .likert-options label:has(input:checked) {
            background: rgba(0, 240, 255, 0.10);
            border-color: var(--glow-cyan);
            box-shadow: 0 0 24px rgba(0, 240, 255, 0.08);
        }
        .likert-options .opt-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
        }

        /* MBTI 二选一 */
        .mbti-options {
            display: flex;
            gap: 16px;
            padding-left: 38px;
            flex-wrap: wrap;
        }
        .mbti-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 20px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.25s ease;
            font-size: 0.9rem;
        }
        .mbti-options label:hover {
            background: rgba(168, 85, 247, 0.06);
            border-color: rgba(168, 85, 247, 0.15);
        }
        .mbti-options input[type="radio"] {
            display: none;
        }
        .mbti-options label:has(input:checked) {
            background: rgba(168, 85, 247, 0.12);
            border-color: var(--glow-purple);
            box-shadow: 0 0 24px rgba(168, 85, 247, 0.08);
        }
        .mbti-options .mbti-letter {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--glow-purple);
        }

        /* ===== 导航按钮 ===== */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-top: 28px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 36px;
            border: none;
            border-radius: 60px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--glow-cyan), #0ea5e9);
            color: #0a0e1a;
            border: none;
            font-weight: 700;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.25);
            background: linear-gradient(135deg, #4df0ff, #1d8cf0);
        }
        .btn-primary:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .btn-purple {
            background: linear-gradient(135deg, var(--glow-purple), #7c3aed);
            color: #fff;
            border: none;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.15);
        }
        .btn-purple:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 50px rgba(168, 85, 247, 0.25);
        }
        .btn-pink {
            background: linear-gradient(135deg, var(--glow-pink), #ec4899);
            color: #fff;
            border: none;
            box-shadow: 0 0 30px rgba(244, 114, 182, 0.15);
        }
        .btn-pink:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 50px rgba(244, 114, 182, 0.25);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--glow-cyan);
            color: var(--glow-cyan);
        }

        /* ===== 首页模块选择 ===== */
        .home-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }
        .home-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 32px 28px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: all 0.4s ease;
            text-align: center;
            box-shadow: var(--shadow-glow);
            position: relative;
            overflow: hidden;
        }
        .home-card:hover {
            transform: translateY(-6px);
            border-color: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 60px rgba(0, 240, 255, 0.06);
        }
        .home-card .icon {
            font-size: 2.8rem;
            margin-bottom: 12px;
            display: block;
        }
        .home-card .hname {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }
        .home-card .hdesc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin: 8px 0 12px;
            line-height: 1.5;
        }
        .home-card .hweight {
            font-size: 0.7rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 16px;
            border-radius: 40px;
            display: inline-block;
        }
        .home-card .hstatus {
            margin-top: 12px;
            font-size: 0.75rem;
            color: #4ade80;
        }
        .home-card .hstatus.dim {
            color: var(--text-secondary);
        }

        /* ===== 结果页面 ===== */
        .result-section {
            margin-top: 20px;
        }
        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin: 16px 0;
        }
        .result-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 16px 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
        }
        .result-item .rlabel {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .result-item .rvalue {
            font-size: 1.8rem;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            margin: 4px 0;
        }
        .result-item .rvalue.cyan {
            color: var(--glow-cyan);
        }
        .result-item .rvalue.purple {
            color: var(--glow-purple);
        }
        .result-item .rvalue.pink {
            color: var(--glow-pink);
        }
        .result-item .rbar {
            height: 4px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            margin-top: 8px;
            overflow: hidden;
        }
        .result-item .rbar .fill {
            height: 100%;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--glow-cyan), var(--glow-purple));
            transition: width 1s ease;
        }

        /* 详细结果 */
        .result-detail {
            margin-top: 24px;
            padding: 24px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .result-detail h3 {
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            letter-spacing: 1px;
            margin-bottom: 12px;
            color: var(--glow-cyan);
        }
        .result-detail .desc {
            color: var(--text-secondary);
            line-height: 1.7;
            font-size: 0.95rem;
        }
        .result-detail .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .result-detail .tag {
            padding: 4px 16px;
            border-radius: 40px;
            background: rgba(0, 240, 255, 0.06);
            border: 1px solid rgba(0, 240, 255, 0.08);
            font-size: 0.8rem;
            color: var(--glow-cyan);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .app-header h1 {
                font-size: 1.8rem;
                letter-spacing: 2px;
            }
            .module-card {
                padding: 20px 16px;
            }
            .likert-options {
                padding-left: 0;
                gap: 4px;
            }
            .likert-options label {
                padding: 4px 8px;
                font-size: 0.65rem;
                min-width: 34px;
            }
            .mbti-options {
                padding-left: 0;
            }
            .question-text {
                font-size: 0.9rem;
            }
            .nav-buttons .btn {
                padding: 10px 20px;
                font-size: 0.8rem;
            }
            .home-grid {
                grid-template-columns: 1fr;
            }
            .result-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 480px) {
            .app-header h1 {
                font-size: 1.4rem;
            }
            .module-title {
                font-size: 1rem;
            }
            .result-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ===== 工具类 ===== */
        .hidden {
            display: none !important;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-16 {
            margin-top: 16px;
        }
        .text-center {
            text-align: center;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gap-8 {
            gap: 8px;
        }
        .gap-16 {
            gap: 16px;
        }

        /* 加载动画 */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-top-color: var(--glow-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 结果页顶部总览 */
        .result-overview {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin: 20px 0 28px;
        }
        .result-overview .ro-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 20px 16px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .result-overview .ro-item .ro-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .result-overview .ro-item .ro-score {
            font-family: 'Orbitron', monospace;
            font-size: 2.2rem;
            font-weight: 700;
            margin: 4px 0;
        }
        .result-overview .ro-item .ro-weight {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        @media (max-width: 600px) {
            .result-overview {
                grid-template-columns: 1fr;
            }
        }

        /* 闪光边框动画 */
        .glow-border {
            position: relative;
        }
        .glow-border::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 28px;
            padding: 1px;
            background: linear-gradient(135deg, var(--glow-cyan), var(--glow-purple), var(--glow-pink));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.3;
            transition: opacity 0.6s ease;
        }
        .glow-border:hover::after {
            opacity: 0.7;
        }

        /* 盖洛普才干标签 */
        .gallup-tag {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            background: rgba(244, 114, 182, 0.08);
            border: 1px solid rgba(244, 114, 182, 0.1);
            color: var(--glow-pink);
            font-weight: 500;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

    <!-- 粒子背景 -->
    <div class="particle-bg" id="particles"></div>

    <div class="app-container" id="app">
        <!-- 头部 -->
        <header class="app-header">
            <h1>✦ 未来星轨</h1>
            <div class="sub">多维潜能 · <span>AI 天赋导航</span></div>
            <div style="margin-top:12px;font-size:0.75rem;color:var(--text-secondary);letter-spacing:2px;">
                霍兰德 <span class="weight-badge">30</span> ｜
                MBTI <span class="weight-badge purple">10</span> ｜
                盖洛普 <span class="weight-badge pink">60</span>
            </div>
        </header>

        <!-- 进度条 -->
        <div class="progress-wrap">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">0%</div>

        <!-- ===== 首页 ===== -->
        <div id="pageHome">
            <div class="module-card glow-border">
                <div style="text-align:center;padding:8px 0 4px;">
                    <p style="color:var(--text-secondary);font-size:0.95rem;letter-spacing:1px;">
                        🚀 三大维度 · 全面解锁你的 <span style="color:var(--glow-cyan);font-weight:600;">未来星图</span>
                    </p>
                </div>
                <div class="home-grid">
                    <div class="home-card" data-module="holland">
                        <span class="icon">🧭</span>
                        <div class="hname">职业兴趣 <span class="weight-badge">30</span></div>
                        <div class="hdesc">霍兰德六型 · 探索你热爱的方向</div>

        // 为每个才干生成2题 (贴近学生生活)

                '追求': ['我有强烈的渴望去实现自己的理想。', '我追求有意义的目标，不甘于平庸。'],

        const GALLUP_QUESTIONS = buildGallupQuestions();

        // ================================================================
        //  应用状态
        // ================================================================
        const state = {
            // 答题数据: { holland: { R: 0, ... }, mbti: { EI: 0, ... }, gallup: { 成就: 0, ... } }
            scores: {
                holland: Object.fromEntries(HOLLAND_DIMS.map(d => [d.id, 0])),

            },
            // 记录每题得分 (用于进度)
            answered: {
                holland: new Array(HOLLAND_QUESTIONS.length).fill(false),
                mbti: new Array(MBTI_QUESTIONS.length).fill(false),
                gallup: new Array(GALLUP_QUESTIONS.length).fill(false)
            },
            currentModule: null, // 'holland' | 'mbti' | 'gallup'
            currentIndex: 0,
            // 模块完成状态

                holland: false,
                mbti: false,
                gallup: false

            // 结果数据

        const TOTAL_QS = HOLLAND_QUESTIONS.length + MBTI_QUESTIONS.length + GALLUP_QUESTIONS.length;

        // ================================================================
        //  工具函数
        // ================================================================
        function getAnsweredCount() {
            let c = 0;
            for (const k of ['holland', 'mbti', 'gallup']) {
                c += state.answered[k].filter(v => v).length;
            }
            return c;
        }

        function updateProgress() {
            const done = getAnsweredCount();
            const pct = Math.round((done / TOTAL_QS) * 100);
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('progressText').textContent = pct + '% (' + done + '/' + TOTAL_QS + ')';
        }

        function updateHomeStatus() {
            const map = {
                holland: 'statusHolland',
                mbti: 'statusMbti',
                gallup: 'statusGallup'
            };
            for (const [mod, elId] of Object.entries(map)) {
                const el = document.getElementById(elId);
                if (state.completed[mod]) {
                    el.innerHTML = '✅ 已完成';
                    el.className = 'hstatus';
                } else {
                    const done = state.answered[mod].filter(v => v).length;
                    const total = state.answered[mod].length;
                    if (done === 0) {
                        el.innerHTML = '⏳ 未开始';
                        el.className = 'hstatus dim';
                    } else {
                        el.innerHTML = `⏳ 进行中 (${done}/${total})`;
                        el.className = 'hstatus';
                    }
                }
            }
        }

        // 保存答案
        function saveAnswer(module, index, value) {
            state.answered[module][index] = true;
            // 更新分数
            if (module === 'holland') {
                const q = HOLLAND_QUESTIONS[index];
                state.scores.holland[q.dim] = (state.scores.holland[q.dim] || 0) + value;
            } else if (module === 'mbti') {
                const q = MBTI_QUESTIONS[index];
                // MBTI: value 0=左, 1=右
                // 左选项为该维度第一个字母，右为第二个
                const dim = q.dim;
                // 存储时：左+1，右-1，最后判断正负
                const current = state.scores.mbti[dim] || 0;
                state.scores.mbti[dim] = current + (value === 0 ? 1 : -1);
            } else if (module === 'gallup') {
                const q = GALLUP_QUESTIONS[index];
                state.scores.gallup[q.talent] = (state.scores.gallup[q.talent] || 0) + value;
            }
            updateProgress();
            updateHomeStatus();
        }

        // 检查模块是否完成
        function checkModuleComplete(module) {
            const all = state.answered[module].every(v => v === true);
            if (all) {
                state.completed[module] = true;
                updateHomeStatus();
            }
            return all;
        }

        // 计算最终结果
        function computeResult() {
            // 霍兰德: 取最高分维度
            const hollandScores = state.scores.holland;
            let hollandTop = '';
            let hollandMax = -1;
            for (const [k, v] of Object.entries(hollandScores)) {
                if (v > hollandMax) { hollandMax = v;
                    hollandTop = k; }
            }
            const hollandLabel = HOLLAND_DIMS.find(d => d.id === hollandTop)?.label || '未知';

            // MBTI: 四个维度
            const mbtiMap = {
                EI: { left: 'E', right: 'I' },
                SN: { left: 'S', right: 'N' },
                TF: { left: 'T', right: 'F' },
                JP: { left: 'J', right: 'P' }
            };
            let mbtiType = '';
            for (const [dim, obj] of Object.entries(mbtiMap)) {
                const score = state.scores.mbti[dim] || 0;
                mbtiType += score >= 0 ? obj.left : obj.right;
            }

            // 盖洛普: 取前5
            const gallupScores = state.scores.gallup;
            const sorted = Object.entries(gallupScores).sort((a, b) => b[1] - a[1]);
            const top5 = sorted.slice(0, 5).map(([t, s]) => ({ talent: t, score: s }));

            // 计算各模块总分 (用于展示)
            const hollandTotal = Object.values(hollandScores).reduce((a, b) => a + b, 0);
            const mbtiTotal = Object.values(state.scores.mbti).reduce((a, b) => a + b, 0);
            const gallupTotal = Object.values(gallupScores).reduce((a, b) => a + b, 0);

            // 加权总分 (权重: 霍兰德30, MBTI10, 盖洛普60)
            const weighted = (hollandTotal / (HOLLAND_QUESTIONS.length / HOLLAND_DIMS.length)) * 30 +
                (Math.abs(mbtiTotal) / MBTI_QUESTIONS.length) * 10 +
                (gallupTotal / (GALLUP_QUESTIONS.length / GALLUP_TALENTS.length)) * 60;

            return {
                holland: { top: hollandTop, label: hollandLabel, scores: hollandScores, total: hollandTotal },
                mbti: { type: mbtiType, scores: state.scores.mbti, total: mbtiTotal },
                gallup: { top5, scores: gallupScores, total: gallupTotal },
                weightedScore: Math.round(weighted)
            };
        }

                questions = GALLUP_QUESTIONS;

                colorClass = 'highlight pink';
                type = 'likert';
                dims = GALLUP_TALENTS;
            } else {
                return;
            }

            const index = state.currentIndex;
            const total = questions.length;
            const q = questions[index];

            if (module === 'holland') {
                const d = HOLLAND_DIMS.find(x => x.id === q.dim);

            } else if (module === 'mbti') {
                const d = MBTI_DIMS.find(x => x.id === q.dim);

                dimInfo = `✨ ${q.talent}`;

            let html = `
                <div class="module-header">
                    <div class="module-title"><span class="${colorClass}">${title}</span></div>
                    <div class="module-status">${index+1} / ${total}  <span style="color:var(--text-secondary);margin-left:8px;">${dimInfo}</span></div>
                </div>
                <div class="question-item">
                    <div class="question-text">
                        <span class="qnum">#${index+1}</span>
                        <span>${q.text}</span>
                    </div>
            `;

            if (type === 'likert') {
                const labels = ['非常不符合', '不符合', '一般', '符合', '非常符合'];
                const vals = [0, 1, 2, 3, 4];
                // 检查是否已选
                let selected = -1;
                // 从state中读取该题答案
                // 我们需要存储每道题的答案，这里简单处理：从score反推
                // 更好的方式: 存储答案数组
                // 用临时存储
                if (!window._ans) window._ans = { holland: [], mbti: [], gallup: [] };
                if (!window._ans[module]) window._ans[module] = [];
                const saved = window._ans[module][index];
                if (saved !== undefined) selected = saved;

                html += `<div class="likert-options">`;
                vals.forEach((v, i) => {
                    const checked = (selected === v) ? 'checked' : '';
                    html += `
                        <label>
                            <input type="radio" name="q_${module}_${index}" value="${v}" ${checked} data-module="${module}" data-index="${index}" data-value="${v}">
                            <span>${v+1}</span>
                            <span class="opt-label">${labels[i]}</span>
                        </label>
                    `;
                });
                html += `</div>`;
            } else if (type === 'mbti') {
                const dim = q.dim;
                const d = MBTI_DIMS.find(x => x.id === dim);
                let selected = -1;
                if (!window._ans) window._ans = { holland: [], mbti: [], gallup: [] };
                if (!window._ans[module]) window._ans[module] = [];
                const saved = window._ans[module][index];
                if (saved !== undefined) selected = saved;

                html += `<div class="mbti-options">`;
                // 左
                const checkedL = (selected === 0) ? 'checked' : '';
                html += `
                    <label>
                        <input type="radio" name="q_${module}_${index}" value="0" ${checkedL} data-module="${module}" data-index="${index}" data-value="0">
                        <span class="mbti-letter">${d.left}</span>
                    </label>
                `;
                // 右
                const checkedR = (selected === 1) ? 'checked' : '';
                html += `
                    <label>
                        <input type="radio" name="q_${module}_${index}" value="1" ${checkedR} data-module="${module}" data-index="${index}" data-value="1">
                        <span class="mbti-letter">${d.right}</span>
                    </label>
                `;
                html += `</div>`;
            }

            html += `</div>`;

            // 导航按钮
            const hasPrev = index > 0;
            const hasNext = index < total - 1;
            const isComplete = state.completed[module];

            html += `<div class="nav-buttons">`;
            if (hasPrev) {
                html += `<button class="btn btn-outline" id="prevBtn">← 上一题</button>`;
            } else {
                html += `<div></div>`;
            }

            if (hasNext) {
                html += `<button class="btn btn-primary" id="nextBtn" ${!answered ? 'disabled' : ''}>下一题 →</button>`;
            } else {
                // 最后一题
                if (isComplete) {
                    html += `<button class="btn btn-primary" id="finishModuleBtn">✅ 完成模块</button>`;
                } else {
                    html += `<button class="btn btn-primary" id="finishModuleBtn" ${!answered ? 'disabled' : ''}>📌 完成模块</button>`;
                }
            }
            html += `</div>`;

            // 返回首页
            html += `
                <div style="margin-top:16px;text-align:center;">
                    <button class="btn btn-outline" id="backHomeBtn" style="font-size:0.8rem;">← 返回首页</button>
                </div>
            `;

            container.innerHTML = html;

            // 事件绑定 - 单选变化
            container.querySelectorAll('input[type="radio"]').forEach(el => {
                el.addEventListener('change', function(e) {
                    const mod = this.dataset.module;
                    const idx = parseInt(this.dataset.index);
                    const val = parseInt(this.dataset.value);
                    // 保存到临时存储
                    if (!window._ans) window._ans = { holland: [], mbti: [], gallup: [] };
                    if (!window._ans[mod]) window._ans[mod] = [];
                    window._ans[mod][idx] = val;
                    // 保存到状态
                    saveAnswer(mod, idx, val);
                    // 更新按钮状态
                    const nextBtn = document.getElementById('nextBtn');
                    const finishBtn = document.getElementById('finishModuleBtn');
                    if (nextBtn) nextBtn.disabled = false;
                    if (finishBtn) finishBtn.disabled = false;
                    // 检查模块是否完成
                    if (checkModuleComplete(mod)) {
                        // 如果当前是最后一题且完成，更新按钮
                        const fb = document.getElementById('finishModuleBtn');
                        if (fb) {
                            fb.textContent = '✅ 完成模块';
                            fb.disabled = false;
                        }
                    }
                    updateProgress();
                });
            });

            // 上一题
            const prevBtn = document.getElementById('prevBtn');
            if (prevBtn) {
                prevBtn.addEventListener('click', () => {
                    if (state.currentIndex > 0) {
                        state.currentIndex--;
                        renderQuiz(module);
                    }
                });
            }

            // 下一题
            const nextBtn = document.getElementById('nextBtn');
            if (nextBtn) {
                nextBtn.addEventListener('click', () => {
                    if (state.currentIndex < total - 1) {
                        state.currentIndex++;
                        renderQuiz(module);
                    }
                });
            }

            // 完成模块
            const finishBtn = document.getElementById('finishModuleBtn');
            if (finishBtn) {
                finishBtn.addEventListener('click', () => {
                    // 检查是否所有题目都答了
                    const allDone = state.answered[module].every(v => v === true);
                    if (!allDone) {
                        alert('还有题目未作答，请完成所有题目！');
                        return;
                    }
                    state.completed[module] = true;
                    updateHomeStatus();
                    // 检查是否所有模块都完成了
                    if (state.completed.holland && state.completed.mbti && state.completed.gallup) {
                        // 显示结果
                        showResult();
                    } else {
                        // 回到首页
                        showHome();
                        alert(`✅ ${module === 'holland' ? '霍兰德' : module === 'mbti' ? 'MBTI' : '盖洛普'} 模块已完成！`);
                    }
                });
            }

            // 返回首页
            const backBtn = document.getElementById('backHomeBtn');
            if (backBtn) {
                backBtn.addEventListener('click', showHome);
            }

            // 滚动到顶部
            container.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ----- 显示首页 -----
        function showHome() {
            document.getElementById('pageHome').classList.remove('hidden');
            document.getElementById('pageQuiz').classList.add('hidden');
            document.getElementById('pageResult').classList.add('hidden');
            state.currentModule = null;
            updateHomeStatus();
            updateProgress();
        }

        // ----- 开始测评模块 -----
        function startModule(module) {
            state.currentModule = module;
            state.currentIndex = 0;
            // 如果该模块还没有答案存储，初始化
            if (!window._ans) window._ans = { holland: [], mbti: [], gallup: [] };
            if (!window._ans[module]) window._ans[module] = [];
            // 确保数组长度足够
            const qs = module === 'holland' ? HOLLAND_QUESTIONS : module === 'mbti' ? MBTI_QUESTIONS : GALLUP_QUESTIONS;
            while (window._ans[module].length < qs.length) {
                window._ans[module].push(undefined);
            }
            // 从存储中恢复状态
            for (let i = 0; i < qs.length; i++) {
                const val = window._ans[module][i];
                if (val !== undefined) {
                    state.answered[module][i] = true;
                    // 恢复分数
                    if (module === 'holland') {
                        const q = HOLLAND_QUESTIONS[i];
                        state.scores.holland[q.dim] = (state.scores.holland[q.dim] || 0) + val;
                    } else if (module === 'mbti') {
                        const q = MBTI_QUESTIONS[i];
                        state.scores.mbti[q.dim] = (state.scores.mbti[q.dim] || 0) + (val === 0 ? 1 : -1);
                    } else if (module === 'gallup') {
                        const q = GALLUP_QUESTIONS[i];
                        state.scores.gallup[q.talent] = (state.scores.gallup[q.talent] || 0) + val;
                    }
                }
            }
            checkModuleComplete(module);
            updateHomeStatus();
            updateProgress();

            document.getElementById('pageHome').classList.add('hidden');
            document.getElementById('pageQuiz').classList.remove('hidden');
            document.getElementById('pageResult').classList.add('hidden');
            renderQuiz(module);
        }

        // ----- 显示结果 -----
        function showResult() {
            const result = computeResult();
            state.result = result;
            document.getElementById('pageHome').classList.add('hidden');
            document.getElementById('pageQuiz').classList.add('hidden');
            document.getElementById('pageResult').classList.remove('hidden');

            const container = document.getElementById('resultContainer');

            // 构建结果HTML
            const hollandScores = result.holland.scores;
            const hollandTotal = result.holland.total;
            const mbtiScores = result.mbti.scores;
            const mbtiTotal = result.mbti.total;
            const gallupScores = result.gallup.scores;
            const gallupTotal = result.gallup.total;

            // 霍兰德雷达图数据（用柱状条模拟）
            let hollandBars = '';
            for (const d of HOLLAND_DIMS) {
                const score = hollandScores[d.id] || 0;
                const pct = Math.min((score / 16) * 100, 100);
                hollandBars += `
                    <div style="margin:4px 0;">
                        <div style="display:flex;justify-content:space-between;font-size:0.8rem;">
                            <span>${d.icon} ${d.label}</span>
                            <span>${score}</span>
                        </div>
                        <div class="rbar"><div class="fill" style="width:${pct}%;background:linear-gradient(90deg,var(--glow-cyan),#0ea5e9);"></div></div>
                    </div>
                `;
            }

            // MBTI 结果
            const mbtiMap = {
                EI: { left: 'E', right: 'I' },
                SN: { left: 'S', right: 'N' },
                TF: { left: 'T', right: 'F' },
                JP: { left: 'J', right: 'P' }
            };
            let mbtiDetails = '';
            for (const [dim, obj] of Object.entries(mbtiMap)) {
                const score = mbtiScores[dim] || 0;
                const leftPct = Math.min(Math.max((score + 5) / 10 * 100, 0), 100);
                const rightPct = 100 - leftPct;
                const label = score >= 0 ? obj.left : obj.right;
                mbtiDetails += `
                    <div style="margin:6px 0;">
                        <div style="display:flex;justify-content:space-between;font-size:0.8rem;">
                            <span>${dim}</span>
                            <span style="font-weight:700;color:var(--glow-purple);">${label}</span>
                        </div>
                        <div style="display:flex;gap:2px;height:6px;border-radius:12px;overflow:hidden;background:rgba(255,255,255,0.04);">
                            <div style="flex:${leftPct};background:var(--glow-purple);opacity:0.6;"></div>
                            <div style="flex:${rightPct};background:var(--glow-pink);opacity:0.6;"></div>
                        </div>
                    </div>
                `;
            }

            // 盖洛普 top5
            let gallupTopHtml = '';
            result.gallup.top5.forEach((item, i) => {
                const pct = Math.min((item.score / 8) * 100, 100);
                const colors = ['var(--glow-pink)', '#ec4899', '#f472b6', '#fb7185', '#f43f5e'];
                gallupTopHtml += `
                    <div style="margin:4px 0;">
                        <div style="display:flex;justify-content:space-between;font-size:0.85rem;">
                            <span>#${i+1} ${item.talent}</span>
                            <span>${item.score}</span>
                        </div>
                        <div class="rbar"><div class="fill" style="width:${pct}%;background:${colors[i]};"></div></div>
                    </div>
                `;
            });

            // 盖洛普全部标签
            let gallupTags = '';
            const sortedAll = Object.entries(gallupScores).sort((a, b) => b[1] - a[1]);
            sortedAll.forEach(([t, s]) => {
                if (s > 0) {
                    gallupTags += `<span class="gallup-tag">${t} ${s}</span>`;
                }
            });

            const weighted = result.weightedScore;

            container.innerHTML = `
                <div style="text-align:center;padding:8px 0 12px;">
                    <h2 style="font-family:'Orbitron',monospace;font-size:1.8rem;letter-spacing:2px;background:linear-gradient(135deg,var(--glow-cyan),var(--glow-purple),var(--glow-pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
                        🏆 你的潜能星图
                    </h2>
                    <div style="font-size:0.9rem;color:var(--text-secondary);margin-top:4px;">综合加权得分 · <span style="color:var(--glow-cyan);font-weight:700;">${weighted}</span> / 100</div>
                </div>

                <div class="result-overview">
                    <div class="ro-item">
                        <div class="ro-label">🧭 职业兴趣</div>
                        <div class="ro-score" style="color:var(--glow-cyan);">${result.holland.label}</div>
                        <div class="ro-weight">权重 30 · 得分 ${hollandTotal}</div>
                    </div>
                    <div class="ro-item">
                        <div class="ro-label">🧠 性格内核</div>
                        <div class="ro-score" style="color:var(--glow-purple);">${result.mbti.type}</div>
                        <div class="ro-weight">权重 10 · 倾向 ${mbtiTotal}</div>
                    </div>
                    <div class="ro-item">
                        <div class="ro-label">⚡ 天赋才干</div>
                        <div class="ro-score" style="color:var(--glow-pink);">${result.gallup.top5.map(t=>t.talent).join(' · ')}</div>
                        <div class="ro-weight">权重 60 · 总分 ${gallupTotal}</div>
                    </div>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:20px;">
                    <div class="result-detail">
                        <h3>🧭 霍兰德 · 职业兴趣</h3>
                        <div style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:12px;">
                            主导类型：<span style="color:var(--glow-cyan);font-weight:600;">${result.holland.label}</span>
                        </div>
                        ${hollandBars}
                        <div style="margin-top:12px;font-size:0.75rem;color:var(--text-secondary);">
                            ${HOLLAND_DIMS.find(d=>d.id===result.holland.top)?.desc || ''}
                        </div>
                    </div>

                    <div class="result-detail">
                        <h3>🧠 MBTI · 性格内核</h3>
                        <div style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:12px;">
                            人格类型：<span style="color:var(--glow-purple);font-weight:600;">${result.mbti.type}</span>
                        </div>
                        ${mbtiDetails}
                        <div style="margin-top:12px;font-size:0.75rem;color:var(--text-secondary);">
                            左倾向 · 右倾向 (根据答题方向)
                        </div>
                    </div>
                </div>

                <div class="result-detail" style="margin-top:20px;">
                    <h3>⚡ 盖洛普 · 天赋才干 TOP 5</h3>
                    ${gallupTopHtml}
                    <div style="margin-top:16px;">
                        <div style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:8px;">所有才干得分：</div>
                        <div class="tag-group">${gallupTags}</div>
                    </div>
                </div>

                <div style="text-align:center;margin-top:28px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;">
                    <button class="btn btn-primary" id="retakeBtn">🔄 重新测评</button>
                    <button class="btn btn-outline" id="homeFromResultBtn">🏠 返回首页</button>
                </div>
            `;

            // 事件
            document.getElementById('retakeBtn').addEventListener('click', () => {
                if (confirm('重新测评将清除所有答案，确定吗？')) {
                    location.reload();
                }
            });
            document.getElementById('homeFromResultBtn').addEventListener('click', showHome);
        }

        // ================================================================
        //  初始化
        // ================================================================

        function init() {
            // 粒子
            const particleContainer = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const span = document.createElement('span');
                const size = Math.random() * 3 + 1;
                span.style.width = size + 'px';
                span.style.height = size + 'px';
                span.style.left = Math.random() * 100 + '%';
                span.style.animationDuration = (Math.random() * 20 + 15) + 's';
                span.style.animationDelay = (Math.random() * 20) + 's';
                span.style.opacity = Math.random() * 0.3 + 0.1;
                particleContainer.appendChild(span);
            }

            // 首页卡片点击
            document.querySelectorAll('.home-card').forEach(card => {
                card.addEventListener('click', function() {
                    const mod = this.dataset.module;
                    if (state.completed[mod]) {
                        alert('该模块已完成，可重新测评（将重置该模块答案）');
                        // 重置该模块
                        const qs = mod === 'holland' ? HOLLAND_QUESTIONS : mod === 'mbti' ? MBTI_QUESTIONS :
                            GALLUP_QUESTIONS;
                        state.answered[mod] = new Array(qs.length).fill(false);
                        state.completed[mod] = false;
                        if (mod === 'holland') {
                            state.scores.holland = Object.fromEntries(HOLLAND_DIMS.map(d => [d.id, 0]));
                        } else if (mod === 'mbti') {
                            state.scores.mbti = Object.fromEntries(MBTI_DIMS.map(d => [d.id, 0]));
                        } else if (mod === 'gallup') {
                            state.scores.gallup = Object.fromEntries(GALLUP_TALENTS.map(t => [t, 0]));
                        }
                        if (window._ans) window._ans[mod] = [];
                        updateHomeStatus();
                        updateProgress();
                    }
                    startModule(mod);
                });
            });

            // "开始完整测评" 按钮
            document.getElementById('startAllBtn').addEventListener('click', function() {
                // 检查是否所有模块都未完成
                if (state.completed.holland && state.completed.mbti && state.completed.gallup) {
                    if (!confirm('所有模块已完成，是否重新开始？')) return;
                    location.reload();
                    return;
                }
                // 找第一个未完成的模块
                let target = null;
                if (!state.completed.holland) target = 'holland';
                else if (!state.completed.mbti) target = 'mbti';
                else if (!state.completed.gallup) target = 'gallup';
                if (target) startModule(target);
                else {
                    // 全部完成
                    showResult();
                }
            });

            updateHomeStatus();
            updateProgress();
            showHome();
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
