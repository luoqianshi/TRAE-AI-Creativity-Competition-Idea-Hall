<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>错题精灵 · AI错题诊断</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5f7fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      margin: 0;
    }

    /* 手机卡片容器 */
    .demo-card {
      max-width: 400px;
      width: 100%;
      background: #ffffff;
      border-radius: 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      height: 780px;
      max-height: 90vh;
    }

    /* 状态栏/头部 */
    .header {
      padding: 18px 20px 8px 20px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f0f0f5;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      background: linear-gradient(135deg, #4f6ef7, #6c8cff);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      font-weight: 600;
    }

    .logo-text {
      font-weight: 700;
      font-size: 18px;
      color: #1e293b;
      letter-spacing: -0.3px;
    }

    .user-avatar {
      background: #eef2ff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4f6ef7;
      font-weight: 600;
      font-size: 16px;
    }

    /* 主要内容区域，可滚动 */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 10px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scrollbar-width: thin;
    }

    /* 欢迎卡片 */
    .greeting-card {
      background: linear-gradient(115deg, #4f6ef7 0%, #7b93ff 100%);
      border-radius: 24px;
      padding: 18px 18px;
      color: white;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 10px 20px -8px rgba(79, 110, 247, 0.35);
    }

    .greeting-title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .greeting-sub {
      font-size: 14px;
      opacity: 0.9;
      font-weight: 400;
      line-height: 1.4;
    }

    /* 快速操作区 (拍照入口) */
    .action-buttons {
      display: flex;
      gap: 12px;
    }

    .btn-primary {
      background: #1e293b;
      border: none;
      border-radius: 20px;
      padding: 14px 18px;
      color: white;
      font-weight: 600;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex: 1;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .btn-primary:active {
      background: #0f172a;
      transform: scale(0.97);
    }

    .btn-outline {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 14px 16px;
      color: #334155;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex: 1;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-outline:active {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    /* 错题列表卡片 */
    .section-title {
      font-weight: 700;
      font-size: 17px;
      color: #0f172a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-link {
      color: #4f6ef7;
      font-size: 14px;
      font-weight: 500;
    }

    .mistake-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mistake-item {
      background: #ffffff;
      border: 1px solid #f1f5f9;
      border-radius: 20px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      transition: 0.15s;
    }

    .mistake-item:active {
      background: #fafbff;
      border-color: #d9e2ff;
    }

    .mistake-icon {
      background: #fef2f2;
      width: 46px;
      height: 46px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #ef4444;
    }

    .mistake-info {
      flex: 1;
    }

    .mistake-title {
      font-weight: 650;
      font-size: 15px;
      color: #1e293b;
      margin-bottom: 4px;
    }

    .mistake-meta {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: #64748b;
    }

    .knowledge-tag {
      background: #eef2ff;
      color: #4f6ef7;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }

    .weak-badge {
      background: #fee2e2;
      color: #b91c1c;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    /* 诊断卡片 (AI建议) */
    .diagnosis-card {
      background: #f8fafc;
      border-radius: 22px;
      padding: 16px;
      border: 1px solid #e9eef4;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .diag-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: #0f172a;
    }

    .ai-badge {
      background: #1e293b;
      color: white;
      padding: 2px 12px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
    }

    .weak-points {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .weak-chip {
      background: white;
      border: 1px solid #e2e8f0;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 13px;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .progress-mini {
      height: 6px;
      background: #e2e8f0;
      border-radius: 10px;
      width: 100%;
      margin-top: 4px;
    }

    .progress-fill {
      width: 38%;
      height: 6px;
      background: #4f6ef7;
      border-radius: 10px;
    }

    /* 底部导航 */
    .bottom-nav {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 10px 16px 16px;
      background: white;
      border-top: 1px solid #f1f5f9;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }

    .nav-item.active {
      color: #4f6ef7;
      font-weight: 600;
    }

    .nav-icon {
      font-size: 20px;
    }

    /* 模拟拍照界面浮层 (简单交互) */
    .camera-sim {
      background: #f1f5f9;
      border-radius: 24px;
      padding: 24px 16px;
      text-align: center;
      border: 2px dashed #cbd5e1;
      color: #475569;
      margin: 8px 0;
      cursor: pointer;
      transition: 0.2s;
    }

    .camera-sim:active {
      background: #e9eef4;
    }

    hr {
      border: 0.5px solid #edf2f7;
      margin: 4px 0;
    }

    /* 隐藏类 */
    .hidden {
      display: none !important;
    }

    .flex-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="demo-card">
    <!-- 头部 -->
    <div class="header">
      <div class="logo-area">
        <div class="logo-icon">📚</div>
        <span class="logo-text">错题精灵</span>
      </div>
      <div class="user-avatar">李</div>
    </div>

    <!-- 主要内容区域 (默认首页) -->
    <div class="content" id="mainContent">
      <!-- 欢迎卡片 -->
      <div class="greeting-card">
        <div class="greeting-title">
          <span>✨ 下午好，李同学</span>
        </div>
        <div class="greeting-sub">
          今日错题诊断已更新 · 发现2个薄弱知识点
        </div>
        <div style="margin-top: 4px; display: flex; gap: 12px; font-size:13px;">
          <span>📸 本周整理12题</span>
          <span>⚡ 掌握率62%</span>
        </div>
      </div>

      <!-- 拍照入口 (模拟点击) -->
      <div class="action-buttons">
        <button class="btn-primary" id="cameraBtn">
          <span>📷</span> 拍错题
        </button>
        <button class="btn-outline" id="manualBtn">
          <span>📋</span> 手动录入
        </button>
      </div>

      <!-- 最新错题列表 -->
      <div class="section-title">
        <span>📌 最近错题</span>
        <span class="section-link">全部</span>
      </div>
      <div class="mistake-list" id="mistakeListContainer">
        <!-- 动态js填充，但预设静态结构保证显示 -->
      </div>

      <!-- AI诊断卡片 -->
      <div class="diagnosis-card">
        <div class="diag-header">
          <span>🧠 AI 知识诊断</span>
          <span class="ai-badge">GPT诊断</span>
        </div>
        <div style="font-size:14px; color:#334155; margin-bottom:2px;">
          根据最近错题，你在这两个知识点较薄弱：
        </div>
        <div class="weak-points">
          <span class="weak-chip">🔴 一元二次方程</span>
          <span class="weak-chip">🟠 因式分解</span>
        </div>
        <div style="font-size:13px; color:#475569; margin-top:6px;">
          建议练习同类题 · 预计提升15%正确率
        </div>
        <div class="progress-mini">
          <div class="progress-fill" style="width:45%"></div>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:12px; color:#64748b;">
          <span>当前掌握度</span><span>45%</span>
        </div>
      </div>
      
      <!-- 额外说明：价值体现 -->
      <div style="background:#f0f4ff; border-radius:18px; padding:14px; font-size:13px; color:#1e3a8a; margin-top:4px;">
        💡 拍照整理效率提升80% · 精准补弱，告别盲目刷题
      </div>
    </div>

    <!-- 拍照模拟界面 (初始隐藏) -->
    <div class="content hidden" id="cameraContent">
      <div style="padding: 10px 0;">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
          <button id="backFromCamera" style="background:none; border:none; font-size:22px; cursor:pointer;">←</button>
          <span style="font-weight:700; font-size:18px;">拍摄错题</span>
        </div>
        <div class="camera-sim" id="simulateCapture">
          <div style="font-size:40px; margin-bottom:10px;">📸</div>
          <div style="font-weight:600; margin-bottom:8px;">点击模拟拍照</div>
          <div style="font-size:13px; color:#64748b;">将自动识别题目并整理</div>
        </div>
        <div id="afterCaptureMsg" class="hidden" style="background:#eef2ff; border-radius:20px; padding:16px; margin-top:12px; text-align:center;">
          <span style="font-size:18px;">✅</span> 已识别：二次函数应用题<br>
          <span style="font-size:13px; color:#4f6ef7;">自动归类 · 诊断知识漏洞</span>
        </div>
        <button id="confirmAddMistake" class="btn-primary" style="margin-top:20px; width:100%;">添加到错题本</button>
      </div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
      <div class="nav-item active" id="navHome">
        <span class="nav-icon">🏠</span>
        <span>首页</span>
      </div>
      <div class="nav-item" id="navMistake">
        <span class="nav-icon">📖</span>
        <span>错题本</span>
      </div>
      <div class="nav-item" id="navDiagnosis">
        <span class="nav-icon">🔍</span>
        <span>诊断</span>
      </div>
      <div class="nav-item" id="navProfile">
        <span class="nav-icon">👤</span>
        <span>我的</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // 初始错题数据
      const initialMistakes = [
        { title: "一元二次方程 · 判别式", subject: "数学", knowledge: "判别式应用", weak: true },
        { title: "因式分解错题", subject: "数学", knowledge: "提公因式", weak: true },
        { title: "浮力计算", subject: "物理", knowledge: "阿基米德原理", weak: false }
      ];

      // 获取DOM元素
      const mainContent = document.getElementById('mainContent');
      const cameraContent = document.getElementById('cameraContent');
      const cameraBtn = document.getElementById('cameraBtn');
      const backBtn = document.getElementById('backFromCamera');
      const simulateCapture = document.getElementById('simulateCapture');
      const afterCaptureMsg = document.getElementById('afterCaptureMsg');
      const confirmAddBtn = document.getElementById('confirmAddMistake');
      const mistakeListContainer = document.getElementById('mistakeListContainer');
      
      // 底部导航元素
      const navHome = document.getElementById('navHome');
      const navMistake = document.getElementById('navMistake');
      const navDiagnosis = document.getElementById('navDiagnosis');
      const navProfile = document.getElementById('navProfile');
      
      // 当前错题列表(动态维护)
      let mistakes = [...initialMistakes];

      // 渲染错题列表
      function renderMistakeList() {
        if (!mistakeListContainer) return;
        if (mistakes.length === 0) {
          mistakeListContainer.innerHTML = `<div style="padding:16px;text-align:center;color:#94a3b8;">暂无错题，拍一张吧</div>`;
          return;
        }
        let html = '';
        mistakes.forEach((m, index) => {
          html += `
            <div class="mistake-item">
              <div class="mistake-icon">${m.subject === '数学' ? '📐' : '⚛️'}</div>
              <div class="mistake-info">
                <div class="mistake-title">${m.title}</div>
                <div class="mistake-meta">
                  <span>${m.subject}</span>
                  <span class="knowledge-tag">${m.knowledge}</span>
                  ${m.weak ? '<span class="weak-badge">薄弱</span>' : ''}
                </div>
              </div>
            </div>
          `;
        });
        mistakeListContainer.innerHTML = html;
      }

      // 切换到首页视图
      function showHome() {
        mainContent.classList.remove('hidden');
        cameraContent.classList.add('hidden');
        setActiveNav('home');
      }

      // 切换到拍照界面
      function showCamera() {
        mainContent.classList.add('hidden');
        cameraContent.classList.remove('hidden');
        // 重置拍照界面状态
        afterCaptureMsg.classList.add('hidden');
        simulateCapture.classList.remove('hidden');
        setActiveNav('camera'); // 可视为特殊状态
      }

      // 设置底部导航active样式
      function setActiveNav(type) {
        [navHome, navMistake, navDiagnosis, navProfile].forEach(n => n.classList.remove('active'));
        if (type === 'home') navHome.classList.add('active');
        else if (type === 'mistake') navMistake.classList.add('active');
        else if (type === 'diagnosis') navDiagnosis.classList.add('active');
        else if (type === 'profile') navProfile.classList.add('active');
        // camera状态不特别高亮导航，保留home或对应
      }

      // 模拟拍照动作
      function handleSimulateCapture() {
        // 显示已识别提示
        simulateCapture.classList.add('hidden');
        afterCaptureMsg.classList.remove('hidden');
      }

      // 确认添加错题
      function handleAddMistake() {
        // 添加一个新错题到列表
        const newMistake = {
          title: "二次函数应用题",
          subject: "数学",
          knowledge: "函数图像",
          weak: true
        };
        mistakes = [newMistake, ...mistakes];
        renderMistakeList();
        // 返回首页并提示 (通过界面更新)
        showHome();
        // 可选轻微提示（通过短暂修改诊断卡片? 保持简洁）
        // 同时更新诊断卡片中的薄弱点（这里动态更新weak-points展示）
        updateDiagnosisWeakPoints();
      }

      // 更新诊断卡片薄弱知识点（基于当前错题weak统计）
      function updateDiagnosisWeakPoints() {
        const weakContainer = document.querySelector('.weak-points');
        if (!weakContainer) return;
        const weakMistakes = mistakes.filter(m => m.weak);
        const uniqueKnowledge = [...new Set(weakMistakes.map(m => m.knowledge))];
        if (uniqueKnowledge.length === 0) {
          weakContainer.innerHTML = '<span class="weak-chip">✅ 暂无薄弱</span>';
          return;
        }
        let chipsHtml = '';
        uniqueKnowledge.slice(0, 3).forEach(k => {
          chipsHtml += `<span class="weak-chip">🔴 ${k}</span>`;
        });
        weakContainer.innerHTML = chipsHtml;
        
        // 动态调整掌握度进度条 (模拟)
        const progressFill = document.querySelector('.progress-fill');
        if (progressFill) {
          const total = mistakes.length;
          const weakCount = weakMistakes.length;
          const rate = total === 0 ? 100 : Math.max(15, Math.floor((1 - weakCount/total) * 100));
          progressFill.style.width = rate + '%';
          const progressText = document.querySelector('.diagnosis-card .flex-row span:last-child');
          // 简单更新旁边数字
        }
      }

      // 事件绑定
      cameraBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        showCamera();
      });

      backBtn.addEventListener('click', () => {
        showHome();
      });

      simulateCapture.addEventListener('click', handleSimulateCapture);

      confirmAddBtn.addEventListener('click', handleAddMistake);

      // 底部导航切换
      navHome.addEventListener('click', () => {
        showHome();
      });

      navMistake.addEventListener('click', () => {
        // 展示错题本视图（复用首页内容，但可强调列表）
        showHome();
        // 轻微滚动或提示，保持简单：直接展示。
      });

      navDiagnosis.addEventListener('click', () => {
        showHome();
        // 可以定位到诊断卡片
        document.querySelector('.diagnosis-card')?.scrollIntoView({ behavior: 'smooth' });
      });

      navProfile.addEventListener('click', () => {
        alert('个人学习数据：累计整理错题 ' + mistakes.length + ' 题');
        showHome();
      });

      // 手动录入按钮示例
      document.getElementById('manualBtn')?.addEventListener('click', () => {
        const manualMistake = {
          title: "手动录入：英语语法",
          subject: "英语",
          knowledge: "时态",
          weak: false
        };
        mistakes = [manualMistake, ...mistakes];
        renderMistakeList();
        updateDiagnosisWeakPoints();
        // 简单反馈
        alert('已手动添加错题');
      });

      // 初始渲染
      renderMistakeList();
      updateDiagnosisWeakPoints();
      
      // 确保主页显示
      showHome();
    })();
  </script>
</body>
</html>
