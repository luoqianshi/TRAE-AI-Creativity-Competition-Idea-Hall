<!DOCTYPE html>
<html lang="zh-CN" data-theme="lofi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>立柱桩设计计算程序</title>
    <!-- Tailwind CSS + daisyUI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            daisyui: { themes: ["lofi", "dark"] },
            theme: { extend: {} }
        }
    </script>
    <style>
        /* 全局字号增大一级 */
        html { font-size: 18px; }
        /* 自定义微调 - 保持表单在lofi/dark下的可读性 */
        [data-theme="dark"] .form-input-fix { background-color: hsl(var(--b2)); color: hsl(var(--bc)); }
        [data-theme="dark"] .section-card-bg { background-color: hsl(var(--b2)/0.5); }
        .calc-step { transition: all 0.2s ease; }
        .calc-step:hover { border-color: hsl(var(--p)); }
        .step-formula { border-left: 3px solid hsl(var(--p)); font-family: 'Consolas','Courier New',monospace; }
        .result-box { font-family: 'JetBrains Mono','Consolas',monospace; }
        .print-only { display: none; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
        @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        /* 计算书表格 */
        .report-table { border-collapse: collapse; width: 100%; margin: 8pt 0; }
        .report-table th, .report-table td { border: 1px solid #999; padding: 5pt 8pt; font-size: 11pt; text-align: left; }
        .report-table th { background: #d9e2f3; font-weight: bold; }
        .report-table .val { text-align: right; font-family: 'Consolas', monospace; }
    </style>
</head>
<body class="min-h-screen">

<!-- ==================== 导航栏 ==================== -->
<div class="navbar bg-base-100/80 backdrop-blur-xl border-b border-base-300 shadow-sm sticky top-0 z-50 px-4 lg:px-8">
    <div class="navbar-start">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary to-primary-focus flex items-center justify-center shadow-lg shadow-primary/20">
                <svg class="w-5 h-5 text-primary-content" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5m-4 0h4"/>
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-bold text-base-content leading-tight">立柱桩设计计算程序</h1>
                <p class="text-xs text-base-content/50 font-medium">支持多道内支撑的立柱桩承载力计算</p>
            </div>
        </div>
    </div>
    <div class="navbar-center hidden lg:flex">
        <div class="badge badge-outline badge-sm gap-1 text-xs">
            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            依据规范 DB42/242-2014
        </div>
    </div>
    <div class="navbar-end gap-2 no-print">
        <!-- 主题切换 -->
        <label class="swap swap-rotate btn btn-ghost btn-circle btn-sm">
            <input type="checkbox" id="theme-toggle" onchange="toggleTheme()">
            <svg class="swap-on w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M21.64 13a1 1 0 0 0-1.05-.14 8.05 8.05 0 0 1-3.37.73 8.15 8.15 0 0 1-8.14-8.1 8.59 8.59 0 0 1 .25-2A1 1 0 0 0 8 2.36a10.14 10.14 0 1 0 14 11.69 1 1 0 0 0-.36-1.05z"/></svg>
            <svg class="swap-off w-5 h-5 fill-current" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </label>
        <button class="btn btn-ghost btn-sm gap-1.5" onclick="resetAll()">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            <span class="hidden sm:inline">重置</span>
        </button>
        <button class="btn btn-success btn-sm gap-1.5" onclick="doCalculate()">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span class="hidden sm:inline">计算</span>
        </button>
    </div>
</div>

<!-- ==================== 主体内容 ==================== -->
<main class="max-w-7xl mx-auto p-4 lg:p-6">

    <!-- Tab 导航 -->
    <div role="tablist" class="tabs tabs-bordered mb-6 no-print">
        <a role="tab" class="tab tab-active" id="tab-input" onclick="switchTab('input')">
            <svg class="w-4 h-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5m-1.414-9.414a2 2 0 1 1 2.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            参数输入
        </a>
        <a role="tab" class="tab" id="tab-result" onclick="switchTab('result')">
            <svg class="w-4 h-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            计算结果
            <span class="badge badge-info badge-xs ml-1 hidden" id="badge-calculated">已计算</span>
        </a>
    </div>

    <!-- ==================== Tab 1: 参数输入 ==================== -->
    <div id="panel-input" class="space-y-6 animate-fade-in">

        <!-- 卡片1：立柱编号 -->
        <div class="card bg-base-100/60 backdrop-blur-xl border border-base-300 shadow-sm animate-fade-in">
            <div class="card-body p-5 lg:p-6">
                <div class="flex items-center gap-3 mb-4 pb-3 border-b border-base-200">
                    <div class="w-9 h-9 rounded-lg bg-primary/10 border border-primary/20 flex items-center justify-center text-primary">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"/></svg>
                    </div>
                    <span class="text-base font-semibold">立柱编号</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <label class="form-control w-full">
                        <div class="label py-1"><span class="label-text text-xs font-semibold uppercase tracking-wider">立柱编号</span></div>
                        <input type="text" id="columnId" value="LZ1" class="input input-bordered input-sm w-full">
                    </label>
                </div>
            </div>
        </div>

        <!-- 卡片2：支撑参数 -->
        <div class="card bg-base-100/60 backdrop-blur-xl border border-base-300 shadow-sm animate-fade-in">
            <div class="card-body p-5 lg:p-6">
                <div class="flex items-center gap-3 mb-4 pb-3 border-b border-base-200">
                    <div class="w-9 h-9 rounded-lg bg-info/10 border border-info/20 flex items-center justify-center text-info">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
                    </div>
                    <span class="text-base font-semibold">支撑参数</span>
                    <span class="badge badge-info badge-sm ml-auto">多道支撑</span>
                </div>
                <div id="support-list" class="space-y-4"></div>
                <button class="btn btn-outline btn-dashed btn-sm w-full mt-4 gap-1.5" onclick="addSupport()">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    添加支撑
                </button>
            </div>
        </div>

        <!-- 卡片3：土层参数 -->
        <div class="card bg-base-100/60 backdrop-blur-xl border border-base-300 shadow-sm animate-fade-in">
            <div class="card-body p-5 lg:p-6">
                <div class="flex items-center gap-3 mb-4 pb-3 border-b border-base-200">
                    <div class="w-9 h-9 rounded-lg bg-warning/10 border border-warning/20 flex items-center justify-center text-warning">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                    </div>
                    <span class="text-base font-semibold">土层参数</span>
                </div>
                <div id="soil-list" class="space-y-4"></div>
                <div class="flex items-center gap-3 mt-4 pt-3 border-t border-base-200">
                    <button class="btn btn-outline btn-dashed btn-sm gap-1.5" onclick="addSoil()">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        添加土层
                    </button>
                    <div class="ml-auto text-sm font-semibold text-primary" id="soil-thickness-summary">累计土层厚度: 0.00 m</div>
                </div>
            </div>
        </div>

        <!-- 卡片4：其他参数 -->
        <div class="card bg-base-100/60 backdrop-blur-xl border border-base-300 shadow-sm animate-fade-in">
            <div class="card-body p-5 lg:p-6">
                <div class="flex items-center gap-3 mb-4 pb-3 border-b border-base-200">
                    <div class="w-9 h-9 rounded-lg bg-accent/10 border border-accent/20 flex items-center justify-center text-accent">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    </div>
                    <span class="text-base font-semibold">其他参数</span>
                </div>

                <!-- 立柱参数 -->
                <div class="mb-4">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="badge badge-ghost badge-sm">立柱</span>
                        <span class="text-sm font-medium">立柱参数</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        <label class="form-control w-full">
                            <div class="label py-1"><span class="label-text text-xs font-semibold uppercase tracking-wider">长度 (m)</span></div>
                            <input type="number" id="columnLength" value="12.5" step="0.1" class="input input-bordered input-sm w-full">
                        </label>
                        <label class="form-control w-full">
                            <div class="label py-1"><span class="label-text text-xs font-semibold uppercase tracking-wider">每米重量 (kN/m)</span></div>
                            <input type="number" id="columnWeightPerMeter" value="2.8" step="0.01" class="input input-bordered input-sm w-full">
                        </label>
                    </div>
                </div>

                <!-- 桩参数 -->
                <div class="mb-4">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="badge badge-ghost badge-sm">桩</span>
                        <span class="text-sm font-medium">桩参数</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        <label class="form-control w-full">
                            <div class="label py-1"><span class="label-text text-xs font-semibold uppercase tracking-wider">直径 (mm)</span></div>
                            <input type="number" id="pileDiameter" value="1200" step="50" class="input input-bordered input-sm w-full">
                        </label>
                        <label class="form-control w-full">
                            <div class="label py-1"><span class="label-text text-xs font-semibold uppercase tracking-wider">深度 (m)</span>
                                <span class="tooltip tooltip-left" data-tip="自动关联土层累计厚度"><span class="text-base-content/30 text-xs cursor-help border border-base-300 rounded-full w-4 h-4 inline-flex items-center justify-center">?</span></span>
                            </div>
                            <input type="number" id="pileDepth" value="26.0" step="0.1" class="input input-bordered input-sm w-full input-info border-info/40 bg-info/5">
                        </label>
                        <label class="form-control w-full">
                            <div class="label py-1"><span class="label-text text-xs font-semibold uppercase tracking-wider">端阻力 (kPa)</span></div>
                            <input type="number" id="pileEndResistance" value="650" step="10" class="input input-bordered input-sm w-full">
                        </label>
                        <label class="form-control w-full">
                            <div class="label py-1"><span class="label-text text-xs font-semibold uppercase tracking-wider">端阻力调整系数</span></div>
                            <input type="number" id="pileEndAdjustmentFactor" value="1" step="0.1" class="input input-bordered input-sm w-full">
                        </label>
                    </div>
                </div>

                <!-- 荷载参数 -->
                <div>
                    <div class="flex items-center gap-2 mb-3">
                        <span class="badge badge-ghost badge-sm">荷载</span>
                        <span class="text-sm font-medium">荷载参数</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        <label class="form-control w-full">
                            <div class="label py-1"><span class="label-text text-xs font-semibold uppercase tracking-wider">可变荷载 (kN/m)</span></div>
                            <input type="number" id="loadVariableLoad" value="5" step="0.1" class="input input-bordered input-sm w-full">
                        </label>
                        <label class="form-control w-full">
                            <div class="label py-1"><span class="label-text text-xs font-semibold uppercase tracking-wider">计算长度 (m)</span></div>
                            <input type="number" id="loadVariableLength" value="10" step="0.1" class="input input-bordered input-sm w-full">
                        </label>
                        <label class="form-control w-full">
                            <div class="label py-1"><span class="label-text text-xs font-semibold uppercase tracking-wider">可变荷载分项系数</span></div>
                            <input type="number" id="loadVariableFactor" value="1.4" step="0.1" class="input input-bordered input-sm w-full">
                        </label>
                        <label class="form-control w-full">
                            <div class="label py-1"><span class="label-text text-xs font-semibold uppercase tracking-wider">永久荷载分项系数</span></div>
                            <input type="number" id="loadDeadFactor" value="1.2" step="0.1" class="input input-bordered input-sm w-full">
                        </label>
                        <label class="form-control w-full">
                            <div class="label py-1"><span class="label-text text-xs font-semibold uppercase tracking-wider">混凝土容重 (kN/m³)</span></div>
                            <input type="number" id="loadConcreteUnitWeight" value="25" step="0.5" class="input input-bordered input-sm w-full">
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- 计算按钮 -->
        <button class="btn btn-success w-full gap-2 no-print" onclick="doCalculate()">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            开始计算
        </button>
    </div>

    <!-- ==================== Tab 2: 计算结果 ==================== -->
    <div id="panel-result" class="space-y-6 animate-fade-in" style="display:none;">

        <!-- 卡片5：计算结果概览 -->
        <div class="card bg-base-100/60 backdrop-blur-xl border border-base-300 shadow-sm animate-fade-in">
            <div class="card-body p-5 lg:p-6">
                <div class="flex items-center gap-3 mb-4 pb-3 border-b border-base-200">
                    <div class="w-9 h-9 rounded-lg bg-success/10 border border-success/20 flex items-center justify-center text-success">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                    </div>
                    <span class="text-base font-semibold">计算结果概览</span>
                </div>
                <div id="result-overview">
                    <div class="text-center py-12 text-base-content/40">
                        <svg class="w-14 h-14 mx-auto mb-4 text-base-content/20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/></svg>
                        <p class="text-sm">点击"开始计算"按钮<br>进行计算</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 卡片6：计算书预览 -->
        <div class="card bg-base-100/60 backdrop-blur-xl border border-base-300 shadow-sm animate-fade-in" id="report-panel" style="display:none;">
            <div class="card-body p-5 lg:p-6">
                <div class="flex items-center gap-3 mb-4 pb-3 border-b border-base-200">
                    <div class="w-9 h-9 rounded-lg bg-accent/10 border border-accent/20 flex items-center justify-center text-accent">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5.586a1 1 0 0 1 .707.293l5.414 5.414a1 1 0 0 1 .293.707V19a2 2 0 0 1-2 2z"/></svg>
                    </div>
                    <span class="text-base font-semibold">计算书预览</span>
                </div>
                <div id="report-content" class="prose prose-sm max-w-none"></div>
            </div>
        </div>

        <!-- 卡片7：下载计算书 -->
        <div class="card bg-base-100/60 backdrop-blur-xl border border-base-300 shadow-sm animate-fade-in" id="download-panel" style="display:none;">
            <div class="card-body p-5">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-lg bg-primary/10 border border-primary/20 flex items-center justify-center text-primary">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        </div>
                        <div>
                            <span class="text-sm font-semibold">下载计算书</span>
                            <p class="text-xs text-base-content/50">导出为 Word 文档 (.doc)</p>
                        </div>
                    </div>
                    <button class="btn btn-primary btn-sm gap-1.5" onclick="exportWord()">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        导出计算书(.doc)
                    </button>
                </div>
            </div>
        </div>
    </div>

</main>

<!-- ==================== 页脚 ==================== -->
<footer class="max-w-7xl mx-auto px-4 lg:px-6 py-6 mt-4 border-t border-base-300 no-print">
    <div class="flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-base-content/40">

<!-- ==================== 脚本 ==================== -->
<script>
/**
 * 立柱桩设计计算程序
 * 依据规范 DB42/242-2014
 */

// ==================== 主题切换 ====================
function toggleTheme() {
    var html = document.documentElement;
    var current = html.getAttribute("data-theme");
    var next = current === "dark" ? "lofi" : "dark";
    html.setAttribute("data-theme", next);
    localStorage.setItem("lizhu-theme", next);
}
(function() {
    var saved = localStorage.getItem("lizhu-theme");
    var toggle = document.getElementById("theme-toggle");
    if (saved) {
        document.documentElement.setAttribute("data-theme", saved);
        if (saved === "dark" && toggle) toggle.checked = true;
    }
})();

// ==================== 数据模型 ====================
var supportIdCounter = 2;
var soilIdCounter = 6;

var defaultSupports = [
    { id: '1', name: '第一道支撑', mainWidth: 1.0, mainHeight: 1.0, mainSpan: 31.5, secondaryWidth: 0.8, secondaryHeight: 1.0, secondarySpan: 0, hasDeck: false, deckThickness: 0.3, deckArea: 64, deckUniformLoad: 30 },
    { id: '2', name: '第二道支撑', mainWidth: 1.2, mainHeight: 1.0, mainSpan: 31.5, secondaryWidth: 1.0, secondaryHeight: 1.0, secondarySpan: 0, hasDeck: false, deckThickness: 0.3, deckArea: 64, deckUniformLoad: 30 }
];

var defaultSoils = [
    { id: '1', name: '2-3层淤泥质粉质黏土', thickness: 7.54, sideFriction: 10, adjustmentFactor: 1 },
    { id: '2', name: '2-4层粉质黏土', thickness: 4.8, sideFriction: 24, adjustmentFactor: 1 },
    { id: '3', name: '2-5层粉质黏土', thickness: 2.1, sideFriction: 28, adjustmentFactor: 1 },
    { id: '4', name: '2-6层粉质黏土粉土粉砂互层', thickness: 4.3, sideFriction: 24, adjustmentFactor: 1 },
    { id: '5', name: '3-2层中粗砂夹卵砾石', thickness: 3.6, sideFriction: 55, adjustmentFactor: 1 },
    { id: '6', name: '3-3层含砾细砂', thickness: 2.9, sideFriction: 35, adjustmentFactor: 1 }
];

var supports = JSON.parse(JSON.stringify(defaultSupports));
var soils = JSON.parse(JSON.stringify(defaultSoils));
var lastResult = null;

// ==================== Tab 切换 ====================
function switchTab(tab) {
    var tabInput = document.getElementById('tab-input');
    var tabResult = document.getElementById('tab-result');
    var panelInput = document.getElementById('panel-input');
    var panelResult = document.getElementById('panel-result');
    if (tab === 'input') {
        tabInput.classList.add('tab-active');
        tabResult.classList.remove('tab-active');
        panelInput.style.display = '';
        panelResult.style.display = 'none';
    } else {
        tabResult.classList.add('tab-active');
        tabInput.classList.remove('tab-active');
        panelResult.style.display = '';
        panelInput.style.display = 'none';
    }
}

// ==================== 支撑列表渲染 ====================
function renderSupports() {
    var container = document.getElementById('support-list');
    var html = '';
    supports.forEach(function(s, idx) {
        var numName = ['第一道支撑','第二道支撑','第三道支撑','第四道支撑','第五道支撑','第六道支撑','第七道支撑','第八道支撑'];
        var displayName = s.name || (numName[idx] || ('第' + (idx+1) + '道支撑'));
        html += '<div class="p-4 rounded-lg bg-base-200/50 border border-base-300 animate-fade-in" data-support-id="' + s.id + '">';
        html += '<div class="flex items-center gap-2 mb-3">';
        html += '<span class="badge badge-info badge-sm">' + (idx+1) + '</span>';
        html += '<input type="text" value="' + escHtml(displayName) + '" onchange="updateSupportName(' + s.id + ', this.value)" class="input input-bordered input-xs w-40" placeholder="支撑名称">';
        html += '<button class="btn btn-ghost btn-xs ml-auto text-error/60 hover:text-error" onclick="removeSupport(' + s.id + ')">';
        html += '<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
        html += '</button></div>';

        // 主撑
        html += '<div class="mb-2"><span class="text-xs font-semibold text-base-content/60 uppercase tracking-wider">主撑</span></div>';
        html += '<div class="grid grid-cols-3 gap-3 mb-3">';
        html += formField('宽 (m)', 'sup_mainWidth_' + s.id, s.mainWidth, 0.01);
        html += formField('高 (m)', 'sup_mainHeight_' + s.id, s.mainHeight, 0.01);
        html += formField('跨度 (m)', 'sup_mainSpan_' + s.id, s.mainSpan, 0.1);
        html += '</div>';

        // 副撑
        html += '<div class="mb-2"><span class="text-xs font-semibold text-base-content/60 uppercase tracking-wider">副撑</span></div>';
        html += '<div class="grid grid-cols-3 gap-3 mb-3">';
        html += formField('宽 (m)', 'sup_secondaryWidth_' + s.id, s.secondaryWidth, 0.01);
        html += formField('高 (m)', 'sup_secondaryHeight_' + s.id, s.secondaryHeight, 0.01);
        html += formField('跨度 (m)', 'sup_secondarySpan_' + s.id, s.secondarySpan, 0.1);
        html += '</div>';

        // 是否打板
        html += '<div class="flex items-center gap-3 mb-3">';
        html += '<label class="flex items-center gap-2 cursor-pointer">';
        html += '<input type="checkbox" id="sup_hasDeck_' + s.id + '" ' + (s.hasDeck ? 'checked' : '') + ' onchange="toggleDeck(' + s.id + ')" class="checkbox checkbox-sm checkbox-primary">';
        html += '<span class="text-sm font-medium">是否打板</span>';
        html += '</label></div>';

        // 打板参数
        var deckDisplay = s.hasDeck ? '' : 'display:none;';
        html += '<div id="sup_deck_' + s.id + '" style="' + deckDisplay + '">';
        html += '<div class="grid grid-cols-3 gap-3">';
        html += formField('板厚 (m)', 'sup_deckThickness_' + s.id, s.deckThickness, 0.01);
        html += formField('板面积 (m²)', 'sup_deckArea_' + s.id, s.deckArea, 1);
        html += formField('均布荷载 (kN/m²)', 'sup_deckUniformLoad_' + s.id, s.deckUniformLoad, 1);
        html += '</div></div>';

        html += '</div>';
    });
    container.innerHTML = html;
}

function formField(label, id, value, step) {
    return '<label class="form-control w-full">' +
        '<div class="label py-1"><span class="label-text text-xs font-semibold uppercase tracking-wider">' + label + '</span></div>' +
        '<input type="number" id="' + id + '" value="' + value + '" step="' + step + '" class="input input-bordered input-sm w-full">' +
        '</label>';
}

function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateSupportName(id, name) {
    var s = supports.find(function(x) { return x.id == id; });
    if (s) s.name = name;
}

function toggleDeck(id) {
    var checked = document.getElementById('sup_hasDeck_' + id).checked;
    var deckDiv = document.getElementById('sup_deck_' + id);
    deckDiv.style.display = checked ? '' : 'none';
    var s = supports.find(function(x) { return x.id == id; });
    if (s) s.hasDeck = checked;
}

function addSupport() {
    supportIdCounter++;
    var numName = ['第一道支撑','第二道支撑','第三道支撑','第四道支撑','第五道支撑','第六道支撑','第七道支撑','第八道支撑'];
    var name = numName[supports.length] || ('第' + (supports.length+1) + '道支撑');
    supports.push({
        id: String(supportIdCounter), name: name,
        mainWidth: 1.0, mainHeight: 1.0, mainSpan: 31.5,
        secondaryWidth: 0.8, secondaryHeight: 1.0, secondarySpan: 0,
        hasDeck: false, deckThickness: 0.3, deckArea: 64, deckUniformLoad: 30
    });
    renderSupports();
}

function removeSupport(id) {
    if (supports.length <= 1) { alert('至少保留一道支撑'); return; }
    supports = supports.filter(function(x) { return x.id != id; });
    renderSupports();
}

// ==================== 土层列表渲染 ====================
function renderSoils() {
    var container = document.getElementById('soil-list');
    var html = '';
    soils.forEach(function(s, idx) {
        html += '<div class="p-4 rounded-lg bg-base-200/50 border border-base-300 animate-fade-in" data-soil-id="' + s.id + '">';
        html += '<div class="flex items-center gap-2 mb-3">';
        html += '<span class="badge badge-warning badge-sm">' + (idx+1) + '</span>';
        html += '<input type="text" value="' + escHtml(s.name) + '" onchange="updateSoilName(' + s.id + ', this.value)" class="input input-bordered input-xs flex-1" placeholder="土层名称">';
        html += '<button class="btn btn-ghost btn-xs ml-auto text-error/60 hover:text-error" onclick="removeSoil(' + s.id + ')">';
        html += '<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
        html += '</button></div>';
        html += '<div class="grid grid-cols-3 gap-3">';
        html += formField('厚度 (m)', 'soil_thickness_' + s.id, s.thickness, 0.01);
        html += formField('侧阻力 (kPa)', 'soil_sideFriction_' + s.id, s.sideFriction, 1);
        html += formField('调整系数', 'soil_adjustmentFactor_' + s.id, s.adjustmentFactor, 0.1);
        html += '</div></div>';
    });
    container.innerHTML = html;
    updateSoilThicknessSummary();
}

function updateSoilName(id, name) {
    var s = soils.find(function(x) { return x.id == id; });
    if (s) s.name = name;
}

function addSoil() {
    soilIdCounter++;
    soils.push({
        id: String(soilIdCounter), name: '新土层',
        thickness: 1.0, sideFriction: 20, adjustmentFactor: 1
    });
    renderSoils();
}

function removeSoil(id) {
    if (soils.length <= 1) { alert('至少保留一层土层'); return; }
    soils = soils.filter(function(x) { return x.id != id; });
    renderSoils();
}

function updateSoilThicknessSummary() {
    var total = 0;
    soils.forEach(function(s) {
        var el = document.getElementById('soil_thickness_' + s.id);
        if (el) total += parseFloat(el.value) || 0;
    });
    document.getElementById('soil-thickness-summary').textContent = '累计土层厚度: ' + total.toFixed(2) + ' m';
    // 自动更新桩深度
    document.getElementById('pileDepth').value = total.toFixed(1);
}

// 监听土层厚度变化
document.addEventListener('input', function(e) {
    if (e.target.id && e.target.id.startsWith('soil_thickness_')) {
        updateSoilThicknessSummary();
    }
});

// ==================== 读取参数 ====================
function gatherSupports() {
    return supports.map(function(s) {
        return {
            id: s.id,
            name: s.name,
            mainWidth: parseFloat(document.getElementById('sup_mainWidth_' + s.id).value) || 0,
            mainHeight: parseFloat(document.getElementById('sup_mainHeight_' + s.id).value) || 0,
            mainSpan: parseFloat(document.getElementById('sup_mainSpan_' + s.id).value) || 0,
            secondaryWidth: parseFloat(document.getElementById('sup_secondaryWidth_' + s.id).value) || 0,
            secondaryHeight: parseFloat(document.getElementById('sup_secondaryHeight_' + s.id).value) || 0,
            secondarySpan: parseFloat(document.getElementById('sup_secondarySpan_' + s.id).value) || 0,
            hasDeck: document.getElementById('sup_hasDeck_' + s.id) ? document.getElementById('sup_hasDeck_' + s.id).checked : false,
            deckThickness: parseFloat(document.getElementById('sup_deckThickness_' + s.id) ? document.getElementById('sup_deckThickness_' + s.id).value : 0) || 0,
            deckArea: parseFloat(document.getElementById('sup_deckArea_' + s.id) ? document.getElementById('sup_deckArea_' + s.id).value : 0) || 0,
            deckUniformLoad: parseFloat(document.getElementById('sup_deckUniformLoad_' + s.id) ? document.getElementById('sup_deckUniformLoad_' + s.id).value : 0) || 0
        };
    });
}

function gatherSoils() {
    return soils.map(function(s) {
        return {
            id: s.id,
            name: s.name,
            thickness: parseFloat(document.getElementById('soil_thickness_' + s.id).value) || 0,
            sideFriction: parseFloat(document.getElementById('soil_sideFriction_' + s.id).value) || 0,
            adjustmentFactor: parseFloat(document.getElementById('soil_adjustmentFactor_' + s.id).value) || 1
        };
    });
}

function gatherParams() {
    return {
        columnId: document.getElementById('columnId').value,
        supports: gatherSupports(),
        soils: gatherSoils(),
        column: {
            length: parseFloat(document.getElementById('columnLength').value) || 0,
            weightPerMeter: parseFloat(document.getElementById('columnWeightPerMeter').value) || 0
        },
        pile: {
            diameter: parseFloat(document.getElementById('pileDiameter').value) || 0,
            depth: parseFloat(document.getElementById('pileDepth').value) || 0,
            endResistance: parseFloat(document.getElementById('pileEndResistance').value) || 0,
            endAdjustmentFactor: parseFloat(document.getElementById('pileEndAdjustmentFactor').value) || 1
        },
        load: {
            variableLoad: parseFloat(document.getElementById('loadVariableLoad').value) || 0,
            variableLength: parseFloat(document.getElementById('loadVariableLength').value) || 0,
            variableFactor: parseFloat(document.getElementById('loadVariableFactor').value) || 1.4,
            deadFactor: parseFloat(document.getElementById('loadDeadFactor').value) || 1.2,
            concreteUnitWeight: parseFloat(document.getElementById('loadConcreteUnitWeight').value) || 25
        }
    };
}

// ==================== 计算核心 ====================
function calculatePileCapacity(supports, soils, pile, column, load) {
    // Variable load
    var variableLoadNk = load.variableLoad * load.variableLength * supports.length;
    var variableLoadDesign = load.variableFactor * variableLoadNk;

    // Column weight
    var columnWeight = column.weightPerMeter * column.length;

    // Support weights
    var supportWeights = supports.map(function(support) {
        var mainWeight = support.mainWidth * support.mainHeight * support.mainSpan * load.concreteUnitWeight;
        var secondaryWeight = support.secondaryWidth * support.secondaryHeight * support.secondarySpan * load.concreteUnitWeight;
        var deckWeight = support.hasDeck && support.deckThickness && support.deckArea
            ? support.deckThickness * support.deckArea * load.concreteUnitWeight : 0;
        var deckUniformWeight = support.hasDeck && support.deckUniformLoad && support.deckArea
            ? support.deckUniformLoad * support.deckArea : 0;
        return mainWeight + secondaryWeight + deckWeight + deckUniformWeight;
    });

    var totalSupportWeight = supportWeights.reduce(function(sum, w) { return sum + w; }, 0);
    var deadLoadNk = columnWeight + totalSupportWeight;
    var deadLoadDesign = load.deadFactor * deadLoadNk;
    var totalLoad = variableLoadDesign + deadLoadDesign;

    // Pile bearing capacity
    var radius = pile.diameter / 2000;
    var area = Math.PI * radius * radius;
    var perimeter = Math.PI * pile.diameter / 1000;

    var sideFrictionResistance = 0;
    var soilDetails = [];
    for (var i = 0; i < soils.length; i++) {
        var soil = soils[i];
        var adjustedFriction = soil.sideFriction * (soil.adjustmentFactor || 1);
        var layerResistance = perimeter * soil.thickness * adjustedFriction;
        sideFrictionResistance += layerResistance;
        soilDetails.push({
            name: soil.name,
            thickness: soil.thickness,
            sideFriction: soil.sideFriction,
            adjustmentFactor: soil.adjustmentFactor || 1,
            adjustedFriction: adjustedFriction,
            layerResistance: layerResistance
        });
    }

    var adjustedEndResistance = pile.endResistance * (pile.endAdjustmentFactor || 1);
    var endResistance = adjustedEndResistance * area;
    var totalRa = endResistance + sideFrictionResistance;
    var isSafe = totalRa > totalLoad;

    return {
        variableLoadNk: variableLoadNk,
        variableLoadDesign: variableLoadDesign,
        columnWeight: columnWeight,
        supportWeights: supportWeights,
        totalSupportWeight: totalSupportWeight,
        deadLoadNk: deadLoadNk,
        deadLoadDesign: deadLoadDesign,
        totalLoad: totalLoad,
        perimeter: perimeter,
        area: area,
        radius: radius,
        soilDetails: soilDetails,
        sideFrictionResistance: sideFrictionResistance,
        adjustedEndResistance: adjustedEndResistance,
        endResistance: endResistance,
        totalRa: totalRa,
        isSafe: isSafe
    };
}

// ==================== 显示结果 ====================
function doCalculate() {
    try {
        var params = gatherParams();
        var result = calculatePileCapacity(params.supports, params.soils, params.pile, params.column, params.load);
        lastResult = { params: params, result: result };

        // 显示已计算badge
        document.getElementById('badge-calculated').classList.remove('hidden');

        // 渲染结果概览
        renderResultOverview(params, result);

        // 渲染计算书
        renderReport(params, result);

        // 显示面板
        document.getElementById('report-panel').style.display = '';
        document.getElementById('download-panel').style.display = '';

        // 切换到结果tab
        switchTab('result');
    } catch (err) {
        alert('计算出错: ' + err.message);
        console.error(err);
    }
}

function renderResultOverview(params, result) {
    var container = document.getElementById('result-overview');
    var html = '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">';

    // 可变荷载
    html += '<div class="card bg-info/5 border border-info/20"><div class="card-body p-4 text-center">';
    html += '<div class="text-xs font-semibold text-info/70 uppercase tracking-wider mb-1">可变荷载 Nk1</div>';
    html += '<div class="text-2xl font-bold text-info">' + result.variableLoadNk.toFixed(2) + '</div>';
    html += '<div class="text-xs text-base-content/50">kN (标准值)</div>';
    html += '</div></div>';

    // 永久荷载
    html += '<div class="card bg-warning/5 border border-warning/20"><div class="card-body p-4 text-center">';
    html += '<div class="text-xs font-semibold text-warning/70 uppercase tracking-wider mb-1">永久荷载 Nk2</div>';
    html += '<div class="text-2xl font-bold text-warning">' + result.deadLoadNk.toFixed(2) + '</div>';
    html += '<div class="text-xs text-base-content/50">kN (标准值)</div>';
    html += '</div></div>';

    // 设计荷载
    html += '<div class="card bg-error/5 border border-error/20"><div class="card-body p-4 text-center">';
    html += '<div class="text-xs font-semibold text-error/70 uppercase tracking-wider mb-1">设计荷载 N</div>';
    html += '<div class="text-2xl font-bold text-error">' + result.totalLoad.toFixed(2) + '</div>';
    html += '<div class="text-xs text-base-content/50">kN (设计值)</div>';
    html += '</div></div>';

    // 承载力
    html += '<div class="card bg-success/5 border border-success/20"><div class="card-body p-4 text-center">';
    html += '<div class="text-xs font-semibold text-success/70 uppercase tracking-wider mb-1">承载力 Ra</div>';
    html += '<div class="text-2xl font-bold text-success">' + result.totalRa.toFixed(2) + '</div>';
    html += '<div class="text-xs text-base-content/50">kN</div>';
    html += '</div></div>';

    html += '</div>';

    // 安全验算
    var ratio = (result.totalRa / result.totalLoad).toFixed(3);
    if (result.isSafe) {
        html += '<div class="p-4 rounded-lg bg-success/10 border border-success/30 flex items-center gap-3">';
        html += '<svg class="w-8 h-8 text-success flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>';
        html += '<div><div class="text-lg font-bold text-success">承载力验算通过</div>';
        html += '<div class="text-sm text-base-content/70">Ra = ' + result.totalRa.toFixed(2) + ' kN > N = ' + result.totalLoad.toFixed(2) + ' kN，安全系数 K = ' + ratio + '</div></div>';
        html += '</div>';
    } else {
        html += '<div class="p-4 rounded-lg bg-error/10 border border-error/30 flex items-center gap-3">';
        html += '<svg class="w-8 h-8 text-error flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>';
        html += '<div><div class="text-lg font-bold text-error">承载力验算不通过</div>';
        html += '<div class="text-sm text-base-content/70">Ra = ' + result.totalRa.toFixed(2) + ' kN < N = ' + result.totalLoad.toFixed(2) + ' kN，安全系数 K = ' + ratio + '</div></div>';
        html += '</div>';
    }

    container.innerHTML = html;
}

function renderReport(params, result) {
    var container = document.getElementById('report-content');
    var html = '';

    // 一、设计参数
    html += '<h3 style="font-size:15pt;font-weight:bold;margin:16pt 0 8pt;border-bottom:2px solid #003d80;padding-bottom:4pt">一、设计参数</h3>';
    html += '<table class="report-table"><tr><th>参数</th><th>数值</th><th>单位</th></tr>';
    html += '<tr><td>立柱编号</td><td>' + escHtml(params.columnId) + '</td><td>-</td></tr>';
    html += '<tr><td>立柱长度</td><td class="val">' + params.column.length + '</td><td>m</td></tr>';
    html += '<tr><td>立柱每米重量</td><td class="val">' + params.column.weightPerMeter + '</td><td>kN/m</td></tr>';
    html += '<tr><td>桩径</td><td class="val">' + params.pile.diameter + '</td><td>mm</td></tr>';
    html += '<tr><td>桩深</td><td class="val">' + params.pile.depth + '</td><td>m</td></tr>';
    html += '<tr><td>端阻力</td><td class="val">' + params.pile.endResistance + '</td><td>kPa</td></tr>';
    html += '<tr><td>端阻力调整系数</td><td class="val">' + params.pile.endAdjustmentFactor + '</td><td>-</td></tr>';
    html += '<tr><td>可变荷载</td><td class="val">' + params.load.variableLoad + '</td><td>kN/m</td></tr>';
    html += '<tr><td>计算长度</td><td class="val">' + params.load.variableLength + '</td><td>m</td></tr>';
    html += '<tr><td>可变荷载分项系数</td><td class="val">' + params.load.variableFactor + '</td><td>-</td></tr>';

    html += '<div class="calc-step p-4 bg-base-200/50 rounded-lg border border-base-300 mb-3">';
    html += '<div class="text-sm font-semibold mb-2 flex items-center gap-2"><span class="badge badge-success badge-sm">4</span>单桩竖向承载力特征值</div>';

    html += '<p style="font-size:12pt;line-height:2">';
    html += '本工程立柱桩（' + escHtml(params.columnId) + '）采用直径 ' + params.pile.diameter + ' mm钻孔灌注桩，桩长 ' + params.pile.depth + ' m。';

    html += '设计荷载 N = ' + result.totalLoad.toFixed(2) + ' kN。';

        html += '<b style="color:green">Ra > N，承载力满足要求。</b>';
    } else {
        html += '<b style="color:red">Ra < N，承载力不满足要求，需调整桩径或桩长。</b>';
    }
    html += '</p></div>';

    container.innerHTML = html;
}
