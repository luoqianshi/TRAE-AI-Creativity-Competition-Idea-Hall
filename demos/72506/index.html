<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 注册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* ========== 认证页面样式 ========== */
        .auth-wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .auth-wrapper .container {
            background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 420px; padding: 40px; position: relative; overflow: hidden;
        }
        h2 { text-align: center; color: #333; margin-bottom: 30px; font-size: 28px; font-weight: 600; }
        .input-group { margin-bottom: 16px; position: relative; }
        .input-group label { display: block; margin-bottom: 6px; color: #555; font-size: 14px; font-weight: 500; }
        .input-group input {
            width: 100%; padding: 12px 14px; border: 2px solid #e0e0e0; border-radius: 10px;
            font-size: 15px; transition: border-color 0.3s; outline: none;
        }
        .input-group input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        .input-row { display: flex; gap: 10px; }
        .input-row input { flex: 1; }
        .btn-code {
            padding: 0 14px; background: #667eea; color: white; border: none; border-radius: 10px;
            font-size: 13px; cursor: pointer; white-space: nowrap; transition: background 0.3s;
        }
        .btn-code:hover { background: #5568d3; }
        .btn-code:disabled { background: #b0b0b0; cursor: not-allowed; }
        .login-method { display: flex; margin-bottom: 20px; background: #f5f5f5; border-radius: 10px; padding: 4px; }
        .login-method button {
            flex: 1; padding: 10px; border: none; background: transparent; border-radius: 8px;
            cursor: pointer; font-size: 14px; color: #666; transition: all 0.3s; font-weight: 500;
        }
        .login-method button.active { background: white; color: #667eea; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .method-content { display: none; }
        .method-content.active { display: block; }
        .qr-code { text-align: center; padding: 30px 0; }
        .qr-placeholder {
            width: 180px; height: 180px; background: #f8f9fa; border: 2px dashed #ddd;
            border-radius: 16px; margin: 0 auto 20px; display: flex; align-items: center;
            justify-content: center; flex-direction: column; color: #999;
        }
        .qr-placeholder svg { width: 60px; height: 60px; fill: #ccc; margin-bottom: 10px; }
        .btn-primary {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-top: 10px;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
        .footer-text { text-align: center; margin-top: 22px; font-size: 14px; }
        .footer-text .black-text { color: #000; }
        .footer-text .blue-link { color: #1890ff; cursor: pointer; font-weight: 500; transition: color 0.3s; }
        .footer-text .blue-link:hover { color: #40a9ff; text-decoration: underline; }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        .remember-forgot { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 13px; }
        .remember-forgot label { display: flex; align-items: center; color: #666; cursor: pointer; }
        .remember-forgot input[type="checkbox"] { margin-right: 6px; width: 16px; height: 16px; accent-color: #667eea; }
        .remember-forgot a { color: #667eea; text-decoration: none; }
        .divider { display: flex; align-items: center; margin: 20px 0; color: #999; font-size: 13px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e0e0e0; }
        .divider span { padding: 0 15px; }
        .social-login { display: flex; justify-content: center; gap: 20px; margin-bottom: 10px; }
        .social-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #e0e0e0; background: white;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; }
        .social-btn:hover { border-color: #667eea; transform: scale(1.1); }
        .hint { font-size: 12px; color: #999; margin-top: 4px; }

        /* ========== 主页样式 ========== */
        .home-page { display: none; min-height: 100vh; background: #f5f7fa; }
        .home-page.active { display: flex; flex-direction: column; }
        .home-header {
            background: white; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 0 24px; height: 60px; display: flex; align-items: center;
            justify-content: space-between; position: sticky; top: 0; z-index: 100;
        }
        .home-header-left { display: flex; align-items: center; gap: 12px; order: 1; }
        .home-logo { font-size: 20px; font-weight: 700; color: #667eea; order: 2; }
        .user-avatar-wrapper { position: relative; cursor: pointer; }
        .user-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s; border: 2px solid transparent;
        }
        .user-avatar:hover { transform: scale(1.08); box-shadow: 0 4px 12px rgba(102,126,234,0.4); border-color: #667eea; }

        /* 个人信息面板 */
        .profile-panel {
            display: none; position: absolute; top: 52px; left: 0;
            width: 300px; background: white; border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15); z-index: 200;
            overflow: hidden; animation: panelFadeIn 0.25s ease;
        }
        .profile-panel.active { display: block; }
        @keyframes panelFadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        .profile-panel-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px; text-align: center; color: white;
        }
        .profile-panel-avatar {
            width: 64px; height: 64px; border-radius: 50%;
            background: rgba(255,255,255,0.2); display: flex; align-items: center;
            justify-content: center; margin: 0 auto 12px; font-size: 28px;
            font-weight: bold; border: 3px solid rgba(255,255,255,0.4);
        }
        .profile-panel-header h3 { font-size: 18px; margin-bottom: 4px; }
        .profile-panel-header p { font-size: 13px; opacity: 0.85; }
        .profile-panel-body { padding: 16px 20px; }
        .profile-info-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px;
        }
        .profile-info-row:last-child { border-bottom: none; }
        .profile-info-label { color: #999; }
        .profile-info-value { color: #333; font-weight: 500; }
        .profile-panel-footer { padding: 12px 20px; border-top: 1px solid #f0f0f0; }
        .btn-logout {
            width: 100%; padding: 10px; background: #fff1f0; color: #ff4d4f;
            border: 1px solid #ffccc7; border-radius: 8px; font-size: 14px;
            font-weight: 500; cursor: pointer; transition: all 0.2s;
        }
        .btn-logout:hover { background: #ff4d4f; color: white; border-color: #ff4d4f; }

        /* ========== 子页面切换栏 ========== */
        .tab-bar {
            background: white; border-bottom: 1px solid #e8e8e8;
            padding: 0 24px; display: flex; align-items: center; gap: 4px;
            height: 48px; position: sticky; top: 60px; z-index: 90;
        }
        .tab-btn {
            padding: 8px 20px; border: none; background: transparent;
            font-size: 14px; font-weight: 500; color: #888;
            cursor: pointer; border-radius: 8px; transition: all 0.2s; position: relative;
        }
        .tab-btn:hover { color: #667eea; background: #f0f2ff; }
        .tab-btn.active { color: #667eea; background: #eef0ff; font-weight: 600; }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: -9px; left: 50%;
            transform: translateX(-50%); width: 60%; height: 3px;
            background: #667eea; border-radius: 3px;
        }

        /* ========== 子页面内容区域 ========== */
        .tab-content { flex: 1; padding: 24px; }
        .tab-page { display: none; }
        .tab-page.active { display: block; }

        /* ========== Skill 市场页面 ========== */
        .skill-market-header { text-align: center; margin-bottom: 30px; }
        .skill-market-header h1 { font-size: 28px; color: #333; font-weight: 700; margin-bottom: 8px; }
        .skill-market-header p { font-size: 15px; color: #999; }

        /* 筛选栏改版 */
        .skill-filter-bar {
            display: flex; justify-content: flex-start; align-items: center; gap: 10px;
            margin-bottom: 24px; max-width: 1000px; margin-left: auto; margin-right: auto;
        }
        .filter-btn {
            padding: 6px 18px; border: 1px solid #e0e0e0; background: white;
            border-radius: 20px; font-size: 13px; font-weight: 500; color: #666;
            cursor: pointer; transition: all 0.2s;
        }
        .filter-btn:hover { border-color: #667eea; color: #667eea; }
        .filter-btn.active { background: #667eea; color: white; border-color: #667eea; }
        .filter-btn.has-selection { background: #eef0ff; color: #667eea; border-color: #667eea; }

        /* 筛选弹窗 */
        .filter-popup-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3); z-index: 400; align-items: flex-start; justify-content: center;
            padding-top: 120px;
        }
        .filter-popup-overlay.active { display: flex; }
        .filter-popup {
            background: white; border-radius: 16px; width: 380px; max-width: 90vw;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2); animation: detailFadeIn 0.25s ease;
            overflow: hidden;
        }
        .filter-popup-header {
            padding: 18px 20px 14px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #f0f0f0;
        }
        .filter-popup-header h4 { font-size: 16px; color: #333; font-weight: 600; }
        .filter-popup-close {
            width: 28px; height: 28px; border: none; background: #f5f5f5; border-radius: 50%;
            cursor: pointer; font-size: 16px; color: #999; display: flex; align-items: center;
            justify-content: center; transition: all 0.2s;
        }
        .filter-popup-close:hover { background: #e8e8e8; color: #333; }
        .filter-popup-body { padding: 16px 20px; }
        .filter-option-row {
            display: flex; align-items: center; gap: 12px; padding: 10px 0;
            border-bottom: 1px solid #f8f8f8; cursor: pointer; transition: background 0.15s;
        }
        .filter-option-row:last-child { border-bottom: none; }
        .filter-option-row:hover { background: #fafafa; margin: 0 -20px; padding: 10px 20px; }
        .filter-option-check {
            width: 20px; height: 20px; border-radius: 50%; border: 2px solid #d9d9d9;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            transition: all 0.2s;
        }
        .filter-option-check.selected {
            border-color: #667eea; background: #667eea;
        }
        .filter-option-check.selected::after {
            content: ''; width: 6px; height: 6px; border-radius: 50%; background: white;
        }
        .filter-option-text { font-size: 14px; color: #333; font-weight: 500; }

        /* ========== 上传 Skill 页面 ========== */
        .upload-page { max-width: 640px; margin: 0 auto; }
        .upload-page h2 { text-align: center; margin-bottom: 28px; }
        .upload-form .input-group textarea {
            width: 100%; padding: 12px 14px; border: 2px solid #e0e0e0; border-radius: 10px;
            font-size: 15px; transition: border-color 0.3s; outline: none; resize: vertical;
            font-family: inherit; min-height: 80px;
        }
        .upload-form .input-group textarea:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        .upload-form .input-row { display: flex; gap: 10px; }
        .upload-form .input-row .input-group { flex: 1; }
        .upload-form .tag-select {
            display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px;
        }
        .upload-form .tag-select button {
            padding: 4px 14px; border: 1px solid #e0e0e0; background: white; border-radius: 14px;
            font-size: 13px; cursor: pointer; transition: all 0.2s; color: #666;
        }
        .upload-form .tag-select button.selected { background: #667eea; color: white; border-color: #667eea; }
        .upload-success { text-align: center; padding: 40px 0; }
        .upload-success .checkmark {
            width: 64px; height: 64px; border-radius: 50%; background: #52c41a;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
            font-size: 32px; color: white; animation: scaleIn 0.4s ease;
        }
        @keyframes scaleIn { from { transform: scale(0); } to { transform: scale(1); } }

        /* ========== 我的页面 ========== */
        .my-page { max-width: 800px; margin: 0 auto; }
        .my-profile-card {
            background: white; border-radius: 16px; padding: 28px; box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            display: flex; align-items: center; gap: 24px; margin-bottom: 28px;
        }
        .my-profile-avatar {
            width: 72px; height: 72px; border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 30px; font-weight: bold; flex-shrink: 0;
        }
        .my-profile-info h3 { font-size: 20px; color: #333; margin-bottom: 4px; }
        .my-profile-info p { font-size: 14px; color: #999; }
        .my-section-title { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 16px; margin-top: 8px; }
        .my-skill-list { display: flex; flex-direction: column; gap: 12px; }
        .my-skill-item {
            background: white; border-radius: 12px; padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex; align-items: center; gap: 16px; transition: box-shadow 0.2s;
        }
        .my-skill-item:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        .my-skill-icon {
            width: 44px; height: 44px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 18px; flex-shrink: 0;
        }
        .my-skill-info { flex: 1; }
        .my-skill-info h4 { font-size: 15px; color: #333; margin-bottom: 2px; }
        .my-skill-info p { font-size: 13px; color: #999; }
        .my-empty { text-align: center; padding: 60px 0; color: #ccc; font-size: 15px; }
        .my-empty p { margin-top: 8px; font-size: 14px; }

        /* ========== 文件展示 ========== */
        .code-section { margin-top: 20px; }
        .code-section h4 { font-size: 15px; color: #333; margin-bottom: 10px; }
        .file-block {
            display: flex; align-items: center; gap: 16px;
            background: #f8f9fa; border: 1px solid #e8e8e8; border-radius: 12px;
            padding: 16px 20px; transition: box-shadow 0.2s;
        }
        .file-block:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .file-icon { font-size: 32px; flex-shrink: 0; }
        .file-info { flex: 1; min-width: 0; }
        .file-name { font-size: 14px; font-weight: 600; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-size { font-size: 12px; color: #999; margin-top: 2px; }
        .file-download-btn {
            padding: 8px 20px; background: #667eea; color: white; border-radius: 8px;
            font-size: 13px; text-decoration: none; font-weight: 500;
            transition: background 0.2s; flex-shrink: 0;
        }
        .file-download-btn:hover { background: #5568d3; }

        /* 标签筛选多选 */
        .filter-popup-footer {
            padding: 14px 20px; border-top: 1px solid #f0f0f0;
            display: flex; gap: 10px; justify-content: flex-end;
        }
        .filter-popup-footer button {
            padding: 8px 20px; border: none; border-radius: 8px; font-size: 13px;
            font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .filter-popup-footer .btn-popup-reset { background: #f5f5f5; color: #666; }
        .filter-popup-footer .btn-popup-reset:hover { background: #eaeaea; }
        .filter-popup-footer .btn-popup-apply {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;
        }
        .filter-popup-footer .btn-popup-apply:hover { box-shadow: 0 4px 12px rgba(102,126,234,0.3); }

        /* 详情页标签 */
        .detail-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .detail-tag-item {
            font-size: 12px; padding: 3px 12px; background: #eef0ff; color: #667eea;
            border-radius: 20px; font-weight: 500;
        }
        .detail-meta-info {
            display: flex; align-items: center; gap: 12px; font-size: 13px; color: #999;
            flex-wrap: wrap;
        }
        .detail-meta-info .meta-sep { color: #e0e0e0; }

        .skill-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px; max-width: 1000px; margin: 0 auto;
        }

        /* --- Skill 卡片 --- */
        .skill-card {
            background: white; border-radius: 14px; padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer; position: relative; display: flex; flex-direction: column;
        }
        .skill-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(102,126,234,0.15); }
        .skill-card-type {
            position: absolute; top: 12px; right: 16px;
            font-size: 11px; font-weight: 600; padding: 3px 10px;
            border-radius: 20px; color: white;
        }
        .type-tool { background: linear-gradient(135deg, #667eea, #764ba2); }
        .type-fun { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .type-dev { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .type-other { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .skill-card-icon {
            width: 48px; height: 48px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; margin-bottom: 12px;
        }
        .skill-card h3 { font-size: 16px; color: #333; font-weight: 600; margin-bottom: 6px; }
        .skill-card-desc {
            font-size: 13px; color: #999; line-height: 1.6; margin-bottom: 16px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            flex: 1;
        }
        .skill-card-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
        .skill-card-price { font-size: 13px; font-weight: 600; }
        .price-free { color: #52c41a; }
        .price-paid { color: #667eea; }
        .skill-card-stats { text-align: right; }
        .skill-card-downloads { font-size: 11px; color: #bbb; margin-bottom: 2px; }
        .skill-card-rating { display: flex; align-items: center; gap: 3px; font-size: 12px; color: #faad14; font-weight: 600; }
        .star-icon { font-size: 12px; }

        /* ========== Skill 详情弹窗 ========== */
        .skill-detail-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.45); z-index: 500;
            align-items: center; justify-content: center;
        }
        .skill-detail-overlay.active { display: flex; }
        .skill-detail {
            background: white; border-radius: 16px; width: 520px; max-width: 92vw;
            max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            animation: detailFadeIn 0.3s ease;
        }
        @keyframes detailFadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .skill-detail-header {
            padding: 28px 28px 20px; display: flex; gap: 16px; align-items: flex-start;
        }
        .skill-detail-icon {
            width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 28px;
        }
        .skill-detail-info { flex: 1; }
        .skill-detail-info h2 { font-size: 20px; color: #333; font-weight: 700; margin-bottom: 4px; text-align: left; }
        .skill-detail-meta {
            display: flex; align-items: center; gap: 12px; font-size: 13px; color: #888; flex-wrap: wrap;
        }
        .skill-detail-meta .detail-type {
            font-size: 11px; font-weight: 600; padding: 2px 10px; border-radius: 20px; color: white;
        }
        .skill-detail-body { padding: 0 28px 28px; }

        /* 星级分布 */
        .rating-section { margin-bottom: 24px; }
        .rating-section h4 { font-size: 15px; color: #333; font-weight: 600; margin-bottom: 12px; }
        .rating-distribution { display: flex; flex-direction: column; gap: 6px; }
        .rating-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
        .rating-row-label { width: 50px; color: #888; flex-shrink: 0; }
        .rating-row-bar-wrap { flex: 1; height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
        .rating-row-bar { height: 100%; border-radius: 4px; background: #faad14; transition: width 0.4s ease; }
        .rating-row-count { width: 36px; text-align: right; color: #999; flex-shrink: 0; }
        .rating-summary { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 14px; color: #333; }
        .rating-summary .big-star { font-size: 28px; color: #faad14; }

        /* 技能介绍 */
        .intro-section { margin-bottom: 24px; border: 1px solid #f0f0f0; border-radius: 12px; overflow: hidden; }
        .intro-section-header {
            background: #fafafa; padding: 12px 16px; font-size: 15px; font-weight: 600; color: #333;
            cursor: pointer; display: flex; align-items: center; justify-content: space-between;
            transition: background 0.2s;
        }
        .intro-section-header:hover { background: #f0f0f0; }
        .intro-section-header .toggle-icon {
            font-size: 12px; color: #999; transition: transform 0.3s;
        }
        .intro-section-header.expanded .toggle-icon { transform: rotate(180deg); }
        .intro-section-body {
            max-height: 0; overflow: hidden; transition: max-height 0.4s ease;
        }
        .intro-section-body.expanded { max-height: 2000px; }
        .intro-block { padding: 16px; }
        .intro-block + .intro-block { border-top: 1px solid #f0f0f0; }
        .intro-block h5 { font-size: 14px; color: #667eea; font-weight: 600; margin-bottom: 8px; }
        .intro-block p, .intro-block ul { font-size: 13px; color: #666; line-height: 1.8; }
        .intro-block ul { padding-left: 20px; }
        .intro-block li { margin-bottom: 4px; }
        .intro-block ol { padding-left: 20px; }
        .intro-block ol li { margin-bottom: 6px; }

        /* 对话示例 */
        .dialog-section { margin-bottom: 24px; }
        .dialog-section h4 { font-size: 15px; color: #333; font-weight: 600; margin-bottom: 12px; }
        .dialog-box {
            background: #f9f9f9; border-radius: 12px; padding: 16px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .dialog-msg {
            max-width: 85%; padding: 10px 14px; border-radius: 12px;
            font-size: 13px; line-height: 1.6; animation: msgFadeIn 0.3s ease;
        }
        @keyframes msgFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .dialog-msg.user {
            align-self: flex-end; background: #667eea; color: white;
            border-bottom-right-radius: 4px;
        }
        .dialog-msg.assistant {
            align-self: flex-start; background: white; color: #333;
            border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .dialog-msg-label {
            font-size: 11px; font-weight: 600; margin-bottom: 4px;
        }
        .dialog-msg.user .dialog-msg-label { color: rgba(255,255,255,0.7); }
        .dialog-msg.assistant .dialog-msg-label { color: #667eea; }

        /* 近期评价 */
        .reviews-section { margin-bottom: 24px; }
        .reviews-section h4 { font-size: 15px; color: #333; font-weight: 600; margin-bottom: 12px; }
        .review-item { padding: 14px 0; border-bottom: 1px solid #f5f5f5; }
        .review-item:last-child { border-bottom: none; }
        .review-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        .review-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 13px; font-weight: bold; flex-shrink: 0;
        }
        .review-user-info { flex: 1; }
        .review-user-name { font-size: 13px; font-weight: 600; color: #333; }
        .review-stars { font-size: 12px; color: #faad14; }
        .review-date { font-size: 11px; color: #ccc; }
        .review-text { font-size: 13px; color: #666; line-height: 1.7; padding-left: 42px; }

        /* 评星区域 */
        .rate-section { margin-bottom: 24px; }
        .rate-section h4 { font-size: 15px; color: #333; font-weight: 600; margin-bottom: 12px; }
        .rate-stars {
            display: flex; gap: 6px; margin-bottom: 12px;
        }
        .rate-star {
            font-size: 28px; color: #ddd; cursor: pointer; transition: color 0.15s, transform 0.15s; user-select: none;
        }
        .rate-star:hover { transform: scale(1.15); }
        .rate-star.active { color: #faad14; }
        .rate-star.hovered { color: #ffd666; }
        .rate-result {
            display: none; align-items: center; gap: 12px; font-size: 14px; color: #666;
        }
        .rate-result.active { display: flex; }
        .rate-result .rate-thanks { font-weight: 500; }
        .btn-write-review {
            padding: 6px 16px; border: 1px solid #667eea; background: white; color: #667eea;
            border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
        }
        .btn-write-review:hover { background: #667eea; color: white; }

        /* 评论输入框 */
        .review-input-area {
            display: none; margin-top: 12px; background: #fafafa; border-radius: 10px; padding: 16px;
        }
        .review-input-area.active { display: block; }
        .review-input-area textarea {
            width: 100%; padding: 10px 12px; border: 1px solid #e0e0e0; border-radius: 8px;
            font-size: 13px; resize: vertical; min-height: 80px; outline: none; font-family: inherit;
        }
        .review-input-area textarea:focus { border-color: #667eea; }
        .review-input-actions {
            display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;
        }
        .review-input-actions button {
            padding: 7px 18px; border: none; border-radius: 8px; font-size: 13px;
            font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn-review-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;
        }
        .btn-review-submit:hover { box-shadow: 0 4px 12px rgba(102,126,234,0.3); }
        .btn-review-cancel { background: #f5f5f5; color: #666; }
        .btn-review-cancel:hover { background: #eaeaea; }

        /* 底部下载按钮 */
        .skill-detail-footer { padding: 0 28px 24px; display: flex; gap: 12px; }
        .btn-download {
            flex: 1; padding: 12px; border: none; border-radius: 10px;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn-download.primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-download.primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(102,126,234,0.4); }
        .btn-download.secondary { background: #f5f5f5; color: #666; }
        .btn-download.secondary:hover { background: #eaeaea; }
    </style>
</head>
<body>
    <!-- 认证页面 -->

                            <p id="qrText">点击模拟扫码登录</p>

                    </div>
                </div>

                <div class="social-login">
                    <button class="social-btn" title="微信登录"><svg viewBox="0 0 24 24" fill="#07C160"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.685 1.455 5.067 3.725 6.558l-.725 2.167 2.625-1.16c.9.225 1.8.45 2.866.45 4.8 0 8.691-3.288 8.691-7.342 0-4.054-3.891-7.015-8.691-7.015zm5.516 2.97c.3 0 .6.3.6.6s-.3.6-.6.6-.6-.3-.6-.6.3-.6.6-.6zm-3.45 0c.3 0 .6.3.6.6s-.3.6-.6.6-.6-.3-.6-.6.3-.6.6-.6zM19.8 13.463c0-3.45-3.45-6.225-7.35-6.225-.3 0-.6 0-.9.075 3.15 3.45 3.375 7.875.675 11.55 1.05-.525 2.025-1.2 2.85-1.95l1.875.825-.525-1.575c1.65-1.2 2.925-2.925 3.375-4.725.3-.3.3-.6.3-.975z"/></svg></button>
                    <button class="social-btn" title="QQ登录"><svg viewBox="0 0 24 24" fill="#12B7F5"><path d="M12.003 2c-2.265 0-6.29 1.364-6.29 7.325v1.195S3.55 14.96 3.55 17.474c0 .665.17 1.025.281 1.025.114 0 .902-.484 1.748-2.072 0 0-.18 2.197 1.904 3.967 0 0-1.77.495-1.77 1.182 0 .686 4.078.43 6.29.43 2.21 0 6.288.257 6.288-.43 0-.687-1.768-1.182-1.768-1.182 2.085-1.77 1.905-3.967 1.905-3.967.845 1.588 1.634 2.072 1.746 2.072.111 0 .283-.36.283-1.025 0-2.514-2.166-6.954-2.166-6.954V9.325C18.29 3.364 14.268 2 12.003 2z"/></svg></button>
                </div>
                <div class="footer-text">
                    <span class="black-text">还没有账号？</span><br><br>
                    <span class="blue-link" onclick="showRegister()">免费注册账号</span>
                </div>
            </div>
            <div id="registerForm" class="register-form hidden">
                <h2>注册账号</h2>
                <div class="input-group">
                    <label for="regUsername">账号名</label>
                    <input type="text" id="regUsername" placeholder="请输入账号名" autocomplete="username">
                </div>
                <div class="input-group">
                    <label for="registerEmail">邮箱</label>
                    <div class="input-row">
                        <input type="email" id="registerEmail" placeholder="请输入邮箱地址" autocomplete="email">
                        <button class="btn-code" id="btnSendCode" onclick="sendEmailCode()">获取验证码</button>
                    </div>
                </div>
                <div class="input-group">
                    <label for="emailCode">邮箱验证码</label>
                    <input type="text" id="emailCode" placeholder="请输入6位验证码" maxlength="6">
                </div>
                <div class="input-group">
                    <label for="registerPassword">密码</label>
                    <input type="password" id="registerPassword" placeholder="至少8位，含大小写字母和数字" autocomplete="new-password">
                    <p class="hint">密码需包含大小写字母和数字，且不少于8位</p>
                </div>
                <div class="input-group">
                    <label for="registerConfirmPassword">确认密码</label>
                    <input type="password" id="registerConfirmPassword" placeholder="请再次输入密码" autocomplete="new-password">
                </div>
                <button class="btn-primary" onclick="handleRegister()">注 册</button>
                <div class="footer-text">
                    <span class="black-text">已有账号？</span><br><br>
                    <span class="blue-link" onclick="showLoginForm()">立即登录</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 主页 -->
    <div class="home-page" id="homePage">
        <div class="home-header">
            <div class="user-avatar-wrapper" id="avatarWrapper">
                <div class="user-avatar" id="userAvatar"></div>
                <div class="profile-panel" id="profilePanel">
                    <div class="profile-panel-header">
                        <div class="profile-panel-avatar" id="profileAvatar"></div>
                        <h3 id="profileUsername"></h3>
                        <p id="profileEmail"></p>
                    </div>
                    <div class="profile-panel-body">
                        <div class="profile-info-row"><span class="profile-info-label">注册时间</span><span class="profile-info-value" id="profileRegDate"></span></div>
                        <div class="profile-info-row"><span class="profile-info-label">登录次数</span><span class="profile-info-value" id="profileLoginCount"></span></div>
                        <div class="profile-info-row"><span class="profile-info-label">上次登录</span><span class="profile-info-value" id="profileLastLogin"></span></div>
                    </div>
                    <div class="profile-panel-footer"><button class="btn-logout" id="btnLogout">退出登录</button></div>
                </div>
            </div>
            <div class="home-logo">MyApp</div>
        </div>

        <div class="tab-bar" id="tabBar">
            <button class="tab-btn active" data-tab="skill-market">Skill 市场</button>
            <button class="tab-btn" data-tab="upload">上传 Skill</button>
            <button class="tab-btn" data-tab="my">我的</button>
        </div>

        <div class="tab-content">
            <div class="tab-page active" id="page-skill-market">
                <div class="skill-market-header">
                    <h1>Skill 市场</h1>
                    <p>发现并获取实用的 Skill，提升你的效率</p>
                </div>
                <!-- 筛选栏：全部、收费（弹窗）、免费、标签（弹窗） -->
                <div class="skill-filter-bar">
                    <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">全部</button>
                    <button class="filter-btn" id="btnPriceFilter" onclick="toggleFilterPopup('price')">
                        价格筛选
                    </button>
                    <button class="filter-btn" id="btnTagFilter" onclick="toggleFilterPopup('tag')">
                        标签筛选
                    </button>
                </div>
                <div class="skill-grid" id="skillGrid"></div>
            </div>

            <!-- ========== 上传 Skill 页面 ========== -->
            <div class="tab-page" id="page-upload">
                <div class="upload-page">
                    <h2>上传 Skill</h2>
                    <div id="uploadForm" class="upload-form">
                        <div class="input-group">
                            <label for="uploadName">Skill 名称</label>
                            <input type="text" id="uploadName" placeholder="例如：智能翻译助手">
                        </div>
                        <div class="input-group">
                            <label for="uploadType">类型</label>
                            <select id="uploadType" style="width:100%;padding:12px 14px;border:2px solid #e0e0e0;border-radius:10px;font-size:15px;outline:none;">
                                <option value="tool">工具</option>
                                <option value="dev">开发</option>
                                <option value="fun">娱乐</option>
                                <option value="other">其他</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="uploadIcon">图标（单个字符）</label>
                            <input type="text" id="uploadIcon" placeholder="例如：T" maxlength="1" style="width:60px;">
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label for="uploadPrice">价格</label>
                                <input type="text" id="uploadPrice" placeholder="免费 / 10 秒点/次">
                            </div>
                            <div class="input-group">
                                <label for="uploadIconBg">图标颜色</label>
                                <input type="color" id="uploadIconBg" value="#667eea">
                            </div>
                        </div>
                        <div class="input-group">
                            <label>标签（点击多选）</label>
                            <div class="tag-select" id="uploadTags"></div>
                        </div>
                        <div class="input-group">
                            <label for="uploadDesc">描述</label>
                            <textarea id="uploadDesc" placeholder="简要描述这个 Skill 的功能"></textarea>
                        </div>
                        <div class="input-group">
                            <label for="uploadDetail">详细介绍（支持 HTML）</label>

                        </div>
                        <div class="input-group">

                            <input type="file" id="uploadFileInput" style="width:100%;padding:10px 0;font-size:14px;" onchange="document.getElementById('uploadFileName').textContent = this.files.length ? this.files[0].name : '未选择文件'">

                    </div>
                    <div id="uploadSuccess" class="upload-success hidden">

                        <h3 style="color:#333;margin-bottom:8px;">上传成功！</h3>
                        <p style="color:#999;">你的 Skill 已发布到市场。</p>
                        <button class="btn-primary" onclick="switchTab('skill-market')" style="max-width:200px;margin:20px auto 0;">前往市场查看</button>

                            <p style="margin-top:4px;font-size:13px;color:#bbb;" id="myRegDate"></p>
