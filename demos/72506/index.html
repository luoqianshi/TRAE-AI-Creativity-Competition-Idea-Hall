    <!-- Skill 详情弹窗 -->
    <div class="skill-detail-overlay" id="skillDetailOverlay">
        <div class="skill-detail" id="skillDetail"></div>
    </div>

    <script>
        // ========== 🏷️ storage 函数定义（与 storage.js 同步，保持一致） ==========
        var STORAGE_KEY_USERS = 'demo_users';         // [sync:storage] 常量
        var STORAGE_KEY_CURRENT = 'demo_current_user'; // [sync:storage] 常量
        var STORAGE_KEY_REMEMBER = 'demo_remember';    // [sync:storage] 常量
        var STORAGE_KEY_VERIFY = 'demo_verify_code';   // [sync:storage] 常量
        var STORAGE_KEY_RATINGS = 'demo_skill_ratings';// [sync:storage] 常量
        var STORAGE_KEY_MY_SKILLS = 'demo_my_skills';  // [sync:storage] 我上传的 Skill

        function escapeHtml(str) { var div = document.createElement('div'); div.textContent = str; return div.innerHTML; } // [sync:storage]
        function getUsers() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY_USERS)) || []; } catch(e) { return []; } } // [sync:storage] 用户 CRUD
        function saveUsers(users) { localStorage.setItem(STORAGE_KEY_USERS, JSON.stringify(users)); } // [sync:storage]
        function findUserByEmail(email) { return getUsers().find(function(u) { return u.email === email; }); } // [sync:storage]
        function findUserByUsername(username) { return getUsers().find(function(u) { return u.username === username; }); } // [sync:storage]
        function addUser(newUser) { var users = getUsers(); users.push(newUser); saveUsers(users); } // [sync:storage]
        function setCurrentUser(user) { localStorage.setItem(STORAGE_KEY_CURRENT, JSON.stringify(user)); } // [sync:storage] 当前登录
        function getCurrentUser() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY_CURRENT)); } catch(e) { return null; } } // [sync:storage]
        function clearCurrentUser() { localStorage.removeItem(STORAGE_KEY_CURRENT); } // [sync:storage]
        function setRemembered(username) { localStorage.setItem(STORAGE_KEY_REMEMBER, username); } // [sync:storage] 记住账号
        function getRemembered() { return localStorage.getItem(STORAGE_KEY_REMEMBER) || ''; } // [sync:storage]
        function clearRemembered() { localStorage.removeItem(STORAGE_KEY_REMEMBER); } // [sync:storage]
        function saveVerifyCode(data) { localStorage.setItem(STORAGE_KEY_VERIFY, JSON.stringify(data)); } // [sync:storage] 验证码
        function getVerifyCode() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY_VERIFY)); } catch(e) { return null; } } // [sync:storage]
        function clearVerifyCode() { localStorage.removeItem(STORAGE_KEY_VERIFY); } // [sync:storage]
        function getAllRatings() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY_RATINGS)) || {}; } catch(e) { return {}; } } // [sync:storage] 评星
        function saveAllRatings(ratings) { localStorage.setItem(STORAGE_KEY_RATINGS, JSON.stringify(ratings)); } // [sync:storage]
        function getUserRating(skillId, username) { if (!username) return 0; var ratings = getAllRatings(); return (ratings[skillId] || {})[username] || 0; } // [sync:storage]
        function setUserRating(skillId, username, star) { if (!username) return; var ratings = getAllRatings(); if (!ratings[skillId]) ratings[skillId] = {}; ratings[skillId][username] = star; saveAllRatings(ratings); } // [sync:storage]
        function getMySkills() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY_MY_SKILLS)) || []; } catch(e) { return []; } } // [sync:storage] 我上传的 Skill
        function saveMySkills(skills) { localStorage.setItem(STORAGE_KEY_MY_SKILLS, JSON.stringify(skills)); } // [sync:storage]
        function getMySkillsByUser(username) { return getMySkills().filter(function(s) { return s.uploader === username; }); } // [sync:storage]

        // ========== Skill 数据（由 skills-data.js 提供，内联以支持 file:// 协议） ==========
    </script>
    <script src="skills-data.js"></script>
    <script>
        function showAuthPage() {
            document.getElementById('authWrapper').style.display = 'flex';
            document.getElementById('homePage').classList.remove('active');
        }
        function showHomePage(user) {
            document.getElementById('authWrapper').style.display = 'none';
            document.getElementById('homePage').classList.add('active');
            const initial = user.username.charAt(0).toUpperCase();
            document.getElementById('userAvatar').textContent = initial;
            document.getElementById('profileAvatar').textContent = initial;
            document.getElementById('profileUsername').textContent = user.username;
            document.getElementById('profileEmail').textContent = user.email;
            const regDate = user.regDate ? new Date(user.regDate).toLocaleString('zh-CN') : '未知';
            document.getElementById('profileRegDate').textContent = regDate;
            document.getElementById('profileLoginCount').textContent = (user.loginCount || 0) + ' 次';
            const lastLogin = user.lastLogin ? new Date(user.lastLogin).toLocaleString('zh-CN') : '首次登录';
            document.getElementById('profileLastLogin').textContent = lastLogin;
        }

        /* ==============================
         *  子页面切换
         * ============================== */
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-page').forEach(page => page.classList.remove('active'));
            var tabBtn = document.querySelector('.tab-btn[data-tab="' + tabName + '"]');
            if (tabBtn) tabBtn.classList.add('active');
            var page = document.getElementById('page-' + tabName);
            if (page) page.classList.add('active');
            // 切换时刷新对应页面内容
            if (tabName === 'upload') { initUploadTags(); }
            if (tabName === 'my') { renderMyPage(); }
        }

        /* ==============================
         *  Skill 数据（外部引入 skillsData 和 AVAILABLE_TAGS）
         * ============================== */
        const typeClassMap = { tool: 'type-tool', fun: 'type-fun', dev: 'type-dev', other: 'type-other' };
        let currentFilter = 'all';
        let selectedPriceFilter = null;
        let selectedTags = [];

        function renderStars(rating) {
            let html = '';
            for (let i = 1; i <= 5; i++) {
                html += (i <= Math.floor(rating))
                    ? '<span class="star-icon">&#9733;</span>'
                    : '<span class="star-icon" style="color:#ddd;">&#9733;</span>';
            }
            return html;
        }

        function formatDownloads(num) {
            if (num >= 10000) return (num / 10000).toFixed(1) + ' 万';
            if (num >= 1000) return (num / 1000).toFixed(1) + ' k';
            return num.toString();
        }

        function formatFileSize(bytes) {
            if (!bytes) return '未知大小';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function getFilteredSkills() {
            let skills = skillsData.concat(getMySkills());
            // 价格筛选
            if (currentFilter === 'free') skills = skills.filter(s => s.price === '免费');
            else if (currentFilter === 'paid') skills = skills.filter(s => s.price !== '免费');
            else if (selectedPriceFilter === 'free') skills = skills.filter(s => s.price === '免费');
            else if (selectedPriceFilter === 'paid') skills = skills.filter(s => s.price !== '免费');
            // 标签筛选（多选，匹配任一即显示）
            if (selectedTags.length > 0) {
                skills = skills.filter(s => s.tags && s.tags.some(t => selectedTags.includes(t)));
            }
            return skills;
        }

        function renderSkillGrid() {
            const grid = document.getElementById('skillGrid');
            const skills = getFilteredSkills();
            if (skills.length === 0) {
                grid.innerHTML = '<p style="text-align:center;color:#999;padding:40px 0;">暂无符合条件的 Skill</p>';
                return;
            }
            grid.innerHTML = skills.map(skill => {
                const typeClass = typeClassMap[skill.type] || 'type-other';
                const priceClass = skill.price === '免费' ? 'price-free' : 'price-paid';
                return `
                <div class="skill-card" onclick="openSkillDetail(${skill.id})">
                    <span class="skill-card-type ${typeClass}">${escapeHtml(skill.typeLabel)}</span>
                    <div class="skill-card-icon" style="background: ${skill.iconBg}; color: white; font-weight: bold;">${skill.icon}</div>
                    <h3>${escapeHtml(skill.name)}</h3>
                    <p class="skill-card-desc">${escapeHtml(skill.desc)}</p>
                    <div class="skill-card-bottom">
                        <span class="skill-card-price ${priceClass}">${escapeHtml(skill.price)}</span>
                        <div class="skill-card-stats">
                            <div class="skill-card-downloads">${skill.publisher ? escapeHtml(skill.publisher) + ' · ' : ''}${formatDownloads(skill.downloads)} 次下载</div>
                            <div class="skill-card-rating">${skill.rating} ${renderStars(skill.rating)}</div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function setFilter(filter) {
            currentFilter = filter;
            selectedPriceFilter = null;
            document.querySelectorAll('.skill-filter-bar .filter-btn').forEach(btn => {
                btn.classList.remove('active', 'has-selection');
            });
            const allBtn = document.querySelector('.skill-filter-bar .filter-btn[data-filter="all"]');
            if (filter === 'all') {
                allBtn.classList.add('active');
                selectedTags = [];
            } else if (filter === 'free' || filter === 'paid') {
                selectedPriceFilter = filter;
            }
            updateFilterBtnStates();
            renderSkillGrid();
        }

        /* ==============================
         *  筛选弹窗
         * ============================== */
        let currentPopupType = null;

        function toggleFilterPopup(type) {
            currentPopupType = type;
            const overlay = document.getElementById('filterPopupOverlay');
            const title = document.getElementById('filterPopupTitle');
            const body = document.getElementById('filterPopupBody');
            const footer = document.getElementById('filterPopupFooter');

            if (type === 'price') {
                title.textContent = '价格筛选';
                const options = [
                    { key: 'all', label: '全部', checked: !selectedPriceFilter },
                    { key: 'free', label: '免费', checked: selectedPriceFilter === 'free' },
                    { key: 'paid', label: '收费', checked: selectedPriceFilter === 'paid' }
                ];
                body.innerHTML = options.map(o => `
                    <div class="filter-option-row" data-value="${o.key}" onclick="selectPopupOption(this, '${o.key}', '${type}')">
                        <div class="filter-option-check ${o.checked ? 'selected' : ''}"></div>
                        <span class="filter-option-text">${o.label}</span>
                    </div>
                `).join('');
                footer.innerHTML = `
                    <button class="btn-popup-reset" onclick="resetPopupFilter()">重置</button>
                    <button class="btn-popup-apply" onclick="applyPopupFilter()">确定</button>
                `;
            } else if (type === 'tag') {
                title.textContent = '标签筛选（可多选）';
                body.innerHTML = AVAILABLE_TAGS.map(tag => `
                    <div class="filter-option-row" data-value="${tag}" onclick="selectPopupOption(this, '${tag}', '${type}')">
                        <div class="filter-option-check ${selectedTags.includes(tag) ? 'selected' : ''}"></div>
                        <span class="filter-option-text">${tag}</span>
                    </div>
                `).join('');
                footer.innerHTML = `
                    <button class="btn-popup-reset" onclick="resetPopupFilter()">重置</button>
                    <button class="btn-popup-apply" onclick="applyPopupFilter()">确定</button>
                `;
            }

            overlay.classList.add('active');
        }

        function selectPopupOption(row, value, type) {
            const check = row.querySelector('.filter-option-check');
            if (type === 'price') {
                // 单选
                document.getElementById('filterPopupBody').querySelectorAll('.filter-option-check').forEach(c => c.classList.remove('selected'));
                check.classList.add('selected');
            } else if (type === 'tag') {
                // 多选
                check.classList.toggle('selected');
            }
        }

        function resetPopupFilter() {
            if (currentPopupType === 'price') {
                selectedPriceFilter = null;
            } else if (currentPopupType === 'tag') {
                selectedTags = [];
            }
            closeFilterPopup();
            currentFilter = 'all';
            updateFilterBtnStates();
            renderSkillGrid();
        }

        function applyPopupFilter() {
            if (currentPopupType === 'price') {
                const selected = document.querySelector('#filterPopupBody .filter-option-check.selected');
                selectedPriceFilter = selected ? selected.parentElement.getAttribute('data-value') : null;
                if (selectedPriceFilter === 'all') selectedPriceFilter = null;
                currentFilter = selectedPriceFilter || 'all';
            } else if (currentPopupType === 'tag') {
                selectedTags = [];
                document.querySelectorAll('#filterPopupBody .filter-option-check.selected').forEach(c => {
                    selectedTags.push(c.parentElement.getAttribute('data-value'));
                });
            }
            closeFilterPopup();
            updateFilterBtnStates();
            renderSkillGrid();
        }

        function findSkillById(id) {
            var s = skillsData.find(function (s) { return s.id === id; });
            if (s) return s;
            return getMySkills().find(function (s) { return s.id === id; }) || null;
        }

        function closeFilterPopup() {
            document.getElementById('filterPopupOverlay').classList.remove('active');
            currentPopupType = null;
        }

        function updateFilterBtnStates() {
            document.querySelectorAll('.skill-filter-bar .filter-btn').forEach(btn => {
                btn.classList.remove('active', 'has-selection');
            });
            const allBtn = document.querySelector('.skill-filter-bar .filter-btn[data-filter="all"]');
            if (!selectedPriceFilter && selectedTags.length === 0) {
                allBtn.classList.add('active');
            }
            const priceBtn = document.getElementById('btnPriceFilter');
            if (selectedPriceFilter) priceBtn.classList.add('has-selection');
            const tagBtn = document.getElementById('btnTagFilter');
            if (selectedTags.length > 0) tagBtn.classList.add('has-selection');
        }

        /* ==============================
         *  Skill 详情
         * ============================== */
        function openSkillDetail(skillId) {
            const skill = findSkillById(skillId);
            if (!skill) return;
            const detail = document.getElementById('skillDetail');
            const overlay = document.getElementById('skillDetailOverlay');
            const typeClass = typeClassMap[skill.type] || 'type-other';
            const totalRatings = skill.ratingDist[5] + skill.ratingDist[4] + skill.ratingDist[3] + skill.ratingDist[2] + skill.ratingDist[1];

            let ratingBarsHtml = '';
            for (let star = 5; star >= 1; star--) {
                const count = skill.ratingDist[star] || 0;
                const pct = totalRatings > 0 ? (count / totalRatings * 100) : 0;
                ratingBarsHtml += `
                <div class="rating-row">
                    <span class="rating-row-label">${star} 星</span>
                    <div class="rating-row-bar-wrap"><div class="rating-row-bar" style="width: ${pct}%;"></div></div>
                    <span class="rating-row-count">${count}</span>
                </div>`;
            }

            let reviewsHtml = skill.reviews.map(r => {
                const initial = r.user.charAt(0);
                return `
                <div class="review-item">
                    <div class="review-header">
                        <div class="review-avatar">${escapeHtml(initial)}</div>
                        <div class="review-user-info">
                            <div class="review-user-name">${escapeHtml(r.user)}</div>
                            <div style="display:flex;align-items:center;gap:8px;">
                                <span class="review-stars">${renderStars(r.rating)}</span>
                                <span class="review-date">${escapeHtml(r.date)}</span>
                            </div>
                        </div>
                    </div>
                    <div class="review-text">${escapeHtml(r.text)}</div>
                </div>`;
            }).join('');

            let dialogHtml = (skill.dialogExample || []).map(d => {
                const cls = d.role === 'user' ? 'user' : 'assistant';
                const label = d.role === 'user' ? '用户' : 'Skill';
                return `
                <div class="dialog-msg ${cls}">
                    <div class="dialog-msg-label">${label}</div>
                    <div>${escapeHtml(d.text)}</div>
                </div>`;
            }).join('');

            detail.innerHTML = `
                <div class="skill-detail-header">
                    <div class="skill-detail-icon" style="background: ${skill.iconBg}; color: white; font-weight: bold;">${skill.icon}</div>
                    <div class="skill-detail-info">
                        <h2>${escapeHtml(skill.name)}</h2>
                        <div class="skill-detail-meta">
                            <span class="detail-type ${typeClass}">${escapeHtml(skill.typeLabel)}</span>
                            <span class="skill-card-rating">${skill.rating} ${renderStars(skill.rating)}</span>
                        </div>
                        <div class="detail-meta-info" style="margin-top:8px;">
                            <span>发布者：${escapeHtml(skill.publisher || '未知')}</span>
                            <span class="meta-sep">|</span>
                            <span>上架日期：${escapeHtml(skill.listedDate || '未知')}</span>
                            <span class="meta-sep">|</span>
                            <span>${formatDownloads(skill.downloads)} 次下载</span>
                        </div>
                        ${skill.tags && skill.tags.length > 0 ? '<div class="detail-tags" style="margin-top:8px;">' + skill.tags.map(t => '<span class="detail-tag-item">' + escapeHtml(t) + '</span>').join('') + '</div>' : ''}
                    </div>
                </div>
                <div class="skill-detail-body">
                    <div class="rating-section">
                        <div class="rating-summary">
                            <span class="big-star">&#9733;</span>
                            <span style="font-size:28px;font-weight:700;color:#333;">${skill.rating}</span>
                            <span style="color:#999;font-size:13px;">(${totalRatings} 人评价)</span>
                        </div>
                        <div class="rating-distribution">${ratingBarsHtml}</div>
                    </div>

                    <div class="intro-section">
                        <div class="intro-section-header expanded" onclick="toggleIntroSection(this)">
                            <span>技能介绍</span>
                            <span class="toggle-icon">&#9650;</span>
                        </div>
                        <div class="intro-section-body expanded">
                            <div class="intro-block">
                                <h5>核心功能亮点</h5>
                                ${skill.intro.highlights}
                            </div>
                            <div class="intro-block">
                                <h5>使用流程说明</h5>
                                ${skill.intro.workflow}
                            </div>
                            <div class="intro-block">
                                <h5>使用效果说明</h5>
                                ${skill.intro.effect}
                            </div>
                        </div>
                    </div>

                    <div class="dialog-section">
                        <h4>对话示例</h4>
                        <div class="dialog-box">${dialogHtml}</div>
                    </div>

                    ${skill.file ? '<div class="code-section"><h4>附件文件</h4><div class="file-block"><div class="file-icon">&#128196;</div><div class="file-info"><div class="file-name">' + escapeHtml(skill.file.name) + '</div><div class="file-size">' + formatFileSize(skill.file.size) + '</div></div><a class="file-download-btn" href="' + skill.file.data + '" download="' + escapeHtml(skill.file.name) + '">下载文件</a></div></div>' : ''}

                    <div class="reviews-section">
                        <h4>近期评价</h4>
                        ${reviewsHtml}
                    </div>

                    <div class="rate-section">
                        <h4>评价此 Skill</h4>
                        <div class="rate-stars" id="rateStars">
                            <span class="rate-star" data-star="1">&#9733;</span>
                            <span class="rate-star" data-star="2">&#9733;</span>
                            <span class="rate-star" data-star="3">&#9733;</span>
                            <span class="rate-star" data-star="4">&#9733;</span>
                            <span class="rate-star" data-star="5">&#9733;</span>
                        </div>
                        <div class="rate-result" id="rateResult">
                            <span class="rate-thanks">谢谢！撰写评论以留下更多反馈。</span>
                            <button class="btn-write-review" id="btnWriteReview">撰写评论</button>
                        </div>
                        <div class="review-input-area" id="reviewInputArea">
                            <textarea id="reviewTextInput" placeholder="分享你的使用体验..."></textarea>
                            <div class="review-input-actions">
                                <button class="btn-review-cancel" id="btnReviewCancel">取消</button>
                                <button class="btn-review-submit" id="btnReviewSubmit">提交评论</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="skill-detail-footer">
                    <button class="btn-download primary" onclick="handleDownloadSkill(event, ${skill.id})">下载 Skill</button>
                    <button class="btn-download secondary" onclick="closeSkillDetail()">返回</button>
                </div>`;

            currentRateSkillId = skill.id;
            restoreRatingState(skill);
            bindRateEvents();
            overlay.classList.add('active');
        }

        /* ==============================
         *  上传 Skill
         * ============================== */
        let selectedUploadTags = [];

        function initUploadTags() {
            const container = document.getElementById('uploadTags');
            if (!container) return;
            container.innerHTML = AVAILABLE_TAGS.map(function (tag) {
                var selected = selectedUploadTags.indexOf(tag) >= 0 ? ' selected' : '';
                return '<button class="tag-btn' + selected + '" data-tag="' + tag + '">' + tag + '</button>';
            }).join('');
            container.querySelectorAll('.tag-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var tag = this.getAttribute('data-tag');
                    var idx = selectedUploadTags.indexOf(tag);
                    if (idx >= 0) { selectedUploadTags.splice(idx, 1); } else { selectedUploadTags.push(tag); }
                    this.classList.toggle('selected');
                });
            });
        }

        function handleUploadSkill() {
            var user = getCurrentUser();
            if (!user) { alert('请先登录'); switchTab('skill-market'); return; }
            var name = document.getElementById('uploadName').value.trim();
            var type = document.getElementById('uploadType').value;
            var icon = document.getElementById('uploadIcon').value.trim().toUpperCase() || name.charAt(0);
            var price = document.getElementById('uploadPrice').value.trim() || '免费';
            var iconBg = document.getElementById('uploadIconBg').value;
            var desc = document.getElementById('uploadDesc').value.trim();
            var detail = document.getElementById('uploadDetail').value.trim();
            var fileInput = document.getElementById('uploadFileInput');
            var file = fileInput.files[0];
            if (!name) { alert('请输入 Skill 名称'); return; }
            if (!desc) { alert('请输入 Skill 描述'); return; }

            var typeLabel = { tool: '工具', dev: '开发', fun: '娱乐', other: '其他' }[type] || '其他';
            var mySkills = getMySkills();
            var maxId = skillsData.reduce(function (m, s) { return Math.max(m, s.id); }, 0);
            mySkills.forEach(function (s) { maxId = Math.max(maxId, s.id); });

            function saveNewSkill(fileData) {
                var newSkill = {
                    id: maxId + 1, name: name, type: type, typeLabel: typeLabel,
                    icon: icon, iconBg: iconBg, desc: desc,
                    price: price, rating: 0, downloads: 0, publisher: user.username,
                    listedDate: new Date().toISOString().slice(0, 10),
                    tags: selectedUploadTags.slice(),
                    ratingDist: { 5: 0, 4: 0, 3: 0, 2: 0, 1: 0 },
                    intro: { highlights: '', workflow: '', effect: detail || '' },
                    file: fileData || null,
                    dialogExample: [],
                    reviews: [],
                    uploader: user.username
                };
                mySkills.push(newSkill);
                saveMySkills(mySkills);
                document.getElementById('uploadForm').classList.add('hidden');
                document.getElementById('uploadSuccess').classList.remove('hidden');
                renderSkillGrid();
            }

            if (file) {
                var reader = new FileReader();
                reader.onload = function (e) {
                    saveNewSkill({ name: file.name, type: file.type || 'application/octet-stream', size: file.size, data: e.target.result });
                };
                reader.readAsDataURL(file);
            } else {
                saveNewSkill(null);
            }
        }

        /* ==============================
         *  我的页面
         * ============================== */
        function renderMyPage() {
            var user = getCurrentUser();
            if (!user) { return; }
            var initial = user.username.charAt(0).toUpperCase();
            document.getElementById('myAvatar').textContent = initial;
            document.getElementById('myUsername').textContent = user.username;
            document.getElementById('myEmail').textContent = user.email;
            var regDate = user.regDate ? new Date(user.regDate).toLocaleDateString('zh-CN') : '未知';
            document.getElementById('myRegDate').textContent = '注册时间：' + regDate;
            var mySkills = getMySkillsByUser(user.username);
            var list = document.getElementById('mySkillList');
            if (mySkills.length === 0) {
                list.innerHTML = '<div class="my-empty"><div style="font-size:48px;">&#128640;</div><p>还没有上传过 Skill</p><p style="margin-top:4px;color:#bbb;">前往「上传 Skill」页面发布你的第一个 Skill</p></div>';
            } else {
                list.innerHTML = mySkills.map(function (skill) {
                    return '<div class="my-skill-item" onclick="openSkillDetail(' + skill.id + ')">'
                        + '<div class="my-skill-icon" style="background:' + skill.iconBg + ';">' + escapeHtml(skill.icon) + '</div>'
                        + '<div class="my-skill-info"><h4>' + escapeHtml(skill.name) + '</h4>'
                        + '<p>' + escapeHtml(skill.desc) + '</p></div>'
                        + '<span style="font-size:13px;color:#999;">' + escapeHtml(skill.price) + '</span>'
                        + '</div>';
                }).join('');
            }
        }

        function bindRateEvents() {
            document.querySelectorAll('#rateStars .rate-star').forEach(s => {
                s.addEventListener('click', function() { rateSkill(parseInt(this.getAttribute('data-star'))); });
                s.addEventListener('mouseenter', function() { hoverRateStar(parseInt(this.getAttribute('data-star'))); });
                s.addEventListener('mouseleave', clearRateHover);
            });
            document.getElementById('btnWriteReview').addEventListener('click', showReviewInput);
            document.getElementById('btnReviewCancel').addEventListener('click', hideReviewInput);
            document.getElementById('btnReviewSubmit').addEventListener('click', submitReview);
        }

        function toggleIntroSection(headerEl) {
            headerEl.classList.toggle('expanded');
            const body = headerEl.nextElementSibling;
            body.classList.toggle('expanded');
        }

        /* ==============================
         *  评星 & 评论
         * ============================== */
        let currentRateSkillId = null;
        let currentRateStars = 0;
        let currentUserRating = 0; // 用户本次打开前的已有评分

        // 获取某用户对某 Skill 的评分（0 表示未评分）[sync:storage]
        function getUserRating(skillId, username) {
            if (!username) return 0;
            const ratings = getAllRatings(); // [sync:storage]
            const skillRatings = ratings[skillId] || {};
            return skillRatings[username] || 0;
        }

        // 设置/更新用户对某 Skill 的评分（同时更新 ratingDist）[sync:storage]
        function setUserRating(skillId, username, newStar, oldStar) {
            if (!username) return;
            const ratings = getAllRatings(); // [sync:storage]
            if (!ratings[skillId]) ratings[skillId] = {};
            ratings[skillId][username] = newStar;
            saveAllRatings(ratings); // [sync:storage]

            // 同步更新 ratingDist 和综合评分
            const skill = findSkillById(skillId);
            if (!skill) return;

            // 先把旧评分从 distribution 中减去
            if (oldStar >= 1 && oldStar <= 5) {
                skill.ratingDist[oldStar] = Math.max(0, (skill.ratingDist[oldStar] || 0) - 1);
            }
            // 再加上新评分
            if (newStar >= 1 && newStar <= 5) {
                skill.ratingDist[newStar] = (skill.ratingDist[newStar] || 0) + 1;
            }
            // 重算综合评分（ratingDist 反映所有评星，含无评论的）
            let totalScore = 0, totalCount = 0;
            for (let s = 1; s <= 5; s++) {
                const c = skill.ratingDist[s] || 0;
                totalScore += s * c; totalCount += c;
            }
            skill.rating = totalCount > 0 ? parseFloat((totalScore / totalCount).toFixed(1)) : skill.rating;
        }

        // 打开详情时恢复用户的评星状态
        function restoreRatingState(skill) {
            const user = getCurrentUser(); // [sync:storage]
            const existingRating = user ? getUserRating(skill.id, user.username) : 0; // [sync:storage]
            currentUserRating = existingRating;
            currentRateStars = existingRating;
            const stars = document.querySelectorAll('#rateStars .rate-star');
            stars.forEach((s, i) => {
                s.classList.toggle('active', i < existingRating);
            });
            // 如果之前评过，显示提示和撰写按钮
            if (existingRating > 0) {
                document.getElementById('rateResult').classList.add('active');
            } else {
                document.getElementById('rateResult').classList.remove('active');
            }
            document.getElementById('reviewInputArea').classList.remove('active');
            document.getElementById('reviewTextInput').value = '';
        }

        function rateSkill(starNum) {
            currentRateStars = starNum;
            const stars = document.querySelectorAll('#rateStars .rate-star');
            stars.forEach((s, i) => {
                s.classList.toggle('active', i < starNum);
                s.classList.remove('hovered');
            });
            // 立即保存评分到 localStorage + 更新 ratingDist
            const user = getCurrentUser(); // [sync:storage]
            if (user) {
                setUserRating(currentRateSkillId, user.username, starNum, currentUserRating); // [sync:storage]
                currentUserRating = starNum; // 更新缓存
            }
            document.getElementById('rateResult').classList.add('active');
            // 刷新详情页以更新显示的评分
            openSkillDetail(currentRateSkillId);
        }

        function hoverRateStar(starNum) {
            const stars = document.querySelectorAll('#rateStars .rate-star');
            stars.forEach((s, i) => {
                if (i < starNum && !s.classList.contains('active')) s.classList.add('hovered');
                else s.classList.remove('hovered');
            });
        }

        function clearRateHover() {
            document.querySelectorAll('#rateStars .rate-star').forEach(s => s.classList.remove('hovered'));
        }

        function showReviewInput() {
            document.getElementById('reviewInputArea').classList.add('active');
            document.getElementById('reviewTextInput').focus();
        }

        function hideReviewInput() {
            document.getElementById('reviewInputArea').classList.remove('active');
            document.getElementById('reviewTextInput').value = '';
        }

        function submitReview() {
            const text = document.getElementById('reviewTextInput').value.trim();
            if (!text) { alert('请输入评论内容'); return; }
            if (!currentRateSkillId) return;
            const user = getCurrentUser(); // [sync:storage]
            if (!user) { alert('请先登录'); return; }
            const skill = findSkillById(currentRateSkillId);
            if (!skill) return;
            if (skill.uploader) { alert('评论功能仅支持官方 Skill'); return; }
            // 评星已计入 ratingDist，评论不重复计分
            const reviewRating = currentUserRating > 0 ? currentUserRating : 5;
            skill.reviews.unshift({
                user: user.username,
                text: text, rating: reviewRating, date: new Date().toISOString().slice(0, 10)
            });
            hideReviewInput();
            openSkillDetail(currentRateSkillId);
            alert('评论提交成功！');
        }

        function closeSkillDetail() {
            document.getElementById('skillDetailOverlay').classList.remove('active');
        }

        function handleDownloadSkill(e, skillId) {
            e.stopPropagation();
            const skill = findSkillById(skillId);
            if (!skill) return;
            if (skill.price !== '免费') {
                alert(`【模拟支付】"${skill.name}" 需要 ${skill.price}\n\n（当前为模拟环境，实际不会扣费）`);
            }
            alert(`已成功下载 Skill: ${skill.name}\n\n（当前为模拟环境）`);
        }

        /* ==============================
         *  个人信息面板
         * ============================== */
        function toggleProfilePanel(e) {
            e.stopPropagation();
            const panel = document.getElementById('profilePanel');
            if (panel.classList.contains('active')) {
                panel.classList.remove('active');
            } else {
                const user = getCurrentUser(); // [sync:storage]
                if (!user) return;
                const regDate = user.regDate ? new Date(user.regDate).toLocaleString('zh-CN') : '未知';
                document.getElementById('profileRegDate').textContent = regDate;
                document.getElementById('profileLoginCount').textContent = (user.loginCount || 0) + ' 次';
                const lastLogin = user.lastLogin ? new Date(user.lastLogin).toLocaleString('zh-CN') : '首次登录';
                document.getElementById('profileLastLogin').textContent = lastLogin;
                panel.classList.add('active');
            }
        }
        function closeProfilePanel() { document.getElementById('profilePanel').classList.remove('active'); }

        function logout(e) {
            if (e) e.stopPropagation();
            clearCurrentUser(); // [sync:storage]
            closeProfilePanel();
            document.getElementById('homePage').classList.remove('active');
            document.getElementById('authWrapper').style.display = 'flex';
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('loginForm').classList.add('fade-in');
            const remembered = getRemembered(); // [sync:storage]
            if (remembered) { document.getElementById('loginUsername').value = remembered; document.getElementById('rememberMe').checked = true; }
        }

        /* ==============================
         *  初始化
         * ============================== */
        window.addEventListener('DOMContentLoaded', function() {
            const currentUser = getCurrentUser(); // [sync:storage]
            if (currentUser) { showHomePage(currentUser); }
            else {
                const remembered = getRemembered(); // [sync:storage]
                if (remembered) { document.getElementById('loginUsername').value = remembered; document.getElementById('rememberMe').checked = true; }
            }

            renderSkillGrid();

            document.getElementById('avatarWrapper').addEventListener('click', function(e) { e.stopPropagation(); toggleProfilePanel(e); });
            document.getElementById('btnLogout').addEventListener('click', function(e) { e.stopPropagation(); logout(); });
            document.addEventListener('click', function() { closeProfilePanel(); });

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function(e) { e.stopPropagation(); switchTab(this.getAttribute('data-tab')); });
            });

            document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
                btn.addEventListener('click', function(e) { e.stopPropagation(); setFilter(this.getAttribute('data-filter')); });
            });

            document.getElementById('skillDetailOverlay').addEventListener('click', function(e) { if (e.target === this) closeSkillDetail(); });

            document.getElementById('filterPopupOverlay').addEventListener('click', function(e) {
                if (e.target === this) closeFilterPopup();
            });
        });

        function showRegister() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('fade-in');
        }
        function showLoginForm() {
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('loginForm').classList.add('fade-in');
            const remembered = getRemembered(); // [sync:storage]
            if (remembered) { document.getElementById('loginUsername').value = remembered; document.getElementById('rememberMe').checked = true; }
        }
        function switchLoginMethod(method) {
            const buttons = document.querySelectorAll('.login-method button');
            const contents = document.querySelectorAll('.method-content');
            buttons.forEach(btn => btn.classList.remove('active'));
            contents.forEach(c => c.classList.remove('active'));
            if (method === 'password') { buttons[0].classList.add('active'); document.getElementById('passwordMethod').classList.add('active'); }
            else { buttons[1].classList.add('active'); document.getElementById('qrcodeMethod').classList.add('active'); }
        }

        function handleQrLogin() {
            const qrEl = document.getElementById('qrPlaceholder');
            const qrText = document.getElementById('qrText');
            qrEl.style.opacity = '0.5';
            qrText.textContent = '扫描中...';
            setTimeout(function () {
                qrEl.style.opacity = '1';
                qrText.textContent = '点击模拟扫码登录';
                const username = prompt('【模拟扫码】检测到已登录设备\n请输入用户名以完成登录：');
                if (!username) return;
                const users = getUsers();
                const user = users.find(function (u) { return u.username === username; });
                if (!user) { alert('该用户不存在，请先注册'); return; }
                user.loginCount = (user.loginCount || 0) + 1; user.lastLogin = Date.now();
                saveUsers(users); setCurrentUser(user);
                showHomePage(user);
            }, 2000);
        }

        function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const remember = document.getElementById('rememberMe').checked;
            if (!username) { showError('loginUsername', '请输入账号名或邮箱'); return; }
            if (!password) { showError('loginPassword', '请输入密码'); return; }
            const users = getUsers(); // [sync:storage]
            const user = users.find(u => u.username === username || u.email === username);
            if (!user) { showError('loginUsername', '该账号未注册'); return; }
            if (user.password !== password) { showError('loginPassword', '密码错误'); return; }
            if (remember) { setRemembered(username); } else { clearRemembered(); } // [sync:storage]
            user.loginCount = (user.loginCount || 0) + 1; user.lastLogin = Date.now();
            saveUsers(users); setCurrentUser(user); // [sync:storage]
            document.getElementById('loginPassword').value = '';
            showHomePage(user);
        }

        function generateCode() { let code = ''; for (let i = 0; i < 6; i++) code += Math.floor(Math.random() * 10); return code; }
        function sendEmailCode() {
            const email = document.getElementById('registerEmail').value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email) { showError('registerEmail', '请先输入邮箱'); return; }
            if (!emailRegex.test(email)) { showError('registerEmail', '请输入有效的邮箱地址'); return; }
            if (findUserByEmail(email)) { showError('registerEmail', '该邮箱已被注册'); return; } // [sync:storage]
            const code = generateCode();
            saveVerifyCode({ email, code, expireAt: Date.now() + 300000 }); // [sync:storage]
            alert(`【模拟邮件】验证码已发送至 ${email}\n\n验证码：${code}\n\n（有效期5分钟，请尽快输入）`);
            const btn = document.getElementById('btnSendCode');
            btn.disabled = true; let sec = 60; btn.textContent = `${sec}s后重发`;
            const timer = setInterval(() => { sec--; if (sec <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = '获取验证码'; } else { btn.textContent = `${sec}s后重发`; } }, 1000);
        }
        function verifyEmailCode(email, inputCode) {
            const data = getVerifyCode(); // [sync:storage]
            if (!data) return { ok: false, msg: '请先获取验证码' };
            if (data.email !== email) return { ok: false, msg: '邮箱与验证码不匹配' };
            if (Date.now() > data.expireAt) return { ok: false, msg: '验证码已过期，请重新获取' };
            if (data.code !== inputCode) return { ok: false, msg: '验证码错误' };
            return { ok: true };
        }

        function handleRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const code = document.getElementById('emailCode').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;
            if (!username) { showError('regUsername', '请输入账号名'); return; }
            if (username.length < 2) { showError('regUsername', '账号名至少2个字符'); return; }
            if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(username)) { showError('regUsername', '账号名不能为邮箱地址格式'); return; }
            if (findUserByUsername(username)) { showError('regUsername', '该账号名已被注册'); return; } // [sync:storage]
            if (!email) { showError('registerEmail', '请输入邮箱'); return; }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('registerEmail', '请输入有效的邮箱地址'); return; }
            if (findUserByEmail(email)) { showError('registerEmail', '该邮箱已被注册'); return; } // [sync:storage]
            if (!code) { showError('emailCode', '请输入邮箱验证码'); return; }
            const vr = verifyEmailCode(email, code);
            if (!vr.ok) { showError('emailCode', vr.msg); return; }
            if (!password) { showError('registerPassword', '请输入密码'); return; }
            if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/.test(password)) { showError('registerPassword', '密码需至少8位，且同时包含大小写字母和数字'); return; }
            if (password !== confirmPassword) { showError('registerConfirmPassword', '两次输入的密码不一致'); return; }
            const newUser = { username, email, password, regDate: Date.now(), loginCount: 0, lastLogin: null };
            const users = getUsers(); users.push(newUser); saveUsers(users); setCurrentUser(newUser); // [sync:storage]
            clearVerifyCode(); // [sync:storage]
            document.getElementById('regUsername').value = '';
            document.getElementById('registerEmail').value = '';
            document.getElementById('emailCode').value = '';
            document.getElementById('registerPassword').value = '';
            document.getElementById('registerConfirmPassword').value = '';
            showHomePage(newUser);
        }

        function showError(inputId, message) {
            clearErrors();
            const input = document.getElementById(inputId);
            input.style.borderColor = '#ff4d4f';
            const errorEl = document.createElement('p');
            errorEl.className = 'error-msg';
            errorEl.style.cssText = 'color:#ff4d4f;font-size:12px;margin-top:4px;margin-bottom:8px;';
            errorEl.textContent = message;
            input.parentElement.appendChild(errorEl);
            input.focus();
            setTimeout(() => { clearErrors(); }, 3000);
        }
        function clearErrors() {
            document.querySelectorAll('.error-msg').forEach(el => el.remove());
            document.querySelectorAll('.input-group input').forEach(input => { input.style.borderColor = '#e0e0e0'; });
        }
        document.querySelectorAll('.input-group input').forEach(input => {
            input.addEventListener('input', function() {
                this.style.borderColor = '#e0e0e0';
                const errMsg = this.parentElement.querySelector('.error-msg');
                if (errMsg) errMsg.remove();
            });
        });
    </script>
</body>
</html>
