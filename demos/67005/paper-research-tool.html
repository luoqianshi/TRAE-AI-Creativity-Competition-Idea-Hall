<body>

<header class="app-header">
  <h1>学术论文检索与报告生成</h1>
  <p class="subtitle">输入研究主题，自动检索相关论文并生成综述报告</p>
</header>

<div class="container">
  <!-- Search Card -->
  <div class="search-card">
    <div class="search-row">
      <div class="search-group">
        <label for="topic">研究主题</label>
        <input
          type="text"
          id="topic"
          placeholder="例如：large language model reasoning, 计算机视觉目标检测..."
          autocomplete="off"
        >
      </div>
      <div class="search-group" style="max-width:160px">
        <label for="limit">论文数量</label>
        <select id="limit">
          <option value="5">5 篇</option>
          <option value="10" selected>10 篇</option>
          <option value="15">15 篇</option>
          <option value="20">20 篇</option>
        </select>
      </div>
      <div class="search-group" style="max-width:160px">
        <label for="sort">排序方式</label>
        <select id="sort">
          <option value="relevance" selected>相关度</option>
          <option value="citationCount:desc">引用数</option>
          <option value="publicationDate:desc">最新发表</option>
        </select>
      </div>
      <button class="btn btn-primary" id="searchBtn" onclick="searchPapers()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        检索论文
      </button>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar" id="statusBar"></div>

  <!-- Results -->
  <div class="results-section" id="resultsSection"></div>

  <!-- Report Section -->
  <div class="report-section" id="reportSection" style="display:none;">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.75rem;">
      <h2 style="margin:0;">综述报告</h2>
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
        <button class="btn btn-accent2 btn-sm" onclick="generateReport()">生成报告</button>
        <button class="btn btn-secondary btn-sm" onclick="copyReport()">复制报告</button>
        <button class="btn btn-secondary btn-sm" onclick="downloadReport()">下载HTML</button>
      </div>
    </div>
    <div class="report-output" id="reportOutput"></div>
  </div>
</div>

<footer class="app-footer">
  数据来源：<a href="https://www.semanticscholar.org/" target="_blank" rel="noopener" style="color:var(--accent);">Semantic Scholar</a> | 仅用于学术研究参考
</footer>

<div class="toast" id="toast"></div>

<script>
// ============== State ==============
let papers = [];
let selectedPapers = new Set();
let reportContent = '';

// ============== API ==============
const API_BASE = 'https://api.semanticscholar.org/graph/v1';

async function searchPapers() {
  const topic = document.getElementById('topic').value.trim();
  const limit = parseInt(document.getElementById('limit').value);
  const sort = document.getElementById('sort').value;

  if (!topic) {
    showToast('请输入研究主题');
    return;
  }

  const statusBar = document.getElementById('statusBar');
  const resultsSection = document.getElementById('resultsSection');
  const reportSection = document.getElementById('reportSection');
  const searchBtn = document.getElementById('searchBtn');

  searchBtn.disabled = true;
  statusBar.innerHTML = '<span class="spinner"></span> 正在检索论文...';
  resultsSection.innerHTML = '';
  reportSection.style.display = 'none';
  reportContent = '';
  papers = [];
  selectedPapers.clear();

  try {
    const params = new URLSearchParams({
      query: topic,
      limit: String(Math.min(limit, 20)),
      fields: 'title,authors,year,abstract,url,externalIds,citationCount,publicationDate,journal,venue'
    });

    if (sort === 'citationCount:desc') {
      params.set('sort', 'citationCount:desc');
    } else if (sort === 'publicationDate:desc') {
      params.set('sort', 'publicationDate:desc');
    }

    const resp = await fetch(`${API_BASE}/paper/search?${params}`, {
      headers: { 'Accept': 'application/json' }
    });

    if (!resp.ok) {
      throw new Error(`API 请求失败 (${resp.status})`);
    }

    const data = await resp.json();

    if (!data.data || data.data.length === 0) {
      statusBar.innerHTML = '';
      resultsSection.innerHTML = `
        <div class="empty-state">
          <div class="icon">🔍</div>
          <h3>未找到相关论文</h3>
          <p>请尝试使用不同的关键词或更广泛的主题进行检索</p>
        </div>
      `;
      searchBtn.disabled = false;
      return;
    }

    papers = data.data;
    statusBar.innerHTML = `✅ 找到 <strong>${data.total || papers.length}</strong> 篇相关论文，显示前 <strong>${papers.length}</strong> 篇`;
    renderPapers();
    reportSection.style.display = 'block';
    document.getElementById('reportOutput').classList.remove('visible');
    document.getElementById('reportOutput').innerHTML = '';

  } catch (err) {
    statusBar.innerHTML = '';
    resultsSection.innerHTML = `
      <div class="empty-state">
        <div class="icon">⚠️</div>
        <h3>检索失败</h3>
        <p>${err.message}。请检查网络连接后重试。</p>
      </div>
    `;
    console.error('Search error:', err);
  } finally {
    searchBtn.disabled = false;
  }
}

// ============== Render ==============
function renderPapers() {
  const section = document.getElementById('resultsSection');
  if (papers.length === 0) return;

  let html = `<div class="results-header">
    <h2>检索结果</h2>
    <span class="results-count">共 ${papers.length} 篇</span>
  </div>`;

  papers.forEach((p, i) => {
    const year = p.year || '未知';
    const authors = (p.authors || []).map(a => a.name).join(', ') || '未知作者';
    const abstract = p.abstract || '暂无摘要';
    const citations = p.citationCount ?? 0;
    const url = p.url || `https://www.semanticscholar.org/paper/${p.paperId}`;
    const journal = p.journal?.name || p.venue || '';
    const doi = p.externalIds?.DOI || '';

    html += `
    <div class="paper-card" id="paper-${i}">
      <div class="paper-check">
        <input type="checkbox" onchange="toggleSelect(${i}, this.checked)" id="check-${i}">
        <div class="paper-content">
          <h3><a href="${url}" target="_blank" rel="noopener">${escapeHtml(p.title)}</a></h3>
          <div class="paper-meta">
            <span>👤 ${escapeHtml(authors)}</span>
            <span>📅 ${year}</span>
            ${journal ? `<span>📰 ${escapeHtml(journal)}</span>` : ''}
            ${citations > 0 ? `<span class="badge badge-citations">被引 ${citations} 次</span>` : ''}
            ${doi ? `<span class="badge">DOI</span>` : ''}
          </div>
          <div class="paper-abstract" id="abstract-${i}">${escapeHtml(abstract)}</div>
          ${abstract.length > 200 ? `<button class="toggle-abstract" onclick="toggleAbstract(${i})">展开全文 ▼</button>` : ''}
        </div>
      </div>
    </div>`;
  });

  section.innerHTML = html;
}

function toggleSelect(index, checked) {
  if (checked) {
    selectedPapers.add(index);
    document.getElementById(`paper-${index}`).classList.add('selected');
  } else {
    selectedPapers.delete(index);
    document.getElementById(`paper-${index}`).classList.remove('selected');
  }
}

function toggleAbstract(index) {
  const el = document.getElementById(`abstract-${index}`);
  const btn = el.nextElementSibling;
  el.classList.toggle('expanded');
  btn.textContent = el.classList.contains('expanded') ? '收起 ▲' : '展开全文 ▼';
}

// ============== Report Generation ==============
function generateReport() {
  const topic = document.getElementById('topic').value.trim();
  const selected = selectedPapers.size > 0
    ? Array.from(selectedPapers).map(i => papers[i])
    : papers;

  if (selected.length === 0) {
    showToast('没有可用的论文数据，请先检索');
    return;
  }

  const output = document.getElementById('reportOutput');
  output.innerHTML = '<div class="spinner" style="margin:2rem auto;"></div>';
  output.classList.add('visible');
  output.scrollIntoView({ behavior: 'smooth' });

  // Simulate generation delay for better UX
  setTimeout(() => {
    reportContent = buildReport(topic, selected);
    output.innerHTML = reportContent;
    output.scrollIntoView({ behavior: 'smooth' });
    showToast('报告生成完成');
  }, 600);
}

function buildReport(topic, selectedPapersList) {
  const now = new Date();
  const dateStr = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });

  // Group papers by year
  const yearGroups = {};
  selectedPapersList.forEach(p => {
    const y = p.year || '未知';
    if (!yearGroups[y]) yearGroups[y] = [];
    yearGroups[y].push(p);
  });

  const sortedYears = Object.keys(yearGroups).sort((a, b) => {
    if (a === '未知') return 1;
    if (b === '未知') return -1;
    return b - a;
  });

  let report = `<h2>📋 研究主题：${escapeHtml(topic)}</h2>`;
  report += `<p style="color:var(--muted);font-size:0.85rem;">报告生成时间：${dateStr} | 分析论文数：${selectedPapersList.length} 篇 | 数据来源：Semantic Scholar</p>`;

  // 1. Overview
  report += `<h2>一、研究概览</h2>`;
  report += `<p>本次检索围绕「<strong>${escapeHtml(topic)}</strong>」主题，共筛选出 <strong>${selectedPapersList.length}</strong> 篇相关学术论文。这些论文发表于 <strong>${sortedYears[0]}</strong> 至 <strong>${sortedYears[sortedYears.length-1]}</strong> 年间，涵盖了该领域的主要研究方向与最新进展。</p>`;

  // Citation stats
  const totalCitations = selectedPapersList.reduce((sum, p) => sum + (p.citationCount || 0), 0);
  const avgCitations = Math.round(totalCitations / selectedPapersList.length);
  const maxCited = selectedPapersList.reduce((max, p) => (p.citationCount || 0) > (max.citationCount || 0) ? p : max, selectedPapersList[0]);

  report += `<p>统计数据显示，所选论文总计被引用 <strong>${totalCitations}</strong> 次，平均每篇被引 <strong>${avgCitations}</strong> 次。其中引用量最高的论文为「<strong>${escapeHtml(maxCited.title)}</strong>」（被引 ${maxCited.citationCount || 0} 次），表明该研究在学术界具有较高影响力。</p>`;

  // 2. Key Themes
  report += `<h2>二、核心研究方向</h2>`;
  report += `<p>基于论文标题与摘要分析，该领域的研究主要集中在以下几个方向：</p>`;
  report += `<ol>`;

  // Extract key themes from titles
  const themes = extractThemes(selectedPapersList);
  themes.forEach(t => {
    report += `<li><strong>${escapeHtml(t.theme)}</strong>：${escapeHtml(t.description)}</li>`;
  });
  report += `</ol>`;

  // 3. Paper Details
  report += `<h2>三、论文详细分析</h2>`;

  sortedYears.forEach(year => {
    report += `<h3>${year} 年</h3>`;
    yearGroups[year].forEach((p, idx) => {
      const authors = (p.authors || []).map(a => a.name).join(', ') || '未知作者';
      const abstract = p.abstract || '暂无摘要';
      const citations = p.citationCount ?? 0;
      const journal = p.journal?.name || p.venue || '';
      const url = p.url || `https://www.semanticscholar.org/paper/${p.paperId}`;

      report += `<p><strong>${idx + 1}. <a href="${url}" target="_blank" rel="noopener" style="color:var(--accent);">${escapeHtml(p.title)}</a></strong></p>`;
      report += `<p style="font-size:0.85rem;color:var(--muted);">作者：${escapeHtml(authors)}${journal ? ' | 发表：' + escapeHtml(journal) : ''} | 被引：${citations} 次</p>`;
      report += `<p style="font-size:0.88rem;">${escapeHtml(abstract)}</p>`;
      report += `<hr style="border:none;border-top:1px solid var(--rule);margin:1rem 0;">`;
    });
  });

  // 4. Trends & Insights
  report += `<h2>四、研究趋势与洞察</h2>`;
  report += generateTrends(selectedPapersList, topic);

  // 5. References
  report += `<h2>五、参考文献</h2>`;
  selectedPapersList.forEach((p, i) => {
    const authors = (p.authors || []).slice(0, 3).map(a => a.name.split(' ').pop()).join(', ');
    const etAl = (p.authors || []).length > 3 ? ' et al.' : '';
    const year = p.year || 'n.d.';
    const url = p.url || `https://www.semanticscholar.org/paper/${p.paperId}`;
    report += `<div class="ref-item">[${i+1}] ${authors}${etAl} (${year}). <strong>${escapeHtml(p.title)}</strong>. ${p.journal?.name || p.venue || 'Semantic Scholar'}. <a href="${url}" target="_blank" rel="noopener" style="color:var(--accent);word-break:break-all;">${url}</a></div>`;
  });

  return report;
}

  const sorted = Object.entries(themeCount)

function generateTrends(papers, topic) {
  const years = papers.map(p => p.year).filter(y => y && y !== '未知').sort();
  const recentPapers = papers.filter(p => p.year && p.year >= 2024).length;
  const totalCitations = papers.reduce((s, p) => s + (p.citationCount || 0), 0);

  let insights = '';

  if (years.length > 0) {
    const minYear = years[0];
    const maxYear = years[years.length - 1];
    insights += `<p>📈 <strong>时间跨度</strong>：所选论文覆盖 <strong>${minYear}</strong> 年至 <strong>${maxYear}</strong> 年，展示了该领域从早期探索到近期突破的完整演进脉络。</p>`;
  }

  if (recentPapers > 0) {
    insights += `<p>🔥 <strong>研究热度</strong>：${recentPapers} 篇论文发表于 2024 年及以后，占比 ${Math.round(recentPapers/papers.length*100)}%，表明该领域近年来研究活跃度持续攀升，是当前学术界关注的热点方向。</p>`;
  }

  if (totalCitations > 0) {
    insights += `<p>📊 <strong>学术影响力</strong>：所选论文累计被引用 ${totalCitations} 次，反映出该领域研究成果受到广泛关注与认可，具有较高的学术价值与应用前景。</p>`;
  }

  insights += `<p>💡 <strong>发展趋势</strong>：综合来看，「${escapeHtml(topic)}」领域正朝着更加智能化、高效化、可解释化的方向演进。未来研究可能会在模型架构创新、训练范式变革、多模态融合以及实际落地应用等方面取得更多突破。</p>`;

  return insights;
}

// ============== Export ==============
function copyReport() {
  if (!reportContent) {
    showToast('请先生成报告');
    return;
  }
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = reportContent;
  const text = tempDiv.textContent || tempDiv.innerText;
  navigator.clipboard.writeText(text).then(() => {
    showToast('报告已复制到剪贴板');
  }).catch(() => {
    showToast('复制失败，请手动复制');
  });
}

  if (!reportContent) {

    return;
  }
  const topic = document.getElementById('topic').value.trim() || 'research';
  const fullHtml = `<!DOCTYPE html>
<html lang="zh-CN">

// ============== Utilities ==============
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 2500);
}

// ============== Keyboard shortcut ==============
document.getElementById('topic').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') searchPapers();
});
