<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>盲盒厨房 - 冰箱食材清道夫</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B35;
            --secondary: #4ECDC4;
            --dark: #2D3436;
            --light: #F7F7F7;
            --gray: #95A5A6;
            --white: #FFFFFF;
            --shadow: 0 4px 20px rgba(0,0,0,0.1);
            --radius: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            background: linear-gradient(135deg, #FFF5F0 0%, #E8F8F5 100%);
            min-height: 100vh;
            color: var(--dark);
        }

        .container {
            max-width: 430px;
            margin: 0 auto;
            padding: 0 16px 100px;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 32px 0 24px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 20px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: var(--shadow);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--gray);
            font-size: 14px;
            margin-top: 8px;
        }

        /* Card */
        .card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title span {
            font-size: 20px;
        }

        /* Ingredient Input */
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #E8E8E8;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: var(--secondary);
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #FF8F65);
            color: var(--white);
        }

        .btn-primary:active {
            transform: scale(0.96);
        }

        .btn-secondary {
            background: var(--light);
            color: var(--dark);
        }

        .btn-secondary:active {
            background: #E8E8E8;
        }

        /* Ingredient Tags */
        .ingredient-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: var(--light);
            border-radius: 20px;
            font-size: 14px;
        }

        .tag .remove {
            width: 18px;
            height: 18px;
            background: var(--gray);
            color: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
        }

        .tag .remove:hover {
            background: var(--primary);
        }

        /* Action Buttons */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .action-btn {
            padding: 16px;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
        }

        .action-btn:active {
            transform: scale(0.96);
        }

        .action-btn .icon {
            font-size: 28px;
        }

        .btn-blindbox {
            background: linear-gradient(135deg, var(--primary), #FF8F65);
            color: var(--white);
            grid-column: span 2;
        }

        .btn-recommend {
            background: linear-gradient(135deg, var(--secondary), #6EE7DE);
            color: var(--white);
        }

        .btn-shopping {
            background: linear-gradient(135deg, #A855F7, #C084FC);
            color: var(--white);
        }

        /* Recipe Section */
        .recipe-section {
            display: none;
        }

        .recipe-section.show {
            display: block;
        }

        .recipe-card {
            background: linear-gradient(135deg, #FFF9F5, #FFF);
            border: 2px solid #FFE4D4;
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
        }

        .recipe-card h4 {
            font-size: 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .recipe-card h4 .num {
            width: 24px;
            height: 24px;
            background: var(--primary);
            color: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .recipe-card p {
            font-size: 13px;
            color: var(--gray);
            margin-bottom: 8px;
        }

        .recipe-card .tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .recipe-card .tags span {
            padding: 4px 10px;
            background: #FFF;
            border-radius: 12px;
            font-size: 12px;
            color: var(--dark);
        }

        .recipe-card .tags span.missing {
            background: #FFE4E4;
            color: #E74C3C;
        }

        /* Recommend Section */
        .recommend-section {
            display: none;
        }

        .recommend-section.show {
            display: block;
        }

        .recommend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--light);
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .recommend-item .emoji {
            font-size: 28px;
        }

        .recommend-item .info {
            flex: 1;
        }

        .recommend-item .info h5 {
            font-size: 15px;
            margin-bottom: 4px;
        }

        .recommend-item .info p {
            font-size: 12px;
            color: var(--gray);
        }

        .recommend-item .add-btn {
            padding: 8px 14px;
            background: var(--secondary);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }

        /* Quick Add */
        .quick-add {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .quick-add button {
            padding: 8px 14px;
            background: var(--white);
            border: 2px solid #E8E8E8;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-add button:hover {
            border-color: var(--secondary);
            background: #F0FFFE;
        }

        .quick-add button:active {
            transform: scale(0.95);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray);
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--dark);
            color: var(--white);
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--white);
            padding: 12px 0;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
            display: flex;
            justify-content: center;
            z-index: 100;
        }

        .bottom-nav-inner {
            display: flex;
            gap: 40px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--gray);
            font-size: 11px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item .icon {
            font-size: 22px;
        }

        /* Intro Section */
        .intro-card {
            background: linear-gradient(135deg, #FFF5F0, #E8F8F5);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
        }

        .intro-card h3 {
            font-size: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .intro-card ul {
            list-style: none;
            font-size: 13px;
            color: #666;
        }

        .intro-card li {
            padding: 6px 0;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .intro-card li::before {
            content: '✓';
            color: var(--secondary);
            font-weight: bold;
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            75% { transform: translateX(5px) rotate(2deg); }
        }

        .shaking {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">🍳</div>

                <li>翻遍菜谱却发现缺葱少蒜，没法做</li>
            </ul>
        </div>

        <!-- Tab: Inventory -->
        <div class="tab-content active" id="tab-inventory">
            <div class="card">
                <div class="card-title">

                    <span style="margin-left: auto; font-size: 12px; color: var(--gray);" id="ingredient-count">0 种食材</span>
                </div>
                
                <div class="input-group">
                    <input type="text" id="ingredient-input" placeholder="输入食材名称，如：西红柿、鸡蛋" maxlength="20">
                    <button class="btn btn-primary" onclick="addIngredient()">添加</button>
                </div>

                <div class="quick-add">
                    <button onclick="quickAdd('西红柿')">🍅 西红柿</button>
                    <button onclick="quickAdd('鸡蛋')">🥚 鸡蛋</button>
                    <button onclick="quickAdd('土豆')">🥔 土豆</button>
                    <button onclick="quickAdd('青椒')">🫑 青椒</button>

                    <button onclick="quickAdd('大蒜')">🧄 大蒜</button>
                    <button onclick="quickAdd('葱')">🧅 葱</button>
                    <button onclick="quickAdd('豆腐')">🧈 豆腐</button>
                </div>

                <div class="ingredient-tags" id="ingredient-tags" style="margin-top: 16px;">
                    <!-- 动态生成 -->
                </div>
            </div>

            <div class="action-buttons">
                <button class="action-btn btn-blindbox" onclick="generateBlindbox()">
                    <span class="icon">🎲</span>

                <button class="action-btn btn-recommend" onclick="showRecommend()">

                    缺失推荐

                <button class="action-btn btn-shopping" onclick="showShopping()">
                    <span class="icon">🛒</span>
                    一键补货
                </button>
            </div>
        </div>

        <!-- Tab: Recipes -->
        <div class="tab-content" id="tab-recipes">

                <div class="card">
                    <div class="card-title">
                        <span>🍳</span> 今日推荐菜谱
                    </div>
                    <div id="recipe-list">
                        <!-- 动态生成菜谱 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab: Recommend -->

            <div class="recommend-section show" id="recommend-section">

                    <div class="card-title">
                        <span>💡</span> 搭配推荐

                    <div id="recommend-list">
                        <!-- 动态生成推荐 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

        // 初始化
        function init() {
            renderIngredients();
            updateCount();
        }

        // 添加食材
        function addIngredient() {
            const input = document.getElementById('ingredient-input');
            const name = input.value.trim();
            
            if (!name) {
                showToast('请输入食材名称');
                return;
            }

            if (ingredients.includes(name)) {
                showToast('该食材已添加');
                input.value = '';
                return;
            }

            ingredients.push(name);
            saveIngredients();
            renderIngredients();
            updateCount();
            input.value = '';
            input.focus();
            showToast('已添加：' + name);
        }

        // 快速添加
        function quickAdd(name) {
            if (ingredients.includes(name)) {
                showToast('该食材已添加');
                return;
            }
            ingredients.push(name);
            saveIngredients();
            renderIngredients();
            updateCount();
            showToast('已添加：' + name);
        }

        // 删除食材
        function removeIngredient(name) {
            ingredients = ingredients.filter(i => i !== name);
            saveIngredients();
            renderIngredients();
            updateCount();
            showToast('已移除：' + name);
        }

        // 保存到本地
        function saveIngredients() {
            localStorage.setItem('ingredients', JSON.stringify(ingredients));
        }

        // 渲染食材列表
        function renderIngredients() {
            const container = document.getElementById('ingredient-tags');
            
            if (ingredients.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🧊</div>
                        <p>冰箱空空如也<br>添加一些食材开始吧</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = ingredients.map(name => `
                <div class="tag fade-in">
                    <span>${name}</span>
                    <span class="remove" onclick="removeIngredient('${name}')">×</span>
                </div>
            `).join('');
        }

        // 更新计数
        function updateCount() {
            document.getElementById('ingredient-count').textContent = ingredients.length + ' 种食材';
        }

        // 生成盲盒
        function generateBlindbox() {
            if (ingredients.length === 0) {
                showToast('请先添加食材到冰箱');
                return;
            }

            // 根据食材匹配菜谱
            const matchedRecipes = recipes.filter(recipe => {
                const hasMainIngredient = recipe.ingredients.some(ing => 
                    ingredients.some(ai => ai.includes(ing) || ing.includes(ai))
                );
                return hasMainIngredient;
            });

            if (matchedRecipes.length === 0) {
                showToast('食材不足以匹配菜谱，请添加更多食材');
                return;
            }

            // 随机选择3道菜
            const shuffled = [...matchedRecipes].sort(() => Math.random() - 0.5);
            const selected = shuffled.slice(0, 3);

            // 渲染菜谱
            const recipeList = document.getElementById('recipe-list');
            recipeList.innerHTML = selected.map((recipe, index) => {
                const missing = recipe.ingredients.filter(ing => 
                    !ingredients.some(ai => ai.includes(ing) || ing.includes(ai))
                );
                
                return `
                    <div class="recipe-card fade-in" style="animation-delay: ${index * 0.1}s">
                        <h4><span class="num">${index + 1}</span> ${recipe.name}</h4>
                        <p>⏱️ ${recipe.time} | 📊 难度：${recipe.difficulty}</p>
                        <div class="tags">
                            ${recipe.ingredients.map(ing => {
                                const isMissing = missing.includes(ing);
                                return `<span class="${isMissing ? 'missing' : ''}">${isMissing ? '❌' : '✅'}${ing}</span>`;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');

            // 切换到菜谱Tab
            switchTab('recipes');
            
            // 添加抖动效果
            document.querySelector('.logo').classList.add('shaking');
            setTimeout(() => {
                document.querySelector('.logo').classList.remove('shaking');
            }, 500);
        }

        // 显示推荐
        function showRecommend() {
            if (ingredients.length === 0) {
                showToast('请先添加食材到冰箱');
                return;
            }

            const recommendList = document.getElementById('recommend-list');
            let recommendationsHTML = '';

            // 遍历用户食材，查找推荐
            ingredients.forEach(ing => {
                const recs = recommendations[ing];
                if (recs) {
                    recs.forEach(rec => {
                        if (!ingredients.includes(rec.name)) {
                            recommendationsHTML += `
                                <div class="recommend-item fade-in">
                                    <span class="emoji">${rec.emoji}</span>
                                    <div class="info">
                                        <h5>${ing} + ${rec.name}</h5>
                                        <p>${rec.reason}</p>
                                    </div>
                                    <button class="add-btn" onclick="quickAdd('${rec.name}')">+ 添加</button>
                                </div>
                            `;
                        }
                    });
                }
            });

            if (!recommendationsHTML) {
                recommendationsHTML = `
                    <div class="empty-state">
                        <div class="icon">🎉</div>
                        <p>太棒了！您的食材已经很完善了<br>试试生成盲盒菜谱吧</p>
                    </div>
                `;
            }

            recommendList.innerHTML = recommendationsHTML;
            switchTab('recommend');
        }

        // 显示购物
        function showShopping() {
            showToast('正在跳转朴朴/美团买菜...');
            // 实际项目中这里会调用小程序的跳转接口
            // wx.navigateToMiniProgram({ appid: 'xxx', path: 'pages/search' })
        }

        // 切换Tab
        function switchTab(tab) {
            // 更新Nav
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');

            // 更新内容
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById('tab-' + tab).classList.add('active');
        }

        // 显示Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 回车添加
        document.getElementById('ingredient-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addIngredient();
            }
        });

        // 初始化
        init();
    </script>
