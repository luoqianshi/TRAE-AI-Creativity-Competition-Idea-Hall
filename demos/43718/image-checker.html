<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>批量图片链接审阅器 - PicCheck</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#0e0e11;--surface:#1a1a20;--border:#2a2a33;--text:#e8e8ec;
      --muted:#7a7a88;--accent:#6c5ce7;--green:#00d2a0;--red:#ff4757;
      --yellow:#ffa502;--radius:12px;
    }
    html,body{height:100%;overflow:hidden}
    body{background:var(--bg);color:var(--text);font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;overflow:hidden}
    ::selection{background:var(--accent);color:#fff}
    *::-webkit-scrollbar{display:none}
    *{scrollbar-width:none;-ms-overflow-style:none}

    .header{padding:32px 40px 0;display:flex;align-items:center;justify-content:space-between}
    .logo{display:flex;align-items:center;gap:12px}
    .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),#a29bfe);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
    .logo-text{font-size:20px;font-weight:700;letter-spacing:-0.5px}
    .logo-text span{color:var(--accent)}
    .stats{display:flex;gap:24px}
    .stat{text-align:center}
    .stat-num{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
    .stat-num.valid{color:var(--green)}
    .stat-num.invalid{color:var(--red)}
    .stat-num.total{color:var(--accent)}
    .stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px}

    .toolbar{padding:20px 40px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .toolbar-left{display:flex;gap:12px;align-items:center;flex:1;flex-wrap:wrap}
    .filter-btn{padding:6px 16px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:13px;cursor:pointer;transition:all .2s}
    .filter-btn:hover,.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .search-box{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;width:200px;outline:none;transition:border-color .2s}
    .search-box:focus{border-color:var(--accent)}
    .search-box::placeholder{color:var(--muted)}

    .main{display:flex;gap:0;height:calc(100vh - 130px)}
    .input-panel{width:360px;min-width:360px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px}
    .input-title{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .input-title::before{content:'';width:3px;height:14px;background:var(--accent);border-radius:2px}
    .url-input{flex:1;width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px;color:var(--text);font-family:'Cascadia Code','Fira Code',monospace;font-size:12.5px;line-height:1.8;resize:none;outline:none;transition:border-color .2s}
    .url-input:focus{border-color:var(--accent)}
    .url-input::placeholder{color:#444}
    .input-actions{display:flex;gap:8px;margin-top:12px}
    .btn{padding:10px 20px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
    .btn-primary{background:var(--accent);color:#fff;flex:1}
    .btn-primary:hover{background:#5b4bd5;transform:translateY(-1px)}
    .btn-primary:active{transform:translateY(0)}
    .btn-secondary{background:transparent;border:1px solid var(--border);color:var(--muted)}
    .btn-secondary:hover{border-color:var(--muted);color:var(--text)}
    .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
    .hint{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6}

    .grid-panel{flex:1;padding:20px;overflow-y:auto}
    .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);gap:16px}
    .empty-icon{font-size:56px;opacity:.3}
    .empty-text{font-size:15px}
    .empty-hint{font-size:12px;opacity:.6}

    .image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
    .image-card{background:var(--surface);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);cursor:pointer;transition:all .25s;position:relative}
    .image-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 32px rgba(108,92,231,.15)}
    .image-card.hidden{display:none}
    .card-img-wrap{width:100%;aspect-ratio:1;background:#111;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
    .card-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
    .image-card:hover .card-img-wrap img{transform:scale(1.05)}
    .card-status{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface)}
    .card-status.valid{background:var(--green);box-shadow:0 0 8px rgba(0,210,160,.4)}
    .card-status.invalid{background:var(--red);box-shadow:0 0 8px rgba(255,71,87,.4)}
    .card-status.checking{background:var(--yellow);box-shadow:0 0 8px rgba(255,165,2,.4);animation:pulse 1s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .card-info{padding:10px 12px}
    .card-index{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
    .card-url{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;font-family:'Cascadia Code','Fira Code',monospace}
    .card-error{font-size:11px;color:var(--red);margin-top:4px;display:flex;align-items:center;gap:4px}
    .card-actions{display:flex;gap:4px;padding:0 12px 10px}
    .card-action-btn{padding:3px 8px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:10px;cursor:pointer;transition:all .15s}
    .card-action-btn:hover{border-color:var(--accent);color:var(--accent)}
    .spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;display:none;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(20px)}
    .lightbox.open{display:flex}
    .lb-close{position:absolute;top:20px;right:20px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
    .lb-close:hover{background:rgba(255,255,255,.15)}
    .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
    .lb-nav:hover{background:rgba(255,255,255,.15)}
    .lb-prev{left:20px}
    .lb-next{right:20px}
    .lb-img{max-width:85vw;max-height:80vh;object-fit:contain;border-radius:8px}
    .lb-info{margin-top:16px;text-align:center;color:var(--muted);font-size:13px;max-width:80vw}
    .lb-url{font-family:'Cascadia Code','Fira Code',monospace;font-size:11px;word-break:break-all;margin-top:6px;color:#666}

    .progress-bar{height:2px;background:var(--border);position:relative;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#a29bfe);transition:width .3s;width:0}

    .batch-select{display:flex;gap:8px;margin-top:8px}
    .batch-btn{padding:4px 10px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;cursor:pointer;transition:all .15s}
    .batch-btn:hover{border-color:var(--accent);color:var(--accent)}

    @media(max-width:768px){
      .main{flex-direction:column;height:auto}
      .input-panel{width:100%;min-width:auto;height:300px;border-right:none;border-bottom:1px solid var(--border)}
      .grid-panel{height:auto;min-height:60vh}
      .header{padding:20px 16px 0}
      .toolbar{padding:12px 16px}
      .image-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🔍</div>
      <div class="logo-text">Pic<span>Check</span></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-num total" id="totalCount">0</div><div class="stat-label">总计</div></div>
      <div class="stat"><div class="stat-num valid" id="validCount">0</div><div class="stat-label">正常</div></div>
      <div class="stat"><div class="stat-num invalid" id="invalidCount">0</div><div class="stat-label">失效</div></div>
    </div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div class="toolbar">
    <div class="toolbar-left">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="valid">✅ 正常</button>
      <button class="filter-btn" data-filter="invalid">❌ 失效</button>
      <button class="filter-btn" data-filter="checking">⏳ 检测中</button>
      <input class="search-box" type="text" placeholder="搜索链接..." id="searchInput">
    </div>
  </div>

  <div class="main">
    <div class="input-panel">
      <div class="input-title">粘贴图片链接</div>
      <textarea class="url-input" id="urlInput" placeholder="每行一个图片链接，例如：&#10;&#10;https://example.com/photo1.jpg&#10;https://example.com/photo2.png&#10;https://example.com/photo3.webp&#10;&#10;支持 jpg/png/gif/webp/svg 等格式&#10;也支持直接粘贴包含链接的文本"></textarea>
      <div class="input-actions">
        <button class="btn btn-primary" id="startBtn" onclick="startCheck()">
          <span>▶</span> 开始检测
        </button>
        <button class="btn btn-secondary" onclick="clearAll()">清空</button>
      </div>
      <div class="hint">
        💡 提示：每行粘贴一个图片URL，系统会自动过滤非图片链接。支持批量检测数百张图片，检测完成后可点击图片预览大图。
      </div>
      <div class="batch-select">
        <button class="batch-btn" onclick="loadSamples()">加载示例</button>
        <button class="batch-btn" onclick="copyValidLinks()">复制正常链接</button>
        <button class="batch-btn" onclick="copyInvalidLinks()">复制失效链接</button>
      </div>
    </div>

    <div class="grid-panel" id="gridPanel">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🖼️</div>
        <div class="empty-text">在左侧粘贴图片链接开始检测</div>
        <div class="empty-hint">支持批量导入，自动识别图片格式</div>
      </div>
      <div class="image-grid" id="imageGrid" style="display:none"></div>
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lb-close" onclick="closeLightbox()">✕</button>
    <button class="lb-nav lb-prev" onclick="navLightbox(-1)">‹</button>
    <button class="lb-nav lb-next" onclick="navLightbox(1)">›</button>
    <img class="lb-img" id="lbImg" src="">
    <div class="lb-info">
      <div id="lbIndex"></div>
      <div class="lb-url" id="lbUrl"></div>
    </div>
  </div>

  <script>
    let images = [];
    let currentIndex = 0;
    let currentFilter = 'all';

    const IMAGE_EXTS = /\.(jpg|jpeg|png|gif|webp|svg|bmp|ico|tiff|avif)(\?.*)?$/i;

    function extractUrls(text) {
      const lines = text.split(/[\n\r]+/);
      const urls = [];
      for (const line of lines) {
        const matches = line.match(/https?:\/\/[^\s,;，；"'\)）\]】}]+/gi);
        if (matches) {
          for (const u of matches) {
            const clean = u.replace(/[，。！？、]+$/, '');
            urls.push(clean);
          }
        }
      }
      return [...new Set(urls)];
    }

    function startCheck() {
      const text = document.getElementById('urlInput').value.trim();
      if (!text) return;

      const urls = extractUrls(text);
      if (urls.length === 0) return;

      images = [];
      document.getElementById('imageGrid').innerHTML = '';
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('imageGrid').style.display = 'grid';
      document.getElementById('startBtn').disabled = true;

      urls.forEach((url, i) => {
        const img = { url, index: i + 1, status: 'checking', error: '' };
        images.push(img);
        renderCard(img);
        checkImage(img);
      });

      updateStats();
    }

    function renderCard(img) {
      const grid = document.getElementById('imageGrid');
      const card = document.createElement('div');
      card.className = 'image-card';
      card.id = `card-${img.index}`;
      card.innerHTML = `
        <div class="card-img-wrap">
          <div class="spinner"></div>
          <div class="card-status checking" id="status-${img.index}"></div>
        </div>
        <div class="card-info">
          <div class="card-index">#${img.index}</div>
          <div class="card-url" title="${img.url}">${img.url}</div>
          <div class="card-error" id="error-${img.index}"></div>
        </div>
        <div class="card-actions">
          <button class="card-action-btn" onclick="openLightbox(${img.index - 1})">🔍 预览</button>
          <button class="card-action-btn" onclick="copyLink(${img.index - 1})">📋 复制</button>
          <button class="card-action-btn" onclick="openLink(${img.index - 1})">🔗 打开</button>
        </div>
      `;
      grid.appendChild(card);
    }

    function checkImage(img) {
      const tester = new Image();
      const timeout = setTimeout(() => {
        markStatus(img.index, 'invalid', '加载超时');
      }, 15000);

      tester.onload = () => {
        clearTimeout(timeout);
        markStatus(img.index, 'valid', '');
        insertImage(img.index, tester.src);
      };
      tester.onerror = () => {
        clearTimeout(timeout);
        markStatus(img.index, 'invalid', '图片加载失败');
      };
      tester.src = img.url;
    }

    function markStatus(index, status, error) {
      const img = images.find(i => i.index === index);
      if (img) {
        img.status = status;
        img.error = error;
      }
      const statusEl = document.getElementById(`status-${index}`);
      if (statusEl) {
        statusEl.className = `card-status ${status}`;
      }
      const errorEl = document.getElementById(`error-${index}`);
      if (errorEl && error) {
        errorEl.innerHTML = `⚠ ${error}`;
      }
      applyFilter();
      updateStats();
      checkAllDone();
    }

    function insertImage(index, src) {
      const card = document.getElementById(`card-${index}`);
      if (!card) return;
      const wrap = card.querySelector('.card-img-wrap');
      const spinner = wrap.querySelector('.spinner');
      if (spinner) spinner.remove();
      const img = document.createElement('img');
      img.src = src;
      img.loading = 'lazy';
      img.onclick = () => openLightbox(index - 1);
      wrap.insertBefore(img, wrap.firstChild);
    }

    function updateStats() {
      const total = images.length;
      const valid = images.filter(i => i.status === 'valid').length;
      const invalid = images.filter(i => i.status === 'invalid').length;
      const done = valid + invalid;

      document.getElementById('totalCount').textContent = total;
      document.getElementById('validCount').textContent = valid;
      document.getElementById('invalidCount').textContent = invalid;
      document.getElementById('progressFill').style.width = total > 0 ? `${(done / total) * 100}%` : '0%';
    }

    function checkAllDone() {
      const done = images.filter(i => i.status !== 'checking').length;
      if (done === images.length && images.length > 0) {
        document.getElementById('startBtn').disabled = false;
      }
    }

    function applyFilter() {
      const cards = document.querySelectorAll('.image-card');
      const search = document.getElementById('searchInput').value.toLowerCase();
      cards.forEach(card => {
        const idx = parseInt(card.id.replace('card-', ''));
        const img = images.find(i => i.index === idx);
        if (!img) return;
        const matchFilter = currentFilter === 'all' || img.status === currentFilter;
        const matchSearch = !search || img.url.toLowerCase().includes(search);
        card.classList.toggle('hidden', !(matchFilter && matchSearch));
      });
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        applyFilter();
      });
    });

    document.getElementById('searchInput').addEventListener('input', applyFilter);

    function openLightbox(index) {
      currentIndex = index;
      const img = images[index];
      if (!img) return;
      document.getElementById('lbImg').src = img.url;
      document.getElementById('lbIndex').textContent = `#${img.index} / ${images.length}`;
      document.getElementById('lbUrl').textContent = img.url;
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }

    function navLightbox(dir) {
      const visible = getVisibleImages();
      const pos = visible.findIndex(i => i.index === currentIndex + 1);
      const next = (pos + dir + visible.length) % visible.length;
      openLightbox(visible[next].index - 1);
    }

    function getVisibleImages() {
      return images.filter(img => {
        const matchFilter = currentFilter === 'all' || img.status === currentFilter;
        const search = document.getElementById('searchInput').value.toLowerCase();
        const matchSearch = !search || img.url.toLowerCase().includes(search);
        return matchFilter && matchSearch;
      });
    }

    document.addEventListener('keydown', e => {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navLightbox(-1);
      if (e.key === 'ArrowRight') navLightbox(1);
    });

    document.getElementById('lightbox').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeLightbox();
    });

    function copyLink(index) {
      navigator.clipboard.writeText(images[index].url);
    }

    function openLink(index) {
      window.open(images[index].url, '_blank');
    }

    function clearAll() {
      images = [];
      document.getElementById('urlInput').value = '';
      document.getElementById('imageGrid').innerHTML = '';
      document.getElementById('imageGrid').style.display = 'none';
      document.getElementById('emptyState').style.display = 'flex';
      document.getElementById('progressFill').style.width = '0';
      document.getElementById('startBtn').disabled = false;
      updateStats();
    }

    function copyValidLinks() {
      const links = images.filter(i => i.status === 'valid').map(i => i.url).join('\n');
      if (links) navigator.clipboard.writeText(links);
    }

    function copyInvalidLinks() {
      const links = images.filter(i => i.status === 'invalid').map(i => i.url).join('\n');
      if (links) navigator.clipboard.writeText(links);
    }

    function loadSamples() {
      const samples = [
        'https://picsum.photos/400/400?random=1',
        'https://picsum.photos/400/400?random=2',
        'https://picsum.photos/400/400?random=3',
        'https://picsum.photos/400/400?random=4',
        'https://httpbin.org/status/404',
        'https://picsum.photos/400/400?random=5',
        'https://invalid-domain-abc123.com/fake.jpg',
        'https://picsum.photos/400/400?random=6',
        'https://picsum.photos/400/400?random=7',
        'https://httpbin.org/status/500',
      ];
      document.getElementById('urlInput').value = samples.join('\n');
    }
  </script>
</body>
</html>
