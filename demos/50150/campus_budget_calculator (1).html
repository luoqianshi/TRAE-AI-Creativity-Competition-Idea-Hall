<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>校园开销计算器</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f8fbff);
      color: #222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(40, 80, 140, 0.15);
      padding: 28px;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #2563eb;
      font-size: 28px;
    }

    .subtitle {
      margin: 0 0 24px;
      text-align: center;
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d6e0f0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.18);
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .result {
      margin-top: 22px;
      padding: 18px;
      border-radius: 16px;
      background: #f1f6ff;
      line-height: 1.8;
      display: none;
    }

    .result strong {
      color: #1d4ed8;
    }

    .tip {
      margin-top: 14px;
      color: #666;
      font-size: 13px;
      line-height: 1.6;
    }

    .good {
      color: #16a34a;
      font-weight: bold;
    }

    .warn {
      color: #dc2626;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>校园开销计算器</h1>
    <p class="subtitle">
      输入本月预算、已花金额和剩余天数，快速计算每天还能花多少，帮助学生合理安排生活费。
    </p>

    <label for="budget">本月总预算 / 生活费（元）</label>
    <input id="budget" type="number" placeholder="例如：1500" />

    <label for="spent">目前已经花费（元）</label>
    <input id="spent" type="number" placeholder="例如：620" />

    <label for="days">本月剩余天数</label>
    <input id="days" type="number" placeholder="例如：18" />

    <button onclick="calculate()">开始计算</button>

    <section id="result" class="result"></section>

    <p class="tip">
      小提示：如果每天可用金额较低，可以优先减少零食、外卖、冲动消费，把必要开销单独预留出来。
    </p>
  </main>

  <script>
    function calculate() {
      const budget = Number(document.getElementById("budget").value);
      const spent = Number(document.getElementById("spent").value);
      const days = Number(document.getElementById("days").value);
      const result = document.getElementById("result");

      if (budget <= 0 || spent < 0 || days <= 0) {
        result.style.display = "block";
        result.innerHTML = "<span class='warn'>请输入正确的预算、花费和剩余天数。</span>";
        return;
      }

      const left = budget - spent;
      const perDay = left / days;
      const status = left >= 0
        ? "<span class='good'>预算仍然可控</span>"
        : "<span class='warn'>已经超出预算</span>";

      let advice = "";
      if (perDay >= 50) {
        advice = "当前预算比较充足，可以正常安排饮食和日常消费。";
      } else if (perDay >= 25) {
        advice = "预算略紧，建议减少非必要消费。";
      } else if (perDay >= 0) {
        advice = "预算较紧，建议控制外卖、饮料、游戏充值等支出。";
      } else {
        advice = "已经超支，建议立刻记录开销并暂停非必要消费。";
      }

      result.style.display = "block";
      result.innerHTML = `
        当前状态：${status}<br>
        剩余金额：<strong>${left.toFixed(2)}</strong> 元<br>
        平均每天可用：<strong>${perDay.toFixed(2)}</strong> 元<br>
        消费建议：${advice}
      `;
    }
  </script>
</body>
</html>
