<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>详情 - TV Tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <div class="container">
    <div style="margin:20px 0;">
      <a href="home.html" class="btn btn-secondary btn-sm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        返回
      </a>
    </div>

    <div id="detailContent"></div>
  </div>

  <div class="footer">
    <p>TV Tracker - 你的专属追剧日历管家 | 数据来源 <a href="https://www.themoviedb.org/" target="_blank">TMDB</a></p>
  </div>
</div>
<script src="js/app.js"></script>
<script>
initApp('home');

// Get media from URL param or default
const urlParams = new URLSearchParams(window.location.search);
const mediaId = parseInt(urlParams.get('id')) || 1;
const media = SAMPLE_MEDIA.find(m => m.id === mediaId) || SAMPLE_MEDIA[0];

function renderDetail() {
  const inWl = isInWatchlist(media.id);
  const status = getWatchStatus(media.id);
  const statusBtns = {
    watchlist: { label: '想看', bg: 'rgba(0,113,227,.1)', color: '#0071e3' },
    watching: { label: '在追', bg: 'rgba(255,149,0,.1)', color: '#ff9500' },
    watched: { label: '已看', bg: 'rgba(52,199,89,.1)', color: '#34c759' }
  };
  const currentStatus = status || 'watchlist';
  const currentStatusBtn = statusBtns[currentStatus];

  // Seasons data (only for TV shows)
  const hasSeasons = media.type === 'tv';
  const seasons = hasSeasons ? [
    { num: 1, episodes: 8, year: 2022, watched: 8, name: '第一季' },
    { num: 2, episodes: 9, year: 2023, watched: 3, name: '第二季' },
    { num: 3, episodes: 8, year: 2024, watched: 0, name: '第三季' }
  ].slice(0, media.seasons || 3) : [];

  // Generate episodes for expanded view
  const episodes = hasSeasons ? Array.from({length: seasons[0]?.episodes || 8}, (_, i) => ({
    number: i + 1,
    title: `第${i + 1}集`,
    airDate: '2023-0' + (Math.floor(i / 3) + 1) + '-' + String(15 + i).padStart(2, '0'),
    rating: (8.5 + Math.random()).toFixed(1)
  })) : [];

  document.getElementById('detailContent').innerHTML = `
    <div class="detail-hero" style="margin-bottom:40px;display:flex;gap:40px;align-items:flex-start;">
      <img src="${media.poster}" style="width:260px;height:390px;border-radius:var(--radius-lg);object-fit:cover;box-shadow:0 12px 40px rgba(0,0,0,.15);flex-shrink:0;">
      <div style="flex:1;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;">
          <span class="type-badge" style="padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;background:rgba(191,90,242,.1);color:#bf5af2;">${media.type === 'movie' ? '电影' : '电视剧'}</span>
          <span class="rating-badge" style="padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;background:rgba(255,214,10,.1);color:#b8860b;display:flex;align-items:center;gap:4px;"><svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:#ffd60a;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>${media.rating}</span>
          ${media.certification ? `<span style="padding:4px 10px;background:var(--border-light);border-radius:8px;font-size:12px;font-weight:500;">${media.certification}</span>` : ''}
        </div>
        <h1 style="font-size:36px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px;">${media.title}</h1>
        <p style="font-size:17px;color:var(--text-secondary);font-style:italic;margin-bottom:20px;">${media.tagline}</p>
        <div style="display:flex;flex-wrap:wrap;gap:16px;margin-bottom:24px;color:var(--text-secondary);font-size:14px;">
          <span>📅 ${media.year}</span>
          ${media.type === 'movie' ? `<span>⏱️ ${formatRuntime(media.runtime)}</span>` : `<span>📺 ${media.seasons}季 / ${media.episodes}集</span>`}
          <span>🎭 ${media.genres.join(', ')}</span>
        </div>
        <div style="font-size:16px;line-height:1.8;margin-bottom:28px;">${media.overview}</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="toggleWatchState();" id="watchBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            <span id="watchBtnLabel">${inWl ? currentStatusBtn.label : '加入追影'}</span>
          </button>
          ${inWl ? `<button class="btn btn-secondary" onclick="cycleWatchStatus();">切换状态</button>` : ''}
          <button class="btn btn-secondary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"/></svg>
            播放预告
          </button>
        </div>
      </div>
    </div>

    ${hasSeasons ? `
    <section style="margin-bottom:48px;">
      <h2 style="font-size:22px;font-weight:700;margin-bottom:20px;">📺 剧集列表</h2>
      ${seasons.map((season, sIdx) => {
        const pct = (season.watched / season.episodes * 100).toFixed(0);
        return `<div class="season-item" style="background:var(--surface);border-radius:var(--radius-md);border:1px solid var(--border-light);margin-bottom:12px;overflow:hidden;">
          <div onclick="toggleSeason(${season.num});" style="display:flex;align-items:center;gap:16px;padding:16px;cursor:pointer;">
            <div style="width:80px;height:120px;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700;flex-shrink:0;">S${season.num}</div>
            <div style="flex:1;">
              <div style="font-size:18px;font-weight:600;margin-bottom:4px;">${season.name}</div>
              <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">${season.year} · ${season.episodes}集</div>
              <div style="display:flex;align-items:center;gap:10px;">
                <div style="flex:0 0 200px;height:6px;background:var(--border-light);border-radius:3px;overflow:hidden;">
                  <div style="width:${pct}%;height:100%;background:var(--success);border-radius:3px;"></div>
                </div>
                <span style="font-size:12px;color:var(--text-secondary);">${season.watched}/${season.episodes}集</span>
              </div>
            </div>
            <div class="season-toggle" id="toggle-${season.num}" style="width:36px;height:36px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;transition:transform .2s;flex-shrink:0;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
          </div>
          <div class="season-episodes-list" id="episodes-${season.num}" style="display:none;padding:16px 32px;background:var(--surface-hover);border-top:1px solid var(--border-light);">
            ${episodes.map((ep, eIdx) => {
              const key = `${media.id}_${season.num}_${ep.number}`;
              const w = isEpisodeWatched(media.id, season.num, ep.number);
              return `<div class="episode-item" style="display:flex;align-items:center;gap:12px;padding:10px;border-bottom:1px solid var(--border-light);">
                <button class="watch-btn" style="width:32px;height:32px;border-radius:50%;border:2px solid ${w ? '#34c759' : 'var(--border)'};background:${w ? '#34c759' : 'none'};cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;" onclick="toggleEpisode(${media.id},${season.num},${ep.number});">
                  <svg viewBox="0 0 24 24" fill="none" stroke="${w ? '#fff' : 'var(--text-secondary)'}" stroke-width="2.5" style="width:14px;height:14px;"><polyline points="20 6 9 17 4 12"/></svg>
                </button>
                <div style="width:48px;font-size:14px;font-weight:600;color:var(--text-secondary);text-align:center;">${String(ep.number).padStart(2,'0')}</div>
                <div style="flex:1;">
                  <div style="font-size:14px;font-weight:500;">${ep.title}</div>
                  <div style="font-size:12px;color:var(--text-tertiary);margin-top:2px;">${ep.airDate} · ⭐${ep.rating}</div>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </section>
    ` : ''}

    <section style="margin-bottom:48px;">
      <h2 style="font-size:22px;font-weight:700;margin-bottom:20px;">🎭 主要演员</h2>
      <div class="cast-row" style="display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;">
        ${CAST.map((c, i) => `<div class="cast-card" style="flex:0 0 140px;text-align:center;cursor:pointer;text-decoration:none;color:inherit;">
          <div style="width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg, ${['#667eea', '#764ba2', '#f093fb', '#4facfe', '#00f2fe', '#43e97b'][i % 6]}, ${['#764ba2', '#f093fb', '#f5576c', '#00f2fe', '#43e97b', '#38f9d7'][i % 6]});margin:0 auto 8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:700;">${c.name[0]}</div>
          <div style="font-size:14px;font-weight:600;margin-bottom:2px;">${c.name}</div>
          <div style="font-size:12px;color:var(--text-secondary);">${c.role}</div>
        </div>`).join('')}
      </div>
    </section>

    <section style="margin-bottom:48px;">
      <h2 style="font-size:22px;font-weight:700;margin-bottom:20px;">🎬 预告片 & 视频</h2>
      <div class="video-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;">
        ${VIDEOS.map((v, i) => `<div class="video-card" style="background:var(--surface);border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-light);cursor:pointer;transition:all .2s;" onclick="showToast('播放预告片...');">
          <div style="position:relative;aspect-ratio:16/9;background:url('${media.backdrop}') center/cover;overflow:hidden;display:flex;align-items:center;justify-content:center;">
            <div style="position:absolute;inset:0;background:rgba(0,0,0,.3);"></div>
            <div style="position:relative;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;">
              <svg viewBox="0 0 24 24" style="width:24px;height:24px;color:var(--text-primary);fill:currentColor;"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            </div>
          </div>
          <div style="padding:12px;">
            <div style="font-size:14px;font-weight:600;margin-bottom:4px;">${v.title}</div>
            <div style="font-size:12px;color:var(--text-secondary);">${v.type}</div>
          </div>
        </div>`).join('')}
      </div>
    </section>

    <section style="margin-bottom:48px;">
      <h2 style="font-size:22px;font-weight:700;margin-bottom:20px;">✨ 相似推荐</h2>
      <div class="card-row" style="display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;">
        ${SAMPLE_MEDIA.filter(m => m.id !== media.id).slice(0, 6).map(m => `<div class="card" onclick="goToDetail(${m.id});" style="flex:0 0 160px;cursor:pointer;text-decoration:none;color:inherit;transition:transform .2s;">
          <div class="card-poster" style="width:160px;height:240px;border-radius:var(--radius-md);overflow:hidden;background:var(--border-light);position:relative;">
            <img src="${m.poster}" alt="${m.title}" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;">
            <span class="card-rating" style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);color:#ffd60a;padding:4px 8px;border-radius:8px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:3px;">⭐ ${m.rating}</span>
          </div>
          <div style="font-size:14px;font-weight:600;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${m.title}</div>
          <div style="font-size:13px;color:var(--text-secondary);margin-top:2px;">${m.year}</div>
        </div>`).join('')}
      </div>
    </section>
  `;
}

function toggleWatchState() {
  if (!isInWatchlist(media.id)) {
    toggleWatchlist(media, 'watching');
  } else {
    const wl = getWatchlist();
    const idx = wl.findIndex(i => i.id === media.id);
    if (idx >= 0) {
      wl.splice(idx, 1);
      saveWatchlist(wl);
      showToast('已移除');
    }
  }
  renderDetail();
}

function cycleWatchStatus() {
  const wl = getWatchlist();
  const item = wl.find(i => i.id === media.id);
  if (!item) return;
  const cycle = ['watchlist', 'watching', 'watched'];
  const idx = cycle.indexOf(item.status);
  item.status = cycle[(idx + 1) % cycle.length];
  saveWatchlist(wl);
  showToast('状态已更新');
  renderDetail();
}

function toggleSeason(seasonNum) {
  const list = document.getElementById('episodes-' + seasonNum);
  const toggle = document.getElementById('toggle-' + seasonNum);
  if (list.style.display === 'none') {
    list.style.display = 'block';
    toggle.style.transform = 'rotate(180deg)';
  } else {
    list.style.display = 'none';
    toggle.style.transform = 'rotate(0deg)';
  }
}

function toggleEpisode(id, s, e) {
  const w = isEpisodeWatched(id, s, e);
  const all = getWatched();
  const key = `${id}_${s}_${e}`;
  if (all[key]) delete all[key];
  else all[key] = true;
  saveWatched(all);
  showToast(!w ? '已标记为已看' : '已取消标记');
  renderDetail();
}

renderDetail();
</script>
</body>
</html>
