<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>探索发现 - TV Tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <div class="container">
    <div class="page-header">
      <h1 class="page-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        探索发现
      </h1>
      <p style="font-size:15px;color:var(--text-secondary);margin-top:8px;">发现精彩影视，开启观影之旅</p>
    </div>

    <div class="filter-bar">
      <div class="filter-group">
        <button class="filter-btn active" data-filter-type="all">全部</button>
        <button class="filter-btn" data-filter-type="movie">电影</button>
        <button class="filter-btn" data-filter-type="tv">电视剧</button>
      </div>
      <div class="filter-group">
        <button class="filter-btn active" data-filter-sort="rating">评分最高</button>
        <button class="filter-btn" data-filter-sort="popular">热门</button>
        <button class="filter-btn" data-filter-sort="newest">最新</button>
      </div>
      <select class="filter-select" id="yearFilter">
        <option value="">全部年份</option>
        <option value="2024">2024</option>
        <option value="2023">2023</option>
        <option value="2022">2022</option>
      </select>
      <button class="refresh-btn" onclick="refreshData()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        刷新
      </button>
    </div>

    <div class="results-info" id="resultsInfo"></div>

    <div class="media-grid" id="mediaGrid"></div>

    <div class="pagination" id="pagination"></div>
  </div>

  <div class="footer">
    <p>TV Tracker - 你的专属追剧日历管家 | 数据来源 <a href="https://www.themoviedb.org/" target="_blank">TMDB</a></p>
  </div>
</div>
<script src="js/app.js"></script>
<script>
initApp('explore');

// State
let state = {
  type: 'all',
  sort: 'rating',
  year: '',
  page: 1,
  pageSize: 12
};

// Generate more items for pagination
const ALL_MEDIA = [...SAMPLE_MEDIA];
for (let i = 0; i < 3; i++) {
  SAMPLE_MEDIA.forEach(m => {
    ALL_MEDIA.push({
      ...m,
      id: m.id + (i + 1) * 100,
      title: m.title + ' ' + ['续集', '前传', '番外'][i]
    });
  });
}

function getFilteredData() {
  let items = [...ALL_MEDIA];
  if (state.type !== 'all') items = items.filter(m => m.type === state.type);
  if (state.year) items = items.filter(m => m.year === parseInt(state.year));
  if (state.sort === 'rating') items.sort((a, b) => b.rating - a.rating);
  else if (state.sort === 'newest') items.sort((a, b) => b.year - a.year);
  return items;
}

function renderMedia() {
  const items = getFilteredData();
  const total = items.length;
  const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
  if (state.page > totalPages) state.page = 1;
  const start = (state.page - 1) * state.pageSize;
  const pageItems = items.slice(start, start + state.pageSize);

  document.getElementById('resultsInfo').innerHTML = `
    <div class="active-filters">
      <span class="filter-label">筛选结果:</span>
      ${state.type !== 'all' ? `<span class="filter-tag">${state.type === 'movie' ? '电影' : '电视剧'}<button>×</button></span>` : ''}
      ${state.year ? `<span class="filter-tag">${state.year}年<button>×</button></span>` : ''}
    </div>
    <span class="results-count">共 ${total} 部影视</span>
  `;

  document.getElementById('mediaGrid').innerHTML = pageItems.map(item => {
    const inWl = isInWatchlist(item.id);
    const status = getWatchStatus(item.id);
    let statusBadge = '';
    if (inWl) {
      const colors = { watching: 'rgba(255,149,0,.1)', watched: 'rgba(52,199,89,.1)', watchlist: 'rgba(0,113,227,.1)' };
      const textColors = { watching: '#ff9500', watched: '#34c759', watchlist: '#0071e3' };
      const labels = { watching: '在追', watched: '已看', watchlist: '想看' };
      statusBadge = `<div class="card-status" style="background:${colors[status]};color:${textColors[status]};">${labels[status]}</div>`;
    }
    return `<div class="card" onclick="goToDetail(${item.id})">
      <div class="card-poster">
        <img src="${item.poster}" alt="${item.title}" loading="lazy">
        <span class="card-rating">⭐ ${item.rating}</span>
        <span class="card-type" style="position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;padding:4px 8px;border-radius:8px;font-size:11px;font-weight:600;">${item.type === 'movie' ? '电影' : '剧集'}</span>
      </div>
      <div class="card-title">${item.title}</div>
      <div class="card-year">${item.year}</div>
      ${statusBadge}
    </div>`;
  }).join('');

  renderPagination(total, totalPages);
}

function renderPagination(total, totalPages) {
  if (totalPages <= 1) {
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  let pages = [];
  const maxButtons = 7;
  if (totalPages <= maxButtons) {
    for (let i = 1; i <= totalPages; i++) pages.push(i);
  } else {
    if (state.page <= 4) { pages = [1,2,3,4,5,'...',totalPages]; }
    else if (state.page >= totalPages - 3) { pages = [1,'...',totalPages-4,totalPages-3,totalPages-2,totalPages-1,totalPages]; }
    else { pages = [1,'...',state.page-1,state.page,state.page+1,'...',totalPages]; }
  }
  document.getElementById('pagination').innerHTML = `
    <span class="page-info">第 ${state.page} / ${totalPages} 页</span>
    <button class="page-btn" onclick="goToPage(${state.page - 1})" ${state.page <= 1 ? 'disabled' : ''}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    ${pages.map(p => p === '...' ? '<button class="page-btn ellipsis" disabled>...</button>' : `<button class="page-btn ${p === state.page ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`).join('')}
    <button class="page-btn" onclick="goToPage(${state.page + 1})" ${state.page >= totalPages ? 'disabled' : ''}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  `;
}

function goToPage(page) {
  state.page = page;
  renderMedia();
  window.scrollTo({ top: 200, behavior: 'smooth' });
}

function refreshData() {
  const btn = document.querySelector('.refresh-btn');
  const icon = btn.querySelector('svg');
  icon.style.animation = 'spin 1s linear infinite';
  setTimeout(() => { icon.style.animation = ''; showToast('数据已刷新'); }, 800);
}

// Filter handlers
document.querySelectorAll('[data-filter-type]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-filter-type]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.type = btn.dataset.filterType;
    state.page = 1;
    renderMedia();
  });
});

document.querySelectorAll('[data-filter-sort]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-filter-sort]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.sort = btn.dataset.filterSort;
    state.page = 1;
    renderMedia();
  });
});

document.getElementById('yearFilter').addEventListener('change', (e) => {
  state.year = e.target.value;
  state.page = 1;
  renderMedia();
});

renderMedia();
</script>
</body>
</html>
