<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>追影日历 - TV Tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <div class="container">
    <div class="page-header">
      <h1 class="page-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        追影日历
      </h1>
      <button class="refresh-btn" onclick="refreshCalendar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        刷新
      </button>
    </div>

    <div class="stat-strip">
      <div class="stat-card hero-stat">
        <div class="stat-label">📅 本周更新</div>
        <div class="stat-num">12<span class="stat-unit">集</span></div>
        <div class="sparkline" id="sparkline"></div>
        <div class="stat-sub">未来7天 · 比上周多3集</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">📺 追剧总数</div>
        <div class="stat-num" id="totalShows">8<span class="stat-unit">部</span></div>
        <div class="stat-sub">3部完结 · 5部在追</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">⏳ 待看剧集</div>
        <div class="stat-num" id="unwatchedCount">24<span class="stat-unit">集</span></div>
        <div class="stat-sub">已追完 156 集</div>
      </div>
    </div>

    <section class="section">
      <div class="section-header">
        <h2 class="section-title">📆 更新日程</h2>
        <p class="section-subtitle">点击剧集标记观看状态</p>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </section>
  </div>

  <div class="footer">
    <p>TV Tracker - 你的专属追剧日历管家 | 数据来源 <a href="https://www.themoviedb.org/" target="_blank">TMDB</a></p>
  </div>
</div>
<script src="js/app.js"></script>
<script>
initApp('calendar');

// Sparkline
function renderSparkline() {
  const counts = [2, 3, 1, 4, 2, 1, 3]; // 7 days
  const max = Math.max(...counts);
  const today = new Date().getDay();
  document.getElementById('sparkline').innerHTML = counts.map((c, i) =>
    `<div class="spark-bar ${i === today ? 'today' : ''}" style="height:${8 + (c / max) * 24}px" title="${c} 集"></div>`
  ).join('');
}

// Calendar data
function generateCalendarData() {
  const groups = [];
  const tvShows = SAMPLE_MEDIA.filter(m => m.type === 'tv');
  for (let offset = -2; offset <= 7; offset++) {
    const dateKey = getDateKey(offset);
    const date = new Date(dateKey);
    const dayEpisodes = [];
    if (offset === 0) {
      // Today - 3 episodes
      [[1,4,1],[1,4,2],[3,2,1]].forEach(([id, s, e], idx) => {
        const show = tvShows[idx % tvShows.length];
        dayEpisodes.push({ mediaId: show.id, title: show.title, poster: show.poster, season: s, episode: e, time: `${08 + idx * 2}:00`, watched: idx === 0 });
      });
    } else if (offset === 1) {
      [[2,2,1],[4,3,1]].forEach(([id, s, e], idx) => {
        const show = tvShows[(idx + 2) % tvShows.length];
        dayEpisodes.push({ mediaId: show.id, title: show.title, poster: show.poster, season: s, episode: e, time: `${09 + idx}:30`, watched: false });
      });
    } else if (offset === 2) {
      [[3,1,1]].forEach(([id, s, e], idx) => {
        const show = tvShows[(idx + 3) % tvShows.length];
        dayEpisodes.push({ mediaId: show.id, title: show.title, poster: show.poster, season: s, episode: e, time: '20:00', watched: false });
      });
    } else if (offset === -1) {
      [[1,4,0]].forEach(([id, s, e], idx) => {
        const show = tvShows[0];
        dayEpisodes.push({ mediaId: show.id, title: show.title, poster: show.poster, season: s, episode: 1, time: '10:00', watched: true });
      });
    } else if (offset >= 0 && offset <= 7) {
      const show = tvShows[offset % tvShows.length];
      if (offset === 4) {
        dayEpisodes.push({ mediaId: show.id, title: show.title, poster: show.poster, season: 2, episode: 3, time: '21:00', watched: false });
      }
      if (offset === 5) {
        dayEpisodes.push({ mediaId: tvShows[1].id, title: tvShows[1].title, poster: tvShows[1].poster, season: 1, episode: 4, time: '18:00', watched: false });
      }
    }
    if (dayEpisodes.length > 0 || offset >= -1 && offset <= 2) {
      groups.push({ date: dateKey, episodes: dayEpisodes });
    }
  }
  return groups.filter(g => g.episodes.length > 0);
}

function renderCalendar() {
  const groups = generateCalendarData();
  const html = groups.map(group => {
    const relative = getRelativeDay(group.date);
    const dateObj = new Date(group.date);
    const formatted = dateObj.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'short' });
    const displayName = relative ? `${formatted} · ${relative}` : formatted;
    const color = isToday(group.date) ? '#ff9500' : '#0071e3';
    return `<div class="date-group" style="border-radius:var(--radius-md);border:1px solid var(--border-light);background:var(--surface);margin-bottom:12px;overflow:hidden;">
      <div class="date-header" style="padding:12px 20px;background:var(--surface-hover);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-light);">
        <div style="display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;">
          <div style="width:10px;height:10px;border-radius:50%;background:${color};"></div>
          ${displayName}
        </div>
        <span style="font-size:12px;color:${color};background:${color}15;padding:4px 10px;border-radius:12px;font-weight:600;">${group.episodes.length}部更新</span>
      </div>
      ${group.episodes.map(ep => {
        const key = `${ep.mediaId}_${ep.season}_${ep.episode}`;
        const isWatched = isEpisodeWatched(ep.mediaId, ep.season, ep.episode);
        return `<div class="episode-row" style="display:flex;align-items:center;gap:16px;padding:14px 20px;border-top:1px solid var(--border-light);cursor:pointer;transition:background .15s;" onclick="goToDetail(${ep.mediaId})">
          <img src="${ep.poster}" style="width:48px;height:72px;border-radius:8px;object-fit:cover;flex-shrink:0;">
          <div style="flex:1;min-width:0;">
            <div style="font-size:15px;font-weight:600;">${ep.title}</div>
            <div style="font-size:13px;color:var(--text-secondary);margin-top:2px;">第${ep.season}季 第${ep.episode}集</div>
            <div style="font-size:12px;color:var(--text-tertiary);margin-top:2px;display:flex;align-items:center;gap:4px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${ep.time}</div>
          </div>
          <button class="watch-btn" style="width:36px;height:36px;border-radius:50%;border:2px solid ${isWatched ? '#34c759' : 'var(--border)'};background:${isWatched ? '#34c759' : 'none'};cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;" onclick="event.stopPropagation();toggleWatched(${ep.mediaId},${ep.season},${ep.episode});">
            <svg viewBox="0 0 24 24" fill="none" stroke="${isWatched ? '#fff' : 'var(--text-secondary)'}" stroke-width="2.5" style="width:16px;height:16px;"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
  document.getElementById('calendarGrid').innerHTML = html;
}

function toggleWatched(mediaId, season, episode) {
  const w = isEpisodeWatched(mediaId, season, episode);
  const wKey = `${mediaId}_${season}_${episode}`;
  const all = getWatched();
  if (all[wKey]) delete all[wKey];
  else all[wKey] = true;
  saveWatched(all);
  showToast(!w ? '已标记为已看' : '已取消标记');
  renderCalendar();
  updateStats();
}

function refreshCalendar() {
  const btn = document.querySelector('.refresh-btn');
  const icon = btn.querySelector('svg');
  icon.style.animation = 'spin 1s linear infinite';
  setTimeout(() => { icon.style.animation = ''; showToast('日历已刷新'); }, 800);
}

function updateStats() {
  const total = getWatchlist().length;
  document.getElementById('totalShows').innerHTML = total + '<span class="stat-unit">部</span>';
  const all = getWatched();
  const watchedCount = Object.keys(all).length;
  document.getElementById('unwatchedCount').innerHTML = Math.max(0, 24 - watchedCount) + '<span class="stat-unit">集</span>';
}

renderSparkline();
renderCalendar();
updateStats();
</script>
</body>
</html>
