<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热门推荐 - TV Tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <div class="hero" id="heroSection">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <span class="hero-badge" id="heroBadge"></span>
      <h1 class="hero-title" id="heroTitle"></h1>
      <p class="hero-tagline" id="heroTagline"></p>
      <p class="hero-desc" id="heroDesc"></p>
      <div class="hero-info">
        <span id="heroRating"></span>
        <span id="heroYear"></span>
        <span id="heroMeta"></span>
      </div>
      <div class="hero-actions">
        <button class="btn btn-primary" onclick="goToDetail(currentHeroId)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          查看详情
        </button>
        <button class="btn btn-secondary" onclick="toggleHeroWatchlist()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          <span id="heroWatchBtn">加入追影</span>
        </button>
      </div>
    </div>
  </div>

  <div class="container">
    <section class="section">
      <div class="section-header">
        <div>
          <h2 class="section-title">🔥 热门电视剧</h2>
          <p class="section-subtitle">正在热播的精彩剧集</p>
        </div>
        <a href="explore.html" class="section-more">查看更多 →</a>
      </div>
      <div class="card-row" id="tvTrending"></div>
    </section>

    <section class="section">
      <div class="section-header">
        <div>
          <h2 class="section-title">🎥 热门电影</h2>
          <p class="section-subtitle">近期值得观看的电影佳作</p>
        </div>
        <a href="explore.html" class="section-more">查看更多 →</a>
      </div>
      <div class="card-row" id="movieTrending"></div>
    </section>

    <section class="section">
      <div class="section-header">
        <div>
          <h2 class="section-title">⭐ 高分佳作</h2>
          <p class="section-subtitle">评分最高的影视作品</p>
        </div>
        <a href="explore.html" class="section-more">查看更多 →</a>
      </div>
      <div class="card-row" id="topRated"></div>
    </section>

    <section class="section">
      <div class="section-header">
        <div>
          <h2 class="section-title">📺 即将更新</h2>
          <p class="section-subtitle">关注的剧集即将更新</p>
        </div>
        <a href="calendar.html" class="section-more">查看日历 →</a>
      </div>
      <div class="card-row" id="upcomingRow"></div>
    </section>
  </div>

  <div class="footer">
    <p>TV Tracker - 你的专属追剧日历管家 | 数据来源 <a href="https://www.themoviedb.org/" target="_blank">TMDB</a></p>
  </div>
</div>
<script src="js/app.js"></script>
<script>
initApp('home');

// Hero carousel
const heroItems = [
  SAMPLE_MEDIA[0], // 怪奇物语
  SAMPLE_MEDIA[3], // 最后的生还者
  SAMPLE_MEDIA[1], // 奥本海默
  SAMPLE_MEDIA[4], // 继承之战
  SAMPLE_MEDIA[9]  // 沙丘2
];
let currentHeroIdx = 0;
let currentHeroId = heroItems[0].id;
let heroTimer = null;

function renderHero() {
  const item = heroItems[currentHeroIdx];
  currentHeroId = item.id;
  document.getElementById('heroBg').style.backgroundImage = `url('${item.backdrop}')`;
  document.getElementById('heroBadge').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${item.type === 'movie' ? '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M8 4V2M16 4V2"/>' : '<rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/>'}</svg> ${item.type === 'movie' ? '电影' : '剧集'}`;
  document.getElementById('heroTitle').textContent = item.title;
  document.getElementById('heroTagline').textContent = item.tagline || '';
  document.getElementById('heroDesc').textContent = item.overview;
  document.getElementById('heroRating').innerHTML = `<svg viewBox="0 0 24 24" fill="#ffd60a" style="width:14px;height:14px;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> ${item.rating}`;
  document.getElementById('heroYear').textContent = ` ${item.year}`;
  document.getElementById('heroMeta').textContent = ` · ${item.genres.slice(0, 2).join(' / ')}`;
  document.getElementById('heroWatchBtn').textContent = isInWatchlist(item.id) ? '已在追影列表' : '加入追影';
}

function toggleHeroWatchlist() {
  const item = heroItems[currentHeroIdx];
  const wasAdded = toggleWatchlist(item, 'watching');
  document.getElementById('heroWatchBtn').textContent = isInWatchlist(item.id) ? '已在追影列表' : '加入追影';
}

function nextHero() {
  currentHeroIdx = (currentHeroIdx + 1) % heroItems.length;
  renderHero();
}

renderHero();
heroTimer = setInterval(nextHero, 8000);

// Render media cards
function renderCardRow(containerId, items, filterFn) {
  const filtered = filterFn ? items.filter(filterFn) : items;
  const container = document.getElementById(containerId);
  container.innerHTML = filtered.map(item => {
    const inWl = isInWatchlist(item.id);
    const status = getWatchStatus(item.id);
    let statusBadge = '';
    if (inWl) {
      const colors = { watching: 'rgba(255,149,0,.1)', watched: 'rgba(52,199,89,.1)', watchlist: 'rgba(0,113,227,.1)' };
      const textColors = { watching: '#ff9500', watched: '#34c759', watchlist: '#0071e3' };
      const labels = { watching: '在追', watched: '已看', watchlist: '想看' };
      statusBadge = `<div class="card-status" style="background:${colors[status]};color:${textColors[status]};">${labels[status]}</div>`;
    }
    return `<div class="card" onclick="goToDetail(${item.id})">
      <div class="card-poster">
        <img src="${item.poster}" alt="${item.title}" loading="lazy">
        <span class="card-rating">⭐ ${item.rating}</span>
      </div>
      <div class="card-title">${item.title}</div>
      <div class="card-year">${item.year}</div>
      ${statusBadge}
    </div>`;
  }).join('');
}

renderCardRow('tvTrending', SAMPLE_MEDIA, m => m.type === 'tv');
renderCardRow('movieTrending', SAMPLE_MEDIA, m => m.type === 'movie');
renderCardRow('topRated', SAMPLE_MEDIA.sort((a, b) => b.rating - a.rating));
renderCardRow('upcomingRow', SAMPLE_MEDIA.slice(0, 8));
</script>
</body>
</html>
