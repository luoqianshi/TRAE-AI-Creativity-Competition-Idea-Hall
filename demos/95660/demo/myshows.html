<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的追剧 - TV Tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <div class="container">
    <div class="page-header">
      <h1 class="page-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        我的追剧
      </h1>
      <button class="refresh-btn" onclick="window.location.reload()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        刷新
      </button>
    </div>

    <div class="stat-strip">
      <div class="stat-card hero-stat">
        <div class="stat-label">🎬 我的追影</div>
        <div class="stat-num" id="totalCount">0<span class="stat-unit">部</span></div>
        <div class="stat-sub">共收藏了这些影视作品</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">⏳ 想看</div>
        <div class="stat-num" id="watchlistCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">📺 在追</div>
        <div class="stat-num" id="watchingCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">✅ 已看</div>
        <div class="stat-num" id="watchedCount">0</div>
      </div>
    </div>

    <div class="tabs" style="margin-top:20px;">
      <button class="tab active" data-tab="all">全部</button>
      <button class="tab" data-tab="watchlist">想看</button>
      <button class="tab" data-tab="watching">在追</button>
      <button class="tab" data-tab="watched">已看</button>
    </div>

    <div id="showsList" style="margin-top:20px;"></div>
    <div id="emptyState" style="display:none;padding:60px 24px;text-align:center;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:64px;height:64px;color:var(--border);margin-bottom:16px;"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <h3 style="font-size:18px;font-weight:600;margin-bottom:8px;">暂无追剧记录</h3>
      <p style="font-size:14px;color:var(--text-secondary);margin-bottom:20px;">快去探索发现你感兴趣的影视吧</p>
      <a href="explore.html" class="btn btn-primary">开始探索</a>
    </div>
  </div>

  <div class="footer">
    <p>TV Tracker - 你的专属追剧日历管家 | 数据来源 <a href="https://www.themoviedb.org/" target="_blank">TMDB</a></p>
  </div>
</div>
<script src="js/app.js"></script>
<script>
initApp('myshows');

let currentFilter = 'all';

// Seed some data on first visit
function seedData() {
  if (getWatchlist().length === 0) {
    const wl = [
      { id: 1, type: 'tv', title: '怪奇物语', poster: SAMPLE_MEDIA[0].poster, status: 'watching', addedAt: Date.now() },
      { id: 4, type: 'tv', title: '最后的生还者', poster: SAMPLE_MEDIA[3].poster, status: 'watching', addedAt: Date.now() },
      { id: 5, type: 'tv', title: '继承之战', poster: SAMPLE_MEDIA[4].poster, status: 'watching', addedAt: Date.now() },
      { id: 2, type: 'movie', title: '奥本海默', poster: SAMPLE_MEDIA[1].poster, status: 'watched', addedAt: Date.now() },
      { id: 10, type: 'movie', title: '沙丘2', poster: SAMPLE_MEDIA[9].poster, status: 'watchlist', addedAt: Date.now() },
      { id: 6, type: 'movie', title: '疾速追杀4', poster: SAMPLE_MEDIA[5].poster, status: 'watchlist', addedAt: Date.now() }
    ];
    saveWatchlist(wl);
  }
}

function getShowsData() {
  const wl = getWatchlist();
  return wl.map(item => {
    const media = SAMPLE_MEDIA.find(m => m.id === item.id) || item;
    return { ...media, status: item.status, myId: item.id };
  });
}

function updateStats() {
  const wl = getWatchlist();
  document.getElementById('totalCount').innerHTML = wl.length + '<span class="stat-unit">部</span>';
  document.getElementById('watchlistCount').innerHTML = wl.filter(i => i.status === 'watchlist').length;
  document.getElementById('watchingCount').innerHTML = wl.filter(i => i.status === 'watching').length;
  document.getElementById('watchedCount').innerHTML = wl.filter(i => i.status === 'watched').length;
}

function renderShows() {
  const shows = getShowsData();
  updateStats();
  let filtered = shows;
  if (currentFilter !== 'all') filtered = shows.filter(s => s.status === currentFilter);

  if (filtered.length === 0) {
    document.getElementById('showsList').innerHTML = '';
    document.getElementById('emptyState').style.display = 'block';
    document.querySelector('#emptyState h3').textContent = currentFilter === 'all' ? '暂无追剧记录' : '这个分类下暂无内容';
    return;
  }
  document.getElementById('emptyState').style.display = 'none';

  const statusStyles = {
    watchlist: { bg: 'rgba(0,113,227,.1)', color: '#0071e3', label: '想看' },
    watching: { bg: 'rgba(255,149,0,.1)', color: '#ff9500', label: '在追' },
    watched: { bg: 'rgba(52,199,89,.1)', color: '#34c759', label: '已看' }
  };

  document.getElementById('showsList').innerHTML = filtered.map(s => {
    const st = statusStyles[s.status] || statusStyles.watchlist;
    // Fake progress data
    let progressHTML = '';
    if (s.type === 'tv' && s.status === 'watching') {
      const progress = Math.floor(Math.random() * 70 + 10);
      progressHTML = `<div style="flex:0 0 200px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
        <div style="width:100%;height:6px;background:var(--border-light);border-radius:3px;overflow:hidden;">
          <div style="width:${progress}%;height:100%;background:${st.color};border-radius:3px;"></div>
        </div>
        <span style="font-size:12px;color:var(--text-secondary);">${Math.floor(progress * 0.3)} / ${Math.floor(progress * 0.3 * 3)} 集</span>
      </div>`;
    }
    return `<div class="show-card" onclick="goToDetail(${s.myId})" style="display:flex;align-items:center;gap:16px;padding:16px;background:var(--surface);border-radius:var(--radius-md);border:1px solid var(--border-light);margin-bottom:12px;transition:all .2s;cursor:pointer;">
      <img src="${s.poster}" style="width:72px;height:108px;border-radius:10px;object-fit:cover;flex-shrink:0;">
      <div style="flex:1;min-width:0;">
        <div style="font-size:17px;font-weight:600;margin-bottom:6px;">${s.title}</div>
        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">${s.type === 'movie' ? '电影' : '电视剧'} · ${s.year || '2023'} · ⭐ ${s.rating || '8.0'}</div>
        <button class="status-badge" style="font-size:12px;font-weight:600;padding:6px 14px;border-radius:12px;border:none;cursor:pointer;background:${st.bg};color:${st.color};" onclick="event.stopPropagation();cycleStatus(${s.myId});">${st.label} ▾</button>
      </div>
      ${progressHTML}
      <button onclick="event.stopPropagation();removeFromWatchlist(${s.myId});" style="width:36px;height:36px;border-radius:50%;border:1px solid var(--border-light);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:all .15s;flex-shrink:0;" onmouseover="this.style.borderColor='#ff3b30';this.style.color='#ff3b30';" onmouseout="this.style.borderColor='var(--border-light)';this.style.color='var(--text-secondary)';">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>`;
  }).join('');
}

function cycleStatus(id) {
  const wl = getWatchlist();
  const item = wl.find(i => i.id === id);
  if (!item) return;
  const cycle = ['watchlist', 'watching', 'watched'];
  const idx = cycle.indexOf(item.status);
  item.status = cycle[(idx + 1) % cycle.length];
  saveWatchlist(wl);
  showToast('状态已更新');
  renderShows();
}

function removeFromWatchlist(id) {
  const wl = getWatchlist();
  const idx = wl.findIndex(i => i.id === id);
  if (idx >= 0) {
    wl.splice(idx, 1);
    saveWatchlist(wl);
    showToast('已移除');
    renderShows();
  }
}

// Tab handlers
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.tab;
    renderShows();
  });
});

seedData();
renderShows();
</script>
</body>
</html>
