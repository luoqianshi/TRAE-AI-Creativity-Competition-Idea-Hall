<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红蓝团队随机选择</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            padding: 0 50px;
        }
        
        .team-box {
            width: 300px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            font-size: 52px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .red-team {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            border: 3px solid #ff6b6b;
        }
        
        .blue-team {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            border: 3px solid #5dade2;
        }
        
        .vs {
            font-size: 48px;
            font-weight: bold;
            color: #f39c12;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: pulse 1s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .hint {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            animation: blink 2s ease-in-out infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .team-box.shake {
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: linear-gradient(135deg, #2d3436 0%, #1a1a2e 100%);
            border-radius: 15px;
            padding: 30px 40px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 2px solid #3498db;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal h2 {
            color: #3498db;
            margin-bottom: 20px;
            text-align: center;
            font-size: 24px;
        }

        .modal ul {
            list-style: none;
            padding: 0;
        }

        .modal li {
            color: white;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .modal li:last-child {
            border-bottom: none;
        }

        .key {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .modal-close {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .history-modal {
            max-width: 600px;
        }

        .history-content {
            display: flex;
            gap: 40px;
            justify-content: center;
        }

        .history-column {
            flex: 1;
            min-width: 200px;
        }

        .history-column h3 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .history-column:first-child h3 {
            color: #e74c3c;
        }

        .history-column:last-child h3 {
            color: #3498db;
        }

        .history-column ul {
            max-height: 300px;
            overflow-y: auto;
        }

        .history-column li {
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-column:first-child li {
            background: rgba(231, 76, 60, 0.2);
            border-left: 3px solid #e74c3c;
        }

        .history-column:last-child li {
            background: rgba(52, 152, 219, 0.2);
            border-left: 3px solid #3498db;
        }

        .history-column .empty {
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            padding: 20px;
        }

        .order-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
        }

        .settings-modal {
            max-width: 500px;
        }

        .settings-content {
            margin-top: 10px;
        }

        #teamInput {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }

        #teamInput:focus {
            border-color: #3498db;
        }

        #teamInput::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .settings-hint {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }

        .settings-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 30px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .btn-confirm {
            background: #3498db;
            color: white;
        }

        .btn-confirm:hover {
            background: #2980b9;
        }

        .btn-red {
            background: #e74c3c;
        }

        .btn-red:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="team-box red-team" id="redTeam">左方队</div>
        <span class="vs">VS</span>
        <div class="team-box blue-team" id="blueTeam">右方队</div>
    </div>
    <div class="hint">按空格键随机选择团队 | 按 H 键查看帮助</div>

    <div class="modal-overlay" id="helpModal">
        <div class="modal">
            <h2>使用说明</h2>
            <ul>
                <li><span class="key">空格</span>开始/停止随机选择</li>
                <li><span class="key">L</span>设置左方队团队名单</li>
                <li><span class="key">R</span>设置右方队团队名单</li>
                <li><span class="key">Ctrl+R</span>重置已选中名单</li>
                <li><span class="key">H</span>显示/隐藏帮助说明</li>
                <li><span class="key">M</span>查看已选中的团队</li>
                <li><span class="key">ESC</span>关闭弹窗</li>
            </ul>
            <div class="modal-close">按 ESC 或点击空白处关闭</div>
        </div>
    </div>

    <div class="modal-overlay" id="historyModal">
        <div class="modal history-modal">
            <h2>已选中团队</h2>
            <div class="history-content">
                <div class="history-column">
                    <h3>左方队</h3>
                    <ul id="redHistory"></ul>
                </div>
                <div class="history-column">
                    <h3>右方队</h3>
                    <ul id="blueHistory"></ul>
                </div>
            </div>
            <div class="modal-close">按 ESC 或点击空白处关闭</div>
        </div>
    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal settings-modal">
            <h2 id="settingsTitle">设置团队名单</h2>
            <div class="settings-content">
                <textarea id="teamInput" placeholder="请输入团队名单，每行一个团队"></textarea>
                <div class="settings-hint">每行输入一个团队名称</div>
                <div class="settings-buttons">
                    <button class="btn btn-cancel">取消</button>
                    <button class="btn btn-confirm">确认</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'team_selection_cache';
        const TEAM_NAMES_KEY = 'team_names_cache';

        const defaultBlueTeamNames = [
            '蓝一队','蓝二队','蓝三队',
        ];

        const defaultRedTeamNames = [
            '红一队','红二队','红三队',
        ];

        function loadTeamNames() {
            try {
                const saved = localStorage.getItem(TEAM_NAMES_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    return {
                        red: data.redTeamNames || defaultRedTeamNames,
                        blue: data.blueTeamNames || defaultBlueTeamNames
                    };
                }
            } catch (e) {
                console.error('加载团队名单失败:', e);
            }
            return { red: defaultRedTeamNames, blue: defaultBlueTeamNames };
        }

        function saveTeamNamesToStorage(redNames, blueNames) {
            try {
                localStorage.setItem(TEAM_NAMES_KEY, JSON.stringify({ redTeamNames: redNames, blueTeamNames: blueNames }));
            } catch (e) {
                console.error('保存团队名单失败:', e);
            }
        }

        const teamNamesData = loadTeamNames();
        let blueTeamNames = [...teamNamesData.blue];
        let redTeamNames = [...teamNamesData.red];

        function loadFromStorage() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    return JSON.parse(saved);
                }
            } catch (e) {
                console.error('加载缓存失败:', e);
            }
            return { selectedRed: [], selectedBlue: [] };
        }

        function saveToStorage(selectedRed, selectedBlue) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ selectedRed, selectedBlue }));
            } catch (e) {
                console.error('保存缓存失败:', e);
            }
        }

        const savedData = loadFromStorage();
        let selectedRedTeams = savedData.selectedRed || [];
        let selectedBlueTeams = savedData.selectedBlue || [];

        let availableBlueTeams = blueTeamNames.filter(name => !selectedBlueTeams.includes(name));
        let availableRedTeams = redTeamNames.filter(name => !selectedRedTeams.includes(name));

        const redTeam = document.getElementById('redTeam');
        const blueTeam = document.getElementById('blueTeam');
        const hint = document.querySelector('.hint');

        let isRolling = false;
        let redRollInterval;
        let blueRollInterval;
        let currentRedName = '';
        let currentBlueName = '';

        function getRandomFromArray(arr) {
            if (arr.length === 0) return '已全部选完';
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function startRolling() {
            if (availableRedTeams.length === 0 || availableBlueTeams.length === 0) {
                hint.textContent = '所有团队已选完！按 R 键重置';
                return;
            }
            
            isRolling = true;
            redTeam.classList.add('shake');
            blueTeam.classList.add('shake');

            redRollInterval = setInterval(() => {
                currentRedName = getRandomFromArray(availableRedTeams.length > 0 ? availableRedTeams : redTeamNames);
                redTeam.textContent = currentRedName;
            }, 60);

            blueRollInterval = setInterval(() => {
                currentBlueName = getRandomFromArray(availableBlueTeams.length > 0 ? availableBlueTeams : blueTeamNames);
                blueTeam.textContent = currentBlueName;
            }, 60);
            
            hint.textContent = '按空格键停止随机';
        }

        function stopRolling() {
            clearInterval(redRollInterval);
            clearInterval(blueRollInterval);
            isRolling = false;
            redTeam.classList.remove('shake');
            blueTeam.classList.remove('shake');

            if (availableRedTeams.length > 0 && currentRedName && availableRedTeams.includes(currentRedName)) {
                availableRedTeams = availableRedTeams.filter(name => name !== currentRedName);
                selectedRedTeams.push(currentRedName);
            }
            if (availableBlueTeams.length > 0 && currentBlueName && availableBlueTeams.includes(currentBlueName)) {
                availableBlueTeams = availableBlueTeams.filter(name => name !== currentBlueName);
                selectedBlueTeams.push(currentBlueName);
            }

            saveToStorage(selectedRedTeams, selectedBlueTeams);

            if (availableRedTeams.length === 0 || availableBlueTeams.length === 0) {
                hint.textContent = '所有团队已选完！按 R 键重置';
            } else {
                hint.textContent = `按空格开始`;
            }
        }

        function resetTeams() {
            selectedRedTeams = [];
            selectedBlueTeams = [];
            availableBlueTeams = [...blueTeamNames];
            availableRedTeams = [...redTeamNames];
            currentRedName = '';
            currentBlueName = '';
            redTeam.textContent = '左方队';
            blueTeam.textContent = '右方队';
            hint.textContent = '按空格键开始随机';
            saveToStorage([], []);
        }

        const helpModal = document.getElementById('helpModal');
        const historyModal = document.getElementById('historyModal');
        const settingsModal = document.getElementById('settingsModal');
        const settingsTitle = document.getElementById('settingsTitle');
        const teamInput = document.getElementById('teamInput');
        const confirmBtn = document.querySelector('.btn-confirm');
        const cancelBtn = document.querySelector('.btn-cancel');
        const redHistory = document.getElementById('redHistory');
        const blueHistory = document.getElementById('blueHistory');

        let editingTeam = 'red';

        function toggleHelpModal() {
            helpModal.classList.toggle('show');
        }

        function closeHelpModal() {
            helpModal.classList.remove('show');
        }

        function renderHistory() {
            redHistory.innerHTML = '';
            blueHistory.innerHTML = '';

            if (selectedRedTeams.length === 0) {
                redHistory.innerHTML = '<li class="empty">暂无选中</li>';
            } else {
                selectedRedTeams.forEach((team, index) => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span class="order-badge">${index + 1}</span>${team}`;
                    redHistory.appendChild(li);
                });
            }

            if (selectedBlueTeams.length === 0) {
                blueHistory.innerHTML = '<li class="empty">暂无选中</li>';
            } else {
                selectedBlueTeams.forEach((team, index) => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span class="order-badge">${index + 1}</span>${team}`;
                    blueHistory.appendChild(li);
                });
            }
        }

        function toggleHistoryModal() {
            renderHistory();
            historyModal.classList.toggle('show');
        }

        function closeHistoryModal() {
            historyModal.classList.remove('show');
        }

        function openSettingsModal(team) {

            editingTeam = team;
            if (team === 'red') {
                settingsTitle.textContent = '设置左方队团队名单';
                settingsTitle.style.color = '#e74c3c';
                confirmBtn.className = 'btn btn-confirm btn-red';
                teamInput.value = redTeamNames.join('\n');
            } else {
                settingsTitle.textContent = '设置右方队团队名单';
                settingsTitle.style.color = '#3498db';
                confirmBtn.className = 'btn btn-confirm';
                teamInput.value = blueTeamNames.join('\n');
            }
            settingsModal.classList.add('show');
            teamInput.focus();
        }

        function closeSettingsModal() {
            settingsModal.classList.remove('show');
        }

        function saveTeamNames() {
            const names = teamInput.value
                .split('\n')
                .map(name => name.trim())
                .filter(name => name.length > 0);

            if (names.length === 0) {
                alert('请至少输入一个团队名称');
                return;
            }

            if (editingTeam === 'red') {
                redTeamNames.length = 0;
                redTeamNames.push(...names);
            } else {
                blueTeamNames.length = 0;
                blueTeamNames.push(...names);
            }

            saveTeamNamesToStorage(redTeamNames, blueTeamNames);
            resetTeams();
            closeSettingsModal();
        }

        function closeAllModals() {
            closeHelpModal();
            closeHistoryModal();
            closeSettingsModal();
        }

        confirmBtn.addEventListener('click', saveTeamNames);
        cancelBtn.addEventListener('click', closeSettingsModal);

        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) {
                closeSettingsModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (isRolling) {
                    stopRolling();
                } else {
                    startRolling();
                }
            } else if (e.code === 'KeyL') {
                e.preventDefault();
                if (!settingsModal.classList.contains('show')) {
                    openSettingsModal('red');
                }
            } else if (e.code === 'KeyR') {
                if (e.ctrlKey) {
                    e.preventDefault();
                    resetTeams();
                } else {
                    e.preventDefault();
                    if (!settingsModal.classList.contains('show')) {
                        openSettingsModal('blue');
                    }
                }
            } else if (e.code === 'KeyH') {
                toggleHelpModal();
            } else if (e.code === 'KeyM') {
                toggleHistoryModal();
            } else if (e.code === 'Escape') {
                closeAllModals();
            }
        });

        helpModal.addEventListener('click', (e) => {
            if (e.target === helpModal) {
                closeHelpModal();
            }
        });

        historyModal.addEventListener('click', (e) => {
            if (e.target === historyModal) {
                closeHistoryModal();
            }
        });

        hint.textContent = '按空格键开始随机 | 按 L/R 设置团队 | 按 H 帮助 | 按 M 历史';
    </script>
</body>
</html>
