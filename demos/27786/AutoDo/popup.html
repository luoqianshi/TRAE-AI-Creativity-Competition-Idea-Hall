<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 252px;
      background: #ffffff;
      color: #3f3f3f;
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .popup-shell { padding: 17px 17px 15px; }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .brand-icon {
      width: 21px;
      height: 21px;
      display: block;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 15px;
      line-height: 1.25;
      font-weight: 800;
      color: #3d3d3d;
      letter-spacing: 0;
    }

    .control-card {
      border-radius: 18px;
      background: #f4f4f4;
      padding: 20px 17px 17px;
      margin-bottom: 17px;
    }

    .card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 11px;
    }

    .card-label {
      font-size: 13px;
      line-height: 1.35;
      font-weight: 800;
      color: #3f3f3f;
    }

    .switch {
      position: relative;
      display: inline-flex;
      width: 38px;
      height: 22px;
      flex-shrink: 0;
    }

    .switch input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .switch-track {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      background: #d8d8d8;
      cursor: pointer;
      transition: background 0.2s;
    }

    .switch-track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      transition: transform 0.2s;
    }

    .switch input:checked + .switch-track { background: #169af3; }
    .switch input:checked + .switch-track::after { transform: translateX(16px); }

    .model-head { margin-top: 24px; margin-bottom: 13px; }

    .test-btn {
      width: 25px;
      height: 25px;
      border: none;
      border-radius: 7px;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: background 0.2s, opacity 0.2s;
    }

    .test-btn:hover { background: rgba(0, 0, 0, 0.05); }
    .test-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .test-btn img { width: 20px; height: 20px; display: block; }

    .model-picker { position: relative; }

    .model-trigger {
      width: 100%;
      border: none;
      border-radius: 10px;
      background: #ffffff;
      padding: 11px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: inherit;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s, transform 0.12s;
    }

    .model-trigger:hover { background: #eeeeee; }
    .model-trigger:active { transform: scale(0.985); }

    .model-name {
      display: block;
      max-width: 147px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 800;
      color: #686868;
    }

    .model-meta {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-top: 6px;
      color: #666666;
      font-size: 9px;
      font-weight: 700;
    }

    .meta-item { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }

    .dot {
      width: 5px;
      height: 5px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #b4b4b4;
    }

    .dot.danger { background: #d82626; }

    .chevron {
      width: 10px;
      height: 10px;
      flex-shrink: 0;
      border-right: 3px solid #686868;
      border-bottom: 3px solid #686868;
      transform: rotate(45deg);
      margin-right: 6px;
      margin-bottom: 6px;
    }

    .model-menu {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 6px);
      z-index: 5;
      max-height: 147px;
      overflow-y: auto;
      padding: 6px;
      border: 1px solid #eeeeee;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    .model-option {
      display: block;
      width: 100%;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: #555555;
      font-family: inherit;
      font-size: 9px;
      font-weight: 700;
      line-height: 1.35;
      padding: 7px 8px;
      text-align: left;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .model-option:hover,
    .model-option.active { background: #f2f2f2; color: #1f1f1f; }

    .primary-btn {
      width: 100%;
      min-height: 39px;
      border: none;
      border-radius: 13px;
      background: #f4f4f4;
      color: #3f3f3f;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s, transform 0.12s;
    }

    .primary-btn:hover { background: #eeeeee; }
    .primary-btn:active { transform: scale(0.985); }
  </style>
</head>
<body>
  <main class="popup-shell">
    <header class="brand">
      <img class="brand-icon" src="icons/WorkDo.svg" alt="">
      <h1 class="brand-title">AutoDO自动作答</h1>
    </header>

    <section class="control-card">
      <div class="card-row">
        <div class="card-label">启动悬浮功能</div>
        <label class="switch" title="启动悬浮功能">
          <input id="floatingToggle" type="checkbox" checked>
          <span class="switch-track"></span>
        </label>
      </div>

      <div class="card-row model-head">
        <div class="card-label">当前模型</div>
        <button type="button" class="test-btn" id="testModelBtn" title="测试">
          <img src="icons/bottom/ceshi.svg" alt="">
        </button>
      </div>

      <div class="model-picker" id="modelPicker">
        <button class="model-trigger" id="modelTrigger" type="button" title="选择当前模型">
          <span>
            <span class="model-name" id="modelStatus">未配置模型</span>
            <span class="model-meta">
              <span class="meta-item"><i class="dot" id="modelStateDot"></i><span id="modelStateText">未测试</span></span>
            </span>
          </span>
          <span class="chevron" aria-hidden="true"></span>
        </button>
        <div class="model-menu" id="modelMenu" hidden></div>
      </div>
    </section>

    <button class="primary-btn" id="openPanelBtn" type="button">打开悬浮面板</button>
  </main>

  <script src="popup.js"></script>
</body>
</html>
