<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间折叠相机 | TIME FOLD CAMERA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #C9A962;
            --silver: #C0C0C0;
            --neon: #00FFFC;
            --cyber: #FF00FF;
            --dark: #0A0A0F;
            --light: #F5F5F0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--dark);
            color: var(--light);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
        }

        .header {
            text-align: center;
            opacity: 0;
            animation: fadeInDown 1s ease-out 0.5s forwards;
        }

        .title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.3em;
            margin-bottom: 8px;
            text-shadow: 0 0 30px rgba(201, 169, 98, 0.5);
        }

        .subtitle {
            font-size: clamp(0.8rem, 1.5vw, 1rem);
            color: rgba(255, 255, 255, 0.6);
            font-weight: 300;
            letter-spacing: 0.2em;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            opacity: 0;
            animation: fadeInUp 1s ease-out 1s forwards;
            pointer-events: auto;
        }

        .camera-frame {
            border: 3px solid var(--gold);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 50px rgba(201, 169, 98, 0.3);
            aspect-ratio: 3/4;
        }

        .camera-view {
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .upload-placeholder {
            text-align: center;
            opacity: 0.6;
            transition: all 0.3s ease;
        }

        .upload-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }

        .upload-text {
            font-size: 1rem;
            letter-spacing: 0.1em;
        }

        #photoInput { display: none; }

        .photo-preview {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .photo-preview.active { opacity: 1; }

        .time-layers {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        .time-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transition: opacity 0.6s ease;
            opacity: 0;
            pointer-events: none;
        }

        .time-layer.active { opacity: 1; }

        /* 过去层 - 复古胶片效果 */
        .layer-past {
            background:
                radial-gradient(ellipse at center, transparent 20%, rgba(60, 30, 10, 0.7) 100%),
                linear-gradient(135deg, rgba(180, 130, 70, 0.6) 0%, rgba(140, 90, 40, 0.7) 100%);
            mix-blend-mode: multiply;
        }

        .layer-past::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 4px),
                repeating-linear-gradient(90deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 1px, transparent 8px);
            opacity: 0.8;
        }

        .layer-past::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                linear-gradient(90deg, transparent 0%, rgba(80, 40, 10, 0.3) 15%, transparent 30%),
                linear-gradient(90deg, transparent 70%, rgba(80, 40, 10, 0.3) 85%, transparent 100%);
            box-shadow:
                inset 0 0 80px rgba(50, 20, 0, 0.6),
                inset 0 0 30px rgba(0, 0, 0, 0.5);
        }

        /* 未来层 - 赛博朋克效果 */
        .layer-future {
            background:
                linear-gradient(135deg, rgba(0, 255, 252, 0.4) 0%, rgba(255, 0, 255, 0.4) 100%);
            mix-blend-mode: screen;
        }

        .layer-future::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0, 255, 252, 0.15) 2px, rgba(0, 255, 252, 0.15) 3px);
            box-shadow:
                inset 0 0 100px rgba(0, 255, 252, 0.3),
                inset 0 0 50px rgba(255, 0, 255, 0.2);
        }

        .layer-future::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                linear-gradient(90deg, transparent 0%, rgba(255, 0, 255, 0.2) 50%, transparent 100%);
            animation: glitch-anim 2.5s infinite;
        }

        /* 三栏分割效果 */
        .time-layers.active .layer-past {
            clip-path: polygon(0 0, 33% 0, 33% 100%, 0 100%);
        }

        .time-layers.active .layer-future {
            clip-path: polygon(67% 0, 100% 0, 100% 100%, 67% 100%);
        }

        @keyframes glitch-anim {
            0%, 100% { transform: translateX(0); opacity: 0.5; }
            10% { transform: translateX(-3px); opacity: 0.7; }
            20% { transform: translateX(3px); opacity: 0.4; }
            30% { transform: translateX(-2px); opacity: 0.6; }
            40% { transform: translateX(2px); opacity: 0.5; }
            50% { transform: translateX(0); opacity: 0.5; }
            60% { transform: translateX(-1px); opacity: 0.7; }
            70% { transform: translateX(1px); opacity: 0.4; }
            80% { transform: translateX(-1px); opacity: 0.6; }
            90% { transform: translateX(1px); opacity: 0.5; }
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }

        .layer-future { animation: flicker 4s infinite; }

        .fold-lines {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .fold-line {
            position: absolute;
            width: 3px; height: 100%;
            background: linear-gradient(180deg,
                transparent 0%,
                var(--gold) 20%,
                #fff 50%,
                var(--gold) 80%,
                transparent 100%);
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.5s ease, box-shadow 0.5s ease;
            box-shadow: 0 0 20px var(--gold), 0 0 40px rgba(201, 169, 98, 0.5);
        }

        .fold-line.active { opacity: 0.9; }
        .fold-line.left { left: 33.3%; }
        .fold-line.right { left: 66.6%; }

        .layer-labels {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
            z-index: 101;
        }

        .layer-label {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            padding: 8px 18px;
            border-radius: 4px;
            backdrop-filter: blur(15px);
            opacity: 0;
            transition: opacity 0.6s ease, transform 0.6s ease;
            transform: translateY(-10px);
            border: 1px solid;
        }

        .layer-label.active {
            opacity: 1;
            transform: translateY(0);
        }

        .label-past {
            color: #FFD4A3;
            background: rgba(139, 69, 19, 0.5);
            border-color: rgba(255, 212, 163, 0.6);
            text-shadow: 0 0 10px rgba(255, 212, 163, 0.8);
            box-shadow: 0 0 20px rgba(139, 69, 19, 0.4);
        }

        .label-present {
            color: #FFFFFF;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .label-future {
            color: #00FFFC;
            background: rgba(0, 255, 252, 0.2);
            border-color: rgba(0, 255, 252, 0.6);
            text-shadow: 0 0 10px rgba(0, 255, 252, 0.8);
            box-shadow: 0 0 20px rgba(0, 255, 252, 0.4);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        .control-btn {
            padding: 12px 30px;
            border: 2px solid var(--gold);
            background: transparent;
            color: var(--gold);
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 4px;
            pointer-events: auto;
        }

        #foldBtn {
            opacity: 0.3;
            transform: translateY(10px);
            pointer-events: none;
        }

        #foldBtn.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .control-btn:hover {
            background: var(--gold);
            color: var(--dark);
            box-shadow: 0 0 30px rgba(201, 169, 98, 0.5);
        }

        .control-btn.secondary {
            border-color: var(--silver);
            color: var(--silver);
        }

        .control-btn.secondary:hover {
            background: var(--silver);
            color: var(--dark);
        }

        .footer {
            text-align: center;
            opacity: 0;
            animation: fadeIn 1s ease-out 1.5s forwards;
        }

        .hint {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        @keyframes glitch {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-2px); }
            40% { transform: translateX(2px); }
            60% { transform: translateX(-1px); }
            80% { transform: translateX(1px); }
        }

        .animate-glitch {
            animation: glitch 2s infinite;
        }

        @media (max-width: 768px) {
            .overlay { padding: 20px; }
            .title { font-size: 1.6rem; }
            .subtitle { font-size: 0.75rem; }
            .controls { gap: 10px; }
            .control-btn { padding: 10px 20px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="overlay">
        <div class="header">
            <h1 class="title">TIME FOLD</h1>
            <p class="subtitle">时间折叠相机</p>
        </div>

        <div class="camera-container">
            <div class="camera-frame">
                <div class="camera-view" id="cameraView">
                    <div class="upload-placeholder" id="uploadPlaceholder">
                        <div class="upload-icon">📷</div>
                        <div class="upload-text">点击上传照片</div>
                    </div>
                    <img id="photoPreview" class="photo-preview" src="" alt="Preview">
                    
                    <div class="time-layers">
                        <div class="time-layer layer-past" id="layerPast"></div>
                        <div class="time-layer layer-future" id="layerFuture"></div>
                    </div>

                    <div class="fold-lines">
                        <div class="fold-line left" id="foldLineLeft"></div>
                        <div class="fold-line right" id="foldLineRight"></div>
                    </div>

                    <div class="layer-labels">
                        <div class="layer-label label-past" id="labelPast">PAST 10Y</div>
                        <div class="layer-label label-present" id="labelPresent">NOW</div>
                        <div class="layer-label label-future" id="labelFuture">FUTURE 10Y</div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <label class="control-btn" for="photoInput">上传照片</label>
                <input type="file" id="photoInput" accept="image/*">
                <button class="control-btn secondary" id="foldBtn">展开时间</button>
                <button class="control-btn secondary" id="resetBtn">重置</button>
            </div>        </div>

        <div class="footer">
            <p class="hint">一张照片，三个时刻</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const photoInput = document.getElementById('photoInput');
        const photoPreview = document.getElementById('photoPreview');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const cameraView = document.getElementById('cameraView');
        const foldBtn = document.getElementById('foldBtn');
        const resetBtn = document.getElementById('resetBtn');
        const layerPast = document.getElementById('layerPast');
        const layerFuture = document.getElementById('layerFuture');
        const foldLineLeft = document.getElementById('foldLineLeft');
        const foldLineRight = document.getElementById('foldLineRight');
        const labelPast = document.getElementById('labelPast');
        const labelPresent = document.getElementById('labelPresent');
        const labelFuture = document.getElementById('labelFuture');

        let width, height;
        const particles = [];
        const maxParticles = 100;
        let isFolded = false;
        let photoLoaded = false;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }

        function initParticles() {
            particles.length = 0;
            for (let i = 0; i < maxParticles; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 3 + 1,
                    opacity: Math.random() * 0.5 + 0.1,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    hue: Math.random() > 0.5 ? 45 : 195
                });
            }
        }

        function updateParticles() {
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height;
                if (p.y > height) p.y = 0;
            });
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${p.hue}, 100%, 70%, ${p.opacity})`;
                ctx.fill();
            });
        }

        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 15, 0.1)';
            ctx.fillRect(0, 0, width, height);
            updateParticles();
            drawParticles();
            requestAnimationFrame(animate);
        }

        cameraView.addEventListener('click', () => {
            if (!photoLoaded) {
                photoInput.click();
            }
        });

        photoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    photoPreview.src = event.target.result;
                    photoPreview.classList.add('active');
                    uploadPlaceholder.style.display = 'none';
                    photoLoaded = true;
                    foldBtn.classList.add('show');
                };
                reader.readAsDataURL(file);
            }
        });

        foldBtn.addEventListener('click', () => {
            if (!photoLoaded) return;
            isFolded = !isFolded;

            const timeLayers = document.querySelector('.time-layers');

            if (isFolded) {
                foldBtn.textContent = '折叠时间';
                timeLayers.classList.add('active');
                layerPast.classList.add('active');
                layerFuture.classList.add('active');
                foldLineLeft.classList.add('active');
                foldLineRight.classList.add('active');
                labelPast.classList.add('active');
                labelPresent.classList.add('active');
                labelFuture.classList.add('active');
                createPastEffect();
                createFutureEffect();
            } else {
                foldBtn.textContent = '展开时间';
                timeLayers.classList.remove('active');
                layerPast.classList.remove('active');
                layerFuture.classList.remove('active');
                foldLineLeft.classList.remove('active');
                foldLineRight.classList.remove('active');
                labelPast.classList.remove('active');
                labelPresent.classList.remove('active');
                labelFuture.classList.remove('active');
            }
        });

        resetBtn.addEventListener('click', () => {
            photoInput.value = '';
            photoPreview.src = '';
            photoPreview.classList.remove('active');
            uploadPlaceholder.style.display = 'block';
            photoLoaded = false;
            isFolded = false;
            foldBtn.textContent = '展开时间';
            foldBtn.classList.remove('show');
            document.querySelector('.time-layers').classList.remove('active');
            layerPast.classList.remove('active');
            layerFuture.classList.remove('active');
            foldLineLeft.classList.remove('active');
            foldLineRight.classList.remove('active');
            labelPast.classList.remove('active');
            labelPresent.classList.remove('active');
            labelFuture.classList.remove('active');
            layerPast.innerHTML = '';
            layerFuture.innerHTML = '';
        });

        function createPastEffect() {
            layerPast.innerHTML = '';

            const vignette = document.createElement('div');
            vignette.style.position = 'absolute';
            vignette.style.top = '0'; vignette.style.left = '0';
            vignette.style.width = '100%'; vignette.style.height = '100%';
            vignette.style.background = 'radial-gradient(circle, transparent 30%, rgba(139, 69, 19, 0.5) 100%)';
            layerPast.appendChild(vignette);

            const scratches = document.createElement('div');
            scratches.style.position = 'absolute';
            scratches.style.top = '0'; scratches.style.left = '0';
            scratches.style.width = '100%'; scratches.style.height = '100%';
            scratches.style.backgroundImage = `linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.1) 50%, transparent 100%), linear-gradient(180deg, rgba(0,0,0,0.05) 0%, transparent 100%)`;
            scratches.style.backgroundSize = '100% 2px, 2px 100%';
            layerPast.appendChild(scratches);

            const sepia = document.createElement('div');
            sepia.style.position = 'absolute';
            sepia.style.top = '0'; sepia.style.left = '0';
            sepia.style.width = '100%'; sepia.style.height = '100%';
            sepia.style.background = 'rgba(160, 110, 60, 0.2)';
            layerPast.appendChild(sepia);
        }

        function createFutureEffect() {
            layerFuture.innerHTML = '';

            const scanlines = document.createElement('div');
            scanlines.style.position = 'absolute';
            scanlines.style.top = '0'; scanlines.style.left = '0';
            scanlines.style.width = '100%'; scanlines.style.height = '100%';
            scanlines.style.background = 'repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 252, 0.03) 2px, rgba(0, 255, 252, 0.03) 4px)';
            layerFuture.appendChild(scanlines);

            const glow = document.createElement('div');
            glow.style.position = 'absolute';
            glow.style.top = '0'; glow.style.left = '0';
            glow.style.width = '100%'; glow.style.height = '100%';
            glow.style.boxShadow = 'inset 0 0 100px rgba(0, 255, 252, 0.1)';
            layerFuture.appendChild(glow);

            const glitch = document.createElement('div');
            glitch.style.position = 'absolute';
            glitch.style.top = '0'; glitch.style.left = '0';
            glitch.style.width = '100%'; glitch.style.height = '100%';
            glitch.style.background = 'linear-gradient(90deg, transparent 0%, rgba(255, 0, 255, 0.05) 50%, transparent 100%)';
            glitch.classList.add('animate-glitch');
            layerFuture.appendChild(glitch);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
