<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>情绪调色盘 · 心情歌单</title>
    <style>
        /* ----- 全局重置 & 字体 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f9f3e8 0%, #f0e6d8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 247, 240, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 30px 24px 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 8px 16px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #3d2c1e;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        h1 span {
            background: #d9c8b2;
            padding: 0 12px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 400;
            color: #4d3a2a;
        }
        .subhead {
            color: #7a6856;
            font-size: 15px;
            margin-bottom: 28px;
            border-left: 3px solid #d9b8a0;
            padding-left: 14px;
            font-weight: 400;
        }

        /* ----- 色块选择区 ----- */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }
        .color-btn {
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            position: relative;
        }
        .color-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.12);
        }
        .color-btn:active {
            transform: scale(0.95);
        }
        .color-btn.active {
            border-color: #2d1f14;
            outline: 2px solid #fff;
            outline-offset: 2px;
            transform: scale(1.04);
        }
        /* 每个色块的颜色 */
        .color-btn[data-color="red"] { background: #e74c3c; }
        .color-btn[data-color="orange"] { background: #f39c12; }
        .color-btn[data-color="yellow"] { background: #f1c40f; }
        .color-btn[data-color="green"] { background: #2ecc71; }
        .color-btn[data-color="blue"] { background: #3498db; }
        .color-btn[data-color="purple"] { background: #9b59b6; }

        /* 色块下方小标签（情绪名） */
        .color-label {
            display: flex;
            justify-content: space-around;
            margin-top: -20px;
            margin-bottom: 28px;
            font-size: 13px;
            color: #5d4b38;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .color-label span {
            width: 14%;
            text-align: center;
        }

        /* ----- 结果卡片区 ----- */
        .result-panel {
            background: #ffffffd9;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 24px 20px 20px;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.8), 0 8px 20px rgba(0,0,0,0.06);
            border: 1px solid rgba(255,255,255,0.6);
            min-height: 200px;
            transition: all 0.4s ease;
        }

        .emotion-tag {
            display: inline-block;
            background: #eee3d8;
            padding: 4px 18px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            color: #3d2c1e;
            margin-bottom: 16px;
        }

        .song-list {
            list-style: none;
            margin: 16px 0 12px;
        }
        .song-list li {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #ede3d9;
            font-size: 15px;
        }
        .song-list li:last-child {
            border-bottom: none;
        }
        .song-list .num {
            width: 28px;
            color: #b09a86;
            font-weight: 300;
            font-size: 14px;
        }
        .song-list .title {
            flex: 1;
            font-weight: 500;
            color: #2d1f14;
        }
        .song-list .artist {
            color: #8e7a68;
            font-size: 13px;
            margin-left: 8px;
        }

        /* 心情色卡 */
        .mood-card {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 2px dashed #e2d4c8;
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }
        .color-swatch {
            width: 70px;
            height: 70px;
            border-radius: 24px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.10);
            transition: background 0.3s ease;
            flex-shrink: 0;
        }
        .mood-text {
            flex: 1;
        }
        .mood-text .mood-name {
            font-size: 22px;
            font-weight: 600;
            color: #2d1f14;
        }
        .mood-text .mood-sub {
            font-size: 14px;
            color: #8a7766;
            margin-top: 4px;
        }
        .share-hint {
            font-size: 13px;
            color: #b09a86;
            background: #f4ede7;
            padding: 4px 14px;
            border-radius: 40px;
            display: inline-block;
            margin-top: 6px;
        }

        /* 默认占位状态 */
        .placeholder-text {
            color: #b8a696;
            font-size: 15px;
            text-align: center;
            padding: 20px 0;
        }

        /* 小按钮 */
        .btn-reset {
            background: transparent;
            border: 1px solid #d9c8b8;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 13px;
            color: #5d4b38;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        .btn-reset:hover {
            background: #d9c8b8;
            color: #2d1f14;
        }

        /* 响应式微调 */
        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            .color-grid { gap: 8px; }
            .color-btn { border-radius: 16px; }
            .color-label span { font-size: 11px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>
        🎨 情绪调色盘
        <span>v0.1</span>
    </h1>
    <div class="subhead">选一种颜色 · 匹配今日心情歌单</div>

    <!-- 色块网格 -->
    <div class="color-grid" id="colorGrid">
        <div class="color-btn" data-color="red" data-emotion="激情" data-songs='[{"title":"Uptown Funk","artist":"Mark Ronson"},{"title":"Can‘t Stop","artist":"Red Hot Chili Peppers"},{"title":"Believer","artist":"Imagine Dragons"}]'></div>
        <div class="color-btn" data-color="orange" data-emotion="活力" data-songs='[{"title":"Happy","artist":"Pharrell Williams"},{"title":"Walking on Sunshine","artist":"Katrina & The Waves"},{"title":"Good as Hell","artist":"Lizzo"}]'></div>
        <div class="color-btn" data-color="yellow" data-emotion="温暖" data-songs='[{"title":"Here Comes the Sun","artist":"The Beatles"},{"title":"Sunflower","artist":"Post Malone"},{"title":"Golden","artist":"Harry Styles"}]'></div>
        <div class="color-btn" data-color="green" data-emotion="平静" data-songs='[{"title":"Weightless","artist":"Marconi Union"},{"title":"River","artist":"Leon Bridges"},{"title":"Breathe","artist":"Telepopmusik"}]'></div>
        <div class="color-btn" data-color="blue" data-emotion="忧郁" data-songs='[{"title":"Someone Like You","artist":"Adele"},{"title":"The Night We Met","artist":"Lord Huron"},{"title":"Fix You","artist":"Coldplay"}]'></div>
        <div class="color-btn" data-color="purple" data-emotion="神秘" data-songs='[{"title":"Earned It","artist":"The Weeknd"},{"title":"Creep","artist":"Radiohead"},{"title":"Lose Yourself to Dance","artist":"Daft Punk"}]'></div>
    </div>

    <!-- 情绪标签 -->
    <div class="color-label">
        <span>🔥 激情</span>
        <span>⚡ 活力</span>
        <span>☀️ 温暖</span>
        <span>🌿 平静</span>
        <span>🌊 忧郁</span>
        <span>🌙 神秘</span>
    </div>

    <!-- 结果展示区 -->
    <div class="result-panel" id="resultPanel">
        <div id="resultContent">
            <div class="placeholder-text">
                👆 点击上方任意色块<br />
                生成你的专属歌单 & 心情色卡
            </div>
        </div>
    </div>

    <div style="text-align: right; margin-top: 12px;">
        <button class="btn-reset" id="resetBtn">⟲ 清空选择</button>
    </div>
</div>

<script>
    (function() {
        const colorBtns = document.querySelectorAll('.color-btn');
        const resultContent = document.getElementById('resultContent');
        const resetBtn = document.getElementById('resetBtn');

        // 存储当前激活的色块
        let activeBtn = null;

        // 渲染结果
        function renderResult(emotion, songs, colorHex) {
            // 构建歌单列表 HTML
            let songsHtml = '';
            songs.forEach((song, index) => {
                songsHtml += `
                    <li>
                        <span class="num">${index + 1}</span>
                        <span class="title">${song.title}</span>
                        <span class="artist">${song.artist}</span>
                    </li>
                `;
            });

            // 情绪对应的中文描述（简单补充）
            const moodDesc = {
                '激情': '充满能量，点燃今天',
                '活力': '元气满满，动感十足',
                '温暖': '像午后阳光，治愈人心',
                '平静': '放空思绪，慢下来',
                '忧郁': '沉静而深刻，适合独处',
                '神秘': '迷离氛围，探索未知'
            };

            const html = `
                <div class="emotion-tag">🎯 当前情绪 · ${emotion}</div>
                <ul class="song-list">${songsHtml}</ul>
                <div class="mood-card">
                    <div class="color-swatch" style="background: ${colorHex};"></div>
                    <div class="mood-text">
                        <div class="mood-name">${emotion}</div>
                        <div class="mood-sub">${moodDesc[emotion] || '属于你的心情配色'}</div>
                        <div class="share-hint">📸 心情色卡 · 可截图分享</div>
                    </div>
                </div>
            `;
            resultContent.innerHTML = html;
        }

        // 处理点击色块
        function handleColorClick(e) {
            const btn = e.currentTarget;
            // 如果已经激活，不做变化（或者可以重新触发？这里允许重新点击刷新）
            // 移除其他所有 active
            colorBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeBtn = btn;

            // 读取数据
            const emotion = btn.dataset.emotion;
            const songsStr = btn.dataset.songs;
            let songs;
            try {
                songs = JSON.parse(songsStr);
            } catch (e) {
                songs = [];
            }
            // 获取色块背景色（十六进制）用于色卡
            const bgColor = window.getComputedStyle(btn).backgroundColor;
            // 将 rgb 转为 hex (简单转换)
            function rgbToHex(rgb) {
                const match = rgb.match(/\d+/g);
                if (!match) return '#e74c3c';
                const r = parseInt(match[0]);
                const g = parseInt(match[1]);
                const b = parseInt(match[2]);
                return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
            }
            const hex = rgbToHex(bgColor);

            renderResult(emotion, songs, hex);
        }

        // 绑定事件
        colorBtns.forEach(btn => {
            btn.addEventListener('click', handleColorClick);
        });

        // 重置
        resetBtn.addEventListener('click', function() {
            colorBtns.forEach(b => b.classList.remove('active'));
            activeBtn = null;
            resultContent.innerHTML = `
                <div class="placeholder-text">
                    👆 点击上方任意色块<br />
                    生成你的专属歌单 & 心情色卡
                </div>
            `;
        });

        // 默认不激活任何色块
    })();
</script>
</body>
</html>
