const AppRegistry={
    _apps:{
        terminal:{id:'terminal',name:'Terminal',icon:'\u2B1B',permissions:['app.terminal'],singleton:false},
        files:{id:'files',name:'File Manager',icon:'\uD83D\uDCC1',permissions:['app.files'],singleton:false},
        notepad:{id:'notepad',name:'Notepad',icon:'\uD83D\uDCDD',permissions:['app.notepad'],singleton:false},
        settings:{id:'settings',name:'Settings',icon:'\u2699\uFE0F',permissions:['app.settings.view'],singleton:true},
        taskmgr:{id:'taskmgr',name:'Task Manager',icon:'\uD83D\uDCCA',permissions:['app.taskmgr'],singleton:true},
        users:{id:'users',name:'User Manager',icon:'\uD83D\uDC65',permissions:['app.users'],singleton:true,adminOnly:true},
        tenants:{id:'tenants',name:'Tenant Manager',icon:'\uD83C\uDFE2',permissions:['app.tenants'],singleton:true,adminOnly:true},
        about:{id:'about',name:'About CloudOS',icon:'\u2139\uFE0F',permissions:['app.about'],singleton:true}
    },
    getAll(){ return Object.values(this._apps); },
    canLaunch(appId){
        const a=this._apps[appId];
        if(!a) return false;
        if(a.adminOnly && !AuthSystem.isAdmin()) return false;
        return AuthSystem.hasPermission(a.permissions[0]) || AuthSystem.hasPermission('*');
    },
    launch(appId, opts){
        opts=opts||{};
        if(!this.canLaunch(appId)){
            NotificationSystem.show('Access Denied','No permission to open '+appId,'error');
            return null;
        }
        const a=this._apps[appId];
        if(a.singleton){
            const existing=WindowManager.getByApp(appId);
            if(existing.length){ WindowManager.focus(existing[0].id); return existing[0].id; }
        }
        const winId=WindowManager.create(appId, a.name, a.icon, opts);
        AppLauncher.renderApp(appId, winId);
        return winId;
    }
};

// ========== AppLauncher ==========
const AppLauncher={
    renderApp(appId, winId){
        const body=document.getElementById(winId+'-body');
        if(!body) return;
        switch(appId){
            case 'terminal': this._renderTerminal(winId, body); break;
            case 'files': this._renderFileManager(winId, body); break;
            case 'notepad': this._renderNotepad(winId, body); break;
            case 'settings': this._renderSettings(winId, body); break;
            case 'taskmgr': this._renderTaskManager(winId, body); break;
            case 'users': this._renderUserManager(winId, body); break;
            case 'tenants': this._renderTenantManager(winId, body); break;
            case 'about': this._renderAbout(winId, body); break;
        }
    },

    // ========== 8. Terminal Enhanced ==========
    _renderTerminal(winId, body){
        body.innerHTML='<div class="terminal-body" id="'+winId+'-terminal"></div>';
        const term=body.querySelector('.terminal-body');
        const user=AuthSystem.getCurrentUser();
        const homeDir=user?user.homeDir:'/';
        let cwd=homeDir;
        let history=[];
        let hIdx=-1;

        const addLine=h=>{
            const l=document.createElement('div');
            l.className='terminal-line';
            l.innerHTML=h;
            term.appendChild(l);
        };

        const prompt=()=>{
            const il=document.createElement('div');
            il.className='terminal-input-line';
            il.innerHTML='<span class="prompt">'+(user?user.username:'root')+'@cloudos</span>:<span class="path">'+cwd+'</span>$ ';
            const inp=document.createElement('input');
            inp.className='terminal-input';
            inp.autocomplete='off';
            // 8. Tab auto-completion
            inp.addEventListener('keydown', e=>{
                if(e.key==='Tab'){
                    e.preventDefault();
                    const val=inp.value.trim();
                    const parts=val.split(/\s+/);
                    const partial=parts[parts.length-1]||'';
                    if(partial){
                        const dirPath=partial.includes('/')?partial.substring(0,partial.lastIndexOf('/')+1):cwd;
                        const prefix=partial.includes('/')?partial.substring(partial.lastIndexOf('/')+1):partial;
                        const items=FileSystem.readDir(dirPath)||[];
                        const matches=items.filter(i=>i.name.startsWith(prefix));
                        if(matches.length===1){
                            parts[parts.length-1]=(dirPath===cwd&&!partial.includes('/')?'':dirPath)+matches[0].name;
                            inp.value=parts.join(' ');
                        } else if(matches.length>1){
                            addLine('<span class="info">'+matches.map(m=>m.name).join('  ')+'</span>');
                        }
                    }
                    return;
                }
                if(e.key==='Enter'){
                    const cmd=inp.value.trim();
                    inp.disabled=true;
                    if(cmd){ history.unshift(cmd); hIdx=-1; }
                    exec(cmd);
                    prompt();
                } else if(e.key==='ArrowUp'){
                    e.preventDefault();
                    if(hIdx<history.length-1){ hIdx++; inp.value=history[hIdx]; }
                } else if(e.key==='ArrowDown'){
                    e.preventDefault();
                    if(hIdx>0){ hIdx--; inp.value=history[hIdx]; }
                    else{ hIdx=-1; inp.value=''; }
                }
            });
            il.appendChild(inp);
            term.appendChild(il);
            inp.focus();
            term.scrollTop=term.scrollHeight;
        };

        const resolvePath=p=>{
            if(!p) return cwd;
            if(p==='~') return homeDir;
            if(p.startsWith('/')) return p;
            return cwd+'/'+p;
        };

        const exec=cmd=>{
            if(!cmd) return;
            // 8. echo > file output redirection
            let redirectFile=null;
            let cmdToExec=cmd;
            const redirIdx=cmd.indexOf('>');
            if(redirIdx!==-1){
                redirectFile=cmd.substring(redirIdx+1).trim();
                cmdToExec=cmd.substring(0,redirIdx).trim();
            }
            const parts=cmdToExec.split(/\s+/);
            const c=parts[0].toLowerCase();
            const args=parts.slice(1);

            let output='';
            const addOutput=s=>{ output+=s+'\n'; };

            switch(c){
                case 'help':
                    addOutput('<span class="info">Commands: help ls cd pwd cat mkdir touch rm echo whoami ps kill clear uname date uptime df free logout cp mv grep head tail wc chmod find</span>');
                    break;
                case 'ls':{
                    const t=resolvePath(args[0]);
                    const items=FileSystem.readDir(t);
                    if(!items){ addOutput('<span class="error">ls: cannot access</span>'); break; }
                    addOutput(items.map(i=>i.type==='dir'?'<span style="color:var(--os-accent)">'+i.name+'/</span>':i.name).join('  '));
                    break;
                }
                case 'cd':{
                    if(!args[0]||args[0]==='~'){ cwd=homeDir; break; }
                    if(args[0]==='..'){
                        const p=cwd.split('/').filter(Boolean); p.pop(); cwd='/'+p.join('/')||'/'; break;
                    }
                    const t=resolvePath(args[0]);
                    if(FileSystem.getNode(t)&&FileSystem.getNode(t).type==='dir') cwd=t;
                    else addOutput('<span class="error">cd: no such directory</span>');
                    break;
                }
                case 'pwd': addOutput(cwd); break;
                case 'cat':{
                    if(!args[0]){ addOutput('<span class="error">cat: missing operand</span>'); break; }
                    const t=resolvePath(args[0]);
                    const f=FileSystem.readFile(t);
                    if(!f){ addOutput('<span class="error">cat: not found</span>'); break; }
                    addOutput(f.content.replace(/</g,'&lt;').replace(/\n/g,'<br>'));
                    break;
                }
                case 'mkdir':{
                    if(!args[0]){ addOutput('<span class="error">mkdir: missing operand</span>'); break; }
                    const t=resolvePath(args[0]);
                    FileSystem.createDir(t, user.username)?addOutput('<span class="info">Created</span>'):addOutput('<span class="error">Failed</span>');
                    break;
                }
                case 'touch':{
                    if(!args[0]){ addOutput('<span class="error">touch: missing operand</span>'); break; }
                    const t=resolvePath(args[0]);
                    FileSystem.writeFile(t, '', user.username)?addOutput('<span class="info">Created</span>'):addOutput('<span class="error">Failed</span>');
                    break;
                }
                case 'rm':{
                    if(!args[0]){ addOutput('<span class="error">rm: missing operand</span>'); break; }
                    const t=resolvePath(args[0]);
                    FileSystem.deleteNode(t)?addOutput('<span class="info">Removed</span>'):addOutput('<span class="error">Failed</span>');
                    break;
                }
                case 'echo':{
                    const text=args.join(' ').replace(/</g,'&lt;');
                    if(redirectFile){
                        const fp=resolvePath(redirectFile);
                        FileSystem.writeFile(fp, text.replace(/<br>/g,'\n'), user.username);
                        addOutput('<span class="info">Output redirected to '+redirectFile+'</span>');
                    } else {
                        addOutput(text);
                    }
                    break;
                }
                case 'whoami': addOutput(user?user.username+' ('+user.role+') ['+user.tenantId+']':'Not logged in'); break;
                case 'ps':{
                    const ps=ProcessManager.getAll();
                    let o='<span class="info">  PID  NAME                STATUS     CPU%  MEM</span><br>';
                    ps.forEach(p=>{ o+='  '+String(p.pid).padEnd(5)+' '+p.name.padEnd(20)+' '+p.status.padEnd(10)+' '+p.cpu.toFixed(1).padEnd(6)+' '+p.memory+'MB<br>'; });
                    addOutput(o);
                    break;
                }
                // 5. Terminal kill with window association
                case 'kill':{
                    const pid=parseInt(args[0]);
                    if(isNaN(pid)){ addOutput('<span class="error">kill: invalid PID</span>'); break; }
                    const found=WindowManager.findByPid(pid);
                    if(found){ WindowManager.close(found.windowId); addOutput('<span class="info">Killed '+pid+' and closed window</span>'); }
                    else if(ProcessManager.kill(pid)){ addOutput('<span class="info">Killed '+pid+'</span>'); }
                    else { addOutput('<span class="error">not found</span>'); }
                    break;
                }
                case 'clear': term.innerHTML=''; return;
                case 'uname': addOutput('CloudOS 2.0.0 Web-Kernel x86_64 JavaScript/V8'); break;
                case 'date': addOutput(new Date().toLocaleString('zh-CN')); break;
                case 'uptime': addOutput('up '+Kernel.getUptime()+', 1 user'); break;
                case 'df':{
                    const n=Object.keys(FileSystem._fs).length;
                    addOutput('<span class="info">cloudfs  10GB  '+(n*.1).toFixed(1)+'GB  '+(10-n*.1).toFixed(1)+'GB  '+Math.min(99,n)+'%  /</span>');
                    break;
                }
                case 'free': addOutput('<span class="info">Mem: '+MemoryManager.total+'MB  '+MemoryManager.getUsed()+'MB  '+(MemoryManager.total-MemoryManager.getUsed())+'MB</span>'); break;
                // 8. cp
                case 'cp':{
                    if(args.length<2){ addOutput('<span class="error">cp: missing operand</span>'); break; }
                    const src=resolvePath(args[0]);
                    const dst=resolvePath(args[1]);
                    const f=FileSystem.readFile(src);
                    if(!f){ addOutput('<span class="error">cp: '+args[0]+': not found</span>'); break; }
                    FileSystem.writeFile(dst, f.content, user.username)?addOutput('<span class="info">Copied</span>'):addOutput('<span class="error">Failed</span>');
                    break;
                }
                // 8. mv
                case 'mv':{
                    if(args.length<2){ addOutput('<span class="error">mv: missing operand</span>'); break; }
                    const src=resolvePath(args[0]);
                    const dst=resolvePath(args[1]);
                    const f=FileSystem.readFile(src);
                    if(!f){ addOutput('<span class="error">mv: '+args[0]+': not found</span>'); break; }
                    if(FileSystem.writeFile(dst, f.content, user.username)){ FileSystem.deleteNode(src); addOutput('<span class="info">Moved</span>'); }
                    else { addOutput('<span class="error">Failed</span>'); }
                    break;
                }
                // 8. grep
                case 'grep':{
                    if(args.length<2){ addOutput('<span class="error">grep: missing operand</span>'); break; }
                    const pattern=args[0];
                    const fPath=resolvePath(args[1]);
                    const f=FileSystem.readFile(fPath);
                    if(!f){ addOutput('<span class="error">grep: '+args[1]+': not found</span>'); break; }
                    const lines=f.content.split('\n').filter(l=>l.includes(pattern));
                    if(lines.length===0) addOutput('<span class="info">(no match)</span>');
                    else addOutput(lines.join('<br>').replace(/</g,'&lt;'));
                    break;
                }
                // 8. head
                case 'head':{
                    if(!args[0]){ addOutput('<span class="error">head: missing operand</span>'); break; }
                    const f=FileSystem.readFile(resolvePath(args[0]));
                    if(!f){ addOutput('<span class="error">head: not found</span>'); break; }
                    const n=parseInt(args[1])||10;
                    addOutput(f.content.split('\n').slice(0,n).join('<br>').replace(/</g,'&lt;'));
                    break;
                }
                // 8. tail
                case 'tail':{
                    if(!args[0]){ addOutput('<span class="error">tail: missing operand</span>'); break; }
                    const f=FileSystem.readFile(resolvePath(args[0]));
                    if(!f){ addOutput('<span class="error">tail: not found</span>'); break; }
                    const n=parseInt(args[1])||10;
                    addOutput(f.content.split('\n').slice(-n).join('<br>').replace(/</g,'&lt;'));
                    break;
                }
                // 8. wc
                case 'wc':{
                    if(!args[0]){ addOutput('<span class="error">wc: missing operand</span>'); break; }
                    const f=FileSystem.readFile(resolvePath(args[0]));
                    if(!f){ addOutput('<span class="error">wc: not found</span>'); break; }
                    const lines=f.content.split('\n').length;
                    const words=f.content.split(/\s+/).filter(Boolean).length;
                    const chars=f.content.length;
                    addOutput('<span class="info">  '+lines+'  '+words+'  '+chars+' '+args[0]+'</span>');
                    break;
                }
                // 8. chmod
                case 'chmod':{
                    if(args.length<2){ addOutput('<span class="error">chmod: missing operand</span>'); break; }
                    const node=FileSystem.getNode(resolvePath(args[1]));
                    if(!node){ addOutput('<span class="error">chmod: not found</span>'); break; }
                    node.permissions=args[0];
                    FileSystem._persist();
                    addOutput('<span class="info">Permissions changed to '+args[0]+'</span>');
                    break;
                }
                // 8. find
                case 'find':{
                    const searchDir=args[0]?resolvePath(args[0]):cwd;
                    const namePattern=args.indexOf('-name')!==-1?args[args.indexOf('-name')+1]:null;
                    const results=[];
                    for(const path of Object.keys(FileSystem._fs)){
                        if(path.startsWith(searchDir)){
                            if(!namePattern||path.endsWith(namePattern)) results.push(path);
                        }
                    }
                    addOutput(results.join('<br>')||'<span class="info">No results</span>');
                    break;
                }
                case 'logout': CloudOS.logout(); return;
                default: addOutput('<span class="error">'+c+': command not found. Type help.</span>');
            }
            // Handle redirection for non-echo commands
            if(redirectFile && c!=='echo'){
                const fp=resolvePath(redirectFile);
                const plainText=output.replace(/<[^>]*>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').trim();
                FileSystem.writeFile(fp, plainText, user.username);
                addOutput('<span class="info">Output redirected to '+redirectFile+'</span>');
            }
            if(output) addLine(output);
        };

        addLine('<span class="info">CloudOS Terminal v2.0 - Type help for commands</span>');
        addLine('');
        prompt();
        body.addEventListener('click', ()=>{
            const inp=term.querySelector('.terminal-input:not([disabled])');
            if(inp) inp.focus();
        });
    },

    // ========== 7. File Manager Enhanced ==========
    _renderFileManager(winId, body){
        const user=AuthSystem.getCurrentUser();
        let currentPath=user?user.homeDir:'/';
        let viewMode='grid';
        const self=this;

        // 4. Listen for fs.change to auto-refresh
        const fsHandler=()=>{ render(); };
        EventBus.on('fs.change', fsHandler);

        const render=()=>{
            const items=FileSystem.readDir(currentPath)||[];
            const pathParts=currentPath.split('/').filter(Boolean);

            body.innerHTML='<div class="file-manager"><div style="display:flex"><div class="fm-sidebar">'+
                '<div class="fm-sidebar-item '+(currentPath===(user?user.homeDir:'/')?'active':'')+'" data-path="'+(user?user.homeDir:'/')+'"><span class="icon">\uD83C\uDFE0</span> Home</div>'+
                '<div class="fm-sidebar-item '+(currentPath==='/shared'?'active':'')+'" data-path="/shared"><span class="icon">\uD83D\uDCC2</span> Shared</div>'+
                '<div class="fm-sidebar-item '+(currentPath==='/apps'?'active':'')+'" data-path="/apps"><span class="icon">\uD83D\uDCE6</span> Applications</div>'+
                (AuthSystem.isAdmin()?'<div class="fm-sidebar-item '+(currentPath==='/system'?'active':'')+'" data-path="/system"><span class="icon">\uD83D\uDD27</span> System</div>':'')+
                '</div><div style="flex:1;display:flex;flex-direction:column">'+
                '<div class="fm-address-bar"><input type="text" id="'+winId+'-addr" value="'+currentPath+'"><button id="'+winId+'-addr-go">Go</button></div>'+
                '<div class="fm-path-bar"><span class="segment" data-path="/">/</span>'+
                pathParts.map((p,i)=>'<span class="separator">/</span><span class="segment" data-path="/'+pathParts.slice(0,i+1).join('/')+'">'+p+'</span>').join('')+
                '</div>'+
                '<div class="window-toolbar">'+
                '<button id="'+winId+'-up">\u2B06 Up</button>'+
                '<button class="'+(viewMode==='grid'?'active':'')+'" id="'+winId+'-grid">\u229E</button>'+
                '<button class="'+(viewMode==='list'?'active':'')+'" id="'+winId+'-list">\u2630</button>'+
                '<button id="'+winId+'-newfolder">\uD83D\uDCC1 New Folder</button>'+
                '<button id="'+winId+'-newfile">\uD83D\uDCC4 New File</button>'+
                '</div>'+
                '<div class="fm-content">'+
                (viewMode==='grid'?
                    '<div class="fm-grid">'+items.map(i=>'<div class="fm-item" data-path="'+i.path+'" data-type="'+i.type+'"><span class="icon">'+(i.type==='dir'?'\uD83D\uDCC1':self._fIcon(i.name))+'</span><span class="name" title="'+i.name+'">'+i.name+'</span></div>').join('')+(items.length===0?'<div style="padding:40px;text-align:center;color:var(--os-text-muted);grid-column:1/-1">Empty folder</div>':'')+'</div>'
                :
                    '<div class="fm-list"><div class="fm-list-item" style="font-weight:600;font-size:11px;color:var(--os-text-muted)"><span class="icon"></span><span class="name">Name</span><span class="size">Size</span><span class="modified">Modified</span></div>'+
                    items.map(i=>'<div class="fm-list-item" data-path="'+i.path+'" data-type="'+i.type+'"><span class="icon">'+(i.type==='dir'?'\uD83D\uDCC1':self._fIcon(i.name))+'</span><span class="name">'+i.name+'</span><span class="size">'+self._fSize(i.size)+'</span><span class="modified">'+new Date(i.modified).toLocaleString('zh-CN')+'</span></div>').join('')+
                    (items.length===0?'<div style="padding:40px;text-align:center;color:var(--os-text-muted)">Empty folder</div>':'')+'</div>'
                )+
                '</div></div></div></div>';

            // 7. Address bar
            const addrInput=body.querySelector('#'+winId+'-addr');
            const addrGo=body.querySelector('#'+winId+'-addr-go');
            if(addrGo) addrGo.addEventListener('click', ()=>{
                const val=addrInput.value.trim();
                if(FileSystem.exists(val)&&FileSystem.getNode(val).type==='dir'){ currentPath=val; render(); }
            });
            if(addrInput) addrInput.addEventListener('keydown', e=>{ if(e.key==='Enter') addrGo.click(); });

            // Sidebar
            body.querySelectorAll('.fm-sidebar-item').forEach(el=>{
                el.addEventListener('click', ()=>{ currentPath=el.dataset.path; render(); });
            });
            // Path bar
            body.querySelectorAll('.fm-path-bar .segment').forEach(el=>{
                el.addEventListener('click', ()=>{ currentPath=el.dataset.path; render(); });
            });
            // Toolbar
            body.querySelector('#'+winId+'-up').addEventListener('click', ()=>{
                const p=currentPath.split('/').filter(Boolean); p.pop(); currentPath='/'+p.join('/')||'/'; render();
            });
            body.querySelector('#'+winId+'-grid').addEventListener('click', ()=>{ viewMode='grid'; render(); });
            body.querySelector('#'+winId+'-list').addEventListener('click', ()=>{ viewMode='list'; render(); });
            body.querySelector('#'+winId+'-newfolder').addEventListener('click', async()=>{
                const name=await DialogSystem.show({title:'New Folder', message:'Enter folder name:', inputLabel:'Folder name'});
                if(name){ FileSystem.createDir(currentPath+'/'+name, user.username); render(); NotificationSystem.show('Created','Folder created','success'); }
            });
            body.querySelector('#'+winId+'-newfile').addEventListener('click', async()=>{
                const name=await DialogSystem.show({title:'New File', message:'Enter file name:', inputLabel:'File name'});
                if(name){ FileSystem.writeFile(currentPath+'/'+name, '', user.username); render(); NotificationSystem.show('Created','File created','success'); }
            });

            // Item click, dblclick, and 7. right-click
            body.querySelectorAll('.fm-item,.fm-list-item').forEach(el=>{
                el.addEventListener('click', ()=>{
                    body.querySelectorAll('.fm-item,.fm-list-item').forEach(e2=>e2.classList.remove('selected'));
                    el.classList.add('selected');
                });
                el.addEventListener('dblclick', ()=>{
                    const p=el.dataset.path;
                    const t=el.dataset.type;
                    if(t==='dir'){ currentPath=p; render(); }
                    else {
                        const f=FileSystem.readFile(p);
                        if(f){
                            const nid=AppRegistry.launch('notepad',{width:600, height:400});
                            if(nid){
                                setTimeout(()=>{
                                    const nb=document.getElementById(nid+'-body');
                                    if(nb){
                                        const ta=nb.querySelector('.notepad-textarea');
                                        if(ta) ta.value=f.content;
                                        WindowManager.setTitle(nid, 'Notepad - '+p.split('/').pop());
                                        nb._filePath=p;
                                        nb._originalContent=f.content;
                                    }
                                }, 100);
                            }
                        }
                    }
                });
                // 7. Right-click context menu
                el.addEventListener('contextmenu', e=>{
                    e.preventDefault();
                    e.stopPropagation();
                    const itemType=el.dataset.type;
                    const itemName=el.dataset.path.split('/').pop();
                    ContextMenuManager.show(e.clientX, e.clientY, [
                        {label:'Open', icon:'\uD83D\uDCC2', action:()=>{
                            if(itemType==='dir'){ currentPath=el.dataset.path; render(); }
                            else { el.dispatchEvent(new Event('dblclick')); }
                        }},
                        {separator:true},
                        {label:'Rename', icon:'\u270F\uFE0F', action:()=>{ self._fmRename(winId, el.dataset.path, render); }},
                        {label:'Delete', icon:'\uD83D\uDDD1\uFE0F', action:()=>{ self._fmDelete(winId, el.dataset.path, render); }},
                        {separator:true},
                        {label:'Properties', icon:'\u2139\uFE0F', action:()=>{ self._fmProperties(winId, el.dataset.path); }}
                    ]);
                });
            });
        };
        render();
        // Cleanup
        const checkInterval=setInterval(()=>{
            if(!document.getElementById(winId)){ EventBus.off('fs.change', fsHandler); clearInterval(checkInterval); }
        }, 2000);
    },

    // 7. Rename
    _fmRename:async(winId, path, refreshFn)=>{
        const name=path.split('/').pop();
        const newName=await DialogSystem.show({title:'Rename', message:'New name for "'+name+'":', inputLabel:'New name', inputValue:name});
        if(newName && newName!==name){
            const parentPath=path.substring(0, path.lastIndexOf('/'))||'/';
            const node=FileSystem.getNode(path);
            if(node){
                const newPath=parentPath+'/'+newName;
                FileSystem._fs[newPath]=node;
                delete FileSystem._fs[path];
                const parent=FileSystem.getNode(parentPath);
                if(parent){ const idx=parent.children.indexOf(name); if(idx!==-1) parent.children[idx]=newName; }
                FileSystem._persist();
                FileSystem._emitChange(newPath, 'rename');
                refreshFn();
                NotificationSystem.show('Renamed','Renamed to '+newName,'success');
            }
        }
    },
    // 7. Delete with confirmation
    _fmDelete:async(winId, path, refreshFn)=>{
        const name=path.split('/').pop();
        const confirmed=await DialogSystem.show({title:'Delete', message:'Are you sure you want to delete "'+name+'"?', danger:true, confirmText:'Delete'});
        if(confirmed){ FileSystem.deleteNode(path); refreshFn(); NotificationSystem.show('Deleted','"'+name+'" deleted','success'); }
    },
    // 7. Properties dialog
    _fmProperties(winId, path){
        const node=FileSystem.getNode(path);
        if(!node) return;
        const name=path.split('/').pop();
        DialogSystem.show({title:'Properties - '+name, message:'<div style="text-align:left;font-size:13px;line-height:2"><strong>Name:</strong> '+name+'<br><strong>Type:</strong> '+(node.type==='dir'?'Directory':'File')+'<br><strong>Size:</strong> '+AppLauncher._fSize(node.size||0)+'<br><strong>Owner:</strong> '+node.owner+'<br><strong>Permissions:</strong> '+node.permissions+'<br><strong>Modified:</strong> '+new Date(node.modified).toLocaleString('zh-CN')+'</div>'});
    },

    _fIcon(n){ const e=n.split('.').pop().toLowerCase(); return {txt:'\uD83D\uDCC4',md:'\uD83D\uDCDD',json:'\uD83D\uDCCB',conf:'\u2699\uFE0F',log:'\uD83D\uDCDC',sys:'\uD83D\uDD27',png:'\uD83D\uDDBC\uFE0F',jpg:'\uD83D\uDDBC\uFE0F'}[e]||'\uD83D\uDCC4'; },
    _fSize(b){ if(!b) return '0 B'; if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(1)+' KB'; return (b/1048576).toFixed(1)+' MB'; },

    // ========== 3. Notepad with File Path Tracking ==========
    _renderNotepad(winId, body){
        body._filePath=null;
        body._originalContent='';
        body._unsaved=false;

        body.innerHTML='<div class="notepad-body"><div class="notepad-toolbar">'+
            '<button id="'+winId+'-np-new">New</button>'+
            '<button id="'+winId+'-np-save">Save</button>'+
            '<button id="'+winId+'-np-saveas">Save As</button>'+
            '<button id="'+winId+'-np-wrap">Word Wrap</button>'+
            '</div><textarea class="notepad-textarea" id="'+winId+'-textarea" placeholder="Start typing..."></textarea>'+
            '<div class="window-statusbar"><span id="'+winId+'-status">Ready</span><span id="'+winId+'-cc">Characters: 0</span></div></div>';

        const ta=body.querySelector('#'+winId+'-textarea');
        const cc=body.querySelector('#'+winId+'-cc');
        const status=body.querySelector('#'+winId+'-status');

        const updateTitle=()=>{
            const w=WindowManager.windows.get(winId);
            if(!w) return;
            let title='Notepad';
            if(body._filePath) title+=' - '+body._filePath.split('/').pop();
            else title+=' - Untitled';
            if(body._unsaved) title+=' [Unsaved]';
            WindowManager.setTitle(winId, title);
            w._unsaved=body._unsaved;
        };

        ta.addEventListener('input', ()=>{
            cc.textContent='Characters: '+ta.value.length;
            body._unsaved=(ta.value!==body._originalContent);
            status.textContent=body._unsaved?'Modified':'Ready';
            updateTitle();
        });

        body.querySelector('#'+winId+'-np-new').addEventListener('click', ()=>{
            if(body._unsaved){ if(!confirm('You have unsaved changes. Discard?')) return; }
            ta.value=''; body._filePath=null; body._originalContent=''; body._unsaved=false;
            status.textContent='Ready'; cc.textContent='Characters: 0'; updateTitle();
        });

        body.querySelector('#'+winId+'-np-save').addEventListener('click', ()=>{
            const u=AuthSystem.getCurrentUser();
            let path=body._filePath;
            if(!path) path=u.homeDir+'/Documents/untitled.txt';
            FileSystem.writeFile(path, ta.value, u.username);
            body._filePath=path; body._originalContent=ta.value; body._unsaved=false;
            status.textContent='Saved: '+new Date().toLocaleTimeString('zh-CN');
            updateTitle();
            NotificationSystem.show('Saved','Saved to '+path,'success');
        });

        body.querySelector('#'+winId+'-np-saveas').addEventListener('click', async()=>{
            const u=AuthSystem.getCurrentUser();
            const defaultName=body._filePath?body._filePath.split('/').pop():'untitled.txt';
            const name=await DialogSystem.show({title:'Save As', message:'Save file as:', inputLabel:'File name', inputValue:defaultName});
            if(name){
                const path=u.homeDir+'/Documents/'+name;
                FileSystem.writeFile(path, ta.value, u.username);
                body._filePath=path; body._originalContent=ta.value; body._unsaved=false;
                status.textContent='Saved: '+new Date().toLocaleTimeString('zh-CN');
                updateTitle();
                NotificationSystem.show('Saved','Saved to '+path,'success');
            }
        });

        body.querySelector('#'+winId+'-np-wrap').addEventListener('click', ()=>{
            ta.style.whiteSpace=ta.style.whiteSpace==='nowrap'?'pre-wrap':'nowrap';
        });

        updateTitle();
    },

    _changePwd:async()=>{

    // ========== 10. Task Manager Enhanced ==========
    _renderTaskManager(winId, body){
        let tab='processes';
        let ci;
        const render=()=>{
            ProcessManager.simulateCPU();
            const procs=ProcessManager.getAll();
            const cpuP=procs.reduce((s,p)=>s+p.cpu,0)/Math.max(1,procs.length);
            const memP=MemoryManager.getUsagePercent();
            body.innerHTML='<div class="task-manager"><div class="tm-header"><div class="tm-perf"><div class="tm-perf-item"><div class="value cpu">'+Math.min(99,cpuP).toFixed(0)+'%</div><div class="label">CPU</div></div><div class="tm-perf-item"><div class="value mem">'+memP+'%</div><div class="label">Memory</div></div><div class="tm-perf-item"><div class="value">'+procs.length+'</div><div class="label">Processes</div></div></div></div><div class="tm-tabs"><div class="tm-tab '+(tab==='processes'?'active':'')+'" data-tab="processes">Processes</div><div class="tm-tab '+(tab==='performance'?'active':'')+'" data-tab="performance">Performance</div></div><div class="tm-content">'+
                (tab==='processes'?
                    '<table class="tm-table"><thead><tr><th>Name</th><th>PID</th><th>Status</th><th>CPU</th><th>Memory</th><th>User</th><th></th></tr></thead><tbody>'+procs.map(p=>'<tr><td>'+p.name+'</td><td class="pid">'+p.pid+'</td><td><span class="status '+p.status+'">'+p.status+'</span></td><td class="cpu">'+p.cpu.toFixed(1)+'%</td><td class="mem">'+p.memory+'MB</td><td style="font-size:12px;color:var(--os-text-muted)">'+(p.userId||'system')+'</td><td>'+(p.status==='running'?'<button class="tm-action-btn suspend" data-pid="'+p.pid+'" data-action="suspend">\u23F8</button>':'<button class="tm-action-btn resume" data-pid="'+p.pid+'" data-action="resume">\u25B6</button>')+'<button class="tm-kill-btn" data-pid="'+p.pid+'">End</button></td></tr>').join('')+'</tbody></table>'
                :
                    '<div style="padding:20px"><h3 style="margin-bottom:16px">CPU Usage</h3><div style="height:120px;background:var(--os-glass);border-radius:var(--os-radius-sm);display:flex;align-items:end;padding:8px;gap:2px">'+Array.from({length:40}, ()=>'<div style="flex:1;background:var(--os-accent);height:'+(Math.random()*80+10)+'%;border-radius:2px 2px 0 0;opacity:.7"></div>').join('')+'</div><h3 style="margin:20px 0 16px">Memory Usage</h3><div style="height:24px;background:var(--os-glass);border-radius:12px;overflow:hidden"><div style="height:100%;width:'+memP+'%;background:linear-gradient(90deg,var(--os-accent-secondary),var(--os-accent));border-radius:12px;transition:width .5s"></div></div><div style="margin-top:8px;font-size:12px;color:var(--os-text-muted)">'+MemoryManager.getUsed()+'MB / '+MemoryManager.total+'MB ('+memP+'%)</div></div>'
                )+'</div></div>';
            body.querySelectorAll('.tm-tab').forEach(el=>{ el.addEventListener('click', ()=>{ tab=el.dataset.tab; render(); }); });
            // 10. Suspend/Resume
            body.querySelectorAll('.tm-action-btn').forEach(el=>{
                el.addEventListener('click', ()=>{
                    const pid=parseInt(el.dataset.pid);
                    const action=el.dataset.action;
                    if(action==='suspend'){ ProcessManager.suspend(pid); NotificationSystem.show('Suspended','Process '+pid+' suspended','warning'); }
                    else { ProcessManager.resume(pid); NotificationSystem.show('Resumed','Process '+pid+' resumed','success'); }
                    render();
                });
            });
            // 10. Kill with confirmation
            body.querySelectorAll('.tm-kill-btn').forEach(el=>{
                el.addEventListener('click', async()=>{
                    const pid=parseInt(el.dataset.pid);
                    const confirmed=await DialogSystem.show({title:'Kill Process', message:'Are you sure you want to terminate process '+pid+'?', danger:true, confirmText:'Kill Process'});
                    if(confirmed){
                        const found=WindowManager.findByPid(pid);
                        if(found) WindowManager.close(found.windowId);
                        ProcessManager.kill(pid);
                        NotificationSystem.show('Killed','Process '+pid+' terminated','success');
                        render();
                    }
                });
            });
        };
        render();
        ci=setInterval(()=>{ if(!document.getElementById(winId)){ clearInterval(ci); return; } render(); }, 2000);
    },

    // ========== 9. User Manager Enhanced ==========
    _renderUserManager(winId, body){
        const render=()=>{
            const users=AuthSystem.getAllUsers();
            const tenant=TenantSystem.getCurrentTenant();
            const currentUser=AuthSystem.getCurrentUser();
            body.innerHTML='<div class="user-manager"><div class="um-header"><h2>\uD83D\uDC65 User Management</h2><button class="um-add-btn" id="'+winId+'-adduser">+ Add User</button></div><div style="margin-bottom:16px;padding:12px 16px;background:var(--os-glass);border-radius:var(--os-radius-sm);font-size:13px;color:var(--os-text-secondary)">Current Tenant: <strong style="color:var(--os-accent)">'+(tenant?tenant.name:'N/A')+'</strong> | Users: <strong>'+users.length+'</strong> / '+(tenant?tenant.maxUsers:'?')+' | Plan: <strong>'+(tenant?tenant.plan.toUpperCase():'N/A')+'</strong></div><div class="um-list">'+
                users.map(u=>{
                    const isSelf=currentUser && currentUser.username===u.username;
                    return '<div class="um-user"><div class="avatar '+u.role+'">'+u.avatar+'</div><div class="info"><div class="name">'+u.displayName+' <span class="permission-badge '+u.role+'">'+u.role.toUpperCase()+'</span></div><div class="role">@'+u.username+' | Tenant: '+u.tenantId+'</div><div class="tenant">Last login: '+(u.lastLogin?new Date(u.lastLogin).toLocaleString('zh-CN'):'Never')+'</div></div><div class="actions"><button class="um-action-btn" data-action="editrole" data-username="'+u.username+'">Edit Role</button>'+(isSelf?'':'<button class="um-action-btn" data-action="resetpwd" data-username="'+u.username+'">Reset Pwd</button>')+(isSelf?'':'<button class="um-action-btn danger" data-action="delete" data-username="'+u.username+'">Delete</button>')+'</div></div>';
                }).join('')+'</div></div>';
            body.querySelector('#'+winId+'-adduser').addEventListener('click', ()=>{ AppLauncher._addUser(winId); });
            body.querySelectorAll('.um-action-btn').forEach(el=>{
                el.addEventListener('click', ()=>{
                    const action=el.dataset.action;
                    const username=el.dataset.username;
                    if(action==='editrole') AppLauncher._editRole(winId, username);
                    else if(action==='delete') AppLauncher._delUser(winId, username);
                    else if(action==='resetpwd') AppLauncher._resetUserPwd(winId, username);
                });
            });
        };
        render();
    },

    _addUser:async(winId)=>{
        const u=await DialogSystem.show({title:'Add User', message:'Username:', inputLabel:'Username'});
        if(!u) return;
        const p=await DialogSystem.show({title:'Add User', message:'Password:', inputLabel:'Password'});
        if(!p) return;
        const d=await DialogSystem.show({title:'Add User', message:'Display name:', inputLabel:'Display Name', inputValue:u});
        const r=AuthSystem.createUser({username:u, password:p, displayName:d, role:'standard', tenantId:AuthSystem.getCurrentUser().tenantId});
        if(r.success){ NotificationSystem.show('Created','User created','success'); AppLauncher._renderUserManager(winId, document.getElementById(winId+'-body')); }
        else { NotificationSystem.show('Error',r.error,'error'); }
    },
    _editRole:async(winId, un)=>{
        const r=await DialogSystem.show({title:'Edit Role', message:'New role for @'+un+':', inputLabel:'Role (admin/standard/guest)', inputValue:AuthSystem._users[un].role});
        if(r && ['admin','standard','guest'].includes(r)){ AuthSystem.changeRole(un, r); NotificationSystem.show('Updated','@'+un+' is now '+r,'success'); AppLauncher._renderUserManager(winId, document.getElementById(winId+'-body')); }
    },
    _delUser:async(winId, un)=>{
        const currentUser=AuthSystem.getCurrentUser();
        if(currentUser && currentUser.username===un){ NotificationSystem.show('Error','Cannot delete yourself','error'); return; }
        const c=await DialogSystem.show({title:'Delete User', message:'Delete @'+un+'? Their home directory will also be removed.', danger:true, confirmText:'Delete'});
        if(c){
            const r=AuthSystem.deleteUser(un);
            if(r.success){ NotificationSystem.show('Deleted','User @'+un+' deleted','success'); AppLauncher._renderUserManager(winId, document.getElementById(winId+'-body')); }
            else { NotificationSystem.show('Error',r.error,'error'); }
        }
    },
    // 9. Password reset
    _resetUserPwd:async(winId, un)=>{
        const newPwd=await DialogSystem.show({title:'Reset Password', message:'Enter new password for @'+un+':', inputLabel:'New Password'});
        if(newPwd){
            const r=AuthSystem.resetPassword(un, newPwd);
            if(r.success) NotificationSystem.show('Success','Password for @'+un+' has been reset','success');
            else NotificationSystem.show('Error',r.error,'error');
        }
    },

const StartMenuManager={

        else m.classList.remove('show');

    render(){
        const user=AuthSystem.getCurrentUser();
        const apps=AppRegistry.getAll();
        document.getElementById('start-avatar').textContent=user.avatar;
        document.getElementById('start-username').textContent=user.displayName;
        document.getElementById('start-role').textContent=user.role.charAt(0).toUpperCase()+user.role.slice(1);

        pinned.innerHTML=apps.filter(a=>AppRegistry.canLaunch(a.id)).slice(0,8).map(a=>'<div class="start-app" data-app="'+a.id+'"><span class="icon">'+a.icon+'</span><span class="name">'+a.name+'</span></div>').join('');
        const all=document.getElementById('start-all-apps');
        all.innerHTML=apps.filter(a=>AppRegistry.canLaunch(a.id)).map(a=>'<div class="start-app" data-app="'+a.id+'"><span class="icon">'+a.icon+'</span><span class="name">'+a.name+'</span></div>').join('');
        document.querySelectorAll('.start-app').forEach(el=>{
            el.addEventListener('click', ()=>{ AppRegistry.launch(el.dataset.app); this.close(); });
        });
    }
};

// ========== ContextMenuManager ==========
const ContextMenuManager={
    show(x, y, items){
        const m=document.getElementById('context-menu');
        m.innerHTML=items.map(i=>
            i.separator?'<div class="context-separator"></div>':
            '<div class="context-item '+(i.disabled?'disabled':'')+'" data-action="'+(i.action||'')+'"><span class="icon">'+(i.icon||'')+'</span><span>'+i.label+'</span>'+(i.shortcut?'<span class="shortcut">'+i.shortcut+'</span>':'')+'</div>'
        ).join('');
        m.style.left=Math.min(x, window.innerWidth-220)+'px';
        m.style.top=Math.min(y, window.innerHeight-300)+'px';
        m.classList.add('show');
        m.querySelectorAll('.context-item').forEach(el=>{
            el.addEventListener('click', ()=>{
                const a=el.dataset.action;
                if(a && this._actions[a]) this._actions[a]();
                this.hide();
            });
        });
    },
    hide(){ document.getElementById('context-menu').classList.remove('show'); },
    _actions:{
        refresh:()=>DesktopManager.render(),
        terminal:()=>AppRegistry.launch('terminal'),
        files:()=>AppRegistry.launch('files'),
        notepad:()=>AppRegistry.launch('notepad'),
        settings:()=>AppRegistry.launch('settings'),
        taskmgr:()=>AppRegistry.launch('taskmgr'),
        about:()=>AppRegistry.launch('about'),
        users:()=>{ if(AuthSystem.isAdmin()) AppRegistry.launch('users'); },
        tenants:()=>{ if(AuthSystem.isAdmin()) AppRegistry.launch('tenants'); },
        logout:()=>CloudOS.logout(),
        lock:()=>CloudOS.lockScreen()
    }
};

// ========== ClockManager ==========
const ClockManager={
    _i:null,
    start(){
        const u=()=>{
            const n=new Date();
            document.getElementById('taskbar-clock').innerHTML=n.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+'<br>'+n.toLocaleDateString('zh-CN',{month:'short',day:'numeric',weekday:'short'});
        };
        u();
        this._i=setInterval(u, 1000);
    }
};

// ========== SyncManager ==========
const SyncManager={
    _i:null,
    start(){
        const ind=document.getElementById('sync-indicator');
        this._i=setInterval(()=>{
            ind.className='sync-indicator syncing';
            ind.querySelector('span').textContent='Syncing...';
            EventBus.emit('sync.status', {status:'syncing'});
            setTimeout(()=>{
                ind.className='sync-indicator synced';
                ind.querySelector('span').textContent='Synced';
                EventBus.emit('sync.status', {status:'synced'});
            }, 1500);
        }, 30000);
    }
};

// ========== 15. Login User Refresh ==========
const LoginUserManager={
    refreshAvatars(){
        const uc=document.getElementById('login-users');
        if(!uc) return;
        const users=AuthSystem.getAllUsers();
        uc.innerHTML=users.map(u=>'<div class="login-user-avatar" data-username="'+u.username+'" title="'+u.displayName+'">'+u.avatar+'</div>').join('');
        uc.querySelectorAll('.login-user-avatar').forEach(el=>{
            el.addEventListener('click', ()=>{
                uc.querySelectorAll('.login-user-avatar').forEach(e=>e.classList.remove('selected'));
                el.classList.add('selected');
                document.getElementById('login-username').value=el.dataset.username;
                document.getElementById('login-password').focus();
            });
        });
    }
};

// ========== Boot & Login ==========
const _boot=async()=>{
    const bs=document.getElementById('boot-screen');
    const st=document.getElementById('boot-status');
    const steps=['Initializing kernel...','Loading file system driver...','Mounting virtual file system...','Initializing memory manager...','Starting process scheduler...','Loading user database...','Initializing tenant system...','Starting network services...','Loading desktop environment...','System ready.'];
    for(const s of steps){
        st.textContent=s;
        await new Promise(r=>setTimeout(r, 200));
    }
    Kernel.init();
    FileSystem.init();
    AuthSystem.init();
    TenantSystem.init();
    SettingsStore.init();
    // 15. Listen for user.change to refresh login avatars
    EventBus.on('user.change', ()=>{
        LoginUserManager.refreshAvatars();
    });
    await new Promise(r=>setTimeout(r, 300));
    bs.classList.add('fade-out');
    setTimeout(()=>{ bs.style.display='none'; _showLogin(); }, 800);
};

const _showLogin=()=>{
    const ls=document.getElementById('login-screen');
    ls.style.display='block';
    LoginUserManager.refreshAvatars();
    document.getElementById('login-btn').addEventListener('click', _handleLogin);
    document.getElementById('login-password').addEventListener('keydown', e=>{ if(e.key==='Enter') _handleLogin(); });
    // Auto-select admin
    const adminAvatar=document.querySelector('[data-username="admin"]');
    if(adminAvatar) adminAvatar.click();
};

const _handleLogin=()=>{
    const u=document.getElementById('login-username').value.trim();
    const p=document.getElementById('login-password').value;
    const err=document.getElementById('login-error');
    if(!u||!p){ err.textContent='Please enter username and password'; err.style.display='block'; return; }
    const r=AuthSystem.authenticate(u, p);
    if(!r.success){ err.textContent=r.error; err.style.display='block'; return; }
    err.style.display='none';
    AuthSystem.login(r.user);
    _enterDesktop();
};

const _enterDesktop=()=>{
    const user=AuthSystem.getCurrentUser();
    document.getElementById('login-screen').style.display='none';
    document.getElementById('desktop').style.display='block';
    document.getElementById('taskbar').style.display='flex';
    document.getElementById('taskbar-avatar').textContent=user.avatar;
    document.getElementById('taskbar-username').textContent=user.displayName;
    DesktopManager.render();
    ClockManager.start();
    SyncManager.start();
    ProcessManager.create('System','system',{memory:16});
    ProcessManager.create('Desktop','system',{memory:24});
    ProcessManager.create('WindowServer','system',{memory:32});
    NotificationSystem.show('Welcome','Hello, '+user.displayName+'! Logged in as '+user.role+'.','success');
    _setupEvents();
};

// ========== 13. Keyboard Shortcuts ==========
const _setupEvents=()=>{
    // Start menu
    document.getElementById('start-btn').addEventListener('click', e=>{
        e.stopPropagation();
        StartMenuManager.toggle();
    });
    // Global click - close menus
    document.addEventListener('click', e=>{
        if(!e.target.closest('#start-menu')&&!e.target.closest('#start-btn')) StartMenuManager.close();
        if(!e.target.closest('.context-menu')) ContextMenuManager.hide();
    });
    // Desktop right-click
    document.getElementById('desktop').addEventListener('contextmenu', e=>{
        e.preventDefault();
        const ia=AuthSystem.isAdmin();
        ContextMenuManager.show(e.clientX, e.clientY, [
            {label:'Refresh', icon:'\uD83D\uDD04', action:'refresh', shortcut:'F5'},
            {separator:true},
            {label:'Open Terminal', icon:'\u2B1B', action:'terminal'},
            {label:'File Manager', icon:'\uD83D\uDCC1', action:'files'},
            {label:'Notepad', icon:'\uD83D\uDCDD', action:'notepad'},
            {separator:true},
            ...(ia?[{label:'User Manager', icon:'\uD83D\uDC65', action:'users'},{label:'Tenant Manager', icon:'\uD83C\uDFE2', action:'tenants'}]:[]),
            {label:'Task Manager', icon:'\uD83D\uDCCA', action:'taskmgr'},
            {label:'Settings', icon:'\u2699\uFE0F', action:'settings'},
            {separator:true},
            {label:'About CloudOS', icon:'\u2139\uFE0F', action:'about'}
        ]);
    });
    // Taskbar search
    document.getElementById('taskbar-search').addEventListener('input', e=>{
        const q=e.target.value.toLowerCase();
        if(q.length>0){
            const a=AppRegistry.getAll().find(a=>a.name.toLowerCase().includes(q)&&AppRegistry.canLaunch(a.id));
            if(a){ AppRegistry.launch(a.id); e.target.value=''; }
        }
    });
    // Start menu search
    document.getElementById('start-search').addEventListener('input', e=>{
        const q=e.target.value.toLowerCase();
        document.querySelectorAll('.start-app').forEach(el=>{
            el.style.display=el.querySelector('.name').textContent.toLowerCase().includes(q)?'':'none';
        });
    });
    // Taskbar user click
    document.getElementById('taskbar-user').addEventListener('click', ()=>{
        const u=AuthSystem.getCurrentUser();
        ContextMenuManager.show(window.innerWidth-220, window.innerHeight-200, [
            {label:u.displayName, icon:u.avatar, disabled:true},
            {label:u.role.toUpperCase()+' - '+u.tenantId, disabled:true},
            {separator:true},
            {label:'Settings', icon:'\u2699\uFE0F', action:'settings'},
            {label:'Lock Screen', icon:'\uD83D\uDD12', action:'lock'},
            {label:'Sign Out', icon:'\u23FB', action:'logout'}
        ]);
    });
    // 13. Keyboard shortcuts
    document.addEventListener('keydown', e=>{
        // Alt+F4 - close focused window
        if(e.altKey && e.key==='F4'){
            e.preventDefault();
            const fw=WindowManager.focusedWindowId;
            if(fw) WindowManager.close(fw);
        }
        // Ctrl+Alt+T - open terminal
        if(e.ctrlKey && e.altKey && e.key==='t'){
            e.preventDefault();
            AppRegistry.launch('terminal');
        }
        // Ctrl+Alt+E - open file manager
        if(e.ctrlKey && e.altKey && e.key==='e'){
            e.preventDefault();
            AppRegistry.launch('files');
        }
        // Escape - close menus
        if(e.key==='Escape'){
            StartMenuManager.close();
            ContextMenuManager.hide();
        }
    });
    // Reset session timer on user activity
    document.addEventListener('mousemove', ()=>{ SettingsStore.resetSessionTimer(); });
    document.addEventListener('keydown', ()=>{ SettingsStore.resetSessionTimer(); });
};

setTimeout(_boot, 500);

return {
    Kernel, MemoryManager, ProcessManager, FileSystem, AuthSystem, TenantSystem,
    WindowManager, AppRegistry, AppLauncher, DesktopManager, StartMenuManager,
    ContextMenuManager, NotificationSystem, DialogSystem, EventBus, SettingsStore,
    logout(){
        AuthSystem.logout();
        WindowManager.windows.forEach((w,id)=>WindowManager.close(id));
        document.getElementById('desktop').style.display='none';
        document.getElementById('taskbar').style.display='none';
        document.getElementById('login-screen').style.display='block';
        document.getElementById('login-password').value='';
        document.getElementById('login-error').style.display='none';
    },
    lockScreen(){
        AuthSystem.logout();
        WindowManager.windows.forEach((w,id)=>WindowManager.close(id));
        document.getElementById('desktop').style.display='none';
        document.getElementById('taskbar').style.display='none';
        document.getElementById('login-screen').style.display='block';
        document.getElementById('login-password').value='';
        NotificationSystem.show('Locked','Screen locked. Please sign in.','info');
    }
};

})();

</script>
</body>
</html>
