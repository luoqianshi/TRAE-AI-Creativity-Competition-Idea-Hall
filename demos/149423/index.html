<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什么？🍔</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap');

        :root {
            --primary: #FF6B35;
            --secondary: #4ECDC4;
            --cream: #FFF8E7;
            --coral: #FF8A65;
            --mustard: #FFCA28;
            --mint: #81D4FA;
            --dark: #2D3436;
            --light-gray: #F5F5F5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, #FFF0E0 50%, #FFF8E7 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .food-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.05;
            z-index: -1;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23FF6B35' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .header {
            text-align: center;
            padding: 40px 20px 20px;
            animation: fadeInDown 0.8s ease-out;
        }

        .header h1 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 10px;
            text-shadow: 3px 3px 0px rgba(255, 107, 53, 0.1);
        }

        .header p {
            font-size: 1.2rem;
            color: #666;
            font-weight: 500;
        }

        .emoji-sparkle {
            display: inline-block;
            animation: sparkle 1s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.2) rotate(10deg); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
        }

        .wheel-section {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
            animation: fadeIn 0.8s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(255, 107, 53, 0.3), inset 0 0 30px rgba(0,0,0,0.1);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            border: 8px solid white;
        }

        .wheel.spinning {
            transition: transform 6s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .wheel-slice {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel-slice:nth-child(1) { background: linear-gradient(135deg, #FF6B35, #FF8A65); transform: rotate(0deg) skewY(-60deg); }
        .wheel-slice:nth-child(2) { background: linear-gradient(135deg, #4ECDC4, #81D4FA); transform: rotate(60deg) skewY(-60deg); }
        .wheel-slice:nth-child(3) { background: linear-gradient(135deg, #FFCA28, #FFE082); transform: rotate(120deg) skewY(-60deg); }
        .wheel-slice:nth-child(4) { background: linear-gradient(135deg, #FF6B35, #FF8A65); transform: rotate(180deg) skewY(-60deg); }
        .wheel-slice:nth-child(5) { background: linear-gradient(135deg, #4ECDC4, #81D4FA); transform: rotate(240deg) skewY(-60deg); }
        .wheel-slice:nth-child(6) { background: linear-gradient(135deg, #FFCA28, #FFE082); transform: rotate(300deg) skewY(-60deg); }

        .slice-content {
            transform: rotate(30deg) skewY(60deg) translate(30px, -30px);
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .slice-content span {
            display: block;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .wheel-center:hover {
            transform: translate(-50%, -50%) scale(1.1);
        }

        .wheel-center:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        .wheel-center span {
            font-size: 1.5rem;
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 35px solid var(--dark);
            z-index: 20;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .controls {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--coral));
            color: white;
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 107, 53, 0.5);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: white;
            color: var(--dark);
            border: 2px solid var(--secondary);
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.2);
        }

        .btn-secondary:hover {
            background: var(--secondary);
            color: white;
            transform: translateY(-3px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 107, 53, 0.4); }
            50% { box-shadow: 0 0 0 20px rgba(255, 107, 53, 0); }
        }

        .preference-section {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
            animation: fadeIn 0.8s ease-out 0.5s both;
        }

        .section-title {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 1.8rem;
            color: var(--dark);
            margin-bottom: 20px;
            padding-left: 10px;
            border-left: 5px solid var(--primary);
        }

        .preference-group {
            margin-bottom: 30px;
        }

        .preference-label {
            font-size: 1rem;
            color: #666;
            margin-bottom: 12px;
            display: block;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag {
            padding: 10px 20px;
            background: white;
            border: 2px solid #E0E0E0;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            color: #666;
        }

        .tag:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: scale(1.05);
        }

        .tag.active {
            background: linear-gradient(135deg, var(--primary), var(--coral));
            border-color: var(--primary);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 107, 53, 0.3);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .confetti {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--primary);
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-100%) rotate(0deg); opacity: 1; }
            100% { transform: translateY(500px) rotate(720deg); opacity: 0; }
        }

        .result-image {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            margin: 20px auto;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            border: 5px solid white;
        }

        .result-name {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .result-category {
            display: inline-block;
            padding: 5px 15px;
            background: var(--secondary);
            color: white;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .result-desc {
            color: #666;
            font-size: 1rem;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .result-rating {
            font-size: 1.5rem;
            color: var(--mustard);
            margin-bottom: 25px;
        }

        .result-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
        }

        .result-tag {
            padding: 6px 14px;
            background: var(--light-gray);
            border-radius: 15px;
            font-size: 0.8rem;
            color: #666;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .modal-btn {
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--coral));
            color: white;
        }

        .modal-btn-secondary {
            background: var(--light-gray);
            color: #666;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
        }

        .favorites-section {
            margin-top: 40px;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            animation: fadeIn 0.8s ease-out 0.8s both;
        }

        .favorites-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .favorites-count {
            font-size: 0.9rem;
            color: #999;
        }

        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .favorite-card {
            background: var(--cream);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            position: relative;
        }

        .favorite-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.2);
        }

        .favorite-image {
            width: 100%;
            height: 120px;
            border-radius: 10px;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .favorite-name {
            font-weight: bold;
            color: var(--dark);
            margin-bottom: 5px;
        }

        .favorite-rating {
            font-size: 1rem;
            color: var(--mustard);
        }

        .favorite-delete {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 28px;
            height: 28px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.8rem;
        }

        .favorite-card:hover .favorite-delete {
            opacity: 1;
        }

        .favorite-delete:hover {
            background: #FF6B6B;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .footer {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }

            .wheel-container {
                width: 300px;
                height: 300px;
            }

            .slice-content {
                font-size: 0.8rem;
            }

            .slice-content span {
                font-size: 1.2rem;
            }

            .wheel-center {
                width: 60px;
                height: 60px;
            }

            .btn {
                padding: 12px 25px;
                font-size: 1rem;
            }

            .modal-content {
                padding: 25px;
            }

            .result-image {
                width: 150px;
                height: 150px;
            }

            .result-name {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

                </div>
                <div class="wheel-center" id="spinBtn">
                    <span>🎲</span>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-primary btn-pulse" id="startSpin">开始旋转</button>
                <button class="btn btn-secondary" id="quickPick">快速选择</button>

        </div>

        <div class="preference-section">
            <h2 class="section-title">🎯 偏好设置</h2>

            <div class="preference-group">

            </div>

            <div class="preference-group">
                <label class="preference-label">价格区间</label>
                <div class="tag-list" id="priceTags">
                    <span class="tag" data-value="¥">💰 ¥ (实惠)</span>
                    <span class="tag" data-value="¥¥">💵 ¥¥ (适中)</span>
                    <span class="tag" data-value="¥¥¥">💎 ¥¥¥ (高端)</span>
                </div>
            </div>

            <div class="preference-group">
                <label class="preference-label">菜系偏好</label>
                <div class="tag-list" id="categoryTags">
                    <span class="tag" data-value="川菜">🌶️ 川菜</span>
                    <span class="tag" data-value="粤菜">🥢 粤菜</span>
                    <span class="tag" data-value="日料">🍣 日料</span>
                    <span class="tag" data-value="西餐">🍴 西餐</span>
                    <span class="tag" data-value="湘菜">🔥 湘菜</span>
                    <span class="tag" data-value="火锅">🍲 火锅</span>
                    <span class="tag" data-value="小吃">🍢 小吃</span>
                    <span class="tag" data-value="甜点">🍰 甜点</span>
                </div>
            </div>
        </div>
    </main>

    <section class="favorites-section">
        <div class="favorites-header">
            <h2 class="section-title">❤️ 我的收藏</h2>
            <span class="favorites-count" id="favoritesCount">0 个美食</span>
        </div>
        <div class="favorites-grid" id="favoritesGrid">
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>

                <p>还没有收藏任何美食</p>
                <p style="font-size: 0.8rem;">点击结果弹窗中的❤️按钮收藏喜欢的美食</p>
            </div>
        </div>
    </section>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-content">
            <div class="confetti" id="confetti"></div>
            <div class="result-image" id="resultImage"></div>
            <div class="result-name" id="resultName"></div>
            <div class="result-category" id="resultCategory"></div>
            <div class="result-rating" id="resultRating"></div>
            <div class="result-desc" id="resultDesc"></div>
            <div class="result-tags" id="resultTags"></div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-secondary" id="closeModal">关闭</button>
                <button class="modal-btn modal-btn-primary" id="addToFavorites">❤️ 收藏</button>
                <button class="modal-btn modal-btn-primary" id="retry">🔄 再选一次</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>🍽️ 今天吃什么？ - 解决你的选择困难症</p>
    </footer>

    <script>
        const foods = [

            { id: 23, name: "芒果糯米饭", category: "甜点", flavor: ["甜"], priceRange: "¥", description: "香甜芒果配椰香糯米饭，热带风情！", image: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=mango%20sticky%20rice%20with%20coconut%20cream%20thai%20dessert&image_size=square", rating: 4.6, tags: ["甜品", "泰国", "清新"] },
            { id: 24, name: "糖醋排骨", category: "川菜", flavor: ["甜", "酸"], priceRange: "¥¥", description: "酸甜可口，外酥里嫩！", image: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=sweet%20and%20sour%20pork%20ribs%20chinese%20style%20glossy&image_size=square", rating: 4.7, tags: ["川菜", "酸甜", "经典"] }
        ];

        const categories = ["川菜", "粤菜", "日料", "西餐", "湘菜", "火锅", "小吃", "甜点"];

        let selectedFlavors = [];
        let selectedPriceRange = "";
        let selectedCategories = [];
        let favorites = JSON.parse(localStorage.getItem('foodFavorites') || '[]');
        let isSpinning = false;
        let currentResult = null;

        function initTags() {
            ['flavorTags', 'priceTags', 'categoryTags'].forEach(tagListId => {
                const tags = document.querySelectorAll(`#${tagListId} .tag`);
                tags.forEach(tag => {
                    tag.addEventListener('click', () => {
                        const value = tag.dataset.value;
                        const isPrice = tagListId === 'priceTags';

                        if (isPrice) {
                            selectedPriceRange = selectedPriceRange === value ? "" : value;
                            tags.forEach(t => t.classList.remove('active'));
                            if (selectedPriceRange) tag.classList.add('active');
                        } else {
                            const list = tagListId === 'flavorTags' ? selectedFlavors : selectedCategories;
                            const index = list.indexOf(value);
                            if (index > -1) {
                                list.splice(index, 1);
                                tag.classList.remove('active');
                            } else {
                                list.push(value);
                                tag.classList.add('active');
                            }
                        }
                    });
                });
            });
        }

        function filterFoods() {
            return foods.filter(food => {
                if (selectedFlavors.length > 0) {
                    const hasFlavor = selectedFlavors.some(f => food.flavor.includes(f));
                    if (!hasFlavor) return false;
                }
                if (selectedPriceRange && food.priceRange !== selectedPriceRange) {
                    return false;
                }
                if (selectedCategories.length > 0 && !selectedCategories.includes(food.category)) {
                    return false;
                }
                return true;
            });
        }

        function getRandomFood() {
            const filtered = filterFoods();
            if (filtered.length === 0) return foods[Math.floor(Math.random() * foods.length)];
            return filtered[Math.floor(Math.random() * filtered.length)];
        }

        function getCategoryIndex(category) {
            const index = categories.indexOf(category);
            if (index === -1) return Math.floor(Math.random() * 6);
            return index % 6;
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;

            const wheel = document.getElementById('wheel');
            const startBtn = document.getElementById('startSpin');
            const quickBtn = document.getElementById('quickPick');

            startBtn.disabled = true;
            quickBtn.disabled = true;
            startBtn.classList.remove('btn-pulse');
            wheel.classList.add('spinning');

            const food = getRandomFood();
            const categoryIndex = getCategoryIndex(food.category);
            const baseAngle = 360 * 5;
            const targetAngle = (360 - categoryIndex * 60) + 180;
            const totalAngle = baseAngle + targetAngle + Math.random() * 60;

            wheel.style.transform = `rotate(${totalAngle}deg)`;

            setTimeout(() => {
                isSpinning = false;
                wheel.classList.remove('spinning');
                startBtn.disabled = false;
                quickBtn.disabled = false;
                startBtn.classList.add('btn-pulse');
                showResult(food);
            }, 6000);
        }

        function quickPick() {
            if (isSpinning) return;
            const food = getRandomFood();
            showResult(food);
        }

        function createConfetti() {
            const confetti = document.getElementById('confetti');
            confetti.innerHTML = '';
            
            const colors = ['#FF6B35', '#4ECDC4', '#FFCA28', '#FF8A65', '#81D4FA'];
            for (let i = 0; i < 30; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + '%';
                piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDuration = (3 + Math.random() * 2) + 's';
                piece.style.animationDelay = Math.random() * 2 + 's';
                confetti.appendChild(piece);
            }
        }

        function showResult(food) {
            currentResult = food;

            document.getElementById('resultImage').src = food.image;
            document.getElementById('resultName').textContent = food.name;
            document.getElementById('resultCategory').textContent = food.category;
            document.getElementById('resultDesc').textContent = food.description;
            
            let ratingHtml = '';
            for (let i = 0; i < 5; i++) {
                ratingHtml += i < Math.floor(food.rating) ? '⭐' : '☆';
            }
            document.getElementById('resultRating').innerHTML = ratingHtml;

            const tagsContainer = document.getElementById('resultTags');
            tagsContainer.innerHTML = food.tags.map(tag => 
                `<span class="result-tag">${tag}</span>`
            ).join('');

            const favBtn = document.getElementById('addToFavorites');
            const isFav = favorites.some(f => f.id === food.id);
            favBtn.textContent = isFav ? '❤️ 已收藏' : '❤️ 收藏';
            favBtn.style.background = isFav ? '#E0E0E0' : '';

            createConfetti();
            document.getElementById('resultModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('resultModal').classList.remove('active');
        }

        function toggleFavorite() {
            if (!currentResult) return;

            const index = favorites.findIndex(f => f.id === currentResult.id);
            const favBtn = document.getElementById('addToFavorites');

            if (index > -1) {
                favorites.splice(index, 1);
                favBtn.textContent = '❤️ 收藏';
                favBtn.style.background = '';
            } else {
                favorites.push(currentResult);
                favBtn.textContent = '❤️ 已收藏';
                favBtn.style.background = '#E0E0E0';
            }

            localStorage.setItem('foodFavorites', JSON.stringify(favorites));
            renderFavorites();
        }

        function renderFavorites() {
            const grid = document.getElementById('favoritesGrid');
            const count = document.getElementById('favoritesCount');

            count.textContent = `${favorites.length} 个美食`;

            if (favorites.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                        </svg>
                        <p>还没有收藏任何美食</p>
                        <p style="font-size: 0.8rem;">点击结果弹窗中的❤️按钮收藏喜欢的美食</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = favorites.map(food => `
                <div class="favorite-card" onclick="selectFavorite(${food.id})">
                    <div class="favorite-delete" onclick="event.stopPropagation(); removeFavorite(${food.id})">✕</div>
                    <img class="favorite-image" src="${food.image}" alt="${food.name}">
                    <div class="favorite-name">${food.name}</div>
                    <div class="favorite-rating">${'⭐'.repeat(Math.floor(food.rating))}</div>
                </div>
            `).join('');
        }

        function selectFavorite(id) {
            const food = favorites.find(f => f.id === id);
            if (food) showResult(food);
        }

        function removeFavorite(id) {
            favorites = favorites.filter(f => f.id !== id);
            localStorage.setItem('foodFavorites', JSON.stringify(favorites));
            renderFavorites();
        }

        document.getElementById('startSpin').addEventListener('click', spinWheel);
        document.getElementById('quickPick').addEventListener('click', quickPick);
        document.getElementById('spinBtn').addEventListener('click', spinWheel);
        document.getElementById('closeModal').addEventListener('click', closeModal);
        document.getElementById('addToFavorites').addEventListener('click', toggleFavorite);
        document.getElementById('retry').addEventListener('click', () => {
            closeModal();
            setTimeout(spinWheel, 300);
        });

        document.getElementById('resultModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('resultModal')) {
                closeModal();
            }
        });

        initTags();
        renderFavorites();
    </script>
</body>
