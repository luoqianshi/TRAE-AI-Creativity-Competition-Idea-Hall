<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>记忆织锦 - 温馨回忆</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FFF8F0',
            creamDark: '#FAF0E6',
            warmOrange: '#E8A87C',
            warmOrangeDark: '#D4956A',
            retroRed: '#C97B63',
            brown: '#5D4E37',
            brownLight: '#6B5344',
            brownDark: '#3D2914',
          },
          fontFamily: {
            serif: ['Noto Serif SC', 'serif'],
            sans: ['Noto Sans SC', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: linear-gradient(180deg, #FFF8F0 0%, #FAF0E6 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 脉冲动画 */
    @keyframes pulse-ring {
      0% {
        transform: scale(1);
        opacity: 0.8;
      }
      100% {
        transform: scale(1.4);
        opacity: 0;
      }
    }

    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(232, 168, 124, 0.4), 0 0 40px rgba(232, 168, 124, 0.2);
      }
      50% {
        box-shadow: 0 0 30px rgba(232, 168, 124, 0.6), 0 0 60px rgba(232, 168, 124, 0.3);
      }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .voice-btn-pulse {
      animation: pulse-glow 2s ease-in-out infinite;
    }

    .voice-btn-pulse::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: rgba(232, 168, 124, 0.3);
      animation: pulse-ring 1.5s ease-out infinite;
    }

    .float-animation {
      animation: float 3s ease-in-out infinite;
    }

    .card-shimmer {
      background: linear-gradient(90deg, #f5e6d3 0%, #fff8f0 50%, #f5e6d3 100%);
      background-size: 200% 100%;
      animation: shimmer 2s linear infinite;
    }

    /* 照片滤镜 */
    .photo-filter {
      filter: sepia(20%) contrast(95%) brightness(95%);
      transition: filter 0.3s ease;
    }

    .photo-filter:hover {
      filter: sepia(10%) contrast(100%) brightness(100%);
    }

    /* 安全区域 */
    .safe-bottom {
      padding-bottom: max(env(safe-area-inset-bottom), 16px);
    }

    /* Tab 过渡 */
    .tab-content {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .tab-content.hidden {
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      position: absolute;
      inset: 0;
    }

    /* 进度条动画 */
    @keyframes progress-fill {
      from { width: 0; }
    }

    .progress-animate {
      animation: progress-fill 1.5s ease-out forwards;
    }

    /* 卡片悬停效果 */
    .story-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .story-card:active {
      transform: scale(0.98);
    }

    /* 录音状态 */
    .recording .voice-icon {
      animation: pulse-glow 0.5s ease-in-out infinite;
    }

    /* 滚动条美化 */
    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(93, 78, 55, 0.2);
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-cream text-brownDark">
  <!-- App 容器 -->
  <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col relative bg-cream/50">

    <!-- Header -->
    <header class="px-6 pt-12 pb-4 text-center">
      <h1 class="font-serif text-2xl font-semibold text-brown tracking-wide">记忆织锦</h1>
      <p class="text-brownLight/70 text-sm mt-1 font-sans">编织每一段珍贵回忆</p>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto pb-24 relative">
      <!-- 回忆相册 Tab -->
      <div id="tab-album" class="tab-content px-6 py-4">
        <!-- 照片卡片 -->
        <div class="relative rounded-2xl overflow-hidden shadow-lg mb-6 bg-warmOrange/10">
          <div class="aspect-[4/3] relative bg-gradient-to-br from-creamDark to-warmOrange/20 flex items-center justify-center">
            <!-- 老照片占位 -->
            <div class="text-center">
              <div class="w-32 h-32 mx-auto mb-4 rounded-lg bg-gradient-to-br from-amber-100 to-amber-200 flex items-center justify-center shadow-inner photo-filter">
                <svg class="w-16 h-16 text-warmOrange/60" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
              </div>
              <p class="text-brownLight/60 text-sm">1965年 · 北京</p>
            </div>
          </div>
          <!-- 复古装饰角 -->
          <div class="absolute top-3 left-3 w-8 h-8 border-l-2 border-t-2 border-warmOrange/40 rounded-tl"></div>
          <div class="absolute top-3 right-3 w-8 h-8 border-r-2 border-t-2 border-warmOrange/40 rounded-tr"></div>
          <div class="absolute bottom-3 left-3 w-8 h-8 border-l-2 border-b-2 border-warmOrange/40 rounded-bl"></div>
          <div class="absolute bottom-3 right-3 w-8 h-8 border-r-2 border-b-2 border-warmOrange/40 rounded-br"></div>
        </div>

        <!-- AI 引导语 -->
        <div class="text-center mb-8 px-4">
          <div class="inline-flex items-center gap-2 bg-warmOrange/10 px-4 py-2 rounded-full mb-4">
            <span class="w-2 h-2 bg-warmOrange rounded-full animate-pulse"></span>
            <span class="text-warmOrangeDark text-sm font-medium">AI 陪伴中</span>
          </div>
          <p id="guideText" class="text-xl font-serif text-brownDark leading-relaxed">
            奶奶，这张照片里的人是谁呀？
          </p>
          <p class="text-brownLight/60 text-sm mt-2">轻轻按住按钮，告诉我您想起了什么</p>
        </div>

        <!-- 语音按钮 -->
        <div class="flex justify-center mb-6">
          <button
            id="voiceBtn"
            class="voice-btn-pulse relative w-28 h-28 rounded-full bg-gradient-to-br from-warmOrange to-retroRed flex items-center justify-center shadow-xl active:scale-95 transition-transform"
          >
            <svg id="micIcon" class="voice-icon w-12 h-12 text-white" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
            <svg id="stopIcon" class="voice-icon hidden w-10 h-10 text-white" fill="currentColor" viewBox="0 0 24 24">
              <rect x="6" y="6" width="12" height="12" rx="2"/>
            </svg>
          </button>
        </div>

        <p id="voiceHint" class="text-center text-brownLight/70 text-base">
          按住说话，松开停止
        </p>
      </div>

      <!-- 时光绘本 Tab -->
      <div id="tab-book" class="tab-content hidden px-6 py-4">
        <h2 class="font-serif text-xl font-semibold text-brown mb-4 flex items-center gap-2">
          <span class="text-2xl">📖</span>
          时光绘本
        </h2>

        <!-- 故事卡片列表 -->
        <div id="storiesList" class="space-y-4">
          <!-- 卡片由 JS 渲染 -->
        </div>

        <p class="text-center text-brownLight/50 text-sm mt-6">
          共收录 <span id="storyCount">0</span> 个故事
        </p>
      </div>

      <!-- 家属守护 Tab -->
      <div id="tab守护" class="tab-content hidden px-6 py-4">
        <h2 class="font-serif text-xl font-semibold text-brown mb-4 flex items-center gap-2">
          <span class="text-2xl">💗</span>
          家属守护
        </h2>

        <!-- 情绪折线图 -->
        <div class="bg-creamDark/50 rounded-2xl p-4 mb-6 shadow-sm">
          <h3 class="font-medium text-brown mb-3 flex items-center gap-2">
            <span>📊</span> 近七日情绪趋势
          </h3>
          <div class="relative h-40">
            <canvas id="emotionChart" class="w-full h-full"></canvas>
          </div>
          <div class="flex justify-between text-xs text-brownLight/60 mt-2">
            <span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span>
          </div>
        </div>

        <!-- 认知活跃度 -->
        <div class="bg-gradient-to-br from-warmOrange/10 to-retroRed/10 rounded-2xl p-5 mb-6 shadow-sm">
          <h3 class="font-medium text-brown mb-2 flex items-center gap-2">
            <span>🧠</span> 今日认知活跃度
          </h3>
          <div class="flex items-end gap-3 mb-3">
            <span id="scoreValue" class="font-serif text-5xl font-bold text-warmOrange">0</span>
            <span class="text-brownLight/60 text-lg mb-2">分</span>
          </div>
          <div class="h-4 bg-creamDark rounded-full overflow-hidden">
            <div id="scoreBar" class="h-full bg-gradient-to-r from-warmOrange to-retroRed rounded-full progress-animate" style="width: 0%"></div>
          </div>
          <div class="flex justify-between text-xs text-brownLight/60 mt-2">
            <span>0</span><span>25</span><span>50</span><span>75</span><span>100</span>
          </div>
        </div>

        <!-- 健康小贴士 -->
        <div class="bg-warmOrange/10 rounded-2xl p-4 shadow-sm">
          <h3 class="font-medium text-brown mb-2 flex items-center gap-2">
            <span>💡</span> 今日小贴士
          </h3>
          <p class="text-brownLight leading-relaxed">
            保持心情愉悦是与记忆友好相处的关键。今天天气很好，建议奶奶去院子里晒晒太阳，和家人聊聊过去的美好时光。
          </p>
        </div>
      </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg border-t border-warmOrange/10 safe-bottom">
      <div class="max-w-md mx-auto flex justify-around py-2">
        <button class="tab-btn flex flex-col items-center py-2 px-4 rounded-xl transition-colors" data-tab="album">
          <span class="text-2xl mb-1">📷</span>
          <span class="text-xs font-medium">回忆相册</span>
        </button>
        <button class="tab-btn flex flex-col items-center py-2 px-4 rounded-xl transition-colors text-brownLight" data-tab="book">
          <span class="text-2xl mb-1">📖</span>
          <span class="text-xs font-medium">时光绘本</span>
        </button>
        <button class="tab-btn flex flex-col items-center py-2 px-4 rounded-xl transition-colors text-brownLight" data-tab="guard">
          <span class="text-2xl mb-1">💗</span>
          <span class="text-xs font-medium">家属守护</span>
        </button>
      </div>
    </nav>
  </div>

  <script>
    // 模拟数据
    const stories = [
      {
        id: 1,
        date: "2024年3月15日",
        title: "老北京的胡同记忆",
        summary: "那是五十年前的事，胡同里的槐花香飘满了整个夏天。我和小伙伴们在巷子里捉迷藏，大人们坐在门口乘凉，聊着家长里短...",
        emoji: "🏠"
      },
      {
        id: 2,
        date: "2024年3月8日",
        title: "父亲的茶香",
        summary: "父亲总喜欢在午后泡一壶龙井，茶香袅袅。我现在才明白，那茶香里藏着的是对子女的牵挂和思念...",
        emoji: "🍵"
      },
      {
        id: 3,
        date: "2024年2月28日",
        title: "结婚那天的红盖头",
        summary: "五十年前的今天，我坐上了那顶大红花轿。虽然生活简朴，但我们相濡以沫走过了半个世纪...",
        emoji: "💒"
      },
      {
        id: 4,
        date: "2024年2月14日",
        title: "孙子的第一个春节",
        summary: "小孙子刚学会走路，踉踉跄跄地给我拜年。那一声稚嫩的'奶奶新年好'，让我高兴了好几天...",
        emoji: "🧧"
      }
    ];

    const emotionData = [65, 72, 68, 75, 70, 78, 82];
    const guideTexts = [
      "奶奶，这张照片里的人是谁呀？",
      "爷爷，您还记得这是在哪里拍的吗？",
      "慢慢说，不着急，我在这里听您讲",
      "这个故事真温暖，能再多讲一些吗？",
      "您年轻的时候真漂亮！"
    ];

    // DOM 元素
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabContents = {
      album: document.getElementById('tab-album'),
      book: document.getElementById('tab-book'),
      guard: document.getElementById('tab-guard') || document.getElementById('tab\u5b88\u62a4')
    };
    const voiceBtn = document.getElementById('voiceBtn');
    const micIcon = document.getElementById('micIcon');
    const stopIcon = document.getElementById('stopIcon');
    const voiceHint = document.getElementById('voiceHint');
    const guideTextEl = document.getElementById('guideText');
    const storiesList = document.getElementById('storiesList');
    const storyCount = document.getElementById('storyCount');

    // Tab 切换
    function switchTab(tabName) {
      tabBtns.forEach(btn => {
        if (btn.dataset.tab === tabName) {
          btn.classList.remove('text-brownLight');
          btn.classList.add('text-warmOrange');
        } else {
          btn.classList.remove('text-warmOrange');
          btn.classList.add('text-brownLight');
        }
      });

      Object.keys(tabContents).forEach(key => {
        const el = document.getElementById(`tab-${key === 'guard' ? 'guard' : key}`);
        if (el) {
          if (key === tabName) {
            el.classList.remove('hidden');
          } else {
            el.classList.add('hidden');
          }
        }
      });

      if (tabName === 'guard') {
        drawEmotionChart();
        animateScore();
      }
    }

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    // 语音按钮交互
    let isRecording = false;
    let recordingTimeout;

    function startRecording() {
      isRecording = true;
      voiceBtn.classList.add('recording');
      micIcon.classList.add('hidden');
      stopIcon.classList.remove('hidden');
      voiceHint.textContent = '正在聆听...';
      guideTextEl.textContent = '我在听呢，慢慢说~';

      // 模拟录音超时
      recordingTimeout = setTimeout(() => {
        if (isRecording) {
          stopRecording();
        }
      }, 10000);
    }

    function stopRecording() {
      if (!isRecording) return;
      isRecording = false;
      clearTimeout(recordingTimeout);
      voiceBtn.classList.remove('recording');
      micIcon.classList.remove('hidden');
      stopIcon.classList.add('hidden');
      voiceHint.textContent = '按住了说话，松开停止';

      // 模拟 AI 处理
      guideTextEl.textContent = '太棒了！正在生成故事...';
      setTimeout(() => {
        const randomText = guideTexts[Math.floor(Math.random() * guideTexts.length)];
        guideTextEl.textContent = randomText;
      }, 2000);
    }

    voiceBtn.addEventListener('mousedown', startRecording);
    voiceBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      startRecording();
    });

    voiceBtn.addEventListener('mouseup', stopRecording);
    voiceBtn.addEventListener('mouseleave', stopRecording);
    voiceBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      stopRecording();
    });

    // 渲染故事卡片
    function renderStories() {
      storiesList.innerHTML = stories.map(story => `
        <div class="story-card bg-creamDark/50 rounded-2xl p-4 shadow-sm cursor-pointer">
          <div class="flex items-start gap-3">
            <span class="text-3xl">${story.emoji}</span>
            <div class="flex-1">
              <div class="text-xs text-warmOrangeDark mb-1">${story.date}</div>
              <h4 class="font-serif font-semibold text-brown mb-2">${story.title}</h4>
              <p class="text-brownLight/80 text-sm leading-relaxed line-clamp-3">${story.summary}</p>
            </div>
          </div>
          <div class="mt-3 pt-3 border-t border-warmOrange/10 flex justify-end">
            <span class="text-xs text-warmOrangeDark">阅读全文 →</span>
          </div>
        </div>
      `).join('');
      storyCount.textContent = stories.length;
    }

    // 绘制情绪折线图
    function drawEmotionChart() {
      const canvas = document.getElementById('emotionChart');
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * 2;
      canvas.height = rect.height * 2;
      ctx.scale(2, 2);

      const width = rect.width;
      const height = rect.height;
      const padding = 20;
      const data = emotionData;

      // 清空画布
      ctx.clearRect(0, 0, width, height);

      // 绘制网格
      ctx.strokeStyle = 'rgba(93, 78, 55, 0.1)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = padding + (height - padding * 2) * i / 4;
        ctx.beginPath();
        ctx.moveTo(padding, y);
        ctx.lineTo(width - padding, y);
        ctx.stroke();
      }

      // 绘制折线
      const stepX = (width - padding * 2) / (data.length - 1);
      const minVal = Math.min(...data) - 10;
      const maxVal = Math.max(...data) + 10;
      const range = maxVal - minVal;

      // 渐变填充
      const gradient = ctx.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, 'rgba(232, 168, 124, 0.3)');
      gradient.addColorStop(1, 'rgba(232, 168, 124, 0)');

      ctx.beginPath();
      ctx.moveTo(padding, height - padding - ((data[0] - minVal) / range) * (height - padding * 2));

      data.forEach((val, i) => {
        const x = padding + i * stepX;
        const y = height - padding - ((val - minVal) / range) * (height - padding * 2);

        if (i === 0) {
          ctx.lineTo(x, y);
        } else {
          // 平滑曲线
          const prevX = padding + (i - 1) * stepX;
          const prevY = height - padding - ((data[i - 1] - minVal) / range) * (height - padding * 2);
          const cpX = (prevX + x) / 2;
          ctx.quadraticCurveTo(prevX, prevY, cpX, (prevY + y) / 2);
          ctx.quadraticCurveTo(cpX, (prevY + y) / 2, x, y);
        }
      });

      ctx.lineTo(width - padding, height - padding);
      ctx.lineTo(padding, height - padding);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();

      // 绘制线条
      ctx.beginPath();
      data.forEach((val, i) => {
        const x = padding + i * stepX;
        const y = height - padding - ((val - minVal) / range) * (height - padding * 2);

        if (i === 0) {
          ctx.moveTo(x, y);
        } else {
          const prevX = padding + (i - 1) * stepX;
          const prevY = height - padding - ((data[i - 1] - minVal) / range) * (height - padding * 2);
          const cpX = (prevX + x) / 2;
          ctx.quadraticCurveTo(prevX, prevY, cpX, (prevY + y) / 2);
          ctx.quadraticCurveTo(cpX, (prevY + y) / 2, x, y);
        }
      });
      ctx.strokeStyle = '#E8A87C';
      ctx.lineWidth = 3;
      ctx.stroke();

      // 绘制数据点
      data.forEach((val, i) => {
        const x = padding + i * stepX;
        const y = height - padding - ((val - minVal) / range) * (height - padding * 2);

        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#E8A87C';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      });
    }

    // 活跃度评分动画
    function animateScore() {
      const targetScore = 78;
      const scoreEl = document.getElementById('scoreValue');
      const barEl = document.getElementById('scoreBar');

      if (!scoreEl || !barEl) return;

      let current = 0;
      const duration = 1500;
      const startTime = performance.now();

      function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);

        current = Math.round(targetScore * easeOut);
        scoreEl.textContent = current;
        barEl.style.width = current + '%';

        if (progress < 1) {
          requestAnimationFrame(update);
        }
      }

      requestAnimationFrame(update);
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      renderStories();
      switchTab('album');

      // 随机更换引导语
      setInterval(() => {
        if (!isRecording) {
          const randomText = guideTexts[Math.floor(Math.random() * guideTexts.length)];
          guideTextEl.style.opacity = '0';
          setTimeout(() => {
            guideTextEl.textContent = randomText;
            guideTextEl.style.opacity = '1';
          }, 300);
        }
      }, 8000);
    });
