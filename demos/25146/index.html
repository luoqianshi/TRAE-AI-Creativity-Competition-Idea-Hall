<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <title>墨韵 - 硬笔书法智能评分系统</title>
    <style>
        /* ===== Reset & Base ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f5f0eb;
            color: #2c2c2c;
            min-height: 100vh;
        }

        /* ===== Header ===== */

            background: linear-gradient(135deg, #2c1810 0%, #4a2c1a 50%, #2c1810 100%);
            color: #f5f0eb;
            padding: 40px 20px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.5;
        }

            font-size: 2.8em;
            font-weight: 700;
            letter-spacing: 8px;
            position: relative;

        }

        .header p {
            margin-top: 12px;
            font-size: 1.1em;
            opacity: 0.85;
            letter-spacing: 2px;
            position: relative;
        }
        .header .badge {
            display: inline-block;
            margin-top: 16px;

            color: #d4a574;

            letter-spacing: 2px;
            position: relative;
        }

        /* ===== Container ===== */
        .container { max-width: 1100px; margin: 0 auto; padding: 30px 20px 60px; }

        /* ===== Upload Section ===== */
        .upload-section {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            text-align: center;
            margin-bottom: 30px;
            border: 2px dashed #d4a574;

        .upload-section:hover, .upload-section.dragover {

        }
        .upload-section h2 {

            color: #4a2c1a;
            margin-bottom: 8px;
        }
        .upload-section p {
            color: #888;
            font-size: 0.9em;
        }
        .upload-section input[type="file"] { display: none; }

        /* ===== Preview & Analysis ===== */
        .analysis-area { display: none; }
        .analysis-area.active { display: block; }

        .main-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 30px;
        }
        @media (max-width: 768px) {
            .main-panel { grid-template-columns: 1fr; }
        }

        .preview-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .preview-card h3 {
            font-size: 1em;
            color: #4a2c1a;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0e8e0;
        }
        .preview-card .image-wrapper {
            width: 100%;
            min-height: 300px;
            background: #faf8f6;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .preview-card .image-wrapper img {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
        }
        .preview-card .image-wrapper .placeholder {
            color: #ccc;
            font-size: 0.9em;
        }

        /* ===== Score Card ===== */
        .score-card {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .score-card .total-score {
            text-align: center;
            padding: 20px 0 16px;
        }
        .score-card .total-score .number {
            font-size: 4em;
            font-weight: 700;
            color: #2c1810;
            line-height: 1;
        }
        .score-card .total-score .number .decimal { font-size: 0.5em; }
        .score-card .total-score .label {
            color: #888;
            font-size: 0.9em;
            margin-top: 4px;
        }
        .score-card .total-score .grade {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 16px;

        .grade-excellent { background: #e8f5e9; color: #2e7d32; }
        .grade-good { background: #e3f2fd; color: #1565c0; }
        .grade-average { background: #fff3e0; color: #e65100; }

        .score-details { margin-top: 16px; }

<!-- ===== Header ===== -->
<header class="header">

</div>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-box">
        <div class="spinner"></div>

</div>

<footer class="footer">

</footer>

<script>
// ===== Configuration =====
const SCORE_DIMENSIONS = [
    { key: 'structure', name: '字形结构', color: '#8b5e3c' },
    { key: 'stroke', name: '笔画力度', color: '#a67c52' },
    { key: 'alignment', name: '排列整齐度', color: '#c49a6c' },
    { key: 'spacing', name: '字间距', color: '#b8895e' },
    { key: 'size', name: '大小均匀度', color: '#d4a574' },
    { key: 'cleanliness', name: '卷面整洁度', color: '#e0b88a' },
];

const SUGGESTION_LIBRARY = {
    structure: [
        { title: '注意字形重心', desc: '每个字的重心应保持在中心偏上位置，避免头重脚轻或左右失衡。建议用田字格练习定位。' },
        { title: '强化主笔突出', desc: '每个字的主笔（最长的横、竖、撇、捺）要写得舒展有力，其他笔画相应收敛，形成主次对比。' },
        { title: '注意间架结构', desc: '左右结构的字要注意宽窄比例，上下结构的字要注意重心对齐。可以参考楷书字帖的结构规律。' },
    ],
    stroke: [
        { title: '增加笔画力度变化', desc: '起笔、行笔、收笔要有轻重变化，避免全篇力度一致。横画宜左低右高，竖画要垂直有力。' },
        { title: '注意起收笔动作', desc: '起笔要有顿挫感，收笔要干净利落。可以练习基本笔画"横、竖、撇、捺、点"各50遍。' },
        { title: '提升笔画流畅度', desc: '行笔过程中避免断笔和抖动，保持匀速运笔。建议放慢速度，注重每一笔的完整性。' },
    ],
    alignment: [
        { title: '保持横向对齐', desc: '整行字的底部应在同一水平线上，避免忽高忽低。可以在横线纸上练习，培养对齐意识。' },
        { title: '注意纵向呼应', desc: '上下行之间的字要相互呼应，避免行与行之间歪斜。建议使用方格纸练习。' },
        { title: '控制行距均匀', desc: '行与行之间的距离应保持一致，避免疏密不均。书写时可用手指作为间距参考。' },
    ],
    spacing: [
        { title: '统一字间距', desc: '字与字之间的距离应大致相等，避免有的字挤在一起、有的字过于分散。' },
        { title: '注意笔画避让', desc: '相邻字的笔画要互相避让，避免笔画交叉或粘连。左右结构的字内部也要注意避让。' },
    ],
    size: [
        { title: '统一字形大小', desc: '所有字的大小应基本一致，避免忽大忽小。笔画多的字可以略大，笔画少的字可以略小。' },
        { title: '控制字占格比例', desc: '在方格纸中，字应占格子面积的70%-80%，四周留白均匀，不宜撑满或过小。' },
    ],
    cleanliness: [
        { title: '保持卷面整洁', desc: '书写前擦净桌面，避免污渍。写错时用单线划去即可，不要反复涂抹。' },
        { title: '注意墨色均匀', desc: '使用同一支笔和同一瓶墨水，避免墨色深浅不一影响整体美观。' },
    ],
};

const PRACTICE_CHARS = [
    { char: '永', label: '永字八法 · 基础' },
    { char: '人', label: '撇捺搭配' },
    { char: '山', label: '竖画挺拔' },
    { char: '水', label: '左右结构' },
    { char: '花', label: '上下结构' },
    { char: '国', label: '全包围结构' },
    { char: '道', label: '半包围结构' },
    { char: '心', label: '卧钩练习' },
    { char: '之', label: '捺画舒展' },
    { char: '天', label: '横画排列' },
];

// ===== State =====
let currentImageData = null;

// ===== Upload Handling =====
const uploadSection = document.getElementById('uploadSection');
const fileInput = document.getElementById('fileInput');

uploadSection.addEventListener('click', () => fileInput.click());

uploadSection.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadSection.classList.add('dragover');
});
uploadSection.addEventListener('dragleave', () => {
    uploadSection.classList.remove('dragover');
});
uploadSection.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadSection.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) handleFile(file);
});

fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) handleFile(file);
});

function handleFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            currentImageData = img;
            showPreview(img);
            startAnalysis(img);
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function showPreview(img) {
    const wrapper = document.getElementById('imageWrapper');
    wrapper.innerHTML = '';
    wrapper.appendChild(img);
    document.getElementById('analysisArea').classList.add('active');
    window.scrollTo({ top: document.getElementById('analysisArea').offsetTop - 20, behavior: 'smooth' });
}

// ===== Analysis Engine =====
function startAnalysis(img) {
    document.getElementById('loadingOverlay').classList.add('active');

    setTimeout(() => {
        const scores = analyzeImage(img);
        renderScores(scores);
        renderSuggestions(scores);
        renderPractice(scores);
        document.getElementById('loadingOverlay').classList.remove('active');
    }, 1800);
}

function analyzeImage(img) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);

    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;

    // Extract pixel data for analysis
    const grayscale = [];
    for (let i = 0; i < data.length; i += 4) {
        const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        grayscale.push(gray);
    }

    const w = canvas.width;
    const h = canvas.height;

    // 1. Structure score - analyze stroke distribution
    const structureScore = analyzeStructure(grayscale, w, h);

    // 2. Stroke score - analyze stroke thickness and consistency
    const strokeScore = analyzeStroke(grayscale, w, h);

    // 3. Alignment score - analyze horizontal alignment
    const alignmentScore = analyzeAlignment(grayscale, w, h);

    // 4. Spacing score - analyze character spacing
    const spacingScore = analyzeSpacing(grayscale, w, h);

    // 5. Size uniformity
    const sizeScore = analyzeSizeUniformity(grayscale, w, h);

    // 6. Cleanliness
    const cleanlinessScore = analyzeCleanliness(grayscale, w, h);

    return {
        structure: clampScore(structureScore),
        stroke: clampScore(strokeScore),
        alignment: clampScore(alignmentScore),
        spacing: clampScore(spacingScore),
        size: clampScore(sizeScore),
        cleanliness: clampScore(cleanlinessScore),
    };
}

function clampScore(val) {
    return Math.max(40, Math.min(100, Math.round(val)));
}

function analyzeStructure(gray, w, h) {
    // Analyze how well-distributed the ink is across character regions
    const rows = 8;
    const cols = 8;
    const cellW = Math.floor(w / cols);
    const cellH = Math.floor(h / rows);
    const densities = [];

    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            let sum = 0, count = 0;
            for (let y = r * cellH; y < (r + 1) * cellH && y < h; y++) {
                for (let x = c * cellW; x < (c + 1) * cellW && x < w; x++) {
                    sum += gray[y * w + x];
                    count++;
                }
            }
            densities.push(sum / count);
        }
    }

    // Good structure has balanced ink distribution (not all empty, not all full)
    const mean = densities.reduce((a, b) => a + b, 0) / densities.length;
    const variance = densities.reduce((a, b) => a + (b - mean) ** 2, 0) / densities.length;

    // Moderate variance is good (some areas have ink, some are empty - proper spacing)
    const optimalVar = 3000;
    const score = 100 - Math.min(40, Math.abs(Math.sqrt(variance) - Math.sqrt(optimalVar)) / 15);

    // Also check if center regions have more ink (proper character placement)
    const centerDensity = (densities[27] + densities[28] + densities[35] + densities[36]) / 4;
    const edgeDensity = (densities[0] + densities[7] + densities[56] + densities[63]) / 4;
    const centerRatio = centerDensity / (edgeDensity + 1);

    const centerBonus = Math.min(10, Math.max(-10, (centerRatio - 1.5) * 5));

    return score + centerBonus;
}

function analyzeStroke(gray, w, h) {
    // Detect edges (stroke boundaries) using simple gradient
    let edgeCount = 0;
    let totalPixels = 0;

    for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
            const idx = y * w + x;
            const gx = Math.abs(gray[idx + 1] - gray[idx - 1]);
            const gy = Math.abs(gray[(y + 1) * w + x] - gray[(y - 1) * w + x]);
            const grad = Math.max(gx, gy);
            if (grad > 30) edgeCount++;
            totalPixels++;
        }
    }

    const edgeRatio = edgeCount / totalPixels;

    // Good handwriting has moderate edge ratio (clear strokes)
    // Too many edges = shaky, too few = blurry
    const optimalEdgeRatio = 0.12;
    const score = 100 - Math.abs(edgeRatio - optimalEdgeRatio) * 200;

    // Analyze stroke thickness consistency
    let strokePixels = 0;
    for (let i = 0; i < gray.length; i++) {
        if (gray[i] < 128) strokePixels++;
    }
    const inkRatio = strokePixels / gray.length;
    const optimalInk = 0.15;
    const inkScore = 100 - Math.abs(inkRatio - optimalInk) * 200;

    return (score + inkScore) / 2;
}

function analyzeAlignment(gray, w, h) {
    // Analyze horizontal alignment by looking at ink distribution per row
    const rowDensities = [];
    for (let y = 0; y < h; y++) {
        let sum = 0;
        for (let x = 0; x < w; x++) {
            sum += gray[y * w + x];
        }
        rowDensities.push(sum / w);
    }

    // Find rows with significant ink content
    const threshold = (Math.min(...rowDensities) + Math.max(...rowDensities)) / 2;
    const inkRows = [];
    for (let y = 0; y < h; y++) {
        if (rowDensities[y] < threshold) inkRows.push(y);
    }

    if (inkRows.length < 2) return 70;

    // Group into bands (text lines)
    const bands = [];
    let currentBand = [inkRows[0]];
    for (let i = 1; i < inkRows.length; i++) {
        if (inkRows[i] - inkRows[i - 1] <= 3) {
            currentBand.push(inkRows[i]);
        } else {
            bands.push(currentBand);
            currentBand = [inkRows[i]];
        }
    }
    bands.push(currentBand);

    if (bands.length < 2) return 75;

    // Check if bands are evenly spaced
    const bandCenters = bands.map(b => b.reduce((a, c) => a + c, 0) / b.length);
    const spacings = [];
    for (let i = 1; i < bandCenters.length; i++) {
        spacings.push(bandCenters[i] - bandCenters[i - 1]);
    }

    const spacingMean = spacings.reduce((a, b) => a + b, 0) / spacings.length;
    const spacingVar = spacings.reduce((a, b) => a + (b - spacingMean) ** 2, 0) / spacings.length;

    // Low variance in spacing = good alignment
    const score = 100 - Math.min(30, Math.sqrt(spacingVar) / 2);
    return score;
}

function analyzeSpacing(gray, w, h) {
    // Analyze vertical spacing (character spacing within lines)
    const colDensities = [];
    for (let x = 0; x < w; x++) {
        let sum = 0;
        for (let y = 0; y < h; y++) {
            sum += gray[y * w + x];
        }
        colDensities.push(sum / h);
    }

    const threshold = (Math.min(...colDensities) + Math.max(...colDensities)) / 2;
    const gaps = [];
    let inGap = false;
    let gapStart = 0;

    for (let x = 0; x < w; x++) {
        if (colDensities[x] > threshold) {
            if (inGap) {
                gaps.push(x - gapStart);
                inGap = false;
            }
        } else {
            if (!inGap) {
                gapStart = x;
                inGap = true;
            }
        }
    }

    if (gaps.length < 2) return 70;

    const gapMean = gaps.reduce((a, b) => a + b, 0) / gaps.length;
    const gapVar = gaps.reduce((a, b) => a + (b - gapMean) ** 2, 0) / gaps.length;

    const score = 100 - Math.min(30, Math.sqrt(gapVar) / 1.5);
    return score;
}

function analyzeSizeUniformity(gray, w, h) {
    // Analyze character size consistency by detecting ink regions
    const visited = new Uint8Array(gray.length);
    const regions = [];

    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const idx = y * w + x;
            if (gray[idx] < 128 && !visited[idx]) {
                // Flood fill to find connected component
                const stack = [[x, y]];
                let minX = x, maxX = x, minY = y, maxY = y;
                let pixelCount = 0;

                while (stack.length > 0) {
                    const [cx, cy] = stack.pop();
                    const cidx = cy * w + cx;
                    if (visited[cidx]) continue;
                    visited[cidx] = 1;
                    pixelCount++;

                    minX = Math.min(minX, cx);
                    maxX = Math.max(maxX, cx);
                    minY = Math.min(minY, cy);
                    maxY = Math.max(maxY, cy);

                    for (let dy = -1; dy <= 1; dy++) {
                        for (let dx = -1; dx <= 1; dx++) {
                            const nx = cx + dx, ny = cy + dy;
                            if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                                const nidx = ny * w + nx;
                                if (gray[nidx] < 128 && !visited[nidx]) {
                                    stack.push([nx, ny]);
                                }
                            }
                        }
                    }
                }

                if (pixelCount > 20) {
                    regions.push({ width: maxX - minX, height: maxY - minY, area: pixelCount });
                }
            }
        }
    }

    if (regions.length < 3) return 75;

    const sizes = regions.map(r => r.width * r.height);
    const mean = sizes.reduce((a, b) => a + b, 0) / sizes.length;
    const variance = sizes.reduce((a, b) => a + (b - mean) ** 2, 0) / sizes.length;
    const cv = Math.sqrt(variance) / mean; // coefficient of variation

    const score = 100 - Math.min(35, cv * 100);
    return score;
}

function analyzeCleanliness(gray, w, h) {
    // Count isolated small dots (smudges, dust)
    let noiseCount = 0;
    let totalInk = 0;

    for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
            const idx = y * w + x;
            if (gray[idx] < 128) {
                totalInk++;
                // Check if isolated (surrounded by white)
                let neighbors = 0;
                for (let dy = -1; dy <= 1; dy++) {
                    for (let dx = -1; dx <= 1; dx++) {
                        if (dx === 0 && dy === 0) continue;
                        if (gray[(y + dy) * w + (x + dx)] < 128) neighbors++;
                    }
                }
                if (neighbors <= 1) noiseCount++;
            }
        }
    }

    const noiseRatio = noiseCount / (totalInk + 1);
    const score = 100 - Math.min(30, noiseRatio * 500);
    return score;
}

// ===== Render Functions =====
function renderScores(scores) {
    const total = Object.values(scores).reduce((a, b) => a + b, 0) / SCORE_DIMENSIONS.length;
    document.getElementById('totalScore').textContent = Math.floor(total);

    const gradeBadge = document.getElementById('gradeBadge');
    if (total >= 85) {
        gradeBadge.textContent = '🌟 优秀';
        gradeBadge.className = 'grade grade-excellent';
    } else if (total >= 70) {
        gradeBadge.textContent = '👍 良好';
        gradeBadge.className = 'grade grade-good';
    } else if (total >= 55) {
        gradeBadge.textContent = '📖 一般';
        gradeBadge.className = 'grade grade-average';
    } else {
        gradeBadge.textContent = '💪 需加强';
        gradeBadge.className = 'grade grade-needs-work';
    }

    const details = document.getElementById('scoreDetails');
    details.innerHTML = '';
    SCORE_DIMENSIONS.forEach(dim => {
        const val = scores[dim.key];
        const item = document.createElement('div');
        item.className = 'score-item';
        item.innerHTML = `
            <span class="name">${dim.name}</span>
            <div class="bar-wrap">
                <div class="bar" style="background:${dim.color};" data-target="${val}"></div>
            </div>
            <span class="val">${val}</span>
        `;
        details.appendChild(item);
    });

    // Animate bars
    requestAnimationFrame(() => {
        document.querySelectorAll('.bar').forEach(bar => {
            bar.style.width = bar.dataset.target + '%';
        });
    });
}

function renderSuggestions(scores) {
    const list = document.getElementById('suggestionsList');
    list.innerHTML = '';

    // Find weakest areas
    const sorted = Object.entries(scores)
        .sort((a, b) => a[1] - b[1])
        .slice(0, 4);

    const usedKeys = new Set();
    sorted.forEach(([key, val]) => {
        const lib = SUGGESTION_LIBRARY[key];
        if (!lib) return;
        // Pick a suggestion not yet used
        const available = lib.filter((_, i) => !usedKeys.has(key + i));
        if (available.length === 0) return;
        const suggestion = available[0];
        const idx = lib.indexOf(suggestion);
        usedKeys.add(key + idx);

        const item = document.createElement('div');
        item.className = 'suggestion-item';
        item.style.animationDelay = '0.1s';
        item.innerHTML = `
            <div class="dot" style="background:${SCORE_DIMENSIONS.find(d => d.key === key)?.color || '#8b5e3c'}"></div>
            <div class="content">
                <div class="title">${suggestion.title} <span style="font-weight:400;color:#999;font-size:0.8em;">（${SCORE_DIMENSIONS.find(d => d.key === key)?.name}）</span></div>
                <div class="desc">${suggestion.desc}</div>
            </div>
        `;
        list.appendChild(item);
    });
}

function renderPractice(scores) {
    const grid = document.getElementById('practiceGrid');
    grid.innerHTML = '';

    // Determine difficulty based on scores
    const total = Object.values(scores).reduce((a, b) => a + b, 0) / SCORE_DIMENSIONS.length;
    const count = total < 60 ? 6 : total < 80 ? 4 : 3;

    const shuffled = [...PRACTICE_CHARS].sort(() => Math.random() - 0.5).slice(0, count);
    shuffled.forEach(item => {
        const card = document.createElement('div');
        card.className = 'practice-card';
        card.innerHTML = `
            <div class="char">${item.char}</div>
            <div class="label">${item.label}</div>
        `;
        grid.appendChild(card);
    });
}

function resetAll() {
    currentImageData = null;
    document.getElementById('analysisArea').classList.remove('active');
    document.getElementById('fileInput').value = '';
    const wrapper = document.getElementById('imageWrapper');
    wrapper.innerHTML = '<span class="placeholder">请上传作品</span>';
    document.getElementById('totalScore').textContent = '0';
    document.getElementById('gradeBadge').textContent = '待评分';
    document.getElementById('gradeBadge').className = 'grade';
    document.getElementById('scoreDetails').innerHTML = '';
    document.getElementById('suggestionsList').innerHTML = '';
    document.getElementById('practiceGrid').innerHTML = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
