<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔镜魔镜 - AI智能穿衣助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0e13;
            background-image: radial-gradient(ellipse at 50% 0%, #1a1a2e 0%, #0f0e13 70%);
            min-height: 100vh;
            padding: 30px 20px;
            color: #e8e4e0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 镜子主体 */
        .mirror {
            max-width: 480px;
            width: 100%;
            background: linear-gradient(145deg, #1e1d2b, #15141f);
            border-radius: 40px;
            padding: 24px 22px 30px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            position: relative;
        }
        /* 镜面顶部光效 */
        .mirror::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 20%;
            right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.4), rgba(59, 130, 246, 0.4), transparent);
            border-radius: 100%;
        }
        /* 顶部状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 18px;
        }
        .status-bar .time {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #c4b5fd, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-bar .weather {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #94a3b8;
        }
        .status-bar .weather .temp { font-size: 20px; font-weight: 600; color: #e8e4e0; }
        /* 镜面区域 - 模拟穿衣镜 */
        .mirror-surface {
            background: radial-gradient(ellipse at center, #1a1a2e, #0a0a12);
            border-radius: 24px;
            padding: 30px 20px 24px;
            margin-bottom: 18px;
            border: 1px solid rgba(255,255,255,0.04);
            box-shadow: inset 0 0 60px rgba(0,0,0,0.6);
            min-height: 260px;
            position: relative;
            overflow: hidden;
        }
        .mirror-surface .greeting {
            text-align: center;
            font-size: 14px;
            color: #64748b;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }
        .mirror-surface .greeting span { color: #818cf8; }
        /* 穿搭推荐展示 */
        .outfit-display {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 8px 0 4px;
        }
        .outfit-item {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 16px 8px 12px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.04);
            transition: all 0.3s;
            cursor: pointer;
        }
        .outfit-item:hover {
            background: rgba(255,255,255,0.07);
            border-color: rgba(139, 92, 246, 0.2);
            transform: translateY(-2px);
        }
        .outfit-item .emoji { font-size: 40px; display: block; margin-bottom: 6px; }
        .outfit-item .label { font-size: 11px; color: #94a3b8; }
        .outfit-item .label .highlight { color: #c4b5fd; }
        .outfit-item.active {
            border-color: rgba(139, 92, 246, 0.4);
            background: rgba(139, 92, 246, 0.08);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.05);
        }
        /* 推荐详情 */
        .recommend-detail {
            background: rgba(255,255,255,0.03);
            border-radius: 14px;
            padding: 14px 18px;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .recommend-detail .info .title { font-size: 14px; font-weight: 500; }
        .recommend-detail .info .sub { font-size: 12px; color: #94a3b8; margin-top: 2px; }
        .recommend-detail .tag {
            font-size: 11px;
            padding: 4px 14px;
            border-radius: 20px;
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
        }
        /* 衣橱快捷 */
        .wardrobe-row {
            display: flex;
            gap: 10px;
            margin: 14px 0 10px;
            flex-wrap: wrap;
        }
        .wardrobe-row .item {
            background: rgba(255,255,255,0.04);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.04);
            cursor: pointer;
            transition: all 0.2s;
            color: #cbd5e1;
        }
        .wardrobe-row .item:hover {
            background: rgba(139, 92, 246, 0.1);
            border-color: rgba(139, 92, 246, 0.2);
        }
        .wardrobe-row .item .num { color: #818cf8; font-weight: 600; }
        /* 语音交互条 */
        .voice-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255,255,255,0.03);
            border-radius: 40px;
            padding: 10px 18px 10px 22px;
            border: 1px solid rgba(255,255,255,0.04);
            margin-top: 6px;
        }
        .voice-bar .icon { font-size: 20px; }
        .voice-bar .text {
            flex: 1;
            font-size: 13px;
            color: #94a3b8;
        }
        .voice-bar .text .cmd {
            color: #c4b5fd;
            font-weight: 500;
        }
        .voice-bar .mic-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .voice-bar .mic-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.3);
        }
        .voice-bar .mic-btn.listening {
            animation: pulse-ring 1.2s infinite;
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            100% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
        }
        /* 底部 */
        .footer-text {
            text-align: center;
            color: #475569;
            font-size: 11px;
            margin-top: 18px;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255,255,255,0.04);
            padding-top: 16px;
        }
        .footer-text strong { color: #818cf8; }
        /* 响应式 */
        @media (max-width: 420px) {
            .outfit-display { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .outfit-item .emoji { font-size: 32px; }
            .mirror { padding: 16px 14px 20px; }
        }
    </style>
</head>
<body>

<div class="mirror">
    <!-- 状态栏 -->
    <div class="status-bar">
        <div class="time" id="clockDisplay">08:30</div>
        <div class="weather">
            <span>☀️</span>
            <span class="temp" id="tempDisplay">26°</span>
            <span style="font-size:13px;">晴</span>
        </div>
    </div>

    <!-- 镜面 -->
    <div class="mirror-surface" id="mirrorSurface">
        <div class="greeting">✨ 早安，<span id="userName">小造</span> · 今天想怎么穿？</div>

        <!-- 穿搭推荐 -->
        <div class="outfit-display" id="outfitGrid">
            <div class="outfit-item active" data-outfit="0">
                <span class="emoji">👔</span>
                <span class="label">通勤 <span class="highlight">· 推荐</span></span>
            </div>
            <div class="outfit-item" data-outfit="1">
                <span class="emoji">🧥</span>
                <span class="label">休闲</span>
            </div>
            <div class="outfit-item" data-outfit="2">
                <span class="emoji">🎽</span>
                <span class="label">运动</span>
            </div>
        </div>

        <!-- 推荐详情 -->
        <div class="recommend-detail" id="detailBox">
            <div class="info">
                <div class="title" id="detailTitle">👔 蓝色衬衫 + 深灰西裤</div>
                <div class="sub" id="detailSub">适合会议 · 正式中带点松弛感</div>
            </div>
            <span class="tag" id="detailTag">⭐ 匹配度 92%</span>
        </div>

        <!-- 衣橱快捷 -->
        <div class="wardrobe-row">
            <span class="item">👕 上衣 <span class="num">12</span></span>
            <span class="item">👖 下装 <span class="num">8</span></span>
            <span class="item">👟 鞋履 <span class="num">6</span></span>
            <span class="item">🧥 外套 <span class="num">5</span></span>
        </div>
    </div>

    <!-- 语音交互 -->
    <div class="voice-bar">
        <span class="icon">🔮</span>
        <div class="text">
            试试说 <span class="cmd">“魔镜魔镜，今天开会穿什么”</span>
        </div>
        <button class="mic-btn" id="micBtn" title="点击模拟语音交互">🎤</button>
    </div>

    <div class="footer-text">
        由 <strong>TRAE Work</strong> 生成 · 创意提案「魔镜魔镜」· 世界很大，放手去造 🌍
    </div>
</div>

<script>
    // ---------- 穿搭数据库 ----------
    const outfits = [{
        id: 0,
        emoji: '👔',
        name: '蓝色衬衫 + 深灰西裤',
        desc: '适合会议 · 正式中带点松弛感',
        tag: '⭐ 匹配度 92%',
        style: '通勤'
    }, {
        id: 1,
        emoji: '🧥',
        name: '米色针织衫 + 卡其裤',
        desc: '慵懒周末 · 温暖又随性',
        tag: '⭐ 匹配度 88%',
        style: '休闲'
    }, {
        id: 2,
        emoji: '🎽',
        name: '速干T恤 + 运动短裤',
        desc: '健身房走起 · 透气舒适',
        tag: '⭐ 匹配度 85%',
        style: '运动'
    }, {
        id: 3,
        emoji: '🧶',
        name: '高领毛衣 + 羊毛大衣',
        desc: '降温预警 · 保暖又有型',
        tag: '⭐ 匹配度 90%',
        style: '通勤'
    }, {
        id: 4,
        emoji: '👗',
        name: '碎花连衣裙 + 开衫',
        desc: '春日约会 · 温柔气质拉满',
        tag: '⭐ 匹配度 87%',
        style: '休闲'
    }];

    // ---------- 语音指令库 ----------
    const voiceResponses = {
        '开会': { outfit: 0, msg: '✅ 已切换到通勤模式 · 蓝色衬衫 + 深灰西裤' },
        '休闲': { outfit: 1, msg: '✅ 已切换到休闲模式 · 米色针织衫 + 卡其裤' },
        '运动': { outfit: 2, msg: '✅ 已切换到运动模式 · 速干T恤 + 运动短裤' },
        '冷': { outfit: 3, msg: '✅ 已切换到保暖模式 · 高领毛衣 + 羊毛大衣' },
        '约会': { outfit: 4, msg: '✅ 已切换到约会模式 · 碎花连衣裙 + 开衫' },
        '推荐': { outfit: 0, msg: '✨ 今日首选 · 蓝色衬衫 + 深灰西裤，正式又清爽' },
        '随便': { outfit: Math.floor(Math.random() * 5), msg: '🎲 帮你随机选了一套 · 看看喜不喜欢' },
    };

    let currentOutfit = 0;
    const detailTitle = document.getElementById('detailTitle');
    const detailSub = document.getElementById('detailSub');
    const detailTag = document.getElementById('detailTag');
    const outfitItems = document.querySelectorAll('.outfit-item');
    const micBtn = document.getElementById('micBtn');
    const userName = document.getElementById('userName');

    // ---------- 更新穿搭显示 ----------
    function updateOutfit(index) {
        const outfit = outfits[index];
        if (!outfit) return;
        currentOutfit = index;
        detailTitle.textContent = outfit.emoji + ' ' + outfit.name;
        detailSub.textContent = outfit.desc;
        detailTag.textContent = outfit.tag;

        // 更新激活样式
        outfitItems.forEach((el, i) => {
            el.classList.toggle('active', i === index);
        });

        // 镜面微反馈
        const surface = document.getElementById('mirrorSurface');
        surface.style.transition = 'box-shadow 0.3s';
        surface.style.boxShadow = 'inset 0 0 80px rgba(139, 92, 246, 0.05)';
        setTimeout(() => {
            surface.style.boxShadow = 'inset 0 0 60px rgba(0,0,0,0.6)';
        }, 400);
    }

    // ---------- 处理语音指令 ----------
    function processVoice(command) {
        const lower = command.toLowerCase();
        let matched = false;

        for (const [key, value] of Object.entries(voiceResponses)) {
            if (lower.includes(key)) {
                const idx = typeof value.outfit === 'number' ? value.outfit : 0;
                updateOutfit(idx);
                // 更新问候语
                document.querySelector('.greeting').innerHTML = `🔮 ${value.msg}`;
                matched = true;
                break;
            }
        }

        if (!matched) {
            document.querySelector('.greeting').innerHTML = `🤔 没听清，试试说“开会”、“休闲”、“运动”、“冷”、“约会”或“推荐”`;
            // 3秒后恢复
            setTimeout(() => {
                document.querySelector('.greeting').innerHTML = `✨ 早安，${userName.textContent} · 今天想怎么穿？`;
            }, 3000);
        } else {
            // 5秒后恢复默认问候
            setTimeout(() => {
                document.querySelector('.greeting').innerHTML = `✨ 早安，${userName.textContent} · 今天想怎么穿？`;
            }, 4000);
        }
    }

    // ---------- 模拟语音交互 ----------
    micBtn.addEventListener('click', function() {
        this.classList.add('listening');
        this.textContent = '⏳';

        const commands = ['开会', '休闲', '运动', '冷', '约会', '推荐', '随便'];
        const randomCmd = commands[Math.floor(Math.random() * commands.length)];

        // 模拟语音识别延迟
        setTimeout(() => {
            this.classList.remove('listening');
            this.textContent = '🎤';
            processVoice(randomCmd);
            // 在语音条显示识别的指令
            document.querySelector('.voice-bar .text').innerHTML =
                `🎙️ 识别到：<span class="cmd">“${randomCmd}”</span>`;
            setTimeout(() => {
                document.querySelector('.voice-bar .text').innerHTML =
                    `试试说 <span class="cmd">“魔镜魔镜，今天开会穿什么”</span>`;
            }, 3500);
        }, 1200 + Math.random() * 800);
    });

    // ---------- 点击穿搭卡片切换 ----------
    outfitItems.forEach((el) => {
        el.addEventListener('click', function() {
            const idx = parseInt(this.dataset.outfit);
            updateOutfit(idx);
            document.querySelector('.greeting').innerHTML = `👗 已切换到「${outfits[idx].style}」风格`;
            setTimeout(() => {
                document.querySelector('.greeting').innerHTML = `✨ 早安，${userName.textContent} · 今天想怎么穿？`;
            }, 2500);
        });
    });

    // ---------- 时钟 ----------
    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('clockDisplay').textContent = h + ':' + m;
    }
    updateClock();
    setInterval(updateClock, 30000);

    // ---------- 温度模拟微变化 ----------
    const temps = ['26°', '27°', '25°', '28°', '24°'];
    let tempIdx = 0;
    setInterval(() => {
        tempIdx = (tempIdx + 1) % temps.length;
        document.getElementById('tempDisplay').textContent = temps[tempIdx];
    }, 8000);

    // ---------- 初始化 ----------
    updateOutfit(0);
</script>
</body>
</html>
