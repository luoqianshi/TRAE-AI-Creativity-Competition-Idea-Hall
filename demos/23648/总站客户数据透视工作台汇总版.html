<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>总战客户数据透视工作台</title>
    <script src="xlsx.full.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
        body{background:linear-gradient(145deg,#f0f4fa 0%,#e9eef5 100%);min-height:100vh;padding:32px 24px;display:flex;flex-direction:column;align-items:center}
        .app-container{max-width:1400px;width:100%;background:rgba(255,255,255,0.6);backdrop-filter:blur(2px);border-radius:40px;padding:32px 36px;box-shadow:0 30px 50px rgba(0,20,40,0.12);border:1px solid rgba(255,255,255,0.6)}
        h1{font-size:2.4rem;font-weight:600;letter-spacing:-0.02em;color:#0b2a41;margin-bottom:8px;display:flex;align-items:center;gap:12px}
        h1 span{background:#1e3a5f;color:white;font-size:1rem;font-weight:400;padding:6px 16px;border-radius:60px;letter-spacing:normal;vertical-align:middle}
        .subtitle{font-size:1.1rem;color:#2f4858;margin-bottom:36px;padding-left:18px;border-left:6px solid #3b6e9e;background:rgba(59,110,158,0.06);border-radius:0 20px 20px 0;line-height:1.5;font-weight:350}
        .upload-grid{display:flex;flex-wrap:wrap;gap:24px;margin-bottom:36px}
        .upload-card{flex:1 1 260px;background:#ffffffd9;backdrop-filter:blur(4px);border-radius:32px;padding:28px 22px;box-shadow:0 10px 20px -8px rgba(0,32,64,0.08);border:1px solid rgba(255,255,255,0.8);transition:transform 0.2s,box-shadow 0.2s}
        .upload-card:hover{transform:translateY(-4px);box-shadow:0 24px 36px -12px rgba(23,55,83,0.2);background:#ffffff}
        .upload-card h3{font-size:1.5rem;font-weight:500;margin-bottom:10px;display:flex;align-items:center;gap:8px;color:#153e5a}
        .upload-card small{display:block;color:#4f6f8c;font-size:0.9rem;margin-bottom:20px;font-weight:350}
        .file-input{width:100%;padding:10px 0;font-size:0.95rem;color:#1e3a5f}
        .badge{background:#e3ecf5;border-radius:30px;padding:8px 18px;font-size:0.9rem;font-weight:500;color:#1f4970;display:inline-block;margin-top:16px;border:1px solid #b9d1e9}
        .action-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;background:#ffffffb3;backdrop-filter:blur(8px);padding:16px 32px;border-radius:60px;margin:30px 0 40px;box-shadow:0 10px 20px rgba(0,25,45,0.06);border:1px solid rgba(255,255,255,0.7)}
        .action-bar button{background:#1e3a5f;border:none;color:white;font-weight:550;padding:16px 42px;border-radius:40px;font-size:1.2rem;cursor:pointer;transition:0.2s;box-shadow:0 12px 18px -10px #0b2a41;border:1px solid #ffffff40;letter-spacing:0.3px}
        .action-bar button:hover:not(:disabled){background:#143857;transform:scale(1.02);box-shadow:0 20px 24px -10px #0b2a41}
        .action-bar button:disabled{background:#9bb0c5;box-shadow:none;cursor:not-allowed;opacity:0.7}
        #globalMsg{font-size:1.05rem;font-weight:450;color:#15507b;background:#e2eefb;padding:8px 24px;border-radius:40px}
        .processed-preview{display:flex;flex-wrap:wrap;gap:24px;margin:30px 0 40px}
        .preview-card{flex:1 1 300px;background:#ffffff;border-radius:32px;padding:22px 26px;box-shadow:0 18px 30px -12px #1e3a5f26;border:1px solid #eef4fa}
        .preview-card h4{font-size:1.3rem;font-weight:520;display:flex;align-items:center;justify-content:space-between;color:#103450;margin-bottom:20px}
        .download-btn{background:#2b6f9b;border:none;color:white;font-size:1rem;font-weight:500;padding:12px 24px;border-radius:36px;cursor:pointer;transition:0.15s;box-shadow:0 4px 10px rgba(31,95,143,0.3);width:100%;max-width:240px}
        .download-btn:hover{background:#1e5b82}
        .pivot-area{display:flex;flex-wrap:wrap;gap:28px;margin-top:20px}
        .pivot-panel{flex:1 1 400px;background:#ffffffeb;backdrop-filter:blur(4px);border-radius:36px;padding:28px 30px;box-shadow:0 20px 30px -12px #112b3f1a;border:1px solid #ffffff}
        .pivot-panel h3{font-size:1.6rem;font-weight:500;margin-top:0;margin-bottom:20px;color:#113753;display:flex;align-items:center;gap:8px}
        .pivot-controls{background:#ecf3fc;border-radius:28px;padding:22px;margin-bottom:25px;border:1px solid #cbdef2}
        .pivot-controls label{font-weight:550;color:#1b4465;margin-top:12px;margin-bottom:4px;display:block}
        .search-box{width:100%;padding:10px 16px;border-radius:30px;border:1px solid #b1cae2;background:white;font-size:0.9rem;margin-bottom:8px;transition:0.15s}
        .search-box:focus{border-color:#1e3a5f;outline:none;box-shadow:0 0 0 3px #8bb3d9}
        select,.multiselect{width:100%;padding:14px 18px;border-radius:30px;border:1px solid #b1cae2;background:white;font-size:0.95rem;margin-bottom:18px;transition:0.15s}
        select:focus,.multiselect:focus{border-color:#1e3a5f;outline:none;box-shadow:0 0 0 3px #8bb3d9}
        /* 自定义多选下拉组件 */
        .ms-dropdown{position:relative;width:100%;margin-bottom:18px}
        .ms-trigger{width:100%;padding:14px 18px;border-radius:30px;border:1px solid #b1cae2;background:white;font-size:0.95rem;cursor:pointer;min-height:48px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;transition:0.15s;line-height:1.4}
        .ms-trigger:hover{border-color:#8bb3d9}
        .ms-trigger.open{border-color:#1e3a5f;box-shadow:0 0 0 3px #8bb3d9;border-radius:16px 16px 0 0}
        .ms-trigger .placeholder{color:#999}
        .ms-trigger .tag{background:#e3ecf5;border-radius:20px;padding:2px 10px;font-size:0.8rem;color:#1f4970;white-space:nowrap}
        .ms-trigger .arrow{margin-left:auto;flex-shrink:0;font-size:0.7rem;color:#6a8fa8;transition:transform 0.2s}
        .ms-trigger.open .arrow{transform:rotate(180deg)}
        .ms-panel{display:none;position:absolute;top:100%;left:0;right:0;background:white;border:1px solid #1e3a5f;border-top:none;border-radius:0 0 16px 16px;max-height:220px;overflow-y:auto;z-index:100;box-shadow:0 8px 20px rgba(0,20,40,0.12)}
        .ms-panel.show{display:block}
        .ms-option{padding:10px 18px;cursor:pointer;font-size:0.9rem;display:flex;align-items:center;gap:10px;transition:background 0.1s}
        .ms-option:hover{background:#ecf3fc}
        .ms-option.checked{background:#e8f0fa}
        .ms-option .ck{width:16px;height:16px;border-radius:4px;border:2px solid #b1cae2;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:white;transition:0.15s}
        .ms-option.checked .ck{background:#1e3a5f;border-color:#1e3a5f}
        .ms-option .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .pivot-controls button{background:#1e3a5f;color:white;border:none;padding:14px 26px;border-radius:40px;font-weight:550;font-size:1.05rem;cursor:pointer;margin-top:8px;box-shadow:0 8px 14px -8px #0a2d49}
        .pivot-controls button:hover{background:#12324d}
        .pivot-table-wrap{max-height:340px;overflow:auto;border-radius:24px;background:#ffffff;border:1px solid #d5e2f0;padding:4px}
        .pivot-table-wrap table{border-collapse:collapse;width:100%;font-size:0.85rem}
        .pivot-table-wrap th{background:#d6e4f0;color:#0f3c5c;font-weight:600;padding:12px 10px;position:sticky;top:0;border-bottom:2px solid #8faec9}
        .pivot-table-wrap td{padding:10px;border:1px solid #cbdae9}
        .pivot-buttons{display:flex;gap:16px;margin-top:22px}
        .pivot-buttons button{background:#ffffff;border:1.5px solid #1e3a5f;color:#1e3a5f;font-weight:550;padding:12px 26px;border-radius:40px;cursor:pointer;transition:0.15s}
        .pivot-buttons button:hover:not(:disabled){background:#1e3a5f;color:white}
        .pivot-buttons button:disabled{opacity:0.4;border-color:#a0b6cc;color:#5f7a97;cursor:default}
        footer{margin-top:60px;color:#396684;font-size:0.9rem;text-align:center;border-top:1px dashed #b1cae2;padding-top:28px}
        @media(max-width:700px){.app-container{padding:20px}h1{font-size:1.9rem}.action-bar{flex-direction:column;align-items:stretch;gap:16px}}
    
    .summary-section{display:none;margin:30px 0 40px}
    .summary-card{background:#ffffff;border-radius:32px;padding:22px 26px;box-shadow:0 18px 30px -12px #1e3a5f26;border:1px solid #eef4fa}
    .summary-card h4{font-size:1.3rem;font-weight:520;display:flex;align-items:center;justify-content:space-between;color:#103450;margin-bottom:20px}
    .summary-table-wrap{max-height:500px;overflow:auto;border-radius:24px;background:#ffffff;border:1px solid #d5e2f0;padding:4px}
    .summary-table-wrap table{border-collapse:collapse;width:100%;font-size:0.85rem}
    .summary-table-wrap th{background:#d6e4f0;color:#0f3c5c;font-weight:600;padding:10px 8px;position:sticky;top:0;border-bottom:2px solid #8faec9;white-space:nowrap}
    .summary-table-wrap td{padding:8px 6px;border:1px solid #cbdae9;text-align:center;white-space:nowrap}
    .summary-table-wrap tr:last-child td{font-weight:bold;background:#e8f0fa}
    .summary-table-wrap .group-name{text-align:left;max-width:300px;overflow:hidden;text-overflow:ellipsis}
    .summary-msg{font-size:0.95rem;color:#4f6f8c;margin-bottom:16px;padding:10px 16px;background:#f0f6fc;border-radius:16px}

    </style>
</head>
<body>
<div class="app-container">
    <h1>📋 总战客户数据透视工作台 <span>离线版</span></h1>
    <div class="subtitle">智能合并多Sheet · 文本自动转换数值</div>
    <div class="upload-grid">
        <div class="upload-card">
            <h3>&#127970; 存款台账</h3>
            <small>自动合并所有工作表</small>
            <input type="file" class="file-input" id="fileDeposit" accept=".xlsx,.xls,.csv">
            <div id="depositStatus" class="badge">未上传</div>
        </div>
        <div class="upload-card">
            <h3>&#128176; 贷款台账</h3>
            <small>自动合并所有工作表</small>
            <input type="file" class="file-input" id="fileLoan" accept=".xlsx,.xls,.csv">
            <div id="loanStatus" class="badge">未上传</div>
        </div>
        <div class="upload-card">
            <h3>&#127970; 集团成员明细</h3>
            <small>需「集团名称」「客户名称」列</small>
            <input type="file" class="file-input" id="fileGroup" accept=".xlsx,.xls,.csv">
            <div id="groupStatus" class="badge">未上传</div>
        </div>
    </div>
    <div class="action-bar">
        <button id="processBtn" disabled>&#9881; 开始处理</button>
        <span id="globalMsg">⏳ 等待文件上传</span>
    </div>
    <div class="processed-preview" id="processedPreview" style="display:none">
        <div class="preview-card">
            <h4>✅ 总战存款台账 <span id="depositCount"></span></h4>
            <button class="download-btn" id="downloadDeposit">⬇ 总战存款台账下载</button>
        </div>
        <div class="preview-card">
            <h4>✅ 总战贷款台账 <span id="loanCount"></span></h4>
            <button class="download-btn" id="downloadLoan">⬇ 总战贷款台账下载</button>
        </div>
    </div>

    <div class="summary-section" id="summarySection">
        <div style="font-size:1.8rem;font-weight:540;margin:0 0 16px;color:#103a57;border-bottom:2px solid #b9cde0;padding-bottom:8px">📊 存贷款汇总表</div>
        <div class="summary-card">
            <h4>📋 总战集团客户存贷款汇总表 <span id="summaryCount"></span></h4>
            <div class="summary-msg" id="summaryMsg">汇总数据预览（单位：亿元，利率为百分比）</div>
            <div class="summary-table-wrap" id="summaryTable"><small>处理完成后自动生成</small></div>
            <div style="margin-top:22px">
                <button class="download-btn" id="downloadSummary" disabled>⬇ 总战集团客户存贷款汇总表下载</button>
            </div>
        </div>
    </div>

    <div style="font-size:1.8rem;font-weight:540;margin:50px 0 16px;color:#103a57;border-bottom:2px solid #b9cde0;padding-bottom:8px">&#128269; 自定义数据透视</div>
    <div class="pivot-area">
        <div class="pivot-panel" id="depositPivotPanel" style="display:none">
            <h3>&#128203; 存款透视配置</h3>
            <div class="pivot-controls">
                <label>&#128204; 行字段 (单选)</label>
                <input type="text" class="search-box" id="depRowSearch" placeholder="搜索字段...">
                <select id="depRowField"></select>
                <label>&#128202; 值字段 (可多选)</label>
                <input type="text" class="search-box" id="depValSearch" placeholder="搜索字段...">
                <div class="ms-dropdown" id="depValFields"></div>
                <label>&#9881; 聚合方式</label>
                <select id="depAggFunc"><option value="sum">求和 (SUM)</option><option value="count">计数 (COUNT)</option><option value="avg">平均值 (AVG)</option></select>
                <button id="runDepPivot">&#128202; 生成透视表</button>
            </div>
            <div class="pivot-table-wrap" id="depPivotTable"><small>点击生成预览</small></div>
            <div class="pivot-buttons"><button id="downloadDepPivot" disabled>&#11015; 下载透视表</button></div>
        </div>
        <div class="pivot-panel" id="loanPivotPanel" style="display:none">
            <h3>&#128203; 贷款透视配置</h3>
            <div class="pivot-controls">
                <label>&#128204; 行字段 (单选)</label>
                <input type="text" class="search-box" id="loanRowSearch" placeholder="搜索字段...">
                <select id="loanRowField"></select>
                <label>&#128202; 值字段 (可多选)</label>
                <input type="text" class="search-box" id="loanValSearch" placeholder="搜索字段...">
                <div class="ms-dropdown" id="loanValFields"></div>
                <label>&#9881; 聚合方式</label>
                <select id="loanAggFunc"><option value="sum">求和 (SUM)</option><option value="count">计数 (COUNT)</option><option value="avg">平均值 (AVG)</option></select>
                <button id="runLoanPivot">&#128202; 生成透视表</button>
            </div>
            <div class="pivot-table-wrap" id="loanPivotTable"><small>点击生成预览</small></div>
            <div class="pivot-buttons"><button id="downloadLoanPivot" disabled>&#11015; 下载透视表</button></div>
        </div>
    </div>
    <footer>⚡ 完全离线处理 · 智能合并多Sheet · 文本自动转换数值      Designed by 黄亦鑫</footer>
</div>

(function(){
    // ========== 工具函数 ==========
    var getCurrentDate = function(){
        var d = new Date();
        return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    };

    // Excel日期序列号转换
    var EPOCH = new Date(Date.UTC(1899,11,30));
    var MS_PER_DAY = 864e5;
    var excelSerialToDate = function(serial){
        if(typeof serial !== 'number' || serial < 1 || serial > 2958465) return serial;
        var d = new Date(EPOCH.getTime() + serial * MS_PER_DAY);
        return d.getUTCFullYear() + '/' + String(d.getUTCMonth()+1).padStart(2,'0') + '/' + String(d.getUTCDate()).padStart(2,'0');
    };

    // 日期关键词集合
    var DATE_KEYWORDS = ['起始日','终止日','日期','起贷日','结束日','贷款起始日','贷款终止日','放款日','到期日'];
    var convertDateColumns = function(dataArray){
        if(!dataArray || !dataArray[1]) return dataArray;
        var header = dataArray[0].map(function(h){ return String(h).trim().toLowerCase(); });
        var dateIndices = [];
        for(var i=0;i<header.length;i++){
            for(var j=0;j<DATE_KEYWORDS.length;j++){
                if(header[i].indexOf(DATE_KEYWORDS[j]) !== -1){ dateIndices.push(i); break; }
            }
        }
        if(!dateIndices.length) return dataArray;
        
        var result = [dataArray[0]];
        for(var r=1;r<dataArray.length;r++){
            var row = dataArray[r], newRow = row.slice();
            for(var i=0;i<dateIndices.length;i++){
                var val = newRow[dateIndices[i]];
                if(typeof val === 'number') newRow[dateIndices[i]] = excelSerialToDate(val);
                else if(typeof val === 'string' && /^\d+$/.test(val.trim())){
                    var num = parseFloat(val);
                    if(!isNaN(num)) newRow[dateIndices[i]] = excelSerialToDate(num);
                }
            }
            result.push(newRow);
        }
        return result;
    };

    // 读取所有Sheet
    var readAllSheets = function(file){
        return new Promise(function(resolve, reject){
            var reader = new FileReader();
            reader.onload = function(e){
                try{
                    var wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
                    var sheets = [];
                    for(var i=0;i<wb.SheetNames.length;i++){
                        var name = wb.SheetNames[i];
                        sheets.push({
                            sheetName: name,
                            data: XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:''})
                        });
                    }
                    resolve(sheets);
                }catch(err){ reject(err); }
            };
            reader.onerror = reject;
            reader.readAsArrayBuffer(file);
        });
    };

    // 智能合并多Sheet
    var mergeSheetsByColumnHint = function(sheetsArray, requiredColumnHint){
        requiredColumnHint = requiredColumnHint || '客户名称';
        var merged = [], hintLower = requiredColumnHint.toLowerCase();
        var firstHeader = null, headerLen = 0;
        
        for(var s=0;s<sheetsArray.length;s++){
            var data = sheetsArray[s].data;
            if(!data || !data.length) continue;
            var headerIdx = -1;
            for(var i=0;i<data.length;i++){
                var row = data[i];
                if(!row || !row.length) continue;
                var nonEmpty = 0, hasHint = false;
                for(var c=0;c<row.length;c++){
                    var cell = row[c];
                    if(cell != null && cell !== ''){
                        nonEmpty++;
                        if(!hasHint && typeof cell === 'string' && cell.toLowerCase().indexOf(hintLower) !== -1) hasHint = true;
                    }
                }
                if(hasHint && nonEmpty >= 2){ headerIdx = i; break; }
            }
            if(headerIdx === -1) continue;
            
            var headerRow = data[headerIdx];
            if(!firstHeader){
                firstHeader = headerRow.slice();
                headerLen = firstHeader.length;
                merged.push(firstHeader);
            }else if(headerRow.length !== headerLen){
                console.warn('Sheet列数不一致，跳过');
                continue;
            }
            
            for(var r=headerIdx+1;r<data.length;r++){
                var row = data[r];
                if(!row || !row.length) continue;
                var empty = true;
                for(var c=0;c<row.length;c++){ if(row[c] != null && row[c] !== ''){ empty = false; break; } }
                if(empty) continue;
                var newRow = new Array(headerLen);
                for(var c=0;c<headerLen;c++) newRow[c] = c < row.length ? row[c] : '';
                merged.push(newRow);
            }
        }
        return merged;
    };

    // 数值列转换
    var NUMERIC_KEYWORDS = ['余额','日均','金额','利率','欠息','利息','本金','贷款余额','逾期','费用','价格','数量','合同金额','借据金额','总授信','净值','资产'];
    var convertNumericColumns = function(dataArray){
        if(!dataArray || !dataArray.length) return dataArray;
        var header = dataArray[0].map(function(h){ return String(h).trim().toLowerCase(); });
        var isNumericCol = [];
        for(var i=0;i<header.length;i++){
            var found = false;
            for(var j=0;j<NUMERIC_KEYWORDS.length;j++){
                if(header[i].indexOf(NUMERIC_KEYWORDS[j]) !== -1){ found = true; break; }
            }
            isNumericCol.push(found);
        }
        
        var result = [dataArray[0]];
        for(var r=1;r<dataArray.length;r++){
            var row = dataArray[r], newRow = new Array(header.length);
            for(var c=0;c<header.length;c++){
                var val = row[c] !== undefined ? row[c] : '';
                if(isNumericCol[c] && typeof val === 'string'){
                    var cleaned = val.replace(/,/g, '').trim();
                    var num = parseFloat(cleaned);
                    newRow[c] = (!isNaN(num) && cleaned !== '') ? num : val;
                }else{ newRow[c] = val; }
            }
            result.push(newRow);
        }
        return result;
    };

    // 集团映射构建
    var buildGroupMap = function(mergedData){
        if(!mergedData || !mergedData[1]) return new Map();
        var header = mergedData[0].map(function(h){ return String(h).trim().toLowerCase(); });
        var groupIdx = -1, custIdx = -1;
        for(var i=0;i<header.length;i++){
            var h = header[i];
            if(h.indexOf('集团') !== -1 && h.indexOf('名称') !== -1) groupIdx = i;
            else if(h.indexOf('客户名称') !== -1 || (h.indexOf('客户') !== -1 && h.indexOf('名称') !== -1)) custIdx = i;
        }
        if(groupIdx === -1 && custIdx === -1 && header.length >= 2){ groupIdx = 0; custIdx = 1; }
        if(groupIdx === -1 || custIdx === -1) throw new Error('集团成员表中无法定位"集团名称"或"客户名称"列');
        
        var map = new Map(), maxIdx = Math.max(groupIdx, custIdx);
        for(var r=1;r<mergedData.length;r++){
            var row = mergedData[r];
            if(row.length <= maxIdx) continue;
            var cust = String(row[custIdx] || '').trim();
            if(cust && !map.has(cust)) map.set(cust, String(row[groupIdx] || '').trim());
        }
        return map;
    };

    // 过滤并添加集团列
    var filterAndAddGroup = function(dataArray, groupMap){
        if(!dataArray || !dataArray.length) return [[]];
        var header = dataArray[0].map(function(h){ return String(h).trim(); });
        var custIdx = -1;
        for(var i=0;i<header.length;i++){
            if(header[i].indexOf('客户名称') !== -1){ custIdx = i; break; }
        }
        if(custIdx === -1) throw new Error('找不到"客户名称"列，请检查文件标题');
        
        var newHeader = new Array(header.length + 1);
        for(var i=0,j=0;i<header.length;i++){
            newHeader[j++] = header[i];
            if(i === custIdx) newHeader[j++] = '所属集团';
        }
        
        var result = [newHeader];
        for(var r=1;r<dataArray.length;r++){
            var row = dataArray[r];
            if(row.length <= custIdx) continue;
            var custName = String(row[custIdx] || '').trim();
            var groupName = groupMap.get(custName);
            if(!groupName) continue;
            
            var newRow = new Array(newHeader.length);
            for(var i=0,j=0;i<row.length;i++){
                newRow[j++] = row[i];
                if(i === custIdx) newRow[j++] = groupName;
            }
            while(newRow.length < newHeader.length) newRow.push('');
            result.push(newRow);
        }
        return result;
    };

    // 透视核心
    var pivotData = function(dataArray, rowIdx, valIndices, aggFunc){
        if(!dataArray || !dataArray[1]) return {pivot:[['无数据']], detail:dataArray};
        var header = dataArray[0], rows = dataArray.slice(1);
        var maxIdx = rowIdx;
        for(var i=0;i<valIndices.length;i++) if(valIndices[i] > maxIdx) maxIdx = valIndices[i];
        var map = {};
        
        for(var r=0;r<rows.length;r++){
            var row = rows[r];
            if(row.length <= maxIdx) continue;
            var key = String(row[rowIdx] || '空').trim();
            if(!map[key]) map[key] = {count:0, sums:new Array(valIndices.length).fill(0)};
            map[key].count++;
            for(var i=0;i<valIndices.length;i++){
                var val = parseFloat(String(row[valIndices[i]] || '0').replace(/,/g, '')) || 0;
                map[key].sums[i] += val;
            }
        }
        
        var aggSuffix = aggFunc === 'sum' ? '_SUM' : aggFunc === 'avg' ? '_AVG' : '_COUNT';
        var resultHeader = [header[rowIdx]];
        for(var i=0;i<valIndices.length;i++) resultHeader.push(header[valIndices[i]] + aggSuffix);
        var resultRows = [];
        
        for(var key in map){
            var entry = map[key];
            var row = [key];
            if(aggFunc === 'sum'){ for(var i=0;i<valIndices.length;i++) row.push(entry.sums[i]); }
            else if(aggFunc === 'count'){ for(var i=0;i<valIndices.length;i++) row.push(entry.count); }
            else{ for(var i=0;i<valIndices.length;i++) row.push(entry.count ? entry.sums[i] / entry.count : 0); }
            resultRows.push(row);
        }
        resultRows.sort(function(a,b){ return String(a[0]).localeCompare(String(b[0])); });
        return {pivot:[resultHeader].concat(resultRows), detail:dataArray};
    };

    // 渲染透视表
    var renderPivotTable = function(container, pivotArray){
        if(!pivotArray || !pivotArray.length){ container.innerHTML = '<small>无数据</small>'; return; }
        var table = document.createElement('table');
        var thead = document.createElement('thead');
        var headerTr = document.createElement('tr');
        for(var i=0;i<pivotArray[0].length;i++){
            var th = document.createElement('th');
            th.textContent = pivotArray[0][i];
            headerTr.appendChild(th);
        }
        thead.appendChild(headerTr);
        
        var tbody = document.createElement('tbody');
        for(var r=1;r<pivotArray.length;r++){
            var tr = document.createElement('tr');
            for(var c=0;c<pivotArray[r].length;c++){
                var td = document.createElement('td');
                td.textContent = pivotArray[r][c] != null ? pivotArray[r][c] : '';
                tr.appendChild(td);
            }
            tbody.appendChild(tr);
        }
        
        table.appendChild(thead);
        table.appendChild(tbody);
        container.innerHTML = '';
        container.appendChild(table);
    };

    // 下载Excel - 长数字强制文本格式防科学计数法，日期字符串强制文本格式防格式变化
    var downloadExcel = function(aoaArray, filename){
        var wb = XLSX.utils.book_new();
        var ws = XLSX.utils.aoa_to_sheet(aoaArray);
        var range = XLSX.utils.decode_range(ws['!ref'] || 'A1');
        for(var R = range.s.r; R <= range.e.r; R++){
            for(var C = range.s.c; C <= range.e.c; C++){
                var addr = XLSX.utils.encode_cell({r:R, c:C});
                var cell = ws[addr];
                if(!cell) continue;
                // 16位以上纯数字 → 文本（防科学计数法）
                if(typeof cell.v === 'string' && /^\d{16,}$/.test(cell.v)){
                    cell.t = 's';
                    cell.z = '@';
                }
                // 日期字符串如 2025/09/24 → 文本（防Excel自动转日期格式）
                if(cell.t === 'd' || (typeof cell.v === 'string' && /^\d{4}\/\d{1,2}\/\d{1,2}$/.test(cell.v))){
                    cell.t = 's';
                    cell.z = '@';
                }
            }
        }
        XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
        XLSX.writeFile(wb, filename);
    };

    // 自定义多选下拉组件
    function createMultiSelect(container, opts, defaultChecked){
        container.innerHTML = '';
        container._opts = opts;
        container._selected = {};
        // 标记默认选中
        if(defaultChecked){
            for(var i=0;i<opts.length;i++){
                var h = opts[i].text.toLowerCase();
                if(h.indexOf('余额') !== -1 || h.indexOf('日均') !== -1 || h.indexOf('金额') !== -1 || 
                   h.indexOf('利率') !== -1 || h.indexOf('欠息') !== -1 || h.indexOf('贷款余额') !== -1 || h.indexOf('利息') !== -1){
                    container._selected[opts[i].value] = true;
                }
            }
        }
        // 创建trigger
        var trigger = document.createElement('div');
        trigger.className = 'ms-trigger';
        container.appendChild(trigger);
        // 创建panel
        var panel = document.createElement('div');
        panel.className = 'ms-panel';
        container.appendChild(panel);

        function renderTrigger(){
            trigger.innerHTML = '';
            var keys = Object.keys(container._selected);
            if(!keys.length){
                var ph = document.createElement('span');
                ph.className = 'placeholder';
                ph.textContent = '请选择值字段...';
                trigger.appendChild(ph);
            }else{
                for(var i=0;i<keys.length;i++){
                    var tag = document.createElement('span');
                    tag.className = 'tag';
                    tag.textContent = getOptText(keys[i]);
                    trigger.appendChild(tag);
                }
            }
            var arrow = document.createElement('span');
            arrow.className = 'arrow';
            arrow.textContent = '\u25BC';
            trigger.appendChild(arrow);
        }

        function renderPanel(filterTerm){
            panel.innerHTML = '';
            var term = (filterTerm || '').toLowerCase();
            for(var i=0;i<opts.length;i++){
                if(term && opts[i].text.toLowerCase().indexOf(term) === -1) continue;
                var opt = document.createElement('div');
                opt.className = 'ms-option' + (container._selected[opts[i].value] ? ' checked' : '');
                opt.setAttribute('data-val', opts[i].value);
                opt.innerHTML = '<span class="ck">' + (container._selected[opts[i].value] ? '&#10003;' : '') + '</span><span class="lbl">' + opts[i].text + '</span>';
                (function(val){
                    opt.addEventListener('click', function(e){
                        e.stopPropagation();
                        if(container._selected[val]) delete container._selected[val];
                        else container._selected[val] = true;
                        renderPanel(term);
                        renderTrigger();
                    });
                })(opts[i].value);
                panel.appendChild(opt);
            }
        }

        function getOptText(val){
            for(var i=0;i<opts.length;i++) if(opts[i].value === val) return opts[i].text;
            return val;
        }

        trigger.addEventListener('click', function(e){
            e.stopPropagation();
            var isOpen = panel.classList.contains('show');
            // 先关闭所有其他下拉
            document.querySelectorAll('.ms-panel.show').forEach(function(p){ p.classList.remove('show'); });
            document.querySelectorAll('.ms-trigger.open').forEach(function(t){ t.classList.remove('open'); });
            if(!isOpen){
                panel.classList.add('show');
                trigger.classList.add('open');
                renderPanel('');
            }
        });

        container.renderTrigger = renderTrigger;
        container.renderPanel = renderPanel;
        container.getSelectedValues = function(){
            return Object.keys(container._selected).map(function(v){ return parseInt(v, 10); });
        };
        renderTrigger();
        renderPanel('');
        return container;
    }

        document.querySelectorAll('.ms-panel.show').forEach(function(p){ p.classList.remove('show'); });
        document.querySelectorAll('.ms-trigger.open').forEach(function(t){ t.classList.remove('open'); });
    });

    function populateSelect(selectEl, headers, multiple, saveOpts){
        selectEl.innerHTML = '';
        var opts = [];
        for(var i=0;i<headers.length;i++){
            var opt = document.createElement('option');
            opt.value = i;
            opt.textContent = headers[i] + ' [' + i + ']';
            selectEl.appendChild(opt);
            opts.push({value: String(i), text: headers[i] + ' [' + i + ']'});
        }
        
        if(multiple){
            // 使用自定义多选下拉组件（不默认选中）
            createMultiSelect(selectEl, opts, false);
        }else if(selectEl.options.length){
            selectEl.options[0].selected = true;
        }
        
        if(saveOpts) saveOpts(opts);
    }

    function filterSelect(selectEl, searchInput, originalOpts){
        // 如果是自定义多选组件
        if(selectEl.classList && selectEl.classList.contains('ms-dropdown')){
            var term = searchInput.value.toLowerCase();
            // 搜索时自动展开下拉面板
            var trigger = selectEl.querySelector('.ms-trigger');
            var panel = selectEl.querySelector('.ms-panel');
            if(trigger && panel){
                // 关闭其他下拉
                document.querySelectorAll('.ms-panel.show').forEach(function(p){ if(p !== panel) p.classList.remove('show'); });
                document.querySelectorAll('.ms-trigger.open').forEach(function(t){ if(t !== trigger) t.classList.remove('open'); });
                // 展开当前下拉
                if(!panel.classList.contains('show')){
                    panel.classList.add('show');
                    trigger.classList.add('open');
                }
            }
            selectEl.renderPanel(term);
            return;
        }
        var term = searchInput.value.toLowerCase();
        var selectedVals = [];
        if(selectEl.multiple){
            var options = selectEl.selectedOptions;
            for(var i=0;i<options.length;i++) selectedVals.push(options[i].value);
        }else if(selectEl.value){
            selectedVals.push(selectEl.value);
        }
        
        selectEl.innerHTML = '';
        for(var i=0;i<originalOpts.length;i++){
            var opt = originalOpts[i];
            if(!term || opt.text.toLowerCase().indexOf(term) !== -1){
                var option = document.createElement('option');
                option.value = opt.value;
                option.textContent = opt.text;
                if(selectedVals.indexOf(opt.value) !== -1) option.selected = true;
                selectEl.appendChild(option);
            }
        }
    }

    // ========== 存贷款汇总 ==========
    var findColumnIndex = function(headers, keywords){
        // 第一轮：精确匹配（列名完全等于关键词）
        for(var k=0;k<keywords.length;k++){
            for(var i=0;i<headers.length;i++){
                if(headers[i] === keywords[k]) return i;
            }
        }
        // 第二轮：模糊匹配（列名包含关键词）
        for(var k=0;k<keywords.length;k++){
            for(var i=0;i<headers.length;i++){
                if(headers[i].indexOf(keywords[k]) !== -1) return i;
            }
        }
        return -1;
    };

    var normalizeRate = function(val){
        if(typeof val !== 'number' || isNaN(val)) return 0;
        return val > 1 ? val / 100 : val;
    };

    var generateSummary = function(){
        var templateWb = XLSX.read(window.atob(TEMPLATE_BASE64), {type:'binary'});
        var ws = templateWb.Sheets['Sheet1'];

        // Extract template group names (B4:B66)
        var templateGroups = {};
        for(var r=4;r<=66;r++){
            var addr = 'B' + r;
            var cell = ws[addr];
            if(cell && cell.v){
                templateGroups[String(cell.v).trim()] = r;
            }
        }

        // === Loan aggregation ===
        var loanGroupData = {};
        if(state.loanProcessed && state.loanProcessed.length > 1){
            var loanHeader = state.loanProcessed[0].map(function(h){return String(h).trim();});
            var loanGroupIdx = findColumnIndex(loanHeader, ['所属集团']);
            var loanBalIdx = findColumnIndex(loanHeader, ['贷款余额（元）','贷款余额']);
            var loanRateIdx = findColumnIndex(loanHeader, ['利率','执行利率','贷款加权利率']);

            if(loanGroupIdx !== -1 && loanBalIdx !== -1){
                for(var r=1;r<state.loanProcessed.length;r++){
                    var row = state.loanProcessed[r];
                    if(row.length <= Math.max(loanGroupIdx, loanBalIdx)) continue;
                    var gName = String(row[loanGroupIdx]||'').trim();
                    if(!gName) continue;
                    var bal = parseFloat(String(row[loanBalIdx]||'0').replace(/,/g,'')) || 0;
                    if(!loanGroupData[gName]) loanGroupData[gName] = {balance:0, weightedRate:0};
                    loanGroupData[gName].balance += bal;
                    if(loanRateIdx !== -1 && row.length > loanRateIdx){
                        // 贷款台账利率已是实际利率（如0.045表示4.5%），直接使用
                        var rateVal = String(row[loanRateIdx]||'0').replace(/,/g,'');
                        var rate = parseFloat(rateVal) || 0;
                        if(rate > 0){
                            loanGroupData[gName].weightedRate += bal * rate;
                        }
                    }
                }
            }
        }

        // === Deposit aggregation ===
        var depGroupData = {};
        var depHasRate = false;
        var depBalUnit = '万元'; // 默认单位
        var depDailyUnit = '万元'; // 默认单位
        if(state.depositProcessed && state.depositProcessed.length > 1){
            var depHeader = state.depositProcessed[0].map(function(h){return String(h).trim();});
            var depGroupIdx = findColumnIndex(depHeader, ['所属集团']);
            // 查找存款余额列，优先查找"当前账户余额"或"当前客户余额"，如果没有则查找"账户余额"
            var depBalIdx = findColumnIndex(depHeader, ['当前账户余额','当前客户余额']);
            if(depBalIdx === -1){
                depBalIdx = findColumnIndex(depHeader, ['账户余额']);
                if(depBalIdx !== -1) depBalUnit = '元'; // 表头是"账户余额"时，单位为元
            }
            // 查找存款日均列，优先查找"当前账户日均"或"当前客户年日均"，如果没有则查找"账户日均"
            var depDailyIdx = findColumnIndex(depHeader, ['当前账户日均','当前客户年日均']);
            if(depDailyIdx === -1){
                depDailyIdx = findColumnIndex(depHeader, ['账户日均']);
                if(depDailyIdx !== -1) depDailyUnit = '元'; // 表头是"账户日均"时，单位为元
            }
            var depRateIdx = findColumnIndex(depHeader, ['利率']);

            if(depRateIdx !== -1) depHasRate = true;

            if(depGroupIdx !== -1){
                for(var r=1;r<state.depositProcessed.length;r++){
                    var row = state.depositProcessed[r];
                    if(row.length <= depGroupIdx) continue;
                    var gName = String(row[depGroupIdx]||'').trim();
                    if(!gName) continue;
                    if(!depGroupData[gName]) depGroupData[gName] = {balance:0, dailyAvg:0, weightedRate:0};

                    if(depBalIdx !== -1 && row.length > depBalIdx){
                        depGroupData[gName].balance += parseFloat(String(row[depBalIdx]||'0').replace(/,/g,'')) || 0;
                    }
                    if(depDailyIdx !== -1 && row.length > depDailyIdx){
                        var daily = parseFloat(String(row[depDailyIdx]||'0').replace(/,/g,'')) || 0;
                        depGroupData[gName].dailyAvg += daily;
                        if(depRateIdx !== -1 && row.length > depRateIdx){
                            // 存款台账利率已是百分数形式（如4.5表示4.5%），直接累加日均×利率
                            var rate = parseFloat(String(row[depRateIdx]||'0').replace(/,/g,'')) || 0;
                            depGroupData[gName].weightedRate += daily * rate;
                        }
                    }
                }
            }
        }

        // === Fill template ===
        var totalLoanBal = 0, totalLoanWR = 0;
        var totalDepBal = 0, totalDepDaily = 0, totalDepWR = 0;
        var matchedCount = 0;

        // Build preview data
        var previewData = [['序号','客户名称','企业性质','贷款余额','贷款加权收益率','存款余额','存款日均','存款加权利率','利差']];

        for(var r=4;r<=66;r++){
            var bAddr = 'B' + r;
            var bCell = ws[bAddr];
            var groupName = bCell ? String(bCell.v).trim() : '';
            if(!groupName) continue;

            var cAddr = 'C' + r;
            var cCell = ws[cAddr];
            var nature = cCell ? String(cCell.v).trim() : '';

            var ld = loanGroupData[groupName] || {balance:0, weightedRate:0};
            var dd = depGroupData[groupName] || {balance:0, dailyAvg:0, weightedRate:0};

            var loanBal = ld.balance / 1e8; // 元 -> 亿元 (除以1亿)
            // loanWR: 贷款台账利率是实际利率，weightedRate/balance得到实际利率，需要乘以100转为百分数
            var loanWR = ld.balance > 0 ? (ld.weightedRate / ld.balance) : null;
            // 根据检测到的单位进行转换：元->亿元(除以1亿)，万元->亿元(除以1万)
            var depBal = depBalUnit === '元' ? dd.balance / 1e8 : dd.balance / 1e4;
            var depDaily = depDailyUnit === '元' ? dd.dailyAvg / 1e8 : dd.dailyAvg / 1e4;
            // depWR: 存款台账利率已是百分数，weightedRate/dailyAvg得到百分数，直接显示
            var depWR = null;
            if(depHasRate && dd.dailyAvg > 0){
                depWR = dd.weightedRate / dd.dailyAvg;
            }
            // spread: 贷款加权利率（百分数）- 存款加权利率（百分数）
            var spread = null;
            if(loanWR !== null && depWR !== null){
                // loanWR是实际利率，depWR是百分数，需要统一
                spread = (loanWR * 100) - depWR;
            }

            totalLoanBal += loanBal;
            if(ld.balance > 0) totalLoanWR += ld.weightedRate;
            totalDepBal += depBal;
            totalDepDaily += depDaily;
            if(depHasRate && dd.dailyAvg > 0) totalDepWR += dd.weightedRate;

            if(loanBal !== 0 || depBal !== 0 || depDaily !== 0) matchedCount++;

            var dAddr = 'D' + r;
            ws[dAddr] = loanBal !== 0 ? {t:'n', v:Math.round(loanBal*100)/100} : {t:'s', v:''};
            var eAddr = 'E' + r;
            // loanWR是实际利率，乘以100转为百分数显示
            ws[eAddr] = loanWR !== null ? {t:'s', v:(loanWR*100).toFixed(2)+'%'} : {t:'s', v:''};
            var fAddr = 'F' + r;
            ws[fAddr] = depBal !== 0 ? {t:'n', v:Math.round(depBal*100)/100} : {t:'s', v:''};
            var gAddr = 'G' + r;
            ws[gAddr] = depDaily !== 0 ? {t:'n', v:Math.round(depDaily*100)/100} : {t:'s', v:''};
            var hAddr = 'H' + r;
            // depWR已经是百分数，直接显示
            ws[hAddr] = depWR !== null ? {t:'s', v:depWR.toFixed(2)+'%'} : {t:'s', v:''};
            var iAddr = 'I' + r;
            // spread已经是百分数差值，直接显示
            ws[iAddr] = spread !== null ? {t:'s', v:spread.toFixed(2)+'%'} : {t:'s', v:''};

            previewData.push([
                r-3, groupName, nature,
                loanBal !== 0 ? loanBal.toFixed(2) : '',
                loanWR !== null ? (loanWR*100).toFixed(2)+'%' : '',
                depBal !== 0 ? depBal.toFixed(2) : '',
                depDaily !== 0 ? depDaily.toFixed(2) : '',
                depWR !== null ? depWR.toFixed(2)+'%' : '',
                spread !== null ? spread.toFixed(2)+'%' : ''
            ]);
        }

        // === Totals row (row 67) ===
        // totalLoanWR 是各集团(贷款余额原始值×实际利率)之和，除以总贷款余额原始值得到实际利率，再乘以100转为百分数
        var totalLoanWRRate = totalLoanBal > 0 ? (totalLoanWR / (totalLoanBal * 1e8)) : null;
        // totalDepWR 是各集团(账户日均原始值×百分数利率)之和，除以总账户日均原始值得到百分数利率
        // 注意：totalDepDaily 已经是转换后的亿元值，需要还原回原始值
        var totalDepDailyOriginal = depDailyUnit === '元' ? (totalDepDaily * 1e8) : (totalDepDaily * 1e4);
        var totalDepWRRate = (depHasRate && totalDepDailyOriginal > 0) ? (totalDepWR / totalDepDailyOriginal) : null;
        // totalLoanWRRate是实际利率，totalDepWRRate是百分数，计算利差时需要统一为百分数
        var totalSpread = (totalLoanWRRate !== null && totalDepWRRate !== null) ? (totalLoanWRRate * 100) - totalDepWRRate : null;

        ws['D67'] = {t:'n', v:Math.round(totalLoanBal*100)/100};
        // totalLoanWRRate是实际利率，乘以100转为百分数显示
        ws['E67'] = totalLoanWRRate !== null ? {t:'s', v:(totalLoanWRRate*100).toFixed(2)+'%'} : {t:'s', v:''};
        ws['F67'] = {t:'n', v:Math.round(totalDepBal*100)/100};
        ws['G67'] = {t:'n', v:Math.round(totalDepDaily*100)/100};
        // totalDepWRRate已经是百分数，直接显示
        ws['H67'] = totalDepWRRate !== null ? {t:'s', v:totalDepWRRate.toFixed(2)+'%'} : {t:'s', v:''};
        // totalSpread已经是百分数差值，直接显示
        ws['I67'] = totalSpread !== null ? {t:'s', v:totalSpread.toFixed(2)+'%'} : {t:'s', v:''};

        previewData.push([
            '合计', '', '',
            totalLoanBal.toFixed(2),
            totalLoanWRRate !== null ? (totalLoanWRRate*100).toFixed(2)+'%' : '',
            totalDepBal.toFixed(2),
            totalDepDaily.toFixed(2),
            totalDepWRRate !== null ? totalDepWRRate.toFixed(2)+'%' : '',
            totalSpread !== null ? totalSpread.toFixed(2)+'%' : ''
        ]);

        state.summaryWb = templateWb;

        renderPivotTable(dom.summaryTable, previewData);
        var table = dom.summaryTable.querySelector('table');
        if(table){
            var rows = table.querySelectorAll('tbody tr');
            for(var i=0;i<rows.length;i++){
                var cells = rows[i].querySelectorAll('td');
                if(cells.length >= 2) cells[1].classList.add('group-name');
            }
        }

        dom.summarySection.style.display = 'block';
        dom.summaryCount.textContent = matchedCount + ' 个集团有数据';
        dom.downloadSummary.disabled = false;
        var msg = '汇总数据预览（单位：亿元，利率为百分比）';
        if(loanRateIdx === -1) msg += ' | 注意：贷款台账未找到利率列（利率/执行利率/贷款加权利率），贷款加权收益率显示为0';
        if(!depHasRate) msg += ' | 注意：存款台账无利率列，存款加权利率和利差留空';
        dom.summaryMsg.textContent = msg;
    };

    // 初始化
    initDom();
    bindEvents();
})();
</script>
</body>
</html>
