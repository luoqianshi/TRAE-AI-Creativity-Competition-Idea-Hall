<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书法运笔演示 · 行</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f0e8;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Noto Serif SC','SimSun',serif;color:#333;padding:16px}
.toolbar{display:flex;gap:12px;margin:12px 0}
.btn{padding:10px 28px;border:1px solid #8b7355;background:#fff;color:#5a4a2a;font-size:15px;cursor:pointer;border-radius:4px;transition:all .2s;font-family:inherit}
.btn:hover{background:#5a4a2a;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:#5a4a2a;color:#fff}
.btn.primary:hover{background:#3a2a1a}
.status{margin:8px 0;font-size:13px;color:#888;min-height:20px}
.canvas-wrap{position:relative;background:#faf5ed;border:1px solid #d4c5a9;box-shadow:0 2px 12px rgba(0,0,0,.08);line-height:0}
.canvas-wrap canvas{position:absolute;top:0;left:0;display:block}
.canvas-wrap canvas:first-child{position:relative}
</style>
</head>
<body>
<div class="toolbar">
  <button class="btn primary" id="btnStart">开始书写</button>
  <button class="btn" id="btnReset">重置</button>
</div>
<div class="status" id="status">点击下方「开始书写」观看「行」字运笔动画</div>
<div class="canvas-wrap" id="canvasWrap">
  <canvas id="bgCanvas"></canvas>
  <canvas id="fgCanvas"></canvas>
</div>

<script>
'use strict';

const bgCanvas = document.getElementById('bgCanvas');
const fgCanvas = document.getElementById('fgCanvas');
const bgCtx = bgCanvas.getContext('2d');
const fgCtx = fgCanvas.getContext('2d');
const wrap = document.getElementById('canvasWrap');

const SRC_W = 1280, SRC_H = 1000;
let displayScale = 1;
let W = SRC_W, H = SRC_H;

function resize() {
  const maxW = Math.min(window.innerWidth - 40, 1100);
  const maxH = window.innerHeight - 180;
  const s = Math.min(maxW / SRC_W, maxH / SRC_H);
  displayScale = s;
  W = Math.round(SRC_W * s);
  H = Math.round(SRC_H * s);
  bgCanvas.width = W; bgCanvas.height = H;
  fgCanvas.width = W; fgCanvas.height = H;
  wrap.style.width = W + 'px';
  wrap.style.height = H + 'px';
  drawBackground();
}

// ========== Perlin 噪声 ==========
const P = new Uint8Array(512);
const G = new Float32Array(256);
(function(){
  const a = []; for (let i = 0; i < 256; i++) a[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  for (let i = 0; i < 512; i++) P[i] = a[i&255];
  for (let i = 0; i < 256; i++) G[i] = Math.random()*2-1;
})();
function perlin(x, y) {
  const X = Math.floor(x)&255, Y = Math.floor(y)&255;
  const xf = x-Math.floor(x), yf = y-Math.floor(y);
  const u = xf*xf*xf*(xf*(xf*6-15)+10), v = yf*yf*yf*(yf*(yf*6-15)+10);
  const gg = (h, fx, fy) => G[h]*fx + G[(h+128)&255]*fy;
  const x1 = gg(P[P[X]+Y], xf, yf)*(1-u) + gg(P[P[X+1]+Y], xf-1, yf)*u;
  const x2 = gg(P[P[X]+Y+1], xf, yf-1)*(1-u) + gg(P[P[X+1]+Y+1], xf-1, yf-1)*u;
  return x1*(1-v)+x2*v;
}
function fbm(x, y, oct) {
  let v = 0, a = 1, f = 1, s = 0;
  for (let i = 0; i < oct; i++) { v += perlin(x*f, y*f)*a; s += a; a *= 0.5; f *= 2; }
  return v / s;
}

// 转为画布像素坐标 + 构建贝塞尔段
function buildBezierStroke(stroke) {
  const pts = stroke.points.map(p => ({
    x: p[0] * W,
    y: p[1] * H,
    pressure: p[2]
  }));

  const segments = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i-1)];
    const p1 = pts[i];
    const p2 = pts[Math.min(pts.length-1, i+1)];
    const p3 = pts[Math.min(pts.length-1, i+2)];
    segments.push({
      p1: {x:p1.x, y:p1.y}, p2: {x:p2.x, y:p2.y},
      cp1: {x:p1.x+(p2.x-p0.x)/6, y:p1.y+(p2.y-p0.y)/6},
      cp2: {x:p2.x-(p3.x-p1.x)/6, y:p2.y-(p3.y-p1.y)/6},
      ps: p1.pressure, pe: p2.pressure
    });
  }
  return {segments, pts, duration: stroke.duration, name: stroke.name};
}

function bezierPoint(seg, t) {
  const m = 1-t;
  return {
    x: m*m*m*seg.p1.x + 3*m*m*t*seg.cp1.x + 3*m*t*t*seg.cp2.x + t*t*t*seg.p2.x,
    y: m*m*m*seg.p1.y + 3*m*m*t*seg.cp1.y + 3*m*t*t*seg.cp2.y + t*t*t*seg.p2.y
  };
}

function segLen(seg) {
  let len = 0, prev = seg.p1;
  for (let i = 1; i <= 30; i++) {
    const pt = bezierPoint(seg, i/30);
    len += Math.hypot(pt.x-prev.x, pt.y-prev.y);
    prev = pt;
  }
  return len;
}

function totalLen(segs) { return segs.reduce((s,sg) => s+segLen(sg), 0); }

function posAtT(segs, tl, t) {
  let target = t*tl, acc = 0;
  for (const sg of segs) {
    const sl = segLen(sg);
    if (acc+sl >= target) return bezierPoint(sg, (target-acc)/Math.max(0.001, sl));
    acc += sl;
  }
  return segs[segs.length-1].p2;
}

function tangentAtT(segs, tl, t) {
  let target = t*tl, acc = 0;
  for (const sg of segs) {
    const sl = segLen(sg);
    if (acc+sl >= target) {
      const lt = (target-acc)/Math.max(0.001, sl);
      const dt = 0.012;
      const a = bezierPoint(sg, Math.max(0, lt-dt));
      const b = bezierPoint(sg, Math.min(1, lt+dt));
      const dx = b.x-a.x, dy = b.y-a.y;
      const len = Math.hypot(dx, dy) || 1;
      const c = bezierPoint(sg, Math.max(0, lt-dt*2));
      const d = bezierPoint(sg, Math.min(1, lt+dt*2));
      const a1 = Math.atan2(a.y-c.y, a.x-c.x);
      const a2 = Math.atan2(d.y-b.y, d.x-b.x);
      let dA = Math.abs(a2-a1); if (dA > Math.PI) dA = 2*Math.PI-dA;
      dA /= dt*2;
      return {dx:dx/len, dy:dy/len, angle:Math.atan2(dy,dx), curvature: Math.min(dA, 4)};
    }
    acc += sl;
  }
  return {dx:0, dy:1, angle:Math.PI/2, curvature:0};
}

function pressureAtT(pts, t) {
  if (pts.length < 2) return pts[0]?.pressure || 0.5;
  const idx = t * (pts.length-1);
  const i0 = Math.floor(idx);
  const i1 = Math.min(pts.length-1, i0+1);
  const f = idx - i0;
  return pts[i0].pressure*(1-f) + pts[i1].pressure*f;
}

// ========== CCD-BSM 毛笔绘制 ==========
function drawBrushDab(x, y, pressure, tangent) {
  const ctx = fgCtx;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tangent.angle);

  const baseR = Math.max(3.5, pressure * 40 * displayScale);
  const longAxis = baseR * (1.05 + pressure * 0.15);
  const shortAxis = baseR * (0.65 + pressure * 0.15);

  // 转折顿笔加粗
  const turnBoost = 1 + Math.min(tangent.curvature * 0.35, 0.45);
  const fL = longAxis * turnBoost;
  const fS = shortAxis * turnBoost;

  const layers = [
    {scale: 1.35, alpha: 0.035, color: '#2a1a0a'},
    {scale: 1.05, alpha: 0.07,  color: '#1a0f06'},
    {scale: 0.75, alpha: 0.14,  color: '#1a0f06'},
    {scale: 0.42, alpha: 0.32,  color: '#0f0803'},
  ];

  for (const layer of layers) {
    ctx.globalAlpha = layer.alpha;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = layer.color;

    const lx = fL * layer.scale;
    const ly = fS * layer.scale;
    ctx.beginPath();
    const N = 32;
    for (let i = 0; i <= N; i++) {
      const a = (i/N) * Math.PI * 2;
      const n = fbm(a*2.8 + x*0.035, a*3.2 + y*0.035, 3) * 0.14;
      const rx = lx * (1 + n);
      const ry = ly * (1 + n * 0.55);
      const px = Math.cos(a) * rx;
      const py = Math.sin(a) * ry;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  // 飞白（低压力时）
  if (pressure < 0.30) {
    ctx.globalCompositeOperation = 'destination-out';
    const intensity = (1 - pressure/0.30) * 0.08;
    for (let i = 0; i < 3; i++) {
      ctx.globalAlpha = intensity * (0.4 + Math.random()*0.6);
      const ox = (Math.random()-0.5) * fL * 1.2;
      const oy = (Math.random()-0.5) * fS * 0.6;
      ctx.beginPath();
      ctx.arc(ox, oy, Math.random()*1.2+0.4, 0, Math.PI*2);
      ctx.fill();
    }
  }

  ctx.restore();
}

// ========== 单笔动画（requestAnimationFrame） ==========
async function animateStroke(strokeData) {
  const {segments, pts, duration} = strokeData;
  const tl = totalLen(segments);
  const stepTime = 8; // ms per step target
  const steps = Math.max(30, Math.floor(duration / stepTime));
  let lastPos = null;

  for (let step = 0; step <= steps; step++) {
    const t = step / steps;
    const pos = posAtT(segments, tl, t);
    const pressure = pressureAtT(pts, t);
    const tang = tangentAtT(segments, tl, t);

    // 跳过过于密集的点，防止墨团堆积
    if (lastPos) {
      const d = Math.hypot(pos.x - lastPos.x, pos.y - lastPos.y);
      if (d < 2.5) continue;
    }
    lastPos = pos;

    // S-curve 速度控制
    const ramp = Math.min(t * 6, 1);
    const decay = Math.min((1-t) * 5, 1);
    const curveSlow = Math.max(0.2, 1 - tang.curvature * 1.5);
    const speed = ramp * decay * curveSlow;

    drawBrushDab(pos.x, pos.y, pressure, tang);

    const delay = Math.max(2, Math.round(stepTime / Math.max(0.12, speed)));
    await sleep(delay);
  }
}

// ========== 主流程 ==========
async function startWriting() {
  if (isAnimating) return;
  isAnimating = true;
  document.getElementById('btnStart').disabled = true;
  fgCtx.clearRect(0, 0, W, H);

  const built = STROKES.map(buildBezierStroke);

  for (let i = 0; i < built.length; i++) {
    setStatus(`第 ${i+1}/${built.length} 笔 · ${built[i].name}`);
    await animateStroke(built[i]);
    if (i < built.length - 1) {
      await sleep(120 + Math.random() * 60);
    }
  }

  setStatus('书写完成');
  document.getElementById('btnStart').disabled = false;
  isAnimating = false;
}

document.getElementById('btnStart').addEventListener('click', startWriting);
document.getElementById('btnReset').addEventListener('click', resetCanvas);

// 初始化
resize();
</script>
