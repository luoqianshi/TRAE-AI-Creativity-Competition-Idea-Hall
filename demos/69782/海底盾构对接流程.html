<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盾构对接施工流程图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'SimHei', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 1000px;
            width: 100%;
        }
        .title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 35px;
            padding-bottom: 18px;
            border-bottom: 4px solid #667eea;
            letter-spacing: 2px;
        }
        svg {
            width: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">盾构对接施工流程图</div>
        <svg viewBox="0 0 920 2400" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 阴影滤镜 -->
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/>
                </filter>
                <filter id="shadow-light" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
                </filter>
                <!-- 箭头标记 -->
                <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
                </marker>
                <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#e53e3e"/>
                </marker>
                <!-- 渐变定义 -->
                <linearGradient id="grad-blue" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#4299e1;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#3182ce;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="grad-orange" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#ed8936;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#dd6b20;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="grad-purple" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#9f7aea;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#805ad5;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="grad-pink" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#ed64a6;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#d53f8c;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="grad-green" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#48bb78;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#38a169;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="grad-red" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#fc8181;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#f56565;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="grad-teal" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#38b2ac;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#319795;stop-opacity:1" />
                </linearGradient>
            </defs>

            <!-- 背景网格装饰 -->
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f7fafc" stroke-width="1"/>
            </pattern>
            <rect width="920" height="2400" fill="url(#grid)" opacity="0.5"/>

            <!-- 标题装饰线 -->
            <line x1="260" y1="0" x2="660" y2="0" stroke="#667eea" stroke-width="4" stroke-linecap="round"/>

            <!-- ========== 步骤1: 2台盾构下井始发 ========== -->
            <rect x="310" y="30" width="300" height="50" rx="10" fill="url(#grad-blue)" filter="url(#shadow)"/>
            <text x="460" y="60" text-anchor="middle" fill="white" font-size="16" font-weight="bold">2台盾构下井始发</text>
            
            <!-- 箭头1 -->
            <line x1="460" y1="80" x2="460" y2="115" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

            <!-- ========== 步骤2: 2台盾构相向掘进 ========== -->
            <rect x="310" y="125" width="300" height="50" rx="10" fill="url(#grad-blue)" filter="url(#shadow)"/>
            <text x="460" y="155" text-anchor="middle" fill="white" font-size="16" font-weight="bold">2台盾构相向掘进</text>
            
            <!-- 箭头2 -->
            <line x1="460" y1="175" x2="460" y2="210" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

            <!-- ========== 里程碑1: 距离对接点300m ========== -->
            <rect x="230" y="220" width="460" height="70" rx="12" fill="url(#grad-orange)" filter="url(#shadow)"/>
            <text x="460" y="248" text-anchor="middle" fill="white" font-size="15" font-weight="bold">距离对接点300m：启动对接确认流程</text>
            <text x="460" y="272" text-anchor="middle" fill="#fff5eb" font-size="13">（双方复测控制网、准备测量联测）</text>
            
            <!-- 箭头3 -->
            <line x1="460" y1="290" x2="460" y2="325" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

            <!-- ========== 步骤3: 继续掘进 ========== -->
            <rect x="310" y="335" width="300" height="50" rx="10" fill="url(#grad-blue)" filter="url(#shadow)"/>
            <text x="460" y="365" text-anchor="middle" fill="white" font-size="16" font-weight="bold">继续掘进（穿越风险源）</text>
            
            <!-- 箭头4 -->
            <line x1="460" y1="385" x2="460" y2="420" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

            <!-- ========== 里程碑2: 距离对接点200m～100m ========== -->
            <rect x="230" y="430" width="460" height="70" rx="12" fill="url(#grad-orange)" filter="url(#shadow)"/>
            <text x="460" y="458" text-anchor="middle" fill="white" font-size="15" font-weight="bold">距离对接点200m～100m：对接点最终确认</text>
            <text x="460" y="482" text-anchor="middle" fill="#fff5eb" font-size="13">（地质复核、联合平差、确定对接姿态）</text>
            
            <!-- 箭头5 -->
            <line x1="460" y1="500" x2="460" y2="535" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

            <!-- ========== 步骤4: 先行盾构到达对接点停机保压 ========== -->
            <rect x="260" y="545" width="400" height="50" rx="10" fill="url(#grad-blue)" filter="url(#shadow)"/>
            <text x="460" y="575" text-anchor="middle" fill="white" font-size="16" font-weight="bold">先行盾构到达对接点停机保压</text>
            
            <!-- 箭头6 -->
            <line x1="460" y1="595" x2="460" y2="630" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

            <!-- ========== 判断1: 先行盾构姿态锁定 ========== -->
            <!-- 菱形 -->
            <polygon points="460,640 560,695 460,750 360,695" fill="url(#grad-pink)" filter="url(#shadow)" stroke="#b83280" stroke-width="2"/>
            <text x="460" y="685" text-anchor="middle" fill="white" font-size="13" font-weight="bold">先行盾构姿态锁定、</text>
            <text x="460" y="705" text-anchor="middle" fill="white" font-size="13" font-weight="bold">泥水压力稳定？</text>
            
            <!-- 是标签 -->
            <rect x="475" y="755" width="40" height="22" rx="5" fill="#48bb78"/>
            <text x="495" y="771" text-anchor="middle" fill="white" font-size="12" font-weight="bold">是</text>
            
            <!-- 箭头7 -->
            <line x1="460" y1="750" x2="460" y2="795" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

            <!-- ========== 步骤5: 后行盾构掘进至对接区域 ========== -->
            <rect x="260" y="805" width="400" height="50" rx="10" fill="url(#grad-blue)" filter="url(#shadow)"/>
            <text x="460" y="835" text-anchor="middle" fill="white" font-size="16" font-weight="bold">后行盾构掘进至对接区域</text>
            
            <!-- 箭头8 -->
            <line x1="460" y1="855" x2="460" y2="890" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

            <!-- ========== 判断2: 对接条件确认 ========== -->
            <polygon points="460,900 560,955 460,1010 360,955" fill="url(#grad-pink)" filter="url(#shadow)" stroke="#b83280" stroke-width="2"/>
            <text x="460" y="935" text-anchor="middle" fill="white" font-size="12" font-weight="bold">对接条件确认：</text>
            <text x="460" y="952" text-anchor="middle" fill="white" font-size="11">间距0.5～1.0m、中心偏差≤±10mm</text>
            <text x="460" y="968" text-anchor="middle" fill="white" font-size="11">渗水量≤80L/min？</text>
            
            <!-- 是标签 -->
            <rect x="475" y="1015" width="40" height="22" rx="5" fill="#48bb78"/>
            <text x="495" y="1031" text-anchor="middle" fill="white" font-size="12" font-weight="bold">是</text>
            
            <!-- 箭头9 -->
            <line x1="460" y1="1010" x2="460" y2="1055" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

            <!-- ========== 步骤6: 对接段地层加固 ========== -->
            <rect x="260" y="1065" width="400" height="50" rx="10" fill="url(#grad-purple)" filter="url(#shadow)"/>
            <text x="460" y="1095" text-anchor="middle" fill="white" font-size="16" font-weight="bold">对接段地层加固（全环注浆）</text>
            
            <!-- 箭头10 -->
            <line x1="460" y1="1115" x2="460" y2="1150" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

            <!-- ========== 判断3: 加固效果确认 ========== -->
            <polygon points="460,1160 560,1215 460,1270 360,1215" fill="url(#grad-pink)" filter="url(#shadow)" stroke="#b83280" stroke-width="2"/>
            <text x="460" y="1195" text-anchor="middle" fill="white" font-size="12" font-weight="bold">加固效果确认：</text>
            <text x="460" y="1212" text-anchor="middle" fill="white" font-size="11">取芯抗压≥1.5MPa、</text>
            <text x="460" y="1228" text-anchor="middle" fill="white" font-size="11">渗透系数≤10⁻⁵cm/s？</text>
            
            <!-- 是标签 -->
            <rect x="475" y="1275" width="40" height="22" rx="5" fill="#48bb78"/>
            <text x="495" y="1291" text-anchor="middle" fill="white" font-size="12" font-weight="bold">是</text>
            
            <!-- 否分支 -->
            <rect x="700" y="1200" width="40" height="22" rx="5" fill="#fc8181"/>
            <text x="720" y="1216" text-anchor="middle" fill="white" font-size="12" font-weight="bold">否</text>
            
            <!-- 否分支箭头 -->
            <line x1="560" y1="1215" x2="690" y2="1215" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrow-red)"/>
            
            <!-- 否处理框 -->
            <rect x="650" y="1240" width="140" height="40" rx="8" fill="url(#grad-red)" filter="url(#shadow-light)"/>
            <text x="720" y="1260" text-anchor="middle" fill="white" font-size="13" font-weight="bold">补充加固</text>
            <text x="720" y="1275" text-anchor="middle" fill="#ffeaea" font-size="11">→ 返回加固效果确认</text>
            
            <!-- 返回箭头（虚线） -->
            <path d="M 720 1280 L 720 1320 L 580 1320 L 580 1270" fill="none" stroke="#e53e3e" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>

            <!-- 箭头11 -->
            <line x1="460" y1="1270" x2="460" y2="1315" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

            <!-- ========== 步骤7: 止水钢环焊接 ========== -->
            <rect x="310" y="1325" width="300" height="50" rx="10" fill="url(#grad-teal)" filter="url(#shadow)"/>
            <text x="460" y="1355" text-anchor="middle" fill="white" font-size="16" font-weight="bold">止水钢环焊接</text>
            
            <!-- 箭头12 -->
            <line x1="460" y1="1375" x2="460" y2="1410" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

            <!-- ========== 判断4: 止水效果确认 ========== -->
            <polygon points="460,1420 560,1475 460,1530 360,1475" fill="url(#grad-pink)" filter="url(#shadow)" stroke="#b83280" stroke-width="2"/>
            <text x="460" y="1455" text-anchor="middle" fill="white" font-size="12" font-weight="bold">止水效果确认：</text>
            <text x="460" y="1472" text-anchor="middle" fill="white" font-size="11">焊缝100%探伤合格、</text>
            <text x="460" y="1488" text-anchor="middle" fill="white" font-size="11">整体渗漏检测通过？</text>
            
            <!-- 是标签 -->
            <rect x="475" y="1535" width="40" height="22" rx="5" fill="#48bb78"/>
            <text x="495" y="1551" text-anchor="middle" fill="white" font-size="12" font-weight="bold">是</text>
            
            <!-- 否分支 -->
            <rect x="700" y="1460" width="40" height="22" rx="5" fill="#fc8181"/>
            <text x="720" y="1476" text-anchor="middle" fill="white" font-size="12" font-weight="bold">否</text>
            
            <!-- 否分支箭头 -->
            <line x1="560" y1="1475" x2="690" y2="1475" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrow-red)"/>
            
            <!-- 否处理框 -->
            <rect x="650" y="1500" width="140" height="50" rx="8" fill="url(#grad-red)" filter="url(#shadow-light)"/>
            <text x="720" y="1520" text-anchor="middle" fill="white" font-size="13" font-weight="bold">加固处理</text>
            <text x="720" y="1538" text-anchor="middle" fill="#ffeaea" font-size="11">（补焊/注浆）</text>
            <text x="720" y="1555" text-anchor="middle" fill="#ffeaea" font-size="11">→ 返回止水效果确认</text>
            
            <!-- 返回箭头（虚线） -->
            <path d="M 720 1555 L 720 1595 L 580 1595 L 580 1540" fill="none" stroke="#e53e3e" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>

            <!-- 箭头13 -->
            <line x1="460" y1="1530" x2="460" y2="1575" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

            <!-- ========== 步骤8: 盾构机解体拆除 ========== -->
            <rect x="310" y="1585" width="300" height="50" rx="10" fill="url(#grad-blue)" filter="url(#shadow)"/>
            <text x="460" y="1615" text-anchor="middle" fill="white" font-size="16" font-weight="bold">盾构机解体拆除</text>
            
            <!-- 箭头14 -->
            <line x1="460" y1="1635" x2="460" y2="1670" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

            <!-- ========== 步骤9: 对接段二衬及内部结构施工 ========== -->
            <rect x="250" y="1680" width="420" height="50" rx="10" fill="url(#grad-blue)" filter="url(#shadow)"/>
            <text x="460" y="1710" text-anchor="middle" fill="white" font-size="16" font-weight="bold">对接段二衬及内部结构施工</text>
            
            <!-- 箭头15 -->
            <line x1="460" y1="1730" x2="460" y2="1765" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

            <!-- ========== 完成 ========== -->
            <rect x="360" y="1775" width="200" height="55" rx="15" fill="url(#grad-green)" filter="url(#shadow)"/>
            <text x="460" y="1808" text-anchor="middle" fill="white" font-size="18" font-weight="bold">施工完成</text>
            
            <!-- 装饰星星 -->
            <text x="420" y="1808" fill="white" font-size="16">★</text>
            <text x="500" y="1808" fill="white" font-size="16">★</text>

            <!-- 间隔 -->
            
            <!-- ========== 全过程监测与预警 ========== -->
            <rect x="50" y="1880" width="820" height="55" rx="12" fill="url(#grad-green)" filter="url(#shadow)" opacity="0.9"/>
            <text x="460" y="1915" text-anchor="middle" fill="white" font-size="17" font-weight="bold">全过程监测与预警 —— 贯穿所有步骤</text>
            
            <!-- 左侧装饰图标 -->
            <text x="100" y="1915" fill="white" font-size="20">📊</text>
            <text x="820" y="1915" fill="white" font-size="20">⚠️</text>

            <!-- 图例 -->
            <rect x="280" y="1970" width="360" height="140" rx="10" fill="#f7fafc" stroke="#e2e8f0" stroke-width="2"/>
            <text x="460" y="1995" text-anchor="middle" fill="#2d3748" font-size="14" font-weight="bold">图 例</text>
            
            <rect x="300" y="2010" width="24" height="16" rx="4" fill="url(#grad-blue)"/>
            <text x="335" y="2022" fill="#4a5568" font-size="12">普通施工步骤</text>
            
            <rect x="300" y="2035" width="24" height="16" rx="4" fill="url(#grad-orange)"/>
            <text x="335" y="2047" fill="#4a5568" font-size="12">关键里程碑节点</text>
            
            <rect x="300" y="2060" width="24" height="16" rx="4" fill="url(#grad-pink)"/>
            <text x="335" y="2072" fill="#4a5568" font-size="12">判断/决策节点</text>
            
            <rect x="480" y="2010" width="24" height="16" rx="4" fill="url(#grad-purple)"/>
            <text x="515" y="2022" fill="#4a5568" font-size="12">特殊施工步骤</text>
            
            <rect x="480" y="2035" width="24" height="16" rx="4" fill="url(#grad-red)"/>
            <text x="515" y="2047" fill="#4a5568" font-size="12">否/返回处理</text>
            
            <rect x="480" y="2060" width="24" height="16" rx="4" fill="url(#grad-green)"/>
            <text x="515" y="2072" fill="#4a5568" font-size="12">完成/监测</text>
            
            <line x1="300" y1="2085" x2="340" y2="2085" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
            <text x="350" y="2090" fill="#4a5568" font-size="12">正常流程</text>
            
            <line x1="480" y1="2085" x2="520" y2="2085" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrow-red)"/>
            <text x="530" y="2090" fill="#4a5568" font-size="12">返回路径</text>

        </svg>
    </div>
</body>
</html>
