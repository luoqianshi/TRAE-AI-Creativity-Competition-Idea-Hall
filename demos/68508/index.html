<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>妈妈贴心记账助手</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #FFF8F0;
            padding: 20px;
            font-size: 18px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 2px 12px #f2d9c4;
        }
        h1 {
            text-align: center;
            color: #E67E22;
            font-size: 28px;
            margin-bottom: 20px;
        }
        .info-card {
            background: #fff3e6;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .info-card h3 {
            font-size: 22px;
            color: #d35400;
            margin-bottom: 10px;
        }
        .form-item {
            margin: 15px 0;
        }
        label {
            display: block;
            font-size: 20px;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            border: 2px solid #ffd9b3;
            border-radius: 10px;
        }
        button {
            width: 100%;
            padding: 16px;
            background: #E67E22;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 22px;
            margin-top: 10px;
            cursor: pointer;
        }
        .chart-box {
            margin-top: 30px;
            height: 350px;
        }
        .record-list {
            margin-top: 25px;
        }
        .record-item {
            padding: 12px;
            border-bottom: 1px solid #ffe8d0;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
        }
        .income {
            color: #27ae60;
        }
        .expense {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👩 妈妈贴心记账助手</h1>

        <div class="info-card">
            <h3>产品介绍</h3>
            <p>专为中老年妈妈设计的适老化记账小程序，超大字体、极简操作，无需复杂学习。支持日常收支随手记录、自动分类统计、月度消费图表分析，轻松管好家庭每一笔开销，告别手写账本烦恼。</p>
        </div>

        <div class="add-record">
            <div class="form-item">
                <label>收支类型</label>
                <select id="type">
                    <option value="expense">支出</option>
                    <option value="income">收入</option>
                </select>
            </div>
            <div class="form-item">
                <label>消费分类</label>
                <select id="category">
                    <option value="餐饮">日常餐饮</option>
                    <option value="商超">超市买菜</option>
                    <option value="缴费">水电燃气</option>
                    <option value="人情">人情往来</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="form-item">
                <label>金额（元）</label>
                <input type="number" id="money" placeholder="请输入金额">
            </div>
            <div class="form-item">
                <label>备注（可选）</label>
                <input type="text" id="desc" placeholder="简单记一下用途">
            </div>
            <button onclick="addRecord()">保存这笔收支</button>
        </div>

        <div class="chart-box">
            <canvas id="billChart"></canvas>
        </div>

        <div class="record-list" id="recordList">
            <h3>近期收支记录</h3>
        </div>
    </div>

    <script>
        let recordArr = [];
        const ctx = document.getElementById('billChart').getContext('2d');
        let myChart = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: ['餐饮', '商超', '缴费', '人情', '其他'],
                datasets: [{
                    data: [0,0,0,0,0],
                    backgroundColor: ['#ff9999','#66b3ff','#99ff99','#ffcc99','#c2c2f0']
                }]
            },
            options: {
                plugins:{
                    title:{
                        display:true,
                        text:'本月各类支出占比',
                        font:{size:18}
                    }
                }
            }
        });

        function addRecord(){
            const type = document.getElementById('type').value;
            const category = document.getElementById('category').value;
            const money = parseFloat(document.getElementById('money').value);
            const desc = document.getElementById('desc').value || '无备注';
            if(isNaN(money) || money <=0){
                alert('请输入合法金额！');
                return;
            }
            const item = {type,category,money,desc,time:new Date().toLocaleString()};
            recordArr.push(item);
            renderList();
            updateChart();
            document.getElementById('money').value = '';
            document.getElementById('desc').value = '';
        }

        function renderList(){
            const wrap = document.getElementById('recordList');
            wrap.innerHTML = '<h3>近期收支记录</h3>';
            recordArr.forEach(item=>{
                const div = document.createElement('div');
                div.className = 'record-item';
                div.innerHTML = `
                    <span>${item.time} ${item.category} ${item.desc}</span>
                    <span class="${item.type}">${item.type==='income'?'+':'-'}${item.money}元</span>
                `;
                wrap.appendChild(div);
            })
        }

        function updateChart(){
            const map = {'餐饮':0,'商超':0,'缴费':0,'人情':0,'其他':0};
            recordArr.filter(i=>i.type==='expense').forEach(item=>{
                map[item.category] += item.money;
            })
            myChart.data.datasets[0].data = Object.values(map);
            myChart.update();
        }
    </script>
</body>
</html>
