<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>心樱日记</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
/* ==================== RESET & ROOT ==================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-primary: #fefcfd;
  --bg-secondary: #f8f5f7;
  --bg-card: #ffffff;
  --bg-sakura: #fff5f8;
  --text-primary: #3a3540;
  --text-secondary: #7a7580;
  --text-muted: #b5b0b8;
  --accent-primary: #7eb09b;
  --accent-sakura: #f5a0b8;
  --accent-sakura-light: #fce4ec;
  --accent-sakura-lighter: #fff5f8;
  --border: #ede5e8;
  --border-sakura: #f8d0dc;
  --mood-happy: #ffb3c6;
  --mood-calm: #8cc5a0;
  --mood-sad: #7aadd4;
  --mood-angry: #f0a0a0;
  --mood-anxious: #f5d080;
  --income: #7eb09b;
  --expense: #f0a0a0;
  --cat-dining: #ffb3c6;
  --cat-transport: #7aadd4;
  --cat-shopping: #c4a0e0;
  --cat-housing: #e8b86a;
  --cat-entertainment: #a0d4b8;
  --cat-other: #b0b0b8;
  --cat-salary: #7eb09b;
}

html, body {
  width: 100%;
  min-height: 100vh;
  background: #f0eef0;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 20px;
  padding-bottom: 20px;
  font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ==================== PHONE FRAME ==================== */
.phone-frame {
  width: 375px;
  min-height: 812px;
  background: var(--bg-primary);
  border-radius: 40px;
  overflow: hidden;
  position: relative;
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.06),
    0 20px 60px rgba(245,160,184,0.15),
    0 4px 16px rgba(0,0,0,0.06);
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(255,245,248,0.4) 0%, transparent 70%),
    radial-gradient(ellipse at 80% 20%, rgba(252,228,236,0.3) 0%, transparent 60%);
}

/* ==================== STATUS BAR ==================== */
.status-bar {
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  font-size: 14px;
  font-weight: 500;
  position: relative;
  z-index: 100;
  background: transparent;
  color: var(--text-primary);
}
.status-bar-left { font-weight: 600; letter-spacing: 0.5px; }
.status-bar-right { display: flex; gap: 6px; align-items: center; }
.status-bar-right svg { width: 16px; height: 16px; }

/* ==================== SAKURA PETALS ==================== */
.sakura-petals-container {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 1;
}
.sakura-petal {
  position: absolute;
  background: radial-gradient(ellipse at center, #ffc0cb 0%, #f5a0b8 100%);
  border-radius: 50% 0 50% 0;
  pointer-events: none;
  animation: sakura-fall linear infinite;
}
.sakura-petal:nth-child(1) { width: 10px; height: 10px; left: 10%; opacity: 0.3; animation-duration: 12s; animation-delay: 0s; }
.sakura-petal:nth-child(2) { width: 8px; height: 8px; left: 30%; opacity: 0.25; animation-duration: 10s; animation-delay: 2s; }
.sakura-petal:nth-child(3) { width: 12px; height: 12px; left: 50%; opacity: 0.35; animation-duration: 14s; animation-delay: 4s; }
.sakura-petal:nth-child(4) { width: 7px; height: 7px; left: 70%; opacity: 0.2; animation-duration: 9s; animation-delay: 1s; }
.sakura-petal:nth-child(5) { width: 9px; height: 9px; left: 85%; opacity: 0.3; animation-duration: 11s; animation-delay: 3s; }
.sakura-petal:nth-child(6) { width: 11px; height: 11px; left: 20%; opacity: 0.28; animation-duration: 13s; animation-delay: 5s; }
.sakura-petal:nth-child(7) { width: 6px; height: 6px; left: 60%; opacity: 0.22; animation-duration: 8s; animation-delay: 6s; }
.sakura-petal:nth-child(8) { width: 9px; height: 9px; left: 45%; opacity: 0.32; animation-duration: 15s; animation-delay: 7s; }

@keyframes sakura-fall {
  0% { transform: translate(0, -20px) rotate(0deg); opacity: 0; }
  10% { opacity: 0.4; }
  90% { opacity: 0.35; }
  100% { transform: translate(80px, 850px) rotate(360deg); opacity: 0; }
}

/* ==================== APP CONTAINER ==================== */
.app-container {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  height: calc(812px - 44px);
  overflow: hidden;
}

/* ==================== TAB CONTENT WRAPPER ==================== */
.tab-content-wrapper {
  flex: 1;
  position: relative;
  overflow: hidden;
  min-height: 0;
}

/* ==================== TAB CONTENT ==================== */
.tab-content {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0 20px 20px;
  -webkit-overflow-scrolling: touch;
}
.tab-content::-webkit-scrollbar { display: none; }
.tab-content { -ms-overflow-style: none; scrollbar-width: none; }

/* ==================== BOTTOM TAB BAR ==================== */
.tab-bar {
  height: 68px;
  display: flex;
  align-items: flex-start;
  justify-content: space-around;
  padding-top: 8px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  position: relative;
  z-index: 100;
}
.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  transition: transform 0.25s ease;
  -webkit-tap-highlight-color: transparent;
  background: none;
  border: none;
  outline: none;
  padding: 4px 8px;
}
.tab-item:active { transform: scale(0.92); }
.tab-item svg { width: 22px; height: 22px; transition: all 0.25s ease; }
.tab-item .tab-label {
  font-size: 10px;
  color: var(--text-muted);
  transition: color 0.25s ease;
  font-family: 'Noto Sans JP', sans-serif;
}
.tab-item.active svg { transform: scale(1.15); }
.tab-item.active .tab-label { color: var(--accent-sakura); font-weight: 500; }
.tab-item svg path,
.tab-item svg circle,
.tab-item svg rect,
.tab-item svg polyline,
.tab-item svg line {
  stroke: var(--text-muted);
  transition: stroke 0.25s ease;
  fill: none;
}
.tab-item svg path.filled { fill: none; }
.tab-item.active svg path,
.tab-item.active svg circle,
.tab-item.active svg rect,
.tab-item.active svg polyline,
.tab-item.active svg line {
  stroke: var(--accent-sakura);
}
.tab-item.active svg path.filled { fill: var(--accent-sakura); }

/* ==================== COMMON COMPONENTS ==================== */
.section-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 16px;
  font-weight: 500;
  color: var(--text-primary);
  margin: 20px 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title::before {
  content: '';
  display: block;
  width: 3px;
  height: 16px;
  background: var(--accent-sakura);
  border-radius: 2px;
}
.card {
  background: var(--bg-card);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  border: 1px solid var(--border);
  transition: transform 0.2s ease;
}
.card:active { transform: scale(0.98); }
.card-sakura { background: var(--bg-sakura); border-color: var(--border-sakura); }

/* ==================== TAB 1: DIARY ==================== */
.diary-tab .date-weather-banner {
  margin: 0 -20px 16px;
  padding: 20px 24px;
  background: linear-gradient(135deg, #fff5f8 0%, #fce4ec 50%, #fff0f5 100%);
  border-bottom: 1px solid var(--border-sakura);
}
.diary-tab .date-display {
  font-family: 'Noto Serif JP', serif;
  font-size: 28px;
  font-weight: 500;
  color: var(--text-primary);
  letter-spacing: 1px;
}
.diary-tab .weather-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
  font-size: 14px;
  color: var(--text-secondary);
}
.diary-tab .weather-icon { font-size: 20px; }
.diary-tab .weather-motto {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-muted);
}

/* Mini Calendar */
.mini-calendar { margin-bottom: 16px; }
.cal-week { display: flex; justify-content: space-between; gap: 4px; }
.cal-day {
  width: 42px;
  height: 56px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
}
.cal-day .day-name { font-size: 10px; color: var(--text-muted); }
.cal-day .day-num { font-size: 15px; font-weight: 500; color: var(--text-primary); }
.cal-day.today { background: var(--accent-sakura); }
.cal-day.today .day-name,
.cal-day.today .day-num { color: #fff; }
.cal-day.has-entry::after {
  content: '';
  position: absolute;
  bottom: 6px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
}
.cal-day.has-entry.mood-happy::after { background: var(--mood-happy); }
.cal-day.has-entry.mood-calm::after { background: var(--mood-calm); }
.cal-day.has-entry.mood-sad::after { background: var(--mood-sad); }
.cal-day.has-entry.mood-angry::after { background: var(--mood-angry); }
.cal-day.has-entry.mood-anxious::after { background: var(--mood-anxious); }
.cal-day.today.has-entry::after { background: #fff; }
.cal-hint {
  text-align: center;
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 8px;
  font-style: italic;
}

/* Mood Check-in */
.mood-checkin {
  margin-bottom: 16px;
  padding: 16px;
  text-align: center;
}
.mood-question {
  font-family: 'Noto Serif JP', serif;
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 14px;
}
.mood-row { display: flex; justify-content: center; gap: 16px; }
.mood-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  cursor: pointer;
  border: 2.5px solid transparent;
  transition: all 0.25s ease;
  position: relative;
  background: var(--bg-card);
  box-shadow: 0 2px 6px rgba(0,0,0,0.04);
}
.mood-btn:active { transform: scale(0.9); }
.mood-btn.selected {
  border-color: var(--accent-sakura);
  transform: scale(1.15);
  box-shadow: 0 0 0 4px rgba(245,160,184,0.2), 0 4px 12px rgba(245,160,184,0.2);
}
.mood-btn .mood-label {
  position: absolute;
  bottom: -18px;
  font-size: 10px;
  color: var(--text-muted);
  white-space: nowrap;
}

/* Today Diary */
.today-diary { margin-bottom: 16px; }
.today-diary .diary-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.today-diary .diary-header h3 {
  font-family: 'Noto Serif JP', serif;
  font-size: 15px;
  font-weight: 500;
}
.today-diary .edit-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background: var(--bg-sakura);
  border: none;
}
.today-diary .edit-btn svg { width: 14px; height: 14px; }
.today-diary .diary-body {
  font-size: 14px;
  line-height: 1.8;
  color: var(--text-primary);
  min-height: 80px;
}
.today-diary .diary-footer {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-muted);
}
.today-diary .diary-footer .diary-time { margin-left: auto; }

/* Recent Entries */
.recent-entry {
  padding: 14px 16px;
  margin-bottom: 10px;
  border-radius: 12px;
  background: var(--bg-card);
  border-left: 3px solid var(--mood-happy);
  box-shadow: 0 1px 4px rgba(0,0,0,0.02);
  cursor: pointer;
  transition: transform 0.2s;
}
.recent-entry:active { transform: scale(0.98); }
.recent-entry .entry-date {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.recent-entry .entry-preview {
  font-size: 13px;
  line-height: 1.6;
  color: var(--text-secondary);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ==================== TAB 2: EXPENSE ==================== */
.expense-tab { }
.expense-tab .month-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 8px 0 16px;
}
.expense-tab .month-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 18px;
  font-weight: 500;
  min-width: 120px;
  text-align: center;
}
.expense-tab .month-nav {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background: var(--bg-sakura);
  border: none;
  transition: transform 0.2s;
}
.expense-tab .month-nav:active { transform: scale(0.9); }
.expense-tab .month-nav svg { width: 14px; height: 14px; }

.summary-cards { display: flex; gap: 12px; margin-bottom: 20px; }
.summary-card {
  flex: 1;
  padding: 16px;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}
.summary-card.income { background: linear-gradient(135deg, #e8f5ee, #f0faf4); border: 1px solid #d0e8da; }
.summary-card.expense { background: linear-gradient(135deg, #fde8ec, #fef0f2); border: 1px solid #f0d0d6; }
.summary-card .card-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.summary-card .card-amount { font-family: 'Noto Serif JP', serif; font-size: 20px; font-weight: 600; }
.summary-card.income .card-amount { color: var(--income); }
.summary-card.expense .card-amount { color: var(--expense); }
.summary-card .card-arrow { font-size: 12px; margin-top: 4px; }

.feature-grid { display: flex; gap: 8px; margin-bottom: 16px; }
.feature-tile {
  flex: 1;
  padding: 12px 8px;
  border-radius: 12px;
  text-align: center;
  cursor: pointer;
  background: var(--bg-sakura);
  border: 1px solid var(--border-sakura);
  transition: transform 0.2s;
}
.feature-tile:active { transform: scale(0.95); }
.feature-tile .tile-icon { font-size: 20px; margin-bottom: 4px; }
.feature-tile .tile-label { font-size: 11px; color: var(--text-primary); }

.txn-section { margin-bottom: 80px; }
.txn-date-header {
  font-size: 13px;
  color: var(--text-muted);
  padding: 8px 0 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.txn-row {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  gap: 12px;
  border-radius: 12px;
  margin-bottom: 2px;
  cursor: pointer;
  transition: background 0.15s;
}
.txn-row:active { background: var(--bg-sakura); }
.txn-row .txn-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.txn-row .txn-info { flex: 1; min-width: 0; }
.txn-row .txn-name { font-size: 14px; color: var(--text-primary); }
.txn-row .txn-time { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.txn-row .txn-amount { font-size: 15px; font-weight: 500; text-align: right; white-space: nowrap; }
.txn-row .txn-amount.is-income { color: var(--income); }
.txn-row .txn-amount.is-expense { color: var(--expense); }

/* FAB (positioned inside app-container, above tab-bar) */
.fab {
  position: absolute;
  bottom: 80px;
  right: 24px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--accent-sakura);
  color: #fff;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(245,160,184,0.4);
  z-index: 50;
  transition: transform 0.2s;
}
.fab:active { transform: scale(0.9); }
.fab svg { width: 24px; height: 24px; }

/* Add Record Modal */
.modal-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.modal-overlay.show { opacity: 1; pointer-events: auto; }
.modal-sheet {
  width: 100%;
  background: var(--bg-card);
  border-radius: 24px 24px 0 0;
  padding: 24px 20px 32px;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
}
.modal-overlay.show .modal-sheet { transform: translateY(0); }
.modal-handle {
  width: 36px;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  margin: 0 auto 20px;
}
.type-toggle {
  display: flex;
  background: var(--bg-secondary);
  border-radius: 12px;
  padding: 3px;
  margin-bottom: 20px;
}
.type-btn {
  flex: 1;
  padding: 10px;
  text-align: center;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
  border: none;
  background: none;
  font-family: 'Noto Sans JP', sans-serif;
  color: var(--text-secondary);
}
.type-btn.active {
  background: var(--bg-card);
  color: var(--text-primary);
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.amount-input-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 16px;
  background: var(--bg-secondary);
  border-radius: 16px;
  margin-bottom: 16px;
}
.amount-prefix { font-size: 28px; font-weight: 600; color: var(--text-muted); }
.amount-input {
  flex: 1;
  border: none;
  background: none;
  font-size: 32px;
  font-weight: 600;
  font-family: 'Noto Serif JP', serif;
  color: var(--text-primary);
  outline: none;
}
.amount-input::placeholder { color: var(--text-muted); font-size: 24px; }
.cat-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.cat-chip {
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
}
.cat-chip.active { border-color: var(--accent-sakura); background: var(--bg-sakura); color: var(--text-primary); }
.remark-input {
  width: 100%;
  padding: 12px 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg-secondary);
  font-size: 14px;
  font-family: 'Noto Sans JP', sans-serif;
  color: var(--text-primary);
  outline: none;
  margin-bottom: 12px;
  resize: none;
}
.remark-input::placeholder { color: var(--text-muted); }
.save-btn {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, #f5a0b8, #f0c0d0);
  color: #fff;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  font-family: 'Noto Sans JP', sans-serif;
  box-shadow: 0 4px 12px rgba(245,160,184,0.3);
  transition: transform 0.2s;
}
.save-btn:active { transform: scale(0.97); }

/* ==================== TAB 3: STATISTICS ==================== */
.stats-tab .period-selector { margin-bottom: 16px; }
.stats-tab .period-pills { display: flex; gap: 8px; margin-bottom: 10px; }
.stats-tab .period-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.stats-tab .period-arrow {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background: var(--bg-sakura);
  border: none;
  transition: transform 0.2s;
}
.stats-tab .period-arrow:active { transform: scale(0.9); }
.stats-tab .period-arrow svg { width: 14px; height: 14px; }
.stats-tab .period-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 15px;

      <!-- Recent Entries -->

      <div
        v-for="entry in recentEntries"
        :key="entry.date + entry.time"
        class="recent-entry"
        :style="{ borderLeftColor: moodColors[entry.mood] }"
      >
        <div class="entry-date">
          <span>{{ formatDate(entry.date) }}</span>
          <span>{{ moodEmojis[entry.mood] }} {{ entry.time }}</span>
        </div>
        <div class="entry-preview">{{ entry.content }}</div>
      </div>
    </div>
  `,
  setup() {
    const selectedMood = ref('happy');

    const moods = [
      { key: 'happy', emoji: '\uD83D\uDE04', label: '幸福' },
      { key: 'calm', emoji: '\uD83D\uDE0C', label: '平静' },
      { key: 'sad', emoji: '\uD83D\uDE22', label: '感伤' },
      { key: 'angry', emoji: '\uD83D\uDE2C', label: '生气' },
      { key: 'anxious', emoji: '\uD83D\uDE28', label: '忐忑' }
    ];

    // Build mood date map
    const moodMap = {};
    diaryEntries.forEach(e => {
      if (!moodMap[e.date]) moodMap[e.date] = e.mood;
    });

    // Compute week days
    const weekDays = computed(() => {
      const today = new Date(2026, 6, 12);
      const dayOfWeek = today.getDay();
      const monday = new Date(today);
      monday.setDate(today.getDate() - ((dayOfWeek + 6) % 7));
      const names = ['一', '二', '三', '四', '五', '六', '日'];
      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const dateStr = d.toISOString().split('T')[0];
        days.push({
          name: names[i],
          num: d.getDate(),
          isToday: dateStr === '2026-07-12',
          hasEntry: !!moodMap[dateStr],
          mood: moodMap[dateStr] || ''
        });
      }
      return days;
    });

    const todayDiary = diaryEntries[0];

    const recentEntries = diaryEntries.slice(1, 6);

    function formatDate(dateStr) {
      const parts = dateStr.split('-');
      return parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日';
    }

    return {
      selectedMood,
      moods,
      weekDays,
      todayDiary,
      recentEntries,
      formatDate,
      moodEmojis,
      moodColors,
      moodNames
    };
  }
};

      const idx = transactions.indexOf(txn);
      if (idx <= 0) return '';
      return transactions[idx - 1].date;

      const parts = dateStr.split('-');

      base.setMonth(base.getMonth() + monthOffset.value);
      expenseMonth.value = base.getFullYear() + '年' + (base.getMonth() + 1) + '月';

    return {
      expenseMonth,
      transactions,
      lastDateSeen,
      formatTxnDate,
      changeMonth

const StatsTab = {
  template: `
    <div class="tab-content stats-tab">
      <!-- Period Selector with Time Navigation -->
      <div class="period-selector">
        <div class="period-pills">
          <div
            v-for="p in periods"
            :key="p.key"
            class="period-pill"
            :class="{ active: currentPeriod === p.key }"
            @click="currentPeriod = p.key; periodOffset = 0"
          >{{ p.label }}</div>
        </div>
        <div class="period-nav">
          <button class="period-arrow" @click="changePeriod(-1)">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span class="period-title">{{ periodLabel }}</span>
          <button class="period-arrow" @click="changePeriod(1)">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>

      <!-- Chart -->
      <div class="chart-container">
        <canvas ref="chartCanvas"></canvas>
      </div>

      <!-- Ranking -->
      <div class="ranking-section">
        <div class="section-title">支出排行</div>
        <div
          v-for="(item, i) in rankingData"
          :key="item.cat"
          class="ranking-row"
        >
          <div class="ranking-num" :class="i < 3 ? 'rank-' + (i + 1) : ''">{{ i + 1 }}</div>
          <div class="ranking-info">
            <div class="ranking-cat">
              <span class="cat-dot" :style="{ background: item.color }"></span>
              <span class="cat-name">{{ item.cat }}</span>
            </div>
            <div class="ranking-bar-wrap">
              <div class="ranking-bar" :style="{ width: item.pct + '%', background: item.color }"></div>
            </div>
          </div>
          <div>
            <div class="ranking-amount">&#165;{{ item.amount.toLocaleString() }}</div>
            <div class="ranking-compare" :class="item.dir === 'up' ? 'up' : 'down'">
              {{ item.dir === 'up' ? '&#8593;' : '&#8595;' }} {{ item.compare.replace(/[+-]/, '') }}
              {{ item.dir === 'up' ? '比上月多花了' : '比上月节约了' }}
            </div>
          </div>
        </div>
      </div>
    </div>
  `,
  setup() {
    const currentPeriod = ref('month');
    const chartCanvas = ref(null);

    const periods = [
      { key: 'week', label: '周' },
      { key: 'month', label: '月' },
      { key: 'year', label: '年' }
    ];

    const periodOffset = ref(0);

    const periodLabel = computed(() => {
      const base = new Date(2026, 6, 12);
      if (currentPeriod.value === 'week') {
        const d = new Date(base);
        d.setDate(d.getDate() + periodOffset.value * 7);
        const start = new Date(d);
        start.setDate(d.getDate() - ((d.getDay() + 6) % 7));
        const end = new Date(start);
        end.setDate(start.getDate() + 6);
        return (start.getMonth() + 1) + '/' + start.getDate() + ' - ' + (end.getMonth() + 1) + '/' + end.getDate();
      } else if (currentPeriod.value === 'month') {
        const d = new Date(2026, 6 + periodOffset.value, 1);
        return d.getFullYear() + '年' + (d.getMonth() + 1) + '月';
      } else {
        return (2026 + periodOffset.value) + '年';
      }
    });

    function changePeriod(dir) {
      periodOffset.value += dir;
    }

    function drawChart() {
      const canvas = chartCanvas.value;
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const w = 335, h = 200;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, w, h);

      const data = chartData[currentPeriod.value];
      const labels = data.labels;
      const values = data.values;
      const maxVal = Math.max(...values) * 1.15;
      const minVal = 0;
      const padLeft = 40, padRight = 15, padTop = 15, padBottom = 30;
      const chartW = w - padLeft - padRight;
      const chartH = h - padTop - padBottom;

      // Grid lines
      ctx.strokeStyle = 'rgba(0,0,0,0.04)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = padTop + (chartH / 4) * i;
        ctx.beginPath();
        ctx.moveTo(padLeft, y);
        ctx.lineTo(w - padRight, y);
        ctx.stroke();
        const val = Math.round(maxVal - (maxVal / 4) * i);
        ctx.fillStyle = '#b5b0b8';
        ctx.font = '10px Noto Sans JP';
        ctx.textAlign = 'right';
        ctx.fillText(val, padLeft - 6, y + 3);
      }

      // X axis labels
      ctx.fillStyle = '#b5b0b8';
      ctx.font = '10px Noto Sans JP';
      ctx.textAlign = 'center';
      const step = chartW / (labels.length - 1);
      labels.forEach((label, i) => {
        const x = padLeft + step * i;
        ctx.fillText(label, x, h - 8);
      });

      // Compute points
      const points = values.map((v, i) => ({
        x: padLeft + step * i,
        y: padTop + chartH - ((v - minVal) / (maxVal - minVal)) * chartH
      }));

      // Area gradient
      const grad = ctx.createLinearGradient(0, padTop, 0, padTop + chartH);
      grad.addColorStop(0, 'rgba(245,160,184,0.3)');
      grad.addColorStop(1, 'rgba(245,160,184,0.02)');

      // Area fill
      ctx.beginPath();
      ctx.moveTo(points[0].x, padTop + chartH);
      points.forEach(p => ctx.lineTo(p.x, p.y));
      ctx.lineTo(points[points.length - 1].x, padTop + chartH);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      // Bezier line
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        const cp1x = (points[i - 1].x + points[i].x) / 2;
        const cp1y = points[i - 1].y;
        const cp2x = (points[i - 1].x + points[i].x) / 2;
        const cp2y = points[i].y;
        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, points[i].x, points[i].y);
      }
      ctx.strokeStyle = '#f5a0b8';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Data point circles
      points.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#f5a0b8';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
      });
    }

    onMounted(() => {
      nextTick(() => drawChart());
    });

    watch(currentPeriod, () => {
      nextTick(() => drawChart());
    });

    return {
      currentPeriod,
      periods,
      periodLabel,
      periodOffset,
      changePeriod,
      rankingData,
      chartCanvas
    };
  }
};

          <svg class="edit-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2">
            <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </div>
      </div>

      <!-- Stats -->
      <div class="profile-stats">
        <div class="stat-item">
          <div class="stat-num">42</div>
          <div class="stat-label">日记数</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <div class="stat-num">28</div>
          <div class="stat-label">记账天数</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <div class="stat-num">7天</div>
          <div class="stat-label">连续打卡</div>
        </div>
      </div>

      <!-- Menu -->
      <div class="menu-card">
        <div class="menu-item" v-for="item in menuItems" :key="item.label">
          <span class="menu-icon">{{ item.icon }}</span>
          <span class="menu-label">{{ item.label }}</span>
          <span class="menu-chevron">&#10095;</span>
        </div>
      </div>
    </div>
  `,
  setup() {
    const menuItems = [
      { icon: '\u{1F3A8}', label: '主题设置' },
      { icon: '\u{1F4C2}', label: '数据备份' },
      { icon: '\u{1F514}', label: '提醒设置' },
      { icon: '\u{2139}\uFE0F', label: '关于' }
    ];
    return { menuItems };
  }
};

// ==================== MAIN APP ====================

const app = createApp({
  components: {
    DiaryTab,
    ExpenseTab,
    StatsTab,
    MomentsTab,
    ProfileTab
  },
  template: `
    <div class="app-container">
      <div class="tab-content-wrapper">
        <transition name="tab-fade" mode="out-in">
          <component :is="activeComponent" :key="currentTab" />
        </transition>
      </div>

      <!-- Toast -->
      <transition name="tab-fade">
        <div v-if="showToast" class="toast-msg">{{ toastMsg }}</div>
      </transition>

      <!-- FAB Button (only on expense tab) -->
      <button v-if="currentTab === 'expense'" class="fab" @click="showAddRecord = true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>

      <!-- Add Record Modal (only on expense tab) -->
      <transition name="tab-fade">
        <div v-if="currentTab === 'expense' && showAddRecord" class="modal-overlay show" @click.self="showAddRecord = false">
          <div class="modal-sheet">
            <div class="modal-handle"></div>
            <div class="type-toggle">
              <div class="type-btn" :class="{ active: addRecordType === 'expense' }" @click="addRecordType = 'expense'; selectedCatIndex = 0">支出</div>
              <div class="type-btn" :class="{ active: addRecordType === 'income' }" @click="addRecordType = 'income'; selectedCatIndex = 0">收入</div>
            </div>
            <div class="amount-input-wrap">
              <span class="amount-prefix">&#165;</span>
              <input class="amount-input" type="number" placeholder="0.00" v-model="newRecord.amount">
            </div>
            <div class="cat-chips">
              <div v-for="(cat, i) in currentCats" :key="cat" class="cat-chip" :class="{ active: selectedCatIndex === i }" @click="selectedCatIndex = i">{{ cat }}</div>
            </div>
            <input class="remark-input" placeholder="备注..." v-model="newRecord.remark">
            <button class="save-btn" @click="saveRecord">保存</button>
          </div>
        </div>
      </transition>

      <!-- Tab Bar -->
      <div class="tab-bar">
        <button
          v-for="tab in tabs"
          :key="tab.key"
          class="tab-item"
          :class="{ active: currentTab === tab.key }"
          @click="currentTab = tab.key"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" v-html="tab.icon"></svg>
          <span class="tab-label">{{ tab.label }}</span>
        </button>
      </div>
    </div>
  `,
  setup() {
    const currentTab = ref('diary');
    const showToast = ref(false);
    const toastMsg = ref('');

    // Add record state (used by FAB in main template)
    const showAddRecord = ref(false);
    const addRecordType = ref('expense');
    const newRecord = reactive({ amount: '', category: '', remark: '', date: '2026-07-12' });
    const selectedCatIndex = ref(0);
    const currentCats = computed(() => {
      return addRecordType.value === 'expense' ? expenseCats : incomeCats;
    });
    function saveRecord() {
      showAddRecord.value = false;
      newRecord.amount = '';
      newRecord.remark = '';
      selectedCatIndex.value = 0;
    }
    watch(addRecordType, () => { selectedCatIndex.value = 0; });

    const tabs = [
      {
        key: 'diary',
        label: '日记',
        icon: '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" class="filled"/><path d="M22 6l-10 7L2 6"/>'
      },
      {
        key: 'expense',
        label: '记账',
        icon: '<rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 9h20"/><path d="M9 21V9"/>'
      },
      {
        key: 'stats',
        label: '统计',
        icon: '<path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/>'
      },
      {
        key: 'moments',
        label: '动态',
        icon: '<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>'
      },
      {
        key: 'profile',
        label: '我的',
        icon: '<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>'
      }
    ];

    const activeComponent = computed(() => {
      const map = {
        diary: 'DiaryTab',
        expense: 'ExpenseTab',
        stats: 'StatsTab',
        moments: 'MomentsTab',
        profile: 'ProfileTab'
      };
      return map[currentTab.value];
    });

    return {
      currentTab,
      activeComponent,
      tabs,
      showToast,
      toastMsg,
      showAddRecord,
      addRecordType,
      newRecord,
      selectedCatIndex,
      currentCats,
      saveRecord
    };
  }
});

app.mount('#app');
  </script>
</body>
</html>
