<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 简历优化系统 - TRAE Demo</title>
  <style>
    :root {
      --bg: #0a0e1a; --bg2: rgba(18,24,41,0.7); --bg3: rgba(26,35,66,0.6); --bg4: #243055;
      --ink: #f0f2f8; --muted: #7a82a0; --rule: rgba(42,54,85,0.5);
      --accent: #00d4aa; --accent2: #5b7cff; --accent-dim: rgba(0,212,170,0.08);
      --danger: #ff5b7c; --warning: #ffc75b; --success: #00d4aa;
      --add: #00d4aa; --del: #ff5b7c; --mod: #5b7cff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; min-height: 100vh; }
    .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
    h1 { text-align: center; font-size: 2rem; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.3rem; letter-spacing: -0.5px; }
    .subtitle { text-align: center; color: var(--muted); margin-bottom: 2.5rem; font-size: 0.9rem; }

    /* Steps indicator */
    .steps { display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: 2rem; }
    .step { display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1.2rem; border-radius: 100px; font-size: 0.85rem; color: var(--muted); background: var(--bg2); border: 1px solid var(--rule); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: all 0.25s cubic-bezier(0.4,0,0.2,1); }
    .step.active { background: linear-gradient(135deg, rgba(0,212,170,0.15), rgba(91,124,255,0.1)); color: var(--accent); border-color: var(--accent); font-weight: 600; box-shadow: 0 0 20px rgba(0,212,170,0.1); }
    .step.done { background: rgba(0,212,170,0.12); color: var(--accent); border-color: var(--accent); }
    .step-arrow { color: var(--rule); margin: 0 0.5rem; font-size: 1.2rem; }

    .panel { background: var(--bg2); border: 1px solid var(--rule); border-radius: 16px; padding: 2rem; margin-bottom: 1.5rem; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05); }
    .panel-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }

    /* Upload */
    .upload-area { border: 2px dashed var(--rule); border-radius: 16px; padding: 3.5rem; text-align: center; cursor: pointer; transition: all 0.3s cubic-bezier(0.4,0,0.2,1); user-select: none; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .upload-area:hover { border-color: var(--accent); background: var(--accent-dim); box-shadow: 0 8px 32px rgba(0,212,170,0.1); transform: translateY(-2px); }
    .upload-area.has-file { border-style: solid; border-color: var(--accent); background: var(--accent-dim); box-shadow: 0 8px 32px rgba(0,212,170,0.15); }
    .upload-area .icon { font-size: 3rem; margin-bottom: 1rem; }
    .upload-area .title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; }
    .upload-area .text { color: var(--muted); font-size: 0.9rem; }
    .upload-area .filename { color: var(--accent); font-weight: 600; margin-top: 1rem; font-size: 1rem; }
    .upload-area .hint { color: var(--muted); font-size: 0.8rem; margin-top: 0.5rem; }
    .resume-preview { background: var(--bg3); border: 1px solid var(--rule); border-radius: 10px; padding: 1.2rem; font-size: 0.85rem; color: var(--muted); max-height: 200px; overflow-y: auto; margin-top: 1rem; white-space: pre-wrap; line-height: 1.7; }

    .btn { padding: 0.8rem 2rem; border-radius: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.25s cubic-bezier(0.4,0,0.2,1); display: inline-flex; align-items: center; gap: 0.5rem; font-family: inherit; }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--bg); position: relative; overflow: hidden; }
    .btn-primary::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent); opacity: 0; transition: opacity 0.25s; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,212,170,0.3); }
    .btn-primary:hover::after { opacity: 1; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-secondary { background: var(--bg3); border: 1px solid var(--rule); color: var(--ink); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .btn-secondary:hover { border-color: var(--accent); background: rgba(0,212,170,0.06); }
    .btn-download { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .btn-download:hover { background: rgba(0,212,170,0.15); box-shadow: 0 4px 16px rgba(0,212,170,0.15); }
    .btn-group { display: flex; gap: 1rem; margin-top: 1.5rem; justify-content: center; }

    /* Jobs */
    .jobs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin: 1rem 0; }
    .job-card { background: var(--bg3); border: 1px solid var(--rule); border-radius: 14px; padding: 1.4rem; transition: all 0.25s cubic-bezier(0.4,0,0.2,1); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .job-card:hover { border-color: var(--accent2); transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.35), 0 0 0 1px rgba(91,124,255,0.15); }
    .job-header { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.8rem; }
    .job-icon { width: 44px; height: 44px; background: var(--bg4); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .job-title { font-weight: 600; font-size: 1rem; }
    .job-company { font-size: 0.8rem; color: var(--muted); }
    .job-salary { font-size: 0.85rem; color: var(--accent); font-weight: 600; margin-bottom: 0.5rem; }
    .job-desc { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.8rem; }
    .job-reqs { font-size: 0.8rem; }
    .job-reqs-title { font-weight: 600; margin-bottom: 0.3rem; font-size: 0.8rem; }
    .job-reqs-list { color: var(--muted); padding-left: 1.2rem; margin: 0; }
    .job-reqs-list li { margin-bottom: 0.2rem; }
    .job-focus { margin-top: 0.8rem; font-size: 0.8rem; color: var(--accent); padding: 0.5rem 0.8rem; background: var(--accent-dim); border-radius: 8px; }

    /* Resumes - Stacked tabs */
    .resumes-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; justify-content: center; flex-wrap: wrap; }
    .resumes-tab { padding: 0.6rem 1.4rem; border-radius: 12px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: 1px solid var(--rule); background: var(--bg3); color: var(--muted); transition: all 0.25s cubic-bezier(0.4,0,0.2,1); display: flex; align-items: center; gap: 0.5rem; font-family: inherit; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .resumes-tab:hover { border-color: var(--accent2); color: var(--ink); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
    .resumes-tab.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--bg); border-color: transparent; box-shadow: 0 4px 20px rgba(0,212,170,0.25); transform: translateY(-1px); }
    .resumes-tab .tab-score { font-size: 0.75rem; padding: 0.1rem 0.5rem; border-radius: 100px; background: rgba(255,255,255,0.15); }
    .resume-stack { position: relative; }
    .resume-stack .resume-card { display: none; width: 100%; }
    .resume-stack .resume-card.active { display: block; animation: fadeIn 0.35s ease-out; }
    .resume-card { background: var(--bg3); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; transition: all 0.25s cubic-bezier(0.4,0,0.2,1); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .resume-card:hover { border-color: var(--accent); box-shadow: 0 12px 40px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,212,170,0.1); }
    .resume-card-header { padding: 1rem 1.2rem; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: center; background: var(--bg2); }
    .resume-target { font-weight: 600; font-size: 0.95rem; }
    .resume-match { font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 100px; font-weight: 700; }
    .resume-match.high { background: rgba(0,212,170,0.15); color: var(--accent); }
    .resume-match.medium { background: rgba(255,199,91,0.15); color: var(--warning); }
    .resume-content { padding: 1rem 1.2rem; font-size: 0.82rem; max-height: 600px; overflow-y: auto; line-height: 1.7; white-space: pre-wrap; }
    .resume-content .section-title { color: var(--accent); font-weight: 700; font-size: 0.85rem; margin: 1rem 0 0.4rem; padding-bottom: 0.2rem; border-bottom: 1px solid var(--rule); }
    .resume-content .section-title:first-child { margin-top: 0; }
    .resume-content .add { background: rgba(0,212,170,0.12); color: var(--add); padding: 0 3px; border-radius: 3px; font-weight: 500; }
    .resume-content .del { background: rgba(255,91,124,0.12); color: var(--del); text-decoration: line-through; padding: 0 3px; border-radius: 3px; }
    .resume-content .mod { background: rgba(91,124,255,0.12); color: var(--mod); padding: 0 3px; border-radius: 3px; font-weight: 500; }
    .resume-content .highlight { color: var(--accent); font-weight: 600; }
    .resume-changes { padding: 0.8rem 1.2rem; border-top: 1px solid var(--rule); background: var(--bg2); }
    .change-item { display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.78rem; margin-bottom: 0.35rem; }
    .change-icon { color: var(--accent); font-weight: 700; flex-shrink: 0; }
    .change-text { color: var(--muted); }
    .change-count { font-size: 0.7rem; color: var(--muted); margin-left: auto; white-space: nowrap; }

    /* Compare mode */
    .compare-toggle { display: flex; align-items: center; justify-content: center; gap: 0.8rem; margin-bottom: 1rem; }
    .compare-toggle label { font-size: 0.85rem; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 0.4rem; }
    .compare-toggle input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
    .compare-selectors { display: flex; gap: 0.8rem; justify-content: center; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
    .compare-selectors label { font-size: 0.85rem; color: var(--muted); }
    .compare-selectors select { padding: 0.5rem 1rem; border-radius: 10px; background: var(--bg3); color: var(--ink); border: 1px solid var(--rule); font-size: 0.85rem; font-family: inherit; cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: all 0.2s; }
    .compare-selectors select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,170,0.1); }
    .compare-selectors .vs { font-size: 0.85rem; color: var(--accent); font-weight: 700; }
    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .compare-grid .resume-card { display: block; }
    .compare-grid .resume-content { max-height: 70vh; }
    .compare-label { position: sticky; top: 0; z-index: 2; background: var(--accent); color: var(--bg); font-size: 0.8rem; font-weight: 700; padding: 0.3rem 1rem; text-align: center; }

    /* Diff view */
    .diff-legend { display: flex; gap: 1.5rem; margin-bottom: 1rem; font-size: 0.8rem; }
    .diff-legend span { display: flex; align-items: center; gap: 0.3rem; }
    .diff-legend .dot { width: 10px; height: 10px; border-radius: 3px; }
    .diff-legend .dot.add { background: var(--add); }
    .diff-legend .dot.del { background: var(--del); }
    .diff-legend .dot.mod { background: var(--mod); }

    /* Comparison toggle */
    .compare-bar { display: flex; gap: 0.5rem; margin-bottom: 1rem; justify-content: center; }
    .compare-bar .btn { padding: 0.5rem 1.2rem; font-size: 0.85rem; }
    .compare-bar .btn.active { background: var(--accent); color: var(--bg); }

    .progress { height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; margin: 1rem 0; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.3s; }

    .hidden { display: none !important; }
    .loading { text-align: center; padding: 2rem; color: var(--muted); }
    .loading .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--rule); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 0.5rem; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.5s ease-out; }

    .error { color: var(--danger); background: rgba(255,91,124,0.08); border: 1px solid var(--danger); border-radius: 12px; padding: 1rem; margin: 1rem 0; font-size: 0.9rem; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .success-box { color: var(--accent); background: var(--accent-dim); border: 1px solid rgba(0,212,170,0.2); border-radius: 12px; padding: 1rem; margin: 1rem 0; font-size: 0.9rem; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

    /* Parsed info display */
    .parsed-info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; margin: 1rem 0; }
    .parsed-item { background: var(--bg3); border: 1px solid var(--rule); border-radius: 12px; padding: 0.8rem 1rem; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: all 0.2s; }
    .parsed-item:hover { border-color: var(--accent2); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.2); }
    .parsed-item .label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; margin-bottom: 0.2rem; }
    .parsed-item .value { font-size: 0.85rem; font-weight: 600; }

    @media (max-width: 1100px) { .jobs-grid, .parsed-info { grid-template-columns: 1fr; } .compare-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎯 AI 简历优化系统</h1>
    <p class="subtitle">上传一份简历 → TRAE 深度解析 → 生成三份针对性简历</p>

    <!-- Steps -->
    <div class="steps" id="steps-bar">
      <div class="step active" id="step1">📄 上传简历</div>
      <span class="step-arrow">→</span>
      <div class="step" id="step2">💼 岗位分析</div>
      <span class="step-arrow">→</span>
      <div class="step" id="step3">📝 AI 生成</div>
    </div>

    <!-- Step 1: Upload -->
    <div class="panel" id="panel-upload">
      <div class="panel-title">📄 第一步：上传原始简历</div>
      <div class="upload-area" id="upload-area" onclick="handleUpload()">
        <div class="icon">📤</div>
        <div class="title">点击此处上传简历</div>
        <div class="text">支持 PDF / TXT 格式</div>
        <div class="hint">点击后会弹出文件选择窗口</div>
        <div class="filename hidden" id="filename"></div>
      </div>
      <div class="error hidden" id="error-msg"></div>
      <div class="success-box hidden" id="parse-success">
        <strong>✅ 简历解析成功</strong><br>
        <span id="parse-detail"></span>
      </div>
      <div class="parsed-info hidden" id="parsed-info"></div>
      <div class="resume-preview hidden" id="resume-preview"></div>
      <div class="btn-group">
        <button class="btn btn-primary" id="btn-start" disabled onclick="goToJobs()">🚀 开始 AI 分析</button>
      </div>
      <div id="status" style="text-align:center;margin-top:1rem;font-size:0.85rem;color:var(--muted)">请先上传简历文件</div>
    </div>

    <!-- Step 2: Job Matching -->
    <div class="panel hidden" id="panel-jobs">
      <div class="panel-title">💼 第二步：目标岗位分析</div>
      <p style="font-size:0.9rem;color:var(--muted);margin-bottom:1rem">以下是三个不同方向的财务岗位，TRAE 将针对每个岗位生成专属简历：</p>
      <div class="jobs-grid" id="jobs-grid"></div>
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="goToUpload()">← 返回修改</button>
        <button class="btn btn-primary" onclick="generateResumes()">✨ 生成三份针对性简历</button>
      </div>
    </div>

    <!-- Step 3: Generated Resumes -->
    <div class="panel hidden" id="panel-resumes">
      <div class="panel-title">📝 第三步：AI 生成的针对性简历</div>
      <div class="diff-legend">
        <span><span class="dot add"></span> 新增内容</span>
        <span><span class="dot del"></span> 删除/弱化内容</span>
        <span><span class="dot mod"></span> 修改/替换内容</span>
      </div>
      <div class="progress"><div class="progress-bar" id="progress" style="width:0%"></div></div>
      <div class="loading" id="loading"><span class="spinner"></span>TRAE 正在深度分析岗位要求并优化简历...</div>
      <div class="hidden" id="resumes-container">
        <div class="compare-toggle">
          <label><input type="checkbox" id="compare-mode" onchange="toggleCompareMode()"> 对比模式</label>
        </div>
        <div id="stacked-view">
          <div class="resumes-tabs" id="resumes-tabs"></div>
          <div class="resume-stack" id="resume-stack"></div>
        </div>
        <div class="hidden" id="compare-view">
          <div class="compare-selectors" id="compare-selectors"></div>
          <div class="compare-grid" id="compare-grid"></div>
        </div>
      </div>
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="goToJobs()">← 返回</button>
        <button class="btn btn-primary" onclick="downloadAll()">📥 打包下载全部</button>
      </div>
    </div>
  </div>

<script>
// ===== Resume Parser =====
let resumeText = '';
let parsedResume = null;

const jobs = [
  {
    id: 1,
    title: '财务BP（业务财务伙伴）',
    company: '某头部互联网大厂',
    icon: '📊',
    salary: '30-45K · 15薪',
    desc: '深入业务线，提供财务决策支持，推动业务增长。',
    requirements: ['财务分析与业务理解能力', '预算编制与执行监控', '成本控制与优化', '数据驱动决策', '跨部门沟通协调', 'Excel/SQL/BI工具'],
    focus: '强调业务理解、数据驱动、沟通协调能力',
    keywords: ['业务分析', '预算管理', '成本优化', '数据驱动', '跨部门协作', '财务建模'],
    weights: { '业务理解': 3, '数据驱动': 3, '沟通协调': 2, '预算管理': 2, '财务分析': 2, 'SQL': 1, 'Power BI': 1 }
  },
  {
    id: 2,
    title: '审计专员',
    company: '某四大会计师事务所',
    icon: '🔍',
    salary: '20-35K · 13薪',
    desc: '执行审计程序，评估内部控制，出具审计报告。',
    requirements: ['审计程序执行能力', '内部控制评估', '风险识别与应对', '审计报告编制', '会计准则掌握', 'CPA/CIA优先'],
    focus: '强调审计经验、风险意识、专业证书',
    keywords: ['审计程序', '内部控制', '风险评估', '审计报告', '会计准则', '合规'],
    weights: { '审计': 3, '内部控制': 3, '风险评估': 2, 'CPA': 2, '会计准则': 2, 'IPO': 1, '合规': 1 }
  },
  {
    id: 3,
    title: '管理会计',
    company: '某大型制造企业',
    icon: '📈',
    salary: '25-40K · 14薪',
    desc: '成本核算、预算管理、经营分析，支持管理决策。',
    requirements: ['成本核算与分析', '全面预算管理', '经营分析与报告', 'ERP系统操作', '流程优化', 'CMA优先'],
    focus: '强调成本核算、预算管理、制造业经验',
    keywords: ['成本核算', '预算编制', '经营分析', 'ERP/SAP', '流程优化', '管理报告'],
    weights: { '成本核算': 3, '预算管理': 3, '经营分析': 2, 'ERP': 2, 'SAP': 1, '流程优化': 1, '制造业': 1 }
  }
];

function parseResume(text) {
  const p = {};
  // Name
  const nameMatch = text.match(/姓名[：:]\s*(.+)/);
  p.name = nameMatch ? nameMatch[1].trim() : '求职者';
  // Phone
  const phoneMatch = text.match(/手机[：:]\s*([\d\-]+)/);
  p.phone = phoneMatch ? phoneMatch[1].trim() : '';
  // Email
  const emailMatch = text.match(/邮箱[：:]\s*(\S+@\S+)/);
  p.email = emailMatch ? emailMatch[1].trim() : '';
  // Years
  const yearsMatch = text.match(/工作年限[：:]\s*(\d+)/);
  p.years = yearsMatch ? parseInt(yearsMatch[1]) : 5;
  // Target position
  const targetMatch = text.match(/期望岗位[：:]\s*(.+)/);
  p.target = targetMatch ? targetMatch[1].trim() : '财务相关岗位';
  // Education
  const eduMatch = text.match(/(\d{4}\.\d{2}\s*-\s*\d{4}\.\d{2})\s+(.+?)\s+(.+?)\s+(.+)/);
  p.education = eduMatch ? { period: eduMatch[1].trim(), school: eduMatch[2].trim(), major: eduMatch[3].trim(), degree: eduMatch[4].trim() } : null;
  // Work experiences
  p.experiences = [];
  const expBlocks = text.split(/【(\d{4}\.\d{2}\s*-\s*(?:至今|\d{4}\.\d{2}))】/);
  for (let i = 1; i < expBlocks.length; i += 2) {
    const period = expBlocks[i].trim();
    const content = expBlocks[i+1] || '';
    const companyMatch = content.match(/^(.+?)\s{2,}/);
    const company = companyMatch ? companyMatch[1].trim() : '';
    const titleMatch = content.match(/\s{2,}(.+?)(?:\n|$)/);
    const title = titleMatch ? titleMatch[1].trim() : '';
    const duties = [];
    const dutyMatches = content.match(/工作职责[：:]?\n([\s\S]*?)(?=工作成果|────────────────|════════════════)/);
    if (dutyMatches) {
      dutyMatches[1].split('\n').forEach(function(line) {
        const m = line.match(/•\s*(.+)/);
        if (m) duties.push(m[1].trim());
      });
    }
    const achievements = [];
    const achMatches = content.match(/工作成果[：:]?\n([\s\S]*?)(?=────────────────|════════════════|$)/);
    if (achMatches) {
      achMatches[1].split('\n').forEach(function(line) {
        const m = line.match(/•\s*(.+)/);
        if (m) achievements.push(m[1].trim());
      });
    }
    p.experiences.push({ period, company, title, duties, achievements });
  }
  // Skills
  p.skills = [];
  const skillMatch = text.match(/专业技能[\s\S]*?(?=证书资质|════════════════)/);
  if (skillMatch) {
    skillMatch[0].split('\n').forEach(function(line) {
      const m = line.match(/•\s*(.+)/);
      if (m) p.skills.push(m[1].trim());
    });
  }
  // Certificates
  p.certificates = [];
  const certMatch = text.match(/证书资质[\s\S]*?(?=自我评价|════════════════|$)/);
  if (certMatch) {
    certMatch[0].split('\n').forEach(function(line) {
      const m = line.match(/•\s*(.+)/);
      if (m) p.certificates.push(m[1].trim());
    });
  }
  // Self eval
  const selfMatch = text.match(/自我评价[\s\S]*$/);
  p.selfEval = selfMatch ? selfMatch[0].replace(/自我评价[\s\S]*?═+\n/, '').trim() : '';

  return p;
}

function calculateMatchScore(parsed, job) {
  let score = 50;
  const text = (parsed.target + ' ' + parsed.skills.join(' ') + ' ' + parsed.experiences.map(function(e){return e.title+' '+e.duties.join(' ')}).join(' ')).toLowerCase();
  for (let kw in job.weights) {
    if (text.indexOf(kw) >= 0) score += job.weights[kw] * 3;
  }
  // Bonus for certificates
  if (job.id === 2) {
    const hasCPA = parsed.certificates.some(function(c){return c.indexOf('CPA')>=0 || c.indexOf('注册')>=0});
    if (hasCPA) score += 8;
  }
  if (job.id === 3) {
    const hasCMA = parsed.certificates.some(function(c){return c.indexOf('CMA')>=0});
    if (hasCMA) score += 8;
  }
  // Cap at 98
  return Math.min(98, Math.max(55, score));
}

function handleUpload() {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.pdf,.txt';
  input.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    document.getElementById('filename').textContent = '✅ ' + file.name;
    document.getElementById('filename').classList.remove('hidden');
    document.getElementById('upload-area').classList.add('has-file');
    document.getElementById('status').textContent = '正在解析文件...';

    var reader = new FileReader();
    reader.onload = function(evt) {
      try {
        resumeText = evt.target.result;
        if (resumeText.length < 10) throw new Error('文件内容为空或过短');
        parsedResume = parseResume(resumeText);

        // Show preview
        document.getElementById('resume-preview').textContent = resumeText.substring(0, 800) + '...';
        document.getElementById('resume-preview').classList.remove('hidden');

        // Show parsed info
        var infoHtml = '';
        infoHtml += '<div class="parsed-item"><div class="label">姓名</div><div class="value">' + parsedResume.name + '</div></div>';
        infoHtml += '<div class="parsed-item"><div class="label">工作年限</div><div class="value">' + parsedResume.years + ' 年</div></div>';
        infoHtml += '<div class="parsed-item"><div class="label">工作经历</div><div class="value">' + parsedResume.experiences.length + ' 段</div></div>';
        infoHtml += '<div class="parsed-item"><div class="label">技能项</div><div class="value">' + parsedResume.skills.length + ' 项</div></div>';
        infoHtml += '<div class="parsed-item"><div class="label">证书</div><div class="value">' + parsedResume.certificates.length + ' 项</div></div>';
        infoHtml += '<div class="parsed-item"><div class="label">目标岗位</div><div class="value">' + parsedResume.target + '</div></div>';
        document.getElementById('parsed-info').innerHTML = infoHtml;
        document.getElementById('parsed-info').classList.remove('hidden');

        // Show success
        document.getElementById('parse-success').classList.remove('hidden');
        document.getElementById('parse-detail').textContent = '成功提取 ' + parsedResume.experiences.length + ' 段工作经历、' + parsedResume.skills.length + ' 项技能、' + parsedResume.certificates.length + ' 个证书';

        document.getElementById('btn-start').disabled = false;
        document.getElementById('status').textContent = '✅ 简历解析成功！点击下方按钮开始分析';
        document.getElementById('error-msg').classList.add('hidden');
      } catch (err) {
        document.getElementById('error-msg').textContent = '❌ 文件解析失败：' + err.message;
        document.getElementById('error-msg').classList.remove('hidden');
        document.getElementById('status').textContent = '请重新上传文件';
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function updateSteps(n) {

// ===== Resume Generation =====
function generateResumes() {
  document.getElementById('panel-jobs').classList.add('hidden');
  document.getElementById('panel-resumes').classList.remove('hidden');
  updateSteps(3);

  var progress = document.getElementById('progress');
  var loading = document.getElementById('loading');
  var container = document.getElementById('resumes-container');

  container.classList.add('hidden');
  loading.classList.remove('hidden');

  var pct = 0;
  var interval = setInterval(function() {
    pct += 3;
    progress.style.width = pct + '%';
    if (pct >= 100) {
      clearInterval(interval);
      setTimeout(function() {
        loading.classList.add('hidden');
        container.classList.remove('hidden');

        // Build tabs
        var tabsHtml = '<div style="margin-bottom:1rem;font-size:0.9rem;color:var(--muted);text-align:center">✅ TRAE 已根据原始简历内容和三个目标岗位 JD，生成三份深度定制的针对性简历：</div>';
        tabsHtml += jobs.map(function(job, idx) {
          var score = calculateMatchScore(parsedResume, job);
          var activeClass = idx === 0 ? ' active' : '';
          return '<button class="resumes-tab' + activeClass + '" onclick="switchTab(' + idx + ')">' + job.icon + ' ' + job.title + '<span class="tab-score">' + score + '%</span></button>';
        }).join('');
        document.getElementById('resumes-tabs').innerHTML = tabsHtml;

        // Build stacked cards
        var stackHtml = jobs.map(function(job, idx) {
          var activeClass = idx === 0 ? ' active' : '';
          return '<div class="resume-card' + activeClass + '">' + generateResumeCardContent(job) + '</div>';
        }).join('');
        document.getElementById('resume-stack').innerHTML = stackHtml;

        // Build compare selectors
        var selHtml = '<label>简历 A：</label><select id="compare-a" onchange="updateCompareView()">' +
          jobs.map(function(job, idx) { return '<option value="' + idx + '">' + job.icon + ' ' + job.title + '</option>'; }).join('') +
          '</select><span class="vs">VS</span><label>简历 B：</label><select id="compare-b" onchange="updateCompareView()">' +
          jobs.map(function(job, idx) { return '<option value="' + idx + '"' + (idx === 1 ? ' selected' : '') + '>' + job.icon + ' ' + job.title + '</option>'; }).join('') +
          '</select>';
        document.getElementById('compare-selectors').innerHTML = selHtml;

        // Build compare grid (initial)
        updateCompareView();

        // Reset compare mode
        document.getElementById('compare-mode').checked = false;
        document.getElementById('stacked-view').classList.remove('hidden');
        document.getElementById('compare-view').classList.add('hidden');
      }, 400);
    }
  }, 80);
}

function switchTab(idx) {
  var tabs = document.querySelectorAll('.resumes-tab');
  var cards = document.querySelectorAll('.resume-stack .resume-card');
  tabs.forEach(function(t, i) { t.classList.toggle('active', i === idx); });
  cards.forEach(function(c, i) { c.classList.toggle('active', i === idx); });
}

function toggleCompareMode() {
  var isCompare = document.getElementById('compare-mode').checked;
  document.getElementById('stacked-view').classList.toggle('hidden', isCompare);
  document.getElementById('compare-view').classList.toggle('hidden', !isCompare);
  if (isCompare) updateCompareView();
}

function updateCompareView() {
  var a = parseInt(document.getElementById('compare-a').value);
  var b = parseInt(document.getElementById('compare-b').value);
  if (a === b) b = (a + 1) % jobs.length;
  var grid = document.getElementById('compare-grid');
  grid.innerHTML =
    '<div><div class="compare-label">' + jobs[a].icon + ' ' + jobs[a].title + '</div>' + generateResumeCardContent(jobs[a]) + '</div>' +
    '<div><div class="compare-label">' + jobs[b].icon + ' ' + jobs[b].title + '</div>' + generateResumeCardContent(jobs[b]) + '</div>';
}

        return '<div class="change-item"><span class="change-icon">+</span><span class="change-text">' + c.text + '</span><span class="change-count">' + c.count + '</span></div>';
      }).join('') +
    '</div>' +
    '<div style="padding:0.8rem 1.2rem;border-top:1px solid var(--rule);">' +
      '<button class="btn btn-download" style="width:100%;justify-content:center;" onclick="downloadResume(\'' + job.title.replace(/'/g, "\\'") + '\', this)">📥 下载此份简历</button>' +
    '</div>';
}

function buildResumeContent(p, job, opts) {
  var html = '';

  // Basic info
  html += '<div class="section-title">═══════════════════════════════════════</div>';
  html += '<div class="section-title">基本信息</div>';
  html += '姓名：' + p.name + '\n';
  html += '手机：' + p.phone + '\n';
  html += '邮箱：' + p.email + '\n';
  html += '工作年限：' + p.years + '年\n\n';

  // Target
  html += '<div class="section-title">═══════════════════════════════════════</div>';
  html += '<div class="section-title">求职意向</div>';
  html += '期望岗位：<span class="mod">' + opts.title + '</span> <span class="del">' + p.target + '</span>\n';
  html += '期望薪资：' + job.salary.split('·')[0].trim() + '\n';
  html += '期望城市：上海 / 杭州\n';
  html += '到岗时间：1个月内\n\n';

  // Education
  if (p.education) {
    html += '<div class="section-title">═══════════════════════════════════════</div>';
    html += '<div class="section-title">教育背景</div>';
    html += p.education.period + '    ' + p.education.school + '    ' + p.education.major + '    ' + p.education.degree + '\n';
    html += '主修课程：财务会计、管理会计、成本会计、财务管理、审计学、税法\n\n';
  }

  // Work experience - tailored
  html += '<div class="section-title">═══════════════════════════════════════</div>';
  html += '<div class="section-title">工作经历</div>\n';

  p.experiences.forEach(function(exp, idx) {
    var isAudit = exp.company.indexOf('事务所') >= 0 || exp.title.indexOf('审计') >= 0;
    var isInternet = exp.company.indexOf('互联网') >= 0 || exp.title.indexOf('财务BP') >= 0;

    // For audit job, put audit experience first
    if (job.id === 2 && isAudit) {
      html += '<span class="add">【重点经历】</span>\n';
    }
    // For management accounting, highlight cost management
    if (job.id === 3 && isInternet) {
      html += '<span class="add">【核心经历】</span>\n';
    }

    html += '【' + exp.period + '】' + exp.company + '    ';
    if (idx === 0) {
      html += '<span class="mod">' + opts.expTitle + '</span> <span class="del">' + exp.title + '</span>\n\n';
    } else {
      html += exp.title + '\n\n';
    }

    html += '工作职责：\n';
    exp.duties.forEach(function(duty) {
      if (opts.dutyTransforms[duty]) {
        html += '• ' + opts.dutyTransforms[duty] + '\n';
      } else {
        html += '• ' + duty + '\n';
      }
    });
    html += '\n工作成果：\n';
    exp.achievements.forEach(function(ach) {
      if (opts.achTransforms[ach]) {
        html += '• ' + opts.achTransforms[ach] + '\n';
      } else {
        html += '• ' + ach + '\n';
      }
    });
    html += '\n───────────────────────────────────────\n\n';
  });

  // Skills
  html += '<div class="section-title">═══════════════════════════════════════</div>';
  html += '<div class="section-title">专业技能</div>\n';
  html += '财务技能：\n';
  p.skills.forEach(function(skill) {
    if (skill.indexOf('财务分析') >= 0) {
      html += '• <span class="mod">' + skill + '</span>\n';
    } else if (skill.indexOf('预算管理') >= 0 && job.id === 3) {
      html += '• <span class="highlight">' + skill + '</span>\n';
    } else if (skill.indexOf('成本控制') >= 0 && job.id === 3) {
      html += '• <span class="highlight">' + skill + '</span>\n';
    } else {
      html += '• ' + skill + '\n';
    }
  });
  // Add job-specific skills
  if (opts.skillAdd) {
    opts.skillAdd.forEach(function(s) { html += s + '\n'; });
  }
  html += '\n工具技能：\n';
  html += '• Excel：精通（数据透视表、VLOOKUP、宏）\n';
  html += '• SQL：熟练（复杂查询、数据提取）\n';
  html += '• Power BI：熟练（数据建模、可视化报表）\n';
  if (job.id === 3) {
    html += '• <span class="highlight">SAP ERP：熟练使用财务模块，参与 ERP 系统实施</span>\n';
  } else {
    html += '• SAP ERP：熟练使用财务模块\n';
  }
  html += '• Python：基础数据分析\n\n';

  // Certificates
  html += '<div class="section-title">═══════════════════════════════════════</div>';
  html += '<div class="section-title">证书资质</div>\n';
  p.certificates.forEach(function(cert) {
    if (cert.indexOf('CPA') >= 0 && job.id === 2) {
      html += '• <span class="highlight">' + cert + ' — 已通过审计、会计、税法 3 科</span>\n';
    } else if (cert.indexOf('CMA') >= 0 && job.id === 3) {
      html += '• <span class="highlight">' + cert + ' — 备考中，预计年内通过</span>\n';
    } else {
      html += '• ' + cert + '\n';
    }
  });
  if (job.id === 2) {
    html += '• <span class="add">CIA 国际注册内部审计师（计划报考）</span>\n';
  }
  html += '\n';

  // Self evaluation
  html += '<div class="section-title">═══════════════════════════════════════</div>';
  html += '<div class="section-title">自我评价</div>\n';
  html += opts.selfEval;

  return html;
}

function downloadResume(jobTitle, btn) {
  var card = btn.closest('.resume-card');
  var content = card.querySelector('.resume-content').innerText;
  var blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '针对性简历_' + jobTitle + '.txt';
  a.click();
  URL.revokeObjectURL(url);
  btn.textContent = '✅ 已下载';
  btn.disabled = true;
  setTimeout(function() { btn.textContent = '📥 下载此份简历'; btn.disabled = false; }, 2000);
}

function downloadAll() {
  var cards = document.querySelectorAll('#resume-stack .resume-card');
  jobs.forEach(function(job, idx) {
    setTimeout(function() {
      if (cards[idx]) {
        var btn = cards[idx].querySelector('.btn-download');
        if (btn) btn.click();
      }
    }, idx * 300);
  });
}

init();
</script>
