<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>短剧 AI 分镜工作台</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: rgba(255, 255, 255, 0.82);
        --panel-strong: #ffffff;
        --border: rgba(124, 140, 168, 0.22);
        --text: #182033;
        --muted: #667085;
        --primary: #2b6cff;
        --primary-strong: #184bd6;
        --accent: #15b8a6;
        --danger: #ef4444;
        --shadow: 0 18px 40px rgba(21, 33, 61, 0.12);
        --radius: 22px;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        color: var(--text);
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(43,108,255,0.16), transparent 28%),
          radial-gradient(circle at top right, rgba(21,184,166,0.12), transparent 26%),
          linear-gradient(180deg, #eef3ff 0%, #f7f9fc 40%, #eef2f8 100%);
      }

      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }

      .app {
        min-height: 100%;
        padding: 18px;
      }

      .shell {
        min-height: calc(100vh - 36px);
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 16px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: center;
        padding: 20px 24px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: linear-gradient(135deg, rgba(255,255,255,0.94), rgba(244,248,255,0.78));
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
      }

      .brand {
        display: flex;
        gap: 14px;
        align-items: center;
        min-width: 0;
      }

      .brand-mark {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        color: white;
        font-size: 24px;
        background: linear-gradient(135deg, var(--primary), #63a2ff);
        box-shadow: 0 10px 24px rgba(43,108,255,0.28);
      }

      .brand h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 0.02em;
      }

      .brand p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .status-line {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.72);
        color: var(--muted);
        font-size: 13px;
      }

      .badge strong { color: var(--text); }
      .badge.online { color: #0f766e; }
      .badge.offline { color: #b45309; }

      .workspace {
        display: grid;
        grid-template-columns: 280px minmax(0, 1.6fr) 360px;
        gap: 16px;
        min-height: 0;
      }

      .panel {
        min-height: 0;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
        overflow: hidden;
      }

      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 16px 18px;
        border-bottom: 1px solid rgba(124, 140, 168, 0.14);
      }

      .panel-head h2 {
        margin: 0;
        font-size: 16px;
      }

      .panel-head small,
      .panel-head p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .panel-body {
        padding: 16px 18px 18px;
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      .scene-item {
        width: 100%;
        text-align: left;
        border: 1px solid transparent;
        border-radius: 16px;
        padding: 14px 14px;
        background: rgba(255,255,255,0.82);
        transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
      }

      .scene-item:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(21,33,61,0.08); }
      .scene-item.active {
        border-color: rgba(43,108,255,0.34);
        background: linear-gradient(135deg, rgba(43,108,255,0.12), rgba(255,255,255,0.96));
      }
      .scene-item strong { display: block; margin-bottom: 6px; font-size: 14px; }
      .scene-item span { display: block; color: var(--muted); font-size: 12px; line-height: 1.45; }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 14px;
      }

      .toolbar .title h3 {
        margin: 0;
        font-size: 18px;
      }

      .toolbar .title p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .btn {
        border: 1px solid transparent;
        border-radius: 14px;
        padding: 11px 14px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
      }

      .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 20px rgba(21,33,61,0.12); }
      .btn.primary { color: #fff; background: linear-gradient(135deg, var(--primary), var(--primary-strong)); }
      .btn.secondary { color: var(--text); background: rgba(255,255,255,0.9); border-color: var(--border); }
      .btn.ghost { color: var(--muted); background: transparent; border-color: var(--border); }
      .btn.danger { color: #fff; background: linear-gradient(135deg, #ff5f6d, #ef4444); }

      .upload-zone {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 16px;
        margin-bottom: 14px;
        border-radius: 18px;
        border: 1.5px dashed rgba(43,108,255,0.32);
        background: linear-gradient(135deg, rgba(43,108,255,0.07), rgba(255,255,255,0.92));
      }

      .upload-zone strong { font-size: 14px; }
      .upload-zone span { color: var(--muted); font-size: 12px; line-height: 1.55; }

      .table-wrap {
        overflow: auto;
        border-radius: 18px;
        border: 1px solid rgba(124,140,168,0.18);
        background: var(--panel-strong);
        min-height: 400px;
      }

      .table-head,
      .row {
        display: grid;
        grid-template-columns: 64px 88px 120px 1.55fr 1.1fr 1fr 100px 100px 88px 88px 72px;
        gap: 10px;
        align-items: start;
      }

      .table-head {
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 14px 14px;
        background: linear-gradient(180deg, #eef3ff 0%, #f8fbff 100%);
        border-bottom: 1px solid rgba(124,140,168,0.18);
        font-size: 13px;
        font-weight: 700;
        color: #4b5b79;
      }

      .row {
        padding: 14px 14px;
        border-bottom: 1px solid rgba(124,140,168,0.12);
        font-size: 13px;
        cursor: pointer;
        transition: background .16s ease;
      }

      .row:hover { background: rgba(43,108,255,0.05); }
      .row.active { background: rgba(43,108,255,0.1); }

      .cell {
        min-width: 0;
        line-height: 1.5;
        word-break: break-word;
        white-space: pre-wrap;
      }

      .cell.muted { color: var(--muted); }
      .cell input, .cell textarea, .cell select {
        width: 100%;
        border-radius: 12px;
        border: 1px solid rgba(124,140,168,0.24);
        padding: 10px 11px;
        background: rgba(255,255,255,0.95);
        color: var(--text);
      }

      .editor {
        display: grid;
        gap: 12px;
      }

      .editor-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field label {
        color: #334155;
        font-size: 12px;
        font-weight: 700;
      }

      .field input, .field textarea, .field select {
        width: 100%;
        border-radius: 12px;
        border: 1px solid rgba(124,140,168,0.24);
        padding: 11px 12px;
        background: rgba(255,255,255,0.94);
        color: var(--text);
      }

      .field textarea {
        min-height: 88px;
        resize: vertical;
      }

      .field.wide { grid-column: 1 / -1; }

      .prompt-box {
        border-radius: 18px;
        border: 1px solid rgba(124,140,168,0.16);
        background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(244,248,255,0.92));
        padding: 14px;
        display: grid;
        gap: 10px;
      }

      .prompt-box textarea {
        width: 100%;
        min-height: 180px;
        border: 1px solid rgba(124,140,168,0.22);
        border-radius: 14px;
        padding: 12px;
        resize: vertical;
        line-height: 1.6;
        background: #fff;
        color: #0f172a;
      }

      .prompt-tools {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .notice {
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(21,184,166,0.1);
        color: #0f766e;
        border: 1px solid rgba(21,184,166,0.2);
        font-size: 12px;
        line-height: 1.6;
      }

      .helper {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }

      .empty {
        padding: 52px 24px;
        text-align: center;
        color: var(--muted);
      }

      .empty strong {
        display: block;
        margin-bottom: 8px;
        color: var(--text);
        font-size: 18px;
      }

      .task-list {
        display: grid;
        gap: 10px;
      }

      .task {
        border: 1px solid rgba(124,140,168,0.18);
        border-radius: 16px;
        padding: 12px 14px;
        background: rgba(255,255,255,0.9);
      }

      .task strong { display: block; font-size: 13px; margin-bottom: 6px; }
      .task small { color: var(--muted); line-height: 1.5; }

      .shot-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 2px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        padding: 4px 9px;
        border-radius: 999px;
        background: rgba(43,108,255,0.08);
        color: #2755c7;
        font-size: 12px;
        font-weight: 600;
      }

      .icon {
        width: 18px;
        height: 18px;
        display: inline-block;
        border-radius: 999px;
        background: currentColor;
        mask-size: contain;
        mask-repeat: no-repeat;
        mask-position: center;
      }

      .icon.upload { mask-image: radial-gradient(circle at 50% 40%, transparent 0 34%, black 35% 100%); }

      @media (max-width: 1280px) {
        .workspace { grid-template-columns: 240px minmax(0, 1fr); }
        .right-panel { grid-column: 1 / -1; }
      }

      @media (max-width: 900px) {
        .workspace { grid-template-columns: 1fr; }
        .topbar { flex-direction: column; align-items: flex-start; }
        .status-line { justify-content: flex-start; }
        .table-head, .row { min-width: 1100px; }
        .table-wrap { overflow-x: auto; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="shell" id="app"></div>
    </div>

    <script>
      (() => {
        const API_BASE = 'http://localhost:3000';
        const STORAGE_KEY = 'qianshan_standalone_state_v1';
        const $ = (sel, root = document) => root.querySelector(sel);
        const escapeHtml = (text) => String(text ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');

        const demoState = {
          scenes: [
            { id: 'scene1', title: '第一幕：教研室提需求', summary: '上传剧本后自动拆分为人物、画面、台词和提示词。' },
            { id: 'scene2', title: '第二幕：分镜表预览', summary: '每个镜头单独成行，方便编辑与渲染。' },
            { id: 'scene3', title: '第三幕：提示词渲染', summary: '一键补全更详细的即梦AI提示词。' }
          ],
          activeSceneId: 'scene1',
          selectedShotId: 's1',
          shotsByScene: {
            scene1: [
              {
                id: 's1',
                no: 1,
                view: '中景',
                role: '林凡',
                picture: '最后一排靠窗的位置，低着头，笔尖在纸上缓慢移动',
                dialogue: '',
                narration: '不是他自己的笔记，是前排同学的。',
                relationObject: '周浩',
                prop: '笔尖',
                action: '抄笔记',
                expression: '克制',
                duration: '3s',
                aiPrompt: '中景，林凡出场，最后一排靠窗的位置，低着头，笔尖在纸上缓慢移动，动作：抄笔记，神态：克制，关系对象：周浩，物件：笔尖，旁白/内心：不是他自己的笔记，是前排同学的，固定机位，现实感短剧场景，画面清晰，竖屏分镜'
              },
              {
                id: 's2',
                no: 2,
                view: '中景',
                role: '周浩',
                picture: '坐在教室正中间，被一群人围着',
                dialogue: '',
                narration: '',
                relationObject: '',
                prop: '',
                action: '被围着',
                expression: '张扬',
                duration: '3s',
                aiPrompt: '中景，周浩出场，坐在教室正中间，被一群人围着，动作：被围着，神态：张扬，固定机位，现实感短剧场景，画面清晰，竖屏分镜'
              }
            ],
            scene2: [],
            scene3: []
          },
          notice: '当前为离线演示模式。若后台运行，会自动连接 `/api/scripts/import` 解析 Word。',
          backendOnline: false,
          selectedIndex: 0,
          promptPreview: '',
          detailedPrompt: '',
          statusText: '离线演示',
          tasks: []
        };

        let state = loadState() || JSON.parse(JSON.stringify(demoState));

        function loadState() {
          try {
            const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
            if (!saved || !Array.isArray(saved.scenes) || !saved.scenes.length) return null;
            return saved;
          } catch {
            return null;
          }
        }

        function saveState() {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            scenes: state.scenes,
            activeSceneId: state.activeSceneId,
            selectedShotId: state.selectedShotId,
            shotsByScene: state.shotsByScene,
            promptPreview: state.promptPreview,
            detailedPrompt: state.detailedPrompt,
            tasks: state.tasks
          }));
        }

        function currentShots() {
          return state.shotsByScene[state.activeSceneId] || [];
        }

        function selectedShot() {
          return currentShots().find((shot) => shot.id === state.selectedShotId) || currentShots()[0] || null;
        }

        function emptyShot(no = currentShots().length + 1) {
          return {
            id: `shot_${Date.now()}_${Math.random().toString(16).slice(2, 6)}`,
            no,
            view: '中景',
            role: '',
            picture: '',
            dialogue: '',
            narration: '',
            relationObject: '',
            prop: '',
            action: '',
            expression: '',
            duration: '3s',
            aiPrompt: ''
          };
        }

        function setNotice(text, persistent = false) {
          state.notice = text;
          if (!persistent) {
            clearTimeout(setNotice._timer);
            setNotice._timer = setTimeout(() => {
              state.notice = state.backendOnline ? '后端已连接，可以上传 Word 并自动拆分分镜。' : '当前为离线演示模式。若后台运行，会自动连接 `/api/scripts/import` 解析 Word。';
              render();
              saveState();
            }, 4500);
          }
        }

        async function api(path, options = {}) {
          const response = await fetch(`${API_BASE}${path}`, {
            ...options,
            headers: options.body instanceof FormData ? undefined : { 'Content-Type': 'application/json', ...(options.headers || {}) }
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload.success === false) {
            throw new Error(payload.message || `请求失败：${path}`);
          }
          return payload.data ?? payload;
        }

        function buildPrompt(shot) {
          return [
            shot.view || '中景',
            shot.role ? `${shot.role}出场` : '',
            shot.picture,
            shot.action ? `动作：${shot.action}` : '',
            shot.expression ? `神态：${shot.expression}` : '',
            shot.relationObject ? `关系对象：${shot.relationObject}` : '',
            shot.prop ? `物件：${shot.prop}` : '',
            shot.narration ? `旁白/内心：${shot.narration}` : '',
            shot.dialogue ? `台词：${shot.dialogue}` : '',
            '现实感短剧场景',
            '竖屏9:16',
            '画面清晰',
            '镜头语言明确'
          ].filter(Boolean).join('，');
        }

        function normalizeImportedShot(shot, index) {
          return {
            id: shot.id || `shot_${Date.now()}_${index}`,
            no: shot.no || index + 1,
            view: shot.view || '中景',
            role: shot.role || '',
            picture: shot.picture || '',
            dialogue: shot.dialogue || '',
            narration: shot.narration || '',
            relationObject: shot.relationObject || '',
            prop: shot.prop || '',
            action: shot.action || '',
            expression: shot.expression || '',
            duration: shot.duration || '3s',
            aiPrompt: shot.aiPrompt || buildPrompt(shot)
          };
        }

        function selectScene(sceneId) {
          state.activeSceneId = sceneId;
          const shots = currentShots();
          state.selectedShotId = shots[0]?.id || '';
          state.detailedPrompt = '';
          render();
          saveState();
        }

        function selectShot(shotId) {
          state.selectedShotId = shotId;
          const shot = selectedShot();
          state.promptPreview = shot ? buildPrompt(shot) : '';
          render();
          saveState();
        }

        function addScene() {
          const title = prompt('请输入分幕标题', '新分幕');
          if (!title) return;
          const scene = { id: `scene_${Date.now()}`, title, summary: '新建分幕' };
          state.scenes.push(scene);
          state.shotsByScene[scene.id] = [];
          selectScene(scene.id);
          setNotice(`已创建分幕：${title}`, true);
          render();
          saveState();
        }

        function addShot() {
          const shots = currentShots();
          const shot = emptyShot(shots.length + 1);
          shots.push(shot);
          state.shotsByScene[state.activeSceneId] = shots;
          state.selectedShotId = shot.id;
          setNotice('已新增一个空分镜。', true);
          render();
          saveState();
        }

        function deleteShot(shotId) {
          const shots = currentShots().filter((shot) => shot.id !== shotId).map((shot, index) => ({ ...shot, no: index + 1 }));
          state.shotsByScene[state.activeSceneId] = shots;
          state.selectedShotId = shots[0]?.id || '';
          setNotice('分镜已删除。', true);
          render();
          saveState();
        }

        function updateSelectedShotFromForm() {
          const shot = selectedShot();
          if (!shot) return;
          const form = $('#shot-form');
          const data = Object.fromEntries(new FormData(form).entries());
          Object.assign(shot, {
            view: data.view || '中景',
            role: data.role || '',
            picture: data.picture || '',
            dialogue: data.dialogue || '',
            narration: data.narration || '',
            relationObject: data.relationObject || '',
            prop: data.prop || '',
            action: data.action || '',
            expression: data.expression || '',
            duration: data.duration || '3s',
            aiPrompt: data.aiPrompt || buildPrompt(shot)
          });
          state.promptPreview = shot.aiPrompt;
          setNotice('已保存当前分镜。', true);
          render();
          saveState();
        }

        async function renderDetailedPrompt() {
          const shot = selectedShot();
          if (!shot) {
            setNotice('请先选中一个分镜。', true);
            return;
          }

          try {
            const result = await api('/api/prompts/render', {
              method: 'POST',
              body: JSON.stringify({
                sceneTitle: state.scenes.find((scene) => scene.id === state.activeSceneId)?.title || '',
                shot,
                reqKey: 'jimeng_t2v_v30',
                materialName: ''
              })
            });
            state.promptPreview = result.positive || buildPrompt(shot);
            state.detailedPrompt = result.shotPrompt || buildPrompt(shot);
            shot.aiPrompt = result.shotPrompt || buildPrompt(shot);
            state.notice = '已生成更详细的提示词。';
          } catch {
            state.promptPreview = buildPrompt(shot);
            state.detailedPrompt = buildPrompt(shot);
            shot.aiPrompt = state.detailedPrompt;
            state.notice = '当前无法连接后端，已使用本地提示词生成。';
          }
          render();
          saveState();
        }

        async function importWordFile(file) {
          const isDocx = /\.docx$/i.test(file.name) || file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
          if (!isDocx) {
            setNotice('请上传 Word 文档（.docx）。', true);
            return;
          }

          const formData = new FormData();
          formData.append('script', file);

          try {
            const response = await fetch(`${API_BASE}/api/scripts/import`, {
              method: 'POST',
              body: formData
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload.success === false) {
              throw new Error(payload.message || 'Word 剧本导入失败');
            }

            const data = payload.data || {};
            const sceneId = `scene_${Date.now()}`;
            const scene = {
              id: sceneId,
              title: data.sceneTitle || file.name.replace(/\.[^.]+$/, ''),
              summary: `已从 ${file.name} 拆分出 ${Array.isArray(data.shots) ? data.shots.length : 0} 个镜头`
            };
            const shots = Array.isArray(data.shots) ? data.shots.map(normalizeImportedShot) : [];
            state.scenes.unshift(scene);
            state.shotsByScene[sceneId] = shots;
            state.activeSceneId = sceneId;
            state.selectedShotId = shots[0]?.id || '';
            state.promptPreview = shots[0] ? buildPrompt(shots[0]) : '';
            state.detailedPrompt = '';
            setNotice(`已从 ${file.name} 解析出 ${shots.length} 个镜头。`, true);
          } catch (error) {
            setNotice(error.message || '上传失败，请确认后端已启动。', true);
          }

          render();
          saveState();
        }

        function makeTask(title, detail) {
          state.tasks.unshift({
            id: `task_${Date.now()}_${Math.random().toString(16).slice(2, 6)}`,
            title,
            detail,
            progress: 100
          });
          state.tasks = state.tasks.slice(0, 5);
        }

        function exportState() {
          const blob = new Blob([JSON.stringify({
            scenes: state.scenes,
            shotsByScene: state.shotsByScene
          }, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `qianshan-workbench-${Date.now()}.json`;
          a.click();
          URL.revokeObjectURL(url);
        }

        async function connectBackend() {
          try {
            const scenes = await api('/api/scenes');
            state.backendOnline = Array.isArray(scenes) && scenes.length > 0;
            if (state.backendOnline) {
              const normalized = scenes.map((scene) => ({
                id: scene.id,
                title: scene.title,
                summary: scene.summary || '来自后端分幕'
              }));
              state.scenes = normalized;
              state.activeSceneId = normalized[0]?.id || '';
              if (state.activeSceneId) {
                const shots = await api(`/api/shots/${state.activeSceneId}`);
                state.shotsByScene[state.activeSceneId] = Array.isArray(shots) ? shots.map(normalizeImportedShot) : [];
                state.selectedShotId = state.shotsByScene[state.activeSceneId][0]?.id || '';
                state.promptPreview = selectedShot() ? buildPrompt(selectedShot()) : '';
              }
              state.notice = '后端已连接，可以上传 Word 并自动拆分分镜。';
              state.statusText = '后端在线';
              makeTask('后端连接成功', '已识别到本地 API 服务。');
            }
          } catch {
            state.backendOnline = false;
            state.statusText = '离线演示';
          }
          render();
          saveState();
        }

        function renderScenes() {
          return state.scenes.map((scene) => `
            <button class="scene-item ${scene.id === state.activeSceneId ? 'active' : ''}" data-scene="${scene.id}">
              <strong>${escapeHtml(scene.title)}</strong>
              <span>${escapeHtml(scene.summary || '暂无说明')}</span>
            </button>
          `).join('');
        }

        function renderRows() {
          const shots = currentShots();
          if (!shots.length) {
            return `<div class="empty"><strong>当前分幕还没有分镜</strong><div>点击“新增分镜”或上传 Word 后，解析结果会出现在这里。</div></div>`;
          }
          return shots.map((shot) => `
            <div class="row ${shot.id === state.selectedShotId ? 'active' : ''}" data-shot="${shot.id}">
              <div class="cell">${escapeHtml(shot.no)}</div>
              <div class="cell">${escapeHtml(shot.view || '中景')}</div>
              <div class="cell">${escapeHtml(shot.role || '-')}</div>
              <div class="cell">${escapeHtml(shot.picture || '未填写画面描述')}</div>
              <div class="cell">${escapeHtml(shot.dialogue || '-')}</div>
              <div class="cell">${escapeHtml(shot.narration || '-')}</div>
              <div class="cell">${escapeHtml(shot.relationObject || '-')}</div>
              <div class="cell">${escapeHtml(shot.prop || '-')}</div>
              <div class="cell">${escapeHtml(shot.action || '-')}</div>
              <div class="cell">${escapeHtml(shot.expression || '-')}</div>
              <div class="cell">${escapeHtml(shot.duration || '3s')}</div>
            </div>
          `).join('');
        }

        function renderEditor() {
          const shot = selectedShot();
          if (!shot) {
            return `
              <div class="panel-body">
                <div class="empty">
                  <strong>未选中分镜</strong>
                  <div>请先选择左侧分幕，或点击表格中的某一行。</div>
                </div>
              </div>
            `;
          }

          return `
            <div class="panel-body">
              <form class="editor" id="shot-form">
                <div class="editor-grid">
                  <div class="field"><label>镜号</label><input name="no" value="${escapeHtml(shot.no)}" readonly /></div>
                  <div class="field"><label>时长</label><input name="duration" value="${escapeHtml(shot.duration || '3s')}" /></div>
                  <div class="field">
                    <label>景别</label>
                    <select name="view">
                      ${['远景','全景','中景','近景','特写'].map((item) => `<option value="${item}" ${item === (shot.view || '中景') ? 'selected' : ''}>${item}</option>`).join('')}
                    </select>
                  </div>
                  <div class="field"><label>人物</label><input name="role" value="${escapeHtml(shot.role || '')}" placeholder="林凡 / 周浩" /></div>
                  <div class="field wide"><label>画面</label><textarea name="picture" placeholder="描述镜头里看到的画面">${escapeHtml(shot.picture || '')}</textarea></div>
                  <div class="field wide"><label>台词</label><textarea name="dialogue" placeholder="角色说的话">${escapeHtml(shot.dialogue || '')}</textarea></div>
                  <div class="field wide"><label>旁白 / 内心</label><textarea name="narration" placeholder="补充叙述、旁白或内心活动">${escapeHtml(shot.narration || '')}</textarea></div>
                  <div class="field"><label>关系对象</label><input name="relationObject" value="${escapeHtml(shot.relationObject || '')}" placeholder="周浩 / 老师" /></div>
                  <div class="field"><label>物件 / 线索</label><input name="prop" value="${escapeHtml(shot.prop || '')}" placeholder="笔尖 / 书包 / 手机" /></div>
                  <div class="field"><label>动作</label><input name="action" value="${escapeHtml(shot.action || '')}" placeholder="抄笔记 / 站起身" /></div>
                  <div class="field"><label>神态</label><input name="expression" value="${escapeHtml(shot.expression || '')}" placeholder="克制 / 紧张 / 冷静" /></div>
                  <div class="field wide"><label>AI 提示词</label><textarea name="aiPrompt" placeholder="点击一键渲染后自动生成">${escapeHtml(shot.aiPrompt || buildPrompt(shot))}</textarea></div>
                </div>
              </form>

              <div class="prompt-box">
                <div class="prompt-tools">
                  <button class="btn primary" id="render-btn" type="button">一键渲染详细提示词</button>
                  <button class="btn secondary" id="save-btn" type="button">保存分镜</button>
                  <button class="btn danger" id="delete-btn" type="button">删除分镜</button>
                </div>
                <textarea readonly id="prompt-preview">${escapeHtml(state.detailedPrompt || state.promptPreview || buildPrompt(shot))}</textarea>
                <div class="helper">说明：上传 Word 后，后端会尝试拆分人物、画面、台词、旁白等字段。这里的编辑器会把结果展示并允许你继续修改。</div>
              </div>
            </div>
          `;
        }

        function renderTasks() {
          if (!state.tasks.length) {
            return `<div class="task"><strong>暂无任务</strong><small>上传 Word、渲染提示词或新增分镜后，这里会显示最近动作。</small></div>`;
          }
          return state.tasks.map((task) => `
            <div class="task">
              <strong>${escapeHtml(task.title)}</strong>
              <small>${escapeHtml(task.detail)}</small>
            </div>
          `).join('');
        }

        function render() {
          const shotCount = currentShots().length;
          const activeScene = state.scenes.find((scene) => scene.id === state.activeSceneId);
          const shots = currentShots();
          const selected = selectedShot();
          document.getElementById('app').innerHTML = `
            <div class="topbar">
              <div class="brand">
                <div class="brand-mark">🎬</div>
                <div>
                  <h1>短剧 AI 分镜工作台</h1>
                  <p>Word 剧本解析、分幕分镜、提示词渲染与任务管理</p>
                </div>
              </div>
              <div class="status-line">
                <div class="badge ${state.backendOnline ? 'online' : 'offline'}">
                  <strong>${escapeHtml(state.statusText)}</strong>
                  <span>${state.backendOnline ? '已连接本地后端' : '本地离线可用'}</span>
                </div>
                <div class="badge">
                  <span>当前分幕</span>
                  <strong>${escapeHtml(activeScene?.title || '未选择')}</strong>
                </div>
                <div class="badge">
                  <span>镜头数量</span>
                  <strong>${shotCount}</strong>
                </div>
              </div>
            </div>

            <div class="workspace">
              <aside class="panel">
                <div class="panel-head">
                  <div>
                    <h2>分幕</h2>
                    <small>点击切换分幕，上传 Word 会自动新建分幕</small>
                  </div>
                  <button class="btn secondary" id="add-scene-btn" type="button">新增分幕</button>
                </div>
                <div class="panel-body stack" id="scene-list">
                  ${renderScenes()}
                </div>
              </aside>

              <section class="panel">
                <div class="panel-head">
                  <div style="min-width:0;">
                    <h2>分镜工作区</h2>
                    <p>${escapeHtml(activeScene?.summary || '上传 Word、拆分镜头、查看解析结果')}</p>
                  </div>
                </div>
                <div class="panel-body">
                  <div class="toolbar">
                    <div class="title">
                      <h3>${escapeHtml(activeScene?.title || '未选择分幕')}</h3>
                      <p>${shotCount} 个分镜，点击某一行可选中并编辑</p>
                    </div>
                    <div class="actions">
                      <button class="btn secondary" id="upload-btn" type="button">上传剧本</button>
                      <button class="btn secondary" id="add-shot-btn" type="button">新增分镜</button>
                      <button class="btn ghost" id="export-btn" type="button">导出数据</button>
                    </div>
                  </div>

                  <div class="upload-zone">
                    <strong>上传 Word 剧本</strong>
                    <span>支持 .docx。上传后会调用后端自动解析人物、画面、台词、旁白等内容，并写入当前工作区。</span>
                    <div class="shot-meta">
                      <span class="chip">支持后端自动解析</span>
                      <span class="chip">支持手动编辑</span>
                      <span class="chip">支持提示词渲染</span>
                    </div>
                    <input id="file-input" type="file" accept=".docx" style="display:none" />
                  </div>

                  <div class="table-wrap">
                    <div class="table-head">
                      <div>镜号</div>
                      <div>景别</div>
                      <div>出场角色</div>
                      <div>画面</div>
                      <div>台词 / 旁白</div>
                      <div>旁白 / 内心</div>
                      <div>关系对象</div>
                      <div>物件</div>
                      <div>动作</div>
                      <div>神态</div>
                      <div>时长</div>
                    </div>
                    <div id="shot-rows">
                      ${renderRows()}
                    </div>
                  </div>
                </div>
              </section>

              <aside class="panel right-panel">
                <div class="panel-head">
                  <div>
                    <h2>分镜编辑与提示词</h2>
                    <small>一键渲染更详细的即梦 AI 提示词</small>
                  </div>
                </div>
                ${renderEditor()}

                <div class="panel-head" style="border-top: 1px solid rgba(124,140,168,0.14); border-bottom: none;">
                  <div>
                    <h2>最近任务</h2>
                    <small>上传、渲染、保存都会记录</small>
                  </div>
                </div>
                <div class="panel-body task-list">
                  ${renderTasks()}
                </div>
              </aside>
            </div>

            ${state.notice ? `<div class="notice" style="position:fixed;right:18px;bottom:18px;max-width:min(480px,calc(100vw - 36px));z-index:999;">${escapeHtml(state.notice)}</div>` : ''}
          `;

          bindEvents();
        }

        function bindEvents() {
          $('#add-scene-btn')?.addEventListener('click', addScene);
          $('#add-shot-btn')?.addEventListener('click', () => {
            addShot();
            makeTask('新增分镜', '用户手动添加了一个空白分镜。');
          });
          $('#upload-btn')?.addEventListener('click', () => $('#file-input')?.click());
          $('#file-input')?.addEventListener('change', (event) => {
            const file = event.target.files && event.target.files[0];
            if (file) {
              importWordFile(file).then(() => makeTask('上传剧本', file.name));
            }
            event.target.value = '';
          });
          $('#export-btn')?.addEventListener('click', () => {
            exportState();
            makeTask('导出数据', '已导出当前页面数据 JSON。');
            render();
            saveState();
          });
          $('#render-btn')?.addEventListener('click', () => {
            renderDetailedPrompt();
            makeTask('提示词渲染', '已请求更详细的分镜提示词。');
          });
          $('#save-btn')?.addEventListener('click', () => {
            updateSelectedShotFromForm();
            makeTask('保存分镜', '已保存当前选中的分镜。');
          });
          $('#delete-btn')?.addEventListener('click', () => {
            const shot = selectedShot();
            if (!shot) return;
            if (confirm(`确认删除镜头 ${shot.no} 吗？`)) {
              deleteShot(shot.id);
              makeTask('删除分镜', `删除了镜头 ${shot.no}。`);
            }
          });

          document.querySelectorAll('[data-scene]').forEach((btn) => {
            btn.addEventListener('click', () => selectScene(btn.dataset.scene));
          });
          document.querySelectorAll('[data-shot]').forEach((row) => {
            row.addEventListener('click', () => selectShot(row.dataset.shot));
          });
        }

        // 初始化
        if (!state.scenes || !state.scenes.length) {
          state = JSON.parse(JSON.stringify(demoState));
        }
        if (!state.activeSceneId) {
          state.activeSceneId = state.scenes[0]?.id || '';
        }
        if (!state.selectedShotId) {
          state.selectedShotId = currentShots()[0]?.id || '';
        }
        state.promptPreview = state.promptPreview || (selectedShot() ? buildPrompt(selectedShot()) : '');
        state.detailedPrompt = state.detailedPrompt || '';
        state.tasks = Array.isArray(state.tasks) ? state.tasks : [];

        render();
        connectBackend();
      })();
    </script>
  </body>
</html>
