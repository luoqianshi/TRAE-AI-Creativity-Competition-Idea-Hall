<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>AI 学途伴侣 - 创意展示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; 
      background: linear-gradient(145deg, #f5f7fc 0%, #eef1f8 100%); 
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 20px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #ffffff;
      border-radius: 36px;
      box-shadow: 0 30px 50px rgba(0, 20, 40, 0.12), 0 10px 25px rgba(0,0,0,0.05);
      padding: 28px 22px;
      transition: all 0.3s;
      border: 1px solid rgba(255,255,255,0.6);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #4f7cff, #3b5fe0);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      box-shadow: 0 8px 18px rgba(59,95,224,0.25);
    }
    .title-section h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1e2c;
      letter-spacing: -0.3px;
    }
    .title-section span {
      font-size: 14px;
      color: #6b7394;
      font-weight: 500;
    }
    .feature-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: 20px 0 24px;
    }
    .feature-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      background: #f8faff;
      border-radius: 20px;
      padding: 14px 16px;
      transition: background 0.2s;
    }
    .feature-item:hover { background: #eef2ff; }
    .feature-emoji {
      font-size: 24px;
      width: 36px;
      text-align: center;
    }
    .feature-text h3 {
      font-size: 16px;
      font-weight: 600;
      color: #1f253b;
      margin-bottom: 4px;
    }
    .feature-text p {
      font-size: 13px;
      color: #5b6278;
      line-height: 1.5;
    }
    .scenario-badge {
      background: #edf2ff;
      color: #2c41b0;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 30px;
      display: inline-block;
      margin-bottom: 18px;
    }
    .pain-point {
      background: #fff5f0;
      border-left: 4px solid #ff7a45;
      padding: 12px 16px;
      border-radius: 14px;
      margin: 18px 0;
      font-size: 14px;
      color: #4e3429;
    }
    .value-props {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }
    .value-badge {
      flex: 1;
      background: white;
      border: 1px solid #e6eaf2;
      border-radius: 20px;
      padding: 12px 8px;
      text-align: center;
      font-weight: 600;
      font-size: 13px;
      color: #1f2a4a;
      box-shadow: 0 4px 8px rgba(0,0,0,0.02);
    }
    .value-badge span {
      display: block;
      font-size: 22px;
      margin-bottom: 4px;
    }
    .cta {
      margin-top: 24px;
      background: linear-gradient(135deg, #1f2b4a, #2f3b66);
      color: white;
      border: none;
      width: 100%;
      padding: 14px;
      border-radius: 24px;
      font-weight: 600;
      font-size: 16px;
      text-align: center;
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
      cursor: default;
    }
    .footer-note {
      text-align: center;
      margin-top: 16px;
      font-size: 12px;
      color: #8e95b0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="icon">📘✨</div>
      <div class="title-section">
        <h1>AI 学途伴侣</h1>
        <span>拍照整理 · 知识图谱 · 复习计划</span>
      </div>
    </div>
    
    <div class="scenario-badge">🎯 学习工作赛道</div>
    
    <div class="feature-grid">
      <div class="feature-item">
        <div class="feature-emoji">📸</div>
        <div class="feature-text">
          <h3>一拍即析</h3>
          <p>拍照或截屏手写笔记、错题，AI自动识别文字与公式，精准提取知识点。</p>
        </div>
      </div>
      <div class="feature-item">
        <div class="feature-emoji">🧠</div>
        <div class="feature-text">
          <h3>知识图谱</h3>
          <p>自动关联概念，生成个人知识网络，一眼看出薄弱环节。</p>
        </div>
      </div>
      <div class="feature-item">
        <div class="feature-emoji">📅</div>
        <div class="feature-text">
          <h3>动态复习计划</h3>
          <p>基于遗忘曲线与错题分布，生成每日复习任务，高效冲刺。</p>
        </div>
      </div>
    </div>
    
    <div class="pain-point">
      💢 <strong>当前痛点：</strong>学生手动抄错题平均每天花费30分钟，笔记零散无法系统复习，考前不知从何下手。
    </div>
    
    <div class="value-props">
      <div class="value-badge">
        <span>⚡</span> 效率提升80%
      </div>
      <div class="value-badge">
        <span>📈</span> 复习有重点
      </div>
      <div class="value-badge">
        <span>🤖</span> AI私教体验
      </div>
    </div>
    
    <div class="cta">
      🚀 即将上线 · 微信小程序
    </div>
    <div class="footer-note">
      创意方案 · 教育公平 · AI普惠
    </div>
  </div>
</body>
</html>
