<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>以古鉴今 - 以史为镜，可以知兴替</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body>
    <div id="app">
        <!-- 顶部导航 Tab -->
        <nav class="tab-bar" id="tabBar">
            <div class="tab-item active" data-tab="home">
                <span class="tab-icon">📖</span>
                <span class="tab-label">以古鉴今</span>
            </div>
            <div class="tab-item" data-tab="history">
                <span class="tab-icon">📋</span>
                <span class="tab-label">查询记录</span>
            </div>
        </nav>

        <!-- 首页 -->
        <div class="tab-page active" id="pageHome">
            <!-- 头部 -->
            <div class="header">
                <div class="header-title">以古鉴今</div>
                <div class="header-subtitle">以史为镜，可以知兴替</div>
            </div>

            <!-- 配额栏 -->
            <div class="quota-bar" id="quotaBar" style="display:none">
                <div class="quota-text">
                    今日剩余 <span class="quota-num" id="quotaRemaining">0</span> 次提问
                </div>
                <button class="share-btn" id="shareBtn" onclick="onShare()">
                    分享给朋友 +1次
                </button>
            </div>

            <!-- 今日一问：核心交互区 -->
            <div class="daily-question-card" id="dailyQuestionCard">
                <div class="daily-question-header">
                    <span class="daily-question-icon">📜</span>
                    <span class="daily-question-label">今日一问</span>
                </div>
                <div class="daily-question-text" id="dailyQuestionText">加载中...</div>
                <button class="daily-question-btn" id="dailyQuestionBtn" onclick="onDailyQuestionAnswer()">
                    看看司马迁怎么说 →
                </button>
                <div class="daily-question-category" id="dailyQuestionCategory"></div>
            </div>

            <!-- 自定义输入区（默认折叠） -->
            <div class="custom-input-toggle" id="customInputToggle" onclick="toggleCustomInput()">
                ── 或者输入你自己的问题 ──
            </div>
            <div class="search-section" id="searchSection" style="display:none">
                <textarea
                    class="search-input"
                    id="searchInput"
                    placeholder="请说，臣愿为君查阅史册..."
                    maxlength="500"
                    rows="4"
                ></textarea>
                <div class="search-actions">
                    <button class="voice-btn" id="voiceBtn" title="语音输入" aria-label="语音输入">🎤</button>
                    <button class="search-btn" id="submitBtn" onclick="onSubmit()">
                        以古鉴今
                    </button>
                </div>
            </div>

            <!-- 每日之镜 -->
            <div class="daily-mirror" id="dailyMirror" style="display:none">
                <div class="daily-mirror-header">
                    <span class="daily-mirror-icon">🏮</span>
                    <span class="daily-mirror-title" id="dailyMirrorTitle">今日之镜</span>
                    <span class="daily-mirror-date" id="dailyMirrorDate"></span>
                </div>
                <div class="daily-mirror-body" id="dailyMirrorBody"></div>
                <div class="daily-mirror-source" id="dailyMirrorSource"></div>
            </div>

            <!-- 加载动画：翻阅史册 -->
            <div class="loading-section" id="loadingSection" style="display:none">
                <div class="scroll-flip">
                    <div class="scroll-page"><span>战</span></div>
                    <div class="scroll-page"><span>汉</span></div>
                    <div class="scroll-page"><span>唐</span></div>
                    <div class="scroll-page"><span>宋</span></div>
                    <div class="scroll-page"><span>明</span></div>
                </div>
                <div class="loading-text">正在翻阅史册，为您寻找智慧...</div>
            </div>

            <!-- 结果区 -->
            <div class="result-section" id="resultSection" style="display:none">
                <div class="result-content" id="resultContent"></div>
                <div class="feedback-section" id="feedbackSection">
                    <div class="feedback-question">这个回答对您有帮助吗？</div>
                    <div class="feedback-buttons">
                        <button class="feedback-btn useful" id="btnUseful" onclick="onFeedback('useful')">
                            👍 有用
                        </button>
                        <button class="feedback-btn not-useful" id="btnNotUseful" onclick="onFeedback('not_useful')">
                            👎 无用
                        </button>
                    </div>
                    <div class="feedback-message" id="feedbackMessage"></div>
                </div>

                <!-- 匿名用户注册引导 -->
                <div class="answer-register-cta" id="answerRegisterCta" style="display:none">
                    <div class="register-cta-text">想保存这条答案、明天继续追问吗？</div>
                    <button class="register-cta-btn" id="registerCtaBtn" onclick="showAuthModal()">
                        手机号注册 · 10秒就好
                    </button>
                </div>

                <div class="analysis-section" id="analysisSection">
                    <div class="analysis-question">想要更深入地理解这段历史吗？</div>
                    <button class="analysis-btn" id="btnAnalysis" onclick="onAnalysis()">
                        📜 生成分析卡片
                    </button>
                    <div class="analysis-hint">生成一张精美的历史分析卡片，可保存到本地</div>
                </div>
            </div>

            <!-- 错误区 -->
            <div class="error-section" id="errorSection" style="display:none">
                <div class="error-text" id="errorText"></div>
                <button class="share-btn error-share" id="errorShareBtn" style="display:none" onclick="onShare()">
                    分享给朋友 +1次
                </button>
                <button class="retry-btn" id="retryBtn" style="display:none" onclick="onSubmit()">重新查询</button>
            </div>

            <!-- 空状态 -->
            <div class="empty-state" id="emptyState" style="display:none">
                <div class="empty-icon">📖</div>
                <div class="empty-text">请输入您的问题，让我们从历史中寻找答案</div>
            </div>
        </div>

        <!-- 历史记录页 -->
        <div class="tab-page" id="pageHistory">
            <div class="header">
                <div class="header-page-title">查询记录</div>
                <div class="header-page-subtitle">您的历史查询将保存在此处</div>
            </div>

            <div class="loading" id="historyLoading">加载中...</div>

            <!-- 时空之轴 -->
            <div class="dynasty-timeline" id="dynastyTimeline" style="display:none">
                <div class="timeline-title">你的历史探索轨迹</div>
                <div class="timeline-bars" id="timelineBars"></div>
            </div>

            <div id="historyList"></div>

            <div class="empty" id="historyEmpty" style="display:none">
                <div class="empty-icon">📚</div>
                <div class="empty-text">暂无查询记录</div>
                <div class="empty-hint">去首页开始您的第一次以古鉴今之旅吧</div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="/static/auth.js?v=1"></script>
    <script src="/static/script.js?v=6"></script>
</body>
</html>
