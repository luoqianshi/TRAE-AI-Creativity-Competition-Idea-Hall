<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逢客必应 - 销售话术 AI 助手</title>
    <style>
        /* ========== 全局样式 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary-blue: #1A237E;
            --primary-gold: #FFD700;
            --bg-white: #FFFFFF;
            --bg-light: #F5F5F5;
            --text-dark: #333333;
            --text-light: #666666;
            --success-green: #4CAF50;
            --warning-red: #FF5722;
            --shadow: 0 2px 8px rgba(0,0,0,0.1);
            --shadow-hover: 0 4px 16px rgba(0,0,0,0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ========== 手机外框 ========== */
        .phone-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .phone-frame {
            width: 390px;
            height: 844px;
            background: #1a1a1a;
            border-radius: 55px;
            padding: 12px;
            box-shadow:
                0 0 0 2px #333,
                0 0 0 4px #1a1a1a,
                0 30px 80px rgba(0,0,0,0.6),
                inset 0 0 4px rgba(255,255,255,0.05);
            position: relative;
        }

        /* 侧边按钮 */
        .phone-frame::before {
            content: '';
            position: absolute;
            right: -4px;
            top: 180px;
            width: 4px;
            height: 60px;
            background: #333;
            border-radius: 0 2px 2px 0;
        }

        .phone-frame::after {
            content: '';
            position: absolute;
            left: -4px;
            top: 150px;
            width: 4px;
            height: 35px;
            background: #333;
            border-radius: 2px 0 0 2px;
            box-shadow: 0 50px 0 #333, 0 90px 0 #333;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: var(--bg-light);
            border-radius: 44px;
            overflow: hidden;
            position: relative;
        }

        /* 灵动岛 */
        .dynamic-island {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 126px;
            height: 36px;
            background: #000;
            border-radius: 20px;
            z-index: 200;
        }

        /* 状态栏 */
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 54px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 28px 0;
            z-index: 100;
            font-size: 0.75rem;
            font-weight: 600;
            color: #333;
        }

        .status-bar .time { font-size: 0.85rem; font-weight: 700; }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.7rem;
        }

        /* 底部横条 */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 134px;
            height: 5px;
            background: rgba(0,0,0,0.2);
            border-radius: 3px;
            z-index: 200;
        }

        /* ========== 顶部导航栏 ========== */
        .top-nav {
            position: absolute;
            top: 54px;
            left: 0;
            right: 0;
            height: 44px;
            background: linear-gradient(135deg, var(--primary-blue) 0%, #283593 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 150;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .top-nav-title {
            color: white;
            font-size: 1rem;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* ========== 内容区 ========== */
        .app-content {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 98px 14px 80px;
            -webkit-overflow-scrolling: touch;
        }

        .app-content::-webkit-scrollbar { width: 0; }

        /* ========== 头部（隐藏，由顶部导航栏替代） ========== */
        .header {
            display: none;
        }

        /* ========== Tab 导航（隐藏，改用底部导航） ========== */
        .tab-nav {
            display: none;
        }

        /* ========== Tab 内容 ========== */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: slideIn 0.35s ease; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ========== 卡片 ========== */
        .card {
            background: white;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
        }

        .card-title {
            font-size: 1rem;
            color: var(--primary-blue);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--bg-light);
        }

        /* ========== Tab1: 客户难题破解 ========== */
        .form-group { margin-bottom: 10px; }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-dark);
            font-weight: 500;
            font-size: 0.82rem;
        }

        .form-select, .form-input {
            width: 100%;
            padding: 9px 11px;
            border: 2px solid #E0E0E0;
            border-radius: 10px;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            background: white;
        }

        .form-select:focus, .form-input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(26,35,126,0.1);
        }

        .form-input { min-height: 70px; resize: vertical; font-family: inherit; }

        .example-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .example-btn {
            padding: 5px 10px;
            border: 1.5px solid #E0E0E0;
            background: white;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.3s ease;
        }

        .example-btn:active {
            border-color: var(--primary-gold);
            background: var(--primary-gold);
            color: var(--primary-blue);
        }

        .submit-btn {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, var(--primary-gold) 0%, #FFC107 100%);
            color: var(--primary-blue);
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* ========== 加载动画 ========== */
        .loading-section { display: none; text-align: center; padding: 24px 16px; }
        .loading-section.active { display: block; }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #E0E0E0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-gold));
            width: 0%;
            transition: width 0.1s linear;
        }

        .loading-text {
            color: var(--primary-blue);
            font-size: 0.88rem;
            font-weight: 500;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* ========== 结果卡片 ========== */
        .result-section { display: none; }
        .result-section.active { display: block; animation: slideUp 0.5s ease; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card {
            border-left: 3px solid var(--primary-gold);
            padding: 10px 12px;
            margin-bottom: 10px;
            background: #FAFAFA;
            border-radius: 0 10px 10px 0;
        }

        .result-section-title {
            font-size: 0.88rem;
            color: var(--primary-blue);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .psychology-text {
            color: var(--text-dark);
            line-height: 1.6;
            padding: 10px;
            background: white;
            border-radius: 8px;
            font-size: 0.84rem;
        }

        .script-item {
            padding: 10px;
            margin-bottom: 6px;
            background: white;
            border-radius: 8px;
            border-left: 3px solid var(--primary-blue);
        }

        .script-type { font-weight: 600; color: var(--primary-blue); margin-bottom: 4px; font-size: 0.82rem; }
        .script-content { color: var(--text-dark); line-height: 1.6; font-size: 0.8rem; }

        .taboo-item {
            padding: 8px 10px;
            margin-bottom: 5px;
            background: #FFF3E0;
            border-radius: 8px;
            border-left: 3px solid var(--warning-red);
            color: var(--text-dark);
            font-size: 0.8rem;
        }

        .next-step-text {
            padding: 10px;
            background: #E8F5E9;
            border-radius: 8px;
            border-left: 3px solid var(--success-green);
            color: var(--text-dark);
            line-height: 1.6;
            font-size: 0.8rem;
        }

        .save-btn {
            padding: 8px 16px;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            transition: all 0.3s ease;
            margin-top: 10px;
            width: 100%;
        }

        .save-btn:active { transform: scale(0.98); }
        .save-btn.saved { background: var(--success-green); }

        /* ========== Tab2: 话术库 ========== */
        .industry-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }

        .industry-tab {
            padding: 5px 12px;
            border: 1.5px solid #E0E0E0;
            background: white;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.78rem;
            transition: all 0.3s ease;
        }

        .industry-tab.active {
            background: var(--primary-blue);
            color: white;
            border-color: var(--primary-blue);
        }

        .scene-list { display: grid; gap: 8px; }

        .scene-item {
            padding: 11px 14px;
            background: white;
            border-radius: 10px;
            border: 1.5px solid #E0E0E0;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scene-item:active { border-color: var(--primary-gold); background: #FFFDE7; }

        .scene-name { font-weight: 500; color: var(--text-dark); font-size: 0.85rem; }
        .scene-arrow { color: var(--primary-gold); font-size: 0.9rem; }

        /* ========== Tab3: 我的收藏 ========== */
        .favorites-list { display: grid; gap: 8px; }

        .favorite-item {
            padding: 10px 12px;
            background: white;
            border-radius: 10px;
            border: 1.5px solid #E0E0E0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .favorite-input { font-size: 0.9rem; color: var(--text-dark); margin-bottom: 4px; font-weight: 500; }

        .favorite-meta { display: flex; gap: 8px; font-size: 0.7rem; color: var(--text-light); }

        .delete-btn {
            padding: 5px 10px;
            background: #FFEBEE;
            color: var(--warning-red);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            flex-shrink: 0;
        }

        .delete-btn:active { background: var(--warning-red); color: white; }

        .empty-state { text-align: center; padding: 40px 16px; color: var(--text-light); }
        .empty-state-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.3; }

        /* ========== Tab4: 我的业绩 ========== */
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }

        .stat-card {
            padding: 12px 8px;
            background: white;
            border-radius: 12px;
            text-align: center;
            box-shadow: var(--shadow);
            border-top: 3px solid var(--primary-gold);
        }

        .stat-value { font-size: 1.6rem; font-weight: 700; color: var(--primary-blue); margin-bottom: 2px; }
        .stat-label { color: var(--text-light); font-size: 0.72rem; }

        .chart-container { background: white; border-radius: 12px; padding: 12px; box-shadow: var(--shadow); }
        .chart-title { font-size: 0.9rem; color: var(--primary-blue); margin-bottom: 10px; text-align: center; }
        #performanceChart { width: 100%; height: 200px; }

        /* ========== 底部（隐藏） ========== */
        .footer {
            display: none;
        }

        /* ========== 底部导航栏 ========== */
        .bottom-tab-bar {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            height: 56px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 150;
            border-top: 0.5px solid rgba(0,0,0,0.1);
            padding: 0 8px 8px;
        }

        .bottom-tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            flex: 1;
        }

        .bottom-tab-item:active {
            background: rgba(26,35,126,0.08);
        }

        .bottom-tab-icon {
            font-size: 1.3rem;
            line-height: 1;
        }

        .bottom-tab-label {
            font-size: 0.6rem;
            color: #999;
            font-weight: 500;
        }

        .bottom-tab-item.active .bottom-tab-label {
            color: var(--primary-blue);
            font-weight: 700;
        }

        /* ========== 底部标签栏（装饰） ========== */
        .bottom-label {
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            text-align: center;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="phone-wrapper">
        <!-- 手机外框 -->
        <div class="phone-frame">
            <div class="phone-screen">
                <!-- 灵动岛 -->
                <div class="dynamic-island"></div>

                <!-- 状态栏 -->
                <div class="status-bar">

                    <div class="status-icons">

                    <!-- Tab 导航（隐藏） -->

                    <!-- Tab1: 客户难题破解 -->
                    <div id="tab1" class="tab-content active">

                            <div class="input-section">

                                    <label for="industry">选择行业</label>
                                    <select id="industry" class="form-select">

                                    <div class="example-buttons">

                                    <div id="psychologyText" class="psychology-text"></div>

                                <div class="result-card">
                                    <div class="result-section-title">⚠️ 禁忌雷区</div>

                                <div class="result-card">
                                    <div class="result-section-title">📌 下一步建议</div>

                                </div>
                                <button id="saveBtn" class="save-btn">⭐ 收藏此话术</button>
                            </div>

                    </div>

                    <!-- Tab2: 话术库 -->
                    <div id="tab2" class="tab-content">

                            <h2 class="card-title">行业话术库</h2>

                    <!-- Tab3: 我的收藏 -->
                    <div id="tab3" class="tab-content">

                <!-- 底部导航栏 -->

                <!-- 底部横条 -->

        </div>

        <div class="bottom-label">逢客必应 · TRAE AI 创造力大赛</div>
    </div>

    <script>
        // ========== 预设数据 ==========
        const presetData = {
            "你们太贵了": {
                psychology: '嫌贵不是因为真的没钱，而是在试探你的底价。他需要你给一个"值得"的理由。',
                scripts: {
                    gentle: '我理解您的感受，价格确实是个重要因素。不过您看看，我们的产品包含了XX和XX，这些单独买都要多花不少钱。',
                    professional: '贵有贵的道理。我们的售后响应时间是2小时，竞品是24小时。您算算，停机一天损失多少钱？',
                    humorous: '贵？您说得对。就像奔驰和自行车，都能代步，但您愿意骑奔驰上班吗？'
                },
                taboos: [
                    '❌ 别说"我们是最便宜的"——这会让客户怀疑质量',
                    '❌ 别直接降价——客户会觉得你之前利润太高'
                ],
                nextStep: '说完话术后，观察客户表情。如果他点头，立刻递合同。'
            },
            "我再考虑考虑": {
                psychology: '他不是真的在考虑，而是在逃避决策压力。他需要有人帮他"推一把"。',
                scripts: {
                    gentle: '当然，这么大的决定肯定要慎重。不过您能告诉我，主要担心哪方面吗？',
                    professional: '理解。那我帮您列个对比表，您和其他家逐项比，一目了然。',
                    humorous: '考虑可以，但优惠不等人啊。您考虑的时候，别人已经签了。'
                },
                taboos: [
                    '❌ 别追问"您在考虑什么"——太咄咄逼人',
                    '❌ 别说"没什么好考虑的"——否定客户的判断'
                ],
                nextStep: '找出他真正的顾虑点，针对性解决。'
            },
            "我朋友推荐了别家": {
                psychology: '他在拿你的产品和朋友的推荐做比较。他需要确认"选你不会错"。',
                scripts: {
                    gentle: '朋友推荐肯定是好事。不过每个人的需求不一样，您跟我说说您朋友那边什么情况？',
                    professional: '感谢您的信任。我可以给您做一个详细的对比分析，让您看清楚哪边更适合您。',
                    humorous: '朋友推荐的好，说明您身边有人懂行。那更要听听专业人士的意见了。'
                },
                taboos: [
                    '❌ 别说"你朋友不懂"——得罪客户等于得罪朋友',
                    '❌ 别贬低竞品——显得不专业'
                ],
                nextStep: '用数据说话，列对比表。'
            },
            "我没钱": {
                psychology: '要么是真没钱，要么是借口。你需要判断哪种情况。',
                scripts: {
                    gentle: '理解，预算确实是个现实问题。我们可以看看有没有灵活付款方式？',
                    professional: '钱不是问题，问题是值不值。您算算投入产出比，这个投入能带来多少回报？',
                    humorous: '没钱也得吃饭啊。但投资自己/生意，才是最好的省钱方式。'
                },
                taboos: [
                    '❌ 别说"那你走吧"——太绝情',
                    '❌ 别强行推销——客户会觉得你不尊重他'
                ],
                nextStep: '提供分期/折扣方案，降低门槛。'
            },
            "你们不如XX家": {
                psychology: '他在做横向对比。他需要确认"选你没错"。',
                scripts: {
                    gentle: 'XX家确实不错。不过每个产品侧重点不一样，您跟我说说您最看重什么？',
                    professional: '我给您列个详细对比表，功能、价格、售后逐项比。',
                    humorous: '不如他家？那您得先说说他家哪里不如我们了。'
                },
                taboos: [
                    '❌ 别说"他们不行"——贬低同行显得不专业',
                    '❌ 别硬刚——客户会觉得你在抬杠'
                ],
                nextStep: '用差异化优势说服他。'
            }
        };

        // 话术库数据
        const scriptLibrary = {
            "房产": [
                { name: "价格太贵", input: "你们的价格太高了" },
                { name: "位置太偏", input: "这个位置太偏了" },
                { name: "户型不好", input: "这个户型设计不好" },
                { name: "我再看看", input: "我再去别家看看" },
                { name: "首付不够", input: "我首付不够" }
            ],
            "保险": [
                { name: "不需要保险", input: "我不需要保险" },
                { name: "太贵了", input: "保费太贵了" },
                { name: "回去商量", input: "我回去和家人商量一下" },
                { name: "已经买了", input: "我已经买过保险了" },
                { name: "理赔麻烦", input: "听说理赔很麻烦" }
            ],
            "课程": [
                { name: "没时间学", input: "我没时间学习" },
                { name: "效果不好", input: "学了没效果怎么办" },
                { name: "价格太高", input: "课程价格太高了" },
                { name: "考虑一下", input: "我考虑一下再报名" },
                { name: "网上有免费的", input: "网上有免费的教程" }
            ],
            "汽车": [
                { name: "价格太高", input: "车价太高了" },
                { name: "油耗太大", input: "油耗太大了" },
                { name: "配置不够", input: "配置不够高" },
                { name: "再看看", input: "我再去其他4S店看看" },
                { name: "分期太贵", input: "分期付款月供太贵了" }
            ],
            "SaaS软件": [
                { name: "功能不够", input: "功能不够用" },
                { name: "价格太贵", input: "软件价格太贵了" },
                { name: "操作复杂", input: "操作太复杂了" },
                { name: "数据安全", input: "数据安全怎么保障" },
                { name: "再考虑", input: "我们再考虑考虑" }
            ]
        };

        // ========== 全局变量 ==========
        let currentTab = 'tab1';
        let currentIndustry = '房产';
        let currentResult = null;

        // ========== Tab 切换 ==========
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => switchTab(btn.dataset.tab));
        });

        // 底部导航栏点击事件
        document.querySelectorAll('.bottom-tab-item').forEach(item => {
            item.addEventListener('click', () => switchTab(item.dataset.tab));
        });

        function switchTab(tabId) {
            // 更新顶部Tab按钮状态
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');

            // 更新底部导航栏状态
            document.querySelectorAll('.bottom-tab-item').forEach(b => b.classList.remove('active'));
            document.querySelector(`.bottom-tab-item[data-tab="${tabId}"]`).classList.add('active');

            // 切换内容
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            currentTab = tabId;

            // 滚动到顶部
            document.querySelector('.app-content').scrollTop = 0;

            if (tabId === 'tab2') { renderIndustryTabs(); renderSceneList(currentIndustry); }
            else if (tabId === 'tab3') { renderFavorites(); }
            else if (tabId === 'tab4') { renderChart(); }
        }

        // ========== Tab1: 客户难题破解 ==========
        document.querySelectorAll('.example-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.getElementById('customerInput').value = btn.dataset.example;
            });
        });

        document.getElementById('analyzeBtn').addEventListener('click', () => {
            const input = document.getElementById('customerInput').value.trim();
            if (!input) { alert('请输入客户的话'); return; }
            startAnalysis(input);
        });

        function startAnalysis(input) {
            const btn = document.getElementById('analyzeBtn');
            const loadingSection = document.getElementById('loadingSection');
            const resultSection = document.getElementById('resultSection');
            const progressFill = document.getElementById('progressFill');
            const loadingText = document.getElementById('loadingText');

            btn.disabled = true;
            btn.textContent = '分析中...';
            loadingSection.classList.add('active');
            resultSection.classList.remove('active');

            const loadingTexts = [
                'AI 正在分析客户心理...',
                '识别客户类型...',
                '分析潜在顾虑...',
                '匹配最佳策略...'
            ];

            let progress = 0;
            let textIndex = 0;

            const progressInterval = setInterval(() => {
                progress += 3.33;
                progressFill.style.width = progress + '%';

                if (progress >= 33 && textIndex === 0) { loadingText.textContent = loadingTexts[1]; textIndex = 1; }
                else if (progress >= 66 && textIndex === 1) { loadingText.textContent = loadingTexts[2]; textIndex = 2; }
                else if (progress >= 90 && textIndex === 2) { loadingText.textContent = loadingTexts[3]; textIndex = 3; }

                if (progress >= 100) {
                    clearInterval(progressInterval);
                    setTimeout(() => {
                        loadingSection.classList.remove('active');
                        resultSection.classList.add('active');
                        btn.disabled = false;
                        btn.textContent = '🔍 破解';
                        progressFill.style.width = '0%';
                        loadingText.textContent = loadingTexts[0];
                        displayResult(input);
                    }, 300);
                }
            }, 100);
        }

        function displayResult(input) {
            let data = presetData[input];
            if (!data) {
                data = {
                    psychology: '客户在试探你的底线。他需要你给一个"值得"的理由。',
                    scripts: {
                        gentle: '我理解您的顾虑。不过您可以跟我说说，主要担心哪方面吗？',
                        professional: '感谢您的反馈。我可以给您做一个详细的分析，让您看清楚价值所在。',
                        humorous: '您说得有道理。不过好东西都值得等待，就像好酒需要陈酿一样。'
                    },
                    taboos: [
                        '❌ 别急着反驳——先听完客户的想法',
                        '❌ 别直接降价——会显得之前利润太高'
                    ],
                    nextStep: '观察客户反应，找到真正的顾虑点。'
                };
            }

            currentResult = { input, industry: document.getElementById('industry').value, ...data };

            document.getElementById('psychologyText').textContent = data.psychology;

            document.getElementById('scriptsContainer').innerHTML = `
                <div class="script-item"><div class="script-type">🌸 温和型</div><div class="script-content">${data.scripts.gentle}</div></div>
                <div class="script-item"><div class="script-type">💼 专业型</div><div class="script-content">${data.scripts.professional}</div></div>
                <div class="script-item"><div class="script-type">😄 幽默型</div><div class="script-content">${data.scripts.humorous}</div></div>
            `;

            document.getElementById('taboosContainer').innerHTML = data.taboos.map(t => `<div class="taboo-item">${t}</div>`).join('');
            document.getElementById('nextStepText').textContent = data.nextStep;

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.textContent = '⭐ 收藏此话术';
            saveBtn.classList.remove('saved');
        }

        // 收藏按钮
        document.getElementById('saveBtn').addEventListener('click', () => {
            if (!currentResult) return;
            const saveBtn = document.getElementById('saveBtn');
            const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
            if (favorites.some(f => f.input === currentResult.input)) { alert('已经收藏过了'); return; }

            favorites.push({
                id: Date.now().toString(),
                input: currentResult.input,
                industry: currentResult.industry,
                savedAt: new Date().toLocaleString('zh-CN')
            });
            localStorage.setItem('favorites', JSON.stringify(favorites));
            saveBtn.textContent = '✓ 已收藏';
            saveBtn.classList.add('saved');
        });

        // ========== Tab2: 话术库 ==========
        function renderIndustryTabs() {
            const container = document.getElementById('industryTabs');
            container.innerHTML = Object.keys(scriptLibrary).map(ind =>
                `<button class="industry-tab ${ind === currentIndustry ? 'active' : ''}" data-industry="${ind}">${ind}</button>`
            ).join('');
            container.querySelectorAll('.industry-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    currentIndustry = tab.dataset.industry;
                    renderIndustryTabs();
                    renderSceneList(currentIndustry);
                });
            });
        }

        function renderSceneList(industry) {
            const container = document.getElementById('sceneList');
            const scenes = scriptLibrary[industry] || [];
            container.innerHTML = scenes.map(s =>
                `<div class="scene-item" data-input="${s.input}"><span class="scene-name">${s.name}</span><span class="scene-arrow">→</span></div>`
            ).join('');
            container.querySelectorAll('.scene-item').forEach(item => {
                item.addEventListener('click', () => {
                    document.getElementById('customerInput').value = item.dataset.input;
                    switchTab('tab1');
                });
            });
        }

        // ========== Tab3: 我的收藏 ==========
        function renderFavorites() {
            const container = document.getElementById('favoritesList');
            const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');

            if (favorites.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📭</div><p>还没有收藏任何话术</p><p style="margin-top:8px;font-size:0.8rem;">去"客户难题破解"页面收藏常用话术吧</p></div>`;
                return;
            }

            container.innerHTML = favorites.map(item =>
                `<div class="favorite-item">
                    <div class="favorite-info">
                        <div class="favorite-input">${item.input}</div>
                        <div class="favorite-meta"><span>🏷️ ${item.industry}</span><span>🕐 ${item.savedAt}</span></div>
                    </div>
                    <button class="delete-btn" data-id="${item.id}">删除</button>
                </div>`
            ).join('');

            container.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (!confirm('确定要删除这条收藏吗？')) return;
                    const favs = JSON.parse(localStorage.getItem('favorites') || '[]');
                    localStorage.setItem('favorites', JSON.stringify(favs.filter(f => f.id !== btn.dataset.id)));
                    renderFavorites();
                });
            });
        }

        // ========== Tab4: 我的业绩 ==========
        function renderChart() {
            const canvas = document.getElementById('performanceChart');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth * 2;
            canvas.height = canvas.offsetHeight * 2;
            ctx.scale(2, 2);
            const width = canvas.offsetWidth;
            const height = canvas.offsetHeight;
            ctx.clearRect(0, 0, width, height);

            const data = [
                { month: '1月', before: 15, after: 28 },
                { month: '2月', before: 18, after: 35 },
                { month: '3月', before: 22, after: 42 },
                { month: '4月', before: 20, after: 48 },
                { month: '5月', before: 25, after: 55 },
                { month: '6月', before: 28, after: 67 }
            ];

            const padding = { top: 30, right: 20, bottom: 45, left: 35 };
            const chartWidth = width - padding.left - padding.right;
            const chartHeight = height - padding.top - padding.bottom;
            const maxValue = 70;
            const barWidth = chartWidth / data.length / 3;
            const barGap = barWidth * 0.5;

            // 网格
            ctx.strokeStyle = '#E0E0E0';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 5; i++) {
                const y = padding.top + (chartHeight / 5) * i;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(width - padding.right, y);
                ctx.stroke();
                ctx.fillStyle = '#999';
                ctx.font = '9px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(Math.round(maxValue - (maxValue / 5) * i), padding.left - 5, y + 3);
            }

            // 柱状图
            data.forEach((item, index) => {
                const x = padding.left + (chartWidth / data.length) * index + barGap;
                const bH = (item.before / maxValue) * chartHeight;
                const aH = (item.after / maxValue) * chartHeight;

                // 使用前
                ctx.fillStyle = '#1A237E';
                ctx.beginPath();
                const bx = x, by = padding.top + chartHeight - bH;
                ctx.roundRect ? ctx.roundRect(bx, by, barWidth, bH, 2) : ctx.rect(bx, by, barWidth, bH);
                ctx.fill();

                // 使用后
                ctx.fillStyle = '#FFD700';
                const ax = x + barWidth + barGap / 2, ay = padding.top + chartHeight - aH;
                ctx.beginPath();
                ctx.roundRect ? ctx.roundRect(ax, ay, barWidth, aH, 2) : ctx.rect(ax, ay, barWidth, aH);
                ctx.fill();

                // X轴标签
                ctx.fillStyle = '#666';
                ctx.font = '9px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(item.month, x + barWidth + barGap / 4, height - padding.bottom + 14);
            });

            // 坐标轴
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(padding.left, padding.top);
            ctx.lineTo(padding.left, padding.top + chartHeight);
            ctx.lineTo(width - padding.right, padding.top + chartHeight);
            ctx.stroke();

            // 图例
            const lx = width / 2 - 55;
            const ly = height - 12;
            ctx.fillStyle = '#1A237E';
            ctx.fillRect(lx, ly - 8, 10, 10);
            ctx.fillStyle = '#666';
            ctx.font = '9px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('使用前', lx + 13, ly);
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(lx + 60, ly - 8, 10, 10);
            ctx.fillStyle = '#666';
            ctx.fillText('使用后', lx + 73, ly);
        }

        // 初始化
        renderIndustryTabs();
        renderSceneList(currentIndustry);
    </script>
