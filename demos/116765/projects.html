  <!-- ========================================
       页面交互脚本
       ======================================== -->
  <script>
    (function() {
      // --- 导航栏交互 ---
      var navConfig = {
        'dashboard': '仪表盘',
        'projects': '影游管理',
        'editor': '剧情编辑',
        'media': '素材库',
        'settings': '系统设置'
      };

      var navItems = document.querySelectorAll('.nav-item');

      // 点击导航项切换选中状态
      navItems.forEach(function(item) {
        item.addEventListener('click', function(e) {
          e.preventDefault();
          navItems.forEach(function(nav) {
            nav.classList.remove('active');
          });
          this.classList.add('active');
          var navKey = this.getAttribute('data-nav-key');
          updateBreadcrumb(navKey);
        });

        // 键盘支持
        item.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            this.click();
          }
        });
      });

      function updateBreadcrumb(navKey) {
        var breadcrumbSlot = document.getElementById('breadcrumb-slot');
        if (!breadcrumbSlot) return;
        var pageName = navConfig[navKey] || '未知页面';
        breadcrumbSlot.innerHTML =
          '<span class="breadcrumb-item" onclick="location.hash=\'dashboard\'">首页</span>' +
          '<span class="breadcrumb-separator">></span>' +
          '<span class="breadcrumb-item current">' + pageName + '</span>';
      }

      // --- Tabs 标签页切换 ---
      var tabItems = document.querySelectorAll('.tab-item');
      tabItems.forEach(function(tab) {
        tab.addEventListener('click', function() {
          // 移除所有选中
          tabItems.forEach(function(t) {
            t.classList.remove('active');
          });
          // 当前选中
          this.classList.add('active');

          // 根据选中状态筛选卡片（简易实现）
          var tabKey = this.getAttribute('data-tab');
          var cards = document.querySelectorAll('.project-card');
          cards.forEach(function(card) {
            if (tabKey === 'all') {
              card.style.display = '';
            } else if (tabKey === 'published') {
              card.style.display = card.getAttribute('data-status') === 'published' ? '' : 'none';
            } else if (tabKey === 'draft') {
              card.style.display = card.getAttribute('data-status') === 'draft' ? '' : 'none';
            }
          });
        });
      });

      // --- 分页器点击 ---
      var pageBtns = document.querySelectorAll('.page-btn');
      pageBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          // 忽略上一页/下一页（带SVG图标）和禁用按钮
          if (this.querySelector('svg') || this.disabled) return;
          // 移除所有 active
          pageBtns.forEach(function(b) {
            if (!b.querySelector('svg')) b.classList.remove('active');
          });
          this.classList.add('active');
        });
      });

      // --- 创建项目弹窗 ---
      var createModal = document.getElementById('createModal');
      var btnCreate = document.getElementById('btnCreateProject');

      if (btnCreate && createModal) {
        btnCreate.addEventListener('click', function() {
          createModal.classList.add('visible');
        });
      }

      // 点击遮罩层关闭弹窗
      if (createModal) {
        createModal.addEventListener('click', function(e) {
          if (e.target === createModal) {
            createModal.classList.remove('visible');
          }
        });
      }

      // 将弹窗函数挂到全局（供 onclick 调用）
      window.hideCreateModal = function() {
        var modal = document.getElementById('createModal');
        if (modal) modal.classList.remove('visible');
      };

    })();
  </script>

    }
    .btn-primary:hover {
      background-color: #99FFEA;         /* 主色亮 - 点击反馈 */
    }
    .btn-primary:active {
      background-color: #5CD9C4;         /* 主色暗 - 按下反馈 */
    }
    .btn-primary svg {
      width: 16px;
      height: 16px;
      stroke-width: 2;
    }

    /* --- 筛选栏 --- */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 16px;                        /* 【可调】各元素间距 */
      justify-content: space-between;
      padding: 16px 24px;               /* 【可调】筛选栏内边距 */
      flex-shrink: 0;                   /* 不收缩 */
      border-bottom: 1px solid var(--divider); /* 底部分割线 */
    }

    /* Tabs 标签页 */
    .tabs {
      display: flex;
      align-items: center;
      gap: 0;
      border-bottom: 1px solid var(--divider);
    }

    /* 单个 Tab 项 */
    .tab-item {
      /* 【可调】Tab 内边距 */
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 500;
      color: #999999;                   /* 默认文字色 */
      cursor: pointer;
      position: relative;
      transition: color var(--duration-micro) ease-out;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;             /* 与底边框对齐 */
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      font-family: var(--font-body);
    }
    .tab-item:hover {
      color: #CCCCCC;
    }
    /* 选中状态 */
    .tab-item.active {
      color: #80FFE0;                   /* 选中文字色 */
      border-bottom-color: #80FFE0;     /* 【可调】选中下划线颜色 */
    }

    /* 搜索框 */
    .search-box {
      position: relative;
    }
    .search-box svg {
      position: absolute;
      left: 12px;                       /* 搜索图标左边距 */
      top: 50%;
      transform: translateY(-50%);
      width: 16px;                       /* 【可调】搜索图标大小 */
      height: 16px;
      color: #888888;
      pointer-events: none;
    }
    .search-input {
      /* 【可调】搜索框宽度 */
      width: 240px;
      /* 【可调】搜索框高度 */
      height: 36px;
      background-color: #252525;
      border: 1px solid #333333;
      border-radius: 8px;
      padding: 0 12px 0 36px;           /* 左侧给图标留空间 */
      font-size: 14px;
      color: #FFFFFF;
      font-family: var(--font-body);
      transition: border-color var(--duration-micro) ease-out;
    }
    .search-input::placeholder {
      color: #888888;                   /* 占位符文字色 */
      font-size: 14px;
    }
    .search-input:focus {
      border-color: #80FFE0;            /* 聚焦边框变主色 */
    }

    /* --- 项目卡片网格 --- */
    /* 【可调】网格列数 - 每行5个卡片 */
    .projects-grid-wrapper {
      flex: 1;
      overflow-y: auto;                        /* 只有这个区域滚动 */
      padding: 16px 24px;                       /* 【可调】卡片区域内边距 */
    }
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);   /* 【可调】每行5个卡片 */
      /* 【可调】卡片间距（缩小一点因为卡片多了） */
      gap: 12px;
    }

    /* --- 项目卡片（竖构图样式） --- */
    .project-card {
      background: var(--bg-card);              /* #252525 */
      border-radius: var(--radius-card);      /* 12px */
      overflow: hidden;
      cursor: pointer;
      transition: background-color 150ms ease-out,
                  transform 150ms ease-out;
    }
    .project-card:hover {
      background-color: var(--bg-light);       /* #2D2D2D */
      transform: translateY(-2px);              /* 【可调】hover上移距离 */
    }

    /* 封面区域 */
    .card-cover {
      position: relative;
      width: 100%;
      padding-top: 177.8%;                       /* 【可调】竖构图比例 9:16（高度=宽度的177.8%） */
      background: #1a1a1a;
      overflow: hidden;
    }
    .card-cover-placeholder {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-cover-placeholder svg {
      width: 36px;                             /* 【可调】播放图标大小 */
      height: 36px;
      stroke: var(--text-disabled);            /* #4D4D4D */
      opacity: 0.6;
    }

    /* 封面上叠放的标签 */
    .card-cover-tag {
      position: absolute;
      font-size: 11px;                         /* 【可调】标签字号 */
      font-weight: 500;
      padding: 3px 8px;                        /* 【可调】标签内边距 */
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      backdrop-filter: blur(4px);             /* 【可调】毛玻璃模糊 */
      -webkit-backdrop-filter: blur(4px);
    }

    /* 已发布状态标签 - 右上角 */
    .tag-status {
      top: 8px;                                /* 【可调】距顶部 */
      right: 8px;                              /* 【可调】距右侧 */
    }
    .tag-status.published {
      background: rgba(74, 222, 128, 0.2);
      color: #4ADE80;
    }
    .tag-status.draft {
      background: rgba(251, 191, 36, 0.2);
      color: #FBBF24;
    }

    /* 类别标签 - 左下角 */
    .tag-category {
      bottom: 8px;                             /* 【可调】距底部 */
      left: 8px;                               /* 【可调】距左侧 */
      background: rgba(0, 0, 0, 0.6);
      color: #FFFFFF;
    }

    /* 日期标签 - 右下角 */
    .tag-date {
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.6);
      color: rgba(255, 255, 255, 0.7);
    }

    /* 信息区域（封面下方） */
    .card-info {
      padding: 12px;                            /* 【可调】信息区内边距 */
    }

    /* 卡片标题 */
    .card-title {
      font-size: 14px;                         /* 【可调】标题字号 */
      font-weight: 600;
      color: var(--text-primary);              /* #FFFFFF */
      margin-bottom: 4px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 卡片描述 */
    .card-desc {
      font-size: 12px;                         /* 【可调】描述字号 */
      color: var(--text-secondary);            /* #999999 */
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;                   /* 【可调】最多显示2行 */
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 幽灵按钮 - 红色文字（删除） */
    .btn-ghost-danger {
      background-color: transparent;
      border: none;
      color: #F87171;                  /* 【可调】删除按钮文字颜色 */
      border-radius: 8px;
      padding: 6px 16px;                /* 【可调】幽灵按钮内边距 */
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color var(--duration-micro) ease-out;
      font-family: var(--font-body);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-ghost-danger:hover {
      background-color: rgba(248, 113, 113, 0.1);
    }
    .btn-ghost-danger svg {
      width: 14px;
      height: 14px;
      stroke-width: 2;
    }

    /* --- 分页器（固定在页面底部） --- */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;                         /* 【可调】分页器按钮间距 */
      padding: 12px 0;
      flex-shrink: 0;                   /* 不收缩 */
      border-top: 1px solid var(--divider);    /* 顶部分割线 */
      background: var(--bg-main);
    }

    /* 页码按钮 */
    .page-btn {
      /* 【可调】页码按钮尺寸 */
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background-color: #252525;
      border: none;
      color: #999999;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color var(--duration-micro) ease-out,
                  color var(--duration-micro) ease-out;
      font-family: var(--font-body);
    }
    .page-btn:hover {
      background-color: #2D2D2D;
    }
    /* 当前页 */
    .page-btn.active {
      background-color: #80FFE0;
      color: #171717;
    }
    /* 禁用状态 */
    .page-btn:disabled {
      color: #4D4D4D;
      cursor: not-allowed;
    }
    .page-btn svg {
      width: 16px;
      height: 16px;
      stroke-width: 2;
    }

    /* --- 弹窗遮罩层 --- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.6); /* 【可调】遮罩透明度 */
      display: none;                      /* 初始隐藏 */
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .modal-overlay.visible {
      display: flex;                     /* JS切换显示 */
    }

    /* 弹窗容器 */
    .modal {
      /* 【可调】弹窗最大宽度 */
      max-width: 600px;
      width: 90%;
      background-color: #252525;
      border-radius: 16px;              /* 【可调】弹窗圆角 */
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); /* 弹窗阴影 */
      overflow: hidden;
    }

    /* 弹窗头部 */
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px 16px;          /* 【可调】弹窗头部内边距 */
    }
    /* 【可调】弹窗标题字号 */
    .modal-title {
      font-size: 20px;
      font-weight: 600;
      color: #FFFFFF;
    }

    /* 关闭按钮 */
    .modal-close {
      width: 32px;                       /* 【可调】关闭按钮尺寸 */
      height: 32px;
      border-radius: 8px;
      background: none;
      border: none;
      color: #999999;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color var(--duration-micro) ease-out,
                  color var(--duration-micro) ease-out;
    }
    .modal-close:hover {
      background-color: #2D2D2D;
      color: #FFFFFF;
    }
    .modal-close svg {
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }

    /* 弹窗内容区 */
    .modal-body {
      padding: 0 24px 24px;
    }

    /* --- 表单样式 --- */
    /* 表单组（标签 + 输入框） */
    .form-group {
      margin-bottom: 16px;              /* 【可调】表单项间距 */
    }
    /* 表单标签 */
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #FFFFFF;
      margin-bottom: 6px;               /* 【可调】标签与输入框间距 */
    }

    /* 输入框统一样式 */
    .form-input,
    .form-textarea,
    .form-select {
      width: 100%;
      background-color: #252525;
      border: 1px solid #333333;
      border-radius: 8px;
      padding: 10px 12px;               /* 【可调】输入框内边距 */
      font-size: 14px;
      color: #FFFFFF;
      font-family: var(--font-body);
      transition: border-color var(--duration-micro) ease-out;
      -webkit-appearance: none;
      appearance: none;
    }
    .form-input:focus,
    .form-textarea:focus,
    .form-select:focus {
      border-color: #80FFE0;
    }
    .form-input::placeholder,
    .form-textarea::placeholder {
      color: #888888;
    }

    /* 文本域 */
    .form-textarea {
      /* 【可调】文本域高度 */
      height: 80px;
      resize: vertical;
    }

    /* 下拉选择（右侧有下拉箭头） */
    .select-wrapper {
      position: relative;
    }
    .select-wrapper svg {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: #999999;
      pointer-events: none;
    }
    .form-select {
      padding-right: 36px;              /* 右侧给箭头留空间 */
      cursor: pointer;
    }
    .form-select option {
      background-color: #252525;
      color: #FFFFFF;
    }

    /* 封面上传区（竖构图） */
    .upload-area {
      width: 100%;
      height: 200px;                      /* 【可调】上传区高度（竖构图） */
      max-width: 180px;                    /* 【可调】上传区最大宽度（竖比例） */
      border: 2px dashed var(--border-main); /* #333333 */
      border-radius: var(--radius-card);   /* 12px */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin: 0 auto;
      background: var(--bg-light);          /* #2D2D2D */
      transition: border-color 150ms ease-out;
    }
    .upload-area:hover {
      border-color: var(--primary-color);
    }
    .upload-area svg {
      width: 40px;
      height: 40px;
      stroke: var(--text-disabled);
    }
    .upload-area span {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* 弹窗底部按钮区 */
    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;                         /* 【可调】底部按钮间距 */
      padding: 16px 24px;
      border-top: 1px solid var(--divider);
    }

    /* 次按钮（取消） */
    .btn-cancel {
      background-color: transparent;
      border: 1px solid #333333;
      color: #999999;
      border-radius: 8px;
      padding: 10px 20px;               /* 【可调】按钮内边距 */
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color var(--duration-micro) ease-out,
                  color var(--duration-micro) ease-out;
      font-family: var(--font-body);
    }
    .btn-cancel:hover {
      border-color: #80FFE0;
      color: #80FFE0;
    }

    /* 危险按钮（删除确认） */
    .btn-danger {
      /* 【可调】危险按钮颜色 */
      background-color: #F87171;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color var(--duration-micro) ease-out;
      font-family: var(--font-body);
    }
    .btn-danger:hover {
      background-color: #f87171cc;
    }

    /* 删除确认弹窗内容文字 */
    .confirm-text {
      font-size: 14px;
      color: #999999;
      line-height: 1.6;
    }
  </style>
</body>
</html>
