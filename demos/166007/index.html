<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跑马吗 UI 预览</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #1f1f1f;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(1400px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 72px;
    }

    header {
      margin-bottom: 40px;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: -0.04em;
    }

    header p {
      margin-bottom: 0;
      color: #777;
    }

    section + section {
      margin-top: 56px;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      align-items: start;
    }

    figure {
      margin: 0;
      overflow: hidden;
      background: #fff;
      border: 1px solid #e9e9e9;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
    }

    figure a {
      display: block;
      line-height: 0;
    }

    figure img {
      display: block;
      width: 100%;
      height: auto;
      background: #eee;
    }

    figcaption {
      padding: 14px 16px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      main {
        width: min(100% - 20px, 1400px);
        padding-top: 28px;
      }

      .gallery {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>跑马吗 UI 预览</h1>
      <p>共 14 张界面预览图，点击图片可查看原图。</p>
    </header>

    <section>
      <h2>首页</h2>
      <div class="gallery">
        <figure>
          <a href="./首页/stitch_project_ui_generator/_1/screen.png" target="_blank">
            <img src="./首页/stitch_project_ui_generator/_1/screen.png" alt="首页方案一" loading="lazy">
          </a>
          <figcaption>首页方案一</figcaption>
        </figure>

        <figure>
          <a href="./首页/stitch_project_ui_generator/_2/screen.png" target="_blank">

          </a>
          <figcaption>首页方案二</figcaption>

        <figure>

            <img src="./首页/stitch_project_ui_generator/_3/screen.png" alt="首页方案三" loading="lazy">
          </a>

      </div>

    </section>
  </main>
</body>
</html>
