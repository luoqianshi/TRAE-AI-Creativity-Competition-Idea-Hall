<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkMind</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="第二大脑空间">
        <div class="brand">
          <div class="mark">W</div>
          <div>
            <h1>WorkMind</h1>
            <p>Linus 私人第二大脑</p>
          </div>
        </div>

        <section class="panel compact">
          <div class="panel-title">
            <span>空间</span>
          </div>
          <div class="space-switch" id="spaceSwitch" aria-label="空间切换">
            <button class="active" data-space="all">全部</button>
            <button data-space="personal">个人</button>
            <button data-space="work">工作</button>
          </div>
        </section>

        <section class="panel compact">
          <div class="panel-title">
            <span>今日焦点</span>
            <button class="icon-button" id="clearData" title="清空演示数据" aria-label="清空演示数据">×</button>
          </div>
          <div class="focus-card" id="topFocus">
            <strong>先记录一条真实工作内容</strong>
            <span>系统会从里面抽取项目、行动、风险和经验。</span>
          </div>
        </section>

        <section class="panel compact">
          <div class="panel-title">
            <span>主题</span>
            <button class="icon-button" id="addSample" title="加入示例" aria-label="加入示例">＋</button>
          </div>
          <div class="project-list" id="projectList"></div>
        </section>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <h2 id="workspaceTitle">全局视图</h2>
            <p id="workspaceSubtitle">记录、解析、形成链路和下一步。</p>
          </div>
          <div class="metrics" aria-label="统计">
            <div><strong id="metricProjects">0</strong><span>主题</span></div>
            <div><strong id="metricLinks">0</strong><span>链路</span></div>
            <div><strong id="metricSignals">0</strong><span>经验</span></div>
          </div>
        </header>

        <section class="capture">
          <div class="capture-head">
            <span>快速记录</span>
            <div class="segmented" role="tablist" aria-label="记录类型">
              <button class="active" data-mode="auto">自动</button>
              <button data-mode="plan">计划</button>
              <button data-mode="task">行动</button>
              <button data-mode="data">数据</button>
              <button data-mode="lesson">经验</button>
            </div>
          </div>
          <textarea id="captureInput" placeholder="例如：7月首周上线某项目，并检测首周上线数据。或者：我想把 AI 产品设计提升到能独立做商业化方案的程度。"></textarea>
          <div class="capture-actions">
            <input id="projectInput" type="text" placeholder="主题名，可留空自动识别" />
            <button class="primary" id="saveEntry">记录并分析</button>
          </div>
        </section>

        <section class="analysis-panel">
          <div class="section-head slim">
            <h3>系统解析</h3>
            <span class="mini-note">先用本地规则模拟，未来替换为大模型理解</span>
          </div>
          <div id="analysisView" class="analysis-grid"></div>
        </section>

        <section class="main-grid">
          <section class="graph-panel">
            <div class="section-head">
              <div>
                <h3>链路视图</h3>
                <p>计划、行动、证据和复盘会被串成一条可追溯的链。</p>
              </div>
              <select id="graphFilter" aria-label="图谱筛选">
                <option value="all">全部主题</option>
              </select>
            </div>
            <div class="graph-wrap">
              <svg id="knowledgeGraph" role="img" aria-label="链路视图"></svg>
            </div>
          </section>

          <aside class="insight-panel">
            <div class="section-head slim">
              <h3>下一步判断</h3>
              <button class="ghost" id="refreshAdvice">刷新</button>
            </div>
            <div id="adviceList" class="advice-list"></div>
          </aside>
        </section>

        <section class="lower-grid">
          <section class="ledger">
            <div class="section-head slim">
              <h3>记录流</h3>
              <select id="typeFilter" aria-label="记录筛选">
                <option value="all">全部</option>
                <option value="plan">计划</option>
                <option value="task">行动</option>
                <option value="reminder">提醒</option>
                <option value="risk">风险</option>
                <option value="data">数据</option>
                <option value="lesson">经验</option>
              </select>
            </div>
            <div id="entryList" class="entry-list"></div>
          </section>

          <section class="memory">
            <div class="section-head slim">
              <h3>经验沉淀</h3>
              <button class="ghost" id="openReview">复盘</button>
            </div>
            <div id="memoryList" class="memory-list"></div>
          </section>
        </section>
      </section>
    </main>

    <dialog id="reviewDialog">
      <form method="dialog" class="review-form">
        <div class="section-head slim">
          <h3>项目复盘</h3>
          <button class="icon-button" value="cancel" aria-label="关闭">×</button>
        </div>
        <input id="reviewProject" type="text" placeholder="复盘项目" />
        <textarea id="reviewText" placeholder="这次结果是什么？哪个判断对了？哪个动作真正推动了结果？以后遇到类似情况要怎么做？"></textarea>
        <button class="primary" id="saveReview" value="default">沉淀经验</button>
      </form>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
