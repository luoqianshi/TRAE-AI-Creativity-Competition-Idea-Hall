<style>
.line{fill:none;stroke:#101415;stroke-width:5.2;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#101415;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.fill-dark{fill:#101415}.soft{fill:#fff}.accent{fill:#25D7D9}.muted{fill:#F6F6F3}.spark{fill:#E8FA4D}.orange{stroke:#FF7639}.stamp{fill:none;stroke:#CBD3D3;stroke-width:2;stroke-linecap:round;stroke-dasharray:5 6}
