<rect width="600" height="720" fill="#FDFDFB"/><rect x="34" y="32" width="532" height="656" fill="#fff" stroke="#2CD7D9" stroke-width="18" stroke-dasharray="24 18"/><path class="thin" d="M94 132c70 34 160 30 244 4"/><path class="thin" d="M118 92c40 55 84 70 154 72"/><path class="thin" d="M80 104l67 45m119-57l-16 58"/><path class="line" d="M387 82c-10-28 34-35 59-16 25 19 8 49-18 44"/><path class="thin" d="M430 111c21 6 42 23 58 50"/><text x="105" y="270" font-size="42" font-family="Georgia, serif" font-weight="700" fill="#101415">Dear my friend:</text><text x="105" y="340" font-size="26" font-family="serif" fill="#101415">嗨，我是耳朵，</text><text x="105" y="382" font-size="26" font-family="serif" fill="#101415">让每一次情绪都有地方停靠。</text><text x="105" y="465" font-size="26" font-family="serif" fill="#101415">写下今天的声音、天气和小事，</text><text x="105" y="507" font-size="26" font-family="serif" fill="#101415">把生活保存成温柔的纸片。</text><circle class="stamp" cx="435" cy="513" r="52"/><text x="394" y="521" transform="rotate(-15 420 516)" font-size="22" fill="#B7C0C0" font-family="serif">BUN NOTE</text><rect x="34" y="598" width="532" height="90" fill="#46DADC"/><text x="110" y="648" font-size="26" font-family="serif" font-weight="700" fill="#073033">耳朵日记 你的心情树洞</text><rect x="480" y="626" width="54" height="54" fill="#fff"/><path class="thin" d="M488 634h8v8h-8zM504 634h8v8h-8zM520 634h8v8h-8zM488 650h8v8h-8zM512 650h16v16h-16zM488 666h16v8h-16z"/></svg>