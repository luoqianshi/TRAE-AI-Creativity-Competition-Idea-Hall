          <div class="card-image">
            <div class="card-placeholder">${item.emoji}</div>
            ${item.rating > 0 ? `<div class="rating-badge ${ratingClass}">${item.rating}</div>` : `<div class="rating-badge low">暂无</div>`}
          </div>
          <div class="card-content">
            <h3 class="card-title">${item.title}</h3>
            <div class="card-meta">
              <span>${item.year}</span>
              <span>${item.type === 'movie' ? '电影' : item.type === 'series' ? '剧集' : item.type === 'anime' ? '动漫' : '纪录片'}</span>
            </div>
            <div class="card-genre">
              ${item.genre.map(g => `<span class="genre-tag">${g}</span>`).join('')}
            </div>
            ${reasonHtml}
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // 更新统计数据
    function updateStats(filteredCount) {
      const totalCount = contentData.length;
      const efficiency = Math.round((filteredCount / totalCount) * 100);
      
      document.getElementById('filteredCount').textContent = filteredCount;
      document.getElementById('efficiency').textContent = `${efficiency}%`;
      
      // 更新进度条
      const progressBar = document.getElementById('progressBar');
      progressBar.style.width = `${efficiency}%`;
    }

    // 显示通知
    function showNotification(title, message, icon = '🛡️') {
      const notification = document.getElementById('notification');
      notification.querySelector('h4').textContent = title;
      notification.querySelector('p').textContent = message;
      notification.querySelector('.notification-icon').textContent = icon;
      notification.classList.add('show');
      
      setTimeout(() => {
        notification.classList.remove('show');
      }, 3000);
    }

    // 过滤动画
    function startFiltering() {
      // 显示初始通知
      showNotification('个人信息流过滤器', '3秒后将自动为您筛选内容...', '⏱️');
      
      // 3秒后开始过滤
      setTimeout(() => {
        showNotification('开始筛选', '正在根据您的偏好过滤低质量内容...', '🛡️');
        
        let filteredCount = 0;
        const cardsToFilter = contentData.filter(item => 
          item.status === 'low-quality' || 
          item.status === 'not-interested' || 
          item.status === 'duplicate' ||
          item.status === 'no-rating'
        );
        
        // 逐个过滤卡片
        cardsToFilter.forEach((item, index) => {
          setTimeout(() => {
            const card = document.getElementById(`card-${item.id}`);
            if (card) {
              card.classList.add('hidden');
              filteredCount++;
              updateStats(filteredCount);
              
              // 更新通知
              const message = `已过滤 ${filteredCount}/${cardsToFilter.length} 个低质量内容`;
              showNotification('过滤进度', message, '🛡️');
            }
          }, (index + 1) * 300); // 每个卡片间隔300ms
        });
        
        // 过滤完成
        setTimeout(() => {
          showNotification('过滤完成', `已为您过滤 ${filteredCount} 个低质量内容，浏览效率提升 ${Math.round((filteredCount / contentData.length) * 100)}%`, '✅');
          
          // 显示过滤统计
          document.getElementById('filterSummary').classList.add('show');
          document.getElementById('summaryTotal').textContent = contentData.length;
          document.getElementById('summaryFiltered').textContent = filteredCount;
          document.getElementById('summaryEfficiency').textContent = `${Math.round((filteredCount / contentData.length) * 100)}%`;
          
        }, (cardsToFilter.length + 1) * 300);
        
      }, 3000);
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      renderContentCards();
      updateStats(0);
      
      // 显示欢迎信息
      setTimeout(() => {
        showNotification('欢迎来到影视精选', '个人信息流过滤器已启用，3秒后将自动为您筛选内容', '🎬');
      }, 500);
      
      // 开始过滤流程
      setTimeout(startFiltering, 1500);
    });
  </script>
</body>
</html>
