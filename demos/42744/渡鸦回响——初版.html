<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raven · 认知拆解 v0.1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0f1117;
            --panel: #1a1d27;
            --border: #2a2f3d;
            --text: #e4e6eb;
            --text-dim: #8b919e;
            --judge: #4f7cff;
            --friend: #e879a8;
            --warn: #f87171;
            --ok: #34d399;
        }

        body {
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            font-size: 14px;
            line-height: 1.6;
        }

        /* ===== 顶部 ===== */
        .topbar {
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-weight: 600; font-size: 16px; letter-spacing: 0.05em; }
        .logo span { color: var(--text-dim); margin-left: 8px; font-weight: 400; font-size: 13px; }
        .topbar-status { font-size: 12px; color: var(--text-dim); }

        /* ===== 主布局 ===== */
        .layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
            padding: 16px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
        }

        .panel-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }

        /* ===== 情绪条 ===== */
        .emotion-bar {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        .emotion-meter { flex: 1; }
        .meter-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
        .meter-track { height: 4px; background: #252934; border-radius: 2px; overflow: hidden; }
        .meter-fill { height: 100%; background: var(--warn); transition: width 0.6s, background 0.6s; }
        .meter-fill.calm { background: var(--ok); }
        .emotion-tag { padding: 4px 10px; border-radius: 4px; background: rgba(248,113,113,0.15); color: var(--warn); font-size: 12px; font-weight: 500; }
        .emotion-tag.calm { background: rgba(52,211,153,0.15); color: var(--ok); }

        /* ===== Agent 对话 ===== */
        .agents { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
        .agent { border: 1px solid var(--border); border-radius: 8px; padding: 14px; min-height: 380px; display: flex; flex-direction: column; }
        .agent.judge { border-top: 2px solid var(--judge); }
        .agent.friend { border-top: 2px solid var(--friend); }
        .agent-head { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
        .agent-dot { width: 8px; height: 8px; border-radius: 50%; }
        .judge .agent-dot { background: var(--judge); }
        .friend .agent-dot { background: var(--friend); }
        .agent-name { font-weight: 600; font-size: 14px; }
        .agent-role { font-size: 12px; color: var(--text-dim); }
        .chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .chat::-webkit-scrollbar { width: 4px; }
        .chat::-webkit-scrollbar-thumb { background: #2a2f3d; border-radius: 2px; }
        .msg { padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.6; }
        .msg.user { background: #252934; align-self: flex-start; max-width: 90%; }
        .msg.agent { background: rgba(255,255,255,0.03); border-left: 2px solid; }
        .judge .msg.agent { border-color: var(--judge); }
        .friend .msg.agent { border-color: var(--friend); }
        .msg-sender { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
        .typing { font-size: 12px; color: var(--text-dim); padding: 4px 0; }
        .typing::after { content: '...'; animation: dots 1.2s steps(3) infinite; }
        @keyframes dots { 0%,20%{content:'.'} 40%{content:'..'} 60%,100%{content:'...'} }

        /* ===== 输入区 ===== */
        .input-area { margin-top: 12px; display: flex; gap: 8px; }
        .input-area input {
            flex: 1; background: #252934; border: 1px solid var(--border); border-radius: 8px;
            padding: 10px 14px; color: var(--text); font-size: 14px; font-family: inherit; outline: none;
        }
        .input-area input:focus { border-color: #3a4051; }
        .btn {
            background: #252934; border: 1px solid var(--border); color: var(--text);
            padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit;
        }
        .btn:hover { background: #2d3242; }
        .btn-primary { background: var(--judge); border-color: var(--judge); color: white; }
        .btn-primary:hover { background: #3d6aed; }

        /* ===== 侧栏 ===== */
        .side { display: flex; flex-direction: column; gap: 16px; }
        .tree-list { display: flex; flex-direction: column; gap: 8px; }
        .tree-item {
            padding: 10px 12px; background: #252934; border-radius: 6px;
            border-left: 2px solid; font-size: 13px;
        }
        .tree-item.fact { border-color: var(--ok); }
        .tree-item.cog { border-color: var(--warn); }
        .tree-tag { font-size: 11px; color: var(--text-dim); margin-bottom: 2px; }
        .tree-empty { color: var(--text-dim); font-size: 13px; text-align: center; padding: 24px 0; }

        /* ===== 响应式 ===== */
        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
            .agents { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="topbar">
    <div class="logo">Raven <span>认知拆解原型 v0.1</span></div>
    <div class="topbar-status" id="topStatus">就绪</div>
</div>

<div class="layout">
    <!-- 左侧 -->
    <div>
        <!-- 情绪感知 -->
        <div class="panel">
            <div class="panel-title">情绪感知</div>
            <div class="emotion-bar">
                <div class="emotion-meter">
                    <div class="meter-label"><span>焦虑指数</span><span id="anxVal">--</span></div>
                    <div class="meter-track"><div class="meter-fill" id="anxBar" style="width:0%"></div></div>
                </div>
                <div class="emotion-tag" id="emTag">未开始</div>
            </div>
        </div>

        <!-- 双 Agent -->
        <div class="agents">
            <div class="agent judge">
                <div class="agent-head">
                    <div class="agent-dot"></div>
                    <div>
                        <div class="agent-name">理性法官</div>
                        <div class="agent-role">追问证据 · 剥离情绪推断</div>
                    </div>
                </div>
                <div class="chat" id="judgeChat"></div>
            </div>
            <div class="agent friend">
                <div class="agent-head">
                    <div class="agent-dot"></div>
                    <div>
                        <div class="agent-name">共情闺蜜</div>
                        <div class="agent-role">看见情绪 · 引导新视角</div>
                    </div>
                </div>
                <div class="chat" id="friendChat"></div>
            </div>
        </div>

        <!-- 输入 -->
        <div class="input-area">
            <input id="userInput" type="text" placeholder="输入你的困扰，回车发送..." />
            <button class="btn btn-primary" onclick="send()">发送</button>
        </div>
    </div>

    <!-- 右侧：认知拆解树 -->
    <div class="side">
        <div class="panel">
            <div class="panel-title">认知拆解树</div>
            <div class="tree-list" id="treeList">
                <div class="tree-empty">对话开始后，这里会显示事实与认知偏差</div>
            </div>
        </div>
    </div>
</div>

<script>
    const state = { anx: 0, emotion: 'idle' };

    // 预设脚本
    const script = [
        {
            user: '今天又被领导当众批评了，我觉得自己一点用都没有。',
            judge: '“一点用都没有”——这个结论，是基于哪些客观证据，还是当下的情绪推断？',
            friend: '被当众批评肯定很难受。身边有同事帮你说话吗？',
            anx: 80, tag: '焦虑',
            fact: '事件：今天被领导当众批评',
            cog: '认知偏差：全盘否定自己（"一点用都没有"）'
        },
        {
            user: '有同事给我使了个眼色，但领导说"你怎么连这都做不好"。',
            judge: '领导的话是在描述某件事没做好，还是在对你整个人下结论？这两者不同。',
            friend: '同事给你递眼色，说明他们看到了领导的苛刻。先别急着否定自己。',
            anx: 65, tag: '激动',
            fact: '事实：同事主动给眼色',
            cog: '认知偏差：以偏概全（一次批评 = 整体否定）'
        },
        {
            user: '之前完成过一个项目，那时候领导还夸过我……',
            judge: '既然你有成功经历，那"一点用都没有"是事实，还是情绪？',
            friend: '你看，你是有能力的。今天能说出来，就是在面对它。',
            anx: 40, tag: '舒缓',
            fact: '事实：曾完成大项目并获认可',
            cog: '认知偏差：选择性忽略积极证据'
        }
    ];

    let step = 0;

    function renderEmotion(anx, tag) {
        state.anx = anx;
        const bar = document.getElementById('anxBar');
        const val = document.getElementById('anxVal');
        const t = document.getElementById('emTag');
        bar.style.width = anx + '%';
        val.textContent = anx + '%';
        t.textContent = tag;
        const calm = tag === '舒缓' || tag === '平静';
        bar.classList.toggle('calm', calm);
        t.classList.toggle('calm', calm);
    }

    function addMsg(containerId, sender, text) {
        const c = document.getElementById(containerId);
        const wrap = document.createElement('div');
        wrap.className = 'msg ' + (sender === '你' ? 'user' : 'agent');
        wrap.innerHTML = `<div class="msg-sender">${sender}</div><div>${text}</div>`;
        c.appendChild(wrap);
        c.scrollTop = c.scrollHeight;
    }

    function showTyping(containerId) {
        const c = document.getElementById(containerId);
        const t = document.createElement('div');
        t.className = 'typing';
        t.id = containerId + '-typing';
        c.appendChild(t);
        c.scrollTop = c.scrollHeight;
    }
    function hideTyping(containerId) {
        const t = document.getElementById(containerId + '-typing');
        if (t) t.remove();
    }

    function addTreeItem(type, content) {
        const list = document.getElementById('treeList');
        if (list.querySelector('.tree-empty')) list.innerHTML = '';
        const el = document.createElement('div');
        el.className = 'tree-item ' + (type === 'fact' ? 'fact' : 'cog');
        el.innerHTML = `<div class="tree-tag">${type === 'fact' ? '客观事实' : '认知偏差'}</div><div>${content}</div>`;
        list.appendChild(el);
    }

    function runStep() {
        if (step >= script.length) {
            document.getElementById('topStatus').textContent = '对话结束';
            return;
        }
        const s = script[step];
        document.getElementById('topStatus').textContent = '进行中 · 第 ' + (step + 1) + '/' + script.length + ' 轮';

        addMsg('judgeChat', '你', s.user);
        addMsg('friendChat', '你', s.user);
        renderEmotion(s.anx, s.tag);

        setTimeout(() => {
            showTyping('judgeChat');
            showTyping('friendChat');
        }, 600);

        setTimeout(() => {
            hideTyping('judgeChat');
            hideTyping('friendChat');
            addMsg('judgeChat', '法官', s.judge);
            addMsg('friendChat', '闺蜜', s.friend);
            addTreeItem(s.fact.includes('事实') ? 'fact' : 'cog', s.fact);
            addTreeItem(s.cog.includes('偏差') ? 'cog' : 'fact', s.cog);
            step++;
            setTimeout(runStep, 2200);
        }, 1800);
    }

    // 用户手动输入
    function send() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        addMsg('judgeChat', '你', text);
        addMsg('friendChat', '你', text);
        document.getElementById('topStatus').textContent = '已发送';
        setTimeout(() => {
            const j = ['你提到的这个情况，有没有客观证据？', '这是事实，还是你的情绪推断？', '其他可能的解释是什么？'];
            const f = ['我理解你很难受。之前有类似的经历吗？', '如果是你的好朋友遇到这事，你会怎么安慰他？', '今天能说出来，本身就是进步。'];
            addMsg('judgeChat', '法官', j[Math.floor(Math.random() * j.length)]);
            addMsg('friendChat', '闺蜜', f[Math.floor(Math.random() * f.length)]);
        }, 1000);
    }

    document.getElementById('userInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') send();
    });

    // 自动开跑
    setTimeout(runStep, 500);
</script>
</body>
</html>
