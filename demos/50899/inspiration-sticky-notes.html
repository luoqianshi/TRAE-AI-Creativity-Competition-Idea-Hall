<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感便利贴 - Inspiration Sticky Notes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e8e4dc;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255, 200, 200, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(200, 220, 255, 0.3) 0%, transparent 50%),
                linear-gradient(135deg, #f0ebe3 0%, #e0d8cc 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 29px, rgba(200, 190, 180, 0.2) 29px, rgba(200, 190, 180, 0.2) 30px),
                repeating-linear-gradient(90deg, transparent, transparent 29px, rgba(200, 190, 180, 0.15) 29px, rgba(200, 190, 180, 0.15) 30px);
            pointer-events: none;
        }

        .toolbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .toolbar-title {
            display: flex;
            align-items: center;
            font-weight: 600;
            color: #6b5b4f;
            font-size: 1rem;
            margin-right: 10px;
        }

        .color-btn {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .color-btn:hover {
            transform: scale(1.15);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .color-btn.active::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 14px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .add-btn {
            padding: 6px 16px;
            background: #6b5b4f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s, transform 0.2s;
            margin-left: 10px;
        }

        .add-btn:hover {
            background: #8b7b6f;
            transform: translateY(-1px);
        }

        .clear-btn {
            padding: 6px 12px;
            background: transparent;
            color: #999;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            color: #e74c3c;
            border-color: #e74c3c;
        }

        .counter {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            color: #999;
            margin-left: 10px;
            padding-left: 15px;
            border-left: 1px solid #e0e0e0;
        }

        .sticky-note {
            position: absolute;
            width: 220px;
            min-height: 200px;
            padding: 20px 15px 40px 15px;
            cursor: grab;
            box-shadow: 
                2px 2px 8px rgba(0, 0, 0, 0.1),
                0 8px 20px rgba(0, 0, 0, 0.08);
            transition: transform 0.15s, box-shadow 0.15s;
            user-select: none;
            z-index: 1;
        }

        .sticky-note:hover {
            box-shadow: 
                4px 4px 12px rgba(0, 0, 0, 0.15),
                0 12px 30px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .sticky-note.dragging {
            cursor: grabbing;
            transform: rotate(2deg) scale(1.02);
            box-shadow: 
                8px 8px 20px rgba(0, 0, 0, 0.2),
                0 20px 40px rgba(0, 0, 0, 0.15);
            z-index: 100;
        }

        .sticky-note::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: rgba(0, 0, 0, 0.05);
        }

        .sticky-note::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 0 25px 25px;
            border-color: transparent transparent rgba(0, 0, 0, 0.1) transparent;
        }

        .note-content {
            width: 100%;
            height: calc(100% - 30px);
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            font-family: 'KaiTi', 'STKaiti', 'Segoe UI', Tahoma, sans-serif;
            font-size: 1rem;
            line-height: 1.6;
            color: #5a4a3f;
            cursor: text;
        }

        .note-content::placeholder {
            color: rgba(90, 74, 63, 0.4);
        }

        .note-delete {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 22px;
            height: 22px;
            background: rgba(0, 0, 0, 0.1);
            border: none;
            border-radius: 50%;
            color: #666;
            font-size: 14px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sticky-note:hover .note-delete {
            opacity: 1;
        }

        .note-delete:hover {
            background: rgba(231, 76, 60, 0.8);
            color: white;
        }

        .note-date {
            position: absolute;
            bottom: 10px;
            left: 15px;
            right: 15px;
            font-size: 0.7rem;
            color: rgba(90, 74, 63, 0.5);
            text-align: right;
            font-style: italic;
        }

        .hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #999;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="toolbar-title">📝 灵感便利贴</div>
        <button class="color-btn active" style="background: #ffeaa7;" data-color="#ffeaa7" title="奶油黄"></button>
        <button class="color-btn" style="background: #fab1a0;" data-color="#fab1a0" title="蜜桃粉"></button>
        <button class="color-btn" style="background: #a29bfe;" data-color="#a29bfe" title="香芋紫"></button>
        <button class="color-btn" style="background: #81ecec;" data-color="#81ecec" title="薄荷蓝"></button>
        <button class="color-btn" style="background: #55efc4;" data-color="#55efc4" title="抹茶绿"></button>
        <button class="color-btn" style="background: #fd79a8;" data-color="#fd79a8" title="樱花粉"></button>
        <button class="add-btn" id="addNoteBtn">+ 新建</button>
        <button class="clear-btn" id="clearBtn">清空</button>
        <div class="counter">
            <span id="noteCount">0</span> 张
        </div>
    </div>

    <div class="hint">
        💡 点击「新建」添加便利贴，拖拽移动位置，自动保存
    </div>

    <script>
        const STORAGE_KEY = 'inspiration_sticky_notes';
        let notes = [];
        let selectedColor = '#ffeaa7';
        let zIndexCounter = 10;

        const colorButtons = document.querySelectorAll('.color-btn');
        const addNoteBtn = document.getElementById('addNoteBtn');
        const clearBtn = document.getElementById('clearBtn');
        const noteCountEl = document.getElementById('noteCount');

        colorButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                colorButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedColor = btn.dataset.color;
            });
        });

        function loadNotes() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    notes = JSON.parse(saved);
                } catch (e) {
                    notes = [];
                }
            }
            renderNotes();
            updateCount();
        }

        function saveNotes() {
            const noteData = notes.map(note => ({
                id: note.id,
                x: note.x,
                y: note.y,
                content: note.content,
                color: note.color,
                date: note.date,
                rotation: note.rotation
            }));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(noteData));
            updateCount();
        }

        function updateCount() {
            noteCountEl.textContent = notes.length;
        }

        function renderNotes() {
            document.querySelectorAll('.sticky-note').forEach(el => el.remove());
            notes.forEach(note => createNoteElement(note));
        }

        function createNoteElement(note) {
            const noteEl = document.createElement('div');
            noteEl.className = 'sticky-note';
            noteEl.style.left = note.x + 'px';
            noteEl.style.top = note.y + 'px';
            noteEl.style.background = note.color;
            noteEl.style.transform = `rotate(${note.rotation}deg)`;
            noteEl.dataset.id = note.id;
            noteEl.style.zIndex = ++zIndexCounter;

            noteEl.innerHTML = `
                <button class="note-delete" title="删除">×</button>
                <textarea class="note-content" placeholder="写下你的灵感..."></textarea>
                <div class="note-date"></div>
            `;

            const textarea = noteEl.querySelector('.note-content');
            textarea.value = note.content;

            const dateEl = noteEl.querySelector('.note-date');
            dateEl.textContent = formatDate(note.date);

            document.body.appendChild(noteEl);

            let isDragging = false;
            let startX, startY, noteStartX, noteStartY;

            noteEl.addEventListener('mousedown', (e) => {
                if (e.target.classList.contains('note-content') || 
                    e.target.classList.contains('note-delete')) return;
                
                isDragging = true;
                noteEl.classList.add('dragging');
                noteEl.style.zIndex = ++zIndexCounter;
                
                startX = e.clientX;
                startY = e.clientY;
                noteStartX = parseFloat(noteEl.style.left);
                noteStartY = parseFloat(noteEl.style.top);

                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;

                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                noteEl.style.left = (noteStartX + dx) + 'px';
                noteEl.style.top = (noteStartY + dy) + 'px';
            });

            document.addEventListener('mouseup', () => {
                if (!isDragging) return;
                isDragging = false;
                noteEl.classList.remove('dragging');

                note.x = parseFloat(noteEl.style.left);
                note.y = parseFloat(noteEl.style.top);
                saveNotes();
            });

            textarea.addEventListener('input', () => {
                note.content = textarea.value;
                saveNotes();
            });

            noteEl.querySelector('.note-delete').addEventListener('click', (e) => {
                e.stopPropagation();
                if (confirm('确定删除这张便利贴吗？')) {
                    notes = notes.filter(n => n.id !== note.id);
                    noteEl.remove();
                    saveNotes();
                }
            });
        }

        function addNote() {
            const newNote = {
                id: Date.now(),
                x: 100 + Math.random() * 200,
                y: 100 + Math.random() * 150,
                content: '',
                color: selectedColor,
                date: new Date().toISOString(),
                rotation: (Math.random() - 0.5) * 6
            };

            notes.push(newNote);
            createNoteElement(newNote);
            saveNotes();

            setTimeout(() => {
                const noteEl = document.querySelector(`[data-id="${newNote.id}"] .note-content`);
                if (noteEl) noteEl.focus();
            }, 100);
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const hours = date.getHours().toString().padStart(2, '0');
            const mins = date.getMinutes().toString().padStart(2, '0');
            return `${month}月${day}日 ${hours}:${mins}`;
        }

        addNoteBtn.addEventListener('click', addNote);

        clearBtn.addEventListener('click', () => {
            if (notes.length === 0) return;
            if (confirm('确定清空所有便利贴吗？此操作不可撤销。')) {
                notes = [];
                document.querySelectorAll('.sticky-note').forEach(el => el.remove());
                saveNotes();
            }
        });

        loadNotes();

        if (notes.length === 0) {
            setTimeout(() => {
                const demoNotes = [
                    { content: '欢迎来到灵感便利贴！\n\n把你的想法写在便利贴上吧 ✨', color: '#ffeaa7' },
                    { content: '💡 头脑风暴\n- 想法一\n- 想法二\n- 想法三', color: '#fab1a0' },
                    { content: '📚 今日学习重点\n\n1. 复习笔记\n2. 整理思路\n3. 规划明天', color: '#a29bfe' }
                ];
                demoNotes.forEach((demo, index) => {
                    setTimeout(() => {
                        selectedColor = demo.color;
                        addNote();
                        const note = notes[notes.length - 1];
                        note.content = demo.content;
                        note.x = 80 + index * 250;
                        note.y = 120 + index * 30;
                        saveNotes();
                        renderNotes();
                    }, index * 200);
                });
            }, 300);
        }
    </script>
</body>
</html>
