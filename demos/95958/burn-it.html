<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>把烦恼烧掉 · Burn It</title>
<style>
  :root{
    --bg-0:#0b0a0f;
    --bg-1:#16121a;
    --ink:#2c2622;
    --paper:#f6efe0;
    --paper-line:#e7dcc6;
    --paper-margin:#d98c8c;
    --warm:#ff9d4d;
    --warm-2:#ff6b3d;
    --text:#f3ece2;
    --muted:#a99fb0;
    --accent:#ffb86b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,system-ui,sans-serif;
    color:var(--text);
    background:
      radial-gradient(120% 80% at 50% 8%, #241a26 0%, var(--bg-1) 45%, var(--bg-0) 100%);
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 14px 40px;
    overflow-x:hidden;
  }
  header{text-align:center;margin:4px 0 14px}
  header h1{
    font-size:clamp(22px,5vw,30px);
    margin:0;
    letter-spacing:.04em;
    font-weight:700;
    background:linear-gradient(90deg,#ffd9a8,#ff9d4d 60%,#ff6b3d);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header p{margin:6px 0 0;color:var(--muted);font-size:13px;letter-spacing:.02em}

  .stage{
    position:relative;
    width:100%;
    max-width:640px;
    height:clamp(420px,66vh,660px);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 30px 80px -30px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.04);
    background:#0d0b10;
    touch-action:none;
  }
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* 信纸上的输入框（编辑态覆盖在信纸位置） */
  #letterInput{
    position:absolute;
    border:none;
    outline:none;
    resize:none;
    background:transparent;
    color:var(--ink);
    font-family:"Xingkai SC","STKaiti","KaiTi","楷体","Kaiti SC",cursive,serif;
    line-height:1.9;
    overflow:hidden;
    caret-color:var(--paper-margin);
    z-index:5;
  }
  #letterInput::placeholder{color:#b9ad97;opacity:.9}

  /* 控制区 */
  .controls{width:100%;max-width:640px;margin-top:16px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button{
    font:inherit;font-size:15px;font-weight:600;
    color:#1a1208;
    border:none;border-radius:12px;
    padding:12px 18px;cursor:pointer;
    background:linear-gradient(180deg,#ffce8a,#ff9d4d);
    box-shadow:0 8px 22px -8px rgba(255,140,60,.7);
    transition:transform .12s ease,filter .12s ease,opacity .2s;
  }
  button:hover{filter:brightness(1.05)}
  button:active{transform:translateY(1px) scale(.99)}
  button.ghost{
    background:rgba(255,255,255,.06);color:var(--text);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
  }
  button:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.4)}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .hint{
    text-align:center;color:var(--muted);font-size:13px;min-height:18px;
    transition:opacity .3s;
  }
  .toggle{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--warm)}

  /* 火柴 */
  .match{
    position:absolute;left:24px;bottom:18px;width:14px;height:120px;
    z-index:6;cursor:grab;touch-action:none;
    transform-origin:bottom center;
  }
  .match .stick{position:absolute;left:5px;top:18px;width:4px;height:102px;background:linear-gradient(180deg,#caa46a,#8a6a3c);border-radius:2px}
  .match .head{position:absolute;left:1px;top:0;width:12px;height:20px;border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 40% 35%,#b23a2a,#6e1f15)}
  .match .flame{position:absolute;left:-3px;top:-26px;font-size:30px;opacity:0;transform:translateY(4px) scale(.6);transition:opacity .25s,transform .25s;filter:drop-shadow(0 0 10px rgba(255,150,60,.9))}
  .match.lit{animation:sway 1.6s ease-in-out infinite}
  .match.lit .flame{opacity:1;transform:translateY(0) scale(1)}
  .match.lit .head{background:radial-gradient(circle at 40% 35%,#ffd27a,#ff7a2a)}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .strike{
    position:absolute;left:50px;bottom:30px;width:60px;height:26px;z-index:6;
    border-radius:6px;background:linear-gradient(180deg,#3a2a1c,#241812);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
    display:flex;align-items:center;justify-content:center;
    color:#caa46a;font-size:11px;letter-spacing:.2em;user-select:none;
  }

  /* 烧尽后的暖话浮层 */
  .overlay{
    position:absolute;inset:0;z-index:8;display:none;
    align-items:center;justify-content:center;flex-direction:column;
    padding:26px;text-align:center;
    background:radial-gradient(80% 60% at 50% 45%,rgba(20,14,18,.2),rgba(8,6,10,.78));
    opacity:0;transition:opacity .9s ease;
  }
  .overlay.show{display:flex;opacity:1}
  .overlay .msg{
    font-size:clamp(18px,4.4vw,24px);line-height:1.7;font-weight:600;
    color:#ffe9cf;max-width:520px;
    text-shadow:0 2px 18px rgba(255,140,60,.25);
    animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .overlay .sub{margin-top:14px;color:var(--muted);font-size:13px;letter-spacing:.04em}

  .badge{position:absolute;top:12px;right:12px;z-index:7;font-size:11px;color:var(--muted);
    background:rgba(0,0,0,.35);padding:5px 9px;border-radius:20px;backdrop-filter:blur(4px)}
  @media (prefers-reduced-motion: reduce){
    .match.lit{animation:none}
  }
</style>
</head>
<body>
  <header>
    <h1>把烦恼烧掉 · Burn It</h1>
    <p>写下压着你的事，划一根火柴，看它成灰。</p>
  </header>

  <div class="stage" id="stage">
    <canvas id="scene"></canvas>
    <textarea id="letterInput" maxlength="160" placeholder="在这里写下你的烦恼…&#10;（会议、委屈、焦虑，都行）" aria-label="写下你的烦恼"></textarea>

    <div class="match" id="match" role="button" tabindex="0" aria-label="火柴，可拖动到磷面上划燃">
      <div class="flame">🔥</div>
      <div class="head"></div>
      <div class="stick"></div>
    </div>
    <div class="strike" id="strike">划</div>

    <div class="overlay" id="overlay" aria-live="polite">
      <div class="msg" id="overlayMsg"></div>
      <div class="sub">风会带走灰，也会带走沉重。</div>
    </div>

    <div class="badge" id="badge">就绪</div>
  </div>

  <div class="controls">
    <div class="hint" id="hint">在信纸上写下你的烦恼，然后划燃火柴。</div>
    <div class="row">
      <button id="doneBtn">写好了，去烧掉</button>
      <button id="relightBtn" class="ghost" disabled>直接点燃</button>
    </div>
    <div class="row">
      <button id="againBtn" class="ghost" disabled>再写一张</button>
      <button id="shareBtn" class="ghost" disabled>📸 保存分享卡</button>
      <button id="recBtn" class="ghost" disabled>🎥 保存录屏</button>
    </div>
    <div class="row">
      <label class="toggle"><input type="checkbox" id="recToggle" /> 燃烧时自动录制过程</label>
      <label class="toggle"><input type="checkbox" id="soundToggle" /> 🔊 火焰声</label>
    </div>
  </div>

<script>
(() => {
  "use strict";
  const cv = document.getElementById('scene');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  const input = document.getElementById('letterInput');
  const matchEl = document.getElementById('match');
  const strikeEl = document.getElementById('strike');
  const overlay = document.getElementById('overlay');
  const overlayMsg = document.getElementById('overlayMsg');
  const hint = document.getElementById('hint');
  const badge = document.getElementById('badge');
  const doneBtn = document.getElementById('doneBtn');
  const relightBtn = document.getElementById('relightBtn');
  const againBtn = document.getElementById('againBtn');
  const shareBtn = document.getElementById('shareBtn');
  const recBtn = document.getElementById('recBtn');
  const recToggle = document.getElementById('recToggle');
  const soundToggle = document.getElementById('soundToggle');

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- 状态 ----------
  const S = {
    mode: 'editing',        // editing | ready | burning | done
    text: '',
    dpr: 1,
    W: 0, H: 0,             // CSS 像素尺寸
    paper: {x:0,y:0,w:0,h:0},
    burn: 0,                // 0..1 燃烧进度（从底部向上）
    lit: false,             // 火柴是否点燃
    matchReturning: false,
    recorder: null, chunks: [], recorded: false,
  };

  const flames = [];
  const embers = [];
  const ash = [];

  const gentleMsgs = [
    "它已经不在了。深呼吸，这一刻只属于你。",
    "烧掉了，就让它真的过去吧。",
    "你比自己以为的，要轻一些了。",
    "烦恼是燃料，你已经把它变成了光。",
    "明天的事，留给明天。今晚你是自由的。",
    "那些压着你的，现在只剩一捧灰。",
    "允许自己脆弱，也允许自己放下。",
    "风会带走灰，也会带走沉重。",
  ];

  // ---------- 噪声（用于火舌边缘的有机抖动） ----------
  function wiggle(x, t){
    return 7*Math.sin(x*0.045 + t*2.1)
         + 4.5*Math.sin(x*0.11 - t*3.0)
         + 2.5*Math.sin(x*0.21 + t*1.4);
  }

  // ---------- 布局 ----------
  function layout(){
    const r = stage.getBoundingClientRect();
    S.dpr = Math.min(window.devicePixelRatio || 1, 2);
    S.W = r.width; S.H = r.height;
    cv.width = Math.round(S.W * S.dpr);
    cv.height = Math.round(S.H * S.dpr);
    ctx.setTransform(S.dpr,0,0,S.dpr,0,0);

    const pad = Math.max(26, S.W*0.06);
    S.paper = { x:pad, y:pad, w:S.W-pad*2, h:S.H-pad*2 };

    // 输入框对齐到信纸文字区域
    const insetX = S.paper.w*0.10, insetY = S.paper.h*0.12;
    input.style.left = (S.paper.x + insetX) + 'px';
    input.style.top  = (S.paper.y + insetY) + 'px';
    input.style.width = (S.paper.w - insetX*2) + 'px';
    input.style.height = (S.paper.h - insetY*1.4) + 'px';
    const fs = Math.max(17, Math.min(23, S.paper.w*0.045));
    input.style.fontSize = fs + 'px';
    input.style.lineHeight = (fs*1.9) + 'px';
  }

  // ---------- 文本换行（中英文混合） ----------
  function wrapText(text, maxW, fs){
    ctx.font = fs+'px "Xingkai SC","STKaiti","KaiTi","楷体",cursive,serif';
    const lines = [];
    const paragraphs = text.split('\n');
    for(const para of paragraphs){
      if(para === ''){ lines.push(''); continue; }
      let line = '';
      for(const ch of para){
        const test = line + ch;
        if(ctx.measureText(test).width > maxW && line){
          lines.push(line); line = ch;
        } else line = test;
      }
      lines.push(line);
    }
    return lines;
  }

  // ---------- 背景（暖色烛光氛围） ----------
  function drawBackground(t, glow){
    const g = ctx.createRadialGradient(S.W/2, S.H*0.62, 40, S.W/2, S.H*0.55, Math.max(S.W,S.H)*0.75);
    const a = 0.10 + glow*0.10;
    g.addColorStop(0, `rgba(255,150,70,${a})`);
    g.addColorStop(0.4, 'rgba(40,26,30,0.0)');
    g.addColorStop(1, 'rgba(0,0,0,0.0)');
    ctx.fillStyle = '#0d0b10';
    ctx.fillRect(0,0,S.W,S.H);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,S.W,S.H);
    // 暗角
    const v = ctx.createRadialGradient(S.W/2,S.H/2,S.H*0.3,S.W/2,S.H/2,S.H*0.8);
    v.addColorStop(0,'rgba(0,0,0,0)');
    v.addColorStop(1,'rgba(0,0,0,0.55)');
    ctx.fillStyle = v;
    ctx.fillRect(0,0,S.W,S.H);
  }

  // ---------- 信纸 ----------
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawLetter(text, fs){
    const p = S.paper;
    ctx.save();
    // 纸张阴影
    ctx.shadowColor='rgba(0,0,0,0.45)';
    ctx.shadowBlur=28; ctx.shadowOffsetY=10;
    roundRect(p.x,p.y,p.w,p.h,10);
    ctx.fillStyle='#f6efe0';
    ctx.fill();
    ctx.restore();

    // 横线
    ctx.save();
    roundRect(p.x,p.y,p.w,p.h,10); ctx.clip();
    ctx.strokeStyle='rgba(180,165,135,0.5)';
    ctx.lineWidth=1;
    const lh = fs*1.9;
    const startY = p.y + p.h*0.12 + lh*0.7;
    for(let y=startY; y<p.y+p.h-10; y+=lh){
      ctx.beginPath();
      ctx.moveTo(p.x+10,y);
      ctx.lineTo(p.x+p.w-10,y);
      ctx.stroke();
    }
    // 红色边距线
    ctx.strokeStyle='rgba(217,140,140,0.7)';
    ctx.beginPath();
    ctx.moveTo(p.x+p.w*0.10, p.y+8);
    ctx.lineTo(p.x+p.w*0.10, p.y+p.h-8);
    ctx.stroke();
    ctx.restore();

    // 文字
    if(text){
      const insetX = p.w*0.10;
      const maxW = p.w - insetX*2;
      const lines = wrapText(text, maxW, fs);
      ctx.fillStyle='#2c2622';
      ctx.textBaseline='alphabetic';
      ctx.font = fs+'px "Xingkai SC","STKaiti","KaiTi","楷体",cursive,serif';
      let y = p.y + p.h*0.12 + lh*0.95;
      for(const ln of lines){
        ctx.fillText(ln, p.x+insetX, y);
        y += lh;
        if(y > p.y+p.h-14) break;
      }
    }
  }

  // 火舌边缘的 y（带抖动）
  function frontYat(x, baseY, t, amp){
    return baseY + wiggle(x, t) * amp;
  }

  // ---------- 燃烧绘制 ----------
  function drawBurn(t){
    const p = S.paper;
    const prog = S.burn;
    const baseFront = p.y + p.h - prog * p.h;   // 火舌基线，从底向上
    const step = 7;
    const amp = reduceMotion ? 0.4 : 1;

    // 1) 未烧到的部分（信纸+文字），裁剪到火舌上方
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x, frontYat(p.x, baseFront, t, amp));
    for(let x=p.x; x<=p.x+p.w; x+=step){
      ctx.lineTo(x, frontYat(x, baseFront, t, amp));
    }
    ctx.lineTo(p.x+p.w, p.y);
    ctx.closePath();
    ctx.clip();
    drawLetter(S.text, Math.max(17, Math.min(23, p.w*0.045)));
    ctx.restore();

    // 2) 正在燃烧的发光带
    const bandH = reduceMotion ? 10 : 22;
    ctx.save();
    ctx.beginPath();
    for(let x=p.x; x<=p.x+p.w; x+=step){
      const y = frontYat(x, baseFront, t, amp);
      if(x===p.x) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    for(let x=p.x+p.w; x>=p.x; x-=step){
      ctx.lineTo(x, frontYat(x, baseFront, t, amp)+bandH);
    }
    ctx.closePath();
    const fg = ctx.createLinearGradient(0, baseFront-4, 0, baseFront+bandH);
    const f = 0.6 + 0.4*Math.sin(t*9);
    fg.addColorStop(0, `rgba(255,238,170,${0.95*f})`);
    fg.addColorStop(0.35, `rgba(255,150,50,0.9)`);
    fg.addColorStop(1, `rgba(120,30,10,0.0)`);
    ctx.fillStyle = fg;
    ctx.fill();
    ctx.restore();

    // 3) 已烧成焦痕/灰烬的部分（向下渐隐为透明）
    ctx.save();
    ctx.beginPath();
    for(let x=p.x; x<=p.x+p.w; x+=step){
      const y = frontYat(x, baseFront, t, amp)+bandH;
      if(x===p.x) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.lineTo(p.x+p.w, p.y+p.h);
    ctx.lineTo(p.x, p.y+p.h);
    ctx.closePath();
    const cg = ctx.createLinearGradient(0, baseFront+bandH, 0, p.y+p.h);
    cg.addColorStop(0, 'rgba(20,12,10,0.85)');
    cg.addColorStop(0.5, 'rgba(35,28,26,0.35)');
    cg.addColorStop(1, 'rgba(35,28,26,0.0)');
    ctx.fillStyle = cg;
    ctx.fill();
    ctx.restore();

    // 4) 火焰粒子（加色混合发光）
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for(const fl of flames){
      const r = fl.r;
      const g2 = ctx.createRadialGradient(fl.x, fl.y, 0, fl.x, fl.y, r);
      g2.addColorStop(0, `rgba(255,240,200,${fl.a})`);
      g2.addColorStop(0.4, `rgba(255,150,50,${fl.a*0.8})`);
      g2.addColorStop(1, 'rgba(255,80,20,0)');
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.arc(fl.x, fl.y, r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();

    // 5) 余烬与灰
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for(const e of embers){
      ctx.fillStyle = `rgba(255,${160+Math.random()*60|0},80,${e.a})`;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
    ctx.save();
    for(const a of ash){
      ctx.fillStyle = `rgba(60,55,52,${a.a})`;
      ctx.beginPath();
      ctx.arc(a.x, a.y, a.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  // ---------- 粒子生成 ----------
  function spawnParticles(dt, t){
    const p = S.paper;
    const baseFront = p.y + p.h - S.burn * p.h;
    const amp = reduceMotion ? 0.4 : 1;
    const rate = reduceMotion ? 60 : 220; // 每秒生成的火焰数
    let n = rate * dt;
    while(n-- > 0){
      const x = p.x + Math.random()*p.w;
      const fy = frontYat(x, baseFront, t, amp);
      flames.push({
        x: x + (Math.random()-0.5)*6,
        y: fy - Math.random()*4,
        vx: (Math.random()-0.5)*16,
        vy: -(26 + Math.random()*54),
        r: 5 + Math.random()*12,
        life: 0, max: 0.5 + Math.random()*0.7,
        a: 0.5 + Math.random()*0.4,
      });
    }
    if(Math.random() < (reduceMotion?0.3:0.9)){
      const x = p.x + Math.random()*p.w;
      const fy = frontYat(x, baseFront, t, amp);
      embers.push({
        x, y: fy, vx:(Math.random()-0.5)*22, vy:-(40+Math.random()*70),
        r: 0.8+Math.random()*1.6, life:0, max:0.8+Math.random()*1.2, a:0.9,
      });
    }
    if(Math.random() < 0.5){
      ash.push({ x:p.x+Math.random()*p.w, y:baseFront+10+Math.random()*20,
        vx:(Math.random()-0.5)*8, vy:14+Math.random()*22,
        r:1+Math.random()*2.5, life:0, max:1.2+Math.random(), a:0.4 });
    }
  }

  function updateParticles(dt){
    for(let i=flames.length-1;i>=0;i--){
      const f=flames[i];
      f.life+=dt; f.x+=f.vx*dt; f.y+=f.vy*dt; f.vy*=0.98; f.r*=1.01;
      f.a = Math.max(0, f.a * (1 - f.life/f.max));
      if(f.life>=f.max) flames.splice(i,1);
    }
    for(let i=embers.length-1;i>=0;i--){
      const e=embers[i];
      e.life+=dt; e.x+=e.vx*dt; e.y+=e.vy*dt; e.vy+=18*dt; e.vx+=(Math.random()-0.5)*8*dt;
      e.a=Math.max(0,0.9*(1-e.life/e.max));
      if(e.life>=e.max) embers.splice(i,1);
    }
    for(let i=ash.length-1;i>=0;i--){
      const a=ash[i];
      a.life+=dt; a.x+=a.vx*dt; a.y+=a.vy*dt; a.vy+=10*dt;
      a.a=Math.max(0,0.4*(1-a.life/a.max));
      if(a.life>=a.max) ash.splice(i,1);
    }
  }

  // ---------- 主循环 ----------
  let last = performance.now();
  let burnDur = reduceMotion ? 4.5 : 7.5; // 秒
  function frame(now){
    const dt = Math.min(0.05, (now-last)/1000);
    last = now;
    const t = now/1000;

    drawBackground(t, S.mode==='burning' ? 0.6 : 0.15);

    if(S.mode==='editing' || S.mode==='ready'){
      // 信纸+文字/占位
      if(S.mode==='ready') drawLetter(S.text, Math.max(17, Math.min(23, S.paper.w*0.045)));
      else {
        // 编辑态：只画纸，文字由 textarea 显示
        drawLetter('', Math.max(17, Math.min(23, S.paper.w*0.045)));
      }
    } else if(S.mode==='burning'){
      S.burn = Math.min(1, S.burn + dt/burnDur);
      spawnParticles(dt, t);
      updateParticles(dt);
      drawBurn(t);
      if(S.burn>=1){
        S.mode='done';
        finishBurn();
      }
    } else if(S.mode==='done'){
      // 灰烬缓缓飘散
      updateParticles(dt);
      drawBackground(t, 0.25);
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      for(const e of embers){ ctx.fillStyle=`rgba(255,160,80,${e.a})`; ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- 火焰声（WebAudio，无需权限） ----------
  let audioCtx=null, noiseNode=null, soundGain=null, soundOn=false;
  function startSound(){
    try{
      if(!audioCtx){
        audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        const bufSize = 2*audioCtx.sampleRate;
        const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for(let i=0;i<bufSize;i++) d[i]=(Math.random()*2-1)*0.5;
        noiseNode = audioCtx.createBufferSource();
        noiseNode.buffer = buf; noiseNode.loop = true;
        const filter = audioCtx.createBiquadFilter();
        filter.type='lowpass'; filter.frequency.value=900;
        soundGain = audioCtx.createGain(); soundGain.gain.value=0.0;
        noiseNode.connect(filter); filter.connect(soundGain); soundGain.connect(audioCtx.destination);
        noiseNode.start();
      }
      audioCtx.resume();
      soundGain.gain.setTargetAtTime(0.06, audioCtx.currentTime, 0.3);
      soundOn=true;
    }catch(e){ /* 忽略音频失败 */ }
  }
  function stopSound(){
    if(soundGain&&audioCtx) soundGain.gain.setTargetAtTime(0.0, audioCtx.currentTime, 0.2);
    soundOn=false;
  }

  // ---------- 录屏 ----------
  function startRecording(){
    if(!recToggle.checked) return;
    if(!cv.captureStream || !window.MediaRecorder){
      recToggle.checked=false; return;
    }
    try{
      const stream = cv.captureStream(30);
      const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9'
                 : MediaRecorder.isTypeSupported('video/webm') ? 'video/webm' : '';
      S.recorder = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream);
      S.chunks=[];
      S.recorder.ondataavailable = e => { if(e.data.size) S.chunks.push(e.data); };
      S.recorder.onstop = () => {
        if(S.chunks.length){
          S.recorded = true;
          recBtn.disabled = false;
          badge.textContent = '已录好';
        }
      };
      S.recorder.start();
    }catch(e){ /* 不支持则静默 */ }
  }
  function stopRecording(){
    if(S.recorder && S.recorder.state!=='inactive'){
      try{ S.recorder.stop(); }catch(e){}
    }
  }

  // ---------- 流程控制 ----------
  function commitText(){
    S.text = input.value.trim();
    if(!S.text){ hint.textContent='先写点什么吧，哪怕一句也行。'; input.focus(); return; }
    input.style.display='none';
    S.mode='ready';
    doneBtn.disabled=true;
    relightBtn.disabled=false;
    matchEl.style.display='block';
    strikeEl.style.display='block';
    hint.textContent = S.lit ? '把火苗移到信纸上，点一下点燃它。' : '拖动火柴在磷面上划燃，再去点燃信纸。';
    badge.textContent='待点燃';
  }

  function ignite(){
    if(S.mode!=='ready' || S.lit) return;
    S.lit = true;
    matchEl.classList.add('lit');
    hint.textContent='把火苗移到信纸上，点一下点燃它。';
    if(soundToggle.checked) startSound();
  }

  function startBurn(){
    if(S.mode!=='ready') return;
    S.mode='burning';
    S.burn=0;
    matchEl.style.display='none';
    strikeEl.style.display='none';
    relightBtn.disabled=true;
    hint.textContent='看着它烧成灰…';
    badge.textContent='燃烧中';
    if(soundToggle.checked) startSound();
    startRecording();
  }

  function finishBurn(){
    stopRecording();
    if(soundToggle.checked) setTimeout(stopSound, 1500);
    const msg = gentleMsgs[Math.floor(Math.random()*gentleMsgs.length)];
    overlayMsg.textContent = msg;
    overlay.classList.add('show');
    againBtn.disabled=false;
    shareBtn.disabled=false;
    recBtn.disabled = !S.recorded;
    hint.textContent='烧掉了。要不要留个纪念？';
    badge.textContent='已成灰';
  }

  function reset(){
    S.mode='editing'; S.text=''; S.burn=0; S.lit=false; S.recorded=false;
    S.matchReturning=false;
    flames.length=0; embers.length=0; ash.length=0;
    input.value=''; input.style.display='block'; input.focus();
    matchEl.classList.remove('lit'); matchEl.style.display='none';
    strikeEl.style.display='none';
    overlay.classList.remove('show');
    doneBtn.disabled=false; relightBtn.disabled=true;
    againBtn.disabled=true; shareBtn.disabled=true; recBtn.disabled=true;
    hint.textContent='在信纸上写下你的烦恼，然后划燃火柴。';
    badge.textContent='就绪';
  }

  // ---------- 火柴交互 ----------
  let dragging=false, dragOffX=0, dragOffY=0;
  function matchCenter(){
    const r = matchEl.getBoundingClientRect();
    return { x:r.left+r.width/2, y:r.top+r.height*0.18 };
  }
  function strikeRect(){ return strikeEl.getBoundingClientRect(); }
  function onDown(e){
    if(S.mode!=='ready') return;
    dragging=true;
    const pt = point(e);
    const mc = matchCenter();
    dragOffX = mc.x - pt.x; dragOffY = mc.y - pt.y;
    matchEl.style.cursor='grabbing';
    e.preventDefault();
  }
  function onMove(e){
    if(!dragging) return;
    const pt = point(e);
    const stageR = stage.getBoundingClientRect();
    let x = pt.x + dragOffX - stageR.left;
    let y = pt.y + dragOffY - stageR.top;
    matchEl.style.left = (x - matchEl.offsetWidth/2) + 'px';
    matchEl.style.bottom = 'auto';
    matchEl.style.top = (y - matchEl.offsetHeight*0.18) + 'px';
    // 经过磷面则点燃
    if(!S.lit){
      const sr = strikeRect();
      const mc = matchCenter();
      if(mc.x>sr.left-10 && mc.x<sr.right+10 && mc.y>sr.top-10 && mc.y<sr.bottom+10){
        ignite();
      }
    }
    e.preventDefault();
  }
  function onUp(e){
    if(!dragging) return;
    dragging=false;
    matchEl.style.cursor='grab';
    // 若已点燃且松手在信纸区域 → 点燃信纸
    if(S.lit){
      const pt = point(e);
      const p = S.paper;
      const sr = stage.getBoundingClientRect();
      const lx = pt.x - sr.left, ly = pt.y - sr.top;
      if(lx>p.x && lx<p.x+p.w && ly>p.y && ly<p.y+p.h){
        startBurn();
      }
    }
  }
  function point(e){
    const t = e.touches ? e.touches[0] : e;
    return { x:t.clientX, y:t.clientY };
  }
  matchEl.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  // 键盘可达性
  matchEl.addEventListener('keydown', e=>{
    if((e.key==='Enter'||e.key===' ')){
      e.preventDefault();
      if(!S.lit) ignite(); else startBurn();
    }
  });
  // 点击信纸点燃（已点燃时）
  cv.addEventListener('pointerdown', e=>{
    if(S.mode==='ready' && S.lit){
      const pt=point(e); const sr=stage.getBoundingClientRect();
      const lx=pt.x-sr.left, ly=pt.y-sr.top; const p=S.paper;
      if(lx>p.x&&lx<p.x+p.w&&ly>p.y&&ly<p.y+p.h) startBurn();
    }
  });

  // ---------- 按钮 ----------
  doneBtn.addEventListener('click', commitText);
  relightBtn.addEventListener('click', ()=>{ if(!S.lit) ignite(); else startBurn(); });
  againBtn.addEventListener('click', reset);

  shareBtn.addEventListener('click', ()=>{
    const firstLine = (S.text.split('\n')[0] || S.text || '今天').slice(0,16);
    const msg = overlayMsg.textContent || gentleMsgs[0];
    downloadShareCard(firstLine, msg);
  });

  recBtn.addEventListener('click', ()=>{
    if(!S.recorded || !S.chunks.length) return;
    const blob = new Blob(S.chunks, {type:'video/webm'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'burn-it.webm';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  });

  soundToggle.addEventListener('change', ()=>{
    if(soundToggle.checked && (S.mode==='burning')) startSound();
    if(!soundToggle.checked) stopSound();
  });

  // ---------- 分享卡（竖图 PNG） ----------
  function downloadShareCard(title, msg){
    const W=1080, H=1350;
    const c=document.createElement('canvas'); c.width=W; c.height=H;
    const x=c.getContext('2d');
    const bg=x.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#1a1118'); bg.addColorStop(0.6,'#120c11'); bg.addColorStop(1,'#0b080c');
    x.fillStyle=bg; x.fillRect(0,0,W,H);
    // 中央暖光
    const gl=x.createRadialGradient(W/2,H*0.42,40,W/2,H*0.42,W*0.6);
    gl.addColorStop(0,'rgba(255,140,60,0.28)'); gl.addColorStop(1,'rgba(255,140,60,0)');
    x.fillStyle=gl; x.fillRect(0,0,W,H);
    // 烧焦的信纸轮廓
    x.save();
    x.translate(W/2,H*0.40);
    x.fillStyle='rgba(40,30,26,0.6)';
    const pw=520, ph=620;
    const top=pw/2, bot=-pw/2; // 简化：画一个残缺纸片
    x.beginPath();
    x.moveTo(-pw/2, -ph/2);
    x.lineTo(pw/2, -ph/2);
    x.lineTo(pw/2, ph/2-40);
    x.quadraticCurveTo(pw/2-60, ph/2-10, pw/2-140, ph/2-50);
    x.quadraticCurveTo(0, ph/2+20, -pw/2+120, ph/2-30);
    x.lineTo(-pw/2, ph/2-90);
    x.closePath();
    x.fill();
    x.restore();
    // 暖话
    x.fillStyle='#ffe9cf';
    x.textAlign='center';
    x.font='600 44px "PingFang SC","Microsoft YaHei",sans-serif';
    wrapDrawCentered(x, msg, W/2, H*0.62, 44*1.6, W-160);
    // 标题
    x.fillStyle='#ffb86b';
    x.font='700 30px "PingFang SC",sans-serif';
    x.fillText('🔥 把烦恼烧掉 · Burn It', W/2, H*0.86);
    // 副标题
    x.fillStyle='rgba(243,236,226,0.85)';
    x.font='500 34px "Xingkai SC","KaiTi","楷体",serif';
    const cap = '我刚刚烧掉了「' + title + '」';
    x.fillText(cap, W/2, H*0.92);

    c.toBlob(blob=>{
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download='我刚刚烧掉了'+title+'.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
    }, 'image/png');
  }
  function wrapDrawCentered(x, text, cx, y, lh, maxW){
    const lines=[]; let line='';
    for(const ch of text){
      if(x.measureText(line+ch).width>maxW && line){ lines.push(line); line=ch; }
      else line+=ch;
    }
    if(line) lines.push(line);
    let yy=y;
    for(const ln of lines){ x.fillText(ln, cx, yy); yy+=lh; }
  }

  // ---------- 初始化 ----------
  function init(){
    layout();
    matchEl.style.display='none';
    strikeEl.style.display='none';
    input.focus();
  }
  window.addEventListener('resize', ()=>{ layout(); });
  init();
})();
</script>
</body>
