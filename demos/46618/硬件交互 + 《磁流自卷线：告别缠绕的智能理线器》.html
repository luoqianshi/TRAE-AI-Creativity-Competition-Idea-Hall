<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MagFlow | 磁流自卷线</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            color: #e0e0e0;
        }

        /* 产品卡片 */
        .card {
            max-width: 400px;
            width: 100%;
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 28px 24px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* 头部区域 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #a0c0ff, #6d8cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .badge {
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #b0b0b0;
            letter-spacing: 0.5px;
        }

        /* 动效展示区 */
        .demo-area {
            background: #111111;
            border-radius: 28px;
            padding: 20px 12px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }
        
        .cable-container {
            width: 100%;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 线缆形态 */
        .cable {
            width: 180px;
            height: 180px;
            border: 6px solid #2a2a2a;
            border-radius: 50%;
            position: relative;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 0 0 4px rgba(109, 140, 255, 0.2);
        }

        /* 缠绕状态 */
        .cable.tangled {
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            border-color: #4a4a4a;
            transform: rotate(45deg);
            box-shadow: 0 0 0 4px rgba(255, 70, 70, 0.25);
        }

        /* 磁流变节点提示 */
        .node-hint {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #6d8cff;
            border-radius: 50%;
            box-shadow: 0 0 12px #6d8cff;
            top: 10px;
            right: 30px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 16px #6d8cff; }
            100% { opacity: 0.6; transform: scale(1); }
        }

        .status-text {
            margin-top: 12px;
            font-size: 14px;
            font-weight: 500;
            color: #909090;
            letter-spacing: 0.3px;
        }
        .status-text span {
            color: #6d8cff;
            font-weight: 600;
        }

        /* 交互按钮 */
        .toggle-btn {
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
            width: fit-content;
        }
        .toggle-btn:active {
            background: rgba(109, 140, 255, 0.2);
            border-color: #6d8cff;
            color: white;
        }

        /* 核心卖点网格 */
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .feature-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .feature-icon {
            font-size: 20px;
        }
        .feature-title {
            font-weight: 600;
            font-size: 14px;
            color: #f0f0f0;
        }
        .feature-desc {
            font-size: 11px;
            color: #888;
            line-height: 1.4;
        }

        /* 商业价值钩子 */
        .value-prop {
            background: linear-gradient(105deg, #15192b 0%, #1a1e2f 100%);
            border-radius: 24px;
            padding: 18px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(109, 140, 255, 0.15);
        }
        .value-text {
            font-size: 13px;
            font-weight: 500;
            color: #c0c0c0;
        }
        .value-highlight {
            font-weight: 700;
            font-size: 18px;
            background: linear-gradient(135deg, #a0c0ff, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        hr {
            border: 0.5px solid rgba(255, 255, 255, 0.06);
            margin: 4px 0;
        }
        
        .footer-note {
            font-size: 10px;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 头部 -->
        <div class="header">
            <span class="logo">MagFlow</span>
            <span class="badge">磁流变·智能理线</span>
        </div>

        <!-- 动态演示区 -->
        <div class="demo-area">
            <div class="cable-container">
                <div class="cable" id="cableDemo"></div>
                <div class="node-hint" id="nodeHint"></div>
            </div>
            <div class="status-text" id="statusDisplay">
                当前形态：<span id="stateLabel">整齐线圈</span>
            </div>
            <button class="toggle-btn" id="toggleBtn">
                模拟缠绕 / 通电塑形
            </button>
            <p style="font-size: 11px; color: #666; margin-top: 8px;">* 微电流通过时，磁流变液固化保持形状</p>
        </div>

        <!-- 功能亮点 -->
        <div class="features">
            <div class="feature-item">
                <span class="feature-icon">⏱️</span>
                <span class="feature-title">0.5秒极速收纳</span>
                <span class="feature-desc">松开即自动回卷定型，省去手工理线</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">🔇</span>
                <span class="feature-title">无噪音静谧</span>
                <span class="feature-desc">磁流变过程零机械噪音，适合任何场景</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">🔋</span>
                <span class="feature-title">微功耗驱动</span>
                <span class="feature-desc">纽扣电池驱动，一年续航</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">♻️</span>
                <span class="feature-title">线材寿命+50%</span>
                <span class="feature-desc">无拉扯缠绕，减少内部断裂风险</span>
            </div>
        </div>

        <!-- 商业价值突出 -->
        <div class="value-prop">
            <span class="value-text">📈 百亿3C配件蓝海<br>可改造现有线缆 / OEM授权</span>
            <span class="value-highlight">MagFlow</span>
        </div>
        
        <hr>
        <div class="footer-note">
            硬件交互赛道 · 磁流自卷线创意原型
        </div>
    </div>

    <script>
        (function() {
            const cable = document.getElementById('cableDemo');
            const stateLabel = document.getElementById('stateLabel');
            const toggleBtn = document.getElementById('toggleBtn');
            const nodeHint = document.getElementById('nodeHint');
            
            let isTangled = false;

            function updateUI() {
                if (isTangled) {
                    cable.classList.add('tangled');
                    stateLabel.textContent = '缠绕打结';
                    stateLabel.style.color = '#ff6b6b';
                    nodeHint.style.opacity = '0';
                } else {
                    cable.classList.remove('tangled');
                    stateLabel.textContent = '整齐线圈';
                    stateLabel.style.color = '#6d8cff';
                    nodeHint.style.opacity = '1';
                }
            }

            toggleBtn.addEventListener('click', function() {
                isTangled = !isTangled;
                updateUI();
                
                // 按钮文字微交互
                if (isTangled) {
                    toggleBtn.textContent = '通电！磁流固化恢复形态';
                } else {
                    toggleBtn.textContent = '模拟缠绕 / 通电塑形';
                }
            });

            // 初始状态展示为整齐线圈 (MagFlow默认状态)
            updateUI();
        })();
    </script>
</body>
</html>
