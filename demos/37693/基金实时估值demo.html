// ========== Helpers ==========
function fmtMoney(n, d) { n = Number(n) || 0; d = d == null ? 2 : d; const parts = n.toFixed(d).split('.'); parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ','); return parts.join('.'); }
function fmtSignedRate(n) { n = Number(n) || 0; return (n > 0 ? '+' : '') + n.toFixed(2) + '%'; }
function fmtRate(n) { n = Number(n) || 0; return n.toFixed(2) + '%'; }
function colorClass(n) { n = Number(n) || 0; return n > 0 ? 'up' : n < 0 ? 'down' : 'flat'; }
function fmtUpdate(ts) { if (!ts) return '--'; const parts = ts.split(' '); return parts.length > 1 ? parts[1].substring(0, 5) : ts.substring(0, 5); }

function showToast(msg) {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

// ========== Navigation ==========
document.getElementById('tabBar').addEventListener('click', function(e) {
  const tabItem = e.target.closest('.tab-item');
  if (!tabItem) return;
  const tab = tabItem.dataset.tab;
  if (tab) switchTab(tab);
});

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`.tab-item[data-tab="${tab}"]`).classList.add('active');
  const titles = { holdings: '基金估值', favorites: '自选基金', market: '行情中心', me: '我的' };
  document.getElementById('navTitle').textContent = titles[tab] || '基金估值';
  activeGroup = 'summary';
  renderPage();
}

// ========== Render ==========
function renderPage() {
  const container = document.getElementById('pageContent');
  switch (currentTab) {
    case 'holdings': container.innerHTML = renderHoldings(); break;
    case 'favorites': container.innerHTML = renderFavorites(); break;
    case 'market': container.innerHTML = renderMarket(); break;
    case 'me': container.innerHTML = renderMe(); break;
  }
}

// ========== 持有页 ==========
function renderHoldings() {
  const groups = [
    { id: 'default', name: '默认分组', icon: '📁', count: 5, funds: ['510300', '005827', '161725', '512880', '110022'] },
    { id: 'tech', name: '科技板块', icon: '💻', count: 2, funds: ['006479', '023918'] },
    { id: 'index', name: '指数定投', icon: '📉', count: 2, funds: ['006600', '001180'] },
  ];

  if (activeGroup === 'summary') {
    let totalAsset = 0, totalCost = 0;
    const allFunds = [];
    groups.forEach(g => {
      g.funds.forEach(code => {
        const f = mockFunds[code];
        if (f) {
          const shares = Math.floor(Math.random() * 5000 + 1000);
          const cost = (f.lastNav * shares * (0.9 + Math.random() * 0.2));
          const marketValue = f.estimateNav > 0 ? f.estimateNav * shares : f.lastNav * shares;
          totalAsset += marketValue;
          totalCost += cost;
          allFunds.push({ ...f, shares, cost, marketValue });
        }
      });
    });
    const holdProfit = totalAsset - totalCost;
    const holdRate = totalCost > 0 ? (holdProfit / totalCost * 100) : 0;
    const todayProfit = allFunds.reduce((s, f) => s + (f.lastNav > 0 ? f.lastNav * f.shares * f.estimateRate / 100 : 0), 0);

    let groupCards = groups.map(g => {
      let gAsset = 0, gCost = 0, gToday = 0;
      let upCount = 0, downCount = 0;
      g.funds.forEach(code => {
        const f = mockFunds[code];
        if (f) {
          const shares = Math.floor(Math.random() * 5000 + 1000);
          const cost = (f.lastNav * shares * (0.9 + Math.random() * 0.2));
          gAsset += f.estimateNav > 0 ? f.estimateNav * shares : f.lastNav * shares;
          gCost += cost;
          gToday += f.lastNav > 0 ? f.lastNav * shares * f.estimateRate / 100 : 0;
          if (f.estimateRate > 0) upCount++; else if (f.estimateRate < 0) downCount++;
        }
      });
      const gHold = gAsset - gCost;
      const gHoldRate = gCost > 0 ? (gHold / gCost * 100) : 0;
      return { ...g, totalAsset: fmtMoney(gAsset), holdProfit: fmtSignedMoney(gHold), holdRate: fmtSignedRate(gHoldRate), holdClass: colorClass(gHold), todayProfit: fmtSignedMoney(gToday), todayRate: fmtSignedRate(gCost > 0 ? (gToday / gCost * 100) : 0), todayClass: colorClass(gToday), up: upCount, down: downCount };
    });

    return `
      <div class="holdings-page">
        <div class="group-tabs">
          <div class="group-tab active" onclick="switchGroup('summary')">全部</div>
          ${groups.map(g => `<div class="group-tab" onclick="switchGroup('${g.id}')">${g.icon} ${g.name}</div>`).join('')}
          <div class="group-tab add">+</div>
        </div>
        <div class="summary-card">
          <div class="summary-row">
            <div>
              <div class="summary-label">账户资产</div>
              <div class="summary-value">¥${fmtMoney(totalAsset)}</div>
            </div>
            <div class="summary-right" onclick="toggleSummaryDisplay()">
              <div class="summary-label">总收益</div>
              <div class="summary-value small ${colorClass(holdProfit)}">${fmtSignedMoney(holdProfit)}</div>
            </div>
          </div>
        </div>
        <div class="group-cards">
          ${groupCards.map(g => `
            <div class="group-card" onclick="switchGroup('${g.id}')">
              <div class="group-card-head">
                <div class="group-card-title">${g.icon} ${g.name}</div>
                <div class="group-card-ud"><span class="up">↑${g.up}</span><span class="down">↓${g.down}</span></div>
              </div>
              <div class="group-card-asset">
                <div class="num">¥${g.totalAsset}</div>
                <div class="arrow">›</div>
              </div>
              <div class="divider"></div>
              <div class="group-card-profit">
                <div class="profit-col">
                  <div class="lbl">持有收益</div>
                  <div><span class="val ${g.holdClass}">${g.holdProfit}</span><span class="rate ${g.holdClass}">${g.holdRate}</span></div>
                </div>
                <div class="profit-col">
                  <div class="lbl">当日收益</div>
                  <div><span class="val ${g.todayClass}">${g.todayProfit}</span><span class="rate ${g.todayClass}">${g.todayRate}</span></div>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="bottom-bar">
          <button class="bottom-btn outline" onclick="showToast('跳转到搜索添加持有')">+ 添加持有</button>
        </div>
      </div>`;
  }

  // Single group view
  const group = groups.find(g => g.id === activeGroup) || groups[0];
  const fundItems = group.funds.map(code => mockFunds[code]).filter(Boolean).map(f => {
    const shares = Math.floor(Math.random() * 5000 + 1000);
    const cost = f.lastNav * shares;
    const marketValue = f.estimateNav > 0 ? f.estimateNav * shares : f.lastNav * shares;
    const holdProfit = marketValue - cost;
    const holdRate = cost > 0 ? (holdProfit / cost * 100) : 0;
    const todayProfit = f.lastNav > 0 ? f.lastNav * shares * f.estimateRate / 100 : 0;
    const sector = mockSectors[f.code];
    return { ...f, shares, cost, marketValue, holdProfit, holdRate, todayProfit, sector };
  });

  let gAsset = 0, gCost = 0, gToday = 0;
  fundItems.forEach(f => { gAsset += f.marketValue; gCost += f.cost; gToday += f.todayProfit; });
  const gHold = gAsset - gCost;

  return `
    <div class="holdings-page">
      <div class="group-tabs">
        <div class="group-tab" onclick="switchGroup('summary')">← 全部</div>
        <div class="group-tab active">${group.icon} ${group.name}</div>
        <div class="group-tab add">+</div>
      </div>
      <div class="summary-card" style="padding: 16px 18px;">
        <div style="font-size: 15px; font-weight: 600; margin-bottom: 10px;">${group.icon} ${group.name}（${fundItems.length} 只）</div>
        <div class="summary-row">
          <div>
            <div class="summary-label">账户资产</div>
            <div class="summary-value" style="font-size: 22px;">¥${fmtMoney(gAsset)}</div>
          </div>
          <div class="summary-right">
            <div class="summary-label">当日收益</div>
            <div class="summary-value small ${colorClass(gToday)}">${fmtSignedMoney(gToday)}</div>
          </div>
        </div>
      </div>
      <div class="fund-list">
        <div class="fund-list-header">
          <div class="name-col">基金名称</div>
          <div class="right-col">板块涨跌</div>
          <div class="right-col">当日收益</div>
          <div class="right-col">持有收益</div>
        </div>
        ${fundItems.map(f => `
          <div class="fund-item" onclick="openDetail('${f.code}')">
            <div class="name-col">
              <div class="fund-name">${f.name}</div>
              <div class="fund-meta">
                <span>${f.code}</span>
                <span class="fund-tag">${f.type}</span>
              </div>
              <div class="fund-meta" style="margin-top: 2px;">
                <span class="fund-tag ok">¥${fmtMoney(f.marketValue, 0)}</span>
              </div>
            </div>
            <div class="right-col">
              <div class="fund-value ${f.sector ? colorClass(f.sector.rate) : 'flat'}">${f.sector ? fmtSignedRate(f.sector.rate) : '--'}</div>
              <div class="fund-sub flat">${f.sector ? f.sector.name : '--'}</div>
            </div>
            <div class="right-col">
              <div class="fund-value ${colorClass(f.todayProfit)}">${fmtSignedMoney(f.todayProfit)}</div>
              <div class="fund-sub ${colorClass(f.estimateRate)}">${fmtSignedRate(f.estimateRate)}</div>
            </div>
            <div class="right-col">
              <div class="fund-value ${colorClass(f.holdProfit)}">${fmtSignedMoney(f.holdProfit)}</div>
              <div class="fund-sub ${colorClass(f.holdRate)}">${fmtSignedRate(f.holdRate)}</div>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="bottom-bar">
        <button class="bottom-btn outline" onclick="showToast('跳转到搜索添加持有')">+ 添加持有</button>
      </div>
    </div>`;
}

function switchGroup(id) {
  activeGroup = id;
  renderPage();
  document.getElementById('pageContent').scrollTop = 0;
}

function toggleSummaryDisplay() {
  showToast('点击切换收益/收益率');
}

function fmtSignedMoney(n) {
  n = Number(n) || 0;
  if (n > 0) return '+' + fmtMoney(n);
  if (n < 0) return '-' + fmtMoney(-n);
  return fmtMoney(0);
}

// ========== 详情弹窗 ==========
function openDetail(code) {
  const f = mockFunds[code];
  if (!f) return;
  selectedFund = f;
  const sector = mockSectors[code];
  document.getElementById('modalCard').innerHTML = `
    <div class="modal-title">${f.name} (${f.code})</div>
    <div class="modal-sub">${f.type}</div>
    <div class="modal-nav">
      <div class="modal-nav-value">${fmtMoney(f.estimateNav)}</div>
      <div class="modal-nav-rate ${colorClass(f.estimateRate)}">${fmtSignedRate(f.estimateRate)}</div>
    </div>
    <div class="modal-meta">昨日净值: ${fmtMoney(f.lastNav)} · 更新: ${f.updateAt}</div>
    ${sector ? `<div class="modal-meta" style="margin-top: 4px;">关联板块: ${sector.name} <span class="${colorClass(sector.rate)}">${fmtSignedRate(sector.rate)}</span></div>` : ''}
    <div class="modal-source">来源: ${f.source}</div>
    <div class="modal-actions">
      <button class="modal-btn outline" onclick="showToast('已加入自选')">加入自选</button>
      <button class="modal-btn primary" onclick="showToast('跳转到持仓编辑')">加入持有</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
  selectedFund = null;
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
