<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>梦境回廊</title>
  <style>
/* ===== Design Tokens ===== */
:root {
  --bg-primary: #0B0C1A;
  --bg-secondary: #12132A;
  --bg-card: rgba(255, 255, 255, 0.06);
  --border-glow: rgba(180, 130, 255, 0.3);
  --freud-color: #FF6B8A;
  --zhou-color: #F6C445;
  --text-primary: #EDEAF0;
  --text-secondary: rgba(237, 234, 240, 0.6);
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 8px;
  --phone-w: 390px;
  --phone-h: 844px;
  --tab-h: 64px;
}

/* ===== Reset & Base ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #000;
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
}

/* ===== Phone Frame ===== */
#phone-frame {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  overflow: hidden;
  background: #000;
}

/* ===== App Container ===== */
#app {
  width: 100%;
  height: 100%;
  position: relative;
  background: linear-gradient(180deg, #0B0C1A 0%, #1A1040 50%, #0B0C1A 100%);
  overflow: hidden;
}

/* ===== PC Desktop: Phone Frame ===== */
@media (min-width: 500px) {
  #app {
    width: var(--phone-w);
    height: var(--phone-h);
    min-height: unset;
    border-radius: 44px;
    border: 3px solid #2a2a2a;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.05),
      0 0 80px rgba(180, 130, 255, 0.12),
      inset 0 0 0 1px rgba(255,255,255,0.03);
    transform-origin: top center;
    flex-shrink: 0;
  }

  /* 顶部刘海 */
  #app::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 30px;
    background: #000;
    border-radius: 0 0 20px 20px;
    z-index: 500;
  }

  /* 底部Home指示条 */
  #app::after {
    content: '';
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 3px;
    z-index: 500;
  }
}

/* ===== Content Wrapper (scrollable area) ===== */
#content-wrapper {
  width: 100%;
  height: calc(100% - var(--tab-h));
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

/* ===== Page Container ===== */
#page-container {
  min-height: 100%;
}

.page {
  display: none;
  padding: 16px 16px 24px;
  animation: fadeIn 0.3s ease;
}

.page.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Page Header ===== */
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 0 12px;
}

.logo {
  font-size: 20px;
  font-weight: 700;
  background: linear-gradient(135deg, #B482FF, #FF6B8A);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.icon-btn {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  background: var(--bg-card);
  border: 1px solid var(--border-glow);
  border-radius: 50%;
  cursor: pointer;
  transition: transform 0.2s;
  color: var(--text-primary);
}

.icon-btn:active {
  transform: scale(0.92);
}

/* ===== Glass Card ===== */
.glass-card {
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 16px;
}

/* ===== Quick Record ===== */
.quick-record {
  text-align: center;
}

.record-btn-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 12px;
}

.record-btn {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: linear-gradient(135deg, #B482FF, #7C3AED);
  border: 3px solid rgba(180, 130, 255, 0.5);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 0 20px rgba(180, 130, 255, 0.3);
}

.record-btn:active, .record-btn.recording {
  transform: scale(1.08);
  box-shadow: 0 0 40px rgba(180, 130, 255, 0.6);
}

.record-icon {
  font-size: 22px;
}

.record-text {
  font-size: 10px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.record-timer {
  margin-top: 6px;
  font-size: 13px;
  color: var(--freud-color);
  min-height: 1.5em;
}

/* ===== Quick Tags ===== */
.quick-tags {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 8px 0;
  justify-content: center;
  flex-wrap: wrap;
}

.tag {
  padding: 6px 14px;
  background: rgba(180, 130, 255, 0.15);
  border: 1px solid var(--border-glow);
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  color: var(--text-primary);
}

.tag:active, .tag.selected {
  background: rgba(180, 130, 255, 0.4);
  transform: scale(0.95);
}

/* ===== Emotion Slider ===== */
.emotion-slider-wrap {
  margin: 12px 0;
}

.emotion-slider {
  width: 100%;
  height: 8px;
  border-radius: 4px;
  background: linear-gradient(to right, #1a237e, #7B1FA2, #D32F2F);
  -webkit-appearance: none;
  appearance: none;
  outline: none;
}

.emotion-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 10px rgba(180, 130, 255, 0.8);
  cursor: pointer;
}

.emotion-labels {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 4px;
}

#emotion-value {
  color: var(--text-primary);
  font-weight: 600;
}

/* ===== Quick Title Input ===== */
.quick-title-input {
  width: 100%;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 13px;
  margin: 10px 0;
  outline: none;
}

.quick-title-input:focus {
  border-color: var(--border-glow);
}

.save-dream-btn {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #7C3AED, #B482FF);
  border: none;
  border-radius: var(--radius-md);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s;
}

.save-dream-btn:active {
  transform: scale(0.97);
}

/* ===== Timeline ===== */
.timeline {
  margin-top: 8px;
}

.timeline-item {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  background: var(--bg-card);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: var(--radius-md);
  margin-bottom: 8px;
  cursor: pointer;
  transition: transform 0.15s;
}

.timeline-item:active {
  transform: scale(0.97);
}

.timeline-time {
  font-size: 12px;
  color: var(--text-secondary);
  min-width: 50px;
}

.emotion-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin: 0 12px;
  flex-shrink: 0;
}

.timeline-title {
  flex: 1;
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.link-icon {
  font-size: 14px;
  opacity: 0.3;
  margin-left: 8px;
}

.link-icon.linked {
  opacity: 1;
}

/* ===== Page 2: Thoughts ===== */
.input-hint {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 10px;
}

textarea {
  width: 100%;
  padding: 12px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 13px;
  resize: none;
  outline: none;
  font-family: inherit;
}

textarea:focus {
  border-color: var(--border-glow);
}

.primary-btn {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #F6C445, #FF9800);
  border: none;
  border-radius: var(--radius-md);
  color: #0B0C1A;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 10px;
  transition: transform 0.2s;
}

.primary-btn:active {
  transform: scale(0.97);
}

.thought-list {
  margin-top: 8px;
}

.thought-card {
  background: rgba(246, 196, 69, 0.08);
  border: 1px solid rgba(246, 196, 69, 0.2);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  margin-bottom: 10px;
  position: relative;
  transition: transform 0.15s;
}

.thought-card:active {
  transform: scale(0.97);
}

.thought-card.linked {
  border-left: 3px solid #B482FF;
}

.thought-content {
  font-size: 13px;
  margin-bottom: 10px;
}

.thought-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.thought-time {
  font-size: 11px;
  color: var(--text-secondary);
}

.link-dream-btn {
  padding: 6px 14px;
  background: rgba(180, 130, 255, 0.2);
  border: 1px solid var(--border-glow);
  border-radius: 20px;
  color: var(--text-primary);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
}

.link-dream-btn:active {
  background: rgba(180, 130, 255, 0.5);
}

/* ===== Page 3: Interpret ===== */
.dream-selector {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 8px 0 16px;
}

.selector-tag {
  padding: 8px 18px;
  background: var(--bg-card);
  border: 1px solid var(--border-glow);
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  color: var(--text-primary);
}

.selector-tag.active {
  background: linear-gradient(135deg, #B482FF, #7C3AED);
  border-color: transparent;
}

.section-title {
  font-size: 15px;
  margin-bottom: 12px;
}

.freud-title {
  color: var(--freud-color);
}

.zhou-title {
  color: var(--zhou-color);
}

.symbol-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

.symbol-item {
  padding: 6px 14px;
  background: rgba(255, 107, 138, 0.15);
  border: 1px solid rgba(255, 107, 138, 0.3);
  border-radius: var(--radius-sm);
  font-size: 12px;
  color: var(--text-primary);
}

.assoc-input-wrap {
  display: flex;
  gap: 8px;
}

.assoc-input-wrap input {
  flex: 1;
  padding: 8px 12px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 12px;
  outline: none;
}

.small-btn {
  padding: 8px 14px;
  background: var(--freud-color);
  border: none;
  border-radius: var(--radius-sm);
  color: #fff;
  font-size: 12px;
  cursor: pointer;
}

.divider-line {
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 16px 0;
  position: relative;
}

.divider-line::before {
  content: '';
  position: absolute;
  width: 100%;
  height: 2px;
  background: linear-gradient(to right, var(--freud-color), var(--zhou-color));
  opacity: 0.5;
}

.yin-yang {
  position: relative;
  z-index: 1;
  font-size: 22px;
  background: var(--bg-primary);
  padding: 0 16px;
}

.zhou-text {
  font-size: 13px;
  color: var(--zhou-color);
  padding: 12px;
  background: rgba(246, 196, 69, 0.08);
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
  line-height: 1.8;
}

.role-switcher {
  display: flex;
  gap: 8px;
}

.capsule-btn {
  padding: 6px 14px;
  background: rgba(246, 196, 69, 0.15);
  border: 1px solid rgba(246, 196, 69, 0.3);
  border-radius: 20px;
  color: var(--zhou-color);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
}

.capsule-btn.active {
  background: var(--zhou-color);
  color: #0B0C1A;
}

.merge-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--freud-color), var(--zhou-color));
  border: none;
  border-radius: var(--radius-md);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 16px;
  transition: transform 0.2s;
}

.merge-btn:active {
  transform: scale(0.97);
}

/* ===== Page 4: Lab ===== */
.lab-module {
  margin-bottom: 16px;
}

.module-title {
  font-size: 15px;
  margin-bottom: 12px;
  background: linear-gradient(135deg, #B482FF, #FF6B8A);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

#dream-intent {
  width: 100%;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
  margin-bottom: 10px;
}

.implant-btn {
  background: linear-gradient(135deg, #7C3AED, #B482FF);
  color: #fff;
}

.sleep-guide {
  font-size: 13px;
  line-height: 2;
}

.sleep-guide .time-label {
  color: #B482FF;
  font-weight: 600;
}

.sleep-guide .tip {
  margin-top: 6px;
  padding: 10px;
  background: rgba(180, 130, 255, 0.08);
  border-radius: var(--radius-sm);
}

.nightmare-scene {
  font-size: 13px;
  color: var(--freud-color);
  padding: 10px;
  background: rgba(255, 107, 138, 0.08);
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
  font-style: italic;
}

.rewrite-btns {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.rewrite-btn {
  flex: 1;
  padding: 10px 4px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
}

.rewrite-btn:active {
  background: rgba(180, 130, 255, 0.3);
}

.rewrite-result {
  font-size: 13px;
  padding: 14px;
  background: rgba(180, 130, 255, 0.08);
  border-radius: var(--radius-sm);
  line-height: 1.8;
  min-height: 3em;
}

/* ===== Tab Bar ===== */
#tab-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: var(--tab-h);
  background: rgba(11, 12, 26, 0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border-glow);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}

.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: transform 0.2s;
  padding: 4px 8px;
}

.tab-item.active {
  transform: translateY(-4px);
}

.tab-icon {
  font-size: 20px;
  margin-bottom: 2px;
}

.tab-label {
  font-size: 10px;
  color: var(--text-secondary);
}

.tab-item.active .tab-label {
  background: linear-gradient(135deg, #B482FF, #FF6B8A);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 600;
}

/* ===== Bottom Sheet ===== */
.bottom-sheet-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  z-index: 200;
  display: none;
  opacity: 0;
  transition: opacity 0.3s;
}

.bottom-sheet-overlay.show {
  display: block;
  opacity: 1;
}

.bottom-sheet {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  max-height: 80%;
  background: var(--bg-secondary);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  transition: transform 0.3s ease;
  overflow-y: auto;
  transform: translateY(100%);
}

.bottom-sheet-overlay.show .bottom-sheet {
  transform: translateY(0);
}

.sheet-handle {
  width: 40px;
  height: 4px;
  background: rgba(255, 255, 255, 0.3);
  border-radius: 2px;
  margin: 12px auto;
}

.sheet-content {
  padding: 8px 20px 30px;
}

.sheet-content h3 {
  font-size: 17px;
  margin-bottom: 12px;
}

.sheet-content p {
  font-size: 13px;
  line-height: 1.8;
  color: var(--text-secondary);
  margin-bottom: 10px;
}

/* ===== Toast ===== */
.toast {
  position: absolute;
  bottom: calc(var(--tab-h) + 20px);
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  padding: 10px 24px;
  background: rgba(0, 0, 0, 0.85);
  border-radius: var(--radius-sm);
  color: #fff;
  font-size: 13px;
  opacity: 0;
  transition: all 0.3s;
  z-index: 300;
  pointer-events: none;
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ===== Loading ===== */
.loading-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(11, 12, 26, 0.8);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 250;
}

.loading-overlay.show {
  display: flex;
}

.loading-moon {
  font-size: 60px;
  animation: spin 1.5s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* ===== Pulse Animation ===== */
.pulse-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 250;
  background: rgba(11, 12, 26, 0.9);
}

.pulse-overlay.show {
  display: flex;
}

.pulse-ring {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  border: 3px solid #B482FF;
  position: absolute;
  animation: pulse 2s ease-out infinite;
}

.pulse-ring.delay1 { animation-delay: 0.5s; }
.pulse-ring.delay2 { animation-delay: 1s; }

@keyframes pulse {
  0% { transform: scale(0.5); opacity: 1; }
  100% { transform: scale(3); opacity: 0; }
}

/* ===== Stats Popup ===== */
.stats-content {
  text-align: center;
}

.stats-content .stat-number {
  font-size: 30px;
  font-weight: 700;
  background: linear-gradient(135deg, #B482FF, #FF6B8A);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.stats-content .stat-label {
  font-size: 11px;
  color: var(--text-secondary);
}

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 12px;
}

/* ===== Scrollbar ===== */
::-webkit-scrollbar {
  width: 0;
  height: 0;
}

/* ===== Filter Bar ===== */
.filter-bar {
  background: var(--bg-card);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--radius-md);
  padding: 12px;
  margin-bottom: 16px;
}

.filter-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.filter-row:last-child {
  margin-bottom: 0;
}

.filter-label {
  font-size: 12px;
  color: var(--text-secondary);
  min-width: 36px;
  flex-shrink: 0;
}

.filter-tags {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  flex: 1;
}

.filter-tag {
  padding: 4px 10px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 14px;
  font-size: 11px;
  cursor: pointer;

function saveData(key, obj) {

}

  const data = localStorage.getItem(key);

// 生成ID
function generateId() {
  return Date.now().toString() + Math.random().toString(36).substr(2, 9);

// 显示Toast
function showToast(text) {
  const toast = document.getElementById('toast');
  toast.textContent = text;
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
  }, 2000);
}

// 打开底部弹窗
function openBottomSheet(htmlContent) {
  const overlay = document.getElementById('bottom-sheet-overlay');
  const content = document.getElementById('sheet-content');
  content.innerHTML = htmlContent;
  overlay.classList.add('show');

  // 点击遮罩关闭
  overlay.onclick = (e) => {
    if (e.target === overlay) {
      closeBottomSheet();
    }
  };
}

// 关闭底部弹窗
function closeBottomSheet() {
  const overlay = document.getElementById('bottom-sheet-overlay');
  overlay.classList.remove('show');
}

  const loading = document.getElementById('loading-overlay');
  loading.classList.add('show');

  const num = parseInt(value);
  if (num < -3) return '#1a237e';
  if (num < 0) return '#7B1FA2';
  if (num === 0) return '#9E9E9E';
  if (num < 3) return '#FF9800';
  return '#D32F2F';
}

// 格式化时间
function formatTime(date) {
  const d = new Date(date);
  const hours = d.getHours().toString().padStart(2, '0');
  const minutes = d.getMinutes().toString().padStart(2, '0');
  return `${hours}:${minutes}`;
}

// PC端自动缩放
function adjustPhoneScale() {
  if (window.innerWidth >= 500) {
    const app = document.getElementById('app');
    const frame = document.getElementById('phone-frame');
    const phoneW = 390;
    const phoneH = 844;
    const padding = 40;

    const availW = window.innerWidth - padding * 2;
    const availH = window.innerHeight - padding * 2;

    const scaleW = availW / phoneW;
    const scaleH = availH / phoneH;
    const scale = Math.min(scaleW, scaleH, 1);

    app.style.transform = `scale(${scale})`;
    app.style.transformOrigin = 'top center';

    // 垂直居中
    const scaledH = phoneH * scale;
    const topOffset = Math.max(0, (window.innerHeight - scaledH) / 2);
    frame.style.alignItems = 'flex-start';
    frame.style.paddingTop = topOffset + 'px';
  } else {
    const app = document.getElementById('app');
    const frame = document.getElementById('phone-frame');
    app.style.transform = '';
    frame.style.paddingTop = '';
  }
}

// 渲染梦境时间线
function renderDreamTimeline() {
  const timeline = document.getElementById('dream-timeline');
  
  // 应用筛选
  let filteredDreams = dreams.filter(dream => {
    // 标签筛选
    if (gardenFilter.tag !== 'all') {
      if (!dream.tags || !dream.tags.includes(gardenFilter.tag)) {
        return false;
      }
    }
    
    // 情绪筛选
    if (gardenFilter.emotion !== 'all') {
      if (gardenFilter.emotion === 'negative' && dream.emotion >= 0) return false;
      if (gardenFilter.emotion === 'neutral' && (dream.emotion < 0 || dream.emotion > 0)) return false;
      if (gardenFilter.emotion === 'positive' && dream.emotion <= 0) return false;
    }
    
    return true;
  });
  
  timeline.innerHTML = filteredDreams.map(dream => {
    const isLinked = dream.relatedThoughtId ? 'linked' : '';
    const emotionColor = getEmotionColor(dream.emotion);
    const title = dream.title.length > 6 ? dream.title.substring(0, 6) + '...' : dream.title;

    return `
      <div class="timeline-item" data-id="${dream.id}">
        <span class="timeline-time">${dream.time}</span>
        <span class="emotion-dot" style="background: ${emotionColor}"></span>
        <span class="timeline-title">${title}</span>
        <span class="link-icon ${isLinked}">🔗</span>
      </div>
    `;
  }).join('');

  // 绑定点击事件
  timeline.querySelectorAll('.timeline-item').forEach(item => {
    item.addEventListener('click', () => showDreamDetail(item.dataset.id));
  });
}

// 显示梦境详情
function showDreamDetail(dreamId) {
  const dream = dreams.find(d => d.id === dreamId);
  if (!dream) return;

  let relatedThought = '';
  if (dream.relatedThoughtId) {
    const thought = thoughts.find(t => t.id === dream.relatedThoughtId);
    if (thought) {
      relatedThought = `<p><strong>关联日思：</strong>${thought.content}</p>`;
    }
  }

  const html = `
    <h3>${dream.title}</h3>
    <p><strong>时间：</strong>${dream.date} ${dream.time}</p>
    <p><strong>情绪：</strong>${dream.emotion > 0 ? '+' : ''}${dream.emotion}</p>
    <p><strong>标签：</strong>${dream.tags.join('、')}</p>
    ${relatedThought}
  `;

  openBottomSheet(html);
}

// 开始录音
function startRecording() {
  const btn = document.getElementById('btn-record');
  btn.classList.add('recording');
  recordingSeconds = 0;
  document.getElementById('record-timer').textContent = '0:00';

  if (navigator.vibrate) navigator.vibrate(10);

  recordingTimer = setInterval(() => {
    recordingSeconds++;
    const mins = Math.floor(recordingSeconds / 60);
    const secs = recordingSeconds % 60;
    document.getElementById('record-timer').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
  }, 1000);
}

// 停止录音
function stopRecording() {
  const btn = document.getElementById('btn-record');
  btn.classList.remove('recording');
  clearInterval(recordingTimer);

  if (recordingSeconds > 0) {
    showToast('录音已保存');
  }
}

// 保存梦境
function saveDream() {
  const title = document.getElementById('quick-title').value.trim();
  const emotion = document.getElementById('emotion-slider').value;

  if (!title) {
    showToast('请输入梦境标题');
    return;
  }

  const newDream = {
    id: 'dream_' + generateId(),
    title: title,
    emotion: parseInt(emotion),
    tags: ['快速记录'],
    relatedThoughtId: null,
    time: formatTime(new Date()),
    date: '今天'
  };

  dreams.unshift(newDream);
  saveData('dreams', dreams);
  renderDreamTimeline();

  document.getElementById('quick-title').value = '';
  document.getElementById('emotion-slider').value = 0;
  document.getElementById('emotion-value').textContent = '0';

  showToast('梦境已保存');
}

// 渲染想法列表
function renderThoughtList() {
  const list = document.getElementById('thought-list');

  // 应用筛选
  let filteredThoughts = thoughts.filter(thought => {
    // 日期筛选
    if (thoughtsFilter.date !== 'all') {
      if (thoughtsFilter.date === 'today' && thought.date !== '今天') return false;
      if (thoughtsFilter.date === 'yesterday' && thought.date !== '昨天') return false;
      if (thoughtsFilter.date === 'week') {
        if (thought.date !== '今天' && thought.date !== '昨天' && !thought.date.includes('天前')) return false;
        // 排除超过7天的
        const match = thought.date.match(/(\d+)天前/);
        if (match && parseInt(match[1]) > 7) return false;
      }
    }

    // 关联状态筛选
    if (thoughtsFilter.link === 'linked' && !thought.isLinked) return false;
    if (thoughtsFilter.link === 'unlinked' && thought.isLinked) return false;

    return true;
  });

  list.innerHTML = filteredThoughts.map(thought => {
    const linkedClass = thought.isLinked ? 'linked' : '';
    return `
      <div class="thought-card ${linkedClass}" data-id="${thought.id}">
        <div class="thought-content">${thought.content}</div>
        <div class="thought-footer">
          <span class="thought-time">${thought.date} ${thought.time}</span>
          <button class="link-dream-btn" data-id="${thought.id}">🧩 入梦</button>
        </div>
      </div>
    `;
  }).join('');

  // 绑定入梦按钮
  list.querySelectorAll('.link-dream-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      showLinkDreamModal(btn.dataset.id);
    });
  });
}

// 添加想法
function addThought() {
  const input = document.getElementById('thought-input');

  if (!content) {
    showToast('请输入想法内容');
    return;

  const newThought = {
    id: 'thought_' + generateId(),
    content: content,
    isLinked: false,
    time: formatTime(new Date()),
    date: '今天'
  };

  thoughts.unshift(newThought);
  saveData('thoughts', thoughts);
  renderThoughtList();

  input.value = '';
  showToast('想法已添加');
}

// 显示关联梦境弹窗
function showLinkDreamModal(thoughtId) {
  // 获取最近3天未关联的梦
  const recentDreams = dreams.filter(d =>
    !d.relatedThoughtId &&
    (d.date === '今天' || d.date === '昨天' || d.date.includes('天前'))
  ).slice(0, 5);

  if (recentDreams.length === 0) {
    showToast('没有可关联的梦境');
    return;
  }

  const html = `
    <h3>选择要关联的梦境</h3>
    ${recentDreams.map(dream => `
      <div class="timeline-item" data-dream-id="${dream.id}" data-thought-id="${thoughtId}">
        <span class="timeline-time">${dream.time}</span>
        <span class="emotion-dot" style="background: ${getEmotionColor(dream.emotion)}"></span>
        <span class="timeline-title">${dream.title}</span>
      </div>
    `).join('')}
  `;

  openBottomSheet(html);

  // 绑定选择事件
  setTimeout(() => {
    document.querySelectorAll('#sheet-content .timeline-item').forEach(item => {
      item.addEventListener('click', () => {
        linkDreamAndThought(item.dataset.dreamId, item.dataset.thoughtId);
        closeBottomSheet();
      });
    });
  }, 100);
}

// 关联梦境和想法
function linkDreamAndThought(dreamId, thoughtId) {
  const dream = dreams.find(d => d.id === dreamId);
  const thought = thoughts.find(t => t.id === thoughtId);

  if (dream && thought) {
    dream.relatedThoughtId = thoughtId;
    thought.isLinked = true;

    saveData('dreams', dreams);
    saveData('thoughts', thoughts);

    renderDreamTimeline();
    renderThoughtList();

    showToast('已关联');
  }
}

// 切换点赞状态
function toggleLike(postId) {
  const post = communityPosts.find(p => p.id === postId);
  if (!post) return;

  post.liked = !post.liked;
  post.likes += post.liked ? 1 : -1;

  saveData('communityPosts', communityPosts);
  renderCommunityFeed();
}

// 显示评论
function showComments(postId) {
  const post = communityPosts.find(p => p.id === postId);
  if (!post) return;

  const commentsHtml = post.comments.length > 0
    ? post.comments.map(c => `<p><strong>${c.author}：</strong>${c.content}</p>`).join('')
    : '<p>暂无评论</p>';

  const html = `
    <h3>💬 评论</h3>
    <div class="comments-list">${commentsHtml}</div>
    <div class="comment-input-wrap">
      <input type="text" id="comment-input" placeholder="写下你的想法...">
      <button class="small-btn" id="btn-add-comment" data-post-id="${postId}">发送</button>
    </div>
  `;

  openBottomSheet(html);

  // 绑定发送评论事件
  setTimeout(() => {
    const btn = document.getElementById('btn-add-comment');
    if (btn) {
      btn.addEventListener('click', () => addComment(postId));
    }
  }, 100);
}

// 添加评论
function addComment(postId) {
  const input = document.getElementById('comment-input');
  const content = input.value.trim();

  if (!content) {
    showToast('请输入评论内容');
    return;
  }

  const post = communityPosts.find(p => p.id === postId);
  if (!post) return;

  post.comments.push({
    author: '我',
    content: content
  });

  saveData('communityPosts', communityPosts);
  renderCommunityFeed();
  closeBottomSheet();
  showToast('评论已发送');
}

// 发布动态
function sharePost() {
  const input = document.getElementById('share-input');
  const content = input.value.trim();

  if (!content) {
    showToast('请输入内容');
    return;
  }

  const activeType = document.querySelector('.share-type-btn.active');
  const type = activeType ? activeType.dataset.type : 'dream';

  const newPost = {
    id: 'post_' + generateId(),
    author: '我',
    avatar: '🌟',
    type: type,
    content: content,
    time: '刚刚',
    likes: 0,
    liked: false,
    comments: []
  };

  communityPosts.unshift(newPost);
  saveData('communityPosts', communityPosts);
  renderCommunityFeed();

  input.value = '';
  showToast('发布成功');
}

// 启动应用
document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
