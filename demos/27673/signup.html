<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KnowBase AI - 智能个人知识库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #e0e0e8;
            line-height: 1.6;
        }
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 32px;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }
        .gradient {
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 1.125rem;
            color: #9ca3af;
            max-width: 480px;
            margin-bottom: 48px;
        }
        .features {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 48px;
        }
        .feature {
            text-align: center;
            padding: 24px;
        }
        .feature-icon {
            font-size: 2rem;
            margin-bottom: 12px;
        }
        .feature-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .feature-desc {
            font-size: 0.875rem;
            color: #6b7280;
        }
        .cta {
            padding: 14px 36px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
        }
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            text-align: center;
            padding: 20px;
            font-size: 0.75rem;
            color: #4b5563;
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="logo">&#128218;</div>
        <h1>KnowBase <span class="gradient">AI</span></h1>
        <p class="subtitle">随手记，AI帮你理，随时问。让个人知识管理变得简单高效。</p>
        <div class="features">
            <div class="feature">
                <div class="feature-icon">&#9997;</div>
                <div class="feature-title">轻松记录</div>
                <div class="feature-desc">零门槛输入</div>
            </div>
            <div class="feature">
                <div class="feature-icon">&#129302;</div>
                <div class="feature-title">AI整理</div>
                <div class="feature-desc">自动归类</div>
            </div>
            <div class="feature">
                <div class="feature-icon">&#128269;</div>
                <div class="feature-title">自然检索</div>
                <div class="feature-desc">快速定位</div>
            </div>
        </div>
        <button class="cta">开始使用</button>
    </section>
    <div class="footer">Built with Trae AI</div>
</body>
</html>
