<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>木作智排 - 切割图纸生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f9f6f0; }
        .wood-bg { background: linear-gradient(135deg, #d4a373 0%, #e9c46a 100%); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- 头部 -->
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-amber-900 mb-2">🪵 木作智排</h1>
            <p class="text-gray-600">DIY 木板切割排版与图纸生成助手</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 左侧：输入区 -->
            <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-md border border-amber-100">
                <h2 class="text-xl font-semibold text-amber-800 mb-4 border-b pb-2">参数设置</h2>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">木板总尺寸 (mm)</label>
                    <div class="flex gap-2">
                        <input type="number" id="boardW" value="1200" class="w-full border rounded px-3 py-2">
                        <span class="self-center">x</span>
                        <input type="number" id="boardH" value="800" class="w-full border rounded px-3 py-2">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">添加切割零件</label>
                    <div class="grid grid-cols-3 gap-2 mb-2">
                        <input type="number" id="partW" placeholder="长" class="border rounded px-2 py-1">
                        <input type="number" id="partH" placeholder="宽" class="border rounded px-2 py-1">
                        <input type="number" id="partQty" value="1" placeholder="数量" class="border rounded px-2 py-1">
                    </div>
                    <button onclick="addPart()" class="w-full bg-amber-600 text-white py-2 rounded hover:bg-amber-700 transition">添加零件</button>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">零件列表</label>
                    <ul id="partList" class="text-sm text-gray-600 max-h-40 overflow-y-auto border rounded p-2 bg-gray-50 min-h-[60px]">
                        <li class="text-gray-400 italic">暂无零件</li>
                    </ul>
                </div>

                <button onclick="generateLayout()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition shadow">
                    📐 生成排版图纸
                </button>
            </div>

            <!-- 右侧：画布区 -->
            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-md border border-amber-100 flex flex-col">
                <h2 class="text-xl font-semibold text-amber-800 mb-4 border-b pb-2">排版预览</h2>
                <div class="flex-1 flex items-center justify-center bg-gray-50 rounded-lg border-2 border-dashed border-gray-200 min-h-[400px] relative overflow-hidden" id="canvasContainer">
                    <p class="text-gray-400 absolute" id="placeholder">请在左侧添加零件并点击“生成排版图纸”</p>
                    <canvas id="layoutCanvas" class="hidden max-w-full max-h-full"></canvas>
                </div>
                <button onclick="alert('图纸已生成！在实际产品中，此处将导出为 PDF 或 SVG 格式。')" class="mt-4 w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
                    📥 导出切割图纸 (演示)
                </button>
            </div>
        </div>
    </div>

    <script>
        let parts = [];
        const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#8b5cf6', '#ec4899'];

        function addPart() {
            const w = parseInt(document.getElementById('partW').value);
            const h = parseInt(document.getElementById('partH').value);
            const qty = parseInt(document.getElementById('partQty').value) || 1;
            if (!w || !h) return alert('请输入有效的长宽');
            
            parts.push({ w, h, qty, color: colors[parts.length % colors.length] });
            updatePartList();
        }

        function updatePartList() {
            const list = document.getElementById('partList');
            if (parts.length === 0) {
                list.innerHTML = '<li class="text-gray-400 italic">暂无零件</li>';
                return;
            }
            list.innerHTML = parts.map((p, i) => 
                `<li class="flex justify-between items-center py-1 border-b border-gray-100">
                    <span><span class="inline-block w-3 h-3 rounded mr-2" style="background:${p.color}"></span>${p.w} x ${p.h} mm (x${p.qty})</span>
                    <button onclick="removePart(${i})" class="text-red-500 text-xs">删除</button>
                </li>`
            ).join('');
        }

        function removePart(index) {
            parts.splice(index, 1);
            updatePartList();
        }

        function generateLayout() {
            if (parts.length === 0) return alert('请先添加零件');
            
            const boardW = parseInt(document.getElementById('boardW').value);
            const boardH = parseInt(document.getElementById('boardH').value);
            const canvas = document.getElementById('layoutCanvas');
            const ctx = canvas.getContext('2d');
            
            // 计算缩放比例
            const scale = Math.min(500 / boardW, 350 / boardH);
            canvas.width = boardW * scale;
            canvas.height = boardH * scale;
            
            document.getElementById('placeholder').classList.add('hidden');
            canvas.classList.remove('hidden');

            // 画木板
            ctx.fillStyle = '#fef3c7';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#92400e';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);

            // 简单贪心排版算法 (Next Fit Decreasing Height 变体)
            let currentX = 5;
            let currentY = 5;
            let rowHeight = 0;

            parts.forEach(part => {
                for (let i = 0; i < part.qty; i++) {
                    let pw = part.w * scale;
                    let ph = part.h * scale;
                    
                    // 如果当前行放不下，换行
                    if (currentX + pw > canvas.width - 5) {
                        currentX = 5;
                        currentY += rowHeight + 5;
                        rowHeight = 0;
                    }
                    
                    // 如果超出木板高度，停止绘制
                    if (currentY + ph > canvas.height - 5) break;

                    ctx.fillStyle = part.color + '80'; // 半透明
                    ctx.fillRect(currentX, currentY, pw, ph);
                    ctx.strokeStyle = part.color;
                    ctx.lineWidth = 1;
                    ctx.strokeRect(currentX, currentY, pw, ph);

                    // 写尺寸
                    ctx.fillStyle = '#000';
                    ctx.font = '12px Arial';
                    ctx.fillText(`${part.w}x${part.h}`, currentX + 4, currentY + 15);

                    currentX += pw + 3;
                    rowHeight = Math.max(rowHeight, ph);
                }
            });
        }
    </script>
</body>
</html>
