}

    <style type="text/tailwindcss">
  @theme inline {
    --color-bg: var(--pintuan-bg);

    --color-primary-light: var(--pintuan-primary-light);

    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }

    <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
      background: #F5F5F5;
      color: #333;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Phone Frame Container ===== */
    .phone-frame {
      width: 375px;
      min-height: 100vh;
      margin: 0 auto;
      background: #F5F5F5;
      position: relative;
      overflow-y: auto;
      padding-bottom: 70px;
    }

    /* ===== 1. Status Bar (Android) ===== */
    .status-bar {
      width: 100%;
      height: 24px;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 11px;
      font-weight: 500;
      color: #333;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .status-bar-left {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-bar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-bar .time {
      font-size: 11px;
      font-weight: 600;
    }

    .status-bar .network-speed {
      font-size: 9px;
      color: #666;
    }

    .status-bar .network-5g {
      font-size: 9px;
      font-weight: 600;
      color: #333;
    }

    .status-bar .battery {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .battery-icon {
      width: 18px;
      height: 9px;
      border: 1.5px solid #333;
      border-radius: 2px;
      position: relative;
      display: flex;
      align-items: center;
      padding: 1px;
    }

    .battery-icon::after {
      content: '';
      position: absolute;
      right: -4px;
      top: 50%;
      transform: translateY(-50%);
      width: 2px;
      height: 5px;
      background: #333;
      border-radius: 0 1px 1px 0;
    }

    .battery-level {
      height: 100%;
      width: 21%;
      background: #333;
      border-radius: 1px;
    }

    .battery-text {
      font-size: 9px;
      color: #333;
    }

    /* ===== 2. App Header ===== */
    .app-header {
      width: 100%;
      height: 44px;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      top: 24px;
      z-index: 99;
    }

    .app-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #FF6B81, #FF8FA3);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    .app-name {
      font-size: 15px;
      font-weight: 700;
      color: #333;
    }

    .app-header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-icon {
      font-size: 20px;
      color: #333;
      cursor: pointer;
      line-height: 1;
    }

    /* ===== 3. Identity Switch Button ===== */
    .identity-switch {
      margin: 8px 12px 0;
      background: #FFF8E1;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .identity-switch-text {
      font-size: 12px;
      color: #F5A623;
      line-height: 1.4;
    }

    /* ===== 4. User Greeting ===== */
    .user-greeting {
      display: flex;
      align-items: center;
      padding: 10px 12px 0;
      gap: 8px;
    }

    .greeting-text {
      font-size: 14px;
      color: #333;
      font-weight: 500;
    }

    .pill-badge {
      background: #F0F0F0;
      color: #999;
      font-size: 10px;
      padding: 2px 10px;
      border-radius: 999px;
      line-height: 1.5;
    }

    /* ===== 5. Tab Navigation ===== */
    .tab-nav {
      display: flex;
      align-items: center;
      padding: 12px 12px 0;
      border-bottom: 1px solid #EEEEEE;
      background: #FFFFFF;
    }

    .tab-item {
      position: relative;
      padding: 0 0 10px;
      margin-right: 24px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tab-item.active {
      color: #333;
      font-weight: 600;
    }

    .tab-item.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: #FF6B81;
      border-radius: 1px;
    }

    .tab-item.inactive {
      color: #999;
      font-weight: 400;
    }

    .tab-arrow {
      font-size: 10px;
      color: inherit;
      margin-left: 2px;
    }

    /* ===== 6. Search Bar ===== */
    .search-bar-wrapper {
      padding: 10px 12px;
      background: #FFFFFF;
    }

    .search-bar {
      width: 100%;
      height: 36px;
      background: #F0F0F0;
      border-radius: 999px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
    }

    .search-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .search-icon svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #999;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .search-placeholder {
      font-size: 13px;
      color: #999;
    }

    /* ===== 7. Content Cards ===== */
    .content-cards {
      padding: 8px 12px;
    }

    .content-card {
      background: #FFFFFF;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid rgba(0, 0, 0, 0.03);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .card-date {
      font-size: 11px;
      color: #999;
    }

    .card-status-badge {
      background: #FF9500;
      color: #FFFFFF;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 999px;
      line-height: 1.5;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #333;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .card-description {
      font-size: 11px;
      color: #666;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 10px;
    }

    /* ===== Thumbnail Grid ===== */
    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .thumb-item {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 6px;
      overflow: hidden;
      background: #F5F5F5;
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-price {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.55);
      color: #FFFFFF;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      line-height: 1.4;
      font-weight: 500;
    }

    /* ===== 8. Footer Message ===== */
    .footer-message {
      text-align: center;
      padding: 16px 12px 24px;
      font-size: 11px;
      color: #999;
    }

    /* ===== 9. Bottom Tab Bar ===== */
    .bottom-tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 375px;
      height: 56px;
      background: #FFFFFF;
      border-top: 1px solid #EEEEEE;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 200;
    }

    .tab-bar-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      flex: 1;
      position: relative;
    }

    .tab-bar-item .tab-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tab-bar-item .tab-icon svg {
      width: 22px;
      height: 22px;
    }

    .tab-bar-item .tab-label {
      font-size: 10px;
      line-height: 1.3;
    }

    .tab-bar-item.active .tab-icon svg {
      fill: #FF6B81;
      stroke: #FF6B81;
    }

    .tab-bar-item.active .tab-label {
      color: #FF6B81;
    }

    .tab-bar-item.inactive .tab-icon svg {
      fill: none;
      stroke: #999;
    }

    .tab-bar-item.inactive .tab-label {
      color: #999;
    }

    /* Notification dot */
    .notification-dot {
      position: absolute;
      top: 2px;
      right: 50%;
      transform: translateX(14px);
      width: 6px;
      height: 6px;
      background: #FF4444;
      border-radius: 50%;
    }

    /* Center CTA button */
    .center-cta-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .center-cta {
      width: 44px;
      height: 44px;
      background: #FF6B81;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(255, 107, 129, 0.35);
      position: absolute;
      top: -10px;
      cursor: pointer;
    }

    .center-cta svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #FFFFFF;
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    /* ===== Mini Program System Capsule ===== */
    .mp-capsule {
      display: flex;
      align-items: center;
      gap: 0;
      background: #FFFFFF;
      border: 0.5px solid rgba(0, 0, 0, 0.12);
      border-radius: 16px;
      padding: 0;
      height: 24px;
      overflow: hidden;
