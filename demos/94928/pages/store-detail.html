<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>店铺商品列表页</title>
    <style id="theme-vars">
:root {
  --pintuan-bg: #F5F5F5;
  --pintuan-surface: #FFFFFF;
  --pintuan-primary: #FF6B81;
  --pintuan-primary-light: #FFE0E6;
  --pintuan-warning: #FF9500;
  --pintuan-text-primary: #333333;
  --pintuan-text-secondary: #666666;
  --pintuan-text-muted: #999999;
  --pintuan-search-bg: #F0F0F0;
  --pintuan-border: #EEEEEE;
  --pintuan-radius-sm: 4px;
  --pintuan-radius-md: 8px;
  --pintuan-radius-lg: 12px;
  --pintuan-radius-pill: 9999px;
  --pintuan-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --pintuan-font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --pintuan-font-size-xs: 10px;
  --pintuan-font-size-sm: 11px;
  --pintuan-font-size-base: 12px;
  --pintuan-font-size-md: 14px;
  --pintuan-font-size-lg: 15px;
  --pintuan-font-size-xl: 16px;
  --pintuan-font-size-2xl: 18px;
  --pintuan-spacing-1: 4px;
  --pintuan-spacing-2: 8px;
  --pintuan-spacing-3: 12px;
  --pintuan-spacing-4: 16px;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-bg: var(--pintuan-bg);
    --color-surface: var(--pintuan-surface);
    --color-primary: var(--pintuan-primary);
    --color-primary-light: var(--pintuan-primary-light);
    --color-warning: var(--pintuan-warning);
    --color-text-primary: var(--pintuan-text-primary);
    --color-text-secondary: var(--pintuan-text-secondary);
    --color-text-muted: var(--pintuan-text-muted);
    --color-search-bg: var(--pintuan-search-bg);
    --color-border: var(--pintuan-border);
  }

  @layer base {
    body {
      background: var(--pintuan-bg);
      color: var(--pintuan-text-primary);
      font-family: var(--pintuan-font-family);
      font-size: var(--pintuan-font-size-base);
    }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="max-width: 375px; margin: 0 auto;">

    <main class="flex flex-col" style="min-height: 100vh; padding-bottom: 52px;">

      <!-- 1. Status Bar (simulate Android) -->
      <div class="flex items-center justify-between px-4" style="height: 24px; background: var(--pintuan-surface);">
        <span style="font-size: 11px; font-weight: 600; color: var(--pintuan-text-primary);">晚上7:36</span>
        <div class="flex items-center gap-2" style="font-size: 10px; color: var(--pintuan-text-secondary);">
          <span>8.3K/s</span>
          <span style="font-weight: 600;">5G</span>
          <span>21%</span>
          <svg width="16" height="10" viewBox="0 0 16 10" fill="none" style="margin-right: 2px;">
            <rect x="0" y="1" width="13" height="8" rx="1.5" stroke="currentColor" stroke-width="1"/>
            <rect x="1.5" y="2.5" width="8" height="5" rx="0.5" fill="currentColor"/>
            <rect x="14" y="3" width="2" height="4" rx="0.5" fill="currentColor"/>
          </svg>
        </div>
      </div>

      <!-- 2. Nav Bar (WeChat Mini Program style) -->
      <header class="sticky top-0 z-30" style="background: var(--pintuan-surface);">
        <div class="flex items-center px-3" style="height: 44px;">
          <div class="flex items-center gap-1" style="width: 88px;">
            <button class="inline-flex items-center justify-center" style="width: 32px; height: 32px;" data-dom-id="nav-back" aria-label="返回">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <button class="inline-flex items-center justify-center" style="width: 32px; height: 32px;" aria-label="首页">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </button>
          </div>
          <div class="flex-1 flex justify-center">
            <div class="inline-flex items-center justify-center" style="width: 28px; height: 28px; background: #07C160; border-radius: 6px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.858-1.98.28 0 .554.012.826.033C17.506 4.408 13.452 2.188 8.691 2.188zm-2.35 4.476a1.06 1.06 0 1 1 0 2.12 1.06 1.06 0 0 1 0-2.12zm4.712 0a1.06 1.06 0 1 1 0 2.12 1.06 1.06 0 0 1 0-2.12zM24 14.3c0-3.286-3.023-5.953-6.752-5.953S10.496 11.015 10.496 14.3c0 3.287 3.023 5.954 6.752 5.954a8.28 8.28 0 0 0 2.257-.316.647.647 0 0 1 .536.073l1.426.838a.244.244 0 0 0 .125.04.222.222 0 0 0 .218-.222c0-.054-.022-.108-.036-.16l-.293-1.113a.443.443 0 0 1 .16-.498C23.028 17.797 24 16.15 24 14.3zm-9.188-1.01a.797.797 0 1 1 0-1.594.797.797 0 0 1 0 1.594zm4.872 0a.797.797 0 1 1 0-1.594.797.797 0 0 1 0 1.594z"/></svg>
            </div>
          </div>
          <div class="flex items-center rounded-full" style="width: 88px; height: 32px; border: 1px solid var(--pintuan-border); background: rgba(255,255,255,0.9);">
            <button class="flex flex-1 items-center justify-center" aria-label="分享">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
            </button>
            <span style="width: 1px; height: 16px; background: var(--pintuan-border);"></span>
            <button class="flex flex-1 items-center justify-center" aria-label="更多">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
            </button>
          </div>
        </div>
      </header>

      <!-- 3. Owner Info Section -->
      <div class="flex items-center gap-2 px-3 py-2" style="background: var(--pintuan-surface);">
        <img src="../assets/store-avatar.jpg" alt="头像" class="rounded-full" style="width: 40px; height: 40px; object-fit: cover; flex-shrink: 0;" />
        <div class="flex items-center gap-2 flex-1 min-w-0">
          <span class="truncate" style="font-size: var(--pintuan-font-size-md); font-weight: 700; color: var(--pintuan-text-primary);">栀恩</span>
          <button class="inline-flex items-center justify-center whitespace-nowrap" style="height: 24px; padding: 0 10px; background: var(--pintuan-primary); color: white; border-radius: var(--pintuan-radius-pill); font-size: var(--pintuan-font-size-base); font-weight: 500;">关注</button>
        </div>
        <span class="whitespace-nowrap" style="font-size: var(--pintuan-font-size-sm); color: var(--pintuan-text-muted);">团长主页</span>
      </div>

      <!-- 4. Store Header -->
      <div class="flex items-center gap-2 px-3 py-2" style="background: var(--pintuan-surface);">
        <span style="font-size: var(--pintuan-font-size-lg); font-weight: 700; color: var(--pintuan-text-primary);">🧋的金属徽章</span>
        <span class="inline-flex items-center justify-center whitespace-nowrap" style="height: 18px; padding: 0 8px; background: var(--pintuan-warning); color: white; border-radius: var(--pintuan-radius-pill); font-size: var(--pintuan-font-size-xs); font-weight: 500;">已截团</span>
      </div>

      <!-- 5. Store Description Area -->
      <div class="mx-3 mb-2" style="background: #F8F8F8; padding: var(--pintuan-spacing-3); border-radius: var(--pintuan-radius-md);">
        <p style="font-size: var(--pintuan-font-size-sm); color: var(--pintuan-text-muted); line-height: 1.6; margin: 0;">都是无盈利</p>
        <p style="font-size: var(--pintuan-font-size-sm); color: var(--pintuan-text-muted); line-height: 1.6; margin: 0;">没有备注的都是个数摊</p>
        <p style="font-size: var(--pintuan-font-size-sm); color: var(--pintuan-text-muted); line-height: 1.6; margin: 0;">没有🔒+进度的都是未开/没开走</p>
        <p style="font-size: var(--pintuan-font-size-sm); color: var(--pintuan-text-muted); line-height: 1.6; margin: 0;">不懂可以群里问</p>
        <p style="font-size: var(--pintuan-font-size-sm); color: var(--pintuan-text-muted); line-height: 1.6; margin: 0;">祝吃章愉快</p>
        <div class="flex justify-end" style="margin-top: var(--pintuan-spacing-2);">
          <span style="font-size: var(--pintuan-font-size-sm); color: var(--pintuan-text-muted);">0 人气 🔥</span>
        </div>
      </div>

      <!-- 6. Search Bar -->
      <div class="px-3 mb-2" style="background: var(--pintuan-surface);">
        <div class="flex items-center" style="height: 36px; background: var(--pintuan-search-bg); border-radius: var(--pintuan-radius-pill); padding: 0 var(--pintuan-spacing-3);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-right: 6px;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <span style="font-size: var(--pintuan-font-size-base); color: var(--pintuan-text-muted);">搜索商品</span>
        </div>
      </div>

      <!-- 7. Two-Column Content Area -->
      <div class="flex flex-1" style="background: var(--pintuan-surface); min-height: 300px;">
        <!-- Left Sidebar (Categories) -->
        <div class="flex flex-col no-scrollbar" style="width: 80px; background: var(--pintuan-surface); overflow-y: auto; flex-shrink: 0;">
          <div class="flex items-center justify-center" style="height: 44px; font-size: var(--pintuan-font-size-base); color: var(--pintuan-primary); background: var(--pintuan-primary-light); border-left: 3px solid var(--pintuan-primary);">
            <span class="truncate text-center" style="line-height: 1.2;">鸣潮の幻想长条</span>
          </div>
          <div class="flex items-center justify-center" style="height: 44px; font-size: var(--pintuan-font-size-base); color: var(--pintuan-text-secondary);">
            <span class="truncate text-center" style="line-height: 1.2;">鸣潮战斗档案</span>
          </div>
          <div class="flex items-center justify-center" style="height: 44px; font-size: var(--pintuan-font-size-base); color: var(--pintuan-text-secondary);">
            <span class="truncate text-center" style="line-height: 1.2;">鸣潮环</span>
          </div>
          <div class="flex items-center justify-center" style="height: 44px; font-size: var(--pintuan-font-size-base); color: var(--pintuan-text-secondary);">
            <span class="truncate text-center" style="line-height: 1.2;">鸣潮豆豆眼</span>
          </div>
          <div class="flex items-center justify-center" style="height: 44px; font-size: var(--pintuan-font-size-base); color: var(--pintuan-text-secondary);">
            <span class="truncate text-center" style="line-height: 1.2;">鸣潮小方</span>
          </div>
          <div class="flex items-center justify-center" style="height: 44px; font-size: var(--pintuan-font-size-base); color: var(--pintuan-text-secondary);">
            <span class="truncate text-center" style="line-height: 1.2;">界律投影</span>
          </div>
        </div>

        <!-- Right Product Grid -->
        <div class="flex-1 grid grid-cols-2 gap-2 p-2" style="align-content: start;">
          <!-- Card 1: 坠梦奇境 -->
          <div style="background: var(--pintuan-surface); border-radius: var(--pintuan-radius-md); overflow: hidden;">
            <div style="position: relative;">
              <img src="../assets/product-badge-1.jpg" alt="坠梦奇境" style="width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: var(--pintuan-radius-md) var(--pintuan-radius-md) 0 0; display: block;" />
              <span class="inline-flex items-center justify-center whitespace-nowrap" style="position: absolute; top: 6px; right: 6px; height: 16px; padding: 0 5px; background: rgba(0,0,0,0.5); color: white; border-radius: var(--pintuan-radius-sm); font-size: 9px;">2图</span>
            </div>
            <div style="padding: 6px 8px;">
              <p class="truncate" style="font-size: var(--pintuan-font-size-base); color: var(--pintuan-text-primary); margin: 0; line-height: 1.3;">坠梦奇境</p>
              <p style="font-size: var(--pintuan-font-size-base); color: var(--pintuan-primary); font-weight: 700; margin: 2px 0 0 0; line-height: 1.3;">¥0</p>
            </div>
          </div>

          <!-- Card 2: 礼盒达妮娅 -->
          <div style="background: var(--pintuan-surface); border-radius: var(--pintuan-radius-md); overflow: hidden;">
            <img src="../assets/product-badge-2.jpg" alt="礼盒达妮娅" style="width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: var(--pintuan-radius-md) var(--pintuan-radius-md) 0 0; display: block;" />
            <div style="padding: 6px 8px;">
              <p class="truncate" style="font-size: var(--pintuan-font-size-base); color: var(--pintuan-text-primary); margin: 0; line-height: 1.3;">礼盒达妮娅</p>
              <p style="font-size: var(--pintuan-font-size-base); color: var(--pintuan-primary); font-weight: 700; margin: 2px 0 0 0; line-height: 1.3;">¥0</p>
            </div>
          </div>

          <!-- Card 3 -->
          <div style="background: var(--pintuan-surface); border-radius: var(--pintuan-radius-md); overflow: hidden;">
            <img src="../assets/product-badge-3.jpg" alt="商品" style="width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: var(--pintuan-radius-md) var(--pintuan-radius-md) 0 0; display: block;" />
            <div style="padding: 6px 8px;">
              <p class="truncate" style="font-size: var(--pintuan-font-size-base); color: var(--pintuan-text-primary); margin: 0; line-height: 1.3;">莫特斐</p>
              <p style="font-size: var(--pintuan-font-size-base); color: var(--pintuan-primary); font-weight: 700; margin: 2px 0 0 0; line-height: 1.3;">¥0</p>
            </div>
          </div>

          <!-- Card 4: TwinkleChoir -->
          <div style="background: var(--pintuan-surface); border-radius: var(--pintuan-radius-md); overflow: hidden;">
            <div style="position: relative;">
              <img src="../assets/product-badge-4.jpg" alt="TwinkleChoir" style="width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: var(--pintuan-radius-md) var(--pintuan-radius-md) 0 0; display: block;" />
              <span class="inline-flex items-center justify-center whitespace-nowrap" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 10px; color: rgba(255,255,255,0.8); text-shadow: 0 1px 2px rgba(0,0,0,0.3);">仅供展示</span>
            </div>
            <div style="padding: 6px 8px;">
              <p class="truncate" style="font-size: var(--pintuan-font-size-base); color: var(--pintuan-text-primary); margin: 0; line-height: 1.3;">TwinkleChoir</p>
              <p style="font-size: var(--pintuan-font-size-base); color: var(--pintuan-primary); font-weight: 700; margin: 2px 0 0 0; line-height: 1.3;">¥0</p>
            </div>
          </div>
        </div>
      </div>

    </main>

    <!-- 8. Bottom Action Bar (fixed) -->
    <div class="fixed bottom-0 left-0 right-0 z-30" style="max-width: 375px; margin: 0 auto; background: var(--pintuan-surface); border-top: 1px solid var(--pintuan-border);">
      <div class="flex items-center justify-between px-4" style="height: 50px;">
        <button class="flex items-center justify-center gap-1" style="font-size: var(--pintuan-font-size-base); color: var(--pintuan-text-secondary);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span>工具</span>
        </button>
        <button class="flex items-center justify-center gap-1" style="font-size: var(--pintuan-font-size-base); color: var(--pintuan-text-secondary);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><path d="M22 2L15 22L11 13L2 9L22 2Z"></path></svg>
          <span>转发</span>
        </button>
      </div>
      <div style="height: env(safe-area-inset-bottom, 0px);"></div>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
