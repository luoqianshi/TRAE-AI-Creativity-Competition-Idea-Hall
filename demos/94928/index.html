<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>幻樱物语 · 虚拟购物</title>
<style id="theme-vars">
:root {
  --pintuan-bg: #F5F5F5;
  --pintuan-surface: #FFFFFF;
  --pintuan-primary: #FF6B81;
  --pintuan-primary-light: #FFE0E6;
  --pintuan-warning: #FF9500;
  --pintuan-text-primary: #333333;
  --pintuan-text-secondary: #666666;
  --pintuan-text-muted: #999999;
  --pintuan-search-bg: #F0F0F0;
  --pintuan-border: #EEEEEE;
  --pintuan-radius-sm: 4px;
  --pintuan-radius-md: 8px;
  --pintuan-radius-lg: 12px;
  --pintuan-radius-pill: 9999px;
  --pintuan-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --pintuan-font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --pintuan-font-size-xs: 10px;
  --pintuan-font-size-sm: 11px;
  --pintuan-font-size-base: 12px;
  --pintuan-font-size-md: 14px;
  --pintuan-font-size-lg: 15px;
  --pintuan-font-size-xl: 16px;
  --pintuan-font-size-2xl: 18px;
}
</style>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--pintuan-font-family);
    background: var(--pintuan-bg);
    color: var(--pintuan-text-primary);
    line-height: 1.5;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* 手机壳 */
  .phone-frame {
    width: 375px;
    min-height: 100vh;
    margin: 0 auto;
    background: var(--pintuan-bg);
    position: relative;
    overflow-y: auto;
    padding-bottom: 70px;
  }

  /* 状态栏 */
  .status-bar {
    width: 100%;
    height: 24px;
    background: var(--pintuan-surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    font-size: 11px;
    font-weight: 500;
    color: var(--pintuan-text-primary);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .status-bar-left { display: flex; align-items: center; gap: 4px; }
  .status-bar-right { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--pintuan-text-secondary); }
  .status-bar .time { font-size: 11px; font-weight: 600; }

  /* 顶部导航 */
  .app-header {
    width: 100%;
    height: 44px;
    background: var(--pintuan-surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    position: sticky;
    top: 24px;
    z-index: 99;
    border-bottom: 1px solid var(--pintuan-border);
  }
  .app-header-left { display: flex; align-items: center; gap: 8px; }
  .app-logo {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, #FF6B81, #FF8FA3);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 14px; font-weight: 700;
  }
  .app-name { font-size: 15px; font-weight: 700; color: var(--pintuan-text-primary); }
  .app-header-right { display: flex; align-items: center; gap: 6px; }
  .balance-pill {
    background: var(--pintuan-primary-light);
    color: var(--pintuan-primary);
    padding: 4px 10px;
    border-radius: var(--pintuan-radius-pill);
    font-size: 11px;
    font-weight: 600;
    display: flex; align-items: center; gap: 3px;
    cursor: pointer;
  }

  /* 页面容器 */
  .page { display: none; }
  .page.active { display: block; }

  /* 用户问候 */
  .user-greeting {
    display: flex;
    align-items: center;
    padding: 10px 12px 0;
    gap: 8px;
    background: var(--pintuan-surface);
  }
  .greeting-text { font-size: 14px; color: var(--pintuan-text-primary); font-weight: 500; }
  .pill-badge {
    background: var(--pintuan-search-bg);
    color: var(--pintuan-text-muted);
    font-size: 10px;
    padding: 2px 10px;
    border-radius: var(--pintuan-radius-pill);
    line-height: 1.5;
  }

  /* Tab 导航 */
  .tab-nav {
    display: flex;
    align-items: center;
    padding: 12px 12px 0;
    border-bottom: 1px solid var(--pintuan-border);
    background: var(--pintuan-surface);
  }
  .tab-item {
    position: relative;
    padding: 0 0 10px;
    margin-right: 24px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .tab-item.active { color: var(--pintuan-text-primary); font-weight: 600; }
  .tab-item.active::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: var(--pintuan-primary);
    border-radius: 1px;
  }
  .tab-item.inactive { color: var(--pintuan-text-muted); font-weight: 400; }

  /* 搜索栏 */
  .search-bar-wrapper {
    padding: 10px 12px;
    background: var(--pintuan-surface);
  }
  .search-bar {
    width: 100%;
    height: 36px;
    background: var(--pintuan-search-bg);
    border-radius: var(--pintuan-radius-pill);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
  }
  .search-bar svg { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: var(--pintuan-text-muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .search-placeholder { font-size: 13px; color: var(--pintuan-text-muted); }

  /* 分类栏 */
  .category-bar {
    display: flex;
    gap: 8px;
    padding: 8px 12px 12px;
    background: var(--pintuan-surface);
    overflow-x: auto;
    border-bottom: 1px solid var(--pintuan-border);
  }
  .category-bar::-webkit-scrollbar { display: none; }
  .cat-chip {
    padding: 6px 14px;
    background: var(--pintuan-search-bg);
    border-radius: var(--pintuan-radius-pill);
    font-size: 12px;
    color: var(--pintuan-text-secondary);
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s;
  }
  .cat-chip.active { background: var(--pintuan-primary); color: #fff; }

  /* 内容卡片 (来自原型) */
  .content-cards { padding: 8px 12px; }
  .content-card {
    background: var(--pintuan-surface);
    border-radius: var(--pintuan-radius-md);
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid rgba(0, 0, 0, 0.03);
  }
  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .card-date { font-size: 11px; color: var(--pintuan-text-muted); }
  .card-status-badge {
    background: var(--pintuan-warning);
    color: #fff;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: var(--pintuan-radius-pill);
    line-height: 1.5;
    flex-shrink: 0;
  }
  .card-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--pintuan-text-primary);
    margin-bottom: 4px;
    line-height: 1.4;
  }
  .card-description {
    font-size: 11px;
    color: var(--pintuan-text-secondary);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .thumb-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
  }
  .thumb-item {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    border-radius: 6px;
    overflow: hidden;
    background: var(--pintuan-search-bg);
    cursor: pointer;
  }
  .thumb-item img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .thumb-item:active { transform: scale(0.97); }
  .thumb-price {
    position: absolute;
    bottom: 4px; right: 4px;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    line-height: 1.4;
    font-weight: 500;
  }
  .thumb-add {
    position: absolute;
    top: 4px; right: 4px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--pintuan-primary);
    color: #fff;
    font-size: 16px;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    box-shadow: 0 2px 6px rgba(255, 107, 129, 0.4);
  }
  .thumb-add:active { transform: scale(0.85); }

  /* 店铺信息 (来自原型) */
  .owner-info {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--pintuan-surface);
  }
  .owner-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
  }
  .owner-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--pintuan-text-primary);
  }
  .follow-btn {
    height: 24px;
    padding: 0 10px;
    background: var(--pintuan-primary);
    color: #fff;
    border-radius: var(--pintuan-radius-pill);
    font-size: 12px;
    font-weight: 500;
    border: none;
    cursor: pointer;
    margin-left: 8px;
  }
  .owner-meta {
    font-size: 11px;
    color: var(--pintuan-text-muted);
    margin-left: auto;
  }

  /* 店铺描述区 (来自原型) */
  .store-desc {
    margin: 0 12px 8px;
    background: #F8F8F8;
    padding: 12px;
    border-radius: var(--pintuan-radius-md);
  }
  .store-desc p {
    font-size: 11px;
    color: var(--pintuan-text-muted);
    line-height: 1.6;
    margin: 0;
  }
  .store-desc .popularity {
    display: flex;
    justify-content: flex-end;
    margin-top: 8px;
    font-size: 11px;
    color: var(--pintuan-text-muted);
  }

  /* 两栏布局 (来自原型) */
  .two-col {
    display: flex;
    background: var(--pintuan-surface);
    min-height: 300px;
  }
  .cat-sidebar {
    width: 80px;
    background: var(--pintuan-surface);
    overflow-y: auto;
    flex-shrink: 0;
  }
  .cat-side-item {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--pintuan-text-secondary);
    cursor: pointer;
    padding: 0 4px;
  }
  .cat-side-item.active {
    color: var(--pintuan-primary);
    background: var(--pintuan-primary-light);
    border-left: 3px solid var(--pintuan-primary);
  }
  .cat-side-item span {
    truncate: true;
    text-align: center;
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .product-grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 8px;
    align-content: start;
  }
  .product-card {
    background: var(--pintuan-surface);
    border-radius: var(--pintuan-radius-md);
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }
  .product-card:active { transform: scale(0.98); }
  .product-card img {
    width: 100%;
    aspect-ratio: 1/1;
    object-fit: cover;
    display: block;
  }
  .product-card .img-count {
    position: absolute;
    top: 6px; right: 6px;
    background: rgba(0,0,0,0.5);
    color: #fff;
    font-size: 9px;
    padding: 1px 5px;
    border-radius: var(--pintuan-radius-sm);
  }
  .product-card .add-corner {
    position: absolute;
    bottom: 36px; right: 6px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--pintuan-primary);
    color: #fff;
    font-size: 16px;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    box-shadow: 0 2px 6px rgba(255, 107, 129, 0.4);
  }
  .product-card .add-corner:active { transform: scale(0.85); }
  .product-card .info { padding: 6px 8px; }
  .product-card .name {
    font-size: 12px;
    color: var(--pintuan-text-primary);
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin: 0;
  }
  .product-card .price {
    font-size: 12px;
    color: var(--pintuan-primary);
    font-weight: 700;
    margin: 2px 0 0 0;
    line-height: 1.3;
  }

  /* 购物车 */
  .cart-list { padding: 8px 12px; }
  .cart-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--pintuan-surface);
    border-radius: var(--pintuan-radius-md);
    padding: 10px;
    margin-bottom: 8px;
    border: 1px solid rgba(0,0,0,0.03);
  }
  .cart-item .cart-thumb {
    width: 60px; height: 60px;
    border-radius: var(--pintuan-radius-sm);
    flex-shrink: 0;
    object-fit: cover;
  }
  .cart-item .info { flex: 1; min-width: 0; }
  .cart-item .name {
    font-size: 13px;
    color: var(--pintuan-text-primary);
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cart-item .price {
    font-size: 14px;
    color: var(--pintuan-primary);
    font-weight: 700;
  }
  .qty-ctrl { display: flex; align-items: center; gap: 6px; }
  .qty-ctrl button {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--pintuan-search-bg);
    border: none;
    color: var(--pintuan-text-secondary);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .qty-ctrl .qty {
    min-width: 20px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--pintuan-text-primary);
  }
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--pintuan-text-muted);
  }
  .empty-state .emoji { font-size: 56px; margin-bottom: 12px; opacity: 0.6; }
  .empty-state .text { font-size: 13px; }
  .empty-state .sub { font-size: 11px; margin-top: 6px; }

  /* 结算栏 */
  .checkout-bar {
    position: fixed;
    bottom: 56px; left: 50%;
    transform: translateX(-50%);
    width: 375px;
    padding: 10px 12px;
    background: var(--pintuan-surface);
    border-top: 1px solid var(--pintuan-border);
    display: none;
    align-items: center;
    gap: 10px;
    z-index: 200;
  }
  .checkout-bar.show { display: flex; }
  .checkout-bar .total { flex: 1; }
  .checkout-bar .total-label { font-size: 11px; color: var(--pintuan-text-muted); }
  .checkout-bar .total-amount { font-size: 18px; font-weight: 700; color: var(--pintuan-primary); }
  .checkout-btn {
    background: var(--pintuan-primary);
    color: #fff;
    border: none;
    padding: 10px 24px;
    border-radius: var(--pintuan-radius-pill);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .checkout-btn:active { transform: scale(0.97); }

  /* 订单 */
  .order-list { padding: 8px 12px; }
  .order-card {
    background: var(--pintuan-surface);
    border-radius: var(--pintuan-radius-md);
    padding: 12px;
    margin-bottom: 10px;
    border: 1px solid rgba(0,0,0,0.03);
  }
  .order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--pintuan-border);
  }
  .order-no { font-size: 11px; color: var(--pintuan-text-muted); }
  .order-status {
    font-size: 10px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: var(--pintuan-radius-pill);
    line-height: 1.5;
  }
  .status-pending { background: #FFF8E1; color: var(--pintuan-warning); }
  .status-shipping { background: var(--pintuan-primary-light); color: var(--pintuan-primary); }
  .status-delivered { background: #E8F5E9; color: #4CAF50; }
  .status-reviewed { background: var(--pintuan-search-bg); color: var(--pintuan-text-muted); }
  .order-products { display: flex; margin-bottom: 10px; }
  .order-products .badge-stack {
    width: 40px; height: 40px;
    border-radius: var(--pintuan-radius-sm);
    margin-right: -8px;
    object-fit: cover;
    border: 2px solid var(--pintuan-surface);
  }
  .order-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .order-total { font-size: 13px; color: var(--pintuan-primary); font-weight: 700; }
  .order-actions { display: flex; gap: 6px; }
  .order-actions button {
    padding: 5px 12px;
    border-radius: var(--pintuan-radius-pill);
    font-size: 11px;
    border: 1px solid var(--pintuan-primary);
    background: transparent;
    color: var(--pintuan-primary);
    cursor: pointer;
    line-height: 1.5;
  }
  .order-actions button.primary { background: var(--pintuan-primary); color: #fff; }

  /* 物流 */
  .logistics {
    margin-top: 10px;
    padding: 10px;
    background: #FAFAFA;
    border-radius: var(--pintuan-radius-sm);
    border-left: 2px solid var(--pintuan-primary);
  }
  .logistics-title { font-size: 11px; color: var(--pintuan-text-muted); margin-bottom: 8px; }
  .logistics-track { display: flex; flex-direction: column; gap: 10px; }
  .track-node {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    position: relative;
  }
  .track-node::before {
    content: '';
    position: absolute;
    left: 4px; top: 14px;
    width: 1px; height: 14px;
    background: var(--pintuan-border);
  }
  .track-node:last-child::before { display: none; }
  .track-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--pintuan-surface);
    border: 2px solid var(--pintuan-border);
    flex-shrink: 0;
    margin-top: 2px;
  }
  .track-dot.active { background: var(--pintuan-primary); border-color: var(--pintuan-primary); }
  .track-content { flex: 1; }
  .track-title { font-size: 12px; color: var(--pintuan-text-primary); font-weight: 500; line-height: 1.3; }
  .track-time { font-size: 10px; color: var(--pintuan-text-muted); margin-top: 1px; }

  /* 我的页 */
  .profile-header {
    background: var(--pintuan-surface);
    padding: 20px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FF6B81, #FF8FA3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    color: #fff;
    flex-shrink: 0;
  }
  .profile-info { flex: 1; }
  .username { font-size: 16px; font-weight: 700; color: var(--pintuan-text-primary); margin-bottom: 4px; }
  .user-tag {
    display: inline-block;
    background: var(--pintuan-primary-light);
    color: var(--pintuan-primary);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: var(--pintuan-radius-pill);
  }

  /* 钱包卡片 - 微信充值风格 */
  .wallet-card {
    margin: 12px;
    padding: 16px;
    border-radius: var(--pintuan-radius-lg);
    background: var(--pintuan-surface);
    border: 1px solid var(--pintuan-border);
  }
  .wallet-label { font-size: 12px; color: var(--pintuan-text-muted); margin-bottom: 6px; }
  .wallet-balance {
    font-size: 28px;
    font-weight: 700;
    color: var(--pintuan-text-primary);
    margin-bottom: 14px;
    line-height: 1;
  }
  .wallet-balance .yen { font-size: 16px; margin-right: 2px; color: var(--pintuan-text-secondary); }
  .recharge-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .recharge-amt {
    padding: 12px 0;
    background: var(--pintuan-search-bg);
    border-radius: var(--pintuan-radius-md);
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    border: 1.5px solid transparent;
  }
  .recharge-amt:active { transform: scale(0.96); }
  .recharge-amt.selected {
    background: var(--pintuan-primary-light);
    border-color: var(--pintuan-primary);
  }
  .recharge-amt .amt { font-size: 15px; font-weight: 700; color: var(--pintuan-text-primary); }

  return `${d.getMonth()+1}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function genOrderNo() {
  return 'HY' + Date.now().toString().slice(-8) + Math.floor(Math.random()*100);
}
function findProduct(id) {
  return ALL_PRODUCTS.find(x => x.id == id);
}

/* ============ 渲染:首页 ============ */
function renderTopBalance() {
  document.getElementById('topBalance').textContent = state.balance.toFixed(0);
}
function renderHomeCards() {
  const c = document.getElementById('homeCards');
  c.innerHTML = HOME_CARDS.map(card => `
    <div class="content-card" onclick="goToStore('${card.storeId}')">
      <div class="card-header">
        <span class="card-date">${card.date}</span>
        <span class="card-status-badge">${card.status}</span>
      </div>
      <div class="card-title">${card.title}</div>
      <div class="card-description">${card.desc}</div>
      <div class="thumb-grid">
        ${card.thumbs.map(t => `
          <div class="thumb-item" onclick="event.stopPropagation(); viewProduct(${t.pid})">
            <img src="${t.img}" alt="徽章">
            <span class="thumb-price">${t.price}</span>
            <button class="thumb-add" onclick="event.stopPropagation(); addToCart(${t.pid})">+</button>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}
function goToStore(storeId) {
  switchTab('store');
}
function switchSubTab(tab) {
  if (tab === 'follow') {
    showToast('暂无关注内容');
    return;
  }
  document.querySelectorAll('#page-home .tab-item').forEach((t, i) => {
    t.classList.toggle('active', i === 0);
    t.classList.toggle('inactive', i !== 0);
  });
}

/* ============ 渲染:店铺页 ============ */
function renderStoreCategories() {
  const sb = document.getElementById('catSidebar');
  sb.innerHTML = STORE_CATEGORIES.map(c => `
    <div class="cat-side-item ${c.id === state.currentStoreCat ? 'active' : ''}" onclick="selectStoreCat('${c.id}')">
      <span>${c.name}</span>
    </div>
  `).join('');
}
function selectStoreCat(id) {
  state.currentStoreCat = id;
  renderStoreCategories();
  renderStoreProducts();
}
function renderStoreProducts() {
  const grid = document.getElementById('storeProducts');
  const list = STORE_PRODUCTS; // 原型只有4个商品,全显示
  grid.innerHTML = list.map(p => `
    <div class="product-card" onclick="viewProduct(${p.id})">
      <div style="position:relative;">
        <img src="${p.img}" alt="${p.name}">
        <span class="img-count">${p.count}</span>
      </div>
      <button class="add-corner" onclick="event.stopPropagation(); addToCart(${p.id})">+</button>
      <div class="info">
        <p class="name">${p.name}</p>
        <p class="price">¥${p.price.toFixed(2)}</p>
      </div>
    </div>
  `).join('');
}

/* ============ 渲染:购物车 ============ */
function renderCart() {
  const c = document.getElementById('cartContent');
  const items = Object.keys(state.cart);
  if (items.length === 0) {
    c.innerHTML = `
      <div class="empty-state">
        <div class="emoji">🛒</div>
        <div class="text">购物车空空如也</div>
        <div class="sub">去首页发现更多可爱徽章</div>
      </div>
    `;
    document.getElementById('checkoutBar').classList.remove('show');
    return;
  }
  let total = 0;
  c.innerHTML = items.map(id => {
    const p = findProduct(id);
    if (!p) return '';
    const qty = state.cart[id];
    total += p.price * qty;
    return `
      <div class="cart-item">
        <img src="${p.img}" class="cart-thumb" alt="${p.name}">
        <div class="info">
          <div class="name">${p.name}</div>
          <div class="price">¥${p.price.toFixed(2)}</div>
        </div>
        <div class="qty-ctrl">
          <button onclick="changeQty(${id}, -1)">−</button>
          <span class="qty">${qty}</span>
          <button onclick="changeQty(${id}, 1)">+</button>
        </div>
      </div>
    `;
  }).join('');
  document.getElementById('checkoutBar').classList.add('show');
  document.getElementById('cartTotal').textContent = total.toFixed(2);
}
function renderCartBadge() {
  const count = Object.values(state.cart).reduce((a,b)=>a+b, 0);
  const badge = document.getElementById('cartBadge');
  if (count > 0) {
    badge.classList.add('show');
    badge.textContent = count > 99 ? '99+' : count;
  } else {
    badge.classList.remove('show');
  }
}

/* ============ 渲染:订单 ============ */
function renderOrders() {
  const c = document.getElementById('ordersContent');
  if (state.orders.length === 0) {
    c.innerHTML = `
      <div class="empty-state">
        <div class="emoji">📦</div>
        <div class="text">还没有订单</div>
        <div class="sub">下单后可在此追踪物流</div>
      </div>
    `;
    return;
  }
  c.innerHTML = state.orders.slice().reverse().map(o => {
    const statusMap = {
      'pending': { txt: '待发货', cls: 'status-pending' },
      'shipping': { txt: '配送中', cls: 'status-shipping' },
      'delivered': { txt: '已签收', cls: 'status-delivered' },
      'reviewed': { txt: '已评价', cls: 'status-reviewed' }
    };
    const st = statusMap[o.status];
    const prods = o.items.map(it => {
      const p = findProduct(it.id);
      return p ? `<img src="${p.img}" class="badge-stack" alt="${p.name}">` : '';
    }).join('');
    let logistics = o.status !== 'pending' ? renderLogistics(o) : '';
    let actions = '';
    if (o.status === 'delivered') {
      actions = `<button class="primary" onclick="reviewOrder(${o.id})">去评价</button>`;
    } else if (o.status === 'reviewed') {
      actions = `<button onclick="showToast('已评价 ${o.review.stars}星')">查看评价</button>`;
    }
    return `
      <div class="order-card">
        <div class="order-header">
          <span class="order-no">订单号: ${o.orderNo}</span>
          <span class="order-status ${st.cls}">${st.txt}</span>
        </div>
        <div class="order-products">${prods}</div>
        <div class="order-footer">
          <div class="order-total">共${o.items.length}件 合计 ¥${o.total.toFixed(2)}</div>
          <div class="order-actions">${actions}</div>
        </div>
        ${logistics}
      </div>
    `;
  }).join('');
}
function renderLogistics(order) {
  const tracks = [
    { title: '订单已支付', time: order.payTime, done: true },
    { title: '商家已发货', time: order.shipTime, done: order.status !== 'pending' },
    { title: '运输中·幻樱速递', time: order.transitTime, done: ['shipping','delivered','reviewed'].includes(order.status) },
    { title: '派送中·快递员小樱', time: order.deliveryTime, done: ['shipping','delivered','reviewed'].includes(order.status) },
    { title: '已签收', time: order.receiveTime, done: ['delivered','reviewed'].includes(order.status) }
  ];
  return `
    <div class="logistics">
      <div class="logistics-title">🚚 物流追踪</div>
      <div class="logistics-track">
        ${tracks.map(t => `
          <div class="track-node">
            <div class="track-dot ${t.done ? 'active' : ''}"></div>
            <div class="track-content">
              <div class="track-title">${t.title}</div>
              <div class="track-time">${t.time || '待更新'}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

/* ============ 渲染:钱包 ============ */
function renderWallet() {
  document.getElementById('walletBalance').textContent = state.balance.toFixed(2);
  const grid = document.getElementById('rechargeGrid');
  grid.innerHTML = RECHARGE_OPTIONS.map((r, i) => `
    <div class="recharge-amt ${state.selectedRecharge === i ? 'selected' : ''}" onclick="selectRecharge(${i})">
      <div class="amt">¥${r.amt}</div>
      ${r.gift > 0 ? `<div class="gift">赠¥${r.gift}</div>` : '<div class="gift">&nbsp;</div>'}
    </div>
  `).join('');
}
function selectRecharge(i) {
  state.selectedRecharge = i;
  renderWallet();
}
function doRecharge() {
  if (state.selectedRecharge === null) {
    showToast('请先选择充值金额');
    return;
  }
  const opt = RECHARGE_OPTIONS[state.selectedRecharge];
  const total = opt.amt + opt.gift;
  showModal(`
    <div class="modal-title">确认充值</div>
    <div class="modal-body">
      充值金额:<b style="color:var(--pintuan-warning);">¥${opt.amt}</b><br>
      ${opt.gift > 0 ? `赠送金额:<b style="color:var(--pintuan-primary);">¥${opt.gift}</b><br>` : ''}
      实际到账:<b style="color:var(--pintuan-primary);font-size:18px;">¥${total}</b><br>
      <span style="font-size:11px;color:var(--pintuan-text-muted);">虚拟货币,不会真实扣款</span>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-confirm" onclick="confirmRecharge()">确认充值</button>
    </div>
  `);
}
function confirmRecharge() {
  const opt = RECHARGE_OPTIONS[state.selectedRecharge];
  state.balance += opt.amt + opt.gift;
  saveState();
  renderWallet();
  renderTopBalance();
  closeModal();
  showToast('充值成功 ¥' + (opt.amt + opt.gift));
}

/* ============ 购物逻辑 ============ */
function addToCart(id) {
  state.cart[id] = (state.cart[id] || 0) + 1;
  saveState();
  renderCartBadge();
  const p = findProduct(id);
  showToast(`已加入:${p.name}`);
}
function changeQty(id, delta) {
  state.cart[id] = (state.cart[id] || 0) + delta;
  if (state.cart[id] <= 0) delete state.cart[id];
  saveState();
  renderCart();
  renderCartBadge();
}
function viewProduct(id) {
  const p = findProduct(id);
  if (!p) return;
  showModal(`
    <div class="modal-title">商品详情</div>
    <img src="${p.img}" class="pd-img" alt="${p.name}">
    <div class="pd-name">${p.name}</div>
    <div class="pd-price">¥${p.price.toFixed(2)}</div>
    <div class="pd-meta">虚拟商品 · 仅供娱乐</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">再看看</button>
      <button class="btn-confirm" onclick="closeModal(); addToCart(${p.id});">加入购物车</button>
    </div>
  `);
}
function checkout() {
  const items = Object.keys(state.cart);
  if (items.length === 0) return;
  let total = 0;
  const itemList = items.map(id => {
    const p = findProduct(id);
    const qty = state.cart[id];
    total += p.price * qty;
    return { id: Number(id), qty };
  });
  if (state.balance < total) {
    showModal(`
      <div class="modal-title">余额不足</div>
      <div class="modal-body">
        订单需支付 <b style="color:var(--pintuan-primary);">¥${total.toFixed(2)}</b><br>
        当前余额 <b style="color:var(--pintuan-warning);">¥${state.balance.toFixed(2)}</b><br>
        还差 <b style="color:#ff4444;">¥${(total - state.balance).toFixed(2)}</b><br>
        <span style="font-size:11px;color:var(--pintuan-text-muted);">虚拟充值不会真扣钱</span>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-confirm" onclick="closeModal(); switchTab('profile');">去充值</button>
      </div>
    `);
    return;
  }
  showModal(`
    <div class="modal-title">确认订单</div>
    <div style="background:var(--pintuan-search-bg);border-radius:8px;padding:10px;margin-bottom:12px;">
      ${itemList.map(it => {
        const p = findProduct(it.id);
        return `<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12px;">
          <span>${p.name} ×${it.qty}</span>
          <span style="color:var(--pintuan-primary);">¥${(p.price*it.qty).toFixed(2)}</span>
        </div>`;
      }).join('')}
      <div style="border-top:1px dashed var(--pintuan-border);margin-top:6px;padding-top:6px;display:flex;justify-content:space-between;font-weight:700;font-size:13px;">
        <span>合计</span>
        <span style="color:var(--pintuan-primary);">¥${total.toFixed(2)}</span>
      </div>
    </div>
    <div style="font-size:11px;color:var(--pintuan-text-muted);margin-bottom:12px;text-align:center;">
      余额 ¥${state.balance.toFixed(2)} · 支付后 ¥${(state.balance-total).toFixed(2)}
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-confirm" onclick="confirmPay(${total})">确认支付</button>
    </div>
  `);
}
function confirmPay(total) {
  const items = Object.keys(state.cart).map(id => ({ id: Number(id), qty: state.cart[id] }));
  const now = new Date();
  state.balance -= total;
  const order = {
    id: Date.now(),
    orderNo: genOrderNo(),
    items, total,
    status: 'pending',
    payTime: formatTime(now),
    shipTime: null, transitTime: null, deliveryTime: null, receiveTime: null,
    review: null
  };
  state.orders.push(order);
  state.cart = {};
  saveState();
  renderWallet();
  renderTopBalance();
  renderCart();
  renderCartBadge();
  closeModal();
  showModal(`
    <div class="modal-title">支付成功</div>
    <div style="text-align:center;padding:10px 0;">
      <div style="font-size:48px;margin-bottom:8px;">✓</div>
      <div style="color:var(--pintuan-primary);font-size:15px;font-weight:700;">下单成功</div>
      <div style="margin-top:6px;color:var(--pintuan-text-muted);font-size:12px;">
        已支付 ¥${total.toFixed(2)}<br>快递小哥马上来取件
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal(); switchTab('home');">继续逛</button>
      <button class="btn-confirm" onclick="closeModal(); switchTab('orders'); startShipping(${order.id});">查看订单</button>
    </div>
  `);
}

/* ============ 物流 ============ */
function startShipping(orderId) {
  const order = state.orders.find(o => o.id === orderId);
  if (!order || order.status !== 'pending') return;
  order.status = 'shipping';
  order.shipTime = formatTime(new Date());
  saveState();
  renderOrders();
  showToast('商家已发货');
  setTimeout(() => {
    const o = state.orders.find(x => x.id === orderId);
    if (o && o.status === 'shipping') {
      o.transitTime = formatTime(new Date());
      saveState(); renderOrders();
    }
  }, 4000);
  setTimeout(() => {
    const o = state.orders.find(x => x.id === orderId);
    if (o && o.status === 'shipping') {
      o.deliveryTime = formatTime(new Date());
      saveState(); renderOrders();
      showToast('快递员小樱正在派送');
    }
  }, 8000);
  setTimeout(() => {
    const o = state.orders.find(x => x.id === orderId);
    if (o && o.status === 'shipping') {
      o.status = 'delivered';
      o.receiveTime = formatTime(new Date());
      saveState(); renderOrders();
      showToast('包裹已签收');
    }
  }, 12000);
}

/* ============ 评价 ============ */
let currentReviewStars = 5;
function reviewOrder(orderId) {
  currentReviewStars = 5;
  showModal(`
    <div class="modal-title">评价订单</div>
    <div style="text-align:center;font-size:12px;color:var(--pintuan-text-muted);margin-bottom:4px;">给本次购物打分</div>
    <div class="star-rating" id="starRating">
      ${[1,2,3,4,5].map(i => `<span class="star active" onclick="setStar(${i})">★</span>`).join('')}
    </div>
    <textarea class="review-text" id="reviewText" placeholder="分享你的购物体验 (选填)"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">跳过</button>
      <button class="btn-confirm" onclick="submitReview(${orderId})">提交评价</button>
    </div>
  `);
}
function setStar(n) {
  currentReviewStars = n;
  document.querySelectorAll('#starRating .star').forEach((s, i) => {
    s.className = 'star' + (i < n ? ' active' : '');
  });
}
function submitReview(orderId) {
  const text = document.getElementById('reviewText').value.trim() || '匿名用户觉得很赞';
  const order = state.orders.find(o => o.id === orderId);
  order.status = 'reviewed';
  order.review = { stars: currentReviewStars, text };
  saveState();
  renderOrders();
  closeModal();
  showToast(`评价成功 ${currentReviewStars}星`);
}

/* ============ 导航 ============ */
function switchTab(tab) {
  document.querySelectorAll('.tab-bar-item').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const page = document.getElementById('page-' + tab);
  if (page) page.classList.add('active');
  const titles = { home: '幻樱物语', store: '店铺', cart: '购物车', orders: '我的订单', profile: '我的' };
  document.getElementById('pageTitle').textContent = titles[tab] || '幻樱物语';
  const checkoutBar = document.getElementById('checkoutBar');
  const bottomBar = document.querySelector('.bottom-tab-bar');
  if (tab === 'cart') {
    renderCart();
  } else {
    checkoutBar.classList.remove('show');
  }
  if (tab === 'store') {
    bottomBar.style.display = 'none';
    checkoutBar.style.display = 'none';
  } else {
    bottomBar.style.display = 'flex';
  }
  if (tab === 'orders') renderOrders();
  if (tab === 'profile') renderWallet();
  window.scrollTo(0, 0);
}
function goBack() {
  switchTab('home');
}

/* ============ 初始化 ============ */
function init() {
  loadState();
  renderTopBalance();
  renderHomeCards();
  renderStoreCategories();
  renderStoreProducts();
  renderCartBadge();
  renderWallet();
  state.orders.forEach(o => {
    if (o.status === 'shipping') startShipping(o.id);
  });
}
init();
document.getElementById('modalMask').addEventListener('click', e => {
  if (e.target.id === 'modalMask') closeModal();
});
</script>
</body>
</html>
