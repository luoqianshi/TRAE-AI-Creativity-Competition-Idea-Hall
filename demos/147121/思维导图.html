<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>思维导图 · Mind Map</title>
<style>
  /* ===================== 主题变量 ===================== */
  :root,
  [data-theme="light"] {
    --bg-1: #f6f8fc;
    --bg-2: #e8eef7;
    --node-bg: #ffffff;
    --node-text: #3d4654;
    --node-shadow: 0 4px 14px rgba(60, 80, 120, 0.10), 0 1px 3px rgba(60, 80, 120, 0.06);
    --line-color: #c5cfe0;
    --selected: #5b8def;
    --toolbar-bg: rgba(255, 255, 255, 0.78);
    --toolbar-border: rgba(120, 140, 180, 0.18);
    --toolbar-text: #4a5568;
    --menu-bg: rgba(255, 255, 255, 0.94);
    --menu-text: #3d4654;
    --menu-hover: rgba(91, 141, 239, 0.10);
    --panel-border: rgba(120, 140, 180, 0.20);
    --hint-text: #8a96a8;
    --export-bg: #eef2f7;
  }
  [data-theme="dark"] {
    --bg-1: #1b2233;
    --bg-2: #0e131d;
    --node-bg: #27314a;
    --node-text: #e4ebf5;
    --node-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    --line-color: #465670;
    --selected: #7aa2f7;
    --toolbar-bg: rgba(24, 30, 46, 0.78);
    --toolbar-border: rgba(120, 140, 180, 0.20);
    --toolbar-text: #c2cee0;
    --menu-bg: rgba(30, 38, 58, 0.96);
    --menu-text: #d6deea;
    --menu-hover: rgba(122, 162, 247, 0.16);
    --panel-border: rgba(120, 140, 180, 0.25);
    --hint-text: #7e8aa0;
    --export-bg: #0e131d;
  }

  /* ===================== 全局 ===================== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    color: var(--node-text);
    transition: background 0.4s ease, color 0.3s ease;
  }

  /* ===================== 工具栏 ===================== */
  .toolbar {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 10px;
    background: var(--toolbar-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--toolbar-border);
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(40, 60, 100, 0.12);
    transition: background 0.4s ease, border-color 0.3s ease;
  }
  .tb-btn {
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--toolbar-text);
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease;
  }
  .tb-btn svg { width: 18px; height: 18px; }
  .tb-btn:hover {
    background: var(--menu-hover);
    color: var(--selected);
  }
  .tb-btn:active { transform: scale(0.92); }
  .tb-sep {
    width: 1px;
    height: 20px;
    background: var(--toolbar-border);
    margin: 0 4px;
  }
  .tb-hint {
    margin-left: 10px;
    padding-left: 10px;
    border-left: 1px solid var(--toolbar-border);
    font-size: 12px;
    color: var(--hint-text);
    white-space: nowrap;
    user-select: none;
  }

  /* ===================== 画布 ===================== */
  .canvas {
    position: absolute;
    inset: 0;
    overflow: hidden;
    cursor: grab;
  }
  .canvas.panning { cursor: grabbing; }
  .canvas-content {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform-origin: 0 0;
    overflow: visible;
  }
  .connections {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }
  .conn {
    fill: none;
    stroke: var(--line-color);
    stroke-width: 2;
    stroke-linecap: round;
    transition: stroke 0.3s ease;
  }

  /* ===================== 节点 ===================== */
  .node {
    position: absolute;
    min-width: 56px;
    max-width: 260px;
    padding: 8px 14px;
    background: var(--node-bg);
    color: var(--node-text);
    border-radius: 10px;
    box-shadow: var(--node-shadow);
    font-size: 14px;
    line-height: 1.4;
    cursor: grab;
    user-select: none;
    border: 2px solid transparent;
    white-space: nowrap;
    transition: background 0.3s ease, color 0.3s ease, border-color 0.18s ease,
                box-shadow 0.18s ease, transform 0.1s ease;
  }
  .node:hover { box-shadow: 0 6px 18px rgba(60, 80, 120, 0.16); }
  .node.selected { border-color: var(--selected); }
  .node.dragging { cursor: grabbing; transition: none; }
  .node.editing { cursor: text; box-shadow: 0 0 0 3px rgba(91, 141, 239, 0.25); }
  .node-text { outline: none; display: inline-block; max-width: 232px; }
  .node-text[contenteditable="true"] { cursor: text; }

  /* ===================== 右键菜单 ===================== */
  .context-menu {
    position: fixed;
    z-index: 100;
    min-width: 160px;
    padding: 6px;
    background: var(--menu-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    box-shadow: 0 8px 28px rgba(20, 30, 60, 0.18);
    display: none;
    transition: background 0.3s ease;
  }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    font-size: 13px;
    color: var(--menu-text);
    border-radius: 7px;
    cursor: pointer;
    user-select: none;
  }
  .menu-item:hover { background: var(--menu-hover); }
  .menu-item.disabled { opacity: 0.4; pointer-events: none; }
  .menu-item svg { width: 15px; height: 15px; }
  .menu-sep { height: 1px; background: var(--panel-border); margin: 4px 2px; }

  /* ===================== 颜色面板 ===================== */
  .color-panel {
    position: fixed;
    z-index: 110;
    padding: 10px;
    background: var(--menu-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    box-shadow: 0 8px 28px rgba(20, 30, 60, 0.18);
    display: none;
    transition: background 0.3s ease;
  }
  .color-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 8px;
  }
  .color-swatch {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .color-swatch:hover { transform: scale(1.12); border-color: rgba(255, 255, 255, 0.6); }
  .color-custom-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--menu-text);
  }
  .color-custom-row input[type="color"] {
    width: 32px;
    height: 26px;
    border: none;
    background: none;
    cursor: pointer;
    padding: 0;
  }
  .color-clear {
    margin-left: auto;
    font-size: 11px;
    color: var(--hint-text);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 5px;
  }
  .color-clear:hover { background: var(--menu-hover); }

  /* ===================== 进入动画 ===================== */
  @keyframes pop {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }
  .node { animation: pop 0.18s ease; }

  /* 滚动条隐藏 */
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
  <!-- ===================== 工具栏 ===================== -->
  <div class="toolbar" id="toolbar">
    <button class="tb-btn" data-tool="child" title="新增子节点 (Tab)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4v7a3 3 0 0 0 3 3h13" /><path d="M15 17l4 3 4-3" />
      </svg>
    </button>
    <button class="tb-btn" data-tool="sibling" title="新增同级 (Enter)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14" />
      </svg>
    </button>
    <button class="tb-btn" data-tool="delete" title="删除节点 (Delete)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
        <path d="M10 11v6M14 11v6" />
      </svg>
    </button>
    <span class="tb-sep"></span>
    <button class="tb-btn" data-tool="color" title="文字颜色">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="13.5" cy="6.5" r="1.5" /><circle cx="17.5" cy="10.5" r="1.5" />
        <circle cx="8.5" cy="7.5" r="1.5" /><circle cx="6.5" cy="12.5" r="1.5" />
        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c1.7 0 3-1.3 3-3 0-.8-.3-1.5-.8-2-.5-.5-.7-1.2-.7-2 0-1.7 1.3-3 3-3h2c2.2 0 4-1.8 4-4 0-4.4-4.5-8-10-8z" />
      </svg>
    </button>
    <span class="tb-sep"></span>
    <button class="tb-btn" data-tool="reset" title="重置视图">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="4" />
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
      </svg>
    </button>
    <button class="tb-btn" data-tool="theme" title="切换主题" id="themeBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="themeIcon">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg>
    </button>
    <span class="tb-sep"></span>
    <button class="tb-btn" data-tool="import" title="导入 JSON">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" />
      </svg>
    </button>
    <button class="tb-btn" data-tool="export-json" title="导出 JSON">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <path d="M14 2v6h6" /><path d="M10 13l-2 2 2 2M14 13l2 2-2 2" />
      </svg>
    </button>
    <button class="tb-btn" data-tool="export-png" title="导出 PNG">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <circle cx="8.5" cy="8.5" r="1.5" /><path d="M21 15l-5-5L5 21" />
      </svg>
    </button>
    <span class="tb-hint">双击编辑 · Tab 子级 · Enter 同级 · Del 删除</span>
  </div>

  <!-- ===================== 画布 ===================== -->
  <div class="canvas" id="canvas">
    <div class="canvas-content" id="canvasContent">
      <svg class="connections" id="svg"></svg>
    </div>
  </div>

  <!-- ===================== 右键菜单 ===================== -->
  <div class="context-menu" id="contextMenu">
    <div class="menu-item" data-act="edit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
        <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
      </svg>编辑文字
    </div>
    <div class="menu-item" data-act="color">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="13.5" cy="6.5" r="1.5" /><circle cx="17.5" cy="10.5" r="1.5" />
        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c1.7 0 3-1.3 3-3 0-.8-.3-1.5-.8-2-.5-.5-.7-1.2-.7-2 0-1.7 1.3-3 3-3h2c2.2 0 4-1.8 4-4 0-4.4-4.5-8-10-8z" />
      </svg>编辑颜色
    </div>
    <div class="menu-sep"></div>
    <div class="menu-item" data-act="child">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4v7a3 3 0 0 0 3 3h13" /><path d="M15 17l4 3 4-3" />
      </svg>新增子节点
    </div>
    <div class="menu-item" data-act="delete">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
      </svg>删除节点
    </div>
  </div>

  <!-- ===================== 颜色面板 ===================== -->
  <div class="color-panel" id="colorPanel">
    <div class="color-grid" id="colorGrid"></div>
    <div class="color-custom-row">
      <input type="color" id="colorInput" value="#5b8def" />
      <span>自定义</span>
      <span class="color-clear" id="colorClear">默认</span>
    </div>
  </div>

  <!-- 隐藏文件输入 -->
  <input type="file" id="fileInput" accept=".json,application/json" hidden />

<script>
"use strict";
/* ============================================================
 * 思维导图 · 单文件实现
 * 数据模型：nodes = { id: { id, text, color, parentId, children, x, y } }
 * ============================================================ */

/* ---------- DOM 引用 ---------- */
const canvas        = document.getElementById('canvas');
const canvasContent = document.getElementById('canvasContent');
const svg           = document.getElementById('svg');
const toolbar       = document.getElementById('toolbar');
const contextMenu   = document.getElementById('contextMenu');
const colorPanel    = document.getElementById('colorPanel');
const colorGrid     = document.getElementById('colorGrid');
const colorInput    = document.getElementById('colorInput');
const colorClear    = document.getElementById('colorClear');
const fileInput     = document.getElementById('fileInput');
const themeIcon     = document.getElementById('themeIcon');

/* ---------- 全局状态 ---------- */
let nodes = {};          // id -> node
let rootId = null;       // 根节点 id
let selectedId = null;   // 当前选中节点
let nodeEls = {};        // id -> DOM 元素
let zoom = 1, panX = 0, panY = 0;
let theme = 'light';
let isEditing = false;
let saveTimer = null;

/* ---------- 历史记录（撤销/重做） ---------- */
let history = [];
let historyIndex = -1;
const HISTORY_LIMIT = 50;

/* ---------- 预设色板 ---------- */
const PRESET_COLORS = [
  '#5b8def', '#52c41a', '#fa8c16', '#eb2f96',
  '#722ed1', '#13c2c2', '#faad14', '#8c8c8c'
];

/* ============================================================
 * 工具函数
 * ============================================================ */
function genId() {
  return 'n_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}
function timestamp() {
  return new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
}
// 获取节点子树所有 id（含自身）
function getSubtreeIds(id) {
  const result = [];
  const queue = [id];
  while (queue.length) {
    const cur = queue.shift();
    result.push(cur);
    const n = nodes[cur];
    if (n && n.children) queue.push(...n.children);
  }
  return result;
}
// 屏幕坐标 → 画布坐标
function screenToCanvas(sx, sy) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (sx - rect.left - panX) / zoom,
    y: (sy - rect.top - panY) / zoom
  };
}

/* ============================================================
 * 渲染
 * ============================================================ */
function render() {
  const ids = new Set(Object.keys(nodes));

  // 移除已删除节点的 DOM
  Object.keys(nodeEls).forEach(id => {
    if (!ids.has(id)) {
      nodeEls[id].remove();
      delete nodeEls[id];
    }
  });

  // 创建 / 更新节点
  ids.forEach(id => {
    const n = nodes[id];
    let el = nodeEls[id];
    if (!el) {
      el = document.createElement('div');
      el.className = 'node';
      el.dataset.id = id;
      const span = document.createElement('span');
      span.className = 'node-text';
      el.appendChild(span);
      attachNodeEvents(el, id);
      canvasContent.appendChild(el);
      nodeEls[id] = el;
    }
    el.style.left = n.x + 'px';
    el.style.top  = n.y + 'px';
    const span = el.firstChild;
    if (span.textContent !== n.text) span.textContent = n.text;
    el.style.color = n.color || '';
    el.classList.toggle('selected', id === selectedId);
  });

  // 选中节点可能已被删除
  if (selectedId && !nodes[selectedId]) selectedId = null;

  drawConnections();
}

/* 绘制所有连接线（父节点右中 → 子节点左中，贝塞尔曲线） */
function drawConnections() {
  // 清空
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  Object.keys(nodes).forEach(id => {
    const n = nodes[id];
    if (!n.parentId) return;
    const p = nodes[n.parentId];
    if (!p) return;
    const pEl = nodeEls[n.parentId], cEl = nodeEls[id];
    if (!pEl || !cEl) return;
    const pw = pEl.offsetWidth, ph = pEl.offsetHeight;
    const cw = cEl.offsetWidth, ch = cEl.offsetHeight;
    const x1 = p.x + pw, y1 = p.y + ph / 2;
    const x2 = n.x,       y2 = n.y + ch / 2;
    const dx = Math.max(20, (x2 - x1) / 2);
    const d = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('class', 'conn');
    svg.appendChild(path);
  });
}

/* 应用 transform */
function applyTransform() {
  canvasContent.style.transform =
    `translate(${panX}px, ${panY}px) scale(${zoom})`;
}

/* ============================================================
 * 选中 / 编辑
 * ============================================================ */
function selectNode(id) {
  selectedId = id;
  Object.keys(nodeEls).forEach(i => {
    nodeEls[i].classList.toggle('selected', i === id);
  });
}

function startEdit(id) {
  const el = nodeEls[id];
  if (!el) return;
  const span = el.firstChild;
  el.classList.add('editing');
  span.contentEditable = 'true';
  span.focus();
  // 全选文字
  const range = document.createRange();
  range.selectNodeContents(span);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  isEditing = true;

  function commit() {
    span.contentEditable = 'false';
    el.classList.remove('editing');
    isEditing = false;
    const txt = (span.textContent || '').trim() || '未命名';
    span.removeEventListener('blur', commit);
    span.removeEventListener('keydown', onKey);
    if (nodes[id] && nodes[id].text !== txt) {
      nodes[id].text = txt;
      span.textContent = txt;
      pushHistory();
      scheduleSave();
      render();
    }
  }
  function onKey(ev) {
    ev.stopPropagation();
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); span.blur(); }
    else if (ev.key === 'Escape') { ev.preventDefault(); span.textContent = nodes[id].text; span.blur(); }
  }
  span.addEventListener('blur', commit);
  span.addEventListener('keydown', onKey);
}

/* ============================================================
 * 节点增删
 * ============================================================ */
function addChild(parentId) {
  const p = nodes[parentId];
  if (!p) return;
  const id = genId();
  const pw = nodeEls[parentId] ? nodeEls[parentId].offsetWidth : 80;
  const node = {
    id, text: '新节点', color: '', parentId,
    x: p.x + pw + 100,
    y: p.y + (p.children.length) * 60 + 10,
    children: []
  };
  p.children.push(id);
  nodes[id] = node;
  selectNode(id);
  render();
  pushHistory();
  scheduleSave();
  startEdit(id);
}

function addSibling(nodeId) {
  const n = nodes[nodeId];
  if (!n || !n.parentId) return; // 根节点无同级
  const p = nodes[n.parentId];
  const sid = genId();
  const sib = {
    id, text: '新节点', color: '', parentId: n.parentId,
    x: n.x, y: n.y + 70, children: []
  };
  p.children.push(sid);
  nodes[sid] = sib;
  selectNode(sid);
  render();
  pushHistory();
  scheduleSave();
  startEdit(sid);
}

function deleteNode(id) {
  if (id === rootId) return;
  const n = nodes[id];
  if (!n) return;
  const p = n.parentId ? nodes[n.parentId] : null;
  if (p) p.children = p.children.filter(c => c !== id);
  getSubtreeIds(id).forEach(sid => delete nodes[sid]);
  selectNode(null);
  render();
  pushHistory();
  scheduleSave();
}

/* ============================================================
 * 节点事件（拖动 / 选中 / 双击 / 右键）
 * ============================================================ */
function attachNodeEvents(el, id) {
  el.addEventListener('mousedown', e => onNodeMouseDown(e, id));
  el.addEventListener('dblclick', e => {
    e.stopPropagation();
    startEdit(id);
  });
  el.addEventListener('contextmenu', e => {
    e.preventDefault();
    e.stopPropagation();
    selectNode(id);
    openContextMenu(e.clientX, e.clientY, id);
  });
}

function onNodeMouseDown(e, id) {
  if (isEditing) return;          // 编辑中不处理
  if (e.button !== 0) return;     // 仅左键
  // 不阻止冒泡：让 document 级监听关闭浮层；画布平移已通过 target 判断屏蔽
  selectNode(id);

  const n = nodes[id];
  const start = { mx: e.clientX, my: e.clientY };
  const subtree = getSubtreeIds(id);
  const initial = {};
  subtree.forEach(sid => { initial[sid] = { x: nodes[sid].x, y: nodes[sid].y }; });
  let moved = false;

  function onMove(ev) {
    const dxs = ev.clientX - start.mx;
    const dys = ev.clientY - start.my;
    if (!moved && Math.hypot(dxs, dys) < 3) return; // 阈值，避免误触
    moved = true;
    const dx = dxs / zoom, dy = dys / zoom;
    subtree.forEach(sid => {
      nodes[sid].x = initial[sid].x + dx;
      nodes[sid].y = initial[sid].y + dy;
      if (nodeEls[sid]) {
        nodeEls[sid].style.left = nodes[sid].x + 'px';
        nodeEls[sid].style.top  = nodes[sid].y + 'px';
        nodeEls[sid].classList.add('dragging');
      }
    });
    drawConnections();
  }
  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    subtree.forEach(sid => {
      if (nodeEls[sid]) nodeEls[sid].classList.remove('dragging');
    });
    if (moved) { pushHistory(); scheduleSave(); }
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

/* ============================================================
 * 画布：缩放 / 平移 / 空白点击
 * ============================================================ */
canvas.addEventListener('mousedown', e => {
  // 仅响应空白处（canvas / canvasContent / svg）
  if (e.target !== canvas && e.target !== canvasContent && e.target !== svg) return;
  if (e.button !== 0) return;
  selectNode(null);
  closeContextMenu();
  closeColorPanel();
  canvas.classList.add('panning');
  const start = { mx: e.clientX, my: e.clientY, px: panX, py: panY };
  let moved = false;
  function onMove(ev) {
    const dx = ev.clientX - start.mx, dy = ev.clientY - start.my;
    if (!moved && Math.hypot(dx, dy) < 3) return;
    moved = true;
    panX = start.px + dx;
    panY = start.py + dy;
    applyTransform();
  }
  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    canvas.classList.remove('panning');
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});

// 滚轮缩放（以鼠标位置为中心）
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const oldZoom = zoom;
  const factor = 1 + (-e.deltaY * 0.0015);
  let newZoom = oldZoom * factor;
  newZoom = Math.max(0.3, Math.min(2.5, newZoom));
  if (newZoom === oldZoom) return;
  // 保持鼠标下画布点不变
  panX = mx - (mx - panX) * (newZoom / oldZoom);
  panY = my - (my - panY) * (newZoom / oldZoom);
  zoom = newZoom;
  applyTransform();
}, { passive: false });

/* 重置视图：居中根节点 */
function resetView() {
  zoom = 1;
  const r = nodes[rootId];
  if (r) {
    const el = nodeEls[rootId];
    const w = el ? el.offsetWidth : 120;
    const h = el ? el.offsetHeight : 40;
    panX = canvas.clientWidth / 2 - (r.x + w / 2);
    panY = canvas.clientHeight / 2 - (r.y + h / 2);
  } else {
    panX = 0; panY = 0;
  }
  applyTransform();
}

/* ============================================================
 * 键盘快捷键
 * ============================================================ */
document.addEventListener('keydown', e => {
  // 编辑态下不处理全局快捷键
  if (isEditing) return;
  const ctrl = e.ctrlKey || e.metaKey;

  // 撤销 / 重做
  if (ctrl && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
    return;
  }
  if (ctrl && e.key.toLowerCase() === 'y') {
    e.preventDefault();
    redo();
    return;
  }
  if (ctrl) return; // 其它 Ctrl 组合忽略

  if (!selectedId) return;
  if (e.key === 'Tab') { e.preventDefault(); addChild(selectedId); }
  else if (e.key === 'Enter') { e.preventDefault(); addSibling(selectedId); }
  else if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault();
    deleteNode(selectedId);
  }
});

/* ============================================================
 * 历史记录
 * ============================================================ */
function pushHistory() {
  const snap = JSON.stringify({ nodes, rootId });
  if (historyIndex >= 0 && history[historyIndex] === snap) return;
  history.splice(historyIndex + 1); // 丢弃 redo 分支
  history.push(snap);
  if (history.length > HISTORY_LIMIT) history.shift();
  historyIndex = history.length - 1;
}
function loadSnapshot(snap) {
  const state = JSON.parse(snap);
  nodes = state.nodes;
  rootId = state.rootId;
  selectedId = null;
  render();
}
function undo() {
  if (historyIndex <= 0) return;
  historyIndex--;
  loadSnapshot(history[historyIndex]);
  scheduleSave();
}
function redo() {
  if (historyIndex >= history.length - 1) return;
  historyIndex++;
  loadSnapshot(history[historyIndex]);
  scheduleSave();
}

/* ============================================================
 * 持久化
 * ============================================================ */
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem('mindmap-data', JSON.stringify({ nodes, rootId }));
    } catch (e) { /* 忽略存储异常 */ }
  }, 500);
}
function loadSaved() {
  try {
    const raw = localStorage.getItem('mindmap-data');
    if (raw) {
      const d = JSON.parse(raw);
      if (d && d.nodes && d.rootId) {
        nodes = d.nodes;
        rootId = d.rootId;
        return true;
      }
    }
  } catch (e) {}
  return false;
}

/* ============================================================
 * 主题
 * ============================================================ */
function setTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('mindmap-theme', t);
  updateThemeIcon();
}
function updateThemeIcon() {
  if (theme === 'dark') {
    themeIcon.innerHTML =
      '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />';
  } else {
    themeIcon.innerHTML =
      '<circle cx="12" cy="12" r="4" />' +
      '<path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />';
  }
}
function toggleTheme() {
  setTheme(theme === 'light' ? 'dark' : 'light');
}

/* ============================================================
 * 右键菜单
 * ============================================================ */
function openContextMenu(x, y, id) {
  // 防止超出视窗
  const w = 170, h = 180;
  const px = Math.min(x, window.innerWidth - w - 6);
  const py = Math.min(y, window.innerHeight - h - 6);
  contextMenu.style.left = px + 'px';
  contextMenu.style.top = py + 'px';
  contextMenu.style.display = 'block';
  // 根节点禁用删除
  contextMenu.querySelector('[data-act="delete"]')
    .classList.toggle('disabled', id === rootId);
}
function closeContextMenu() {
  contextMenu.style.display = 'none';
}
contextMenu.addEventListener('click', e => {
  const item = e.target.closest('.menu-item');
  if (!item || item.classList.contains('disabled')) return;
  const act = item.dataset.act;
  const id = selectedId;
  closeContextMenu();
  if (!id) return;
  if (act === 'edit') startEdit(id);
  else if (act === 'color') openColorPanelForSelection();
  else if (act === 'child') addChild(id);
  else if (act === 'delete') deleteNode(id);
});

/* ============================================================
 * 颜色面板
 * ============================================================ */
function buildColorGrid() {
  PRESET_COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch';
    sw.style.background = c;
    sw.title = c;
    sw.addEventListener('click', () => applyColor(c));
    colorGrid.appendChild(sw);
  });
}
function openColorPanel(x, y) {
  const w = 150, h = 110;
  colorPanel.style.left = Math.min(x, window.innerWidth - w - 6) + 'px';
  colorPanel.style.top  = Math.min(y, window.innerHeight - h - 6) + 'px';
  colorPanel.style.display = 'block';
}
function closeColorPanel() {
  colorPanel.style.display = 'none';
}
function openColorPanelForSelection() {
  if (!selectedId) return;
  const el = nodeEls[selectedId];
  const r = el.getBoundingClientRect();
  openColorPanel(r.right + 6, r.top);
}
function applyColor(c) {
  if (!selectedId) return;
  nodes[selectedId].color = c;
  render();
  pushHistory();
  scheduleSave();
}
colorInput.addEventListener('input', () => applyColor(colorInput.value));
colorClear.addEventListener('click', () => applyColor(''));

/* 点击空白处关闭浮层 */
document.addEventListener('mousedown', e => {
  if (!contextMenu.contains(e.target) && !colorPanel.contains(e.target)) {
    // 工具栏按钮的点击由各自处理，这里仅关闭浮层
    if (!e.target.closest('.tb-btn')) {
      closeContextMenu();
      closeColorPanel();
    }
  }
});

/* ============================================================
 * 工具栏事件
 * ============================================================ */
toolbar.addEventListener('click', e => {
  const btn = e.target.closest('.tb-btn');
  if (!btn) return;
  const tool = btn.dataset.tool;
  switch (tool) {
    case 'child':
      if (selectedId) addChild(selectedId);
      break;
    case 'sibling':
      if (selectedId) addSibling(selectedId);
      break;
    case 'delete':
      if (selectedId) deleteNode(selectedId);
      break;
    case 'color': {
      // 在按钮下方展开色板
      const r = btn.getBoundingClientRect();
      openColorPanel(r.left, r.bottom + 6);
      break;
    }
    case 'reset':
      resetView();
      break;
    case 'theme':
      toggleTheme();
      break;
    case 'import':
      fileInput.click();
      break;
    case 'export-json':
      exportJSON();
      break;
    case 'export-png':
      exportPNG();
      break;
  }
});

/* ============================================================
 * 导入 / 导出
 * ============================================================ */
function exportJSON() {
  const data = JSON.stringify({ nodes, rootId }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.download = `mindmap-${timestamp()}.json`;
  a.href = URL.createObjectURL(blob);
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (!d || !d.nodes || !d.rootId) throw new Error('格式错误');
      nodes = d.nodes;
      rootId = d.rootId;
      selectedId = null;
      render();
      resetView();
      pushHistory();
      scheduleSave();
    } catch (err) {
      alert('导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
  fileInput.value = ''; // 重置以便重复选择同一文件
});

/* 导出 PNG：离屏 canvas 重绘画布 */
function exportPNG() {
  const ids = Object.keys(nodes);
  if (!ids.length) return;
  const styles = getComputedStyle(document.documentElement);
  const lineColor = styles.getPropertyValue('--line-color').trim();
  const nodeBg    = styles.getPropertyValue('--node-bg').trim();
  const nodeText  = styles.getPropertyValue('--node-text').trim();
  const exportBg  = styles.getPropertyValue('--export-bg').trim();

  // 计算包围盒
  const dim = {};
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  ids.forEach(id => {
    const el = nodeEls[id], n = nodes[id];
    const w = el.offsetWidth, h = el.offsetHeight;
    dim[id] = { w, h };
    minX = Math.min(minX, n.x);
    minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + w);
    maxY = Math.max(maxY, n.y + h);
  });
  const pad = 60;
  const W = maxX - minX + pad * 2;
  const H = maxY - minY + pad * 2;

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');

  // 背景
  ctx.fillStyle = exportBg || '#eef2f7';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(pad - minX, pad - minY);

  // 连接线
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 2;
  ids.forEach(id => {
    const n = nodes[id];
    if (!n.parentId) return;
    const p = nodes[n.parentId];
    if (!p) return;
    const pw = dim[p.id].w, ph = dim[p.id].h;
    const cw = dim[id].w, ch = dim[id].h;
    const x1 = p.x + pw, y1 = p.y + ph / 2;
    const x2 = n.x,       y2 = n.y + ch / 2;
    const dx = Math.max(20, (x2 - x1) / 2);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.bezierCurveTo(x1 + dx, y1, x2 - dx, y2, x2, y2);
    ctx.stroke();
  });

  // 节点
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  ids.forEach(id => {
    const n = nodes[id], d = dim[id];
    // 圆角矩形
    ctx.fillStyle = nodeBg;
    ctx.shadowColor = 'rgba(60,80,120,0.18)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 2;
    roundRect(ctx, n.x, n.y, d.w, d.h, 10);
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
    // 文字
    ctx.fillStyle = n.color || nodeText;
    ctx.font = '14px -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText(n.text, n.x + d.w / 2, n.y + d.h / 2, d.w - 20);
  });
  ctx.restore();

  // 下载
  cv.toBlob(blob => {
    const a = document.createElement('a');
    a.download = `mindmap-${timestamp()}.png`;
    a.href = URL.createObjectURL(blob);
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ============================================================
 * 初始化
 * ============================================================ */
function createDefault() {
  const id = genId();
  nodes = {};
  nodes[id] = {
    id, text: '中心主题', color: '', parentId: null,
    x: 0, y: 0, children: []
  };
  rootId = id;
}
function init() {
  // 主题
  const savedTheme = localStorage.getItem('mindmap-theme') || 'light';
  setTheme(savedTheme);
  // 色板
  buildColorGrid();
  // 数据
  if (!loadSaved()) createDefault();
  // 渲染
  render();
  // 等待布局完成后重置视图
  requestAnimationFrame(() => {
    resetView();
    pushHistory(); // 初始快照
  });
  // 窗口变化时无需特殊处理（百分比布局）
}
init();
</script>
