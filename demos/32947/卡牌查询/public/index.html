<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡牌评级查询系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top left, rgba(212,175,55,0.10) 0%, transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(30,58,114,0.10) 0%, transparent 50%),
      #f4f6fb;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .container {
    max-width: 920px;
    width: 100%;
    background: white;
    border-radius: 16px;
    padding: 60px 50px;
    box-shadow: 0 30px 80px rgba(10,21,48,0.18);
    border: 1px solid #e6ecf5;
    text-align: center;
  }
  .eyebrow {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: #b8902a;
    margin-bottom: 16px;
    text-transform: uppercase;
  }
  h1 {
    font-size: 36px;
    color: #0a1530;
    font-weight: 700;
    margin-bottom: 12px;
    letter-spacing: 0.04em;
  }
  h1 em {
    font-style: normal;
    background: linear-gradient(135deg, #d4af37 0%, #f1de9f 50%, #b8902a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .sub {
    color: #4a5878;
    font-size: 15px;
    margin-bottom: 50px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-top: 30px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    padding: 32px 24px;
    border-radius: 12px;
    border: 1px solid #e6ecf5;
    background: linear-gradient(135deg, #f7f8fc 0%, #ffffff 100%);
    transition: all 0.25s;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 40px rgba(10,21,48,0.12);
    border-color: #d4af37;
  }
  .card .icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 16px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
  }
  .card.c-end .icon { background: linear-gradient(135deg, #1e3a72 0%, #0a1530 100%); }
  .card.b-end .icon { background: linear-gradient(135deg, #d4af37 0%, #b8902a 100%); color: #0a1530; }
  .card h2 {
    font-size: 20px;
    color: #0a1530;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .card .en {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: #8a96ad;
    font-size: 12px;
    letter-spacing: 0.2em;
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  .card p {
    color: #4a5878;
    font-size: 13px;
    line-height: 1.7;
  }
  .footer {
    margin-top: 50px;
    padding-top: 24px;
    border-top: 1px solid #e6ecf5;
    color: #8a96ad;
    font-size: 12px;
    letter-spacing: 0.1em;
  }
  @media (max-width: 600px) {
    .container { padding: 40px 24px; }
    h1 { font-size: 24px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="eyebrow">AGC AUTHENTICATION · v1.0</div>
    <h1>卡牌评级 <em>查询系统</em></h1>
    <p class="sub">AGC 鉴真卡牌评级查询H5系统 · 用户查询端 + 管理后台</p>

    <div class="grid">
      <a class="card c-end" href="/h5/">
        <div class="icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="5" y="2" width="14" height="20" rx="3"/>
            <path d="M12 18h.01"/>
          </svg>
        </div>
        <h2>C 端用户 H5</h2>
        <div class="en">Mobile H5 · Grading Inquiry</div>
        <p>用户通过内部编号查询对应宝可梦评级卡牌详情,适配手机端全屏浏览</p>
      </a>
      <a class="card b-end" href="/admin/">
        <div class="icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M3 9h18M9 21V9"/>
          </svg>
        </div>
        <h2>B 端管理后台</h2>
        <div class="en">Admin Console · PC Web</div>
        <p>卡牌信息录入、数据管理、页面背景图自定义配置,PC 端操作</p>
      </a>
    </div>

    <div class="footer">© AGC AUTHENTICATION · FOR INTERNAL USE</div>
  </div>
</body>
</html>
