<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1530">
<title>卡牌详情 · AGC 鉴真</title>
<link rel="stylesheet" href="css/h5.css">
</head>
<body>

<div class="app">
  <div class="h5-detail">

    <div class="detail-hero" id="detailHero">
      <a class="detail-back" href="index.html" aria-label="返回">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </a>

      <div class="detail-grade-badge" id="gradeBadge">
        <svg viewBox="0 0 78 84" fill="none">
          <defs>
            <linearGradient id="badge-grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f1de9f"/>
              <stop offset="50%" stop-color="#d4af37"/>
              <stop offset="100%" stop-color="#8c6c1d"/>
            </linearGradient>
          </defs>
          <!-- 外层盾形 + 金色描边 -->
          <path d="M39 0 L75 12 L75 42 Q75 64 39 82 Q3 64 3 42 L3 12 Z" fill="url(#badge-grad)" stroke="#fbf3d9" stroke-width="1"/>
          <!-- 内层盾形 + 深蓝描边 -->
          <path d="M39 6 L69 16 L69 42 Q69 60 39 76 Q9 60 9 42 L9 16 Z" fill="none" stroke="#0a1530" stroke-width="0.8"/>
          <!-- 分数 -->
          <text id="badgeNum" x="39" y="40" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="22" font-weight="700" fill="#0a1530">10</text>
          <!-- AGC 小字(替换原 GEM MINT) -->
          <text x="39" y="58" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="6" letter-spacing="2" font-weight="700" fill="#0a1530">AGC</text>
        </svg>
      </div>

      <div class="detail-title-wrap">
        <div class="detail-title-cn" id="cardName">—</div>
        <div class="detail-title-en" id="cardNameEn">—</div>
      </div>

      <div class="detail-thumbs">
        <div class="detail-thumb" id="thumbFront" data-label="正面 · FRONT">
          <div class="detail-thumb-placeholder" id="thumbFrontPh">加载中...</div>
          <div class="detail-thumb-label">正面 · FRONT</div>
        </div>
        <div class="detail-thumb" id="thumbBack" data-label="背面 · BACK">
          <div class="detail-thumb-placeholder" id="thumbBackPh">加载中...</div>
          <div class="detail-thumb-label">背面 · BACK</div>
        </div>
      </div>
    </div>

    <div class="detail-body">
      <div class="detail-section-head">
        <div class="bar"></div>
        <div class="cn">商品基础信息</div>
        <div class="en">Basic Info</div>
      </div>

      <div class="detail-fields">
        <div class="detail-field">
          <div class="detail-field-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            </svg>
          </div>
          <div class="detail-field-content">
            <div class="detail-field-label">卡牌名称</div>
            <div class="detail-field-value" id="fName">—</div>
          </div>
        </div>

        <div class="detail-field">
          <div class="detail-field-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <path d="M7 8h10M7 12h6"/>
            </svg>
          </div>
          <div class="detail-field-content">
            <div class="detail-field-label">卡牌编号</div>
            <div class="detail-field-value"><span class="mono" id="fNo">—</span></div>
          </div>
        </div>

        <div class="detail-field">
          <div class="detail-field-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"/>
              <path d="M9 12l2 2 4-4"/>
            </svg>
          </div>
          <div class="detail-field-content">
            <div class="detail-field-label">内部编号</div>
            <div class="detail-field-value"><span class="mono" id="fInner">—</span></div>
          </div>
        </div>

        <div class="detail-field">
          <div class="detail-field-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
          </div>
          <div class="detail-field-content">
            <div class="detail-field-label">评级分数</div>
            <div class="detail-field-value"><span class="mono" id="fScore">—</span></div>
          </div>
        </div>

        <div class="detail-field">
          <div class="detail-field-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            </svg>
          </div>
          <div class="detail-field-content">
            <div class="detail-field-label">卡牌版本</div>
            <div class="detail-field-value" id="fVer">—</div>
          </div>
        </div>
      </div>

      <div class="detail-footnote">— AGC AUTHENTICATION —</div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-close" id="lbClose">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </div>
  <img class="lightbox-img" id="lbImg" src="" alt="">
  <div class="lightbox-caption" id="lbCaption">—</div>
</div>

<div class="loading show" id="loading">
  <div class="spinner"></div>
  <div>加载中...</div>
</div>

<script src="js/detail.js"></script>
</body>
</html>
