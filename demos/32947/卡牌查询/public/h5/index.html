<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1530">
<title>AGC 鉴真卡牌评级查询</title>
<link rel="stylesheet" href="css/h5.css">
</head>
<body>

<div class="app">
  <div class="h5-home" id="h5Home">

    <svg class="home-corner-deco tl" viewBox="0 0 80 80">
      <path d="M0 0 L80 0 L80 4 L4 4 L4 80 L0 80 Z" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.6"/>
      <path d="M0 12 L12 12 L12 0" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.4"/>
    </svg>
    <svg class="home-corner-deco tr" viewBox="0 0 80 80">
      <path d="M0 0 L80 0 L80 4 L4 4 L4 80 L0 80 Z" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.6"/>
      <path d="M0 12 L12 12 L12 0" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.4"/>
    </svg>
    <svg class="home-corner-deco bl" viewBox="0 0 80 80">
      <path d="M0 0 L80 0 L80 4 L4 4 L4 80 L0 80 Z" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.6"/>
      <path d="M0 12 L12 12 L12 0" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.4"/>
    </svg>
    <svg class="home-corner-deco br" viewBox="0 0 80 80">
      <path d="M0 0 L80 0 L80 4 L4 4 L4 80 L0 80 Z" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.6"/>
      <path d="M0 12 L12 12 L12 0" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.4"/>
    </svg>

    <svg class="home-bg-emblem" viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <linearGradient id="emblem-grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#d4af37" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#d4af37" stop-opacity="0.1"/>
        </linearGradient>
      </defs>
      <circle cx="100" cy="100" r="90" fill="none" stroke="url(#emblem-grad)" stroke-width="1"/>
      <circle cx="100" cy="100" r="70" fill="none" stroke="url(#emblem-grad)" stroke-width="0.5"/>
      <path d="M100 30 L150 50 L150 100 Q150 140 100 170 Q50 140 50 100 L50 50 Z" fill="none" stroke="url(#emblem-grad)" stroke-width="1.5"/>
    </svg>

    <div class="home-content">
      <div class="home-brand">
        <div class="home-brand-shield">
          <svg viewBox="0 0 64 76" fill="none">
            <defs>
              <linearGradient id="shield-grad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#f1de9f"/>
                <stop offset="50%" stop-color="#d4af37"/>
                <stop offset="100%" stop-color="#8c6c1d"/>
              </linearGradient>
            </defs>
            <path d="M32 0 L62 12 L62 38 Q62 60 32 76 Q2 60 2 38 L2 12 Z" fill="url(#shield-grad)" stroke="#fbf3d9" stroke-width="0.5"/>
            <path d="M32 6 L56 16 L56 38 Q56 56 32 70 Q8 56 8 38 L8 16 Z" fill="none" stroke="#0a1530" stroke-width="0.8"/>
            <text x="32" y="44" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="14" font-weight="700" fill="#0a1530" letter-spacing="0.5">AGC</text>
          </svg>
        </div>
        <div class="home-brand-cn">AGC 鉴真 · 卡牌评级</div>
        <div class="home-brand-en">AGC · Card Grading Center</div>
        <div class="home-brand-divider"><div class="gem"></div></div>
      </div>

      <div class="home-tagline">
        权威鉴定 · 卡牌 <span class="accent">评级</span> · 中心
      </div>

      <div class="home-search-area">
        <div class="search-label">Grading Inquiry</div>
        <form class="search-box" id="searchForm" autocomplete="off">
          <input type="text" id="searchInput" name="inner_no" placeholder="请输入卡牌内部编号" maxlength="50" inputmode="text">
          <button type="submit" class="search-icon-btn" aria-label="查询">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="11" cy="11" r="7"/>
              <path d="M21 21l-4.35-4.35"/>
            </svg>
          </button>
        </form>
        <div class="search-hint">输入卡牌内部编号,一键查询评级档案</div>
      </div>

      <div class="home-footer-mark">
        <div class="ornament">
          <div class="line"></div>
          <div class="diamond"></div>
          <div class="line"></div>
        </div>
        <div class="cn">官方认证评级查询</div>
        <div class="en">Official Grading Service</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <div class="toast-title" id="toastTitle">提示</div>
  <div class="toast-desc" id="toastDesc"></div>
</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div>查询中...</div>
</div>

<script src="js/home.js"></script>
</body>
</html>
