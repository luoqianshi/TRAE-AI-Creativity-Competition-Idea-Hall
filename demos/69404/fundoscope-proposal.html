<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>养基助手 · 今日操作卡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            max-width: 420px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 28px 24px 32px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
        }
        /* 顶部状态条 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .date {
            font-size: 14px;
            color: #8c8f9c;
            font-weight: 500;
        }
        .signal-badge {
            font-size: 13px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 20px;
            background: #e8f5e9;
            color: #2e7d32;
        }
        .signal-badge.sell {
            background: #fce4ec;
            color: #c62828;
        }
        .signal-badge.hold {
            background: #fff3e0;
            color: #e65100;
        }

        /* 主信号区 */
        .signal-main {
            text-align: center;
            padding: 16px 0 20px;
            border-bottom: 1px solid #f0f2f5;
        }
        .signal-main .emoji-big {
            font-size: 52px;
            display: block;
            margin-bottom: 6px;
        }
        .signal-main .action-text {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
        }
        .signal-main .action-text .highlight {
            color: #2e7d32;
        }
        .signal-main .reason {
            font-size: 15px;
            color: #5a5d6e;
            margin-top: 8px;
            background: #f8f9fc;
            padding: 10px 16px;
            border-radius: 12px;
            display: inline-block;
        }

        /* 操作卡片 — 核心 */
        .operation-card {
            background: #f8f9fc;
            border-radius: 16px;
            padding: 20px 18px;
            margin: 20px 0 18px;
            border-left: 4px solid #2e7d32;
        }
        .operation-card.sell-card {
            border-left-color: #c62828;
        }
        .operation-card.hold-card {
            border-left-color: #e65100;
        }
        .op-title {
            font-size: 13px;
            font-weight: 600;
            color: #8c8f9c;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .op-item {
            display: flex;
            align-items: center;
            padding: 6px 0;
            font-size: 15px;
            color: #1a1a2e;
            gap: 10px;
        }
        .op-item .step-num {
            display: inline-flex;
            width: 22px;
            height: 22px;
            background: #e8edf5;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #4a4d5e;
            flex-shrink: 0;
        }
        .op-item .code-copy {
            background: #ffffff;
            padding: 4px 14px;
            border-radius: 8px;
            font-family: "SF Mono", monospace;
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
            border: 1px solid #dfe2e9;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .op-item .code-copy:active {
            background: #e8edf5;
            transform: scale(0.96);
        }
        .copy-tip {
            font-size: 12px;
            color: #8c8f9c;
            margin-left: 6px;
        }
        .op-divider {
            height: 1px;
            background: #e8ecf2;
            margin: 10px 0;
        }

        /* 支付宝步骤 */
        .alipay-steps {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px 16px 12px;
            margin: 6px 0 4px;
            border: 1px dashed #d0d5e0;
        }
        .alipay-steps .step-line {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #2a2d3e;
            padding: 5px 0;
        }
        .alipay-steps .step-line .arrow {
            color: #b0b8c8;
            font-size: 18px;
        }
        .alipay-steps .step-line .icon-small {
            font-size: 18px;
        }

        .time-estimate {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid #f0f2f5;
            font-size: 14px;
            color: #5a5d6e;
        }
        .time-estimate .tag {
            background: #eef1f7;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            color: #4a4d5e;
        }

        /* 底部 */
        .footer-note {
            margin-top: 18px;
            font-size: 12px;
            color: #b0b8c8;
            text-align: center;
            line-height: 1.6;
        }
        .footer-note .risk {
            color: #c62828;
            font-weight: 500;
        }

        /* toast 提示 */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            color: #fff;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 6px 24px rgba(0,0,0,0.25);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
        }

        /* 响应式 */
        @media (max-width: 460px) {
            .card { padding: 20px 16px 24px; }
            .signal-main .action-text { font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="card">
    <!-- 状态条 -->
    <div class="status-bar">
        <span class="date">📅 2026-07-03 周五</span>
        <span class="signal-badge">📈 买入</span>
    </div>

    <!-- 主信号 -->
    <div class="signal-main">
        <span class="emoji-big">🟢</span>
        <div class="action-text">
            今日建议：<span class="highlight">买入</span>
        </div>
        <div class="reason">
            📊 沪深300市盈率12.3倍 · 近5年29%分位 · 低估区
        </div>
    </div>

    <!-- 操作卡 -->
    <div class="operation-card">
        <div class="op-title">📋 支付宝操作指令卡</div>

        <div class="op-item">
            <span class="step-num">1</span>
            <span>复制基金代码</span>
            <span class="code-copy" id="copyBtn">110020 <span style="font-size:13px;color:#8c8f9c;">📋</span></span>
            <span class="copy-tip" id="copyTip">点我复制</span>
        </div>

        <div class="op-item">
            <span class="step-num">2</span>
            <span>买入金额</span>
            <span style="font-weight:700;color:#2e7d32;">500 元</span>
        </div>

        <div class="op-divider"></div>

        <!-- 支付宝内步骤 -->
        <div class="alipay-steps">
            <div class="step-line">
                <span class="icon-small">📱</span>
                <span>打开支付宝 → 理财 → 基金</span>
            </div>
            <div class="step-line">
                <span class="icon-small">🔍</span>
                <span>搜索框粘贴 <strong style="font-family:monospace;">110020</strong></span>
            </div>
            <div class="step-line">
                <span class="icon-small">💰</span>
                <span>点击「买入」输入 <strong>500</strong> 元</span>
            </div>
            <div class="step-line">
                <span class="icon-small">✅</span>
                <span>确认支付 · 今日15:00前有效</span>
            </div>
        </div>

        <div class="time-estimate">
            <span>⏱️ 预计耗时 <strong style="color:#1a1a2e;">45秒</strong></span>
            <span class="tag">截止 15:00</span>
        </div>
    </div>

    <!-- 风险提示 -->
    <div class="footer-note">
        <span class="risk">⚠️ 投资有风险，历史回测不代表未来收益</span><br>
        本产品仅为决策辅助，不构成投资建议，交易请自行在支付宝完成
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">✅ 已复制：110020</div>

<script>
    const copyBtn = document.getElementById('copyBtn');
    const toast = document.getElementById('toast');
    const copyTip = document.getElementById('copyTip');

    copyBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        const code = '110020';
        navigator.clipboard.writeText(code).then(() => {
            toast.textContent = '✅ 已复制：110020';
            toast.classList.add('show');
            copyTip.textContent = '✅ 已复制';
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    copyTip.textContent = '点我复制';
                }, 400);
            }, 1600);
        }).catch(() => {
            // fallback
            const textArea = document.createElement('textarea');
            textArea.value = code;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            toast.textContent = '✅ 已复制：110020';
            toast.classList.add('show');
            copyTip.textContent = '✅ 已复制';
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    copyTip.textContent = '点我复制';
                }, 400);
            }, 1600);
        });
    });
</script>

</body>
</html>
