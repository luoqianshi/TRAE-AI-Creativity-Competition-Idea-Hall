<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭食材管理与菜谱推荐</title>
<style>
/* ============================================================
   家庭食材管理与菜谱推荐 — 温馨家庭版
   ============================================================ */
* { margin:0; padding:0; box-sizing:border-box; }

/* 全局变量：温馨暖色调 */
:root {
  --primary:     #c4784a;
  --primary-dark:#a8623a;
  --primary-light:#faf3ed;
  --bg:          #faf7f4;
  --card-bg:     #ffffff;
  --text:        #3d3530;
  --text-light:  #8a7e74;
  --red:         #c45c5c;
  --red-bg:      #fdf2f2;
  --green:       #5a9e6f;
  --green-bg:    #f0f7f2;
  --border:      #e8ddd2;
  --radius:      10px;
  --gap:         14px;
}

html { font-size:17px; }
body {
  font-family: "PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  min-height: 100vh;
}

/* ===== 头部 ===== */
.header {
  background: var(--primary);
  color: #fff;
  text-align: center;
  padding: 20px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header h1 { font-size:1.4rem; font-weight:600; letter-spacing:1px; }
.header .header-back {
  position: absolute;
  left: 16px; top: 50%;
  transform: translateY(-50%);
  display: none;
}
.header .btn-back {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.25);
  font-size: 0.9rem;
  padding: 7px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 500;
  transition: background 0.15s;
}
.header .btn-back:hover { background: rgba(255,255,255,0.25); }

/* ===== 主容器 ===== */
.main-wrap {
  max-width: 700px;
  margin: 0 auto;
  padding: 18px;
  min-height: 60vh;
}

/* ===== 页面视图 ===== */
.page { display:none; }
.page.active { display:block; }

/* ===== 区块卡片 ===== */
.section-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: var(--gap);
  border: 1px solid var(--border);
}
.section-title {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--primary-dark);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

/* ===== 食材添加表单 ===== */
.add-form { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.add-form input, .add-form select {
  height: 44px;
  padding: 0 12px;
  font-size: 0.95rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  outline: none;
  background: #fff;
  transition: border-color 0.2s;
}
.add-form input:focus, .add-form select:focus { border-color: var(--primary); }
.add-form input { flex:2; min-width:120px; }
.add-form select { flex:1; min-width:90px; }
.btn-add {
  height: 44px;
  padding: 0 18px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s;
}
.btn-add:hover { background: var(--primary-dark); }

/* ===== 食材列表 ===== */
.ingredient-list { display:flex; flex-direction:column; gap:6px; }
.ingredient-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: var(--primary-light);
  border-radius: 8px;
  border: 1px solid var(--border);
  gap: 8px;
  flex-wrap: wrap;
}
.ingredient-item.expiring {
  background: var(--red-bg);
  border-color: #f0c8c8;
}
.ingredient-item .ing-info { flex:1; min-width:0; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.ingredient-item .ing-name { font-size:1rem; font-weight:600; }
.ingredient-item .ing-cat {
  font-size:0.75rem;
  padding: 2px 8px;
  border-radius: 4px;
  color: #fff;
}
.cat-vegetable { background:#5a9e6f; }
.cat-meat      { background:#c4784a; }
.cat-dairy     { background:#d4a843; }
.cat-staple    { background:#a89070; }
.cat-seasoning { background:#8a7e74; }
.ingredient-item .ing-expiry {
  font-size:0.8rem;
  color: var(--text-light);
  white-space: nowrap;
}
.ingredient-item .ing-expiry.warn {
  color: var(--red);
  font-weight: 600;
}
.btn-del {
  height: 32px;
  width: 32px;
  background: #fff;
  color: #bbb;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.15s;
  flex-shrink: 0;
}
.btn-del:hover { color: var(--red); border-color: var(--red); }

/* ===== 一键匹配按钮 ===== */
.match-btn-wrap { text-align:center; margin-bottom:16px; }
.btn-match {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 32px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 1px;
  transition: background 0.15s;
}
.btn-match:hover { background: var(--primary-dark); }

/* ===== 分类筛选标签 ===== */
.filter-tabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
.filter-tab {
  padding: 7px 16px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  background: #fff;
  color: var(--text-light);
  transition: all 0.15s;
}
.filter-tab:hover { border-color: var(--primary); color: var(--primary); }
.filter-tab.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

/* ===== 菜谱卡片网格 ===== */
.recipe-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}
.recipe-card {
  background: #fff;
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  border: 1px solid var(--border);
  transition: border-color 0.15s;
}
.recipe-card:hover { border-color: var(--primary); }

/* 菜品示意图 */
.recipe-img {
  height: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  font-weight: 600;
  color: #fff;
  position: relative;
}
.recipe-img .match-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  color: #fff;
  font-size: 0.7rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 4px;
}
.match-high { background: var(--green); }
.match-mid  { background: var(--primary); }
.match-low  { background: #aaa; }
.recipe-info { padding: 10px 12px; }
.recipe-info .r-name { font-size:1rem; font-weight:600; margin-bottom:3px; }
.recipe-info .r-meta {
  font-size:0.75rem;
  color: var(--text-light);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.recipe-info .r-match {
  margin-top: 4px;
  font-size:0.75rem;
}
.recipe-info .r-match .have { color: var(--green); font-weight:600; }
.recipe-info .r-match .miss { color: var(--red); font-weight:600; }

/* ===== 菜谱详情页 ===== */
.detail-top {
  background: var(--primary);
  color: #fff;
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 14px;
  text-align: center;
}
.detail-top h3 { font-size:1.3rem; margin-bottom:6px; font-weight:600; }
.detail-top .d-meta {
  display: flex;
  justify-content: center;
  gap: 16px;
  font-size: 0.85rem;
  opacity: 0.9;
}
.detail-block {
  background: #fff;
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
}
.detail-block h4 {
  font-size: 1rem;
  color: var(--primary-dark);
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
}

/* 食材匹配列表 */
.ing-match-list { display:flex; flex-wrap:wrap; gap:6px; }
.ing-match-tag {
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 0.9rem;
  font-weight: 500;
}
.ing-match-tag.have {
  background: var(--green-bg);
  color: var(--green);
  border: 1px solid #c8e0d0;
}
.ing-match-tag.miss {
  background: var(--red-bg);
  color: var(--red);
  border: 1px solid #f0c8c8;
}

/* 烹饪步骤 */
.step-list { list-style:none; }
.step-list li {
  position: relative;
  padding: 6px 0 6px 36px;
  font-size: 0.9rem;
  line-height: 1.7;
  border-left: 2px solid var(--border);
  margin-left: 12px;
  padding-bottom: 14px;
}
.step-list li:last-child { border-left-color: transparent; padding-bottom:0; }
.step-list li::before {
  content: attr(data-step);
  position: absolute;
  left: -13px;
  top: 6px;
  width: 24px;
  height: 24px;
  line-height: 24px;
  text-align: center;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  font-size: 0.75rem;
  font-weight: 600;
}

/* ===== 空状态 ===== */
.empty-state {
  text-align: center;
  padding: 30px 20px;
  color: var(--text-light);
}
.empty-state .empty-icon {
  width: 48px;
  height: 48px;
  margin: 0 auto 10px;
  border: 2px solid var(--border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  color: var(--border);
}
.empty-state p { font-size:0.95rem; }
.empty-state .sub { font-size:0.8rem; color:#bbb; margin-top:4px; }

/* ===== 页脚 ===== */
.footer {
  text-align: center;
  padding: 20px;
  color: #bbb;
  font-size: 0.75rem;
}

/* ===== 响应式 ===== */
@media (max-width: 480px) {
  html { font-size:15px; }
  .header { padding:16px; }
  .header h1 { font-size:1.2rem; }
  .add-form { flex-direction:column; }
  .add-form input, .add-form select { width:100%; }
  .recipe-grid { grid-template-columns: repeat(2, 1fr); gap:10px; }
  .recipe-img { height:85px; }
  .btn-match { padding:12px 24px; font-size:1rem; }
}
</style>
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<header class="header" id="header">
  <div class="header-back" id="headerBack">
    <button class="btn-back" onclick="goHome()">返回</button>
  </div>
  <h1>家庭食材管理与菜谱推荐</h1>
</header>

<!-- ===== 主内容区 ===== -->
<main class="main-wrap" id="mainWrap">

  <!-- 首页 -->
  <div class="page active" id="page-home">

    <!-- 食材管理模块 -->
    <div class="section-card">
      <div class="section-title">我的食材库 <span style="font-weight:400;font-size:0.8rem;color:var(--text-light);">（共 <span id="ingCount">0</span> 种）</span></div>
      <!-- 添加食材表单 -->
      <div class="add-form">
        <input type="text" id="ingName" placeholder="输入食材名称，如：番茄">
        <select id="ingCat">
          <option value="蔬菜">蔬菜</option>
          <option value="肉类">肉类</option>
          <option value="蛋奶">蛋奶</option>
          <option value="主食">主食</option>
          <option value="调料">调料</option>
        </select>
        <select id="ingShelf">
          <option value="3">保质期 3天</option>
          <option value="5">保质期 5天</option>
          <option value="7" selected>保质期 7天</option>
          <option value="14">保质期 14天</option>
          <option value="30">保质期 30天</option>
          <option value="90">保质期 90天</option>
          <option value="180">保质期 180天</option>
          <option value="365">保质期 365天</option>
        </select>
        <button class="btn-add" onclick="addIngredient()">添加</button>
      </div>
      <!-- 食材列表 -->
      <div class="ingredient-list" id="ingList"></div>
    </div>

    <!-- 智能菜谱匹配 -->
    <div class="section-card">
      <div class="section-title">菜谱推荐</div>
      <div class="match-btn-wrap">
        <button class="btn-match" onclick="matchRecipes()">
          <span>看看能做什么菜</span>
        </button>
      </div>
      <!-- 分类筛选 -->
      <div class="filter-tabs" id="filterTabs">
        <span class="filter-tab active" onclick="filterRecipes('all', this)">全部</span>
        <span class="filter-tab" onclick="filterRecipes('quick', this)">快手菜</span>
        <span class="filter-tab" onclick="filterRecipes('diet', this)">减脂餐</span>
        <span class="filter-tab" onclick="filterRecipes('home', this)">家常菜</span>
      </div>
      <!-- 菜谱卡片 -->
      <div class="recipe-grid" id="recipeGrid">
        <div class="empty-state">
          <div class="empty-icon">菜</div>
          <p>点击上方按钮看看能做什么</p>
          <p class="sub">根据您家里的食材推荐菜品</p>
        </div>
      </div>
    </div>

  </div>

  <!-- 菜谱详情页 -->
  <div class="page" id="page-detail">
    <div id="detailContent"></div>
  </div>

</main>

<footer class="footer">
  <p>家庭食材管理与菜谱推荐</p>
  <p>合理规划食材，减少浪费，好好吃饭</p>
</footer>

<script>
/* ================================================================
   家庭食材管理与菜谱推荐
   ================================================================ */

/* ==================== 食材管理 ==================== */

function getIngredients() {
  try { return JSON.parse(localStorage.getItem('pantryIngredients')||'[]'); }
  catch(e) { return []; }
}

function saveIngredients(arr) {
  try { localStorage.setItem('pantryIngredients', JSON.stringify(arr)); }
  catch(e) {}
  renderIngredients();
}

function catClass(cat) {
  var map = {'蔬菜':'vegetable','肉类':'meat','蛋奶':'dairy','主食':'staple','调料':'seasoning'};
  return 'cat-'+ (map[cat]||'seasoning');
}

function daysLeft(ing) {
  var add = new Date(ing.addDate);
  var expire = new Date(add.getTime() + ing.shelf*24*60*60*1000);
  var now = new Date();
  return Math.ceil((expire - now)/(24*60*60*1000));
}

function addIngredient() {
  var name = document.getElementById('ingName').value.trim();
  var cat = document.getElementById('ingCat').value;
  var shelf = parseInt(document.getElementById('ingShelf').value);
  if (!name) return;
  var list = getIngredients();
  list.push({ name:name, cat:cat, shelf:shelf, addDate:new Date().toISOString() });
  sortIngredients(list);
  saveIngredients(list);
  document.getElementById('ingName').value = '';
  matchRecipes();
}

function delIngredient(idx) {
  var list = getIngredients();
  list.splice(idx, 1);
  sortIngredients(list);
  saveIngredients(list);
  matchRecipes();
}

function sortIngredients(list) {
  list.sort(function(a,b){ return daysLeft(a) - daysLeft(b); });
}

function renderIngredients() {
  var list = getIngredients();
  document.getElementById('ingCount').textContent = list.length;
  var html = '';
  if (list.length===0) {
    html = '<div class="empty-state"><div class="empty-icon">食</div><p>食材库还是空的</p><p class="sub">在上方添加家里的食材吧</p></div>';
  } else {
    for (var i=0; i<list.length; i++) {
      var ing = list[i];
      var d = daysLeft(ing);
      var warnClass = (d<=3) ? ' expiring' : '';
      var warnText = (d<=0) ? '<span class="ing-expiry warn">已过期</span>'
                   : (d<=3) ? '<span class="ing-expiry warn">即将过期（剩'+d+'天）</span>'
                   : '<span class="ing-expiry">剩'+d+'天</span>';
      html += '<div class="ingredient-item'+warnClass+'">'
            + '<div class="ing-info">'
            + '<span class="ing-name">'+escHtml(ing.name)+'</span>'
            + '<span class="ing-cat '+catClass(ing.cat)+'">'+ing.cat+'</span>'
            + warnText
            + '</div>'
            + '<button class="btn-del" onclick="delIngredient('+i+')">删</button>'
            + '</div>';
    }
  }
  document.getElementById('ingList').innerHTML = html;
}

/* ==================== 菜谱数据 ==================== */

var recipeColors = [
  '#d4a843', '#c4784a', '#5a9e6f', '#a89070',
  '#c45c5c', '#d4a843', '#8a9eb0', '#c4784a',
  '#5a9e6f', '#d4a843', '#a89070', '#8a9eb0'
];

var allRecipes = [
  /* ---- 快手菜 ---- */
  { id:'r1', cat:'quick', name:'番茄炒蛋', time:'10分钟', cal:'180千卡',
    ingredients: ['鸡蛋','番茄','食用油','盐'],
    steps: [
      '番茄洗净切块，鸡蛋打入碗中加少许盐打散备用',
      '热锅倒油，油热后倒入蛋液，炒至凝固盛出',
      '锅中再放少许油，倒入番茄块翻炒出汁',
      '番茄炒软后倒回鸡蛋，加盐调味翻炒均匀即可出锅',
    ]},
  { id:'r2', cat:'quick', name:'蒜蓉炒青菜', time:'8分钟', cal:'80千卡',
    ingredients: ['青菜','大蒜','食用油','盐'],
    steps: [
      '青菜洗净沥干水分，大蒜剁成蒜末',
      '热锅倒油，放入蒜末爆香',
      '倒入青菜大火快速翻炒至变软',
      '加盐调味，翻炒均匀即可出锅（全程不超过3分钟）',
    ]},
  { id:'r3', cat:'quick', name:'蛋炒饭', time:'10分钟', cal:'350千卡',
    ingredients: ['鸡蛋','大米','食用油','盐','葱'],
    steps: [
      '隔夜米饭（或放凉的米饭）打散备用，鸡蛋打散，葱切葱花',
      '热锅倒油，倒入蛋液快速划散炒熟盛出',
      '锅中补少许油，倒入米饭翻炒至米粒散开',
      '倒回鸡蛋，加盐调味，撒葱花翻炒均匀即可',
    ]},
  { id:'r4', cat:'quick', name:'青椒肉丝', time:'12分钟', cal:'220千卡',
    ingredients: ['猪肉','青椒','酱油','食用油','盐','姜'],
    steps: [
      '猪肉切丝加少许酱油和淀粉腌制5分钟，青椒切丝，姜切末',
      '热锅倒油，放入姜末爆香后下肉丝滑炒至变色盛出',
      '锅中留底油，放入青椒丝翻炒至断生',
      '倒回肉丝，加酱油和盐调味，翻炒均匀即可',
    ]},

  /* ---- 减脂餐 ---- */
  { id:'r5', cat:'diet', name:'鸡胸肉蔬菜沙拉', time:'15分钟', cal:'210千卡',
    ingredients: ['鸡胸肉','生菜','番茄','黄瓜','橄榄油','盐'],
    steps: [
      '鸡胸肉冷水下锅，加少许盐和姜片煮约10分钟至熟透',
      '捞出鸡胸肉放凉后撕成丝',
      '生菜洗净撕小片，番茄切块，黄瓜切片',
      '所有食材放入大碗，淋橄榄油和少许盐拌匀即可',
    ]},
  { id:'r6', cat:'diet', name:'番茄豆腐汤', time:'15分钟', cal:'150千卡',
    ingredients: ['番茄','豆腐','鸡蛋','食用油','盐','葱'],
    steps: [
      '番茄切块，豆腐切小方块，鸡蛋打散',
      '热锅少许油，放入番茄翻炒至出汁',
      '加入适量清水烧开，放入豆腐块煮3分钟',
      '淋入蛋液成蛋花，加盐调味，撒葱花出锅',
    ]},
  { id:'r7', cat:'diet', name:'清蒸鸡胸肉', time:'20分钟', cal:'180千卡',
    ingredients: ['鸡胸肉','姜','酱油','盐'],

/* ==================== 菜谱匹配逻辑 ==================== */

var currentFilter = 'all';
var matchResults = [];

function matchRecipes() {
  var pantry = getIngredients();
  var pantryNames = {};
  for (var i=0; i<pantry.length; i++) { pantryNames[pantry[i].name] = true; }
  var results = [];
  for (var j=0; j<allRecipes.length; j++) {
    var r = allRecipes[j];
    var have=[], miss=[];
    for (var k=0; k<r.ingredients.length; k++) {
      if (pantryNames[r.ingredients[k]]) { have.push(r.ingredients[k]); }
      else { miss.push(r.ingredients[k]); }
    }
    var score = have.length / r.ingredients.length;
    results.push({ recipe:r, score:score, have:have, miss:miss });
  }
  results.sort(function(a,b){
    if (b.score !== a.score) return b.score - a.score;
    return a.miss.length - b.miss.length;
  });
  matchResults = results;
  renderRecipes(currentFilter);
}

function filterRecipes(cat, el) {
  currentFilter = cat;
  var tabs = document.querySelectorAll('#filterTabs .filter-tab');
  for (var i=0; i<tabs.length; i++) tabs[i].classList.remove('active');
  if (el) el.classList.add('active');
  renderRecipes(cat);
}

function renderRecipes(cat) {
  var results = matchResults;
  var grid = document.getElementById('recipeGrid');
  if (results.length===0) {
    grid.innerHTML = '<div class="empty-state"><div class="empty-icon">菜</div><p>点击上方按钮看看能做什么</p><p class="sub">根据您家里的食材推荐菜品</p></div>';
    return;
  }
  var filtered = (cat==='all') ? results : results.filter(function(r){ return r.recipe.cat===cat; });
  if (filtered.length===0) {
    grid.innerHTML = '<div class="empty-state"><div class="empty-icon">无</div><p>当前分类下暂无匹配的菜谱</p></div>';
    return;
  }
  var html = '';
  for (var i=0; i<filtered.length; i++) {
    var item = filtered[i];
    var r = item.recipe;
    var scorePct = Math.round(item.score*100);
    var badgeClass = scorePct>=75 ? 'match-high' : (scorePct>=40 ? 'match-mid' : 'match-low');
    var badgeText = scorePct>=75 ? '食材齐全' : (scorePct>=40 ? '部分有' : '缺料多');
    var idx = parseInt(r.id.replace('r',''))-1;
    var bg = recipeColors[idx % recipeColors.length];
    html += '<div class="recipe-card" onclick="openDetail(\''+r.id+'\')">'
          + '<div class="recipe-img" style="background:'+bg+';">'
          + '<span>'+escHtml(r.name)+'</span>'
          + '<span class="match-badge '+badgeClass+'">'+badgeText+'</span>'
          + '</div>'
          + '<div class="recipe-info">'
          + '<div class="r-name">'+escHtml(r.name)+'</div>'
          + '<div class="r-meta"><span>'+r.time+'</span><span>'+r.cal+'</span></div>'
          + '<div class="r-match">'
          + '<span class="have">有'+item.have.length+'种</span>'
          + (item.miss.length>0 ? ' · <span class="miss">缺'+item.miss.length+'种</span>' : ' · <span style="color:var(--green);">全部有</span>')
          + '</div>'
          + '</div>'
          + '</div>';
  }
  grid.innerHTML = html;
}

/* ==================== 菜谱详情 ==================== */

function openDetail(recipeId) {
  var recipe = null;
  for (var i=0; i<allRecipes.length; i++) { if (allRecipes[i].id===recipeId) { recipe=allRecipes[i]; break; } }
  if (!recipe) return;
  var matchItem = null;
  for (var j=0; j<matchResults.length; j++) { if (matchResults[j].recipe.id===recipeId) { matchItem=matchResults[j]; break; } }
  var pantry = getIngredients();
  var pantryMap = {};
  for (var k=0; k<pantry.length; k++) { pantryMap[pantry[k].name] = true; }
  var ingTags = '';
  for (var m=0; m<recipe.ingredients.length; m++) {
    var ing = recipe.ingredients[m];
    var have = !!pantryMap[ing];
    ingTags += '<span class="ing-match-tag '+(have?'have':'miss')+'">'+escHtml(ing)+(have?'（有）':'（缺）')+'</span>';
  }
  var stepsHtml = '';
  for (var s=0; s<recipe.steps.length; s++) {
    stepsHtml += '<li data-step="'+(s+1)+'">'+escHtml(recipe.steps[s])+'</li>';
  }
  var scorePct = matchItem ? Math.round(matchItem.score*100) : 0;
  var matchTip = scorePct>=100 ? '食材都齐了，可以开做啦'
               : (scorePct>=75 ? '大部分食材都有，挺方便的'
               : (scorePct>=40 ? '还差几样，买齐就能做'
               : '缺的食材比较多，建议先采购'));
  var idx = parseInt(recipeId.replace('r',''))-1;
  var bg = recipeColors[idx % recipeColors.length];

  document.getElementById('detailContent').innerHTML =
    '<div class="detail-top" style="background:'+bg+';">'
    + '<h3>'+escHtml(recipe.name)+'</h3>'
    + '<div class="d-meta"><span>'+escHtml(recipe.time)+'</span><span>'+escHtml(recipe.cal)+'</span><span>匹配度 '+scorePct+'%</span></div>'
    + '<div style="margin-top:8px;font-size:0.85rem;opacity:0.9;">'+matchTip+'</div>'
    + '</div>'

    + '<div class="detail-block">'
    + '<h4>所需食材</h4>'
    + '<div class="ing-match-list">'+ingTags+'</div>'
    + '</div>'

    + '<div class="detail-block">'
    + '<h4>烹饪步骤</h4>'
    + '<ol class="step-list">'+stepsHtml+'</ol>'
    + '</div>';

  showPage('detail');
}

/* ==================== 页面路由 ==================== */
var curPage = 'home';

function showPage(name) {
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  var p = document.getElementById('page-'+name);
  if (p) p.classList.add('active');
  curPage = name;
  var isHome = (name==='home');
  document.getElementById('headerBack').style.display = isHome ? 'none' : '';
  window.scrollTo({top:0, behavior:'auto'});
}

function goHome() { showPage('home'); }

/* ==================== 默认食材数据 ==================== */
function initDefaultIngredients() {
  var existing = getIngredients();
  if (existing.length > 0) return;
  var now = new Date();
  var defaults = [
    ['鸡蛋',   '蛋奶', 25,  3],
    ['番茄',   '蔬菜', 5,   2],
    ['鸡胸肉', '肉类', 3,   1],
    ['大米',   '主食', 150, 10],
    ['食用油', '调料', 200, 20],
    ['青菜',   '蔬菜', 3,   1],
    ['豆腐',   '蛋奶', 5,   3],
    ['猪肉',   '肉类', 3,   2],
    ['面条',   '主食', 160, 15],
    ['酱油',   '调料', 200, 30],
  ];
  var list = [];
  for (var i=0; i<defaults.length; i++) {
    var d = defaults[i];
    var addDate = new Date(now.getTime() - d[3]*24*60*60*1000);
    list.push({ name:d[0], cat:d[1], shelf:d[2], addDate:addDate.toISOString() });
  }
  sortIngredients(list);
  saveIngredients(list);
}

/* ==================== 工具函数 ==================== */
function escHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ==================== 初始化 ==================== */
document.addEventListener('DOMContentLoaded', function(){
  initDefaultIngredients();
  renderIngredients();
  matchRecipes();
  showPage('home');
});

document.addEventListener('keydown', function(e){
  if (e.key==='Enter' && document.activeElement===document.getElementById('ingName')) {
    addIngredient();
  }
});
