<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneClickDistill｜一键蒸馏（插件浮窗原型）</title>
    <style>
      :root {
        --bg: #0b0a12;
        --panel: rgba(255, 255, 255, 0.06);
        --panel-2: rgba(0, 0, 0, 0.35);
        --border: rgba(255, 255, 255, 0.12);
        --muted: rgba(255, 255, 255, 0.58);
        --text: rgba(255, 255, 255, 0.92);
        --accent: rgba(167, 139, 250, 0.95);
        --accent-bg: rgba(124, 58, 237, 0.26);
        --danger: rgba(248, 113, 113, 0.92);
        --ok: rgba(45, 212, 191, 0.92);
        --shadow: 0 22px 60px rgba(0, 0, 0, 0.5);
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        --sans: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans";
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: var(--sans);
        background: radial-gradient(1200px 800px at 12% 10%, rgba(124, 58, 237, 0.16), transparent 55%),
          radial-gradient(1000px 700px at 88% 18%, rgba(45, 212, 191, 0.09), transparent 60%),
          radial-gradient(900px 700px at 50% 120%, rgba(99, 102, 241, 0.1), transparent 55%), var(--bg);
        color: var(--text);
        overflow: hidden;
      }
      .backdrop {
        position: fixed;
        inset: 0;
        background: transparent;
        pointer-events: none;
      }
      .backdrop::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(800px 520px at 70% 30%, rgba(255, 255, 255, 0.04), transparent 65%);
        opacity: 0.9;
      }
      .ext {
        position: fixed;
        right: 18px;
        top: 18px;
        width: 388px;
        max-width: calc(100vw - 24px);
        max-height: calc(100vh - 24px);
        border: 1px solid var(--border);
        background: rgba(28, 28, 34, 0.62);
        border-radius: 18px;
        box-shadow: var(--shadow);
        overflow: hidden;
        transform: translateZ(0);
        backdrop-filter: blur(18px) saturate(1.2);
      }
      .ext.fullscreen {
        left: 50%;
        top: 50%;
        right: auto;
        bottom: auto;
        width: min(980px, calc(100vw - 24px));
        height: min(720px, calc(100vh - 24px));
        transform: translate(-50%, -50%);
      }
      .ext-inner {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 42%);
      }
      .fx {
        pointer-events: none;
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.04);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        user-select: none;
        cursor: grab;
      }
      .topbar:active {
        cursor: grabbing;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .logo {
        width: 30px;
        height: 30px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(0, 0, 0, 0.2);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset;
      }
      .logo svg {
        width: 18px;
        height: 18px;
        stroke: rgba(255, 255, 255, 0.92);
        stroke-width: 1.75;
        fill: none;
      }
      .meta {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .kicker {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.56);
      }
      .h1 {
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .iconbtn {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.85);
        width: 34px;
        height: 34px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: background 140ms ease, transform 120ms ease, border-color 140ms ease;
      }
      .iconbtn:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .iconbtn:active {
        transform: translateY(1px);
      }
      .iconbtn svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
      }
      .iconbtn.primary {
        background: rgba(124, 58, 237, 0.22);
        border-color: rgba(167, 139, 250, 0.45);
      }
      .iconbtn.primary:hover {
        background: rgba(124, 58, 237, 0.3);
      }
      .iconbtn.danger {
        background: rgba(248, 113, 113, 0.14);
        border-color: rgba(248, 113, 113, 0.32);
      }
      .stepbar {
        padding: 10px 12px 8px;
      }
      .flow {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 0;
        padding: 2px 8px 0;
      }
      .flow::before {
        content: "";
        position: absolute;
        left: 18px;
        right: 18px;
        top: 12px;
        height: 2px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
      }
      .step {
        border: none;
        background: transparent;
        border-radius: 14px;
        padding: 0 4px;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: 10px;
        min-width: 0;
        transition: transform 180ms ease;
      }
      .step .l {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        flex-direction: column;
        text-align: center;
      }
      .pill {
        width: 14px;
        height: 14px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        font-size: 0;
        border: 2px solid rgba(255, 255, 255, 0.22);
        background: rgba(0, 0, 0, 0.18);
      }
      .step .t {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .step .t strong {
        font-size: 11px;
        font-weight: 650;
        color: rgba(255, 255, 255, 0.8);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .step .t span {
        display: none;
      }
      .step.active {
        transform: translateY(-1px);
      }
      .step.active .pill {
        border-color: rgba(167, 139, 250, 0.9);
        background: rgba(167, 139, 250, 0.14);
        box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.1);
      }
      .step.done {
        transform: translateY(-1px);
      }
      .step.done .pill {
        border-color: rgba(45, 212, 191, 0.9);
        background: rgba(45, 212, 191, 0.12);
        box-shadow: 0 0 0 4px rgba(45, 212, 191, 0.08);
      }
      .content {
        padding: 10px 12px 12px;
        overflow: auto;
        flex: 1;
        min-height: 0;
      }
      .card {
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(0, 0, 0, 0.22);
        border-radius: 16px;
        padding: 12px;
        backdrop-filter: blur(10px) saturate(1.1);
      }
      .seg {
        display: inline-flex;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 4px;
        border-radius: 14px;
        gap: 4px;
      }
      .seg button {
        appearance: none;
        border: none;
        padding: 7px 10px;
        border-radius: 10px;
        background: transparent;
        color: rgba(255, 255, 255, 0.68);
        cursor: pointer;
        font-size: 12px;
        transition: background 140ms ease, color 140ms ease;
      }
      .seg button.active {
        background: rgba(255, 255, 255, 0.14);
        color: rgba(255, 255, 255, 0.92);
      }
      .hint {
        margin-top: 8px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.55);
      }
      textarea,
      input,
      select {
        width: 100%;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(0, 0, 0, 0.35);
        color: rgba(255, 255, 255, 0.92);
        font-family: var(--sans);
        outline: none;
      }
      textarea:focus,
      input:focus,
      select:focus {
        border-color: rgba(167, 139, 250, 0.55);
        box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.12);
      }
      textarea {
        min-height: 220px;
        padding: 10px 10px;
        font-size: 13px;
        line-height: 1.65;
        resize: none;
      }
      input,
      select {
        padding: 9px 10px;
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }
      .btn {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.88);
        padding: 9px 12px;
        border-radius: 14px;
        font-size: 13px;
        cursor: pointer;
        transition: transform 120ms ease, background 140ms ease, border-color 140ms ease, opacity 140ms ease;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn.primary {
        background: rgba(124, 58, 237, 0.22);
        border-color: rgba(167, 139, 250, 0.45);
      }
      .btn.primary:hover {
        background: rgba(124, 58, 237, 0.3);
      }
      .btn.danger {
        background: rgba(248, 113, 113, 0.14);
        border-color: rgba(248, 113, 113, 0.32);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn.small {
        padding: 7px 10px;
        border-radius: 12px;
        font-size: 12px;
      }
      .voice-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: flex-start;
      }
      .voice-actions .iconbtn {
        width: 36px;
        height: 36px;
        border-radius: 14px;
      }
      .iconbtn.big {
        width: 44px;
        height: 44px;
        border-radius: 16px;
      }
      .switch {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
      }
      .switch input {
        width: 16px;
        height: 16px;
        accent-color: rgb(167, 139, 250);
      }
      .spark-zone {
        margin-top: 10px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        padding: 10px;
        display: none;
        animation: rise 240ms cubic-bezier(0.2, 0, 0, 1);
      }
      .spark-on .spark-zone {
        display: block;
      }
      .spark-on .ext {
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(167, 139, 250, 0.14) inset,
          0 0 80px rgba(167, 139, 250, 0.12);
      }
      pre {
        margin: 0;
        width: 100%;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(0, 0, 0, 0.35);
        color: rgba(255, 255, 255, 0.9);
        padding: 10px 10px;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.75;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 420px;
        overflow: auto;
      }
      .footer {
        padding: 10px 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.03);
        display: flex;
        align-items: stretch;
        justify-content: stretch;
        gap: 10px;
      }
      .footer-main {
        flex: 1;
      }
      .footer-select {
        width: 42%;
        display: none;
      }
      .footnote {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.45);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(0, 0, 0, 0.52);
        color: rgba(255, 255, 255, 0.9);
        font-size: 12px;
        box-shadow: var(--shadow);
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease, transform 180ms ease;
      }
      .toast.on {
        opacity: 1;
        transform: translateX(-50%) translateY(-2px);
      }
      .pane {
        display: none;
        animation: rise 240ms cubic-bezier(0.2, 0, 0, 1);
      }
      .pane.on {
        display: block;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .particle {
        position: absolute;
        left: 50%;
        top: 40%;
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: rgba(167, 139, 250, 0.95);
        filter: drop-shadow(0 0 10px rgba(167, 139, 250, 0.35));
        opacity: 0;
        transform: translate(-50%, -50%);
        animation: boom 780ms cubic-bezier(0.2, 0, 0.2, 1) forwards;
      }
      @keyframes boom {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.4);
        }
        14% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2);
        }
      }
    </style>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>

    <div id="sparkRoot" class="">
      <div class="ext" id="ext">
        <div class="ext-inner">
          <div class="fx" id="fx"></div>

          <div class="topbar" id="dragHandle">
            <div class="brand">
              <div class="logo" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M12 2l2.6 6.4L21 11l-6.4 2.6L12 20l-2.6-6.4L3 11l6.4-2.6L12 2z"></path>
                </svg>
              </div>
              <div class="meta">
                <div class="kicker">Extension Popup · One Piece</div>
                <div class="h1" id="headerTitle">一键蒸馏 · Spark 一下</div>
              </div>
            </div>
            <div class="actions">
              <button class="iconbtn" id="btnTab" type="button" title="在标签页全屏打开（模拟）">
                <svg viewBox="0 0 24 24">
                  <path d="M15 3h6v6"></path>
                  <path d="M21 3l-8 8"></path>
                  <path d="M9 21H3v-6"></path>
                  <path d="M3 21l8-8"></path>
                </svg>
              </button>
              <button class="iconbtn" id="btnClose" type="button" title="关闭并清空">
                <svg viewBox="0 0 24 24">
                  <path d="M18 6 6 18"></path>
                  <path d="M6 6l12 12"></path>
                </svg>
              </button>
            </div>
          </div>

          <div class="stepbar">
            <div class="flow">
              <div class="step active" id="step1">
                <div class="l">
                  <div class="pill">1</div>
                  <div class="t">
                    <strong>采集</strong>
                    <span>文本/录音</span>
                  </div>
                </div>
              </div>
              <div class="step" id="step2">
                <div class="l">
                  <div class="pill">2</div>
                  <div class="t">
                    <strong>蒸馏</strong>
                    <span>结构化精华</span>
                  </div>
                </div>
              </div>
              <div class="step" id="step3">
                <div class="l">
                  <div class="pill">3</div>
                  <div class="t">
                    <strong>带回</strong>
                    <span>复制/导出</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="content">
            <div class="pane on" id="pane1">
              <div class="card">
                <div class="row">
                  <div class="seg" role="tablist" aria-label="输入模式">
                    <button id="tabVoice" class="active" type="button" role="tab" aria-selected="true">录音</button>
                    <button id="tabText" type="button" role="tab" aria-selected="false">文本</button>
                  </div>
                </div>
                <div class="hint" id="inputHint">默认录音：录制 → 停止 → 语音转文本 → 蒸馏</div>
                <div class="row" id="voiceControls">
                  <div class="voice-actions" aria-label="录音操作">
                    <button class="iconbtn primary big" id="recStart" type="button" title="录制">
                      <svg viewBox="0 0 24 24">
                        <path d="M12 14a3 3 0 0 0 3-3V7a3 3 0 1 0-6 0v4a3 3 0 0 0 3 3z"></path>
                        <path d="M19 11a7 7 0 0 1-14 0"></path>
                        <path d="M12 18v3"></path>
                        <path d="M8 21h8"></path>
                      </svg>
                    </button>
                    <button class="iconbtn" id="recPause" type="button" title="暂停" style="display: none">
                      <svg viewBox="0 0 24 24">
                        <path d="M8 5v14"></path>
                        <path d="M16 5v14"></path>
                      </svg>
                    </button>
                    <button class="iconbtn danger" id="recStop" type="button" title="停止" style="display: none">
                      <svg viewBox="0 0 24 24">
                        <path d="M8 8h8v8H8z"></path>
                      </svg>
                    </button>
                    <button class="iconbtn primary" id="btnTranscribe" type="button" title="语音转文本" style="display: none">
                      <svg viewBox="0 0 24 24">
                        <path d="M4 7h16"></path>
                        <path d="M4 12h10"></path>
                        <path d="M4 17h12"></path>
                        <path d="M19 12l2 2-4 4"></path>
                      </svg>
                    </button>
                  </div>
                  <div class="switch" title="录音/暂停/停止为 Demo 交互；转写能力依赖浏览器">
                    <span style="font-size: 12px; color: rgba(255, 255, 255, 0.78)">录音状态</span>
                    <span id="voiceStatus" style="font-size: 12px; color: rgba(255, 255, 255, 0.5)">待机</span>
                  </div>
                </div>
                <div id="textAreaBlock" style="display: none; margin-top: 10px">
                  <textarea id="rawText" placeholder="转写结果会出现在这里（可编辑）。也可以切到“文本”直接粘贴。"></textarea>
                </div>
              </div>
            </div>

            <div class="pane" id="pane2">
              <div class="card">
                <div class="row">
                  <div class="subhead" style="font-size: 13px; font-weight: 650">蒸馏精华</div>
                  <input type="checkbox" id="sparkToggle" hidden />
                </div>
                <div class="hint">把社会化表达剥离成可执行骨架 + 风险暴露。</div>
                <pre id="distillPreview">点击「下一步：蒸馏」开始。</pre>

                <div class="spark-zone" id="sparkZone">
                  <div class="row">
                    <div class="subhead" style="font-size: 13px; font-weight: 650">Spark 一下（组装）</div>
                    <button class="btn" id="reAssembleBtn" type="button" disabled>重新组装</button>
                  </div>
                  <div style="height: 10px"></div>
                  <div style="display: grid; gap: 10px">
                    <select id="artifactType">
                      <option value="prd">需求文档（PRD）</option>
                      <option value="execution">执行清单（Checklist）</option>
                      <option value="reply">对上回复（邮件/IM）</option>
                      <option value="weekly">周报答卷（精华+行动）</option>
                      <option value="custom">自定义产物</option>
                    </select>
                    <div id="customBlock" style="display: none; gap: 10px">
                      <input id="customTitle" placeholder="自定义产物名称（例如：投标答卷 / 对齐纪要模板）" />
                      <textarea
                        id="customHint"
                        style="min-height: 110px"
                        placeholder="自定义转换技能（写给 AI/系统的产物生成指令，例如：更偏销售话术、更偏技术实施）"
                      ></textarea>
                    </div>
                    <textarea
                      id="extraConstraints"
                      style="min-height: 92px"
                      placeholder="补充条件（可选）：新增约束/口径/新增产物设定/风控要求..."
                    ></textarea>
                  </div>
                </div>
              </div>
            </div>

            <div class="pane" id="pane3">
              <div class="card">
                <div class="row">
                  <div class="subhead" style="font-size: 13px; font-weight: 650">带回现场（Markdown）</div>
                  <div class="row" style="gap: 8px; display: none">
                    <button class="btn" id="copyBtn" type="button" disabled>复制</button>
                    <button class="btn" id="downloadBtn" type="button" disabled>导出 .md</button>
                  </div>
                </div>
                <div class="hint">复制/导出后你可以把“答卷”带回沟通现场确认。</div>
                <pre id="mdPreview">还没有产物。请先完成蒸馏（可选 Spark 一下）。</pre>
              </div>
            </div>
          </div>
          <div class="footer">
            <button class="btn" id="btnBack" type="button" style="display: none">导出 .md</button>
            <select class="footer-select" id="footerArtifactType">
              <option value="prd">需求文档（PRD）</option>
              <option value="execution">执行清单（Checklist）</option>
              <option value="reply">对上回复（邮件/IM）</option>
              <option value="weekly">周报答卷（精华+行动）</option>
              <option value="custom">自定义产物</option>
            </select>
            <button class="btn primary footer-main" id="btnNext" type="button">蒸馏</button>
          </div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      const sampleText =
        "领导：这周我们要把XX项目推进一下。你先拉个会把上下游对齐下，方案尽快给我一个版本，我周五要看。最好把风险也提前想好，别到时候卡住。预算先按20万以内考虑，但如果确实有必要也可以再聊。";

      const el = (id) => document.getElementById(id);
      const ext = el("ext");
      const fx = el("fx");
      const sparkRoot = el("sparkRoot");

      const panes = [el("pane1"), el("pane2"), el("pane3")];
      const steps = [el("step1"), el("step2"), el("step3")];
      const btnBack = el("btnBack");
      const btnNext = el("btnNext");
      const btnClose = el("btnClose");
      const btnTab = el("btnTab");
      const toast = el("toast");
      const headerTitle = el("headerTitle");
      const footerArtifactType = el("footerArtifactType");

      const rawText = el("rawText");
      const tabText = el("tabText");
      const tabVoice = el("tabVoice");
      const inputHint = el("inputHint");
      const voiceControls = el("voiceControls");
      const textAreaBlock = el("textAreaBlock");
      const voiceHint = el("voiceHint");
      const voiceStatus = el("voiceStatus");
      const recStart = el("recStart");
      const recPause = el("recPause");
      const recStop = el("recStop");
      const btnTranscribe = el("btnTranscribe");

      const distillPreview = el("distillPreview");
      const sparkToggle = el("sparkToggle");
      const sparkZone = el("sparkZone");
      const reAssembleBtn = el("reAssembleBtn");
      const artifactType = el("artifactType");
      const customBlock = el("customBlock");
      const customTitle = el("customTitle");
      const customHint = el("customHint");
      const extraConstraints = el("extraConstraints");

      const mdPreview = el("mdPreview");
      const copyBtn = el("copyBtn");
      const downloadBtn = el("downloadBtn");

      const state = {
        step: 1,
        inputMode: "text",
        distilled: null,
        markdown: "",
        speech: { supported: false, recording: false, instance: null, buffer: "" },
        media: { supported: false, recording: false, paused: false, stream: null, recorder: null, chunks: [], blob: null },
      };

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("on");
        window.setTimeout(() => toast.classList.remove("on"), 1100);
      }

      function normalizeText(t) {
        return String(t || "").replace(/\r\n/g, "\n").trim();
      }

      function splitSentences(text) {
        return normalizeText(text)
          .split(/[\n。！？!?；;]+/g)
          .map((s) => s.trim())
          .filter(Boolean);
      }

      function uniq(items) {
        const seen = new Set();
        const out = [];
        for (const it of items) {
          const v = String(it || "").trim();
          if (!v) continue;
          if (seen.has(v)) continue;
          seen.add(v);
          out.push(v);
        }
        return out;
      }

      function extract(text, patterns) {
        const hits = [];
        for (const p of patterns) {
          const matches = text.matchAll(p);
          for (const m of matches) {
            if (m && m.groups) {
              for (const v of Object.values(m.groups)) {
                if (typeof v === "string" && v.trim()) hits.push(v.trim());
              }
            } else if (m && m[0]) {
              hits.push(String(m[0]).trim());
            }
          }
        }
        return uniq(hits);
      }

      function detectAmbiguity(text) {
        const words = ["尽快", "适当", "差不多", "大概", "有空", "最好", "尽量", "看情况", "先", "再说", "之后再", "对齐一下"];
        return words.filter((w) => text.includes(w));
      }

      function distill(text) {
        const t = normalizeText(text);
        const sentences = splitSentences(t);
        const titleSeed = sentences.find((s) => s.length >= 6) || "任务蒸馏";
        const title = titleSeed.length > 24 ? titleSeed.slice(0, 24) + "…" : titleSeed;
        const summary = sentences.slice(0, 2).join("；") || "将原始沟通蒸馏为结构化可执行内容，并显性暴露风险与追问";

        const when = extract(t, [
          /(?<date>\d{4}-\d{2}-\d{2})/g,
          /(?<date>\d{1,2}月\d{1,2}日)/g,
          /(?<day>周[一二三四五六日天])/g,
          /(?<rel>今天|明天|后天|本周|下周|下个月)/g,
        ]);
        const budget = extract(t, [
          /(?<budget>\d+(?:\.\d+)?\s*(?:万|w|W|千|元|块))/g,
          /(?<budget>预算\s*[:：]?\s*\d+(?:\.\d+)?\s*(?:万|w|W|千|元|块))/g,
        ]);
        const who = uniq((t.match(/(领导|老板|上游|下游|产品|研发|设计|运营|测试|法务|财务|销售|客服)/g) || []).map((x) => x));
        const ambiguity = detectAmbiguity(t);

        const actionKeys = ["需要", "请", "麻烦", "安排", "跟进", "输出", "提交", "提供", "确认", "对齐", "评估", "上线", "交付", "整理", "同步"];
        const actions = sentences.filter((s) => actionKeys.some((k) => s.includes(k))).slice(0, 6);

        const risks = [];
        if (when.length === 0) risks.push("未给出明确截止时间/里程碑，容易拖延或反复确认");
        if (who.length === 0) risks.push("缺少明确 Owner/责任边界，容易产生责任漂移");
        if (ambiguity.length > 0) risks.push("存在模糊词：" + ambiguity.join(" / ") + "，需要转为可选答案或明确口径");
        if (budget.length > 0) risks.push("涉及预算口径：" + budget.join(" / "));

        const questions = [];
        if (when.length === 0) questions.push("截止时间与里程碑分别是什么？");
        if (who.length === 0) questions.push("Owner 是谁？协作方是谁？需要谁拍板？");
        questions.push("验收标准是什么？什么算“完成/可上线/可交付”？");
        if (budget.length > 0) questions.push("预算口径的弹性区间与审批路径是什么？");

        return { title, summary, when, budget, who, actions, risks, questions };
      }

      function mdList(items, empty) {
        if (!items || items.length === 0) return "- " + empty;
        return items.map((x) => "- " + x).join("\n");
      }

      function assembleMarkdown(result, config) {
        const sparkOn = Boolean(config.enabled);
        if (!sparkOn) {
          return [
            "# 蒸馏精华：" + result.title,
            "",
            "## 摘要",
            "- " + result.summary,
            "",
            "## 行动项",
            result.actions.length ? result.actions.map((a, i) => "- [ ] " + (i + 1) + ". " + a).join("\n") : "- [ ] 先补齐关键约束，再生成清单",
            "",
            "## 风险",
            mdList(result.risks, "暂无明确风险（仍建议补齐 Owner/时间/验收）"),
            "",
            "## 待确认问题",
            mdList(result.questions, "暂无"),
            "",
          ].join("\n");
        }

        const type = config.artifactType;
        const title =
          type === "custom" && config.customTitle
            ? config.customTitle
            : type === "prd"
              ? "需求文档（PRD）"
              : type === "execution"
                ? "执行清单"
                : type === "reply"
                  ? "对上回复"
                  : type === "weekly"
                    ? "周报答卷"
                    : "自定义产物";

        const constraints = splitSentences(config.extraConstraints || "");
        const constraintsSection = constraints.length ? ["## 补充条件", mdList(constraints, "无"), ""].join("\n") : "";

        if (type === "execution") {
          return [
            "# " + title + "：" + result.title,
            "",
            "## 蒸馏精华（输入摘要）",
            "- " + result.summary,
            "",
            constraintsSection,
            "## 执行清单",
            result.actions.length ? result.actions.map((a, i) => "- [ ] " + (i + 1) + ". " + a).join("\n") : "- [ ] 先补齐目标/时间/Owner/验收，再生成清单",
            "",
            "## 风险与应对（示例）",
            mdList(result.risks.map((r) => r + "\n  - 补齐时间/Owner/验收\n  - 将模糊点改为可选答案（A/B/C）供确认"), "暂无"),
            "",
            "## 待确认问题",
            mdList(result.questions, "暂无"),
            "",
          ]
            .filter(Boolean)
            .join("\n");
        }

        if (type === "reply") {
          const bullets = result.actions.slice(0, 3).map((w) => "- " + w).join("\n") || "- 待确认：本次目标/交付";
          const ask = result.questions.slice(0, 4).map((q) => "- " + q).join("\n") || "- 待确认：截止时间/Owner/验收标准";
          return [
            "# " + title + "：" + result.title,
            "",
            "## 建议回复（可直接发给对方）",
            "我理解本次目标如下：",
            bullets,
            "",
            "我可以先输出一个可评审版本，方便您快速确认。为避免后续卡点，想先确认几个关键问题：",
            ask,
            "",
            "如果您同意，我将按上述口径推进，并在关键节点同步进展。",
            "",
          ]
            .filter(Boolean)
            .join("\n");
        }

        if (type === "weekly") {
          return [
            "# " + title + "：" + result.title,
            "",
            "## 本周进展（精华）",
            mdList(result.actions.slice(0, 4), "待同步"),
            "",
            "## 下周计划（行动项）",
            mdList(result.actions.slice(0, 5), "待补齐关键约束后生成"),
            "",
            "## 风险",
            mdList(result.risks, "暂无"),
            "",
            "## 待确认问题",
            mdList(result.questions, "暂无"),
            "",
          ].join("\n");
        }

        if (type === "custom") {
          const customHeader = config.customHint
            ? ["## 自定义转换技能", mdList(splitSentences(config.customHint), "无"), ""].join("\n")
            : "";
          return [
            "# " + title + "：" + result.title,
            "",
            "## 蒸馏精华（输入摘要）",
            "- " + result.summary,
            "",
            constraintsSection,
            customHeader,
            "## 任务定义（结构化）",
            "- 行动项：" + (result.actions[0] || "待确认"),
            "- 时间：" + (result.when.join(" / ") || "待确认"),
            "- 责任：" + (result.who.join(" / ") || "待确认"),
            "- 预算：" + (result.budget.join(" / ") || "待确认"),
            "",
          ]
            .filter(Boolean)
            .join("\n");
        }

        return [
          "# " + title + "：" + result.title,
          "",
          "## 背景与目的",
          "- " + result.summary,
          "",
          constraintsSection,
          "## 交付与验收（待补齐）",
          "- 交付物：待确认",
          "- 验收标准：待确认",
          "",
          "## 风险与待确认问题",
          "### 风险",
          mdList(result.risks, "暂无"),
          "",
          "### 待确认问题",
          mdList(result.questions, "暂无"),
          "",
        ]
          .filter(Boolean)
          .join("\n");
      }

      function updateCustomBlock() {
        const on = sparkToggle.checked && artifactType.value === "custom";
        customBlock.style.display = on ? "grid" : "none";
      }

      function markSteps() {
        steps.forEach((s, idx) => {
          const n = idx + 1;
          s.classList.toggle("active", n === state.step);
          s.classList.toggle("done", n < state.step);
        });
      }

      function showPane(n) {
        state.step = n;
        panes.forEach((p, idx) => p.classList.toggle("on", idx + 1 === n));
        markSteps();
        btnBack.style.display = "none";
        btnBack.disabled = true;
        footerArtifactType.style.display = n === 2 ? "block" : "none";
        footerArtifactType.value = artifactType.value;
        if (n === 1) btnNext.textContent = "蒸馏";
        if (n === 2) btnNext.textContent = "Spark 一下";
        if (n === 3) btnNext.textContent = "复制";
      }

      function renderDistillPreview() {
        if (!state.distilled) {
          distillPreview.textContent = "点击「下一步：蒸馏」开始。";
          return;
        }
        const r = state.distilled;
        distillPreview.textContent = [
          "# 蒸馏精华：" + r.title,
          "",
          "摘要：",
          "- " + r.summary,
          "",
          "行动项：",
          (r.actions.length ? r.actions.map((a, i) => "- " + (i + 1) + ". " + a).join("\n") : "- （信息密度较低，建议先补齐关键约束）"),
          "",
          "风险：",
          mdList(r.risks, "暂无明确风险（仍建议补齐 Owner/时间/验收）"),
          "",
          "待确认问题：",
          mdList(r.questions, "暂无"),
        ].join("\n");
      }

      function refreshMarkdown() {
        if (!state.distilled) return;
        const config = {
          enabled: sparkToggle.checked,
          artifactType: artifactType.value,
          customTitle: normalizeText(customTitle.value),
          customHint: normalizeText(customHint.value),
          extraConstraints: normalizeText(extraConstraints.value),
        };
        state.markdown = assembleMarkdown(state.distilled, config);
        mdPreview.textContent = state.markdown;
        copyBtn.disabled = !state.markdown.trim();
        downloadBtn.disabled = !state.markdown.trim();
        reAssembleBtn.disabled = !(sparkToggle.checked && state.distilled);
        if (state.step === 3) {
          btnBack.disabled = !state.markdown.trim();
        }
      }

      function fireworks() {
        const colors = ["rgba(167,139,250,0.95)", "rgba(45,212,191,0.95)", "rgba(248,113,113,0.9)", "rgba(251,191,36,0.9)"];
        const count = 22;
        for (let i = 0; i < count; i += 1) {
          const p = document.createElement("div");
          p.className = "particle";
          const angle = (Math.PI * 2 * i) / count;
          const r = 120 + Math.random() * 90;
          const dx = Math.cos(angle) * r;
          const dy = Math.sin(angle) * r * 0.85;
          p.style.setProperty("--dx", dx.toFixed(1) + "px");
          p.style.setProperty("--dy", dy.toFixed(1) + "px");
          p.style.background = colors[i % colors.length];
          p.style.left = 72 + Math.random() * 16 + "%";
          p.style.top = 18 + Math.random() * 16 + "%";
          fx.appendChild(p);
          window.setTimeout(() => p.remove(), 900);
        }
      }

      async function safeCopy(text) {
        const t = String(text || "");
        try {
          await navigator.clipboard.writeText(t);
          return true;
        } catch {
          try {
            const ta = document.createElement("textarea");
            ta.value = t;
            ta.setAttribute("readonly", "true");
            ta.style.position = "fixed";
            ta.style.left = "-9999px";
            document.body.appendChild(ta);
            ta.select();
            const ok = document.execCommand("copy");
            document.body.removeChild(ta);
            return ok;
          } catch {
            return false;
          }
        }
      }

      function downloadMarkdown(markdown, filename) {
        const blob = new Blob([String(markdown || "")], { type: "text/markdown;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      function initSpeech() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        state.speech.supported = Boolean(SpeechRecognition);
        if (!SpeechRecognition) {
          voiceStatus.textContent = "不支持";
          voiceHint.textContent = "当前浏览器不支持语音转写；可切到“文本”粘贴演示。";
          return;
        }
        const rec = new SpeechRecognition();
        rec.lang = "zh-CN";
        rec.continuous = true;
        rec.interimResults = false;
        rec.onresult = (e) => {
          const lines = [];
          for (let i = e.resultIndex; i < e.results.length; i += 1) {
            const r = e.results[i];
            const tx = (r && r[0] && r[0].transcript ? String(r[0].transcript) : "").trim();
            if (tx) lines.push(tx);
          }
          if (lines.length) {
            state.speech.buffer = (state.speech.buffer ? state.speech.buffer + " " : "") + lines.join(" ");
          }
        };
        rec.onerror = () => {
          state.speech.recording = false;
          voiceStatus.textContent = "失败";
          showToast("语音转写失败（可改用文本粘贴演示）");
        };
        rec.onend = () => {
          if (!state.speech.recording) return;
          state.speech.recording = false;
          voiceStatus.textContent = "待机";
        };
        state.speech.instance = rec;
        voiceStatus.textContent = "待机";
        voiceHint.textContent = "录制完成后点“转文本”写入输入框，再点击底部「蒸馏」。";
      }

      async function startCapture() {
        if (textAreaBlock) textAreaBlock.style.display = "none";
        rawText.value = "";
        state.speech.buffer = "";
        state.media.blob = null;
        state.media.chunks = [];
        const canMedia = Boolean(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
        state.media.supported = canMedia;

        if (canMedia) {
          try {
            state.media.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const rec = new MediaRecorder(state.media.stream);
            rec.ondataavailable = (e) => {
              if (e.data && e.data.size > 0) state.media.chunks.push(e.data);
            };
            rec.onstop = () => {
              state.media.blob = new Blob(state.media.chunks, { type: "audio/webm" });
              if (state.media.stream) {
                state.media.stream.getTracks().forEach((t) => t.stop());
              }
              state.media.stream = null;
            };
            state.media.recorder = rec;
            rec.start();
          } catch {
            state.media.recorder = null;
            state.media.stream = null;
          }
        }

        if (state.speech.supported && state.speech.instance) {
          try {
            state.speech.recording = true;
            state.speech.instance.start();
          } catch {}
        }

        state.media.recording = true;
        state.media.paused = false;
        voiceStatus.textContent = "录制中";
        setVoiceButtons("recording");
        showToast("开始录制");
      }

      function setVoiceButtons(mode) {
        if (!recStart || !recPause || !recStop || !btnTranscribe) return;

        const pauseSvg = `
          <svg viewBox="0 0 24 24">
            <path d="M8 5v14"></path>
            <path d="M16 5v14"></path>
          </svg>
        `;
        const playSvg = `
          <svg viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"></path>
          </svg>
        `;

        if (mode === "idle") {
          recStart.style.display = "";
          recPause.style.display = "none";
          recStop.style.display = "none";
          btnTranscribe.style.display = "none";
          recPause.innerHTML = pauseSvg;
          recPause.title = "暂停";
          return;
        }

        if (mode === "recording") {
          recStart.style.display = "none";
          recPause.style.display = "";
          recStop.style.display = "";
          btnTranscribe.style.display = "none";
          recPause.innerHTML = pauseSvg;
          recPause.title = "暂停";
          return;
        }

        if (mode === "paused") {
          recStart.style.display = "none";
          recPause.style.display = "";
          recStop.style.display = "";
          btnTranscribe.style.display = "none";
          recPause.innerHTML = playSvg;
          recPause.title = "继续";
          return;
        }

        if (mode === "stopped") {
          recStart.style.display = "";
          recPause.style.display = "none";
          recStop.style.display = "none";
          btnTranscribe.style.display = "";
          recPause.innerHTML = pauseSvg;
          recPause.title = "暂停";
        }
      }

      function pauseResumeCapture() {
        if (!state.media.recording) return;
        if (!state.media.paused) {
          state.media.paused = true;
          voiceStatus.textContent = "暂停";
          try {
            if (state.media.recorder && state.media.recorder.state === "recording") state.media.recorder.pause();
          } catch {}
          try {
            if (state.speech.recording && state.speech.instance) state.speech.instance.stop();
          } catch {}
          state.speech.recording = false;
          setVoiceButtons("paused");
          return;
        }

        state.media.paused = false;
        voiceStatus.textContent = "录制中";
        try {
          if (state.media.recorder && state.media.recorder.state === "paused") state.media.recorder.resume();
        } catch {}
        try {
          if (state.speech.supported && state.speech.instance) {
            state.speech.recording = true;
            state.speech.instance.start();
          }
        } catch {}
        setVoiceButtons("recording");
      }

      function stopCapture() {
        if (!state.media.recording) return;
        state.media.recording = false;
        state.media.paused = false;

        try {
          if (state.speech.recording && state.speech.instance) state.speech.instance.stop();
        } catch {}
        state.speech.recording = false;

        try {
          if (state.media.recorder && state.media.recorder.state !== "inactive") state.media.recorder.stop();
        } catch {}

        voiceStatus.textContent = "已停止";
        if (!state.speech.supported) {
          setVoiceButtons("idle");
          showToast("当前浏览器不支持转文本（可切到文本粘贴演示）");
          return;
        }
        setVoiceButtons("stopped");
        showToast("已停止，点击“转文本”");
      }

      function transcribeToText() {
        const t = normalizeText(state.speech.buffer);
        if (!t) {
          showToast(state.speech.supported ? "未捕获到转写内容（可直接文本粘贴演示）" : "不支持语音转写，请用文本粘贴演示");
          return;
        }
        const prev = normalizeText(rawText.value);
        rawText.value = prev ? prev + "\n" + t : t;
        state.speech.buffer = "";
        if (textAreaBlock) textAreaBlock.style.display = "block";
        setVoiceButtons("idle");
        showToast("已转为文本");
      }

      function setInputMode(mode) {
        state.inputMode = mode;
        const isText = mode === "text";
        tabText.classList.toggle("active", isText);
        tabText.setAttribute("aria-selected", String(isText));
        tabVoice.classList.toggle("active", !isText);
        tabVoice.setAttribute("aria-selected", String(!isText));
        inputHint.textContent = isText ? "文本：直接粘贴/编辑，然后点击底部「蒸馏」" : "默认录音：录制 → 停止 → 转文本 → 蒸馏";
        if (voiceControls) voiceControls.style.display = isText ? "none" : "";
        if (voiceHint) voiceHint.style.display = isText ? "none" : "";
        if (textAreaBlock) {
          if (isText) {
            textAreaBlock.style.display = "block";
          } else {
            const hasText = normalizeText(rawText.value).length > 0;
            textAreaBlock.style.display = hasText ? "block" : "none";
          }
        }
      }

      function runDistillAndGo() {
        if (!normalizeText(rawText.value) && normalizeText(state.speech.buffer)) {
          rawText.value = normalizeText(state.speech.buffer);
          state.speech.buffer = "";
        }
        const text = normalizeText(rawText.value);
        if (!text) {
          showToast("请先采集内容（录音转文本或直接粘贴）");
          return false;
        }
        state.distilled = distill(text);
        renderDistillPreview();
        refreshMarkdown();
        showToast("蒸馏完成");
        return true;
      }

      function updateSparkUi(animate) {
        const on = sparkToggle.checked;
        sparkRoot.classList.toggle("spark-on", on);
        sparkZone.style.display = on ? "block" : "none";
        headerTitle.textContent = on ? "一键蒸馏 · Spark 一下" : "一键蒸馏";
        if (on && animate) fireworks();
        updateCustomBlock();
        if (state.distilled) refreshMarkdown();
        if (state.step === 2) btnNext.textContent = "Spark 一下";
      }

      function resetAll() {
        rawText.value = "";
        extraConstraints.value = "";
        customTitle.value = "";
        customHint.value = "";
        artifactType.value = "prd";
        sparkToggle.checked = false;
        state.distilled = null;
        state.markdown = "";
        mdPreview.textContent = "还没有产物。请先完成蒸馏（可选 Spark 一下）。";
        distillPreview.textContent = "点击「下一步：蒸馏」开始。";
        copyBtn.disabled = true;
        downloadBtn.disabled = true;
        updateSparkUi(false);
        showPane(1);
      }

      tabText.addEventListener("click", () => setInputMode("text"));
      tabVoice.addEventListener("click", () => setInputMode("voice"));
      recStart.addEventListener("click", startCapture);
      recPause.addEventListener("click", pauseResumeCapture);
      recStop.addEventListener("click", stopCapture);
      btnTranscribe.addEventListener("click", transcribeToText);

      sparkToggle.addEventListener("change", () => updateSparkUi(true));
      artifactType.addEventListener("change", () => {
        footerArtifactType.value = artifactType.value;
        updateCustomBlock();
        if (state.distilled && sparkToggle.checked) refreshMarkdown();
      });
      footerArtifactType.addEventListener("change", () => {
        artifactType.value = footerArtifactType.value;
        updateCustomBlock();
        if (state.distilled && sparkToggle.checked) refreshMarkdown();
      });
      customTitle.addEventListener("input", () => state.distilled && sparkToggle.checked && refreshMarkdown());
      customHint.addEventListener("input", () => state.distilled && sparkToggle.checked && refreshMarkdown());
      extraConstraints.addEventListener("input", () => state.distilled && sparkToggle.checked && refreshMarkdown());
      reAssembleBtn.addEventListener("click", () => {
        if (!state.distilled) return;
        refreshMarkdown();
        showToast("已重新组装");
      });

      copyBtn.addEventListener("click", async () => {
        if (!state.markdown.trim()) return;
        const ok = await safeCopy(state.markdown);
        showToast(ok ? "已复制" : "复制失败（请检查权限）");
      });

      downloadBtn.addEventListener("click", () => {
        if (!state.markdown.trim()) return;
        const typeLabel = artifactType.options[artifactType.selectedIndex].textContent || "产物";
        const date = new Date().toISOString().slice(0, 10);
        downloadMarkdown(state.markdown, "oneclickdistill_" + typeLabel + "_" + date + ".md");
        showToast("已导出 .md");
      });

      btnBack.addEventListener("click", () => {
        if (state.step !== 3) return;
        if (!state.markdown.trim()) {
          showToast("还没有可导出内容");
          return;
        }
        const typeLabel = artifactType.options[artifactType.selectedIndex].textContent || "产物";
        const date = new Date().toISOString().slice(0, 10);
        downloadMarkdown(state.markdown, "oneclickdistill_" + typeLabel + "_" + date + ".md");
        showToast("已导出 .md");
      });
      btnNext.addEventListener("click", () => {
        if (state.step === 1) {
          const ok = runDistillAndGo();
          if (ok) showPane(2);
          return;
        }
        if (state.step === 2) {
          if (!state.distilled) {
            const ok = runDistillAndGo();
            if (!ok) return;
          }
          artifactType.value = footerArtifactType.value;
          if (!sparkToggle.checked) {
            sparkToggle.checked = true;
          }
          updateSparkUi(true);
          refreshMarkdown();
          if (!state.markdown.trim()) {
            showToast("还没有可下载内容");
            return;
          }
          const typeLabel = artifactType.options[artifactType.selectedIndex].textContent || "产物";
          const date = new Date().toISOString().slice(0, 10);
          downloadMarkdown(state.markdown, "oneclickdistill_" + typeLabel + "_" + date + ".md");
          showToast("已下载 .md");
          return;
        }
        if (!state.markdown.trim()) {
          showToast("还没有可复制内容");
          return;
        }
        safeCopy(state.markdown).then((ok) => showToast(ok ? "已复制" : "复制失败（请检查权限）"));
      });

      btnClose.addEventListener("click", () => {
        resetAll();
        ext.style.display = "none";
        showToast("已关闭并清空");
        window.setTimeout(() => (ext.style.display = ""), 80);
      });

      btnTab.addEventListener("click", () => {
        try {
          window.open(location.href.split("#")[0] + "#tab", "_blank");
        } catch {
          ext.classList.toggle("fullscreen");
        }
      });

      function applyModeFromHash() {
        const isTab = location.hash === "#tab";
        ext.classList.toggle("fullscreen", isTab);
      }
      window.addEventListener("hashchange", applyModeFromHash);

      const drag = { active: false, startX: 0, startY: 0, startLeft: 0, startTop: 0 };
      const dragHandle = el("dragHandle");
      dragHandle.addEventListener("mousedown", (e) => {
        if (ext.classList.contains("fullscreen")) return;
        drag.active = true;
        drag.startX = e.clientX;
        drag.startY = e.clientY;
        const rect = ext.getBoundingClientRect();
        drag.startLeft = rect.left;
        drag.startTop = rect.top;
      });
      window.addEventListener("mousemove", (e) => {
        if (!drag.active) return;
        const dx = e.clientX - drag.startX;
        const dy = e.clientY - drag.startY;
        const left = Math.max(8, Math.min(window.innerWidth - ext.offsetWidth - 8, drag.startLeft + dx));
        const top = Math.max(8, Math.min(window.innerHeight - ext.offsetHeight - 8, drag.startTop + dy));
        ext.style.left = left + "px";
        ext.style.top = top + "px";
        ext.style.right = "auto";
      });
      window.addEventListener("mouseup", () => (drag.active = false));

      rawText.value = "";
      setInputMode("voice");
      initSpeech();
      applyModeFromHash();
      updateSparkUi(false);
      showPane(1);
    </script>
  </body>
</html>
