<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>原创武侠 2D 居中版</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #050505;
      color: #f8e8bb;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage {
      width: min(100vw, 470px);
      height: min(100vh, 900px);
      background: #000;
      position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,.85);
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: auto;
      background: #000;
    }
    #toast {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 112px;
      min-height: 54px;
      padding: 10px 12px;
      border: 2px solid #111;
      outline: 2px solid #555;
      background: rgba(235, 235, 235, .94);
      color: #111;
      font-size: 15px;
      line-height: 1.45;
      display: none;
      z-index: 4;
    }
    #actionBtn {
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(20,20,20,.72);
      color: #ffe58e;
      font-weight: 800;
      font-size: 18px;
    }
    #actionBtn {
      position: absolute;
      right: 18px;
      bottom: 184px;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      z-index: 3;
      color: #fff0af;
      background: radial-gradient(circle, rgba(148,50,26,.95), rgba(66,20,14,.86));
    }
  </style>
</head>

    function setRect(x1, y1, x2, y2, type) {
      for (let y = y1; y <= y2; y++) for (let x = x1; x <= x2; x++) {
        if (x >= 0 && y >= 0 && x < W && y < H) world[y][x] = type;
      }
    }

    // === 建州小县城布局 ===
    // 按福建建州/建瓯一带的感觉处理：山水夹城、临溪成街、小城墙、灰瓦白墙、巷道不完全方正。
    setRect(3, 5, 46, 50, "dirt");

    // 城北山林扩展：让土楼能挪到北郊，不再压在城里。
    setRect(2, 0, 47, 9, "dirt");

    // 溪水从东侧折到南侧，形成南方山城临水格局。

    setRect(11, 23, 35, 25, "stone");
    setRect(18, 17, 22, 19, "dirt");
    setRect(27, 18, 34, 20, "dirt");
    setRect(15, 29, 22, 31, "dirt");

    // 城内不再保留亮绿色草格，统一换成暗土地面，避免建筑旁边出现违和绿格。

      for (let xx = 12; xx <= 34; xx++) {
        if (world[yy]?.[xx] === "grass") world[yy][xx] = "dirt";
      }

    // 城外山林与田路。
    setRect(3, 5, 10, 50, "dirt");
    setRect(3, 5, 46, 9, "dirt");
    setRect(3, 39, 14, 50, "dirt");
    setRect(4, 23, 11, 25, "dirt");

    // 彻底去掉可见地图里的亮绿色草格，避免建筑和道路旁出现突兀的绿色方块。

    // 拼装式院落：院墙、院门、主房、厢房独立组合。

      {

        enter: [
          [6,46],[6,45],[6,44],[6,43],[6,42],

        ],
        solid: [

        ],

      {
        name: "李家大院", x: 34, y: 0, w: 12, h: 9, sprite: "courtyard_main",

          [40,8],[40,7],[40,6],[40,5],[40,4],

          [36,6],[37,6],[38,6],[39,6],[40,6],[41,6],[42,6],[43,6],

        ],
        solid: [
          [37,2],[38,2],[40,2],[41,2]
        ],
        parts: [
          { kind: "gate", x: 40, y: 8, w: 1, h: 1 },
          { kind: "main", x: 36, y: 1, w: 7, h: 4, roof: "south" },
        ]
      },
    ];

    // 房子周围不要露出亮绿色草格，统一换成石板/暗土地基。
    houses.forEach(h => {
      const pad = h.sprite === "shop" ? 1 : 2;
      for (let yy = h.y - pad; yy < h.y + h.h + pad; yy++) {
        for (let xx = h.x - pad; xx < h.x + h.w + pad; xx++) {
          if (xx >= 0 && yy >= 0 && xx < W && yy < H && world[yy][xx] !== "water") {
            world[yy][xx] = h.sprite === "shop" ? "dirt" : "stone";
          }
        }
      }
    });

    // 房子按真实部件占地挡路：只挡 main/side/wall 这些实体格，不再向外扩张矩形。
    // 每栋房子都有可进入格；客房和门口、院内都可以进。
    const houseBlockCells = new Set();
    const houseEnterCells = new Set();
    houses.forEach(h => {
      const gate = h.parts.find(p => p.kind === "gate");
      if (gate) {
        for (let yy = gate.y; yy < gate.y + gate.h; yy++) {
          for (let xx = gate.x; xx < gate.x + gate.w; xx++) {
            if (xx >= 0 && yy >= 0 && xx < W && yy < H) houseEnterCells.add(`${xx},${yy}`);
          }
        }
      }
      (h.enter || []).forEach(([ex, ey]) => {
        if (ex >= 0 && ey >= 0 && ex < W && ey < H) houseEnterCells.add(`${ex},${ey}`);
      });
      if (h.solid) {
        h.solid.forEach(([sx, sy]) => {
          const key = `${sx},${sy}`;
          if (sx >= 0 && sy >= 0 && sx < W && sy < H && !houseEnterCells.has(key)) houseBlockCells.add(key);
        });
      } else {
        // 带围墙的院子：内部主屋/厢房区域允许走入（"客房可进"），只让围墙挡路。
        const hasWall = h.parts.some(p => p.kind === "wall");
        h.parts.forEach(p => {
          if (p.kind === "wall") {
            for (let yy = p.y; yy < p.y + p.h; yy++) {
              for (let xx = p.x; xx < p.x + p.w; xx++) {
                if (xx >= 0 && yy >= 0 && xx < W && yy < H) {
                  const key = `${xx},${yy}`;
                  if (!houseEnterCells.has(key)) houseBlockCells.add(key);
                }
              }
            }
            return;
          }
          if (p.kind !== "main" && p.kind !== "side") return;
          // 没有围墙的小屋（药铺/溪边茅屋等）：main 仍然挡，但只挡屋身的 1 格中心，让周围草地可走。
          if (hasWall) return;
          // 房屋正中 1 格作为屋身阻挡，门口由 enter 列表保证可进。
          const cx = Math.floor(p.x + p.w / 2);
          const cy = Math.floor(p.y + p.h / 2);
          if (cx >= 0 && cy >= 0 && cx < W && cy < H) {
            const key = `${cx},${cy}`;
            if (!houseEnterCells.has(key)) houseBlockCells.add(key);
          }
        });
      }
    });
    houseEnterCells.forEach(key => houseBlockCells.delete(key));
    // 土楼体量变大后覆盖了旧院子位置，旧院子的墙体碰撞会变成“看不见的阻挡”。
    // 这里清空土楼占地区域内的旧碰撞，只保留土楼自己声明的实体墙格。
    const tulou = houses.find(h => h.sprite === "courtyard");
    if (tulou && tulou.solid) {
      for (let yy = tulou.y; yy < tulou.y + tulou.h; yy++) {
        for (let xx = tulou.x; xx < tulou.x + tulou.w; xx++) {
          houseBlockCells.delete(`${xx},${yy}`);
        }
      }
      tulou.solid.forEach(([sx, sy]) => {
        const key = `${sx},${sy}`;
        if (!houseEnterCells.has(key)) houseBlockCells.add(key);
      });
    }

    // 这些手绘围墙组件本身带透视角度，直接拉伸会歪斜。
    // 先撤掉大图叠加，保留横平竖直的格子围墙，后续需要重新切成正交小段再接入。
    const wallDecorations = [];

    const rocks = [
      [18,22],[31,22],[17,28],[32,28],[21,37],[28,37],[12,42],[38,42]
    ];
    const trees = [
      [5,8],[6,10],[5,12],[6,14],[5,37],[6,39],[7,41],
      [42,8],[43,10],[44,12],[43,38],[44,40],[42,42],
      [13,11],[36,11],[12,23],[37,23],[12,36],[37,36],
      [21,23],[28,23],[21,29],[28,29]
    ];

    const npcs = [
      { id: "elder", name: "县太爷", x: 27, y: 22, icon: "♟", color: "#ba58db",
        text: "少侠，西门外有贼人劫掠百姓。先替本县击退两个山贼，再来领赏。" },
      { id: "temple", name: "城隍庙", x: 20, y: 25, icon: "♜", color: "#b85bd8",
        text: "庙中石碑写着：行走江湖，以义为先。此处可恢复少量内力。" },
      { id: "merchant", name: "行脚商", x: 33, y: 27, icon: "袋", color: "#d08c3b",
        text: "金疮药三两一瓶。江湖路远，少侠身上多备些药总没坏处。" },
      { id: "cave", name: "西门", x: 7, y: 26, icon: "门", color: "#777",
        text: "西门外的山道上，传来刀兵之声。小心山贼埋伏。" }
    ];

    const enemies = [
      { id: "b1", name: "黑衣山贼", x: 6, y: 26, hp: 36, maxHp: 36, atk: 7, alive: true },
      { id: "b2", name: "持刀山贼", x: 43, y: 27, hp: 42, maxHp: 42, atk: 8, alive: true }
    ];

    const items = [
      { name: "金疮药", x: 24, y: 44, type: "herb", taken: false },
      { name: "散碎银两", x: 17, y: 27, type: "gold", taken: false },
      { name: "金疮药", x: 38, y: 20, type: "herb", taken: false }
    ];

    const logs = ["主线：去西门外剿灭山贼"];

    function tileSize() {
      return TILE * zoom;
    }

    function camera() {
      const ts = tileSize();
      const cx = hero.rx ?? hero.x;
      const cy = hero.ry ?? hero.y;
      return {
        x: cx * ts + ts / 2 - CENTER_X,
        y: cy * ts + ts / 2 - CENTER_Y
      };
    }

    function worldToScreen(x, y) {
      const c = camera();
      const ts = tileSize();
      return { sx: x * ts - c.x, sy: y * ts - c.y };
    }

    function screenToWorld(x, y) {
      const c = camera();
      const ts = tileSize();
      return {
        x: Math.floor((x + c.x) / ts),
        y: Math.floor((y + c.y) / ts)
      };
    }

    function blocked(x, y) {
      if (x < 0 || y < 0 || x >= W || y >= H) return true;
      const t = world[y][x];
      if (t === "water") return true;
      if (houseBlockCells.has(`${x},${y}`)) return true;
      return npcs.some(n => n.x === x && n.y === y) || enemies.some(e => e.alive && e.x === x && e.y === y);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawTopBar();
      drawMap();
      drawLocationPanel();
      drawBottomBar();
      drawBattlePanel();
    }

    function drawTopBar() {
      const g = ctx.createLinearGradient(0, 0, 0, 86);
      g.addColorStop(0, "#050606");
      g.addColorStop(.55, "#151a1a");
      g.addColorStop(1, "#273030");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 470, 86);
      ctx.fillStyle = "rgba(0,0,0,.45)";
      ctx.fillRect(0, 0, 470, 13);
      ctx.fillStyle = "rgba(255,255,255,.06)";
      ctx.fillRect(0, 4, 470, 7);
      ctx.fillStyle = "rgba(0,0,0,.42)";
      ctx.fillRect(0, 72, 470, 14);
      ctx.strokeStyle = "#3b4544";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, 83); ctx.lineTo(470, 83); ctx.stroke();

      ctx.shadowColor = "#000";
      ctx.shadowBlur = 3;
      ctx.fillStyle = "#f5f5f5";
      ctx.font = "bold 16px Microsoft YaHei";
      ctx.fillText("沧州", 22, 32);
      ctx.fillText("(17,6)", 18, 56);
      ctx.shadowBlur = 0;

      drawCoin(83, 30, "#b8c4d0", "◉");
      text(hero.ingot, 116, 34, "#eee", "bold 17px Microsoft YaHei");
      drawCoin(85, 56, "#e2a72d", "◔");
      text(hero.gold, 116, 61, "#ffe85b", "bold 17px Microsoft YaHei");

      roundIcon(184, 43, 18, "#b32322", "+", "#fff");
      verticalText("索利", 236, 21);
      drawScroll(220, 38);
      text("可领取", 218, 72, "#17ff32", "bold 12px Microsoft YaHei");
      roundIcon(281, 43, 15, "#ddd", "勾", "#222");
      verticalText("会员", 315, 21);
      drawChest(329, 35);
      verticalText("背包", 371, 21);
      drawBag(391, 43);
      verticalText("菜单", 450, 21);
      drawMenu(432, 45);
    }

    function drawMap() {
      ctx.save();
      ctx.beginPath();
      ctx.rect(4, MAP_TOP, MAP_W - 8, MAP_H);
      ctx.clip();
      ctx.fillStyle = "#1e4214";
      ctx.fillRect(0, MAP_TOP, 470, MAP_H);

      const c = camera();
      const ts = tileSize();
      const startX = Math.floor(c.x / ts) - 2;
      const startY = Math.floor((c.y + MAP_TOP) / ts) - 2;
      const endX = startX + Math.ceil(MAP_W / ts) + 4;
      const endY = startY + Math.ceil(MAP_H / ts) + 5;

      for (let y = startY; y <= endY; y++) for (let x = startX; x <= endX; x++) {
        const { sx, sy } = worldToScreen(x, y);
        drawGround(sx, sy, world[y]?.[x] || "void", x, y);
      }

      for (let gx = Math.floor(c.x / ts) - 3; gx < Math.floor(c.x / ts) + Math.ceil(MAP_W / ts) + 4; gx++) {
        const sx = gx * ts - c.x;
        ctx.strokeStyle = "rgba(55,55,55,.34)";
        ctx.beginPath(); ctx.moveTo(sx, MAP_TOP); ctx.lineTo(sx, MAP_TOP + MAP_H); ctx.stroke();
      }
      for (let gy = Math.floor((c.y + MAP_TOP) / ts) - 2; gy < Math.floor((c.y + MAP_TOP) / ts) + Math.ceil(MAP_H / ts) + 5; gy++) {
        const sy = gy * ts - c.y;
        ctx.strokeStyle = "rgba(55,55,55,.34)";
        ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(470, sy); ctx.stroke();
      }

      rocks.forEach(([x, y]) => drawRock(x, y));
      trees.forEach(([x, y]) => drawTree(x, y));
      wallDecorations.forEach(drawWallDecoration);
      houses.forEach(drawHouse);
      items.forEach(drawItem);
      npcs.forEach(drawNpc);
      enemies.forEach(drawEnemy);
      drawArrow();
      drawHero();
      drawFog();

      ctx.restore();
      ctx.strokeStyle = "#0b0b0b";
      ctx.lineWidth = 8;
      ctx.strokeRect(5, MAP_TOP + 2, 460, MAP_H - 4);
      ctx.strokeStyle = "#161616";
      ctx.lineWidth = 3;
      ctx.strokeRect(9, MAP_TOP + 7, 452, MAP_H - 14);
      ctx.strokeStyle = "#2c2c2c";
      ctx.lineWidth = 1;
      ctx.strokeRect(9, MAP_TOP + 8, 452, MAP_H - 16);

      text("主线：", 20, MAP_TOP + MAP_H - 23, "#ffff2e", "bold 17px Microsoft YaHei");
      text("去西门外剿灭山贼", 68, MAP_TOP + MAP_H - 23, "#fff", "bold 17px Microsoft YaHei");
      text(`缩放 ${Math.round(zoom * 100)}%`, 380, MAP_TOP + 24, "#d7d7d7", "12px Microsoft YaHei");
    }

    function drawGround(sx, sy, t, gx = 0, gy = 0) {
      const ts = tileSize();
      if (t === "water") {
        const g = ctx.createLinearGradient(sx, sy, sx + ts, sy + ts);
        g.addColorStop(0, "#1d4a4b");
        g.addColorStop(.55, "#17383e");
        g.addColorStop(1, "#0d2328");
        ctx.fillStyle = g;
        ctx.fillRect(sx, sy, ts, ts);
        ctx.strokeStyle = "rgba(151,205,190,.25)";
        ctx.lineWidth = Math.max(1, ts * .035);
        ctx.beginPath();
        ctx.moveTo(sx + ts * .12, sy + ts * .45);
        ctx.quadraticCurveTo(sx + ts * .42, sy + ts * .28, sx + ts * .74, sy + ts * .45);
        ctx.quadraticCurveTo(sx + ts * .9, sy + ts * .56, sx + ts * 1.05, sy + ts * .44);
        ctx.stroke();
        ctx.strokeStyle = "rgba(0,0,0,.22)";
        ctx.strokeRect(sx, sy, ts, ts);
        return;
      }
      if (t === "void") {
        if (terrainReady && terrainImgs.grass) {
          drawTerrainImage(terrainImgs.grass, sx, sy, ts, "grass", gx, gy);
        } else {
          ctx.fillStyle = "#244915";
          ctx.fillRect(sx, sy, ts, ts);
        }
        return;
      }
      if (terrainReady && terrainImgs.grass && t !== "tree") {
        drawTerrainImage(terrainImgs.grass, sx, sy, ts, "grass", gx, gy);
        return;
      }
      const colors = {
        grass: ["#4a3524", "#7a5737"],
        stone: ["#3a403d", "#76817a"],
        dirt: ["#5c3821", "#a27445"],
        wall: ["#686f6c", "#a3aca6"],
        gate: ["#4a504d", "#8a908b"]
      };
      const pair = colors[t] || colors.grass;
      const g = ctx.createLinearGradient(sx, sy, sx + ts, sy + ts);
      g.addColorStop(0, pair[0]);
      g.addColorStop(1, pair[1]);
      ctx.fillStyle = g;
      ctx.fillRect(sx, sy, ts, ts);
      const n = noise(Math.floor((sx + 9999) / Math.max(1, ts)), Math.floor((sy + 7777) / Math.max(1, ts)));
      ctx.fillStyle = t === "grass" ? `rgba(90,150,50,${.08 + n * .08})` : `rgba(255,255,255,${.03 + n * .04})`;
      for (let i = 0; i < 5; i++) {
        const px = sx + ((n * 97 + i * 13) % 28) / 32 * ts;
        const py = sy + ((n * 61 + i * 17) % 28) / 32 * ts;
        ctx.fillRect(px, py, Math.max(1, ts * .045), Math.max(1, ts * .045));
      }
      if (t === "stone" || t === "dirt") {
        ctx.strokeStyle = t === "stone" ? "rgba(18,22,20,.35)" : "rgba(40,22,12,.32)";
        ctx.lineWidth = Math.max(1, ts * .025);
        ctx.beginPath();
        ctx.moveTo(sx + ts * .18, sy + ts * .25);
        ctx.quadraticCurveTo(sx + ts * .5, sy + ts * .08, sx + ts * .78, sy + ts * .22);
        ctx.moveTo(sx + ts * .2, sy + ts * .72);
        ctx.quadraticCurveTo(sx + ts * .48, sy + ts * .56, sx + ts * .82, sy + ts * .75);
        ctx.stroke();
        if (t === "stone") {
          ctx.fillStyle = "rgba(185,197,190,.35)";
          ctx.beginPath();
          ctx.ellipse(sx + ts * .34, sy + ts * .34, ts * .12, ts * .07, -.4, 0, Math.PI * 2);
          ctx.ellipse(sx + ts * .66, sy + ts * .59, ts * .14, ts * .08, .2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      if (t === "wall") {
        const verticalWall = (world[gy - 1]?.[gx] === "wall" || world[gy + 1]?.[gx] === "wall") &&
          !(world[gy]?.[gx - 1] === "wall" || world[gy]?.[gx + 1] === "wall");
        if (verticalWall) drawVerticalStoneWall(sx + ts * .12, sy, ts * .76, ts);
        else drawHorizontalStoneWall(sx, sy + ts * .08, ts, ts * .84);
      }
    }

    function drawHouse(h) {
      const ts = tileSize();
      const bounds = { x1: h.x, y1: h.y, x2: h.x + h.w, y2: h.y + h.h };
      const topLeft = worldToScreen(bounds.x1, bounds.y1);
      const bottomRight = worldToScreen(bounds.x2, bounds.y2);
      if (bottomRight.sx < 0 || topLeft.sx > MAP_W || bottomRight.sy < MAP_TOP || topLeft.sy > MAP_TOP + MAP_H) return;

      const spriteBounds = h.sprite && drawIntegratedHouseSprite(h, topLeft, bottomRight, ts);
      if (spriteBounds) {
        return;
      }

      // 院内压一层暗绿/土色，让房子像拼在地面上而不是贴图盖上去。
      ctx.fillStyle = "rgba(78,74,42,.18)";
      ctx.fillRect(topLeft.sx, topLeft.sy, h.w * ts, h.h * ts);
      drawCourtyardPaving(topLeft.sx, topLeft.sy, h.w * ts, h.h * ts, ts);

      // 先画院墙、栅栏，再画房屋主体，最后画门。
      h.parts.filter(p => p.kind === "wall" || p.kind === "fence").forEach(drawHousePart);
      h.parts.filter(p => p.kind === "main" || p.kind === "side").forEach(drawHousePart);
      h.parts.filter(p => p.kind === "gate").forEach(drawHousePart);
    }

    function drawIntegratedHouseSprite(h, topLeft, bottomRight, ts) {
      const img = houseSpriteImgs[h.sprite];
      if (!houseSpritesReady || !img || !img.complete || !img.naturalWidth) return false;
      const cfg = {
        courtyard: { maxTiles: 7.05, lift: -.10, shadow: .58, anchor: "gate" },
        inn: { maxTiles: 3.15, lift: .03, shadow: .40, anchor: "center" },
        village: { maxTiles: 2.85, lift: .03, shadow: .38, anchor: "center" },
        shop: { maxTiles: 2.55, lift: .02, shadow: .34, anchor: "center" },
        yamen: { maxTiles: 7.15, lift: -.08, shadow: .54, anchor: "gate" },
        yamen_a: { maxTiles: 6.75, lift: -.08, shadow: .52, anchor: "gate" },
        yamen_c: { maxTiles: 6.65, lift: -.08, shadow: .52, anchor: "gate" },
        yamen_main: { maxTiles: 6.05, lift: -.08, shadow: .52, anchor: "gate" },
        courtyard_main: { maxTiles: 6.55, lift: -.08, shadow: .50, anchor: "gate" }
      }[h.sprite] || { maxTiles: 2.6, lift: .03, shadow: .36, anchor: "center" };

      // 单体房子按占地中心绘制，保留斜俯视体积感。
      const mainPart = h.parts.find(p => p.kind === "main") || h.parts.find(p => p.kind === "gate") || h;
      const gatePart = h.parts.find(p => p.kind === "gate");
      const center = worldToScreen(mainPart.x + mainPart.w / 2, mainPart.y + mainPart.h / 2);
      const maxSide = ts * cfg.maxTiles;
      let drawW, drawH;
      if (img.naturalWidth >= img.naturalHeight) {
        drawW = maxSide;
        drawH = drawW * img.naturalHeight / img.naturalWidth;
      } else {
        drawH = maxSide;
        drawW = drawH * img.naturalWidth / img.naturalHeight;
      }
      const dx = Math.round(center.sx - drawW / 2);
      let dy = Math.round(center.sy - drawH / 2 - drawH * cfg.lift);
      if (cfg.anchor === "gate" && gatePart) {
        const gateFoot = worldToScreen(gatePart.x + gatePart.w / 2, gatePart.y + gatePart.h + .15);
        dy = Math.round(gateFoot.sy - drawH * .92);
      }

      ctx.save();
      // 不再画底部阴影或底边压暗，让房子干净地立在地面上。
      const oldSmooth = ctx.imageSmoothingEnabled;
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(img, dx, dy, Math.round(drawW), Math.round(drawH));
      ctx.imageSmoothingEnabled = oldSmooth;
      ctx.restore();
      return { x: dx, y: dy, w: drawW, h: drawH };
    }

    function drawCourtyardPaving(x, y, w, h, ts) {
      const pad = ts * .7;
      const px = x + pad, py = y + pad;
      const pw = Math.max(0, w - pad * 2), ph = Math.max(0, h - pad * 2);
      if (pw < ts || ph < ts) return;
      ctx.fillStyle = "rgba(91,82,55,.18)";
      ctx.fillRect(px, py, pw, ph);
      const cell = Math.max(6, ts * .42);
      ctx.strokeStyle = "rgba(32,30,24,.20)";
      ctx.lineWidth = Math.max(1, .55 * zoom);
      for (let gx = px; gx < px + pw; gx += cell) {
        ctx.beginPath(); ctx.moveTo(gx, py); ctx.lineTo(gx, py + ph); ctx.stroke();
      }
      for (let gy = py; gy < py + ph; gy += cell) {
        ctx.beginPath(); ctx.moveTo(px, gy); ctx.lineTo(px + pw, gy); ctx.stroke();
      }
      ctx.fillStyle = "rgba(180,170,125,.12)";
      ctx.fillRect(px + pw * .18, py + ph * .18, pw * .2, Math.max(1, ph * .035));
      ctx.fillStyle = "rgba(0,0,0,.16)";
      ctx.fillRect(px, py + ph - ts * .18, pw, ts * .18);
    }

    function drawWallDecoration(wd) {
      if (!wallPiecesReady) return;
      const img = wallPieceImgs[wd.key];
      if (!img || !img.complete || !img.naturalWidth) return;
      const ts = tileSize();
      const { sx, sy } = worldToScreen(wd.x, wd.y);
      const dw = wd.w * ts, dh = wd.h * ts;
      if (sx + dw < -80 || sx > MAP_W + 80 || sy + dh < MAP_TOP - 80 || sy > MAP_TOP + MAP_H + 80) return;
      ctx.drawImage(img, sx, sy, dw, dh);
    }

    function drawHousePart(p) {
      const ts = tileSize();
      const { sx, sy } = worldToScreen(p.x, p.y);
      const w = p.w * ts, h = p.h * ts;
      if (p.kind === "wall") return drawLowWall(sx, sy, w, h);
      if (p.kind === "fence") return drawFence(sx, sy, w, h);
      if (p.kind === "gate") return drawYardGate(sx, sy, w, h);
      drawRoomBlock(sx, sy, w, h, p.roof || "gray", p.kind);
    }

    function drawLowWall(x, y, w, h) {
      const vertical = h > w * 1.25;
      if (vertical) return drawVerticalStoneWall(x, y, w, h);
      drawHorizontalStoneWall(x, y, w, h);
    }

    function drawHorizontalStoneWall(x, y, w, h) {
      // 正交横墙：灰白墙身 + 黑灰瓦帽 + 石台基，严格横平竖直。
      const capH = h * .34;
      const bodyY = y + h * .25;
      const bodyH = h * .62;
      ctx.fillStyle = "rgba(0,0,0,.30)";
      ctx.fillRect(x + w * .04, y + h * .18, w, h * .78);

      // 墙身
      const wallGrad = ctx.createLinearGradient(x, bodyY, x, bodyY + bodyH);
      wallGrad.addColorStop(0, "#b6b8ad");
      wallGrad.addColorStop(.55, "#858a82");
      wallGrad.addColorStop(1, "#535b55");
      ctx.fillStyle = wallGrad;
      ctx.fillRect(x, bodyY, w, bodyH);

      // 石台基
      ctx.fillStyle = "#5d665f";
      ctx.fillRect(x, y + h * .70, w, h * .18);
      const baseBlocks = Math.max(2, Math.floor(w / (10 * zoom)));
      for (let i = 0; i < baseBlocks; i++) {
        const bx = x + i * w / baseBlocks;
        const bw = w / baseBlocks;
        ctx.strokeStyle = "rgba(22,24,22,.7)";
        ctx.lineWidth = Math.max(1, .65 * zoom);
        ctx.strokeRect(bx, y + h * .70, bw, h * .18);
        ctx.fillStyle = "rgba(225,230,210,.18)";
        ctx.fillRect(bx + bw * .12, y + h * .73, bw * .46, h * .035);
      }

      // 黑瓦墙帽
      const roofGrad = ctx.createLinearGradient(x, y, x, y + capH);
      roofGrad.addColorStop(0, "#888b82");
      roofGrad.addColorStop(.35, "#454b46");
      roofGrad.addColorStop(1, "#181c19");
      ctx.fillStyle = roofGrad;
      ctx.beginPath();
      ctx.moveTo(x - w * .03, y + h * .26);
      ctx.lineTo(x + w * .06, y + h * .04);
      ctx.lineTo(x + w * .94, y + h * .04);
      ctx.lineTo(x + w * 1.03, y + h * .26);
      ctx.lineTo(x + w * .98, y + h * .38);
      ctx.lineTo(x + w * .02, y + h * .38);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#101310";
      ctx.lineWidth = Math.max(1, 1.1 * zoom);
      ctx.stroke();

      // 瓦片节奏
      ctx.strokeStyle = "rgba(188,194,180,.45)";
      ctx.lineWidth = Math.max(1, .55 * zoom);
      const tiles = Math.max(4, Math.floor(w / (6 * zoom)));
      for (let i = 1; i < tiles; i++) {
        const px = x + i * w / tiles;
        ctx.beginPath();
        ctx.moveTo(px, y + h * .08);
        ctx.lineTo(px - w * .025, y + h * .36);
        ctx.stroke();
      }

      // 做旧细节
      ctx.strokeStyle = "rgba(37,38,33,.42)";
      ctx.lineWidth = Math.max(1, .55 * zoom);
      ctx.beginPath();
      ctx.moveTo(x + w * .18, y + h * .45);
      ctx.quadraticCurveTo(x + w * .25, y + h * .55, x + w * .22, y + h * .68);
      ctx.moveTo(x + w * .72, y + h * .43);
      ctx.quadraticCurveTo(x + w * .66, y + h * .55, x + w * .78, y + h * .66);
      ctx.stroke();
      ctx.fillStyle = "rgba(54,86,38,.28)";
      ctx.fillRect(x + w * .12, y + h * .80, w * .18, h * .045);
      ctx.fillRect(x + w * .66, y + h * .78, w * .22, h * .045);

      ctx.strokeStyle = "#111411";
      ctx.lineWidth = Math.max(1, zoom);
      ctx.strokeRect(x, bodyY, w, bodyH);
    }

    function drawVerticalStoneWall(x, y, w, h) {
      // 正交竖墙：不旋转透视图，直接按竖向格子画，保证不歪。
      ctx.fillStyle = "rgba(0,0,0,.28)";
      ctx.fillRect(x + w * .18, y + h * .02, w * .78, h);

      const wallGrad = ctx.createLinearGradient(x, y, x + w, y);
      wallGrad.addColorStop(0, "#aeb2a8");
      wallGrad.addColorStop(.55, "#747b73");
      wallGrad.addColorStop(1, "#424a44");
      ctx.fillStyle = wallGrad;
      ctx.fillRect(x + w * .18, y, w * .62, h);

      // 侧向黑瓦帽
      const roofGrad = ctx.createLinearGradient(x, y, x + w, y);
      roofGrad.addColorStop(0, "#81857c");
      roofGrad.addColorStop(.45, "#3f4640");
      roofGrad.addColorStop(1, "#171b18");
      ctx.fillStyle = roofGrad;
      ctx.fillRect(x + w * .04, y, w * .28, h);
      ctx.strokeStyle = "#101310";
      ctx.lineWidth = Math.max(1, 1.1 * zoom);
      ctx.strokeRect(x + w * .04, y, w * .28, h);

      const blocks = Math.max(3, Math.floor(h / (11 * zoom)));
      for (let i = 0; i < blocks; i++) {
        const by = y + i * h / blocks;
        const bh = h / blocks;
        ctx.strokeStyle = "rgba(18,21,18,.65)";
        ctx.lineWidth = Math.max(1, .65 * zoom);
        ctx.strokeRect(x + w * .18, by, w * .62, bh);
        ctx.fillStyle = "rgba(220,230,210,.16)";
        ctx.fillRect(x + w * .28, by + bh * .16, w * .28, bh * .08);
      }

      ctx.fillStyle = "rgba(56,86,38,.24)";
      ctx.fillRect(x + w * .60, y + h * .12, w * .08, h * .16);
      ctx.fillRect(x + w * .58, y + h * .68, w * .08, h * .18);

      ctx.lineWidth = Math.max(1, zoom);
      ctx.strokeRect(x + w * .18, y, w * .62, h);

    function drawWallPieceFit(key, x, y, w, h, exact = false) {
      const img = wallPieceImgs[key];
      if (!wallPiecesReady || !img || !img.complete || !img.naturalWidth) return false;
      ctx.save();
      if (!exact && h > w * 1.45) {
        ctx.translate(x + w / 2, y + h / 2);
        ctx.rotate(Math.PI / 2);
        ctx.drawImage(img, -h * .62, -w * 1.25, h * 1.24, w * 2.5);
      } else {
        const padX = exact ? 0 : w * .12;
        const lift = exact ? 0 : h * 1.55;
        const drawH = exact ? h : h * 2.95;
        ctx.drawImage(img, x - padX, y - lift, w + padX * 2, drawH);
      }
      ctx.restore();
      return true;
    }

    function drawRoomBlock(x, y, w, h, roof, kind) {
      // 按参考图调整：蓝灰瓦大屋顶、红褐木梁、浅墙体、侧面阴影，整体更立体。
      const isMain = kind === "main";
      if (isMain) {
        x -= w * .08;
        y -= h * .54;
        w *= 1.16;
        h *= 1.72;
      } else {
        x -= w * .05;
        y -= h * .30;
        w *= 1.10;
        h *= 1.38;
      }

      // 地面投影，先压出体积。
      const shadow = ctx.createRadialGradient(x + w * .55, y + h * .86, 2, x + w * .55, y + h * .86, w * .62);
      shadow.addColorStop(0, "rgba(0,0,0,.38)");
      shadow.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = shadow;
      ctx.fillRect(x - w * .16, y + h * .42, w * 1.28, h * .62);

      // 石台基
      ctx.fillStyle = "#6b6f63";
      ctx.fillRect(x + w * .12, y + h * .79, w * .78, h * .08);
      ctx.strokeStyle = "#252a24";
      ctx.lineWidth = Math.max(1, .7 * zoom);
      ctx.strokeRect(x + w * .12, y + h * .79, w * .78, h * .08);
      for (let i = 1; i < 5; i++) {
        const px = x + w * (.12 + i * .15);
        ctx.beginPath();
        ctx.moveTo(px, y + h * .80);
        ctx.lineTo(px, y + h * .86);
        ctx.stroke();
      }

      // 墙身和木构，参考图里房子红褐柱子明显。
      const wallTop = y + h * .43;
      const wallH = h * .39;
      const wallGrad = ctx.createLinearGradient(x, wallTop, x, wallTop + wallH);
      wallGrad.addColorStop(0, "#d6c49a");
      wallGrad.addColorStop(.55, "#b88b5a");
      wallGrad.addColorStop(1, "#704323");
      ctx.fillStyle = wallGrad;
      ctx.fillRect(x + w * .16, wallTop, w * .70, wallH);
      ctx.strokeStyle = "#24140c";
      ctx.lineWidth = Math.max(1, zoom);
      ctx.strokeRect(x + w * .16, wallTop, w * .70, wallH);

      ctx.fillStyle = "#7b3420";
      [0.19, 0.36, 0.64, 0.82].forEach(px => {
        ctx.fillRect(x + w * px, wallTop + h * .02, Math.max(2, w * .035), wallH * .92);
      });
      ctx.fillStyle = "#4e2116";
      ctx.fillRect(x + w * .16, wallTop, w * .70, Math.max(2, h * .035));
      ctx.fillRect(x + w * .16, wallTop + wallH * .84, w * .70, Math.max(2, h * .03));
      ctx.fillStyle = "rgba(110,45,26,.65)";
      ctx.fillRect(x + w * .18, wallTop + wallH * .18, w * .64, Math.max(2, h * .028));
      ctx.fillRect(x + w * .18, wallTop + wallH * .48, w * .64, Math.max(2, h * .022));

      // 门窗细节
      ctx.fillStyle = "#26130d";
      ctx.fillRect(x + w * .44, y + h * .61, w * .15, h * .20);
      ctx.fillStyle = "#1c100b";
      ctx.fillRect(x + w * .23, y + h * .57, w * .13, h * .10);
      ctx.fillRect(x + w * .67, y + h * .57, w * .13, h * .10);
      ctx.strokeStyle = "rgba(232,185,105,.32)";
      ctx.strokeRect(x + w * .23, y + h * .57, w * .13, h * .10);
      ctx.strokeRect(x + w * .67, y + h * .57, w * .13, h * .10);
      ctx.strokeStyle = "rgba(182,118,65,.42)";
      ctx.beginPath();
      ctx.moveTo(x + w * .265, y + h * .57); ctx.lineTo(x + w * .265, y + h * .67);
      ctx.moveTo(x + w * .705, y + h * .57); ctx.lineTo(x + w * .705, y + h * .67);
      ctx.stroke();

      // 前屋檐暗面，增强上下层次。
      ctx.fillStyle = "rgba(24,24,22,.52)";
      ctx.beginPath();
      ctx.moveTo(x + w * .05, y + h * .52);
      ctx.lineTo(x + w * .95, y + h * .52);
      ctx.lineTo(x + w * .86, y + h * .66);
      ctx.lineTo(x + w * .14, y + h * .66);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#7f3822";
      ctx.fillRect(x + w * .13, y + h * .64, w * .74, Math.max(2, h * .035));

      // 主屋顶：蓝灰瓦、两坡面、厚屋檐。
      const roofA = roof === "thatch" ? "#73572a" : roof === "wood" ? "#5b3a25" : "#2d4152";
      const roofB = roof === "thatch" ? "#a6813a" : roof === "wood" ? "#805833" : "#4f6b80";
      const roofC = roof === "thatch" ? "#3f2d16" : roof === "wood" ? "#2b1b11" : "#182734";
      const rg = ctx.createLinearGradient(x, y + h * .06, x, y + h * .64);
      rg.addColorStop(0, "#8ea1a8");
      rg.addColorStop(.22, roofB);
      rg.addColorStop(.66, roofA);
      rg.addColorStop(1, roofC);
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.moveTo(x - w * .02, y + h * .45);
      ctx.quadraticCurveTo(x + w * .17, y + h * .28, x + w * .50, y + h * .06);
      ctx.quadraticCurveTo(x + w * .83, y + h * .28, x + w * 1.02, y + h * .45);
      ctx.lineTo(x + w * .86, y + h * .63);
      ctx.lineTo(x + w * .14, y + h * .63);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#101519";
      ctx.lineWidth = Math.max(1.3, 1.5 * zoom);
      ctx.stroke();

      // 左右飞檐小卷角
      ctx.strokeStyle = "#0f1418";
      ctx.lineWidth = Math.max(1.2, 1.4 * zoom);
      ctx.beginPath();
      ctx.moveTo(x - w * .02, y + h * .45);
      ctx.quadraticCurveTo(x - w * .09, y + h * .42, x + w * .02, y + h * .35);
      ctx.moveTo(x + w * 1.02, y + h * .45);
      ctx.quadraticCurveTo(x + w * 1.09, y + h * .42, x + w * .98, y + h * .35);
      ctx.stroke();

      // 屋脊和高光线。
      ctx.strokeStyle = "#b8b7a0";
      ctx.lineWidth = Math.max(1, 1.25 * zoom);
      ctx.beginPath();
      ctx.moveTo(x + w * .18, y + h * .34);
      ctx.quadraticCurveTo(x + w * .50, y + h * .11, x + w * .82, y + h * .34);
      ctx.stroke();
      ctx.fillStyle = "rgba(226,226,190,.16)";
      ctx.fillRect(x + w * .21, y + h * .36, w * .18, Math.max(1, h * .025));
      ctx.fillStyle = "rgba(0,0,0,.26)";
      ctx.fillRect(x + w * .10, y + h * .62, w * .80, Math.max(2, h * .035));

      // 瓦片：一排排弧形瓦，参考图里屋顶的关键美感。
      const cols = Math.max(9, Math.floor(w / (2.7 * zoom)));
      ctx.strokeStyle = "rgba(9,17,24,.62)";
      ctx.lineWidth = Math.max(1, .62 * zoom);
      for (let i = 1; i < cols; i++) {
        const t = i / cols;
        const px = x + w * (.08 + t * .84);
        ctx.beginPath();
        ctx.moveTo(px, y + h * .24);
        ctx.quadraticCurveTo(px - w * .035, y + h * .43, px - w * .055, y + h * .61);
        ctx.stroke();
      }
      ctx.strokeStyle = "rgba(150,174,178,.42)";
      ctx.lineWidth = Math.max(1, .52 * zoom);
      for (let j = 0; j < 6; j++) {
        const py = y + h * (.30 + j * .052);
        ctx.beginPath();
        ctx.moveTo(x + w * .14, py);
        ctx.quadraticCurveTo(x + w * .50, py + h * .025, x + w * .86, py);
        ctx.stroke();
      }

      // 下层檐口瓦片小颗粒
      ctx.fillStyle = "#16222c";
      const mini = Math.max(5, Math.floor(w / (6 * zoom)));
      for (let i = 0; i < mini; i++) {
        const px = x + w * (.17 + i * .66 / mini);
        ctx.beginPath();
        ctx.ellipse(px, y + h * .62, w * .028, h * .025, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

        ctx.fillStyle = c;

    function drawArrow() {
      const target = enemies.find(e => e.alive) || npcs[0];
      if (!target) return;
      const dx = target.x - hero.x;
      const dy = target.y - hero.y;
      if (Math.abs(dx) + Math.abs(dy) < 3) return;
      const ang = Math.atan2(dy, dx);
      const x = CENTER_X + Math.cos(ang) * 54;
      const y = CENTER_Y + Math.sin(ang) * 54;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ang);
      ctx.fillStyle = "#ff6a00";
      ctx.beginPath();
      ctx.moveTo(18, 0); ctx.lineTo(-14, -12); ctx.lineTo(-7, 0); ctx.lineTo(-14, 12);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    function move(dx, dy) {
      if (battle || isMoving) return;
      hero.face = dx > 0 ? "right" : dx < 0 ? "left" : dy < 0 ? "up" : "down";
      const nx = hero.x + dx, ny = hero.y + dy;
      const enemy = enemies.find(e => e.alive && e.x === nx && e.y === ny);
      if (enemy) return startBattle(enemy);
      if (!blocked(nx, ny)) {
        animateStep(nx, ny);
      }
    }

    function animateStep(nx, ny) {
      const fromX = hero.x;
      const fromY = hero.y;
      hero.x = nx;
      hero.y = ny;
      isMoving = true;
      const start = performance.now();
      const duration = 165;
      function frame(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        hero.rx = fromX + (nx - fromX) * eased;
        hero.ry = fromY + (ny - fromY) * eased;
        draw();
        if (t < 1) requestAnimationFrame(frame);
        else {
          hero.rx = hero.x;
          hero.ry = hero.y;
          isMoving = false;
          pickup();
          draw();
        }
      }
      requestAnimationFrame(frame);
    }

    function stepToward(tx, ty) {
      if (battle) return;
      const dx = tx - hero.x;
      const dy = ty - hero.y;
      if (dx === 0 && dy === 0) return interact();
      let sx = 0, sy = 0;
      if (Math.abs(dx) >= Math.abs(dy)) sx = Math.sign(dx);
      else sy = Math.sign(dy);
      move(sx, sy);
    }

    function interact() {
      if (toast.style.display === "block" && Date.now() < messageUntil) {
        toast.style.display = "none";
        return;
      }
      const near = npcs.find(n => Math.abs(n.x - hero.x) + Math.abs(n.y - hero.y) <= 1);
      if (!near) return show("附近没有可互动对象。靠近人物、地点或山贼再点互动。");
      if (near.id === "elder") {
        quest.accepted = true;
        if (quest.bandits >= 2 && !quest.done) {
          quest.done = true;
          hero.sword = true;
          hero.gold += 30;
          hero.rep += 20;
          show("县太爷：少侠果然好身手。这三十两银子给你，另赠你一式「清风剑法」。");
        } else if (quest.done) {
          show("县太爷：青石一带暂得安宁，少侠可继续向北闯荡。");
        } else {
          show("县太爷：" + near.text);
        }
      } else if (near.id === "temple") {
        hero.mp = Math.min(hero.maxMp, hero.mp + 12);
        show("你在城隍庙前调息片刻，内力恢复了一些。");
      } else if (near.id === "merchant") {
        if (hero.gold >= 3) {
          hero.gold -= 3; hero.herbs++;
          show("行脚商：收你三两，金疮药一瓶。");
        } else show("行脚商：少侠银两不足，买不了药。");
      } else show(near.name + "：" + near.text);
      draw();
    }

    function pickup() {
      const it = items.find(i => !i.taken && i.x === hero.x && i.y === hero.y);
      if (!it) return;
      it.taken = true;
      if (it.type === "herb") {
        hero.herbs++;
        show("你拾起一瓶金疮药。");
      } else {
        hero.gold += 8;
        show("你拾起八两散碎银两。");
      }
    }

    function startBattle(enemy) {
      battle = enemy;
      if (!quest.accepted) quest.accepted = true;
      show(`遭遇${enemy.name}！点右侧按钮普攻，双击按钮放剑招。`);
      draw();
    }

    function attack(skill) {
      if (!battle) return;
      let dmg = 9 + Math.floor(Math.random() * 7);
      if (skill) {
        if (hero.mp < 6) return show("内力不足，无法施展剑招。");
        hero.mp -= 6;
        dmg += hero.sword ? 13 : 6;
      }
      battle.hp -= dmg;
      if (battle.hp <= 0) {
        battle.alive = false;
        quest.bandits++;
        hero.gold += 9;
        hero.rep += 5;
        show(`${battle.name}败退。获得九两银子。进度：${quest.bandits}/2`);
        battle = null;
        draw();
        return;
      }
      const edmg = battle.atk + Math.floor(Math.random() * 4);
      hero.hp -= edmg;
      if (hero.hp <= 0) {
        hero.hp = 1;
        hero.x = 24; hero.y = 26; hero.rx = 24; hero.ry = 26;
        battle = null;
        show("你伤势过重，被路人救回县衙门口。");
      } else show(`${skill ? "剑招命中" : "挥剑进击"}，造成 ${dmg} 点伤害。${battle.name}反击，你受 ${edmg} 点伤害。`, 1800);
      draw();
    }

    function heal() {
      if (hero.herbs <= 0) return show("没有金疮药。");
      hero.herbs--;
      hero.hp = Math.min(hero.maxHp, hero.hp + 35);
      show("服用金疮药，恢复三十五点气血。");
      draw();
    }

    function show(msg, ms = 2600) {
      toast.textContent = msg;
      toast.style.display = "block";
      messageUntil = Date.now() + ms;
      setTimeout(() => {
        if (Date.now() >= messageUntil) toast.style.display = "none";
      }, ms + 50);
    }

    function text(str, x, y, color, font) {
      ctx.fillStyle = color;
      ctx.font = font;
      ctx.fillText(String(str), x, y);
    }
    function verticalText(str, x, y) {
      ctx.fillStyle = "#fff";
      ctx.font = "bold 13px Microsoft YaHei";
      for (let i = 0; i < str.length; i++) ctx.fillText(str[i], x, y + i * 14);
    }
    function roundIcon(x, y, r, bg, label, color) {
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#111"; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = color;
      ctx.font = "bold 17px Microsoft YaHei";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, x, y);
      ctx.textAlign = "start";
      ctx.textBaseline = "alphabetic";
    }
    function drawCoin(x, y, color, label) {
      roundIcon(x, y, 10, color, label, "#222");
    }
    function drawScroll(x, y) {
      ctx.fillStyle = "#d7b16b";
      ctx.fillRect(x - 13, y - 17, 26, 34);
      ctx.strokeStyle = "#5e371b"; ctx.strokeRect(x - 13, y - 17, 26, 34);
      ctx.fillStyle = "#6b3e1c";
      ctx.fillRect(x - 9, y - 7, 18, 3);
      ctx.fillRect(x - 9, y + 2, 18, 3);
    }
    function drawChest(x, y) {
      ctx.fillStyle = "#8d4e21"; ctx.fillRect(x - 15, y - 8, 30, 22);
      ctx.fillStyle = "#d28a33"; ctx.fillRect(x - 15, y - 18, 30, 12);
      ctx.strokeStyle = "#25130b"; ctx.strokeRect(x - 15, y - 18, 30, 32);
      ctx.fillStyle = "#ffe36c"; ctx.fillRect(x - 3, y - 4, 6, 8);
    }
    function drawBag(x, y) {
      ctx.fillStyle = "#be7a2e";
      ctx.beginPath(); ctx.ellipse(x, y + 4, 18, 20, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#734018"; ctx.fillRect(x - 10, y - 18, 20, 10);
      ctx.strokeStyle = "#2b180d"; ctx.stroke();
    }
    function drawMenu(x, y) {
      ctx.fillStyle = "#dec587";
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(x - 15, y - 14 + i * 11, 30, 5);
        ctx.strokeStyle = "#5c3a1e"; ctx.strokeRect(x - 15, y - 14 + i * 11, 30, 5);
      }
    }
    function drawFlame(x, y) {
      ctx.fillStyle = "#58a436";
      ctx.beginPath(); ctx.arc(x, y + 6, 21, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffe94b";
      ctx.beginPath(); ctx.moveTo(x, y - 22); ctx.bezierCurveTo(x + 22, y, x + 7, y + 22, x, y + 18); ctx.bezierCurveTo(x - 18, y + 5, x - 4, y - 8, x, y - 22); ctx.fill();
    }
    function drawMarker(x, y, color, label, scale = 1) {
      const r = 10 * scale;
      ctx.fillStyle = "rgba(0,0,0,.45)";
      ctx.beginPath(); ctx.ellipse(x, y + 12 * scale, 13 * scale, 5 * scale, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#111"; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.font = `bold ${Math.max(9, 12 * scale)}px Microsoft YaHei`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(label, x, y);
      ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";
    }

    function roundedRect(x, y, w, h, r, fill) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      if (fill) ctx.fill();
      else ctx.stroke();
    }

    function jaggedPanel(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x + 5, y);
      ctx.lineTo(x + w - 7, y + 2);
      ctx.lineTo(x + w, y + 8);
      ctx.lineTo(x + w - 3, y + h - 6);
      ctx.lineTo(x + w - 10, y + h);
      ctx.lineTo(x + 7, y + h - 1);
      ctx.lineTo(x, y + h - 8);
      ctx.lineTo(x + 3, y + 7);
      ctx.closePath();
      ctx.fill();
    }

    function drawTempleIcon(x, y, s = 1) {
      ctx.fillStyle = "rgba(0,0,0,.35)";
      ctx.beginPath(); ctx.ellipse(x, y + 12 * s, 15 * s, 5 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#c65be3";
      ctx.beginPath();
      ctx.moveTo(x, y - 16 * s);
      ctx.quadraticCurveTo(x + 14 * s, y - 6 * s, x + 9 * s, y + 8 * s);
      ctx.quadraticCurveTo(x, y + 18 * s, x - 9 * s, y + 8 * s);
      ctx.quadraticCurveTo(x - 14 * s, y - 6 * s, x, y - 16 * s);
      ctx.fill();
      ctx.fillStyle = "#5d2373";
      ctx.beginPath(); ctx.arc(x, y + 1 * s, 6 * s, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#f5d6ff";
      ctx.beginPath(); ctx.arc(x, y - 1 * s, 3 * s, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#1b0d20";
      ctx.lineWidth = Math.max(1, 2 * s);
      ctx.stroke();
    }

    function drawOfficial(x, y, s = 1) {
      ctx.fillStyle = "rgba(0,0,0,.4)";
      ctx.beginPath(); ctx.ellipse(x, y + 13 * s, 14 * s, 5 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#47215c";
      roundedRect(x - 8 * s, y - 5 * s, 16 * s, 21 * s, 4 * s, true);
      ctx.fillStyle = "#f1c28b";
      ctx.beginPath(); ctx.arc(x, y - 10 * s, 8 * s, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#2b102f";
      ctx.fillRect(x - 10 * s, y - 19 * s, 20 * s, 8 * s);
      ctx.fillStyle = "#b858d5";
      ctx.beginPath(); ctx.arc(x, y + 4 * s, 6 * s, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#110714";
      ctx.lineWidth = Math.max(1, 1.6 * s);
      ctx.strokeRect(x - 8 * s, y - 5 * s, 16 * s, 21 * s);
    }

    function drawBandit(x, y, s = 1) {
      ctx.fillStyle = "rgba(0,0,0,.42)";
      ctx.beginPath(); ctx.ellipse(x, y + 13 * s, 14 * s, 5 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#5b1714";
      ctx.beginPath();
      ctx.moveTo(x, y - 4 * s);
      ctx.lineTo(x + 10 * s, y + 16 * s);
      ctx.lineTo(x - 10 * s, y + 16 * s);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#d1a06c";
      ctx.beginPath(); ctx.arc(x, y - 10 * s, 7 * s, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#111";
      ctx.fillRect(x - 9 * s, y - 16 * s, 18 * s, 5 * s);
      ctx.strokeStyle = "#ddd";
      ctx.lineWidth = Math.max(1, 1.5 * s);
      ctx.beginPath();
      ctx.moveTo(x + 9 * s, y);
      ctx.lineTo(x + 20 * s, y - 9 * s);
      ctx.stroke();
    }

    function drawMiniBag(x, y, s = 1) {
      ctx.fillStyle = "rgba(0,0,0,.35)";
      ctx.beginPath(); ctx.ellipse(x, y + 12 * s, 14 * s, 5 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#b06b2e";
      ctx.beginPath(); ctx.ellipse(x, y + 4 * s, 12 * s, 15 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#6b3517";
      ctx.fillRect(x - 8 * s, y - 13 * s, 16 * s, 7 * s);
      ctx.strokeStyle = "#211107";
      ctx.lineWidth = Math.max(1, 1.5 * s);
      ctx.stroke();
    }

    function drawCaveIcon(x, y, s = 1) {
      ctx.fillStyle = "rgba(0,0,0,.45)";
      ctx.beginPath(); ctx.ellipse(x, y + 12 * s, 17 * s, 5 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#626262";
      ctx.beginPath();
      ctx.moveTo(x - 14 * s, y + 12 * s);
      ctx.quadraticCurveTo(x - 8 * s, y - 15 * s, x, y - 17 * s);
      ctx.quadraticCurveTo(x + 12 * s, y - 12 * s, x + 14 * s, y + 12 * s);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#161616";
      ctx.beginPath();
      ctx.moveTo(x - 7 * s, y + 12 * s);
      ctx.quadraticCurveTo(x, y - 5 * s, x + 7 * s, y + 12 * s);
      ctx.closePath();
      ctx.fill();
    }

    function drawPortraitIcon(x, y) {
      ctx.fillStyle = "#c8a36b";
      ctx.beginPath(); ctx.arc(x, y - 6, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#1b120d";
      ctx.beginPath(); ctx.arc(x - 4, y - 10, 12, Math.PI * .7, Math.PI * 1.9); ctx.fill();
      ctx.fillStyle = "#5a3b25";
      ctx.beginPath();
      ctx.moveTo(x - 16, y + 21);
      ctx.lineTo(x, y + 1);
      ctx.lineTo(x + 18, y + 21);
      ctx.closePath();
      ctx.fill();
    }

    function noise(x, y) {
      const v = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
      return v - Math.floor(v);
    }

    function drawTerrainImage(img, x, y, size, type, gx = 0, gy = 0) {
      const n = noise(gx * 13 + 19, gy * 17 + 37);
      const srcSize = Math.min(img.width, img.height);
      const max = Math.max(1, img.width - srcSize);
      const sx = Math.floor(n * max);
      const sy = Math.floor(noise(gx * 23 + 7, gy * 29 + 11) * max);
      ctx.drawImage(img, sx, sy, srcSize, srcSize, x, y, size, size);

      ctx.strokeStyle = "rgba(0,0,0,.18)";
      ctx.strokeRect(x, y, size, size);
    }

    function loadTerrainImages() {
      const entries = Object.entries(terrainSources);
      let done = 0;
      entries.forEach(([key, src]) => {
        const img = new Image();
        img.onload = () => {
          done++;
          if (done === entries.length) {
            terrainReady = true;
            draw();
          }
        };
        img.onerror = () => {
          done++;
          if (done === entries.length) draw();
        };
        img.src = src;
        terrainImgs[key] = img;
      });
    }

    function loadWallPieceImages() {
      const entries = Object.entries(wallPieceSources);
      let done = 0;
      entries.forEach(([key, src]) => {
        const img = new Image();
        img.onload = () => {
          done++;
          if (done === entries.length) {
            wallPiecesReady = true;
            draw();
          }
        };
        img.onerror = () => {
          done++;
          if (done === entries.length) draw();
        };
        img.src = src;
        wallPieceImgs[key] = img;
      });
    }

    function loadHouseSpriteImages() {
      const entries = Object.entries(houseSpriteSources);
      let done = 0;
      entries.forEach(([key, src]) => {
        const img = new Image();
        img.onload = () => {
          done++;
          if (done === entries.length) {
            houseSpritesReady = true;
            draw();
          }
        };
        img.onerror = () => {
          done++;
          if (done === entries.length) draw();
        };
        img.src = src;
        houseSpriteImgs[key] = img;
      });
    }

    document.getElementById("actionBtn").onclick = () => {
      if (!battle) return interact();
      const now = Date.now();
      if (now - lastTapTime < 320) attack(true);
      else attack(false);
      lastTapTime = now;
    };

    canvas.addEventListener("click", e => e.preventDefault());

    canvas.addEventListener("touchstart", e => {
      if (e.touches.length === 2) {
        suppressNextClick = true;
        pinchStartDistance = touchDistance(e.touches[0], e.touches[1]);
        pinchStartZoom = zoom;
      }
    }, { passive: false });

    canvas.addEventListener("touchmove", e => {
      if (e.touches.length === 2) {
        e.preventDefault();
        suppressNextClick = true;
        const d = touchDistance(e.touches[0], e.touches[1]);
        zoom = Math.max(.78, Math.min(1.7, pinchStartZoom * d / pinchStartDistance));
        draw();
      }
    }, { passive: false });

    canvas.addEventListener("touchend", e => {
      if (e.touches.length < 2 && pinchStartDistance) {
        pinchStartDistance = 0;
        setTimeout(() => suppressNextClick = false, 180);
      }
    });

    canvas.addEventListener("wheel", e => {
      e.preventDefault();
      zoom = Math.max(.78, Math.min(1.7, zoom + (e.deltaY > 0 ? -.08 : .08)));
      draw();
    }, { passive: false });

    canvas.addEventListener("dblclick", e => e.preventDefault());

    canvas.addEventListener("pointerdown", e => {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width * 470;
      const y = (e.clientY - rect.top) / rect.height * 900;
      lastPointer = { x, y };
      pointerMoved = false;
      if (y >= 748 && y <= 840 && x <= 70) heal();
    });

    canvas.addEventListener("pointermove", e => {
      if (!lastPointer) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width * 470;
      const y = (e.clientY - rect.top) / rect.height * 900;
      if (Math.hypot(x - lastPointer.x, y - lastPointer.y) > 8) pointerMoved = true;
    });

    canvas.addEventListener("pointerup", e => {
      if (suppressNextClick || pointerMoved || battle) {
        lastPointer = null;
        return;
      }
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width * 470;
      const y = (e.clientY - rect.top) / rect.height * 900;
      lastPointer = null;
      if (y < MAP_TOP || y > MAP_TOP + MAP_H) return;
      const target = screenToWorld(x, y);
      stepToward(target.x, target.y);
    });

    function touchDistance(a, b) {
      return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    }

    loadTerrainImages();
    loadWallPieceImages();
    loadHouseSpriteImages();
    show("已把精修素材放进游戏里，点一次仍然只走一格。", 2400);
    draw();
  </script>
</body>
</html>
