<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能学习助手 - Demo</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg: #0f0f1a;
  --surface: #1a1a2e;
  --surface2: #22223a;
  --border: #2a2a44;
  --text: #e0e0f0;
  --text-muted: #8888aa;
  --accent: #6c5ce7;
  --accent-hover: #7d6ff0;
  --accent-glow: rgba(108,92,231,0.3);
  --green: #00cec9;
  --green-glow: rgba(0,206,201,0.25);
  --orange: #fdcb6e;
  --red: #ff7675;
  --blue: #74b9ff;
  --radius: 12px;
  --radius-sm: 8px;
  --transition: 0.2s ease;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(ellipse at 30% 20%, rgba(108,92,231,0.06) 0%, transparent 50%),
              radial-gradient(ellipse at 70% 80%, rgba(0,206,201,0.05) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ── Header ── */
.header {
  position: relative; z-index: 1;
  text-align: center; padding: 28px 20px 0;
}
.header h1 {
  font-size: 26px; font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--green));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header .subtitle { color: var(--text-muted); font-size: 13px; margin-top: 4px; }

/* ── Container ── */
.container { max-width: 1100px; margin: 0 auto; padding: 16px 20px 40px; position: relative; z-index: 1; }

/* ── Tabs ── */
.tabs { display: flex; gap: 4px; margin-bottom: 16px; background: var(--surface); border-radius: var(--radius); padding: 4px; }
.tab-btn {
  flex: 1; padding: 10px 16px; border: none; background: transparent; color: var(--text-muted);
  font-size: 14px; cursor: pointer; border-radius: var(--radius-sm); transition: var(--transition);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.tab-btn.active { background: var(--surface2); color: #fff; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
.tab-btn:hover:not(.active) { color: #ccc; }
.tab-icon { font-size: 16px; }

/* ── Panel ── */
.panel { display: none; }
.panel.active { display: block; }

/* ── Plan Page ── */
.plan-card {
  background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border);
  padding: 28px; max-width: 760px; margin: 0 auto;
}
.plan-card h2 { font-size: 18px; margin-bottom: 6px; }
.plan-card .hint { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; }
.input-row { display: flex; gap: 10px; }
.input-row input {
  flex: 1; padding: 12px 16px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text); font-size: 14px; outline: none;
  transition: var(--transition);
}
.input-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.input-row input::placeholder { color: var(--text-muted); }
.btn {
  padding: 12px 24px; border: none; border-radius: var(--radius-sm); font-size: 14px;
  font-weight: 600; cursor: pointer; transition: var(--transition); white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); box-shadow: 0 4px 16px var(--accent-glow); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-sm { padding: 6px 12px; font-size: 12px; }

.plan-output {
  margin-top: 20px; background: var(--surface2); border-radius: var(--radius-sm);
  border: 1px solid var(--border); padding: 20px; min-height: 120px;
  display: none; line-height: 1.8; font-size: 14px;
  max-height: 500px; overflow-y: auto;
}
.plan-output.visible { display: block; }
.plan-output h1,.plan-output h2,.plan-output h3 { color: var(--accent); margin: 16px 0 8px; }
.plan-output h2 { font-size: 16px; }
.plan-output h3 { font-size: 14px; }
.plan-output ul,.plan-output ol { padding-left: 20px; margin: 4px 0; }
.plan-output code { background: rgba(108,92,231,0.15); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
.plan-output strong { color: var(--green); }
.cursor-blink { display: inline-block; width: 2px; height: 16px; background: var(--accent); animation: blink 0.8s infinite; vertical-align: text-bottom; margin-left: 2px; }
@keyframes blink { 0%,100%{ opacity:1; } 50%{ opacity:0; } }

.enter-learn { margin-top: 16px; text-align: center; display: none; }
.enter-learn.visible { display: block; }

/* ── Teacher Page Layout ── */
.teacher-layout { display: flex; gap: 16px; align-items: flex-start; }
.chat-panel { flex: 1; min-width: 0; }
.kb-panel { width: 300px; flex-shrink: 0; }

/* ── Mode Bar ── */
.mode-bar { display: flex; gap: 4px; margin-bottom: 12px; background: var(--surface); border-radius: var(--radius); padding: 4px; }
.mode-btn {
  flex: 1; padding: 8px 10px; border: none; background: transparent; color: var(--text-muted);
  font-size: 12px; cursor: pointer; border-radius: var(--radius-sm); transition: var(--transition);
  text-align: center; line-height: 1.3;
}
.mode-btn .mode-icon { display: block; font-size: 18px; margin-bottom: 2px; }
.mode-btn.active { background: var(--surface2); color: #fff; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
.mode-btn:hover:not(.active) { color: #ccc; }

/* ── Chat Area ── */
.chat-area { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
  scroll-behavior: smooth;
}
.chat-placeholder { color: var(--text-muted); text-align: center; margin-top: 120px; font-size: 14px; }
.chat-placeholder .big-icon { font-size: 48px; display: block; margin-bottom: 12px; opacity: 0.5; }

.msg { max-width: 85%; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 14px; line-height: 1.7; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
.msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 2px; }
.msg.ai { align-self: flex-start; background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
.msg.ai h1,.msg.ai h2,.msg.ai h3 { color: var(--accent); margin: 8px 0 4px; font-size: 15px; }
.msg.ai ul,.msg.ai ol { padding-left: 18px; margin: 4px 0; }
.msg.ai code { background: rgba(108,92,231,0.15); padding: 1px 5px; border-radius: 3px; font-size: 12px; }
.msg.ai strong { color: var(--green); }
.msg .source-tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-top: 6px; }
.source-tag.kb { background: rgba(0,206,201,0.15); color: var(--green); }
.source-tag.web { background: rgba(116,185,255,0.15); color: var(--blue); }

/* ── Extra Context Area ── */
.extra-context { margin-bottom: 10px; display: none; }
.extra-context.visible { display: block; }
.extra-context textarea {
  width: 100%; height: 70px; padding: 10px 14px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text); font-size: 13px; resize: vertical; outline: none;
  font-family: inherit;
}
.extra-context textarea:focus { border-color: var(--accent); }
.extra-context .ctx-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }

/* ── Input Area ── */
.input-area { margin-top: 12px; display: flex; gap: 10px; }
.input-area textarea {
  flex: 1; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text); font-size: 14px; resize: none; outline: none;
  font-family: inherit; height: 44px; line-height: 1.5; transition: var(--transition);
}
.input-area textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.input-area textarea::placeholder { color: var(--text-muted); }

/* ── KB Panel ── */
.kb-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; }
.kb-card h3 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.upload-zone {
  border: 2px dashed var(--border); border-radius: var(--radius-sm); padding: 20px 12px;
  text-align: center; cursor: pointer; transition: var(--transition); margin-bottom: 12px;
  color: var(--text-muted); font-size: 13px;
}
.upload-zone:hover { border-color: var(--accent); color: var(--accent); background: rgba(108,92,231,0.05); }
.upload-zone .upload-icon { font-size: 28px; display: block; margin-bottom: 6px; }
.upload-zone.dragover { border-color: var(--green); background: rgba(0,206,201,0.05); }
.kb-status { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
.doc-list { list-style: none; max-height: 200px; overflow-y: auto; }
.doc-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 6px; transition: var(--transition); font-size: 13px; }
.doc-item:hover { background: var(--surface2); }
.doc-item .doc-info { display: flex; flex-direction: column; gap: 2px; }
.doc-item .doc-name { font-weight: 500; }
.doc-item .doc-meta { font-size: 11px; color: var(--text-muted); }
.doc-item .doc-del { background: none; border: none; color: var(--red); cursor: pointer; font-size: 14px; opacity: 0.6; padding: 4px; }
.doc-item .doc-del:hover { opacity: 1; }
.kb-empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px 0; }
.btn-danger { background: transparent; border: 1px solid rgba(255,118,117,0.3); color: var(--red); font-size: 12px; padding: 6px 14px; border-radius: var(--radius-sm); cursor: pointer; width: 100%; margin-top: 8px; transition: var(--transition); }
.btn-danger:hover { background: rgba(255,118,117,0.1); }

/* ── Loading ── */
.typing-indicator { display: flex; gap: 4px; padding: 8px 0; }
.typing-indicator span { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: typingBounce 1.4s infinite; }
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce { 0%,60%,100%{ transform:translateY(0); } 30%{ transform:translateY(-8px); } }

/* ── Toast ── */
.toast { position: fixed; top: 20px; right: 20px; z-index: 999; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 20px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); animation: slideIn 0.3s ease; }
@keyframes slideIn { from{ opacity:0; transform:translateX(20px); } to{ opacity:1; transform:translateX(0); } }

/* ── Confirm Dialog ── */
.overlay { position: fixed; inset:0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: center; justify-content: center; }
.dialog { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 24px; max-width: 400px; text-align: center; }
.dialog p { margin-bottom: 16px; }
.dialog .btns { display: flex; gap: 10px; justify-content: center; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── Responsive ── */
@media (max-width: 768px) {
  .teacher-layout { flex-direction: column; }
  .kb-panel { width: 100%; }
  .mode-btn { font-size: 11px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>🧠 智能学习助手</h1>
  <p class="subtitle">基于 AI 的快速学习方法 · 前端交互 Demo</p>
</div>

<div class="container">
  <!-- ── Tabs ── -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="plan">
      <span class="tab-icon">🎯</span> 目标规划
    </button>
    <button class="tab-btn" data-tab="teacher">
      <span class="tab-icon">👨‍🏫</span> 专业老师
    </button>
  </div>

  <!-- ═══════ Tab 1: 目标规划 ═══════ -->
  <div class="panel active" id="panel-plan">
    <div class="plan-card">
      <h2>🎯 设定你的学习目标</h2>
      <p class="hint">输入你想学习的领域或技能，AI 将为你生成完整的学习规划</p>
      <div class="input-row">
        <input type="text" id="goal-input" placeholder="例如：我想成为一名数据分析师、我想学习 Python 后端开发……" />
        <button class="btn btn-primary" id="btn-plan" onclick="generatePlan()">✨ 生成学习规划</button>
      </div>
      <div class="plan-output" id="plan-output"></div>
      <div class="enter-learn" id="enter-learn">
        <button class="btn btn-primary" onclick="switchTab('teacher')">🚀 进入学习 →</button>
      </div>
    </div>
  </div>

  <!-- ═══════ Tab 2: 专业老师 ═══════ -->
  <div class="panel" id="panel-teacher">
    <div class="teacher-layout">
      <!-- 左侧：对话区 -->
      <div class="chat-panel">
        <!-- 模式选择 -->
        <div class="mode-bar">
          <button class="mode-btn active" data-mode="chat" onclick="setMode('chat', this)">
            <span class="mode-icon">💬</span>提问答疑
          </button>
          <button class="mode-btn" data-mode="socratic" onclick="setMode('socratic', this)">
            <span class="mode-icon">❓</span>苏格拉底考察
          </button>
          <button class="mode-btn" data-mode="analogy" onclick="setMode('analogy', this)">
            <span class="mode-icon">💡</span>类比教学
          </button>
          <button class="mode-btn" data-mode="deconstruct" onclick="setMode('deconstruct', this)">
            <span class="mode-icon">🔍</span>解构项目
          </button>
        </div>
        <!-- 解构模式额外输入 -->
        <div class="extra-context" id="extra-context">
          <div class="ctx-label">📋 粘贴你要解构的参考内容：</div>
          <textarea id="ctx-input" placeholder="粘贴文章、论文摘要、项目描述等你希望解构分析的内容……"></textarea>
        </div>
        <!-- 对话区域 -->
        <div class="chat-area" id="chat-area">
          <div class="chat-placeholder" id="chat-placeholder">
            <span class="big-icon">👨‍🏫</span>
            选择一种学习模式，开始与 AI 老师对话吧
          </div>
          <div id="chat-messages"></div>
        </div>
        <!-- 输入区 -->
        <div class="input-area">
          <textarea id="chat-input" placeholder="输入你的问题……" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
          <button class="btn btn-primary" id="btn-send" onclick="sendMessage()">发送</button>
        </div>
      </div>

      <!-- 右侧：知识库面板 -->
      <div class="kb-panel">
        <div class="kb-card">
          <h3>📚 知识库</h3>
          <div class="upload-zone" id="upload-zone" onclick="simulateUpload()">
            <span class="upload-icon">📁</span>
            点击或拖拽上传文件<br><small>支持 PDF / TXT / MD</small>
          </div>
          <div class="kb-status" id="kb-status">📊 共 <strong id="kb-count">0</strong> 个文档</div>
          <ul class="doc-list" id="doc-list">
            <li class="kb-empty" id="kb-empty">知识库为空，上传学习资料吧</li>
          </ul>
          <button class="btn-danger" id="btn-clear-kb" onclick="clearKnowledgeBase()" style="display:none;">🗑️ 清空知识库</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
//  State
// ═══════════════════════════════════════
const state = {
  currentTab: 'plan',
  currentMode: 'chat',
  isGenerating: false,
  mockDocs: [] // { name, chunks }
};

// ═══════════════════════════════════════
//  Tab Switching
// ═══════════════════════════════════════
function switchTab(tab) {
  state.currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

// ═══════════════════════════════════════
//  Mode Switching
// ═══════════════════════════════════════
function setMode(mode, btn) {
  state.currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const extraCtx = document.getElementById('extra-context');
  extraCtx.classList.toggle('visible', mode === 'deconstruct');
  document.getElementById('chat-input').focus();
}

// ═══════════════════════════════════════
//  Plan Generation (Simulated Streaming)
// ═══════════════════════════════════════
const MOCK_PLAN = `## 🎯 学习目标分析

你希望掌握 **数据分析** 这一核心技能。这是一个融合了统计学、编程和业务理解的综合领域。

---

## 📅 第一阶段：基础构建（第 1-4 周）

### Week 1-2：Python 数据分析基础
- **NumPy**：数组操作、向量化计算、广播机制
- **Pandas**：DataFrame 操作、数据清洗、分组聚合
- **实践项目**：用 Pandas 分析一份公开数据集（如 Titanic、Iris）

### Week 3-4：统计学与可视化
- **描述性统计**：均值、中位数、方差、分布
- **推断统计基础**：假设检验、p 值、置信区间
- **Matplotlib / Seaborn**：制作专业数据可视化图表
- **实践项目**：完成一份探索性数据分析（EDA）报告

---

## 📅 第二阶段：能力进阶（第 5-8 周）

### Week 5-6：SQL 与数据库
- SQL 基础查询、JOIN、子查询、窗口函数
- 数据库设计基础
- **实践**：在 LeetCode 完成 30+ SQL 题目

### Week 7-8：机器学习入门
- Scikit-learn 基础：分类、回归、聚类
- 特征工程与模型评估
- **实践项目**：构建一个预测模型（房价预测 / 客户流失预测）

---

## 📅 第三阶段：实战演练（第 9-12 周）

### Week 9-10：综合实战
- 端到端数据分析项目：从数据获取到最终报告
- 业务分析思维训练：如何将数据转化为业务洞察
- **里程碑**：完成 2 个完整的分析项目并整理到作品集

### Week 11-12：深化与输出
- 学习撰写技术博客，输出学习总结
- 参与 Kaggle 竞赛或开源项目
- **最终目标**：构建一份数据分析师求职作品集

---

## 🛠️ 推荐学习资源

| 资源 | 类型 |
|------|------|
| 《利用Python进行数据分析》 | 书籍 |
| Kaggle Learn | 在线课程 |
| DataCamp | 交互式学习平台 |
| Towards Data Science | 技术博客 |

---

> 💡 **提示**：每天保持 1-2 小时的专注学习时间，坚持"学-练-输出"的循环，12 周后你将具备初级数据分析师的完整能力栈。`;

async function generatePlan() {
  const input = document.getElementById('goal-input').value.trim();
  if (!input) { showToast('请输入学习目标'); return; }
  if (state.isGenerating) return;

  state.isGenerating = true;
  const btn = document.getElementById('btn-plan');
  const output = document.getElementById('plan-output');
  const enterLearn = document.getElementById('enter-learn');
  
  btn.disabled = true;
  btn.textContent = '⏳ 生成中...';
  output.classList.add('visible');
  output.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
  enterLearn.classList.remove('visible');

  // Simulate streaming by revealing text char by char
  await sleep(800);
  output.innerHTML = '';
  const text = input.includes('数据分析') || input.includes('数据') ? MOCK_PLAN : generateGenericPlan(input);
  
  let displayed = '';
  const chars = [...text];
  const BATCH_SIZE = 3;
  
  for (let i = 0; i < chars.length; i += BATCH_SIZE) {
    displayed += chars.slice(i, i + BATCH_SIZE).join('');
    output.innerHTML = marked.parse(displayed) + '<span class="cursor-blink"></span>';
    output.scrollTop = output.scrollHeight;
    const delay = Math.random() * 15 + 5;
    await sleep(delay);
  }

  output.innerHTML = marked.parse(text);
  output.scrollTop = output.scrollHeight;
  btn.disabled = false;
  btn.textContent = '✨ 重新生成';
  enterLearn.classList.add('visible');
  state.isGenerating = false;
}

function getMockResponse(mode) {
  const responses = MOCK_RESPONSES[mode] || MOCK_RESPONSES.chat;
  return responses[Math.floor(Math.random() * responses.length)];
}

function getSourceTag() {
  const docs = state.mockDocs;
  if (docs.length > 0 && Math.random() > 0.5) {
    // Simulate knowledge base hit
    return '<span class="source-tag kb">📚 来自知识库</span>';
  }
  return '<span class="source-tag web">🌐 来自网络搜索</span>';
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const message = input.value.trim();
  const contextInput = document.getElementById('ctx-input');
  const context = contextInput.value.trim();
  const mode = state.currentMode;

  if (!message) return;
  if (mode === 'deconstruct' && !context) {
    showToast('请在解构内容区域粘贴参考内容');
    return;
  }

  // Clear input
  input.value = '';
  if (mode === 'deconstruct') contextInput.value = '';

  // Hide placeholder
  const placeholder = document.getElementById('chat-placeholder');
  if (placeholder) placeholder.style.display = 'none';

  const messagesContainer = document.getElementById('chat-messages');

  // Add user message
  let userContent = message;
  if (mode === 'deconstruct') userContent = `🔍 [解构请求] ${message}\n\n📋 参考内容：\n${context}`;
  if (mode === 'socratic') userContent = `❓ [考察请求] ${message}`;
  if (mode === 'analogy') userContent = `💡 [类比请求] ${message}`;
  
  addMessage('user', userContent);

  // Add typing indicator
  const typingEl = document.createElement('div');
  typingEl.className = 'msg ai';
  typingEl.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
  typingEl.id = 'typing-msg';
  messagesContainer.appendChild(typingEl);
  scrollChat();

  // Simulate delay
  await sleep(1000 + Math.random() * 1500);

  // Remove typing indicator
  typingEl.remove();

  // Add AI response
  const response = getMockResponse(mode);
  const sourceTag = (mode === 'chat' || mode === 'analogy') ? getSourceTag() : '';
  
  // Simulate streaming
  const streamEl = document.createElement('div');
  streamEl.className = 'msg ai';
  streamEl.id = 'streaming-msg';
  messagesContainer.appendChild(streamEl);
  
  let displayed = '';
  const chars = [...response];
  const BATCH_SIZE = 2;
  
  for (let i = 0; i < chars.length; i += BATCH_SIZE) {
    displayed += chars.slice(i, i + BATCH_SIZE).join('');
    streamEl.innerHTML = marked.parse(displayed) + '<span class="cursor-blink"></span>';
    scrollChat();
    await sleep(Math.random() * 12 + 3);
  }

  streamEl.innerHTML = marked.parse(response) + (sourceTag ? '<br>' + sourceTag : '');
  streamEl.id = '';
  scrollChat();
}

function addMessage(role, content) {
  const messagesContainer = document.getElementById('chat-messages');
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.innerHTML = role === 'user' ? escapeHtml(content) : marked.parse(content);
  messagesContainer.appendChild(el);
  scrollChat();
}

function scrollChat() {
  const area = document.getElementById('chat-area');
  area.scrollTop = area.scrollHeight;
}

function simulateUpload() {
  const mockFiles = [
    'Python数据分析入门.pdf',
    '机器学习实战笔记.md',
    '统计学基础概念.txt',
    '深度学习论文摘要.pdf',
    'SQL必知必会.md'
  ];
  const existingNames = state.mockDocs.map(d => d.name);
  const available = mockFiles.filter(f => !existingNames.includes(f));
  
  if (available.length === 0) {
    showToast('所有演示文档已上传完毕 ✅');
    return;
  }

  const fileName = available[Math.floor(Math.random() * available.length)];
  const chunks = Math.floor(Math.random() * 8) + 3;
  
  state.mockDocs.push({ name: fileName, chunks });
  renderDocList();
  showToast(`✅ 已上传「${fileName}」（${chunks} 个文本块）`);
}

function deleteDocument(name) {
  state.mockDocs = state.mockDocs.filter(d => d.name !== name);
  renderDocList();
  showToast(`🗑️ 已删除「${name}」`);
}

function clearKnowledgeBase() {
  if (state.mockDocs.length === 0) return;
  
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'confirm-overlay';
  overlay.innerHTML = `
    <div class="dialog">
      <p>确认清空知识库中全部 <strong>${state.mockDocs.length}</strong> 个文档？</p>
      <p style="font-size:12px;color:var(--text-muted);">此操作不可撤销</p>
      <div class="btns">
        <button class="btn btn-outline btn-sm" id="btn-cancel">取消</button>
        <button class="btn btn-primary btn-sm" id="btn-confirm" style="background:var(--red);">确认清空</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  
  document.getElementById('btn-cancel').onclick = () => overlay.remove();
  document.getElementById('btn-confirm').onclick = () => {
    state.mockDocs = [];
    renderDocList();
    overlay.remove();
    showToast('🗑️ 知识库已清空');
  };
}

function renderDocList() {
  const list = document.getElementById('doc-list');
  const empty = document.getElementById('kb-empty');
  const count = document.getElementById('kb-count');
  const clearBtn = document.getElementById('btn-clear-kb');
  
  count.textContent = state.mockDocs.length;
  
  if (state.mockDocs.length === 0) {
    list.innerHTML = '<li class="kb-empty" id="kb-empty">知识库为空，上传学习资料吧</li>';
    clearBtn.style.display = 'none';
  } else {
    list.innerHTML = state.mockDocs.map(d => `
      <li class="doc-item">
        <div class="doc-info">
          <span class="doc-name">📄 ${escapeHtml(d.name)}</span>
          <span class="doc-meta">${d.chunks} 个文本块</span>
        </div>
        <button class="doc-del" title="删除" onclick="deleteDocument('${escapeHtml(d.name)}')">✕</button>
      </li>
    `).join('');
    clearBtn.style.display = 'block';
  }
}

//  Utilities
// ═══════════════════════════════════════
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}
