<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>就诊摘要</title>
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/components.css">
  <link rel="stylesheet" href="../../shared/css/animations.css">
  <link rel="stylesheet" href="../../shared/css/toast.css">
</head>
<body class="theme-standard">
  <div class="page">
    <nav class="navbar">
      <button class="navbar-back" onclick="goBack()">← 返回</button>
      <div style="text-align: center;">
        <span class="navbar-title">就诊摘要</span>
        <div class="navbar-subtitle">母亲 张秀兰</div>
      </div>
    </nav>
    <main class="page-content">
      <!-- 基本信息卡片 -->
      <div class="card">
        <div class="card-title">母亲 张秀兰</div>
        <div class="card-body">
          <div class="text-s text-secondary">2026年6月27日 心内科</div>
          <div class="text-s text-secondary">李医生 XX市人民医院</div>
        </div>
      </div>

      <!-- 诊断卡片 -->
      <div class="card">
        <div class="card-title">诊断 🟢</div>
        <div class="card-body">
          <div class="text-m">冠心病、高脂血症稳定期</div>
          <div class="confidence-tag green">置信度 92%</div>
        </div>
      </div>

      <!-- 用药方案卡片 -->
      <div class="card">
        <div class="card-title">用药方案 🟢</div>
        <div class="card-body">
          <div class="list-item">
            <span>美托洛尔（倍他乐克）25mg 半片 每日2次</span>
            <span class="confidence-tag green">置信度 94%</span>
          </div>
          <div class="list-item">
            <span>阿托伐他汀（立普妥）20mg 1片 每日1次</span>
            <span class="confidence-tag green">置信度 91%</span>
          </div>
        </div>
      </div>

      <!-- 服药规则卡片 -->
      <div class="card">
        <div class="card-title">服药规则 🟢</div>
        <div class="card-body">
          <div class="list-item">
            <span>⏰ 阿托伐他汀需睡前服用</span>
          </div>
          <div class="list-item">
            <span>🚫 避免与西柚汁同服</span>
          </div>
        </div>
      </div>

      <!-- 方言守护卡片 -->
      <div class="card card-indigo">
        <div class="card-title">方言守护 <span class="badge dialect">🛡️</span></div>
        <div class="card-body">
          <div class="text-s text-secondary">这段录音包含方言，部分内容可能不准确。</div>
          <div class="list-item">
            <span>[四川话] "脑壳昏"</span>
            <span>→ "头晕"</span>
          </div>
          <div class="list-item">
            <span>[四川话] "心口闷"</span>
            <span>→ "胸闷"</span>
          </div>
          <button class="btn-secondary btn-concept" onclick="showToast('Demo演示 - 为亲人开通方言守护 ¥9.9/月', 'info')">为亲人开通方言守护 ¥9.9/月（Demo演示）</button>
        </div>
      </div>

      <!-- 复诊卡片 -->
      <div class="card">
        <div class="card-title">复诊 🟡</div>
        <div class="card-body">
          <div class="text-m">1个月后复查肝功能+心电图</div>
          <div class="confidence-tag yellow">置信度 78%</div>
          <div class="text-warning text-s">⚠️ 建议就诊时与医生确认</div>
        </div>
      </div>

      <!-- 操作按钮 -->
      <button class="btn-primary" id="confirm-btn" onclick="confirmKnown()">确认已知</button>
      <button class="btn-secondary" id="reminder-btn" onclick="toggleMedicationReminder()">🔔 为亲人开启用药提醒</button>
    </main>
  </div>
  <script src="../../shared/js/mock-data.js"></script>
  <script src="../../shared/js/storage.js"></script>
  <script src="../../shared/js/navigation.js"></script>
  <script src="../../shared/js/theme.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script src="../../shared/js/toast.js"></script>
  <script>
    initMockData();

    let confirmed = false;
    let reminderOn = false;

    function confirmKnown() {
      if (confirmed) return;
      confirmed = true;
      const btn = document.getElementById('confirm-btn');
      btn.textContent = '已确认';
      btn.disabled = true;
      btn.classList.add('confirmed');

      let records = [];
      try {
        const stored = localStorage.getItem('family_confirmed_records');
        if (stored) records = JSON.parse(stored);
      } catch (e) {}
      records.push({ date: '2026-06-27', patient: '张秀兰', dept: '心内科' });
      localStorage.setItem('family_confirmed_records', JSON.stringify(records));
    }

    function toggleMedicationReminder() {
      reminderOn = !reminderOn;
      const btn = document.getElementById('reminder-btn');
      if (reminderOn) {
        btn.textContent = '🔕 关闭用药提醒';
        btn.classList.add('active');
      } else {
        btn.textContent = '🔔 为亲人开启用药提醒';
        btn.classList.remove('active');
      }
    }
  </script>
</body>
</html>
