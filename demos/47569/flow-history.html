<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>客流分析 - 河南文旅景点客流分析与预测系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/sidebar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 侧边栏将由JS动态生成 -->
        <main class="main-content">
            <div class="header">
                <h2><i class="fas fa-history"></i> 客流分析</h2>
                <div class="user-info">
                    <span id="userName">加载中...</span>
                    <button class="btn btn-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> 退出</button>
                </div>
            </div>
            <div class="card">
                <div class="search-bar">
                    <select id="scenicSelect" onchange="onScenicChange()"><option value="">全部景点</option></select>
                    <input type="date" id="startDate" onchange="loadHistoryData(1); startAutoRefresh();">
                    <input type="date" id="endDate" onchange="loadHistoryData(1); startAutoRefresh();">
                    <div class="date-shortcuts">
                        <button class="btn btn-sm btn-outline" onclick="setDateRange('today')">今天</button>
                        <button class="btn btn-sm btn-outline" onclick="setDateRange('yesterday')">昨天</button>
                        <button class="btn btn-sm btn-outline" onclick="setDateRange('7days')">近7天</button>
                        <button class="btn btn-sm btn-outline" onclick="setDateRange('30days')">近30天</button>
                        <button class="btn btn-sm btn-outline" onclick="setDateRange('thisMonth')">本月</button>
                        <button class="btn btn-sm btn-outline" onclick="setDateRange('lastMonth')">上月</button>
                    </div>
                    <button class="btn btn-primary" onclick="loadHistoryData(1); startAutoRefresh();"><i class="fas fa-search"></i> 查询</button>
                    <button class="btn btn-secondary" onclick="refreshData()"><i class="fas fa-sync-alt"></i> 刷新</button>
                </div>
                <div class="search-info" id="searchInfo">
                    <span>数据更新时间: <span id="lastUpdateTime">--</span></span>
                    <span style="margin-left: 20px; color: #10b981;">
                        <i class="fas fa-circle" style="font-size: 8px; animation: pulse 1.5s infinite;"></i>
                        自动刷新: <strong id="autoRefreshCountdown">30s</strong>
                    </span>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title"><i class="fas fa-chart-area"></i> 历史客流趋势</h3>
                </div>
                <div id="historyTrendChart" class="chart-container"></div>
            </div>
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title"><i class="fas fa-chart-line"></i> 日环比增长率（与上一日相比）</h3>
                </div>
                <div id="flowHeatmap" class="chart-container"></div>
            </div>
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title"><i class="fas fa-trophy"></i> TOP 景点客流排行</h3>
                </div>
                <div id="flowRadarChart" class="chart-container"></div>
            </div>
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title"><i class="fas fa-trophy"></i> 热度景点排行</h3>
                </div>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width:60px;">排名</th>
                                <th>景点名称</th>
                                <th>总客流量</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <tr><td colspan="3" style="text-align:center;">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script>
        let currentPage = 1, scenicList = [];
        let autoRefreshTimer = null;
        let countdownTimer = null;
        let nextRefreshTime = 0;
        const REFRESH_INTERVAL = 30; // 自动刷新间隔（秒）

        checkLogin().then(user => {
            if (!user) { window.location.href = 'login.html'; return; }
            document.getElementById('userName').textContent = user.nickname || user.username;

            // 初始化侧边栏
            initSidebar('flow-history');

            // 默认选择近7天
            setDateRange('7days');

            loadScenics();
            loadHistoryData(1);
            startAutoRefresh();
        });

        // 切换景点时重置自动刷新
        function onScenicChange() {
            loadHistoryData(1);
            startAutoRefresh();
        }

        // 启动自动刷新
        function startAutoRefresh() {
            stopAutoRefresh();
            nextRefreshTime = Date.now() + REFRESH_INTERVAL * 1000;
            autoRefreshTimer = setInterval(() => {
                loadHistoryData(currentPage, true);
                nextRefreshTime = Date.now() + REFRESH_INTERVAL * 1000;
            }, REFRESH_INTERVAL * 1000);
            countdownTimer = setInterval(updateCountdown, 1000);
        }

        function stopAutoRefresh() {
            if (autoRefreshTimer) clearInterval(autoRefreshTimer);
            if (countdownTimer) clearInterval(countdownTimer);
        }

        function updateCountdown() {
            const remain = Math.max(0, Math.round((nextRefreshTime - Date.now()) / 1000));
            const el = document.getElementById('autoRefreshCountdown');
            if (el) el.textContent = remain + 's';
        }

        async function loadScenics() {
            const res = await scenicApi.getAll();
            if (res.code === 200) {
                scenicList = res.data;
                const sel = document.getElementById('scenicSelect');
                scenicList.forEach(s => { sel.innerHTML += `<option value="${s.scenicId}">${s.scenicName}</option>`; });
            }
        }
        function getScenicName(id) {
            const s = scenicList.find(s => s.scenicId === id);
            return s ? s.scenicName : '未知';
        }
        async function loadHistoryData(page = 1, silent = false) {
            currentPage = page;
            const scenicId = document.getElementById('scenicSelect').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            try {
                // 使用 daily 接口，按日期聚合（每天一条），消除 X 轴日期重复
                const res = await flowHistoryApi.getDaily({ scenicId, startDate, endDate });
                if (res.code === 200) {
                    renderHistoryTable();
                    renderHistoryChart(res.data);
                    renderHeatmap(res.data);
                    renderRadarChart();
                    // 更新"最后更新时间"
                    const now = new Date();
                    const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    const updateEl = document.getElementById('lastUpdateTime');
                    if (updateEl) {
                        updateEl.textContent = timeStr + (silent ? ' (自动)' : '');
                    }
                }
            } catch (err) { console.error(err); }
        }
        // 渲染"热度景点排行"表格（基于日期范围内的总客流）
        async function renderHistoryTable() {
            const tbody = document.getElementById('historyTableBody');

            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const params = { limit: 20 };
            if (startDate) params.startDate = startDate;
            if (endDate) params.endDate = endDate;

            let topList = [];
            try {
                const query = new URLSearchParams(params).toString();
                const res = await fetch(API_BASE_URL + '/flow/history/top-scenic?' + query, {
                    method: 'GET',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' }
                });
                const json = await res.json();
                if (json.code === 200) {
                    topList = json.data || [];
                }
            } catch (err) {
                console.error('加载热度景点排行失败', err);
            }

            if (!topList || topList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#999;">暂无数据</td></tr>';
                return;
            }

            // 排名奖牌配色
            const medal = (rank) => {
                if (rank === 1) return '🥇';
                if (rank === 2) return '🥈';
                if (rank === 3) return '🥉';
                return rank;
            };

            // 计算百分比（用于进度条）
            const maxVal = Math.max(...topList.map(i => i.totalFlow || 0), 1);

            let html = '';
            topList.forEach((item, idx) => {
                const rank = idx + 1;
                const percent = ((item.totalFlow || 0) / maxVal) * 100;
                const rankBadge = rank <= 3
                    ? `<span style="font-size:18px;">${medal(rank)}</span>`
                    : `<span style="display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;background:#e0e7ff;color:#4f46e5;border-radius:50%;font-weight:600;font-size:12px;">${rank}</span>`;
                html += `<tr>
                    <td style="text-align:center;">${rankBadge}</td>
                    <td><strong>${item.scenicName || '景点' + item.scenicId}</strong></td>
                    <td>
                        <div style="display:flex;align-items:center;gap:10px;">
                            <div style="flex:1;height:8px;background:#f3f4f6;border-radius:4px;overflow:hidden;">
                                <div style="width:${percent}%;height:100%;background:linear-gradient(90deg, #667eea, #764ba2);"></div>
                            </div>
                            <span style="min-width:90px;text-align:right;font-weight:600;color:#4f46e5;">${(item.totalFlow || 0).toLocaleString()} 人</span>
                        </div>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }
        function renderHistoryChart(list) {
            if (!list || list.length === 0) {
                const chartDom = document.getElementById('historyTrendChart');
                const myChart = echarts.init(chartDom);
                myChart.setOption({
                    title: { text: '暂无数据', left: 'center', top: 'center', textStyle: { color: '#999' } },
                    xAxis: { type: 'category', data: [] },
                    yAxis: { type: 'value', name: '客流量' },
                    series: []
                }, true);
                return;
            }
            const chartDom = document.getElementById('historyTrendChart');
            const myChart = echarts.init(chartDom);
            // daily 数据已经按日期升序
            const dates = list.map(item => item.recordDate);
            const values = list.map(item => item.flowCount || 0);
            const scenicId = document.getElementById('scenicSelect').value;
            const scenicName = scenicId ? getScenicName(parseInt(scenicId)) : '全部景点';

            myChart.setOption({
                title: { text: '' },
                tooltip: {
                    trigger: 'axis',
                    formatter: function(params) {
                        const item = params[0];
                        return `${item.axisValue}<br/>${item.marker} ${scenicName}<br/>客流量: <strong>${(item.value || 0).toLocaleString()}</strong> 人`;
                    }
                },
                grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                xAxis: {
                    type: 'category',
                    data: dates,
                    axisLabel: { rotate: dates.length > 10 ? 30 : 0 }
                },
                yAxis: { type: 'value', name: '客流量' },
                series: [{
                    name: scenicName,
                    type: 'line',
                    smooth: true,
                    data: values,
                    symbol: 'circle',
                    symbolSize: 6,
                    itemStyle: { color: '#667eea' },
                    lineStyle: { color: '#667eea', width: 2 },
                    areaStyle: {
                        color: {
                            type: 'linear',
                            x: 0, y: 0, x2: 0, y2: 1,
                            colorStops: [
                                { offset: 0, color: 'rgba(102,126,234,0.4)' },
                                { offset: 1, color: 'rgba(102,126,234,0.05)' }
                            ]
                        }
                    }
                }]
            }, true);
            window.addEventListener('resize', () => myChart.resize());
        }

        // 渲染日环比增长率柱状图
        // 用 daily 数据的相邻日对比：增长率 = (今天 - 昨天) / 昨天 * 100%
        function renderHeatmap(list) {
            const chartDom = document.getElementById('flowHeatmap');
            const growthChart = echarts.init(chartDom);

            if (!list || list.length < 2) {
                growthChart.setOption({
                    title: { text: '数据不足（至少需要2天）', left: 'center', top: 'center', textStyle: { color: '#999' } },
                    tooltip: {},
                    grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                    xAxis: { type: 'category', data: [] },
                    yAxis: { type: 'value', name: '增长率(%)' },
                    series: []
                }, true);
                return;
            }

            // 按日期升序
            const sorted = [...list].sort((a, b) => (a.recordDate || '').localeCompare(b.recordDate || ''));
            const dates = [];
            const growthRates = [];
            const colors = [];
            for (let i = 1; i < sorted.length; i++) {
                const prev = sorted[i - 1].flowCount || 0;
                const cur = sorted[i].flowCount || 0;
                let rate = 0;
                if (prev > 0) {
                    rate = ((cur - prev) / prev) * 100;
                } else if (cur > 0) {
                    rate = 100; // 昨天0，今天>0，增长100%
                }
                const dateLabel = sorted[i].recordDate;
                dates.push(dateLabel);
                growthRates.push(Number(rate.toFixed(2)));
                // 正增长绿色，负增长红色，零增长灰色
                if (rate > 0.5) colors.push('#10b981');
                else if (rate < -0.5) colors.push('#ef4444');
                else colors.push('#9ca3af');
            }

            // 计算平均增长率
            const avgRate = growthRates.length > 0
                ? (growthRates.reduce((s, v) => s + v, 0) / growthRates.length)
                : 0;

            growthChart.setOption({
                tooltip: {
                    trigger: 'axis',
                    formatter: function(params) {
                        const item = params[0];
                        const sign = item.value > 0 ? '↑' : (item.value < 0 ? '↓' : '→');
                        return `${item.axisValue}<br/>${item.marker} 日环比: <strong>${sign} ${Math.abs(item.value).toFixed(2)}%</strong>`;
                    }
                },
                grid: { left: '3%', right: '4%', bottom: '8%', top: '18%', containLabel: true },
                title: {
                    text: `平均增长率: ${avgRate >= 0 ? '+' : ''}${avgRate.toFixed(2)}%`,
                    left: 'right',
                    top: 0,
                    textStyle: {
                        color: avgRate >= 0 ? '#10b981' : '#ef4444',
                        fontSize: 13,
                        fontWeight: 'bold'
                    }
                },
                xAxis: {
                    type: 'category',
                    data: dates,
                    axisLabel: { rotate: dates.length > 8 ? 30 : 0 }
                },
                yAxis: {
                    type: 'value',
                    name: '增长率(%)',
                    axisLabel: {
                        formatter: '{value}%'
                    }
                },
                series: [{
                    name: '日环比增长率',
                    type: 'bar',
                    data: growthRates.map((v, i) => ({
                        value: v,
                        itemStyle: { color: colors[i] }
                    })),
                    barWidth: '55%',
                    label: {
                        show: true,
                        position: 'top',
                        formatter: function(p) {
                            return (p.value > 0 ? '+' : '') + p.value.toFixed(1) + '%';
                        },
                        fontSize: 11
                    }
                }]
            }, true);

            window.addEventListener('resize', () => growthChart.resize());
        }

        // 渲染 TOP 景点客流排行（横向柱状图，替代原雷达图）
        async function renderRadarChart() {
            const chartDom = document.getElementById('flowRadarChart');
            const radarChart = echarts.init(chartDom);

            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const params = { limit: 10 };
            if (startDate) params.startDate = startDate;
            if (endDate) params.endDate = endDate;

            let topList = [];
            try {
                const query = new URLSearchParams(params).toString();
                const res = await fetch(API_BASE_URL + '/flow/history/top-scenic?' + query, {
                    method: 'GET',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' }
                });
                const json = await res.json();
                if (json.code === 200) {
                    topList = json.data || [];
                }
            } catch (err) {
                console.error('加载TOP景点失败', err);
            }

            if (!topList || topList.length === 0) {
                radarChart.setOption({
                    title: { text: '暂无数据', left: 'center', top: 'center', textStyle: { color: '#999' } },
                    series: []
                }, true);
                return;
            }

            // 降序 → 升序（柱状图从下往上显示时，倒序更顺眼）
            const sorted = [...topList].sort((a, b) => a.totalFlow - b.totalFlow);
            const names = sorted.map(item => item.scenicName || '景点' + item.scenicId);
            const values = sorted.map(item => item.totalFlow || 0);

            // 渐变色（按总客流从大到小映射：顶部亮、底部暗）
            const maxVal = Math.max(...values, 1);
            const colors = sorted.map(item => {
                const ratio = (item.totalFlow || 0) / maxVal;
                const r = Math.round(102 + (118 - 102) * ratio);
                const g = Math.round(126 + (75 - 126) * ratio);
                const b = Math.round(234 + (162 - 234) * ratio);
                return `rgb(${r}, ${g}, ${b})`;
            });

            radarChart.setOption({
                title: {
                    text: '所选时段内客流最高的 10 个景点',
                    left: 'center',
                    top: 5,
                    textStyle: { fontSize: 13, color: '#666' }
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' },
                    formatter: function(params) {
                        const idx = params[0].dataIndex;
                        const item = sorted[idx];
                        return '<b>' + (item.scenicName || ('景点' + item.scenicId)) + '</b><br/>' +
                               '总客流：<b>' + (item.totalFlow || 0).toLocaleString() + '</b> 人<br/>' +
                               '景点ID：' + item.scenicId;
                    }
                },
                grid: { left: 110, right: 60, top: 50, bottom: 30 },
                xAxis: {
                    type: 'value',
                    axisLabel: { formatter: function(v) { return v >= 10000 ? (v / 10000).toFixed(1) + '万' : v; } }
                },
                yAxis: {
                    type: 'category',
                    data: names,
                    axisLabel: { fontSize: 12, color: '#333' },
                    inverse: false
                },
                series: [{
                    name: '总客流',
                    type: 'bar',
                    data: values.map((v, i) => ({ value: v, itemStyle: { color: colors[i] } })),
                    label: {
                        show: true,
                        position: 'right',
                        formatter: function(params) {
                            return (params.value || 0).toLocaleString() + ' 人';
                        },
                        fontSize: 11,
                        color: '#333'
                    },
                    barMaxWidth: 28
                }]
            }, true);

            window.addEventListener('resize', () => radarChart.resize());
        }
        
        // 日期快捷选择
        function setDateRange(range) {
            const today = new Date();
            let startDate, endDate;
            const pad = n => n < 10 ? '0' + n : n;
            const formatDateStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
            
            switch(range) {
                case 'today':
                    startDate = formatDateStr(today);
                    endDate = formatDateStr(today);
                    break;
                case 'yesterday':
                    const yesterday = new Date(today);
                    yesterday.setDate(yesterday.getDate() - 1);
                    startDate = formatDateStr(yesterday);
                    endDate = formatDateStr(yesterday);
                    break;
                case '7days':
                    const sevenDaysAgo = new Date(today);
                    sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7); // 不含今天，从 today-1 起往前 7 天
                    startDate = formatDateStr(sevenDaysAgo);
                    const sevenDaysEnd = new Date(today);
                    sevenDaysEnd.setDate(sevenDaysEnd.getDate() - 1);
                    endDate = formatDateStr(sevenDaysEnd);
                    break;
                case '30days':
                    const thirtyDaysAgo = new Date(today);
                    thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30); // 不含今天，从 today-1 起往前 30 天
                    startDate = formatDateStr(thirtyDaysAgo);
                    const thirtyDaysEnd = new Date(today);
                    thirtyDaysEnd.setDate(thirtyDaysEnd.getDate() - 1);
                    endDate = formatDateStr(thirtyDaysEnd);
                    break;
                case 'thisMonth':
                    startDate = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-01';
                    endDate = formatDateStr(today);
                    break;
                case 'lastMonth':
                    const lastMonth = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                    const lastMonthEnd = new Date(today.getFullYear(), today.getMonth(), 0);
                    startDate = formatDateStr(lastMonth);
                    endDate = formatDateStr(lastMonthEnd);
                    break;
                default:
                    return;
            }
            
            document.getElementById('startDate').value = startDate;
            document.getElementById('endDate').value = endDate;

            // 设置日期后自动查询数据，并重置自动刷新计时器
            loadHistoryData(1);
            startAutoRefresh();
        }
        
        // 格式化日期字符串
        function formatDateStr(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        
        // 刷新数据
        async function refreshData() {
            const refreshBtn = document.querySelector('.btn-secondary');
            const originalText = refreshBtn.innerHTML;
            refreshBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 刷新中...';
            refreshBtn.disabled = true;
            
            try {
                await loadHistoryData(currentPage);
                document.getElementById('lastUpdateTime').textContent = new Date().toLocaleString('zh-CN');
            } catch (err) {
                console.error('刷新失败', err);
            } finally {
                refreshBtn.innerHTML = originalText;
                refreshBtn.disabled = false;
            }
        }
        
        // 自动刷新（每5分钟）
        setInterval(() => {
            refreshData();
        }, 5 * 60 * 1000);
    </script>
    <script src="js/ai-float.js"></script>
</body>
</html>
