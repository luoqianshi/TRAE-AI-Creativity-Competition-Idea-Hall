<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>驱赶兽人 - 塔防游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            color: #eee;
        }

        .game-title {
            font-size: 32px;
            color: #e94560;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
            margin-bottom: 15px;
            letter-spacing: 4px;
        }

        .game-container {
            position: relative;
            background: #16213e;
            border: 3px solid #0f3460;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(15, 52, 96, 0.8);
        }

        #gameCanvas {
            display: block;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: linear-gradient(180deg, #0f3460 0%, #16213e 100%);
            border-bottom: 2px solid #e94560;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
        }

        .stat-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gold-icon {
            color: #ffd700;
        }

        .heart-icon {
            color: #e94560;
        }

        .wave-icon {
            color: #00d9ff;
        }

        .stat-value {
            font-weight: bold;
            min-width: 40px;
        }

        .gold-value {
            color: #ffd700;
        }

        .heart-value {
            color: #e94560;
        }

        .wave-value {
            color: #00d9ff;
        }

        .bottom-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            background: linear-gradient(0deg, #0f3460 0%, #16213e 100%);
            border-top: 2px solid #0f3460;
        }

        .tower-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 10px 20px;
            background: #1a1a2e;
            border: 2px solid #0f3460;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 100px;
        }

        .tower-btn:hover {
            border-color: #00d9ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 217, 255, 0.3);
        }

        .tower-btn.selected {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.2);
        }

        .tower-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .tower-name {
            font-size: 14px;
            font-weight: bold;
        }

        .tower-cost {
            font-size: 12px;
            color: #ffd700;
        }

        .tower-desc {
            font-size: 10px;
            color: #888;
        }

        .arrow-tower .tower-name {
            color: #4ade80;
        }

        .cannon-tower .tower-name {
            color: #f97316;
        }

        .start-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #e94560 0%, #c73e54 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }

        .start-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay-title {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 30px currentColor;
        }

        .overlay-title.win {
            color: #4ade80;
        }

        .overlay-title.lose {
            color: #e94560;
        }

        .overlay-score {
            font-size: 24px;
            margin-bottom: 30px;
            color: #ffd700;
        }

        .overlay-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #00d9ff 0%, #0099cc 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .overlay-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
        }

        .instructions {
            position: absolute;
            top: 60px;
            left: 10px;
            font-size: 11px;
            color: #666;
            line-height: 1.6;
        }

        .game-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: bold;
            color: #00d9ff;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.8);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .game-message.show {
            opacity: 1;
        }

        .legend {
            margin-top: 15px;
            display: flex;
            gap: 20px;
            font-size: 12px;
            color: #888;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        .legend-path {
            background: #2a2a4a;
        }

        .legend-build {
            background: #1a3a2a;
            border: 1px dashed #4ade80;
        }
    </style>
</head>
<body>
    <h1 class="game-title">驱 赶 兽 人</h1>

    <div class="game-container">
        <div class="top-bar">
            <div class="stat">
                <span class="stat-icon gold-icon">&#9733;</span>
                <span>金币:</span>
                <span class="stat-value gold-value" id="goldDisplay">100</span>
            </div>
            <div class="stat">
                <span class="stat-icon heart-icon">&#9829;</span>
                <span>生命:</span>
                <span class="stat-value heart-value" id="heartDisplay">20</span>
            </div>
            <div class="stat">
                <span class="stat-icon wave-icon">&#8679;</span>
                <span>波次:</span>
                <span class="stat-value wave-value" id="waveDisplay">0/10</span>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <div class="instructions">
            点击地块建造防御塔<br>
            箭塔:快速攻击单体<br>
            炮塔:范围攻击高伤害
        </div>

        <div class="game-message" id="gameMessage"></div>

        <div class="overlay" id="startOverlay">
            <div class="overlay-title" style="color: #e94560;">驱赶兽人</div>
            <div style="color: #888; margin-bottom: 30px; text-align: center; line-height: 1.8;">
                建造防御塔抵御兽人的入侵<br>
                保护你的领地安全
            </div>
            <button class="overlay-btn" id="startGameBtn">开始游戏</button>
        </div>

        <div class="overlay hidden" id="endOverlay">
            <div class="overlay-title" id="endTitle">游戏结束</div>
            <div class="overlay-score" id="endScore">得分: 0</div>
            <button class="overlay-btn" id="restartBtn">再来一局</button>
        </div>

        <div class="bottom-bar">
            <div class="tower-btn arrow-tower" id="arrowTowerBtn" data-tower="arrow">
                <span class="tower-name">箭塔</span>
                <span class="tower-cost">50 金币</span>
                <span class="tower-desc">攻击快/单体</span>
            </div>
            <div class="tower-btn cannon-tower" id="cannonTowerBtn" data-tower="cannon">
                <span class="tower-name">炮塔</span>
                <span class="tower-cost">100 金币</span>
                <span class="tower-desc">攻击慢/范围</span>
            </div>
            <button class="start-btn" id="startWaveBtn">开始波次</button>
        </div>
    </div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-color legend-path"></div>
            <span>兽人路径</span>
        </div>
        <div class="legend-item">
            <div class="legend-color legend-build"></div>
            <span>可建造区域</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 游戏状态
        let gameState = {
            gold: 100,
            hearts: 20,
            wave: 0,
            maxWaves: 10,
            score: 0,
            isWaveActive: false,
            selectedTower: null,
            gameOver: false,
            gameStarted: false
        };

        // 防御塔配置
        const towerConfigs = {
            arrow: {
                cost: 50,
                damage: 15,
                range: 120,
                fireRate: 30,
                color: '#4ade80',
                size: 18,
                projectileSpeed: 8,
                projectileColor: '#a3e635',
                splash: false
            },
            cannon: {
                cost: 100,
                damage: 40,
                range: 100,
                fireRate: 90,
                color: '#f97316',
                size: 22,
                projectileSpeed: 5,
                projectileColor: '#fb923c',
                splash: true,
                splashRadius: 50
            }
        };

        // 路径点
        const path = [
            { x: -30, y: 100 },
            { x: 100, y: 100 },
            { x: 100, y: 300 },
            { x: 300, y: 300 },
            { x: 300, y: 150 },
            { x: 500, y: 150 },
            { x: 500, y: 400 },
            { x: 700, y: 400 },
            { x: 700, y: 250 },
            { x: 830, y: 250 }
        ];

        // 网格设置
        const gridSize = 50;
        const towers = [];
        const enemies = [];
        const projectiles = [];
        const particles = [];

        // 敌人配置
        const enemyTypes = {
            basic: { hp: 60, speed: 1.2, reward: 10, color: '#8b5cf6', size: 14 },
            fast: { hp: 40, speed: 2.2, reward: 8, color: '#06b6d4', size: 10 },
            tank: { hp: 200, speed: 0.7, reward: 30, color: '#a855f7', size: 20 }
        };

        // 检查点是否在路径上
        function isOnPath(x, y) {
            const pathWidth = 40;
            for (let i = 0; i < path.length - 1; i++) {
                const p1 = path[i];
                const p2 = path[i + 1];

                if (p1.x === p2.x) {
                    if (Math.abs(x - p1.x) < pathWidth && y >= Math.min(p1.y, p2.y) - pathWidth && y <= Math.max(p1.y, p2.y) + pathWidth) {
                        return true;
                    }
                } else {
                    if (Math.abs(y - p1.y) < pathWidth && x >= Math.min(p1.x, p2.x) - pathWidth && x <= Math.max(p1.x, p2.x) + pathWidth) {
                        return true;
                    }
                }
            }
            return false;
        }

        // 检查位置是否可以建造
        function canBuild(gridX, gridY) {
            const centerX = gridX * gridSize + gridSize / 2;
            const centerY = gridY * gridSize + gridSize / 2;

            if (isOnPath(centerX, centerY)) return false;

            for (const tower of towers) {
                if (tower.gridX === gridX && tower.gridY === gridY) return false;
            }

            return true;
        }

        // 建造防御塔
        function buildTower(gridX, gridY, type) {
            const config = towerConfigs[type];
            if (gameState.gold < config.cost) return false;
            if (!canBuild(gridX, gridY)) return false;

            gameState.gold -= config.cost;
            updateUI();

            towers.push({
                gridX,
                gridY,
                x: gridX * gridSize + gridSize / 2,
                y: gridY * gridSize + gridSize / 2,
                type,
                ...config,
                cooldown: 0,
                target: null,
                angle: 0
            });

            return true;
        }

        // 生成敌人
        function spawnEnemy(type) {
            const config = enemyTypes[type];
            enemies.push({
                x: path[0].x,
                y: path[0].y,
                type,
                hp: config.hp,
                maxHp: config.hp,
                speed: config.speed,
                reward: config.reward,
                color: config.color,
                size: config.size,
                pathIndex: 0,
                progress: 0
            });
        }

        // 开始波次
        function startWave() {
            if (gameState.isWaveActive || gameState.gameOver) return;

            gameState.wave++;
            gameState.isWaveActive = true;
            updateUI();
            showMessage('第 ' + gameState.wave + ' 波来袭!');

            const enemyCount = 5 + gameState.wave * 2;
            let spawned = 0;

            const spawnInterval = setInterval(() => {
                if (spawned >= enemyCount || gameState.gameOver) {
                    clearInterval(spawnInterval);
                    return;
                }

                let type = 'basic';
                const rand = Math.random();
                if (gameState.wave >= 3 && rand < 0.2) type = 'fast';
                if (gameState.wave >= 5 && rand < 0.15) type = 'tank';
                if (gameState.wave >= 7 && rand < 0.25) type = 'tank';

                spawnEnemy(type);
                spawned++;
            }, 800);
        }

        // 移动敌人
        function moveEnemies() {
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];

                if (enemy.pathIndex >= path.length - 1) {
                    gameState.hearts--;
                    updateUI();
                    enemies.splice(i, 1);

                    if (gameState.hearts <= 0) {
                        endGame(false);
                    }
                    continue;
                }

                const target = path[enemy.pathIndex + 1];
                const dx = target.x - enemy.x;
                const dy = target.y - enemy.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < enemy.speed) {
                    enemy.pathIndex++;
                } else {
                    enemy.x += (dx / dist) * enemy.speed;
                    enemy.y += (dy / dist) * enemy.speed;
                }
            }
        }

        // 防御塔攻击
        function towerAttack() {
            for (const tower of towers) {
                tower.cooldown = Math.max(0, tower.cooldown - 1);

                if (tower.cooldown > 0) continue;

                let target = null;
                let minDist = Infinity;

                for (const enemy of enemies) {
                    const dx = enemy.x - tower.x;
                    const dy = enemy.y - tower.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist <= tower.range && dist < minDist) {
                        minDist = dist;
                        target = enemy;
                    }
                }

                if (target) {
                    tower.angle = Math.atan2(target.y - tower.y, target.x - tower.x);
                    tower.cooldown = tower.fireRate;

                    projectiles.push({
                        x: tower.x,
                        y: tower.y,
                        targetX: target.x,
                        targetY: target.y,
                        target,
                        speed: tower.projectileSpeed,
                        damage: tower.damage,
                        color: tower.projectileColor,
                        splash: tower.splash,
                        splashRadius: tower.splashRadius || 0,
                        size: tower.type === 'cannon' ? 6 : 4
                    });
                }
            }
        }

        // 移动子弹
        function moveProjectiles() {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];

                if (p.target && enemies.includes(p.target)) {
                    p.targetX = p.target.x;
                    p.targetY = p.target.y;
                }

                const dx = p.targetX - p.x;
                const dy = p.targetY - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < p.speed) {
                    if (p.splash) {
                        for (const enemy of enemies) {
                            const edx = enemy.x - p.targetX;
                            const edy = enemy.y - p.targetY;
                            const edist = Math.sqrt(edx * edx + edy * edy);
                            if (edist <= p.splashRadius) {
                                damageEnemy(enemy, p.damage * (1 - edist / p.splashRadius));
                            }
                        }
                        createParticles(p.targetX, p.targetY, p.color, 10);
                    } else {
                        if (p.target && enemies.includes(p.target)) {
                            damageEnemy(p.target, p.damage);
                        }
                        createParticles(p.x, p.y, p.color, 5);
                    }
                    projectiles.splice(i, 1);
                } else {
                    p.x += (dx / dist) * p.speed;
                    p.y += (dy / dist) * p.speed;
                }
            }
        }

        // 伤害敌人
        function damageEnemy(enemy, damage) {
            enemy.hp -= damage;
            if (enemy.hp <= 0) {
                gameState.gold += enemy.reward;
                gameState.score += enemy.reward * 10;
                updateUI();
                createParticles(enemy.x, enemy.y, enemy.color, 8);
                const index = enemies.indexOf(enemy);
                if (index > -1) enemies.splice(index, 1);
            }
        }

        // 创建粒子效果
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 3;
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 20 + Math.random() * 20,
                    color,
                    size: 2 + Math.random() * 3
                });
            }
        }

        // 更新粒子
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                p.size *= 0.95;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        // 检查波次完成
        function checkWaveComplete() {
            if (gameState.isWaveActive && enemies.length === 0) {
                gameState.isWaveActive = false;

                if (gameState.wave >= gameState.maxWaves) {
                    endGame(true);
                } else {
                    showMessage('防守成功! 准备下一波');
                    setTimeout(() => {
                        if (!gameState.gameOver) showMessage('金币 +50');
                        gameState.gold += 50;
                        updateUI();
                    }, 1000);
                }
            }
        }

        // 游戏结束
        function endGame(won) {
            gameState.gameOver = true;
            const overlay = document.getElementById('endOverlay');
            const title = document.getElementById('endTitle');
            const score = document.getElementById('endScore');

            overlay.classList.remove('hidden');

            if (won) {
                title.textContent = '胜利!';
                title.className = 'overlay-title win';
                showMessage('恭喜通关!');
            } else {
                title.textContent = '失败...';
                title.className = 'overlay-title lose';
                showMessage('领地失守...');
            }

            score.textContent = '得分: ' + gameState.score;
        }

        // 显示消息
        function showMessage(text) {
            const msg = document.getElementById('gameMessage');
            msg.textContent = text;
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 1500);
        }

        // 更新UI
        function updateUI() {
            document.getElementById('goldDisplay').textContent = gameState.gold;
            document.getElementById('heartDisplay').textContent = gameState.hearts;
            document.getElementById('waveDisplay').textContent = gameState.wave + '/' + gameState.maxWaves;

            document.getElementById('arrowTowerBtn').classList.toggle('disabled', gameState.gold < 50);
            document.getElementById('cannonTowerBtn').classList.toggle('disabled', gameState.gold < 100);
            document.getElementById('startWaveBtn').disabled = gameState.isWaveActive || gameState.gameOver;
        }

        // 绘制路径
        function drawPath() {
            ctx.strokeStyle = '#2a2a4a';
            ctx.lineWidth = 50;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.stroke();

            ctx.strokeStyle = '#3a3a5a';
            ctx.lineWidth = 40;
            ctx.stroke();
        }

        // 绘制网格
        function drawGrid() {
            ctx.fillStyle = '#1a1a2e';

            for (let x = 0; x < canvas.width / gridSize; x++) {
                for (let y = 0; y < canvas.height / gridSize; y++) {
                    const centerX = x * gridSize + gridSize / 2;
                    const centerY = y * gridSize + gridSize / 2;

                    if (!isOnPath(centerX, centerY)) {
                        ctx.fillStyle = '#16213e';
                        ctx.fillRect(x * gridSize + 2, y * gridSize + 2, gridSize - 4, gridSize - 4);

                        ctx.strokeStyle = '#0f3460';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(x * gridSize + 2, y * gridSize + 2, gridSize - 4, gridSize - 4);
                    }
                }
            }
        }

        // 绘制防御塔
        function drawTowers() {
            for (const tower of towers) {
                // 底座
                ctx.fillStyle = '#1a1a2e';
                ctx.beginPath();
                ctx.arc(tower.x, tower.y, tower.size + 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = tower.color;
                ctx.lineWidth = 2;
                ctx.stroke();

                // 塔身
                ctx.fillStyle = tower.color;
                ctx.beginPath();
                ctx.arc(tower.x, tower.y, tower.size, 0, Math.PI * 2);
                ctx.fill();

                // 炮管/箭头
                ctx.save();
                ctx.translate(tower.x, tower.y);
                ctx.rotate(tower.angle);

                ctx.fillStyle = tower.type === 'arrow' ? '#a3e635' : '#fdba74';
                ctx.fillRect(0, -3, tower.size + 6, 6);

                ctx.restore();

                // 攻击范围指示
                if (tower.showRange) {
                    ctx.strokeStyle = tower.color + '40';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(tower.x, tower.y, tower.range, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
        }

        // 绘制敌人
        function drawEnemies() {
            for (const enemy of enemies) {
                // 身体
                ctx.fillStyle = enemy.color;
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.size, 0, Math.PI * 2);
                ctx.fill();

                // 眼睛
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(enemy.x - 4, enemy.y - 2, 3, 0, Math.PI * 2);
                ctx.arc(enemy.x + 4, enemy.y - 2, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(enemy.x - 4, enemy.y - 2, 1.5, 0, Math.PI * 2);
                ctx.arc(enemy.x + 4, enemy.y - 2, 1.5, 0, Math.PI * 2);
                ctx.fill();

                // 血条
                const barWidth = enemy.size * 2;
                const barHeight = 4;
                const barX = enemy.x - barWidth / 2;
                const barY = enemy.y - enemy.size - 8;

                ctx.fillStyle = '#333';
                ctx.fillRect(barX, barY, barWidth, barHeight);

                ctx.fillStyle = '#e94560';
                ctx.fillRect(barX, barY, barWidth * (enemy.hp / enemy.maxHp), barHeight);
            }
        }

        // 绘制子弹
        function drawProjectiles() {
            for (const p of projectiles) {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * 0.4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 绘制粒子
        function drawParticles() {
            for (const p of particles) {
                ctx.globalAlpha = p.life / 40;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        // 绘制起点终点
        function drawEndpoints() {
            // 起点
            ctx.fillStyle = '#8b5cf6';
            ctx.font = 'bold 14px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.fillText('兽人来袭', path[0].x + 60, path[0].y - 35);

            // 终点
            ctx.fillStyle = '#e94560';
            ctx.fillText('保护领地', path[path.length - 1].x - 50, path[path.length - 1].y - 35);

            ctx.fillStyle = '#e9456030';
            ctx.beginPath();
            ctx.arc(path[path.length - 1].x, path[path.length - 1].y, 30, 0, Math.PI * 2);
            ctx.fill();
        }

        // 游戏主循环
        function gameLoop() {
            ctx.fillStyle = '#0f0f1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawGrid();
            drawPath();
            drawEndpoints();
            drawTowers();
            drawEnemies();
            drawProjectiles();
            drawParticles();

            if (gameState.gameStarted && !gameState.gameOver) {
                moveEnemies();
                towerAttack();
                moveProjectiles();
                updateParticles();
                checkWaveComplete();
            }

            requestAnimationFrame(gameLoop);
        }

        // 点击事件
        canvas.addEventListener('click', (e) => {
            if (gameState.gameOver || !gameState.selectedTower) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const gridX = Math.floor(x / gridSize);
            const gridY = Math.floor(y / gridSize);

            if (buildTower(gridX, gridY, gameState.selectedTower)) {
                createParticles(
                    gridX * gridSize + gridSize / 2,
                    gridY * gridSize + gridSize / 2,
                    towerConfigs[gameState.selectedTower].color,
                    12
                );
            }
        });

        // 鼠标移动显示范围
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            for (const tower of towers) {
                tower.showRange = Math.abs(x - tower.x) < 30 && Math.abs(y - tower.y) < 30;
            }
        });

        // 防御塔选择
        document.querySelectorAll('.tower-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.classList.contains('disabled')) return;

                const type = btn.dataset.tower;

                if (gameState.selectedTower === type) {
                    gameState.selectedTower = null;
                    btn.classList.remove('selected');
                } else {
                    document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
                    gameState.selectedTower = type;
                    btn.classList.add('selected');
                }
            });
        });

        // 开始波次按钮
        document.getElementById('startWaveBtn').addEventListener('click', startWave);

        // 开始游戏
        document.getElementById('startGameBtn').addEventListener('click', () => {
            document.getElementById('startOverlay').classList.add('hidden');
            gameState.gameStarted = true;
            updateUI();
        });

        // 重新开始
        document.getElementById('restartBtn').addEventListener('click', () => {
            location.reload();
        });

        // 初始化
        updateUI();
        gameLoop();
    </script>
</body>
</html>
