<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商主图视频生成工具 v1.4.2 - 专业超清修复版</title>
    <style>
        :root {
            --primary: #1890ff;
            --primary-hover: #40a9ff;
            --success: #52c41a;
            --bg: #f5f7fa;
            --card: #ffffff;
            --border: #e1e4e8;
            --text-main: #2c3e50;
            --text-sub: #5e6d82;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card);
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 26px; color: var(--text-main); margin-bottom: 8px; }
        header p { color: var(--text-sub); font-size: 14px; }
        .version-tag { background: var(--primary); color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; vertical-align: middle; margin-left: 10px;}

        /* 分区标题 */
        .section-title { font-size: 18px; margin-bottom: 16px; border-left: 4px solid var(--primary); padding-left: 10px; font-weight: 600;}

        /* 上传区域 */
        .upload-section {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafafa;
            margin-bottom: 24px;
        }

        .upload-section:hover, .upload-section.drag-active {
            border-color: var(--primary);
            background: #f0f7ff;
        }

        .upload-icon { font-size: 40px; color: var(--primary); margin-bottom: 12px; display: block; }

        /* 预览/排序区域 */
        .thumb-list {
            display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px;
            min-height: 100px; padding: 10px; background: #fcfcfc; border-radius: 8px;
        }

        .thumb-item {
            width: 100px; height: 100px; position: relative; border-radius: 6px;
            overflow: hidden; border: 2px solid transparent; background: #eee; cursor: grab;
        }
        .thumb-item img { width: 100%; height: 100%; object-fit: contain; }
        .thumb-item .remove-btn {
            position: absolute; top: 4px; right: 4px; background: rgba(255, 68, 68, 0.8);
            color: white; border: none; width: 20px; height: 20px; border-radius: 50%;
            font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* 配置参数 */
        .config-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; padding: 20px; background: #f8f9fb; border-radius: 8px; margin-bottom: 30px;
        }

        .field { display: flex; flex-direction: column; gap: 8px; }
        .field label { font-size: 13px; font-weight: 600; color: var(--text-sub); }
        .field select, .field input {
            padding: 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; outline: none;
        }
        .field select:focus, .field input:focus { border-color: var(--primary); }

        .field-row { display: flex; gap: 12px; }

        /* 水印区域 */
        .watermark-section {
            display: flex; gap: 20px; flex-wrap: wrap;
            padding: 20px; background: #f8f9fb; border-radius: 8px; margin-bottom: 30px;
        }
        .wm-controls { flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 15px; }
        .wm-editor-wrapper {
            flex: 1; min-width: 300px; display: flex; justify-content: center; align-items: center;
            background: #eee; border-radius: 8px; overflow: hidden; position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        canvas#wmEditorCanvas {
            background-color: #fff; cursor: crosshair; display: block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn-small {
            padding: 8px 16px; background: white; border: 1px solid var(--border);
            border-radius: 4px; cursor: pointer; font-size: 13px; transition: 0.2s;
            text-align: center;
        }
        .btn-small:hover { border-color: var(--primary); color: var(--primary); }

        /* 动作按钮 */
        .actions { text-align: center; }
        .btn {
            padding: 12px 40px; font-size: 16px; font-weight: 600; border-radius: 6px;
            border: none; cursor: pointer; transition: 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); box-shadow: 0 4px 12px rgba(24,144,255,0.3); }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; }

        /* 进度与预览 */
        .result-section {
            margin-top: 30px; padding-top: 30px; border-top: 1px solid #eee;
            display: none; text-align: center;
        }
        .progress-container {
            width: 100%; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin: 20px 0;
        }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.1s linear; }
        video {
            width: 100%; max-width: 400px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin: 20px auto; display: block;
        }
        .download-link {
            display: inline-block; background: var(--success); color: white; text-decoration: none;
            padding: 12px 30px; border-radius: 6px; font-weight: 600; margin-top: 10px;
        }
        .download-link:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>电商主图视频生成工具 <span class="version-tag">v1.4.2</span></h1>
        <p>纯本地浏览器合成 | 12Mbps 超清 MP4 录制引擎 | 质感动效调控面板 | 场景自适应高级模糊</p>
    </header>

    <div class="section-title">1. 导入商品图片</div>
    <div class="upload-section" id="dropZone">
        <span class="upload-icon">📁</span>
        <p>点击或拖拽商品图片到此处 (支持多选，拖拽自动导入)</p>
    </div>
    <input type="file" id="fileInput" multiple accept="image/*" style="display:none">
    <div class="thumb-list" id="thumbList"></div>

    <div class="section-title">2. 视频与动效设置</div>
    <div class="config-grid">
        <div class="field">
            <label>视频比例</label>
            <select id="aspectRatio">
                <option value="800,800">1:1 (主图 800x800)</option>
                <option value="800,1066">3:4 (长图 800x1066)</option>
            </select>
        </div>
        <div class="field">
            <label>切换过渡效果</label>
            <select id="transitionType">
                <option value="slide">向左滑动 (经典)</option>
                <option value="fade">渐变切换 (平滑柔和)</option>
                <option value="blurSlide">拖拽模糊切换 (极客动感)</option>
            </select>
        </div>
        <div class="field">
            <label>单图停顿 (秒)</label>
            <input type="number" id="stayDuration" value="2" step="0.5" min="0.5">
        </div>
        <div class="field">
            <label>切换耗时 (秒)</label>
            <input type="number" id="transitionDuration" value="0.5" step="0.1" min="0.1">
        </div>
    </div>

    <div class="section-title">3. 动态自定义水印 (可选)</div>
    <div class="watermark-section">
        <div class="wm-controls">
            <div class="field">
                <label>导入品牌 Logo (透明 PNG 最佳)</label>
                <input type="file" id="wmInput" accept="image/*" style="display:none">
                <button class="btn-small" onclick="document.getElementById('wmInput').click()">选择水印图片</button>
            </div>
            <div class="field">
                <label>Logo 动态质感特效</label>
                <select id="wmEffect">
                    <option value="none">无动效 (静止固定)</option>
                    <option value="driftFade" selected>微动漂移 (高级渐入渐出)</option>
                    <option value="glassSweep">高级苹果风扫光 (Glassmorphism)</option>
                    <option value="fade">呼吸渐变 (匀速淡入淡出)</option>
                    <option value="rotate">中心旋转 (无限匀速)</option>
                </select>
            </div>
            <div class="field-row">
                <div class="field" style="flex:1;">
                    <label>动效持续时间 (秒)</label>
                    <input type="number" id="wmDuration" value="1.5" step="0.1" min="0.1">
                </div>
                <div class="field" style="flex:1;">
                    <label>动效循环间隔 (秒)</label>
                    <input type="number" id="wmInterval" value="1.0" step="0.1" min="0">
                </div>
            </div>
            <p style="font-size:12px; color:#888; margin-top: auto;">提示：在右侧预览框中可直接<strong style="color:var(--primary)">鼠标拖拽移动</strong>以及拖拽右下角蓝点进行<strong style="color:var(--primary)">等比例缩放</strong>。</p>
        </div>
        <div class="wm-editor-wrapper">
            <canvas id="wmEditorCanvas" width="300" height="300"></canvas>
        </div>
    </div>

    <div class="actions">
        <button id="generateBtn" class="btn btn-primary" disabled>开始合成视频</button>
    </div>

    <div class="result-section" id="resultSection">
        <div id="statusText" style="font-weight: 600;">正在初始化...</div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <video id="previewVideo" controls playsinline></video>
        <a id="downloadBtn" class="download-link" style="display:none" download="product_video_v1.4.2.mp4">下载超清 MP4 视频</a>
    </div>
</div>

<script>
    /**
     * JS 辅助函数：精确解析 CSS cubic-bezier曲线速度
     */
    function cubicBezier(t, p1x, p1y, p2x, p2y) {
        const cx = 3.0 * p1x;
        const bx = 3.0 * (p2x - p1x) - cx;
        const ax = 1.0 - cx - bx;
        const cy = 3.0 * p1y;
        const by = 3.0 * (p2y - p1y) - cy;
        const ay = 1.0 - cy - by;
        
        function sampleCurveX(t) { return ((ax * t + bx) * t + cx) * t; }
        function sampleCurveY(t) { return ((ay * t + by) * t + cy) * t; }
        function sampleCurveDerivativeX(t) { return (3.0 * ax * t + 2.0 * bx) * t + cx; }
        
        let x = t;
        for (let i = 0; i < 5; i++) {
            let currentX = sampleCurveX(x) - t;
            let dX = sampleCurveDerivativeX(x);
            if (Math.abs(currentX) < 1e-6) break;
            x = x - currentX / dX;
        }
        return sampleCurveY(x);
    }

    // --- 状态管理 ---
    let imagesData = []; 
    let wmState = {
        active: false,
        imgCanvas: null, 
        x: 50, y: 50, w: 100, h: 100,
        isDragging: false, isResizing: false,
        dragOffsetX: 0, dragOffsetY: 0
    };
    const EDITOR_WIDTH = 300; 

    // --- DOM 节点 ---
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const thumbList = document.getElementById('thumbList');
    const generateBtn = document.getElementById('generateBtn');
    const aspectRatioSelect = document.getElementById('aspectRatio');
    
    const wmEditorCanvas = document.getElementById('wmEditorCanvas');
    const wmCtx = wmEditorCanvas.getContext('2d');

    // --- 1. 拖拽与文件导入处理 ---
    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => handleFiles(e.target.files);

    dropZone.addEventListener('dragenter', (e) => { e.preventDefault(); dropZone.classList.add('drag-active'); });
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-active'); });
    dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('drag-active'); });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-active');
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            handleFiles(e.dataTransfer.files);
        }
    });

    async function handleFiles(files) {
        for (let file of files) {
            if (!file.type.startsWith('image/')) continue;
            const imgObj = await processImage(file);
            // 健壮性优化：只有成功解析的图片才进入数组，防止队列假死
            if (imgObj) {
                imagesData.push(imgObj);
            }
        }
        renderThumbs();
        updateEditorLayout();
        generateBtn.disabled = imagesData.length === 0;
        fileInput.value = ''; // 重置清空，方便重复导入同名文件
    }

    function processImage(file) {
        return new Promise((resolve) => {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                const offCanvas = document.createElement('canvas');
                const maxDim = 1200;
                let w = img.width, h = img.height;
                if (w > maxDim || h > maxDim) {
                    const ratio = Math.min(maxDim/w, maxDim/h);
                    w *= ratio; h *= ratio;
                }
                offCanvas.width = w; offCanvas.height = h;
                const ctx = offCanvas.getContext('2d');
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, w, h);
                URL.revokeObjectURL(url);
                resolve({ canvas: offCanvas, id: Math.random() });
            };
            // 核心修复：添加错误捕获，坏图/不支持的格式会自动释放资源并返回null，不卡死进程
            img.onerror = () => {
                URL.revokeObjectURL(url);
                resolve(null);
            };
            img.src = url;
        });
    }

    function renderThumbs() {
        thumbList.innerHTML = '';
        imagesData.forEach((data, index) => {
            const div = document.createElement('div');
            div.className = 'thumb-item';
            div.draggable = true;
            
            const img = document.createElement('img');
            img.src = data.canvas.toDataURL('image/jpeg', 0.6); 
            
            const btn = document.createElement('button');
            btn.className = 'remove-btn';
            btn.innerHTML = '×';
            btn.onclick = (e) => {
                e.stopPropagation();
                imagesData.splice(index, 1);
                renderThumbs();
                updateEditorLayout();
                generateBtn.disabled = imagesData.length === 0;
            };

            div.ondragstart = (e) => e.dataTransfer.setData('text/plain', index);
            div.ondrop = (e) => {
                e.preventDefault();
                const fromIdx = e.dataTransfer.getData('text/plain');
                if(fromIdx === '') return;
                const item = imagesData.splice(fromIdx, 1)[0];
                imagesData.splice(index, 0, item);
                renderThumbs();
                updateEditorLayout();
            };
            div.ondragover = (e) => e.preventDefault();

            div.appendChild(img);
            div.appendChild(btn);
            thumbList.appendChild(div);
        });
    }

    // --- 2. 水印系统与画布交互 ---
    document.getElementById('wmInput').onchange = async (e) => {
        if (!e.target.files.length) return;
        const file = e.target.files[0];
        const obj = await processImage(file);
        if (!obj) {
            alert("水印图片加载失败，请换一张试试");
            return;
        }
        wmState.imgCanvas = obj.canvas;
        wmState.active = true;
        
        const aspect = obj.canvas.width / obj.canvas.height;
        wmState.w = 100;
        wmState.h = 100 / aspect;
        wmState.x = (wmEditorCanvas.width - wmState.w) / 2;
        wmState.y = (wmEditorCanvas.height - wmState.h) / 2;
        
        updateEditorLayout();
        e.target.value = '';
    };

    aspectRatioSelect.onchange = updateEditorLayout;

    function updateEditorLayout() {
        const [w, h] = aspectRatioSelect.value.split(',').map(Number);
        const ratio = h / w;
        wmEditorCanvas.width = EDITOR_WIDTH;
        wmEditorCanvas.height = EDITOR_WIDTH * ratio;
        renderEditor();
    }

    function renderEditor() {
        wmCtx.clearRect(0, 0, wmEditorCanvas.width, wmEditorCanvas.height);
        wmCtx.imageSmoothingEnabled = true;
        wmCtx.imageSmoothingQuality = 'high';
        
        if (imagesData.length > 0) {
            drawContainWithBlurBg(wmCtx, imagesData[0].canvas, wmEditorCanvas.width, wmEditorCanvas.height, 0, 1, 'none');
        } else {
            wmCtx.fillStyle = '#ebedf0';
            wmCtx.fillRect(0, 0, wmEditorCanvas.width, wmEditorCanvas.height);
            wmCtx.fillStyle = '#999';
            wmCtx.font = '13px sans-serif';
            wmCtx.textAlign = 'center';
            wmCtx.fillText('请先导入商品图片以预览位置', wmEditorCanvas.width/2, wmEditorCanvas.height/2);
        }

        if (wmState.active && wmState.imgCanvas) {
            wmCtx.drawImage(wmState.imgCanvas, wmState.x, wmState.y, wmState.w, wmState.h);
            
            wmCtx.strokeStyle = 'var(--primary)';
            wmCtx.setLineDash([4, 4]);
            wmCtx.strokeRect(wmState.x, wmState.y, wmState.w, wmState.h);
            wmCtx.setLineDash([]);
            
            wmCtx.fillStyle = 'var(--primary)';
            wmCtx.beginPath();
            wmCtx.arc(wmState.x + wmState.w, wmState.y + wmState.h, 6, 0, Math.PI * 2);
            wmCtx.fill();
        }
    }

    function getMousePos(canvas, evt) {
        const rect = canvas.getBoundingClientRect();
        return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
    }

    wmEditorCanvas.onmousedown = (e) => {
        if (!wmState.active) return;
        const pos = getMousePos(wmEditorCanvas, e);
        
        const handleX = wmState.x + wmState.w;
        const handleY = wmState.y + wmState.h;
        if (Math.hypot(pos.x - handleX, pos.y - handleY) <= 12) {
            wmState.isResizing = true;
            return;
        }
        
        if (pos.x >= wmState.x && pos.x <= wmState.x + wmState.w && pos.y >= wmState.y && pos.y <= wmState.y + wmState.h) {
            wmState.isDragging = true;
            wmState.dragOffsetX = pos.x - wmState.x;
            wmState.dragOffsetY = pos.y - wmState.y;
        }
    };

    wmEditorCanvas.onmousemove = (e) => {
        if (!wmState.active) return;
        const pos = getMousePos(wmEditorCanvas, e);
        
        if (wmState.isDragging) {
            wmState.x = pos.x - wmState.dragOffsetX;
            wmState.y = pos.y - wmState.dragOffsetY;
            renderEditor();
        } else if (wmState.isResizing) {
            const aspect = wmState.w / wmState.h;
            let newW = pos.x - wmState.x;
            if (newW < 20) newW = 20; 
            wmState.w = newW;
            wmState.h = newW / aspect;
            renderEditor();
        }
    };

    window.addEventListener('mouseup', () => { wmState.isDragging = false; wmState.isResizing = false; });

    // --- 3. 核心绘制函数 ---
    function drawContainWithBlurBg(ctx, imgCanvas, tw, th, dx, alpha, extraBlur) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        
        const coverScale = Math.max(tw / imgCanvas.width, th / imgCanvas.height);
        const cw = imgCanvas.width * coverScale;
        const ch = imgCanvas.height * coverScale;
        const cx = dx + (tw - cw) / 2;
        const cy = (th - ch) / 2;
        
        ctx.save();
        ctx.filter = 'blur(25px) brightness(0.8)';
        ctx.drawImage(imgCanvas, cx, cy, cw, ch);
        ctx.restore();

        const containScale = Math.min(tw / imgCanvas.width, th / imgCanvas.height);
        const iw = imgCanvas.width * containScale;
        const ih = imgCanvas.height * containScale;
        const ix = dx + (tw - iw) / 2;
        const iy = (th - ih) / 2;
        
        if (extraBlur && extraBlur !== 'none') {
            ctx.filter = extraBlur;
        }
        
        ctx.shadowColor = 'rgba(0,0,0,0.4)';
        ctx.shadowBlur = 15;
        ctx.drawImage(imgCanvas, ix, iy, iw, ih);
        
        ctx.restore();
    }

    // --- 4. 合成引擎 ---
    generateBtn.onclick = async () => {
        const [targetW, targetH] = document.getElementById('aspectRatio').value.split(',').map(Number);
        const transType = document.getElementById('transitionType').value;
        const wmEffectType = document.getElementById('wmEffect').value;
        const stayTime = parseFloat(document.getElementById('stayDuration').value);
        const transTime = parseFloat(document.getElementById('transitionDuration').value);

        const animDuration = parseFloat(document.getElementById('wmDuration').value) || 1.5;
        const animInterval = parseFloat(document.getElementById('wmInterval').value) || 1.0;
        const totalAnimCycle = animDuration + animInterval;
        
        const resultSection = document.getElementById('resultSection');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const previewVideo = document.getElementById('previewVideo');
        const downloadBtn = document.getElementById('downloadBtn');

        resultSection.style.display = 'block';
        downloadBtn.style.display = 'none';
        generateBtn.disabled = true;

        const mainCanvas = document.createElement('canvas');
        mainCanvas.width = targetW;
        mainCanvas.height = targetH;
        const ctx = mainCanvas.getContext('2d', { alpha: false });
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        const stream = mainCanvas.captureStream(30); 
        
        // 12Mbps 超清画质配置注入
        let options = { videoBitsPerSecond: 12000000 }; 
        
        const mp4MimeTypes = [
            'video/mp4;codecs=h264',
            'video/mp4;codecs=avc1.42E01E',
            'video/mp4',
            'video/quicktime' 
        ];
        let matchedMime = mp4MimeTypes.find(type => MediaRecorder.isTypeSupported(type));
        
        if (matchedMime) {
            options.mimeType = matchedMime;
        } else {
            options.mimeType = MediaRecorder.isTypeSupported('video/webm; codecs=vp9') ? 'video/webm; codecs=vp9' : 'video/webm';
        }
        
        const recorder = new MediaRecorder(stream, options);
        const chunks = [];
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);
            previewVideo.src = url;
            downloadBtn.href = url;
            downloadBtn.download = `product_video_v1.4.2.mp4`;
            downloadBtn.style.display = 'inline-block';
            generateBtn.disabled = false;
            statusText.innerText = "✅ 超清视频合成完成！";
            mainCanvas.width = 0; mainCanvas.height = 0;
            stream.getTracks().forEach(t => t.stop());
        };

        recorder.start();

        const totalSteps = imagesData.length;
        const totalDuration = totalSteps * stayTime + (totalSteps - 1) * transTime;
        let startTime = null;

        let scaleX = targetW / wmEditorCanvas.width;
        let scaleY = targetH / wmEditorCanvas.height;
        let finalWmX = wmState.x * scaleX;
        let finalWmY = wmState.y * scaleY;
        let finalWmW = wmState.w * scaleX;
        let finalWmH = wmState.h * scaleY;
        let wmCenterX = finalWmX + finalWmW / 2;
        let wmCenterY = finalWmY + finalWmH / 2;

        function drawFrame(now) {
            if (!startTime) startTime = now;
            const elapsed = (now - startTime) / 1000;
            const progress = Math.min(elapsed / totalDuration, 1);
            
            progressBar.style.width = (progress * 100) + '%';
            statusText.innerText = `正在超清渲染中... ${(progress * 100).toFixed(0)}%`;

            if (elapsed >= totalDuration) {
                recorder.stop();
                return;
            }

            const cycle = stayTime + transTime;
            const currentIndex = Math.floor(elapsed / cycle);
            const timeInCycle = elapsed % cycle;

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, targetW, targetH);

            if (timeInCycle <= stayTime || currentIndex === totalSteps - 1) {
                drawContainWithBlurBg(ctx, imagesData[currentIndex].canvas, targetW, targetH, 0, 1, 'none');
            } else {
                const transProgress = (timeInCycle - stayTime) / transTime;
                const t = transProgress < 0.5 ? 2 * transProgress * transProgress : -1 + (4 - 2 * transProgress) * transProgress;
                
                if (transType === 'slide') {
                    drawContainWithBlurBg(ctx, imagesData[currentIndex].canvas, targetW, targetH, (t - 1) * targetW, 1, 'none');
                    drawContainWithBlurBg(ctx, imagesData[currentIndex + 1].canvas, targetW, targetH, t * targetW, 1, 'none');
                } else if (transType === 'fade') {
                    drawContainWithBlurBg(ctx, imagesData[currentIndex].canvas, targetW, targetH, 0, 1 - t, 'none');
                    drawContainWithBlurBg(ctx, imagesData[currentIndex + 1].canvas, targetW, targetH, 0, t, 'none');
                } else if (transType === 'blurSlide') {
                    let blur1 = Math.max(0, (1 - t) * 10);
                    let blur2 = Math.max(0, t * 10);
                    drawContainWithBlurBg(ctx, imagesData[currentIndex].canvas, targetW, targetH, (t - 1) * targetW, 1, 'blur(' + blur1.toFixed(1) + 'px)');
                    drawContainWithBlurBg(ctx, imagesData[currentIndex + 1].canvas, targetW, targetH, t * targetW, 1, 'blur(' + blur2.toFixed(1) + 'px)');
                } else {
                    drawContainWithBlurBg(ctx, imagesData[currentIndex].canvas, targetW, targetH, (t - 1) * targetW, 1, 'none');
                    drawContainWithBlurBg(ctx, imagesData[currentIndex + 1].canvas, targetW, targetH, t * targetW, 1, 'none');
                }
            }

            // Draw watermark
            if (wmState.active && wmState.imgCanvas) {
                ctx.save();
                if (wmEffectType === 'driftFade') {
                    let cyclePos = (elapsed % totalAnimCycle) / totalAnimCycle;
                    let driftAlpha = cyclePos < animDuration / totalAnimCycle ? Math.sin((cyclePos * totalAnimCycle / animDuration) * Math.PI) : 0;
                    let driftX = Math.sin(elapsed * 2) * 20;
                    let driftY = Math.cos(elapsed * 2) * 10;
                    ctx.globalAlpha = driftAlpha;
                    ctx.drawImage(wmState.imgCanvas, finalWmX + driftX, finalWmY + driftY, finalWmW, finalWmH);
                } else if (wmEffectType === 'glassSweep') {
                    let sweepPos = (elapsed % 3) / 3;
                    ctx.globalAlpha = 0.9;
                    ctx.drawImage(wmState.imgCanvas, finalWmX, finalWmY, finalWmW, finalWmH);
                    ctx.globalAlpha = 0.3;
                    let grad = ctx.createLinearGradient(sweepPos * targetW - 60, 0, sweepPos * targetW + 60, targetH);
                    grad.addColorStop(0, 'rgba(255,255,255,0)');
                    grad.addColorStop(0.5, 'rgba(255,255,255,0.6)');
                    grad.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, targetW, targetH);
                } else if (wmEffectType === 'fade') {
                    let alpha = 0.5 + 0.5 * Math.sin(elapsed * 3);
                    ctx.globalAlpha = alpha;
                    ctx.drawImage(wmState.imgCanvas, finalWmX, finalWmY, finalWmW, finalWmH);
                } else if (wmEffectType === 'rotate') {
                    ctx.translate(wmCenterX, wmCenterY);
                    ctx.rotate(elapsed);
                    ctx.drawImage(wmState.imgCanvas, -finalWmW / 2, -finalWmH / 2, finalWmW, finalWmH);
                } else {
                    ctx.globalAlpha = 0.8;
                    ctx.drawImage(wmState.imgCanvas, finalWmX, finalWmY, finalWmW, finalWmH);
                }
                ctx.restore();
            }

            requestAnimationFrame(drawFrame);
        }

        requestAnimationFrame(drawFrame);
    };
</script>
</body>
</html>
