    <script>
        const Storage = {
            data: null,
            init() {
                try {
                    const saved = localStorage.getItem('smart_learning_data');
                    if (saved) {
                        this.data = JSON.parse(saved);
                    } else {
                        this.data = this.getDefaultData();
                        this.save();
                    }
                } catch (e) {
                    this.data = this.getDefaultData();
                }
                this.updateUI();
            },
            getDefaultData() {
                return {
                    user: { name: '同学', level: 1, coins: 0, exp: 0, badges: [], streak: 1, lastLogin: new Date().toLocaleDateString() },
                    learningRecords: [],
                    dailyStats: {},
                    combo: 0,

                    this.data.user.exp -= needed;
                    this.data.user.level++;
                }

                this.data.dailyStats[today].total += value;
                this.save();

                    };
                }

                                </div>
                            </div>
                            <div class="bg-green-50 rounded-xl p-6">
                                <div class="text-center">
                                    <i class="fas fa-calculator text-4xl text-green-600 mb-4"></i>
                                    <h3 class="font-bold text-gray-800 mb-2">数学能力</h3>
                                    <p class="text-3xl font-bold text-green-600">${this.calculateScore('math')}</p>
                                    <div class="mt-4">${this.getLevel('math')}</div>
                                </div>
                            </div>
                            <div class="bg-red-50 rounded-xl p-6">
                                <div class="text-center">
                                    <i class="fas fa-book-open text-4xl text-red-600 mb-4"></i>
                                    <h3 class="font-bold text-gray-800 mb-2">语文能力</h3>
                                    <p class="text-3xl font-bold text-red-600">${this.calculateScore('chinese')}</p>
                                    <div class="mt-4">${this.getLevel('chinese')}</div>
                                </div>
                            </div>
                        </div>
                        <div class="bg-gray-50 rounded-xl p-6">
                            <h3 class="font-bold text-gray-800 mb-4">学习建议</h3>
                            <ul class="space-y-3">
                                ${this.getSuggestions()}
                            </ul>
                        </div>
                    </div>
                `;
            },
            calculateScore(subject) {
                const stats = Storage.data.dailyStats;
                const days = Object.keys(stats).length || 1;
                const today = new Date().toLocaleDateString();
                const total = (stats[today] && stats[today][subject]) || 0;
                return Math.min(Math.round(total / days * 10), 100);
            },
            getLevel(subject) {
                const score = this.calculateScore(subject);
                if (score >= 80) return '优秀';
                if (score >= 60) return '良好';
                if (score >= 40) return '一般';
                return '需加强';
            },
            getSuggestions() {
                const suggestions = [];
                const engScore = this.calculateScore('english');
                const mathScore = this.calculateScore('math');
                const chiScore = this.calculateScore('chinese');
                
                if (engScore < 60) suggestions.push('<li class="flex items-start"><i class="fas fa-lightbulb text-yellow-500 mr-2 mt-1"></i>英语：建议每天学习20分钟，重点加强单词记忆和语法练习</li>');
                if (mathScore < 60) suggestions.push('<li class="flex items-start"><i class="fas fa-lightbulb text-yellow-500 mr-2 mt-1"></i>数学：建议多做练习题，理解概念后再进行拓展练习</li>');
                if (chiScore < 60) suggestions.push('<li class="flex items-start"><i class="fas fa-lightbulb text-yellow-500 mr-2 mt-1"></i>语文：建议每天背诵一首古诗，阅读一篇短文</li>');
                if (engScore >= 80) suggestions.push('<li class="flex items-start"><i class="fas fa-check-circle text-green-500 mr-2 mt-1"></i>英语：表现优秀，继续保持！可以尝试更难的口语练习</li>');
                if (mathScore >= 80) suggestions.push('<li class="flex items-start"><i class="fas fa-check-circle text-green-500 mr-2 mt-1"></i>数学：表现优秀，继续保持！可以尝试挑战更高难度的题目</li>');
                if (chiScore >= 80) suggestions.push('<li class="flex items-start"><i class="fas fa-check-circle text-green-500 mr-2 mt-1"></i>语文：表现优秀，继续保持！可以尝试创作自己的文章</li>');
                
                if (suggestions.length === 0) suggestions.push('<li class="flex items-start"><i class="fas fa-star text-yellow-500 mr-2 mt-1"></i>所有科目表现良好，继续保持！</li>');
                
                return suggestions.join('');
            }
        };

        const GoalsModule = {
            render() {
                const goals = Storage.getGoals();
                return `
                    <div class="bg-white rounded-xl shadow-lg p-6">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-bold text-gray-800 flex items-center"><i class="fas fa-target mr-2 text-blue-600"></i>学习目标</h2>
                            <button onclick="GoalsModule.showAddGoal()" class="btn-primary">
                                <i class="fas fa-plus mr-2"></i>添加目标
                            </button>
                        </div>
                        ${goals.length === 0 ? this.renderEmpty() : this.renderGoals(goals)}
                    </div>
                `;
            },
            renderEmpty() {
                return `
                    <div class="text-center py-12">
                        <i class="fas fa-target text-6xl text-gray-300 mb-4"></i>
                        <p class="text-gray-500">还没有学习目标</p>
                        <p class="text-gray-400 text-sm">点击上方按钮添加你的第一个学习目标</p>
                    </div>
                `;
            },
            renderGoals(goals) {
                return `
                    <div class="space-y-4">
                        ${goals.map(goal => `
                            <div class="border border-gray-200 rounded-xl p-4">
                                <div class="flex justify-between items-start mb-3">
                                    <div>
                                        <h3 class="font-bold text-gray-800">${goal.title}</h3>
                                        <p class="text-sm text-gray-500">目标：${goal.target} ${goal.unit}</p>
                                    </div>
                                    <span class="${goal.completed ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'} badge">${goal.completed ? '已完成' : '进行中'}</span>
                                </div>
                                <div class="h-3 bg-gray-200 rounded-full mb-3">
                                    <div class="${goal.completed ? 'bg-green-500' : 'bg-blue-500'} h-3 rounded-full" style="width: ${(goal.progress/goal.target)*100}%"></div>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-sm text-gray-600">已完成：${goal.progress}/${goal.target}</span>
                                    <button onclick="GoalsModule.updateProgress(${goal.id}, 1)" class="btn-secondary btn-sm">+1</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            },
            showAddGoal() {
                document.getElementById('page-content').innerHTML = `
                    <div class="bg-white rounded-xl shadow-lg p-6">
                        <h2 class="text-xl font-bold text-gray-800 mb-6">添加学习目标</h2>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">目标名称</label>
                                <input type="text" id="goal-title" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" placeholder="例如：背诵100个单词">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">目标数量</label>
                                    <input type="number" id="goal-target" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" placeholder="100">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">单位</label>
                                    <input type="text" id="goal-unit" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" placeholder="个">
                                </div>
                            </div>
                            <div class="flex gap-4">
                                <button onclick="GoalsModule.saveGoal()" class="btn-primary flex-1">保存目标</button>
                                <button onclick="Router.navigate('goals')" class="btn-secondary flex-1">取消</button>
                            </div>
                        </div>
                    </div>
                `;
            },
            saveGoal() {
                const title = document.getElementById('goal-title').value;
                const target = parseInt(document.getElementById('goal-target').value);
                const unit = document.getElementById('goal-unit').value;
                
                if (title && target && unit) {
                    Storage.addGoal({
                        id: Date.now(),
                        title,
                        target,
                        unit,
                        progress: 0,
                        completed: false
                    });
                    Router.navigate('goals');
                }
            },
            updateProgress(id, amount) {
                const goals = Storage.getGoals();
                const goal = goals.find(g => g.id === id);
                if (goal && !goal.completed) {
                    Storage.updateGoal(id, goal.progress + amount);
                    Router.navigate('goals');
                }
            }
        };

        const RecordsModule = {
            render() {
                return `
                    <div class="bg-white rounded-xl shadow-lg p-6">
                        <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center"><i class="fas fa-chart-bar mr-2 text-blue-600"></i>学习记录</h2>
                        <div class="grid md:grid-cols-3 gap-6 mb-6">
                            <div class="bg-blue-50 rounded-xl p-6">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="text-sm text-gray-500">总学习天数</p>
                                        <p class="text-3xl font-bold text-blue-600 mt-2">${Object.keys(Storage.data.dailyStats).length || 0}</p>
                                    </div>
                                    <i class="fas fa-calendar text-4xl text-blue-300"></i>
                                </div>
                            </div>
                            <div class="bg-green-50 rounded-xl p-6">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="text-sm text-gray-500">总经验值</p>
                                        <p class="text-3xl font-bold text-green-600 mt-2">${Storage.data.user.exp}</p>
                                    </div>
                                    <i class="fas fa-star text-4xl text-green-300"></i>
                                </div>
                            </div>
                            <div class="bg-orange-50 rounded-xl p-6">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="text-sm text-gray-500">总金币数</p>
                                        <p class="text-3xl font-bold text-orange-600 mt-2">${Storage.data.user.coins}</p>
                                    </div>
                                    <i class="fas fa-coins text-4xl text-orange-300"></i>
                                </div>
                            </div>
                        </div>
                        <div class="bg-gray-50 rounded-xl p-6">
                            <h3 class="font-bold text-gray-800 mb-4">近期学习记录</h3>
                            ${this.renderRecentRecords()}
                        </div>
                    </div>
                `;
            },
            renderRecentRecords() {
                const stats = Storage.data.dailyStats;
                const keys = Object.keys(stats).sort().reverse().slice(0, 7);
                
                if (keys.length === 0) {
                    return '<p class="text-gray-500 text-center py-4">暂无学习记录</p>';
                }
                
                return `
                    <div class="space-y-3">
                        ${keys.map(date => `
                            <div class="flex justify-between items-center bg-white rounded-lg p-4">
                                <div>
                                    <span class="font-medium text-gray-800">${date}</span>
                                </div>
                                <div class="flex gap-4">
                                    <span class="text-blue-600">英语 ${stats[date].english || 0}分钟</span>
                                    <span class="text-green-600">数学 ${stats[date].math || 0}分钟</span>
                                    <span class="text-red-600">语文 ${stats[date].chinese || 0}分钟</span>
                                </div>
                                <span class="font-bold text-gray-800">总计 ${stats[date].total || 0}分钟</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        };

        const CreateModule = {
            render() {
                return `
                    <div class="bg-white rounded-xl shadow-lg p-6">
                        <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center"><i class="fas fa-plus-circle mr-2 text-blue-600"></i>创建内容</h2>
                        <div class="grid md:grid-cols-3 gap-6">
                            <button onclick="CreateModule.createWord()" class="bg-gradient-to-br from-blue-50 to-blue-100 rounded-xl p-6 card-hover text-left">
                                <div class="w-12 h-12 bg-blue-500 rounded-lg flex items-center justify-center mb-4">
                                    <i class="fas fa-plus text-white text-xl"></i>
                                </div>
                                <h3 class="font-bold text-gray-800 text-lg">添加单词</h3>
                                <p class="text-sm text-gray-500 mt-2">创建自己的单词卡片</p>
                            </button>
                            <button onclick="CreateModule.createGrammar()" class="bg-gradient-to-br from-green-50 to-green-100 rounded-xl p-6 card-hover text-left">
                                <div class="w-12 h-12 bg-green-500 rounded-lg flex items-center justify-center mb-4">
                                    <i class="fas fa-plus text-white text-xl"></i>
                                </div>
                                <h3 class="font-bold text-gray-800 text-lg">添加语法</h3>
                                <p class="text-sm text-gray-500 mt-2">创建语法知识点</p>
                            </button>
                            <button onclick="CreateModule.createPoem()" class="bg-gradient-to-br from-red-50 to-red-100 rounded-xl p-6 card-hover text-left">
                                <div class="w-12 h-12 bg-red-500 rounded-lg flex items-center justify-center mb-4">
                                    <i class="fas fa-plus text-white text-xl"></i>
                                </div>
                                <h3 class="font-bold text-gray-800 text-lg">添加诗词</h3>
                                <p class="text-sm text-gray-500 mt-2">创建诗词学习内容</p>
                            </button>
                        </div>
                        <div class="mt-6 bg-gray-50 rounded-xl p-6">
                            <h3 class="font-bold text-gray-800 mb-4">自定义内容列表</h3>
                            ${this.renderCustomContent()}
                        </div>
                    </div>
                `;
            },
            createWord() {
                document.getElementById('page-content').innerHTML = `
                    <div class="bg-white rounded-xl shadow-lg p-6">
                        <h2 class="text-xl font-bold text-gray-800 mb-6">添加单词</h2>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">英文单词</label>
                                <input type="text" id="new-word" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" placeholder="例如：apple">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">中文释义</label>
                                <input type="text" id="new-meaning" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" placeholder="例如：苹果">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">例句</label>
                                <input type="text" id="new-example" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" placeholder="例如：I like apples.">
                            </div>
                            <div class="flex gap-4">
                                <button onclick="CreateModule.saveWord()" class="btn-primary flex-1">保存单词</button>
                                <button onclick="Router.navigate('create')" class="btn-secondary flex-1">取消</button>
                            </div>
                        </div>
                    </div>
                `;
            },
            saveWord() {
                const word = document.getElementById('new-word').value;
                const meaning = document.getElementById('new-meaning').value;
                const example = document.getElementById('new-example').value;
                
                if (word && meaning) {
                    Storage.addCustomContent({
                        type: 'word',
                        word,
                        meaning,
                        example: example || ''
                    });
                    Router.navigate('create');
                }
            },
            createGrammar() {
                document.getElementById('page-content').innerHTML = `
                    <div class="bg-white rounded-xl shadow-lg p-6">
                        <h2 class="text-xl font-bold text-gray-800 mb-6">添加语法</h2>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">语法名称</label>
                                <input type="text" id="new-grammar-title" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" placeholder="例如：一般过去时">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">语法规则</label>
                                <textarea id="new-grammar-rules" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" rows="3" placeholder="输入语法规则，每行一条"></textarea>
                            </div>
                            <div class="flex gap-4">
                                <button onclick="CreateModule.saveGrammar()" class="btn-primary flex-1">保存语法</button>
                                <button onclick="Router.navigate('create')" class="btn-secondary flex-1">取消</button>
                            </div>
                        </div>
                    </div>
                `;
            },
            saveGrammar() {
                const title = document.getElementById('new-grammar-title').value;
                const rules = document.getElementById('new-grammar-rules').value.split('\n').filter(r => r.trim());
                
                if (title && rules.length > 0) {
                    Storage.addCustomContent({
                        type: 'grammar',
                        title,
                        rules
                    });
                    Router.navigate('create');
                }
            },
            createPoem() {
                document.getElementById('page-content').innerHTML = `
                    <div class="bg-white rounded-xl shadow-lg p-6">
                        <h2 class="text-xl font-bold text-gray-800 mb-6">添加诗词</h2>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">诗词标题</label>
                                <input type="text" id="new-poem-title" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" placeholder="例如：静夜思">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">作者</label>
                                    <input type="text" id="new-poem-author" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" placeholder="例如：李白">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">朝代</label>
                                    <input type="text" id="new-poem-dynasty" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" placeholder="例如：唐">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">诗词内容</label>
                                <textarea id="new-poem-content" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" rows="4" placeholder="每行一句诗"></textarea>
                            </div>
                            <div class="flex gap-4">
                                <button onclick="CreateModule.savePoem()" class="btn-primary flex-1">保存诗词</button>
                                <button onclick="Router.navigate('create')" class="btn-secondary flex-1">取消</button>
                            </div>
                        </div>
                    </div>
                `;
            },
            savePoem() {
                const title = document.getElementById('new-poem-title').value;
                const author = document.getElementById('new-poem-author').value;
                const dynasty = document.getElementById('new-poem-dynasty').value;
                const content = document.getElementById('new-poem-content').value.split('\n').filter(c => c.trim());
                
                if (title && author && content.length > 0) {
                    Storage.addCustomContent({
                        type: 'poem',
                        title,
                        author,
                        dynasty,
                        content
                    });
                    Router.navigate('create');
                }
            },
            renderCustomContent() {
                const content = Storage.getCustomContent();
                
                if (content.length === 0) {
                    return '<p class="text-gray-500 text-center py-4">暂无自定义内容</p>';
                }
                
                return `
                    <div class="grid md:grid-cols-2 gap-4">
                        ${content.map((item, i) => `
                            <div class="bg-white rounded-lg p-4 border border-gray-200">
                                <div class="flex justify-between items-start mb-2">
                                    <span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded">${item.type === 'word' ? '单词' : item.type === 'grammar' ? '语法' : '诗词'}</span>
                                    <button onclick="CreateModule.deleteContent(${i})" class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button>
                                </div>
                                <h4 class="font-bold text-gray-800">${item.word || item.title}</h4>
                                ${item.meaning ? `<p class="text-sm text-gray-500">${item.meaning}</p>` : ''}
                                ${item.author ? `<p class="text-sm text-gray-500">【${item.dynasty}】${item.author}</p>` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
            },
            deleteContent(index) {
                Storage.data.customContent.splice(index, 1);
                Storage.save();
                Router.navigate('create');
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            Storage.init();
            Router.register('home', () => HomeModule.render());
            Router.register('english', () => EnglishModule.render());
            Router.register('math', () => MathModule.render());
            Router.register('chinese', () => ChineseModule.render());
            Router.register('diagnosis', () => DiagnosisModule.render());
            Router.register('goals', () => GoalsModule.render());
            Router.register('records', () => RecordsModule.render());
            Router.register('create', () => CreateModule.render());
            Router.render();
            Router.updateNav();
        });
    </script>
</body>
</html>
