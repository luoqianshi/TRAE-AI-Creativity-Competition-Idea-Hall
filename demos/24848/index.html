  openModal(html,(mask,close)=>{
    $$('.close,[data-c]',mask).forEach(b=>{b.onclick=()=>{stopLiveTick();aiTrading=false;updateModePill();close();}});
    // 模式切换
    $$('[data-mode]',mask).forEach(b=>{
      b.onclick=()=>{
        if(b.dataset.mode==='real'){close();startAiTrade();}
        else{Store.state.mode='simulated';stopLiveTick();aiTrading=false;updateModePill();Toast.show('info','已切换','当前为模拟回放模式。');close();}
      };
    });
    // ★ 选择券商 → 显示登录表单
    let selectedBrokerId=null;
    $$('[data-broker-login]',mask).forEach(btn=>{
      btn.onclick=()=>{
        const id=btn.dataset.brokerLogin;
        const b=BROKERS.find(x=>x.id===id);
        if(!b)return;
        selectedBrokerId=id;
        $('#loginLogo',mask).textContent=b.logo;
        $('#loginBrokerName',mask).textContent=b.name;
        $('#loginProtocol',mask).textContent=b.protocol+' · '+b.desc;
        $('#loginFormArea',mask).style.display='block';
        $('#tradingArea',mask).style.display='none';
        // 高亮选中的卡片
        $$('.broker-card',mask).forEach(c=>c.classList.remove('real'));
        btn.closest('.broker-card').classList.add('real');
        // 如果已有 API 实例且已认证，直接跳到交易区
        const existingApi=BrokerInstances[id];
        if(existingApi&&existingApi.authenticated){
          showTradingArea(mask,existingApi,b);
        }
      };
    });
    // ★ 执行登录
    let loginTimer=null;
    $('#btnDoLogin',mask).onclick=async()=>{
      if(!selectedBrokerId){Toast.show('warn','请先选择券商','点击上方券商卡片选择要连接的券商');return;}
      const account=$('#loginAccount',mask).value.trim();
      const pwd=$('#loginPassword',mask).value;
      const commPwd=$('#loginCommPwd',mask).value;
      const extra=$('#loginExtra',mask).value.trim();
      if(!account||!pwd){Toast.show('warn','信息不完整','资金账号和交易密码不能为空');return;}
      const b=BROKERS.find(x=>x.id===selectedBrokerId);
      const logEl=$('#loginLog',mask);
      const statusPill=$('#loginStatusPill',mask);
      const doLoginBtn=$('#btnDoLogin',mask);
      const disconnectBtn=$('#btnDisconnect',mask);
      logEl.innerHTML='';
      const addLog=(msg,color)=>{const d=document.createElement('div');d.style.color=color||'var(--txt-sub)';d.textContent=msg;logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;};
      doLoginBtn.disabled=true;doLoginBtn.textContent='⏳ 正在连接…';
      addLog(`[${new Date().toLocaleTimeString()}] 创建 ${b.apiType} 实例…`,'var(--blue-2)');
      // 创建 API 实例
      const api=new BrokerAPI(b);
      api.onLog=addLog;
      api.onError=(e)=>addLog('[ERROR] '+e,'var(--red)');
      try{
        addLog(`[${new Date().toLocaleTimeString()}] 连接前置 ${b.tradeFront||b.wsUrl}`,'');
        await api.connect();
        statusPill.className='status-pill sim';statusPill.innerHTML='<span class="dot pulse"></span>已连接';
        addLog(`[${new Date().toLocaleTimeString()}] ✓ 前置连接成功，开始认证…`,'var(--green)');
        doLoginBtn.textContent='⏳ 认证中…';
        const sessId=await api.login(account,pwd,commPwd,{extra});
        // 存储实例
        BrokerInstances[selectedBrokerId]=api;
        Store.state.brokers[selectedBrokerId]={...b,isReal:true,status:'已认证',ver:b.apiType,connectedAt:Date.now(),accountId:account};
        Store.state.activeBroker=selectedBrokerId;
        statusPill.className='status-pill live';statusPill.innerHTML='<span class="dot pulse"></span>已认证';
        doLoginBtn.textContent='✓ 登录成功';
        doLoginBtn.disabled=true;
        disconnectBtn.style.display='';
        addLog(`[${new Date().toLocaleTimeString()}] ✓ Session=${sessId}`,'var(--green)');
        Toast.show('success','✓ 登录成功',`${b.name} 已认证 · 可进行真实买卖`,4000);
        // 显示交易区
        showTradingArea(mask,api,b);
        // 启动定时刷新
        if(loginTimer)clearInterval(loginTimer);
        loginTimer=setInterval(async()=>{
          try{
            await api.queryAccount();
            updateAccountDisplay(mask,api.accountInfo);
          }catch(e){}
        },3000);
      }catch(e){
        addLog(`[FAILED] ${e.message}`,'var(--red)');
        doLoginBtn.disabled=false;doLoginBtn.textContent='🔐 登录认证';
        statusPill.className='status-pill sim';statusPill.innerHTML='<span class="dot pulse"></span>连接失败';
        Toast.show('error','认证失败',e.message);
      }
    };
    // 断开连接
    $('#btnDisconnect',mask).onclick=()=>{
      if(loginTimer){clearInterval(loginTimer);loginTimer=null;}
      const api=BrokerInstances[selectedBrokerId];
      if(api){api.disconnect();delete BrokerInstances[selectedBrokerId];}
      Store.state.activeBroker=null;
      Store.state.brokers[selectedBrokerId]={...BROKERS.find(x=>x.id===selectedBrokerId),status:'未连接'};
      $('#loginFormArea',mask).style.display='block';
      $('#tradingArea',mask).style.display='none';
      $('#btnDoLogin',mask).disabled=false;$('#btnDoLogin',mask).textContent='🔐 登录认证';
      $('#btnDisconnect',mask).style.display='none';
      $('#loginStatusPill',mask).className='status-pill sim';$('#loginStatusPill',mask).innerHTML='<span class="dot pulse"></span>未连接';
      $('#loginAccount',mask).value='';$('#loginPassword',mask).value='';$('#loginCommPwd',mask).value='';$('#loginExtra',mask).value='';
      Toast.show('info','已断开','券商连接已断开');
    };
    // Tab 切换
    $$('.tab-btn',mask).forEach(tb=>{
      tb.onclick=()=>{
        $$('.tab-btn',mask).forEach(t=>{t.classList.remove('active');t.style.borderBottomColor='transparent';t.style.color='var(--txt-mute)';});
        tb.classList.add('active');tb.style.borderBottomColor='var(--blue)';tb.style.color='var(--txt)';
        $$('.tab-content',mask).forEach(c=>c.style.display='none');
        const tabId='tab'+tb.dataset.tab.charAt(0).toUpperCase()+tb.dataset.tab.slice(1);
        $(tabId,mask).style.display='block';
      };
    });
    // 快速下单
    const api=BrokerInstances[Store.state.activeBroker];
    $('#quickBuyBtn',mask).onclick=async()=>{
      if(!api||!api.authenticated){Toast.show('warn','未登录','请先登录券商账户');return;}
      const code=$('#quickCode',mask).value.trim().toUpperCase();
      const price=parseFloat($('#quickPrice',mask).value);
      const qty=parseInt($('#quickQty',mask).value);
      if(!code||!price||!qty){Toast.show('warn','参数错误','代码、价格、数量不能为空');return;}
      try{
        const order=await api.orderBuy(code,price,qty);
        Toast.show('success','委托已报',`${code} 买入 ×${qty} @ ${price}`,3000);
        refreshTabs(mask,api);
      }catch(e){Toast.show('error','下单失败',e.message);}
    };
    $('#quickSellBtn',mask).onclick=async()=>{
      if(!api||!api.authenticated){Toast.show('warn','未登录','请先登录券商账户');return;}
      const code=$('#quickCode',mask).value.trim().toUpperCase();
      const price=parseFloat($('#quickPrice',mask).value);
      const qty=parseInt($('#quickQty',mask).value);
      if(!code||!price||!qty){Toast.show('warn','参数错误','代码、价格、数量不能为空');return;}
      try{
        const order=await api.orderSell(code,price,qty);
        Toast.show('success','委托已报',`${code} 卖出 ×${qty} @ ${price}`,3000);
        refreshTabs(mask,api);
      }catch(e){Toast.show('error','下单失败',e.message);}
    };
    // 如果已有活跃 API，直接展示交易区
    if(activeApi&&activeApi.authenticated){
      showTradingArea(mask,activeApi,BROKERS.find(x=>x.id===Store.state.activeBroker));
    }
  });

  /* 显示交易区 */
  async function showTradingArea(mask,api,broker){
    $('#loginFormArea',mask).style.display='none';
    $('#tradingArea',mask).style.display='block';
    // 查询数据
    try{
      const acct=await api.queryAccount();
      updateAccountDisplay(mask,acct);
      const positions=await api.queryPosition();
      renderPositionsTab(mask,positions);
      const orders=await api.queryOrder();
      renderOrdersTab(mask,orders);
      const trades=await api.queryTrade();
      renderTradesTab(mask,trades);
      // 更新 tab badge
      $$('.tab-btn[data-tab="pos"]',mask)[0].textContent=`持仓 (${positions.length})`;
      $$('.tab-btn[data-tab="ord"]',mask)[0].textContent=`委托 (${orders.length})`;
      $$('.tab-btn[data-tab="trd"]',mask)[0].textContent=`成交 (${trades.length})`;
      // 填充快速下单默认值
      const meta=STOCKS[Store.state.stock];
      if(meta){$('#quickPrice',mask).value=meta.base.toFixed(meta.base>50?2:4);}
    }catch(e){console.error(e);}
    // 绑定订单事件回调
    api.onOrderUpdate=(order)=>{refreshTabs(mask,api);};
    api.onTradeUpdate=(trade)=>{refreshTabs(mask,api);};
    api.onAccountUpdate=(acct)=>{updateAccountDisplay(mask,acct);};
  }

  /* 更新账户展示 */
  function updateAccountDisplay(mask,a){
    if(!a)return;
    $('#acctTotalAsset',mask).textContent='¥'+fmtInt(a.totalAsset);
    $('#acctCash',mask).textContent='¥'+fmtInt(a.availableCash);
    $('#acctMktVal',mask).textContent='¥'+fmtInt(a.marketValue);
    $('#acctFrozen',mask).textContent='¥'+fmtInt(a.frozenCash);
    $('#acctRiskLevel',mask).textContent=a.riskLevel||'--';
    $('#acctUpdateTime',mask).textContent=a.updateTime||'--:--:--';
  }

  /* 渲染各 Tab 内容 */
  function renderPositionsTab(mask,pos){
    const el=$('#tabPos',mask);
    if(!pos||pos.length===0){el.innerHTML='<div style="text-align:center;padding:16px;color:var(--txt-mute);font-size:12px">暂无持仓</div>';return;}
    el.innerHTML=`<table style="width:100%;font-size:12px;border-collapse:collapse">
      <thead><tr style="text-align:left;color:var(--txt-mute);border-bottom:1px solid var(--border)"><th>代码</th><th>名称</th><th>市场</th><th>持仓</th><th>可卖</th><th>成本价</th><th>现价</th><th>盈亏</th><th>盈亏%</th><th>市值</th></tr></thead>
      <tbody>${pos.map(p=>`<tr style="border-bottom:1px solid var(--border-soft)">
        <td style="font-family:'JetBrains Mono';color:var(--blue-2)">${p.code}</td>
        <td>${p.name}</td><td>${p.market}</td>
        <td style="font-family:'JetBrains Mono'">${p.qty}</td>
        <td style="font-family:'JetBrains Mono';color:var(--txt-mute)">${p.availableQty}</td>
        <td style="font-family:'JetBrains Mono'">${p.costPrice.toFixed(2)}</td>
        <td style="font-family:'JetBrains Mono'">${p.currentPrice.toFixed(2)}</td>
        <td style="font-family:'JetBrains Mono';color:${p.pnl>=0?'var(--up)':'var(--down)'}">${p.pnl>=0?'+':''}${p.pnl.toFixed(2)}</td>
        <td style="font-family:'JetBrains Mono';color:${p.pnlPct>=0?'var(--up)':'var(--down)'}">${(p.pnlPct*100).toFixed(2)}%</td>
        <td style="font-family:'JetBrains Mono'">${fmtInt(p.marketValue)}</td>
      </tr>`).join('')}</tbody></table>`;
  }
  function renderOrdersTab(mask,ords){
    const el=$('#tabOrd',mask);
    if(!ords||ords.length===0){el.innerHTML='<div style="text-align:center;padding:16px;color:var(--txt-mute);font-size:12px">暂无委托</div>';return;}
    el.innerHTML=`<table style="width:100%;font-size:12px;border-collapse:collapse">
      <thead><tr style="text-align:left;color:var(--txt-mute);border-bottom:1px solid var(--border)"><th>时间</th><th>代码</th><th>方向</th><th>类型</th><th>状态</th><th>价格</th><th>数量</th><th>成交</th><th>操作</th></tr></thead>
      <tbody>${ords.slice(0,20).map(o=>{
        const sideCls=o.side==='买入'?'var(--up)':'var(--down)';
        const statusCls=o.status==='已成'?'var(--green)':o.status==='已撤销'?'var(--txt-mute)':o.status==='部成'?'var(--orange)':'var(--blue)';
        return`<tr style="border-bottom:1px solid var(--border-soft)">
          <td style="font-family:'JetBrains Mono';font-size:10px;color:var(--txt-mute)">${o.time}</td>
          <td style="font-family:'JetBrains Mono';color:var(--blue-2)">${o.code}</td>
          <td style="color:${sideCls};font-weight:600">${o.side}</td>
          <td>${o.orderType}</td>

          <td style="font-family:'JetBrains Mono';color:var(--txt-mute)">${t.stampTax.toFixed(2)}</td>
          <td style="font-family:'JetBrains Mono';color:${t.netPnl>=0?'var(--up)':'var(--down)'};font-weight:600">${t.netPnl>=0?'+':''}${t.netPnl.toFixed(2)}</td>

  /* 刷新所有 Tab */
  async function refreshTabs(mask,api){
    try{

      $$('.tab-btn[data-tab="trd"]',mask)[0].textContent=`成交 (${trds.length})`;
    }catch(e){}
  }

function openBacktestModal(){
  const html=`
    <div class="modal-head"><div class="title">回测分析 · 近一周 5 个交易日</div><div class="close" data-c><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div></div>
    <div class="modal-body">
      <div class="bt-grid">
        <div class="bt-stat"><div class="lbl">累计收益</div><div class="v up" id="btRet">--</div></div>
        <div class="bt-stat"><div class="lbl">年化收益</div><div class="v up" id="btAnnual">--</div></div>
        <div class="bt-stat"><div class="lbl">最大回撤</div><div class="v down" id="btDD">--</div></div>
        <div class="bt-stat"><div class="lbl">夏普比率</div><div class="v" id="btSharpe">--</div></div>
      </div>
      <div class="bt-chart"><svg id="btSvg" viewBox="0 0 900 220" preserveAspectRatio="none"></svg></div>
      <div style="margin-top:14px"><div style="font-size:13px;font-weight:600;margin-bottom:8px">每日盈亏</div>
        <div id="btDays" style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px"></div>
      </div>
    </div>`;
  openModal(html,(mask,close)=>{
    $$('.close,[data-c]',mask).forEach(b=>b.onclick=close);
    const m=MODELS.find(x=>x.id===Store.state.modelId);
    const rng=srand(m.id.charCodeAt(1)+9000);
    const days=REPLAY_DAYS.map(d=>{const pnl=(rng()-0.4)*0.04;return{...d,pnl};});
    let equity=1;const curve=[1];days.forEach(d=>{equity*=(1+d.pnl);curve.push(equity);});
    const finalRet=equity-1;
    $('#btRet',mask).textContent=pct(finalRet);$('#btRet').className='v '+(finalRet>=0?'up':'down');
    $('#btAnnual',mask).textContent=pct(finalRet*52);$('#btAnnual').className='v '+(finalRet>=0?'up':'down');
    const peak=Math.max(...curve),dd=(curve[curve.length-1]-peak)/peak;
    $('#btDD',mask).textContent=pct(dd);
    $('#btSharpe',mask).textContent=m.sharpe.toFixed(2);
    const svg=mask.querySelector('#btSvg');svg.innerHTML='';
    const W=900,H=220,pl=20,pr=10,pt=20,pb=20;
    const plotW=W-pl-pr,plotH=H-pt-pb;
    const mn=Math.min(...curve,1),mx=Math.max(...curve,1);
    const range=(mx-mn)||1,pad=range*0.15;
    const yMin=mn-pad,yMax=mx+pad;
    const yScale=v=>pt+(1-(v-yMin)/(yMax-yMin))*plotH;
    const x=i=>pl+(i/(curve.length-1))*plotW;
    for(let i=0;i<=4;i++){const y=pt+(plotH/4)*i;svg.appendChild(svgEl('line',{x1:pl,y1:y,x2:W-pr,y2:y,stroke:'#1e293b','stroke-width':1,'stroke-dasharray':'2,4'}));}
    const baseY=yScale(1);
    svg.appendChild(svgEl('line',{x1:pl,y1:baseY,x2:W-pr,y2:baseY,stroke:'#475569','stroke-width':1,'stroke-dasharray':'4,4'}));
    svg.appendChild(svgEl('text',{x:W-pr-4,y:baseY-4,fill:'#64748b','font-size':10,'text-anchor':'end','font-family':'JetBrains Mono'},'BASELINE 1.00'));
    let path=`M${x(0)},${yScale(curve[0])}`;
    for(let i=1;i<curve.length;i++)path+=` L${x(i)},${yScale(curve[i])}`;
    const last=curve[curve.length-1];
    const color=last>=1?'#ef4444':'#22c55e';
    const defs=svgEl('defs');
    const grad=svgEl('linearGradient',{id:'btG',x1:0,y1:0,x2:0,y2:1});
    grad.appendChild(svgEl('stop',{offset:'0%','stop-color':color,'stop-opacity':0.3}));
    grad.appendChild(svgEl('stop',{offset:'100%','stop-color':color,'stop-opacity':0}));
    defs.appendChild(grad);svg.appendChild(defs);
    const fillPath=path+` L${x(curve.length-1)},${H-pb} L${x(0)},${H-pb} Z`;
    svg.appendChild(svgEl('path',{d:fillPath,fill:'url(#btG)'}));
    svg.appendChild(svgEl('path',{d:path,fill:'none',stroke:color,'stroke-width':2}));
    curve.forEach((v,i)=>{svg.appendChild(svgEl('circle',{cx:x(i),cy:yScale(v),r:3.5,fill:color,stroke:'#0a1020','stroke-width':1.5}));});
    const daysEl=mask.querySelector('#btDays');
    daysEl.innerHTML=days.map(d=>{const cls=d.pnl>=0?'up':'down';return`<div class="bt-stat" style="padding:10px"><div class="lbl">${d.label} ${d.date.slice(5)}</div><div class="v ${cls}">${pct(d.pnl)}</div></div>`;}).join('');
  });
}

function bindAiAssistant(){
  const fab=$('#fab');
  const panel=$('#aiPanel');
  const closeBtn=$('#aiClose');
  const input=$('#aiInput');
  const sendBtn=$('#aiSend');
  fab.addEventListener('click',()=>{
    panel.classList.toggle('show');
    if(panel.classList.contains('show')&&!aiSession)startAiChat();
  });
  closeBtn.addEventListener('click',()=>{panel.classList.remove('show');});
  input.addEventListener('input',()=>{sendBtn.disabled=!input.value.trim();});
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&input.value.trim()){userFreeInput(input.value.trim());input.value='';sendBtn.disabled=true;}});
  sendBtn.addEventListener('click',()=>{if(input.value.trim()){userFreeInput(input.value.trim());input.value='';sendBtn.disabled=true;}});
}
function startAiChat(){
  aiSession={step:0,answers:{},scores:Object.fromEntries(MODELS.map(m=>[m.id,0]))};
  addAiMsg('bot','👋 您好！我是 <b>Dasheng AI 策略顾问</b>。<br/>回答 5 个小问题，我将为您从 7 套模型中匹配 <b>最适合您的策略</b>。');
  setTimeout(()=>askQuestion(),400);
}
function askQuestion(){
  if(aiSession.step>=AI_QUESTIONS.length){recommendModel();return;}
  const q=AI_QUESTIONS[aiSession.step];
  const optsHtml=q.options.map(o=>`<div class="opt" data-v="${o.v}">${o.label}</div>`).join('');
  addAiMsg('bot',`${q.q}<div class="opts">${optsHtml}</div>`);
  // 绑定选项点击
  const body=$('#aiBody');
  const lastMsg=body.lastElementChild;
  $$('.opt',lastMsg).forEach(opt=>{
    opt.addEventListener('click',()=>{
      const v=opt.dataset.v;
      $$('.opt',lastMsg).forEach(o=>o.classList.remove('sel'));
      opt.classList.add('sel');
      // 记录答案 + 累加分数
      aiSession.answers[q.key]=v;
      const optCfg=q.options.find(o=>o.v===v);
      if(optCfg&&optCfg.boost){
        Object.entries(optCfg.boost).forEach(([mid,sc])=>{aiSession.scores[mid]=(aiSession.scores[mid]||0)+sc;});
      }
      // 滚动到底
      body.scrollTop=body.scrollHeight;
      setTimeout(()=>{
        addAiMsg('user',q.options.find(o=>o.v===v).label);
        aiSession.step++;
        setTimeout(()=>askQuestion(),500);
      },200);
    });
  });
}
function userFreeInput(text){
  addAiMsg('user',text);
  // 简单关键词匹配回答
  const t=text.toLowerCase();

    if(/短线|日内|t\+0|t0|高频/.test(text)){addAiMsg('bot','推荐短线策略：<b>M05 KD 高频震荡</b> 或 <b>M07 超级短线 V1.0</b>（旗舰）');}

    else if(/趋势|突破|动量|跟随/.test(text)){addAiMsg('bot','趋势策略：<b>M02 海龟通道突破</b> + <b>M03 MACD 金叉</b> 组合使用更佳');}

function recommendModel(){
  // 归一化分数
  const sorted=Object.entries(aiSession.scores).sort((a,b)=>b[1]-a[1]);
  const topId=sorted[0][0];
  const top=MODELS.find(m=>m.id===topId);
  const runner=sorted[1]?MODELS.find(m=>m.id===sorted[1][0]):null;
  // 渲染推荐卡片
  const html=`
    <div class="ai-recommend">
      <div class="title">⭐ 最佳匹配模型</div>
      <div class="pick">${top.code} · ${top.name}${top.flagship?' ★':''}</div>

      <button class="apply" id="aiApply" data-mid="${top.id}">✓ 一键应用此模型</button>
    </div>`;
  addAiMsg('bot',`🎉 推荐完成！根据您的交易风格、持仓周期、风险偏好、市场类型与经验水平，我为您匹配了 <b style="color:var(--pink)">${top.name}</b>${html}`);

  const applyBtn=body.querySelector('#aiApply');
  if(applyBtn)applyBtn.addEventListener('click',()=>{
    Store.state.modelId=top.id;
    $('#modelSel').value=top.id;
    refreshModelInfo();refreshSignal();
    Toast.show('success','✓ 已应用',`${top.name} 已设为当前模型`);

    addAiMsg('bot','👍 模型已切换！您可以继续问问题，或点击右上角 × 关闭。');
    aiSession=null;
  });
  aiSession=null;
}
function addAiMsg(type,html){
  const body=$('#aiBody');
  const el=document.createElement('div');el.className='ai-msg '+type;
  el.innerHTML=html;
  body.appendChild(el);
  body.scrollTop=body.scrollHeight;
}
