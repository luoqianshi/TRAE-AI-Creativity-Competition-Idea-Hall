<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>老板来了！</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 3/4;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        /* 伪装Excel界面 */
        #fakeExcel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: none;
            z-index: 1000;
            border-radius: 12px;
            overflow: hidden;
        }

        .excel-header {
            background: #217346;
            color: white;
            padding: 8px 12px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .excel-icon {
            width: 20px;
            height: 20px;
            background: #107c41;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .excel-toolbar {
            background: #f3f2f1;
            padding: 6px 12px;
            border-bottom: 1px solid #e1dfdd;
            font-size: 12px;
            color: #323130;
        }

        .excel-grid {
            display: grid;
            grid-template-columns: 40px repeat(8, 1fr);
            grid-template-rows: 24px repeat(20, 1fr);
            height: calc(100% - 80px);
            font-size: 11px;
        }

        .excel-cell {
            border: 1px solid #e1dfdd;
            padding: 2px 4px;
            overflow: hidden;
            white-space: nowrap;
        }

        .excel-cell.header {
            background: #f3f2f1;
            text-align: center;
            font-weight: bold;
        }

        .excel-cell:nth-child(8n+2) { background: #fff; }
        .excel-cell:nth-child(8n+3) { background: #fff; }

        /* 移动端控制按钮 */
        #mobileControls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            z-index: 100;
        }

        .d-pad {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px 60px;
            gap: 4px;
        }

        .d-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 12px;
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .d-btn:active {
            background: rgba(255,255,255,0.4);
        }

        .d-btn:nth-child(2) { grid-column: 2; }
        .d-btn:nth-child(3) { grid-column: 1; grid-row: 2; }
        .d-btn:nth-child(4) { grid-column: 3; grid-row: 2; }
        .d-btn:nth-child(5) { grid-column: 2; grid-row: 3; }

        /* 提示文字 */
        .boss-key-hint {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 50;
            display: none;
        }

        @media (max-width: 768px) {
            #mobileControls {
                display: block;
            }
            .boss-key-hint {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <!-- 伪装Excel界面 -->
        <div id="fakeExcel">
            <div class="excel-header">
                <div class="excel-icon">X</div>
                <span>工作报表.xlsx - Excel</span>
            </div>
            <div class="excel-toolbar">
                文件  开始  插入  页面布局  公式  数据  审阅  视图
            </div>
            <div class="excel-grid" id="excelGrid"></div>
        </div>

        <!-- 移动端控制 -->
        <div id="mobileControls">
            <div class="d-pad">
                <div class="d-btn" data-dir="up">▲</div>
                <div class="d-btn" data-dir="left">◀</div>
                <div class="d-btn" data-dir="right">▶</div>
                <div class="d-btn" data-dir="down">▼</div>
            </div>
        </div>

        <div class="boss-key-hint">按 B 键伪装</div>
    </div>

    <script>
        // ==================== 游戏配置 ====================
        const CONFIG = {
            CANVAS_WIDTH: 480,
            CANVAS_HEIGHT: 640,
            PLAYER_SIZE: 32,
            PLAYER_SPEED: 4,
            BOSS_SIZE: 40,
            BOSS_SPEED: 2.5,
            ITEM_SIZE: 24,
            SPAWN_INTERVAL: 2000,
            BOSS_SPAWN_INTERVAL: 3000,
            WARNING_DISTANCE: 150,
            FAKE_EXCEL_DURATION: 3000,
            FAKE_EXCEL_COOLDOWN: 8000,
            THEMES: {
                office: {
                    bg: '#2d3748',
                    floor: '#4a5568',
                    wall: '#1a202c',
                    desk: '#744210',
                    decor: ['💻', '📁', '📎', '🖊️', '📊']
                },
                classroom: {
                    bg: '#2c5282',
                    floor: '#4299e1',
                    wall: '#1a365d',
                    desk: '#744210',
                    decor: ['📚', '✏️', '📐', '🎒', '📝']
                },
                library: {
                    bg: '#276749',
                    floor: '#48bb78',
                    wall: '#1a4531',
                    desk: '#744210',
                    decor: ['📖', '🔖', '📚', '📰', '🕯️']
                },
                cafe: {
                    bg: '#744210',
                    floor: '#975a16',
                    wall: '#553c0a',
                    desk: '#2d3748',
                    decor: ['☕', '🥐', '🍰', '📰', '🌿']
                }
            },
            ITEMS: [
                { emoji: '🧋', name: '奶茶', score: 5, time: 3 },
                { emoji: '📱', name: '手机', score: 8, time: 5 },
                { emoji: '🍿', name: '零食', score: 3, time: 2 },
                { emoji: '🎮', name: '游戏机', score: 10, time: 6 },
                { emoji: '🎧', name: '耳机', score: 6, time: 4 }
            ],
            RANKS: [
                { name: '摸鱼新手', min: 0, color: '#a0aec0' },
                { name: '摸鱼学徒', min: 30, color: '#68d391' },
                { name: '摸鱼达人', min: 60, color: '#63b3ed' },
                { name: '摸鱼高手', min: 120, color: '#9f7aea' },
                { name: '摸鱼大师', min: 180, color: '#f6ad55' },
                { name: '摸鱼王者', min: 300, color: '#f56565' },
                { name: '时间管理大师', min: 600, color: '#ffd700' }
            ]
        };

        // ==================== 游戏状态 ====================
        const state = {
            screen: 'menu', // menu, playing, gameover, shop
            score: 0,
            time: 0,
            bestTime: parseInt(localStorage.getItem('bossBestTime')) || 0,
            totalTime: parseInt(localStorage.getItem('bossTotalTime')) || 0,
            gamesPlayed: parseInt(localStorage.getItem('bossGamesPlayed')) || 0,
            currentTheme: localStorage.getItem('bossTheme') || 'office',
            unlockedThemes: JSON.parse(localStorage.getItem('bossUnlockedThemes')) || ['office'],
            player: { x: 240, y: 320, vx: 0, vy: 0 },
            bosses: [],
            items: [],
            particles: [],
            decorations: [],
            keys: {},
            fakeExcelActive: false,
            fakeExcelCooldown: 0,
            fakeExcelTimer: 0,
            warningLevel: 0,
            gameTime: 0,
            spawnTimer: 0,
            bossSpawnTimer: 0,
            difficulty: 1,
            camera: { x: 0, y: 0 },
            shake: 0
        };

        // ==================== Canvas初始化 ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = CONFIG.CANVAS_WIDTH;
        canvas.height = CONFIG.CANVAS_HEIGHT;

        // ==================== 音频系统 ====================
        const AudioSys = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playTone(freq, duration, type = 'sine', volume = 0.3) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            },
            collect() {
                this.playTone(880, 0.1, 'sine', 0.2);
                setTimeout(() => this.playTone(1100, 0.15, 'sine', 0.2), 50);
            },
            warning() {
                this.playTone(200, 0.3, 'square', 0.15);
            },
            gameOver() {
                this.playTone(300, 0.3, 'sawtooth', 0.3);
                setTimeout(() => this.playTone(200, 0.5, 'sawtooth', 0.3), 200);
            },
            bossKey() {
                this.playTone(600, 0.1, 'sine', 0.2);
            }
        };

        // ==================== 输入处理 ====================
        const Input = {
            init() {
                window.addEventListener('keydown', (e) => {
                    state.keys[e.key] = true;
                    if (e.key === 'b' || e.key === 'B') {
                        this.activateBossKey();
                    }
                    if (e.key === ' ' && state.screen === 'menu') {
                        Game.start();
                    }
                    if (e.key === ' ' && state.screen === 'gameover') {
                        Game.reset();
                    }
                });
                window.addEventListener('keyup', (e) => {
                    state.keys[e.key] = false;
                });

                // 移动端控制
                document.querySelectorAll('.d-btn').forEach(btn => {
                    const dir = btn.dataset.dir;
                    btn.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        state.keys['Arrow' + dir.charAt(0).toUpperCase() + dir.slice(1)] = true;
                    });
                    btn.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        state.keys['Arrow' + dir.charAt(0).toUpperCase() + dir.slice(1)] = false;
                    });
                });

                // 触摸移动
                let touchStartX = 0, touchStartY = 0;
                canvas.addEventListener('touchstart', (e) => {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                });
                canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const dx = e.touches[0].clientX - touchStartX;
                    const dy = e.touches[0].clientY - touchStartY;
                    state.player.vx = dx * 0.1;
                    state.player.vy = dy * 0.1;
                });
                canvas.addEventListener('touchend', () => {
                    state.player.vx = 0;
                    state.player.vy = 0;
                });
            },
            activateBossKey() {
                if (state.fakeExcelCooldown > 0 || state.fakeExcelActive || state.screen !== 'playing') return;
                AudioSys.bossKey();
                state.fakeExcelActive = true;
                state.fakeExcelTimer = CONFIG.FAKE_EXCEL_DURATION;
                document.getElementById('fakeExcel').style.display = 'block';
                generateExcelGrid();
            }
        };

        // ==================== 生成Excel伪装网格 ====================
        function generateExcelGrid() {
            const grid = document.getElementById('excelGrid');
            grid.innerHTML = '';
            const cols = ['', 'A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
            cols.forEach(c => {
                const cell = document.createElement('div');
                cell.className = 'excel-cell header';
                cell.textContent = c;
                grid.appendChild(cell);
            });
            const data = ['销售额', '成本', '利润', '增长率', '目标', '完成率', '备注', '', ''];
            for (let i = 1; i <= 20; i++) {
                const numCell = document.createElement('div');
                numCell.className = 'excel-cell header';
                numCell.textContent = i;
                grid.appendChild(numCell);
                for (let j = 0; j < 8; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'excel-cell';
                    if (i === 1) {
                        cell.textContent = data[j] || '';
                    } else if (j < 6) {
                        cell.textContent = Math.floor(Math.random() * 10000);
                    }
                    grid.appendChild(cell);
                }
            }
        }

        // ==================== 游戏逻辑 ====================
        const Game = {
            start() {
                AudioSys.init();
                state.screen = 'playing';
                state.score = 0;
                state.time = 0;
                state.gameTime = 0;
                state.difficulty = 1;
                state.player = { x: CONFIG.CANVAS_WIDTH / 2, y: CONFIG.CANVAS_HEIGHT / 2, vx: 0, vy: 0 };
                state.bosses = [];
                state.items = [];
                state.particles = [];
                state.warningLevel = 0;
                state.fakeExcelActive = false;
                state.fakeExcelCooldown = 0;
                state.shake = 0;
                this.generateDecorations();
            },
            reset() {
                state.screen = 'menu';
            },
            generateDecorations() {
                state.decorations = [];
                const theme = CONFIG.THEMES[state.currentTheme];
                for (let i = 0; i < 15; i++) {
                    state.decorations.push({
                        x: Math.random() * (CONFIG.CANVAS_WIDTH - 60) + 30,
                        y: Math.random() * (CONFIG.CANVAS_HEIGHT - 60) + 30,
                        emoji: theme.decor[Math.floor(Math.random() * theme.decor.length)],
                        size: 20 + Math.random() * 15
                    });
                }
            },
            update(dt) {
                if (state.screen !== 'playing') return;

                state.gameTime += dt;
                state.time = Math.floor(state.gameTime);
                state.difficulty = 1 + state.gameTime / 60;

                // 更新玩家
                this.updatePlayer();

                // 生成道具
                state.spawnTimer += dt * 1000;
                if (state.spawnTimer > CONFIG.SPAWN_INTERVAL) {
                    this.spawnItem();
                    state.spawnTimer = 0;
                }

                // 生成老板
                state.bossSpawnTimer += dt * 1000;
                const bossInterval = CONFIG.BOSS_SPAWN_INTERVAL / state.difficulty;
                if (state.bossSpawnTimer > bossInterval) {
                    this.spawnBoss();
                    state.bossSpawnTimer = 0;
                }

                // 更新老板
                this.updateBosses(dt);

                // 更新道具
                this.updateItems();

                // 更新粒子
                this.updateParticles(dt);

                // 更新伪装状态
                if (state.fakeExcelActive) {
                    state.fakeExcelTimer -= dt * 1000;
                    if (state.fakeExcelTimer <= 0) {
                        state.fakeExcelActive = false;
                        state.fakeExcelCooldown = CONFIG.FAKE_EXCEL_COOLDOWN;
                        document.getElementById('fakeExcel').style.display = 'none';
                    }
                }
                if (state.fakeExcelCooldown > 0) {
                    state.fakeExcelCooldown -= dt * 1000;
                }

                // 震动衰减
                if (state.shake > 0) state.shake *= 0.9;
                if (state.shake < 0.5) state.shake = 0;
            },
            updatePlayer() {
                const p = state.player;
                let dx = 0, dy = 0;

                if (state.keys['ArrowLeft'] || state.keys['a'] || state.keys['A']) dx -= 1;
                if (state.keys['ArrowRight'] || state.keys['d'] || state.keys['D']) dx += 1;
                if (state.keys['ArrowUp'] || state.keys['w'] || state.keys['W']) dy -= 1;
                if (state.keys['ArrowDown'] || state.keys['s'] || state.keys['S']) dy += 1;

                if (dx !== 0 && dy !== 0) {
                    dx *= 0.707;
                    dy *= 0.707;
                }

                p.vx = dx * CONFIG.PLAYER_SPEED;
                p.vy = dy * CONFIG.PLAYER_SPEED;

                p.x += p.vx;
                p.y += p.vy;

                p.x = Math.max(CONFIG.PLAYER_SIZE/2, Math.min(CONFIG.CANVAS_WIDTH - CONFIG.PLAYER_SIZE/2, p.x));
                p.y = Math.max(CONFIG.PLAYER_SIZE/2, Math.min(CONFIG.CANVAS_HEIGHT - CONFIG.PLAYER_SIZE/2, p.y));
            },
            spawnItem() {
                const item = CONFIG.ITEMS[Math.floor(Math.random() * CONFIG.ITEMS.length)];
                state.items.push({
                    x: Math.random() * (CONFIG.CANVAS_WIDTH - 60) + 30,
                    y: Math.random() * (CONFIG.CANVAS_HEIGHT - 60) + 30,
                    ...item,
                    id: Date.now(),
                    float: 0
                });
            },
            spawnBoss() {
                const side = Math.floor(Math.random() * 4);
                let x, y;
                switch(side) {
                    case 0: x = Math.random() * CONFIG.CANVAS_WIDTH; y = -CONFIG.BOSS_SIZE; break;
                    case 1: x = CONFIG.CANVAS_WIDTH + CONFIG.BOSS_SIZE; y = Math.random() * CONFIG.CANVAS_HEIGHT; break;
                    case 2: x = Math.random() * CONFIG.CANVAS_WIDTH; y = CONFIG.CANVAS_HEIGHT + CONFIG.BOSS_SIZE; break;
                    case 3: x = -CONFIG.BOSS_SIZE; y = Math.random() * CONFIG.CANVAS_HEIGHT; break;
                }
                state.bosses.push({
                    x, y,
                    vx: 0, vy: 0,
                    speed: CONFIG.BOSS_SPEED * state.difficulty,
                    size: CONFIG.BOSS_SIZE,
                    emoji: ['👔', '👨‍💼', '👩‍💼', '🕴️'][Math.floor(Math.random() * 4)]
                });
            },
            updateBosses(dt) {
                state.warningLevel = 0;
                const p = state.player;

                state.bosses.forEach((boss, i) => {
                    const dx = p.x - boss.x;
                    const dy = p.y - boss.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist > 0) {
                        boss.vx = (dx / dist) * boss.speed;
                        boss.vy = (dy / dist) * boss.speed;
                    }

                    boss.x += boss.vx;
                    boss.y += boss.vy;

                    // 预警检测
                    if (dist < CONFIG.WARNING_DISTANCE) {
                        state.warningLevel = Math.max(state.warningLevel, 1 - dist / CONFIG.WARNING_DISTANCE);
                    }

                    // 碰撞检测
                    if (dist < (CONFIG.PLAYER_SIZE + boss.size) / 2 && !state.fakeExcelActive) {
                        this.gameOver();
                    }

                    // 移除屏幕外老板
                    if (boss.x < -100 || boss.x > CONFIG.CANVAS_WIDTH + 100 ||
                        boss.y < -100 || boss.y > CONFIG.CANVAS_HEIGHT + 100) {
                        state.bosses.splice(i, 1);
                    }
                });

                if (state.warningLevel > 0.5 && Math.random() < 0.1) {
                    AudioSys.warning();
                    state.shake = state.warningLevel * 5;
                }
            },
            updateItems() {
                const p = state.player;
                state.items.forEach((item, i) => {
                    item.float += 0.05;
                    const dx = p.x - item.x;
                    const dy = p.y - item.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < (CONFIG.PLAYER_SIZE + CONFIG.ITEM_SIZE) / 2) {
                        AudioSys.collect();
                        state.score += item.score;
                        state.gameTime += item.time;
                        this.createParticles(item.x, item.y, item.emoji);
                        state.items.splice(i, 1);
                    }
                });

                // 清理过多道具
                if (state.items.length > 10) {
                    state.items.shift();
                }
            },
            createParticles(x, y, emoji) {
                for (let i = 0; i < 8; i++) {
                    state.particles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 4,
                        vy: (Math.random() - 0.5) * 4,
                        life: 1,
                        emoji,
                        size: 12 + Math.random() * 8
                    });
                }
            },
            updateParticles(dt) {
                state.particles.forEach((p, i) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.1;
                    p.life -= dt * 2;
                    if (p.life <= 0) state.particles.splice(i, 1);
                });
            },
            gameOver() {
                AudioSys.gameOver();
                state.screen = 'gameover';
                state.gamesPlayed++;
                state.totalTime += state.time;
                if (state.time > state.bestTime) {
                    state.bestTime = state.time;
                }
                localStorage.setItem('bossBestTime', state.bestTime);
                localStorage.setItem('bossTotalTime', state.totalTime);
                localStorage.setItem('bossGamesPlayed', state.gamesPlayed);
            },
            getRank() {
                for (let i = CONFIG.RANKS.length - 1; i >= 0; i--) {
                    if (state.bestTime >= CONFIG.RANKS[i].min) {
                        return CONFIG.RANKS[i];
                    }
                }
                return CONFIG.RANKS[0];
            }
        };

        // ==================== 渲染系统 ====================
        const Render = {
            draw() {
                ctx.save();
                
                // 震动效果
                if (state.shake > 0) {
                    ctx.translate(
                        (Math.random() - 0.5) * state.shake,
                        (Math.random() - 0.5) * state.shake
                    );
                }

                if (state.screen === 'menu') {
                    this.drawMenu();
                } else if (state.screen === 'playing') {
                    this.drawGame();
                } else if (state.screen === 'gameover') {
                    this.drawGame();
                    this.drawGameOver();
                }

                ctx.restore();
            },
            drawMenu() {
                const theme = CONFIG.THEMES[state.currentTheme];
                
                // 背景
                ctx.fillStyle = theme.bg;
                ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

                // 装饰
                state.decorations.forEach(d => {
                    ctx.font = `${d.size}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.fillText(d.emoji, d.x, d.y);
                });

                // 标题
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 48px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText('老板来了！', CONFIG.CANVAS_WIDTH / 2, 180);

                ctx.font = '20px Microsoft YaHei';
                ctx.fillStyle = '#a0aec0';
                ctx.fillText('办公室摸鱼大作战', CONFIG.CANVAS_WIDTH / 2, 220);

                // 开始按钮
                this.drawButton('开始摸鱼', CONFIG.CANVAS_WIDTH / 2, 320, '#48bb78');
                this.drawButton('切换场景', CONFIG.CANVAS_WIDTH / 2, 390, '#4299e1');

                // 统计
                ctx.font = '14px Microsoft YaHei';
                ctx.fillStyle = '#718096';
                ctx.fillText(`最高记录: ${state.bestTime}秒 | 游戏次数: ${state.gamesPlayed}`, CONFIG.CANVAS_WIDTH / 2, 480);
                
                const rank = Game.getRank();
                ctx.fillStyle = rank.color;
                ctx.font = '16px Microsoft YaHei';
                ctx.fillText(`当前段位: ${rank.name}`, CONFIG.CANVAS_WIDTH / 2, 510);

                // 操作说明
                ctx.fillStyle = '#4a5568';
                ctx.font = '12px Microsoft YaHei';
                ctx.fillText('方向键/WASD移动 | B键伪装Excel | 空格开始', CONFIG.CANVAS_WIDTH / 2, 580);
            },
            drawGame() {
                const theme = CONFIG.THEMES[state.currentTheme];

                // 背景
                ctx.fillStyle = theme.bg;
                ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

                // 地板纹理
                ctx.fillStyle = theme.floor;
                for (let x = 0; x < CONFIG.CANVAS_WIDTH; x += 60) {
                    for (let y = 0; y < CONFIG.CANVAS_HEIGHT; y += 60) {
                        ctx.fillRect(x + 2, y + 2, 56, 56);
                    }
                }

                // 装饰
                state.decorations.forEach(d => {
                    ctx.font = `${d.size}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.fillText(d.emoji, d.x, d.y);
                });

                // 道具
                state.items.forEach(item => {
                    const floatY = Math.sin(item.float) * 3;
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(item.emoji, item.x, item.y + floatY);
                    
                    // 道具名称
                    ctx.font = '10px Microsoft YaHei';
                    ctx.fillStyle = '#fff';
                    ctx.fillText(`+${item.time}秒`, item.x, item.y + floatY + 18);
                });

                // 玩家
                ctx.font = '32px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('😅', state.player.x, state.player.y + 10);

                // 老板
                state.bosses.forEach(boss => {
                    ctx.font = '40px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(boss.emoji, boss.x, boss.y + 12);
                });

                // 粒子
                state.particles.forEach(p => {
                    ctx.globalAlpha = p.life;
                    ctx.font = `${p.size}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.fillText(p.emoji, p.x, p.y);
                });
                ctx.globalAlpha = 1;

                // UI
                this.drawUI();

                // 预警效果
                if (state.warningLevel > 0) {
                    ctx.fillStyle = `rgba(245, 101, 101, ${state.warningLevel * 0.3})`;
                    ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
                }
            },
            drawUI() {
                // 顶部信息栏
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, 50);

                ctx.font = 'bold 18px Microsoft YaHei';
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'left';
                ctx.fillText(`⏱️ ${state.time}秒`, 15, 32);

                ctx.textAlign = 'center';
                ctx.fillText(`🏆 ${state.score}分`, CONFIG.CANVAS_WIDTH / 2, 32);

                ctx.textAlign = 'right';
                ctx.fillText(`👔 ${state.bosses.length}`, CONFIG.CANVAS_WIDTH - 15, 32);

                // 伪装冷却
                if (state.fakeExcelCooldown > 0) {
                    const cooldownPercent = state.fakeExcelCooldown / CONFIG.FAKE_EXCEL_COOLDOWN;
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(CONFIG.CANVAS_WIDTH - 100, 55, 85, 20);
                    ctx.fillStyle = '#f6ad55';
                    ctx.fillRect(CONFIG.CANVAS_WIDTH - 98, 57, 81 * (1 - cooldownPercent), 16);
                    ctx.font = '10px Microsoft YaHei';
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    ctx.fillText('伪装冷却', CONFIG.CANVAS_WIDTH - 57, 70);
                } else if (!state.fakeExcelActive) {
                    ctx.font = '12px Microsoft YaHei';
                    ctx.fillStyle = '#68d391';
                    ctx.textAlign = 'right';
                    ctx.fillText('按B伪装!', CONFIG.CANVAS_WIDTH - 15, 70);
                }

                // 伪装中提示
                if (state.fakeExcelActive) {
                    ctx.fillStyle = 'rgba(33, 115, 70, 0.8)';
                    ctx.fillRect(0, CONFIG.CANVAS_HEIGHT - 40, CONFIG.CANVAS_WIDTH, 40);
                    ctx.font = 'bold 16px Microsoft YaHei';
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    ctx.fillText('🛡️ 伪装中... 老板看不到你!', CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT - 15);
                }
            },
            drawGameOver() {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 36px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText('被老板抓到了！', CONFIG.CANVAS_WIDTH / 2, 200);

                ctx.font = '24px Microsoft YaHei';
                ctx.fillStyle = '#f56565';
                ctx.fillText('💀 当场社死 💀', CONFIG.CANVAS_WIDTH / 2, 250);

                ctx.font = '20px Microsoft YaHei';
                ctx.fillStyle = '#fff';
                ctx.fillText(`摸鱼时长: ${state.time}秒`, CONFIG.CANVAS_WIDTH / 2, 310);
                ctx.fillText(`获得分数: ${state.score}`, CONFIG.CANVAS_WIDTH / 2, 345);

                const rank = Game.getRank();
                ctx.fillStyle = rank.color;
                ctx.font = 'bold 22px Microsoft YaHei';
                ctx.fillText(`段位: ${rank.name}`, CONFIG.CANVAS_WIDTH / 2, 390);

                ctx.fillStyle = '#a0aec0';
                ctx.font = '14px Microsoft YaHei';
                ctx.fillText(`历史最高: ${state.bestTime}秒`, CONFIG.CANVAS_WIDTH / 2, 430);

                this.drawButton('再来一局', CONFIG.CANVAS_WIDTH / 2, 490, '#48bb78');
                this.drawButton('返回菜单', CONFIG.CANVAS_WIDTH / 2, 550, '#718096');

                ctx.font = '12px Microsoft YaHei';
                ctx.fillStyle = '#4a5568';
                ctx.fillText('按空格键快速重开', CONFIG.CANVAS_WIDTH / 2, 600);
            },
            drawButton(text, x, y, color) {
                const width = 160;
                const height = 45;
                
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.roundRect(x - width/2, y - height/2, width, height, 10);
                ctx.fill();

                ctx.font = 'bold 18px Microsoft YaHei';
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, x, y);
                ctx.textBaseline = 'alphabetic';
            }
        };

        // ==================== 主题切换 ====================
        function switchTheme() {
            const themes = Object.keys(CONFIG.THEMES);
            const currentIndex = themes.indexOf(state.currentTheme);
            const nextIndex = (currentIndex + 1) % themes.length;
            state.currentTheme = themes[nextIndex];
            localStorage.setItem('bossTheme', state.currentTheme);
            Game.generateDecorations();
        }

        // ==================== 主循环 ====================
        let lastTime = 0;
        function gameLoop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
            lastTime = timestamp;

            Game.update(dt);
            Render.draw();

            requestAnimationFrame(gameLoop);
        }

        // ==================== 点击处理 ====================
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (CONFIG.CANVAS_WIDTH / rect.width);
            const y = (e.clientY - rect.top) * (CONFIG.CANVAS_HEIGHT / rect.height);

            if (state.screen === 'menu') {
                if (Math.abs(x - CONFIG.CANVAS_WIDTH / 2) < 80) {
                    if (Math.abs(y - 320) < 22) {
                        AudioSys.init();
                        Game.start();
                    } else if (Math.abs(y - 390) < 22) {
                        switchTheme();
                    }
                }
            } else if (state.screen === 'gameover') {
                if (Math.abs(x - CONFIG.CANVAS_WIDTH / 2) < 80) {
                    if (Math.abs(y - 490) < 22) {
                        Game.start();
                    } else if (Math.abs(y - 550) < 22) {
                        Game.reset();
                    }
                }
            }
        });

        // ==================== 初始化 ====================
        Input.init();
        Game.generateDecorations();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
