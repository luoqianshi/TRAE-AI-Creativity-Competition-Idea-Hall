<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>家里有什么 - 家庭物品智能管理</title>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            color: #1a2332;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 12px 40px;
        }

        /* ===== 手机卡片容器 ===== */
        .phone-frame {
            max-width: 420px;
            width: 100%;
            background: #ffffff;
            border-radius: 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10), 0 8px 24px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            padding: 20px 20px 32px;
            position: relative;
            min-height: 700px;
        }

        /* ===== 状态栏 ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #8e9aaf;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f2f5;
            margin-bottom: 16px;
        }

        /* ===== 头部 ===== */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .app-title {
            font-size: 22px;
            font-weight: 700;
            color: #1a2332;
            letter-spacing: -0.3px;
        }

        .app-title span {
            color: #3b82f6;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .header-actions button {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #4b5a6f;
            transition: transform 0.15s;
        }

        .header-actions button:hover {
            transform: scale(1.1);
        }

        /* ===== 页面容器 ===== */
        .page {
            display: none;
            animation: fadeUp 0.25s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 搜索栏（首页专用） ===== */
        .search-bar {
            display: flex;
            background: #f0f3f8;
            border-radius: 30px;
            padding: 4px 4px 4px 18px;
            align-items: center;
            margin-bottom: 18px;
            transition: box-shadow 0.2s;
        }

        .search-bar:focus-within {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.20);
            background: #ffffff;
        }

        .search-bar input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 0;
            font-size: 15px;
            outline: none;
            color: #1a2332;
        }

        .search-bar input::placeholder {
            color: #9aa8bb;
        }

        .search-bar .voice-btn {
            background: #3b82f6;
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .search-bar .voice-btn:hover {
            background: #2563eb;
        }

        /* ===== 快捷入口（首页） ===== */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 22px;
        }

        .quick-actions .qa-item {
            background: #f8faff;
            border-radius: 16px;
            padding: 14px 4px 12px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            border: 1px solid #eef2f8;
        }

        .quick-actions .qa-item:hover {
            background: #eef4ff;
            transform: translateY(-2px);
        }

        .quick-actions .qa-item .icon {
            font-size: 28px;
            display: block;
            margin-bottom: 4px;
        }

        .quick-actions .qa-item .label {
            font-size: 12px;
            color: #4b5a6f;
            font-weight: 500;
        }

        /* ===== 分类标签（首页） ===== */
        .category-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 14px;
            margin-bottom: 14px;
            border-bottom: 1px solid #f0f2f5;
            -webkit-overflow-scrolling: touch;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .category-tabs .tab {
            flex-shrink: 0;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            background: #f0f3f8;
            color: #4b5a6f;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            white-space: nowrap;
        }

        .category-tabs .tab.active {
            background: #1a2332;
            color: #ffffff;
        }

        .category-tabs .tab:hover:not(.active) {
            background: #e2e8f0;
        }

        /* ===== 物品列表（首页 & 清单页共用样式） ===== */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #fafcff;
            border-radius: 16px;
            padding: 14px 16px;
            border: 1px solid #eef2f8;
            transition: all 0.2s;
            cursor: pointer;
        }

        .item-card:hover {
            border-color: #3b82f6;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.08);
        }

        .item-card .emoji {
            font-size: 34px;
            width: 48px;
            text-align: center;
            flex-shrink: 0;
        }

        .item-card .info {
            flex: 1;
            min-width: 0;
        }

        .item-card .info .name {
            font-size: 16px;
            font-weight: 600;
            color: #1a2332;
        }

        .item-card .info .location {
            font-size: 13px;
            color: #8e9aaf;
            margin-top: 2px;
        }

        .item-card .meta {
            text-align: right;
            flex-shrink: 0;
        }

        .item-card .meta .qty {
            font-size: 15px;
            font-weight: 600;
            color: #1a2332;
        }

        .item-card .meta .qty small {
            font-weight: 400;
            font-size: 12px;
            color: #8e9aaf;
        }

        .item-card .meta .expiry {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 4px;
            font-weight: 500;
        }

        .expiry.good {
            background: #dcfce7;
            color: #166534;
        }

        .expiry.warning {
            background: #fef3c7;
            color: #92400e;
        }

        .expiry.danger {
            background: #fee2e2;
            color: #991b1b;
        }

        /* ===== 清单页面 ===== */
        .list-group {
            margin-bottom: 20px;
        }

        .list-group-title {
            font-size: 14px;
            font-weight: 600;
            color: #4b5a6f;
            margin-bottom: 10px;
            padding-left: 4px;
            border-left: 3px solid #3b82f6;
            padding-left: 10px;
        }

        /* ===== 统计页面 ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stats-card {
            background: #f8faff;
            border-radius: 16px;
            padding: 16px 12px;
            text-align: center;
            border: 1px solid #eef2f8;
        }

        .stats-card .number {
            font-size: 28px;
            font-weight: 700;
            color: #1a2332;
        }

        .stats-card .label {
            font-size: 13px;
            color: #8e9aaf;
            margin-top: 4px;
        }

        .stats-card .icon-big {
            font-size: 24px;
            display: block;
            margin-bottom: 6px;
        }

        .stats-chart {
            background: #f8faff;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #eef2f8;
        }

        .stats-chart .chart-title {
            font-size: 14px;
            font-weight: 600;
            color: #1a2332;
            margin-bottom: 12px;
        }

        .chart-bar-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .chart-bar-row .bar-label {
            width: 50px;
            font-size: 13px;
            color: #4b5a6f;
            flex-shrink: 0;
        }

        .chart-bar-row .bar-track {
            flex: 1;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .chart-bar-row .bar-fill {
            height: 100%;
            border-radius: 4px;
            background: #3b82f6;
            transition: width 0.6s;
        }

        .chart-bar-row .bar-count {
            font-size: 13px;
            color: #4b5a6f;
            width: 30px;
            text-align: right;
        }

        /* ===== 我的页面 ===== */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #f8faff;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #eef2f8;
            margin-bottom: 20px;
        }

        .profile-header .avatar {
            font-size: 48px;
            background: #eef4ff;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-header .info .name {
            font-size: 18px;
            font-weight: 600;
        }

        .profile-header .info .desc {
            font-size: 13px;
            color: #8e9aaf;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            background: #fafcff;
            border-radius: 12px;
            border: 1px solid #eef2f8;
            cursor: pointer;
            transition: background 0.2s;
        }

        .menu-item:hover {
            background: #f0f4ff;
        }

        .menu-item .menu-icon {
            font-size: 20px;
            width: 28px;
            text-align: center;
        }

        .menu-item .menu-text {
            flex: 1;
            font-size: 15px;
            color: #1a2332;
        }

        .menu-item .menu-arrow {
            color: #cbd5e1;
        }

        /* ===== 详情页 ===== */
        .detail-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            font-size: 15px;
            color: #3b82f6;
            cursor: pointer;
            padding: 6px 0;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .detail-card {
            background: #f8faff;
            border-radius: 20px;
            padding: 24px 20px;
            border: 1px solid #eef2f8;
            text-align: center;
        }

        .detail-card .big-emoji {
            font-size: 64px;
            margin-bottom: 8px;
        }

        .detail-card .detail-name {
            font-size: 24px;
            font-weight: 700;
        }

        .detail-card .detail-location {
            font-size: 15px;
            color: #8e9aaf;
            margin-top: 4px;
        }

        .detail-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 18px;
            text-align: left;
        }

        .detail-info-item {
            background: #ffffff;
            border-radius: 12px;
            padding: 10px 14px;
            border: 1px solid #eef2f8;
        }

        .detail-info-item .label {
            font-size: 12px;
            color: #8e9aaf;
        }

        .detail-info-item .value {
            font-size: 16px;
            font-weight: 600;
            color: #1a2332;
            margin-top: 2px;
        }

        .detail-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .detail-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            min-width: 80px;
        }

        .btn-primary {
            background: #3b82f6;
            color: #fff;
        }
        .btn-primary:hover {
            background: #2563eb;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid #3b82f6;
            color: #3b82f6;
        }
        .btn-outline:hover {
            background: #eef4ff;
        }
        .btn-danger {
            background: #fee2e2;
            color: #991b1b;
        }
        .btn-danger:hover {
            background: #fecaca;
        }

        /* ===== 底部导航 ===== */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid #f0f2f5;
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #9aa8bb;
            cursor: pointer;
            transition: color 0.2s;
            background: none;
            border: none;
            padding: 4px 12px;
            font-family: inherit;
        }

        .bottom-nav .nav-item .nav-icon {
            font-size: 22px;
            margin-bottom: 2px;
        }

        .bottom-nav .nav-item.active {
            color: #3b82f6;
        }

        .bottom-nav .nav-item:hover {
            color: #3b82f6;
        }

        /* ===== 提示条（首页） ===== */
        .tip-banner {
            background: #eff6ff;
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #1e3a8a;
            border: 1px solid #bfdbfe;
        }

        .tip-banner .tip-icon {
            font-size: 18px;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #8e9aaf;
        }
        .empty-state .big-icon {
            font-size: 56px;
            margin-bottom: 12px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 420px) {
            .phone-frame {
                border-radius: 20px;
                padding: 16px 16px 24px;
            }
            .quick-actions {
                grid-template-columns: repeat(4, 1fr);
                gap: 6px;
            }
            .quick-actions .qa-item {
                padding: 10px 2px 8px;
            }
            .quick-actions .qa-item .icon {
                font-size: 22px;
            }
            .item-card {
                padding: 12px 14px;
            }
            .item-card .emoji {
                font-size: 28px;
                width: 40px;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .detail-info-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>

        <!-- ================================ -->

        <!-- ================================ -->
        <!-- 底部导航 -->
        <!-- ================================ -->
        <div class="bottom-nav">
            <button class="nav-item active" data-page="home">
                <span class="nav-icon">🏠</span>
                <span>首页</span>

            <button class="nav-item" data-page="list">
                <span class="nav-icon">📋</span>

                <span class="nav-icon">👤</span>

    </div>

        // ================================================================
        // 工具函数
        // ================================================================
        function getExpiryInfo(expiry) {
            if (!expiry) return { text: '无保质期', cls: 'good', days: null };
            const now = new Date();
            const exp = new Date(expiry);
            const diff = (exp - now) / (1000 * 60 * 60 * 24);
            if (diff < 0) return { text: '已过期 ⚠️', cls: 'danger', days: Math.floor(diff) };
            if (diff < 30) return { text: `${Math.ceil(diff)}天后过期`, cls: 'warning', days: Math.ceil(diff) };
            return { text: expiry, cls: 'good', days: Math.ceil(diff) };
        }

        function getCategoryLabel(cat) {
            const map = { food: '食品', daily: '日用品', medicine: '药品', tool: '工具', other: '其他' };
            return map[cat] || cat;
        }

        // ================================================================
        // 渲染函数
        // ================================================================

        // ----- 渲染首页物品列表 -----
        let homeFilterCategory = 'all';
        let homeSearchKeyword = '';

        function renderHomeList() {
            const list = document.getElementById('homeItemList');
            const filtered = itemsData.filter(item => {
                const matchCat = homeFilterCategory === 'all' || item.category === homeFilterCategory;
                const matchSearch = item.name.includes(homeSearchKeyword) ||
                    item.location.includes(homeSearchKeyword) ||
                    homeSearchKeyword === '';
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                list.innerHTML = `<div class="empty-state"><div class="big-icon">🔍</div><p>没有找到匹配的物品</p></div>`;
                return;
            }

            list.innerHTML = filtered.map(item => {
                const exp = getExpiryInfo(item.expiry);
                const expiryHtml = item.expiry ?
                    `<span class="expiry ${exp.cls}">${exp.text}</span>` :
                    `<span class="expiry good">无保质期</span>`;
                const borrowedBadge = item.borrowed ? ' 📤' : '';
                return `
                    <div class="item-card" data-id="${item.id}">
                        <div class="emoji">${item.emoji}</div>
                        <div class="info">
                            <div class="name">${item.name}${borrowedBadge}</div>
                            <div class="location">📍 ${item.location}</div>
                        </div>
                        <div class="meta">
                            <div class="qty">${item.qty} <small>${item.unit}</small></div>
                            ${expiryHtml}
                        </div>
                    </div>
                `;
            }).join('');

            // 绑定点击事件（委托）
            list.querySelectorAll('.item-card').forEach(card => {
                card.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    showDetail(id);
                });
            });
        }

        // ----- 渲染清单页（按位置分组） -----
        function renderListPage() {
            const container = document.getElementById('listContainer');
            // 按位置分组
            const groups = {};
            itemsData.forEach(item => {
                const key = item.location.split('›')[0].trim() || '未分类';
                if (!groups[key]) groups[key] = [];
                groups[key].push(item);
            });

            let html = '';
            for (const [place, items] of Object.entries(groups)) {
                html += `<div class="list-group"><div class="list-group-title">📍 ${place}</div><div class="item-list">`;
                items.forEach(item => {
                    const exp = getExpiryInfo(item.expiry);
                    const expiryHtml = item.expiry ?
                        `<span class="expiry ${exp.cls}">${exp.text}</span>` :
                        `<span class="expiry good">无保质期</span>`;
                    html += `
                        <div class="item-card" data-id="${item.id}">
                            <div class="emoji">${item.emoji}</div>
                            <div class="info">
                                <div class="name">${item.name}</div>
                                <div class="location">📍 ${item.location}</div>
                            </div>
                            <div class="meta">
                                <div class="qty">${item.qty} <small>${item.unit}</small></div>
                                ${expiryHtml}
                            </div>
                        </div>
                    `;
                });
                html += `</div></div>`;
            }
            container.innerHTML = html;

            // 绑定点击事件
            container.querySelectorAll('.item-card').forEach(card => {
                card.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    showDetail(id);
                });
            });
        }

        // ----- 渲染统计页 -----
        function renderStatsPage() {
            const total = itemsData.length;
            const categories = {};
            itemsData.forEach(item => {
                categories[item.category] = (categories[item.category] || 0) + 1;
            });
            const expired = itemsData.filter(i => i.expiry && getExpiryInfo(i.expiry).cls === 'danger').length;
            const borrowed = itemsData.filter(i => i.borrowed).length;

            document.getElementById('statsGrid').innerHTML = `
                <div class="stats-card"><span class="icon-big">📦</span><div class="number">${total}</div><div class="label">总物品</div></div>
                <div class="stats-card"><span class="icon-big">🏷️</span><div class="number">${Object.keys(categories).length}</div><div class="label">分类数</div></div>
                <div class="stats-card"><span class="icon-big">⚠️</span><div class="number">${expired}</div><div class="label">过期/临期</div></div>
                <div class="stats-card"><span class="icon-big">📤</span><div class="number">${borrowed}</div><div class="label">借出中</div></div>
            `;

            // 条形图
            const maxCount = Math.max(...Object.values(categories), 1);
            const chartContainer = document.getElementById('chartBars');
            let chartHtml = '';
            for (const [cat, count] of Object.entries(categories)) {
                const percent = (count / maxCount * 100).toFixed(0);
                chartHtml += `
                    <div class="chart-bar-row">
                        <span class="bar-label">${getCategoryLabel(cat)}</span>
                        <div class="bar-track"><div class="bar-fill" style="width:${percent}%;"></div></div>
                        <span class="bar-count">${count}</span>
                    </div>
                `;
            }
            chartContainer.innerHTML = chartHtml;
        }

        // ----- 详情页 -----
        function showDetail(id) {
            const item = itemsData.find(i => i.id === id);
            if (!item) return;

            const card = document.getElementById('detailCard');
            const exp = getExpiryInfo(item.expiry);
            const expiryDisplay = item.expiry ? `${exp.text}` : '无保质期';
            const borrowedStatus = item.borrowed ? `已借给 ${item.borrower || '未知'}` : '未借出';

            card.innerHTML = `
                <div class="big-emoji">${item.emoji}</div>
                <div class="detail-name">${item.name}</div>
                <div class="detail-location">📍 ${item.location}</div>
                <div class="detail-info-grid">
                    <div class="detail-info-item"><div class="label">数量</div><div class="value">${item.qty} ${item.unit}</div></div>
                    <div class="detail-info-item"><div class="label">保质期</div><div class="value">${expiryDisplay}</div></div>
                    <div class="detail-info-item"><div class="label">分类</div><div class="value">${getCategoryLabel(item.category)}</div></div>
                    <div class="detail-info-item"><div class="label">借出状态</div><div class="value">${borrowedStatus}</div></div>
                </div>
                ${item.notes ? `<div style="margin-top:12px;font-size:14px;color:#4b5a6f;text-align:left;background:#fff;border-radius:12px;padding:10px 14px;border:1px solid #eef2f8;">📝 ${item.notes}</div>` : ''}
                <div class="detail-actions">
                    <button class="btn-primary" onclick="alert('✏️ 编辑物品：${item.name}')">编辑</button>
                    <button class="btn-outline" onclick="toggleBorrow(${item.id})">${item.borrowed ? '📥 归还' : '📤 借出'}</button>
                    <button class="btn-danger" onclick="deleteItem(${item.id})">删除</button>
                </div>
            `;

            // 切换页面
            switchPage('detail');
        }

        // 切换借出状态
        function toggleBorrow(id) {
            const item = itemsData.find(i => i.id === id);
            if (!item) return;
            if (item.borrowed) {
                // 归还
                item.borrowed = false;
                item.borrower = '';
                alert(`✅ 已归还「${item.name}」`);
            } else {
                const name = prompt('请输入借用人姓名：', '邻居');
                if (name !== null && name.trim() !== '') {
                    item.borrowed = true;
                    item.borrower = name.trim();
                    alert(`📤 已标记「${item.name}」借给 ${item.borrower}`);
                }
            }
            // 刷新所有相关视图
            refreshAll();
            // 重新显示详情
            showDetail(id);
        }

        // 删除物品
        function deleteItem(id) {
            if (confirm('确定要删除这件物品吗？')) {
                const idx = itemsData.findIndex(i => i.id === id);
                if (idx !== -1) {
                    itemsData.splice(idx, 1);
                    alert('🗑️ 已删除');
                    refreshAll();
                    // 返回首页
                    switchPage('home');
                }
            }
        }

        // ----- 刷新所有页面 -----
        function refreshAll() {
            renderHomeList();
            renderListPage();
            renderStatsPage();
            // 如果当前在详情页，可能需要重新渲染，但由调用者决定
        }

        // ================================================================
        // 页面切换
        // ================================================================
        function switchPage(pageName) {
            // 隐藏所有页面
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            // 显示目标
            const target = document.getElementById(`page-${pageName}`);
            if (target) target.classList.add('active');

            // 底部导航高亮（仅在主页面时）
            const mainPages = ['home', 'list', 'stats', 'profile'];
            if (mainPages.includes(pageName)) {
                document.querySelectorAll('.bottom-nav .nav-item').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.page === pageName);
                });
            } else {
                // 如果是详情页，底部导航全部取消高亮（或保留之前？这里保留上次主页面高亮，但我们手动设置）
                // 但我们不取消高亮，让导航看起来还在，但点击会切换回去。
                // 也可以不加高亮，但我们会保持底部导航始终显示，且高亮对应主页面。
                // 因为详情页是从首页或清单点进去的，我们保持高亮为之前的主页，但为了视觉统一，在详情页时我们暂时移除所有高亮？这里我们保留上次的主页高亮不变。
                // 更好：在进入详情页时，记录当前主页面，我们可以在点击导航时强制切换。
                // 我们简单处理：从详情页返回时，主页自动高亮。
            }
        }

        // ================================================================
        // 底部导航点击
        // ================================================================
        document.querySelectorAll('.bottom-nav .nav-item').forEach(btn => {
            btn.addEventListener('click', function() {
                const page = this.dataset.page;
                // 如果当前在详情页，强制回到对应主页面
                switchPage(page);
                // 刷新对应页面（如果是首页、清单、统计、我的）
                if (page === 'home') renderHomeList();
                else if (page === 'list') renderListPage();
                else if (page === 'stats') renderStatsPage();
                // 我的不用刷新
                // 如果从详情页返回，还需要重置搜索？不需要
                // 另外，如果当前是详情页，点击导航会覆盖，但需要把详情页隐藏，由switchPage处理
            });
        });

        // ================================================================
        // 首页搜索和筛选
        // ================================================================
        document.getElementById('searchInput').addEventListener('input', function() {
            homeSearchKeyword = this.value.trim();
            renderHomeList();
        });

        document.getElementById('voiceBtn').addEventListener('click', function() {
            alert('🎤 语音识别（演示）：将搜索“感冒”');
            document.getElementById('searchInput').value = '感冒';
            homeSearchKeyword = '感冒';
            renderHomeList();
        });

        // 快捷入口点击
        document.querySelectorAll('.quick-actions .qa-item').forEach(el => {
            el.addEventListener('click', function() {
                const cat = this.dataset.cat;
                homeFilterCategory = cat;
                // 更新标签高亮
                document.querySelectorAll('.category-tabs .tab').forEach(tab => {
                    tab.classList.toggle('active', tab.dataset.cat === cat);
                });
                renderHomeList();
            });
        });

        // 分类标签点击
        document.querySelectorAll('.category-tabs .tab').forEach(tab => {
            tab.addEventListener('click', function() {
                const cat = this.dataset.cat;
                homeFilterCategory = cat;
                document.querySelectorAll('.category-tabs .tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                renderHomeList();
            });
        });

        // ================================================================
        // 详情页返回按钮
        // ================================================================
        document.getElementById('detailBackBtn').addEventListener('click', function() {
            // 回到之前的主页（默认首页）
            switchPage('home');
            renderHomeList();
            // 同时将底部导航高亮设为首页
            document.querySelectorAll('.bottom-nav .nav-item').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.page === 'home');
            });
        });

        // ================================================================
        // 全局添加按钮
        // ================================================================
        document.getElementById('globalAddBtn').addEventListener('click', function() {
            const name = prompt('请输入物品名称：');
            if (name && name.trim() !== '') {
                const location = prompt('请输入存放位置（如 厨房 › 吊柜）：', '未分类');
                const qty = parseInt(prompt('数量：', '1')) || 1;
                const unit = prompt('单位：', '个') || '个';
                const category = prompt('分类（food/daily/medicine/tool/other）：', 'other') || 'other';
                // 生成新ID
                const newId = Math.max(...itemsData.map(i => i.id), 0) + 1;
                itemsData.push({
                    id: newId,
                    name: name.trim(),
                    emoji: '📦',
                    category: category,
                    location: location || '未分类',
                    qty: qty,
                    unit: unit,
                    expiry: null,
                    status: 'good',
                    borrowed: false,
                    borrower: '',
                    notes: ''
                });
                refreshAll();
                alert('✅ 已添加物品');
            }
        });

        // ================================================================
        // 全局分享按钮（演示）
        // ================================================================
        document.getElementById('globalShareBtn').addEventListener('click', function() {
            alert('👥 分享家庭清单给其他成员（演示）');
        });

        // ================================================================
        // 初始化渲染
        // ================================================================
        function init() {
            renderHomeList();
            renderListPage();
            renderStatsPage();
            // 默认首页激活
            switchPage('home');
        }

        init();

        // 暴露 toggleBorrow, deleteItem 给全局（用于 onclick）
        window.toggleBorrow = toggleBorrow;
        window.deleteItem = deleteItem;
        window.showDetail = showDetail;
        window.switchPage = switchPage;

        console.log('🏠 「家里有什么」完整版已加载！');
        console.log(`📦 共 ${itemsData.length} 件物品`);
    </script>
