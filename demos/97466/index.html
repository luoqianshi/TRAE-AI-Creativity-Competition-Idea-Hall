<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日热量追踪器 - TRAE AI 大赛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #0ea5e9 0%, #10b981 100%);
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --success-color: #10b981;
            --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            --card-shadow: 0 10px 40px rgba(14, 165, 233, 0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            padding: 20px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            animation: fadeIn 0.6s ease-out;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 20px;
            background: var(--primary-gradient);
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0%, 100% { transform: translate(-30%, -30%) rotate(0deg); }
            50% { transform: translate(-30%, -30%) rotate(180deg); }
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.95;
            position: relative;
            z-index: 1;
        }

        /* Stats Panel */
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 60px rgba(14, 165, 233, 0.25);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--primary-gradient);
        }

        .stat-label {
            font-size: 1rem;
            color: #64748b;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .stat-value {
            font-size: 3rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
            transition: var(--transition);
        }

        .stat-unit {
            font-size: 1.1rem;
            color: #94a3b8;
            font-weight: 600;
        }

        /* Status Card */
        .status-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--card-shadow);
            margin-bottom: 40px;
            text-align: center;
            transition: var(--transition);
            border: 3px solid transparent;
        }

        .status-card.excess {
            border-color: var(--danger-color);
            background: linear-gradient(135deg, #fff 0%, #fef2f2 100%);
        }

        .status-card.balanced {
            border-color: var(--success-color);
            background: linear-gradient(135deg, #fff 0%, #f0fdf4 100%);
        }

        .status-card.insufficient {
            border-color: var(--warning-color);
            background: linear-gradient(135deg, #fff 0%, #fffbeb 100%);
        }

        .status-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounceIn 0.6s ease-out;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .status-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 15px;
            transition: var(--transition);
        }

        .status-card.excess .status-title {
            color: var(--danger-color);
        }

        .status-card.balanced .status-title {
            color: var(--success-color);
        }

        .status-card.insufficient .status-title {
            color: var(--warning-color);
        }

        .status-message {
            font-size: 1.1rem;
            color: #64748b;
            line-height: 1.6;
        }

        /* Input Section */
        .input-section {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--card-shadow);
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 30px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .input-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: #334155;
        }

        .input-field {
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1.1rem;
            transition: var(--transition);
            background: #f8fafc;
        }

        .input-field:focus {
            outline: none;
            border-color: #0ea5e9;
            background: white;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(14, 165, 233, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4);
        }

        /* Records Section */
        .records-section {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--card-shadow);
        }

        .records-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .records-list::-webkit-scrollbar {
            width: 8px;
        }

        .records-list::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }

        .records-list::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #0ea5e9, #10b981);
            border-radius: 10px;
        }

        .record-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
            border-left: 4px solid;
            transition: var(--transition);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .record-item.intake {
            border-left-color: var(--success-color);
        }

        .record-item.expense {
            border-left-color: var(--warning-color);
        }

        .record-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .record-info {
            flex: 1;
        }

        .record-type {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .record-type.intake {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
        }

        .record-type.expense {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning-color);
        }

        .record-description {
            font-size: 1.1rem;
            color: #334155;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .record-time {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .record-calories {
            font-size: 1.5rem;
            font-weight: 700;
            margin-right: 20px;
        }

        .record-item.intake .record-calories {
            color: var(--success-color);
        }

        .record-item.expense .record-calories {
            color: var(--warning-color);
        }

        .delete-btn {
            background: #fee2e2;
            color: var(--danger-color);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .delete-btn:hover {
            background: var(--danger-color);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 1.2rem;
        }

        /* Settings Section */
        .settings-section {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--card-shadow);
            margin-bottom: 40px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .stats-panel {
                grid-template-columns: 1fr;
            }

            .stat-value {
                font-size: 2.5rem;
            }

            .input-group {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .record-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .record-calories {
                margin: 10px 0;
            }

            .delete-btn {
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🏃 每日热量追踪器</h1>
            <p>记录您的饮食摄取与运动消耗，保持健康生活</p>
        </div>

        <!-- Stats Panel -->
        <div class="stats-panel">
            <div class="stat-card">
                <div class="stat-label">今日摄取热量</div>
                <div class="stat-value" id="intakeCalories">0</div>
                <div class="stat-unit">千卡</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">今日消耗热量</div>
                <div class="stat-value" id="expenseCalories">0</div>
                <div class="stat-unit">千卡</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">净热量</div>
                <div class="stat-value" id="netCalories">0</div>
                <div class="stat-unit">千卡</div>
            </div>
        </div>

        <!-- Status Card -->
        <div class="status-card balanced" id="statusCard">
            <div class="status-icon" id="statusIcon">⚖️</div>
            <div class="status-title" id="statusTitle">能量适中</div>
            <div class="status-message" id="statusMessage">
                今日热量摄入与消耗保持平衡，继续保持良好的饮食习惯！
            </div>
        </div>

        <!-- Input Section -->
        <div class="input-section">
            <h2 class="section-title">📝 添加记录</h2>
            <div class="input-group">
                <div class="input-wrapper">
                    <label class="input-label">描述</label>
                    <input type="text" class="input-field" id="descriptionInput" placeholder="例如：早餐、跑步30分钟">
                </div>
                <div class="input-wrapper">
                    <label class="input-label">热量 (千卡)</label>
                    <input type="number" class="input-field" id="caloriesInput" placeholder="输入热量值">
                </div>
            </div>
            <div class="button-group">
                <button class="btn btn-primary" onclick="addIntake()">🍎 添加食物摄取</button>
                <button class="btn btn-secondary" onclick="addExpense()">🏃 添加运动消耗</button>
            </div>
        </div>

        <!-- Settings Section -->
        <div class="settings-section">
            <h2 class="section-title">⚙️ 设置</h2>
            <div class="input-group">
                <div class="input-wrapper">
                    <label class="input-label">基础代谢率 (BMR)</label>
                    <input type="number" class="input-field" id="bmrInput" placeholder="例如：1500">
                </div>
                <div class="input-wrapper">
                    <label class="input-label">每日目标热量 (千卡)</label>
                    <input type="number" class="input-field" id="targetInput" placeholder="例如：2000">
                </div>
            </div>
            <div class="button-group">
                <button class="btn btn-primary" onclick="saveSettings()">💾 保存设置</button>
            </div>
        </div>

        <!-- Records Section -->
        <div class="records-section">
            <h2 class="section-title">📋 今日记录</h2>
            <div class="records-list" id="recordsList">
                <div class="empty-state">
                    <div class="empty-state-icon">📝</div>
                    <div class="empty-state-text">暂无记录，开始添加您的第一条记录吧！</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 数据存储键名
        const STORAGE_KEYS = {
            RECORDS: 'calorie_records',
            SETTINGS: 'user_settings'
        };

        // 默认设置
        const DEFAULT_SETTINGS = {
            bmr: 1500,
            dailyTarget: 2000
        };

        // 状态管理
        let state = {
            records: [],
            settings: DEFAULT_SETTINGS
        };

        // 初始化
        function init() {
            loadSettings();
            loadRecords();
            updateDisplay();
        }

        // 加载设置
        function loadSettings() {
            const saved = localStorage.getItem(STORAGE_KEYS.SETTINGS);
            if (saved) {
                state.settings = JSON.parse(saved);
            }
            document.getElementById('bmrInput').value = state.settings.bmr;
            document.getElementById('targetInput').value = state.settings.dailyTarget;
        }

        // 加载记录
        function loadRecords() {
            const saved = localStorage.getItem(STORAGE_KEYS.RECORDS);
            if (saved) {
                const allRecords = JSON.parse(saved);
                // 只保留今天的记录
                const today = getTodayDate();
                state.records = allRecords.filter(record => record.date === today);
                // 更新localStorage，清理过期数据
                saveRecords();
            }
        }

        // 保存设置
        function saveSettings() {
            const bmr = parseInt(document.getElementById('bmrInput').value) || DEFAULT_SETTINGS.bmr;
            const dailyTarget = parseInt(document.getElementById('targetInput').value) || DEFAULT_SETTINGS.dailyTarget;

            state.settings = { bmr, dailyTarget };
            localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify(state.settings));

            updateDisplay();
            showNotification('设置已保存！');
        }

        // 保存记录
        function saveRecords() {
            localStorage.setItem(STORAGE_KEYS.RECORDS, JSON.stringify(state.records));
        }

        // 获取今天日期
        function getTodayDate() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }

        // 添加食物摄取
        function addIntake() {
            const description = document.getElementById('descriptionInput').value.trim();
            const calories = parseInt(document.getElementById('caloriesInput').value);

            if (!description || !calories) {
                showNotification('请填写完整信息！', 'error');
                return;
            }

            const record = {
                id: Date.now().toString(),
                type: 'intake',
                description,
                calories,
                timestamp: new Date().toISOString(),
                date: getTodayDate()
            };

            state.records.push(record);
            saveRecords();
            updateDisplay();

            // 清空输入
            document.getElementById('descriptionInput').value = '';
            document.getElementById('caloriesInput').value = '';

            showNotification('已添加食物摄取记录！');
        }

        // 添加运动消耗
        function addExpense() {
            const description = document.getElementById('descriptionInput').value.trim();
            const calories = parseInt(document.getElementById('caloriesInput').value);

            if (!description || !calories) {
                showNotification('请填写完整信息！', 'error');
                return;
            }

            const record = {
                id: Date.now().toString(),
                type: 'expense',
                description,
                calories,
                timestamp: new Date().toISOString(),
                date: getTodayDate()
            };

            state.records.push(record);
            saveRecords();
            updateDisplay();

            // 清空输入
            document.getElementById('descriptionInput').value = '';
            document.getElementById('caloriesInput').value = '';

            showNotification('已添加运动消耗记录！');
        }

        // 删除记录
        function deleteRecord(id) {
            state.records = state.records.filter(record => record.id !== id);
            saveRecords();
            updateDisplay();
            showNotification('记录已删除！');
        }

        // 更新显示
        function updateDisplay() {
            // 计算热量
            const totalIntake = state.records
                .filter(r => r.type === 'intake')
                .reduce((sum, r) => sum + r.calories, 0);

            const totalExpense = state.records
                .filter(r => r.type === 'expense')
                .reduce((sum, r) => sum + r.calories, 0);

            const netCalories = totalIntake - totalExpense;

            // 更新统计数字
            animateNumber('intakeCalories', totalIntake);
            animateNumber('expenseCalories', totalExpense);
            animateNumber('netCalories', netCalories);

            // 更新状态卡片
            updateStatusCard(netCalories);

            // 更新记录列表
            updateRecordsList();
        }

        // 数字动画
        function animateNumber(elementId, targetValue) {
            const element = document.getElementById(elementId);
            const currentValue = parseInt(element.textContent) || 0;
            const diff = targetValue - currentValue;
            const duration = 300;
            const steps = 20;
            const stepValue = diff / steps;
            let step = 0;

            const timer = setInterval(() => {
                step++;
                const newValue = Math.round(currentValue + stepValue * step);
                element.textContent = newValue;

                if (step >= steps) {
                    clearInterval(timer);
                    element.textContent = targetValue;
                }
            }, duration / steps);
        }

        // 更新状态卡片
        function updateStatusCard(netCalories) {
            const statusCard = document.getElementById('statusCard');
            const statusIcon = document.getElementById('statusIcon');
            const statusTitle = document.getElementById('statusTitle');
            const statusMessage = document.getElementById('statusMessage');

            const bmr = state.settings.bmr;
            const upperLimit = bmr + 500;
            const lowerLimit = bmr - 500;

            statusCard.classList.remove('excess', 'balanced', 'insufficient');

            if (netCalories > upperLimit) {
                statusCard.classList.add('excess');
                statusIcon.textContent = '⚠️';
                statusTitle.textContent = '能量过多';
                const excess = netCalories - upperLimit;
                statusMessage.textContent = `今日热量摄入超出推荐量约${excess}千卡，建议适当增加运动或减少摄入。`;
            } else if (netCalories < lowerLimit) {
                statusCard.classList.add('insufficient');
                statusIcon.textContent = '⚡';
                statusTitle.textContent = '能量不足';
                const deficit = lowerLimit - netCalories;
                statusMessage.textContent = `今日热量摄入低于基础代谢约${deficit}千卡，建议适当补充营养。`;
            } else {
                statusCard.classList.add('balanced');
                statusIcon.textContent = '✅';
                statusTitle.textContent = '能量适中';
                statusMessage.textContent = '今日热量摄入与消耗保持平衡，继续保持良好的饮食习惯！';
            }
        }

        // 更新记录列表
        function updateRecordsList() {
            const recordsList = document.getElementById('recordsList');

            if (state.records.length === 0) {
                recordsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <div class="empty-state-text">暂无记录，开始添加您的第一条记录吧！</div>
                    </div>
                `;
                return;
            }

            // 按时间倒序排列
            const sortedRecords = [...state.records].sort((a, b) =>
                new Date(b.timestamp) - new Date(a.timestamp)
            );

            recordsList.innerHTML = sortedRecords.map(record => `
                <div class="record-item ${record.type}">
                    <div class="record-info">
                        <div class="record-type ${record.type}">
                            ${record.type === 'intake' ? '🍎 食物摄取' : '🏃 运动消耗'}
                        </div>
                        <div class="record-description">${record.description}</div>
                        <div class="record-time">${formatTime(record.timestamp)}</div>
                    </div>
                    <div class="record-calories">${record.type === 'intake' ? '+' : '-'}${record.calories} 千卡</div>
                    <button class="delete-btn" onclick="deleteRecord('${record.id}')">删除</button>
                </div>
            `).join('');
        }

        // 格式化时间
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        // 显示通知
        function showNotification(message, type = 'success') {
            // 创建通知元素
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 25px;
                border-radius: 12px;
                color: white;
                font-weight: 600;
                font-size: 1rem;
                z-index: 1000;
                animation: slideInRight 0.3s ease-out;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            `;

            if (type === 'error') {
                notification.style.background = 'linear-gradient(135deg, #ef4444, #dc2626)';
            } else {
                notification.style.background = 'linear-gradient(135deg, #10b981, #059669)';
            }

            notification.textContent = message;
            document.body.appendChild(notification);

            // 3秒后移除
            setTimeout(() => {
                notification.style.animation = 'slideOutRight 0.3s ease-out';
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 300);
            }, 3000);
        }

        // 添加动画样式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideInRight {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            @keyframes slideOutRight {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(100%);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // 页面加载时初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
