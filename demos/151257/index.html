<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>维他命日记</title>
  <style>
    /* ===== 重置与基础 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #f5f5f5;
      color: #333;
      -webkit-font-smoothing: antialiased;
    }
    #app {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      background: #fafafa;
      position: relative;
      padding-bottom: 64px;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }

    /* ===== 底部Tab导航 ===== */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
    }
    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 0;
      cursor: pointer;
      border: none;
      background: none;
      transition: all 0.2s;
    }
    .tab-item .tab-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
    }
    .tab-item .tab-label {
      font-size: 11px;
      color: #999;
      font-weight: 500;
    }
    .tab-item.active .tab-icon,
    .tab-item.active .tab-label {
      color: #10b981;
    }
    .tab-item:active { transform: scale(0.95); }

    /* ===== 页面通用 ===== */
    .page { display: none; padding: 20px; animation: fadeIn 0.2s ease-out; }
    .page.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== 卡片 ===== */
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 16px;
    }

    /* ===== 首页：日期选择 ===== */
    .date-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .date-bar .date-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #fff;
      border: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #666;
      transition: all 0.2s;
    }
    .date-bar .date-btn:active { transform: scale(0.9); }
    .date-bar .date-text {
      font-size: 17px;
      font-weight: 600;
      color: #333;
    }
    .today-btn {
      font-size: 12px;
      color: #10b981;
      background: #ecfdf5;
      border: none;
      padding: 4px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
    }

    /* ===== 营养评分卡片 ===== */
    .score-card {
      background: linear-gradient(135deg, #10b981, #14b8a6);
      border-radius: 24px;
      padding: 28px 20px;
      text-align: center;
      color: #fff;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(16,185,129,0.2);
    }
    .score-card .score-label { font-size: 13px; opacity: 0.9; margin-bottom: 8px; }
    .score-card .score-value { font-size: 48px; font-weight: 700; line-height: 1; }
    .score-card .score-unit { font-size: 13px; opacity: 0.9; margin-top: 4px; }
    .score-bar {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.25);
      border-radius: 3px;
      margin-top: 16px;
      overflow: hidden;
    }
    .score-bar-fill {
      height: 100%;
      background: #fff;
      border-radius: 3px;
      transition: width 0.5s ease-out;
    }

    /* ===== 维生素进度条 ===== */
    .vitamin-list { display: flex; flex-direction: column; gap: 16px; }
    .vitamin-item { }
    .vitamin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .vitamin-name { font-size: 14px; font-weight: 500; color: #555; }
    .vitamin-percent { font-size: 13px; font-weight: 600; }
    .progress-bar {
      width: 100%;
      height: 10px;
      background: #f0f0f0;
      border-radius: 5px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.5s ease-out;
    }
    .status-sufficient .progress-fill { background: linear-gradient(90deg, #34d399, #10b981); }
    .status-sufficient .vitamin-percent { color: #10b981; }
    .status-normal .progress-fill { background: linear-gradient(90deg, #60a5fa, #3b82f6); }
    .status-normal .vitamin-percent { color: #3b82f6; }
    .status-mild .progress-fill { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
    .status-mild .vitamin-percent { color: #f59e0b; }
    .status-severe .progress-fill { background: linear-gradient(90deg, #f87171, #ef4444); }
    .status-severe .vitamin-percent { color: #ef4444; }

    /* ===== 快速记录按钮 ===== */
    .quick-record-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #10b981, #14b8a6);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(16,185,129,0.25);
    }
    .quick-record-btn:active { transform: scale(0.98); }

    /* ===== 餐次概览 ===== */
    .meal-overview { display: flex; gap: 12px; }
    .meal-dot {
      flex: 1;
      text-align: center;
      padding: 12px 4px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .meal-dot .meal-emoji { font-size: 20px; }
    .meal-dot .meal-name { font-size: 11px; color: #999; margin-top: 4px; }
    .meal-dot .meal-count { font-size: 12px; font-weight: 600; color: #ccc; }
    .meal-dot.has-records .meal-count { color: #10b981; }

    /* ===== 记录页：餐次区域 ===== */
    .meal-section {
      background: #fff;
      border-radius: 16px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .meal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      cursor: pointer;
      user-select: none;
    }
    .meal-header-left { display: flex; align-items: center; gap: 8px; }
    .meal-header-left .meal-emoji { font-size: 18px; }
    .meal-header-left .meal-label { font-size: 15px; font-weight: 600; color: #333; }
    .meal-header-left .meal-badge {
      font-size: 11px;
      color: #999;
      background: #f5f5f5;
      padding: 2px 8px;
      border-radius: 8px;
    }
    .meal-toggle { font-size: 14px; color: #ccc; transition: transform 0.2s; }
    .meal-section.collapsed .meal-toggle { transform: rotate(-90deg); }
    .meal-records { padding: 0 16px 12px; }
    .meal-section.collapsed .meal-records { display: none; }

    .food-record {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #f9fafb;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .food-record-left { display: flex; align-items: center; gap: 8px; }
    .food-record-left .food-emoji { font-size: 18px; }
    .food-record-left .food-name { font-size: 14px; color: #333; }
    .food-record-left .food-portion { font-size: 12px; color: #999; }
    .delete-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: #fef2f2;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ef4444;
      font-size: 14px;
      transition: all 0.2s;
    }
    .delete-btn:active { transform: scale(0.9); }

    .add-food-btn {
      width: 100%;
      padding: 10px;
      border: 1.5px dashed #d1d5db;
      background: transparent;
      border-radius: 12px;
      color: #10b981;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 4px;
      transition: all 0.2s;
    }
    .add-food-btn:active { background: #ecfdf5; }

    .empty-state {
      text-align: center;
      padding: 12px;
      color: #ccc;
      font-size: 13px;
    }

    /* ===== 添加食物面板 ===== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
      display: none;
      opacity: 0;
      transition: opacity 0.25s;
    }
    .overlay.show { display: block; opacity: 1; }

    .food-panel {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) translateY(100%);
      width: 100%;
      max-width: 600px;
      height: 80vh;
      background: #fff;
      border-radius: 24px 24px 0 0;
      z-index: 201;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }
    .food-panel.show { transform: translateX(-50%) translateY(0); }
    .panel-handle {
      width: 36px;
      height: 4px;
      background: #ddd;
      border-radius: 2px;
      margin: 10px auto 6px;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px 12px;
    }
    .panel-title { font-size: 17px; font-weight: 600; color: #333; }
    .panel-close {
      width: 28px; height: 28px;
      border: none; background: #f5f5f5;
      border-radius: 50%; cursor: pointer;
      font-size: 16px; color: #999;
    }
    .search-box {
      margin: 0 20px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f5f5f5;
      border-radius: 12px;
      padding: 10px 14px;
    }
    .search-box input {
      flex: 1;
      border: none; background: none; outline: none;
      font-size: 15px; color: #333;
    }
    .search-box .search-icon { color: #999; font-size: 16px; }

    .category-tabs {
      display: flex;
      gap: 8px;
      padding: 0 20px 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }
    .cat-tab {
      padding: 6px 14px;
      border: none;
      background: #f5f5f5;
      border-radius: 20px;
      font-size: 13px;
      color: #666;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .cat-tab.active {
      background: #10b981;
      color: #fff;
      font-weight: 500;
    }

    .food-grid {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 20px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .food-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      background: #f9fafb;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
    }
    .food-card:active {
      transform: scale(0.96);
      border-color: #10b981;
    }
    .food-card .food-emoji { font-size: 24px; }
    .food-card .food-name { font-size: 14px; color: #333; font-weight: 500; }

    /* ===== 份量选择器 ===== */
    .portion-selector {
      display: none;
      padding: 0 20px 20px;
    }
    .portion-selector.show { display: block; }
    .portion-title {
      font-size: 15px;
      font-weight: 600;
      color: #333;
      margin-bottom: 12px;
      text-align: center;
    }
    .portion-options { display: flex; gap: 10px; }
    .portion-opt {
      flex: 1;
      padding: 14px 8px;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #fff;
    }
    .portion-opt.selected {
      border-color: #10b981;
      background: #ecfdf5;
    }
    .portion-opt .opt-label { font-size: 14px; font-weight: 600; color: #333; }
    .portion-opt .opt-grams { font-size: 12px; color: #999; margin-top: 2px; }
    .confirm-btn {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .confirm-btn:active { transform: scale(0.98); }

    /* ===== 分析页 ===== */
    .analysis-bar-chart {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
      height: 160px;
      padding-top: 20px;
    }
    .bar-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .bar-pair {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 120px;
    }
    .bar-actual, .bar-recommended {
      width: 12px;
      border-radius: 4px 4px 0 0;
      transition: height 0.5s ease-out;
    }
    .bar-actual { background: #10b981; }
    .bar-recommended { background: #e5e7eb; }
    .bar-label { font-size: 10px; color: #999; text-align: center; line-height: 1.2; }

    .detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #f3f4f6;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-left { display: flex; align-items: center; gap: 8px; }
    .detail-name { font-size: 14px; color: #333; font-weight: 500; }
    .detail-value { font-size: 12px; color: #999; }
    .detail-right { display: flex; align-items: center; gap: 8px; }
    .detail-gap { font-size: 12px; color: #999; }
    .status-badge {
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 10px;
      font-weight: 500;
    }
    .badge-sufficient { background: #d1fae5; color: #059669; }
    .badge-normal { background: #dbeafe; color: #2563eb; }
    .badge-mild { background: #fef3c7; color: #d97706; }
    .badge-severe { background: #fee2e2; color: #dc2626; }

    .top-deficient {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .top-deficient-title {
      font-size: 14px;
      font-weight: 600;
      color: #92400e;
      margin-bottom: 10px;
    }
    .deficient-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
    }
    .deficient-name { font-size: 13px; color: #78350f; }
    .deficient-gap { font-size: 13px; color: #b45309; font-weight: 600; }

    .empty-analysis {
      text-align: center;
      padding: 60px 20px;
      color: #ccc;
    }
    .empty-analysis .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-analysis .empty-text { font-size: 15px; margin-bottom: 4px; }
    .empty-analysis .empty-hint { font-size: 13px; }

    /* ===== 页面标题 ===== */
    .page-title {
      font-size: 22px;
      font-weight: 700;
      color: #333;
      margin-bottom: 4px;
    }
    .page-subtitle {
      font-size: 13px;
      color: #999;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- ===== 首页 ===== -->
    <div id="page-home" class="page active">
      <div class="date-bar">
        <button class="date-btn" onclick="changeDate(-1)">‹</button>
        <div style="text-align:center">
          <div class="date-text" id="home-date-text"></div>
          <span id="home-today-btn" style="display:none"><button class="today-btn" onclick="goToToday()">回到今天</button></span>
        </div>
        <button class="date-btn" onclick="changeDate(1)">›</button>
      </div>

      <div class="score-card">
        <div class="score-label">今日营养均衡度</div>
        <div class="score-value" id="home-score">0</div>
        <div class="score-unit">综合评分</div>
        <div class="score-bar">
          <div class="score-bar-fill" id="home-score-bar" style="width:0%"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">今日维生素摄入</div>
        <div class="vitamin-list" id="home-vitamin-list"></div>
      </div>

      <button class="quick-record-btn" onclick="switchTab('record')">立即记录饮食</button>

      <div class="card" style="margin-top:16px">
        <div class="card-title">今日餐次</div>
        <div class="meal-overview" id="home-meal-overview"></div>
      </div>
    </div>

    <!-- ===== 记录页 ===== -->
    <div id="page-record" class="page">
      <div class="page-title">饮食记录</div>
      <div class="page-subtitle" id="record-date-text"></div>
      <div id="record-meals"></div>
    </div>

    <!-- ===== 分析页 ===== -->
    <div id="page-analysis" class="page">
      <div class="page-title">营养分析</div>
      <div class="page-subtitle" id="analysis-date-text"></div>
      <div id="analysis-content"></div>
    </div>

    <!-- ===== 底部Tab ===== -->
    <div class="tab-bar">
      <button class="tab-item active" data-tab="home" onclick="switchTab('home')">
        <div class="tab-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <div class="tab-label">首页</div>
      </button>
      <button class="tab-item" data-tab="record" onclick="switchTab('record')">
        <div class="tab-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        <div class="tab-label">记录</div>
      </button>
      <button class="tab-item" data-tab="analysis" onclick="switchTab('analysis')">
        <div class="tab-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
        </div>
        <div class="tab-label">分析</div>
      </button>
    </div>

    <!-- ===== 添加食物面板 ===== -->
    <div class="overlay" id="overlay" onclick="closeFoodPanel()"></div>
    <div class="food-panel" id="food-panel">
      <div class="panel-handle"></div>
      <div class="panel-header">
        <div class="panel-title" id="panel-title">添加食物</div>
        <button class="panel-close" onclick="closeFoodPanel()">✕</button>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="搜索食材..." oninput="renderFoodGrid()">
      </div>
      <div class="category-tabs" id="category-tabs"></div>
      <div class="food-grid" id="food-grid"></div>
      <div class="portion-selector" id="portion-selector">
        <div class="portion-title" id="portion-food-name"></div>
        <div class="portion-options">
          <div class="portion-opt" data-portion="small" onclick="selectPortion('small')">
            <div class="opt-label">小份</div>
            <div class="opt-grams">约50g</div>
          </div>
          <div class="portion-opt selected" data-portion="medium" onclick="selectPortion('medium')">
            <div class="opt-label">中份</div>
            <div class="opt-grams">约150g</div>
          </div>
          <div class="portion-opt" data-portion="large" onclick="selectPortion('large')">
            <div class="opt-label">大份</div>
            <div class="opt-grams">约300g</div>
          </div>
        </div>
        <button class="confirm-btn" onclick="confirmAddFood()">确认添加</button>
      </div>
    </div>
  </div>

<script>
// ===== 数据层 =====

// 维生素推荐摄入量
const RECOMMENDED_INTAKE = {
  vitaminA: 750, vitaminB: 10, vitaminC: 100,
  vitaminD: 10, vitaminE: 14, folate: 400
};
const VITAMIN_NAMES = {
  vitaminA: '维生素A', vitaminB: '维生素B族', vitaminC: '维生素C',

// ===== 工具函数 =====
function formatDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function addDays(dateStr, days) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return formatDate(d);
}

function isToday(dateStr) {
  return dateStr === formatDate(new Date());
}

function getDateDisplay(dateStr) {
  const d = new Date(dateStr);
  const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  return `${d.getMonth() + 1}月${d.getDate()}日 ${weekdays[d.getDay()]}`;
}

function getFoodById(id) {
  return FOODS.find(f => f.id === id);
}

// ===== localStorage =====
const STORAGE_KEY = 'vitamin_diary_records';

function getAllRecords() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  } catch { return {}; }
}

function getDailyRecord(date) {
  const all = getAllRecords();
  return all[date] || { date, records: [] };
}

function saveDailyRecord(date, record) {
  const all = getAllRecords();
  all[date] = record;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
}

function addRecord(date, foodId, foodName, mealType, portionSize, grams) {
  const record = getDailyRecord(date);
  record.records.push({
    id: 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    foodId, foodName, mealType, portionSize, grams,
    createdAt: new Date().toISOString()
  });
  saveDailyRecord(date, record);
}

function removeRecord(date, recordId) {
  const record = getDailyRecord(date);
  record.records = record.records.filter(r => r.id !== recordId);
  saveDailyRecord(date, record);
}

// ===== 维生素计算 =====
function calculateTotalVitamins(records) {
  const totals = {};
  VITAMIN_KEYS.forEach(k => totals[k] = 0);
  records.forEach(r => {
    const food = getFoodById(r.foodId);
    if (food) {
      VITAMIN_KEYS.forEach(k => {
        totals[k] += food.v[k] * (r.grams / 100);
      });
    }
  });
  return totals;
}

function getStatus(percentage) {
  if (percentage >= 100) return 'sufficient';
  if (percentage >= 80) return 'normal';
  if (percentage >= 50) return 'mild';
  return 'severe';
}

function getStatusText(status) {
  const map = { sufficient: '充足', normal: '正常', mild: '轻微缺乏', severe: '严重缺乏' };
  return map[status] || '';
}

function getBadgeClass(status) {
  const map = { sufficient: 'badge-sufficient', normal: 'badge-normal', mild: 'badge-mild', severe: 'badge-severe' };
  return map[status] || '';
}

function calculateAnalysis(records) {
  const totals = calculateTotalVitamins(records);
  const analysis = {};
  VITAMIN_KEYS.forEach(k => {
    const actual = totals[k];
    const recommended = RECOMMENDED_INTAKE[k];
    const percentage = recommended > 0 ? Math.round((actual / recommended) * 1000) / 10 : 0;
    const status = getStatus(percentage);
    const gap = Math.max(0, recommended - actual);
    analysis[k] = { actual, recommended, percentage, status, gap };
  });
  return analysis;
}

function calculateOverallScore(analysis) {
  let sum = 0;
  VITAMIN_KEYS.forEach(k => {
    sum += Math.min(100, analysis[k].percentage);
  });
  return Math.round(sum / VITAMIN_KEYS.length);
}

function getTopDeficient(analysis) {
  return VITAMIN_KEYS
    .map(k => ({ key: k, ...analysis[k] }))
    .sort((a, b) => b.gap - a.gap)
    .slice(0, 3);
}

// ===== 页面渲染 =====
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  document.querySelectorAll('.tab-item').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  renderPage();
}

function changeDate(delta) {
  currentDate = addDays(currentDate, delta);
  renderPage();
}

function goToToday() {
  currentDate = formatDate(new Date());
  renderPage();
}

function renderPage() {
  if (currentTab === 'home') renderHome();
  else if (currentTab === 'record') renderRecord();
  else if (currentTab === 'analysis') renderAnalysis();
}

// --- 首页 ---
function renderHome() {
  const record = getDailyRecord(currentDate);
  const analysis = calculateAnalysis(record.records);
  const score = calculateOverallScore(analysis);

  // 日期
  document.getElementById('home-date-text').textContent = getDateDisplay(currentDate);
  document.getElementById('home-today-btn').style.display = isToday(currentDate) ? 'none' : 'inline';

  // 评分
  document.getElementById('home-score').textContent = score;
  document.getElementById('home-score-bar').style.width = score + '%';

  // 维生素列表
  const listEl = document.getElementById('home-vitamin-list');
  listEl.innerHTML = VITAMIN_KEYS.map(k => {
    const a = analysis[k];
    const pct = Math.min(100, a.percentage);
    return `
      <div class="vitamin-item status-${a.status}">
        <div class="vitamin-header">
          <span class="vitamin-name">${VITAMIN_NAMES[k]}</span>
          <span class="vitamin-percent">${a.percentage}%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${pct}%"></div>
        </div>
      </div>
    `;
  }).join('');

  // 餐次概览
  const mealEl = document.getElementById('home-meal-overview');
  mealEl.innerHTML = MEAL_TYPES.map(m => {
    const count = record.records.filter(r => r.mealType === m.key).length;
    return `
      <div class="meal-dot ${count > 0 ? 'has-records' : ''}">
        <div class="meal-emoji">${m.emoji}</div>
        <div class="meal-name">${m.name}</div>
        <div class="meal-count">${count > 0 ? count + '项' : '—'}</div>
      </div>
    `;
  }).join('');
}

// --- 记录页 ---
function renderRecord() {

  mealsEl.innerHTML = MEAL_TYPES.map(m => {

      recordsHtml = '<div class="empty-state">还没有记录，点击下方按钮添加</div>';
    } else {
      recordsHtml = mealRecords.map(r => {
        const food = getFoodById(r.foodId);
        const emoji = food ? food.emoji : '🍽️';
        return `
          <div class="food-record">
            <div class="food-record-left">

              <span class="food-name">${r.foodName}</span>

            <button class="delete-btn" onclick="handleDelete('${r.id}')">🗑</button>
          </div>

      }).join('');

    return `
      <div class="meal-section ${isCollapsed ? 'collapsed' : ''}">
        <div class="meal-header" onclick="toggleMeal('${m.key}')">
          <div class="meal-header-left">
            <span class="meal-emoji">${m.emoji}</span>
            <span class="meal-label">${m.name}</span>

        </div>
      </div>
    `;
  }).join('');
}

function toggleMeal(key) {
  collapsedMeals[key] = !collapsedMeals[key];

function handleDelete(recordId) {

}

      <div style="display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:12px;color:#999">
        <span><span style="display:inline-block;width:10px;height:10px;background:#10b981;border-radius:2px;vertical-align:middle"></span> 实际摄入</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#e5e7eb;border-radius:2px;vertical-align:middle"></span> 推荐摄入</span>
      </div>
    </div>
  `;

  // 评分卡片
  const scoreHtml = `
    <div class="score-card">
      <div class="score-label">今日营养均衡度</div>
      <div class="score-value">${score}</div>
      <div class="score-unit">综合评分</div>
      <div class="score-bar">
        <div class="score-bar-fill" style="width:${score}%"></div>
      </div>
    </div>
  `;

  // Top 3 缺乏
  const topDefHtml = topDef.some(d => d.gap > 0) ? `
    <div class="top-deficient">
      <div class="top-deficient-title">⚠️ 最需要补充的维生素</div>
      ${topDef.filter(d => d.gap > 0).map(d => `
        <div class="deficient-item">
          <span class="deficient-name">${VITAMIN_NAMES[d.key]}</span>
          <span class="deficient-gap">缺口 ${d.gap.toFixed(1)}${VITAMIN_UNITS[d.key]}</span>
        </div>
      `).join('')}
    </div>
  ` : '';

  // 详细数据
  const detailHtml = `
    <div class="card">
      <div class="card-title">详细数据</div>
      ${VITAMIN_KEYS.map(k => {
        const a = analysis[k];
        return `
          <div class="detail-row">
            <div class="detail-left">
              <span class="detail-name">${VITAMIN_NAMES[k]}</span>
              <span class="detail-value">${a.actual.toFixed(1)}/${a.recommended}${VITAMIN_UNITS[k]}</span>
            </div>
            <div class="detail-right">
              <span class="detail-gap">${a.percentage}%</span>
              <span class="status-badge ${getBadgeClass(a.status)}">${getStatusText(a.status)}</span>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;

  contentEl.innerHTML = scoreHtml + topDefHtml + barChartHtml + detailHtml;
}

// ===== 添加食物面板 =====
function openFoodPanel(mealType) {
  currentMealType = mealType;
  selectedCategory = 'staple';
  searchKeyword = '';
  selectedFood = null;
  selectedPortion = 'medium';

  document.getElementById('search-input').value = '';
  document.getElementById('panel-title').textContent = `添加食物 - ${MEAL_TYPES.find(m => m.key === mealType).name}`;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('food-panel').classList.add('show');
  document.getElementById('portion-selector').classList.remove('show');
  renderCategoryTabs();
  renderFoodGrid();
}

function closeFoodPanel() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('food-panel').classList.remove('show');
}

function renderCategoryTabs() {
  const el = document.getElementById('category-tabs');
  el.innerHTML = CATEGORIES.map(c => `
    <button class="cat-tab ${c.key === selectedCategory ? 'active' : ''}" onclick="selectCategory('${c.key}')">${c.name}</button>
  `).join('');
}

function selectCategory(key) {
  selectedCategory = key;
  searchKeyword = '';
  document.getElementById('search-input').value = '';
  renderCategoryTabs();
  renderFoodGrid();
}

function renderFoodGrid() {
  searchKeyword = document.getElementById('search-input').value.trim().toLowerCase();
  const el = document.getElementById('food-grid');

  let foods;
  if (searchKeyword) {
    foods = FOODS.filter(f => f.name.toLowerCase().includes(searchKeyword));
  } else {
    foods = FOODS.filter(f => f.category === selectedCategory);
  }

  if (foods.length === 0) {
    el.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#ccc">没有找到相关食材</div>';
    return;
  }

  el.innerHTML = foods.map(f => `
    <div class="food-card" onclick="selectFood('${f.id}')">
      <span class="food-emoji">${f.emoji}</span>
      <span class="food-name">${f.name}</span>
    </div>
  `).join('');
}

function selectFood(foodId) {
  selectedFood = getFoodById(foodId);
  if (!selectedFood) return;

  document.getElementById('food-grid').style.display = 'none';
  document.getElementById('portion-selector').classList.add('show');
  document.getElementById('portion-food-name').textContent = `${selectedFood.emoji} ${selectedFood.name}`;

  // 重置选择
  selectedPortion = 'medium';
  document.querySelectorAll('.portion-opt').forEach(opt => {
    opt.classList.toggle('selected', opt.dataset.portion === 'medium');
  });
}

function selectPortion(portion) {
  selectedPortion = portion;
  document.querySelectorAll('.portion-opt').forEach(opt => {
    opt.classList.toggle('selected', opt.dataset.portion === portion);
  });
}

function confirmAddFood() {
  if (!selectedFood) return;

  const grams = PORTION_GRAMS[selectedPortion];
  addRecord(currentDate, selectedFood.id, selectedFood.name, currentMealType, selectedPortion, grams);

  // 关闭面板
  closeFoodPanel();
  document.getElementById('food-grid').style.display = '';

  // 重新渲染
  renderPage();
}

// ===== 初始化：首次访问添加示例数据 =====
function initSampleData() {
  const all = getAllRecords();
  if (Object.keys(all).length > 0) return;

  const today = formatDate(new Date());
  const samples = [
    { foodId: 'milk', mealType: 'breakfast', portion: 'medium' },
    { foodId: 'bread', mealType: 'breakfast', portion: 'medium' },
    { foodId: 'egg', mealType: 'breakfast', portion: 'medium' },
    { foodId: 'rice', mealType: 'lunch', portion: 'medium' },
    { foodId: 'chicken', mealType: 'lunch', portion: 'medium' },
    { foodId: 'broccoli', mealType: 'lunch', portion: 'medium' },
    { foodId: 'apple', mealType: 'snack', portion: 'medium' },
  ];

  samples.forEach(s => {
    const food = getFoodById(s.foodId);
    if (food) {
      addRecord(today, s.foodId, food.name, s.mealType, s.portion, PORTION_GRAMS[s.portion]);
    }
  });
}

// ===== 启动 =====
initSampleData();
renderPage();
</script>
