<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络安全宣传片 - 场景1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0c0c0c;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        /* 顶部状态栏 */
        .top-bar {
            background: #1a1a1a;
            padding: 8px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #888;
            border-bottom: 1px solid #2a2a2a;
        }
        .top-bar .left {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        /* 主内容区 */
        .main {
            flex: 1;
            display: flex;
            padding: 40px;
            gap: 30px;
        }
        
        /* 左侧日志 */
        .log-panel {
            flex: 1;
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            padding: 20px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            line-height: 2;
            overflow: hidden;
        }
        .log-line {
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        .log-time {
            color: #555;
            margin-right: 12px;
        }
        .log-info { color: #4fc3f7; }
        .log-warn { color: #ffcb6b; }
        .log-error { color: #ff6b6b; }
        .log-success { color: #51cf66; }
        
        /* 右侧告警 */
        .alert-panel {
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .alert-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 20px;
        }
        .alert-card.critical {
            border-color: #ff4444;
            background: rgba(255, 68, 68, 0.08);
        }
        .alert-card.warning {
            border-color: #ffaa00;
            background: rgba(255, 170, 0, 0.05);
        }
        
        .alert-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 600;
        }
        .alert-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .alert-icon.critical {
            background: #ff4444;
            color: #fff;
        }
        .alert-icon.warning {
            background: #ffaa00;
            color: #000;
        }
        
        .alert-title {
            color: #ff6b6b;
        }
        .alert-title.warning-text {
            color: #ffcb6b;
        }
        
        .alert-body {
            font-size: 13px;
            color: #aaa;
            line-height: 1.6;
        }
        .alert-detail {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #333;
            font-family: monospace;
            font-size: 12px;
            color: #666;
        }
        
        /* 底部状态 */
        .bottom-bar {
            background: #1a1a1a;
            padding: 12px 24px;
            border-top: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }
        .metric {
            display: flex;
            gap: 30px;
        }
        .metric-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .metric-bar {
            width: 100px;
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
        }
        .metric-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s;
        }
        .metric-fill.high { background: #ff4444; }
        .metric-fill.mid { background: #ffaa00; }
        .metric-fill.low { background: #51cf66; }
        
        .hint {
            position: absolute;
            bottom: 50px;
            right: 20px;
            font-size: 12px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="left">
            <span class="status-dot"></span>
            <span>安全监控中心</span>
            <span style="color:#555">|</span>
            <span>实时防护状态: <span style="color:#ff4444">受到攻击</span></span>
        </div>
        <div>2024-06-20 14:32:18</div>
    </div>
    
    <div class="main">
        <div class="log-panel" id="logPanel">
        </div>
        
        <div class="alert-panel">
            <div class="alert-card critical">
                <div class="alert-header">
                    <div class="alert-icon critical">!</div>
                    <span class="alert-title">检测到恶意入侵</span>
                </div>
                <div class="alert-body">
                    发现异常流量，疑似勒索软件攻击。多个系统文件被加密，防火墙规则被篡改。
                </div>
                <div class="alert-detail">
                    来源: 192.168.x.x | 端口: 445<br>
                    威胁等级: 严重 | 影响范围: 核心服务器
                </div>
            </div>
            
            <div class="alert-card warning">
                <div class="alert-header">
                    <div class="alert-icon warning">!</div>
                    <span class="alert-title warning-text">系统服务异常</span>
                </div>
                <div class="alert-body">
                    数据库连接中断，备份服务停止响应。部分用户数据可能受到影响。
                </div>
            </div>
            
            <div class="alert-card">
                <div class="alert-header">
                    <div class="alert-icon" style="background:#555;color:#aaa">i</div>
                    <span style="color:#888">网络状态</span>
                </div>
                <div class="alert-body" style="font-size:12px">
                    入站流量: <span style="color:#ff6b6b">↑ 847 MB/s</span><br>
                    出站流量: <span style="color:#4fc3f7">↓ 12 MB/s</span><br>
                    连接数: <span style="color:#ffcb6b">1,247</span> (异常)
                </div>
            </div>
        </div>
    </div>
    
    <div class="bottom-bar">
        <div class="metric">
            <div class="metric-item">
                <span>CPU</span>
                <div class="metric-bar"><div class="metric-fill high" style="width:94%"></div></div>
                <span style="color:#ff4444">94%</span>
            </div>
            <div class="metric-item">
                <span>内存</span>
                <div class="metric-bar"><div class="metric-fill high" style="width:87%"></div></div>
                <span style="color:#ff4444">87%</span>
            </div>
            <div class="metric-item">
                <span>磁盘</span>
                <div class="metric-bar"><div class="metric-fill mid" style="width:62%"></div></div>
                <span style="color:#ffaa00">62%</span>
            </div>
        </div>
        <div style="color:#666">网络延迟: 2,847ms | 丢包率: 34%</div>
    </div>
    
    <div class="hint">按空格键启动应急响应</div>
    
    <script>
        const logs = [
            { time: '14:31:02', level: 'info', text: '系统正常运行，所有服务状态良好' },
            { time: '14:31:18', level: 'info', text: '防火墙拦截可疑连接 3 次' },
            { time: '14:31:45', level: 'warn', text: '检测到异常流量峰值，入站带宽激增' },
            { time: '14:32:01', level: 'warn', text: '端口 445 收到大量连接请求' },
            { time: '14:32:06', level: 'error', text: '警告: 发现可疑进程 svch0st.exe' },
            { time: '14:32:08', level: 'error', text: '核心文件被修改: C:\\Windows\\System32\\drivers\\etc' },
            { time: '14:32:10', level: 'error', text: '数据库连接异常，事务回滚失败' },
            { time: '14:32:12', level: 'error', text: '勒索软件特征匹配: Win32.Cryptolocker variant' },
            { time: '14:32:14', level: 'error', text: '文件加密中... 已影响 1,247 个文件' },
            { time: '14:32:16', level: 'error', text: '备份服务被终止，无法创建恢复点' },
            { time: '14:32:18', level: 'error', text: '系统进入紧急状态，等待人工干预' },
        ];
        
        const panel = document.getElementById('logPanel');
        let idx = 0;
        
        function addLog() {
            if (idx >= logs.length) return;
            const log = logs[idx];
            const div = document.createElement('div');
            div.className = 'log-line';
            div.style.animationDelay = '0s';
            const colorClass = `log-${log.level}`;
            div.innerHTML = `<span class="log-time">[${log.time}]</span><span class="${colorClass}">${log.text}</span>`;
            panel.appendChild(div);
            panel.scrollTop = panel.scrollHeight;
            idx++;
        }
        
        setInterval(() => {
            addLog();
        }, 600);
        
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                window.location.href = 'defense.html';
            }
        });
    </script>
</body>
</html>
