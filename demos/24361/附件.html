<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>AI 工作流仪表盘</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f0f4ff 0%, #e8ecf8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 30px 35px 45px;
            box-shadow: 0 20px 60px rgba(0, 20, 50, 0.12), 0 8px 24px rgba(0,0,0,0.03);
            border: 1px solid rgba(255,255,255,0.6);
            transition: all 0.2s;
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #1b1f3b;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        h1 small {
            font-size: 16px;
            font-weight: 400;
            color: #4f577a;
            margin-left: 6px;
        }
        .subhead {
            color: #4a5278;
            margin-top: 6px;
            font-size: 15px;
            font-weight: 400;
            border-left: 3px solid #6c7bff;
            padding-left: 14px;
            background: rgba(108, 123, 255, 0.06);
            border-radius: 0 12px 12px 0;
            line-height: 1.5;
        }
        .input-area {
            margin: 28px 0 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        textarea {
            width: 100%;
            height: 130px;
            padding: 18px 20px;
            border: 1px solid rgba(108, 123, 255, 0.25);
            border-radius: 24px;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(4px);
            font-size: 15px;
            line-height: 1.6;
            color: #1a1f36;
            resize: vertical;
            transition: 0.2s;
            outline: none;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
        }
        textarea:focus {
            border-color: #6c7bff;
            box-shadow: 0 0 0 4px rgba(108, 123, 255, 0.15), inset 0 2px 6px rgba(0,0,0,0.02);
        }
        textarea::placeholder {
            color: #8e96b5;
            font-weight: 400;
        }
        .action-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .btn-primary {
            background: #1b1f3b;
            border: none;
            padding: 14px 40px;
            border-radius: 60px;
            color: white;
            font-weight: 600;
            font-size: 17px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 20px rgba(27, 31, 59, 0.20);
            border: 1px solid rgba(255,255,255,0.1);
            letter-spacing: 0.3px;
        }
        .btn-primary:hover { background: #2c3156; transform: translateY(-2px); box-shadow: 0 14px 28px rgba(27, 31, 59, 0.25); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.5; pointer-events: none; transform: scale(0.98); }
        .loader {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            color: #4a5278;
            background: rgba(255,255,255,0.6);
            padding: 6px 20px 6px 16px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }
        .loader.active { display: inline-flex; }
        .loader span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #6c7bff;
            border-radius: 50%;
            animation: dotBounce 1.2s infinite ease-in-out;
        }
        .loader span:nth-child(2) { animation-delay: 0.2s; }
        .loader span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            margin-top: 18px;
        }
        .card {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 24px 26px;
            border: 1px solid rgba(255,255,255,0.9);
            box-shadow: 0 8px 20px rgba(0,0,0,0.02);
            min-height: 200px;
        }
        .card h3 {
            font-size: 18px;
            font-weight: 600;
            color: #1b1f3b;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(0,0,0,0.04);
            padding-bottom: 14px;
        }
        .todo-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 16px;
            font-size: 15px;
            color: #1f2440;
            line-height: 1.5;
        }
        .todo-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-top: 2px;
            accent-color: #6c7bff;
            flex-shrink: 0;
            cursor: pointer;
        }
        .todo-item .todo-text { transition: 0.2s; }
        .todo-item input:checked + .todo-text { text-decoration: line-through; color: #8e96b5; }

        .insight-item {
            background: rgba(108, 123, 255, 0.04);
            padding: 14px 18px;
            border-radius: 16px;
            margin-bottom: 12px;
            font-size: 14.5px;
            line-height: 1.6;
            color: #1f2440;
            border-left: 3px solid #6c7bff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.02);
        }
        .empty-state {
            color: #8e96b5;
            text-align: center;
            padding: 40px 10px;
            font-size: 15px;
            background: rgba(0,0,0,0.01);
            border-radius: 20px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1b1f3b;
            color: white;
            padding: 14px 32px;
            border-radius: 60px;
            font-weight: 500;
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            font-size: 15px;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }

        @media (max-width: 700px) {
            .container { padding: 24px 18px; border-radius: 32px; }
            .dashboard { grid-template-columns: 1fr; gap: 20px; }
            .btn-primary { width: 100%; justify-content: center; }
            h1 { font-size: 22px; flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>
        ⚡ AI 工作流仪表盘
        <small>· 碎片信息极速拆解</small>
    </h1>
    <div class="subhead">
        🧠 灵感源自 AI Agent 的 ReAct 循环：输入碎片 → 拆解推理 → 输出待办与洞察
    </div>

    <div class="input-area">
        <textarea id="rawInput" placeholder="📋 粘贴你的工作碎片，例如：&#10;明天下午3点要和设计对一下首页改版方案，记得先拉取最新代码。另外客户说登录页的验证码老是收不到，让后端张工查一下日志。还有，周五前要把Q3的汇报PPT初稿发给老板。">明天下午3点要和设计对一下首页改版方案，记得先拉取最新代码。另外客户说登录页的验证码老是收不到，让后端张工查一下日志。还有，周五前要把Q3的汇报PPT初稿发给老板。</textarea>
        <div class="action-row">
            <button class="btn-primary" id="processBtn">🚀 一键 AI 拆解</button>
            <div class="loader" id="loader">
                <span></span><span></span><span></span> AI 正在拆解任务...
            </div>
        </div>
    </div>

    <div class="dashboard">
        <div class="card" id="todoCard">
            <h3>📋 待办清单</h3>
            <div id="todoList"><div class="empty-state">✨ 等待输入任务碎片</div></div>
        </div>
        <div class="card" id="insightCard">
            <h3>💡 重点洞察</h3>
            <div id="insightList"><div class="empty-state">🔍 等待提取核心摘要</div></div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    (function() {
        const inputEl = document.getElementById('rawInput');
        const processBtn = document.getElementById('processBtn');
        const loader = document.getElementById('loader');
        const todoList = document.getElementById('todoList');
        const insightList = document.getElementById('insightList');
        const toast = document.getElementById('toast');

        let toastTimer = null;

        function showToast(msg) {
            if (toastTimer) clearTimeout(toastTimer);
            toast.textContent = msg;
            toast.classList.add('show');
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
                toastTimer = null;
            }, 2800);
        }

        // 核心解析逻辑（模拟 AI 智能拆解）
        function parseText(text) {
            if (!text || text.trim().length < 3) {
                return { todos: [], insights: [] };
            }

            // 1. 智能提取待办（包含“要”、“需”、“记得”、“让”、“把”、“必须”、“务必”、“周五前”等关键词）
            const sentences = text.match(/[^。！？；\n]+[。！？；\n]?/g) || [text];
            const todos = [];
            const insights = [];
            
            // 关键词权重
            const todoKeywords = ['要', '需', '记得', '让', '把', '必须', '务必', '周五', '明天', '后天', '下午', '上午', '之前', '前', '查一下', '改一下', '提交', '发给', '拉取', '确认', '对齐'];
            
            // 先尝试提取明确的待办
            let todoCandidates = [];
            sentences.forEach(s => {
                const trimmed = s.trim();
                if (trimmed.length < 3) return;
                // 检查是否包含待办关键词
                let score = 0;
                todoKeywords.forEach(kw => {
                    if (trimmed.includes(kw)) score += 1;
                });
                // 如果包含时间词或动作词，加分
                if (/[0-9]/.test(trimmed)) score += 1;
                if (trimmed.includes('把') || trimmed.includes('让')) score += 1;
                
                if (score >= 1) {
                    todoCandidates.push({ text: trimmed, score: score });
                } else {
                    // 非待办作为洞察备选
                    insights.push(trimmed);
                }
            });

            // 按分数排序取前3条待办
            todoCandidates.sort((a,b) => b.score - a.score);
            const topTodos = todoCandidates.slice(0, 3).map(item => item.text);
            
            // 如果待办不够3条，从insights里借调
            if (topTodos.length < 3 && insights.length > 0) {
                while (topTodos.length < 3 && insights.length > 0) {
                    const borrowed = insights.shift();
                    if (borrowed && borrowed.length > 2) {
                        topTodos.push(borrowed);
                    }
                }
            }

            // 如果还有剩下的洞察，取前3条
            const finalInsights = insights.slice(0, 3);
            
            // 如果还是没有洞察，从原文截取短句
            while (finalInsights.length < 3 && topTodos.length > 0) {
                // 补一些概括性洞察
            }
            if (finalInsights.length === 0 && text.length > 0) {
                const fallback = text.split(/[，,、。]/).filter(s => s.trim().length > 4).slice(0, 3);
                finalInsights.push(...fallback);
            }

            return {
                todos: topTodos.length > 0 ? topTodos : ['梳理当前工作优先级', '整理未读消息与邮件'],
                insights: finalInsights.length > 0 ? finalInsights : ['今日工作重点需聚焦高优先级事项', '建议留出整块时间处理复杂任务']
            };
        }

        function render(todos, insights) {
            // 渲染待办
            if (todos && todos.length > 0) {
                todoList.innerHTML = todos.map((text, idx) => `
                    <div class="todo-item">
                        <input type="checkbox" id="todo_${idx}">
                        <label for="todo_${idx}" class="todo-text">${text}</label>
                    </div>
                `).join('');
            } else {
                todoList.innerHTML = `<div class="empty-state">🎯 暂无待办，输入内容试试</div>`;
            }

            // 渲染洞察
            if (insights && insights.length > 0) {
                insightList.innerHTML = insights.map(text => `
                    <div class="insight-item">${text}</div>
                `).join('');
            } else {
                insightList.innerHTML = `<div class="empty-state">📌 暂无洞察，继续加油</div>`;
            }
        }

        function handleProcess() {
            const raw = inputEl.value;
            if (!raw || raw.trim().length < 2) {
                showToast('⚠️ 请先输入你的工作碎片（至少2个字）');
                return;
            }

            // 1. 进入加载状态
            processBtn.disabled = true;
            loader.classList.add('active');

            // 2. 模拟 AI 异步推理（1.5秒，像Claude Code在思考）
            setTimeout(() => {
                const result = parseText(raw);
                render(result.todos, result.insights);
                
                // 3. 结束加载
                loader.classList.remove('active');
                processBtn.disabled = false;
                showToast('✅ AI 拆解完成！已更新待办与洞察');
            }, 1500);
        }

        // 绑定事件
        processBtn.addEventListener('click', handleProcess);

        // 支持 Ctrl+Enter 快捷键
        inputEl.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                handleProcess();
            }
        });

        // 页面加载后自动执行一次，展示效果
        window.addEventListener('load', () => {
            setTimeout(() => {
                handleProcess();
            }, 400);
        });
    })();
</script>

</body>
</html>
