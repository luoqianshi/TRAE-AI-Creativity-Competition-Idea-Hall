<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>印知眼 · 打印机状态识别演示</title>
    <style>
        :root {
            --bg-primary: #fdfaf6;
            --bg-card: #ffffff;
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --border: #e2e8f0;
            --accent-success: #48bb78;
            --accent-warning: #ed8936;
            --accent-error: #e53e3e;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            --radius-lg: 12px;
            --radius-md: 8px;
        }

        .dark-mode {
            --bg-primary: #1a202c;
            --bg-card: #2d3748;
            --text-primary: #e2e8f0;
            --text-secondary: #a0aec0;
            --border: #4a5568;
            --accent-success: #68d391;
            --accent-warning: #f6ad55;
            --accent-error: #fc8181;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 16px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            padding-top: 12px;
        }

        h1 {
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* Camera mockup */
        .camera-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
            border: 2px dashed var(--border);
        }

        .camera-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .camera-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80px;
            height: 80px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255,255,255,0.7);
            border-radius: 50%;
        }

        .camera-crosshair::before,
        .camera-crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.7);
        }

        .camera-crosshair::before {
            width: 60px;
            height: 2px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .camera-crosshair::after {
            width: 2px;
            height: 60px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .camera-hint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        /* Status card */
        .status-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
            transition: all 0.3s;
        }

        .status-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .status-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 1.5rem;
        }

        .icon-paper {
            background-color: rgba(237, 137, 54, 0.15);
            color: var(--accent-warning);
        }

        .icon-jam {
            background-color: rgba(229, 62, 62, 0.15);
            color: var(--accent-error);
        }

        .icon-ink {
            background-color: rgba(72, 187, 120, 0.15);
            color: var(--accent-success);
        }

        .status-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .status-desc {
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-size: 0.95rem;
        }

        .status-notice {
            background: #f7fafc;
            border-left: 4px solid var(--accent-success);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            margin-top: 12px;
        }

        /* Scenario tabs */
        .scenario-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            min-width: 90px;
            padding: 10px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            text-align: center;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-warning);
            color: white;
            border-color: var(--accent-warning);
        }

        .tab-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Notification preview */
        .notification-preview {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: var(--shadow-md);
            margin-top: 16px;
        }

        .notification-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .notification-avatar {
            width: 36px;
            height: 36px;
            background: #4299e1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-right: 10px;
        }

        .notification-from {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .notification-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-left: auto;
        }

        .notification-body {
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .play-btn {
            display: inline-flex;
            align-items: center;
            background: #4299e1;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-top: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .play-btn:hover:not(:disabled) {
            background: #3182ce;
        }

        .play-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .play-btn svg {
            width: 14px;
            height: 14px;
            margin-right: 6px;
        }

        /* Theme toggle */
        .theme-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            z-index: 100;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
            fill: var(--text-primary);
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 32px;
            padding: 16px;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 12px;
            }
            .camera-frame {
                aspect-ratio: 3/4;
            }
            .scenario-tabs {
                gap: 4px;
            }
            .tab-btn {
                flex: none;
                min-width: 72px;
                padding: 8px 10px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>印知眼</h1>
            <p class="subtitle">手机一拍，即时知晓打印机状态</p>
        </header>

        <div class="camera-frame">
            <div class="camera-overlay">
                <div class="camera-crosshair"></div>
                <div class="camera-hint">对准打印机面板</div>
            </div>
        </div>

        <div class="status-card">
            <div class="status-header">
                <div class="status-icon icon-paper">📄</div>
                <div class="status-title">缺纸提醒</div>
            </div>
            <p class="status-desc">打印机检测到纸盒为空，无法继续输出。</p>
            <div class="status-notice">
                🔔 微信已推送提醒：“纸盒空了，请添加A4纸后按‘确定’键恢复。”
            </div>
        </div>

        <h3 style="margin-bottom: 12px; font-weight: 600;">模拟故障类型</h3>
        <div class="scenario-tabs">
            <button class="tab-btn active" data-scenario="paper">缺纸</button>
            <button class="tab-btn" data-scenario="jam">卡纸</button>
            <button class="tab-btn" data-scenario="ink">墨盒告罄</button>
        </div>

        <div class="notification-preview">
            <div class="notification-header">
                <div class="notification-avatar">Y</div>
                <div class="notification-from">印知眼</div>
                <div class="notification-time">刚刚</div>
            </div>
            <div class="notification-body" id="notification-text">
                纸盒空了，请添加A4纸后按“确定”键恢复。
            </div>
            <button class="play-btn" id="play-btn">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                🔊 播放提醒
            </button>
        </div>

        <footer>
            <p>手机拍摄 → OCR识别 → 微信实时推送 | 无需APP，即装即用</p>
        </footer>
    </div>

    <button class="theme-toggle" id="theme-toggle" aria-label="切换深色/浅色主题">
        <svg viewBox="0 0 24 24">
            <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h1.5zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H6a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM12 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5z"/>
        </svg>
    </button>

    <script>
        // 主题切换
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;
        
        if (localStorage.getItem('theme') === 'dark') {
            html.classList.add('dark-mode');
        }
        
        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark-mode');
            localStorage.setItem('theme', html.classList.contains('dark-mode') ? 'dark' : 'light');
        });

        // 场景切换
        const tabBtns = document.querySelectorAll('.tab-btn');
        const statusIcon = document.querySelector('.status-icon');
        const statusTitle = document.querySelector('.status-title');
        const statusDesc = document.querySelector('.status-desc');
        const statusNotice = document.querySelector('.status-notice');
        const notificationText = document.getElementById('notification-text');
        const playBtn = document.getElementById('play-btn');

        const scenarios = {
            paper: {
                icon: 'icon-paper',
                title: '缺纸提醒',
                desc: '打印机检测到纸盒为空，无法继续输出。',
                notice: '🔔 微信已推送提醒：“纸盒空了，请添加A4纸后按‘确定’键恢复。”',
                notification: '纸盒空了，请添加A4纸后按“确定”键恢复。',
                emoji: '📄'
            },
            jam: {
                icon: 'icon-jam',
                title: '卡纸提醒',
                desc: '进纸路径中检测到卡纸，请打开盖板清理碎纸。',
                notice: '🔔 微信已推送提醒：“卡纸了，请打开盖板清理后按‘继续’键。”',
                notification: '卡纸了，请打开盖板清理后按“继续”键。',
                emoji: '⚠️'
            },
            ink: {
                icon: 'icon-ink',
                title: '墨盒告罄',
                desc: '黑色墨盒余量低于5%，建议及时更换。',
                notice: '🔔 微信已推送提醒：“黑墨快用完了，更换后按‘复位’键生效。”',
                notification: '黑墨快用完了，更换后按“复位”键生效。',
                emoji: '💧'
            }
        };

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const scenarioKey = btn.dataset.scenario;
                const s = scenarios[scenarioKey];
                
                statusIcon.className = `status-icon ${s.icon}`;
                statusIcon.textContent = s.emoji;
                statusTitle.textContent = s.title;
                statusDesc.textContent = s.desc;
                statusNotice.innerHTML = s.notice;
                notificationText.textContent = s.notification;
                
                // 重置播放按钮状态
                playBtn.disabled = false;
                playBtn.textContent = '🔊 播放提醒';
                playBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 播放提醒';
            });
        });

        // 语音播放（Web Speech API）
        let speechSynthesis = null;
        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            if (isPlaying) return;
            
            if (!window.speechSynthesis) {
                playBtn.textContent = '🔊 浏览器不支持语音';
                playBtn.disabled = true;
                return;
            }

            speechSynthesis = speechSynthesis || window.speechSynthesis;
            const utterance = new SpeechSynthesisUtterance(notificationText.textContent);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.9;
            utterance.pitch = 1;

            playBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.26 2.5-4.02zM14.8 6.2c-1.3 0-2.4 0.7-2.8 1.6L11 6.8c.5-1 1.5-1.8 2.7-1.8 1.5 0 2.6.9 2.6 2.2v3.6h2.3V8.8c0-1.7-.9-3.2-2.2-4.2l-1.3 1zM21 9v2h-2V9h2zm-4 4v-4h2v4h-2z"/></svg> 正在播报…';
            playBtn.disabled = true;
            isPlaying = true;

            utterance.onend = () => {
                setTimeout(() => {
                    playBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 🔊 播放提醒';
                    playBtn.disabled = false;
                    isPlaying = false;
                }, 300);
            };

            utterance.onerror = () => {
                playBtn.textContent = '🔊 播报失败';
                playBtn.disabled = false;
                isPlaying = false;
            };

            speechSynthesis.cancel();
            speechSynthesis.speak(utterance);
        });
    </script>
</body>
</html>
