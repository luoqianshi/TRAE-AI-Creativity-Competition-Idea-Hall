<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能简历优化助手 - Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <div class="logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                        </svg>
                    </div>
                    <span class="logo-text">简历优化助手</span>
                </div>
            </div>
            <div class="header-right">
                <button class="btn btn-primary" onclick="uploadResume()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    上传简历
                </button>
            </div>
        </header>
        
        <div class="main-content">
            <aside class="sidebar">
                <div class="sidebar-section">
                    <h3>
                        <svg viewBox="0 0 24 24">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/>
                        </svg>
                        优化历史
                    </h3>
                    <div class="history-list" id="historyList">
                    </div>
                </div>
                <div class="sidebar-section">
                    <h3>
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                        优化建议
                    </h3>
                    <div class="suggestion-list" id="suggestionList">
                    </div>
                </div>
            </aside>
            
            <main class="content-area">
                <div class="resume-input" id="resumeInput">
                    <h2>
                        <svg viewBox="0 0 24 24">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                        </svg>
                        简历优化分析
                    </h2>
                    
                    <div class="input-grid">
                        <div class="input-section">
                            <label for="resumeText"><span>*</span>简历内容</label>
                            <textarea id="resumeText" placeholder="请粘贴您的简历内容，或点击右上角上传简历..."></textarea>
                        </div>
                        
                        <div class="right-column">
                            <div class="job-section">
                                <label for="targetJob">目标岗位</label>
                                <input type="text" id="targetJob" placeholder="例如：前端开发工程师">
                            </div>
                            
                            <div class="quick-tips">
                                <h4>
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="10"/>
                                        <path d="M12 16v-4"/>
                                        <path d="M12 8h.01"/>
                                    </svg>
                                    优化提示
                                </h4>
                                <ul>
                                    <li>简历内容越详细，分析结果越精准</li>
                                    <li>建议包含工作经历、项目经验、技能列表</li>
                                    <li>填写目标岗位可获得更针对性的建议</li>
                                    <li>支持中英文简历分析</li>
                                </ul>
                            </div>
                            
                            <button class="btn btn-large btn-primary" onclick="analyzeResume()">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polygon points="5 3 19 12 5 21 5 3"/>
                                </svg>
                                开始优化分析
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="analysis-result" id="analysisResult" style="display: none;">
                    <div class="result-header">
                        <h2>优化分析报告</h2>
                        <div class="match-score">
                            <div class="score-circle" id="scoreCircle">
                                <span id="matchScore">--%</span>
                            </div>
                            <span class="score-label">匹配度</span>
                        </div>
                    </div>
                    
                    <div class="result-content">
                        <div class="tab-container">
                            <div class="tab active" onclick="showTab('keywords')">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8"/>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                                </svg>
                                关键词分析
                            </div>
                            <div class="tab" onclick="showTab('optimize')">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                                </svg>
                                优化建议
                            </div>
                            <div class="tab" onclick="showTab('rewrite')">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                </svg>
                                润色结果
                            </div>
                        </div>
                        
                        <div class="tab-content" id="keywordsTab">
                            <div class="keyword-section">
                                <h3>缺失关键词</h3>
                                <div class="keyword-list" id="missingKeywords"></div>
                            </div>
                            <div class="keyword-section">
                                <h3>已有关键词</h3>
                                <div class="keyword-list" id="existingKeywords"></div>
                            </div>
                        </div>
                        
                        <div class="tab-content" id="optimizeTab" style="display: none;">
                            <div class="suggestion-detail" id="suggestionDetail"></div>
                        </div>
                        
                        <div class="tab-content" id="rewriteTab" style="display: none;">
                            <div class="rewrite-text" id="rewriteText"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
        
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
        </div>
    </div>
    
    <script src="app.js?v=20260707"></script>
</body>
</html>
