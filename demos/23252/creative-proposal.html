<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 知识卡片生成器 · 创意提案</title>
  <style>
    :root { --bg: #f5f7fb; --card: #ffffff; --primary: #4f46e5; --accent: #06b6d4; --text: #1f2937; --muted: #6b7280; --border: #e5e7eb; --shadow: 0 4px 16px rgba(17, 24, 39, 0.06); }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
    .container { max-width: 960px; margin: 0 auto; padding: 32px 24px 80px; }
    .hero { background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%); color: #fff; border-radius: 20px; padding: 48px 40px; box-shadow: var(--shadow); }
    .hero h1 { font-size: 32px; margin: 0 0 12px; }
    section { margin-top: 32px; }
    h2 { font-size: 22px; margin: 0 0 16px; padding-left: 12px; border-left: 4px solid var(--primary); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 12px; }
    .card h3 { font-size: 16px; margin: 0 0 8px; color: var(--primary); }
    .card p { margin: 0; color: var(--muted); font-size: 14px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <h1>AI 知识卡片生成器</h1>
      <p>把文章、笔记自动变成可复习的知识卡片。</p>
    </div>
    <section>
      <h2>创意概述</h2>
      <div class="grid-2">
        <div class="card"><h3>效率提升</h3><p>3 分钟生成 20+ 张卡片</p></div>
        <div class="card"><h3>学习效果</h3><p>主动回忆 + 间隔重复</p></div>
        <div class="card"><h3>多格式导出</h3><p>Anki / Notion / Markdown</p></div>
        <div class="card"><h3>知识网络</h3><p>自动打标签分类</p></div>
      </div>
    </section>
  </div>
</body>
</html>
