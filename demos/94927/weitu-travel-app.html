<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>味途・旅行美食景点标记分享</title>
<style>
/* =========================================
   味途・旅行美食景点标记分享小程序 - 全局样式
   ========================================= */
:root {
  --primary: #63B8FF;
  --primary-dark: #4AA3F0;
  --accent: #FF9944;
  --accent-dark: #E88733;
  --bg: #F5FAFF;
  --card-bg: #FFFFFF;
  --text: #2B2B2B;
  --text-secondary: #666666;
  --text-light: #999999;
  --border: #E8F0F8;
  --shadow: 0 4px 20px rgba(99, 184, 255, 0.12);
  --shadow-heavy: 0 8px 30px rgba(0, 0, 0, 0.12);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-lg: 20px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #E8EDF2; color: var(--text); overscroll-behavior: none; }

/* 手机外框容器 */
#app-frame { max-width: 430px; margin: 0 auto; height: 100vh; background: var(--bg); position: relative; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.15); }

/* 页面通用 */
.page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; display: none; padding-bottom: 80px; scrollbar-width: none; }
.page::-webkit-scrollbar { display: none; }
.page.active { display: block; animation: fadeIn 0.35s ease; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
@keyframes scaleIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
@keyframes popIn { 0% { transform: scale(0.6); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }

/* 顶部标题栏 */
.header { padding: 48px 20px 16px; background: linear-gradient(180deg, rgba(99,184,255,0.12) 0%, transparent 100%); position: sticky; top: 0; z-index: 10; backdrop-filter: blur(8px); }
.header h1 { font-size: 22px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
.header h1::before { content: ""; display: inline-block; width: 6px; height: 22px; background: linear-gradient(180deg, var(--primary), var(--accent)); border-radius: 3px; }
.header .sub { font-size: 13px; color: var(--text-light); margin-top: 4px; margin-left: 14px; }

/* 卡片 */
.card { background: var(--card-bg); border-radius: var(--radius); padding: 16px; margin: 0 16px 12px; box-shadow: var(--shadow); animation: slideUp 0.4s ease both; }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--text); display: flex; align-items: center; gap: 6px; }

/* 表单元素 */
.input, .textarea { width: 100%; border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 14px; outline: none; transition: all 0.2s; font-family: inherit; background: #FAFBFC; color: var(--text); }
.input:focus, .textarea:focus { border-color: var(--primary); background: #FFF; box-shadow: 0 0 0 3px rgba(99,184,255,0.12); }
.textarea { min-height: 90px; resize: none; }

/* 标签选择器 */
.tag-group { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { padding: 8px 16px; border-radius: 20px; border: 1.5px solid var(--border); font-size: 13px; color: var(--text-secondary); cursor: pointer; transition: all 0.2s; background: #FAFBFC; user-select: none; }
.tag.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #FFF; border-color: transparent; box-shadow: 0 2px 8px rgba(99,184,255,0.3); }
.tag:active { transform: scale(0.95); }

/* 图片上传 */
.upload-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.upload-item { aspect-ratio: 1; border-radius: var(--radius-sm); border: 2px dashed var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-light); font-size: 12px; cursor: pointer; transition: all 0.2s; background: #FAFBFC; position: relative; overflow: hidden; }
.upload-item:active { transform: scale(0.96); }
.upload-item .plus { font-size: 24px; margin-bottom: 4px; color: var(--primary); }
.upload-item.has-img { border-style: solid; border-color: var(--primary); }
.upload-item.has-img img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
.upload-item .del { position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; background: rgba(0,0,0,0.5); color: #FFF; border-radius: 50%; font-size: 10px; display: flex; align-items: center; justify-content: center; z-index: 2; }

/* 按钮 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; font-family: inherit; outline: none; }
.btn:active { transform: scale(0.96); }
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #FFF; box-shadow: 0 4px 12px rgba(99,184,255,0.35); }
.btn-accent { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #FFF; box-shadow: 0 4px 12px rgba(255,153,68,0.35); }
.btn-outline { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); }
.btn-block { width: 100%; padding: 14px; border-radius: var(--radius); font-size: 15px; }
.btn-sm { padding: 8px 14px; font-size: 13px; }

/* 底部Tab导航 */
.tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; height: calc(64px + var(--safe-bottom)); background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding-bottom: var(--safe-bottom); z-index: 100; }
.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 64px; cursor: pointer; transition: all 0.2s; color: var(--text-light); font-size: 11px; position: relative; }
.tab-item .tab-icon { width: 24px; height: 24px; transition: all 0.2s; }
.tab-item.active { color: var(--primary); }
.tab-item.active .tab-icon { transform: translateY(-2px); }
.tab-item .tab-icon svg { width: 100%; height: 100%; fill: currentColor; }

/* 地图页面 */
.map-container { position: relative; width: 100%; height: calc(100vh - 140px); background: linear-gradient(135deg, #E8F4FD 0%, #F0F8F0 50%, #FFF8F0 100%); overflow: hidden; touch-action: none; }
.map-layer { position: absolute; top: 0; left: 0; width: 200%; height: 200%; transform-origin: center center; transition: transform 0.1s; }
.map-layer svg { width: 100%; height: 100%; display: block; }
.map-controls { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 5; }
.map-control { width: 40px; height: 40px; background: #FFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: var(--shadow-heavy); cursor: pointer; user-select: none; color: var(--text); }
.map-control:active { transform: scale(0.9); }

/* 地图点位标记 */
.map-marker { position: absolute; width: 36px; height: 44px; cursor: pointer; transform: translate(-50%, -100%); z-index: 3; animation: popIn 0.4s ease both; }
.map-marker .marker-icon { width: 100%; height: 100%; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); transition: transform 0.2s; }
.map-marker:active .marker-icon { transform: scale(0.9); }
.map-marker.food .marker-icon { color: var(--accent); }
.map-marker.scenery .marker-icon { color: var(--primary); }
.map-marker .marker-label { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-weight: 600; color: var(--text); background: rgba(255,255,255,0.9); padding: 2px 8px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

/* 点位详情卡片（地图弹窗） */
.detail-card { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(120%); width: calc(100% - 32px); max-width: 398px; background: #FFF; border-radius: var(--radius-lg); box-shadow: var(--shadow-heavy); padding: 16px; z-index: 50; transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
.detail-card.open { transform: translateX(-50%) translateY(0); }
.detail-card .close { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; background: rgba(0,0,0,0.06); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; color: var(--text-secondary); }
.detail-card .detail-img { width: 100%; height: 160px; border-radius: var(--radius); object-fit: cover; margin-bottom: 12px; }
.detail-card .detail-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.detail-card .detail-tags { display: flex; gap: 6px; margin-bottom: 8px; }
.detail-card .detail-tag { padding: 3px 10px; border-radius: 10px; font-size: 11px; background: rgba(99,184,255,0.12); color: var(--primary); font-weight: 500; }
.detail-card .detail-tag.food { background: rgba(255,153,68,0.12); color: var(--accent); }
.detail-card .detail-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 10px; }
.detail-card .detail-loc { font-size: 12px; color: var(--text-light); display: flex; align-items: center; gap: 4px; margin-bottom: 12px; }
.detail-card .detail-actions { display: flex; gap: 10px; }

/* 收藏列表 */
.fav-list { padding: 0 16px; }
.fav-item { display: flex; gap: 12px; padding: 12px; background: #FFF; border-radius: var(--radius-sm); margin-bottom: 10px; box-shadow: var(--shadow); align-items: center; }
.fav-item img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
.fav-item .fav-info { flex: 1; min-width: 0; }
.fav-item .fav-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fav-item .fav-loc { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.fav-item .fav-remove { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: #FF6B6B; cursor: pointer; font-size: 18px; flex-shrink: 0; }

/* 弹窗遮罩 */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.modal-overlay.open { opacity: 1; pointer-events: auto; }

/* 成功提示弹窗 */
.toast-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); background: #FFF; border-radius: var(--radius-lg); padding: 32px 40px; text-align: center; z-index: 210; opacity: 0; pointer-events: none; transition: all 0.3s; box-shadow: var(--shadow-heavy); min-width: 240px; }
.toast-modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
.toast-modal .toast-icon { width: 56px; height: 56px; background: linear-gradient(135deg, var(--primary), #4ADE80); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 28px; color: #FFF; }
.toast-modal .toast-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.toast-modal .toast-text { font-size: 13px; color: var(--text-secondary); }

/* 导航导出弹窗 */
.nav-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) translateY(30px); background: #FFF; border-radius: var(--radius-lg); padding: 24px; width: calc(100% - 48px); max-width: 360px; z-index: 210; opacity: 0; pointer-events: none; transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
.nav-modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) translateY(0); }
.nav-modal h3 { font-size: 17px; margin-bottom: 4px; text-align: center; }
.nav-modal .nav-sub { font-size: 12px; color: var(--text-light); text-align: center; margin-bottom: 16px; }
.nav-modal .nav-preview { background: #F8FAFC; border-radius: var(--radius-sm); padding: 12px; margin-bottom: 16px; font-size: 12px; word-break: break-all; color: var(--text-secondary); border: 1px solid var(--border); }
.nav-modal .nav-actions { display: flex; flex-direction: column; gap: 10px; }
.nav-modal .nav-tip { font-size: 11px; color: var(--text-light); text-align: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }

/* 空状态 */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
.empty-state svg { width: 80px; height: 80px; margin-bottom: 12px; opacity: 0.4; }
.empty-state p { font-size: 14px; }

/* 收藏页头部 */
.fav-header { padding: 48px 20px 12px; background: linear-gradient(180deg, rgba(255,153,68,0.08) 0%, transparent 100%); }
.fav-header h1 { font-size: 22px; font-weight: 700; }
.fav-header p { font-size: 13px; color: var(--text-light); margin-top: 4px; }

/* 定位信息展示 */
.loc-display { background: linear-gradient(135deg, rgba(99,184,255,0.08), rgba(255,153,68,0.08)); border-radius: var(--radius-sm); padding: 12px; font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.loc-display .loc-icon { font-size: 16px; }

/* 国风装饰元素 */
.deco-wave { position: absolute; top: 0; left: 0; width: 100%; height: 120px; pointer-events: none; opacity: 0.06; z-index: 0; }
</style>
</head>
<body>
<div id="app-frame">

  <!-- ========== 页面1：打卡点位发布页 ========== -->
  <section id="page-publish" class="page active">
    <div class="header">
      <h1>发布打卡</h1>
      <p class="sub">记录旅途中的美味与风景</p>
    </div>

    <div class="card" style="animation-delay:0.05s">
      <div class="card-title">📍 目的地城市</div>
      <input type="text" id="cityInput" class="input" placeholder="例如：成都、杭州、丽江...">
    </div>

    <div class="card" style="animation-delay:0.1s">
      <div class="card-title">🏷️ 点位标签</div>
      <div class="tag-group" id="tagGroup">
        <span class="tag active" data-tag="美食">🍜 美食</span>
        <span class="tag" data-tag="自然风光">🏔️ 自然风光</span>
        <span class="tag" data-tag="人文景点">🏛️ 人文景点</span>
        <span class="tag" data-tag="小众小店">🏪 小众小店</span>
      </div>
    </div>

    <div class="card" style="animation-delay:0.15s">
      <div class="card-title">📷 实拍照片 <span style="font-size:12px;color:var(--text-light);font-weight:400">(最多3张)</span></div>
      <div class="upload-grid" id="uploadGrid">
        <div class="upload-item" id="addImgBtn">
          <span class="plus">+</span>
          <span>上传图片</span>
        </div>
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
    </div>

    <div class="card" style="animation-delay:0.2s">
      <div class="card-title">📝 打卡笔记</div>
      <textarea id="noteInput" class="textarea" placeholder="分享你的探店心得、旅途故事...（例如：这家藏在巷子里的老火锅，牛油香气扑鼻，毛肚七上八下刚刚好！）"></textarea>
    </div>

    <div class="card" style="animation-delay:0.25s">
      <div class="card-title">🌐 坐标定位</div>
      <button class="btn btn-outline btn-sm" id="getLocBtn" style="margin-bottom:10px">
        <span>📡</span> 自动获取当前定位
      </button>
      <div class="loc-display" id="locDisplay" style="display:none">
        <span class="loc-icon">📍</span>
        <span id="locText">未获取定位</span>
      </div>
      <div style="margin-top:10px; display:flex; gap:8px;">
        <input type="text" id="latInput" class="input" placeholder="纬度 (如 30.67)" style="flex:1">
        <input type="text" id="lngInput" class="input" placeholder="经度 (如 104.06)" style="flex:1">
      </div>
    </div>

    <div style="padding: 8px 16px 24px;">
      <button class="btn btn-primary btn-block" id="publishBtn">✨ 发布标记</button>
    </div>
  </section>

  <!-- ========== 页面2：地图总览页 ========== -->
  <section id="page-map" class="page">
    <div class="header" style="padding-bottom:8px">
      <h1>点位地图</h1>
      <p class="sub">探索城市角落里的美食与风景</p>
    </div>

    <div class="map-container" id="mapContainer">
      <!-- 地图可拖放层 -->
      <div class="map-layer" id="mapLayer">
        <svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99,184,255,0.08)" stroke-width="1"/>
            </pattern>
          </defs>
          <!-- 背景网格 -->
          <rect width="800" height="800" fill="url(#grid)"/>
          <!-- 河流 -->
          <path d="M 0 300 Q 200 280, 400 350 T 800 320" fill="none" stroke="rgba(99,184,255,0.25)" stroke-width="12" stroke-linecap="round"/>
          <path d="M 500 0 Q 520 200, 480 400 T 520 800" fill="none" stroke="rgba(99,184,255,0.18)" stroke-width="8" stroke-linecap="round"/>
          <!-- 道路 -->
          <path d="M 0 500 L 800 500" stroke="rgba(180,180,180,0.2)" stroke-width="6" stroke-dasharray="10,8"/>
          <path d="M 300 0 L 300 800" stroke="rgba(180,180,180,0.2)" stroke-width="6" stroke-dasharray="10,8"/>
          <path d="M 0 150 L 800 650" stroke="rgba(180,180,180,0.15)" stroke-width="4" stroke-dasharray="8,6"/>
          <!-- 公园绿地 -->
          <ellipse cx="200" cy="200" rx="80" ry="60" fill="rgba(100,200,100,0.1)"/>
          <ellipse cx="650" cy="600" rx="100" ry="70" fill="rgba(100,200,100,0.1)"/>
          <!-- 建筑区块 -->
          <rect x="120" y="420" width="100" height="80" rx="8" fill="rgba(150,150,150,0.08)"/>
          <rect x="420" y="120" width="120" height="100" rx="8" fill="rgba(150,150,150,0.08)"/>
          <rect x="550" y="350" width="90" height="110" rx="8" fill="rgba(150,150,150,0.08)"/>
          <!-- 装饰山形（国风） -->
          <path d="M 50 100 Q 100 20, 150 80 T 250 60" fill="none" stroke="rgba(99,184,255,0.12)" stroke-width="3" stroke-linecap="round"/>
          <path d="M 600 150 Q 660 60, 720 130 T 800 100" fill="none" stroke="rgba(255,153,68,0.12)" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <!-- 点位标记由JS动态插入 -->
      </div>

      <div class="map-controls">
        <div class="map-control" id="zoomIn">+</div>
        <div class="map-control" id="zoomOut">−</div>
        <div class="map-control" id="resetMap">⌖</div>
      </div>
    </div>

    <!-- 点位详情卡片 -->
    <div class="detail-card" id="detailCard">
      <div class="close" id="closeDetail">×</div>
      <img class="detail-img" id="detailImg" src="" alt="">
      <div class="detail-title" id="detailTitle"></div>
      <div class="detail-tags" id="detailTags"></div>
      <div class="detail-desc" id="detailDesc"></div>
      <div class="detail-loc">📍 <span id="detailLoc"></span></div>
      <div class="detail-actions">
        <button class="btn btn-outline btn-sm" id="favBtn">♡ 收藏</button>
        <button class="btn btn-accent btn-sm" id="navBtn">🧭 前往导航</button>
      </div>
    </div>

    <!-- 收藏清单 -->
    <div style="padding: 0 16px 24px;">
      <div style="font-size:15px;font-weight:600;margin:16px 0 10px;display:flex;align-items:center;gap:6px">
        ⭐ 收藏点位清单
      </div>
      <div class="fav-list" id="favList">
        <div class="empty-state">
          <p>暂无收藏点位，在地图上点击标记可收藏</p>
        </div>
      </div>
    </div>
  </section>

  <!-- ========== 页面3：我的收藏 ========== -->
  <section id="page-fav" class="page">
    <div class="fav-header">
      <h1>我的收藏</h1>
      <p>旅途中的心动瞬间，都在这里</p>
    </div>
    <div class="fav-list" id="favListPage" style="padding:0 16px">
      <div class="empty-state">
        <p>暂无收藏，快去地图页发现精彩点位吧</p>
      </div>
    </div>
  </section>

  <!-- ========== 底部Tab导航 ========== -->
  <nav class="tab-bar">
    <div class="tab-item active" data-page="map">
      <div class="tab-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
      </div>
      <span>地图首页</span>
    </div>
    <div class="tab-item" data-page="publish">
      <div class="tab-icon">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </div>
      <span>发布打卡</span>
    </div>
    <div class="tab-item" data-page="fav">
      <div class="tab-icon">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
      <span>我的收藏</span>
    </div>
  </nav>

  <!-- ========== 全局弹窗层 ========== -->
  <!-- 成功提示 -->
  <div class="modal-overlay" id="toastOverlay"></div>
  <div class="toast-modal" id="toastModal">
    <div class="toast-icon">✓</div>
    <div class="toast-title">发布成功</div>
    <div class="toast-text">您的打卡点位已同步至地图</div>
  </div>

  <!-- 导航导出弹窗 -->
  <div class="modal-overlay" id="navOverlay"></div>
  <div class="nav-modal" id="navModal">
    <h3>🧭 选择导航方式</h3>
    <p class="nav-sub">坐标直传，无需手动输入地址</p>
    <div class="nav-preview" id="navPreview"></div>
    <div class="nav-actions">
      <button class="btn btn-primary" id="amapBtn">🗺️ 一键生成高德地图导航</button>
      <button class="btn btn-accent" id="bmapBtn">🌐 一键生成百度地图导航</button>
    </div>
    <div class="nav-tip">💡 坐标已自动解析，点击按钮即可唤起对应地图 App</div>
  </div>

</div><!-- /#app-frame -->

<script>
/* =========================================
   味途・旅行美食景点标记分享小程序 - 核心逻辑
   ========================================= */

// ---------- 状态管理 ----------
let currentPage = 'publish';
let currentSpot = null;
let favorites = [];
let mapTransform = { x: 0, y: 0, scale: 1 };
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let uploadedImages = [];

// ---------- 预设模拟数据 ----------
let spots = [
  {
    id: 1,
    title: '老成都巷子火锅',
    city: '成都',
    tag: '美食',
    note: '藏在宽窄巷子深处的老字号，牛油锅底醇厚香浓，毛肚七上八下脆嫩弹牙，人均80元吃到撑！',
    images: ['data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="%23FF9944" width="200" height="200"/><text x="50%25" y="50%25" dominant-baseline="middle" text-anchor="middle" fill="white" font-size="16">成都火锅</text></svg>'],
    lat: 30.67,
    lng: 104.06,
    type: 'food'
  },
  {
    id: 2,
    title: '西湖龙井茶园餐厅',
    city: '杭州',
    tag: '美食',
    note: '坐拥西湖一线湖景，茶香入菜的创意杭帮菜，东坡肉肥而不腻，龙井虾仁清新脱俗。',
    images: ['data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="%2363B8FF" width="200" height="200"/><text x="50%25" y="50%25" dominant-baseline="middle" text-anchor="middle" fill="white" font-size="14">西湖餐厅</text></svg>'],
    lat: 30.25,
    lng: 120.15,
    type: 'food'
  },
  {
    id: 3,
    title: '厦门沙茶面小馆',
    city: '厦门',
    tag: '美食',
    note: '鼓浪屿码头附近的宝藏小店，沙茶酱浓郁微辣，海鲜配料新鲜足量，一碗下肚暖心暖胃。',
    images: ['data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="%23FFBB77" width="200" height="200"/><text x="50%25" y="50%25" dominant-baseline="middle" text-anchor="middle" fill="white" font-size="14">沙茶面</text></svg>'],
    lat: 24.48,
    lng: 118.08,
    type: 'food'
  },
  {
    id: 4,
    title: '桂林漓江山水',
    city: '桂林',
    tag: '自然风光',
    note: '甲天下的漓江山水，乘竹筏漂流于碧水青山之间，云雾缭绕如入仙境，摄影爱好者的天堂。',
    images: ['data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="%2345B7D1" width="200" height="200"/><text x="50%25" y="50%25" dominant-baseline="middle" text-anchor="middle" fill="white" font-size="14">漓江山水</text></svg>'],
    lat: 25.28,
    lng: 110.28,
    type: 'scenery'
  },
  {
    id: 5,
    title: '丽江古城夜色',
    city: '丽江',
    tag: '人文景点',
    note: '千年古城灯火阑珊，纳西古乐悠扬回荡，四方街的石板路诉说着茶马古道的辉煌往事。',
    images: ['data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="%238B7FD4" width="200" height="200"/><text x="50%25" y="50%25" dominant-baseline="middle" text-anchor="middle" fill="white" font-size="14">丽江古城</text></svg>'],
    lat: 26.87,
    lng: 100.23,
    type: 'scenery'
  }
];

// ---------- 工具函数 ----------
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

// 经纬度 → 地图像素坐标（简化映射）
function latLngToPx(lat, lng) {
  // 将中国主要区域映射到 800x800 的SVG画布
  const minLng = 98, maxLng = 122;
  const minLat = 22, maxLat = 35;
  const x = ((lng - minLng) / (maxLng - minLng)) * 800;
  const y = 800 - ((lat - minLat) / (maxLat - minLat)) * 800;
  return { x: Math.max(20, Math.min(780, x)), y: Math.max(20, Math.min(780, y)) };
}

// ---------- Tab 页面切换 ----------
function switchPage(pageName) {
  currentPage = pageName;
  $$('.page').forEach(p => p.classList.remove('active'));
  $(`#page-${pageName}`).classList.add('active');
  $$('.tab-item').forEach(t => t.classList.toggle('active', t.dataset.page === pageName));
  if (pageName === 'map') renderMapMarkers();
  if (pageName === 'fav') renderFavPage();
}

$$('.tab-item').forEach(item => {
  item.addEventListener('click', () => switchPage(item.dataset.page));
});

// ---------- 发布页逻辑 ----------
// 标签选择
$$('#tagGroup .tag').forEach(tag => {
  tag.addEventListener('click', () => {
    $$('#tagGroup .tag').forEach(t => t.classList.remove('active'));
    tag.classList.add('active');
  });
});

// 图片上传
const fileInput = $('#fileInput');
const uploadGrid = $('#uploadGrid');
const addImgBtn = $('#addImgBtn');

addImgBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  const files = Array.from(e.target.files).slice(0, 3 - uploadedImages.length);
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      uploadedImages.push(ev.target.result);
      refreshUploadGrid();
    };
    reader.readAsDataURL(file);
  });
  fileInput.value = '';
});

function refreshUploadGrid() {
  uploadGrid.innerHTML = '';
  uploadedImages.forEach((src, idx) => {
    const div = document.createElement('div');
    div.className = 'upload-item has-img';
    div.innerHTML = `<img src="${src}" alt=""><span class="del" data-idx="${idx}">×</span>`;
    uploadGrid.appendChild(div);
  });
  if (uploadedImages.length < 3) {
    uploadGrid.appendChild(addImgBtn);
  }
  // 删除按钮事件
  $$('.upload-item .del').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      uploadedImages.splice(parseInt(btn.dataset.idx), 1);
      refreshUploadGrid();
    });
  });
}

// 自动定位
$('#getLocBtn').addEventListener('click', () => {
  if (navigator.geolocation) {
    $('#getLocBtn').innerHTML = '<span>⏳</span> 定位中...';
    navigator.geolocation.getCurrentPosition(pos => {
      const lat = pos.coords.latitude.toFixed(4);
      const lng = pos.coords.longitude.toFixed(4);
      $('#latInput').value = lat;
      $('#lngInput').value = lng;
      $('#locText').textContent = `纬度: ${lat}, 经度: ${lng}`;
      $('#locDisplay').style.display = 'flex';
      $('#getLocBtn').innerHTML = '<span>✓</span> 定位成功';
      setTimeout(() => $('#getLocBtn').innerHTML = '<span>📡</span> 自动获取当前定位', 2000);
    }, () => {
      alert('定位失败，请手动输入经纬度');
      $('#getLocBtn').innerHTML = '<span>📡</span> 自动获取当前定位';
    }, { timeout: 8000 });
  } else {
    alert('浏览器不支持定位，请手动输入');
  }
});

// 发布提交
$('#publishBtn').addEventListener('click', () => {
  const city = $('#cityInput').value.trim();
  const note = $('#noteInput').value.trim();
  const lat = parseFloat($('#latInput').value);
  const lng = parseFloat($('#lngInput').value);
  const tag = $('#tagGroup .tag.active').dataset.tag;

  if (!city || !note || !lat || !lng) {
    alert('请填写完整信息（城市、笔记、坐标）');
    return;
  }

  const newSpot = {
    id: Date.now(),
    title: `${city} · ${tag}打卡`,
    city,
    tag,
    note,
    images: uploadedImages.length > 0 ? uploadedImages : [`data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="%2363B8FF" width="200" height="200"/><text x="50%25" y="50%25" dominant-baseline="middle" text-anchor="middle" fill="white" font-size="14">${city}</text></svg>`],
    lat,
    lng,
    type: tag === '美食' || tag === '小众小店' ? 'food' : 'scenery'
  };

  spots.push(newSpot);

  // 显示成功弹窗
  $('#toastOverlay').classList.add('open');
  $('#toastModal').classList.add('open');

  // 清空表单
  $('#cityInput').value = '';
  $('#noteInput').value = '';
  $('#latInput').value = '';
  $('#lngInput').value = '';
  uploadedImages = [];
  refreshUploadGrid();
  $('#locDisplay').style.display = 'none';

  // 2秒后跳转地图页
  setTimeout(() => {
    $('#toastOverlay').classList.remove('open');
    $('#toastModal').classList.remove('open');
    switchPage('map');
  }, 1800);
});

// ---------- 地图页逻辑 ----------
function renderMapMarkers() {
  const layer = $('#mapLayer');
  // 保留 SVG，清除旧的 DOM 标记
  const svg = layer.querySelector('svg');
  layer.innerHTML = '';
  layer.appendChild(svg);

  spots.forEach((spot, idx) => {
    const pos = latLngToPx(spot.lat, spot.lng);
    const el = document.createElement('div');
    el.className = `map-marker ${spot.type}`;
    el.style.left = pos.x + 'px';
    el.style.top = pos.y + 'px';
    el.style.animationDelay = (idx * 0.08) + 's';

    // SVG 图标
    const iconColor = spot.type === 'food' ? '#FF9944' : '#63B8FF';
    el.innerHTML = `
      <svg class="marker-icon" viewBox="0 0 36 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 0C8.06 0 0 8.06 0 18c0 13.5 18 26 18 26s18-12.5 18-26C36 8.06 27.94 0 18 0z" fill="${iconColor}"/>
        <circle cx="18" cy="18" r="7" fill="white"/>
        ${spot.type === 'food'
          ? '<path d="M15 15h2v6h-2zm4 0h2v6h-2z" fill="'+iconColor+'"/>'
          : '<path d="M18 12l-5 9h10z" fill="'+iconColor+'"/>'}
      </svg>
      <span class="marker-label">${spot.title}</span>
    `;

    el.addEventListener('click', (e) => {
      e.stopPropagation();
      openDetail(spot);
    });
    layer.appendChild(el);
  });
}

// 地图拖拽与缩放
const mapContainer = $('#mapContainer');
const mapLayer = $('#mapLayer');

function applyTransform() {
  mapLayer.style.transform = `translate(${mapTransform.x}px, ${mapTransform.y}px) scale(${mapTransform.scale})`;
}

mapContainer.addEventListener('pointerdown', (e) => {
  isDragging = true;
  dragStart = { x: e.clientX - mapTransform.x, y: e.clientY - mapTransform.y };
  mapContainer.setPointerCapture(e.pointerId);
});

mapContainer.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  mapTransform.x = e.clientX - dragStart.x;
  mapTransform.y = e.clientY - dragStart.y;
  applyTransform();
});

mapContainer.addEventListener('pointerup', () => { isDragging = false; });

// 缩放按钮
$('#zoomIn').addEventListener('click', () => {
  mapTransform.scale = Math.min(3, mapTransform.scale * 1.25);
  applyTransform();
});
$('#zoomOut').addEventListener('click', () => {
  mapTransform.scale = Math.max(0.5, mapTransform.scale / 1.25);
  applyTransform();
});
$('#resetMap').addEventListener('click', () => {
  mapTransform = { x: 0, y: 0, scale: 1 };
  applyTransform();
});

// 滚轮缩放
mapContainer.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  mapTransform.scale = Math.max(0.5, Math.min(3, mapTransform.scale * delta));
  applyTransform();
}, { passive: false });

// ---------- 点位详情弹窗 ----------
function openDetail(spot) {
  currentSpot = spot;
  $('#detailImg').src = spot.images[0];
  $('#detailTitle').textContent = spot.title;
  $('#detailTags').innerHTML = `<span class="detail-tag ${spot.type}">${spot.tag}</span><span class="detail-tag">${spot.city}</span>`;
  $('#detailDesc').textContent = spot.note;
  $('#detailLoc').textContent = `纬度 ${spot.lat}, 经度 ${spot.lng}`;

  const isFav = favorites.some(f => f.id === spot.id);
  $('#favBtn').innerHTML = isFav ? '♥ 已收藏' : '♡ 收藏';

  $('#detailCard').classList.add('open');
}

$('#closeDetail').addEventListener('click', () => {
  $('#detailCard').classList.remove('open');
});

// 收藏按钮
$('#favBtn').addEventListener('click', () => {
  if (!currentSpot) return;
  const idx = favorites.findIndex(f => f.id === currentSpot.id);
  if (idx >= 0) {
    favorites.splice(idx, 1);
    $('#favBtn').innerHTML = '♡ 收藏';
  } else {
    favorites.push(currentSpot);
    $('#favBtn').innerHTML = '♥ 已收藏';
    // 收藏成功微动效
    $('#favBtn').style.transform = 'scale(1.1)';
    setTimeout(() => $('#favBtn').style.transform = 'scale(1)', 200);
  }
  renderFavList();
});

// 导航按钮
$('#navBtn').addEventListener('click', () => {
  if (!currentSpot) return;
  const lat = currentSpot.lat;
  const lng = currentSpot.lng;
  const name = encodeURIComponent(currentSpot.title);

  $('#navPreview').innerHTML = `
    <strong>目的地：</strong>${currentSpot.title}<br>
    <strong>坐标：</strong>${lat}, ${lng}
  `;

  $('#amapBtn').onclick = () => {
    // 高德地图 URL Scheme / Web
    const url = `https://uri.amap.com/navigation?to=${lng},${lat},${name}&mode=car&policy=1`;
    window.open(url, '_blank');
  };

  $('#bmapBtn').onclick = () => {
    // 百度地图 URL
    const url = `https://api.map.baidu.com/direction?destination=${lat},${lng}&coord_type=wgs84&mode=driving&output=html&src=webapp.default`;
    window.open(url, '_blank');
  };

  $('#navOverlay').classList.add('open');
  $('#navModal').classList.add('open');
});

// 关闭导航弹窗
$('#navOverlay').addEventListener('click', () => {
  $('#navOverlay').classList.remove('open');
  $('#navModal').classList.remove('open');
});

// ---------- 收藏列表渲染 ----------
function renderFavList() {
  const container = $('#favList');
  if (favorites.length === 0) {
    container.innerHTML = '<div class="empty-state"><p>暂无收藏点位，在地图上点击标记可收藏</p></div>';
    return;
  }
  container.innerHTML = favorites.map(spot => `
    <div class="fav-item">
      <img src="${spot.images[0]}" alt="">
      <div class="fav-info">
        <div class="fav-title">${spot.title}</div>
        <div class="fav-loc">📍 ${spot.city} · ${spot.tag}</div>
      </div>
      <div class="fav-remove" data-id="${spot.id}">×</div>
    </div>
  `).join('');

  $$('.fav-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.id);
      favorites = favorites.filter(f => f.id !== id);
      renderFavList();
      if (currentSpot && currentSpot.id === id) {
        $('#favBtn').innerHTML = '♡ 收藏';
      }
    });
  });
}

function renderFavPage() {
  const container = $('#favListPage');
  if (favorites.length === 0) {
    container.innerHTML = '<div class="empty-state"><p>暂无收藏，快去地图页发现精彩点位吧</p></div>';
    return;
  }
  container.innerHTML = favorites.map(spot => `
    <div class="fav-item">
      <img src="${spot.images[0]}" alt="">
      <div class="fav-info">
        <div class="fav-title">${spot.title}</div>
        <div class="fav-loc">📍 ${spot.city} · ${spot.tag}</div>
        <div style="margin-top:6px;display:flex;gap:6px;">
          <button class="btn btn-sm btn-outline" style="padding:4px 10px;font-size:11px" onclick="triggerNavById(${spot.id})">🧭 导航</button>
        </div>
      </div>
      <div class="fav-remove" data-id="${spot.id}">×</div>
    </div>
  `).join('');

  $$('#favListPage .fav-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      favorites = favorites.filter(f => f.id !== parseInt(btn.dataset.id));
      renderFavPage();
    });
  });
}

// 收藏页导航按钮全局函数
window.triggerNavById = function(id) {
  const spot = spots.find(s => s.id === id);
  if (spot) {
    currentSpot = spot;
    $('#navPreview').innerHTML = `<strong>目的地：</strong>${spot.title}<br><strong>坐标：</strong>${spot.lat}, ${spot.lng}`;
    $('#amapBtn').onclick = () => window.open(`https://uri.amap.com/navigation?to=${spot.lng},${spot.lat},${encodeURIComponent(spot.title)}&mode=car&policy=1`, '_blank');
    $('#bmapBtn').onclick = () => window.open(`https://api.map.baidu.com/direction?destination=${spot.lat},${spot.lng}&coord_type=wgs84&mode=driving&output=html&src=webapp.default`, '_blank');
    $('#navOverlay').classList.add('open');
    $('#navModal').classList.add('open');
  }
};

// ---------- 初始化 ----------
renderMapMarkers();
renderFavList();

// 默认从发布页开始（用户需求），但Tab高亮在地图？
// 重新按需求：打开即可查看，建议默认展示地图页
switchPage('map');
</script>
</body>
</html>
