<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>💊 赛博糊弄学</h1>
    <p class="subtitle" id="typewriter"></p>
  </div>

  <!-- Scene Selection -->
  <div class="card card-glow">
    <div class="card-title">🎭 选择糊弄场景</div>
    <div class="scene-grid">
      <div class="scene-item" data-scene="teacher">
        <span class="scene-emoji">👨‍🏫</span>
        <span class="scene-label">导师消息</span>
      </div>
      <div class="scene-item" data-scene="partner">
        <span class="scene-emoji">💔</span>
        <span class="scene-label">对象生气</span>
      </div>
      <div class="scene-item" data-scene="group">
        <span class="scene-emoji">👥</span>
        <span class="scene-label">群聊催活</span>
      </div>
      <div class="scene-item" data-scene="elder">
        <span class="scene-emoji">👴</span>
        <span class="scene-label">长辈问候</span>
      </div>
      <div class="scene-item" data-scene="work">
        <span class="scene-emoji">💼</span>
        <span class="scene-label">工作群@</span>
      </div>
      <div class="scene-item" data-scene="universal">
        <span class="scene-emoji">🤷</span>
        <span class="scene-label">万能通用</span>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="card">
    <div class="card-title">💬 对方说了啥？</div>
    <div class="input-area">
      <input type="text" class="input-field" id="inputField" placeholder="输入对方说了啥…（比如：作业写完了吗？）">
    </div>
    <button class="generate-btn" id="generateBtn">🤖 生成糊弄回复</button>
  </div>

  <!-- Loading -->
  <div class="loading-area" id="loadingArea">
    <div class="loading-dots">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>
    <div class="loading-text">AI 正在深度糊弄中…</div>
  </div>

  <!-- Results -->
  <div class="chat-area" id="chatArea">
    <div class="card card-glow">
      <div class="card-title">📱 糊弄结果</div>
      <div id="chatContent"></div>
      <div class="stats-area" id="statsArea"></div>

    </div>

  <!-- Footer Quote -->
  <div class="footer-quote">

  </div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // Mock Data
  const mockData = {
    teacher: {
      question: "论文写完了吗？",
      answer: "关于论文的问题，我觉得这是一个值得深入探讨的话题。正如爱因斯坦所说，伟大的发现往往来自于对细节的反复思考。我目前正处于这个深度思考的关键阶段，相信在不久的将来会有实质性的突破。",
      score: 5,
      seriousness: 95
    },
    partner: {
      question: "你怎么又不回我消息？",
      answer: "亲爱的，这个问题其实反映了现代通讯方式中的一个深层矛盾——信息的即时性和人类注意力的有限性之间的冲突。我正在努力寻找平衡点，而这个寻找本身，就是对这段关系最大的尊重。",
      score: 5,
      seriousness: 88
    },
    group: {
      question: "@你 这个方案你改好了吗？",
      answer: "好的收到，已经在推进中了。方案优化是一个持续迭代的过程，就像雕塑家不断打磨作品一样。我在关注几个关键细节的优化，会在合适的时间点输出一个让大家都满意的版本。",
      score: 4,
      seriousness: 82
    },
    elder: {
      question: "找对象了吗？",
      answer: "这个问题啊，其实和经济学里的'最优解'理论有点像。每个人的时间线不同，幸福的标准也不同。我目前正在专注于自我提升，相信缘分会在对的时间出现。到时候一定第一时间告诉您！",
      score: 4,
      seriousness: 78
    },
    work: {
      question: "@全体成员 本周进度汇报一下",
      answer: "本周工作整体稳步推进中，各项任务按照既定计划有序开展。目前处于关键节点的攻坚阶段，部分模块已进入深度优化周期。预计下周会有更明确的阶段性成果可以同步给大家。",
      score: 5,
      seriousness: 92
    },
    universal: {
      question: "在吗？",
      answer: "在的。关于您提到的这个问题，我认为需要从多个维度来综合考量。当前的信息量还不足以给出一个全面而准确的回应，建议您补充更多背景细节，这样我才能给出更有针对性的反馈。",
      score: 4,
      seriousness: 85
    }
  };

  const quotes = [
    "你认真就输了，但糊弄要认真。",
    "不是不想回，是回了等于没回，才是最高境界。",
    "糊弄不是逃避，是战略性精力管理。",
    "成年人的体面：我回了，但我没完全回。",
    "说了很多，又好像什么都没说——这就是艺术。",
    "糊弄的最高境界：对方还觉得你很真诚。"
  ];

  // State
  let selectedScene = null;

  // Elements
  const sceneItems = document.querySelectorAll('.scene-item');
  const inputField = document.getElementById('inputField');
  const generateBtn = document.getElementById('generateBtn');
  const loadingArea = document.getElementById('loadingArea');
  const chatArea = document.getElementById('chatArea');
  const chatContent = document.getElementById('chatContent');
  const statsArea = document.getElementById('statsArea');
  const copyBtn = document.getElementById('copyBtn');
  const toast = document.getElementById('toast');
  const footerQuote = document.getElementById('footerQuote');
  const typewriter = document.getElementById('typewriter');

  // Random quote
  footerQuote.textContent = quotes[Math.floor(Math.random() * quotes.length)];

  // Typewriter effect
  const typeText = "说了，又好像没说。—— 一款当代社交糊弄神器";
  let typeIndex = 0;
  function typeWriter() {
    if (typeIndex < typeText.length) {
      typewriter.innerHTML = typeText.substring(0, typeIndex + 1) + '<span class="cursor"></span>';
      typeIndex++;
      setTimeout(typeWriter, 60);
    } else {
      typewriter.innerHTML = typeText + '<span class="cursor"></span>';
    }
  }
  setTimeout(typeWriter, 300);

  // Scene selection
  sceneItems.forEach(item => {
    item.addEventListener('click', () => {
      sceneItems.forEach(s => s.classList.remove('selected'));
      item.classList.add('selected');
      selectedScene = item.dataset.scene;
      // Auto-fill example question
      const data = mockData[selectedScene];
      if (data && !inputField.value) {
        inputField.value = data.question;
      }
    });
  });

  // Generate
  generateBtn.addEventListener('click', () => {
    if (!selectedScene) {
      showToast('请先选择一个糊弄场景！');
      return;
    }
    if (!inputField.value.trim()) {
      showToast('请输入对方说了啥！');
      return;
    }

    // Show loading
    loadingArea.classList.add('show');
    chatArea.classList.remove('show');

    // Simulate delay
    setTimeout(() => {
      loadingArea.classList.remove('show');
      renderResult(selectedScene, inputField.value.trim());
      chatArea.classList.add('show');
    }, 500);
  });

  // Render result
  function renderResult(scene, question) {
    const data = mockData[scene];
    const answer = data ? data.answer : "关于这个问题，我觉得需要从更宏观的视角来看待。当前的信息环境复杂多变，任何仓促的结论都可能存在局限性。建议您给我一些时间，让我进行更深入的思考后再给您一个全面的回复。";
    const score = data ? data.score : 4;
    const seriousness = data ? data.seriousness : 80;

    // Chat bubbles
    chatContent.innerHTML = `
      <div class="chat-row them">
        <div>
          <div class="chat-label">对方</div>
          <div class="chat-bubble them">${question}</div>
        </div>
      </div>
      <div class="chat-row me">
        <div>
          <div class="chat-label" style="text-align: right;">你</div>
          <div class="chat-bubble me">${answer}</div>
        </div>
      </div>
    `;

    // Stats
    const stars = '⭐'.repeat(score) + '☆'.repeat(5 - score);
    statsArea.innerHTML = `
      <div class="stat-row">
        <span class="stat-label">糊弄指数</span>
        <span class="stat-stars">${stars}</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">一本正经程度</span>
        <div class="stat-bar-bg">
          <div class="stat-bar-fill" style="width: 0%"></div>
        </div>
        <span class="stat-value">${seriousness}%</span>
      </div>
    `;

    // Animate bar
    setTimeout(() => {
      const bar = statsArea.querySelector('.stat-bar-fill');
      if (bar) bar.style.width = seriousness + '%';
    }, 200);

    // Copy button
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(answer).then(() => {
        showToast('已糊弄到位 ✅');
      }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = answer;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('已糊弄到位 ✅');
      });
    };
  }

  // Toast
  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
    }, 2000);
  }
</script>
</body>
