<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>晨光小哨</title>
    <style>
        :root {
            --bg-primary: #f8fbff;
            --bg-card: #ffffff;
            --text-primary: #2d3748;
            --text-secondary: #64748b;
            --accent: #4ade80;
            --accent-light: #ecfdf5;
            --border: #e2e8f0;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
        }

        .dark-theme {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #34d399;
            --accent-light: #0c2d1e;
            --border: #334155;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 16px;
            transition: var(--transition);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
            padding-top: 12px;
        }

        h1 {
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .status-banner {
            background: var(--accent-light);
            border-radius: 12px;
            padding: 16px;
            margin: 24px 0;
            text-align: center;
            border: 1px solid var(--accent);
            box-shadow: var(--shadow);
        }

        .status-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .lux-display {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 8px 0;
        }

        .lux-unit {
            font-size: 1rem;
            opacity: 0.8;
            vertical-align: top;
        }

        .recommendation {
            font-size: 1.1rem;
            margin-top: 12px;
            padding: 8px 16px;
            background: rgba(74, 224, 128, 0.15);
            border-radius: 8px;
            display: inline-block;
            font-weight: 500;
        }

        .slider-container {
            margin: 32px 0;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .slider-wrapper {
            position: relative;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            margin: 16px 0;
        }

        .slider-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: linear-gradient(90deg, #86efac, #4ade80, #22c55e);
            border-radius: 3px;
            transition: width 0.4s ease;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: transparent;
            outline: none;
            position: relative;
            z-index: 2;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #22c55e;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(34, 197, 94, 0.4);
            border: 2px solid white;
        }

        .control-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            flex: 1 1 160px;
            min-width: 140px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            z-index: 100;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        .theme-icon {
            font-size: 1.2rem;
            transition: var(--transition);
        }

        .info-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            margin-top: 32px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .info-card h2 {
            font-size: 1.3rem;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .tip-item {
            background: rgba(74, 224, 128, 0.08);
            padding: 14px;
            border-radius: 8px;
            border-left: 3px solid var(--accent);
        }

        .tip-item h3 {
            font-size: 1rem;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .tip-item p {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        footer {
            text-align: center;
            margin-top: 48px;
            padding: 20px 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
            border-top: 1px solid var(--border);
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
            }
            .lux-display {
                font-size: 1.8rem;
            }
            .subtitle {
                font-size: 0.95rem;
            }
            .control-group {
                flex-direction: column;
            }
            button {
                flex: none;
            }
        }

        /* Animation */
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        .started .status-banner {
            background: #ecfdf5;
            border-color: #4ade80;
        }

        .started .status-text {
            color: #065f46;
        }

        .started .recommendation {
            background: rgba(34, 197, 94, 0.2);
        }

        .started .lux-display {
            color: #065f46;
        }
    </style>
</head>
<body>
    <div class="theme-toggle" id="themeToggle">
        <span class="theme-icon">☀️</span>
    </div>

    <div class="container">
        <header>
            <h1>晨光小哨</h1>
            <p class="subtitle">用手机摄像头实时感知晨读光线，智能提醒护眼建议｜无需额外硬件</p>
        </header>

        <div class="status-banner">
            <div class="status-text">晨读状态 · 已就绪</div>
            <div class="lux-display"><span id="luxValue">328</span><span class="lux-unit"> lux</span></div>
            <div class="recommendation" id="recommendation">阳光正合适，继续朗读吧！</div>
        </div>

        <div class="slider-container">
            <div class="slider-label">
                <span>阴天窗边</span>
                <span>晨光最佳</span>
                <span>正午强光</span>
            </div>
            <div class="slider-wrapper">
                <div class="slider-fill" id="sliderFill"></div>
                <input type="range" id="lightSlider" min="50" max="1000" value="328">
            </div>
        </div>

        <div class="control-group">
            <button id="startBtn">开启晨读</button>
            <button id="simulateBtn">模拟当前环境</button>
        </div>

        <div class="info-card">
            <h2>护眼小贴士</h2>
            <div class="info-grid">
                <div class="tip-item">
                    <h3>理想照度</h3>
                    <p>晨读推荐300–500 lux，低于200需补光，高于750建议遮阳。</p>
                </div>
                <div class="tip-item">
                    <h3>轻提醒设计</h3>
                    <p>语音提示音量适中，一句话建议，不打断朗读节奏。</p>
                </div>
                <div class="tip-item">
                    <h3>即开即用</h3>
                    <p>无需校准、无需记忆数值，打开即分析，专注读书本身。</p>
                </div>
            </div>
        </div>

        <footer>
            <p>基于手机摄像头亮度分析 · 模拟演示版 | 双击打开即可使用</p>
        </footer>
    </div>

    <script>
        // DOM Elements
        const themeToggle = document.getElementById('themeToggle');
        const lightSlider = document.getElementById('lightSlider');
        const sliderFill = document.getElementById('sliderFill');
        const luxValue = document.getElementById('luxValue');
        const recommendation = document.getElementById('recommendation');
        const startBtn = document.getElementById('startBtn');
        const simulateBtn = document.getElementById('simulateBtn');
        const statusBanner = document.querySelector('.status-banner');
        const themeIcon = document.querySelector('.theme-icon');

        // Initial state
        let isDark = false;
        let isStarted = false;

        // Lux → Recommendation mapping
        const getRecommendation = (lux) => {
            if (lux < 150) return "光线不足，建议开台灯或换个亮些的位置";
            if (lux >= 150 && lux < 300) return "稍暗，侧身让光更均匀些";
            if (lux >= 300 && lux <= 500) return "阳光正合适，继续朗读吧！";
            if (lux > 500 && lux <= 750) return "光线充足，注意别反光刺眼";
            return "过强，建议拉帘或移位避光";
        };

        // Update UI based on lux value
        const updateDisplay = (lux) => {
            luxValue.textContent = Math.round(lux);
            recommendation.textContent = getRecommendation(lux);
            
            // Animate fill
            const percent = Math.min(100, Math.max(0, ((lux - 50) / 950) * 100));
            sliderFill.style.width = `${percent}%`;
        };

        // Initialize
        updateDisplay(parseInt(lightSlider.value));

        // Slider interaction
        lightSlider.addEventListener('input', () => {
            updateDisplay(parseInt(lightSlider.value));
        });

        // Start button
        startBtn.addEventListener('click', () => {
            if (!isStarted) {
                isStarted = true;
                statusBanner.classList.add('started');
                startBtn.textContent = '已启动';
                startBtn.disabled = true;
                
                // Simulate brief activation effect
                statusBanner.classList.add('pulse');
                setTimeout(() => statusBanner.classList.remove('pulse'), 2000);
            }
        });

        // Simulate button — reset to realistic morning value
        simulateBtn.addEventListener('click', () => {
            const morningValues = [286, 342, 417, 312];
            const randomLux = morningValues[Math.floor(Math.random() * morningValues.length)];
            lightSlider.value = randomLux;
            updateDisplay(randomLux);
        });

        // Theme toggle
        themeToggle.addEventListener('click', () => {
            isDark = !isDark;
            document.body.classList.toggle('dark-theme', isDark);
            themeIcon.textContent = isDark ? '🌙' : '☀️';
        });
    </script>
</body>
</html>
