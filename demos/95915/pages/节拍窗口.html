<!DOCTYPE html>
<html lang="zh-CN" class="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskKernel</title>
    <style id="theme-vars">
:root {
  /* ── Brand Colors ── */
  --color-primary: #4F46E5;
  --color-primary-light: #6366F1;
  --color-primary-lighter: #818CF8;
  --color-primary-lightest: #E0E7FF;
  --color-primary-dark: #4338CA;
  --color-primary-darker: #3730A3;

  /* ── Neutrals ── */
  --color-bg: #F8FAFC;
  --color-bg-secondary: #F1F5F9;
  --color-bg-tertiary: #E2E8F0;
  --color-surface: #FFFFFF;
  --color-surface-hover: #F8FAFC;
  --color-border: #E2E8F0;
  --color-border-strong: #CBD5E1;

  /* ── Text ── */
  --color-text: #0F172A;
  --color-text-secondary: #475569;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;
  --color-text-on-primary: #FFFFFF;

  /* ── Semantic / State Colors ── */
  --state-success: #10B981;
  --state-success-bg: #ECFDF5;
  --state-warning: #F59E0B;
  --state-warning-bg: #FFFBEB;
  --state-error: #EF4444;
  --state-error-bg: #FEF2F2;
  --state-info: #3B82F6;
  --state-info-bg: #EFF6FF;

  /* ── Priority Colors ── */
  --priority-0: #EF4444;
  --priority-0-bg: #FEF2F2;
  --priority-1: #F59E0B;
  --priority-1-bg: #FFFBEB;
  --priority-2: #3B82F6;
  --priority-2-bg: #EFF6FF;
  --priority-3: #94A3B8;
  --priority-3-bg: #F1F5F9;

  /* ── Typography ── */
  --font-display: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
  --font-body: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;

  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* ── Spacing ── */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;

  /* ── Radius ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* ── Shadows ── */
  --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.03);
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 2px 8px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 4px 16px rgba(15, 23, 42, 0.05);
}

/* ── Typography Scale ── */
.text-display { font-family: var(--font-display); font-size: var(--text-3xl); font-weight: var(--font-weight-bold); line-height: var(--leading-tight); letter-spacing: -0.02em; }
.text-heading { font-family: var(--font-display); font-size: var(--text-xl); font-weight: var(--font-weight-semibold); line-height: var(--leading-tight); }
.text-subheading { font-family: var(--font-display); font-size: var(--text-lg); font-weight: var(--font-weight-medium); line-height: var(--leading-tight); }
.text-body { font-family: var(--font-body); font-size: var(--text-base); font-weight: var(--font-weight-normal); line-height: var(--leading-normal); }
.text-body-sm { font-family: var(--font-body); font-size: var(--text-sm); font-weight: var(--font-weight-normal); line-height: var(--leading-normal); }
.text-caption { font-family: var(--font-body); font-size: var(--text-xs); font-weight: var(--font-weight-normal); line-height: var(--leading-normal); }
.text-mono { font-family: var(--font-mono); font-size: var(--text-sm); font-weight: var(--font-weight-normal); line-height: var(--leading-normal); }
.text-mono-sm { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: var(--font-weight-normal); line-height: var(--leading-normal); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>

<body class="min-h-screen">

  <!-- App Frame: Sidebar + Main Content -->
  <div class="flex h-screen w-full">

    <!-- ── Left Sidebar ── -->
    <aside id="app-sidebar"
           class="w-[140px] flex-shrink-0 h-full flex flex-col border-r border-[var(--color-border)] bg-[var(--color-surface)]">

      <!-- Sidebar Branding -->
      <div class="h-10 flex items-center justify-start px-3 border-b border-[var(--color-border)]">
        <span class="font-mono text-xs font-semibold text-[var(--color-primary)] whitespace-nowrap">TaskKernel</span>
      </div>

      <!-- Navigation Items -->
      <nav class="flex-1 py-2 overflow-y-auto" aria-label="Main navigation">

        <!-- 主视图 (Dashboard) -->
        <a href="../pages/dashboard.html"
           data-nav-key="dashboard"
           data-dom-id="nav-dashboard"
           data-active="false"
           class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-[var(--color-text-secondary)] hover:text-[var(--color-text)] transition-colors cursor-pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="shrink-0">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5"/>
          </svg>
          <span class="truncate text-xs">主视图</span>
        </a>

        <!-- 就绪队列 (Ready Queue) -->
        <a href="../pages/ready-queue.html"
           data-nav-key="ready-queue"
           data-dom-id="nav-ready-queue"
           data-active="false"
           class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-[var(--color-text-secondary)] hover:text-[var(--color-text)] transition-colors cursor-pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="shrink-0">
            <line x1="8" y1="6" x2="21" y2="6"/>
            <line x1="8" y1="12" x2="21" y2="12"/>
            <line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/>
            <line x1="3" y1="12" x2="3.01" y2="12"/>
            <line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>
          <span class="truncate text-xs">就绪队列</span>
        </a>

        <!-- 阻塞队列 (Blocked) -->
        <a href="../pages/block-queue.html"
           data-nav-key="block-queue"
           data-dom-id="nav-block-queue"
           data-active="false"
           class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-[var(--color-text-secondary)] hover:text-[var(--color-text)] transition-colors cursor-pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="shrink-0">
            <circle cx="12" cy="12" r="10"/>
            <line x1="10" y1="15" x2="10" y2="9"/>
            <line x1="14" y1="15" x2="14" y2="9"/>
          </svg>
          <span class="truncate text-xs">阻塞队列</span>
        </a>

        <!-- 节拍窗口 (Tick Window) — ACTIVE -->
        <a href="../pages/tick-window.html"
           data-nav-key="tick-window"
           data-dom-id="nav-tick-window"
           data-active="true"
           class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-[var(--color-text-secondary)] hover:text-[var(--color-text)] transition-colors cursor-pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="shrink-0">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span class="truncate text-xs">节拍窗口</span>
        </a>

        <!-- 历史库 (History) -->
        <a href="../pages/history.html"
           data-nav-key="history"
           data-dom-id="nav-history"
           data-active="false"
           class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-[var(--color-text-secondary)] hover:text-[var(--color-text)] transition-colors cursor-pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="shrink-0">
            <rect x="2" y="3" width="20" height="4" rx="1"/>
            <rect x="2" y="9" width="20" height="4" rx="1"/>
            <rect x="2" y="15" width="20" height="4" rx="1"/>
          </svg>
          <span class="truncate text-xs">历史库</span>
        </a>

        <!-- 设置 (Settings) -->
        <a href="../pages/settings.html"
           data-nav-key="settings"
           data-dom-id="nav-settings"
           data-active="false"
           class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-[var(--color-text-secondary)] hover:text-[var(--color-text)] transition-colors cursor-pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="shrink-0">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span class="truncate text-xs">设置</span>
        </a>

      </nav>

      <!-- Sidebar Footer Branding -->
      <div class="border-t border-[var(--color-border)] px-3 py-2 flex items-center justify-start">
        <span class="font-mono text-[10px] text-[var(--color-text-tertiary)] whitespace-nowrap">TaskKernel v1.0</span>
      </div>

    </aside>

    <!-- ── Main Content Area ── -->
    <div class="flex-1 flex flex-col h-screen min-w-0">

      <!-- ── Top Status Bar ── -->
      <header class="h-10 flex-shrink-0 flex items-center justify-between px-4 border-b border-[var(--color-border)] bg-[var(--color-surface)]">
        <!-- Left: App Name -->
        <div class="flex items-center gap-3">
          <span class="font-mono text-sm font-semibold text-[var(--color-primary)] whitespace-nowrap">TaskKernel</span>
        </div>

        <!-- Right: Focus Mode Pill + Tick Countdown -->
        <div class="flex items-center gap-4">
          <!-- Focus Mode Toggle Pill -->
          <div class="focus-pill flex items-center gap-1.5 px-3 py-1 rounded-full border border-[var(--color-border)] bg-[var(--color-bg-secondary)] text-[var(--color-text-secondary)] whitespace-nowrap select-none"
               data-focus-pill
               role="status"
               aria-label="Focus mode">
            <span class="inline-block w-1.5 h-1.5 rounded-full bg-[var(--color-text-tertiary)]" data-focus-dot></span>
            <span data-focus-label>专注模式 OFF</span>
          </div>

          <!-- Tick Countdown -->
          <div class="font-mono text-xs text-[var(--color-text-tertiary)] whitespace-nowrap flex items-center gap-1.5" role="status" aria-label="Tick countdown">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            <span data-tick-countdown>tick: --</span>
          </div>
        </div>
      </header>

      <!-- ── Page Content Slot ── -->
      <main class="flex-1 overflow-y-auto p-4 bg-[var(--color-bg)]">
        <div id="main-content">

          <div class="space-y-3">

            <!-- HEADER ROW: title + mono + tick pill + status — single line -->
            <div class="flex items-center gap-2">
              <h1 class="text-sm font-semibold text-[var(--color-text)] whitespace-nowrap">节拍窗口</h1>
              <span class="font-mono text-[10px] tracking-wide text-[var(--color-text-tertiary)]">TICK WINDOW | Batch Processing</span>
              <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-medium font-mono whitespace-nowrap"
                    style="background-color: var(--color-primary); color: var(--color-text-on-primary);">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                </svg>
                10:00 节拍
              </span>
              <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-medium whitespace-nowrap"
                    style="background-color: var(--state-success-bg); color: var(--state-success);">
                <span class="inline-block w-1 h-1 rounded-full" style="background-color: var(--state-success);"></span>
                进行中
              </span>
            </div>

            <!-- TICK TIMELINE — compact horizontal, minimal height -->
            <div class="flex items-center gap-0 px-3 py-2 rounded border" style="background-color: var(--color-surface); border-color: var(--color-border);">
              <!-- Tick 1: 10:00 — triggered -->
              <div class="relative flex items-center gap-1.5 z-10">
                <div class="flex items-center justify-center rounded-full shrink-0"
                     style="width: 16px; height: 16px; background-color: var(--color-primary);">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-inverse)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                </div>
                <span class="font-mono text-[10px] font-medium whitespace-nowrap" style="color: var(--color-primary);">10:00</span>
                <span class="text-[10px] whitespace-nowrap" style="color: var(--color-text-secondary);">已触发</span>
              </div>
              <!-- line filled -->
              <div class="flex-1 h-px mx-2" style="background-color: var(--color-primary);"></div>
              <!-- Tick 2: 15:00 — pending ring -->
              <div class="relative flex items-center gap-1.5 z-10">
                <div class="flex items-center justify-center rounded-full shrink-0"
                     style="width: 16px; height: 16px; background-color: var(--color-surface); border: 1.5px solid var(--color-primary-lighter);"></div>
                <span class="font-mono text-[10px] font-medium whitespace-nowrap" style="color: var(--color-text-secondary);">15:00</span>
                <span class="text-[10px] whitespace-nowrap" style="color: var(--color-text-tertiary);">待触发</span>
              </div>
              <!-- line empty -->
              <div class="flex-1 h-px mx-2" style="background-color: var(--color-bg-tertiary);"></div>
              <!-- Tick 3: 17:30 — pending empty -->
              <div class="relative flex items-center gap-1.5 z-10">
                <div class="flex items-center justify-center rounded-full shrink-0"
                     style="width: 16px; height: 16px; background-color: var(--color-surface); border: 1.5px solid var(--color-bg-tertiary);"></div>
                <span class="font-mono text-[10px] font-medium whitespace-nowrap" style="color: var(--color-text-secondary);">17:30</span>
                <span class="text-[10px] whitespace-nowrap" style="color: var(--color-text-tertiary);">待触发</span>
              </div>
            </div>

            <!-- FULL-WIDTH: 到期阻塞唤醒 -->
            <div class="rounded border overflow-hidden" style="background-color: var(--color-surface); border-color: var(--color-border);">
              <!-- header -->
              <div class="flex items-center gap-1.5 px-3 py-2 border-b" style="border-color: var(--color-border);">
                <h2 class="text-xs font-semibold text-[var(--color-text)] truncate">到期阻塞唤醒</h2>
                <span class="inline-flex items-center justify-center rounded text-[10px] font-semibold font-mono px-1 py-px whitespace-nowrap"
                      style="background-color: var(--color-primary-lightest); color: var(--color-primary);">4</span>
              </div>

              <!-- SUBGROUP: 被暂停 -->
              <div class="border-b" style="border-color: var(--color-border);">
                <div class="px-3 py-1" style="background-color: var(--color-bg-secondary);">
                  <span class="text-[10px] font-medium" style="color: var(--color-text-tertiary);">被暂停</span>
                </div>
                <!-- paused row 1 -->
                <div class="flex items-center gap-2 px-3 py-1.5 border-b" style="border-color: var(--color-border);">
                  <input type="checkbox" class="w-3 h-3 rounded border appearance-none cursor-pointer shrink-0"
                         style="border-color: var(--color-border-strong); accent-color: var(--color-primary);">
                  <span class="text-xs font-medium text-[var(--color-text)] truncate flex-1">产品经理要求加字段</span>
                  <span class="text-[10px] truncate" style="color: var(--color-text-tertiary);">外部中断暂停</span>
                  <button class="shrink-0 px-2 py-0.5 rounded text-[10px] font-medium whitespace-nowrap"
                          style="color: var(--color-primary); border: 1px solid var(--color-primary-lighter); background-color: var(--color-primary-lightest);">一键唤醒</button>
                </div>
                <!-- paused row 2 -->
                <div class="flex items-center gap-2 px-3 py-1.5">
                  <input type="checkbox" class="w-3 h-3 rounded border appearance-none cursor-pointer shrink-0"
                         style="border-color: var(--color-border-strong); accent-color: var(--color-primary);">
                  <span class="text-xs font-medium text-[var(--color-text)] truncate flex-1">服务器告警响应</span>
                  <span class="text-[10px] truncate" style="color: var(--color-text-tertiary);">外部中断暂停</span>
                  <button class="shrink-0 px-2 py-0.5 rounded text-[10px] font-medium whitespace-nowrap"
                          style="color: var(--color-primary); border: 1px solid var(--color-primary-lighter); background-color: var(--color-primary-lightest);">一键唤醒</button>
                </div>
              </div>

              <!-- SUBGROUP: 等待条件 -->
              <div>
                <div class="px-3 py-1" style="background-color: var(--color-bg-secondary);">
                  <span class="text-[10px] font-medium" style="color: var(--color-text-tertiary);">等待条件</span>
                </div>
                <!-- waiting row 1 -->
                <div class="flex items-center gap-2 px-3 py-1.5 border-b" style="border-color: var(--color-border);">
                  <input type="checkbox" class="w-3 h-3 rounded border appearance-none cursor-pointer shrink-0"
                         style="border-color: var(--color-border-strong); accent-color: var(--color-primary);">
                  <span class="text-xs font-medium text-[var(--color-text)] truncate flex-1">等待设计稿确认</span>
                  <span class="text-[10px] truncate" style="color: var(--color-text-tertiary);">定时检查到期</span>
                  <button class="shrink-0 px-2 py-0.5 rounded text-[10px] font-medium whitespace-nowrap"
                          style="color: var(--color-primary); border: 1px solid var(--color-primary-lighter); background-color: var(--color-primary-lightest);">一键唤醒</button>
                </div>
                <!-- waiting row 2 -->
                <div class="flex items-center gap-2 px-3 py-1.5">
                  <input type="checkbox" class="w-3 h-3 rounded border appearance-none cursor-pointer shrink-0"
                         style="border-color: var(--color-border-strong); accent-color: var(--color-primary);">
                  <span class="text-xs font-medium text-[var(--color-text)] truncate flex-1">第三方 API 接入</span>
                  <span class="text-[10px] truncate" style="color: var(--color-text-tertiary);">指数退避检查点</span>
                  <button class="shrink-0 px-2 py-0.5 rounded text-[10px] font-medium whitespace-nowrap"
                          style="color: var(--color-primary); border: 1px solid var(--color-primary-lighter); background-color: var(--color-primary-lightest);">一键唤醒</button>
                </div>
              </div>

              <!-- footer -->
              <div class="flex items-center justify-between px-3 py-2 border-t" style="border-color: var(--color-border); background-color: var(--color-bg);">
                <button class="px-2 py-0.5 rounded text-[10px] font-semibold whitespace-nowrap"
                        style="background-color: var(--color-primary); color: var(--color-text-on-primary);">批量唤醒选中</button>
                <button class="text-[10px] whitespace-nowrap" style="color: var(--color-text-tertiary);">全部跳过</button>
              </div>
            </div>

            <!-- BOTTOM SUMMARY BAR -->
            <div class="flex items-center justify-between px-3 py-2 rounded border"
                 style="background-color: var(--color-surface); border-color: var(--color-border);">
              <p class="font-mono text-[10px] whitespace-nowrap" style="color: var(--color-text-tertiary);">
                本次节拍: 唤醒 <span class="font-mono font-medium" style="color: var(--color-text-secondary);">0</span> 项
              </p>
              <button class="px-2 py-0.5 rounded text-[10px] font-medium whitespace-nowrap"
                      style="background-color: transparent; color: var(--color-text-secondary); border: 1px solid var(--color-border-strong);">关闭节拍窗口</button>
            </div>

          </div>

        </div>
      </main>

    </div>

  </div>

</body>
</html>
