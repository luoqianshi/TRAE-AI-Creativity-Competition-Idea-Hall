<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>城市慧眼 - 公众事件上报系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .gradient-text {
            background: linear-gradient(90deg, #FF6B35, #F7C59F);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .camera-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 0 0 rgba(255, 107, 53, 0.7);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 107, 53, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 107, 53, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 107, 53, 0); }
        }
        
        .camera-btn:active {
            transform: scale(0.95);
        }
        
        .slide-in {
            animation: slideIn 0.4s ease-out;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .status-pending { background: #fbbf24; }
        .status-processing { background: #3b82f6; }
        .status-resolved { background: #22c55e; }
        .status-rejected { background: #ef4444; }
        
        .type-tag-违建 { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .type-tag-违规 { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .type-tag-公众隐患 { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-left-color: #FF6B35;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body class="text-white min-h-screen">
    <div id="app" class="max-w-lg mx-auto min-h-screen flex flex-col">
        <header class="flex items-center justify-between p-4">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-500 to-red-500 flex items-center justify-center">
                    <i data-lucide="eye" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold">城市慧眼</h1>
                    <p class="text-xs text-gray-400">公众事件智能上报</p>
                </div>
            </div>
            <button id="historyBtn" class="p-2 rounded-full hover:bg-white/10 transition-colors">
                <i data-lucide="history" class="w-6 h-6 text-gray-300"></i>
            </button>
        </header>

        <main class="flex-1 p-4 overflow-y-auto scrollbar-hide">
            <section id="cameraSection" class="flex flex-col items-center justify-center py-8 slide-in">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold mb-2 gradient-text">发现城市问题</h2>
                    <p class="text-gray-400 text-sm">拍照识别违建、违规、公众隐患等事件</p>
                </div>

                <div class="relative mb-8">
                    <button id="cameraBtn" class="camera-btn w-32 h-32 rounded-full bg-gradient-to-br from-orange-500 to-red-500 flex items-center justify-center">
                        <i data-lucide="camera" class="w-14 h-14 text-white"></i>
                    </button>
                    <input type="file" id="fileInput" accept="image/*" capture="environment">
                    <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-white/10 backdrop-blur rounded-full px-4 py-1">
                        <span class="text-xs text-gray-300">点击拍照或上传</span>
                    </div>
                </div>

                <div id="locationInfo" class="glass-card rounded-2xl p-4 w-full mb-6">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-blue-500/20 flex items-center justify-center">
                            <i data-lucide="map-pin" class="w-5 h-5 text-blue-400"></i>
                        </div>
                        <div class="flex-1">
                            <p class="text-sm font-medium">当前位置</p>
                            <p id="addressText" class="text-xs text-gray-400">正在获取位置...</p>
                        </div>
                        <button id="refreshLocation" class="p-2 rounded-lg hover:bg-white/10 transition-colors">
                            <i data-lucide="refresh-cw" class="w-4 h-4 text-gray-400"></i>
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3 w-full">
                    <button class="event-type-btn glass-card rounded-xl p-3 flex flex-col items-center gap-2 hover:bg-white/15 transition-all" data-type="违建">
                        <div class="w-10 h-10 rounded-full bg-red-500/20 flex items-center justify-center">
                            <i data-lucide="alert-triangle" class="w-5 h-5 text-red-400"></i>
                        </div>
                        <span class="text-sm">违建</span>
                    </button>
                    <button class="event-type-btn glass-card rounded-xl p-3 flex flex-col items-center gap-2 hover:bg-white/15 transition-all" data-type="违规">
                        <div class="w-10 h-10 rounded-full bg-amber-500/20 flex items-center justify-center">
                            <i data-lucide="circle-dot" class="w-5 h-5 text-amber-400"></i>
                        </div>
                        <span class="text-sm">违规</span>
                    </button>
                    <button class="event-type-btn glass-card rounded-xl p-3 flex flex-col items-center gap-2 hover:bg-white/15 transition-all" data-type="公众隐患">
                        <div class="w-10 h-10 rounded-full bg-purple-500/20 flex items-center justify-center">
                            <i data-lucide="shield-alert" class="w-5 h-5 text-purple-400"></i>
                        </div>
                        <span class="text-sm">隐患</span>
                    </button>
                </div>
            </section>

            <section id="previewSection" class="hidden fade-in">
                <div class="flex items-center gap-4 mb-4">
                    <button id="backToCamera" class="p-2 rounded-full hover:bg-white/10 transition-colors">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    </button>
                    <h2 class="text-xl font-bold">图片预览</h2>
                </div>
                
                <div class="glass-card rounded-2xl overflow-hidden mb-4">
                    <img id="previewImage" src="" alt="预览图片" class="w-full h-64 object-cover">
                </div>
                
                <div class="flex gap-3 mb-4">
                    <button id="rotateBtn" class="flex-1 glass-card rounded-xl py-3 flex items-center justify-center gap-2 hover:bg-white/10 transition-colors">
                        <i data-lucide="rotate-cw" class="w-5 h-5"></i>
                        <span>旋转</span>
                    </button>
                    <button id="confirmImageBtn" class="flex-1 bg-gradient-to-r from-orange-500 to-red-500 rounded-xl py-3 flex items-center justify-center gap-2 hover:opacity-90 transition-opacity">
                        <i data-lucide="check" class="w-5 h-5"></i>
                        <span>确认识别</span>
                    </button>
                </div>
            </section>

            <section id="recognizeSection" class="hidden fade-in">
                <div class="flex items-center gap-4 mb-4">
                    <button id="backToPreview" class="p-2 rounded-full hover:bg-white/10 transition-colors">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    </button>
                    <h2 class="text-xl font-bold">AI 识别结果</h2>
                </div>

                <div class="glass-card rounded-2xl p-6 mb-4">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div id="resultIcon" class="w-12 h-12 rounded-xl bg-gradient-to-br from-orange-500 to-red-500 flex items-center justify-center">
                                <i data-lucide="search" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <p class="text-xs text-gray-400">识别类型</p>
                                <p id="resultType" class="text-xl font-bold">分析中...</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-xs text-gray-400">置信度</p>
                            <div class="flex items-center gap-1">
                                <div id="confidenceBar" class="w-20 h-2 bg-gray-700 rounded-full overflow-hidden">
                                    <div id="confidenceFill" class="h-full bg-green-500 w-0 transition-all duration-1000"></div>
                                </div>
                                <span id="confidenceText" class="text-sm font-bold">--%</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <p class="text-xs text-gray-400 mb-1">子类型</p>
                        <select id="subTypeSelect" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-orange-500">
                        </select>
                    </div>

                    <div>
                        <p class="text-xs text-gray-400 mb-1">识别描述</p>
                        <p id="resultDesc" class="text-sm text-gray-300">正在分析图片内容...</p>
                    </div>
                </div>

                <button id="confirmResultBtn" class="w-full bg-gradient-to-r from-orange-500 to-red-500 rounded-xl py-4 font-bold text-lg hover:opacity-90 transition-opacity">
                    确认并上报
                </button>
            </section>

            <section id="reportSection" class="hidden fade-in">
                <div class="flex items-center gap-4 mb-4">
                    <button id="backToRecognize" class="p-2 rounded-full hover:bg-white/10 transition-colors">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    </button>
                    <h2 class="text-xl font-bold">事件上报</h2>
                </div>

                <div class="glass-card rounded-2xl p-4 mb-4">
                    <div class="flex items-start gap-3">
                        <div class="w-20 h-20 rounded-xl overflow-hidden flex-shrink-0">
                            <img id="reportThumbnail" src="" alt="缩略图" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span id="reportTypeTag" class="px-2 py-0.5 rounded-full text-xs font-medium">违建</span>
                                <span id="reportSubType" class="text-sm text-gray-300">违法建筑</span>
                            </div>
                            <p id="reportAddress" class="text-xs text-gray-400 flex items-center gap-1">
                                <i data-lucide="map-pin" class="w-3 h-3"></i>
                                正在获取地址...
                            </p>
                        </div>
                    </div>
                </div>

                <div class="glass-card rounded-2xl p-4 mb-4">
                    <label class="text-sm font-medium mb-2 block">补充描述</label>
                    <textarea id="reportDescription" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 resize-none" rows="4" placeholder="请简要描述事件情况..."></textarea>
                </div>

                <button id="submitReportBtn" class="w-full bg-gradient-to-r from-orange-500 to-red-500 rounded-xl py-4 font-bold text-lg hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
                    <span id="submitBtnText">提交上报</span>
                    <div id="submitLoader" class="hidden w-5 h-5 loading-spinner"></div>
                </button>
            </section>

            <section id="successSection" class="hidden fade-in flex flex-col items-center justify-center py-12">
                <div class="w-20 h-20 rounded-full bg-green-500/20 flex items-center justify-center mb-6">
                    <i data-lucide="check-circle" class="w-10 h-10 text-green-400"></i>
                </div>
                <h2 class="text-2xl font-bold mb-2">上报成功</h2>
                <p id="successMessage" class="text-gray-400 text-center mb-6">您的举报已提交，我们将尽快处理</p>
                <div class="glass-card rounded-xl p-4 w-full mb-6">
                    <div class="flex items-center justify-between">
                        <span class="text-gray-400">上报编号</span>
                        <span id="reportId" class="font-mono font-bold">REP-2024-001</span>
                    </div>
                </div>
                <div class="flex gap-3 w-full">
                    <button id="backToHome" class="flex-1 glass-card rounded-xl py-3 font-medium hover:bg-white/10 transition-colors">
                        返回首页
                    </button>
                    <button id="viewHistory" class="flex-1 bg-gradient-to-r from-orange-500 to-red-500 rounded-xl py-3 font-medium hover:opacity-90 transition-opacity">
                        查看记录
                    </button>
                </div>
            </section>

            <section id="historySection" class="hidden fade-in">
                <div class="flex items-center gap-4 mb-4">
                    <button id="backFromHistory" class="p-2 rounded-full hover:bg-white/10 transition-colors">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    </button>
                    <h2 class="text-xl font-bold">上报历史</h2>
                </div>

                <div id="historyList" class="space-y-3">
                </div>

                <div id="emptyHistory" class="flex flex-col items-center justify-center py-12 text-gray-400">
                    <i data-lucide="inbox" class="w-12 h-12 mb-3"></i>
                    <p>暂无上报记录</p>
                </div>
            </section>
        </main>

        <footer class="p-4 text-center">
            <p class="text-xs text-gray-500">© 2024 城市慧眼 - 共建美好城市</p>
        </footer>
    </div>

    <script>
        const EVENT_TYPES = {
            违建: ['违法建筑', '占道经营', '私搭乱建'],
            违规: ['乱堆乱放', '违规停车', '噪音污染', '违规广告'],
            公众隐患: ['道路损坏', '安全隐患', '环境卫生', '设施破损']
        };

        const REPORT_STATUS = {
            pending: { label: '待处理', class: 'status-pending' },
            processing: { label: '处理中', class: 'status-processing' },
            resolved: { label: '已处理', class: 'status-resolved' },
            rejected: { label: '已驳回', class: 'status-rejected' }
        };

        const TYPE_COLORS = {
            违建: 'type-tag-违建',
            违规: 'type-tag-违规',
            公众隐患: 'type-tag-公众隐患'
        };

        let currentImage = null;
        let imageRotation = 0;
        let currentLocation = null;
        let recognizeResult = null;
        let reports = [];

        const cameraBtn = document.getElementById('cameraBtn');
        const fileInput = document.getElementById('fileInput');
        const cameraSection = document.getElementById('cameraSection');
        const previewSection = document.getElementById('previewSection');
        const recognizeSection = document.getElementById('recognizeSection');
        const reportSection = document.getElementById('reportSection');
        const successSection = document.getElementById('successSection');
        const historySection = document.getElementById('historySection');
        const previewImage = document.getElementById('previewImage');
        const addressText = document.getElementById('addressText');
        const reportAddress = document.getElementById('reportAddress');
        const reportThumbnail = document.getElementById('reportThumbnail');
        const reportTypeTag = document.getElementById('reportTypeTag');
        const reportSubType = document.getElementById('reportSubType');
        const resultType = document.getElementById('resultType');
        const resultDesc = document.getElementById('resultDesc');
        const confidenceFill = document.getElementById('confidenceFill');
        const confidenceText = document.getElementById('confidenceText');
        const subTypeSelect = document.getElementById('subTypeSelect');
        const reportDescription = document.getElementById('reportDescription');
        const historyList = document.getElementById('historyList');
        const emptyHistory = document.getElementById('emptyHistory');

        function showSection(section) {
            [cameraSection, previewSection, recognizeSection, reportSection, successSection, historySection].forEach(s => {
                s.classList.add('hidden');
            });
            section.classList.remove('hidden');
            lucide.createIcons();
        }

        function loadReports() {
            const saved = localStorage.getItem('cityEyeReports');
            if (saved) {
                reports = JSON.parse(saved);
            }
        }

        function saveReports() {
            localStorage.setItem('cityEyeReports', JSON.stringify(reports));
        }

        function getLocation() {
            addressText.textContent = '正在获取位置...';
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        currentLocation = {
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude
                        };
                        reverseGeocode(currentLocation.latitude, currentLocation.longitude);
                    },
                    (error) => {
                        addressText.textContent = '定位失败，请手动选择位置';
                        console.error('Geolocation error:', error);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
                );
            } else {
                addressText.textContent = '您的浏览器不支持定位';
            }
        }

        function reverseGeocode(lat, lng) {
            fetch(`https://api.map.baidu.com/reverse_geocoding/v3/?ak=zZ22a99GKz8rGAGYbGG9l3Q83U0GjMkp&output=json&coordtype=wgs84ll&location=${lat},${lng}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 0 && data.result) {
                        const address = data.result.formatted_address || data.result.address;
                        addressText.textContent = address;
                        reportAddress.innerHTML = `<i data-lucide="map-pin" class="w-3 h-3"></i>${address}`;
                    } else {
                        addressText.textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                        reportAddress.innerHTML = `<i data-lucide="map-pin" class="w-3 h-3"></i>${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                    }
                })
                .catch(() => {
                    addressText.textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                    reportAddress.innerHTML = `<i data-lucide="map-pin" class="w-3 h-3"></i>${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                });
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                currentImage = e.target.result;
                imageRotation = 0;
                previewImage.src = currentImage;
                showSection(previewSection);
            };
            reader.readAsDataURL(file);
        }

        function rotateImage() {
            imageRotation += 90;
            previewImage.style.transform = `rotate(${imageRotation}deg)`;
        }

        function compressImage(base64, maxWidth = 1024, maxHeight = 1024) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64;
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = (height * maxWidth) / width;
                        width = maxWidth;
                    }
                    if (height > maxHeight) {
                        width = (width * maxHeight) / height;
                        height = maxHeight;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    
                    ctx.save();
                    ctx.translate(width / 2, height / 2);
                    ctx.rotate((imageRotation * Math.PI) / 180);
                    ctx.drawImage(img, -width / 2, -height / 2, width, height);
                    ctx.restore();

                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
            });
        }

        function simulateAIRecognize() {
            resultType.textContent = '分析中...';
            resultDesc.textContent = '正在分析图片内容...';
            confidenceFill.style.width = '0%';
            confidenceText.textContent = '--%';

            setTimeout(() => {
                const types = Object.keys(EVENT_TYPES);
                const mainType = types[Math.floor(Math.random() * types.length)];
                const subTypes = EVENT_TYPES[mainType];
                const subType = subTypes[Math.floor(Math.random() * subTypes.length)];
                const confidence = (0.7 + Math.random() * 0.29).toFixed(2);

                recognizeResult = {
                    eventType: mainType,
                    subType: subType,
                    confidence: parseFloat(confidence),
                    description: `AI识别到疑似${mainType}-${subType}，建议人工确认`
                };

                resultType.textContent = mainType;
                resultDesc.textContent = recognizeResult.description;
                confidenceFill.style.width = `${(recognizeResult.confidence * 100).toFixed(0)}%`;
                confidenceText.textContent = `${(recognizeResult.confidence * 100).toFixed(0)}%`;

                subTypeSelect.innerHTML = '';
                subTypes.forEach(type => {
                    const option = document.createElement('option');
                    option.value = type;
                    option.textContent = type;
                    if (type === subType) option.selected = true;
                    subTypeSelect.appendChild(option);
                });

                const iconDiv = document.getElementById('resultIcon');
                iconDiv.className = `w-12 h-12 rounded-xl flex items-center justify-center ${TYPE_COLORS[mainType].replace('type-tag-', 'bg-gradient-to-br from-')}`;
                
                let iconName = 'search';
                if (mainType === '违建') iconName = 'alert-triangle';
                else if (mainType === '违规') iconName = 'circle-dot';
                else if (mainType === '公众隐患') iconName = 'shield-alert';
                
                iconDiv.innerHTML = `<i data-lucide="${iconName}" class="w-6 h-6"></i>`;
                lucide.createIcons();

            }, 2000);
        }

        function submitReport() {
            const btnText = document.getElementById('submitBtnText');
            const loader = document.getElementById('submitLoader');
            
            btnText.textContent = '提交中...';
            loader.classList.remove('hidden');

            setTimeout(async () => {
                const compressedImage = await compressImage(currentImage);
                
                const report = {
                    id: `REP-${new Date().getFullYear()}-${String(reports.length + 1).padStart(3, '0')}`,
                    eventType: recognizeResult.eventType,
                    subType: subTypeSelect.value,
                    image: compressedImage,
                    latitude: currentLocation?.latitude || 0,
                    longitude: currentLocation?.longitude || 0,
                    address: addressText.textContent,
                    description: reportDescription.value,
                    status: 'pending',
                    timestamp: Date.now()
                };

                reports.unshift(report);
                if (reports.length > 100) reports.pop();
                saveReports();

                document.getElementById('reportId').textContent = report.id;
                document.getElementById('successMessage').textContent = '您的举报已提交，我们将尽快处理';
                
                btnText.textContent = '提交上报';
                loader.classList.add('hidden');
                
                showSection(successSection);
            }, 1500);
        }

        function renderHistory() {
            historyList.innerHTML = '';
            
            if (reports.length === 0) {
                emptyHistory.classList.remove('hidden');
                return;
            }
            
            emptyHistory.classList.add('hidden');
            
            reports.forEach(report => {
                const item = document.createElement('div');
                item.className = 'glass-card rounded-xl p-4 flex gap-4';
                
                const date = new Date(report.timestamp);
                const dateStr = `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
                const status = REPORT_STATUS[report.status];
                
                item.innerHTML = `
                    <div class="w-16 h-16 rounded-xl overflow-hidden flex-shrink-0">
                        <img src="${report.image}" alt="事件图片" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="px-2 py-0.5 rounded-full text-xs font-medium ${TYPE_COLORS[report.eventType]}">${report.eventType}</span>
                            <span class="text-sm text-gray-300 truncate">${report.subType}</span>
                        </div>
                        <p class="text-xs text-gray-400 truncate mb-2">${report.address}</p>
                        <div class="flex items-center justify-between">
                            <span class="text-xs text-gray-500">${dateStr}</span>
                            <span class="px-2 py-0.5 rounded-full text-xs font-medium ${status.class}">${status.label}</span>
                        </div>
                    </div>
                `;
                
                historyList.appendChild(item);
            });
        }

        cameraBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleImageUpload);

        document.getElementById('backToCamera').addEventListener('click', () => {
            showSection(cameraSection);
            fileInput.value = '';
        });

        document.getElementById('rotateBtn').addEventListener('click', rotateImage);

        document.getElementById('confirmImageBtn').addEventListener('click', async () => {
            showSection(recognizeSection);
            simulateAIRecognize();
        });

        document.getElementById('backToPreview').addEventListener('click', () => showSection(previewSection));

        document.getElementById('confirmResultBtn').addEventListener('click', () => {
            recognizeResult.subType = subTypeSelect.value;
            reportThumbnail.src = currentImage;
            reportTypeTag.textContent = recognizeResult.eventType;
            reportTypeTag.className = `px-2 py-0.5 rounded-full text-xs font-medium ${TYPE_COLORS[recognizeResult.eventType]}`;
            reportSubType.textContent = recognizeResult.subType;
            reportDescription.value = '';
            showSection(reportSection);
        });

        document.getElementById('backToRecognize').addEventListener('click', () => showSection(recognizeSection));

        document.getElementById('submitReportBtn').addEventListener('click', submitReport);

        document.getElementById('backToHome').addEventListener('click', () => {
            showSection(cameraSection);
            fileInput.value = '';
        });

        document.getElementById('viewHistory').addEventListener('click', () => {
            renderHistory();
            showSection(historySection);
        });

        document.getElementById('historyBtn').addEventListener('click', () => {
            renderHistory();
            showSection(historySection);
        });

        document.getElementById('backFromHistory').addEventListener('click', () => {
            showSection(cameraSection);
        });

        document.getElementById('refreshLocation').addEventListener('click', getLocation);

        document.querySelectorAll('.event-type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const type = btn.dataset.type;
                recognizeResult = {
                    eventType: type,
                    subType: EVENT_TYPES[type][0],
                    confidence: 1,
                    description: `用户选择了${type}类型`
                };
                
                resultType.textContent = type;
                resultDesc.textContent = recognizeResult.description;
                confidenceFill.style.width = '100%';
                confidenceText.textContent = '100%';
                
                subTypeSelect.innerHTML = '';
                EVENT_TYPES[type].forEach(sub => {
                    const option = document.createElement('option');
                    option.value = sub;
                    option.textContent = sub;
                    subTypeSelect.appendChild(option);
                });

                const iconDiv = document.getElementById('resultIcon');
                iconDiv.className = `w-12 h-12 rounded-xl flex items-center justify-center ${TYPE_COLORS[type].replace('type-tag-', 'bg-gradient-to-br from-')}`;
                
                let iconName = 'search';
                if (type === '违建') iconName = 'alert-triangle';
                else if (type === '违规') iconName = 'circle-dot';
                else if (type === '公众隐患') iconName = 'shield-alert';
                
                iconDiv.innerHTML = `<i data-lucide="${iconName}" class="w-6 h-6"></i>`;
                lucide.createIcons();
                
                showSection(recognizeSection);
            });
        });

        loadReports();
        getLocation();
        lucide.createIcons();
    </script>
</body>
</html>
