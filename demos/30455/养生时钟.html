<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十二时辰养生时钟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "SimSun", "STKaiti", serif;
            background: linear-gradient(135deg, #e8d5b7 0%, #d4c4a8 50%, #c9b896 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .title {
            font-size: 3rem;
            color: #5c3a21;
            text-shadow: 2px 2px 4px rgba(92, 58, 33, 0.3);
            margin-bottom: 10px;
            font-weight: bold;
            letter-spacing: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #8b5a2b;
            margin-bottom: 30px;
            letter-spacing: 6px;
        }

        .clock-container {
            position: relative;
            width: 800px;
            height: 800px;
            margin: 20px auto;
        }

        /* ========== 第六层：最外大圆圈 ========== */
        .layer-6-outer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 810px;
            height: 810px;
            border-radius: 50%;
            border: 20px solid #2b1d14;
            background: #f5f0e8;
            box-shadow:
                0 0 60px rgba(43, 29, 20, 0.5),
                inset 0 0 60px rgba(139, 69, 19, 0.08);
        }

        /* ========== 第五层：24小时数字 ========== */
        .layer-5-hours24 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 750px;
            height: 750px;
            border-radius: 50%;
            border: 3px solid #132c33;
            background: #fee4fe;
        }

        .hour-24 {
            position: absolute;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #011b01;
            font-weight: bold;
            font-family: "STKaiti", "KaiTi", serif;
        }

        /* ========== 第四层：十二时辰 ========== */
        .layer-4-shichen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 650px;
            height: 650px;
            border-radius: 50%;
            border: 3px solid #951c48;
            background: #fff5b7;
        }

        .shichen-label {
            position: absolute;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            color: #5c3a21;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 50%;
            font-family: "STKaiti", "KaiTi", serif;
        }

        .shichen-label:hover {
            transform: scale(1.2);
            background: rgba(139, 69, 19, 0.1);
        }

        .shichen-label.active {
            background: linear-gradient(145deg, #b8d8f0, #8ecae6);
            color: #2b1d14;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* ========== 第三层：当令脏腑 ========== */
        .layer-3-organs {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 520px;
            height: 520px;
            border-radius: 50%;
            border: 3px solid #f28e16;
            background: #d6eaf8;
        }

        .organ-label {
            position: absolute;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #248067;
            transition: all 0.3s ease;
            font-family: "STKaiti", "KaiTi", serif;
        }

        .organ-label.active {
            color: #f33b1f;
            font-size: 28px;
            text-shadow: 0 0 15px rgba(178, 34, 34, 0.6);
        }

        /* 脏腑分隔符 */
        .organ-divider {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 250px;
            background: linear-gradient(to bottom, transparent, #c9a86c, transparent);
            transform-origin: top center;
            pointer-events: none;
        }

        /* ========== 第二层：12小时数字+刻度 ========== */
        .layer-2-hours12 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 380px;
            height: 380px;
            border-radius: 50%;
            border: 3px solid #6769e3;
            background: #eef7f2;
        }

        .hour-12 {
            position: absolute;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #d4af37;
            font-weight: bold;
            font-family: "STKaiti", "KaiTi", serif;
        }

        /* 时间刻度 - 在圆的内侧 */
        .tick-mark {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            background: #8b5a2b;
            transform-origin: top center;
            pointer-events: none;
        }

        .tick-major {
            height: 16px;
            background: #ba2f7b;
        }

        .tick-minor {
            height: 10px;
            background: #4c1f24;
        }

        /* ========== 第一层：八卦 ========== */
        .layer-1-bagua {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 3px solid #fa6f42;
            background: #fff;
        }

        .bagua-item {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: "STKaiti", "KaiTi", serif;
            cursor: pointer;
            z-index: 1;
        }

        .bagua-item:hover {
            z-index: 100;
        }

        .bagua-name {
            font-size: 14px;
            color: #5c3a21;
            font-weight: bold;
            margin-bottom: 4px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .bagua-item:hover .bagua-name {
            opacity: 1;
        }

        .bagua-tooltip {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(43, 29, 20, 0.9);
            color: #c9a86c;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            border: 1px solid #c9a86c;
            z-index: 101;
        }

        .bagua-item:hover .bagua-tooltip {
            opacity: 1;
        }

        .bagua-lines {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .yao-yang {
            width: 24px;
            height: 4px;
            background: #2b1d14;
            border-radius: 2px;
        }

        .yao-yin {
            display: flex;
            gap: 3px;
        }

        .yao-yin span {
            width: 10.5px;
            height: 4px;
            background: #2b1d14;
            border-radius: 2px;
        }

        /* ========== 内核层：标准太极图 ========== */
        .layer-0-taiji {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid #8b5a2b;
            overflow: hidden;
            animation: rotate 30s linear infinite;
            z-index: 10;
            transform: translate(-50%, -50%);
        }

        /* 太极图 - 左半黑右半白 */
        .layer-0-taiji::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: #000;
        }

        /* 太极图 - 上半部白色圆 */
        .layer-0-taiji .taiji-top {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
            height: 50%;
            background: #fff;
            border-radius: 50%;
            z-index: 2;
        }

        /* 太极图 - 下半部黑色圆 */
        .layer-0-taiji .taiji-bottom {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
            height: 50%;
            background: #000;
            border-radius: 50%;
            z-index: 2;
        }

        /* 太极图 - 上半部黑点 */
        .layer-0-taiji .taiji-dot-top {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: #000;
            border-radius: 50%;
            z-index: 3;
        }

        /* 太极图 - 下半部白点 */
        .layer-0-taiji .taiji-dot-bottom {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translate(-50%, 50%);
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            z-index: 3;
        }

        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* 指针轴点 */
        .clock-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            background: #2b1d14;
            border-radius: 50%;
            z-index: 20;
            border: 3px solid #c9a86c;
        }

        /* 指针 */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 10px;
            z-index: 15;
        }

        .hour-hand {
            width: 8px;
            height: 160px;
            background: linear-gradient(to top, #5c3a21, #8b5a2b);
            margin-left: -4px;
            transition: transform 0.1s cubic-bezier(0.4, 2.3, 0.3, 1);
        }

        .minute-hand {
            width: 5px;
            height: 220px;
            background: linear-gradient(to top, #6b4423, #a67c52);
            margin-left: -2.5px;
            transition: transform 0.1s cubic-bezier(0.4, 2.3, 0.3, 1);
        }

        .second-hand {
            width: 2px;
            height: 260px;
            background: linear-gradient(to top, #b22222, #c9302c);
            margin-left: -1px;
            transition: none;
        }

        /* 养生信息面板 */
        .info-panel {
            background: linear-gradient(145deg, #faf6f0, #f5efe6);
            border: 3px solid #2b1d14;
            border-radius: 20px;
            padding: 25px;
            margin-top: 30px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(43, 29, 20, 0.2);
        }

        .info-panel .current-time {
            font-size: 1.8rem;
            color: #2b1d14;
            font-weight: bold;
            margin-bottom: 12px;
            font-family: "STKaiti", "KaiTi", serif;
        }

        .info-panel .shi-chen-info {
            font-size: 1.4rem;
            color: #5c3a21;
            margin-bottom: 10px;
            font-family: "STKaiti", "KaiTi", serif;
        }

        .info-panel .organ-info {
            font-size: 1.3rem;
            color: #b22222;
            font-weight: bold;
            margin-bottom: 10px;
            font-family: "STKaiti", "KaiTi", serif;
        }

        .info-panel .advice {
            font-size: 1.1rem;
            color: #6b4423;
            font-style: italic;
            padding: 12px;
            background: rgba(139, 69, 19, 0.05);
            border-radius: 10px;
            margin-top: 12px;
            border-left: 4px solid #c9a86c;
        }

        /* 控制按钮 */
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 10px 20px;
            border: 2px solid #2b1d14;
            background: linear-gradient(145deg, #faf6f0, #f5efe6);
            color: #2b1d14;
            border-radius: 25px;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn:hover {
            background: linear-gradient(145deg, #2b1d14, #4a3428);
            color: #c9a86c;
            border-color: #c9a86c;
        }

        .btn.active {
            background: linear-gradient(145deg, #2b1d14, #4a3428);
            color: #c9a86c;
            border-color: #c9a86c;
        }

        /* 提示弹窗 */
        .tooltip {
            position: fixed;
            background: rgba(43, 29, 20, 0.95);
            color: #c9a86c;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 15px;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            max-width: 220px;
            text-align: center;
            border: 1px solid #c9a86c;
        }

        .tooltip.show {
            opacity: 1;
        }

        /* 时辰切换提醒 */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(145deg, #2b1d14, #4a3428);
            color: #c9a86c;
            padding: 18px 25px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(43, 29, 20, 0.5);
            z-index: 1001;
            transform: translateX(400px);
            transition: transform 0.5s ease;
            font-weight: bold;
            border: 2px solid #c9a86c;
            font-size: 16px;
        }

        .notification.show {
            transform: translateX(0);
        }

        /* 响应式设计 */
        @media (max-width: 850px) {
            .clock-container {
                width: 600px;
                height: 600px;
            }

            .layer-6-outer {
                width: 600px;
                height: 600px;
                border-width: 15px;
            }

            .layer-5-hours24 {
                width: 560px;
                height: 560px;
            }

            .layer-4-shichen {
                width: 490px;
                height: 490px;
            }

            .layer-3-organs {
                width: 390px;
                height: 390px;
            }

            .layer-2-hours12 {
                width: 280px;
                height: 280px;
            }

            .layer-1-bagua {
                width: 160px;
                height: 160px;
            }

            .layer-0-taiji {
                width: 75px;
                height: 75px;
            }

            .hour-hand { height: 120px; }
            .minute-hand { height: 165px; }
            .second-hand { height: 195px; }

            .title {
                font-size: 2.2rem;
                letter-spacing: 6px;
            }

            .shichen-label {
                width: 55px;
                height: 55px;
                font-size: 18px;
            }

            .organ-label {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="title">十二时辰养生钟</div>
    <div class="subtitle">顺应天时 · 养护身心</div>

    <div class="clock-container">
        <!-- 第六层：最外大圆圈 -->
        <div class="layer-6-outer"></div>

        <!-- 第五层：24小时数字 -->
        <div class="layer-5-hours24" id="layer5"></div>

        <!-- 第四层：十二时辰 -->
        <div class="layer-4-shichen" id="layer4"></div>

        <!-- 第三层：当令脏腑 -->
        <div class="layer-3-organs" id="layer3"></div>

        <!-- 第二层：12小时数字+刻度 -->
        <div class="layer-2-hours12" id="layer2"></div>

        <!-- 第一层：八卦 -->
        <div class="layer-1-bagua" id="layer1"></div>

        <!-- 内核层：太极图 -->
        <div class="layer-0-taiji" id="layer0">
            <div class="taiji-top"></div>
            <div class="taiji-bottom"></div>
            <div class="taiji-dot-top"></div>
            <div class="taiji-dot-bottom"></div>
        </div>

        <!-- 指针轴点 -->
        <div class="clock-center"></div>

        <!-- 指针 -->
        <div class="hand hour-hand" id="hourHand"></div>
        <div class="hand minute-hand" id="minuteHand"></div>
        <div class="hand second-hand" id="secondHand"></div>
    </div>

    <div class="info-panel">
        <div class="current-time" id="currentTime"></div>
        <div class="shi-chen-info" id="shiChenInfo"></div>
        <div class="organ-info" id="organInfo"></div>
        <div class="advice" id="advice"></div>
    </div>

    <div class="controls">
        <button class="btn" id="soundBtn" onclick="toggleSound()">🔔 开启声音</button>
        <button class="btn" onclick="showAllInfo()">📋 全部时辰</button>
    </div>

    <div class="tooltip" id="tooltip"></div>
    <div class="notification" id="notification"></div>

    <script>
        // 十二时辰数据
        const shiChenData = [
            { name: '子时', start: 23, end: 1, organ: '胆', advice: '养胆排毒，应入睡', detail: '子时胆经当令，此时入睡有助于胆汁代谢和排毒。' },
            { name: '丑时', start: 1, end: 3, organ: '肝', advice: '养肝排毒，忌熬夜', detail: '丑时肝经当令，深度睡眠有助于肝脏解毒和造血。' },
            { name: '寅时', start: 3, end: 5, organ: '肺', advice: '养肺排毒，需熟睡', detail: '寅时肺经当令，此时人体气血由静转动，需保持熟睡。' },
            { name: '卯时', start: 5, end: 7, organ: '大肠', advice: '养肠排毒，宜饮水排泄', detail: '卯时大肠经当令，此时起床喝水有助于排便排毒。' },
            { name: '辰时', start: 7, end: 9, organ: '胃', advice: '养胃时间，宜早餐', detail: '辰时胃经当令，此时吃早餐最容易消化吸收。' },
            { name: '巳时', start: 9, end: 11, organ: '脾', advice: '养脾时间，忌冰寒', detail: '巳时脾经当令，此时工作学习效率最高，忌食寒凉。' },
            { name: '午时', start: 11, end: 13, organ: '心', advice: '养心时间，宜午睡', detail: '午时心经当令，此时午睡30分钟有助于养心安神。' },
            { name: '未时', start: 13, end: 15, organ: '小肠', advice: '养肠时间，宜运动', detail: '未时小肠经当令，此时适合轻度运动，促进消化。' },
            { name: '申时', start: 15, end: 17, organ: '膀胱', advice: '膀胱排毒，宜饮水排泄', detail: '申时膀胱经当令，此时多喝水有助于排毒。' },
            { name: '酉时', start: 17, end: 19, organ: '肾', advice: '养肾时间，宜食晚餐', detail: '酉时肾经当令，此时吃晚餐有助于补肾养生。' },
            { name: '戌时', start: 19, end: 21, organ: '心包', advice: '养气时间，宜放松心情', detail: '戌时心包经当令，此时适合放松身心，准备休息。' },
            { name: '亥时', start: 21, end: 23, organ: '三焦', advice: '养气时间，宜泡脚入睡', detail: '亥时三焦经当令，此时泡脚有助于睡眠和气血运行。' }
        ];

        // 八卦数据 - 严格按先天八卦方位：乾南、坤北、离东、坎西、兑东南、震东北、巽西南、艮西北
        const baguaData = [
            { name: '乾', lines: ['yang', 'yang', 'yang'], angle: 0, meaning: '天，刚健' },
            { name: '兑', lines: ['yang', 'yang', 'yin'], angle: 45, meaning: '泽，喜悦' },
            { name: '离', lines: ['yang', 'yin', 'yang'], angle: 90, meaning: '火，光明' },
            { name: '震', lines: ['yin', 'yin', 'yang'], angle: 135, meaning: '雷，震动' },
            { name: '坤', lines: ['yin', 'yin', 'yin'], angle: 180, meaning: '地，柔顺' },
            { name: '艮', lines: ['yang', 'yin', 'yin'], angle: 225, meaning: '山，静止' },
            { name: '坎', lines: ['yin', 'yang', 'yin'], angle: 270, meaning: '水，险陷' },
            { name: '巽', lines: ['yin', 'yang', 'yang'], angle: 315, meaning: '风，入伏' }
        ];

        let soundEnabled = false;
        let currentShiChenIndex = -1;
        let audioContext = null;

        // 初始化音频上下文
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // 播放钟声
        function playBellSound() {
            if (!soundEnabled || !audioContext) return;

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(261.63, audioContext.currentTime + 2);

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 2);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 2);
        }

        // 切换声音
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundBtn');
            if (soundEnabled) {
                initAudio();
                btn.textContent = '🔔 声音已开启';
                btn.classList.add('active');
                playBellSound();
            } else {
                btn.textContent = '🔔 开启声音';
                btn.classList.remove('active');
            }
        }

        // 获取当前时辰
        function getCurrentShiChen() {
            const now = new Date();
            const hour = now.getHours();

            for (let i = 0; i < shiChenData.length; i++) {
                const sc = shiChenData[i];
                if (sc.start > sc.end) {
                    if (hour >= sc.start || hour < sc.end) {
                        return i;
                    }
                } else {
                    if (hour >= sc.start && hour < sc.end) {
                        return i;
                    }
                }
            }
            return 0;
        }

        // 创建爻元素
        function createYao(type) {
            if (type === 'yang') {
                const div = document.createElement('div');
                div.className = 'yao-yang';
                return div;
            } else {
                const div = document.createElement('div');
                div.className = 'yao-yin';
                div.innerHTML = '<span></span><span></span>';
                return div;
            }
        }

        // 生成八卦 - 严格按先天八卦方位
        function generateBagua() {
            const layer1 = document.getElementById('layer1');
            const radius = 80;
            const centerX = 110;
            const centerY = 110;

            baguaData.forEach((bagua) => {
                const angleRad = (bagua.angle - 90) * Math.PI / 180;
                const x = Math.cos(angleRad) * radius + centerX;
                const y = Math.sin(angleRad) * radius + centerY;

                const baguaItem = document.createElement('div');
                baguaItem.className = 'bagua-item';
                baguaItem.style.left = (x - 20) + 'px';
                baguaItem.style.top = (y - 30) + 'px';

                const tooltipDiv = document.createElement('div');
                tooltipDiv.className = 'bagua-tooltip';
                tooltipDiv.textContent = bagua.name + '：' + bagua.meaning;
                baguaItem.appendChild(tooltipDiv);

                const nameDiv = document.createElement('div');
                nameDiv.className = 'bagua-name';
                nameDiv.textContent = bagua.name;
                baguaItem.appendChild(nameDiv);

                const linesDiv = document.createElement('div');
                linesDiv.className = 'bagua-lines';
                bagua.lines.forEach(lineType => {
                    linesDiv.appendChild(createYao(lineType));
                });
                baguaItem.appendChild(linesDiv);

                layer1.appendChild(baguaItem);
            });
        }

        // 生成12小时数字和刻度
        function generateHours12() {
            const layer2 = document.getElementById('layer2');
            const radius = 155;
            const centerX = 190;
            const centerY = 190;

            // 生成刻度 - 在圆的内侧
            const innerRadius = 170; // 刻度起始位置（靠近圆内侧）
            for (let i = 0; i < 60; i++) {
                const angleDeg = i * 6;
                const angleRad = (angleDeg - 90) * Math.PI / 180;
                const tick = document.createElement('div');
                tick.className = i % 5 === 0 ? 'tick-mark tick-major' : 'tick-mark tick-minor';

                // 刻度从内侧圆周向圆心方向延伸
                const tickLength = i % 5 === 0 ? 16 : 10;
                const x = Math.cos(angleRad) * innerRadius + centerX;
                const y = Math.sin(angleRad) * innerRadius + centerY;

                tick.style.left = x + 'px';
                tick.style.top = y + 'px';
                tick.style.transform = `rotate(${angleDeg}deg) translateY(-${tickLength}px)`;

                layer2.appendChild(tick);
            }

            // 生成12小时数字
            for (let i = 1; i <= 12; i++) {
                const angle = (i * 30 - 90) * Math.PI / 180;
                const x = Math.cos(angle) * radius + centerX;
                const y = Math.sin(angle) * radius + centerY;

                const hourLabel = document.createElement('div');
                hourLabel.className = 'hour-12';
                hourLabel.textContent = i;
                hourLabel.style.left = (x - 25) + 'px';
                hourLabel.style.top = (y - 25) + 'px';
                layer2.appendChild(hourLabel);
            }
        }

        // 生成脏腑层
        function generateOrgans() {
            const layer3 = document.getElementById('layer3');
            const radius = 225;
            const centerX = 260;
            const centerY = 260;

            // 生成分隔符
            for (let i = 0; i < 12; i++) {
                const angle = (i * 30 - 90) * Math.PI / 180;
                const divider = document.createElement('div');
                divider.className = 'organ-divider';
                divider.style.transform = `rotate(${i * 30}deg) translateY(-125px)`;
                layer3.appendChild(divider);
            }

            // 生成脏腑标签
            shiChenData.forEach((sc, index) => {
                const angle = (index * 30 - 90) * Math.PI / 180;
                const x = Math.cos(angle) * radius + centerX;
                const y = Math.sin(angle) * radius + centerY;

                const organLabel = document.createElement('div');
                organLabel.className = 'organ-label';
                organLabel.id = `organ-${index}`;
                organLabel.textContent = sc.organ;
                organLabel.style.left = (x - 30) + 'px';
                organLabel.style.top = (y - 30) + 'px';
                layer3.appendChild(organLabel);
            });
        }

        // 生成十二时辰
        function generateShiChen() {
            const layer4 = document.getElementById('layer4');
            const radius = 293;
            const centerX = 325;
            const centerY = 325;

            shiChenData.forEach((sc, index) => {
                const angle = (index * 30 - 90) * Math.PI / 180;
                const x = Math.cos(angle) * radius + centerX;
                const y = Math.sin(angle) * radius + centerY;

                const label = document.createElement('div');
                label.className = 'shichen-label';
                label.id = `shichen-${index}`;
                label.textContent = sc.name;
                label.style.left = (x - 35) + 'px';
                label.style.top = (y - 35) + 'px';

                label.addEventListener('mouseenter', (e) => showTooltip(e, sc));
                label.addEventListener('mouseleave', hideTooltip);

                layer4.appendChild(label);
            });
        }

        // 生成24小时数字
        function generateHours24() {
            const layer5 = document.getElementById('layer5');
            const radius = 350;
            const centerX = 375;
            const centerY = 375;

            for (let i = 0; i < 24; i++) {
                const angle = (i * 15 - 90) * Math.PI / 180;
                const x = Math.cos(angle) * radius + centerX;
                const y = Math.sin(angle) * radius + centerY;

                const hourLabel = document.createElement('div');
                hourLabel.className = 'hour-24';
                hourLabel.textContent = i;
                hourLabel.style.left = (x - 20) + 'px';
                hourLabel.style.top = (y - 20) + 'px';
                layer5.appendChild(hourLabel);
            }
        }

        // 显示提示
        function showTooltip(e, sc) {
            const tooltip = document.getElementById('tooltip');
            tooltip.innerHTML = `
                <strong>${sc.name} (${sc.start}:00-${sc.end}:00)</strong><br>
                脏腑：${sc.organ}<br>
                ${sc.advice}<br>
                <small>${sc.detail}</small>
            `;
            tooltip.style.left = (e.clientX + 10) + 'px';
            tooltip.style.top = (e.clientY + 10) + 'px';
            tooltip.classList.add('show');
        }

        // 隐藏提示
        function hideTooltip() {
            const tooltip = document.getElementById('tooltip');
            tooltip.classList.remove('show');
        }

        // 显示通知
        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');

            setTimeout(() => {
                notification.classList.remove('show');
            }, 5000);
        }

        // 更新时钟
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            // 计算角度
            const secondAngle = (seconds + milliseconds / 1000) * 6;
            const minuteAngle = (minutes + seconds / 60) * 6;
            const hourAngle = ((hours % 12) + minutes / 60) * 30;

            // 更新指针
            document.getElementById('secondHand').style.transform = `rotate(${secondAngle}deg)`;
            document.getElementById('minuteHand').style.transform = `rotate(${minuteAngle}deg)`;
            document.getElementById('hourHand').style.transform = `rotate(${hourAngle}deg)`;

            // 更新当前时间显示
            const timeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('currentTime').textContent = timeString;

            // 检查时辰变化
            const newShiChenIndex = getCurrentShiChen();
            if (newShiChenIndex !== currentShiChenIndex) {
                currentShiChenIndex = newShiChenIndex;
                updateShiChenInfo(newShiChenIndex);

                if (soundEnabled) {
                    playBellSound();
                }
                const sc = shiChenData[newShiChenIndex];
                showNotification(`进入${sc.name}，${sc.advice}`);
            }
        }

        // 更新时辰信息
        function updateShiChenInfo(index) {
            const sc = shiChenData[index];

            document.getElementById('shiChenInfo').textContent = `当前时辰：${sc.name} (${sc.start}:00-${sc.end}:00)`;
            document.getElementById('organInfo').textContent = `当令脏腑：${sc.organ}`;
            document.getElementById('advice').textContent = `养生建议：${sc.advice}。${sc.detail}`;

            document.querySelectorAll('.shichen-label').forEach((label, i) => {
                if (i === index) {
                    label.classList.add('active');
                } else {
                    label.classList.remove('active');
                }
            });

            document.querySelectorAll('.organ-label').forEach((label, i) => {
                if (i === index) {
                    label.classList.add('active');
                } else {
                    label.classList.remove('active');
                }
            });
        }

        // 显示所有时辰信息
        function showAllInfo() {
            let info = '【十二时辰养生指南】\n\n';
            shiChenData.forEach(sc => {
                info += `${sc.name} (${sc.start}:00-${sc.end}:00)\n`;
                info += `  脏腑：${sc.organ}\n`;
                info += `  建议：${sc.advice}\n\n`;
            });
            alert(info);
        }

        // 初始化
        function init() {
            generateBagua();
            generateHours12();
            generateOrgans();
            generateShiChen();
            generateHours24();
            updateClock();
            setInterval(updateClock, 100);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
