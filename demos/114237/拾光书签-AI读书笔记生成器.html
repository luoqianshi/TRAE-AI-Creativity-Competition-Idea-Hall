<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾光书签 · AI读书笔记生成器</title>
<style>
  :root{
    --paper:#f5ecd7;--paper-2:#fbf4dc;--ink:#3d2b1f;--ink-soft:#7a5c3e;
    --line:#c9b896;--line-2:#e0d2ad;--accent:#a83232;--accent-d:#7a1f1f;
    --gold:#b8860b;--gold-l:#e8c768;
    --shadow:0 6px 30px rgba(0,0,0,.5),inset 0 0 80px rgba(120,80,30,.12);
    --r-sm:6px;--r-md:10px;--r-lg:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:"KaiTi","STKaiti","Noto Serif SC",serif;
    background:#2a1f14;
    background-image:repeating-linear-gradient(45deg,#241a10 0,#241a10 2px,#2a1f14 2px,#2a1f14 4px);
    min-height:100vh;color:var(--ink);padding:clamp(20px,4vw,40px) clamp(10px,2vw,20px);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto}
  .book{
    background:var(--paper);
    background-image:linear-gradient(var(--line-2) 1px,transparent 1px);
    background-size:100% 34px;background-position:0 12px;
    box-shadow:var(--shadow);
    border-radius:var(--r-sm) var(--r-md) var(--r-md) var(--r-sm);
    padding:clamp(28px,5vw,52px) clamp(22px,5vw,52px) clamp(28px,4vw,40px);
    position:relative;border-left:6px solid var(--accent);
  }
  .book::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:1px;background:var(--line);opacity:.55}
  .spine-tape{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:90px;height:32px;background:rgba(168,50,50,.55);border-radius:2px;box-shadow:0 2px 8px rgba(0,0,0,.25);backdrop-filter:blur(2px)}
  h1{font-size:clamp(26px,5vw,38px);letter-spacing:6px;text-align:center;color:var(--accent);margin-bottom:8px;font-weight:bold;line-height:1.3}
  .subtitle{text-align:center;color:var(--ink-soft);font-size:clamp(13px,1.8vw,15px);margin-bottom:24px;font-family:"Segoe UI",sans-serif;letter-spacing:.5px}
  .slogan{text-align:center;font-size:clamp(16px,2.4vw,20px);color:var(--ink);margin:20px auto 32px;max-width:680px;padding:16px 20px;border:1px dashed var(--line);background:rgba(255,255,255,.35);border-radius:var(--r-sm);position:relative}
  .slogan em{color:var(--accent);font-style:normal;font-weight:bold}
  .demo{margin:30px 0;padding:clamp(18px,3vw,26px);background:linear-gradient(180deg,#fffdf5 0%,#fdf8e8 100%);border:1px solid var(--line-2);border-radius:var(--r-md);box-shadow:0 2px 12px rgba(120,80,30,.08)}
  .demo-label{font-family:"Segoe UI",sans-serif;font-size:13px;color:var(--ink-soft);margin-bottom:14px;letter-spacing:1px;font-weight:600;display:flex;align-items:center;gap:8px}
  .demo-label::before{content:"";width:4px;height:14px;background:var(--accent);border-radius:2px}
  .input-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .input-row input{flex:1;min-width:200px;padding:12px 16px;border:1.5px solid var(--line);border-radius:var(--r-sm);font-family:"Segoe UI",sans-serif;font-size:15px;background:#fff;color:var(--ink);transition:all .2s ease}
  .input-row input::placeholder{color:#b8a586}
  .input-row input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(168,50,50,.12)}
  .btn{padding:12px 28px;background:linear-gradient(180deg,#b83838 0%,#962626 100%);color:#fff;border:none;border-radius:var(--r-sm);cursor:pointer;font-family:"Segoe UI",sans-serif;font-size:15px;font-weight:600;letter-spacing:1px;transition:all .2s ease;box-shadow:0 2px 8px rgba(168,50,50,.3)}
  .btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(168,50,50,.45)}
  .btn:active{transform:translateY(0)}
  .pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;padding-top:14px;border-top:1px dashed var(--line-2)}
  .pill{font-family:"Segoe UI",sans-serif;font-size:12.5px;padding:5px 14px;background:rgba(168,50,50,.08);color:var(--accent);border-radius:20px;border:1px solid rgba(168,50,50,.18);transition:all .2s;cursor:default}
  .pill:hover{background:rgba(168,50,50,.15);transform:translateY(-1px)}
  .demo-box{display:flex;gap:16px;flex-wrap:wrap;margin-top:20px}
  .note-card{flex:1;min-width:240px;border:1px solid var(--line-2);border-radius:var(--r-md);overflow:hidden;font-family:"Segoe UI",sans-serif;background:#fff;box-shadow:0 2px 10px rgba(120,80,30,.08);transition:all .3s}
  .note-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(120,80,30,.15)}
  .note-card .nh{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-d) 100%);color:#fff;padding:11px 16px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
  .note-card .nc{padding:16px;font-size:14px;line-height:1.7;color:#5a4a3a}
  .note-card .nc b{color:var(--accent);font-size:15px}

  /* === 差异化1:手账式垂直时间轴 === */
  .timeline-card{margin:30px 0;padding:clamp(20px,3vw,28px);background:linear-gradient(180deg,#fffdf5 0%,#fdf8e8 100%);border:1px solid var(--line-2);border-radius:var(--r-md);box-shadow:0 2px 12px rgba(120,80,30,.06);position:relative}
  .timeline-head{font-family:"Segoe UI",sans-serif;font-size:14px;color:var(--ink-soft);font-weight:600;margin-bottom:18px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
  .timeline-head::before{content:"";width:4px;height:14px;background:var(--accent);border-radius:2px}
  .timeline{position:relative;padding-left:32px}
  .timeline::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:repeating-linear-gradient(180deg,var(--accent) 0,var(--accent) 6px,transparent 6px,transparent 12px)}
  .tl-item{position:relative;padding-bottom:18px;cursor:default;transition:all .2s}
  .tl-item:last-child{padding-bottom:0}
  .tl-dot{position:absolute;left:-26px;top:6px;width:14px;height:14px;background:#fff;border:3px solid var(--accent);border-radius:50%;box-shadow:0 0 0 3px rgba(168,50,50,.12);transition:all .2s}
  .tl-item:hover .tl-dot{transform:scale(1.3);box-shadow:0 0 0 5px rgba(168,50,50,.2)}
  .tl-date{font-family:"Segoe UI",sans-serif;font-size:11px;color:var(--gold);font-weight:600;letter-spacing:1px;margin-bottom:4px}
  .tl-content{font-family:"KaiTi",serif;font-size:15px;color:var(--ink);line-height:1.6;padding:8px 14px;background:rgba(255,255,255,.5);border-left:3px solid var(--accent);border-radius:0 var(--r-sm) var(--r-sm) 0;transition:all .2s}
  .tl-item:hover .tl-content{background:rgba(255,255,255,.85);transform:translateX(4px)}
  .tl-tag{display:inline-block;font-family:"Segoe UI",sans-serif;font-size:10px;background:var(--accent);color:#fff;padding:1px 8px;border-radius:10px;margin-right:6px;vertical-align:middle}

  /* === 差异化2:圆形仪表盘 === */
  .gauge-row{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,2vw,18px);margin:30px 0}
  .gauge-card{background:linear-gradient(180deg,#fffdf5 0%,#fdf8e8 100%);border:1px solid var(--line-2);border-radius:var(--r-md);padding:clamp(16px,2.5vw,22px) clamp(10px,1.5vw,14px);text-align:center;box-shadow:0 2px 10px rgba(120,80,30,.06);transition:all .2s}
  .gauge-card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(120,80,30,.12)}
  .gauge-svg{width:clamp(80px,12vw,110px);height:clamp(80px,12vw,110px);margin:0 auto 10px;display:block}
  .gauge-bg{fill:none;stroke:var(--line-2);stroke-width:8}
  .gauge-fg{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1.5s cubic-bezier(.34,1.56,.64,1)}
  .gauge-text{font-family:"Segoe UI",sans-serif;font-size:clamp(18px,2.6vw,22px);font-weight:bold;fill:var(--accent)}
  .gauge-unit{font-family:"Segoe UI",sans-serif;font-size:9px;fill:var(--ink-soft);letter-spacing:1px}
  .gauge-label{font-family:"Segoe UI",sans-serif;font-size:clamp(11px,1.4vw,12px);color:var(--ink-soft);letter-spacing:1px;margin-top:4px}
  .gauge-desc{font-family:"Segoe UI",sans-serif;font-size:10px;color:var(--gold);margin-top:2px}

  /* === 差异化3:横向滑动卡片轮播 === */
  .carousel-card{margin:30px 0;padding:clamp(18px,2.5vw,24px);background:rgba(255,255,255,.4);border:1px dashed var(--line-2);border-radius:var(--r-md)}
  .carousel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
  .carousel-head .h{font-family:"Segoe UI",sans-serif;font-size:14px;color:var(--ink-soft);font-weight:600;letter-spacing:1px;display:flex;align-items:center;gap:8px}
  .carousel-head .h::before{content:"";width:4px;height:14px;background:var(--gold);border-radius:2px}
  .carousel-nav{display:flex;gap:6px}
  .carousel-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--accent);background:rgba(168,50,50,.08);color:var(--accent);cursor:pointer;font-size:14px;font-weight:bold;transition:all .2s;display:flex;align-items:center;justify-content:center}
  .carousel-btn:hover{background:var(--accent);color:#fff;transform:scale(1.1)}
  .carousel-track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 4px 12px;scrollbar-width:thin;scrollbar-color:var(--accent) transparent;-webkit-overflow-scrolling:touch}
  .carousel-track::-webkit-scrollbar{height:6px}
  .carousel-track::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}
  .quote-card{flex:0 0 clamp(220px,45%,280px);scroll-snap-align:start;background:#fff;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:18px;box-shadow:0 2px 8px rgba(120,80,30,.08);transition:all .2s;cursor:default;position:relative}
  .quote-card:hover{transform:translateY(-3px) rotate(-1deg);box-shadow:0 8px 20px rgba(120,80,30,.15)}
  .quote-card::before{content:""" ";position:absolute;top:0;left:8px;font-size:60px;font-family:Georgia,serif;color:var(--accent);opacity:.15;line-height:1}
  .q-text{font-family:"KaiTi",serif;font-size:15px;line-height:1.7;color:var(--ink);margin-top:20px;margin-bottom:10px;min-height:80px}
  .q-meta{font-family:"Segoe UI",sans-serif;font-size:11px;color:var(--gold);padding-top:8px;border-top:1px dashed var(--line-2)}
  .q-meta b{color:var(--accent)}

  .bookmark{position:absolute;right:clamp(20px,4vw,40px);top:0;width:34px;height:96px;background:linear-gradient(180deg,var(--gold-l),var(--gold));clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);box-shadow:0 3px 10px rgba(0,0,0,.3)}
  .bookmark::after{content:"拾光";writing-mode:vertical-rl;color:#fff;font-size:13px;position:absolute;top:16px;left:50%;transform:translateX(-50%);letter-spacing:2px;font-family:"Segoe UI",sans-serif;font-weight:600}
  .footer{text-align:center;margin-top:32px;color:var(--ink-soft);font-family:"Segoe UI",sans-serif;font-size:13px;padding-top:20px;border-top:1px dashed var(--line-2);letter-spacing:.5px}
  .quote-flash{animation:fadeUp .5s both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .stamp{position:absolute;bottom:clamp(20px,4vw,36px);right:clamp(20px,4vw,46px);width:clamp(60px,8vw,80px);height:clamp(60px,8vw,80px);border:2.5px solid var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:13px;transform:rotate(-12deg);opacity:.7;font-family:"Segoe UI",sans-serif;text-align:center;line-height:1.3;font-weight:bold;letter-spacing:1px}

  @media(max-width:768px){
    .book{padding:32px 24px 28px}
    .input-row{flex-direction:column}
    .input-row input,.btn{width:100%}
    .demo-box{flex-direction:column}
    .note-card{min-width:0}
    .bookmark{right:16px;width:28px;height:80px}
    .stamp{right:16px;bottom:20px}
    h1{letter-spacing:4px}
    .gauge-row{grid-template-columns:repeat(3,1fr);gap:8px}
    .gauge-card{padding:12px 6px}
  }
  @media(max-width:480px){
    .gauge-row{grid-template-columns:1fr;gap:10px}
    .gauge-card{display:flex;align-items:center;gap:14px;text-align:left;padding:14px}
    .gauge-svg{margin:0;width:80px;height:80px;flex-shrink:0}
    .gauge-info{flex:1}
    .timeline{padding-left:26px}
    .quote-card{flex-basis:75%}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="book">
    <div class="spine-tape"></div>
    <div class="bookmark"></div>
    <h1>拾 光 书 签</h1>
    <div class="subtitle">AI 读书笔记生成器</div>
    <div class="slogan">读过的书，不该只留在<em>记忆的褶皱里</em>。让每一页都长出思想的根须。</div>

    <div class="demo">
      <div class="demo-label">试试粘贴一句书中摘录，AI 自动生成笔记卡片</div>
      <div class="input-row">
        <input id="quoteInput" type="text" placeholder="例：我们终其一生，就是要摆脱他人的期待…" value="我们终其一生，就是要摆脱他人的期待，找到真正的自己。">
        <button class="btn" onclick="genNote()">生成书签</button>
      </div>
      <div class="pill-row">
        <span class="pill">📖 自动摘要</span>
        <span class="pill">🏷 关键词</span>
        <span class="pill">💭 延伸思考</span>
        <span class="pill">🔗 关联书单</span>
      </div>
      <div id="cardArea" class="demo-box"></div>
    </div>

    <!-- 差异化模块1:手账式垂直时间轴 -->
    <div class="timeline-card">
      <div class="timeline-head">今日书页 · 阅读时间轴</div>
      <div class="timeline" id="timeline"></div>
    </div>

    <!-- 差异化模块2:三圆仪表盘 -->
    <div class="gauge-row" id="gaugeRow"></div>

    <!-- 差异化模块3:横向滑动卡片轮播 -->
    <div class="carousel-card">
      <div class="carousel-head">
        <div class="h">本周读者精选书签</div>
        <div class="carousel-nav">
          <button class="carousel-btn" onclick="slideCarousel(-1)" aria-label="上一个">‹</button>
          <button class="carousel-btn" onclick="slideCarousel(1)" aria-label="下一个">›</button>
        </div>
      </div>
      <div class="carousel-track" id="carousel"></div>
    </div>

    <div class="stamp">拾光<br>印记</div>
    <div class="footer">— 让每一本书，都成为你思想长河里的一枚锚点 —</div>
  </div>
</div>
<script>
const samples=[
  {q:"我们终其一生，就是要摆脱他人的期待，找到真正的自己。",t:"自我认同",k:["自我","期待","身份","独立"],s:"这句话揭示了成长的本质是一场'去期待化'的旅程，真正的成熟不在于获得了什么，而在于敢于放下什么。",r:["《被讨厌的勇气》","《无声告白》"]},
  {q:"生活不可能像你想象得那么好，但也不会像你想象得那么糟。",t:"接纳与韧性",k:["接纳","韧性","乐观","现实"],s:"莫泊桑用最朴素的方式道出生活的辩证法——它既不值得过度恐惧，也不值得盲目乐观，唯有平和地穿越它。",r:["《活着》","《平凡的世界》"]},
  {q:"满天星光，满屋月亮，人生何如，为什么这么悲凉。",t:"苍凉美学",k:["苍凉","寂寞","萧红","宿命"],s:"萧红笔下的人生底色是冷的，但正是这种不加粉饰的悲凉，让微小的温暖显得格外珍贵。",r:["《呼兰河传》","《生死场》"]}
];
function genNote(){
  const q=document.getElementById('quoteInput').value.trim();
  if(!q){shakeInput();return}
  const match=samples.find(s=>q.includes(s.q.slice(0,8)))||samples[0];
  const area=document.getElementById('cardArea');
  area.innerHTML=`
    <div class="note-card quote-flash">
      <div class="nh">🏷 主题标签</div>
      <div class="nc"><b>${match.t}</b>
        <div class="pill-row" style="margin:10px 0 0;padding-top:10px">${match.k.map(x=>`<span class="pill">${x}</span>`).join('')}</div>
      </div>
    </div>
    <div class="note-card quote-flash" style="animation-delay:.12s">
      <div class="nh">📖 AI 摘要</div>
      <div class="nc">${match.s}</div>
    </div>
    <div class="note-card quote-flash" style="animation-delay:.24s">
      <div class="nh">🔗 关联书单</div>
      <div class="nc">${match.r.map(x=>`<div style="margin:4px 0">📕 ${x}</div>`).join('')}</div>
    </div>`;
}
function shakeInput(){
  const el=document.getElementById('quoteInput');
  el.style.animation='shake .4s';el.focus();
  setTimeout(()=>{el.style.animation=''},400);
  alert('请输入或粘贴一句书中摘录');
}
document.getElementById('quoteInput').addEventListener('keypress',e=>{if(e.key==='Enter')genNote();});

/* === 时间轴 === */
const tlData=[
  {time:"08:42",tag:"晨读",text:"翻开《百年孤独》，马尔克斯笔下的马孔多小镇让人着迷。"},
  {time:"10:15",tag:"通勤",text:"地铁上读完了第三章，关于孤独的家族宿命。"},
  {time:"12:30",tag:"午休",text:"在咖啡馆生成今天的第一张书签，关于「命运与选择」。"},
  {time:"14:08",tag:"午后",text:"做了 12 张主题卡，整理出 4 个核心意象。"},
  {time:"17:50",tag:"傍晚",text:"完成了全书最后 30 页，意犹未尽地合上书。"},
  {time:"21:20",tag:"夜读",text:"把今天的灵感汇成一张手账式时间线，留给未来的自己。"}
];
function renderTimeline(){
  document.getElementById('timeline').innerHTML=tlData.map(t=>
    `<div class="tl-item">
      <div class="tl-dot"></div>
      <div class="tl-date">${t.time} · <span class="tl-tag">${t.tag}</span></div>
      <div class="tl-content">${t.text}</div>
    </div>`).join('');
}
renderTimeline();

/* === 仪表盘 === */
const gaugeData=[
  {label:"阅读完成度",val:78,unit:"%",desc:"本周目标",color:"#a83232"},
  {label:"笔记产出",val:92,unit:"张",desc:"历史最高",color:"#b8860b"},
  {label:"理解深度",val:64,unit:"分",desc:"AI 评估",color:"#5b8def"}
];
function renderGauges(){
  document.getElementById('gaugeRow').innerHTML=gaugeData.map((g,i)=>{
    const c=2*Math.PI*40;
    return `<div class="gauge-card">
      <svg class="gauge-svg" viewBox="0 0 100 100">
        <circle class="gauge-bg" cx="50" cy="50" r="40"/>
        <circle class="gauge-fg" cx="50" cy="50" r="40" stroke="${g.color}"
          stroke-dasharray="${c}" stroke-dashoffset="${c}" data-pct="${g.val}"/>
        <text class="gauge-text" x="50" y="52" text-anchor="middle" dominant-baseline="middle">${g.val}</text>
        <text class="gauge-unit" x="50" y="66" text-anchor="middle">${g.unit}</text>
      </svg>
      <div class="gauge-label">${g.label}</div>
      <div class="gauge-desc">${g.desc}</div>
    </div>`;
  }).join('');
  setTimeout(()=>{
    document.querySelectorAll('.gauge-fg').forEach((c,i)=>{
      const pct=parseFloat(c.getAttribute('data-pct'));
      const c0=2*Math.PI*40;
      c.style.strokeDashoffset=c0*(1-pct/100);
    });
  },300);
}
renderGauges();

/* === 横向滑动轮播 === */
const quoteData=[
  {text:"所有的大人都曾是孩子，只是很少有人记得了。",src:"《小王子》",user:"@童心未泯"},
  {text:"世界上只有一种真正的英雄主义，那就是认清生活的真相后依然热爱它。",src:"《米开朗基罗传》",user:"@罗曼罗兰"},
  {text:"一个人知道自己为什么而活，就能忍受任何一种生活。",src:"《查拉图斯特拉如是说》",user:"@尼采"},
  {text:"我思故我在。",src:"《第一哲学沉思集》",user:"@笛卡尔"},
  {text:"人生而自由，却无往不在枷锁之中。",src:"《社会契约论》",user:"@卢梭"},
