<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量重命名工具</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="12" y1="18" x2="12" y2="12"/>
                        <polyline points="9 15 12 12 15 15"/>
                    </svg>
                </div>
                <div class="header-text">
                    <h1>批量重命名工具</h1>
                    <p>多种命名方式，实时预览，一键导出</p>
                </div>
            </div>
        </header>

        <main class="main-content">
            <section class="left-panel">
                <div class="panel-card upload-section">
                    <div class="section-title">
                        <span class="title-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        </span>
                        <h2>上传文件</h2>
                        <span class="file-count" id="fileCount">0 个文件</span>
                    </div>
                    
                    <div class="drop-zone" id="dropZone">
                        <div class="drop-zone-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                        </div>
                        <p class="drop-zone-text">拖拽文件到此处，或 <span class="browse-link">点击选择</span></p>
                        <p class="drop-zone-hint">支持批量选择多个文件</p>
                        <input type="file" id="fileInput" multiple hidden>
                    </div>

                    <div class="file-list-container" id="fileListContainer" style="display: none;">
                        <div class="file-list-header">
                            <span>文件列表</span>
                            <button class="clear-btn" id="clearAllBtn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                清空
                            </button>
                        </div>
                        <div class="file-list" id="fileList"></div>
                    </div>
                </div>

                <div class="panel-card config-section">
                    <div class="section-title">
                        <span class="title-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                        </span>
                        <h2>命名方式</h2>
                    </div>

                    <div class="mode-selector">
                        <button class="mode-dropdown" id="modeDropdown">
                            <span class="mode-text" id="modeText">自动序号</span>
                            <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div class="mode-options" id="modeOptions">
                            <div class="mode-option" data-mode="auto-number">
                                <span class="option-icon">#</span>
                                <div class="option-info">
                                    <span class="option-name">自动序号</span>
                                    <span class="option-desc">前缀 + 序号 + 后缀</span>
                                </div>
                            </div>
                            <div class="mode-option" data-mode="prefix-suffix">
                                <span class="option-icon">±</span>
                                <div class="option-info">
                                    <span class="option-name">前缀后缀</span>
                                    <span class="option-desc">在文件名前后添加内容</span>
                                </div>
                            </div>
                            <div class="mode-option" data-mode="find-replace">
                                <span class="option-icon">⇄</span>
                                <div class="option-info">
                                    <span class="option-name">查找替换</span>
                                    <span class="option-desc">替换文件名中指定内容</span>
                                </div>
                            </div>
                            <div class="mode-option" data-mode="append-number">
                                <span class="option-icon">123</span>
                                <div class="option-info">
                                    <span class="option-name">追加序号</span>
                                    <span class="option-desc">在原名基础上追加序号</span>
                                </div>
                            </div>
                            <div class="mode-option" data-mode="insert-content">
                                <span class="option-icon">→|</span>
                                <div class="option-info">
                                    <span class="option-name">插入内容</span>
                                    <span class="option-desc">在指定位置插入文字</span>
                                </div>
                            </div>
                            <div class="mode-option" data-mode="delete-content">
                                <span class="option-icon">✕</span>
                                <div class="option-info">
                                    <span class="option-name">删减内容</span>
                                    <span class="option-desc">删除指定位置的字符</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="config-form" id="configForm">
                    </div>
                </div>

                <div class="action-bar">
                    <button class="btn btn-secondary" id="resetBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                        重置
                    </button>
                    <button class="btn btn-primary" id="exportBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        导出映射表
                    </button>
                    <button class="btn btn-success" id="downloadBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        下载重命名文件
                    </button>
                </div>
            </section>

            <section class="right-panel">
                <div class="panel-card preview-section">
                    <div class="section-title">
                        <span class="title-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </span>
                        <h2>实时预览</h2>
                        <div class="preview-stats">
                            <span class="stat-item changed" id="changedCount">变更: 0</span>
                            <span class="stat-item unchanged" id="unchangedCount">未变: 0</span>
                        </div>
                    </div>

                    <div class="preview-toolbar">
                        <div class="search-box">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <input type="text" id="searchInput" placeholder="搜索文件名...">
                        </div>
                        <div class="view-toggle">
                            <button class="toggle-btn active" id="showAllBtn">全部</button>
                            <button class="toggle-btn" id="showChangedBtn">仅变更</button>
                        </div>
                    </div>

                    <div class="preview-empty" id="previewEmpty">
                        <div class="empty-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
                        </div>
                        <p>请先上传文件查看预览效果</p>
                    </div>

                    <div class="preview-table-container" id="previewTableContainer" style="display: none;">
                        <table class="preview-table">
                            <thead>
                                <tr>
                                    <th style="width: 45px;">#</th>
                                    <th>原文件名</th>
                                    <th style="width: 40px; text-align: center;">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                                    </th>
                                    <th>新文件名</th>
                                    <th style="width: 40px;"></th>
                                </tr>
                            </thead>
                            <tbody id="previewBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div class="toast" id="toast">
        <span class="toast-icon" id="toastIcon"></span>
        <span class="toast-message" id="toastMessage"></span>
    </div>

    <script src="app.js"></script>
</body>
</html>
