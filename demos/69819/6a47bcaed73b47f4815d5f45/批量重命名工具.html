<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量重命名工具</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg-primary: #0f0f1a;
    --bg-secondary: #1a1a2e;
    --bg-tertiary: #252542;
    --bg-card: #1e1e36;
    --border-color: #2d2d4a;
    --text-primary: #f0f0f8;
    --text-secondary: #a0a0c0;
    --text-muted: #6c6c90;
    --accent-primary: #6366f1;
    --accent-secondary: #8b5cf6;
    --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --info: #3b82f6;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
    --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.3);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
        radial-gradient(ellipse at 20% 20%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(168, 85, 247, 0.05) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
}

.app-container {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
    min-height: 100vh;
}

.app-header {
    padding: 20px 0 30px;
    animation: fadeInDown 0.6s ease-out;
}

.header-content {
    display: flex;
    align-items: center;
    gap: 16px;
}

.logo-icon {
    width: 56px;
    height: 56px;
    background: var(--accent-gradient);
    border-radius: var(--radius-lg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    box-shadow: var(--shadow-glow);
}

.logo-icon svg {
    width: 28px;
    height: 28px;
}

.header-text h1 {
    font-size: 28px;
    font-weight: 700;
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
}

.header-text p {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 4px;
}

.main-content {
    display: grid;
    grid-template-columns: 420px 1fr;
    gap: 24px;
    animation: fadeInUp 0.6s ease-out 0.1s both;
}

.left-panel {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.right-panel {
    min-height: 0;
}

.panel-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.3s ease, border-color 0.3s ease;
}

.panel-card:hover {
    box-shadow: var(--shadow-md);
}

.section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-color);
}

.title-icon {
    width: 32px;
    height: 32px;
    background: rgba(99, 102, 241, 0.15);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent-primary);
}

.title-icon svg {
    width: 16px;
    height: 16px;
}

.section-title h2 {
    font-size: 16px;
    font-weight: 600;
    flex: 1;
}

.file-count {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--bg-tertiary);
    padding: 4px 10px;
    border-radius: 20px;
}

.drop-zone {
    border: 2px dashed var(--border-color);
    border-radius: var(--radius-md);
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    background: rgba(99, 102, 241, 0.02);
}

.drop-zone:hover,
.drop-zone.dragover {
    border-color: var(--accent-primary);
    background: rgba(99, 102, 241, 0.08);
    transform: translateY(-2px);
}

.drop-zone.dragover {
    border-style: solid;
}

.drop-zone-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 16px;
    color: var(--accent-primary);
    opacity: 0.7;
    transition: all 0.3s ease;
}

.drop-zone:hover .drop-zone-icon {
    opacity: 1;
    transform: translateY(-4px);
}

.drop-zone-icon svg {
    width: 100%;
    height: 100%;
}

.drop-zone-text {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 6px;
}

.browse-link {
    color: var(--accent-primary);
    font-weight: 500;
    text-decoration: underline;
}

.drop-zone-hint {
    font-size: 12px;
    color: var(--text-muted);
}

.file-list-container {
    margin-top: 16px;
}

.file-list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 13px;
    color: var(--text-secondary);
}

.clear-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s ease;
}

.clear-btn:hover {
    color: var(--danger);
    background: rgba(239, 68, 68, 0.1);
}

.clear-btn svg {
    width: 14px;
    height: 14px;
}

.file-list {
    max-height: 180px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-right: 4px;
}

.file-list::-webkit-scrollbar {
    width: 6px;
}

.file-list::-webkit-scrollbar-track {
    background: var(--bg-secondary);
    border-radius: 3px;
}

.file-list::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 3px;
}

.file-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--bg-secondary);
    border-radius: var(--radius-sm);
    transition: all 0.2s ease;
}

.file-item:hover {
    background: var(--bg-tertiary);
}

.file-item-icon {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent-primary);
    flex-shrink: 0;
}

.file-item-icon svg {
    width: 20px;
    height: 20px;
}

.file-item-name {
    flex: 1;
    font-size: 13px;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.file-item-size {
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
}

.file-item-remove {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.2s ease;
    flex-shrink: 0;
}

.file-item-remove:hover {
    color: var(--danger);
    background: rgba(239, 68, 68, 0.15);
}

.file-item-remove svg {
    width: 14px;
    height: 14px;
}

.mode-selector {
    position: relative;
    margin-bottom: 20px;
}

.mode-dropdown {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.mode-dropdown:hover {
    border-color: var(--accent-primary);
    background: var(--bg-tertiary);
}

.dropdown-arrow {
    width: 16px;
    height: 16px;
    color: var(--text-muted);
    transition: transform 0.2s ease;
}

.mode-selector.open .dropdown-arrow {
    transform: rotate(180deg);
}

.mode-options {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    z-index: 100;
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: all 0.2s ease;
}

.mode-selector.open .mode-options {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.mode-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    transition: all 0.15s ease;
    border-bottom: 1px solid rgba(45, 45, 74, 0.5);
}

.mode-option:last-child {
    border-bottom: none;
}

.mode-option:hover {
    background: var(--bg-tertiary);
}

.mode-option.selected {
    background: rgba(99, 102, 241, 0.15);
}

.option-icon {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-tertiary);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    color: var(--accent-primary);
}

.option-info {
    flex: 1;
}

.option-name {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
}

.option-desc {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
}

.config-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.form-label {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 500;
}

.form-hint {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: -2px;
}

.form-input {
    width: 100%;
    padding: 10px 14px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 14px;
    transition: all 0.2s ease;
    outline: none;
}

.form-input:focus {
    border-color: var(--accent-primary);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
}

.form-input::placeholder {
    color: var(--text-muted);
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.form-checkbox {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
}

.form-checkbox input {
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: var(--accent-primary);
}

.form-checkbox label {
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
}

.action-bar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px 20px;
    border: none;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    flex: 1;
    min-width: 100px;
}

.btn svg {
    width: 16px;
    height: 16px;
}

.btn:hover {
    transform: translateY(-2px);
}

.btn:active {
    transform: translateY(0);
}

.btn-secondary {
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
}

.btn-secondary:hover {
    background: var(--border-color);
    color: var(--text-primary);
}

.btn-primary {
    background: var(--accent-gradient);
    color: white;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
}

.btn-primary:hover {
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
}

.btn-success {
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: white;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
}

.btn-success:hover {
    box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
}

.preview-section {
    height: 100%;
    display: flex;
    flex-direction: column;
    min-height: 600px;
}

.preview-stats {
    display: flex;
    gap: 8px;
}

.stat-item {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 500;
}

.stat-item.changed {
    background: rgba(99, 102, 241, 0.15);
    color: var(--accent-primary);
}

.stat-item.unchanged {
    background: rgba(108, 108, 144, 0.2);
    color: var(--text-muted);
}

.preview-toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
}

.search-box {
    flex: 1;
    position: relative;
}

.search-box svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--text-muted);
}

.search-box input {
    width: 100%;
    padding: 10px 14px 10px 36px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 13px;
    transition: all 0.2s ease;
    outline: none;
}

.search-box input:focus {
    border-color: var(--accent-primary);
}

.search-box input::placeholder {
    color: var(--text-muted);
}

.view-toggle {
    display: flex;
    background: var(--bg-secondary);
    border-radius: var(--radius-sm);
    padding: 3px;
    border: 1px solid var(--border-color);
}

.toggle-btn {
    padding: 6px 14px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.2s ease;
}

.toggle-btn:hover {
    color: var(--text-secondary);
}

.toggle-btn.active {
    background: var(--accent-primary);
    color: white;
}

.preview-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    padding: 60px 20px;
}

.empty-icon {
    width: 80px;
    height: 80px;
    margin-bottom: 16px;
    opacity: 0.5;
}

.empty-icon svg {
    width: 100%;
    height: 100%;
}

.preview-empty p {
    font-size: 14px;
}

.preview-table-container {
    flex: 1;
    overflow: auto;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    background: var(--bg-secondary);
}

.preview-table-container::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

.preview-table-container::-webkit-scrollbar-track {
    background: var(--bg-secondary);
}

.preview-table-container::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 4px;
}

.preview-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

.preview-table thead {
    position: sticky;
    top: 0;
    background: var(--bg-tertiary);
    z-index: 10;
}

.preview-table th {
    padding: 12px 14px;
    text-align: left;
    font-weight: 600;
    color: var(--text-secondary);
    font-size: 12px;
    border-bottom: 1px solid var(--border-color);
    white-space: nowrap;
}

.preview-table th svg {
    width: 16px;
    height: 16px;
    color: var(--accent-primary);
}

.preview-table tbody tr {
    border-bottom: 1px solid rgba(45, 45, 74, 0.5);
    transition: background 0.15s ease;
}

.preview-table tbody tr:hover {
    background: rgba(99, 102, 241, 0.05);
}

.preview-table tbody tr:last-child {
    border-bottom: none;
}

.preview-table td {
    padding: 10px 14px;
    vertical-align: middle;
}

.preview-index {
    color: var(--text-muted);
    font-size: 12px;
    font-family: 'SF Mono', 'Consolas', monospace;
    text-align: center;
}

.original-name {
    color: var(--text-secondary);
    font-family: 'SF Mono', 'Consolas', monospace;
    word-break: break-all;
}

.new-name {
    color: var(--text-primary);
    font-family: 'SF Mono', 'Consolas', monospace;
    word-break: break-all;
    font-weight: 500;
}

.new-name.changed {
    color: var(--success);
}

.name-unchanged {
    color: var(--text-muted);
}

.row-status {
    text-align: center;
}

.status-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-size: 12px;
}

.status-badge.changed {
    background: rgba(16, 185, 129, 0.15);
    color: var(--success);
}

.status-badge.unchanged {
    background: rgba(108, 108, 144, 0.2);
    color: var(--text-muted);
}

.status-badge svg {
    width: 14px;
    height: 14px;
}

.toast {
    position: fixed;
    top: 24px;
    right: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transform: translateX(100%);
    transition: all 0.3s ease;
}

.toast.show {
    opacity: 1;
    visibility: visible;
    transform: translateX(0);
}

.toast.success {
    border-color: var(--success);
}

.toast.success .toast-icon {
    color: var(--success);
}

.toast.error {
    border-color: var(--danger);
}

.toast.error .toast-icon {
    color: var(--danger);
}

.toast.info {
    border-color: var(--info);
}

.toast.info .toast-icon {
    color: var(--info);
}

.toast-icon {
    font-size: 18px;
}

.toast-message {
    font-size: 14px;
    color: var(--text-primary);
}

@keyframes fadeInDown {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 1024px) {
    .main-content {
        grid-template-columns: 1fr;
    }

    .preview-section {
        min-height: 500px;
    }
}

@media (max-width: 640px) {
    .app-container {
        padding: 12px;
    }

    .header-text h1 {
        font-size: 22px;
    }

    .panel-card {
        padding: 16px;
    }

    .form-row {
        grid-template-columns: 1fr;
    }

    .action-bar {
        flex-direction: column;
    }

    .btn {
        width: 100%;
    }
}
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="12" y1="18" x2="12" y2="12"/>
                        <polyline points="9 15 12 12 15 15"/>
                    </svg>
                </div>
                <div class="header-text">
                    <h1>批量重命名工具</h1>
                    <p>多种命名方式，实时预览，一键导出</p>
                </div>
            </div>
        </header>

        <main class="main-content">
            <section class="left-panel">
                <div class="panel-card upload-section">
                    <div class="section-title">
                        <span class="title-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        </span>
                        <h2>上传文件</h2>
                        <span class="file-count" id="fileCount">0 个文件</span>
                    </div>
                    
                    <div class="drop-zone" id="dropZone">
                        <div class="drop-zone-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

                                    <th>原文件名</th>

                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                                    </th>
                                    <th>新文件名</th>

        <span class="toast-icon" id="toastIcon"></span>
        <span class="toast-message" id="toastMessage"></span>
    </div>

    <script>
const state = {
    files: [],
    currentMode: 'auto-number',
    config: {
        'auto-number': {
            prefix: '',
            startNumber: 1,
            digits: 3,
            suffix: ''
        },
        'prefix-suffix': {
            prefix: '',
            suffix: '',
            keepExtension: true
        },
        'find-replace': {
            findText: '',
            replaceText: '',
            caseSensitive: false,
            useRegex: false
        },
        'append-number': {
            position: 'end',
            startNumber: 1,
            digits: 3,
            separator: '_'
        },
        'insert-content': {
            content: '',
            position: 1,
            fromEnd: false
        },
        'delete-content': {
            startPos: 1,
            length: 1,
            fromEnd: false,
            keepExtension: true
        }
    },
    searchQuery: '',
    showChangedOnly: false
};

const modeNames = {
    'auto-number': '自动序号',
    'prefix-suffix': '前缀后缀',
    'find-replace': '查找替换',
    'append-number': '追加序号',
    'insert-content': '插入内容',
    'delete-content': '删减内容'
};

function padNumber(num, digits) {
    return String(num).padStart(digits, '0');
}

function getFileNameAndExtension(filename) {
    const lastDotIndex = filename.lastIndexOf('.');
    if (lastDotIndex === -1 || lastDotIndex === 0) {
        return { name: filename, extension: '' };
    }
    return {
        name: filename.substring(0, lastDotIndex),
        extension: filename.substring(lastDotIndex)
    };
}

function formatFileSize(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

function renameAutoNumber(filename, index, config) {
    const { prefix, startNumber, digits, suffix } = config;
    const { extension } = getFileNameAndExtension(filename);
    const number = padNumber(startNumber + index, digits);
    return `${prefix}${number}${suffix}${extension}`;
}

function renamePrefixSuffix(filename, index, config) {
    const { prefix, suffix, keepExtension } = config;
    if (keepExtension) {
        const { name, extension } = getFileNameAndExtension(filename);
        return `${prefix}${name}${suffix}${extension}`;
    }
    return `${prefix}${filename}${suffix}`;
}

function renameFindReplace(filename, index, config) {
    const { findText, replaceText, caseSensitive, useRegex } = config;
    if (!findText) return filename;
    
    try {
        if (useRegex) {
            const flags = caseSensitive ? 'g' : 'gi';
            const regex = new RegExp(findText, flags);
            return filename.replace(regex, replaceText);
        } else {
            if (caseSensitive) {
                return filename.split(findText).join(replaceText);
            } else {
                const regex = new RegExp(findText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
                return filename.replace(regex, replaceText);
            }
        }
    } catch (e) {
        return filename;
    }
}

function renameAppendNumber(filename, index, config) {
    const { position, startNumber, digits, separator } = config;
    const number = padNumber(startNumber + index, digits);
    const { name, extension } = getFileNameAndExtension(filename);
    
    if (position === 'start') {
        return `${number}${separator}${name}${extension}`;
    } else {
        return `${name}${separator}${number}${extension}`;
    }
}

function renameInsertContent(filename, index, config) {
    const { content, position, fromEnd } = config;
    const { name, extension } = getFileNameAndExtension(filename);
    
    let pos = position;
    if (fromEnd) {
        pos = name.length - position;
    }
    pos = Math.max(0, Math.min(pos, name.length));
    
    const newName = name.substring(0, pos) + content + name.substring(pos);
    return newName + extension;
}

function renameDeleteContent(filename, index, config) {
    const { startPos, length, fromEnd, keepExtension } = config;
    
    if (keepExtension) {
        const { name, extension } = getFileNameAndExtension(filename);
        let start = startPos - 1;
        let len = length;
        
        if (fromEnd) {
            start = name.length - startPos - length + 1;
        }
        
        start = Math.max(0, Math.min(start, name.length));
        const end = Math.min(start + len, name.length);
        const newName = name.substring(0, start) + name.substring(end);
        return newName + extension;
    } else {
        let start = startPos - 1;
        let len = length;
        
        if (fromEnd) {
            start = filename.length - startPos - length + 1;
        }
        
        start = Math.max(0, Math.min(start, filename.length));
        const end = Math.min(start + len, filename.length);
        return filename.substring(0, start) + filename.substring(end);
    }
}

function getNewName(filename, index, mode, config) {
    switch (mode) {
        case 'auto-number':
            return renameAutoNumber(filename, index, config['auto-number']);
        case 'prefix-suffix':
            return renamePrefixSuffix(filename, index, config['prefix-suffix']);
        case 'find-replace':
            return renameFindReplace(filename, index, config['find-replace']);
        case 'append-number':
            return renameAppendNumber(filename, index, config['append-number']);
        case 'insert-content':
            return renameInsertContent(filename, index, config['insert-content']);
        case 'delete-content':
            return renameDeleteContent(filename, index, config['delete-content']);
        default:
            return filename;
    }
}

function renderConfigForm() {
    const form = document.getElementById('configForm');
    const mode = state.currentMode;
    const config = state.config[mode];
    
    let html = '';
    
    switch (mode) {
        case 'auto-number':
            html = `
                <div class="form-group">
                    <label class="form-label">前面字符（前缀）</label>
                    <input type="text" class="form-input" id="config_prefix" value="${config.prefix}" placeholder="例如：IMG_">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">开始序号</label>
                        <input type="number" class="form-input" id="config_startNumber" value="${config.startNumber}" min="0">
                    </div>
                    <div class="form-group">
                        <label class="form-label">固定位数</label>
                        <input type="number" class="form-input" id="config_digits" value="${config.digits}" min="1" max="10">
                        <span class="form-hint">序号自动补0，位数为3则1变成001</span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">后面字符（后缀）</label>
                    <input type="text" class="form-input" id="config_suffix" value="${config.suffix}" placeholder="可为空">
                </div>
            `;
            break;
            
        case 'prefix-suffix':
            html = `
                <div class="form-group">
                    <label class="form-label">前缀字符</label>
                    <input type="text" class="form-input" id="config_prefix" value="${config.prefix}" placeholder="在文件名前添加">
                </div>
                <div class="form-group">
                    <label class="form-label">后缀字符</label>
                    <input type="text" class="form-input" id="config_suffix" value="${config.suffix}" placeholder="在文件名后添加">
                </div>
                <div class="form-checkbox">
                    <input type="checkbox" id="config_keepExtension" ${config.keepExtension ? 'checked' : ''}>
                    <label for="config_keepExtension">保留文件扩展名（后缀添加在扩展名前）</label>
                </div>
            `;
            break;
            
        case 'find-replace':
            html = `
                <div class="form-group">
                    <label class="form-label">查找内容</label>
                    <input type="text" class="form-input" id="config_findText" value="${config.findText}" placeholder="要查找的文本">
                </div>
                <div class="form-group">
                    <label class="form-label">替换为</label>
                    <input type="text" class="form-input" id="config_replaceText" value="${config.replaceText}" placeholder="替换后的文本">
                </div>
                <div class="form-checkbox">
                    <input type="checkbox" id="config_caseSensitive" ${config.caseSensitive ? 'checked' : ''}>
                    <label for="config_caseSensitive">区分大小写</label>
                </div>
                <div class="form-checkbox">
                    <input type="checkbox" id="config_useRegex" ${config.useRegex ? 'checked' : ''}>
                    <label for="config_useRegex">使用正则表达式</label>
                </div>
            `;
            break;
            
        case 'append-number':
            html = `
                <div class="form-group">
                    <label class="form-label">序号位置</label>
                    <select class="form-input" id="config_position">
                        <option value="start" ${config.position === 'start' ? 'selected' : ''}>文件名开头</option>
                        <option value="end" ${config.position === 'end' ? 'selected' : ''}>文件名结尾</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">开始序号</label>
                        <input type="number" class="form-input" id="config_startNumber" value="${config.startNumber}" min="0">
                    </div>
                    <div class="form-group">
                        <label class="form-label">固定位数</label>
                        <input type="number" class="form-input" id="config_digits" value="${config.digits}" min="1" max="10">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">分隔符</label>
                    <input type="text" class="form-input" id="config_separator" value="${config.separator}" placeholder="序号与原名之间的分隔符">
                </div>
            `;
            break;
            
        case 'insert-content':
            html = `
                <div class="form-group">
                    <label class="form-label">插入内容</label>
                    <input type="text" class="form-input" id="config_content" value="${config.content}" placeholder="要插入的文本">
                </div>
                <div class="form-group">
                    <label class="form-label">插入位置（第几个字符后）</label>
                    <input type="number" class="form-input" id="config_position" value="${config.position}" min="0">
                </div>
                <div class="form-checkbox">
                    <input type="checkbox" id="config_fromEnd" ${config.fromEnd ? 'checked' : ''}>
                    <label for="config_fromEnd">从末尾开始计数</label>
                </div>
            `;
            break;
            
        case 'delete-content':
            html = `
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">起始位置</label>
                        <input type="number" class="form-input" id="config_startPos" value="${config.startPos}" min="1">
                    </div>
                    <div class="form-group">
                        <label class="form-label">删除长度</label>
                        <input type="number" class="form-input" id="config_length" value="${config.length}" min="1">
                    </div>
                </div>
                <div class="form-checkbox">
                    <input type="checkbox" id="config_fromEnd" ${config.fromEnd ? 'checked' : ''}>
                    <label for="config_fromEnd">从末尾开始计数</label>
                </div>
                <div class="form-checkbox">
                    <input type="checkbox" id="config_keepExtension" ${config.keepExtension ? 'checked' : ''}>
                    <label for="config_keepExtension">保留文件扩展名（不删除扩展名部分）</label>
                </div>
            `;
            break;
    }
    
    form.innerHTML = html;
    
    const inputs = form.querySelectorAll('input, select');
    inputs.forEach(input => {
        input.addEventListener('input', handleConfigChange);
        input.addEventListener('change', handleConfigChange);
    });
}

function handleConfigChange(e) {
    const mode = state.currentMode;
    const id = e.target.id;
    const key = id.replace('config_', '');
    
    let value;
    if (e.target.type === 'checkbox') {
        value = e.target.checked;
    } else if (e.target.type === 'number') {
        value = parseInt(e.target.value) || 0;
    } else {
        value = e.target.value;
    }
    
    state.config[mode][key] = value;
    updatePreview();
}

function renderFileList() {
    const container = document.getElementById('fileListContainer');
    const list = document.getElementById('fileList');
    const countEl = document.getElementById('fileCount');
    
    countEl.textContent = `${state.files.length} 个文件`;
    
    if (state.files.length === 0) {
        container.style.display = 'none';
        return;
    }
    
    container.style.display = 'block';
    
    list.innerHTML = state.files.map((file, index) => `
        <div class="file-item">
            <div class="file-item-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                    <polyline points="14 2 14 8 20 8"/>
                </svg>
            </div>
            <span class="file-item-name" title="${file.name}">${file.name}</span>
            <span class="file-item-size">${formatFileSize(file.size)}</span>
            <button class="file-item-remove" data-index="${index}" title="移除">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
    `).join('');
    
    list.querySelectorAll('.file-item-remove').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const index = parseInt(e.currentTarget.dataset.index);
            state.files.splice(index, 1);
            renderFileList();
            updatePreview();
        });
    });
}

function updatePreview() {
    const emptyEl = document.getElementById('previewEmpty');
    const tableContainer = document.getElementById('previewTableContainer');
    const tbody = document.getElementById('previewBody');
    const changedCountEl = document.getElementById('changedCount');
    const unchangedCountEl = document.getElementById('unchangedCount');
    
    if (state.files.length === 0) {
        emptyEl.style.display = 'flex';
        tableContainer.style.display = 'none';
        changedCountEl.textContent = '变更: 0';
        unchangedCountEl.textContent = '未变: 0';
        return;
    }
    
    emptyEl.style.display = 'none';
    tableContainer.style.display = 'block';
    
    let changedCount = 0;
    let unchangedCount = 0;
    
    const rows = state.files.map((file, index) => {
        const newName = getNewName(file.name, index, state.currentMode, state.config);
        const changed = newName !== file.name;
        
        if (changed) changedCount++;
        else unchangedCount++;
        
        if (state.showChangedOnly && !changed) return '';
        
        if (state.searchQuery) {
            const query = state.searchQuery.toLowerCase();
            if (!file.name.toLowerCase().includes(query) && !newName.toLowerCase().includes(query)) {
                return '';
            }
        }
        
        return `
            <tr>
                <td class="preview-index">${index + 1}</td>
                <td class="original-name">${escapeHtml(file.name)}</td>
                <td style="text-align: center;">
                    <svg style="width: 16px; height: 16px; color: var(--text-muted);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </td>
                <td class="new-name ${changed ? 'changed' : 'name-unchanged'}">${escapeHtml(newName)}</td>
                <td class="row-status">
                    <span class="status-badge ${changed ? 'changed' : 'unchanged'}">
                        ${changed ? 
                            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' :
                            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>'
                        }
                    </span>
                </td>
            </tr>
        `;
    }).join('');
    
    tbody.innerHTML = rows;
    changedCountEl.textContent = `变更: ${changedCount}`;
    unchangedCountEl.textContent = `未变: ${unchangedCount}`;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showToast(message, type) {
    type = type || 'info';
    const toast = document.getElementById('toast');
    const icon = document.getElementById('toastIcon');
    const msg = document.getElementById('toastMessage');
    
    const icons = {
        success: '✓',
        error: '✕',
        info: 'ℹ'
    };
    
    toast.className = `toast ${type}`;
    icon.textContent = icons[type] || 'ℹ';
    msg.textContent = message;
    
    toast.classList.add('show');
    
    setTimeout(function() {
        toast.classList.remove('show');
    }, 3000);
}

function exportCSV() {
    if (state.files.length === 0) {
        showToast('请先上传文件', 'error');
        return;
    }
    
    const rows = [
        ['序号', '原文件名', '新文件名', '是否变更']
    ];
    
    state.files.forEach(function(file, index) {
        const newName = getNewName(file.name, index, state.currentMode, state.config);
        const changed = newName !== file.name ? '是' : '否';
        rows.push([index + 1, file.name, newName, changed]);
    });
    
    const csvContent = rows.map(function(row) { 
        return row.map(function(cell) { 
            return '"' + String(cell).replace(/"/g, '""') + '"'; 
        }).join(',');
    }).join('\n');
    
    const BOM = '\uFEFF';
    const blob = new Blob([BOM + csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    
    const link = document.createElement('a');
    link.href = url;
    link.download = '重命名映射表_' + new Date().toISOString().slice(0, 10) + '.csv';
    link.click();
    
    URL.revokeObjectURL(url);
    showToast('映射表已导出', 'success');
}

function downloadRenamedFiles() {
    if (state.files.length === 0) {
        showToast('请先上传文件', 'error');
        return;
    }
    
    showToast('正在准备下载...', 'info');
    
    var promises = state.files.map(function(file, i) {
        return function() {
            var newName = getNewName(file.name, i, state.currentMode, state.config);
            var url = URL.createObjectURL(file.file);
            var link = document.createElement('a');
            link.href = url;
            link.download = newName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        };
    });
    
    var sequence = Promise.resolve();
    promises.forEach(function(fn) {
        sequence = sequence.then(function() {
            return new Promise(function(resolve) {
                fn();
                setTimeout(resolve, 100);
            });
        });
    });
    
    sequence.then(function() {
        showToast('文件下载完成', 'success');
    });
}

function resetConfig() {
    state.config = {
        'auto-number': {
            prefix: '',
            startNumber: 1,
            digits: 3,
            suffix: ''
        },
        'prefix-suffix': {
            prefix: '',
            suffix: '',
            keepExtension: true
        },
        'find-replace': {
            findText: '',
            replaceText: '',
            caseSensitive: false,
            useRegex: false
        },
        'append-number': {
            position: 'end',
            startNumber: 1,
            digits: 3,
            separator: '_'
        },
        'insert-content': {
            content: '',
            position: 1,
            fromEnd: false
        },
        'delete-content': {
            startPos: 1,
            length: 1,
            fromEnd: false,
            keepExtension: true
        }
    };
    
    state.searchQuery = '';
    state.showChangedOnly = false;
    
    document.getElementById('searchInput').value = '';
    document.getElementById('showAllBtn').classList.add('active');
    document.getElementById('showChangedBtn').classList.remove('active');
    
    renderConfigForm();
    updatePreview();
    showToast('已重置配置', 'info');
}

function initModeSelector() {
    const dropdown = document.getElementById('modeDropdown');
    const options = document.getElementById('modeOptions');
    const selector = document.querySelector('.mode-selector');
    const modeText = document.getElementById('modeText');
    
    dropdown.addEventListener('click', function(e) {
        e.stopPropagation();
        selector.classList.toggle('open');
    });
    
    document.addEventListener('click', function(e) {
        if (!selector.contains(e.target)) {
            selector.classList.remove('open');
        }
    });
    
    const optionEls = options.querySelectorAll('.mode-option');
    optionEls.forEach(function(opt) {
        opt.addEventListener('click', function() {
            const mode = opt.dataset.mode;
            state.currentMode = mode;
            modeText.textContent = modeNames[mode];
            selector.classList.remove('open');
            
            optionEls.forEach(function(o) { o.classList.remove('selected'); });
            opt.classList.add('selected');
            
            renderConfigForm();
            updatePreview();
        });
    });
    
    optionEls[0].classList.add('selected');
}

function initFileUpload() {
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    
    dropZone.addEventListener('click', function() { fileInput.click(); });
    
    dropZone.addEventListener('dragover', function(e) {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });
    
    dropZone.addEventListener('dragleave', function() {
        dropZone.classList.remove('dragover');
    });
    
    dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        
        const files = Array.from(e.dataTransfer.files);
        addFiles(files);
    });
    
    fileInput.addEventListener('change', function(e) {
        const files = Array.from(e.target.files);
        addFiles(files);
        fileInput.value = '';
    });
}

function addFiles(files) {
    const newFiles = files.map(function(f) {
        return {
            name: f.name,
            size: f.size,
            type: f.type,
            file: f
        };
    });
    
    state.files = state.files.concat(newFiles);
    renderFileList();
    updatePreview();
    
    if (newFiles.length > 0) {
        showToast('已添加 ' + newFiles.length + ' 个文件', 'success');
    }
}

function init() {
    initModeSelector();
    initFileUpload();
    renderConfigForm();
    renderFileList();
    updatePreview();
    
    document.getElementById('clearAllBtn').addEventListener('click', function() {
        if (state.files.length > 0) {
            state.files = [];
            renderFileList();
            updatePreview();
            showToast('已清空所有文件', 'info');
        }
    });
    
    document.getElementById('resetBtn').addEventListener('click', resetConfig);
    document.getElementById('exportBtn').addEventListener('click', exportCSV);
    document.getElementById('downloadBtn').addEventListener('click', downloadRenamedFiles);
    
    document.getElementById('searchInput').addEventListener('input', function(e) {
        state.searchQuery = e.target.value;
        updatePreview();
    });
    
    document.getElementById('showAllBtn').addEventListener('click', function() {
        state.showChangedOnly = false;
        document.getElementById('showAllBtn').classList.add('active');
        document.getElementById('showChangedBtn').classList.remove('active');
        updatePreview();
    });
    
    document.getElementById('showChangedBtn').addEventListener('click', function() {
        state.showChangedOnly = true;
        document.getElementById('showChangedBtn').classList.add('active');
        document.getElementById('showAllBtn').classList.remove('active');
        updatePreview();
    });
}

document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
