<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素风海洋帆船开屏动画</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%); min-height: 100vh; }
        .container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

        /* 云朵 */
        .clouds { position: absolute; top: 5%; width: 100%; height: 100px; z-index: 1; }
        .cloud { position: absolute; background: #FFFFFF; border-radius: 50%; animation: floatCloud 20s linear infinite; }
        .cloud::before, .cloud::after { content: ''; position: absolute; background: #FFFFFF; border-radius: 50%; }
        .cloud1 { width: 60px; height: 25px; left: 10%; animation-delay: 0s; }
        .cloud1::before { width: 35px; height: 35px; top: -15px; left: 10px; }
        .cloud1::after { width: 40px; height: 40px; top: -20px; left: 25px; }
        .cloud2 { width: 80px; height: 30px; left: 40%; animation-delay: -7s; }
        .cloud2::before { width: 45px; height: 45px; top: -20px; left: 15px; }
        .cloud2::after { width: 50px; height: 50px; top: -25px; left: 35px; }
        .cloud3 { width: 50px; height: 20px; left: 70%; animation-delay: -14s; }
        .cloud3::before { width: 30px; height: 30px; top: -12px; left: 8px; }
        .cloud3::after { width: 35px; height: 35px; top: -15px; left: 20px; }
        @keyframes floatCloud { 0% { transform: translateX(-100px); } 100% { transform: translateX(calc(100vw + 100px)); } }

        /* 海洋 */
        .ocean { position: absolute; bottom: 0; width: 100%; height: 60%; overflow: hidden; }
        .wave-layer { position: absolute; bottom: 0; width: 200%; height: 100%; }
        .wave1 { animation: waveMove 8s linear infinite; bottom: 0; }
        .wave2 { animation: waveMove 10s linear infinite; animation-delay: -0.5s; bottom: 5%; }
        .wave3 { animation: waveMove 12s linear infinite; animation-delay: -1s; bottom: 10%; }
        .wave4 { animation: waveMove 14s linear infinite; animation-delay: -1.5s; bottom: 15%; }
        @keyframes waveMove { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .wave-svg { width: 100%; height: 100%; }

        /* 浪花 */
        .splashes { position: absolute; bottom: 20%; width: 100%; height: 50px; }
        .splash { position: absolute; width: 20px; height: 20px; background: #FFFFFF; border-radius: 50%; animation: splashAnim 2s ease-out infinite; }
        .splash:nth-child(1) { left: 15%; animation-delay: 0s; }
        .splash:nth-child(2) { left: 35%; animation-delay: 0.5s; }
        .splash:nth-child(3) { left: 55%; animation-delay: 1s; }
        .splash:nth-child(4) { left: 75%; animation-delay: 1.5s; }
        .splash:nth-child(5) { left: 90%; animation-delay: 0.8s; }
        @keyframes splashAnim { 0% { transform: translateY(0) scale(1); opacity: 1; } 50% { transform: translateY(-30px) scale(0.5); opacity: 0.7; } 100% { transform: translateY(-60px) scale(0.2); opacity: 0; } }

        /* 海岸 */
        .coast { position: absolute; bottom: 0; width: 100%; height: 20%; z-index: 5; }
        .sand { position: absolute; bottom: 0; width: 100%; height: 70%; background: linear-gradient(to bottom, #DEB887 0%, #8B4513 100%); border-radius: 50% 50% 0 0 / 20% 20% 0 0; }
        .grass { position: absolute; bottom: 60%; width: 100%; height: 50%; background: linear-gradient(to bottom, #228B22 0%, #32CD32 100%); border-radius: 50% 50% 0 0 / 30% 30% 0 0; }
        .grass-patch { position: absolute; width: 8px; height: 16px; background: #228B22; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
        .grass-patch:nth-child(3) { left: 10%; bottom: 70%; animation: grassSway 2s ease-in-out infinite; }
        .grass-patch:nth-child(4) { left: 12%; bottom: 68%; animation: grassSway 2s ease-in-out infinite 0.2s; }
        .grass-patch:nth-child(5) { left: 30%; bottom: 72%; animation: grassSway 2s ease-in-out infinite 0.4s; }
        .grass-patch:nth-child(6) { left: 55%; bottom: 69%; animation: grassSway 2s ease-in-out infinite 0.6s; }
        .grass-patch:nth-child(7) { left: 75%; bottom: 71%; animation: grassSway 2s ease-in-out infinite 0.8s; }
        .grass-patch:nth-child(8) { left: 88%; bottom: 67%; animation: grassSway 2s ease-in-out infinite 1s; }
        @keyframes grassSway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }

        /* 岩石 */
        .rock { position: absolute; background: #696969; border-radius: 40% 60% 50% 50%; }
        .rock1 { width: 30px; height: 20px; left: 20%; bottom: 55%; background: linear-gradient(135deg, #696969 0%, #808080 50%, #505050 100%); }
        .rock2 { width: 20px; height: 15px; left: 45%; bottom: 50%; background: linear-gradient(135deg, #707070 0%, #858585 50%, #555555 100%); }
        .rock3 { width: 25px; height: 18px; left: 70%; bottom: 52%; background: linear-gradient(135deg, #656565 0%, #7A7A7A 50%, #4A4A4A 100%); }

        /* 贝壳 */
        .shell { position: absolute; width: 10px; height: 8px; background: #FFE4E1; border-radius: 50% 50% 0 0; }
        .shell::after { content: ''; position: absolute; bottom: 0; left: 2px; width: 6px; height: 4px; background: #FFB6C1; border-radius: 0 0 50% 50%; }
        .shell1 { left: 25%; bottom: 30%; }
        .shell2 { left: 50%; bottom: 25%; }
        .shell3 { left: 82%; bottom: 28%; }

        /* 灯塔 */
        .lighthouse { position: absolute; right: 15%; bottom: 18%; z-index: 10; animation: lighthouseAppear 1s ease-out 0.5s forwards; opacity: 0; transform: translateY(50px); }
        @keyframes lighthouseAppear { to { opacity: 1; transform: translateY(0); } }
        .lighthouse-base { width: 60px; height: 120px; background: linear-gradient(90deg, #D2B48C 0%, #F5DEB3 50%, #D2B48C 100%); position: relative; border: 2px solid #8B4513; }
        .lighthouse-window { position: absolute; width: 12px; height: 16px; background: #FFD700; border: 2px solid #8B4513; box-shadow: 0 0 10px #FFD700; }
        .lighthouse-window:nth-child(1) { top: 20px; left: 23px; }
        .lighthouse-window:nth-child(2) { top: 50px; left: 23px; }
        .lighthouse-window:nth-child(3) { top: 80px; left: 23px; }
        .lighthouse-top { width: 70px; height: 25px; background: #8B4513; margin-left: -5px; border-radius: 5px 5px 0 0; }
        .lighthouse-lamp { width: 40px; height: 30px; background: #FFD700; margin-left: 15px; border-radius: 50%; box-shadow: 0 0 20px #FFD700, 0 0 40px #FFA500; animation: lampFlash 2s ease-in-out infinite; }
        @keyframes lampFlash { 0%, 100% { box-shadow: 0 0 20px #FFD700, 0 0 40px #FFA500; } 50% { box-shadow: 0 0 30px #FFD700, 0 0 60px #FFA500, 0 0 80px #FF8C00; } }
        .lighthouse-beam { position: absolute; top: 145px; left: 45px; width: 0; height: 0; border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-left: 200px solid rgba(255, 215, 0, 0.3); transform-origin: left center; animation: beamRotate 4s linear infinite; }
        @keyframes beamRotate { 0% { transform: rotate(-30deg); opacity: 0; } 10% { opacity: 1; } 40% { opacity: 1; } 50% { transform: rotate(30deg); opacity: 0; } 100% { transform: rotate(-30deg); opacity: 0; } }
        .lighthouse-cottage { position: absolute; right: -35px; bottom: -40px; width: 50px; height: 40px; background: #DEB887; border: 2px solid #8B4513; }
        .cottage-roof { width: 0; height: 0; border-left: 27px solid transparent; border-right: 27px solid transparent; border-bottom: 20px solid #8B4513; margin-left: -2px; }
        .cottage-window { position: absolute; width: 12px; height: 14px; background: #FFE4B5; border: 1px solid #8B4513; top: 10px; left: 10px; }

        /* 帆船 */
        .sailboat { position: absolute; bottom: 30%; right: -150px; z-index: 8; animation: sailboatEnter 2s ease-out 1s forwards, sailboatSail 4s ease-in-out 3s forwards; }
        @keyframes sailboatEnter { 0% { right: -150px; } 100% { right: 50%; } }
        @keyframes sailboatSail { 0% { right: 50%; transform: translateY(0); } 25% { right: 35%; transform: translateY(-10px); } 50% { right: 25%; transform: translateY(5px); } 75% { right: 20%; transform: translateY(-8px); } 100% { right: 18%; transform: translateY(0); } }
        .boat-body { width: 100px; height: 30px; background: linear-gradient(to bottom, #DEB887 0%, #8B4513 100%); clip-path: polygon(10% 100%, 0% 60%, 5% 40%, 95% 40%, 100% 60%, 90% 100%); position: relative; animation: boatFloat 2s ease-in-out infinite; }
        @keyframes boatFloat { 0%, 100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-5px) rotate(-1deg); } 75% { transform: translateY(5px) rotate(1deg); } }
        .boat-deck { position: absolute; top: 8px; left: 15px; width: 70px; height: 12px; background: #8B4513; border-top: 2px solid #DEB887; }
        .boat-cabin { position: absolute; top: -35px; left: 35px; width: 30px; height: 25px; background: #DEB887; border: 2px solid #8B4513; }
        .cabin-roof { width: 0; height: 0; border-left: 17px solid transparent; border-right: 17px solid transparent; border-bottom: 12px solid #8B4513; margin-left: -2px; }
        .cabin-window { position: absolute; width: 8px; height: 10px; background: #87CEEB; border: 1px solid #8B4513; top: 5px; left: 10px; }
        .mast { position: absolute; top: -80px; left: 50px; width: 6px; height: 55px; background: #8B4513; }
        .mast-crossbar { position: absolute; top: 10px; left: -20px; width: 46px; height: 3px; background: #8B4513; }
        .sail { position: absolute; top: -78px; left: 55px; width: 45px; height: 50px; background: linear-gradient(to left, #FFFFFF 0%, #F0F0F0 100%); clip-path: polygon(0% 0%, 100% 100%, 0% 100%); border: 1px solid #DDD; animation: sailWave 2s ease-in-out infinite; transform-origin: left center; }
        .sail::after { content: ''; position: absolute; top: 10px; left: 5px; width: 35px; height: 30px; border-left: 1px solid #E0E0E0; border-bottom: 1px solid #E0E0E0; }
        @keyframes sailWave { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(5deg); } }

        /* 船锚 */
        .anchor { position: absolute; top: 25px; left: 20px; width: 15px; height: 25px; opacity: 0; animation: anchorDrop 1s ease-in 4s forwards; }
        @keyframes anchorDrop { 0% { opacity: 1; transform: translateY(0) rotate(0deg); } 50% { opacity: 1; transform: translateY(60px) rotate(180deg); } 100% { opacity: 1; transform: translateY(50px) rotate(180deg); } }
        .anchor-top { width: 15px; height: 5px; background: #808080; }
        .anchor-shackle { width: 8px; height: 8px; border: 3px solid #808080; border-bottom: none; border-radius: 50% 50% 0 0; margin-left: 3px; }
        .anchor-chain { width: 3px; height: 20px; background: repeating-linear-gradient(to bottom, #808080 0px, #808080 3px, #FFFFFF 3px, #FFFFFF 4px); margin-left: 6px; }
        .anchor-flukes { width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 15px solid #808080; margin-left: -1px; }
        .anchor-flukes::after { content: ''; position: absolute; bottom: -15px; left: -6px; width: 4px; height: 10px; background: #808080; transform: rotate(-30deg); }
        .anchor-flukes::before { content: ''; position: absolute; bottom: -15px; left: 2px; width: 4px; height: 10px; background: #808080; transform: rotate(30deg); }

        /* 水花效果 */
        .anchor-splash { position: absolute; bottom: -50px; left: 15px; opacity: 0; animation: splashDrop 0.5s ease-out 4.5s forwards; }
        @keyframes splashDrop { 0% { opacity: 1; transform: scale(0); } 50% { opacity: 1; transform: scale(1.5); } 100% { opacity: 0; transform: scale(1); } }
        .splash-drop { position: absolute; width: 8px; height: 8px; background: #FFFFFF; border-radius: 50%; }
        .splash-drop:nth-child(1) { animation: drop1 0.5s ease-out forwards; }
        .splash-drop:nth-child(2) { left: 10px; animation: drop2 0.5s ease-out forwards; }
        .splash-drop:nth-child(3) { left: -5px; animation: drop3 0.5s ease-out forwards; }
        .splash-drop:nth-child(4) { left: 15px; animation: drop4 0.5s ease-out forwards; }
        @keyframes drop1 { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-20px) translateX(5px) scale(0); } }
        @keyframes drop2 { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-25px) translateX(-3px) scale(0); } }
        @keyframes drop3 { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-15px) translateX(-8px) scale(0); } }
        @keyframes drop4 { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-18px) translateX(12px) scale(0); } }

        /* 过渡提示 */
        .transition-hint { position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%); z-index: 20; opacity: 0; animation: fadeIn 1s ease-out 6s forwards; font-family: monospace; font-size: 12px; color: #333; text-shadow: 2px 2px 0 #FFF; }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <!-- 云朵 -->
        <div class="clouds">
            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>
            <div class="cloud cloud3"></div>
        </div>

        <!-- 海洋 -->
        <div class="ocean">
            <div class="wave-layer wave1">
                <svg class="wave-svg" viewBox="0 0 1200 300" preserveAspectRatio="none">
                    <path fill="#0A3D62" d="M0,150 Q150,100 300,150 T600,150 T900,150 T1200,150 L1200,300 L0,300 Z" />
                    <path fill="#1E90FF" d="M0,180 Q150,130 300,180 T600,180 T900,180 T1200,180 L1200,300 L0,300 Z" />
                </svg>
            </div>
            <div class="wave-layer wave2">
                <svg class="wave-svg" viewBox="0 0 1200 300" preserveAspectRatio="none">
                    <path fill="#1E90FF" d="M0,120 Q150,70 300,120 T600,120 T900,120 T1200,120 L1200,300 L0,300 Z" />
                    <path fill="#87CEEB" d="M0,140 Q150,90 300,140 T600,140 T900,140 T1200,140 L1200,300 L0,300 Z" />
                </svg>
            </div>
            <div class="wave-layer wave3">
                <svg class="wave-svg" viewBox="0 0 1200 300" preserveAspectRatio="none">
                    <path fill="#87CEEB" d="M0,90 Q150,40 300,90 T600,90 T900,90 T1200,90 L1200,300 L0,300 Z" />
                </svg>
            </div>
            <div class="wave-layer wave4">
                <svg class="wave-svg" viewBox="0 0 1200 300" preserveAspectRatio="none">
                    <path fill="rgba(255,255,255,0.3)" d="M0,70 Q150,20 300,70 T600,70 T900,70 T1200,70 L1200,100 L0,100 Z" />
                </svg>
            </div>

            <!-- 浪花 -->
            <div class="splashes">
                <div class="splash"></div>
                <div class="splash"></div>
                <div class="splash"></div>
                <div class="splash"></div>
                <div class="splash"></div>
            </div>
        </div>

        <!-- 海岸 -->
        <div class="coast">
            <div class="sand"></div>
            <div class="grass"></div>
            <div class="grass-patch"></div>
            <div class="grass-patch"></div>
            <div class="grass-patch"></div>
            <div class="grass-patch"></div>
            <div class="grass-patch"></div>
            <div class="grass-patch"></div>
            <div class="rock rock1"></div>
            <div class="rock rock2"></div>
            <div class="rock rock3"></div>
            <div class="shell shell1"></div>
            <div class="shell shell2"></div>
            <div class="shell shell3"></div>
        </div>

        <!-- 灯塔 -->
        <div class="lighthouse">
            <div class="lighthouse-cottage">
                <div class="cottage-window"></div>
                <div class="cottage-roof"></div>
            </div>
            <div class="lighthouse-base">
                <div class="lighthouse-window"></div>
                <div class="lighthouse-window"></div>
                <div class="lighthouse-window"></div>
            </div>
            <div class="lighthouse-top"></div>
            <div class="lighthouse-lamp"></div>
            <div class="lighthouse-beam"></div>
        </div>

        <!-- 帆船 -->
        <div class="sailboat">
            <div class="boat-body">
                <div class="boat-deck"></div>
                <div class="boat-cabin">
                    <div class="cabin-window"></div>
                    <div class="cabin-roof"></div>
                </div>
                <div class="mast">
                    <div class="mast-crossbar"></div>
                </div>
                <div class="sail"></div>
                <div class="anchor">
                    <div class="anchor-top"></div>
                    <div class="anchor-shackle"></div>
                    <div class="anchor-chain"></div>
                    <div class="anchor-flukes"></div>
                </div>
                <div class="anchor-splash">
                    <div class="splash-drop"></div>
                    <div class="splash-drop"></div>
                    <div class="splash-drop"></div>
                    <div class="splash-drop"></div>
                </div>
            </div>
        </div>

        <!-- 过渡提示 -->
        <div class="transition-hint">点击或按任意键继续...</div>
    </div>

    <script>
        document.addEventListener('click', function() {
            document.body.style.opacity = '0';
            setTimeout(function() {
                alert('开屏动画结束，即将进入主页面');
                document.body.style.opacity = '1';
            }, 1000);
        });

        document.addEventListener('keydown', function(e) {
            if (e.key !== 'Escape') {
                document.body.style.opacity = '0';
                setTimeout(function() {
                    alert('开屏动画结束，即将进入主页面');
                    document.body.style.opacity = '1';
                }, 1000);
            }
        });
    </script>
</body>
</html>
