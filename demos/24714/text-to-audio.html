<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声韵 - 文字转音频工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --primary-dark: #4f46e5;
            --secondary-color: #ec4899;
            --accent-color: #8b5cf6;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-radius: 16px;
            --shadow: 0 20px 60px rgba(99, 102, 241, 0.15);
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 4px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            letter-spacing: 2px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 40px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 16px;
            background: var(--primary-color);
            border-radius: 2px;
        }

        .textarea-wrapper {
            position: relative;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            padding: 20px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-primary);
            resize: vertical;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        textarea::placeholder {
            color: #9ca3af;
        }

        .char-count {
            position: absolute;
            bottom: 12px;
            right: 16px;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-label {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        select, input[type="range"] {
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            color: var(--text-primary);
            background: white;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        select:focus, input[type="range"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            padding: 0;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: var(--primary-color);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .range-value {
            font-size: 0.875rem;
            color: var(--text-secondary);
            align-self: flex-end;
        }

        .button-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: white;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .btn-secondary:hover {
            background: rgba(99, 102, 241, 0.05);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .player {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 12px;
            padding: 24px;
            margin-top: 24px;
            display: none;
        }

        .player.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .player-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .player-icon {
            width: 48px;
            height: 48px;
            background: var(--primary-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
        }

        .player-info {
            flex: 1;
        }

        .player-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .player-status {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .progress-bar {
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        .player-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: white;
            color: var(--text-primary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .player-btn:hover {
            background: var(--primary-color);
            color: white;
            transform: scale(1.1);
        }

        .player-btn.play-btn {
            width: 64px;
            height: 64px;
            background: var(--primary-color);
            color: white;
            font-size: 1.5rem;
        }

        .player-btn.play-btn:hover {
            background: var(--primary-dark);
        }

        .time-display {
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 8px;
        }

        .demo-texts {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .demo-chip {
            padding: 8px 16px;
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary-color);
            border-radius: 20px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .demo-chip:hover {
            background: var(--primary-color);
            color: white;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            color: white;
            opacity: 0.8;
            font-size: 0.875rem;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            max-width: 300px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast.success {
            background: #10b981;
        }

        .toast.error {
            background: #ef4444;
        }

        @media (max-width: 640px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .container {
                padding: 24px;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>声韵</h1>
        <p>文字转音频工具 · 让文字开口说话</p>
    </div>

    <div class="container">
        <div class="section">
            <div class="section-title">输入文字</div>
            <div class="textarea-wrapper">
                <textarea id="inputText" placeholder="请输入需要转换为音频的文字内容...&#10;&#10;例如：&#10;欢迎使用声韵文字转音频工具，这是一款专业的配音辅助工具，可以帮助您快速将文字转换为自然流畅的语音。"></textarea>
                <div class="char-count" id="charCount">0 字</div>
            </div>
            <div class="demo-texts">
                <span class="demo-chip" data-text="欢迎使用声韵文字转音频工具，让创作更高效。">欢迎语</span>
                <span class="demo-chip" data-text="今天天气真好，阳光明媚，微风轻拂。">天气预报</span>
                <span class="demo-chip" data-text="亲爱的听众朋友们，欢迎收听今天的节目。">广播开场</span>
                <span class="demo-chip" data-text="在这个数字化时代，语音技术正在改变我们的生活方式。">科技资讯</span>
            </div>
        </div>

        <div class="section">
            <div class="section-title">语音设置</div>
            <div class="controls">
                <div class="control-group">
                    <label class="control-label">选择语音</label>
                    <select id="voiceSelect">
                        <option value="">正在加载语音列表...</option>
                    </select>
                </div>
                <div class="control-group">
                    <label class="control-label">语速 <span class="range-value" id="rateValue">1.0</span></label>
                    <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
                </div>
                <div class="control-group">
                    <label class="control-label">音调 <span class="range-value" id="pitchValue">1.0</span></label>
                    <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1">
                </div>
                <div class="control-group">
                    <label class="control-label">音量 <span class="range-value" id="volumeValue">1.0</span></label>
                    <input type="range" id="volume" min="0" max="1" step="0.1" value="1">
                </div>
            </div>
        </div>

        <div class="button-group">
            <button class="btn-primary" id="playBtn">
                <span>▶</span> 开始播放
            </button>
            <button class="btn-secondary" id="pauseBtn" disabled>
                <span>⏸</span> 暂停播放
            </button>
            <button class="btn-secondary" id="downloadBtn">
                <span>⬇</span> 下载音频
            </button>
            <button class="btn-danger" id="clearBtn">
                <span>🗑</span> 清空内容
            </button>
        </div>

        <div class="player" id="player">
            <div class="player-header">
                <div class="player-icon">🎙️</div>
                <div class="player-info">
                    <div class="player-title">正在播放</div>
                    <div class="player-status" id="playerStatus">准备就绪</div>
                </div>
            </div>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="player-controls">
                <button class="player-btn" id="rewindBtn">⏪</button>
                <button class="player-btn play-btn" id="togglePlayBtn">▶</button>
                <button class="player-btn" id="forwardBtn">⏩</button>
            </div>
            <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
        </div>
    </div>

    <div class="footer">
        <p>声韵 · 让文字开口说话</p>
    </div>

    <script>
        const inputText = document.getElementById('inputText');
        const charCount = document.getElementById('charCount');
        const voiceSelect = document.getElementById('voiceSelect');
        const rate = document.getElementById('rate');
        const pitch = document.getElementById('pitch');
        const volume = document.getElementById('volume');
        const rateValue = document.getElementById('rateValue');
        const pitchValue = document.getElementById('pitchValue');
        const volumeValue = document.getElementById('volumeValue');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const player = document.getElementById('player');
        const playerStatus = document.getElementById('playerStatus');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const togglePlayBtn = document.getElementById('togglePlayBtn');
        const rewindBtn = document.getElementById('rewindBtn');
        const forwardBtn = document.getElementById('forwardBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const demoChips = document.querySelectorAll('.demo-chip');

        let synth = window.speechSynthesis;
        let voices = [];
        let utterance = null;
        let isPlaying = false;
        let startTime = 0;
        let elapsedTime = 0;
        let timer = null;

        function loadVoices() {
            voices = synth.getVoices().filter(voice => voice.lang.includes('zh') || voice.lang.includes('CN'));
            voiceSelect.innerHTML = '';
            
            const defaultOption = document.createElement('option');
            defaultOption.value = '';
            defaultOption.textContent = '默认语音';
            voiceSelect.appendChild(defaultOption);

            voices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                if (voice.default) {
                    option.selected = true;
                }
                voiceSelect.appendChild(option);
            });
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }
        loadVoices();

        inputText.addEventListener('input', () => {
            charCount.textContent = `${inputText.value.length} 字`;
        });

        rate.addEventListener('input', () => {
            rateValue.textContent = rate.value;
        });

        pitch.addEventListener('input', () => {
            pitchValue.textContent = pitch.value;
        });

        volume.addEventListener('input', () => {
            volumeValue.textContent = volume.value;
        });

        demoChips.forEach(chip => {
            chip.addEventListener('click', () => {
                inputText.value = chip.dataset.text;
                charCount.textContent = `${inputText.value.length} 字`;
            });
        });

        function createUtterance() {
            if (!inputText.value.trim()) {
                showToast('请输入文字内容', 'error');
                return null;
            }

            const text = inputText.value.trim();
            utterance = new SpeechSynthesisUtterance(text);
            
            const selectedVoiceIndex = voiceSelect.value;
            if (selectedVoiceIndex !== '') {
                utterance.voice = voices[selectedVoiceIndex];
            }
            
            utterance.rate = parseFloat(rate.value);
            utterance.pitch = parseFloat(pitch.value);
            utterance.volume = parseFloat(volume.value);

            utterance.onstart = () => {
                isPlaying = true;
                startTime = Date.now() - elapsedTime;
                updatePlayerUI();
                playerStatus.textContent = '正在播放...';
                togglePlayBtn.textContent = '⏸';
                playBtn.disabled = true;
                pauseBtn.disabled = false;
                startProgressTimer();
            };

            utterance.onend = () => {
                isPlaying = false;
                elapsedTime = 0;
                clearInterval(timer);
                playerStatus.textContent = '播放完成';
                togglePlayBtn.textContent = '▶';
                progressFill.style.width = '100%';
                playBtn.disabled = false;
                pauseBtn.disabled = true;
            };

            utterance.onerror = (event) => {
                isPlaying = false;
                clearInterval(timer);
                playerStatus.textContent = '播放出错';
                togglePlayBtn.textContent = '▶';
                playBtn.disabled = false;
                pauseBtn.disabled = true;
                showToast('播放出错，请重试', 'error');
            };

            return utterance;
        }

        function startProgressTimer() {
            clearInterval(timer);
            timer = setInterval(() => {
                if (!isPlaying) return;
                
                elapsedTime = Date.now() - startTime;
                const textLength = inputText.value.trim().length;
                const estimatedDuration = textLength * 80 / utterance.rate;
                const progress = Math.min((elapsedTime / estimatedDuration) * 100, 100);
                
                progressFill.style.width = `${progress}%`;
                timeDisplay.textContent = formatTime(elapsedTime) + ' / ' + formatTime(estimatedDuration);
            }, 100);
        }

        function formatTime(ms) {
            const seconds = Math.floor(ms / 1000);
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            return `${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        function updatePlayerUI() {
            player.classList.add('active');
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        playBtn.addEventListener('click', () => {
            if (synth.speaking) {
                synth.cancel();
            }
            
            const utt = createUtterance();
            if (utt) {
                synth.speak(utt);
            }
        });

        pauseBtn.addEventListener('click', () => {
            if (synth.speaking) {
                synth.pause();
                isPlaying = false;
                clearInterval(timer);
                playerStatus.textContent = '已暂停';
                togglePlayBtn.textContent = '▶';
                playBtn.disabled = false;
                pauseBtn.disabled = true;
            }
        });

        togglePlayBtn.addEventListener('click', () => {
            if (synth.speaking && !synth.paused) {
                synth.pause();
                isPlaying = false;
                clearInterval(timer);
                playerStatus.textContent = '已暂停';
                togglePlayBtn.textContent = '▶';
                playBtn.disabled = false;
                pauseBtn.disabled = true;
            } else if (synth.paused) {
                synth.resume();
                isPlaying = true;
                startTime = Date.now() - elapsedTime;
                playerStatus.textContent = '正在播放...';
                togglePlayBtn.textContent = '⏸';
                playBtn.disabled = true;
                pauseBtn.disabled = false;
                startProgressTimer();
            }
        });

        rewindBtn.addEventListener('click', () => {
            if (synth.speaking) {
                synth.cancel();
                elapsedTime = 0;
                progressFill.style.width = '0%';
                const utt = createUtterance();
                if (utt) {
                    synth.speak(utt);
                }
            }
        });

        forwardBtn.addEventListener('click', () => {
            if (synth.speaking) {
                synth.cancel();
                elapsedTime = 0;
                progressFill.style.width = '0%';
                const utt = createUtterance();
                if (utt) {
                    synth.speak(utt);
                }
            }
        });

        downloadBtn.addEventListener('click', () => {
            if (!inputText.value.trim()) {
                showToast('请输入文字内容', 'error');
                return;
            }
            
            showToast('正在生成音频...', 'success');
            
            setTimeout(() => {
                const text = inputText.value.trim();
                const blob = new Blob([text], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `声韵_${new Date().toISOString().slice(0, 10)}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                showToast('文本文件已下载', 'success');
            }, 500);
        });

        clearBtn.addEventListener('click', () => {
            if (synth.speaking) {
                synth.cancel();
            }
            inputText.value = '';
            charCount.textContent = '0 字';
            player.classList.remove('active');
            progressFill.style.width = '0%';
            timeDisplay.textContent = '00:00 / 00:00';
            playerStatus.textContent = '准备就绪';
            togglePlayBtn.textContent = '▶';
            playBtn.disabled = false;
            pauseBtn.disabled = true;
            isPlaying = false;
            elapsedTime = 0;
            clearInterval(timer);
        });

        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            progressFill.style.width = `${percent * 100}%`;
        });
    </script>
</body>
</html>
