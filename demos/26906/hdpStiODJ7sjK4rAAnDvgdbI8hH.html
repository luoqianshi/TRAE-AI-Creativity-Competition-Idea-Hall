<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空间效果预览系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d0d0d;
            --bg-card: #1a1a1a;
            --bg-elevated: #242424;
            --accent: #ff6b35;
            --accent-dim: #cc5529;
            --text-primary: #f5f5f5;
            --text-secondary: #888;
            --border: #333;
            --success: #4ecdc4;
            --warning: #ffe66d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景纹理 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 0%, rgba(255, 107, 53, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(78, 205, 196, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 24px;
            position: relative;
            z-index: 1;
        }

        /* 头部 */
        header {
            text-align: center;
            margin-bottom: 48px;
            animation: fadeInDown 0.6s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            letter-spacing: 4px;
            color: var(--accent);
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 300;
        }

        /* 主布局 */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 32px;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 预览区域 */
        .preview-section {
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
        }

        .preview-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-title {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .preview-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .preview-area {
            position: relative;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: 
                linear-gradient(45deg, #151515 25%, transparent 25%),
                linear-gradient(-45deg, #151515 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #151515 75%),
                linear-gradient(-45deg, transparent 75%, #151515 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #1a1a1a;
        }

        .upload-placeholder {
            text-align: center;
            padding: 60px;
        }

        .upload-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            border: 2px dashed var(--border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .upload-icon svg {
            width: 32px;
            height: 32px;
            stroke: var(--text-secondary);
        }

        .upload-placeholder:hover .upload-icon {
            border-color: var(--accent);
            background: rgba(255, 107, 53, 0.05);
        }

        .upload-placeholder:hover .upload-icon svg {
            stroke: var(--accent);
        }

        .upload-text {
            font-size: 16px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 13px;
            color: var(--text-secondary);
        }

        #imageInput {
            display: none;
        }

        #previewImage {
            display: none;
            max-width: 100%;
            max-height: 600px;
        }

        /* 蒙版层 */
        .mask-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
        }

        /* 控制面板 */
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-card {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .panel-card:hover {
            border-color: rgba(255, 107, 53, 0.3);
        }

        .panel-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-icon {
            width: 20px;
            height: 20px;
            stroke: var(--accent);
        }

        .panel-title {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .panel-content {
            padding: 20px;
        }

        /* 区域选择 */
        .zone-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .zone-btn {
            padding: 14px 12px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .zone-btn svg {
            width: 24px;
            height: 24px;
            stroke: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .zone-btn:hover {
            background: rgba(255, 107, 53, 0.1);
            border-color: var(--accent);
        }

        .zone-btn:hover svg {
            stroke: var(--accent);
        }

        .zone-btn.active {
            background: rgba(255, 107, 53, 0.15);
            border-color: var(--accent);
        }

        .zone-btn.active svg {
            stroke: var(--accent);
        }

        /* 材质选择 */
        .material-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .material-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .material-item:hover {
            border-color: var(--text-secondary);
        }

        .material-item.active {
            border-color: var(--accent);
            background: rgba(255, 107, 53, 0.1);
        }

        .material-swatch {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .material-info {
            flex: 1;
        }

        .material-name {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .material-desc {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .material-check {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .material-item.active .material-check {
            border-color: var(--accent);
            background: var(--accent);
        }

        .material-check svg {
            width: 12px;
            height: 12px;
            stroke: white;
            stroke-width: 3;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .material-item.active .material-check svg {
            opacity: 1;
        }

        /* 颜色选择 */
        .color-section {
            margin-top: 16px;
        }

        .color-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: block;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .color-btn {
            aspect-ratio: 1;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            border-color: white;
            box-shadow: 0 0 0 2px var(--accent);
        }

        .color-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 6px;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
        }

        /* 效果强度 */
        .effect-slider {
            margin-top: 20px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .slider-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .slider-value {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            color: var(--accent);
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--bg-elevated);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 3px solid var(--bg-card);
            box-shadow: 0 2px 8px rgba(255, 107, 53, 0.4);
            transition: transform 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* 应用按钮 */
        .apply-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .apply-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 107, 53, 0.4);
        }

        .apply-btn:active {
            transform: translateY(0);
        }

        .apply-btn svg {
            width: 18px;
            height: 18px;
        }

        /* 预设方案 */
        .preset-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .preset-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: block;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .preset-btn {
            padding: 10px 8px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .preset-btn:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        /* 提示信息 */
        .tip-box {
            background: rgba(78, 205, 196, 0.1);
            border: 1px solid rgba(78, 205, 196, 0.3);
            border-radius: 8px;
            padding: 14px;
            margin-top: 16px;
        }

        .tip-title {
            font-size: 12px;
            font-weight: 500;
            color: var(--success);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tip-text {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* 响应式 */
        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 32px;
            }
        }

        /* 蒙版颜色显示 */
        #maskCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Space Vision System</div>
            <h1>空间效果预览</h1>
            <p class="subtitle">上传场馆图片，在线预览装修效果</p>
        </header>

        <div class="main-layout">
            <!-- 预览区域 -->
            <div class="preview-section">
                <div class="preview-header">
                    <span class="preview-title">实时预览</span>
                    <span class="preview-status">
                        <span class="status-dot"></span>
                        <span id="statusText">等待上传图片</span>
                    </span>
                </div>
                <div class="preview-area" id="previewArea">
                    <div class="upload-placeholder" id="uploadPlaceholder">
                        <div class="upload-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                        </div>
                        <p class="upload-text">点击或拖拽上传图片</p>
                        <p class="upload-hint">支持 JPG、PNG 格式，建议尺寸 1920×1080</p>
                    </div>
                    <img id="previewImage" alt="预览图片">
                    <canvas id="maskCanvas"></canvas>
                </div>
                <input type="file" id="imageInput" accept="image/*">
            </div>

            <!-- 控制面板 -->
            <div class="control-panel">
                <!-- 区域选择 -->
                <div class="panel-card">
                    <div class="panel-header">
                        <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <path d="M3 9h18"/>
                            <path d="M9 21V9"/>
                        </svg>
                        <span class="panel-title">选择区域</span>
                    </div>
                    <div class="panel-content">
                        <div class="zone-grid">
                            <button class="zone-btn active" data-zone="floor">
                                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2 20h20"/>
                                    <path d="M4 20v-4l4-4 4 4 4-4 4 4v4"/>
                                </svg>
                                <span>地面</span>
                            </button>
                            <button class="zone-btn" data-zone="wall">
                                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="4" y="4" width="16" height="16" rx="1"/>
                                    <path d="M4 12h16"/>
                                    <path d="M12 4v16"/>
                                </svg>
                                <span>墙面</span>
                            </button>
                            <button class="zone-btn" data-zone="ceiling">
                                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2 4l20 0"/>
                                    <path d="M4 4v4l4-4 4 4 4-4 4 4v-4"/>
                                </svg>
                                <span>天花板</span>
                            </button>
                            <button class="zone-btn" data-zone="column">
                                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="6" y="4" width="12" height="16"/>
                                    <path d="M6 8h12"/>
                                    <path d="M6 16h12"/>
                                </svg>
                                <span>立柱</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 材质选择 -->
                <div class="panel-card">
                    <div class="panel-header">
                        <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 2a10 10 0 0 1 10 10"/>
                            <path d="M12 2a10 10 0 0 0-10 10"/>
                            <circle cx="12" cy="12" r="4"/>
                        </svg>
                        <span class="panel-title">材质类型</span>
                    </div>
                    <div class="panel-content">
                        <div class="material-list">
                            <div class="material-item active" data-material="epoxy">
                                <div class="material-swatch" style="background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);"></div>
                                <div class="material-info">
                                    <div class="material-name">环氧地坪</div>
                                    <div class="material-desc">光滑、耐磨、防尘</div>
                                </div>
                                <div class="material-check">
                                    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="20 6 9 17 4 12"/>
                                    </svg>
                                </div>
                            </div>
                            <div class="material-item" data-material="polyurea">
                                <div class="material-swatch" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);"></div>
                                <div class="material-info">
                                    <div class="material-name">聚脲地坪</div>
                                    <div class="material-desc">防水、耐候、弹性好</div>
                                </div>
                                <div class="material-check">
                                    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="20 6 9 17 4 12"/>
                                    </svg>
                                </div>
                            </div>
                            <div class="material-item" data-material="concrete">
                                <div class="material-swatch" style="background: linear-gradient(135deg, #a0aec0 0%, #718096 100%);"></div>
                                <div class="material-info">
                                    <div class="material-name">混凝土密封</div>
                                    <div class="material-desc">硬化、耐磨、自然质感</div>
                                </div>
                                <div class="material-check">
                                    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="20 6 9 17 4 12"/>
                                    </svg>
                                </div>
                            </div>
                            <div class="material-item" data-material="rubber">
                                <div class="material-swatch" style="background: linear-gradient(135deg, #48bb78 0%, #2f855a 100%);"></div>
                                <div class="material-info">
                                    <div class="material-name">橡胶地板</div>
                                    <div class="material-desc">防滑、减震、运动专用</div>
                                </div>
                                <div class="material-check">
                                    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="20 6 9 17 4 12"/>
                                    </svg>
                                </div>
                            </div>
                        </div>

                        <div class="color-section">
                            <span class="color-label">选择颜色</span>
                            <div class="color-grid">
                                <button class="color-btn active" style="background: #4a5568;" data-color="#4a5568"></button>
                                <button class="color-btn" style="background: #2d3748;" data-color="#2d3748"></button>
                                <button class="color-btn" style="background: #3182ce;" data-color="#3182ce"></button>
                                <button class="color-btn" style="background: #38a169;" data-color="#38a169"></button>
                                <button class="color-btn" style="background: #e53e3e;" data-color="#e53e3e"></button>
                                <button class="color-btn" style="background: #ed8936;" data-color="#ed8936"></button>
                                <button class="color-btn" style="background: #805ad5;" data-color="#805ad5"></button>
                                <button class="color-btn" style="background: #d69e2e;" data-color="#d69e2e"></button>
                                <button class="color-btn" style="background: #319795;" data-color="#319795"></button>
                                <button class="color-btn" style="background: #f5f5f5;" data-color="#f5f5f5"></button>
                            </div>
                        </div>

                        <div class="effect-slider">
                            <div class="slider-header">
                                <span class="slider-label">覆盖透明度</span>
                                <span class="slider-value" id="opacityValue">60%</span>
                            </div>
                            <input type="range" id="opacitySlider" min="20" max="100" value="60">
                        </div>
                    </div>
                </div>

                <!-- 预设方案 -->
                <div class="panel-card">
                    <div class="panel-header">
                        <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                        <span class="panel-title">快速预设</span>
                    </div>
                    <div class="panel-content">
                        <div class="preset-grid">
                            <button class="preset-btn" data-preset="industrial">工业风</button>
                            <button class="preset-btn" data-preset="sports">运动场馆</button>
                            <button class="preset-btn" data-preset="warehouse">仓储物流</button>
                        </div>
                        <div class="preset-section">
                            <span class="preset-label">应用效果</span>
                            <div class="preset-grid">
                                <button class="preset-btn" data-preset="modern">现代简约</button>
                                <button class="preset-btn" data-preset="colorful">多彩活力</button>
                                <button class="preset-btn" data-preset="professional">专业赛事</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 应用按钮 -->
                <button class="apply-btn" id="applyBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5v14"/>
                        <path d="M5 12h14"/>
                    </svg>
                    应用效果预览
                </button>

                <div class="tip-box">
                    <div class="tip-title">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 16v-4"/>
                            <path d="M12 8h.01"/>
                        </svg>
                        使用提示
                    </div>
                    <p class="tip-text">上传厂房或场馆实景图，选择要处理的区域和材质，系统将实时叠加效果预览。目前为演示模式，视觉效果通过半透明蒙版叠加实现。</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 状态管理
        const state = {
            image: null,
            zone: 'floor',
            material: 'epoxy',
            color: '#4a5568',
            opacity: 0.6
        };

        // DOM 元素
        const previewArea = document.getElementById('previewArea');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const previewImage = document.getElementById('previewImage');
        const imageInput = document.getElementById('imageInput');
        const maskCanvas = document.getElementById('maskCanvas');
        const ctx = maskCanvas.getContext('2d');
        const statusText = document.getElementById('statusText');

        // 预设配置
        const presets = {
            industrial: { zone: 'floor', material: 'epoxy', color: '#4a5568' },
            sports: { zone: 'floor', material: 'rubber', color: '#38a169' },
            warehouse: { zone: 'floor', material: 'concrete', color: '#a0aec0' },
            modern: { zone: 'wall', material: 'epoxy', color: '#f5f5f5' },
            colorful: { zone: 'floor', material: 'polyurea', color: '#3182ce' },
            professional: { zone: 'floor', material: 'epoxy', color: '#2d3748' }
        };

        // 材质颜色映射
        const materialColors = {
            epoxy: ['#4a5568', '#2d3748', '#3182ce', '#38a169', '#e53e3e'],
            polyurea: ['#667eea', '#764ba2', '#319795', '#ed8936', '#805ad5'],
            concrete: ['#a0aec0', '#718096', '#d69e2e', '#4a5568', '#718096'],
            rubber: ['#48bb78', '#2f855a', '#38a169', '#319795', '#4a5568']
        };

        // 上传图片
        previewArea.addEventListener('click', () => imageInput.click());
        
        previewArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            previewArea.style.background = 'rgba(255, 107, 53, 0.1)';
        });

        previewArea.addEventListener('dragleave', () => {
            previewArea.style.background = '';
        });

        previewArea.addEventListener('drop', (e) => {
            e.preventDefault();
            previewArea.style.background = '';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                loadImage(file);
            }
        });

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                loadImage(file);
            }
        });

        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewImage.style.display = 'block';
                uploadPlaceholder.style.display = 'none';
                statusText.textContent = '图片已加载';
                
                previewImage.onload = () => {
                    resizeCanvas();
                    drawMask();
                };
            };
            reader.readAsDataURL(file);
            state.image = file;
        }

        function resizeCanvas() {
            maskCanvas.width = previewImage.naturalWidth;
            maskCanvas.height = previewImage.naturalHeight;
            maskCanvas.style.width = previewImage.offsetWidth + 'px';
            maskCanvas.style.height = previewImage.offsetHeight + 'px';
        }

        // 绘制蒙版
        function drawMask() {
            if (!previewImage.src) return;
            
            ctx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
            
            // 解析颜色
            const color = state.color;
            const opacity = state.opacity;
            
            // 创建渐变效果模拟材质
            const gradient = ctx.createLinearGradient(0, 0, maskCanvas.width, maskCanvas.height);
            gradient.addColorStop(0, color);
            gradient.addColorStop(0.5, adjustColor(color, 20));
            gradient.addColorStop(1, color);
            
            ctx.fillStyle = gradient;
            ctx.globalAlpha = opacity;
            
            // 根据区域绘制不同的蒙版形状
            const w = maskCanvas.width;
            const h = maskCanvas.height;
            
            switch(state.zone) {
                case 'floor':
                    // 地面 - 底部区域
                    ctx.beginPath();
                    ctx.moveTo(0, h * 0.6);
                    ctx.lineTo(w * 0.15, h * 0.85);
                    ctx.lineTo(w * 0.85, h * 0.85);
                    ctx.lineTo(w, h * 0.6);
                    ctx.lineTo(w, h);
                    ctx.lineTo(0, h);
                    ctx.closePath();
                    ctx.fill();
                    break;
                case 'wall':
                    // 墙面 - 左侧区域
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(w * 0.35, 0);
                    ctx.lineTo(w * 0.35, h);
                    ctx.lineTo(0, h);
                    ctx.closePath();
                    ctx.fill();
                    break;
                case 'ceiling':
                    // 天花板 - 顶部区域
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(w, 0);
                    ctx.lineTo(w, h * 0.25);
                    ctx.lineTo(w * 0.7, h * 0.25);
                    ctx.lineTo(w * 0.5, h * 0.15);
                    ctx.lineTo(w * 0.3, h * 0.25);
                    ctx.lineTo(0, h * 0.25);
                    ctx.closePath();
                    ctx.fill();
                    break;
                case 'column':
                    // 立柱 - 中间区域
                    ctx.beginPath();
                    ctx.roundRect(w * 0.4, h * 0.1, w * 0.2, h * 0.8, 10);
                    ctx.fill();
                    break;
            }
            
            // 添加纹理效果
            ctx.globalAlpha = 0.1;
            for (let i = 0; i < 50; i++) {
                const x = Math.random() * w;
                const y = Math.random() * h;
                const size = Math.random() * 3 + 1;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x, y, size, size);
            }
            
            ctx.globalAlpha = 1;
        }

        function adjustColor(color, amount) {
            const hex = color.replace('#', '');
            const r = Math.min(255, parseInt(hex.substr(0, 2), 16) + amount);
            const g = Math.min(255, parseInt(hex.substr(2, 2), 16) + amount);
            const b = Math.min(255, parseInt(hex.substr(4, 2), 16) + amount);
            return `rgb(${r}, ${g}, ${b})`;
        }

        // 区域选择
        document.querySelectorAll('.zone-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.zone-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.zone = btn.dataset.zone;
                drawMask();
            });
        });

        // 材质选择
        document.querySelectorAll('.material-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.material-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                state.material = item.dataset.material;
                
                // 更新颜色选择
                const colors = materialColors[state.material];
                document.querySelectorAll('.color-btn').forEach((btn, index) => {
                    btn.style.background = colors[index];
                    btn.dataset.color = colors[index];
                });
                state.color = colors[0];
                drawMask();
            });
        });

        // 颜色选择
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.color = btn.dataset.color;
                drawMask();
            });
        });

        // 透明度滑块
        const opacitySlider = document.getElementById('opacitySlider');
        const opacityValue = document.getElementById('opacityValue');
        
        opacitySlider.addEventListener('input', (e) => {
            state.opacity = e.target.value / 100;
            opacityValue.textContent = e.target.value + '%';
            drawMask();
        });

        // 预设选择
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const preset = presets[btn.dataset.preset];
                if (preset) {
                    // 更新区域
                    document.querySelectorAll('.zone-btn').forEach(b => {
                        b.classList.toggle('active', b.dataset.zone === preset.zone);
                    });
                    state.zone = preset.zone;
                    
                    // 更新材质
                    document.querySelectorAll('.material-item').forEach(item => {
                        item.classList.toggle('active', item.dataset.material === preset.material);
                    });
                    state.material = preset.material;
                    
                    // 更新颜色
                    const colors = materialColors[preset.material];
                    document.querySelectorAll('.color-btn').forEach((btn, index) => {
                        btn.style.background = colors[index];
                        btn.dataset.color = colors[index];
                        btn.classList.toggle('active', colors[index] === preset.color);
                    });
                    state.color = preset.color;
                    
                    drawMask();
                    
                    statusText.textContent = `已应用: ${btn.textContent}`;
                }
            });
        });

        // 应用按钮
        document.getElementById('applyBtn').addEventListener('click', () => {
            if (!state.image) {
                alert('请先上传图片');
                return;
            }
            statusText.textContent = '效果已应用';
            setTimeout(() => {
                statusText.textContent = '实时预览中';
            }, 1500);
        });

        // 窗口调整
        window.addEventListener('resize', () => {
            if (previewImage.src) {
                maskCanvas.style.width = previewImage.offsetWidth + 'px';
                maskCanvas.style.height = previewImage.offsetHeight + 'px';
                drawMask();
            }
        });
    </script>
</body>
</html>
