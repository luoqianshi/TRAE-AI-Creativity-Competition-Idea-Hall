<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>回声地图——无障碍出行服务</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #fdf6f3;
      color: #5d4a4a;
    }
    header {
      padding: 56px 8%;
      color: white;
      background: linear-gradient(135deg, #f6a6b1, #ffc4a3);
    }
    header h1 { margin: 0 0 14px; font-size: 42px; }
    header p { margin: 0; font-size: 18px; opacity: .95; }
    main { max-width: 1100px; margin: 32px auto; padding: 0 20px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 6px 18px rgba(180, 100, 110, .10);
    }
    .card h2 { color: #c47b8a; margin-top: 0; }
    .route {
      margin-top: 22px;
      padding: 20px;
      border-radius: 14px;
      background: #fdeef0;
    }
    .route span {
      display: inline-block;
      margin: 6px;
      padding: 10px 14px;
      border-radius: 20px;
      background: white;
    }
    button {
      border: 0;
      padding: 12px 20px;
      border-radius: 24px;
      color: white;
      background: #e89aa3;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { background: #d4848f; }
    footer {
      text-align: center;
      padding: 30px;
      color: #9a8a8a;
    }
  </style>
</head>
<body>
  <header>
    <h1>回声地图</h1>
    <p>让每一条无障碍路，都真正可走。</p>
  </header>

  <main>
    <section class="grid">
      <div class="card">
        <h2>发现问题</h2>
        <p>普通地图无法及时显示电梯故障、坡道占用和道路施工，用户经常遇到“地图能走，现实走不通”的情况。</p>
      </div>

      <div class="card">
        <h2>核心功能</h2>
        <p>无障碍路线规划、实时路况上报、图片与语音反馈、社区审核、物业处理进度追踪。</p>
      </div>

      <div class="card">
        <h2>服务对象</h2>
        <p>轮椅用户、老年人、视障人士、孕妇、推婴儿车家庭及社区管理人员。</p>
      </div>
    </section>

    <section class="card" style="margin-top:22px;">
      <h2>示例路线</h2>
      <p>从“阳光社区”前往“市人民医院”，系统自动避开故障电梯和台阶路段：</p>
      <div class="route">
        <span>阳光社区</span>
        <strong>→</strong>
        <span>无障碍坡道</span>
        <strong>→</strong>
        <span>地铁B口电梯</span>
        <strong>→</strong>
        <span>市人民医院</span>
      </div>
      <br>
      <button onclick="report()">上报一处无障碍问题</button>
      <p id="message"></p>
    </section>
  </main>

  <footer>
    回声地图 · 用每一次反馈，让城市更加友好
  </footer>

  <script>
    function report() {
      document.getElementById("message").innerText =
        "感谢你的反馈！问题将提交给社区审核，并同步给相关管理人员。";
    }
  </script>
</body>
</html>
