<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎵 本地音乐播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 100%;
            overflow: hidden;
        }

        /* 移动端头部 */
        .mobile-header {
            display: none;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .mobile-header h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .menu-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 侧边菜单（移动端） */
        .side-menu {
            position: fixed;
            top: 0;
            left: -100%;
            width: 80%;
            max-width: 320px;
            height: 100vh;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            z-index: 1001;
            transition: left 0.3s ease;
            box-shadow: 5px 0 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .side-menu.active {
            left: 0;
        }

        .side-menu-header {
            padding: 30px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .side-menu-header h2 {
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .side-menu-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .menu-section {
            margin-bottom: 25px;
        }

        .menu-section-title {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            padding-left: 10px;
        }

        .menu-item {
            padding: 12px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 8px;
        }

        .menu-item:hover, .menu-item.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3) 0%, rgba(118, 75, 162, 0.3) 100%);
        }

        .menu-item-icon {
            font-size: 20px;
            width: 30px;
            text-align: center;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 桌面端侧边栏 */
        .sidebar {
            width: 320px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .sidebar-header {
            padding: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-header h2 {
            font-size: 22px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .scan-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .scan-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab {
            flex: 1;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
            font-weight: 500;
            font-size: 14px;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .tab.active {
            border-bottom-color: #667eea;
            background: rgba(102, 126, 234, 0.15);
        }

        .playlist-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .playlist-item {
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            position: relative;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .playlist-item.playing {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.25) 0%, rgba(118, 75, 162, 0.25) 100%);
            border-color: rgba(102, 126, 234, 0.4);
        }

        .playlist-item-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .playlist-item-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .playlist-item-details {
            flex: 1;
            min-width: 0;
        }

        .playlist-item-title {
            font-weight: 600;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 14px;
        }

        .playlist-item-artist {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item-duration {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 3px;
        }

        .playlist-item-actions {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .playlist-item:hover .playlist-item-actions {
            opacity: 1;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .action-btn.favorite.active {
            color: #ff6b6b;
        }

        /* 主播放器区域 */
        .main-player {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .album-art-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .album-art {
            width: 280px;
            height: 280px;
            border-radius: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .album-art::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
            pointer-events: none;
        }

        .vinyl-effect {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            background: 
                radial-gradient(circle at center, transparent 28%, rgba(0,0,0,0.25) 29%, transparent 30%),
                radial-gradient(circle at center, transparent 48%, rgba(0,0,0,0.15) 49%, transparent 50%),
                radial-gradient(circle at center, transparent 68%, rgba(0,0,0,0.1) 69%, transparent 70%);
            pointer-events: none;
        }

        .song-info {
            text-align: center;
            margin-bottom: 25px;
        }

        .song-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 400px;
        }

        .song-artist {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
        }

        .progress-container {
            width: 100%;
            max-width: 450px;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 3px;
            position: relative;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Courier New', monospace;
        }

        /* 播放控制 */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-btn {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .control-btn.play-btn {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-size: 26px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .control-btn.play-btn:hover {
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }

        .control-btn.active {
            color: #667eea;
        }

        /* 音量控制 */
        .volume-control {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .volume-slider {
            width: 120px;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .volume-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 3px;
        }

        .volume-icon {
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .volume-icon:hover {
            transform: scale(1.2);
        }

        /* 歌词区域 */
        .lyrics-container {
            width: 100%;
            max-width: 500px;
            height: 120px;
            overflow-y: auto;
            text-align: center;
            margin: 0 auto;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
        }

        .lyric-line {
            padding: 8px 15px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .lyric-line:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        .lyric-line.active {
            color: white;
            font-size: 17px;
            font-weight: 600;
        }

        /* 播放模式指示器 */
        .mode-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-indicator:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            padding: 40px;
        }

        .empty-state-icon {
            font-size: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .empty-state-hint {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
        }

        /* 动画效果 */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .album-art.spinning {
            animation: spin 8s linear infinite;
        }

        /* 遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* 移动端底部导航 */
        .mobile-nav {
            display: none;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 0;
            padding-bottom: max(8px, env(safe-area-inset-bottom));
        }

        .mobile-nav-items {
            display: flex;
            justify-content: space-around;
        }

        .mobile-nav-item {
            flex: 1;
            padding: 10px 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .mobile-nav-item-icon {
            font-size: 24px;
            margin-bottom: 2px;
        }

        .mobile-nav-item-text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }

        .mobile-nav-item.active .mobile-nav-item-icon {
            transform: scale(1.1);
        }

        .mobile-nav-item.active .mobile-nav-item-text {
            color: #667eea;
            font-weight: 600;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .desktop-layout {
                display: none !important;
            }

            .mobile-header {
                display: flex !important;
            }

            .main-content {
                padding: 15px;
                padding-bottom: 0;
            }

            .mobile-nav {
                display: block !important;
            }

            .main-player {
                padding: 15px;
                padding-bottom: 80px;
            }

            .album-art {
                width: 220px;
                height: 220px;
                font-size: 80px;
                margin-bottom: 20px;
            }

            .song-title {
                font-size: 22px;
            }

            .song-artist {
                font-size: 14px;
            }

            .controls {
                gap: 12px;
            }

            .control-btn {
                width: 44px;
                height: 44px;
                font-size: 16px;
            }

            .control-btn.play-btn {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }

            .lyrics-container {
                height: 100px;
            }

            .mode-indicator {
                top: 10px;
                right: 10px;
                padding: 5px 12px;
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .album-art {
                width: 180px;
                height: 180px;
                font-size: 60px;
                margin-bottom: 15px;
            }

            .song-title {
                font-size: 18px;
            }

            .playlist-item {
                padding: 10px;
            }

            .playlist-item-icon {
                width: 42px;
                height: 42px;
                font-size: 18px;
            }
        }

        /* Mini播放器（移动端） */
        .mini-player {
            display: none;
            position: fixed;
            bottom: 60px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            padding: 10px 15px;
            z-index: 999;
            align-items: center;
            gap: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 768px) {
            .mini-player {
                display: flex;
            }

            .mobile-nav {
                bottom: 70px;
            }
        }

        .mini-player-art {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .mini-player-info {
            flex: 1;
            min-width: 0;
        }

        .mini-player-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-player-artist {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        .mini-player-controls {
            display: flex;
            gap: 8px;
        }

        .mini-control-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mini-control-btn.play-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 42px;
            height: 42px;
            font-size: 18px;
        }

        .mini-player-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 0 0 12px 12px;
            overflow: hidden;
        }

        .mini-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.5);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 移动端头部 -->
        <div class="mobile-header">
            <h1>🎵 音乐</h1>
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
        </div>

        <!-- 遮罩层 -->
        <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

        <!-- 侧边菜单（移动端） -->
        <div class="side-menu" id="sideMenu">
            <div class="side-menu-header">
                <h2>🎵 我的音乐</h2>
                <button class="close-btn" onclick="toggleMenu()">✕</button>
            </div>
            <div class="side-menu-content">
                <div class="menu-section">
                    <div class="menu-section-title">音乐库</div>
                    <div class="menu-item active" onclick="switchTab('all'); toggleMenu();">
                        <span class="menu-item-icon">🎵</span>
                        <span>全部音乐</span>
                    </div>
                    <div class="menu-item" onclick="switchTab('favorites'); toggleMenu();">
                        <span class="menu-item-icon">❤️</span>
                        <span>我的收藏</span>
                    </div>
                </div>
                <div class="menu-section">
                    <div class="menu-section-title">功能</div>
                    <div class="menu-item" onclick="scanMusic(); toggleMenu();">
                        <span class="menu-item-icon">📂</span>
                        <span>扫描本地音乐</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 桌面端布局 -->
        <div class="desktop-layout" style="display: flex; flex: 1; overflow: hidden;">
            <!-- 侧边栏 -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <h2>🎵 本地音乐</h2>
                    <button class="scan-btn" onclick="scanMusic()">
                        📂 扫描本地音乐
                    </button>
                </div>
                
                <div class="tabs">
                    <div class="tab active" data-tab="all" onclick="switchTab('all')">🎵 全部</div>
                    <div class="tab" data-tab="favorites" onclick="switchTab('favorites')">❤️ 收藏</div>
                </div>
                
                <div class="playlist-container" id="playlistContainer">
                    <div class="empty-state" id="emptyState">
                        <div class="empty-state-icon">🎶</div>
                        <div class="empty-state-text">暂无音乐</div>
                        <div class="empty-state-hint">点击上方按钮扫描本地音乐</div>
                    </div>
                </div>
            </div>

            <!-- 主播放器 -->
            <div class="main-content">
                <div class="main-player">
                    <div class="mode-indicator" id="modeIndicator" onclick="cyclePlayMode()">
                        <span id="modeIcon">🔄</span>
                        <span id="modeText">顺序</span>
                    </div>

                    <div class="album-art-container">
                        <div class="album-art" id="albumArt">
                            🎵
                            <div class="vinyl-effect"></div>
                        </div>

                        <div class="song-info">
                            <div class="song-title" id="songTitle">等待选择音乐</div>
                            <div class="song-artist" id="songArtist">未知艺术家</div>
                        </div>

                        <div class="progress-container">
                            <div class="progress-bar" onclick="seekTo(event)">
                                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
                            </div>
                            <div class="time-display">
                                <span id="currentTime">0:00</span>
                                <span id="totalTime">0:00</span>
                            </div>
                        </div>

                        <div class="controls">
                            <button onclick="cyclePlayMode()">
                                <span id="modeBtnIcon">🔄</span>
                            </button>
                            <button onclick="prevTrack()">⏮️</button>
                            <button class="play-btn" id="playPauseBtn" onclick="togglePlay()">▶️</button>
                            <button onclick="nextTrack()">⏭️</button>
                            <button onclick="toggleShuffle()">
                                <span id="shuffleIcon">🔀</span>
                            </button>
                        </div>

                        <div class="volume-control">
                            <span class="volume-icon" onclick="toggleMute()">
                                <span id="volumeIcon">🔊</span>
                            </span>
                            <div class="volume-slider" onclick="setVolume(event)">
                                <div class="volume-fill" id="volumeFill" style="width: 70%;"></div>
                            </div>
                        </div>

                        <div class="lyrics-container" id="lyricsContainer">
                            <div class="lyric-line active">暂无歌词</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 移动端Mini播放器 -->
        <div class="mini-player" id="miniPlayer">
            <div class="mini-player-art">🎵</div>
            <div class="mini-player-info">
                <div class="mini-player-title" id="miniSongTitle">等待选择</div>
                <div class="mini-player-artist" id="miniSongArtist">未知艺术家</div>
            </div>
            <div class="mini-player-controls">
                <button class="mini-control-btn" onclick="prevTrack()">⏮️</button>
                <button class="mini-control-btn play-btn" onclick="togglePlay()">▶️</button>
                <button class="mini-control-btn" onclick="nextTrack()">⏭️</button>
            </div>
            <div class="mini-player-progress">
                <div class="mini-progress-fill" id="miniProgressFill" style="width: 0%;"></div>
            </div>
        </div>

        <!-- 移动端底部导航 -->
        <div class="mobile-nav">
            <div class="mobile-nav-items">
                <div class="mobile-nav-item active" data-view="player" onclick="showView('player')">
                    <div class="mobile-nav-item-icon">🎵</div>
                    <div class="mobile-nav-item-text">播放</div>
                </div>
                <div class="mobile-nav-item" data-view="playlist" onclick="showView('playlist')">
                    <div class="mobile-nav-item-icon">📋</div>
                    <div class="mobile-nav-item-text">歌单</div>
                </div>
                <div class="mobile-nav-item" onclick="scanMusic()">
                    <div class="mobile-nav-item-icon">📂</div>
                    <div class="mobile-nav-item-text">添加</div>
                </div>
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        let audio = document.getElementById('audioPlayer');
        let playlist = [];
        let currentIndex = -1;
        let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
        let playMode = 'sequence';
        let isShuffle = false;
        let originalPlaylist = [];
        let currentView = 'player';

        const playModes = {
            'sequence': { icon: '🔄', text: '顺序' },
            'shuffle': { icon: '🔀', text: '随机' },
            'single': { icon: '🔂', text: '单曲' }
        };

        audio.volume = 0.7;
        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('ended', handleEnded);
        audio.addEventListener('loadedmetadata', updateTotalTime);

        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            const overlay = document.getElementById('overlay');
            menu.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function scanMusic() {
            const input = document.createElement('input');
            input.type = 'file';
            input.multiple = true;
            input.accept = 'audio/*';
            input.onchange = (e) => processFiles(Array.from(e.target.files));
            input.click();
        }

        function processFiles(files) {
            files.forEach(file => {
                const url = URL.createObjectURL(file);
                const name = file.name.replace(/\.[^/.]+$/, '');
                const parts = name.split(' - ');
                
                let title = name, artist = '未知艺术家';
                if (parts.length >= 2) {
                    artist = parts[0].trim();
                    title = parts.slice(1).join(' - ').trim();
                }
                
                playlist.push({
                    title, artist, url, duration: 0,
                    favorited: favorites.includes(name)
                });
            });
            
            originalPlaylist = [...playlist];
            renderPlaylist();
        }

        function renderPlaylist() {
            const container = document.getElementById('playlistContainer');
            const emptyState = document.getElementById('emptyState');
            
            if (playlist.length === 0) {
                emptyState.style.display = 'flex';
                return;
            }
            
            emptyState.style.display = 'none';
            
            let filtered = playlist;
            if (document.querySelector('.tab.active')?.dataset.tab === 'favorites') {
                filtered = playlist.filter(s => s.favorited);
            }
            
            container.innerHTML = filtered.map((song, i) => {
                const idx = playlist.indexOf(song);
                const isPlaying = idx === currentIndex;
                return `
                    <div class="playlist-item ${isPlaying ? 'playing' : ''}" onclick="playSong(${idx})">
                        <div class="playlist-item-info">
                            <div class="playlist-item-icon">
                                ${isPlaying ? (audio.paused ? '▶️' : '🎵') : '🎵'}
                            </div>
                            <div class="playlist-item-details">
                                <div class="playlist-item-title">${song.title}</div>
                                <div class="playlist-item-artist">${song.artist}</div>
                                ${song.duration > 0 ? `<div class="playlist-item-duration">${formatTime(song.duration)}</div>` : ''}
                            </div>
                        </div>
                        <div class="playlist-item-actions">
                            <button class="action-btn favorite ${song.favorited ? 'active' : ''}" 
                                    onclick="event.stopPropagation(); toggleFavorite(${idx})">
                                ${song.favorited ? '❤️' : '🤍'}
                            </button>
                            <button class="action-btn" onclick="event.stopPropagation(); removeSong(${idx})">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function playSong(index) {
            if (index < 0 || index >= playlist.length) return;
            currentIndex = index;
            const song = playlist[index];
            
            audio.src = song.url;
            audio.play().catch(() => {});
            
            updateUI();
            renderPlaylist();
            loadLyrics();
        }

        function updateUI() {
            const song = playlist[currentIndex];
            if (!song) return;
            
            document.getElementById('songTitle').textContent = song.title;
            document.getElementById('songArtist').textContent = song.artist;
            document.getElementById('miniSongTitle').textContent = song.title;
            document.getElementById('miniSongArtist').textContent = song.artist;
            
            const playBtns = document.querySelectorAll('#playPauseBtn');
            playBtns.forEach(btn => btn.textContent = audio.paused ? '▶️' : '⏸️');
            
            const albumArt = document.getElementById('albumArt');
            albumArt.classList.toggle('spinning', !audio.paused);
        }

        function togglePlay() {
            if (currentIndex === -1 && playlist.length > 0) {
                playSong(0);
                return;
            }
            audio.paused ? audio.play() : audio.pause();
            updateUI();
            renderPlaylist();
        }

        function prevTrack() {
            currentIndex = currentIndex <= 0 ? playlist.length - 1 : currentIndex - 1;
            playSong(currentIndex);
        }

        function nextTrack() {
            currentIndex = isShuffle ? Math.floor(Math.random() * playlist.length) : (currentIndex + 1) % playlist.length;
            playSong(currentIndex);
        }

        function handleEnded() {
            if (playMode === 'single') {
                audio.currentTime = 0;
                audio.play();
            } else {
                nextTrack();
            }
        }

        function updateProgress() {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                document.getElementById('progressFill').style.width = percent + '%';
                document.getElementById('miniProgressFill').style.width = percent + '%';
                document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
                updateLyrics();
            }
        }

        function updateTotalTime() {
            const duration = audio.duration;
            document.getElementById('totalTime').textContent = formatTime(duration);
            if (playlist[currentIndex]) {
                playlist[currentIndex].duration = duration;
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            return `${Math.floor(seconds / 60)}:${Math.floor(seconds % 60).toString().padStart(2, '0')}`;
        }

        function seekTo(event) {
            const bar = event.currentTarget;
            const rect = bar.getBoundingClientRect();
            audio.currentTime = ((event.clientX - rect.left) / rect.width) * audio.duration;
        }

        function setVolume(event) {
            const slider = event.currentTarget;
            const rect = slider.getBoundingClientRect();
            audio.volume = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
            document.getElementById('volumeFill').style.width = (audio.volume * 100) + '%';
            updateVolumeIcon();
        }

        function toggleMute() {
            audio.muted = !audio.muted;
            document.getElementById('volumeIcon').textContent = audio.muted ? '🔇' : '🔊';
        }

        function updateVolumeIcon() {
            const vol = audio.volume;
            document.getElementById('volumeIcon').textContent = vol === 0 ? '🔇' : vol < 0.3 ? '🔈' : vol < 0.7 ? '🔉' : '🔊';
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('shuffleIcon').textContent = isShuffle ? '🔀' : '🔁';
            document.querySelector('[onclick="toggleShuffle()"]').classList.toggle('active', isShuffle);
            
            if (isShuffle) {
                originalPlaylist = [...playlist];
                for (let i = playlist.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [playlist[i], playlist[j]] = [playlist[j], playlist[i]];
                }
            } else {
                playlist = [...originalPlaylist];
            }
            renderPlaylist();
        }

        function cyclePlayMode() {
            const modes = ['sequence', 'shuffle', 'single'];
            const idx = modes.indexOf(playMode);
            playMode = modes[(idx + 1) % modes.length];
            
            const mode = playModes[playMode];
            document.getElementById('modeIcon').textContent = mode.icon;
            document.getElementById('modeText').textContent = mode.text;
            document.getElementById('modeBtnIcon').textContent = mode.icon;
        }

        function toggleFavorite(index) {
            const song = playlist[index];
            song.favorited = !song.favorited;
            
            if (song.favorited) favorites.push(song.title);
            else favorites = favorites.filter(f => f !== song.title);
            
            localStorage.setItem('favorites', JSON.stringify(favorites));
            renderPlaylist();
        }

        function removeSong(index) {
            if (index === currentIndex) {
                audio.pause();
                currentIndex = -1;
            }
            playlist.splice(index, 1);
            if (currentIndex > index) currentIndex--;
            else if (currentIndex === index) currentIndex = -1;
            renderPlaylist();
            updateUI();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`)?.classList.add('active');
            renderPlaylist();
        }

        function loadLyrics() {
            const lyrics = [
                '♪ 音乐播放中 ♪',
                '享受美好时光',
                '让旋律环绕',
                '沉浸在音乐世界',
                '感受每一个音符',
                '跟随节奏摇摆',
                '让心灵放松',
                '♪ 继续播放 ♪'
            ];
            
            document.getElementById('lyricsContainer').innerHTML = lyrics.map((line, i) => 
                `<div class="lyric-line ${i === 0 ? 'active' : ''}" onclick="seekToLyric(${i})">${line}</div>`
            ).join('');
        }

        function updateLyrics() {
            const lines = document.querySelectorAll('.lyric-line');
            const progress = audio.currentTime / (audio.duration || 1);
            const idx = Math.floor(progress * lines.length);
            
            lines.forEach((line, i) => line.classList.toggle('active', i === idx));
            document.querySelector('.lyric-line.active')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function seekToLyric(index) {
            const lines = document.querySelectorAll('.lyric-line');
            audio.currentTime = (index / lines.length) * audio.duration;
        }

        function showView(view) {
            currentView = view;
            document.querySelectorAll('.mobile-nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.view === view);
            });
            
            const desktopLayout = document.querySelector('.desktop-layout');
            if (view === 'playlist') {
                desktopLayout.style.display = 'flex';
            } else {
                if (window.innerWidth <= 768) {
                    desktopLayout.style.display = 'none';
                }
            }
        }

        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'Space': e.preventDefault(); togglePlay(); break;
                case 'ArrowLeft': audio.currentTime -= 10; break;
                case 'ArrowRight': audio.currentTime += 10; break;
                case 'ArrowUp': audio.volume = Math.min(1, audio.volume + 0.1); document.getElementById('volumeFill').style.width = (audio.volume * 100) + '%'; break;
                case 'ArrowDown': audio.volume = Math.max(0, audio.volume - 0.1); document.getElementById('volumeFill').style.width = (audio.volume * 100) + '%'; break;
            }
        });

        renderPlaylist();
    </script>
</body>
</html>
