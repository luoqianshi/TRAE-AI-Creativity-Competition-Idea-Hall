      <!-- Happy paws raised -->
      <ellipse cx="65" cy="155" rx="14" ry="10" fill="#FFBC82" transform="rotate(-15,65,155)"/>
      <ellipse cx="65" cy="157" rx="10" ry="7" fill="#FFE8D0" transform="rotate(-15,65,157)"/>
      <ellipse cx="135" cy="155" rx="14" ry="10" fill="#FFBC82" transform="rotate(15,135,155)"/>
      <ellipse cx="135" cy="157" rx="10" ry="7" fill="#FFE8D0" transform="rotate(15,135,157)"/>
      <!-- Stars -->
      <text x="40" y="65" font-size="14" opacity="0.6">✨</text>
      <text x="145" y="55" font-size="12" opacity="0.5">✨</text>
      <text x="155" y="75" font-size="10" opacity="0.4">⭐</text>
    </svg>
  </div>
  <div class="cele-text" id="celeText">太棒了！你们之间的冰，裂开了一点点</div>
  <div class="cele-sub">牵牵为你骄傲。明天也试试看好吗？</div>
  <button class="cele-close" onclick="closeCele()">我知道了 ❤️</button>
</div>

<!-- Confetti -->
<div class="confetti-box" id="confettiBox"></div>

<script>
// ====== State ======
let thermo = 32;
let done = false;
let emotion = 'sad';

// ====== SVG Animations ======
const svg = document.getElementById('petSvg');
const blinkGroup = document.getElementById('blinkGroup');
const petMouth = document.getElementById('petMouth');
const eyesGroup = document.getElementById('eyesGroup');
const tailPath = document.getElementById('tailPath');
const petBody = document.getElementById('petBody');
const petHead = document.getElementById('petHead');

// Breathing animation
let breathAnim;
function startBreathing() {
  breathAnim = svg.querySelector('#petBody') || document.createElementNS('http://www.w3.org/2000/svg', 'animateTransform');
  // Add breathing via JS
  let t = 0;
  function breathe() {
    t += 0.03;
    const s = 1 + Math.sin(t) * 0.015;
    const ty = Math.sin(t) * 1;
    petBody.style.transform = `translateY(${ty}px) scaleY(${s})`;
    requestAnimationFrame(breathe);
  }
  breathe();
}

// Tail wagging
let tailT = 0;
function wagTail() {
  tailT += 0.06;
  const angle = Math.sin(tailT) * 8;
  document.getElementById('petTail').style.transform = `rotate(${angle}deg)`;
  document.getElementById('petTail').style.transformOrigin = '130px 145px';
  requestAnimationFrame(wagTail);
}

// Blinking
function blink() {
  blinkGroup.setAttribute('opacity', '1');
  eyesGroup.setAttribute('opacity', '0');
  setTimeout(() => {
    blinkGroup.setAttribute('opacity', '0');
    eyesGroup.setAttribute('opacity', '1');
  }, 150);
  setTimeout(blink, 2500 + Math.random() * 2000);
}
setTimeout(blink, 1500);

// Ear twitch
function twitchEar() {
  const ear = Math.random() > 0.5 ? 'earL' : 'earR';
  const el = document.getElementById(ear);
  const angle = Math.random() > 0.5 ? -8 : 8;
  el.style.transition = 'transform 0.15s ease';
  el.style.transform = `rotate(${angle}deg)`;
  el.style.transformOrigin = ear === 'earL' ? '72px 95px' : '128px 95px';
  setTimeout(() => {
    el.style.transform = 'rotate(0deg)';
  }, 200);
  setTimeout(twitchEar, 3000 + Math.random() * 4000);
}
setTimeout(twitchEar, 2000);

// Init
startBreathing();
wagTail();

// ====== Emotion Switch ======
function setEmotion(state) {
  emotion = state;
  const icon = document.getElementById('emoIcon');
  const text = document.getElementById('emoText');
  const sub = document.getElementById('emoSub');
  const bar = document.getElementById('emoBar');

  if (state === 'happy') {
    icon.textContent = '😊';
    text.textContent = '情绪温度：开心了一点';
    sub.textContent = '牵牵感觉你的心情好起来了~';
    bar.style.background = 'linear-gradient(to top, #7ECBA1, #B8E6CC)';
    // Happy mouth
    petMouth.setAttribute('d', 'M 90 98 Q 95 108 100 108 Q 105 108 110 98');
    petMouth.setAttribute('fill', '#FFB0A0');
  } else if (state === 'neutral') {
    icon.textContent = '🙂';
    text.textContent = '情绪温度：平静';
    sub.textContent = '牵牵在陪着你呢';
    bar.style.background = 'linear-gradient(to top, var(--accent2), #FFD4A8)';
    // Neutral mouth
    petMouth.setAttribute('d', 'M 92 100 Q 100 104 108 100');
    petMouth.setAttribute('fill', 'none');
  } else {
    icon.textContent = '😟';
    text.textContent = '情绪温度：有点低落';
    sub.textContent = '牵牵感受到了你的不开心...';
    bar.style.background = 'linear-gradient(to top, var(--accent), var(--pink))';
    // Sad mouth
    petMouth.setAttribute('d', 'M 90 98 Q 95 103 100 102 Q 105 103 110 98');
    petMouth.setAttribute('fill', 'none');
  }
}

// ====== Mic ======
function toggleMic() {
  const btn = document.getElementById('micBtn');
  const hint = document.getElementById('micHint');
  btn.classList.toggle('recording');
  if (btn.classList.contains('recording')) {
    hint.textContent = '正在听...说完了再点一下';
    // Simulate voice detection -> trigger response after a moment
    setTimeout(() => {
      if (btn.classList.contains('recording')) {
        btn.classList.remove('recording');
        hint.textContent = '点击说话，牵牵在听~';
        respondToVoice();
      }
    }, 3000);
  } else {
    hint.textContent = '点击说话，牵牵在听~';
  }
}

function respondToVoice() {
  const responses = [
    '谢谢你愿意告诉牵牵。<br>牵牵听到了，你今天确实很辛苦。<br><br>试试<span class="hl">今晚和爸爸说"今天好累"</span>？<br>就这一句就好。',
    '牵牵一直在听你说话呢。<br>不管是什么事，牵牵都不会评判你。<br><br>试试<span class="hl">给妈妈倒一杯水</span>吧？<br>不用说话，倒水就好。',
    '牵牵懂你的感觉。<br>不是你的错，你不需要一个人扛着。<br><br>试试<span class="hl">对爸妈笑一下</span>就好。<br>笑不出来也没关系。',
  ];
  const bubble = document.getElementById('chatBubble');
  const r = responses[Math.floor(Math.random() * responses.length)];
  bubble.style.animation = 'none';
  bubble.offsetHeight;
  bubble.innerHTML = r;
  bubble.style.animation = 'bubbleIn 0.5s ease';
}

// ====== Complete Task ======
function completeTask() {
  if (done) return;
  done = true;
  const btn = document.getElementById('taskBtn');
  btn.textContent = '已完成 ✨';
  btn.classList.add('done');

  thermo = Math.min(thermo + 8, 100);
  document.getElementById('thermoFill').style.width = thermo + '%';
  document.getElementById('thermoVal').textContent = thermo + '°C';

  setEmotion('happy');
  showCele();
}

// ====== Celebration ======
function showCele() {
  document.getElementById('celeOverlay').classList.add('show');
  launchConfetti();
}
function closeCele() {
  document.getElementById('celeOverlay').classList.remove('show');
}
function launchConfetti() {
  const box = document.getElementById('confettiBox');
  box.innerHTML = '';
  const colors = ['#FF8C69', '#FFB088', '#FFD6E0', '#E8D8F8', '#D4F0E0', '#FFACC7'];
  for (let i = 0; i < 50; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-p';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDelay = Math.random() * 2 + 's';
    p.style.animationDuration = (2 + Math.random() * 2) + 's';
    p.style.width = (5 + Math.random() * 7) + 'px';
    p.style.height = (5 + Math.random() * 7) + 'px';
    p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    box.appendChild(p);
  }
  setTimeout(() => { box.innerHTML = ''; }, 4000);
}
</script>

</body>
</html>
