// ===== UTILITY =====
function formatYear(y) {
  if (y < 0) return `公元前${Math.abs(y)}年`;
  if (y === 0) return `公元元年`;
  if (y === 1) return `公元1年`;
  return `${y}年`;
}

function getEra(year) {
  const eras = getEras();
  return eras.find(e => year >= e.start && year < e.end) || eras[eras.length - 1];
}

function getVisibleEvents(year) {
  const range = 40;
  return EVENTS.filter(e =>
    Math.abs(e.year - year) <= range &&
    activeCategories[e.category]
  ).sort((a, b) => a.year - b.year);
}

function yearToPercent(year) {
  return ((year - (-3000)) / (2000 - (-3000))) * 100;
}

function getCSSVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

// ===== BACKGROUND CANVAS =====
function initBackground() {
  const container = document.getElementById('bg-container');
  container.innerHTML = '';

  if (bgCanvas) {
    cancelAnimationFrame(animFrameId);
  }

  bgCanvas = document.createElement('canvas');
  bgCanvas.style.position = 'absolute';
  bgCanvas.style.top = '0';
  bgCanvas.style.left = '0';
  bgCanvas.style.width = '100%';
  bgCanvas.style.height = '100%';
  container.appendChild(bgCanvas);

  function resize() {
    bgCanvas.width = window.innerWidth;
    bgCanvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  bgCtx = bgCanvas.getContext('2d');
  const bgType = getCSSVar('--bg-canvas-type') || 'stars';

  if (bgType === 'stars' || currentTheme === 'dark') {
    initStars();
    animateStars();
  } else if (bgType === 'parchment' || currentTheme === 'parchment') {
    initParchmentTexture();
    drawParchment();
  } else {
    // Lineart - paper grid
    drawPaperTexture();
  }
}

function initStars() {
  stars = [];
  for (let i = 0; i < 300; i++) {
    stars.push({
      x: Math.random() * bgCanvas.width,
      y: Math.random() * bgCanvas.height,
      r: Math.random() * 1.2 + 0.2,
      opacity: Math.random() * 0.6 + 0.2,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      twinklePhase: Math.random() * Math.PI * 2
    });
  }
}

function animateStars(t) {
  if (currentTheme !== 'dark') return;
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

  // Nebula glows
  const grad1 = bgCtx.createRadialGradient(
    bgCanvas.width * 0.2, bgCanvas.height * 0.5, 0,
    bgCanvas.width * 0.2, bgCanvas.height * 0.5, bgCanvas.width * 0.4
  );
  grad1.addColorStop(0, 'rgba(60, 80, 160, 0.08)');
  grad1.addColorStop(1, 'transparent');
  bgCtx.fillStyle = grad1;
  bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

  const grad2 = bgCtx.createRadialGradient(
    bgCanvas.width * 0.8, bgCanvas.height * 0.2, 0,
    bgCanvas.width * 0.8, bgCanvas.height * 0.2, bgCanvas.width * 0.3
  );
  grad2.addColorStop(0, 'rgba(100, 60, 140, 0.06)');
  grad2.addColorStop(1, 'transparent');
  bgCtx.fillStyle = grad2;
  bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

  // Draw twinkling stars
  const time = t || 0;
  stars.forEach(s => {
    const alpha = s.opacity + Math.sin(time * s.twinkleSpeed + s.twinklePhase) * 0.2;
    bgCtx.beginPath();
    bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    bgCtx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.05, alpha)})`;
    bgCtx.fill();
  });

  animFrameId = requestAnimationFrame(animateStars);
}

function drawPaperTexture() {
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  // Subtle grid pattern for lineart theme
  bgCtx.strokeStyle = 'rgba(0,0,0,0.008)';
  bgCtx.lineWidth = 1;
  for (let x = 0; x < bgCanvas.width; x += 3) {
    bgCtx.beginPath();
    bgCtx.moveTo(x, 0);
    bgCtx.lineTo(x, bgCanvas.height);
    bgCtx.stroke();
  }
  for (let y = 0; y < bgCanvas.height; y += 3) {
    bgCtx.beginPath();
    bgCtx.moveTo(0, y);
    bgCtx.lineTo(bgCanvas.width, y);
    bgCtx.stroke();
  }
}

function initParchmentTexture() {
  parchmentFibers = [];
  for (let i = 0; i < 800; i++) {
    parchmentFibers.push({
      x: Math.random() * bgCanvas.width,
      y: Math.random() * bgCanvas.height,
      len: Math.random() * 3 + 1,
      angle: Math.random() * Math.PI,
      alpha: Math.random() * 0.08 + 0.02,
      width: Math.random() * 0.5 + 0.3
    });
  }
}

function drawParchment() {
  if (currentTheme !== 'parchment') return;
  const w = bgCanvas.width, h = bgCanvas.height;
  bgCtx.clearRect(0, 0, w, h);

  // Vignette
  const vignettes = [
    { x: 0, y: 0, r: w * 0.5, a: 0.18 },
    { x: w, y: 0, r: w * 0.5, a: 0.18 },
    { x: 0, y: h, r: w * 0.5, a: 0.15 },
    { x: w, y: h, r: w * 0.5, a: 0.15 }
  ];
  vignettes.forEach(v => {
    const g = bgCtx.createRadialGradient(v.x, v.y, 0, v.x, v.y, v.r);
    g.addColorStop(0, `rgba(120,80,30,${v.a})`);
    g.addColorStop(1, 'transparent');
    bgCtx.fillStyle = g;
    bgCtx.fillRect(0, 0, w, h);
  });

  // Age stains
  for (let i = 0; i < 20; i++) {
    const x = Math.random() * w;
    const y = Math.random() * h;
    const r = Math.random() * 40 + 10;
    const g = bgCtx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(140,90,30,${Math.random() * 0.05 + 0.01})`);
    g.addColorStop(1, 'transparent');
    bgCtx.fillStyle = g;
    bgCtx.beginPath();
    bgCtx.arc(x, y, r, 0, Math.PI * 2);
    bgCtx.fill();
  }

  // Fiber specks
  parchmentFibers.forEach(f => {
    bgCtx.beginPath();
    bgCtx.moveTo(f.x, f.y);
    bgCtx.lineTo(f.x + Math.cos(f.angle) * f.len, f.y + Math.sin(f.angle) * f.len);
    bgCtx.strokeStyle = `rgba(107, 66, 38, ${f.alpha})`;
    bgCtx.lineWidth = f.width;
    bgCtx.stroke();
  });
}

// ===== THEME SWITCHING =====
function setTheme(theme) {
  currentTheme = theme;
  document.documentElement.setAttribute('data-theme', theme);

  // Update theme buttons
  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.classList.remove('active');
    btn.style.background = '';
    btn.style.color = '';
    btn.style.border = '';
    btn.style.width = '';
    btn.style.height = '';
    btn.style.marginTop = '';
    btn.style.fontSize = '';
  });
  const activeBtn = document.querySelector(`[data-theme-btn="${theme}"]`);
  if (activeBtn) activeBtn.classList.add('active');

  // Show/hide compass rose
  document.getElementById('compass-rose').style.display = theme === 'parchment' ? 'block' : 'none';

  // Update title font variant for parchment
  const title = document.getElementById('app-title');
  if (theme === 'parchment') {
    title.style.fontVariant = 'small-caps';
  } else {
    title.style.fontVariant = '';
  }

  // Reinitialize background
  setTimeout(() => {
    initBackground();
  }, 50);

  // Rebuild globe with new theme
  if (world) {
    rebuildGlobe();
  }

  // Rebuild legend and update UI colors
  buildLegend();
  updateTimelineUI();
  updateGlobe();

  // Update 2D map filter
  const map2dImg = document.getElementById('map2d-img');
  const mapFilter = getCSSVar('--map2d-filter');
  if (mapFilter) {
    map2dImg.style.filter = mapFilter;
  } else {
    map2dImg.style.filter = theme === 'lineart' ? 'grayscale(1) contrast(1.1)' : '';
  }
}

function rebuildGlobe() {
  const container = document.getElementById('globeViz');
  const pointOfView = world ? world.pointOfView() : { lat: 20, lng: 50, altitude: 2.5 };

  // Remove old canvas
  container.innerHTML = '';
  world = null;

  setTimeout(() => {
    initGlobe();
    if (world) {
      world.pointOfView(pointOfView, 0);
    }
  }, 100);
}

// ===== GLOBE INITIALIZATION =====
function initGlobe() {
  try {
    const container = document.getElementById('globeViz');
    const theme = currentTheme;
    const styles = getComputedStyle(document.documentElement);

    const earthImg = (styles.getPropertyValue('--earth-image') || 'https://unpkg.com/three-globe@2.31.0/example/img/earth-dark.jpg').replace(/['"]/g, '');
    const bumpImg = (styles.getPropertyValue('--earth-bump') || '').replace(/['"]/g, '');
    const showAtmosphere = styles.getPropertyValue('--atmosphere').trim() === 'true';
    const atmoColor = (styles.getPropertyValue('--atmosphere-color') || 'rgba(212,168,83,0.35)').trim();
    const showGraticules = styles.getPropertyValue('--graticules').trim() === 'true';
    const graticuleColor = (styles.getPropertyValue('--graticule-color') || '#000000').replace(/['"]/g, '');
    const matColor = (styles.getPropertyValue('--earth-material-color') || '').replace(/['"]/g, '');
    const bgColor = theme === 'dark' ? 'rgba(0,0,0,0)' : (theme === 'parchment' ? 'rgba(240,228,200,0)' : '#ffffff');

    const cats = getCategoryConfig();

    world = Globe()(container)
      .globeImageUrl(earthImg)
      .showAtmosphere(showAtmosphere)
      .backgroundColor(bgColor)
      .pointsData([])
      .pointLat('lat')
      .pointLng('lng')
      .pointColor(d => cats[d.category].color)
      .pointRadius(0.6)
      .pointAltitude(0.015)
      .pointLabel(d => {
        const isParchment = theme === 'parchment';
        const isLineart = theme === 'lineart';
        return `<div class="globe-tooltip">
          <div style="font-weight:600;margin-bottom:2px;${isParchment ? "font-family:'IM Fell English SC','Noto Serif SC',serif;" : ''}">${d.title}</div>
          <div style="font-size:11px;color:var(--color-primary);${isParchment ? "font-family:'IM Fell English SC',serif;" : ''}">${formatYear(d.year)}</div>
        </div>`;
      })
      .onPointClick((event, d) => {
        showEventPopup(d);
        focusOnEvent(d);
      })
      .pointResolution(32);

    if (bumpImg) {
      try { world.bumpImageUrl(bumpImg); } catch(e) {}
    }
    if (showAtmosphere && typeof world.atmosphereColor === 'function') {
      try { world.atmosphereColor(atmoColor); world.atmosphereAltitude(0.22); } catch(e) {}
    }
    if (showGraticules) {
      try {
        world.showGraticules(true);
        if (typeof world.graticuleColor === 'function') {
          world.graticuleColor(graticuleColor);
        }
      } catch(e) {}
    }

    // Customize material
    try {
      const mat = world.globeMaterial();
      if (mat) {
        if (theme === 'lineart' && matColor) {
          if (mat.color) mat.color.set(matColor);
          if (mat.emissive) mat.emissive.set('#000000');
        }
        if (theme === 'parchment' && matColor) {
          if (mat.color) mat.color.set(matColor);
          if (mat.emissive) { mat.emissive.set('#1a1005'); mat.emissiveIntensity = 0.15; }
        }
      }
    } catch(e) {}

    world.controls().autoRotate = false;
    world.controls().enableDamping = true;
    world.controls().dampingFactor = 0.08;
    world.controls().minDistance = 180;
    world.controls().maxDistance = 500;

    function resize() {
      if (world) { world.width(window.innerWidth); world.height(window.innerHeight); }
    }
    resize();
    window.addEventListener('resize', resize);

    world.pointOfView({ lat: 20, lng: 50, altitude: 2.5 }, 0);
  } catch(err) {
    console.error('Globe init error:', err);
  } finally {
    setTimeout(() => {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(() => { loading.style.display = 'none'; }, 600);
      }
      updateGlobe();
    }, 800);
  }
}

// ===== UPDATE GLOBE =====
function updateGlobe() {
  if (!world) return;
  const events = getVisibleEvents(currentYear);
  const cats = getCategoryConfig();
  world.pointData(events);
  world.pointColor(d => cats[d.category].color);

  world.pointAltitude(d => {
    const dist = Math.abs(d.year - currentYear);
    if (dist < 10) return 0.04;
    if (dist < 30) return 0.02;
    return 0.008;
  });
  world.pointRadius(d => {
    const dist = Math.abs(d.year - currentYear);
    if (dist < 10) return 0.8;
    if (dist < 30) return 0.5;
    return 0.3;
  });

  if (viewMode === '2d') update2DMap();
  updateEventList(events);
  updateTimelineUI();
}

// ===== TIMELINE UI =====
function updateTimelineUI() {
  document.getElementById('current-year').textContent = formatYear(currentYear);
  const era = getEra(currentYear);
  const eraEl = document.getElementById('current-era');
  eraEl.textContent = era.name;
  eraEl.style.color = era.color;

  // Update slider track background for current theme eras
  if (currentTheme !== 'lineart') {
    const eras = getEras();
    const totalRange = 2000 - (-3000);
    const stops = [];
    eras.forEach(e => {
      const startPct = ((e.start - (-3000)) / totalRange) * 100;
      const endPct = ((e.end - (-3000)) / totalRange) * 100;
      stops.push(`${e.color} ${startPct}%`, `${e.color} ${endPct}%`);
    });
    document.getElementById('timeline').style.background = `linear-gradient(to right, ${stops.join(',')})`;
  }

  const events = getVisibleEvents(currentYear);
  document.getElementById('event-count').textContent = events.length > 0 ? `显示 ${events.length} 个事件` : '该时期无重大事件';
}

function buildEraTicks() {
  const container = document.getElementById('era-ticks');
  container.innerHTML = '';
  ERA_TICKS.forEach(tick => {
    const el = document.createElement('div');
    el.className = 'era-tick';
    el.style.left = yearToPercent(tick.year) + '%';
    el.innerHTML = `<div class="tick-year">${tick.year < 0 ? '前' + Math.abs(tick.year) : tick.year}</div><div class="tick-label">${tick.label}</div>`;
    el.onclick = () => {
      document.getElementById('timeline').value = tick.year;
      setYear(tick.year);
    };
    container.appendChild(el);
  });
}

// ===== LEGEND =====
function buildLegend() {
  const container = document.getElementById('legend-items');
  container.innerHTML = '';
  const cats = getCategoryConfig();
  const theme = currentTheme;

  Object.entries(cats).forEach(([key, cat]) => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;';

    let markerHtml = '';
    if (theme === 'lineart') {
      // Shape symbols
      markerHtml = `<span class="legend-marker" data-cat="${key}" onclick="toggleCategory('${key}')" style="width:14px;text-align:center;font-size:12px;line-height:1;color:#000;">${cat.shape}</span>`;
    } else if (theme === 'parchment') {
      // Diamond swatches
      markerHtml = `<div class="legend-marker" data-cat="${key}" style="width:12px;height:12px;background:${cat.color};border:1px solid ${cat.color};transform:rotate(45deg);flex-shrink:0;cursor:pointer;" onclick="toggleCategory('${key}')"></div>`;
    } else {
      // Colored dots
      markerHtml = `<div class="legend-marker" data-cat="${key}" style="width:10px;height:10px;border-radius:50%;background:${cat.color};flex-shrink:0;cursor:pointer;transition:opacity 0.15s;" onclick="toggleCategory('${key}')"></div>`;
    }

    row.innerHTML = `
      ${markerHtml}
      <span class="legend-label" data-cat="${key}" onclick="toggleCategory('${key}')">${cat.label}</span>
    `;
    container.appendChild(row);

    if (!activeCategories[key]) {
      row.querySelector('.legend-marker').classList.add('dimmed');
      row.querySelector('.legend-label').classList.add('dimmed');
    }
  });
}

function toggleCategory(cat) {
  activeCategories[cat] = !activeCategories[cat];
  document.querySelectorAll(`[data-cat="${cat}"]`).forEach(el => {
    el.classList.toggle('dimmed', !activeCategories[cat]);
  });
  updateGlobe();
}

// ===== EVENT LIST =====
function updateEventList(events) {
  const list = document.getElementById('event-list');
  const theme = currentTheme;
  if (events.length === 0) {
    list.innerHTML = '<div style="padding:24px 16px;text-align:center;color:var(--text-dim);font-size:12px;">拖动时间轴查看更多事件</div>';
    return;
  }
  list.innerHTML = events.map(e => {
    const cats = getCategoryConfig();
    const shapePrefix = (theme === 'lineart') ? `${cats[e.category].shape} ` : '';
    return `
    <div class="event-item ${selectedEvent === e.id ? 'active' : ''}" onclick="selectEvent(${e.id})">
      <div class="event-item-title">${shapePrefix}${e.title}</div>
      <div>
        <span class="event-item-year">${formatYear(e.year)}</span>
        <span class="event-item-cat">${cats[e.category].label}</span>
      </div>
    </div>
  `;
  }).join('');
}

function selectEvent(id) {
  const event = EVENTS.find(e => e.id === id);
  if (!event) return;
  selectedEvent = id;
  showEventPopup(event);
  focusOnEvent(event);
  updateGlobe();
}

function focusOnEvent(event) {
  if (!world) return;
  world.pointOfView({ lat: event.lat, lng: event.lng, altitude: 1.8 }, 1200);
}

// ===== EVENT POPUP =====
function showEventPopup(event) {
  const popup = document.getElementById('event-popup');
  const cats = getCategoryConfig();
  const cat = cats[event.category];
  document.getElementById('popup-tag').innerHTML = `<span class="tag tag-${event.category}">${cat.label}</span>`;
  document.getElementById('popup-title').textContent = event.title;
  document.getElementById('popup-year').textContent = formatYear(event.year);
  document.getElementById('popup-desc').textContent = event.desc;
  popup.style.display = 'block';

  const isMobile = window.innerWidth < 768;
  if (isMobile) {
    popup.style.left = '50%';
    popup.style.top = '50%';
    popup.style.transform = 'translate(-50%, -50%)';
  } else {
    popup.style.right = '20px';
    popup.style.top = '50%';
    popup.style.transform = 'translateY(-50%)';
    popup.style.left = 'auto';
    popup.style.bottom = 'auto';
  }
}

function closePopup() {
  document.getElementById('event-popup').style.display = 'none';
  selectedEvent = null;
  updateGlobe();
}

// ===== 2D / 3D VIEW MODE =====
function setViewMode(mode) {
  viewMode = mode;
  document.getElementById('btn-3d').classList.toggle('active', mode === '3d');
  document.getElementById('btn-2d').classList.toggle('active', mode === '2d');
  if (!world) return;

  const globeViz = document.getElementById('globeViz');
  const map2d = document.getElementById('map2d');

  // Update 2D map image
  const styles = getComputedStyle(document.documentElement);
  const earthImg = (styles.getPropertyValue('--earth-image') || '').replace(/['"]/g, '');
  const mapFilter = styles.getPropertyValue('--map2d-filter');
  const map2dImg = document.getElementById('map2d-img');
  map2dImg.style.backgroundImage = `url('${earthImg}')`;
  if (mapFilter) map2dImg.style.filter = mapFilter;

  if (mode === '2d') {
    world.controls().autoRotate = false;
    map2d.style.display = 'block';
    map2d.style.opacity = '1';
    globeViz.classList.remove('folding');
    map2d.classList.remove('folding');
    void globeViz.offsetWidth;
    void map2d.offsetWidth;
    globeViz.classList.add('unfolding');
    map2d.classList.add('unfolding');
    update2DMap();
    setTimeout(() => {
      globeViz.style.display = 'none';
      globeViz.classList.remove('unfolding');
      globeViz.style.transform = '';
      globeViz.style.opacity = '';
      map2d.classList.remove('unfolding');
    }, 1000);
  } else {
    globeViz.style.display = 'block';
    globeViz.style.opacity = '1';
    globeViz.classList.remove('unfolding');
    map2d.classList.remove('unfolding');
    void globeViz.offsetWidth;
    void map2d.offsetWidth;
    globeViz.classList.add('folding');
    map2d.classList.add('folding');
    if (world) world.pointOfView({ lat: 20, lng: world.pointOfView().lng, altitude: 2.5 }, 1000);
    setTimeout(() => {
      map2d.style.display = 'none';
      map2d.style.opacity = '0';
      map2d.classList.remove('folding');
      globeViz.classList.remove('folding');
      globeViz.style.transform = '';
      globeViz.style.opacity = '';
    }, 1000);
  }
}

function update2DMap() {
  if (viewMode !== '2d') return;
  const container = document.getElementById('map2d-points');
  if (!container) return;
  const events = getVisibleEvents(currentYear);
  const cats = getCategoryConfig();
  let html = '';
  events.forEach(e => {
    const x = ((e.lng + 180) / 360) * 100;
    const y = ((90 - e.lat) / 180) * 100;
    const color = cats[e.category].color;
    const dist = Math.abs(e.year - currentYear);
    const size = dist < 10 ? 14 : dist < 30 ? 10 : 7;
    const opacity = dist < 10 ? 1 : dist < 30 ? 0.8 : 0.5;
    const glow = dist < 10 ? '12px' : '4px';
    const borderColor = currentTheme === 'lineart' ? '#ffffff' : 'rgba(255,255,255,0.6)';
    html += `<div onclick="selectEvent(${e.id})" style="position:absolute;left:${x}%;top:${y}%;transform:translate(-50%,-50%);width:${size}px;height:${size}px;border-radius:50%;background:${color};opacity:${opacity};cursor:pointer;pointer-events:auto;box-shadow:0 0 ${glow} ${color};border:2px solid ${borderColor};transition:all 0.3s ease;" title="${e.title} (${formatYear(e.year)})"></div>`;
  });
  container.innerHTML = html;
}

// ===== PLAY/PAUSE =====
function togglePlay() {
  isPlaying = !isPlaying;
  document.getElementById('play-icon').textContent = isPlaying ? '⏸' : '▶';
  if (isPlaying) {
    playInterval = setInterval(() => {
      let newYear = currentYear + 5;
      if (newYear > 2000) newYear = -3000;
      document.getElementById('timeline').value = newYear;
      setYear(newYear);
    }, 120);
  } else {
    clearInterval(playInterval);
  }
}

// ===== SIDEBAR =====
function toggleSidebar() {
  sidebarCollapsed = !sidebarCollapsed;
  const sidebar = document.getElementById('sidebar');
  const toggle = document.getElementById('sidebar-toggle');
  sidebar.classList.toggle('collapsed', sidebarCollapsed);
  toggle.textContent = sidebarCollapsed ? '▶' : '◀';
}

// ===== SET YEAR =====
function setYear(year) {
  currentYear = parseInt(year);
  document.getElementById('timeline').value = currentYear;
  updateGlobe();
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', () => {
  initBackground();
  buildLegend();
  buildEraTicks();

  const timeline = document.getElementById('timeline');
  timeline.addEventListener('input', (e) => {
    if (isPlaying) togglePlay();
    setYear(e.target.value);
  });

  initGlobe();

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') { setYear(currentYear - 10); }
    if (e.key === 'ArrowRight') { setYear(currentYear + 10); }
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    if (e.key === 'Escape') { closePopup(); }
    // Theme shortcuts
    if (e.key === '1') setTheme('dark');
    if (e.key === '2') setTheme('lineart');
    if (e.key === '3') setTheme('parchment');
  });

  // Handle window resize for background
  window.addEventListener('resize', () => {
    setTimeout(() => initBackground(), 100);
  });
});
</script>
