<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>看断电 · 拍照识插座</title>
  <style>
    :root {
      --bg-primary: #f8f9fa;
      --bg-surface: #ffffff;
      --text-primary: #212529;
      --text-secondary: #6c757d;
      --accent: #4a6fa5;
      --success: #4ade80;
      --warning: #f97316;
      --danger: #ef4444;
      --border: #e9ecef;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
      --radius-lg: 16px;
      --radius-md: 12px;
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --font-title: 1.25rem;
      --font-body: 1rem;
      --transition: all 0.2s ease;
    }

    .dark-mode {
      --bg-primary: #121826;
      --bg-surface: #1e293b;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent: #60a5fa;
      --success: #34d399;
      --warning: #f97316;
      --danger: #f87171;
      --border: #334155;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: var(--spacing-lg) var(--spacing-md);
      transition: var(--transition);
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: var(--spacing-lg);
    }

    h1 {
      font-size: var(--font-title);
      font-weight: 700;
      margin-bottom: var(--spacing-xs);
      color: var(--text-primary);
    }

    .subtitle {
      font-size: var(--font-body);
      color: var(--text-secondary);
      font-weight: 400;
    }

    .card {
      background-color: var(--bg-surface);
      border-radius: var(--radius-lg);
      padding: var(--spacing-lg);
      box-shadow: var(--shadow-md);
      margin-bottom: var(--spacing-lg);
      transition: var(--transition);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: var(--spacing-md);
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }

    .card-title i {
      font-size: 1.2rem;
      color: var(--accent);
    }

    .status-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--spacing-md);
      border-radius: var(--radius-md);
      background-color: rgba(74, 111, 165, 0.06);
      margin: var(--spacing-md) 0;
      border: 1px solid var(--border);
    }

    .status-icon {
      font-size: 3.5rem;
      margin-bottom: var(--spacing-md);
      color: var(--accent);
      transition: var(--transition);
    }

    .status-text {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: var(--spacing-xs);
      text-align: center;
    }

    .status-detail {
      font-size: 0.9rem;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: var(--spacing-md);
    }

    .time-indicator {
      font-size: 1.25rem;
      font-weight: 700;
      margin: var(--spacing-md) 0;
      min-height: 1.5rem;
      text-align: center;
    }

    .time-safe { color: var(--success); }
    .time-warning { color: var(--warning); }
    .time-danger { color: var(--danger); }

    .slider-container {
      margin: var(--spacing-md) 0;
      padding: var(--spacing-sm) 0;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      background: var(--border);
      border-radius: 4px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: var(--spacing-xs);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: var(--spacing-md);
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }

    .btn:hover:not(:disabled) {
      background-color: #3a5ca5;
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .theme-toggle {
      position: fixed;
      top: var(--spacing-md);
      right: var(--spacing-md);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      z-index: 100;
      transition: var(--transition);
    }

    .theme-toggle:hover {
      transform: scale(1.05);
    }

    .theme-toggle i {
      font-size: 1.2rem;
      color: var(--text-primary);
    }

    .instructions {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-top: var(--spacing-md);
      line-height: 1.5;
    }

    .instructions ul {
      padding-left: 1.2rem;
      margin-top: var(--spacing-xs);
    }

    .instructions li {
      margin-bottom: var(--spacing-xs);
    }

    /* Responsive */
    @media (max-width: 480px) {
      body {
        padding: var(--spacing-md);
      }
      .card {
        padding: var(--spacing-md);
      }
      h1 {
        font-size: 1.15rem;
      }
      .status-icon {
        font-size: 3rem;
      }
      .time-indicator {
        font-size: 1.15rem;
      }
    }

    /* Animation */
    @keyframes pulse {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }
    .pulse {
      animation: pulse 2s infinite;
    }

    /* Fake image container */
    .socket-preview {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
      border-radius: var(--radius-md);
      margin: var(--spacing-md) 0;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .socket-preview::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120px;
      height: 80px;
      background: #fff;
      border-radius: 8px;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.08);
    }

    .socket-preview::after {
      content: "🔌";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.5rem;
      z-index: 1;
    }

    .socket-active::after {
      content: "💡";
      color: var(--accent);
      animation: pulse 2.5s infinite;
    }

    .socket-inactive::after {
      content: "🔌";
      color: var(--text-secondary);
    }

    .footer-note {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: var(--spacing-lg);
      padding-top: var(--spacing-md);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="theme-toggle" id="themeToggle">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </div>

  <div class="container">
    <header>
      <h1>看断电</h1>
      <p class="subtitle">拍一张插座照片，AI自动判断是否该拔线</p>
    </header>

    <main>
      <section class="card">
        <h2 class="card-title">📸 拍照识别状态</h2>
        <div class="socket-preview socket-active" id="socketPreview"></div>
        <div class="status-display">
          <div class="status-icon">⚡</div>
          <div class="status-text">插座已通电</div>
          <div class="status-detail">插头插入 · 指示灯亮起</div>
          <div class="time-indicator time-warning" id="timeIndicator">已持续通电 <strong>142</strong> 分钟</div>
        </div>
        <button class="btn" id="captureBtn">重新拍照识别</button>
      </section>

      <section class="card">
        <h2 class="card-title">⏱️ 调整充电时长阈值</h2>
        <p class="instructions">
          拖动滑块设定「建议拔除」的最长时间（默认120分钟），AI将据此给出提醒：
        </p>
        <div class="slider-container">
          <input type="range" id="timeSlider" min="1" max="240" value="142">
          <div class="slider-labels">
            <span>1分钟</span>
            <span>120分钟</span>
            <span>240分钟</span>
          </div>
        </div>
        <div class="instructions">
          <ul>
            <li><span class="time-safe">✓ 安全区间</span>：≤120分钟（电池无负担）</li>
            <li><span class="time-warning">⚠ 建议拔除</span>：121–180分钟（避免发热）</li>
            <li><span class="time-danger">❗ 立即拔除</span>：＞180分钟（过充风险升高）</li>
          </ul>
        </div>
      </section>
    </main>

    <footer class="footer-note">
      本演示基于手机摄像头+AI图像识别技术，无需额外硬件 · 零安装 · 拍照即判
    </footer>
  </div>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('themeToggle');
    const html = document.documentElement;
    
    if (localStorage.getItem('theme') === 'dark') {
      html.classList.add('dark-mode');
    }
    
    themeToggle.addEventListener('click', () => {
      html.classList.toggle('dark-mode');
      localStorage.setItem('theme', html.classList.contains('dark-mode') ? 'dark' : 'light');
    });

    // 拍照模拟
    const captureBtn = document.getElementById('captureBtn');
    const socketPreview = document.getElementById('socketPreview');
    const statusText = document.querySelector('.status-text');
    const statusDetail = document.querySelector('.status-detail');
    const timeIndicator = document.getElementById('timeIndicator');
    const timeClassEl = document.querySelector('.time-indicator');

    const states = [
      { active: true, text: '插座已通电', detail: '插头插入 · 指示灯亮起', time: Math.floor(Math.random() * 120) + 60 },
      { active: false, text: '插座已断电', detail: '插头拔出 · 指示灯熄灭', time: 0 }
    ];

    function updateStatus() {
      const state = states[Math.floor(Math.random() * states.length)];
      socketPreview.className = `socket-preview ${state.active ? 'socket-active' : 'socket-inactive'}`;
      statusText.textContent = state.text;
      statusDetail.textContent = state.detail;

      let time = state.time;
      if (state.active) {
        time = Math.max(1, Math.min(240, Math.floor(Math.random() * 180) + 60));
      }
      timeIndicator.innerHTML = `已持续通电 <strong>${time}</strong> 分钟`;
      
      // 更新时间类名
      if (time <= 120) {
        timeClassEl.className = 'time-indicator time-safe';
      } else if (time <= 180) {
        timeClassEl.className = 'time-indicator time-warning';
      } else {
        timeClassEl.className = 'time-indicator time-danger';
      }
    }

    captureBtn.addEventListener('click', updateStatus);

    // 滑块联动
    const timeSlider = document.getElementById('timeSlider');
    timeSlider.addEventListener('input', function() {
      const val = parseInt(this.value);
      timeIndicator.innerHTML = `当前阈值：<strong>${val}</strong> 分钟`;
      
      if (val <= 120) {
        timeClassEl.className = 'time-indicator time-safe';
      } else if (val <= 180) {
        timeClassEl.className = 'time-indicator time-warning';
      } else {
        timeClassEl.className = 'time-indicator time-danger';
      }
    });

    // 初始化一次
    updateStatus();
  </script>
</body>
</html>
