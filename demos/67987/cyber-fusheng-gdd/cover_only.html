<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
@font-face { font-family: 'Tektur'; src: url('./_shared/fonts/Tektur-Medium.ttf') format('truetype'); font-weight: 500; }
@font-face { font-family: 'InstrumentSans'; src: url('./_shared/fonts/InstrumentSans-Regular.ttf') format('truetype'); font-weight: 400; }
@font-face { font-family: 'JetBrainsMono'; src: url('./_shared/fonts/JetBrainsMono-Regular.ttf') format('truetype'); font-weight: 400; }

:root {
  --bg: #0a0e1a;
  --ink: #e2e8f0;
  --muted: #7a8599;
  --accent: #00d4ff;
  --accent2: #ff2a6d;
  --accent3: #a855f7;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'InstrumentSans', sans-serif;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  width: 1280px;
  height: 720px;
  overflow: hidden;
}

.cover {
  position: relative; width: 1280px; height: 720px;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  background: url('./assets/pixel_cover_v2.jpg') center center / cover no-repeat var(--bg);
}
.cover::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, rgba(10,14,26,0.15) 0%, rgba(10,14,26,0.4) 60%, rgba(10,14,26,0.8) 100%);
}
.cover::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(10,14,26,0.2) 0%, rgba(10,14,26,0.3) 50%, rgba(10,14,26,0.85) 92%, var(--bg) 100%);
}
.cover-content { position: relative; z-index: 2; text-align: center; padding: 2rem; }
.cover-tag {
  font-family: 'JetBrainsMono', monospace; font-size: 0.8rem; color: var(--accent);
  letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 1.5rem;
  text-shadow: 0 0 20px rgba(0,212,255,0.6);
}
.cover h1 {
  font-family: 'Tektur', sans-serif; font-size: 5rem; font-weight: 500;
  line-height: 1; letter-spacing: 0.02em; margin-bottom: 1rem;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent3) 50%, var(--accent2) 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 30px rgba(0,212,255,0.3));
}
.cover-sub { font-size: 1.2rem; color: var(--muted); margin-bottom: 0.5rem; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
.cover-meta {
  font-family: 'JetBrainsMono', monospace; font-size: 0.72rem; color: var(--muted);
  margin-top: 2rem; letter-spacing: 0.1em; text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}
</style>
</head>
<body>

<div class="cover">
  <div class="cover-content">
    <div class="cover-tag">// GAME DESIGN DOCUMENT</div>
    <h1>赛博浮生</h1>
    <p class="cover-sub">一款赛博题材的在线文字倒卖小游戏</p>
    <p class="cover-sub" style="font-size:1rem;">50 天，一座城，一条活路</p>
    <div class="cover-meta">GDD v2.0 &nbsp;|&nbsp; 基于「北京浮生记」核心机制改造 &nbsp;|&nbsp; 2026.07</div>
  </div>
</div>

</body>
</html>
