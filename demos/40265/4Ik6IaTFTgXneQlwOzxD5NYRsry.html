<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语镜 - AI 实时思维可视化助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #0f1419;
            color: #e8ecf1;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== 场景选择首页 ===== */
        .scene-selector {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 40px;
            background: radial-gradient(ellipse at top, rgba(102, 126, 234, 0.1) 0%, transparent 50%);
        }

        .scene-selector.hidden { display: none; }

        .selector-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .selector-logo {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .selector-title {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .selector-subtitle {
            font-size: 16px;
            color: #8892b0;
            max-width: 500px;
            line-height: 1.6;
        }

        .scene-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            max-width: 1000px;
            width: 100%;
        }

        .scene-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 32px;
            cursor: pointer;
            transition: all 0.4s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .scene-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .scene-card:hover {
            transform: translateY(-8px);
            border-color: rgba(102, 126, 234, 0.3);
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.15);
        }

        .scene-card:hover::before {
            opacity: 1;
        }

        .scene-icon {
            font-size: 56px;
            margin-bottom: 20px;
        }

        .scene-name {
            font-size: 20px;
            font-weight: 600;
            color: #ccd6f6;
            margin-bottom: 8px;
        }

        .scene-desc {
            font-size: 14px;
            color: #8892b0;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .scene-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }

        .scene-tag {
            padding: 4px 12px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 12px;
            font-size: 12px;
            color: #a8b2d1;
        }

        /* ===== 演示界面 ===== */
        .demo-container {
            display: none;
            height: 100vh;
            flex-direction: column;
        }

        .demo-container.active {
            display: flex;
        }

        /* 顶部栏 */
        .meeting-header {
            height: 56px;
            background: rgba(15, 20, 25, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .meeting-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #a8b2d1;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .meeting-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        .meeting-id {
            font-size: 13px;
            color: #8892b0;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 12px;
        }

        .meeting-duration {
            font-size: 14px;
            color: #22c55e;
            font-variant-numeric: tabular-nums;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .lang-select {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #a8b2d1;
            font-size: 13px;
            cursor: pointer;
        }

        /* 主内容 */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .video-panel {
            flex: 1;
            padding: 20px;
            display: grid;
            gap: 16px;
            overflow: hidden;
        }

        /* 动态网格布局 */
        .video-panel.layout-4 {
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
        }

        .video-panel.layout-6 {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
        }

        /* 演讲布局：主讲人大屏 + 听众底部 */
        .video-panel.layout-speech {
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: 2fr 1fr;
            gap: 12px;
        }

        .video-panel.layout-speech .video-cell.speaker-main {
            grid-column: 1 / 5;
            grid-row: 1;
        }

        .video-panel.layout-speech .video-cell.speaker-secondary {
            grid-column: 5 / 7;
            grid-row: 1;
        }

        .video-panel.layout-speech .video-cell.listener {
            grid-row: 2;
        }

        .video-cell {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .video-cell:hover {
            border-color: rgba(102, 126, 234, 0.3);
        }

        .video-cell.speaking {
            border-color: #22c55e;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.15);
        }

        .video-cell.yujing-active {
            border-color: #667eea;
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.2);
        }

        .video-normal {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .avatar-1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .avatar-2 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .avatar-3 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .avatar-4 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .avatar-5 { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .avatar-6 { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); }

        .participant-name {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 3px;
        }

        .participant-role {
            font-size: 12px;
            color: #8892b0;
        }

        .participant-status {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 6px;
        }

        .status-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .video-yujing {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            position: relative;
            background: rgba(10, 14, 26, 0.95);
        }

        .video-cell.yujing-active .video-normal {
            display: none;
        }

        .video-cell.yujing-active .video-yujing {
            display: flex;
        }

        .yujing-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 5px 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
            color: white;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 10;
        }

        .yujing-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .yujing-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .viz-slide {
            display: none;
            text-align: center;
            animation: slideIn 0.4s ease;
            width: 100%;
        }

        .viz-slide.active {
            display: block;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .viz-emoji {
            font-size: 64px;
            margin-bottom: 12px;
        }

        .viz-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .viz-desc {
            font-size: 13px;
            color: #a8b2d1;
            line-height: 1.7;
            max-width: 90%;
            margin: 0 auto;
            white-space: pre-line;
        }

        .viz-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            margin-top: 12px;
        }

        .viz-tag {
            padding: 3px 10px;
            background: rgba(102, 126, 234, 0.15);
            border-radius: 10px;
            font-size: 11px;
            color: #a8b2d1;
        }

        .live-caption {
            position: absolute;
            bottom: 50px;
            left: 12px;
            right: 12px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            font-size: 13px;
            color: #fff;
            line-height: 1.5;
            z-index: 10;
        }

        .live-caption .highlight {
            color: #667eea;
            font-weight: 600;
        }

        .yujing-pagination {
            height: 44px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 0 12px;
        }

        .page-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a8b2d1;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .page-btn:hover {
            background: rgba(102, 126, 234, 0.2);
            color: #fff;
        }

        .page-indicator {
            font-size: 12px;
            color: #8892b0;
            min-width: 50px;
            text-align: center;
        }

        .page-dots {
            display: flex;
            gap: 5px;
        }

        .page-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .page-dot.active {
            background: #667eea;
            width: 18px;
            border-radius: 3px;
        }

        /* 双语显示 */
        .bilingual .viz-title {
            font-size: 16px;
        }

        .bilingual .viz-title-en {
            font-size: 13px;
            color: #8892b0;
            margin-bottom: 8px;
            font-style: italic;
        }

        .bilingual .viz-desc-en {
            font-size: 12px;
            color: #667eea;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(102, 126, 234, 0.2);
        }

        /* 侧面板 */
        .side-panel {
            width: 300px;
            border-left: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            background: rgba(15, 20, 25, 0.8);
        }

        .panel-tabs {
            display: flex;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .panel-tab {
            flex: 1;
            padding: 14px;
            text-align: center;
            font-size: 13px;
            color: #8892b0;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .panel-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: 600;
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
        }

        .chat-message {
            margin-bottom: 14px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .chat-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        .chat-name {
            font-size: 12px;
            font-weight: 600;
            color: #ccd6f6;
        }

        .chat-time {
            font-size: 10px;
            color: #8892b0;
        }

        .chat-text {
            font-size: 13px;
            color: #a8b2d1;
            line-height: 1.5;
            padding-left: 34px;
        }

        .participant-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .participant-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .participant-info {
            flex: 1;
        }

        .participant-name-list {
            font-size: 13px;
            font-weight: 600;
            color: #ccd6f6;
        }

        .participant-status-text {
            font-size: 11px;
            color: #8892b0;
        }

        .yujing-toggle {
            padding: 5px 12px;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 14px;
            font-size: 11px;
            color: #a8b2d1;
            cursor: pointer;
        }

        .yujing-toggle.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        /* 底部控制栏 */
        .control-bar {
            height: 64px;
            background: rgba(15, 20, 25, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 0 20px;
        }

        .control-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #a8b2d1;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 56px;
        }

        .control-btn .icon {
            font-size: 18px;
        }

        .control-btn.danger {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .control-btn.yujing-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        /* 开始演示覆盖层 */
        .demo-start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .demo-start-overlay.hidden {
            display: none;
        }

        .demo-start-card {
            background: rgba(15, 20, 25, 0.95);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            max-width: 480px;
        }

        .demo-start-card h2 {
            font-size: 24px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .demo-start-card p {
            color: #8892b0;
            margin-bottom: 24px;
            line-height: 1.6;
            font-size: 14px;
        }

        .start-demo-btn {
            padding: 14px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .start-demo-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(100, 149, 237, 0.3);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <!-- ===== 场景选择首页 ===== -->
    <div class="scene-selector" id="sceneSelector">
        <div class="selector-header">
            <div class="selector-logo">🧠</div>
            <h1 class="selector-title">语镜</h1>
            <p class="selector-subtitle">
                AI 实时思维可视化助手<br>
                让沟通中的每一个概念都被看见，让思维瞬间对齐
            </p>
        </div>
        <div class="scene-cards">
            <div class="scene-card" onclick="selectScene('travel')">
                <div class="scene-icon">✈️</div>
                <div class="scene-name">成都旅行计划</div>
                <div class="scene-desc">
                    4位朋友视频讨论成都旅行攻略<br>
                    没去过的人也能瞬间理解地名和美食
                </div>
                <div class="scene-tags">
                    <span class="scene-tag">日常沟通</span>
                    <span class="scene-tag">4人会议</span>
                    <span class="scene-tag">中文</span>
                </div>
            </div>
            <div class="scene-card" onclick="selectScene('work')">
                <div class="scene-icon">💼</div>
                <div class="scene-name">产品需求评审</div>
                <div class="scene-desc">
                    产品经理与设计师讨论新功能方案<br>
                    复杂概念实时可视化，团队快速对齐
                </div>
                <div class="scene-tags">
                    <span class="scene-tag">工作场景</span>
                    <span class="scene-tag">4人会议</span>
                    <span class="scene-tag">中文</span>
                </div>
            </div>
            <div class="scene-card" onclick="selectScene('global')">
                <div class="scene-icon">🌍</div>
                <div class="scene-name">跨语言技术分享</div>
                <div class="scene-desc">
                    英文主讲人向多国团队分享AI技术<br>
                    实时中英双语可视化，打破语言壁垒
                </div>
                <div class="scene-tags">
                    <span class="scene-tag">跨语言</span>
                    <span class="scene-tag">6人会议</span>
                    <span class="scene-tag">英文+中文</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 演示容器 ===== -->
    <div class="demo-container" id="demoContainer">
        <!-- 动态内容将由JS生成 -->
    </div>

    <script>
        // ==================== 场景数据 ====================
        const scenes = {
            travel: {
                title: '✈️ 成都旅行计划讨论',
                participants: [
                    { id: 1, name: '旅行达人阿杰', role: '正在发言...', avatar: '杰', color: 'avatar-1', yujing: true },
                    { id: 2, name: '美食家小美', role: '等待中', avatar: '美', color: 'avatar-2', yujing: true },
                    { id: 3, name: '小白同学小张', role: '听众（没去过成都）', avatar: '张', color: 'avatar-3', yujing: false },
                    { id: 4, name: '路痴小陈', role: '听众（方向感差）', avatar: '陈', color: 'avatar-4', yujing: false }
                ],
                layout: 'layout-4',
                script: [
                    {
                        speaker: 1,
                        name: '旅行达人阿杰',
                        text: '我跟你们说，成都一定要去<strong>宽窄巷子</strong>！那里是清朝遗留的古街道，由宽巷子、窄巷子和井巷子三条平行排列的老街组成，特别有味道。',
                        viz: {
                            emoji: '🏘️',

                }
                
                addSlide(item.speaker, item.viz);
                addChatMessage(item.name, item.text, item.speaker);
                
                index++;
            }, 6000);
        }

        function addSlide(speakerId, vizData) {
            const container = document.getElementById(`yujing-content-${speakerId}`);
            if (!container) return;
            
            const slideIndex = slides[speakerId].length;
            slides[speakerId].push(vizData);
            
            const isBilingual = scenes[currentScene].bilingual;
            
            let contentHTML = '';
            
            if (isBilingual && vizData.originalText) {
                // 跨语言场景：英文原文 + 中文直译 + 名词解释
                const termsHTML = vizData.terms ? vizData.terms.map(t => `
                    <div style="margin-bottom: 10px; padding: 10px; background: rgba(102, 126, 234, 0.1); border-radius: 8px; text-align: left;">
                        <div style="font-weight: 600; color: #667eea; font-size: 13px; margin-bottom: 4px;">📌 ${t.term}</div>
                        <div style="color: #a8b2d1; font-size: 12px; line-height: 1.5;">${t.explain}</div>
                    </div>
                `).join('') : '';
                
                contentHTML = `
                    <div class="viz-emoji">${vizData.emoji}</div>
                    <div style="margin-bottom: 16px;">
                        <div style="font-size: 11px; color: #667eea; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px;">Original</div>
                        <div style="font-size: 14px; color: #ccd6f6; font-style: italic; line-height: 1.6; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 8px; border-left: 3px solid #667eea;">${vizData.originalText}</div>
                    </div>
                    <div style="margin-bottom: 16px;">
                        <div style="font-size: 11px; color: #22c55e; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px;">中文直译</div>
                        <div style="font-size: 14px; color: #e8ecf1; line-height: 1.6; padding: 10px; background: rgba(34, 197, 94, 0.05); border-radius: 8px; border-left: 3px solid #22c55e;">${vizData.translation}</div>
                    </div>
                    <div style="margin-bottom: 12px;">
                        <div style="font-size: 11px; color: #f59e0b; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;">专业名词解释</div>
                        ${termsHTML}
                    </div>
                    <div class="viz-tags">
                        ${vizData.tags.map(tag => `<span class="viz-tag">${tag}</span>`).join('')}
                    </div>
                `;
            } else {
                // 普通场景：标题 + 描述
                contentHTML = `
                    <div class="viz-emoji">${vizData.emoji}</div>
                    <h3 class="viz-title">${vizData.title || ''}</h3>
                    <p class="viz-desc">${vizData.desc || ''}</p>
                    <div class="viz-tags">
                        ${vizData.tags.map(tag => `<span class="viz-tag">${tag}</span>`).join('')}
                    </div>
                `;
            }
            
            const slideDiv = document.createElement('div');
            slideDiv.className = 'viz-slide';
            slideDiv.id = `slide-${speakerId}-${slideIndex}`;
            slideDiv.innerHTML = contentHTML;
            
            container.appendChild(slideDiv);
            showSlide(speakerId, slideIndex);
        }

        function showSlide(speakerId, index) {
            document.querySelectorAll(`#yujing-content-${speakerId} .viz-slide`).forEach(s => {
                s.classList.remove('active');
            });
            
            const target = document.getElementById(`slide-${speakerId}-${index}`);
            if (target) {
                target.classList.add('active');
                currentSlide[speakerId] = index;
            }
            
            updatePagination(speakerId);
        }

        function prevSlide(speakerId) {
            if (currentSlide[speakerId] > 0) {
                showSlide(speakerId, currentSlide[speakerId] - 1);
            }
        }

        function nextSlide(speakerId) {
            if (currentSlide[speakerId] < slides[speakerId].length - 1) {
                showSlide(speakerId, currentSlide[speakerId] + 1);
            }
        }

        function updatePagination(speakerId) {
            const total = slides[speakerId].length;
            const current = currentSlide[speakerId] + 1;
            
            const indicator = document.getElementById(`page-indicator-${speakerId}`);
            if (indicator) indicator.textContent = `${current} / ${total}`;
            
            const dotsContainer = document.getElementById(`page-dots-${speakerId}`);
            if (dotsContainer) {
                dotsContainer.innerHTML = '';
                for (let i = 0; i < total; i++) {
                    const dot = document.createElement('div');
                    dot.className = `page-dot ${i === currentSlide[speakerId] ? 'active' : ''}`;
                    dot.onclick = () => showSlide(speakerId, i);
                    dotsContainer.appendChild(dot);
                }
            }
        }

        // ==================== 聊天与成员 ====================
        function addChatMessage(name, text, avatarId) {
            const content = document.getElementById('panel-content');
            if (!content) return;
            
            if (!document.getElementById('tab-chat')?.classList.contains('active')) {
                switchTab('chat');
            }
            
            const scene = scenes[currentScene];
            const participant = scene.participants.find(p => p.id === avatarId);
            const color = participant ? participant.color : 'avatar-1';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'chat-message';
            
            const now = new Date();
            const time = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            
            messageDiv.innerHTML = `
                <div class="chat-header">
                    <div class="chat-avatar ${color}">${name[0]}</div>
                    <span class="chat-name">${name}</span>
                    <span class="chat-time">${time}</span>
                </div>
                <div class="chat-text">${text}</div>
            `;
            
            const waitingMsg = content.querySelector('div[style*="等待消息"]');
            if (waitingMsg) waitingMsg.remove();
            
            content.appendChild(messageDiv);
            content.scrollTop = content.scrollHeight;
        }

        function renderChatPanel() {
            const content = document.getElementById('panel-content');
            if (content) content.innerHTML = '<div style="text-align: center; color: #8892b0; padding: 40px 0;">等待消息...</div>';
        }

        function renderParticipantsPanel() {
            const content = document.getElementById('panel-content');
            if (!content) return;
            
            const scene = scenes[currentScene];
            let html = '';
            scene.participants.forEach(p => {
                html += `
                    <div class="participant-item">
                        <div class="participant-avatar ${p.color}">${p.avatar}</div>
                        <div class="participant-info">
                            <div class="participant-name-list">${p.name}</div>
                            <div class="participant-status-text">${p.role}</div>
                        </div>
                        <button class="yujing-toggle ${p.yujing ? 'active' : ''}" onclick="toggleParticipantYujing(${p.id})">
                            ${p.yujing ? (scene.bilingual ? 'Yujing ON' : '语镜开') : (scene.bilingual ? 'Yujing OFF' : '语镜关')}
                        </button>
                    </div>
                `;
            });
            content.innerHTML = html;
        }

        function switchTab(tab) {
            document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
            const tabEl = document.getElementById(`tab-${tab}`);
            if (tabEl) tabEl.classList.add('active');
            
            if (tab === 'chat') {
                renderChatPanel();
            } else {
                renderParticipantsPanel();
            }
        }

        // ==================== 控制按钮 ====================
        function toggleYujing() {
            isYujingActive = !isYujingActive;
            const btn = document.getElementById('yujingBtn');
            if (btn) btn.classList.toggle('active');
        }

        function toggleParticipantYujing(id) {
            const cell = document.getElementById(`cell-${id}`);
            if (cell) cell.classList.toggle('yujing-active');
            
            const btn = event.target;
            btn.classList.toggle('active');
            const scene = scenes[currentScene];
            const isOn = btn.classList.contains('active');
            btn.textContent = isOn ? (scene.bilingual ? 'Yujing ON' : '语镜开') : (scene.bilingual ? 'Yujing OFF' : '语镜关');
        }

        function toggleMic() {
            event.currentTarget.classList.toggle('active');
        }

        function toggleCamera() {
            event.currentTarget.classList.toggle('active');
        }

        function shareScreen() {
            alert('屏幕共享功能演示');
        }

        function endMeeting() {
            if (confirm('确定要结束会议吗？')) {
                clearInterval(demoInterval);
                clearInterval(timeInterval);
                backToSelector();
            }
        }

        function backToSelector() {
            clearInterval(demoInterval);
            clearInterval(timeInterval);
            document.getElementById('demoContainer').classList.remove('active');
            document.getElementById('sceneSelector').classList.remove('hidden');
            currentScene = null;
        }

        function changeLang() {
            const select = document.getElementById('langSelect');
            const mode = select ? select.value : 'both';
            
            document.querySelectorAll('.viz-title-en').forEach(el => {
                el.style.display = mode === 'zh' ? 'none' : 'block';
            });
            document.querySelectorAll('.viz-desc-en').forEach(el => {
                el.style.display = mode === 'zh' ? 'none' : 'block';
            });
            document.querySelectorAll('.viz-title').forEach(el => {
                el.style.display = mode === 'en' ? 'none' : 'block';
            });
            document.querySelectorAll('.viz-desc').forEach(el => {
                if (!el.classList.contains('viz-desc-en')) {
                    el.style.display = mode === 'en' ? 'none' : 'block';
                }
            });
        }

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            console.log('语镜 - AI 实时思维可视化助手 v2.0 已加载');
        });
    </script>
</body>
</html>
