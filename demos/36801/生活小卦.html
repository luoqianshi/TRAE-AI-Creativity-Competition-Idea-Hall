<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            color: #e2e8f0;
        }
        .card-glass {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        .neon-glow {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.5), 0 0 40px rgba(99, 102, 241, 0.3);
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(99, 102, 241, 0.8), 0 0 20px rgba(99, 102, 241, 0.5);
        }
        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.6);
            transform: translateY(-2px);
        }
        .cat-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto;
        }
        .cat-body {
            position: absolute;
            width: 80px;
            height: 70px;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border-radius: 50% 50% 45% 45%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .cat-head {
            position: absolute;
            width: 70px;
            height: 60px;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border-radius: 50% 50% 45% 45%;
            left: 50%;
            top: 20%;
            transform: translateX(-50%);
            z-index: 2;
        }
        .cat-ear {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 20px solid #fde68a;
            top: 5px;
        }
        .cat-ear.left { left: 5px; transform: rotate(-15deg); }
        .cat-ear.right { right: 5px; transform: rotate(15deg); }
        .cat-ear-inner {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 10px solid #f472b6;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
        }
        .cat-eye {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #1e293b;
            border-radius: 50%;
            top: 20px;
            overflow: hidden;
        }
        .cat-eye.left { left: 12px; }
        .cat-eye.right { right: 12px; }
        .cat-eye::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background: #6366f1;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            animation: eyeGlow 2s ease-in-out infinite;
        }
        .cat-nose {
            position: absolute;
            width: 10px;
            height: 8px;
            background: #f472b6;
            border-radius: 50% 50% 40% 40%;
            left: 50%;
            top: 38px;
            transform: translateX(-50%);
        }
        .cat-mouth {
            position: absolute;
            width: 20px;
            height: 10px;
            border-bottom: 2px solid #f472b6;
            border-radius: 0 0 50% 50%;
            left: 50%;
            top: 45px;
            transform: translateX(-50%);
        }
        .cat-whisker {
            position: absolute;
            width: 25px;
            height: 2px;
            background: #94a3b8;
            top: 42px;
        }
        .cat-whisker.left-1 { left: -10px; transform: rotate(-10deg); }
        .cat-whisker.left-2 { left: -12px; top: 48px; transform: rotate(10deg); }
        .cat-whisker.right-1 { right: -10px; transform: rotate(10deg); }
        .cat-whisker.right-2 { right: -12px; top: 48px; transform: rotate(-10deg); }
        .cat-tail {
            position: absolute;
            width: 40px;
            height: 15px;
            background: #fde68a;
            border-radius: 10px;
            bottom: 15px;
            right: -15px;
            transform: rotate(-20deg);
            animation: tailWag 1s ease-in-out infinite;
            transform-origin: left center;
        }
        @keyframes tailWag {
            0%, 100% { transform: rotate(-20deg); }
            50% { transform: rotate(-35deg); }
        }
        @keyframes eyeGlow {
            0%, 100% { opacity: 1; box-shadow: 0 0 5px #6366f1; }
            50% { opacity: 0.7; box-shadow: 0 0 15px #6366f1; }
        }
        /* 解卦中动画 */
        .cat-thinking .cat-eye::after {
            animation: eyeSpin 0.5s linear infinite;
        }
        @keyframes eyeSpin {
            0% { transform: translateX(3px) rotate(0deg); }
            50% { transform: translateX(3px) rotate(180deg); }
            100% { transform: translateX(3px) rotate(360deg); }
        }
        /* 好运表情 */
        .cat-lucky .cat-eye::after {
            width: 10px !important;
            height: 10px !important;
            background: #f59e0b !important;
            box-shadow: 0 0 15px #f59e0b !important;
            animation: luckyGlow 0.3s ease-in-out infinite !important;
        }
        @keyframes luckyGlow {
            0%, 100% { box-shadow: 0 0 15px #f59e0b; }
            50% { box-shadow: 0 0 25px #f59e0b, 0 0 35px #f59e0b; }
        }
        /* 一般表情 */
        .cat-normal .cat-eye::after {
            animation: none !important;
            top: 8px !important;
        }
        .cat-normal .cat-mouth {
            border-bottom: none !important;
            border-top: 2px solid #f472b6 !important;
            border-radius: 50% 50% 0 0 !important;
            top: 48px !important;
        }
        .card-selected {
            border-color: #6366f1 !important;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        }
        .typewriter-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: #6366f1;
            animation: blink 0.7s infinite;
            margin-left: 2px;
            vertical-align: middle;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-card {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(139, 92, 246, 0.2) 100%);
            border: 1px solid rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body class="py-8 px-4">

        // 初始化

        // 渲染功能卡片
        function renderFeatures() {
            const grid = document.getElementById('feature-grid');
            const currentFeatures = features[appState.mode];
            grid.innerHTML = currentFeatures.map(f => `
                <button onclick="selectFeature('${f.id}')" class="feature-card p-4 rounded-xl border-2 border-[#334155] bg-[#1e293b] hover:border-[#6366f1] transition-all text-left" data-feature="${f.id}">
                    <div class="text-2xl mb-2 text-[#6366f1]"><i class="fa-solid ${f.icon}"></i></div>
                    <div class="font-semibold text-[#e2e8f0]">${f.name}</div>
                    <div class="text-xs text-[#94a3b8] mt-1">${f.desc}</div>
                </button>
            `).join('');
        }

        // 切换模式
        function switchMode(mode) {
            appState.mode = mode;
            appState.selectedFeature = null;
            appState.inputs = {};

            document.getElementById('btn-yijing').className = mode === 'yijing'
                ? 'px-6 py-3 text-sm font-medium transition-all bg-[#6366f1] text-white'
                : 'px-6 py-3 text-sm font-medium transition-all bg-[#1e293b] text-[#94a3b8] hover:text-white';
            document.getElementById('btn-xingzuo').className = mode === 'xingzuo'
                ? 'px-6 py-3 text-sm font-medium transition-all bg-[#6366f1] text-white'
                : 'px-6 py-3 text-sm font-medium transition-all bg-[#1e293b] text-[#94a3b8] hover:text-white';

            renderFeatures();
            document.getElementById('input-area').classList.add('hidden');
            document.getElementById('result-area').classList.add('hidden');
            document.getElementById('btn-start').disabled = true;
            resetCat();
            document.getElementById('cat-status').textContent = '点击下方功能，开始解卦吧~';
        }

        // 选择功能
        function selectFeature(featureId) {
            appState.selectedFeature = featureId;
            appState.inputs = {};

            document.querySelectorAll('.feature-card').forEach(card => {
                card.classList.toggle('card-selected', card.dataset.feature === featureId);
            });

            renderInputFields();
            document.getElementById('input-area').classList.remove('hidden');
            document.getElementById('result-area').classList.add('hidden');
            document.getElementById('btn-start').disabled = false;
            document.getElementById('cat-status').textContent = '正在思考中...';
        }

        // 渲染输入字段
        function renderInputFields() {
            const container = document.getElementById('input-fields');
            let html = '';

            const featureLabels = {
                guaxiang: { label: '日期', type: 'date', default: new Date().toISOString().split('T')[0] },
                wuxing: { label: '今日心情', type: 'select', options: ['随机运势', '想穿喜庆点', '想低调一些'] },
                zhaowu: { label: '丢失物品', type: 'select', options: ['手机', '钥匙', '钱包', '宠物', '其他'] },
                shijian: { label: '口味偏好', type: 'select', options: ['辣', '清淡', '甜', '随便'] },
                songli: { label: '送礼对象', type: 'select', options: ['恋人', '朋友', '同事', '领导', '客户', '伙伴', '自己'] },
                xingyu: { label: '日期', type: 'date', default: new Date().toISOString().split('T')[0] },
                chuanDa: { label: '你的星座', type: 'select', options: ['白羊座', '金牛座', '双子座', '巨蟹座', '狮子座', '处女座'] },
                fangwei: { label: '你的星座', type: 'select', options: ['白羊座', '金牛座', '双子座', '巨蟹座', '狮子座', '处女座'] },
                shiti: { label: '你的星座', type: 'select', options: ['白羊座', '金牛座', '双子座', '巨蟹座', '狮子座', '处女座'] },
                zhinan: { label: '对方星座', type: 'select', options: ['白羊座', '金牛座', '双子座', '巨蟹座', '狮子座', '处女座'] }
            };

            const config = featureLabels[appState.selectedFeature];
            if (config) {
                if (config.type === 'date') {
                    html = `
                        <div>
                            <label class="block text-sm text-[#94a3b8] mb-2">${config.label}</label>
                            <input type="date" id="input-value" value="${config.default}" class="w-full px-4 py-3 bg-[#0f172a] border border-[#334155] rounded-lg text-[#e2e8f0] focus:border-[#6366f1] focus:outline-none">
                        </div>
                    `;
                } else if (config.type === 'select') {
                    html = `
                        <div>
                            <label class="block text-sm text-[#94a3b8] mb-2">${config.label}</label>
                            <select id="input-value" class="w-full px-4 py-3 bg-[#0f172a] border border-[#334155] rounded-lg text-[#e2e8f0] focus:border-[#6366f1] focus:outline-none">
                                ${config.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                            </select>
                        </div>
                    `;
                }
            }

            container.innerHTML = html;
        }

        // 重置小猫状态
        function resetCat() {
            const container = document.getElementById('cat-container');
            container.className = 'cat-container';
        }

        // 开始解卦
        async function startDivination() {
            const btn = document.getElementById('btn-start');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>解卦中...';

            const container = document.getElementById('cat-container');
            container.classList.add('cat-thinking');
            document.getElementById('cat-status').textContent = '正在为你解卦...';

            // 模拟解卦过程
            await new Promise(resolve => setTimeout(resolve, 2000));

            container.classList.remove('cat-thinking');

            // 根据随机结果设置表情
            const isGood = Math.random() > 0.4;
            container.classList.add(isGood ? 'cat-lucky' : 'cat-normal');
            document.getElementById('cat-status').textContent = isGood ? '✨ 哇，今天运气不错！' : '🤔 今天平平淡淡~';

            // 生成结果
            const result = generateResult();
            showResult(result);

            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-play mr-2"></i>开始解卦';
        }

        // 生成结果
        function generateResult() {
            const mode = appState.mode;
            const feature = appState.selectedFeature;
            const inputValue = document.getElementById('input-value')?.value || '';

            let result = { title: '', content: '' };

            if (mode === 'yijing') {
                result = generateYijingResult(feature, inputValue);
            } else {
                result = generateXingzuoResult(feature, inputValue);
            }

            return result;
        }

        // 易经结果

            const data = yijingData[feature];
            const index = Math.floor(Math.random() * 5);

                    return {
                        title: `今日卦象：${data.titles[index]}`,
                        content: `

                                    <i class="fa-solid fa-yin-yang text-[#6366f1] animate-spin" style="animation-duration: 3s;"></i>

                                </div>

                                    <p class="text-[#94a3b8]"><i class="fa-solid fa-compass mr-2 text-[#6366f1]"></i>好运方位：${data.directions[index]}</p>
                                </div>
                            </div>
                        `

                case 'wuxing':

                            <div class="space-y-4">
                                <div class="text-center">
                                    <span class="text-4xl">👔</span>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div class="bg-green-500/20 p-3 rounded-lg">
                                        <p class="text-green-400 font-semibold">✅ 旺运色</p>
                                        <p>${colorData.good.join('、')}</p>
                                    </div>
                                    <div class="bg-red-500/20 p-3 rounded-lg">
                                        <p class="text-red-400 font-semibold">❌ 避运色</p>
                                        <p>${colorData.bad.join('、')}</p>
                                    </div>
                                </div>
                                <div class="border-t border-[#334155] pt-4">
                                    <p class="text-[#e2e8f0]">${colorData.recommend}</p>

                            </div>
                        `
                    };
                case 'zhaowu':
                    const itemKey = document.getElementById('input-value')?.value || '其他';

                                <div class="text-center">
                                    <span class="text-4xl">🔍</span>
                                </div>
                                <p class="text-center text-[#94a3b8]">丢失物品：${itemKey}</p>
                                <div class="grid grid-cols-2 gap-4">
                                    <div class="bg-[#6366f1]/20 p-3 rounded-lg text-center">
                                        <p class="text-[#6366f1] font-semibold">📍 主要方位</p>
                                        <p class="text-xl">${itemData.main}</p>
                                    </div>
                                    <div class="bg-[#8b5cf6]/20 p-3 rounded-lg text-center">
                                        <p class="text-[#8b5cf6] font-semibold">📍 次要方位</p>
                                        <p class="text-xl">${itemData.sub}</p>
                                    </div>
                                </div>
                                <div class="border-t border-[#334155] pt-4">
                                    <p class="text-[#e2e8f0]"><i class="fa-solid fa-lightbulb mr-2 text-yellow-400"></i>${itemData.tip}</p>
                                </div>
                            </div>
                        `

                case 'shijian':

                    const tasteData = data.taste[tasteKey] || data.taste['随便'];
                    return {
                        title: '今日食鉴',
                        content: `
                            <div class="space-y-4">
                                <div class="text-center">
                                    <span class="text-4xl">🍜</span>
                                </div>
                                <p class="text-center text-lg font-semibold text-[#f59e0b]">${tasteData.food}</p>
                                <div class="border-t border-[#334155] pt-4">

                                </div>
                            </div>
                        `
                    };
                case 'songli':
                    const targetKey = document.getElementById('input-value')?.value || '朋友';
                    const targetData = data.targets[targetKey] || data.targets['朋友'];
                    return {
                        title: '送礼指南',
                        content: `
                            <div class="space-y-4">
                                <div class="text-center">
                                    <span class="text-4xl">🎁</span>
                                </div>
                                <p class="text-center text-[#94a3b8]">送礼对象：${targetKey}</p>
                                <div class="space-y-3">
                                    <div class="flex items-center">
                                        <span class="text-green-400 w-20">✅ 颜色</span>
                                        <span>${targetData.color}</span>
                                    </div>
                                    <div class="flex items-center">
                                        <span class="text-green-400 w-20">✅ 风格</span>
                                        <span>${targetData.style}</span>
                                    </div>
                                    <div class="flex items-center">
                                        <span class="text-red-400 w-20">❌ 避免</span>

            const signName = document.getElementById('input-value')?.value || signs[index];

            switch(feature) {
                case 'xingyu':
                    const lucky = data.lucky[index];
                    return {
                        title: `今日星语：${signName}`,
                        content: `
                            <div class="space-y-4">
                                <div class="flex items-center justify-center text-2xl mb-4">
                                    <i class="fa-solid fa-star text-[#f59e0b]"></i>
                                </div>
                                <p class="text-lg text-[#e2e8f0] font-semibold">✨ ${data.tips[index]}</p>
                                <div class="grid grid-cols-2 gap-4">
                                    <div class="bg-[#f59e0b]/20 p-3 rounded-lg text-center">

                                        <p class="text-xl">${lucky.color}</p>
                                    </div>
                                    <div class="bg-[#6366f1]/20 p-3 rounded-lg text-center">

                            <div class="space-y-4">

                                        <p class="text-red-400 font-semibold">❌ 避开色</p>

        // 显示结果（打字机效果）
        function showResult(result) {
            const area = document.getElementById('result-area');
            const content = document.getElementById('result-content');
            area.classList.remove('hidden');

            content.innerHTML = `<h4 class="text-xl font-bold text-[#6366f1] mb-4 text-center">${result.title}</h4>`;

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = result.content;
            const textContent = tempDiv.textContent;

            let i = 0;
            const typing = setInterval(() => {
                if (i < textContent.length) {
                    content.innerHTML = `<h4 class="text-xl font-bold text-[#6366f1] mb-4 text-center">${result.title}</h4><div class="result-typing">${result.content.substring(0, i + 1)}<span class="typewriter-cursor"></span></div>`;
                    i++;
                } else {
                    clearInterval(typing);
                    content.innerHTML = `<h4 class="text-xl font-bold text-[#6366f1] mb-4 text-center">${result.title}</h4>${result.content}`;
                }
            }, 30);

            content.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // 保存历史记录
        function saveHistory(result) {
            try {
                const history = JSON.parse(localStorage.getItem('xiaogua_history') || '[]');
                history.unshift({
                    date: new Date().toISOString(),
                    mode: appState.mode,
                    feature: appState.selectedFeature,
                    result: result.title
                });
                localStorage.setItem('xiaogua_history', JSON.stringify(history.slice(0, 20)));
            } catch(e) {}
        }

        // 初始化应用
        init();
    </script>
</body>
</html>
