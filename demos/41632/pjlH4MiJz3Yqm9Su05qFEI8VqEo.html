      <p class="tagline">CROSS-VERSE BATTLE ARENA</p>
      <p>让不同次元的角色正面交锋 —— 奥特曼 vs 孙悟空？哈利·波特 vs 哪吒？<br>输入任意两个角色，看谁才是真正的王者！</p>
    </header>

    <!-- Input Section -->
    <section class="input-section" id="inputSection">
      <h2>⚔️ 角色登场</h2>
      <p class="sub">输入两位来自不同作品的角色，开始多维对决！</p>

      <div class="input-row">
        <div class="input-group">
          <label>角色 ①</label>
          <input type="text" id="char1Input" placeholder="例：孙悟空" maxlength="20">
        </div>
        <div class="vs-divider">VS</div>
        <div class="input-group">
          <label>角色 ② <span class="vs-tag">(挑战者)</span></label>
          <input type="text" id="char2Input" placeholder="例：奥特曼" maxlength="20">
        </div>
      </div>

      <div style="text-align:center;">
        <button class="btn-battle" id="battleBtn">⚡ 开始对决</button>
      </div>

      <div class="presets">
        <span class="presets-label">🎲 快速尝试</span>
        <button class="preset-btn" data-c1="孙悟空" data-c2="奥特曼">孙悟空 vs 奥特曼</button>
        <button class="preset-btn" data-c1="哈利·波特" data-c2="哪吒">哈利·波特 vs 哪吒</button>
        <button class="preset-btn" data-c1="钢铁侠" data-c2="路飞">钢铁侠 vs 路飞</button>
        <button class="preset-btn" data-c1="超人" data-c2="鸣人">超人 vs 鸣人</button>
        <button class="preset-btn" data-c1="灭霸" data-c2="宇智波斑">灭霸 vs 宇智波斑</button>
      </div>
    </section>

    <div class="loading-spinner" id="loadingSpinner">
      <div class="spinner"></div>
      <p style="margin-top: 1rem; color: var(--muted);">多维数据分析中...</p>
    </div>

    <!-- Results -->
    <section class="results" id="resultsSection">

      <!-- Winner Banner -->
      <div class="winner-banner" id="winnerBanner">
        <div class="label">🏆 对决结果</div>
        <div class="winner-name" id="winnerName">—</div>
        <div class="winner-score" id="winnerScore">综合评分 —</div>
      </div>

        <div class="chart-card">
          <h3>📊 六维能力雷达图</h3>
          <div class="chart-container" id="radarChart"></div>
        </div>
        <div class="chart-card">
          <h3>📈 各项能力对比</h3>
          <div class="chart-container" id="barChart"></div>
        </div>
      </div>

      <!-- Score Table -->
      <div class="chart-card">
        <h3>📋 详细评分表</h3>
        <div class="score-table-wrap">
          <table class="score-table" id="scoreTable">
            <thead>
              <tr>
                <th>维度</th>
                <th id="thChar1" class="char1-color">角色①</th>
                <th id="thChar2" class="char2-color">角色②</th>
                <th>胜者</th>
              </tr>
            </thead>
            <tbody id="scoreBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Verdict -->

        <h3 id="verdictTitle">💬 裁判点评</h3>
        <p id="verdictText">点击「开始对决」查看精彩点评！</p>
      </div>
    </section>
