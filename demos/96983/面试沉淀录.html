<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试沉淀录 · 求职复盘与知识沉淀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-green:#0F3D2E;
    --ink-green-2:#1B5E3F;
    --moss:#2D6A4F;
    --amber:#D4A574;
    --amber-deep:#B8860B;
    --brick:#C44536;
    --cream:#FAF7F2;
    --paper:#F5F0E8;
    --line:#E0D9CC;
    --text:#2A2520;
    --text-soft:#6B5D4F;
    --shadow:0 4px 24px rgba(15,61,46,.08);
    --shadow-hover:0 12px 40px rgba(15,61,46,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Noto Sans SC',sans-serif;
    background:var(--cream);
    color:var(--text);
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--amber);color:var(--ink-green)}

  /* 顶部装饰条 */
  .topbar{
    height:6px;
    background:linear-gradient(90deg,
      var(--ink-green) 0 20%,
      var(--moss) 20% 40%,
      var(--amber) 40% 60%,
      var(--brick) 60% 80%,
      var(--ink-green-2) 80% 100%);
  }

  /* 侧边栏 */
  .layout{display:flex;min-height:calc(100vh - 6px)}
  .sidebar{
    width:260px;
    background:var(--ink-green);
    color:#E8E0D0;
    position:fixed;
    top:6px;
    bottom:0;
    left:0;
    padding:36px 24px;
    display:flex;
    flex-direction:column;
    z-index:50;
  }
  .brand{margin-bottom:48px}
  .brand-mark{
    font-family:'Noto Serif SC',serif;
    font-weight:900;
    font-size:26px;
    color:#fff;
    letter-spacing:2px;
    line-height:1.2;
  }
  .brand-sub{
    font-size:11px;
    letter-spacing:4px;
    color:var(--amber);
    margin-top:8px;
    text-transform:uppercase;
  }
  .brand-deco{
    width:32px;height:2px;
    background:var(--amber);
    margin-top:16px;
  }
  .nav{flex:1}
  .nav-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    color:#C4B8A0;
    text-decoration:none;
    border-radius:8px;
    margin-bottom:6px;
    font-size:14px;
    font-weight:500;
    transition:all .25s;
    cursor:pointer;
    border:1px solid transparent;
  }
  .nav-item:hover{background:rgba(212,165,116,.1);color:#fff}
  .nav-item.active{
    background:rgba(212,165,116,.15);
    color:var(--amber);
    border-color:rgba(212,165,116,.25);
  }
  .nav-item svg{width:18px;height:18px;flex-shrink:0}
  .nav-num{
    font-family:'Noto Serif SC',serif;
    font-size:11px;
    opacity:.5;
    margin-left:auto;
  }
  .sidebar-foot{
    font-size:11px;
    color:#7A6F5C;
    line-height:1.8;
    border-top:1px solid rgba(212,165,116,.2);
    padding-top:16px;
  }

  /* 主内容 */
  .main{
    margin-left:260px;
    flex:1;
    padding:48px 56px 80px;
    max-width:calc(100vw - 260px);
  }

  /* 页头 */
  .page-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:40px;
    padding-bottom:24px;
    border-bottom:1px solid var(--line);
  }
  .page-title{
    font-family:'Noto Serif SC',serif;
    font-weight:700;
    font-size:38px;
    color:var(--ink-green);
    line-height:1.2;
  }
  .page-desc{
    font-size:13px;
    color:var(--text-soft);
    margin-top:8px;
    letter-spacing:.5px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:12px 24px;
    border-radius:8px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    border:none;
    transition:all .2s;
    font-family:inherit;
  }
  .btn-primary{
    background:var(--ink-green);
    color:#fff;
  }
  .btn-primary:hover{background:var(--ink-green-2);transform:translateY(-1px);box-shadow:0 6px 20px rgba(15,61,46,.25)}
  .btn-ghost{
    background:transparent;
    color:var(--ink-green);
    border:1px solid var(--ink-green);
  }
  .btn-ghost:hover{background:var(--ink-green);color:#fff}
  .btn svg{width:16px;height:16px}

  /* 视图切换 */
  .view{display:none;animation:fade .4s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* 统计条 */
  .stats-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:40px;
  }
  .stat-card{
    background:#fff;
    border-radius:12px;
    padding:24px;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  .stat-card::before{
    content:'';
    position:absolute;
    top:0;left:0;
    width:3px;height:100%;
    background:var(--amber);
  }
  .stat-card.green::before{background:var(--moss)}
  .stat-card.brick::before{background:var(--brick)}
  .stat-num{
    font-family:'Noto Serif SC',serif;
    font-weight:700;
    font-size:42px;
    color:var(--ink-green);
    line-height:1;
  }
  .stat-label{
    font-size:12px;
    color:var(--text-soft);
    margin-top:8px;
    letter-spacing:1px;
  }
  .stat-trend{
    font-size:11px;
    color:var(--moss);
    margin-top:6px;
  }

  /* 面试卡片 */
  .filter-bar{
    display:flex;
    gap:10px;
    margin-bottom:24px;
    flex-wrap:wrap;
  }
  .chip{
    padding:8px 18px;
    border-radius:20px;
    font-size:13px;
    background:#fff;
    border:1px solid var(--line);
    color:var(--text-soft);
    cursor:pointer;
    transition:all .2s;
  }
  .chip:hover{border-color:var(--amber)}
  .chip.active{
    background:var(--ink-green);
    color:#fff;
    border-color:var(--ink-green);
  }

  .interview-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(380px,1fr));
    gap:20px;
  }
  .iv-card{
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    cursor:pointer;
    transition:all .3s;
    position:relative;
  }
  .iv-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
  .iv-stripe{
    height:5px;
    background:var(--moss);
  }
  .iv-stripe.fail{background:var(--brick)}
  .iv-stripe.pending{background:var(--amber)}
  .iv-body{padding:22px 24px}
  .iv-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:14px;
  }
  .iv-company{
    font-family:'Noto Serif SC',serif;
    font-weight:700;
    font-size:20px;
    color:var(--ink-green);
  }
  .iv-date{
    font-size:12px;
    color:var(--text-soft);
  }
  .iv-pos{
    font-size:14px;
    color:var(--text);
    margin-bottom:12px;
    font-weight:500;
  }
  .iv-meta{
    display:flex;
    gap:8px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .tag{
    font-size:11px;
    padding:3px 10px;
    border-radius:4px;
    letter-spacing:.5px;
  }
  .tag-round{background:var(--paper);color:var(--text-soft)}
  .tag-result-pass{background:rgba(45,106,79,.12);color:var(--moss)}
  .tag-result-fail{background:rgba(196,69,54,.12);color:var(--brick)}
  .tag-result-pending{background:rgba(212,165,116,.18);color:var(--amber-deep)}
  .tag-mood{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-soft);
  }
  .iv-summary{
    font-size:13px;
    color:var(--text-soft);
    line-height:1.6;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .iv-q-count{
    margin-top:12px;
    font-size:12px;
    color:var(--amber-deep);
    display:flex;
    align-items:center;
    gap:6px;
  }

  /* 知识库 */
  .kp-layout{display:grid;grid-template-columns:1fr;gap:24px}
  .kp-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:16px;
  }
  .kp-card{
    background:#fff;
    border-radius:10px;
    padding:22px;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    cursor:pointer;
    transition:all .25s;
  }
  .kp-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--amber)}
  .kp-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:12px;
  }
  .kp-title{
    font-family:'Noto Serif SC',serif;
    font-weight:600;
    font-size:17px;
    color:var(--ink-green);
  }
  .kp-cat{
    font-size:10px;
    padding:3px 8px;
    background:var(--paper);
    border-radius:4px;
    color:var(--text-soft);
    letter-spacing:.5px;
  }
  .kp-desc{
    font-size:13px;
    color:var(--text-soft);
    margin-bottom:14px;
    line-height:1.6;
  }
  .mastery-bar{
    height:6px;
    background:var(--paper);
    border-radius:3px;
    overflow:hidden;
    margin-bottom:6px;
  }
  .mastery-fill{
    height:100%;
    border-radius:3px;
    transition:width 1s ease;
  }
  .mastery-fill.weak{background:var(--brick)}
  .mastery-fill.mid{background:var(--amber)}
  .mastery-fill.strong{background:var(--moss)}
  .mastery-meta{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--text-soft);
  }
  .kp-status{
    font-weight:600;
  }
  .kp-status.weak{color:var(--brick)}
  .kp-status.mid{color:var(--amber-deep)}
  .kp-status.strong{color:var(--moss)}

  /* 看板 */
  .dash-grid{
    display:grid;
    grid-template-columns:1.2fr 1fr;
    gap:24px;
    margin-bottom:24px;
  }
  .panel{
    background:#fff;
    border-radius:12px;
    padding:28px;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
  }
  .panel-title{
    font-family:'Noto Serif SC',serif;
    font-weight:600;
    font-size:18px;
    color:var(--ink-green);
    margin-bottom:20px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .panel-title::before{
    content:'';
    width:4px;height:18px;
    background:var(--amber);
    border-radius:2px;
  }
  .radar-wrap{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px;
  }
  .legend{
    display:flex;
    flex-direction:column;
    gap:14px;
    justify-content:center;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
  }
  .legend-dot{
    width:10px;height:10px;border-radius:50%;
  }
  .legend-val{
    margin-left:auto;
    font-family:'Noto Serif SC',serif;
    font-weight:700;
    color:var(--ink-green);
  }

  /* 时间轴 */
  .timeline{position:relative;padding-left:28px}
  .timeline::before{
    content:'';
    position:absolute;
    left:6px;top:6px;bottom:6px;
    width:2px;
    background:var(--line);
  }
  .tl-item{
    position:relative;
    padding-bottom:24px;
  }
  .tl-item::before{
    content:'';
    position:absolute;
    left:-28px;top:4px;
    width:14px;height:14px;
    border-radius:50%;
    background:#fff;
    border:3px solid var(--amber);
  }
  .tl-item.pass::before{border-color:var(--moss)}
  .tl-item.fail::before{border-color:var(--brick)}
  .tl-date{
    font-size:11px;
    color:var(--text-soft);
    letter-spacing:.5px;
  }
  .tl-title{
    font-family:'Noto Serif SC',serif;
    font-weight:600;
    font-size:15px;
    color:var(--ink-green);
    margin:4px 0;
  }
  .tl-desc{font-size:12px;color:var(--text-soft)}

  /* 抽屉 */
  .drawer-mask{
    position:fixed;inset:0;
    background:rgba(15,61,46,.4);
    backdrop-filter:blur(2px);
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s;
  }
  .drawer-mask.show{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;
    top:0;right:0;bottom:0;
    width:520px;
    max-width:90vw;
    background:var(--cream);
    z-index:101;
    transform:translateX(100%);
    transition:transform .35s cubic-bezier(.4,0,.2,1);
    overflow-y:auto;
    box-shadow:-10px 0 40px rgba(0,0,0,.1);
  }
  .drawer.show{transform:none}
  .drawer-head{
    padding:24px 32px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#fff;
    position:sticky;top:0;z-index:2;
  }
  .drawer-title{
    font-family:'Noto Serif SC',serif;
    font-weight:700;
    font-size:22px;
    color:var(--ink-green);
  }
  .close-btn{
    width:32px;height:32px;
    border:none;
    background:var(--paper);
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
    color:var(--text-soft);
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;
  }
  .close-btn:hover{background:var(--brick);color:#fff}
  .drawer-body{padding:28px 32px}

  /* 表单 */
  .form-group{margin-bottom:20px}
  .form-label{
    display:block;
    font-size:13px;
    font-weight:500;
    color:var(--ink-green);
    margin-bottom:8px;
  }
  .form-label .req{color:var(--brick)}
  .form-input,.form-textarea,.form-select{
    width:100%;
    padding:11px 14px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    background:#fff;
    color:var(--text);
    transition:border .2s;
  }
  .form-input:focus,.form-textarea:focus,.form-select:focus{
    outline:none;
    border-color:var(--amber);
    box-shadow:0 0 0 3px rgba(212,165,116,.15);
  }
  .form-textarea{resize:vertical;min-height:80px;line-height:1.6}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .qa-block{
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:14px;
    background:#fff;
    position:relative;
  }
  .qa-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .qa-label{
    font-size:12px;
    color:var(--amber-deep);
    font-weight:600;
    letter-spacing:.5px;
  }
  .qa-del{
    font-size:11px;
    color:var(--brick);
    cursor:pointer;
    background:none;border:none;
    font-family:inherit;
  }
  .qa-del:hover{text-decoration:underline}
  .tag-picker{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:8px;
  }
  .tag-opt{
    font-size:11px;
    padding:4px 10px;
    border:1px solid var(--line);
    border-radius:4px;
    cursor:pointer;
    color:var(--text-soft);
    transition:all .15s;
  }
  .tag-opt:hover{border-color:var(--amber)}
  .tag-opt.sel{
    background:var(--ink-green);
    color:#fff;
    border-color:var(--ink-green);
  }
  .form-actions{
    display:flex;
    gap:12px;
    margin-top:28px;
    padding-top:20px;
    border-top:1px solid var(--line);
  }

  /* 详情抽屉内容 */
  .detail-section{margin-bottom:24px}
  .detail-label{
    font-size:11px;
    color:var(--text-soft);
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .detail-value{
    font-size:15px;
    color:var(--text);
    line-height:1.7;
  }
  .detail-qa{
    border-left:3px solid var(--amber);
    padding:12px 16px;
    margin-bottom:14px;
    background:#fff;
    border-radius:0 8px 8px 0;
  }
  .detail-q{
    font-weight:600;
    color:var(--ink-green);
    margin-bottom:6px;
    font-size:14px;
  }
  .detail-a{
    font-size:13px;
    color:var(--text);
    margin-bottom:6px;
  }
  .detail-imp{
    font-size:12px;
    color:var(--brick);
    background:rgba(196,69,54,.06);
    padding:6px 10px;
    border-radius:4px;
    margin-top:6px;
  }

  /* 空状态 */
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--text-soft);
  }
  .empty-icon{
    font-size:48px;
    opacity:.3;
    margin-bottom:12px;
  }

  /* Toast */
  .toast{
    position:fixed;
    bottom:32px;left:50%;
    transform:translateX(-50%) translateY(100px);
    background:var(--ink-green);
    color:#fff;
    padding:14px 28px;
    border-radius:8px;
    font-size:14px;
    box-shadow:0 8px 30px rgba(15,61,46,.3);
    z-index:200;
    transition:transform .35s cubic-bezier(.4,0,.2,1);
  }
  .toast.show{transform:translateX(-50%)}

  /* 响应式 */
  @media (max-width:1024px){
    .sidebar{transform:translateX(-100%);transition:transform .3s}
    .sidebar.open{transform:none}
    .main{margin-left:0;max-width:100%;padding:32px 24px 60px}
    .stats-row{grid-template-columns:repeat(2,1fr)}
    .dash-grid{grid-template-columns:1fr}
    .menu-toggle{display:flex!important}
  }
  .menu-toggle{
    display:none;
    position:fixed;
    top:20px;right:20px;
    z-index:60;
    width:42px;height:42px;
    background:var(--ink-green);
    border-radius:8px;
    align-items:center;justify-content:center;
    cursor:pointer;
    color:#fff;
  }
</style>
</head>
<body>

<div class="topbar"></div>

<button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>

<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">面试沉淀录</div>
      <div class="brand-sub">INTERVIEW · ARCHIVE</div>
      <div class="brand-deco"></div>
    </div>
    <nav class="nav">
      <div class="nav-item active" data-view="workshop" onclick="switchView('workshop')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="14" y2="17"/></svg>
        <span>面试复盘</span>
        <span class="nav-num" id="navIvCount">壹</span>
      </div>
      <div class="nav-item" data-view="knowledge" onclick="switchView('knowledge')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span>知识沉淀</span>
        <span class="nav-num" id="navKpCount">壹</span>
      </div>
      <div class="nav-item" data-view="dashboard" onclick="switchView('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>数据看板</span>
        <span class="nav-num">叁</span>
      </div>
    </nav>
    <div class="sidebar-foot">

/* ============ 视图切换 ============ */
function switchView(view){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelector(`.nav-item[data-view="${view}"]`).classList.add('active');
  document.querySelector('.sidebar').classList.remove('open');
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderIvStats(){
  const total = state.interviews.length;
  const pass = state.interviews.filter(i=>i.result==='通过').length;
  const fail = state.interviews.filter(i=>i.result==='未通过').length;
  const rate = total? Math.round(pass/total*100):0;
  document.getElementById('ivStats').innerHTML = `
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">面试总数</div><div class="stat-trend">↑ 持续积累中</div></div>
    <div class="stat-card green"><div class="stat-num">${pass}</div><div class="stat-label">通过</div><div class="stat-trend">通过率 ${rate}%</div></div>
    <div class="stat-card brick"><div class="stat-num">${fail}</div><div class="stat-label">未通过</div><div class="stat-trend">每次都是养分</div></div>
    <div class="stat-card"><div class="stat-num">${rate}%</div><div class="stat-label">通过率</div><div class="stat-trend">${rate>=50?'表现稳健':'仍有提升空间'}</div></div>

}

function renderIvFilter(){

  ).join('');

function setIvFilter(c){state.ivFilter=c;renderIvFilter();renderIvList()}

function renderIvList(){
  const list = state.ivFilter==='全部'?state.interviews:state.interviews.filter(i=>i.company===state.ivFilter);
  list.sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!list.length){
    document.getElementById('ivList').innerHTML = `<div class="empty"><div class="empty-icon">📝</div>还没有面试记录<br>点击右上角"新建复盘"开始沉淀</div>`;
    return;
  }
  document.getElementById('ivList').innerHTML = list.map(iv=>{
    const stripeCls = iv.result==='通过'?'':iv.result==='未通过'?'fail':'pending';
    const resultTag = iv.result==='通过'?'tag-result-pass':iv.result==='未通过'?'tag-result-fail':'tag-result-pending';
    return `
    <div class="iv-card" onclick="openDetail('${iv.id}')">

      <div class="iv-body">

        <div class="iv-pos">${iv.position}</div>
        <div class="iv-meta">
          <span class="tag tag-round">${iv.round}</span>
          <span class="tag ${resultTag}">${iv.result}</span>
          <span class="tag tag-mood">${iv.mood}</span>

        <div class="iv-summary">${iv.summary}</div>
        <div class="iv-q-count">

          ${iv.questions.length} 个问题 · ${iv.questions.reduce((s,q)=>s+q.tags.length,0)} 个知识点
        </div>
      </div>
    </div>`;
  }).join('');
}

function formatDate(d){
  const dt = new Date(d);
  return `${dt.getMonth()+1}月${dt.getDate()}日`;
}

      <div class="kp-desc">${k.desc}</div>
      <div class="mastery-bar"><div class="mastery-fill ${s.cls}" style="width:${k.mastery}%"></div></div>
      <div class="mastery-meta">
        <span class="kp-status ${s.cls}">${k.status}</span>
        <span>掌握度 ${k.mastery}% · 复习 ${k.reviewCount} 次</span>
      </div>
    </div>`;
  }).join('');
}

function reviewKp(id){
  const k = state.knowledge.find(x=>x.id===id);
  if(!k) return;
  k.mastery = Math.min(100,k.mastery+5);
  k.reviewCount++;
  k.lastReview = new Date().toISOString().slice(0,10);
  if(k.mastery>=80) k.status='已掌握';
  else if(k.mastery>=50) k.status='巩固中';
  else k.status='薄弱';
  saveData();
  renderKpStats();renderKpList();
  showToast(`已复习「${k.title}」 · 掌握度 +5%`);
}

/* ============ 数据看板 ============ */
function renderDashboard(){
  renderRadar();
  renderDist();
  renderTimeline();
}

function renderRadar(){
  const cats = ['JavaScript','框架原理','浏览器原理','工程化','计算机网络','算法'];
  const data = cats.map(c=>{
    const items = state.knowledge.filter(k=>k.category===c);
    return items.length? Math.round(items.reduce((s,k)=>s+k.mastery,0)/items.length):0;
  });
  const size=320,cx=160,cy=160,max=100,layers=5;
  const angle = i=> -Math.PI/2 + i*2*Math.PI/cats.length;
  const pt = (r,i)=>[cx+r*Math.cos(angle(i)),cy+r*Math.sin(angle(i))];
  let grid='';
  for(let l=1;l<=layers;l++){
    const r = (size/2-30)*l/layers;
    const pts = cats.map((_,i)=>pt(r,i).join(',')).join(' ');
    grid += `<polygon points="${pts}" fill="none" stroke="#E0D9CC" stroke-width="1"/>`;
  }
  let axes='',labels='';
  cats.forEach((c,i)=>{
    const [x,y]=pt(size/2-20,i);
    const [lx,ly]=pt(size/2+5,i);
    axes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E0D9CC"/>`;
    labels+=`<text x="${lx}" y="${ly}" text-anchor="middle" font-size="11" fill="#6B5D4F" font-family="Noto Sans SC">${c}</text>`;
  });
  const dataPts = data.map((v,i)=>pt((size/2-30)*v/max,i).join(',')).join(' ');
  const dataPoly = `<polygon points="${dataPts}" fill="rgba(212,165,116,.25)" stroke="#D4A574" stroke-width="2"/>`;
  const dots = data.map((v,i)=>{
    const [x,y]=pt((size/2-30)*v/max,i);
    return `<circle cx="${x}" cy="${y}" r="4" fill="#0F3D2E"><title>${cats[i]}: ${v}%</title></circle>`;
  }).join('');
  document.getElementById('radarBox').innerHTML = `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      ${grid}${axes}${dataPoly}${dots}${labels}
    </svg>`;
}

function renderDist(){
  const strong = state.knowledge.filter(k=>k.status==='已掌握').length;
  const mid = state.knowledge.filter(k=>k.status==='巩固中').length;
  const weak = state.knowledge.filter(k=>k.status==='薄弱').length;
  const total = state.knowledge.length||1;
  document.getElementById('distLegend').innerHTML = [
    {label:'已掌握',count:strong,color:'var(--moss)'},
    {label:'巩固中',count:mid,color:'var(--amber)'},
    {label:'薄弱',count:weak,color:'var(--brick)'}
  ].map(d=>`
    <div class="legend-item">
      <span class="legend-dot" style="background:${d.color}"></span>
      <span>${d.label}</span>
      <span class="legend-val">${d.count} · ${Math.round(d.count/total*100)}%</span>
    </div>
  `).join('') + `
    <div style="margin-top:16px;padding:16px;background:var(--paper);border-radius:8px;font-size:12px;color:var(--text-soft);line-height:1.7">
      建议：优先攻克 <b style="color:var(--brick)">${weak}</b> 个薄弱知识点<br>每周复习 2-3 次，可将掌握度提升约 15%
    </div>
  `;
}

function renderTimeline(){
  const sorted = [...state.interviews].sort((a,b)=>new Date(b.date)-new Date(a.date));
  document.getElementById('timeline').innerHTML = sorted.map(iv=>{
    const cls = iv.result==='通过'?'pass':iv.result==='未通过'?'fail':'';
    return `
    <div class="tl-item ${cls}">
      <div class="tl-date">${iv.date} · ${iv.round}</div>
      <div class="tl-title">${iv.company} · ${iv.position}</div>
      <div class="tl-desc">结果：${iv.result} · ${iv.questions.length}个问题 · ${iv.mood}</div>
    </div>`;
  }).join('');
}

/* ============ 抽屉：新建复盘 ============ */
function openNewForm(){
  state.editingId = null;
  document.getElementById('formTitle').textContent = '新建面试复盘';
  document.getElementById('ivForm').reset();
  document.querySelector('#ivForm [name="date"]').value = new Date().toISOString().slice(0,10);
  document.getElementById('qaContainer').innerHTML = '';
  addQA();
  document.getElementById('drawerForm').classList.add('show');
  document.getElementById('maskForm').classList.add('show');
}

function closeForm(){
  document.getElementById('drawerForm').classList.remove('show');
  document.getElementById('maskForm').classList.remove('show');
}

function addQA(){
  const c = document.getElementById('qaContainer');
  const idx = c.children.length;
  const div = document.createElement('div');
  div.className = 'qa-block';
  div.innerHTML = `
    <div class="qa-head">
      <span class="qa-label">问题 ${idx+1}</span>
      <button type="button" class="qa-del" onclick="this.closest('.qa-block').remove()">删除</button>
    </div>
    <div class="form-group" style="margin-bottom:10px">
      <input class="form-input" name="q_${idx}" placeholder="面试官问了什么？">
    </div>
    <div class="form-group" style="margin-bottom:10px">
      <textarea class="form-textarea" name="a_${idx}" placeholder="你是怎么回答的？" style="min-height:60px"></textarea>
    </div>
    <div class="form-group" style="margin-bottom:0">
      <input class="form-input" name="imp_${idx}" placeholder="可以改进的地方（可选）">
    </div>
    <div class="tag-picker">
      ${KNOWLEDGE_TAGS.map(t=>`<span class="tag-opt" onclick="this.classList.toggle('sel')">${t}</span>`).join('')}
    </div>
  `;
  c.appendChild(div);
}

function submitForm(e){
  e.preventDefault();
  const f = e.target;
  const qaBlocks = [...document.querySelectorAll('#qaContainer .qa-block')];
  const questions = qaBlocks.map((b,i)=>({
    question:b.querySelector(`[name="q_${i}"]`).value,
    myAnswer:b.querySelector(`[name="a_${i}"]`).value,
    improvement:b.querySelector(`[name="imp_${i}"]`).value,
    tags:[...b.querySelectorAll('.tag-opt.sel')].map(t=>t.textContent)
  })).filter(q=>q.question);

  const newIv = {
    id: state.editingId || ('iv-'+Date.now()),
    company:f.company.value,position:f.position.value,date:f.date.value,
    round:f.round.value,result:f.result.value,mood:f.mood.value,
    summary:f.summary.value,questions
  };

  if(state.editingId){
    const idx = state.interviews.findIndex(i=>i.id===state.editingId);
    state.interviews[idx] = newIv;
  }else{
    state.interviews.push(newIv);
  }

  // 自动同步知识点
  syncKnowledge(questions);

  saveData();
  closeForm();
  renderAll();
  showToast(state.editingId?'复盘已更新':'复盘已保存，知识点已沉淀');
}

function syncKnowledge(questions){
  questions.forEach(q=>{
    q.tags.forEach(tag=>{
      let kp = state.knowledge.find(k=>k.title===tag || k.category===tag);
      if(!kp && KNOWLEDGE_TAGS.includes(tag)){
        // 创建新知识点（以标签为分类的代表）
        const existing = state.knowledge.filter(k=>k.category===tag);
        if(existing.length){
          existing.forEach(k=>{
            if(q.improvement) k.mastery = Math.max(20,k.mastery-5);
            if(k.mastery<50) k.status='薄弱';
            else if(k.mastery<80) k.status='巩固中';
          });
        }
      }
    });
  });
}

/* ============ 抽屉：详情 ============ */
function openDetail(id){
  const iv = state.interviews.find(i=>i.id===id);
  if(!iv) return;
  document.getElementById('detailTitle').textContent = `${iv.company} · ${iv.position}`;
  const resultTag = iv.result==='通过'?'tag-result-pass':iv.result==='未通过'?'tag-result-fail':'tag-result-pending';
  document.getElementById('detailBody').innerHTML = `
    <div class="detail-section">
      <div class="detail-label">基本信息</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        <span class="tag tag-round">${iv.round}</span>
        <span class="tag ${resultTag}">${iv.result}</span>
        <span class="tag tag-mood">${iv.mood}</span>
        <span class="tag tag-round">${formatDate(iv.date)}</span>
      </div>
    </div>
    <div class="detail-section">
      <div class="detail-label">整体总结</div>
      <div class="detail-value">${iv.summary || '未填写'}</div>
    </div>
    <div class="detail-section">
      <div class="detail-label">问题复盘（${iv.questions.length}）</div>
      ${iv.questions.map(q=>`
        <div class="detail-qa">
          <div class="detail-q">Q：${q.question}</div>
          ${q.myAnswer?`<div class="detail-a">A：${q.myAnswer}</div>`:''}
          ${q.improvement?`<div class="detail-imp">改进：${q.improvement}</div>`:''}
          ${q.tags.length?`<div style="margin-top:8px">${q.tags.map(t=>`<span class="tag tag-round" style="margin-right:6px">${t}</span>`).join('')}</div>`:''}
        </div>
      `).join('')}
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="deleteIv('${iv.id}')">删除复盘</button>
    </div>
  `;
  document.getElementById('drawerDetail').classList.add('show');
  document.getElementById('maskDetail').classList.add('show');
}

function closeDetail(){
  document.getElementById('drawerDetail').classList.remove('show');
  document.getElementById('maskDetail').classList.remove('show');
}

function deleteIv(id){
  if(!confirm('确认删除这条面试复盘？')) return;
  state.interviews = state.interviews.filter(i=>i.id!==id);
  saveData();
  closeDetail();
  renderAll();
  showToast('复盘已删除');
}

/* ============ 工具 ============ */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function renderAll(){
  renderIvStats();renderIvFilter();renderIvList();
  renderKpStats();renderKpFilter();renderKpList();
  renderDashboard();
  document.getElementById('navIvCount').textContent = toChNum(state.interviews.length);
  document.getElementById('navKpCount').textContent = toChNum(state.knowledge.length);
}

function toChNum(n){
  const map=['零','壹','贰','叁','肆','伍','陆','柒','捌','玖','拾'];
  return n<=10?map[n]:n;
}

/* ============ 初始化 ============ */
loadData();
renderAll();
window.addEventListener('hashchange',()=>{
  const v = location.hash.slice(1);
  if(['workshop','knowledge','dashboard'].includes(v)) switchView(v);
});
if(location.hash) switchView(location.hash.slice(1));
</script>
