<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 - 教案叙事工坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#FAF8F5',
                        cream: '#F5F2ED',
                        creamDark: '#EDE8E3',
                        warmGray: '#5C5451',
                        warmGrayLight: '#8A827E',
                        teal: {
                            light: '#5DBB9D',
                            DEFAULT: '#4AA086',
                            dark: '#3A8A70'
                        },
                        accent: '#E8A87C',
                        mint: '#C3E8D1',
                        rose: '#F8D7DA'
                    },
                    fontFamily: {
                        'serif-cn': ['Noto Serif SC', 'serif'],
                        'sans-cn': ['Noto Sans SC', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        @layer utilities {
            .card-hover {
                transition: transform 0.3s ease, box-shadow 0.3s ease;
            }
            .card-hover:hover {
                transform: translateY(-4px);
                box-shadow: 0 12px 24px rgba(93, 187, 157, 0.15);
            }
            .toggle-switch {
                position: relative;
                width: 52px;
                height: 28px;
                background: #EDE8E3;
                border-radius: 14px;
                cursor: pointer;
                transition: background 0.3s ease;
            }
            .toggle-switch.active {
                background: #5DBB9D;
            }
            .toggle-switch::after {
                content: '';
                position: absolute;
                top: 2px;
                left: 2px;
                width: 24px;
                height: 24px;
                background: white;
                border-radius: 50%;
                transition: left 0.3s ease;
            }
            .toggle-switch.active::after {
                left: 26px;
            }
        }
    </style>
</head>
<body class="bg-cream font-sans-cn min-h-screen">
    <!-- 导航栏 -->
    <nav class="fixed top-0 left-0 right-0 bg-paper/95 backdrop-blur-md shadow-sm z-50">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <a href="index.html" class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-teal-light to-teal-dark rounded-xl flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                        </svg>
                    </div>
                    <span class="font-serif-cn text-xl font-bold text-warm-gray">教案叙事工坊</span>
                </a>
                <div class="flex items-center space-x-4">
                    <a href="index.html" class="text-warm-gray hover:text-teal-dark transition-colors px-3 py-1 rounded-lg">首页</a>
                    <a href="create.html" class="text-warm-gray hover:text-teal-dark transition-colors px-3 py-1 rounded-lg">新建教案</a>
                    <a href="library.html" class="text-warm-gray hover:text-teal-dark transition-colors px-3 py-1 rounded-lg">教案库</a>
                    <a href="settings.html" class="bg-teal-light/20 text-teal-dark font-semibold px-3 py-1 rounded-lg">设置</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 页面装饰背景 -->
    <div class="absolute top-0 left-0 right-0 h-32 bg-gradient-to-b from-mint/30 to-transparent pointer-events-none"></div>

    <!-- 主内容区 -->
    <div class="container mx-auto px-6 pt-28 pb-16">
        <!-- 页面标题区 -->
        <div class="text-center mb-12 relative">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-teal-dark to-teal-light rounded-2xl shadow-lg mb-6">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </div>
            <h2 class="font-serif-cn text-4xl font-bold text-warm-gray mb-4">设置</h2>
            <p class="text-warm-gray/70">个性化您的使用体验</p>
        </div>

        <!-- 设置内容 -->
        <div class="max-w-2xl mx-auto">
            <!-- 主题设置 -->
            <div class="bg-paper rounded-2xl shadow-lg p-6 mb-6">
                <h3 class="font-serif-cn text-lg font-semibold text-warm-gray mb-4 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-teal-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 3v16M16 3v16M21 12H3"></path>
                    </svg>
                    主题设置
                </h3>
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-warm-gray font-medium">深色模式</p>
                            <p class="text-warm-gray/60 text-sm">切换到深色主题，保护眼睛</p>
                        </div>
                        <div class="toggle-switch" id="darkModeToggle" onclick="toggleDarkMode()"></div>
                    </div>
                </div>
            </div>

            <!-- 字体设置 -->
            <div class="bg-paper rounded-2xl shadow-lg p-6 mb-6">
                <h3 class="font-serif-cn text-lg font-semibold text-warm-gray mb-4 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-teal-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                    </svg>
                    字体设置
                </h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-warm-gray font-medium mb-2">字体大小</label>
                        <select id="fontSize" class="w-full px-4 py-3 bg-cream border border-teal-light/30 rounded-xl outline-none">
                            <option value="small">小号</option>
                            <option value="medium">中号</option>
                            <option value="large">大号</option>
                            <option value="xlarge">特大号</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 数据管理 -->
            <div class="bg-paper rounded-2xl shadow-lg p-6 mb-6">
                <h3 class="font-serif-cn text-lg font-semibold text-warm-gray mb-4 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-teal-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path>
                    </svg>
                    数据管理
                </h3>
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-warm-gray font-medium">自动保存</p>
                            <p class="text-warm-gray/60 text-sm">自动保存您的教案数据</p>
                        </div>
                        <div class="toggle-switch active" id="autoSaveToggle" onclick="toggleAutoSave()"></div>
                    </div>
                    <button onclick="clearAllData()" class="w-full px-4 py-3 bg-red-100 text-red-500 rounded-xl hover:bg-red-200 transition-colors font-medium">
                        清空所有数据
                    </button>
                </div>
            </div>

            <!-- 关于 -->
            <div class="bg-paper rounded-2xl shadow-lg p-6">
                <h3 class="font-serif-cn text-lg font-semibold text-warm-gray mb-4 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-teal-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    关于
                </h3>
                <div class="space-y-2 text-warm-gray/70">
                    <p>教案叙事工坊 v1.0</p>
                    <p>面向师范生与中小学教师的叙事化备课助手</p>
                    <p>TRAE全民AI创造力大赛参赛作品</p>
                    <p class="text-sm mt-4 text-warm-gray/50">Made with ❤️ for TRAE AI Creativity Competition</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast消息提示 -->
    <div id="toast" class="fixed bottom-6 right-6 px-6 py-3 rounded-xl shadow-lg transform translate-x-full transition-transform duration-300 z-50">
        <div class="flex items-center">
            <svg id="toastIcon" class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"></svg>
            <span id="toastMessage"></span>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
