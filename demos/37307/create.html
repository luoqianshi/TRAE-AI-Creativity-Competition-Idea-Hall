<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建教案 - 教案叙事工坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#FAF8F5',
                        cream: '#F5F2ED',
                        creamDark: '#EDE8E3',
                        warmGray: '#5C5451',
                        warmGrayLight: '#8A827E',
                        teal: {
                            light: '#5DBB9D',
                            DEFAULT: '#4AA086',
                            dark: '#3A8A70'
                        },
                        accent: '#E8A87C',
                        mint: '#C3E8D1',
                        rose: '#F8D7DA'
                    },
                    fontFamily: {
                        'serif-cn': ['Noto Serif SC', 'serif'],
                        'sans-cn': ['Noto Sans SC', 'sans-serif']
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'fade-in': 'fadeIn 0.6s ease-out forwards'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @layer utilities {
            .card-hover {
                transition: transform 0.3s ease, box-shadow 0.3s ease;
            }
            .card-hover:hover {
                transform: translateY(-4px);
                box-shadow: 0 12px 24px rgba(93, 187, 157, 0.15);
            }
            .input-focus {
                transition: border-color 0.3s ease, box-shadow 0.3s ease;
            }
            .input-focus:focus {
                border-color: #5DBB9D;
                box-shadow: 0 0 0 3px rgba(93, 187, 157, 0.1);
            }
        }
    </style>
</head>
<body class="bg-cream font-sans-cn min-h-screen">
    <!-- 导航栏 -->
    <nav class="fixed top-0 left-0 right-0 bg-paper/95 backdrop-blur-md shadow-sm z-50">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <a href="index.html" class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-teal-light to-teal-dark rounded-xl flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                        </svg>
                    </div>
                    <span class="font-serif-cn text-xl font-bold text-warm-gray">教案叙事工坊</span>
                </a>
                <div class="flex items-center space-x-4">
                    <a href="index.html" class="text-warm-gray hover:text-teal-dark transition-colors px-3 py-1 rounded-lg">首页</a>
                    <a href="create.html" class="bg-teal-light/20 text-teal-dark font-semibold px-3 py-1 rounded-lg">新建教案</a>
                    <a href="library.html" class="text-warm-gray hover:text-teal-dark transition-colors px-3 py-1 rounded-lg">教案库</a>
                    <a href="settings.html" class="text-warm-gray hover:text-teal-dark transition-colors px-3 py-1 rounded-lg">设置</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 页面装饰背景 -->
    <div class="absolute top-0 left-0 right-0 h-32 bg-gradient-to-b from-teal-light/20 to-transparent pointer-events-none"></div>

    <!-- 主内容区 -->
    <div class="container mx-auto px-6 pt-28 pb-16">
        <!-- 页面标题区 -->
        <div class="text-center mb-12 relative">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-teal-light to-teal-dark rounded-2xl shadow-lg mb-6">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
            </div>
            <h2 class="font-serif-cn text-4xl font-bold text-warm-gray mb-4">新建教案</h2>
            <p class="text-warm-gray/70">填写课程基本信息，开启叙事化备课之旅</p>
        </div>

        <!-- 备课输入区 -->
        <div class="max-w-4xl mx-auto">
            <div class="bg-paper rounded-2xl shadow-lg p-8">
                <h3 class="font-serif-cn text-xl font-semibold text-warm-gray mb-6">课程信息</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 学段选择 -->
                    <div>
                        <label class="block text-warm-gray font-medium mb-2">学段</label>
                        <select id="gradeLevel" class="w-full px-4 py-3 bg-cream border border-teal-light/30 rounded-xl input-focus outline-none">
                            <option value="">请选择学段</option>
                            <option value="小学">小学</option>
                            <option value="初中">初中</option>
                            <option value="高中">高中</option>
                        </select>
                    </div>

                    <!-- 科目选择 -->
                    <div>
                        <label class="block text-warm-gray font-medium mb-2">科目</label>
                        <select id="subject" class="w-full px-4 py-3 bg-cream border border-teal-light/30 rounded-xl input-focus outline-none">
                            <option value="">请选择科目</option>
                            <option value="语文">语文</option>
                            <option value="数学">数学</option>
                            <option value="英语">英语</option>
                            <option value="物理">物理</option>
                            <option value="化学">化学</option>
                            <option value="生物">生物</option>
                            <option value="历史">历史</option>
                            <option value="地理">地理</option>
                            <option value="政治">政治</option>
                        </select>
                    </div>

                    <!-- 课文题目 -->
                    <div class="md:col-span-2">
                        <label class="block text-warm-gray font-medium mb-2">课文题目</label>
                        <input type="text" id="lessonTitle" placeholder="请输入课文题目" 
                               class="w-full px-4 py-3 bg-cream border border-teal-light/30 rounded-xl input-focus outline-none">
                    </div>

                    <!-- 课时时长 -->
                    <div>
                        <label class="block text-warm-gray font-medium mb-2">课时时长</label>
                        <select id="duration" class="w-full px-4 py-3 bg-cream border border-teal-light/30 rounded-xl input-focus outline-none">
                            <option value="">请选择时长</option>
                            <option value="15分钟">15分钟</option>
                            <option value="30分钟">30分钟</option>
                            <option value="40分钟">40分钟</option>
                            <option value="45分钟">45分钟</option>
                            <option value="60分钟">60分钟</option>
                        </select>
                    </div>
                </div>

                <!-- 功能按钮 -->
                <div class="flex gap-4 mt-8">
                    <button id="generateBtn" class="flex-1 bg-gradient-to-r from-teal-light to-teal-dark text-white font-semibold py-3 px-6 rounded-xl hover:shadow-lg transition-all hover:-translate-y-0.5">
                        🎬 一键生成教案
                    </button>
                    <button id="clearBtn" class="px-6 py-3 bg-cream-dark text-warm-gray font-medium rounded-xl hover:bg-cream transition-colors">
                        清空内容
                    </button>
                </div>
            </div>

            <!-- 生成结果区 -->
            <div id="resultSection" class="mt-8 bg-paper rounded-2xl shadow-lg overflow-hidden" style="display: none;">
                <!-- 课堂情景导入 -->
                <div class="border-b border-teal-light/20">
                    <div class="bg-gradient-to-r from-teal-light to-teal-dark px-6 py-4">
                        <h4 class="font-serif-cn text-lg font-semibold text-white flex items-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                            </svg>
                            课堂情景导入
                        </h4>
                    </div>
                    <div class="p-6">
                        <p id="introContent" class="text-warm-gray leading-relaxed"></p>
                        <button onclick="copyToClipboard('introContent')" class="mt-4 text-teal-dark hover:text-teal-light transition-colors flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                            复制文本
                        </button>
                    </div>
                </div>

                <!-- 故事主线梳理 -->
                <div class="border-b border-teal-light/20">
                    <div class="bg-gradient-to-r from-accent to-orange-400 px-6 py-4">
                        <h4 class="font-serif-cn text-lg font-semibold text-white flex items-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                            </svg>
                            故事主线梳理
                        </h4>
                    </div>
                    <div class="p-6">
                        <p id="storyContent" class="text-warm-gray leading-relaxed"></p>
                        <button onclick="copyToClipboard('storyContent')" class="mt-4 text-teal-dark hover:text-teal-light transition-colors flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                            复制文本
                        </button>
                    </div>
                </div>

                <!-- 课堂互动小游戏 -->
                <div class="border-b border-teal-light/20">
                    <div class="bg-gradient-to-r from-purple-400 to-purple-600 px-6 py-4">
                        <h4 class="font-serif-cn text-lg font-semibold text-white flex items-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            课堂互动小游戏
                        </h4>
                    </div>
                    <div class="p-6">
                        <p id="gameContent" class="text-warm-gray leading-relaxed"></p>
                        <button onclick="copyToClipboard('gameContent')" class="mt-4 text-teal-dark hover:text-teal-light transition-colors flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                            复制文本
                        </button>
                    </div>
                </div>

                <!-- 递进式提问清单 -->
                <div class="border-b border-teal-light/20">
                    <div class="bg-gradient-to-r from-mint to-teal-light px-6 py-4">
                        <h4 class="font-serif-cn text-lg font-semibold text-white flex items-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                            </svg>
                            递进式提问清单
                        </h4>
                    </div>
                    <div class="p-6">
                        <div id="questionContent" class="text-warm-gray leading-relaxed"></div>
                        <button onclick="copyToClipboard('questionContent')" class="mt-4 text-teal-dark hover:text-teal-light transition-colors flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                            复制文本
                        </button>
                    </div>
                </div>

                <!-- 板书设计大纲 -->
                <div>
                    <div class="bg-gradient-to-r from-teal-dark to-teal px-6 py-4">
                        <h4 class="font-serif-cn text-lg font-semibold text-white flex items-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                            </svg>
                            板书设计大纲
                        </h4>
                    </div>
                    <div class="p-6">
                        <div id="blackboardContent" class="text-warm-gray leading-relaxed"></div>
                        <button onclick="copyToClipboard('blackboardContent')" class="mt-4 text-teal-dark hover:text-teal-light transition-colors flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                            复制文本
                        </button>
                    </div>
                </div>

                <!-- 底部操作按钮 -->
                <div class="bg-cream-dark px-6 py-4 flex gap-4">
                    <button id="saveBtn" class="flex-1 bg-gradient-to-r from-teal-light to-teal-dark text-white font-semibold py-3 px-6 rounded-xl hover:shadow-lg transition-all">
                        💾 保存教案
                    </button>
                    <button id="exportWordBtn" class="px-6 py-3 bg-accent text-white font-medium rounded-xl hover:bg-orange-500 transition-colors">
                        📄 导出Word
                    </button>
                    <button id="exportPdfBtn" class="px-6 py-3 bg-purple-500 text-white font-medium rounded-xl hover:bg-purple-600 transition-colors">
                        📑 导出PDF
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast消息提示 -->
    <div id="toast" class="fixed bottom-6 right-6 px-6 py-3 rounded-xl shadow-lg transform translate-x-full transition-transform duration-300 z-50">
        <div class="flex items-center">
            <svg id="toastIcon" class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"></svg>
            <span id="toastMessage"></span>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
