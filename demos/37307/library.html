<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教案库 - 教案叙事工坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#FAF8F5',
                        cream: '#F5F2ED',
                        creamDark: '#EDE8E3',
                        warmGray: '#5C5451',
                        warmGrayLight: '#8A827E',
                        teal: {
                            light: '#5DBB9D',
                            DEFAULT: '#4AA086',
                            dark: '#3A8A70'
                        },
                        accent: '#E8A87C',
                        mint: '#C3E8D1',
                        rose: '#F8D7DA'
                    },
                    fontFamily: {
                        'serif-cn': ['Noto Serif SC', 'serif'],
                        'sans-cn': ['Noto Sans SC', 'sans-serif']
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'fade-in': 'fadeIn 0.6s ease-out forwards'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @layer utilities {
            .card-hover {
                transition: transform 0.3s ease, box-shadow 0.3s ease;
            }
            .card-hover:hover {
                transform: translateY(-4px);
                box-shadow: 0 12px 24px rgba(93, 187, 157, 0.15);
            }
        }
    </style>
</head>
<body class="bg-cream font-sans-cn min-h-screen">
    <!-- 导航栏 -->
    <nav class="fixed top-0 left-0 right-0 bg-paper/95 backdrop-blur-md shadow-sm z-50">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <a href="index.html" class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-teal-light to-teal-dark rounded-xl flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                        </svg>
                    </div>
                    <span class="font-serif-cn text-xl font-bold text-warm-gray">教案叙事工坊</span>
                </a>
                <div class="flex items-center space-x-4">
                    <a href="index.html" class="text-warm-gray hover:text-teal-dark transition-colors px-3 py-1 rounded-lg">首页</a>
                    <a href="create.html" class="text-warm-gray hover:text-teal-dark transition-colors px-3 py-1 rounded-lg">新建教案</a>
                    <a href="library.html" class="bg-teal-light/20 text-teal-dark font-semibold px-3 py-1 rounded-lg">教案库</a>
                    <a href="settings.html" class="text-warm-gray hover:text-teal-dark transition-colors px-3 py-1 rounded-lg">设置</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 页面装饰背景 -->
    <div class="absolute top-0 left-0 right-0 h-32 bg-gradient-to-b from-accent/20 to-transparent pointer-events-none"></div>

    <!-- 主内容区 -->
    <div class="container mx-auto px-6 pt-28 pb-16">
        <!-- 页面标题区 -->
        <div class="text-center mb-12 relative">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-accent to-orange-400 rounded-2xl shadow-lg mb-6">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                </svg>
            </div>
            <h2 class="font-serif-cn text-4xl font-bold text-warm-gray mb-4">我的教案库</h2>
            <p class="text-warm-gray/70">管理和查看您创建的所有教案</p>
        </div>

        <!-- 教案列表 -->
        <div id="lessonList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 教案卡片将通过JavaScript动态生成 -->
        </div>
    </div>

    <!-- Toast消息提示 -->
    <div id="toast" class="fixed bottom-6 right-6 px-6 py-3 rounded-xl shadow-lg transform translate-x-full transition-transform duration-300 z-50">
        <div class="flex items-center">
            <svg id="toastIcon" class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"></svg>
            <span id="toastMessage"></span>
        </div>
    </div>

    <!-- 查看教案弹窗 -->
    <div id="viewModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50" style="display: none;">
        <div class="bg-paper rounded-2xl shadow-2xl max-w-3xl w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div class="bg-gradient-to-r from-teal-light to-teal-dark px-6 py-4 flex justify-between items-center">
                <h3 class="font-serif-cn text-xl font-semibold text-white" id="modalTitle">教案详情</h3>
                <button onclick="closeModal()" class="text-white/80 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="p-6" id="modalContent">
                <!-- 教案内容将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
