        ::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 3px; }

    </style>

// ==================== 状态管理 ====================
let currentSection = 'home';
let currentQuiz = 0;
let userAnswers = [];
let quizSubmitted = false;

// ==================== 页面渲染 ====================
function showSection(section) {
    currentSection = section;
    updateNavActive();
    const main = document.getElementById('mainContent');
    switch(section) {
        case 'home': renderHome(); break;
        case 'knowledge': renderKnowledge(); break;
        case 'quiz': renderQuiz(); break;
    }
}

function updateNavActive() {
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    if (currentSection === 'home') document.querySelector('.nav-item:nth-child(1)').classList.add('active');
    else if (currentSection === 'knowledge') document.querySelector('.nav-item:nth-child(3)').classList.add('active');
    else if (currentSection === 'quiz') document.querySelector('.nav-item:nth-child(5)').classList.add('active');
}

function renderHome() {
    document.getElementById('mainContent').innerHTML = `
        <div class="welcome-section">
            <h2>初中计算机会考复习系统</h2>
            <p>本系统涵盖初中计算机会考全部知识点，包含计算机基础、操作系统、网络基础、办公软件、多媒体技术五大板块。<br>
            提供标准化模拟试卷，助你系统复习、高效备考。</p>
            <div class="feature-cards">
                <div class="feature-card" onclick="showSection('knowledge')">
                    <div class="icon">📚</div>
                    <h3>知识点学习</h3>
                    <p>五大板块系统整理，覆盖会考全部考点</p>
                </div>
                <div class="feature-card" onclick="showSection('quiz')">
                    <div class="icon">✏️</div>
                    <h3>模拟练习</h3>
                    <p>模拟试卷，自动评分，详细解析</p>
                </div>
            </div>
        </div>
    `;
}

function renderKnowledge() {
    let html = `
        <div class="content-header">
            <h2>知识点总览</h2>
            <p>点击卡片查看各章节详细知识点</p>
        </div>
        <div class="knowledge-grid">
    `;
    for (let key in knowledgeData) {
        const data = knowledgeData[key];
        html += `
            <div class="knowledge-card" onclick="showKnowledgeDetail('${key}')">
                <h3>${data.icon} ${data.title}</h3>
                <p>${data.sections.map(s => s.title).join('、')}</p>
                <span class="tag">${data.sections.length} 个章节</span>
            </div>
        `;
    }
    html += '</div>';
    document.getElementById('mainContent').innerHTML = html;
}

function showKnowledgeDetail(key) {
    const data = knowledgeData[key];
    let html = `
        <button class="back-btn" onclick="showSection('knowledge')">
            <span>←</span> 返回知识点总览
        </button>
        <div class="knowledge-detail">
            <h3>${data.icon} ${data.title}</h3>
    `;
    data.sections.forEach(section => {
        html += `
            <div class="knowledge-section">
                <h4>📌 ${section.title}</h4>
                <ul>
                    ${section.items.map(item => `<li>${item}</li>`).join('')}
                </ul>
            </div>
        `;
    });
    html += `
        <div class="highlight">
            <strong>💡 考试提示：</strong>${data.highlight}
        </div>
        </div>
    `;
    document.getElementById('mainContent').innerHTML = html;
}

function renderQuiz() {
    const quiz = quizData[currentQuiz];
    userAnswers = new Array(quiz.questions.length).fill(-1);
    quizSubmitted = false;
    renderQuizContent();
}

function renderQuizContent() {
    const quiz = quizData[currentQuiz];
    let html = `
        <div class="quiz-container">
            <div class="quiz-header">
                <h3>✏️ ${quiz.name}</h3>
                <div class="quiz-selector">
                    <label>选择试卷：</label>
                    <select onchange="changeQuiz(this.value)">
                        ${quizData.map((q, i) => `<option value="${i}" ${i === currentQuiz ? 'selected' : ''}>${q.name}</option>`).join('')}
                    </select>
                </div>
            </div>
            <div class="quiz-progress">
                <span>答题进度：${userAnswers.filter(a => a !== -1).length} / ${quiz.questions.length}</span>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${(userAnswers.filter(a => a !== -1).length / quiz.questions.length * 100)}%"></div>
                </div>
            </div>
    `;
    if (quizSubmitted) {
        html += renderResult();
    } else {
        html += renderQuestions();
    }
    html += '</div>';
    document.getElementById('mainContent').innerHTML = html;
}

function renderQuestions() {
    const quiz = quizData[currentQuiz];

    quiz.questions.forEach((q, index) => {
        const answered = userAnswers[index] !== -1;
        html += `
            <div class="question-card" id="q${index}">
                <div class="question-number">第 ${index + 1} 题 ${q.type === 'choice' ? '（选择题）' : '（判断题）'}</div>
                <div class="question-text">${q.question}</div>
        `;
        if (q.type === 'choice') {
            html += `<div class="options">`;
            q.options.forEach((opt, optIndex) => {
                html += `
                    <div class="option ${answered && userAnswers[index] === optIndex ? 'selected' : ''}" 
                         onclick="selectAnswer(${index}, ${optIndex})">
                        <div class="option-letter">${String.fromCharCode(65 + optIndex)}</div>
                        <span>${opt}</span>
                    </div>
                `;
            });
            html += `</div>`;
        } else {
            html += `
                <div class="true-false-options">
                    <div class="tf-option ${answered && userAnswers[index] === 1 ? 'selected' : ''}" onclick="selectAnswer(${index}, 1)">
                        ✓ 正确
                    </div>
                    <div class="tf-option ${answered && userAnswers[index] === 0 ? 'selected' : ''}" onclick="selectAnswer(${index}, 0)">
                        ✗ 错误
                    </div>
                </div>
            `;
        }
        html += `</div>`;
    });
    html += `
        <div class="quiz-actions">
            <button class="btn btn-primary" onclick="submitQuiz()">提交试卷</button>
            <button class="btn btn-secondary" onclick="resetQuiz()">重置答案</button>
        </div>
    `;
    return html;
}

function selectAnswer(questionIndex, answerIndex) {
    if (quizSubmitted) return;
    userAnswers[questionIndex] = answerIndex;
    renderQuizContent();
}

function submitQuiz() {
    const quiz = quizData[currentQuiz];
    const unanswered = userAnswers.filter(a => a === -1).length;
    if (unanswered > 0) {
        if (!confirm(`你还有 ${unanswered} 道题未作答，确定要提交吗？`)) {
            return;
        }
    }
    quizSubmitted = true;
    renderQuizContent();
    document.querySelector('.quiz-container').scrollIntoView({ behavior: 'smooth' });
}

function renderResult() {
    const quiz = quizData[currentQuiz];
    let correct = 0;
    let choiceCorrect = 0;
    let tfCorrect = 0;
    let choiceTotal = 0;
    let tfTotal = 0;
    quiz.questions.forEach((q, i) => {
        const isCorrect = userAnswers[i] === q.answer;
        if (isCorrect) {
            correct++;
            if (q.type === 'choice') choiceCorrect++;
            else tfCorrect++;
        }
        if (q.type === 'choice') choiceTotal++;
        else tfTotal++;
    });
    const score = Math.round(correct / quiz.questions.length * 100);
    let html = `
        <div class="result-container">
            <h3>📊 考试成绩</h3>
            <div class="result-score">${score}分</div>
            <div class="result-detail">
                <div class="result-item">
                    <div class="number">${correct}/${quiz.questions.length}</div>
                    <div class="label">总正确数</div>
                </div>
                <div class="result-item">
                    <div class="number">${choiceCorrect}/${choiceTotal}</div>
                    <div class="label">选择题</div>
                </div>
                <div class="result-item">
                    <div class="number">${tfCorrect}/${tfTotal}</div>
                    <div class="label">判断题</div>
                </div>
            </div>
            <p style="color: #666; margin: 16px 0;">${score >= 90 ? '太棒了！继续保持！🎉' : score >= 60 ? '成绩不错，还有提升空间！💪' : '需要加强复习，再接再厉！📚'}</p>
        </div>
    `;
    html += `<h3 style="margin: 32px 0 16px; color: #1a365d;">答案解析</h3>`;
    quiz.questions.forEach((q, index) => {
        const userAnswer = userAnswers[index];
        const isCorrect = userAnswer === q.answer;
        const isUnanswered = userAnswer === -1;
        html += `
            <div class="question-card" style="border-color: ${isCorrect ? '#48bb78' : isUnanswered ? '#ed8936' : '#f56565'};">
                <div class="question-number" style="background: ${isCorrect ? '#f0fff4' : isUnanswered ? '#fffaf0' : '#fff5f5'}; color: ${isCorrect ? '#22543d' : isUnanswered ? '#744210' : '#742a2a'};">
                    第 ${index + 1} 题 ${isCorrect ? '✓ 正确' : isUnanswered ? '⚠ 未作答' : '✗ 错误'}
                </div>
                <div class="question-text">${q.question}</div>
        `;
        if (q.type === 'choice') {
            html += `<div class="options">`;
            q.options.forEach((opt, optIndex) => {
                let cls = '';
                if (optIndex === q.answer) cls = 'correct';
                else if (userAnswer === optIndex && !isCorrect) cls = 'wrong';
                html += `
                    <div class="option ${cls}">
                        <div class="option-letter">${String.fromCharCode(65 + optIndex)}</div>
                        <span>${opt} ${optIndex === q.answer ? '✓ 正确答案' : ''}</span>
                    </div>
                `;
            });
            html += `</div>`;
        } else {
            html += `
                <div class="true-false-options">
                    <div class="tf-option ${q.answer === 1 ? 'correct' : ''}">
                        ✓ 正确 ${q.answer === 1 ? '（正确答案）' : ''}
                    </div>
                    <div class="tf-option ${q.answer === 0 ? 'correct' : ''}">
                        ✗ 错误 ${q.answer === 0 ? '（正确答案）' : ''}
                    </div>
                </div>
            `;
        }
        html += `
            <div class="answer-feedback show ${isCorrect ? 'correct' : 'wrong'}">
                <strong>解析：</strong>${q.explanation}
            </div>
            </div>
        `;
    });
    html += `
        <div class="quiz-actions">
            <button class="btn btn-primary" onclick="resetQuiz()">重新答题</button>
            <button class="btn btn-secondary" onclick="showSection('knowledge')">去复习知识点</button>
        </div>
    `;
    return html;
}

function resetQuiz() {
    userAnswers = new Array(quizData[currentQuiz].questions.length).fill(-1);
    quizSubmitted = false;
    renderQuizContent();
}

function changeQuiz(index) {
    currentQuiz = parseInt(index);
    renderQuiz();
}

// 初始化
showSection('home');
</script>
</body>
</html>
