<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能水资源调度决策平台</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root {
  --primary: #0ea5e9;
  --primary-dark: #0284c7;
  --primary-light: #38bdf8;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --bg-gradient-start: #0f172a;
  --bg-gradient-mid: #1e293b;
  --bg-gradient-end: #0d9488;
  --card: rgba(255,255,255,.08);
  --card-hover: rgba(255,255,255,.12);
  --text: #f8fafc;
  --text-secondary: #94a3b8;
  --border: rgba(255,255,255,.1);
  --shadow: 0 4px 30px rgba(0,0,0,.1);
  --shadow-lg: 0 20px 60px rgba(0,0,0,.3);
  --radius: 16px;
  --glass-blur: 20px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 50%, var(--bg-gradient-end) 100%);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: 
    radial-gradient(circle at 20% 80%, rgba(14, 165, 233, .15) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(13, 148, 136, .15) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(245, 158, 11, .05) 0%, transparent 70%);
  pointer-events: none;
  z-index: -1;
}

.header {
  backdrop-filter: blur(var(--glass-blur));
  background: rgba(15, 23, 42, .85);
  border-bottom: 1px solid var(--border);
  padding: 24px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  animation: slideDown .6s ease-out;
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-30px); }
  to { opacity: 1; transform: translateY(0); }
}
.header h1 { 
  font-size: 1.5rem; 
  font-weight: 800; 
  letter-spacing: .02em;
  background: linear-gradient(135deg, #38bdf8, #10b981);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  display: flex;
  align-items: center;
  gap: 12px;
}
.header .badge-row { display: flex; gap: 10px; flex-wrap: wrap; }
.badge {
  font-size: .75rem; padding: 6px 14px; border-radius: 20px;
  background: rgba(255,255,255,.1);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.15);
  transition: all .3s ease;
}
.badge:hover { background: rgba(255,255,255,.2); transform: translateY(-2px); }
.badge.district { background: rgba(16, 185, 129, .2); border-color: rgba(16, 185, 129, .3); }

.container { max-width: 1400px; margin: 0 auto; padding: 28px 24px; }

.control-panel {
  backdrop-filter: blur(var(--glass-blur));
  background: var(--card);
  border-radius: var(--radius);
  padding: 28px;
  border: 1px solid var(--border);
  margin-bottom: 24px;
  display: grid; 
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px; 
  align-items: end;
  box-shadow: var(--shadow);
  animation: fadeInUp .6s ease-out;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.control-group { display: flex; flex-direction: column; gap: 8px; }
.control-group label {
  font-size: .75rem; 
  font-weight: 600; 
  color: var(--text-secondary);
  text-transform: uppercase; 
  letter-spacing: .08em;
}
.control-group select, .control-group input {
  padding: 12px 16px; 
  border: 1.5px solid var(--border); 
  border-radius: 10px;
  font-size: .95rem; 
  outline: none; 
  transition: all .3s;
  font-family: inherit; 
  background: rgba(15, 23, 42, .6);
  color: var(--text);
  backdrop-filter: blur(10px);
}
.control-group select:focus, .control-group input:focus {
  border-color: var(--primary); 
  box-shadow: 0 0 0 4px rgba(14, 165, 233, .2), 0 0 30px rgba(14, 165, 233, .1);
  transform: translateY(-2px);
}
.control-group select option { background: #1e293b; color: #f8fafc; }

.btn-solve {
  padding: 14px 32px; 
  font-size: 1rem; 
  font-weight: 700; 
  border: none;
  border-radius: 10px; 
  cursor: pointer; 
  color: #fff; 
  letter-spacing: .02em;
  background: linear-gradient(135deg, var(--primary) 0%, var(--success) 100%);
  box-shadow: 0 8px 25px rgba(14, 165, 233, .4);
  transition: all .3s;
  white-space: nowrap;
  position: relative;
  overflow: hidden;
}
.btn-solve::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
  transition: left .5s;
}
.btn-solve:hover::before { left: 100%; }
.btn-solve:hover { 
  transform: translateY(-3px) scale(1.02); 
  box-shadow: 0 12px 40px rgba(14, 165, 233, .5); 
}
.btn-solve:active { transform: translateY(-1px) scale(.98); }
.btn-solve.loading { 
  opacity: .8; 
  pointer-events: none; 
}
.btn-solve.loading::after {
  content: '';
  position: absolute;
  width: 20px; height: 20px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  right: 20px;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.results { display: none; }
.results.active { display: block; }

.result-cards {
  display: grid; 
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px; 
  margin-bottom: 24px;
}
.result-card {
  backdrop-filter: blur(var(--glass-blur));
  background: var(--card);
  border-radius: var(--radius); 
  padding: 24px;
  border: 1px solid var(--border);
  border-left: 4px solid;
  transition: all .4s ease;
  animation: fadeInUp .5s ease both;
}
.result-card:hover { 
  background: var(--card-hover);
  transform: translateY(-5px);
  box-shadow: var(--shadow-lg);
}
.result-card .label { 
  font-size: .85rem; 
  color: var(--text-secondary); 
  margin-bottom: 8px; 
  display: flex;
  align-items: center;
  gap: 8px;
}
.result-card .value { 
  font-size: 2rem; 
  font-weight: 800;
  background: linear-gradient(135deg, #38bdf8, #10b981);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.result-card.primary { border-color: var(--primary); }
.result-card.success { border-color: var(--success); }
.result-card.warning { border-color: var(--warning); }

.result-card:nth-child(2) { animation-delay: .1s; }
.result-card:nth-child(3) { animation-delay: .2s; }

.chart-row {
  display: grid; 
  grid-template-columns: 1fr 1fr;
  gap: 20px; 
  margin-bottom: 24px;
}
@media (max-width: 900px) { .chart-row { grid-template-columns: 1fr; } }

.static-map {
  backdrop-filter: blur(var(--glass-blur));
  background: var(--card);
  border-radius: var(--radius); 
  padding: 20px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  animation: fadeInUp .5s ease both;
}
.map-svg {
  width: 100%;
  height: auto;
  max-height: 300px;
  border-radius: 8px;
}
.map-marker {
  transition: transform .3s ease;
  cursor: pointer;
}
.map-marker:hover {
  transform: scale(1.1);
}
.map-legend {
  display: flex;
  gap: 24px;
  justify-content: center;
  margin-top: 16px;
  flex-wrap: wrap;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: .85rem;
  color: var(--text-secondary);
}
.legend-item .dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
}

.chart-card {
  backdrop-filter: blur(var(--glass-blur));
  background: var(--card);
  border-radius: var(--radius); 
  padding: 24px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  animation: fadeInUp .5s ease both;
  transition: all .4s ease;
}
.chart-card:hover { 
  background: var(--card-hover);
  box-shadow: var(--shadow-lg);
}
.chart-card h3 { 
  font-size: 1rem; 
  color: var(--text-secondary); 
  margin-bottom: 16px; 
  display: flex;
  align-items: center;
  gap: 10px;
}
.chart-container { width: 100%; height: 340px; }

.chart-card:nth-child(2) { animation-delay: .1s; }

.warning-banner {
  backdrop-filter: blur(10px);
  border-radius: 12px;
  padding: 16px 20px; 
  margin-bottom: 24px; 
  font-size: .95rem;
  display: flex; 
  align-items: center; 
  gap: 12px;
  border: 1px solid;
  animation: pulseBanner 2s ease-in-out infinite;
}
@keyframes pulseBanner {
  0%, 100% { opacity: 1; }
  50% { opacity: .9; }
}
.warning-banner .icon { font-size: 1.4rem; }

.allocation-table {
  width: 100%; 
  border-collapse: collapse; 
  margin-top: 16px; 
  font-size: .9rem;
}
.allocation-table th, .allocation-table td {
  padding: 12px 16px; 
  text-align: left; 
  border-bottom: 1px solid var(--border);
  transition: background .3s;
}
.allocation-table th { 
  font-size: .75rem; 
  color: var(--text-secondary); 
  font-weight: 600; 
  text-transform: uppercase;
  letter-spacing: .05em;
}
.allocation-table tbody tr:hover { background: rgba(255,255,255,.05); }
.allocation-table .bar-cell { display: flex; align-items: center; gap: 12px; }
.allocation-table .bar {
  height: 10px; 
  border-radius: 5px; 
  background: linear-gradient(90deg, var(--primary), var(--success));
  transition: width .5s cubic-bezier(.4,0,.2,1);
  box-shadow: 0 0 10px rgba(14, 165, 233, .3);
}

.map-section {
  backdrop-filter: blur(var(--glass-blur));
  background: var(--card);
  border-radius: var(--radius);
  padding: 24px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  margin-bottom: 24px;
  animation: fadeInUp .5s ease both;
}
.map-section h3 { 
  font-size: 1rem; 
  color: var(--text-secondary); 
  margin-bottom: 16px; 
  display: flex;
  align-items: center;
  gap: 10px;
}
#map { height: 400px; border-radius: 12px; overflow: hidden; }

.footer {
  text-align: center; 
  padding: 40px 24px; 
  color: var(--text-secondary);
  font-size: .85rem;
  backdrop-filter: blur(10px);
  margin-top: 40px;
}
.footer a { color: var(--primary); text-decoration: none; transition: color .3s; }
.footer a:hover { color: var(--primary-light); }

.loading-spinner {
  display: inline-block;
  width: 40px;
  height: 40px;
  border: 3px solid rgba(255,255,255,.1);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
</style>
</head>
<body>

<header class="header">
  <div>
    <h1>🌊 AI 智能水资源调度决策平台</h1>
  </div>
  <div class="badge-row">
    <span class="badge">🏆 TRAE 初赛</span>
    <span class="badge">⚡ 光电伊辛机</span>
    <span class="badge district">📍 黑河流域</span>
  </div>
</header>

<div class="container">

  <div class="control-panel" id="controlPanel">
    <div class="control-group">
      <label>📍 选择灌区</label>
      <select id="scenarioSelect">
        <option value="0">大满灌区 — 玉米拔节期夏灌（500万方）</option>
        <option value="1">大满灌区 — 玉米灌浆期夏灌（400万方）</option>
        <option value="2">大满灌区 — 小麦返青期春灌（300万方）</option>
        <option value="3">盈科灌区 — 玉米拔节期夏灌（450万方）</option>
        <option value="4">盈科灌区 — 蔬菜生长期秋灌（250万方）</option>
        <option value="5">大满+盈科联合调度 — 夏灌（800万方）</option>
      </select>
    </div>
    <div class="control-group">
      <label>🌾 作物类型</label>
      <select id="cropSelect">
        <option value="corn">玉米</option>
        <option value="wheat">小麦</option>
        <option value="vegetable">蔬菜</option>
        <option value="mixed">混合</option>
      </select>
    </div>
    <div class="control-group">
      <label>💧 可用水量（万方）</label>
      <input type="number" id="waterInput" value="500" min="50" max="2000" step="10">
    </div>
    <button class="btn-solve" id="solveBtn" onclick="doSolve()">
      ⚡ 智能调度
    </button>
  </div>

  <div class="results" id="results">

    <div class="result-cards">
      <div class="result-card primary">
        <div class="label">⚡ 伊辛机求解耗时</div>
        <div class="value" id="solveTime">47ms</div>
      </div>
      <div class="result-card success">
        <div class="label">✅ 硬约束满足</div>
        <div class="value" id="hardViolation">100%</div>
      </div>
      <div class="result-card warning">
        <div class="label">📊 目标函数值</div>
        <div class="value" id="objValue">892.5</div>
      </div>
    </div>

    <div class="map-section">
      <h3>🗺️ 灌区分布地图</h3>
      <div class="static-map">
        <svg viewBox="0 0 400 300" class="map-svg">
          <defs>
            <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.8" />
              <stop offset="100%" style="stop-color:#0284c7;stop-opacity:0.8" />
            </linearGradient>
            <radialGradient id="areaGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0.3" />
              <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:0" />
            </radialGradient>
          </defs>
          <rect width="400" height="300" fill="#0f172a" rx="8"/>
          <path d="M50,250 Q100,200 150,180 T250,150 T350,100" 
                stroke="url(#riverGrad)" stroke-width="8" fill="none" stroke-linecap="round"/>
          <path d="M50,250 Q100,200 150,180 T250,150 T350,100" 
                stroke="#0ea5e9" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>
          <circle cx="200" cy="150" r="70" fill="url(#areaGrad)"/>
          <circle cx="200" cy="150" r="70" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
          <g class="map-marker" transform="translate(180, 130)">
            <circle cx="0" cy="0" r="12" fill="#10b981"/>
            <circle cx="0" cy="0" r="8" fill="#059669"/>
            <text x="20" y="5" fill="#f8fafc" font-size="12" font-weight="600">大满灌区</text>
            <text x="20" y="20" fill="#94a3b8" font-size="10">玉米主产区</text>
          </g>
          <g class="map-marker" transform="translate(240, 160)">
            <circle cx="0" cy="0" r="12" fill="#f59e0b"/>
            <circle cx="0" cy="0" r="8" fill="#d97706"/>
            <text x="20" y="5" fill="#f8fafc" font-size="12" font-weight="600">盈科灌区</text>
            <text x="20" y="20" fill="#94a3b8" font-size="10">蔬菜种植区</text>
          </g>
          <g transform="translate(30, 260)">
            <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
            <text x="12" y="4" fill="#94a3b8" font-size="10">黑河干流</text>
          </g>
        </svg>
        <div class="map-legend">
          <div class="legend-item"><span class="dot" style="background:#10b981"></span> 大满灌区</div>
          <div class="legend-item"><span class="dot" style="background:#f59e0b"></span> 盈科灌区</div>
          <div class="legend-item"><span class="dot" style="background:#38bdf8"></span> 黑河干流</div>
        </div>
      </div>
    </div>

    <div class="chart-row">
      <div class="chart-card">
        <h3>📊 渠道配水方案</h3>
        <div class="chart-container" id="allocationChart"></div>
      </div>
      <div class="chart-card">
        <h3>📈 未来 7 天水位预测（Transformer）</h3>
        <div class="chart-container" id="forecastChart"></div>
      </div>
    </div>

    <div class="warning-banner" id="warningBanner">
      <span class="icon">⚠️</span>
      <span id="warningText"></span>
    </div>

    <div class="chart-card">
      <h3>📋 详细配水方案</h3>
      <table class="allocation-table">
        <thead>
          <tr><th>渠道</th><th>配水量（万方）</th><th>占比</th><th>区域</th></tr>
        </thead>
        <tbody id="allocationTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="footer">
  Powered by 光电伊辛机混合求解器 + Transformer 水位预测模型<br>
  数据来源：黑河流域莺落峡/正义峡实测径流 · 张掖灌区渠系 GIS 数据<br>
  <a href="https://forum.trae.cn/" target="_blank">TRAE 初赛作品</a> · 社会服务赛道
</div>

<script>
let scenarios = [];
let allocationChart, forecastChart;

async function init() {
  try {
    const resp = await fetch('data/scenarios.json');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    scenarios = data.scenarios;
    
    document.getElementById('scenarioSelect').addEventListener('change', onScenarioChange);
    onScenarioChange();
    doSolve();
  } catch(e) {
    console.error('数据加载失败:', e);
    document.getElementById('results').innerHTML = `
      <div class="chart-card" style="text-align:center;padding:40px;color:#fca5a5">
        <p style="font-size:1.2rem">⚠️ 数据加载失败</p>
        <p style="margin-top:8px;color:#94a3b8">请使用 HTTP 服务器打开此页面：</p>
        <code style="background:rgba(15,23,42,.6);padding:8px 16px;border-radius:6px;display:inline-block;margin-top:8px;border:1px solid rgba(255,255,255,.1)">
          python -m http.server 8080
        </code>
      </div>
    `;
    document.getElementById('results').classList.add('active');
  }
}

function initCharts() {
  if (allocationChart && forecastChart) return;
  
  allocationChart = echarts.init(document.getElementById('allocationChart'));
  forecastChart = echarts.init(document.getElementById('forecastChart'));
}

function onScenarioChange() {
  const idx = parseInt(document.getElementById('scenarioSelect').value);
  if (!scenarios[idx]) return;
  const s = scenarios[idx];
  
  const cropMap = { '玉米': 'corn', '小麦': 'wheat', '蔬菜': 'vegetable', '混合': 'mixed' };
  document.getElementById('cropSelect').value = cropMap[s.crop] || 'corn';
  document.getElementById('waterInput').value = s.totalWater;
}

function doSolve() {
  const idx = parseInt(document.getElementById('scenarioSelect').value);
  if (!scenarios[idx]) return;
  
  const btn = document.getElementById('solveBtn');
  btn.textContent = '⏳ 计算中...';
  btn.classList.add('loading');
  
  setTimeout(() => {
    document.getElementById('results').classList.add('active');
    initCharts();
    
    const s = scenarios[idx];
    renderResults(s);
    btn.textContent = '⚡ 智能调度';
    btn.classList.remove('loading');
    
    setTimeout(() => {
      allocationChart?.resize();
      forecastChart?.resize();
    }, 100);
    
    document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
  }, 600);
}

function renderResults(s) {
  document.getElementById('solveTime').textContent = s.result.solveTime + 'ms';
  document.getElementById('hardViolation').textContent = 
    s.result.constraints.hardViolations === 0 ? '✅ 100%' : '❌ 违反';
  document.getElementById('objValue').textContent = s.result.objectiveValue.toFixed(1);
  
  const banner = document.getElementById('warningBanner');
  document.getElementById('warningText').textContent = s.forecast.warning;
  const isCritical = s.forecast.trend.includes('持续下降') || s.forecast.trend === '下降';
  if (isCritical) {
    banner.style.background = 'rgba(239, 68, 68, .15)';
    banner.style.borderColor = 'rgba(239, 68, 68, .3)';
  } else {
    banner.style.background = 'rgba(245, 158, 11, .15)';
    banner.style.borderColor = 'rgba(245, 158, 11, .3)';
  }
  
  const allocData = s.result.allocation;
  allocationChart.setOption({
    backgroundColor: 'transparent',
    tooltip: { 
      trigger: 'axis', 
      axisPointer: { type: 'shadow' },
      backgroundColor: 'rgba(15, 23, 42, .9)',
      borderColor: 'rgba(255,255,255,.1)',
      textStyle: { color: '#f8fafc' }
    },
    grid: { left: '3%', right: '8%', bottom: '3%', top: '5%', containLabel: true },
    xAxis: {
      type: 'category',
      data: allocData.map(a => a.channel),
      axisLabel: { fontSize: 11, color: '#94a3b8', rotate: 15 },
      axisLine: { lineStyle: { color: 'rgba(255,255,255,.1)' } }
    },
    yAxis: {
      type: 'value', 
      name: '万方',
      axisLabel: { fontSize: 11, color: '#94a3b8' },
      axisLine: { lineStyle: { color: 'rgba(255,255,255,.1)' } },
      splitLine: { lineStyle: { color: 'rgba(255,255,255,.05)' } }
    },
    series: [{
      type: 'bar',
      data: allocData.map(a => ({
        value: a.amount,
        itemStyle: {
          color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: '#0ea5e9' },
            { offset: 1, color: '#10b981' }
          ]),
          borderRadius: [6, 6, 0, 0]
        }
      })),
      barWidth: '50%',
      label: {
        show: true, 
        position: 'top',
        formatter: p => p.value + '万方',
        fontSize: 11, 
        fontWeight: 600,
        color: '#f8fafc'
      },
      animationDuration: 1500,
      animationEasing: 'elasticOut'
    }]
  });
  
  forecastChart.setOption({
    backgroundColor: 'transparent',
    tooltip: { 
      trigger: 'axis',
      backgroundColor: 'rgba(15, 23, 42, .9)',
      borderColor: 'rgba(255,255,255,.1)',
      textStyle: { color: '#f8fafc' }
    },
    legend: { 
      data: ['水位(m)', '来水量(m³/s)'], 
      bottom: 0, 
      textStyle: { fontSize: 11, color: '#94a3b8' } 
    },
    grid: { left: '3%', right: '5%', bottom: '12%', top: '5%', containLabel: true },
    xAxis: {
      type: 'category', 
      data: s.forecast.dates,
      axisLabel: { fontSize: 11, color: '#94a3b8' },
      axisLine: { lineStyle: { color: 'rgba(255,255,255,.1)' } }
    },
    yAxis: [
      {
        type: 'value', 
        name: '水位(m)',
        min: v => (v.min - 0.2).toFixed(1),
        axisLabel: { fontSize: 11, color: '#94a3b8' },
        axisLine: { lineStyle: { color: 'rgba(255,255,255,.1)' } },
        splitLine: { lineStyle: { color: 'rgba(255,255,255,.05)' } }
      },
      {
        type: 'value', 
        name: 'm³/s',
        axisLabel: { fontSize: 11, color: '#94a3b8' },
        axisLine: { lineStyle: { color: 'rgba(255,255,255,.1)' } },
        splitLine: { lineStyle: { color: 'rgba(255,255,255,.05)' } }
      }
    ],
    series: [
      {
        name: '水位(m)',
        type: 'line',
        data: s.forecast.waterLevel,
        smooth: true,
        lineStyle: { color: '#0ea5e9', width: 3 },
        itemStyle: { color: '#0ea5e9' },
        areaStyle: {
          color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: 'rgba(14, 165, 233, 0.3)' },
            { offset: 1, color: 'rgba(14, 165, 233, 0.02)' }
          ])
        },
        markLine: {
          silent: true,
          data: [{ yAxis: 3.2, label: { formatter: '警戒线', fontSize: 10, color: '#ef4444' }, lineStyle: { color: '#ef4444', type: 'dashed' } }]
        },
        animationDuration: 2000,
        animationEasing: 'cubicInOut'
      },
      {
        name: '来水量(m³/s)',
        type: 'line',
        yAxisIndex: 1,
        data: s.forecast.inflow,
        smooth: true,
        lineStyle: { color: '#10b981', width: 2, type: 'dashed' },
        itemStyle: { color: '#10b981' },
        animationDuration: 2000,
        animationEasing: 'cubicInOut'
      }
    ]
  });
  
  const tbody = document.getElementById('allocationTableBody');
  const maxAmount = Math.max(...s.result.allocation.map(a => a.amount));
  tbody.innerHTML = s.result.allocation.map((a, i) => `
    <tr style="animation: fadeInUp .5s ease both; animation-delay: ${i * 0.1}s">
      <td><strong>${a.channel}</strong></td>
      <td>
        <div class="bar-cell">
          <span style="min-width:60px">${a.amount} 万方</span>
          <div class="bar" style="width:${(a.amount/maxAmount*160)}px"></div>
        </div>
      </td>
      <td>${a.percent}%</td>
      <td>${a.area}</td>
    </tr>
  `).join('');
}

window.addEventListener('resize', () => {
  allocationChart?.resize();
  forecastChart?.resize();
});

init();
</script>
</body>
</html>
