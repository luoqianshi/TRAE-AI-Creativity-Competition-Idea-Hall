<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>记忆导航仪 · 考试作战指挥中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#04050d;
    --bg1:#080c1e;
    --bg2:#121638;
    --bg3:#1d1450;
    --glass:rgba(255,255,255,0.045);
    --glass-br:rgba(120,180,255,0.2);
    --txt:#eaf0ff;
    --txt-dim:#8b95cc;
    --cyan:#22d3ee;
    --magenta:#f472b6;
    --violet:#a78bfa;
    --indigo:#818cf8;
    --blue:#60a5fa;
    --green:#34d399;
    --red:#fb7185;
    --amber:#fbbf24;
    --shadow:0 24px 60px -24px rgba(0,0,0,.75);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--txt);
    min-height:100vh;
    background:
      radial-gradient(1100px 600px at 85% -8%, rgba(244,114,182,.20), transparent 60%),
      radial-gradient(900px 520px at -5% 8%, rgba(34,211,238,.18), transparent 55%),
      radial-gradient(700px 500px at 50% 110%, rgba(167,139,250,.22), transparent 60%),
      linear-gradient(160deg, var(--bg-deep) 0%, var(--bg1) 40%, var(--bg2) 75%, var(--bg3) 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  #particles{position:fixed;inset:0;z-index:0;pointer-events:none}
  .wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:30px 18px 64px}

  /* Hero */
  .hero{text-align:center;margin-bottom:28px;animation:fadeUp .8s ease both}
  .badge{
    display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:3px;color:#a5f3fc;
    border:1px solid rgba(34,211,238,.35);padding:7px 16px;border-radius:999px;
    background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(167,139,250,.12));
    box-shadow:0 0 24px -6px rgba(34,211,238,.4), inset 0 0 12px rgba(34,211,238,.08);
    margin-bottom:16px;
  }
  .badge .pulse{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 1.6s ease-in-out infinite}
  h1{
    margin:0 0 12px;font-family:"Orbitron","PingFang SC",sans-serif;
    font-size:clamp(28px,5.5vw,48px);font-weight:900;letter-spacing:2px;
    background:linear-gradient(90deg,#22d3ee 0%,#a78bfa 45%,#f472b6 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px rgba(167,139,250,.35));
  }
  .hero p{margin:0 auto;max-width:660px;color:var(--txt-dim);font-size:15px;line-height:1.7}
  .hero p b{color:#c7d2fe;font-weight:600}

  /* Presets */
  .presets{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0;animation:fadeUp .8s .1s ease both}
  .preset{
    min-height:74px;border:1px solid rgba(255,255,255,.14);border-radius:18px;cursor:pointer;color:#fff;
    font-size:15px;font-weight:700;padding:16px 14px;text-align:left;
    background:rgba(255,255,255,.04);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:var(--shadow);transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    position:relative;overflow:hidden;
  }
  .preset::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--pg);opacity:.9}
  .preset:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.3);box-shadow:0 18px 40px -14px var(--pgc), var(--shadow)}
  .preset:active{transform:translateY(0) scale(.99)}
  .preset .pt{font-size:16px;display:flex;align-items:center;gap:8px;font-weight:800}
  .preset .ps{font-size:11.5px;font-weight:500;opacity:.9;display:block;margin-top:5px;color:#e8ecff}
  .p1{--pg:linear-gradient(135deg,rgba(59,130,246,.6),rgba(99,102,241,.6));--pgc:rgba(99,102,241,.8)}
  .p2{--pg:linear-gradient(135deg,rgba(20,184,166,.6),rgba(6,182,212,.6));--pgc:rgba(34,211,238,.8)}
  .p3{--pg:linear-gradient(135deg,rgba(245,158,11,.6),rgba(236,72,153,.6));--pgc:rgba(244,114,182,.8)}

  /* Panels */
  .panel{
    background:var(--glass);border:1px solid var(--glass-br);border-radius:22px;
    padding:22px;margin-bottom:18px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.08);
    animation:fadeUp .8s .18s ease both;position:relative;
  }
  .panel h2{margin:0 0 18px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;letter-spacing:.5px}
  .panel h2 .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--magenta));box-shadow:0 0 12px rgba(244,114,182,.6)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .field{display:flex;flex-direction:column;gap:8px}
  .field label{font-size:12.5px;color:var(--txt-dim);font-weight:600;letter-spacing:.5px}
  .field .val{font-family:"Orbitron",sans-serif;font-variant-numeric:tabular-nums;font-weight:700;color:var(--cyan);min-width:48px;text-align:right;text-shadow:0 0 12px rgba(34,211,238,.5)}

  input[type="date"],input[type="number"]{
    width:100%;min-height:46px;padding:0 14px;border-radius:12px;
    background:rgba(8,12,30,.65);border:1px solid rgba(120,180,255,.2);
    color:#fff;font-size:15px;font-family:inherit;outline:none;transition:border-color .18s, box-shadow .18s;
  }
  input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.7);cursor:pointer}
  input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.2)}

  input[type="range"]{
    -webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:999px;
    background:linear-gradient(90deg,var(--cyan),var(--violet) 50%,var(--magenta));outline:none;
    box-shadow:0 0 12px rgba(167,139,250,.4);
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;cursor:pointer;
    box-shadow:0 0 14px rgba(34,211,238,.8);border:3px solid var(--violet);
  }
  input[type="range"]::-moz-range-thumb{
    width:24px;height:24px;border-radius:50%;background:#fff;cursor:pointer;border:3px solid var(--violet);box-shadow:0 0 14px rgba(34,211,238,.8);
  }

  .gen{
    margin-top:20px;width:100%;min-height:54px;border:none;border-radius:14px;cursor:pointer;
    font-size:17px;font-weight:800;color:#fff;letter-spacing:2px;font-family:inherit;
    background:linear-gradient(90deg,var(--cyan),var(--violet) 50%,var(--magenta));
    box-shadow:0 14px 34px -10px rgba(167,139,250,.7), inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .18s ease, filter .18s ease, box-shadow .18s ease;
    position:relative;overflow:hidden;
  }
  .gen::before{
    content:"";position:absolute;top:0;left:-100%;width:55%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
    animation:shimmer 3.2s ease-in-out infinite;
  }
  .gen:hover{filter:brightness(1.08);box-shadow:0 18px 42px -10px rgba(167,139,250,.9)}
  .gen:active{transform:translateY(2px)}

  /* Wow banner */
  .wow{
    border:1px solid rgba(52,211,153,.45);border-radius:18px;padding:18px 20px;margin-bottom:18px;
    background:linear-gradient(135deg,rgba(52,211,153,.18),rgba(34,211,238,.14));
    display:flex;gap:16px;align-items:center;animation:popIn .5s ease both;
    box-shadow:0 0 30px -8px rgba(52,211,153,.4);
  }
  .wow .ic{
    flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;
    background:linear-gradient(135deg,var(--green),var(--cyan));box-shadow:0 8px 24px -6px rgba(52,211,153,.7);
  }
  .wow .wt{font-size:15px;line-height:1.65}
  .wow .wt b{color:#6ee7b7;font-weight:800;font-size:17px;text-shadow:0 0 12px rgba(110,231,183,.5)}
  .wow .wt .num{color:#fff;font-weight:800;font-family:"Orbitron",sans-serif;font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(255,255,255,.4)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .stat{
    background:rgba(8,12,30,.5);border:1px solid rgba(120,180,255,.15);border-radius:14px;padding:14px 10px;text-align:center;
    transition:transform .18s, border-color .18s;animation:fadeUp .5s ease both;
  }
  .stat:hover{transform:translateY(-2px);border-color:rgba(34,211,238,.4)}
  .stat .sv{font-family:"Orbitron",sans-serif;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--cyan),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
  .stat .sl{font-size:11px;color:var(--txt-dim);margin-top:5px;letter-spacing:1px}

  .chart-box{position:relative;width:100%;margin-bottom:6px}
  .chart-box canvas{display:block;width:100%;height:280px;border-radius:14px}
  .chart-title{font-size:14px;font-weight:700;margin:8px 0 4px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;letter-spacing:.5px}
  .legend{display:flex;gap:14px;font-size:11.5px;color:var(--txt-dim);font-weight:500}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .swatch{width:14px;height:8px;border-radius:3px;display:inline-block}

  .days{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;max-height:160px;overflow-y:auto;padding:4px}
  .chip{
    font-size:11px;padding:5px 9px;border-radius:8px;font-variant-numeric:tabular-nums;font-family:"Orbitron",sans-serif;
    background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.3);color:#a5f3fc;white-space:nowrap;
    transition:transform .15s;
  }
  .chip:hover{transform:translateY(-1px)}
  .chip.peak{background:rgba(244,114,182,.2);border-color:rgba(244,114,182,.5);color:#fbcfe8;box-shadow:0 0 10px rgba(244,114,182,.3)}
  .chip.zero{opacity:.35}

  .note{font-size:12px;color:var(--txt-dim);line-height:1.65;margin-top:12px}
  .warn{color:#fda4af}

  #result{display:none}
  #result.show{display:block;animation:fadeUp .5s ease both}

  footer{text-align:center;color:var(--txt-dim);font-size:11.5px;margin-top:30px;line-height:1.8;letter-spacing:.5px}
  footer b{color:#a5f3fc}

  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}
  @keyframes shimmer{0%{left:-100%}50%,100%{left:130%}}

  @media(max-width:640px){
    .presets{grid-template-columns:1fr}
    .grid{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,1fr)}
    .chart-box canvas{height:240px}
    h1{letter-spacing:1px}
  }
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="wrap">
  <header class="hero">
    <div class="badge"><span class="pulse"></span>TRAE 创意大赛 · 考试作战指挥中心</div>
    <h1>记忆导航仪</h1>
    <p>像导航仪规划路线一样，规划你从今天到考场的每一步复习。<b>输入考试日期</b>，立刻生成一张专属作战地图，让每一张卡在考试当天都记得住。</p>
  </header>

  <div class="presets">
    <button class="preset p1" data-preset="1">
      <span class="pt">📚 考研政治</span>
      <span class="ps">480 张卡 · 23 天 · 40% 掌握</span>
    </button>
    <button class="preset p2" data-preset="2">
      <span class="pt">🔤 英语六级</span>
      <span class="ps">350 张卡 · 15 天 · 60% 掌握</span>
    </button>
    <button class="preset p3" data-preset="3">
      <span class="pt">⚖️ 法考主观题</span>
      <span class="ps">600 张卡 · 30 天 · 30% 掌握</span>
    </button>
  </div>

  <section class="panel">
    <h2><span class="dot"></span>作战参数</h2>
    <div class="grid">
      <div class="field">
        <label for="examDate">考试日期（D 日）</label>
        <input type="date" id="examDate">
      </div>
      <div class="field">
        <label for="cardN">卡片数量（张）</label>
        <input type="number" id="cardN" min="10" max="3000" step="10" value="480">
      </div>
      <div class="field">
        <label>当前平均掌握度 <span class="val" id="masteryVal">40%</span></label>
        <input type="range" id="mastery" min="0" max="100" value="40">
      </div>
      <div class="field">
        <label>目标把握度 <span class="val" id="targetVal">95%</span></label>
        <input type="range" id="target" min="60" max="99" value="95">
      </div>
    </div>
    <button class="gen" id="genBtn">⚡ 启动记忆导航</button>
  </section>

  <section class="panel" id="result">
    <div class="wow">
      <div class="ic">🎯</div>
      <div class="wt" id="wowText"></div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="chart-title">
      <span><span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--blue);vertical-align:middle;margin-right:6px"></span>考神路线图（每日复习卡片数）</span>
      <div class="legend"><span><span class="swatch" style="background:linear-gradient(90deg,#22d3ee,#60a5fa,#818cf8)"></span>复习量</span><span><span class="swatch" style="background:#fbbf24"></span>关键节点</span></div>
    </div>
    <div class="chart-box"><canvas id="barChart"></canvas></div>

    <div class="chart-title" style="margin-top:18px">
      <span><span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);vertical-align:middle;margin-right:6px"></span>记得住的概率（考试日把握度爬升曲线）</span>
      <div class="legend"><span><span class="swatch" style="background:linear-gradient(90deg,#34d399,#22d3ee,#a78bfa)"></span>把握度</span><span><span class="swatch" style="background:repeating-linear-gradient(90deg,#fb7185 0 4px,transparent 4px 8px)"></span>目标线</span></div>
    </div>
    <div class="chart-box"><canvas id="lineChart"></canvas></div>

    <div class="chart-title" style="margin-top:14px"><span>📅 每日作战清单</span></div>
    <div class="days" id="days"></div>
    <p class="note" id="note"></p>
  </section>

  <footer>
    记忆科学引擎 · 召回模型 <b>p(t) = (1 + t/(9·s))⁻¹</b> · 稳定性更新 <b>s' = s·(1 + e^(w₁₁-w₂₀·ease)·(1-p)·(11-p))</b><br>
    智能排程：每日优先救援「距目标最危险」的卡片 · 纯前端单文件 · 无后端零依赖 · 双击即用
  </footer>
</div>

<script>
"use strict";
/* ============ 粒子背景 ============ */
(function particles(){
  const cv = document.getElementById("particles");
  const ctx = cv.getContext("2d");
  let w, h, pts, raf;
  function resize(){
    w = cv.width = innerWidth;
    h = cv.height = innerHeight;
    const n = Math.min(64, Math.max(28, Math.floor(w*h/22000)));
    pts = Array.from({length:n}, () => ({
      x: Math.random()*w, y: Math.random()*h,
      vx: (Math.random()-.5)*.28, vy: (Math.random()-.5)*.28,
      r: Math.random()*1.7+.4,
      c: Math.random()<.34 ? "34,211,238" : Math.random()<.5 ? "244,114,182" : "167,139,250"
    }));
  }
  function tick(){
    ctx.clearRect(0,0,w,h);
    for(const p of pts){
      p.x += p.vx; p.y += p.vy;
      if(p.x<0)p.x=w; else if(p.x>w)p.x=0;
      if(p.y<0)p.y=h; else if(p.y>h)p.y=0;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = "rgba("+p.c+",.75)";
      ctx.shadowBlur = 8; ctx.shadowColor = "rgba("+p.c+",.9)";
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    raf = requestAnimationFrame(tick);
  }
  resize(); tick();
  addEventListener("resize", () => { cancelAnimationFrame(raf); resize(); tick(); });
})();

/* ============ FSRS-4.5 核心模型 ============ */
const W11 = 1.25, W20 = 0.5;

// 召回概率 p(t) = (1 + t/(9s))^-1
function recallP(t, s){
  if (t <= 0) return 1;
  return 1 / (1 + t / (9 * s));
}
// 由当前掌握度 m 估算初始稳定性 s0
function estS0(m){
  return m * 6 + 0.3;
}
// 由掌握度估算 ease（掌握度越高，卡片越"易"，每次复习收益略低）
function estEase(m){
  return 1.5 + m * 3;
}
// 稳定性更新：s_new = s_old * (1 + e^(w11-w20*ease) * (1-p) * (11-p))
function updateStability(s, p, ease){
  const mult = Math.exp(W11 - W20 * ease);
  const factor = (1 - p) * (11 - p);
  return s * (1 + mult * factor);
}

/* ============ 贪心约束排程 ============ */
function computeSchedule(D, N, mastery, target, maxPerDay){
  const m = Math.min(0.99, Math.max(0.01, mastery));
  const s0 = estS0(m);
  const ease = estEase(m);
  // 令卡片"上次复习"在 t0 天前，使 p(t0)=m，从而当前掌握度与模型自洽
  const t0 = 9 * s0 * (1 / m - 1);

  const cards = new Array(N);
  for (let i = 0; i < N; i++) cards[i] = { s: s0, last: -t0 };

  const reviewsByDay = new Array(D + 1).fill(0);   // 下标 1..D
  const recallByDay = [m];                          // 第 0 天 = 当前掌握度
  const urg = new Array(N);

  for (let d = 1; d <= D; d++){
    for (let i = 0; i < N; i++){
      urg[i] = { i, pD: recallP(D - cards[i].last, cards[i].s) };
    }
    // 距目标最危险（pD 最低）的优先
    urg.sort((a, b) => a.pD - b.pD);

    let count = 0;
    for (let k = 0; k < N && count < maxPerDay; k++){
      const u = urg[k];
      if (u.pD >= target) break;          // 已达标，无需再排
      const c = cards[u.i];
      const elapsed = d - c.last;
      const pNow = recallP(elapsed, c.s);
      c.s = updateStability(c.s, pNow, ease);
      c.last = d;
      count++;
    }
    reviewsByDay[d] = count;

    // 快照：应用至第 d 天后，预测考试日平均召回率
    let sum = 0;
    for (let i = 0; i < N; i++) sum += recallP(D - cards[i].last, cards[i].s);
    recallByDay.push(sum / N);
  }

  // 统计达标率
  let pass = 0;
  for (let i = 0; i < N; i++){
    if (recallP(D - cards[i].last, cards[i].s) >= target) pass++;
  }
  const finalAvg = recallByDay[D];
  let peak = 0, peakDay = 1, total = 0;
  for (let d = 1; d <= D; d++){
    total += reviewsByDay[d];
    if (reviewsByDay[d] > peak){ peak = reviewsByDay[d]; peakDay = d; }
  }
  return {
    reviewsByDay, recallByDay, finalAvg,
    passRate: pass / N, total, peak, peakDay, D, N, target,
    feasible: pass === N
  };
}

/* ============ 工具 ============ */
function todayMidnight(){
  const d = new Date(); d.setHours(0,0,0,0); return d;
}
function addDays(dt, n){
  const d = new Date(dt); d.setDate(d.getDate() + n); return d;
}
function daysBetween(a, b){
  return Math.round((b - a) / 86400000);
}
function iso(dt){
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, "0");
  const d = String(dt.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + d;
}

/* ============ Canvas 绘图 ============ */
function setupCanvas(cv){
  const dpr = window.devicePixelRatio || 1;
  const rect = cv.getBoundingClientRect();
  cv.width = Math.max(1, Math.floor(rect.width * dpr));
  cv.height = Math.max(1, Math.floor(rect.height * dpr));
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: rect.width, h: rect.height };
}

function keyNodes(D){
  const ns = [
    { d: 1, label: "第1天" },
    { d: Math.min(7, D), label: "第7天" },
    { d: Math.min(14, D), label: "第14天" },
    { d: Math.max(1, D - 1), label: "考前1天" }
  ];
  const seen = {}; const out = [];
  for (const n of ns){ if (!seen[n.d]){ seen[n.d] = 1; out.push(n); } }
  return out;
}

function roundRect(ctx, x, y, w, h, r){
  if (h < r) r = h;
  if (w < 2 * r) r = w / 2;
  r = Math.max(0, r);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// 路线图甘特图：progress 0..1，柱子从左到右逐根升起
function drawBarChart(cv, res, progress){
  if (progress == null) progress = 1;
  const { ctx, w, h } = setupCanvas(cv);
  ctx.clearRect(0, 0, w, h);
  const D = res.D;
  const padL = 42, padR = 14, padT = 26, padB = 34;
  const cw = w - padL - padR, ch = h - padT - padB;
  const yMax = Math.max(50, Math.ceil(res.peak / 10) * 10);
  const barW = cw / D;

  // 网格 + Y 轴
  ctx.strokeStyle = "rgba(255,255,255,.08)";
  ctx.fillStyle = "#8b95cc";
  ctx.font = "11px PingFang SC, sans-serif";
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  const ySteps = 4;
  for (let i = 0; i <= ySteps; i++){
    const yv = (yMax / ySteps) * i;
    const y = padT + ch - (yv / yMax) * ch;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillText(Math.round(yv), padL - 6, y);
  }

  // 50 张/天上限线
  const capY = padT + ch - (Math.min(50, yMax) / yMax) * ch;
  ctx.strokeStyle = "rgba(244,114,182,.55)";
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(padL, capY); ctx.lineTo(w - padR, capY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = "#f9a8d4"; ctx.textAlign = "left";
  ctx.fillText("上限 50/天", padL + 4, capY - 8);

  // 柱子（从左到右逐根升起）
  for (let d = 1; d <= D; d++){
    const barStart = (d - 1) / D;
    if (progress < barStart) break;
    const localP = Math.min(1, (progress - barStart) * D);
    const v = res.reviewsByDay[d];
    if (v <= 0) continue;
    const bh = (v / yMax) * ch * localP;
    const x = padL + (d - 1) * barW;
    const y = padT + ch - bh;
    const grad = ctx.createLinearGradient(0, y, 0, padT + ch);
    grad.addColorStop(0, "#67e8f9");
    grad.addColorStop(0.5, "#60a5fa");
    grad.addColorStop(1, "#818cf8");
    ctx.fillStyle = grad;
    ctx.shadowBlur = 8; ctx.shadowColor = "rgba(96,165,250,.55)";
    const bw = Math.max(2, barW - 2);
    roundRect(ctx, x + 1, y, bw, bh, Math.min(3, bw / 2));
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 关键节点竖线（仅显示已展开的）
  const nodes = keyNodes(D);
  ctx.strokeStyle = "rgba(251,191,36,.55)";
  ctx.setLineDash([3, 3]);
  ctx.fillStyle = "#fbbf24";
  ctx.font = "10.5px PingFang SC, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  nodes.forEach(n => {
    if (n.d / D > progress + 0.02) return;
    const x = padL + (n.d - 1) * barW + barW / 2;
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + ch); ctx.stroke();
    ctx.fillText(n.label, x, padT - 16);
  });
  ctx.setLineDash([]);

  // X 轴标签
  ctx.fillStyle = "#8b95cc";
  ctx.textBaseline = "top";
  const step = Math.ceil(D / 7);
  for (let d = 1; d <= D; d += step){
    const x = padL + (d - 1) * barW + barW / 2;
    ctx.fillText("D" + d, x, padT + ch + 6);
  }
}

// 召回率爬升曲线：progress 0..1，曲线从左到右逐步绘制
function drawLineChart(cv, res, progress){
  if (progress == null) progress = 1;
  const { ctx, w, h } = setupCanvas(cv);
  ctx.clearRect(0, 0, w, h);
  const D = res.D;
  const padL = 42, padR = 14, padT = 26, padB = 34;
  const cw = w - padL - padR, ch = h - padT - padB;

  // 网格 + Y 轴 (0..1)
  ctx.strokeStyle = "rgba(255,255,255,.08)";
  ctx.fillStyle = "#8b95cc";
  ctx.font = "11px PingFang SC, sans-serif";
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let i = 0; i <= 5; i++){
    const yv = i / 5;
    const y = padT + ch - yv * ch;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillText(Math.round(yv * 100) + "%", padL - 6, y);
  }

  const xAt = d => padL + (d / D) * cw;
  const yAt = v => padT + ch - v * ch;

  // 目标线
  ctx.strokeStyle = "#fb7185";
  ctx.setLineDash([6, 4]); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(padL, yAt(res.target)); ctx.lineTo(w - padR, yAt(res.target)); ctx.stroke();
  ctx.setLineDash([]); ctx.lineWidth = 1;
  ctx.fillStyle = "#fda4af"; ctx.textAlign = "left";
  ctx.fillText("目标 " + Math.round(res.target * 100) + "%", w - padR - 56, yAt(res.target) - 8);

  // 按 progress 截取曲线点
  const maxD = D * progress;
  const fullD = Math.floor(maxD);
  const frac = maxD - fullD;
  const pts = [[xAt(0), yAt(res.recallByDay[0])]];
  for (let d = 1; d <= fullD && d <= D; d++) pts.push([xAt(d), yAt(res.recallByDay[d])]);
  let endX = pts[pts.length-1][0], endY = pts[pts.length-1][1];
  if (fullD < D && frac > 0){
    const x0 = xAt(fullD), x1 = xAt(fullD + 1);
    const y0 = yAt(res.recallByDay[fullD]), y1 = yAt(res.recallByDay[fullD + 1]);
    endX = x0 + (x1 - x0) * frac; endY = y0 + (y1 - y0) * frac;
    pts.push([endX, endY]);
  }

  // 曲线下方填充
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.lineTo(endX, padT + ch); ctx.lineTo(pts[0][0], padT + ch); ctx.closePath();
  const fg = ctx.createLinearGradient(0, padT, 0, padT + ch);
  fg.addColorStop(0, "rgba(52,211,153,.35)");
  fg.addColorStop(1, "rgba(52,211,153,0)");
  ctx.fillStyle = fg; ctx.fill();

  // 曲线（霓虹渐变 + 发光）
  const lg = ctx.createLinearGradient(padL, 0, w - padR, 0);
  lg.addColorStop(0, "#34d399"); lg.addColorStop(0.5, "#22d3ee"); lg.addColorStop(1, "#a78bfa");
  ctx.strokeStyle = lg; ctx.lineWidth = 2.8; ctx.lineJoin = "round";
  ctx.shadowBlur = 10; ctx.shadowColor = "rgba(52,211,153,.5)";
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // 关键节点
  ctx.fillStyle = "#fbbf24"; ctx.font = "10.5px PingFang SC, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.strokeStyle = "rgba(251,191,36,.5)"; ctx.setLineDash([3, 3]);
  nodes_each: {
    const ns = keyNodes(D);
    ns.forEach(n => {
      if (n.d / D > progress + 0.02) return;
      const x = xAt(n.d);
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + ch); ctx.stroke();
      ctx.fillText(n.label, x, padT - 16);
    });
  }
  ctx.setLineDash([]);

  // 起点圆点
  ctx.fillStyle = "#34d399";
  ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], 3.5, 0, Math.PI * 2); ctx.fill();
  // 当前终点圆点（带发光）
  ctx.shadowBlur = 12; ctx.shadowColor = "rgba(167,139,250,.8)";
  ctx.fillStyle = "#a78bfa";
  ctx.beginPath(); ctx.arc(endX, endY, 4, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  if (progress >= 0.999){
    ctx.fillStyle = "#c4b5fd"; ctx.textAlign = "right"; ctx.textBaseline = "bottom";
    ctx.fillText((res.recallByDay[D] * 100).toFixed(1) + "%", endX - 4, endY - 4);
  }

  // X 轴标签
  ctx.fillStyle = "#8b95cc"; ctx.textBaseline = "top"; ctx.textAlign = "center";
  const step = Math.ceil(D / 7);
  for (let d = 0; d <= D; d += step){
    ctx.fillText(d === 0 ? "今天" : "D" + d, xAt(d), padT + ch + 6);
  }
  ctx.fillText("考试日", xAt(D), padT + ch + 6);
}

/* ============ 图表展开动画 ============ */
let chartAnimRAF = 0;
function animateCharts(res){
  cancelAnimationFrame(chartAnimRAF);
  const barCv = document.getElementById("barChart");
  const lineCv = document.getElementById("lineChart");
  const start = performance.now();
  const dur = 1400;
  function frame(now){
    const t = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
    drawBarChart(barCv, res, eased);
    drawLineChart(lineCv, res, eased);
    if (t < 1) chartAnimRAF = requestAnimationFrame(frame);
  }
  chartAnimRAF = requestAnimationFrame(frame);
}

/* ============ 渲染结果 ============ */
let lastRes = null;
let lastExamName = "考研";

function render(res, examName){
  lastRes = res; lastExamName = examName;
  document.getElementById("result").classList.add("show");

  // Wow 文案
  const pct = (res.finalAvg * 100).toFixed(1);
  const ok = res.feasible;
  document.getElementById("wowText").innerHTML =
    `考神路线图已生成 ✨ 距离<b>${examName}</b>还有 <span class="num">${res.D}</span> 天、<span class="num">${res.N}</span> 张卡，` +
    `按这张作战地图复习，考试当天平均把握度 <b>${pct}%</b>` +
    (ok ? `，全部卡片达标 ✅` : `，达标率 <span class="num">${(res.passRate*100).toFixed(0)}%</span>`);

  // 统计卡
  document.getElementById("stats").innerHTML = [
    ["作战总量", res.total + " 次"],
    ["冲刺峰值", res.peak + " 张 · D" + res.peakDay],
    ["全员达标", (res.passRate * 100).toFixed(0) + "%"],
    ["考试日把握", pct + "%"]
  ].map(([l, v], i) => `<div class="stat" style="animation-delay:${0.1 + i*0.08}s"><div class="sv">${v}</div><div class="sl">${l}</div></div>`).join("");

  // 每日明细 chips
  const daysEl = document.getElementById("days");
  let html = "";
  for (let d = 1; d <= res.D; d++){
    const v = res.reviewsByDay[d];
    const cls = "chip" + (v === res.peak ? " peak" : "") + (v === 0 ? " zero" : "");
    html += `<span class="${cls}">D${d} · ${v}张</span>`;
  }
  daysEl.innerHTML = html;

  // 提示
  const noteEl = document.getElementById("note");
  if (res.feasible){
    noteEl.className = "note";
    noteEl.textContent = "✅ 全部 " + res.N + " 张卡在考试日把握度 ≥ " + (res.target*100) + "%，作战地图可行。建议按冲刺峰值日提前预留复习时段。";
  } else {
    noteEl.className = "note warn";
    noteEl.textContent = "⚠️ 在 50 张/天上限内无法让全部卡片达标（达标率 " + (res.passRate*100).toFixed(0) + "%）。可适当提高每日上限、降低目标把握度或延长备考天数。";
  }

  // 展开动画绘制
  animateCharts(res);
}

/* ============ 预设 ============ */
const PRESETS = {
  1: { name: "考研政治", N: 480, days: 23, mastery: 40, target: 95 },
  2: { name: "英语六级", N: 350, days: 15, mastery: 60, target: 95 },
  3: { name: "法考主观题", N: 600, days: 30, mastery: 30, target: 95 }
};

function applyPreset(id){
  const p = PRESETS[id];
  const today = todayMidnight();
  document.getElementById("examDate").value = iso(addDays(today, p.days));
  document.getElementById("cardN").value = p.N;
  document.getElementById("mastery").value = p.mastery;
  document.getElementById("target").value = p.target;
  document.getElementById("masteryVal").textContent = p.mastery + "%";
  document.getElementById("targetVal").textContent = p.target + "%";
  generate(p.name);
}

/* ============ 主流程 ============ */
function generate(examName){
  const today = todayMidnight();
  const exam = new Date(document.getElementById("examDate").value + "T00:00:00");
  if (isNaN(exam.getTime())) return;
  const D = daysBetween(today, exam);
  const N = parseInt(document.getElementById("cardN").value, 10) || 480;
  const mastery = parseInt(document.getElementById("mastery").value, 10) / 100;
  const target = parseInt(document.getElementById("target").value, 10) / 100;

  if (D < 1){
    document.getElementById("result").classList.add("show");
    document.getElementById("wowText").innerHTML = `<span class="warn">考试日期需晚于今天，请重新选择。</span>`;
    document.getElementById("stats").innerHTML = "";
    document.getElementById("days").innerHTML = "";
    document.getElementById("note").textContent = "";
    const b = document.getElementById("barChart"), l = document.getElementById("lineChart");
    setupCanvas(b); setupCanvas(l);
    return;
  }

  const res = computeSchedule(D, N, mastery, target, 50);
  render(res, examName || "考试");
}

/* ============ 事件绑定 ============ */
document.getElementById("mastery").addEventListener("input", e => {
  document.getElementById("masteryVal").textContent = e.target.value + "%";
});
document.getElementById("target").addEventListener("input", e => {
  document.getElementById("targetVal").textContent = e.target.value + "%";
});
document.querySelectorAll(".preset").forEach(btn => {
  btn.addEventListener("click", () => applyPreset(btn.dataset.preset));
});
document.getElementById("genBtn").addEventListener("click", () => generate("考试"));

// 响应式重绘（最终态，不重复动画）
let resizeT = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if (lastRes){
      drawBarChart(document.getElementById("barChart"), lastRes, 1);
      drawLineChart(document.getElementById("lineChart"), lastRes, 1);
    }
  }, 120);
});

/* ============ 初始化：默认考研政治场景（Wow 时刻 + 路线图展开动画） ============ */
(function init(){
  const today = todayMidnight();
  document.getElementById("examDate").value = iso(addDays(today, 23));
  document.getElementById("examDate").min = iso(today);
  applyPreset("1");
})();
