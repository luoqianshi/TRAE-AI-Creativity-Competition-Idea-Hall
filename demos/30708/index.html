  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0d0d1a;
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
      overflow-x: hidden;
    }

    /* ===== 扫描线动画 ===== */
    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(400%); }
    }
    .scanline-container {
      position: relative;
      overflow: hidden;
    }
    .scanline-container::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00ff88, transparent);
      box-shadow: 0 0 15px #00ff88, 0 0 30px rgba(0,255,136,0.3);
      animation: scanline 3s linear infinite;
      z-index: 10;
    }

    /* ===== 发光边框卡片 ===== */
    .glow-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(0,255,136,0.15);
      box-shadow: 0 0 15px rgba(0,255,136,0.05), inset 0 0 15px rgba(0,255,136,0.02);
      backdrop-filter: blur(10px);
      transition: box-shadow 0.3s ease;
    }
    .glow-card:hover {
      box-shadow: 0 0 25px rgba(0,255,136,0.1), inset 0 0 20px rgba(0,255,136,0.03);
    }

    /* ===== 输入框聚焦发光 ===== */
    .input-glow {
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .input-glow:focus {
      outline: none;
      border-color: rgba(0,255,136,0.5);
      box-shadow: 0 0 20px rgba(0,255,136,0.15), 0 0 40px rgba(0,255,136,0.05);
    }

    /* ===== 主按钮 ===== */
    .btn-cyber {
      background: linear-gradient(135deg, #00ff88, #00cc6a);
      color: #0d0d1a;
      font-weight: 700;
      transition: all 0.2s ease;
      box-shadow: 0 0 20px rgba(0,255,136,0.3), 0 4px 15px rgba(0,0,0,0.3);
    }
    .btn-cyber:hover:not(:disabled) {
      transform: scale(1.02);
      box-shadow: 0 0 30px rgba(0,255,136,0.5), 0 6px 20px rgba(0,0,0,0.4);
    }
    .btn-cyber:active:not(:disabled) {
      transform: scale(0.98);
    }
    .btn-cyber:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ===== 场景标签 ===== */
    .scene-tab {
      border: 1px solid rgba(0,255,136,0.2);
      background: transparent;
      color: rgba(255,255,255,0.5);
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .scene-tab:hover {
      border-color: rgba(0,255,136,0.4);
      color: rgba(255,255,255,0.8);
    }
    .scene-tab.active {
      border-color: #00ff88;
      color: #00ff88;
      background: rgba(0,255,136,0.08);
      box-shadow: 0 0 15px rgba(0,255,136,0.15);
    }

    /* ===== 快速示例标签 ===== */
    .example-tag {
      border: 1px solid rgba(0,255,136,0.25);
      color: rgba(0,255,136,0.8);
      background: rgba(0,255,136,0.03);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .example-tag:hover {
      border-color: #00ff88;
      background: rgba(0,255,136,0.1);
      box-shadow: 0 0 10px rgba(0,255,136,0.15);
      transform: translateY(-1px);
    }

    /* ===== Glitch 文字效果 ===== */
    .glitch-text {
      text-shadow:
        2px 0 rgba(255,0,0,0.4),
        -2px 0 rgba(0,255,136,0.4),
        0 0 10px rgba(255,68,68,0.3);
    }
    .glitch-text.decoding {
      animation: glitchShift 0.1s infinite;
    }
    @keyframes glitchShift {
      0% { text-shadow: 2px 0 rgba(255,0,0,0.4), -2px 0 rgba(0,255,136,0.4); }
      25% { text-shadow: -1px 0 rgba(255,0,0,0.4), 1px 0 rgba(0,255,136,0.4); }
      50% { text-shadow: 1px 1px rgba(255,0,0,0.4), -1px -1px rgba(0,255,136,0.4); }
      75% { text-shadow: -2px 1px rgba(255,0,0,0.4), 2px -1px rgba(0,255,136,0.4); }
      100% { text-shadow: 2px 0 rgba(255,0,0,0.4), -2px 0 rgba(0,255,136,0.4); }
    }

    /* ===== 骷髅头弹跳 ===== */
    .skull-pop {
      display: inline-block;
      opacity: 0;
      transform: scale(0);
    }
    .skull-pop.show {
      opacity: 1;
      transform: scale(1);
      animation: skullBounce 0.3s ease-out;
    }
    @keyframes skullBounce {
      0% { transform: scale(0); }
      60% { transform: scale(1.3); }
      80% { transform: scale(0.9); }
      100% { transform: scale(1); }
    }

    /* ===== 打字机光标 ===== */
    .typewriter-cursor::after {
      content: '█';
      color: #00ff88;
      animation: cursorBlink 0.6s infinite;
      text-shadow: 0 0 8px #00ff88;
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* ===== 模块淡入 ===== */
    .fade-in-up {
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .fade-in-up.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== 等待状态光标闪烁 ===== */
    .waiting-cursor::after {
      content: '█';
      color: rgba(0,255,136,0.4);
      animation: cursorBlink 1s infinite;
    }

    /* ===== 进度条 ===== */
    .danger-bar {
      height: 4px;
      background: rgba(255,255,255,0.05);
      border-radius: 2px;
      overflow: hidden;
    }
    .danger-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.8s ease;
      box-shadow: 0 0 10px currentColor;
    }

    /* ===== 复制按钮 ===== */
    .copy-btn {
      transition: all 0.2s ease;
    }
    .copy-btn:active {
      transform: scale(0.95);
    }

    /* ===== 滚动条美化 ===== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
    ::-webkit-scrollbar-thumb { background: rgba(0,255,136,0.2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0,255,136,0.4); }

    /* ===== 分割线 ===== */
    .divider-line {
      width: 1px;
      background: linear-gradient(to bottom, transparent, rgba(0,255,136,0.2), transparent);
    }

    /* ===== 保命回复文字发光 ===== */
    .reply-glow {
      text-shadow: 0 0 5px rgba(0,255,136,0.2);
    }

    /* ===== 真心话文字发光 ===== */
    .truth-glow {
      text-shadow: 0 0 15px rgba(255,68,68,0.4), 0 0 30px rgba(255,68,68,0.2);
    }

    /* ===== 脉冲发光 ===== */
    @keyframes pulseGlow {
      0%, 100% { text-shadow: 0 0 5px rgba(255,0,170,0.5); }
      50% { text-shadow: 0 0 15px rgba(255,0,170,0.8), 0 0 25px rgba(255,0,170,0.3); }
    }
    .pulse-glow {
      animation: pulseGlow 1.5s ease-in-out infinite;
    }
  </style>
</head>

      },
      {
        keywords: ["像家人", "家人一样", "氛围很好像家"],
        scene: ["面试现场"],
        original: "团队氛围很好，大家像家人一样",
        truth: "会要求你无偿付出，因为'家人不计较'。这句话通常出现在没有加班费的公司。",
        dangerLevel: 5,
        dangerDesc: "极度危险！建议直接问清楚加班费和调休政策",
        reply: "氛围好很重要！请问团队平时的加班情况大概是怎样的，是有调休安排吗？"
      },
      {
        keywords: ["薪资面议", "看个人能力", "薪资看能力"],
        scene: ["面试现场"],
        original: "薪资面议，看个人能力",
        truth: "预算很低，但如果一开始就说出来你可能直接走人。'看能力'是为了在谈判中掌握主动权。",
        dangerLevel: 3,
        dangerDesc: "中危！请主动先报出你的期望薪资区间，掌握谈判主动权",
        reply: "好的！根据我的经验和对岗位的了解，我的期望薪资在XX-XX范围，您看是否符合贵司的预算？"
      }
    ];

    // 兜底回复
    const fallback = {
      truth: "系统检测到这是一段高度定制化的职场暗语，已超出本数据库破译范围。\n建议：默默截图保存，三年后再打开，你就会懂了。",
      dangerLevel: 3,
      dangerDesc: "未知风险，保持警惕，见机行事",
      reply: "好的，我明白了，我会认真对待的！"
    };

    // ========================================
    // 快速示例数据（6个）
    // ========================================
    const examples = [
      { text: "原则上可以", scene: "职场内部" },
      { text: "最近辛苦一下", scene: "职场内部" },
      { text: "这个需求很简单", scene: "甲方客户" },
      { text: "你们专业的，你们定", scene: "甲方客户" },
      { text: "工作时间比较有弹性", scene: "面试现场" },
      { text: "团队氛围很好，像家人一样", scene: "面试现场" },
    ];

    // ========================================
    // DOM 元素引用
    // ========================================
    const inputText = document.getElementById('inputText');
    const charCount = document.getElementById('charCount');
    const translateBtn = document.getElementById('translateBtn');
    const sceneTabs = document.getElementById('sceneTabs');
    const exampleTags = document.getElementById('exampleTags');
    const outputPlaceholder = document.getElementById('outputPlaceholder');
    const outputResult = document.getElementById('outputResult');
    const truthModule = document.getElementById('truthModule');
    const truthText = document.getElementById('truthText');
    const dangerModule = document.getElementById('dangerModule');
    const skullContainer = document.getElementById('skullContainer');
    const dangerDesc = document.getElementById('dangerDesc');
    const dangerBarFill = document.getElementById('dangerBarFill');
    const replyModule = document.getElementById('replyModule');
    const replyText = document.getElementById('replyText');
    const copyBtn = document.getElementById('copyBtn');
    const outputArea = document.getElementById('outputArea');

    let currentScene = '职场内部';
    let isTranslating = false;

    // ========================================
    // 初始化：生成快速示例标签
    // ========================================
    examples.forEach(ex => {
      const tag = document.createElement('button');
      tag.className = 'example-tag rounded-full px-3 py-1.5 text-xs font-mono';
      tag.textContent = `"${ex.text.length > 12 ? ex.text.slice(0, 12) + '...' : ex.text}"`;
      tag.title = ex.text;
      tag.addEventListener('click', () => {
        // 切换到对应场景
        switchScene(ex.scene);
        // 填入文本
        inputText.value = ex.text;
        updateCharCount();
        // 自动触发翻译
        startTranslation();
      });
      exampleTags.appendChild(tag);
    });

    // ========================================
    // 场景切换
    // ========================================
    function switchScene(sceneName) {
      currentScene = sceneName;
      document.querySelectorAll('.scene-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.scene === sceneName);
      });
    }

    sceneTabs.addEventListener('click', (e) => {
      const tab = e.target.closest('.scene-tab');
      if (tab) {
        switchScene(tab.dataset.scene);
      }
    });

    // ========================================
    // 字数统计
    // ========================================
    function updateCharCount() {
      const len = inputText.value.length;
      charCount.textContent = `${len}/500`;
    }
    inputText.addEventListener('input', updateCharCount);

    // ========================================
    // 匹配算法
    // ========================================
    function translate(inputText, selectedScene) {
      // 第一轮：场景优先匹配
      for (const item of database) {
        const keywordMatch = item.keywords.some(kw => inputText.includes(kw));
        if (!keywordMatch) continue;
        const sceneMatch = item.scene.length === 0 || item.scene.includes(selectedScene);
        if (sceneMatch) return item;
      }
      // 第二轮：降级匹配（关键词匹配但场景不符）
      for (const item of database) {
        const keywordMatch = item.keywords.some(kw => inputText.includes(kw));
        if (keywordMatch) return item;
      }
      // 第三轮：完全未匹配
      return null;
    }

    // ========================================
    // 翻译按钮点击
    // ========================================
    translateBtn.addEventListener('click', startTranslation);

    function startTranslation() {
      if (isTranslating) return;
      const text = inputText.value.trim();
      if (!text) {
        inputText.focus();
        inputText.style.borderColor = 'rgba(255,68,68,0.5)';
        setTimeout(() => { inputText.style.borderColor = ''; }, 1000);
        return;
      }

      isTranslating = true;
      translateBtn.disabled = true;
      translateBtn.innerHTML = '⚡ 破译中...';

      // 平滑滚动到输出区域
      outputArea.scrollIntoView({ behavior: 'smooth', block: 'start' });

      // 隐藏占位，显示结果容器
      outputPlaceholder.classList.add('hidden');
      outputResult.classList.remove('hidden');

      // 重置所有模块
      truthModule.classList.remove('show');
      dangerModule.classList.remove('show');
      replyModule.classList.remove('show');
      truthText.textContent = '';
      truthText.classList.add('decoding');
      skullContainer.innerHTML = '';
      dangerDesc.textContent = '';
      dangerBarFill.style.width = '0%';
      replyText.textContent = '';
      replyText.classList.remove('typewriter-cursor');
      copyBtn.classList.add('hidden');

      // 执行匹配
      const result = translate(text, currentScene) || fallback;

      // 开始动画时序
      animateTruth(result.truth, () => {
        // 真心话动画完成后
        setTimeout(() => {
          animateDanger(result.dangerLevel, result.dangerDesc, () => {
            // 危险等级动画完成后
            setTimeout(() => {
              animateReply(result.reply, () => {
                // 全部完成
                isTranslating = false;
                translateBtn.disabled = false;
                translateBtn.innerHTML = '🔮 一键破译真心话';
              });
            }, 300);
          });
        }, 200);
      });
    }

    // ========================================
    // 动画一：矩阵乱码解密
    // ========================================
    function animateTruth(text, callback) {
      truthModule.classList.add('show');
      const glitchChars = ['$', '%', '@', '&', '*', '#', '?', '!', '/', '\\', '<', '>', '~', '^', '║', '═'];
      const targetChars = [...text];
      const totalLen = targetChars.length;
      let revealedCount = 0;

      // 先显示等长乱码
      let currentDisplay = new Array(totalLen).fill('');
      for (let i = 0; i < totalLen; i++) {
        currentDisplay[i] = glitchChars[Math.floor(Math.random() * glitchChars.length)];
      }
      truthText.textContent = currentDisplay.join('');

      // 乱码刷新定时器（每40ms）
      const glitchInterval = setInterval(() => {
        for (let i = revealedCount; i < totalLen; i++) {
          currentDisplay[i] = glitchChars[Math.floor(Math.random() * glitchChars.length)];
        }
        truthText.textContent = currentDisplay.join('');
      }, 40);

      // 逐字定格定时器（每50ms）
      const revealInterval = setInterval(() => {
        if (revealedCount < totalLen) {
          currentDisplay[revealedCount] = targetChars[revealedCount];
          revealedCount++;
        } else {
          clearInterval(revealInterval);
          clearInterval(glitchInterval);
          truthText.textContent = text;
          truthText.classList.remove('decoding');
          if (callback) callback();
        }
      }, 50);
    }

    // ========================================
    // 动画二：骷髅头逐个弹出 + 危险说明打字机
    // ========================================
    function animateDanger(level, desc, callback) {
      dangerModule.classList.add('show');

      // 生成骷髅头元素
      const skulls = [];
      for (let i = 0; i < level; i++) {
        const span = document.createElement('span');
        span.className = 'skull-pop';
        span.textContent = '☠️';
        skullContainer.appendChild(span);
        skulls.push(span);
      }

      // 逐个弹出（每150ms）
      skulls.forEach((skull, idx) => {
        setTimeout(() => {
          skull.classList.add('show');
        }, idx * 150);
      });

      // 骷髅头弹出完后，显示危险说明（打字机效果）
      const descDelay = level * 150 + 200;
      setTimeout(() => {
        typewriterEffect(dangerDesc, desc, 30, () => {
          // 进度条动画
          const colors = ['#00ff88', '#ffcc00', '#ff6b35', '#ff4444', '#ff00aa'];
          const color = colors[Math.min(level - 1, 4)];
          dangerBarFill.style.width = `${level / 5 * 100}%`;
          dangerBarFill.style.backgroundColor = color;
          dangerBarFill.style.color = color;
          if (callback) callback();
        });
      }, descDelay);
    }

    // ========================================
    // 动画三：打字机效果
    // ========================================
    function typewriterEffect(element, text, speed, callback) {
      const chars = [...text];
      let idx = 0;
      element.textContent = '';
      element.classList.add('typewriter-cursor');

      const interval = setInterval(() => {
        if (idx < chars.length) {
          element.textContent += chars[idx];
          idx++;
        } else {
          clearInterval(interval);
          element.classList.remove('typewriter-cursor');
          if (callback) callback();
        }
      }, speed);
    }

    function animateReply(text, callback) {
      replyModule.classList.add('show');
      typewriterEffect(replyText, text, 30, () => {
        // 打字机完成后，淡入复制按钮
        copyBtn.classList.remove('hidden');
        copyBtn.style.opacity = '0';
        copyBtn.style.transition = 'opacity 0.3s ease';
        requestAnimationFrame(() => {
          copyBtn.style.opacity = '1';
        });
        if (callback) callback();
      });
    }

    // ========================================
    // 一键复制
    // ========================================
    copyBtn.addEventListener('click', () => {
      const text = replyText.textContent;
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.textContent = '✅ 已复制！';
        copyBtn.style.transform = 'scale(0.95)';
        setTimeout(() => {
          copyBtn.textContent = '📋 一键复制';
          copyBtn.style.transform = '';
        }, 1500);
      }).catch(() => {
        // fallback for older browsers
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        copyBtn.textContent = '✅ 已复制！';
        setTimeout(() => {
          copyBtn.textContent = '📋 一键复制';
        }, 1500);
      });
    });

    // ========================================
    // Enter 键触发翻译
    // ========================================
    inputText.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        startTranslation();
      }
    });
  </script>

</body>
