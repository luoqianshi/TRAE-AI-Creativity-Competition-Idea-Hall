<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星云课堂宠物平台 - 演示</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #1a1a2e;
    }

    /* 顶部导航 */
    .app-header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      color: #667eea;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
    }

    .class-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #f1f5f9;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .class-selector:hover {
      background: #e2e8f0;
    }

    .class-name {
      font-weight: 600;
      color: #475569;
    }

    .header-nav {
      display: flex;
      gap: 8px;
    }

    .nav-item {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      color: #64748b;
    }

    .nav-item:hover {
      background: #f1f5f9;
      color: #475569;
    }

    .nav-item.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
    }

    /* 主内容区 */
    .app-main {
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* 统计卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-2px);
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .stat-info {
      flex: 1;
    }

    .stat-num {
      font-size: 28px;
      font-weight: 700;
      color: #1e293b;
    }

    .stat-label {
      font-size: 14px;
      color: #64748b;
    }

    /* 宠物卡片网格 */
    .pets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    .pet-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      transition: all 0.3s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .pet-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
    }

    .pet-card.color-0 { background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(239,246,255,0.95)); }
    .pet-card.color-1 { background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(254,243,199,0.95)); }
    .pet-card.color-2 { background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(220,252,231,0.95)); }
    .pet-card.color-3 { background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(254,226,226,0.95)); }
    .pet-card.color-4 { background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(233,213,255,0.95)); }
    .pet-card.color-5 { background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(199,210,254,0.95)); }
    .pet-card.color-6 { background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,237,213,0.95)); }
    .pet-card.color-7 { background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(209,250,229,0.95)); }

    .pet-level-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .pet-emoji {
      font-size: 48px;
      margin-bottom: 8px;
      display: block;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .pet-name {
      font-size: 16px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 4px;
    }

    .pet-owner {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 8px;
    }

    .pet-score {
      font-size: 18px;
      font-weight: 700;
      color: #667eea;
    }

    .progress-bar {
      height: 4px;
      background: #e2e8f0;
      border-radius: 2px;
      margin-top: 12px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 2px;
      transition: width 0.3s;
    }

    /* 工具面板 */
    .tools-panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 24px;
      margin-top: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .tools-title {
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .tool-btn {
      padding: 16px;
      border-radius: 12px;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .tool-btn:hover {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-color: transparent;
      color: #fff;
    }

    .tool-icon {
      font-size: 24px;
    }

    .tool-name {
      font-size: 14px;
      font-weight: 600;
    }

    /* 弹窗 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: #fff;
      border-radius: 20px;
      padding: 24px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      transform: scale(0.9);
      transition: transform 0.3s;
    }

    .modal-overlay.show .modal-content {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      color: #64748b;
      transition: all 0.2s;
    }

    .modal-close:hover {
      background: #e2e8f0;
      color: #475569;
    }

    /* 积分操作面板 */
    .score-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .score-section {
      background: #f8fafc;
      border-radius: 12px;
      padding: 16px;
    }

    .score-section-title {
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .score-btn {
      padding: 8px 16px;
      border-radius: 8px;
      margin: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
      border: none;
    }

    .score-btn.positive {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
    }

    .score-btn.negative {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
    }

    .score-btn:hover {
      transform: scale(1.05);
    }

    /* 随机点名 */
    .random-picker {
      text-align: center;
      padding: 40px;
    }

    .picker-card {
      width: 200px;
      height: 200px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
    }

    .picker-card:hover {
      transform: scale(1.05);
    }

    .picker-card.flipped {
      background: #fff;
      color: #1e293b;
    }

    .picker-emoji {
      font-size: 64px;
      margin-bottom: 8px;
    }

    .picker-name {
      font-size: 20px;
      font-weight: 700;
    }

    .picker-btn {
      padding: 16px 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .picker-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 30px rgba(102, 126, 234, 0.3);
    }

    /* 座位表 */
    .seating-grid {
      display: grid;
      gap: 8px;
      padding: 20px;
      background: #f8fafc;
      border-radius: 12px;
    }

    .seat-cell {
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid #e2e8f0;
    }

    .seat-cell:hover {
      border-color: #667eea;
    }

    .seat-cell.podium {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      font-weight: 600;
    }

    .seat-cell.empty {
      background: #f1f5f9;
    }

    .seat-emoji {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .seat-name {
      font-size: 12px;
      color: #64748b;
    }

    /* 学生选择器 */
    .student-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      max-height: 300px;
      overflow-y: auto;
      padding: 16px;
      background: #f8fafc;
      border-radius: 12px;
    }

    .student-item {
      padding: 12px;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid #e2e8f0;
      text-align: center;
    }

    .student-item:hover {
      border-color: #667eea;
    }

    .student-item.selected {
      border-color: #667eea;
      background: linear-gradient(135deg, rgba(102,126,234,0.1), rgba(118,75,162,0.1));
    }

    .student-avatar {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
      margin: 0 auto 8px;
    }

    .student-name {
      font-size: 13px;
      font-weight: 500;
      color: #1e293b;
    }

    .student-score {
      font-size: 12px;
      color: #667eea;
      font-weight: 600;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .tools-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .score-panel {
        grid-template-columns: 1fr;
      }

      .student-selector {
        grid-template-columns: repeat(2, 1fr);
      }

      .header-nav {
        display: none;
      }
    }

    /* 动画效果 */
    .fade-in {
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .sparkle {
      position: absolute;
      font-size: 16px;
      animation: sparkle 1s ease infinite;
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <header class="app-header">
    <div class="header-left">
      <div class="logo">
        <div class="logo-icon">🌟</div>
        <span>星云课堂宠物平台</span>
      </div>
      <div class="class-selector" onclick="showClassModal()">
        <span>🏫</span>
        <span class="class-name" id="currentClassName">三年级1班</span>
        <span>▼</span>
      </div>
    </div>
    <nav class="header-nav">
      <div class="nav-item active" onclick="showPage('home')">首页</div>
      <div class="nav-item" onclick="showPage('score')">积分操作</div>
      <div class="nav-item" onclick="showPage('picker')">随机点名</div>
      <div class="nav-item" onclick="showPage('seating')">座位表</div>
    </nav>
  </header>

  <!-- 主内容区 -->
  <main class="app-main" id="mainContent">
    <!-- 首页 -->
    <div id="homePage" class="page-content fade-in">
      <!-- 统计卡片 -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon">👥</div>
          <div class="stat-info">
            <div class="stat-num" id="totalStudents">0</div>
            <div class="stat-label">学生总数</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⭐</div>
          <div class="stat-info">
            <div class="stat-num" id="totalScore">0</div>
            <div class="stat-label">班级总积分</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🏆</div>
          <div class="stat-info">
            <div class="stat-num" id="topStudent">-</div>
            <div class="stat-label">积分冠军</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🐾</div>
          <div class="stat-info">
            <div class="stat-num" id="avgLevel">Lv.0</div>
            <div class="stat-label">平均等级</div>
          </div>
        </div>
      </div>

      <!-- 宠物展示 -->
      <div class="pets-grid" id="petsGrid"></div>

      <!-- 工具面板 -->
      <div class="tools-panel">
        <div class="tools-title">
          <span>🛠️</span>
          <span>课堂互动工具</span>
        </div>
        <div class="tools-grid">
          <div class="tool-btn" onclick="showPage('score')">
            <span class="tool-icon">⭐</span>
            <span class="tool-name">积分操作</span>
          </div>
          <div class="tool-btn" onclick="showPage('picker')">
            <span class="tool-icon">🎯</span>
            <span class="tool-name">随机点名</span>
          </div>
          <div class="tool-btn" onclick="showPage('seating')">
            <span class="tool-icon">🪑</span>
            <span class="tool-name">座位调换</span>
          </div>
          <div class="tool-btn" onclick="showModal('pk')">
            <span class="tool-icon">⚔️</span>
            <span class="tool-name">小组PK</span>
          </div>
          <div class="tool-btn" onclick="showModal('voting')">
            <span class="tool-icon">🗳️</span>
            <span class="tool-name">投票表决</span>
          </div>
          <div class="tool-btn" onclick="showModal('buzzer')">
            <span class="tool-icon">🔔</span>
            <span class="tool-name">抢答器</span>
          </div>
          <div class="tool-btn" onclick="showModal('countdown')">
            <span class="tool-icon">⏱️</span>
            <span class="tool-name">计时器</span>
          </div>
          <div class="tool-btn" onclick="showModal('grouping')">
            <span class="tool-icon">👥</span>
            <span class="tool-name">随机分组</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 积分操作页 -->
    <div id="scorePage" class="page-content" style="display:none">
      <div class="tools-panel fade-in">
        <div class="tools-title">
          <span>⭐</span>
          <span>积分操作</span>
        </div>
        <div class="score-panel">
          <div class="score-section">
            <div class="score-section-title">
              <span>👍</span>
              <span>加分操作</span>
            </div>
            <div id="positiveRules">
              <button class="score-btn positive" onclick="quickScore(3)">积极发言 +3</button>
              <button class="score-btn positive" onclick="quickScore(5)">作业优秀 +5</button>
              <button class="score-btn positive" onclick="quickScore(2)">帮助同学 +2</button>
              <button class="score-btn positive" onclick="quickScore(4)">创新思维 +4</button>
              <button class="score-btn positive" onclick="quickScore(3)">进步明显 +3</button>
            </div>
          </div>
          <div class="score-section">
            <div class="score-section-title">
              <span>⚠️</span>
              <span>减分操作</span>
            </div>
            <div id="negativeRules">
              <button class="score-btn negative" onclick="quickScore(-2)">纪律问题 -2</button>
              <button class="score-btn negative" onclick="quickScore(-3)">作业未交 -3</button>
              <button class="score-btn negative" onclick="quickScore(-1)">迟到早退 -1</button>
              <button class="score-btn negative" onclick="quickScore(-2)">影响他人 -2</button>
            </div>
          </div>
        </div>
        <div class="tools-title" style="margin-top:20px">
          <span>👥</span>
          <span>选择学生</span>
        </div>
        <div class="student-selector" id="scoreStudentSelector"></div>
      </div>
    </div>

    <!-- 随机点名页 -->
    <div id="pickerPage" class="page-content" style="display:none">
      <div class="tools-panel fade-in">
        <div class="random-picker">
          <div class="picker-card" id="pickerCard" onclick="pickStudent()">
            <div class="picker-emoji">🎯</div>
            <div class="picker-name">点击开始点名</div>
          </div>
          <button class="picker-btn" onclick="pickStudent()">🎲 随机点名</button>
        </div>
        <div class="tools-title">
          <span>⭐</span>
          <span>快捷加分</span>
        </div>
        <div style="text-align:center;padding:16px">
          <button class="score-btn positive" onclick="addScoreToPicked(3)">+3分</button>
          <button class="score-btn positive" onclick="addScoreToPicked(5)">+5分</button>
          <button class="score-btn positive" onclick="addScoreToPicked(2)">+2分</button>
          <button class="score-btn negative" onclick="addScoreToPicked(-2)">-2分</button>
        </div>
      </div>
    </div>

    <!-- 座位表页 -->
    <div id="seatingPage" class="page-content" style="display:none">
      <div class="tools-panel fade-in">
        <div class="tools-title">
          <span>🪑</span>
          <span>座位布局</span>
          <button class="picker-btn" style="margin-left:auto;padding:8px 16px;font-size:14px" onclick="shuffleSeats()">🔄 随机调换</button>
        </div>
        <div class="seating-grid" id="seatingGrid" style="grid-template-columns: repeat(6, 1fr)"></div>
      </div>
    </div>
  </main>

  <!-- 弹窗 -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">弹窗标题</div>
        <div class="modal-close" onclick="closeModalForce()">✕</div>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    // 初始化数据
    const DEFAULT_DATA = {
      classes: [
        { id: 'class1', name: '三年级1班', grade: 3 },
        { id: 'class2', name: '四年级2班', grade: 4 }
      ],
      students: [
        { id: 's1', name: '小明', pet_emoji: '🐱', pet_name: '小猫咪', score: 45, level: 2 },
        { id: 's2', name: '小红', pet_emoji: '🐰', pet_name: '小白兔', score: 38, level: 1 },
        { id: 's3', name: '小华', pet_emoji: '🐶', pet_name: '小狗狗', score: 52, level: 3 },
        { id: 's4', name: '小丽', pet_emoji: '🐼', pet_name: '熊猫宝宝', score: 30, level: 1 },
        { id: 's5', name: '小强', pet_emoji: '🦊', pet_name: '小狐狸', score: 65, level: 4 },
        { id: 's6', name: '小美', pet_emoji: '🦄', pet_name: '独角兽', score: 48, level: 2 },
        { id: 's7', name: '小龙', pet_emoji: '🐲', pet_name: '小龙龙', score: 55, level: 3 },
        { id: 's8', name: '小凤', pet_emoji: '🦋', pet_name: '小蝴蝶', score: 42, level: 2 },
        { id: 's9', name: '小虎', pet_emoji: '🐯', pet_name: '小老虎', score: 70, level: 4 },
        { id: 's10', name: '小燕', pet_emoji: '🐦', pet_name: '小鸟儿', score: 35, level: 1 },
        { id: 's11', name: '小杰', pet_emoji: '🦁', pet_name: '狮子王', score: 58, level: 3 },
        { id: 's12', name: '小雪', pet_emoji: '🐧', pet_name: '企鹅宝宝', score: 40, level: 2 }
      ],
      seating: [
        [' podium', 'podium', 'podium', 'podium', 'podium', 'podium' ],
        [ 's1', 's2', 'empty', 'empty', 's3', 's4' ],
        [ 's5', 's6', 'empty', 'empty', 's7', 's8' ],
        [ 's9', 's10', 'empty', 'empty', 's11', 's12' ],
        [ 'empty', 'empty', 'empty', 'empty', 'empty', 'empty' ]
      ],
      currentClass: 'class1',
      selectedStudents: [],
      pickedStudent: null
    };

    // 从localStorage加载或初始化数据
    let appData = JSON.parse(localStorage.getItem('nebulaClassroomData')) || DEFAULT_DATA;

    // 保存数据到localStorage
    function saveData() {
      localStorage.setItem('nebulaClassroomData', JSON.stringify(appData));
    }

    // 获取等级颜色
    function getLevelColor(level) {
      const colors = {
        0: '#94a3b8',
        1: '#22c55e',
        2: '#3b82f6',
        3: '#8b5cf6',
        4: '#f59e0b',
        5: '#ef4444',
        6: '#ec4899',
        7: '#6366f1',
        8: '#14b8a6'
      };
      return colors[level] || '#94a3b8';
    }

    // 计算经验百分比
    function getExpPercent(student) {
      const thresholds = [0, 30, 60, 120, 240, 480, 960, 1920, 3840];
      const level = student.level || 0;
      const currentThreshold = thresholds[level] || 0;
      const nextThreshold = thresholds[level + 1] || thresholds[thresholds.length - 1];
      const progress = student.score - currentThreshold;
      const range = nextThreshold - currentThreshold;
      return Math.min(100, Math.max(0, (progress / range) * 100));
    }

    // 计算等级
    function calculateLevel(score) {
      const thresholds = [0, 30, 60, 120, 240, 480, 960, 1920, 3840];
      for (let i = thresholds.length - 1; i >= 0; i--) {
        if (score >= thresholds[i]) return i;
      }
      return 0;
    }

    // 更新统计数据
    function updateStats() {
      const students = appData.students;
      const totalScore = students.reduce((sum, s) => sum + s.score, 0);
      const avgLevel = Math.round(students.reduce((sum, s) => sum + s.level, 0) / students.length);
      const topStudent = students.reduce((max, s) => s.score > max.score ? s : max, students[0]);

      document.getElementById('totalStudents').textContent = students.length;
      document.getElementById('totalScore').textContent = totalScore;
      document.getElementById('topStudent').textContent = topStudent.name;
      document.getElementById('avgLevel').textContent = 'Lv.' + avgLevel;
    }

    // 渲染宠物卡片
    function renderPets() {
      const grid = document.getElementById('petsGrid');
      grid.innerHTML = '';

      appData.students.forEach((student, index) => {
        const card = document.createElement('div');
        card.className = `pet-card color-${index % 8}`;
        card.onclick = () => showStudentDetail(student);

        card.innerHTML = `
          <div class="pet-level-badge" style="background:${getLevelColor(student.level)}">Lv.${student.level}</div>
          <span class="pet-emoji">${student.pet_emoji}</span>
          <div class="pet-name">${student.pet_name}</div>
          <div class="pet-owner">${student.name}</div>
          <div class="pet-score">${student.score}分</div>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${getExpPercent(student)}%"></div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // 渲染学生选择器
    function renderStudentSelector() {
      const selector = document.getElementById('scoreStudentSelector');
      selector.innerHTML = '';

      appData.students.forEach(student => {
        const item = document.createElement('div');
        item.className = 'student-item' + (appData.selectedStudents.includes(student.id) ? ' selected' : '');
        item.onclick = () => toggleStudentSelect(student.id);

        item.innerHTML = `
          <div class="student-avatar">${student.pet_emoji}</div>
          <div class="student-name">${student.name}</div>
          <div class="student-score">${student.score}分</div>
        `;

        selector.appendChild(item);
      });
    }

    // 切换学生选择
    function toggleStudentSelect(studentId) {
      const index = appData.selectedStudents.indexOf(studentId);
      if (index > -1) {
        appData.selectedStudents.splice(index, 1);
      } else {
        appData.selectedStudents.push(studentId);
      }
      saveData();
      renderStudentSelector();
    }

    // 快捷积分
    function quickScore(score) {
      if (appData.selectedStudents.length === 0) {
        alert('请先选择学生');
        return;
      }

      appData.selectedStudents.forEach(id => {
        const student = appData.students.find(s => s.id === id);
        if (student) {
          student.score += score;
          student.level = calculateLevel(student.score);
        }
      });

      saveData();
      updateStats();
      renderPets();
      renderStudentSelector();
      renderSeating();

      // 显示动画效果
      showScoreAnimation(score);
    }

    // 显示积分动画
    function showScoreAnimation(score) {
      const anim = document.createElement('div');
      anim.style.cssText = `
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 48px;
        font-weight: 700;
        color: ${score > 0 ? '#22c55e' : '#ef4444'};
        z-index: 300;
        animation: scorePop 1s ease forwards;
      `;
      anim.textContent = score > 0 ? `+${score}` : score;
      document.body.appendChild(anim);

      setTimeout(() => anim.remove(), 1000);
    }

    // 添加积分动画样式
    const styleSheet = document.createElement('style');
    styleSheet.textContent = `
      @keyframes scorePop {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
        50% { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }
        100% { opacity: 0; transform: translate(-50%, -100%) scale(1); }
      }
    `;
    document.head.appendChild(styleSheet);

    // 随机点名
    function pickStudent() {
      const card = document.getElementById('pickerCard');
      const students = appData.students;

      // 翻牌动画
      card.style.transform = 'scale(0.9)';
      card.innerHTML = `
        <div class="picker-emoji">🎲</div>
        <div class="picker-name">抽取中...</div>
      `;

      // 随机选择
      setTimeout(() => {
        const randomIndex = Math.floor(Math.random() * students.length);
        const student = students[randomIndex];
        appData.pickedStudent = student;
        saveData();

        card.classList.add('flipped');
        card.style.transform = 'scale(1)';
        card.innerHTML = `
          <div class="picker-emoji">${student.pet_emoji}</div>
          <div class="picker-name">${student.name}</div>
        `;
      }, 500);
    }

    // 给点名学生加分
    function addScoreToPicked(score) {
      if (!appData.pickedStudent) {
        alert('请先点名');
        return;
      }

      const student = appData.students.find(s => s.id === appData.pickedStudent.id);
      if (student) {
        student.score += score;
        student.level = calculateLevel(student.score);
        saveData();
        updateStats();
        renderPets();
        renderSeating();
        showScoreAnimation(score);
      }
    }

    // 渲染座位表
    function renderSeating() {
      const grid = document.getElementById('seatingGrid');
      grid.innerHTML = '';

      appData.seating.forEach((row, rowIndex) => {
        row.forEach((cellId, colIndex) => {
          const cell = document.createElement('div');
          cell.className = 'seat-cell';

          if (cellId === 'podium') {
            cell.classList.add('podium');
            if (colIndex === 0) {
              cell.style.gridColumn = 'span 6';
              cell.innerHTML = `<div class="seat-emoji">👨‍🏫</div><div class="seat-name">讲台</div>`;
              grid.appendChild(cell);
            }
            return;
          }

          if (cellId === 'empty') {
            cell.classList.add('empty');
            cell.innerHTML = `<div class="seat-emoji">➖</div><div class="seat-name">空位</div>`;
          } else {
            const student = appData.students.find(s => s.id === cellId);
            if (student) {
              cell.innerHTML = `
                <div class="seat-emoji">${student.pet_emoji}</div>
                <div class="seat-name">${student.name}</div>
                <div style="font-size:10px;color:#667eea">${student.score}分</div>
              `;
              cell.onclick = () => showStudentDetail(student);
            }
          }

          grid.appendChild(cell);
        });
      });
    }

    // 随机调换座位
    function shuffleSeats() {
      const studentIds = appData.students.map(s => s.id);
      
      // 洗牌算法
      for (let i = studentIds.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [studentIds[i], studentIds[j]] = [studentIds[j], studentIds[i]];
      }

      // 重新分配座位（保留讲台和空位）
      let idx = 0;
      for (let r = 1; r < appData.seating.length; r++) {
        for (let c = 0; c < appData.seating[r].length; c++) {
          if (appData.seating[r][c] !== 'podium' && appData.seating[r][c] !== 'empty') {
            appData.seating[r][c] = studentIds[idx++] || 'empty';
          }
        }
      }

      saveData();
      renderSeating();
    }

    // 显示学生详情
    function showStudentDetail(student) {
      showModal('student', student);
    }

    // 页面切换
    function showPage(page) {
      document.querySelectorAll('.page-content').forEach(p => p.style.display = 'none');
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

      document.getElementById(page + 'Page').style.display = 'block';
      event.target.classList.add('active');

      if (page === 'score') {
        renderStudentSelector();
      } else if (page === 'seating') {
        renderSeating();
      }
    }

    // 显示弹窗
    function showModal(type, data) {
      const overlay = document.getElementById('modalOverlay');
      const title = document.getElementById('modalTitle');
      const body = document.getElementById('modalBody');

      if (type === 'student') {
        title.textContent = '学生详情';
        body.innerHTML = `
          <div style="text-align:center;padding:20px">
            <div style="font-size:64px;margin-bottom:16px">${data.pet_emoji}</div>
            <div style="font-size:24px;font-weight:700;color:#1e293b">${data.name}</div>
            <div style="font-size:16px;color:#64748b;margin-bottom:16px">${data.pet_name}</div>
            <div style="display:flex;gap:16px;justify-content:center;margin-bottom:20px">
              <div style="padding:12px 24px;background:#f8fafc;border-radius:12px">
                <div style="font-size:20px;font-weight:700;color:#667eea">${data.score}</div>
                <div style="font-size:12px;color:#64748b">总积分</div>
              </div>
              <div style="padding:12px 24px;background:${getLevelColor(data.level)};border-radius:12px;color:#fff">
                <div style="font-size:20px;font-weight:700">Lv.${data.level}</div>
                <div style="font-size:12px">等级</div>
              </div>
            </div>
            <div style="display:flex;gap:8px;justify-content:center">
              <button class="score-btn positive" onclick="adjustScore('${data.id}', 3)">+3分</button>
              <button class="score-btn positive" onclick="adjustScore('${data.id}', 5)">+5分</button>
              <button class="score-btn negative" onclick="adjustScore('${data.id}', -2)">-2分</button>
            </div>
          </div>
        `;
      } else if (type === 'pk') {
        title.textContent = '小组PK';
        body.innerHTML = `
          <div style="padding:20px;text-align:center">
            <div style="font-size:48px;margin-bottom:16px">⚔️</div>
            <p style="color:#64748b">将学生分成两组进行PK竞赛</p>
            <button class="picker-btn" onclick="startPK()">开始PK</button>
          </div>
        `;
      } else if (type === 'voting') {
        title.textContent = '投票表决';
        body.innerHTML = `
          <div style="padding:20px;text-align:center">
            <div style="font-size:48px;margin-bottom:16px">🗳️</div>
            <p style="color:#64748b">发起班级投票，让学生参与决策</p>
            <button class="picker-btn">发起投票</button>
          </div>
        `;
      } else if (type === 'buzzer') {
        title.textContent = '抢答器';
        body.innerHTML = `
          <div style="padding:20px;text-align:center">
            <div style="font-size:48px;margin-bottom:16px">🔔</div>
            <p style="color:#64748b">课堂抢答工具，激发学生积极性</p>
            <button class="picker-btn">开始抢答</button>
          </div>
        `;
      } else if (type === 'countdown') {
        title.textContent = '计时器';
        body.innerHTML = `
          <div style="padding:20px;text-align:center">
            <div style="font-size:48px;margin-bottom:16px">⏱️</div>
            <p style="color:#64748b">课堂计时工具，管理活动时间</p>
            <div style="display:flex;gap:8px;justify-content:center">
              <button class="score-btn positive">1分钟</button>
              <button class="score-btn positive">3分钟</button>
              <button class="score-btn positive">5分钟</button>
            </div>
          </div>
        `;
      } else if (type === 'grouping') {
        title.textContent = '随机分组';
        body.innerHTML = `
          <div style="padding:20px;text-align:center">
            <div style="font-size:48px;margin-bottom:16px">👥</div>
            <p style="color:#64748b">将学生随机分成若干小组</p>
            <button class="picker-btn">开始分组</button>
          </div>
        `;
      }

      overlay.classList.add('show');
    }

    // 调整单个学生积分
    function adjustScore(studentId, score) {
      const student = appData.students.find(s => s.id === studentId);
      if (student) {
        student.score += score;
        student.level = calculateLevel(student.score);
        saveData();
        updateStats();
        renderPets();
        renderSeating();
        showScoreAnimation(score);
        closeModalForce();
        showModal('student', student);
      }
    }

    // 关闭弹窗
    function closeModal(event) {
      if (event.target === document.getElementById('modalOverlay')) {
        document.getElementById('modalOverlay').classList.remove('show');
      }
    }

    function closeModalForce() {
      document.getElementById('modalOverlay').classList.remove('show');
    }

    // 初始化
    function init() {
      updateStats();
      renderPets();
      renderStudentSelector();
      renderSeating();
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
