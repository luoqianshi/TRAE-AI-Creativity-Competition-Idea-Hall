<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>良言模拟器 — 社交对话训练</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #F8F7FC;
    --surface: #FFFFFF;
    --ink: #1E1B2E;
    --muted: #8A8799;
    --rule: #EDEAF3;
    --brand: #6366F1;
    --brand-light: #E0E7FF;
    --brand-soft: #F0F1FE;
    --brand-text: #4338CA;
    --success: #10B981;
    --warning: #F59E0B;
    --danger: #EF4444;
    --radius: 20px;
    --radius-sm: 14px;
    --shadow-sm: 0 1px 2px rgba(30, 27, 46, 0.04);
    --shadow: 0 4px 12px rgba(30, 27, 46, 0.06);
    --shadow-lg: 0 12px 32px rgba(30, 27, 46, 0.1);
    --shadow-xl: 0 20px 48px rgba(30, 27, 46, 0.12);
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .header {
    width: 100%;
    max-width: 640px;
    padding: 1.25rem 1.5rem 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(248, 247, 252, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(237, 234, 243, 0.6);
  }
  .header .logo {
    font-size: 1.5rem;
    filter: drop-shadow(0 2px 4px rgba(99, 102, 241, 0.2));
  }
  .header .title {
    font-size: 1.2rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--ink), var(--brand));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
  }
  .header .subtitle {
    font-size: 0.75rem;
    color: var(--muted);
    margin-left: auto;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .page {
    display: none;
    width: 100%;
    max-width: 640px;
    padding: 0 1.25rem 2.5rem;
    animation: pageIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .page.active { display: block; }
  @keyframes pageIn {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .hero {
    position: relative;
    background: linear-gradient(135deg, #3730A3 0%, #6366F1 50%, #818CF8 100%);
    color: white;
    border-radius: var(--radius);
    padding: 2.5rem 2rem;
    margin-bottom: 2rem;
    text-align: center;
    overflow: hidden;
    box-shadow: var(--shadow-lg);
  }
  .hero::before {
    content: "";
    position: absolute;
    top: -50%;
    right: -20%;
    width: 300px;
    height: 300px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
    filter: blur(60px);
  }
  .hero::after {
    content: "";
    position: absolute;
    bottom: -30%;
    left: -10%;
    width: 200px;
    height: 200px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
    filter: blur(40px);
  }
  .hero h2 {
    position: relative;
    font-size: 1.5rem;
    margin-bottom: 0.75rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    text-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .hero p {
    position: relative;
    font-size: 0.9rem;
    opacity: 0.9;
    line-height: 1.7;
    font-weight: 400;
    max-width: 380px;
    margin: 0 auto;
  }
  .sectionTitle {
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 1rem;
    padding-left: 0.75rem;
    border-left: 3px solid var(--brand);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .cardGrid { display: grid; gap: 0.875rem; margin-bottom: 2rem; }
  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--radius-sm);
    padding: 1.125rem 1.25rem;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--card-accent, var(--brand));
    opacity: 0;
    transition: opacity 0.3s;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
    border-color: transparent;
  }
  .card:hover::before { opacity: 1; }
  .card .avatar {
    width: 48px; height: 48px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; flex-shrink: 0;
    background: var(--avatar-bg, rgba(99,102,241,0.1));
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .card .info { flex: 1; min-width: 0; }
  .card .info .name {
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--ink);
    margin-bottom: 0.2rem;
  }
  .card .info .desc {
    font-size: 0.78rem;
    color: var(--muted);
    line-height: 1.4;
  }
  .card .tag {
    font-size: 0.7rem;
    padding: 0.3rem 0.7rem;
    border-radius: 100px;
    background: var(--brand-soft);
    color: var(--brand-text);
    font-weight: 600;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .chatContainer {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    height: calc(100vh - 180px);
    display: flex; flex-direction: column;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
  }
  .chatHeader {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(8px);
  }
  .chatHeader .backBtn {
    font-size: 0.85rem;
    color: var(--muted);
    cursor: pointer;
    background: rgba(237,234,243,0.5);
    border: none;
    padding: 0.4rem 0.75rem;
    border-radius: 10px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .chatHeader .backBtn:hover { background: var(--rule); color: var(--ink); }
  .chatHeader .chatTitle {
    font-weight: 700;
    font-size: 0.95rem;
    flex: 1;
    color: var(--ink);
  }
  .chatHeader .roundTag {
    font-size: 0.7rem;
    padding: 0.3rem 0.75rem;
    border-radius: 100px;
    background: var(--brand-soft);
    color: var(--brand-text);
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .chatBody {
    flex: 1; overflow-y: auto; padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    background: linear-gradient(180deg, #FAFAFC 0%, var(--surface) 100%);
  }
  .msg {
    max-width: 88%;
    font-size: 0.9rem;
    line-height: 1.6;
    animation: msgIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .msg.ai {
    align-self: flex-start;
    display: flex;
    gap: 0.625rem;
    max-width: 92%;
  }
  .msg.ai .msgAvatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--avatar-bg, #F3F4F6);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .msg.ai .msgContent {
    background: #FFFFFF;
    border: 1px solid var(--rule);
    border-radius: 16px;
    border-top-left-radius: 4px;
    padding: 0.875rem 1.125rem;
    box-shadow: var(--shadow-sm);
  }
  .msg.ai .msgMeta {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--danger);
    margin-bottom: 0.35rem;
    letter-spacing: 0.02em;
  }
  .msg.ai .msgText { color: var(--ink); }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #6366F1 0%, #818CF8 100%);
    color: white;
    border-radius: 16px;
    border-top-right-radius: 4px;
    padding: 0.875rem 1.125rem;
    box-shadow: 0 4px 12px rgba(99,102,241,0.25);
    font-weight: 500;
  }
  .msg.feedback {
    align-self: center;
    max-width: 96%;
    background: #FFFFFF;
    border: 1px solid #D1FAE5;
    border-radius: var(--radius-sm);
    padding: 1.125rem 1.25rem;
    color: var(--ink);
    font-size: 0.85rem;
    box-shadow: var(--shadow);
  }
  .msg.feedback .feedbackHeader {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.875rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid #F0FDF4;
  }
  .msg.feedback .feedbackScore {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #10B981, #34D399);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    font-weight: 800;
    box-shadow: 0 4px 10px rgba(16, 185, 129, 0.25);
  }
  .msg.feedback .feedbackLabel {
    font-size: 1rem;
    font-weight: 700;
    color: var(--success);
  }
  .msg.feedback .feedbackSection {
    margin-bottom: 0.625rem;
  }
  .msg.feedback .feedbackSection:last-child { margin-bottom: 0; }
  .msg.feedback .feedbackTitle {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.35rem;
    color: var(--muted);
  }
  .msg.feedback .feedbackSection.good .feedbackTitle { color: var(--success); }
  .msg.feedback .feedbackSection.bad .feedbackTitle { color: var(--danger); }
  .msg.feedback .feedbackSection.suggest .feedbackTitle { color: var(--brand); }
  .msg.feedback .feedbackSection.example .feedbackTitle { color: #7C3AED; }
  .msg.feedback .feedbackSection.direction .feedbackTitle { color: #0EA5E9; }
  .msg.feedback .feedbackSection.strategy .feedbackTitle { color: #EA580C; }
  .msg.feedback .exampleBox {
    background: linear-gradient(135deg, #F5F3FF, #EDE9FE);
    border: 1px solid #DDD6FE;
    border-radius: 12px;
    padding: 0.875rem 1rem;
    position: relative;
    margin-top: 0.25rem;
  }
  .msg.feedback .exampleBox .exampleBadge {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0.15rem 0.5rem;
    border-radius: 6px;
    background: #8B5CF6;
    color: white;
    margin-bottom: 0.5rem;
  }
  .msg.feedback .exampleBox p {
    font-style: italic;
    color: #5B21B6;
    line-height: 1.6;
    font-size: 0.85rem;
  }
  .msg.feedback .feedbackSection.direction p {
    background: linear-gradient(135deg, #F0F9FF, #E0F2FE);
    border: 1px solid #BAE6FD;
    border-radius: 10px;
    padding: 0.75rem 1rem;
    color: #0369A1;
    line-height: 1.6;
  }
  .msg.feedback .feedbackSection.strategy p {
    background: linear-gradient(135deg, #FFF7ED, #FFEDD5);
    border: 1px solid #FED7AA;
    border-radius: 10px;
    padding: 0.75rem 1rem;
    color: #9A3412;
    line-height: 1.6;
  }
  .msg.feedback ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .msg.feedback li {
    padding-left: 1.25rem;
    position: relative;
    margin-bottom: 0.25rem;
    line-height: 1.5;
  }
  .msg.feedback li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.5rem;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.5;
  }
  .msg.feedback .feedbackSection.good li::before { background: var(--success); }
  .msg.feedback .feedbackSection.bad li::before { background: var(--danger); }
  .msg.hint {
    align-self: center;
    background: linear-gradient(135deg, #FEF3C7, #FDE68A);
    border: none;
    color: #78350F;
    font-size: 0.8rem;
    padding: 0.625rem 1rem;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(245, 158, 11, 0.12);
    font-weight: 500;
  }
  .chatInputArea {
    padding: 1rem 1.25rem;
    border-top: 1px solid var(--rule);
    display: flex;
    gap: 0.625rem;
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(8px);
  }
  .chatInputArea input {
    flex: 1;
    padding: 0.75rem 1.25rem;
    border: 1.5px solid var(--rule);
    border-radius: 14px;
    font-size: 0.9rem;
    outline: none;
    background: #FAFAFC;
    transition: all 0.2s;
    font-family: inherit;
  }
  .chatInputArea input:focus {
    border-color: var(--brand);
    background: #FFFFFF;
    box-shadow: 0 0 0 4px rgba(99,102,241,0.1);
  }
  .chatInputArea input::placeholder { color: #C4C1D0; }
  .chatInputArea button {
    padding: 0.75rem 1.5rem;
    background: linear-gradient(135deg, var(--brand), #818CF8);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(99,102,241,0.3);
    transition: all 0.2s;
    font-family: inherit;
  }
  .chatInputArea button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(99,102,241,0.4);
  }
  .chatInputArea button:active:not(:disabled) { transform: translateY(0); }
  .chatInputArea button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
  }
  .feedbackActions {
    display: flex;
    gap: 0.625rem;
    justify-content: center;
    padding: 0.5rem 0;
    animation: fadeIn 0.3s ease;
  }
  .fbBtn {
    padding: 0.5rem 1.25rem;
    border: 1.5px solid var(--rule);
    border-radius: 12px;
    background: var(--surface);
    font-size: 0.85rem;
    cursor: pointer;
    color: var(--ink);
    font-weight: 500;
    transition: all 0.2s;
    font-family: inherit;
  }
  .fbBtn:hover {
    border-color: var(--brand);
    color: var(--brand);
    transform: translateY(-1px);
    box-shadow: var(--shadow);
  }
  .fbBtn.primary {
    background: linear-gradient(135deg, var(--brand), #818CF8);
    color: white;
    border-color: transparent;
    box-shadow: 0 4px 12px rgba(99,102,241,0.3);
  }
  .fbBtn.primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(99,102,241,0.4);
    color: white;
  }
  .fbBtn:active { transform: translateY(0); }
  /* 设置按钮与模态框 */
  .settingsBtn {
    font-size: 0.8rem;
    background: rgba(237,234,243,0.5);
    border: 1px solid var(--rule);
    padding: 0.35rem 0.75rem;
    border-radius: 10px;
    cursor: pointer;
    color: var(--muted);
    margin-left: 0.5rem;
    font-weight: 500;
    transition: all 0.2s;
    font-family: inherit;
  }
  .settingsBtn:hover {
    background: var(--rule);
    color: var(--ink);
    border-color: #D8D4E2;
  }
  .modalOverlay {
    position: fixed; inset: 0;
    background: rgba(30, 27, 46, 0.35);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    animation: fadeIn 0.2s ease;
  }
  .modalOverlay.active { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: var(--radius);
    width: 90%;
    max-width: 440px;
    padding: 1.75rem;
    box-shadow: var(--shadow-xl);
    border: 1px solid var(--rule);
    animation: modalIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.94) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal h3 {
    margin-bottom: 1.25rem;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--ink);
  }
  .modal label {
    display: block;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 0.35rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .modal input, .modal select, .modal textarea {
    width: 100%;
    padding: 0.625rem 0.875rem;
    border: 1.5px solid var(--rule);
    border-radius: 10px;
    margin-bottom: 1rem;
    font-size: 0.9rem;
    font-family: inherit;
    background: #FAFAFC;
    transition: all 0.2s;
    color: var(--ink);
  }
  .modal input:focus, .modal textarea:focus {
    outline: none;
    border-color: var(--brand);
    background: #FFFFFF;
    box-shadow: 0 0 0 4px rgba(99,102,241,0.1);
  }
  .modal textarea { resize: vertical; line-height: 1.5; }
  .modal .modalBtns {
    display: flex;
    gap: 0.625rem;
    justify-content: flex-end;
    margin-top: 0.5rem;
  }
  .modal .modalBtns button {
    padding: 0.5rem 1.25rem;
    border-radius: 10px;
    border: 1.5px solid var(--rule);
    background: var(--surface);
    font-size: 0.85rem;
    cursor: pointer;
    font-weight: 500;
    color: var(--ink);
    transition: all 0.2s;
    font-family: inherit;
  }
  .modal .modalBtns button:hover {
    border-color: var(--brand);
    color: var(--brand);
  }
  .modal .modalBtns .primary {
    background: linear-gradient(135deg, var(--brand), #818CF8);
    color: white;
    border-color: transparent;
    box-shadow: 0 4px 12px rgba(99,102,241,0.3);
  }
  .modal .modalBtns .primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(99,102,241,0.4);
    color: white;
  }
  .aiBadge {
    font-size: 0.68rem;
    padding: 0.25rem 0.625rem;
    border-radius: 100px;
    background: linear-gradient(135deg, #E0E7FF, #C7D2FE);
    color: #3730A3;
    font-weight: 700;
    margin-left: auto;
    letter-spacing: 0.03em;
    box-shadow: 0 2px 6px rgba(99,102,241,0.1);
  }
  .loadingMsg {
    align-self: center;
    color: var(--muted);
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    background: var(--surface);
    border-radius: 12px;
    border: 1px solid var(--rule);
    box-shadow: var(--shadow-sm);
  }
  .loadingMsg::after {
    content: "";
    width: 16px; height: 16px;
    border: 2.5px solid var(--rule);
    border-top-color: var(--brand);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 500px) {
    .header { padding: 1rem 1rem 0.5rem; }
    .hero { padding: 2rem 1.25rem; border-radius: 16px; }
    .hero h2 { font-size: 1.25rem; }
    .card { padding: 1rem; border-radius: 14px; }
    .chatContainer { height: calc(100vh - 160px); border-radius: 16px; }
    .page { padding: 0 1rem 2rem; }
  }
</style>
</head>
<body>

<div class="header">
  <span class="logo">💬</span>
  <span class="title">良言模拟器</span>
  <span class="subtitle">AI 社交对话训练营</span>
  <button class="settingsBtn" onclick="openSettings()">⚙️ 设置</button>
</div>

<div class="page active" id="pageRole">
  <div class="hero">
    <h2>社交模拟训练场</h2>
    <p>选择一个人物角色，模拟真实对话场景，<br>练习得体的回应方式，提升你的沟通能力。</p>
  </div>
  <h3 class="sectionTitle">选择训练对象</h3>
  <div class="cardGrid" id="roleList"></div>
</div>

<div class="page" id="pageScenario">
  <div class="hero">
    <h2 id="scenarioHeroTitle">选择场景</h2>
    <p id="scenarioHeroDesc">每个场景都是一次真实的对话演练</p>
  </div>
  <h3 class="sectionTitle">可用场景</h3>
  <div class="cardGrid" id="scenarioList"></div>
</div>

<div class="page" id="pageChat">
  <div class="chatContainer">
    <div class="chatHeader">
      <button class="backBtn" onclick="goBack()">← 返回</button>
      <span class="chatTitle" id="chatTitle">对话训练</span>

// 保留原有的规则评分作为 fallback
function getScoreAnalysisFallback(text, personaId) {
  text = text.trim();
  let score = 50, good = [], bad = [], suggest = '';
  let example = '', direction = '', strategy = '';

  if (text.length < 10) { score -= 15; bad.push('回应过短，显得敷衍'); }
  if (text.length > 80) { score += 10; good.push('回应充实，有内容'); }
  if (/[？?]/.test(text)) { score += 10; good.push('善用提问，变被动为主动'); }
  if (/但是|可是|不过/.test(text)) { score -= 10; bad.push('"但是"容易显得反驳'); }
  if (/确实|您说得对|有道理/.test(text)) { score += 15; good.push('先肯定对方，化解攻击性'); }
  if (/我|我觉得|我认为/.test(text)) { score += 5; good.push('使用"我"表达，避免指责'); }

  if (personaId === 'boss') {
    if (/方案|计划|备选|Plan B/.test(text)) { score += 15; good.push('提供解决方案，而非只解释'); }
    if (/来得及|没问题|可以/.test(text)) { score -= 10; bad.push('过度承诺，可能无法兑现'); }
    example = '张总，您提的成本问题确实关键。我准备了两版方案：A版保留全部功能但成本增加10%，B版核心功能不变、成本不变，您倾向哪个方向？';
    direction = '面对上司的质疑，先承认问题，再用"选择题"代替"问答题"，把主动权握在自己手里。';
    strategy = '对结果导向型上司，不要只解释原因，要提供方案。用数据和选项降低他的决策成本。';
  }
  if (personaId === 'colleague') {
    if (/记录|证据|群里|时间/.test(text)) { score += 10; good.push('有理有据，不卑不亢'); }
    if (/抱歉|对不起|我的错/.test(text)) { score -= 15; bad.push('轻易认错容易被坐实"锅"'); }
    example = '李姐，我查了一下记录，数据是在周三提交的，项目延期是因为需求变更审批耽误了两天。下次有变动我们提前同步一下？';
    direction = '被甩锅时不要情绪化反驳，用事实和记录说话，同时把话题引向未来的预防机制。';
    strategy = '对爱甩锅的同事，永远不要口头承诺或口头认错。所有沟通留痕，用客观事实代替主观辩解。';
  }
  if (personaId === 'friend') {
    if (/玩笑|朋友|尊重/.test(text)) { score += 10; good.push('温和表达边界'); }
    if (/算了|没事|随便/.test(text)) { score -= 10; bad.push('回避问题，委屈自己'); }
    example = '哈哈王哥你这记忆力可以啊，不过相亲这事儿咱就别当众广播了，给我留点神秘感呗！';
    direction = '被朋友调侃时，用"先接后转"的策略：先笑着接话，再温和地划出边界，不冷场也不委屈。';
    strategy = '对大大咧咧的朋友，太严肃会让气氛尴尬，太退让又会被持续冒犯。关键是"笑着说不"。';
  }
  if (personaId === 'mother') {
    if (/理解|知道您|明白您/.test(text)) { score += 15; good.push('先理解长辈担忧，降低对抗'); }
    if (/但是|不要管我|我自己的事/.test(text)) { score -= 15; bad.push('直接对抗容易激化矛盾'); }
    if (/我想|我的计划|我已经/.test(text)) { score += 10; good.push('温和表达自己的立场'); }
    example = '妈，我知道您是担心我。我目前有在接触一个姑娘，等时机合适了一定带回家给您看看，您放心。';
    direction = '面对父母的控制或催逼，先给情绪价值（理解+安抚），再给具体信息，减少他们的焦虑感。';
    strategy = '对控制欲强的父母，"硬顶"只会让他们更焦虑更唠叨。关键是"先顺后导"：让他们感觉被尊重，再慢慢引导边界。';
  }
  if (personaId === 'client') {
    if (/合同|范围|额外|费用/.test(text)) { score += 15; good.push('依据合同，守住边界'); }
    if (/好的|没问题|可以改/.test(text)) { score -= 15; bad.push('轻易让步会损害利益'); }
    if (/替代|方案|建议/.test(text)) { score += 10; good.push('提供替代方案，展现专业'); }
    example = '刘经理，这个需求在合同范围之外，我可以给您做一个补充报价。如果预算紧张，我们也可以分阶段实施，您看哪种方式更合适？';
    direction = '面对客户的额外要求，不要直接拒绝，而是把"行不行"转化为"怎么做"，用方案和报价守住边界。';
    strategy = '对爱占便宜的甲方，口头上永远友好配合，但涉及范围变更时必须谈条件。把被动变为主动报价。';
  }
  if (personaId === 'roommate') {
    if (/公约|规则|轮流|分工/.test(text)) { score += 15; good.push('用规则说话，公平合理'); }
    if (/算了|没事|我自己/.test(text)) { score -= 15; bad.push('忍气吞声会让问题持续'); }
    if (/大家|共同|一起/.test(text)) { score += 10; good.push('强调共同责任，不针对个人'); }
    example = '小赵，公共区域咱们轮流打扫吧，我列了个值日表，这周你负责客厅，我负责厨房，下周轮换，你看可以吗？';
    direction = '和室友发生矛盾时，不指责个人，而是提出一个对双方都有约束力的规则，把问题变成制度。';
    strategy = '对自私的室友，单独指责容易激化矛盾。最好的方式是用"共同约定"把个人矛盾转化为规则问题。';
  }

  score = Math.max(20, Math.min(98, score));
  if (score >= 80) suggest = '你的回应得体且有力，继续保持！再试着加入一个具体的行动建议会更完美。';
  else if (score >= 60) suggest = '整体不错，但可以更主动一些。试着在回应中加入一个具体的下一步动作。';
  else suggest = '这个回应可能会让对方不舒服。试着先肯定对方，再表达你的立场，最后给出一个解决方案。';

  return { score, good, bad, suggest, example, direction, strategy };
}

  if (!apiKey) return getScoreAnalysisFallback(text, personaId);

  const model = localStorage.getItem('ly_model') || 'gpt-4o-mini';
  const systemPrompt = localStorage.getItem('ly_system_prompt') || '你是一位专业的社交沟通教练，擅长分析对话中的得体性、沟通技巧和情绪管理。';

  const persona = personas.find(p => p.id === personaId);
  const previousRounds = currentScene.rounds.slice(0, currentRound + 1).map((r, i) => `第${i + 1}轮对方说："${r.ai}"`).join('\n');

  const prompt = `你是一位专业的社交沟通教练，正在指导用户进行社交对话训练。

【角色信息】
姓名：${persona.name}
身份：${persona.role}

${previousRounds}

【当前轮次】第 ${currentRound + 1} 轮

"${text}"

请从以下维度进行专业分析：
1. 得体指数（0-100的整数，反映整体回应质量）

请严格以以下 JSON 格式输出，不要包含其他文字：
{
  "score": 85,
  "good": ["先肯定对方，化解攻击性", "使用了'我'陈述，避免指责"],
  "bad": ["回应稍短，可以补充具体行动"],
  "suggest": "建议补充一个具体的下一步动作，比如'我可以周五前给你一份修订版'。",
  "example": "张总，您提的成本问题确实关键。我准备了两版方案：A版保留全部功能但成本增加10%，B版核心功能不变、成本不变，您倾向哪个方向？",
  "direction": "先承认对方的关切，然后提供具体选项让对方做选择，把被动变为主动。",
  "strategy": "面对挑剔型上司，关键是把'解释'转化为'方案'，用选择题代替问答题。",
  "label": "良好"
}`;

  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: model,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: prompt }
        ],
        temperature: 0.7,
        max_tokens: 600
      })
    });

    if (!res.ok) {
      const err = await res.text().catch(() => '未知错误');
      console.error('AI API 请求失败:', err);
      return getScoreAnalysisFallback(text, personaId);
    }

    const data = await res.json();
    const content = data.choices?.[0]?.message?.content;
    if (!content) throw new Error('API 返回内容为空');

    // 尝试提取 JSON（模型可能包裹在 markdown 代码块中）
    let jsonStr = content;
    const codeBlock = content.match(/```json\s*([\s\S]*?)```/);
    if (codeBlock) jsonStr = codeBlock[1];
    else {
      const firstBrace = content.indexOf('{');
      const lastBrace = content.lastIndexOf('}');
      if (firstBrace !== -1 && lastBrace !== -1) jsonStr = content.slice(firstBrace, lastBrace + 1);
    }

    const result = JSON.parse(jsonStr);
    if (typeof result.score !== 'number') throw new Error('score 字段缺失');
    return {
      score: Math.max(0, Math.min(100, Math.round(result.score))),
      good: Array.isArray(result.good) ? result.good : [],
      bad: Array.isArray(result.bad) ? result.bad : [],
      suggest: result.suggest || '',
      example: result.example || '',
      direction: result.direction || '',
      strategy: result.strategy || '',
      label: result.label || (result.score >= 80 ? '优秀' : result.score >= 60 ? '良好' : '需改进')
    };
  } catch (e) {
    console.error('AI 分析失败，回退到规则评分:', e);
    return getScoreAnalysisFallback(text, personaId);
  }
}

function renderRoles() {
  document.getElementById('roleList').innerHTML = personas.map(p => `
    <div class="card" onclick="selectRole('${p.id}')" style="border-left:3px solid ${p.color}">
      <div class="avatar" style="background:${p.color}20;color:${p.color}">${p.emoji}</div>
      <div class="info"><div class="name">${p.name}</div><div class="desc">${p.role} · ${p.trait}</div></div>
      <span class="tag">${p.tag}</span>
    </div>
  `).join('');
}

function selectRole(id) {
  currentPersona = personas.find(p => p.id === id);
  document.getElementById('scenarioHeroTitle').textContent = `与 ${currentPersona.name} 对话`;
  document.getElementById('scenarioHeroDesc').textContent = `${currentPersona.trait} · 选择场景开始训练`;
  document.getElementById('scenarioList').innerHTML = currentPersona.scenes.map(s => `
    <div class="card" onclick="selectScene('${s.id}')">
      <div class="info"><div class="name">${s.title}</div><div class="desc">${s.desc}</div></div>
      <span class="tag">${s.rounds.length} 轮对话</span>
    </div>
  `).join('');
  showPage('pageScenario');
}

function selectScene(id) {
  currentScene = currentPersona.scenes.find(s => s.id === id);
  currentRound = 0; isWaitingFeedback = false;
  document.getElementById('chatTitle').textContent = `${currentPersona.name} · ${currentScene.title}`;
  document.getElementById('roundTag').textContent = `第 ${currentRound + 1} / ${currentScene.rounds.length} 轮`;
  const body = document.getElementById('chatBody');
  body.innerHTML = '';
  addMsg('hint', `场景：${currentScene.desc}`);
  addMsg('hint', `💡 小贴士：${currentPersona.name} ${currentPersona.trait}，回应时注意把握分寸。`);
  setTimeout(() => { addMsg('ai', currentScene.rounds[0].ai, currentPersona.name); }, 300);
  document.getElementById('userInput').value = '';
  document.getElementById('userInput').disabled = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('inputArea').style.display = 'flex';
  updateAiBadge();
  showPage('pageChat');
}

function addMsg(type, text, roleName) {
  const body = document.getElementById('chatBody');
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  if (type === 'ai' && roleName) {
    const emoji = currentPersona ? currentPersona.emoji : '👤';
    div.innerHTML = `
      <div class="msgAvatar">${emoji}</div>
      <div class="msgContent">
        <div class="msgMeta">${roleName}</div>
        <div class="msgText">${text}</div>
      </div>
    `;
  } else if (type === 'feedback') div.innerHTML = text;
  else div.textContent = text;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

function removeLoading() {
  const body = document.getElementById('chatBody');
  const loadings = body.querySelectorAll('.loadingMsg');
  loadings.forEach(el => el.remove());
}

async function sendReply() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text || isWaitingFeedback) return;
  addMsg('user', text); input.value = '';

  document.getElementById('userInput').disabled = true;
  document.getElementById('sendBtn').disabled = true;
  const loading = document.createElement('div');
  loading.className = 'loadingMsg';
  loading.textContent = 'AI 正在分析你的回应...';
  document.getElementById('chatBody').appendChild(loading);
  document.getElementById('chatBody').scrollTop = document.getElementById('chatBody').scrollHeight;

  try {
    const analysis = await getScoreAnalysis(text, currentPersona.id);
    removeLoading();

    let scoreLabel = analysis.label || (analysis.score >= 80 ? '优秀' : analysis.score >= 60 ? '良好' : '需改进');
    let fbHtml = `<div class="feedbackHeader"><div class="feedbackScore">${analysis.score}</div><div class="feedbackLabel">${scoreLabel}</div></div>`;
    if (analysis.good && analysis.good.length) fbHtml += `<div class="feedbackSection good"><div class="feedbackTitle">优点</div><ul>${analysis.good.map(g => `<li>${g}</li>`).join('')}</ul></div>`;
    if (analysis.bad && analysis.bad.length) fbHtml += `<div class="feedbackSection bad"><div class="feedbackTitle">不足</div><ul>${analysis.bad.map(b => `<li>${b}</li>`).join('')}</ul></div>`;
    if (analysis.suggest) fbHtml += `<div class="feedbackSection suggest"><div class="feedbackTitle">改进建议</div><p>${analysis.suggest}</p></div>`;
    if (analysis.example) fbHtml += `<div class="feedbackSection example"><div class="feedbackTitle">参考回应</div><div class="exampleBox"><div class="exampleBadge">示例</div><p>${analysis.example}</p></div></div>`;
    if (analysis.direction) fbHtml += `<div class="feedbackSection direction"><div class="feedbackTitle">回应思路</div><p>${analysis.direction}</p></div>`;
    if (analysis.strategy) fbHtml += `<div class="feedbackSection strategy"><div class="feedbackTitle">应对策略</div><p>${analysis.strategy}</p></div>`;
    addMsg('feedback', fbHtml); isWaitingFeedback = true;

    const body = document.getElementById('chatBody');
    const actions = document.createElement('div');
    actions.className = 'feedbackActions'; actions.id = 'feedbackActions';
    if (currentRound < currentScene.rounds.length - 1) {
      actions.innerHTML = `<button class="fbBtn" onclick="retryRound()">再试一次</button><button class="fbBtn primary" onclick="nextRound()">下一轮 →</button>`;
    } else {
      actions.innerHTML = `<button class="fbBtn" onclick="retryRound()">再试一次</button><button class="fbBtn primary" onclick="finishScene()">完成训练</button>`;
    }
    body.appendChild(actions); body.scrollTop = body.scrollHeight;
  } catch (e) {
    removeLoading();
    console.error(e);
  }
}

function retryRound() {
  const actions = document.getElementById('feedbackActions');
  if (actions) actions.remove();
  const body = document.getElementById('chatBody');
  const msgs = body.querySelectorAll('.msg');
  for (let i = msgs.length - 1; i >= 0; i--) {
    if (msgs[i].classList.contains('feedback') || msgs[i].classList.contains('user')) msgs[i].remove();
  }
  isWaitingFeedback = false;
  document.getElementById('userInput').disabled = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('inputArea').style.display = 'flex';
}

function nextRound() {
  const actions = document.getElementById('feedbackActions');
  if (actions) actions.remove();
  currentRound++;
  document.getElementById('roundTag').textContent = `第 ${currentRound + 1} / ${currentScene.rounds.length} 轮`;
  isWaitingFeedback = false;
  document.getElementById('userInput').disabled = false;
  document.getElementById('sendBtn').disabled = false;
  setTimeout(() => { addMsg('ai', currentScene.rounds[currentRound].ai, currentPersona.name); }, 300);
}

function finishScene() {
  const actions = document.getElementById('feedbackActions');
  if (actions) actions.remove();
  const body = document.getElementById('chatBody');
  const done = document.createElement('div');
  done.className = 'msg hint';
  done.innerHTML = '🎉 训练完成！你在这个场景中表现不错。可以去试试其他角色或场景，继续提升你的沟通能力！';
  body.appendChild(done);
  const btns = document.createElement('div');
  btns.className = 'feedbackActions';
  btns.innerHTML = `<button class="fbBtn" onclick="goBack()">换场景</button><button class="fbBtn primary" onclick="goHome()">返回首页</button>`;
  body.appendChild(btns); body.scrollTop = body.scrollHeight;
  document.getElementById('inputArea').style.display = 'none';
}

function goBack() { if (currentPersona) { currentScene = null; currentRound = 0; showPage('pageScenario'); } }
function goHome() { currentPersona = null; currentScene = null; currentRound = 0; showPage('pageRole'); }
renderRoles();
updateAiBadge();
</script>

</body>
</html>
