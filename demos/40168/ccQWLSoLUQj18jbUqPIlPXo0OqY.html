      hunyuan: {
        label: '腾讯混元',
        endpoint: 'https://api.hunyuan.cloud.tencent.com/v1',
        type: 'openai',
        models: [
          { id: 'hunyuan-turbos-latest', label: 'Hunyuan TurboS (标准)' },
          { id: 'hunyuan-turbo', label: 'Hunyuan Turbo (快速)' },
          { id: 'hunyuan-t3', label: 'Hunyuan T3 (轻量)' }
        ]
      },
      minimax: {
        label: 'MiniMax 海螺',
        endpoint: 'https://api.minimaxi.com/v1',
        type: 'openai',
        models: [
          { id: 'MiniMax-M1', label: 'M1 (开源)' },
          { id: 'MiniMax-Text-01', label: 'Text-01 (标准)' }
        ]
      },
      custom: {
        label: '自定义 API',
        endpoint: '',
        type: 'openai',
        models: []
      }
    };

    const ROLES = [
      { id: 'leader', name: '领导', icon: '<path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>' },
      { id: 'colleague', name: '同事', icon: '<path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/>' },
      { id: 'teacher', name: '老师', icon: '<path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/>' },
      { id: 'parent', name: '父母', icon: '<path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/>' },
      { id: 'friend', name: '朋友', icon: '<path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>' },
      { id: 'partner', name: '对象', icon: '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>' },
      { id: 'other', name: '其他', icon: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>' }
    ];

    const EXAMPLES = {
      decode: {
        leader: ['你最近挺忙的啊','这个方案再想想','你很有个性','辛苦了，早点休息'],
        colleague: ['你工资多少啊','这个很简单吧','你人真好','有空一起吃饭'],
        teacher: ['你其实挺聪明的','这次考试不难','作业不多','你们是我带过最差的一届'],
        parent: ['隔壁家小王...','你最近瘦了','钱够花吗','什么时候带对象回来'],
        friend: ['改天请你吃饭','你最近变胖了','我跟你实话实说吧','你觉得我怎么样'],
        partner: ['我没事','你玩吧','随便','你前任怎么样'],
        other: ['你说的对','我再考虑一下','这样啊','嗯嗯']
      },
      encode: {
        leader: ['我不想加班','这方案不行','我想涨工资','我要辞职'],
        colleague: ['我不想帮你','这是你的事','别烦我','我不想加班'],
        teacher: ['我不会做','我不想写作业','我想请假','这课太无聊了'],
        parent: ['我不想相亲','我想搬出去住','我不想要孩子','我想换工作'],
        friend: ['我不想借钱给你','你对象不行','我不想参加','我想绝交'],
        partner: ['我错了','我想要礼物','我想你陪陪我','我们谈谈吧'],
        other: ['我不想去','我不想做','我没兴趣','算了吧']
      }
    };

    // ==================== State ====================
    let mode = 'decode';
    let role = 'leader';
    let screenshotData = null;
    let isLoading = false;

    // ==================== Init ====================
    function init() {
      renderProviderOptions();
      loadConfig();
      renderRoles();
      updateUI();
    }

    function renderProviderOptions() {
      const sel = document.getElementById('cfgProvider');
      sel.innerHTML = Object.entries(PROVIDERS).map(([k, v]) =>
        `<option value="${k}">${v.label}</option>`
      ).join('');
    }

    function loadConfig() {
      const saved = localStorage.getItem('rh_config');
      if (saved) {
        try {
          const cfg = JSON.parse(saved);
          document.getElementById('cfgProvider').value = cfg.provider || 'openai';
          document.getElementById('cfgApiKey').value = cfg.apiKey || '';
          document.getElementById('cfgEndpoint').value = cfg.endpoint || '';
          onProviderChange(true);
          // 恢复模型选择
          if (cfg.model) {
            const modelSel = document.getElementById('cfgModelSelect');
            const modelInput = document.getElementById('cfgModel');
            const found = Array.from(modelSel.options).find(o => o.value === cfg.model);
            if (found) {
              modelSel.value = cfg.model;
            } else {
              modelSel.value = '__custom__';
              modelInput.value = cfg.model;
            }
          }
        } catch(e) {}
      } else {
        onProviderChange(true);
      }
    }

    function saveSettings() {
      const modelSel = document.getElementById('cfgModelSelect');
      const modelInput = document.getElementById('cfgModel');
      const model = modelSel.value === '__custom__' ? modelInput.value.trim() : modelSel.value;
      const cfg = {
        provider: document.getElementById('cfgProvider').value,
        apiKey: document.getElementById('cfgApiKey').value.trim(),
        endpoint: document.getElementById('cfgEndpoint').value.trim(),
        model: model
      };
      localStorage.setItem('rh_config', JSON.stringify(cfg));
      closeSettings();
      toast('设置已保存');
    }

    function getConfig() {
      const saved = localStorage.getItem('rh_config');
      if (saved) {
        try { return JSON.parse(saved); } catch(e) {}
      }
      const p = PROVIDERS.openai;
      return { provider: 'openai', apiKey: '', endpoint: p.endpoint, model: p.models[0].id };
    }

    function onProviderChange(skipModel) {
      const p = document.getElementById('cfgProvider').value;
      const prov = PROVIDERS[p];
      if (prov) {
        document.getElementById('cfgEndpoint').value = prov.endpoint;
        // 渲染模型下拉
        const modelSel = document.getElementById('cfgModelSelect');
        const modelGroup = document.getElementById('modelSelectGroup');
        const modelInputGroup = document.getElementById('modelInputGroup');
        if (prov.models.length > 0) {
          modelGroup.style.display = '';
          modelSel.innerHTML = prov.models.map(m =>
            `<option value="${m.id}">${m.label}</option>`
          ).join('') + '<option value="__custom__">自定义模型...</option>';
          if (!skipModel) modelSel.value = prov.models[0].id;
          onModelSelectChange();
        } else {
          modelGroup.style.display = 'none';
          modelInputGroup.style.display = '';
        }
        document.getElementById('endpointHint').textContent = prov.endpoint || '填写你的自定义 API 地址';
      }
    }

    function onModelSelectChange() {
      const val = document.getElementById('cfgModelSelect').value;
      document.getElementById('modelInputGroup').style.display = val === '__custom__' ? '' : 'none';
      if (val === '__custom__') {
        document.getElementById('cfgModel').focus();
      }
    }

    function openSettings() {
      loadConfig();
      document.getElementById('settingsModal').classList.add('show');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('show');
    }

    // ==================== Render ====================
    function renderRoles() {
      const row = document.getElementById('roleRow');
      row.innerHTML = ROLES.map(r =>
        `<button class="role-chip${r.id === role ? ' active' : ''}" data-role="${r.id}" onclick="selectRole('${r.id}')">
          <svg viewBox="0 0 24 24"><path d="${r.icon}"/></svg>${r.name}
        </button>`
      ).join('');
    }

    function updateUI() {
      const label = document.getElementById('inputLabel');
      const btn = document.getElementById('submitBtn');
      const box = document.getElementById('inputText');
      if (mode === 'decode') {
        label.textContent = '输入内容';
        btn.textContent = '翻译潜台词';
        box.placeholder = '输入对方说的话，或上传聊天截图...';
      } else {
        label.textContent = '输入内容';
        btn.textContent = '润色成体面话';
        box.placeholder = '输入你想说的直白话...';
      }
      renderExamples();
    }

    function renderExamples() {
      const el = document.getElementById('examples');
      const list = EXAMPLES[mode][role] || [];
      el.innerHTML = list.map(t => `<span class="example-chip" onclick="document.getElementById('inputText').value='${t}'">${t}</span>`).join('');
    }

    function switchMode(m) {
      mode = m;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
      document.getElementById('result').classList.remove('show');
      updateUI();
    }

    function selectRole(r) {
      role = r;
      document.querySelectorAll('.role-chip').forEach(c => c.classList.toggle('active', c.dataset.role === r));
      document.getElementById('result').classList.remove('show');
      renderExamples();
    }

    // ==================== Upload ====================
    function handleUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        screenshotData = ev.target.result;
        document.getElementById('screenshotImg').src = screenshotData;
        document.getElementById('screenshotPreview').classList.add('show');
        toast('截图已上传');
      };
      reader.readAsDataURL(file);
    }

    function removeUpload() {
      screenshotData = null;
      document.getElementById('screenshotPreview').classList.remove('show');
      document.getElementById('fileInput').value = '';
      document.getElementById('screenshotImg').src = '';
    }

    // ==================== Submit ====================
    async function submit() {
      const input = document.getElementById('inputText').value.trim();
      if (!input && !screenshotData) { toast('请输入内容或上传截图'); return; }

      const cfg = getConfig();
      if (!cfg.apiKey) { openSettings(); toast('请先配置 API Key'); return; }

      setLoading(true);
      hideError();
      document.getElementById('result').classList.remove('show');

      try {
        const messages = buildPrompt(input);
        const def = PROVIDERS[cfg.provider] || PROVIDERS.openai;
        const providerType = def.type || 'openai';
        let response;
        if (providerType === 'claude') {
          response = await callClaude(cfg, messages);
        } else {
          response = await callOpenAI(cfg, messages);
        }
        renderResult(response);
      } catch(err) {
        showError(err.message || '请求失败，请检查 API 设置');
      } finally {
        setLoading(false);
      }
    }

    function buildPrompt(input) {
      const roleName = ROLES.find(r => r.id === role)?.name || role;
      const systemPrompt = `你是一个毒舌但有趣的人际关系分析师，专门帮人翻译"人话"中的潜台词。

用户当前选择的说话人身份是：${roleName}

${mode === 'decode' ? `用户会输入${roleName}说的话，你需要：
1. 翻译出真实含义（一句话，毒舌风格）
2. 分析情绪底色（简短描述）
3. 评估危险指数（1-5的数字，1最安全5最危险）
4. 给出一句吐槽/补充说明

请严格按以下JSON格式返回，不要有任何其他文字：
{"translation":"真实含义","emotion":"情绪底色","danger":数字,"subtext":"吐槽补充"}` : `用户会输入想说的直白话（对${roleName}说的），你需要帮忙润色成三种风格：
1. 体面版：委婉得体，不伤和气
2. 直接版：简洁明了，不绕弯子
3. 幽默版：用幽默化解尴尬

请严格按以下JSON格式返回，不要有任何其他文字：
{"polite":"体面版内容","direct":"直接版内容","humor":"幽默版内容"}`}`;

      const messages = [{ role: 'system', content: systemPrompt }];

      if (screenshotData) {
        // 如果有截图，用多模态
        messages.push({
          role: 'user',
          content: [
            { type: 'text', text: input ? `这段话是${roleName}说的：${input}\n\n请分析截图中的聊天内容，结合文字一起翻译潜台词。` : `请分析这张聊天截图，${roleName}说了什么？翻译潜台词。` },
            { type: 'image_url', image_url: { url: screenshotData } }
          ]
        });
      } else {
        messages.push({ role: 'user', content: `${roleName}说了：${input}` });
      }

      return messages;
    }

    // ==================== API Calls ====================
    async function callOpenAI(cfg, messages) {
      const endpoint = cfg.endpoint || PROVIDERS.openai.endpoint;
      const model = cfg.model || PROVIDERS.openai.models[0].id;
      const url = `${endpoint}/chat/completions`;

      const body = {
        model: model,
        messages: messages,
        max_tokens: 1000,
        temperature: 0.8
      };

      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${cfg.apiKey}`
        },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `API 错误 (${res.status})`);
      }

      const data = await res.json();
      const content = data.choices?.[0]?.message?.content || '';
      return parseJSON(content);
    }

    async function callClaude(cfg, messages) {
      const endpoint = cfg.endpoint || PROVIDERS.claude.endpoint;
      const model = cfg.model || PROVIDERS.claude.models[0].id;
      const url = `${endpoint}/v1/messages`;

      // Claude format: system separate, user messages
      const systemMsg = messages.find(m => m.role === 'system')?.content || '';
      const userMsgs = messages.filter(m => m.role === 'user');

      const claudeMessages = userMsgs.map(m => ({
        role: 'user',
        content: m.content
      }));

      const body = {
        model: model,
        max_tokens: 1000,
        system: systemMsg,
        messages: claudeMessages
      };

      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': cfg.apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `API 错误 (${res.status})`);
      }

      const data = await res.json();
      const content = data.content?.[0]?.text || '';
      return parseJSON(content);
    }

    function parseJSON(text) {
      // 尝试从文本中提取 JSON
      const match = text.match(/\{[\s\S]*\}/);
      if (!match) throw new Error('AI 返回格式异常，请重试');
      return JSON.parse(match[0]);
    }

    // ==================== Render Result ====================
    function renderResult(data) {
      const el = document.getElementById('result');
      let html = '';

      if (mode === 'decode') {
        const danger = Math.min(5, Math.max(1, data.danger || 3));
        const pct = (danger / 5) * 100;
        const colors = ['#4ade80','#4ade80','#fbbf24','#f87171','#f87171'];
        const labels = ['安全','轻微','注意','危险','极度危险'];

        html = `
          <div class="result-block">
            <div class="result-block-header">
              <span class="result-label">真实含义</span>
              <button class="copy-btn" onclick="copyText(this, '${esc(data.translation)}')">复制</button>
            </div>
            <div class="result-body"><strong>${data.translation}</strong>
              <div class="sub">${data.subtext || ''}</div>
            </div>
          </div>
          <div class="result-block">
            <div class="result-block-header">
              <span class="result-label">情绪底色</span>
              <button class="copy-btn" onclick="copyText(this, '${esc(data.emotion)}')">复制</button>
            </div>
            <div class="result-body"><strong>${data.emotion}</strong></div>
          </div>
          <div class="result-block">
            <div class="result-block-header"><span class="result-label">危险指数</span></div>
            <div class="danger-bar-wrap">
              <div class="danger-bar"><div class="danger-fill" style="width:${pct}%;background:${colors[danger-1]}"></div></div>
              <span class="danger-label">${labels[danger-1]} ${danger}/5</span>
            </div>
          </div>
        `;
      } else {
        html = `
          <div class="result-block">
            <div class="result-block-header">
              <span class="result-label">体面版</span>
              <button class="copy-btn" onclick="copyText(this, '${esc(data.polite)}')">复制</button>
            </div>
            <div class="result-body">${data.polite}</div>
          </div>
          <div class="result-block">
            <div class="result-block-header">
              <span class="result-label">直接版</span>
              <button class="copy-btn" onclick="copyText(this, '${esc(data.direct)}')">复制</button>
            </div>
            <div class="result-body">${data.direct}</div>
          </div>
          <div class="result-block">
            <div class="result-block-header">
              <span class="result-label">幽默版</span>
              <button class="copy-btn" onclick="copyText(this, '${esc(data.humor)}')">复制</button>
            </div>
            <div class="result-body">${data.humor}</div>
          </div>
        `;
      }

      el.innerHTML = html;
      el.classList.add('show');
    }

    function esc(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\\/g, '\\\\');
    }

    // ==================== Utils ====================
    function setLoading(v) {
      isLoading = v;
      document.getElementById('loading').classList.toggle('show', v);
      document.getElementById('submitBtn').disabled = v;
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.add('show');
    }

    function hideError() {
      document.getElementById('errorMsg').classList.remove('show');
    }

    function copyText(btn, text) {
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = '已复制';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        btn.textContent = '已复制';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
      });
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2000);
    }

    // ==================== Start ====================
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
