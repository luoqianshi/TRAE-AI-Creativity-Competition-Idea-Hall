<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C盘清理大师</title>
<style>
/* ===== 全局重置 & 变量 ===== */
:root {
  --bg: #FFF8EF;
  --bg2: #FFF1E0;
  --bg3: #FFE8CC;
  --card: #FFFFFF;
  --card-border: #F0DCC4;
  --amber: #D4A853;
  --amber-hover: #E0BE72;
  --amber-press: #C49B3F;
  --amber-light: #FFF3DC;
  --green: #7CB87F;
  --green-bg: #EFF7EF;
  --orange: #E8A849;
  --orange-bg: #FFF3E0;
  --red: #D4706A;
  --text: #4A3728;
  --text2: #7A6555;
  --text3: #B8A590;
  --divider: #F0E0CC;
  --white: #FFFFFF;
  --shadow: 0 2px 12px rgba(180,150,100,.08);
  --radius: 12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft YaHei','微软雅黑','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
a{color:var(--amber);text-decoration:none}
button{cursor:pointer;font-family:inherit}

/* ===== Header ===== */
.header{display:flex;align-items:center;height:54px;padding:0 24px;background:var(--bg);border-bottom:1px solid var(--divider);flex-shrink:0}
.logo{font-size:15px;font-weight:700;color:var(--amber)}
.logo::before{content:'◆ ';margin-right:2px}
.nav{display:flex;gap:4px;margin-left:auto}
.nav-btn{background:none;border:none;padding:8px 16px;border-radius:8px;font-size:13px;color:var(--text3);transition:.2s}
.nav-btn:hover,.nav-btn.active{background:var(--amber-light);color:var(--amber);font-weight:600}

/* ===== Main ===== */
.main{flex:1;overflow:auto;padding:24px 32px}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:20px 24px;margin-bottom:18px;box-shadow:var(--shadow)}
h2{font-size:14px;font-weight:700;margin-bottom:14px}
h2.big{font-size:20px}

/* ===== Footer ===== */
.footer{height:30px;display:flex;align-items:center;padding:0 24px;background:var(--bg2);border-top:1px solid var(--divider);font-size:9px;color:var(--text3);flex-shrink:0}
.footer-left{margin-right:auto}
.footer-right{margin-left:auto}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;border:none;border-radius:8px;padding:10px 24px;font-size:13px;font-weight:600;transition:.15s}
.btn-amber{background:var(--amber);color:var(--white)}.btn-amber:hover{background:var(--amber-hover)}
.btn-outline{background:var(--amber-light);color:var(--text2);border:1px solid var(--card-border)}.btn-outline:hover{background:var(--bg3);border-color:var(--amber);color:var(--amber)}
.btn-green{background:var(--green);color:var(--white)}.btn-green:hover{background:#8CC88F}
.btn-red{background:var(--red);color:var(--white)}.btn-red:hover{background:#DD807A}
.btn-ghost{background:transparent;color:var(--text2)}.btn-ghost:hover{background:var(--amber-light);color:var(--amber)}
.btn:disabled{background:var(--divider);color:var(--text3);cursor:not-allowed}
.btn-big{padding:12px 36px;font-size:15px;border-radius:10px}

/* ===== 进度条 ===== */
.progress-bar{height:10px;background:var(--divider);border-radius:5px;overflow:hidden}
.progress-fill{height:100%;border-radius:5px;transition:width .4s ease}
.progress-fill.green{background:var(--green)}.progress-fill.amber{background:var(--amber)}.progress-fill.orange{background:var(--orange)}.progress-fill.red{background:var(--red)}

/* ===== 圆环进度 ===== */
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin:20px 0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-text{font-size:28px;font-weight:700;fill:var(--text)}
.ring-sub{font-size:10px;fill:var(--text3)}

/* ===== 信息行 ===== */
.info-row{display:flex;gap:40px;margin-top:14px}
.info-item small{display:block;font-size:10px;color:var(--text3)}
.info-item strong{font-size:14px;font-weight:700}

/* ===== 标签页 ===== */
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{background:var(--bg2);color:var(--text3);border:2px solid transparent;border-radius:8px;padding:8px 16px;font-size:13px;transition:.15s}
.tab:hover{border-color:var(--amber)}
.tab.active{background:var(--white);border-color:var(--green);color:var(--green);font-weight:700}
.tab.active.orange{border-color:var(--orange);color:var(--orange)}
.tab.active.gray{border-color:var(--text3);color:var(--text3)}

/* ===== 表格 ===== */
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--card-border);border-radius:10px;overflow:hidden;font-size:12px}
th{background:var(--bg2);color:var(--text2);padding:10px 12px;text-align:left;border-bottom:2px solid var(--divider);font-weight:700}
td{padding:8px 12px;border-bottom:1px solid var(--divider);color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--amber-light)}

/* ===== 弹窗 ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(74,55,40,.3);z-index:100;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:var(--bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:28px;min-width:460px;max-width:520px;box-shadow:0 8px 32px rgba(180,150,100,.2)}

/* ===== 工具提示 ===== */
.tip{font-size:11px;color:var(--text2);margin-top:8px;line-height:1.6}
.status-line{font-size:11px;color:var(--text3);margin:6px 0}

/* ===== 页面隐藏 ===== */
.page{display:none}.page.active{display:block}

/* ===== 动画 ===== */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--card-border);border-top-color:var(--amber);border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}

/* ===== 响应 ===== */
@media(max-width:768px){.main{padding:16px}.card{padding:16px}.info-row{flex-wrap:wrap;gap:16px}.modal{min-width:auto;margin:16px}}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">C盘清理大师</div>
  <div class="nav">
    <button class="nav-btn active" onclick="showPage('home')">首页</button>
    <button class="nav-btn" onclick="showPage('large')">大文件</button>
    <button class="nav-btn" onclick="showPage('logs')">日志</button>
    <button class="nav-btn" onclick="showPage('settings')">设置</button>
  </div>
</div>

<!-- Main Content -->
<div class="main">

  <!-- ========== 首页 ========== -->
  <div class="page active" id="page-home">
    <div class="card">
      <h2>C盘空间状态</h2>
      <div class="progress-bar"><div class="progress-fill amber" id="home-bar" style="width:68%"></div></div>
      <div class="info-row">
        <div class="info-item"><small>总空间</small><strong id="home-total">500.0 GB</strong></div>
        <div class="info-item"><small>已用</small><strong style="color:var(--amber)" id="home-used">340.0 GB</strong></div>
        <div class="info-item"><small>可用</small><strong style="color:var(--green)" id="home-free">160.0 GB</strong></div>
      </div>
    </div>
    <div class="card">
      <h2>快速操作</h2>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <button class="btn btn-amber btn-big" onclick="startScan()">开始扫描</button>
        <button class="btn btn-outline" onclick="showPage('large')">大文件分析</button>
        <button class="btn btn-outline" onclick="showPage('logs')">查看日志</button>
      </div>
    </div>
    <div class="card" id="home-log-card" style="display:none">
      <h2>最近清理记录</h2>
      <div id="home-log-text" style="font-size:13px;color:var(--text2)"></div>
    </div>
  </div>

  <!-- ========== 扫描中 ========== -->
  <div class="page" id="page-scanning">
    <div style="text-align:center;padding:40px 0">
      <h2 class="big" style="text-align:center">正在扫描系统</h2>
      <div class="ring-wrap" style="margin:24px 0">
        <svg width="220" height="220" viewBox="0 0 220 220">
          <circle cx="110" cy="110" r="96" fill="none" stroke="var(--card-border)" stroke-width="10"/>
          <circle id="scan-ring" cx="110" cy="110" r="96" fill="none" stroke="url(#grad1)" stroke-width="10" stroke-linecap="round" stroke-dasharray="603" stroke-dashoffset="603"/>
          <defs><linearGradient id="grad1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D4A853"/><stop offset="1" stop-color="#E0BE72"/></linearGradient></defs>
          <text x="110" y="105" text-anchor="middle" class="ring-text" transform="rotate(90,110,110)" id="scan-pct">0%</text>
          <text x="110" y="128" text-anchor="middle" class="ring-sub" transform="rotate(90,110,110)" id="scan-sub"></text>
        </svg>
      </div>
      <div style="font-size:12px;color:var(--text2)" id="scan-status">准备扫描…</div>
    </div>
  </div>

  <!-- ========== 扫描结果 ========== -->
  <div class="page" id="page-results">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 class="big" style="margin:0">扫描结果</h2>
      <span style="font-size:11px;color:var(--text2)" id="res-stats"></span>
    </div>
    <div class="tabs" id="res-tabs">
      <button class="tab active" onclick="switchTab('safe',this)">安全清理 (<span id="cnt-safe">0</span>)</button>
      <button class="tab" onclick="switchTab('caution',this)">谨慎清理 (<span id="cnt-caution">0</span>)</button>
      <button class="tab" onclick="switchTab('analyze',this)">仅分析 (<span id="cnt-analyze">0</span>)</button>
    </div>
    <table><thead><tr><th>名称</th><th>路径</th><th>大小</th></tr></thead><tbody id="res-tbody"></tbody></table>
    <div style="display:flex;justify-content:space-between;margin-top:18px">
      <button class="btn btn-outline" onclick="showPage('home')">返回首页</button>
      <button class="btn btn-green" onclick="showConfirm()">开始清理</button>
    </div>
  </div>

  <!-- ========== 清理中 ========== -->
  <div class="page" id="page-cleaning">
    <div style="text-align:center;padding:40px 0">
      <h2 class="big" style="text-align:center">正在清理</h2>
      <div class="ring-wrap" style="margin:24px 0">
        <svg width="200" height="200" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="86" fill="none" stroke="var(--card-border)" stroke-width="10"/>
          <circle id="clean-ring" cx="100" cy="100" r="86" fill="none" stroke="url(#grad2)" stroke-width="10" stroke-linecap="round" stroke-dasharray="540" stroke-dashoffset="540"/>
          <defs><linearGradient id="grad2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D4A853"/><stop offset="1" stop-color="#E0BE72"/></linearGradient></defs>
          <text x="100" y="95" text-anchor="middle" class="ring-text" transform="rotate(90,100,100)" id="clean-pct">0%</text>
          <text x="100" y="118" text-anchor="middle" class="ring-sub" transform="rotate(90,100,100)" id="clean-sub"></text>
        </svg>
      </div>
      <div style="font-size:12px;color:var(--text2)" id="clean-status">准备清理…</div>
    </div>
  </div>

  <!-- ========== 清理完成 ========== -->
  <div class="page" id="page-complete">
    <div style="text-align:center;padding:30px 0">
      <div style="font-size:48px;color:var(--green);margin-bottom:10px">✓</div>
      <h2 class="big" style="text-align:center">清理完成</h2>
      <div class="card" style="max-width:360px;margin:20px auto;text-align:left">
        <div style="display:flex;justify-content:space-between;margin:10px 0"><span style="color:var(--text3)">释放空间</span><strong style="color:var(--green)" id="comp-space">-</strong></div>
        <div style="display:flex;justify-content:space-between;margin:10px 0"><span style="color:var(--text3)">删除文件</span><strong style="color:var(--amber)" id="comp-del">-</strong></div>
        <div style="display:flex;justify-content:space-between;margin:10px 0"><span style="color:var(--text3)">跳过项目</span><strong style="color:var(--text3)" id="comp-skip">-</strong></div>
      </div>
      <button class="btn btn-amber" style="margin-top:10px" onclick="showPage('home')">返回首页</button>
    </div>
  </div>

  <!-- ========== 大文件分析 ========== -->
  <div class="page" id="page-large">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 class="big" style="margin:0">大文件分析</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <span style="font-size:12px;color:var(--text2)">阈值:</span>
        <select id="lf-threshold" style="padding:6px 12px;border:1px solid var(--card-border);border-radius:8px;font-size:12px;color:var(--text);background:var(--white)">
          <option>50MB</option><option selected>100MB</option><option>500MB</option><option>1GB</option>
        </select>
        <button class="btn btn-amber" id="lf-btn" onclick="startLargeScan()">开始扫描</button>
      </div>
    </div>
    <div class="status-line" id="lf-status"></div>
    <div class="progress-bar" id="lf-prog-wrap" style="display:none"><div class="progress-fill amber" id="lf-prog" style="width:0"></div></div>
    <table style="margin-top:10px"><thead><tr><th>文件名</th><th>路径</th><th>大小</th><th>修改时间</th></tr></thead><tbody id="lf-tbody"></tbody></table>
  </div>

  <!-- ========== 日志 ========== -->
  <div class="page" id="page-logs">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 class="big" style="margin:0">清理日志</h2>
      <button class="btn btn-red" onclick="clearLogs()">清空日志</button>
    </div>
    <table><thead><tr><th>时间</th><th>释放空间</th><th>删除数量</th><th>跳过数量</th></tr></thead><tbody id="log-tbody"></tbody></table>
    <div id="log-empty" style="text-align:center;padding:40px;color:var(--text3)">暂无清理记录</div>
  </div>

  <!-- ========== 设置 ========== -->
  <div class="page" id="page-settings">
    <h2 class="big">设置</h2>
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <h2 style="margin:0">自动清理</h2>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text2)">
          <input type="checkbox" id="auto-clean" style="accent-color:var(--amber);width:16px;height:16px"> 启用自动清理（每周一次）
        </label>
      </div>
    </div>
    <button class="btn btn-green" onclick="saveSettings()">保存设置</button>
  </div>
</div>

<!-- Footer -->
<div class="footer">
  <div class="footer-left" id="footer-status">就绪</div>
  <div class="footer-right" id="footer-disk">C盘: 500GB 已用 68% · 可用 160.0GB</div>
</div>

<!-- 确认弹窗 -->
<div class="modal-overlay" id="modal-confirm">
  <div class="modal">
    <h2 style="font-size:18px;margin-bottom:16px">确认清理</h2>
    <div class="card" style="margin-bottom:14px">
      <h2 style="font-size:13px">清理摘要</h2>
      <div id="confirm-summary"></div>
    </div>
    <div class="tip" id="confirm-tip" style="display:none;margin-bottom:14px">
      谨慎清理项目可能包含浏览器缓存等数据，清理后可能需要重新登录部分网站。
    </div>
    <div style="display:flex;justify-content:flex-end;gap:10px">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-amber" onclick="doClean()">确认清理</button>
    </div>
  </div>
</div>

<!-- 提示弹窗 -->
<div class="modal-overlay" id="modal-alert">
  <div class="modal" style="min-width:320px;text-align:center">
    <div style="font-size:18px;font-weight:700;margin-bottom:16px" id="alert-title">提示</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:20px" id="alert-msg"></div>
    <button class="btn btn-amber" onclick="closeAlert()">确定</button>
  </div>
</div>

<script>
// ===== 模拟数据 =====
const MOCK_SAFE = [
  {n:'Windows Temp',p:'C:\\Windows\\Temp',s:245760000},
  {n:'thumbcache_256.db',p:'C:\\Users\\...\\Explorer\\thumbcache_256.db',s:125829120},
  {n:'WindowsUpdate.cab',p:'C:\\Windows\\SoftwareDistribution\\Download',s:524288000},
  {n:'$I3K2M7T.tmp',p:'C:\\$Recycle.Bin\\S-1-5-21...',s:89128960},
  {n:'Installer_残留.msi',p:'C:\\Windows\\Temp',s:209715200},
  {n:'WER_Report.tmp',p:'C:\\ProgramData\\Microsoft\\Windows\\WER',s:52428800},
  {n:'~DF3A2B.tmp',p:'C:\\Windows\\Temp',s:15728640},
  {n:'setup_*.log',p:'C:\\Windows\\Temp',s:10485760},
];
const MOCK_CAUTION = [
  {n:'Cache_Data_001',p:'...\\Google\\Chrome\\User Data\\Default\\Cache',s:314572800},
  {n:'Cache_Data_002',p:'...\\Google\\Chrome\\User Data\\Default\\Cache',s:157286400},
  {n:'edge_cache',p:'...\\Microsoft\\Edge\\User Data\\Default\\Cache',s:209715200},
];
const MOCK_ANALYZE = [
  {n:'setupact.log',p:'C:\\Windows\\Logs\\setupact.log',s:31457280},
  {n:'CBS.log',p:'C:\\Windows\\Logs\\CBS\\CBS.log',s:157286400},
  {n:'DISM.log',p:'C:\\Windows\\Logs\\DISM\\DISM.log',s:104857600},
  {n:'MoSetup.log',p:'C:\\Windows\\Logs\\MoSetup.log',s:20971520},
];
const MOCK_LARGE = [
  {n:'Windows.old',p:'C:\\Windows.old',s:12884901888, m:'2025-03-10'},
  {n:'hiberfil.sys',p:'C:\\hiberfil.sys',s:6442450944, m:'2026-06-15'},
  {n:'pagefile.sys',p:'C:\\pagefile.sys',s:4294967296, m:'2026-06-16'},
  {n:'install.wim',p:'C:\\Sources\\install.wim',s:4831838208, m:'2024-11-02'},
  {n:'SteamSetup.exe',p:'C:\\Downloads\\SteamSetup.exe',s:262144000, m:'2026-05-20'},
  {n:'backup.zip',p:'C:\\Users\\Desktop\\backup.zip',s:1073741824, m:'2026-04-15'},
  {n:'video_project.mp4',p:'C:\\Videos\\project\\video_project.mp4',s:3221225472, m:'2026-06-01'},
  {n:'vm-disk.vmdk',p:'C:\\VMs\\ubuntu\\vm-disk.vmdk',s:5368709120, m:'2026-03-22'},
];

let scanData = {safe:[], caution:[], analyze:[]};
let cleanLog = JSON.parse(localStorage.getItem('diskCleanLog')||'[]');
let currentTab = 'safe';

// ===== 工具 =====
function fmtSize(b){
  if(b<1024) return b+' B';
  if(b<1048576) return (b/1024).toFixed(1)+' KB';
  if(b<1073741824) return (b/1048576).toFixed(1)+' MB';
  return (b/1073741824).toFixed(1)+' GB';
}
function now(){return new Date().toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})}

// ===== 页面导航 =====
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const navMap={home:0,large:1,logs:2,settings:3};
  if(navMap[id]!==undefined) document.querySelectorAll('.nav-btn')[navMap[id]].classList.add('active');
  if(id==='logs') renderLogs();
}

// ===== 圆环动画 =====
function animateRing(ringId, pctId, subId, target, totalCirc, subText, duration){
  const ring = document.getElementById(ringId);
  const pctEl = document.getElementById(pctId);
  const subEl = document.getElementById(subId);
  let current = parseFloat(ring.dataset.val||'0');
  const start = current;
  const startTime = performance.now();
  function step(ts){
    const elapsed = ts - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    current = start + (target - start) * eased;
    ring.style.strokeDashoffset = totalCirc * (1 - current / 100);
    pctEl.textContent = Math.round(current) + '%';
    if(subText) subEl.textContent = subText;
    ring.dataset.val = current;
    if(progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ===== 扫描 =====
function startScan(){
  showPage('scanning');
  const ring = document.getElementById('scan-ring');
  ring.style.strokeDashoffset = 603;
  ring.dataset.val = '0';
  document.getElementById('scan-pct').textContent = '0%';
  document.getElementById('scan-sub').textContent = '';
  document.getElementById('scan-status').textContent = '准备扫描…';
  document.getElementById('footer-status').textContent = '扫描中…';

  scanData = {safe:[], caution:[], analyze:[]};
  const tasks = [
    {name:'系统临时文件', data:MOCK_SAFE, cat:'safe'},
    {name:'Windows更新缓存', data:[MOCK_SAFE[2]], cat:'safe'},
    {name:'回收站', data:[MOCK_SAFE[3]], cat:'safe'},
    {name:'缩略图缓存', data:[MOCK_SAFE[1]], cat:'safe'},
    {name:'浏览器缓存', data:MOCK_CAUTION, cat:'caution'},
    {name:'应用日志', data:MOCK_ANALYZE, cat:'analyze'},
  ];
  let i = 0;
  function nextTask(){
    if(i >= tasks.length){ scanDone(); return; }
    const t = tasks[i];
    const pct = Math.round(i / tasks.length * 100);
    animateRing('scan-ring','scan-pct','scan-sub', pct, 603, '', 300);
    document.getElementById('scan-status').textContent = '正在扫描: ' + t.name + '…';
    setTimeout(()=>{
      scanData[t.cat].push(...t.data);
      const total = scanData.safe.length + scanData.caution.length + scanData.analyze.length;
      document.getElementById('scan-sub').textContent = '发现 ' + total + ' 项';
      i++;
      nextTask();
    }, 400 + Math.random()*300);
  }
  nextTask();
}
function scanDone(){
  animateRing('scan-ring','scan-pct','scan-sub', 100, 603, '扫描完成', 400);
  document.getElementById('scan-status').textContent = '扫描完成';
  document.getElementById('footer-status').textContent = '扫描完成';
  setTimeout(()=>showResults(), 600);
}

// ===== 扫描结果 =====
function showResults(){
  const s = scanData.safe.length, c = scanData.caution.length, a = scanData.analyze.length;
  const totalSize = [...scanData.safe,...scanData.caution,...scanData.analyze].reduce((x,y)=>x+y.s,0);
  document.getElementById('res-stats').textContent = `共 ${s+c+a} 项，可释放 ${fmtSize(totalSize)}`;
  document.getElementById('cnt-safe').textContent = s;
  document.getElementById('cnt-caution').textContent = c;
  document.getElementById('cnt-analyze').textContent = a;
  currentTab = 'safe';
  renderTab('safe');
  document.querySelectorAll('#res-tabs .tab').forEach((t,i)=>{
    t.classList.remove('active','orange','gray');
    if(i===0) t.classList.add('active');
  });
  showPage('results');
}
function switchTab(cat, el){
  currentTab = cat;
  document.querySelectorAll('#res-tabs .tab').forEach(t=>t.classList.remove('active','orange','gray'));
  if(cat==='safe') el.classList.add('active');
  else if(cat==='caution'){el.classList.add('active','orange');}
  else{el.classList.add('active','gray');}
  renderTab(cat);
}
function renderTab(cat){
  const tb = document.getElementById('res-tbody');
  tb.innerHTML = '';
  scanData[cat].forEach(item=>{
    tb.innerHTML += `<tr><td>${item.n}</td><td>${item.p}</td><td>${fmtSize(item.s)}</td></tr>`;
  });
}

// ===== 确认弹窗 =====
function showConfirm(){
  const s = scanData.safe, c = scanData.caution;
  if(!s.length && !c.length){showAlert('提示','没有可清理的项目');return;}
  let html = '';
  if(s.length){const ss=s.reduce((x,y)=>x+y.s,0); html+=`<div style="color:var(--green);font-size:13px;margin:6px 0">安全清理: ${s.length} 项 (${fmtSize(ss)})</div>`;}
  if(c.length){const cs=c.reduce((x,y)=>x+y.s,0); html+=`<div style="color:var(--orange);font-size:13px;margin:6px 0">谨慎清理: ${c.length} 项 (${fmtSize(cs)})</div>`;}
  document.getElementById('confirm-summary').innerHTML = html;
  document.getElementById('confirm-tip').style.display = c.length ? 'block' : 'none';
  document.getElementById('modal-confirm').classList.add('show');
}
function closeModal(){document.getElementById('modal-confirm').classList.remove('show')}

// ===== 清理 =====
function doClean(){
  closeModal();
  showPage('cleaning');
  const ring = document.getElementById('clean-ring');
  ring.style.strokeDashoffset = 540; ring.dataset.val = '0';
  document.getElementById('clean-pct').textContent = '0%';
  document.getElementById('clean-sub').textContent = '';
  document.getElementById('clean-status').textContent = '准备清理…';
  document.getElementById('footer-status').textContent = '清理中…';

  const items = [...scanData.safe, ...scanData.caution];
  let deleted = 0, skipped = 0, freed = 0, i = 0;
  function nextItem(){
    if(i >= items.length){cleanDone(deleted, skipped, freed);return;}
    const pct = Math.round((i+1)/items.length*100);
    animateRing('clean-ring','clean-pct','clean-sub', pct, 540, '', 200);
    document.getElementById('clean-status').textContent = '正在清理: ' + items[i].n + '…';
    if(Math.random()>0.15){deleted++; freed+=items[i].s;}else{skipped++;}
    i++;
    setTimeout(nextItem, 80+Math.random()*60);
  }
  nextItem();
}
function cleanDone(deleted, skipped, freed){
  animateRing('clean-ring','clean-pct','clean-sub', 100, 540, '完成', 300);
  document.getElementById('footer-status').textContent = '清理完成';
  const log = {time:now(), space:fmtSize(freed), deleted, skipped};
  cleanLog.push(log);
  localStorage.setItem('diskCleanLog', JSON.stringify(cleanLog));
  document.getElementById('comp-space').textContent = fmtSize(freed);
  document.getElementById('comp-del').textContent = deleted + ' 个';
  document.getElementById('comp-skip').textContent = skipped + ' 个';
  setTimeout(()=>showPage('complete'), 500);
}

// ===== 大文件扫描 =====
function startLargeScan(){
  const btn = document.getElementById('lf-btn');
  btn.disabled = true; btn.textContent = '扫描中…';
  document.getElementById('lf-tbody').innerHTML = '';
  document.getElementById('lf-status').textContent = '正在扫描整个 C 盘，这可能需要几分钟…';
  document.getElementById('lf-prog-wrap').style.display = 'block';
  document.getElementById('lf-prog').style.width = '0%';

  let i = 0;
  function step(){
    if(i >= MOCK_LARGE.length){lfDone();return;}
    const pct = Math.round((i+1)/MOCK_LARGE.length*100);
    document.getElementById('lf-prog').style.width = pct+'%';
    document.getElementById('lf-status').textContent = '正在扫描… 已发现 '+(i+1)+' 个大文件';
    const f = MOCK_LARGE[i];
    document.getElementById('lf-tbody').innerHTML += `<tr><td>${f.n}</td><td>${f.p}</td><td>${fmtSize(f.s)}</td><td>${f.m}</td></tr>`;
    i++;
    setTimeout(step, 300+Math.random()*400);
  }
  step();
}
function lfDone(){
  document.getElementById('lf-btn').disabled = false; document.getElementById('lf-btn').textContent = '开始扫描';
  document.getElementById('lf-prog-wrap').style.display = 'none';
  document.getElementById('lf-status').textContent = '扫描完成，共找到 '+MOCK_LARGE.length+' 个大文件';
}

// ===== 日志 =====
function renderLogs(){
  const tb = document.getElementById('log-tbody');
  const empty = document.getElementById('log-empty');
  tb.innerHTML = '';
  if(!cleanLog.length){empty.style.display='block';return;}
  empty.style.display='none';
  [...cleanLog].reverse().forEach(l=>{
    tb.innerHTML += `<tr><td>${l.time}</td><td>${l.space}</td><td>${l.deleted}</td><td>${l.skipped}</td></tr>`;
  });
}
function clearLogs(){
  if(!confirm('确定清空所有日志？'))return;
  cleanLog=[]; localStorage.setItem('diskCleanLog','[]'); renderLogs();
}

// ===== 设置 =====
function saveSettings(){
  localStorage.setItem('diskCleanAuto', document.getElementById('auto-clean').checked);
  showAlert('提示','设置已保存');
}

// ===== 弹窗 =====
function showAlert(title,msg){
  document.getElementById('alert-title').textContent=title;
  document.getElementById('alert-msg').textContent=msg;
  document.getElementById('modal-alert').classList.add('show');
}
function closeAlert(){document.getElementById('modal-alert').classList.remove('show')}

// ===== 初始化 =====
(function(){
  const auto = localStorage.getItem('diskCleanAuto');
  if(auto==='true') document.getElementById('auto-clean').checked = true;
  renderLogs();
  if(cleanLog.length){
    const last = cleanLog[cleanLog.length-1];
    document.getElementById('home-log-card').style.display='block';
    document.getElementById('home-log-text').textContent = `上次清理: ${last.time} · 释放: ${last.space} · 删除 ${last.deleted} 个文件`;
  }
})();
</script>
</body>
</html>
