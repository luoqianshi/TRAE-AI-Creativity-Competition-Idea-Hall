<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SeedOmics — 种业多组学 Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: 'var(--background)',
            foreground: 'var(--foreground)',
            card: 'var(--card)',
            'card-foreground': 'var(--card-foreground)',
            popover: 'var(--popover)',
            'popover-foreground': 'var(--popover-foreground)',
            primary: 'var(--primary)',
            'primary-foreground': 'var(--primary-foreground)',
            secondary: 'var(--secondary)',
            'secondary-foreground': 'var(--secondary-foreground)',
            muted: 'var(--muted)',
            'muted-foreground': 'var(--muted-foreground)',
            accent: 'var(--accent)',
            'accent-foreground': 'var(--accent-foreground)',
            destructive: 'var(--destructive)',
            'destructive-foreground': 'var(--destructive-foreground)',
            border: 'var(--border)',
            input: 'var(--input)',
            ring: 'var(--ring)',
          },
          fontFamily: {
            sans: ['ui-sans-serif','system-ui','-apple-system','PingFang SC','Microsoft YaHei','sans-serif'],
            mono: ['ui-monospace','SFMono-Regular','Menlo','Consolas','monospace'],
          },
        },
      },
    }
  </script>
  <style>
    :root {
      --radius: 0.625rem;
      --background: oklch(0.16 0.005 160);
      --foreground: oklch(0.96 0.005 160);
      --card: oklch(0.19 0.006 160);
      --card-foreground: oklch(0.96 0.005 160);
      --popover: oklch(0.19 0.006 160);
      --popover-foreground: oklch(0.96 0.005 160);
      --primary: oklch(0.82 0.16 155);
      --primary-foreground: oklch(0.18 0.02 160);
      --secondary: oklch(0.24 0.008 160);
      --secondary-foreground: oklch(0.96 0.005 160);
      --muted: oklch(0.22 0.006 160);
      --muted-foreground: oklch(0.65 0.01 160);
      --accent: oklch(0.26 0.01 160);
      --accent-foreground: oklch(0.96 0.005 160);
      --destructive: oklch(0.62 0.22 27);
      --destructive-foreground: oklch(0.98 0.003 160);
      --border: #000;
      --input: oklch(0.24 0.008 160);
      --ring: oklch(0.82 0.16 155);
    }
    .theme-cream {
      --background: oklch(0.985 0.004 85);
      --foreground: oklch(0.18 0 0);
      --card: oklch(0.975 0.005 85);
      --card-foreground: oklch(0.18 0 0);
      --popover: oklch(0.985 0.004 85);
      --popover-foreground: oklch(0.18 0 0);
      --primary: oklch(0.32 0 0);
      --primary-foreground: oklch(0.985 0.004 85);
      --secondary: oklch(0.93 0.006 85);
      --secondary-foreground: oklch(0.18 0 0);
      --muted: oklch(0.94 0.006 85);
      --muted-foreground: oklch(0.42 0 0);
      --accent: oklch(0.92 0.006 85);
      --accent-foreground: oklch(0.18 0 0);
      --destructive: oklch(0.58 0.22 27);
      --destructive-foreground: oklch(0.98 0 0);
      --border: #000;
      --input: oklch(0.93 0.006 85);
      --ring: oklch(0.32 0 0);
    }
    * { border-color: var(--border); }
    html, body {
      height: 100%;
      background: var(--background);
      color: var(--foreground);
    }
    .bg-dotgrid {
      background-image: radial-gradient(oklch(0.32 0.01 160) 1px, transparent 1px);
      background-size: 22px 22px;
      background-position: 0 0;
    }
    .theme-cream .bg-dotgrid {
      background-image: radial-gradient(oklch(0.84 0.006 85) 1px, transparent 1px);
    }
    html, body, .chat-scroll, *:not(.no-scrollbar) {
      scrollbar-width: thin;
      scrollbar-color: #000 transparent;
    }
    *::-webkit-scrollbar { width: 4px; height: 4px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: #000; border-radius: 2px; }
    *::-webkit-scrollbar-corner { background: transparent; }
    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    /* Chat / markdown-ish styles */
    .chat-msg p { margin: 0.5rem 0; line-height: 1.6; }
    .chat-msg p:first-child { margin-top: 0; }
    .chat-msg p:last-child { margin-bottom: 0; }
    .chat-msg strong { font-weight: 600; }
    .chat-msg code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85em;
      background: var(--accent);
      padding: 0.1rem 0.35rem;
      border-radius: 0.25rem;
    }
    .chat-msg pre {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.75rem;
      overflow: auto;
      font-size: 0.8rem;
      line-height: 1.5;
      margin: 0.5rem 0;
    }
    .chat-msg pre code { background: transparent; padding: 0; }
    .chat-msg ul, .chat-msg ol { padding-left: 1.25rem; margin: 0.5rem 0; }
    .chat-msg li { margin: 0.15rem 0; }
    .chat-msg table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin: 0.5rem 0;
    }
    .chat-msg th, .chat-msg td {
      border: 1px solid var(--border);
      padding: 0.35rem 0.5rem;
      text-align: left;
    }
    .chat-msg blockquote {
      border-left: 2px solid var(--primary);
      padding-left: 0.75rem;
      margin: 0.5rem 0;
      color: var(--muted-foreground);
    }
    .code-block .line-numbers {
      text-align: right;
      color: var(--muted-foreground);
      opacity: 0.6;
      user-select: none;
      padding-right: 0.75rem;
      border-right: 1px solid var(--border);
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden">
  <div id="app" class="h-screen w-screen overflow-hidden bg-background text-foreground flex flex-col">
    <!-- Top bar -->
    <div class="h-10 shrink-0 border-b flex items-center justify-between px-3 text-xs">
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-1.5 px-1.5 py-0.5 rounded bg-primary/15 text-primary font-medium">
          SEED <span class="text-[10px] opacity-70">OMICS</span>
        </div>
        <button onclick="toggleLeft()" class="p-1 rounded hover:bg-accent text-muted-foreground" title="折叠/展开左侧">
          <i data-lucide="panel-left" class="h-3.5 w-3.5"></i>
        </button>
        <span class="text-muted-foreground">demo-project</span>
        <i data-lucide="chevron-down" class="h-3 w-3 text-muted-foreground"></i>
      </div>
      <div class="flex items-center gap-1 text-muted-foreground">
        <button onclick="toggleDock()" id="btn-dock" class="p-1 rounded hover:bg-accent" title="显示/隐藏终端">
          <i data-lucide="terminal-square" class="h-3.5 w-3.5"></i>
        </button>
        <button class="p-1 rounded hover:bg-accent"><i data-lucide="search" class="h-3.5 w-3.5"></i></button>
        <button onclick="toggleSettings()" id="btn-settings" class="p-1 rounded hover:bg-accent" title="设置">
          <i data-lucide="settings" class="h-3.5 w-3.5"></i>
        </button>
        <button class="p-1 rounded hover:bg-accent"><i data-lucide="more-horizontal" class="h-3.5 w-3.5"></i></button>
      </div>
    </div>

    <!-- Main grid -->
    <div id="main" class="flex-1 min-h-0 grid transition-all duration-200" style="grid-template-columns: 240px 1fr 360px;">
      <!-- LEFT -->
      <aside id="left" class="border-r flex flex-col min-h-0 bg-background overflow-hidden"></aside>

      <!-- CENTER -->
      <section id="center" class="flex flex-col min-h-0 bg-dotgrid relative">
        <div id="center-content" class="flex-1 overflow-auto"></div>
        <div id="composer-wrap" class="border-t p-4 bg-background"></div>
        <div id="dock" class="hidden shrink-0 border-t flex flex-col" style="background: oklch(0.13 0.005 160); height: 240px;">
          <div class="h-8 shrink-0 flex items-center pl-2 pr-1 gap-1 border-b border-border/60 bg-card/40">
            <div class="flex items-center gap-1.5 pr-2 mr-1 border-r border-border/60">
              <span class="h-2.5 w-2.5 rounded-full" style="background: oklch(0.62 0.22 27);"></span>
              <span class="h-2.5 w-2.5 rounded-full" style="background: oklch(0.78 0.17 85);"></span>
              <span class="h-2.5 w-2.5 rounded-full" style="background: oklch(0.72 0.18 145);"></span>
            </div>
            <button onclick="setDockTab('Terminal')" id="dock-tab-Terminal" class="h-6 px-2 rounded text-[11px] transition-colors">Terminal</button>
            <button onclick="setDockTab('Output')" id="dock-tab-Output" class="h-6 px-2 rounded text-[11px] transition-colors">Output</button>
            <button onclick="setDockTab('Problems')" id="dock-tab-Problems" class="h-6 px-2 rounded text-[11px] transition-colors">Problems</button>
            <div class="ml-auto flex items-center gap-0.5 text-muted-foreground">
              <button class="h-6 w-6 grid place-items-center rounded hover:bg-accent"><i data-lucide="play" class="h-3 w-3"></i></button>
              <button class="h-6 w-6 grid place-items-center rounded hover:bg-accent"><i data-lucide="square" class="h-3 w-3"></i></button>
              <button class="h-6 w-6 grid place-items-center rounded hover:bg-accent"><i data-lucide="copy" class="h-3 w-3"></i></button>
              <button class="h-6 w-6 grid place-items-center rounded hover:bg-accent"><i data-lucide="trash-2" class="h-3 w-3"></i></button>
              <span class="mx-1 h-4 w-px bg-border"></span>
              <button onclick="toggleDockCollapse()" class="h-6 w-6 grid place-items-center rounded hover:bg-accent">
                <i data-lucide="chevron-up" id="dock-chevron" class="h-3 w-3 transition-transform"></i>
              </button>
            </div>
          </div>
          <div id="dock-body" class="flex-1 min-h-0 overflow-auto no-scrollbar py-2 px-3 font-mono text-[12px] leading-[1.45]"></div>
        </div>
      </section>

      <!-- RIGHT -->
      <aside id="right" class="border-l flex flex-col min-h-0 bg-background relative"></aside>
    </div>

    <!-- Status bar -->
    <div class="h-6 shrink-0 border-t flex items-center justify-between px-3 text-[11px] text-muted-foreground">
      <div class="flex items-center gap-3">
        <span class="flex items-center gap-1.5"><span class="h-1.5 w-1.5 rounded-full bg-primary"></span>在线</span>
        <span>Agent: gpt-omics-4</span>
      </div>
      <div>v0.1.0 · BETA</div>
    </div>
  </div>

  <script>
    // ── Data ──────────────────────────────────────────────────────
    const agents = [
      { id:'genome', name:'基因组 Agent', tag:'Genomics', icon:'dna', desc:'VCF/BAM 全流程：变异检测、群体结构、GWAS 关联定位。', bullets:['GATK / bcftools 自动调度','PCA、群体结构可视化','GWAS 与候选基因输出'], tools:['GATK','bcftools','PLINK2','rMVP','SnpEff','PCA viz'] },
      { id:'transcriptome', name:'转录组 Agent', tag:'Transcriptomics', icon:'microscope', desc:'RNA-seq 差异表达、通路富集与共表达网络。', bullets:['DESeq2 / edgeR 差异分析','KEGG / GO 富集','WGCNA 模块识别'], tools:['STAR','Salmon','DESeq2','edgeR','clusterProfiler','WGCNA'] },
      { id:'phenome', name:'表型组 Agent', tag:'Phenomics', icon:'wheat', desc:'田间与图像表型数据清洗、建模与基因型关联。', bullets:['多年多点表型整合','BLUP 育种值估计','基因型 × 环境交互'], tools:['ASReml','lme4','BLUP','GxE Model','ImageJ','PlantCV'] },
      { id:'metabolome', name:'代谢组 Agent', tag:'Metabolomics', icon:'flask-conical', desc:'代谢物谱差异分析与多组学联合挖掘。', bullets:['峰对齐与归一化','差异代谢物筛选','与基因表达联动分析'], tools:['XCMS','MZmine','MetaboAnalyst','mixOmics','KEGG Map'] },
      { id:'proteome', name:'蛋白组 Agent', tag:'Proteomics', icon:'flask-round', desc:'蛋白鉴定、定量与翻译后修饰功能注释。', bullets:['MaxQuant / DIA-NN 定量','GO / KEGG 功能富集','蛋白互作网络构建'], tools:['MaxQuant','DIA-NN','Perseus','String','Pfam','PANTHER'] },
      { id:'integration', name:'多组学整合 Agent', tag:'Integration', icon:'network', desc:'跨组学数据融合、关联分析与联合建模。', bullets:['多组学数据对齐','mixOmics / MOFA 整合','候选基因-代谢物-表型关联'], tools:['mixOmics','MOFA','SNF','WGCNA','rCCA','sPLS'] },
    ];
    const tools = [
      {name:'Pipeline', desc:'分析流程', icon:'file-code-2'},
      {name:'Terminal', desc:'命令行', icon:'terminal-square'},
      {name:'Browser', desc:'文献检索', icon:'globe'},
      {name:'Figure', desc:'图表', icon:'image'},
      {name:'Explorer', desc:'资源管理器', icon:'folder-tree'},
      {name:'Integrations', desc:'数据源', icon:'puzzle'},
      {name:'Agents', desc:'多智能体', icon:'bot'},
      {name:'MCP', desc:'工具协议', icon:'boxes'},
      {name:'History', desc:'分析历史', icon:'bar-chart-3'},
      {name:'Knowledge', desc:'知识图谱', icon:'network'},
    ];
    const pipelines = [
      { id:'gwas_rice', name:'gwas_rice.nf', tag:'GWAS', desc:'水稻群体 GWAS · 5 步', steps:[
        {id:'load_vcf', title:'load_vcf', status:'done', detail:'读取 215 samples · 4.2M SNPs，校验 contig 元数据'},
        {id:'qc_filter', title:'qc_filter', status:'done', detail:'MAF ≥ 0.05，缺失率 ≤ 0.1，输出 qc.vcf.gz'},
        {id:'pca_structure', title:'pca_structure', status:'running', detail:'计算亲缘矩阵 K(215×215)，提取 PC1–PC5 作为协变量'},
        {id:'gwas_mlm', title:'gwas_mlm', status:'pending', detail:'rMVP · MLM 模型，输出 p 值与 Manhattan 数据'},
        {id:'annotate', title:'annotate', status:'pending', detail:'SnpEff 注释 + 候选基因排序，生成 report.md'},
      ]},
      { id:'rnaseq_de', name:'rnaseq_de.nf', tag:'RNA-seq', desc:'差异表达 · 4 步', steps:[
        {id:'align', title:'align', status:'pending', detail:'STAR 比对到参考基因组，输出 BAM'},
        {id:'quant', title:'quant', status:'pending', detail:'Salmon 转录本定量'},
        {id:'deseq2', title:'deseq2', status:'pending', detail:'DESeq2 差异表达分析'},
        {id:'enrich', title:'enrichment', status:'pending', detail:'clusterProfiler GO / KEGG 富集'},
      ]}
    ];
    const tasks = [
      { id:'rice-gwas', title:'水稻抗稻瘟候选基因定位', time:'今天 10:24', status:'运行中' },
      { id:'wheat-blup', title:'小麦多年多点产量 BLUP', time:'昨天', status:'已完成' },
      { id:'maize-rnaseq', title:'玉米耐旱 RNA-seq 差异分析', time:'2 天前', status:'已完成' },
    ];
    const taskChats = {
      'rice-gwas': [
        {role:'user', html:'用这批 215 份水稻样本做 GWAS，定位抗稻瘟病候选基因。'},
        {role:'assistant', html:`<p>已生成流水线 <code>gwas_rice.nf</code>，整体流程：</p>
          <ol><li><strong>QC</strong> — 过滤 MAF &lt; 0.05、缺失率 &gt; 10% 的位点</li>
          <li><strong>群体结构</strong> — PCA 取前 5 个主成分</li>
          <li><strong>关联检测</strong> — 混合线性模型 (MLM, EMMAX)</li></ol>
          <table><thead><tr><th>步骤</th><th>工具</th><th>输出</th></tr></thead><tbody>
          <tr><td>QC</td><td>bcftools / plink2</td><td><code>qc.vcf.gz</code></td></tr>
          <tr><td>PCA</td><td>plink2</td><td><code>pca.eigenvec</code></td></tr>
          <tr><td>GWAS</td><td>EMMAX</td><td><code>assoc.ps</code></td></tr>
          </tbody></table>
          <p>示例命令：</p>
          <pre><code>nextflow run gwas_rice.nf \\
  --vcf data/rice215.vcf.gz \\
  --pheno data/blast_score.tsv \\
  -profile slurm</code></pre>
          <p>结果与 Manhattan / PCA 图已写入 <code>results/</code>，可在右侧文件树中查看。</p>`},
        {role:'user', html:'把显著位点（P &lt; 1e-6）导出成 CSV。'},
        {role:'assistant', html:`<p>已在 <code>results/sig_snps.csv</code> 输出 <strong>37 个</strong>显著位点，字段如下：</p>
          <ul><li><code>chrom</code> / <code>pos</code> — 基因组坐标</li>
          <li><code>p_value</code> — MLM 关联 P 值</li>
          <li><code>nearest_gene</code> — 最近基因 (Os 命名)</li></ul>
          <blockquote>提示：top hit 落在 <strong>Chr6: 10.4 Mb</strong>，邻近已知抗病基因 <em>Pi9</em>。</blockquote>`},
      ],
      'wheat-blup': [
        {role:'user', html:'把过去 5 年 12 个试点的小麦产量数据做 BLUP 估计。'},
        {role:'assistant', html:`<p>已构建混合线性模型并完成 <strong>BLUP</strong> 估计：</p>
          <ul><li><strong>模型</strong>：<code>y = μ + Genotype + Env + G×E + ε</code></li>
          <li><strong>样本</strong>：480 份品系 × 12 试点 × 5 年</li>
          <li><strong>输出</strong>：<code>results/blup_values.tsv</code>、<code>results/heritability.json</code></li></ul>
          <p>广义遗传力 <strong>H² = 0.71</strong>，G×E 方差占比 <strong>18.3%</strong>。</p>`},
        {role:'user', html:'挑出综合表现 Top 20 的品系。'},
        {role:'assistant', html:`<p>已输出 <code>results/top20_lines.csv</code>，按 <strong>BLUP 育种值</strong>降序排列，附稳定性指数 (Shukla σ²)。</p>`},
      ],
      'maize-rnaseq': [
        {role:'user', html:'对耐旱与对照玉米幼苗的 RNA-seq 做差异表达分析。'},
        {role:'assistant', html:`<p>已完成比对与定量：</p>
          <ul><li><strong>比对</strong>：STAR → <code>Aligned.sortedByCoord.bam</code></li>
          <li><strong>定量</strong>: featureCounts → <code>counts.tsv</code></li>
          <li><strong>差异</strong>：DESeq2，<code>padj &lt; 0.05</code> &amp; <code>|log2FC| &gt; 1</code></li></ul>
          <p>共识别 <strong>1,284</strong> 个差异表达基因 (上调 712 / 下调 572)。</p>`},
        {role:'user', html:'做一下 KEGG 富集分析。'},
        {role:'assistant', html:`<p>Top 富集通路：</p>
          <ol><li><strong>植物激素信号转导</strong> (<code>padj = 1.2e-7</code>)</li>
          <li><strong>MAPK 信号通路</strong> (<code>padj = 3.4e-6</code>)</li>
          <li><strong>淀粉与蔗糖代谢</strong> (<code>padj = 8.9e-5</code>)</li></ol>
          <p>结果图保存在 <code>results/kegg_dotplot.png</code>。</p>`},
      ],
    };

    const state = {
      activeAgent: null,
      rightView: 'flow',
      activePanel: 'Pipeline',
      leftCollapsed: false,
      settingsOpen: false,
      dockVisible: false,
      dockTab: 'Terminal',
      dockCollapsed: false,
      activeTaskId: 'rice-gwas',
      chatStarted: false,
      liveMessages: [],
      composerValue: '',
      composerMenuOpen: false,
      attachments: [],
      expandedPipeline: 'gwas_rice',
      theme: 'dark',
    };

    // ── Helpers ───────────────────────────────────────────────────
    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function renderIcons() {
      if (window.lucide) lucide.createIcons();
    }
    function activeAgentMeta() {
      return agents.find(a => a.name === state.activeAgent);
    }

    // ── Rendering ─────────────────────────────────────────────────
    function render() {
      setGrid();
      document.getElementById('btn-dock').className = 'p-1 rounded hover:bg-accent ' + (state.dockVisible ? 'text-foreground bg-accent/70' : '');
      document.getElementById('btn-settings').className = 'p-1 rounded hover:bg-accent ' + (state.settingsOpen ? 'text-foreground bg-accent/70' : '');
      renderLeft();
      renderCenter();
      renderComposer();
      renderRight();
      renderDock();
      renderIcons();
    }

    function setGrid() {
      const left = state.settingsOpen ? '44px' : (state.leftCollapsed ? '44px' : '240px');
      const cols = state.settingsOpen
        ? '44px minmax(360px,1fr) minmax(420px,1.6fr)'
        : `${left} 1fr 360px`;
      document.getElementById('main').style.gridTemplateColumns = cols;
    }

    function renderLeft() {
      const el = document.getElementById('left');
      if (state.leftCollapsed) {
        el.className = 'border-r flex flex-col items-center py-2 gap-2 min-h-0 bg-background overflow-hidden';
        el.innerHTML = `
          <button onclick="toggleLeft()" class="h-8 w-8 grid place-items-center rounded hover:bg-accent text-muted-foreground" title="展开"><i data-lucide="panel-left" class="h-4 w-4"></i></button>
          <button class="h-8 w-8 grid place-items-center rounded hover:bg-accent text-muted-foreground" title="新任务"><i data-lucide="plus" class="h-4 w-4"></i></button>
          <div class="mt-2 w-6 border-t"></div>
          ${tasks.map(t => `
            <button onclick="openTask('${t.id}')" title="${t.title}" class="h-7 w-7 grid place-items-center rounded text-[10px] ${state.activeTaskId===t.id?'bg-accent text-foreground':'text-muted-foreground hover:bg-accent'}">
              ${t.title.slice(0,1)}
            </button>

    function panelHistory() {
      const runs = [
        {query:'水稻稻瘟病抗性基因 GWAS 分析', status:'completed', time:'2026-06-15 10:30', duration:'45s', calls:12, agents:['基因组','知识']},
        {query:'玉米耐旱转录组差异表达分析', status:'completed', time:'2026-06-15 09:15', duration:'32s', calls:8, agents:['转录组']},
        {query:'小麦品质性状多组学联合分析', status:'failed', time:'2026-06-14 16:45', duration:'18s', calls:5, agents:['基因组','转录组','代谢组']},

        <div class="space-y-2">${runs.map(r => `
          <div class="rounded-lg border bg-card/40 overflow-hidden hover:bg-card hover:border-primary/40 transition-all">

    function panelKnowledge() {
      const nodes = [
        {name:'OsNPR1', type:'Gene', species:'Oryza sativa', desc:'水稻系统获得性抗性关键调控基因'},
        {name:'Salicylic Acid Pathway', type:'Pathway', desc:'水杨酸信号通路 — 植物免疫核心通路'},
        {name:'Blast Resistance', type:'Trait', species:'Oryza sativa', desc:'稻瘟病抗性'},
        {name:'Salicylic Acid', type:'Metabolite', desc:'水杨酸，植物防御激素'},
      ];
      const colors = {
        Gene:'text-primary bg-primary/15 border-primary/40',
        Protein:'text-blue-500 bg-blue-500/15 border-blue-500/40',
        Metabolite:'text-emerald-500 bg-emerald-500/15 border-emerald-500/40',
        Pathway:'text-purple-500 bg-purple-500/15 border-purple-500/40',

          <div class="rounded-md border bg-card/40 p-2 text-center"><div class="text-lg font-semibold tabular-nums text-primary">8</div><div class="text-[10px] text-muted-foreground">关系</div></div>
          <div class="rounded-md border bg-card/40 p-2 text-center"><div class="text-lg font-semibold tabular-nums text-primary">5</div><div class="text-[10px] text-muted-foreground">类型</div></div>
        </div>
        <div class="relative"><i data-lucide="search" class="absolute left-2 top-1/2 -translate-y-1/2 h-3.5 w-3.5 text-muted-foreground"></i><input placeholder="搜索基因、通路、性状..." class="w-full h-8 pl-7 pr-2 rounded-md border bg-card/40 text-xs placeholder:text-muted-foreground"></div>
        <div class="space-y-1.5">${nodes.map(n => `
          <button class="w-full text-left rounded-md border p-2.5 flex items-start gap-2 transition-all hover:bg-card hover:border-primary/40 bg-card/40">

            <div class="min-w-0 flex-1"><div class="text-[12px] font-medium truncate">${n.name}</div><div class="text-[11px] text-muted-foreground truncate">${n.species?`<span class="font-mono">${n.species}</span> · ` : ''}${n.desc}</div></div>
            <i data-lucide="chevron-right" class="h-3.5 w-3.5 text-muted-foreground shrink-0 mt-0.5"></i>
          </button>
        `).join('')}</div>
      </div>`;
    }

    function panelBrowser() {
      const refs = [
        {t:'Pi9: a broad-spectrum blast resistance gene — Theor Appl Genet', host:'pubmed.ncbi.nlm.nih.gov'},
        {t:'Genome-wide association study of blast resistance — Nat Plants', host:'nature.com'},
        {t:'Rice MAGIC population for QTL mapping — Plant J', host:'onlinelibrary.wiley.com'},

        <input class="w-full h-8 px-2 rounded-md border bg-card/40 text-xs" value="rice blast resistance gene Pi9">

          <a href="#" class="block rounded-md border bg-card/40 p-2.5 hover:bg-card transition-colors group">
            <div class="flex items-center gap-1.5"><div class="text-primary truncate flex-1 group-hover:underline">${r.t}</div><i data-lucide="external-link" class="h-3 w-3 text-muted-foreground shrink-0"></i></div>
            <div class="text-[11px] text-muted-foreground">${r.host}</div>

    function panelFigure() {
      const bars = Array.from({length:60},(_,i)=>10+(i*37)%80);
      return `<div class="space-y-3">
        <div class="rounded-md border bg-card/40 p-3 group">
          <div class="flex items-center mb-2"><div class="text-xs text-muted-foreground">Manhattan plot · chr1–12</div><button class="ml-auto h-6 w-6 grid place-items-center rounded text-muted-foreground hover:bg-accent hover:text-foreground"><i data-lucide="maximize-2" class="h-3 w-3"></i></button></div>
          <div class="h-28 flex items-end gap-[2px]">${bars.map(h=>`<div class="flex-1 bg-primary/60" style="height:${h}%"></div>`).join('')}</div>
        </div>
        <div class="rounded-md border bg-card/40 p-3 group">
          <div class="flex items-center mb-2"><div class="text-xs text-muted-foreground">PCA · PC1 vs PC2</div><button class="ml-auto h-6 w-6 grid place-items-center rounded text-muted-foreground hover:bg-accent hover:text-foreground"><i data-lucide="maximize-2" class="h-3 w-3"></i></button></div>
          <div class="h-28 relative">${Array.from({length:40},(_,i)=>`<span class="absolute h-1.5 w-1.5 rounded-full bg-primary/70" style="left:${(i*17)%95}%;top:${(i*29)%90}%"></span>`).join('')}</div>

    function panelTerminal() {
      return terminalBody();
    }
    function panelExplorer() {
      const files = ['results/manhattan.png','results/pca.png','scripts/gwas.nf','scripts/qc.sh'];
      return `<div class="text-[12px] space-y-2">
        <div class="flex items-center gap-1.5 px-2 py-1 text-muted-foreground"><i data-lucide="folder" class="h-3.5 w-3.5"></i><span>project</span></div>
        ${files.map(f=>`<button class="w-full flex items-center gap-1.5 px-2 py-1 rounded text-left text-muted-foreground hover:bg-accent/60"><i data-lucide="${f.endsWith('.png')?'image':'file-code'}" class="h-3.5 w-3.5 shrink-0"></i><span class="truncate">${f}</span></button>`).join('')}
      </div>`;
    }

    function renderSettings() {
      return `
        <div class="flex-1 min-h-0 flex flex-col">
          <div class="h-9 border-b flex items-center px-3 text-[12px]">
            <i data-lucide="settings" class="h-3.5 w-3.5 text-primary mr-1.5"></i>
            <span class="font-medium">设置 · 通用</span>
            <button onclick="toggleSettings()" class="ml-auto p-1 hover:bg-accent rounded text-muted-foreground"><i data-lucide="x" class="h-3.5 w-3.5"></i></button>
          </div>
          <div class="flex-1 overflow-auto p-5 chat-scroll">
            <div class="max-w-2xl space-y-6">
              <div><h2 class="text-lg font-semibold">通用</h2></div>
              <div>
                <div class="text-[12px] font-medium mb-2 text-muted-foreground">基础设置</div>
                <div class="rounded-lg border bg-card/40 divide-y">
                  <div class="p-3 flex items-start gap-3">
                    <div class="flex-1"><div class="text-[13px] font-medium">主题</div><div class="text-[11px] text-muted-foreground">选择您偏好的界面主题</div></div>
                    <div class="flex items-center rounded-md border p-0.5 bg-background">
                      <button onclick="setTheme('dark')" class="px-3 h-7 rounded text-[12px] transition-colors inline-flex items-center gap-1.5 ${state.theme==='dark'?'bg-primary text-primary-foreground':'text-muted-foreground hover:text-foreground'}">${state.theme==='dark'?'<i data-lucide="check" class="h-3 w-3"></i>':''}暗色 Dark</button>
                      <button onclick="setTheme('cream')" class="px-3 h-7 rounded text-[12px] transition-colors inline-flex items-center gap-1.5 ${state.theme==='cream'?'bg-primary text-primary-foreground':'text-muted-foreground hover:text-foreground'}">${state.theme==='cream'?'<i data-lucide="check" class="h-3 w-3"></i>':''}米白 Cream</button>
                    </div>
                  </div>
                  <div class="p-3 flex items-center gap-3"><div class="flex-1"><div class="text-[13px] font-medium">语言</div><div class="text-[11px] text-muted-foreground">界面与按钮文本的语言</div></div><div class="text-[12px] px-3 h-7 inline-flex items-center rounded border bg-background">简体中文</div></div>
                </div>
              </div>
              <div>
                <div class="text-[12px] font-medium mb-2 text-muted-foreground">主题预览</div>
                <div class="rounded-lg border bg-card p-4 space-y-3">
                  <div class="flex items-center gap-2">
                    <span class="px-2 py-1 rounded bg-primary text-primary-foreground text-[11px]">Primary</span>
                    <span class="px-2 py-1 rounded bg-accent text-accent-foreground text-[11px]">Accent</span>
                    <span class="px-2 py-1 rounded bg-muted text-muted-foreground text-[11px]">Muted</span>
                    <span class="px-2 py-1 rounded border text-[11px]">Border</span>
                  </div>
                  <div class="text-[12px] text-foreground">前景文本 · foreground</div>
                  <div class="text-[12px] text-muted-foreground">次要文本 · muted-foreground</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderDock() {
      const dock = document.getElementById('dock');
      const body = document.getElementById('dock-body');
      if (!state.dockVisible) { dock.classList.add('hidden'); return; }
      dock.classList.remove('hidden');
      ['Terminal','Output','Problems'].forEach(t => {
        const btn = document.getElementById('dock-tab-'+t);
        if (btn) btn.className = 'h-6 px-2 rounded text-[11px] transition-colors ' + (state.dockTab===t ? 'bg-accent text-foreground' : 'text-muted-foreground hover:text-foreground hover:bg-accent/60');
      });
      document.getElementById('dock-chevron').style.transform = state.dockCollapsed ? 'rotate(180deg)' : '';
      if (state.dockCollapsed) { body.innerHTML = ''; return; }
      if (state.dockTab === 'Terminal') body.innerHTML = terminalBody();
      else if (state.dockTab === 'Output') body.innerHTML = outputBody();
      else body.innerHTML = problemsBody();
    }

    function terminalBody() {
      return `<div class="space-y-0.5">
        <div><span style="color:oklch(0.72 0.18 145)">seedomics@workspace</span><span class="text-muted-foreground">:</span><span style="color:oklch(0.7 0.14 240)">~/projects/rice-gwas</span><span class="text-muted-foreground">$ </span><span>nextflow run gwas_rice.nf -profile docker -resume</span></div>
        <div class="text-muted-foreground">N E X T F L O W  ~  version 24.04.4</div>
        <div class="text-muted-foreground">Launching \`gwas_rice.nf\` [astonishing_curie] DSL2</div>
        <div class="text-muted-foreground">executor &gt; docker (5)</div>
        <div><span style="color:oklch(0.72 0.18 145)">[ok]</span> <span class="text-foreground">process &gt; load_vcf</span> <span class="text-muted-foreground">(1 of 1) ✓</span></div>
        <div><span style="color:oklch(0.72 0.18 145)">[ok]</span> <span class="text-foreground">process &gt; qc_filter</span> <span class="text-muted-foreground">(1 of 1) ✓</span></div>
        <div><span style="color:oklch(0.78 0.17 85)">[..]</span> <span class="text-foreground">process &gt; pca_structure</span> <span class="text-muted-foreground">(1 of 1)</span></div>
        <div class="text-muted-foreground">  → computing kinship matrix (K = 215×215)</div>
        <div class="text-muted-foreground">  → eigen-decomposition…</div>
        <div class="mt-1 flex items-center"><span style="color:oklch(0.72 0.18 145)">seedomics@workspace</span><span class="text-muted-foreground">:</span><span style="color:oklch(0.7 0.14 240)">~/projects/rice-gwas</span><span class="text-muted-foreground">$ </span><span class="inline-block w-2 h-4 ml-0.5 bg-primary/80 animate-pulse"></span></div>
      </div>`;
    }
    function outputBody() {
      return `<div class="space-y-0.5 text-muted-foreground">
        <div><span style="color:oklch(0.7 0.14 240)">[info]</span>  loaded 215 samples, 4,238,112 SNPs</div>
        <div><span style="color:oklch(0.7 0.14 240)">[info]</span>  filtered MAF&lt;0.05, missing&gt;0.1 → 2,914,003 SNPs</div>
        <div><span style="color:oklch(0.78 0.17 85)">[warn]</span>  3 samples with call rate &lt; 0.9 excluded</div>
        <div><span style="color:oklch(0.7 0.14 240)">[info]</span>  writing results/qc.vcf.gz</div>
      </div>`;
    }
    function problemsBody() {
      return `<div class="space-y-1">
        <div class="flex gap-2"><span style="color:oklch(0.62 0.22 27)">●</span><span>scripts/gwas.nf:42 · 未使用的参数 <span class="text-muted-foreground">\`covar\`</span></span></div>
        <div class="flex gap-2"><span style="color:oklch(0.78 0.17 85)">●</span><span>data/samples.vcf · 缺少 contig 元信息</span></div>
      </div>`;
    }

    // ── Actions ───────────────────────────────────────────────────
    function toggleLeft() { state.leftCollapsed = !state.leftCollapsed; render(); }
    function toggleDock() { state.dockVisible = !state.dockVisible; render(); }
    function toggleDockCollapse() { state.dockCollapsed = !state.dockCollapsed; render(); }
    function setDockTab(t) { state.dockTab = t; state.dockCollapsed = false; render(); }
    function toggleSettings() { state.settingsOpen = !state.settingsOpen; if(state.settingsOpen) state.leftCollapsed = true; render(); }
    function setRightView(v) { state.rightView = v; render(); }
    function setActivePanel(p) { state.activePanel = p; render(); }
    function openTool(p) { state.activePanel = p; state.rightView = 'panel'; render(); }
    function togglePipeline(id) { state.expandedPipeline = state.expandedPipeline===id?null:id; render(); }
    function setTheme(t) {
      state.theme = t;
      document.documentElement.classList.toggle('theme-cream', t==='cream');
      render();
    }
    function openTask(id) {
      state.activeTaskId = id;
      state.chatStarted = false;
      state.liveMessages = [];
      render();
    }
    function closeChat() {
      state.chatStarted = false;
      state.liveMessages = [];
      render();
    }
    function setAgent(name) {
      state.activeAgent = name;
      state.composerMenuOpen = false;
      render();
    }
    function toggleComposerMenu() { state.composerMenuOpen = !state.composerMenuOpen; render(); }
    function insertAt(text) {
      const ta = document.getElementById('composer-text');
      if (!ta) return;
      const start = ta.selectionStart, end = ta.selectionEnd;
      ta.value = ta.value.slice(0,start) + text + ta.value.slice(end);
      state.composerValue = ta.value;
      ta.focus(); ta.selectionStart = ta.selectionEnd = start + text.length;
    }
    function addAttachments(input) {
      if (!input.files) return;
      for (const f of input.files) state.attachments.push(f.name);
      render();
    }
    function removeAttachment(i) { state.attachments.splice(i,1); render(); }
    function sendMessage() {
      const text = state.composerValue.trim();
      if (!text) return;
      state.chatStarted = true;
      state.liveMessages.push({role:'user', html: escapeHtml(text)});
      state.liveMessages.push({role:'assistant', html:'<p>已收到，正在处理…</p>'});
      state.composerValue = '';
      render();
      setTimeout(() => {
        state.liveMessages[state.liveMessages.length-1].html = '<p>这是模拟回复。实际场景中会通过 <code>/api/chat/stream</code> 返回流式结果，并触发右侧 DAG 执行图更新。</p>';
        render();
      }, 900);
    }

    // ── Init ──────────────────────────────────────────────────────
    render();
  </script>
</body>
