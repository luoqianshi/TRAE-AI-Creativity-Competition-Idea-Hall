<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手势追踪变花</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #1a0a2e;
            --neon-pink: #ff6b9d;
            --neon-purple: #c44cff;
            --neon-blue: #4cc9ff;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--bg-deep);
            font-family: 'Georgia', serif;
        }

        #app {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        #three-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 100;
        }

        .loading-text {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--neon-pink);
            text-shadow: 0 0 20px var(--neon-pink);
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid transparent;
            border-top-color: var(--neon-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #permission-prompt {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 100;
            background: rgba(26, 10, 46, 0.9);
            padding: 3rem;
            border-radius: 20px;
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 40px rgba(196, 76, 255, 0.3);
        }

        #permission-prompt h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--neon-pink);
            text-shadow: 0 0 20px var(--neon-pink);
        }

        #permission-prompt p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            line-height: 1.6;
        }

        #start-btn {
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(255, 107, 157, 0.5);
            font-family: inherit;
        }

        #start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(255, 107, 157, 0.7);
        }

        #instructions {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
            opacity: 0.7;
            font-size: 1rem;
            z-index: 5;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .hidden {
            display: none !important;
        }

        #flower-hint {
            position: absolute;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: var(--neon-pink);
            font-size: 1.3rem;
            z-index: 5;
            text-shadow: 0 0 20px var(--neon-pink);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #flower-hint.show {
            opacity: 1;
        }

        #error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 100;
            background: rgba(26, 10, 46, 0.95);
            padding: 2rem 3rem;
            border-radius: 20px;
            border: 2px solid #ff4444;
            max-width: 90%;
        }

        #error-message h3 {
            color: #ff6b6b;
            margin-bottom: 1rem;
        }

        ::selection {
            background: var(--neon-purple);
            color: white;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="video-container">
            <video id="video" playsinline></video>
        </div>

        <div id="canvas-container">
            <canvas id="bg-canvas"></canvas>
            <canvas id="three-canvas"></canvas>
        </div>

        <div id="overlay"></div>

        <div id="loading" class="hidden">
            <div class="loading-text">正在初始化摄像头...</div>
            <div class="loading-spinner"></div>
        </div>

        <div id="permission-prompt">
            <h2>手势追踪变花</h2>
            <p>将您的双手伸到摄像头前<br>花朵将在您的手掌中绽放</p>
            <button id="start-btn">开始体验</button>
        </div>

        <div id="flower-hint">将手掌放入画面中</div>

        <div id="instructions">用手掌对准摄像头，等待花朵绽放</div>
    </div>

    <!-- Three.js -->
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675466160/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>

    <script>
        // 等待所有脚本加载完成
        window.addEventListener('load', function() {
            initApp();
        });

        function initApp() {
            const video = document.getElementById('video');
            const bgCanvas = document.getElementById('bg-canvas');
            const threeCanvas = document.getElementById('three-canvas');
            const permissionPrompt = document.getElementById('permission-prompt');
            const startBtn = document.getElementById('start-btn');
            const loading = document.getElementById('loading');
            const flowerHint = document.getElementById('flower-hint');
            const instructions = document.getElementById('instructions');

            let scene, camera, renderer, particleSystem;
            let flower = null;
            let hands = null;
            let mpCamera = null;
            let handNotVisibleCount = 0;
            let lastHandPosition = null;
            let time = 0;

            // 背景粒子系统
            class BackgroundParticle {
                constructor(canvas) {
                    this.canvas = canvas;
                    this.ctx = canvas.getContext('2d');
                    this.particles = [];
                    this.resize();
                    this.initParticles();
                    window.addEventListener('resize', () => this.resize());
                }

                resize() {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                }

                initParticles() {
                    const count = 50;
                    for (let i = 0; i < count; i++) {
                        this.particles.push({
                            x: Math.random() * this.canvas.width,
                            y: Math.random() * this.canvas.height,
                            size: Math.random() * 2 + 0.5,
                            speedX: (Math.random() - 0.5) * 0.3,
                            speedY: (Math.random() - 0.5) * 0.3,
                            opacity: Math.random() * 0.5 + 0.2
                        });
                    }
                }

                update() {
                    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                    const gradient = this.ctx.createRadialGradient(
                        this.canvas.width / 2, this.canvas.height / 2, 0,
                        this.canvas.width / 2, this.canvas.height / 2, this.canvas.width * 0.7
                    );
                    gradient.addColorStop(0, '#2a1050');
                    gradient.addColorStop(1, '#1a0a2e');
                    this.ctx.fillStyle = gradient;
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                    this.particles.forEach(p => {
                        p.x += p.speedX;
                        p.y += p.speedY;

                        if (p.x < 0) p.x = this.canvas.width;
                        if (p.x > this.canvas.width) p.x = 0;
                        if (p.y < 0) p.y = this.canvas.height;
                        if (p.y > this.canvas.height) p.y = 0;

                        this.ctx.beginPath();
                        this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        this.ctx.fillStyle = 'rgba(196, 76, 255, ' + p.opacity + ')';
                        this.ctx.fill();
                    });
                }
            }

            // 花朵类
            class Flower {
                constructor(scene, position) {
                    this.scene = scene;
                    this.position = position;
                    this.group = new THREE.Group();
                    this.scale = 0;
                    this.targetScale = 0;
                    this.swayPhase = Math.random() * Math.PI * 2;
                    this.swaySpeed = 0.5 + Math.random() * 0.5;
                    this.growthSpeed = 0.03;
                    this.opacity = 1;

                    this.createFlower();
                    scene.add(this.group);
                }

                createFlower() {
                    const colors = [
                        { r: 1, g: 0.4, b: 0.6 },
                        { r: 0.9, g: 0.2, b: 0.5 },
                        { r: 1, g: 0.5, b: 0.7 },
                        { r: 0.8, g: 0.3, b: 0.6 },
                        { r: 1, g: 0.6, b: 0.8 }
                    ];
                    this.color = colors[Math.floor(Math.random() * colors.length)];

                    const petalCount = 5 + Math.floor(Math.random() * 4);

                    for (let i = 0; i < petalCount; i++) {
                        const petalGeometry = new THREE.SphereGeometry(0.15, 16, 16);
                        petalGeometry.scale(1, 0.3, 1.5);

                        const petalMaterial = new THREE.MeshStandardMaterial({
                            color: new THREE.Color(this.color.r, this.color.g, this.color.b),
                            emissive: new THREE.Color(this.color.r * 0.3, this.color.g * 0.1, this.color.b * 0.2),
                            emissiveIntensity: 0.5,
                            transparent: true,
                            opacity: this.opacity,
                            roughness: 0.4,
                            metalness: 0.1
                        });

                        const petal = new THREE.Mesh(petalGeometry, petalMaterial);
                        const angle = (i / petalCount) * Math.PI * 2;
                        petal.position.set(
                            Math.cos(angle) * 0.12,
                            0,
                            Math.sin(angle) * 0.12
                        );
                        petal.rotation.x = Math.PI / 2;
                        petal.rotation.z = angle;
                        this.group.add(petal);
                    }

                    const centerGeometry = new THREE.SphereGeometry(0.08, 16, 16);
                    const centerMaterial = new THREE.MeshStandardMaterial({
                        color: 0xffeb3b,
                        emissive: 0xffeb3b,
                        emissiveIntensity: 0.3,
                        transparent: true,
                        opacity: this.opacity
                    });
                    this.center = new THREE.Mesh(centerGeometry, centerMaterial);
                    this.center.position.y = 0.02;
                    this.group.add(this.center);

                    const stemGeometry = new THREE.CylinderGeometry(0.015, 0.02, 0.4, 8);
                    const stemMaterial = new THREE.MeshStandardMaterial({
                        color: 0x228b22,
                        emissive: 0x228b22,
                        emissiveIntensity: 0.1,
                        transparent: true,
                        opacity: this.opacity
                    });
                    this.stem = new THREE.Mesh(stemGeometry, stemMaterial);
                    this.stem.position.y = -0.25;
                    this.group.add(this.stem);

                    for (let i = 0; i < 3; i++) {
                        const leafGeometry = new THREE.SphereGeometry(0.06, 8, 8);
                        leafGeometry.scale(1.5, 0.3, 1);
                        const leafMaterial = new THREE.MeshStandardMaterial({
                            color: 0x228b22,
                            emissive: 0x1a6b1a,
                            emissiveIntensity: 0.1,
                            transparent: true,
                            opacity: this.opacity
                        });
                        const leaf = new THREE.Mesh(leafGeometry, leafMaterial);
                        leaf.position.set(0.08, -0.15 - i * 0.1, 0);
                        leaf.rotation.z = -Math.PI / 4;
                        this.group.add(leaf);
                    }

                    const glowGeometry = new THREE.SphereGeometry(0.3, 16, 16);
                    const glowMaterial = new THREE.MeshBasicMaterial({
                        color: new THREE.Color(this.color.r, this.color.g, this.color.b),
                        transparent: true,
                        opacity: 0.15
                    });
                    this.glow = new THREE.Mesh(glowGeometry, glowMaterial);
                    this.glow.position.y = 0.05;
                    this.group.add(this.glow);
                }

                update(time) {
                    if (this.targetScale > this.scale) {
                        this.scale += this.growthSpeed;
                        if (this.scale > this.targetScale) {
                            this.scale = this.targetScale;
                        }
                        const elasticScale = this.easeOutElastic(this.scale);
                        this.group.scale.setScalar(elasticScale);
                    }

                    const sway = Math.sin(time * this.swaySpeed + this.swayPhase) * 0.1;
                    this.group.rotation.z = sway;
                    this.group.rotation.x = sway * 0.5;

                    this.glow.material.opacity = 0.1 + Math.sin(time * 2) * 0.05;
                }

                easeOutElastic(x) {
                    const c4 = (2 * Math.PI) / 3;
                    return x === 0 ? 0 : x === 1 ? 1 :
                        Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * c4) + 1;
                }

                setTargetScale(scale) {
                    this.targetScale = scale;
                }

                setOpacity(opacity) {
                    this.opacity = opacity;
                    this.group.traverse(function(child) {
                        if (child.material) {
                            child.material.opacity = opacity;
                        }
                    });
                }

                dispose() {
                    this.scene.remove(this.group);
                    this.group.traverse(function(child) {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) child.material.dispose();
                    });
                }
            }

            // 粒子系统
            class ParticleSystem {
                constructor(scene) {
                    this.scene = scene;
                    this.particles = [];
                }

                emit(position, color, count) {
                    count = count || 20;
                    for (let i = 0; i < count; i++) {
                        const geometry = new THREE.SphereGeometry(0.02, 8, 8);
                        const material = new THREE.MeshBasicMaterial({
                            color: new THREE.Color(color.r, color.g, color.b),
                            transparent: true,
                            opacity: 1
                        });
                        const particle = new THREE.Mesh(geometry, material);
                        particle.position.copy(position);
                        particle.userData = {
                            velocity: new THREE.Vector3(
                                (Math.random() - 0.5) * 0.1,
                                Math.random() * 0.1 + 0.05,
                                (Math.random() - 0.5) * 0.1
                            ),
                            life: 1,
                            decay: 0.02 + Math.random() * 0.02
                        };
                        this.scene.add(particle);
                        this.particles.push(particle);
                    }
                }

                update() {
                    for (let i = this.particles.length - 1; i >= 0; i--) {
                        const p = this.particles[i];
                        p.position.add(p.userData.velocity);
                        p.userData.velocity.y -= 0.002;
                        p.userData.life -= p.userData.decay;
                        p.material.opacity = p.userData.life;
                        p.scale.setScalar(p.userData.life);

                        if (p.userData.life <= 0) {
                            this.scene.remove(p);
                            p.geometry.dispose();
                            p.material.dispose();
                            this.particles.splice(i, 1);
                        }
                    }
                }
            }

            // 初始化 Three.js
            function setupThreeJS() {
                scene = new THREE.Scene();

                camera = new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    1000
                );
                camera.position.z = 2;

                renderer = new THREE.WebGLRenderer({
                    canvas: threeCanvas,
                    alpha: true,
                    antialias: true
                });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
                scene.add(ambientLight);

                const pointLight = new THREE.PointLight(0xff6b9d, 1, 10);
                pointLight.position.set(2, 2, 2);
                scene.add(pointLight);

                const pointLight2 = new THREE.PointLight(0xc44cff, 0.8, 10);
                pointLight2.position.set(-2, -2, 2);
                scene.add(pointLight2);

                particleSystem = new ParticleSystem(scene);

                window.addEventListener('resize', function() {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            // 背景粒子
            let backgroundParticles;

            function setupParticles() {
                backgroundParticles = new BackgroundParticle(bgCanvas);
            }

            // 启动摄像头
            async function startCamera() {
                permissionPrompt.classList.add('hidden');
                loading.classList.remove('hidden');

                try {
                    await setupHandTracking();
                    loading.classList.add('hidden');
                    flowerHint.classList.add('show');
                    setTimeout(function() {
                        flowerHint.classList.remove('show');
                    }, 3000);
                } catch (error) {
                    console.error('Error starting camera:', error);
                    loading.classList.add('hidden');
                    permissionPrompt.classList.remove('hidden');
                    alert('无法访问摄像头: ' + error.message);
                }
            }

            // 设置手部追踪
            async function setupHandTracking() {
                hands = new Hands({
                    locateFile: function(file) {
                        return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675466160/' + file;
                    }
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.7,
                    minTrackingConfidence: 0.5
                });

                hands.onResults(onResults);

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 1280, height: 720 }
                });
                video.srcObject = stream;
                await video.play();

                mpCamera = new Camera(video, {
                    onFrame: async function() {
                        await hands.send({ image: video });
                    },
                    width: 1280,
                    height: 720
                });

                await mpCamera.start();
            }

            // 手部检测结果处理
            function onResults(results) {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];

                    const palm = landmarks[0];
                    const x = (1 - palm.x) * 2 - 1;
                    const y = -(palm.y * 2 - 1);

                    const handPosition = new THREE.Vector3(x * 1.5, y * 1.2, 0);

                    if (lastHandPosition) {
                        handPosition.lerp(lastHandPosition, 0.3);
                    }
                    lastHandPosition = handPosition.clone();

                    if (!flower) {
                        flower = new Flower(scene, handPosition);
                        flower.setTargetScale(1);
                        if (flower.color) {
                            particleSystem.emit(
                                new THREE.Vector3(handPosition.x, handPosition.y + 0.1, 0),
                                flower.color,
                                25
                            );
                        }
                    }

                    if (flower) {
                        flower.group.position.copy(handPosition);
                    }

                    handNotVisibleCount = 0;
                } else {
                    handNotVisibleCount++;

                    if (handNotVisibleCount > 30) {
                        if (flower) {
                            flower.setTargetScale(0);
                            setTimeout(function() {
                                if (flower && flower.targetScale === 0) {
                                    flower.dispose();
                                    flower = null;
                                }
                            }, 500);
                        }
                    }
                }
            }

            // 动画循环
            function animate() {
                requestAnimationFrame(animate);
                time += 0.016;

                backgroundParticles.update();

                if (flower) {
                    flower.update(time);

                    if (flower.scale === 0 && flower.targetScale === 0) {
                        flower.setOpacity(Math.max(0, flower.opacity - 0.05));
                    }
                }

                particleSystem.update();

                renderer.render(scene, camera);
            }

            // 初始化
            setupThreeJS();
            setupParticles();

            startBtn.addEventListener('click', startCamera);

            animate();
        }
    </script>
</body>
</html>
