<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>语法小课堂 · 英语语法入门</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --primary: #5b8cff;
    --primary-dark: #3f6fe0;
    --text: #1f2330;
    --sub: #6b7280;
    --border: #e8ecf3;
    --green: #2ecc71;
    --red: #ff5a5f;
    --amber: #f5a623;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .page { display: none; padding: 16px 16px 80px; }
  .page.active { display: block; }

  /* 顶部标题 */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(135deg, var(--primary), #7aa3ff);
    color: #fff;
    padding: 18px 16px 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar h1 { font-size: 18px; font-weight: 600; }
  .topbar .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  .progress-pill { font-size: 12px; background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 20px; }

  /* 课程卡 */
  .lesson-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 14px;
    cursor: pointer;
    transition: transform .12s, box-shadow .12s;
  }
  .lesson-card:active { transform: scale(.98); }
  .lesson-card.done { border-color: var(--green); }
  .lesson-icon { font-size: 28px; }
  .lesson-info { flex: 1; }
  .lesson-info .t { font-weight: 600; font-size: 15px; }
  .lesson-info .s { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .lesson-badge {
    font-size: 11px; color: var(--green); font-weight: 600;
    background: #e7f8ee; padding: 3px 8px; border-radius: 10px;
  }

  /* 概念卡 */
  .concept {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; margin-bottom: 12px;
  }
  .concept h3 { font-size: 15px; margin-bottom: 8px; color: var(--primary-dark); }
  .concept p { font-size: 14px; line-height: 1.7; color: #374151; }
  .examples { margin-top: 10px; }
  .example { background: #f4f7ff; border-left: 3px solid var(--primary); padding: 8px 10px; border-radius: 0 8px 8px 0; margin-bottom: 6px; font-size: 13px; }
  .example .en { font-weight: 600; }
  .example .cn { color: var(--sub); font-size: 12px; margin-top: 2px; }

  /* 步骤条 */
  .steps { display: flex; gap: 6px; margin-bottom: 14px; }
  .step { flex: 1; height: 4px; border-radius: 2px; background: var(--border); }
  .step.active { background: var(--primary); }

  /* 按钮 */
  .btn {
    display: block; width: 100%;
    padding: 13px; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    background: var(--primary); color: #fff;
    transition: opacity .12s;
  }
  .btn:active { opacity: .85; }
  .btn.ghost { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
  .btn.gray { background: #eef1f6; color: var(--text); }

  /* 练习 */
  .q-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 16px; }
  .q-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; line-height: 1.5; }
  .opt {
    display: block; width: 100%; text-align: left;
    padding: 12px 14px; margin-bottom: 10px;
    background: #f7f9fc; border: 1.5px solid var(--border);
    border-radius: 10px; font-size: 14px; cursor: pointer;
    transition: all .12s;
  }
  .opt:active { transform: scale(.99); }
  .opt.correct { background: #e7f8ee; border-color: var(--green); color: #1a8f4d; }
  .opt.wrong { background: #fff0f0; border-color: var(--red); color: #c0392b; }
  .opt.disabled { pointer-events: none; }

  /* 语序词块 */
  .word-bank { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .word-chip {
    padding: 9px 14px; background: #eef3ff; border: 1.5px solid var(--primary);
    border-radius: 22px; font-size: 14px; cursor: pointer;
    transition: all .12s;
  }
  .word-chip:active { transform: scale(.95); }
  .word-chip.used { opacity: .3; pointer-events: none; }
  .sentence-build {
    min-height: 48px; padding: 10px; background: #f7f9fc;
    border: 2px dashed var(--border); border-radius: 10px; margin-bottom: 12px;
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  .built-chip { padding: 7px 12px; background: var(--primary); color: #fff; border-radius: 20px; font-size: 13px; }

  /* 标注 */
  .parse-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .parse-word { font-weight: 600; min-width: 70px; font-size: 15px; }
  .label-btn {
    padding: 6px 10px; font-size: 12px; border-radius: 16px;
    border: 1.5px solid var(--border); background: #fff; cursor: pointer;
  }
  .label-btn.on { background: var(--primary); color: #fff; border-color: var(--primary); }

  .feedback { margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 13px; }
  .feedback.ok { background: #e7f8ee; color: #1a8f4d; }
  .feedback.no { background: #fff0f0; color: #c0392b; }

  /* 结果页 */
  .score-circle {
    width: 120px; height: 120px; margin: 20px auto;
    border-radius: 50%; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: conic-gradient(var(--green) var(--deg,0deg), #eef1f6 0);
  }
  .score-inner {
    width: 96px; height: 96px; border-radius: 50%; background: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
  }
  .score-num { font-size: 30px; font-weight: 700; color: var(--green); }
  .score-label { font-size: 11px; color: var(--sub); }

  .back-link { display: inline-block; margin-top: 16px; color: var(--primary); font-size: 14px; cursor: pointer; }
</style>
</head>
<body>

<!-- ============ 首页 ============ -->
<div class="topbar">
  <div>
    <h1>语法小课堂 🧩</h1>
    <div class="sub">每天 5 分钟，搞定英语基础句型</div>
  </div>
  <div class="progress-pill" id="homeProgress">0 / 5</div>
</div>

<!-- 首页 -->
<div class="page active" id="page-home">
  <div id="lessonList"></div>
  <button class="btn gray" style="margin-top:10px" onclick="resetAll()">🔄 重置所有进度</button>
</div>

<!-- 课程页（知识讲解） -->
<div class="page" id="page-lesson">
  <div class="steps">
    <div class="step active" id="s0"></div>
    <div class="step" id="s1"></div>
    <div class="step" id="s2"></div>
    <div class="step" id="s3"></div>
  </div>
  <div id="conceptArea"></div>
  <button class="btn" onclick="startExercises()">开始练习 →</button>
  <span class="back-link" onclick="goHome()">← 返回课程列表</span>
</div>

<!-- 练习页 -->
<div class="page" id="page-exercise">
  <div class="steps">
    <div class="step active" id="es0"></div>
    <div class="step" id="es1"></div>
    <div class="step" id="es2"></div>
  </div>
  <div id="exerciseArea"></div>
</div>

<!-- 结果页 -->
<div class="page" id="page-result">
  <div class="score-circle" id="scoreCircle">
    <div class="score-inner"><div class="score-num" id="scoreNum">0</div><div class="score-label">本课得分</div></div>
  </div>
  <div style="text-align:center;color:var(--sub);font-size:13px;margin-bottom:18px" id="scoreTip">恭喜完成本课！</div>
  <button class="btn" onclick="goHome()">返回课程列表</button>
</div>

<script>
/* ============ 课程数据（精简 5 课） ============ */
const LESSONS = [
  {
    id: "l1", icon: "🧱", title: "最简句型：主谓宾", subtitle: "英语句子的骨架",
    concepts: [
      { title: "什么是 SVO？",
        text: "英语最基础的句子结构是 主语(S) + 谓语(V) + 宾语(O)，就像中文一样。掌握它，就能写出最简单清晰的表达。",
        examples: [{en:"I eat rice.", cn:"我吃饭。"},{en:"She reads books.", cn:"她读书。"}] },
      { title: "语序很重要",
        text: "英语语序相对固定，主语一定要在谓语前面。不像中文可以省略主语，英语一般要有完整的 SVO。",
        examples: [{en:"You like music.", cn:"你喜欢音乐。"}] }
    ],
    exercises: {
      wordOrder: [
        { words: ["I","eat","rice"], answer: "I eat rice", cn:"我吃饭" },
        { words: ["She","reads","books"], answer: "She reads books", cn:"她读书" }
      ],
      parse: [
        { sentence:"I eat rice", words:["I","eat","rice"], labels:["subject","verb","object"] }
      ],
      translate: [
        { question:"他踢足球", options:["He plays football","He football plays","Plays he football","Football he plays"], answer:0 }
      ]
    }
  },
  {
    id: "l2", icon: "⭐", title: "be 动词三兄弟", subtitle: "am / is / are 的用法",
    concepts: [
      { title: "怎么选 be 动词？",
        text: "I 搭配 am，单数(he/she/it/名词单数)搭配 is，复数和 you 搭配 are。这是最基础也最容易错的点。",
        examples: [{en:"I am a student.", cn:"我是学生。"},{en:"She is happy.", cn:"她很开心。"},{en:"They are friends.", cn:"他们是朋友。"}] }
    ],
    exercises: {
      wordOrder: [
        { words:["She","is","happy"], answer:"She is happy", cn:"她开心" }
      ],
      parse: [
        { sentence:"They are friends", words:["They","are","friends"], labels:["subject","verb","object"] }
      ],
      translate: [
        { question:"我是一名老师", options:["I am a teacher","I is a teacher","I are a teacher","Am I teacher"], answer:0 }
      ]
    }
  },
  {
    id: "l3", icon: "📝", title: "一般现在时", subtitle: "习惯与事实",
    concepts: [
      { title: "三单变化",
        text: "主语是第三人称单数(he/she/it)时，动词要加 s 或 es：like→likes, go→goes, watch→watches。这是考试常考点。",
        examples: [{en:"He likes apples.", cn:"他喜欢苹果。"},{en:"She goes to school.", cn:"她去上学。"}] }
    ],
    exercises: {
      wordOrder: [
        { words:["He","likes","apples"], answer:"He likes apples", cn:"他喜欢苹果" }
      ],
      parse: [
        { sentence:"She goes to school", words:["She","goes","school","to"], labels:["subject","verb","object","preposition"] }
      ],
      translate: [
        { question:"她每天都看书", options:["She reads books every day","She read books every day","She reading books","Reads she books"], answer:0 }
      ]
    }
  },
  {
    id: "l4", icon: "🎨", title: "形容词修饰名词", subtitle: "描述事物特征",
    concepts: [
      { title: "形容词放哪？",
        text: "英语中形容词通常放在名词前面：a red apple, a tall boy。这和中文顺序一致，比较好掌握。",
        examples: [{en:"a beautiful flower", cn:"一朵美丽的花"},{en:"The big dog runs.", cn:"大狗在跑。"}] }
    ],
    exercises: {
      wordOrder: [
        { words:["I","have","a","red","car"], answer:"I have a red car", cn:"我有一辆红车" }
      ],
      parse: [
        { sentence:"The big dog runs", words:["The","big","dog","runs"], labels:["modifier","modifier","subject","verb"] }
      ],
      translate: [
        { question:"她是一个漂亮的女孩", options:["She is a beautiful girl","She is a girl beautiful","Beautiful girl is she","She beautiful a girl"], answer:0 }
      ]
    }
  },
  {
    id: "l5", icon: "🚀", title: "综合练习", subtitle: "把前面学到的都用上",
    concepts: [
      { title: "小结",
        text: "记住 SVO 骨架、be 动词三兄弟、三单变化、形容词前置，你已经能写出大量正确的英语句子啦！来挑战综合题吧。",
        examples: [{en:"My good friend likes English.", cn:"我的好朋友喜欢英语。"}] }
    ],
    exercises: {
      wordOrder: [
        { words:["My","good","friend","likes","English"], answer:"My good friend likes English", cn:"我的好朋友喜欢英语" }
      ],
      parse: [
        { sentence:"My good friend likes English", words:["My","good","friend","likes","English"], labels:["modifier","modifier","subject","verb","object"] }
      ],
      translate: [
        { question:"他们是好学生", options:["They are good students","They good are students","Are they good students","They students good"], answer:0 }
      ]
    }
  }
];

/* ============ 存储 ============ */
const KEY = 'eg:progress:v2';
function loadProgress(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
function saveProgress(p){ localStorage.setItem(KEY, JSON.stringify(p)); }
let progress = loadProgress();
function isDone(id){ return (progress.lessonScores||{})[id] >= 60; }

/* ============ 路由 ============ */
function show(id){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }

function goHome(){ renderHome(); show('page-home'); }

function renderHome(){
  const list = document.getElementById('lessonList');
  list.innerHTML = '';
  let done = 0;
  LESSONS.forEach(l=>{
    if(isDone(l.id)) done++;
    const card = document.createElement('div');
    card.className = 'lesson-card' + (isDone(l.id)?' done':'');
    card.onclick = ()=>openLesson(l.id);
    card.innerHTML = `
      <div class="lesson-icon">${l.icon}</div>
      <div class="lesson-info">
        <div class="t">${l.title}</div>
        <div class="s">${l.subtitle}</div>
      </div>
      ${isDone(l.id)?'<div class="lesson-badge">✓ 已完成</div>':'<div class="lesson-badge" style="color:var(--sub);background:#f0f1f5">去学习</div>'}`;
    list.appendChild(card);
  });
  document.getElementById('homeProgress').textContent = `${done} / ${LESSONS.length}`;
}

function resetAll(){
  if(confirm('确定清空所有学习进度？')){
    localStorage.removeItem(KEY);
    progress = {};
    renderHome();
  }
}

/* ============ 课程页 ============ */
let curLesson = null;
function openLesson(id){
  curLesson = LESSONS.find(l=>l.id===id);
  document.getElementById('s0').className='step active';
  for(let i=1;i<4;i++) document.getElementById('s'+i).className='step';
  const area = document.getElementById('conceptArea');
  area.innerHTML = `<h2 style="font-size:18px;margin-bottom:4px">${curLesson.icon} ${curLesson.title}</h2>
    <div style="color:var(--sub);font-size:13px;margin-bottom:16px">${curLesson.subtitle}</div>`;
  curLesson.concepts.forEach(c=>{
    const exHtml = (c.examples||[]).map(e=>`<div class="example"><div class="en">${e.en}</div><div class="cn">${e.cn}</div></div>`).join('');
    const card = document.createElement('div');
    card.className='concept';
    card.innerHTML = `<h3>${c.title}</h3><p>${c.text}</p><div class="examples">${exHtml}</div>`;
    area.appendChild(card);
  });
  show('page-lesson');
}

function startExercises(){
  for(let i=1;i<4;i++) document.getElementById('s'+i).className='step active';
  document.getElementById('s0').className='step active';
  exIdx = 0; exResults = [];
  renderExercise();
  show('page-exercise');
}

/* ============ 练习（三类串行） ============ */
let exIdx = 0, exResults = [];
function getFlatExercises(lesson){
  // 按顺序：wordOrder → parse → translate
  const arr = [];
  (lesson.exercises.wordOrder||[]).forEach(q=>arr.push({type:'wordOrder', q}));
  (lesson.exercises.parse||[]).forEach(q=>arr.push({type:'parse', q}));
  (lesson.exercises.translate||[]).forEach(q=>arr.push({type:'translate', q}));
  return arr;
}

function renderExercise(){
  const flat = getFlatExercises(curLesson);
  // 步骤高亮
  for(let i=0;i<3;i++) document.getElementById('es'+i).className='step';
  if(exIdx < flat.length){
    const t = flat[exIdx].type;
    if(t==='wordOrder') document.getElementById('es0').className='step active';
    if(t==='parse') document.getElementById('es1').className='step active';
    if(t==='translate') document.getElementById('es2').className='step active';
  }
  const area = document.getElementById('exerciseArea');
  if(exIdx >= flat.length){ finishLesson(); return; }
  const item = flat[exIdx];
  const q = item.q;
  if(item.type==='translate') renderTranslate(area, q);
  else if(item.type==='wordOrder') renderWordOrder(area, q);
  else renderParse(area, q);
}

/* —— 选择题 —— */
function renderTranslate(area, q){
  area.innerHTML = `<div class="q-box">
    <div class="q-title">选出正确翻译：<br>「${q.question}」</div>
    <div id="opts"></div>
    <div id="fb"></div>
  </div>`;
  const opts = document.getElementById('opts');
  q.options.forEach((op,i)=>{
    const b = document.createElement('button');
    b.className='opt'; b.textContent=op;
    b.onclick=()=>chooseTranslate(q,i,b);
    opts.appendChild(b);
  });
}
function chooseTranslate(q, picked, btn){
  const btns = document.querySelectorAll('#opts .opt');
  btns.forEach(b=>b.classList.add('disabled'));
  const fb = document.getElementById('fb');
  if(picked===q.answer){
    btn.classList.add('correct'); exResults.push(true);
    fb.innerHTML='<div class="feedback ok">✓ 答对了！</div>';
  }else{
    btn.classList.add('wrong'); btns[q.answer].classList.add('correct');
    exResults.push(false);
    fb.innerHTML='<div class="feedback no">✗ 再想想，正确答案已标出。</div>';
  }
  setTimeout(nextExercise, 1100);
}

/* —— 语序排列 —— */
function renderWordOrder(area, q){
  area.innerHTML = `<div class="q-box">
    <div class="q-title">把单词排成正确句子：<br>（${q.cn}）</div>
    <div class="sentence-build" id="build"></div>
    <div class="word-bank" id="bank"></div>
    <div id="fb"></div>
    <button class="btn ghost" id="clearBtn" style="margin-top:8px" onclick="clearBuild()">清空重排</button>
    <button class="btn" id="submitBtn" style="margin-top:8px;display:none" onclick="checkWordOrder()">提交</button>
  </div>`;
  window._curQ = q; window._built = [];
  const bank = document.getElementById('bank');
  // 打乱
  const shuffled = q.words.map((w,i)=>({w,i})).sort(()=>Math.random()-0.5);
  shuffled.forEach(o=>{
    const chip = document.createElement('div');
    chip.className='word-chip'; chip.textContent=o.w; chip.dataset.i=o.i;
    chip.onclick=()=>addToBuild(chip, o.w);
    bank.appendChild(chip);
  });
}
function addToBuild(chip, w){
  if(chip.classList.contains('used')) return;
  chip.classList.add('used');
  const build = document.getElementById('build');
  const c = document.createElement('span');
  c.className='built-chip'; c.textContent=w;
  c.onclick=()=>{ removeChip(chip, c, w); };
  build.appendChild(c);
  window._built.push(w);
  document.getElementById('submitBtn').style.display='block';
}
function removeChip(srcChip, chip, w){
  srcChip.classList.remove('used');
  chip.remove();
  window._built = window._built.filter(x=>x!==w || (window._built.indexOf(x)===window._built.lastIndexOf(w)&&false));
  rebuildBuilt();
}
function rebuildBuilt(){
  // 简化：直接按当前 built-chip 重建 _built
  window._built = [...document.querySelectorAll('#build .built-chip')].map(e=>e.textContent);
  if(window._built.length===0) document.getElementById('submitBtn').style.display='none';
}
function clearBuild(){
  document.querySelectorAll('#build .built-chip').forEach(c=>c.remove());
  document.querySelectorAll('#bank .word-chip').forEach(c=>c.classList.remove('used'));
  window._built=[];
  document.getElementById('submitBtn').style.display='none';
}
function checkWordOrder(){
  const built = [...document.querySelectorAll('#build .built-chip')].map(e=>e.textContent).join(' ');
  const fb = document.getElementById('fb');
  const ok = built === window._curQ.answer;
  exResults.push(ok);
  document.getElementById('submitBtn').style.display='none';
  document.querySelectorAll('#bank .word-chip').forEach(c=>c.classList.add('disabled'));
  if(ok) fb.innerHTML=`<div class="feedback ok">✓ 太棒了！「${window._curQ.answer}」</div>`;
  else fb.innerHTML=`<div class="feedback no">✗ 正确句子：${window._curQ.answer}</div>`;
  setTimeout(nextExercise, 1400);
}

/* —— 拆句标注 —— */
const LABELS = [
  {k:'subject',n:'主语'},{k:'verb',n:'谓语'},{k:'object',n:'宾语'},
  {k:'modifier',n:'修饰语'},{k:'preposition',n:'介词'}
];
function renderParse(area, q){
  area.innerHTML = `<div class="q-box">
    <div class="q-title">为每个词标注成分：<br>「${q.sentence}」<br><span style="font-size:12px;color:var(--sub)">点词循环切换标签，再提交</span></div>
    <div id="parseRows"></div>
    <div id="fb"></div>
    <button class="btn" id="submitParse" style="margin-top:10px" onclick="checkParse()">提交</button>
  </div>`;
  window._parseQ = q; window._userLabels = q.words.map(()=>'');
  const rows = document.getElementById('parseRows');
  q.words.forEach((w,i)=>{
    const row = document.createElement('div'); row.className='parse-row';
    row.innerHTML = `<span class="parse-word">${w}</span><button class="label-btn" data-i="${i}" onclick="cycleLabel(${i})">点此标注</button>`;
    rows.appendChild(row);
  });
}
function cycleLabel(i){
  const cur = window._userLabels[i];
  let idx = LABELS.findIndex(l=>l.k===cur);
  idx = (idx+1) % (LABELS.length+1);
  if(idx===LABELS.length){ window._userLabels[i]=''; }
  else { window._userLabels[i]=LABELS[idx].k; }
  const btn = document.querySelector(`.label-btn[data-i="${i}"]`);
  const lab = LABELS.find(l=>l.k===window._userLabels[i]);
  if(lab){ btn.textContent=lab.n; btn.classList.add('on'); }
  else { btn.textContent='点此标注'; btn.classList.remove('on'); }
}
function checkParse(){
  const q = window._parseQ;
  const ok = q.labels.every((l,i)=>window._userLabels[i]===l);
  exResults.push(ok);
  const fb = document.getElementById('fb');
  document.getElementById('submitParse').style.display='none';
  if(ok) fb.innerHTML=`<div class="feedback ok">✓ 全部标注正确！</div>`;
  else {
    let html='<div class="feedback no">✗ 正确答案：<br>';
    q.words.forEach((w,i)=>{
      const lab = LABELS.find(l=>l.k===q.labels[i]);
      html += `${w}=<b>${lab?lab.n:q.labels[i]}</b> `;
    });
    html+='</div>';
    fb.innerHTML=html;
  }
  setTimeout(nextExercise, 1800);
}

function nextExercise(){ exIdx++; renderExercise(); }

/* ============ 完成页 ============ */
function finishLesson(){
  const total = exResults.length;
  const right = exResults.filter(Boolean).length;
  const score = total? Math.round(right/total*100) : 0;
  // 存进度
  progress.lessonScores = progress.lessonScores||{};
  // 取最高分
  const prev = progress.lessonScores[curLesson.id]||0;
  progress.lessonScores[curLesson.id] = Math.max(prev, score);
  saveProgress(progress);
  // 渲染
  document.getElementById('scoreNum').textContent = score;
  const circle = document.getElementById('scoreCircle');
  const deg = (score/100)*360;
  circle.style.setProperty('--deg', deg+'deg');
  const num = document.getElementById('scoreNum');
  if(score>=80){ num.style.color='var(--green)'; document.getElementById('scoreTip').textContent='太棒了，这课已经掌握！'; }
  else if(score>=60){ num.style.color='var(--amber)'; document.getElementById('scoreTip').textContent='不错，再多练几次更扎实～'; }
  else { num.style.color='var(--red)'; document.getElementById('scoreTip').textContent='没关系，回看讲解再来一次吧！'; }
  show('page-result');
}

/* 启动 */
renderHome();
</script>
