<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RegexViz - 正则表达式可视化工具</title>
<style>
/* ========== 全局变量与重置 ========== */
:root {
  --bg-primary: #0f0f1a;
  --bg-secondary: #1a1a2e;
  --bg-tertiary: #16213e;
  --bg-card: #1e1e36;
  --bg-input: #12122a;
  --border-color: #2a2a4a;
  --border-active: #6c5ce7;
  --text-primary: #e8e8f0;
  --text-secondary: #a0a0c0;
  --text-muted: #6a6a8a;
  --accent-purple: #6c5ce7;
  --accent-blue: #4facfe;
  --accent-cyan: #00f2fe;
  --accent-green: #00e676;
  --accent-orange: #ff9100;
  --accent-pink: #ff6b9d;
  --accent-red: #ff5252;
  --accent-yellow: #ffd740;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ========== 背景动效 ========== */
.bg-grid {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(circle at 20% 50%, rgba(108,92,231,0.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(79,172,254,0.06) 0%, transparent 50%),
    radial-gradient(circle at 50% 80%, rgba(0,242,254,0.04) 0%, transparent 50%);
}

/* ========== 导航栏 ========== */
.navbar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; height: 56px;
  background: rgba(15,15,26,0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-color);
}

.nav-brand {
  display: flex; align-items: center; gap: 10px;
  font-size: 20px; font-weight: 700;
  background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}

.nav-brand svg { width: 28px; height: 28px; }

.nav-actions { display: flex; gap: 8px; }

.nav-btn {
  padding: 6px 14px; border: 1px solid var(--border-color);
  border-radius: var(--radius-sm); background: var(--bg-secondary);
  color: var(--text-secondary); font-size: 13px; cursor: pointer;
  transition: all var(--transition);
}
.nav-btn:hover {
  border-color: var(--accent-purple); color: var(--text-primary);
  background: rgba(108,92,231,0.1);
}

/* ========== 主布局 ========== */
.main-layout {
  position: relative; z-index: 1;
  display: grid;
  grid-template-columns: 320px 1fr 300px;
  grid-template-rows: 1fr auto;
  gap: 0;
  height: calc(100vh - 56px);
}

/* ========== 左侧面板 ========== */
.left-panel {
  display: flex; flex-direction: column;
  border-right: 1px solid var(--border-color);
  background: var(--bg-secondary);
  overflow: hidden;
}

.panel-section {
  display: flex; flex-direction: column;
  border-bottom: 1px solid var(--border-color);
}

.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  font-size: 12px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.8px; color: var(--text-muted);
  background: rgba(0,0,0,0.15);
}

.panel-header .badge {
  padding: 2px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 500;
  background: rgba(108,92,231,0.2); color: var(--accent-purple);
}

/* 正则输入区 */
.regex-input-wrap {
  position: relative; padding: 12px 16px;
}

.regex-input-container {
  position: relative;
  border: 2px solid var(--border-color);
  border-radius: var(--radius-md);
  background: var(--bg-input);
  transition: border-color var(--transition), box-shadow var(--transition);
  overflow: hidden;
}

.regex-input-container:focus-within {
  border-color: var(--accent-purple);
  box-shadow: 0 0 0 3px rgba(108,92,231,0.15);
}

.regex-input-container.error {
  border-color: var(--accent-red);
  box-shadow: 0 0 0 3px rgba(255,82,82,0.15);
}

.regex-slash {
  position: absolute; top: 50%; transform: translateY(-50%);
  font-size: 18px; font-weight: 300; color: var(--text-muted);
  user-select: none;
}
.regex-slash.left { left: 12px; }
.regex-slash.right { right: 50px; }

.regex-input {
  width: 100%; padding: 10px 50px 10px 28px;
  border: none; outline: none;
  background: transparent; color: var(--text-primary);
  font-family: 'Consolas', 'Fira Code', monospace;
  font-size: 15px; letter-spacing: 0.5px;
}

.regex-flags {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  display: flex; gap: 4px;
}

.flag-btn {
  width: 26px; height: 26px;
  border: 1px solid var(--border-color); border-radius: 4px;
  background: transparent; color: var(--text-muted);
  font-size: 12px; font-family: monospace; cursor: pointer;
  transition: all var(--transition);
  display: flex; align-items: center; justify-content: center;
}
.flag-btn.active {
  background: rgba(108,92,231,0.2); color: var(--accent-purple);
  border-color: var(--accent-purple);
}

.error-msg {
  padding: 6px 16px 10px;
  font-size: 12px; color: var(--accent-red);
  display: none;
}
.error-msg.show { display: block; }

/* 语法高亮层 */
.regex-highlight-layer {
  position: absolute; inset: 0;
  padding: 10px 50px 10px 28px;
  font-family: 'Consolas', 'Fira Code', monospace;
  font-size: 15px; letter-spacing: 0.5px;
  pointer-events: none; white-space: pre;
  overflow: hidden; color: transparent;
}

/* 测试文本区 */
.test-textarea {
  flex: 1; min-height: 120px;
  padding: 12px 16px;
  border: none; outline: none; resize: none;
  background: var(--bg-input); color: var(--text-primary);
  font-family: 'Consolas', 'Fira Code', monospace;
  font-size: 14px; line-height: 1.7;
  border-top: 1px solid var(--border-color);
}
.test-textarea::placeholder { color: var(--text-muted); }

/* 匹配高亮层 */
.test-text-wrap {
  position: relative; flex: 1; display: flex; flex-direction: column;
}

.test-highlight-layer {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 12px 16px;
  font-family: 'Consolas', 'Fira Code', monospace;
  font-size: 14px; line-height: 1.7;
  pointer-events: none; white-space: pre-wrap;
  word-wrap: break-word; overflow: auto;
  color: transparent;
}

/* ========== 中间可视化区域 ========== */
.center-panel {
  display: flex; flex-direction: column;
  background: var(--bg-primary);
  overflow: hidden;
}

.viz-tabs {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--border-color);
  background: rgba(0,0,0,0.15);
}

.viz-tab {
  padding: 10px 20px;
  font-size: 13px; font-weight: 500;
  color: var(--text-muted); cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all var(--transition);
  background: none; border-top: none; border-left: none; border-right: none;
}
.viz-tab:hover { color: var(--text-secondary); }
.viz-tab.active {
  color: var(--accent-cyan);
  border-bottom-color: var(--accent-cyan);
}

.viz-content {
  flex: 1; overflow: auto; position: relative;
}

.viz-placeholder {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100%; gap: 16px;
  color: var(--text-muted);
}
.viz-placeholder svg { width: 64px; height: 64px; opacity: 0.3; }
.viz-placeholder p { font-size: 14px; }

/* 解析树 SVG */
.parse-tree-svg {
  width: 100%; height: 100%;
  padding: 20px;
}

.tree-node {
  cursor: pointer;
  transition: opacity var(--transition);
}
.tree-node:hover { opacity: 0.85; }

.tree-node-rect {
  rx: 8; ry: 8;
  transition: filter var(--transition);
}
.tree-node:hover .tree-node-rect {
  filter: brightness(1.2);
}

.tree-node-text {
  font-family: 'Consolas', monospace;
  font-size: 12px; fill: white;
  text-anchor: middle; dominant-baseline: central;
  pointer-events: none;
}

.tree-node-label {
  font-size: 10px; fill: rgba(255,255,255,0.6);
  text-anchor: middle; dominant-baseline: central;
  pointer-events: none;
}

.tree-edge {
  stroke: var(--border-color); stroke-width: 1.5;
  fill: none;
}

/* 匹配动画区 */
.match-animation {
  padding: 24px;
  display: flex; flex-direction: column; gap: 20px;
}

.match-text-line {
  font-family: 'Consolas', monospace;
  font-size: 16px; line-height: 2;
  letter-spacing: 1px;
  position: relative;
}

.match-char {
  display: inline-block; padding: 2px 1px;
  position: relative; transition: all 0.3s ease;
  border-radius: 2px;
}

.match-char.matched {
  background: rgba(108,92,231,0.3);
  color: var(--accent-cyan);
}
.match-char.current {
  background: rgba(0,242,254,0.2);
  box-shadow: 0 0 8px rgba(0,242,254,0.4);
  animation: pulse-char 0.6s ease infinite;
}
.match-char.group-1 { background: rgba(79,172,254,0.3); }
.match-char.group-2 { background: rgba(0,230,118,0.3); }
.match-char.group-3 { background: rgba(255,145,0,0.3); }
.match-char.group-4 { background: rgba(255,107,157,0.3); }

@keyframes pulse-char {
  0%, 100% { box-shadow: 0 0 4px rgba(0,242,254,0.3); }
  50% { box-shadow: 0 0 12px rgba(0,242,254,0.6); }
}

.animation-controls {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  background: var(--bg-card);
  border-radius: var(--radius-md);
}

.anim-btn {
  width: 36px; height: 36px;
  border: 1px solid var(--border-color); border-radius: var(--radius-sm);
  background: var(--bg-secondary); color: var(--text-primary);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all var(--transition); font-size: 16px;
}
.anim-btn:hover {
  border-color: var(--accent-purple);
  background: rgba(108,92,231,0.1);
}
.anim-btn:disabled {
  opacity: 0.4; cursor: not-allowed;
}

.anim-progress {
  flex: 1; height: 4px;
  background: var(--bg-input); border-radius: 2px;
  overflow: hidden;
}
.anim-progress-bar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
  border-radius: 2px; transition: width 0.3s ease;
}

.anim-speed {
  font-size: 12px; color: var(--text-muted);
  min-width: 40px; text-align: center;
}

/* ========== 右侧面板 ========== */
.right-panel {
  display: flex; flex-direction: column;
  border-left: 1px solid var(--border-color);
  background: var(--bg-secondary);
  overflow: hidden;
}

.match-result-list {
  flex: 1; overflow-y: auto; padding: 12px;
  display: flex; flex-direction: column; gap: 8px;
}

.match-item {
  padding: 10px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
}
.match-item:hover {
  border-color: var(--accent-purple);
  background: rgba(108,92,231,0.05);
}

.match-item-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 6px;
}

.match-index {
  font-size: 11px; font-weight: 600;
  padding: 2px 8px; border-radius: 10px;
  background: rgba(108,92,231,0.2); color: var(--accent-purple);
}

.match-range {
  font-size: 11px; color: var(--text-muted);
}

.match-value {
  font-family: 'Consolas', monospace;
  font-size: 13px; color: var(--accent-cyan);
  word-break: break-all;
}

.group-list {
  margin-top: 8px; padding-top: 8px;
  border-top: 1px solid var(--border-color);
  display: flex; flex-direction: column; gap: 4px;
}

.group-item {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px;
}

.group-label {
  padding: 1px 6px; border-radius: 3px;
  font-weight: 600; font-size: 10px;
}
.group-label.g0 { background: rgba(108,92,231,0.2); color: var(--accent-purple); }
.group-label.g1 { background: rgba(79,172,254,0.2); color: var(--accent-blue); }
.group-label.g2 { background: rgba(0,230,118,0.2); color: var(--accent-green); }
.group-label.g3 { background: rgba(255,145,0,0.2); color: var(--accent-orange); }
.group-label.g4 { background: rgba(255,107,157,0.2); color: var(--accent-pink); }

.group-value {
  font-family: 'Consolas', monospace;
  color: var(--text-secondary);
}

.no-match {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100%; gap: 8px; color: var(--text-muted);
  font-size: 13px;
}
.no-match svg { width: 40px; height: 40px; opacity: 0.3; }

/* ========== 底部控制面板 ========== */
.bottom-panel {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px;
  padding: 10px 20px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border-color);
  overflow-x: auto;
}

.control-group {
  display: flex; align-items: center; gap: 8px;
}

.control-label {
  font-size: 12px; color: var(--text-muted);
  white-space: nowrap;
}

.toggle-switch {
  position: relative; width: 36px; height: 20px;
  background: var(--bg-input); border-radius: 10px;
  cursor: pointer; transition: background var(--transition);
  border: 1px solid var(--border-color);
}
.toggle-switch.active {
  background: rgba(108,92,231,0.3);
  border-color: var(--accent-purple);
}
.toggle-switch::after {
  content: ''; position: absolute;
  top: 2px; left: 2px;
  width: 14px; height: 14px;
  background: var(--text-muted); border-radius: 50%;
  transition: all var(--transition);
}
.toggle-switch.active::after {
  left: 18px;
  background: var(--accent-purple);
}

.divider {
  width: 1px; height: 24px;
  background: var(--border-color);
}

/* ========== 模板库弹窗 ========== */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.3s ease;
}
.modal-overlay.show {
  display: flex; opacity: 1;
}

.modal {
  width: 90%; max-width: 640px; max-height: 80vh;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column;
  transform: translateY(20px);
  transition: transform 0.3s ease;
}
.modal-overlay.show .modal { transform: translateY(0); }

.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-color);
}
.modal-header h3 {
  font-size: 16px; font-weight: 600;
  background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.modal-close {
  width: 32px; height: 32px;
  border: none; border-radius: var(--radius-sm);
  background: transparent; color: var(--text-muted);
  cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.modal-close:hover { background: rgba(255,82,82,0.1); color: var(--accent-red); }

.modal-body {
  flex: 1; overflow-y: auto; padding: 16px 20px;
  display: flex; flex-direction: column; gap: 10px;
}

.template-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  cursor: pointer; transition: all var(--transition);
}
.template-item:hover {
  border-color: var(--accent-purple);
  background: rgba(108,92,231,0.05);
}

.template-icon {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(108,92,231,0.15); border-radius: var(--radius-sm);
  font-size: 16px;
}

.template-info { flex: 1; }
.template-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.template-desc { font-size: 11px; color: var(--text-muted); }
.template-regex {
  font-family: 'Consolas', monospace;
  font-size: 11px; color: var(--accent-cyan);
  padding: 2px 8px;
  background: rgba(0,242,254,0.08);
  border-radius: 3px;
}

/* ========== 历史记录 ========== */
.history-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  cursor: pointer; transition: all var(--transition);
}
.history-item:hover {
  border-color: var(--accent-purple);
}
.history-regex {
  font-family: 'Consolas', monospace;
  font-size: 12px; color: var(--accent-cyan);
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.history-time {
  font-size: 10px; color: var(--text-muted);
  white-space: nowrap;
}
.history-delete {
  width: 20px; height: 20px;
  border: none; border-radius: 3px;
  background: transparent; color: var(--text-muted);
  cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.history-delete:hover { background: rgba(255,82,82,0.1); color: var(--accent-red); }

/* ========== 学习提示 ========== */
.tip-card {
  padding: 12px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  border-left: 3px solid var(--accent-purple);
}
.tip-title {
  font-size: 12px; font-weight: 600;
  color: var(--accent-purple); margin-bottom: 4px;
}
.tip-content {
  font-size: 12px; color: var(--text-secondary);
  line-height: 1.5;
}
.tip-code {
  font-family: 'Consolas', monospace;
  color: var(--accent-cyan);
  background: rgba(0,242,254,0.08);
  padding: 1px 4px; border-radius: 2px;
}

/* ========== 统计信息 ========== */
.stats-bar {
  display: flex; gap: 16px; padding: 8px 16px;
  background: rgba(0,0,0,0.15);
  border-top: 1px solid var(--border-color);
}

.stat-item {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text-muted);
}
.stat-value {
  color: var(--accent-cyan); font-weight: 600;
  font-family: 'Consolas', monospace;
}

/* ========== 滚动条 ========== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border-color); border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ========== 响应式 ========== */
@media (max-width: 1024px) {
  .main-layout {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto auto;
    height: auto; min-height: calc(100vh - 56px);
  }
  .left-panel { border-right: none; border-bottom: 1px solid var(--border-color); }
  .right-panel { border-left: none; border-top: 1px solid var(--border-color); }
  .test-textarea { min-height: 80px; }
}

/* ========== 动画 ========== */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.fade-in { animation: fadeIn 0.3s ease forwards; }

/* 匹配高亮动画 */
@keyframes matchGlow {
  0% { box-shadow: 0 0 0 rgba(108,92,231,0); }
  50% { box-shadow: 0 0 12px rgba(108,92,231,0.4); }
  100% { box-shadow: 0 0 0 rgba(108,92,231,0); }
}

.match-highlight-anim { animation: matchGlow 0.6s ease; }

/* 浮动提示 */
.tooltip {
  position: fixed; z-index: 300;
  padding: 6px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  font-size: 12px; color: var(--text-primary);
  box-shadow: var(--shadow-md);
  pointer-events: none;
  opacity: 0; transition: opacity 0.15s ease;
}
.tooltip.show { opacity: 1; }
</style>
</head>
<body>

<!-- 背景 -->
<div class="bg-grid"></div>

<!-- 导航栏 -->
<nav class="navbar">
  <div class="nav-brand">
    <svg viewBox="0 0 28 28" fill="none">
      <rect x="2" y="2" width="24" height="24" rx="6" stroke="url(#navGrad)" stroke-width="2"/>
      <text x="14" y="18" text-anchor="middle" fill="url(#navGrad)" font-size="14" font-weight="bold" font-family="monospace">.*</text>

// ========== 学习提示 ==========
const tips = [

  { title: '预定义类', content: '<span class="tip-code">\\d</span> 数字，<span class="tip-code">\\w</span> 单词字符，<span class="tip-code">\\s</span> 空白字符。大写为反义，如 <span class="tip-code">\\D</span> 非数字。' },
  { title: '量词', content: '<span class="tip-code">*</span> 0次或多次，<span class="tip-code">+</span> 1次或多次，<span class="tip-code">?</span> 0次或1次，<span class="tip-code">{n,m}</span> n到m次。加 <span class="tip-code">?</span> 变为惰性匹配。' },
  { title: '分组与捕获', content: '<span class="tip-code">(abc)</span> 捕获分组，<span class="tip-code">(?:abc)</span> 非捕获分组，<span class="tip-code">(?=abc)</span> 正向先行断言，<span class="tip-code">(?!abc)</span> 负向先行断言。' },
  { title: '锚点', content: '<span class="tip-code">^</span> 匹配开头，<span class="tip-code">$</span> 匹配结尾，<span class="tip-code">\\b</span> 匹配单词边界。' },
  { title: '特殊字符转义', content: '元字符 <span class="tip-code">. * + ? ^ $ | \\ ( ) [ ] { }</span> 需要用 <span class="tip-code">\\</span> 转义才能匹配字面量。' },
  { title: '修饰符', content: '<span class="tip-code">g</span> 全局匹配，<span class="tip-code">i</span> 忽略大小写，<span class="tip-code">m</span> 多行模式，<span class="tip-code">s</span> dotAll模式。' },
  { title: '反向引用', content: '使用 <span class="tip-code">\\1</span> 引用第1个捕获分组的内容，可用于匹配重复单词如 <span class="tip-code">(\\w+)\\s+\\1</span>。' },
];

// ========== 正则表达式解析器 ==========
class RegexParser {
  constructor(pattern) {
    this.pattern = pattern;
    this.pos = 0;
    this.groupIndex = 0;
  }

  parse() {
    if (!this.pattern) return null;
    try {
      this.pos = 0;
      this.groupIndex = 0;
      const result = this.parseAlternation();
      if (this.pos < this.pattern.length) {
        throw new Error(`位置 ${this.pos} 处有意外的字符 "${this.pattern[this.pos]}"`);
      }
      return result;
    } catch (e) {
      return { type: 'error', message: e.message, pos: this.pos };
    }
  }

  peek() { return this.pos < this.pattern.length ? this.pattern[this.pos] : null; }
  advance() { return this.pattern[this.pos++]; }

  parseAlternation() {
    const branches = [this.parseSequence()];
    while (this.peek() === '|') {
      this.advance();
      branches.push(this.parseSequence());
    }
    if (branches.length === 1) return branches[0];
    return { type: 'alternation', children: branches };
  }

  parseSequence() {
    const children = [];
    while (this.peek() !== null && this.peek() !== '|' && this.peek() !== ')') {
      children.push(this.parseQuantified());
    }
    if (children.length === 0) return { type: 'empty' };
    if (children.length === 1) return children[0];
    return { type: 'sequence', children };
  }

  parseQuantified() {
    let node = this.parseAtom();
    const q = this.peek();
    if (q === '*' || q === '+' || q === '?') {
      const quantifier = this.advance();
      let greedy = true;
      if (this.peek() === '?') { this.advance(); greedy = false; }
      node = { type: 'quantifier', child: node, quantifier, greedy, min: quantifier === '+' ? 1 : 0, max: quantifier === '?' ? 1 : Infinity };
    } else if (q === '{') {
      const saved = this.pos;
      this.advance();
      const numStr = this.parseNumber();
      if (this.peek() === '}') {
        this.advance();
        let min = parseInt(numStr), max = min;
        node = { type: 'quantifier', child: node, quantifier: `{${numStr}}`, greedy: true, min, max };
      } else if (this.peek() === ',') {
        this.advance();
        const maxStr = this.parseNumber();
        if (this.peek() === '}') {
          this.advance();
          const min = parseInt(numStr);
          const max = maxStr ? parseInt(maxStr) : Infinity;
          node = { type: 'quantifier', child: node, quantifier: maxStr ? `{${numStr},${maxStr}}` : `{${numStr},}`, greedy: true, min, max };
        } else {
          this.pos = saved;
        }
      } else {
        this.pos = saved;
      }
      // 惰性修饰
      if (node.type === 'quantifier' && this.peek() === '?') {
        this.advance();
        node.greedy = false;
      }
    }
    return node;
  }

  parseNumber() {
    let s = '';
    while (this.peek() && this.peek() >= '0' && this.peek() <= '9') {
      s += this.advance();
    }
    return s;
  }

  parseAtom() {
    const ch = this.peek();
    if (ch === null) throw new Error('意外的结束');

    if (ch === '(') return this.parseGroup();
    if (ch === '[') return this.parseCharClass();
    if (ch === '^') { this.advance(); return { type: 'anchor', value: '^' }; }
    if (ch === '$') { this.advance(); return { type: 'anchor', value: '$' }; }
    if (ch === '.') { this.advance(); return { type: 'dot' }; }
    if (ch === '\\') return this.parseEscape();

    this.advance();
    return { type: 'literal', value: ch };
  }

  parseGroup() {
    this.advance(); // 跳过 (
    let capture = true;
    let name = null;
    let assertion = null;

    if (this.peek() === '?') {
      this.advance();
      const next = this.peek();
      if (next === ':') { this.advance(); capture = false; }
      else if (next === '=') { this.advance(); capture = false; assertion = 'positive-lookahead'; }
      else if (next === '!') { this.advance(); capture = false; assertion = 'negative-lookahead'; }
      else if (next === '<') {
        this.advance();
        const next2 = this.peek();
        if (next2 === '=') { this.advance(); capture = false; assertion = 'positive-lookbehind'; }
        else if (next2 === '!') { this.advance(); capture = false; assertion = 'negative-lookbehind'; }
        else {
          // 命名捕获组 (?<name>...)
          let groupName = '';
          while (this.peek() && this.peek() !== '>') { groupName += this.advance(); }
          if (this.peek() === '>') this.advance();
          name = groupName;
        }
      } else {
        throw new Error(`无效的分组修饰符 "?${next || ''}"`);
      }
    }

    const index = capture ? ++this.groupIndex : null;
    const child = this.parseAlternation();

    if (this.peek() !== ')') throw new Error('缺少闭合括号 ")"');
    this.advance();

    return { type: 'group', child, capture, index, name, assertion };
  }

  parseCharClass() {
    this.advance(); // 跳过 [
    let negated = false;
    if (this.peek() === '^') { this.advance(); negated = true; }

    const items = [];
    // 允许 ] 出现在首位作为字面量
    let first = true;
    while (this.peek() !== ']' || first) {
      first = false;
      if (this.peek() === null) throw new Error('字符类缺少闭合 "]"');
      if (this.peek() === '\\') {
        const esc = this.parseEscapeInClass();
        if (this.peek() === '-' && this.pattern[this.pos + 1] !== ']') {
          this.advance();
          const end = this.parseEscapeInClass();
          items.push({ type: 'range', start: esc.value, end: end.value });
        } else {
          items.push(esc);
        }
      } else {
        const ch = this.advance();
        if (this.peek() === '-' && this.pattern[this.pos + 1] !== ']') {
          this.advance();
          const end = this.advance();
          items.push({ type: 'range', start: ch, end: end });
        } else {
          items.push({ type: 'literal', value: ch });
        }
      }
    }
    this.advance(); // 跳过 ]
    return { type: 'charClass', negated, items };
  }

  parseEscapeInClass() {
    this.advance(); // 跳过 \
    const ch = this.advance();
    const shorthands = { d: '\\d', D: '\\D', w: '\\w', W: '\\W', s: '\\s', S: '\\S' };
    if (shorthands[ch]) return { type: 'shorthand', value: shorthands[ch] };
    return { type: 'literal', value: ch };
  }

  parseEscape() {
    this.advance(); // 跳过 \
    const ch = this.advance();
    const shorthands = { d: '\\d', D: '\\D', w: '\\w', W: '\\W', s: '\\s', S: '\\S', b: '\\b', B: '\\B' };
    if (shorthands[ch]) {
      if (ch === 'b' || ch === 'B') return { type: 'anchor', value: shorthands[ch] };
      return { type: 'shorthand', value: shorthands[ch] };
    }
    if (ch >= '1' && ch <= '9') return { type: 'backreference', value: parseInt(ch) };
    if (ch === 'n') return { type: 'literal', value: '\n' };
    if (ch === 't') return { type: 'literal', value: '\t' };
    if (ch === 'r') return { type: 'literal', value: '\r' };
    return { type: 'literal', value: ch };
  }
}

// ========== 解析树可视化 ==========
function renderParseTree(tree) {
  const svg = document.getElementById('parseTreeSvg');
  if (!tree || tree.type === 'error') {
    svg.style.display = 'none';
    document.getElementById('vizPlaceholder').style.display = 'flex';
    return;
  }

  svg.style.display = 'block';
  document.getElementById('vizPlaceholder').style.display = 'none';

  // 计算树的布局
  const layout = computeTreeLayout(tree);
  const width = Math.max(layout.width + 60, 400);
  const height = layout.height + 80;

  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  svg.innerHTML = '';

  // 绘制连线
  drawTreeEdges(svg, tree, 30, 30);
  // 绘制节点
  drawTreeNodes(svg, tree, 30, 30);
}

function computeTreeLayout(node) {
  if (!node) return { width: 0, height: 0 };

  const nodeWidth = 100;
  const nodeHeight = 40;
  const hGap = 16;
  const vGap = 50;

  const children = getNodeChildren(node);
  if (children.length === 0) {
    return { width: nodeWidth, height: nodeHeight };
  }

  let totalWidth = 0;
  let maxChildHeight = 0;
  const childLayouts = [];

  for (const child of children) {
    const layout = computeTreeLayout(child);
    childLayouts.push(layout);
    totalWidth += layout.width;
    maxChildHeight = Math.max(maxChildHeight, layout.height);
  }
  totalWidth += (children.length - 1) * hGap;

  return {
    width: Math.max(totalWidth, nodeWidth),
    height: nodeHeight + vGap + maxChildHeight,
    childLayouts
  };
}

function getNodeChildren(node) {
  if (!node) return [];
  switch (node.type) {
    case 'alternation': return node.children || [];
    case 'sequence': return node.children || [];
    case 'quantifier': return [node.child];
    case 'group': return [node.child];
    case 'charClass': return node.items || [];
    default: return [];
  }
}

function getNodeLabel(node) {
  if (!node) return '?';
  switch (node.type) {
    case 'literal': return node.value === ' ' ? '␣' : node.value;
    case 'dot': return '.';
    case 'anchor': return node.value;
    case 'shorthand': return node.value;
    case 'quantifier': return node.quantifier + (node.greedy ? '' : '?');
    case 'group': {
      let prefix = '(';
      if (node.assertion === 'positive-lookahead') prefix = '(?=';
      else if (node.assertion === 'negative-lookahead') prefix = '(?!';
      else if (node.assertion === 'positive-lookbehind') prefix = '(?<=';
      else if (node.assertion === 'negative-lookbehind') prefix = '(?<!';
      else if (!node.capture) prefix = '(?:';
      else if (node.name) prefix = `(?<${node.name}>`;
      return prefix + '...)';
    }
    case 'charClass': return `[${node.negated ? '^' : ''}...]`;
    case 'alternation': return '|';
    case 'sequence': return '···';
    case 'empty': return '∅';
    case 'backreference': return `\\${node.value}`;
    case 'range': return `${node.start}-${node.end}`;
    case 'error': return '✗';
    default: return node.type;
  }
}

function getNodeColor(node) {
  if (!node) return '#6a6a8a';
  switch (node.type) {
    case 'literal': return '#4facfe';
    case 'dot': return '#00f2fe';
    case 'anchor': return '#ff9100';
    case 'shorthand': return '#00e676';
    case 'quantifier': return '#ff6b9d';
    case 'group': return '#6c5ce7';
    case 'charClass': return '#ffd740';
    case 'alternation': return '#ff5252';
    case 'sequence': return '#a0a0c0';
    case 'backreference': return '#e040fb';
    case 'range': return '#ffd740';
    default: return '#6a6a8a';
  }
}

function getNodeSubLabel(node) {
  if (!node) return '';
  switch (node.type) {
    case 'literal': return '字面量';
    case 'dot': return '任意字符';
    case 'anchor': return '锚点';
    case 'shorthand': return '预定义';
    case 'quantifier': return node.greedy ? '贪婪量词' : '惰性量词';
    case 'group': {
      if (node.assertion) return '断言';
      if (!node.capture) return '非捕获组';
      if (node.name) return `命名组<${node.name}>`;
      return `捕获组 #${node.index}`;
    }
    case 'charClass': return node.negated ? '排除字符类' : '字符类';
    case 'alternation': return '选择';
    case 'sequence': return '序列';
    case 'backreference': return '反向引用';
    case 'range': return '范围';
    default: return '';
  }
}

function drawTreeEdges(svg, node, x, y) {
  const children = getNodeChildren(node);
  if (children.length === 0) return;

  const nodeWidth = 100;
  const nodeHeight = 40;
  const hGap = 16;
  const vGap = 50;

  // 计算子节点位置
  const childLayouts = children.map(c => computeTreeLayout(c));
  let totalWidth = childLayouts.reduce((s, l) => s + l.width, 0) + (children.length - 1) * hGap;
  let startX = x + (Math.max(totalWidth, nodeWidth) - totalWidth) / 2;

  for (let i = 0; i < children.length; i++) {
    const childX = startX;
    const childY = y + nodeHeight + vGap;

    // 绘制连线
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const parentCenterX = x + nodeWidth / 2;
    const parentBottomY = y + nodeHeight;
    const childCenterX = childX + childLayouts[i].width / 2;
    const childTopY = childY;

    const midY = (parentBottomY + childTopY) / 2;
    line.setAttribute('d', `M${parentCenterX},${parentBottomY} C${parentCenterX},${midY} ${childCenterX},${midY} ${childCenterX},${childTopY}`);
    line.setAttribute('class', 'tree-edge');
    svg.appendChild(line);

    drawTreeEdges(svg, children[i], childX, childY);
    startX += childLayouts[i].width + hGap;
  }
}

function drawTreeNodes(svg, node, x, y) {
  const children = getNodeChildren(node);
  const nodeWidth = 100;
  const nodeHeight = 40;
  const hGap = 16;
  const vGap = 50;

  // 计算子节点位置
  const childLayouts = children.map(c => computeTreeLayout(c));
  let totalWidth = childLayouts.reduce((s, l) => s + l.width, 0) + (children.length - 1) * hGap;
  let startX = x + (Math.max(totalWidth, nodeWidth) - totalWidth) / 2;

  // 绘制当前节点
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', 'tree-node');

  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  const nodeX = x + (Math.max(totalWidth, nodeWidth) - nodeWidth) / 2;
  rect.setAttribute('x', nodeX);
  rect.setAttribute('y', y);
  rect.setAttribute('width', nodeWidth);
  rect.setAttribute('height', nodeHeight);
  rect.setAttribute('class', 'tree-node-rect');
  rect.setAttribute('fill', getNodeColor(node));
  rect.setAttribute('fill-opacity', '0.2');
  rect.setAttribute('stroke', getNodeColor(node));
  rect.setAttribute('stroke-width', '1.5');
  g.appendChild(rect);

  // 标签文字
  const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  label.setAttribute('x', nodeX + nodeWidth / 2);
  label.setAttribute('y', y + (nodeHeight - 6) / 2 + 2);
  label.setAttribute('class', 'tree-node-text');
  label.textContent = getNodeLabel(node);
  g.appendChild(label);

  // 子标签
  const subLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  subLabel.setAttribute('x', nodeX + nodeWidth / 2);
  subLabel.setAttribute('y', y + nodeHeight - 8);
  subLabel.setAttribute('class', 'tree-node-label');
  subLabel.textContent = getNodeSubLabel(node);
  g.appendChild(subLabel);

  // 悬浮提示
  const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
  title.textContent = `${getNodeSubLabel(node)}: ${getNodeLabel(node)}`;
  g.appendChild(title);

  svg.appendChild(g);

  // 递归绘制子节点
  for (let i = 0; i < children.length; i++) {
    const childX = startX;
    const childY = y + nodeHeight + vGap;
    drawTreeNodes(svg, children[i], childX, childY);
    startX += childLayouts[i].width + hGap;
  }
}

// ========== 铁路图可视化 ==========
function renderRailroad(tree) {
  const svg = document.getElementById('railroadSvg');
  if (!tree || tree.type === 'error') {
    svg.style.display = 'none';
    return;
  }

  svg.style.display = 'block';
  svg.innerHTML = '';

  const ns = 'http://www.w3.org/2000/svg';
  const lineH = 28;
  const padX = 30;
  const padY = 30;

  // 递归生成铁路图元素
  function buildRailroad(node, x, y) {
    const elements = [];
    let curX = x;
    let maxY = y;

    if (!node) return { width: 0, height: lineH, elements };

    switch (node.type) {
      case 'literal': {
        const text = node.value === ' ' ? '␣' : node.value;
        const w = Math.max(text.length * 10 + 20, 40);
        elements.push({ type: 'box', x: curX, y, w, h: lineH, text, color: '#4facfe' });
        return { width: w, height: lineH, elements };
      }
      case 'dot': {
        const w = 50;
        elements.push({ type: 'box', x: curX, y, w, h: lineH, text: 'any', color: '#00f2fe' });
        return { width: w, height: lineH, elements };
      }
      case 'shorthand': {
        const w = 50;
        elements.push({ type: 'box', x: curX, y, w, h: lineH, text: node.value, color: '#00e676' });
        return { width: w, height: lineH, elements };
      }
      case 'anchor': {
        const w = 40;
        elements.push({ type: 'box', x: curX, y, w, h: lineH, text: node.value, color: '#ff9100' });
        return { width: w, height: lineH, elements };
      }
      case 'sequence': {
        let totalW = 0;
        let maxH = lineH;
        for (const child of node.children) {
          const result = buildRailroad(child, curX + totalW, y);
          elements.push(...result.elements);
          totalW += result.width + 4;
          maxH = Math.max(maxH, result.height);
        }
        totalW = Math.max(0, totalW - 4);
        return { width: totalW, height: maxH, elements };
      }
      case 'alternation': {
        const branches = node.children;
        const branchResults = branches.map(b => buildRailroad(b, curX + 40, y));
        const maxW = Math.max(...branchResults.map(r => r.width));
        const totalH = branchResults.reduce((s, r) => s + r.height + 12, 0) - 12;
        const totalW = maxW + 80;

        let offsetY = y;
        for (let i = 0; i < branches.length; i++) {
          const br = branchResults[i];
          // 分支连线
          elements.push({ type: 'path', d: `M${curX},${y + lineH / 2} L${curX + 20},${offsetY + br.height / 2} L${curX + 40},${offsetY + br.height / 2}`, color: '#ff5252' });
          elements.push({ type: 'path', d: `M${curX + 40 + br.width},${offsetY + br.height / 2} L${curX + 60 + br.width},${offsetY + br.height / 2} L${curX + totalW},${y + lineH / 2}`, color: '#ff5252' });
          elements.push(...br.elements);
          offsetY += br.height + 12;
        }

        return { width: totalW, height: Math.max(totalH, lineH), elements };
      }
      case 'quantifier': {
        const childResult = buildRailroad(node.child, curX, y);
        const loopW = childResult.width + 40;

        // 主体
        elements.push(...childResult.elements);

        // 循环线
        if (node.min === 0) {
          // 可选：上方绕行
          elements.push({ type: 'path', d: `M${curX},${y + lineH / 2} C${curX - 10},${y - 15} ${curX + loopW + 10},${y - 15} ${curX + loopW},${y + lineH / 2}`, color: '#ff6b9d' });
          elements.push({ type: 'text', x: curX + loopW / 2, y: y - 18, text: node.quantifier, color: '#ff6b9d' });
        } else {
          // 必选循环：下方绕行
          elements.push({ type: 'path', d: `M${curX + childResult.width},${y + lineH} C${curX + childResult.width + 15},${y + lineH + 20} ${curX - 15},${y + lineH + 20} ${curX},${y + lineH}`, color: '#ff6b9d' });
          elements.push({ type: 'text', x: curX + childResult.width / 2, y: y + lineH + 28, text: node.quantifier, color: '#ff6b9d' });
        }

        return { width: loopW, height: childResult.height + (node.min === 0 ? 0 : 30), elements };
      }
      case 'group': {
        const childResult = buildRailroad(node.child, curX + 8, y);
        const totalW = childResult.width + 16;
        // 分组框
        elements.push({ type: 'roundBox', x: curX, y: y - 4, w: totalW, h: childResult.height + 8, color: '#6c5ce7' });
        // 分组标签
        const label = node.capture ? `#${node.index || ''}` : '?:';
        elements.push({ type: 'label', x: curX + 4, y: y - 2, text: label, color: '#6c5ce7' });
        elements.push(...childResult.elements);
        return { width: totalW, height: childResult.height, elements };
      }
      case 'charClass': {
        const w = 80;
        elements.push({ type: 'box', x: curX, y, w, h: lineH, text: `[${node.negated ? '^' : ''}...]`, color: '#ffd740' });
        return { width: w, height: lineH, elements };
      }
      case 'empty': {
        return { width: 20, height: lineH, elements };
      }
      default: {
        const w = 60;
        elements.push({ type: 'box', x: curX, y, w, h: lineH, text: node.type, color: '#6a6a8a' });
        return { width: w, height: lineH, elements };
      }
    }
  }

  const result = buildRailroad(tree, padX, padY);
  const svgW = result.width + padX * 2;
  const svgH = result.height + padY * 2;
  svg.setAttribute('viewBox', `0 0 ${svgW} ${svgH}`);

  // 绘制主线
  const mainLine = document.createElementNS(ns, 'line');
  mainLine.setAttribute('x1', 0);
  mainLine.setAttribute('y1', padY + lineH / 2);
  mainLine.setAttribute('x2', svgW);
  mainLine.setAttribute('y2', padY + lineH / 2);
  mainLine.setAttribute('stroke', '#2a2a4a');
  mainLine.setAttribute('stroke-width', '2');
  mainLine.setAttribute('stroke-dasharray', '4 4');
  svg.appendChild(mainLine);

  // 渲染元素
  for (const el of result.elements) {
    switch (el.type) {
      case 'box': {
        const rect = document.createElementNS(ns, 'rect');
        rect.setAttribute('x', el.x);
        rect.setAttribute('y', el.y);
        rect.setAttribute('width', el.w);
        rect.setAttribute('height', el.h);
        rect.setAttribute('rx', 6);
        rect.setAttribute('fill', el.color);
        rect.setAttribute('fill-opacity', '0.15');
        rect.setAttribute('stroke', el.color);
        rect.setAttribute('stroke-width', '1.5');
        svg.appendChild(rect);

        const text = document.createElementNS(ns, 'text');
        text.setAttribute('x', el.x + el.w / 2);
        text.setAttribute('y', el.y + el.h / 2);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'central');
        text.setAttribute('fill', el.color);
        text.setAttribute('font-family', 'Consolas, monospace');
        text.setAttribute('font-size', '12');
        text.textContent = el.text;
        svg.appendChild(text);
        break;
      }
      case 'roundBox': {
        const rect = document.createElementNS(ns, 'rect');
        rect.setAttribute('x', el.x);
        rect.setAttribute('y', el.y);
        rect.setAttribute('width', el.w);
        rect.setAttribute('height', el.h);
        rect.setAttribute('rx', 10);
        rect.setAttribute('fill', el.color);
        rect.setAttribute('fill-opacity', '0.06');
        rect.setAttribute('stroke', el.color);
        rect.setAttribute('stroke-width', '1');
        rect.setAttribute('stroke-dasharray', '4 2');
        svg.appendChild(rect);
        break;
      }
      case 'path': {
        const path = document.createElementNS(ns, 'path');
        path.setAttribute('d', el.d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', el.color);
        path.setAttribute('stroke-width', '1.5');
        path.setAttribute('stroke-opacity', '0.6');
        svg.appendChild(path);
        break;
      }
      case 'text': {
        const text = document.createElementNS(ns, 'text');
        text.setAttribute('x', el.x);
        text.setAttribute('y', el.y);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('fill', el.color);
        text.setAttribute('font-size', '10');
        text.setAttribute('font-family', 'Consolas, monospace');
        text.textContent = el.text;
        svg.appendChild(text);
        break;
      }
      case 'label': {
        const text = document.createElementNS(ns, 'text');
        text.setAttribute('x', el.x);
        text.setAttribute('y', el.y);
        text.setAttribute('fill', el.color);
        text.setAttribute('font-size', '9');
        text.setAttribute('font-weight', '600');
        text.textContent = el.text;
        svg.appendChild(text);
        break;
      }
    }
  }
}

// ========== 匹配功能 ==========
function performMatch() {
  const regexStr = document.getElementById('regexInput').value;
  const testText = document.getElementById('testInput').value;
  const flagStr = Object.entries(state.flags).filter(([,v]) => v).map(([k]) => k).join('');

  state.regex = regexStr;
  state.testText = testText;

  // 更新统计
  document.getElementById('regexLength').textContent = regexStr.length;
  document.getElementById('textLength').textContent = testText.length;

  // 清除错误
  const container = document.getElementById('regexContainer');
  const errorMsg = document.getElementById('errorMsg');
  container.classList.remove('error');
  errorMsg.classList.remove('show');

  if (!regexStr) {
    state.matches = [];
    state.parseTree = null;
    updateResults();
    renderCurrentTab();
    return;
  }

  // 解析正则
  const parser = new RegexParser(regexStr);
  state.parseTree = parser.parse();

  if (state.parseTree && state.parseTree.type === 'error') {
    container.classList.add('error');
    errorMsg.textContent = state.parseTree.message;
    errorMsg.classList.add('show');
    state.matches = [];
    updateResults();
    renderCurrentTab();
    return;
  }

  // 执行匹配
  try {
    const startTime = performance.now();
    const regex = new RegExp(regexStr, flagStr);
    const matches = [];

    if (flagStr.includes('g')) {
      let m;
      // 防止零宽匹配死循环
      let lastIdx = -1;
      while ((m = regex.exec(testText)) !== null) {
        matches.push({
          value: m[0],
          index: m.index,
          endIndex: m.index + m[0].length,
          groups: Array.from(m).slice(1).map((g, i) => ({
            value: g || '',
            index: i + 1
          }))
        });
        if (m.index === lastIdx) { regex.lastIndex++; break; }
        lastIdx = m.index;
        if (m[0].length === 0) regex.lastIndex++;
      }
    } else {
      const m = regex.exec(testText);
      if (m) {
        matches.push({
          value: m[0],
          index: m.index,
          endIndex: m.index + m[0].length,
          groups: Array.from(m).slice(1).map((g, i) => ({
            value: g || '',
            index: i + 1
          }))
        });
      }
    }

    const elapsed = performance.now() - startTime;
    state.matches = matches;

    document.getElementById('matchCount').textContent = matches.length;
    document.getElementById('groupCount').textContent = matches.length > 0 ? matches[0].groups.length : 0;
    document.getElementById('matchTime').textContent = elapsed.toFixed(1) + 'ms';
  } catch (e) {
    container.classList.add('error');
    errorMsg.textContent = e.message;
    errorMsg.classList.add('show');
    state.matches = [];
  }

  updateResults();
  renderCurrentTab();
}

// ========== 更新匹配结果 ==========
function updateResults() {
  const container = document.getElementById('matchResults');
  const badge = document.getElementById('resultBadge');
  badge.textContent = state.matches.length;

  if (state.matches.length === 0) {
    container.innerHTML = `
      <div class="no-match">
        <svg viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="16" stroke="currentColor" stroke-width="2"/>
          <path d="M14 14l12 12M26 14l-12 12" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span>暂无匹配结果</span>
      </div>`;
    return;
  }

  const groupColors = ['g0', 'g1', 'g2', 'g3', 'g4'];

  container.innerHTML = state.matches.map((match, i) => `
    <div class="match-item fade-in" style="animation-delay:${i * 0.05}s"
         onmouseenter="highlightMatch(${i})" onmouseleave="clearHighlight()">
      <div class="match-item-header">
        <span class="match-index">匹配 #${i + 1}</span>
        <span class="match-range">${match.index} - ${match.endIndex}</span>
      </div>
      <div class="match-value">"${escapeHtml(match.value)}"</div>
      ${match.groups.length > 0 ? `
        <div class="group-list">
          ${match.groups.map((g, gi) => `
            <div class="group-item">
              <span class="group-label ${groupColors[gi % groupColors.length]}">$${g.index}</span>
              <span class="group-value">"${escapeHtml(g.value)}"</span>
            </div>
          `).join('')}
        </div>
      ` : ''}
    </div>
  `).join('');
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ========== 匹配动画 ==========
function renderMatchAnimation() {
  const container = document.getElementById('matchAnimation');
  if (!state.testText) {
    container.innerHTML = '<div class="viz-placeholder"><p>输入测试文本查看匹配动画</p></div>';
    return;
  }

  // 构建字符展示
  const chars = state.testText.split('').map((ch, i) => {
    let cls = 'match-char';
    // 检查该字符是否在某个匹配中
    for (const match of state.matches) {
      if (i >= match.index && i < match.endIndex) {
        // 判断属于哪个分组
        cls += ' matched';
        break;
      }
    }
    const display = ch === '\n' ? '↵' : ch === ' ' ? '␣' : ch === '\t' ? '→' : ch;
    return `<span class="${cls}" data-index="${i}">${escapeHtml(display)}</span>`;
  }).join('');

  container.innerHTML = `
    <div class="animation-controls">
      <button class="anim-btn" id="animPlayBtn" onclick="toggleAnimation()">▶</button>
      <button class="anim-btn" onclick="resetAnimation()">⟲</button>
      <button class="anim-btn" onclick="stepAnimation()">⏭</button>
      <div class="anim-progress"><div class="anim-progress-bar" id="animProgressBar"></div></div>
      <span class="anim-speed" id="animStepLabel">0/${state.testText.length}</span>
    </div>
    <div class="match-text-line">${chars}</div>
  `;
}

let animFrameId = null;

function toggleAnimation() {
  if (state.animRunning) {
    stopAnimation();
  } else {
    startAnimation();
  }
}

function startAnimation() {
  state.animRunning = true;
  document.getElementById('animPlayBtn').textContent = '⏸';

  const chars = document.querySelectorAll('.match-char');
  const totalSteps = state.testText.length;
  const speed = 11 - state.animSpeed; // 1-10 -> 10-1

  function step() {
    if (!state.animRunning || state.animStep >= totalSteps) {
      stopAnimation();
      return;
    }

    // 清除当前高亮
    chars.forEach(c => c.classList.remove('current'));

    // 高亮当前位置
    if (chars[state.animStep]) {
      chars[state.animStep].classList.add('current');
    }

    state.animStep++;
    document.getElementById('animProgressBar').style.width = (state.animStep / totalSteps * 100) + '%';
    document.getElementById('animStepLabel').textContent = `${state.animStep}/${totalSteps}`;

    animFrameId = setTimeout(step, speed * 30);
  }

  step();
}

function stopAnimation() {
  state.animRunning = false;
  if (animFrameId) clearTimeout(animFrameId);
  const btn = document.getElementById('animPlayBtn');
  if (btn) btn.textContent = '▶';
  // 清除当前高亮
  document.querySelectorAll('.match-char.current').forEach(c => c.classList.remove('current'));
}

function resetAnimation() {
  stopAnimation();
  state.animStep = 0;
  document.getElementById('animProgressBar').style.width = '0%';
  document.getElementById('animStepLabel').textContent = `0/${state.testText.length}`;
  document.querySelectorAll('.match-char').forEach(c => c.classList.remove('current'));
}

function stepAnimation() {
  stopAnimation();
  const chars = document.querySelectorAll('.match-char');
  chars.forEach(c => c.classList.remove('current'));

  if (state.animStep < state.testText.length) {
    if (chars[state.animStep]) {
      chars[state.animStep].classList.add('current');
    }
    state.animStep++;
    document.getElementById('animProgressBar').style.width = (state.animStep / state.testText.length * 100) + '%';
    document.getElementById('animStepLabel').textContent = `${state.animStep}/${state.testText.length}`;
  }
}

// ========== 高亮匹配 ==========
function highlightMatch(index) {
  const match = state.matches[index];
  if (!match) return;

  const chars = document.querySelectorAll('.match-char');
  for (let i = match.index; i < match.endIndex; i++) {
    if (chars[i]) {
      chars[i].style.background = 'rgba(108,92,231,0.4)';
      chars[i].style.color = '#00f2fe';
    }
  }
}

function clearHighlight() {
  const chars = document.querySelectorAll('.match-char');
  chars.forEach(c => {
    c.style.background = '';
    c.style.color = '';
  });
}

// ========== 标签切换 ==========
function renderCurrentTab() {
  const treeSvg = document.getElementById('parseTreeSvg');
  const animDiv = document.getElementById('matchAnimation');
  const railroadSvg = document.getElementById('railroadSvg');
  const placeholder = document.getElementById('vizPlaceholder');

  treeSvg.style.display = 'none';
  animDiv.style.display = 'none';
  railroadSvg.style.display = 'none';
  placeholder.style.display = 'none';

  if (!state.parseTree) {
    placeholder.style.display = 'flex';
    return;
  }

  switch (state.activeTab) {
    case 'tree':
      renderParseTree(state.parseTree);
      break;
    case 'animation':
      animDiv.style.display = 'flex';
      renderMatchAnimation();
      break;
    case 'railroad':
      renderRailroad(state.parseTree);
      break;
  }
}

// ========== 修饰符切换 ==========
function toggleFlag(flag) {
  state.flags[flag] = !state.flags[flag];

  // 更新按钮状态
  document.querySelectorAll('.flag-btn').forEach(btn => {
    if (btn.dataset.flag === flag) {
      btn.classList.toggle('active', state.flags[flag]);
    }
  });

  // 更新底部开关
  const toggleMap = { g: 'toggleGlobal', i: 'toggleIgnoreCase', m: 'toggleMultiline', s: 'toggleDotAll' };
  const toggle = document.getElementById(toggleMap[flag]);
  if (toggle) toggle.classList.toggle('active', state.flags[flag]);

  performMatch();
}

// ========== 模板库 ==========
function showTemplates() {
  const list = document.getElementById('templateList');
  list.innerHTML = templates.map((t, i) => `
    <div class="template-item" onclick="applyTemplate(${i})">
      <div class="template-icon">${t.icon}</div>
      <div class="template-info">
        <div class="template-name">${t.name}</div>
        <div class="template-desc">${t.desc}</div>
      </div>
      <span class="template-regex">${t.regex}</span>
    </div>
  `).join('');
  openModal('templateModal');
}

function applyTemplate(index) {
  const t = templates[index];
  document.getElementById('regexInput').value = t.regex;
  document.getElementById('testInput').value = t.test;
  closeModal('templateModal');
  performMatch();
  addToHistory(t.regex);
}

// ========== 历史记录 ==========
function showHistory() {
  const list = document.getElementById('historyList');
  if (state.history.length === 0) {
    list.innerHTML = '<div class="no-match"><span>暂无历史记录</span></div>';
  } else {
    list.innerHTML = state.history.map((h, i) => `
      <div class="history-item" onclick="applyHistory(${i})">
        <span class="history-regex">/${h.regex}/</span>
        <span class="history-time">${h.time}</span>
        <button class="history-delete" onclick="event.stopPropagation();deleteHistory(${i})">&times;</button>
      </div>
    `).join('');
  }
  openModal('historyModal');
}

function applyHistory(index) {
  const h = state.history[index];
  document.getElementById('regexInput').value = h.regex;
  if (h.testText) document.getElementById('testInput').value = h.testText;
  closeModal('historyModal');
  performMatch();
}

function deleteHistory(index) {
  state.history.splice(index, 1);
  localStorage.setItem('regexHistory', JSON.stringify(state.history));
  showHistory();
}

function addToHistory(regex) {
  if (!regex) return;
  // 去重
  const existing = state.history.findIndex(h => h.regex === regex);
  if (existing !== -1) state.history.splice(existing, 1);

  state.history.unshift({
    regex,
    testText: document.getElementById('testInput').value,
    time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
  });

  // 最多保存20条
  if (state.history.length > 20) state.history.pop();
  localStorage.setItem('regexHistory', JSON.stringify(state.history));
}

// ========== 学习提示 ==========
function showTips() {
  const list = document.getElementById('tipsList');
  list.innerHTML = tips.map(t => `
    <div class="tip-card">
      <div class="tip-title">${t.title}</div>
      <div class="tip-content">${t.content}</div>
    </div>
  `).join('');
  openModal('tipsModal');
}

// ========== 弹窗控制 ==========
function openModal(id) {
  const modal = document.getElementById(id);
  modal.style.display = 'flex';
  requestAnimationFrame(() => modal.classList.add('show'));
}

function closeModal(id) {
  const modal = document.getElementById(id);
  modal.classList.remove('show');
  setTimeout(() => { modal.style.display = 'none'; }, 300);
}

// 点击遮罩关闭
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal(overlay.id);
  });
});

// ========== 事件绑定 ==========
// 正则输入
let debounceTimer = null;
document.getElementById('regexInput').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    performMatch();
  }, 150);
});

// 测试文本输入
document.getElementById('testInput').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    performMatch();
  }, 150);
});

// 修饰符按钮
document.querySelectorAll('.flag-btn').forEach(btn => {
  btn.addEventListener('click', () => toggleFlag(btn.dataset.flag));
});

// 可视化标签切换
document.querySelectorAll('.viz-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.viz-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    state.activeTab = tab.dataset.tab;
    renderCurrentTab();
  });
});

// 动画速度
document.getElementById('animSpeed').addEventListener('input', (e) => {
  state.animSpeed = parseInt(e.target.value);
  document.getElementById('speedLabel').textContent = state.animSpeed + 'x';
});

// 键盘快捷键
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.show').forEach(m => closeModal(m.id));
  }
});

// 初始化修饰符按钮状态
document.querySelectorAll('.flag-btn').forEach(btn => {
  if (state.flags[btn.dataset.flag]) btn.classList.add('active');
});

// ========== 初始化 ==========
performMatch();
</script>
</body>
</html>
