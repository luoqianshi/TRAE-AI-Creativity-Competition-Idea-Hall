<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>末日生存大师 — AI互动生存知识训练工具</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
    <style>
        /* ========== 重置与基础 ========== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --ochre: #8B7355;
            --rust: #8B3A3A;
            --military: #4A5D23;
            --dark: #2C2C2C;
            --darker: #1A1A1A;
            --amber: #D4A846;
            --text-warm: #E8DCC8;
            --text-dim: #A0937D;
            --danger: #C0392B;
            --success: #5A8A3A;
        }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: var(--darker);
            font-family: 'Noto Serif SC', serif;
            color: var(--text-warm);
        }

        /* ========== 游戏容器 ========== */
        #game {
            position: relative;
            width: 100%; height: 100vh;
            overflow: hidden;
        }

        /* ========== 场景层 ========== */
        #scene-bg {
            position: absolute; inset: 0;
            transition: opacity 1.2s ease;
            z-index: 1;
            overflow: hidden;
        }
        #scene-bg::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(26,26,26,0.3) 0%,
                rgba(26,26,26,0.1) 30%,
                rgba(26,26,26,0.4) 60%,
                rgba(26,26,26,0.85) 100%
            );
            z-index: 2;
        }

        /* ========== CSS 场景插画系统 ========== */
        .scene-layer {
            position: absolute; inset: 0;
            transition: opacity 1s ease;
            overflow: hidden;
        }

        /* ===== 通用元素 ===== */
        .ground {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 35%;
        }
        .sky-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(20px);
        }

        /* ===== 人物剪影系统 ===== */
        .character {
            position: absolute;
            bottom: 28%;
            z-index: 5;
            opacity: 0;
            animation: charEnter 1.5s ease-out 0.5s forwards;
        }
        @keyframes charEnter {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes charBreathe {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.01); }
        }
        @keyframes charWalk {
            0% { opacity: 0; transform: translateX(-100px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes charSitIdle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }

        /* 人物: 林安（站姿） */
        .char-linan-stand {
            left: 15%;
            width: 60px; height: 140px;
            animation: charEnter 1.5s ease-out 0.5s forwards;
        }
        .char-linan-stand .body {
            position: absolute; bottom: 0;
            width: 100%; height: 100%;
        }
        .char-linan-stand .head {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 24px; height: 28px;
            background: #2a2218;
            border-radius: 50% 50% 45% 45%;
        }
        .char-linan-stand .hair {
            position: absolute; top: -3px; left: 50%; transform: translateX(-50%);
            width: 28px; height: 16px;
            background: #1a1510;
            border-radius: 50% 50% 20% 20%;
        }
        .char-linan-stand .torso {
            position: absolute; top: 26px; left: 50%; transform: translateX(-50%);
            width: 30px; height: 45px;
            background: linear-gradient(180deg, #3a3025 0%, #2a2218 100%);
            border-radius: 4px 4px 0 0;
            clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
        }
        .char-linan-stand .jacket {
            position: absolute; top: 28px; left: 50%; transform: translateX(-50%);
            width: 36px; height: 40px;
            background: linear-gradient(180deg, #4a3a28 0%, #3a2a1a 100%);
            border-radius: 3px;
            clip-path: polygon(15% 0%, 85% 0%, 100% 30%, 95% 100%, 5% 100%, 0% 30%);
        }
        .char-linan-stand .legs {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 26px; height: 65px;
        }
        .char-linan-stand .leg-l, .char-linan-stand .leg-r {
            position: absolute; bottom: 0;
            width: 11px; height: 65px;
            background: linear-gradient(180deg, #2a2218 0%, #1a1510 100%);
            border-radius: 2px;
        }
        .char-linan-stand .leg-l { left: 0; }
        .char-linan-stand .leg-r { right: 0; }
        .char-linan-stand .arm-l, .char-linan-stand .arm-r {
            position: absolute; top: 30px;
            width: 8px; height: 40px;
            background: linear-gradient(180deg, #3a3025 0%, #2a2218 100%);
            border-radius: 4px;
        }
        .char-linan-stand .arm-l { left: 6px; transform: rotate(8deg); }
        .char-linan-stand .arm-r { right: 6px; transform: rotate(-5deg); }
        .char-linan-stand .backpack {
            position: absolute; top: 28px; right: 2px;
            width: 18px; height: 28px;
            background: linear-gradient(180deg, #5a4a35 0%, #4a3a28 100%);
            border-radius: 3px 3px 5px 5px;
            border: 1px solid #3a2a1a;
        }
        .char-linan-stand .shadow {
            position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
            width: 50px; height: 10px;
            background: radial-gradient(ellipse, rgba(0,0,0,0.4) 0%, transparent 70%);
            border-radius: 50%;
        }

        /* 人物: 林安（蹲姿 - 溪边） */
        .char-linan-crouch {
            left: 25%;
            width: 70px; height: 100px;
            animation: charEnter 1.2s ease-out 0.8s forwards;
        }
        .char-linan-crouch .head {
            position: absolute; top: 0; left: 40%;
            width: 22px; height: 26px;
            background: #2a2218;
            border-radius: 50%;
        }
        .char-linan-crouch .hair {
            position: absolute; top: -2px; left: 38%;
            width: 26px; height: 14px;
            background: #1a1510;
            border-radius: 50% 50% 20% 20%;
        }
        .char-linan-crouch .torso {
            position: absolute; top: 22px; left: 30%;
            width: 32px; height: 35px;
            background: linear-gradient(135deg, #4a3a28 0%, #3a2a1a 100%);
            border-radius: 4px;
            transform: rotate(-15deg);
        }
        .char-linan-crouch .legs {
            position: absolute; bottom: 0; left: 25%;
            width: 40px; height: 40px;
        }
        .char-linan-crouch .leg-folded {
            position: absolute; bottom: 0;
            width: 14px; height: 35px;
            background: #2a2218;
            border-radius: 3px;
        }
        .char-linan-crouch .leg-folded:first-child { left: 0; transform: rotate(-20deg); }
        .char-linan-crouch .leg-folded:last-child { right: 0; transform: rotate(10deg); }
        .char-linan-crouch .arm-reach {
            position: absolute; top: 30px; right: 0;
            width: 35px; height: 8px;
            background: #3a3025;
            border-radius: 4px;
            transform: rotate(25deg);
            transform-origin: left center;
        }
        .char-linan-crouch .shadow {
            position: absolute; bottom: -5px; left: 30%;
            width: 55px; height: 8px;
            background: radial-gradient(ellipse, rgba(0,0,0,0.3) 0%, transparent 70%);
        }

        /* 人物: 老陈（坐姿 - 火堆旁） */
        .char-oldchen {
            right: 25%;
            width: 70px; height: 110px;
            animation: charEnter 1.5s ease-out 1s forwards;
        }
        .char-oldchen .head {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 26px; height: 30px;
            background: #3a3025;
            border-radius: 50%;
        }
        .char-oldchen .hair-white {
            position: absolute; top: -2px; left: 50%; transform: translateX(-50%);
            width: 28px; height: 12px;
            background: #8a8070;
            border-radius: 50% 50% 30% 30%;
        }
        .char-oldchen .beard {
            position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
            width: 16px; height: 12px;
            background: #7a7060;
            border-radius: 0 0 50% 50%;
        }
        .char-oldchen .torso {
            position: absolute; top: 28px; left: 50%; transform: translateX(-50%);
            width: 34px; height: 40px;
            background: linear-gradient(180deg, #5a4a35 0%, #4a3a28 100%);
            border-radius: 4px;
        }
        .char-oldchen .legs-sit {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 40px; height: 30px;
            background: #3a3025;
            border-radius: 3px;
        }
        .char-oldchen .staff {
            position: absolute; top: 10px; right: 5px;
            width: 4px; height: 90px;
            background: linear-gradient(180deg, #6a5a45 0%, #4a3a28 100%);
            border-radius: 2px;
            transform: rotate(10deg);
        }
        .char-oldchen .shadow {
            position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
            width: 55px; height: 8px;
            background: radial-gradient(ellipse, rgba(0,0,0,0.3) 0%, transparent 70%);
        }

        /* 人物: 野狗 */
        .char-dog {
            right: 30%;
            bottom: 30%;
            width: 80px; height: 50px;
            animation: dogEnter 2s ease-out 0.8s forwards;
        }
        @keyframes dogEnter {
            0% { opacity: 0; transform: translateX(80px) scaleX(-1); }
            100% { opacity: 1; transform: translateX(0) scaleX(-1); }
        }
        .char-dog .dog-body {
            position: absolute; bottom: 15px; left: 10%;
            width: 55px; height: 25px;
            background: linear-gradient(180deg, #4a3a28 0%, #3a2a1a 100%);
            border-radius: 40% 50% 30% 30%;
        }
        .char-dog .dog-head {
            position: absolute; bottom: 22px; left: 0;
            width: 25px; height: 20px;
            background: #4a3a28;
            border-radius: 50% 40% 30% 50%;
            transform: rotate(-10deg);
        }
        .char-dog .dog-ear {
            position: absolute; bottom: 38px; left: 5px;
            width: 8px; height: 12px;
            background: #3a2a1a;
            border-radius: 50% 50% 0 0;
            transform: rotate(-15deg);
        }
        .char-dog .dog-eye {
            position: absolute; bottom: 30px; left: 8px;
            width: 4px; height: 4px;
            background: rgba(255,180,60,0.8);
            border-radius: 50%;
            animation: eyeGlow 2s ease-in-out infinite alternate;
        }
        @keyframes eyeGlow {
            0% { opacity: 0.6; box-shadow: 0 0 3px rgba(255,180,60,0.3); }
            100% { opacity: 1; box-shadow: 0 0 8px rgba(255,180,60,0.6); }
        }
        .char-dog .dog-tail {
            position: absolute; bottom: 25px; right: 5px;
            width: 20px; height: 5px;
            background: #3a2a1a;
            border-radius: 3px;
            transform: rotate(-30deg);
            transform-origin: left center;
            animation: tailWag 1.5s ease-in-out infinite;
        }
        @keyframes tailWag {
            0%, 100% { transform: rotate(-30deg); }
            50% { transform: rotate(-15deg); }
        }
        .char-dog .dog-leg {
            position: absolute; bottom: 0;
            width: 6px; height: 18px;
            background: #3a2a1a;
            border-radius: 2px;
        }
        .char-dog .dog-leg:nth-child(6) { left: 15%; }
        .char-dog .dog-leg:nth-child(7) { left: 30%; }
        .char-dog .dog-leg:nth-child(8) { right: 25%; }
        .char-dog .dog-leg:nth-child(9) { right: 10%; }

        /* ===== 场景1: 客车残骸 - 夜晚 ===== */
        .scene-bus-wreckage {
            background: linear-gradient(180deg, #050508 0%, #0a0a15 20%, #1a1218 50%, #2a1a15 80%, #1a1210 100%);
        }
        /* 星空 */
        .scene-bus-wreckage .stars {
            position: absolute; top: 0; left: 0; right: 0; height: 40%;
        }
        .scene-bus-wreckage .star {
            position: absolute;
            width: 2px; height: 2px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            animation: starTwinkle 3s ease-in-out infinite;
        }
        @keyframes starTwinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
        /* 城市废墟剪影 */
        .scene-bus-wreckage .city-ruins {
            position: absolute;
            bottom: 38%; left: 0; right: 0;
            height: 25%;
        }
        .scene-bus-wreckage .building {
            position: absolute; bottom: 0;
            background: #0a0a0f;
        }
        .scene-bus-wreckage .building:nth-child(1) { left: 5%; width: 8%; height: 60%; clip-path: polygon(0% 100%, 0% 20%, 30% 0%, 60% 10%, 100% 30%, 100% 100%); }
        .scene-bus-wreckage .building:nth-child(2) { left: 15%; width: 6%; height: 80%; clip-path: polygon(0% 100%, 0% 0%, 100% 10%, 100% 100%); }
        .scene-bus-wreckage .building:nth-child(3) { left: 25%; width: 10%; height: 45%; clip-path: polygon(0% 100%, 10% 0%, 90% 20%, 100% 100%); }
        .scene-bus-wreckage .building:nth-child(4) { left: 40%; width: 5%; height: 70%; clip-path: polygon(0% 100%, 0% 0%, 100% 20%, 100% 100%); }
        .scene-bus-wreckage .building:nth-child(5) { left: 55%; width: 12%; height: 50%; clip-path: polygon(0% 100%, 20% 0%, 80% 10%, 100% 100%); }
        .scene-bus-wreckage .building:nth-child(6) { left: 72%; width: 7%; height: 65%; clip-path: polygon(0% 100%, 0% 10%, 50% 0%, 100% 20%, 100% 100%); }
        .scene-bus-wreckage .building:nth-child(7) { left: 85%; width: 9%; height: 40%; clip-path: polygon(0% 100%, 30% 0%, 70% 10%, 100% 100%); }
        /* 地面 */
        .scene-bus-wreckage .ground {
            background: linear-gradient(180deg, #1a1510 0%, #0f0d0a 50%, #0a0808 100%);
            height: 38%;
        }
        .scene-bus-wreckage .ground::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent 10%, rgba(139,115,85,0.1) 50%, transparent 90%);
        }
        /* 客车残骸 */
        .scene-bus-wreckage .bus-wreck {
            position: absolute;
            bottom: 30%; left: 35%;
            width: 280px; height: 100px;
        }
        .scene-bus-wreckage .bus-body {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 70px;
            background: linear-gradient(180deg, #2a2520 0%, #1a1510 60%, #0f0d0a 100%);
            border-radius: 5px 8px 3px 3px;
            clip-path: polygon(2% 30%, 5% 0%, 95% 5%, 98% 40%, 100% 100%, 0% 100%);
            transform: rotate(-3deg);
        }
        .scene-bus-wreckage .bus-window {
            position: absolute;
            background: rgba(255,100,20,0.15);
            border: 1px solid rgba(139,115,85,0.2);
        }
        .scene-bus-wreckage .bus-window:nth-child(2) { bottom: 40px; left: 20px; width: 25px; height: 20px; transform: rotate(-3deg); }
        .scene-bus-wreckage .bus-window:nth-child(3) { bottom: 42px; left: 55px; width: 25px; height: 20px; transform: rotate(-2deg); }
        .scene-bus-wreckage .bus-window:nth-child(4) { bottom: 38px; left: 90px; width: 25px; height: 20px; transform: rotate(-4deg); }
        /* 火焰 */
        .scene-bus-wreckage .fire {
            position: absolute;
            bottom: 32%; left: 42%;
            width: 60px; height: 80px;
        }
        .scene-bus-wreckage .flame {
            position: absolute; bottom: 0;
            border-radius: 50% 50% 20% 20%;
            animation: flameDance 0.8s ease-in-out infinite alternate;
        }
        .scene-bus-wreckage .flame:nth-child(1) {
            left: 10px; width: 30px; height: 60px;
            background: linear-gradient(0deg, rgba(255,80,20,0.8) 0%, rgba(255,150,30,0.5) 50%, transparent 100%);
        }
        .scene-bus-wreckage .flame:nth-child(2) {
            left: 20px; width: 20px; height: 45px;
            background: linear-gradient(0deg, rgba(255,120,30,0.7) 0%, rgba(255,200,50,0.4) 50%, transparent 100%);
            animation-delay: 0.2s;
        }
        .scene-bus-wreckage .flame:nth-child(3) {
            left: 5px; width: 15px; height: 35px;
            background: linear-gradient(0deg, rgba(255,60,10,0.6) 0%, rgba(255,100,20,0.3) 50%, transparent 100%);
            animation-delay: 0.4s;
        }
        @keyframes flameDance {
            0% { transform: scaleX(1) scaleY(1) rotate(-2deg); }
            100% { transform: scaleX(1.1) scaleY(1.15) rotate(2deg); }
        }
        /* 火焰光晕 */
        .scene-bus-wreckage .fire-glow {
            position: absolute;
            bottom: 25%; left: 30%;
            width: 250px; height: 150px;
            background: radial-gradient(ellipse, rgba(255,100,20,0.15) 0%, rgba(255,60,10,0.05) 40%, transparent 70%);
            animation: fireGlow 3s ease-in-out infinite alternate;
        }
        @keyframes fireGlow {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.08); }
        }
        /* 烟雾 */
        .scene-bus-wreckage .smoke-plume {
            position: absolute;
            bottom: 50%; left: 45%;
            width: 40px; height: 120px;
            background: linear-gradient(0deg, rgba(80,70,60,0.3) 0%, rgba(60,50,40,0.15) 50%, transparent 100%);
            filter: blur(8px);
            animation: smokeRise2 5s ease-out infinite;
        }
        @keyframes smokeRise2 {
            0% { transform: translateY(0) scaleX(1); opacity: 0.5; }
            100% { transform: translateY(-60px) scaleX(2.5); opacity: 0; }
        }
        /* 散落的碎片 */
        .scene-bus-wreckage .debris {
            position: absolute;
            background: #1a1510;
            border-radius: 2px;
        }
        .scene-bus-wreckage .debris:nth-child(1) { bottom: 32%; left: 25%; width: 15px; height: 6px; transform: rotate(25deg); }
        .scene-bus-wreckage .debris:nth-child(2) { bottom: 33%; left: 70%; width: 20px; height: 5px; transform: rotate(-15deg); }
        .scene-bus-wreckage .debris:nth-child(3) { bottom: 31%; left: 80%; width: 12px; height: 8px; transform: rotate(40deg); }

        /* ===== 场景2: 森林边缘 - 清晨 ===== */
        .scene-forest-edge {
            background: linear-gradient(180deg, #2a2520 0%, #3a3025 15%, #4a3a28 35%, #5a4a35 55%, #3a3025 80%, #2a2218 100%);
        }
        /* 晨光 */
        .scene-forest-edge .sun-rays {
            position: absolute;
            top: 5%; right: 20%;
            width: 200px; height: 300px;
            background: radial-gradient(ellipse at top, rgba(212,168,70,0.2) 0%, rgba(212,168,70,0.05) 40%, transparent 70%);
            animation: morningLight 5s ease-in-out infinite alternate;
        }
        @keyframes morningLight {
            0% { opacity: 0.5; transform: rotate(-2deg); }
            100% { opacity: 0.9; transform: rotate(2deg); }
        }
        /* 光线束 */
        .scene-forest-edge .light-beam {
            position: absolute;
            top: 0;
            width: 3px;
            background: linear-gradient(180deg, rgba(212,168,70,0.15) 0%, rgba(212,168,70,0.05) 60%, transparent 100%);
            transform-origin: top center;
        }
        .scene-forest-edge .light-beam:nth-child(1) { right: 25%; height: 60%; transform: rotate(5deg); }
        .scene-forest-edge .light-beam:nth-child(2) { right: 35%; height: 55%; transform: rotate(-3deg); opacity: 0.7; }
        .scene-forest-edge .light-beam:nth-child(3) { right: 18%; height: 50%; transform: rotate(8deg); opacity: 0.5; }
        /* 树木 */
        .scene-forest-edge .tree-big {
            position: absolute; bottom: 30%;
        }
        .scene-forest-edge .tree-trunk {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            background: linear-gradient(90deg, #1a1510 0%, #2a2218 50%, #1a1510 100%);
            border-radius: 3px;
        }
        .scene-forest-edge .tree-branches {
            position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
        }
        .scene-forest-edge .branch {
            position: absolute;
            background: #1a1510;
            border-radius: 2px;
            transform-origin: left center;
        }
        /* 地面 */
        .scene-forest-edge .ground {
            background: linear-gradient(180deg, #2a2218 0%, #1f1a12 50%, #151210 100%);
        }
        .scene-forest-edge .ground-detail {
            position: absolute; bottom: 30%; left: 0; right: 0; height: 8%;
            background: linear-gradient(90deg, #2a2218 0%, #3a3025 20%, #2a2218 40%, #3a3025 60%, #2a2218 80%, #3a3025 100%);
            opacity: 0.3;
        }
        /* 落叶 */
        .scene-forest-edge .leaf {
            position: absolute;
            width: 6px; height: 4px;
            background: #4a3a28;
            border-radius: 50% 0 50% 0;
            opacity: 0.5;
        }

        /* ===== 场景3: 小溪边 ===== */
        .scene-creek {
            background: linear-gradient(180deg, #3a3530 0%, #4a4035 20%, #3a3528 50%, #2a2520 80%, #1a1a15 100%);
        }
        /* 溪流水面 */
        .scene-creek .stream {
            position: absolute;
            bottom: 22%; left: 0; right: 0;
            height: 18%;
            background: linear-gradient(180deg, #2a3540 0%, #3a4550 30%, #4a5560 50%, #3a4550 70%, #2a3540 100%);
            overflow: hidden;
        }
        .scene-creek .water-ripple {
            position: absolute;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(90deg,
                transparent 0%, rgba(90,141,190,0.1) 10%, transparent 20%,
                rgba(90,141,190,0.08) 30%, transparent 40%
            );
            animation: waterFlow 4s linear infinite;
        }
        @keyframes waterFlow {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        /* 水面反光 */
        .scene-creek .water-shimmer {
            position: absolute;
            bottom: 28%; left: 30%;
            width: 40%; height: 3%;
            background: linear-gradient(90deg, transparent 0%, rgba(180,200,220,0.15) 30%, rgba(180,200,220,0.25) 50%, rgba(180,200,220,0.15) 70%, transparent 100%);
            animation: shimmer 3s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%, 100% { opacity: 0.3; transform: scaleX(0.9); }
            50% { opacity: 0.7; transform: scaleX(1.1); }
        }
        /* 溪边石头 */
        .scene-creek .rock {
            position: absolute;
            background: linear-gradient(135deg, #3a3530 0%, #2a2520 100%);
            border-radius: 40% 50% 45% 55%;
        }
        .scene-creek .rock:nth-child(1) { bottom: 35%; left: 15%; width: 30px; height: 20px; }
        .scene-creek .rock:nth-child(2) { bottom: 33%; left: 60%; width: 25px; height: 15px; transform: rotate(15deg); }
        .scene-creek .rock:nth-child(3) { bottom: 36%; right: 20%; width: 20px; height: 14px; }
        /* 岸边植被 */
        .scene-creek .veg {
            position: absolute;
            bottom: 36%;
            width: 3px;
            background: linear-gradient(0deg, #3a4a28 0%, #2a3a1a 100%);
            border-radius: 2px;
            transform-origin: bottom center;
            animation: vegSway 3s ease-in-out infinite;
        }
        @keyframes vegSway {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }
        .scene-creek .ground {
            background: linear-gradient(180deg, #2a2520 0%, #1f1a15 100%);
            height: 22%;
        }

        /* ===== 场景4: 伐木场 - 傍晚 ===== */
        .scene-lumber-mill {
            background: linear-gradient(180deg, #3a2a20 0%, #4a3525 20%, #5a4030 40%, #4a3525 65%, #3a2a1a 100%);
        }
        /* 夕阳 */
        .scene-lumber-mill .sunset {
            position: absolute;
            top: 8%; left: 15%;
            width: 80px; height: 80px;
            background: radial-gradient(circle, rgba(255,140,50,0.4) 0%, rgba(255,100,30,0.2) 40%, transparent 70%);
            border-radius: 50%;
        }
        /* 木屋 */
        .scene-lumber-mill .cabin {
            position: absolute;
            bottom: 30%; right: 15%;
            width: 180px; height: 120px;
        }
        .scene-lumber-mill .cabin-wall {
            position: absolute; bottom: 0; left: 10%;
            width: 80%; height: 70%;
            background: linear-gradient(180deg, #3a2a1a 0%, #2a1a10 100%);
            border-radius: 2px;
        }
        .scene-lumber-mill .cabin-roof {
            position: absolute; bottom: 68%; left: 0;
            width: 100%; height: 40%;
            background: linear-gradient(180deg, #2a1a10 0%, #3a2a1a 100%);
            clip-path: polygon(0% 100%, 50% 0%, 100% 100%);
        }
        .scene-lumber-mill .cabin-door {
            position: absolute; bottom: 0; left: 40%;
            width: 25%; height: 45%;
            background: #1a1008;
            border-radius: 2px 2px 0 0;
        }
        /* 窗户灯光 */
        .scene-lumber-mill .cabin-window {
            position: absolute; bottom: 45%; left: 20%;
            width: 18%; height: 18%;
            background: radial-gradient(circle, rgba(255,180,60,0.8) 0%, rgba(255,120,30,0.4) 60%, rgba(255,80,20,0.1) 100%);
            border: 1px solid #4a3a28;
            animation: windowGlow 2.5s ease-in-out infinite alternate;
        }
        @keyframes windowGlow {
            0% { opacity: 0.7; box-shadow: 0 0 10px rgba(255,150,40,0.3); }
            100% { opacity: 1; box-shadow: 0 0 25px rgba(255,150,40,0.5); }
        }
        /* 篝火 */
        .scene-lumber-mill .campfire {
            position: absolute;
            bottom: 28%; left: 35%;
            width: 50px; height: 60px;
        }
        .scene-lumber-mill .campfire .flame {
            position: absolute; bottom: 0;
            border-radius: 50% 50% 20% 20%;
        }
        .scene-lumber-mill .campfire .flame:nth-child(1) {
            left: 10px; width: 25px; height: 45px;
            background: linear-gradient(0deg, rgba(255,100,20,0.9) 0%, rgba(255,180,50,0.5) 50%, transparent 100%);
            animation: flameDance 0.6s ease-in-out infinite alternate;
        }
        .scene-lumber-mill .campfire .flame:nth-child(2) {
            left: 18px; width: 15px; height: 35px;
            background: linear-gradient(0deg, rgba(255,150,30,0.7) 0%, rgba(255,220,80,0.3) 50%, transparent 100%);
            animation: flameDance 0.8s ease-in-out infinite alternate-reverse;
        }
        /* 篝火光晕 */
        .scene-lumber-mill .fire-light {
            position: absolute;
            bottom: 15%; left: 20%;
            width: 300px; height: 200px;
            background: radial-gradient(ellipse, rgba(255,120,30,0.12) 0%, rgba(255,80,20,0.05) 40%, transparent 70%);
            animation: fireGlow 3s ease-in-out infinite alternate;
        }
        /* 烟囱烟雾 */
        .scene-lumber-mill .chimney-smoke {
            position: absolute;
            bottom: 65%; right: 22%;
            width: 15px; height: 80px;
        }
        .scene-lumber-mill .smoke-puff {
            position: absolute; bottom: 0; left: 0;
            width: 12px; height: 12px;
            background: rgba(100,90,80,0.3);
            border-radius: 50%;
            animation: smokePuff 4s ease-out infinite;
        }
        .scene-lumber-mill .smoke-puff:nth-child(2) { animation-delay: 1.3s; }
        .scene-lumber-mill .smoke-puff:nth-child(3) { animation-delay: 2.6s; }
        @keyframes smokePuff {
            0% { transform: translateY(0) scale(1); opacity: 0.4; }
            100% { transform: translateY(-80px) translateX(20px) scale(3); opacity: 0; }
        }
        /* 木桩 */
        .scene-lumber-mill .log-stump {
            position: absolute;
            background: linear-gradient(180deg, #4a3a28 0%, #3a2a1a 100%);
            border-radius: 3px;
        }
        .scene-lumber-mill .log-stump:nth-child(1) { bottom: 30%; left: 10%; width: 40px; height: 15px; transform: rotate(-5deg); }
        .scene-lumber-mill .log-stump:nth-child(2) { bottom: 31%; left: 12%; width: 35px; height: 12px; transform: rotate(8deg); }
        .scene-lumber-mill .ground {
            background: linear-gradient(180deg, #3a2a1a 0%, #2a1a10 100%);
            height: 30%;
        }

        /* ===== 场景5: 岔路口 - 黄昏 ===== */
        .scene-crossroads {
            background: linear-gradient(180deg, #4a3020 0%, #5a3a25 15%, #6a4530 30%, #7a5035 45%, #5a3a25 70%, #3a2515 100%);
        }
        /* 落日 */
        .scene-crossroads .setting-sun {
            position: absolute;
            top: 15%; left: 50%; transform: translateX(-50%);
            width: 60px; height: 60px;
            background: radial-gradient(circle, rgba(255,160,60,0.8) 0%, rgba(255,120,40,0.4) 40%, transparent 70%);
            border-radius: 50%;
        }
        /* 天空云彩 */
        .scene-crossroads .cloud {
            position: absolute;
            background: rgba(180,100,50,0.15);
            border-radius: 50%;
            filter: blur(5px);
        }
        .scene-crossroads .cloud:nth-child(1) { top: 10%; left: 20%; width: 120px; height: 20px; }
        .scene-crossroads .cloud:nth-child(2) { top: 18%; right: 25%; width: 80px; height: 15px; }
        /* 道路分岔 */
        .scene-crossroads .road {
            position: absolute;
            bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; height: 40%;
        }
        .scene-crossroads .road-main {
            position: absolute; bottom: 0; left: 35%;
            width: 30%; height: 100%;
            background: linear-gradient(180deg, #3a2a1a 0%, #2a1a10 100%);
            clip-path: polygon(30% 0%, 70% 0%, 100% 100%, 0% 100%);
        }
        .scene-crossroads .road-left {
            position: absolute; bottom: 30%; left: 0;
            width: 40%; height: 15%;
            background: linear-gradient(90deg, #2a1a10 0%, #3a2a1a 100%);
            clip-path: polygon(0% 0%, 100% 30%, 100% 70%, 0% 100%);
            transform: perspective(200px) rotateY(10deg);
        }
        .scene-crossroads .road-right {
            position: absolute; bottom: 30%; right: 0;
            width: 40%; height: 15%;
            background: linear-gradient(90deg, #3a2a1a 0%, #2a1a10 100%);
            clip-path: polygon(0% 30%, 100% 0%, 100% 100%, 0% 70%);
            transform: perspective(200px) rotateY(-10deg);
        }
        /* 路标 */
        .scene-crossroads .signpost {
            position: absolute;
            bottom: 35%; left: 48%;
            width: 6px; height: 60px;
            background: linear-gradient(180deg, #5a4a35 0%, #3a2a1a 100%);
        }
        .scene-crossroads .sign-board {
            position: absolute; top: 0;
            width: 40px; height: 12px;
            background: #4a3a28;
            border-radius: 2px;
            border: 1px solid #3a2a1a;
        }
        .scene-crossroads .sign-board:first-child { left: -35px; transform: rotate(-5deg); }
        .scene-crossroads .sign-board:last-child { left: 5px; transform: rotate(5deg); }
        .scene-crossroads .ground {
            background: linear-gradient(180deg, #3a2a1a 0%, #2a1a10 100%);
            height: 32%;
        }

        /* ===== 场景6: 第七区 - 黎明 ===== */
        .scene-settlement {
            background: linear-gradient(180deg, #1a1a2a 0%, #2a2535 15%, #3a3040 30%, #4a3a35 50%, #5a4535 70%, #3a2a20 100%);
        }
        /* 黎明光线 */
        .scene-settlement .dawn-glow {
            position: absolute;
            top: 10%; left: 50%; transform: translateX(-50%);
            width: 300px; height: 150px;
            background: radial-gradient(ellipse, rgba(212,168,70,0.2) 0%, rgba(212,168,70,0.08) 40%, transparent 70%);
            animation: dawnLight 5s ease-in-out infinite alternate;
        }
        @keyframes dawnLight {
            0% { opacity: 0.5; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }
        /* 围墙 */
        .scene-settlement .wall {
            position: absolute;
            bottom: 32%; left: 10%; right: 10%;
            height: 20%;
            background: linear-gradient(180deg, #3a3025 0%, #2a2218 100%);
            clip-path: polygon(0% 100%, 0% 40%, 5% 30%, 10% 40%, 15% 25%, 20% 35%, 25% 20%, 30% 30%, 35% 15%, 40% 25%, 45% 10%, 50% 20%, 55% 10%, 60% 25%, 65% 15%, 70% 30%, 75% 20%, 80% 35%, 85% 25%, 90% 40%, 95% 30%, 100% 40%, 100% 100%);
        }
        /* 哨塔 */
        .scene-settlement .watchtower {
            position: absolute; bottom: 32%;
        }
        .scene-settlement .tower-base {
            position: absolute; bottom: 0;
            width: 20px;
            background: linear-gradient(90deg, #2a2218 0%, #3a3025 50%, #2a2218 100%);
        }
        .scene-settlement .tower-top {
            position: absolute;
            width: 30px; left: -5px;
            background: #3a3025;
            border-radius: 2px;
        }
        .scene-settlement .tower-light {
            position: absolute;
            width: 6px; height: 6px;
            background: rgba(255,180,60,0.7);
            border-radius: 50%;
            animation: towerBlink 2s ease-in-out infinite;
        }
        @keyframes towerBlink {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; box-shadow: 0 0 10px rgba(255,180,60,0.5); }
        }
        .scene-settlement .watchtower:nth-child(1) { left: 20%; }
        .scene-settlement .watchtower:nth-child(1) .tower-base { height: 80px; }
        .scene-settlement .watchtower:nth-child(1) .tower-top { bottom: 78px; height: 15px; }
        .scene-settlement .watchtower:nth-child(1) .tower-light { bottom: 85px; left: 12px; }
        .scene-settlement .watchtower:nth-child(2) { left: 55%; }
        .scene-settlement .watchtower:nth-child(2) .tower-base { height: 95px; }
        .scene-settlement .watchtower:nth-child(2) .tower-top { bottom: 93px; height: 15px; }
        .scene-settlement .watchtower:nth-child(2) .tower-light { bottom: 100px; left: 12px; }
        .scene-settlement .watchtower:nth-child(3) { right: 20%; }
        .scene-settlement .watchtower:nth-child(3) .tower-base { height: 70px; }
        .scene-settlement .watchtower:nth-child(3) .tower-top { bottom: 68px; height: 15px; }
        .scene-settlement .watchtower:nth-child(3) .tower-light { bottom: 75px; left: 12px; }
        /* 帐篷 */
        .scene-settlement .tent {
            position: absolute; bottom: 30%;
        }
        .scene-settlement .tent-shape {
            background: linear-gradient(180deg, #4a3a28 0%, #3a2a1a 100%);
            clip-path: polygon(0% 100%, 50% 0%, 100% 100%);
        }
        .scene-settlement .tent:nth-child(4) { left: 30%; }
        .scene-settlement .tent:nth-child(4) .tent-shape { width: 40px; height: 30px; }
        .scene-settlement .tent:nth-child(5) { left: 42%; }
        .scene-settlement .tent:nth-child(5) .tent-shape { width: 35px; height: 25px; }
        .scene-settlement .tent:nth-child(6) { right: 30%; }
        .scene-settlement .tent:nth-child(6) .tent-shape { width: 45px; height: 32px; }
        /* 大门 */
        .scene-settlement .gate {
            position: absolute;
            bottom: 30%; left: 50%; transform: translateX(-50%);
            width: 50px; height: 50px;
            background: linear-gradient(180deg, #2a2218 0%, #1a1510 100%);
            border-radius: 25px 25px 0 0;
            border: 2px solid #3a3025;
            border-bottom: none;
        }
        .scene-settlement .gate-light {
            position: absolute;
            bottom: 35%; left: 50%; transform: translateX(-50%);
            width: 40px; height: 30px;
            background: radial-gradient(ellipse, rgba(212,168,70,0.2) 0%, transparent 70%);
        }
        .scene-settlement .ground {
            background: linear-gradient(180deg, #2a2218 0%, #1a1510 100%);
            height: 30%;
        }

        /* ========== CRT扫描线 ========== */
        #scanlines {
            position: fixed; inset: 0; z-index: 90;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent 0px, transparent 2px,
                rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px
            );
        }

        /* ========== 暗角 ========== */
        #vignette {
            position: fixed; inset: 0; z-index: 89;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
        }

        /* ========== 灰烬粒子 ========== */
        #particles {
            position: fixed; inset: 0; z-index: 88;
            pointer-events: none;
            overflow: hidden;
        }
        .ash {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            animation: ashFloat linear infinite;
        }
        @keyframes ashFloat {
            0%   { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.6; }
            90%  { opacity: 0.3; }
            100% { transform: translateY(-20px) translateX(80px) rotate(720deg); opacity: 0; }
        }

        /* ========== 闪烁灯光 ========== */
        #flicker {
            position: fixed; inset: 0; z-index: 87;
            pointer-events: none;
            background: rgba(212,168,70,0.02);
            animation: flicker 4s ease-in-out infinite;
        }
        @keyframes flicker {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
            73% { opacity: 0.3; }
            77% { opacity: 0; }
            80% { opacity: 0.5; }
        }

        /* ========== 标题画面 ========== */
        #title-screen {
            position: absolute; inset: 0; z-index: 50;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: linear-gradient(135deg, #1A1A1A 0%, #2C2218 40%, #1A1A1A 100%);
            transition: opacity 1s ease;
        }
        #title-screen.hidden { opacity: 0; pointer-events: none; }

        .title-emblem {
            width: 80px; height: 80px;
            border: 2px solid var(--amber);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 36px;
            margin-bottom: 24px;
            animation: emblemPulse 3s ease-in-out infinite;
            box-shadow: 0 0 30px rgba(212,168,70,0.2);
        }
        @keyframes emblemPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(212,168,70,0.2); }
            50% { box-shadow: 0 0 50px rgba(212,168,70,0.4); }
        }

        .title-main {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: clamp(42px, 7vw, 72px);
            color: var(--amber);
            text-shadow: 0 0 40px rgba(212,168,70,0.3), 0 4px 8px rgba(0,0,0,0.5);
            letter-spacing: 12px;
            margin-bottom: 12px;
        }
        .title-sub {
            font-family: 'ZCOOL QingKe HuangYou', sans-serif;
            font-size: clamp(12px, 2vw, 16px);
            color: var(--text-dim);
            letter-spacing: 4px;
            margin-bottom: 48px;
        }
        .title-tagline {
            font-size: 14px;
            color: var(--ochre);
            margin-bottom: 48px;
            font-style: italic;
            opacity: 0.8;
        }

        .btn-start {
            padding: 14px 48px;
            background: transparent;
            border: 1px solid var(--amber);
            color: var(--amber);
            font-family: 'ZCOOL QingKe HuangYou', sans-serif;
            font-size: 18px;
            letter-spacing: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-start:hover {
            background: rgba(212,168,70,0.1);
            box-shadow: 0 0 30px rgba(212,168,70,0.2);
            transform: scale(1.02);
        }
        .btn-start::before {
            content: '';
            position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212,168,70,0.1), transparent);
            animation: btnSweep 3s ease-in-out infinite;
        }
        @keyframes btnSweep {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }

        .title-disclaimer {
            position: absolute; bottom: 24px;
            font-size: 11px; color: var(--text-dim);
            opacity: 0.5; text-align: center;
            max-width: 500px; line-height: 1.6;
        }

        /* ========== 状态栏 ========== */
        #status-bar {
            position: absolute; top: 0; left: 0; right: 0;
            z-index: 60;
            background: linear-gradient(to bottom, rgba(26,26,26,0.95) 0%, rgba(26,26,26,0.7) 80%, transparent 100%);
            padding: 12px 20px 20px;
            display: none;
        }
        #status-bar.visible { display: block; }

        .status-row {
            display: flex; align-items: center; gap: 16px;
            flex-wrap: wrap;
        }
        .stat-item {
            display: flex; align-items: center; gap: 6px;
            font-size: 13px;
        }
        .stat-icon { font-size: 16px; }
        .stat-label { color: var(--text-dim); font-size: 11px; }
        .stat-bar-wrap {
            width: 60px; height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px; overflow: hidden;
            position: relative;
        }
        .stat-bar-fill {
            height: 100%; border-radius: 3px;
            transition: width 0.8s ease, background 0.5s ease;
        }
        .stat-value {
            font-family: 'ZCOOL QingKe HuangYou', sans-serif;
            font-size: 13px;
            min-width: 28px; text-align: right;
        }
        .stat-day {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 20px; color: var(--amber);
            margin-right: 8px;
            text-shadow: 0 0 10px rgba(212,168,70,0.3);
        }
        .stat-sep {
            width: 1px; height: 20px;
            background: rgba(255,255,255,0.1);
            margin: 0 4px;
        }

        .skill-row {
            display: flex; gap: 12px; margin-top: 8px;
        }
        .skill-badge {
            display: flex; align-items: center; gap: 4px;
            font-size: 11px; color: var(--text-dim);
            padding: 2px 8px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 3px;
            background: rgba(255,255,255,0.03);
        }
        .skill-badge .skill-lv {
            color: var(--amber);
            font-family: 'ZCOOL QingKe HuangYou', sans-serif;
        }
        .skill-badge.locked { opacity: 0.35; }
        .skill-badge.locked .skill-lv { color: var(--text-dim); }

        /* ========== 叙述区域 ========== */
        #narrative-area {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            z-index: 60;
            padding: 0 20px 20px;
            display: none;
        }
        #narrative-area.visible { display: block; }

        .narrative-box {
            background: linear-gradient(to bottom, rgba(26,26,26,0.0) 0%, rgba(26,26,26,0.92) 15%, rgba(26,26,26,0.96) 100%);
            border: 1px solid rgba(139,115,85,0.2);
            border-radius: 4px;
            padding: 24px 28px;
            position: relative;
            backdrop-filter: blur(4px);
        }
        .narrative-box::before {
            content: '';
            position: absolute; top: 0; left: 20px; right: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--ochre), transparent);
            opacity: 0.3;
        }

        .char-tag {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 12px; color: var(--amber);
            margin-bottom: 10px;
            font-family: 'ZCOOL QingKe HuangYou', sans-serif;
        }
        .char-dot {
            width: 6px; height: 6px;
            background: var(--amber);
            border-radius: 50%;
            animation: dotPulse 2s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        #narration-text {
            font-size: 15px;
            line-height: 1.9;
            color: var(--text-warm);
            min-height: 50px;
            margin-bottom: 16px;
        }
        #narration-text .cursor {
            display: inline-block;
            width: 2px; height: 16px;
            background: var(--amber);
            margin-left: 2px;
            animation: cursorBlink 0.8s step-end infinite;
            vertical-align: text-bottom;
        }
        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ========== 选项按钮 ========== */
        #choices-area {
            display: flex; flex-direction: column; gap: 8px;
            margin-top: 8px;
        }

        .choice-btn {
            display: flex; align-items: flex-start; gap: 12px;
            padding: 12px 16px;

        }
        #transition.active {

        }

        #toast {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);

</head>

// ---- 引擎函数 ----

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function getNestedValue(obj, path) {
    return path.split('.').reduce((o, k) => o && o[k], obj);
}

function setNestedValue(obj, path, val) {
    const keys = path.split('.');
    const last = keys.pop();
    const target = keys.reduce((o, k) => o[k], obj);
    target[last] = val;
}

function updateStatsUI() {
    const stats = ['stamina', 'hunger', 'thirst', 'sanity'];
    const colors = { stamina: 'var(--success)', hunger: 'var(--amber)', thirst: '#5B8DBE', sanity: '#9B6BB5' };
    stats.forEach(s => {
        const v = state.stats[s];
        const bar = document.getElementById('bar-' + s);
        const val = document.getElementById('val-' + s);
        bar.style.width = v + '%';
        val.textContent = v;
        if (v < 30) {
            bar.style.background = 'var(--danger)';
            val.style.color = 'var(--danger)';
        } else {
            bar.style.background = colors[s];
            val.style.color = 'var(--text-warm)';
        }
    });
    document.getElementById('stat-day').textContent = '第' + state.day + '天';

    const skillNames = { water: 'sk-water', fire: 'sk-fire', shelter: 'sk-shelter', firstaid: 'sk-firstaid' };
    Object.entries(skillNames).forEach(([key, id]) => {
        document.getElementById(id).textContent = 'Lv.' + state.skills[key];
    });
}

function applyEffects(effects) {
    if (!effects) return;
    Object.entries(effects).forEach(([path, delta]) => {
        const current = getNestedValue(state, path);
        if (typeof current === 'number') {
            let newVal = current + delta;
            if (['stats.stamina','stats.hunger','stats.thirst','stats.sanity'].includes(path)) {
                newVal = clamp(newVal, 0, 100);
            }
            setNestedValue(state, path, newVal);
        }
    });
}

function applySkillGain(gain) {
    if (!gain) return;
    Object.entries(gain).forEach(([key, val]) => {
        state.skills[key] = Math.max(state.skills[key], val);
    });
    state.totalSkill = Object.values(state.skills).reduce((a, b) => a + b, 0);
}

function setFlags(flags) {
    if (!flags) return;
    Object.assign(state.flags, flags);
}

// ---- 打字机效果 ----
let typewriterTimer = null;
function typewriter(el, text, speed, callback) {
    clearInterval(typewriterTimer);
    el.innerHTML = '';
    let i = 0;
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    el.appendChild(cursor);

    typewriterTimer = setInterval(() => {
        if (i < text.length) {
            const char = text[i];
            if (char === '\n') {
                el.insertBefore(document.createElement('br'), cursor);
            } else {
                el.insertBefore(document.createTextNode(char), cursor);
            }
            i++;
        } else {
            clearInterval(typewriterTimer);
            setTimeout(() => {
                cursor.remove();
                if (callback) callback();
            }, 400);
        }
    }, speed);
}

// ---- 人物构建 ----
function buildCharacters(container, sceneId) {
    const charMap = {
        // 第1天: 林安站在残骸旁
        day1_wake: () => buildLinanStand(container, '12%'),
        day1_note: () => buildLinanStand(container, '12%'),
        // 第2天: 林安在森林中行走
        day2_start: () => buildLinanStand(container, '20%'),
        day2_fire: () => buildLinanStand(container, '18%'),
        // 第3天: 溪边 + 野狗
        day3_dog: () => {
            buildLinanStand(container, '15%');
            buildDog(container);
        },
        day3_aftermath: () => buildLinanStand(container, '20%'),
        // 第4天: 老陈 + 林安
        day4_oldman: () => {
            buildLinanStand(container, '25%');
            buildOldchen(container);
        },
        day4_quiz: () => {
            buildLinanStand(container, '25%');
            buildOldchen(container);
        },
        day4_result_good: () => {
            buildLinanStand(container, '25%');
            buildOldchen(container);
        },
        day4_result_ok: () => {
            buildLinanStand(container, '25%');
            buildOldchen(container);
        },
        day4_result_bad: () => {
            buildLinanStand(container, '25%');
            buildOldchen(container);
        },
        // 第5天: 林安独行
        day5_final: () => buildLinanStand(container, '45%'),
    };

    if (charMap[sceneId]) charMap[sceneId]();
}

// ---- 场景渲染 ----
function renderScene(sceneId) {
    // 结局自动判定
    if (sceneId === 'ending_check') {
        resolveEnding();
        return;
    }

    const scene = scenes[sceneId];
    if (!scene) return;

    state.day = scene.day || state.day;

    // 转场
    const trans = document.getElementById('transition');
    trans.classList.add('active');

    setTimeout(() => {
        // 更新场景（CSS绘制）
        const bg = document.getElementById('scene-bg');
        bg.innerHTML = '';
        const sceneDiv = document.createElement('div');
        sceneDiv.className = 'scene-layer scene-' + (scene.scene || 'bus-wreckage');
        bg.appendChild(sceneDiv);

        // === 构建场景细节元素 ===
        buildSceneDetails(sceneDiv, scene.scene);

        // === 构建人物 ===
        buildCharacters(sceneDiv, sceneId);

        bg.style.opacity = '1';

        // 更新角色标签
        const charTag = document.getElementById('char-tag');
        if (scene.char && scene.char.tag) {
            charTag.style.display = 'flex';
            document.getElementById('char-name').textContent = scene.char.name;
        } else {
            charTag.style.display = 'none';
        }

        // 更新状态栏
        updateStatsUI();

        // 清除选项
        document.getElementById('choices-area').innerHTML = '';

        // 处理动态文本（检查 state.flags）
        let text = scene.text;
        if (typeof text === 'function') {
            text = text();
        }

        // 打字机效果
        const narText = document.getElementById('narration-text');
        typewriter(narText, text, 35, () => {
            // 显示选项
            renderChoices(scene.choices);
        });

        // 转场淡出
        setTimeout(() => {
            trans.classList.remove('active');
        }, 300);
    }, 600);
}

function renderChoices(choices) {
    const area = document.getElementById('choices-area');
    area.innerHTML = '';

    if (!choices || choices.length === 0) return;

    choices.forEach((choice, idx) => {
        const btn = document.createElement('div');
        btn.className = 'choice-btn';

        // 检查技能锁定
        let locked = false;
        if (choice.requiredSkill) {
            for (const [sk, lv] of Object.entries(choice.requiredSkill)) {
                if (state.skills[sk] < lv) locked = true;
            }
        }
        if (locked) btn.classList.add('is-locked');

        let html = '<span class="choice-icon">&#9654;</span><div class="choice-content">';
        html += '<div class="choice-main-text">' + choice.text + '</div>';
        if (choice.hint) {
            html += '<div class="choice-hint">' + choice.hint + '</div>';
        }
        if (locked && choice.requiredSkill) {
            const reqText = Object.entries(choice.requiredSkill).map(([k,v]) => k + ' Lv.' + v).join(', ');
            html += '<div class="choice-locked">&#128274; 需要技能: ' + reqText + '</div>';
        }
        html += '</div>';
        btn.innerHTML = html;

        if (!locked) {
            btn.addEventListener('click', () => handleChoice(choice));
        }

        area.appendChild(btn);
    });
}

function handleChoice(choice) {
    // 禁用所有按钮
    document.querySelectorAll('.choice-btn').forEach(b => {
        b.style.pointerEvents = 'none';
        b.style.opacity = '0.3';
    });

    // 应用效果
    applyEffects(choice.effects);
    applySkillGain(choice.skillGain);
    setFlags(choice.flag);

    // 屏幕震动（重要抉择）
    if (choice.effects && choice.effects['stats.sanity'] && Math.abs(choice.effects['stats.sanity']) >= 10) {
        document.getElementById('game').classList.add('shake');
        setTimeout(() => document.getElementById('game').classList.remove('shake'), 400);
    }

    // Toast 通知
    if (choice.toast) {
        showToast(choice.toast);
    }

    // 成就
    if (choice.achievement && !state.achievements.includes(choice.achievement.id)) {
        state.achievements.push(choice.achievement.id);
        setTimeout(() => showAchievement(choice.achievement.icon, choice.achievement.name), 800);
    }

    // 知识卡片
    if (choice.knowledge) {
        setTimeout(() => showKnowledge(choice.knowledge), 1200);
    }

    // 更新状态
    updateStatsUI();

    // 心理韧性保护
    if (state.stats.sanity < 30) {
        setTimeout(() => {
            showToast('&#129504; 你感到有些疲惫和孤独。在现实中，感到疲惫时记得休息，可以和信任的人聊聊。');
        }, 2500);
    }

    // 跳转下一场景
    const delay = choice.knowledge ? 3000 : (choice.achievement ? 2500 : 1200);
    setTimeout(() => {
        renderScene(choice.next);
    }, delay);
}

// ---- 结局判定 ----
function resolveEnding() {
    let endingKey;

    // 守护者：帮助行为 + 技能等级 + 心理韧性
    if (state.helpCount >= 1 && state.totalSkill >= 3 && state.stats.sanity >= 50) {
        endingKey = 'guardian';
    }
    // 独行者：高技能 + 独自前行选择
    else if (state.flags.lone_wolf || (state.totalSkill >= 4 && state.helpCount < 1)) {
        endingKey = 'lone_wolf';
    }
    // 迷失者：低心理韧性
    else if (state.stats.sanity < 40 || state.flags.exhausted) {
        endingKey = 'lost';
    }
    // 默认：根据利他倾向
    else if (state.flags.altruist) {
        endingKey = 'guardian';
    } else {
        endingKey = 'lone_wolf';
    }

    showEnding(endingKey);
}

function showEnding(key) {
    const ending = endings[key];
    const screen = document.getElementById('ending-screen');

    // 转场
    document.getElementById('transition').classList.add('active');

    setTimeout(() => {
        document.getElementById('end-icon').innerHTML = ending.icon;
        document.getElementById('end-title').textContent = ending.title;
        document.getElementById('end-title').style.color = ending.color;
        document.getElementById('end-text').innerHTML = ending.text.replace(/\n/g, '<br>');

        // 统计
        const statsHTML = `
            <div class="ending-stat"><div class="ending-stat-val">${state.day}</div><div class="ending-stat-label">生存天数</div></div>
            <div class="ending-stat"><div class="ending-stat-val">${state.totalSkill}</div><div class="ending-stat-label">技能等级总和</div></div>
            <div class="ending-stat"><div class="ending-stat-val">${state.achievements.length}</div><div class="ending-stat-label">成就解锁</div></div>
            <div class="ending-stat"><div class="ending-stat-val">${state.stats.sanity}%</div><div class="ending-stat-label">心理韧性</div></div>
        `;
        document.getElementById('end-stats').innerHTML = statsHTML;
        document.getElementById('end-unlock').textContent = '已解锁结局 1/3 — ' + ending.title;

        // 结局场景背景
        const bg = document.getElementById('scene-bg');
        bg.innerHTML = '';
        const sceneDiv = document.createElement('div');
        sceneDiv.className = 'scene-layer scene-settlement';
        bg.appendChild(sceneDiv);
        buildSceneDetails(sceneDiv, 'settlement');
        // 结局画面中显示林安剪影
        buildLinanStand(sceneDiv, '45%');

        // 隐藏游戏UI
        document.getElementById('status-bar').classList.remove('visible');
        document.getElementById('narrative-area').classList.remove('visible');
        document.getElementById('bottom-bar').classList.remove('visible');

        screen.classList.add('visible');

        setTimeout(() => {
            document.getElementById('transition').classList.remove('active');
        }, 500);
    }, 800);
}

// ---- UI 弹窗 ----
function showToast(html) {
    const toast = document.getElementById('toast');
    toast.innerHTML = html;
    toast.classList.add('visible');
    setTimeout(() => toast.classList.remove('visible'), 2500);
}

function showAchievement(icon, name) {
    const popup = document.getElementById('achievement-popup');
    document.getElementById('ach-icon').innerHTML = icon;
    document.getElementById('ach-name').textContent = name;
    popup.classList.add('visible');
    setTimeout(() => popup.classList.remove('visible'), 3000);
}

function showKnowledge(key) {
    const data = knowledgeDB[key];
    if (!data) return;
    document.getElementById('kc-title').textContent = data.title;
    document.getElementById('kc-body').innerHTML = data.body;
    document.getElementById('kc-source').textContent = data.source;
    document.getElementById('knowledge-overlay').classList.add('visible');
}

function closeKnowledge(e) {
    if (e && e.target !== document.getElementById('knowledge-overlay')) return;
    document.getElementById('knowledge-overlay').classList.remove('visible');
}

// ---- 灰烬粒子 ----
function createAshParticles() {
    const container = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
        const ash = document.createElement('div');
        ash.className = 'ash';
        const size = 1 + Math.random() * 3;
        ash.style.width = size + 'px';
        ash.style.height = size + 'px';
        ash.style.left = (Math.random() * 100) + '%';
        ash.style.background = `rgba(${180 + Math.random()*40}, ${160 + Math.random()*30}, ${120 + Math.random()*30}, ${0.3 + Math.random()*0.4})`;
        ash.style.animationDuration = (8 + Math.random() * 15) + 's';
        ash.style.animationDelay = (Math.random() * 10) + 's';
        container.appendChild(ash);
    }
}

// ---- 开始 / 重新开始 ----
function startGame() {
    document.getElementById('title-screen').classList.add('hidden');
    setTimeout(() => {
        document.getElementById('title-screen').style.display = 'none';
        document.getElementById('status-bar').classList.add('visible');
        document.getElementById('narrative-area').classList.add('visible');
        document.getElementById('bottom-bar').classList.add('visible');
        renderScene('day1_wake');
    }, 1000);
}

function restartGame() {
    // 重置状态
    state.day = 1;
    state.stats = { stamina: 80, hunger: 60, thirst: 50, sanity: 70 };
    state.skills = { water: 0, fire: 0, shelter: 0, firstaid: 0 };
    state.helpCount = 0;
    state.totalSkill = 0;
    state.achievements = [];
    state.flags = {};

    document.getElementById('ending-screen').classList.remove('visible');
    document.getElementById('status-bar').classList.add('visible');
    document.getElementById('narrative-area').classList.add('visible');
    document.getElementById('bottom-bar').classList.add('visible');
    renderScene('day1_wake');
}

// ---- 初始化 ----
createAshParticles();
