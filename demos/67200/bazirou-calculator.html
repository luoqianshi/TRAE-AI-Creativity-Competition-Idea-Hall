<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>把子肉热量刺客——大明湖跑步换算器</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: #FDF6E3;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(232, 168, 56, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(212, 118, 42, 0.06) 0%, transparent 50%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #4A3728;
        }

        .newspaper-card {
            max-width: 600px;
            width: 100%;
            background: linear-gradient(135deg, #FFFBF0 0%, #FFF5E1 100%);
            border-radius: 24px;
            box-shadow: 
                0 4px 6px rgba(139, 69, 19, 0.05),
                0 10px 40px rgba(139, 69, 19, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            padding: 48px 40px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(212, 118, 42, 0.15);
        }

        .newspaper-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #E8A838, #D4762A, #E8A838);
        }

        .newspaper-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #E8A838, #D4762A, #E8A838);
        }

        /* 报纸装饰边角 */
        .corner-decoration {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid rgba(212, 118, 42, 0.25);
        }

        .corner-tl { top: 16px; left: 16px; border-right: none; border-bottom: none; }
        .corner-tr { top: 16px; right: 16px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 16px; left: 16px; border-right: none; border-top: none; }
        .corner-br { bottom: 16px; right: 16px; border-left: none; border-top: none; }

        /* 头部 */
        .header {
            text-align: center;
            margin-bottom: 32px;
            position: relative;
        }

        .newspaper-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #A0826D;
            letter-spacing: 1px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px dashed rgba(212, 118, 42, 0.3);
        }

        .main-title {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 42px;
            font-weight: 900;
            color: #C45D1A;
            text-shadow: 2px 2px 0px rgba(232, 168, 56, 0.3);
            margin-bottom: 8px;
            letter-spacing: 2px;
            animation: titleBounce 1s ease-out;
        }

        @keyframes titleBounce {
            0% { transform: translateY(-20px); opacity: 0; }
            50% { transform: translateY(5px); }
            100% { transform: translateY(0); opacity: 1; }
        }

        .subtitle {
            font-size: 18px;
            color: #8B6914;
            font-style: italic;
            letter-spacing: 1px;
        }

        /* 装饰分隔线 */
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: #D4762A;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #D4762A, transparent);
        }

        .divider span {
            padding: 0 16px;
        }

        /* 插画区域 */
        .illustration-section {
            text-align: center;
            margin: 28px 0;
            position: relative;
        }

        .lake-scene {
            width: 220px;
            height: 140px;
            margin: 0 auto 16px;
            position: relative;
            background: linear-gradient(180deg, #87CEEB 0%, #B8E0F0 40%, #4A90A4 100%);
            border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
            overflow: hidden;
            box-shadow: 
                0 4px 15px rgba(74, 144, 164, 0.3),
                inset 0 -10px 20px rgba(0, 0, 0, 0.1);
            animation: lakeFloat 3s ease-in-out infinite;
        }

        @keyframes lakeFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* 太阳 */
        .sun {
            position: absolute;
            top: 15px;
            right: 30px;
            width: 28px;
            height: 28px;
            background: #FFD93D;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 217, 61, 0.5);
        }

        /* 山 */
        .mountain {
            position: absolute;
            bottom: 30px;
            width: 0;
            height: 0;
            border-style: solid;
        }

        .mountain-1 {
            left: 30px;
            border-width: 0 35px 50px 35px;
            border-color: transparent transparent #6B8E6B transparent;
        }

        .mountain-2 {
            left: 70px;
            border-width: 0 45px 65px 45px;
            border-color: transparent transparent #5A7A5A transparent;
        }

        .mountain-3 {
            right: 40px;
            border-width: 0 30px 40px 30px;
            border-color: transparent transparent #7A9E7A transparent;
        }

        /* 湖水波纹 */
        .water-ripple {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 35px;
            background: linear-gradient(180deg, rgba(74, 144, 164, 0.3) 0%, #3A7A8A 100%);
        }

        .water-ripple::before,
        .water-ripple::after {
            content: '';
            position: absolute;
            left: 10%;
            right: 10%;
            height: 2px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }

        .water-ripple::before { top: 8px; }
        .water-ripple::after { top: 18px; left: 20%; right: 20%; }

        /* 小船 */
        .boat {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            animation: boatRock 2s ease-in-out infinite;
        }

        @keyframes boatRock {
            0%, 100% { transform: translateX(-50%) rotate(-2deg); }
            50% { transform: translateX(-50%) rotate(2deg); }
        }

        .boat-body {
            width: 40px;
            height: 12px;
            background: #8B4513;
            border-radius: 0 0 20px 20px;
            position: relative;
        }

        .boat-sail {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 20px solid #F5F5DC;
        }

        .lake-caption {
            font-size: 16px;
            color: #8B4513;
            font-style: italic;
            letter-spacing: 1px;
            margin-top: 12px;
        }

        /* 输入区域 */
        .input-section {
            margin: 28px 0;
        }

        .input-row {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            padding: 14px 18px;
            background: rgba(255, 248, 235, 0.8);
            border-radius: 16px;
            border: 1px dashed rgba(212, 118, 42, 0.3);
            transition: all 0.3s ease;
        }

        .input-row:hover {
            background: rgba(255, 248, 235, 1);
            border-style: solid;
            box-shadow: 0 2px 8px rgba(212, 118, 42, 0.1);
            transform: translateX(4px);
        }

        .input-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 14px;
            flex-shrink: 0;
        }

        .icon-meat { background: rgba(196, 93, 26, 0.15); }
        .icon-rice { background: rgba(218, 165, 32, 0.15); }
        .icon-garlic { background: rgba(107, 142, 35, 0.15); }

        .input-label {
            flex: 1;
            font-size: 15px;
            color: #6B4423;
            font-weight: 600;
        }

        .input-value {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 20px;
            color: #C45D1A;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 16px;
            border-radius: 20px;
            border: 2px solid rgba(212, 118, 42, 0.2);
            min-width: 60px;
            text-align: center;
        }

        /* 按钮 */
        .calculate-btn {
            display: block;
            width: 100%;
            padding: 18px 32px;
            margin: 24px 0;
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 22px;
            color: #FFF;
            background: linear-gradient(135deg, #E8A838 0%, #D4762A 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 
                0 4px 15px rgba(212, 118, 42, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 20px rgba(212, 118, 42, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .calculate-btn:active {
            transform: translateY(0);
        }

        .calculate-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255, 255, 255, 0.2) 50%,
                transparent 70%
            );
            transform: rotate(45deg) translateY(-100%);
            transition: transform 0.6s;
        }

        .calculate-btn:hover::after {
            transform: rotate(45deg) translateY(100%);
        }

        /* 结果区域 */
        .result-area {
            background: linear-gradient(135deg, rgba(232, 168, 56, 0.12) 0%, rgba(212, 118, 42, 0.08) 100%);
            border-radius: 20px;
            padding: 28px 24px;
            text-align: center;
            border: 2px solid rgba(232, 168, 56, 0.25);
            position: relative;
            margin: 20px 0;
        }

        .result-area::before {
            content: '✦';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: #FFFBF0;
            padding: 0 12px;
            color: #E8A838;
            font-size: 18px;
        }

        .result-text {
            font-size: 20px;
            line-height: 1.8;
            color: #8B4513;
            font-weight: 700;
        }

        .result-number {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 36px;
            color: #C45D1A;
            text-shadow: 1px 1px 0 rgba(232, 168, 56, 0.3);
            display: inline-block;
            margin: 0 4px;
        }

        .result-highlight {
            color: #D4762A;
            font-weight: 900;
        }

        /* Footer */
        .footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px dashed rgba(212, 118, 42, 0.3);
            text-align: center;
        }

        .footer-quote {
            font-size: 15px;
            color: #A0826D;
            font-style: italic;
            line-height: 1.6;
            position: relative;
            display: inline-block;
        }

        .footer-quote::before,
        .footer-quote::after {
            content: '"';
            font-size: 24px;
            color: #E8A838;
            font-family: serif;
            line-height: 1;
        }

        .footer-quote::before {
            margin-right: 4px;
            vertical-align: top;
        }

        .footer-quote::after {
            margin-left: 4px;
            vertical-align: bottom;
        }

        .footer-author {
            margin-top: 8px;
            font-size: 13px;
            color: #C4A882;
        }

        /* 报纸角落装饰图案 */
        .newspaper-pattern {
            position: absolute;
            opacity: 0.06;
            pointer-events: none;
        }

        .pattern-1 {
            top: 60px;
            right: 20px;
            font-size: 80px;
            transform: rotate(15deg);
        }

        .pattern-2 {
            bottom: 100px;
            left: 15px;
            font-size: 60px;
            transform: rotate(-10deg);
        }

        /* 动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        .delay-5 { animation-delay: 0.5s; }

        /* 响应式 */
        @media (max-width: 480px) {
            .newspaper-card {
                padding: 32px 24px;
            }
            .main-title {
                font-size: 32px;
            }
            .subtitle {
                font-size: 15px;
            }
            .input-row {
                padding: 12px 14px;
            }
            .calculate-btn {
                font-size: 18px;
                padding: 16px 24px;
            }
            .result-text {
                font-size: 17px;
            }
            .result-number {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="newspaper-card">
        <!-- 装饰边角 -->
        <div class="corner-decoration corner-tl"></div>
        <div class="corner-decoration corner-tr"></div>
        <div class="corner-decoration corner-bl"></div>
        <div class="corner-decoration corner-br"></div>

        <!-- 背景装饰 -->
        <div class="newspaper-pattern pattern-1">🍖</div>
        <div class="newspaper-pattern pattern-2">🏃</div>

        <!-- 头部 -->
        <header class="header">
            <div class="newspaper-meta">
                <span>济南特刊</span>
                <span>第壹期</span>
                <span>超意兴专版</span>
            </div>
            <h1 class="main-title">把子肉热量刺客</h1>
            <p class="subtitle">你今天的午餐，要跑几个大明湖？</p>
        </header>

        <div class="divider"><span>◆ ◆ ◆</span></div>

        <!-- 插画区域 -->
        <section class="illustration-section animate-in delay-1">
            <div class="lake-scene">
                <div class="sun"></div>
                <div class="mountain mountain-1"></div>
                <div class="mountain mountain-2"></div>
                <div class="mountain mountain-3"></div>
                <div class="water-ripple"></div>
                <div class="boat">
                    <div class="boat-sail"></div>
                    <div class="boat-body"></div>
                </div>
            </div>
            <p class="lake-caption">每一块把子肉，都在等你赎罪。</p>
        </section>

        <div class="divider"><span>◆ ◆ ◆</span></div>

        <!-- 输入区域 -->
        <section class="input-section animate-in delay-2">
            <div class="input-row">
                <div class="input-icon icon-meat">🥩</div>
                <span class="input-label">几块把子肉？</span>
                <span class="input-value">3块</span>
            </div>
            <div class="input-row">
                <div class="input-icon icon-rice">🍚</div>
                <span class="input-label">几碗米饭？</span>
                <span class="input-value">1碗</span>
            </div>
            <div class="input-row">
                <div class="input-icon icon-garlic">🧄</div>
                <span class="input-label">几瓣蒜？</span>
                <span class="input-value">2瓣</span>
            </div>
        </section>

        <!-- 按钮 -->
        <button class="calculate-btn animate-in delay-3">
            算算你今天要跑几圈
        </button>

        <!-- 结果区域 -->
        <section class="result-area animate-in delay-4">
            <p class="result-text">
                你大约需要跑 <span class="result-number">2.5</span> 圈大明湖<br>
                （约 <span class="result-highlight">12 公里</span>）<br>
                才能消耗掉今天的罪恶感。
            </p>
        </section>

        <!-- Footer -->
        <footer class="footer animate-in delay-5">
            <p class="footer-quote">吃饱了不想家，跑完了才踏实。</p>
            <p class="footer-author">——来自一位超意兴常客</p>
        </footer>
    </div>

    <script>
        // 简单的点击效果
        document.querySelector('.calculate-btn').addEventListener('click', function() {
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                this.style.transform = '';
            }, 150);
        });

        // 输入框悬停效果增强
        document.querySelectorAll('.input-row').forEach(row => {
            row.addEventListener('mouseenter', function() {
                this.querySelector('.input-value').style.borderColor = '#E8A838';
            });
            row.addEventListener('mouseleave', function() {
                this.querySelector('.input-value').style.borderColor = 'rgba(212, 118, 42, 0.2)';
            });
        });
    </script>
</body>
</html>
