<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memo · 备忘录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
    --bg: #14141a;
    --surface: #1e1e26;
    --surface-2: #26262f;
    --surface-3: #2d2d38;
    --border: #2d2d38;
    --border-soft: #232330;
    --text: #e8e8ed;
    --text-muted: #8a8a96;
    --text-faint: #5a5a66;
    --accent: #ff8c42;
    --accent-hover: #ff7a25;
    --accent-soft: rgba(255, 140, 66, 0.15);
    --success: #4ade80;
    --warning: #fbbf24;
    --danger: #f87171;
    --info: #60a5fa;
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    --radius: 12px;
    --radius-sm: 8px;
    --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="light"] {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface-2: #f0f0f3;
    --surface-3: #e8e8ec;
    --border: #e0e0e5;
    --border-soft: #ededf0;
    --text: #1a1a1f;
    --text-muted: #6b6b75;
    --text-faint: #a0a0aa;
    --accent-soft: rgba(255, 140, 66, 0.12);
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    transition: background 0.3s ease;
}

body::before {
    content: '';
    position: fixed;
    top: -200px;
    right: -200px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
}

.app {
    display: grid;
    grid-template-columns: 260px 320px 1fr;
    height: 100vh;
    position: relative;
    z-index: 1;
}

/* 侧边栏 */
.sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 24px 16px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 8px 24px;
    border-bottom: 1px solid var(--border-soft);
    margin-bottom: 20px;
}

.logo-icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--accent), #ff6b1a);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 16px;
    box-shadow: 0 4px 12px var(--accent-soft);
}

.logo-text {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.logo-text span { color: var(--accent); }

.nav-section { margin-bottom: 24px; }

.nav-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-faint);
    font-weight: 600;
    padding: 0 8px 8px;
}

.nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--text-muted);
    font-weight: 500;
    transition: var(--transition);
    margin-bottom: 2px;
    user-select: none;
}

.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); }
.nav-item i { width: 18px; text-align: center; font-size: 14px; }

.nav-item .count {
    margin-left: auto;
    font-size: 11px;
    background: var(--surface-2);
    padding: 2px 8px;
    border-radius: 10px;
    color: var(--text-muted);
    font-weight: 600;
}

.nav-item.active .count { background: var(--accent); color: white; }

.tag-list { flex: 1; overflow-y: auto; }

.tag-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--text-muted);
    transition: var(--transition);
    margin-bottom: 2px;
    font-size: 13px;
}

.tag-item:hover { background: var(--surface-2); color: var(--text); }
.tag-item.active { background: var(--accent-soft); color: var(--accent); }

.tag-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
}

.sidebar-footer { padding-top: 16px; border-top: 1px solid var(--border-soft); }

.stat-card {
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    padding: 14px;
}

.stat-value {
    font-size: 24px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
}

.stat-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 4px;
}

/* 列表面板 */
.list-panel {
    background: var(--bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
}

.list-header {
    padding: 24px 24px 16px;
    border-bottom: 1px solid var(--border-soft);
}

.list-header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}

.list-title {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.btn-new {
    background: var(--accent);
    color: white;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    box-shadow: 0 4px 12px var(--accent-soft);
}

.btn-new:hover { background: var(--accent-hover); transform: translateY(-1px); }
.btn-new:active { transform: translateY(0); }

.search-box { position: relative; }

.search-box i {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-faint);
    font-size: 13px;
}

.search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px 10px 38px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    transition: var(--transition);
}

.search-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
}

.search-input::placeholder { color: var(--text-faint); }

.memo-list { flex: 1; overflow-y: auto; padding: 12px; }

.memo-item {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 14px 16px 14px 18px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
    animation: slideIn 0.25s ease;
}

@keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}

.memo-item:hover { border-color: var(--border); transform: translateX(2px); }
.memo-item.active { border-color: var(--accent); background: var(--surface-2); }
.memo-item.active::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
}

.memo-item.pinned::after {
    content: '\f08d';
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    position: absolute;
    top: 12px;
    right: 14px;
    color: var(--accent);
    font-size: 11px;
    transform: rotate(45deg);
}

.priority-bar {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
}

.priority-high { background: var(--danger); }
.priority-medium { background: var(--warning); }
.priority-low { background: var(--info); }

.memo-item-title {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 4px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding-right: 20px;
}

.memo-item-preview {
    font-size: 12px;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    margin-bottom: 8px;
    line-height: 1.5;
}

.memo-item-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-faint);
    flex-wrap: wrap;
}

.memo-item-tags { display: flex; gap: 4px; flex-wrap: wrap; }

.memo-tag {
    background: var(--surface-3);
    color: var(--text-muted);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 500;
}

.memo-item.completed .memo-item-title {
    text-decoration: line-through;
    color: var(--text-faint);
}

/* 编辑器 */
.editor-panel {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.editor-toolbar {
    padding: 14px 32px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.toolbar-group { display: flex; align-items: center; gap: 6px; }

.tool-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
    width: 34px;
    height: 34px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
}

.tool-btn:hover { background: var(--surface-2); color: var(--text); }
.tool-btn.active { background: var(--accent-soft); color: var(--accent); }
.tool-btn.danger:hover { background: rgba(248, 113, 113, 0.15); color: var(--danger); }

.tool-divider {
    width: 1px;
    height: 20px;
    background: var(--border);
    margin: 0 4px;
}

.editor-content {
    flex: 1;
    overflow-y: auto;
    padding: 32px 48px;
}

.editor-title-input {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 28px;
    font-weight: 800;
    font-family: inherit;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
    outline: none;
}

.editor-title-input::placeholder { color: var(--text-faint); }

.editor-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 12px;
    color: var(--text-faint);
    margin-bottom: 24px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border-soft);
}

.editor-meta i { margin-right: 4px; }

.editor-body {
    width: 100%;
    min-height: 400px;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    line-height: 1.8;
    outline: none;
    resize: none;
}

.editor-body::placeholder { color: var(--text-faint); }

.editor-footer {
    padding: 12px 32px;
    border-top: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-faint);
}

.tag-input-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1;
}

.tag-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--surface-2);
    color: var(--text);
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
}

.tag-chip i {
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.2s;
    font-size: 9px;
}

.tag-chip i:hover { opacity: 1; }

.tag-input {
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 12px;
    outline: none;
    width: 90px;
    font-family: inherit;
}

.tag-input::placeholder { color: var(--text-faint); }

.empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-faint);
    text-align: center;
    padding: 40px;
}

.empty-icon {
    font-size: 64px;
    margin-bottom: 16px;
    opacity: 0.25;
}

.empty-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 8px;
}

.empty-desc {
    font-size: 13px;
    max-width: 320px;
    line-height: 1.6;
}

.priority-select {
    display: flex;
    gap: 2px;
    background: var(--surface-2);
    padding: 3px;
    border-radius: 8px;
}

.priority-option {
    padding: 5px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 11px;
    color: var(--text-muted);
    transition: var(--transition);
    border: none;
    background: transparent;
    font-family: inherit;
    font-weight: 600;
}

.priority-option:hover { color: var(--text); }
.priority-option.active.high { background: var(--danger); color: white; }
.priority-option.active.medium { background: var(--warning); color: white; }
.priority-option.active.low { background: var(--info); color: white; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border); }

/* Toast */
.toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface-3);
    color: var(--text);
    padding: 12px 20px;
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow);
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 1000;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.toast i { color: var(--success); }

/* 模态框 */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.modal-overlay.show { display: flex; }

.modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    max-width: 400px;
    width: 90%;
    box-shadow: var(--shadow);
    animation: modalIn 0.2s ease;
}

@keyframes modalIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}

.modal-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
}

.modal-desc {
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 20px;
    line-height: 1.5;
}

.modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
}

.btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    font-weight: 600;
    transition: var(--transition);
}

.btn:hover { background: var(--surface-3); }

.btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
}

.btn-primary:hover { background: var(--accent-hover); }

.btn-danger {
    background: var(--danger);
    border-color: var(--danger);
    color: white;
}

.btn-danger:hover { background: #ef4444; }

@media (max-width: 1024px) {
    .app { grid-template-columns: 220px 280px 1fr; }
    .editor-content { padding: 24px 32px; }
}
</style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="fa-solid fa-bookmark"></i></div>
            <div class="logo-text">Memo<span>.</span></div>
        </div>
        
        <div class="nav-section">
            <div class="nav-title">视图</div>
            <div class="nav-item active" data-filter="all">
                <i class="fa-solid fa-inbox"></i>
                <span>全部</span>
                <span class="count" id="count-all">0</span>
            </div>
            <div class="nav-item" data-filter="today">
                <i class="fa-solid fa-sun"></i>
                <span>今天</span>
                <span class="count" id="count-today">0</span>
            </div>
            <div class="nav-item" data-filter="pinned">
                <i class="fa-solid fa-thumbtack"></i>
                <span>置顶</span>
                <span class="count" id="count-pinned">0</span>
            </div>
            <div class="nav-item" data-filter="completed">
                <i class="fa-solid fa-check-double"></i>
                <span>已完成</span>
                <span class="count" id="count-completed">0</span>
            </div>
        </div>
        
        <div class="nav-section tag-list">
            <div class="nav-title">标签</div>
            <div id="tag-list-content"></div>
        </div>
        
        <div class="sidebar-footer">
            <div class="stat-card">
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label">条备忘录</div>
            </div>
        </div>
    </aside>
    
    <section class="list-panel">
        <div class="list-header">
            <div class="list-header-top">
                <h1 class="list-title" id="list-title">全部</h1>
                <button class="btn-new" id="btn-new" title="新建备忘录 (Ctrl+N)">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" class="search-input" id="search-input" placeholder="搜索标题或内容...">
            </div>
        </div>
        <div class="memo-list" id="memo-list"></div>
    </section>
    
    <section class="editor-panel">
        <div id="editor-area" style="display: none; flex: 1; flex-direction: column; overflow: hidden;">
            <div class="editor-toolbar">
                <div class="toolbar-group">
                    <button class="tool-btn" id="btn-pin" title="置顶">
                        <i class="fa-solid fa-thumbtack"></i>
                    </button>
                    <button class="tool-btn" id="btn-complete" title="标记完成">
                        <i class="fa-solid fa-check"></i>
                    </button>
                    <div class="tool-divider"></div>
                    <div class="priority-select">
                        <button class="priority-option" data-priority="low">低</button>
                        <button class="priority-option" data-priority="medium">中</button>
                        <button class="priority-option" data-priority="high">高</button>
                    </div>
                </div>
                <div class="toolbar-group">
                    <button class="tool-btn" id="btn-export" title="导出为 Markdown">
                        <i class="fa-solid fa-download"></i>
                    </button>
                    <button class="tool-btn" id="btn-theme" title="切换主题">
                        <i class="fa-solid fa-sun"></i>
                    </button>
                    <div class="tool-divider"></div>
                    <button class="tool-btn danger" id="btn-delete" title="删除">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            </div>
            <div class="editor-content">
                <input type="text" class="editor-title-input" id="editor-title" placeholder="标题">
                <div class="editor-meta">
                    <span><i class="fa-regular fa-calendar"></i><span id="meta-date"></span></span>
                    <span><i class="fa-regular fa-clock"></i><span id="meta-time"></span></span>
                    <span><i class="fa-solid fa-font"></i><span id="meta-words">0</span> 字</span>
                </div>
                <textarea class="editor-body" id="editor-body" placeholder="开始记录你的想法..."></textarea>
            </div>
            <div class="editor-footer">
                <div class="tag-input-wrap" id="tag-input-wrap">
                    <i class="fa-solid fa-tag" style="color: var(--text-faint); font-size: 11px;"></i>
                    <input type="text" class="tag-input" id="tag-input" placeholder="添加标签后回车...">
                </div>
                <span id="save-status">已保存</span>
            </div>
        </div>
        
        <div class="empty-state" id="empty-state">
            <div class="empty-icon"><i class="fa-regular fa-note-sticky"></i></div>
            <div class="empty-title">选择一条备忘录</div>
            <div class="empty-desc">从左侧选择一条备忘录查看或编辑，或点击右上角加号按钮创建新备忘录</div>
        </div>
    </section>
</div>

<div class="toast" id="toast">
    <i class="fa-solid fa-check-circle"></i>
    <span id="toast-msg">操作成功</span>
</div>

<div class="modal-overlay" id="modal-delete">
    <div class="modal">
        <div class="modal-title">删除备忘录</div>
        <div class="modal-desc">确定要删除这条备忘录吗？此操作无法撤销。</div>
        <div class="modal-actions">
            <button class="btn" id="btn-cancel-delete">取消</button>
            <button class="btn btn-danger" id="btn-confirm-delete">删除</button>
        </div>
    </div>
</div>

<script>
const STORAGE_KEY = 'memo_app_data';
const THEME_KEY = 'memo_app_theme';

let memos = [];
let currentMemoId = null;
let currentFilter = 'all';
let currentTag = null;
let searchQuery = '';
let saveTimer = null;

function init() {
    loadData();
    loadTheme();
    
    if (memos.length === 0) addSampleData();
    
    renderAll();
    bindEvents();
}

function addSampleData() {
    const now = Date.now();
    memos = [
        {
            id: generateId(),
            title: '欢迎使用 Memo 备忘录',
            body: '这是一个简洁、高效的本地备忘录应用。\n\n主要功能：\n• 创建、编辑、删除备忘录\n• 置顶重要内容\n• 设置优先级（高 / 中 / 低）\n• 添加标签分类\n• 实时搜索\n• 自动保存到浏览器本地\n• 暗 / 亮主题切换\n• 导出为 Markdown\n\n所有数据都保存在你的浏览器本地，无需联网，保护隐私。\n\n快捷键：\nCtrl + N  新建备忘录\nCtrl + F  搜索\n\n试着创建一条新的备忘录吧！',
            priority: 'high',
            pinned: true,
            completed: false,
            tags: ['教程', '常用'],
            createdAt: now,
            updatedAt: now
        },
        {
            id: generateId(),
            title: '本周工作计划',
            body: '周一：完成项目原型设计\n周二：与团队评审需求\n周三：开始前端开发\n周四：接口联调\n周五：测试与 bug 修复\n\n备注：每天早上 10 点站会',
            priority: 'medium',
            pinned: false,
            completed: false,
            tags: ['工作'],
            createdAt: now - 86400000,
            updatedAt: now - 86400000
        },
        {
            id: generateId(),
            title: '读书笔记 - 深度工作',
            body: '核心观点：\n1. 深度工作能力越来越稀缺，同时越来越有价值\n2. 两个关键能力：快速掌握复杂事物、产出高质量速度\n3. 四种深度工作哲学：禁欲式、双峰式、节奏式、新闻记者式\n\n行动项：\n- 每天预留 90 分钟无干扰工作时间\n- 关闭社交媒体通知\n- 定期冥想训练专注力',
            priority: 'low',
            pinned: false,
            completed: false,
            tags: ['学习', '阅读'],
            createdAt: now - 172800000,
            updatedAt: now - 172800000
        },
        {
            id: generateId(),
            title: '周末购物清单',
            body: '• 牛奶 2 盒\n• 鸡蛋 1 板\n• 水果（苹果、香蕉）\n• 蔬菜（西兰花、番茄）\n• 面包\n• 咖啡豆',
            priority: 'low',
            pinned: false,
            completed: true,
            tags: ['生活'],
            createdAt: now - 259200000,
            updatedAt: now - 259200000
        }
    ];
    saveData();
}

function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
}

function loadData() {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data) {
        try { memos = JSON.parse(data); } catch (e) { memos = []; }
    }
}

function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(memos));
}

function loadTheme() {
    const theme = localStorage.getItem(THEME_KEY) || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    updateThemeIcon(theme);
}

function updateThemeIcon(theme) {
    const btn = document.getElementById('btn-theme');
    if (btn) {
        btn.innerHTML = theme === 'dark' 
            ? '<i class="fa-solid fa-sun"></i>' 
            : '<i class="fa-solid fa-moon"></i>';
    }
}

function renderAll() {
    renderMemoList();
    renderTagList();
    updateCounts();
    updateStats();
}

function getFilteredMemos() {
    let filtered = [...memos];
    
    if (currentFilter === 'today') {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        filtered = filtered.filter(m => m.createdAt >= today.getTime());
    } else if (currentFilter === 'pinned') {
        filtered = filtered.filter(m => m.pinned);
    } else if (currentFilter === 'completed') {
        filtered = filtered.filter(m => m.completed);
    }
    
    if (currentTag) {
        filtered = filtered.filter(m => m.tags && m.tags.includes(currentTag));
    }
    
    if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(m => 
            (m.title || '').toLowerCase().includes(q) || 
            (m.body || '').toLowerCase().includes(q)
        );
    }
    
    filtered.sort((a, b) => {
        if (a.pinned && !b.pinned) return -1;
        if (!a.pinned && b.pinned) return 1;
        return b.updatedAt - a.updatedAt;
    });
    
    return filtered;
}

function renderMemoList() {
    const list = document.getElementById('memo-list');
    const filtered = getFilteredMemos();
    
    if (filtered.length === 0) {
        list.innerHTML = `
            <div style="text-align: center; padding: 60px 20px; color: var(--text-faint);">
                <i class="fa-regular fa-folder-open" style="font-size: 36px; opacity: 0.3; margin-bottom: 12px; display: block;"></i>
                <div style="font-size: 13px;">没有找到备忘录</div>
            </div>
        `;
        return;
    }
    
    list.innerHTML = filtered.map(m => `
        <div class="memo-item ${m.id === currentMemoId ? 'active' : ''} ${m.pinned ? 'pinned' : ''} ${m.completed ? 'completed' : ''}" 
             data-id="${m.id}">
            <div class="priority-bar priority-${m.priority || 'low'}"></div>
            <div class="memo-item-title">${escapeHtml(m.title || '无标题')}</div>
            <div class="memo-item-preview">${escapeHtml(m.body || '无内容')}</div>
            <div class="memo-item-meta">
                <span><i class="fa-regular fa-clock"></i> ${formatDate(m.updatedAt)}</span>
                ${m.tags && m.tags.length ? `
                    <div class="memo-item-tags">
                        ${m.tags.map(t => `<span class="memo-tag">${escapeHtml(t)}</span>`).join('')}
                    </div>
                ` : ''}
            </div>
        </div>
    `).join('');
    
    list.querySelectorAll('.memo-item').forEach(item => {
        item.addEventListener('click', () => selectMemo(item.dataset.id));
    });
}

function renderTagList() {
    const tagContainer = document.getElementById('tag-list-content');
    const tagSet = new Map();
    
    memos.forEach(m => {
        if (m.tags) {
            m.tags.forEach(t => tagSet.set(t, (tagSet.get(t) || 0) + 1));
        }
    });
    
    const colors = ['#ff8c42', '#4ade80', '#60a5fa', '#fbbf24', '#f87171', '#a78bfa', '#fb7185', '#34d399'];
    let colorIdx = 0;
    
    if (tagSet.size === 0) {
        tagContainer.innerHTML = '<div style="padding: 8px 12px; color: var(--text-faint); font-size: 12px;">暂无标签</div>';
        return;
    }
    
    tagContainer.innerHTML = Array.from(tagSet.entries()).map(([tag, count]) => {
        const color = colors[colorIdx % colors.length];
        colorIdx++;
        return `
            <div class="tag-item ${currentTag === tag ? 'active' : ''}" data-tag="${escapeHtml(tag)}">
                <span class="tag-dot" style="background: ${color}"></span>
                <span>${escapeHtml(tag)}</span>
                <span style="margin-left: auto; font-size: 11px; color: var(--text-faint); font-weight: 600;">${count}</span>
            </div>
        `;
    }).join('');
    
    tagContainer.querySelectorAll('.tag-item').forEach(item => {
        item.addEventListener('click', () => {
            const tag = item.dataset.tag;
            currentTag = currentTag === tag ? null : tag;
            currentFilter = 'all';
            updateNavActive();
            renderAll();
        });
    });
}

function updateCounts() {
    document.getElementById('count-all').textContent = memos.length;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    document.getElementById('count-today').textContent = memos.filter(m => m.createdAt >= today.getTime()).length;
    document.getElementById('count-pinned').textContent = memos.filter(m => m.pinned).length;
    document.getElementById('count-completed').textContent = memos.filter(m => m.completed).length;
}

function updateStats() {
    document.getElementById('stat-total').textContent = memos.length;
}

function updateNavActive() {
    document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.toggle('active', item.dataset.filter === currentFilter && !currentTag);
    });
    
    const titles = { all: '全部', today: '今天', pinned: '置顶', completed: '已完成' };
    document.getElementById('list-title').textContent = currentTag || titles[currentFilter] || '全部';
}

function selectMemo(id) {
    currentMemoId = id;
    const memo = memos.find(m => m.id === id);
    if (!memo) return;
    
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('editor-area').style.display = 'flex';
    
    document.getElementById('editor-title').value = memo.title || '';
    document.getElementById('editor-body').value = memo.body || '';
    
    document.getElementById('meta-date').textContent = formatDate(memo.updatedAt);
    document.getElementById('meta-time').textContent = formatTime(memo.updatedAt);
    updateWordCount();
    
    document.getElementById('btn-pin').classList.toggle('active', memo.pinned);
    document.getElementById('btn-complete').classList.toggle('active', memo.completed);
    
    document.querySelectorAll('.priority-option').forEach(opt => {
        opt.classList.remove('active', 'high', 'medium', 'low');
        if (opt.dataset.priority === memo.priority) {
            opt.classList.add('active', memo.priority);
        }
    });
    
    renderTagChips(memo);
    renderMemoList();
}

function renderTagChips(memo) {
    const wrap = document.getElementById('tag-input-wrap');
    const input = document.getElementById('tag-input');
    
    Array.from(wrap.querySelectorAll('.tag-chip')).forEach(c => c.remove());
    
    if (memo.tags) {
        memo.tags.forEach(tag => {
            const chip = document.createElement('span');
            chip.className = 'tag-chip';
            chip.innerHTML = `${escapeHtml(tag)} <i class="fa-solid fa-xmark"></i>`;
            wrap.insertBefore(chip, input);
            chip.querySelector('i').addEventListener('click', () => {
                memo.tags = memo.tags.filter(t => t !== tag);
                memo.updatedAt = Date.now();
                saveData();
                renderTagChips(memo);
                renderAll();
            });
        });
    }
}

function createMemo() {
    const now = Date.now();
    const memo = {
        id: generateId(),
        title: '',
        body: '',
        priority: 'medium',
        pinned: false,
        completed: false,
        tags: [],
        createdAt: now,
        updatedAt: now
    };
    memos.unshift(memo);
    saveData();
    currentMemoId = memo.id;
    renderAll();
    selectMemo(memo.id);
    document.getElementById('editor-title').focus();
    showToast('已创建新备忘录');
}

function deleteMemo(id) {
    memos = memos.filter(m => m.id !== id);
    if (currentMemoId === id) {
        currentMemoId = null;
        document.getElementById('editor-area').style.display = 'none';
        document.getElementById('empty-state').style.display = 'flex';
    }
    saveData();
    renderAll();
    showToast('已删除');
}

function autoSave() {
    if (!currentMemoId) return;
    const memo = memos.find(m => m.id === currentMemoId);
    if (!memo) return;
    
    memo.title = document.getElementById('editor-title').value;
    memo.body = document.getElementById('editor-body').value;
    memo.updatedAt = Date.now();
    
    saveData();
    
    document.getElementById('meta-date').textContent = formatDate(memo.updatedAt);
    document.getElementById('meta-time').textContent = formatTime(memo.updatedAt);
    document.getElementById('save-status').textContent = '已保存';
    
    renderMemoList();
    renderTagList();
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
}

function formatDate(timestamp) {
    const date = new Date(timestamp);
    const now = new Date();
    const diff = now - timestamp;
    
    if (diff < 86400000 && date.getDate() === now.getDate()) return '今天';
    if (diff < 172800000) return '昨天';
    return `${date.getMonth() + 1}月${date.getDate()}日`;
}

function formatTime(timestamp) {
    const date = new Date(timestamp);
    return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
}

function updateWordCount() {
    const body = document.getElementById('editor-body').value;
    document.getElementById('meta-words').textContent = body.length;
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('show'), 2000);
}

function exportMemo() {
    if (!currentMemoId) return;
    const memo = memos.find(m => m.id === currentMemoId);
    if (!memo) return;
    
    let content = `# ${memo.title || '无标题'}\n\n`;
    content += `创建时间：${new Date(memo.createdAt).toLocaleString()}\n`;
    content += `更新时间：${new Date(memo.updatedAt).toLocaleString()}\n`;
    content += `优先级：${memo.priority}\n`;
    if (memo.tags && memo.tags.length) content += `标签：${memo.tags.join(', ')}\n`;
    content += `\n---\n\n${memo.body || ''}`;
    
    const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${memo.title || 'memo'}.md`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('已导出为 Markdown');
}

function bindEvents() {
    document.getElementById('btn-new').addEventListener('click', createMemo);
    
    document.getElementById('search-input').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderMemoList();
    });
    
    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
            currentFilter = item.dataset.filter;
            currentTag = null;
            updateNavActive();
            renderTagList();
            renderMemoList();
        });
    });
    
    document.getElementById('editor-title').addEventListener('input', () => {
        clearTimeout(saveTimer);
        document.getElementById('save-status').textContent = '保存中...';
        saveTimer = setTimeout(autoSave, 500);
    });
    
    document.getElementById('editor-body').addEventListener('input', () => {
        updateWordCount();
        clearTimeout(saveTimer);
        document.getElementById('save-status').textContent = '保存中...';
        saveTimer = setTimeout(autoSave, 500);
    });
    
    document.getElementById('btn-pin').addEventListener('click', () => {
        if (!currentMemoId) return;
        const memo = memos.find(m => m.id === currentMemoId);
        memo.pinned = !memo.pinned;
        memo.updatedAt = Date.now();
        saveData();
        document.getElementById('btn-pin').classList.toggle('active', memo.pinned);
        renderMemoList();
        showToast(memo.pinned ? '已置顶' : '已取消置顶');
    });
    
    document.getElementById('btn-complete').addEventListener('click', () => {
        if (!currentMemoId) return;
        const memo = memos.find(m => m.id === currentMemoId);
        memo.completed = !memo.completed;
        memo.updatedAt = Date.now();
        saveData();
        document.getElementById('btn-complete').classList.toggle('active', memo.completed);
        renderMemoList();
        updateCounts();
        showToast(memo.completed ? '已标记完成' : '已取消完成');
    });
    
    document.querySelectorAll('.priority-option').forEach(opt => {
        opt.addEventListener('click', () => {
            if (!currentMemoId) return;
            const memo = memos.find(m => m.id === currentMemoId);
            memo.priority = opt.dataset.priority;
            memo.updatedAt = Date.now();
            saveData();
            
            document.querySelectorAll('.priority-option').forEach(o => {
                o.classList.remove('active', 'high', 'medium', 'low');
            });
            opt.classList.add('active', memo.priority);
            renderMemoList();
        });
    });
    
    document.getElementById('btn-delete').addEventListener('click', () => {
        if (!currentMemoId) return;
        document.getElementById('modal-delete').classList.add('show');
    });
    
    document.getElementById('btn-cancel-delete').addEventListener('click', () => {
        document.getElementById('modal-delete').classList.remove('show');
    });
    
    document.getElementById('btn-confirm-delete').addEventListener('click', () => {
        deleteMemo(currentMemoId);
        document.getElementById('modal-delete').classList.remove('show');
    });
    
    document.getElementById('btn-theme').addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem(THEME_KEY, next);
        updateThemeIcon(next);
    });
    
    document.getElementById('btn-export').addEventListener('click', exportMemo);
    
    document.getElementById('tag-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.value.trim()) {
            e.preventDefault();
            if (!currentMemoId) return;
            const memo = memos.find(m => m.id === currentMemoId);
            if (!memo.tags) memo.tags = [];
            const tag = e.target.value.trim();
            if (!memo.tags.includes(tag)) {
                memo.tags.push(tag);
                memo.updatedAt = Date.now();
                saveData();
                renderTagChips(memo);
                renderAll();
            }
            e.target.value = '';
        }
    });
    
    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
            e.preventDefault();
            createMemo();
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
            e.preventDefault();
            document.getElementById('search-input').focus();
        }
        if (e.key === 'Escape') {
            document.getElementById('modal-delete').classList.remove('show');
        }
    });
    
    document.getElementById('modal-delete').addEventListener('click', (e) => {
        if (e.target.id === 'modal-delete') {
            document.getElementById('modal-delete').classList.remove('show');
        }
    });
}

init();
</script>
</body>
</html>
