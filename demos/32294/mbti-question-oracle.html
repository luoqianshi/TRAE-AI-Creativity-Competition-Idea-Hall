<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问己 - 选择困难者的决策助手</title>
<style>
  :root {
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --text: #e0e0e0;
    --accent: #7c5ce7;
    --accent2: #a29bfe;
    --gold: #f0c060;
    --green: #44d7b6;
    --red: #ff6b6b;
    --border: #2a2a4a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(124,92,231,0.12) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(68,215,182,0.08) 0%, transparent 50%);
  }

  .container {
    width: 100%;
    max-width: 520px;
    padding: 24px;
  }

  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 32px 28px;
    border: 1px solid var(--border);
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }

  .logo {
    text-align: center;
    margin-bottom: 8px;
  }

  .logo-icon {
    font-size: 48px;
    display: inline-block;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .title {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent2), var(--green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
  }

  .subtitle {
    text-align: center;
    font-size: 13px;
    color: #888;
    margin-bottom: 24px;
  }

  .section-label {
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 8px;
    padding-left: 2px;
  }

  /* MBTI Selector */
  .mbti-groups {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
  }

  .mbti-group {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .mbti-btn {
    padding: 10px 6px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: #999;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
    text-align: center;
    position: relative;
  }

  .mbti-btn:hover {
    border-color: #555;
    color: #ccc;
  }

  .mbti-btn.selected {
    border-color: var(--accent);
    background: rgba(124,92,231,0.15);
    color: white;
    font-weight: 700;
    box-shadow: 0 0 12px rgba(124,92,231,0.25);
  }

  .mbti-btn.E { color: #f0a060; }
  .mbti-btn.I { color: #60b0f0; }
  .mbti-btn.S { color: #60d0a0; }
  .mbti-btn.N { color: #c080f0; }
  .mbti-btn.T { color: #6090d0; }
  .mbti-btn.F { color: #f070a0; }
  .mbti-btn.J { color: #80c060; }
  .mbti-btn.P { color: #e0c050; }

  .mbti-btn.selected.E, .mbti-btn.selected.I,
  .mbti-btn.selected.S, .mbti-btn.selected.N,
  .mbti-btn.selected.T, .mbti-btn.selected.F,
  .mbti-btn.selected.J, .mbti-btn.selected.P {
    color: white;
  }

  .mbti-display {
    text-align: center;
    margin-bottom: 20px;
    font-size: 24px;
    letter-spacing: 4px;
    font-weight: 900;
    height: 36px;
    line-height: 36px;
    color: var(--gold);
    transition: all 0.3s;
  }

  .mbti-display.incomplete { color: #555; font-size: 14px; letter-spacing: 1px; font-weight: 400; }

  /* Question Input */
  .question-input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: rgba(255,255,255,0.03);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    resize: none;
    height: 80px;
    transition: border-color 0.3s;
  }

  .question-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 16px rgba(124,92,231,0.15);
  }

  .question-input::placeholder {
    color: #555;
  }

  /* Ask Button */
  .ask-btn {
    width: 100%;
    padding: 16px;
    margin-top: 16px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, var(--accent), #5a3fc0);
    color: white;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 2px;
    position: relative;
    overflow: hidden;
  }

  .ask-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(124,92,231,0.4);
  }

  .ask-btn:active {
    transform: translateY(0);
  }

  .ask-btn:disabled {
    background: #333;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .ask-btn .shimmer {
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    animation: shimmer 2s infinite;
  }

  @keyframes shimmer {
    0% { left: -100%; }
    100% { left: 100%; }
  }

  /* Answer Area */
  .answer-area {
    margin-top: 24px;
    min-height: 60px;
  }

  .answer-card {
    background: rgba(255,255,255,0.03);
    border-radius: 14px;
    padding: 24px 20px;
    border: 1px solid var(--border);
    text-align: center;
    animation: fadeInUp 0.5s ease;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .answer-attitude {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .answer-attitude.agree-strong { background: rgba(68,215,182,0.15); color: #44d7b6; }
  .answer-attitude.agree-mild { background: rgba(68,215,182,0.08); color: #5ee0c0; }
  .answer-attitude.disagree-strong { background: rgba(255,107,107,0.15); color: #ff6b6b; }
  .answer-attitude.disagree-mild { background: rgba(255,107,107,0.08); color: #ff8888; }
  .answer-attitude.neutral { background: rgba(240,192,96,0.1); color: #f0c060; }
  .answer-attitude.question-back { background: rgba(162,155,254,0.1); color: #a29bfe; }

  .answer-text {
    font-size: 18px;
    line-height: 1.8;
    color: #d0d0d0;
    font-weight: 500;
  }

  .answer-mbti-tag {
    display: inline-block;
    margin-top: 12px;
    padding: 4px 12px;
    border-radius: 10px;
    background: rgba(124,92,231,0.1);
    color: var(--accent2);
    font-size: 12px;
    letter-spacing: 2px;
  }

  /* History */
  .history {
    margin-top: 20px;
  }

  .history-title {
    font-size: 12px;
    color: #666;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 8px;
    background: rgba(255,255,255,0.02);
    margin-bottom: 6px;
    font-size: 12px;
    color: #888;
  }

  .history-item .h-q { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-item .h-a { color: #aaa; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 24px;
    font-size: 11px;
    color: #444;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🔮</div>
    </div>
    <div class="title">问己</div>

    <!-- Ask Button -->

    <!-- History -->
    <div class="history" id="historyArea" style="display:none;">

      <div id="historyList"></div>
    </div>
  </div>
  <div class="footer">Powered by TRAE Work · 问己</div>
</div>

        '也许可以问问信任的朋友，他们的视角会给你启发。',
        '先确保这个选择不会让你太辛苦，你的精力也很宝贵。',
        '这个方向可能会让你忽视身边重要的人，再想想。',
        '虽然出发点是好的，但可能不是最好的时机。'
      ]
    },
    // Explorers (SP)
    ISTP: {
      leans: ['neutral', 'neutral', 'agree-mild', 'agree-mild', 'disagree-mild', 'disagree-mild', 'question-back', 'agree-mild'],
      answers: [
        '动手试试就知道了，想太多没用。',
        '没有完美的信息，凭手感去做往往更靠谱。',
        '如果工具和资源都齐了，那就没必要等了。',
        '冷静分析的话，这个选择的风险在可控范围内。',
        '你的直觉在实操中通常很准，相信它。',
        '先做一个最小版本试试看，不行再调整。',
        '这件事的复杂程度可能超出你的预估，简化一下。',
        '关键在于你愿不愿意投入时间去打磨，而不是选什么。'
      ]
    },
    ISFP: {
      leans: ['agree-mild', 'agree-mild', 'neutral', 'neutral', 'neutral', 'question-back', 'disagree-mild', 'agree-mild'],
      answers: [
        '让美感和直觉引领你，选择那个让你觉得"对的"方向。',
        '如果这件事能让你沉浸在当下，那就值得。',
        '不必解释太多，你的感受就是最好的判断标准。',
        '选择那个让你感到自由和舒适的方向。',
        '低调地开始做，不需要向任何人证明什么。',
        '你心里有个声音在说话，安静下来听听它。',
        '两个选择都不错，但其中一个更接近真实的你。',
        '如果它不能给你带来内心的平静，那可能不是最好的选择。'
      ]
    },
    ESTP: {
      leans: ['agree-strong', 'agree-strong', 'agree-mild', 'agree-mild', 'neutral', 'disagree-mild', 'disagree-strong', 'disagree-strong'],
      answers: [
        '别想了，直接干！行动才是最好的答案。',
        '机会不等人，抓住它。失败了也是一种经验。',
        '你的应变能力足以应对任何结果，所以放心去做。',
        '听起来就很刺激！高风险高回报，值得赌一把。',
        '优先选择那个能立刻看到效果的方向，不要拖延。',
        '如果这个选择能给你带来实际的好处，那就是对的。',
        '这事划不来，别浪费时间。找更有价值的。',
        '实际收益太低了，换个更靠谱的方向。'
      ]
    },
    ESFP: {
      leans: ['agree-strong', 'agree-strong', 'agree-mild', 'agree-mild', 'neutral', 'neutral', 'disagree-mild', 'disagree-mild'],
      answers: [
        '当然要做！人生苦短，快乐最重要！',
        '如果这件事让你兴奋得睡不着觉，那还犹豫什么？',
        '选择那个能让你笑出来的方向，快乐本身就是价值。',
        '你会在这件事里遇到很棒的人、很棒的经历，去吧！',
        '活在当下，选那个最让你心动的！',
        '两个听起来都很有趣，先选一个玩，不行再换另一个！',
        '别选那个会让你感到无聊的方向，不值得。',
        '虽然很开心，但也要考虑一下后果哦，稍微收敛一点点。'
      ]
    }
  };

  // --- MBTI Selection ---
  document.querySelectorAll('.mbti-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const dim = this.dataset.dim;
      const idx = parseInt(this.dataset.idx);

      // Deselect others in same group
      document.querySelectorAll(`.mbti-btn[data-idx="${idx}"]`).forEach(b => b.classList.remove('selected'));

      // Select this
      this.classList.add('selected');
      selections[idx] = dim;

      // Update MBTI string
      updateMBTI();
    });
  });

  function updateMBTI() {
    mbtiType = selections.filter(Boolean).join('');
    const complete = selections.every(s => s !== null);

    if (complete) {
      mbtiDisplay.textContent = mbtiType;
      mbtiDisplay.classList.remove('incomplete');
    } else if (mbtiType.length > 0) {
      mbtiDisplay.textContent = mbtiType + '_'.repeat(4 - mbtiType.length);
      mbtiDisplay.classList.add('incomplete');
    } else {
      mbtiDisplay.textContent = '点击上方选择你的 MBTI';
      mbtiDisplay.classList.add('incomplete');
    }

    updateAskBtn();
  }

  function updateAskBtn() {
    const hasMBTI = selections.every(s => s !== null);
    const hasQuestion = questionInput.value.trim().length > 0;
    askBtn.disabled = !(hasMBTI && hasQuestion);
  }

  questionInput.addEventListener('input', updateAskBtn);

  // --- Get Answer ---
  function getRandomAnswer(mbti) {
    const pool = answerPools[mbti];
    if (!pool) return { attitude: 'neutral', text: '命运的齿轮正在转动，请稍后再试……' };

    const idx = Math.floor(Math.random() * pool.answers.length);
    const lean = pool.leans[idx];
    const text = pool.answers[idx];

    return { attitude: lean, text: text };
  }

  function getAttitudeLabel(attitude) {
    const map = {
      'agree-strong': '🟢 强烈赞同',
      'agree-mild': '💚 温和赞同',
      'disagree-strong': '🔴 明确反对',
      'disagree-mild': '🟠 温和反对',
      'neutral': '🟡 保持中立',
      'question-back': '🟣 换个思路'
    };
    return map[attitude] || '🤍 模棱两可';
  }

  // --- Ask ---
  askBtn.addEventListener('click', function() {
    if (askBtn.disabled) return;

    const question = questionInput.value.trim();
    if (!question) return;

    const result = getRandomAnswer(mbtiType);

    // Render answer
    answerArea.innerHTML = `
      <div class="answer-card">
        <div class="answer-attitude ${result.attitude}">${getAttitudeLabel(result.attitude)}</div>
        <div class="answer-text">${result.text}</div>
        <div class="answer-mbti-tag">${mbtiType} · 问己</div>
      </div>
    `;

    // Add to history
    history.unshift({ question, attitude: result.attitude, text: result.text, mbti: mbtiType });
    if (history.length > 10) history.pop();
    renderHistory();
  });

  // --- History ---
  function renderHistory() {
    if (history.length === 0) {
      historyArea.style.display = 'none';
      return;
    }
    historyArea.style.display = 'block';
    historyList.innerHTML = history.map((h, i) => `
      <div class="history-item">
        <span style="font-size:14px;">${i === 0 ? '🆕' : '📝'}</span>
        <span class="h-q" title="${escapeHtml(h.question)}">${escapeHtml(h.question)}</span>
        <span class="h-a" title="${escapeHtml(h.text)}">→ ${escapeHtml(h.text)}</span>
        <span style="color:#666;font-size:10px;">${h.mbti}</span>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // --- Keyboard shortcut ---
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !askBtn.disabled) {
      askBtn.click();
    }
  });
})();
</script>

</body>
</html>
