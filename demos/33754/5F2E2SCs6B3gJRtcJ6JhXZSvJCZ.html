<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="一刻 One Timer 是一个安静克制的电脑桌面端专注计时器，适合学习、工作、会议和短休息。">
  <title>一刻 One Timer - 桌面专注计时器</title>
  <style>
    :root {
      color-scheme: light dark;
      --page-top: #fbfbfd;
      --page: #f5f5f7;
      --page-bottom: #e9ebef;
      --glass: rgba(255, 255, 255, 0.72);
      --glass-strong: rgba(255, 255, 255, 0.92);
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(0, 0, 0, 0.09);
      --line-strong: rgba(0, 0, 0, 0.16);
      --accent: #0071e3;
      --accent-2: #6ac4ff;
      --accent-soft: rgba(0, 113, 227, 0.16);
      --warning: #ff9f0a;
      --warning-soft: rgba(255, 159, 10, 0.18);
      --complete: #ff3b30;
      --complete-soft: rgba(255, 59, 48, 0.16);
      --done: #34c759;
      --done-soft: rgba(52, 199, 89, 0.18);
      --shadow: 0 36px 110px rgba(0, 0, 0, 0.13);
      --inner-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75), inset 0 -24px 60px rgba(0, 0, 0, 0.05);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page-top: #171719;
        --page: #050506;
        --page-bottom: #000;
        --glass: rgba(29, 29, 31, 0.74);
        --glass-strong: rgba(44, 44, 46, 0.9);
        --ink: #f5f5f7;
        --muted: #a1a1a6;
        --line: rgba(255, 255, 255, 0.12);
        --line-strong: rgba(255, 255, 255, 0.2);
        --accent: #2997ff;
        --accent-2: #8fd7ff;
        --accent-soft: rgba(41, 151, 255, 0.2);
        --warning: #ffd60a;
        --warning-soft: rgba(255, 214, 10, 0.2);
        --complete-soft: rgba(255, 69, 58, 0.2);
        --shadow: 0 38px 120px rgba(0, 0, 0, 0.58);
        --inner-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), inset 0 -24px 70px rgba(0, 0, 0, 0.32);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: linear-gradient(180deg, var(--page-top) 0%, var(--page) 55%, var(--page-bottom) 100%);
      color: var(--ink);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.025) 1px, transparent 1px);
      background-size: 84px 84px;
      mask-image: linear-gradient(180deg, transparent 0%, #000 24%, transparent 88%);
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 24%, transparent 88%);
      opacity: 0.52;
    }

    @media (prefers-color-scheme: dark) {
      body::before {
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        opacity: 0.4;
      }
    }

    button,
    input {
      font: inherit;
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(100%, 760px);
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: clamp(14px, 2.4vw, 24px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 9px;
      min-width: 0;
      color: var(--ink);
      font-weight: 680;
      letter-spacing: 0;
    }

    .brand small {
      color: var(--muted);
      font-size: 12px;
      font-weight: 560;
    }

    .mode {
      min-width: 72px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.38);
      padding: 6px 12px;
      text-align: center;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    @media (prefers-color-scheme: dark) {
      .mode {
        background: rgba(255, 255, 255, 0.05);
      }
    }

    .stage {
      display: grid;
      place-items: center;
      padding: clamp(8px, 2vh, 16px) 0;
    }

    .timer-shell {
      width: min(100%, 560px);
      border: 1px solid var(--line);
      border-radius: clamp(22px, 3.2vw, 32px);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.76), rgba(255, 255, 255, 0.42)),
        var(--glass);
      box-shadow: var(--shadow);
      backdrop-filter: blur(34px) saturate(150%);
      -webkit-backdrop-filter: blur(34px) saturate(150%);
      padding: clamp(18px, 3vw, 26px);
      overflow: hidden;
      transition: transform 220ms ease, border-color 220ms ease;
    }

    @media (prefers-color-scheme: dark) {
      .timer-shell {
        background:
          linear-gradient(145deg, rgba(58, 58, 60, 0.64), rgba(28, 28, 30, 0.58)),
          var(--glass);
      }
    }

    .timer-shell.is-running {
      transform: translateY(-2px);
      border-color: rgba(0, 113, 227, 0.28);
    }

    .timer-shell.is-warning {
      border-color: rgba(255, 159, 10, 0.38);
    }

    .timer-shell.is-complete {
      border-color: rgba(255, 59, 48, 0.42);
    }

    .headline {
      display: grid;
      gap: 4px;
      margin-bottom: clamp(8px, 1.8vh, 12px);
      text-align: center;
    }

    .headline h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(22px, 3.2vw, 30px);
      font-weight: 740;
      line-height: 1.02;
      letter-spacing: 0;
    }

    .headline p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .timepiece {
      position: relative;
      width: min(48vw, 286px);
      aspect-ratio: 1;
      margin: 0 auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.28)),
        var(--glass-strong);
      box-shadow:
        var(--inner-shadow),
        0 28px 80px rgba(0, 0, 0, 0.1);
      isolation: isolate;
      transition: transform 240ms ease, box-shadow 240ms ease;
    }

    @media (prefers-color-scheme: dark) {
      .timepiece {
        background:
          linear-gradient(145deg, rgba(80, 80, 84, 0.66), rgba(28, 28, 30, 0.2)),
          var(--glass-strong);
        box-shadow:
          var(--inner-shadow),
          0 30px 92px rgba(0, 0, 0, 0.48);
      }
    }

    .timer-shell.is-running .timepiece {
      transform: scale(1.01);
      box-shadow:
        var(--inner-shadow),
        0 34px 96px rgba(0, 113, 227, 0.14);
    }

    .timer-shell.is-warning .timepiece {
      box-shadow:
        var(--inner-shadow),
        0 34px 96px var(--warning-soft);
      animation: warningBreath 1300ms ease-in-out infinite;
    }

    .timepiece::before,
    .timepiece::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
    }

    .timepiece::before {
      background:
        repeating-conic-gradient(from -90deg, var(--line-strong) 0deg 0.8deg, transparent 0.8deg 7.5deg);
      mask-image: radial-gradient(circle, transparent 65%, #000 66%, #000 70%, transparent 71%);
      -webkit-mask-image: radial-gradient(circle, transparent 65%, #000 66%, #000 70%, transparent 71%);
      opacity: 0.72;
    }

    .timepiece::after {
      background:
        conic-gradient(from -90deg, var(--accent) var(--progress, 0%), transparent 0),
        repeating-conic-gradient(from -90deg, rgba(255, 255, 255, 0.7) 0deg 0.75deg, transparent 0.75deg 11.25deg);
      mask-image: radial-gradient(circle, transparent 73%, #000 74%, #000 79%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle, transparent 73%, #000 74%, #000 79%, transparent 80%);
      filter: drop-shadow(0 0 18px var(--accent-soft));
      transition: background 180ms linear, filter 180ms ease;
    }

    .timer-shell.is-warning .timepiece::after {
      background:
        conic-gradient(from -90deg, var(--warning) var(--progress, 0%), transparent 0),
        repeating-conic-gradient(from -90deg, rgba(255, 255, 255, 0.75) 0deg 0.75deg, transparent 0.75deg 11.25deg);
      filter: drop-shadow(0 0 18px var(--warning-soft));
    }

    .timer-shell.is-complete .timepiece::after {
      background:
        conic-gradient(from -90deg, var(--complete) 100%, transparent 0),
        repeating-conic-gradient(from -90deg, rgba(255, 255, 255, 0.75) 0deg 0.75deg, transparent 0.75deg 11.25deg);
      filter: drop-shadow(0 0 20px var(--complete-soft));
    }

    .sweep {
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      transform: rotate(var(--angle, 0deg));
      transition: transform 180ms linear;
      z-index: 1;
      pointer-events: none;
    }

    .sweep::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 4%;
      width: 2px;
      height: 18%;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--accent-2), transparent);
      transform: translateX(-50%);
      opacity: 0.9;
    }

    .timer-shell.is-warning .sweep::before {
      background: linear-gradient(180deg, var(--warning), transparent);
    }

    .timer-shell.is-complete .sweep::before {
      background: linear-gradient(180deg, var(--complete), transparent);
    }

    .time-core {
      position: relative;
      z-index: 2;
      width: 72%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.42));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.78),
        inset 0 -30px 70px rgba(0, 0, 0, 0.035);
    }

    @media (prefers-color-scheme: dark) {
      .time-core {
        background:
          linear-gradient(180deg, rgba(72, 72, 76, 0.58), rgba(24, 24, 26, 0.42));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          inset 0 -32px 80px rgba(0, 0, 0, 0.34);
      }
    }

    .time {
      width: 100%;
      color: var(--ink);
      font-size: clamp(36px, 6vw, 64px);
      font-weight: 760;
      line-height: 0.92;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      text-align: center;
      user-select: none;
      white-space: nowrap;
    }

    .time[data-length="long"] {
      font-size: clamp(28px, 4.8vw, 47px);
    }

    .status {
      min-height: 1.45em;
      margin: clamp(9px, 1.7vh, 12px) 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      text-align: center;
      transition: color 180ms ease;
    }

    .timer-shell.is-running .status {
      color: var(--accent);
    }

    .timer-shell.is-warning .status {
      color: var(--warning);
    }

    .timer-shell.is-complete .status {
      color: var(--complete);
    }

    .controls {
      display: grid;
      gap: clamp(9px, 1.6vh, 12px);
      margin-top: clamp(10px, 2vh, 14px);
      transition: transform 220ms ease;
    }

    .timer-shell.is-running .controls {
      transform: translateY(4px);
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .button {
      min-width: 116px;
      height: 42px;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      color: var(--ink);
      background: var(--glass-strong);
      box-shadow: inset 0 0 0 1px var(--line);
      transition: transform 160ms ease, background 160ms ease, color 160ms ease, opacity 160ms ease, box-shadow 160ms ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button:active {
      transform: translateY(0) scale(0.985);
    }

    .button.primary {
      color: #fff;
      background: var(--accent);
      box-shadow: 0 14px 30px var(--accent-soft);
      font-weight: 680;
    }

    .button:disabled {
      cursor: default;
      opacity: 0.42;
      transform: none;
    }

    .timer-shell.is-warning .button.primary {
      background: var(--warning);
      box-shadow: 0 14px 30px var(--warning-soft);
    }

    .timer-shell.is-complete .button.primary {
      background: var(--complete);
      box-shadow: 0 14px 30px var(--complete-soft);
    }

    .duration {
      width: min(100%, 340px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .presets {
      width: min(100%, 340px);
      margin: 2px auto 0;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .preset {
      min-width: 0;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.36);
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
      line-height: 1;
      transition: border-color 160ms ease, background 160ms ease, color 160ms ease, transform 160ms ease, opacity 160ms ease;
    }

    .preset:hover {
      border-color: rgba(0, 113, 227, 0.28);
      color: var(--accent);
      transform: translateY(-1px);
    }

    .preset:active {
      transform: translateY(0) scale(0.985);
    }

    .preset:disabled {
      cursor: default;
      opacity: 0.42;
      transform: none;
    }

    .unit {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.48);
      padding: 9px 9px 8px;
      text-align: center;
      transition: border-color 180ms ease, background 180ms ease;
    }

    @media (prefers-color-scheme: dark) {
      .preset {
        background: rgba(255, 255, 255, 0.055);
      }

      .unit {
        background: rgba(255, 255, 255, 0.055);
      }
    }

    .unit:focus-within {
      border-color: rgba(0, 113, 227, 0.38);
      background: var(--glass-strong);
    }

    .unit input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      appearance: textfield;
      background: transparent;
      color: var(--ink);
      text-align: center;
      font-size: clamp(20px, 3vw, 25px);
      font-weight: 690;
      line-height: 1;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
    }

    .unit input::-webkit-outer-spin-button,
    .unit input::-webkit-inner-spin-button {
      margin: 0;
      appearance: none;
    }

    .unit input:disabled {
      opacity: 0.55;
    }

    .unit label {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 560;
      line-height: 1.2;
    }

    .companion {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 20;
      width: 146px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 18px 52px rgba(0, 0, 0, 0.14);
      padding: 10px;
      opacity: 0;
      transform: translateY(-8px) scale(0.98);
      transition: opacity 180ms ease, transform 180ms ease, border-color 180ms ease, background 180ms ease;
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      user-select: none;
      touch-action: none;
    }

    .companion.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .companion.is-dragging {
      transition: none;
      cursor: grabbing;
    }

    .companion:focus-visible {
      outline: 3px solid var(--accent-soft);
      outline-offset: 3px;
    }

    .companion.is-tapped {
      animation: companionTap 420ms ease-out;
    }

    .companion[data-state="running"] {
      border-color: rgba(0, 113, 227, 0.32);
    }

    .companion[data-state="steady"] {
      border-color: rgba(50, 173, 230, 0.36);
    }

    .companion[data-state="deep"] {
      border-color: rgba(88, 86, 214, 0.38);
    }

    .companion[data-state="warning"] {
      border-color: rgba(255, 159, 10, 0.38);
      background: rgba(255, 248, 232, 0.9);
    }

    .companion[data-state="complete"] {
      border-color: rgba(255, 59, 48, 0.42);
      background: rgba(255, 242, 241, 0.94);
      animation: companionFinish 900ms ease-in-out 3;
    }

    .companion[data-state="complete"].is-acknowledged {
      border-color: rgba(191, 90, 242, 0.46);
      background: rgba(246, 238, 255, 0.94);
    }

    .mini-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: grab;
    }

    .mini-title,
    .mini-phase,
    .mini-note {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .mini-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }

    .mini-phase {
      color: var(--accent);
      font-size: 11px;
      font-weight: 720;
    }

    .companion[data-state="steady"] .mini-phase {
      color: #32ade6;
    }

    .companion[data-state="deep"] .mini-phase {
      color: #5856d6;
    }

    .companion[data-state="warning"] .mini-phase {
      color: var(--warning);
    }

    .companion[data-state="complete"] .mini-phase {
      color: var(--complete);
    }

    .companion[data-state="paused"] .mini-phase,
    .companion[data-state="idle"] .mini-phase {
      color: var(--muted);
    }

    .mini-time {
      margin-top: 6px;
      color: var(--ink);
      font-size: 28px;
      font-weight: 760;
      line-height: 1;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
    }

    .mini-bar {
      height: 4px;
      margin-top: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--line);
    }

    .mini-fill {
      display: block;
      width: var(--mini-progress, 0%);
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width 180ms linear, background 180ms ease;
    }

    .companion[data-state="steady"] .mini-fill {
      background: #32ade6;
    }

    .companion[data-state="deep"] .mini-fill {
      background: #5856d6;
    }

    .companion[data-state="warning"] .mini-fill {
      background: var(--warning);
    }

    .companion[data-state="complete"] .mini-fill {
      background: var(--complete);
    }

    .companion[data-state="paused"] .mini-fill,
    .companion[data-state="idle"] .mini-fill {
      background: var(--muted);
    }

    .mini-note {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
    }

    @keyframes warningBreath {
      0%,
      100% {
        transform: scale(1.01);
      }
      50% {
        transform: scale(1.026);
      }
    }

    @keyframes companionFinish {
      50% {
        transform: translateY(0) scale(1.035);
      }
    }

    @keyframes companionTap {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }
      45% {
        transform: translateY(-2px) scale(1.055);
      }
    }

    @media (prefers-color-scheme: dark) {
      .companion {
        background: rgba(28, 28, 30, 0.86);
        box-shadow: 0 18px 52px rgba(0, 0, 0, 0.5);
      }

      .companion[data-state="warning"] {
        background: rgba(58, 48, 20, 0.86);
      }

      .companion[data-state="complete"] {
        background: rgba(64, 22, 20, 0.9);
      }

      .companion[data-state="complete"].is-acknowledged {
        background: rgba(43, 24, 57, 0.92);
      }
    }

    @media (max-width: 640px) {
      .app {
        padding: 16px;
      }

      .topbar {
        font-size: 12px;
      }

      .brand small {
        display: none;
      }

      .timer-shell {
        padding: 18px;
      }

      .timepiece {
        width: min(74vw, 272px);
      }

      .headline h1 {
        font-size: clamp(23px, 6.5vw, 30px);
      }

      .duration {
        gap: 8px;
      }

      .presets {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .unit {
        border-radius: 16px;
        padding-inline: 7px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .button {
        width: 100%;
      }
    }

    @media (max-height: 760px) and (min-width: 641px) {
      .headline p {
        display: none;
      }

      .timepiece {
        width: min(44vw, 258px);
      }

      .timer-shell {
        padding: 18px 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="一刻极简计时器">
    <header class="topbar">
      <div class="brand">
        <span>一刻</span>
        <small>One Timer</small>
      </div>
      <div class="mode" id="modeText">就绪</div>
    </header>

    <section class="stage">

        <p class="status" id="status">选择时长</p>

        <div class="controls">

          <div class="duration" aria-label="设置计时时长">
            <div class="unit">
              <input id="hours" type="number" min="0" max="23" value="0" inputmode="numeric" aria-label="小时">
              <label for="hours">小时</label>
            </div>

              <input id="minutes" type="number" min="0" max="59" value="0" inputmode="numeric" aria-label="分钟">

  <script>
    const shell = document.querySelector("#timerShell");
    const timepiece = document.querySelector("#timepiece");
    const timeText = document.querySelector("#timeText");
    const statusText = document.querySelector("#status");
    const modeText = document.querySelector("#modeText");
    const startPause = document.querySelector("#startPause");
    const resetButton = document.querySelector("#reset");
    const companion = document.querySelector("#companion");
    const companionDrag = document.querySelector("#companionDrag");
    const miniTime = document.querySelector("#miniTime");
    const miniPhase = document.querySelector("#miniPhase");
    const miniNote = document.querySelector("#miniNote");
    const miniFill = document.querySelector("#miniFill");
    const inputs = {
      hours: document.querySelector("#hours"),
      minutes: document.querySelector("#minutes"),
      seconds: document.querySelector("#seconds")
    };
    const presetButtons = [...document.querySelectorAll(".preset")];

    let totalMs = readDuration();
    let remainingMs = totalMs;
    let started = false;
    let running = false;
    let targetWallTime = 0;
    let frameId = null;
    let warningPlayed = false;
    let audioContext = null;
    let finishWallTime = null;
    let overtimeIntervalId = null;
    let overtimePaused = false;
    let overtimePausedElapsed = 0;
    let guardIntervalId = null;
    let miniWindow = null;
    let miniWindowEls = null;
    let companionDragState = null;
    let companionMovedDuringDrag = false;
    let companionTapTimeoutId = null;
    let companionAcknowledged = false;

    function clampNumber(value, min, max) {
      const number = Number.parseInt(value, 10);
      if (Number.isNaN(number)) return min;
      return Math.min(max, Math.max(min, number));
    }

    function readDuration() {
      const hours = clampNumber(inputs.hours.value, 0, 23);
      const minutes = clampNumber(inputs.minutes.value, 0, 59);
      const seconds = clampNumber(inputs.seconds.value, 0, 59);
      return ((hours * 3600) + (minutes * 60) + seconds) * 1000;
    }

    function normalizeInputs() {
      inputs.hours.value = clampNumber(inputs.hours.value, 0, 23);
      inputs.minutes.value = clampNumber(inputs.minutes.value, 0, 59);
      inputs.seconds.value = clampNumber(inputs.seconds.value, 0, 59);
    }

    function formatTime(ms) {
      const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      if (hours > 0) {
        return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }

      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    function formatElapsed(ms) {
      const totalSeconds = Math.max(0, Math.floor(ms / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      if (hours > 0) {
        return `+${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }

      return `+${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    function getWarningThreshold(durationMs) {
      if (durationMs <= 10000) {
        return Math.max(1200, durationMs * 0.35);
      }

      return Math.min(30000, Math.max(8000, durationMs * 0.12));
    }

    function isWarningPhase() {
      return started && running && remainingMs > 0 && remainingMs <= getWarningThreshold(totalMs);
    }

    function canEditDuration() {
      return !running && (!started || remainingMs <= 0);
    }

    function clearCompletionState() {
      finishWallTime = null;
      overtimePaused = false;
      overtimePausedElapsed = 0;
      clearOvertimeCounter();
      clearCompanionFeedback();
    }

    function leaveCompletedStateForEditing() {
      if (!(started && remainingMs <= 0)) return;

      started = false;
      running = false;
      warningPlayed = false;
      clearCompletionState();
    }

    function syncDurationFromInputs() {
      normalizeInputs();
      totalMs = readDuration();
      remainingMs = totalMs;
      warningPlayed = false;
    }

    function setDurationFromMinutes(minutes) {
      const totalSeconds = Math.max(0, Math.min(23 * 3600 + 59 * 60 + 59, minutes * 60));
      inputs.hours.value = Math.floor(totalSeconds / 3600);
      inputs.minutes.value = Math.floor((totalSeconds % 3600) / 60);
      inputs.seconds.value = totalSeconds % 60;
      syncDurationFromInputs();
    }

    function getProgress() {
      const progress = totalMs > 0 ? ((totalMs - remainingMs) / totalMs) * 100 : 0;
      return Math.min(100, Math.max(0, progress));
    }

    function render() {
      const clampedProgress = getProgress();
      const warningPhase = isWarningPhase();
      const displayTime = formatTime(remainingMs);

      timeText.textContent = displayTime;
      timeText.dataset.length = displayTime.length > 5 ? "long" : "short";
      timepiece.style.setProperty("--progress", `${clampedProgress.toFixed(3)}%`);
      timepiece.style.setProperty("--angle", `${(clampedProgress * 3.6).toFixed(3)}deg`);

      shell.classList.toggle("is-running", running);
      shell.classList.toggle("is-warning", warningPhase);
      shell.classList.toggle("is-complete", started && remainingMs <= 0);
      resetButton.disabled = !started && remainingMs === totalMs;
      updateCompanion(clampedProgress, warningPhase);

      if (!started) {
        modeText.textContent = "就绪";
        statusText.textContent = totalMs > 0 ? "选择时长" : "未设置时长";
        startPause.textContent = "开始";
        startPause.disabled = totalMs <= 0;
        setInputsLocked(false);
        return;
      }

      if (running) {
        modeText.textContent = "计时中";
        statusText.textContent = warningPhase ? "快结束了" : "安静计时";
        startPause.textContent = "暂停";
        startPause.disabled = false;
        setInputsLocked(true);
        return;
      }

      if (remainingMs <= 0) {
        modeText.textContent = overtimePaused ? "结束暂停" : "完成";
        statusText.textContent = overtimePaused ? "结束后计时已暂停" : "时间到了";
        startPause.textContent = remainingMs <= 0 ? "重新开始" : "继续";
        startPause.disabled = false;
        setInputsLocked(false);
        return;
      }

      modeText.textContent = "暂停";
      statusText.textContent = "已暂停";
      startPause.textContent = "继续";
      startPause.disabled = false;
      setInputsLocked(true);
    }

    function reconcileRunningTimer() {
      remainingMs = Math.max(0, targetWallTime - Date.now());

      if (remainingMs <= 0) {
        finish();
        return true;
      }

      if (!warningPlayed && isWarningPhase()) {
        warningPlayed = true;
        playWarningChime();
      }

      render();
      return false;
    }

    function tick() {
      if (!running) return;
      if (reconcileRunningTimer()) return;
      frameId = requestAnimationFrame(tick);
    }

    function reconcileAfterWake() {
      if (running) {
        cancelAnimationFrame(frameId);
        tick();
        return;
      }

      render();
    }

    function start() {
      const restarting = !started || remainingMs <= 0;

      if (remainingMs <= 0) {
        totalMs = readDuration();
        remainingMs = totalMs;
      }

      if (totalMs <= 0) {
        started = false;
        running = false;
        warningPlayed = false;
        clearCompletionState();
        render();
        return;
      }

      if (restarting || remainingMs === totalMs) {
        warningPlayed = false;
        clearCompletionState();
      }

      openCompanionWindow();
      ensureAudioContext();
      started = true;
      running = true;
      targetWallTime = Date.now() + remainingMs;
      cancelAnimationFrame(frameId);
      tick();
    }

    function pause() {
      running = false;
      remainingMs = Math.max(0, targetWallTime - Date.now());
      cancelAnimationFrame(frameId);
      render();
    }

    function reset() {
      cancelAnimationFrame(frameId);
      syncDurationFromInputs();
      started = false;
      running = false;
      warningPlayed = false;
      clearCompletionState();
      render();
    }

    function finish() {
      running = false;
      remainingMs = 0;
      finishWallTime = Date.now();
      overtimePaused = false;
      overtimePausedElapsed = 0;
      cancelAnimationFrame(frameId);
      playFinishChime();
      startOvertimeCounter();
      render();
    }

    function setInputsLocked(locked) {
      Object.values(inputs).forEach((input) => {
        input.disabled = locked;
      });
      presetButtons.forEach((button) => {
        button.disabled = locked;
      });
    }

    function clearOvertimeCounter() {
      if (overtimeIntervalId) {
        window.clearInterval(overtimeIntervalId);
        overtimeIntervalId = null;
      }
    }

    function startOvertimeCounter() {
      clearOvertimeCounter();
      overtimeIntervalId = window.setInterval(() => {
        updateCompanion(100, false);
      }, 250);
    }

    function pauseOvertimeCounter() {
      if (!finishWallTime || overtimePaused) return;
      overtimePausedElapsed = Date.now() - finishWallTime;
      overtimePaused = true;
      clearOvertimeCounter();
      updateCompanion(100, false);
      render();
    }

    function resumeOvertimeCounter() {
      if (!overtimePaused) return;
      finishWallTime = Date.now() - overtimePausedElapsed;
      overtimePaused = false;
      startOvertimeCounter();
      updateCompanion(100, false);
      render();
    }

    function clearCompanionFeedback() {
      companionAcknowledged = false;
      companion.classList.remove("is-tapped", "is-acknowledged");
      syncToMini();
    }

    function ensureAudioContext() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return null;

      if (!audioContext) {
        audioContext = new AudioContext();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume().catch(() => {});
      }

      return audioContext;
    }

    function playToneSequence(notes) {
      const context = ensureAudioContext();
      if (!context) return;

      const now = context.currentTime + 0.01;

      notes.forEach((note) => {
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        const startAt = now + note.delay;
        const duration = note.duration;

        oscillator.type = note.type || "sine";
        oscillator.frequency.value = note.frequency;
        oscillator.connect(gain);
        gain.connect(context.destination);
        gain.gain.setValueAtTime(0.001, startAt);
        gain.gain.linearRampToValueAtTime(note.gain, startAt + 0.018);
        gain.gain.exponentialRampToValueAtTime(0.001, startAt + duration);
        oscillator.start(startAt);
        oscillator.stop(startAt + duration + 0.03);
      });
    }

    function playWarningChime() {
      playToneSequence([
        { frequency: 880, delay: 0, duration: 0.12, gain: 0.055 },
        { frequency: 660, delay: 0.16, duration: 0.2, gain: 0.052 }
      ]);
    }

    function playFinishChime() {
      const rings = [0, 0.58, 1.16];
      const notes = rings.flatMap((delay) => [
        { frequency: 1046.5, delay, duration: 0.34, gain: 0.082 },
        { frequency: 783.99, delay: delay + 0.04, duration: 0.42, gain: 0.058 }
      ]);
      playToneSequence(notes);
    }

  <script>
    (function () {
      const body = document.body;
      const card = document.querySelector("#miniCard");
      const timeEl = document.querySelector("#miniTime");
      const phaseEl = document.querySelector("#miniPhase");
      const noteEl = document.querySelector("#miniNote");
      const fillEl = document.querySelector("#miniFill");

      // snapshot 由主窗推送，是时间的唯一真相来源
      let snap = {
        started: false,
        running: false,
        complete: false,
        totalMs: 0,
        remainingMs: 0,
        targetWallTime: 0,
        finishWallTime: 0,
        overtimePaused: false,
        overtimePausedElapsed: 0,
        progress: 0,
        warningThreshold: 0,
        phase: "待机",
        note: "等待开始"
      };

      function getProgress() {
        const progress = snap.totalMs > 0 ? ((snap.totalMs - snap.remainingMs) / snap.totalMs) * 100 : 0;
        return Math.min(100, Math.max(0, progress));
      }

      function formatTime(ms) {
        const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        if (hours > 0) {
          return String(hours).padStart(2, "0") + ":" + String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
        }
        return String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
      }

      function formatElapsed(ms) {
        const totalSeconds = Math.max(0, Math.floor(ms / 1000));
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        if (hours > 0) {
          return "+" + String(hours).padStart(2, "0") + ":" + String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
        }
        return "+" + String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
      }

      function computePhase(progress) {
        if (!snap.started) return { state: "idle", phase: "待机", note: "等待开始" };
        if (snap.complete) {
          return snap.overtimePaused
            ? { state: "complete", phase: "已暂停", note: "点击继续" }
            : { state: "complete", phase: "已结束", note: "点击暂停" };
        }
        if (!snap.running) return { state: "paused", phase: "暂停", note: "点击继续" };
        if (snap.remainingMs > 0 && snap.remainingMs <= snap.warningThreshold) {
          return { state: "warning", phase: "快结束", note: "最后阶段" };
        }
        if (progress >= 66) return { state: "running", phase: "进行中", note: Math.round(progress) + "%" };
        if (progress >= 33) return { state: "running", phase: "进行中", note: Math.round(progress) + "%" };
        return { state: "running", phase: "进行中", note: Math.round(progress) + "%" };
      }

      function render() {
        let remainingMs = snap.remainingMs;
        let progress = snap.progress;
        let complete = snap.complete;
        let overtimePaused = snap.overtimePaused;

        // running 状态下，小窗用自己的心跳实时计算剩余时间——
        // 主窗最小化不影响本窗 rAF，确保始终走动
        if (snap.running && snap.targetWallTime > 0) {
          remainingMs = Math.max(0, snap.targetWallTime - Date.now());
          if (remainingMs <= 0) {
            // 本地即时切到完成态视觉，正式完成由主窗权威触发
            remainingMs = 0;
            complete = true;
          }
          progress = snap.totalMs > 0 ? ((snap.totalMs - remainingMs) / snap.totalMs) * 100 : 0;
          progress = Math.min(100, Math.max(0, progress));
        }

        if (complete) {
          progress = 100;
        }

        const info = computePhase(progress);

        body.dataset.state = info.state;

        let displayTime;
        let displayNote;
        if (complete) {
          const elapsedMs = snap.finishWallTime > 0
            ? (overtimePaused ? snap.overtimePausedElapsed : Date.now() - snap.finishWallTime)
            : 0;
          displayTime = formatElapsed(elapsedMs);
          displayNote = overtimePaused ? "点击继续" : "点击暂停";
        } else {
          displayTime = formatTime(remainingMs);
          displayNote = info.note;
        }

        timeEl.textContent = displayTime;
        timeEl.dataset.length = displayTime.length > 5 ? "long" : "short";
        phaseEl.textContent = complete ? (overtimePaused ? "已暂停" : "已结束") : info.phase;
        noteEl.textContent = displayNote;
        fillEl.style.width = progress.toFixed(3) + "%";

        document.title = "一刻 " + displayTime;
      }

      // 心跳：只要小窗开着就持续跑（即使主窗最小化）
      function loop() {
        render();
        requestAnimationFrame(loop);
      }

      // 主窗通过本函数推送完整快照
      window.__oneTimerSync = function (next) {
        snap = next;
      };

      window.__oneTimerCard = card;

      // 主窗触发完成确认时的 tap 动画
      window.__oneTimerTap = function (acknowledged) {
        card.classList.add("is-tapped");
        if (acknowledged) {
          card.classList.add("is-acknowledged");
        }
        window.setTimeout(function () {
          card.classList.remove("is-tapped");
        }, 440);
      };

      card.addEventListener("click", function () {
        if (window.opener && typeof window.opener.__oneTimerClick === "function") {
          window.opener.__oneTimerClick();
        }
      });

      requestAnimationFrame(loop);
    })();
  <\/script>
</body>
</html>`;
    }

    function getMiniWindowFeatures(width, height) {
      const screenLeft = window.screen.availLeft ?? 0;
      const screenTop = window.screen.availTop ?? 0;
      const screenWidth = window.screen.availWidth || window.screen.width || 1280;
      const left = Math.max(screenLeft + 12, screenLeft + screenWidth - width - 18);
      const top = screenTop + 18;

      return [
        `width=${width}`,
        `height=${height}`,
        `left=${Math.round(left)}`,
        `top=${Math.round(top)}`,
        "popup=yes",
        "toolbar=no",
        "location=no",
        "menubar=no",
        "status=no",
        "scrollbars=no",
        "resizable=yes"
      ].join(",");
    }

    function openMiniWindow() {
      if (miniWindow && !miniWindow.closed) {
        return true;
      }

      const width = 190;
      const height = 152;
      miniWindow = window.open("", "oneTimerMini", getMiniWindowFeatures(width, height));

      if (!miniWindow) {
        miniWindowEls = null;
        return false;
      }

      try {
        const doc = miniWindow.document;
        doc.open();
        doc.write(getMiniDocument());
        doc.close();
        doc.title = "一刻 One Timer";

        miniWindowEls = {
          win: miniWindow,
          card: null
        };

        // 等待小窗脚本就绪后绑定卡片引用与回调
        const bind = () => {
          if (!miniWindow || miniWindow.closed) {
            return;
          }
          try {
            if (typeof miniWindow.__oneTimerCard === "undefined") {
              window.setTimeout(bind, 30);
              return;
            }
            miniWindowEls.card = miniWindow.__oneTimerCard;
            syncToMini();
          } catch (error) {
            window.setTimeout(bind, 30);
          }
        };
        bind();

        miniWindow.addEventListener("beforeunload", () => {
          miniWindow = null;
          miniWindowEls = null;
          if (started) {
            showInlineCompanion();
          }
        });
        miniWindow.focus();
        return true;
      } catch (error) {
        miniWindow = null;
        miniWindowEls = null;
        return false;
      }
    }

    function showInlineCompanion() {
      companion.hidden = false;
      window.requestAnimationFrame(() => {
        companion.classList.add("is-visible");
      });
    }

    function hideInlineCompanion() {
      companion.classList.remove("is-visible");
      companion.hidden = true;
    }

    function openCompanionWindow() {
      const openedMini = openMiniWindow();

      if (openedMini) {
        hideInlineCompanion();
      } else {
        showInlineCompanion();
      }

      updateCompanion(getProgress(), isWarningPhase());
    }

    function getCompanionState(progress, warningPhase) {
      if (!started) {
        return { state: "idle", phase: "待机", note: "等待开始" };
      }

      if (remainingMs <= 0) {
        return overtimePaused
          ? { state: "complete", phase: "已暂停", note: "点击继续" }
          : { state: "complete", phase: "已结束", note: "点击暂停" };
      }

      if (!running) {
        return { state: "paused", phase: "暂停", note: "点击继续" };
      }

      if (warningPhase) {
        return { state: "warning", phase: "快结束", note: "最后阶段" };
      }

      if (progress >= 66) {
        return { state: "running", phase: "进行中", note: `${Math.round(progress)}%` };
      }

      if (progress >= 33) {
        return { state: "running", phase: "进行中", note: `${Math.round(progress)}%` };
      }

      return { state: "running", phase: "进行中", note: `${Math.round(progress)}%` };
    }

    function buildSnapshot(progress = getProgress(), warningPhase = isWarningPhase()) {
      const state = getCompanionState(progress, warningPhase);
      return {
        started,
        running,
        complete: started && remainingMs <= 0,
        totalMs,
        remainingMs,
        targetWallTime,
        finishWallTime: finishWallTime || 0,
        overtimePaused,
        overtimePausedElapsed,
        progress,
        warningThreshold: getWarningThreshold(totalMs),
        warningPhase,
        acknowledged: companionAcknowledged,
        stateName: state.state,
        phase: state.phase,
        note: state.note
      };
    }

    function syncToMini() {
      if (!miniWindow || miniWindow.closed || typeof miniWindow.__oneTimerSync !== "function") {
        return;
      }
      try {
        miniWindow.__oneTimerSync(buildSnapshot());
      } catch (error) {
        // 跨窗通信异常时静默，不影响计时
      }
    }

    function updateCompanion(progress = getProgress(), warningPhase = isWarningPhase()) {
      if ((!companion || companion.hidden) && !miniWindowEls) {
        return;
      }

      const state = getCompanionState(progress, warningPhase);
      const isComplete = started && remainingMs <= 0;
      const elapsedMs = isComplete && finishWallTime
        ? (overtimePaused ? overtimePausedElapsed : Date.now() - finishWallTime)
        : 0;
      const displayProgress = isComplete ? 100 : progress;
      const displayedTime = isComplete ? formatElapsed(elapsedMs) : formatTime(remainingMs);
      const displayedNote = isComplete ? (overtimePaused ? "点击继续" : "点击暂停") : state.note;

      // 内联浮窗：直接写 DOM
      if (companion && !companion.hidden) {
        companion.dataset.state = state.state;
        companion.style.setProperty("--mini-progress", `${displayProgress.toFixed(3)}%`);
        miniTime.textContent = displayedTime;
        miniPhase.textContent = state.phase;
        miniNote.textContent = displayedNote;
        miniFill.style.width = `${displayProgress.toFixed(3)}%`;
      }

      // 桌面小窗：推送完整快照，由小窗自己心跳渲染
      syncToMini();
    }

    function triggerCompanionFeedback() {
      companionAcknowledged = true;

      if (companionTapTimeoutId) {
        window.clearTimeout(companionTapTimeoutId);
      }

      companion.classList.add("is-tapped", "is-acknowledged");

      playToneSequence([
        { frequency: 587.33, delay: 0, duration: 0.16, gain: 0.04 },
        { frequency: 880, delay: 0.1, duration: 0.22, gain: 0.036 }
      ]);

      companionTapTimeoutId = window.setTimeout(() => {
        companion.classList.remove("is-tapped");
      }, 440);

      // 桌面小窗：触发 tap 动画（小窗自己有心跳渲染 acknowledged）
      if (miniWindow && !miniWindow.closed && typeof miniWindow.__oneTimerTap === "function") {
        miniWindow.__oneTimerTap(true);
      }

      updateCompanion(100, false);
    }

    function handleCompanionClick(event) {
      if (event) {
        event.preventDefault();
      }

      if (companionMovedDuringDrag) {
        companionMovedDuringDrag = false;
        return;
      }

      if (!started) return;

      if (running) {
        pause();
        return;
      }

      if (remainingMs > 0) {
        start();
        return;
      }

      if (overtimePaused) {
        resumeOvertimeCounter();
      } else {
        pauseOvertimeCounter();
      }

      triggerCompanionFeedback();
    }

    function clampCompanionPosition(left, top) {
      const rect = companion.getBoundingClientRect();
      const margin = 8;
      const maxLeft = Math.max(margin, window.innerWidth - rect.width - margin);
      const maxTop = Math.max(margin, window.innerHeight - rect.height - margin);

      return {
        left: Math.min(maxLeft, Math.max(margin, left)),
        top: Math.min(maxTop, Math.max(margin, top))
      };
    }

    companionDrag.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;

      const rect = companion.getBoundingClientRect();
      companionDragState = {
        pointerId: event.pointerId,
        offsetX: event.clientX - rect.left,
        offsetY: event.clientY - rect.top
      };
      companionMovedDuringDrag = false;
      companion.classList.add("is-dragging");
      companionDrag.setPointerCapture(event.pointerId);
      event.preventDefault();
    });

    document.addEventListener("pointermove", (event) => {
      if (!companionDragState || companionDragState.pointerId !== event.pointerId) return;

      const position = clampCompanionPosition(
        event.clientX - companionDragState.offsetX,
        event.clientY - companionDragState.offsetY
      );

      companion.style.left = `${position.left}px`;
      companion.style.top = `${position.top}px`;
      companion.style.right = "auto";
      companion.style.bottom = "auto";
      companionMovedDuringDrag = true;
    });

    document.addEventListener("pointerup", (event) => {
      if (!companionDragState || companionDragState.pointerId !== event.pointerId) return;

      companion.classList.remove("is-dragging");
      try {
        companionDrag.releasePointerCapture(event.pointerId);
      } catch (error) {}
      companionDragState = null;
    });

    document.addEventListener("pointercancel", () => {
      companion.classList.remove("is-dragging");
      companionDragState = null;
    });

    companion.addEventListener("click", handleCompanionClick);

    companion.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;

      event.preventDefault();
      event.stopPropagation();
      handleCompanionClick(event);
    });

    // 桌面小窗点击的回调入口（小窗通过 window.opener.__oneTimerClick 调用）
    window.__oneTimerClick = function () {
      handleCompanionClick();
    };

    window.addEventListener("resize", () => {
      if (companion.hidden || companion.style.left === "") return;

      const rect = companion.getBoundingClientRect();
      const position = clampCompanionPosition(rect.left, rect.top);
      companion.style.left = `${position.left}px`;
      companion.style.top = `${position.top}px`;
    });

    startPause.addEventListener("click", () => {
      if (running) {
        pause();
      } else {
        start();
      }
    });

    resetButton.addEventListener("click", reset);

    Object.values(inputs).forEach((input) => {
      input.addEventListener("input", () => {
        if (!canEditDuration()) return;
        leaveCompletedStateForEditing();
        syncDurationFromInputs();
        render();
      });

      input.addEventListener("blur", () => {
        normalizeInputs();
        if (!canEditDuration()) return;
        leaveCompletedStateForEditing();
        syncDurationFromInputs();
        render();
      });
    });

    presetButtons.forEach((button) => {
      button.addEventListener("click", () => {
        if (!canEditDuration()) return;

        leaveCompletedStateForEditing();
        setDurationFromMinutes(Number(button.dataset.minutes || 0));
        render();
      });
    });

    document.addEventListener("keydown", (event) => {
      const activeTag = document.activeElement?.tagName;
      const isTyping = activeTag === "INPUT" || activeTag === "TEXTAREA";

      if (event.code === "Space" && !isTyping) {
        event.preventDefault();
        if (!startPause.disabled) startPause.click();
      }

      if (event.key === "Escape") {
        reset();
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        reconcileAfterWake();
      }
    });

    window.addEventListener("focus", reconcileAfterWake);
    window.addEventListener("pageshow", reconcileAfterWake);

    window.addEventListener("beforeunload", () => {
      clearOvertimeCounter();
      if (guardIntervalId) {
        window.clearInterval(guardIntervalId);
        guardIntervalId = null;
      }
      if (miniWindow && !miniWindow.closed) {
        miniWindow.close();
      }
    });

    // 兜底守护：约 400ms 一次。
    // 1) 主窗最小化时 rAF 会停摆，这里保证到点仍能触发完成（响铃/超时计时）。
    // 2) 持续推送快照给桌面小窗，确保任何状态变化（完成/暂停）即使主窗被节流也能传达。
    guardIntervalId = window.setInterval(() => {
      if (running) {
        reconcileRunningTimer();
      } else if (miniWindow && !miniWindow.closed) {
        syncToMini();
      }
    }, 400);

    render();
  </script>
</body>
