<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>成长像素 | Pixel Grow</title>
    <style>
        /* --- 1. 基础变量与重置 --- */
        :root {
            --bg-color: #f4f9f4;       /* 暖白/淡绿背景 */
            --primary: #78c2a4;        /* 薄荷绿 */
            --primary-dark: #5a9e82;   /* 按压态深绿 */
            --text-main: #2c3e50;      /* 深灰文字 */
            --text-sub: #7f8c8d;       /* 辅助文字 */
            --pixel-border: #2c3e50;   /* 像素边框色 */
            --card-bg: #ffffff;
            --shadow: 4px 4px 0px var(--pixel-border);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Courier New', Courier, monospace; /* 像素风字体回退 */
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* --- 2. 像素风通用组件 --- */
        .pixel-box {
            background: var(--card-bg);
            border: 3px solid var(--pixel-border);
            box-shadow: var(--shadow);
            border-radius: 2px; /* 极小圆角模拟像素 */
            padding: 16px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            position: relative;
        }

        h1, h2, h3 { 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 10px;
        }

        /* 按钮样式 */
        .pixel-btn {
            background: var(--primary);
            border: 3px solid var(--pixel-border);
            box-shadow: 4px 4px 0px var(--pixel-border);
            color: white;
            padding: 12px 24px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            text-align: center;
            user-select: none;
        }

        .pixel-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--pixel-border);
            background: var(--primary-dark);
        }

        /* --- 3. 仪表盘与宠物 --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-item { text-align: center; }
        .stat-value { font-size: 24px; font-weight: bold; color: var(--primary-dark); }
        .stat-label { font-size: 12px; color: var(--text-sub); }

        #pet-canvas {
            width: 100%;
            height: 120px;
            image-rendering: pixelated; /* 关键：保持像素锐利 */
            background: repeating-linear-gradient(0deg, transparent, transparent 10px, rgba(0,0,0,0.03) 10px, rgba(0,0,0,0.03) 11px);
            border-bottom: 2px dashed var(--pixel-border);
            margin-bottom: 10px;
        }

        /* --- 4. 打卡交互区 --- */
        .action-area { text-align: center; padding: 20px 0; }
        .big-btn {
            font-size: 20px;
            padding: 20px 40px;
            width: 100%;
            max-width: 300px;
            position: relative;
            overflow: hidden;
        }
        .big-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: rgba(255,255,255,0.3);
            transform: skewX(-20deg);
            animation: shine 3s infinite;
        }
        @keyframes shine { 0%, 100% { left: -100%; } 50% { left: 150%; } }

        /* --- 5. 弹窗与表单 --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.6);
            display: none; justify-content: center; align-items: center;
            z-index: 100;
            backdrop-filter: blur(2px);
        }
        .modal-content {
            background: var(--card-bg);
            border: 3px solid var(--pixel-border);
            box-shadow: 8px 8px 0px var(--pixel-border);
            padding: 24px;
            width: 90%; max-width: 360px;
            animation: popIn 0.2s ease-out;
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        input, textarea {
            width: 100%; padding: 10px; margin: 10px 0;
            border: 2px solid var(--pixel-border);
            font-family: inherit; font-size: 14px;
            background: #fff;
            outline: none;
        }
        input:focus, textarea:focus { background: #f0f9f4; }
        textarea { resize: none; height: 80px; }

        .tag-container { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .tag {
            padding: 4px 8px; border: 2px solid var(--text-sub);
            font-size: 12px; cursor: pointer; transition: 0.2s;
        }
        .tag.active { background: var(--primary); border-color: var(--pixel-border); color: #fff; }

        /* --- 6. 成长地图 --- */
        .map-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .map-day {
            aspect-ratio: 1;
            background: #e0e0e0;
            border: 1px solid #ccc;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
        }
        .map-day.active { background: var(--primary); border-color: var(--pixel-border); }
        .map-day.today { border: 2px solid var(--text-main); }
        
        .tooltip {
            position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%);
            background: var(--pixel-border); color: #fff; padding: 4px 8px;
            font-size: 10px; white-space: nowrap; pointer-events: none;
            opacity: 0; transition: 0.2s; z-index: 10;
        }
        .map-day:hover .tooltip { opacity: 1; }

        /* --- 7. 撒花与成就特效 --- */
        .confetti {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 200; overflow: hidden;
        }
        .confetti-piece {
            position: absolute; width: 10px; height: 10px;
            background: var(--primary); top: -20px;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        .achievement-badge {
            position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
            background: #ffd700; border: 3px solid var(--pixel-border);
            padding: 20px; text-align: center; z-index: 300;
            box-shadow: 6px 6px 0px var(--pixel-border);
            display: none; animation: bounce 0.5s ease;
        }
        @keyframes bounce { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-20px); } }

        /* 震动反馈辅助类 */
        .shake { animation: shake 0.3s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

    </style>
</head>
<body>

    <!-- 首页仪表盘 -->
    <div class="pixel-box">
        <h2>🌱 成长像素</h2>
        <canvas id="pet-canvas" width="300" height="120"></canvas>
        <div class="dashboard-grid">
            <div class="stat-item">
                <div class="stat-value" id="streak-days">0</div>
                <div class="stat-label">连续打卡</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="total-hours">0h</div>
                <div class="stat-label">累计时长</div>
            </div>
        </div>
        <div style="font-size:12px; color:var(--text-sub); text-align:center;" id="pet-status">宠物正在睡觉... zzZ</div>
    </div>

    <!-- 打卡交互区 -->
    <div class="pixel-box action-area">
        <button class="pixel-btn big-btn" id="checkin-btn">▶ 开始专注/打卡</button>
        <p style="margin-top:10px; font-size:12px; color:var(--text-sub);">点击记录今日学习</p>
    </div>

    <!-- 历史足迹 -->
    <div class="pixel-box">
        <h3>🗺️ 成长地图</h3>
        <div class="map-grid" id="history-map">
            <!-- JS 动态生成 -->
        </div>
        <div style="margin-top:8px; font-size:10px; color:var(--text-sub); display:flex; justify-content:space-between;">
            <span>30天前</span><span>今天</span>
        </div>
    </div>

    <!-- 打卡弹窗 -->
    <div class="modal-overlay" id="checkin-modal">
        <div class="modal-content">
            <h3>📝 今日小结</h3>
            <textarea id="note-input" placeholder="今天学了什么？有什么感悟？"></textarea>
            <div class="tag-container">
                <div class="tag" data-tag="阅读">📚 阅读</div>
                <div class="tag" data-tag="编码">💻 编码</div>
                <div class="tag" data-tag="运动">🏃 运动</div>
                <div class="tag" data-tag="思考">💡 思考</div>
            </div>
            <input type="number" id="duration-input" placeholder="学习时长 (分钟)" min="1" max="600">
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button class="pixel-btn" style="flex:1; background:#ccc; color:#333;" id="cancel-btn">取消</button>
                <button class="pixel-btn" style="flex:2;" id="submit-btn">确认打卡</button>
            </div>
        </div>
    </div>

    <!-- 成就弹窗 -->
    <div class="achievement-badge" id="achievement-popup">
        <div style="font-size:30px;">🏆</div>
        <h3 id="achieve-title">成就解锁!</h3>
        <p id="achieve-desc" style="font-size:14px; margin:10px 0;">坚持就是胜利</p>
        <button class="pixel-btn" onclick="closeAchievement()">太棒了!</button>
    </div>

    <!-- 撒花容器 -->
    <div class="confetti" id="confetti-container"></div>

<script>
/**
 * ==========================================
 *  成长像素 (Pixel Grow) - 核心逻辑
 * ==========================================
 */

// --- 1. 数据管理模块 ---
const STORAGE_KEY = 'pixel_grow_data_v1';

const DataManager = {
    getData: () => {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { records: [], achievements: [] };
        try { return JSON.parse(raw); } catch { return { records: [], achievements: [] }; }
    },
    saveData: (data) => localStorage.setItem(STORAGE_KEY, JSON.stringify(data)),
    
    // 获取今日记录
    getTodayRecord: () => {
        const data = DataManager.getData();
        const today = new Date().toISOString().split('T')[0];
        return data.records.find(r => r.date === today);
    },

    // 添加记录
    addRecord: (note, tags, duration) => {
        const data = DataManager.getData();
        const today = new Date().toISOString().split('T')[0];
        const existingIdx = data.records.findIndex(r => r.date === today);
        
        const record = { date: today, note, tags, duration, timestamp: Date.now() };
        
        if (existingIdx > -1) {
            // 更新今日记录
            data.records[existingIdx] = record;
        } else {
            data.records.push(record);
        }
        
        DataManager.saveData(data);
        return data;
    },

    // 计算连续打卡天数
    getStreak: () => {
        const data = DataManager.getData();
        if (!data.records.length) return 0;
        
        const dates = data.records.map(r => r.date).sort().reverse();
        const today = new Date();
        const todayStr = today.toISOString().split('T')[0];
        
        // 如果今天没打卡，检查昨天是否打卡（允许跨天到0点前）
        // 简化逻辑：从最近一天开始往前推
        let streak = 0;
        let checkDate = new Date(dates[0]); // 从最新记录开始
        
        // 如果最新记录不是今天也不是昨天，连续中断
        const diffFromToday = Math.floor((new Date(todayStr) - checkDate) / 86400000);
        if (diffFromToday > 1) return 0;

        for (let i = 0; i < dates.length; i++) {
            const expected = new Date(todayStr);
            expected.setDate(expected.getDate() - (diffFromToday + i));
            const expectedStr = expected.toISOString().split('T')[0];
            
            if (dates[i] === expectedStr) {
                streak++;
            } else {
                break;
            }
        }
        return streak;
    },

    // 计算总时长
    getTotalDuration: () => {
        const data = DataManager.getData();
        return data.records.reduce((sum, r) => sum + (parseInt(r.duration) || 0), 0);
    }
};

// --- 2. 音效与反馈模块 ---
const Feedback = {
    // 使用 Web Audio API 生成简单的 8-bit 音效，无需外部文件
    playTone: (freq, type, duration) => {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type; // 'square' 是经典像素风
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duration);
        } catch(e) { /* 静默失败 */ }
    },
    
    clickSound: () => Feedback.playTone(600, 'square', 0.1),
    successSound: () => {
        Feedback.playTone(800, 'square', 0.1);
        setTimeout(() => Feedback.playTone(1000, 'square', 0.1), 100);
        setTimeout(() => Feedback.playTone(1200, 'square', 0.2), 200);
    },
    achieveSound: () => {
        [523, 659, 784, 1047].forEach((f, i) => {
            setTimeout(() => Feedback.playTone(f, 'square', 0.3), i * 150);
        });
    },

    vibrate: () => {
        if (navigator.vibrate) navigator.vibrate(50);
    }
};

// --- 3. 像素宠物渲染模块 (Canvas) ---
const PetRenderer = {
    canvas: null,
    ctx: null,
    frame: 0,
    
    init: () => {
        PetRenderer.canvas = document.getElementById('pet-canvas');
        PetRenderer.ctx = PetRenderer.canvas.getContext('2d');
        PetRenderer.ctx.imageSmoothingEnabled = false; // 关键：关闭抗锯齿
        requestAnimationFrame(PetRenderer.loop);
    },

    loop: () => {
        PetRenderer.frame++;
        PetRenderer.draw();
        requestAnimationFrame(PetRenderer.loop);
    },

    draw: () => {
        const ctx = PetRenderer.ctx;
        const w = PetRenderer.canvas.width;
        const h = PetRenderer.canvas.height;
        const streak = DataManager.getStreak();
        
        // 清空画布
        ctx.fillStyle = '#f4f9f4';
        ctx.fillRect(0, 0, w, h);

        // 绘制地面
        ctx.fillStyle = '#78c2a4';
        ctx.fillRect(0, h - 20, w, 20);
        ctx.fillStyle = '#5a9e82';
        for(let i=0; i<w; i+=20) ctx.fillRect(i, h-20, 10, 5);

        // 根据天数决定宠物形态
        const cx = w / 2;
        const cy = h - 30;
        
        if (streak < 7) {
            // 阶段1: 种子/小芽
            PetRenderer.drawSeed(ctx, cx, cy, PetRenderer.frame);
        } else if (streak < 21) {
            // 阶段2: 小苗
            PetRenderer.drawSprout(ctx, cx, cy, PetRenderer.frame);
        } else {
            // 阶段3: 开花植物
            PetRenderer.drawFlower(ctx, cx, cy, PetRenderer.frame);
        }
    },

    // 像素绘制辅助函数
    px: (ctx, x, y, s, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, s, s); },

    drawSeed: (ctx, cx, cy, f) => {
        const s = 6; // 像素大小
        const bounce = Math.sin(f * 0.1) * 2;
        // 种子身体
        PetRenderer.px(ctx, cx-s, cy-s*2+bounce, s*2, s*2, '#8d6e63');
        PetRenderer.px(ctx, cx-s/2, cy-s*3+bounce, s, s, '#a1887f');
        // 小眼睛
        PetRenderer.px(ctx, cx-s*0.8, cy-s*1.5+bounce, 2, 2, '#000');
