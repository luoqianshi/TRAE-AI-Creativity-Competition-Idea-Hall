function handleFileUpload(files) {
  const fileArr = Array.from(files);
  fileArr.forEach(f => {
    pendingFiles.push(f);
  });
  renderFileList();
}

function renderFileList() {
  const imgRow = document.getElementById('image-preview-row');
  const fileList = document.getElementById('file-list');
  const uploadArea = document.getElementById('file-upload-area');
  imgRow.innerHTML = '';
  fileList.innerHTML = '';

  if (pendingFiles.length === 0) {
    uploadArea.classList.remove('has-files');
    return;
  }
  uploadArea.classList.add('has-files');

  pendingFiles.forEach((f, idx) => {
    const isImage = f.type.startsWith('image/');
    if (isImage) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = document.createElement('img');
        img.className = 'image-preview';
        img.src = e.target.result;
        img.title = f.name;
        imgRow.appendChild(img);
      };
      reader.readAsDataURL(f);
    }

    const item = document.createElement('div');
    item.className = 'file-item';
    const iconSvg = isImage
      ? '<svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>';
    const sizeStr = f.size < 1024 ? f.size + 'B' : (f.size < 1048576 ? (f.size/1024).toFixed(1) + 'KB' : (f.size/1048576).toFixed(1) + 'MB');
    item.innerHTML = `
      <div class="file-item-icon">${iconSvg}</div>
      <div class="file-item-name">${f.name}</div>
      <div class="file-item-size">${sizeStr}</div>
      <div class="file-item-remove" data-idx="${idx}">×</div>
    `;
    fileList.appendChild(item);
  });

  fileList.querySelectorAll('.file-item-remove').forEach(el => {
    el.addEventListener('click', (e) => {
      const idx = parseInt(e.target.dataset.idx);
      pendingFiles.splice(idx, 1);
      renderFileList();
    });
  });
}

function confirmMemory() {
  if (!selectedFriend) return;
  const title = document.getElementById('memory-title').value.trim();
  const date = document.getElementById('memory-date').value;
  const content = document.getElementById('memory-content').value.trim();
  if (!date || !content) {
    alert('请填写日期与记事');
    return;
  }

  const hasImage = pendingFiles.some(f => f.type.startsWith('image/'));

  // 将文件转为 base64 存储（仅存名称与类型用于展示，图片存缩略图）
  const attachments = [];
  let processed = 0;
  const total = pendingFiles.length;

  function finish() {
    if (!selectedFriend.memories) selectedFriend.memories = [];
    selectedFriend.memories.push({
      title: title || '',
      date, content, hasImage,
      mood: selectedMood,
      tags: [...selectedTags],
      attachments
    });
    document.getElementById('card-memcount').textContent = selectedFriend.memories.length;
    renderTimeline(selectedFriend);
    if (selectedFriend.isSelf) {
      updateSunGalaxy();
    } else {
      updateStarInScene(selectedFriend);
    }
    document.getElementById('memory-modal').classList.remove('visible');
  }

  if (total === 0) { finish(); return; }

  pendingFiles.forEach((f, idx) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const isImage = f.type.startsWith('image/');
      attachments.push({
        name: f.name,
        type: f.type,
        size: f.size,
        isImage,
        data: isImage ? e.target.result : null
      });
      processed++;
      if (processed === total) finish();
    };
    reader.onerror = () => {
      attachments.push({ name: f.name, type: f.type, size: f.size, isImage: false, data: null });
      processed++;
      if (processed === total) finish();
    };
    if (f.type.startsWith('image/')) {
      reader.readAsDataURL(f);
    } else {
      reader.readAsText(f);
    }
  });
}

function deleteMemory(idx) {
  if (!selectedFriend || !selectedFriend.memories) return;
  selectedFriend.memories.splice(idx, 1);
  document.getElementById('card-memcount').textContent = selectedFriend.memories.length;
  renderTimeline(selectedFriend);
  if (selectedFriend.isSelf) {
    updateSunGalaxy();
  } else {
    updateStarInScene(selectedFriend);
  }
}

// ============ 登录界面 ============
function initLoginScreen() {
  const canvas = document.getElementById('login-stars');
  const ctx = canvas.getContext('2d');
  let loginStars = [];
  let meteors = [];
  let nebulae = [];
  let constellations = [];
  let loginTime = 0;

  function resizeLoginCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeLoginCanvas();
  window.addEventListener('resize', resizeLoginCanvas);

  // 普通星星
  for (let i = 0; i < 250; i++) {
    loginStars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.3,
      a: Math.random(),
      da: (Math.random() - 0.5) * 0.015,
      vx: (Math.random() - 0.5) * 0.08,
      vy: (Math.random() - 0.5) * 0.08
    });
  }

  // 星云团（彩色弥散光斑）
  const nebulaColors = [
    [212, 160, 23],
    [227, 66, 52],
    [46, 139, 139],
    [123, 94, 167]
  ];
  for (let i = 0; i < 5; i++) {
    nebulae.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: 120 + Math.random() * 180,
      color: nebulaColors[i % nebulaColors.length],
      phase: Math.random() * Math.PI * 2,
      driftX: (Math.random() - 0.5) * 0.15,
      driftY: (Math.random() - 0.5) * 0.15
    });
  }

  // 星座连线节点
  for (let i = 0; i < 12; i++) {
    constellations.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.05,
      vy: (Math.random() - 0.5) * 0.05
    });
  }

  // 流星
  function spawnMeteor() {
    const fromLeft = Math.random() > 0.5;
    meteors.push({
      x: fromLeft ? -50 : canvas.width + 50,
      y: Math.random() * canvas.height * 0.6,
      vx: fromLeft ? 6 + Math.random() * 4 : -(6 + Math.random() * 4),
      vy: 2 + Math.random() * 3,
      life: 1,
      trail: []
    });
  }

  function drawLoginBg() {
    loginTime += 0.016;

    // 渐变背景
    const grad = ctx.createRadialGradient(
      canvas.width / 2, canvas.height / 2, 0,
      canvas.width / 2, canvas.height / 2, canvas.width * 0.7
    );
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(1, '#000000');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 星云
    nebulae.forEach(n => {
      n.x += n.driftX;
      n.y += n.driftY;
      if (n.x < -n.r) n.x = canvas.width + n.r;
      if (n.x > canvas.width + n.r) n.x = -n.r;
      if (n.y < -n.r) n.y = canvas.height + n.r;
      if (n.y > canvas.height + n.r) n.y = -n.r;
      const pulse = 0.3 + Math.sin(loginTime * 0.5 + n.phase) * 0.15;
      const ng = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
      ng.addColorStop(0, `rgba(${n.color[0]},${n.color[1]},${n.color[2]},${pulse * 0.15})`);
      ng.addColorStop(1, `rgba(${n.color[0]},${n.color[1]},${n.color[2]},0)`);
      ctx.fillStyle = ng;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // 星座连线
    ctx.strokeStyle = 'rgba(212, 160, 23, 0.08)';
    ctx.lineWidth = 0.5;
    for (let i = 0; i < constellations.length; i++) {
      const c = constellations[i];
      c.x += c.vx;
      c.y += c.vy;
      if (c.x < 0 || c.x > canvas.width) c.vx = -c.vx;
      if (c.y < 0 || c.y > canvas.height) c.vy = -c.vy;
      for (let j = i + 1; j < constellations.length; j++) {
        const c2 = constellations[j];
        const dist = Math.hypot(c.x - c2.x, c.y - c2.y);
        if (dist < 220) {
          ctx.globalAlpha = (1 - dist / 220) * 0.5;
          ctx.beginPath();
          ctx.moveTo(c.x, c.y);
          ctx.lineTo(c2.x, c2.y);
          ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;
    constellations.forEach(c => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(240, 208, 96, 0.6)';
      ctx.fill();
    });

    // 星星
    loginStars.forEach(s => {
      s.a += s.da;
      if (s.a < 0.1 || s.a > 1) s.da = -s.da;
      s.x += s.vx;
      s.y += s.vy;
      if (s.x < 0) s.x = canvas.width;
      if (s.x > canvas.width) s.x = 0;
      if (s.y < 0) s.y = canvas.height;
      if (s.y > canvas.height) s.y = 0;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 220, 150, ${s.a * 0.8})`;
      ctx.fill();
      // 大星星加十字光
      if (s.r > 1.2 && s.a > 0.7) {
        ctx.strokeStyle = `rgba(255, 220, 150, ${s.a * 0.3})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(s.x - s.r * 3, s.y);
        ctx.lineTo(s.x + s.r * 3, s.y);
        ctx.moveTo(s.x, s.y - s.r * 3);
        ctx.lineTo(s.x, s.y + s.r * 3);
        ctx.stroke();
      }
    });

    // 流星
    if (Math.random() < 0.008) spawnMeteor();
    meteors = meteors.filter(m => m.life > 0 && m.x > -100 && m.x < canvas.width + 100);
    meteors.forEach(m => {
      m.trail.push({ x: m.x, y: m.y });
      if (m.trail.length > 20) m.trail.shift();
      m.x += m.vx;
      m.y += m.vy;
      m.life -= 0.005;
      for (let i = 0; i < m.trail.length; i++) {
        const t = m.trail[i];
        const alpha = (i / m.trail.length) * m.life;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 1.5 * (i / m.trail.length), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 240, 200, ${alpha})`;
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(m.x, m.y, 2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 220, ${m.life})`;
      ctx.fill();
    });

    requestAnimationFrame(drawLoginBg);
  }
  drawLoginBg();

  // ===== 用户存储 =====
  function getUsers() {
    try {
      return JSON.parse(localStorage.getItem('zhixingji_users') || '{}');
    } catch (e) { return {}; }
  }
  function saveUsers(users) {
    localStorage.setItem('zhixingji_users', JSON.stringify(users));
  }

  // ===== 登录 / 注册切换 =====
  const loginBox = document.getElementById('login-box');
  const registerBox = document.getElementById('register-box');
  const loginScreen = document.getElementById('login-screen');

  document.getElementById('show-register').addEventListener('click', () => {
    loginBox.style.display = 'none';
    registerBox.style.display = 'flex';
    document.getElementById('reg-name').focus();
  });
  document.getElementById('show-login').addEventListener('click', () => {
    registerBox.style.display = 'none';
    loginBox.style.display = 'flex';
    document.getElementById('login-name').focus();
  });

  // ===== 登录逻辑 =====
  const nameInput = document.getElementById('login-name');
  const passInput = document.getElementById('login-pass');
  const loginMsg = document.getElementById('login-message');

  function showMsg(el, text, isSuccess) {
    el.textContent = text;
    el.classList.toggle('success', !!isSuccess);
  }

  function doLogin() {
    const name = nameInput.value.trim();
    const pass = passInput.value;
    if (!name) { nameInput.style.borderColor = 'var(--cinnabar)'; nameInput.focus(); return; }
    if (!pass) { passInput.style.borderColor = 'var(--cinnabar)'; passInput.focus(); return; }

    const users = getUsers();
    if (!users[name]) {
      showMsg(loginMsg, '此星卷尚未开辟，请先注册', false);
      return;
    }
    if (users[name] !== pass) {
      showMsg(loginMsg, '口令有误，请重试', false);
      passInput.style.borderColor = 'var(--cinnabar)';
      return;
    }

    showMsg(loginMsg, '入卷成功，星河启程...', true);
    if (userProfile) {
      userProfile.name = name;
      if (sunGalaxy && sunGalaxy.userData) {
        sunGalaxy.userData.friend.name = name;
      }
      updateUserCenterEntry();
    }
    setTimeout(() => {
      loginScreen.classList.add('hidden');
      setTimeout(() => { loginScreen.style.display = 'none'; }, 800);
    }, 600);
  }

  document.getElementById('login-btn').addEventListener('click', doLogin);
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') passInput.focus(); });
  passInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  nameInput.addEventListener('input', () => { nameInput.style.borderColor = ''; showMsg(loginMsg, '', false); });
  passInput.addEventListener('input', () => { passInput.style.borderColor = ''; showMsg(loginMsg, '', false); });

  // ===== 注册逻辑 =====
  const regName = document.getElementById('reg-name');
  const regPass = document.getElementById('reg-pass');
  const regPass2 = document.getElementById('reg-pass2');
  const regMsg = document.getElementById('register-message');

  function doRegister() {
    const name = regName.value.trim();
    const pass = regPass.value;
    const pass2 = regPass2.value;

    if (!name || name.length < 2) {
      regName.style.borderColor = 'var(--cinnabar)';
      showMsg(regMsg, '星主之名至少二字', false);
      regName.focus();
      return;
    }
    if (!pass || pass.length < 4) {
      regPass.style.borderColor = 'var(--cinnabar)';
      showMsg(regMsg, '口令不少于四位', false);
      regPass.focus();
      return;
    }
    if (pass !== pass2) {
      regPass2.style.borderColor = 'var(--cinnabar)';
      showMsg(regMsg, '两次口令不一致', false);
      regPass2.focus();
      return;
    }

    const users = getUsers();
    if (users[name]) {
      showMsg(regMsg, '此星卷已存在，请直接入卷', false);
      return;
    }

    users[name] = pass;
    saveUsers(users);
    showMsg(regMsg, '星卷开辟成功！即将入卷...', true);

    // 自动填充登录框
    nameInput.value = name;
    passInput.value = pass;

    setTimeout(() => {
      registerBox.style.display = 'none';
      loginBox.style.display = 'flex';
      showMsg(loginMsg, '注册成功，请入卷', true);
      passInput.focus();
    }, 1000);
  }

  document.getElementById('register-btn').addEventListener('click', doRegister);
  regName.addEventListener('keydown', e => { if (e.key === 'Enter') regPass.focus(); });
  regPass.addEventListener('keydown', e => { if (e.key === 'Enter') regPass2.focus(); });
  regPass2.addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
  [regName, regPass, regPass2].forEach(el => {
    el.addEventListener('input', () => { el.style.borderColor = ''; showMsg(regMsg, '', false); });
  });
}

// ============ 群组编辑 ============
let editingGroupId = null;
let editingGroupColor = null;
const ALL_GROUP_COLORS = [
  { key: 'vermilion', val: 0xE34234 },
  { key: 'azure', val: 0x2E8B8B },
  { key: 'gamboge', val: 0xE6A23C },
  { key: 'purple', val: 0x7B5EA7 },
  { key: 'pine', val: 0x6B8E4E }
];

function openGroupEdit(groupId) {
  const group = groups.find(g => g.id === groupId);
  if (!group) return;
  editingGroupId = groupId;
  editingGroupColor = group.color;
  
  document.getElementById('group-edit-name').value = group.name;
  
  const picker = document.getElementById('color-picker-row');
  picker.innerHTML = '';
  ALL_GROUP_COLORS.forEach(c => {
    const swatch = document.createElement('div');
    swatch.className = 'color-swatch';
    if (c.key === group.color) swatch.classList.add('selected');
    const hex = '#' + c.val.toString(16).padStart(6, '0');
    swatch.style.background = hex;
    swatch.addEventListener('click', () => {
      editingGroupColor = c.key;
      picker.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
      swatch.classList.add('selected');
    });
    picker.appendChild(swatch);
  });
  
  document.getElementById('group-edit-modal').classList.add('visible');
}

function confirmGroupEdit() {
  const group = groups.find(g => g.id === editingGroupId);
  if (!group) return;
  const newName = document.getElementById('group-edit-name').value.trim();
  if (newName) group.name = newName;
  if (editingGroupColor && editingGroupColor !== group.color) {
    const oldColorKey = group.color;
    group.color = editingGroupColor;
    GROUP_COLORS[oldColorKey] = GROUP_COLORS[editingGroupColor];
    // 更新该群组下所有朋友的颜色
    friends.forEach(f => {
      if (f.group === editingGroupColor) {
        updateStarInScene(f);
      }
    });
    // 重建所有连线
    rebuildAllConnections();
  }
  renderGroupList();
  document.getElementById('group-edit-modal').classList.remove('visible');
}

function rebuildAllConnections() {
  // 清除旧连线
  connectionLines.forEach(l => { scene.remove(l); l.geometry.dispose(); l.material.dispose(); });
  connectionLines = [];
  mutualConnectionLines.forEach(l => { scene.remove(l); l.geometry.dispose(); l.material.dispose(); });
  mutualConnectionLines = [];
  // 重建
  createConnections();
  createMutualConnections();
}

// ============ 日记星光点击 ============
let hoveredDiary = null;

function checkDiaryHover(event) {
  if (!sunGalaxy && starSystems.length === 0) return;
  raycaster.setFromCamera(mouse, camera);
  raycaster.params.Points.threshold = 0.3;
  
  const allTargets = [sunGalaxy, ...starSystems].filter(Boolean);
  const diaryObjects = [];
  allTargets.forEach(g => {
    if (g) {
      g.children.forEach(c => {
        if (c.name === 'diaryStars' || c.name === 'sunDiaryStars') {
          diaryObjects.push(c);
        }
      });
    }
  });
  
  const intersects = raycaster.intersectObjects(diaryObjects, false);
  const tooltip = document.getElementById('diary-tooltip');
  
  if (intersects.length > 0) {
    const point = intersects[0];
    const obj = point.object;
    const galaxy = obj.parent;
    const friend = galaxy.userData.friend;
    const memories = friend.memories || [];
    
    if (memories.length === 0) {
      tooltip.classList.remove('visible');
      return;
    }
    
    // 根据命中点的索引映射到日记
    const idx = point.index !== undefined ? point.index : 0;
    const memIdx = idx % memories.length;
    const memory = memories[memIdx];
    
    document.getElementById('diary-tooltip-date').textContent = memory.date;
    document.getElementById('diary-tooltip-content').textContent = memory.content;
    document.getElementById('diary-tooltip-image').textContent = memory.hasImage ? '✨ 含图片记录' : '';
    
    tooltip.style.left = event.clientX + 'px';
    tooltip.style.top = event.clientY + 'px';
    tooltip.classList.add('visible');
    hoveredDiary = { friend, memory };
    document.body.style.cursor = 'pointer';
  } else {
    tooltip.classList.remove('visible');
    if (hoveredDiary) {
      hoveredDiary = null;
      document.body.style.cursor = 'grab';
    }
  }
}

// ============ 初始化 ============
window.addEventListener('DOMContentLoaded', () => {
  initLoginScreen();
  initThree();
  initUI();
  
  document.getElementById('group-edit-cancel').addEventListener('click', () => {
    document.getElementById('group-edit-modal').classList.remove('visible');
  });
  document.getElementById('group-edit-confirm').addEventListener('click', confirmGroupEdit);
  document.getElementById('group-edit-modal').addEventListener('click', (e) => {
    if (e.target.id === 'group-edit-modal') {
      document.getElementById('group-edit-modal').classList.remove('visible');
    }
  });
});
