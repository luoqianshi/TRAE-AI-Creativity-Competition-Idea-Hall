<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>火烧云预测 - Sunset Prediction</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="particleCanvas" aria-hidden="true"></canvas>
  <div class="page-bg"></div>
  <div class="page-blur" aria-hidden="true"></div>
  <main class="main-wrapper">
    <div class="liquid-bg" aria-hidden="true">
      <div class="liquid-blob liquid-blob--amber"></div>
      <div class="liquid-blob liquid-blob--rose"></div>
      <div class="liquid-blob liquid-blob--sky"></div>
    </div>
    <div class="glass-card">
      <header class="text-center mb-8">
        <div class="icon-circle">
          <i data-lucide="sun" class="w-8 h-8 text-yellow-200"></i>
        </div>
        <h1 class="title">火烧云预测</h1>
        <p class="subtitle">输入位置与日期，获取当日火烧云观赏建议</p>
      </header>

      <section class="form-section space-y-4">
        <div>
          <label class="label-text">位置</label>
          <div class="input-row">
            <input type="text" id="locationInput" placeholder="城市名或 纬度, 经度" class="input-field flex-1">
            <button id="locateBtn" class="icon-btn" title="获取当前位置">
              <i data-lucide="navigation" class="w-5 h-5"></i>
            </button>
          </div>
          <p id="locationStatus" class="hint-text h-4"></p>
          <p id="predictStatus" class="hint-text h-4"></p>
        </div>
        <div>
          <label class="label-text">日期</label>
          <input type="date" id="dateInput" class="input-field w-full">
        </div>
        <div class="action-row">
          <button id="predictBtn" class="primary-btn">
            <i data-lucide="sparkles" class="w-5 h-5"></i>
            <span>开始预测</span>
          </button>
          <button id="favBtn" class="secondary-btn" title="收藏当前结果">
            <i data-lucide="heart" class="w-5 h-5"></i>
            <span>收藏</span>
          </button>
          <button id="historyBtn" class="secondary-btn" title="查看历史记录">
            <i data-lucide="clock" class="w-5 h-5"></i>
            <span>历史</span>
          </button>
        </div>
      </section>

      <section id="results" class="results-section hidden space-y-6">
        <div class="results-divider hidden" aria-hidden="true"></div>
        <div class="score-block flex flex-col items-center">
          <div class="score-ring">
            <svg class="ring-svg" viewBox="0 0 160 160">
              <circle class="ring-bg" cx="80" cy="80" r="70" />
              <circle id="scoreCircle" class="ring-progress" cx="80" cy="80" r="70" />
              <defs>
                <linearGradient id="scoreGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#fbbf24" />
                  <stop offset="100%" stop-color="#f87171" />
                </linearGradient>
              </defs>
            </svg>
            <div class="score-inner">
              <span id="scoreValue" class="score-number">0</span>
              <span class="score-caption">火烧云指数</span>
            </div>
          </div>
          <p id="scoreDesc" class="score-desc"></p>
        </div>

        <div class="metrics-grid">
          <div class="metric-card">
            <div class="metric-icon"><i data-lucide="clock" class="w-5 h-5"></i></div>
            <div>
              <p class="metric-label">日落时间</p>
              <p id="sunsetTime" class="metric-value">--:--</p>
            </div>
          </div>
          <div class="metric-card">
            <div class="metric-icon"><i data-lucide="eye" class="w-5 h-5"></i></div>
            <div>
              <p class="metric-label">最佳观赏</p>
              <p id="bestWindow" class="metric-value">--:-- - --:--</p>
            </div>
          </div>
          <div class="metric-card">
            <div class="metric-icon"><i data-lucide="cloud" class="w-5 h-5"></i></div>
            <div>
              <p class="metric-label">云量估算</p>
              <p id="cloudCover" class="metric-value">--%</p>
            </div>
          </div>
          <div class="metric-card">
            <div class="metric-icon"><i data-lucide="thermometer" class="w-5 h-5"></i></div>
            <div>
              <p class="metric-label">色温预估</p>
              <p id="colorTemp" class="metric-value">-- K</p>
            </div>
          </div>
          <div class="metric-card">
            <div class="metric-icon"><i data-lucide="wind" class="w-5 h-5"></i></div>
            <div>
              <p class="metric-label">空气质量</p>
              <p id="airQuality" class="metric-value">--</p>
            </div>
          </div>
          <div class="metric-card">
            <div class="metric-icon"><i data-lucide="cloud-rain" class="w-5 h-5"></i></div>
            <div>
              <p class="metric-label">气溶胶参考</p>
              <p id="aerosol" class="metric-value">--%</p>
            </div>
          </div>
        </div>

        <div class="viz-card">
          <p class="viz-title">太阳轨迹与色彩模拟</p>
          <canvas id="sunCanvas" width="600" height="300"></canvas>
        </div>

        <div class="tips-card">
          <p class="tips-title">观赏小贴士</p>
          <ul id="tipsList" class="tips-list"></ul>
        </div>

        <div id="historyPanel" class="history-panel hidden">
          <div class="history-header">
            <p class="history-title">历史记录</p>
            <div class="history-actions">
              <button id="historyClear" class="ghost-btn">清空</button>
              <button id="historyClose" class="icon-btn" title="关闭">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>
          </div>
          <ul id="historyList" class="history-list"></ul>
        </div>

        <div id="feedbackCard" class="feedback-card glass-card hidden">
          <p class="tips-title">实际效果反馈</p>
          <div class="feedback-row">
            <span class="feedback-label">你看到的火烧云效果：</span>
            <div class="star-group" data-name="stars">
              <button class="star" data-value="1" aria-label="1星"><i data-lucide="star" class="w-5 h-5"></i></button>
              <button class="star" data-value="2" aria-label="2星"><i data-lucide="star" class="w-5 h-5"></i></button>
              <button class="star" data-value="3" aria-label="3星"><i data-lucide="star" class="w-5 h-5"></i></button>
              <button class="star" data-value="4" aria-label="4星"><i data-lucide="star" class="w-5 h-5"></i></button>
              <button class="star" data-value="5" aria-label="5星"><i data-lucide="star" class="w-5 h-5"></i></button>
            </div>
          </div>
          <div class="feedback-actions">
            <button id="feedbackSubmit" class="primary-btn" style="padding:10px 12px;font-size:14px;">提交反馈</button>
            <button id="feedbackSkip" class="secondary-btn" style="padding:10px 12px;font-size:14px;">跳过</button>
          </div>
          <p id="feedbackStatus" class="hint-text h-4"></p>
        </div>
      </section>
    </div>
    <div class="liquid-shine-tracker" aria-hidden="true"></div>
    <footer class="footer-text">
      <span>天气与空气质量数据来自 Open-Meteo，位置解析来自 Open-Meteo Geocoding。</span>
      <span class="footer-divider" aria-hidden="true"></span>
      <span>© 2026 万枫科技 © 版权所有</span>
    </footer>
  </main>

  <script src="app.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
