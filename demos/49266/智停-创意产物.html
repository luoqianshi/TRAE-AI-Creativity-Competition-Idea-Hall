<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>智停 — 智能停车位查询</title>
<style>
/* ============================================
   CSS Variables & Reset
   ============================================ */
:root {
  --bg: #0f172a;
  --bg2: #1e293b;
  --bg3: #334155;
  --ink: #f8fafc;
  --muted: #94a3b8;
  --muted2: #64748b;
  --accent: #06b6d4;
  --accent2: #22d3ee;
  --green: #22c55e;
  --amber: #f59e0b;
  --red: #ef4444;
  --card-bg: rgba(30,41,59,0.75);
  --card-border: rgba(148,163,184,0.12);
  --shadow: 0 8px 32px rgba(0,0,0,0.35);
  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 20px;
}

*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

body {
  display: flex;
  flex-direction: column;
}

/* Mobile container on desktop */
#app {
  width: 100%;
  height: 100%;
  max-width: 430px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

@media (min-width: 431px) {
  body { background: #0b1120; }
  #app { border-left: 1px solid var(--card-border); border-right: 1px solid var(--card-border); }
}

/* ============================================
   Icons (inline SVG)
   ============================================ */
.icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 24px; height: 24px; }

/* ============================================
   Search Bar
   ============================================ */
.search-bar {
  position: relative;
  z-index: 20;
  padding: 12px 16px;
  padding-top: max(12px, env(safe-area-inset-top));
  background: linear-gradient(180deg, rgba(15,23,42,0.95) 0%, rgba(15,23,42,0.8) 100%);
  backdrop-filter: blur(12px);
}
.search-input-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg2);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg);
  padding: 10px 14px;
}
.search-input-wrap input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--ink);
  font-size: 15px;
  font-family: inherit;
}
.search-input-wrap input::placeholder { color: var(--muted2); }
.search-input-wrap .clear-btn {
  display: none;
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 2px;
}
.search-input-wrap .clear-btn.visible { display: block; }

/* ============================================
   Tab Switcher
   ============================================ */
.tab-bar {
  display: flex;
  gap: 6px;
  padding: 0 16px 10px;
  z-index: 20;
  background: linear-gradient(180deg, rgba(15,23,42,0.8) 0%, transparent 100%);
}
.tab-btn {
  flex: 1;
  padding: 8px 0;
  border-radius: var(--radius);
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.tab-btn.active {
  background: var(--bg2);
  color: var(--ink);
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

/* ============================================
   Sort Bar
   ============================================ */
.sort-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  z-index: 20;
}
.sort-options {
  display: flex;
  gap: 8px;
}
.sort-chip {
  padding: 5px 12px;
  border-radius: 100px;
  border: 1px solid var(--card-border);
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
}
.sort-chip.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.filter-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 12px;
  border-radius: 100px;
  border: 1px solid var(--card-border);
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  cursor: pointer;
}

/* ============================================
   Main Content Area
   ============================================ */
.main-content {
  flex: 1;
  position: relative;
  overflow: hidden;
}

/* ============================================
   Map View
   ============================================ */
.map-container {
  position: absolute;
  inset: 0;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  cursor: grab;
}
.map-container:active { cursor: grabbing; }
.map-container svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* Map marker pulse */
@keyframes pulse-ring {
  0% { r: 8; opacity: 0.7; }
  100% { r: 28; opacity: 0; }
}
.marker-pulse {
  animation: pulse-ring 2s ease-out infinite;
  transform-origin: center;
}

/* User location dot */
.user-dot {
  filter: drop-shadow(0 0 6px var(--accent));
}

/* ============================================
   List View
   ============================================ */
.list-view {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  padding: 0 16px 20px;
  -webkit-overflow-scrolling: touch;
  display: none;
}
.list-view.active { display: block; }

.parking-card {
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  animation: slideUp 0.4s ease both;
}
.parking-card:active { transform: scale(0.98); }
.parking-card:nth-child(1) { animation-delay: 0.05s; }
.parking-card:nth-child(2) { animation-delay: 0.1s; }
.parking-card:nth-child(3) { animation-delay: 0.15s; }
.parking-card:nth-child(4) { animation-delay: 0.2s; }
.parking-card:nth-child(5) { animation-delay: 0.25s; }
.parking-card:nth-child(6) { animation-delay: 0.3s; }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.card-status {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
  margin-top: 2px;
}
.status-green { background: rgba(34,197,94,0.15); color: var(--green); }
.status-amber { background: rgba(245,158,11,0.15); color: var(--amber); }
.status-red { background: rgba(239,68,68,0.15); color: var(--red); }

.card-body { flex: 1; min-width: 0; }
.card-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 8px;
}
.card-meta span { display: flex; align-items: center; gap: 3px; }
.card-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 100px;
  background: var(--bg3);
  color: var(--muted);
}
.tag.price-tag {
  background: rgba(6,182,212,0.12);
  color: var(--accent);
  font-weight: 600;
}
.tag.best-tag {
  background: rgba(34,197,94,0.15);
  color: var(--green);
}

.card-price {
  text-align: right;
  flex-shrink: 0;
}
.price-value {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
}
.price-unit {
  font-size: 11px;
  color: var(--muted);
}

/* ============================================
   Bottom Sheet (Detail Card)
   ============================================ */
.bottom-sheet {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(180deg, var(--bg2) 0%, var(--bg) 100%);
  border-top: 1px solid var(--card-border);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: 16px 20px;
  padding-bottom: max(16px, env(safe-area-inset-bottom));
  transform: translateY(110%);
  transition: transform 0.35s cubic-bezier(0.25,0.1,0.25,1);
  z-index: 30;
  max-height: 70%;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.bottom-sheet.open { transform: translateY(0); }

.sheet-handle {
  width: 36px;
  height: 4px;
  background: var(--bg3);
  border-radius: 2px;
  margin: 0 auto 14px;
}

.sheet-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
}
.sheet-title { font-size: 18px; font-weight: 700; }
.sheet-close {
  background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px;
}

/* Availability ring chart */
.avail-ring {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 18px;
  padding: 14px;
  background: var(--bg);
  border-radius: var(--radius);
}
.ring-svg { flex-shrink: 0; }
.ring-info {}
.ring-label { font-size: 12px; color: var(--muted); }
.ring-value { font-size: 28px; font-weight: 700; }
.ring-value .small { font-size: 14px; color: var(--muted); font-weight: 400; }

/* Price timeline */
.price-section { margin-bottom: 18px; }
.section-label { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.price-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--card-border);
  font-size: 14px;
}
.price-row:last-child { border-bottom: none; }
.price-row .label { color: var(--muted); }
.price-row .value { font-weight: 600; }

/* Facility tags */
.facility-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 18px;
}
.facility-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 8px;
  background: var(--bg);
  border-radius: var(--radius-sm);
  font-size: 12px;
  color: var(--muted);
}
.facility-item .icon { color: var(--accent); }
.facility-item.available { color: var(--green); }
.facility-item.unavailable { color: var(--muted2); }

/* Sheet actions */
.sheet-actions {
  display: flex;
  gap: 10px;
  margin-top: 4px;
}
.btn {
  flex: 1;
  padding: 12px;
  border-radius: var(--radius);
  border: none;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.2s;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  box-shadow: 0 4px 16px rgba(6,182,212,0.3);
}
.btn-primary:active { transform: scale(0.97); }
.btn-secondary {
  background: var(--bg3);
  color: var(--ink);
}

/* Compare selection badge */
.compare-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid var(--card-border);
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 5;
}
.compare-badge.selected {
  background: var(--accent);
  border-color: var(--accent);
}
.compare-badge .icon { width: 14px; height: 14px; stroke-width: 3; }

/* ============================================
   Filter Drawer
   ============================================ */
.filter-drawer {
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 280px;
  background: var(--bg2);
  border-left: 1px solid var(--card-border);
  transform: translateX(100%);
  transition: transform 0.3s ease;
  z-index: 40;
  padding: 20px 16px;
  padding-top: max(20px, env(safe-area-inset-top));
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.filter-drawer.open { transform: translateX(0); }
.drawer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.drawer-title { font-size: 17px; font-weight: 700; }
.drawer-close { background: none; border: none; color: var(--muted); cursor: pointer; }

.filter-group { margin-bottom: 24px; }
.filter-label { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.filter-options { display: flex; flex-wrap: wrap; gap: 8px; }
.filter-chip {
  padding: 6px 14px;
  border-radius: 100px;
  border: 1px solid var(--card-border);
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.filter-chip.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.drawer-actions {
  position: sticky;
  bottom: 0;
  background: var(--bg2);
  padding-top: 10px;
  border-top: 1px solid var(--card-border);
}

/* ============================================
   Compare Page
   ============================================ */
.compare-page {
  position: absolute;
  inset: 0;
  background: var(--bg);
  z-index: 50;
  transform: translateX(100%);
  transition: transform 0.3s ease;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.compare-page.open { transform: translateX(0); }
.compare-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  padding-top: max(14px, env(safe-area-inset-top));
  border-bottom: 1px solid var(--card-border);
}
.compare-header h2 { font-size: 17px; font-weight: 700; flex: 1; }
.compare-back { background: none; border: none; color: var(--muted); cursor: pointer; }

.compare-content {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  -webkit-overflow-scrolling: touch;
}

.compare-table {
  display: grid;
  gap: 10px;
}
.compare-row {
  display: grid;
  grid-template-columns: 90px repeat(auto-fit, minmax(0, 1fr));
  gap: 8px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--card-border);
  font-size: 13px;
}
.compare-row.header {
  font-weight: 600;
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-bottom: 2px solid var(--card-border);
}
.compare-row .label { color: var(--muted); }
.compare-row .cell { text-align: center; }
.compare-row .cell.best { color: var(--green); font-weight: 700; }
.compare-row .cell.worst { color: var(--red); }

.compare-card-mini {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 12px;
  text-align: center;
}
.compare-card-mini .name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.compare-card-mini .price { font-size: 24px; font-weight: 700; color: var(--accent); }
.compare-card-mini .price .unit { font-size: 12px; color: var(--muted); font-weight: 400; }

/* ============================================
   Overlay
   ============================================ */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  z-index: 25;
}
.overlay.visible { opacity: 1; pointer-events: auto; }

/* ============================================
   Empty State
   ============================================ */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  color: var(--muted);
  text-align: center;
}
.empty-state .icon { margin-bottom: 12px; color: var(--muted2); }
.empty-state p { font-size: 14px; }

/* ============================================
   Toast
   ============================================ */
.toast {
  position: absolute;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg2);
  border: 1px solid var(--card-border);
  padding: 10px 18px;
  border-radius: 100px;
  font-size: 13px;
  color: var(--ink);
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s;
  z-index: 60;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ============================================
   Loading
   ============================================ */
.loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  z-index: 100;
  transition: opacity 0.5s;
}
.loading.hidden { opacity: 0; pointer-events: none; }
.spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--bg3);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app">

<!-- Loading -->
<div class="loading" id="loading"><div class="spinner"></div></div>

<!-- Search Bar -->
<div class="search-bar">
  <div class="search-input-wrap">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="搜索停车场、商场、地点..." autocomplete="off">
    <button class="clear-btn" id="clearSearch">
      <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
    </button>
  </div>
</div>

<!-- Tab Bar -->
<div class="tab-bar">
  <button class="tab-btn active" data-view="map">地图</button>
  <button class="tab-btn" data-view="list">列表</button>
  <button class="tab-btn" data-view="compare">对比</button>
</div>

<!-- Sort Bar -->
<div class="sort-bar" id="sortBar">
  <div class="sort-options">
    <button class="sort-chip active" data-sort="distance">最近</button>
    <button class="sort-chip" data-sort="price">最便宜</button>
    <button class="sort-chip" data-sort="available">最多空位</button>
  </div>
  <button class="filter-btn" id="filterToggle">
    <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
    筛选
  </button>
</div>

<!-- Main Content -->
<div class="main-content">

  <!-- Map View -->
  <div class="map-container" id="mapView">
    <svg id="mapSvg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(148,163,184,0.06)" stroke-width="1"/>
        </pattern>
      </defs>
      <!-- Background -->
      <rect width="800" height="600" fill="#0f172a"/>
      <rect width="800" height="600" fill="url(#grid)"/>
      <!-- Roads -->
      <g id="roads"></g>
      <!-- Buildings -->
      <g id="buildings"></g>
      <!-- Parkings -->
      <g id="parkingMarkers"></g>
      <!-- User location -->
      <g id="userLocation"></g>
    </svg>
  </div>

  <!-- List View -->
  <div class="list-view" id="listView"></div>

</div>

<!-- Bottom Sheet -->
<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div>
      <div class="sheet-title" id="sheetTitle">停车场名称</div>
      <div class="card-meta" style="margin-top:4px">
        <span><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><span id="sheetAddress">地址</span></span>
      </div>
    </div>
    <button class="sheet-close" id="sheetClose">
      <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
  <div class="avail-ring">
    <svg class="ring-svg" width="72" height="72" viewBox="0 0 72 72">
      <circle cx="36" cy="36" r="30" fill="none" stroke="rgba(148,163,184,0.15)" stroke-width="6"/>
      <circle id="availRing" cx="36" cy="36" r="30" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="188.5" stroke-dashoffset="0" transform="rotate(-90 36 36)"/>
    </svg>
    <div class="ring-info">
      <div class="ring-label">剩余车位</div>
      <div class="ring-value"><span id="availCount">0</span><span class="small"> / <span id="totalCount">0</span></span></div>
    </div>
  </div>
  <div class="price-section">
    <div class="section-label">收费标准</div>
    <div class="price-row"><span class="label">首小时</span><span class="value" id="priceFirst">-</span></div>
    <div class="price-row"><span class="label">超出每小时</span><span class="value" id="priceExtra">-</span></div>

<script>

const rawData = [

  { id: 12, name: "火车站西广场", address: "站前路 1 号", distance: 2000, walkTime: 25, total: 2500, available: 1980, priceFirstHour: 5, pricePerHour: 3, priceCap: 40, nightPrice: 3, hasCharger: true, isIndoor: true, openTime: "00:00-24:00", x: 650, y: 450 }

// Randomize availability slightly for "real-time" feel
const parkings = rawData.map(p => ({

/* ============================================
   State

let currentView = 'map';
let currentSort = 'distance';

let filters = { price: 'all', dist: 'all', indoor: false, charger: false };
let filteredParkings = [...parkings];

/* ============================================
   DOM refs

const app = document.getElementById('app');
const mapSvg = document.getElementById('mapSvg');
const roadsGroup = document.getElementById('roads');
const buildingsGroup = document.getElementById('buildings');

const filterDrawer = document.getElementById('filterDrawer');

const toast = document.getElementById('toast');
const searchInput = document.getElementById('searchInput');
const clearSearchBtn = document.getElementById('clearSearch');

/* ============================================
   SVG Map Rendering
   ============================================ */
function drawMap() {
  // Draw roads
  const roads = [
    {x1:0,y1:200,x2:800,y2:200,w:24}, {x1:0,y1:350,x2:800,y2:350,w:20},
    {x1:0,y1:450,x2:800,y2:450,w:18}, {x1:280,y1:0,x2:280,y2:600,w:22},
    {x1:420,y1:0,x2:420,y2:600,w:26}, {x1:560,y1:0,x2:560,y2:600,w:20},
    {x1:0,y1:120,x2:800,y2:120,w:14}, {x1:140,y1:0,x2:140,y2:600,w:14},
    {x1:680,y1:0,x2:680,y2:600,w:16}
  ];
  roads.forEach(r => {
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', r.x1); line.setAttribute('y1', r.y1);
    line.setAttribute('x2', r.x2); line.setAttribute('y2', r.y2);
    line.setAttribute('stroke', 'rgba(148,163,184,0.1)');
    line.setAttribute('stroke-width', r.w);
    line.setAttribute('stroke-linecap', 'round');
    roadsGroup.appendChild(line);
    // Dashed center line
    const dash = document.createElementNS('http://www.w3.org/2000/svg','line');
    dash.setAttribute('x1', r.x1); dash.setAttribute('y1', r.y1);
    dash.setAttribute('x2', r.x2); dash.setAttribute('y2', r.y2);
    dash.setAttribute('stroke', 'rgba(148,163,184,0.06)');
    dash.setAttribute('stroke-width', 1);
    dash.setAttribute('stroke-dasharray', '8 8');
    roadsGroup.appendChild(dash);
  });

  // Draw buildings (blocks)
  const buildings = [
    {x:160,y:40,w:100,h:60,r:6}, {x:440,y:60,w:100,h:80,r:6},
    {x:60,y:240,w:80,h:80,r:6}, {x:600,y:260,w:60,h:60,r:6},
    {x:300,y:380,w:90,h:50,r:6}, {x:480,y:480,w:70,h:70,r:6},
    {x:120,y:480,w:100,h:60,r:6}, {x:720,y:120,w:60,h:100,r:6}
  ];
  buildings.forEach(b => {
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x', b.x); rect.setAttribute('y', b.y);
    rect.setAttribute('width', b.w); rect.setAttribute('height', b.h);
    rect.setAttribute('rx', b.r);
    rect.setAttribute('fill', 'rgba(30,41,59,0.5)');
    rect.setAttribute('stroke', 'rgba(148,163,184,0.08)');
    buildingsGroup.appendChild(rect);
  });

  // Draw parking markers
  renderMarkers();

  // User location
  const ug = document.createElementNS('http://www.w3.org/2000/svg','g');
  ug.setAttribute('transform', 'translate(400, 280)');
  ug.innerHTML = `<circle cx="0" cy="0" r="6" fill="#06b6d4" class="user-dot"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.4">
      <animate attributeName="r" values="14;22;14" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>`;
  userGroup.appendChild(ug);
}

function getStatus(p) {
  const ratio = p.available / p.total;
  if (ratio > 0.3) return { class: 'status-green', color: '#22c55e', label: '充足' };
  if (ratio > 0.1) return { class: 'status-amber', color: '#f59e0b', label: '紧张' };
  return { class: 'status-red', color: '#ef4444', label: '极少' };
}

function renderMarkers() {
  markersGroup.innerHTML = '';
  filteredParkings.forEach(p => {
    const s = getStatus(p);
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('transform', `translate(${p.x}, ${p.y})`);
    g.style.cursor = 'pointer';
    g.innerHTML = `
      <circle cx="0" cy="0" r="8" fill="${s.color}" class="marker-pulse" opacity="0.5"/>
      <circle cx="0" cy="0" r="8" fill="${s.color}" opacity="0.3">
        <animate attributeName="r" values="8;28;8" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0;0.5" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="7" fill="${s.color}"/>
      <circle cx="0" cy="0" r="3" fill="#fff"/>
    `;
    g.addEventListener('click', () => openSheet(p));
    markersGroup.appendChild(g);
  });
}

/* ============================================
   Map Interactions (pan & zoom)
   ============================================ */
let viewBox = { x: 0, y: 0, w: 800, h: 600 };
let isDragging = false;
let startPoint = null;
let startViewBox = null;

function updateViewBox() {
  mapSvg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
}

const mapContainer = document.getElementById('mapView');

function getSVGPoint(clientX, clientY) {
  const pt = mapSvg.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  return pt.matrixTransform(mapSvg.getScreenCTM().inverse());
}

mapContainer.addEventListener('mousedown', e => {
  isDragging = true;
  startPoint = { x: e.clientX, y: e.clientY };
  startViewBox = { ...viewBox };
  mapContainer.style.cursor = 'grabbing';
});

document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - startPoint.x;
  const dy = e.clientY - startPoint.y;
  viewBox.x = startViewBox.x - dx * (viewBox.w / mapSvg.clientWidth);
  viewBox.y = startViewBox.y - dy * (viewBox.h / mapSvg.clientHeight);
  updateViewBox();
});

document.addEventListener('mouseup', () => {
  isDragging = false;
  mapContainer.style.cursor = 'grab';
});

// Touch support
mapContainer.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    isDragging = true;
    startPoint = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    startViewBox = { ...viewBox };
  }
}, { passive: false });

mapContainer.addEventListener('touchmove', e => {
  if (!isDragging || e.touches.length !== 1) return;
  e.preventDefault();
  const dx = e.touches[0].clientX - startPoint.x;
  const dy = e.touches[0].clientY - startPoint.y;
  viewBox.x = startViewBox.x - dx * (viewBox.w / mapSvg.clientWidth);
  viewBox.y = startViewBox.y - dy * (viewBox.h / mapSvg.clientHeight);
  updateViewBox();
}, { passive: false });

mapContainer.addEventListener('touchend', () => { isDragging = false; });

// Wheel zoom
mapContainer.addEventListener('wheel', e => {
  e.preventDefault();
  const pt = getSVGPoint(e.clientX, e.clientY);
  const scale = e.deltaY < 0 ? 0.9 : 1.1;
  const newW = viewBox.w * scale;
  const newH = viewBox.h * scale;
  const ratioX = (pt.x - viewBox.x) / viewBox.w;
  const ratioY = (pt.y - viewBox.y) / viewBox.h;
  viewBox.x = pt.x - ratioX * newW;
  viewBox.y = pt.y - ratioY * newH;
  viewBox.w = newW;
  viewBox.h = newH;
  updateViewBox();
}, { passive: false });

/* ============================================
   List View Rendering
   ============================================ */
function renderList() {
  listView.innerHTML = '';
  if (filteredParkings.length === 0) {
    listView.innerHTML = `<div class="empty-state">
      <svg class="icon icon-lg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <p>未找到符合条件的停车场</p>
    </div>`;
    return;
  }
  const cheapest = Math.min(...filteredParkings.map(p => p.priceFirstHour));
  filteredParkings.forEach(p => {
    const s = getStatus(p);
    const isCheapest = p.priceFirstHour === cheapest;
    const card = document.createElement('div');
    card.className = 'parking-card';
    card.innerHTML = `
      <div class="card-status ${s.class}">${Math.round(p.available/p.total*100)}%</div>
      <div class="card-body">
        <div class="card-title">${p.name}</div>
        <div class="card-meta">
          <span><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>${p.distance}m</span>
          <span><svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${p.walkTime}分钟</span>
        </div>
        <div class="card-tags">
          <span class="tag price-tag">首时 ¥${p.priceFirstHour}</span>
          ${isCheapest ? '<span class="tag best-tag">最便宜</span>' : ''}
          ${p.hasCharger ? '<span class="tag">充电桩</span>' : ''}
          ${p.isIndoor ? '<span class="tag">室内</span>' : ''}
        </div>
      </div>
      <div class="card-price">
        <div class="price-value">¥${p.priceFirstHour}</div>
        <div class="price-unit">首时</div>
      </div>
      <div class="compare-badge ${compareList.includes(p.id) ? 'selected' : ''}" data-id="${p.id}">
        <svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
    `;
    card.addEventListener('click', e => {
      if (e.target.closest('.compare-badge')) {
        toggleCompare(p.id);
        e.stopPropagation();
        return;
      }
      openSheet(p);
    });
    listView.appendChild(card);
  });
}

/* ============================================
   Bottom Sheet
   ============================================ */
function openSheet(p) {
  selectedParking = p;
  const s = getStatus(p);
  document.getElementById('sheetTitle').textContent = p.name;
  document.getElementById('sheetAddress').textContent = p.address;
  document.getElementById('availCount').textContent = p.available;
  document.getElementById('totalCount').textContent = p.total;
  document.getElementById('priceFirst').textContent = `¥${p.priceFirstHour}`;
  document.getElementById('priceExtra').textContent = `¥${p.pricePerHour}`;
  document.getElementById('priceCap').textContent = `¥${p.priceCap}`;
  document.getElementById('priceNight').textContent = `¥${p.nightPrice}`;
  document.getElementById('openTime').textContent = p.openTime;
  document.getElementById('facDistText').textContent = `步行${p.walkTime}分钟`;

  const ring = document.getElementById('availRing');
  const circ = 2 * Math.PI * 30;
  const pct = p.available / p.total;
  ring.setAttribute('stroke-dashoffset', circ * (1 - pct));
  ring.setAttribute('stroke', s.color);

  const indoorEl = document.getElementById('facIndoor');
  indoorEl.className = 'facility-item ' + (p.isIndoor ? 'available' : 'unavailable');
  indoorEl.querySelector('span').textContent = p.isIndoor ? '室内停车' : '露天停车';

  const chargerEl = document.getElementById('facCharger');
  chargerEl.className = 'facility-item ' + (p.hasCharger ? 'available' : 'unavailable');
  chargerEl.querySelector('span').textContent = p.hasCharger ? '有充电桩' : '无充电桩';

  const btnCompare = document.getElementById('btnCompareToggle');
  btnCompare.textContent = compareList.includes(p.id) ? '移出对比' : '加入对比';

  bottomSheet.classList.add('open');
  overlay.classList.add('visible');
}

function closeSheet() {
  bottomSheet.classList.remove('open');
  overlay.classList.remove('visible');
}

document.getElementById('sheetClose').addEventListener('click', closeSheet);

  closeSheet();
  closeFilter();
});

document.getElementById('btnCompareToggle').addEventListener('click', () => {
  if (!selectedParking) return;
  toggleCompare(selectedParking.id);
  const btn = document.getElementById('btnCompareToggle');
  btn.textContent = compareList.includes(selectedParking.id) ? '移出对比' : '加入对比';
});

document.getElementById('btnNavigate').addEventListener('click', () => {
  showToast(`已启动到 ${selectedParking.name} 的模拟导航`);
});

/* ============================================
   Compare
   ============================================ */
function toggleCompare(id) {
  const idx = compareList.indexOf(id);
  if (idx >= 0) {
    compareList.splice(idx, 1);
  } else {
    if (compareList.length >= 3) {
      showToast('最多选择 3 个停车场对比');
      return;
    }
    compareList.push(id);
  }
  renderList();
  renderMarkers();
  updateCompareButton();
}

function updateCompareButton() {
  const tabCompare = document.querySelector('[data-view="compare"]');
  if (compareList.length > 0) {
    tabCompare.textContent = `对比 (${compareList.length})`;
  } else {
    tabCompare.textContent = '对比';
  }
}

function openCompare() {
  if (compareList.length < 2) {
    showToast('请至少选择 2 个停车场');
    switchView('list');
    return;
  }
  const items = compareList.map(id => parkings.find(p => p.id === id)).filter(Boolean);
  const content = document.getElementById('compareContent');

  let html = '<div class="compare-table">';
  html += `<div class="compare-row header">
    <div class="label">对比项</div>
    ${items.map(p => `<div class="cell">${p.name}</div>`).join('')}
  </div>`;

  const rows = [
    { label: '首小时', key: 'priceFirstHour', fmt: v => `¥${v}`, best: 'min' },
    { label: '超出每小时', key: 'pricePerHour', fmt: v => `¥${v}`, best: 'min' },
    { label: '24h封顶', key: 'priceCap', fmt: v => `¥${v}`, best: 'min' },
    { label: '夜间价格', key: 'nightPrice', fmt: v => `¥${v}`, best: 'min' },
    { label: '距离', key: 'distance', fmt: v => `${v}m`, best: 'min' },
    { label: '步行时间', key: 'walkTime', fmt: v => `${v}分钟`, best: 'min' },
    { label: '总车位', key: 'total', fmt: v => `${v}个`, best: 'max' },
    { label: '剩余车位', key: 'available', fmt: v => `${v}个`, best: 'max' },
  ];

  rows.forEach(row => {
    const vals = items.map(p => p[row.key]);
    const bestVal = row.best === 'min' ? Math.min(...vals) : Math.max(...vals);
    const worstVal = row.best === 'min' ? Math.max(...vals) : Math.min(...vals);
    html += `<div class="compare-row">
      <div class="label">${row.label}</div>
      ${items.map(p => {
        const v = p[row.key];
        let cls = 'cell';
        if (v === bestVal && items.length > 1) cls += ' best';
        if (v === worstVal && items.length > 1 && row.best === 'min') cls += ' worst';
        return `<div class="${cls}">${row.fmt(v)}</div>`;
      }).join('')}
    </div>`;
  });

  // Facility row
  html += `<div class="compare-row"><div class="label">室内停车</div>${items.map(p => `<div class="cell">${p.isIndoor ? '有' : '无'}</div>`).join('')}</div>`;
  html += `<div class="compare-row"><div class="label">充电桩</div>${items.map(p => `<div class="cell">${p.hasCharger ? '有' : '无'}</div>`).join('')}</div>`;
  html += `<div class="compare-row"><div class="label">营业时间</div>${items.map(p => `<div class="cell">${p.openTime}</div>`).join('')}</div>`;

  html += '</div>';

  // Mini cards
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:20px">';
  items.forEach(p => {
    html += `<div class="compare-card-mini">
      <div class="name">${p.name}</div>
      <div class="price">¥${p.priceFirstHour}<span class="unit">首时</span></div>
    </div>`;
  });
  html += '</div>';

  content.innerHTML = html;
  comparePage.classList.add('open');
}

document.getElementById('compareBack').addEventListener('click', () => {
  comparePage.classList.remove('open');
});

/* ============================================
   Filter Drawer
   ============================================ */
document.getElementById('filterToggle').addEventListener('click', () => {
  filterDrawer.classList.add('open');
});
document.getElementById('filterClose').addEventListener('click', closeFilter);

function closeFilter() {
  filterDrawer.classList.remove('open');
}

filterDrawer.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const group = chip.closest('.filter-options');
    group.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
  });
});

document.getElementById('filterApply').addEventListener('click', () => {
  const priceChip = filterDrawer.querySelector('[data-filter="price"].active');
  filters.price = priceChip ? priceChip.dataset.value : 'all';
  const distChip = filterDrawer.querySelector('[data-filter="dist"].active');
  filters.dist = distChip ? distChip.dataset.value : 'all';
  filters.indoor = filterDrawer.querySelector('[data-filter="indoor"].active') !== null;
  filters.charger = filterDrawer.querySelector('[data-filter="charger"].active') !== null;
  applyFilters();
  closeFilter();
});

/* ============================================
   Sorting & Filtering
   ============================================ */
function applyFilters() {
  filteredParkings = parkings.filter(p => {
    if (filters.price !== 'all' && p.priceFirstHour > parseInt(filters.price)) return false;
    if (filters.dist !== 'all' && p.distance > parseInt(filters.dist)) return false;
    if (filters.indoor && !p.isIndoor) return false;
    if (filters.charger && !p.hasCharger) return false;
    return true;
  });
  applySort();
}

function applySort() {
  if (currentSort === 'distance') {
    filteredParkings.sort((a, b) => a.distance - b.distance);
  } else if (currentSort === 'price') {
    filteredParkings.sort((a, b) => a.priceFirstHour - b.priceFirstHour);
  } else if (currentSort === 'available') {
    filteredParkings.sort((a, b) => b.available - a.available);
  }
  renderList();
  renderMarkers();
}

document.querySelectorAll('.sort-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.sort-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentSort = chip.dataset.sort;
    applySort();
  });
});

/* ============================================
   Search
   ============================================ */
searchInput.addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  clearSearchBtn.classList.toggle('visible', q.length > 0);
  if (!q) {
    applyFilters();
    return;
  }
  filteredParkings = parkings.filter(p =>
    p.name.toLowerCase().includes(q) ||
    p.address.toLowerCase().includes(q)
  );
  applySort();
});

clearSearchBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearSearchBtn.classList.remove('visible');
  applyFilters();
});

/* ============================================
   View Switching
   ============================================ */
function switchView(view) {
  currentView = view;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view === view);
  });
  if (view === 'map') {
    document.getElementById('mapView').style.display = 'block';
    listView.classList.remove('active');
    document.getElementById('sortBar').style.display = 'flex';
  } else if (view === 'list') {
    document.getElementById('mapView').style.display = 'none';
    listView.classList.add('active');
    document.getElementById('sortBar').style.display = 'flex';
    renderList();
  } else if (view === 'compare') {
    openCompare();
  }
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchView(btn.dataset.view));
});

/* ============================================
   Toast
   ============================================ */
let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

/* ============================================
   Init
   ============================================ */
drawMap();
applyFilters();
setTimeout(() => {
  document.getElementById('loading').classList.add('hidden');
}, 600);
</script>
</div>
