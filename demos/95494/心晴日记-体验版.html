<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>心晴日记 - 体验版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Ma+Shan+Zheng&family=Caveat:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Noto Sans SC', sans-serif;
    background: linear-gradient(160deg, #f5f0eb 0%, #ede4d9 50%, #e8ddd3 100%);
    color: #5a4a3a;
  }

  .app { width: 100%; height: 100vh; display: flex; flex-direction: column; }

  /* ============ 离线体验版横幅 ============ */
  .offline-banner {
    background: #fff3cd;
    color: #856404;
    padding: 8px 16px;
    font-size: 13px;
    text-align: center;
    border-bottom: 1px solid #ffeaa7;
    flex-shrink: 0;
    line-height: 1.5;
  }

  /* ============ 顶部 ============ */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; height: 52px; flex-shrink: 0;
    background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(126, 200, 184, 0.15);
  }
  .header-left { display: flex; align-items: center; gap: 8px; }
  .logo { font-size: 22px; }
  .title { font-size: 19px; font-weight: 700; color: #5a9e8e; }
  .header-right { display: flex; gap: 8px; }
  .header-btn {
    width: 38px; height: 38px; border: none; background: transparent;
    border-radius: 10px; cursor: pointer; color: #8b7757;
    display: flex; align-items: center; justify-content: center; padding: 9px;
    transition: all 0.2s;
  }
  .header-btn:hover { background: rgba(126, 200, 184, 0.12); color: #5a9e8e; }
  .header-btn svg { width: 100%; height: 100%; }

  /* ============ 每日提示 ============ */
  .daily-prompt {
    text-align: center; padding: 14px 20px; flex-shrink: 0;
    color: #8b7757; font-size: 15px;
    background: rgba(126, 200, 184, 0.06);
    border-bottom: 1px solid rgba(126, 200, 184, 0.08);
  }
  .today-date {
    display: block; font-size: 13px; color: #5a9e8e; font-weight: 500; margin-bottom: 4px;
  }
  .prompt-row { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .change-prompt-btn {
    flex-shrink: 0; border: 1px solid rgba(126, 200, 184, 0.4); background: rgba(126, 200, 184, 0.08);
    color: #5a9e8e; padding: 4px 14px; border-radius: 14px; font-size: 12px; cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif; transition: all 0.2s; white-space: nowrap;
  }
  .change-prompt-btn:hover { background: rgba(126, 200, 184, 0.2); border-color: #7ec8b8; }
  .change-prompt-btn:active { transform: scale(0.95); }

  /* ============ 画板 ============ */
  .canvas-area {
    flex: 1; display: flex; align-items: center; justify-content: center;
    position: relative; padding: 16px; overflow: hidden;
  }
  .paper {
    position: relative; width: 100%; max-width: 680px; height: 100%;
    max-height: 100%; background: #faf6ef; border-radius: 6px;
    box-shadow: 0 4px 24px rgba(126, 200, 184, 0.12), 0 1px 4px rgba(0,0,0,0.04);
    overflow: hidden; cursor: crosshair; touch-action: none;
  }
  .paper-lines {
    position: absolute; inset: 0; pointer-events: none; z-index: 1; opacity: 0.5;
    background: repeating-linear-gradient(0deg, transparent, transparent 30px, rgba(126, 200, 184, 0.06) 30px, rgba(126, 200, 184, 0.06) 31px);
  }
  #ink-canvas, #reveal-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }
  #reveal-canvas { z-index: 3; pointer-events: none; }

  /* ============ 工具栏 ============ */
  .toolbar {
    position: absolute; top: 16px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 10;
  }
  .tool-btn {
    width: 42px; height: 42px; border: none; background: rgba(255, 255, 255, 0.85);
    border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: #7ec8b8; box-shadow: 0 2px 8px rgba(126, 200, 184, 0.15); transition: all 0.2s; padding: 10px;
  }
  .tool-btn:hover { background: #fff; transform: scale(1.05); }
  .tool-btn:active { transform: scale(0.95); }
  .tool-btn svg { width: 100%; height: 100%; }
  .color-dot { width: 18px; height: 18px; border-radius: 50%; background: #5a4a3a; border: 2px solid rgba(126, 200, 184, 0.2); }

  /* ============ 情绪标签 ============ */
  .mood-display {
    position: absolute; bottom: 200px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 8px;
    background: rgba(255, 255, 255, 0.9); padding: 8px 20px; border-radius: 24px;
    box-shadow: 0 2px 12px rgba(126, 200, 184, 0.15);
    animation: moodIn 0.5s ease;
  }
  @keyframes moodIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  .mood-emoji { font-size: 24px; }
  .mood-text { font-size: 16px; font-weight: 700; color: #5a9e8e; }

  /* ============ 状态 ============ */
  .status {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 10; pointer-events: none;
  }
  .status span {
    background: rgba(255, 255, 255, 0.85); color: #8b7757; padding: 6px 18px; border-radius: 16px;
    font-size: 13px; box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  .status.thinking span { background: rgba(126, 200, 184, 0.12); color: #5a9e8e; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

  /* ============ 语音按钮 ============ */
  .speak-btn {
    position: absolute; bottom: 128px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 8px;
    background: #7ec8b8; color: #fff; border: none; padding: 10px 24px;
    border-radius: 24px; font-size: 14px; cursor: pointer; font-family: 'Noto Sans SC', sans-serif;
    box-shadow: 0 4px 12px rgba(126, 200, 184, 0.3); transition: all 0.2s;
    animation: speakIn 0.5s ease;
  }
  @keyframes speakIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  .speak-btn:hover { background: #5a9e8e; transform: translateX(-50%) scale(1.05); }
  .speak-btn:active { transform: translateX(-50%) scale(0.95); }
  .speak-btn.speaking { background: #f4a261; animation: speakingPulse 1s ease-in-out infinite; }
  @keyframes speakingPulse { 0%,100% { box-shadow: 0 4px 12px rgba(244, 162, 97, 0.3); } 50% { box-shadow: 0 4px 20px rgba(244, 162, 97, 0.5); } }
  .speak-btn svg { width: 18px; height: 18px; }

  /* ============ 弹窗 ============ */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 100;
    display: none; align-items: center; justify-content: center; backdrop-filter: blur(6px);
  }
  .modal.open { display: flex; }
  .modal-content {
    background: #faf6ef; padding: 28px; border-radius: 16px;
    max-width: 420px; width: 90%; max-height: 80vh; overflow-y: auto;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15); position: relative;
  }
  .modal-content h3 { color: #5a9e8e; margin-bottom: 20px; font-size: 20px; text-align: center; }
  .setting-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; font-size: 14px; color: #5a4a3a; }
  .setting-row select { padding: 6px 10px; border: 1px solid #d4c9b8; border-radius: 6px; background: #fff; color: #5a4a3a; font-size: 14px; }
  .modal-close-btn { width: 100%; margin-top: 16px; padding: 10px; border: none; background: #7ec8b8; color: #fff; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .modal-close-btn:hover { background: #5a9e8e; }

  /* ============ 历史日记 ============ */
  .history-content { max-width: 500px; }
  .history-list { display: flex; flex-direction: column; gap: 10px; }
  .history-item {
    background: #fff; border-radius: 12px; padding: 14px 18px; cursor: pointer;
    display: flex; align-items: center; gap: 14px; transition: all 0.2s;
    box-shadow: 0 2px 6px rgba(0,0,0,0.03);
  }
  .history-item:hover { transform: translateX(4px); box-shadow: 0 4px 10px rgba(126, 200, 184, 0.12); }
  .history-item .h-emoji { font-size: 26px; }
  .history-item .h-info { flex: 1; min-width: 0; }
  .history-item .h-date { font-size: 12px; color: #8b7757; }
  .history-item .h-summary { font-size: 13px; color: #5a4a3a; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-item .h-mood { padding: 3px 10px; border-radius: 10px; font-size: 11px; flex-shrink: 0; }
  .history-empty { text-align: center; color: #b0a090; padding: 40px 20px; font-size: 14px; }

  /* ============ 日记详情 ============ */
  .detail-content { max-width: 500px; }
  .detail-close { position: absolute; top: 14px; right: 14px; border: none; background: none; font-size: 28px; color: #8b7757; cursor: pointer; }
  .detail-date { color: #8b7757; font-size: 14px; margin-bottom: 14px; }
  .detail-mood { display: inline-block; padding: 4px 16px; border-radius: 12px; font-size: 14px; margin-bottom: 14px; }
  .detail-image { max-width: 100%; border-radius: 8px; margin-bottom: 16px; }
  .detail-reply { font-size: 16px; line-height: 1.9; color: #5a4a3a; font-family: 'Long Cang', 'Ma Shan Zheng', 'Noto Sans SC', cursive; }

  /* ============ 语音开关 ============ */
  .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background: #ccc; border-radius: 24px; transition: 0.3s; }
  .slider:before { content: ''; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.3s; }
  input:checked + .slider { background: #7ec8b8; }
  input:checked + .slider:before { transform: translateX(20px); }
  .header-btn.voice-on { color: #7ec8b8; }
  .header-btn.voice-off { color: #ccc; }
  .header-btn.voice-off svg path:last-child { display: none; }

  /* ============ 打卡按钮 ============ */
  .checkin-btn {
    position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 8px;
    background: #f4a261; color: #fff; border: none; padding: 10px 24px;
    border-radius: 24px; font-size: 14px; cursor: pointer; font-family: 'Noto Sans SC', sans-serif;
    box-shadow: 0 4px 12px rgba(244, 162, 97, 0.3); transition: all 0.2s;
    animation: speakIn 0.5s ease;
  }
  .checkin-btn:hover { background: #e8915a; transform: translateX(-50%) scale(1.05); }
  .checkin-btn:active { transform: translateX(-50%) scale(0.95); }
  .checkin-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; transform: translateX(-50%); }
  .checkin-btn svg { width: 18px; height: 18px; }

  /* ============ 心情卡片 ============ */
  .card-content { max-width: 380px; }
  .card-preview { margin: 16px 0; border-radius: 12px; overflow: hidden; }
  .card-actions { display: flex; gap: 10px; }
  .card-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: 'Noto Sans SC', sans-serif; }
  .card-btn.primary { background: #7ec8b8; color: #fff; }
  .card-btn.primary:hover { background: #5a9e8e; }
  .card-btn { background: #e8ddd3; color: #5a4a3a; }
  .card-btn:hover { background: #d4c9b8; }

  /* ============ Pad 适配 ============ */
  @media (min-width: 601px) and (max-width: 1366px) {
    .paper { max-width: 880px; }
    .header { height: 56px; }
    .title { font-size: 21px; }
    .daily-prompt { font-size: 16px; padding: 16px; }
    .tool-btn { width: 48px; height: 48px; }
  }
  @media (max-width: 600px) {
    .header { padding: 0 14px; height: 48px; }
    .title { font-size: 17px; }
    .daily-prompt { font-size: 14px; padding: 12px; }
    .toolbar { top: 12px; right: 14px; gap: 8px; }
    .tool-btn { width: 38px; height: 38px; }
    .canvas-area { padding: 10px; }
  }
  @media (hover: none) and (pointer: coarse) { .paper { cursor: auto; } }
  </style>
</head>
<body>
  <div class="app">
    <!-- 离线体验版提示横幅 -->
    <div class="offline-banner">
      这是离线体验版，AI 识别和心情画像功能需要完整版才能使用。手写绘画、语音朗读等功能可以正常体验。
    </div>

    <!-- 顶部 -->
    <header class="header">
      <div class="header-left">
        <span class="logo">🌤️</span>
        <span class="title">心晴日记</span>
      </div>
      <div class="header-right">
        <button id="btn-voice-toggle" class="header-btn voice-on" title="语音开关">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
        </button>
        <button id="btn-history" class="header-btn" title="往日回忆">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        </button>
        <button id="btn-settings" class="header-btn" title="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- 每日提示语 -->
    <div id="daily-prompt" class="daily-prompt">
      <span id="today-date" class="today-date"></span>
      <div class="prompt-row">
        <span id="prompt-text">今天的心情是什么颜色？画下来，或者写几个字告诉我</span>
        <button id="btn-change-prompt" class="change-prompt-btn" title="换一个问题">换一个</button>
      </div>
    </div>

    <!-- 画板区域 -->
    <main class="canvas-area">
      <div class="paper">
        <div class="paper-lines"></div>
        <canvas id="ink-canvas"></canvas>
        <canvas id="reveal-canvas"></canvas>
      </div>

      <!-- 工具栏 -->
      <div class="toolbar">
        <button id="btn-clear" class="tool-btn" title="清空">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
        </button>
        <button id="btn-color" class="tool-btn" title="颜色"><div class="color-dot" id="ink-color-dot"></div></button>
        <button id="btn-size" class="tool-btn" title="笔触"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/></svg></button>
      </div>

      <!-- 情绪标签 -->
      <div id="mood-display" class="mood-display" style="display:none;">
        <span id="mood-emoji" class="mood-emoji"></span>
        <span id="mood-text" class="mood-text"></span>
      </div>

      <!-- 状态 -->
      <div id="status" class="status"><span id="status-text">在纸上画下或写下你的心情</span></div>

      <!-- 语音按钮（AI回复后出现） -->
      <button id="btn-speak" class="speak-btn" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
        <span>听小暖说</span>
      </button>

      <!-- 打卡按钮（AI回复后出现） -->
      <button id="btn-checkin" class="checkin-btn" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        <span>总结今日心情</span>
      </button>
    </main>

    <!-- 设置面板 -->
    <div id="settings-panel" class="modal">
      <div class="modal-content">
        <h3>设置</h3>
        <div class="setting-row"><label>AI 状态</label><span id="ai-status-text">检测中...</span></div>
        <div class="setting-row"><label>陪伴者</label><span id="persona-name">小暖</span></div>
        <div class="setting-row"><label>中文字体</label>
          <select id="font-select"><option value="long-cang">龙藏行书</option><option value="ma-shan-zheng">马善政毛笔</option></select>
        </div>
        <div class="setting-row"><label>停笔等待</label>
          <select id="delay-select"><option value="1.5">1.5s</option><option value="2" selected>2.0s</option><option value="3">3.0s</option></select>
        </div>
        <div class="setting-row"><label>语音朗读</label>
          <label class="switch"><input type="checkbox" id="voice-switch" checked><span class="slider"></span></label>
        </div>
        <div class="setting-row"><label>语音语速</label>
          <select id="voice-rate"><option value="0.8">慢一点</option><option value="0.9" selected>正常</option><option value="1.0">快一点</option></select>
        </div>
        <button id="btn-close-settings" class="modal-close-btn">关闭</button>
      </div>
    </div>

    <!-- 历史日记面板 -->
    <div id="history-panel" class="modal">
      <div class="modal-content history-content">
        <h3>往日回忆</h3>
        <div id="history-list" class="history-list"></div>
        <button id="btn-close-history" class="modal-close-btn">关闭</button>
      </div>
    </div>

    <!-- 日记详情弹窗 -->
    <div id="diary-detail" class="modal">
      <div class="modal-content detail-content">
        <button id="btn-close-detail" class="detail-close">&times;</button>
        <div id="detail-body"></div>
      </div>
    </div>

    <!-- 心情日记卡弹窗 -->
    <div id="card-modal" class="modal">
      <div class="modal-content card-content">
        <h3>今日心情日记</h3>
        <div id="card-preview" class="card-preview"></div>
        <div class="card-actions">
          <button id="btn-export-card" class="card-btn primary">保存图片</button>
          <button id="btn-close-card" class="card-btn">关闭</button>
        </div>
      </div>
    </div>
  </div>
  <script>
  (() => {
    'use strict';

    // ============ DOM ============
    const inkCanvas = document.getElementById('ink-canvas');
    const revealCanvas = document.getElementById('reveal-canvas');
    const inkCtx = inkCanvas.getContext('2d');
    const revealCtx = revealCanvas.getContext('2d');
    const statusText = document.getElementById('status-text');
    const statusEl = document.getElementById('status');
    const moodDisplay = document.getElementById('mood-display');
    const moodEmoji = document.getElementById('mood-emoji');
    const moodText = document.getElementById('mood-text');
    const speakBtn = document.getElementById('btn-speak');
    const checkinBtn = document.getElementById('btn-checkin');
    const voiceToggleBtn = document.getElementById('btn-voice-toggle');
    const promptText = document.getElementById('prompt-text');

    // ============ 状态 ============
    let cw = 0, ch = 0;
    let drawing = false, lx = 0, ly = 0, lt = 0, lw = 0;
    let paths = [], curPath = [];
    let stopTimer = null, processing = false, drawn = false;
    let history = [];
    let inkColor = '#5a4a3a', colorIdx = 0;
    const colors = ['#5a4a3a', '#4a7b6a', '#7a5a4a', '#5a6b9a', '#9a5a5a', '#5a8a7a', '#8a6a9a'];
    let sizeIdx = 1;
    const sizes = [1.5, 2.5, 4];
    let stopDelay = 2000, fontChoice = 'long-cang', voiceRate = 0.9;
    let lastReply = '';
    let speaking = false;
    let voiceEnabled = true;
    let lastSnapshot = null;
    let lastMood = '平静';
    let currentPromptIndex = 0;

    const MOOD_EMOJI = { '开心': '😊', '平静': '😌', '焦虑': '😰', '孤独': '😔', '压力': '😣', '愤怒': '😤', '悲伤': '😢', '期待': '🤗', '迷茫': '😵', '感恩': '🙏' };
    const MOOD_COLORS = { '开心': '#f4a261', '平静': '#7ec8b8', '焦虑': '#e76f51', '孤独': '#8b7757', '压力': '#e76f51', '愤怒': '#e63946', '悲伤': '#6a8caf', '期待': '#f4a261', '迷茫': '#b0a090', '感恩': '#7ec8b8' };

    // 每日提示语
    const DAILY_PROMPTS = [
      '今天的心情是什么颜色？画下来，或者写几个字告诉我',
      '此刻的内心是什么天气？画出来让我看看',
      '今天发生了什么想说的？写下来或画下来',
      '如果今天是一种形状，它会是什么样的？',
      '画一棵树，或者写一句话，让我感受今天的你',
      '心里装了什么？把它画在纸上释放出来',
      '今天最想表达什么？用任何方式都可以',
      '画一个让你感到安全的地方，是什么样的？',
      '如果压力有形状，它会是什么样子？',
      '画一件今天让你感恩的小事',
      '此刻最想对自己说的一句话是什么？写下来',
      '画一个你心中的小太阳，它是什么样的？'
    ];

    // ============ 语音合成 ============
    let voices = [];
    function loadVoices() { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
    if (window.speechSynthesis) {
      loadVoices();
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speak(text) {
      if (!window.speechSynthesis) { return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      // 选中文语音
      const zhVoice = voices.find(v => v.lang === 'zh-CN') || voices.find(v => v.lang.startsWith('zh'));
      if (zhVoice) u.voice = zhVoice;
      u.rate = voiceRate;
      u.pitch = 1.0;
      u.volume = 1.0;
      u.onstart = () => { speaking = true; speakBtn.classList.add('speaking'); speakBtn.querySelector('span').textContent = '正在说...'; };
      u.onend = () => { speaking = false; speakBtn.classList.remove('speaking'); speakBtn.querySelector('span').textContent = '听小暖说'; };
      u.onerror = () => { speaking = false; speakBtn.classList.remove('speaking'); speakBtn.querySelector('span').textContent = '听小暖说'; };
      speechSynthesis.speak(u);
    }

    function stopSpeak() {
      if (window.speechSynthesis) speechSynthesis.cancel();
      speaking = false;
      speakBtn.classList.remove('speaking');
      speakBtn.querySelector('span').textContent = '听小暖说';
    }

    // 统一更新语音开关的 UI（顶部按钮 + 设置面板复选框）
    function applyVoiceUI() {
      voiceToggleBtn.classList.toggle('voice-on', voiceEnabled);
      voiceToggleBtn.classList.toggle('voice-off', !voiceEnabled);
      const sw = document.getElementById('voice-switch');
      if (sw) sw.checked = voiceEnabled;
    }

    function setVoiceEnabled(enabled) {
      voiceEnabled = !!enabled;
      applyVoiceUI();
      if (!voiceEnabled) stopSpeak();
      localStorage.setItem('md_voice', voiceEnabled ? '1' : '0');
    }

    // ============ 初始化 ============
    function init() {
      // 显示今天日期
      const today = new Date();
      const dateStr = today.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
      document.getElementById('today-date').textContent = dateStr;

      // 随机每日提示
      currentPromptIndex = Math.floor(Math.random() * DAILY_PROMPTS.length);
      promptText.textContent = DAILY_PROMPTS[currentPromptIndex];

      // 换问题按钮
      document.getElementById('btn-change-prompt').addEventListener('click', () => {
        currentPromptIndex = (currentPromptIndex + 1) % DAILY_PROMPTS.length;
        promptText.textContent = DAILY_PROMPTS[currentPromptIndex];
        // 清空画板，准备回答新问题
        clearInk(); clearReveal(); hideMood(); hideSpeak(); hideCheckin(); stopSpeak();
        history = []; // 换问题后重置对话历史
        setStatus('换了一个新问题，画下或写下你的回答吧');
      });

      resize();
      window.addEventListener('resize', resize);
      setupDrawing();
      setupToolbar();
      setupSettings();
      setupModals();
      checkAI();

      // 语音按钮
      speakBtn.addEventListener('click', () => {
        if (speaking) { stopSpeak(); }
        else if (lastReply) { speak(lastReply); }
      });

      // 语音开关（顶部按钮）
      voiceToggleBtn.addEventListener('click', () => setVoiceEnabled(!voiceEnabled));

      // 从 localStorage 加载语音开关状态
      const savedVoice = localStorage.getItem('md_voice');
      if (savedVoice !== null) {
        setVoiceEnabled(savedVoice === '1');
      } else {
        applyVoiceUI();
      }

      // 打卡按钮
      checkinBtn.addEventListener('click', doCheckin);

      // 心情卡片弹窗
      document.getElementById('btn-close-card').addEventListener('click', () => {
        document.getElementById('card-modal').classList.remove('open');
      });
      document.getElementById('card-modal').addEventListener('click', e => {
        if (e.target.id === 'card-modal') e.target.classList.remove('open');
      });
      document.getElementById('btn-export-card').addEventListener('click', exportCard);
    }

    function resize() {
      const paper = document.querySelector('.paper');
      if (!paper) return;
      const rect = paper.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      cw = rect.width; ch = rect.height;
      [inkCanvas, revealCanvas].forEach(c => {
        c.width = cw * dpr; c.height = ch * dpr;
        c.style.width = cw + 'px'; c.style.height = ch + 'px';
        c.getContext('2d').scale(dpr, dpr);
      });
      redraw();
    }

    // ============ 手写 ============
    function setupDrawing() {
      const paper = document.querySelector('.paper');
      paper.addEventListener('mousedown', startDraw);
      paper.addEventListener('mousemove', draw);
      paper.addEventListener('mouseup', endDraw);
      paper.addEventListener('mouseleave', endDraw);
      paper.addEventListener('touchstart', e => { e.preventDefault(); const t = e.touches[0]; const r = inkCanvas.getBoundingClientRect(); startAt(t.clientX - r.left, t.clientY - r.top); }, { passive: false });
      paper.addEventListener('touchmove', e => { e.preventDefault(); const t = e.touches[0]; const r = inkCanvas.getBoundingClientRect(); drawAt(t.clientX - r.left, t.clientY - r.top); }, { passive: false });
      paper.addEventListener('touchend', endDraw);
      paper.addEventListener('touchcancel', endDraw);
    }

    function startDraw(e) { const r = inkCanvas.getBoundingClientRect(); startAt(e.clientX - r.left, e.clientY - r.top); }

    function startAt(x, y) {
      if (processing) return;
      drawing = true; drawn = true;
      clearReveal(); hideMood(); hideSpeak(); hideCheckin();
      stopSpeak();
      lx = x; ly = y; lt = Date.now(); lw = sizes[sizeIdx];
      curPath = [{ x, y, w: lw }];
      paths.push({ color: inkColor, points: curPath });
      if (stopTimer) { clearTimeout(stopTimer); stopTimer = null; }
      setStatus('书写中...');
    }

    function draw(e) { if (!drawing) return; const r = inkCanvas.getBoundingClientRect(); drawAt(e.clientX - r.left, e.clientY - r.top); }

    function drawAt(x, y) {
      if (!drawing) return;
      const now = Date.now();
      const dt = now - lt;
      const dist = Math.hypot(x - lx, y - ly);
      const speed = dist / (dt || 1);
      const base = sizes[sizeIdx];
      let w = base * 1.5 - speed * 0.5;
      w = Math.max(base * 0.5, Math.min(base * 1.5, w));
      w = lw + (w - lw) * 0.3;
      inkCtx.strokeStyle = inkColor;
      inkCtx.lineCap = 'round'; inkCtx.lineJoin = 'round';
      inkCtx.lineWidth = w; inkCtx.globalAlpha = 0.85;
      // 用 quadraticCurveTo 平滑：从上一点画到当前点，控制点用中点
      const mx = (lx + x) / 2, my = (ly + y) / 2;
      inkCtx.beginPath();
      inkCtx.moveTo(lx, ly);
      inkCtx.quadraticCurveTo(mx, my, x, y);
      inkCtx.stroke();
      curPath.push({ x, y, w });
      lx = x; ly = y; lt = now; lw = w;
    }

    function endDraw() {
      if (!drawing) return;
      drawing = false;
      if (stopTimer) clearTimeout(stopTimer);
      stopTimer = setTimeout(onStop, stopDelay);
    }

    function onStop() {
      if (processing) return;
      const total = paths.reduce((a, s) => a + s.points.length, 0);
      if (total < 5) { setStatus('在纸上画下或写下你的心情'); return; }
      processing = true;
      setStatus('小暖正在感受你的心情...', true);
      const snapshot = capture();
      fadeOut();
      setTimeout(() => respond(snapshot), 1500);
    }

    // ============ 截图 ============
    function capture() {
      const w = inkCanvas.width, h = inkCanvas.height;
      const imgData = inkCtx.getImageData(0, 0, w, h);
      const px = imgData.data;
      let minX = w, minY = h, maxX = 0, maxY = 0, has = false;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (px[(y * w + x) * 4 + 3] > 10) {
            has = true;
            if (x < minX) minX = x; if (x > maxX) maxX = x;
            if (y < minY) minY = y; if (y > maxY) maxY = y;
          }
        }
      }
      if (!has) return null;
      const pad = 20;
      minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
      maxX = Math.min(w, maxX + pad); maxY = Math.min(h, maxY + pad);
      const cropW = maxX - minX, cropH = maxY - minY;
      const tmp = document.createElement('canvas');
      const maxDim = 800;
      const scale = (cropW > maxDim || cropH > maxDim) ? maxDim / Math.max(cropW, cropH) : 1;
      tmp.width = Math.round(cropW * scale);
      tmp.height = Math.round(cropH * scale);
      const ctx = tmp.getContext('2d');
      ctx.fillStyle = '#faf6ef';
      ctx.fillRect(0, 0, tmp.width, tmp.height);
      ctx.drawImage(inkCanvas, minX, minY, cropW, cropH, 0, 0, tmp.width, tmp.height);
      return tmp.toDataURL('image/png');
    }

    // ============ 淡出 ============
    function fadeOut() {
      const start = Date.now();
      (function anim() {
        const op = 1 - (Date.now() - start) / 1400;
        if (op <= 0) { clearInk(); return; }
        inkCtx.clearRect(0, 0, cw, ch);
        inkCtx.globalAlpha = op;
        redraw();
        inkCtx.globalAlpha = 1;
        requestAnimationFrame(anim);
      })();
    }

    function redraw() {
      paths.forEach(s => {
        if (s.points.length < 2) return;
        inkCtx.strokeStyle = s.color;
        inkCtx.lineCap = 'round'; inkCtx.lineJoin = 'round';
        inkCtx.globalAlpha = 0.85;
        inkCtx.beginPath();
        inkCtx.moveTo(s.points[0].x, s.points[0].y);
        for (let i = 1; i < s.points.length; i++) {
          inkCtx.lineWidth = s.points[i].w || 2.5;
          inkCtx.lineTo(s.points[i].x, s.points[i].y);
        }
        inkCtx.stroke();
      });
      inkCtx.globalAlpha = 1;
    }

    function clearInk() { inkCtx.clearRect(0, 0, cw, ch); paths = []; curPath = []; }
    function clearReveal() { revealCtx.clearRect(0, 0, cw, ch); }
    function hideMood() { moodDisplay.style.display = 'none'; }
    function hideSpeak() { speakBtn.style.display = 'none'; }
    function hideCheckin() { checkinBtn.style.display = 'none'; }

    // ============ AI 回复 ============
    async function respond(snapshot) {
      if (!snapshot) { setStatus('未检测到笔迹，请再试一次'); processing = false; return; }
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), 60000);
      try {
        const r = await fetch('/api/diary/chat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: snapshot, history, guideTopic: DAILY_PROMPTS[currentPromptIndex] }),
          signal: ctrl.signal
        });
        clearTimeout(tid);
        if (!r.ok) { const e = await r.json(); throw new Error(e.error || 'AI 响应失败'); }
        const data = await r.json();

        history.push({ role: 'user', content: data.recognized || '[用户画作/文字]' });
        history.push({ role: 'assistant', content: data.reply });
        if (history.length > 20) history = history.slice(-20);

        lastSnapshot = snapshot;
        lastMood = data.mood; // 可能为 null
        if (data.mood) { showMood(data.mood); } else { hideMood(); }
        setStatus('');
        lastReply = data.reply;
        revealText(data.reply);
      } catch (e) {
        clearTimeout(tid);
        // 离线体验版：fetch 必然失败，显示友好提示
        const offlineMsg = '这是离线体验版，AI 功能需要完整版才能使用。完整版中小暖会识别你的画作并给予温暖的回应。';
        lastReply = offlineMsg;
        lastSnapshot = snapshot;
        hideMood();
        setStatus('');
        revealText(offlineMsg);
      }
    }

    function showMood(mood) {
      moodEmoji.textContent = MOOD_EMOJI[mood] || '📝';
      moodText.textContent = mood || '平静';
      moodText.style.color = MOOD_COLORS[mood] || '#7ec8b8';
      moodDisplay.style.display = 'flex';
    }

    async function saveDiary(userImage, aiReply, mood, portraitUrl, encouragement) {
      try {
        await fetch('/api/diary/save', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userImage, aiReply, mood, portraitUrl, encouragement })
        });
      } catch (e) { console.error('save error:', e); }
    }

    // ============ 每日打卡 ============
    let currentCardData = null; // 保存当前卡片数据供导出使用

    async function doCheckin() {
      if (!lastReply) { setStatus('请先和小暖聊一聊再打卡'); return; }
      checkinBtn.disabled = true;
      hideSpeak();
      setStatus('小暖正在为你画今日心情画像...', true);

      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), 120000); // 画像生成可能较慢，2分钟超时
      try {
        const r = await fetch('/api/diary/portrait', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userImage: lastSnapshot,
            aiReply: lastReply,
            mood: lastMood,
            chatHistory: history
          }),
          signal: ctrl.signal
        });
        clearTimeout(tid);
        if (!r.ok) { const e = await r.json(); throw new Error(e.error || '画像生成失败'); }
        const data = await r.json();

        // 保存日记
        await saveDiary(lastSnapshot, lastReply, lastMood, data.portraitUrl, data.encouragement);

        // 准备卡片数据
        const today = new Date();
        const dateStr = today.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
        currentCardData = {
          portraitUrl: data.portraitUrl,
          encouragement: data.encouragement,
          mood: lastMood || '心情',
          date: dateStr,
          aiReply: lastReply
        };

        // 展示卡片预览
        showCardPreview(currentCardData);
        setStatus('今日心情已保存 ✨');
        checkinBtn.disabled = false;
        hideCheckin();
      } catch (e) {
        clearTimeout(tid);
        checkinBtn.disabled = false;
        // 离线体验版：fetch 必然失败，显示友好提示
        setStatus('这是离线体验版，心情画像生成功能需要完整版才能使用。');
      }
    }

    function showCardPreview(data) {
      const preview = document.getElementById('card-preview');
      const emoji = MOOD_EMOJI[data.mood] || '📝';
      const color = MOOD_COLORS[data.mood] || '#7ec8b8';
      preview.innerHTML = `
        <div style="background:linear-gradient(160deg, #f5f0eb 0%, #ede4d9 100%); padding:18px; border:1px solid rgba(126,200,184,0.2);">
          <div style="text-align:center; color:#8b7757; font-size:13px; margin-bottom:8px;">${data.date}</div>
          <div style="text-align:center; margin-bottom:12px;">
            <span style="display:inline-block; padding:4px 14px; background:${color}20; color:${color}; border-radius:12px; font-size:14px;">
              ${emoji} ${data.mood}
            </span>
          </div>
          <img src="${data.portraitUrl}" style="width:100%; border-radius:8px; display:block; margin-bottom:12px;">
          <div style="text-align:center; color:#5a4a3a; font-size:14px; line-height:1.8; padding:0 8px 10px; font-family:'Long Cang','Ma Shan Zheng','Noto Sans SC',cursive;">
            ${data.aiReply}
          </div>
          <div style="text-align:center; color:#5a9e8e; font-size:15px; font-weight:500; padding:8px 0; border-top:1px dashed rgba(126,200,184,0.3);">
            ${data.encouragement}
          </div>
        </div>
      `;
      document.getElementById('card-modal').classList.add('open');
    }

    // ============ 导出心情日记卡 ============
    async function exportCard() {
      if (!currentCardData) { return; }
      const btn = document.getElementById('btn-export-card');
      const originalText = btn.textContent;
      btn.textContent = '正在生成图片...';
      btn.disabled = true;
      try {
        const cardBlob = await renderCardToImage(currentCardData);
        // 触发下载
        const url = URL.createObjectURL(cardBlob);
        const a = document.createElement('a');
        a.href = url;
        const today = new Date();
        const fname = `mind-diary-${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, '0')}${String(today.getDate()).padStart(2, '0')}.png`;
        a.download = fname;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (e) {
        console.error('export error:', e);
        setStatus('导出失败: ' + e.message);
      } finally {
        btn.textContent = originalText;
        btn.disabled = false;
      }
    }

    // 将心情卡片渲染为图片
    function renderCardToImage(data) {
      return new Promise((resolve, reject) => {
        const canvas = document.createElement('canvas');
        const W = 720, H = 1080;
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');

        // 背景
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#f5f0eb');
        grad.addColorStop(0.5, '#ede4d9');
        grad.addColorStop(1, '#e8ddd3');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // 顶部装饰条
        ctx.fillStyle = 'rgba(126, 200, 184, 0.3)';
        ctx.fillRect(0, 0, W, 6);

        // 日期
        ctx.fillStyle = '#8b7757';
        ctx.font = '24px "Noto Sans SC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(data.date, W / 2, 60);

        // 心情标签
        const moodColor = MOOD_COLORS[data.mood] || '#7ec8b8';
        const emoji = MOOD_EMOJI[data.mood] || '📝';
        ctx.font = '28px "Noto Sans SC", sans-serif';
        const moodText = `${emoji} ${data.mood}`;
        const moodW = ctx.measureText(moodText).width + 40;
        ctx.fillStyle = moodColor + '20';
        roundRect(ctx, W / 2 - moodW / 2, 85, moodW, 40, 20);
        ctx.fill();
        ctx.fillStyle = moodColor;
        ctx.fillText(moodText, W / 2, 113);

        // 加载并绘制画像
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          // 画像区域：居中，最大宽度 600
          const maxW = 600;
          const maxH = 460;
          let iw = img.width, ih = img.height;
          const scale = Math.min(maxW / iw, maxH / ih);
          iw = iw * scale; ih = ih * scale;
          const ix = (W - iw) / 2;
          const iy = 150;
          // 圆角裁剪
          ctx.save();
          roundRect(ctx, ix, iy, iw, ih, 12);
          ctx.clip();
          ctx.drawImage(img, ix, iy, iw, ih);
          ctx.restore();
          // 边框
          ctx.strokeStyle = 'rgba(126, 200, 184, 0.2)';
          ctx.lineWidth = 1;
          roundRect(ctx, ix, iy, iw, ih, 12);
          ctx.stroke();

          drawTextContent();
        };
        img.onerror = () => {
          // 图片加载失败，画占位
          ctx.fillStyle = 'rgba(126, 200, 184, 0.1)';
          roundRect(ctx, 60, 150, W - 120, 460, 12);
          ctx.fill();
          ctx.fillStyle = '#b0a090';
          ctx.font = '18px "Noto Sans SC", sans-serif';
          ctx.fillText('（画像加载失败）', W / 2, 380);
          drawTextContent();
        };

        // 绘制文字内容（AI回复 + 鼓励语）
        function drawTextContent() {
          let y = 640;
          // AI 回复
          ctx.fillStyle = '#5a4a3a';
          ctx.font = '24px "Noto Sans SC", sans-serif';
          ctx.textAlign = 'center';
          const replyLines = wrapText(ctx, data.aiReply, W - 120);
          replyLines.forEach(line => {
            ctx.fillText(line, W / 2, y);
            y += 38;
          });

          // 分隔线
          y += 20;
          ctx.strokeStyle = 'rgba(126, 200, 184, 0.3)';
          ctx.lineWidth = 1;
          ctx.setLineDash([6, 6]);
          ctx.beginPath();
          ctx.moveTo(100, y);
          ctx.lineTo(W - 100, y);
          ctx.stroke();
          ctx.setLineDash([]);

          // 鼓励语
          y += 40;
          ctx.fillStyle = '#5a9e8e';
          ctx.font = 'bold 26px "Noto Sans SC", sans-serif';
          ctx.fillText(data.encouragement, W / 2, y);

          // 底部签名
          y = H - 50;
          ctx.fillStyle = '#b0a090';
          ctx.font = '16px "Noto Sans SC", sans-serif';
          ctx.fillText('心晴日记 · 小暖陪伴', W / 2, y);

          // 转 blob
          canvas.toBlob(blob => {
            if (blob) resolve(blob);
            else reject(new Error('canvas toBlob failed'));
          }, 'image/png');
        }

        // 加载图片
        img.src = data.portraitUrl;
        // 超时保护
        setTimeout(() => {
          if (!img.complete) {
            // 图片加载超时，继续生成不带图片
            drawTextContent();
          }
        }, 15000);
      });
    }

    // 圆角矩形辅助函数
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // 文本换行辅助函数
    function wrapText(ctx, text, maxWidth) {
      const lines = [];
      let line = '';
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (ch === '\n') { lines.push(line); line = ''; continue; }
        const test = line + ch;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = ch;
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);
      return lines;
    }

    // ============ 文字浮现 ============
    function revealText(text) {
      const pad = 40, maxW = cw - pad * 2, startY = 80;
      // 底部安全区域：避开按钮（mood 200px / speak 128px / checkin 70px / status 18px）
      // 留出 240px 底部空间给按钮，文字只绘制到 ch - 240
      const bottomSafe = 240;
      const maxY = ch - bottomSafe;
      clearReveal();
      const isZh = /[\u4e00-\u9fa5]/.test(text);
      const ff = isZh
        ? (fontChoice === 'long-cang' ? "'Long Cang', 'Ma Shan Zheng'" : "'Ma Shan Zheng', 'Long Cang'")
        : "'Caveat', cursive";
      let fs = isZh ? 26 : 22;
      let lh = isZh ? 42 : 36;
      revealCtx.font = `${fs}px ${ff}`;
      revealCtx.fillStyle = '#5a4a3a';
      revealCtx.textBaseline = 'top';

      const chars = text.split('');
      let lines = [];
      let line = '';
      chars.forEach(ch => {
        if (revealCtx.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; }
        else line += ch;
      });
      if (line) lines.push(line);

      // 如果文字超出可绘制区域，缩小字号重排
      const maxLines = Math.floor((maxY - startY) / lh);
      if (lines.length > maxLines) {
        // 缩小字号尝试适配
        while (fs > 16 && lines.length > maxLines) {
          fs -= 2; lh = isZh ? fs * 1.6 : fs * 1.5;
          revealCtx.font = `${fs}px ${ff}`;
          lines = []; line = '';
          chars.forEach(ch => {
            if (revealCtx.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; }
            else line += ch;
          });
          if (line) lines.push(line);
        }
      }
      // 仍然超长则截断（保留最后一行显示省略号）
      const finalMaxLines = Math.floor((maxY - startY) / lh);
      if (lines.length > finalMaxLines) {
        lines = lines.slice(0, finalMaxLines);
        if (lines.length > 0) lines[lines.length - 1] = lines[lines.length - 1].slice(0, -2) + '…';
      }

      const all = [];
      lines.forEach((ln, li) => {
        let x = pad;
        for (let i = 0; i < ln.length; i++) {
          const w = revealCtx.measureText(ln[i]).width;
          all.push({ ch: ln[i], x, y: startY + li * lh });
          x += w * 1.05;
        }
      });

      let idx = 0;
      (function next() {
        if (idx >= all.length) {
          processing = false;
          setStatus('点击页面继续');
          // 显示语音和打卡按钮
          speakBtn.style.display = 'flex';
          checkinBtn.style.display = 'flex';
          // 自动语音播放（受开关控制）
          if (voiceEnabled) {
            setTimeout(() => { if (lastReply && !speaking) speak(lastReply); }, 500);
          }
          return;
        }
        const ci = all[idx];
        let op = 0;
        const st = Date.now();
        (function fi() {
          op = Math.min(1, (Date.now() - st) / 300);
          const spread = 1 - op;
          revealCtx.save();
          revealCtx.globalAlpha = op * 0.9;
          revealCtx.fillStyle = '#5a4a3a';
          revealCtx.font = `${fs + spread * 2}px ${ff}`;
          revealCtx.fillText(ci.ch, ci.x, ci.y + spread * 3);
          revealCtx.restore();
          if (op < 1) requestAnimationFrame(fi);
        })();
        idx++;
        setTimeout(next, 55 + Math.random() * 30);
      })();
    }

    // ============ 工具栏 ============
    function setupToolbar() {
      document.getElementById('btn-clear').addEventListener('click', () => {
        if (processing) return;
        clearInk(); clearReveal(); hideMood(); hideSpeak(); hideCheckin(); stopSpeak();
        setStatus('页面已清空');
        setTimeout(() => setStatus('在纸上画下或写下你的心情'), 1500);
      });
      document.getElementById('btn-color').addEventListener('click', () => {
        colorIdx = (colorIdx + 1) % colors.length;
        inkColor = colors[colorIdx];
        document.getElementById('ink-color-dot').style.background = inkColor;
      });
      document.getElementById('btn-size').addEventListener('click', () => {
        sizeIdx = (sizeIdx + 1) % sizes.length;
        document.getElementById('btn-size').innerHTML =
          `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="${3 + sizeIdx * 2}"/></svg>`;
      });
    }

    // ============ 设置 & 弹窗 ============
    function setupSettings() {
      document.getElementById('btn-settings').addEventListener('click', () => {
        document.getElementById('settings-panel').classList.add('open');
      });
      document.getElementById('btn-close-settings').addEventListener('click', () => {
        document.getElementById('settings-panel').classList.remove('open');
      });
      document.getElementById('settings-panel').addEventListener('click', e => {
        if (e.target.id === 'settings-panel') e.target.classList.remove('open');
      });
      document.getElementById('font-select').addEventListener('change', e => {
        fontChoice = e.target.value; localStorage.setItem('md_font', fontChoice);
      });
      document.getElementById('delay-select').addEventListener('change', e => {
        stopDelay = parseFloat(e.target.value) * 1000; localStorage.setItem('md_delay', stopDelay);
      });
      document.getElementById('voice-rate').addEventListener('change', e => {
        voiceRate = parseFloat(e.target.value); localStorage.setItem('md_vrate', voiceRate);
      });
      // 设置面板里的语音开关
      document.getElementById('voice-switch').addEventListener('change', e => {
        setVoiceEnabled(e.target.checked);
      });
      // 加载设置
      const sf = localStorage.getItem('md_font'), sd = localStorage.getItem('md_delay'), sv = localStorage.getItem('md_vrate');
      if (sf) { fontChoice = sf; document.getElementById('font-select').value = sf; }
      if (sd) { stopDelay = parseInt(sd); document.getElementById('delay-select').value = (stopDelay / 1000).toString(); }
      if (sv) { voiceRate = parseFloat(sv); document.getElementById('voice-rate').value = sv.toString(); }
    }

    function setupModals() {
      // 历史按钮
      document.getElementById('btn-history').addEventListener('click', async () => {
        document.getElementById('history-panel').classList.add('open');
        await loadHistory();
      });
      document.getElementById('btn-close-history').addEventListener('click', () => {
        document.getElementById('history-panel').classList.remove('open');
      });
      document.getElementById('history-panel').addEventListener('click', e => {
        if (e.target.id === 'history-panel') e.target.classList.remove('open');
      });
      // 详情关闭
      document.getElementById('btn-close-detail').addEventListener('click', () => {
        document.getElementById('diary-detail').classList.remove('open');
      });
      document.getElementById('diary-detail').addEventListener('click', e => {
        if (e.target.id === 'diary-detail') e.target.classList.remove('open');
      });
    }

    async function loadHistory() {
      // 离线体验版：不保存历史记录
      const list = document.getElementById('history-list');
      list.innerHTML = '<div class="history-empty">离线体验版不保存历史记录</div>';
    }

    function showDetail(id, diaries) {
      const d = diaries.find(x => x.id === id);
      if (!d) return;
      const date = new Date(d.date).toLocaleString('zh-CN');
      const color = MOOD_COLORS[d.mood] || '#7ec8b8';
      document.getElementById('detail-body').innerHTML = `
        <div class="detail-date">${date}</div>
        <div class="detail-mood" style="background:${color}20;color:${color};">${MOOD_EMOJI[d.mood] || '📝'} ${d.mood}</div>
        ${d.userImage ? `<img class="detail-image" src="${d.userImage}" alt="">` : ''}
        <div class="detail-reply">${d.aiReply}</div>
      `;
      document.getElementById('diary-detail').classList.add('open');
    }

    async function checkAI() {
      // 离线体验版：直接显示离线状态
      const el = document.getElementById('ai-status-text');
      el.textContent = '离线体验版';
      el.style.color = '#f4a261';
    }

    function setStatus(text, thinking = false) {
      statusText.textContent = text || '';
      statusEl.classList.toggle('thinking', thinking);
    }

    // 点击继续
    document.querySelector('.paper').addEventListener('click', () => {
      if (!processing && !drawing && paths.length === 0) {
        clearReveal(); hideMood(); hideSpeak(); hideCheckin(); stopSpeak();
        setStatus('在纸上画下或写下你的心情');
      }
    });

    init();
  })();
  </script>
</body>
