<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowSpace - 沉浸式专注空间</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    color: #fff;
    overflow: hidden;
    position: relative;
  }

  /* 背景粒子效果 */
  .particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    opacity: 0.3;
  }
  .particle {
    position: absolute;
    width: 2px; height: 2px;
    background: #e94560;
    border-radius: 50%;
    animation: float 8s infinite ease-in-out;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-100vh) translateX(20px); }
  }

  /* 主容器 */
  .container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    z-index: 10;
  }

  /* 顶部标签 */
  .badge {
    background: rgba(233, 69, 96, 0.2);
    border: 1px solid rgba(233, 69, 96, 0.4);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    color: #e94560;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }

  .title {
    font-size: 32px;
    font-weight: 300;
    letter-spacing: 8px;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #fff, #e94560);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 50px;
    letter-spacing: 2px;
  }

  /* 计时器圆环 */
  .timer-wrapper {
    position: relative;
    width: 320px;
    height: 320px;
    margin-bottom: 40px;
  }

  /* 呼吸光环 */
  .breath-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 100%; height: 100%;
    border-radius: 50%;
    border: 2px solid rgba(233, 69, 96, 0.2);
    animation: breathe 4s infinite ease-in-out;
  }
  .breath-ring:nth-child(2) { animation-delay: 1s; }
  .breath-ring:nth-child(3) { animation-delay: 2s; }
  
  @keyframes breathe {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
    50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.6; }
  }

  /* 进度环 */
  .progress-ring {
    position: relative;
    width: 100%; height: 100%;
  }
  .progress-ring svg {
    transform: rotate(-90deg);
    width: 100%; height: 100%;
  }
  .progress-ring circle {
    fill: none;
    stroke-width: 4;
  }
  .ring-bg {
    stroke: rgba(255,255,255,0.1);
  }
  .ring-progress {
    stroke: #e94560;
    stroke-linecap: round;
    stroke-dasharray: 880;
    stroke-dashoffset: 220;
    transition: stroke-dashoffset 1s linear;
    filter: drop-shadow(0 0 10px rgba(233, 69, 96, 0.5));
  }

  /* 时间显示 */
  .time-display {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .time {
    font-size: 64px;
    font-weight: 200;
    letter-spacing: 4px;
    font-variant-numeric: tabular-nums;
  }
  .mode-label {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    margin-top: 8px;
    letter-spacing: 4px;
  }

  /* 模式切换 */
  .mode-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 40px;
    background: rgba(255,255,255,0.05);
    padding: 4px;
    border-radius: 30px;
  }
  .mode-tab {
    padding: 10px 24px;
    border-radius: 24px;
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    transition: all 0.3s;
    border: none;
    background: transparent;
    color: #fff;
  }
  .mode-tab.active {
    background: #e94560;
    color: #fff;
    box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
  }

  /* 控制按钮 */
  .controls {
    display: flex;
    gap: 20px;
    align-items: center;
    margin-bottom: 50px;
  }
  .btn {
    width: 60px; height: 60px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    font-size: 20px;
  }
  .btn-secondary {
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.7);
  }
  .btn-secondary:hover {
    background: rgba(255,255,255,0.15);
  }
  .btn-primary {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, #e94560, #c73e54);
    color: #fff;
    box-shadow: 0 8px 30px rgba(233, 69, 96, 0.4);
  }
  .btn-primary:hover {
    transform: scale(1.05);
    box-shadow: 0 12px 40px rgba(233, 69, 96, 0.5);
  }

  /* 白噪音面板 */
  .sound-panel {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 500px;
  }
  .sound-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 16px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s;
    border: 1px solid transparent;
    min-width: 70px;
  }
  .sound-item:hover {
    background: rgba(255,255,255,0.08);
  }
  .sound-item.active {
    background: rgba(233, 69, 96, 0.15);
    border-color: rgba(233, 69, 96, 0.4);
  }
  .sound-icon {
    font-size: 24px;
  }
  .sound-name {
    font-size: 11px;
    color: rgba(255,255,255,0.6);
  }

  /* 底部统计 */
  .stats {
    position: fixed;
    bottom: 30px;
    display: flex;
    gap: 40px;
  }
  .stat-item {
    text-align: center;
  }
  .stat-value {
    font-size: 24px;
    font-weight: 300;
    color: #e94560;
  }
  .stat-label {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    margin-top: 4px;
    letter-spacing: 1px;
  }

  /* 创意说明浮层 */
  .info-panel {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    padding: 20px;
    border-radius: 12px;
    max-width: 220px;
    font-size: 12px;
    line-height: 1.8;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .info-panel h3 {
    color: #e94560;
    font-size: 13px;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }
  .info-panel p {
    color: rgba(255,255,255,0.6);
    margin-bottom: 8px;
  }
  .info-panel .feature {
    padding-left: 12px;
    border-left: 2px solid #e94560;
    margin-bottom: 10px;
  }

  @media (max-width: 768px) {
    .info-panel { display: none; }
    .title { font-size: 24px; }
    .timer-wrapper { width: 260px; height: 260px; }
    .time { font-size: 48px; }
    .stats { gap: 24px; }
  }
</style>
</head>
<body>

<!-- 背景粒子 -->
<div class="particles" id="particles"></div>

<div class="container">
  <div class="badge">PRODUCT DEMO</div>
  <h1 class="title">FLOWSPACE</h1>
  <p class="subtitle">沉浸式专注空间 · 进入心流状态</p>

  <!-- 模式切换 -->
  <div class="mode-tabs">
    <button class="mode-tab active" onclick="switchMode(this, 25)">专注 25min</button>
    <button class="mode-tab" onclick="switchMode(this, 50)">深度 50min</button>
    <button class="mode-tab" onclick="switchMode(this, 5)">休息 5min</button>
  </div>

  <!-- 计时器 -->
  <div class="timer-wrapper">
    <div class="breath-ring"></div>
    <div class="breath-ring"></div>
    <div class="breath-ring"></div>
    
    <div class="progress-ring">
      <svg viewBox="0 0 300 300">
        <circle class="ring-bg" cx="150" cy="150" r="140"></circle>
        <circle class="ring-progress" cx="150" cy="150" r="140" id="progressCircle"></circle>
      </svg>
      <div class="time-display">
        <div class="time" id="timeDisplay">25:00</div>
        <div class="mode-label">专注模式</div>
      </div>
    </div>
  </div>

  <!-- 控制按钮 -->
  <div class="controls">
    <button class="btn btn-secondary">↺</button>
    <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">▶</button>
    <button class="btn btn-secondary">⏭</button>
  </div>

  <!-- 白噪音选择 -->
  <div class="sound-panel">
    <div class="sound-item active" onclick="toggleSound(this)">
      <div class="sound-icon">🌧️</div>
      <div class="sound-name">雨声</div>
    </div>
    <div class="sound-item" onclick="toggleSound(this)">
      <div class="sound-icon">🌊</div>
      <div class="sound-name">海浪</div>
    </div>
    <div class="sound-item" onclick="toggleSound(this)">
      <div class="sound-icon">🍃</div>
      <div class="sound-name">森林</div>
    </div>
    <div class="sound-item" onclick="toggleSound(this)">
      <div class="sound-icon">☕</div>
      <div class="sound-name">咖啡厅</div>
    </div>
    <div class="sound-item" onclick="toggleSound(this)">
      <div class="sound-icon">🔥</div>
      <div class="sound-name">篝火</div>
    </div>
    <div class="sound-item" onclick="toggleSound(this)">
      <div class="sound-icon">🎐</div>
      <div class="sound-name">白噪音</div>
    </div>
  </div>
</div>

<!-- 底部统计 -->
<div class="stats">
  <div class="stat-item">
    <div class="stat-value">12</div>
    <div class="stat-label">今日番茄</div>
  </div>
  <div class="stat-item">
    <div class="stat-value">5h</div>
    <div class="stat-label">专注时长</div>
  </div>
  <div class="stat-item">
    <div class="stat-value">7</div>
    <div class="stat-label">连续天数</div>
  </div>
</div>

<!-- 右侧创意说明 -->
<div class="info-panel">
  <h3>✨ 核心功能</h3>
  <div class="feature">
    <p><strong>呼吸引导动画</strong><br>三层呼吸光环帮助用户放慢呼吸，30秒进入状态</p>
  </div>
  <div class="feature">
    <p><strong>场景白噪音</strong><br>6种精选环境音，可自由组合叠加</p>
  </div>
  <div class="feature">
    <p><strong>番茄工作法</strong><br>25/50分钟专注 + 休息循环</p>
  </div>
  <div class="feature">
    <p><strong>成就系统</strong><br>每日番茄数、连续打卡、数据统计</p>
  </div>
  <div class="feature">
    <p><strong>沉浸模式</strong><br>一键屏蔽通知，全屏专注</p>
  </div>
</div>

<script>
  // 生成背景粒子
  const particlesContainer = document.getElementById('particles');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 8 + 's';
    p.style.animationDuration = (6 + Math.random() * 4) + 's';
    particlesContainer.appendChild(p);
  }

  // 计时器逻辑
  let totalSeconds = 25 * 60;
  let remainingSeconds = totalSeconds;
  let timerInterval = null;
  let isRunning = false;
  const circumference = 2 * Math.PI * 140;

  document.getElementById('progressCircle').style.strokeDasharray = circumference;
  updateProgress();

  function updateProgress() {
    const progress = remainingSeconds / totalSeconds;
    const offset = circumference * (1 - progress);
    document.getElementById('progressCircle').style.strokeDashoffset = offset;
    
    const mins = Math.floor(remainingSeconds / 60);
    const secs = remainingSeconds % 60;
    document.getElementById('timeDisplay').textContent = 
      String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
  }

  function toggleTimer() {
    const btn = document.getElementById('startBtn');
    if (isRunning) {
      clearInterval(timerInterval);
      btn.textContent = '▶';
    } else {
      timerInterval = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateProgress();
        } else {
          clearInterval(timerInterval);
          isRunning = false;
          btn.textContent = '▶';
        }
      }, 1000);
      btn.textContent = '⏸';
    }
    isRunning = !isRunning;
  }

  function switchMode(el, minutes) {
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    totalSeconds = minutes * 60;
    remainingSeconds = totalSeconds;
    updateProgress();
    
    if (isRunning) {
      clearInterval(timerInterval);
      isRunning = false;
      document.getElementById('startBtn').textContent = '▶';
    }
  }

  function toggleSound(el) {
    el.classList.toggle('active');
  }
</script>

</body>
</html>
