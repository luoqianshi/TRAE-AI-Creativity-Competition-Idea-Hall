<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《溯》电子族谱应用 - Demo演示版</title>
<style>
/* ========== CSS变量与全局样式 ========== */
:root {
  --bg: #f5f0eb;
  --bg-card: #fffdf9;
  --text: #3d3226;
  --text-light: #8b7d6b;
  --gold: #c9a96e;
  --gold-light: #e8d5b0;
  --gold-dark: #a07830;
  --primary: #5b7a6f;
  --primary-light: #8ab4a5;
  --danger: #c44545;
  --success: #6b9e6b;
  --border: #e0d5c7;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --radius: 10px;
  --font: 'PingFang SC', 'Microsoft YaHei', 'Noto Serif SC', serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: var(--font); background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
/* ========== 顶部导航栏 ========== */
.navbar {
  height: 52px; background: linear-gradient(135deg, #2c2416, #3d3226);
  color: #e8d5b0; display: flex; align-items: center; padding: 0 20px;
  z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.3); flex-shrink: 0;
}
.navbar .logo { font-size: 22px; font-weight: bold; letter-spacing: 4px; margin-right: 30px; }
.navbar .logo span { color: var(--gold); }
.navbar .nav-links { display: flex; gap: 4px; }
.navbar .nav-links button {
  background: none; border: none; color: #c9b896; padding: 8px 16px;
  cursor: pointer; border-radius: 6px; font-size: 14px; font-family: var(--font);
  transition: all 0.2s; white-space: nowrap;
}
.navbar .nav-links button:hover, .navbar .nav-links button.active { background: rgba(255,255,255,0.1); color: #fff; }
.navbar .nav-links button.hidden-entry { display: none; }
.navbar .nav-links .more-btn { position: relative; }
.navbar .nav-links .more-btn .dropdown {
  display: none; position: absolute; top: 100%; right: 0; min-width: 220px;
  background: #3d3226; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  z-index: 300; padding: 6px 0; flex-direction: column;
}
.navbar .nav-links .more-btn .dropdown.show { display: flex; }
.navbar .nav-links .more-btn .dropdown button {
  padding: 8px 16px; text-align: left; border-radius: 0; white-space: nowrap; width: 100%;
}
.navbar .nav-links .more-btn .dropdown .divider {
  border-top: 1px solid rgba(255,255,255,0.1); margin: 4px 0;
}
.navbar .nav-links .more-btn .dropdown .section-label {
  padding: 6px 16px; font-size: 10px; color: #8b7d6b; text-transform: uppercase;
}
.navbar .session-info { margin-left: auto; font-size: 12px; color: #8b7d6b; }
/* ========== 主体布局 ========== */
.main-container { display: flex; flex: 1; overflow: hidden; }
/* ========== 左侧面板 ========== */
.left-panel {
  width: 280px; background: var(--bg-card); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
}
.left-panel .panel-header {
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  font-weight: bold; font-size: 15px; display: flex; align-items: center; gap: 8px;
}
.left-panel .panel-header .icon { font-size: 18px; }
.left-panel .toolbar { padding: 12px; display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--border); }
.left-panel .toolbar button {
  padding: 7px 12px; border: 1px solid var(--border); border-radius: 6px;
  background: #fff; cursor: pointer; font-size: 12px; font-family: var(--font);
  transition: all 0.2s;
}
.left-panel .toolbar button:hover { background: var(--gold-light); border-color: var(--gold); }
.left-panel .toolbar button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.left-panel .node-list { flex: 1; overflow-y: auto; padding: 8px; }
.left-panel .node-list .node-item {
  padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px;
  border: 1px solid transparent; transition: all 0.2s; display: flex; align-items: center; gap: 10px;
}
.left-panel .node-list .node-item:hover { background: #faf6ef; border-color: var(--border); }
.left-panel .node-list .node-item.selected { background: var(--gold-light); border-color: var(--gold); }
.left-panel .node-list .node-item .avatar {
  width: 36px; height: 36px; border-radius: 50%; background: var(--primary-light);
  display: flex; align-items: center; justify-content: center; color: #fff;
  font-size: 14px; flex-shrink: 0;
}
.left-panel .node-list .node-item .info { flex: 1; min-width: 0; }
.left-panel .node-list .node-item .info .name { font-weight: bold; font-size: 14px; }
.left-panel .node-list .node-item .info .detail { font-size: 11px; color: var(--text-light); }
/* ========== 中心画布 ========== */
.canvas-container {
  flex: 1; position: relative; overflow: hidden; background: #faf7f2;
  background-image: radial-gradient(circle, #e8d5b0 1px, transparent 1px);
  background-size: 24px 24px;
}
.canvas-container .canvas-inner {
  position: absolute; transform-origin: 0 0; width: 10000px; height: 10000px;
}
/* 树节点 */
.tree-node {
  position: absolute; width: 150px; background: #fff; border-radius: 10px;
  box-shadow: var(--shadow); cursor: pointer; transition: all 0.2s;
  border: 2px solid transparent; text-align: center; padding: 10px 8px;
  user-select: none;
}
.tree-node:hover { border-color: var(--gold); transform: scale(1.03); z-index: 10; }
.tree-node.selected { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(91,122,111,0.2); }
.tree-node.merged-highlight { border-color: var(--gold); box-shadow: 0 0 15px rgba(201,169,110,0.6); }
.tree-node .node-avatar {
  width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 6px;
  background: var(--primary-light); display: flex; align-items: center;
  justify-content: center; color: #fff; font-size: 18px; font-weight: bold;
}
.tree-node .node-avatar.female { background: #c9a0a0; }
.tree-node .node-name { font-weight: bold; font-size: 14px; margin-bottom: 2px; }
.tree-node .node-info { font-size: 11px; color: var(--text-light); }
.tree-node .node-actions {
  display: flex; gap: 4px; justify-content: center; margin-top: 6px;
}
.tree-node .node-actions button {
  width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border);
  background: #fff; cursor: pointer; font-size: 10px; display: flex;
  align-items: center; justify-content: center; transition: all 0.2s;
}
.tree-node .node-actions button:hover { background: var(--gold-light); border-color: var(--gold); }
/* 连线 SVG */
.connections-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.connections-svg line { stroke: #c9a96e; stroke-width: 2; }
.connections-svg line.merged-line { stroke: #c9a96e; stroke-width: 3; stroke-dasharray: 6,3; }
.connections-svg text { fill: #8b7d6b; font-size: 10px; font-family: var(--font); }
/* 画布控制 */
.canvas-controls {
  position: absolute; bottom: 20px; right: 20px; display: flex; gap: 8px; z-index: 10;
}
.canvas-controls button {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
  background: #fff; cursor: pointer; font-size: 18px; box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center;
}
.canvas-controls button:hover { background: var(--gold-light); }
/* ========== 右侧面板 ========== */
.right-panel {
  width: 340px; background: var(--bg-card); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
}
.right-panel .panel-tabs {
  display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.right-panel .panel-tabs button {
  flex: 1; padding: 12px 8px; border: none; background: none; cursor: pointer;
  font-size: 13px; font-family: var(--font); border-bottom: 2px solid transparent;
  transition: all 0.2s; color: var(--text-light);
}
.right-panel .panel-tabs button.active { border-bottom-color: var(--gold); color: var(--text); font-weight: bold; }
.right-panel .panel-content { flex: 1; overflow-y: auto; padding: 16px; }
/* 表单 */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; color: var(--text-light); margin-bottom: 4px; font-weight: bold; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 13px; font-family: var(--font); background: #fff; outline: none;
  transition: border-color 0.2s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--gold); }
.form-group textarea { resize: vertical; min-height: 70px; }
.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }
.btn {
  padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer;
  font-size: 13px; font-family: var(--font); transition: all 0.2s; font-weight: bold;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #4a6b5e; }
.btn-gold { background: var(--gold); color: #fff; }
.btn-gold:hover { background: var(--gold-dark); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #a83838; }
.btn-outline { background: #fff; border: 1px solid var(--border); }
.btn-outline:hover { background: #faf6ef; }
.btn-sm { padding: 4px 10px; font-size: 11px; }
.btn-block { display: block; width: 100%; }
/* 线索卡片 */
.clue-card, .request-card {
  background: #fff; border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; margin-bottom: 10px; transition: all 0.2s;
}
.clue-card:hover { border-color: var(--gold); }
.clue-card .score { color: var(--gold-dark); font-weight: bold; font-size: 13px; }
.clue-card .actions, .request-card .actions { display: flex; gap: 6px; margin-top: 8px; }
/* 搜索结果 */
.search-result-item {
  padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px;
  border: 1px solid var(--border); transition: all 0.2s;
}
.search-result-item:hover { background: var(--gold-light); }
/* 弹窗 */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.4); z-index: 200; display: flex;
  align-items: center; justify-content: center;
}
.modal {
  background: var(--bg-card); border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,0.2);
  width: 90%; max-width: 520px; max-height: 80vh; overflow-y: auto;
}
.modal-header {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  font-weight: bold; font-size: 16px; display: flex; align-items: center; justify-content: space-between;
}
.modal-body { padding: 20px; }
.modal-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
.close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-light); }
/* 路径图 */
.path-graph { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px; }
.path-node {
  padding: 8px 16px; background: #fff; border-radius: 8px; border: 1px solid var(--border);
  font-size: 13px; text-align: center;
}
.path-connector { font-size: 20px; color: var(--gold); }
.path-gap { border: 1px dashed var(--text-light); padding: 6px 12px; border-radius: 6px; color: var(--text-light); font-size: 12px; }
/* Toast */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 300; padding: 10px 24px; border-radius: 8px; font-size: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); animation: fadeIn 0.3s; }
.toast.success { background: #e8f5e9; color: #2e7d32; }
.toast.error { background: #fce4ec; color: #c62828; }
.toast.info { background: #e3f2fd; color: #1565c0; }
@keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
/* 占位页 */
.placeholder-page { display: flex; align-items: center; justify-content: center; flex: 1; flex-direction: column; gap: 16px; color: var(--text-light); }
.placeholder-page .icon { font-size: 48px; }
/* 响应式 */
@media (max-width: 1200px) {
  .left-panel { width: 220px; }
  .right-panel { width: 280px; }
}
</style>
</head>
<body>

<!-- 顶部导航 -->
<nav class="navbar">
  <div class="logo"><span>溯</span> SUO</div>
  <div class="nav-links">
    <button class="active" data-page="tree">家族树</button>
    <button data-page="matching">AI匹配</button>
    <button data-page="search">寻根查找</button>
    <button data-page="missing">回家计划</button>
    <button class="hidden-entry" data-page="export">族谱导出</button>
    <button class="hidden-entry" data-page="memorial">故人纪念</button>
    <button class="hidden-entry" data-page="security">安全设置</button>
    <div class="more-btn">
      <button onclick="toggleMoreDropdown(event)">更多功能 ▾</button>
      <div class="dropdown" id="moreDropdown">
        <div class="section-label">核心功能占位</div>
        <button data-page="export">族谱导出 (PDF/Word)</button>
        <button data-page="memorial">故人纪念 · 音容犹在</button>
        <button data-page="cemetery">坟茔地图 · 入土为安</button>
        <button data-page="digital-human">AI数字人克隆</button>
        <div class="divider"></div>
        <div class="section-label">安全与合规占位</div>
        <button data-page="face-verify">人脸认证 · 活体检测</button>
        <button data-page="clue-square">线索广场</button>
        <button data-page="fraud-intercept">反诈拦截 · NLP风控</button>
        <button data-page="watermark">数字水印 · 截图溯源</button>
        <button data-page="rate-limit">高频熔断 · 异常检测</button>
        <div class="divider"></div>
        <div class="section-label">外部对接占位</div>
        <button data-page="external-api">公益机构API对接</button>
        <button data-page="dna-match">DNA数据回传比对</button>
      </div>
    </div>
  </div>
  <div class="session-info">访客会话: <span id="sessionIdDisplay">---</span></div>
</nav>

<!-- 主体 -->
<div class="main-container" id="mainContainer">
  <!-- 左侧面板 -->
  <aside class="left-panel" id="leftPanel">
    <div class="panel-header"><span class="icon">🌳</span> 家族成员</div>
    <div class="toolbar">
      <button class="primary" onclick="addRootPerson()">+ 添加根节点</button>
      <button onclick="loadDemoFamily()" title="快速加载李良海家族演示数据">📥 加载演示家族</button>
      <button onclick="resetView()">居中视图</button>
    </div>
    <div class="node-list" id="nodeList"></div>
  </aside>

  <!-- 中心画布 -->
  <div class="canvas-container" id="canvasContainer">
    <div class="canvas-inner" id="canvasInner">
      <svg class="connections-svg" id="connectionsSvg"></svg>
    </div>
    <div class="canvas-controls">
      <button onclick="zoomIn()" title="放大">+</button>
      <button onclick="zoomOut()" title="缩小">−</button>
      <button onclick="resetView()" title="重置">⌂</button>
    </div>
  </div>

  <!-- 右侧面板 -->
  <aside class="right-panel" id="rightPanel">
    <div class="panel-tabs">
      <button class="active" data-tab="detail">节点详情</button>
      <button data-tab="clues">匹配线索</button>
      <button data-tab="requests">建联请求</button>
    </div>
    <div class="panel-content" id="panelContent"></div>
  </aside>
</div>

<!-- 弹窗容器 -->
<div id="modalContainer"></div>
<!-- Toast容器 -->
<div id="toastContainer"></div>

<script>
// ============================================================
// 《溯》电子族谱应用 - Demo演示版 核心引擎
// ============================================================

// ============ 工具函数 ============
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const genId = () => 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
const formatDate = (d) => d ? new Date(d).toLocaleDateString('zh-CN') : '未知';

// ============ Toast ============
function showToast(msg, type='info') {
  const container = $('#toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => { el.remove(); }, 2500);
}

// ============ Session管理 ============
function getSessionId() {
  let sid = localStorage.getItem('suo_session_id');
  if (!sid) { sid = 'SESS_' + Date.now() + '_' + Math.random().toString(36).substr(2,8); localStorage.setItem('suo_session_id', sid); }
  return sid;
}
const SESSION_ID = getSessionId();
$('#sessionIdDisplay').textContent = SESSION_ID.slice(-12);

// ============ 数据模型层 (DataManager) ============
// 所有数据存储于 localStorage，包含完整的预留字段
class DataManager {
  constructor() {
    this.sessionId = SESSION_ID;
    this._initSeedDatabase();
    this._initDemoFamilySeeds();
  }

  // --- 通用存储 ---
  _get(key) {
    try { return JSON.parse(localStorage.getItem(`suo_${key}`)) || []; }
    catch(e) { return []; }
  }
  _set(key, data) {
    localStorage.setItem(`suo_${key}`, JSON.stringify(data));
  }

  // --- 人物节点 (persons) ---
  getPersons() { return this._get('persons'); }
  getPerson(id) { return this.getPersons().find(p => p.id === id); }
  savePerson(person) {
    const persons = this.getPersons();
    const idx = persons.findIndex(p => p.id === person.id);
    if (idx >= 0) { persons[idx] = { ...persons[idx], ...person, gmt_modified: new Date().toISOString() }; }
    else { persons.push({ ...person, gmt_create: new Date().toISOString(), gmt_modified: new Date().toISOString(), is_deleted: 0 }); }
    this._set('persons', persons);
    return person;
  }
  deletePerson(id) {
    let persons = this.getPersons();
    const idx = persons.findIndex(p => p.id === id);
    if (idx >= 0) { persons[idx].is_deleted = 1; persons[idx].gmt_modified = new Date().toISOString(); }
    this._set('persons', persons);
    // 同时删除相关关系
    let rels = this.getRelations();
    rels = rels.filter(r => r.person_a !== id && r.person_b !== id);
    this._set('relations', rels);
  }

  // --- 关系表 (relations) ---
  getRelations() { return this._get('relations'); }
  saveRelation(rel) {
    const rels = this.getRelations();
    // 避免重复
    const exists = rels.find(r => r.person_a === rel.person_a && r.person_b === rel.person_b && r.relation_type === rel.relation_type);
    if (exists) return exists;
    const newRel = {
      id: genId(), ...rel,
      relation_verify_status: '待考证', // 预留字段
      gmt_create: new Date().toISOString(), gmt_modified: new Date().toISOString(), is_deleted: 0
    };
    rels.push(newRel);
    this._set('relations', rels);
    return newRel;
  }
  deleteRelation(id) {
    let rels = this.getRelations();
    rels = rels.filter(r => r.id !== id);
    this._set('relations', rels);
  }
  getRelationsForPerson(personId) {
    return this.getRelations().filter(r => (r.person_a === personId || r.person_b === personId) && !r.is_deleted);
  }
  // 获取某人的所有亲属
  getRelatives(personId) {
    const rels = this.getRelationsForPerson(personId);
    const persons = this.getPersons();
    return rels.map(r => {
      const otherId = r.person_a === personId ? r.person_b : r.person_a;
      const other = persons.find(p => p.id === otherId);
      return { relation: r, person: other, direction: r.person_a === personId ? 'out' : 'in' };
    }).filter(x => x.person && !x.person.is_deleted);
  }

  // --- 线索表 (clues) ---
  getClues() { return this._get('clues'); }
  saveClue(clue) {
    const clues = this.getClues();
    const exists = clues.find(c => c.source_person_id === clue.source_person_id && c.target_person_id === clue.target_person_id);
    if (exists) return exists;
    const newClue = {
      id: genId(), ...clue,
      conflict_flag: 0, // 预留字段
      arbitration_result: null,
      evidence_urls: [],
      matched_branch_overview: { ancestor_name: clue.target_name || '', location: clue.target_location || '' },
      gmt_create: new Date().toISOString(), gmt_modified: new Date().toISOString(), is_deleted: 0
    };
    clues.push(newClue);
    this._set('clues', clues);
    return newClue;
  }
  updateClue(id, updates) {
    const clues = this.getClues();
    const idx = clues.findIndex(c => c.id === id);
    if (idx >= 0) { clues[idx] = { ...clues[idx], ...updates, gmt_modified: new Date().toISOString() }; this._set('clues', clues); }
  }

  // --- 建联请求表 (connection_requests) ---
  getRequests() { return this._get('requests'); }
  saveRequest(req) {
    const requests = this.getRequests();
    const newReq = {
      id: genId(), ...req,
      request_channel: 'AI线索', // 预留字段
      review_deadline: null,
      auto_reject_flag: 0,
      gmt_create: new Date().toISOString(), gmt_modified: new Date().toISOString(), is_deleted: 0
    };
    requests.push(newReq);
    this._set('requests', requests);
    return newReq;
  }
  updateRequest(id, updates) {
    const requests = this.getRequests();
    const idx = requests.findIndex(r => r.id === id);
    if (idx >= 0) { requests[idx] = { ...requests[idx], ...updates, gmt_modified: new Date().toISOString() }; this._set('requests', requests); }
  }

  // --- 寻亲档案 (missing_person_records) ---
  getMissingRecords() { return this._get('missing_records'); }
  saveMissingRecord(record) {
    const records = this.getMissingRecords();
    const newRec = {

// ============ 匹配引擎 (MatchingEngine) ============
class MatchingEngine {
  // 计算两个人物节点的匹配得分
  static matchScore(personA, personB) {
    let score = 0;
    let total = 0;

    // 1. 姓名匹配 (拼音模糊，这里简化为姓氏+名字字符匹配)
    total += 40;
    if (personA.name && personB.name) {
      const aName = personA.name;
      const bName = personB.name;
      if (aName === bName) score += 40;
      else if (aName[0] === bName[0] && aName.length >= 2 && bName.length >= 2 && aName.slice(1) === bName.slice(1)) score += 38;
      else if (aName[0] === bName[0]) score += 20;
      else {
        // 检查名字部分是否有重合
        const aGiven = aName.slice(1);
        const bGiven = bName.slice(1);
        let charMatch = 0;
        for (const c of aGiven) { if (bGiven.includes(c)) charMatch++; }
        score += Math.min(charMatch * 10, 20);
      }
    }

    // 2. 出生地匹配 (行政区划包含关系)
    total += 35;
    if (personA.birth_place && personB.birth_place) {
      const a = personA.birth_place;
      const b = personB.birth_place;
      if (a === b) score += 35;
      else if (a.includes(b) || b.includes(a)) score += 25;
      else {
        // 提取省份匹配
        const aProv = a.slice(0, 2);
        const bProv = b.slice(0, 2);
        if (aProv === bProv) score += 15;
        else score += 5;
      }
    }

    // 3. 生卒年匹配 (正负15年窗口)
    total += 25;
    const aBirth = parseInt(personA.birth_year) || 0;
    const bBirth = parseInt(personB.birth_year) || 0;
    if (aBirth > 0 && bBirth > 0) {
      const diff = Math.abs(aBirth - bBirth);
      if (diff <= 5) score += 25;
      else if (diff <= 10) score += 18;
      else if (diff <= 15) score += 10;
      else if (diff <= 30) score += 5;
    }

    return total > 0 ? Math.round((score / total) * 100) : 0;
  }

  // 对当前会话中的人物与种子库进行匹配
  static runMatching() {
    const myPersons = DM.getPersons().filter(p => !p.is_deleted);
    const seedPersons = DM.getSeedPersons();
    const existingClues = DM.getClues();
    const newClues = [];

    for (const myP of myPersons) {
      for (const seedP of seedPersons) {
        const score = this.matchScore(myP, seedP);
        if (score >= 80) {
          // 检查是否已有线索
          const exists = existingClues.find(c =>
            c.source_person_id === myP.id && c.target_person_id === seedP.id
          );
          if (!exists) {
            const clue = DM.saveClue({
              source_person_id: myP.id,
              target_person_id: seedP.id,
              target_name: seedP.name,
              target_location: seedP.birth_place,
              target_birth_year: seedP.birth_year,
              match_score: score,
              status: '待处理'
            });
            newClues.push(clue);
          }
        }
      }
    }
    return newClues;
  }
}

// ============ 搜索引擎 (SearchEngine) ============
class SearchEngine {
  // 碎片关键词模糊搜索
  static fuzzySearch(keywords) {
    const parts = keywords.split(/[,，\s]+/).filter(Boolean);
    const myPersons = DM.getPersons().filter(p => !p.is_deleted);
    const seedPersons = DM.getSeedPersons();
    const allPersons = [...myPersons, ...seedPersons];

    const results = [];
    for (const p of allPersons) {
      let score = 0;
      const searchStr = `${p.name || ''} ${p.birth_year || ''} ${p.birth_place || ''} ${p.current_location || ''} ${p.biography || ''}`;
      for (const part of parts) {
        if (searchStr.includes(part)) score += 30;
        else if (p.name && p.name.includes(part)) score += 25;
        else if (p.birth_place && p.birth_place.includes(part)) score += 20;
        else if (p.birth_year && String(p.birth_year).includes(part)) score += 20;
        else score += 5;
      }
      if (score > 0) {
        results.push({ person: p, score, source: p.id.startsWith('seed_') ? '种子库' : '我的家族' });
      }
    }
    results.sort((a, b) => b.score - a.score);
    return results.slice(0, 20);
  }

  // BFS最短路径查找
  static findPath(fromId, toId) {
    if (fromId === toId) return [fromId];
    const rels = DM.getRelations().filter(r => !r.is_deleted);
    // 构建邻接表
    const adj = {};
    for (const r of rels) {
      if (!adj[r.person_a]) adj[r.person_a] = [];
      if (!adj[r.person_b]) adj[r.person_b] = [];
      adj[r.person_a].push({ to: r.person_b, type: r.relation_type, direction: 'a_to_b' });
      adj[r.person_b].push({ to: r.person_a, type: r.relation_type, direction: 'b_to_a' });
    }
    // BFS
    const visited = new Set();
    const queue = [[fromId]];
    visited.add(fromId);
    while (queue.length > 0) {
      const path = queue.shift();
      const current = path[path.length - 1];
      if (current === toId) return path;
      const neighbors = adj[current] || [];
      for (const nb of neighbors) {
        if (!visited.has(nb.to)) {
          visited.add(nb.to);
          queue.push([...path, nb.to]);
        }
      }
    }
    return null;
  }

  // 获取路径上的关系描述
  static describePath(path) {
    if (!path || path.length < 2) return [];
    const rels = DM.getRelations();
    const persons = DM.getPersons().concat(DM.getSeedPersons());
    const steps = [];
    for (let i = 0; i < path.length - 1; i++) {
      const a = persons.find(p => p.id === path[i]);
      const b = persons.find(p => p.id === path[i + 1]);
      const rel = rels.find(r =>
        (r.person_a === path[i] && r.person_b === path[i + 1]) ||
        (r.person_a === path[i + 1] && r.person_b === path[i])
      );
      const typeMap = { 'parent': '父/母', 'child': '子女', 'spouse': '配偶', 'sibling': '兄弟' };
      steps.push({
        from: a?.name || '未知',
        to: b?.name || '未知',
        relation: rel ? (typeMap[rel.relation_type] || rel.relation_type) : '推测关联'
      });
    }
    return steps;
  }
}

// ============ 寻亲匹配引擎 ============
class MissingPersonMatcher {
  static match(record) {
    const myPersons = DM.getPersons().filter(p => !p.is_deleted);
    const seedPersons = DM.getSeedPersons();
    const allPersons = [...myPersons, ...seedPersons];

    const results = [];
    const recYear = parseInt(record.birth_year_approx) || 0;
    const recLoc = record.missing_location || '';
    const recFeatures = record.landscape_features || '';

    for (const p of allPersons) {
      let score = 0;
      // 年份匹配
      const pBirth = parseInt(p.birth_year) || 0;
      if (recYear > 0 && pBirth > 0) {
        const diff = Math.abs(recYear - pBirth);
        if (diff <= 3) score += 40;
        else if (diff <= 10) score += 25;
        else if (diff <= 20) score += 10;
      }
      // 地名匹配
      if (recLoc && p.birth_place) {
        if (p.birth_place.includes(recLoc.slice(0,2)) || recLoc.includes(p.birth_place.slice(0,2))) score += 30;
        else if (p.birth_place.includes(recLoc.slice(0,1))) score += 15;
      }
      // 特征匹配
      if (recFeatures && p.biography) {
        const featWords = recFeatures.split(/[，,。\s]+/).filter(Boolean);
        for (const w of featWords) {
          if (p.biography.includes(w)) score += 10;
        }
      }
      if (score > 20) {
        results.push({ person: p, score });
      }
    }
    results.sort((a, b) => b.score - a.score);
    return results.slice(0, 5);
  }
}

// ============ 树渲染器 (TreeRenderer) ============
class TreeRenderer {
  constructor() {
    this.canvas = $('#canvasInner');
    this.svg = $('#connectionsSvg');
    this.container = $('#canvasContainer');
    this.scale = 1;
    this.offsetX = 0;
    this.offsetY = 0;
    this.isDragging = false;
    this.dragStartX = 0;
    this.dragStartY = 0;
    this.dragOffsetX = 0;
    this.dragOffsetY = 0;
    this.selectedNodeId = null;
    this.nodeWidth = 150;
    this.nodeHeight = 130;
    this.hGap = 200;
    this.vGap = 180;
    this._initDrag();
  }

  _initDrag() {
    this.container.addEventListener('mousedown', (e) => {
      if (e.target.closest('.tree-node')) return;
      this.isDragging = true;
      this.dragStartX = e.clientX;
      this.dragStartY = e.clientY;
      this.dragOffsetX = this.offsetX;
      this.dragOffsetY = this.offsetY;
      this.container.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', (e) => {
      if (!this.isDragging) return;
      this.offsetX = this.dragOffsetX + (e.clientX - this.dragStartX);
      this.offsetY = this.dragOffsetY + (e.clientY - this.dragStartY);
      this._applyTransform();
    });
    window.addEventListener('mouseup', () => {
      this.isDragging = false;
      this.container.style.cursor = 'default';
    });
    this.container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      const newScale = Math.max(0.3, Math.min(2, this.scale * delta));
      // 以鼠标位置为中心缩放
      const rect = this.container.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      this.offsetX = mx - (mx - this.offsetX) * (newScale / this.scale);
      this.offsetY = my - (my - this.offsetY) * (newScale / this.scale);
      this.scale = newScale;
      this._applyTransform();
    });
  }

  _applyTransform() {
    this.canvas.style.transform = `translate(${this.offsetX}px, ${this.offsetY}px) scale(${this.scale})`;
  }

  // 计算树的布局
  _computeLayout() {
    const persons = DM.getPersons().filter(p => !p.is_deleted);
    const rels = DM.getRelations().filter(r => !r.is_deleted);
    if (persons.length === 0) return [];

    // 构建关系映射
    const childrenMap = {}; // parentId -> [childId, ...]
    const parentMap = {};   // childId -> parentId
    const spouseMap = {};   // personId -> [spouseId, ...]

    rels.forEach(r => {
      if (r.relation_type === 'parent') {
        if (!childrenMap[r.person_a]) childrenMap[r.person_a] = [];
        childrenMap[r.person_a].push(r.person_b);
        parentMap[r.person_b] = r.person_a;
      } else if (r.relation_type === 'child') {
        if (!childrenMap[r.person_b]) childrenMap[r.person_b] = [];
        childrenMap[r.person_b].push(r.person_a);
        parentMap[r.person_a] = r.person_b;
      } else if (r.relation_type === 'spouse') {
        if (!spouseMap[r.person_a]) spouseMap[r.person_a] = [];
        if (!spouseMap[r.person_b]) spouseMap[r.person_b] = [];
        spouseMap[r.person_a].push(r.person_b);
        spouseMap[r.person_b].push(r.person_a);
      }
    });

    // 标记配偶关系对（确保配偶在同一层级）
    const spousePairs = new Map(); // personId -> partnerId
    Object.entries(spouseMap).forEach(([pid, spIds]) => {
      spIds.forEach(sid => {
        if (!spousePairs.has(pid) && !spousePairs.has(sid)) {
          spousePairs.set(pid, sid);
        }
      });
    });

    // Step 1: BFS 计算层级（配偶共享同一层级）
    const levels = {};
    const roots = persons.filter(p => !parentMap[p.id]);
    if (roots.length === 0) roots.push(persons[0]);

    const queue = [];
    roots.forEach(root => {
      levels[root.id] = 0;
      queue.push(root.id);
      // 配偶也设为同一层级
      const partnerId = spousePairs.get(root.id);
      if (partnerId && levels[partnerId] === undefined) {
        levels[partnerId] = 0;
        queue.push(partnerId);
      }
    });

    while (queue.length > 0) {
      const nodeId = queue.shift();
      const currentLevel = levels[nodeId] || 0;
      const children = childrenMap[nodeId] || [];
      children.forEach(childId => {
        if (levels[childId] === undefined) {
          levels[childId] = currentLevel + 1;
          queue.push(childId);
          // 子女的配偶也设为同一层级
          const partnerId = spousePairs.get(childId);
          if (partnerId && levels[partnerId] === undefined) {
            levels[partnerId] = currentLevel + 1;
            queue.push(partnerId);
          }
        }
      });
    }

    // 处理遗漏的节点
    persons.forEach(p => {
      if (levels[p.id] === undefined) {
        levels[p.id] = 0;
      }
    });

    // Step 2: 按层级分组
    const levelGroups = {};
    persons.forEach(p => {
      const lvl = levels[p.id] ?? 0;
      if (!levelGroups[lvl]) levelGroups[lvl] = [];
      levelGroups[lvl].push(p);
    });

    const maxLevel = Math.max(...Object.keys(levelGroups).map(Number), 0);

    // Step 3: 从上到下逐层计算 x 坐标
    const xPositions = {};
    const GAP_BETWEEN_SIBLINGS = 20;  // 同级节点间距
    const GAP_BETWEEN_GROUPS = 40;    // 不同父节点组间距

    for (let lvl = 0; lvl <= maxLevel; lvl++) {
      const nodes = levelGroups[lvl] || [];

      if (lvl === 0) {
        // 根层级：配偶挨在一起，不同根节点组之间留间距
        let cursorX = 100;
        const placed = new Set();
        const rootGroups = [];
        // 将根节点分组（配偶对视为一组）
        nodes.forEach(p => {
          if (placed.has(p.id)) return;
          const group = [p];
          placed.add(p.id);
          const partnerId = spousePairs.get(p.id);
          if (partnerId && nodes.find(n => n.id === partnerId)) {
            group.push(nodes.find(n => n.id === partnerId));
            placed.add(partnerId);
          }
          rootGroups.push(group);
        });

        rootGroups.forEach(group => {
          group.forEach((p, i) => {
            xPositions[p.id] = cursorX + i * (this.nodeWidth + GAP_BETWEEN_SIBLINGS);
          });
          cursorX += group.length * (this.nodeWidth + GAP_BETWEEN_SIBLINGS) + GAP_BETWEEN_GROUPS;
        });
      } else {
        // 非根层级：按父节点分组，子节点在父节点下方居中排列
        const parentGroups = {};
        nodes.forEach(p => {
          const parentId = parentMap[p.id];
          const key = parentId || 'no_parent';
          if (!parentGroups[key]) parentGroups[key] = [];
          parentGroups[key].push(p);
        });

        // 按父节点 x 坐标排序
        const sortedEntries = Object.entries(parentGroups).sort((a, b) => {
          if (a[0] === 'no_parent') return 1;
          if (b[0] === 'no_parent') return -1;
          return (xPositions[a[0]] || 0) - (xPositions[b[0]] || 0);
        });

        let cursorX = 100;
        for (const [parentId, children] of sortedEntries) {
          if (parentId === 'no_parent') {
            children.forEach(p => {
              xPositions[p.id] = cursorX;
              cursorX += this.nodeWidth + GAP_BETWEEN_SIBLINGS;
            });
          } else {
            // 子女与配偶混合排列
            const childGroups = [];
            const placed = new Set();
            children.forEach(p => {
              if (placed.has(p.id)) return;
              const group = [p];
              placed.add(p.id);
              const partnerId = spousePairs.get(p.id);
              if (partnerId && children.find(c => c.id === partnerId)) {
                group.push(children.find(c => c.id === partnerId));
                placed.add(partnerId);
              }
              childGroups.push(group);
            });

            // 计算子女组的总宽度
            const totalChildrenWidth = childGroups.reduce((sum, g) => {
              return sum + g.length * (this.nodeWidth + GAP_BETWEEN_SIBLINGS);
            }, 0) - (childGroups.length > 0 ? GAP_BETWEEN_SIBLINGS : 0);

            const parentX = xPositions[parentId] || cursorX;
            // 子女组居中于父节点
            let startX = parentX + this.nodeWidth / 2 - totalChildrenWidth / 2;
            // 确保不与其他组重叠
            startX = Math.max(cursorX, startX);

            childGroups.forEach(group => {
              group.forEach((p, i) => {
                xPositions[p.id] = startX + i * (this.nodeWidth + GAP_BETWEEN_SIBLINGS);
              });
              startX += group.length * (this.nodeWidth + GAP_BETWEEN_SIBLINGS);
            });
            cursorX = Math.max(cursorX, startX + GAP_BETWEEN_GROUPS);
          }
        }
      }
    }

    // Step 4: 构建布局数组
    const layout = [];
    persons.forEach(p => {
      layout.push({
        id: p.id,
        x: xPositions[p.id] || 100,
        y: 80 + (levels[p.id] ?? 0) * this.vGap,
        name: p.name,
        gender: p.gender
      });
    });

    return layout;
  }

  // 渲染整个树
  render() {
    const layout = this._computeLayout();
    const persons = DM.getPersons().filter(p => !p.is_deleted);
    const rels = DM.getRelations().filter(r => !r.is_deleted);
    const mergedNodeIds = this._getMergedNodeIds();

    // 清除旧节点
    const existingNodes = this.canvas.querySelectorAll('.tree-node');
    existingNodes.forEach(n => n.remove());

    // 创建新节点
    const layoutMap = {};
    layout.forEach(l => { layoutMap[l.id] = l; });

    // 确保所有有关系的节点都在布局中
    const allNodeIds = new Set(persons.map(p => p.id));
    const layoutIds = new Set(layout.map(l => l.id));
    let extraY = 500;
    allNodeIds.forEach(id => {
      if (!layoutIds.has(id)) {
        const p = persons.find(pp => pp.id === id);
        layout.push({ id, x: 100, y: extraY, name: p?.name, gender: p?.gender });
        layoutMap[id] = { id, x: 100, y: extraY, name: p?.name, gender: p?.gender };
        extraY += this.vGap;
      }
    });

    // 渲染节点DOM
    layout.forEach(l => {
      const p = persons.find(pp => pp.id === l.id);
      if (!p) return;
      const node = document.createElement('div');
      node.className = 'tree-node';
      if (l.id === this.selectedNodeId) node.classList.add('selected');
      if (mergedNodeIds.has(l.id)) node.classList.add('merged-highlight');
      node.style.left = l.x + 'px';
      node.style.top = l.y + 'px';
      node.dataset.personId = l.id;
      const avatarClass = p.gender === '女' ? 'female' : '';
      node.innerHTML = `
        <div class="node-avatar ${avatarClass}">${p.name ? p.name[0] : '?'}</div>
        <div class="node-name">${p.name || '未命名'}</div>
        <div class="node-info">${p.birth_year || ''}${p.death_year ? ' - ' + p.death_year : ''} ${p.gender || ''}</div>
        <div class="node-info">${p.birth_place || ''}</div>
        <div class="node-actions">
          <button title="添加父母" onclick="event.stopPropagation();addRelative('${l.id}','parent')">↑</button>
          <button title="添加配偶" onclick="event.stopPropagation();addRelative('${l.id}','spouse')">💍</button>
          <button title="添加子女" onclick="event.stopPropagation();addRelative('${l.id}','child')">↓</button>
          <button title="删除" onclick="event.stopPropagation();deleteNode('${l.id}')">✕</button>
        </div>
      `;
      node.addEventListener('click', () => this.selectNode(l.id));
      this.canvas.appendChild(node);
    });

    // 渲染连线
    this._renderConnections(layoutMap, mergedNodeIds);
    // 更新左侧列表
    this._updateNodeList();
  }

  _getMergedNodeIds() {
    const requests = DM.getRequests().filter(r => r.status === '已同意' && r.merged);
    const ids = new Set();
    requests.forEach(r => {
      if (r.merged_node_ids) {
        r.merged_node_ids.forEach(id => ids.add(id));
      }
    });
    return ids;
  }

  _renderConnections(layoutMap, mergedNodeIds) {
    const rels = DM.getRelations().filter(r => !r.is_deleted);
    let svgContent = '';
    rels.forEach(r => {
      const a = layoutMap[r.person_a];
      const b = layoutMap[r.person_b];
      if (!a || !b) return;
      const x1 = a.x + this.nodeWidth / 2;
      const y1 = a.y + this.nodeHeight / 2;
      const x2 = b.x + this.nodeWidth / 2;
      const y2 = b.y + this.nodeHeight / 2;
      const isMerged = mergedNodeIds.has(r.person_a) || mergedNodeIds.has(r.person_b);
      const lineClass = isMerged ? 'merged-line' : '';
      const typeLabels = { 'parent': '父母', 'child': '子女', 'spouse': '配偶', 'sibling': '兄弟' };
      const midX = (x1 + x2) / 2;
      const midY = (y1 + y2) / 2;
      svgContent += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${lineClass}" />`;
      svgContent += `<text x="${midX}" y="${midY - 6}" text-anchor="middle">${typeLabels[r.relation_type] || r.relation_type}</text>`;
    });
    this.svg.innerHTML = svgContent;
  }

  _updateNodeList() {
    const persons = DM.getPersons().filter(p => !p.is_deleted);
    const list = $('#nodeList');
    list.innerHTML = persons.map(p => `
      <div class="node-item ${p.id === this.selectedNodeId ? 'selected' : ''}" onclick="treeRenderer.selectNode('${p.id}')">
        <div class="avatar">${p.name ? p.name[0] : '?'}</div>
        <div class="info">
          <div class="name">${p.name || '未命名'}</div>
          <div class="detail">${p.gender || ''} · ${p.birth_year || ''} · ${p.birth_place || ''}</div>
        </div>
      </div>
    `).join('');
    if (persons.length === 0) {
      list.innerHTML = '<div style="text-align:center;color:var(--text-light);padding:40px 20px;">暂无家族成员<br><br>点击上方按钮添加根节点</div>';
    }
  }

  selectNode(id) {
    this.selectedNodeId = id;
    this.render();
    // 更新右侧详情面板
    App.showPersonDetail(id);
    // 切换右侧tab到详情
    $$('#rightPanel .panel-tabs button').forEach(b => b.classList.remove('active'));
    $$('#rightPanel .panel-tabs button')[0]?.classList.add('active');
  }

  zoomIn() { this.scale = Math.min(2, this.scale * 1.2); this._applyTransform(); }
  zoomOut() { this.scale = Math.max(0.3, this.scale * 0.8); this._applyTransform(); }
  resetView() {
    this.scale = 1;
    this.offsetX = 50;
    this.offsetY = 50;
    this._applyTransform();
  }
}

// ============ 全局树渲染器实例 ============
const treeRenderer = new TreeRenderer();

// ============ 应用控制器 (App) ============
class App {
  static currentPage = 'tree';
  static currentTab = 'detail';

  static init() {
    this._initNavigation();
    this._initRightPanel();
    treeRenderer.render();
    treeRenderer.resetView();
  }

  // --- 导航 ---
  static _initNavigation() {
    $$('.navbar .nav-links button').forEach(btn => {
      btn.addEventListener('click', () => {
        const page = btn.dataset.page;
        this.navigateTo(page);
      });
    });
  }

  static navigateTo(page) {
    this.currentPage = page;
    // 更新导航按钮状态
    $$('.navbar .nav-links button').forEach(b => b.classList.remove('active'));
    const activeBtn = document.querySelector(`.navbar .nav-links button[data-page="${page}"]`);
    if (activeBtn) activeBtn.classList.add('active');

    // 所有占位页面（核心功能 + 安全合规 + 外部对接）
    const placeholderPages = [
      'export', 'memorial', 'security', 'cemetery', 'digital-human',
      'face-verify', 'clue-square', 'fraud-intercept', 'watermark',
      'rate-limit', 'external-api', 'dna-match'
    ];
    if (placeholderPages.includes(page)) {
      this._showPlaceholder(page);
      return;
    }

    // 恢复主界面
    $('#mainContainer').style.display = 'flex';
    const existingPlaceholder = $('#placeholderPage');
    if (existingPlaceholder) existingPlaceholder.remove();

    if (page === 'tree') {
      treeRenderer.render();
    } else if (page === 'matching') {
      this.showMatching();
    } else if (page === 'search') {
      this.showSearch();
    } else if (page === 'missing') {
      this.showMissingPerson();
    }
  }

  static _showPlaceholder(page) {
    const pageConfig = {
      'export':           { name: '族谱导出', icon: '📄', desc: '支持PDF/Word格式导出，可自定义模板样式与导出范围', api: '/api/export/create' },
      'memorial':         { name: '故人纪念 · 音容犹在', icon: '🕯️', desc: 'AI数字人克隆、语音训练及实时对话推理', api: '/api/digital-human/create' },
      'security':         { name: '安全设置', icon: '🔒', desc: '账号安全、人脸认证、活体检测等安全功能', api: '/api/auth/face-verify' },
      'cemetery':         { name: '坟茔地图 · 入土为安', icon: '🪦', desc: '坟茔坐标选点、导航路径富文本编辑、家族共享维护', api: '/api/cemetery/locate' },
      'digital-human':    { name: 'AI数字人克隆', icon: '🤖', desc: '基于大模型的数字人克隆、语音训练及实时对话推理；数字人版权验证与多人授权创建', api: '/api/digital-human/chat' },
      'face-verify':      { name: '人脸认证 · 活体检测', icon: '👤', desc: '活体检测与人脸OCR认证交互流程', api: '/api/auth/face-verify' },
      'clue-square':      { name: '线索广场', icon: '🏛️', desc: '公开帖子发布与评论认领机制', api: '/api/clue-square/posts' },
      'fraud-intercept':  { name: '反诈拦截 · NLP风控', icon: '🛡️', desc: 'NLP诈骗话术特征库拦截及强安全提示弹窗', api: '/api/risk/fraud-check' },
      'watermark':        { name: '数字水印 · 截图溯源', icon: '🔏', desc: '数字水印实时叠加与截图溯源解析', api: '/api/root/watermark/generate' },
      'rate-limit':       { name: '高频熔断 · 异常检测', icon: '⚡', desc: '高频查询熔断与批量关联检测的自动触发逻辑；异地设备登录二次验证', api: '/api/risk/rate-limit' },
      'external-api':     { name: '公益机构API对接', icon: '🤝', desc: '公益机构API真实外呼；ExternalPlatformAdapter适配器切换', api: '/api/commonweal/external/submit' },
      'dna-match':        { name: 'DNA数据回传比对', icon: '🧬', desc: 'DNA数据回传与比对匹配', api: '/api/commonweal/dna/match' },
    };
    const cfg = pageConfig[page] || { name: page, icon: '🚧', desc: '该功能正在开发中，敬请期待...', api: '/api/' };
    const existing = $('#placeholderPage');
    if (existing) existing.remove();
    $('#mainContainer').style.display = 'none';
    const div = document.createElement('div');
    div.id = 'placeholderPage';
    div.className = 'placeholder-page';
    div.innerHTML = `
      <div class="icon">${cfg.icon}</div>
      <h2>${cfg.name}</h2>
      <p style="max-width:400px;text-align:center;">${cfg.desc}</p>
      <div style="margin-top:8px;padding:8px 16px;background:#faf6ef;border-radius:6px;font-size:12px;color:var(--text-light);">
        接口预留: <code>${cfg.api}</code> → 返回 501 Not Implemented
      </div>
      <div style="font-size:11px;color:var(--text-light);margin-top:4px;">
        响应格式: <code>{code: 501, data: {}, msg: "功能开发中", timestamp: "..."}</code>
      </div>
      <button class="btn btn-gold" onclick="App.navigateTo('tree')">返回家族树</button>
    `;
    document.body.appendChild(div);
  }

  // --- 右侧面板 ---
  static _initRightPanel() {
    $$('#rightPanel .panel-tabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        this.currentTab = tab;
        $$('#rightPanel .panel-tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        this._renderPanelContent(tab);
      });
    });
    this._renderPanelContent('detail');
  }

  static _renderPanelContent(tab) {
    const container = $('#panelContent');
    if (tab === 'detail') {
      this.showPersonDetail(treeRenderer.selectedNodeId);
    } else if (tab === 'clues') {
      this.showClues();
    } else if (tab === 'requests') {
      this.showRequests();
    }
  }

  // --- 人物详情 ---
  static showPersonDetail(personId) {
    const container = $('#panelContent');
    if (!personId) {
      container.innerHTML = '<div style="text-align:center;color:var(--text-light);padding:40px;">点击画布中的节点<br>查看详情</div>';
      return;
    }
    const p = DM.getPerson(personId);
    if (!p) { container.innerHTML = '<div style="text-align:center;color:var(--text-light);padding:40px;">节点不存在</div>'; return; }

    container.innerHTML = `
      <h3 style="margin-bottom:16px;">${p.name || '未命名'} 的详情</h3>
      <div class="form-group">
        <label>姓名</label>
        <input type="text" id="editName" value="${p.name || ''}" onchange="App.updatePersonField('${personId}','name',this.value)">

  // --- 发起建联 ---
  static initiateConnection(clueId) {
    const clue = DM.getClues().find(c => c.id === clueId);
    if (!clue) return;
    const person = DM.getPerson(clue.source_person_id);
    if (!person) return;

    showModal(`
      <div class="modal-header">
        <span>发起家族建联</span>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <p style="margin-bottom:12px;">与 <strong>${clue.target_name}</strong> (${clue.target_location}, 约${clue.target_birth_year}年) 建联</p>
        <p style="margin-bottom:12px;font-size:12px;color:var(--text-light);">通过节点: <strong>${person.name}</strong> · 匹配度: ${clue.match_score}%</p>
        <div class="form-group">
          <label>留言（可选）</label>
          <textarea id="connectionMsg" placeholder="向对方介绍您的家族背景..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal()">取消</button>
        <button class="btn btn-gold" onclick="App.submitConnection('${clueId}')">发送申请</button>
      </div>
    `);
  }

  static submitConnection(clueId) {
    const clue = DM.getClues().find(c => c.id === clueId);
    if (!clue) return;
    const msg = $('#connectionMsg')?.value || '';

    DM.saveRequest({
      clue_id: clueId,
      from_session_id: SESSION_ID,
      to_session_id: 'seed_system', // 种子库系统账号
      from_person_id: clue.source_person_id,
      to_person_id: clue.target_person_id,
      message: msg,
      status: '待处理'
    });
    DM.updateClue(clueId, { status: '已建联' });
    closeModal();
    showToast('建联申请已发送！', 'success');
    this.showRequests();
  }

  static handleRequest(requestId, action) {
    const req = DM.getRequests().find(r => r.id === requestId);
    if (!req) return;

    if (action === '同意') {
      DM.updateRequest(requestId, { status: '已同意', merged: true });
      // 合并：创建关系，将请求方的节点关联到目标节点
      // 获取请求方的人
      const fromPerson = DM.getPerson(req.from_person_id);
      const clue = DM.getClues().find(c => c.id === req.clue_id);
      if (fromPerson && clue) {
        // 创建一个虚拟的合并节点（代表种子库中的祖先）
        const mergedNode = DM.savePerson({
          id: genId(),
          name: clue.target_name,
          gender: '男',
          birth_year: clue.target_birth_year,
          birth_place: clue.target_location,
          current_location: clue.target_location,
          biography: '来自明清进士世家种子库的匹配祖先',
          photo_url: null,
          privacy_level: 3,
          is_public: true,
          digital_twin_status: 0,
          voice_corpus_url: null,
          grave_longitude: null,
          grave_latitude: null,
          grave_description: null
        });
        // 创建关系
        DM.saveRelation({
          person_a: fromPerson.id,
          person_b: mergedNode.id,
          relation_type: 'parent'
        });
        // 记录合并节点ID
        DM.updateRequest(requestId, { merged_node_ids: [mergedNode.id] });
        treeRenderer.render();
        showToast('家族树合并成功！合并节点已用金色高亮标记', 'success');
      }
    } else {
      DM.updateRequest(requestId, { status: '已拒绝' });
      showToast('已拒绝该建联申请', 'info');
    }
    this.showRequests();
  }

  static removeRelation(relId) {
    DM.deleteRelation(relId);
    treeRenderer.render();
    if (treeRenderer.selectedNodeId) this.showPersonDetail(treeRenderer.selectedNodeId);
    showToast('关系已解除', 'info');
  }

  static doSearch() {
    const keywords = $('#searchInput')?.value?.trim();
    if (!keywords) { showToast('请输入搜索关键词', 'error'); return; }

    // 记录查询日志（预留字段）
    DM.saveQueryLog({
      query_keywords: keywords,
      query_intent: $('#searchIntent')?.value || '',
      query_scenario: $('#searchPurpose')?.value || '',
      session_id: SESSION_ID
    });

    const results = SearchEngine.fuzzySearch(keywords);
    const resultsDiv = $('#searchResults');
    if (results.length === 0) {
      resultsDiv.innerHTML = '<p style="color:var(--text-light);text-align:center;padding:20px;">未找到匹配结果</p>';
      return;
    }
    resultsDiv.innerHTML = `
      <h4 style="margin-bottom:8px;">搜索结果 (${results.length})</h4>
      ${results.map(r => `
        <div class="search-result-item" onclick="App.showPathTo('${r.person.id}')">
          <div style="display:flex;justify-content:space-between;">
            <strong>${r.person.name}</strong>
            <span style="font-size:11px;color:var(--text-light);">${r.source}</span>
          </div>
          <div style="font-size:12px;color:var(--text-light);">
            ${r.person.birth_year || ''} · ${r.person.birth_place || ''} · 匹配度: ${r.score}
          </div>
        </div>
      `).join('')}
    `;
  }

  static showPathTo(targetId) {
    const targetPerson = DM.getPerson(targetId) || DM.getSeedPersons().find(p => p.id === targetId);
    if (!targetPerson) return;

    // 找到当前会话中的人物作为起点
    const myPersons = DM.getPersons().filter(p => !p.is_deleted);
    if (myPersons.length === 0) {
      showToast('请先添加家族成员', 'error');
      return;
    }

    // 尝试从每个我的节点找路径
    let bestPath = null;
    for (const mp of myPersons) {
      const path = SearchEngine.findPath(mp.id, targetId);
      if (path && (!bestPath || path.length < bestPath.length)) {
        bestPath = path;
      }
    }

    const pathDiv = $('#pathResult');
    if (bestPath) {
      const steps = SearchEngine.describePath(bestPath);
      const allPersons = DM.getPersons().concat(DM.getSeedPersons());
      pathDiv.innerHTML = `
        <h4 style="margin-bottom:8px;margin-top:16px;">关系路径</h4>
        <div class="path-graph">
          ${bestPath.map((id, i) => {
            const p = allPersons.find(pp => pp.id === id);
            const isTarget = id === targetId;
            const isMy = DM.getPersons().find(pp => pp.id === id);
            return `
              ${i > 0 ? `<div class="path-connector">↓<br><span style="font-size:10px;color:var(--text-light);">${steps[i-1]?.relation || '?'}</span></div>` : ''}
              <div class="path-node" style="${isTarget ? 'border:2px solid var(--gold);' : ''}${isMy ? 'background:var(--gold-light);' : ''}">
                ${p?.name || '未知'} ${isMy ? '(我)' : ''} ${isTarget ? '(目标)' : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
      showToast(`找到路径，共 ${bestPath.length} 步`, 'success');
    } else {
      // 如果找不到路径，生成推测路径
      pathDiv.innerHTML = `
        <h4 style="margin-bottom:8px;margin-top:16px;">推测路径（存在断层）</h4>
        <div class="path-graph">
          <div class="path-node" style="background:var(--gold-light);">${myPersons[0]?.name || '我'}</div>
          <div class="path-connector">↓<br><span style="font-size:10px;">推测</span></div>
          <div class="path-gap">? 断层节点</div>
          <div class="path-connector">↓<br><span style="font-size:10px;">推测</span></div>
          <div class="path-node" style="border:2px solid var(--gold);">${targetPerson.name} (目标)</div>
        </div>
        <p style="font-size:11px;color:var(--text-light);margin-top:8px;text-align:center;">虚线表示推测路径，中间存在未确认的断层</p>
      `;
      showToast('未找到直接路径，显示推测路径', 'info');
    }
  }

      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-gold" onclick="saveRelative('${personId}','${relationType}')">确认添加</button>
    </div>
  `);
}

function saveRelative(personId, relationType) {
  const name = $('#relPersonName')?.value?.trim();
  if (!name) { showToast('请输入姓名', 'error'); return; }

  const newPerson = DM.savePerson({
    id: genId(),
    name,
    gender: $('#relPersonGender')?.value || '',
    birth_year: $('#relPersonBirthYear')?.value || '',
    death_year: '',
    birth_place: $('#relPersonBirthPlace')?.value || '',
    current_location: '',
    biography: $('#relPersonBio')?.value || '',
    photo_url: null,
    privacy_level: 0,
    is_public: false,
    digital_twin_status: 0,
    voice_corpus_url: null,
    grave_longitude: null,
    grave_latitude: null,
    grave_description: null
  });

  // 创建关系
  DM.saveRelation({
    person_a: personId,
    person_b: newPerson.id,
    relation_type: relationType
  });

  closeModal();
  treeRenderer.render();
  treeRenderer.selectNode(newPerson.id);
  showToast('亲属添加成功！', 'success');

  // 自动触发匹配
  setTimeout(() => {
    const newClues = MatchingEngine.runMatching();
    if (newClues.length > 0) {
      showToast(`发现 ${newClues.length} 条新匹配线索！`, 'info');
    }
  }, 500);
}

function deleteNode(personId) {
  const person = DM.getPerson(personId);
  if (!person) return;
  if (!confirm(`确定要删除「${person.name}」吗？相关关系也会被删除。`)) return;
  DM.deletePerson(personId);
  treeRenderer.selectedNodeId = null;
  treeRenderer.render();
  App.showPersonDetail(null);
  showToast('节点已删除', 'info');
}

// ============ 弹窗管理 ============
function showModal(html) {
  const container = $('#modalContainer');
  container.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}

function closeModal() {
  $('#modalContainer').innerHTML = '';
}

// ============ 更多功能下拉菜单 ============
function toggleMoreDropdown(e) {
  e.stopPropagation();
  const dropdown = $('#moreDropdown');
  dropdown.classList.toggle('show');
}

// 点击外部关闭下拉菜单
document.addEventListener('click', (e) => {
  if (!e.target.closest('.more-btn')) {
    const dropdown = $('#moreDropdown');
    if (dropdown) dropdown.classList.remove('show');
  }
});

// ============ 缩放 ============
function zoomIn() { treeRenderer.zoomIn(); }
function zoomOut() { treeRenderer.zoomOut(); }
function resetView() { treeRenderer.resetView(); }

  App.init();

});
