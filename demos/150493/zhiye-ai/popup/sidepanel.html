<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智页AI - 侧边面板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #e2e8f0;
      background: #0f172a;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .sp-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .sp-logo {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    .sp-title { font-weight: 600; font-size: 15px; }
    .sp-content {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }
    .sp-content::-webkit-scrollbar { width: 6px; }
    .sp-content::-webkit-scrollbar-track { background: transparent; }
    .sp-content::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    .sp-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .sp-card-title {
      font-weight: 600;
      margin-bottom: 12px;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sp-stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .sp-stat {
      background: #0f172a;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      border: 1px solid #334155;
    }
    .sp-stat-value {
      font-size: 22px;
      font-weight: 700;
      color: #0ea5e9;
    }
    .sp-stat-label {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .sp-btn {
      width: 100%;
      padding: 10px;
      border: none;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      margin-top: 10px;
      transition: opacity 0.2s;
    }
    .sp-btn:hover { opacity: 0.9; }
    .sp-btn.secondary {
      background: #334155;
      color: #e2e8f0;
      border: 1px solid #475569;
    }
    .sp-btn.secondary:hover { background: #475569; }
    .sp-btn.danger {
      background: #991b1b;
      color: #fecaca;
      border: 1px solid #ef4444;
    }
    .sp-btn.danger:hover { background: #b91c1c; }
    .sp-list {
      list-style: none;
    }
    .sp-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #334155;
      font-size: 13px;
    }
    .sp-list li:last-child { border-bottom: none; }
    .sp-list li .li-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 180px;
      color: #e2e8f0;
    }
    .sp-list li .li-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sp-list li .li-date {
      color: #64748b;
      font-size: 11px;
    }
    .sp-list li .li-del {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 16px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .sp-list li .li-del:hover { background: #450a0a; }
    .sp-empty {
      text-align: center;
      color: #64748b;
      padding: 20px;
      font-size: 13px;
    }
    .sp-url {
      font-size: 11px;
      color: #64748b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
      margin-top: 2px;
    }
    .kb-item {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .kb-item-title {
      font-size: 13px;
      color: #e2e8f0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .kb-item-url {
      font-size: 11px;
      color: #64748b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 2px;
    }
    .kb-item-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }
    .kb-item-stats {
      font-size: 11px;
      color: #94a3b8;
    }
    .kb-item-del {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 13px;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .kb-item-del:hover { background: #450a0a; }
    .sp-tabs {
      display: flex;
      gap: 2px;
      margin-bottom: 12px;
      background: #1e293b;
      border-radius: 8px;
      padding: 4px;
    }
    .sp-tab {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      color: #94a3b8;
      transition: all 0.2s;
    }
    .sp-tab:hover { color: #e2e8f0; }
    .sp-tab.active {
      background: #0f172a;
      color: #0ea5e9;
      font-weight: 500;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
  </style>
</head>
<body>
  <div class="sp-header">
    <div class="sp-logo">智</div>
    <div class="sp-title">智页AI 管理中心</div>
  </div>

  <div class="sp-content">
    <!-- 当前页面概览 -->
    <div class="sp-card">
      <div class="sp-card-title">📊 当前页面概览</div>
      <div class="sp-stat-grid">
        <div class="sp-stat">
          <div class="sp-stat-value" id="stat-nodes">-</div>
          <div class="sp-stat-label">知识节点</div>
        </div>
        <div class="sp-stat">
          <div class="sp-stat-value" id="stat-apis">-</div>
          <div class="sp-stat-label">API数量</div>
        </div>
        <div class="sp-stat">
          <div class="sp-stat-value" id="stat-codes">-</div>
          <div class="sp-stat-label">代码块</div>
        </div>
        <div class="sp-stat">
          <div class="sp-stat-value" id="stat-type">-</div>
          <div class="sp-stat-label">文档类型</div>
        </div>
      </div>
      <button class="sp-btn" id="btn-open-ai">在当前页面打开智页AI</button>
    </div>

    <!-- 标签切换 -->
    <div class="sp-tabs">
      <button class="sp-tab active" data-tab="kb">📚 知识库</button>
      <button class="sp-tab" data-tab="ai">⚙️ AI配置</button>
    </div>

    <!-- 知识库面板 -->
    <div class="tab-panel active" id="panel-kb">
      <div class="sp-card">
        <div class="sp-card-title">
          <span>已构建知识库</span>
          <button class="sp-btn secondary" id="btn-clear-all-kb" style="width:auto;padding:6px 12px;margin:0;font-size:12px">清空全部</button>
        </div>
        <div id="kb-list">
          <div class="sp-empty">暂无数据</div>
        </div>
      </div>
    </div>

    <!-- AI配置面板 -->
    <div class="tab-panel" id="panel-ai">
      <div class="sp-card">
        <div class="sp-card-title">🤖 当前AI配置</div>
        <div id="ai-config-summary" style="font-size:13px;color:#94a3b8;margin-bottom:10px">加载中...</div>
        <button class="sp-btn secondary" id="btn-config">前往设置</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Tab切换
      document.querySelectorAll('.sp-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.sp-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
          document.getElementById(`panel-${tab.dataset.tab}`).classList.add('active');
        });
      });

      // 获取当前页面信息
      try {
        const resp = await chrome.runtime.sendMessage({ action: 'getActiveTabInfo' });
        if (resp?.success) {
          document.getElementById('stat-nodes').textContent = resp.nodeCount || 0;
          document.getElementById('stat-type').textContent = resp.isTechDoc ? '技术' : '通用';
        }
      } catch (e) {
        document.getElementById('stat-nodes').textContent = '?';
      }

      // 加载知识库列表
      loadKBList();

      // AI配置摘要
      chrome.storage.local.get('zhiye_ai_config', (data) => {
        const cfg = data?.zhiye_ai_config;
        const el = document.getElementById('ai-config-summary');
        if (cfg) {
          const hasKey = cfg.apiKey && cfg.apiKey.length > 5;
          el.innerHTML = `提供商: <b style="color:#0ea5e9">${cfg.provider}</b><br>模型: <b style="color:#0ea5e9">${cfg.model}</b><br>状态: ${hasKey ? '<span style="color:#22c55e">已配置</span>' : '<span style="color:#ef4444">未配置API Key</span>'}`;
        } else {
          el.textContent = '尚未配置AI模型';
        }
      });

      // 按钮事件
      document.getElementById('btn-open-ai').addEventListener('click', async () => {
        const tabs = await chrome.tabs.query({ active: true, currentWindow: true });
        if (tabs[0]?.id) {
          chrome.tabs.sendMessage(tabs[0].id, { action: 'openSidebar' });
        }
      });

      document.getElementById('btn-config').addEventListener('click', () => {
        chrome.runtime.openOptionsPage();
      });

      document.getElementById('btn-clear-all-kb').addEventListener('click', async () => {
        if (!confirm('确定要清空所有知识库吗？此操作不可恢复。')) return;
        await chrome.storage.local.remove('zhiye_knowledge_bases');
        loadKBList();
      });
    });

    async function loadKBList() {
      const data = await chrome.storage.local.get('zhiye_knowledge_bases');
      const kbs = data?.zhiye_knowledge_bases || {};
      const listEl = document.getElementById('kb-list');
      const entries = Object.entries(kbs).sort((a, b) => (b[1].updatedAt || 0) - (a[1].updatedAt || 0));

      if (entries.length === 0) {
        listEl.innerHTML = '<div class="sp-empty">暂无知识库数据<br>打开网页后会自动构建</div>';
        return;
      }

      listEl.innerHTML = entries.map(([url, kb]) => {
        const title = kb.docMeta?.title || url;
        const nodeCount = kb.nodes?.length || 0;
        const apiCount = kb.nodes?.filter(n => n.type === 'api').length || 0;
        const date = kb.updatedAt ? new Date(kb.updatedAt).toLocaleDateString() : '未知';
        return `
          <div class="kb-item">
            <div class="kb-item-title" title="${title}">${title}</div>
            <div class="kb-item-url" title="${url}">${url}</div>
            <div class="kb-item-meta">
              <span class="kb-item-stats">${nodeCount}节点 · ${apiCount}API · ${date}</span>
              <button class="kb-item-del" data-url="${url}" title="删除">🗑</button>
            </div>
          </div>
        `;
      }).join('');

      // 绑定删除按钮
      listEl.querySelectorAll('.kb-item-del').forEach(btn => {
        btn.addEventListener('click', async () => {
          const url = btn.dataset.url;
          if (!confirm('确定要删除这个知识库吗？')) return;
          const data = await chrome.storage.local.get('zhiye_knowledge_bases');
          const kbs = data?.zhiye_knowledge_bases || {};
          delete kbs[url];
          await chrome.storage.local.set({ zhiye_knowledge_bases: kbs });
          loadKBList();
        });
      });
    }
  </script>
</body>
</html>
