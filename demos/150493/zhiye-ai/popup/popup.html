<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智页AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="popup-logo">智</div>
      <div class="popup-title">智页AI</div>
    </div>

    <div class="popup-info" id="page-info">
      <div class="info-loading">正在获取页面信息...</div>
    </div>

    <div class="popup-actions">
      <button class="popup-btn primary" id="btn-open-sidebar">
        <span>🔍</span> 打开侧边栏
      </button>
      <button class="popup-btn" id="btn-summarize">
        <span>📝</span> 总结页面
      </button>
      <button class="popup-btn" id="btn-quick-ask">
        <span>💬</span> 快速提问
      </button>
    </div>

    <div class="popup-section">
      <div class="section-title">快捷操作</div>
      <div class="quick-asks">
        <button class="quick-ask-btn" data-q="页面有哪些核心API？">核心API</button>
        <button class="quick-ask-btn" data-q="生成一个基础示例代码">生成代码</button>
        <button class="quick-ask-btn" data-q="总结这篇文档的核心内容">总结内容</button>
      </div>
    </div>

    <div class="popup-footer">
      <a href="#" id="link-options">⚙️ 设置</a>
      <span class="version">v1.0.0</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
