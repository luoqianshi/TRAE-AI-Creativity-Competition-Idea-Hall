<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<title>像素猫咪小屋</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    font-family: 'ZCOOL QingKe HuangYou', cursive, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    image-rendering: pixelated;
  }

  #gameCanvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: pointer;
    border: 4px solid #e94560;
    border-radius: 4px;
    box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
  }

  /* 自定义面板 */
  #customizePanel {
    position: fixed;
    top: 0;
    right: -380px;
    width: 360px;
    height: 100vh;
    background: linear-gradient(180deg, #16213e 0%, #0f3460 100%);
    border-left: 4px solid #e94560;
    padding: 20px;
    transition: right 0.4s ease;
    z-index: 100;
    overflow-y: auto;
    color: #eee;
  }

  #customizePanel.open { right: 0; }

  #customizePanel h2 {
    color: #e94560;
    font-size: 22px;
    margin-bottom: 16px;
    text-align: center;

  }

  .form-group {
    margin-bottom: 14px;
  }

  .form-group label {
    display: block;
    color: #a8d8ea;
    font-size: 14px;
    margin-bottom: 6px;
  }

  .form-group input[type="text"],
  .form-group select {
    width: 100%;
    padding: 8px 12px;
    background: #1a1a2e;
    border: 2px solid #e94560;
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    border-radius: 4px;
    outline: none;
  }

  .form-group select option {
    background: #1a1a2e;
    color: #fff;
  }

  .color-options {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .color-option {
    width: 36px;
    height: 36px;
    border: 3px solid transparent;
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .color-option:hover, .color-option.selected {
    border-color: #fff;
    transform: scale(1.1);
  }

  .pattern-options {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .pattern-option {
    padding: 6px 14px;
    background: #1a1a2e;
    border: 2px solid #555;
    color: #ccc;
    font-family: inherit;
    font-size: 13px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .pattern-option:hover, .pattern-option.selected {
    border-color: #e94560;
    color: #e94560;
  }

  #applyBtn {
    width: 100%;
    padding: 12px;
    background: #e94560;
    color: #fff;
    border: none;
    font-family: inherit;
    font-size: 16px;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.2s;
  }

  #applyBtn:hover { background: #c0392b; }

  /* 切换按钮 */
  #togglePanel {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 48px;
    height: 48px;
    background: #e94560;
    border: none;
    border-radius: 50%;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    z-index: 101;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 10px rgba(233,69,96,0.4);
    transition: transform 0.3s;
  }

  #togglePanel:hover { transform: scale(1.1); }

  /* 提示气泡 */
  #speechBubble {
    position: fixed;
    padding: 8px 16px;
    background: #fff;
    color: #333;
    border-radius: 16px;
    font-size: 16px;
    font-family: inherit;
    border: 3px solid #333;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
    z-index: 50;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    white-space: nowrap;
  }

  #speechBubble::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 20px;
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 10px solid #333;
  }

  #speechBubble.show { opacity: 1; }

  /* 状态栏 */
  #statusBar {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(22, 33, 62, 0.9);
    padding: 8px 20px;
    border-radius: 20px;
    color: #a8d8ea;
    font-size: 13px;
    z-index: 50;
    border: 2px solid #0f3460;
  }

  /* 提示文字 */
  #hint {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    z-index: 50;
  }
</style>

<body>

<canvas id="gameCanvas" width="960" height="720" style="width: 1134.67px; height: 851px;"></canvas>

  <div class="form-group">

      <option value="lazy">😴 懒洋洋 - 喜欢睡觉，偶尔伸懒腰</option>
      <option value="playful">😸 调皮捣蛋 - 到处乱跑，精力旺盛</option>
      <option value="shy">😺 害羞胆小 - 喜欢躲起来，慢慢熟悉你</option>
      <option value="foodie">😋 吃货 - 满脑子都是吃</option>
      <option value="grumpy">😾 暴躁 - 别惹我，我会哈气</option>
    </select>
  </div>

  <div class="form-group">
    <label>眼睛颜色</label>
    <div class="color-options" id="eyeColorOptions">
      <div class="color-option selected" style="background:#4CAF50" data-eyecolor="green"></div>
      <div class="color-option" style="background:#2196F3" data-eyecolor="blue"></div>
      <div class="color-option" style="background:#FF9800" data-eyecolor="amber"></div>
      <div class="color-option" style="background:#9C27B0" data-eyecolor="purple"></div>
      <div class="color-option" style="background:#795548" data-eyecolor="brown"></div>
      <div class="color-option" style="background:#607D8B" data-eyecolor="gray"></div>
    </div>
  </div>

  <button id="applyBtn" onclick="applyCustomization()">✨ 应用定制</button>
</div>

<div id="speechBubble" class="" style="left: 757.941px; top: 588.307px;">别吵...</div>
<div id="statusBar">小橘 · 散步中 | 双击屏幕互动</div>

<script>
// ============================================================
// 像素猫咪小屋 - 完整游戏引擎
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const speechBubble = document.getElementById('speechBubble');
const statusBar = document.getElementById('statusBar');

// 画布尺寸
const SCALE = 3;
const W = 320;
const H = 240;
canvas.width = W * SCALE;
canvas.height = H * SCALE;
ctx.imageSmoothingEnabled = false;

// ============================================================
// 猫咪配置
// ============================================================
let catConfig = {
  name: '小橘',
  gender: 'male',
  color: 'orange',
  pattern: 'solid',
  personality: 'lazy',
  eyeColor: 'green',
};

// 颜色映射
const CAT_COLORS = {
  orange:     { body: '#f4a460', dark: '#d4884a', light: '#f8c080', belly: '#fce4b8' },
  white:      { body: '#f5f5f5', dark: '#ddd',    light: '#fff',    belly: '#fff' },
  black:      { body: '#333',    dark: '#1a1a1a', light: '#555',    belly: '#666' },
  gray:       { body: '#808080', dark: '#666',    light: '#aaa',    belly: '#bbb' },
  cream:      { body: '#f0c080', dark: '#d4a060', light: '#f8d8a0', belly: '#fff0d0' },
  brown:      { body: '#c8a882', dark: '#a08060', light: '#d8c0a0', belly: '#e8d8c0' },
  siamese:    { body: '#d4a574', dark: '#8b6914', light: '#e8c8a0', belly: '#f0dcc0' },
  russian_blue: { body: '#7088a0', dark: '#506878', light: '#90a8c0', belly: '#a0b8d0' },
};

const EYE_COLORS = {
  green: '#4CAF50', blue: '#2196F3', amber: '#FF9800',
  purple: '#9C27B0', brown: '#795548', gray: '#607D8B'
};

// ============================================================
// 猫咪状态
// ============================================================
let cat = {
  x: 160, y: 180,
  visible: false,
  state: 'idle', // idle, walking, eating, pooping, stretching, sleeping, meowing
  direction: 1, // 1=right, -1=left
  frame: 0,
  frameTimer: 0,
  stateTimer: 0,
  targetX: 0,
  targetY: 0,
  speed: 0.5,
  meowText: '',
  actionBubble: '',
  bubbleTimer: 0,
};

// ============================================================
// 房间布局定义
// ============================================================
const ROOM = {
  floorY: 80,     // 地板起始Y
  wallColor: '#f5e6d0',
  floorColor: '#c4956a',
  floorDark: '#b08060',
  ceilingColor: '#fff8f0',
};

// 家具定义（像素坐标）
const furniture = [
  // 窗户（阳台）
  { type: 'window', x: 10, y: 20, w: 80, h: 50 },
  // 阳台门
  { type: 'balcony_door', x: 95, y: 30, w: 40, h: 45 },
  // 电视柜
  { type: 'tv_stand', x: 140, y: 60, w: 60, h: 20 },
  // 电视机
  { type: 'tv', x: 152, y: 38, w: 36, h: 24 },
  // 置物架
  { type: 'shelf', x: 210, y: 35, w: 30, h: 45 },
  // 书架
  { type: 'bookshelf', x: 250, y: 30, w: 35, h: 50 },
  // 茶几
  { type: 'coffee_table', x: 100, y: 155, w: 50, h: 20 },
  // 单人摇摇沙发
  { type: 'rocker', x: 20, y: 140, w: 45, h: 40 },
  // 猫爬架
  { type: 'cat_tree', x: 270, y: 90, w: 35, h: 90 },
  // 餐桌
  { type: 'dining_table', x: 170, y: 150, w: 55, h: 25 },
  // 猫砂盆
  { type: 'litter_box', x: 15, y: 175, w: 30, h: 20 },
];

// 可行走区域
function isWalkable(x, y) {
  if (y < ROOM.floorY + 5) return false;
  if (x < 5 || x > W - 5) return false;
  if (y > H - 8) return false;
  // 避开家具（简化碰撞）
  for (let f of furniture) {
    if (f.type === 'cat_tree' || f.type === 'rocker' || f.type === 'litter_box') continue;
    if (x > f.x && x < f.x + f.w && y > f.y && y < f.y + f.h + 5) return false;
  }
  return true;
}

// ============================================================
// 像素绘制工具
// ============================================================
function px(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
}

function pxRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * SCALE, y * SCALE, w * SCALE, h * SCALE);
}

function pxLine(x1, y1, x2, y2, color) {
  ctx.fillStyle = color;
  if (y1 === y2) {
    ctx.fillRect(Math.min(x1,x2)*SCALE, y1*SCALE, (Math.abs(x2-x1)+1)*SCALE, SCALE);
  } else if (x1 === x2) {
    ctx.fillRect(x1*SCALE, Math.min(y1,y2)*SCALE, SCALE, (Math.abs(y2-y1)+1)*SCALE);
  }
}

// ============================================================
// 绘制房间
// ============================================================
function drawRoom() {
  // 天花板
  pxRect(0, 0, W, 20, ROOM.ceilingColor);
  // 墙壁
  pxRect(0, 20, W, ROOM.floorY - 20, ROOM.wallColor);

  // 墙壁纹理（横线）
  for (let y = 25; y < ROOM.floorY; y += 12) {
    pxLine(0, y, W, y, '#edd5be');
  }

  // 踢脚线
  pxRect(0, ROOM.floorY - 3, W, 3, '#8b7355');

  // 地板
  pxRect(0, ROOM.floorY, W, H - ROOM.floorY, ROOM.floorColor);

  // 地板纹理（木地板条纹）
  for (let y = ROOM.floorY; y < H; y += 8) {
    pxLine(0, y, W, y, ROOM.floorDark);
  }
  for (let x = 0; x < W; x += 40) {
    pxLine(x, ROOM.floorY, x, H, ROOM.floorDark);
  }

  // 阳台区域（窗户后面）
  pxRect(10, 20, 80, 50, '#87CEEB'); // 天空
  // 阳台栏杆
  pxRect(10, 55, 80, 3, '#ddd');
  pxRect(10, 60, 80, 2, '#bbb');
  for (let x = 15; x < 85; x += 10) {
    pxLine(x, 55, x, 62, '#ccc');
  }
  // 云朵
  pxRect(20, 25, 12, 4, '#fff');
  pxRect(50, 30, 15, 5, '#fff');
  pxRect(70, 22, 10, 3, '#fff');
  // 太阳
  pxRect(75, 24, 4, 4, '#FFD700');
  // 绿植
  pxRect(15, 50, 5, 10, '#228B22');
  pxRect(80, 48, 6, 12, '#2E8B57');
  pxRect(82, 45, 4, 5, '#228B22');

  // 阳台推拉门
  pxRect(95, 30, 40, 45, '#87CEEB');
  pxRect(95, 30, 19, 45, '#a8d8ea');
  pxRect(116, 30, 19, 45, '#9ac8dc');
  pxRect(95, 30, 40, 2, '#8b7355');
  pxRect(95, 73, 40, 2, '#8b7355');
  pxLine(114, 30, 114, 75, '#8b7355');

  drawFurniture();
}

// ============================================================
// 绘制家具
// ============================================================
function drawFurniture() {
  // === 电视机 ===
  pxRect(152, 38, 36, 24, '#222');
  pxRect(154, 40, 32, 20, '#1a3a5c');
  // 电视屏幕内容
  pxRect(156, 42, 28, 16, '#2a5a8c');
  pxRect(158, 44, 10, 6, '#4a8abc');
  pxRect(170, 46, 12, 8, '#3a7aac');
  // 电视边框
  pxRect(152, 38, 36, 1, '#444');
  pxRect(152, 38, 1, 24, '#444');
  pxRect(187, 38, 1, 24, '#444');
  pxRect(152, 61, 36, 1, '#444');
  // 电视底座
  pxRect(165, 62, 10, 2, '#333');

  // === 电视柜 ===
  pxRect(140, 65, 60, 15, '#8B6914');
  pxRect(140, 65, 60, 2, '#a07828');
  pxRect(141, 67, 28, 12, '#7a5a10');
  pxRect(171, 67, 28, 12, '#7a5a10');
  // 把手
  pxRect(153, 72, 4, 2, '#d4a020');
  pxRect(183, 72, 4, 2, '#d4a020');

  // === 置物架 ===
  pxRect(210, 35, 30, 3, '#a08060');
  pxRect(210, 50, 30, 3, '#a08060');
  pxRect(210, 65, 30, 3, '#a08060');
  pxRect(210, 80, 30, 3, '#a08060');
  // 架子支架
  pxLine(210, 35, 210, 83, '#907050');
  pxLine(239, 35, 239, 83, '#907050');
  // 架子上的物品
  // 小盆栽
  pxRect(215, 30, 8, 5, '#8B4513');
  pxRect(216, 27, 6, 4, '#228B22');
  pxRect(217, 25, 4, 3, '#32a852');
  // 相框
  pxRect(228, 44, 8, 6, '#daa520');
  pxRect(229, 45, 6, 4, '#87CEEB');
  // 书
  pxRect(212, 52, 4, 13, '#c0392b');
  pxRect(217, 54, 4, 11, '#2980b9');
  pxRect(222, 53, 4, 12, '#27ae60');
  // 小闹钟
  pxRect(230, 67, 6, 6, '#e74c3c');
  pxRect(231, 68, 4, 4, '#fff');

  // === 书架 ===
  pxRect(250, 30, 35, 50, '#6b4226');
  pxRect(252, 32, 31, 3, '#7a5230');
  pxRect(252, 42, 31, 3, '#7a5230');
  pxRect(252, 52, 31, 3, '#7a5230');
  pxRect(252, 62, 31, 3, '#7a5230');
  pxRect(252, 72, 31, 3, '#7a5230');
  // 书本
  const bookColors = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22'];
  for (let row = 0; row < 4; row++) {
    let bx = 253;
    for (let i = 0; i < 5 + Math.floor(Math.random()*2); i++) {
      let bw = 3 + Math.floor(Math.random()*3);
      let bh = 8 + Math.floor(Math.random()*3);
      pxRect(bx, 35 + row*10 - bh + 10, bw, bh, bookColors[(row*5+i) % bookColors.length]);
      bx += bw + 1;
      if (bx > 280) break;
    }
  }

  // === 单人摇摇沙发 ===
  // 沙发主体
  pxRect(20, 145, 45, 30, '#8B0000');
  pxRect(18, 140, 49, 8, '#a00');
  pxRect(18, 140, 5, 35, '#900');
  pxRect(62, 140, 5, 35, '#900');
  // 靠垫
  pxRect(22, 142, 41, 6, '#c0392b');
  // 沙发腿
  pxRect(22, 175, 3, 5, '#654321');
  pxRect(60, 175, 3, 5, '#654321');
  // 弧形底部（摇椅底座）
  pxRect(16, 180, 52, 3, '#8B4513');
  pxRect(18, 182, 48, 2, '#a0522d');
  // 小靠枕
  pxRect(30, 135, 10, 8, '#FFD700');
  pxRect(31, 136, 8, 6, '#FFA500');

  // === 茶几 ===
  pxRect(100, 158, 50, 4, '#DEB887');
  pxRect(100, 162, 50, 2, '#c8a878');
  pxRect(103, 162, 3, 12, '#b89868');
  pxRect(144, 162, 3, 12, '#b89868');
  // 茶几上的东西
  // 杯子
  pxRect(115, 153, 6, 5, '#fff');
  pxRect(116, 151, 4, 3, '#8B4513');
  // 遥控器
  pxRect(130, 155, 10, 3, '#333');

  // === 猫爬架 ===
  // 柱子
  pxRect(285, 90, 5, 100, '#8B6914');
  // 平台
  pxRect(275, 90, 25, 4, '#a08060');
  pxRect(278, 120, 22, 4, '#a08060');
  pxRect(275, 150, 25, 4, '#a08060');
  // 吊球
  pxRect(287, 100, 2, 8, '#ccc');
  pxRect(285, 107, 6, 6, '#e74c3c');
  // 绳子缠绕
  for (let y = 95; y < 185; y += 6) {
    pxRect(284, y, 7, 2, '#a08060');
  }

  // === 餐桌 ===
  pxRect(170, 155, 55, 5, '#DEB887');
  pxRect(170, 160, 55, 2, '#c8a878');
  pxRect(175, 162, 4, 18, '#b89868');
  pxRect(216, 162, 4, 18, '#b89868');
  // 桌上物品
  // 碗
  pxRect(185, 150, 8, 5, '#fff');
  pxRect(186, 149, 6, 2, '#ddd');
  // 猫粮碗
  pxRect(200, 151, 10, 4, '#e74c3c');
  pxRect(201, 150, 8, 2, '#c0392b');
  // 食物颗粒
  pxRect(203, 152, 2, 2, '#8B4513');
  pxRect(206, 152, 2, 2, '#a0522d');

// ============================================================
// 绘制猫咪
// ============================================================
function drawCat(x, y, dir, frame, state) {
  const colors = CAT_COLORS[catConfig.color];
  const eyeCol = EYE_COLORS[catConfig.eyeColor];

  ctx.save();
  if (dir === -1) {
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
  }

  const cx = Math.round(x);
  const cy = Math.round(y);

  if (state === 'sleeping') {
    drawCatSleeping(cx, cy, colors, eyeCol, frame);
  } else if (state === 'stretching') {
    drawCatStretching(cx, cy, colors, eyeCol, frame);
  } else if (state === 'eating') {
    drawCatEating(cx, cy, colors, eyeCol, frame);
  } else if (state === 'pooping') {
    drawCatPooping(cx, cy, colors, eyeCol, frame);
  } else if (state === 'meowing') {
    drawCatMeowing(cx, cy, colors, eyeCol, frame);
  } else {
    drawCatStanding(cx, cy, colors, eyeCol, frame, state === 'walking');
  }

  ctx.restore();
}

function drawCatStanding(cx, cy, colors, eyeCol, frame, walking) {
  const bob = walking ? Math.sin(frame * 0.3) * 1 : 0;
  const tailWag = Math.sin(frame * 0.15) * 2;

  // 尾巴
  for (let i = 0; i < 8; i++) {
    const tx = cx + 10 + i;
    const ty = cy - 4 + Math.sin(i * 0.5 + frame * 0.1) * 1 + tailWag * (i/8);
    px(tx, Math.round(ty), colors.body);
  }

  // 身体
  pxRect(cx - 6, cy - 8, 14, 10, colors.body);
  // 肚子
  pxRect(cx - 4, cy - 4, 10, 6, colors.belly);

  // 花纹
  drawPattern(cx - 6, cy - 8, 14, 10, colors);

  // 头
  pxRect(cx - 5, cy - 14, 12, 8, colors.body);
  // 脸部浅色
  pxRect(cx - 3, cy - 10, 8, 4, colors.light);

  // 耳朵
  px(cx - 5, cy - 16, colors.body);
  px(cx - 4, cy - 17, colors.body);
  px(cx - 3, cy - 16, colors.dark);
  px(cx + 5, cy - 16, colors.body);
  px(cx + 6, cy - 17, colors.body);
  px(cx + 5, cy - 16, colors.dark);
  // 耳内
  px(cx - 4, cy - 16, '#ffb6c1');
  px(cx + 6, cy - 16, '#ffb6c1');

  // 眼睛
  if (frame % 60 < 3) {
    // 眨眼
    pxLine(cx - 3, cy - 12, cx - 1, cy - 12, colors.dark);
    pxLine(cx + 2, cy - 12, cx + 4, cy - 12, colors.dark);
  } else {
    px(cx - 3, cy - 13, '#fff');
    px(cx - 2, cy - 13, '#fff');
    px(cx - 3, cy - 12, eyeCol);
    px(cx - 2, cy - 12, '#000');
    px(cx + 2, cy - 13, '#fff');
    px(cx + 3, cy - 13, '#fff');
    px(cx + 3, cy - 12, eyeCol);
    px(cx + 4, cy - 12, '#000');
  }

  // 鼻子
  px(cx, cy - 10, '#ffb6c1');

  // 嘴
  px(cx - 1, cy - 9, colors.dark);
  px(cx + 1, cy - 9, colors.dark);

  // 胡须
  pxLine(cx - 7, cy - 11, cx - 3, cy - 10, '#ddd');
  pxLine(cx - 7, cy - 9, cx - 3, cy - 9, '#ddd');
  pxLine(cx + 4, cy - 10, cx + 8, cy - 11, '#ddd');
  pxLine(cx + 4, cy - 9, cx + 8, cy - 9, '#ddd');

  // 腿
  const legOffset = walking ? Math.sin(frame * 0.3) * 2 : 0;
  pxRect(cx - 5, cy + 1, 3, 5 + Math.round(legOffset), colors.body);
  pxRect(cx + 3, cy + 1, 3, 5 - Math.round(legOffset), colors.body);
  // 爪子
  px(cx - 5, cy + 5 + Math.round(legOffset), colors.light);
  px(cx - 4, cy + 5 + Math.round(legOffset), colors.light);
  px(cx + 3, cy + 5 - Math.round(legOffset), colors.light);
  px(cx + 4, cy + 5 - Math.round(legOffset), colors.light);

  // 性别标记（母猫蝴蝶结）
  if (catConfig.gender === 'female') {
    px(cx + 6, cy - 15, '#e74c3c');
    px(cx + 7, cy - 16, '#e74c3c');
    px(cx + 8, cy - 15, '#e74c3c');
    px(cx + 7, cy - 15, '#c0392b');
  }
}

function drawCatSleeping(cx, cy, colors, eyeCol, frame) {
  // 蜷缩的猫
  // 身体（圆形）
  pxRect(cx - 8, cy - 6, 18, 8, colors.body);
  pxRect(cx - 6, cy - 8, 14, 2, colors.body);
  pxRect(cx - 4, cy - 4, 12, 6, colors.belly);

  // 头
  pxRect(cx - 10, cy - 10, 10, 8, colors.body);
  pxRect(cx - 9, cy - 8, 8, 4, colors.light);

  // 耳朵
  px(cx - 10, cy - 12, colors.body);
  px(cx - 9, cy - 13, colors.body);
  px(cx - 3, cy - 12, colors.body);
  px(cx - 2, cy - 13, colors.body);
  px(cx - 9, cy - 12, '#ffb6c1');
  px(cx - 2, cy - 12, '#ffb6c1');

  // 闭眼
  pxLine(cx - 8, cy - 8, cx - 6, cy - 8, colors.dark);
  pxLine(cx - 5, cy - 8, cx - 4, cy - 8, colors.dark);

  // 尾巴缠绕
  px(cx + 9, cy - 4, colors.body);
  px(cx + 10, cy - 5, colors.body);
  px(cx + 10, cy - 6, colors.body);
  px(cx + 9, cy - 7, colors.body);

  // Zzz
  if (frame % 40 < 20) {
    const alpha = (frame % 40) / 20;
    px(cx + 5, cy - 14 - Math.floor(alpha * 3), '#a8d8ea');
    px(cx + 8, cy - 16 - Math.floor(alpha * 3), '#a8d8ea');
    px(cx + 11, cy - 18 - Math.floor(alpha * 3), '#a8d8ea');
  }
}

function drawCatStretching(cx, cy, colors, eyeCol, frame) {
  const stretch = Math.sin(frame * 0.1) * 2;

  // 前伸的身体
  pxRect(cx - 10 - Math.round(stretch), cy - 6, 22 + Math.round(stretch * 2), 8, colors.body);
  pxRect(cx - 8, cy - 4, 18, 5, colors.belly);

  // 头低
  pxRect(cx - 12 - Math.round(stretch), cy - 8, 10, 6, colors.body);
  pxRect(cx - 11 - Math.round(stretch), cy - 6, 8, 3, colors.light);

  // 耳朵
  px(cx - 13 - Math.round(stretch), cy - 10, colors.body);
  px(cx - 12 - Math.round(stretch), cy - 11, colors.body);
  px(cx - 5 - Math.round(stretch), cy - 10, colors.body);
  px(cx - 4 - Math.round(stretch), cy - 11, colors.body);

  // 半闭眼
  px(cx - 11 - Math.round(stretch), cy - 7, eyeCol);
  px(cx - 7 - Math.round(stretch), cy - 7, eyeCol);

  // 后腿翘起
  pxRect(cx + 8, cy - 8, 4, 4, colors.body);
  px(cx + 10, cy - 10, 3, 3, colors.body);

  // 尾巴竖直
  for (let i = 0; i < 6; i++) {
    px(cx + 10, cy - 10 - i, colors.body);
  }
}

function drawCatEating(cx, cy, colors, eyeCol, frame) {
  // 头低下
  pxRect(cx - 5, cy - 10, 12, 8, colors.body);
  pxRect(cx - 3, cy - 6, 8, 4, colors.light);

  // 身体
  pxRect(cx - 6, cy - 4, 14, 10, colors.body);
  pxRect(cx - 4, cy, 10, 6, colors.belly);

  // 耳朵
  px(cx - 5, cy - 12, colors.body);
  px(cx - 4, cy - 13, colors.body);
  px(cx + 5, cy - 12, colors.body);
  px(cx + 6, cy - 13, colors.body);

  // 闭眼享受
  pxLine(cx - 3, cy - 8, cx - 1, cy - 8, colors.dark);
  pxLine(cx + 2, cy - 8, cx + 4, cy - 8, colors.dark);

  // 嘴在碗里
  px(cx, cy - 5, colors.dark);

  // 腿
  pxRect(cx - 5, cy + 5, 3, 4, colors.body);
  pxRect(cx + 3, cy + 5, 3, 4, colors.body);

  // 碗
  pxRect(cx - 4, cy - 4, 10, 4, '#e74c3c');
  pxRect(cx - 3, cy - 5, 8, 2, '#c0392b');

  // 吃的动作 - 食物颗粒
  if (frame % 10 < 5) {
    px(cx - 1, cy - 5, '#8B4513');
    px(cx + 2, cy - 5, '#a0522d');
  }
}

function drawCatPooping(cx, cy, colors, eyeCol, frame) {
  // 蹲姿
  pxRect(cx - 6, cy - 6, 14, 8, colors.body);
  pxRect(cx - 4, cy - 2, 10, 4, colors.belly);

  // 头
  pxRect(cx - 5, cy - 12, 12, 8, colors.body);
  pxRect(cx - 3, cy - 8, 8, 4, colors.light);

  // 耳朵
  px(cx - 5, cy - 14, colors.body);
  px(cx - 4, cy - 15, colors.body);
  px(cx + 5, cy - 14, colors.body);
  px(cx + 6, cy - 15, colors.body);

  // 努力的表情 >_<
  px(cx - 3, cy - 11, eyeCol);

  px(cx + 4, cy - 11, '#000');
  // 皱眉
  px(cx - 3, cy - 12, colors.dark);

  }

  // 猫砂盆
  pxRect(cx - 8, cy + 4, 18, 6, '#4682B4');
  pxRect(cx - 7, cy + 5, 16, 4, '#d2b48c');

  // 努力的汗滴

function drawCatMeowing(cx, cy, colors, eyeCol, frame) {
  const mouthOpen = Math.sin(frame * 0.2) > 0;

  // 身体
  pxRect(cx - 6, cy - 8, 14, 10, colors.body);
  pxRect(cx - 4, cy - 4, 10, 6, colors.belly);

  // 头
  pxRect(cx - 5, cy - 14, 12, 8, colors.body);

  // 耳朵
  px(cx - 5, cy - 16, colors.body);
  px(cx - 4, cy - 17, colors.body);
  px(cx + 5, cy - 16, colors.body);
  px(cx + 6, cy - 17, colors.body);
  px(cx - 4, cy - 16, '#ffb6c1');
  px(cx + 6, cy - 16, '#ffb6c1');

  px(cx + 2, cy - 13, '#fff');
  px(cx + 3, cy - 13, '#fff');
  px(cx + 3, cy - 12, eyeCol);
  px(cx + 4, cy - 12, '#000');

  // 鼻子
  px(cx, cy - 10, '#ffb6c1');

  // 张嘴叫
  if (mouthOpen) {
    px(cx - 1, cy - 9, colors.dark);
    px(cx, cy - 9, '#c0392b');
    px(cx + 1, cy - 9, colors.dark);
    px(cx, cy - 8, '#c0392b');
  } else {
    px(cx - 1, cy - 9, colors.dark);
    px(cx + 1, cy - 9, colors.dark);
  }

  // 胡须
  pxLine(cx - 7, cy - 11, cx - 3, cy - 10, '#ddd');
  pxLine(cx - 7, cy - 9, cx - 3, cy - 9, '#ddd');
  pxLine(cx + 4, cy - 10, cx + 8, cy - 11, '#ddd');
  pxLine(cx + 4, cy - 9, cx + 8, cy - 9, '#ddd');

  // 腿
  pxRect(cx - 5, cy + 1, 3, 5, colors.body);
  pxRect(cx + 3, cy + 1, 3, 5, colors.body);

  // 音符
  if (frame % 15 < 8) {
    px(cx + 8, cy - 18, '#FFD700');
    px(cx + 9, cy - 19, '#FFD700');
    px(cx + 10, cy - 18, '#FFD700');
    px(cx + 10, cy - 20, '#FFD700');
    px(cx + 10, cy - 21, '#FFD700');
  }

  // 性别标记
  if (catConfig.gender === 'female') {
    px(cx + 6, cy - 15, '#e74c3c');
    px(cx + 7, cy - 16, '#e74c3c');
    px(cx + 8, cy - 15, '#e74c3c');
    px(cx + 7, cy - 15, '#c0392b');
  }
}

function drawPattern(x, y, w, h, colors) {
  const pattern = catConfig.pattern;
  if (pattern === 'solid') return;

  if (pattern === 'tabby') {
    // 虎斑条纹
    for (let i = 0; i < w; i += 4) {
      px(x + i, y + 1, colors.dark);
      px(x + i, y + 4, colors.dark);
      px(x + i, y + 7, colors.dark);
    }
  } else if (pattern === 'calico') {
    // 三花色块
    pxRect(x + 2, y + 1, 4, 3, '#f5a0b0');
    pxRect(x + 8, y + 4, 4, 3, '#333');
    pxRect(x + 1, y + 6, 3, 2, '#f5a0b0');
  } else if (pattern === 'tuxedo') {
    // 燕尾服 - 白色胸前
    pxRect(x + 3, y + 2, 6, 6, '#fff');
  } else if (pattern === 'spots') {
    // 斑点
    px(x + 2, y + 2, colors.dark);
    px(x + 3, y + 2, colors.dark);
    px(x + 8, y + 4, colors.dark);
    px(x + 9, y + 4, colors.dark);
    px(x + 5, y + 7, colors.dark);
    px(x + 6, y + 7, colors.dark);
  }
}

// ============================================================
// 猫咪行为AI
// ============================================================
const BEHAVIORS = {
  lazy: {
    states: ['sleeping', 'sleeping', 'sleeping', 'idle', 'stretching', 'walking', 'eating'],
    meows: ['呼噜噜...', '嗯...还想睡...', '喵~（打哈欠）', '别吵...'],
    speed: 0.3,
  },
  playful: {
    states: ['walking', 'walking', 'walking', 'stretching', 'idle', 'eating', 'meowing'],
    meows: ['喵喵喵！', '快来陪我玩！', '我要跑酷！', '喵呜~'],
    speed: 0.8,
  },
  shy: {
    states: ['idle', 'idle', 'sleeping', 'walking', 'eating'],
    meows: ['...喵', '（小声）喵...', '别看我...', '喵...'],
    speed: 0.3,
  },
  foodie: {
    states: ['eating', 'eating', 'walking', 'idle', 'sleeping', 'stretching'],
    meows: ['饿了！', '有吃的吗？', '喵~（舔嘴）', '还要吃！'],
    speed: 0.5,
  },
  grumpy: {
    states: ['idle', 'idle', 'sleeping', 'stretching', 'walking'],
    meows: ['哈！', '别碰我！', '哼...', '喵！（不高兴）'],
    speed: 0.4,
  },
};

function getRandomWalkTarget() {
  let attempts = 0;
  while (attempts < 50) {
    const x = 20 + Math.random() * (W - 40);
    const y = ROOM.floorY + 20 + Math.random() * (H - ROOM.floorY - 40);
    if (isWalkable(x, y)) return { x, y };
    attempts++;
  }
  return { x: 160, y: 160 };
}

function startNewBehavior() {
  const behavior = BEHAVIORS[catConfig.personality];
  const state = behavior.states[Math.floor(Math.random() * behavior.states.length)];
  cat.state = state;
  cat.stateTimer = 0;

  switch (state) {
    case 'walking':
      const target = getRandomWalkTarget();
      cat.targetX = target.x;
      cat.targetY = target.y;
      cat.speed = behavior.speed;
      break;
    case 'eating':
      // 走到餐桌附近
      cat.targetX = 185 + Math.random() * 10;
      cat.targetY = 165;
      cat.state = 'walking';
      cat.stateTimer = 0;
      // 到了之后切换到eating
      cat._nextState = 'eating';
      break;
    case 'pooping':
      cat.targetX = 28;
      cat.targetY = 170;
      cat.state = 'walking';
      cat.stateTimer = 0;
      cat._nextState = 'pooping';
      break;
    case 'stretching':
    case 'sleeping':
    case 'idle':
    case 'meowing':
      cat.stateTimer = 0;
      break;
  }
}

function updateCat() {
  if (!cat.visible) return;

  cat.frame++;
  cat.stateTimer++;

  const behavior = BEHAVIORS[catConfig.personality];

  switch (cat.state) {
    case 'walking':
      const dx = cat.targetX - cat.x;
      const dy = cat.targetY - cat.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 3) {
        if (cat._nextState) {
          cat.state = cat._nextState;
          cat._nextState = null;
          cat.stateTimer = 0;
        } else {
          cat.state = 'idle';
          cat.stateTimer = 0;
        }
      } else {
        cat.x += (dx / dist) * cat.speed;
        cat.y += (dy / dist) * cat.speed;
        cat.direction = dx > 0 ? 1 : -1;
      }
      break;

    case 'idle':
      if (cat.stateTimer > 120 + Math.random() * 180) {
        startNewBehavior();
      }
      break;

    case 'sleeping':
      if (cat.stateTimer > 300 + Math.random() * 300) {
        startNewBehavior();
      }
      break;

    case 'eating':
      if (cat.stateTimer > 150) {
        startNewBehavior();
      }
      break;

    case 'pooping':
      if (cat.stateTimer > 120) {
        startNewBehavior();
      }
      break;

    case 'stretching':
      if (cat.stateTimer > 100) {
        startNewBehavior();
      }
      break;

    case 'meowing':
      if (cat.stateTimer > 80) {
        startNewBehavior();
      }
      break;
  }

  // 随机触发拉屎
  if (cat.state !== 'pooping' && cat.state !== 'walking' && Math.random() < 0.001) {
    cat._nextState = 'pooping';
    cat.state = 'walking';
    cat.targetX = 28;
    cat.targetY = 170;
    cat.stateTimer = 0;
  }
}

// 交互
// ============================================================
let lastClickTime = 0;
let clickCount = 0;
let doubleClickTimer = null;

canvas.addEventListener('dblclick', function(e) {
  e.preventDefault();
  handleDoubleClick();
});

canvas.addEventListener('click', function(e) {
  // 用 dblclick 事件即可
});

function handleDoubleClick() {
  if (!cat.visible) {
    // 召唤猫咪
    cat.visible = true;
    const pos = getRandomWalkTarget();
    cat.x = pos.x;
    cat.y = pos.y;
    cat.state = 'meowing';
    cat.stateTimer = 0;
    cat.frame = 0;
    showSpeechBubble(getRandomMeow());
    updateStatus(catConfig.name + ' 出现了！');
  } else {
    // 随机行为：消失、叫唤、或切换状态
    const action = Math.random();
    if (action < 0.3) {
      // 消失
      cat.visible = false;
      showSpeechBubble('...');
      updateStatus(catConfig.name + ' 跑掉了！');
    } else if (action < 0.7) {
      // 叫唤
      cat.state = 'meowing';
      cat.stateTimer = 0;
      showSpeechBubble(getRandomMeow());
      updateStatus(catConfig.name + ' 在叫唤！');
    } else {
      // 伸懒腰
      cat.state = 'stretching';
      cat.stateTimer = 0;
      showSpeechBubble(getRandomMeow());
      updateStatus(catConfig.name + ' 伸了个懒腰~');
    }
  }
}

function getRandomMeow() {
  const behavior = BEHAVIORS[catConfig.personality];
  return behavior.meows[Math.floor(Math.random() * behavior.meows.length)];
}

function showSpeechBubble(text) {
  speechBubble.textContent = text;
  speechBubble.classList.add('show');

  // 定位在猫咪附近
  if (cat.visible) {
    const screenX = cat.x * SCALE;
    const screenY = cat.y * SCALE;
    speechBubble.style.left = (screenX + canvas.offsetLeft - 20) + 'px';
    speechBubble.style.top = (screenY + canvas.offsetTop - 50) + 'px';
  }

  clearTimeout(speechBubble._timer);
  speechBubble._timer = setTimeout(() => {
    speechBubble.classList.remove('show');
  }, 2000);
}

function updateStatus(text) {
  statusBar.textContent = text;
}

let time = 0;

function gameLoop() {
  time++;

  // 清屏
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 绘制房间
  drawRoom();

  // 更新猫咪
  updateCat();

  // 绘制猫咪
  if (cat.visible) {
    drawCat(cat.x, cat.y, cat.direction, cat.frame, cat.state);

    // 更新气泡位置
    if (speechBubble.classList.contains('show')) {
      const screenX = cat.x * SCALE;
      const screenY = cat.y * SCALE;
      speechBubble.style.left = Math.min(screenX + canvas.offsetLeft - 20, window.innerWidth - 200) + 'px';
      speechBubble.style.top = (screenY + canvas.offsetTop - 50) + 'px';
    }
  }

  // 状态更新
  if (cat.visible) {
    const stateNames = {
      idle: '发呆中',
      walking: '散步中',
      sleeping: '睡觉中 💤',
      eating: '吃饭中 🍽️',
      pooping: '上厕所中 🚽',
      stretching: '伸懒腰中 🧘',
      meowing: '叫唤中 🔊',
    };
    const stateText = stateNames[cat.state] || cat.state;
    updateStatus(catConfig.name + ' · ' + stateText + ' | 双击屏幕互动');
  } else {
    updateStatus(catConfig.name + ' 不在 · 双击屏幕召唤');
  }

  requestAnimationFrame(gameLoop);
}

// ============================================================
// 初始化
// ============================================================
updateStatus('双击屏幕召唤 ' + catConfig.name + '！');
gameLoop();

// 窗口大小自适应
function resizeCanvas() {
  const maxW = window.innerWidth - 20;
  const maxH = window.innerHeight - 60;
  const scaleW = maxW / W;
  const scaleH = maxH / H;
  const scale = Math.min(scaleW, scaleH, 4);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

</script>
