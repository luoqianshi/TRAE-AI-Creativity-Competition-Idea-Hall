<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游秘通 GameKey - 单机游戏攻略/秘籍一站式速查</title>
<style>
  :root {
    --bg-primary: #0f1115;
    --bg-secondary: #1a1d24;
    --bg-card: #22262e;
    --bg-hover: #2a2f38;
    --text-primary: #e8e8e8;
    --text-secondary: #9ca3af;
    --accent: #4f8ef7;
    --accent-hover: #3a7de4;
    --border: #2d3139;
    --tag-bg: #2d3748;
    --tag-text: #a0aec0;
    --type-cheat: #e53e3e;
    --type-quest: #38a169;
    --type-guide: #d69e2e;
    --type-collect: #805ad5;
    --type-equip: #3182ce;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", -apple-system, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
    display: flex;
  }

  /* Sidebar */
  .sidebar {
    width: 260px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .logo {
    padding: 24px 20px;
    border-bottom: 1px solid var(--border);
  }
  .logo h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
  }
  .logo p {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .game-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0;
  }
  .game-list::-webkit-scrollbar { width: 4px; }
  .game-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .game-item {
    display: flex;
    align-items: center;
    padding: 12px 20px;
    cursor: pointer;
    transition: all 0.2s;
    border-left: 3px solid transparent;
  }
  .game-item:hover { background: var(--bg-hover); }
  .game-item.active {
    background: var(--bg-hover);
    border-left-color: var(--accent);
  }
  .game-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    margin-right: 12px;
    flex-shrink: 0;
  }
  .game-info h3 {
    font-size: 14px;
    font-weight: 600;
  }
  .game-info p {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .game-count {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-secondary);
    background: var(--bg-primary);
    padding: 2px 8px;
    border-radius: 10px;
  }

  /* Main Content */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .search-box {
    flex: 1;
    position: relative;
    max-width: 480px;
  }
  .search-box input {
    width: 100%;
    padding: 10px 16px 10px 40px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
  }
  .filter-tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-tag {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    transition: all 0.2s;
    user-select: none;
  }
  .filter-tag:hover { border-color: var(--accent); color: var(--accent); }
  .filter-tag.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* Content Area */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
  }
  .content::-webkit-scrollbar { width: 6px; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .section-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title span {
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 400;
  }

  /* Guide Cards */
  .guide-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 16px;
  }
  .guide-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .guide-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .guide-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .guide-card:hover::before { opacity: 1; }

  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    flex: 1;
    padding-right: 12px;
  }
  .card-type {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .type-cheat { background: rgba(229, 62, 62, 0.15); color: var(--type-cheat); }
  .type-quest { background: rgba(56, 161, 105, 0.15); color: var(--type-quest); }
  .type-guide { background: rgba(214, 158, 46, 0.15); color: var(--type-guide); }
  .type-collect { background: rgba(128, 90, 213, 0.15); color: var(--type-collect); }
  .type-equip { background: rgba(49, 130, 206, 0.15); color: var(--type-equip); }

  .card-tags {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .card-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 6px;
    background: var(--tag-bg);
    color: var(--tag-text);
  }
  .card-preview {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    white-space: pre-line;
  }
  .card-game {
    margin-top: 12px;
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-game::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    max-width: 640px;
    width: 100%;
    max-height: 80vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    animation: modalIn 0.2s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }
  .modal-header {
    padding: 24px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .modal-title-area h2 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .modal-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .modal-close {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 24px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }
  .modal-close:hover { color: var(--text-primary); }
  .modal-body {
    padding: 20px 24px;
    overflow-y: auto;
    line-height: 1.8;
    font-size: 14px;
    color: var(--text-primary);
    white-space: pre-line;
  }
  .modal-body::-webkit-scrollbar { width: 4px; }
  .modal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-secondary);
  }
  .empty-state svg {
    width: 64px;
    height: 64px;
    margin-bottom: 16px;
    opacity: 0.5;
  }
  .empty-state p { font-size: 15px; }

  /* Responsive */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .guide-grid { grid-template-columns: 1fr; }
    .header { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">
    <h1>游秘通 GameKey</h1>
    <p>单机游戏攻略/秘籍一站式速查</p>
  </div>
  <div class="game-list" id="gameList"></div>
</div>

<div class="main">
  <div class="header">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="搜索攻略、秘籍、装备...">
    </div>
    <div class="filter-tags" id="filterTags"></div>
  </div>
  <div class="content" id="content"></div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title-area">
        <h2 id="modalTitle"></h2>
        <div class="modal-tags" id="modalTags"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const gameData = {"games":[{"id":"skyrim","name":"上古卷轴5：天际","nameEn":"The Elder Scrolls V: Skyrim","category":"RPG","color":"#4a6741","guides":[{"id":"sk_001","title":"常用控制台指令","type":"秘籍","tags":["控制台","作弊码"],"content":"打开控制台按 ~ 键\n\n• tgm - 无敌模式\n• tcl - 穿墙模式\n• player.additem 0000000f 1000 - 增加1000金币\n• player.setav carryweight 9999 - 无限负重\n• coc qasmoke - 传送到测试房间（所有物品）\n• psb - 学会所有龙吼\n• tai - NPC停止AI\n• tcai - 停止战斗AI"},{"id":"sk_002","title":"龙裔DLC 主要任务流程","type":"任务","tags":["主线","DLC"],"content":"1. 到达索塞姆岛（ Windhelm 码头乘船）\n2. 调查米拉克神庙\n3. 学习龙吼 '意志屈服'（Bend Will）\n4. 骑龙前往米拉克神殿\n5. 击败米拉克，完成龙裔任务线\n\n关键龙语位置：\n• 意志屈服 第一段：米拉克神庙\n• 意志屈服 第二段：石崖山脊\n• 意志屈服 第三段：萨洛塔石冢"},{"id":"sk_003","title":"三神循环锻造指南","type":"攻略","tags":["锻造","装备"],"content":"利用炼金、附魔、锻造三技能互相增益，打造神级装备：\n\n1. 穿戴全套附魔锻造加成的装备\n2. 喝下炼金锻造药水\n3. 打造武器/护甲\n4. 对新装备附魔\n5. 重复步骤提升属性\n\n注意：无修复补丁下数值可能溢出。"},{"id":"sk_004","title":"暗影弓位置与获取","type":"装备","tags":["隐藏","武器"],"content":"暗影弓（Firiniel's End）位于冬堡学院附近。\n\n获取方式：\n• 完成冬堡学院任务线后，在法师宿舍床下可获得\n• 自带 frost damage 附魔\n• 潜行伤害加成适合刺客流\n\n另：风盔城造船厂有隐藏宝箱，内含稀有弓箭。"}]},{"id":"eldenring","name":"艾尔登法环","nameEn":"Elden Ring","category":"动作RPG","color":"#c9a84c","guides":[{"id":"er_001","title":"开局推荐职业选择","type":"攻略","tags":["新手","职业"],"content":"新手推荐：\n• 武士（Samurai）- 高血量，自带长弓和打刀，适合远程消耗\n• 预言家（Prophet）- 信仰流派，治疗祷告让开荒更轻松\n• 囚犯（Prisoner）- 魔剑士，智力+敏捷平衡\n\n不推荐新手：\n• 无用之人（Wretch）- 裸装开局，极难\n• 英雄（Hero）- 纯力量，前期没有远程手段"},{"id":"er_002","title":"传说武器全收集","type":"收集","tags":["成就","武器"],"content":"9把传说武器位置：\n\n1. 夜与火之剑 - 卡利亚城寨\n2. 玛雷家行刑剑 - 日荫城\n3. 黄金律法大剑 - 化圣雪原\n4. 暗月大剑 - 菈妮任务线奖励\n5. 遗迹大剑 - 红狮子城击败双boss\n6. 吞世权杖 - 习战者的破屋/贝纳尔入侵\n7. 古兰桑克斯的雷电 - 王城罗德尔（需在烧树前获取）\n8. 日蚀钩剑 - 索尔城\n9. 蒙格温圣矛 - 鲜血君王boss追忆兑换\n\n注意：部分武器会随剧情推进无法获取。"},{"id":"er_003","title":"白面具梵雷支线完整流程","type":"任务","tags":["支线","入侵"],"content":"1. 在漂流墓地初见白面具梵雷\n2. 到达圆桌厅堂后再次对话\n3. 击败葛瑞克后，在蔷薇教堂找到他\n4. 使用溃烂血指入侵其他玩家3次（可离线用NPC入侵代替）\n5. 获得鲜血君王的立誓布\n6. 染上巫女鲜血（可在镇静教堂找到死去的巫女）\n7. 返回复命，获得无限血指和纯血骑士勋章\n8. 使用勋章前往蒙格温王朝\n\n奖励：白面具套装、鲜血赐福、前往蒙格温王朝捷径"},{"id":"er_004","title":"无限卢恩刷取方法","type":"秘籍","tags":["刷级","技巧"],"content":"早期：\n• 风暴山丘破屋附近刷巨人，每只约1000卢恩\n\n中期：\n• 蒙格温王朝刷白金之子，使用范围法术/战技，一轮约4-5万卢恩\n• 佩戴金色粪金龟护符增加20%获取量\n\n后期：\n• 蒙格温王朝跳崖击杀大乌鸦（用陨石术/毒雾），每只约11万卢恩\n• 吃完金色鸡爪（增加30%卢恩）再刷\n\n注意：离线模式下部分方法不可用。"}]},{"id":"gta5","name":"GTA5","nameEn":"Grand Theft Auto V","category":"开放世界","color":"#2e7d32","guides":[{"id":"gta_001","title":"PC版作弊码大全","type":"秘籍","tags":["作弊码","PC"],"content":"按 ~ 打开控制台输入：\n\n• PAINKILLER - 无敌5分钟\n• TOOLUP - 获得所有武器\n• TURTLE - 满护甲+血量\n• CATCHME - 超级奔跑\n• GOTGILLS - 快速游泳\n• HOPTOIT - 超级跳跃\n• FUGITIVE - 提升通缉等级\n• LAWYERUP - 降低通缉等级\n• MAKEITRAIN - 改变天气\n• SNOWDAY - 车辆打滑\n\n注意：使用作弊码会禁用该存档的成就获取。"},{"id":"gta_002","title":"股市暗杀任务投资指南","type":"攻略","tags":["赚钱","股票"],"content":"利用莱斯特暗杀任务操纵股市：\n\n1. 酒店暗杀任务前：投资贝塔制药（BAWSAQ: BET）\n   完成后卖出，回报率约50%\n\n2. 多重暗杀任务前：投资帝邦尼尔（LCN: DEB）\n   完成后卖出，回报率约80%\n\n3. 凶残暗杀任务前：投资水果电脑（BAWSAQ: FRT）\n   完成后卖出，回报率约30%\n\n4. 巴士暗杀任务后：投资范杰莉卡（BAWSAQ: VAG）\n   （注意是任务后投资）\n\n5. 工地暗杀任务前：投资黄金海岸（LCN: GCD）\n   完成后卖出，回报率约80%\n\n建议在主线最后大劫案前完成所有暗杀任务，将三角色资产最大化。"},{"id":"gta_003","title":"UFO碎片全收集位置","type":"收集","tags":["收集","隐藏"],"content":"收集50个UFO碎片解锁太空飞车：\n\n• 碎片1：码头附近水下\n• 碎片2：机场跑道尽头\n• 碎片3：桑库多堡垒附近\n• 碎片4：奇利亚德山山顶\n• 碎片5：利他教营地附近\n• 碎片6-50：分散在洛圣都各地\n\n建议使用收集地图mod或在线地图工具辅助。\n\n全部收集后，奥米伽会在沙漠给予奖励。"},{"id":"gta_004","title":"太平洋标准银行差事攻略","type":"任务","tags":["抢劫","线上"],"content":"太平洋标准银行是GTA Online经典抢劫任务：\n\n准备任务：\n1. 骇入设备 - 偷取信号器\n2. 信号车辆 - 获取逃跑车辆\n3. 黑客 - 招募黑客Paige\n4. 摩托车 - 准备逃跑载具\n\n终章要点：\n• 推荐队伍配置：2枪手+1骇客+1跑路\n• 不要开枪杀平民，会增加通缉\n• 出门后直接骑准备好的摩托车\n• 按预定路线跳崖走水路\n• 最后换船逃离\n\n精英挑战：5分30秒内完成，没人死亡，背包满额。"}]},{"id":"witcher3","name":"巫师3：狂猎","nameEn":"The Witcher 3: Wild Hunt","category":"RPG","color":"#5d4037","guides":[{"id":"w3_001","title":"学派套装全收集指南","type":"收集","tags":["装备","套装"],"content":"六大学派猎魔人套装：\n\n1. 猫学派（轻甲）- 威伦/诺维格瑞附近\n   特点：暴击伤害，适合 fast attack 流派\n\n2. 熊学派（重甲）- 史凯利杰群岛\n   特点：高防御， adrenaline 点数加成\n\n3. 狮鹫学派（中甲）- 维伦/奥森福特\n   特点：法印强度加成，适合法印流\n\n4. 狼学派（中甲）- 凯尔莫罕附近\n   特点：平衡型，可涂多种剑油\n\n5. 飞狮怪学派（血与酒DLC）- 陶森特 let currentGame = 'all';
let currentType = 'all';
let searchQuery = '';

const typeIcons = {
  '秘籍': '🔥', '任务': '📜', '攻略': '⚔️', '收集': '💎', '装备': '🛡️'
};

const typeClasses = {
  '秘籍': 'type-cheat', '任务': 'type-quest', '攻略': 'type-guide',
  '收集': 'type-collect', '装备': 'type-equip'
};

function init() {
  renderGameList();
  renderFilterTags();
  renderGuides();
  setupSearch();
}

function renderGameList() {
  const list = document.getElementById('gameList');
  let html = `
    <div class="game-item ${currentGame === 'all' ? 'active' : ''}" onclick="selectGame('all')">
      <div class="game-icon" style="background: linear-gradient(135deg, #4f8ef7, #3a7de4);">🎮</div>
      <div class="game-info">
        <h3>全部游戏</h3>
        <p>查看所有攻略</p>
      </div>
      <span class="game-count">${gameData.games.reduce((s,g)=>s+g.guides.length,0)}</span>
    </div>
  `;
  gameData.games.forEach(game => {
    html += `
      <div class="game-item ${currentGame === game.id ? 'active' : ''}" onclick="selectGame('${game.id}')">
        <div class="game-icon" style="background: ${game.color}20; color: ${game.color};">
          ${game.name.charAt(0)}
        </div>
        <div class="game-info">
          <h3>${game.name}</h3>
          <p>${game.category}</p>
        </div>
        <span class="game-count">${game.guides.length}</span>
      </div>
    `;
  });
  list.innerHTML = html;
}

function renderFilterTags() {
  const types = ['all', '秘籍', '任务', '攻略', '收集', '装备'];
  const container = document.getElementById('filterTags');
  container.innerHTML = types.map(t => `
    <span class="filter-tag ${currentType === t ? 'active' : ''}" onclick="selectType('${t}')">
      ${t === 'all' ? '全部' : typeIcons[t] + ' ' + t}
    </span>
  `).join('');
}

function getFilteredGuides() {
  let guides = [];
  gameData.games.forEach(game => {
    if (currentGame !== 'all' && game.id !== currentGame) return;
    game.guides.forEach(guide => {
      guides.push({ ...guide, gameName: game.name, gameColor: game.color });
    });
  });

  if (currentType !== 'all') {
    guides = guides.filter(g => g.type === currentType);
  }

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    guides = guides.filter(g =>
      g.title.toLowerCase().includes(q) ||
      g.content.toLowerCase().includes(q) ||
      g.tags.some(t => t.toLowerCase().includes(q))
    );
  }

  return guides;
}

function renderGuides() {
  const guides = getFilteredGuides();
  const content = document.getElementById('content');

  if (guides.length === 0) {
    content.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <p>没有找到匹配的攻略，试试其他关键词？</p>
      </div>
    `;
    return;
  }

  const gameLabel = currentGame === 'all' ? '全部游戏' : gameData.games.find(g => g.id === currentGame)?.name;
  const typeLabel = currentType === 'all' ? '' : ` · ${currentType}`;

  let html = `
    <div class="section-title">
      ${gameLabel}${typeLabel}
      <span>共 ${guides.length} 条攻略</span>
    </div>
    <div class="guide-grid">
  `;

  guides.forEach(guide => {
    const preview = guide.content.split('\n').slice(0, 3).join('\n');
    html += `
      <div class="guide-card" onclick="openModal('${guide.id}')">
        <div class="card-header">
          <div class="card-title">${guide.title}</div>
          <span class="card-type ${typeClasses[guide.type] || 'type-guide'}">${guide.type}</span>
        </div>
        <div class="card-tags">
          ${guide.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}
        </div>
        <div class="card-preview">${preview}</div>
        <div class="card-game" style="color: ${guide.gameColor}">${guide.gameName}</div>
      </div>
    `;
  });

  html += '</div>';
  content.innerHTML = html;
}

function selectGame(id) {
  currentGame = id;
  renderGameList();
  renderGuides();
}

function selectType(type) {
  currentType = type;
  renderFilterTags();
  renderGuides();
}

function setupSearch() {
  const input = document.getElementById('searchInput');
  input.addEventListener('input', (e) => {
    searchQuery = e.target.value.trim();
    renderGuides();
  });
}

function openModal(guideId) {
  let guide = null;
  let game = null;
  for (const g of gameData.games) {
    const found = g.guides.find(gd => gd.id === guideId);
    if (found) { guide = found; game = g; break; }
  }
  if (!guide) return;

  document.getElementById('modalTitle').textContent = guide.title;
  document.getElementById('modalTags').innerHTML = `
    <span class="card-type ${typeClasses[guide.type] || 'type-guide'}">${guide.type}</span>
    ${guide.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}
    <span class="card-tag" style="margin-left: auto;">${game.name}</span>
  `;
  document.getElementById('modalBody').textContent = guide.content;
  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal(event) {
  if (event && event.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

init();
</script>
</body>
</html>
