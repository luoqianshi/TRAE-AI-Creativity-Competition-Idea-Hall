<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>自律助手</title>
  <style>
    /* ==================== 全局样式 ==================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(180deg, #F1F8E9 0%, #ffffff 100%);
      min-height: 100vh;
      padding: 20px;
    }

    /* ==================== 主容器 ==================== */
    .container {
      max-width: 400px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ==================== 标题区域 ==================== */
    .header {
      text-align: center;
      padding: 20px 0;
    }

    .title {
      font-size: 32px;
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 16px;
      color: #999;
    }

    /* ==================== 倒计时卡片 ==================== */
    .countdown-card {
      background: linear-gradient(135deg, #4CAF50 0%, #81C784 100%);
      border-radius: 24px;
      padding: 35px 25px;
      text-align: center;
      color: #fff;
      box-shadow: 0 8px 20px rgba(76, 175, 80, 0.3);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .countdown-card:active {
      transform: scale(0.98);
    }

    .countdown-hint {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 12px;
      display: block;
    }

    .countdown-days {
      font-size: 72px;
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
    }

    .countdown-text {
      font-size: 18px;
    }

    .target-name {
      font-weight: bold;
      margin: 0 6px;
    }

    .days-number {
      font-weight: bold;
    }

    /* ==================== 编辑弹窗 ==================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background: #fff;
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      max-width: 350px;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: bold;
      color: #4CAF50;
    }

    .close-btn {
      font-size: 32px;
      color: #999;
      cursor: pointer;
      line-height: 1;
    }

    .form-item {
      margin-bottom: 20px;
    }

    .label {
      display: block;
      font-size: 14px;
      color: #666;
      margin-bottom: 10px;
    }

    .input {
      width: 100%;
      height: 44px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      padding: 0 15px;
      font-size: 16px;
    }

    .input:focus {
      outline: none;
      border-color: #4CAF50;
    }

    .save-btn {
      width: 100%;
      height: 48px;
      background: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .save-btn:hover {
      background: #388E3C;
    }

    /* ==================== 任务卡片 ==================== */
    .task-card {
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      flex: 1;
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .task-title-wrapper {
      display: flex;
      align-items: center;
    }

    .calendar-icon {
      font-size: 24px;
      margin-right: 10px;
    }

    .task-title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }

    .task-progress {
      font-size: 14px;
      color: #999;
    }

    /* ==================== 任务列表 ==================== */
    .task-list {
      margin-bottom: 15px;
    }

    .empty-tips {
      text-align: center;
      padding: 40px 0;
      color: #ccc;
      font-size: 14px;
    }

    .task-item-wrapper {
      position: relative;
      margin-bottom: 12px;
      border-radius: 12px;
      overflow: hidden;
    }

    .delete-btn {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 0;
      background: #ff5252;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: width 0.3s ease;
      overflow: hidden;
    }

    .delete-btn.show {
      width: 80px;
    }

    .delete-icon {
      font-size: 24px;
      color: #fff;
    }

    .task-item {
      display: flex;
      align-items: center;
      padding: 15px;
      background: #F1F8E9;
      border-radius: 12px;
      transition: transform 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .task-item.swiped {
      transform: translateX(-80px);
    }

    .task-item.completed .task-text {
      color: #999;
      text-decoration: line-through;
    }

    .checkbox {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid #ddd;
      margin-right: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .checkbox.checked {
      background: #4CAF50;
      border-color: #4CAF50;
    }

    .check-icon {
      color: #fff;
      font-size: 16px;
      font-weight: bold;
    }

    .task-text {
      flex: 1;
      font-size: 16px;
      color: #333;
      transition: all 0.3s ease;
    }

    /* ==================== 添加任务 ==================== */
    .add-task-form {
      margin-top: 15px;
    }

    .task-input {
      width: 100%;
      height: 44px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 0 15px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .task-input:focus {
      outline: none;
      border-color: #4CAF50;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .confirm-btn, .cancel-btn {
      flex: 1;
      height: 44px;
      border-radius: 22px;
      font-size: 20px;
      border: none;
      cursor: pointer;
    }

    .confirm-btn {
      background: #4CAF50;
      color: #fff;
    }

    .cancel-btn {
      background: #f0f0f0;
      color: #666;
    }

    .add-task-btn {
      width: 100%;
      height: 50px;
      border: 3px dashed #4CAF50;
      background: transparent;
      color: #4CAF50;
      border-radius: 12px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-top: 15px;
    }

    .plus-icon {
      font-size: 24px;
      margin-right: 8px;
      font-weight: bold;
    }

    .delete-hint {
      display: block;
      text-align: center;
      font-size: 12px;
      color: #ccc;
      margin-top: 15px;
    }

    /* ==================== 励志语录卡片 ==================== */
    .quote-card {
      background: #fff;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .quote-card:active {
      transform: scale(0.98);
    }

    .quote-hint {
      display: block;
      font-size: 12px;
      color: #ccc;
      margin-bottom: 12px;
    }

    .quote-text {
      display: block;
      font-size: 16px;
      color: #666;
      font-style: italic;
      line-height: 1.6;
    }

    /* ==================== 底部留白 ==================== */
    .bottom-space {
      height: 30px;
    }

    /* ==================== Toast提示 ==================== */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 2000;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .toast.show {
      opacity: 1;
    }

    /* ==================== 响应式设计 ==================== */
    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .container {
        gap: 15px;
      }

      .title {
        font-size: 28px;
      }

      .countdown-days {
        font-size: 60px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 标题区域 -->
    <div class="header">
      <div class="title">自律助手</div>
      <div class="subtitle">每一天，都是新的开始</div>
    </div>

    <!-- 倒计时卡片 -->
    <div class="countdown-card" onclick="showEditModal()">
      <div class="countdown-hint">点击修改目标</div>
      <div class="countdown-days" id="daysLeft">0</div>
      <div class="countdown-text">
        距离<span class="target-name" id="targetName">高考</span>还有 <span class="days-number" id="daysNumber">0</span> 天
      </div>
    </div>

    <!-- 任务卡片 -->
    <div class="task-card">
      <div class="task-header">
        <div class="task-title-wrapper">
          <div class="calendar-icon">📅</div>
          <div class="task-title">今日任务</div>
        </div>
        <div class="task-progress" id="taskProgress">0/0 完成</div>
      </div>

      <!-- 任务列表 -->
      <div class="task-list" id="taskList">
        <!-- 任务项将通过JS动态生成 -->
      </div>

      <!-- 添加任务输入框 -->
      <div class="add-task-form" id="addTaskForm" style="display: none;">
        <input 
          type="text" 
          class="task-input" 
          id="newTaskInput" 
          placeholder="输入新任务..."
          onkeypress="if(event.key==='Enter') addTask()"
        />
        <div class="btn-group">
          <button class="confirm-btn" onclick="addTask()">✓</button>
          <button class="cancel-btn" onclick="cancelAdd()">×</button>
        </div>
      </div>

      <!-- 添加任务按钮 -->
      <button class="add-task-btn" id="addTaskBtn" onclick="showAddInput()">
        <span class="plus-icon">+</span>
        <span>添加新任务</span>
      </button>

      <div class="delete-hint">左滑任务可删除</div>
    </div>

    <!-- 励志语录卡片 -->
    <div class="quote-card" onclick="refreshQuote()">
      <div class="quote-hint">点击切换语录</div>
      <div class="quote-text" id="dailyQuote">"加载中..."</div>
    </div>

    <!-- 底部留白 -->
    <div class="bottom-space"></div>
  </div>

  <!-- 编辑弹窗 -->
  <div class="modal-overlay" id="editModal" style="display: none;" onclick="cancelEdit()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">设置目标</div>
        <div class="close-btn" onclick="cancelEdit()">×</div>
      </div>
      <div class="form-item">
        <div class="label">目标名称</div>
        <input 
          type="text" 
          class="input" 
          id="editNameInput" 
          placeholder="例如：高考、考研..."
        />
      </div>
      <div class="form-item">
        <div class="label">目标日期</div>
        <input 
          type="date" 
          class="input" 
          id="editDateInput" 
        />
      </div>
      <button class="save-btn" onclick="saveTarget()">保存</button>
    </div>
  </div>

  <!-- Toast提示 -->
  <div class="toast" id="toast"></div>

  <script>
    // ==================== 励志语录库 ====================
    const quotes = [
      "不积跬步，无以至千里；不积小流，无以成江海。",
      "宝剑锋从磨砺出，梅花香自苦寒来。",
      "书山有路勤为径，学海无涯苦作舟。",
      "千里之行，始于足下。",
      "业精于勤，荒于嬉；行成于思，毁于随。",
      "天行健，君子以自强不息。",
      "路漫漫其修远兮，吾将上下而求索。",
      "锲而舍之，朽木不折；锲而不舍，金石可镂。",
      "博学之，审问之，慎思之，明辨之，笃行之。",
      "纸上得来终觉浅，绝知此事要躬行。",
      "少年易老学难成，一寸光阴不可轻。",
      "黑发不知勤学早，白首方悔读书迟。",
      "盛年不重来，一日难再晨。及时当勉励，岁月不待人。",
      "莫等闲，白了少年头，空悲切。",
      "一分耕耘，一分收获。",
      "只要功夫深，铁杵磨成针。",
      "吃得苦中苦，方为人上人。",
      "天道酬勤，功不唐捐。",
      "星光不问赶路人，时光不负有心人。",
      "将来的你，一定会感谢现在奋斗的自己。",
      "每一个不曾起舞的日子，都是对生命的辜负。",
      "成功的路上并不拥挤，因为坚持的人不多。",
      "你的努力，终将让你成为更好的自己。",
      "今天的努力，是幸运的伏笔。",
    ];

    // ==================== 数据状态 ====================
    let data = {
      targetName: '高考',
      targetDate: '',
      tasks: [],
      dailyQuote: ''
    };

    // 触摸相关
    let touchStartX = 0;
    let touchEndX = 0;
    let swipedTaskId = null;

    // ==================== 初始化 ====================
    function init() {
      // 设置默认日期
      const nextYear = new Date().getFullYear() + 1;
      const defaultDate = `${nextYear}-06-07`;

      // 读取本地存储
      const savedName = localStorage.getItem('targetName');
      const savedDate = localStorage.getItem('targetDate');
      const savedTasks = localStorage.getItem('dailyTasks');
      const savedQuote = localStorage.getItem('dailyQuote');
      const savedQuoteDate = localStorage.getItem('quoteDate');

      // 设置数据
      data.targetName = savedName || '高考';
      data.targetDate = savedDate || defaultDate;
      data.tasks = savedTasks ? JSON.parse(savedTasks) : [
        { id: 1, text: '背诵英语单词 50 个', completed: false },
        { id: 2, text: '完成数学练习一套', completed: false },
        { id: 3, text: '阅读课外书 30 分钟', completed: true }
      ];

      // 设置语录
      const today = new Date().toDateString();
      if (savedQuote && savedQuoteDate === today) {
        data.dailyQuote = savedQuote;
      } else {
        data.dailyQuote = getRandomQuote();
        localStorage.setItem('dailyQuote', data.dailyQuote);
        localStorage.setItem('quoteDate', today);
      }

      // 更新UI
      updateUI();
      calculateDays();
    }

    // ==================== 计算剩余天数 ====================
    function calculateDays() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const target = new Date(data.targetDate);
      target.setHours(0, 0, 0, 0);

      const diffTime = target - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      document.getElementById('daysLeft').textContent = diffDays;
      document.getElementById('daysNumber').textContent = diffDays;
    }

    // ==================== 更新UI ====================
    function updateUI() {
      // 更新目标名称
      document.getElementById('targetName').textContent = data.targetName;

      // 更新任务列表
      renderTasks();

      // 更新进度
      const completedCount = data.tasks.filter(t => t.completed).length;
      document.getElementById('taskProgress').textContent = `${completedCount}/${data.tasks.length} 完成`;

      // 更新语录
      document.getElementById('dailyQuote').textContent = `"${data.dailyQuote}"`;
    }

    // ==================== 渲染任务列表 ====================
    function renderTasks() {
      const taskList = document.getElementById('taskList');
      
      if (data.tasks.length === 0) {
        taskList.innerHTML = '<div class="empty-tips">还没有任务，点击下方添加吧！</div>';
        return;
      }

      taskList.innerHTML = data.tasks.map(task => `
        <div 
          class="task-item-wrapper"
          ontouchstart="touchStart(event, ${task.id})"
          ontouchmove="touchMove(event)"
          ontouchend="touchEnd(${task.id})"
        >
          <div class="delete-btn ${swipedTaskId === task.id ? 'show' : ''}" onclick="deleteTask(${task.id})">
            <span class="delete-icon">🗑️</span>
          </div>
          <div class="task-item ${swipedTaskId === task.id ? 'swiped' : ''} ${task.completed ? 'completed' : ''}">
            <div class="checkbox ${task.completed ? 'checked' : ''}" onclick="toggleTask(${task.id})">
              ${task.completed ? '<span class="check-icon">✓</span>' : ''}
            </div>
            <span class="task-text">${task.text}</span>
          </div>
        </div>
      `).join('');
    }

    // ==================== 倒计时编辑 ====================
    function showEditModal() {
      document.getElementById('editNameInput').value = data.targetName;
      document.getElementById('editDateInput').value = data.targetDate;
      document.getElementById('editModal').style.display = 'flex';
    }

    function cancelEdit() {
      document.getElementById('editModal').style.display = 'none';
    }

    function saveTarget() {
      const name = document.getElementById('editNameInput').value.trim();
      const date = document.getElementById('editDateInput').value;

      if (!name) {
        showToast('请输入目标名称');
        return;
      }

      if (!date) {
        showToast('请选择目标日期');
        return;
      }

      data.targetName = name;
      data.targetDate = date;

      // 保存到本地存储
      localStorage.setItem('targetName', name);
      localStorage.setItem('targetDate', date);

      // 更新UI
      updateUI();
      calculateDays();
      cancelEdit();

      showToast('保存成功');
    }

    // ==================== 任务操作 ====================
    function toggleTask(id) {
      data.tasks = data.tasks.map(task => {
        if (task.id === id) {
          return { ...task, completed: !task.completed };
        }
        return task;
      });

      // 保存到本地存储
      localStorage.setItem('dailyTasks', JSON.stringify(data.tasks));

      // 更新UI
      updateUI();
    }

    function showAddInput() {
      document.getElementById('addTaskForm').style.display = 'block';
      document.getElementById('addTaskBtn').style.display = 'none';
      document.getElementById('newTaskInput').focus();
    }

    function cancelAdd() {
      document.getElementById('addTaskForm').style.display = 'none';
      document.getElementById('addTaskBtn').style.display = 'flex';
      document.getElementById('newTaskInput').value = '';
    }

    function addTask() {
      const input = document.getElementById('newTaskInput');
      const text = input.value.trim();

      if (!text) {
        showToast('请输入任务内容');
        return;
      }

      data.tasks.push({
        id: Date.now(),
        text: text,
        completed: false
      });

      // 保存到本地存储
      localStorage.setItem('dailyTasks', JSON.stringify(data.tasks));

      // 更新UI
      updateUI();
      cancelAdd();

      showToast('添加成功');
    }

    function deleteTask(id) {
      data.tasks = data.tasks.filter(task => task.id !== id);
      swipedTaskId = null;

      // 保存到本地存储
      localStorage.setItem('dailyTasks', JSON.stringify(data.tasks));

      // 更新UI
      updateUI();

      showToast('删除成功');
    }

    // ==================== 左滑删除 ====================
    function touchStart(e, id) {
      touchStartX = e.touches[0].clientX;
      swipedTaskId = null;
    }

    function touchMove(e) {
      touchEndX = e.touches[0].clientX;
    }

    function touchEnd(id) {
      if (!touchStartX || !touchEndX) return;

      const distance = touchStartX - touchEndX;
      if (distance > 50) {
        swipedTaskId = id;
        renderTasks();
      }

      touchStartX = 0;
      touchEndX = 0;
    }

    // ==================== 语录相关 ====================
    function getRandomQuote(currentQuote) {
      let newQuote = quotes[Math.floor(Math.random() * quotes.length)];
      while (newQuote === currentQuote && quotes.length > 1) {
        newQuote = quotes[Math.floor(Math.random() * quotes.length)];
      }
      return newQuote;
    }

    function refreshQuote() {
      data.dailyQuote = getRandomQuote(data.dailyQuote);

      // 保存到本地存储
      localStorage.setItem('dailyQuote', data.dailyQuote);
      localStorage.setItem('quoteDate', new Date().toDateString());

      // 更新UI
      document.getElementById('dailyQuote').textContent = `"${data.dailyQuote}"`;

      showToast('已切换');
    }

    // ==================== Toast提示 ====================
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    // ==================== 页面加载完成后初始化 ====================
    document.addEventListener('DOMContentLoaded', init);

    // ==================== 每分钟更新一次倒计时 ====================
    setInterval(calculateDays, 60000);
  </script>
</body>
</html>
