<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面试江湖 · 首页 - AI面试模拟平台</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <style>
        :root {
            --primary: #6d28d9;
            --primary-dark: #5b21b6;
            --secondary: #10b981;
            --dark: #0f172a;
            --light: #f8fafc;
            --muted: #64748b;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--dark);
            color: var(--light);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* 导航栏 */
        .navbar {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .nav-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        
        .logo-icon {
            font-size: 28px;
            color: var(--primary);
        }
        
        .logo-text {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(90deg, #6d28d9, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .nav-links {
            display: flex;
            gap: 32px;
        }
        
        .nav-link {
            color: var(--muted);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .nav-link:hover {
            color: var(--light);
        }
        
        /* 英雄区域 */
        .hero {
            padding: 100px 0 80px;
            position: relative;
            overflow: hidden;
        }
        
        .hero-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(109, 40, 217, 0.15), transparent 70%);
            z-index: -1;
        }
        
        .hero-content {
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .hero-title {
            font-size: 60px;
            font-weight: 900;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #6d28d9, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .hero-subtitle {
            font-size: 20px;
            color: var(--muted);
            margin-bottom: 40px;
        }
        
        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 48px;
            margin-top: 60px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-size: 40px;
            font-weight: 800;
            color: var(--primary);
        }
        
        .stat-label {
            font-size: 14px;
            color: var(--muted);
            margin-top: 8px;
        }
        
        /* 按钮 */
        .btn {
            display: inline-block;
            padding: 16px 32px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 10px 30px rgba(109, 40, 217, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(109, 40, 217, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .btn-lg {
            padding: 20px 48px;
            font-size: 18px;
        }
        
        .btn-group {
            display: flex;
            gap: 16px;
            justify-content: center;
        }
        
        @media (max-width: 768px) {
            .btn-group {
                flex-direction: column;
            }
            
            .hero-title {
                font-size: 40px;
            }
            
            .hero-subtitle {
                font-size: 16px;
            }
            
            .hero-stats {
                gap: 24px;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="nav-logo">
                <span class="logo-icon">🗡️</span>
                <span class="logo-text">面试江湖</span>
            </a>
            
            <div class="nav-links">
                <a href="pages/identity.html" class="nav-link">身份卡</a>
                <a href="pages/market.html" class="nav-link">公司集市</a>
                <a href="pages/growth.html" class="nav-link">成长档案</a>
                <a href="pages/resume-advice.html" class="nav-link">简历建议</a>
            </div>
        </div>
    </nav>

    <!-- 英雄区域 -->
    <section class="hero">
        <div class="hero-bg"></div>
        <div class="container hero-content">
            <h1 class="hero-title">面试江湖 · AI面试模拟平台</h1>
            <p class="hero-subtitle">挑战15家顶尖科技公司AI面试官，提升你的面试技能与自信</p>
            
            <div class="btn-group">
                <a href="pages/identity.html" class="btn btn-primary btn-lg">
                    <span style="display: flex; align-items: center; gap: 8px;">
                        <span>🎯</span>
                        <span>创建身份卡</span>
                    </span>
                </a>
                <a href="pages/market.html" class="btn btn-secondary btn-lg">
                    <span style="display: flex; align-items: center; gap: 8px;">
                        <span>🚀</span>
                        <span>直接开始挑战</span>
                    </span>
                </a>
            </div>
            
            <div class="hero-stats">
                <div class="stat-item">
                    <div class="stat-number">15</div>
                    <div class="stat-label">科技公司</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">AI</div>
                    <div class="stat-label">智能面试官</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">360°</div>
                    <div class="stat-label">全方位评估</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">免费</div>
                    <div class="stat-label">随时随地练习</div>
                </div>
            </div>
        </div>
    </section>

    <script>
        // 简单的交互效果
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('mouseenter', () => {
                link.style.transform = 'translateY(-2px)';
            });
            link.addEventListener('mouseleave', () => {
                link.style.transform = 'translateY(0)';
            });
        });
    </script>
</body>
</html>
