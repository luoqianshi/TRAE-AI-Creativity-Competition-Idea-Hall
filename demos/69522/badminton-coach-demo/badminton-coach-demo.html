function AICoachScreen() {
  const [stage, setStage] = React.useState('idle');
  const [fileType, setFileType] = React.useState('video');
  const [progress, setProgress] = React.useState(0);
  const [analyzeStep, setAnalyzeStep] = React.useState('');
  const timerRef = React.useRef(null);

  const handleSelectFile = (type) => { setFileType(type); setStage('selected'); };

  const startAnalysis = () => {
    setStage('analyzing'); setProgress(0);
    const steps = ['正在上传文件...', '检测人体骨骼关键点...', '分析动作轨迹...', '对比中羽3级标准动作模型...', '生成改进建议...'];
    let stepIdx = 0;
    setAnalyzeStep(steps[0]);
    let prog = 0;
    timerRef.current = setInterval(() => {
      prog += 2 + Math.random() * 4;
      if (prog >= 100) {
        prog = 100; clearInterval(timerRef.current);
        setTimeout(() => setStage('results'), 400);
      }
      setProgress(Math.min(prog, 100));
      const newStepIdx = Math.min(Math.floor(prog / 20), steps.length - 1);
      if (newStepIdx !== stepIdx) { stepIdx = newStepIdx; setAnalyzeStep(steps[stepIdx]); }
    }, 150);
  };

  const reset = () => {
    if (timerRef.current) clearInterval(timerRef.current);
    setStage('idle'); setProgress(0);
  };

  React.useEffect(() => { return () => { if (timerRef.current) clearInterval(timerRef.current); }; }, []);

  if (stage === 'idle') {
    return (
      <div className="app-screen">
        <div className="app-content">
          <div className="coach-header">

// ========== App Phone ==========
function AppPhoneFixed({ initialTab = 'plan' }) {
  const [tab, setTab] = React.useState(initialTab);
  const [teachDetail, setTeachDetail] = React.useState(false);

  const handleTabChange = (newTab) => {
    setTab(newTab);
    if (newTab !== 'teach') setTeachDetail(false);
  };

  let screen;
  if (tab === 'plan') screen = <TrainingPlanScreen />;
  else if (tab === 'teach') screen = (
    <ActionTeachingScreen
      detail={teachDetail}
      onBack={() => setTeachDetail(false)}
      onSelectTech={() => setTeachDetail(true)}
    />
  );
  else if (tab === 'coach') screen = <AICoachScreen />;
  else if (tab === 'level') screen = <LevelSystemScreen />;
  else if (tab === 'profile') screen = <ProfileScreen />;

  return (
    <IosFrame time="9:41" battery={85}>
      <div style={{ width: '100%', height: '100%', position: 'relative' }}>
        {screen}
        <TabBar active={tab} onChange={handleTabChange} />
      </div>
    </IosFrame>
  );
}

            <div className="fs-title">等级标准报告</div>
            <div className="fs-desc">评分对标等级达标线 + 逐项反馈 + 冲刺该等级的专项训练建议</div>
          </div>
        </div>
      </div>

      <div className="phones-row">
        {phones.map((p, i) => (
          <div key={p.id}>
            <div className="phone-label">
              <span className="num">{i + 1}</span>
              {p.label}
            </div>
            <AppPhoneFixed initialTab={p.initial} />
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
